# Lance Recallio « comme en production », à partir des images Docker construites localement.
# Pour développer, préférer `./mvnw quarkus:dev` et `npm run dev` (voir README).
#
#   docker compose -f infra/compose.yaml up --build
#
# Front : http://localhost:3000 · Keycloak : http://localhost:8180 (admin / admin)
# Les mots de passe ci-dessous sont des valeurs de développement local, jamais de production.

name: recallio

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: recallio
      POSTGRES_USER: recallio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recallio}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallio -d recallio"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Le navigateur voit Keycloak sur localhost:8180 (émetteur des jetons) ;
      # le backend l'appelle en interne sur keycloak:8080 (clés de signature).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/recallio-realm.json:/opt/keycloak/data/import/recallio-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recallio
      DB_USERNAME: recallio
      DB_PASSWORD: ${POSTGRES_PASSWORD:-recallio}
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/recallio
      # Importe tous les documents de référence et tous les dossiers de sujet au démarrage (idempotent).
      RECALLIO_CONTENT_IMPORT_ON_STARTUP: "true"
      RECALLIO_CONTENT_SOURCE_DIRECTORY: /content/source
      RECALLIO_CONTENT_SUBJECTS_DIRECTORY: /content
      # Les exercices de code s'exécutent dans le runner (ADR 0030), joint sur le réseau interne avec un jeton partagé.
      RECALLIO_RUNNER_URL: http://runner:8090
      RECALLIO_RUNNER_TOKEN: ${RECALLIO_RUNNER_TOKEN:-dev-token-du-runner-a-ne-jamais-deployer}
    volumes:
      - ../content:/content:ro
    depends_on:
      runner:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Construisent les images du bac à sable, une par langage, que le runner lance sur le Docker de l'hôte ; ces services
  # s'arrêtent aussitôt.
  sandbox:
    build: ../sandbox/java
    image: recallio-sandbox-java
    restart: "no"

  sandbox-go:
    build: ../sandbox/go
    image: recallio-sandbox-go
    restart: "no"

  sandbox-cpp:
    build: ../sandbox/cpp
    image: recallio-sandbox-cpp
    restart: "no"

  # Exécute le code des exercices dans des conteneurs jetables (ADR 0030). Il est le seul à accéder au socket Docker,
  # ce qui vaut des droits root sur l'hôte, et n'est joint que par le backend : aucun port publié.
  runner:
    build: ../runner
    environment:
      RECALLIO_RUNNER_TOKEN: ${RECALLIO_RUNNER_TOKEN:-dev-token-du-runner-a-ne-jamais-deployer}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /q/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      sandbox:
        condition: service_completed_successfully
      sandbox-go:
        condition: service_completed_successfully
      sandbox-cpp:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      # Le Keycloak local, vu du navigateur : la seule origine tierce de la Content-Security-Policy (ADR 0054).
      OIDC_ORIGIN: http://localhost:8180
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
