# Le thème de connexion de Recallio (ADR 0075) : les pages que Keycloak sert pour se connecter, s'inscrire et
# retrouver son mot de passe, à l'allure du design system « Rico » (ADR 0058).
#
# Il hérite du thème de connexion par défaut de Keycloak 26 (keycloak.v2, PatternFly 5) et n'en recopie aucun gabarit de
# page : il change par une feuille de style, des messages et ces propriétés. Le seul gabarit est footer.ftl, le pied de
# page que le thème parent laisse vide pour cela.
parent=keycloak.v2
import=common/keycloak

# La feuille du parent, puis la nôtre, qui la surcharge. Cette propriété remplace celle du parent : sans css/styles.css
# ici, la mise en page du parent disparaîtrait.
styles=css/styles.css css/recallio.css

# L'application est en français seulement, comme le royaume.
locales=fr

# L'origine publique du site, sans barre finale : celle des liens vers les pages légales (ADR 0074). Elle vient de
# l'environnement du conteneur, où le compose la pose ; rien n'est écrit en dur. Sans elle, footer.ftl n'affiche aucun
# lien plutôt qu'un lien cassé.
recallioPublicOrigin=${env.PUBLIC_ORIGIN}

# L'icône de l'onglet : celle de l'application (frontend/public/favicon.svg, recopiée dans resources/img/).
favIcon=img/favicon.svg
favIconType=image/svg+xml
