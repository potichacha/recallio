# Les textes du thème de connexion de Recallio (ADR 0075), en français, au tutoiement, comme l'application.
#
# Ce fichier ne redonne que les messages des pages qu'un utilisateur de Recallio peut voir (connexion, inscription, mot
# de passe oublié, vérification de l'adresse, nouveau mot de passe, suppression du compte, information, erreur, page
# expirée, déconnexion) : tout autre message reste celui du thème parent. Le fichier est en UTF-8, comme ceux de
# Keycloak. L'apostrophe est la typographique (’), jamais la droite : Keycloak passe ces textes à MessageFormat, qui
# donne un sens à l'apostrophe droite.

