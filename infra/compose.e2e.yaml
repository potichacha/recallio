# Surcharge pour les parcours de bout en bout (e2e/) : à combiner avec compose.yaml.
#
#   docker compose -p recallio-e2e -f infra/compose.yaml -f infra/compose.e2e.yaml up --build --wait
#
# Le nom de projet distinct donne une base neuve, séparée de celle de `docker compose up` ;
# `down -v` la supprime après les tests.

services:
  backend:
    environment:
      # Objectif atteignable en quelques cartes : le parcours « streak » reste court.
      RECALLIO_GAMIFICATION_DAILY_GOAL: "3"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  frontend:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
