# Le relais vers le backend, commun aux locations de l'API : elles ne diffèrent que par leur limite de débit. Le
# proxy_pass reste dans le gabarit, qui connaît l'adresse du backend.
include /etc/nginx/snippets/security-headers.conf;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Une salle d'attente peut rester silencieuse plusieurs minutes.
proxy_read_timeout 1h;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
