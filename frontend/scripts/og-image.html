<!doctype html>
<!--
  La source de l'image de partage, public/og-image.png (ADR 0065) : l'aperçu d'un lien vers Recallio sur WhatsApp,
  LinkedIn ou Slack. 1200 × 630 px, moins de 200 Ko, dans l'identité « Rico » (ADR 0058) : Rico tel que le dessine
  src/components/Rico.tsx, humeur « cheering », Nunito, et les tokens du thème clair de src/index.css. Ni dégradé ni
  émoji. La phrase est aussi dans og:image:alt (index.html) : changer l'une, c'est changer l'autre.

  Pour la refaire, depuis frontend/, après npm install (Nunito vient de node_modules), dans Git Bash :

    msedge --headless --disable-gpu --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot="$(pwd -W)/public/og-image.png" "file:///$(pwd -W)/scripts/og-image.html"

  msedge est dans « C:\Program Files (x86)\Microsoft\Edge\Application » ; ailleurs, chrome ou chromium fait de même,
  avec $PWD au lieu de $(pwd -W). Regarder ensuite l'image produite, et vérifier son poids.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Image de partage de Recallio</title>
    <style>
      @font-face {
        font-family: 'Nunito Variable';
        font-weight: 200 1000;
        src: url('../node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2')
          format('woff2');
      }

      /* Les tokens du thème clair, repris de src/index.css. */
      :root {
        --canvas: #f6f4ff;
        --surface: #ffffff;
        --line: #e3def7;
        --ink: #1b1533;
        --brand: #5b3df5;
        --brand-strong: #4326d9;
        --brand-soft: #ede9ff;
        --brand-press: #2e1aa0;
        --on-brand: #ffffff;
        --sun: #ffc531;
        --sun-line: #f0d27a;
        --on-sun: #1b1533;
      }

      html,
      body {
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Nunito Variable', sans-serif;
      }

      /* Une carte blanche à bord épais en dessous, comme celles de l'application. */
      .card {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 52px;
        width: 1104px;
        height: 510px;
        padding: 0 64px;
        border: 3px solid var(--line);
        border-radius: 48px;
        background: var(--surface);
        box-shadow: 0 12px 0 0 var(--line);
      }

      .rico {
        display: grid;
        flex: none;
        place-items: center;
        width: 290px;
        height: 290px;
        border-radius: 50%;
        background: var(--brand-soft);
      }

      .rico .body {
        fill: var(--brand);
      }

      .rico .eye,
      .rico .mouth {
        fill: var(--on-brand);
      }

      .rico .mouth {
        stroke: var(--on-brand);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .rico .pupil {
        fill: var(--brand-press);
      }

      .name {
        margin: 0;
        color: var(--brand);
        font-size: 104px;
        font-weight: 900;
        line-height: 1;
      }

      .tagline {
        margin: 22px 0 0;
        font-size: 50px;
        font-weight: 800;
        line-height: 1.15;
      }

      /* L'habitude, sur sa propre ligne. */
      .tagline .daily {
        display: block;
        color: var(--brand-strong);
      }

      .badges {
        display: flex;
        gap: 16px;
        margin-top: 34px;
      }

      .badge {
        padding: 8px 22px;
        border-radius: 999px;
        font-size: 26px;
        font-weight: 800;
      }

      .badge.sun {
        background: var(--sun);
        box-shadow: 0 4px 0 0 var(--sun-line);
        color: var(--on-sun);
      }

      .badge.brand {
        background: var(--brand-soft);
        box-shadow: 0 4px 0 0 var(--line);
        color: var(--brand-strong);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rico">
        <svg width="230" height="230" viewBox="0 0 72 72" aria-hidden="true">
          <rect class="body" x="6" y="10" width="60" height="58" rx="20" />
          <path class="body" d="M18 10l6-9 7 9M41 10l7-9 6 9" />
          <circle class="eye" cx="26" cy="34" r="8" />
          <circle class="eye" cx="46" cy="34" r="8" />
          <circle class="pupil" cx="27.5" cy="35.5" r="3.6" />
          <circle class="pupil" cx="47.5" cy="35.5" r="3.6" />
          <path class="mouth" d="M27 48c3 9 15 9 18 0z" />
        </svg>
      </div>
      <div>
        <p class="name">Recallio</p>
        <p class="tagline">
          Révise tes entretiens techniques, <span class="daily">un peu chaque jour.</span>
        </p>
        <div class="badges">
          <span class="badge sun">Questions corrigées</span>
          <span class="badge brand">Répétition espacée</span>
        </div>
      </div>
    </div>
  </body>
</html>
