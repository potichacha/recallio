<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b3df5" />
    <meta
      name="description"
      content="Révise tes entretiens techniques chaque jour, par répétition espacée."
    />
    <title>Recallio</title>
    <!--
      L'adresse du fournisseur OIDC, que nginx met au démarrage du conteneur (OIDC_AUTHORITY) : une seule image pour
      tous les environnements (ADR 0069). Sans nginx (npm run dev), le marqueur reste, et la PWA prend
      VITE_OIDC_AUTHORITY ou le Keycloak local (src/auth/oidcAuthority.ts).
    -->
    <meta name="recallio-oidc-authority" content="__OIDC_AUTHORITY__" />
    <!--
      Les erreurs dans Sentry (ADR 0070) : nginx met SENTRY_DSN, SENTRY_ENVIRONMENT et SENTRY_RELEASE au démarrage du
      conteneur. Sans DSN (vide, ou le marqueur avec npm run dev), la PWA ne télécharge ni n'envoie rien
      (src/monitoring/).
    -->
    <meta name="recallio-sentry-dsn" content="__SENTRY_DSN__" />
    <meta name="recallio-sentry-environment" content="__SENTRY_ENVIRONMENT__" />
    <meta name="recallio-sentry-release" content="__SENTRY_RELEASE__" />
    <!--
      L'aperçu d'un lien partagé (WhatsApp, LinkedIn, Slack...), lu sans exécuter le JavaScript : les mêmes balises
      pour toutes les pages (ADR 0065). L'adresse de l'image doit être absolue : nginx y met l'origine publique du site
      (PUBLIC_ORIGIN).
      Ni og:url ni <link rel="canonical"> : fixes, ils diraient que toutes les pages sont la même, et un moteur ne
      garderait que l'accueil.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recallio" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Recallio : révise tes entretiens techniques" />
    <meta
      property="og:description"
      content="Des cartes corrigées tout de suite, un Tour pour apprendre un langage en codant, et la répétition espacée pour retenir. Un peu chaque jour."
    />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rico, la mascotte de Recallio, à côté de la phrase « Révise tes entretiens techniques, un peu chaque jour »."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Avant le premier affichage : le thème choisi, sans éclair de thème clair (ADR 0058). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
