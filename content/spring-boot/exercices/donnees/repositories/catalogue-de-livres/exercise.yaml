statement: |-
  `LivreRepository` hérite de `JpaRepository<Livre, Long>` : il sait déjà enregistrer, chercher, compter et supprimer.
  Écris les méthodes de `Catalogue` **en utilisant les méthodes qu'il hérite**, sans écrire une seule requête :

  - `ajouter(titre, auteur, annee)` : enregistre un nouveau livre et renvoie son identifiant ;
  - `trouver(id)` : renvoie le livre, ou lève `LivreIntrouvableException` s'il n'existe pas ;
  - `tousParTitre()` : tous les livres, rangés par titre ;
  - `retirer(id)` : supprime le livre, ou lève `LivreIntrouvableException` s'il n'existe pas ;
  - `nombre()` : le nombre de livres du catalogue.

  Les tests utilisent `@DataJpaTest` : une base H2 en mémoire, vidée à chaque test.
explanation: |-
  Chaque méthode délègue à une méthode héritée de `JpaRepository` :

  - `save` renvoie l'entité enregistrée, dont l'identifiant vient d'être généré : `livres.save(livre).getId()` ;
  - `findById` renvoie un `Optional` : `orElseThrow(() -> new LivreIntrouvableException(id))` le transforme en
    exception métier, qu'un gestionnaire d'erreurs traduira en 404 ;
  - `findAll(Sort.by("titre"))` demande le tri à la base (`order by titre`) au lieu de trier en mémoire ;
  - `deleteById` **ne signale rien** quand l'identifiant n'existe pas (depuis Spring Data 3) : il faut tester
    `existsById` d'abord pour lever l'exception ;
  - `count` envoie un `select count(*)`, sans charger les livres.
