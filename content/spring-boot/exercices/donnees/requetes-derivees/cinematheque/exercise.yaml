statement: |-
  La cinémathèque veut interroger ses films. Écris les méthodes de `Cinematheque` en **déclarant des requêtes
  dérivées** dans `FilmRepository` : une méthode dont le nom suffit à Spring Data pour écrire la requête. Pas de
  `@Query`, et pas de `findAll()` filtré en Java : la base fait le travail.

  - `filmsDe(realisateur)` : les films de ce réalisateur, du plus ancien au plus récent ;
  - `sortisEntre(debut, fin)` : les films sortis entre ces deux années, **bornes comprises** ;
  - `rechercher(mot)` : les films dont le titre contient ce mot, **sans tenir compte de la casse** ;
  - `lesTroisPlusLongs()` : les trois films les plus longs, du plus long au plus court ;
  - `existe(titre)` : vrai si un film porte exactement ce titre ;
  - `nombreDe(genre)` : le nombre de films de ce genre.

  Les tests utilisent `@DataJpaTest` sur une base H2 en mémoire.
explanation: |-
  Une requête dérivée se lit comme une phrase : un **sujet** (`find...By`, `exists...By`, `count...By`, avec
  éventuellement `Top3`), des **critères** sur les propriétés de l'entité, puis un **tri** (`OrderBy...Asc/Desc`).

  ```java
  List<Film> findByRealisateurOrderByAnneeAsc(String realisateur);
  List<Film> findByAnneeBetween(int debut, int fin);
  List<Film> findByTitreContainingIgnoreCase(String mot);
  List<Film> findTop3ByOrderByDureeMinutesDesc();
  boolean existsByTitre(String titre);
  long countByGenre(String genre);
  ```

  `Between` produit un `between ? and ?` SQL, qui inclut les bornes. `Containing` entoure le paramètre de `%`, et
  `IgnoreCase` compare en majuscules des deux côtés. `existsBy` et `countBy` ne chargent aucune entité : la base
  répond par un booléen ou un nombre. Une faute de frappe dans un nom de propriété fait échouer le démarrage, avec un
  message du type « No property 'realisatuer' found for type 'Film' ».
