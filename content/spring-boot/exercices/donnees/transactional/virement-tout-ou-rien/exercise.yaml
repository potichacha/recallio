statement: |-
  La banque perd de l'argent : quand un virement échoue faute de provision, le compte cible a déjà été crédité. Et
  quand un lot de virements échoue au milieu, les premiers restent appliqués.

  Corrige `VirementService` pour que ses deux méthodes soient **tout ou rien** :

  - `virer(de, vers, montant)` : si le compte source n'a pas assez d'argent, `SoldeInsuffisantException` est levée,
    et **aucun** solde ne change ;
  - `virerLot(virements)` : si un seul virement du lot échoue, **aucun** virement du lot n'est appliqué.

  Les tests relisent les soldes en base après chaque appel. Ne change ni `Compte`, ni le repository.
explanation: |-
  Les deux méthodes reçoivent `@Transactional`. Une `SoldeInsuffisantException` hérite de `RuntimeException` : quand
  elle sort de la méthode, le proxy annule la transaction, crédit compris.

  Annoter seulement `virer` ne suffit pas pour le lot : `virerLot` l'appelle par `this.virer(...)`, un appel interne
  qui ne passe pas par le proxy. Sans annotation sur `virerLot`, chaque `save` validerait sa propre transaction.
  Avec elle, tout le lot partage une seule transaction, annulée au premier échec.

  Dans une transaction, les entités chargées sont gérées : les appels à `save` deviennent inutiles, le dirty checking
  écrit les soldes modifiés au commit. Les garder ne nuit pas.
