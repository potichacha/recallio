statement: |-
  `LivreController` expose le catalogue d'une librairie sous `/api/livres`. Ses tests ne démarrent que la couche
  web, avec `@WebMvcTest` : le `CatalogueService` y est remplacé par un mock (`@MockitoBean`), et `MockMvc` envoie
  les requêtes sans serveur.

  Le contrôleur répond toujours `200`, même quand rien ne va. Corrige-le pour que :

  - `GET /api/livres/{isbn}` renvoie le livre, ou **404** quand le catalogue ne le connaît pas ;
  - `POST /api/livres` ajoute le livre au catalogue, puis réponde **201** avec l'en-tête `Location` vers
    `/api/livres/{isbn}` et le livre dans le corps ;
  - un livre invalide (titre vide, ISBN qui n'a pas 13 chiffres : les contraintes sont déjà sur le record
    `Livre`) soit refusé avec **400**, sans jamais atteindre le catalogue.
explanation: |-
  ```java
  @GetMapping("/{isbn}")
  public ResponseEntity<Livre> lire(@PathVariable String isbn) {
      return ResponseEntity.of(catalogue.trouver(isbn));
  }

  @PostMapping
  public ResponseEntity<Livre> ajouter(@Valid @RequestBody Livre livre) {
      catalogue.ajouter(livre);
      return ResponseEntity.created(URI.create("/api/livres/" + livre.isbn())).body(livre);
  }
  ```
  Renvoyer `null` donne un `200` au corps vide : c'est `ResponseEntity` qui choisit le statut.
  `ResponseEntity.of(optional)` répond `200` avec le livre, ou `404` quand l'`Optional` est vide.

  Les contraintes du record ne s'appliquent que si quelqu'un les vérifie : `@Valid` devant `@RequestBody` lance
  la validation, et un corps invalide lève une `MethodArgumentNotValidException`, que Spring MVC traduit en
  `400` avant d'appeler la méthode. C'est ce que prouve `verify(catalogue, never()).ajouter(any())`.

  `ResponseEntity.created(uri)` pose le statut `201` et l'en-tête `Location`. `ServletUriComponentsBuilder`
  donnerait une adresse absolue (`http://localhost/api/livres/...`) : le test n'exige que la fin du chemin.

  Le test n'a démarré ni le service réel ni la base : `@WebMvcTest(LivreController.class)` ne charge que ce
  contrôleur et l'infrastructure de Spring MVC. Sans `@MockitoBean`, le contexte échouerait faute de
  `CatalogueService`.
