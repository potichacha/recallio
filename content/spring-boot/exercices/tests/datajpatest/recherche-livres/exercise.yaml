statement: |-
  La médiathèque range ses livres avec Spring Data JPA. Les tests de `LivreRepository` ne démarrent que la couche
  JPA, avec `@DataJpaTest`, sur une base H2 en mémoire : chacun remplit le catalogue avec `TestEntityManager`, et
  tout est annulé à la fin du test.

  Les méthodes du repository ne sont que des méthodes `default` qui lèvent une exception. Écris-les pour que
  Spring Data les implémente :

  - `findByIsbn(isbn)` : le livre de cet ISBN, ou un `Optional` vide ;
  - `findByAuteurOrderByAnneeAsc(auteur)` : les livres d'un auteur, du plus ancien au plus récent ;
  - `countByDisponibleTrue()` : le nombre de livres disponibles ;
  - `rechercherParTitre(mot)` : les livres dont le titre contient ce mot, **sans tenir compte de la casse**, rangés
    par titre (une requête JPQL avec `@Query`).

  Enfin, la base doit refuser deux livres de même ISBN : ajoute la contrainte à l'entité `Livre`.
explanation: |-
  ```java
  public interface LivreRepository extends JpaRepository<Livre, Long> {

      Optional<Livre> findByIsbn(String isbn);

      List<Livre> findByAuteurOrderByAnneeAsc(String auteur);

      long countByDisponibleTrue();

      @Query("select l from Livre l where lower(l.titre) like lower(concat('%', :mot, '%')) order by l.titre")
      List<Livre> rechercherParTitre(@Param("mot") String mot);
  }
  ```
  Spring Data appelle tel quel une méthode `default` : il ne dérive une requête que d'une méthode abstraite. Il
  lit alors son nom : `findBy` + `Isbn`, `findBy` + `Auteur` + `OrderBy` + `Annee` + `Asc`, `countBy` +
  `Disponible` + `True`. Une faute dans un nom de propriété fait échouer le démarrage du contexte, ce qui se voit
  dès le premier test.

  Pour la recherche, `lower` des deux côtés rend la comparaison insensible à la casse, et `concat('%', :mot, '%')`
  cherche le mot n'importe où dans le titre. `@Param` nomme le paramètre (le bac à sable compile aussi avec
  `-parameters`, qui suffirait).

  `@Column(unique = true)` ajoute la contrainte d'unicité au schéma que Hibernate crée pour le test. Le doublon
  n'est refusé qu'au moment où l'`INSERT` part vers la base : d'où `saveAndFlush`. Avec un simple `save`,
  l'insertion attendrait la fin de la transaction, qui est annulée, et le test ne verrait jamais l'erreur.
  Spring traduit l'erreur de la base en `DataIntegrityViolationException`.
