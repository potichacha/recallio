statement: |-
  `LivraisonService` lit trois propriétés avec `@Value` : les frais de livraison, le montant à partir duquel la
  livraison est gratuite, et le délai. Une faute de frappe dans une clé, un montant négatif ou un seuil oublié ne se
  voient qu'au moment où un client paie.

  Regroupe ces réglages dans le record `LivraisonProperties`, **une configuration typée et validée** :

  - lié au préfixe `boutique.livraison` (`frais`, `seuil-gratuite`, `delai`) ;
  - validé au démarrage : `frais` est obligatoire et jamais négatif, `seuil-gratuite` est obligatoire et strictement
    positif ;
  - `delai` vaut **deux jours** quand la propriété est absente ;
  - enregistré comme bean par un scan des classes de configuration sur `BoutiqueApplication`.

  Puis fais recevoir `LivraisonProperties` à `LivraisonService` par son constructeur, à la place des `@Value`.
explanation: |-
  ```java
  @ConfigurationProperties("boutique.livraison")
  @Validated
  public record LivraisonProperties(
          @NotNull @PositiveOrZero BigDecimal frais,
          @NotNull @Positive BigDecimal seuilGratuite,
          @DefaultValue("2d") Duration delai) {
  }
  ```
  Un record se lie par son constructeur : ses champs sont immuables. `seuilGratuite` correspond à la clé
  `seuil-gratuite` (la liaison souple accepte aussi `SEUIL_GRATUITE` dans une variable d'environnement), et
  `"3d"` se convertit en `Duration` de trois jours. `@DefaultValue` donne la valeur d'un paramètre absent.

  `@Validated` fait vérifier les contraintes de Jakarta Validation **au démarrage** : une configuration invalide
  arrête l'application avec un rapport clair (« Binding to target ... failed »), au lieu d'une erreur en production.

  `@ConfigurationPropertiesScan` sur la classe principale enregistre les records annotés ; sans lui (ou sans
  `@EnableConfigurationProperties(LivraisonProperties.class)`), aucun bean n'existe. Le service reçoit enfin un seul
  objet typé, facile à construire dans un test unitaire.
