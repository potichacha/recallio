statement: |-
  `CommandeService` passe une commande : il vérifie le stock, retire la quantité, puis note la commande dans le
  journal. Mais il **crée lui-même** son `Stock` et son `Journal` avec `new` : il travaille sur ses propres copies, et
  les beans `Stock` et `Journal` du conteneur, ceux que voit le reste de l'application, ne changent jamais.

  Fais-lui **recevoir ses deux dépendances par son constructeur**, pour que Spring lui injecte les beans partagés :

  - des champs `private final`, sans `new` ;
  - un seul constructeur, qui prend le `Stock` et le `Journal` (pas besoin d'`@Autowired` quand il est unique) ;
  - la logique de `commander` ne change pas : une commande supérieure au stock lève une `IllegalArgumentException`,
    sans rien retirer.
explanation: |-
  ```java
  @Service
  public class CommandeService {

      private final Stock stock;
      private final Journal journal;

      public CommandeService(Stock stock, Journal journal) {
          this.stock = stock;
          this.journal = journal;
      }
      ...
  }
  ```
  Avec `new`, la classe choisit et fabrique ses dépendances : Spring ne les connaît pas, et chaque service aurait sa
  propre copie du stock. Avec l'injection par constructeur, c'est le conteneur qui fournit les beans : tout le monde
  partage le même `Stock` (un singleton), et un test peut passer un faux journal sans toucher au code.

  Le constructeur rend les dépendances **obligatoires** (l'objet ne peut pas exister sans elles) et permet des champs
  `final`. Une classe qui n'a qu'un constructeur n'a pas besoin d'`@Autowired` : Spring l'utilise d'office.
