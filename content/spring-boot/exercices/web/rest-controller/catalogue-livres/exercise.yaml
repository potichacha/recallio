statement: |-
  Une librairie veut exposer son catalogue en REST. Le service `CatalogueService` est écrit ; il te reste le contrôleur
  `LivreController`, qui ne publie encore rien.

  Écris dans `LivreController` les trois points d'entrée de l'API, tous sous le préfixe `/api/livres` :

  - `GET /api/livres` : la liste de tous les livres (`catalogue.tous()`), en JSON ;
  - `GET /api/livres/{isbn}` : le livre de cet ISBN (`catalogue.trouver(isbn)`). Si le livre n'existe pas, le service
    lève `LivreIntrouvableException`, déjà annotée pour répondre 404 : tu n'as rien à faire de plus ;
  - `POST /api/livres` : ajoute le livre reçu en JSON dans le corps de la requête (`catalogue.ajouter(livre)`), et
    répond **201 Created** avec le livre ajouté.

  Les tests utilisent `@WebMvcTest` et `MockMvc` : ils simulent les requêtes HTTP sans démarrer de serveur, avec un
  `CatalogueService` simulé par Mockito.
explanation: |-
  `@RestController` fait de la classe un contrôleur dont chaque valeur de retour est écrite dans le corps de la réponse,
  convertie en JSON par Jackson : c'est `@Controller` plus `@ResponseBody`. `@RequestMapping("/api/livres")` sur la
  classe donne le préfixe commun ; chaque méthode précise le verbe avec `@GetMapping` ou `@PostMapping`, et la fin du
  chemin.

  ```java
  @GetMapping("/{isbn}")
  public Livre unLivre(@PathVariable String isbn) {
      return catalogue.trouver(isbn);
  }

  @PostMapping
  @ResponseStatus(HttpStatus.CREATED)
  public Livre ajouter(@RequestBody Livre livre) {
      return catalogue.ajouter(livre);
  }
  ```

  `@PathVariable` lit le segment `{isbn}` de l'URL ; `@RequestBody` demande à Jackson de construire le record `Livre` à
  partir du JSON reçu. Sans `@ResponseStatus(HttpStatus.CREATED)`, la création répondrait 200 : le statut par défaut
  d'une méthode qui se termine normalement. L'exception `LivreIntrouvableException` porte
  `@ResponseStatus(HttpStatus.NOT_FOUND)` : Spring MVC la traduit en 404 sans code dans le contrôleur.
