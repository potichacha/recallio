statement: |-
  `POST /api/inscriptions` inscrit un nouveau joueur. Aujourd'hui, le contrôleur accepte tout : un pseudo vide, un
  email sans arobase, un joueur de dix ans. Le service les enregistre sans broncher.

  Valide la requête avec Bean Validation, pour qu'une inscription invalide soit refusée par **400 Bad Request**, sans
  jamais atteindre le service :

  - `pseudo` : obligatoire, non vide, de 3 à 20 caractères ;
  - `email` : obligatoire, non vide, au format d'une adresse email ;
  - `age` : 16 ans au moins.

  Pose les contraintes sur les composants du record `Inscription`, puis demande à Spring de valider le corps de la
  requête dans `InscriptionController`.
explanation: |-
  Les contraintes se posent sur les composants du record, et `@Valid` sur le paramètre `@RequestBody` déclenche la
  validation avant l'appel de la méthode :

  ```java
  public record Inscription(
          @NotBlank @Size(min = 3, max = 20) String pseudo,
          @NotBlank @Email String email,
          @Min(16) int age) {}

  @PostMapping
  @ResponseStatus(HttpStatus.CREATED)
  public Inscrit inscrire(@Valid @RequestBody Inscription inscription) { ... }
  ```

  Si une contrainte échoue, Spring lève `MethodArgumentNotValidException`, que Spring MVC traduit en 400 : la méthode du
  contrôleur n'est pas appelée, et le service non plus. `@NotBlank` refuse `null`, la chaîne vide et les espaces seuls ;
  `@Size` et `@Email` acceptent `null`, d'où le `@NotBlank` à côté d'eux. Sans `@Valid`, les annotations du record ne
  sont que des décorations : personne ne les vérifie.
