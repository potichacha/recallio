statement: |-
  L'API d'une banque lit un compte (`GET /api/comptes/{numero}`) et exécute un virement (`POST /api/virements`). Le
  service lève deux exceptions métier, que personne ne rattrape : le client reçoit une erreur 500.

  Complète la classe `GestionnaireErreurs` pour traduire ces exceptions en réponses HTTP, **pour tous les
  contrôleurs** de l'application, avec un corps JSON de la forme du record `Erreur` (`code` et `message`) :

  | Exception | Statut | `code` |
  |---|---|---|
  | `CompteIntrouvableException` | 404 Not Found | `COMPTE_INTROUVABLE` |
  | `SoldeInsuffisantException` | 409 Conflict | `SOLDE_INSUFFISANT` |

  Le `message` est celui de l'exception. Ne modifie ni le contrôleur ni le service.
explanation: |-
  `@RestControllerAdvice` déclare des gestionnaires d'exceptions communs à tous les contrôleurs, dont la valeur de
  retour est écrite dans le corps de la réponse, en JSON. Chaque méthode `@ExceptionHandler` dit quelle exception elle
  traite ; `@ResponseStatus` fixe le statut :

  ```java
  @RestControllerAdvice
  public class GestionnaireErreurs {

      @ExceptionHandler(CompteIntrouvableException.class)
      @ResponseStatus(HttpStatus.NOT_FOUND)
      public Erreur compteIntrouvable(CompteIntrouvableException e) {
          return new Erreur("COMPTE_INTROUVABLE", e.getMessage());
      }

      @ExceptionHandler(SoldeInsuffisantException.class)
      @ResponseStatus(HttpStatus.CONFLICT)
      public Erreur soldeInsuffisant(SoldeInsuffisantException e) {
          return new Erreur("SOLDE_INSUFFISANT", e.getMessage());
      }
  }
  ```

  Renvoyer un `ResponseEntity<Erreur>` convient aussi : `ResponseEntity.status(HttpStatus.CONFLICT).body(...)`. Le
  contrôleur reste écrit pour le cas nominal, sans `try`/`catch`. `@WebMvcTest` charge les classes
  `@RestControllerAdvice` avec le contrôleur testé : les tests voient le gestionnaire. Le code stable (`code`) sert au
  client, qui ne doit pas analyser le texte du message.
