notion: questions-entretien
lesson: |-
  Une dizaine de questions sur Spring reviennent dans presque tous les entretiens Java. Elles vérifient que tu
  comprends **ce que fait le framework à ta place**, pas que tu connais toutes ses annotations. Pour chacune, la
  réponse attendue, en deux ou trois phrases.

  **« Quelle différence entre Spring et Spring Boot ? »**
  Spring Framework fournit le conteneur (injection de dépendances) et les modules : web, données, transactions.
  Spring Boot ne remplace rien : il **configure tout cela d'office**, par l'auto-configuration, les starters et un
  serveur embarqué, pour lancer une application avec `java -jar`.

  **« Qu'est-ce que l'inversion de contrôle ? L'injection de dépendances ? »**
  Ce n'est plus la classe qui crée ses dépendances : c'est le **conteneur** qui crée les objets et les relie.
  L'injection de dépendances en est la forme : la classe **reçoit** ce dont elle a besoin, de préférence par son
  constructeur. On gagne un couplage faible et des tests simples.

  **« Comment marche l'auto-configuration ? »**
  `@SpringBootApplication` contient `@EnableAutoConfiguration`. Spring Boot lit la liste de ses classes
  d'auto-configuration (`META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`) ;
  chacune est **conditionnelle** : `@ConditionalOnClass` (la bibliothèque est-elle là ?),
  `@ConditionalOnProperty`, `@ConditionalOnMissingBean` (l'application a-t-elle déjà défini le sien ?). Lancer avec
  `--debug` affiche le rapport des conditions.

  **« Que fait `@Transactional` ? »**
  Un **proxy** entoure le bean : il ouvre la transaction avant la méthode, la valide au retour, l'annule sur une
  exception non vérifiée. Les questions de relance : l'appel par `this` qui contourne le proxy, l'exception vérifiée
  qui ne provoque pas de rollback, la propagation `REQUIRED` par défaut.

  **« Quelle est la portée par défaut d'un bean ? »**
  **Singleton** : une instance par contexte, partagée par tous les threads. D'où la règle : un bean singleton n'a
  pas d'état modifiable propre à une requête. Les autres portées : `prototype` (une instance par injection),
  `request`, `session`.

  **« `@Component`, `@Service`, `@Repository`, `@Controller` ? »**
  Tous font de la classe un bean détecté par le scan. `@Service` et `@Controller` disent son rôle ;
  `@Repository` ajoute la **traduction des exceptions** de persistance en `DataAccessException` ; `@RestController`
  vaut `@Controller` plus `@ResponseBody` : la valeur de retour devient le corps de la réponse.

  **« `@Bean` ou `@Component` ? »**
  `@Component` sur une classe à soi, détectée par le scan. `@Bean` sur une méthode d'une classe `@Configuration`,
  pour une classe qu'on ne peut pas annoter (une bibliothèque) ou qui demande une construction particulière.

  **« Comment gères-tu les erreurs d'une API ? »**
  Des exceptions métier, traduites en un seul endroit par un `@RestControllerAdvice`, en `ProblemDetail` avec le bon
  statut HTTP.

  **« Comment testes-tu une application Spring Boot ? »**
  Des tests unitaires sans Spring pour la logique ; des **tranches** (`@WebMvcTest`, `@DataJpaTest`) pour une couche ;
  quelques `@SpringBootTest` pour l'ensemble, avec Testcontainers pour une vraie base.

  | Question | Le mot-clé de la réponse |
  |---|---|
  | Spring ou Spring Boot | auto-configuration, starters, serveur embarqué |
  | IoC, injection | le conteneur crée et relie les objets |
  | auto-configuration | conditions (`@ConditionalOn...`) |
  | `@Transactional` | proxy, rollback sur exception non vérifiée |
  | portée par défaut | singleton, donc sans état |
  | `@Repository` | traduction des exceptions |

  **La forme d'une bonne réponse** : une définition courte, le **mécanisme** (le proxy, les conditions), un exemple
  tiré de ton expérience, et le **piège** associé. Quand tu ne sais pas, dis-le, puis raisonne à voix haute à partir
  de ce que tu sais.

  **En entretien** : « Spring est un conteneur qui crée mes objets et leur injecte leurs dépendances ; Spring Boot le
  configure d'office, selon ce qu'il trouve dans le classpath. Ses annotations les plus utiles, comme
  `@Transactional`, passent par des proxies, ce qui explique leurs pièges. Et ses beans sont des singletons, donc sans
  état propre à une requête. »
cards:
  - key: spring-ou-boot
    format: course
    question: "Que répondre à « Quelle différence entre Spring et Spring Boot ? »"
    choices:
      - {text: "Spring fournit le conteneur et les modules ; Boot les configure d'office, avec starters et serveur embarqué", correct: true}
      - {text: "Spring Boot remplace Spring : une application Boot n'utilise plus du tout son conteneur", correct: false}
      - {text: "Spring sert aux applications web, Spring Boot aux traitements par lots et aux tâches planifiées", correct: false}
      - {text: "Spring Boot est l'édition commerciale de Spring, vendue avec un support aux entreprises", correct: false}
    answer: "Spring Boot s'appuie entièrement sur Spring Framework : il choisit des réglages par défaut, assemble les dépendances par les starters, et embarque le serveur web."
  - key: auto-configuration-fonctionnement
    format: course
    question: "Que répondre à « Comment fonctionne l'auto-configuration de Spring Boot ? »"
    choices:
      - {text: "Des configurations conditionnelles, appliquées selon le classpath, les propriétés et les beans déjà définis", correct: true}
      - {text: "Un fichier XML généré à la compilation, qui déclare d'avance tous les beans de l'application", correct: false}
      - {text: "Une analyse du code source au démarrage, qui devine les beans dont l'application a besoin", correct: false}
      - {text: "Un serveur de configuration distant, interrogé par l'application à chacun de ses démarrages", correct: false}
    answer: "Chaque classe d'auto-configuration porte des conditions (`@ConditionalOnClass`, `@ConditionalOnMissingBean`...). Un bean défini par l'application fait reculer celui de Spring Boot. `--debug` affiche le rapport des conditions."
  - key: transactional-fonctionnement
    format: course
    question: "Que répondre à « Que fait `@Transactional`, concrètement ? »"
    choices:
      - {text: "Un proxy ouvre la transaction avant la méthode, la valide au retour, l'annule sur une exception non vérifiée", correct: true}
      - {text: "Le compilateur insère des appels `begin` et `commit` dans le bytecode de la méthode annotée", correct: false}
      - {text: "La méthode s'exécute dans un thread à part, qui verrouille toutes les tables qu'elle lit", correct: false}
      - {text: "Hibernate note chaque appel dans un journal, rejoué automatiquement après une panne", correct: false}
    answer: "Le mécanisme du proxy explique les pièges que le recruteur demandera ensuite : l'appel par `this` qui l'évite, la méthode privée ignorée, l'exception vérifiée qui laisse valider."
  - key: portee-par-defaut
    format: course
    question: "Que répondre à « Quelle est la portée par défaut d'un bean, et qu'en déduis-tu ? »"
    choices:
      - {text: "Singleton : une instance partagée par tous les threads, donc sans état modifiable", correct: true}
      - {text: "Prototype : une instance par injection, donc libre de garder un état", correct: false}
      - {text: "Request : une instance par requête HTTP, donc sans souci de concurrence", correct: false}
      - {text: "Session : une instance par utilisateur, liée à son navigateur", correct: false}
    answer: "Une seule instance par contexte, utilisée en parallèle par toutes les requêtes. Des dépendances `final`, oui ; un compteur ou un utilisateur courant en champ, non."
  - key: vf-repository-traduction
    format: true-false
    question: "`@Repository` ajoute à `@Component` la traduction des exceptions de persistance en `DataAccessException`."
    truth: true
    answer: "Un post-processeur enveloppe les beans `@Repository` et convertit les exceptions propres à JPA ou JDBC en exceptions de Spring, les mêmes quelle que soit la technologie."
  - key: vf-restcontroller
    format: true-false
    question: "`@RestController` équivaut à `@Controller` plus `@ResponseBody` sur chaque méthode."
    truth: true
    answer: "C'est une annotation composée : la valeur renvoyée par chaque méthode devient le corps de la réponse, converti en JSON par Jackson, au lieu d'un nom de vue."
  - key: vf-singleton-par-thread
    format: true-false
    question: "Un bean de portée singleton est créé une fois par thread."
    truth: false
    answer: "Une fois par contexte Spring : la même instance sert tous les threads. C'est pour cela qu'il ne doit pas garder d'état propre à une requête."
  - key: vf-debug-conditions
    format: true-false
    question: "Lancer une application Spring Boot avec `--debug` affiche le rapport d'évaluation des conditions de l'auto-configuration."
    truth: true
    answer: "Le rapport liste les auto-configurations appliquées et écartées, avec la condition qui a décidé. C'est le premier outil quand un bean attendu manque, ou qu'un bean inattendu apparaît."
  - key: qcm-hors-springbootapplication
    format: multiple-choice
    question: "Laquelle de ces annotations `@SpringBootApplication` ne contient-elle pas ?"
    choices:
      - {text: "`@EnableScheduling`", correct: true}
      - {text: "`@ComponentScan`", correct: false}
      - {text: "`@EnableAutoConfiguration`", correct: false}
      - {text: "`@SpringBootConfiguration`", correct: false}
    answer: "`@SpringBootApplication` réunit `@SpringBootConfiguration` (une `@Configuration`), `@EnableAutoConfiguration` et `@ComponentScan`. Les tâches planifiées demandent d'ajouter `@EnableScheduling`."
  - key: qcm-bean-ou-component
    format: multiple-choice
    question: "On te demande quand préférer `@Bean` à `@Component`. Que réponds-tu ?"
    choices:
      - {text: "Pour une classe qu'on ne peut pas annoter, comme celle d'une bibliothèque", correct: true}
      - {text: "Pour un bean singleton, `@Component` ne créant que des prototypes", correct: false}
      - {text: "Pour le code de production, `@Component` étant réservé aux tests", correct: false}
      - {text: "Pour une classe sans constructeur, que `@Component` ne sait pas créer", correct: false}
    answer: "`@Bean` déclare le bean par une méthode d'une classe `@Configuration` : on y construit l'objet comme on veut, même s'il vient d'un jar. Les deux donnent un singleton par défaut."
  - key: qcm-liste-injections
    format: multiple-choice
    question: "En entretien, on te demande d'énumérer les façons d'injecter une dépendance avec Spring. Quelle liste est juste ?"
    choices:
      - {text: "Par constructeur, par setter, par champ", correct: true}
      - {text: "Par constructeur, par interface, par fabrique", correct: false}
      - {text: "Par héritage, par annotation, par fichier XML", correct: false}
      - {text: "Par nom, par type, par ordre de déclaration", correct: false}
    answer: "Le constructeur pour les dépendances obligatoires (le choix par défaut), le setter pour une dépendance facultative, le champ à éviter hors des tests."
  - key: qcm-mecanisme-commun
    format: multiple-choice
    question: "Quel mécanisme rend possibles `@Transactional`, `@Async` et `@Cacheable` ?"
    choices:
      - {text: "Un proxy, qui intercepte les appels venus des autres beans", correct: true}
      - {text: "Un agent Java, qui réécrit le bytecode au chargement des classes", correct: false}
      - {text: "Un processeur d'annotations, qui génère du code à la compilation", correct: false}
      - {text: "Un thread de fond, qui surveille l'appel des méthodes annotées", correct: false}
    answer: "Spring crée un proxy (JDK ou CGLIB) autour du bean, et l'injecte à sa place. Le proxy ajoute la transaction, le thread ou le cache, puis délègue à l'objet réel."
  - key: situation-inversion-controle
    format: scenario
    question: |-
      On te demande : « Qu'est-ce que l'inversion de contrôle ? » Laquelle de ces réponses est la meilleure ?
    choices:
      - {text: "Le conteneur crée les objets et fournit leurs dépendances ; la classe les reçoit sans les construire", correct: true}
      - {text: "Les classes filles contrôlent leurs parents, à l'inverse de l'héritage habituel en Java", correct: false}
      - {text: "L'application appelle le framework, qui lui rend la main à la fin de chaque requête HTTP", correct: false}
      - {text: "Le contrôleur appelle le service, qui rappelle à son tour le contrôleur pour lui répondre", correct: false}
    answer: |-
      Le contrôle de la création et de l'assemblage passe de la classe au conteneur. On complète par l'intérêt
      (couplage faible, doublures faciles en test) et un exemple : un service qui reçoit son repository par son
      constructeur.
  - key: situation-relance-appel-interne
    format: scenario
    question: |-
      Après ta réponse sur `@Transactional`, le recruteur relance : « Et si la méthode est appelée depuis la même
      classe ? » Que réponds-tu ?
    choices:
      - {text: "Que l'appel par `this` contourne le proxy : l'annotation est ignorée pour cet appel", correct: true}
      - {text: "Que la transaction est rejouée, car le proxy détecte et rattrape l'appel interne", correct: false}
      - {text: "Que Spring refuse de démarrer, car un appel interne vers `@Transactional` est interdit", correct: false}
      - {text: "Que la transaction passe en lecture seule, le temps de l'appel interne", correct: false}
    answer: |-
      La relance teste si tu as compris le proxy, pas seulement l'annotation. On ajoute les remèdes : annoter la
      méthode appelée de l'extérieur, ou déplacer la méthode dans un autre bean.
  - key: situation-sujet-inconnu
    format: scenario
    question: |-
      Le recruteur t'interroge sur Spring Batch, que tu n'as jamais utilisé. Quelle attitude est la meilleure ?
    choices:
      - {text: "Le dire, puis expliquer ce que tu en sais et comment tu l'aborderais sur un projet", correct: true}
      - {text: "Inventer une expérience, pour ne pas paraître moins compétent que les autres candidats", correct: false}
      - {text: "Répondre sur Spring Data à la place, en espérant qu'il ne remarque pas la différence", correct: false}
      - {text: "Refuser de répondre, puisque le sujet ne figurait pas dans l'offre d'emploi", correct: false}
    answer: |-
      L'honnêteté rassure, et le raisonnement compte plus que la mémoire : « des traitements par lots, découpés en
      étapes, qui reprennent après une panne ; je partirais de la documentation et d'un petit job d'essai ». Une
      expérience inventée se découvre à la première relance.
  - key: situation-tomcat-tout-seul
    format: scenario
    question: |-
      On te demande : « Pourquoi Spring Boot démarre-t-il un serveur Tomcat tout seul ? » Quelle réponse est la plus
      convaincante ?
    choices:
      - {text: "Le starter web met Tomcat dans le classpath, et une auto-configuration conditionnelle le démarre", correct: true}
      - {text: "Spring Boot embarque Tomcat dans toutes les applications, même celles qui n'ont rien de web", correct: false}
      - {text: "La JVM fournit un serveur HTTP intégré, que Spring Boot se contente de réutiliser", correct: false}
      - {text: "Maven génère un fichier `web.xml` à la compilation, que Tomcat lit au démarrage", correct: false}
    answer: |-
      La réponse montre le mécanisme général : une dépendance présente dans le classpath déclenche une
      auto-configuration (`@ConditionalOnClass`). Sans starter web, pas de serveur ; avec Jetty à la place de Tomcat,
      c'est Jetty qui démarre.
