notion: spring-face-autres
lesson: |-
  Spring Boot n'est pas seul. **Quarkus**, **Micronaut** et les serveurs **Jakarta EE** font le même métier : des
  applications Java, souvent des API REST et des microservices. En entretien, on te demande parfois de les comparer,
  surtout si l'entreprise hésite ou utilise l'un d'eux.

  **Ce qui les distingue : quand le travail est fait.** Spring Boot, au démarrage, parcourt le classpath, évalue les
  conditions de l'auto-configuration, lit les annotations par **réflexion** et crée ses **proxies**. C'est souple,
  mais cela coûte du temps de démarrage et de la mémoire. Quarkus et Micronaut déplacent ce travail **au build** :
  l'application démarre avec un plan déjà calculé.

  | | Spring Boot | Quarkus | Micronaut | Jakarta EE |
  |---|---|---|---|---|
  | Nature | framework | framework | framework | **spécifications**, plusieurs serveurs |
  | Injection | conteneur Spring, au démarrage | CDI (ArC), résolu au build | à la compilation, processeurs d'annotations | CDI, au déploiement |
  | Web | Spring MVC, WebFlux | Jakarta REST (Quarkus REST) | ses contrôleurs | Jakarta REST, Servlet |
  | Configuration | `@ConfigurationProperties` | `@ConfigMapping`, `@ConfigProperty` | `@ConfigurationProperties` | MicroProfile Config |
  | Image native | oui, par l'AOT de Spring | oui, dès l'origine | oui, dès l'origine | selon le serveur |
  | Atout | l'écosystème, la communauté | démarrage, mémoire, mode dev | démarrage, mémoire | standard, sans dépendre d'un éditeur |

  **Quarkus** (Red Hat) s'appuie sur des standards : CDI pour l'injection, Jakarta REST pour le web, Hibernate pour
  JPA, MicroProfile pour la santé et la configuration. Ses **extensions** préparent tout au build. Il se distingue
  par son **mode dev** (rechargement à chaud) et ses **Dev Services**, qui démarrent seuls une base dans un conteneur
  pendant le développement et les tests.

  **Micronaut** résout l'injection **à la compilation**, par des processeurs d'annotations : ni réflexion ni proxies
  à l'exécution. Ses annotations ressemblent beaucoup à celles de Spring.

  **Jakarta EE** est un ensemble de **spécifications** (CDI, Jakarta REST, Persistence, Bean Validation...), mises
  en œuvre par des serveurs d'applications comme WildFly, Open Liberty ou Payara. Spring Boot en utilise plusieurs
  (Servlet, Persistence, Validation), mais garde son propre conteneur.

  **Spring Boot a rattrapé une partie du retard** : l'AOT et les images natives GraalVM depuis Spring Boot 3, CDS
  pour démarrer plus vite sur la JVM, les threads virtuels. Son avantage reste son **écosystème** : Spring Data,
  Spring Security, Spring Batch, Spring Cloud, et le nombre de développeurs qui le connaissent.

  **Comment choisir.** Les compétences de l'équipe d'abord : changer de framework coûte cher. Puis le contexte :
  pour du *serverless* ou une mise à l'échelle rapide jusqu'à zéro instance, le démarrage et la mémoire comptent, et
  une image native (Quarkus, Micronaut ou Spring Boot) s'impose. Pour un service qui tourne en continu, l'écart pèse
  peu face à l'écosystème.

  **En entretien** : « Spring Boot fait son travail au démarrage, par réflexion et proxies ; Quarkus et Micronaut le
  font au build, d'où un démarrage plus rapide et moins de mémoire. Jakarta EE, lui, est un standard mis en œuvre par
  des serveurs. Je choisis d'abord selon l'équipe et l'écosystème, et l'image native quand le démarrage compte
  vraiment. »
cards:
  - key: quarkus-au-build
    format: course
    question: "Que fait Quarkus au build, que Spring Boot fait classiquement au démarrage ?"
    choices:
      - {text: "Il analyse les annotations et prépare l'injection et la configuration", correct: true}
      - {text: "Il compile le code Java en JavaScript, exécuté ensuite par Node.js", correct: false}
      - {text: "Il télécharge les dépendances que Spring Boot récupère au lancement", correct: false}
      - {text: "Il crée les tables de la base, que Spring Boot crée à chaque lancement", correct: false}
    answer: "Les extensions de Quarkus font au build ce que Spring fait au démarrage : lire les annotations, résoudre l'injection, préparer la configuration. L'application démarre avec un plan déjà calculé."
  - key: injection-micronaut
    format: course
    question: "Comment Micronaut résout-il l'injection de dépendances ?"
    choices:
      - {text: "À la compilation, par des processeurs d'annotations, sans réflexion", correct: true}
      - {text: "À l'exécution, par réflexion, comme le conteneur classique de Spring", correct: false}
      - {text: "Par un fichier XML qui liste chaque bean et ses dépendances", correct: false}
      - {text: "Par un registre de services distant, interrogé à chaque démarrage", correct: false}
    answer: "Le compilateur génère le code qui crée et relie les beans. Rien n'est découvert à l'exécution : démarrage rapide, mémoire réduite, et une image native plus simple à produire."
  - key: jakarta-ee-nature
    format: course
    question: "Qu'est-ce que Jakarta EE, face à Spring Boot ?"
    choices:
      - {text: "Un ensemble de spécifications (CDI, REST, Persistence...), mis en œuvre par plusieurs serveurs", correct: true}
      - {text: "Un framework concurrent, écrit par une seule entreprise avec sa propre implémentation", correct: false}
      - {text: "La version payante de Java SE, avec des bibliothèques réservées aux entreprises", correct: false}
      - {text: "Un serveur d'applications unique, qui ne sait exécuter que des fichiers WAR", correct: false}
    answer: "Un standard, et non un produit : WildFly, Open Liberty ou Payara l'implémentent. Spring Boot utilise certaines de ses spécifications, comme Servlet et Persistence."
  - key: atout-spring-boot
    format: course
    question: "Quel atout de Spring Boot ses concurrents lui reconnaissent-ils le plus souvent ?"
    choices:
      - {text: "Son écosystème et sa communauté : Data, Security, Batch, Cloud", correct: true}
      - {text: "Son démarrage, le plus rapide grâce à la réflexion au lancement", correct: false}
      - {text: "Sa mémoire, la plus faible à fonctionnalités égales", correct: false}
      - {text: "Son image native, que lui seul sait produire avec GraalVM", correct: false}
    answer: "Spring couvre presque tous les besoins, et beaucoup de développeurs le connaissent déjà. Sur le démarrage et la mémoire, Quarkus et Micronaut partent devant ; tous savent produire une image native."
  - key: vf-quarkus-cdi
    format: true-false
    question: "Quarkus s'appuie sur CDI, la spécification de Jakarta EE, pour l'injection de dépendances."
    truth: true
    answer: "Son implémentation, ArC, résout l'injection au build. On y écrit `@ApplicationScoped` et `@Inject` plutôt que `@Service` et un constructeur détecté par Spring."
  - key: vf-natif-reserve
    format: true-false
    question: "Spring Boot ne sait pas produire d'image native GraalVM : seuls Quarkus et Micronaut le peuvent."
    truth: false
    answer: "Spring Boot le fait depuis sa version 3, grâce à son traitement AOT, qui prépare au build ce que le démarrage faisait par réflexion."
  - key: vf-specifications-utilisees
    format: true-false
    question: "Une application Spring Boot utilise des spécifications de Jakarta EE, comme Servlet, Persistence et Bean Validation."
    truth: true
    answer: "Spring MVC tourne sur un conteneur de servlets, Spring Data JPA sur Jakarta Persistence (Hibernate), la validation sur Bean Validation. Seule l'injection reste propre à Spring."
  - key: vf-micronaut-reflexion
    format: true-false
    question: "Micronaut résout l'injection par réflexion au démarrage, comme Spring."
    truth: false
    answer: "C'est précisément ce qui le distingue : tout est résolu à la compilation, par des processeurs d'annotations."
  - key: qcm-cas-natif
    format: multiple-choice
    question: "Lequel de ces cas justifie le plus Quarkus ou une image native ?"
    choices:
      - {text: "Des fonctions *serverless* qui démarrent à chaque appel et doivent répondre vite", correct: true}
      - {text: "Une application interne lancée une fois par mois, sur un gros serveur dédié", correct: false}
      - {text: "Une équipe Spring expérimentée, qui maintient déjà vingt services Spring Boot", correct: false}
      - {text: "Un traitement par lots de nuit, qui tourne plusieurs heures d'affilée", correct: false}
    answer: "Quand une instance démarre pour chaque appel, quelques secondes de démarrage coûtent cher. Pour un traitement long ou une équipe déjà experte de Spring, l'écart pèse peu."
  - key: qcm-config-quarkus
    format: multiple-choice
    question: "Quel est l'équivalent Quarkus d'une classe `@ConfigurationProperties`, qui regroupe des réglages typés ?"
    choices:
      - {text: "Une interface `@ConfigMapping`", correct: true}
      - {text: "Un champ `@ConfigProperty`", correct: false}
      - {text: "Un champ `@Inject @Named`", correct: false}
      - {text: "Un paramètre `@Value`", correct: false}
    answer: "`@ConfigMapping(prefix = \"relances\")` sur une interface regroupe des réglages typés. `@ConfigProperty` lit une seule clé : c'est l'équivalent de `@Value`."
  - key: qcm-serveur-jakarta
    format: multiple-choice
    question: "Lequel de ces serveurs met en œuvre la plateforme Jakarta EE complète ?"
    choices:
      - {text: "WildFly", correct: true}
      - {text: "Tomcat", correct: false}
      - {text: "Netty", correct: false}
      - {text: "Nginx", correct: false}
    answer: "Tomcat n'implémente que quelques spécifications (Servlet, JSP, WebSocket) : c'est un conteneur de servlets, celui de Spring Boot. Netty est une bibliothèque réseau, Nginx un serveur web et un proxy."
  - key: qcm-demarrage-lent
    format: multiple-choice
    question: "Pourquoi une application Spring Boot démarre-t-elle traditionnellement plus lentement qu'une application Quarkus ?"
    choices:
      - {text: "Elle analyse le classpath, évalue ses conditions et crée ses proxies au démarrage", correct: true}
      - {text: "Elle recompile le code source de l'application à chacun de ses démarrages", correct: false}
      - {text: "Elle télécharge ses starters depuis Maven Central à chacun de ses lancements", correct: false}
      - {text: "Elle démarre un serveur Tomcat externe, installé à part sur la machine", correct: false}
    answer: "C'est le prix de la souplesse : tout est découvert au lancement. L'AOT de Spring Boot et les images natives font une partie de ce travail au build."
  - key: situation-passer-quarkus
    format: scenario
    question: |-
      Ton équipe maîtrise Spring et lance un service classique, déployé sur Kubernetes et allumé en permanence. Un
      collègue veut passer à Quarkus « parce que c'est plus moderne ». Que réponds-tu ?
    choices:
      - {text: "Que le gain au démarrage compte peu ici, face au coût d'apprendre un autre écosystème", correct: true}
      - {text: "Qu'il a raison : Spring Boot n'est plus maintenu depuis la sortie de Quarkus", correct: false}
      - {text: "Qu'il faut alors réécrire tous les services existants en Quarkus, par cohérence", correct: false}
      - {text: "Que Quarkus ne tourne pas sur Kubernetes, il est réservé aux serveurs Jakarta EE", correct: false}
    answer: |-
      Un service qui tourne en continu démarre rarement : quelques secondes de plus ne changent rien. Le choix se
      fait sur un besoin mesuré (coût mémoire, démarrage, *serverless*), pas sur la mode.
  - key: situation-facturation-milliseconde
    format: scenario
    question: |-
      Un client veut des fonctions qui démarrent à la demande, facturées à la milliseconde. Que proposes-tu ?
    choices:
      - {text: "Une image native (Quarkus, Micronaut ou Spring Boot AOT), qui démarre presque instantanément", correct: true}
      - {text: "Une application Spring Boot classique sur la JVM, avec un tas de huit gigaoctets", correct: false}
      - {text: "Un serveur WildFly toujours allumé, sur lequel on déploie chaque fonction en WAR", correct: false}
      - {text: "Un job Spring Batch lancé chaque minute, qui traite les appels en attente", correct: false}
    answer: |-
      Chaque démarrage est payé et attendu par l'appelant : une image native démarre en une fraction de seconde et
      consomme peu de mémoire. Un serveur toujours allumé contredit le besoin ; un lot chaque minute ajoute jusqu'à
      une minute d'attente.
  - key: situation-entretien-quarkus
    format: scenario
    question: |-
      En entretien chez un éditeur qui utilise Quarkus, on te demande ce qui te serait familier en venant de Spring.
      Que réponds-tu ?
    choices:
      - {text: "L'injection, la configuration, JPA et REST : les concepts sont proches, les annotations changent", correct: true}
      - {text: "Rien : Quarkus n'utilise ni injection de dépendances ni configuration externe", correct: false}
      - {text: "Tout : Quarkus accepte toutes les annotations de Spring sans aucune adaptation", correct: false}
      - {text: "Seulement Maven : le reste repose sur des concepts sans équivalent chez Spring", correct: false}
    answer: |-
      `@ApplicationScoped` et `@Inject` au lieu de `@Service`, `@ConfigMapping` au lieu de
      `@ConfigurationProperties`, Jakarta REST au lieu de Spring MVC, Hibernate dans les deux. Le vrai changement est
      le travail fait au build, et les extensions.
  - key: situation-boot-ou-jakarta
    format: scenario
    question: |-
      On te demande de comparer Spring Boot et Jakarta EE en une phrase. Quelle réponse est la plus juste ?
    choices:
      - {text: "Jakarta EE définit des standards mis en œuvre par des serveurs ; Spring Boot est un framework qui en utilise", correct: true}
      - {text: "Jakarta EE est l'ancien nom de Spring Boot, avant son rachat par la fondation Eclipse", correct: false}
      - {text: "Spring Boot est l'implémentation officielle de Jakarta EE, certifiée par la fondation Eclipse", correct: false}
      - {text: "Jakarta EE sert aux applications web, Spring Boot aux applications en ligne de commande", correct: false}
    answer: |-
      La réponse montre qu'on distingue un standard d'un produit. On peut ajouter que Spring Boot embarque son
      serveur dans le jar, quand Jakarta EE déploie classiquement l'application dans un serveur installé.
