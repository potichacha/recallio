notion: versions-migration
lesson: |-
  Beaucoup de projets tournent encore sur une ancienne génération de Spring Boot, et une offre d'emploi demande
  souvent d'« accompagner la migration ». Il faut savoir ce que chaque génération a changé, et comment on migre sans
  casser la production.

  **Les trois dernières générations.**

  | Génération | Sortie | Java minimum | Spring Framework | Ce qui change |
  |---|---|---|---|---|
  | Spring Boot 2 | 2018 | Java 8 | 5 | Java EE, paquets `javax.*` |
  | Spring Boot 3 | fin 2022 | **Java 17** | 6 | **Jakarta EE** (`jakarta.*`), images natives, `ProblemDetail`, observabilité Micrometer |
  | Spring Boot 4 | fin 2025 | Java 17 (25 conseillé) | 7 | **Jakarta EE 11**, **Jackson 3**, auto-configuration en modules, `@MockitoBean`, JSpecify |

  **Spring Boot 3 : le grand saut de `javax` à `jakarta`.** Java EE a été confié à la fondation Eclipse sous le nom
  **Jakarta EE**, et ses paquets ont été renommés : `javax.persistence` devient `jakarta.persistence`,
  `javax.servlet` devient `jakarta.servlet`, `javax.validation` devient `jakarta.validation`. Le code, mais aussi
  **chaque bibliothèque** qui touche à ces API, doit avoir sa version `jakarta`. S'y ajoutent Java 17 minimum,
  Hibernate 6, Spring Security 6 (plus de `WebSecurityConfigurerAdapter` : un bean `SecurityFilterChain`), et la fin
  de la barre oblique finale implicite : `/clients/` ne correspond plus à `/clients`.

  **Spring Boot 4 : la modularisation.** Ce qui change pour une application :

  - **Jakarta EE 11** : Servlet 6.1, Jakarta Persistence 3.2, Hibernate 7, Tomcat 11 ;
  - **Jackson 3** : les classes passent dans `tools.jackson` (`tools.jackson.databind.json.JsonMapper`) ; les
    annotations (`@JsonIgnore`, `@JsonProperty`) restent dans `com.fasterxml.jackson.annotation` ;
  - **l'auto-configuration découpée** en modules, un par technologie (`spring-boot-webmvc`, `spring-boot-data-jpa`,
    `spring-boot-hibernate`...), avec de nouveaux paquets ; le starter web s'appelle `spring-boot-starter-webmvc`
    (l'ancien nom reste un alias), et les tests ont leurs starters (`spring-boot-starter-webmvc-test`) ;
  - **les tests** : `@MockBean` et `@SpyBean` disparaissent au profit de `@MockitoBean` et `@MockitoSpyBean`, et
    `@WebMvcTest` se trouve dans `org.springframework.boot.webmvc.test.autoconfigure` ;
  - **Spring Framework 7** : annotations de nullité JSpecify, versionnement des API dans Spring MVC, `@Retryable` et
    `@ConcurrencyLimit` dans le cœur du framework ; `RestClient` est le client HTTP conseillé.

  **Migrer, étape par étape.**

  1. Monter d'abord à la **dernière version mineure** de sa génération (2.7 avant 3.0, 3.5 avant 4.0), et corriger
     tous les avertissements de **dépréciation** : ce qui est déprécié dans l'une disparaît dans la suivante.
  2. Monter **Java** si la nouvelle génération l'exige (Java 17 pour Spring Boot 3).
  3. Ajouter, le temps de la migration, **`spring-boot-properties-migrator`** : au démarrage, il signale les
     propriétés renommées ou supprimées, et les traduit temporairement. On le retire ensuite.
  4. Automatiser le mécanique avec **OpenRewrite** : ses recettes Spring Boot renomment les paquets (`javax` →
     `jakarta`), les propriétés et les API, par un plugin Maven ou Gradle.
  5. Suivre le **guide de migration** officiel de la version, puis s'appuyer sur les **tests** : sans eux, une
     migration se découvre en production.

  **Le support.** Chaque version mineure n'a qu'un temps de support libre (OSS) : correctifs, de sécurité compris,
  publiés pour tous. Ensuite, seul un support commercial payant en publie. Rester sur une version sans support, c'est
  garder ouvertes les failles découvertes après.

  **En entretien** : « Spring Boot 3 a imposé Java 17 et le passage de `javax` à `jakarta` ; Spring Boot 4 apporte
  Jakarta EE 11, Jackson 3 et une auto-configuration en modules. Pour migrer, je monte d'abord à la dernière mineure
  et je corrige les dépréciations, puis j'automatise avec OpenRewrite et je vérifie les propriétés avec
  `spring-boot-properties-migrator`. Les tests font le reste. »
cards:
  - key: migration-trois-longue
    format: course
    question: "Quel changement a rendu la migration vers Spring Boot 3 longue sur les gros projets ?"
    choices:
      - {text: "Le passage des paquets `javax.*` à `jakarta.*`, dans le code et dans les bibliothèques", correct: true}
      - {text: "Le passage de Maven à Gradle, devenu le seul outil de build pris en charge par Spring", correct: false}
      - {text: "Le passage de Hibernate à EclipseLink, devenu le fournisseur JPA par défaut", correct: false}
      - {text: "Le passage de Tomcat à Jetty, devenu le seul serveur embarqué de Spring Boot", correct: false}
    answer: "Chaque import de `javax.persistence`, `javax.servlet` ou `javax.validation` change, et chaque bibliothèque qui en dépend doit exister en version `jakarta`. Le reste de la migration est plus léger."
  - key: java-minimum-trois
    format: course
    question: "Pour migrer de Spring Boot 2.7 à 3.0, quelle version de Java faut-il au minimum ?"
    choices:
      - {text: "Java 17", correct: true}
      - {text: "Java 8", correct: false}
      - {text: "Java 11", correct: false}
      - {text: "Java 21", correct: false}
    answer: "Spring Boot 3 et Spring Framework 6 exigent Java 17. Un projet en Java 8 ou 11 monte donc Java d'abord, ce qui peut déjà demander du travail (modules, API retirées)."
  - key: ordre-migration
    format: course
    question: "Quel ordre suis-tu pour passer de Spring Boot 2.5 à 3.x ?"
    choices:
      - {text: "Monter en 2.7, corriger les dépréciations, puis passer en 3.0", correct: true}
      - {text: "Passer en 3.x d'abord, en gardant Java 11, puis monter Java", correct: false}
      - {text: "Remplacer Hibernate d'abord, puis monter Spring Boot ensuite", correct: false}
      - {text: "Passer directement en 3.x, puis supprimer les tests qui échouent", correct: false}
    answer: "La 2.7 signale par des dépréciations presque tout ce que la 3.0 retire. On corrige dans une version qui fonctionne encore, puis le saut vers la 3.0 devient petit. Garder Java 11 est impossible : la 3.0 exige Java 17."
  - key: json-boot-quatre
    format: course
    question: "Que change Spring Boot 4 pour la bibliothèque JSON par défaut ?"
    choices:
      - {text: "Il passe à Jackson 3, dont les classes sont dans `tools.jackson`", correct: true}
      - {text: "Il remplace Jackson par Gson, plus léger, dans tous les starters web", correct: false}
      - {text: "Il passe à JSON-B, la spécification JSON de Jakarta EE 11", correct: false}
      - {text: "Il garde Jackson 2, mais range ses annotations dans `tools.jackson`", correct: false}
    answer: "`ObjectMapper` et `JsonMapper` sont désormais dans `tools.jackson.databind`. Les annotations, elles, n'ont pas bougé : `@JsonIgnore` reste dans `com.fasterxml.jackson.annotation`."
  - key: vf-mockbean-boot-quatre
    format: true-false
    question: "Après la migration vers Spring Boot 4, un test qui utilise `@MockBean` ne compile plus."
    truth: true
    answer: "`@MockBean` et `@SpyBean` ont été retirés. On les remplace par `@MockitoBean` et `@MockitoSpyBean`, du paquet `org.springframework.test.context.bean.override.mockito`."
  - key: vf-javax-boot-trois
    format: true-false
    question: "Spring Boot 3 a gardé les paquets `javax.persistence` et `javax.servlet`."
    truth: false
    answer: "Spring Boot 3 repose sur Jakarta EE : `jakarta.persistence`, `jakarta.servlet`. Une bibliothèque encore en `javax` n'y fonctionne plus."
  - key: vf-auto-configuration-modules
    format: true-false
    question: "Dans Spring Boot 4, l'auto-configuration est découpée en modules, un par technologie (`spring-boot-webmvc`, `spring-boot-data-jpa`...)."
    truth: true
    answer: "L'ancien `spring-boot-autoconfigure` contenait tout. Les modules allègent l'application, et des classes ont changé de paquet : `WebMvcAutoConfiguration` est dans `org.springframework.boot.webmvc.autoconfigure`."
  - key: vf-annotations-jackson
    format: true-false
    question: "Avec Jackson 3, les annotations comme `@JsonIgnore` changent de paquet."
    truth: false
    answer: "Elles restent dans `com.fasterxml.jackson.annotation`, compatibles entre Jackson 2 et 3. Ce sont les classes du moteur (`ObjectMapper`, `JsonNode`) qui passent dans `tools.jackson`."
  - key: qcm-outil-migration
    format: multiple-choice
    question: "Quel outil automatise une grande partie d'une montée de version de Spring Boot ?"
    choices:
      - {text: "OpenRewrite, avec ses recettes de migration Spring Boot", correct: true}
      - {text: "Flyway, avec ses scripts de migration versionnés", correct: false}
      - {text: "Liquibase, avec ses journaux de modifications", correct: false}
      - {text: "Spring Initializr, qui régénère le projet entier", correct: false}
    answer: "OpenRewrite transforme le code source : imports `javax` en `jakarta`, propriétés renommées, API remplacées. Flyway et Liquibase migrent le schéma de la base, pas le code."
  - key: qcm-proprietes-renommees
    format: multiple-choice
    question: "Quel module signale au démarrage les propriétés renommées ou supprimées par une nouvelle version ?"
    choices:
      - {text: "`spring-boot-properties-migrator`", correct: true}
      - {text: "`spring-boot-devtools`", correct: false}
      - {text: "`spring-boot-actuator`", correct: false}
      - {text: "`spring-boot-configuration-processor`", correct: false}
    answer: "On l'ajoute le temps de la migration : il journalise chaque clé obsolète avec sa remplaçante, et la traduit temporairement. On le retire une fois les fichiers corrigés."
  - key: qcm-jakarta-boot-quatre
    format: multiple-choice
    question: "Sur quelle version de Jakarta EE repose Spring Boot 4 ?"
    choices:
      - {text: "Jakarta EE 11", correct: true}
      - {text: "Jakarta EE 9", correct: false}
      - {text: "Jakarta EE 10", correct: false}
      - {text: "Java EE 8", correct: false}
    answer: "Jakarta EE 11 : Servlet 6.1 (Tomcat 11), Jakarta Persistence 3.2 (Hibernate 7). Spring Boot 3 reposait sur Jakarta EE 10 ; Java EE 8 est la génération de Spring Boot 2."
  - key: qcm-starter-web-renomme
    format: multiple-choice
    question: "En migrant vers Spring Boot 4, quel starter prend la place de `spring-boot-starter-web` ?"
    choices:
      - {text: "`spring-boot-starter-webmvc`", correct: true}
      - {text: "`spring-boot-starter-webflux`", correct: false}
      - {text: "`spring-boot-starter-servlet`", correct: false}
      - {text: "`spring-boot-starter-tomcat`", correct: false}
    answer: "Le nouveau nom dit la pile choisie : Spring MVC, sur un serveur de servlets. L'ancien reste un alias pour faciliter la migration. WebFlux est une autre pile, réactive."
  - key: situation-boot-deux-java-onze
    format: scenario
    question: |-
      Ton équipe est en Spring Boot 2.7 sur Java 11, et doit passer en 3.x. Par quoi commences-tu ?
    choices:
      - {text: "Monter Java en 17, puis migrer `javax` vers `jakarta` avec une recette OpenRewrite", correct: true}
      - {text: "Passer en Spring Boot 3, et garder Java 11 jusqu'à la fin de la migration", correct: false}
      - {text: "Réécrire l'application en Quarkus, pour éviter le passage à `jakarta`", correct: false}
      - {text: "Attendre que les bibliothèques internes passent d'elles-mêmes en `jakarta`", correct: false}
    answer: |-
      Spring Boot 3 ne démarre pas sur Java 11 : Java 17 vient d'abord, et se valide seul. Ensuite, OpenRewrite fait
      le gros du renommage. Quarkus repose lui aussi sur `jakarta` : le changer n'éviterait rien.
  - key: situation-barre-oblique
    format: scenario
    question: |-
      Après la montée en Spring Boot 3, `GET /api/clients/` renvoie 404, alors qu'il marchait en 2.7. Le contrôleur
      déclare `@GetMapping("/api/clients")`. Pourquoi ?
    choices:
      - {text: "Spring 6 ne fait plus correspondre la barre oblique finale : `/clients/` n'est plus `/clients`", correct: true}
      - {text: "Spring Boot 3 a changé le préfixe par défaut des API en `/api/v3`", correct: false}
      - {text: "Le contrôleur doit désormais porter `@Controller` en plus de `@RestController`", correct: false}
      - {text: "Les chemins sont devenus sensibles à la casse, ce qu'ils n'étaient pas en 2.7", correct: false}
    answer: |-
      Spring Framework 6 a désactivé par défaut la correspondance de la barre oblique finale. On corrige l'appelant,
      ou l'on déclare explicitement les deux chemins. Les chemins ont toujours été sensibles à la casse.
  - key: situation-import-object-mapper
    format: scenario
    question: |-
      Après la migration vers Spring Boot 4, une classe ne compile plus sur
      `import com.fasterxml.jackson.databind.ObjectMapper;`. Que fais-tu ?
    choices:
      - {text: "J'importe `tools.jackson.databind.ObjectMapper` : Jackson 3 a changé de paquet", correct: true}
      - {text: "J'importe `com.fasterxml.jackson.annotation.ObjectMapper`, son nouveau paquet", correct: false}
      - {text: "Je remplace Jackson par `org.json`, plus stable d'une version à l'autre", correct: false}
      - {text: "J'injecte un `Gson`, que Spring Boot 4 configure désormais par défaut", correct: false}
    answer: |-
      Le moteur de Jackson 3 vit dans `tools.jackson` ; seules les annotations sont restées dans
      `com.fasterxml.jackson.annotation`. Mieux encore : injecter le `JsonMapper` configuré par Spring Boot plutôt
      que d'en créer un.
  - key: situation-fin-support
    format: scenario
    question: |-
      Ton responsable demande pourquoi rester sur une version de Spring Boot qui n'a plus de support libre serait
      risqué. Que réponds-tu ?
    choices:
      - {text: "Plus de correctifs de sécurité publics : chaque faille découverte resterait ouverte", correct: true}
      - {text: "L'application cesserait de démarrer à la date exacte de fin du support", correct: false}
      - {text: "Maven Central retirerait cette version, et le build ne passerait plus", correct: false}
      - {text: "La licence deviendrait payante, et chaque serveur devrait être déclaré", correct: false}
    answer: |-
      Rien ne s'arrête le jour de la fin du support : c'est ce qui le rend dangereux. Les failles publiées ensuite,
      dans Spring ou dans ses dépendances (Tomcat, Jackson), ne sont plus corrigées que pour les versions suivies, ou
      par un support payant.
  - key: definition-javax-jakarta
    format: definition
    question: "Que désigne le passage « de `javax` à `jakarta` » ?"
    choices:
      - {text: "Le renommage des paquets de Java EE, confié à la fondation Eclipse sous le nom Jakarta EE", correct: true}
      - {text: "Le remplacement de Java par Kotlin dans le code source des frameworks de Spring", correct: false}
      - {text: "Le nouveau nom de la JVM d'Oracle, appelée Jakarta à partir de Java 17", correct: false}
      - {text: "La migration des projets Maven vers Gradle, imposée par la fondation Eclipse", correct: false}
    answer: "Oracle a confié Java EE à la fondation Eclipse sans lui céder le nom ni le préfixe `javax`. Depuis Jakarta EE 9, les API sont en `jakarta.*`."
  - key: definition-recette-openrewrite
    format: definition
    question: "Qu'est-ce qu'une recette OpenRewrite ?"
    choices:
      - {text: "Une transformation automatique du code source, lancée par un plugin Maven ou Gradle", correct: true}
      - {text: "Un script SQL versionné, exécuté au démarrage pour faire évoluer la base de données", correct: false}
      - {text: "Un modèle de projet, téléchargé depuis Spring Initializr pour repartir de zéro", correct: false}
      - {text: "Un fichier de propriétés qui renomme les anciennes clés au démarrage de l'application", correct: false}
    answer: "Une recette décrit des changements (un import, une propriété, un appel d'API) et les applique à tout le projet. Les recettes Spring Boot regroupent ceux d'une montée de version."
  - key: definition-support-oss
    format: definition
    question: "Qu'est-ce que le support « OSS » d'une version de Spring Boot ?"
    choices:
      - {text: "La période où ses correctifs, de sécurité compris, sont publiés librement", correct: true}
      - {text: "La période où la version peut être téléchargée gratuitement sur Maven Central", correct: false}
      - {text: "Le support payant, vendu aux entreprises qui gardent une ancienne version", correct: false}
      - {text: "La liste des systèmes d'exploitation sur lesquels la version a été testée", correct: false}
    answer: "OSS pour *open source software*. Après cette période, seul le support commercial publie des correctifs ; la version reste téléchargeable, mais n'est plus réparée pour tous."
  - key: definition-depreciation
    format: definition
    question: "Qu'est-ce qu'une API dépréciée (`@Deprecated`), lors d'une montée de version ?"
    choices:
      - {text: "Une API encore présente mais signalée, appelée à disparaître dans une version suivante", correct: true}
      - {text: "Une API déjà retirée, dont chaque appel provoque une erreur à l'exécution", correct: false}
      - {text: "Une API réservée aux tests, interdite dans le code de production", correct: false}
      - {text: "Une API devenue plus lente, sans aucun changement de comportement", correct: false}
    answer: "Le compilateur avertit, et la documentation indique la remplaçante. Corriger les dépréciations avant de changer de génération rend la migration bien plus courte."
