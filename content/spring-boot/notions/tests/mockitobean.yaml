notion: mockitobean
lesson: |-
  Dans un test qui démarre un contexte Spring, on veut parfois **remplacer un bean** : un client de paiement qu'on
  ne veut pas appeler, un service hors de la tranche testée. Spring Framework le fait avec deux annotations, du
  package `org.springframework.test.context.bean.override.mockito` :

  | Annotation | Effet |
  |---|---|
  | `@MockitoBean` | **remplace** le bean de ce type par un mock Mockito (ou le crée, s'il n'existe pas) |
  | `@MockitoSpyBean` | **enveloppe** le bean existant dans un espion : les vraies méthodes restent appelées |

  Elles succèdent à `@MockBean` et `@SpyBean` de Spring Boot, dépréciées en 3.4 et **retirées de Spring Boot 4**.

  ```java
  @WebMvcTest(LivreController.class)
  class LivreControllerTest {

      @Autowired
      MockMvc mvc;

      @MockitoBean
      CatalogueService catalogue;

      @Test
      void repond404QuandLeLivreEstInconnu() throws Exception {
          given(catalogue.trouver("9780000000000")).willReturn(Optional.empty());

          mvc.perform(get("/api/livres/9780000000000")).andExpect(status().isNotFound());
      }
  }
  ```

  **Programmer et vérifier.** `given(mock.methode(args)).willReturn(valeur)` (ou `when(...).thenReturn(...)`) ;
  `verify(mock).methode(args)`, `verify(mock, never())...`. Une méthode non programmée renvoie une valeur neutre :
  `null`, `0`, `false`, une collection vide, un `Optional` vide. Un argument qui ne correspond pas à celui
  programmé donne donc aussi cette valeur neutre, sans erreur.

  **Les espions.** `given(espion.methode())` **appelle la vraie méthode** pendant qu'on la programme. Pour un espion,
  on écrit `doReturn(5).when(espion).prixTtc("x")`. Et `@MockitoSpyBean` exige un bean existant : sinon
  « Unable to select a bean to wrap: there are no beans of type ... ».

  **Les réglages.** `name` choisit le bean par son nom quand plusieurs ont le même type ; `reset` dit quand le mock
  est remis à zéro (`AFTER` chaque test, par défaut) ; `answers` change les valeurs par défaut.

  **`@Mock` n'est pas `@MockitoBean`.** `@Mock` (Mockito, avec `MockitoExtension`) crée un mock que le contexte
  Spring ne voit pas : parfait pour un test unitaire sans Spring, inutile pour remplacer un bean.

  **Le coût.** L'ensemble des beans remplacés fait partie de la clé du cache des contextes : deux classes de test
  qui remplacent des beans différents ont deux contextes. Regrouper les mocks dans une classe de base commune garde
  le cache efficace. Pour remplacer un bean par un objet précis, sans Mockito, il existe `@TestBean`, qui appelle une
  méthode statique du test.

  **En entretien** : « `@MockitoBean` remplace un bean du contexte par un mock, `@MockitoSpyBean` enveloppe le vrai
  bean ; ils remplacent `@MockBean` et `@SpyBean`, retirés de Spring Boot 4. Les mocks sont remis à zéro après
  chaque test. Chaque combinaison de mocks est un contexte de plus en cache : je les garde peu nombreux et
  partagés. »
cards:
  - key: effet-mockitobean
    format: course
    question: "Que fait `@MockitoBean` sur un champ d'une classe de test Spring ?"
    choices:
      - {text: "Il remplace le bean de ce type dans le contexte par un mock Mockito", correct: true}
      - {text: "Il crée un mock Mockito que le contexte Spring ne voit pas", correct: false}
      - {text: "Il enveloppe le vrai bean, dont les méthodes restent appelées", correct: false}
      - {text: "Il retire le bean du contexte, sans rien mettre à sa place", correct: false}
    answer: "Le mock prend la place du bean partout où il est injecté, et le champ du test y donne accès pour le programmer. S'il n'y a pas de bean de ce type, il est créé."
  - key: mockbean-boot-4
    format: course
    question: "Que devient l'annotation `@MockBean` avec Spring Boot 4 ?"
    choices:
      - {text: "Elle a disparu : on écrit `@MockitoBean`, de Spring Framework", correct: true}
      - {text: "Elle reste conseillée, `@MockitoBean` étant réservée aux tranches", correct: false}
      - {text: "Elle est renommée `@MockBeanOverride`, dans le même package", correct: false}
      - {text: "Elle ne fonctionne plus qu'avec les tests écrits en JUnit 4", correct: false}
    answer: "Dépréciées en Spring Boot 3.4, `@MockBean` et `@SpyBean` ont été retirées. `@MockitoBean` et `@MockitoSpyBean` viennent du module de test de Spring Framework."
  - key: mock-ou-espion
    format: course
    question: "Quelle différence entre `@MockitoBean` et `@MockitoSpyBean` ?"
    choices:
      - {text: "Le premier remplace le bean par un mock, le second enveloppe le vrai bean", correct: true}
      - {text: "Le premier enveloppe le vrai bean, le second le remplace par un mock", correct: false}
      - {text: "Le premier sert aux tranches, le second aux tests `@SpringBootTest`", correct: false}
      - {text: "Aucune : le second est l'ancien nom du premier, gardé par compatibilité", correct: false}
    answer: "Un espion appelle les vraies méthodes, sauf celles qu'on programme, et enregistre les appels. Il faut donc que le bean existe."
  - key: valeur-par-defaut-optional
    format: course
    question: "Que renvoie la méthode d'un mock `@MockitoBean` dont le type de retour est `Optional`, quand rien n'est programmé ?"
    choices:
      - {text: "`Optional.empty()`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "Une `NullPointerException`", correct: false}
      - {text: "Le résultat de la vraie méthode", correct: false}
    answer: "Mockito renvoie des valeurs neutres : `Optional` vide, collections vides, `0`, `false`, sinon `null`. Un oubli de programmation ne lève donc pas d'erreur."
  - key: vf-reset-apres-test
    format: true-false
    question: "Un mock déclaré avec `@MockitoBean` est remis à zéro après chaque test, par défaut."
    truth: true
    answer: "L'attribut `reset` vaut `MockReset.AFTER` : programmations et appels enregistrés sont effacés, même si le contexte, lui, est réutilisé."
  - key: vf-espion-sans-bean
    format: true-false
    question: "`@MockitoSpyBean` crée le bean quand il n'existe pas encore dans le contexte."
    truth: false
    answer: "Un espion enveloppe un bean réel. Sans bean de ce type, le contexte échoue : « Unable to select a bean to wrap ». C'est `@MockitoBean` qui sait créer."
  - key: vf-mocks-et-cache
    format: true-false
    question: "Deux classes de test qui remplacent des beans différents avec `@MockitoBean` partagent le même contexte en cache."
    truth: false
    answer: "Les beans remplacés font partie de la clé du cache : chaque combinaison donne un contexte de plus, à démarrer."
  - key: vf-mock-mockito
    format: true-false
    question: "Dans un `@WebMvcTest`, un champ annoté `@Mock` de Mockito remplace le bean du contexte."
    truth: false
    answer: "`@Mock` crée un mock hors de Spring. Le contexte ne le voit pas, et le contrôleur n'a toujours pas sa dépendance."
  - key: qcm-programmer-mock
    format: multiple-choice
    question: "Comment programmes-tu le mock `catalogue` pour qu'il renvoie `livre` quand on lui demande l'ISBN `\"978\"` ?"
    choices:
      - {text: "`given(catalogue.trouver(\"978\")).willReturn(Optional.of(livre))`", correct: true}
      - {text: "`catalogue.trouver(\"978\").willReturn(Optional.of(livre))`", correct: false}
      - {text: "`verify(catalogue).trouver(\"978\").thenReturn(Optional.of(livre))`", correct: false}
      - {text: "`given(catalogue).trouver(\"978\").willReturn(livre)`", correct: false}
    answer: "`given` (ou `when`) reçoit l'appel à programmer, puis `willReturn` la valeur. `verify` vérifie après coup, il ne programme rien."
  - key: qcm-programmer-espion
    format: multiple-choice
    question: "Comment programmes-tu l'espion `catalogue` pour que `prixTtc(\"x\")` renvoie 5, sans appeler la vraie méthode ?"
    choices:
      - {text: "`doReturn(5).when(catalogue).prixTtc(\"x\")`", correct: true}
      - {text: "`when(catalogue.prixTtc(\"x\")).thenReturn(5)`", correct: false}
      - {text: "`given(catalogue.prixTtc(\"x\")).willReturn(5)`", correct: false}
      - {text: "`catalogue.prixTtc(\"x\").thenReturn(5)`", correct: false}
    answer: "Avec `when(...)` ou `given(...)`, l'expression `catalogue.prixTtc(\"x\")` s'exécute d'abord : sur un espion, c'est la vraie méthode. `doReturn` programme sans l'appeler."
  - key: qcm-package
    format: multiple-choice
    question: "Dans quel package se trouve `@MockitoBean` ?"
    choices:
      - {text: "`org.springframework.test.context.bean.override.mockito`", correct: true}
      - {text: "`org.springframework.boot.test.mock.mockito`", correct: false}
      - {text: "`org.mockito.junit.jupiter`", correct: false}
      - {text: "`org.springframework.boot.test.context`", correct: false}
    answer: "Elle vient de Spring Framework (module `spring-test`). `org.springframework.boot.test.mock.mockito` était le package de `@MockBean`, retiré de Spring Boot 4."
  - key: qcm-choisir-par-nom
    format: multiple-choice
    question: "Le contexte a deux beans `PaiementClient`, nommés `carte` et `virement`. Comment remplaces-tu seulement `virement` par un mock ?"
    choices:
      - {text: "`@MockitoBean(name = \"virement\")` sur un champ `PaiementClient`", correct: true}
      - {text: "`@MockitoBean(types = PaiementClient.class)` sur la classe de test", correct: false}
      - {text: "`@MockitoSpyBean` sur un champ `PaiementClient`, sans attribut", correct: false}
      - {text: "`@Primary` et `@MockitoBean` sur un champ `PaiementClient`", correct: false}
    answer: "`name` désigne le bean à remplacer. Par le seul type, deux candidats rendent le choix ambigu."
  - key: trous-mockitobean
    format: fill-in
    question: |-
      Complète pour remplacer le bean `CatalogueService` du contexte par un mock :
      ```java
      @WebMvcTest(LivreController.class)
      class LivreControllerTest {

          @___
          CatalogueService catalogue;
      }
      ```
    blanks:
      - [MockitoBean]
    answer: "`@MockitoBean` met un mock à la place du bean, et le contrôleur le reçoit dans son constructeur."
  - key: trous-mockitospybean
    format: fill-in
    question: |-
      Complète pour garder le vrai bean `TarifService`, tout en pouvant vérifier ses appels :
      ```java
      @SpringBootTest
      class PanierServiceTest {

          @___
          TarifService tarifs;
      }
      ```
    blanks:
      - [MockitoSpyBean]
    answer: "Un espion appelle les vraies méthodes et enregistre les appels : `verify(tarifs).prix(\"livre\")` fonctionne."
  - key: trous-will-return
    format: fill-in
    question: |-
      Complète pour programmer la réponse du mock :
      ```java
      given(catalogue.trouver("9782070360024")).___(Optional.of(livre));
      ```
    blanks:
      - [willReturn]
    answer: "Le style BDD de Mockito : `given(...).willReturn(...)`. L'équivalent classique est `when(...).thenReturn(...)`."
  - key: trous-never
    format: fill-in
    question: |-
      Complète pour vérifier que le service n'a jamais été appelé :
      ```java
      verify(catalogue, ___()).ajouter(any());
      ```
    blanks:
      - [never]
    answer: "`never()` équivaut à `times(0)`. Utile pour prouver qu'une requête invalide s'est arrêtée avant le service."
  - key: bug-mock-de-mockito
    format: bug-fix
    question: |-
      Ce test ne démarre pas : « No qualifying bean of type 'librairie.CatalogueService' available ». Quelle
      correction est la bonne ?
      ```java
      import org.mockito.Mock;

      @WebMvcTest(LivreController.class)
      class LivreControllerTest {

          @Autowired
          MockMvc mvc;

          @Mock
          CatalogueService catalogue;
      }
      ```
    choices:
      - {text: "Remplacer `@Mock` par `@MockitoBean` sur le champ", correct: true}
      - {text: "Ajouter `@ExtendWith(MockitoExtension.class)` sur la classe", correct: false}
      - {text: "Ajouter `@InjectMocks` sur un champ `LivreController`", correct: false}
      - {text: "Initialiser le champ avec `Mockito.mock(CatalogueService.class)`", correct: false}
    answer: |-
      ```java
      @MockitoBean
      CatalogueService catalogue;
      ```
      `@Mock`, même activé par `MockitoExtension`, crée un objet que le contexte Spring ignore : le contrôleur n'a
      toujours pas de `CatalogueService`. `@MockitoBean` enregistre le mock comme bean.
  - key: bug-programmer-espion
    format: bug-fix
    question: |-
      Ce test lève « IllegalArgumentException: livre inconnu : x » sur la ligne `given`, avant même l'appel
      testé. Quelle correction est la bonne ?
      ```java
      @SpringBootTest
      class PanierServiceTest {

          @MockitoSpyBean
          CatalogueService catalogue;

          @Test
          void appliqueLePrixDuCatalogue() {
              given(catalogue.prixTtc("x")).willReturn(5);
              assertThat(catalogue.prixTtc("x")).isEqualTo(5);
          }
      }
      ```
    choices:
      - {text: "Écrire `doReturn(5).when(catalogue).prixTtc(\"x\")`", correct: true}
      - {text: "Écrire `when(catalogue.prixTtc(\"x\")).thenReturn(5)`", correct: false}
      - {text: "Écrire `given(catalogue.prixTtc(any())).willReturn(5)`", correct: false}
      - {text: "Ajouter `@Transactional` sur la méthode de test", correct: false}
    answer: |-
      ```java
      doReturn(5).when(catalogue).prixTtc("x");
      ```
      Pour programmer `given(catalogue.prixTtc("x"))`, Java évalue d'abord `catalogue.prixTtc("x")` : sur un
      espion, c'est la vraie méthode, qui ne connaît pas `"x"`. `doReturn(...).when(espion)` programme sans
      l'appeler. `when` a le même défaut que `given`.
  - key: bug-espion-sans-bean
    format: bug-fix
    question: |-
      Ce test ne démarre pas : « Unable to select a bean to wrap: there are no beans of type
      boutique.PaiementClient ». `PaiementClient` est une interface que l'application n'implémente pas encore.
      Quelle correction est la bonne ?
      ```java
      @SpringBootTest
      class CommandeServiceTest {

          @MockitoSpyBean
          PaiementClient paiement;
      }
      ```
    choices:
      - {text: "Remplacer `@MockitoSpyBean` par `@MockitoBean`, qui crée le bean", correct: true}
      - {text: "Ajouter `@Lazy` sur le champ, pour retarder la création de l'espion", correct: false}
      - {text: "Ajouter `@Primary` sur le champ, pour lui donner la priorité", correct: false}
      - {text: "Passer à `@SpringBootTest(webEnvironment = NONE)`", correct: false}
    answer: |-
      ```java
      @MockitoBean
      PaiementClient paiement;
      ```
      Un espion enveloppe un bean qui existe. Sans bean de ce type, il n'y a rien à envelopper. `@MockitoBean`
      remplace le bean s'il existe, et le crée sinon.
  - key: bug-argument-programme
    format: bug-fix
    question: |-
      Le contrôleur retire les tirets de l'ISBN avant d'appeler `catalogue.trouver(isbn.replace("-", ""))`. Ce test
      échoue : « Status expected:<200> but was:<404> ». Quelle correction est la bonne ?
      ```java
      @Test
      void trouveUnLivreAvecDesTirets() throws Exception {
          given(catalogue.trouver("978-2-07-036002-4")).willReturn(Optional.of(livre));

          mvc.perform(get("/api/livres/978-2-07-036002-4"))
                  .andExpect(status().isOk());
      }
      ```
    choices:
      - {text: "Programmer le mock avec l'ISBN sans tirets, `\"9782070360024\"`", correct: true}
      - {text: "Programmer le mock avec `willReturn(livre)`, sans `Optional`", correct: false}
      - {text: "Déclarer le mock avec `@MockitoSpyBean` au lieu de `@MockitoBean`", correct: false}
      - {text: "Ajouter `reset = MockReset.NONE` à l'annotation du mock", correct: false}
    answer: |-
      ```java
      given(catalogue.trouver("9782070360024")).willReturn(Optional.of(livre));
      ```
      Le mock ne répond qu'à l'argument programmé. Appelé avec l'ISBN sans tirets, il renvoie sa valeur neutre, un
      `Optional` vide : d'où le 404. `verify(catalogue).trouver(...)` aurait montré l'argument réellement reçu.
