notion: journalisation
lesson: |-
  Spring Boot journalise avec **SLF4J**, une **façade** : ton code appelle l'API de SLF4J, et une implémentation
  écrit vraiment les messages. Par défaut, c'est **Logback**, tiré par `spring-boot-starter-logging` (inclus dans
  tous les starters). Log4j 2 peut le remplacer.

  ```java
  @Service
  public class CommandeService {
      private static final Logger log = LoggerFactory.getLogger(CommandeService.class);

      public void commander(Commande commande) {
          log.debug("Commande {} reçue pour {}", commande.id(), commande.client());
          try {
              ...
              log.info("Commande {} enregistrée", commande.id());
          } catch (PaiementRefuse e) {
              log.warn("Paiement refusé pour la commande {}", commande.id(), e);   // l'exception en dernier
          }
      }
  }
  ```

  **Les niveaux**, du plus bavard au plus grave : `TRACE`, `DEBUG`, `INFO`, `WARN`, `ERROR`. Un logger réglé sur un
  niveau affiche ce niveau et les plus graves. **Par défaut : `INFO`**.

  **Deux bonnes pratiques d'écriture.**
  - Les **accolades** `{}` plutôt que la concaténation : le message n'est construit que si le niveau est actif.
  - L'**exception en dernier argument**, sans accolade pour elle : SLF4J écrit alors sa **pile d'appels**. Avec
    `e.getMessage()` concaténé, on la perd (et le message peut être `null`).

  **Régler les niveaux**, sans toucher au code :

  ```properties
  logging.level.root=warn                       # tous les loggers
  logging.level.com.boutique=info               # un package et ses sous-packages
  logging.level.com.boutique.paiement=debug     # plus précis : il l'emporte
  logging.level.org.hibernate.SQL=debug         # les requêtes SQL
  logging.file.name=boutique.log                # écrire aussi dans un fichier
  ```

  Le nom d'un logger est celui de la **classe** passée à `getLogger` : c'est lui que vise `logging.level`. D'où le
  piège du copier-coller (`getLogger(Facture.class)` dans `CommandeService`).

  **Pour aller plus loin.**
  - `logback-spring.xml` : une configuration Logback complète, avec des sections `<springProfile>` par profil.
  - **Journaux structurés** (JSON), sans dépendance : `logging.structured.format.console=ecs` (ou `logstash`,
    `gelf`), depuis Spring Boot 3.4.
  - Le **MDC** (`MDC.put("correlation", id)`) ajoute une valeur à toutes les lignes d'une requête.
  - `--debug` affiche plus de détails sur le cœur de Spring Boot, sans tout passer en `DEBUG`.

  **Ce qu'on ne journalise jamais** : mots de passe, jetons, numéros de carte, et le moins possible de données
  personnelles.

  **En entretien** : « Je journalise avec SLF4J, Logback étant l'implémentation par défaut. J'utilise les accolades,
  je passe l'exception en dernier argument pour garder la pile, et je règle les niveaux par package avec
  `logging.level`. Aucun secret ni donnée sensible dans les journaux. »
cards:
  - key: role-de-slf4j
    format: course
    question: "Quel est le rôle de SLF4J dans une application Spring Boot ?"
    choices:
      - {text: "Une façade : le code l'appelle, et Logback écrit vraiment", correct: true}
      - {text: "Le moteur qui écrit lui-même les messages dans les fichiers", correct: false}
      - {text: "Un format de fichier de journal, lu par les outils", correct: false}
      - {text: "Un serveur qui centralise les journaux de l'entreprise", correct: false}
    answer: "Le code ne dépend que de l'API de SLF4J ; changer Logback pour Log4j 2 ne change pas une ligne de code."
  - key: niveau-par-defaut
    format: course
    question: "Quel est le niveau de journalisation par défaut d'une application Spring Boot ?"
    choices:
      - {text: "`INFO`", correct: true}
      - {text: "`DEBUG`", correct: false}
      - {text: "`WARN`", correct: false}
      - {text: "`TRACE`", correct: false}
    answer: "`INFO`, `WARN` et `ERROR` s'affichent ; `DEBUG` et `TRACE` non, sauf réglage."
  - key: pourquoi-les-accolades
    format: course
    question: "Pourquoi écrire `log.debug(\"Commande {}\", id)` plutôt que `log.debug(\"Commande \" + id)` ?"
    choices:
      - {text: "Le message n'est construit que si le niveau `DEBUG` est actif", correct: true}
      - {text: "La concaténation est interdite par l'API de SLF4J", correct: false}
      - {text: "Les accolades chiffrent la valeur dans le journal", correct: false}
      - {text: "Les accolades écrivent la valeur sur une ligne à part", correct: false}
    answer: "La concaténation construit la chaîne même quand le message est jeté. Avec `{}`, SLF4J ne formate que si besoin."
  - key: journaliser-une-exception
    format: course
    question: "Comment journaliser une exception avec sa pile d'appels ?"
    choices:
      - {text: "La passer en dernier argument : `log.error(\"Échec {}\", id, e)`", correct: true}
      - {text: "Concaténer `e.getMessage()` au message", correct: false}
      - {text: "Appeler `e.printStackTrace()` avant `log.error`", correct: false}
      - {text: "La passer en premier argument : `log.error(e, \"Échec\")`", correct: false}
    answer: "SLF4J reconnaît un `Throwable` en dernier argument, même avec des `{}` avant lui, et écrit sa pile. `printStackTrace` écrit hors du système de journaux."
  - key: vf-niveau-par-package
    format: true-false
    question: "`logging.level.com.boutique=debug` active `DEBUG` pour le package `com.boutique` et ses sous-packages."
    truth: true
    answer: "Les loggers forment une hiérarchie, par nom. Un réglage plus précis (`com.boutique.paiement`) l'emporte."
  - key: vf-logback-par-defaut
    format: true-false
    question: "Logback est l'implémentation de journalisation par défaut de Spring Boot."
    truth: true
    answer: "Par `spring-boot-starter-logging`. Pour Log4j 2, on l'exclut et l'on ajoute `spring-boot-starter-log4j2`."
  - key: vf-debug-sous-info
    format: true-false
    question: "Un appel à `log.debug` s'affiche quand le logger est réglé sur `INFO`."
    truth: false
    answer: "`DEBUG` est moins grave qu'`INFO` : il est filtré."
  - key: vf-journaux-structures
    format: true-false
    question: "Spring Boot sait écrire des journaux structurés en JSON avec une simple propriété."
    truth: true
    answer: "`logging.structured.format.console=ecs` (ou `logstash`, `gelf`), depuis Spring Boot 3.4, sans dépendance supplémentaire."
  - key: qcm-ecrire-dans-un-fichier
    format: multiple-choice
    question: "Quelle propriété écrit aussi les journaux dans un fichier ?"
    choices:
      - {text: "`logging.file.name=boutique.log`", correct: true}
      - {text: "`logging.output=boutique.log`", correct: false}
      - {text: "`logging.path.file=boutique.log`", correct: false}
      - {text: "`spring.log.file=boutique.log`", correct: false}
    answer: "Le fichier tourne par défaut à 10 Mo. En conteneur, on écrit plutôt sur la sortie standard, que la plateforme collecte."
  - key: qcm-ordre-des-niveaux
    format: multiple-choice
    question: "Quel ordre des niveaux va du plus bavard au plus grave ?"
    choices:
      - {text: "`TRACE`, `DEBUG`, `INFO`, `WARN`, `ERROR`", correct: true}
      - {text: "`DEBUG`, `TRACE`, `INFO`, `ERROR`, `WARN`", correct: false}
      - {text: "`INFO`, `DEBUG`, `TRACE`, `WARN`, `ERROR`", correct: false}
      - {text: "`ERROR`, `WARN`, `INFO`, `DEBUG`, `TRACE`", correct: false}
    answer: "Le dernier choix est l'ordre inverse, du plus grave au plus bavard."
  - key: qcm-configuration-par-profil
    format: multiple-choice
    question: "Quel fichier permet une configuration complète de Logback, avec des sections par profil Spring ?"
    choices:
      - {text: "`logback-spring.xml`", correct: true}
      - {text: "`logback.properties`", correct: false}
      - {text: "`log4j2-spring.xml`", correct: false}
      - {text: "`logging.yaml`", correct: false}
    answer: "Le suffixe `-spring` laisse Spring Boot charger le fichier, et y comprendre `<springProfile>` et `<springProperty>`. `log4j2-spring.xml` est l'équivalent pour Log4j 2."
  - key: qcm-identifiant-de-correlation
    format: multiple-choice
    question: "Comment ajouter un identifiant de corrélation à toutes les lignes d'une même requête ?"
    choices:
      - {text: "Le placer dans le MDC au début de la requête, et l'afficher dans le motif", correct: true}
      - {text: "Le concaténer à la main dans chacun des messages", correct: false}
      - {text: "Créer un nouveau logger pour chaque requête", correct: false}
      - {text: "En faire un niveau de journalisation supplémentaire", correct: false}
    answer: "Le MDC (Mapped Diagnostic Context) attache des valeurs au thread ; un filtre l'alimente, et le motif l'affiche avec `%X{correlation}`. Le traçage de Micrometer le fait aussi."
  - key: trous-get-logger
    format: fill-in
    question: |-
      Complète la déclaration du logger :
      ```java
      private static final Logger log = LoggerFactory.___(CommandeService.class);
      ```
    blanks:
      - [getLogger]
    answer: "`LoggerFactory.getLogger(Classe.class)` : le nom du logger est celui de la classe."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour insérer l'identifiant de la commande dans le message :
      ```java
      log.info("Commande ___ passée par {}", commande.id(), client);
      ```
    blanks:
      - ["{}"]
    answer: "Chaque `{}` reçoit l'argument suivant, dans l'ordre."
  - key: trous-level
    format: fill-in
    question: |-
      Complète pour afficher les messages `DEBUG` du package `com.boutique` :
      ```properties
      logging.___.com.boutique=debug
      ```
    blanks:
      - [level]
    answer: "`logging.level.<nom du logger>` règle un logger et tous ceux qui sont sous lui."
  - key: trous-root
    format: fill-in
    question: |-
      Complète pour régler le niveau de tous les loggers à la fois :
      ```properties
      logging.level.___=warn
      ```
    blanks:
      - [root]
    answer: "`root` est le logger racine, dont tous héritent."
  - key: bug-debug-invisible
    format: bug-fix
    question: |-
      Les messages `DEBUG` de `com.boutique.paiement.PaiementService` n'apparaissent jamais dans la console. Quelle
      correction est la bonne ?
      ```java
      private static final Logger log = LoggerFactory.getLogger(PaiementService.class);

      log.debug("Réponse du prestataire : {}", reponse.statut());
      ```
    choices:
      - {text: "Ajouter `logging.level.com.boutique.paiement=debug`", correct: true}
      - {text: "Remplacer `log.debug` par `System.out.println`", correct: false}
      - {text: "Ajouter `logging.debug.com.boutique.paiement=true`", correct: false}
      - {text: "Déclarer le logger sans le mot-clé `static`", correct: false}
    answer: |-
      ```properties
      logging.level.com.boutique.paiement=debug
      ```
      Le niveau par défaut est `INFO` : les messages `DEBUG` sont filtrés. On active `DEBUG` pour le seul package
      utile, sans inonder les journaux.
  - key: bug-pile-perdue
    format: bug-fix
    question: |-
      Après un incident, le journal ne contient que « Échec du paiement : null » : impossible de savoir où l'erreur
      est née. Quelle correction est la bonne ?
      ```java
      } catch (RuntimeException e) {
          log.error("Échec du paiement : " + e.getMessage());
      }
      ```
    choices:
      - {text: "`log.error(\"Échec du paiement {}\", commande.id(), e);`", correct: true}
      - {text: "`log.error(\"Échec du paiement : \" + e.toString());`", correct: false}
      - {text: "`log.error(\"Échec du paiement : {}\", e.getMessage());`", correct: false}
      - {text: "`log.debug(\"Échec du paiement : \" + e.getMessage());`", correct: false}
    answer: |-
      ```java
      log.error("Échec du paiement {}", commande.id(), e);
      ```
      Passée en dernier argument, l'exception est écrite avec sa pile d'appels (et ses causes). Son seul message peut
      être `null`, et ne dit jamais d'où elle vient.
  - key: bug-logger-d-une-autre-classe
    format: bug-fix
    question: |-
      Avec `logging.level.com.boutique.commande=debug`, les messages `DEBUG` de `CommandeService` n'apparaissent
      toujours pas, et ses messages `INFO` sortent sous le nom `com.boutique.facture.Facture`. Quelle correction est
      la bonne ?
      ```java
      package com.boutique.commande;

      public class CommandeService {
          private static final Logger log = LoggerFactory.getLogger(Facture.class);
      }
      ```
    choices:
      - {text: "Écrire `LoggerFactory.getLogger(CommandeService.class)`", correct: true}
      - {text: "Ajouter `logging.level.root=debug`", correct: false}
      - {text: "Renommer le champ `log` en `logger`", correct: false}
      - {text: "Retirer le mot-clé `final` du champ `log`", correct: false}
    answer: |-
      ```java
      private static final Logger log = LoggerFactory.getLogger(CommandeService.class);
      ```
      Le nom du logger vient de la classe passée à `getLogger`. Copié depuis `Facture`, il porte le nom d'un autre
      package : le réglage de `com.boutique.commande` ne le concerne pas. `root=debug` noierait tout le reste.
  - key: bug-mot-de-passe-journalise
    format: bug-fix
    question: |-
      Un audit découvre les mots de passe des clients, en clair, dans les journaux de production. Quelle correction
      est la bonne ?
      ```java
      log.info("Connexion de {} avec le mot de passe {}", login, motDePasse);
      ```
    choices:
      - {text: "`log.info(\"Connexion de {}\", login);`", correct: true}
      - {text: "`log.debug(\"Connexion de {} avec le mot de passe {}\", login, motDePasse);`", correct: false}
      - {text: "`log.info(\"Connexion de {} avec {}\", login, Base64.encode(motDePasse));`", correct: false}
      - {text: "`log.trace(\"Connexion de {} avec le mot de passe {}\", login, motDePasse);`", correct: false}
    answer: |-
      ```java
      log.info("Connexion de {}", login);
      ```
      Un secret ne doit apparaître dans aucun journal, à aucun niveau : un `DEBUG` finit toujours par être activé un
      jour. Base64 n'est qu'un encodage, réversible. Les mots de passe déjà écrits doivent être purgés, et les
      clients invités à les changer.
