notion: value
lesson: |-
  `@Value` injecte **une** propriété de configuration dans un bean :

  ```java
  @Service
  public class Facturation {
      private final String devise;
      private final int delaiPaiement;

      public Facturation(@Value("${boutique.devise}") String devise,
                         @Value("${boutique.delai-paiement:30}") int delaiPaiement) {   // 30 par défaut
          this.devise = devise;
          this.delaiPaiement = delaiPaiement;
      }
  }
  ```

  **La syntaxe.**

  | Écriture | Sens |
  |---|---|
  | `"${boutique.devise}"` | la valeur de la propriété ; le démarrage échoue si elle manque |
  | `"${boutique.devise:EUR}"` | `EUR` si la propriété manque (tout ce qui suit le premier `:`) |
  | `"${boutique.slogan:}"` | une chaîne vide si elle manque |
  | `"#{...}"` | une expression **SpEL**, évaluée (`#{T(java.lang.Math).max(2, 3)}`) |
  | `"boutique.devise"` | la chaîne littérale « boutique.devise » : sans `${}`, rien n'est lu |

  **Les conversions.** La valeur, toujours une chaîne au départ, est convertie vers le type du champ ou du
  paramètre : `int`, `boolean`, `BigDecimal`, une `List<String>` (`fr,be` donne deux éléments), et, dans Spring Boot,
  une `Duration` (`30s`, `5m`). Une valeur inconvertible fait échouer le démarrage (« Failed to convert value of type
  'java.lang.String' to required type 'int' »).

  **Une propriété manquante** sans valeur par défaut : « Could not resolve placeholder 'boutique.devise' in value
  "${boutique.devise}" ». C'est une bonne chose : l'erreur arrive au démarrage, pas en production.

  **Les pièges.**
  - Sur un champ, `@Value` est injecté **après** le constructeur : le champ vaut `null` (ou 0) pendant celui-ci.
    Pour l'utiliser dès la construction, on met `@Value` sur un **paramètre** du constructeur.
  - Sur un champ **`static`**, `@Value` est ignoré : le champ reste `null`.
  - Sur un objet créé avec `new`, rien n'est injecté.

  **Ses limites.** Des chaînes dispersées dans le code, sans validation, sans documentation des clés : pour un
  **groupe** de propriétés liées, on préfère une classe `@ConfigurationProperties`. `@Value` convient à une valeur
  isolée. Pour lire une propriété au moment voulu, `environment.getProperty("boutique.devise")` existe aussi.

  **En entretien** : « `@Value("${cle:defaut}")` injecte une propriété, avec une valeur par défaut après le
  deux-points ; `#{...}` est du SpEL. Je la mets sur un paramètre du constructeur. Pour un groupe de réglages, je
  préfère `@ConfigurationProperties`, typé et validé. »
cards:
  - key: valeur-par-defaut
    format: course
    question: "Que vaut `@Value(\"${boutique.devise:EUR}\")` quand la propriété `boutique.devise` est absente ?"
    choices:
      - {text: "`EUR`", correct: true}
      - {text: "`null`", correct: false}
      - {text: "`${boutique.devise:EUR}`", correct: false}
      - {text: "Une exception au démarrage", correct: false}
    answer: "Ce qui suit le premier deux-points est la valeur par défaut. Sans elle, le démarrage échouerait."
  - key: dollar-et-diese
    format: course
    question: "Quelle différence entre `${...}` et `#{...}` dans `@Value` ?"
    choices:
      - {text: "`${...}` lit une propriété ; `#{...}` évalue une expression SpEL", correct: true}
      - {text: "`${...}` évalue du SpEL ; `#{...}` lit une propriété", correct: false}
      - {text: "`${...}` est obligatoire ; `#{...}` est facultatif", correct: false}
      - {text: "Aucune : ce sont deux écritures de la même chose", correct: false}
    answer: "On peut les combiner : `#{'${boutique.devise}'.toLowerCase()}` lit la propriété, puis l'évalue en SpEL."
  - key: liste-separee-par-virgules
    format: course
    question: "Que reçoit `@Value(\"${boutique.pays}\") List<String> pays` quand `boutique.pays=fr,be` ?"
    choices:
      - {text: "Une liste de deux éléments, `fr` et `be`", correct: true}
      - {text: "Une liste d'un seul élément, `fr,be`", correct: false}
      - {text: "Une exception de conversion au démarrage", correct: false}
      - {text: "Une liste vide", correct: false}
    answer: "La chaîne est découpée aux virgules pour remplir la liste."
  - key: utiliser-dans-le-constructeur
    format: course
    question: "Où placer `@Value` pour pouvoir utiliser la valeur dans le constructeur ?"
    choices:
      - {text: "Sur un paramètre du constructeur", correct: true}
      - {text: "Sur un champ `private`, lu dans le constructeur", correct: false}
      - {text: "Sur un champ `static` de la classe", correct: false}
      - {text: "Sur la classe, avec le nom du champ", correct: false}
    answer: "Un champ annoté est rempli après le constructeur. En paramètre, la valeur arrive avec l'appel du constructeur, et le champ peut être `final`."
  - key: vf-champ-statique
    format: true-false
    question: "`@Value` sur un champ `static` est injecté comme sur un champ d'instance."
    truth: false
    answer: "Spring n'injecte pas les champs statiques : le champ reste `null`, sans erreur."
  - key: vf-propriete-manquante
    format: true-false
    question: "Sans valeur par défaut, une propriété absente fait échouer le démarrage."
    truth: true
    answer: "« Could not resolve placeholder 'boutique.devise' in value \"${boutique.devise}\" ». On s'en aperçoit tout de suite."
  - key: vf-sans-dollar
    format: true-false
    question: "`@Value(\"boutique.nom\")`, sans `${}`, injecte la chaîne `boutique.nom` elle-même."
    truth: true
    answer: "Sans `${}`, la valeur est un littéral. C'est une faute fréquente, et silencieuse."
  - key: vf-duree
    format: true-false
    question: "Dans une application Spring Boot, `@Value(\"${boutique.delai}\") Duration delai` accepte la valeur `30s`."
    truth: true
    answer: "Spring Boot ajoute ses convertisseurs : `30s` devient une durée de trente secondes, `5m` cinq minutes."
  - key: qcm-defaut-vide
    format: multiple-choice
    question: "Comment donner une chaîne vide comme valeur par défaut ?"
    choices:
      - {text: "`@Value(\"${boutique.slogan:}\")`", correct: true}
      - {text: "`@Value(\"${boutique.slogan:null}\")`", correct: false}
      - {text: "`@Value(\"${boutique.slogan?}\")`", correct: false}
      - {text: "`@Value(\"${boutique.slogan!}\")`", correct: false}
    answer: "Rien après le deux-points : la valeur par défaut est vide. `:null` donnerait la chaîne « null »."
  - key: qcm-quand-configuration-properties
    format: multiple-choice
    question: "Quand préférer `@ConfigurationProperties` à `@Value` ?"
    choices:
      - {text: "Pour un groupe de propriétés liées, à valider et documenter", correct: true}
      - {text: "Pour une propriété isolée, lue une seule fois", correct: false}
      - {text: "Pour une valeur calculée par une expression SpEL", correct: false}
      - {text: "Pour une propriété système passée à la JVM", correct: false}
    answer: "Une classe typée regroupe les clés, les valide au démarrage et donne l'autocomplétion. `@Value` reste commode pour une valeur isolée."
  - key: qcm-conversion-impossible
    format: multiple-choice
    question: "`@Value(\"${boutique.stock}\") int stock` avec `boutique.stock=beaucoup`. Que se passe-t-il ?"
    choices:
      - {text: "Le démarrage échoue sur une erreur de conversion", correct: true}
      - {text: "Le démarrage réussit, et `stock` vaut 0", correct: false}
      - {text: "Le démarrage réussit, et `stock` vaut -1", correct: false}
      - {text: "L'erreur n'arrive qu'au premier usage de `stock`", correct: false}
    answer: "« Failed to convert value of type 'java.lang.String' to required type 'int' » : l'injection a lieu au démarrage."
  - key: qcm-lire-au-moment-voulu
    format: multiple-choice
    question: "Quelle alternative à `@Value` lit une propriété dans le code, au moment voulu ?"
    choices:
      - {text: "`environment.getProperty(\"boutique.devise\")`", correct: true}
      - {text: "`System.getenv(\"boutique.devise\")`", correct: false}
      - {text: "`context.getBean(\"boutique.devise\")`", correct: false}
      - {text: "`Properties.load(\"boutique.devise\")`", correct: false}
    answer: "L'`Environment` de Spring voit toutes les sources (fichiers, environnement, arguments). `System.getenv` ne lit que les variables d'environnement."
  - key: trous-defaut
    format: fill-in
    question: |-
      Complète pour donner `EUR` comme valeur par défaut :
      ```java
      @Value("${boutique.devise___EUR}")
      private String devise;
      ```
    blanks:
      - [":"]
    answer: "`${cle:defaut}` : tout ce qui suit le premier deux-points."
  - key: trous-annotation-value
    format: fill-in
    question: |-
      Complète pour injecter la propriété dans le constructeur :
      ```java
      public Facturation(@___("${boutique.tva}") BigDecimal tva) {
          this.tva = tva;
      }
      ```
    blanks:
      - [Value]
    answer: "`@Value` sur un paramètre : la valeur est convertie en `BigDecimal` et disponible dès la construction."
  - key: trous-spel
    format: fill-in
    question: |-
      Complète pour évaluer une expression SpEL :
      ```java
      @Value("___{T(java.lang.Runtime).getRuntime().availableProcessors()}")
      private int processeurs;
      ```
    blanks:
      - ["#"]
    answer: "`#{...}` évalue une expression SpEL ; `${...}` lirait une propriété."
  - key: trous-duree-par-defaut
    format: fill-in
    question: |-
      Complète pour un délai par défaut de trente secondes :
      ```java
      @Value("${boutique.delai:___}")
      private Duration delai;
      ```
    blanks:
      - [30s, PT30S]
    answer: "`30s` (format de Spring Boot) ou `PT30S` (format ISO 8601) donnent tous deux trente secondes."
  - key: bug-dollar-oublie
    format: bug-fix
    question: |-
      Les factures affichent « boutique.devise » au lieu de « EUR », sans aucune erreur. Quelle correction est la
      bonne ?
      ```java
      @Service
      public class Facturation {
          @Value("boutique.devise")
          private String devise;
      }
      ```
    choices:
      - {text: "Écrire `@Value(\"${boutique.devise}\")`", correct: true}
      - {text: "Écrire `@Value(\"#boutique.devise\")`", correct: false}
      - {text: "Écrire `@Value(boutique.devise)`, sans guillemets", correct: false}
      - {text: "Écrire `@Value(\"{boutique.devise}\")`", correct: false}
    answer: |-
      ```java
      @Value("${boutique.devise}")
      private String devise;
      ```
      Sans `${}`, la valeur est prise telle quelle, comme une chaîne littérale.
  - key: bug-champ-statique
    format: bug-fix
    question: |-
      `Facturation.TVA` vaut toujours `null`, ce qui provoque une `NullPointerException` au premier calcul. Quelle
      correction est la bonne ?
      ```java
      @Service
      public class Facturation {
          @Value("${boutique.tva}")
          private static BigDecimal TVA;
      }
      ```
    choices:
      - {text: "Retirer `static`, et injecter la TVA dans un champ d'instance", correct: true}
      - {text: "Ajouter `final` au champ, en gardant `static`", correct: false}
      - {text: "Remplacer `${boutique.tva}` par `#{boutique.tva}`", correct: false}
      - {text: "Ajouter `@Lazy` sur le champ `TVA`", correct: false}
    answer: |-
      ```java
      private final BigDecimal tva;

      public Facturation(@Value("${boutique.tva}") BigDecimal tva) {
          this.tva = tva;
      }
      ```
      Spring n'injecte que dans les instances qu'il crée : un champ statique est ignoré, sans erreur.
  - key: bug-champ-lu-trop-tot
    format: bug-fix
    question: |-
      `Tarifs` calcule son coefficient dans le constructeur, et lève une `NullPointerException` au démarrage. Quelle
      correction est la bonne ?
      ```java
      @Component
      public class Tarifs {
          @Value("${boutique.tva}")
          private BigDecimal tva;
          private final BigDecimal coefficient;

          public Tarifs() {
              coefficient = BigDecimal.ONE.add(tva);
          }
      }
      ```
    choices:
      - {text: "Recevoir la TVA par un paramètre `@Value` du constructeur", correct: true}
      - {text: "Ajouter `@Autowired` sur le constructeur sans paramètre", correct: false}
      - {text: "Donner une valeur par défaut : `${boutique.tva:0.2}`", correct: false}
      - {text: "Déclarer le champ `tva` `volatile`", correct: false}
    answer: |-
      ```java
      public Tarifs(@Value("${boutique.tva}") BigDecimal tva) {
          this.coefficient = BigDecimal.ONE.add(tva);
      }
      ```
      Un champ `@Value` est rempli après le constructeur : pendant celui-ci, il vaut `null`. Une valeur par défaut
      n'y change rien.
  - key: bug-propriete-introuvable
    format: bug-fix
    question: |-
      En développement, le démarrage échoue : « Could not resolve placeholder 'boutique.slogan' in value
      "${boutique.slogan}" ». Le slogan est facultatif : sans lui, rien ne s'affiche. Quelle correction est la bonne ?
      ```java
      @Value("${boutique.slogan}")
      private String slogan;
      ```
    choices:
      - {text: "Donner une valeur par défaut vide : `${boutique.slogan:}`", correct: true}
      - {text: "Lire une expression SpEL : `#{boutique.slogan}`", correct: false}
      - {text: "Rendre le champ `slogan` `static` dans la classe", correct: false}
      - {text: "Ajouter `@Lazy` sur la déclaration du champ `slogan`", correct: false}
    answer: |-
      ```java
      @Value("${boutique.slogan:}")
      private String slogan;
      ```
      Une propriété facultative a une valeur par défaut. Pour une propriété obligatoire, l'échec au démarrage est le
      bon comportement : on ajoute alors la propriété à la configuration.
