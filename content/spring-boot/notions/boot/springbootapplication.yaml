notion: springbootapplication
lesson: |-
  Toute application Spring Boot part d'une classe comme celle-ci :

  ```java
  package com.boutique;

  @SpringBootApplication
  public class BoutiqueApplication {
      public static void main(String[] args) {
          SpringApplication.run(BoutiqueApplication.class, args);
      }
  }
  ```

  **`@SpringBootApplication` regroupe trois annotations.**

  | Annotation | Effet |
  |---|---|
  | `@SpringBootConfiguration` | la classe est une `@Configuration` : elle peut déclarer des `@Bean` |
  | `@EnableAutoConfiguration` | active l'auto-configuration |
  | `@ComponentScan` | scanne le package de la classe et ses sous-packages |

  D'où la règle : la classe principale va dans le **package racine** (`com.boutique`), au-dessus de tous les autres.
  Dans le **package par défaut** (sans `package`), le scan parcourrait tout le classpath : Spring Boot avertit
  (« Your ApplicationContext is unlikely to start due to a @ComponentScan of the default package ») et échoue.

  Ses attributs : `exclude` (écarter une auto-configuration), `scanBasePackages` (élargir le scan). Elle n'inclut
  **pas** `@ConfigurationPropertiesScan`, qu'on ajoute au besoin.

  **Ce que fait `SpringApplication.run(BoutiqueApplication.class, args)`.**

  1. Prépare l'**environnement** : propriétés, profils, arguments `--cle=valeur` (d'où l'importance de passer
     `args`).
  2. Affiche la bannière.
  3. Choisit le type de contexte d'après le **classpath** : servlet (Spring MVC et Tomcat présents), réactif
     (WebFlux), ou sans web.
  4. **Rafraîchit** le contexte : crée les beans, démarre le serveur embarqué.
  5. Appelle les runners (`CommandLineRunner`, `ApplicationRunner`), puis publie `ApplicationReadyEvent`.
  6. Renvoie le `ConfigurableApplicationContext`.

  La classe passée à `run` doit être celle qui porte `@SpringBootApplication` : avec une autre classe, ni scan ni
  auto-configuration, et une application web échoue (« no ServletWebServerFactory bean defined »).

  **Régler le démarrage.** Par propriétés (`spring.main.web-application-type=none`,
  `spring.main.banner-mode=off`), ou par l'API :

  ```java
  new SpringApplicationBuilder(BoutiqueApplication.class)
          .web(WebApplicationType.NONE)       // un traitement par lots, sans serveur
          .run(args);
  ```

  **En entretien** : « `@SpringBootApplication` réunit `@Configuration`, `@EnableAutoConfiguration` et
  `@ComponentScan` ; je la place dans le package racine. `SpringApplication.run` prépare l'environnement, crée le
  contexte adapté au classpath, démarre les beans et le serveur, lance les runners et renvoie le contexte. »
cards:
  - key: trois-annotations
    format: course
    question: "Quelles annotations `@SpringBootApplication` regroupe-t-elle ?"
    choices:
      - {text: "`@SpringBootConfiguration`, `@EnableAutoConfiguration` et `@ComponentScan`", correct: true}
      - {text: "`@Configuration`, `@EnableWebMvc` et `@EnableTransactionManagement`", correct: false}
      - {text: "`@Component`, `@Import` et `@PropertySource`", correct: false}
      - {text: "`@SpringBootConfiguration`, `@EnableAsync` et `@EnableCaching`", correct: false}
    answer: "Une configuration, l'auto-configuration et le scan des composants. `@EnableAsync` ou `@EnableCaching` s'ajoutent à la main."
  - key: retour-de-run
    format: course
    question: "Que renvoie `SpringApplication.run(BoutiqueApplication.class, args)` ?"
    choices:
      - {text: "Le `ConfigurableApplicationContext` démarré", correct: true}
      - {text: "Rien : la méthode est déclarée `void`", correct: false}
      - {text: "Le code de sortie du processus", correct: false}
      - {text: "Le serveur web embarqué, à démarrer", correct: false}
    answer: "Le contexte démarré, avec ses beans. Utile dans un outil en ligne de commande, ou pour le fermer avec `close()`."
  - key: place-de-la-classe
    format: course
    question: "Où placer la classe annotée `@SpringBootApplication` ?"
    choices:
      - {text: "Dans le package racine, au-dessus de tous les autres", correct: true}
      - {text: "Dans le package `config`, avec les autres configurations", correct: false}
      - {text: "Dans le package par défaut, sans déclaration `package`", correct: false}
      - {text: "Dans un module Maven séparé de l'application", correct: false}
    answer: "Le scan part de son package et descend : tout le reste doit être en dessous. Le package par défaut ferait scanner tout le classpath."
  - key: choix-du-type-de-contexte
    format: course
    question: "Comment `SpringApplication` choisit-il entre une application web servlet, réactive ou sans web ?"
    choices:
      - {text: "D'après les classes présentes dans le classpath", correct: true}
      - {text: "D'après le nom de la classe principale", correct: false}
      - {text: "D'après le premier argument de la ligne de commande", correct: false}
      - {text: "Il démarre toujours une application web servlet", correct: false}
    answer: "Spring MVC présent : servlet ; seulement WebFlux : réactif ; aucun des deux : pas de web. `spring.main.web-application-type` force le choix."
  - key: vf-scan-depuis-son-package
    format: true-false
    question: "`@SpringBootApplication` active le scan des composants à partir du package de la classe annotée."
    truth: true
    answer: "Par `@ComponentScan`, qui part de ce package et parcourt ses sous-packages."
  - key: vf-pas-de-properties-scan
    format: true-false
    question: "`@SpringBootApplication` inclut `@ConfigurationPropertiesScan`."
    truth: false
    answer: "Il faut l'ajouter, ou enregistrer chaque classe avec `@EnableConfigurationProperties`. Sinon, un record `@ConfigurationProperties` n'est pas un bean."
  - key: vf-classe-de-configuration
    format: true-false
    question: "La classe `@SpringBootApplication` est elle-même une classe de configuration, qui peut déclarer des méthodes `@Bean`."
    truth: true
    answer: "`@SpringBootConfiguration` est une `@Configuration`. Pour la lisibilité, on range souvent les `@Bean` dans des classes dédiées."
  - key: vf-args-et-proprietes
    format: true-false
    question: "Le paramètre `args` passé à `SpringApplication.run` permet de régler des propriétés avec `--cle=valeur`."
    truth: true
    answer: "`java -jar app.jar --server.port=9090` : les arguments sont une source de propriétés, et l'une des plus fortes."
  - key: qcm-exclure-une-auto-configuration
    format: multiple-choice
    question: "Comment empêcher une auto-configuration précise de s'appliquer ?"
    choices:
      - {text: "`@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)`", correct: true}
      - {text: "`@SpringBootApplication(scanBasePackages = \"!datasource\")`", correct: false}
      - {text: "`@SpringBootApplication(proxyBeanMethods = false)`", correct: false}
      - {text: "`@ComponentScan(excludeFilters = DataSource.class)`", correct: false}
    answer: "`exclude` écarte une classe d'auto-configuration ; la propriété `spring.autoconfigure.exclude` fait de même depuis la configuration."
  - key: qcm-builder
    format: multiple-choice
    question: "Quelle classe permet de régler le démarrage de façon fluide, par exemple pour désactiver le web ?"
    choices:
      - {text: "`SpringApplicationBuilder`", correct: true}
      - {text: "`ApplicationContextRunner`", correct: false}
      - {text: "`SpringBootConfiguration`", correct: false}
      - {text: "`ConfigurableEnvironment`", correct: false}
    answer: "`new SpringApplicationBuilder(App.class).web(WebApplicationType.NONE).run(args)`. `ApplicationContextRunner` sert aux tests."
  - key: qcm-sans-serveur
    format: multiple-choice
    question: "Quelle propriété démarre l'application sans serveur web, même si Tomcat est dans le classpath ?"
    choices:
      - {text: "`spring.main.web-application-type=none`", correct: true}
      - {text: "`server.enabled=false`", correct: false}
      - {text: "`server.port=0`", correct: false}
      - {text: "`spring.web.enabled=false`", correct: false}
    answer: "Le contexte est alors ordinaire. `server.port=0` démarre bien un serveur, sur un port libre choisi au hasard."
  - key: qcm-banniere
    format: multiple-choice
    question: "Quelle propriété supprime la bannière affichée au démarrage ?"
    choices:
      - {text: "`spring.main.banner-mode=off`", correct: true}
      - {text: "`spring.banner.enabled=false`", correct: false}
      - {text: "`logging.banner=false`", correct: false}
      - {text: "`spring.main.log-startup-info=false`", correct: false}
    answer: "`banner-mode` vaut `console`, `log` ou `off`. `log-startup-info` masque les lignes « Starting... » et « Started... », pas la bannière."
  - key: trous-annotation-principale
    format: fill-in
    question: |-
      Complète la classe principale :
      ```java
      @___
      public class BoutiqueApplication {
          public static void main(String[] args) {
              SpringApplication.run(BoutiqueApplication.class, args);
          }
      }
      ```
    blanks:
      - [SpringBootApplication]
    answer: "`@SpringBootApplication` : configuration, auto-configuration et scan des composants."
  - key: trous-run
    format: fill-in
    question: |-
      Complète pour démarrer l'application :
      ```java
      public static void main(String[] args) {
          SpringApplication.___(BoutiqueApplication.class, args);
      }
      ```
    blanks:
      - [run]
    answer: "`SpringApplication.run` crée et démarre le contexte, puis le renvoie."
  - key: trous-scan-base-packages
    format: fill-in
    question: |-
      Complète pour scanner aussi le package parent `com.boutique` :
      ```java
      @SpringBootApplication(___ = "com.boutique")
      public class BoutiqueApplication {
      }
      ```
    blanks:
      - [scanBasePackages]
    answer: "`scanBasePackages` élargit le scan. Déplacer la classe dans `com.boutique` serait plus simple."
  - key: trous-sans-web
    format: fill-in
    question: |-
      Complète pour démarrer ce traitement par lots sans serveur web :
      ```java
      new SpringApplicationBuilder(Import.class)
              .web(WebApplicationType.___)
              .run(args);
      ```
    blanks:
      - [NONE]
    answer: "`WebApplicationType.NONE` : un contexte sans serveur, même si Tomcat est dans le classpath."
  - key: bug-package-frere
    format: bug-fix
    question: |-
      Le démarrage échoue : « Parameter 0 of constructor in com.boutique.app.CommandeController required a bean of type
      'com.boutique.commande.CommandeService' that could not be found. » `CommandeService` est bien annoté
      `@Service`. Quelle correction est la bonne ?
      ```java
      package com.boutique.app;

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
    choices:
      - {text: "Déplacer `BoutiqueApplication` dans le package `com.boutique`", correct: true}
      - {text: "Ajouter `@Autowired` sur le constructeur du contrôleur", correct: false}
      - {text: "Ajouter `@Primary` sur la classe `CommandeService`", correct: false}
      - {text: "Déplacer `CommandeService` dans le package par défaut", correct: false}
    answer: |-
      ```java
      package com.boutique;

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
      Le scan part de `com.boutique.app` : le package frère `com.boutique.commande` n'est jamais parcouru. Depuis
      `com.boutique`, tous les sous-packages le sont.
  - key: bug-mauvaise-classe-a-run
    format: bug-fix
    question: |-
      Le démarrage échoue : « Web application could not be started as there was no
      org.springframework.boot.web.server.servlet.ServletWebServerFactory bean defined in the context. » Quelle
      correction est la bonne ?
      ```java
      public class Lanceur {
          public static void main(String[] args) {
              SpringApplication.run(Lanceur.class, args);
          }
      }

      @SpringBootApplication
      public class BoutiqueApplication {
      }
      ```
    choices:
      - {text: "Passer `BoutiqueApplication.class` à `SpringApplication.run`", correct: true}
      - {text: "Ajouter `spring-boot-starter-tomcat` aux dépendances", correct: false}
      - {text: "Annoter `Lanceur` avec `@Component`", correct: false}
      - {text: "Appeler `SpringApplication.run` sans l'argument `args`", correct: false}
    answer: |-
      ```java
      SpringApplication.run(BoutiqueApplication.class, args);
      ```
      `Lanceur` n'a ni auto-configuration ni scan : aucun bean ne fournit le serveur Tomcat, pourtant présent dans le
      classpath. C'est la classe `@SpringBootApplication` qui doit être passée.
  - key: bug-package-par-defaut
    format: bug-fix
    question: |-
      Au démarrage, Spring Boot affiche « ** WARNING ** : Your ApplicationContext is unlikely to start due to a
      @ComponentScan of the default package. », puis échoue. Quelle correction est la bonne ?
      ```java
      import org.springframework.boot.SpringApplication;
      import org.springframework.boot.autoconfigure.SpringBootApplication;

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
    choices:
      - {text: "Déclarer un package, `package com.boutique;`, et y ranger les classes", correct: true}
      - {text: "Ajouter `scanBasePackages = \"\"` à l'annotation", correct: false}
      - {text: "Retirer l'annotation `@SpringBootApplication`", correct: false}
      - {text: "Renommer la classe en `Application`", correct: false}
    answer: |-
      ```java
      package com.boutique;

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
      Sans package, le scan part de la racine du classpath et lit toutes les bibliothèques. Une classe principale dans
      un vrai package, au-dessus des autres, limite le scan à l'application.
  - key: bug-arguments-ignores
    format: bug-fix
    question: |-
      L'application est lancée avec `java -jar boutique.jar --server.port=9090`, mais elle démarre toujours sur le port
      8080. Quelle correction est la bonne ?
      ```java
      @SpringBootApplication
      public class BoutiqueApplication {
          public static void main(String[] args) {
              SpringApplication.run(BoutiqueApplication.class);
          }
      }
      ```
    choices:
      - {text: "Transmettre `args` : `SpringApplication.run(BoutiqueApplication.class, args)`", correct: true}
      - {text: "Écrire `-Dserver.port=9090` après le nom du jar", correct: false}
      - {text: "Ajouter `@PropertySource(\"args\")` sur la classe", correct: false}
      - {text: "Écrire `--port=9090` au lieu de `--server.port=9090`", correct: false}
    answer: |-
      ```java
      SpringApplication.run(BoutiqueApplication.class, args);
      ```
      Sans `args`, Spring Boot ne voit pas la ligne de commande : `--server.port` n'atteint jamais l'environnement.
      Une option `-D` placée après le jar est elle aussi passée au programme, pas à la JVM.
