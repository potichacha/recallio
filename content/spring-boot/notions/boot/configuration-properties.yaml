notion: configuration-properties
lesson: |-
  `@ConfigurationProperties` lie **un groupe de propriétés** à une classe Java **typée**, et la **valide** au
  démarrage. C'est la façon recommandée de lire sa configuration dans Spring Boot.

  ```properties
  boutique.livraison.frais=4.90
  boutique.livraison.seuil-gratuite=50
  boutique.livraison.delai=3d
  ```

  ```java
  @ConfigurationProperties("boutique.livraison")
  @Validated
  public record LivraisonProperties(
          @NotNull @PositiveOrZero BigDecimal frais,
          @NotNull @Positive BigDecimal seuilGratuite,
          @DefaultValue("2d") Duration delai) {
  }

  @SpringBootApplication
  @ConfigurationPropertiesScan          // enregistre les classes @ConfigurationProperties du package
  public class BoutiqueApplication { ... }

  @Service
  public class LivraisonService {
      public LivraisonService(LivraisonProperties livraison) { ... }   // un objet typé, injecté
  }
  ```

  **L'enregistrer.** L'annotation seule ne crée **pas** de bean : il faut `@ConfigurationPropertiesScan`,
  `@EnableConfigurationProperties(LivraisonProperties.class)`, ou `@Component` sur une classe JavaBean.

  **Deux façons de lier.**
  - Un **record** (ou une classe à un seul constructeur) se lie **par son constructeur** : la configuration est
    **immuable**. `@DefaultValue` donne la valeur d'un paramètre absent.
  - Une classe **JavaBean** se lie par ses **setters** : sans setter, un champ n'est pas rempli.

  **La liaison souple** (relaxed binding). Le composant `seuilGratuite` reçoit `boutique.livraison.seuil-gratuite`
  (la forme recommandée), `boutique.livraison.seuilGratuite`, ou la variable d'environnement
  `BOUTIQUE_LIVRAISON_SEUILGRATUITE`. Le **préfixe**, lui, doit être en kebab-case : `@ConfigurationProperties
  ("maBoutique")` fait échouer le démarrage (« Canonical names should be kebab-case »).

  **Les types.** `Duration` (`30s`, `5m`, `3d` ; un nombre seul compte en **millisecondes**, sauf
  `@DurationUnit(ChronoUnit.SECONDS)`), `DataSize` (`10MB`), `List`, `Map`, des records imbriqués.

  **La validation.** Avec `@Validated` et les contraintes de Jakarta Validation, une configuration invalide arrête le
  démarrage avec un rapport précis (« Binding to target ... failed », la propriété, la valeur, la raison). Sans
  `@Validated`, les contraintes sont **ignorées**. Un objet imbriqué n'est validé que si son composant porte `@Valid`.

  **L'outillage.** `spring-boot-configuration-processor` génère les métadonnées des clés : autocomplétion et
  documentation dans l'IDE. Un `ApplicationContextRunner` teste la liaison et la validation sans démarrer toute
  l'application.

  | | `@Value` | `@ConfigurationProperties` |
  |---|---|---|
  | portée | une valeur | un groupe de valeurs |
  | type | converti champ par champ | un objet typé, immuable avec un record |
  | validation | non | oui, avec `@Validated` |
  | liaison souple | limitée | complète |
  | métadonnées pour l'IDE | non | oui |

  **En entretien** : « Pour un groupe de réglages, j'écris un record `@ConfigurationProperties`, validé par
  `@Validated`, enregistré par `@ConfigurationPropertiesScan`, et je l'injecte par constructeur. La liaison souple
  accepte le kebab-case et les variables d'environnement, et une configuration invalide arrête le démarrage. »
cards:
  - key: devenir-un-bean
    format: course
    question: "Comment un record annoté `@ConfigurationProperties` devient-il un bean ?"
    choices:
      - {text: "Par `@ConfigurationPropertiesScan` ou `@EnableConfigurationProperties`", correct: true}
      - {text: "Tout seul : `@SpringBootApplication` le détecte d'office", correct: false}
      - {text: "Par `@Value` posée sur chacun de ses composants", correct: false}
      - {text: "Par `@Bean` posée sur la déclaration du record", correct: false}
    answer: "`@SpringBootApplication` n'inclut pas `@ConfigurationPropertiesScan`. Sans enregistrement, l'injection échoue : aucun bean de ce type."
  - key: duree-sans-unite
    format: course
    question: "Que vaut un composant `Duration delai` lié à `boutique.delai=30`, sans autre précision ?"
    choices:
      - {text: "30 millisecondes", correct: true}
      - {text: "30 secondes", correct: false}
      - {text: "30 minutes", correct: false}
      - {text: "Une erreur de conversion", correct: false}
    answer: "Un nombre seul compte en millisecondes. On écrit `30s`, ou l'on pose `@DurationUnit(ChronoUnit.SECONDS)` sur le composant."
  - key: interet-du-record
    format: course
    question: "Pourquoi préférer un record à une classe avec setters pour une configuration ?"
    choices:
      - {text: "Il se lie par son constructeur : la configuration est immuable", correct: true}
      - {text: "Il se lie plus vite, car il n'a aucun champ", correct: false}
      - {text: "C'est le seul type que Spring sait valider", correct: false}
      - {text: "Il dispense d'écrire le préfixe des propriétés", correct: false}
    answer: "Personne ne peut modifier la configuration après le démarrage. Les classes avec setters se lient et se valident aussi, mais restent modifiables."
  - key: valider-un-objet-imbrique
    format: course
    question: "Un record de configuration `@Validated` contient un record `Adresse` dont le composant porte `@NotBlank`. Que faut-il pour que ce composant soit vérifié ?"
    choices:
      - {text: "Annoter le composant `adresse` avec `@Valid`", correct: true}
      - {text: "Rien : la validation descend toute seule", correct: false}
      - {text: "Annoter `Adresse` avec `@ConfigurationProperties`", correct: false}
      - {text: "Enregistrer `Adresse` avec `@ConfigurationPropertiesScan`", correct: false}
    answer: "Comme partout en Jakarta Validation, la validation ne descend dans un objet que par `@Valid`. Sans lui, une ville vide passe."
  - key: vf-prefixe-camelcase
    format: true-false
    question: "Le préfixe d'un `@ConfigurationProperties` peut s'écrire en camelCase, comme `maBoutique`."
    truth: false
    answer: "Le démarrage échoue : « Configuration property name 'maBoutique' is not valid ». On écrit `ma-boutique`."
  - key: vf-javabean-et-setters
    format: true-false
    question: "Une classe JavaBean liée par `@ConfigurationProperties` a besoin de setters pour recevoir les valeurs."
    truth: true
    answer: "Sans constructeur à lier, Spring passe par les setters. Un champ sans setter garde sa valeur initiale."
  - key: vf-durationunit
    format: true-false
    question: "Avec `@DurationUnit(ChronoUnit.SECONDS)` sur le composant, `30` est lu comme trente secondes."
    truth: true
    answer: "L'unité ne change que pour les nombres seuls : `2m` reste deux minutes."
  - key: vf-liaison-souple
    format: true-false
    question: "Les propriétés `boutique.stock-max`, `boutique.stockMax` et la variable `BOUTIQUE_STOCKMAX` alimentent toutes le composant `stockMax`."
    truth: true
    answer: "C'est la liaison souple. Dans les fichiers, on écrit de préférence le kebab-case."
  - key: qcm-valeur-par-defaut
    format: multiple-choice
    question: "Comment donner une valeur par défaut à un composant d'un record de configuration ?"
    choices:
      - {text: "`@DefaultValue(\"3\")` sur le composant", correct: true}
      - {text: "`@Value(\"3\")` sur le composant", correct: false}
      - {text: "Une initialisation `int essais = 3` dans le record", correct: false}
      - {text: "`@ConfigurationProperties(defaults = \"essais=3\")`", correct: false}
    answer: "`@DefaultValue` (de `org.springframework.boot.context.properties.bind`) s'applique quand la propriété manque. Un record ne peut pas initialiser ses composants."
  - key: qcm-autocompletion
    format: multiple-choice
    question: "Quelle dépendance génère les métadonnées qui donnent l'autocomplétion de tes propriétés dans l'IDE ?"
    choices:
      - {text: "`spring-boot-configuration-processor`", correct: true}
      - {text: "`spring-boot-properties-migrator`", correct: false}
      - {text: "`spring-boot-devtools`", correct: false}
      - {text: "`spring-boot-starter-validation`", correct: false}
    answer: "Ce processeur d'annotations écrit `META-INF/spring-configuration-metadata.json`. Le migrateur, lui, signale les propriétés renommées entre deux versions."
  - key: qcm-validated
    format: multiple-choice
    question: "Quelle annotation fait vérifier les contraintes d'un record de configuration au démarrage ?"
    choices:
      - {text: "`@Validated`", correct: true}
      - {text: "`@Checked`", correct: false}
      - {text: "`@Constraint`", correct: false}
      - {text: "`@Verified`", correct: false}
    answer: "`@Validated` (de Spring), avec les contraintes de Jakarta Validation (`@NotNull`, `@Positive`...) sur les composants."
  - key: qcm-taille-de-fichier
    format: multiple-choice
    question: "Quel type choisir pour une propriété `boutique.upload.taille-max=10MB` ?"
    choices:
      - {text: "`DataSize`", correct: true}
      - {text: "`long`", correct: false}
      - {text: "`Duration`", correct: false}
      - {text: "`BigInteger`", correct: false}
    answer: "`DataSize` comprend `10MB`, `512KB` et offre `toBytes()`. Un `long` ne saurait pas convertir « 10MB »."
  - key: trous-annotation
    format: fill-in
    question: |-
      Complète pour lier les propriétés `boutique.livraison.*` à ce record :
      ```java
      @___("boutique.livraison")
      public record LivraisonProperties(BigDecimal frais) {
      }
      ```
    blanks:
      - [ConfigurationProperties]
    answer: "`@ConfigurationProperties` et le préfixe des clés."
  - key: trous-scan
    format: fill-in
    question: |-
      Complète pour enregistrer tous les records `@ConfigurationProperties` du package :
      ```java
      @SpringBootApplication
      @___
      public class BoutiqueApplication {
      }
      ```
    blanks:
      - [ConfigurationPropertiesScan]
    answer: "`@ConfigurationPropertiesScan` parcourt le package de la classe et ses sous-packages."
  - key: trous-default-value
    format: fill-in
    question: |-
      Complète pour que `essais` vaille 3 quand la propriété manque :
      ```java
      @ConfigurationProperties("boutique.relance")
      public record RelanceProperties(@___("3") int essais) {
      }
      ```
    blanks:
      - [DefaultValue]
    answer: "`@DefaultValue` donne la valeur d'un composant absent de la configuration."
  - key: trous-enable
    format: fill-in
    question: |-
      Complète pour enregistrer `LivraisonProperties` sans scanner tout le package :
      ```java
      @Configuration
      @___(LivraisonProperties.class)
      public class LivraisonConfig {
      }
      ```
    blanks:
      - [EnableConfigurationProperties]
    answer: "`@EnableConfigurationProperties` enregistre les classes nommées."
  - key: bug-non-enregistree
    format: bug-fix
    question: |-
      Le démarrage échoue : « Parameter 0 of constructor in com.boutique.LivraisonService required a bean of type
      'com.boutique.LivraisonProperties' that could not be found. » Quelle correction est la bonne ?
      ```java
      @ConfigurationProperties("boutique.livraison")
      public record LivraisonProperties(BigDecimal frais) {}

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
    choices:
      - {text: "Ajouter `@ConfigurationPropertiesScan` sur `BoutiqueApplication`", correct: true}
      - {text: "Ajouter `@Validated` sur le record `LivraisonProperties`", correct: false}
      - {text: "Ajouter `@Value` sur le composant `frais` du record", correct: false}
      - {text: "Ajouter `@Primary` sur le record `LivraisonProperties`", correct: false}
    answer: |-
      ```java
      @SpringBootApplication
      @ConfigurationPropertiesScan
      public class BoutiqueApplication { ... }
      ```
      L'annotation `@ConfigurationProperties` décrit la liaison, mais ne crée pas de bean. Le scan (ou
      `@EnableConfigurationProperties`) l'enregistre.
  - key: bug-prefixe-camelcase
    format: bug-fix
    question: |-
      Le démarrage échoue : « Configuration property name 'maBoutique' is not valid ... Canonical names should be
      kebab-case ('-' separated), lowercase alpha-numeric characters and must start with a letter ». Quelle correction
      est la bonne ?
      ```java
      @ConfigurationProperties("maBoutique")
      public record BoutiqueProperties(String nom) {}
      ```
    choices:
      - {text: "Écrire le préfixe en kebab-case : `\"ma-boutique\"`", correct: true}
      - {text: "Écrire le préfixe en majuscules : `\"MA_BOUTIQUE\"`", correct: false}
      - {text: "Écrire le préfixe avec un point : `\"ma.Boutique\"`", correct: false}
      - {text: "Ajouter `ignoreInvalidFields = true` à l'annotation", correct: false}
    answer: |-
      ```java
      @ConfigurationProperties("ma-boutique")
      ```
      Le préfixe est un nom canonique : minuscules, chiffres et tirets. Les propriétés `ma-boutique.nom` (ou
      `MA_BOUTIQUE_NOM` dans l'environnement) le rempliront.
  - key: bug-contraintes-ignorees
    format: bug-fix
    question: |-
      L'application démarre alors que `boutique.paiement.url` est absente ; le premier paiement échoue ensuite sur
      une URL `null`. Quelle correction est la bonne ?
      ```java
      @ConfigurationProperties("boutique.paiement")
      public record PaiementProperties(@NotBlank String url) {}
      ```
    choices:
      - {text: "Ajouter `@Validated` sur le record", correct: true}
      - {text: "Ajouter `@Valid` sur le composant `url`", correct: false}
      - {text: "Ajouter `@DefaultValue(\"\")` sur le composant `url`", correct: false}
      - {text: "Remplacer `@NotBlank` par `@NotNull`", correct: false}
    answer: |-
      ```java
      @ConfigurationProperties("boutique.paiement")
      @Validated
      public record PaiementProperties(@NotBlank String url) {}
      ```
      Sans `@Validated`, les contraintes sont ignorées. Avec elle, le démarrage échoue : « Binding to target ...
      failed », et la propriété fautive est nommée.
  - key: bug-duree-en-millisecondes
    format: bug-fix
    question: |-
      Les paniers devaient expirer après trente minutes d'inactivité ; ils expirent presque aussitôt. Quelle
      correction est la bonne ?
      ```properties
      boutique.panier.expiration=30
      ```
      ```java
      @ConfigurationProperties("boutique.panier")
      public record PanierProperties(Duration expiration) {}
      ```
    choices:
      - {text: "Écrire l'unité : `boutique.panier.expiration=30m`", correct: true}
      - {text: "Écrire `boutique.panier.expiration=30min`", correct: false}
      - {text: "Remplacer `Duration` par `int` dans le record", correct: false}
      - {text: "Écrire `boutique.panier.expiration=1800000s`", correct: false}
    answer: |-
      ```properties
      boutique.panier.expiration=30m
      ```
      Un nombre seul compte en millisecondes : 30 ms. Le suffixe `m` (ou `@DurationUnit(ChronoUnit.MINUTES)` sur le
      composant) donne trente minutes. `min` n'est pas une unité reconnue.
  - key: situation-quinze-value
    format: scenario
    question: |-
      Quinze `@Value("${boutique.paiement...}")` sont dispersés dans le code, sans validation. Que proposes-tu ?
    choices:
      - {text: "Un record `PaiementProperties` lié au préfixe, validé et injecté", correct: true}
      - {text: "Une classe de constantes `static final` qui recopie les valeurs", correct: false}
      - {text: "Un `@PostConstruct` qui relit le fichier de propriétés à la main", correct: false}
      - {text: "Rien : `@Value` est la façon recommandée de lire un groupe", correct: false}
    answer: |-
      Les clés sont regroupées en un seul endroit, typées, validées au démarrage et documentées pour l'IDE. Les
      services reçoivent un seul objet, simple à construire dans un test.
  - key: situation-faute-decouverte-trop-tard
    format: scenario
    question: |-
      Une faute dans l'URL du service de paiement n'a été découverte qu'au premier paiement, en production. Comment
      l'éviter ?
    choices:
      - {text: "Une configuration typée et `@Validated`, vérifiée au démarrage", correct: true}
      - {text: "Un test manuel de chaque propriété après le déploiement", correct: false}
      - {text: "Une valeur par défaut pour chacune des propriétés", correct: false}
      - {text: "Un `try`/`catch` autour de chaque appel au service", correct: false}
    answer: |-
      Avec `@NotBlank`, `@Pattern` ou `@URL` sur les composants, une valeur absente ou mal formée arrête le démarrage :
      le déploiement échoue au lieu de servir des erreurs aux clients.
  - key: situation-tester-la-validation
    format: scenario
    question: |-
      Tu veux tester qu'un seuil nul empêche le démarrage, sans lancer toute l'application. Que fais-tu ?
    choices:
      - {text: "Un `ApplicationContextRunner`, et `assertThat(context).hasFailed()`", correct: true}
      - {text: "Un `@SpringBootTest`, dont on attend qu'il échoue", correct: false}
      - {text: "Un test qui modifie `application.properties` sur le disque", correct: false}
      - {text: "Un test manuel, en lançant l'application à la main", correct: false}
    answer: |-
      ```java
      new ApplicationContextRunner()
              .withUserConfiguration(Config.class)
              .withPropertyValues("boutique.livraison.seuil-gratuite=0")
              .run(context -> assertThat(context).hasFailed());
      ```
      Le contexte ne contient que la configuration testée : le test tourne en quelques millisecondes.
  - key: situation-groupe-par-environnement
    format: scenario
    question: |-
      En entretien : « Comment lis-tu la configuration de ton application dans le code ? » Quelle réponse est la plus
      solide ?
    choices:
      - {text: "Des records `@ConfigurationProperties` validés, injectés par constructeur", correct: true}
      - {text: "Des appels à `System.getProperty` dans chaque méthode", correct: false}
      - {text: "Des `@Value` sur des champs `static`, lisibles de partout", correct: false}
      - {text: "Un fichier `.properties` relu à la main par chaque service", correct: false}
    answer: |-
      Typée, immuable, validée au démarrage, documentée : la configuration se teste comme n'importe quel objet. `@Value`
      reste acceptable pour une valeur isolée.
