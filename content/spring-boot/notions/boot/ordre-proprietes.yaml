notion: ordre-proprietes
lesson: |-
  Une même propriété peut venir de plusieurs **sources**. Spring Boot les range dans un ordre fixe : quand deux
  sources donnent la même clé, **la plus forte l'emporte**. C'est ce qui permet de livrer un seul jar, et de le
  régler différemment sur chaque machine.

  **De la plus forte à la plus faible** (les principales) :

  | Rang | Source | Exemple |
  |---|---|---|
  | 1 | propriétés des tests | `@SpringBootTest(properties = ...)`, `@TestPropertySource` |
  | 2 | arguments de la ligne de commande | `--server.port=9090` |
  | 3 | `SPRING_APPLICATION_JSON` | `{"server":{"port":9090}}` dans une variable |
  | 4 | propriétés système de la JVM | `-Dserver.port=9090` |
  | 5 | variables d'environnement | `SERVER_PORT=9090` |
  | 6 | fichiers de profil **hors** du jar | `./config/application-prod.properties` |
  | 7 | fichiers **hors** du jar | `./application.properties`, `./config/...` |
  | 8 | fichiers de profil **dans** le jar | `application-prod.properties` du classpath |
  | 9 | fichiers **dans** le jar | `application.properties` du classpath |
  | 10 | `@PropertySource` sur une classe `@Configuration` | |
  | 11 | propriétés par défaut | `SpringApplication.setDefaultProperties` |

  À retenir : **ce qui est passé au lancement l'emporte sur ce qui est écrit dans le jar**, et un fichier de profil
  l'emporte sur le fichier commun.

  ```bash
  # le jar dit server.port=8080 ; ici, c'est 9090 qui gagne
  SERVER_PORT=7070 java -jar boutique.jar --server.port=9090
  ```

  **Les variables d'environnement** suivent une règle de nommage : on remplace les points par des tirets bas, on
  retire les tirets, on met en majuscules. `spring.datasource.url` devient `SPRING_DATASOURCE_URL`.

  **Changer les emplacements.** `spring.config.location` **remplace** les emplacements par défaut des fichiers ;
  `spring.config.additional-location` **ajoute** les siens ; `spring.config.import` charge un fichier depuis la
  configuration.

  **`@PropertySource`** est presque tout en bas, et arrive tard (au rafraîchissement du contexte) : trop tard pour
  régler `logging.*` ou `spring.main.*`. On lui préfère `spring.config.import`.

  **Comprendre une valeur inattendue.** Le point d'accès Actuator `/actuator/env` liste les sources, dans l'ordre,
  et la source de chaque propriété (avec des valeurs masquées par défaut).

  **En entretien** : « Les arguments de la ligne de commande l'emportent sur les propriétés système, qui l'emportent
  sur les variables d'environnement, puis viennent les fichiers : hors du jar avant dans le jar, profil avant
  commun. On livre un jar unique et on le règle par l'environnement. »
cards:
  - key: source-la-plus-forte
    format: course
    question: "Laquelle de ces sources l'emporte sur les trois autres ?"
    choices:
      - {text: "Les arguments de la ligne de commande (`--cle=valeur`)", correct: true}
      - {text: "Les variables d'environnement du système", correct: false}
      - {text: "Le fichier `application.properties` du jar", correct: false}
      - {text: "`@PropertySource` sur une classe de configuration", correct: false}
    answer: "Hors des propriétés de test, la ligne de commande est la source la plus forte : c'est le réglage le plus explicite."
  - key: environnement-contre-fichier
    format: course
    question: "Une variable d'environnement et le `application.properties` du jar définissent la même propriété. Laquelle gagne ?"
    choices:
      - {text: "La variable d'environnement", correct: true}
      - {text: "Le fichier du jar", correct: false}
      - {text: "La première lue au démarrage", correct: false}
      - {text: "Aucune : le démarrage échoue", correct: false}
    answer: "L'environnement est plus fort que les fichiers : c'est ainsi qu'on règle un conteneur sans reconstruire l'image."
  - key: dehors-contre-dedans
    format: course
    question: "Un `application.properties` est dans le jar, un autre dans le dossier courant au lancement. Lequel l'emporte ?"
    choices:
      - {text: "Celui du dossier courant, hors du jar", correct: true}
      - {text: "Celui du jar", correct: false}
      - {text: "Le plus récent des deux sur le disque", correct: false}
      - {text: "Aucun : ils sont fusionnés au hasard", correct: false}
    answer: "Les fichiers hors du jar l'emportent sur ceux du classpath. Les deux sont lus ; pour une clé commune, le fichier externe gagne."
  - key: rang-de-property-source
    format: course
    question: "Où se place `@PropertySource` dans l'ordre des sources ?"
    choices:
      - {text: "Très bas : presque toutes les autres sources l'emportent", correct: true}
      - {text: "Tout en haut, au-dessus de la ligne de commande", correct: false}
      - {text: "Juste au-dessus des variables d'environnement", correct: false}
      - {text: "Elle remplace entièrement `application.properties`", correct: false}
    answer: "Seules les propriétés par défaut sont plus faibles. Elle arrive aussi trop tard pour `logging.*` ou `spring.main.*`."
  - key: vf-propriete-systeme
    format: true-false
    question: "Une propriété système `-Dboutique.nom=x` l'emporte sur `application.properties`."
    truth: true
    answer: "Les propriétés système de la JVM sont plus fortes que l'environnement et que les fichiers."
  - key: vf-proprietes-de-test
    format: true-false
    question: "Les propriétés d'un test (`@SpringBootTest(properties = ...)`) l'emportent sur toutes les autres sources."
    truth: true
    answer: "Un test peut ainsi forcer une valeur, quoi que disent les fichiers ou l'environnement de la machine de CI."
  - key: vf-property-source-et-journaux
    format: true-false
    question: "`@PropertySource` permet de régler `logging.level.*` dès le début du démarrage."
    truth: false
    answer: "Elle n'est lue qu'au rafraîchissement du contexte, après l'initialisation des journaux. On passe par `application.properties` ou `spring.config.import`."
  - key: vf-profil-contre-commun
    format: true-false
    question: "Quand le profil `prod` est actif, `application-prod.properties` l'emporte sur `application.properties`."
    truth: true
    answer: "Le fichier de profil s'ajoute au fichier commun et l'emporte pour les clés communes."
  - key: qcm-source-d-une-valeur
    format: multiple-choice
    question: "Comment savoir de quelle source vient la valeur d'une propriété, dans une application en cours ?"
    choices:
      - {text: "Le point d'accès Actuator `/actuator/env`, qui liste les sources", correct: true}
      - {text: "Le fichier `pom.xml`, qui fixe l'ordre des sources", correct: false}
      - {text: "La commande `java -version` lancée sur le serveur", correct: false}
      - {text: "Le rapport des conditions affiché par `--debug`", correct: false}
    answer: "`/actuator/env` montre chaque source, dans l'ordre, et `/actuator/env/{nom}` la source qui gagne pour une clé."
  - key: qcm-config-location
    format: multiple-choice
    question: "Que fait `spring.config.location=file:/etc/boutique/` ?"
    choices:
      - {text: "Il remplace les emplacements par défaut des fichiers de configuration", correct: true}
      - {text: "Il ajoute ce dossier aux emplacements par défaut", correct: false}
      - {text: "Il copie la configuration de ce dossier dans le jar", correct: false}
      - {text: "Il définit le dossier où sont écrits les journaux", correct: false}
    answer: "Les fichiers du jar ne sont plus lus. Pour ajouter un dossier sans perdre les autres : `spring.config.additional-location`."
  - key: qcm-ordre-complet
    format: multiple-choice
    question: "Dans quel ordre, de la plus forte à la plus faible, ces sources s'appliquent-elles ?"
    choices:
      - {text: "Ligne de commande, environnement, fichier hors du jar, fichier dans le jar", correct: true}
      - {text: "Fichier dans le jar, fichier hors du jar, environnement, ligne de commande", correct: false}
      - {text: "Environnement, ligne de commande, fichier dans le jar, fichier hors du jar", correct: false}
      - {text: "Fichier hors du jar, ligne de commande, fichier dans le jar, environnement", correct: false}
    answer: "Du plus explicite au plus général : ce qu'on tape au lancement, puis l'environnement de la machine, puis les fichiers."
  - key: qcm-spring-application-json
    format: multiple-choice
    question: "À quoi sert la variable `SPRING_APPLICATION_JSON` ?"
    choices:
      - {text: "À passer plusieurs propriétés d'un coup, en JSON, dans une variable", correct: true}
      - {text: "À fournir le schéma JSON qui valide les propriétés", correct: false}
      - {text: "À choisir le format JSON pour les journaux", correct: false}
      - {text: "À désactiver la lecture des fichiers `.properties`", correct: false}
    answer: "`SPRING_APPLICATION_JSON='{\"boutique\":{\"nom\":\"Test\"}}'` : pratique quand l'environnement ne permet qu'une variable."
  - key: situation-port-en-conteneur
    format: scenario
    question: |-
      En conteneur, tu veux changer `server.port` sans reconstruire l'image. Que fais-tu ?
    choices:
      - {text: "Je définis la variable d'environnement `SERVER_PORT`", correct: true}
      - {text: "Je modifie `application.properties` à l'intérieur du jar", correct: false}
      - {text: "Je recompile l'application avec un autre port", correct: false}
      - {text: "J'ajoute `@PropertySource` sur la classe principale", correct: false}
    answer: |-
      Les variables d'environnement l'emportent sur les fichiers du jar. La même image sert partout, réglée par son
      environnement.
  - key: situation-valeur-inattendue
    format: scenario
    question: |-
      En production, `boutique.remise` vaut 20 alors que le fichier du jar dit 10. Que vérifies-tu d'abord ?
    choices:
      - {text: "Les sources plus fortes que le fichier, à commencer par l'environnement", correct: true}
      - {text: "La version de Java installée sur le serveur de production", correct: false}
      - {text: "Le cache du navigateur de chacun des clients de la boutique", correct: false}
      - {text: "L'ordre des dépendances déclarées dans le `pom.xml`", correct: false}
    answer: |-
      Une source plus forte surcharge le fichier : une variable `BOUTIQUE_REMISE`, un `-D`, un argument, ou un
      fichier hors du jar. `/actuator/env` le dit directement.
  - key: situation-surcharger-selon-l-environnement
    format: scenario
    question: |-
      En entretien : « Comment règles-tu une propriété différemment selon l'environnement ? » Que réponds-tu ?
    choices:
      - {text: "Par une source plus forte : environnement, argument, ou fichier de profil", correct: true}
      - {text: "En recompilant l'application avec d'autres constantes", correct: false}
      - {text: "En modifiant le jar sur chaque serveur", correct: false}
      - {text: "En ajoutant un `if` sur le nom de la machine", correct: false}
    answer: |-
      Un seul artefact, réglé de l'extérieur : c'est le principe de la configuration externe (« twelve-factor app »).
      On cite l'ordre principal des sources.
  - key: situation-forcer-en-test
    format: scenario
    question: |-
      Dans un test, tu veux forcer `boutique.remise=0`, quoi que disent les fichiers. Que fais-tu ?
    choices:
      - {text: "`@SpringBootTest(properties = \"boutique.remise=0\")`", correct: true}
      - {text: "Modifier `src/main/resources/application.properties`", correct: false}
      - {text: "Définir `BOUTIQUE_REMISE` sur la machine de CI", correct: false}
      - {text: "Ajouter `@PropertySource` sur la classe de test", correct: false}
    answer: |-
      Les propriétés du test sont les plus fortes, et ne valent que pour ce test. Une variable d'environnement de la
      CI toucherait tous les tests, et pas le poste du développeur.
