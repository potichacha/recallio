notion: profils
lesson: |-
  Un **profil** est un nom (`dev`, `test`, `prod`) qui active une partie de la configuration ou des beans selon le
  contexte d'exécution.

  **Des fichiers par profil.** `application-{profil}.properties` (ou `.yml`) est lu **en plus** de
  `application.properties`, et l'emporte sur lui pour les clés communes :

  ```
  src/main/resources/
  ├── application.properties          # commun
  ├── application-dev.properties      # en plus, si dev est actif
  └── application-prod.properties     # en plus, si prod est actif
  ```

  **Activer un profil.**

  | Où | Comment |
  |---|---|
  | configuration | `spring.profiles.active=dev` dans `application.properties` |
  | ligne de commande | `java -jar app.jar --spring.profiles.active=prod` |
  | environnement | `SPRING_PROFILES_ACTIVE=prod` |
  | tests | `@ActiveProfiles("test")` sur la classe de test |

  Sans profil actif, c'est le profil **`default`** (« No active profile set, falling back to 1 default profile:
  "default" »). Avec plusieurs profils (`dev,local`), le **dernier** l'emporte pour une clé commune.

  **Des beans par profil.**

  ```java
  @Component
  @Profile("dev")
  public class FauxPaiement implements Paiement { ... }

  @Component
  @Profile("!dev")                         // tous les profils sauf dev
  public class PaiementStripe implements Paiement { ... }
  ```

  `@Profile` accepte des expressions : `"dev & local"`, `"dev | test"`, `"!prod"`. Attention :
  `@Profile({"dev", "local"})` veut dire **l'un ou l'autre**.

  **Plusieurs documents dans un YAML**, séparés par `---` :

  ```yaml
  boutique:
    nom: base
  ---
  spring:
    config:
      activate:
        on-profile: prod
  boutique:
    nom: production
  ```

  L'ancienne clé `spring.profiles` est refusée depuis Spring Boot 2.4 (« should be replaced with
  'spring.config.activate.on-profile' »).

  **Les groupes.** `spring.profiles.group.prod=proddb,prodmq` : activer `prod` active aussi les deux autres. Un
  fichier de profil ne peut **pas** activer un autre profil : `spring.profiles.active` y est refusé (« is invalid in
  a profile specific resource »).

  **Avec mesure.** Les profils décrivent des environnements, pas des fonctionnalités : un
  `if (profil == prod)` dans le code se remplace par une propriété dédiée. Et les secrets de production ne vont pas
  dans `application-prod.properties` versionné : ils viennent de l'environnement.

  **En entretien** : « Un profil active des fichiers `application-{profil}` et des beans `@Profile` ; on le choisit
  par `spring.profiles.active`, une variable d'environnement ou `@ActiveProfiles` en test. Les fichiers de profil
  s'ajoutent à la configuration commune et l'emportent sur elle. »
cards:
  - key: lecture-du-fichier-de-profil
    format: course
    question: "Quand Spring Boot lit-il `application-dev.properties` ?"
    choices:
      - {text: "Quand `dev` est actif, en plus de `application.properties`", correct: true}
      - {text: "Toujours, et avant `application.properties`", correct: false}
      - {text: "Quand `dev` est actif, à la place de `application.properties`", correct: false}
      - {text: "Seulement pendant l'exécution des tests", correct: false}
    answer: "Le fichier de profil s'ajoute au fichier commun, et l'emporte sur lui pour les clés qu'ils partagent."
  - key: profil-par-defaut
    format: course
    question: "Quel profil est actif quand aucun n'est demandé ?"
    choices:
      - {text: "`default`", correct: true}
      - {text: "`dev`", correct: false}
      - {text: "`prod`", correct: false}
      - {text: "Aucun, et `@Profile` est ignoré", correct: false}
    answer: "Spring Boot l'écrit au démarrage : « No active profile set, falling back to 1 default profile: \"default\" »."
  - key: dernier-profil-gagne
    format: course
    question: "Avec `spring.profiles.active=dev,local`, les deux fichiers de profil définissent `boutique.nom`. Lequel l'emporte ?"
    choices:
      - {text: "Celui de `local`, le dernier profil de la liste", correct: true}
      - {text: "Celui de `dev`, le premier profil de la liste", correct: false}
      - {text: "Aucun : le démarrage échoue sur le conflit", correct: false}
      - {text: "Celui de `application.properties`", correct: false}
    answer: "Les profils sont appliqués dans l'ordre : le dernier écrase les précédents pour les clés communes."
  - key: groupe-de-profils
    format: course
    question: "À quoi sert `spring.profiles.group.prod=proddb,prodmq` ?"
    choices:
      - {text: "Activer `prod` active aussi `proddb` et `prodmq`", correct: true}
      - {text: "Activer `proddb` et `prodmq` désactive `prod`", correct: false}
      - {text: "`proddb` et `prodmq` héritent des beans de `prod`", correct: false}
      - {text: "Il renomme `proddb` et `prodmq` en `prod`", correct: false}
    answer: "Un groupe découpe la configuration en petits profils tout en gardant un seul nom à activer."
  - key: vf-variable-d-environnement
    format: true-false
    question: "Une variable d'environnement `SPRING_PROFILES_ACTIVE=prod` active le profil `prod`."
    truth: true
    answer: "C'est la forme habituelle en conteneur. La liaison souple transforme le nom en `spring.profiles.active`."
  - key: vf-actif-dans-un-fichier-de-profil
    format: true-false
    question: "On peut écrire `spring.profiles.active` dans `application-dev.properties` pour activer un autre profil."
    truth: false
    answer: "Le démarrage échoue : la propriété « is invalid in a profile specific resource ». On utilise un groupe de profils."
  - key: vf-negation
    format: true-false
    question: "`@Profile(\"!prod\")` crée le bean dans tous les profils sauf `prod`."
    truth: true
    answer: "Y compris sans profil actif (le profil `default`)."
  - key: vf-ancienne-cle
    format: true-false
    question: "Dans un YAML à plusieurs documents, `spring.profiles: dev` réserve encore un document au profil `dev` dans Spring Boot 4."
    truth: false
    answer: "Spring Boot refuse cette clé : elle « should be replaced with 'spring.config.activate.on-profile' »."
  - key: qcm-profil-en-test
    format: multiple-choice
    question: "Quelle annotation active le profil `test` dans une classe de test ?"
    choices:
      - {text: "`@ActiveProfiles(\"test\")`", correct: true}
      - {text: "`@Profile(\"test\")`", correct: false}
      - {text: "`@TestProfile(\"test\")`", correct: false}
      - {text: "`@EnableProfile(\"test\")`", correct: false}
    answer: "`@ActiveProfiles` active le profil pour le contexte du test. `@Profile` sur une classe dit quand un bean existe, pas ce qui est actif."
  - key: qcm-activer-au-lancement
    format: multiple-choice
    question: "Comment activer le profil `prod` au lancement du jar ?"
    choices:
      - {text: "`java -jar app.jar --spring.profiles.active=prod`", correct: true}
      - {text: "`java -jar app.jar --profile prod`", correct: false}
      - {text: "`java -jar app.jar -Pprod`", correct: false}
      - {text: "`java -jar app.jar prod`", correct: false}
    answer: "Un argument `--cle=valeur` règle n'importe quelle propriété. `-Pprod` active un profil Maven, au build."
  - key: qcm-document-yaml
    format: multiple-choice
    question: "Quelle clé, dans un document YAML, le réserve au profil `dev` ?"
    choices:
      - {text: "`spring.config.activate.on-profile: dev`", correct: true}
      - {text: "`spring.profiles: dev`", correct: false}
      - {text: "`spring.profiles.active: dev`", correct: false}
      - {text: "`spring.config.profile: dev`", correct: false}
    answer: "Depuis Spring Boot 2.4, `spring.config.activate.on-profile`. `spring.profiles.active` activerait le profil au lieu de filtrer."
  - key: qcm-deux-profils-a-la-fois
    format: multiple-choice
    question: "Quel `@Profile` crée un bean seulement si `dev` et `local` sont tous deux actifs ?"
    choices:
      - {text: "`@Profile(\"dev & local\")`", correct: true}
      - {text: "`@Profile({\"dev\", \"local\"})`", correct: false}
      - {text: "`@Profile(\"dev | local\")`", correct: false}
      - {text: "`@Profile(\"dev + local\")`", correct: false}
    answer: "`&` exige les deux. Un tableau de profils veut dire l'un ou l'autre, comme `|`."
  - key: trous-active
    format: fill-in
    question: |-
      Complète pour activer le profil `dev` :
      ```properties
      spring.profiles.___=dev
      ```
    blanks:
      - [active]
    answer: "`spring.profiles.active`, dans un fichier, en argument ou en variable d'environnement."
  - key: trous-profile
    format: fill-in
    question: |-
      Complète pour ne créer ce bean que dans le profil `dev` :
      ```java
      @Component
      @___("dev")
      public class FauxPaiement implements Paiement {
      }
      ```
    blanks:
      - [Profile]
    answer: "`@Profile` conditionne la création du bean aux profils actifs."
  - key: trous-on-profile
    format: fill-in
    question: |-
      Complète pour réserver ce document YAML au profil `prod` :
      ```yaml
      ---
      spring:
        config:
          activate:
            ___: prod
      boutique:
        nom: production
      ```
    blanks:
      - [on-profile]
    answer: "`spring.config.activate.on-profile`."
  - key: trous-active-profiles
    format: fill-in
    question: |-
      Complète pour activer le profil `test` dans ce test :
      ```java
      @SpringBootTest
      @___("test")
      class CommandeServiceTest {
      }
      ```
    blanks:
      - [ActiveProfiles]
    answer: "`@ActiveProfiles` (de `spring-test`) active les profils du contexte de test."
  - key: bug-actif-dans-le-profil
    format: bug-fix
    question: |-
      Le démarrage avec `--spring.profiles.active=dev` échoue : « Property 'spring.profiles.active' imported from
      location 'class path resource [application-dev.properties]' is invalid in a profile specific resource ». Le
      profil `dev` doit toujours entraîner `local`. Quelle correction est la bonne ?
      ```properties
      # application-dev.properties
      boutique.nom=dev
      spring.profiles.active=local
      ```
    choices:
      - {text: "Écrire `spring.profiles.group.dev=local` dans `application.properties`", correct: true}
      - {text: "Écrire `spring.profiles.active=local` dans `application-local.properties`", correct: false}
      - {text: "Renommer le fichier en `application-dev-local.properties`", correct: false}
      - {text: "Remplacer la ligne par `spring.profiles=local`", correct: false}
    answer: |-
      ```properties
      # application.properties
      spring.profiles.group.dev=local
      ```
      Un fichier de profil ne peut pas activer d'autres profils. Le groupe, déclaré dans le fichier commun, active
      `local` dès que `dev` l'est.
  - key: bug-ancienne-cle-spring-profiles
    format: bug-fix
    question: |-
      Le démarrage échoue : « Property 'spring.profiles' imported from location ... is invalid and should be replaced
      with 'spring.config.activate.on-profile' ». Quelle correction est la bonne ?
      ```yaml
      boutique:
        nom: base
      ---
      spring:
        profiles: dev
      boutique:
        nom: dev
      ```
    choices:
      - {text: "Écrire `spring.config.activate.on-profile: dev` dans le second document", correct: true}
      - {text: "Écrire `spring.profiles.active: dev` dans le second document", correct: false}
      - {text: "Supprimer la ligne `---` qui sépare les deux documents", correct: false}
      - {text: "Écrire `spring.profiles: [dev]` dans le second document", correct: false}
    answer: |-
      ```yaml
      ---
      spring:
        config:
          activate:
            on-profile: dev
      boutique:
        nom: dev
      ```
      `spring.profiles` a été remplacé en Spring Boot 2.4. `spring.profiles.active` activerait le profil au lieu de
      filtrer le document, et serait refusé dans un document de profil.
  - key: bug-fichier-mal-nomme
    format: bug-fix
    question: |-
      Avec le profil `dev` actif, l'application utilise toujours la base de production : les réglages de ce fichier
      ne sont jamais lus. Quelle correction est la bonne ?
      ```
      src/main/resources/application.properties
      src/main/resources/application_dev.properties
      ```
    choices:
      - {text: "Renommer le fichier en `application-dev.properties`", correct: true}
      - {text: "Renommer le fichier en `dev.application.properties`", correct: false}
      - {text: "Déplacer le fichier dans `src/main/resources/dev/`", correct: false}
      - {text: "Renommer le fichier en `application.dev.properties`", correct: false}
    answer: |-
      ```
      src/main/resources/application-dev.properties
      ```
      Spring Boot cherche exactement `application-{profil}`, avec un tiret. Les autres noms sont ignorés, sans
      erreur.
  - key: bug-bean-reserve-au-dev
    format: bug-fix
    question: |-
      En production, le démarrage échoue : « Parameter 0 of constructor in com.boutique.Caisse required a bean of type
      'com.boutique.Paiement' that could not be found. » Quelle correction est la bonne ?
      ```java
      @Component
      @Profile("dev")
      public class FauxPaiement implements Paiement { ... }

      public class PaiementStripe implements Paiement { ... }
      ```
    choices:
      - {text: "Annoter `PaiementStripe` avec `@Component` et `@Profile(\"!dev\")`", correct: true}
      - {text: "Retirer `@Profile(\"dev\")` de la classe `FauxPaiement`", correct: false}
      - {text: "Activer le profil `dev` en production", correct: false}
      - {text: "Annoter `FauxPaiement` avec `@Primary`", correct: false}
    answer: |-
      ```java
      @Component
      @Profile("!dev")
      public class PaiementStripe implements Paiement { ... }
      ```
      Hors du profil `dev`, aucun `Paiement` n'existait. Chaque profil doit trouver son implémentation ; le faux
      paiement ne doit jamais servir en production.
  - key: situation-tests-de-profil-dans-le-code
    format: scenario
    question: |-
      Le code contient `if (environment.matchesProfiles("prod"))` à dix endroits. Que proposes-tu ?
    choices:
      - {text: "Remplacer ces tests par des propriétés dédiées, réglées par profil", correct: true}
      - {text: "Ajouter un profil par environnement et par client", correct: false}
      - {text: "Remplacer `prod` par `production` partout dans le code", correct: false}
      - {text: "Lire `SPRING_PROFILES_ACTIVE` avec `System.getenv`", correct: false}
    answer: |-
      `boutique.paiement.reel=true` dit ce que fait le code ; le profil `prod` règle cette propriété. Le code ne
      dépend plus des noms d'environnement, et se teste avec n'importe quelle valeur.
  - key: situation-identifiants-de-production
    format: scenario
    question: |-
      Les identifiants de la base de production sont dans `application-prod.properties`, versionné avec le code.
      Qu'en dis-tu ?
    choices:
      - {text: "Les secrets n'ont rien à faire dans le dépôt : ils viennent de l'environnement", correct: true}
      - {text: "C'est correct, puisque le profil `prod` n'est actif qu'en production", correct: false}
      - {text: "Il suffit d'encoder le fichier en Base64 avant de le committer", correct: false}
      - {text: "Il suffit de déplacer le fichier dans `src/test/resources`", correct: false}
    answer: |-
      Tout le monde qui lit le dépôt lit le mot de passe. Le fichier de profil garde les réglages non secrets ; le mot
      de passe arrive par une variable d'environnement ou un coffre.
  - key: situation-reglages-locaux
    format: scenario
    question: |-
      Chaque développeur veut ses propres réglages locaux (port, base) sans gêner les autres. Que proposes-tu ?
    choices:
      - {text: "Un profil `local`, avec un `application-local.properties` ignoré par Git", correct: true}
      - {text: "Modifier `application.properties`, et ne jamais le committer", correct: false}
      - {text: "Un `if` sur le nom de la machine dans le code", correct: false}
      - {text: "Un profil par développeur, versionné dans le dépôt", correct: false}
    answer: |-
      Chacun garde son fichier hors du dépôt et active `local`. On peut versionner un exemple
      (`application-local.properties.exemple`) pour guider les nouveaux venus.
  - key: situation-profils-en-entretien
    format: scenario
    question: |-
      En entretien : « À quoi servent les profils Spring ? » Que réponds-tu ?
    choices:
      - {text: "À activer une configuration ou des beans selon le contexte : dev, test, prod", correct: true}
      - {text: "À mesurer le temps d'exécution de chacune des méthodes", correct: false}
      - {text: "À gérer les droits d'accès des utilisateurs", correct: false}
      - {text: "À choisir la version de Java au démarrage", correct: false}
    answer: |-
      On ajoute comment on les active (`spring.profiles.active`, variable d'environnement, `@ActiveProfiles`) et que
      les fichiers de profil s'ajoutent au fichier commun.
