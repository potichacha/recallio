notion: secrets
lesson: |-
  Un **secret** (mot de passe de base, clé d'API, jeton, clé de chiffrement) ne doit **jamais** être écrit dans le
  dépôt : ni dans `application.properties`, ni dans un fichier de profil, ni dans le code.

  **Pourquoi c'est grave.** Git garde **tout l'historique** : un secret supprimé dans un nouveau commit reste lisible
  dans les anciens, et dans chaque copie du dépôt. Un secret poussé doit être considéré comme **compromis** : on le
  **révoque** et on en crée un autre, avant toute chose.

  **Où le mettre.** Le fichier de configuration ne garde qu'une **référence** :

  ```properties
  spring.datasource.url=jdbc:postgresql://db:5432/boutique
  spring.datasource.username=boutique
  spring.datasource.password=${DB_PASSWORD}
  ```

  | Source | Usage |
  |---|---|
  | variables d'environnement | le plus simple ; c'est la règle des applications « twelve-factor » |
  | fichiers montés | un secret Kubernetes ou Docker, monté en fichiers, lu par `spring.config.import=configtree:/run/secrets/` (chaque fichier devient une propriété, nommée comme lui) |
  | coffre-fort | HashiCorp Vault (Spring Cloud Vault), AWS Secrets Manager, Azure Key Vault : accès contrôlé, audit, rotation |

  **En développement**, chacun garde ses identifiants hors du dépôt : variables d'environnement, ou un fichier local
  ignoré par Git et importé avec `spring.config.import=optional:file:./secrets.properties`.

  **Ne pas les laisser fuir ailleurs.**
  - Jamais dans les **journaux**, même en `DEBUG`.
  - `/actuator/env` **masque** les valeurs par défaut depuis Spring Boot 3 (`******`) ; ne pas le désactiver en
    production.
  - Pas dans une image de conteneur : un secret « copié dans l'image » se lit dans ses couches.

  **Prévenir.** Un outil comme **gitleaks** (ou l'analyse des secrets de GitHub) détecte un secret avant ou juste
  après le commit. Un secret encodé en Base64 n'est **pas** protégé : c'est un encodage, pas un chiffrement.

  **Rotation.** Un secret lu à chaque démarrage depuis l'environnement ou un coffre change sans reconstruire
  l'application.

  **En entretien** : « Les secrets restent hors du dépôt : le fichier ne garde qu'un `${...}`, et la valeur vient de
  l'environnement, de fichiers montés ou d'un coffre. Un secret poussé est compromis : je le révoque. Je ne les
  journalise jamais, et un outil comme gitleaks les bloque en amont. »
cards:
  - key: historique-git
    format: course
    question: "Pourquoi un mot de passe supprimé d'un fichier reste-t-il compromis, s'il a été poussé sur Git ?"
    choices:
      - {text: "L'historique le garde : il faut le révoquer et en créer un nouveau", correct: true}
      - {text: "Git le chiffre, mais avec une clé publique connue de tous", correct: false}
      - {text: "Il n'est pas compromis : Git efface les anciennes versions", correct: false}
      - {text: "Il reste dans la mémoire du serveur de build jusqu'au redémarrage", correct: false}
    answer: "Chaque clone garde les anciens commits. Réécrire l'historique ne suffit pas : des copies existent peut-être déjà."
  - key: role-de-configtree
    format: course
    question: "Que fait `spring.config.import=configtree:/run/secrets/` ?"
    choices:
      - {text: "Chaque fichier du dossier devient une propriété, nommée comme lui", correct: true}
      - {text: "Il chiffre les propriétés avec les clés du dossier", correct: false}
      - {text: "Il copie `application.properties` dans ce dossier", correct: false}
      - {text: "Il charge un unique fichier `secrets.properties`", correct: false}
    answer: "C'est la forme des secrets Kubernetes et Docker montés en fichiers : `/run/secrets/db.password` donne la propriété `db.password`."
  - key: reference-a-une-variable
    format: course
    question: "Comment écrire, dans `application.properties`, un mot de passe qui vient de la variable `DB_PASSWORD` ?"
    choices:
      - {text: "`spring.datasource.password=${DB_PASSWORD}`", correct: true}
      - {text: "`spring.datasource.password=$DB_PASSWORD`", correct: false}
      - {text: "`spring.datasource.password=env(DB_PASSWORD)`", correct: false}
      - {text: "`spring.datasource.password=%DB_PASSWORD%`", correct: false}
    answer: "Un placeholder `${...}` est résolu dans toutes les sources, environnement compris. Les autres formes seraient lues comme des chaînes."
  - key: actuator-env-masque
    format: course
    question: "Que montre `/actuator/env` pour les valeurs des propriétés, par défaut, dans Spring Boot 3 et 4 ?"
    choices:
      - {text: "Des valeurs masquées (`******`), sauf réglage contraire", correct: true}
      - {text: "Toutes les valeurs en clair", correct: false}
      - {text: "Les seules valeurs sans le mot « password »", correct: false}
      - {text: "Rien : ce point d'accès a été supprimé", correct: false}
    answer: "Depuis Boot 3, `management.endpoint.env.show-values` vaut `never`. Les noms et les sources restent visibles."
  - key: vf-variable-d-environnement
    format: true-false
    question: "Une variable d'environnement est un bon moyen de passer un secret à une application Spring Boot."
    truth: true
    answer: "Elle reste hors du dépôt et de l'image ; l'application la lit au démarrage."
  - key: vf-base64
    format: true-false
    question: "Encoder un mot de passe en Base64 dans `application.properties` suffit à le protéger."
    truth: false
    answer: "Base64 est un encodage, réversible par n'importe qui en une commande. Ce n'est pas un chiffrement."
  - key: vf-revoquer
    format: true-false
    question: "Un secret qui a fuité doit être révoqué et remplacé, même après sa suppression du dépôt."
    truth: true
    answer: "On ne sait pas qui l'a lu. Le révoquer est la seule façon de le rendre inutile."
  - key: vf-vault
    format: true-false
    question: "Spring Cloud Vault permet de lire des secrets stockés dans HashiCorp Vault comme des propriétés."
    truth: true
    answer: "Les secrets apparaissent dans l'`Environment` : `@Value` et `@ConfigurationProperties` les lisent comme les autres."
  - key: qcm-mot-de-passe-de-production
    format: multiple-choice
    question: "Où placer le mot de passe de la base de production ?"
    choices:
      - {text: "Dans un coffre ou l'environnement, injecté au déploiement", correct: true}
      - {text: "Dans `application-prod.properties`, versionné avec le code", correct: false}
      - {text: "Dans une constante Java, compilée dans le jar", correct: false}
      - {text: "Dans le `README`, pour que l'équipe le retrouve", correct: false}
    answer: "Le dépôt et le jar circulent largement ; le secret, lui, doit rester sous contrôle, avec un accès limité et tracé."
  - key: qcm-detecter-avant-le-depot
    format: multiple-choice
    question: "Comment repérer un secret avant qu'il n'arrive dans le dépôt ?"
    choices:
      - {text: "Un outil d'analyse comme gitleaks, en hook ou en CI", correct: true}
      - {text: "Un test JUnit qui relit `application.properties`", correct: false}
      - {text: "La compilation du projet avec `-Werror`", correct: false}
      - {text: "Le rapport des conditions de Spring Boot", correct: false}
    answer: "Ces outils cherchent les motifs de clés connues et les chaînes à forte entropie. En hook de pré-commit, le secret ne part jamais."
  - key: qcm-secret-kubernetes
    format: multiple-choice
    question: "Dans Kubernetes, comment un Secret arrive-t-il le plus souvent à l'application Spring Boot ?"
    choices:
      - {text: "Par des variables d'environnement, ou des fichiers lus par `configtree`", correct: true}
      - {text: "Par une copie dans le jar, au moment du build", correct: false}
      - {text: "Par un argument `--secret` du plugin Maven", correct: false}
      - {text: "Par un `application.properties` versionné dans l'image", correct: false}
    answer: "Kubernetes injecte le Secret dans le conteneur, au démarrage du pod. L'image ne le contient jamais."
  - key: qcm-jeton-dans-les-journaux
    format: multiple-choice
    question: "Quel réflexe adopter avec les journaux pour protéger un jeton d'API ?"
    choices:
      - {text: "Ne jamais le journaliser, même en `DEBUG`", correct: true}
      - {text: "Le journaliser seulement en `DEBUG`", correct: false}
      - {text: "Le journaliser encodé en Base64", correct: false}
      - {text: "Le journaliser seulement au démarrage", correct: false}
    answer: "Les journaux sont copiés, centralisés, gardés longtemps, et lus par bien plus de monde que le coffre."
  - key: situation-cle-poussee
    format: scenario
    question: |-
      Un développeur a poussé la clé d'API du service de paiement sur la branche principale, il y a une heure. Que
      fais-tu d'abord ?
    choices:
      - {text: "Révoquer la clé chez le fournisseur, et en générer une nouvelle", correct: true}
      - {text: "Supprimer le fichier dans un nouveau commit, et c'est réglé", correct: false}
      - {text: "Rendre le dépôt privé, sans toucher à la clé", correct: false}
      - {text: "Réécrire l'historique Git, sans changer la clé", correct: false}
    answer: |-
      La clé est déjà copiée dans des clones et peut-être lue par des robots. On la révoque, on la remplace par une
      variable d'environnement ou un coffre, puis on nettoie l'historique si besoin.
  - key: situation-identifiants-locaux
    format: scenario
    question: |-
      Comment chaque développeur fournit-il ses propres identifiants en local, sans les committer ?
    choices:
      - {text: "Variables d'environnement, ou fichier ignoré par Git importé avec `optional:`", correct: true}
      - {text: "Un `application-local.properties` versionné, avec les identifiants de chacun", correct: false}
      - {text: "Des identifiants communs, écrits dans une classe de configuration", correct: false}
      - {text: "Un fichier zip protégé par mot de passe, rangé dans le dépôt", correct: false}
    answer: |-
      `spring.config.import=optional:file:./secrets.properties`, avec `secrets.properties` dans `.gitignore` :
      absent en CI, le fichier ne fait pas échouer le démarrage.
  - key: situation-secrets-en-entretien
    format: scenario
    question: |-
      En entretien : « Comment gères-tu les secrets d'une application Spring Boot ? » Que réponds-tu ?
    choices:
      - {text: "Hors du dépôt : environnement, fichiers montés ou coffre, sans journaux", correct: true}
      - {text: "Dans `application.properties`, en limitant l'accès au dépôt", correct: false}
      - {text: "Dans le code, dans une classe dédiée et non publique", correct: false}
      - {text: "Dans un fichier chiffré, rangé dans le dépôt avec sa clé", correct: false}
    answer: |-
      On ajoute la révocation en cas de fuite, la rotation, le masquage d'Actuator et la détection automatique
      (gitleaks) : une politique, pas seulement un emplacement.
  - key: situation-rotation-mensuelle
    format: scenario
    question: |-
      Le mot de passe de la base change tous les mois. Comment éviter de reconstruire l'application à chaque fois ?
    choices:
      - {text: "Le lire au démarrage depuis l'environnement ou un coffre", correct: true}
      - {text: "Le compiler dans une constante, et reconstruire chaque mois", correct: false}
      - {text: "Désactiver le mot de passe de la base", correct: false}
      - {text: "Le mettre dans le `application.properties` du jar", correct: false}
    answer: |-
      Seul le secret change ; l'artefact reste le même. Un redémarrage (ou, avec un coffre, un rafraîchissement) suffit
      à prendre la nouvelle valeur.
