notion: proprietes
lesson: |-
  La configuration d'une application Spring Boot vit **hors du code**, d'abord dans `application.properties` ou
  `application.yml`, rangé à la racine du classpath (`src/main/resources` avec Maven).

  ```properties
  # application.properties
  spring.application.name=boutique
  server.port=8081
  spring.datasource.url=jdbc:postgresql://localhost:5432/boutique
  logging.level.com.boutique=debug
  boutique.titre=Bienvenue chez ${spring.application.name}
  ```

  Le même contenu en YAML, hiérarchique :

  ```yaml
  # application.yml
  spring:
    application:
      name: boutique
    datasource:
      url: jdbc:postgresql://localhost:5432/boutique
  server:
    port: 8081
  boutique:
    pays:
      - fr
      - be
  ```

  **Les règles du YAML**, source de bien des erreurs :
  - l'indentation se fait par des **espaces**, jamais des tabulations (« Do not use \t(TAB) for indentation ») ;
  - un **espace après les deux-points** : `port:8081` est une chaîne, pas une clé `port` ;
  - **une seule fois** chaque clé à un même niveau : deux blocs `spring:` à la racine font échouer le démarrage
    (« found duplicate key spring ») ;
  - YAML interprète certaines valeurs : `on` devient `true`, `010` devient 8 (octal). Mets entre guillemets ce qui
    doit rester une chaîne ;
  - `---` sépare plusieurs documents dans un même fichier.

  **Quelques comportements à connaître.**
  - `${autre.propriete}` réutilise une valeur : c'est un **placeholder**.
  - Si `application.properties` et `application.yml` sont dans le même dossier, `.properties` **l'emporte** en cas
    de clé commune.
  - Un fichier `config/application.properties` (dans le classpath, ou dans le dossier courant au lancement) est lu
    aussi, et le dossier courant l'emporte sur le jar.
  - `spring.config.import=optional:file:./secrets.properties` ajoute un fichier (`optional:` : pas d'erreur s'il
    manque).
  - Attention aux tests : un `application.properties` dans `src/test/resources` **remplace** celui de
    `src/main/resources` (c'est la même ressource du classpath), il ne s'y ajoute pas.

  **Les clés** sont en minuscules et en kebab-case (`spring.datasource.max-lifetime`). Le processeur de
  configuration (`spring-boot-configuration-processor`) donne l'autocomplétion de tes propres clés dans l'IDE.

  **En entretien** : « La configuration va dans `application.properties` ou `application.yml`, en kebab-case ; en
  YAML, des espaces, un espace après les deux-points, pas de clé en double. Les placeholders `${...}` réutilisent des
  valeurs, et d'autres sources (environnement, arguments, profils) viennent surcharger le fichier. »
cards:
  - key: emplacement-par-defaut
    format: course
    question: "Où Spring Boot cherche-t-il `application.properties` dans un projet Maven, par défaut ?"
    choices:
      - {text: "À la racine du classpath, donc dans `src/main/resources`", correct: true}
      - {text: "Dans `src/main/java`, à côté de la classe principale", correct: false}
      - {text: "Dans le dossier personnel de l'utilisateur", correct: false}
      - {text: "Dans `/etc/spring`, sur toutes les machines", correct: false}
    answer: "Maven copie `src/main/resources` dans le classpath. Le dossier courant (et son sous-dossier `config/`) est lu aussi au lancement."
  - key: properties-et-yml-ensemble
    format: course
    question: "Un même dossier contient `application.properties` et `application.yml`, avec une clé commune. Lequel l'emporte ?"
    choices:
      - {text: "`application.properties`", correct: true}
      - {text: "`application.yml`", correct: false}
      - {text: "Aucun : le démarrage échoue", correct: false}
      - {text: "Le fichier modifié le plus récemment", correct: false}
    answer: "Les deux sont lus ; pour une clé commune, `.properties` a la priorité. Mieux vaut n'en garder qu'un."
  - key: valeur-d-un-placeholder
    format: course
    question: "Que vaut `boutique.titre=Bienvenue chez ${boutique.nom}` quand `boutique.nom=Ma boutique` ?"
    choices:
      - {text: "`Bienvenue chez Ma boutique`", correct: true}
      - {text: "`Bienvenue chez ${boutique.nom}`", correct: false}
      - {text: "`Bienvenue chez boutique.nom`", correct: false}
      - {text: "`Bienvenue chez null`", correct: false}
    answer: "`${...}` est remplacé par la valeur de la propriété nommée, d'où qu'elle vienne (fichier, environnement...)."
  - key: yaml-on
    format: course
    question: "Que vaut la propriété `boutique.actif`, lue depuis la ligne YAML `actif: on` ?"
    choices:
      - {text: "`true`, car YAML lit `on` comme un booléen", correct: true}
      - {text: "`on`, une chaîne de deux lettres", correct: false}
      - {text: "`null`, car `on` est un mot réservé", correct: false}
      - {text: "`1`, car YAML lit `on` comme un nombre", correct: false}
    answer: "YAML 1.1, que lit Spring Boot, prend `on`, `off`, `yes`, `no` pour des booléens. Des guillemets (`\"on\"`) gardent la chaîne."
  - key: vf-tabulations
    format: true-false
    question: "Un fichier YAML peut être indenté avec des tabulations."
    truth: false
    answer: "Le démarrage échoue : « found character '\\t(TAB)' that cannot start any token ». Seuls les espaces indentent."
  - key: vf-octal
    format: true-false
    question: "Dans un fichier YAML lu par Spring Boot, `code: 010` donne la valeur 8."
    truth: true
    answer: "Un nombre qui commence par 0 est lu en octal. Pour garder « 010 », on écrit `code: \"010\"`."
  - key: vf-test-remplace-main
    format: true-false
    question: "Un `application.properties` dans `src/test/resources` s'ajoute à celui de `src/main/resources` pendant les tests."
    truth: false
    answer: "Les deux sont la même ressource du classpath, et celle des tests est trouvée en premier : elle remplace l'autre. On préfère `application-test.properties` et un profil."
  - key: vf-placeholder
    format: true-false
    question: "Une valeur de `application.properties` peut faire référence à une autre propriété avec `${...}`."
    truth: true
    answer: "`boutique.url=https://${boutique.hote}/api` : la référence est résolue au moment de la lecture."
  - key: qcm-equivalent-yaml
    format: multiple-choice
    question: "Quel YAML équivaut à `spring.datasource.url=jdbc:h2:mem:boutique` ?"
    choices:
      - text: |-
          ```yaml
          spring:
            datasource:
              url: jdbc:h2:mem:boutique
          ```
        correct: true
      - text: |-
          ```yaml
          spring:
          datasource:
          url: jdbc:h2:mem:boutique
          ```
        correct: false
      - text: |-
          ```yaml
          spring:
            datasource
              url = jdbc:h2:mem:boutique
          ```
        correct: false
      - text: |-
          ```yaml
          spring.datasource:
          url: jdbc:h2:mem:boutique
          ```
        correct: false
    answer: "Chaque niveau de la clé est un niveau d'indentation, avec des espaces et un deux-points suivi d'un espace. Sans indentation, les clés sont toutes à la racine."
  - key: qcm-liste-yaml
    format: multiple-choice
    question: "Comment écrire en YAML la liste `boutique.pays`, avec `fr` et `be` ?"
    choices:
      - text: |-
          ```yaml
          boutique:
            pays:
              - fr
              - be
          ```
        correct: true
      - text: |-
          ```yaml
          boutique:
            pays:
              fr
              be
          ```
        correct: false
      - text: |-
          ```yaml
          boutique:
            pays[]: fr
            pays[]: be
          ```
        correct: false
      - text: |-
          ```yaml
          boutique:
            - pays: fr
            - pays: be
          ```
        correct: false
    answer: "Un tiret par élément. Sans tirets, YAML lit une seule chaîne, « fr be ». En `.properties`, on écrit `boutique.pays=fr,be` ou `boutique.pays[0]=fr`."
  - key: qcm-surcharger-sans-reconstruire
    format: multiple-choice
    question: "Où placer un `application.properties` pour qu'il surcharge celui du jar, sans reconstruire ?"
    choices:
      - {text: "Dans le dossier courant au lancement, ou son sous-dossier `config/`", correct: true}
      - {text: "Dans `BOOT-INF/classes`, en modifiant le jar sur le serveur", correct: false}
      - {text: "Dans le dossier `/tmp` de la machine", correct: false}
      - {text: "Dans le dossier personnel, sous `.spring/`", correct: false}
    answer: "Les fichiers hors du jar l'emportent sur ceux du classpath. Les variables d'environnement et les arguments sont d'autres moyens."
  - key: qcm-importer-un-fichier
    format: multiple-choice
    question: "Comment ajouter un fichier de configuration supplémentaire, `secrets.properties`, depuis `application.properties` ?"
    choices:
      - {text: "`spring.config.import=optional:file:./secrets.properties`", correct: true}
      - {text: "`spring.config.include=secrets.properties`", correct: false}
      - {text: "`@PropertySource` écrit dans `application.properties`", correct: false}
      - {text: "`spring.profiles.include=secrets`", correct: false}
    answer: "`spring.config.import` charge d'autres fichiers ; `optional:` évite l'erreur quand le fichier manque, en développement par exemple."
  - key: trous-port
    format: fill-in
    question: |-
      Complète pour changer le port du serveur :
      ```properties
      server.___=8081
      ```
    blanks:
      - [port]
    answer: "`server.port` : 8080 par défaut."
  - key: trous-nom-application
    format: fill-in
    question: |-
      Complète pour nommer l'application (le nom apparaît dans les journaux et les métriques) :
      ```properties
      spring.application.___=boutique
      ```
    blanks:
      - [name]
    answer: "`spring.application.name`."
  - key: trous-config-import
    format: fill-in
    question: |-
      Complète pour charger un fichier de secrets local, s'il existe :
      ```properties
      spring.config.___=optional:file:./secrets.properties
      ```
    blanks:
      - [import]
    answer: "`spring.config.import`, avec le préfixe `optional:`."
  - key: trous-url-datasource
    format: fill-in
    question: |-
      Complète pour donner l'adresse de la base de données :
      ```properties
      spring.datasource.___=jdbc:postgresql://localhost:5432/boutique
      ```
    blanks:
      - [url]
    answer: "`spring.datasource.url`, accompagnée de `username` et `password`."
  - key: bug-tabulation
    format: bug-fix
    question: |-
      Le démarrage échoue : « found character '\t(TAB)' that cannot start any token. (Do not use \t(TAB) for
      indentation) ». Quelle correction est la bonne ?
      ```yaml
      server:
      	port: 8081
      ```
    choices:
      - {text: "Indenter `port` avec deux espaces au lieu d'une tabulation", correct: true}
      - {text: "Mettre la valeur `8081` entre guillemets", correct: false}
      - {text: "Renommer le fichier en `application.yaml`", correct: false}
      - {text: "Supprimer l'espace après les deux-points", correct: false}
    answer: |-
      ```yaml
      server:
        port: 8081
      ```
      YAML interdit les tabulations pour indenter. Configure l'éditeur pour qu'il insère des espaces dans les
      fichiers YAML.
  - key: bug-cle-en-double
    format: bug-fix
    question: |-
      Le démarrage échoue : « while constructing a mapping ... found duplicate key spring ». Quelle correction est la
      bonne ?
      ```yaml
      spring:
        application:
          name: boutique
      server:
        port: 8081
      spring:
        main:
          banner-mode: off
      ```
    choices:
      - {text: "Réunir les deux blocs sous un seul `spring:`", correct: true}
      - {text: "Renommer le second bloc en `spring2:`", correct: false}
      - {text: "Séparer les deux blocs par une ligne vide", correct: false}
      - {text: "Mettre `spring` entre guillemets dans le second bloc", correct: false}
    answer: |-
      ```yaml
      spring:
        application:
          name: boutique
        main:
          banner-mode: off
      server:
        port: 8081
      ```
      Une clé n'apparaît qu'une fois à un même niveau. Spring Boot refuse les doublons plutôt que d'en ignorer un en
      silence.
  - key: bug-espace-oublie
    format: bug-fix
    question: |-
      L'application démarre sur le port 8080 au lieu de 8081, sans aucune erreur. Quelle correction est la bonne ?
      ```yaml
      server:
        port:8081
      ```
    choices:
      - {text: "Ajouter un espace après les deux-points : `port: 8081`", correct: true}
      - {text: "Mettre la valeur entre guillemets : `port:\"8081\"`", correct: false}
      - {text: "Remplacer les deux-points par un signe égal : `port=8081`", correct: false}
      - {text: "Indenter `port` avec quatre espaces au lieu de deux", correct: false}
    answer: |-
      ```yaml
      server:
        port: 8081
      ```
      Sans espace, YAML lit la chaîne `port:8081` comme valeur de `server` : la clé `server.port` n'existe pas, et le
      port par défaut s'applique.
  - key: bug-fichier-de-test
    format: bug-fix
    question: |-
      En test, le démarrage échoue : « Could not resolve placeholder 'boutique.devise' in value "${boutique.devise}" »,
      alors que `src/main/resources/application.properties` définit bien `boutique.devise`. Quelle correction est la
      bonne ?
      ```properties
      # src/test/resources/application.properties
      spring.datasource.url=jdbc:h2:mem:test
      ```
    choices:
      - {text: "Renommer le fichier en `application-test.properties`, et activer le profil `test`", correct: true}
      - {text: "Ajouter `boutique.devise` dans une variable d'environnement de la CI", correct: false}
      - {text: "Déplacer le fichier dans `src/test/java`", correct: false}
      - {text: "Ajouter `@Lazy` sur le bean qui lit `boutique.devise`", correct: false}
    answer: |-
      ```properties
      # src/test/resources/application-test.properties
      spring.datasource.url=jdbc:h2:mem:test
      ```
      Le fichier de test porte le même nom que celui de production : il le masque. Un fichier de profil s'ajoute au
      fichier principal au lieu de le remplacer (avec `@ActiveProfiles("test")` sur les tests).
