notion: spring-boot-apport
lesson: |-
  Spring Framework fournit le conteneur, l'injection, Spring MVC, les transactions. Mais une application Spring
  « à la main » demande de déclarer des dizaines de beans d'infrastructure (source de données, gestionnaire de
  transactions, `DispatcherServlet`, convertisseurs JSON...), de choisir des versions compatibles de chaque
  bibliothèque, puis de déployer un WAR dans un serveur. **Spring Boot** supprime ce travail.

  | Apport | Ce qu'il fait |
  |---|---|
  | **auto-configuration** | crée au démarrage les beans d'infrastructure, selon les bibliothèques présentes, les beans déjà déclarés et les propriétés |
  | **starters** | une dépendance par fonctionnalité (`spring-boot-starter-webmvc`, `-data-jpa`...), qui tire les bonnes bibliothèques |
  | **gestion des versions** | le BOM `spring-boot-dependencies` fixe des versions testées ensemble |
  | **serveur embarqué** | Tomcat (par défaut) démarre dans l'application : `java -jar app.jar` |
  | **configuration externe** | `application.properties` ou `.yml`, variables d'environnement, arguments, profils |
  | **prêt pour la production** | Actuator : santé, métriques, informations |
  | **outillage** | Spring Initializr, `spring-boot-devtools` (redémarrage à chaud), tests par tranches |

  ```java
  @SpringBootApplication
  public class BoutiqueApplication {
      public static void main(String[] args) {
          SpringApplication.run(BoutiqueApplication.class, args);
      }
  }
  ```

  Avec le seul starter web, ces lignes donnent un serveur HTTP sur le port 8080, Spring MVC, la conversion JSON par
  Jackson, la page d'erreur, la validation... sans une ligne de configuration.

  **Des opinions, pas des obligations.** Boot choisit des réglages par défaut raisonnables (« convention plutôt que
  configuration »), mais chacun se change : par une **propriété** (`server.port=9090`,
  `spring.datasource.hikari.maximum-pool-size=20`), ou en déclarant **son propre bean**, devant lequel
  l'auto-configuration **recule**.

  **Pas de génération de code.** Hors du traitement AOT des images natives, Boot ne génère rien : ce sont des classes
  `@Configuration` conditionnelles, évaluées au démarrage. `--debug` affiche le rapport de ce qui a été appliqué.

  **Spring Boot 4** (fin 2025) découpe l'auto-configuration en petits modules (un par technologie), renomme
  quelques starters (`spring-boot-starter-webmvc`), passe à Jackson 3 et Jakarta EE 11, et exige Java 17 au minimum.

  **En entretien** : « Spring Boot s'appuie sur Spring et le configure automatiquement : auto-configuration selon les
  dépendances, starters et versions gérées, serveur embarqué et jar exécutable, configuration externe et Actuator.
  Tout réglage par défaut se remplace par une propriété ou par mon propre bean. »
cards:
  - key: apports-principaux
    format: course
    question: "Quels sont les apports principaux de Spring Boot à Spring Framework ?"
    choices:
      - {text: "L'auto-configuration, les starters et le serveur web embarqué", correct: true}
      - {text: "L'injection de dépendances, les beans et les proxies", correct: false}
      - {text: "Le langage Kotlin, Gradle et les coroutines", correct: false}
      - {text: "Les EJB, JNDI et le serveur d'applications", correct: false}
    answer: "L'injection, les beans et les proxies sont dans Spring Framework. Boot ajoute ce qui évite la configuration : auto-configuration, starters, serveur embarqué, configuration externe."
  - key: serveur-par-defaut
    format: course
    question: "Quel serveur web le starter `spring-boot-starter-webmvc` embarque-t-il par défaut ?"
    choices:
      - {text: "Tomcat", correct: true}
      - {text: "Jetty", correct: false}
      - {text: "Netty", correct: false}
      - {text: "WildFly", correct: false}
    answer: "Tomcat, par `spring-boot-starter-tomcat`. Jetty peut le remplacer ; Netty est le défaut de WebFlux ; WildFly est un serveur d'applications."
  - key: sens-de-opinionated
    format: course
    question: "Que signifie l'expression « Spring Boot a des opinions » (opinionated) ?"
    choices:
      - {text: "Il choisit des réglages par défaut raisonnables, que l'on peut remplacer", correct: true}
      - {text: "Il impose ses choix, sans possibilité de les changer", correct: false}
      - {text: "Il demande à l'utilisateur de tout configurer au démarrage", correct: false}
      - {text: "Il ne fonctionne qu'avec les bibliothèques de l'équipe Spring", correct: false}
    answer: "Les défauts couvrent le cas courant ; une propriété ou un bean à soi suffit pour s'en écarter."
  - key: sans-generation-de-code
    format: course
    question: "Hors du traitement AOT, comment Spring Boot configure-t-il l'application ?"
    choices:
      - {text: "Il crée les beans au démarrage, selon des conditions évaluées à ce moment", correct: true}
      - {text: "Il écrit des classes `@Configuration` dans `target/generated-sources`", correct: false}
      - {text: "Il modifie le bytecode de tes classes au chargement", correct: false}
      - {text: "Il lit un fichier XML généré par Maven à la compilation", correct: false}
    answer: "L'auto-configuration est faite de classes `@Configuration` ordinaires, conditionnelles, livrées dans les jars de Boot. Le traitement AOT, lui, génère du code pour les images natives."
  - key: vf-serveur-externe
    format: true-false
    question: "Une application Spring Boot doit être déployée dans un serveur d'applications externe pour répondre aux requêtes HTTP."
    truth: false
    answer: "Le serveur est embarqué : l'application est un jar exécutable. Le déploiement en WAR reste possible, mais il est facultatif."
  - key: vf-recule-devant-son-bean
    format: true-false
    question: "L'auto-configuration de Spring Boot recule quand l'application déclare son propre bean du même type."
    truth: true
    answer: "La plupart des beans auto-configurés portent `@ConditionalOnMissingBean` : ton bean a la priorité."
  - key: vf-versions-compatibles
    format: true-false
    question: "Spring Boot fixe des versions compatibles pour des centaines de bibliothèques, pour qu'on n'ait pas à les choisir une à une."
    truth: true
    answer: "Le BOM `spring-boot-dependencies` gère ces versions ; on n'écrit pas de `<version>` pour une dépendance gérée."
  - key: vf-java-8
    format: true-false
    question: "Spring Boot 4 fonctionne sur Java 8."
    truth: false
    answer: "Spring Boot 3 et 4 exigent Java 17 au minimum ; Java 25 est recommandé pour Boot 4."
  - key: qcm-actuator
    format: multiple-choice
    question: "Quel module de Spring Boot expose l'état de santé et les métriques d'une application ?"
    choices:
      - {text: "Actuator", correct: true}
      - {text: "DevTools", correct: false}
      - {text: "Initializr", correct: false}
      - {text: "Spring Boot CLI", correct: false}
    answer: "Actuator ajoute `/actuator/health`, `/actuator/metrics`... DevTools sert au développement ; Initializr génère les projets."
  - key: qcm-devtools
    format: multiple-choice
    question: "À quoi sert `spring-boot-devtools` ?"
    choices:
      - {text: "À relancer l'application à chaque modification du code", correct: true}
      - {text: "À surveiller l'application une fois en production", correct: false}
      - {text: "À générer le squelette d'un nouveau projet Spring", correct: false}
      - {text: "À compiler l'application en une image native", correct: false}
    answer: "DevTools relance le contexte quand le classpath change, et désactive certains caches. Il se désactive de lui-même dans un jar de production."
  - key: qcm-configuration-externe
    format: multiple-choice
    question: "Où Spring Boot lit-il la configuration d'une application, sans changer le code ?"
    choices:
      - {text: "Dans `application.properties`, l'environnement et les arguments", correct: true}
      - {text: "Dans un fichier `spring.xml` à la racine du projet", correct: false}
      - {text: "Dans `web.xml`, comme une application Jakarta EE", correct: false}
      - {text: "Dans le `MANIFEST.MF` du jar exécutable", correct: false}
    answer: "Fichiers `.properties` ou `.yml`, variables d'environnement, propriétés système, arguments : la même application tourne partout, réglée de l'extérieur."
  - key: qcm-principe-de-boot
    format: multiple-choice
    question: "Quel principe résume l'approche de Spring Boot ?"
    choices:
      - {text: "La convention plutôt que la configuration", correct: true}
      - {text: "La configuration plutôt que la convention", correct: false}
      - {text: "Le XML plutôt que les annotations", correct: false}
      - {text: "L'héritage plutôt que la composition", correct: false}
    answer: "Des choix par défaut qui suivent les usages courants ; on ne configure que ce qui s'en écarte."
  - key: situation-quitter-le-war
    format: scenario
    question: |-
      Une équipe déploie ses applications Spring en WAR dans un Tomcat partagé, et veut passer à Spring Boot.
      Qu'est-ce qui change pour le déploiement ?
    choices:
      - {text: "Chaque application devient un jar exécutable, avec son serveur embarqué", correct: true}
      - {text: "Rien : Spring Boot exige toujours un Tomcat partagé", correct: false}
      - {text: "Il faut passer à un serveur d'applications Jakarta EE complet", correct: false}
      - {text: "Il faut réécrire chaque application en Kotlin", correct: false}
    answer: |-
      Chaque application embarque son serveur, dans sa version : elle se lance avec `java -jar`, ou dans un conteneur.
      Plus de conflit de versions entre applications qui partagent un Tomcat.
  - key: situation-boot-en-entretien
    format: scenario
    question: |-
      En entretien : « Que t'apporte Spring Boot par rapport à Spring seul ? » Quelle réponse est la plus
      convaincante ?
    choices:
      - {text: "L'auto-configuration, les starters, le serveur embarqué et la configuration externe", correct: true}
      - {text: "Une syntaxe plus courte que Java, avec moins d'annotations à écrire", correct: false}
      - {text: "De meilleures performances, car Boot compile les beans à l'avance", correct: false}
      - {text: "La compatibilité avec Java EE et les EJB des anciens serveurs", correct: false}
    answer: |-
      Ce sont des gains de productivité et d'exploitation, pas de performances : à l'exécution, ce sont les mêmes
      beans Spring. Ajouter Actuator et la gestion des versions complète la réponse.
  - key: situation-pool-plus-grand
    format: scenario
    question: |-
      Ton application a besoin d'un pool de connexions plus grand que celui que Spring Boot configure. Que fais-tu ?
    choices:
      - {text: "Je règle `spring.datasource.hikari.maximum-pool-size`", correct: true}
      - {text: "Je réécris toute la configuration de la source de données", correct: false}
      - {text: "Je désactive Spring Boot pour la base de données", correct: false}
      - {text: "Je modifie le jar de HikariCP pour changer sa valeur par défaut", correct: false}
    answer: |-
      La plupart des réglages de l'auto-configuration sont des propriétés. Déclarer sa propre `DataSource` ferait
      reculer Boot, mais ferait perdre tous ses autres réglages.
  - key: situation-bibliotheque-neutre
    format: scenario
    question: |-
      Tu écris une petite bibliothèque Java de calcul de TVA, partagée par plusieurs applications Spring Boot.
      Doit-elle dépendre de Spring Boot ?
    choices:
      - {text: "Non : une bibliothèque reste neutre ; Boot sert à assembler l'application", correct: true}
      - {text: "Oui : sans Boot, une bibliothèque ne peut pas être utilisée par Spring", correct: false}
      - {text: "Oui : Boot est nécessaire pour compiler avec Java 25", correct: false}
      - {text: "Non, car Boot interdit les dépendances entre projets", correct: false}
    answer: |-
      Une classe Java ordinaire s'utilise dans un `@Bean`. Si l'on veut une configuration automatique, on la met dans
      un module à part (un starter), sans alourdir la bibliothèque elle-même.
  - key: def-auto-configuration
    format: definition
    question: "Quel terme désigne le mécanisme de Spring Boot qui crée des beans selon les bibliothèques présentes et la configuration ?"
    choices:
      - {text: "L'auto-configuration", correct: true}
      - {text: "Le scan des composants", correct: false}
      - {text: "L'injection de dépendances", correct: false}
      - {text: "Le traitement AOT", correct: false}
    answer: "L'auto-configuration. Le scan des composants trouve tes classes annotées ; l'auto-configuration ajoute les beans d'infrastructure."
  - key: def-starter
    format: definition
    question: "Quel terme désigne une dépendance de Spring Boot qui regroupe, sous un seul nom, les bibliothèques d'une fonctionnalité ?"
    choices:
      - {text: "Un starter", correct: true}
      - {text: "Un BOM", correct: false}
      - {text: "Un plugin", correct: false}
      - {text: "Un profil", correct: false}
    answer: "Un starter (`spring-boot-starter-data-jpa`...). Le BOM, lui, fixe les versions sans ajouter de dépendance."
  - key: def-serveur-embarque
    format: definition
    question: "Quel terme désigne un serveur web lancé à l'intérieur de l'application, dans la même JVM ?"
    choices:
      - {text: "Un serveur embarqué", correct: true}
      - {text: "Un serveur d'applications", correct: false}
      - {text: "Un proxy inverse", correct: false}
      - {text: "Un conteneur de servlets externe", correct: false}
    answer: "Un serveur embarqué : Tomcat démarre avec l'application, comme une bibliothèque."
  - key: def-bom
    format: definition
    question: "Quel terme désigne une nomenclature Maven, comme `spring-boot-dependencies`, qui fixe les versions d'un ensemble de bibliothèques ?"
    choices:
      - {text: "Un BOM (Bill of Materials)", correct: true}
      - {text: "Un starter", correct: false}
      - {text: "Un archétype Maven", correct: false}
      - {text: "Un plugin Maven", correct: false}
    answer: "Un BOM ne contient que des versions (`<dependencyManagement>`). Le parent `spring-boot-starter-parent` en hérite."
