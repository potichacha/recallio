notion: starters
lesson: |-
  Un **starter** est une dépendance qui ne contient presque pas de code : elle **tire** les bibliothèques d'une
  fonctionnalité, et le module d'auto-configuration qui va avec. Une ligne dans le `pom.xml`, et la fonctionnalité
  est là.

  | Starter (Spring Boot 4) | Apporte |
  |---|---|
  | `spring-boot-starter-webmvc` | Spring MVC, Tomcat, Jackson (l'ancien nom `spring-boot-starter-web` reste un alias) |
  | `spring-boot-starter-data-jpa` | Spring Data JPA, Hibernate, HikariCP |
  | `spring-boot-starter-validation` | Bean Validation (Hibernate Validator) |
  | `spring-boot-starter-security` | Spring Security |
  | `spring-boot-starter-actuator` | santé, métriques, informations |
  | `spring-boot-starter-test` | JUnit, AssertJ, Mockito, le support de test de Spring |
  | `spring-boot-starter-webmvc-test`, `-data-jpa-test` | les tests par tranche de chaque technologie |

  **Les versions.** On n'écrit **pas** de version pour une dépendance gérée par Boot : le **BOM**
  `spring-boot-dependencies` fixe des versions **testées ensemble**. Deux façons d'en profiter avec Maven :

  ```xml
  <!-- 1. hériter du parent, qui hérite du BOM (et règle aussi les plugins) -->
  <parent>
      <groupId>org.springframework.boot</groupId>
      <artifactId>spring-boot-starter-parent</artifactId>
      <version>4.1.2</version>
  </parent>

  <!-- 2. ou, quand le projet a déjà un parent : importer le BOM -->
  <dependencyManagement>
      <dependencies>
          <dependency>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-dependencies</artifactId>
              <version>4.1.2</version>
              <type>pom</type>
              <scope>import</scope>
          </dependency>
      </dependencies>
  </dependencyManagement>
  ```

  Avec Gradle, le plugin `org.springframework.boot` et la plateforme du BOM jouent le même rôle. Pour imposer une
  autre version d'une bibliothèque gérée, on redéfinit sa **propriété de version** (par exemple `hibernate.version`)
  plutôt que d'écrire un `<version>` à la main.

  **Changer un composant.** Remplacer Tomcat par Jetty : exclure `spring-boot-starter-tomcat` du starter web, et
  ajouter `spring-boot-starter-jetty`.

  **Les starters des autres.** Par convention, un starter qui ne vient pas de l'équipe Spring Boot se nomme
  `nomduprojet-spring-boot-starter` (le préfixe `spring-boot-` lui est réservé). Une entreprise peut écrire le sien :
  une auto-configuration, et une dépendance qui la tire.

  **Attention à ce qu'on ajoute.** L'auto-configuration réagit au classpath : ajouter H2 crée une base en mémoire,
  ajouter Spring Security protège toutes les URL. Chaque starter a un effet, voulu ou non.

  **En entretien** : « Un starter regroupe les dépendances d'une fonctionnalité et déclenche son auto-configuration.
  Les versions viennent du BOM `spring-boot-dependencies`, par le parent `spring-boot-starter-parent` ou par import :
  je n'écris pas de version, je redéfinis au besoin la propriété de version. »
cards:
  - key: contenu-d-un-starter
    format: course
    question: "Que contient un starter comme `spring-boot-starter-data-jpa` ?"
    choices:
      - {text: "Presque pas de code : il tire les dépendances d'une fonctionnalité", correct: true}
      - {text: "Le code de JPA, réécrit par l'équipe Spring Boot", correct: false}
      - {text: "Une base de données embarquée, déjà configurée", correct: false}
      - {text: "Un plugin Maven qui génère les entités", correct: false}
    answer: "C'est un descripteur de dépendances : Spring Data JPA, Hibernate, HikariCP, et l'auto-configuration correspondante."
  - key: pourquoi-pas-de-version
    format: course
    question: "Pourquoi n'écrit-on pas de version pour les dépendances gérées par Spring Boot ?"
    choices:
      - {text: "Le BOM `spring-boot-dependencies` fixe des versions testées ensemble", correct: true}
      - {text: "Maven choisit toujours la dernière version publiée", correct: false}
      - {text: "Spring Boot télécharge les versions au démarrage", correct: false}
      - {text: "Maven 4 interdit les versions dans un `pom.xml`", correct: false}
    answer: "Le BOM garantit un ensemble cohérent. Une version écrite à la main peut casser cette cohérence."
  - key: nom-d-un-starter-tiers
    format: course
    question: "Comment se nomme, par convention, un starter qui ne vient pas de l'équipe Spring Boot ?"
    choices:
      - {text: "`nomduprojet-spring-boot-starter`", correct: true}
      - {text: "`spring-boot-starter-nomduprojet`", correct: false}
      - {text: "`spring-starter-nomduprojet`", correct: false}
      - {text: "`nomduprojet-starter-spring`", correct: false}
    answer: "Le préfixe `spring-boot-starter-` est réservé aux starters officiels. Un tiers met le nom de son projet en tête."
  - key: starter-web-de-boot-4
    format: course
    question: "Comment s'appelle le starter web MVC dans Spring Boot 4 ?"
    choices:
      - {text: "`spring-boot-starter-webmvc`", correct: true}
      - {text: "`spring-boot-starter-servlet`", correct: false}
      - {text: "`spring-boot-starter-mvc`", correct: false}
      - {text: "`spring-boot-starter-tomcat-web`", correct: false}
    answer: "Boot 4 renomme le starter en `spring-boot-starter-webmvc` ; `spring-boot-starter-web` reste disponible comme alias."
  - key: vf-parent-herite-du-bom
    format: true-false
    question: "`spring-boot-starter-parent` hérite de `spring-boot-dependencies`, donc des versions qu'il fixe."
    truth: true
    answer: "Le parent ajoute aussi la configuration des plugins (compilation avec `-parameters`, encodage, plugin Spring Boot)."
  - key: vf-sans-parent
    format: true-false
    question: "Sans `spring-boot-starter-parent`, un projet Maven ne peut pas profiter de la gestion des versions de Spring Boot."
    truth: false
    answer: "On importe le BOM `spring-boot-dependencies` dans `<dependencyManagement>`, en portée `import`."
  - key: vf-starter-declenche
    format: true-false
    question: "Ajouter `spring-boot-starter-data-jpa` déclenche l'auto-configuration de JPA, sans autre annotation."
    truth: true
    answer: "Les classes de JPA arrivent dans le classpath, et les conditions de l'auto-configuration sont remplies."
  - key: vf-ancien-starter-web
    format: true-false
    question: "Dans Spring Boot 4, `spring-boot-starter-web` n'existe plus du tout."
    truth: false
    answer: "Il reste un alias de `spring-boot-starter-webmvc`, pour faciliter la migration."
  - key: qcm-importer-le-bom
    format: multiple-choice
    question: "Comment profiter des versions de Spring Boot quand le projet Maven a déjà un autre parent ?"
    choices:
      - {text: "Importer `spring-boot-dependencies` dans `<dependencyManagement>`, en portée `import`", correct: true}
      - {text: "Copier à la main les versions de Spring Boot dans chaque dépendance", correct: false}
      - {text: "Déclarer `spring-boot-starter-parent` comme une simple dépendance", correct: false}
      - {text: "Renommer le parent actuel en `spring-boot-starter-parent`", correct: false}
    answer: "L'import du BOM apporte les versions, sans les réglages de plugins du parent, qu'on recopie au besoin."
  - key: qcm-passer-a-jetty
    format: multiple-choice
    question: "Comment remplacer Tomcat par Jetty dans une application web ?"
    choices:
      - {text: "Exclure `spring-boot-starter-tomcat`, et ajouter `spring-boot-starter-jetty`", correct: true}
      - {text: "Ajouter `server.type=jetty` dans le fichier `application.properties`", correct: false}
      - {text: "Annoter la classe principale avec `@EnableJetty`", correct: false}
      - {text: "Ajouter `spring-boot-starter-jetty` : Tomcat se retire de lui-même", correct: false}
    answer: "Le serveur est choisi par le classpath. Avec les deux présents, c'est Tomcat qui l'emporte : il faut l'exclure."
  - key: qcm-starter-de-test
    format: multiple-choice
    question: "Quel starter apporte JUnit, AssertJ, Mockito et les outils de test de Spring ?"
    choices:
      - {text: "`spring-boot-starter-test`", correct: true}
      - {text: "`spring-boot-starter-junit`", correct: false}
      - {text: "`spring-boot-starter-mockito`", correct: false}
      - {text: "`spring-boot-testcontainers`", correct: false}
    answer: "On l'ajoute en portée `test`. `spring-boot-testcontainers` intègre Testcontainers, sans JUnit ni AssertJ."
  - key: qcm-imposer-une-version
    format: multiple-choice
    question: "Avec le parent Spring Boot, comment imposer une autre version d'une bibliothèque gérée ?"
    choices:
      - {text: "Redéfinir sa propriété de version, comme `<hibernate.version>`", correct: true}
      - {text: "Ajouter un `<version>` dans la déclaration du parent", correct: false}
      - {text: "Supprimer la bibliothèque du dépôt Maven local", correct: false}
      - {text: "Annoter la classe principale avec `@Version`", correct: false}
    answer: "Le BOM lit ses versions dans des propriétés : en redéfinir une suffit, et toutes les dépendances liées suivent."
  - key: trous-starter-web
    format: fill-in
    question: |-
      Complète pour une application web MVC avec Spring Boot 4 :
      ```xml
      <dependency>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-starter-___</artifactId>
      </dependency>
      ```
    blanks:
      - [webmvc, web]
    answer: "`spring-boot-starter-webmvc` (ou son alias `spring-boot-starter-web`). Pas de version : le BOM la fixe."
  - key: trous-parent
    format: fill-in
    question: |-
      Complète le parent Maven d'une application Spring Boot :
      ```xml
      <parent>
          <groupId>org.springframework.boot</groupId>
          <artifactId>___</artifactId>
          <version>4.1.2</version>
      </parent>
      ```
    blanks:
      - [spring-boot-starter-parent]
    answer: "`spring-boot-starter-parent` : les versions du BOM et la configuration des plugins."
  - key: trous-scope-import
    format: fill-in
    question: |-
      Complète pour importer le BOM de Spring Boot :
      ```xml
      <dependency>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-dependencies</artifactId>
          <version>4.1.2</version>
          <type>pom</type>
          <scope>___</scope>
      </dependency>
      ```
    blanks:
      - [import]
    answer: "La portée `import`, dans `<dependencyManagement>`, recopie les versions du BOM dans le projet."
  - key: trous-starter-validation
    format: fill-in
    question: |-
      Complète pour ajouter Bean Validation (`@NotBlank`, `@Valid`) :
      ```xml
      <artifactId>spring-boot-starter-___</artifactId>
      ```
    blanks:
      - [validation]
    answer: "`spring-boot-starter-validation` apporte Hibernate Validator, et son auto-configuration."
  - key: situation-versions-partout
    format: scenario
    question: |-
      Un collègue ajoute un `<version>` à chaque dépendance Spring de son projet Boot, « pour être sûr ». Qu'en dis-tu ?
    choices:
      - {text: "Il risque des versions incompatibles : mieux vaut laisser le BOM choisir", correct: true}
      - {text: "C'est obligatoire : sans version, Maven refuse de construire", correct: false}
      - {text: "C'est sans effet : Maven ignore ces versions", correct: false}
      - {text: "C'est recommandé, car cela accélère la compilation", correct: false}
    answer: |-
      Une version écrite à la main l'emporte sur celle du BOM : à la prochaine montée de Spring Boot, elle restera
      figée et pourra casser l'ensemble.
  - key: situation-starter-maison
    format: scenario
    question: |-
      Ton entreprise veut que toutes ses applications aient le même client d'audit, configuré automatiquement. Que
      proposes-tu ?
    choices:
      - {text: "Un starter maison, avec son auto-configuration, en une dépendance", correct: true}
      - {text: "Copier la classe de configuration dans chaque application", correct: false}
      - {text: "Un `application.properties` partagé sur un serveur de fichiers", correct: false}
      - {text: "Un aspect qui crée le client d'audit au premier appel", correct: false}
    answer: |-
      Un module `audit-spring-boot-starter` tire la bibliothèque et son auto-configuration. Chaque application
      l'ajoute en une ligne, et peut remplacer le client par le sien.
  - key: situation-base-surprise
    format: scenario
    question: |-
      Après l'ajout de `spring-boot-starter-data-jpa` et de `com.h2database:h2`, l'application crée une base en
      mémoire, sans aucune configuration. Pourquoi ?
    choices:
      - {text: "L'auto-configuration détecte H2, et crée une source de données embarquée", correct: true}
      - {text: "Spring Boot démarre une base H2 dans toute application", correct: false}
      - {text: "Tomcat embarque une base H2 pour ses propres besoins", correct: false}
      - {text: "Le profil `default` active une base en mémoire", correct: false}
    answer: |-
      Sans `spring.datasource.url`, Boot cherche une base embarquée dans le classpath (H2, HSQL, Derby) et la
      configure. C'est pratique en développement ; en production, on donne une URL.
  - key: situation-migrer-starter-web
    format: scenario
    question: |-
      Ton projet Spring Boot 3 dépend de `spring-boot-starter-web`. Que fais-tu de cette dépendance en migrant vers
      Spring Boot 4 ?
    choices:
      - {text: "Passer à `spring-boot-starter-webmvc` ; l'ancien nom reste un alias en attendant", correct: true}
      - {text: "Rien : `spring-boot-starter-web` est le seul nom accepté par Boot 4", correct: false}
      - {text: "La supprimer : Boot 4 inclut le web dans son cœur", correct: false}
      - {text: "La remplacer par `spring-boot-starter-webflux`", correct: false}
    answer: |-
      Le nouveau nom dit clairement qu'il s'agit de Spring MVC (et non de WebFlux). L'alias permet une migration en
      douceur. Les starters de test suivent : `spring-boot-starter-webmvc-test`.
