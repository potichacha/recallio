notion: security-filter-chain
lesson: |-
  On configure Spring Security en déclarant un **bean `SecurityFilterChain`**, construit à partir de `HttpSecurity`.
  Ce bean a remplacé la classe `WebSecurityConfigurerAdapter`, supprimée en Spring Security 6.0.

  ```java
  @Configuration
  @EnableWebSecurity
  public class SecurityConfig {

      @Bean
      SecurityFilterChain securite(HttpSecurity http) throws Exception {
          http
              .authorizeHttpRequests(auth -> auth
                  .requestMatchers("/actuator/health", "/api/public/**").permitAll()
                  .requestMatchers(HttpMethod.DELETE, "/api/**").hasRole("ADMIN")
                  .requestMatchers("/admin/**").hasRole("ADMIN")
                  .anyRequest().authenticated())
              .httpBasic(Customizer.withDefaults())
              .formLogin(Customizer.withDefaults());
          return http.build();
      }
  }
  ```

  **La forme.** Chaque aspect se règle par une **lambda** (`authorizeHttpRequests(auth -> ...)`,
  `csrf(csrf -> ...)`) ; `Customizer.withDefaults()` active une fonction avec ses réglages par défaut. La méthode
  renvoie `http.build()`. Avec Spring Boot, `@EnableWebSecurity` est facultative : la configuration automatique
  l'applique déjà.

  **Déclarer ce bean remplace la configuration par défaut** de Spring Boot : seule ta chaîne s'applique.

  **Les règles d'URL.** Dans `authorizeHttpRequests`, les règles se lisent **dans l'ordre, et la première qui
  correspond l'emporte**. On écrit donc les plus précises d'abord, et **`anyRequest()` en dernier** : Spring Security
  refuse de démarrer si une règle suit `anyRequest()`.

  | Règle | Effet |
  |---|---|
  | `permitAll()` | tout le monde, même anonyme |
  | `authenticated()` | tout utilisateur authentifié |
  | `hasRole("ADMIN")` | l'autorité `ROLE_ADMIN` |
  | `hasAuthority("SCOPE_lire")` | cette autorité exacte |
  | `denyAll()` | personne |

  `requestMatchers` accepte des motifs (`/api/**`) et une méthode HTTP (`HttpMethod.DELETE`). Les anciens
  `antMatchers` et `mvcMatchers` ont disparu en 6.0.

  **Fermé par défaut.** Terminer par `anyRequest().authenticated()` protège toute route oubliée ; on ouvre
  explicitement ce qui doit l'être.

  **Plusieurs chaînes.** Chaque chaîne peut se limiter à une partie des URL par `http.securityMatcher("/api/**")`,
  avec un `@Order` pour l'ordre de choix : une chaîne sans état pour l'API, une chaîne à formulaire pour le
  back-office.

  **Ouvrir plutôt qu'ignorer.** `WebSecurityCustomizer` et `web.ignoring()` sortent des chemins de toute la sécurité, en-têtes
  de protection compris. On préfère `permitAll()`, qui garde la chaîne.

  **En entretien** : « Je déclare un bean `SecurityFilterChain` à partir de `HttpSecurity`, configuré par lambdas :
  `authorizeHttpRequests` avec les règles les plus précises d'abord et `anyRequest().authenticated()` en dernier, puis
  le mode d'authentification. Ce bean remplace la configuration par défaut de Spring Boot, et l'ancien
  `WebSecurityConfigurerAdapter`. »
cards:
  - key: remplacant-de-l-adapter
    format: course
    question: "Qu'a remplacé le bean `SecurityFilterChain` dans la configuration de Spring Security ?"
    choices:
      - {text: "La classe `WebSecurityConfigurerAdapter`, supprimée en 6.0", correct: true}
      - {text: "L'annotation `@EnableWebSecurity`, supprimée en 6.0", correct: false}
      - {text: "Le filtre `DelegatingFilterProxy`, supprimé en 6.0", correct: false}
      - {text: "L'interface `UserDetailsService`, supprimée en 6.0", correct: false}
    answer: "On n'hérite plus d'une classe : on déclare des beans. `@EnableWebSecurity`, `DelegatingFilterProxy` et `UserDetailsService` existent toujours."
  - key: ordre-des-regles
    format: course
    question: "Dans `authorizeHttpRequests`, quelle règle s'applique quand plusieurs correspondent à une requête ?"
    choices:
      - {text: "La première déclarée qui correspond", correct: true}
      - {text: "La plus restrictive de celles qui correspondent", correct: false}
      - {text: "La dernière déclarée qui correspond", correct: false}
      - {text: "La plus précise, quel que soit l'ordre", correct: false}
    answer: "Les règles sont lues de haut en bas. Une règle large placée tôt masque les règles précises qui la suivent : on écrit les plus précises d'abord."
  - key: bean-et-configuration-par-defaut
    format: course
    question: "Que devient la sécurité par défaut de Spring Boot quand tu déclares ton propre bean `SecurityFilterChain` ?"
    choices:
      - {text: "Elle s'efface : seule ta chaîne s'applique", correct: true}
      - {text: "Elle s'ajoute à la tienne, qui passe en second", correct: false}
      - {text: "Elle reste prioritaire sur toutes tes règles", correct: false}
      - {text: "Elle fait échouer le démarrage, en conflit avec la tienne", correct: false}
    answer: "La configuration automatique se retire dès qu'un bean `SecurityFilterChain` existe. Tout ce qui n'est pas dans ta chaîne n'est plus configuré, formulaire compris."
  - key: sens-de-withdefaults
    format: course
    question: "Que signifie `http.httpBasic(Customizer.withDefaults())` ?"
    choices:
      - {text: "Activer HTTP Basic avec ses réglages par défaut", correct: true}
      - {text: "Désactiver HTTP Basic dans cette chaîne", correct: false}
      - {text: "Remettre toute la sécurité à ses réglages par défaut", correct: false}
      - {text: "Autoriser HTTP Basic sans mot de passe", correct: false}
    answer: "`Customizer.withDefaults()` est une lambda qui ne change rien : la fonction est activée telle quelle. Pour la régler, on passe sa propre lambda."
  - key: vf-antmatchers
    format: true-false
    question: "`antMatchers` n'existe plus en Spring Security 7 : on écrit `requestMatchers`."
    truth: true
    answer: "`antMatchers`, `mvcMatchers` et `regexMatchers` ont été retirés en 6.0. `requestMatchers` choisit lui-même le bon type de correspondance."
  - key: vf-anyrequest-en-dernier
    format: true-false
    question: "`anyRequest()` doit être la dernière règle de `authorizeHttpRequests`."
    truth: true
    answer: "Elle correspond à tout : une règle placée après ne serait jamais lue. Spring Security le vérifie et refuse de démarrer."
  - key: vf-enablewebsecurity-indispensable
    format: true-false
    question: "Avec Spring Boot, `@EnableWebSecurity` est indispensable pour que ton bean `SecurityFilterChain` soit pris en compte."
    truth: false
    answer: "La configuration automatique de Spring Boot l'applique déjà. La mettre ne fait pas de mal, et rend la classe explicite."
  - key: vf-plusieurs-chaines
    format: true-false
    question: "Une application peut déclarer plusieurs beans `SecurityFilterChain`, chacun pour une partie des URL."
    truth: true
    answer: "Chaque chaîne se limite par `securityMatcher` et s'ordonne par `@Order`. La première qui correspond à la requête la traite."
  - key: qcm-ouvrir-la-sante
    format: multiple-choice
    question: "Quelle règle laisse `/actuator/health` accessible à tous ?"
    choices:
      - {text: "`.requestMatchers(\"/actuator/health\").permitAll()`", correct: true}
      - {text: "`.requestMatchers(\"/actuator/health\").authenticated()`", correct: false}
      - {text: "`.requestMatchers(\"/actuator/health\").anonymous()`", correct: false}
      - {text: "`.requestMatchers(\"/actuator/health\").denyAll()`", correct: false}
    answer: "`permitAll()` laisse passer tout le monde. `anonymous()` n'admet que les anonymes : un utilisateur connecté serait refusé."
  - key: qcm-delete-pour-les-admins
    format: multiple-choice
    question: "Comment réserves-tu aux administrateurs les seules requêtes `DELETE` sur `/api/**` ?"
    choices:
      - {text: "`.requestMatchers(HttpMethod.DELETE, \"/api/**\").hasRole(\"ADMIN\")`", correct: true}
      - {text: "`.requestMatchers(\"/api/**\").hasRole(\"ADMIN\")`", correct: false}
      - {text: "`.requestMatchers(\"DELETE /api/**\").hasRole(\"ADMIN\")`", correct: false}
      - {text: "`.requestMatchers(\"/api/**\", \"DELETE\").hasRole(\"ADMIN\")`", correct: false}
    answer: "La méthode HTTP se passe en premier argument. Sans elle, la règle vaudrait pour tous les verbes ; la chaîne `\"DELETE /api/**\"` serait lue comme un chemin."
  - key: qcm-limiter-une-chaine
    format: multiple-choice
    question: "Quelle méthode limite une `SecurityFilterChain` aux seules URL `/api/**` ?"
    choices:
      - {text: "`http.securityMatcher(\"/api/**\")`", correct: true}
      - {text: "`http.requestMatchers(\"/api/**\")`", correct: false}
      - {text: "`http.antMatcher(\"/api/**\")`", correct: false}
      - {text: "`http.path(\"/api/**\")`", correct: false}
    answer: "`securityMatcher` décide quelles requêtes la chaîne traite ; `requestMatchers`, dans `authorizeHttpRequests`, décide des règles à l'intérieur."
  - key: qcm-valeur-de-retour
    format: multiple-choice
    question: "Que renvoie la méthode `@Bean` qui configure la sécurité ?"
    choices:
      - {text: "`http.build()`, la chaîne construite à partir de `HttpSecurity`", correct: true}
      - {text: "`http`, l'objet `HttpSecurity` lui-même", correct: false}
      - {text: "`new DefaultSecurityFilterChain()`, vide", correct: false}
      - {text: "`null`, la configuration étant enregistrée ailleurs", correct: false}
    answer: "Le type de retour est `SecurityFilterChain` ; `build()` l'assemble à partir de la configuration. La méthode déclare `throws Exception`, comme `build()`."
  - key: trous-authorizehttprequests
    format: fill-in
    question: |-
      Complète pour déclarer les règles d'autorisation par URL :
      ```java
      http.___(auth -> auth
              .requestMatchers("/api/public/**").permitAll()
              .anyRequest().authenticated());
      ```
    blanks:
      - [authorizeHttpRequests]
    answer: "`authorizeHttpRequests` configure l'`AuthorizationFilter`. L'ancien `authorizeRequests` n'est plus à utiliser."
  - key: trous-permitall
    format: fill-in
    question: |-
      Complète pour ouvrir ces chemins à tous :
      ```java
      .requestMatchers("/api/public/**").___()
      ```
    blanks:
      - [permitAll]
    answer: "`permitAll()` laisse passer les requêtes, anonymes comprises."
  - key: trous-anyrequest
    format: fill-in
    question: |-
      Complète la dernière règle, qui exige une authentification pour tout le reste :
      ```java
      .___().authenticated()
      ```
    blanks:
      - [anyRequest]
    answer: "`anyRequest()` correspond à toute requête : elle vient en dernier."
  - key: trous-build
    format: fill-in
    question: |-
      Complète le bean de sécurité :
      ```java
      @Bean
      SecurityFilterChain securite(HttpSecurity http) throws Exception {
          http.authorizeHttpRequests(auth -> auth.anyRequest().authenticated())
              .httpBasic(Customizer.withDefaults());
          return http.___();
      }
      ```
    blanks:
      - [build]
    answer: "`http.build()` construit la `SecurityFilterChain` décrite par la configuration."
  - key: bug-anyrequest-en-premier
    format: bug-fix
    question: |-
      L'application refuse de démarrer : Spring Security signale qu'on ne peut plus déclarer de `requestMatchers`
      après `anyRequest`. Quelle correction est la bonne ?
      ```java
      http.authorizeHttpRequests(auth -> auth
              .anyRequest().authenticated()
              .requestMatchers("/api/public/**").permitAll());
      ```
    choices:
      - {text: "Placer la règle `/api/public/**` avant `anyRequest()`", correct: true}
      - {text: "Remplacer `anyRequest()` par `requestMatchers(\"/**\")`, au même endroit", correct: false}
      - {text: "Remplacer `permitAll()` par `anonymous()` sur `/api/public/**`", correct: false}
      - {text: "Ajouter `@Order(1)` sur le bean de la chaîne de sécurité", correct: false}
    answer: |-
      ```java
      http.authorizeHttpRequests(auth -> auth
              .requestMatchers("/api/public/**").permitAll()
              .anyRequest().authenticated());
      ```
      La première règle qui correspond l'emporte : `anyRequest()` en tête masquerait toutes les autres. Un `/**` en
      tête aurait le même défaut, sans même l'erreur au démarrage.
  - key: bug-regle-large-en-premier
    format: bug-fix
    question: |-
      Les chemins `/api/public/**` répondent 401 aux visiteurs anonymes, alors qu'ils devraient être ouverts. Quelle
      correction est la bonne ?
      ```java
      http.authorizeHttpRequests(auth -> auth
              .requestMatchers("/api/**").authenticated()
              .requestMatchers("/api/public/**").permitAll()
              .anyRequest().denyAll());
      ```
    choices:
      - {text: "Placer la règle `/api/public/**` avant la règle `/api/**`", correct: true}
      - {text: "Remplacer `permitAll()` par `anonymous()` sur `/api/public/**`", correct: false}
      - {text: "Remplacer `denyAll()` par `permitAll()` sur `anyRequest()`", correct: false}
      - {text: "Écrire `/api/public/*` au lieu de `/api/public/**`", correct: false}
    answer: |-
      ```java
      .requestMatchers("/api/public/**").permitAll()
      .requestMatchers("/api/**").authenticated()
      ```
      `/api/public/produits` correspond déjà à `/api/**`, lue en premier : elle exige une authentification. La règle
      précise doit passer avant la règle large.
  - key: bug-bean-oublie
    format: bug-fix
    question: |-
      Ta configuration n'a aucun effet : toutes les routes exigent le mot de passe généré affiché au démarrage.
      Quelle correction est la bonne ?
      ```java
      @Configuration
      public class SecurityConfig {

          SecurityFilterChain securite(HttpSecurity http) throws Exception {
              http.authorizeHttpRequests(auth -> auth
                      .requestMatchers("/api/public/**").permitAll()
                      .anyRequest().authenticated());
              return http.build();
          }
      }
      ```
    choices:
      - {text: "Annoter la méthode `securite` avec `@Bean`", correct: true}
      - {text: "Rendre la méthode `securite` publique et statique", correct: false}
      - {text: "Annoter la classe avec `@Component` en plus de `@Configuration`", correct: false}
      - {text: "Renommer la méthode en `securityFilterChain`", correct: false}
    answer: |-
      ```java
      @Bean
      SecurityFilterChain securite(HttpSecurity http) throws Exception {
      ```
      Sans `@Bean`, la méthode n'est jamais appelée : aucune chaîne n'existe, et Spring Boot garde sa configuration
      par défaut.
  - key: bug-adapter-supprime
    format: bug-fix
    question: |-
      Après la migration vers Spring Boot 4, cette classe ne compile plus : `WebSecurityConfigurerAdapter`
      introuvable. Quelle correction est la bonne ?
      ```java
      @Configuration
      public class SecurityConfig extends WebSecurityConfigurerAdapter {
          @Override
          protected void configure(HttpSecurity http) throws Exception {
              http.authorizeRequests().anyRequest().authenticated().and().httpBasic();
          }
      }
      ```
    choices:
      - {text: "Déclarer un bean `SecurityFilterChain` configuré par lambdas", correct: true}
      - {text: "Ajouter la dépendance de Spring Security 5 à côté de la 7", correct: false}
      - {text: "Hériter de `WebSecurityConfiguration` à la place", correct: false}
      - {text: "Supprimer la classe : la configuration par défaut suffit", correct: false}
    answer: |-
      ```java
      @Bean
      SecurityFilterChain securite(HttpSecurity http) throws Exception {
          http.authorizeHttpRequests(auth -> auth.anyRequest().authenticated())
              .httpBasic(Customizer.withDefaults());
          return http.build();
      }
      ```
      L'adaptateur a disparu en 6.0, comme `authorizeRequests` et les chaînages par `and()` depuis. Mélanger deux
      versions de Spring Security ne marcherait pas.
  - key: situation-migration-d-une-vieille-config
    format: scenario
    question: |-
      Tu migres une application de Spring Boot 2 vers Spring Boot 4. Sa sécurité étend `WebSecurityConfigurerAdapter`
      et utilise `antMatchers`. Que fais-tu ?
    choices:
      - {text: "La réécrire en bean `SecurityFilterChain`, avec lambdas et `requestMatchers`", correct: true}
      - {text: "Garder la classe et désactiver la vérification du compilateur", correct: false}
      - {text: "Supprimer la sécurité le temps de la migration, puis la remettre", correct: false}
      - {text: "Rester en Spring Boot 2 pour la seule partie sécurité", correct: false}
    answer: |-
      La traduction est mécanique : `configure(HttpSecurity)` devient une méthode `@Bean`, `antMatchers`
      `requestMatchers`, `authorizeRequests` `authorizeHttpRequests`, et chaque `and()` une lambda. Les tests de
      sécurité vérifient que rien ne s'est ouvert.
  - key: situation-sonde-en-401
    format: scenario
    question: |-
      La sonde de vivacité de Kubernetes reçoit 401 sur `/actuator/health`, et redémarre le pod en boucle. Que
      fais-tu ?
    choices:
      - {text: "J'ajoute `.requestMatchers(\"/actuator/health\").permitAll()` avant `anyRequest()`", correct: true}
      - {text: "Je donne à la sonde le mot de passe d'un administrateur", correct: false}
      - {text: "Je désactive Spring Security en production", correct: false}
      - {text: "Je retire la sonde de vivacité du déploiement", correct: false}
    answer: |-
      La santé doit être lisible sans identifiants ; les autres points d'Actuator restent protégés. La règle passe
      avant `anyRequest()`, sinon elle ne serait jamais lue.
  - key: situation-ouvert-ou-ferme
    format: scenario
    question: |-
      Ton équipe débat : les nouvelles routes doivent-elles être ouvertes ou fermées par défaut ? Que défends-tu ?
    choices:
      - {text: "Fermées : `anyRequest().authenticated()` en dernier, et l'on ouvre exprès", correct: true}
      - {text: "Ouvertes : chaque développeur protège ses routes au cas par cas", correct: false}
      - {text: "Ouvertes en développement, et fermées à la main avant la production", correct: false}
      - {text: "Peu importe : un pare-feu protège déjà l'application", correct: false}
    answer: |-
      Une route oubliée reste protégée : l'erreur se voit tout de suite (un 401), au lieu d'une fuite discrète. Les
      routes publiques sont listées explicitement, donc relues.
  - key: situation-web-ignoring
    format: scenario
    question: |-
      Un collègue sort `/api/public/**` de la sécurité avec `web.ignoring()`, « pour aller plus vite ». Que lui
      proposes-tu ?
    choices:
      - {text: "`permitAll()` : la requête garde les en-têtes et protections de la chaîne", correct: true}
      - {text: "`denyAll()` : un chemin public est un risque inutile", correct: false}
      - {text: "Rien : `web.ignoring()` est la manière recommandée", correct: false}
      - {text: "Une seconde application, sans Spring Security", correct: false}
    answer: |-
      Un chemin ignoré ne passe par aucun filtre : ni en-têtes de sécurité, ni CORS de la chaîne. `permitAll()`
      ouvre l'accès sans retirer ces protections, pour un coût négligeable.
