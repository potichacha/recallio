notion: jpa-entites
lesson: |-
  **JPA** (Jakarta Persistence, paquet `jakarta.persistence`) est la spécification Java de l'accès aux bases
  relationnelles par objets. **Hibernate** en est l'implémentation que Spring Boot configure, et **Spring Data JPA**
  ajoute les repositories par-dessus. Le starter `spring-boot-starter-data-jpa` apporte les trois, plus la
  `DataSource`, l'`EntityManagerFactory` et le gestionnaire de transactions.

  **Une entité** est une classe dont chaque instance correspond à une ligne d'une table :

  ```java
  @Entity
  public class Produit {

      @Id
      @GeneratedValue
      private Long id;

      private String nom;

      @Column(nullable = false)
      private int prixUnitaire;

      @Enumerated(EnumType.STRING)
      private Categorie categorie;

      protected Produit() {}                     // pour Hibernate

      public Produit(String nom, int prixUnitaire, Categorie categorie) { ... }
  }
  ```

  **Les règles d'une entité.**
  - `@Entity` sur la classe, et un identifiant `@Id` (sinon Hibernate refuse de démarrer : « has no identifier ») ;
  - un **constructeur sans argument**, `public` ou `protected` : Hibernate crée l'objet vide, puis remplit ses
    champs. Sans lui, l'écriture marche, mais la lecture échoue : « No default constructor for entity » ;
  - une classe ni `final` ni `record` : Hibernate en dérive des proxys pour le chargement paresseux, et un record
    n'a ni constructeur vide ni champs modifiables.

  **La clé générée.** `@GeneratedValue` laisse la base fournir l'identifiant :

  | Stratégie | Fonctionnement |
  |---|---|
  | `AUTO` (défaut) | Hibernate choisit ; avec un `Long`, une séquence `produit_seq` |
  | `SEQUENCE` | une séquence ; Hibernate en réserve 50 valeurs d'un coup |
  | `IDENTITY` | une colonne auto-incrémentée ; l'INSERT part tout de suite, sans regroupement |
  | `UUID` | un UUID généré par Hibernate |

  **Le nommage.** Spring Boot traduit les noms Java en `snake_case` : la classe `LigneCommande` devient la table
  `ligne_commande`, le champ `prixUnitaire` la colonne `prix_unitaire`. `@Table(name = "...")` et
  `@Column(name = "...")` imposent un autre nom, par exemple quand le nom de la classe est un mot réservé du SQL
  (`Order`, `User`) : `@Table(name = "commandes")`.

  **Les autres annotations utiles.** `@Column` (`nullable`, `length`, `unique`), `@Transient` (champ non stocké),
  `@Enumerated(EnumType.STRING)` (sans elle, une enum est stockée par son **rang**, et réordonner les constantes
  corrompt les données), `@Embedded` (un objet valeur stocké dans les colonnes de l'entité).

  **Le schéma.** `spring.jpa.hibernate.ddl-auto` dit à Hibernate quoi faire du schéma : `create-drop` par défaut avec
  une base embarquée comme H2 (et sans outil de migration), `none` sinon. En production, on garde `none` ou
  `validate`, et l'on confie le schéma à Flyway ou Liquibase.

  **En entretien** : « Une entité JPA est une classe `@Entity` avec un `@Id`, souvent `@GeneratedValue`, et un
  constructeur sans argument au moins `protected` pour Hibernate. Spring Boot traduit les noms en `snake_case`, et
  j'annote les enums en `EnumType.STRING`. Je laisse le schéma à Flyway en production, avec `ddl-auto` à `validate`
  au plus. »
cards:
  - key: constructeur-vide
    format: course
    question: "Pourquoi une entité JPA doit-elle avoir un constructeur sans argument ?"
    choices:
      - {text: "Hibernate crée l'objet vide, puis remplit ses champs avec la ligne lue", correct: true}
      - {text: "Spring en a besoin pour injecter l'entité dans les services qui l'utilisent", correct: false}
      - {text: "Le compilateur l'exige de toute classe qui porte l'annotation `@Entity`", correct: false}
      - {text: "Jackson l'utilise pour écrire la table au démarrage de l'application", correct: false}
    answer: "Pour lire une ligne, Hibernate instancie la classe sans argument, puis affecte ses champs. Il peut être `protected` : il n'est là que pour Hibernate."
  - key: strategie-auto
    format: course
    question: "Avec `@Id @GeneratedValue private Long id;` et Hibernate 7, comment l'identifiant est-il produit ?"
    choices:
      - {text: "Par une séquence, `produit_seq`, dont Hibernate réserve 50 valeurs", correct: true}
      - {text: "Par une colonne auto-incrémentée, remplie au moment de l'INSERT", correct: false}
      - {text: "Par un UUID aléatoire, calculé en Java avant l'enregistrement", correct: false}
      - {text: "Par un compteur en mémoire, remis à zéro au redémarrage", correct: false}
    answer: "La stratégie `AUTO` choisit une séquence quand la base en a. Le pas de 50 évite d'interroger la séquence à chaque INSERT. `IDENTITY` s'obtient avec `@GeneratedValue(strategy = GenerationType.IDENTITY)`."
  - key: nommage
    format: course
    question: "Sans `@Table` ni `@Column`, quels noms Spring Boot donne-t-il à l'entité `LigneCommande` et à son champ `prixUnitaire` ?"
    choices:
      - {text: "La table `ligne_commande` et la colonne `prix_unitaire`", correct: true}
      - {text: "La table `LigneCommande` et la colonne `prixUnitaire`", correct: false}
      - {text: "La table `lignecommande` et la colonne `prixunitaire`", correct: false}
      - {text: "La table `ligne_commandes` et la colonne `prix_unitaire`", correct: false}
    answer: "La stratégie de nommage de Spring Boot sépare les mots par des soulignés et passe en minuscules. Elle ne met pas de pluriel."
  - key: enum-ordinal
    format: course
    question: "Quel risque court une entité qui stocke une enum sans `@Enumerated(EnumType.STRING)` ?"
    choices:
      - {text: "Elle est stockée par son rang : réordonner les constantes corrompt les données", correct: true}
      - {text: "Elle n'est pas stockée du tout : Hibernate ignore les champs de type enum", correct: false}
      - {text: "Elle est stockée par son nom, et renommer une constante casse les lectures", correct: false}
      - {text: "Hibernate refuse de démarrer tant que le type de stockage n'est pas précisé", correct: false}
    answer: "Le défaut de JPA est `EnumType.ORDINAL` : 0, 1, 2... Insérer une constante au milieu décale toutes les valeurs déjà en base. `EnumType.STRING` stocke le nom, lisible et stable."
  - key: vf-record-entite
    format: true-false
    question: "Un `record` Java peut servir d'entité JPA."
    truth: false
    answer: "Un record est `final`, sans constructeur vide ni champs modifiables : Hibernate ne peut ni le créer vide ni en dériver un proxy. Les records servent très bien de DTO et de projections."
  - key: vf-constructeur-protected
    format: true-false
    question: "Le constructeur sans argument d'une entité peut être `protected`."
    truth: true
    answer: "Hibernate y accède par réflexion. `protected` le cache au reste du code, qui passe par le constructeur métier."
  - key: vf-ddl-auto-h2
    format: true-false
    question: "Avec une base H2 embarquée et sans Flyway ni Liquibase, Spring Boot crée le schéma au démarrage et le supprime à l'arrêt."
    truth: true
    answer: "`spring.jpa.hibernate.ddl-auto` vaut alors `create-drop`. Avec une vraie base, ou avec un outil de migration, il vaut `none`."
  - key: vf-transient
    format: true-false
    question: "Un champ annoté `@Transient` (de `jakarta.persistence`) n'a pas de colonne dans la table."
    truth: true
    answer: "Hibernate l'ignore : ni lu ni écrit. C'est utile pour une valeur calculée ou un cache en mémoire."
  - key: qcm-annotation-identifiant
    format: multiple-choice
    question: "Quelle annotation désigne la clé primaire d'une entité ?"
    choices:
      - {text: "`@Id`", correct: true}
      - {text: "`@Key`", correct: false}
      - {text: "`@PrimaryKey`", correct: false}
      - {text: "`@Column(primary = true)`", correct: false}
    answer: "`jakarta.persistence.Id`. `@GeneratedValue` s'y ajoute quand la base fournit la valeur."
  - key: qcm-mot-reserve
    format: multiple-choice
    question: "Ton entité s'appelle `Order`, un mot réservé du SQL. Comment éviter les erreurs de syntaxe ?"
    choices:
      - {text: "`@Table(name = \"commandes\")` sur la classe", correct: true}
      - {text: "`@Entity(name = \"Order\")` sur la classe", correct: false}
      - {text: "`@Column(name = \"order\")` sur l'identifiant", correct: false}
      - {text: "`@Transient` sur la classe tout entière", correct: false}
    answer: "`@Table` donne le nom de la table dans les requêtes SQL. `@Entity(name = ...)` ne change que le nom de l'entité dans les requêtes JPQL."
  - key: qcm-identity
    format: multiple-choice
    question: "Quelle stratégie de `@GeneratedValue` s'appuie sur une colonne auto-incrémentée de la base ?"
    choices:
      - {text: "`GenerationType.IDENTITY`", correct: true}
      - {text: "`GenerationType.SEQUENCE`", correct: false}
      - {text: "`GenerationType.TABLE`", correct: false}
      - {text: "`GenerationType.UUID`", correct: false}
    answer: "Avec `IDENTITY`, la base attribue l'identifiant pendant l'INSERT : Hibernate doit l'envoyer tout de suite pour le connaître, ce qui empêche de regrouper les INSERT en lots."
  - key: qcm-ddl-production
    format: multiple-choice
    question: "Quelle valeur de `spring.jpa.hibernate.ddl-auto` convient en production, quand Flyway gère le schéma ?"
    choices:
      - {text: "`validate`", correct: true}
      - {text: "`update`", correct: false}
      - {text: "`create`", correct: false}
      - {text: "`create-drop`", correct: false}
    answer: "`validate` vérifie au démarrage que les entités correspondent au schéma, sans rien modifier. `update` modifie le schéma sans contrôle ni historique ; `create` et `create-drop` effacent les données."
  - key: trous-entite
    format: fill-in
    question: |-
      Complète pour déclarer une entité et sa clé primaire :
      ```java
      @___
      public class Produit {
          @___
          @GeneratedValue
          private Long id;
      }
      ```
    blanks:
      - [Entity]
      - [Id]
    answer: "`@Entity` fait de la classe une entité ; `@Id` désigne sa clé primaire."
  - key: trous-enum
    format: fill-in
    question: |-
      Complète pour stocker l'enum par son nom :
      ```java
      @Enumerated(EnumType.___)
      private Categorie categorie;
      ```
    blanks:
      - [STRING]
    answer: "`EnumType.STRING` stocke `\"LIVRE\"` plutôt que son rang : l'ordre des constantes peut changer sans risque."
  - key: trous-table
    format: fill-in
    question: |-
      Complète pour que l'entité `User` utilise la table `utilisateurs` :
      ```java
      @Entity
      @___(name = "utilisateurs")
      public class User { ... }
      ```
    blanks:
      - [Table]
    answer: "`@Table(name = ...)` fixe le nom de la table ; ici, il évite aussi le mot réservé `user`."
  - key: trous-strategie
    format: fill-in
    question: |-
      Complète pour utiliser une colonne auto-incrémentée :
      ```java
      @Id
      @GeneratedValue(strategy = GenerationType.___)
      private Long id;
      ```
    blanks:
      - [IDENTITY]
    answer: "`IDENTITY` délègue la génération à la colonne. Sans `strategy`, Hibernate utiliserait une séquence."
  - key: bug-sans-id
    format: bug-fix
    question: |-
      L'application refuse de démarrer : `Entity 'boutique.Produit' has no identifier (every '@Entity' class must
      declare or inherit at least one '@Id' or '@EmbeddedId' property)`. Quelle correction est la bonne ?
      ```java
      @Entity
      public class Produit {
          private Long id;
          private String nom;

          protected Produit() {}
      }
      ```
    choices:
      - {text: "Annoter le champ `id` avec `@Id` et `@GeneratedValue`", correct: true}
      - {text: "Annoter le champ `id` avec `@Column(unique = true)`", correct: false}
      - {text: "Renommer le champ `id` en `produitId` pour Hibernate", correct: false}
      - {text: "Remplacer `@Entity` par `@Table` sur la classe `Produit`", correct: false}
    answer: |-
      ```java
      @Id
      @GeneratedValue
      private Long id;
      ```
      Hibernate ne devine pas la clé primaire d'après le nom du champ : il faut `@Id`. Une colonne unique n'est pas
      pour autant l'identifiant de l'entité.
  - key: bug-sans-constructeur
    format: bug-fix
    question: |-
      L'enregistrement fonctionne, mais toute lecture échoue avec `JpaSystemException: No default constructor for
      entity 'boutique.Produit'`. Quelle correction est la bonne ?
      ```java
      @Entity
      public class Produit {
          @Id @GeneratedValue private Long id;
          private String nom;

          public Produit(String nom) {
              this.nom = nom;
          }
      }
      ```
    choices:
      - {text: "Ajouter un constructeur `protected Produit() {}`", correct: true}
      - {text: "Annoter le constructeur existant avec `@Autowired`", correct: false}
      - {text: "Transformer la classe `Produit` en `record`", correct: false}
      - {text: "Déclarer le champ `nom` avec le mot-clé `final`", correct: false}
    answer: |-
      ```java
      protected Produit() {}
      ```
      Pour écrire, c'est ton code qui crée l'objet ; pour lire, c'est Hibernate, qui a besoin d'un constructeur sans
      argument. Un record n'en a pas, et `@Autowired` ne concerne que les beans Spring.
  - key: bug-mot-reserve
    format: bug-fix
    question: |-
      Le premier `save` échoue : `Syntax error in SQL statement "insert into [*]order (libelle,id) values (?,?)";
      expected "identifier"`. Quelle correction est la bonne ?
      ```java
      @Entity
      public class Order {
          @Id @GeneratedValue private Long id;
          private String libelle;

          protected Order() {}
      }
      ```
    choices:
      - {text: "Ajouter `@Table(name = \"commandes\")` sur la classe", correct: true}
      - {text: "Ajouter `@Column(name = \"libelle\")` sur le champ", correct: false}
      - {text: "Remplacer `@GeneratedValue` par une valeur fixée à la main", correct: false}
      - {text: "Ajouter `@Entity(name = \"Commande\")` sur la classe", correct: false}
    answer: |-
      ```java
      @Entity
      @Table(name = "commandes")
      public class Order {
      ```
      `order` est un mot réservé du SQL : la création de la table a déjà échoué au démarrage, et chaque requête sur
      `order` est mal formée. `@Table` donne un autre nom à la table. `@Entity(name = ...)` ne renomme que l'entité
      dans le JPQL, pas la table.
  - key: bug-sans-entity
    format: bug-fix
    question: |-
      L'application refuse de démarrer : `Not a managed type: class boutique.Produit`. Quelle correction est la
      bonne ?
      ```java
      public class Produit {
          @Id @GeneratedValue private Long id;
          private String nom;

          protected Produit() {}
      }

      public interface ProduitRepository extends JpaRepository<Produit, Long> {}
      ```
    choices:
      - {text: "Annoter la classe `Produit` avec `@Entity`", correct: true}
      - {text: "Annoter `ProduitRepository` avec `@Repository`", correct: false}
      - {text: "Annoter la classe `Produit` avec `@Component`", correct: false}
      - {text: "Remplacer `JpaRepository` par `CrudRepository`", correct: false}
    answer: |-
      ```java
      @Entity
      public class Produit {
      ```
      Spring Data crée un repository pour un type que JPA doit gérer. Sans `@Entity`, Hibernate ne connaît pas
      `Produit`, et la création du repository échoue au démarrage. `@Repository` n'est pas nécessaire sur une
      interface de Spring Data.
