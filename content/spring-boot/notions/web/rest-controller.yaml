notion: rest-controller
lesson: |-
  Un **contrôleur REST** reçoit des requêtes HTTP et renvoie des données, le plus souvent en JSON. Avec Spring MVC, c'est
  une classe annotée `@RestController`, dont chaque méthode est associée à un verbe et à un chemin.

  ```java
  @RestController
  @RequestMapping("/api/produits")
  public class ProduitController {

      private final ProduitService produits;

      public ProduitController(ProduitService produits) {
          this.produits = produits;
      }

      @GetMapping
      public List<Produit> tous() {
          return produits.tous();
      }

      @GetMapping("/{id}")
      public Produit unProduit(@PathVariable long id) {
          return produits.trouver(id);
      }

      @PostMapping
      @ResponseStatus(HttpStatus.CREATED)
      public Produit creer(@RequestBody Produit produit) {
          return produits.creer(produit);
      }
  }
  ```

  **`@RestController`** réunit `@Controller` (la classe est un bean, détecté par le scan des composants) et
  `@ResponseBody` (la valeur renvoyée par chaque méthode est écrite dans le corps de la réponse). Un convertisseur de
  messages HTTP (`HttpMessageConverter`) la transforme en JSON avec Jackson.

  **Les chemins.** `@RequestMapping` sur la classe donne un préfixe commun ; chaque méthode précise le verbe et la fin
  du chemin :

  | Annotation | Verbe HTTP | Usage habituel |
  |---|---|---|
  | `@GetMapping` | GET | lire |
  | `@PostMapping` | POST | créer |
  | `@PutMapping` | PUT | remplacer |
  | `@PatchMapping` | PATCH | modifier en partie |
  | `@DeleteMapping` | DELETE | supprimer |

  `@RequestMapping` seul, sans attribut `method`, accepte **tous** les verbes : on lui préfère les annotations
  spécialisées sur les méthodes.

  **Le statut.** Une méthode qui se termine normalement répond **200 OK** ; une méthode `void` répond 200 avec un corps
  vide. `@ResponseStatus(HttpStatus.CREATED)` fixe un autre statut. Le `DispatcherServlet`, qui reçoit toutes les
  requêtes et les distribue aux contrôleurs, répond lui-même :

  - **404 Not Found** quand aucun contrôleur ne sert le chemin (Spring 6.1 et plus : `NoResourceFoundException`) ;
  - **405 Method Not Allowed** quand le chemin existe pour un autre verbe, avec l'en-tête `Allow` qui liste les verbes
    permis.

  **Les pièges.**

  - Avec `@Controller` sans `@ResponseBody`, une chaîne renvoyée est un **nom de vue**, pas un corps : Spring cherche une
    page à afficher, et la requête finit en 404 ou en 500 (« Circular view path »).
  - Le contrôleur doit être dans le paquet de la classe `@SpringBootApplication` ou dans un de ses sous-paquets : sinon
    le scan ne le voit pas, et ses chemins répondent 404.
  - Deux méthodes sur le même verbe et le même chemin empêchent l'application de démarrer : « Ambiguous mapping ».

  **Un contrôleur mince.** Il traduit HTTP en appels au service et rien d'autre : la logique métier vit dans les
  services, qu'on injecte par le constructeur.

  **En entretien** : « `@RestController`, c'est `@Controller` plus `@ResponseBody` : ce que renvoie la méthode est
  converti en JSON par Jackson. `@RequestMapping` sur la classe donne le préfixe, `@GetMapping` ou `@PostMapping` sur
  les méthodes le verbe et le chemin. Le contrôleur reste mince et délègue le métier aux services. »
cards:
  - key: restcontroller-composition
    format: course
    question: "Que réunit l'annotation `@RestController` ?"
    choices:
      - {text: "`@Controller` et `@ResponseBody`", correct: true}
      - {text: "`@Component` et `@RequestMapping`", correct: false}
      - {text: "`@Service` et `@ResponseBody`", correct: false}
      - {text: "`@Controller` et `@RequestBody`", correct: false}
    answer: "`@Controller` en fait un bean détecté par le scan des composants ; `@ResponseBody` écrit la valeur renvoyée dans le corps de la réponse. `@RequestBody`, lui, sert à lire le corps de la requête."
  - key: prefixe-de-classe
    format: course
    question: "À quoi sert `@RequestMapping(\"/api/produits\")` posé sur la classe d'un contrôleur ?"
    choices:
      - {text: "À préfixer le chemin de toutes ses méthodes", correct: true}
      - {text: "À n'accepter que des requêtes GET sur ce chemin", correct: false}
      - {text: "À déclarer l'unique point d'entrée de la classe", correct: false}
      - {text: "À rediriger toutes les requêtes vers ce chemin", correct: false}
    answer: "Le chemin de la classe s'ajoute devant celui de chaque méthode : `@GetMapping(\"/{id}\")` sert alors `/api/produits/{id}`."
  - key: statut-par-defaut
    format: course
    question: "Quel statut renvoie une méthode `@GetMapping` qui se termine normalement, sans `@ResponseStatus` ?"
    choices:
      - {text: "200 OK", correct: true}
      - {text: "201 Created", correct: false}
      - {text: "204 No Content", correct: false}
      - {text: "202 Accepted", correct: false}
    answer: "200 est le statut par défaut, même pour une méthode `void` (le corps est alors vide). Pour un autre statut : `@ResponseStatus` ou `ResponseEntity`."
  - key: conversion-en-json
    format: course
    question: "Qui transforme en JSON l'objet renvoyé par une méthode de `@RestController` ?"
    choices:
      - {text: "Un convertisseur de messages HTTP, qui s'appuie sur Jackson", correct: true}
      - {text: "Le contrôleur, qui doit appeler `toString()` sur l'objet", correct: false}
      - {text: "Tomcat, qui sérialise lui-même tous les objets Java", correct: false}
      - {text: "La sérialisation Java, activée par `Serializable`", correct: false}
    answer: "Un `HttpMessageConverter` choisi d'après le type de contenu demandé écrit l'objet ; pour le JSON, c'est celui de Jackson. Le contrôleur n'a rien à convertir lui-même."
  - key: vf-post-sur-get
    format: true-false
    question: "Un `POST` sur un chemin qui n'a qu'une méthode `@GetMapping` reçoit 405 Method Not Allowed."
    truth: true
    answer: "Le chemin existe, mais pas pour ce verbe : Spring répond 405, avec l'en-tête `Allow: GET` qui dit ce qui est permis."
  - key: vf-controller-et-chaine
    format: true-false
    question: "Dans une classe `@Controller` (sans `@ResponseBody`), une méthode qui renvoie la chaîne `\"bonjour\"` écrit `bonjour` dans le corps de la réponse."
    truth: false
    answer: "Sans `@ResponseBody`, la chaîne est un nom de vue : Spring cherche une page `bonjour` à afficher. Pour écrire le texte, il faut `@RestController` ou `@ResponseBody`."
  - key: vf-paquet-hors-scan
    format: true-false
    question: "Un contrôleur placé hors du paquet de la classe `@SpringBootApplication` et de ses sous-paquets n'est pas détecté par défaut."
    truth: true
    answer: "`@SpringBootApplication` scanne son propre paquet et ses sous-paquets. Un contrôleur ailleurs n'est pas un bean, et ses chemins répondent 404."
  - key: vf-methode-void
    format: true-false
    question: "Une méthode de `@RestController` de type `void` répond 200 avec un corps vide."
    truth: true
    answer: "Rien à écrire : le corps reste vide, et le statut par défaut est 200. On ajoute `@ResponseStatus(HttpStatus.NO_CONTENT)` pour répondre 204."
  - key: qcm-annotation-delete
    format: multiple-choice
    question: "Quelle annotation associe une méthode aux seules requêtes `DELETE /produits/{id}` ?"
    choices:
      - {text: "`@DeleteMapping(\"/produits/{id}\")`", correct: true}
      - {text: "`@RequestMapping(\"/produits/{id}\")`", correct: false}
      - {text: "`@RemoveMapping(\"/produits/{id}\")`", correct: false}
      - {text: "`@PostMapping(\"/produits/{id}/delete\")`", correct: false}
    answer: "`@DeleteMapping` limite la méthode au verbe DELETE. `@RequestMapping` sans `method` accepterait tous les verbes ; `@RemoveMapping` n'existe pas."
  - key: qcm-chemin-complet
    format: multiple-choice
    question: "La classe porte `@RequestMapping(\"/api/commandes\")` et la méthode `@GetMapping(\"/{id}/lignes\")`. Quel chemin la méthode sert-elle ?"
    choices:
      - {text: "`/api/commandes/{id}/lignes`", correct: true}
      - {text: "`/{id}/lignes`", correct: false}
      - {text: "`/api/commandes`", correct: false}
      - {text: "`/api/commandes/lignes/{id}`", correct: false}
    answer: "Le chemin de la méthode s'ajoute à celui de la classe, dans l'ordre : `/api/commandes` puis `/{id}/lignes`."
  - key: qcm-chemin-inconnu
    format: multiple-choice
    question: "Que répond Spring Boot 4 à un `GET /inexistant` quand aucun contrôleur ne sert ce chemin ?"
    choices:
      - {text: "404 Not Found", correct: true}
      - {text: "405 Method Not Allowed", correct: false}
      - {text: "400 Bad Request", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "Aucun contrôleur ni aucune ressource statique ne correspond : Spring lève `NoResourceFoundException`, traduite en 404."
  - key: qcm-deux-methodes-meme-chemin
    format: multiple-choice
    question: "Deux méthodes du même contrôleur portent `@GetMapping(\"/produits\")`. Que se passe-t-il ?"
    choices:
      - {text: "L'application refuse de démarrer : « Ambiguous mapping »", correct: true}
      - {text: "La première méthode déclarée l'emporte, sans message", correct: false}
      - {text: "Spring appelle les deux, et fusionne leurs réponses", correct: false}
      - {text: "Chaque requête choisit l'une des deux au hasard", correct: false}
    answer: "Spring refuse deux méthodes pour le même verbe et le même chemin : le démarrage échoue avec « Ambiguous mapping. Cannot map ... There is already ... bean method »."
  - key: trous-restcontroller
    format: fill-in
    question: |-
      Complète pour que la classe soit un contrôleur dont les valeurs renvoyées partent en JSON :
      ```java
      @___
      @RequestMapping("/api/produits")
      public class ProduitController {
      ```
    blanks:
      - [RestController]
    answer: "`@RestController` réunit `@Controller` et `@ResponseBody`."
  - key: trous-getmapping
    format: fill-in
    question: |-
      Complète pour servir les requêtes `GET /api/produits/42` :
      ```java
      @___("/{id}")
      public Produit unProduit(@PathVariable long id) {
          return produits.trouver(id);
      }
      ```
    blanks:
      - [GetMapping]
    answer: "`@GetMapping` associe la méthode au verbe GET ; le chemin s'ajoute au préfixe de la classe."
  - key: trous-statut-creation
    format: fill-in
    question: |-
      Complète pour qu'une création réponde 201 :
      ```java
      @PostMapping
      @ResponseStatus(HttpStatus.___)
      public Produit creer(@RequestBody Produit produit) {
      ```
    blanks:
      - [CREATED]
    answer: "`HttpStatus.CREATED` vaut 201. Sans `@ResponseStatus`, la méthode répondrait 200."
  - key: trous-prefixe-classe
    format: fill-in
    question: |-
      Complète pour que toutes les méthodes de la classe soient servies sous `/api/clients` :
      ```java
      @RestController
      @___("/api/clients")
      public class ClientController {
      ```
    blanks:
      - [RequestMapping]
    answer: "`@RequestMapping` sur la classe donne le préfixe commun à toutes ses méthodes."
  - key: bug-controller-sans-responsebody
    format: bug-fix
    question: |-
      `GET /salut` devrait renvoyer le texte `bonjour`. Il répond 404, et l'erreur dit « No static resource bonjour. ».
      Quelle correction est la bonne ?
      ```java
      @Controller
      public class SalutController {

          @GetMapping("/salut")
          public String salut() {
              return "bonjour";
          }
      }
      ```
    choices:
      - {text: "Remplacer `@Controller` par `@RestController`", correct: true}
      - {text: "Remplacer `@GetMapping` par `@RequestMapping`", correct: false}
      - {text: "Renvoyer `\"bonjour\".toString()` à la place", correct: false}
      - {text: "Ajouter `@ResponseStatus(HttpStatus.OK)` sur la méthode", correct: false}
    answer: |-
      ```java
      @RestController
      public class SalutController {
      ```
      Avec `@Controller` seul, la chaîne renvoyée est un nom de vue : Spring cherche une ressource `bonjour` à
      afficher, ne la trouve pas, et répond 404. `@RestController` ajoute `@ResponseBody` : la chaîne devient le corps.
  - key: bug-chemin-ambigu
    format: bug-fix
    question: |-
      L'application refuse de démarrer : « Ambiguous mapping. Cannot map 'produitController' method ... to {GET
      [/produits]}: There is already 'produitController' bean method ... ». Quelle correction est la bonne ?
      ```java
      @RestController
      public class ProduitController {

          @GetMapping("/produits")
          public List<Produit> tous() { ... }

          @GetMapping("/produits")
          public List<Produit> actifs() { ... }
      }
      ```
    choices:
      - {text: "Donner à `actifs` un chemin distinct, comme `/produits/actifs`", correct: true}
      - {text: "Annoter la méthode `actifs` avec `@Primary` pour la préférer", correct: false}
      - {text: "Déclarer la méthode `actifs` en `private` pour la masquer", correct: false}
      - {text: "Annoter la méthode `tous` avec `@Order(1)` pour la prioriser", correct: false}
    answer: |-
      ```java
      @GetMapping("/produits/actifs")
      public List<Produit> actifs() { ... }
      ```
      Un verbe et un chemin désignent une seule méthode. Pour distinguer deux méthodes sur le même chemin, il faut un
      critère de plus : un autre chemin, ou un paramètre (`@GetMapping(path = "/produits", params = "actifs")`).
  - key: bug-paquet-hors-scan
    format: bug-fix
    question: |-
      L'application démarre, mais `GET /api/produits` répond 404. Quelle correction est la bonne ?
      ```java
      package fr.boutique;

      @SpringBootApplication
      public class BoutiqueApplication { ... }
      ```
      ```java
      package fr.api;

      @RestController
      @RequestMapping("/api/produits")
      public class ProduitController { ... }
      ```
    choices:
      - {text: "Déplacer le contrôleur dans un sous-paquet de `fr.boutique`", correct: true}
      - {text: "Rendre les méthodes du contrôleur `public static`", correct: false}
      - {text: "Ajouter `@ResponseBody` sur chaque méthode du contrôleur", correct: false}
      - {text: "Renommer la classe en `ProduitRestController`", correct: false}
    answer: |-
      ```java
      package fr.boutique.api;
      ```
      `@SpringBootApplication` scanne `fr.boutique` et ses sous-paquets. `fr.api` est à côté, pas dessous : le
      contrôleur n'est jamais créé, et aucun chemin `/api/produits` n'existe.
  - key: bug-verbe-de-creation
    format: bug-fix
    question: |-
      Le front envoie `POST /api/produits` pour créer un produit, et reçoit 405 Method Not Allowed. Quelle correction
      est la bonne ?
      ```java
      @RestController
      @RequestMapping("/api/produits")
      public class ProduitController {

          @GetMapping
          public Produit creer(@RequestBody Produit produit) {
              return produits.creer(produit);
          }
      }
      ```
    choices:
      - {text: "Remplacer `@GetMapping` par `@PostMapping` sur `creer`", correct: true}
      - {text: "Ajouter `consumes = \"application/json\"` au `@GetMapping`", correct: false}
      - {text: "Remplacer `@RequestBody` par `@RequestParam` sur `produit`", correct: false}
      - {text: "Ajouter `@ResponseStatus(HttpStatus.CREATED)` sur `creer`", correct: false}
    answer: |-
      ```java
      @PostMapping
      public Produit creer(@RequestBody Produit produit) {
      ```
      Le chemin n'existe que pour GET : un POST reçoit 405, avec `Allow: GET`. Une création est un POST.
