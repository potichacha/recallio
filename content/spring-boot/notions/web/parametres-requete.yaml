notion: parametres-requete
lesson: |-
  Une méthode de contrôleur lit les données de la requête par ses **paramètres annotés**. Spring les extrait, les
  convertit dans le type déclaré, et répond lui-même 400 quand c'est impossible.

  ```java
  // GET /api/magasins/12/produits?page=2&tri=prix   avec l'en-tête X-Request-Id: abc
  @GetMapping("/api/magasins/{magasinId}/produits")
  public List<Produit> produits(@PathVariable long magasinId,
                                @RequestParam(defaultValue = "0") int page,
                                @RequestParam(required = false) String tri,
                                @RequestHeader("X-Request-Id") String requestId) {
      ...
  }
  ```

  | Annotation | Lit | Absent, par défaut |
  |---|---|---|
  | `@PathVariable` | un segment du chemin, `{magasinId}` | 500 : le chemin et la méthode ne concordent pas |
  | `@RequestParam` | un paramètre de requête, après le `?` | 400 « Required parameter 'q' is not present. » |
  | `@RequestHeader` | un en-tête HTTP | 400 « Required header 'X-Request-Id' is not present. » |

  **Le nom.** Sans nom explicite, Spring prend le nom du paramètre Java. Il ne le connaît que si le compilateur l'a
  gardé, avec l'option `-parameters` : les plugins Maven et Gradle de Spring Boot l'activent. Sinon, on le donne :
  `@PathVariable("id") long produitId`.

  **Obligatoire ou facultatif.** `@RequestParam` et `@RequestHeader` sont obligatoires par défaut.

  - `defaultValue = "0"` rend le paramètre facultatif et fournit la valeur manquante.
  - `required = false` donne `null` quand il manque : il faut alors un type qui l'accepte (`Integer`, `String`), ou
    `Optional<String>`. Un `int` avec `required = false` et sans valeur fait échouer la requête en 500 : « Optional int
    parameter 'page' is present but cannot be translated into a null value due to being declared as a primitive type ».

  **La conversion.** Spring convertit le texte reçu : `"42"` en `long`, `"true"` en `boolean`, `"2025-03-14"` en
  `LocalDate` avec `@DateTimeFormat(iso = ISO.DATE)`, une liste depuis `?tags=java&tags=spring` comme depuis
  `?tags=java,spring`. Une valeur impossible à convertir (`/produits/abc` pour un `long`) répond **400**
  (`MethodArgumentTypeMismatchException`).

  **Une contrainte dans le chemin.** `@GetMapping("/produits/{id:\\d+}")` ne retient que les identifiants numériques :
  `/produits/abc` ne correspond plus à cette méthode.

  **Lequel choisir ?** Le chemin désigne **la ressource** (`/clients/42`) ; les paramètres de requête l'affinent
  (filtre, tri, pagination) ; les en-têtes portent le contexte technique (corrélation, langue, version).

  **En entretien** : « `@PathVariable` lit un segment du chemin, qui identifie la ressource ; `@RequestParam` un
  paramètre après le `?`, pour filtrer ou paginer ; `@RequestHeader` un en-tête. Les deux derniers sont obligatoires
  par défaut, et leur absence répond 400 ; `defaultValue` ou `required = false` les rendent facultatifs. »
cards:
  - key: source-pathvariable
    format: course
    question: "D'où `@PathVariable` tire-t-il sa valeur ?"
    choices:
      - {text: "D'un segment du chemin de l'URL, comme `{id}`", correct: true}
      - {text: "D'un paramètre placé après le `?` de l'URL", correct: false}
      - {text: "D'un champ du corps JSON de la requête", correct: false}
      - {text: "D'un en-tête HTTP de la requête reçue", correct: false}
    answer: "`@PathVariable` lit la partie variable du chemin déclaré, `/produits/{id}`. Le paramètre après le `?` se lit avec `@RequestParam`, un en-tête avec `@RequestHeader`."
  - key: requestparam-manquant
    format: course
    question: "Que répond Spring MVC quand un paramètre `@RequestParam String q`, sans autre option, manque dans la requête ?"
    choices:
      - {text: "400 Bad Request", correct: true}
      - {text: "200, avec `q` à `null`", correct: false}
      - {text: "404 Not Found", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "Un `@RequestParam` est obligatoire par défaut : Spring lève `MissingServletRequestParameterException`, traduite en 400 (« Required parameter 'q' is not present. »)."
  - key: role-defaultvalue
    format: course
    question: "Que fait `@RequestParam(defaultValue = \"0\") int page` quand la requête n'a pas de paramètre `page` ?"
    choices:
      - {text: "Il rend le paramètre facultatif, et `page` vaut 0", correct: true}
      - {text: "Il répond 400 : le paramètre reste obligatoire", correct: false}
      - {text: "Il fait échouer le démarrage de l'application", correct: false}
      - {text: "Il laisse `page` à `null`, que la méthode doit tester", correct: false}
    answer: "`defaultValue` rend le paramètre facultatif et fournit la valeur, convertie dans le type déclaré. Un `int` ne peut de toute façon pas valoir `null`."
  - key: lire-un-entete
    format: course
    question: "Comment lis-tu l'en-tête `X-Request-Id` dans une méthode de contrôleur ?"
    choices:
      - {text: "`@RequestHeader(\"X-Request-Id\") String id`", correct: true}
      - {text: "`@RequestParam(\"X-Request-Id\") String id`", correct: false}
      - {text: "`@PathVariable(\"X-Request-Id\") String id`", correct: false}
      - {text: "`@Header(\"X-Request-Id\") String id`", correct: false}
    answer: "`@RequestHeader` lit un en-tête HTTP ; il est obligatoire par défaut. `@Header` existe dans Spring, mais pour les messages (Spring Messaging), pas pour les contrôleurs MVC."
  - key: vf-conversion-impossible
    format: true-false
    question: "`GET /produits/abc`, vers une méthode `@GetMapping(\"/produits/{id}\")` qui attend `@PathVariable Long id`, répond 400 Bad Request."
    truth: true
    answer: "`abc` ne se convertit pas en `Long` : Spring lève `MethodArgumentTypeMismatchException`, traduite en 400. La méthode n'est pas appelée."
  - key: vf-requestparam-facultatif
    format: true-false
    question: "Un `@RequestParam` est facultatif tant qu'on n'écrit pas `required = true`."
    truth: false
    answer: "C'est l'inverse : `required` vaut `true` par défaut. On le rend facultatif avec `required = false` ou `defaultValue`."
  - key: vf-liste-separee-par-virgules
    format: true-false
    question: "`@RequestParam List<String> tags` reçoit deux éléments pour `?tags=java,spring` comme pour `?tags=java&tags=spring`."
    truth: true
    answer: "Spring accepte les deux formes : le paramètre répété, ou une seule valeur séparée par des virgules."
  - key: vf-nom-du-parametre-java
    format: true-false
    question: "Sans nom explicite, `@PathVariable Long id` se lie à `{id}` grâce au nom du paramètre Java, que le compilateur garde avec l'option `-parameters`."
    truth: true
    answer: "Depuis Spring Framework 6.1, Spring ne lit plus les noms dans les informations de débogage : il faut `-parameters`, que les plugins Maven et Gradle de Spring Boot activent, ou un nom explicite."
  - key: qcm-page-facultative
    format: multiple-choice
    question: "Quelle déclaration rend le paramètre `page` facultatif, avec 1 pour valeur par défaut ?"
    choices:
      - {text: "`@RequestParam(defaultValue = \"1\") int page`", correct: true}
      - {text: "`@RequestParam(required = true) int page`", correct: false}
      - {text: "`@RequestParam int page`, initialisé à 1 dans la méthode", correct: false}
      - {text: "`@PathVariable(defaultValue = \"1\") int page`", correct: false}
    answer: "`defaultValue` s'écrit en texte et se convertit dans le type déclaré. `@PathVariable` n'a pas d'attribut `defaultValue`."
  - key: qcm-int-absent-et-facultatif
    format: multiple-choice
    question: "`@RequestParam(required = false) int page` reçoit une requête sans `page`. Que se passe-t-il ?"
    choices:
      - {text: "Une erreur 500 : un `int` ne peut pas valoir `null`", correct: true}
      - {text: "`page` vaut 0, la valeur par défaut d'un `int`", correct: false}
      - {text: "Une erreur 400 : le paramètre est obligatoire", correct: false}
      - {text: "`page` vaut -1, pour signaler son absence", correct: false}
    answer: "Spring voudrait passer `null` et ne le peut pas : `IllegalStateException` (« Optional int parameter 'page' is present but cannot be translated into a null value ... »), donc 500. On écrit `Integer page`, ou `defaultValue = \"0\"`."
  - key: qcm-entete-absent
    format: multiple-choice
    question: "Une méthode attend `@RequestHeader(\"X-Tenant\") String tenant`, et la requête n'a pas cet en-tête. Quel statut reçoit le client ?"
    choices:
      - {text: "400 Bad Request", correct: true}
      - {text: "401 Unauthorized", correct: false}
      - {text: "404 Not Found", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "`MissingRequestHeaderException` (« Required header 'X-Tenant' is not present. ») se traduit en 400 : c'est la requête du client qui est incomplète."
  - key: qcm-valeur-nulle-si-absent
    format: multiple-choice
    question: "Quelle déclaration donne `null` quand le paramètre de requête `tri` est absent ?"
    choices:
      - {text: "`@RequestParam(required = false) String tri`", correct: true}
      - {text: "`@RequestParam String tri`", correct: false}
      - {text: "`@RequestParam(defaultValue = \"\") String tri`", correct: false}
      - {text: "`@RequestParam Optional<String> tri`", correct: false}
    answer: "`required = false` passe `null`. Sans option, l'absence répond 400 ; `defaultValue = \"\"` donne une chaîne vide ; `Optional<String>` donne `Optional.empty()`."
  - key: trous-pathvariable
    format: fill-in
    question: |-
      Complète pour lire l'identifiant dans le chemin :
      ```java
      @GetMapping("/clients/{id}")
      public Client unClient(@___ long id) {
      ```
    blanks:
      - [PathVariable]
    answer: "`@PathVariable` lit le segment `{id}` ; le nom du paramètre Java fait le lien."
  - key: trous-requestparam
    format: fill-in
    question: |-
      Complète pour lire `?ville=Lyon` :
      ```java
      @GetMapping("/agences")
      public List<Agence> parVille(@___ String ville) {
      ```
    blanks:
      - [RequestParam]
    answer: "`@RequestParam` lit un paramètre de requête ; il est obligatoire par défaut."
  - key: trous-defaultvalue
    format: fill-in
    question: |-
      Complète pour que `taille` vaille 20 quand le client ne la précise pas :
      ```java
      @GetMapping("/produits")
      public List<Produit> page(@RequestParam(___ = "20") int taille) {
      ```
    blanks:
      - [defaultValue]
    answer: "`defaultValue` rend le paramètre facultatif et fournit la valeur manquante."
  - key: trous-requestheader
    format: fill-in
    question: |-
      Complète pour lire l'en-tête `X-Session` :
      ```java
      @GetMapping("/panier")
      public Panier panier(@___("X-Session") String session) {
      ```
    blanks:
      - [RequestHeader]
    answer: "`@RequestHeader` lit un en-tête de la requête, obligatoire par défaut."
  - key: bug-nom-variable-de-chemin
    format: bug-fix
    question: |-
      `GET /produits/42` répond 500 : « Required path variable 'produitId' is not present. ». Quelle correction est la
      bonne ?
      ```java
      @GetMapping("/produits/{id}")
      public Produit unProduit(@PathVariable Long produitId) {
          return produits.trouver(produitId);
      }
      ```
    choices:
      - {text: "Écrire `@PathVariable(\"id\") Long produitId`", correct: true}
      - {text: "Écrire `@RequestParam Long produitId`", correct: false}
      - {text: "Écrire `@PathVariable(required = false) Long produitId`", correct: false}
      - {text: "Remplacer `Long` par `long` dans la signature", correct: false}
    answer: |-
      ```java
      public Produit unProduit(@PathVariable("id") Long produitId) {
      ```
      Spring cherche une variable `{produitId}` dans le chemin, qui n'a que `{id}` : c'est une erreur du serveur
      (`MissingPathVariableException`), d'où le 500. Nommer la variable, ou renommer le paramètre en `id`, rétablit
      le lien.
  - key: bug-int-facultatif
    format: bug-fix
    question: |-
      `GET /produits`, sans paramètre, répond 500 : « Optional int parameter 'page' is present but cannot be
      translated into a null value due to being declared as a primitive type. ». La première page doit s'afficher.
      Quelle correction est la bonne ?
      ```java
      @GetMapping("/produits")
      public List<Produit> page(@RequestParam(required = false) int page) {
      ```
    choices:
      - {text: "Écrire `@RequestParam(defaultValue = \"0\") int page`", correct: true}
      - {text: "Écrire `@RequestParam(required = true) int page`", correct: false}
      - {text: "Écrire `@PathVariable(required = false) int page`", correct: false}
      - {text: "Écrire `@RequestParam(required = false) final int page`", correct: false}
    answer: |-
      ```java
      public List<Produit> page(@RequestParam(defaultValue = "0") int page) {
      ```
      `required = false` passe `null` quand le paramètre manque, ce qu'un `int` ne peut pas recevoir. `defaultValue`
      fournit une valeur ; `Integer page` conviendrait aussi, avec un test de `null`.
  - key: bug-requestparam-pour-le-chemin
    format: bug-fix
    question: |-
      `GET /commandes/A42` répond 400 : « Required parameter 'numero' is not present. ». Quelle correction est la
      bonne ?
      ```java
      @GetMapping("/commandes/{numero}")
      public Commande commande(@RequestParam String numero) {
      ```
    choices:
      - {text: "Remplacer `@RequestParam` par `@PathVariable`", correct: true}
      - {text: "Ajouter `required = false` au `@RequestParam`", correct: false}
      - {text: "Remplacer `@RequestParam` par `@RequestBody`", correct: false}
      - {text: "Écrire le chemin `/commandes?numero={numero}`", correct: false}
    answer: |-
      ```java
      public Commande commande(@PathVariable String numero) {
      ```
      `A42` est dans le chemin, pas après un `?` : `@RequestParam` ne le trouve pas. `required = false` ferait
      disparaître l'erreur, mais `numero` vaudrait `null`.
  - key: bug-entete-facultatif
    format: bug-fix
    question: |-
      Certains clients n'envoient pas `X-Correlation-Id` et reçoivent 400 : « Required header 'X-Correlation-Id' is
      not present. ». Le serveur doit alors en générer un. Quelle correction est la bonne ?
      ```java
      @GetMapping("/commandes")
      public List<Commande> commandes(@RequestHeader("X-Correlation-Id") String correlation) {
          String id = correlation != null ? correlation : UUID.randomUUID().toString();
          ...
      }
      ```
    choices:
      - {text: "Écrire `@RequestHeader(value = \"X-Correlation-Id\", required = false)`", correct: true}
      - {text: "Écrire `@RequestParam(\"X-Correlation-Id\")` à la place", correct: false}
      - {text: "Écrire le nom de l'en-tête en minuscules, `x-correlation-id`", correct: false}
      - {text: "Déclarer le paramètre en `Object` plutôt qu'en `String`", correct: false}
    answer: |-
      ```java
      @RequestHeader(value = "X-Correlation-Id", required = false) String correlation
      ```
      L'en-tête est obligatoire par défaut. Avec `required = false`, il vaut `null` quand il manque, et le test de la
      méthode s'applique. La casse des en-têtes ne compte pas en HTTP.
