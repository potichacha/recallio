notion: documentation-openapi
lesson: |-
  **OpenAPI** (anciennement Swagger) est une spécification qui décrit une API REST en JSON ou en YAML : ses chemins,
  ses verbes, ses paramètres, ses corps, ses réponses et ses schémas. À partir de ce fichier, des outils affichent une
  documentation interactive (**Swagger UI**), génèrent des clients (TypeScript, Java...) ou vérifient qu'un changement
  ne casse rien.

  **Deux approches.**

  - **Code-first** : on écrit les contrôleurs, et la spécification est générée à partir du code annoté.
  - **Contract-first** : on écrit d'abord la spécification, discutée entre les équipes, puis on génère les interfaces des
    contrôleurs (`openapi-generator`).

  **springdoc-openapi** fait le code-first avec Spring MVC. Une dépendance suffit :
  `org.springdoc:springdoc-openapi-starter-webmvc-ui` (la ligne 3.x de springdoc vise Spring Boot 4). Au démarrage, il
  lit les contrôleurs, les DTO et leurs contraintes Bean Validation, et publie :

  | Adresse | Contenu |
  |---|---|
  | `/v3/api-docs` | la spécification en JSON |
  | `/v3/api-docs.yaml` | la même, en YAML |
  | `/swagger-ui.html` | Swagger UI, pour lire et essayer l'API |

  Sans annotation, chaque méthode de contrôleur apparaît déjà. Les annotations de `io.swagger.v3.oas.annotations`
  l'enrichissent :

  ```java
  @Tag(name = "Produits")
  @RestController
  @RequestMapping("/api/produits")
  public class ProduitController {

      @Operation(summary = "Lit un produit")
      @ApiResponse(responseCode = "200", description = "Le produit")
      @ApiResponse(responseCode = "404", description = "Produit introuvable")
      @GetMapping("/{id}")
      public Produit unProduit(@Parameter(description = "Identifiant du produit") @PathVariable long id) { ... }
  }

  public record Produit(
          @Schema(description = "Nom affiché", example = "Stylo bleu") @NotBlank String nom,
          @Schema(example = "250") @Positive int prixEnCentimes) {}
  ```

  `@NotBlank`, `@Size` ou `@Positive` passent dans le schéma (champ requis, longueurs, minimum).

  **Réglages utiles.** `springdoc.api-docs.path` et `springdoc.swagger-ui.path` changent les adresses ;
  `springdoc.swagger-ui.enabled=false` et `springdoc.api-docs.enabled=false` les coupent, en production par exemple, à
  moins de les protéger par une authentification.

  **La spécification comme contrat.** Exportée et versionnée dans le dépôt, elle montre chaque changement d'API dans le
  diff d'une pull request, et la CI vérifie qu'elle est à jour. Le front génère son client à partir d'elle, au lieu de
  l'écrire à la main.

  **En entretien** : « OpenAPI décrit l'API dans un fichier standard. Avec springdoc, je la génère depuis mes
  contrôleurs, sur `/v3/api-docs`, avec Swagger UI pour l'essayer ; `@Operation`, `@ApiResponse` et `@Schema`
  complètent ce que le code ne dit pas, les erreurs surtout. Je versionne la spécification et j'en génère les clients. »
cards:
  - key: definition-openapi
    format: course
    question: "Qu'est-ce qu'OpenAPI ?"
    choices:
      - {text: "Une spécification qui décrit une API REST en JSON ou en YAML", correct: true}
      - {text: "Une bibliothèque Java qui génère des contrôleurs REST", correct: false}
      - {text: "Un serveur web qui héberge la documentation des API", correct: false}
      - {text: "Un protocole d'authentification pour les API publiques", correct: false}
    answer: "OpenAPI est un format de description, indépendant du langage. Swagger UI l'affiche, des générateurs en tirent du code, springdoc le produit depuis Spring."
  - key: adresse-de-la-spec
    format: course
    question: "Avec springdoc, à quelle adresse la spécification JSON générée se trouve-t-elle par défaut ?"
    choices:
      - {text: "`/v3/api-docs`", correct: true}
      - {text: "`/swagger.json`", correct: false}
      - {text: "`/openapi/spec`", correct: false}
      - {text: "`/actuator/openapi`", correct: false}
    answer: "`/v3/api-docs` (et `/v3/api-docs.yaml`) ; Swagger UI est sur `/swagger-ui.html`. `springdoc.api-docs.path` change l'adresse."
  - key: role-operation
    format: course
    question: "À quoi sert `@Operation(summary = \"Liste les produits\")` sur une méthode de contrôleur ?"
    choices:
      - {text: "À décrire l'opération dans la spécification générée", correct: true}
      - {text: "À exposer la méthode sur un nouveau chemin HTTP", correct: false}
      - {text: "À réserver la méthode aux administrateurs", correct: false}
      - {text: "À journaliser chaque appel de la méthode", correct: false}
    answer: "Les annotations OpenAPI ne changent pas le comportement : elles complètent la description, avec un résumé, une description ou des réponses possibles."
  - key: sens-code-first
    format: course
    question: "Que signifie documenter une API en « code-first » ?"
    choices:
      - {text: "La spécification est générée à partir des contrôleurs annotés", correct: true}
      - {text: "Les contrôleurs sont générés à partir d'une spécification écrite", correct: false}
      - {text: "La documentation est écrite à la main dans un wiki", correct: false}
      - {text: "Le code des clients est écrit avant celui du serveur", correct: false}
    answer: "Le code est la source, la spécification en découle : c'est ce que fait springdoc. L'inverse, partir de la spécification pour générer le code, est le contract-first."
  - key: vf-swagger-ui
    format: true-false
    question: "springdoc sert aussi une page Swagger UI, qui permet d'essayer les appels depuis le navigateur."
    truth: true
    answer: "Avec `springdoc-openapi-starter-webmvc-ui`, Swagger UI est sur `/swagger-ui.html` : on y lit l'API et l'on y envoie des requêtes réelles."
  - key: vf-contraintes-dans-le-schema
    format: true-false
    question: "springdoc reporte dans le schéma généré des contraintes Bean Validation comme `@NotBlank` ou `@Size`."
    truth: true
    answer: "Un `@NotBlank` rend le champ requis, `@Size(max = 280)` donne `maxLength` : la documentation suit les règles réelles sans les recopier."
  - key: vf-desactiver-ui
    format: true-false
    question: "La page Swagger UI se désactive par la propriété `springdoc.swagger-ui.enabled=false`."
    truth: true
    answer: "On la coupe souvent en production, avec `springdoc.api-docs.enabled=false` pour la spécification, ou on la protège par une authentification."
  - key: vf-sans-operation
    format: true-false
    question: "Une méthode de contrôleur sans annotation `@Operation` est absente de la spécification générée par springdoc."
    truth: false
    answer: "springdoc documente toutes les méthodes de contrôleur, à partir de leurs mappings et de leurs types. `@Operation` ne fait qu'ajouter des précisions."
  - key: qcm-schema-d-un-champ
    format: multiple-choice
    question: "Quelle annotation donne une description et un exemple à un champ d'un DTO, dans la spécification ?"
    choices:
      - {text: "`@Schema(description = \"...\", example = \"...\")`", correct: true}
      - {text: "`@Operation(description = \"...\", example = \"...\")`", correct: false}
      - {text: "`@Tag(description = \"...\", example = \"...\")`", correct: false}
      - {text: "`@ApiResponse(description = \"...\", example = \"...\")`", correct: false}
    answer: "`@Schema` décrit un type ou un champ ; `@Operation` une méthode ; `@Tag` un groupe d'opérations ; `@ApiResponse` une réponse possible."
  - key: qcm-documenter-un-404
    format: multiple-choice
    question: "Comment documentes-tu qu'une opération peut répondre 404 ?"
    choices:
      - {text: "`@ApiResponse(responseCode = \"404\", description = \"Produit introuvable\")`", correct: true}
      - {text: "`@ResponseStatus(HttpStatus.NOT_FOUND)` sur la méthode du contrôleur", correct: false}
      - {text: "`@Operation(status = 404)` sur la méthode du contrôleur", correct: false}
      - {text: "`@Tag(name = \"404\")` sur la classe du contrôleur", correct: false}
    answer: "`@ApiResponse` ajoute une réponse possible à la description. `@ResponseStatus` changerait le statut réel de toutes les réponses de la méthode."
  - key: qcm-dependance-springdoc
    format: multiple-choice
    question: "Quelle dépendance ajoute la spécification générée et Swagger UI à une application Spring MVC ?"
    choices:
      - {text: "`springdoc-openapi-starter-webmvc-ui`", correct: true}
      - {text: "`spring-boot-starter-openapi`", correct: false}
      - {text: "`springfox-swagger2`", correct: false}
      - {text: "`swagger-codegen-maven-plugin`", correct: false}
    answer: "springdoc est le projet maintenu ; springfox, son prédécesseur, est abandonné. Spring Boot n'a pas de starter OpenAPI à lui. `swagger-codegen` génère du code, il ne documente pas."
  - key: qcm-spec-dans-le-depot
    format: multiple-choice
    question: "Pourquoi versionner la spécification générée dans le dépôt, et la vérifier en CI ?"
    choices:
      - {text: "Pour voir chaque changement d'API dans le diff d'une pull request", correct: true}
      - {text: "Pour que springdoc démarre plus vite en production", correct: false}
      - {text: "Pour que Swagger UI fonctionne sans connexion internet", correct: false}
      - {text: "Pour que les tests unitaires des contrôleurs passent", correct: false}
    answer: "Un changement d'API apparaît alors noir sur blanc dans la revue : un champ renommé, une réponse retirée. La CI échoue si la spécification n'est pas à jour."
  - key: situation-client-ecrit-a-la-main
    format: scenario
    question: |-
      L'équipe front écrit à la main ses appels à ton API, et ils cassent à chaque évolution. Que proposes-tu ?
    choices:
      - {text: "Générer leur client TypeScript à partir de la spécification OpenAPI", correct: true}
      - {text: "Leur envoyer un courriel à chaque modification de l'API", correct: false}
      - {text: "Figer l'API, pour qu'elle ne change plus jamais", correct: false}
      - {text: "Leur donner accès au code source des contrôleurs", correct: false}
    answer: |-
      Un client généré suit la spécification : un champ renommé devient une erreur de compilation côté front, au lieu
      d'un bogue en production.
  - key: situation-swagger-ouvert
    format: scenario
    question: |-
      Un audit signale que `/swagger-ui.html` et `/v3/api-docs` sont ouverts à tous en production. Que fais-tu ?
    choices:
      - {text: "Les couper en production, ou les protéger par une authentification", correct: true}
      - {text: "Les renommer en `/docs`, pour qu'on ne les trouve pas", correct: false}
      - {text: "Rien : une documentation publique ne présente aucun risque", correct: false}
      - {text: "Retirer toutes les annotations `@Operation` du code", correct: false}
    answer: |-
      La spécification dresse la carte de l'API, points d'entrée internes compris. `springdoc.swagger-ui.enabled=false`
      et `springdoc.api-docs.enabled=false` la coupent ; si elle doit rester, elle passe derrière une authentification.
  - key: situation-contrat-d-abord
    format: scenario
    question: |-
      Trois équipes doivent se mettre d'accord sur une API avant qu'une ligne de code soit écrite. Quelle approche
      choisis-tu ?
    choices:
      - {text: "Le contract-first : écrire la spécification, puis générer le code", correct: true}
      - {text: "Le code-first : écrire les contrôleurs, puis générer la spécification", correct: false}
      - {text: "Aucune spécification : chaque équipe lit le code des autres", correct: false}
      - {text: "Un tableur partagé qui liste les points d'entrée", correct: false}
    answer: |-
      La spécification devient le contrat discuté et relu ; chaque équipe en génère ses interfaces ou son client, et
      travaille en parallèle.
  - key: situation-erreurs-non-documentees
    format: scenario
    question: |-
      La spécification ne dit rien des erreurs que renvoie ton API. Les clients découvrent les 409 en production. Que
      fais-tu ?
    choices:
      - {text: "Je documente chaque réponse d'erreur avec `@ApiResponse` et son schéma", correct: true}
      - {text: "Je remplace tous les 409 par des 500, plus simples à documenter", correct: false}
      - {text: "J'ajoute un `try`/`catch` autour du code de chaque contrôleur", correct: false}
      - {text: "Je retire les erreurs de l'API : tout répond 200", correct: false}
    answer: |-
      springdoc ne voit pas toujours les erreurs que lève le service : `@ApiResponse(responseCode = "409", ...)`, avec
      le schéma du corps d'erreur, les rend visibles. Le client sait alors à quoi s'attendre.
