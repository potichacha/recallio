notion: response-entity
lesson: |-
  Une méthode de contrôleur peut renvoyer directement l'objet à écrire (statut 200, ou celui de `@ResponseStatus`). Quand
  le statut ou les en-têtes **dépendent de ce qui s'est passé**, elle renvoie un `ResponseEntity<T>` : le statut, les
  en-têtes et le corps de la réponse, réunis.

  ```java
  @GetMapping("/{id}")
  public ResponseEntity<Produit> unProduit(@PathVariable long id) {
      return ResponseEntity.of(produits.findById(id));        // 200 avec le produit, ou 404
  }

  @PostMapping
  public ResponseEntity<Produit> creer(@RequestBody NouveauProduit nouveau) {
      Produit cree = produits.creer(nouveau);
      URI location = ServletUriComponentsBuilder.fromCurrentRequest()
              .path("/{id}")
              .buildAndExpand(cree.id())
              .toUri();
      return ResponseEntity.created(location).body(cree);     // 201 + Location: /api/produits/42
  }

  @DeleteMapping("/{id}")
  public ResponseEntity<Void> supprimer(@PathVariable long id) {
      produits.supprimer(id);
      return ResponseEntity.noContent().build();              // 204, sans corps
  }
  ```

  **Les fabriques.**

  | Écriture | Statut |
  |---|---|
  | `ResponseEntity.ok(corps)` | 200 |
  | `ResponseEntity.created(uri).body(corps)` | 201, avec l'en-tête `Location` |
  | `ResponseEntity.accepted().body(suivi)` | 202 |
  | `ResponseEntity.noContent().build()` | 204 |
  | `ResponseEntity.of(optional)` | 200 avec la valeur, ou 404 si l'`Optional` est vide |
  | `ResponseEntity.notFound().build()` | 404 |
  | `ResponseEntity.status(HttpStatus.CONFLICT).body(erreur)` | n'importe quel statut |

  **Les en-têtes.** Le constructeur pas à pas les ajoute avant le corps :
  `ResponseEntity.ok().header("X-Total-Count", "1245").eTag("\"v3\"").body(page)`.

  **Deux pièges.**

  - `noContent()` et `notFound()` renvoient un constructeur **sans méthode `body`** : `notFound().body(...)` ne compile
    pas. Pour un 404 avec un corps : `ResponseEntity.status(HttpStatus.NOT_FOUND).body(erreur)`.
  - `ResponseEntity.ok(null)`, comme un `ResponseEntity` `null`, répond **200 avec un corps vide** : une ressource
    absente doit répondre 404, par exemple avec `ResponseEntity.of(optional)`.

  **Le bon statut.** 201 et `Location` pour une création ; 204 quand il n'y a rien à renvoyer ; 202 pour un traitement
  lancé en arrière-plan ; 404 pour une ressource absente. Un client s'appuie sur ces codes : 200 partout l'oblige à
  lire le corps pour comprendre.

  **En entretien** : « `ResponseEntity` porte le statut, les en-têtes et le corps. Je m'en sers quand ils dépendent du
  traitement : 201 avec `Location` après une création, 204 après une suppression, 404 avec `ResponseEntity.of` quand
  l'`Optional` est vide. Pour un statut fixe, `@ResponseStatus` suffit. »
cards:
  - key: contenu-responseentity
    format: course
    question: "Que porte un `ResponseEntity<T>` renvoyé par une méthode de contrôleur ?"
    choices:
      - {text: "Le statut, les en-têtes et le corps de la réponse", correct: true}
      - {text: "Seulement le corps, converti en JSON", correct: false}
      - {text: "Le corps et le type Java attendu par le client", correct: false}
      - {text: "La requête reçue et la réponse à envoyer", correct: false}
    answer: "`ResponseEntity` décrit toute la réponse HTTP. `T` est le type du corps ; `ResponseEntity<Void>` n'en a pas."
  - key: of-optional-vide
    format: course
    question: "Que renvoie `ResponseEntity.of(optional)` quand l'`Optional` est vide ?"
    choices:
      - {text: "Une réponse 404 Not Found, sans corps", correct: true}
      - {text: "Une réponse 200 avec un corps vide", correct: false}
      - {text: "Une réponse 204 No Content", correct: false}
      - {text: "Une `NoSuchElementException`, donc une 500", correct: false}
    answer: "`ResponseEntity.of` traduit l'`Optional` : 200 avec la valeur, ou 404. C'est la façon la plus courte de répondre à un `findById`."
  - key: entete-de-created
    format: course
    question: "Quel en-tête `ResponseEntity.created(uri)` ajoute-t-il à la réponse 201 ?"
    choices:
      - {text: "`Location`", correct: true}
      - {text: "`Content-Location`", correct: false}
      - {text: "`Link`", correct: false}
      - {text: "`Referer`", correct: false}
    answer: "`Location` donne l'adresse de la ressource créée : le client peut la lire ensuite avec un `GET`."
  - key: quand-responseentity
    format: course
    question: "Quand préférer `ResponseEntity` à `@ResponseStatus` ?"
    choices:
      - {text: "Quand le statut ou les en-têtes dépendent du traitement", correct: true}
      - {text: "Quand la méthode renvoie un objet à convertir en JSON", correct: false}
      - {text: "Quand la classe du contrôleur porte `@RestController`", correct: false}
      - {text: "Toujours : `@ResponseStatus` est déprécié depuis Spring 7", correct: false}
    answer: "`@ResponseStatus` fixe un statut connu d'avance, comme 201 pour toutes les créations. `ResponseEntity` choisit à l'exécution : 200 ou 404, avec ou sans en-tête."
  - key: vf-notfound-body
    format: true-false
    question: "`ResponseEntity.notFound().body(erreur)` compile : on peut joindre un corps à un 404 construit ainsi."
    truth: false
    answer: "`notFound()` renvoie un `HeadersBuilder`, qui n'a que `build()` : pas de corps. On écrit `ResponseEntity.status(HttpStatus.NOT_FOUND).body(erreur)`."
  - key: vf-nocontent-204
    format: true-false
    question: "`ResponseEntity.noContent().build()` produit une réponse 204 sans corps."
    truth: true
    answer: "204 No Content : la requête a réussi et il n'y a rien à renvoyer, comme après une suppression."
  - key: vf-responseentity-null
    format: true-false
    question: "Une méthode qui renvoie `ResponseEntity<Produit>` et retourne `null` produit une réponse 404."
    truth: false
    answer: "Spring répond 200 avec un corps vide. Pour un 404, il faut le dire : `ResponseEntity.notFound().build()` ou `ResponseEntity.of(optional)`."
  - key: vf-accepted
    format: true-false
    question: "`ResponseEntity.status(HttpStatus.ACCEPTED).body(suivi)` répond 202, avec `suivi` dans le corps."
    truth: true
    answer: "`status` accepte n'importe quel statut, puis `body` fournit le corps. `ResponseEntity.accepted().body(suivi)` écrit la même chose."
  - key: qcm-reponse-de-creation
    format: multiple-choice
    question: "Quelle ligne répond 201 avec l'adresse de la ressource créée et son contenu ?"
    choices:
      - {text: "`ResponseEntity.created(uri).body(produit)`", correct: true}
      - {text: "`ResponseEntity.status(201).body(uri)`", correct: false}
      - {text: "`ResponseEntity.accepted().body(produit)`", correct: false}
      - {text: "`ResponseEntity.ok(produit)`", correct: false}
    answer: "`created(uri)` fixe 201 et l'en-tête `Location`, `body` le contenu. `status(201).body(uri)` mettrait l'URI dans le corps, sans `Location`."
  - key: qcm-ajouter-entete
    format: multiple-choice
    question: "Comment ajoutes-tu l'en-tête `X-Total-Count` à une réponse 200 ?"
    choices:
      - {text: "`ResponseEntity.ok().header(\"X-Total-Count\", \"42\").body(page)`", correct: true}
      - {text: "`ResponseEntity.ok(page).header(\"X-Total-Count\", \"42\")`", correct: false}
      - {text: "`ResponseEntity.ok(page, \"X-Total-Count: 42\")`", correct: false}
      - {text: "`ResponseEntity.header(\"X-Total-Count\", \"42\").ok(page)`", correct: false}
    answer: "`ok()` sans argument renvoie un constructeur : on ajoute les en-têtes, puis le corps. `ok(page)` renvoie déjà un `ResponseEntity`, qui n'a plus de méthode `header`."
  - key: qcm-uri-de-la-requete
    format: multiple-choice
    question: "Quel outil construit l'URI `/api/produits/42` à partir de la requête `POST /api/produits` en cours ?"
    choices:
      - {text: "`ServletUriComponentsBuilder.fromCurrentRequest()`", correct: true}
      - {text: "`UriComponentsBuilder.newInstance()`", correct: false}
      - {text: "`RequestContextHolder.currentRequestAttributes()`", correct: false}
      - {text: "`URI.create(\"/42\")`", correct: false}
    answer: "`fromCurrentRequest()` part de l'URL reçue (schéma, hôte, chemin) ; on ajoute `.path(\"/{id}\").buildAndExpand(id).toUri()`. `newInstance()` part de rien."
  - key: qcm-apres-suppression
    format: multiple-choice
    question: "Quelle réponse convient après une suppression réussie, quand il n'y a rien à renvoyer ?"
    choices:
      - {text: "`ResponseEntity.noContent().build()`", correct: true}
      - {text: "`ResponseEntity.notFound().build()`", correct: false}
      - {text: "`ResponseEntity.accepted().build()`", correct: false}
      - {text: "`ResponseEntity.status(HttpStatus.CREATED).build()`", correct: false}
    answer: "204 No Content dit que l'opération a réussi sans corps. 202 annoncerait un traitement encore en cours ; 404, une ressource absente."
  - key: trous-of
    format: fill-in
    question: |-
      Complète pour répondre 200 avec le produit, ou 404 s'il n'existe pas :
      ```java
      @GetMapping("/{id}")
      public ResponseEntity<Produit> unProduit(@PathVariable long id) {
          return ResponseEntity.___(produits.findById(id));
      }
      ```
    blanks:
      - [of]
    answer: "`ResponseEntity.of(Optional)` répond 200 avec la valeur, ou 404."
  - key: trous-created
    format: fill-in
    question: |-
      Complète pour répondre 201 avec l'en-tête `Location` :
      ```java
      return ResponseEntity.___(location).body(cree);
      ```
    blanks:
      - [created]
    answer: "`created(uri)` fixe le statut 201 et l'en-tête `Location`."
  - key: trous-nocontent
    format: fill-in
    question: |-
      Complète pour répondre 204 :
      ```java
      return ResponseEntity.___().build();
      ```
    blanks:
      - [noContent]
    answer: "`noContent()` donne 204 ; `build()` termine la réponse, sans corps."
  - key: trous-fromcurrentrequest
    format: fill-in
    question: |-
      Complète pour construire l'adresse de la ressource créée à partir de la requête reçue :
      ```java
      URI location = ServletUriComponentsBuilder.___()
              .path("/{id}")
              .buildAndExpand(cree.id())
              .toUri();
      ```
    blanks:
      - [fromCurrentRequest]
    answer: "`fromCurrentRequest()` reprend l'URL de la requête en cours, à laquelle on ajoute l'identifiant."
  - key: bug-notfound-avec-corps
    format: bug-fix
    question: |-
      Le compilateur refuse cette ligne : la méthode `body` n'existe pas ici. La réponse doit être un 404 avec un corps
      d'erreur. Quelle correction est la bonne ?
      ```java
      return ResponseEntity.notFound().body(new Erreur("PRODUIT_INTROUVABLE"));
      ```
    choices:
      - {text: "`ResponseEntity.status(HttpStatus.NOT_FOUND).body(erreur)`", correct: true}
      - {text: "`ResponseEntity.notFound().build().body(erreur)`", correct: false}
      - {text: "`ResponseEntity.of(Optional.of(erreur))`", correct: false}
      - {text: "`ResponseEntity.badRequest().body(erreur)`", correct: false}
    answer: |-
      ```java
      return ResponseEntity.status(HttpStatus.NOT_FOUND).body(new Erreur("PRODUIT_INTROUVABLE"));
      ```
      `notFound()` renvoie un `HeadersBuilder`, sans `body`. `status(...)` renvoie un `BodyBuilder`, qui accepte un
      corps. `of(Optional.of(...))` répondrait 200 ; `badRequest()` répondrait 400.
  - key: bug-creation-en-200
    format: bug-fix
    question: |-
      Le front attend 201 et l'en-tête `Location` après une création. Il reçoit 200, sans `Location`. Quelle
      correction est la bonne ?
      ```java
      @PostMapping
      public ResponseEntity<Produit> creer(@RequestBody NouveauProduit nouveau) {
          Produit cree = produits.creer(nouveau);
          URI location = URI.create("/api/produits/" + cree.id());
          return ResponseEntity.ok(cree);
      }
      ```
    choices:
      - {text: "Renvoyer `ResponseEntity.created(location).body(cree)`", correct: true}
      - {text: "Renvoyer `ResponseEntity.ok(location)` à la place", correct: false}
      - {text: "Renvoyer `ResponseEntity.accepted().body(cree)`", correct: false}
      - {text: "Ajouter `@ResponseStatus(HttpStatus.OK)` sur la méthode", correct: false}
    answer: |-
      ```java
      return ResponseEntity.created(location).body(cree);
      ```
      `ok` fixe 200 et n'ajoute aucun en-tête : la variable `location` n'était jamais utilisée. `created` fixe 201 et
      l'en-tête `Location`.
  - key: bug-ok-null
    format: bug-fix
    question: |-
      `GET /api/produits/999`, pour un produit qui n'existe pas, répond 200 avec un corps vide. Le client attend un
      404. Quelle correction est la bonne ?
      ```java
      @GetMapping("/{id}")
      public ResponseEntity<Produit> unProduit(@PathVariable long id) {
          Produit produit = produits.findById(id).orElse(null);
          return ResponseEntity.ok(produit);
      }
      ```
    choices:
      - {text: "Renvoyer `ResponseEntity.of(produits.findById(id))`", correct: true}
      - {text: "Renvoyer `ResponseEntity.ofNullable(produits.findById(id))`", correct: false}
      - {text: "Ajouter `@ResponseStatus(HttpStatus.NOT_FOUND)` sur la méthode", correct: false}
      - {text: "Remplacer `orElse(null)` par `orElse(new Produit())`", correct: false}
    answer: |-
      ```java
      return ResponseEntity.of(produits.findById(id));
      ```
      `ok(null)` répond 200 sans corps. `of` répond 404 quand l'`Optional` est vide. `ofNullable` attend la valeur
      elle-même, pas un `Optional` : cette ligne ne compile pas (`ResponseEntity.ofNullable(produit)` conviendrait).
      `@ResponseStatus` changerait aussi les réponses réussies.
  - key: bug-responseentity-void-avec-corps
    format: bug-fix
    question: |-
      Le compilateur refuse le `return` : types incompatibles. La méthode doit renvoyer le produit créé. Quelle
      correction est la bonne ?
      ```java
      @PostMapping
      public ResponseEntity<Void> creer(@RequestBody NouveauProduit nouveau) {
          Produit cree = produits.creer(nouveau);
          return ResponseEntity.created(location(cree)).body(cree);
      }
      ```
    choices:
      - {text: "Déclarer le type de retour `ResponseEntity<Produit>`", correct: true}
      - {text: "Remplacer `body(cree)` par `body(null)` dans le `return`", correct: false}
      - {text: "Remplacer `created(...)` par `noContent()` dans le `return`", correct: false}
      - {text: "Ajouter un transtypage `(ResponseEntity<Void>)` au `return`", correct: false}
    answer: |-
      ```java
      public ResponseEntity<Produit> creer(@RequestBody NouveauProduit nouveau) {
      ```
      `ResponseEntity<Void>` annonce une réponse sans corps. `body(cree)` produit un `ResponseEntity<Produit>` : le
      type de retour doit le dire. `body(null)` compilerait, mais ne renverrait plus le produit.
  - key: situation-statut-de-creation
    format: scenario
    question: |-
      Ton API crée une commande avec `POST /api/commandes`. Un collègue répond 200 avec la commande. En revue, que
      proposes-tu ?
    choices:
      - {text: "Répondre 201, avec l'en-tête `Location` de la nouvelle commande", correct: true}
      - {text: "Répondre 204, puisque le client connaît déjà la commande", correct: false}
      - {text: "Répondre 302, pour rediriger vers la nouvelle commande", correct: false}
      - {text: "Garder 200 : le statut n'a pas d'importance pour un client", correct: false}
    answer: |-
      201 Created dit qu'une ressource est née, et `Location` où la trouver ; le corps peut la contenir aussi. Le
      client n'a pas à deviner l'identifiant attribué par le serveur.
  - key: situation-ressource-absente
    format: scenario
    question: |-
      `GET /api/clients/42` cherche un client qui n'existe pas. Le code répond 200 avec un corps vide. Que réponds-tu
      en revue ?
    choices:
      - {text: "Répondre 404, par exemple avec `ResponseEntity.of(optional)`", correct: true}
      - {text: "Répondre 204 : il n'y a pas de contenu à renvoyer", correct: false}
      - {text: "Répondre 400 : l'identifiant envoyé est mauvais", correct: false}
      - {text: "Répondre 500 : c'est une erreur du serveur", correct: false}
    answer: |-
      La ressource demandée n'existe pas : c'est 404. 204 signifierait une réussite sans contenu, et 400 une requête
      mal formée, ce qu'elle n'est pas.
  - key: situation-traitement-long
    format: scenario
    question: |-
      Une demande d'export lance un traitement de plusieurs minutes en arrière-plan. Que doit répondre
      `POST /api/exports` ?
    choices:
      - {text: "202 Accepted, avec l'adresse où suivre l'export", correct: true}
      - {text: "200 OK, une fois l'export entièrement terminé", correct: false}
      - {text: "201 Created, avec le fichier dans le corps", correct: false}
      - {text: "204 No Content, puisque rien n'est encore prêt", correct: false}
    answer: |-
      202 dit que la demande est acceptée mais pas terminée. On renvoie de quoi suivre le traitement (un en-tête
      `Location` vers `/api/exports/7`, par exemple), plutôt que de bloquer la requête plusieurs minutes.
  - key: situation-total-en-entete
    format: scenario
    question: |-
      Le front affiche « 1 245 résultats » au-dessus d'une liste paginée. Le corps de la réponse est déjà un tableau
      JSON. Où mets-tu le total ?
    choices:
      - {text: "Dans un en-tête, comme `X-Total-Count`, posé par `ResponseEntity`", correct: true}
      - {text: "Dans le statut HTTP, en renvoyant le nombre comme code", correct: false}
      - {text: "Dans un cookie, posé à chaque page de résultats", correct: false}
      - {text: "Nulle part : le front compte les éléments reçus", correct: false}
    answer: |-
      `ResponseEntity.ok().header("X-Total-Count", "1245").body(page)` garde le corps intact. L'autre option est un
      objet de page (`{"elements": [...], "total": 1245}`). Le front, lui, ne voit que la page courante.
