notion: stereotypes
lesson: |-
  Pour que Spring crée un bean à partir d'une de tes classes, il suffit de l'**annoter** : le **scan des composants**
  parcourt les packages, et enregistre chaque classe concrète annotée.

  | Annotation | Couche | Ce qu'elle ajoute |
  |---|---|---|
  | `@Component` | générique | rien : c'est la base des autres |
  | `@Service` | métier | rien de plus, elle dit l'intention |
  | `@Repository` | persistance | la traduction des exceptions techniques en `DataAccessException` |
  | `@Controller` | web (Spring MVC) | les méthodes renvoient le nom d'une **vue** |
  | `@RestController` | web (API) | `@Controller` + `@ResponseBody` : le retour est écrit dans la réponse (JSON) |
  | `@Configuration` | configuration | une classe qui déclare des beans par `@Bean` |

  Ce sont des **stéréotypes** : `@Service`, `@Repository`, `@Controller` et `@Configuration` sont elles-mêmes
  **méta-annotées `@Component`**. Pour le scan, elles se valent ; elles servent à dire le rôle de la classe, et
  certaines ajoutent un comportement.

  ```java
  @Service
  public class CalculPrix { ... }

  @Repository
  public class JdbcProduitDepot implements ProduitDepot { ... }   // exceptions JDBC → DataAccessException

  @RestController
  @RequestMapping("/produits")
  public class ProduitController {
      @GetMapping
      List<Produit> lister() { ... }   // écrit en JSON
  }
  ```

  **Le scan.** `@ComponentScan` (inclus dans `@SpringBootApplication`) parcourt le **package de la classe annotée et
  tous ses sous-packages**, jamais un package parent ou frère. D'où la règle : la classe principale va dans le
  package racine (`com.boutique`), le reste en dessous.

  ```java
  @Configuration
  @ComponentScan("com.boutique")   // dans une application Spring sans Boot
  public class BoutiqueConfig {}
  ```

  **Le nom du bean** : le nom simple de la classe, avec une minuscule (`calculPrix`). `@Component("prixTtc")` en
  donne un autre. Deux classes de même nom simple, dans deux packages, entrent en conflit
  (`ConflictingBeanDefinitionException`) : on nomme l'une explicitement.

  **Ce que le scan ignore** : les interfaces et les classes abstraites. On annote l'implémentation, pas
  l'interface. Exception : les interfaces Spring Data (`extends JpaRepository`) sont détectées par Spring Data
  lui-même, sans `@Repository`.

  **En entretien** : « `@Component` déclare un bean, et `@Service`, `@Repository`, `@Controller` en sont des
  spécialisations qui disent le rôle ; `@Repository` traduit en plus les exceptions de persistance. Le scan part du
  package de la classe `@SpringBootApplication` et descend dans ses sous-packages. »
cards:
  - key: apport-de-repository
    format: course
    question: "Qu'apporte `@Repository` de plus que `@Component` ?"
    choices:
      - {text: "La traduction des exceptions de persistance en `DataAccessException`", correct: true}
      - {text: "L'ouverture automatique d'une transaction pour chaque méthode", correct: false}
      - {text: "La création automatique de la table qui correspond à la classe", correct: false}
      - {text: "La mise en cache des résultats de chaque méthode de lecture", correct: false}
    answer: "Les exceptions propres à JDBC ou JPA deviennent des `DataAccessException` de Spring, indépendantes de la technologie. Les transactions viennent de `@Transactional`."
  - key: composition-restcontroller
    format: course
    question: "À quoi équivaut `@RestController` ?"
    choices:
      - {text: "`@Controller` plus `@ResponseBody` sur chaque méthode", correct: true}
      - {text: "`@Service` plus `@RequestMapping` sur chaque méthode", correct: false}
      - {text: "`@Component` plus `@Transactional` sur chaque méthode", correct: false}
      - {text: "`@Controller` plus `@ResponseStatus` sur chaque méthode", correct: false}
    answer: "Avec `@ResponseBody`, la valeur renvoyée est écrite dans le corps de la réponse (en JSON pour un objet), au lieu d'être prise pour un nom de vue."
  - key: portee-du-scan
    format: course
    question: "Quels packages le scan de `@SpringBootApplication` parcourt-il, par défaut ?"
    choices:
      - {text: "Le package de la classe annotée et tous ses sous-packages", correct: true}
      - {text: "Tous les packages du classpath, bibliothèques comprises", correct: false}
      - {text: "Le seul package de la classe annotée, sans ses sous-packages", correct: false}
      - {text: "Les packages listés dans le fichier `application.properties`", correct: false}
    answer: "Le scan descend depuis le package de la classe principale. Une classe dans un package parent ou frère n'est pas trouvée."
  - key: service-ou-component
    format: course
    question: "Quelle différence de comportement y a-t-il entre `@Service` et `@Component` ?"
    choices:
      - {text: "Aucune : `@Service` dit le rôle, le scan les traite pareil", correct: true}
      - {text: "`@Service` rend chaque méthode transactionnelle", correct: false}
      - {text: "`@Service` crée un bean de portée prototype", correct: false}
      - {text: "`@Service` exige que la classe implémente une interface", correct: false}
    answer: "`@Service` est méta-annotée `@Component` et n'ajoute aucun comportement. Elle documente la couche métier, et peut servir à cibler un aspect."
  - key: vf-configuration-est-un-bean
    format: true-false
    question: "Une classe annotée `@Configuration` est elle-même un bean, détecté par le scan."
    truth: true
    answer: "`@Configuration` est méta-annotée `@Component` : le scan la trouve, et ses méthodes `@Bean` déclarent d'autres beans."
  - key: vf-spring-data-sans-repository
    format: true-false
    question: "Une interface Spring Data (`extends JpaRepository`) doit être annotée `@Repository` pour être détectée."
    truth: false
    answer: "Spring Data trouve ses interfaces lui-même et en génère l'implémentation. L'annotation est inutile, sans être nuisible."
  - key: vf-meta-annotation
    format: true-false
    question: "`@Service` est méta-annotée `@Component` : c'est ce qui permet au scan de la trouver."
    truth: true
    answer: "Le scan cherche `@Component`, y compris sur les annotations d'une classe. Une annotation maison annotée `@Component` marche de la même façon."
  - key: vf-package-parent
    format: true-false
    question: "Le scan des composants détecte aussi les classes annotées d'un package parent de la classe principale."
    truth: false
    answer: "Le scan ne remonte pas : il part du package de la classe principale et descend. D'où la classe principale dans le package racine."
  - key: qcm-classe-metier
    format: multiple-choice
    question: "Quelle annotation mets-tu sur la classe qui calcule le prix d'une commande ?"
    choices:
      - {text: "`@Service`", correct: true}
      - {text: "`@Repository`", correct: false}
      - {text: "`@Controller`", correct: false}
      - {text: "`@Configuration`", correct: false}
    answer: "Le calcul du prix est de la logique métier : `@Service`. `@Repository` est pour l'accès aux données, `@Controller` pour le web."
  - key: qcm-nommer-le-bean
    format: multiple-choice
    question: "Comment donner le nom `paiementCarte` au bean de la classe `PaiementParCarte` ?"
    choices:
      - {text: "`@Component(\"paiementCarte\")`", correct: true}
      - {text: "`@Component(id = \"paiementCarte\")`", correct: false}
      - {text: "`@Bean(\"paiementCarte\")` sur la classe", correct: false}
      - {text: "`@Primary(\"paiementCarte\")`", correct: false}
    answer: "La valeur de `@Component` (ou de `@Service`...) est le nom du bean. `@Bean` s'applique à une méthode, pas à une classe."
  - key: qcm-scanner-plus-haut
    format: multiple-choice
    question: "La classe principale est dans `com.boutique.app`, les services dans `com.boutique.service`. Quelle annotation les fait trouver sans déplacer de classe ?"
    choices:
      - {text: "`@SpringBootApplication(scanBasePackages = \"com.boutique\")`", correct: true}
      - {text: "`@SpringBootApplication(exclude = \"com.boutique.app\")`", correct: false}
      - {text: "`@EnableAutoConfiguration(\"com.boutique.service\")`", correct: false}
      - {text: "`@Import(\"com.boutique.service\")` sur la classe", correct: false}
    answer: "`scanBasePackages` élargit le scan. Le plus simple reste de placer la classe principale dans `com.boutique`, au-dessus des autres."
  - key: qcm-controller-renvoie-chaine
    format: multiple-choice
    question: "Une méthode d'un `@Controller`, sans `@ResponseBody`, renvoie la chaîne `\"accueil\"`. Comment Spring MVC l'interprète-t-il ?"
    choices:
      - {text: "Comme le nom d'une vue à afficher", correct: true}
      - {text: "Comme le corps de la réponse, en texte brut", correct: false}
      - {text: "Comme une redirection vers l'adresse `/accueil`", correct: false}
      - {text: "Comme un document JSON qui contient la chaîne", correct: false}
    answer: "Un `@Controller` classique renvoie des noms de vues (un template Thymeleaf, par exemple). Pour écrire la chaîne elle-même, il faut `@ResponseBody` ou `@RestController`."
  - key: trous-service
    format: fill-in
    question: |-
      Complète avec l'annotation qui marque une classe de la couche métier :
      ```java
      @___
      public class CalculPrix {
          public BigDecimal ttc(BigDecimal ht) { ... }
      }
      ```
    blanks:
      - [Service]
    answer: "`@Service` déclare un bean, et dit qu'il porte de la logique métier."
  - key: trous-restcontroller
    format: fill-in
    question: |-
      Complète pour que la liste des produits soit écrite en JSON dans la réponse :
      ```java
      @___
      @RequestMapping("/produits")
      public class ProduitController {
          @GetMapping
          public List<Produit> lister() { ... }
      }
      ```
    blanks:
      - [RestController]
    answer: "`@RestController` ajoute `@ResponseBody` : la liste est convertie en JSON au lieu d'être prise pour un nom de vue."
  - key: trous-componentscan
    format: fill-in
    question: |-
      Complète pour faire scanner le package `com.boutique` dans une application Spring sans Boot :
      ```java
      @Configuration
      @___("com.boutique")
      public class BoutiqueConfig {
      }
      ```
    blanks:
      - [ComponentScan]
    answer: "`@ComponentScan` lance le scan à partir des packages donnés. `@SpringBootApplication` l'inclut déjà."
  - key: trous-repository
    format: fill-in
    question: |-
      Complète : cette classe accède à la base par JDBC, et ses exceptions doivent devenir des `DataAccessException`.
      ```java
      @___
      public class JdbcProduitDepot implements ProduitDepot {
          ...
      }
      ```
    blanks:
      - [Repository]
    answer: "`@Repository` déclare le bean et active la traduction des exceptions de persistance."
  - key: bug-classe-non-annotee
    format: bug-fix
    question: |-
      Le démarrage échoue : « Parameter 0 of constructor in com.boutique.CommandeService required a bean of type
      'com.boutique.CalculRemise' that could not be found. » Quelle correction est la bonne ?
      ```java
      package com.boutique;

      public class CalculRemise {
          public BigDecimal remise(BigDecimal montant) { ... }
      }

      @Service
      public class CommandeService {
          public CommandeService(CalculRemise remises) { ... }
      }
      ```
    choices:
      - {text: "Annoter `CalculRemise` avec `@Component` (ou `@Service`)", correct: true}
      - {text: "Annoter le constructeur de `CommandeService` avec `@Autowired`", correct: false}
      - {text: "Annoter le paramètre `remises` avec `@Qualifier`", correct: false}
      - {text: "Rendre la classe `CalculRemise` `final`", correct: false}
    answer: |-
      ```java
      @Service
      public class CalculRemise {
      ```
      Une classe sans annotation n'est pas un bean : le scan l'ignore, et rien ne peut l'injecter. `@Autowired` ou
      `@Qualifier` ne créent aucun bean.
  - key: bug-chaine-prise-pour-vue
    format: bug-fix
    question: |-
      `GET /bonjour` devrait renvoyer le texte « bonjour », mais Spring cherche une vue nommée « bonjour ». Quelle
      correction est la bonne ?
      ```java
      @Controller
      public class AccueilController {
          @GetMapping("/bonjour")
          public String bonjour() {
              return "bonjour";
          }
      }
      ```
    choices:
      - {text: "Remplacer `@Controller` par `@RestController`", correct: true}
      - {text: "Remplacer `@Controller` par `@Service`", correct: false}
      - {text: "Renvoyer `\"redirect:bonjour\"` au lieu de `\"bonjour\"`", correct: false}
      - {text: "Remplacer `@GetMapping` par `@RequestMapping`", correct: false}
    answer: |-
      ```java
      @RestController
      public class AccueilController {
      ```
      Un `@Controller` renvoie des noms de vues. `@RestController` (ou `@ResponseBody` sur la méthode) écrit la valeur
      dans le corps de la réponse.
  - key: bug-deux-classes-meme-nom
    format: bug-fix
    question: |-
      Le démarrage échoue : « Annotation-specified bean name 'validateur' for bean class
      [com.boutique.commande.Validateur] conflicts with existing, non-compatible bean definition of same name and class
      [com.boutique.client.Validateur] ». Quelle correction est la bonne ?
      ```java
      package com.boutique.client;
      @Component
      public class Validateur { ... }

      package com.boutique.commande;
      @Component
      public class Validateur { ... }
      ```
    choices:
      - {text: "Nommer l'un des beans : `@Component(\"validateurCommande\")`", correct: true}
      - {text: "Annoter l'une des deux classes avec `@Primary`", correct: false}
      - {text: "Annoter l'une des deux classes avec `@Lazy`", correct: false}
      - {text: "Passer l'une des deux classes en portée prototype", correct: false}
    answer: |-
      ```java
      @Component("validateurCommande")
      public class Validateur { ... }
      ```
      Les deux beans reçoivent le même nom par défaut, `validateur`, issu du nom simple de la classe. `@Primary` règle
      un choix entre types, pas un conflit de noms.
  - key: bug-annotation-sur-interface
    format: bug-fix
    question: |-
      Le démarrage échoue : « required a bean of type 'com.boutique.Paiement' that could not be found ». Quelle
      correction est la bonne ?
      ```java
      @Service
      public interface Paiement {
          void payer(BigDecimal montant);
      }

      public class PaiementParCarte implements Paiement {
          public void payer(BigDecimal montant) { ... }
      }
      ```
    choices:
      - {text: "Mettre `@Service` sur `PaiementParCarte`, la classe concrète", correct: true}
      - {text: "Ajouter `@Component` sur l'interface, en plus de `@Service`", correct: false}
      - {text: "Rendre l'interface `Paiement` `sealed`", correct: false}
      - {text: "Ajouter `@Autowired` sur la méthode `payer` de l'interface", correct: false}
    answer: |-
      ```java
      public interface Paiement { ... }

      @Service
      public class PaiementParCarte implements Paiement { ... }
      ```
      Le scan ignore les interfaces : il ne peut pas les instancier. On annote l'implémentation, et Spring l'injecte
      partout où l'on demande un `Paiement`.
