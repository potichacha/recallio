notion: spring-presentation
lesson: |-
  **Spring Framework** est un framework Java né en 2003. Son cœur est un **conteneur** : il crée les objets de
  l'application (les **beans**), leur fournit les objets dont ils ont besoin (l'**injection de dépendances**), et gère
  leur durée de vie. Le code métier reste fait de classes Java ordinaires (des **POJO**), qui n'héritent d'aucune
  classe du framework.

  Autour de ce conteneur, Spring propose des modules :

  | Module | Ce qu'il apporte |
  |---|---|
  | Core (beans, context) | le conteneur, l'injection, les événements, la configuration |
  | AOP | les aspects : transactions, cache, sécurité ajoutés autour des méthodes |
  | Accès aux données | JDBC, transactions déclaratives (`@Transactional`), intégration de JPA |
  | Web | **Spring MVC** (sur l'API Servlet) et **Spring WebFlux** (réactif) |
  | Test | un contexte Spring dans les tests JUnit, `MockMvc` |

  Au-dessus, l'**écosystème** : Spring Data (dépôts générés), Spring Security (authentification, autorisation),
  Spring Batch (traitements par lots), Spring Cloud (systèmes distribués)...

  **Spring Boot** (2014) ne remplace pas Spring : il **s'appuie sur lui et le configure pour toi**.

  | Spring Framework | Spring Boot |
  |---|---|
  | le conteneur, l'injection, MVC, les transactions | l'**auto-configuration** selon les bibliothèques présentes |
  | tu déclares toi-même chaque bean d'infrastructure | des **starters** : une dépendance par fonctionnalité, versions comprises |
  | l'application se déploie dans un serveur | un **serveur embarqué** : `java -jar app.jar` |
  | | la configuration externe (`application.properties`, variables d'environnement) |

  ```java
  @SpringBootApplication
  public class BoutiqueApplication {
      public static void main(String[] args) {
          SpringApplication.run(BoutiqueApplication.class, args);   // démarre le conteneur et le serveur
      }
  }
  ```

  **Les versions.** Ce cours vise **Spring Boot 4** et **Spring Framework 7** (fin 2025), sur Java 25. Ils exigent au
  moins Java 17 et s'appuient sur **Jakarta EE 11** : les paquets sont `jakarta.*` (depuis Boot 3), et non plus
  `javax.*`.

  **Ce qu'ils apportent** : du code découplé (une classe reçoit ses dépendances au lieu de les fabriquer), donc
  testable ; une intégration prête à l'emploi avec les bases, le web, la sécurité ; et, avec Boot, une application qui
  démarre en quelques lignes.

  **En entretien** : « Spring est un framework Java dont le cœur est un conteneur qui crée les objets et leur injecte
  leurs dépendances ; autour, des modules pour le web, les données, la sécurité. Spring Boot s'appuie dessus : il
  configure tout automatiquement selon les dépendances, avec des starters et un serveur embarqué. »
cards:
  - key: coeur-du-framework
    format: course
    question: "Quel est le cœur de Spring Framework, sur lequel reposent tous ses modules ?"
    choices:
      - {text: "Le conteneur, qui crée les beans et leur injecte leurs dépendances", correct: true}
      - {text: "Le serveur web embarqué, qui reçoit les requêtes HTTP", correct: false}
      - {text: "L'outil de mapping, qui fait correspondre objets et tables", correct: false}
      - {text: "Le moteur de templates, qui produit les pages HTML", correct: false}
    answer: "Tout Spring repose sur le conteneur d'inversion de contrôle. Le serveur embarqué vient de Spring Boot ; le mapping objet-relationnel, d'Hibernate."
  - key: boot-et-framework
    format: course
    question: "Quelle est la relation entre Spring Boot et Spring Framework ?"
    choices:
      - {text: "Boot s'appuie sur le Framework et le configure automatiquement", correct: true}
      - {text: "Boot remplace le Framework par une implémentation plus légère", correct: false}
      - {text: "Boot est un serveur d'applications qui exécute le Framework", correct: false}
      - {text: "Boot est le nouveau nom du Framework, depuis sa version 4", correct: false}
    answer: "Une application Spring Boot reste une application Spring : mêmes beans, même injection. Boot ajoute l'auto-configuration, les starters et le serveur embarqué."
  - key: versions-de-boot-4
    format: course
    question: "Sur quelles versions repose Spring Boot 4 ?"
    choices:
      - {text: "Spring Framework 7 et Jakarta EE 11, avec Java 17 au minimum", correct: true}
      - {text: "Spring Framework 6 et Java EE 8, avec Java 11 au minimum", correct: false}
      - {text: "Spring Framework 7 et Java EE 8, avec Java 25 au minimum", correct: false}
      - {text: "Spring Framework 5 et Jakarta EE 9, avec Java 8 au minimum", correct: false}
    answer: "Boot 4 (fin 2025) s'appuie sur Spring Framework 7 et Jakarta EE 11 (paquets `jakarta.*`). Java 17 est le minimum ; Java 25 est recommandé."
  - key: module-web-servlet
    format: course
    question: "Quel module de Spring sert à écrire des contrôleurs web sur l'API Servlet ?"
    choices:
      - {text: "Spring MVC", correct: true}
      - {text: "Spring Batch", correct: false}
      - {text: "Spring Data", correct: false}
      - {text: "Spring AOP", correct: false}
    answer: "Spring MVC (Web MVC) traite les requêtes HTTP sur l'API Servlet, avec `@Controller` et `@RestController`. Spring WebFlux est son pendant réactif."
  - key: vf-boot-remplace-framework
    format: true-false
    question: "Spring Boot est un framework distinct, qui remplace Spring Framework."
    truth: false
    answer: "Spring Boot s'appuie sur Spring Framework : il le configure automatiquement, il ne le remplace pas."
  - key: vf-java-jar
    format: true-false
    question: "Une application Spring Boot peut se lancer avec `java -jar`, sans serveur d'applications installé à part."
    truth: true
    answer: "Le serveur web (Tomcat par défaut) est embarqué dans le jar exécutable : un `java -jar app.jar` suffit."
  - key: vf-ecosysteme
    format: true-false
    question: "Spring Data, Spring Security et Spring Batch sont des projets de l'écosystème Spring, construits sur Spring Framework."
    truth: true
    answer: "Ils réutilisent le conteneur et l'injection de Spring Framework, et Spring Boot sait les configurer automatiquement."
  - key: vf-framework-sans-boot
    format: true-false
    question: "Spring Framework ne peut pas s'utiliser sans Spring Boot."
    truth: false
    answer: "Spring Framework existait dix ans avant Boot. On peut créer un `AnnotationConfigApplicationContext` à la main ; Boot évite seulement d'écrire toute cette configuration."
  - key: qcm-propre-a-boot
    format: multiple-choice
    question: "Quelle fonctionnalité appartient à Spring Boot, et non au seul Spring Framework ?"
    choices:
      - {text: "L'auto-configuration selon les bibliothèques présentes", correct: true}
      - {text: "L'injection de dépendances par constructeur", correct: false}
      - {text: "La gestion déclarative des transactions", correct: false}
      - {text: "La programmation orientée aspect", correct: false}
    answer: "L'injection, les transactions et l'AOP sont dans Spring Framework depuis longtemps. Boot ajoute l'auto-configuration, les starters et le serveur embarqué."
  - key: qcm-projet-securite
    format: multiple-choice
    question: "Quel projet de l'écosystème Spring gère l'authentification et l'autorisation ?"
    choices:
      - {text: "Spring Security", correct: true}
      - {text: "Spring Session", correct: false}
      - {text: "Spring Integration", correct: false}
      - {text: "Spring Cloud Config", correct: false}
    answer: "Spring Security protège les applications web et les méthodes. Spring Session partage les sessions HTTP ; Spring Cloud Config centralise la configuration."
  - key: qcm-module-reactif
    format: multiple-choice
    question: "Quel module de Spring Framework permet d'écrire une application web réactive, non bloquante ?"
    choices:
      - {text: "Spring WebFlux", correct: true}
      - {text: "Spring MVC", correct: false}
      - {text: "Spring Batch", correct: false}
      - {text: "Spring JDBC", correct: false}
    answer: "WebFlux repose sur Reactor et un serveur non bloquant (Netty par défaut). Spring MVC reste le choix courant, bloquant, sur l'API Servlet."
  - key: qcm-benefice-injection
    format: multiple-choice
    question: "Quel bénéfice principal l'injection de dépendances de Spring apporte-t-elle au code métier ?"
    choices:
      - {text: "Des classes découplées, qu'on teste avec de fausses dépendances", correct: true}
      - {text: "Un code plus rapide, car Spring compile les classes à l'avance", correct: false}
      - {text: "Moins de mémoire, car Spring partage les objets entre applications", correct: false}
      - {text: "Moins de lignes, car Spring génère les getters et les setters", correct: false}
    answer: "Une classe déclare ses besoins au lieu de les fabriquer : on change d'implémentation sans la toucher, et un test lui passe des doublures. Générer les accesseurs, c'est Lombok, pas Spring."
  - key: situation-nouveau-service
    format: scenario
    question: |-
      Ton équipe démarre un nouveau service REST et hésite entre configurer Spring Framework à la main ou partir de
      Spring Boot. Que recommandes-tu ?
    choices:
      - {text: "Spring Boot : il apporte réglages par défaut, starters et serveur embarqué", correct: true}
      - {text: "Spring Framework seul : Boot ajoute une couche qui ralentit chaque requête", correct: false}
      - {text: "Ni l'un ni l'autre : un serveur d'applications Jakarta EE reste obligatoire", correct: false}
      - {text: "Spring Boot, mais seulement si le service n'a pas de base de données", correct: false}
    answer: |-
      Boot ne coûte rien à l'exécution : il crée au démarrage les mêmes beans qu'on aurait déclarés à la main. Il évite
      des centaines de lignes de configuration, et chaque réglage par défaut reste modifiable.
  - key: situation-spring-en-une-phrase
    format: scenario
    question: |-
      En entretien, on te demande : « En une phrase, qu'est-ce que Spring ? » Que réponds-tu ?
    choices:
      - {text: "Un framework Java dont le conteneur crée les objets et leur injecte leurs dépendances", correct: true}
      - {text: "Un serveur d'applications Java qui exécute des fichiers WAR déployés à chaud", correct: false}
      - {text: "Une bibliothèque de mapping objet-relationnel, concurrente d'Hibernate", correct: false}
      - {text: "Un langage de configuration XML qui remplace le code Java des applications", correct: false}
    answer: |-
      Le conteneur et l'injection de dépendances sont le socle ; tout le reste (web, données, sécurité) s'y branche.
      Le XML a été la première façon de déclarer les beans, mais les annotations et les classes Java l'ont remplacé.
  - key: situation-boot-magique
    format: scenario
    question: |-
      Un collègue trouve Spring Boot « magique » : il ne sait pas ce qu'il configure. Comment lui montres-tu ce que
      Boot a mis en place ?
    choices:
      - {text: "Lancer l'application avec `--debug` et lire le rapport des conditions", correct: true}
      - {text: "Relire le `pom.xml`, qui liste chaque bean créé par Boot", correct: false}
      - {text: "Désactiver Boot et comparer les temps de démarrage", correct: false}
      - {text: "Chercher les classes générées dans `target/generated-sources`", correct: false}
    answer: |-
      Le rapport d'évaluation des conditions liste chaque auto-configuration appliquée ou écartée, avec la raison. Rien
      n'est caché : ce sont des classes `@Configuration` conditionnelles, qu'on peut lire.
  - key: situation-migration-javax
    format: scenario
    question: |-
      Ton équipe migre une application de Spring Boot 2 vers Spring Boot 4. La compilation échoue sur tous les imports
      `javax.persistence` et `javax.servlet`. Que lui expliques-tu ?
    choices:
      - {text: "Depuis Boot 3, Spring repose sur Jakarta EE : ces paquets sont devenus `jakarta.*`", correct: true}
      - {text: "Boot 4 n'embarque plus JPA ni l'API Servlet : il faut les ajouter à la main", correct: false}
      - {text: "Les imports `javax` ne sont permis que dans les modules nommés de Java", correct: false}
      - {text: "Boot 4 génère ces classes à la compilation : il faut supprimer les imports", correct: false}
    answer: |-
      Java EE est devenu Jakarta EE, et ses paquets ont changé de nom. Boot 3 a fait le saut ; Boot 4 s'appuie sur
      Jakarta EE 11. On remplace `javax.persistence` par `jakarta.persistence`, `javax.servlet` par `jakarta.servlet`.
  - key: def-spring-framework
    format: definition
    question: "Quel terme désigne le framework Java dont le cœur est un conteneur qui crée les objets et leur injecte leurs dépendances ?"
    choices:
      - {text: "Spring Framework", correct: true}
      - {text: "Jakarta EE", correct: false}
      - {text: "Hibernate", correct: false}
      - {text: "Apache Tomcat", correct: false}
    answer: "Spring Framework. Jakarta EE est un ensemble de spécifications ; Hibernate, un ORM ; Tomcat, un conteneur de servlets."
  - key: def-spring-boot
    format: definition
    question: "Quel terme désigne la surcouche qui configure automatiquement une application Spring, avec des starters et un serveur embarqué ?"
    choices:
      - {text: "Spring Boot", correct: true}
      - {text: "Spring Cloud", correct: false}
      - {text: "Spring Data", correct: false}
      - {text: "Spring Shell", correct: false}
    answer: "Spring Boot. Spring Cloud outille les systèmes distribués ; Spring Data, l'accès aux données."
  - key: def-initializr
    format: definition
    question: "Comment s'appelle le service web (start.spring.io) qui génère le squelette d'un projet Spring Boot ?"
    choices:
      - {text: "Spring Initializr", correct: true}
      - {text: "Spring Boot CLI", correct: false}
      - {text: "Spring Tools", correct: false}
      - {text: "Maven Archetype", correct: false}
    answer: "Spring Initializr produit un projet prêt à compiler : build Maven ou Gradle, starters choisis, classe principale."
  - key: def-pojo
    format: definition
    question: "Quel terme désigne une classe Java ordinaire, qui n'hérite d'aucune classe du framework et que Spring sait pourtant gérer ?"
    choices:
      - {text: "Un POJO (Plain Old Java Object)", correct: true}
      - {text: "Un EJB (Enterprise JavaBean)", correct: false}
      - {text: "Une servlet", correct: false}
      - {text: "Un DTO (Data Transfer Object)", correct: false}
    answer: "Spring a popularisé les POJO face aux EJB, qui imposaient des interfaces et un serveur. Un DTO est un POJO particulier, qui transporte des données."
