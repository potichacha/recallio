notion: inversion-controle
lesson: |-
  **Sans Spring**, une classe fabrique elle-même ce dont elle a besoin :

  ```java
  public class CommandeService {
      private final CommandeRepository depot = new JpaCommandeRepository();   // la classe choisit et crée
  }
  ```

  Elle est liée à une implémentation précise, et un test ne peut pas lui passer de fausse dépendance.

  **Avec l'inversion de contrôle (IoC)**, ce n'est plus la classe qui contrôle la création de ses dépendances : c'est
  le **conteneur**. La classe se contente de **déclarer** ce qu'elle attend ; le conteneur crée les objets et les
  relie. C'est le principe d'Hollywood : « ne nous appelle pas, c'est nous qui t'appellerons ».

  ```java
  @Service
  public class CommandeService {
      private final CommandeRepository depot;

      public CommandeService(CommandeRepository depot) {   // « j'ai besoin d'un dépôt »
          this.depot = depot;
      }
  }
  ```

  **Le conteneur.** Dans Spring, c'est l'**`ApplicationContext`**. Il étend `BeanFactory` (la fabrique de beans de
  base) avec les événements, les messages internationalisés, l'accès aux ressources, l'intégration de l'AOP et la
  **création anticipée des singletons** au démarrage.

  **Un bean** est un objet que le conteneur crée et gère. Le conteneur lit d'abord des **définitions de beans**
  (`BeanDefinition` : classe, portée, dépendances), qui viennent :

  | Source | Exemple |
  |---|---|
  | le scan des composants | une classe annotée `@Component`, `@Service`... |
  | une classe de configuration | une méthode `@Bean` dans une classe `@Configuration` |
  | du XML (historique) | `<bean id="..." class="..."/>` |

  Puis il crée les singletons au démarrage (au « rafraîchissement » du contexte), injecte leurs dépendances, appelle
  leurs méthodes d'initialisation, et, à la fermeture, leurs méthodes de destruction.

  ```java
  try (var context = new AnnotationConfigApplicationContext(BoutiqueConfig.class)) {
      CommandeService service = context.getBean(CommandeService.class);
  }
  ```

  Avec Spring Boot, c'est `SpringApplication.run` qui crée et démarre le contexte. Le nom d'un bean est, par défaut,
  celui de sa classe avec une minuscule initiale (`commandeService`), ou le nom de la méthode `@Bean`.

  **Les pièges.** Un objet créé avec `new` n'est **pas** un bean, même si sa classe est annotée : Spring ne le connaît
  pas et n'y injecte rien. Et le code métier n'appelle pas `context.getBean(...)` pour trouver ses collaborateurs
  (c'est un *service locator*, qui cache les dépendances) : il les reçoit.

  **En entretien** : « L'inversion de contrôle, c'est confier la création et l'assemblage des objets au framework :
  une classe déclare ses dépendances au lieu de les fabriquer. Dans Spring, le conteneur est l'`ApplicationContext` ;
  il lit les définitions de beans, crée les singletons au démarrage et les injecte. »
cards:
  - key: ce-qui-est-inverse
    format: course
    question: "Dans l'inversion de contrôle, qu'est-ce qui est « inversé » ?"
    choices:
      - {text: "La création des dépendances : le conteneur les fournit à la classe", correct: true}
      - {text: "L'ordre d'appel des méthodes : la dernière déclarée passe en premier", correct: false}
      - {text: "Le sens de l'héritage : la classe mère dépend de ses classes filles", correct: false}
      - {text: "Le flux des données : la réponse part avant l'arrivée de la requête", correct: false}
    answer: "Ce n'est plus la classe qui contrôle la fabrication de ses collaborateurs, mais le conteneur. La classe se contente de les déclarer."
  - key: apport-applicationcontext
    format: course
    question: "Qu'ajoute `ApplicationContext` à `BeanFactory` ?"
    choices:
      - {text: "Les événements, l'internationalisation et la création anticipée des singletons", correct: true}
      - {text: "L'injection de dépendances, que `BeanFactory` ne sait pas faire seule", correct: false}
      - {text: "La portée singleton, que `BeanFactory` remplace par la portée prototype", correct: false}
      - {text: "La compilation des classes de l'application, que `BeanFactory` laisse au JDK", correct: false}
    answer: "`BeanFactory` sait déjà créer et injecter des beans. `ApplicationContext` en fait un conteneur complet : événements, messages, ressources, AOP, et singletons créés dès le démarrage."
  - key: creation-des-singletons
    format: course
    question: "Quand un `ApplicationContext` crée-t-il ses beans singletons, par défaut ?"
    choices:
      - {text: "Au démarrage, pendant le rafraîchissement du contexte", correct: true}
      - {text: "À la première requête HTTP qui en a besoin", correct: false}
      - {text: "Au premier appel de `getBean` pour chacun d'eux", correct: false}
      - {text: "À la compilation, par un processeur d'annotations", correct: false}
    answer: "Les singletons sont créés dès le démarrage : une erreur de configuration se voit tout de suite. `@Lazy` retarde la création d'un bean à sa première utilisation."
  - key: nom-par-defaut
    format: course
    question: "Quel nom Spring donne-t-il par défaut au bean de la classe `CommandeService`, annotée `@Service` ?"
    choices:
      - {text: "`commandeService`", correct: true}
      - {text: "`CommandeService`", correct: false}
      - {text: "`commande-service`", correct: false}
      - {text: "`com.boutique.CommandeService`", correct: false}
    answer: "Le nom simple de la classe, avec une minuscule initiale. `@Service(\"commandes\")` en donne un autre."
  - key: vf-classe-appelle-new
    format: true-false
    question: "Avec l'inversion de contrôle, une classe métier appelle `new` pour créer ses dépendances."
    truth: false
    answer: "C'est justement ce qui change : la classe déclare ses dépendances (souvent dans son constructeur), et le conteneur les lui fournit."
  - key: vf-new-pas-un-bean
    format: true-false
    question: "Un objet créé avec `new` n'est pas un bean, même si sa classe est annotée `@Component`."
    truth: true
    answer: "Seuls les objets créés par le conteneur sont des beans. Sur un objet fait avec `new`, Spring n'injecte rien et n'applique ni transaction ni aspect."
  - key: vf-run-cree-contexte
    format: true-false
    question: "Spring Boot crée l'`ApplicationContext` dans `SpringApplication.run`."
    truth: true
    answer: "`run` prépare l'environnement, crée le contexte adapté (web ou non), le démarre, puis le renvoie."
  - key: vf-getbean-dans-le-metier
    format: true-false
    question: "Le code métier devrait appeler `context.getBean(...)` pour obtenir ses collaborateurs."
    truth: false
    answer: "Chercher ses dépendances dans le contexte cache ce dont la classe a besoin et la lie à Spring. On les reçoit par le constructeur."
  - key: qcm-source-non-valable
    format: multiple-choice
    question: "Laquelle de ces sources ne décrit pas de beans au conteneur Spring ?"
    choices:
      - {text: "Le fichier `module-info.java`", correct: true}
      - {text: "Une classe `@Configuration` avec des méthodes `@Bean`", correct: false}
      - {text: "Les classes `@Component` trouvées par le scan", correct: false}
      - {text: "Un fichier XML qui contient des éléments `<bean>`", correct: false}
    answer: "Les annotations, les méthodes `@Bean` et le XML produisent des définitions de beans. `module-info.java` décrit un module Java, pas des beans."
  - key: qcm-contexte-sans-boot
    format: multiple-choice
    question: "Quelle classe crée un `ApplicationContext` à partir de classes Java annotées, sans Spring Boot ?"
    choices:
      - {text: "`AnnotationConfigApplicationContext`", correct: true}
      - {text: "`ClassPathXmlApplicationContext`", correct: false}
      - {text: "`DefaultListableBeanFactory`", correct: false}
      - {text: "`SpringApplication`", correct: false}
    answer: "`AnnotationConfigApplicationContext` lit des classes `@Configuration` ou `@Component`. `ClassPathXmlApplicationContext` lit du XML ; `SpringApplication` appartient à Boot."
  - key: qcm-getbean-par-type
    format: multiple-choice
    question: "Quelle ligne récupère, dans un `ApplicationContext`, le bean de type `CommandeService` ?"
    choices:
      - {text: "`context.getBean(CommandeService.class)`", correct: true}
      - {text: "`context.lookup(CommandeService.class)`", correct: false}
      - {text: "`context.inject(CommandeService.class)`", correct: false}
      - {text: "`new CommandeService(context)`", correct: false}
    answer: "`getBean` cherche par type ou par nom. Utile dans un `main` ou un test ; dans le code métier, on préfère recevoir le bean par injection."
  - key: qcm-fermeture-contexte
    format: multiple-choice
    question: "Que fait le conteneur quand on ferme un `ApplicationContext` ?"
    choices:
      - {text: "Il appelle les méthodes de destruction de ses singletons", correct: true}
      - {text: "Il sérialise ses beans sur le disque pour le prochain démarrage", correct: false}
      - {text: "Il recrée chaque bean, pour libérer la mémoire", correct: false}
      - {text: "Rien : les beans sont libérés par le seul ramasse-miettes", correct: false}
    answer: "À la fermeture, les méthodes `@PreDestroy` (ou `close()`) des singletons sont appelées : connexions fermées, tâches arrêtées."
  - key: situation-new-dans-controleur
    format: scenario
    question: |-
      Un collègue écrit `private final CommandeService service = new CommandeService();` dans un contrôleur. Les
      dépendances de `CommandeService`, injectées par champ, sont toutes `null`. Que lui expliques-tu ?
    choices:
      - {text: "Un objet créé avec `new` échappe au conteneur : il faut injecter le service", correct: true}
      - {text: "Il manque `@Autowired` sur la déclaration de la classe `CommandeService`", correct: false}
      - {text: "Il faut rendre le champ `static`, pour que Spring le remplisse au démarrage", correct: false}
      - {text: "Il faut appeler `service.refresh()` juste après sa création avec `new`", correct: false}
    answer: |-
      Spring n'injecte que dans les objets qu'il crée. Le contrôleur doit recevoir le bean `CommandeService` par son
      constructeur ; il obtient alors l'instance gérée, avec ses dépendances.
  - key: situation-classe-sans-dependance
    format: scenario
    question: |-
      Une classe utilitaire `Arrondi`, sans état ni dépendance, arrondit des montants. Un collègue veut en faire un
      bean « parce que tout doit être un bean ». Que lui réponds-tu ?
    choices:
      - {text: "Pas forcément : sans rien à injecter ni à remplacer, une méthode statique suffit", correct: true}
      - {text: "Oui : une classe qui n'est pas un bean ne peut pas être appelée par un bean", correct: false}
      - {text: "Oui : une classe sans bean n'est pas chargée par la JVM dans une application Spring", correct: false}
      - {text: "Non : un bean ne peut jamais être sans état", correct: false}
    answer: |-
      Un bean se justifie quand l'objet a des dépendances, une configuration, ou qu'on veut pouvoir le remplacer
      (dans un test, par une autre implémentation). Une fonction pure peut rester une méthode statique.
  - key: situation-definir-ioc
    format: scenario
    question: |-
      En entretien : « Qu'est-ce que l'inversion de contrôle ? » Quelle réponse est la plus juste ?
    choices:
      - {text: "Le framework crée et relie les objets ; le code ne fait que déclarer ses besoins", correct: true}
      - {text: "Le code appelle le framework quand il en a besoin, comme une simple bibliothèque", correct: false}
      - {text: "Les méthodes d'une classe s'exécutent dans l'ordre inverse de leur déclaration", correct: false}
      - {text: "Les classes filles décident du comportement de leur classe mère", correct: false}
    answer: |-
      C'est la différence entre une bibliothèque (ton code l'appelle) et un framework (il appelle ton code). Spring
      applique ce principe à la création des objets : c'est l'injection de dépendances.
  - key: situation-service-locator
    format: scenario
    question: |-
      Dans un projet hérité, chaque service appelle `ContexteGlobal.get().getBean(...)` pour trouver ses
      collaborateurs. Que proposes-tu ?
    choices:
      - {text: "Les recevoir par le constructeur : les dépendances deviennent visibles et testables", correct: true}
      - {text: "Garder ce code : c'est la façon recommandée d'utiliser le conteneur", correct: false}
      - {text: "Remplacer chaque `getBean` par un `new`, pour ne plus passer par Spring", correct: false}
      - {text: "Rendre chaque service `static`, pour éviter la recherche dans le contexte", correct: false}
    answer: |-
      Ce *service locator* cache les dépendances : il faut lire tout le code pour les connaître, et un test doit monter
      un contexte. Avec l'injection par constructeur, la signature dit tout, et un `new` suffit dans un test.
  - key: def-inversion-de-controle
    format: definition
    question: "Quel terme désigne le principe où un framework crée les objets et les relie, au lieu que le code le fasse lui-même ?"
    choices:
      - {text: "L'inversion de contrôle", correct: true}
      - {text: "L'encapsulation", correct: false}
      - {text: "La programmation réactive", correct: false}
      - {text: "Le polymorphisme", correct: false}
    answer: "L'inversion de contrôle (IoC). L'injection de dépendances en est la forme la plus courante."
  - key: def-bean
    format: definition
    question: "Quel terme désigne un objet dont le conteneur Spring gère la création, les dépendances et la durée de vie ?"
    choices:
      - {text: "Un bean", correct: true}
      - {text: "Un POJO", correct: false}
      - {text: "Un DTO", correct: false}
      - {text: "Une entité", correct: false}
    answer: "Un bean. Sa classe est souvent un POJO, mais c'est la gestion par le conteneur qui en fait un bean."
  - key: def-applicationcontext
    format: definition
    question: "Quel terme désigne l'interface du conteneur Spring complet, qui ajoute à la fabrique de beans les événements et l'internationalisation ?"
    choices:
      - {text: "`ApplicationContext`", correct: true}
      - {text: "`BeanFactory`", correct: false}
      - {text: "`Environment`", correct: false}
      - {text: "`BeanDefinition`", correct: false}
    answer: "`ApplicationContext` étend `BeanFactory`. `Environment` porte les propriétés et les profils ; `BeanDefinition` décrit un bean."
  - key: def-bean-definition
    format: definition
    question: "Quel terme désigne la description d'un bean que lit le conteneur : sa classe, sa portée, ses dépendances ?"
    choices:
      - {text: "Une définition de bean (`BeanDefinition`)", correct: true}
      - {text: "Un descripteur de déploiement (`web.xml`)", correct: false}
      - {text: "Le manifeste du jar (`MANIFEST.MF`)", correct: false}
      - {text: "Le descripteur de module (`module-info.java`)", correct: false}
    answer: "Le conteneur lit d'abord toutes les définitions (scan, `@Bean`, XML), puis crée les beans à partir d'elles."
