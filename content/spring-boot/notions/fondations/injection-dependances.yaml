notion: injection-dependances
lesson: |-
  L'**injection de dépendances** est la forme concrète de l'inversion de contrôle : le conteneur passe à un bean les
  beans dont il a besoin. Spring connaît trois façons de le faire.

  **1. Par constructeur (la forme recommandée).**

  ```java
  @Service
  public class CommandeService {
      private final Stock stock;
      private final Journal journal;

      public CommandeService(Stock stock, Journal journal) {   // pas d'@Autowired : constructeur unique
          this.stock = stock;
          this.journal = journal;
      }
  }
  ```

  - Les dépendances sont **obligatoires** : l'objet ne peut pas exister sans elles.
  - Les champs sont **`final`** : ils ne changent plus après la construction.
  - La classe se **teste sans Spring** : `new CommandeService(fauxStock, fauxJournal)`.
  - Un constructeur à neuf paramètres **se voit** : il signale une classe qui en fait trop.

  Quand la classe a **un seul** constructeur, Spring l'utilise sans `@Autowired`. Si elle en a **plusieurs**,
  `@Autowired` désigne celui à utiliser ; sinon Spring prend le constructeur sans paramètre, s'il existe.

  **2. Par setter.** Pour une dépendance **facultative**, ou qu'on peut changer après la création :

  ```java
  @Autowired(required = false)
  public void setNotificateur(Notificateur notificateur) { this.notificateur = notificateur; }
  ```

  **3. Par champ.** Concise, mais à éviter dans le code de production :

  ```java
  @Autowired
  private Stock stock;   // ni final, ni visible de l'extérieur
  ```

  Les dépendances sont cachées, le champ ne peut pas être `final`, et un test doit passer par Spring ou par la
  réflexion. Surtout, le champ est encore **`null` pendant le constructeur** : Spring le remplit après.

  | Forme | Obligatoire | `final` | Test sans Spring | Usage |
  |---|---|---|---|---|
  | constructeur | oui | oui | facile | par défaut |
  | setter | non | non | possible | dépendance facultative |
  | champ | non | non | difficile | tests, code jetable |

  **Une dépendance facultative** se déclare aussi avec `ObjectProvider<T>` (`getIfAvailable()`, `ifAvailable(...)`)
  ou `Optional<T>` en paramètre.

  **Dépendre d'une interface.** On déclare `Notificateur` plutôt que `EmailNotificateur` : on change
  d'implémentation sans toucher à la classe qui l'utilise.

  **Les pièges.**
  - Créer un bean avec `new` : Spring n'y injecte rien, et l'objet ne partage pas les beans du conteneur.
  - Lire un champ `@Autowired` dans le constructeur : il vaut `null`, d'où une `NullPointerException` au démarrage.
  - Un champ `static` n'est jamais injecté.

  **En entretien** : « Je préfère l'injection par constructeur : les dépendances sont obligatoires et visibles, les
  champs sont `final`, et je teste la classe avec un simple `new`. Le setter sert aux dépendances facultatives ;
  l'injection par champ cache les dépendances, je la réserve aux tests. »
cards:
  - key: forme-recommandee
    format: course
    question: "Quelle forme d'injection l'équipe Spring recommande-t-elle pour les dépendances obligatoires ?"
    choices:
      - {text: "Par constructeur", correct: true}
      - {text: "Par champ, avec `@Autowired`", correct: false}
      - {text: "Par setter", correct: false}
      - {text: "Par `context.getBean`", correct: false}
    answer: "Le constructeur rend les dépendances obligatoires, permet des champs `final` et un test sans Spring. Le setter reste pour les dépendances facultatives."
  - key: autowired-sur-constructeur
    format: course
    question: "Quand l'annotation `@Autowired` est-elle nécessaire sur un constructeur ?"
    choices:
      - {text: "Quand la classe en a plusieurs : elle désigne celui à utiliser", correct: true}
      - {text: "Toujours : sans elle, Spring crée le bean sans ses dépendances", correct: false}
      - {text: "Quand le constructeur est public : un privé est choisi d'office", correct: false}
      - {text: "Quand les paramètres sont des interfaces plutôt que des classes", correct: false}
    answer: "Avec un seul constructeur, Spring l'utilise d'office. Avec plusieurs, sans `@Autowired`, il prend le constructeur sans paramètre s'il existe."
  - key: usage-du-setter
    format: course
    question: "À quoi sert surtout l'injection par setter ?"
    choices:
      - {text: "À une dépendance facultative, ou qu'on peut changer après la création", correct: true}
      - {text: "À une dépendance obligatoire, qu'on veut déclarer `final`", correct: false}
      - {text: "À injecter une dépendance dans un champ `static`", correct: false}
      - {text: "À accélérer le démarrage, les setters étant appelés plus tard", correct: false}
    answer: "Avec `@Autowired(required = false)`, l'absence de bean ne fait pas échouer le démarrage. Un champ `final` ne peut pas être affecté dans un setter."
  - key: pourquoi-final
    format: course
    question: "Pourquoi l'injection par constructeur permet-elle des champs `final` ?"
    choices:
      - {text: "Le constructeur est le seul endroit où un champ `final` reçoit sa valeur", correct: true}
      - {text: "Spring rend `final` tout champ qu'un constructeur affecte", correct: false}
      - {text: "Spring remplit les champs `final` par réflexion, après le constructeur", correct: false}
      - {text: "Les champs `final` sont réservés aux beans de portée singleton", correct: false}
    answer: "C'est une règle de Java : un champ `final` s'affecte une fois, à la construction. Ni un setter ni l'injection par champ ne le peuvent."
  - key: vf-champ-rempli-dans-constructeur
    format: true-false
    question: "Un champ annoté `@Autowired` est déjà rempli quand le constructeur de la classe s'exécute."
    truth: false
    answer: "Spring crée d'abord l'objet (constructeur), puis remplit ses champs. Pendant le constructeur, le champ vaut encore `null`."
  - key: vf-constructeur-unique
    format: true-false
    question: "Une classe qui n'a qu'un seul constructeur n'a pas besoin d'`@Autowired` pour que Spring lui injecte ses paramètres."
    truth: true
    answer: "Depuis Spring 4.3, un constructeur unique est utilisé d'office pour l'injection."
  - key: vf-test-avec-new
    format: true-false
    question: "Avec l'injection par constructeur, on peut tester la classe sans Spring, en lui passant des doublures."
    truth: true
    answer: "`new CommandeService(fauxStock, fauxJournal)` : pas de contexte à démarrer, le test tourne en millisecondes."
  - key: vf-champ-final
    format: true-false
    question: "L'injection par champ permet de déclarer la dépendance `final`."
    truth: false
    answer: "Spring remplit le champ après la construction : un champ `final` ne le permet pas. Seul le constructeur le peut."
  - key: qcm-dependance-facultative
    format: multiple-choice
    question: "Comment déclarer une dépendance facultative, pour laquelle aucun bean n'existe peut-être ?"
    choices:
      - {text: "Un paramètre `ObjectProvider<Notificateur>` ou `Optional<Notificateur>`", correct: true}
      - {text: "Un paramètre `Notificateur` déclaré `final` dans le constructeur", correct: false}
      - {text: "Un champ `Notificateur` annoté `@Autowired`, sans attribut", correct: false}
      - {text: "Une annotation `@Bean(optional = true)` sur la classe", correct: false}
    answer: "`ObjectProvider` offre `getIfAvailable()` et `ifAvailable(...)` ; `Optional` est vide sans bean. Un `@Autowired` sans attribut exige le bean."
  - key: qcm-dependre-interface
    format: multiple-choice
    question: "Pourquoi déclarer la dépendance par son interface (`Notificateur`) plutôt que par sa classe (`EmailNotificateur`) ?"
    choices:
      - {text: "Pour changer d'implémentation sans toucher à la classe qui l'utilise", correct: true}
      - {text: "Parce que Spring ne sait pas injecter une classe concrète", correct: false}
      - {text: "Pour que l'implémentation soit recréée à chaque appel", correct: false}
      - {text: "Parce qu'une interface se charge plus vite qu'une classe", correct: false}
    answer: "La classe dépend d'un contrat, pas d'un choix technique : on passe à l'envoi de SMS, ou à un faux en test, sans la modifier. Spring sait très bien injecter une classe concrète."
  - key: qcm-reconnaitre-constructeur
    format: multiple-choice
    question: "Lequel de ces codes injecte `Stock` par constructeur ?"
    choices:
      - {text: "`CommandeService(Stock stock) { this.stock = stock; }`", correct: true}
      - {text: "`@Autowired private Stock stock;`", correct: false}
      - {text: "`@Autowired void setStock(Stock stock) { this.stock = stock; }`", correct: false}
      - {text: "`private final Stock stock = new Stock();`", correct: false}
    answer: "Le deuxième injecte par champ, le troisième par setter. Le dernier n'injecte rien : la classe crée sa propre copie, que Spring ne connaît pas."
  - key: qcm-defaut-injection-champ
    format: multiple-choice
    question: "Quel défaut a l'injection par champ ?"
    choices:
      - {text: "Les dépendances sont cachées, et un test doit passer par Spring", correct: true}
      - {text: "Elle ralentit chaque appel, car Spring relit le champ à chaque fois", correct: false}
      - {text: "Elle crée un nouvel objet à chaque injection, même pour un singleton", correct: false}
      - {text: "Elle interdit d'utiliser une interface comme type de la dépendance", correct: false}
    answer: "Le champ est privé et rempli par réflexion : la signature de la classe ne dit rien, et un `new` dans un test laisse le champ `null`. À l'exécution, en revanche, aucun coût."
  - key: trous-champ-final
    format: fill-in
    question: |-
      Complète pour que la dépendance ne puisse plus changer après la construction :
      ```java
      @Service
      public class CommandeService {
          private ___ Stock stock;

          public CommandeService(Stock stock) {
              this.stock = stock;
          }
      }
      ```
    blanks:
      - [final]
    answer: "Un champ `final` est affecté une seule fois, dans le constructeur."
  - key: trous-deux-constructeurs
    format: fill-in
    question: |-
      Complète : la classe a deux constructeurs, et Spring doit utiliser le second.
      ```java
      public class Rapport {
          private final Horloge horloge;

          public Rapport() {
              this(Horloge.systeme());
          }

          @___
          public Rapport(Horloge horloge) {
              this.horloge = horloge;
          }
      }
      ```
    blanks:
      - [Autowired]
    answer: "Avec plusieurs constructeurs, `@Autowired` désigne celui de l'injection. Sans elle, Spring prendrait le constructeur sans paramètre."
  - key: trous-setter-facultatif
    format: fill-in
    question: |-
      Complète pour que l'absence de bean `Notificateur` ne fasse pas échouer le démarrage :
      ```java
      @Autowired(___ = false)
      public void setNotificateur(Notificateur notificateur) {
          this.notificateur = notificateur;
      }
      ```
    blanks:
      - [required]
    answer: "`required = false` : le setter n'est simplement pas appelé s'il n'y a pas de bean."
  - key: trous-objectprovider
    format: fill-in
    question: |-
      Complète pour obtenir le bean s'il existe, ou `null` sinon :
      ```java
      public CommandeService(ObjectProvider<Notificateur> notificateurs) {
          this.notificateur = notificateurs.___();
      }
      ```
    blanks:
      - [getIfAvailable]
    answer: "`getIfAvailable()` renvoie le bean, ou `null` s'il n'y en a pas. `getObject()` lèverait une exception."
  - key: bug-champ-lu-dans-constructeur
    format: bug-fix
    question: |-
      Au démarrage, la création de `Catalogue` échoue sur une `NullPointerException` : « Cannot invoke
      "Depot.produits()" because "this.depot" is null ». Quelle correction est la bonne ?
      ```java
      @Component
      public class Catalogue {
          @Autowired
          private Depot depot;
          private final List<Produit> produits;

          public Catalogue() {
              produits = depot.produits();
          }
      }
      ```
    choices:
      - {text: "Recevoir `Depot` en paramètre du constructeur", correct: true}
      - {text: "Ajouter `@Lazy` sur le champ `depot`", correct: false}
      - {text: "Rendre le champ `depot` `static`", correct: false}
      - {text: "Annoter le constructeur `@Autowired`, sans paramètre", correct: false}
    answer: |-
      ```java
      public Catalogue(Depot depot) {
          this.depot = depot;
          this.produits = depot.produits();
      }
      ```
      Spring remplit un champ `@Autowired` après avoir appelé le constructeur : pendant celui-ci, il vaut `null`. Reçu
      en paramètre, le dépôt est disponible dès la construction.
  - key: bug-copie-privee
    format: bug-fix
    question: |-
      Après une commande, le bean `Stock` de l'application n'a pas bougé : les autres services voient toujours
      l'ancienne quantité. Quelle correction est la bonne ?
      ```java
      @Service
      public class CommandeService {
          private final Stock stock = new Stock();

          public void commander(String produit, int quantite) {
              stock.retirer(produit, quantite);
          }
      }
      ```
    choices:
      - {text: "Recevoir le `Stock` par le constructeur, au lieu de le créer", correct: true}
      - {text: "Annoter le champ `stock` avec `@Autowired`, sans rien d'autre", correct: false}
      - {text: "Rendre le champ `stock` `static`, pour le partager", correct: false}
      - {text: "Annoter `Stock` avec `@Scope(\"prototype\")`", correct: false}
    answer: |-
      ```java
      private final Stock stock;

      public CommandeService(Stock stock) {
          this.stock = stock;
      }
      ```
      Avec `new`, le service travaille sur sa propre copie, inconnue de Spring. Injecté, il partage le singleton du
      conteneur. Ajouter `@Autowired` sur un champ déjà initialisé et `final` ne compile pas.
  - key: bug-deux-constructeurs
    format: bug-fix
    question: |-
      L'application déclare un bean `Horloge` réglé sur le fuseau de Paris, mais `Rapport` utilise toujours l'horloge
      du système. Quelle correction est la bonne ?
      ```java
      @Component
      public class Rapport {
          private final Horloge horloge;

          public Rapport() {
              this(Horloge.systeme());
          }

          public Rapport(Horloge horloge) {
              this.horloge = horloge;
          }
      }
      ```
    choices:
      - {text: "Annoter `@Autowired` le constructeur qui reçoit l'`Horloge`", correct: true}
      - {text: "Annoter `@Primary` le bean `Horloge` réglé sur Paris", correct: false}
      - {text: "Rendre public le constructeur sans paramètre", correct: false}
      - {text: "Ajouter `@Lazy` sur la classe `Rapport`", correct: false}
    answer: |-
      ```java
      @Autowired
      public Rapport(Horloge horloge) {
      ```
      Avec plusieurs constructeurs et aucun `@Autowired`, Spring prend le constructeur sans paramètre : le bean
      `Horloge` n'est jamais demandé. `@Autowired` désigne le bon constructeur (ou l'on supprime l'autre).
  - key: bug-test-unitaire-npe
    format: bug-fix
    question: |-
      Ce test unitaire, sans Spring, échoue sur une `NullPointerException` dans `total`. Quelle correction du service
      est la bonne ?
      ```java
      @Service
      public class FactureService {
          @Autowired
          private TauxDeTva taux;

          public BigDecimal total(BigDecimal ht) {
              return ht.multiply(taux.coefficient());
          }
      }

      @Test
      void ajouteLaTva() {
          var service = new FactureService();
          assertThat(service.total(new BigDecimal("100"))).isEqualByComparingTo("120");
      }
      ```
    choices:
      - {text: "Injecter `TauxDeTva` par constructeur, et le passer dans le test", correct: true}
      - {text: "Annoter la classe de test `@Autowired`, pour remplir le champ", correct: false}
      - {text: "Rendre le champ `taux` `public`, pour que le test le voie", correct: false}
      - {text: "Initialiser le champ à `null` explicitement dans sa déclaration", correct: false}
    answer: |-
      ```java
      private final TauxDeTva taux;

      public FactureService(TauxDeTva taux) {
          this.taux = taux;
      }
      // dans le test
      var service = new FactureService(() -> new BigDecimal("1.2"));
      ```
      Hors de Spring, personne ne remplit un champ `@Autowired`. Par constructeur, le test fournit lui-même la
      dépendance, ici un faux taux.
  - key: situation-neuf-dependances
    format: scenario
    question: |-
      Le constructeur de `CommandeService` prend maintenant neuf dépendances. Un collègue propose de passer à
      l'injection par champ, « pour alléger ». Que lui réponds-tu ?
    choices:
      - {text: "Que le constructeur révèle une classe qui en fait trop : il faut la découper", correct: true}
      - {text: "Qu'il a raison : l'injection par champ fait disparaître le problème", correct: false}
      - {text: "Qu'il vaut mieux des setters, plus lisibles qu'un long constructeur", correct: false}
      - {text: "Que Spring refuse les constructeurs de plus de huit paramètres", correct: false}
    answer: |-
      L'injection par champ cacherait le symptôme sans traiter la cause. Neuf collaborateurs, c'est souvent plusieurs
      responsabilités : on extrait des services plus petits, chacun avec peu de dépendances.
  - key: situation-pourquoi-constructeur
    format: scenario
    question: |-
      En entretien : « Pourquoi préfères-tu l'injection par constructeur ? » Quelle réponse est la plus complète ?
    choices:
      - {text: "Dépendances obligatoires et visibles, champs `final`, test sans Spring", correct: true}
      - {text: "Elle est plus rapide à l'exécution que l'injection par champ", correct: false}
      - {text: "C'est la seule forme qui fonctionne avec des interfaces", correct: false}
      - {text: "Elle évite d'annoter la classe avec `@Component`", correct: false}
    answer: |-
      Les trois arguments se tiennent : la signature dit ce dont la classe a besoin, l'objet est immuable et complet
      dès sa création, et un test unitaire le construit avec `new`. Les performances sont les mêmes.
  - key: situation-test-rapide
    format: scenario
    question: |-
      Tu dois écrire un test unitaire rapide pour `FactureService`, qui reçoit un `TauxDeTva` par son constructeur.
      Comment l'écris-tu ?
    choices:
      - {text: "`new FactureService(tauxFixe)` avec une doublure, sans contexte Spring", correct: true}
      - {text: "`@SpringBootTest`, pour que Spring injecte le vrai `TauxDeTva`", correct: false}
      - {text: "Un `new FactureService()`, puis le champ rempli par réflexion", correct: false}
      - {text: "Un `ApplicationContext` statique partagé, d'où l'on lit le bean", correct: false}
    answer: |-
      Le test unitaire construit l'objet lui-même : il tourne en millisecondes et ne dépend que de la classe testée.
      `@SpringBootTest` sert aux tests d'intégration, qui vérifient l'assemblage.
  - key: situation-sms-facultatif
    format: scenario
    question: |-
      Le service de commande doit envoyer un SMS si le module SMS est présent dans l'application, et ne rien faire
      sinon. Comment déclares-tu la dépendance ?
    choices:
      - {text: "Un `ObjectProvider<SmsClient>`, et `ifAvailable(...)` au moment d'envoyer", correct: true}
      - {text: "Un `SmsClient` en paramètre du constructeur, comme toute dépendance", correct: false}
      - {text: "Un champ `static` que le module SMS remplit quand il démarre", correct: false}
      - {text: "Un bloc `try`/`catch` autour d'un `new SmsClient()`", correct: false}
    answer: |-
      ```java
      notificateurs.ifAvailable(sms -> sms.envoyer(numero, message));
      ```
      Un paramètre `SmsClient` ordinaire ferait échouer le démarrage sans module SMS. `ObjectProvider` rend la
      dépendance facultative, sans `null` à tester.
