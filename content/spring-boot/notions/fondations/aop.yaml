notion: aop
lesson: |-
  La **programmation orientée aspect** (AOP) sert aux **préoccupations transverses** : ce qui touche beaucoup de
  classes sans relever de leur métier (transactions, sécurité, cache, mesures, journaux). Au lieu de répéter ce code
  dans chaque méthode, on l'écrit une fois, dans un **aspect**, et on dit où l'appliquer.

  | Terme | Sens |
  |---|---|
  | **aspect** | la classe qui regroupe le code transverse (`@Aspect`) |
  | **conseil** (advice) | le code à exécuter : `@Before`, `@AfterReturning`, `@AfterThrowing`, `@After`, `@Around` |
  | **point de jonction** (join point) | un endroit où l'on peut intervenir ; pour Spring AOP, **l'exécution d'une méthode d'un bean** |
  | **point de coupe** (pointcut) | l'expression qui choisit les points de jonction |
  | **tissage** (weaving) | l'application de l'aspect ; Spring le fait à l'exécution, par **proxy** |

  **Un exemple : mesurer la durée des méthodes annotées `@Chronometre`.**

  ```java
  @Target(ElementType.METHOD)
  @Retention(RetentionPolicy.RUNTIME)
  public @interface Chronometre {}

  @Aspect
  @Component                                   // un aspect doit être un bean
  public class Chronometrage {
      private static final Logger log = LoggerFactory.getLogger(Chronometrage.class);

      @Around("@annotation(com.boutique.Chronometre)")
      public Object mesurer(ProceedingJoinPoint joinPoint) throws Throwable {
          long debut = System.nanoTime();
          try {
              return joinPoint.proceed();      // exécute la méthode, et renvoie son résultat
          } finally {
              log.info("{} : {} ms", joinPoint.getSignature().toShortString(),
                      (System.nanoTime() - debut) / 1_000_000);
          }
      }
  }
  ```

  **Les conseils.** `@Before` s'exécute avant ; `@AfterReturning` après un retour normal ; `@AfterThrowing` après une
  exception ; `@After` **dans tous les cas** (comme un `finally`) ; `@Around` entoure l'appel et **décide** :
  appeler `proceed()` ou non, changer les arguments, le résultat ou l'exception.

  **Les points de coupe courants.**

  | Expression | Sélectionne |
  |---|---|
  | `execution(* com.boutique.service.*.*(..))` | les méthodes des classes du package `service` (pas de ses sous-packages) |
  | `execution(* com.boutique.service..*.*(..))` | ... et de tous ses sous-packages (`..`) |
  | `@annotation(com.boutique.Chronometre)` | les méthodes annotées `@Chronometre` |
  | `within(com.boutique.web..*)` | toutes les méthodes des classes de ces packages |
  | `bean(*Service)` | les beans dont le nom finit par `Service` |

  **Spring AOP contre AspectJ.** Spring AOP utilise la syntaxe d'AspectJ, mais applique les aspects par **proxy** :
  seules les **méthodes de beans** sont interceptées, pas les champs ni les constructeurs, et ni les appels par
  `this`, ni les méthodes `private` ou `final`. AspectJ complet tisse le bytecode, et va plus loin. Dans Spring Boot
  4, le starter s'appelle `spring-boot-starter-aspectj`.

  **Les pièges** : un `@Around` qui oublie `proceed()` (la méthode ne s'exécute jamais) ou oublie de **renvoyer** son
  résultat (l'appelant reçoit `null`) ; un aspect qui n'est pas un bean ; trop d'aspects, qui changent le
  comportement sans que le code le montre. Plusieurs aspects sur la même méthode s'ordonnent par `@Order`.

  **En entretien** : « L'AOP factorise les préoccupations transverses : un aspect, des conseils, et un point de coupe
  qui choisit les méthodes. Spring l'applique par proxy, donc aux seules méthodes publiques des beans, appelées de
  l'extérieur. C'est ce qui fait marcher `@Transactional`, `@Cacheable` ou la sécurité des méthodes. »
cards:
  - key: conseil-around
    format: course
    question: "Quel conseil (advice) peut décider d'exécuter ou non la méthode interceptée, et changer son résultat ?"
    choices:
      - {text: "`@Around`", correct: true}
      - {text: "`@Before`", correct: false}
      - {text: "`@AfterReturning`", correct: false}
      - {text: "`@After`", correct: false}
    answer: "`@Around` reçoit un `ProceedingJoinPoint` : il appelle `proceed()` quand il le veut, ou pas, et renvoie ce qu'il veut."
  - key: points-de-jonction-spring
    format: course
    question: "Quels points de jonction Spring AOP sait-il intercepter ?"
    choices:
      - {text: "Les exécutions de méthodes des beans, à travers leur proxy", correct: true}
      - {text: "Les lectures et les écritures des champs des beans", correct: false}
      - {text: "Les appels aux constructeurs de toutes les classes", correct: false}
      - {text: "Toutes les méthodes de toutes les classes du classpath", correct: false}
    answer: "Le proxy ne voit que les appels de méthodes qui passent par lui. Pour les champs ou les constructeurs, il faut AspectJ complet."
  - key: definition-point-de-coupe
    format: course
    question: "Dans un aspect, à quoi sert un point de coupe (pointcut) ?"
    choices:
      - {text: "À choisir, par une expression, les méthodes à intercepter", correct: true}
      - {text: "À contenir le code exécuté autour de la méthode", correct: false}
      - {text: "À regrouper tous les conseils dans une même classe", correct: false}
      - {text: "À remplacer le bean d'origine dans le conteneur", correct: false}
    answer: "Le point de coupe dit où ; le conseil dit quoi. La classe qui les réunit est l'aspect."
  - key: after-et-afterreturning
    format: course
    question: "Quelle différence entre `@After` et `@AfterReturning` ?"
    choices:
      - {text: "`@After` s'exécute toujours ; `@AfterReturning` seulement après un retour normal", correct: true}
      - {text: "`@After` s'exécute avant la méthode ; `@AfterReturning` après elle", correct: false}
      - {text: "`@After` s'applique aux classes ; `@AfterReturning` aux méthodes", correct: false}
      - {text: "Aucune : ce sont deux noms pour un seul et même conseil", correct: false}
    answer: "`@After` est un `finally` ; `@AfterReturning` voit le résultat, `@AfterThrowing` voit l'exception."
  - key: vf-aspect-doit-etre-bean
    format: true-false
    question: "Une classe annotée `@Aspect` doit aussi être un bean (par exemple avec `@Component`) pour être appliquée par Spring."
    truth: true
    answer: "`@Aspect` vient d'AspectJ et ne déclare pas de bean. Sans `@Component` (ou `@Bean`), Spring ne la connaît pas."
  - key: vf-ecriture-de-champ
    format: true-false
    question: "Spring AOP intercepte l'écriture d'un champ d'un bean."
    truth: false
    answer: "Spring AOP n'intercepte que l'exécution des méthodes, à travers un proxy. Les champs relèvent d'AspectJ complet."
  - key: vf-oubli-de-proceed
    format: true-false
    question: "Dans un conseil `@Around`, oublier d'appeler `proceed()` empêche la méthode cible de s'exécuter."
    truth: true
    answer: "C'est `proceed()` qui appelle la méthode d'origine. Sans lui, le conseil la remplace."
  - key: vf-etoile-et-sous-packages
    format: true-false
    question: "L'expression `execution(* com.boutique.service.*.*(..))` intercepte aussi les classes du package `com.boutique.service.paiement`."
    truth: false
    answer: "`service.*` ne vise que les classes du package lui-même. `service..*` descend dans les sous-packages."
  - key: qcm-viser-une-annotation
    format: multiple-choice
    question: "Quelle expression intercepte toutes les méthodes annotées `@Chronometre` ?"
    choices:
      - {text: "`@annotation(com.boutique.Chronometre)`", correct: true}
      - {text: "`execution(com.boutique.Chronometre)`", correct: false}
      - {text: "`within(com.boutique.Chronometre)`", correct: false}
      - {text: "`bean(com.boutique.Chronometre)`", correct: false}
    answer: "`@annotation(...)` vise les méthodes qui portent l'annotation. `within` vise des types, `bean` des noms de beans."
  - key: qcm-bon-candidat
    format: multiple-choice
    question: "Lequel de ces besoins est un bon candidat pour un aspect ?"
    choices:
      - {text: "Mesurer la durée de toutes les méthodes des services", correct: true}
      - {text: "Calculer le prix d'une commande et de ses remises", correct: false}
      - {text: "Lire les commandes d'un client dans la base de données", correct: false}
      - {text: "Afficher le formulaire d'inscription d'un client", correct: false}
    answer: "La mesure est transverse : identique partout, sans lien avec le métier. Le prix, la lecture ou l'affichage sont le métier lui-même."
  - key: qcm-ordre-des-aspects
    format: multiple-choice
    question: "Comment fixer l'ordre de deux aspects qui s'appliquent à la même méthode ?"
    choices:
      - {text: "Avec `@Order` sur chaque classe d'aspect", correct: true}
      - {text: "Par l'ordre alphabétique des noms des classes", correct: false}
      - {text: "Par l'ordre des méthodes dans la classe cible", correct: false}
      - {text: "Avec `@DependsOn` entre les deux aspects", correct: false}
    answer: "La plus petite valeur d'`@Order` est la plus extérieure : elle entre en premier et sort en dernier."
  - key: qcm-resultat-de-proceed
    format: multiple-choice
    question: "Dans un conseil `@Around`, que renvoie `joinPoint.proceed()` ?"
    choices:
      - {text: "La valeur de retour de la méthode interceptée", correct: true}
      - {text: "La liste des arguments passés à la méthode", correct: false}
      - {text: "Le nom de la méthode interceptée", correct: false}
      - {text: "Toujours `null`, le proxy gardant la valeur", correct: false}
    answer: "Le conseil doit la renvoyer à son tour, sans quoi l'appelant reçoit `null` (ou une erreur pour un type primitif)."
  - key: trous-aspect
    format: fill-in
    question: |-
      Complète pour déclarer la classe comme un aspect :
      ```java
      @___
      @Component
      public class Chronometrage {
          ...
      }
      ```
    blanks:
      - [Aspect]
    answer: "`@Aspect` (de `org.aspectj.lang.annotation`) déclare l'aspect ; `@Component` en fait un bean."
  - key: trous-proceeding-join-point
    format: fill-in
    question: |-
      Complète le type du paramètre d'un conseil `@Around` :
      ```java
      @Around("@annotation(com.boutique.Chronometre)")
      public Object mesurer(___ joinPoint) throws Throwable {
          return joinPoint.proceed();
      }
      ```
    blanks:
      - [ProceedingJoinPoint]
    answer: "Seul `ProceedingJoinPoint` offre `proceed()`. Les autres conseils reçoivent un simple `JoinPoint`."
  - key: trous-proceed
    format: fill-in
    question: |-
      Complète pour exécuter la méthode interceptée et renvoyer son résultat :
      ```java
      long debut = System.nanoTime();
      try {
          return joinPoint.___();
      } finally {
          log.info("{} ms", (System.nanoTime() - debut) / 1_000_000);
      }
      ```
    blanks:
      - [proceed]
    answer: "`proceed()` appelle la méthode d'origine (ou le conseil suivant) et renvoie sa valeur."
  - key: trous-execution
    format: fill-in
    question: |-
      Complète pour intercepter l'exécution de toute méthode des services et de leurs sous-packages :
      ```java
      @Before("___(* com.boutique.service..*.*(..))")
      public void tracer(JoinPoint joinPoint) { ... }
      ```
    blanks:
      - [execution]
    answer: "`execution(...)` décrit des signatures de méthodes : type de retour, package, classe, méthode, paramètres."
  - key: bug-aspect-sans-component
    format: bug-fix
    question: |-
      Aucune durée n'apparaît jamais dans les journaux, alors que des méthodes portent `@Chronometre`. Quelle
      correction est la bonne ?
      ```java
      @Aspect
      public class Chronometrage {
          @Around("@annotation(com.boutique.Chronometre)")
          public Object mesurer(ProceedingJoinPoint joinPoint) throws Throwable { ... }
      }
      ```
    choices:
      - {text: "Ajouter `@Component` sur la classe `Chronometrage`", correct: true}
      - {text: "Remplacer `@Around` par `@Before`", correct: false}
      - {text: "Rendre la méthode `mesurer` `static`", correct: false}
      - {text: "Ajouter `@Primary` sur la classe `Chronometrage`", correct: false}
    answer: |-
      ```java
      @Aspect
      @Component
      public class Chronometrage { ... }
      ```
      `@Aspect` ne crée pas de bean. Spring n'applique que les aspects qu'il connaît comme beans.
  - key: bug-around-sans-retour
    format: bug-fix
    question: |-
      Depuis l'ajout de cet aspect, `stock.quantite("cafe")` lève « AopInvocationException: Null return value from
      advice does not match primitive return type for: public int com.boutique.Stock.quantite(java.lang.String) ».
      Quelle correction est la bonne ?
      ```java
      @Around("execution(* com.boutique.Stock.*(..))")
      public Object tracer(ProceedingJoinPoint joinPoint) throws Throwable {
          log.debug("appel de {}", joinPoint.getSignature());
          joinPoint.proceed();
          return null;
      }
      ```
    choices:
      - {text: "Renvoyer le résultat : `return joinPoint.proceed();`", correct: true}
      - {text: "Remplacer le `return null;` par `return 0;`", correct: false}
      - {text: "Remplacer `@Around` par `@After`, sans autre changement", correct: false}
      - {text: "Changer le type de retour du conseil en `void`", correct: false}
    answer: |-
      ```java
      log.debug("appel de {}", joinPoint.getSignature());
      return joinPoint.proceed();
      ```
      Le conseil remplace la valeur de retour de la méthode : il doit renvoyer celle de `proceed()`. `return 0;`
      ferait disparaître l'exception, mais toutes les quantités vaudraient 0.
  - key: bug-around-sans-proceed
    format: bug-fix
    question: |-
      Depuis l'ajout de cet aspect d'audit, les commandes n'enregistrent plus rien en base, sans aucune erreur.
      Quelle correction est la bonne ?
      ```java
      @Around("execution(* com.boutique.commande.CommandeService.*(..))")
      public Object auditer(ProceedingJoinPoint joinPoint) throws Throwable {
          audit.noter(joinPoint.getSignature().getName());
          return null;
      }
      ```
    choices:
      - {text: "Appeler et renvoyer `joinPoint.proceed()` après l'audit", correct: true}
      - {text: "Appeler `joinPoint.getTarget()` après l'audit", correct: false}
      - {text: "Ajouter `@Order(1)` sur la classe de l'aspect", correct: false}
      - {text: "Lever une exception à la fin du conseil", correct: false}
    answer: |-
      ```java
      audit.noter(joinPoint.getSignature().getName());
      return joinPoint.proceed();
      ```
      Sans `proceed()`, la méthode du service n'est jamais exécutée : l'aspect la remplace. Un simple `@Before`
      aurait suffi pour noter l'appel.
  - key: bug-sous-package-oublie
    format: bug-fix
    question: |-
      Cet aspect trace les services de `com.boutique.service`, mais rien n'apparaît pour
      `com.boutique.service.paiement.PaiementService`. Quelle correction est la bonne ?
      ```java
      @Before("execution(* com.boutique.service.*.*(..))")
      public void tracer(JoinPoint joinPoint) { ... }
      ```
    choices:
      - {text: "`execution(* com.boutique.service..*.*(..))`", correct: true}
      - {text: "`execution(* com.boutique.service.**(..))`", correct: false}
      - {text: "`execution(* com.boutique.service.*.*(*))`", correct: false}
      - {text: "`execution(com.boutique.service.*.*(..))`", correct: false}
    answer: |-
      ```java
      @Before("execution(* com.boutique.service..*.*(..))")
      ```
      `..` dans le nom du package couvre les sous-packages ; `.*` ne vise que le package lui-même. `(*)` limiterait
      aux méthodes à un seul paramètre.
  - key: situation-mesurer-sans-toucher
    format: scenario
    question: |-
      Ton équipe veut connaître la durée de chaque méthode des services, sans toucher à leur code. Que proposes-tu ?
    choices:
      - {text: "Un aspect `@Around` sur un point de coupe qui vise les services", correct: true}
      - {text: "Un `System.nanoTime()` au début et à la fin de chaque méthode", correct: false}
      - {text: "Un filtre de servlet qui mesure chaque méthode des services", correct: false}
      - {text: "Un `@PostConstruct` qui chronomètre les méthodes au démarrage", correct: false}
    answer: |-
      L'aspect s'écrit une fois et s'applique partout. Un filtre de servlet ne mesure que la requête HTTP entière. (En
      production, Micrometer et `@Timed` font ce travail, eux aussi par aspect.)
  - key: situation-aop-en-entretien
    format: scenario
    question: |-
      En entretien : « Qu'est-ce que l'AOP, et où Spring l'utilise-t-il ? » Que réponds-tu ?
    choices:
      - {text: "Factoriser le transverse ; Spring s'en sert pour transactions, sécurité, cache", correct: true}
      - {text: "Remplacer l'héritage par la composition ; Spring s'en sert pour l'injection", correct: false}
      - {text: "Programmer par événements ; Spring s'en sert pour ses écouteurs", correct: false}
      - {text: "Générer du code à la compilation ; Spring s'en sert pour les accesseurs", correct: false}
    answer: |-
      L'AOP sépare le code transverse du code métier. `@Transactional`, `@Cacheable`, `@PreAuthorize` ou `@Async` sont
      des aspects fournis par Spring, appliqués par proxy.
  - key: situation-trop-d-aspects
    format: scenario
    question: |-
      Un projet compte vingt aspects qui modifient en silence le comportement des services. Les nouveaux arrivants
      s'y perdent. Que proposes-tu ?
    choices:
      - {text: "Garder les aspects pour le transverse, ciblés par des annotations visibles", correct: true}
      - {text: "Ajouter d'autres aspects, qui documentent les premiers", correct: false}
      - {text: "Convertir chaque aspect en méthode `@PostConstruct`", correct: false}
      - {text: "Passer tous les services en portée prototype", correct: false}
    answer: |-
      Un aspect ciblé par une annotation (`@Chronometre`, `@Audite`) se voit dans le code de la méthode. Un point de
      coupe large, sur des packages entiers, cache le comportement ; la logique métier n'a rien à faire dans un aspect.
  - key: situation-tva-non-tracee
    format: scenario
    question: |-
      Ton aspect de traçage voit les appels à `calculerPrix()`, mais jamais ceux à `calculerTva()`, que
      `calculerPrix()` appelle dans la même classe. Pourquoi ?
    choices:
      - {text: "L'appel interne passe par `this`, et contourne le proxy", correct: true}
      - {text: "Un aspect ne peut viser qu'une méthode par classe", correct: false}
      - {text: "Les méthodes qui calculent ne sont jamais interceptées", correct: false}
      - {text: "Spring AOP ignore les méthodes dont le nom contient « Tva »", correct: false}
    answer: |-
      Spring AOP repose sur un proxy, qui ne voit que les appels venus de l'extérieur. Pour tracer `calculerTva`, il
      faut l'appeler depuis un autre bean, ou passer au tissage AspectJ.
