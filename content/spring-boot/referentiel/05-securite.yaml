      - {id: sessions-stateless, title: "Sessions, ou une API sans état", level: intermediate, priority: 3, requires: [security-filter-chain], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: tests-securite, title: "Tester la sécurité : @WithMockUser, jwt()", level: intermediate, priority: 3, requires: [autorisations, webmvctest], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
