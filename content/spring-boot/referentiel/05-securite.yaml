# Référentiel Spring Boot : Spring Security. Pas d'exercice : Spring Security n'est pas dans le bac à sable (ADR 0060).
domain: securite
title: Sécurité
position: 50
chapters:
  - id: spring-security
    title: Spring Security
    notions:
      - {id: security-architecture, title: "L'architecture de Spring Security : la chaîne de filtres", level: intermediate, priority: 1, requires: [springbootapplication], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: security-filter-chain, title: "Configurer la sécurité : le bean SecurityFilterChain", level: intermediate, priority: 1, requires: [security-architecture, configuration-bean], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: authentification, title: "L'authentification : UserDetailsService, PasswordEncoder, BCrypt", level: intermediate, priority: 1, requires: [security-filter-chain], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: autorisations, title: "Les autorisations : par URL, et par méthode avec @PreAuthorize", level: intermediate, priority: 1, requires: [security-filter-chain], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: csrf, title: "CSRF : quand le désactiver, quand le garder", level: intermediate, priority: 2, requires: [security-filter-chain], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: jwt-resource-server, title: "Une API protégée par JWT : le resource server OAuth2", level: intermediate, priority: 2, requires: [authentification], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
