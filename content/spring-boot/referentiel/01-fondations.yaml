# Référentiel Spring Boot (ADR 0025, 0026, 0060) : l'inventaire de toutes les notions.
# Le sujet vise Spring Boot 4 et Spring Framework 7, sur Java 25. Pas de « qu'affiche ce code ? » : la CI les exécute
# avec JShell, sans Spring. Pas de Tour : le Tour est réservé aux langages. Les exercices se jugent dans le bac à sable
# Java, qui embarque Spring Boot (ADR 0060).
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats.
domain: fondations
title: Les fondations de Spring
position: 10
chapters:
  - id: conteneur
    title: Le conteneur Spring
    notions:
      - {id: spring-presentation, title: "Ce que sont Spring et Spring Boot, et ce qu'ils apportent", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: inversion-controle, title: "L'inversion de contrôle et le conteneur : ApplicationContext et beans", level: beginner, priority: 1, requires: [spring-presentation], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: injection-dependances, title: "L'injection de dépendances : par constructeur, par setter, par champ", level: beginner, priority: 1, requires: [inversion-controle], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario, exercise], complete: true}
      - {id: stereotypes, title: "@Component, @Service, @Repository, @Controller et le scan des composants", level: beginner, priority: 1, requires: [injection-dependances], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: configuration-bean, title: "@Configuration et @Bean : déclarer un bean à la main", level: beginner, priority: 1, requires: [stereotypes], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: plusieurs-candidats, title: "Plusieurs beans du même type : @Primary, @Qualifier, l'injection d'une liste", level: intermediate, priority: 2, requires: [configuration-bean], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: portees, title: "Les portées des beans : singleton, prototype, request, session", level: intermediate, priority: 2, requires: [stereotypes], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: cycle-de-vie, title: "Le cycle de vie d'un bean : @PostConstruct, @PreDestroy, @Lazy", level: intermediate, priority: 2, requires: [stereotypes], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: dependances-circulaires, title: "Les dépendances circulaires, et pourquoi Spring Boot les refuse", level: intermediate, priority: 3, requires: [injection-dependances], formats: [course, true-false, multiple-choice, bug-fix, scenario], complete: true}
  - id: proxies-aop
    title: Proxies et AOP
    notions:
      - {id: proxies, title: "Les proxies de Spring : ce qui enveloppe un bean annoté", level: intermediate, priority: 1, requires: [stereotypes], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: auto-invocation, title: "L'auto-invocation : pourquoi un appel par this échappe au proxy", level: intermediate, priority: 1, requires: [proxies], formats: [course, true-false, multiple-choice, bug-fix, scenario], complete: true}
      - {id: aop, title: "La programmation orientée aspect : @Aspect, @Around, points de coupe", level: expert, priority: 3, requires: [proxies], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
  - id: evenements
    title: Événements
    notions:
      - {id: evenements-applicatifs, title: "Les événements applicatifs : ApplicationEventPublisher, @EventListener, @TransactionalEventListener", level: intermediate, priority: 3, requires: [stereotypes], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
