      - {id: response-entity, title: "ResponseEntity : le statut, les en-têtes et le corps de la réponse", level: beginner, priority: 1, requires: [rest-controller], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: jackson, title: "Personnaliser le JSON : @JsonProperty, @JsonIgnore, les dates, les records", level: intermediate, priority: 2, requires: [corps-requete], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: versionnement-api, title: "Versionner une API : par l'URI, par un en-tête, avec Spring 7", level: intermediate, priority: 3, requires: [rest-controller], formats: [course, true-false, multiple-choice, scenario], complete: true}
