# Référentiel Spring Boot : démarrer une application, et la configurer.
domain: boot
title: Spring Boot
position: 20
chapters:
  - id: demarrer
    title: Démarrer une application
    notions:
      - {id: spring-boot-apport, title: "Ce que Spring Boot ajoute à Spring : auto-configuration, starters, serveur embarqué", level: beginner, priority: 1, requires: [spring-presentation], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: springbootapplication, title: "@SpringBootApplication et SpringApplication.run", level: beginner, priority: 1, requires: [spring-boot-apport, stereotypes], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: starters, title: "Les starters, et la gestion des versions par spring-boot-dependencies", level: beginner, priority: 1, requires: [spring-boot-apport], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: auto-configuration, title: "L'auto-configuration : les conditions, @ConditionalOnMissingBean, le rapport de conditions", level: intermediate, priority: 1, requires: [springbootapplication, configuration-bean], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: runners, title: "CommandLineRunner et ApplicationRunner : du code au démarrage", level: beginner, priority: 2, requires: [springbootapplication], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: threads-virtuels, title: "Les threads virtuels dans Spring Boot", level: intermediate, priority: 3, requires: [springbootapplication], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: packaging, title: "Le jar exécutable, ses couches, et l'image de conteneur", level: intermediate, priority: 3, requires: [starters], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: aot-native, title: "Le traitement AOT et les images natives GraalVM", level: expert, priority: 4, requires: [packaging, auto-configuration], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
  - id: configuration
    title: Configuration
    notions:
      - {id: proprietes, title: "application.properties et application.yml", level: beginner, priority: 1, requires: [springbootapplication], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: value, title: "@Value : injecter une propriété, avec une valeur par défaut", level: beginner, priority: 1, requires: [proprietes, injection-dependances], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: configuration-properties, title: "@ConfigurationProperties : une configuration typée et validée", level: intermediate, priority: 1, requires: [value], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario, exercise], complete: true}
      - {id: profils, title: "Les profils : application-dev.properties, @Profile, spring.profiles.active", level: beginner, priority: 1, requires: [proprietes], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: ordre-proprietes, title: "L'ordre des sources de configuration : arguments, variables d'environnement, fichiers", level: intermediate, priority: 2, requires: [proprietes], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: secrets, title: "Les secrets : jamais dans le dépôt, variables d'environnement et coffres", level: intermediate, priority: 2, requires: [ordre-proprietes], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: journalisation, title: "La journalisation : SLF4J, Logback, les niveaux par package", level: beginner, priority: 2, requires: [proprietes], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
