      - {id: relations, title: "Les relations : @ManyToOne, @OneToMany, le côté propriétaire", level: intermediate, priority: 1, requires: [jpa-entites], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
