notion: quarkus-test
lesson: |-
  `@QuarkusTest` teste l'application **telle qu'elle tourne** : les beans CDI, la configuration, la base, les
  ressources REST. C'est l'équivalent de `@SpringBootTest` dans Spring.

  ```xml
  <dependency>
      <groupId>io.quarkus</groupId>
      <artifactId>quarkus-junit</artifactId>
      <scope>test</scope>
  </dependency>
  <dependency>
      <groupId>io.rest-assured</groupId>
      <artifactId>rest-assured</artifactId>
      <scope>test</scope>
  </dependency>
  ```

  L'artefact s'appelait `quarkus-junit5` : il est renommé `quarkus-junit` dans les versions récentes. Les tests
  s'écrivent avec JUnit (Jupiter) et se lancent par `./mvnw test`, ou en continu depuis `quarkus dev`.

  ```java
  @QuarkusTest
  class PrixServiceTest {

      @Inject
      PrixService prix;

      @Test
      void appliqueLaTva() {
          assertEquals(120, prix.ttc(100));
      }
  }
  ```

  **Ce que fait l'annotation.**

  - Elle **démarre l'application une seule fois**, avant le premier test, et la garde pour toutes les classes
    `@QuarkusTest` de l'exécution. Elle ne la redémarre que si une classe change de profil de test
    (`@TestProfile`) ou de ressources de test.
  - L'application écoute sur le port **8081** (`quarkus.http.test-port`), pas sur le 8080 du mode dev ; avec
    `quarkus.http.test-port=0`, elle prend un port libre. RestAssured est réglé d'office sur cette adresse.
  - Le profil **`test`** est actif : les lignes `%test.` de `application.properties` s'appliquent. Les Dev
    Services démarrent aussi, s'ils ne trouvent pas d'URL configurée.
  - La classe de test reçoit ses champs `@Inject`, comme un bean. Une méthode de test peut même porter une
    annotation d'intercepteur, comme `@Transactional`.

  **Ce qu'elle ne fait pas.** Elle ne lance pas l'artefact construit : l'application démarre dans la JVM des
  tests. Pour tester le jar ou l'exécutable natif, il y a `@QuarkusIntegrationTest`.

  | Je veux tester | J'écris |
  |---|---|
  | une règle de calcul, sans dépendance | un test JUnit ordinaire, sans Quarkus |
  | un bean avec ses dépendances réelles | `@QuarkusTest` et `@Inject` |
  | une ressource REST de bout en bout | `@QuarkusTest` et RestAssured |
  | l'artefact livré (jar, natif) | `@QuarkusIntegrationTest` |

  **Les pièges.**

  - Oublier `@QuarkusTest` : rien ne démarre. Les champs `@Inject` restent `null`, et RestAssured frappe à
    `localhost:8080`, où personne ne répond (`Connection refused`).
  - Créer le bean à tester avec `new` : ses propres `@Inject` restent `null`. Le conteneur seul les remplit.
  - Une propriété qui n'existe qu'en `%dev.` manque en test : l'application refuse de démarrer.
  - Mettre `@QuarkusTest` partout : chaque classe paie le démarrage, au moins une fois. La logique pure se teste
    sans Quarkus, en quelques millisecondes.

  **En entretien** : « `@QuarkusTest` démarre l'application une fois, dans le profil `test` et sur le port 8081,
  et la partage entre les classes de test ; j'y injecte les beans avec `@Inject` et j'appelle les ressources avec
  RestAssured. Elle ne redémarre que pour un autre profil ou d'autres ressources de test. Je garde des tests
  unitaires sans Quarkus pour la logique pure, et `@QuarkusIntegrationTest` pour l'artefact construit. »
cards:
  - key: ce-que-demarre-quarkustest
    format: course
    question: "Que fait l'annotation `@QuarkusTest` posée sur une classe de test ?"
    choices:
      - {text: "Elle démarre l'application une fois, partagée entre les classes de test", correct: true}
      - {text: "Elle démarre une nouvelle application avant chaque méthode de test", correct: false}
      - {text: "Elle compile l'application en natif avant de lancer les tests", correct: false}
      - {text: "Elle simule les beans de l'application, sans démarrer de serveur", correct: false}
    answer: "L'application démarre avant le premier test et sert à toutes les classes `@QuarkusTest` de l'exécution. Elle ne redémarre que si une classe change de profil de test ou de ressources de test."
  - key: port-des-tests
    format: course
    question: "Sur quel port l'application écoute-t-elle pendant un `@QuarkusTest`, par défaut ?"
    choices:
      - {text: "8081, réglé par `quarkus.http.test-port`", correct: true}
      - {text: "8080, le même port qu'en mode dev", correct: false}
      - {text: "9000, le port de l'interface de gestion", correct: false}
      - {text: "Un port tiré au hasard à chaque démarrage", correct: false}
    answer: "Les tests écoutent sur 8081, pour ne pas gêner une application lancée en mode dev sur 8080. Avec `quarkus.http.test-port=0`, Quarkus prend un port libre ; RestAssured suit dans tous les cas."
  - key: profil-actif-en-test
    format: course
    question: "Quel profil de configuration est actif pendant un `@QuarkusTest` ?"
    choices:
      - {text: "`test` : les lignes préfixées par `%test.` s'appliquent", correct: true}
      - {text: "`dev` : les mêmes réglages que sous `quarkus dev`", correct: false}
      - {text: "`prod` : la configuration livrée, sans aucun préfixe", correct: false}
      - {text: "Aucun : seules les lignes sans préfixe sont lues", correct: false}
    answer: "Le profil `test` est actif : une ligne `%test.` l'emporte sur la même propriété sans préfixe, et les lignes `%dev.` ou `%prod.` sont ignorées."
  - key: obtenir-un-bean-dans-le-test
    format: course
    question: "Comment ton `@QuarkusTest` obtient-il le bean `PrixService` de l'application, avec ses dépendances ?"
    choices:
      - {text: "Par un champ `@Inject PrixService prix` dans la classe de test", correct: true}
      - {text: "En l'instanciant avec `new PrixService()` dans le test", correct: false}
      - {text: "Par un champ `@Mock PrixService prix` de Mockito", correct: false}
      - {text: "Par un champ `@Autowired PrixService prix`, comme Spring", correct: false}
    answer: "La classe de test reçoit ses champs `@Inject` du conteneur. Avec `new`, les dépendances du service restent `null` ; `@Mock` donne un faux objet ; `@Autowired` n'existe pas dans Quarkus sans l'extension de compatibilité Spring."
  - key: vf-application-partagee
    format: true-false
    question: "Les classes `@QuarkusTest` d'une même exécution partagent la même application démarrée, tant qu'elles ont le même profil de test et les mêmes ressources de test."
    truth: true
    answer: "Quarkus démarre l'application une fois et la réutilise. Un `@TestProfile` ou une ressource de test différente impose un redémarrage : c'est ce qui coûte cher."
  - key: vf-artefact-construit
    format: true-false
    question: "Un `@QuarkusTest` lance le jar construit dans `target/`, comme on le lancerait en production."
    truth: false
    answer: "`@QuarkusTest` démarre l'application dans la JVM des tests, à partir des classes compilées. C'est `@QuarkusIntegrationTest` qui lance l'artefact construit : jar, exécutable natif ou image."
  - key: vf-test-sans-annotation
    format: true-false
    question: "Une classe de test JUnit sans `@QuarkusTest` reçoit quand même ses champs `@Inject`."
    truth: false
    answer: "Sans `@QuarkusTest`, aucun conteneur ne démarre : JUnit crée la classe de test avec `new`, et les champs `@Inject` restent `null`."
  - key: vf-logique-pure-sans-quarkus
    format: true-false
    question: "Une règle de calcul sans dépendance se teste mieux par un test JUnit ordinaire que par un `@QuarkusTest`."
    truth: true
    answer: "Le test ordinaire s'exécute en quelques millisecondes, sans démarrer l'application. `@QuarkusTest` sert à vérifier l'assemblage : beans, configuration, base, HTTP."
  - key: qcm-dependances-de-test
    format: multiple-choice
    question: "Quelles dépendances ajoutes-tu pour écrire un `@QuarkusTest` qui appelle l'API en HTTP ?"
    choices:
      - {text: "`quarkus-junit` et `rest-assured`, en portée `test`", correct: true}
      - {text: "`spring-boot-starter-test`, qui embarque JUnit et Mockito", correct: false}
      - {text: "`quarkus-rest-client`, pour appeler l'API depuis le test", correct: false}
      - {text: "`junit-jupiter` seul : Quarkus fournit déjà RestAssured", correct: false}
    answer: "`quarkus-junit` apporte `@QuarkusTest` et JUnit ; `rest-assured` écrit les appels HTTP et leurs vérifications. Le REST Client sert à appeler d'autres services, pas à tester sa propre API."
  - key: qcm-demarrages-pour-trente-classes
    format: multiple-choice
    question: "Combien de fois l'application démarre-t-elle pour 30 classes `@QuarkusTest`, sans profil ni ressource de test particulière ?"
    choices:
      - {text: "Une fois, au premier test, pour toute l'exécution", correct: true}
      - {text: "30 fois : une fois par classe de test", correct: false}
      - {text: "Une fois par méthode de test, pour isoler les tests", correct: false}
      - {text: "Jamais : `@QuarkusTest` n'en démarre aucune", correct: false}
    answer: "Le démarrage est partagé. C'est pour cela qu'un état laissé par un test (une ligne en base, un compteur) peut gêner les suivants : chaque test crée ses propres données."
  - key: qcm-propriete-pour-les-tests
    format: multiple-choice
    question: "Dans `application.properties`, quelle ligne fixe `prix.tva` pour les seuls tests ?"
    choices:
      - {text: "`%test.prix.tva=0.2`", correct: true}
      - {text: "`test.prix.tva=0.2`", correct: false}
      - {text: "`prix.tva[test]=0.2`", correct: false}
      - {text: "`@test.prix.tva=0.2`", correct: false}
    answer: "Le préfixe `%profil.` limite une ligne à un profil. `test.prix.tva` serait une autre propriété, qui n'a rien à voir avec le profil."
  - key: qcm-restassured-sans-adresse
    format: multiple-choice
    question: "Ton test écrit `given().get(\"/produits\")`, sans hôte ni port. Pourquoi la requête arrive-t-elle à l'application ?"
    choices:
      - {text: "`@QuarkusTest` règle RestAssured sur l'adresse de l'application de test", correct: true}
      - {text: "RestAssured lit `quarkus.http.port` dans `application.properties`", correct: false}
      - {text: "Le test appelle la méthode Java de la ressource, sans passer par HTTP", correct: false}
      - {text: "JUnit redirige les requêtes du test vers `localhost:8080`", correct: false}
    answer: "Au démarrage, Quarkus donne à RestAssured le port de test (8081 par défaut). La requête passe bien par HTTP : filtres, sérialisation JSON et validation compris."
  - key: trous-annotation-de-classe
    format: fill-in
    question: |-
      Complète pour que l'application démarre avant les tests de cette classe :
      ```java
      @___
      class ProduitResourceTest {
      ```
    blanks:
      - [QuarkusTest]
    answer: "`@QuarkusTest` (paquet `io.quarkus.test.junit`) démarre l'application dans le profil `test`."
  - key: trous-injection-dans-le-test
    format: fill-in
    question: |-
      Complète pour recevoir le bean de l'application dans le test :
      ```java
      @QuarkusTest
      class PrixServiceTest {

          @___
          PrixService prix;
      ```
    blanks:
      - [Inject]
    answer: "`@Inject` : la classe de test reçoit ses dépendances du conteneur, comme un bean."
  - key: trous-prefixe-de-profil
    format: fill-in
    question: |-
      Complète pour que la ligne ne vaille que pendant les tests :
      ```properties
      ___.paiement.url=http://localhost:9090
      ```
    blanks:
      - ["%test"]
    answer: "`%test.` limite la propriété au profil `test`, actif pendant un `@QuarkusTest`."
  - key: trous-artefact-de-test
    format: fill-in
    question: |-
      Complète la dépendance qui apporte `@QuarkusTest` :
      ```xml
      <artifactId>___</artifactId>
      <scope>test</scope>
      ```
    blanks:
      - [quarkus-junit]
    answer: "`quarkus-junit`, l'ancien `quarkus-junit5` renommé dans les versions récentes de Quarkus."
  - key: bug-champ-inject-null
    format: bug-fix
    question: |-
      Ce test échoue sur `NullPointerException: Cannot invoke "PrixService.ttc(int)" because "this.prix" is null`.
      Quelle correction est la bonne ?
      ```java
      class PrixServiceTest {

          @Inject
          PrixService prix;

          @Test
          void appliqueLaTva() {
              assertEquals(120, prix.ttc(100));
          }
      }
      ```
    choices:
      - {text: "Annoter la classe de test avec `@QuarkusTest`", correct: true}
      - {text: "Déclarer le champ `prix` en `public`", correct: false}
      - {text: "Annoter la classe de test avec `@ApplicationScoped`", correct: false}
      - {text: "Remplacer `@Inject` par `@Mock` sur le champ", correct: false}
    answer: |-
      ```java
      @QuarkusTest
      class PrixServiceTest {
      ```
      Sans `@QuarkusTest`, aucun conteneur ne démarre et personne ne remplit le champ. `@ApplicationScoped` sur la
      classe de test n'y change rien : JUnit la crée lui-même ; `@Mock` donnerait un faux service, et resterait
      `null` sans extension Mockito.
  - key: bug-service-cree-avec-new
    format: bug-fix
    question: |-
      Ce test échoue sur `NullPointerException: ... because "this.tva" is null`, levée dans `CommandeService`, qui
      reçoit `TvaCalculateur` par un champ `@Inject`. Quelle correction est la bonne ?
      ```java
      @QuarkusTest
      class CommandeServiceTest {

          @Test
          void calculeLeTotal() {
              CommandeService service = new CommandeService();
              assertEquals(36, service.total(List.of(10, 20)));
          }
      }
      ```
    choices:
      - {text: "Injecter `CommandeService` par un champ `@Inject` du test", correct: true}
      - {text: "Ajouter `@QuarkusTest` sur la classe `CommandeService`", correct: false}
      - {text: "Rendre le champ `tva` de `CommandeService` statique", correct: false}
      - {text: "Annoter la méthode de test avec `@Transactional`", correct: false}
    answer: |-
      ```java
      @Inject
      CommandeService service;

      @Test
      void calculeLeTotal() {
          assertEquals(36, service.total(List.of(10, 20)));
      }
      ```
      Un objet créé par `new` échappe au conteneur : ses champs `@Inject` restent `null`, même dans un
      `@QuarkusTest`. Le bean injecté, lui, a toutes ses dépendances.
  - key: bug-propriete-seulement-en-dev
    format: bug-fix
    question: |-
      L'application tourne sous `quarkus dev`, mais chaque `@QuarkusTest` échoue au démarrage : « SRCFG00014: The
      config property paiement.url is required but it could not be found in any config source ». Quelle correction
      est la bonne ?
      ```properties
      %dev.paiement.url=http://localhost:9090
      ```
    choices:
      - {text: "Ajouter `%test.paiement.url=...`, ou une valeur sans préfixe", correct: true}
      - {text: "Renommer la ligne en `dev.paiement.url`, sans le `%`", correct: false}
      - {text: "Lancer les tests en continu depuis `quarkus dev`", correct: false}
      - {text: "Déplacer la ligne dans `src/main/resources/META-INF`", correct: false}
    answer: |-
      ```properties
      %dev.paiement.url=http://localhost:9090
      %test.paiement.url=http://localhost:9091
      ```
      Les tests tournent dans le profil `test`, qui ignore les lignes `%dev.`. Même lancés depuis `quarkus dev`, les
      tests continus utilisent le profil `test`.
  - key: bug-connexion-refusee
    format: bug-fix
    question: |-
      Ce test échoue sur `java.net.ConnectException: Connection refused`. Quelle correction est la bonne ?
      ```java
      class ProduitResourceTest {

          @Test
          void listeLesProduits() {
              given().when().get("/produits").then().statusCode(200);
          }
      }
      ```
    choices:
      - {text: "Annoter la classe avec `@QuarkusTest`, qui démarre l'application", correct: true}
      - {text: "Écrire l'URL complète, `http://localhost:8080/produits`", correct: false}
      - {text: "Ajouter `.contentType(ContentType.JSON)` avant `when()`", correct: false}
      - {text: "Lancer `quarkus dev` dans un autre terminal pendant les tests", correct: false}
    answer: |-
      ```java
      @QuarkusTest
      class ProduitResourceTest {
      ```
      Sans `@QuarkusTest`, aucune application ne démarre, et RestAssured frappe à son adresse par défaut,
      `localhost:8080`, où rien n'écoute. Compter sur un `quarkus dev` lancé à côté rendrait le test dépendant de la
      machine.
