notion: questions-classiques
lesson: |-
  Quelques questions sur Quarkus reviennent dans presque tous les entretiens. Elles vérifient que tu comprends **ce
  que Quarkus fait autrement**, surtout au build, et pas que tu connais toutes ses extensions. Pour chacune, la
  réponse attendue, en deux ou trois phrases.

  **« Qu'est-ce que Quarkus, et pourquoi démarre-t-il si vite ? »**
  Un framework Java pour le cloud et les conteneurs. Il fait **au build** ce que d'autres frameworks font à chaque
  démarrage : lire les annotations (avec l'index Jandex), analyser la configuration, câbler les beans, préparer
  Hibernate, générer le bytecode utile. Au démarrage, il reste peu à faire, et peu de réflexion : démarrage rapide,
  mémoire faible, et une compilation native possible.

  **« Qu'est-ce qu'une extension ? »**
  Un module qui intègre une bibliothèque **au build** : une partie *deployment*, exécutée pendant la construction, et une
  partie *runtime*. C'est elle qui rend la bibliothèque compatible avec le natif et la branche aux Dev Services.

  **« Comment marche l'injection de dépendances ? »**
  CDI, implémenté par **ArC**, qui résout les injections **au build** : une dépendance manquante ou ambiguë arrête le
  build. Les beans `@ApplicationScoped` sont créés à la première utilisation, derrière un client proxy ; les beans
  inutilisés sont retirés.

  **« Quarkus est-il réactif ou impératif ? »**
  Les deux. Le cœur est réactif (Vert.x et sa boucle d'événements) ; le code impératif s'exécute sur des **threads de
  travail**, ou des threads virtuels avec `@RunOnVirtualThread`. Un endpoint qui renvoie un `Uni` s'exécute sur la
  boucle d'événements : il ne doit jamais bloquer.

  **« Qu'apporte Quarkus au développeur ? »**
  Le **mode dev** (rechargement à chaud, Dev UI), les **Dev Services** (une base, un Keycloak, un Kafka démarrés
  d'office dans des conteneurs) et les **tests continus**.

  **« Comment gères-tu la configuration ? »**
  MicroProfile Config : `application.properties`, des profils (`%dev.`, `%test.`, `%prod.`), des variables
  d'environnement en production, `@ConfigProperty` ou `@ConfigMapping`. Certaines propriétés sont **fixées au build**.

  **« Comment testes-tu, comment livres-tu ? »**
  `@QuarkusTest` et RestAssured, `@InjectMock`, les Dev Services pour une vraie base, `@QuarkusIntegrationTest` pour
  l'artefact. Un fast-jar ou un exécutable natif, une image construite par Jib, des sondes SmallRye Health et des
  métriques Micrometer.

  | Question | Le mot-clé de la réponse |
  |---|---|
  | pourquoi rapide | le travail est fait au build |
  | extension | intégration au build, natif compris |
  | injection | ArC, résolue au build |
  | réactif ou impératif | Vert.x, boucle d'événements, threads de travail |
  | expérience de développement | mode dev, Dev Services, tests continus |
  | standards | Jakarta EE (CDI, REST, JPA) et MicroProfile |

  **La forme d'une bonne réponse** : une définition courte, le **mécanisme** (le build, le proxy, la boucle
  d'événements), un exemple tiré de ton expérience, et le **piège** associé. Sur une comparaison avec Spring Boot,
  reste nuancé : les deux sont solides, Quarkus gagne surtout au démarrage et en mémoire.

  **En entretien** : « Quarkus fait au build ce que d'autres frameworks font au démarrage : l'index des classes, la
  configuration, le câblage des beans par ArC. D'où un démarrage rapide, une mémoire faible et le natif. Il repose sur
  des standards (CDI, Jakarta REST, MicroProfile), avec un cœur réactif Vert.x qui accepte aussi le code impératif. »
cards:
  - key: pourquoi-rapide
    format: course
    question: "Que répondre à « Pourquoi Quarkus démarre-t-il si vite ? »"
    choices:
      - {text: "Il fait au build ce que d'autres font au démarrage : scan, configuration, câblage", correct: true}
      - {text: "Il démarre en natif dans tous les cas, même lancé avec `java -jar`", correct: false}
      - {text: "Il charge ses beans à la demande, après la réponse à la première requête", correct: false}
      - {text: "Il désactive le ramasse-miettes de la JVM pendant les premières secondes", correct: false}
    answer: "L'augmentation au build lit les annotations (index Jandex), prépare la configuration, câble les beans et génère du bytecode. Au démarrage, il reste peu à faire et peu de réflexion."
  - key: definition-d-une-extension
    format: course
    question: "Que répondre à « Qu'est-ce qu'une extension Quarkus ? »"
    choices:
      - {text: "Un module qui intègre une bibliothèque au build, natif compris", correct: true}
      - {text: "Un greffon téléchargé par l'application au démarrage", correct: false}
      - {text: "Une bibliothèque Java ordinaire, renommée pour Quarkus", correct: false}
      - {text: "Un fichier de configuration partagé entre plusieurs projets", correct: false}
    answer: "Une extension a une partie *deployment*, exécutée au build, et une partie *runtime*. C'est elle qui prépare la bibliothèque, la déclare au natif et la branche aux Dev Services."
  - key: reactif-ou-imperatif
    format: course
    question: "Que répondre à « Quarkus est-il réactif ou impératif ? »"
    choices:
      - {text: "Les deux : un cœur Vert.x réactif, et le code bloquant sur des threads de travail", correct: true}
      - {text: "Réactif seulement : tout le code doit renvoyer des `Uni` ou des `Multi`", correct: false}
      - {text: "Impératif seulement : la programmation réactive demande Spring WebFlux", correct: false}
      - {text: "Ni l'un ni l'autre : chaque requête a son propre processus système", correct: false}
    answer: "La boucle d'événements de Vert.x sert les entrées-sorties ; un endpoint ordinaire tourne sur un thread de travail, ou un thread virtuel, et peut bloquer. Un endpoint qui renvoie un `Uni` ne le peut pas."
  - key: injection-et-build
    format: course
    question: "Que répondre à « Qu'a de particulier l'injection de dépendances de Quarkus ? »"
    choices:
      - {text: "ArC la résout au build : une dépendance manquante arrête le build", correct: true}
      - {text: "Elle n'existe pas : Quarkus demande de créer les objets avec `new`", correct: false}
      - {text: "Elle repose sur Spring, embarqué dans chaque application Quarkus", correct: false}
      - {text: "Elle se fait par réflexion à chaque requête, pour plus de souplesse", correct: false}
    answer: "ArC implémente CDI au build : les erreurs d'injection apparaissent avant tout démarrage, et les beans inutilisés sont retirés. Peu de réflexion, ce qui sert aussi le natif."
  - key: vf-injection-au-build
    format: true-false
    question: "Dans Quarkus, une dépendance qu'aucun bean ne peut satisfaire est signalée au build, pas à la première requête."
    truth: true
    answer: "ArC valide le graphe des beans pendant la construction : l'application ne démarre même pas avec une injection impossible."
  - key: vf-natif-obligatoire
    format: true-false
    question: "Quarkus ne fonctionne qu'en natif : il faut GraalVM pour lancer une application Quarkus."
    truth: false
    answer: "Le mode JVM est le mode courant, avec un démarrage déjà rapide. Le natif est une option, pour quand le démarrage et la mémoire comptent le plus."
  - key: vf-endpoint-ordinaire
    format: true-false
    question: "Un endpoint Quarkus REST qui renvoie un type ordinaire, pas un `Uni`, s'exécute par défaut sur un thread de travail, où il peut bloquer."
    truth: true
    answer: "Quarkus REST choisit le thread d'après la signature : une méthode ordinaire part sur un thread de travail, une méthode qui renvoie un `Uni` reste sur la boucle d'événements."
  - key: vf-aucun-standard
    format: true-false
    question: "Quarkus n'utilise que des API qui lui sont propres : on n'y retrouve aucune API standard de Java."
    truth: false
    answer: "Quarkus s'appuie sur Jakarta EE (CDI, REST, Persistence, Validation) et MicroProfile (Config, Health, Fault Tolerance, REST Client). Ses propres API complètent ces standards."
  - key: qcm-argument-serverless
    format: multiple-choice
    question: "Quel argument avances-tu pour Quarkus sur une plateforme serverless ?"
    choices:
      - {text: "Un démarrage rapide et une mémoire faible, surtout en natif", correct: true}
      - {text: "Un débit de pointe toujours supérieur à celui des autres frameworks", correct: false}
      - {text: "L'absence totale de configuration à écrire pour la production", correct: false}
      - {text: "Une compatibilité complète avec toutes les bibliothèques Spring", correct: false}
    answer: "En serverless, chaque démarrage à froid se voit et la mémoire se paie : c'est là que Quarkus gagne le plus. Le débit de pointe dépend de la charge, et se mesure."
  - key: qcm-experience-developpeur
    format: multiple-choice
    question: "Que réponds-tu à « Qu'apporte Quarkus au quotidien du développeur ? »"
    choices:
      - {text: "Le mode dev, les Dev Services et les tests continus", correct: true}
      - {text: "Un IDE propre, obligatoire pour développer avec Quarkus", correct: false}
      - {text: "Un générateur de code métier à partir de la base de données", correct: false}
      - {text: "Un serveur d'applications à installer sur chaque poste", correct: false}
    answer: "Rechargement à chaud et Dev UI, conteneurs démarrés d'office pour la base ou Keycloak, tests relancés à chaque modification : la boucle de développement est courte."
  - key: qcm-beans-inutilises
    format: multiple-choice
    question: "Que deviennent, dans Quarkus, les beans que rien n'injecte ni n'observe ?"
    choices:
      - {text: "Ils sont retirés au build, sauf s'ils sont marqués `@Unremovable`", correct: true}
      - {text: "Ils sont créés au démarrage, comme tous les autres beans", correct: false}
      - {text: "Ils sont créés à chaque requête, puis détruits aussitôt", correct: false}
      - {text: "Ils font échouer le build, pour signaler du code mort", correct: false}
    answer: "Le retrait des beans inutilisés allège l'application. Un bean seulement cherché par programme (`CDI.current().select(...)`) doit être gardé par `@Unremovable`."
  - key: qcm-configuration-par-environnement
    format: multiple-choice
    question: "Que réponds-tu à « Comment as-tu une configuration différente en dev et en production ? »"
    choices:
      - {text: "Des profils `%dev.` et `%prod.`, et des variables d'environnement en production", correct: true}
      - {text: "Un projet Maven par environnement, chacun avec ses propres classes", correct: false}
      - {text: "Des `if` sur le nom de la machine, dans une classe de configuration", correct: false}
      - {text: "Un fichier par développeur, versionné à côté de `application.properties`", correct: false}
    answer: "MicroProfile Config combine les profils et plusieurs sources : la production reçoit ses valeurs par l'environnement. Les propriétés fixées au build, elles, demandent de reconstruire."
  - key: situation-pourquoi-quarkus
    format: scenario
    question: |-
      Le recruteur te demande : « Pourquoi ton équipe a-t-elle choisi Quarkus plutôt que Spring Boot ? ». Comment
      réponds-tu ?
    choices:
      - {text: "Par nos contraintes et nos mesures : démarrage, mémoire, coût des pods", correct: true}
      - {text: "En expliquant que Spring Boot est dépassé et qu'il faut l'abandonner", correct: false}
      - {text: "En répondant que c'était une décision de la direction, sans plus", correct: false}
      - {text: "En récitant la liste complète des extensions de Quarkus", correct: false}
    answer: |-
      Une bonne réponse part d'un besoin réel (des dizaines de petits services sur Kubernetes, des démarrages
      fréquents) et de mesures, puis reconnaît les forces de l'autre choix. Dénigrer Spring Boot fait douter du
      jugement.
  - key: situation-question-inconnue
    format: scenario
    question: |-
      On te demande comment fonctionne une extension Quarkus que tu n'as jamais utilisée. Que fais-tu ?
    choices:
      - {text: "Je le dis, puis je raisonne à partir de ce que je sais des extensions", correct: true}
      - {text: "J'invente une réponse plausible, pour ne pas montrer de faiblesse", correct: false}
      - {text: "Je réponds que ce genre de détail se trouve dans la documentation", correct: false}
      - {text: "Je change de sujet vers une extension que je connais bien", correct: false}
    answer: |-
      Dire « je ne l'ai pas utilisée » puis raisonner (une partie au build, une partie à l'exécution, sa configuration
      sous `quarkus.`) montre la compréhension. Une invention se repère, et coûte plus cher qu'un aveu.
  - key: situation-plus-rapide-que-spring
    format: scenario
    question: |-
      On te demande : « Quarkus est-il plus rapide que Spring Boot ? ». Que réponds-tu ?
    choices:
      - {text: "Au démarrage et en mémoire, souvent oui ; en débit, ça dépend et ça se mesure", correct: true}
      - {text: "Oui, sur tous les plans, et dans toutes les situations possibles", correct: false}
      - {text: "Non, les deux frameworks ont exactement les mêmes performances", correct: false}
      - {text: "Oui, parce que Quarkus n'utilise pas la JVM, même en mode jar", correct: false}
    answer: |-
      La différence nette porte sur le démarrage et la mémoire, grâce au travail fait au build et au natif. Sous charge
      continue, les écarts de débit dépendent de l'application : on les mesure plutôt que de les affirmer.
  - key: situation-incident-a-raconter
    format: scenario
    question: |-
      On te demande de raconter un problème de production que tu as résolu avec Quarkus. Comment construis-tu ta
      réponse ?
    choices:
      - {text: "Le symptôme, le diagnostic, la cause, la correction, puis ce que j'ai changé pour la suite", correct: true}
      - {text: "La correction seulement : le reste n'intéresse pas un recruteur", correct: false}
      - {text: "Les noms des collègues responsables de l'erreur, pour être transparent", correct: false}
      - {text: "Un problème inventé mais spectaculaire, plus mémorable qu'un vrai", correct: false}
    answer: |-
      Par exemple : des latences, un avertissement « has been blocked » dans les journaux, un appel bloquant sur la
      boucle d'événements, déplacé sur un thread de travail, puis un test et une règle de revue. La démarche compte plus
      que l'incident.
