notion: panache-requetes
lesson: |-
  Panache écrit pour toi la partie répétitive des requêtes HQL (le langage de requêtes d'Hibernate, proche de JPQL) :
  tu ne donnes que l'essentiel, et les valeurs à part. Les mêmes formes valent en active record (`Produit.find(...)`)
  et en repository (`produits.find(...)`).

  **1. Les formes abrégées.**

  | Tu écris | Panache exécute |
  |---|---|
  | `find("nom", nom)` | `from Produit where nom = ?1` |
  | `find("prix < ?1 and stock > ?2", 10, 0)` | `from Produit where prix < ?1 and stock > ?2` |
  | `find("order by nom")` | `from Produit order by nom` |
  | `find("from Produit p where ...")` | la requête telle quelle |

  **2. Les paramètres : jamais de concaténation.** Positionnels (`?1`, `?2`) ou nommés :

  ```java
  Produit.find("categorie = :categorie and prix <= :max",
          Parameters.with("categorie", categorie).and("max", max));
  ```

  Concaténer une valeur dans la requête ouvre la porte à l'injection, et casse au premier guillemet :
  `"nom = '" + nom + "'"` avec `L'Oréal` lève une `SyntaxException`.

  **3. Le tri.** `Sort.by("prix").descending().and("nom")` ajoute `order by prix desc, nom`. Il se passe en deuxième
  argument :

  ```java
  List<Produit> produits = Produit.list("categorie", Sort.by("prix"), categorie);
  ```

  **4. `find` renvoie une `PanacheQuery`, `list` une `List`.** La `PanacheQuery` se termine par :

  | Méthode | Résultat |
  |---|---|
  | `list()`, `stream()` | tous les résultats |
  | `firstResult()` | le premier, ou `null` |
  | `firstResultOptional()` | le premier, dans un `Optional` |
  | `singleResult()` | l'unique résultat ; `NoResultException` s'il n'y en a aucun, `NonUniqueResultException` s'il y en a plusieurs |
  | `singleResultOptional()` | l'unique résultat, dans un `Optional` |
  | `count()` | le nombre de résultats |

  `list(...)`, `stream(...)` et `count(...)` existent aussi en raccourci : `Produit.count("stock", 0)`.

  **5. Modifier en masse.** `delete(...)` renvoie le nombre de lignes supprimées, `update(...)` le nombre de lignes
  modifiées. Comme toute écriture, elles exigent une transaction : « No active transaction for update or delete
  query ».

  ```java
  @Transactional
  public int solder(String categorie) {
      return Produit.update("prix = prix / 2 where categorie = ?1", categorie);
  }
  ```

  **6. Les requêtes nommées.** Une requête déclarée sur l'entité par `@NamedQuery(name = "Produit.enRupture", query =
  "from Produit where stock = 0")` s'appelle avec un dièse : `Produit.list("#Produit.enRupture")`. Hibernate la
  vérifie au démarrage.

  **En entretien** : « Panache complète mes requêtes HQL : un nom de champ suffit pour une égalité, sinon j'écris la
  clause `where`, avec des paramètres positionnels ou nommés, jamais de concaténation. `find` renvoie une
  `PanacheQuery` que je termine par `list`, `firstResultOptional` ou `count`, et `Sort` ajoute le tri. Les `update` et
  `delete` en masse renvoient le nombre de lignes touchées, dans une transaction. »
cards:
  - key: forme-abregee
    format: course
    question: "Quelle requête Panache exécute-t-il pour `Produit.find(\"nom\", nom)` ?"
    choices:
      - {text: "`from Produit where nom = ?1`", correct: true}
      - {text: "`from Produit where nom like ?1`", correct: false}
      - {text: "`select nom from Produit`", correct: false}
      - {text: "`from Produit order by nom`", correct: false}
    answer: "Un nom de champ seul est une égalité : Panache complète en `from Produit where nom = ?1`, et passe la valeur en paramètre."
  - key: find-ou-list
    format: course
    question: "Quelle différence entre `Produit.find(...)` et `Produit.list(...)` ?"
    choices:
      - {text: "`find` renvoie une `PanacheQuery` à terminer, `list` une `List`", correct: true}
      - {text: "`find` renvoie un seul résultat, `list` plusieurs", correct: false}
      - {text: "`find` interroge le cache, `list` interroge la base", correct: false}
      - {text: "`find` exige une transaction, `list` non", correct: false}
    answer: "`find` laisse choisir la fin : `firstResultOptional()`, `count()`, la pagination. `list(...)` est le raccourci de `find(...).list()`."
  - key: pourquoi-des-parametres
    format: course
    question: "Pourquoi passer les valeurs en paramètres plutôt que de les concaténer dans la requête ?"
    choices:
      - {text: "Contre l'injection, et pour qu'un guillemet ne casse pas la syntaxe", correct: true}
      - {text: "Parce que Panache refuse toute requête qui contient des guillemets", correct: false}
      - {text: "Parce que la concaténation désactive le cache des entités", correct: false}
      - {text: "Parce que les paramètres rendent les requêtes plus rapides à écrire", correct: false}
    answer: "Une valeur concaténée devient du code HQL : `L'Oréal` casse la requête, une valeur forgée la détourne. Un paramètre reste une valeur, quoi qu'il contienne."
  - key: retour-de-update
    format: course
    question: "Que renvoie `Produit.update(\"prix = prix / 2 where categorie = ?1\", categorie)` ?"
    choices:
      - {text: "Le nombre de lignes modifiées", correct: true}
      - {text: "La liste des produits modifiés", correct: false}
      - {text: "`true` si au moins une ligne a changé", correct: false}
      - {text: "Rien : la méthode est `void`", correct: false}
    answer: "`update` renvoie un `int`, `delete` un `long` : le nombre de lignes touchées. Les entités déjà chargées en mémoire ne sont pas mises à jour."
  - key: vf-singleresult-vide
    format: true-false
    question: "`singleResult()` lève une exception quand la requête ne trouve aucun résultat."
    truth: true
    answer: "Elle lève `NoResultException`, et `NonUniqueResultException` s'il y en a plusieurs. `singleResultOptional()` renvoie un `Optional` vide quand il n'y en a aucun."
  - key: vf-firstresult-null
    format: true-false
    question: "`firstResult()` renvoie `null` quand la requête ne trouve aucun résultat."
    truth: true
    answer: "D'où `firstResultOptional()`, qui oblige l'appelant à traiter l'absence."
  - key: vf-order-by-seul
    format: true-false
    question: "`Produit.list(\"order by prix desc\")` est une requête Panache valide, qui renvoie tous les produits triés."
    truth: true
    answer: "Une requête qui commence par `order by` est complétée en `from Produit order by prix desc`. `Sort.by(\"prix\").descending()` fait la même chose."
  - key: vf-delete-hors-transaction
    format: true-false
    question: "`Produit.delete(\"categorie\", categorie)` fonctionne hors transaction."
    truth: false
    answer: "Une suppression en masse est une écriture : sans transaction, « No active transaction for update or delete query ». On l'appelle depuis une méthode `@Transactional`."
  - key: qcm-tri-double
    format: multiple-choice
    question: "Comment tries-tu par prix décroissant, puis par nom ?"
    choices:
      - {text: "`Sort.by(\"prix\").descending().and(\"nom\")`", correct: true}
      - {text: "`Sort.by(\"prix, nom\").descending()`", correct: false}
      - {text: "`Sort.by(\"nom\").and(\"prix\").descending()`", correct: false}
      - {text: "`Sort.descending(\"nom\", \"prix\")`", correct: false}
    answer: "Les colonnes s'enchaînent dans l'ordre du tri : `prix` d'abord, en décroissant, puis `nom`, en croissant. L'ordre des colonnes compte."
  - key: qcm-parametres-nommes
    format: multiple-choice
    question: "Comment passes-tu un paramètre nommé à une requête Panache ?"
    choices:
      - {text: "`find(\"nom = :nom\", Parameters.with(\"nom\", nom))`", correct: true}
      - {text: "`find(\"nom = :nom\", nom)`", correct: false}
      - {text: "`find(\"nom = ${nom}\")`", correct: false}
      - {text: "`find(\"nom = ?nom\", Map.of(\"nom\", nom))`", correct: false}
    answer: "`Parameters.with(...).and(...)` remplit les paramètres nommés ; une `Map<String, Object>` convient aussi, avec `:nom` dans la requête. Une valeur seule va avec un paramètre positionnel `?1`."
  - key: qcm-compter-avec-condition
    format: multiple-choice
    question: "Comment comptes-tu les produits qui coûtent moins de 10 ?"
    choices:
      - {text: "`Produit.count(\"prix < ?1\", 10)`", correct: true}
      - {text: "`Produit.list(\"prix < ?1\", 10).count()`", correct: false}
      - {text: "`Produit.find(\"prix < 10\").size()`", correct: false}
      - {text: "`Produit.count().where(\"prix < 10\")`", correct: false}
    answer: "`count(...)` envoie un `select count(*)` avec la condition. `list(...)` renvoie une `List`, sans `count()` ; `find(...).count()` marcherait aussi."
  - key: qcm-unique-optionnel
    format: multiple-choice
    question: "Un produit a un code unique. Quelle méthode renvoie ce produit dans un `Optional`, vide s'il n'existe pas ?"
    choices:
      - {text: "`find(\"code\", code).singleResultOptional()`", correct: true}
      - {text: "`find(\"code\", code).singleResult()`", correct: false}
      - {text: "`find(\"code\", code).list()`", correct: false}
      - {text: "`find(\"code\", code).firstResult()`", correct: false}
    answer: "`singleResultOptional()` renvoie un `Optional` vide s'il n'y a rien, et lève une exception s'il y a plusieurs résultats : l'unicité est vérifiée."
  - key: trous-sort
    format: fill-in
    question: |-
      Complète pour trier les produits de la catégorie par prix :
      ```java
      return Produit.list("categorie", ___.by("prix"), categorie);
      ```
    blanks:
      - [Sort]
    answer: "`Sort` (`io.quarkus.panache.common.Sort`) se passe juste après la requête, avant les paramètres."
  - key: trous-parameters
    format: fill-in
    question: |-
      Complète pour remplir le paramètre nommé :
      ```java
      return Produit.list("categorie = :categorie", Parameters.___("categorie", categorie));
      ```
    blanks:
      - [with]
    answer: "`Parameters.with(nom, valeur)`, puis `.and(nom, valeur)` pour les suivants."
  - key: trous-premier-optionnel
    format: fill-in
    question: |-
      Complète pour renvoyer le produit de ce nom dans un `Optional` :
      ```java
      public static Optional<Produit> parNom(String nom) {
          return find("nom", nom).___();
      }
      ```
    blanks:
      - [firstResultOptional, singleResultOptional]
    answer: "`firstResultOptional()` prend le premier ; `singleResultOptional()` vérifie en plus qu'il n'y en a qu'un."
  - key: trous-compter-rupture
    format: fill-in
    question: |-
      Complète pour compter les produits dont le stock est à zéro :
      ```java
      long enRupture = Produit.___("stock", 0);
      ```
    blanks:
      - [count]
    answer: "`count(...)` accepte les mêmes requêtes que `find` et envoie un `select count(*)`."
  - key: bug-concatenation
    format: bug-fix
    question: |-
      La recherche de la marque `L'Oréal` répond 500 : « SyntaxException: At 1:36 and token 'Oréal', extraneous input
      'Oréal' expecting <EOF> ». Quelle correction est la bonne ?
      ```java
      public static List<Produit> deMarque(String marque) {
          return list("marque = '" + marque + "'");
      }
      ```
    choices:
      - {text: "Passer la marque en paramètre : `list(\"marque\", marque)`", correct: true}
      - {text: "Doubler les apostrophes de `marque` avant de concaténer", correct: false}
      - {text: "Entourer la valeur de guillemets doubles plutôt que simples", correct: false}
      - {text: "Retirer les apostrophes de `marque` avant la requête", correct: false}
    answer: |-
      ```java
      return list("marque", marque);
      ```
      La valeur concaténée devient du HQL : son apostrophe ferme la chaîne. Échapper à la main est fragile et laisse
      l'injection possible ; un paramètre reste une valeur.
  - key: bug-singleresult-plusieurs
    format: bug-fix
    question: |-
      `GET /categories/livres/vedette` répond 500 : « NonUniqueResultException: Query did not return a unique
      result: 2 results were returned ». On veut le produit le plus cher de la catégorie. Quelle correction est la
      bonne ?
      ```java
      return Produit.find("categorie", categorie).singleResult();
      ```
    choices:
      - {text: "`find(\"categorie\", Sort.by(\"prix\").descending(), categorie).firstResult()`", correct: true}
      - {text: "`find(\"categorie\", categorie).singleResultOptional()`", correct: false}
      - {text: "`find(\"categorie\", categorie).list().get(1)`", correct: false}
      - {text: "Rattraper `NonUniqueResultException` et renvoyer `null`", correct: false}
    answer: |-
      ```java
      return Produit.find("categorie", Sort.by("prix").descending(), categorie).firstResult();
      ```
      `singleResult()` exige un résultat unique. Ici, plusieurs produits sont attendus : on les trie, et on prend le
      premier. `singleResultOptional()` lèverait la même exception.
  - key: bug-singleresult-aucun
    format: bug-fix
    question: |-
      `GET /produits/code/ZZ9` répond 500 : « NoResultException: No result found for query ». On veut 404 quand le
      code est inconnu. Quelle correction est la bonne ?
      ```java
      Produit produit = Produit.find("code", code).singleResult();
      return produit;
      ```
    choices:
      - {text: "`find(\"code\", code).singleResultOptional().orElseThrow(NotFoundException::new)`", correct: true}
      - {text: "`find(\"code\", code).firstResult()`, renvoyé tel quel au client", correct: false}
      - {text: "`find(\"code\", code).list().get(0)`, renvoyé tel quel au client", correct: false}
      - {text: "Annoter la méthode avec `@Transactional` pour lire le produit", correct: false}
    answer: |-
      ```java
      return Produit.<Produit>find("code", code).singleResultOptional().orElseThrow(NotFoundException::new);
      ```
      `singleResult()` lève `NoResultException` quand il n'y a rien. `firstResult()` renverrait `null`, et une
      réponse vide ; `get(0)` lèverait une autre exception.
  - key: bug-delete-hors-transaction
    format: bug-fix
    question: |-
      `DELETE /commandes/annulees` répond 500 : « TransactionRequiredException: No active transaction for update or
      delete query ». Quelle correction est la bonne ?
      ```java
      @DELETE
      @Path("/annulees")
      public long purger() {
          return Commande.delete("statut", Statut.ANNULEE);
      }
      ```
    choices:
      - {text: "Annoter la méthode `purger` avec `@Transactional`", correct: true}
      - {text: "Charger les commandes, puis appeler `delete()` sur chacune", correct: false}
      - {text: "Remplacer `delete` par `deleteAll()` sur l'entité", correct: false}
      - {text: "Renvoyer `void` au lieu du nombre de lignes", correct: false}
    answer: |-
      ```java
      @DELETE
      @Path("/annulees")
      @Transactional
      public long purger() {
          return Commande.delete("statut", Statut.ANNULEE);
      }
      ```
      Une suppression en masse écrit en base : elle exige une transaction. Supprimer une à une exigerait aussi une
      transaction, et ferait une requête par commande.
