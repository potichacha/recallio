notion: filtres
lesson: |-
  Un **filtre** s'exécute autour de chaque requête REST, avant ou après la méthode de ressource. Il sert aux
  traitements transversaux : un identifiant de corrélation, une mesure de durée, un en-tête ajouté à toutes les
  réponses, une vérification simple.

  **Avec Quarkus REST**, un filtre est une simple méthode annotée, dans n'importe quelle classe :

  ```java
  public class Filtres {

      @ServerRequestFilter
      public Optional<RestResponse<Void>> cleApi(ContainerRequestContext requete) {
          if (requete.getHeaderString("X-Cle-Api") == null) {
              return Optional.of(RestResponse.status(Response.Status.UNAUTHORIZED));   // la requête s'arrête là
          }
          return Optional.empty();                                                      // elle continue
      }

      @ServerResponseFilter
      public void version(ContainerResponseContext reponse) {
          reponse.getHeaders().add("X-Version", "1");
      }
  }
  ```

  **Le filtre de requête** reçoit le contexte de la requête (`ContainerRequestContext`), et au besoin `UriInfo` ou
  `HttpHeaders`. Il renvoie :

  - `void`, ou un `Optional` vide : la requête continue ;
  - une réponse (un `Optional<RestResponse<Void>>` rempli, un `RestResponse` ou un `Response`) : la requête
    s'**arrête**, et cette réponse part sans que la méthode de ressource soit appelée.

  **`preMatching = true`** fait passer le filtre **avant** le choix de la méthode de ressource : il peut alors
  modifier le chemin ou le verbe (`requete.setMethod("PATCH")`). Sans lui, le filtre s'exécute une fois la méthode
  choisie.

  **Le filtre de réponse** reçoit aussi le contexte de la réponse (`ContainerResponseContext`) : il lit le statut,
  ajoute des en-têtes, mesure la durée.

  **L'ordre.** L'attribut `priority` ordonne plusieurs filtres. La forme classique de Jakarta REST,
  `ContainerRequestFilter` ou `ContainerResponseFilter` dans une classe annotée `@Provider`, reste possible.

  **Ce qu'un filtre ne doit pas devenir.** Une règle propre à une ressource a sa place dans la ressource ou le
  service. L'authentification d'utilisateurs relève de l'extension de sécurité (OIDC, JWT) et de `@RolesAllowed`,
  pas d'un filtre écrit à la main.

  **En entretien** : « Pour un traitement transversal, j'écris une méthode `@ServerRequestFilter` ou
  `@ServerResponseFilter` : un filtre de requête peut arrêter la requête en renvoyant une réponse, et `preMatching`
  le fait passer avant le routage. J'y mets la corrélation, les en-têtes communs, les mesures ; la sécurité des
  utilisateurs, je la laisse à l'extension dédiée. »
cards:
  - key: annotation-filtre-requete
    format: course
    question: "Quelle annotation de Quarkus REST fait exécuter une méthode avant chaque requête REST ?"
    choices:
      - {text: "`@ServerRequestFilter`", correct: true}
      - {text: "`@ServerExceptionMapper`", correct: false}
      - {text: "`@PreMatching` seule, sans autre annotation", correct: false}
      - {text: "`@RequestScoped` sur la méthode", correct: false}
    answer: "`org.jboss.resteasy.reactive.server.ServerRequestFilter` fait d'une méthode un filtre de requête, dans n'importe quelle classe."
  - key: arreter-la-requete
    format: course
    question: Comment un filtre `@ServerRequestFilter` arrête-t-il une requête ?
    choices:
      - {text: "En renvoyant une réponse, par exemple un `Optional<RestResponse<Void>>` rempli", correct: true}
      - {text: "En levant `InterruptedException`, que Quarkus traduit en 401", correct: false}
      - {text: "En appelant `System.exit` dans la méthode du filtre", correct: false}
      - {text: "En vidant les en-têtes du `ContainerRequestContext`", correct: false}
    answer: "Une réponse renvoyée par le filtre part telle quelle, sans appeler la ressource. Un `Optional` vide, ou `void`, laisse continuer."
  - key: pre-matching
    format: course
    question: "Que change `@ServerRequestFilter(preMatching = true)` ?"
    choices:
      - {text: "Le filtre passe avant le choix de la méthode, et peut changer chemin ou verbe", correct: true}
      - {text: "Le filtre ne s'exécute que pour les requêtes qui ont trouvé une ressource", correct: false}
      - {text: "Le filtre s'exécute au build, une seule fois, et non à chaque requête", correct: false}
      - {text: "Le filtre passe après la réponse, juste avant l'envoi au client", correct: false}
    answer: "Avant le routage, le filtre peut réécrire la requête : `setMethod`, `setRequestUri`. Sans `preMatching`, la méthode de ressource est déjà choisie."
  - key: ajouter-un-en-tete
    format: course
    question: "Comment ajoutes-tu l'en-tête `X-Version` à toutes les réponses REST ?"
    choices:
      - {text: "Avec un `@ServerResponseFilter` qui l'ajoute aux en-têtes de la réponse", correct: true}
      - {text: "Avec un `@ServerRequestFilter` qui l'ajoute aux en-têtes de la requête", correct: false}
      - {text: "Avec `@ResponseHeader` sur la classe `Application` de l'API", correct: false}
      - {text: "Avec `quarkus.rest.headers.X-Version=1` dans le fichier", correct: false}
    answer: "Le filtre de réponse reçoit `ContainerResponseContext`, dont `getHeaders().add(...)` complète la réponse de chaque ressource."
  - key: vf-optional-vide
    format: true-false
    question: "Un `@ServerRequestFilter` qui renvoie `Optional.empty()` laisse la requête continuer vers la ressource."
    truth: true
    answer: "Un `Optional` vide ne porte pas de réponse : la requête suit son cours. Un `Optional` rempli l'arrête."
  - key: vf-provider-pour-le-classique
    format: true-false
    question: "Un `ContainerRequestFilter` écrit à la façon de Jakarta REST doit porter `@Provider` pour être pris en compte."
    truth: true
    answer: "Comme un `ExceptionMapper`, un filtre classique s'enregistre par `@Provider`. Les méthodes `@ServerRequestFilter` n'en ont pas besoin."
  - key: vf-lire-un-en-tete
    format: true-false
    question: "Dans un filtre de requête, `ContainerRequestContext.getHeaderString(\"X-Cle-Api\")` lit un en-tête envoyé par le client."
    truth: true
    answer: "Le contexte donne les en-têtes, le chemin (`getUriInfo()`), le verbe et le corps de la requête."
  - key: vf-filtre-et-authentification
    format: true-false
    question: "Un filtre écrit à la main est le meilleur moyen d'authentifier les utilisateurs d'une application Quarkus."
    truth: false
    answer: "L'extension de sécurité (OIDC, JWT) vérifie les jetons, et `@RolesAllowed` les droits. Un filtre maison réinvente, souvent mal, ce qui existe et est éprouvé."
  - key: qcm-bon-usage
    format: multiple-choice
    question: "Lequel de ces traitements a sa place dans un filtre ?"
    choices:
      - {text: "Ajouter un identifiant de corrélation à chaque requête et à sa réponse", correct: true}
      - {text: "Vérifier qu'un produit est en stock avant de le commander", correct: false}
      - {text: "Calculer le prix d'un panier à partir de ses lignes", correct: false}
      - {text: "Choisir le statut 404 quand un produit n'existe pas", correct: false}
    answer: "Un filtre traite ce qui concerne toutes les requêtes. Une règle métier vit dans le service ; un 404 se lève dans la ressource ou par un mapper."
  - key: qcm-type-de-retour
    format: multiple-choice
    question: "Quel type de retour permet à un `@ServerRequestFilter` de laisser passer ou d'arrêter la requête ?"
    choices:
      - {text: "`Optional<RestResponse<Void>>`", correct: true}
      - {text: "`boolean`, `false` arrêtant la requête", correct: false}
      - {text: "`int`, le statut HTTP à renvoyer", correct: false}
      - {text: "`String`, le corps de la réponse", correct: false}
    answer: "Vide, la requête continue ; rempli, sa réponse part. `void` convient à un filtre qui ne bloque jamais."
  - key: qcm-changer-le-verbe
    format: multiple-choice
    question: "Un vieux client envoie `POST` avec l'en-tête `X-HTTP-Method-Override: PATCH`. Comment l'aiguilles-tu vers la méthode `@PATCH` ?"
    choices:
      - {text: "Un `@ServerRequestFilter(preMatching = true)` qui appelle `setMethod`", correct: true}
      - {text: "Un `@ServerRequestFilter` ordinaire, après le choix de la méthode", correct: false}
      - {text: "Un `@ServerResponseFilter` qui réécrit le verbe de la réponse", correct: false}
      - {text: "Un `@ServerExceptionMapper` sur l'erreur 405 renvoyée", correct: false}
    answer: "Seul un filtre qui passe avant le routage peut changer le verbe à temps ; après, la méthode `@POST` est déjà choisie."
  - key: qcm-ordre-des-filtres
    format: multiple-choice
    question: "Comment fixes-tu l'ordre de plusieurs filtres de requête ?"
    choices:
      - {text: "Avec leur attribut `priority`", correct: true}
      - {text: "Par l'ordre alphabétique de leurs classes", correct: false}
      - {text: "Par l'ordre de déclaration dans le fichier", correct: false}
      - {text: "Avec `@Order`, comme dans Spring", correct: false}
    answer: "`@ServerRequestFilter(priority = ...)` ordonne les filtres, comme `@Priority` pour un filtre classique."
  - key: trous-request-filter
    format: fill-in
    question: |-
      Complète pour que cette méthode s'exécute avant chaque requête :
      ```java
      @___
      public Optional<RestResponse<Void>> cleApi(ContainerRequestContext requete) {
      ```
    blanks:
      - [ServerRequestFilter]
    answer: "`@ServerRequestFilter` fait de la méthode un filtre de requête."
  - key: trous-response-filter
    format: fill-in
    question: |-
      Complète pour que cette méthode s'exécute sur chaque réponse :
      ```java
      @___
      public void version(ContainerResponseContext reponse) {
          reponse.getHeaders().add("X-Version", "1");
      }
      ```
    blanks:
      - [ServerResponseFilter]
    answer: "`@ServerResponseFilter` fait de la méthode un filtre de réponse."
  - key: trous-prematching
    format: fill-in
    question: |-
      Complète pour que le filtre passe avant le choix de la méthode de ressource :
      ```java
      @ServerRequestFilter(___ = true)
      public void reecrire(ContainerRequestContext requete) {
      ```
    blanks:
      - [preMatching]
    answer: "Avant le routage, le filtre peut encore changer le chemin ou le verbe."
  - key: trous-ajouter-en-tete
    format: fill-in
    question: |-
      Complète pour ajouter l'en-tête à la réponse :
      ```java
      @ServerResponseFilter
      public void version(ContainerResponseContext reponse) {
          reponse.getHeaders().___("X-Version", "1");
      }
      ```
    blanks:
      - [add, putSingle]
    answer: "`getHeaders()` est une table multivaluée : `add` ajoute une valeur, `putSingle` remplace les autres."
