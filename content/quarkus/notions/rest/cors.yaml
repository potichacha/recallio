notion: cors
lesson: |-
  Un navigateur applique la **politique de même origine** : le JavaScript d'une page ne lit la réponse d'une requête
  que si elle vient de la même **origine**, c'est-à-dire le même schéma, le même hôte et le même port. Un front servi
  par Vite sur `http://localhost:5173` qui appelle l'API sur `http://localhost:8080` fait donc une requête
  **cross-origin**.

  **CORS** (Cross-Origin Resource Sharing) permet au serveur de dire quelles origines il accepte, par des en-têtes :
  `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods`... C'est le **navigateur** qui applique la règle :
  `curl`, un autre serveur ou un test RestAssured ne sont pas concernés.

  **Avec Quarkus**, le filtre CORS s'active et se règle dans `application.properties` :

  ```properties
  quarkus.http.cors.enabled=true
  quarkus.http.cors.origins=http://localhost:5173,https://boutique.example
  quarkus.http.cors.methods=GET,POST,PUT,DELETE
  quarkus.http.cors.exposed-headers=Location,X-Total-Count
  quarkus.http.cors.access-control-max-age=24H
  ```

  - `origins` liste les origines exactes, sans barre finale : `http://localhost:5173/` ne correspond pas à
    l'origine `http://localhost:5173` envoyée par le navigateur. Une expression régulière s'écrit entre barres :
    `/https://.*[.]boutique[.]example/`.
  - Une requête venue d'une origine qui n'est pas listée est refusée par Quarkus, avec un 403.
  - `methods` et `headers` limitent les verbes et les en-têtes permis ; sans eux, Quarkus accepte ceux que le
    navigateur demande.
  - `exposed-headers` : par défaut, le JavaScript ne lit que quelques en-têtes de réponse simples (`Content-Type`...).
    Pour lire `Location` ou `X-Total-Count`, il faut les exposer.

  **La requête préalable (preflight).** Avant un `PUT`, un `DELETE`, un corps JSON ou un en-tête personnalisé
  (`Authorization`), le navigateur envoie d'abord un `OPTIONS` avec `Origin` et `Access-Control-Request-Method`. Si
  la réponse ne l'autorise pas, la vraie requête ne part jamais. `access-control-max-age` permet au navigateur de
  garder cette réponse en cache.

  **Pas de CORS du tout.** Si le front et l'API sont servis sous la même origine, derrière un même proxy (nginx sert
  le front et transmet `/api` au backend), la question ne se pose pas. C'est souvent le plus simple en production ;
  CORS reste utile en développement, ou pour une API appelée par des sites tiers.

  **En entretien** : « CORS, c'est le serveur qui dit au navigateur quelles origines peuvent lire ses réponses ; seul
  le navigateur l'applique. Dans Quarkus, `quarkus.http.cors.enabled` et la liste exacte des origines, jamais `*`
  avec des cookies ; j'expose les en-têtes que le front doit lire. Et quand je peux, je sers front et API sous la
  même origine. »
cards:
  - key: definition-origine
    format: course
    question: "Qu'est-ce qui définit l'origine d'une page, pour le navigateur ?"
    choices:
      - {text: "Le schéma, l'hôte et le port", correct: true}
      - {text: "L'hôte seul, quel que soit le port", correct: false}
      - {text: "Le chemin de la page et son hôte", correct: false}
      - {text: "L'adresse IP du serveur qui répond", correct: false}
    answer: "`http://localhost:5173` et `http://localhost:8080` sont deux origines : seul le port diffère, et c'est suffisant."
  - key: qui-applique-cors
    format: course
    question: "Qui applique la règle de CORS ?"
    choices:
      - {text: "Le navigateur, d'après les en-têtes envoyés par le serveur", correct: true}
      - {text: "Le serveur seul, sans que le navigateur intervienne", correct: false}
      - {text: "Le pare-feu, en filtrant les ports des requêtes", correct: false}
      - {text: "Le client HTTP de Java, pour tout appel sortant", correct: false}
    answer: "Le serveur annonce ce qu'il accepte ; le navigateur empêche le JavaScript de lire ce qui n'est pas autorisé. `curl` ou un autre serveur ne sont pas concernés."
  - key: activer-cors
    format: course
    question: "Comment autorises-tu le front `http://localhost:5173` à appeler une API Quarkus ?"
    choices:
      - {text: "`quarkus.http.cors.enabled=true` et `quarkus.http.cors.origins=http://localhost:5173`", correct: true}
      - {text: "`@CrossOrigin(\"http://localhost:5173\")` sur chaque ressource de l'API", correct: false}
      - {text: "`quarkus.http.port=5173`, pour que le front et l'API partagent le port", correct: false}
      - {text: "Un filtre de réponse qui ajoute `Access-Control-Allow-Origin: *`", correct: false}
    answer: "Le filtre CORS de Quarkus se règle par propriétés. `@CrossOrigin` appartient à Spring ; deux processus ne partagent pas un port."
  - key: requete-preflight
    format: course
    question: "Quand le navigateur envoie-t-il une requête préalable `OPTIONS` ?"
    choices:
      - {text: "Avant une requête qui n'est pas simple : `DELETE`, corps JSON, `Authorization`", correct: true}
      - {text: "Avant chaque requête, même un `GET` sans en-tête particulier", correct: false}
      - {text: "Seulement quand le serveur l'exige par un en-tête de la réponse", correct: false}
      - {text: "Seulement pour les requêtes envoyées vers la même origine", correct: false}
    answer: "Le navigateur demande d'abord la permission pour les verbes, en-têtes ou types de corps qui sortent du cas simple. Sans réponse favorable, la vraie requête ne part pas."
  - key: vf-curl
    format: true-false
    question: "Une requête faite avec `curl` depuis un terminal est bloquée quand l'API n'autorise pas son origine."
    truth: false
    answer: "CORS est appliqué par le navigateur. `curl` n'envoie même pas d'en-tête `Origin` : la réponse n'est soumise à aucune règle."
  - key: vf-origine-refusee
    format: true-false
    question: "Avec le filtre CORS activé, Quarkus répond 403 à une requête venue d'une origine qui n'est pas listée."
    truth: true
    answer: "Quarkus refuse lui-même la requête cross-origin non autorisée, préalable comme requête réelle."
  - key: vf-en-tetes-exposes
    format: true-false
    question: "Sans configuration, le JavaScript d'une autre origine peut lire l'en-tête `X-Total-Count` d'une réponse autorisée."
    truth: false
    answer: "Seuls quelques en-têtes simples sont lisibles d'office. `quarkus.http.cors.exposed-headers=X-Total-Count` l'expose."
  - key: vf-meme-origine-sans-cors
    format: true-false
    question: "Un front et une API servis sous la même origine, derrière un même proxy, n'ont pas besoin de CORS."
    truth: true
    answer: "Le navigateur ne voit alors qu'une origine : aucune requête n'est cross-origin."
  - key: qcm-port-different
    format: multiple-choice
    question: "Le front tourne sur `http://localhost:5173`, l'API sur `http://localhost:8080`. Pourquoi le navigateur parle-t-il de CORS ?"
    choices:
      - {text: "Les ports diffèrent : ce sont deux origines distinctes", correct: true}
      - {text: "`localhost` est toujours traité comme une origine étrangère", correct: false}
      - {text: "L'API n'est pas en HTTPS, ce que le navigateur exige", correct: false}
      - {text: "Vite bloque toute requête vers un autre processus", correct: false}
    answer: "Le port fait partie de l'origine. En développement, on autorise l'origine de Vite, ou on passe par son proxy."
  - key: qcm-expression-reguliere
    format: multiple-choice
    question: "Comment autorises-tu tous les sous-domaines de `boutique.example` en HTTPS ?"
    choices:
      - {text: "`quarkus.http.cors.origins=/https://.*[.]boutique[.]example/`", correct: true}
      - {text: "`quarkus.http.cors.origins=https://*.boutique.example`", correct: false}
      - {text: "`quarkus.http.cors.origins=*`", correct: false}
      - {text: "`quarkus.http.cors.origins=boutique.example`", correct: false}
    answer: "Une valeur entre barres est une expression régulière. `*` accepterait toute origine, et un joker dans une origine exacte n'est pas compris."
  - key: qcm-lire-location
    format: multiple-choice
    question: "Le front reçoit bien un 201, mais lit `null` pour l'en-tête `Location`. Que règles-tu ?"
    choices:
      - {text: "`quarkus.http.cors.exposed-headers=Location`", correct: true}
      - {text: "`quarkus.http.cors.headers=Location`", correct: false}
      - {text: "`quarkus.http.cors.methods=POST`", correct: false}
      - {text: "`quarkus.http.cors.origins=Location`", correct: false}
    answer: "`exposed-headers` rend un en-tête de réponse lisible par le JavaScript. `headers` liste les en-têtes que la requête peut envoyer."
  - key: qcm-eviter-cors-en-production
    format: multiple-choice
    question: "Comment éviter tout réglage CORS en production, pour un front et une API qui t'appartiennent ?"
    choices:
      - {text: "Les servir sous une même origine, le proxy transmettant `/api` au backend", correct: true}
      - {text: "Autoriser toutes les origines avec `*`, pour ne plus y penser", correct: false}
      - {text: "Désactiver CORS dans le navigateur de chaque utilisateur", correct: false}
      - {text: "Appeler l'API en `curl` depuis le JavaScript du front", correct: false}
    answer: "Sous une seule origine, aucune requête n'est cross-origin. `*` ouvrirait l'API à n'importe quel site."
  - key: trous-cors-enabled
    format: fill-in
    question: |-
      Complète pour activer le filtre CORS :
      ```properties
      quarkus.http.cors.___=true
      quarkus.http.cors.origins=http://localhost:5173
      ```
    blanks:
      - [enabled]
    answer: "`quarkus.http.cors.enabled` active le filtre ; `origins` dit qui est accepté."
  - key: trous-cors-origins
    format: fill-in
    question: |-
      Complète pour autoriser le front de Vite :
      ```properties
      quarkus.http.cors.enabled=true
      quarkus.http.cors.___=http://localhost:5173
      ```
    blanks:
      - [origins]
    answer: "`origins` liste les origines acceptées, séparées par des virgules."
  - key: trous-cors-exposed
    format: fill-in
    question: |-
      Complète pour que le front puisse lire l'en-tête `X-Total-Count` :
      ```properties
      quarkus.http.cors.___=X-Total-Count
      ```
    blanks:
      - [exposed-headers]
    answer: "Un en-tête de réponse doit être exposé pour être lisible depuis une autre origine."
  - key: trous-cors-methods
    format: fill-in
    question: |-
      Complète pour n'autoriser que la lecture et la création :
      ```properties
      quarkus.http.cors.___=GET,POST
      ```
    blanks:
      - [methods]
    answer: "`methods` limite les verbes annoncés au navigateur dans la réponse à la requête préalable."
  - key: bug-cors-non-active
    format: bug-fix
    question: |-
      La console du navigateur affiche « blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present
      on the requested resource ». Le front tourne sur `http://localhost:5173`. Quelle correction est la bonne ?
      ```properties
      # application.properties : rien sur CORS
      quarkus.http.port=8080
      ```
    choices:
      - {text: "Ajouter `quarkus.http.cors.enabled=true` et l'origine `http://localhost:5173`", correct: true}
      - {text: "Ajouter `quarkus.http.cors.exposed-headers=Access-Control-Allow-Origin`", correct: false}
      - {text: "Passer l'API sur le port 5173, celui du front", correct: false}
      - {text: "Ajouter `@Produces(MediaType.APPLICATION_JSON)` sur les ressources", correct: false}
    answer: |-
      ```properties
      quarkus.http.cors.enabled=true
      quarkus.http.cors.origins=http://localhost:5173
      ```
      Sans filtre CORS, la réponse ne dit pas que l'origine du front est acceptée : le navigateur cache la réponse au
      JavaScript.
  - key: bug-barre-finale
    format: bug-fix
    question: |-
      Le filtre CORS est activé, mais les requêtes du front `http://localhost:5173` reçoivent 403. Quelle correction
      est la bonne ?
      ```properties
      quarkus.http.cors.enabled=true
      quarkus.http.cors.origins=http://localhost:5173/
      ```
    choices:
      - {text: "Retirer la barre finale : `http://localhost:5173`", correct: true}
      - {text: "Écrire `localhost:5173`, sans le schéma", correct: false}
      - {text: "Ajouter `quarkus.http.cors.methods=GET,POST`", correct: false}
      - {text: "Écrire `http://localhost:5173/*`", correct: false}
    answer: |-
      ```properties
      quarkus.http.cors.origins=http://localhost:5173
      ```
      Le navigateur envoie `Origin: http://localhost:5173`, sans barre. La comparaison est exacte : avec la barre,
      l'origine n'est pas reconnue, et Quarkus répond 403.
  - key: bug-en-tete-non-expose
    format: bug-fix
    question: |-
      Le front pagine avec l'en-tête `X-Total-Count` de la réponse. L'appel aboutit, mais
      `reponse.headers.get("X-Total-Count")` vaut `null` dans le navigateur, alors que `curl` montre l'en-tête.
      Quelle correction est la bonne ?
      ```properties
      quarkus.http.cors.enabled=true
      quarkus.http.cors.origins=http://localhost:5173
      ```
    choices:
      - {text: "Ajouter `quarkus.http.cors.exposed-headers=X-Total-Count`", correct: true}
      - {text: "Ajouter `quarkus.http.cors.headers=X-Total-Count`", correct: false}
      - {text: "Renommer l'en-tête en `Total-Count`, sans le `X-`", correct: false}
      - {text: "Ajouter `quarkus.http.cors.methods=GET`", correct: false}
    answer: |-
      ```properties
      quarkus.http.cors.exposed-headers=X-Total-Count
      ```
      D'une autre origine, le JavaScript ne lit que les en-têtes simples ; les autres doivent être exposés. `headers`
      concerne les en-têtes que la requête envoie.
  - key: bug-mauvais-port
    format: bug-fix
    question: |-
      Le front vient de passer de Create React App à Vite, et toutes ses requêtes reçoivent maintenant 403. Quelle
      correction est la bonne ?
      ```properties
      quarkus.http.cors.enabled=true
      quarkus.http.cors.origins=http://localhost:3000
      ```
    choices:
      - {text: "Mettre l'origine de Vite : `http://localhost:5173`", correct: true}
      - {text: "Retirer `quarkus.http.cors.enabled=true`", correct: false}
      - {text: "Écrire `http://localhost`, sans le port", correct: false}
      - {text: "Passer l'API sur le port 3000", correct: false}
    answer: |-
      ```properties
      quarkus.http.cors.origins=http://localhost:5173
      ```
      Le port fait partie de l'origine : `localhost:3000` et `localhost:5173` sont deux origines. Sans le port,
      l'origine ne correspondrait plus à aucune des deux.
