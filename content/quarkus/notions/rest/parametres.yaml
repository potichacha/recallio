notion: parametres
lesson: |-
  Une requête porte des informations à plusieurs endroits : le chemin, la chaîne de requête, les en-têtes, les
  cookies, le corps. Chacune a son annotation.

  | Source | Jakarta REST | Quarkus REST | Exemple |
  |---|---|---|---|
  | Chemin | `@PathParam("id")` | `@RestPath` | `/produits/42` |
  | Requête | `@QueryParam("page")` | `@RestQuery` | `?page=2` |
  | En-tête | `@HeaderParam("X-Tenant")` | `@RestHeader` | `X-Tenant: acme` |
  | Cookie | `@CookieParam("session")` | `@RestCookie` | `Cookie: session=...` |
  | Formulaire | `@FormParam("nom")` | `@RestForm` | corps `application/x-www-form-urlencoded` |
  | Corps | (aucune annotation) | (aucune annotation) | le JSON, désérialisé par Jackson |

  Les annotations de Jakarta REST exigent le nom. Celles de Quarkus REST (`org.jboss.resteasy.reactive`) le
  **déduisent du paramètre** : `@RestQuery int page` lit `?page=`. Pour un en-tête, le nom en camelCase devient un nom
  à tirets : `@RestHeader String userAgent` lit `User-Agent`. Un paramètre sans annotation dont le nom correspond à
  un segment `{...}` du chemin est même lu comme `@RestPath`.

  ```java
  @Path("/produits")
  public class ProduitResource {

      @GET
      public List<Produit> chercher(@RestQuery String q,
                                    @RestQuery @DefaultValue("1") int page,
                                    @RestQuery List<String> tag,          // ?tag=bio&tag=promo
                                    @RestHeader("X-Tenant") String tenant) {
          ...
      }

      @GET
      @Path("/{id: \\d+}")                                               // chiffres seulement
      public Produit trouver(@RestPath long id) { ... }
  }
  ```

  **Quand la valeur manque.**

  | Paramètre absent | Valeur reçue |
  |---|---|
  | type objet (`String`, `Integer`) | `null` |
  | type primitif (`int`, `long`) | `0` |
  | `List<String>` | une liste vide |
  | avec `@DefaultValue("1")` | la valeur par défaut, convertie |

  **Quand la valeur ne se convertit pas.** `GET /produits/abc` pour un `@RestPath long id`, ou `?page=deux` pour un
  `int` : Quarkus répond **404**, comme le veut Jakarta REST pour le chemin et la requête. Pour annoncer clairement
  une erreur du client, on reçoit une `String` et on valide, ou on contraint le chemin par une expression régulière
  (`{id: \\d+}`) : ce qui ne correspond pas n'atteint pas la méthode.

  **Le corps.** Un seul paramètre sans annotation reçoit le corps, désérialisé selon le `Content-Type` (du JSON avec
  `quarkus-rest-jackson`).

  **En entretien** : « Le chemin pour identifier une ressource, la requête pour filtrer et paginer, les en-têtes pour
  le contexte, le corps pour les données. Avec Quarkus REST, `@RestPath`, `@RestQuery` et `@RestHeader` déduisent
  le nom du paramètre. Une valeur absente donne `null` ou zéro, d'où `@DefaultValue` ; une valeur qui ne se
  convertit pas donne un 404. »
cards:
  - key: annotation-chemin
    format: course
    question: "Quelle annotation de Quarkus REST lit le `42` de `GET /produits/42` ?"
    choices:
      - {text: "`@RestPath`", correct: true}
      - {text: "`@RestQuery`", correct: false}
      - {text: "`@RestForm`", correct: false}
      - {text: "`@RestHeader`", correct: false}
    answer: "`@RestPath` lit un segment du chemin déclaré entre accolades, `@Path(\"/{id}\")`. Son équivalent Jakarta REST est `@PathParam(\"id\")`."
  - key: nom-deduit
    format: course
    question: "Quelle différence entre `@QueryParam(\"page\") int page` et `@RestQuery int page` ?"
    choices:
      - {text: "`@RestQuery` déduit le nom du paramètre Java", correct: true}
      - {text: "`@RestQuery` lit le corps au lieu de la requête", correct: false}
      - {text: "`@QueryParam` accepte seulement des `String`", correct: false}
      - {text: "`@RestQuery` rend le paramètre obligatoire", correct: false}
    answer: "Les deux lisent `?page=`. Les annotations de Quarkus REST tirent le nom du paramètre ; celles de Jakarta REST l'exigent."
  - key: primitif-absent
    format: course
    question: "Que reçoit `@RestQuery int page` quand la requête n'a pas de paramètre `page` ?"
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "Une erreur 400", correct: false}
      - {text: "Une erreur 404", correct: false}
    answer: "Un primitif absent reçoit sa valeur nulle, `0` ; un `Integer` recevrait `null`. `@DefaultValue(\"1\")` donne une autre valeur."
  - key: conversion-impossible
    format: course
    question: "`GET /produits/abc` atteint une méthode `@Path(\"/{id}\")` qui attend `@RestPath long id`. Que répond Quarkus ?"
    choices:
      - {text: "404 Not Found", correct: true}
      - {text: "400 Bad Request", correct: false}
      - {text: "500 Internal Server Error", correct: false}
      - {text: "200, avec `id` à 0", correct: false}
    answer: "Jakarta REST traite un paramètre de chemin ou de requête inconvertible comme une ressource introuvable : 404. Une expression régulière dans le chemin le rend explicite."
  - key: vf-en-tete-camelcase
    format: true-false
    question: "`@RestHeader String userAgent` lit l'en-tête `User-Agent`."
    truth: true
    answer: "Pour un en-tête, Quarkus REST transforme le nom camelCase du paramètre en nom à tirets. Pour un autre nom, `@RestHeader(\"X-Tenant\")`."
  - key: vf-liste-absente
    format: true-false
    question: "`@RestQuery List<String> tag` reçoit une liste vide quand la requête n'a aucun paramètre `tag`."
    truth: true
    answer: "Une collection absente est vide, jamais `null` ; `?tag=bio&tag=promo` donne deux éléments."
  - key: vf-sans-annotation-chemin
    format: true-false
    question: "Avec Quarkus REST, un paramètre sans annotation dont le nom correspond à un segment `{nom}` du chemin reçoit sa valeur."
    truth: true
    answer: "Quarkus REST le lit comme un `@RestPath`. Écrire l'annotation reste plus lisible."
  - key: vf-query-param-sans-nom
    format: true-false
    question: "`@QueryParam` de Jakarta REST peut s'écrire sans nom, comme `@RestQuery`."
    truth: false
    answer: "L'attribut `value` de `@QueryParam` est obligatoire : sans lui, le code ne compile pas. Seules les annotations de Quarkus REST déduisent le nom."
  - key: qcm-ou-mettre-la-pagination
    format: multiple-choice
    question: "Où places-tu la page et la taille d'une liste paginée de produits ?"
    choices:
      - {text: "Dans la requête : `GET /produits?page=2&taille=20`", correct: true}
      - {text: "Dans le chemin : `GET /produits/2/20`", correct: false}
      - {text: "Dans le corps d'un `GET`, en JSON", correct: false}
      - {text: "Dans un cookie posé par le serveur", correct: false}
    answer: "Le chemin identifie la ressource ; la requête la filtre, la trie et la pagine. Un `GET` ne porte pas de corps."
  - key: qcm-plusieurs-valeurs
    format: multiple-choice
    question: "Quel paramètre reçoit `bio` et `promo` pour `GET /produits?tag=bio&tag=promo` ?"
    choices:
      - {text: "`@RestQuery List<String> tag`", correct: true}
      - {text: "`@RestQuery String tag`", correct: false}
      - {text: "`@RestPath List<String> tag`", correct: false}
      - {text: "`@RestQuery String[] tags`", correct: false}
    answer: "Un paramètre répété remplit une `List` (ou un `Set`) du même nom. Un `String` ne recevrait qu'une valeur, et `tags` lirait `?tags=`."
  - key: qcm-defaultvalue
    format: multiple-choice
    question: "Comment fais-tu valoir 1 à `page` quand le client ne l'envoie pas ?"
    choices:
      - {text: "`@RestQuery @DefaultValue(\"1\") int page`", correct: true}
      - {text: "`@RestQuery int page = 1`", correct: false}
      - {text: "`@RestQuery(defaultValue = 1) int page`", correct: false}
      - {text: "`@RestQuery Optional<Integer> page`, sans plus", correct: false}
    answer: "`@DefaultValue` (`jakarta.ws.rs`) donne une valeur sous forme de chaîne, convertie. Java n'a pas de valeur par défaut pour un paramètre."
  - key: qcm-regex-chemin
    format: multiple-choice
    question: "Que fait `@Path(\"/{id: \\\\d+}\")` sur une méthode ?"
    choices:
      - {text: "Elle ne répond qu'aux identifiants faits de chiffres", correct: true}
      - {text: "Elle convertit l'identifiant en `double`", correct: false}
      - {text: "Elle répond 400 à un identifiant non numérique", correct: false}
      - {text: "Elle accepte plusieurs identifiants séparés par des barres", correct: false}
    answer: "Un segment peut porter une expression régulière : `/produits/abc` ne correspond pas, et répond 404 sans atteindre la méthode."
  - key: trous-restquery
    format: fill-in
    question: |-
      Complète pour lire `?q=stylo` :
      ```java
      @GET
      public List<Produit> chercher(@___ String q) {
      ```
    blanks:
      - [RestQuery]
    answer: "`@RestQuery` lit un paramètre de la chaîne de requête, nommé comme le paramètre Java."
  - key: trous-pathparam
    format: fill-in
    question: |-
      Complète avec l'annotation de Jakarta REST :
      ```java
      @GET
      @Path("/{id}")
      public Produit trouver(@___("id") long id) {
      ```
    blanks:
      - [PathParam]
    answer: "`@PathParam(\"id\")` est l'équivalent Jakarta REST de `@RestPath`, nom obligatoire."
  - key: trous-defaultvalue
    format: fill-in
    question: |-
      Complète pour que la taille vaille 20 quand elle manque :
      ```java
      @RestQuery @___("20") int taille
      ```
    blanks:
      - [DefaultValue]
    answer: "`@DefaultValue` prend une chaîne, convertie dans le type du paramètre."
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète pour lire l'en-tête `X-Tenant` :
      ```java
      @GET
      public List<Produit> lister(@___("X-Tenant") String tenant) {
      ```
    blanks:
      - [RestHeader, HeaderParam]
    answer: "`@RestHeader` (Quarkus REST) ou `@HeaderParam` (Jakarta REST) lisent un en-tête de la requête."
  - key: bug-mauvais-nom-de-parametre
    format: bug-fix
    question: |-
      `GET /produits?categorie=livres` renvoie tous les produits, comme si le filtre était ignoré. Quelle
      correction est la bonne ?
      ```java
      @GET
      public List<Produit> lister(@RestQuery String cat) {
          return cat == null ? catalogue.tous() : catalogue.parCategorie(cat);
      }
      ```
    choices:
      - {text: "Écrire `@RestQuery(\"categorie\") String cat`", correct: true}
      - {text: "Écrire `@RestPath String cat`", correct: false}
      - {text: "Écrire `@RestQuery @DefaultValue(\"livres\") String cat`", correct: false}
      - {text: "Écrire `@RestHeader String cat`", correct: false}
    answer: |-
      ```java
      public List<Produit> lister(@RestQuery("categorie") String cat) {
      ```
      Sans nom, `@RestQuery` lit `?cat=`, que le client n'envoie pas : `cat` vaut `null`. Renommer le paramètre
      Java en `categorie` corrigerait aussi.
  - key: bug-primitif-absent
    format: bug-fix
    question: |-
      Sans paramètre `taille`, la liste revient toujours vide. Quelle correction est la bonne ?
      ```java
      @GET
      public List<Produit> lister(@RestQuery int taille) {
          return catalogue.premiers(taille);
      }
      ```
    choices:
      - {text: "Écrire `@RestQuery @DefaultValue(\"20\") int taille`", correct: true}
      - {text: "Écrire `@RestPath int taille`", correct: false}
      - {text: "Écrire `@RestQuery Integer taille`, sans plus", correct: false}
      - {text: "Écrire `@RestQuery long taille`", correct: false}
    answer: |-
      ```java
      public List<Produit> lister(@RestQuery @DefaultValue("20") int taille) {
      ```
      Un `int` absent vaut 0 : la méthode demandait les 0 premiers produits. Un `Integer` vaudrait `null`, et
      `premiers(null)` lèverait une `NullPointerException`.
  - key: bug-identifiant-non-numerique
    format: bug-fix
    question: |-
      Les identifiants de commande sont devenus des codes comme `CMD-2026-001`. Depuis, `GET /commandes/CMD-2026-001`
      répond 404. Quelle correction est la bonne ?
      ```java
      @GET
      @Path("/{id}")
      public Commande trouver(@RestPath long id) { ... }
      ```
    choices:
      - {text: "Déclarer `@RestPath String id`", correct: true}
      - {text: "Déclarer `@RestQuery long id`", correct: false}
      - {text: "Écrire `@Path(\"/{id: \\\\d+}\")`", correct: false}
      - {text: "Déclarer `@RestPath Long id`", correct: false}
    answer: |-
      ```java
      public Commande trouver(@RestPath String id) { ... }
      ```
      `CMD-2026-001` ne se convertit pas en `long` : Jakarta REST répond 404 avant d'appeler la méthode. Un `Long`
      ne se convertit pas mieux.
  - key: bug-annotation-jakarta-sans-nom
    format: bug-fix
    question: |-
      Ce code ne compile pas : « annotation @HeaderParam is missing a default value for the element 'value' ».
      Quelle correction est la bonne ?
      ```java
      @GET
      public List<Produit> lister(@HeaderParam String tenant) { ... }
      ```
    choices:
      - {text: "Écrire `@HeaderParam(\"X-Tenant\") String tenant`", correct: true}
      - {text: "Écrire `@HeaderParam() String tenant`", correct: false}
      - {text: "Écrire `@HeaderParam String tenant = \"\"`", correct: false}
      - {text: "Écrire `@QueryParam String tenant`", correct: false}
    answer: |-
      ```java
      public List<Produit> lister(@HeaderParam("X-Tenant") String tenant) { ... }
      ```
      Les annotations de Jakarta REST exigent le nom. `@RestHeader("X-Tenant")` de Quarkus REST conviendrait aussi ;
      sans nom, il lirait l'en-tête `Tenant`.
