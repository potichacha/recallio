notion: quarkus-rest
lesson: |-
  **Quarkus REST** (anciennement RESTEasy Reactive) est la pile REST de Quarkus : l'extension `quarkus-rest`, et
  `quarkus-rest-jackson` pour le JSON. Elle implémente **Jakarta REST** (l'ex-JAX-RS) : les mêmes annotations
  `jakarta.ws.rs`, traitées au build et servies par Vert.x. L'ancienne pile, RESTEasy Classic, est remplacée par
  elle.

  ```bash
  quarkus ext add rest-jackson
  # ou : ./mvnw quarkus:add-extension -Dextensions=quarkus-rest-jackson
  ```

  **Une ressource.** Une classe annotée `@Path`, des méthodes annotées par leur verbe HTTP :

  ```java
  @Path("/produits")
  public class ProduitResource {

      private final Catalogue catalogue;

      ProduitResource(Catalogue catalogue) {      // injection par le constructeur
          this.catalogue = catalogue;
      }

      @GET
      public List<Produit> lister() {              // GET /produits
          return catalogue.tous();
      }

      @GET
      @Path("/{id}")
      public Produit trouver(@RestPath long id) {   // GET /produits/42
          return catalogue.trouver(id);
      }

      @POST
      public Produit creer(NouveauProduit nouveau) { // POST /produits, corps JSON
          return catalogue.ajouter(nouveau);
      }

      @DELETE
      @Path("/{id}")
      public void supprimer(@RestPath long id) {   // DELETE /produits/42
          catalogue.retirer(id);
      }
  }
  ```

  Le `@Path` d'une méthode **s'ajoute** à celui de la classe. Il n'y a pas de classe `Application` à écrire ; pour
  préfixer toutes les ressources, `quarkus.rest.path=/api` suffit.

  **Ce que Quarkus décide pour toi.**

  | Situation | Réponse |
  |---|---|
  | La méthode renvoie un objet | 200, le corps en JSON (avec `quarkus-rest-jackson`) |
  | Elle renvoie une `String` | 200, en `text/plain` |
  | Elle renvoie `null`, ou c'est une méthode `void` | 204 No Content |
  | Un `@POST` renvoie l'objet créé | 200 aussi : le 201 se demande (notion suivante) |
  | Aucune ressource pour ce chemin | 404 |
  | Le chemin existe, pas le verbe | 405 Method Not Allowed |
  | Le `Content-Type` envoyé n'est pas accepté | 415 Unsupported Media Type |
  | Le format demandé par `Accept` n'est pas produit | 406 Not Acceptable |

  `@Produces` et `@Consumes` restreignent les formats quand il le faut ; avec Jackson, le JSON est le défaut.

  **Une instance pour toutes les requêtes.** Avec Quarkus REST, une classe de ressource sans annotation de portée est
  un **singleton** : la même instance sert toutes les requêtes, en parallèle. Elle ne garde donc aucun état propre à
  une requête dans ses champs.

  **En mode dev**, chaque modification est rechargée à la requête suivante ; les tests utilisent `@QuarkusTest` et
  RestAssured.

  **En entretien** : « Avec Quarkus REST, j'écris des ressources Jakarta REST : `@Path` sur la classe, `@GET`,
  `@POST` sur les méthodes, et le JSON vient de `quarkus-rest-jackson`. Quarkus choisit les statuts courants : 200,
  204 pour `null` ou `void`, 404, 405, 415. La ressource est un singleton, donc sans état propre à une requête, et
  tout est préparé au build. »
cards:
  - key: extension-rest
    format: course
    question: Quelle extension ajoutes-tu pour écrire des endpoints REST avec Quarkus 3 ?
    choices:
      - {text: "`quarkus-rest`, et `quarkus-rest-jackson` pour le JSON", correct: true}
      - {text: "`quarkus-resteasy`, la pile classique, à privilégier", correct: false}
      - {text: "`quarkus-spring-web`, pour des contrôleurs Spring MVC", correct: false}
      - {text: "`quarkus-vertx-http` seule, sans autre extension", correct: false}
    answer: "Quarkus REST, l'ex-RESTEasy Reactive, est la pile REST par défaut. RESTEasy Classic est l'ancienne, remplacée ; la compatibilité Spring existe, mais n'est pas le choix naturel."
  - key: retour-null
    format: course
    question: "Que répond une méthode `@GET` qui renvoie `null` ?"
    choices:
      - {text: "204 No Content", correct: true}
      - {text: "404 Not Found", correct: false}
      - {text: "200 OK, avec le corps `null`", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "Une réponse sans entité est un 204. Pour un 404, la méthode doit le dire : `NotFoundException` ou `RestResponse.notFound()`."
  - key: portee-de-la-ressource
    format: course
    question: Combien d'instances d'une classe de ressource Quarkus REST, sans annotation de portée, servent les requêtes ?
    choices:
      - {text: "Une seule, partagée par toutes les requêtes", correct: true}
      - {text: "Une par requête, détruite à la fin de celle-ci", correct: false}
      - {text: "Une par thread du pool de workers", correct: false}
      - {text: "Une par client, gardée dans sa session", correct: false}
    answer: "Quarkus REST fait des ressources des singletons par défaut. Un champ modifiable y serait partagé entre requêtes concurrentes."
  - key: statut-d-un-post
    format: course
    question: "Que répond par défaut un `@POST` qui renvoie l'objet qu'il vient de créer ?"
    choices:
      - {text: "200 OK, avec l'objet en JSON", correct: true}
      - {text: "201 Created, avec l'objet en JSON", correct: false}
      - {text: "202 Accepted, sans corps", correct: false}
      - {text: "204 No Content, sans corps", correct: false}
    answer: "Le statut ne dépend pas du verbe : un objet renvoyé donne 200. Le 201 se demande par `@ResponseStatus(201)`, `Response.created(...)` ou `RestResponse`."
  - key: vf-sans-classe-application
    format: true-false
    question: "Avec Quarkus REST, une ressource est exposée sans qu'il faille écrire de sous-classe de `Application`."
    truth: true
    answer: "Quarkus découvre les classes `@Path` au build. `quarkus.rest.path` donne un préfixe commun si besoin."
  - key: vf-methode-void
    format: true-false
    question: "Une méthode `void` annotée `@DELETE` répond 204 No Content quand elle se termine sans erreur."
    truth: true
    answer: "Pas d'entité, donc 204 : c'est la réponse attendue d'une suppression réussie."
  - key: vf-resteasy-classic
    format: true-false
    question: "RESTEasy Classic reste la pile REST recommandée pour un nouveau projet Quarkus 3."
    truth: false
    answer: "Quarkus REST l'a remplacée : elle tire parti du build et de Vert.x, et choisit le thread de chaque endpoint."
  - key: vf-etat-dans-la-ressource
    format: true-false
    question: "Un champ modifiable d'une classe de ressource Quarkus REST, sans annotation de portée, est propre à chaque requête."
    truth: false
    answer: "La ressource est un singleton : le champ est partagé par toutes les requêtes, en parallèle."
  - key: qcm-mauvais-verbe
    format: multiple-choice
    question: "Un client envoie `GET /produits/creation`, alors que ce chemin n'a qu'une méthode `@POST`. Que reçoit-il ?"
    choices:
      - {text: "405 Method Not Allowed", correct: true}
      - {text: "404 Not Found", correct: false}
      - {text: "400 Bad Request", correct: false}
      - {text: "415 Unsupported Media Type", correct: false}
    answer: "Le chemin existe, mais pas pour ce verbe : 405. Un chemin inconnu donnerait 404."
  - key: qcm-mauvais-content-type
    format: multiple-choice
    question: "Un client poste du `text/plain` vers un `@POST` qui attend un objet en JSON. Que reçoit-il ?"
    choices:
      - {text: "415 Unsupported Media Type", correct: true}
      - {text: "406 Not Acceptable", correct: false}
      - {text: "400 Bad Request", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "415 refuse le format du corps envoyé ; 406 refuse le format demandé par `Accept`, pour la réponse."
  - key: qcm-type-d-une-chaine
    format: multiple-choice
    question: "Une méthode `@GET` renvoie une `String`, sans `@Produces`. Quel `Content-Type` a la réponse ?"
    choices:
      - {text: "`text/plain`", correct: true}
      - {text: "`application/json`", correct: false}
      - {text: "`text/html`", correct: false}
      - {text: "`application/octet-stream`", correct: false}
    answer: "Quarkus REST sert une chaîne en texte brut, et un objet en JSON quand `quarkus-rest-jackson` est présent."
  - key: qcm-prefixe-api
    format: multiple-choice
    question: "Comment places-tu toutes les ressources sous `/api`, sans modifier chaque `@Path` ?"
    choices:
      - {text: "`quarkus.rest.path=/api` dans `application.properties`", correct: true}
      - {text: "`@Path(\"/api\")` sur chaque méthode de chaque ressource", correct: false}
      - {text: "`quarkus.http.port=/api` dans `application.properties`", correct: false}
      - {text: "Un dossier `api/` dans `src/main/resources`", correct: false}
    answer: "`quarkus.rest.path` préfixe les ressources Quarkus REST. Une sous-classe d'`Application` annotée `@ApplicationPath` le permet aussi."
  - key: trous-path-classe
    format: fill-in
    question: |-
      Complète pour exposer cette ressource sous `/produits` :
      ```java
      @___("/produits")
      public class ProduitResource {
      ```
    blanks:
      - [Path]
    answer: "`@Path` sur la classe en fait une ressource ; ses méthodes y ajoutent leur propre chemin."
  - key: trous-verbe-post
    format: fill-in
    question: |-
      Complète pour que `creer` réponde à une requête de création :
      ```java
      @___
      public Produit creer(NouveauProduit nouveau) {
      ```
    blanks:
      - [POST]
    answer: "`@POST` crée une ressource ; `@PUT` la remplace, `@PATCH` la modifie en partie."
  - key: trous-chemin-avec-id
    format: fill-in
    question: |-
      Complète pour que cette méthode réponde à `GET /produits/42` :
      ```java
      @GET
      @Path("/___")
      public Produit trouver(@RestPath long id) {
      ```
    blanks:
      - ["{id}"]
    answer: "Un segment entre accolades est un paramètre de chemin, que `@RestPath` lie au paramètre de même nom."
  - key: trous-ajouter-extension
    format: fill-in
    question: |-
      Complète pour ajouter le JSON à Quarkus REST :
      ```bash
      ./mvnw quarkus:add-extension -Dextensions=___
      ```
    blanks:
      - [quarkus-rest-jackson, rest-jackson]
    answer: "`quarkus-rest-jackson` ajoute Jackson à Quarkus REST ; la CLI dit `quarkus ext add rest-jackson`."
  - key: bug-classe-sans-path
    format: bug-fix
    question: |-
      `GET /produits` répond 404 « Resource not found ». Quelle correction est la bonne ?
      ```java
      public class ProduitResource {

          @GET
          @Path("/produits")
          public List<Produit> lister() {
              return catalogue.tous();
          }
      }
      ```
    choices:
      - {text: "Annoter la classe avec `@Path(\"/produits\")` et retirer celui de la méthode", correct: true}
      - {text: "Annoter la classe avec `@ApplicationScoped`, pour qu'elle soit un bean", correct: false}
      - {text: "Ajouter `@Produces(MediaType.APPLICATION_JSON)` sur la méthode", correct: false}
      - {text: "Renommer la classe en `ProduitController`, comme le veut l'usage", correct: false}
    answer: |-
      ```java
      @Path("/produits")
      public class ProduitResource {

          @GET
          public List<Produit> lister() { ... }
      }
      ```
      Une classe n'est une ressource racine que si elle porte `@Path`. Sans lui, le `@Path` de la méthode n'est
      jamais atteint.
  - key: bug-chemin-double
    format: bug-fix
    question: |-
      `GET /produits/42` répond 404, alors que la liste `GET /produits` fonctionne. Quelle correction est la bonne ?
      ```java
      @Path("/produits")
      public class ProduitResource {

          @GET
          @Path("/produits/{id}")
          public Produit trouver(@RestPath long id) { ... }
      }
      ```
    choices:
      - {text: "Écrire `@Path(\"/{id}\")` sur la méthode", correct: true}
      - {text: "Retirer `@Path` de la classe, qui fait doublon", correct: false}
      - {text: "Remplacer `@RestPath` par `@RestQuery`", correct: false}
      - {text: "Déclarer `id` en `String` plutôt qu'en `long`", correct: false}
    answer: |-
      ```java
      @GET
      @Path("/{id}")
      public Produit trouver(@RestPath long id) { ... }
      ```
      Le chemin de la méthode s'ajoute à celui de la classe : la méthode répondait à `/produits/produits/42`.
      Retirer `@Path` de la classe casserait la liste.
  - key: bug-mauvais-verbe
    format: bug-fix
    question: |-
      Le front envoie `POST /commandes` avec la commande en JSON, et reçoit 405 Method Not Allowed. Quelle
      correction est la bonne ?
      ```java
      @Path("/commandes")
      public class CommandeResource {

          @GET
          public Commande passer(NouvelleCommande commande) {
              return service.passer(commande);
          }
      }
      ```
    choices:
      - {text: "Annoter la méthode avec `@POST` au lieu de `@GET`", correct: true}
      - {text: "Ajouter `@Consumes(MediaType.APPLICATION_JSON)`", correct: false}
      - {text: "Ajouter `@Path(\"/passer\")` sur la méthode", correct: false}
      - {text: "Faire renvoyer `void` à la méthode `passer`", correct: false}
    answer: |-
      ```java
      @POST
      public Commande passer(NouvelleCommande commande) { ... }
      ```
      Le chemin existe, mais seulement pour `GET` : d'où 405. Une création se fait en `POST`, qui porte un corps.
  - key: bug-etat-partage
    format: bug-fix
    question: |-
      En charge, des clients reçoivent le panier d'un autre client. Quelle correction est la bonne ?
      ```java
      @Path("/panier")
      public class PanierResource {

          List<Ligne> lignes = new ArrayList<>();

          @POST
          public List<Ligne> ajouter(Ligne ligne) {
              lignes.add(ligne);
              return lignes;
          }
      }
      ```
    choices:
      - {text: "Ranger chaque panier par client, dans un service ou en base", correct: true}
      - {text: "Remplacer l'`ArrayList` par une `CopyOnWriteArrayList`", correct: false}
      - {text: "Déclarer la méthode `ajouter` en `synchronized`", correct: false}
      - {text: "Annoter la ressource avec `@ApplicationScoped`", correct: false}
    answer: |-
      ```java
      @POST
      public List<Ligne> ajouter(@RestHeader("X-Client") String client, Ligne ligne) {
          return paniers.ajouter(client, ligne);   // un panier par client, dans un service
      }
      ```
      La ressource est un singleton : le champ `lignes` est commun à tous les clients. Une liste sûre pour les
      threads, ou `synchronized`, évitent la corruption, pas le partage.
