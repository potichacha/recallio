notion: openapi
lesson: |-
  **OpenAPI** décrit une API REST dans un document standard (YAML ou JSON) : ses chemins, ses paramètres, ses
  schémas, ses réponses. Les clients s'en servent pour comprendre l'API, la tester, et même générer leur code.

  Avec l'extension `quarkus-smallrye-openapi`, Quarkus **génère** ce document au build, à partir du code : les
  annotations de Jakarta REST, les types des paramètres et des retours (un record devient un schéma), et les
  contraintes de Bean Validation (`@Size(max = 50)` donne `maxLength: 50`).

  | Adresse | Contenu |
  |---|---|
  | `/q/openapi` | le document, en YAML (`?format=json` pour du JSON) |
  | `/q/swagger-ui` | Swagger UI, une page pour lire l'API et l'essayer |

  Swagger UI n'est incluse qu'en dev et en test ; `quarkus.swagger-ui.always-include=true`, fixée au build, l'inclut
  en production. Le document `/q/openapi`, lui, est servi partout.

  **Enrichir la description** avec les annotations de MicroProfile OpenAPI
  (`org.eclipse.microprofile.openapi.annotations`) :

  ```java
  @Path("/produits")
  @Tag(name = "Produits", description = "Le catalogue")
  public class ProduitResource {

      @GET
      @Path("/{id}")
      @Operation(summary = "Trouver un produit par son identifiant")
      @APIResponse(responseCode = "200", description = "Le produit")
      @APIResponse(responseCode = "404", description = "Aucun produit pour cet identifiant")
      public RestResponse<ProduitVue> trouver(@Parameter(description = "Identifiant") @RestPath long id) { ... }
  }

  public record ProduitVue(@Schema(description = "Prix en centimes", example = "1299") int prix) {}
  ```

  **Les informations générales** passent par la configuration :

  ```properties
  quarkus.smallrye-openapi.info-title=Boutique API
  quarkus.smallrye-openapi.info-version=1.0.0
  # Écrire le document au build, pour le versionner avec le code
  quarkus.smallrye-openapi.store-schema-directory=src/main/openapi
  ```

  **Code d'abord, ou contrat d'abord ?** Générer le document depuis le code (*code-first*) le garde toujours
  synchronisé avec l'implémentation. Écrire d'abord le contrat (*contract-first*), dans
  `src/main/resources/META-INF/openapi.yaml`, permet de discuter l'API avant de la coder ; Quarkus fusionne ce
  fichier avec ce qu'il génère. Versionner le document produit fait apparaître chaque changement de l'API dans les
  revues, et un client TypeScript ou Java peut en être généré.

  **Un document fidèle** : des types précis (`RestResponse<ProduitVue>` plutôt que `Response`), les réponses
  d'erreur déclarées par `@APIResponse`, et des records pour les corps.

  **En entretien** : « `quarkus-smallrye-openapi` génère la spécification au build, à partir des annotations Jakarta
  REST, des types et des contraintes de validation ; je l'enrichis avec `@Operation`, `@APIResponse` et `@Schema`.
  Elle est servie sur `/q/openapi`, avec Swagger UI en dev. Je la versionne avec le code : chaque changement d'API se
  voit en revue, et les clients en sont générés. »
cards:
  - key: extension-openapi
    format: course
    question: Quelle extension génère la spécification OpenAPI d'une application Quarkus ?
    choices:
      - {text: "`quarkus-smallrye-openapi`", correct: true}
      - {text: "`quarkus-swagger-codegen`", correct: false}
      - {text: "`quarkus-rest-openapi-generator`", correct: false}
      - {text: "`quarkus-springdoc`", correct: false}
    answer: "SmallRye OpenAPI implémente MicroProfile OpenAPI ; l'extension apporte aussi Swagger UI. Springdoc est l'équivalent côté Spring."
  - key: adresse-du-document
    format: course
    question: "À quelle adresse une application Quarkus sert-elle sa spécification OpenAPI ?"
    choices:
      - {text: "`/q/openapi`", correct: true}
      - {text: "`/v3/api-docs`", correct: false}
      - {text: "`/swagger.json`", correct: false}
      - {text: "`/api/openapi.yaml`", correct: false}
    answer: "Les points techniques de Quarkus sont sous `/q/` : `/q/openapi`, `/q/swagger-ui`, `/q/health`. `/v3/api-docs` est l'adresse de Springdoc."
  - key: source-de-la-generation
    format: course
    question: D'où SmallRye OpenAPI tire-t-il la description de l'API ?
    choices:
      - {text: "Des annotations Jakarta REST, des types et des contraintes de validation", correct: true}
      - {text: "Des requêtes reçues en dev, enregistrées puis rejouées au build", correct: false}
      - {text: "Des commentaires Javadoc, seule source lue par le générateur", correct: false}
      - {text: "D'un fichier YAML qu'il faut toujours écrire à la main avant le code", correct: false}
    answer: "Le document est généré au build à partir du code : chemins, paramètres, schémas des records, `@Size` ou `@NotBlank`. Les annotations MicroProfile OpenAPI l'enrichissent."
  - key: swagger-ui-en-production
    format: course
    question: "Swagger UI est-elle servie par défaut en production ?"
    choices:
      - {text: "Non : seulement en dev et en test, sauf `always-include`", correct: true}
      - {text: "Oui : partout, dès que l'extension est présente", correct: false}
      - {text: "Non : jamais, même avec une propriété", correct: false}
      - {text: "Oui, mais seulement pour les administrateurs", correct: false}
    answer: "`quarkus.swagger-ui.always-include=true`, fixée au build, l'inclut en production. Le document `/q/openapi`, lui, est servi partout."
  - key: vf-contraintes-dans-le-schema
    format: true-false
    question: "Une contrainte `@Size(max = 50)` sur un composant de record apparaît dans le schéma OpenAPI généré."
    truth: true
    answer: "SmallRye OpenAPI lit les contraintes de Bean Validation : `maxLength: 50`. La documentation suit la validation."
  - key: vf-response-non-type
    format: true-false
    question: "Une méthode qui renvoie `Response` donne à OpenAPI un schéma précis pour son corps."
    truth: false
    answer: "`Response` ne dit rien du type de son entité. `RestResponse<ProduitVue>`, ou une annotation `@APIResponse` avec son schéma, rendent le document fidèle."
  - key: vf-fichier-statique-fusionne
    format: true-false
    question: "Un fichier `META-INF/openapi.yaml` dans les ressources est fusionné avec la spécification générée."
    truth: true
    answer: "C'est la porte du *contract-first* : le contrat écrit à la main, complété par ce que Quarkus déduit du code."
  - key: vf-genere-au-build
    format: true-false
    question: "Quarkus génère la spécification OpenAPI au build, pas à chaque requête."
    truth: true
    answer: "Comme le reste de Quarkus, le travail est fait une fois : le document est prêt au démarrage, et peut même être écrit sur disque."
  - key: qcm-decrire-une-404
    format: multiple-choice
    question: "Comment documentes-tu qu'une méthode peut répondre 404 ?"
    choices:
      - {text: "`@APIResponse(responseCode = \"404\", description = \"Produit introuvable\")`", correct: true}
      - {text: "`@ResponseStatus(404)`, lu par le générateur de la spécification", correct: false}
      - {text: "`@Operation(summary = \"404\")`, en résumé de l'opération", correct: false}
      - {text: "`@Tag(name = \"404\")`, en étiquette de la ressource", correct: false}
    answer: "`@APIResponse` déclare une réponse possible et son sens. `@ResponseStatus(404)` changerait le statut de toutes les réponses réussies."
  - key: qcm-versionner-la-spec
    format: multiple-choice
    question: Pourquoi écrire la spécification sur disque au build et la versionner avec le code ?
    choices:
      - {text: "Chaque changement de l'API apparaît dans le diff de la revue", correct: true}
      - {text: "Quarkus ne peut pas la servir sans ce fichier dans Git", correct: false}
      - {text: "Le build est plus rapide quand le fichier existe déjà", correct: false}
      - {text: "Swagger UI ne sait lire que les fichiers versionnés", correct: false}
    answer: "`quarkus.smallrye-openapi.store-schema-directory` écrit le document ; versionné, il montre en revue chaque route ou champ ajouté, et sert à générer les clients."
  - key: qcm-titre-de-l-api
    format: multiple-choice
    question: Comment donnes-tu un titre et une version à la spécification générée ?
    choices:
      - {text: "Avec `quarkus.smallrye-openapi.info-title` et `info-version`", correct: true}
      - {text: "Avec `@Tag(name = \"Boutique API\", version = \"1.0\")`", correct: false}
      - {text: "Avec `quarkus.application.openapi-name` seulement", correct: false}
      - {text: "Avec `@Path(\"/v1\")` sur chaque ressource", correct: false}
    answer: "Les propriétés `info-*` remplissent la section `info` du document. `@OpenAPIDefinition` sur une classe `Application` le permet aussi."
  - key: qcm-swagger-ui-adresse
    format: multiple-choice
    question: "Où ouvres-tu Swagger UI en mode dev ?"
    choices:
      - {text: "`http://localhost:8080/q/swagger-ui`", correct: true}
      - {text: "`http://localhost:8080/swagger-ui.html`", correct: false}
      - {text: "`http://localhost:8080/q/dev-ui/openapi.json`", correct: false}
      - {text: "`http://localhost:8080/docs`", correct: false}
    answer: "Swagger UI est sous `/q/swagger-ui`, à côté du document `/q/openapi`. La Dev UI y mène aussi."
  - key: trous-operation
    format: fill-in
    question: |-
      Complète pour donner un résumé à cette opération :
      ```java
      @GET
      @___(summary = "Lister les produits")
      public List<ProduitVue> lister() {
      ```
    blanks:
      - [Operation]
    answer: "`@Operation` (MicroProfile OpenAPI) décrit l'opération : résumé, description, identifiant."
  - key: trous-apiresponse
    format: fill-in
    question: |-
      Complète pour documenter la réponse 404 :
      ```java
      @___(responseCode = "404", description = "Produit introuvable")
      ```
    blanks:
      - [APIResponse]
    answer: "`@APIResponse` déclare une réponse possible ; on en met une par statut."
  - key: trous-store-schema
    format: fill-in
    question: |-
      Complète pour écrire la spécification dans `src/main/openapi` à chaque build :
      ```properties
      quarkus.smallrye-openapi.___=src/main/openapi
      ```
    blanks:
      - [store-schema-directory]
    answer: "Le document y est écrit en YAML et en JSON, prêt à être versionné."
  - key: trous-schema-exemple
    format: fill-in
    question: |-
      Complète pour documenter ce composant avec un exemple :
      ```java
      public record ProduitVue(@___(description = "Prix en centimes", example = "1299") int prix) {}
      ```
    blanks:
      - [Schema]
    answer: "`@Schema` décrit un type ou une propriété : description, exemple, format."
  - key: situation-front-sans-doc
    format: scenario
    question: |-
      L'équipe front découvre les champs de l'API en lisant le code Java du backend. Que proposes-tu ?
    choices:
      - {text: "Générer la spécification OpenAPI, et en générer le client TypeScript", correct: true}
      - {text: "Rédiger un document Word des routes, mis à jour à chaque version", correct: false}
      - {text: "Donner au front un accès en lecture au code du backend", correct: false}
      - {text: "Ajouter un exemple de requête dans chaque message de commit", correct: false}
    answer: |-
      La spécification est générée du code, donc toujours juste ; Swagger UI permet d'essayer les routes, et un
      client généré casse à la compilation quand l'API change.
  - key: situation-swagger-en-production
    format: scenario
    question: |-
      Un partenaire voudrait Swagger UI sur l'API de production, qui est publique. Que proposes-tu ?
    choices:
      - {text: "Lui donner le document `/q/openapi`, servi partout, et garder Swagger UI hors production", correct: true}
      - {text: "Lancer la production en mode dev, qui sert Swagger UI d'office", correct: false}
      - {text: "Passer `QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE=true` au conteneur déjà construit", correct: false}
      - {text: "Copier à la main les fichiers de Swagger UI dans le conteneur", correct: false}
    answer: |-
      Le document suffit au partenaire, qui l'ouvre dans l'outil de son choix. Inclure Swagger UI en production
      demande `always-include` au build, et expose une page d'essai de plus.
  - key: situation-contrat-avant-le-code
    format: scenario
    question: |-
      Deux équipes doivent se mettre d'accord sur une nouvelle API avant que le backend existe. Que proposes-tu ?
    choices:
      - {text: "Écrire d'abord le contrat dans `META-INF/openapi.yaml`, puis l'implémenter", correct: true}
      - {text: "Coder le backend d'abord, puis montrer la spécification générée", correct: false}
      - {text: "Laisser le front deviner les champs, puis corriger au fil des tests", correct: false}
      - {text: "Attendre que le backend soit en production pour en discuter", correct: false}
    answer: |-
      Le contrat se discute en revue avant tout code ; Quarkus le fusionne ensuite avec ce qu'il génère. Le
      *code-first* convient quand une seule équipe fait évoluer l'API.
  - key: situation-reponses-non-documentees
    format: scenario
    question: |-
      Dans Swagger UI, toutes les méthodes de la ressource montrent un corps sans schéma. Elles renvoient
      `Response`. Que fais-tu ?
    choices:
      - {text: "Je les fais renvoyer `RestResponse<ProduitVue>`, qui porte le type du corps", correct: true}
      - {text: "J'ajoute `@Produces(MediaType.APPLICATION_JSON)` sur chacune d'elles", correct: false}
      - {text: "Je passe `quarkus.swagger-ui.always-include=true` dans le fichier", correct: false}
      - {text: "Je renomme les méthodes, pour que leur nom dise ce qu'elles renvoient", correct: false}
    answer: |-
      `Response` n'est pas typé : le générateur ne peut pas deviner le corps. `RestResponse<T>`, ou une
      `@APIResponse` avec son schéma, rendent la spécification fidèle.
