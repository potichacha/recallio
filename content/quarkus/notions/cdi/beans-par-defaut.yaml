notion: beans-par-defaut
lesson: |-
  Plusieurs beans d'un même type ne sont pas toujours une erreur : on veut parfois qu'**un seul soit actif**, selon
  le contexte. ArC offre plusieurs outils, qui agissent à des moments différents.

  | Outil | Ce qu'il fait | Quand c'est décidé |
  |---|---|---|
  | `@DefaultBean` | ce bean s'efface si un autre bean du même type existe | au build |
  | `@Alternative` + `@Priority` | ce bean remplace les autres du même type | au build |
  | `@IfBuildProfile("dev")`, `@UnlessBuildProfile` | ce bean n'existe que dans le build de ce profil | au build |
  | `@IfBuildProperty(name, stringValue)` | ce bean n'existe que si la propriété a cette valeur au build | au build |
  | `@LookupIfProperty(name, stringValue)` | ce bean n'est trouvé par `Instance<T>` que si la propriété a cette valeur | à l'exécution |

  **`@DefaultBean`** (`io.quarkus.arc.DefaultBean`) : une implémentation **par défaut**, que l'application remplace en
  déclarant simplement la sienne. Les extensions s'en servent beaucoup.

  ```java
  @DefaultBean
  @ApplicationScoped
  public class FuseauUtc implements Fuseau { ... }       // utilisé si personne d'autre ne fournit un Fuseau

  @ApplicationScoped
  public class FuseauParis implements Fuseau { ... }     // présent : c'est lui qu'on injecte
  ```

  **`@Alternative` et `@Priority`** : une alternative **activée** l'emporte sur les beans ordinaires. Sans
  `@Priority`, elle reste inactive (sauf à la sélectionner par `quarkus.arc.selected-alternatives`).

  ```java
  @Alternative
  @Priority(1)
  @ApplicationScoped
  public class RemisePremium implements Remise { ... }
  ```

  **Les profils de build.** `@IfBuildProfile("dev")` garde le bean dans un build du profil `dev` (le mode dev), et le
  retire des autres : un faux service de paiement pour le développement, par exemple. Les `@QuarkusTest` sont
  construits avec le profil `test`.

  **`@LookupIfProperty`** (`io.quarkus.arc.lookup`) agit **à l'exécution**, mais **seulement sur la recherche par
  `Instance<T>`** : le bean existe toujours, et une injection directe `@Inject Notifieur` reste ambiguë.

  ```java
  @ApplicationScoped
  @LookupIfProperty(name = "notifications.sms", stringValue = "true")
  public class NotifieurSms implements Notifieur { ... }

  @Inject Instance<Notifieur> notifieurs;    // notifieurs.get() : le mail, tant que la propriété ne vaut pas true
  ```

  **En entretien** : « `@DefaultBean` fournit une implémentation que l'application remplace en déclarant la sienne ;
  `@Alternative` avec `@Priority` remplace un bean partout. `@IfBuildProfile` et `@IfBuildProperty` choisissent au
  build, donc sans coût à l'exécution ; `@LookupIfProperty` choisit à l'exécution, mais seulement pour une recherche par
  `Instance<T>`. »
cards:
  - key: role-default-bean
    format: course
    question: "Que fait l'annotation `@DefaultBean` posée sur un bean ?"
    choices:
      - {text: "Le bean ne sert que si aucun autre bean du même type n'existe", correct: true}
      - {text: "Le bean est injecté en priorité, devant tous les autres du même type", correct: false}
      - {text: "Le bean reçoit le qualificatif `@Default` et perd tous les autres", correct: false}
      - {text: "Le bean est créé au démarrage, avant les beans ordinaires", correct: false}
    answer: "C'est une valeur par défaut qui s'efface : l'application qui déclare son propre bean du même type le remplace, sans configuration ni qualificatif."
  - key: alternative-et-priorite
    format: course
    question: "Comment un bean `@Alternative` remplace-t-il les autres beans de son type ?"
    choices:
      - {text: "Il faut l'activer avec `@Priority` ; il l'emporte alors sur les beans ordinaires", correct: true}
      - {text: "Il les remplace dès qu'il porte `@Alternative`, sans rien d'autre", correct: false}
      - {text: "Il ne les remplace que dans les tests, jamais en production", correct: false}
      - {text: "Il les remplace un appel sur deux, pour répartir la charge", correct: false}
    answer: "Une alternative sans `@Priority` reste inactive : l'injection reçoit le bean ordinaire. Avec `@Priority`, elle est activée partout, et la plus haute priorité gagne entre alternatives."
  - key: if-build-profile
    format: course
    question: "Que fait `@IfBuildProfile(\"dev\")` posé sur un bean ?"
    choices:
      - {text: "Le bean n'existe que dans un build du profil `dev`", correct: true}
      - {text: "Le bean est créé à chaque requête en mode dev", correct: false}
      - {text: "Le bean lit sa configuration dans `%dev.` seulement", correct: false}
      - {text: "Le bean est rechargé à chaud en mode dev seulement", correct: false}
    answer: "La décision est prise au build : dans un build de production, le bean n'existe pas du tout. `@UnlessBuildProfile` fait l'inverse."
  - key: lookup-if-property
    format: course
    question: "Sur quoi agit `@LookupIfProperty(name = \"notifications.sms\", stringValue = \"true\")` ?"
    choices:
      - {text: "Sur la recherche par `Instance<T>`, à l'exécution, selon la propriété", correct: true}
      - {text: "Sur l'existence du bean, décidée au build selon la propriété", correct: false}
      - {text: "Sur toutes les injections, y compris `@Inject Notifieur`", correct: false}
      - {text: "Sur le nom du bean, pris dans la valeur de la propriété", correct: false}
    answer: "Le bean existe toujours ; seule la recherche programmatique le cache tant que la propriété ne vaut pas `true`. Une injection directe le voit, et peut devenir ambiguë."
  - key: vf-default-bean-s-efface
    format: true-false
    question: "Un bean `@DefaultBean` s'efface dès qu'un autre bean du même type existe."
    truth: true
    answer: "C'est tout son intérêt : une extension ou une bibliothèque fournit un bean par défaut, que l'application remplace en déclarant le sien."
  - key: vf-if-build-profile-execution
    format: true-false
    question: "`@IfBuildProfile` est évaluée à chaque démarrage de l'application, d'après le profil actif."
    truth: false
    answer: "Elle est évaluée au build : le bean est gardé ou retiré dans l'application construite. Changer de profil au lancement n'y change rien ; `@LookupIfProperty`, lui, se décide à l'exécution."
  - key: vf-lookup-et-injection-directe
    format: true-false
    question: "`@LookupIfProperty` n'agit que sur la recherche par `Instance<T>`, pas sur une injection directe."
    truth: true
    answer: "Avec deux implémentations, dont une `@LookupIfProperty`, `@Inject Notifieur` échoue au build sur une ambiguïté. On passe par `Instance<Notifieur>`."
  - key: vf-alternative-sans-priorite
    format: true-false
    question: "Une `@Alternative` sans `@Priority` est active par défaut dans Quarkus."
    truth: false
    answer: "Elle reste inactive : l'injection reçoit le bean ordinaire. On l'active avec `@Priority`, ou par la propriété `quarkus.arc.selected-alternatives`."
  - key: qcm-remplacer-un-bean-par-defaut
    format: multiple-choice
    question: "Une bibliothèque fournit `HorlogeSysteme`, un bean `Horloge` annoté `@DefaultBean`. Comment le remplacer dans ton application ?"
    choices:
      - {text: "Déclarer ton propre bean de type `Horloge`", correct: true}
      - {text: "Annoter ton bean `@Named(\"horloge\")`", correct: false}
      - {text: "Exclure la bibliothèque du `pom.xml`", correct: false}
      - {text: "Ajouter `@Unremovable` à ton bean", correct: false}
    answer: "Le bean par défaut s'efface devant le tien, sans autre configuration. Exclure la bibliothèque retirerait aussi tout ce qu'elle apporte d'autre."
  - key: qcm-build-de-test
    format: multiple-choice
    question: "Quelle annotation garde un bean dans le build des tests `@QuarkusTest`, et le retire du build de production ?"
    choices:
      - {text: "`@IfBuildProfile(\"test\")`", correct: true}
      - {text: "`@LookupIfProperty(name = \"test\")`", correct: false}
      - {text: "`@Alternative` sans `@Priority`", correct: false}
      - {text: "`@DefaultBean`", correct: false}
    answer: "Les `@QuarkusTest` sont construits avec le profil `test`. Le bean n'existe donc que là ; un bean placé dans `src/test/java` aurait le même effet."
  - key: qcm-propriete-de-build
    format: multiple-choice
    question: "Quelle annotation garde un bean seulement si une propriété a une valeur donnée au moment du build ?"
    choices:
      - {text: "`@IfBuildProperty`", correct: true}
      - {text: "`@LookupIfProperty`", correct: false}
      - {text: "`@ConfigProperty`", correct: false}
      - {text: "`@IfBuildProfile`", correct: false}
    answer: "`@IfBuildProperty(name = \"paiement.fournisseur\", stringValue = \"stripe\")` décide au build. `@LookupIfProperty` décide à l'exécution, pour `Instance<T>` seulement."
  - key: qcm-activer-une-alternative
    format: multiple-choice
    question: "Que faut-il ajouter à `@Alternative` pour activer l'alternative sans aucune configuration ?"
    choices:
      - {text: "`@Priority`", correct: true}
      - {text: "`@Default`", correct: false}
      - {text: "`@Startup`", correct: false}
      - {text: "`@Unremovable`", correct: false}
    answer: "`@Priority(1)` active l'alternative pour toute l'application. Entre plusieurs alternatives actives, la plus haute priorité l'emporte."
  - key: trous-default-bean
    format: fill-in
    question: |-
      Complète pour que ce bean serve seulement si l'application ne fournit pas son propre `Fuseau` :
      ```java
      @___
      @ApplicationScoped
      public class FuseauUtc implements Fuseau {
      ```
    blanks:
      - [DefaultBean]
    answer: "`@DefaultBean` (`io.quarkus.arc.DefaultBean`) : un autre bean `Fuseau` le fait s'effacer."
  - key: trous-priority
    format: fill-in
    question: |-
      Complète pour activer cette alternative dans toute l'application :
      ```java
      @Alternative
      @___(1)
      @ApplicationScoped
      public class RemisePremium implements Remise {
      ```
    blanks:
      - [Priority]
    answer: "`@Priority` (de `jakarta.annotation`) active l'alternative et la classe parmi les autres."
  - key: trous-if-build-profile
    format: fill-in
    question: |-
      Complète pour que ce faux service de paiement n'existe qu'en mode dev :
      ```java
      @___("dev")
      @ApplicationScoped
      public class FauxPaiement implements Paiement {
      ```
    blanks:
      - [IfBuildProfile]
    answer: "`@IfBuildProfile(\"dev\")` : le bean n'existe que dans le build du mode dev. Le vrai service peut alors porter `@DefaultBean`, ou `@UnlessBuildProfile(\"dev\")`."
  - key: trous-lookup-if-property
    format: fill-in
    question: |-
      Complète pour que `Instance<Notifieur>` ne trouve ce bean que si la propriété vaut `true`, réglable sans
      reconstruire l'application :
      ```java
      @ApplicationScoped
      @___(name = "notifications.sms", stringValue = "true")
      public class NotifieurSms implements Notifieur {
      ```
    blanks:
      - [LookupIfProperty]
    answer: "`@LookupIfProperty` se décide à l'exécution, pour la seule recherche par `Instance<T>`. `@IfBuildProperty` déciderait au build."
  - key: situation-faux-paiement-en-dev
    format: scenario
    question: |-
      En développement, tu veux un faux service de paiement qui accepte tout ; il ne doit jamais se retrouver dans
      l'application de production. Comment l'écris-tu ?
    choices:
      - {text: "Un bean `@IfBuildProfile(\"dev\")`, le vrai service portant `@DefaultBean`", correct: true}
      - {text: "Un `if` sur le profil actif dans chaque méthode du vrai service", correct: false}
      - {text: "Un bean `@LookupIfProperty`, activé par une propriété en dev", correct: false}
      - {text: "Un commentaire à retirer avant chaque livraison en production", correct: false}
    answer: |-
      Le faux bean n'existe que dans le build du mode dev ; là, il remplace le vrai, qui s'efface en tant que bean par
      défaut. En production, le faux est absent du build : aucun risque de l'activer par erreur.
  - key: situation-bibliotheque-surchargeable
    format: scenario
    question: |-
      Ta bibliothèque interne fournit un `GenerateurIdentifiants`, que certaines applications veulent remplacer par le
      leur, sans configuration. Comment déclares-tu l'implémentation de la bibliothèque ?
    choices:
      - {text: "Avec `@DefaultBean` : un bean de l'application la remplace d'office", correct: true}
      - {text: "Avec `@Alternative @Priority(1000)`, pour qu'elle passe toujours devant", correct: false}
      - {text: "Avec `@Named(\"defaut\")`, que les applications éviteront d'injecter", correct: false}
      - {text: "Avec `@Singleton`, pour qu'elle ne soit créée qu'une fois", correct: false}
    answer: |-
      L'application qui veut son propre générateur déclare un bean du même type, et c'est tout. Une alternative
      prioritaire ferait l'inverse : elle écraserait le bean de l'application.
  - key: situation-sms-sans-redeploiement
    format: scenario
    question: |-
      L'envoi par SMS doit pouvoir s'activer en production en changeant une variable d'environnement, sans
      reconstruire l'application. Les autres envois passent par mail. Que proposes-tu ?
    choices:
      - {text: "`@LookupIfProperty` sur le bean SMS, et une recherche par `Instance<Notifieur>`", correct: true}
      - {text: "`@IfBuildProperty` sur le bean SMS, avec la variable d'environnement", correct: false}
      - {text: "`@IfBuildProfile(\"prod\")` sur le bean SMS, actif en production", correct: false}
      - {text: "`@Alternative` sans `@Priority` sur le bean SMS, activée au besoin", correct: false}
    answer: |-
      Seul `@LookupIfProperty` se décide au démarrage, donc d'après l'environnement. Les annotations `@IfBuild...` sont
      figées dans l'application construite.
  - key: situation-module-premium
    format: scenario
    question: |-
      Un module « premium », ajouté comme dépendance, doit remplacer partout le calcul de remise standard dès qu'il est
      présent. Comment déclares-tu sa `RemisePremium` ?
    choices:
      - {text: "`@Alternative` avec `@Priority`, pour l'emporter sur le bean standard", correct: true}
      - {text: "`@DefaultBean`, pour qu'elle serve quand le standard manque", correct: false}
      - {text: "`@Named(\"premium\")`, à injecter sous ce nom partout", correct: false}
      - {text: "`@LookupIfProperty`, pour qu'elle soit trouvée à l'exécution", correct: false}
    answer: |-
      Une alternative activée remplace le bean ordinaire à tous les points d'injection, sans les modifier. Le bean
      standard pourrait aussi porter `@DefaultBean` : la seule présence de `RemisePremium` le ferait s'effacer.
