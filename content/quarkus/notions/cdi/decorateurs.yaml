notion: decorateurs
lesson: |-
  Un **décorateur** enveloppe les beans d'une **interface métier** pour en modifier le comportement. Là où un
  intercepteur est générique (il ne connaît que la méthode et ses arguments), le décorateur **implémente l'interface**
  : il appelle les vraies méthodes, avec leurs types.

  ```java
  public interface Paiement {
      Recu payer(String client, int montant);
  }

  @Decorator                                    // jakarta.decorator.Decorator
  @Priority(10)                                 // active le décorateur, et l'ordonne
  public abstract class PlafondDePaiement implements Paiement {

      @Inject
      @Delegate                                 // le bean décoré (ou le décorateur suivant)
      Paiement delegue;

      @Override
      public Recu payer(String client, int montant) {
          if (montant > 5_000) {
              throw new PlafondDepasseException(client, montant);
          }
          return delegue.payer(client, montant);
      }
  }
  ```

  **Les règles.**

  - Le décorateur s'applique à **tous les beans** qui ont le type décoré (ici, `Paiement`).
  - Il peut être **abstrait** : il ne redéfinit que les méthodes qu'il décore ; les autres vont directement au bean.
  - Le point d'injection **`@Delegate`** reçoit le bean décoré ; c'est par lui qu'on appelle le vrai comportement.
  - `@Priority` l'active et fixe l'ordre quand il y en a plusieurs.

  **Décorateur ou intercepteur ?**

  | | Intercepteur | Décorateur |
  |---|---|---|
  | Connaît | la méthode et ses arguments, sans leur sens | l'interface métier, ses types |
  | S'applique à | toute méthode qui porte la liaison | tous les beans d'un type |
  | Sert à | journal, mesure, transaction, sécurité | une règle métier ajoutée à une interface |

  Les décorateurs restent rares : souvent, une simple composition (un bean qui en appelle un autre) est plus lisible.
  ArC les prend en charge, bien qu'ils ne fassent pas partie de CDI Lite.

  **En entretien** : « Un décorateur implémente la même interface que les beans qu'il enveloppe, reçoit le bean décoré
  par un point d'injection `@Delegate`, et s'active avec `@Priority`. Contrairement à un intercepteur, générique, il
  connaît l'interface métier : il sert à ajouter une règle métier, comme un plafond de paiement, à tous les beans d'un
  type. »
cards:
  - key: ce-qu-est-un-decorateur
    format: course
    question: "Qu'est-ce qu'un décorateur CDI ?"
    choices:
      - {text: "Un bean qui implémente une interface métier et enveloppe les beans de ce type", correct: true}
      - {text: "Une annotation qui ajoute des métadonnées d'affichage à un bean", correct: false}
      - {text: "Un intercepteur appliqué à toutes les méthodes de l'application", correct: false}
      - {text: "Une classe générée par ArC pour le proxy client d'un bean", correct: false}
    answer: "Le décorateur se place entre l'appelant et le bean : il implémente la même interface, fait son travail, puis appelle le bean décoré par son délégué."
  - key: decorateur-ou-intercepteur
    format: course
    question: "Qu'est-ce qui distingue un décorateur d'un intercepteur ?"
    choices:
      - {text: "Le décorateur connaît l'interface métier ; l'intercepteur reste générique", correct: true}
      - {text: "Le décorateur s'exécute au build ; l'intercepteur à l'exécution", correct: false}
      - {text: "Le décorateur ne s'applique qu'aux beans `@Singleton`", correct: false}
      - {text: "Le décorateur ne peut pas appeler le bean qu'il enveloppe", correct: false}
    answer: "Un intercepteur voit une méthode et des arguments de type `Object` : idéal pour le journal ou la mesure. Un décorateur manipule des types métier : idéal pour une règle métier."
  - key: appeler-le-bean-decore
    format: course
    question: "Comment un décorateur appelle-t-il le bean qu'il décore ?"
    choices:
      - {text: "Par son point d'injection annoté `@Inject @Delegate`", correct: true}
      - {text: "Par `InvocationContext.proceed()`, comme un intercepteur", correct: false}
      - {text: "Par `super.payer(...)`, en héritant de la classe du bean", correct: false}
      - {text: "Par `CDI.current().select(Paiement.class).get()`", correct: false}
    answer: "Le délégué est le bean décoré, ou le décorateur suivant. `proceed()` appartient aux intercepteurs ; une recherche par `CDI.current()` retomberait sur le décorateur."
  - key: decorateur-abstrait
    format: course
    question: "Pourquoi déclare-t-on souvent un décorateur `abstract` ?"
    choices:
      - {text: "Il ne redéfinit que les méthodes qu'il décore ; les autres vont au bean", correct: true}
      - {text: "Un décorateur concret serait instancié deux fois par le conteneur", correct: false}
      - {text: "La spécification interdit tout décorateur qui ne serait pas abstrait", correct: false}
      - {text: "Un décorateur abstrait s'applique aussi aux beans `@Dependent`", correct: false}
    answer: "Une interface de dix méthodes n'oblige pas à en écrire dix : le conteneur transmet directement au délégué celles que le décorateur ne redéfinit pas."
  - key: vf-tous-les-beans-du-type
    format: true-false
    question: "Un décorateur de `Paiement` s'applique à tous les beans qui ont le type `Paiement`."
    truth: true
    answer: "Il n'y a pas de liaison à poser : le type suffit. Carte, virement, PayPal : chaque bean `Paiement` est enveloppé."
  - key: vf-toutes-les-methodes
    format: true-false
    question: "Un décorateur doit implémenter toutes les méthodes de l'interface qu'il décore."
    truth: false
    answer: "Il peut être abstrait, et ne redéfinir que les méthodes qui l'intéressent ; les autres sont transmises au bean décoré."
  - key: vf-active-par-priority
    format: true-false
    question: "Dans Quarkus, `@Priority` active un décorateur et fixe sa place parmi les autres décorateurs."
    truth: true
    answer: "Comme pour un intercepteur, la priorité active le décorateur pour toute l'application et ordonne les décorateurs d'un même type."
  - key: vf-decorateur-toutes-les-methodes-de-l-application
    format: true-false
    question: "Un décorateur s'applique à toutes les méthodes de tous les beans de l'application."
    truth: false
    answer: "Il ne s'applique qu'aux beans du type qu'il implémente, et seulement aux méthodes de ce type. Pour un comportement transverse, on choisit un intercepteur."
  - key: qcm-annotation-delegate
    format: multiple-choice
    question: "Quelle annotation marque, dans un décorateur, le point d'injection du bean décoré ?"
    choices:
      - {text: "`@Delegate`", correct: true}
      - {text: "`@Decorated`", correct: false}
      - {text: "`@Target`", correct: false}
      - {text: "`@Proceed`", correct: false}
    answer: "`@Inject @Delegate Paiement delegue;`. Il y a un seul point d'injection délégué par décorateur, du type décoré."
  - key: qcm-besoin-d-un-decorateur
    format: multiple-choice
    question: "Lequel de ces besoins convient le mieux à un décorateur, plutôt qu'à un intercepteur ?"
    choices:
      - {text: "Refuser tout paiement au-delà d'un plafond, quel que soit le moyen", correct: true}
      - {text: "Mesurer la durée de toutes les méthodes des services", correct: false}
      - {text: "Ouvrir une transaction autour de chaque méthode d'écriture", correct: false}
      - {text: "Écrire dans le journal le nom de chaque méthode appelée", correct: false}
    answer: "Le plafond est une règle métier sur `payer(client, montant)` : le décorateur lit le montant, typé. Mesurer, journaliser ou ouvrir une transaction sont des besoins transverses, pour un intercepteur."
  - key: qcm-annotation-de-la-classe
    format: multiple-choice
    question: "Quelle annotation fait d'une classe un décorateur ?"
    choices:
      - {text: "`@Decorator`", correct: true}
      - {text: "`@Interceptor`", correct: false}
      - {text: "`@Alternative`", correct: false}
      - {text: "`@Stereotype`", correct: false}
    answer: "`@Decorator`, accompagnée de `@Priority` pour l'activer. `@Interceptor` désigne un intercepteur, `@Alternative` un bean de remplacement."
  - key: qcm-package-decorateur
    format: multiple-choice
    question: "Dans quel package se trouvent `@Decorator` et `@Delegate` ?"
    choices:
      - {text: "`jakarta.decorator`", correct: true}
      - {text: "`jakarta.interceptor`", correct: false}
      - {text: "`jakarta.enterprise.inject`", correct: false}
      - {text: "`io.quarkus.arc`", correct: false}
    answer: "`jakarta.decorator.Decorator` et `jakarta.decorator.Delegate`. Les intercepteurs ont leur propre package, `jakarta.interceptor`."
