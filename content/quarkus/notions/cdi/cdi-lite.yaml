notion: cdi-lite
lesson: |-
  Depuis CDI 4.0 (Jakarta EE 10), la spécification se découpe en deux :

  - **CDI Lite**, un sous-ensemble conçu pour être **résolu au build** : beans, portées, injection, qualificatifs,
    producteurs, événements, intercepteurs, et une API d'extension faite pour le build, les **Build Compatible
    Extensions** ;
  - **CDI Full**, qui ajoute ce qui suppose un conteneur vivant, à l'exécution : les **extensions portables**, la
    spécialisation, la passivation, les décorateurs, `@ConversationScoped`.

  **ArC implémente CDI Lite**, plus une partie de CDI Full, plus ses propres fonctions.

  | Ce que fait ArC | |
  |---|---|
  | Pris en charge | beans, portées, injection, qualificatifs, producteurs, événements, intercepteurs, **décorateurs**, Build Compatible Extensions |
  | Non pris en charge | extensions portables (`jakarta.enterprise.inject.spi.Extension`), `@Specializes`, `@ConversationScoped`, la passivation, `@Interceptors` sur une classe |
  | Ignoré | le contenu de `beans.xml` (le mode de découverte `all` n'existe pas) |
  | Ajouté par Quarkus | suppression des beans inutilisés, `@DefaultBean`, `@All`, `@Unremovable`, interception des appels internes et des méthodes statiques, `@Inject` facultatif sur un constructeur unique |

  **Pourquoi pas les extensions portables ?** Elles observent, **au démarrage**, la découverte des beans par le
  conteneur, et peuvent tout modifier par réflexion, au travers du `BeanManager`. C'est exactement ce que Quarkus évite
  : un conteneur qui se construit au démarrage. Leur équivalent dans Quarkus est une **extension Quarkus** (des
  `@BuildStep` qui travaillent sur l'index Jandex), ou une Build Compatible Extension, l'API standard de CDI Lite pour
  agir au build.

  **Ce que cela change pour toi.** Une application CDI ordinaire, faite de beans, d'injections, de producteurs et
  d'intercepteurs, fonctionne telle quelle. Une bibliothèque qui repose sur une extension portable ne fonctionne pas
  sans une extension Quarkus qui la remplace ; c'est le rôle de nombreuses extensions du catalogue.

  **En entretien** : « CDI 4 distingue CDI Lite, résoluble au build, et CDI Full. ArC implémente CDI Lite, avec les
  décorateurs en plus, mais pas les extensions portables, qui modifient le conteneur au démarrage par réflexion : dans
  Quarkus, on les remplace par une extension Quarkus ou une Build Compatible Extension. Et ArC ajoute ses propres
  fonctions, comme la suppression des beans inutilisés. »
cards:
  - key: ce-qu-est-cdi-lite
    format: course
    question: "Qu'est-ce que CDI Lite ?"
    choices:
      - {text: "Le sous-ensemble de CDI 4 conçu pour être résolu au build", correct: true}
      - {text: "Une version de CDI réservée aux applications mobiles Android", correct: false}
      - {text: "L'ancien nom de CDI, avant son passage chez Jakarta EE", correct: false}
      - {text: "Une implémentation de CDI écrite par Red Hat pour Quarkus", correct: false}
    answer: "CDI 4.0 a défini CDI Lite pour des conteneurs comme ArC, qui préparent tout au build. CDI Full y ajoute ce qui demande un conteneur actif à l'exécution."
  - key: non-pris-en-charge
    format: course
    question: "Quelle fonction de CDI ArC ne prend-il pas en charge ?"
    choices:
      - {text: "Les extensions portables (`jakarta.enterprise.inject.spi.Extension`)", correct: true}
      - {text: "Les méthodes productrices annotées `@Produces`", correct: false}
      - {text: "Les observateurs d'événements `@Observes`", correct: false}
      - {text: "Les intercepteurs liés par `@InterceptorBinding`", correct: false}
    answer: "Les extensions portables modifient le conteneur au démarrage, par réflexion : le contraire du build time. Producteurs, observateurs et intercepteurs font partie de CDI Lite."
  - key: api-d-extension-du-build
    format: course
    question: "Quelle API d'extension de CDI Lite ArC accepte-t-il ?"
    choices:
      - {text: "Les Build Compatible Extensions, qui agissent au build", correct: true}
      - {text: "Les extensions portables, chargées par le `ServiceLoader`", correct: false}
      - {text: "Les fichiers `beans.xml`, avec le mode de découverte `all`", correct: false}
      - {text: "Les agents Java déclarés dans le manifeste du jar", correct: false}
    answer: "Une Build Compatible Extension (`jakarta.enterprise.inject.build.compatible.spi`) décrit, en standard, ce qu'il faut faire au build. Dans Quarkus, une extension Quarkus avec ses `@BuildStep` reste l'outil le plus puissant."
  - key: contenu-de-beans-xml
    format: course
    question: "Que fait Quarkus du contenu d'un fichier `beans.xml` ?"
    choices:
      - {text: "Il l'ignore : la découverte se fait par les annotations", correct: true}
      - {text: "Il l'applique, comme tout conteneur CDI complet", correct: false}
      - {text: "Il refuse de construire l'application qui en contient un", correct: false}
      - {text: "Il le convertit en `application.properties` au build", correct: false}
    answer: "Seules les annotations définissant un bean comptent. Un `beans.xml` dans un jar sert seulement à signaler que ce jar doit être indexé."
  - key: vf-extensions-portables
    format: true-false
    question: "ArC prend en charge les extensions portables de CDI, qui implémentent `jakarta.enterprise.inject.spi.Extension`."
    truth: false
    answer: "Elles demandent un conteneur qui se construit à l'exécution. Quarkus les remplace par ses propres extensions, ou par des Build Compatible Extensions."
  - key: vf-conversation-scoped
    format: true-false
    question: "La portée `@ConversationScoped` est disponible dans Quarkus."
    truth: false
    answer: "Elle fait partie de CDI Full, et suppose des sessions web passivables, que Quarkus ne prend pas en charge. Un état qui dure plusieurs requêtes se garde en base ou côté client."
  - key: vf-au-dela-de-cdi-lite
    format: true-false
    question: "ArC va au-delà de CDI Lite, avec des fonctions propres comme `@DefaultBean` ou la suppression des beans inutilisés."
    truth: true
    answer: "Ces ajouts tirent parti du build : connaître tout le graphe permet de retirer l'inutile, ou de laisser un bean par défaut s'effacer."
  - key: vf-decorateurs-dans-arc
    format: true-false
    question: "Les décorateurs CDI fonctionnent dans Quarkus, bien qu'ils ne fassent pas partie de CDI Lite."
    truth: true
    answer: "ArC prend en charge les décorateurs (`@Decorator`, `@Delegate`), comme les intercepteurs. Ils restent rares, mais une application qui en utilise n'a rien à changer."
  - key: qcm-pourquoi-pas-portables
    format: multiple-choice
    question: "Pourquoi les extensions portables de CDI ne conviennent-elles pas à Quarkus ?"
    choices:
      - {text: "Elles modifient le conteneur au démarrage, par réflexion, au lieu du build", correct: true}
      - {text: "Elles sont écrites en XML, un format que Quarkus ne sait pas lire", correct: false}
      - {text: "Elles ne fonctionnent qu'avec les EJB, absents de Quarkus", correct: false}
      - {text: "Elles demandent une licence commerciale de la fondation Eclipse", correct: false}
    answer: "Une extension portable observe la découverte des beans à l'exécution et peut tout y changer. ArC ayant tout décidé au build, il n'y a plus rien à observer au démarrage."
  - key: qcm-specializes
    format: multiple-choice
    question: "Laquelle de ces annotations de CDI n'est pas prise en charge par ArC ?"
    choices:
      - {text: "`@Specializes`", correct: true}
      - {text: "`@Alternative`", correct: false}
      - {text: "`@Disposes`", correct: false}
      - {text: "`@ObservesAsync`", correct: false}
    answer: "La spécialisation (un bean qui en remplace un autre en héritant de lui) relève de CDI Full. Pour remplacer un bean, on utilise `@Alternative` avec `@Priority`, ou `@DefaultBean`."
  - key: qcm-remplacer-une-extension-portable
    format: multiple-choice
    question: "Une bibliothèque repose sur une extension portable de CDI. Comment l'utiliser dans Quarkus ?"
    choices:
      - {text: "Par une extension Quarkus qui fait son travail au build", correct: true}
      - {text: "En déclarant l'extension portable dans `application.properties`", correct: false}
      - {text: "En activant CDI Full avec la propriété `quarkus.arc.full`", correct: false}
      - {text: "En ajoutant un `beans.xml` au mode de découverte `all`", correct: false}
    answer: "Beaucoup d'extensions du catalogue existent précisément pour cela : elles refont au build ce que l'extension portable faisait au démarrage. Il n'existe pas de mode « CDI Full » à activer."
  - key: qcm-fonction-propre-a-arc
    format: multiple-choice
    question: "Laquelle de ces fonctions est propre à ArC, absente de la spécification CDI ?"
    choices:
      - {text: "L'injection de `@All List<T>`", correct: true}
      - {text: "L'injection de `Instance<T>`", correct: false}
      - {text: "Les qualificatifs marqués `@Qualifier`", correct: false}
      - {text: "Les observateurs `@ObservesAsync`", correct: false}
    answer: "`@All` (`io.quarkus.arc.All`) injecte tous les beans d'un type. `Instance<T>`, les qualificatifs et les observateurs asynchrones sont standard."
  - key: def-cdi-lite
    format: definition
    question: "Quel terme désigne le sous-ensemble de CDI 4.0 conçu pour les conteneurs qui résolvent l'injection au build ?"
    choices:
      - {text: "CDI Lite", correct: true}
      - {text: "CDI SE", correct: false}
      - {text: "CDI Core", correct: false}
      - {text: "CDI Micro", correct: false}
    answer: "CDI Lite garde l'essentiel (beans, portées, injection, événements, intercepteurs) et propose une API d'extension pour le build. CDI SE désigne l'usage de CDI hors de Jakarta EE, en Java SE."
  - key: def-extension-portable
    format: definition
    question: "Quel terme désigne, en CDI, une classe qui observe le démarrage du conteneur pour ajouter ou modifier des beans à l'exécution ?"
    choices:
      - {text: "Une extension portable (portable extension)", correct: true}
      - {text: "Une extension Quarkus (Quarkus extension)", correct: false}
      - {text: "Un stéréotype (stereotype)", correct: false}
      - {text: "Un producteur (producer method)", correct: false}
    answer: "Elle implémente `jakarta.enterprise.inject.spi.Extension` et réagit aux événements du cycle de vie du conteneur. ArC ne les prend pas en charge."
  - key: def-build-compatible-extension
    format: definition
    question: "Quel terme désigne l'API d'extension standard de CDI Lite, qui agit sur les beans pendant le build ?"
    choices:
      - {text: "Une Build Compatible Extension", correct: true}
      - {text: "Une extension portable", correct: false}
      - {text: "Un `BeanManager`", correct: false}
      - {text: "Un `ServiceLoader`", correct: false}
    answer: "Elle déclare des méthodes appelées à des phases du build (découverte, enrichissement, validation). C'est l'équivalent standard, et plus limité, d'une extension Quarkus."
  - key: def-cdi-full
    format: definition
    question: "Quel terme désigne la spécification CDI complète, qui ajoute à CDI Lite les extensions portables, la spécialisation et la passivation ?"
    choices:
      - {text: "CDI Full", correct: true}
      - {text: "CDI Lite", correct: false}
      - {text: "CDI Enterprise", correct: false}
      - {text: "CDI Classic", correct: false}
    answer: "CDI Full est ce qu'implémentent Weld et OpenWebBeans, dans les serveurs d'applications. Quarkus s'en tient à CDI Lite, plus quelques fonctions comme les décorateurs."
