notion: securite-annotations
lesson: |-
  Une extension de sécurité (`quarkus-oidc`, `quarkus-smallrye-jwt`...) établit **qui appelle**. Les annotations
  disent **qui a le droit** d'appeler un endpoint.

  ```java
  @Path("/produits")
  @Authenticated                       // par défaut : tout utilisateur connecté
  public class ProduitResource {

      @GET
      @PermitAll                       // le catalogue est public
      public List<Produit> lister() { ... }

      @POST
      @RolesAllowed("admin")           // seuls les admins créent
      public Response creer(NouveauProduit nouveau) { ... }

      @DELETE
      @Path("/{id}")
      @RolesAllowed({"admin", "moderateur"})   // l'un ou l'autre rôle
      public void supprimer(@PathParam("id") long id) { ... }
  }
  ```

  | Annotation | Qui passe |
  |---|---|
  | `@PermitAll` | tout le monde, même sans jeton |
  | `@Authenticated` (`io.quarkus.security`) | tout utilisateur authentifié |
  | `@RolesAllowed("admin")` | un utilisateur qui a **l'un** des rôles cités |
  | `@DenyAll` | personne |

  `@PermitAll`, `@RolesAllowed` et `@DenyAll` viennent de `jakarta.annotation.security`. Quarkus accepte aussi
  `@RolesAllowed("**")` : tout utilisateur authentifié.

  **401 ou 403 ?** Un appel **sans identité** (pas de jeton, ou un jeton invalide) reçoit **401 Unauthorized** : il faut
  s'authentifier. Un utilisateur **authentifié sans le bon rôle** reçoit **403 Forbidden** : il est connu, mais n'a
  pas le droit.

  **Quelle annotation l'emporte ?** Celle de la **méthode** l'emporte sur celle de la classe. Celle de la classe vaut
  pour toutes les méthodes qui n'en ont pas.

  **Un endpoint sans annotation est ouvert.** Ajouter `quarkus-oidc` ne protège rien à lui seul : un endpoint sans
  annotation ni permission HTTP répond à tout le monde. Deux garde-fous :

  ```properties
  # refuser tout endpoint sans annotation de sécurité
  quarkus.security.jaxrs.deny-unannotated-endpoints=true
  # ou : exiger ce rôle sur tout endpoint sans annotation
  quarkus.security.jaxrs.default-roles-allowed=user
  ```

  **Au-delà des endpoints.** Ces annotations marchent aussi sur les méthodes d'un bean CDI (un service) : un appel
  refusé lève `UnauthorizedException` ou `ForbiddenException` (`io.quarkus.security`). Pour des droits plus fins
  qu'un rôle, `@PermissionsAllowed("commandes:lire")` vérifie une permission.

  **Les pièges.** Les noms de rôles **respectent la casse** (`Admin` n'est pas `admin`) ; `@RolesAllowed({"admin,
  moderateur"})` déclare un seul rôle, nommé « admin, moderateur », qu'aucun utilisateur n'a ; et `@Authenticated` ne
  vérifie aucun rôle.

  **En entretien** : « Je protège les endpoints par `@Authenticated`, `@RolesAllowed` et `@PermitAll`, l'annotation
  de la méthode l'emportant sur celle de la classe. Sans identité, c'est 401 ; sans le rôle, c'est 403. Comme un
  endpoint sans annotation reste ouvert, je mets `deny-unannotated-endpoints`, ou une permission HTTP qui exige
  l'authentification partout. »
cards:
  - key: sens-d-authenticated
    format: course
    question: "Qui peut appeler un endpoint annoté `@Authenticated` ?"
    choices:
      - {text: "Tout utilisateur authentifié, quels que soient ses rôles", correct: true}
      - {text: "Seulement les utilisateurs qui ont le rôle `authenticated`", correct: false}
      - {text: "Tout le monde, mais l'identité est journalisée", correct: false}
      - {text: "Seulement les administrateurs de l'application", correct: false}
    answer: "`@Authenticated` (`io.quarkus.security`) exige une identité, sans rôle particulier. `@RolesAllowed(\"**\")` dit la même chose."
  - key: difference-401-403
    format: course
    question: "Quelle différence entre une réponse 401 et une réponse 403 sur un endpoint `@RolesAllowed(\"admin\")` ?"
    choices:
      - {text: "401 : pas d'identité ; 403 : identité connue, sans le rôle", correct: true}
      - {text: "401 : identité connue, sans le rôle ; 403 : pas d'identité", correct: false}
      - {text: "401 : jeton expiré ; 403 : jeton signé par un autre émetteur", correct: false}
      - {text: "Aucune : Quarkus renvoie l'un ou l'autre au hasard", correct: false}
    answer: "401 Unauthorized demande de s'authentifier ; 403 Forbidden dit que l'utilisateur, bien identifié, n'a pas le droit. Un jeton expiré ou mal signé ne donne pas d'identité : 401."
  - key: role-de-denyall
    format: course
    question: "Que fait `@DenyAll` sur une méthode d'endpoint ?"
    choices:
      - {text: "Il refuse l'accès à tout le monde, admins compris", correct: true}
      - {text: "Il refuse l'accès aux seuls utilisateurs anonymes", correct: false}
      - {text: "Il refuse les requêtes qui n'ont pas de corps JSON", correct: false}
      - {text: "Il annule les annotations de sécurité de la classe", correct: false}
    answer: "Personne ne passe : utile pour fermer une méthode le temps d'une migration, ou dans une classe ouverte par défaut."
  - key: origine-des-annotations
    format: course
    question: "De quel paquet viennent `@RolesAllowed`, `@PermitAll` et `@DenyAll` ?"
    choices:
      - {text: "`jakarta.annotation.security`", correct: true}
      - {text: "`io.quarkus.security`", correct: false}
      - {text: "`org.eclipse.microprofile.jwt`", correct: false}
      - {text: "`jakarta.ws.rs.security`", correct: false}
    answer: "Ce sont les annotations standard de Jakarta. `@Authenticated`, propre à Quarkus, vient de `io.quarkus.security`."
  - key: vf-oidc-protege-tout
    format: true-false
    question: "Une fois `quarkus-oidc` ajouté, un endpoint sans annotation exige un jeton."
    truth: false
    answer: "L'extension sait authentifier, mais un endpoint sans annotation ni permission HTTP reste ouvert. `quarkus.security.jaxrs.deny-unannotated-endpoints=true` ou une permission `authenticated` le ferment."
  - key: vf-methode-l-emporte
    format: true-false
    question: "`@RolesAllowed(\"admin\")` sur une méthode l'emporte sur `@PermitAll` posé sur sa classe."
    truth: true
    answer: "L'annotation de la méthode est la plus précise : elle remplace celle de la classe pour cette méthode."
  - key: vf-casse-des-roles
    format: true-false
    question: "`@RolesAllowed(\"Admin\")` laisse passer un utilisateur qui a le rôle `admin`."
    truth: false
    answer: "Les rôles sont comparés exactement, casse comprise : `Admin` et `admin` sont deux rôles différents. L'utilisateur reçoit 403."
  - key: vf-sur-un-service
    format: true-false
    question: "`@RolesAllowed` fonctionne aussi sur la méthode d'un bean CDI, comme un service, pas seulement sur un endpoint."
    truth: true
    answer: "Un intercepteur vérifie l'identité courante ; un refus lève `UnauthorizedException` ou `ForbiddenException`, que Quarkus traduit en 401 ou 403."
  - key: qcm-anonyme
    format: multiple-choice
    question: "Un appel sans jeton arrive sur un endpoint `@RolesAllowed(\"admin\")`. Que répond Quarkus ?"
    choices:
      - {text: "401 Unauthorized", correct: true}
      - {text: "403 Forbidden", correct: false}
      - {text: "404 Not Found", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "Sans identité, l'appelant doit d'abord s'authentifier : 401. Le 403 est pour un utilisateur connu qui n'a pas le rôle."
  - key: qcm-sans-le-role
    format: multiple-choice
    question: "Bob, connecté avec le seul rôle `user`, appelle un endpoint `@RolesAllowed(\"admin\")`. Que reçoit-il ?"
    choices:
      - {text: "403 Forbidden", correct: true}
      - {text: "401 Unauthorized", correct: false}
      - {text: "200 OK, avec une réponse vide", correct: false}
      - {text: "302, vers la page de connexion", correct: false}
    answer: "Bob est authentifié, mais n'a pas le rôle : 403. Se reconnecter ne changerait rien."
  - key: qcm-tout-utilisateur-connecte
    format: multiple-choice
    question: "Quelle annotation exige un utilisateur connecté, sans rôle particulier ?"
    choices:
      - {text: "`@Authenticated`", correct: true}
      - {text: "`@PermitAll`", correct: false}
      - {text: "`@RolesAllowed(\"user\")`", correct: false}
      - {text: "`@DenyAll`", correct: false}
    answer: "`@Authenticated` ne regarde que la présence d'une identité. `@RolesAllowed(\"user\")` exigerait en plus le rôle `user`, que tous n'ont peut-être pas."
  - key: qcm-fermer-par-defaut
    format: multiple-choice
    question: "Comment t'assures-tu qu'un endpoint oublié, sans annotation de sécurité, ne soit jamais ouvert ?"
    choices:
      - {text: "`quarkus.security.jaxrs.deny-unannotated-endpoints=true`", correct: true}
      - {text: "`quarkus.oidc.enabled=true`, qui protège tous les endpoints", correct: false}
      - {text: "`@PermitAll` sur chaque classe de ressource", correct: false}
      - {text: "`quarkus.security.default=closed`", correct: false}
    answer: "Les endpoints sans annotation sont alors refusés. Une permission HTTP `authenticated` sur `/*` est l'autre façon de fermer par défaut."
  - key: trous-role-admin
    format: fill-in
    question: |-
      Complète pour réserver la création aux admins :
      ```java
      @POST
      @___("admin")
      public Response creer(NouveauProduit nouveau) {
      ```
    blanks:
      - [RolesAllowed]
    answer: "`@RolesAllowed(\"admin\")` : un utilisateur sans ce rôle reçoit 403."
  - key: trous-connecte
    format: fill-in
    question: |-
      Complète pour exiger un utilisateur connecté, sans rôle particulier :
      ```java
      @GET
      @Path("/moi")
      @___
      public Profil moi() {
      ```
    blanks:
      - [Authenticated]
    answer: "`@Authenticated` (`io.quarkus.security`) exige une identité."
  - key: trous-public
    format: fill-in
    question: |-
      La classe est `@Authenticated`. Complète pour ouvrir le catalogue à tous :
      ```java
      @GET
      @___
      public List<Produit> lister() {
      ```
    blanks:
      - [PermitAll]
    answer: "`@PermitAll` sur la méthode l'emporte sur l'annotation de la classe."
  - key: trous-refuser-sans-annotation
    format: fill-in
    question: |-
      Complète pour refuser tout endpoint qui n'a pas d'annotation de sécurité :
      ```properties
      quarkus.security.jaxrs.___=true
      ```
    blanks:
      - [deny-unannotated-endpoints]
    answer: "`deny-unannotated-endpoints` ferme par défaut : un oubli d'annotation devient un refus, pas une faille."
  - key: bug-roles-dans-une-chaine
    format: bug-fix
    question: |-
      Les admins comme les modérateurs reçoivent 403 sur cet endpoint. Leurs jetons portent bien leurs rôles.
      Quelle correction est la bonne ?
      ```java
      @DELETE
      @Path("/{id}")
      @RolesAllowed({"admin, moderateur"})
      public void supprimer(@PathParam("id") long id) {
      ```
    choices:
      - {text: "`@RolesAllowed({\"admin\", \"moderateur\"})`", correct: true}
      - {text: "`@RolesAllowed(\"admin; moderateur\")`", correct: false}
      - {text: "`@RolesAllowed(\"admin|moderateur\")`", correct: false}
      - {text: "`@RolesAllowed({\"ADMIN, MODERATEUR\"})`", correct: false}
    answer: |-
      ```java
      @RolesAllowed({"admin", "moderateur"})
      ```
      Une seule chaîne déclare un seul rôle, nommé « admin, moderateur », que personne n'a. Chaque rôle est une
      chaîne du tableau ; il suffit d'en avoir un.
  - key: bug-casse-du-role
    format: bug-fix
    question: |-
      Alice a le rôle `admin` dans son jeton, mais reçoit 403 sur cet endpoint. Quelle correction est la bonne ?
      ```java
      @POST
      @RolesAllowed("Admin")
      public Response creer(NouveauProduit nouveau) {
      ```
    choices:
      - {text: "Écrire le rôle tel qu'il est dans le jeton : `@RolesAllowed(\"admin\")`", correct: true}
      - {text: "Remplacer `@RolesAllowed(\"Admin\")` par `@Authenticated`", correct: false}
      - {text: "Ajouter `@PermitAll` à côté de `@RolesAllowed(\"Admin\")`", correct: false}
      - {text: "Demander à Alice de se déconnecter puis de se reconnecter", correct: false}
    answer: |-
      ```java
      @RolesAllowed("admin")
      ```
      Les rôles sont comparés casse comprise. `@Authenticated` ouvrirait l'endpoint à tous les utilisateurs
      connectés ; un nouveau jeton porterait le même rôle `admin`.
  - key: bug-suppression-ouverte
    format: bug-fix
    question: |-
      Un appel anonyme a supprimé un produit. La classe n'a pas d'annotation de sécurité. Quelle correction est la
      bonne ?
      ```java
      @Path("/produits")
      public class ProduitResource {

          @GET
          public List<Produit> lister() { ... }

          @DELETE
          @Path("/{id}")
          public void supprimer(@PathParam("id") long id) { ... }
      }
      ```
    choices:
      - {text: "Annoter `supprimer` avec `@RolesAllowed(\"admin\")`", correct: true}
      - {text: "Annoter `lister` avec `@PermitAll`, ce qui ferme les autres", correct: false}
      - {text: "Ajouter `quarkus-oidc`, qui exige un jeton partout", correct: false}
      - {text: "Renommer le chemin en `/admin/produits`, moins visible", correct: false}
    answer: |-
      ```java
      @DELETE
      @Path("/{id}")
      @RolesAllowed("admin")
      public void supprimer(@PathParam("id") long id) { ... }
      ```
      Sans annotation ni permission HTTP, un endpoint est ouvert. Ouvrir `lister` ne ferme rien d'autre, et
      l'extension OIDC n'exige rien d'elle-même. Pour ne plus dépendre d'un oubli : `deny-unannotated-endpoints`.
  - key: bug-authenticated-trop-large
    format: bug-fix
    question: |-
      N'importe quel client connecté peut consulter le chiffre d'affaires, réservé à la direction (rôle
      `direction`). Quelle correction est la bonne ?
      ```java
      @GET
      @Path("/chiffre-affaires")
      @Authenticated
      public Montant chiffreAffaires() {
      ```
    choices:
      - {text: "Remplacer `@Authenticated` par `@RolesAllowed(\"direction\")`", correct: true}
      - {text: "Remplacer `@Authenticated` par `@RolesAllowed(\"**\")`", correct: false}
      - {text: "Ajouter `@PermitAll` sur la classe de la ressource", correct: false}
      - {text: "Ajouter `@Authenticated` aussi sur la classe de la ressource", correct: false}
    answer: |-
      ```java
      @RolesAllowed("direction")
      ```
      `@Authenticated` ne vérifie que la présence d'une identité, comme `@RolesAllowed("**")`. Le rôle `direction`
      restreint l'endpoint à ceux qui l'ont.
