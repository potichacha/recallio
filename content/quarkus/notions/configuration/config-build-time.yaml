notion: config-build-time
lesson: |-
  Quarkus fait au **build** une grande partie du travail qu'un framework classique fait au démarrage : il lit les
  annotations, choisit les implémentations, génère du bytecode. Certaines propriétés sont donc lues pendant le build,
  et leur valeur est **gravée** dans l'application.

  **Trois phases.** La documentation de chaque extension marque d'un cadenas les propriétés fixées au build.

  | Phase | Lue... | Exemples |
  |---|---|---|
  | `BUILD_TIME` | au build seulement | la plupart des réglages d'extension |
  | `BUILD_AND_RUN_TIME_FIXED` | au build, visible ensuite sans pouvoir changer | `quarkus.datasource.db-kind`, `quarkus.log.min-level` |
  | `RUN_TIME` | à chaque démarrage | `quarkus.http.port`, `quarkus.datasource.jdbc.url`, `quarkus.log.level` |

  Les propriétés de **ton** application, lues par `@ConfigProperty` ou `@ConfigMapping`, sont toutes lues au
  démarrage.

  **Pourquoi ?** Choisir le pilote JDBC, préparer Hibernate ou inclure Swagger UI demande du travail : fait une fois
  au build, il n'est plus à refaire à chaque démarrage. C'est une des raisons du démarrage rapide de Quarkus, et ce
  qui rend possible l'exécutable natif.

  **Ce qui se passe si on insiste.** Changer une propriété fixée au build au moment du lancement n'a pas d'effet :

  ```bash
  ./mvnw package                                   # construit avec db-kind=postgresql
  QUARKUS_DATASOURCE_DB_KIND=mysql java -jar target/quarkus-app/quarkus-run.jar
  # avertissement « Build time property cannot be changed at runtime » : la base reste PostgreSQL
  ```

  La valeur du build reste en vigueur, et le journal le signale. Pour la changer, on reconstruit.

  **Le profil du build.** `./mvnw package` utilise le profil `prod`. Une valeur de build propre à un autre profil
  (`%staging.quarkus.datasource.db-kind=h2`) demande de construire avec ce profil :
  `./mvnw package -Dquarkus.profile=staging`. Lancer ensuite avec `QUARKUS_PROFILE=staging` ne change que les
  propriétés lues au démarrage.

  **En mode dev**, la question ne se pose pas : à chaque modification, Quarkus refait le build, propriétés comprises.

  **En pratique** : un seul artefact pour tous les environnements, réglé au démarrage (URL, mots de passe, ports,
  niveaux de log) ; les choix structurants (type de base, extensions incluses, format de l'artefact) se décident au
  build.

  **En entretien** : « Quarkus fait au build ce que d'autres frameworks font au démarrage, d'où des propriétés fixées
  au build, marquées d'un cadenas dans la documentation : le type de base, par exemple. Les changer au lancement n'a
  pas d'effet, juste un avertissement ; il faut reconstruire. Tout le reste, URL, secrets, ports et mes propres
  propriétés, se règle au démarrage, sur le même artefact. »
cards:
  - key: pourquoi-fixer-au-build
    format: course
    question: Pourquoi Quarkus fixe-t-il certaines propriétés au build ?
    choices:
      - {text: "Le travail qu'elles commandent est fait une fois au build, plus à chaque démarrage", correct: true}
      - {text: "Pour empêcher les opérateurs de modifier la configuration en production", correct: false}
      - {text: "Parce que Java ne sait pas lire de fichier de propriétés au démarrage", correct: false}
      - {text: "Pour chiffrer les valeurs sensibles dans le jar produit par le build", correct: false}
    answer: "Choisir le pilote JDBC ou préparer Hibernate se fait au build, une fois pour toutes : le démarrage est plus rapide, et l'exécutable natif possible."
  - key: changer-au-lancement
    format: course
    question: "Que se passe-t-il si tu changes une propriété fixée au build au lancement de l'application ?"
    choices:
      - {text: "Un avertissement, et la valeur du build reste en vigueur", correct: true}
      - {text: "La nouvelle valeur s'applique, après un build automatique", correct: false}
      - {text: "Le démarrage échoue, faute de valeur cohérente", correct: false}
      - {text: "La nouvelle valeur s'applique, sans rien signaler", correct: false}
    answer: "Le journal affiche « Build time property cannot be changed at runtime », et l'application garde la valeur choisie au build. Il faut reconstruire."
  - key: phase-fixed
    format: course
    question: "Qu'indique la phase `BUILD_AND_RUN_TIME_FIXED` d'une propriété ?"
    choices:
      - {text: "Sa valeur est fixée au build, et lisible ensuite sans pouvoir changer", correct: true}
      - {text: "Sa valeur est lue au build, puis relue et appliquée à chaque démarrage", correct: false}
      - {text: "Sa valeur ne sert qu'au build, et disparaît de l'application produite", correct: false}
      - {text: "Sa valeur doit être donnée deux fois : au build et au démarrage", correct: false}
    answer: "`BUILD_TIME` n'existe qu'au build, `RUN_TIME` se lit à chaque démarrage. Entre les deux, `BUILD_AND_RUN_TIME_FIXED` est gravée au build mais reste visible."
  - key: propriete-modifiable-au-demarrage
    format: course
    question: Laquelle de ces propriétés peut changer au démarrage, sans reconstruire ?
    choices:
      - {text: "`quarkus.datasource.jdbc.url`", correct: true}
      - {text: "`quarkus.datasource.db-kind`", correct: false}
      - {text: "`quarkus.log.min-level`", correct: false}
      - {text: "`quarkus.package.jar.type`", correct: false}
    answer: "L'URL de la base se lit au démarrage : chaque environnement a la sienne. Le type de base choisit le pilote au build, `min-level` y fixe le niveau le plus bas possible, et le format du jar est le build lui-même."
  - key: vf-port-au-demarrage
    format: true-false
    question: "`quarkus.http.port` peut changer au lancement, sans reconstruire l'application."
    truth: true
    answer: "Le port se lit au démarrage : `QUARKUS_HTTP_PORT` ou `-Dquarkus.http.port` suffisent."
  - key: vf-proprietes-de-l-application
    format: true-false
    question: "Les propriétés de l'application lues par `@ConfigProperty` sont fixées au build."
    truth: false
    answer: "Les propriétés de l'application se lisent toutes au démarrage. Seules certaines propriétés de Quarkus et de ses extensions sont fixées au build."
  - key: vf-mode-dev-et-build
    format: true-false
    question: "En mode dev, modifier une propriété fixée au build est pris en compte sans relancer la commande."
    truth: true
    answer: "Le mode dev refait le build à chaque modification détectée, propriétés de build comprises."
  - key: vf-cadenas
    format: true-false
    question: "Dans la documentation des extensions Quarkus, une icône de cadenas signale les propriétés fixées au build."
    truth: true
    answer: "C'est le premier réflexe quand une propriété semble ignorée en production : vérifier si elle porte le cadenas."
  - key: qcm-profil-du-package
    format: multiple-choice
    question: "Quel profil `./mvnw package` utilise-t-il pour les propriétés fixées au build ?"
    choices:
      - {text: "`prod`", correct: true}
      - {text: "`dev`", correct: false}
      - {text: "`test`", correct: false}
      - {text: "`build`", correct: false}
    answer: "Le build de l'artefact se fait en `prod`, sauf `-Dquarkus.profile=...`. Les tests lancés par Maven pendant ce build, eux, tournent en `test`."
  - key: qcm-changer-de-base
    format: multiple-choice
    question: "L'application a été construite pour PostgreSQL. L'équipe d'exploitation lance le jar avec `QUARKUS_DATASOURCE_DB_KIND=mysql`. Que se passe-t-il ?"
    choices:
      - {text: "Un avertissement, et l'application reste sur PostgreSQL", correct: true}
      - {text: "L'application bascule sur le pilote MySQL", correct: false}
      - {text: "Le démarrage échoue sur un pilote introuvable", correct: false}
      - {text: "L'application charge les deux pilotes", correct: false}
    answer: "`db-kind` est fixée au build, qui a choisi le pilote PostgreSQL. Changer de base demande un autre build."
  - key: qcm-type-de-jar-au-lancement
    format: multiple-choice
    question: "Que produit `java -Dquarkus.package.jar.type=uber-jar -jar target/quarkus-app/quarkus-run.jar` ?"
    choices:
      - {text: "L'application démarre normalement : l'option arrive après le build", correct: true}
      - {text: "Un uber-jar, généré avant le démarrage de l'application", correct: false}
      - {text: "Une erreur : l'option est réservée aux exécutables natifs", correct: false}
      - {text: "L'application démarre en mode dev, avec le rechargement", correct: false}
    answer: "Le format de l'artefact se décide pendant `./mvnw package`. Au lancement, la propriété arrive trop tard : `-Dquarkus.package.jar.type=uber-jar` se passe au build."
  - key: qcm-ce-qui-se-regle-au-demarrage
    format: multiple-choice
    question: Que règles-tu au démarrage, sur un même artefact déployé en recette et en production ?
    choices:
      - {text: "Les URL, les mots de passe, les ports et les niveaux de log", correct: true}
      - {text: "Le type de base, les extensions incluses et le format du jar", correct: false}
      - {text: "Le niveau minimal de log, et l'inclusion de Swagger UI", correct: false}
      - {text: "Rien : chaque environnement demande son propre build", correct: false}
    answer: "Tout ce qui varie d'un environnement à l'autre se lit au démarrage. Les choix structurants, fixés au build, restent les mêmes partout."
  - key: bug-type-de-base-au-lancement
    format: bug-fix
    question: |-
      L'application, construite par `./mvnw package`, doit utiliser H2 en recette. Elle est lancée avec
      `QUARKUS_PROFILE=staging`, mais reste sur PostgreSQL, avec l'avertissement « Build time property cannot be
      changed at runtime ». Quelle correction est la bonne ?
      ```properties
      quarkus.datasource.db-kind=postgresql
      %staging.quarkus.datasource.db-kind=h2
      ```
    choices:
      - {text: "Construire l'artefact de recette avec `-Dquarkus.profile=staging`", correct: true}
      - {text: "Lancer avec `QUARKUS_DATASOURCE_DB_KIND=h2` en plus du profil", correct: false}
      - {text: "Écrire `%prod.quarkus.datasource.db-kind=h2` dans le fichier", correct: false}
      - {text: "Lancer avec `-Dquarkus.profile=staging` au lieu de la variable", correct: false}
    answer: |-
      ```bash
      ./mvnw package -Dquarkus.profile=staging
      ```
      `db-kind` est fixée au build, qui utilise le profil `prod` par défaut. Changer de profil au lancement ne
      touche qu'aux propriétés lues au démarrage, quelle que soit la façon de l'activer.
  - key: bug-swagger-ui-en-production
    format: bug-fix
    question: |-
      Swagger UI doit être servie en production. Le conteneur est lancé avec la variable ci-dessous, mais
      `/q/swagger-ui` répond 404. Quelle correction est la bonne ?
      ```bash
      docker run -e QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE=true boutique:1.0
      ```
    choices:
      - {text: "Mettre `quarkus.swagger-ui.always-include=true` dans le fichier, puis reconstruire", correct: true}
      - {text: "Écrire la variable en minuscules : `quarkus_swagger_ui_always_include`", correct: false}
      - {text: "Lancer le conteneur avec `QUARKUS_PROFILE=dev` pour l'inclure", correct: false}
      - {text: "Passer la valeur par `-Dquarkus.swagger-ui.always-include=true`", correct: false}
    answer: |-
      ```properties
      quarkus.swagger-ui.always-include=true
      ```
      L'inclusion de Swagger UI se décide au build : ses fichiers sont ajoutés, ou non, à l'artefact. Au
      démarrage, ni variable ni `-D` ne peuvent les faire apparaître.
  - key: bug-min-level-au-lancement
    format: bug-fix
    question: |-
      Les messages TRACE de `boutique` n'apparaissent pas en production, malgré ce lancement. Quelle correction est
      la bonne ?
      ```bash
      java -Dquarkus.log.min-level=TRACE \
           -Dquarkus.log.category.\"boutique\".level=TRACE \
           -jar target/quarkus-app/quarkus-run.jar
      ```
    choices:
      - {text: "Mettre `quarkus.log.min-level=TRACE` dans le fichier, puis reconstruire", correct: true}
      - {text: "Passer `quarkus.log.level=TRACE` en plus, pour la catégorie racine", correct: false}
      - {text: "Remplacer les deux `-D` par des variables d'environnement", correct: false}
      - {text: "Lancer l'application en mode dev, sur le serveur de production", correct: false}
    answer: |-
      ```properties
      quarkus.log.min-level=TRACE
      ```
      Le niveau minimal se fixe au build : aucun message plus fin ne peut s'afficher ensuite. Le niveau d'une
      catégorie, lui, se règle au démarrage, mais ne peut descendre sous ce minimum.
  - key: bug-uber-jar-au-lancement
    format: bug-fix
    question: |-
      Le `Dockerfile` copie `target/*-runner.jar`, un uber-jar, mais le fichier n'existe pas : la CI ne produit que
      `target/quarkus-app/`. Quelle correction est la bonne ?
      ```bash
      # dans la CI
      ./mvnw package
      # au lancement du conteneur
      java -Dquarkus.package.jar.type=uber-jar -jar app.jar
      ```
    choices:
      - {text: "Passer `-Dquarkus.package.jar.type=uber-jar` à `./mvnw package`", correct: true}
      - {text: "Passer l'option au lancement par `QUARKUS_PACKAGE_JAR_TYPE`", correct: false}
      - {text: "Renommer `quarkus-run.jar` en `boutique-runner.jar`", correct: false}
      - {text: "Copier `target/classes` dans l'image à la place du jar", correct: false}
    answer: |-
      ```bash
      ./mvnw package -Dquarkus.package.jar.type=uber-jar
      ```
      Le format de l'artefact se décide au build. Au lancement, la propriété arrive trop tard ; renommer
      `quarkus-run.jar` ne donnerait pas un jar autonome, qui a besoin de `lib/`.
  - key: situation-url-par-environnement
    format: scenario
    question: |-
      L'exploitation veut changer l'URL de la base d'un environnement à l'autre, sans reconstruire. Que lui
      réponds-tu ?
    choices:
      - {text: "C'est possible : l'URL se lit au démarrage, une variable suffit", correct: true}
      - {text: "C'est impossible : Quarkus fige toute sa configuration au build", correct: false}
      - {text: "C'est possible, mais seulement en lançant le mode dev", correct: false}
      - {text: "C'est possible, à condition de modifier le jar à la main", correct: false}
    answer: |-
      `QUARKUS_DATASOURCE_JDBC_URL` règle chaque environnement sur le même artefact. Seul le type de base est fixé au
      build.
  - key: situation-passer-a-mysql
    format: scenario
    question: |-
      L'exploitation veut passer de PostgreSQL à MySQL en changeant une variable d'environnement. Que lui
      réponds-tu ?
    choices:
      - {text: "Le type de base est fixé au build : il faut construire un nouvel artefact", correct: true}
      - {text: "C'est possible : `QUARKUS_DATASOURCE_DB_KIND=mysql` suffit au lancement", correct: false}
      - {text: "C'est possible en lançant l'application avec le profil `dev`", correct: false}
      - {text: "C'est impossible : une application Quarkus ne change jamais de base", correct: false}
    answer: |-
      `db-kind` choisit le pilote au build. Un nouveau build, avec la nouvelle valeur, produit l'artefact MySQL ; au
      lancement, la variable ne donnerait qu'un avertissement.
  - key: situation-avertissement-en-production
    format: scenario
    question: |-
      Le journal de production affiche « Build time property cannot be changed at runtime ». Que fais-tu ?
    choices:
      - {text: "Je fixe la valeur avant le build, et je retire la surcharge du lancement", correct: true}
      - {text: "Je l'ignore : Quarkus a pris la nouvelle valeur malgré l'avertissement", correct: false}
      - {text: "Je relance le conteneur jusqu'à ce que l'avertissement disparaisse", correct: false}
      - {text: "Je baisse le niveau de log pour ne plus voir ce message", correct: false}
    answer: |-
      L'avertissement dit qu'une valeur passée au lancement est ignorée : l'application tourne avec celle du build.
      Le message nomme la propriété ; sa bonne valeur va dans la configuration du build.
  - key: situation-justifier-le-build
    format: scenario
    question: |-
      Un collègue, habitué à Spring Boot, trouve absurde de fixer des propriétés au build. Que lui réponds-tu ?
    choices:
      - {text: "Le travail fait au build ne se refait plus au démarrage : démarrage rapide, natif possible", correct: true}
      - {text: "C'est une limite de Java, que Spring Boot contourne au prix de la sécurité", correct: false}
      - {text: "C'est pour interdire les changements de configuration en production", correct: false}
      - {text: "Il a raison : c'est un défaut de jeunesse, corrigé dans les prochaines versions", correct: false}
    answer: |-
      Quarkus lit les annotations, choisit les implémentations et génère son code au build. Le prix : quelques choix
      structurants demandent de reconstruire, mais tout ce qui varie d'un environnement à l'autre reste réglable au
      démarrage.
