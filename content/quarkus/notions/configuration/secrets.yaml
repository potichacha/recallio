notion: secrets
lesson: |-
  Un mot de passe de base, une clé d'API ou un secret de signature n'ont rien à faire dans `application.properties` :
  ce fichier est commité, relu par toute l'équipe, et **copié dans le jar** à chaque build. Un secret écrit là se
  retrouve dans l'historique Git et dans chaque image publiée.

  **Le principe** : le fichier décrit la configuration, l'environnement fournit les secrets.

  ```properties
  # Aucun secret ici : seulement les valeurs sans risque
  quarkus.datasource.db-kind=postgresql
  quarkus.datasource.username=boutique
  # Le mot de passe viendra de QUARKUS_DATASOURCE_PASSWORD

  # Ou une expression, pour un nom de variable à toi
  boutique.paiement.cle-api=${PAIEMENT_CLE_API}
  ```

  **Selon l'environnement.**

  | Où | Comment fournir le secret |
  |---|---|
  | Poste du développeur | Dev Services (la base jetable a ses propres identifiants), ou un fichier `.env` hors de Git |
  | CI | Les secrets chiffrés de la plateforme (GitHub Actions, GitLab), exposés en variables d'environnement |
  | Conteneur, Kubernetes | Un `Secret` exposé en variables d'environnement (`envFrom`) ou monté en fichiers |
  | Coffre-fort | HashiCorp Vault (extension Quarkiverse `quarkus-vault`) ou le gestionnaire de secrets du cloud, lus comme une source de configuration |

  **Le fichier `.env`.** Pratique en développement, il se lit comme des variables d'environnement. Il va dans le
  `.gitignore` ; on commite un `.env.example`, avec les noms des variables et sans valeurs, pour les nouveaux venus.

  **Les coffres.** Un coffre centralise les secrets, trace qui les lit, et peut délivrer des identifiants **à durée
  de vie limitée** (Vault crée un utilisateur de base à la demande). Le secret ne traîne plus dans les variables d'un
  déploiement.

  **Les fuites ordinaires.**

  - **Les journaux** : on ne journalise jamais un secret, ni toute la configuration, ni un objet dont le `toString`
    contient un mot de passe.
  - **Les messages d'erreur** renvoyés au client.
  - **L'historique Git** : supprimer la ligne ne suffit pas, le secret reste dans les anciens commits. Un secret
    commité est un secret compromis : on le **révoque** et on le remplace.
  - **L'image** : un secret copié dans l'image au build se lit avec `docker history` ou en ouvrant ses couches.

  **En entretien** : « Aucun secret dans le dépôt : `application.properties` décrit la configuration, et le mot de
  passe arrive par une variable d'environnement, un Secret Kubernetes ou un coffre comme Vault. En local, Dev
  Services ou un `.env` ignoré par Git. Un secret qui a fuité dans Git se révoque : effacer la ligne ne suffit pas. »
cards:
  - key: ou-mettre-le-mot-de-passe
    format: course
    question: "Où places-tu le mot de passe de la base de production d'une application Quarkus ?"
    choices:
      - {text: "Dans une variable d'environnement ou un coffre, hors du dépôt", correct: true}
      - {text: "Dans `application.properties`, préfixé par `%prod.`", correct: false}
      - {text: "Dans une constante Java, compilée dans le jar", correct: false}
      - {text: "Dans `application.properties`, encodé en Base64", correct: false}
    answer: "`QUARKUS_DATASOURCE_PASSWORD`, un Secret Kubernetes ou Vault : le secret arrive au démarrage. Un préfixe `%prod.` ne le cache pas, et le Base64 n'est pas un chiffrement."
  - key: role-du-env-example
    format: course
    question: "À quoi sert un fichier `.env.example` commité à côté d'un `.env` ignoré par Git ?"
    choices:
      - {text: "À lister les variables attendues, sans leurs valeurs", correct: true}
      - {text: "À fournir les secrets de production à la CI", correct: false}
      - {text: "À remplacer `application.properties` en développement", correct: false}
      - {text: "À chiffrer le `.env` avant de le pousser sur Git", correct: false}
    answer: "Le nouveau venu copie `.env.example` en `.env` et y met ses propres valeurs. Les secrets ne passent jamais par Git."
  - key: reference-a-un-secret
    format: course
    question: Comment `application.properties` peut-il citer une clé d'API sans la contenir ?
    choices:
      - {text: "`boutique.paiement.cle-api=${PAIEMENT_CLE_API}`", correct: true}
      - {text: "`boutique.paiement.cle-api=env(PAIEMENT_CLE_API)`", correct: false}
      - {text: "`boutique.paiement.cle-api=@PAIEMENT_CLE_API@`", correct: false}
      - {text: "`boutique.paiement.cle-api=#PAIEMENT_CLE_API`", correct: false}
    answer: "Une expression `${...}` lit la variable au démarrage. Le fichier dit d'où vient la valeur, sans la donner."
  - key: interet-d-un-coffre
    format: course
    question: "Qu'apporte un coffre comme HashiCorp Vault par rapport à une simple variable d'environnement ?"
    choices:
      - {text: "Des secrets centralisés, des lectures tracées, des identifiants à durée limitée", correct: true}
      - {text: "Des secrets lisibles en clair dans `application.properties`, sans risque", correct: false}
      - {text: "Un démarrage plus rapide, les secrets étant compilés dans l'application", correct: false}
      - {text: "La fin du chiffrement des communications avec la base de données", correct: false}
    answer: "Le coffre sait qui a lu quoi, peut faire tourner les secrets et créer des identifiants de base à la demande. Quarkus le lit comme une source de configuration."
  - key: vf-env-dans-gitignore
    format: true-false
    question: "Le fichier `.env` d'un projet Quarkus doit figurer dans le `.gitignore`."
    truth: true
    answer: "Il contient les secrets du poste du développeur. On commite plutôt un `.env.example` sans valeurs."
  - key: vf-mot-de-passe-dans-le-jar
    format: true-false
    question: "Un mot de passe écrit dans `application.properties` est absent du jar construit."
    truth: false
    answer: "`application.properties` est une ressource du classpath : il est copié tel quel dans l'artefact, et dans chaque image qui l'embarque."
  - key: vf-dev-services-sans-secret
    format: true-false
    question: "Avec Dev Services, le développement local n'a besoin d'aucun mot de passe de base de données configuré à la main."
    truth: true
    answer: "Quarkus démarre la base dans un conteneur et y branche l'application avec des identifiants qu'il choisit lui-même."
  - key: vf-secret-kubernetes
    format: true-false
    question: "Un Secret Kubernetes exposé en variables d'environnement est lu par Quarkus comme n'importe quelle variable."
    truth: true
    answer: "Le conteneur reçoit `QUARKUS_DATASOURCE_PASSWORD` par `env` ou `envFrom` ; Quarkus ne voit pas la différence."
  - key: qcm-secret-dans-l-historique
    format: multiple-choice
    question: "Un mot de passe de production a été commité il y a un mois. Quelle mesure est indispensable ?"
    choices:
      - {text: "Révoquer ce mot de passe et en émettre un nouveau", correct: true}
      - {text: "Supprimer la ligne dans un nouveau commit", correct: false}
      - {text: "Passer le dépôt en privé jusqu'à nouvel ordre", correct: false}
      - {text: "Préfixer la ligne par `%prod.` pour la masquer", correct: false}
    answer: "Le secret reste lisible dans les anciens commits et dans les clones existants : il est compromis. Nettoyer l'historique peut suivre, mais la révocation passe d'abord."
  - key: qcm-secret-en-ci
    format: multiple-choice
    question: "Les tests d'intégration de la CI ont besoin d'une base. D'où viennent ses identifiants, au mieux ?"
    choices:
      - {text: "De Dev Services, qui démarre une base jetable avec ses identifiants", correct: true}
      - {text: "Du mot de passe de production, partagé avec la CI", correct: false}
      - {text: "D'un `application.properties` de test commité avec le secret", correct: false}
      - {text: "D'un fichier `.env` commité pour la seule CI", correct: false}
    answer: "Une base jetable n'a pas de secret à protéger. Quand un vrai secret est nécessaire, il vient des secrets chiffrés de la plateforme de CI."
  - key: qcm-fuite-par-les-journaux
    format: multiple-choice
    question: "Quel code risque d'écrire un secret dans les journaux ?"
    choices:
      - {text: "`Log.infof(\"Configuration : %s\", config)`, sur la configuration du paiement", correct: true}
      - {text: "`Log.infof(\"Paiement %s accepté\", paiement.id())`, sur l'identifiant", correct: false}
      - {text: "`Log.info(\"Connexion au service de paiement établie\")`", correct: false}
      - {text: "`Log.warnf(\"Paiement refusé : code %s\", reponse.code())`", correct: false}
    answer: "Le `toString` d'un objet de configuration peut contenir la clé d'API. On journalise des identifiants et des codes, jamais un objet entier qui porte un secret."
  - key: qcm-image-et-secret
    format: multiple-choice
    question: "Pourquoi ne copie-t-on pas un fichier de secrets dans l'image Docker au build ?"
    choices:
      - {text: "Toute personne qui récupère l'image peut lire ses couches", correct: true}
      - {text: "Docker refuse de copier un fichier qui contient un mot de passe", correct: false}
      - {text: "Quarkus ignore les fichiers copiés dans l'image après le build", correct: false}
      - {text: "Le fichier serait chiffré par Docker et donc illisible", correct: false}
    answer: "Une image se partage, se met en cache, se pousse dans un registre : un secret qu'elle contient s'y lit. Le secret arrive au lancement du conteneur."
  - key: situation-mot-de-passe-commite
    format: scenario
    question: |-
      En revue, tu vois qu'un collègue a ajouté `%prod.quarkus.datasource.password=Pr0d!2026` à
      `application.properties`. Que lui demandes-tu ?
    choices:
      - {text: "Retirer la ligne, faire changer ce mot de passe, le passer par une variable", correct: true}
      - {text: "Garder la ligne : le préfixe `%prod.` la cache aux autres profils", correct: false}
      - {text: "Encoder la valeur en Base64 pour qu'elle ne soit plus lisible", correct: false}
      - {text: "Déplacer la ligne dans `application-prod.properties`, commité aussi", correct: false}
    answer: |-
      La ligne est déjà dans la branche, donc dans l'historique : le mot de passe est à considérer comme connu. En
      production, `QUARKUS_DATASOURCE_PASSWORD` le fournira, depuis un Secret ou un coffre.
  - key: situation-nouveau-venu
    format: scenario
    question: |-
      Un nouveau venu ne sait pas quelles clés d'API mettre dans son `.env` pour lancer le projet. Que proposes-tu ?
    choices:
      - {text: "Commiter un `.env.example` qui liste les variables, sans valeurs", correct: true}
      - {text: "Commiter le `.env` de l'équipe, pour que chacun ait les mêmes clés", correct: false}
      - {text: "Lui envoyer les clés de production par la messagerie de l'équipe", correct: false}
      - {text: "Écrire les clés de développement dans `application.properties`", correct: false}
    answer: |-
      Le modèle documente ce qu'il faut fournir ; chacun y met ses propres clés de développement, ou celles d'un
      environnement de test. Rien de secret ne passe par Git.
  - key: situation-secret-dans-l-image
    format: scenario
    question: |-
      Le `Dockerfile` copie un fichier `secrets.properties` dans l'image, qui est poussée sur un registre partagé.
      Que fais-tu ?
    choices:
      - {text: "Je retire la copie, et le secret arrive au lancement par une variable ou un Secret", correct: true}
      - {text: "Je garde la copie, mais je rends le registre accessible à l'équipe seulement", correct: false}
      - {text: "Je supprime le fichier dans une couche suivante du même `Dockerfile`", correct: false}
      - {text: "Je renomme le fichier en `.secrets.properties` pour qu'il soit caché", correct: false}
    answer: |-
      Une couche supprimée reste dans l'image : le fichier se lit encore. Les secrets déjà publiés sont à révoquer,
      et l'image ne contient plus que l'application.
  - key: situation-rotation
    format: scenario
    question: |-
      La sécurité exige que le mot de passe de la base change chaque mois, sans le noter nulle part à la main. Que
      proposes-tu ?
    choices:
      - {text: "Un coffre comme Vault, qui délivre des identifiants à durée limitée", correct: true}
      - {text: "Un `application.properties` mis à jour et recommité chaque mois", correct: false}
      - {text: "Un mot de passe assez long pour ne jamais avoir à le changer", correct: false}
      - {text: "Une constante Java, modifiée et redéployée chaque mois", correct: false}
    answer: |-
      Vault crée des identifiants de base à la demande, avec une durée de vie, et les révoque ensuite. L'extension
      `quarkus-vault` les lit comme une source de configuration.
