notion: profils
lesson: |-
  Une même application tourne en développement, en test et en production, avec des réglages différents. Plutôt que
  trois fichiers à maintenir, Quarkus propose des **profils** : une propriété préfixée par `%profil.` ne s'applique
  que quand ce profil est actif.

  ```properties
  # Pour tous les profils
  boutique.devise=EUR
  quarkus.log.level=INFO

  # En dev seulement
  %dev.quarkus.log.category."boutique".level=DEBUG

  # En test seulement
  %test.boutique.paiement.simule=true

  # En production seulement : la vraie base
  %prod.quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/boutique
  ```

  **Les trois profils prédéfinis.**

  | Profil | Actif quand... |
  |---|---|
  | `dev` | tu lances `quarkus dev` ou `./mvnw quarkus:dev` |
  | `test` | les tests `@QuarkusTest` s'exécutent |
  | `prod` | l'application tourne autrement, par exemple avec `java -jar` |

  Une propriété préfixée l'emporte, pour son profil, sur la même propriété sans préfixe. Sans version préfixée, la
  valeur commune s'applique.

  **Dev Services et profils.** En dev et en test, Quarkus démarre lui-même une base, un Kafka ou un Keycloak dans un
  conteneur, à condition que leur adresse ne soit **pas** configurée. Préfixer l'URL de production par `%prod.` laisse
  donc Dev Services fournir une base jetable aux tests, au lieu de les brancher sur une vraie base.

  **Les profils à toi.** Un environnement de recette a son profil, activé au lancement :

  ```properties
  %staging.quarkus.datasource.jdbc.url=jdbc:postgresql://recette:5432/boutique
  ```

  ```bash
  QUARKUS_PROFILE=staging java -jar target/quarkus-app/quarkus-run.jar
  # ou : java -Dquarkus.profile=staging -jar target/quarkus-app/quarkus-run.jar
  ```

  Quand `staging` est actif, les propriétés `%prod.` ne s'appliquent pas. La propriété `quarkus.config.profile.parent`
  donne un profil parent, dont le profil actif hérite les valeurs.

  **D'autres écritures.**

  - Un fichier par profil : `application-staging.properties`, lu seulement quand `staging` est actif, et prioritaire
    sur `application.properties`.
  - En YAML (extension `quarkus-config-yaml`), le profil est une clé entre guillemets : `"%dev":`.
  - En variable d'environnement, le préfixe devient `_DEV_`, `_PROD_` : `_PROD_QUARKUS_HTTP_PORT=80`.

  **Profil et build.** `./mvnw package` construit l'application avec le profil `prod`. Les propriétés fixées au build
  (le type de base, par exemple) prennent la valeur de ce profil ; changer de profil au lancement ne change que les
  propriétés lues au démarrage.

  **En entretien** : « Un seul fichier, des propriétés préfixées par `%dev.`, `%test.` ou `%prod.` : chaque profil a
  ses valeurs, les autres sont communes. Je préfixe l'URL de production par `%prod.` pour que Dev Services fournisse
  une base jetable en dev et en test. Pour un environnement de plus, un profil personnalisé, activé par
  `QUARKUS_PROFILE`, sur le même artefact. »
cards:
  - key: profil-du-mode-dev
    format: course
    question: "Quel profil est actif quand tu lances `./mvnw quarkus:dev` ?"
    choices:
      - {text: "`dev`", correct: true}
      - {text: "`test`", correct: false}
      - {text: "`prod`", correct: false}
      - {text: "Aucun : les profils sont à activer à la main", correct: false}
    answer: "Le mode dev active le profil `dev` ; les tests `@QuarkusTest`, le profil `test` ; tout autre lancement, comme `java -jar`, le profil `prod`."
  - key: profil-du-jar
    format: course
    question: "Quel profil est actif quand tu lances `java -jar target/quarkus-app/quarkus-run.jar` sans autre option ?"
    choices:
      - {text: "`prod`", correct: true}
      - {text: "`dev`", correct: false}
      - {text: "`default`", correct: false}
      - {text: "Celui du dernier `quarkus:dev` lancé", correct: false}
    answer: "Hors du mode dev et des tests, le profil par défaut est `prod`. On en active un autre avec `QUARKUS_PROFILE` ou `-Dquarkus.profile`."
  - key: activer-un-profil-personnalise
    format: course
    question: "Comment actives-tu un profil personnalisé `staging` au lancement de l'application ?"
    choices:
      - {text: "Avec la variable d'environnement `QUARKUS_PROFILE=staging`", correct: true}
      - {text: "En renommant le jar en `quarkus-run-staging.jar`", correct: false}
      - {text: "En ajoutant `%staging.enabled=true` au fichier", correct: false}
      - {text: "En lançant `quarkus dev --staging` sur le serveur", correct: false}
    answer: "`QUARKUS_PROFILE=staging`, ou `-Dquarkus.profile=staging` : les propriétés `%staging.` s'appliquent alors, et celles de `%prod.` non."
  - key: sens-du-prefixe
    format: course
    question: "Que signifie la ligne `%dev.boutique.url-paiement=http://localhost:9000` ?"
    choices:
      - {text: "Cette valeur ne s'applique que quand le profil `dev` est actif", correct: true}
      - {text: "La clé est commentée tant que le mode dev n'est pas lancé", correct: false}
      - {text: "La valeur est lue dans la variable d'environnement `DEV`", correct: false}
      - {text: "La valeur s'applique partout, sauf dans le profil `dev`", correct: false}
    answer: "Le préfixe `%dev.` limite la propriété au profil `dev`. En test et en production, la valeur sans préfixe, si elle existe, s'applique."
  - key: vf-profil-des-tests
    format: true-false
    question: "Pendant les tests `@QuarkusTest`, le profil actif par défaut est `test`."
    truth: true
    answer: "Les propriétés `%test.` s'appliquent donc aux tests : un service de paiement simulé, un port différent, des journaux plus bavards."
  - key: vf-valeur-commune
    format: true-false
    question: "Une propriété sans préfixe s'applique à tous les profils qui n'en ont pas leur propre version."
    truth: true
    answer: "La valeur commune sert de défaut ; une version préfixée la remplace pour son seul profil."
  - key: vf-staging-et-prod
    format: true-false
    question: "Quand le profil `staging` est actif, les propriétés préfixées `%prod.` s'appliquent aussi."
    truth: false
    answer: "Un seul profil est actif : `staging` remplace `prod`. Pour hériter des valeurs de `prod`, on lui donne un profil parent avec `quarkus.config.profile.parent`."
  - key: vf-fichier-de-profil
    format: true-false
    question: "Un fichier `application-staging.properties` n'est lu que quand le profil `staging` est actif."
    truth: true
    answer: "Un fichier par profil est une autre écriture de `%staging.` ; quand le profil est actif, il l'emporte sur `application.properties`."
  - key: qcm-valeur-en-test
    format: multiple-choice
    question: "Le fichier contient `boutique.devise=EUR` et `%test.boutique.devise=USD`. Que vaut la devise pendant un `@QuarkusTest` ?"
    choices:
      - {text: "`USD`", correct: true}
      - {text: "`EUR`", correct: false}
      - {text: "`EUR,USD`", correct: false}
      - {text: "Aucune : les deux lignes se contredisent", correct: false}
    answer: "Pendant les tests, le profil `test` est actif : la valeur préfixée l'emporte sur la valeur commune."
  - key: qcm-dev-services-et-url
    format: multiple-choice
    question: Comment écris-tu l'URL de la base de production pour que les tests gardent une base jetable de Dev Services ?
    choices:
      - {text: "`%prod.quarkus.datasource.jdbc.url=...`", correct: true}
      - {text: "`quarkus.datasource.jdbc.url=...`, sans préfixe", correct: false}
      - {text: "`%test.quarkus.datasource.jdbc.url=...`", correct: false}
      - {text: "`quarkus.datasource.prod.jdbc.url=...`", correct: false}
    answer: "Dev Services ne démarre une base que si aucune URL n'est configurée pour le profil actif. Sans préfixe, l'URL vaudrait aussi en dev et en test."
  - key: qcm-fichier-par-profil
    format: multiple-choice
    question: "Où ranges-tu les réglages du profil `staging` si tu préfères un fichier à part ?"
    choices:
      - {text: "Dans `src/main/resources/application-staging.properties`", correct: true}
      - {text: "Dans `src/main/resources/staging/application.properties`", correct: false}
      - {text: "Dans `src/staging/resources/application.properties`", correct: false}
      - {text: "Dans `src/main/resources/application.properties.staging`", correct: false}
    answer: "Le nom `application-<profil>.properties` désigne un fichier de profil, lu seulement quand ce profil est actif."
  - key: qcm-profil-perso-et-prod
    format: multiple-choice
    question: "Le fichier contient `%prod.boutique.url=https://api.boutique.fr`, et l'application tourne avec `QUARKUS_PROFILE=staging`. Que vaut `boutique.url` ?"
    choices:
      - {text: "La valeur sans préfixe, ou rien si elle n'existe pas", correct: true}
      - {text: "`https://api.boutique.fr`, `staging` héritant de `prod`", correct: false}
      - {text: "`https://api.boutique.fr`, `%prod.` valant pour tout profil", correct: false}
      - {text: "La valeur de `%dev.`, profil de repli de `staging`", correct: false}
    answer: "Le profil actif est `staging` seul : `%prod.` ne s'applique pas. Sans profil parent, seule la valeur commune peut servir."
  - key: trous-prefixe-dev
    format: fill-in
    question: |-
      Complète pour que cette URL ne serve qu'en mode dev :
      ```properties
      ___.boutique.url-paiement=http://localhost:9000
      ```
    blanks:
      - ["%dev"]
    answer: "Le préfixe `%dev.` limite la propriété au profil `dev`."
  - key: trous-activer-profil
    format: fill-in
    question: |-
      Complète pour lancer l'application avec le profil `staging` :
      ```bash
      java -D___=staging -jar target/quarkus-app/quarkus-run.jar
      ```
    blanks:
      - [quarkus.profile]
    answer: "`quarkus.profile` choisit le profil actif ; la variable d'environnement `QUARKUS_PROFILE` fait de même."
  - key: trous-prefixe-prod
    format: fill-in
    question: |-
      Complète pour réduire les journaux en production seulement :
      ```properties
      %___.quarkus.log.level=WARN
      ```
    blanks:
      - [prod]
    answer: "`%prod.` vaut pour le profil par défaut d'une application lancée hors du mode dev et des tests."
  - key: trous-profil-en-yaml
    format: fill-in
    question: |-
      Complète ce fichier `application.yaml` pour que le niveau DEBUG ne vaille qu'en dev :
      ```yaml
      "___":
        quarkus:
          log:
            level: DEBUG
      ```
    blanks:
      - ["%dev"]
    answer: "En YAML, le profil est une clé de premier niveau, entre guillemets parce que `%` est un caractère réservé."
  - key: bug-propriete-seulement-en-dev
    format: bug-fix
    question: |-
      Tout marche en dev, mais en production le démarrage échoue : « SRCFG00014: The config property
      boutique.url-paiement is required but it could not be found in any config source ». Quelle correction est la
      bonne ?
      ```properties
      %dev.boutique.url-paiement=http://localhost:9000
      ```
    choices:
      - {text: "Ajouter `%prod.boutique.url-paiement=https://paiement.example`", correct: true}
      - {text: "Remplacer `%dev.` par `%test.` pour couvrir la production", correct: false}
      - {text: "Ajouter `quarkus.profile=dev` au fichier, pour la production", correct: false}
      - {text: "Renommer le fichier en `application-dev.properties`", correct: false}
    answer: |-
      ```properties
      %dev.boutique.url-paiement=http://localhost:9000
      %prod.boutique.url-paiement=https://paiement.example
      ```
      La valeur n'existait que pour le profil `dev`. En production, la propriété est absente, et l'injection
      obligatoire arrête le démarrage. Une valeur sans préfixe, ou une variable d'environnement, conviendrait aussi.
  - key: bug-url-sans-prefixe
    format: bug-fix
    question: |-
      Les tests `@QuarkusTest` effacent les données de la base PostgreSQL locale du développeur, au lieu d'utiliser
      une base de Dev Services. Quelle correction est la bonne ?
      ```properties
      quarkus.datasource.db-kind=postgresql
      quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/boutique
      ```
    choices:
      - {text: "Préfixer l'URL par `%dev.`, pour la réserver au mode dev", correct: true}
      - {text: "Préfixer le type de base par `%test.`, pour les tests", correct: false}
      - {text: "Ajouter `%test.quarkus.datasource.jdbc.url=` vide", correct: false}
      - {text: "Annoter les classes de test avec `@TestTransaction`", correct: false}
    answer: |-
      ```properties
      quarkus.datasource.db-kind=postgresql
      %dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/boutique
      ```
      Dev Services ne démarre une base que si aucune URL n'est configurée pour le profil actif. Sans préfixe, l'URL
      valait aussi pour le profil `test`, qui se branchait sur la base du développeur.
  - key: bug-prefixe-production
    format: bug-fix
    question: |-
      En production, l'application écoute toujours sur le port 8080. Quelle correction est la bonne ?
      ```properties
      %production.quarkus.http.port=80
      ```
    choices:
      - {text: "Écrire `%prod.quarkus.http.port=80`", correct: true}
      - {text: "Écrire `%PRODUCTION.quarkus.http.port=80`", correct: false}
      - {text: "Écrire `production.quarkus.http.port=80`", correct: false}
      - {text: "Écrire `%production:quarkus.http.port=80`", correct: false}
    answer: |-
      ```properties
      %prod.quarkus.http.port=80
      ```
      Le profil de production s'appelle `prod`. `%production.` désigne un profil personnalisé que personne n'active :
      la ligne ne s'applique jamais.
  - key: bug-prefixe-tests
    format: bug-fix
    question: |-
      Les tests appellent le vrai service de paiement, au lieu de sa version simulée. Quelle correction est la
      bonne ?
      ```properties
      %tests.boutique.paiement.simule=true
      ```
    choices:
      - {text: "Écrire `%test.boutique.paiement.simule=true`", correct: true}
      - {text: "Écrire `%junit.boutique.paiement.simule=true`", correct: false}
      - {text: "Écrire `%dev.boutique.paiement.simule=true`", correct: false}
      - {text: "Écrire `%tests.boutique.paiement.simule=\"true\"`", correct: false}
    answer: |-
      ```properties
      %test.boutique.paiement.simule=true
      ```
      Le profil des tests s'appelle `test`, au singulier. `%tests.` vise un profil inconnu, jamais actif.
  - key: situation-environnement-de-recette
    format: scenario
    question: |-
      L'équipe ajoute un environnement de recette, avec sa propre base et son propre service de paiement. Que
      proposes-tu ?
    choices:
      - {text: "Un profil `staging`, activé par `QUARKUS_PROFILE` sur le même artefact", correct: true}
      - {text: "Une branche Git `recette`, avec son propre `application.properties`", correct: false}
      - {text: "Un second projet Maven, copie du premier, réglé pour la recette", correct: false}
      - {text: "Le profil `dev` en recette, pour profiter du rechargement à chaud", correct: false}
    answer: |-
      Les valeurs propres à la recette se préfixent par `%staging.` ; le même jar tourne partout, et seul le profil
      actif change. Le mode dev n'a rien à faire sur un serveur.
  - key: situation-journaux-detailles-en-dev
    format: scenario
    question: |-
      Tu veux les journaux DEBUG de ton code en développement, sans inonder la production. Quelle ligne
      ajoutes-tu ?
    choices:
      - {text: "`%dev.quarkus.log.category.\"boutique\".level=DEBUG`", correct: true}
      - {text: "`quarkus.log.category.\"boutique\".level=DEBUG`", correct: false}
      - {text: "`%prod.quarkus.log.category.\"boutique\".level=DEBUG`", correct: false}
      - {text: "`%dev.quarkus.log.level=TRACE`, pour tout voir", correct: false}
    answer: |-
      Le préfixe `%dev.` limite le niveau DEBUG au mode dev, et à ton paquet. Sans préfixe, la production en
      hériterait ; TRACE pour tout noierait ton code sous les messages des bibliothèques.
  - key: situation-un-jar-par-environnement
    format: scenario
    question: |-
      Un collègue veut construire un jar différent pour chaque environnement, chacun avec ses valeurs. Que lui
      réponds-tu ?
    choices:
      - {text: "Un seul artefact suffit : profils et variables règlent chaque environnement", correct: true}
      - {text: "C'est indispensable : Quarkus fige toute sa configuration au build", correct: false}
      - {text: "C'est la bonne pratique : un jar par environnement, signé à part", correct: false}
      - {text: "Il faut plutôt un `application.properties` par serveur, copié à la main", correct: false}
    answer: |-
      L'artefact testé en recette est celui qui part en production. Seules les rares propriétés fixées au build,
      comme le type de base, demandent un autre build.
  - key: situation-tests-sur-la-base-locale
    format: scenario
    question: |-
      Un nouveau venu lance les tests, qui effacent sa base de développement. L'URL de la base est écrite sans
      préfixe dans `application.properties`. Que fais-tu ?
    choices:
      - {text: "Je la préfixe par `%dev.`, et les tests reçoivent une base de Dev Services", correct: true}
      - {text: "Je lui demande de sauvegarder sa base avant chaque lancement des tests", correct: false}
      - {text: "Je désactive les tests qui écrivent en base, jusqu'à nouvel ordre", correct: false}
      - {text: "Je lui fais créer une seconde base locale, réservée aux seuls tests", correct: false}
    answer: |-
      Sans URL pour le profil `test`, Dev Services démarre une base jetable dans un conteneur : les tests ne touchent
      plus aux données de personne. Il faut Docker, ou un équivalent, sur le poste.
