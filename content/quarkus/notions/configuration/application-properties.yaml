notion: application-properties
lesson: |-
  Une application Quarkus lit sa configuration dans un fichier principal,
  `src/main/resources/application.properties`, une ligne `clé=valeur` par réglage :

  ```properties
  # Les réglages de Quarkus commencent par quarkus.
  quarkus.http.port=8081
  quarkus.datasource.db-kind=postgresql

  # Les tiens, sous un préfixe à toi
  boutique.devise=EUR
  boutique.pays-livres=FR,BE,CH
  ```

  Les clés `quarkus.*` règlent le framework et ses extensions ; une clé `quarkus.*` mal orthographiée ne fait pas
  échouer le démarrage, mais Quarkus l'annonce par un avertissement « Unrecognized configuration key ». Tes propres
  clés vivent sous un préfixe qui t'appartient (`boutique.*`). Une liste s'écrit avec des virgules.

  **Plusieurs sources, une seule vue.** Quarkus s'appuie sur MicroProfile Config, implémenté par SmallRye Config. La
  configuration est l'union de plusieurs **sources**, chacune avec un **ordinal** : pour une même clé, la source à
  l'ordinal le plus élevé gagne.

  | Source | Ordinal |
  |---|---|
  | Propriétés système (`-Dquarkus.http.port=9000`) | 400 |
  | Variables d'environnement (`QUARKUS_HTTP_PORT=9000`) | 300 |
  | Fichier `.env` du répertoire de travail | 295 |
  | `config/application.properties` du répertoire de travail | 260 |
  | `application.properties` du classpath (`src/main/resources`) | 250 |
  | `META-INF/microprofile-config.properties` | 100 |

  Le fichier du projet donne donc les **valeurs par défaut**, et l'environnement les surcharge sans reconstruire :

  ```bash
  java -Dquarkus.http.port=9000 -jar target/quarkus-app/quarkus-run.jar
  ```

  **Les expressions.** Une valeur peut citer une autre propriété ou une variable d'environnement, avec une valeur de
  repli après les deux-points :

  ```properties
  boutique.url-api=${BOUTIQUE_URL:http://localhost:8080}/api
  ```

  Sans valeur de repli, une expression qui ne se résout pas fait échouer le démarrage.

  **Lire une valeur.** Dans un bean, on l'injecte avec `@ConfigProperty` ou `@ConfigMapping` (notions suivantes).
  Hors d'un bean, on passe par l'API de MicroProfile Config :

  ```java
  String devise = ConfigProvider.getConfig().getValue("boutique.devise", String.class);
  Optional<String> slogan = ConfigProvider.getConfig().getOptionalValue("boutique.slogan", String.class);
  ```

  **D'autres formats.** L'extension `quarkus-config-yaml` permet d'écrire `application.yaml` à la place ; on garde un
  seul format par projet. En mode dev, la Dev UI montre toute la configuration et permet de la modifier.

  **En entretien** : « La configuration de Quarkus vient de plusieurs sources classées par ordinal :
  `application.properties` donne les valeurs par défaut, et les variables d'environnement ou les propriétés système
  les surchargent sans reconstruire. Les expressions `${VAR:defaut}` relient une valeur à l'environnement. Je garde
  mes clés sous un préfixe à moi, et je lis la configuration par injection plutôt qu'à la main. »
cards:
  - key: fichier-principal
    format: course
    question: Où se trouve le fichier de configuration principal d'une application Quarkus ?
    choices:
      - {text: "`src/main/resources/application.properties`", correct: true}
      - {text: "`src/main/java/application.properties`", correct: false}
      - {text: "`src/main/resources/META-INF/quarkus.xml`", correct: false}
      - {text: "`config/quarkus.properties` à la racine", correct: false}
    answer: "Maven copie `src/main/resources` dans le classpath, où Quarkus lit `application.properties`. Un fichier sous `src/main/java` n'est pas copié."
  - key: ordinal-gagnant
    format: course
    question: Deux sources de configuration donnent une valeur à la même clé. Laquelle l'emporte ?
    choices:
      - {text: "Celle dont l'ordinal est le plus élevé", correct: true}
      - {text: "Celle dont l'ordinal est le plus faible", correct: false}
      - {text: "Celle qui a été chargée en dernier", correct: false}
      - {text: "Aucune : le démarrage échoue sur le conflit", correct: false}
    answer: "Chaque source a un ordinal : propriétés système 400, variables d'environnement 300, `application.properties` 250. Pour une même clé, l'ordinal le plus haut gagne."
  - key: sens-de-l-expression
    format: course
    question: "Que vaut `boutique.url=${BOUTIQUE_URL:http://localhost:8080}` quand la variable `BOUTIQUE_URL` n'existe pas ?"
    choices:
      - {text: "`http://localhost:8080`, la valeur de repli", correct: true}
      - {text: "La chaîne vide, faute de variable définie", correct: false}
      - {text: "Le texte `${BOUTIQUE_URL}`, laissé tel quel", correct: false}
      - {text: "Rien : le démarrage échoue sur l'expression", correct: false}
    answer: "Après les deux-points vient la valeur de repli. Sans elle, une expression qui ne se résout pas ferait échouer le démarrage."
  - key: role-du-fichier-projet
    format: course
    question: "Quel rôle joue `application.properties` dans une application déployée en plusieurs environnements ?"
    choices:
      - {text: "Il donne les valeurs par défaut, que l'environnement surcharge", correct: true}
      - {text: "Il fixe les valeurs définitives, que rien ne peut surcharger", correct: false}
      - {text: "Il ne sert qu'en mode dev, la production l'ignorant", correct: false}
      - {text: "Il ne contient que les clés `quarkus.*`, jamais les tiennes", correct: false}
    answer: "Le fichier est la source au plus faible ordinal parmi les usuelles : une variable d'environnement ou une propriété système le surcharge sans reconstruire l'application."
  - key: vf-variable-l-emporte
    format: true-false
    question: "Une variable d'environnement l'emporte sur la valeur de la même clé dans `application.properties`."
    truth: true
    answer: "Les variables d'environnement ont l'ordinal 300, le fichier du classpath 250. C'est ce qui permet de régler la production sans toucher au fichier."
  - key: vf-lue-seulement-au-build
    format: true-false
    question: "Quarkus ne lit sa configuration qu'à la compilation : une valeur ne peut plus changer une fois l'application construite."
    truth: false
    answer: "Seules certaines propriétés de Quarkus sont fixées au build (le type de base, par exemple). La plupart, comme le port HTTP, l'URL de la base ou les tiennes, sont lues au démarrage."
  - key: vf-cle-quarkus-inconnue
    format: true-false
    question: "Une clé `quarkus.*` mal orthographiée dans `application.properties` est signalée par un avertissement au démarrage."
    truth: true
    answer: "Quarkus connaît toutes ses propriétés : une clé inconnue de son espace de noms produit « Unrecognized configuration key ». Le démarrage continue, avec la valeur par défaut."
  - key: vf-config-du-repertoire
    format: true-false
    question: "Un fichier `config/application.properties` placé dans le répertoire de travail l'emporte sur celui du classpath."
    truth: true
    answer: "Son ordinal est 260, contre 250 pour celui du classpath. On peut ainsi poser un fichier à côté du jar pour régler un environnement."
  - key: qcm-ordre-des-sources
    format: multiple-choice
    question: Quel ordre de priorité est le bon, de la source la plus forte à la plus faible ?
    choices:
      - {text: "Propriété système, variable d'environnement, `application.properties`", correct: true}
      - {text: "`application.properties`, variable d'environnement, propriété système", correct: false}
      - {text: "Variable d'environnement, `application.properties`, propriété système", correct: false}
      - {text: "Propriété système, `application.properties`, variable d'environnement", correct: false}
    answer: "Ordinaux 400, 300 et 250. Le fichier du projet est le plus faible : il donne les valeurs par défaut."
  - key: qcm-yaml
    format: multiple-choice
    question: Ton équipe préfère écrire la configuration en YAML. Que fais-tu ?
    choices:
      - {text: "J'ajoute l'extension `quarkus-config-yaml`, puis j'écris `application.yaml`", correct: true}
      - {text: "Je renomme simplement le fichier en `application.yaml`, lu d'office", correct: false}
      - {text: "J'ajoute `quarkus.config.format=yaml` dans `application.properties`", correct: false}
      - {text: "J'écris le YAML dans `META-INF/microprofile-config.properties`", correct: false}
    answer: "Le YAML demande l'extension `quarkus-config-yaml` ; sans elle, `application.yaml` est ignoré. On garde un seul format par projet."
  - key: qcm-lire-hors-bean
    format: multiple-choice
    question: Comment lis-tu une valeur de configuration dans une classe qui n'est pas un bean CDI ?
    choices:
      - {text: "`ConfigProvider.getConfig().getValue(\"boutique.devise\", String.class)`", correct: true}
      - {text: "`System.getProperty(\"boutique.devise\")`, qui lit toutes les sources", correct: false}
      - {text: "`@ConfigProperty` sur un champ, qui marche aussi hors des beans", correct: false}
      - {text: "`new Properties().load(...)` sur le fichier `application.properties`", correct: false}
    answer: "`ConfigProvider` donne la configuration complète, toutes sources confondues. `System.getProperty` ne lit que les propriétés système, et `Properties.load` qu'un seul fichier, sans les surcharges."
  - key: qcm-port-trois-sources
    format: multiple-choice
    question: "Le fichier dit `quarkus.http.port=8080`, l'environnement `QUARKUS_HTTP_PORT=8000`, et l'application est lancée avec `-Dquarkus.http.port=9000`. Sur quel port écoute-t-elle ?"
    choices:
      - {text: "9000", correct: true}
      - {text: "8000", correct: false}
      - {text: "8080", correct: false}
      - {text: "Aucun : le démarrage échoue sur le conflit", correct: false}
    answer: "La propriété système (400) l'emporte sur la variable d'environnement (300), qui l'emporte sur le fichier (250)."
  - key: trous-port-http
    format: fill-in
    question: |-
      Complète pour que l'application écoute sur le port 8081 :
      ```properties
      quarkus.http.___=8081
      ```
    blanks:
      - [port]
    answer: "`quarkus.http.port` règle le port HTTP ; il vaut 8080 par défaut, et 8081 pendant les tests."
  - key: trous-valeur-de-repli
    format: fill-in
    question: |-
      Complète pour lire la variable `BOUTIQUE_URL`, avec `http://localhost:8080` quand elle n'existe pas :
      ```properties
      boutique.url=${BOUTIQUE_URL___http://localhost:8080}
      ```
    blanks:
      - [":"]
    answer: "Dans une expression, les deux-points séparent la clé de sa valeur de repli : `${BOUTIQUE_URL:http://localhost:8080}`."
  - key: trous-getvalue
    format: fill-in
    question: |-
      Complète pour lire une valeur obligatoire hors d'un bean :
      ```java
      String devise = ConfigProvider.getConfig().___("boutique.devise", String.class);
      ```
    blanks:
      - [getValue]
    answer: "`getValue` lève une exception si la clé manque ; `getOptionalValue` renvoie un `Optional`."
  - key: trous-propriete-systeme
    format: fill-in
    question: |-
      Complète pour lancer l'application sur le port 9000 sans toucher à sa configuration :
      ```bash
      java ___quarkus.http.port=9000 -jar target/quarkus-app/quarkus-run.jar
      ```
    blanks:
      - ["-D"]
    answer: "`-D` définit une propriété système, la source à l'ordinal le plus élevé (400)."
  - key: bug-fichier-dans-java
    format: bug-fix
    question: |-
      L'application ignore tous les réglages de ce fichier, rangé dans `src/main/java/application.properties` :
      elle démarre sur le port 8080. Quelle correction est la bonne ?
      ```properties
      quarkus.http.port=8081
      boutique.devise=EUR
      ```
    choices:
      - {text: "Déplacer le fichier dans `src/main/resources`", correct: true}
      - {text: "Préfixer chaque ligne par `%prod.`", correct: false}
      - {text: "Renommer le fichier en `quarkus.properties`", correct: false}
      - {text: "Ajouter `quarkus.config.enabled=true` en tête", correct: false}
    answer: |-
      ```
      src/main/resources/application.properties
      ```
      Maven ne copie dans le classpath que les fichiers de `src/main/resources` ; sous `src/main/java`, seules les
      classes compilées en sortent. Quarkus ne voit donc pas le fichier.
  - key: bug-cle-mal-orthographiee
    format: bug-fix
    question: |-
      L'application démarre toujours sur le port 8080, et le journal affiche un avertissement « Unrecognized
      configuration key ». Quelle correction est la bonne ?
      ```properties
      quarkus.http.prot=9000
      ```
    choices:
      - {text: "Écrire `quarkus.http.port=9000`", correct: true}
      - {text: "Écrire `%prod.quarkus.http.prot=9000`", correct: false}
      - {text: "Écrire `quarkus.http.prot=\"9000\"`", correct: false}
      - {text: "Écrire `QUARKUS_HTTP_PROT=9000`", correct: false}
    answer: |-
      ```properties
      quarkus.http.port=9000
      ```
      Une clé `quarkus.*` inconnue n'arrête pas le démarrage : elle est ignorée, avec un avertissement. Lire les
      avertissements du démarrage évite de chercher longtemps.
  - key: bug-expression-sans-repli
    format: bug-fix
    question: |-
      Sur le poste d'un collègue, qui n'a pas défini `BOUTIQUE_URL`, le démarrage échoue : « Could not expand value
      BOUTIQUE_URL in property boutique.url ». En local, `http://localhost:8080` suffit. Quelle correction est la
      bonne ?
      ```properties
      boutique.url=${BOUTIQUE_URL}
      ```
    choices:
      - {text: "Écrire `${BOUTIQUE_URL:http://localhost:8080}`", correct: true}
      - {text: "Écrire `${BOUTIQUE_URL}:http://localhost:8080`", correct: false}
      - {text: "Écrire `$BOUTIQUE_URL`, sans les accolades", correct: false}
      - {text: "Écrire `${boutique.url:BOUTIQUE_URL}`", correct: false}
    answer: |-
      ```properties
      boutique.url=${BOUTIQUE_URL:http://localhost:8080}
      ```
      La valeur de repli se place dans l'expression, après les deux-points. Sans elle, une variable absente rend la
      valeur impossible à calculer, et Quarkus refuse de démarrer.
  - key: bug-liste-en-plusieurs-lignes
    format: bug-fix
    question: |-
      `boutique.pays-livres`, injectée dans une `List<String>`, ne contient que `CH`. Quelle correction est la
      bonne ?
      ```properties
      boutique.pays-livres=FR
      boutique.pays-livres=BE
      boutique.pays-livres=CH
      ```
    choices:
      - {text: "Écrire une seule ligne : `boutique.pays-livres=FR,BE,CH`", correct: true}
      - {text: "Numéroter les clés : `boutique.pays-livres.1=FR`, etc.", correct: false}
      - {text: "Injecter un `Set<String>` au lieu d'une `List<String>`", correct: false}
      - {text: "Séparer les valeurs par des points-virgules sur une ligne", correct: false}
    answer: |-
      ```properties
      boutique.pays-livres=FR,BE,CH
      ```
      Dans un fichier de propriétés, une clé répétée garde sa dernière valeur. Une liste s'écrit sur une ligne, ses
      éléments séparés par des virgules.
