notion: variables-environnement
lesson: |-
  En conteneur, on règle une application par ses **variables d'environnement** : l'image reste la même, seul
  l'environnement change. Quarkus les lit comme une source de configuration, d'ordinal 300 : elles l'emportent sur
  `application.properties` (250), mais pas sur une propriété système `-D` (400).

  **La règle de nommage.** Le nom d'une variable ne peut contenir ni point ni tiret. Pour trouver la variable d'une
  clé :

  1. remplace chaque caractère qui n'est ni une lettre ni un chiffre par `_` ;
  2. passe le tout en majuscules.

  | Propriété | Variable d'environnement |
  |---|---|
  | `quarkus.http.port` | `QUARKUS_HTTP_PORT` |
  | `quarkus.datasource.jdbc.url` | `QUARKUS_DATASOURCE_JDBC_URL` |
  | `boutique.seuil-gratuit` | `BOUTIQUE_SEUIL_GRATUIT` |
  | `%prod.quarkus.http.port` | `_PROD_QUARKUS_HTTP_PORT` |
  | `quarkus.datasource."ventes".jdbc.url` | `QUARKUS_DATASOURCE__VENTES__JDBC_URL` |

  Le `%` et le point du préfixe de profil deviennent chacun un `_` : la variable commence donc par un tiret bas. Les
  guillemets d'une clé nommée aussi : d'où les doubles tirets bas autour de `VENTES`.

  **Dans quel sens ?** Quarkus part des clés qu'il connaît (les siennes, celles de tes `@ConfigProperty` et
  `@ConfigMapping`, celles du fichier) et cherche la variable correspondante. Une variable n'a donc pas besoin d'être
  déclarée dans `application.properties` pour surcharger une clé injectée. Mais le chemin inverse est ambigu :
  `BOUTIQUE_SEUIL_GRATUIT` pourrait venir de `boutique.seuil.gratuit` ou de `boutique.seuil-gratuit`. D'où une
  convention : des clés en minuscules, les mots séparés par des tirets (kebab-case).

  **En pratique.**

  ```bash
  docker run -e QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/boutique \
             -e QUARKUS_DATASOURCE_PASSWORD=secret \
             boutique:1.0
  ```

  ```yaml
  # Kubernetes : le même nom, dans la description du conteneur
  env:
    - name: QUARKUS_HTTP_PORT
      value: "8080"
  ```

  **Le fichier `.env`.** En développement, un fichier `.env` dans le répertoire de travail se lit comme des variables
  d'environnement (ordinal 295), au même format :

  ```properties
  BOUTIQUE_CLE_API=cle-de-dev
  QUARKUS_LOG_LEVEL=DEBUG
  ```

  Il contient souvent des secrets : il va dans le `.gitignore`.

  **En entretien** : « Pour la variable d'une clé, je remplace tout ce qui n'est ni lettre ni chiffre par un tiret
  bas, et je passe en majuscules : `quarkus.datasource.jdbc.url` devient `QUARKUS_DATASOURCE_JDBC_URL`. Les
  variables l'emportent sur `application.properties`, ce qui permet de régler un conteneur sans reconstruire l'image.
  Un préfixe de profil devient `_PROD_`, et je garde mes clés en kebab-case pour éviter les ambiguïtés. »
cards:
  - key: variable-du-mot-de-passe
    format: course
    question: "Quelle variable d'environnement surcharge `quarkus.datasource.password` ?"
    choices:
      - {text: "`QUARKUS_DATASOURCE_PASSWORD`", correct: true}
      - {text: "`QUARKUS.DATASOURCE.PASSWORD`", correct: false}
      - {text: "`QuarkusDatasourcePassword`", correct: false}
      - {text: "`DATASOURCE_PASSWORD`", correct: false}
    answer: "Chaque caractère qui n'est ni lettre ni chiffre devient `_`, puis tout passe en majuscules. Le préfixe `quarkus` reste."
  - key: regle-de-nommage
    format: course
    question: Quelle règle donne le nom de la variable d'environnement d'une propriété ?
    choices:
      - {text: "Remplacer tout caractère non alphanumérique par `_`, puis passer en majuscules", correct: true}
      - {text: "Retirer les points et les tirets, puis passer le nom entier en majuscules", correct: false}
      - {text: "Garder la clé telle quelle, précédée du préfixe `ENV_` en majuscules", correct: false}
      - {text: "Remplacer les points par des tirets, en gardant les minuscules de la clé", correct: false}
    answer: "Points, tirets, guillemets et `%` deviennent des `_`. `boutique.seuil-gratuit` devient `BOUTIQUE_SEUIL_GRATUIT`."
  - key: variable-d-un-profil
    format: course
    question: "Quelle variable d'environnement surcharge `%prod.quarkus.http.port` ?"
    choices:
      - {text: "`_PROD_QUARKUS_HTTP_PORT`", correct: true}
      - {text: "`PROD_QUARKUS_HTTP_PORT`", correct: false}
      - {text: "`QUARKUS_HTTP_PORT_PROD`", correct: false}
      - {text: "`%PROD_QUARKUS_HTTP_PORT`", correct: false}
    answer: "Le `%` devient `_`, comme le point qui suit le nom du profil : la variable commence par un tiret bas."
  - key: variable-avec-tiret
    format: course
    question: "Quelle variable d'environnement surcharge `boutique.seuil-gratuit` ?"
    choices:
      - {text: "`BOUTIQUE_SEUIL_GRATUIT`", correct: true}
      - {text: "`BOUTIQUE_SEUIL-GRATUIT`", correct: false}
      - {text: "`BOUTIQUE_SEUILGRATUIT`", correct: false}
      - {text: "`BOUTIQUE__SEUIL_GRATUIT`", correct: false}
    answer: "Le tiret, comme le point, devient un `_`. Un tiret ne peut pas figurer dans le nom d'une variable de shell."
  - key: vf-tiret-devient-tiret-bas
    format: true-false
    question: "Le tiret d'une clé, comme dans `seuil-gratuit`, devient un `_` dans le nom de la variable d'environnement."
    truth: true
    answer: "Tout caractère qui n'est ni lettre ni chiffre devient `_`. C'est pourquoi `seuil-gratuit` et `seuil.gratuit` donnent la même variable."
  - key: vf-declaration-obligatoire
    format: true-false
    question: "Une variable d'environnement n'est prise en compte que si sa clé figure aussi dans `application.properties`."
    truth: false
    answer: "Quarkus connaît ses propres clés et celles de tes injections : il cherche leurs variables d'office. Déclarer la clé n'aide que pour lever une ambiguïté, sur une clé que rien n'injecte."
  - key: vf-fichier-env
    format: true-false
    question: "Le fichier `.env` du répertoire de travail est lu comme une source de variables d'environnement."
    truth: true
    answer: "Son ordinal est 295, juste sous celui des vraies variables (300). Il sert surtout en développement, et ne se commite pas."
  - key: vf-variable-contre-propriete-systeme
    format: true-false
    question: "`QUARKUS_HTTP_PORT` l'emporte sur `-Dquarkus.http.port`."
    truth: false
    answer: "Les propriétés système ont l'ordinal 400, les variables d'environnement 300 : `-D` l'emporte."
  - key: qcm-docker
    format: multiple-choice
    question: Comment donnes-tu l'URL de la base à l'image de l'application, au lancement de son conteneur ?
    choices:
      - {text: "`docker run -e QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/boutique boutique:1.0`", correct: true}
      - {text: "`docker run -e quarkus-datasource-jdbc-url=jdbc:postgresql://db:5432/boutique boutique:1.0`", correct: false}
      - {text: "`docker run --config quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/boutique boutique:1.0`", correct: false}
      - {text: "`docker run -e DATASOURCE_URL=jdbc:postgresql://db:5432/boutique boutique:1.0`", correct: false}
    answer: "Une variable d'environnement au nom tiré de la clé règle le conteneur sans reconstruire l'image. `DATASOURCE_URL` ne correspond à aucune clé."
  - key: qcm-source-nommee
    format: multiple-choice
    question: "Quelle variable d'environnement surcharge `quarkus.datasource.\"ventes\".jdbc.url` ?"
    choices:
      - {text: "`QUARKUS_DATASOURCE__VENTES__JDBC_URL`", correct: true}
      - {text: "`QUARKUS_DATASOURCE_\"VENTES\"_JDBC_URL`", correct: false}
      - {text: "`VENTES_QUARKUS_DATASOURCE_JDBC_URL`", correct: false}
      - {text: "`QUARKUS_DATASOURCE_JDBC_URL_VENTES`", correct: false}
    answer: "Les guillemets deviennent eux aussi des `_` : le point et le guillemet donnent deux tirets bas autour du nom."
  - key: qcm-gitignore-env
    format: multiple-choice
    question: "Pourquoi le fichier `.env` va-t-il dans le `.gitignore` ?"
    choices:
      - {text: "Il contient souvent des secrets propres au poste du développeur", correct: true}
      - {text: "Quarkus refuse de démarrer quand il est suivi par Git", correct: false}
      - {text: "Il est régénéré à chaque build, son contenu serait perdu", correct: false}
      - {text: "Git ne sait pas suivre un fichier dont le nom commence par un point", correct: false}
    answer: "Clés d'API, mots de passe de développement : ce fichier est personnel. On commite plutôt un `.env.example` sans valeurs."
  - key: qcm-niveau-de-log
    format: multiple-choice
    question: "Que fait `QUARKUS_LOG_LEVEL=DEBUG` au lancement de l'application ?"
    choices:
      - {text: "Il règle `quarkus.log.level` à DEBUG, au-dessus du fichier", correct: true}
      - {text: "Rien : seules les propriétés `-D` surchargent le fichier", correct: false}
      - {text: "Il active le mode dev de Quarkus, et ses journaux", correct: false}
      - {text: "Il règle le niveau de journalisation de Docker lui-même", correct: false}
    answer: "La variable correspond à `quarkus.log.level`, le niveau de la catégorie racine ; elle l'emporte sur `application.properties`."
  - key: trous-variable-docker
    format: fill-in
    question: |-
      Complète pour régler l'URL de la base (`quarkus.datasource.jdbc.url`) au lancement du conteneur :
      ```bash
      docker run -e ___=jdbc:postgresql://db:5432/boutique boutique:1.0
      ```
    blanks:
      - [QUARKUS_DATASOURCE_JDBC_URL]
    answer: "Points en tirets bas, puis majuscules : `QUARKUS_DATASOURCE_JDBC_URL`."
  - key: trous-variable-port
    format: fill-in
    question: |-
      Complète pour que l'application écoute sur le port 9000 :
      ```bash
      export ___=9000
      java -jar target/quarkus-app/quarkus-run.jar
      ```
    blanks:
      - [QUARKUS_HTTP_PORT]
    answer: "`QUARKUS_HTTP_PORT` surcharge `quarkus.http.port`, défini ou non dans le fichier."
  - key: trous-variable-profil
    format: fill-in
    question: |-
      Complète pour surcharger `%prod.quarkus.http.port` par une variable d'environnement :
      ```bash
      export ___=80
      ```
    blanks:
      - [_PROD_QUARKUS_HTTP_PORT]
    answer: "Le `%` et le point du préfixe deviennent des `_` : `_PROD_QUARKUS_HTTP_PORT`."
  - key: trous-fichier-env
    format: fill-in
    question: |-
      Complète ce fichier `.env` pour régler `boutique.seuil-gratuit` à 30 :
      ```properties
      ___=30
      ```
    blanks:
      - [BOUTIQUE_SEUIL_GRATUIT]
    answer: "Le `.env` suit la règle des variables d'environnement : `BOUTIQUE_SEUIL_GRATUIT`."
  - key: bug-tirets-dans-la-variable
    format: bug-fix
    question: |-
      Le conteneur démarre sur le port 8080, comme si la variable n'existait pas. Quelle correction est la bonne ?
      ```bash
      docker run -e QUARKUS-HTTP-PORT=9000 boutique:1.0
      ```
    choices:
      - {text: "Écrire `QUARKUS_HTTP_PORT=9000`", correct: true}
      - {text: "Écrire `quarkus-http-port=9000`", correct: false}
      - {text: "Écrire `QUARKUS-HTTP-PORT=\"9000\"`", correct: false}
      - {text: "Écrire `QUARKUS-HTTP-PORT=9000` après le nom de l'image", correct: false}
    answer: |-
      ```bash
      docker run -e QUARKUS_HTTP_PORT=9000 boutique:1.0
      ```
      Les tirets restent des tirets : aucune clé connue ne correspond à ce nom. La règle remplace chaque caractère
      non alphanumérique par un tiret bas.
  - key: bug-separateur-oublie
    format: bug-fix
    question: |-
      L'application se connecte toujours à la base de `application.properties`, malgré cette variable. Quelle
      correction est la bonne ?
      ```bash
      export QUARKUS_DATASOURCE_JDBCURL=jdbc:postgresql://db:5432/boutique
      ```
    choices:
      - {text: "Écrire `QUARKUS_DATASOURCE_JDBC_URL`", correct: true}
      - {text: "Écrire `QUARKUS_DATASOURCE_JDBC.URL`", correct: false}
      - {text: "Écrire `QUARKUS_DATASOURCEJDBCURL`", correct: false}
      - {text: "Écrire `quarkus_datasource_jdbcurl`", correct: false}
    answer: |-
      ```bash
      export QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/boutique
      ```
      Le point entre `jdbc` et `url` devient lui aussi un tiret bas. Sans lui, le nom ne correspond à aucune clé.
  - key: bug-profil-sans-tiret-bas
    format: bug-fix
    question: |-
      La valeur `%prod.quarkus.http.port=8080` du fichier doit être surchargée en production, mais cette variable
      reste sans effet. Quelle correction est la bonne ?
      ```bash
      export PROD_QUARKUS_HTTP_PORT=80
      ```
    choices:
      - {text: "Écrire `_PROD_QUARKUS_HTTP_PORT=80`", correct: true}
      - {text: "Écrire `%PROD_QUARKUS_HTTP_PORT=80`", correct: false}
      - {text: "Écrire `QUARKUS_HTTP_PORT_PROD=80`", correct: false}
      - {text: "Écrire `PROD.QUARKUS_HTTP_PORT=80`", correct: false}
    answer: |-
      ```bash
      export _PROD_QUARKUS_HTTP_PORT=80
      ```
      Le `%` du préfixe devient lui aussi un tiret bas : la variable d'une clé de profil commence par `_`.
  - key: bug-cle-en-camelcase
    format: bug-fix
    question: |-
      La variable `BOUTIQUE_SEUIL_GRATUIT=30` est définie, mais le seuil reste à 50. Quelle correction est la
      bonne ?
      ```java
      @ConfigProperty(name = "boutique.seuilGratuit", defaultValue = "50")
      int seuilGratuit;
      ```
    choices:
      - {text: "Nommer la clé `boutique.seuil-gratuit`, en kebab-case", correct: true}
      - {text: "Ajouter `@Inject` devant l'annotation", correct: false}
      - {text: "Retirer la valeur par défaut de l'annotation", correct: false}
      - {text: "Déclarer le champ en `Integer` plutôt qu'en `int`", correct: false}
    answer: |-
      ```java
      @ConfigProperty(name = "boutique.seuil-gratuit", defaultValue = "50")
      int seuilGratuit;
      ```
      La variable de `boutique.seuilGratuit` serait `BOUTIQUE_SEUILGRATUIT`, sans séparateur entre les deux mots.
      En kebab-case, le tiret devient le tiret bas attendu.
