notion: quarkus-presentation
lesson: |-
  **Quarkus** est un framework Java pour écrire des services web, des API et des traitements de messages. Sa devise,
  « Supersonic Subatomic Java », résume son but : une application Java qui **démarre vite** et **consomme peu de
  mémoire**, pour vivre dans un conteneur, sur Kubernetes ou en serverless.

  **Pourquoi un nouveau framework ?** Les frameworks Java classiques ont été conçus pour des serveurs qui tournent
  des mois : au démarrage, ils parcourent le classpath, lisent les annotations par réflexion, construisent leurs
  modèles et leurs proxies. Ce travail coûte des secondes et de la mémoire **à chaque démarrage**. Dans un cluster où
  l'on lance des dizaines de répliques, où l'on démarre une instance à la demande, ce coût se paie sans cesse.

  **La réponse de Quarkus** : faire ce travail **une fois, au build** (voir la notion « build time »). L'application
  livrée contient déjà le résultat de l'analyse ; elle n'a plus qu'à démarrer.

  | Ce que vise Quarkus | Comment |
  |---|---|
  | Démarrage rapide | analyse et génération de code au build, pas de scan au démarrage |
  | Peu de mémoire | moins de classes chargées, pas de métadonnées construites à l'exécution |
  | Plaisir du développeur | mode dev avec rechargement à chaud, Dev Services, Dev UI |
  | Standards | CDI, Jakarta REST, Jakarta Persistence, MicroProfile |
  | Impératif et réactif | les deux styles dans la même application, sur Vert.x |

  **Deux façons de l'exécuter.**

  - **Sur la JVM** : `./mvnw package` produit le dossier `target/quarkus-app/`, qu'on lance avec
    `java -jar target/quarkus-app/quarkus-run.jar`. C'est le mode le plus courant.
  - **En image native** : `./mvnw package -Dnative` compile l'application avec GraalVM (ou Mandrel, sa distribution
    maintenue par Red Hat pour Quarkus) en un exécutable autonome, sans JVM. Démarrage en quelques dizaines de
    millisecondes, mémoire très réduite ; en échange, un build long, et la réflexion à déclarer.

  ```bash
  ./mvnw package                      # application JVM, dans target/quarkus-app/
  ./mvnw package -Dnative             # exécutable natif, dans target/
  java -jar target/quarkus-app/quarkus-run.jar
  ```

  **Les briques.** Quarkus n'invente pas tout : il assemble des projets connus, adaptés au build time. ArC pour
  l'injection (CDI), Quarkus REST pour les API (Jakarta REST), Hibernate ORM pour la persistance, SmallRye pour
  MicroProfile, et **Vert.x** (sur Netty) pour le réseau. Chaque brique arrive sous forme d'**extension**.

  **Pensé pour les conteneurs** (« container first ») : un projet généré contient déjà ses `Dockerfile` dans
  `src/main/docker/` (pour la JVM et pour le natif), des sondes de santé s'ajoutent par une extension, et la
  configuration se surcharge par variables d'environnement.

  **En entretien** : « Quarkus est un framework Java pensé pour les conteneurs : il déplace au build l'analyse que les
  frameworks classiques font à chaque démarrage, d'où un démarrage rapide et une faible empreinte mémoire. Il
  s'exécute sur la JVM ou en image native avec GraalVM. Il s'appuie sur des standards (CDI, Jakarta REST, JPA,
  MicroProfile) et offre un mode dev très productif. »
cards:
  - key: ce-qui-distingue-quarkus
    format: course
    question: "Qu'est-ce qui distingue d'abord Quarkus des frameworks Java classiques ?"
    choices:
      - {text: "Il fait au build l'analyse que les autres refont à chaque démarrage", correct: true}
      - {text: "Il remplace la JVM par sa propre machine virtuelle, plus légère", correct: false}
      - {text: "Il interdit la réflexion dans le code de l'application", correct: false}
      - {text: "Il compile le Java en JavaScript pour l'exécuter sur Node.js", correct: false}
    answer: "Scan du classpath, lecture des annotations, construction des modèles : Quarkus fait ce travail une fois, pendant le build. L'application livrée démarre sans le refaire, d'où sa vitesse et sa faible mémoire."
  - key: deux-modes-d-execution
    format: course
    question: "De quelles façons peut-on exécuter une application Quarkus ?"
    choices:
      - {text: "Sur la JVM, ou compilée en image native avec GraalVM", correct: true}
      - {text: "Seulement en image native : la JVM n'est pas prise en charge", correct: false}
      - {text: "Seulement dans un serveur d'applications Jakarta EE", correct: false}
      - {text: "Seulement sur la JVM : le natif est réservé à Spring Boot", correct: false}
    answer: "Le même code s'exécute sur la JVM (`quarkus-run.jar`) ou en exécutable natif (`-Dnative`). La JVM reste le mode courant ; le natif sert quand le démarrage et la mémoire priment."
  - key: briques-de-quarkus
    format: course
    question: "Sur quelles briques Quarkus repose-t-il pour l'injection et pour le réseau ?"
    choices:
      - {text: "ArC, une implémentation de CDI, et Vert.x sur Netty", correct: true}
      - {text: "Le conteneur de Spring Framework, et un Tomcat embarqué", correct: false}
      - {text: "Google Guice pour l'injection, et Jetty pour le HTTP", correct: false}
      - {text: "Des EJB pour l'injection, et un serveur WildFly embarqué", correct: false}
    answer: "ArC est le conteneur CDI de Quarkus, conçu pour le build time. Le serveur HTTP et les entrées-sorties reposent sur Vert.x, lui-même construit sur Netty."
  - key: dockerfiles-generes
    format: course
    question: "Que trouve-t-on dans `src/main/docker/` d'un projet Quarkus généré ?"
    choices:
      - {text: "Des `Dockerfile` pour une image JVM et pour une image native", correct: true}
      - {text: "Les fichiers de configuration des Dev Services", correct: false}
      - {text: "Un `docker-compose.yml` qui démarre la base de données", correct: false}
      - {text: "Les manifestes Kubernetes de l'application", correct: false}
    answer: "Quarkus se veut « container first » : le projet arrive avec ses `Dockerfile.jvm` et `Dockerfile.native`, entre autres. Les Dev Services, eux, n'ont besoin d'aucun fichier."
  - key: vf-jvm-non-prise-en-charge
    format: true-false
    question: "Une application Quarkus doit être compilée en image native : elle ne s'exécute pas sur une JVM."
    truth: false
    answer: "La JVM est le mode le plus courant : `java -jar target/quarkus-app/quarkus-run.jar`. L'image native est une option, choisie pour un démarrage quasi instantané et une mémoire minimale."
  - key: vf-imperatif-et-reactif
    format: true-false
    question: "Une même application Quarkus peut mêler du code impératif et du code réactif."
    truth: true
    answer: "Quarkus repose sur Vert.x, réactif par nature, mais exécute le code bloquant sur des threads de travail. On choisit le style méthode par méthode."
  - key: vf-standards
    format: true-false
    question: "Quarkus s'appuie sur des API standard comme CDI, Jakarta REST et Jakarta Persistence."
    truth: true
    answer: "Un développeur Jakarta EE y retrouve `@Inject`, `@Path`, `@Entity`. Quarkus en implémente une sélection, optimisée pour le build time, et ajoute ses propres API (Panache, Mutiny)."
  - key: vf-quarkus-run-jar-seul
    format: true-false
    question: "`./mvnw package -Dnative` produit un exécutable qui démarre sans JVM installée sur la machine."
    truth: true
    answer: "GraalVM compile l'application et ce qu'elle utilise du JDK en code machine. L'exécutable embarque un petit runtime (ramasse-miettes compris) : il suffit de la bonne architecture et du bon système."
  - key: qcm-lancer-l-application
    format: multiple-choice
    question: "Après `./mvnw package`, quelle commande lance l'application sur la JVM ?"
    choices:
      - {text: "`java -jar target/quarkus-app/quarkus-run.jar`", correct: true}
      - {text: "`java -jar target/quarkus-app/lib/main.jar`", correct: false}
      - {text: "`java -cp target/classes io.quarkus.Main`", correct: false}
      - {text: "`./target/quarkus-app/quarkus-run`", correct: false}
    answer: "Le format par défaut, le fast-jar, range l'application dans `target/quarkus-app/` ; `quarkus-run.jar` en est le point d'entrée, et lit les autres jars du dossier."
  - key: qcm-image-native
    format: multiple-choice
    question: "Quelle commande Maven construit l'exécutable natif d'une application Quarkus ?"
    choices:
      - {text: "`./mvnw package -Dnative`", correct: true}
      - {text: "`./mvnw quarkus:dev -Dnative`", correct: false}
      - {text: "`./mvnw native:compile`", correct: false}
      - {text: "`./mvnw package -Pjvm`", correct: false}
    answer: "`-Dnative` active la compilation native au moment du `package`. Sans GraalVM installé, Quarkus peut lancer la compilation dans un conteneur (`-Dquarkus.native.container-build=true`)."
  - key: qcm-serverless
    format: multiple-choice
    question: "Pourquoi un démarrage rapide compte-t-il autant pour une fonction serverless ?"
    choices:
      - {text: "Une instance démarre à la demande : la première requête attend ce démarrage", correct: true}
      - {text: "La plateforme facture chaque ligne de journal écrite pendant le démarrage", correct: false}
      - {text: "Le serverless interdit les applications de plus de cent classes", correct: false}
      - {text: "Une fonction ne peut pas lire sa configuration après son démarrage", correct: false}
    answer: "Une plateforme serverless arrête les instances inutiles et en démarre au besoin : c'est le démarrage à froid (cold start). Un démarrage en millisecondes le rend invisible pour l'utilisateur."
  - key: qcm-pile-rest-par-defaut
    format: multiple-choice
    question: "Quelle est la pile REST par défaut de Quarkus 3 ?"
    choices:
      - {text: "Quarkus REST, l'ancien RESTEasy Reactive", correct: true}
      - {text: "RESTEasy Classic, sur des servlets", correct: false}
      - {text: "Spring MVC, par une extension de compatibilité", correct: false}
      - {text: "Jersey, l'implémentation de référence", correct: false}
    answer: "Quarkus REST (extensions `quarkus-rest`, `quarkus-rest-jackson`) implémente Jakarta REST sur Vert.x, et prépare ses routes au build. RESTEasy Classic est l'ancienne pile, remplacée."
  - key: situation-facture-memoire
    format: scenario
    question: |-
      Ton équipe déploie une quarantaine de petits services Java sur Kubernetes, et la mémoire réservée par les pods
      coûte cher. Pourquoi Quarkus est-il une piste sérieuse ?
    choices:
      - {text: "Son empreinte mémoire réduite permet de loger plus de répliques par nœud", correct: true}
      - {text: "Il fusionne automatiquement les services en un seul processus partagé", correct: false}
      - {text: "Il supprime le ramasse-miettes, qui consomme la plupart de la mémoire", correct: false}
      - {text: "Il stocke l'état des services dans Kubernetes plutôt qu'en mémoire", correct: false}
    answer: |-
      Moins de classes chargées et pas de métadonnées construites au démarrage : chaque instance demande moins de
      mémoire, encore moins en natif. À budget égal, le cluster accueille plus de répliques. On le mesure sur ses
      propres services avant de promettre un chiffre.
  - key: situation-cold-start
    format: scenario
    question: |-
      Une fonction serverless écrite en Java met plusieurs secondes à répondre à la première requête après une
      période calme. Que proposes-tu ?
    choices:
      - {text: "La réécrire avec Quarkus et la compiler en image native", correct: true}
      - {text: "Augmenter le délai d'attente du client HTTP qui l'appelle", correct: false}
      - {text: "Ajouter de la mémoire à la fonction pour qu'elle reste chargée", correct: false}
      - {text: "Désactiver le ramasse-miettes pendant le démarrage de la JVM", correct: false}
    answer: |-
      Le délai vient du démarrage à froid : JVM, puis framework. Une image native Quarkus démarre en quelques
      dizaines de millisecondes. Garder des instances chaudes en permanence marche aussi, mais coûte plus cher.
  - key: situation-reecrire-pour-le-natif
    format: scenario
    question: |-
      Un collègue croit qu'il faudra réécrire toute l'application Quarkus pour la compiler en natif. Que lui
      réponds-tu ?
    choices:
      - {text: "C'est le même code : on vérifie surtout la réflexion et les bibliothèques", correct: true}
      - {text: "C'est vrai : le natif impose une autre API que celle de la JVM", correct: false}
      - {text: "C'est vrai : le natif n'accepte que du code réactif, sans blocage", correct: false}
      - {text: "C'est inutile : le natif ne sert qu'aux tests, jamais en production", correct: false}
    answer: |-
      Le code reste le même ; seule la compilation change. Les extensions préparent leurs bibliothèques pour le natif.
      Ce qui demande de l'attention : la réflexion sur ses propres classes (`@RegisterForReflection`), les ressources
      chargées dynamiquement, et les bibliothèques sans extension.
  - key: situation-api-proprietaire
    format: scenario
    question: |-
      Ton responsable craint qu'adopter Quarkus enferme l'équipe dans une API propriétaire. Que lui réponds-tu ?
    choices:
      - {text: "L'essentiel du code utilise des standards : CDI, Jakarta REST, JPA, MicroProfile", correct: true}
      - {text: "Il a raison : chaque annotation de Quarkus est propre au framework", correct: false}
      - {text: "Il a raison : Quarkus impose d'écrire tout le code en Kotlin", correct: false}
      - {text: "Aucun risque : Quarkus exécute tel quel tout code écrit pour Spring Boot", correct: false}
    answer: |-
      `@Inject`, `@Path`, `@Entity`, `@ConfigProperty` viennent de standards ouverts. Les API propres à Quarkus
      (Panache, Mutiny) sont un choix, pas une obligation. Les extensions de compatibilité Spring n'en couvrent
      qu'une partie.
  - key: def-supersonic-subatomic
    format: definition
    question: "Quelle devise résume le but de Quarkus : démarrer vite et consommer peu ?"
    choices:
      - {text: "Supersonic Subatomic Java", correct: true}
      - {text: "Write once, run anywhere", correct: false}
      - {text: "Convention over configuration", correct: false}
      - {text: "Batteries included", correct: false}
    answer: "« Supersonic » pour le démarrage, « Subatomic » pour l'empreinte mémoire. « Write once, run anywhere » est la promesse de Java lui-même."
  - key: def-mandrel
    format: definition
    question: "Quel nom porte la distribution de GraalVM, maintenue par Red Hat, centrée sur la compilation native des applications Quarkus ?"
    choices:
      - {text: "Mandrel", correct: true}
      - {text: "Narayana", correct: false}
      - {text: "SmallRye", correct: false}
      - {text: "Vert.x", correct: false}
    answer: "Mandrel ne garde de GraalVM que `native-image`, ce dont Quarkus a besoin. Narayana gère les transactions, SmallRye implémente MicroProfile, Vert.x porte le réseau."
  - key: def-container-first
    format: definition
    question: "Quelle expression désigne un framework conçu d'abord pour s'exécuter dans un conteneur (démarrage, mémoire, configuration par l'environnement) ?"
    choices:
      - {text: "Container first", correct: true}
      - {text: "Cloud agnostic", correct: false}
      - {text: "Mobile first", correct: false}
      - {text: "API first", correct: false}
    answer: "Quarkus se présente comme « container first » et « Kubernetes native » : il soigne ce qui compte dans un cluster, le démarrage, la mémoire et la configuration par variables d'environnement."
  - key: def-rss
    format: definition
    question: "Quel terme désigne la mémoire physique réellement occupée par un processus, celle que Quarkus cherche à réduire ?"
    choices:
      - {text: "La RSS (Resident Set Size)", correct: true}
      - {text: "Le tas de la JVM (heap)", correct: false}
      - {text: "La mémoire virtuelle réservée", correct: false}
      - {text: "Le Metaspace", correct: false}
    answer: "La RSS compte tout ce que le processus occupe en RAM : tas, Metaspace, piles des threads, code compilé. C'est elle que voit Kubernetes, et elle dépasse largement la taille du tas."
