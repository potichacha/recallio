notion: extensions
lesson: |-
  Dans Quarkus, presque tout arrive par une **extension** : le serveur REST, Hibernate ORM, le client Kafka, la
  sécurité OIDC, les métriques. Une extension n'est pas une simple bibliothèque : elle sait **intégrer** sa
  bibliothèque au build time.

  **Deux modules par extension.**

  | Module | Artefact | Rôle |
  |---|---|---|
  | runtime | `quarkus-hibernate-orm` | le code qui tourne dans l'application : la bibliothèque, ses recorders, sa configuration de runtime |
  | deployment | `quarkus-hibernate-orm-deployment` | les **build steps** (`@BuildStep`), exécutés seulement pendant le build |

  L'application ne déclare **que le module runtime**. Le plugin Maven de Quarkus trouve le module deployment
  correspondant et l'utilise pendant l'augmentation ; il n'entre jamais dans l'application livrée.

  **Ce qu'apporte une extension**, de plus que la bibliothèque seule :

  - l'analyse de l'application au build (les entités pour Hibernate, les routes pour Quarkus REST) ;
  - une configuration unifiée dans `application.properties` (`quarkus.hibernate-orm.*`), documentée ;
  - la préparation à l'**image native** (réflexion, ressources, proxies déclarés) ;
  - souvent un **Dev Service** (une base, un broker démarrés en dev) et une carte dans la **Dev UI**.

  **Ajouter une extension.**

  ```bash
  quarkus ext add rest-jackson hibernate-orm-panache          # avec la CLI
  ./mvnw quarkus:add-extension -Dextensions="rest-jackson"    # avec Maven
  quarkus ext list --installable                              # ce qu'on peut ajouter
  ```

  Ces commandes ajoutent la dépendance au `pom.xml` (ou au build Gradle), **sans version** : le **BOM** de la
  plateforme, importé dans `<dependencyManagement>`, aligne les versions des extensions et de leurs dépendances.

  ```xml
  <dependency>
      <groupId>io.quarkus.platform</groupId>
      <artifactId>quarkus-bom</artifactId>
      <version>${quarkus.platform.version}</version>
      <type>pom</type>
      <scope>import</scope>
  </dependency>
  ```

  **Où les trouver.** Les extensions du cœur ont le groupId `io.quarkus` ; celles de la communauté vivent dans le
  **Quarkiverse** (groupId `io.quarkiverse...`), avec leur propre cycle de versions. code.quarkus.io et
  `quarkus ext list` montrent les deux.

  **Et une bibliothèque sans extension ?** Elle fonctionne sur la JVM comme dans toute application Java. Ce qui peut
  manquer : sa configuration dans `application.properties`, et surtout son fonctionnement en natif si elle utilise la
  réflexion. On cherche d'abord une extension ; sinon, on déclare soi-même la réflexion
  (`@RegisterForReflection`), ou l'on écrit sa propre extension (`quarkus create extension`).

  **En entretien** : « Une extension Quarkus a deux modules : le runtime, que je déclare, et le deployment, dont les
  build steps intègrent la bibliothèque au build : configuration, préparation au natif, Dev Services. J'ajoute les
  extensions par la CLI ou le plugin Maven, sans version, grâce au BOM de la plateforme. Une bibliothèque sans
  extension marche sur la JVM, mais demande du travail pour le natif. »
cards:
  - key: deux-modules
    format: course
    question: "De quels modules une extension Quarkus est-elle faite ?"
    choices:
      - {text: "Un module runtime, dans l'application, et un module deployment, utilisé au build", correct: true}
      - {text: "Un module client, pour le navigateur, et un module serveur, pour l'application", correct: false}
      - {text: "Un module de test, pour les tests, et un module principal, pour la production", correct: false}
      - {text: "Un module d'API, des interfaces, et un module d'implémentation, chargé au besoin", correct: false}
    answer: "Le runtime contient le code exécuté par l'application ; le deployment contient les build steps qui analysent l'application et génèrent son code de démarrage. Le second ne part jamais en production."
  - key: dependance-a-declarer
    format: course
    question: "Quelle dépendance déclares-tu pour utiliser Hibernate ORM avec Quarkus ?"
    choices:
      - {text: "`quarkus-hibernate-orm` seulement", correct: true}
      - {text: "`quarkus-hibernate-orm-deployment` seulement", correct: false}
      - {text: "`quarkus-hibernate-orm` et son module `-deployment`", correct: false}
      - {text: "`hibernate-core`, sans aucune extension Quarkus", correct: false}
    answer: "L'application déclare le module runtime ; le plugin Maven de Quarkus résout le module deployment correspondant pour le build. `hibernate-core` seul fonctionnerait mal : rien ne l'intégrerait au build time."
  - key: extensions-sans-version
    format: course
    question: "Pourquoi les extensions Quarkus se déclarent-elles sans version dans le `pom.xml` ?"
    choices:
      - {text: "Le BOM de la plateforme, importé, fixe leurs versions et celles de leurs dépendances", correct: true}
      - {text: "Maven choisit toujours la dernière version publiée de chaque extension", correct: false}
      - {text: "Le plugin Quarkus lit la version dans `application.properties`", correct: false}
      - {text: "Les extensions n'ont pas de version : elles suivent celle de la JVM", correct: false}
    answer: "Le BOM `io.quarkus.platform:quarkus-bom` aligne des centaines d'artefacts testés ensemble. Mélanger des versions à la main, c'est risquer des incompatibilités au build ou à l'exécution."
  - key: quarkiverse
    format: course
    question: "Où vivent les extensions Quarkus maintenues par la communauté ?"
    choices:
      - {text: "Dans le Quarkiverse, sous le groupId `io.quarkiverse`", correct: true}
      - {text: "Dans le dépôt principal de Quarkus, sous `io.quarkus`", correct: false}
      - {text: "Dans Maven Central, sous le groupId `org.community`", correct: false}
      - {text: "Nulle part : seul Red Hat peut publier des extensions", correct: false}
    answer: "Le Quarkiverse héberge les extensions de la communauté, chacune avec son dépôt et son rythme de versions. Elles apparaissent aussi sur code.quarkus.io et dans `quarkus ext list`."
  - key: vf-deployment-dans-le-pom
    format: true-false
    question: "Pour utiliser Quarkus REST, l'application déclare à la fois `quarkus-rest` et `quarkus-rest-deployment` dans son `pom.xml`."
    truth: false
    answer: "Seul `quarkus-rest` est déclaré. Le module deployment est trouvé et utilisé par le plugin Maven pendant le build ; il ne fait pas partie de l'application."
  - key: vf-bibliotheque-sans-extension
    format: true-false
    question: "Une bibliothèque Java qui n'a pas d'extension Quarkus peut quand même s'utiliser dans une application Quarkus sur la JVM."
    truth: true
    answer: "Sur la JVM, c'est un jar comme un autre. Il lui manque l'intégration : configuration unifiée, Dev Services, et surtout la préparation au natif si elle utilise la réflexion."
  - key: vf-ext-add
    format: true-false
    question: "`quarkus ext add rest-jackson` ajoute la dépendance de l'extension au fichier de build du projet."
    truth: true
    answer: "La CLI modifie le `pom.xml` (ou le build Gradle), sans version grâce au BOM. Avec Maven seul : `./mvnw quarkus:add-extension -Dextensions=\"rest-jackson\"`."
  - key: vf-extension-que-du-runtime
    format: true-false
    question: "Une extension Quarkus ne contient que du code exécuté au démarrage de l'application."
    truth: false
    answer: "Sa partie la plus importante, le module deployment, s'exécute pendant le build : elle analyse l'application et génère du code. Le module runtime contient ce qui tourne ensuite."
  - key: qcm-role-deployment
    format: multiple-choice
    question: "À quoi sert le module deployment d'une extension ?"
    choices:
      - {text: "À exécuter ses build steps pendant la construction de l'application", correct: true}
      - {text: "À déployer l'application sur Kubernetes après le build", correct: false}
      - {text: "À contenir les tests d'intégration de l'extension", correct: false}
      - {text: "À fournir l'interface de la Dev UI dans le navigateur", correct: false}
    answer: "« Deployment » désigne ici le moment du build où l'application est assemblée, pas la mise en production. Les build steps de ce module produisent le code que le runtime exécutera."
  - key: qcm-apport-d-une-extension
    format: multiple-choice
    question: "Qu'apporte une extension Quarkus, de plus que la bibliothèque qu'elle intègre ?"
    choices:
      - {text: "La préparation au build, la configuration unifiée et le support du natif", correct: true}
      - {text: "Une licence commerciale et un support garanti par Red Hat", correct: false}
      - {text: "Une version de la bibliothèque réécrite en Kotlin pour Quarkus", correct: false}
      - {text: "Un serveur dédié qui exécute la bibliothèque hors de l'application", correct: false}
    answer: "L'extension analyse l'application au build, expose ses réglages sous `quarkus.*`, déclare la réflexion pour le natif, et ajoute souvent un Dev Service et une page de Dev UI."
  - key: qcm-groupid-communaute
    format: multiple-choice
    question: "Quel groupId porte une extension du Quarkiverse ?"
    choices:
      - {text: "`io.quarkiverse...`", correct: true}
      - {text: "`io.quarkus.platform`", correct: false}
      - {text: "`org.eclipse.microprofile`", correct: false}
      - {text: "`io.smallrye`", correct: false}
    answer: "Par exemple `io.quarkiverse.amazonservices`. `io.quarkus.platform` porte le BOM, `org.eclipse.microprofile` les API MicroProfile, `io.smallrye` leurs implémentations."
  - key: qcm-lister-installables
    format: multiple-choice
    question: "Avec la CLI, comment lister les extensions que tu peux ajouter au projet ?"
    choices:
      - {text: "`quarkus ext list --installable`", correct: true}
      - {text: "`quarkus dev --extensions`", correct: false}
      - {text: "`./mvnw dependency:tree`", correct: false}
      - {text: "`quarkus build --list`", correct: false}
    answer: "Sans option, `quarkus ext list` montre les extensions déjà présentes ; `--installable` (ou `-i`) montre le catalogue. `dependency:tree` liste les dépendances, pas le catalogue."
  - key: trous-add-extension-maven
    format: fill-in
    question: |-
      Complète pour ajouter l'extension avec le plugin Maven :
      ```bash
      ./mvnw quarkus:___ -Dextensions="rest-jackson"
      ```
    blanks:
      - [add-extension]
    answer: "Le goal `add-extension` du plugin Quarkus ajoute la dépendance au `pom.xml`, sans version ; `-Dextensions` accepte une liste séparée par des virgules."
  - key: trous-ext-add-cli
    format: fill-in
    question: |-
      Complète pour ajouter Panache avec la CLI :
      ```bash
      quarkus ext ___ hibernate-orm-panache
      ```
    blanks:
      - [add]
    answer: "`quarkus ext add` (ou `quarkus extension add`) ajoute une ou plusieurs extensions ; `quarkus ext remove` les retire."
  - key: trous-artefact-rest-jackson
    format: fill-in
    question: |-
      Complète l'artefact de Quarkus REST avec la sérialisation JSON par Jackson :
      ```xml
      <dependency>
          <groupId>io.quarkus</groupId>
          <artifactId>quarkus-___</artifactId>
      </dependency>
      ```
    blanks:
      - [rest-jackson]
    answer: "`quarkus-rest-jackson` apporte Quarkus REST et Jackson. Pas de `<version>` : le BOM la fournit."
  - key: trous-bom
    format: fill-in
    question: |-
      Complète l'import qui aligne les versions de toutes les extensions :
      ```xml
      <dependency>
          <groupId>io.quarkus.platform</groupId>
          <artifactId>quarkus-___</artifactId>
          <version>${quarkus.platform.version}</version>
          <type>pom</type>
          <scope>import</scope>
      </dependency>
      ```
    blanks:
      - [bom]
    answer: "Le BOM (bill of materials) est importé dans `<dependencyManagement>` : les extensions se déclarent ensuite sans version."
  - key: situation-extension-ou-jar
    format: scenario
    question: |-
      Une bibliothèque existe sous deux formes : un jar Java ordinaire et une extension du Quarkiverse. L'application
      sera compilée en natif. Laquelle choisis-tu ?
    choices:
      - {text: "L'extension : elle prépare la bibliothèque au build et au natif", correct: true}
      - {text: "Le jar ordinaire : une extension ralentit toujours le démarrage", correct: false}
      - {text: "Les deux à la fois, pour que Quarkus choisisse la meilleure au build", correct: false}
      - {text: "Aucune : le natif interdit toute bibliothèque extérieure à Quarkus", correct: false}
    answer: |-
      L'extension déclare la réflexion et les ressources dont la bibliothèque a besoin, et offre sa configuration dans
      `application.properties`. Le jar seul marcherait sur la JVM, mais risque de casser en natif.
  - key: situation-deployment-dans-le-pom
    format: scenario
    question: |-
      En revue, tu vois qu'un collègue a ajouté `quarkus-hibernate-orm-deployment` aux dépendances du `pom.xml`, « pour
      que l'extension marche ». Que lui dis-tu ?
    choices:
      - {text: "De le retirer : le plugin Maven résout lui-même le module deployment", correct: true}
      - {text: "De le garder, et d'y ajouter le module deployment de chaque extension", correct: false}
      - {text: "De le passer en `<scope>test</scope>` pour l'exclure de la production", correct: false}
      - {text: "De remplacer `quarkus-hibernate-orm` par ce module, qui le contient", correct: false}
    answer: |-
      L'application ne déclare que le runtime. Le module deployment, réservé au build, embarque des dépendances
      lourdes (l'outillage de l'augmentation) qui n'ont rien à faire dans l'application.
  - key: situation-versions-a-la-main
    format: scenario
    question: |-
      Dans un `pom.xml`, chaque extension Quarkus a sa propre `<version>`, mise à jour à la main, et deux d'entre elles
      ne sont plus alignées. Que proposes-tu ?
    choices:
      - {text: "Importer le BOM de la plateforme et retirer les versions des extensions", correct: true}
      - {text: "Passer toutes les versions à `LATEST` pour suivre les publications", correct: false}
      - {text: "Copier les extensions dans le dépôt pour figer leur code source", correct: false}
      - {text: "Garder les versions, et ajouter une règle d'exclusion par extension", correct: false}
    answer: |-
      Le BOM aligne les extensions et leurs dépendances sur des versions testées ensemble. Une montée de version de
      Quarkus se résume alors à changer `quarkus.platform.version`.
  - key: situation-bibliotheque-reflexion
    format: scenario
    question: |-
      Une bibliothèque interne, sans extension, sérialise ses objets par réflexion. Sur la JVM tout marche, mais
      l'image native échoue sur ces classes. Que proposes-tu ?
    choices:
      - {text: "Déclarer ces classes pour la réflexion, ou écrire une extension qui le fait", correct: true}
      - {text: "Renoncer au natif : une bibliothèque sans extension n'y marchera jamais", correct: false}
      - {text: "Réécrire la bibliothèque en Kotlin, que l'image native accepte mieux", correct: false}
      - {text: "Lancer l'image native avec plus de mémoire, pour qu'elle charge ces classes", correct: false}
    answer: |-
      En natif, seules les classes déclarées gardent leur réflexion. `@RegisterForReflection` (ou un fichier de
      configuration de réflexion) suffit pour quelques classes ; une extension maison est le bon choix si la
      bibliothèque sert dans plusieurs applications.
  - key: def-extension
    format: definition
    question: "Quel terme désigne, dans Quarkus, un module qui intègre une bibliothèque au build time : configuration, analyse au build, préparation au natif ?"
    choices:
      - {text: "Une extension", correct: true}
      - {text: "Un starter", correct: false}
      - {text: "Un plugin Maven", correct: false}
      - {text: "Un profil", correct: false}
    answer: "Le starter de Spring Boot rassemble des dépendances ; l'extension Quarkus fait davantage : son module deployment travaille pendant le build."
  - key: def-quarkiverse
    format: definition
    question: "Quel nom porte l'organisation qui héberge les extensions Quarkus maintenues par la communauté ?"
    choices:
      - {text: "Le Quarkiverse", correct: true}
      - {text: "Le Quarkus Hub", correct: false}
      - {text: "La Quarkus Foundation", correct: false}
      - {text: "Le Quarkus Store", correct: false}
    answer: "Chaque extension du Quarkiverse a son dépôt, ses mainteneurs et ses versions ; le cœur de Quarkus reste dans le dépôt principal."
  - key: def-bom
    format: definition
    question: "Quel terme désigne un `pom` importé qui fixe d'un coup les versions d'un ensemble d'artefacts compatibles ?"
    choices:
      - {text: "Un BOM (bill of materials)", correct: true}
      - {text: "Un POM parent", correct: false}
      - {text: "Un profil Maven", correct: false}
      - {text: "Un archétype Maven", correct: false}
    answer: "Le BOM s'importe dans `<dependencyManagement>` avec `<scope>import</scope>`. Un POM parent hérite aussi de la configuration des plugins ; le BOM ne gère que les versions."
  - key: def-module-deployment
    format: definition
    question: "Quel terme désigne la partie d'une extension qui contient les build steps, exécutée seulement pendant le build ?"
    choices:
      - {text: "Le module deployment", correct: true}
      - {text: "Le module runtime", correct: false}
      - {text: "Le module SPI", correct: false}
      - {text: "Le module de test", correct: false}
    answer: "Le module deployment (`quarkus-xxx-deployment`) n'entre jamais dans l'application livrée. Le runtime (`quarkus-xxx`) est la seule dépendance déclarée."
