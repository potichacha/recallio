notion: standards
lesson: |-
  Quarkus ne réinvente pas ses API : l'essentiel du code d'une application utilise des **spécifications ouvertes**,
  celles de **Jakarta EE** et de **MicroProfile**. Un développeur qui les connaît retrouve ses repères ; le code
  reste portable d'un framework à l'autre.

  **Jakarta EE** est la suite de Java EE, confiée à la fondation Eclipse. Depuis Jakarta EE 9, ses packages
  s'appellent `jakarta.*` au lieu de `javax.*` : Quarkus 3 utilise `jakarta.*` partout.

  **MicroProfile** complète Jakarta EE pour les microservices : configuration, santé, tolérance aux pannes, client
  REST typé, JWT, OpenAPI, télémétrie. Ses spécifications sont implémentées dans Quarkus par le projet **SmallRye**.

  | Besoin | Spécification | Dans Quarkus |
  |---|---|---|
  | Injection | Jakarta CDI (CDI Lite) | ArC |
  | API REST | Jakarta REST (`@Path`, `@GET`) | Quarkus REST |
  | Persistance | Jakarta Persistence (`@Entity`) | Hibernate ORM |
  | Validation | Jakarta Validation (`@NotBlank`) | Hibernate Validator |
  | Transactions | Jakarta Transactions (`@Transactional`) | Narayana |
  | Configuration | MicroProfile Config (`@ConfigProperty`) | SmallRye Config |
  | Santé | MicroProfile Health (`/q/health`) | SmallRye Health |
  | Pannes | MicroProfile Fault Tolerance (`@Retry`, `@Timeout`) | SmallRye Fault Tolerance |
  | Client REST | MicroProfile Rest Client | Quarkus REST Client |
  | Documentation | MicroProfile OpenAPI | SmallRye OpenAPI |

  **Ce que Quarkus ne prend pas.** Ce n'est pas un serveur d'applications complet : pas d'EJB, pas de JSF, pas de
  déploiement de fichiers `.war` dans un serveur. Il choisit les spécifications utiles à un service moderne, et peut
  en restreindre certaines pour le build time : son conteneur CDI suit **CDI Lite**, sans les extensions portables
  (voir le domaine CDI).

  **Ce que Quarkus ajoute.** Ses propres API, quand un standard manque ou qu'il peut faire plus simple :
  **Panache** pour la persistance, **Mutiny** pour la programmation réactive, **Qute** pour les gabarits,
  `@ConfigMapping` (SmallRye Config) pour une configuration typée. Et des extensions de compatibilité pour les
  habitués de Spring (`quarkus-spring-di`, `quarkus-spring-web`, `quarkus-spring-data-jpa`), qui comprennent une partie
  de leurs annotations.

  ```java
  import jakarta.enterprise.context.ApplicationScoped;            // Jakarta CDI
  import jakarta.inject.Inject;                                   // Jakarta Dependency Injection
  import jakarta.ws.rs.GET;                                       // Jakarta REST
  import org.eclipse.microprofile.config.inject.ConfigProperty;   // MicroProfile Config
  ```

  **En entretien** : « Quarkus s'appuie sur Jakarta EE et MicroProfile : CDI pour l'injection, Jakarta REST pour les
  API, JPA avec Hibernate, MicroProfile Config, Health ou Fault Tolerance, implémentés par SmallRye. Il n'en prend que
  ce qui sert à un microservice, sans EJB ni serveur d'applications. Il y ajoute ses propres API, comme Panache et
  Mutiny, sans les imposer. »
cards:
  - key: packages-jakarta
    format: course
    question: "Dans quels packages Quarkus 3 trouve-t-on les API de Jakarta EE, comme `@Inject` ou `@Entity` ?"
    choices:
      - {text: "`jakarta.*`, depuis le passage de Java EE à Jakarta EE 9", correct: true}
      - {text: "`javax.*`, comme dans toutes les versions de Java EE", correct: false}
      - {text: "`io.quarkus.*`, car Quarkus redéfinit ces annotations", correct: false}
      - {text: "`org.eclipse.*`, le nom de la fondation qui les maintient", correct: false}
    answer: "Jakarta EE 9 a renommé les packages `javax.*` en `jakarta.*`. Quarkus 3 a fait la bascule : un vieil import `javax.inject.Inject` ne compile plus."
  - key: implementation-microprofile
    format: course
    question: "Quel projet implémente les spécifications MicroProfile dans Quarkus ?"
    choices:
      - {text: "SmallRye", correct: true}
      - {text: "Apache TomEE", correct: false}
      - {text: "Eclipse GlassFish", correct: false}
      - {text: "Spring Cloud", correct: false}
    answer: "SmallRye Config, SmallRye Health, SmallRye Fault Tolerance, SmallRye OpenAPI... Ces implémentations servent aussi à d'autres runtimes, comme WildFly."
  - key: pas-un-serveur-complet
    format: course
    question: "Que reprend Quarkus de la plateforme Jakarta EE ?"
    choices:
      - {text: "Une sélection de spécifications utiles à un service, sans EJB ni JSF", correct: true}
      - {text: "La plateforme entière, EJB et JSF compris, comme un serveur d'applications", correct: false}
      - {text: "Rien : Quarkus n'utilise que ses propres API, incompatibles avec Jakarta EE", correct: false}
      - {text: "Seulement les servlets, sur lesquelles il construit tout le reste", correct: false}
    answer: "CDI, Jakarta REST, Persistence, Validation, Transactions : ce dont un microservice a besoin. Pas d'EJB, pas de JSF, et pas de `.war` à déployer dans un serveur."
  - key: specification-de-configproperty
    format: course
    question: "De quelle spécification vient l'annotation `@ConfigProperty` ?"
    choices:
      - {text: "MicroProfile Config", correct: true}
      - {text: "Jakarta CDI", correct: false}
      - {text: "Jakarta REST", correct: false}
      - {text: "MicroProfile Health", correct: false}
    answer: "`org.eclipse.microprofile.config.inject.ConfigProperty` injecte une valeur de configuration. Quarkus l'implémente avec SmallRye Config, qui ajoute `@ConfigMapping`."
  - key: vf-javax
    format: true-false
    question: "Quarkus 3 utilise les packages `javax.*` hérités de Java EE."
    truth: false
    answer: "Quarkus 3 a adopté `jakarta.*` (Jakarta EE 10). Migrer depuis Quarkus 2 demande de renommer ces imports, ce que l'outil `quarkus update` automatise en grande partie."
  - key: vf-smallrye-health
    format: true-false
    question: "Dans Quarkus, la spécification MicroProfile Health est implémentée par SmallRye Health."
    truth: true
    answer: "L'extension `quarkus-smallrye-health` expose `/q/health`, `/q/health/live` et `/q/health/ready`, et l'on ajoute ses propres vérifications avec `@Liveness` et `@Readiness`."
  - key: vf-ejb
    format: true-false
    question: "Quarkus permet de déployer des EJB, comme un serveur d'applications Jakarta EE."
    truth: false
    answer: "Les EJB ne font pas partie de ce que Quarkus reprend. Leurs usages courants ont un équivalent : un bean CDI `@ApplicationScoped`, `@Transactional`, ou une tâche planifiée."
  - key: vf-hibernate-validator
    format: true-false
    question: "Quarkus valide les contraintes `@NotBlank` ou `@Min` avec Hibernate Validator, l'implémentation de Jakarta Validation."
    truth: true
    answer: "L'extension `quarkus-hibernate-validator` valide les paramètres REST annotés `@Valid` et les entités ; une violation sur une requête répond 400."
  - key: qcm-path-et-get
    format: multiple-choice
    question: "Quelle spécification définit les annotations `@Path`, `@GET` et `@Produces` des ressources REST ?"
    choices:
      - {text: "Jakarta REST (anciennement JAX-RS)", correct: true}
      - {text: "MicroProfile Rest Client", correct: false}
      - {text: "Jakarta Servlet", correct: false}
      - {text: "MicroProfile OpenAPI", correct: false}
    answer: "Jakarta REST décrit les ressources côté serveur ; Quarkus REST l'implémente. MicroProfile Rest Client, lui, décrit un client typé pour appeler une autre API."
  - key: qcm-tolerance-aux-pannes
    format: multiple-choice
    question: "De quelle spécification viennent `@Retry`, `@Timeout` et `@CircuitBreaker` ?"
    choices:
      - {text: "MicroProfile Fault Tolerance", correct: true}
      - {text: "Jakarta Concurrency", correct: false}
      - {text: "MicroProfile Health", correct: false}
      - {text: "Jakarta Transactions", correct: false}
    answer: "MicroProfile Fault Tolerance définit nouvelles tentatives, délais, disjoncteur, repli (`@Fallback`) et cloisonnement (`@Bulkhead`). Quarkus l'implémente avec SmallRye Fault Tolerance."
  - key: qcm-api-propre-a-quarkus
    format: multiple-choice
    question: "Laquelle de ces API est propre à Quarkus, hors de tout standard ?"
    choices:
      - {text: "Panache, pour simplifier la persistance", correct: true}
      - {text: "Jakarta Persistence, pour les entités", correct: false}
      - {text: "Jakarta CDI, pour l'injection", correct: false}
      - {text: "MicroProfile Config, pour la configuration", correct: false}
    answer: "Panache s'appuie sur Hibernate ORM (donc sur Jakarta Persistence) et ajoute `PanacheEntity` et `PanacheRepository`. Mutiny et Qute sont aussi propres à l'écosystème Quarkus."
  - key: qcm-compatibilite-spring
    format: multiple-choice
    question: "Quelle extension permet à Quarkus de comprendre des annotations Spring comme `@Autowired` et `@Component` ?"
    choices:
      - {text: "`quarkus-spring-di`", correct: true}
      - {text: "`quarkus-spring-boot`", correct: false}
      - {text: "`quarkus-arc-spring`", correct: false}
      - {text: "`quarkus-spring-context`", correct: false}
    answer: "`quarkus-spring-di` traduit ces annotations en CDI au build. `quarkus-spring-web` et `quarkus-spring-data-jpa` font de même pour les contrôleurs et les repositories. Ce n'est pas Spring : seule une partie de ses API est couverte."
  - key: def-microprofile
    format: definition
    question: "Quel terme désigne l'ensemble de spécifications ouvertes qui complète Jakarta EE pour les microservices : configuration, santé, tolérance aux pannes, client REST ?"
    choices:
      - {text: "MicroProfile", correct: true}
      - {text: "Jakarta Core Profile", correct: false}
      - {text: "Spring Cloud", correct: false}
      - {text: "OpenTelemetry", correct: false}
    answer: "MicroProfile est porté par la fondation Eclipse, comme Jakarta EE. Spring Cloud couvre des besoins voisins, mais c'est un projet, pas une spécification."
  - key: def-smallrye
    format: definition
    question: "Quel nom porte le projet qui fournit les implémentations de MicroProfile utilisées par Quarkus ?"
    choices:
      - {text: "SmallRye", correct: true}
      - {text: "Mandrel", correct: false}
      - {text: "Narayana", correct: false}
      - {text: "ArC", correct: false}
    answer: "SmallRye Config, Health, Fault Tolerance, OpenAPI, JWT, Reactive Messaging... Mandrel compile en natif, Narayana gère les transactions, ArC est le conteneur CDI."
  - key: def-jakarta-ee
    format: definition
    question: "Quel nom porte la plateforme de spécifications Java d'entreprise qui a succédé à Java EE, sous l'égide de la fondation Eclipse ?"
    choices:
      - {text: "Jakarta EE", correct: true}
      - {text: "Java SE", correct: false}
      - {text: "J2EE", correct: false}
      - {text: "OpenJDK", correct: false}
    answer: "Oracle a confié Java EE à la fondation Eclipse, qui l'a renommé Jakarta EE. J2EE est l'ancien nom de Java EE ; Java SE est la plateforme standard ; OpenJDK son implémentation de référence."
  - key: def-narayana
    format: definition
    question: "Quel nom porte le gestionnaire de transactions qui implémente Jakarta Transactions dans Quarkus ?"
    choices:
      - {text: "Narayana", correct: true}
      - {text: "Agroal", correct: false}
      - {text: "Vert.x", correct: false}
      - {text: "Jandex", correct: false}
    answer: "Narayana gère `@Transactional` et `QuarkusTransaction`. Agroal est le pool de connexions JDBC, Vert.x la couche réseau, Jandex l'index des classes."
