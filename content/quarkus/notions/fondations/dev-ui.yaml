notion: dev-ui
lesson: |-
  En mode dev, Quarkus sert une console web : la **Dev UI**, à l'adresse `http://localhost:8080/q/dev-ui` (touche
  `d` dans le terminal). Elle montre l'application **telle que le build l'a assemblée**, ce qui en fait le premier
  outil d'enquête quand quelque chose ne marche pas.

  **Ce qu'on y trouve.**

  | Page | Ce qu'elle montre |
  |---|---|
  | Extensions | une carte par extension installée, avec ses liens et ses pages |
  | Configuration | toutes les propriétés, leur valeur effective et leur source ; on peut les modifier |
  | ArC (CDI) | les beans, leurs portées, les observateurs, les intercepteurs, et les **beans retirés** au build |
  | Endpoints | les routes REST et leurs méthodes |
  | Dev Services | les conteneurs démarrés et la configuration qu'ils ont reçue |
  | Tests | le test continu : lancer, relancer, voir les résultats |

  Chaque extension peut y ajouter ses propres pages : la console d'OpenAPI, les tables de Hibernate ORM, les
  utilisateurs du Keycloak des Dev Services...

  **L'éditeur de configuration** écrit dans `application.properties` : la modification est prise en compte au
  rechargement suivant, comme une modification faite dans l'IDE.

  **Le préfixe `/q/`.** Quarkus range sous `/q/` ses adresses techniques, pour qu'elles ne se mêlent pas aux routes de
  l'application : `/q/dev-ui` en mode dev, et selon les extensions `/q/health`, `/q/metrics`, `/q/openapi`.

  **Seulement en mode dev.** La Dev UI n'existe pas dans l'application construite : rien à désactiver avant la
  production, et rien qu'un attaquant puisse y trouver. Par défaut, elle ne répond qu'aux appels venus de la machine
  locale.

  **En entretien** : « La Dev UI, sous `/q/dev-ui`, montre en mode dev l'application telle que le build l'a assemblée :
  la configuration effective et sa source, les beans CDI et ceux qui ont été retirés, les routes, les Dev Services. Je
  m'en sers d'abord pour comprendre un bean manquant ou une propriété ignorée. Elle n'existe pas en production. »
cards:
  - key: adresse-dev-ui
    format: course
    question: "À quelle adresse s'ouvre la Dev UI d'une application lancée avec `quarkus dev` ?"
    choices:
      - {text: "`http://localhost:8080/q/dev-ui`", correct: true}
      - {text: "`http://localhost:8080/admin`", correct: false}
      - {text: "`http://localhost:9000/console`", correct: false}
      - {text: "`http://localhost:8080/actuator`", correct: false}
    answer: "Sous le préfixe technique `/q/`, sur le port de l'application. `/actuator` est l'équivalent de Spring Boot pour la supervision, pas une console de développement."
  - key: page-arc
    format: course
    question: "Que montre la page ArC (CDI) de la Dev UI ?"
    choices:
      - {text: "Les beans, les observateurs, les intercepteurs et les beans retirés au build", correct: true}
      - {text: "Les requêtes SQL envoyées par Hibernate depuis le démarrage", correct: false}
      - {text: "Les dépendances Maven du projet et leurs versions", correct: false}
      - {text: "Les threads de la JVM et leur consommation de processeur", correct: false}
    answer: "Elle montre le graphe des beans tel que le build l'a validé. La liste des beans retirés explique souvent un bean introuvable à l'exécution."
  - key: dev-ui-en-production
    format: course
    question: "La Dev UI est-elle disponible dans l'application en production ?"
    choices:
      - {text: "Non : elle n'existe qu'en mode dev", correct: true}
      - {text: "Oui, protégée par un mot de passe généré", correct: false}
      - {text: "Oui, mais seulement en lecture seule", correct: false}
      - {text: "Oui, si l'on ajoute l'extension `quarkus-dev-ui`", correct: false}
    answer: "Elle fait partie de l'outillage du mode dev, absent de l'application construite. Il n'y a donc rien à désactiver avant de livrer."
  - key: editeur-de-configuration
    format: course
    question: "Que se passe-t-il quand tu modifies une propriété dans l'éditeur de configuration de la Dev UI ?"
    choices:
      - {text: "Elle est écrite dans `application.properties`, puis prise en compte au rechargement", correct: true}
      - {text: "Elle ne vaut que pour la session du navigateur, sans toucher aux fichiers", correct: false}
      - {text: "Elle est envoyée à toutes les instances de production de l'application", correct: false}
      - {text: "Elle est enregistrée dans la base de données de l'application", correct: false}
    answer: "L'éditeur modifie le vrai fichier : la modification apparaît dans le dépôt, comme si tu l'avais faite dans l'IDE."
  - key: vf-dev-ui-en-production
    format: true-false
    question: "La Dev UI reste accessible dans une application lancée en production avec `java -jar`."
    truth: false
    answer: "Elle n'existe qu'en mode dev. En production, on expose plutôt la santé (`/q/health`) et les métriques, avec les extensions dédiées."
  - key: vf-beans-retires
    format: true-false
    question: "La Dev UI liste les beans que le build a retirés parce que personne ne les utilisait."
    truth: true
    answer: "C'est l'endroit où chercher quand un bean obtenu par recherche programmatique (`CDI.current()`) manque à l'exécution : il a pu être retiré, et `@Unremovable` le garde."
  - key: vf-cartes-des-extensions
    format: true-false
    question: "Chaque extension peut ajouter ses propres pages à la Dev UI."
    truth: true
    answer: "OpenAPI, Hibernate ORM, Keycloak, Kafka ajoutent leurs pages : la console Swagger, les entités, les utilisateurs de test, les sujets et les messages."
  - key: vf-tests-depuis-la-dev-ui
    format: true-false
    question: "La Dev UI permet de lancer les tests continus et d'en voir les résultats."
    truth: true
    answer: "La page des tests reprend le test continu du terminal : lancer, relancer les échecs, lire les traces."
  - key: qcm-prefixe-q
    format: multiple-choice
    question: "À quoi sert le préfixe `/q/` dans les adresses d'une application Quarkus ?"
    choices:
      - {text: "À regrouper les adresses techniques, à part des routes de l'application", correct: true}
      - {text: "À marquer les routes qui demandent une authentification", correct: false}
      - {text: "À désigner les routes réactives, servies par la boucle d'événements", correct: false}
      - {text: "À signaler les requêtes mises en file d'attente par Vert.x", correct: false}
    answer: "`/q/health`, `/q/metrics`, `/q/openapi`, `/q/dev-ui` : toutes les adresses de Quarkus lui-même sont sous `/q/`, pour ne jamais entrer en conflit avec une route métier."
  - key: qcm-source-d-une-propriete
    format: multiple-choice
    question: "Une propriété ne prend pas la valeur attendue. Où vois-tu sa valeur effective et d'où elle vient ?"
    choices:
      - {text: "Dans la page Configuration de la Dev UI", correct: true}
      - {text: "Dans la page Endpoints de la Dev UI", correct: false}
      - {text: "Dans le fichier `pom.xml` du projet", correct: false}
      - {text: "Dans la sortie de `./mvnw dependency:tree`", correct: false}
    answer: "La page Configuration montre la valeur retenue et sa source : `application.properties`, une variable d'environnement, une propriété système, un Dev Service."
  - key: qcm-bean-introuvable
    format: multiple-choice
    question: "En mode dev, `CDI.current().select(Rapport.class).get()` échoue : aucun bean trouvé. Où regardes-tu d'abord ?"
    choices:
      - {text: "La liste des beans retirés, dans la page ArC de la Dev UI", correct: true}
      - {text: "La page Dev Services, pour voir si la base a démarré", correct: false}
      - {text: "La page Endpoints, pour voir si la route existe", correct: false}
      - {text: "Les journaux de Docker, pour voir si le conteneur tourne", correct: false}
    answer: "Un bean que personne n'injecte est retiré au build ; une recherche programmatique ne le retrouve plus. La Dev UI le montre parmi les beans retirés ; `@Unremovable` le garde."
  - key: qcm-ouvrir-depuis-le-terminal
    format: multiple-choice
    question: "Dans le terminal du mode dev, quelle touche ouvre la Dev UI dans le navigateur ?"
    choices:
      - {text: "`d`", correct: true}
      - {text: "`u`", correct: false}
      - {text: "`o`", correct: false}
      - {text: "`s`", correct: false}
    answer: "`d` ouvre la Dev UI, `w` l'application elle-même, `s` force un redémarrage."
