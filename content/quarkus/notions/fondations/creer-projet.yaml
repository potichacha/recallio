notion: creer-projet
lesson: |-
  Trois chemins mènent au même projet Quarkus : le site **code.quarkus.io**, la **CLI** `quarkus`, ou le **plugin
  Maven**. Dans les trois cas, on choisit un groupId, un artifactId, l'outil de build et les extensions.

  **1. code.quarkus.io.** Un formulaire web : on coche les extensions, on télécharge un zip (ou on pousse sur
  GitHub). Pratique pour découvrir le catalogue.

  **2. La CLI `quarkus`** (installée avec JBang, SDKMAN ou un gestionnaire de paquets) :

  ```bash
  quarkus create app fr.boutique:catalogue --extension='rest-jackson,hibernate-orm-panache,jdbc-postgresql'
  quarkus create app fr.boutique:catalogue --gradle      # un projet Gradle plutôt que Maven
  cd catalogue
  quarkus dev                                            # le mode dev
  quarkus build                                          # le build complet, tests compris
  ```

  **3. Le plugin Maven**, sans rien installer d'autre que Maven :

  ```bash
  mvn io.quarkus.platform:quarkus-maven-plugin:create \
      -DprojectGroupId=fr.boutique -DprojectArtifactId=catalogue -Dextensions='rest-jackson'
  ```

  **Ce que contient le projet.**

  | Élément | Rôle |
  |---|---|
  | `mvnw`, `.mvn/` | le wrapper Maven : la bonne version de Maven, sans installation |
  | `pom.xml` | le BOM de la plateforme importé, les extensions sans version, le `quarkus-maven-plugin` |
  | `src/main/java/.../GreetingResource.java` | une ressource d'exemple, `GET /hello` |
  | `src/main/resources/application.properties` | la configuration |
  | `src/main/resources/META-INF/resources/` | les fichiers statiques servis tels quels (`index.html`) |
  | `src/main/docker/` | des `Dockerfile` pour la JVM et pour le natif |
  | `src/test/java/...` | un `@QuarkusTest` et un `@QuarkusIntegrationTest` (suffixe `IT`) |

  Le `quarkus-maven-plugin` est indispensable : c'est lui qui lance l'augmentation au `package` et le mode dev.

  **Construire et lancer.**

  ```bash
  ./mvnw package                                   # produit target/quarkus-app/
  java -jar target/quarkus-app/quarkus-run.jar     # lance l'application
  ```

  Le format par défaut, le **fast-jar**, est un **dossier** : `quarkus-run.jar` et, à côté, les sous-dossiers `lib/`,
  `app/` et `quarkus/`. On déploie le dossier entier (c'est ce que copient les `Dockerfile` générés). Pour un jar
  unique, autonome, on demande un **uber-jar** :

  ```properties
  quarkus.package.jar.type=uber-jar
  ```

  **En entretien** : « Je crée un projet avec code.quarkus.io, la CLI (`quarkus create app` avec ses extensions) ou le
  plugin Maven. Le projet arrive avec le wrapper Maven, le BOM, une ressource et des tests d'exemple, et des
  `Dockerfile`. `./mvnw package` produit le dossier `target/quarkus-app`, qu'on déploie en entier ; un uber-jar
  s'obtient par configuration. »
cards:
  - key: role-code-quarkus-io
    format: course
    question: "À quoi sert le site code.quarkus.io ?"
    choices:
      - {text: "À générer un projet en choisissant ses extensions, puis à le télécharger", correct: true}
      - {text: "À héberger et exécuter gratuitement les applications Quarkus", correct: false}
      - {text: "À compiler en ligne une application en image native", correct: false}
      - {text: "À publier ses propres extensions dans le catalogue officiel", correct: false}
    answer: "Le site produit le squelette : `pom.xml` (ou build Gradle), wrapper, code d'exemple, tests, `Dockerfile`. La CLI `quarkus create app` fait la même chose en ligne de commande."
  - key: emplacement-configuration
    format: course
    question: "Où se trouve la configuration d'un projet Quarkus généré ?"
    choices:
      - {text: "Dans `src/main/resources/application.properties`", correct: true}
      - {text: "Dans `src/main/java/application.yaml`", correct: false}
      - {text: "Dans `config/quarkus.xml`, à la racine du projet", correct: false}
      - {text: "Dans le `pom.xml`, sous la balise `<configuration>`", correct: false}
    answer: "Toutes les extensions lisent `application.properties`. Le format YAML est possible avec l'extension `quarkus-config-yaml`, dans `application.yaml`."
  - key: fichiers-statiques
    format: course
    question: "Où places-tu une page `index.html` que l'application doit servir telle quelle ?"
    choices:
      - {text: "Dans `src/main/resources/META-INF/resources/`", correct: true}
      - {text: "Dans `src/main/resources/static/`", correct: false}
      - {text: "Dans `src/main/webapp/`", correct: false}
      - {text: "Dans `src/main/resources/templates/`", correct: false}
    answer: "Quarkus sert le contenu de `META-INF/resources/` à la racine du site. `static/` est la convention de Spring Boot, `webapp/` celle des `.war` ; `templates/` sert aux gabarits Qute."
  - key: tests-generes
    format: course
    question: "Quels tests trouve-t-on dans un projet Quarkus généré ?"
    choices:
      - {text: "Un `@QuarkusTest` et un `@QuarkusIntegrationTest` au suffixe `IT`", correct: true}
      - {text: "Un `@SpringBootTest` et un `@WebMvcTest` pour le contrôleur", correct: false}
      - {text: "Aucun : les tests s'ajoutent avec une extension dédiée", correct: false}
      - {text: "Un test JUnit 3 qui hérite de `TestCase`", correct: false}
    answer: "Le `@QuarkusTest` démarre l'application dans la JVM des tests ; le test `IT` hérite souvent du premier et rejoue les mêmes vérifications contre l'artefact construit, jar ou natif."
  - key: vf-wrapper-maven
    format: true-false
    question: "Un projet Quarkus généré contient le wrapper Maven `mvnw`."
    truth: true
    answer: "Le wrapper télécharge la version de Maven attendue : `./mvnw quarkus:dev` marche sur un poste sans Maven installé, et toute l'équipe utilise la même version."
  - key: vf-plugin-facultatif
    format: true-false
    question: "Le `quarkus-maven-plugin` est facultatif : un projet Quarkus se construit avec les seuls plugins standard de Maven."
    truth: false
    answer: "Sans lui, pas d'augmentation, donc pas d'application Quarkus : c'est ce plugin qui exécute les build steps au `package`, et qui fournit le goal `quarkus:dev`."
  - key: vf-projet-gradle
    format: true-false
    question: "`quarkus create app` peut générer un projet construit avec Gradle."
    truth: true
    answer: "L'option `--gradle` (ou `--gradle-kotlin-dsl`) choisit Gradle. Le mode dev se lance alors avec `./gradlew quarkusDev`, ou toujours `quarkus dev`."
  - key: vf-quarkus-run-seul
    format: true-false
    question: "Le fichier `quarkus-run.jar` contient toutes les dépendances : on peut le copier seul sur un serveur."
    truth: false
    answer: "Le fast-jar est un dossier : `quarkus-run.jar` charge les jars de `lib/`, `app/` et `quarkus/` à côté de lui. On copie tout `target/quarkus-app/`, ou l'on construit un uber-jar."
  - key: qcm-que-deployer
    format: multiple-choice
    question: "Après `./mvnw package`, que copies-tu sur le serveur pour lancer l'application sur la JVM ?"
    choices:
      - {text: "Tout le dossier `target/quarkus-app/`", correct: true}
      - {text: "Le seul fichier `target/quarkus-app/quarkus-run.jar`", correct: false}
      - {text: "Le dossier `target/classes/` et le `pom.xml`", correct: false}
      - {text: "Le dossier `src/` et le wrapper `mvnw`", correct: false}
    answer: "Le dossier contient le lanceur et ses dépendances, rangées pour un démarrage rapide. Les `Dockerfile.jvm` générés copient justement ses sous-dossiers."
  - key: qcm-uber-jar
    format: multiple-choice
    question: "Comment obtenir un jar unique et autonome, plutôt que le dossier du fast-jar ?"
    choices:
      - {text: "Avec `quarkus.package.jar.type=uber-jar`", correct: true}
      - {text: "Avec `quarkus.native.enabled=true`", correct: false}
      - {text: "En ajoutant le `maven-shade-plugin`", correct: false}
      - {text: "En lançant `quarkus dev --package`", correct: false}
    answer: "L'uber-jar réunit l'application et ses dépendances dans `target/*-runner.jar`. Le fast-jar reste le défaut : il démarre plus vite et se découpe mieux en couches d'image."
  - key: qcm-ressource-d-exemple
    format: multiple-choice
    question: "Avec l'extension `rest`, quelle ressource d'exemple le projet généré contient-il ?"
    choices:
      - {text: "`GreetingResource`, qui répond à `GET /hello`", correct: true}
      - {text: "`HelloController`, qui répond à `GET /`", correct: false}
      - {text: "`IndexServlet`, qui répond à `GET /index`", correct: false}
      - {text: "`HealthResource`, qui répond à `GET /health`", correct: false}
    answer: "Une méthode `@GET` renvoie un texte de bienvenue ; le `@QuarkusTest` généré vérifie justement `GET /hello`. Un bon point de départ à remplacer."
  - key: qcm-build-cli
    format: multiple-choice
    question: "Avec la CLI, quelle commande construit le projet, tests compris ?"
    choices:
      - {text: "`quarkus build`", correct: true}
      - {text: "`quarkus dev`", correct: false}
      - {text: "`quarkus create`", correct: false}
      - {text: "`quarkus run`", correct: false}
    answer: "`quarkus build` appelle Maven ou Gradle selon le projet (`--native` pour l'exécutable natif). `quarkus dev` lance le mode dev, `quarkus create` crée un projet."
  - key: trous-create-app
    format: fill-in
    question: |-
      Complète pour créer un projet avec la CLI :
      ```bash
      quarkus ___ app fr.boutique:catalogue
      ```
    blanks:
      - [create]
    answer: "`quarkus create app` crée une application ; `quarkus create cli` crée une application en ligne de commande, `quarkus create extension` une extension."
  - key: trous-option-extensions
    format: fill-in
    question: |-
      Complète pour créer le projet avec ses extensions :
      ```bash
      quarkus create app fr.boutique:catalogue --___='rest-jackson,hibernate-orm-panache'
      ```
    blanks:
      - [extension, extensions]
    answer: "`--extension` (ou `-x`) prend une liste séparée par des virgules ; le projet arrive avec ces dépendances dans son build."
  - key: trous-lanceur-fast-jar
    format: fill-in
    question: |-
      Complète pour lancer l'application construite par `./mvnw package` :
      ```bash
      java -jar target/quarkus-app/___
      ```
    blanks:
      - [quarkus-run.jar]
    answer: "`quarkus-run.jar` est le lanceur du fast-jar ; il charge les jars voisins de `lib/`, `app/` et `quarkus/`."
  - key: trous-dossier-statique
    format: fill-in
    question: |-
      Complète le chemin des fichiers statiques servis par l'application :
      ```bash
      src/main/resources/___/resources/index.html
      ```
    blanks:
      - [META-INF]
    answer: "Ce qui est sous `META-INF/resources/` est servi à la racine : `index.html` répond à `GET /`."
