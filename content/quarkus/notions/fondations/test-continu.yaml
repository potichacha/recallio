notion: test-continu
lesson: |-
  Le **test continu** relance les tests **à chaque modification du code**, pendant que le mode dev tourne. On écrit
  un test, on enregistre, le résultat s'affiche en bas du terminal : le retour d'un TDD, sans quitter l'éditeur.

  **Le lancer.** Au démarrage du mode dev, le test continu est **en pause**. La touche `r` le démarre (et relance tous
  les tests). On peut aussi le lancer seul, sans le mode dev de l'application, avec `quarkus test` (ou
  `./mvnw quarkus:test`), ou l'activer d'office :

  ```properties
  quarkus.test.continuous-testing=enabled
  ```

  Les valeurs : `paused` (le défaut), `enabled`, `disabled`.

  **Seulement les tests concernés.** Quarkus mesure, pendant l'exécution, quelles classes chaque test exerce. Après une
  modification, il ne relance que **les tests qui touchent le code modifié**. Une suite de cinq cents tests ne rejoue
  que les trois qui comptent.

  **Les touches du terminal.**

  | Touche | Effet |
  |---|---|
  | `r` | relancer tous les tests |
  | `f` | relancer les tests en échec |
  | `b` | mode « broken only » : ne relancer que les tests en échec, à chaque modification |
  | `v` | afficher les échecs de la dernière exécution |
  | `o` | afficher ou masquer la sortie des tests |
  | `p` | mettre en pause |

  **Où tournent les tests.** Dans la JVM du mode dev, avec leur propre instance de l'application, sur le port de test
  (**8081** par défaut) : l'application du mode dev garde son port 8080 et son état. Les tests utilisent le profil
  `test`, et leurs propres Dev Services.

  **Les limites.** Un test lent ralentit la boucle : le mode « broken only » ou la pause aident. Le test continu ne
  remplace pas le build complet (`./mvnw verify`) avant de livrer : il ne lance pas les tests d'intégration sur
  l'artefact construit.

  **En entretien** : « Le test continu du mode dev relance, à chaque modification, les seuls tests qui exercent le code
  modifié, dans la JVM du mode dev, sur le port 8081. Il démarre en pause : `r` le lance, `f` relance les échecs, `b`
  ne garde que les tests cassés. C'est un retour de TDD immédiat, pas un remplaçant du build complet. »
cards:
  - key: demarrer-le-test-continu
    format: course
    question: "En mode dev, comment démarres-tu le test continu ?"
    choices:
      - {text: "Avec la touche `r` dans le terminal du mode dev", correct: true}
      - {text: "Avec la commande `./mvnw test -Dcontinuous` dans un second terminal", correct: false}
      - {text: "En annotant chaque classe de test avec `@ContinuousTest`", correct: false}
      - {text: "Il est toujours actif : il n'y a rien à démarrer", correct: false}
    answer: "Par défaut, il est en pause au lancement du mode dev. `r` le démarre ; `quarkus.test.continuous-testing=enabled` le démarre d'office."
  - key: tests-relances
    format: course
    question: "Après une modification, quels tests le test continu relance-t-il ?"
    choices:
      - {text: "Ceux qui exercent les classes modifiées", correct: true}
      - {text: "Toute la suite, dans l'ordre alphabétique", correct: false}
      - {text: "Les tests du package du fichier modifié seulement", correct: false}
      - {text: "Les tests modifiés, jamais ceux du code de production", correct: false}
    answer: "Quarkus note quelles classes chaque test traverse. Il ne rejoue que les tests concernés par la modification : la boucle reste courte, même sur une grosse suite."
  - key: port-des-tests
    format: course
    question: "Sur quel port l'application de test écoute-t-elle, par défaut, pendant le test continu ?"
    choices:
      - {text: "8081, pour ne pas gêner l'application du mode dev sur 8080", correct: true}
      - {text: "8080, en arrêtant l'application du mode dev pendant les tests", correct: false}
      - {text: "5005, le port partagé avec le débogueur du mode dev", correct: false}
      - {text: "Aucun : les tests appellent les méthodes sans passer par HTTP", correct: false}
    answer: "`quarkus.http.test-port` vaut 8081 par défaut : les tests et le mode dev tournent côte à côte, chacun avec son port et sa configuration."
  - key: commande-quarkus-test
    format: course
    question: "Quelle commande de la CLI lance le test continu sans le mode dev de l'application ?"
    choices:
      - {text: "`quarkus test`", correct: true}
      - {text: "`quarkus dev --tests`", correct: false}
      - {text: "`quarkus build --watch`", correct: false}
      - {text: "`quarkus verify`", correct: false}
    answer: "`quarkus test` (ou `./mvnw quarkus:test`) ouvre le même terminal interactif, consacré aux tests."
  - key: vf-toute-la-suite
    format: true-false
    question: "Le test continu relance toute la suite de tests à chaque modification du code."
    truth: false
    answer: "Il relance seulement les tests qui exercent le code modifié. La touche `r` relance tout, quand on le veut."
  - key: vf-en-pause-par-defaut
    format: true-false
    question: "Au lancement du mode dev, le test continu est en pause par défaut."
    truth: true
    answer: "`quarkus.test.continuous-testing` vaut `paused` : rien ne tourne avant la touche `r`. `enabled` le démarre d'office, `disabled` le retire."
  - key: vf-touche-f
    format: true-false
    question: "Dans le test continu, la touche `f` relance seulement les tests en échec."
    truth: true
    answer: "`f` pour « failed ». `b` va plus loin : à chaque modification, seuls les tests cassés sont rejoués, jusqu'à ce qu'ils passent."
  - key: vf-processus-maven-separe
    format: true-false
    question: "Le test continu lance un nouveau processus Maven à chaque exécution des tests."
    truth: false
    answer: "Les tests tournent dans la JVM du mode dev, déjà chaude, avec leur propre instance de l'application. C'est ce qui rend la boucle rapide."
  - key: qcm-activer-d-office
    format: multiple-choice
    question: "Quelle propriété démarre le test continu dès le lancement du mode dev ?"
    choices:
      - {text: "`quarkus.test.continuous-testing=enabled`", correct: true}
      - {text: "`quarkus.dev.tests=always`", correct: false}
      - {text: "`quarkus.test.auto-start=true`", correct: false}
      - {text: "`quarkus.live-reload.tests=on`", correct: false}
    answer: "Les valeurs possibles sont `paused` (le défaut), `enabled` et `disabled`."
  - key: qcm-touche-b
    format: multiple-choice
    question: "Que fait la touche `b` dans le test continu ?"
    choices:
      - {text: "Elle bascule en mode où seuls les tests en échec sont rejoués", correct: true}
      - {text: "Elle relance le build complet avec les tests d'intégration", correct: false}
      - {text: "Elle ouvre le rapport des tests dans le navigateur", correct: false}
      - {text: "Elle met les tests en pause jusqu'au prochain redémarrage", correct: false}
    answer: "Le mode « broken only » concentre la boucle sur ce qui est cassé : utile quand la suite est longue et qu'on corrige un échec précis."
  - key: qcm-comment-il-choisit
    format: multiple-choice
    question: "Comment Quarkus sait-il quels tests relancer après une modification ?"
    choices:
      - {text: "Il a mesuré, à l'exécution, les classes que chaque test traverse", correct: true}
      - {text: "Il compare le nom des tests au nom des fichiers modifiés", correct: false}
      - {text: "Il lit les annotations `@Tag` posées sur chaque test", correct: false}
      - {text: "Il relance les tests dans l'ordre de leur dernier échec", correct: false}
    answer: "Le lien entre un test et le code vient de l'exécution réelle, pas d'une convention de nommage : un test de `CommandeResource` qui passe par `Remise` est relancé quand `Remise` change."
  - key: qcm-tests-et-mode-dev
    format: multiple-choice
    question: "Pourquoi le test continu ne perturbe-t-il pas l'application que tu testes à la main en mode dev ?"
    choices:
      - {text: "Les tests ont leur propre instance de l'application, sur le port 8081", correct: true}
      - {text: "Les tests ne tournent que lorsque l'application du mode dev est arrêtée", correct: false}
      - {text: "Les tests utilisent une copie de la JVM, lancée dans un conteneur", correct: false}
      - {text: "Les tests désactivent les requêtes HTTP vers l'application du mode dev", correct: false}
    answer: "Deux instances côte à côte : l'une sur 8080 en profil `dev`, l'autre sur 8081 en profil `test`, chacune avec sa configuration et ses Dev Services."
  - key: situation-tdd
    format: scenario
    question: |-
      Tu pratiques le TDD : écrire un test, le voir échouer, coder, le voir passer. Relancer les tests depuis l'IDE à
      chaque étape te ralentit. Que fais-tu ?
    choices:
      - {text: "Je lance le mode dev et j'active le test continu avec `r`", correct: true}
      - {text: "Je lance `./mvnw verify` dans une boucle `while` du terminal", correct: false}
      - {text: "J'écris tout le code d'abord, puis tous les tests à la fin", correct: false}
      - {text: "Je compile en natif pour que les tests s'exécutent plus vite", correct: false}
    answer: |-
      À chaque enregistrement, les tests concernés tournent dans la JVM chaude du mode dev, et le résultat s'affiche
      dans le terminal. Le cycle rouge, vert, refactoring devient immédiat.
  - key: situation-tests-lents
    format: scenario
    question: |-
      Le test continu est actif, mais quelques tests très lents ralentissent chaque cycle pendant que tu corriges un
      seul test en échec. Que fais-tu ?
    choices:
      - {text: "Je passe en mode « broken only » avec `b`, pour ne rejouer que ce test", correct: true}
      - {text: "Je supprime les tests lents, qui n'apportent rien au test continu", correct: false}
      - {text: "Je quitte le mode dev et je reviens à `./mvnw test` à chaque fois", correct: false}
      - {text: "J'augmente la mémoire de la JVM pour accélérer les tests lents", correct: false}
    answer: |-
      Le mode « broken only » limite la boucle aux tests cassés. Une fois le test corrigé, `r` relance tout pour
      vérifier qu'aucun autre n'a cassé.
  - key: situation-rien-ne-tourne
    format: scenario
    question: |-
      Un collègue lance `quarkus dev`, modifie du code, et s'étonne qu'aucun test ne tourne alors qu'on lui a vanté le
      test continu. Que lui dis-tu ?
    choices:
      - {text: "Qu'il démarre en pause : `r` le lance, ou une propriété l'active d'office", correct: true}
      - {text: "Que le test continu demande une extension payante de Quarkus", correct: false}
      - {text: "Que seuls les tests annotés `@Continuous` sont concernés", correct: false}
      - {text: "Que le test continu ne marche qu'avec Gradle, pas avec Maven", correct: false}
    answer: |-
      La pause par défaut évite de lancer des tests quand on ne fait qu'explorer. `quarkus.test.continuous-testing=enabled`
      convient à qui veut toujours l'avoir.
  - key: situation-avant-de-livrer
    format: scenario
    question: |-
      Le test continu est vert. Un collègue propose de livrer directement, sans lancer le build complet. Que
      réponds-tu ?
    choices:
      - {text: "Que le build complet lance aussi les tests d'intégration sur l'artefact construit", correct: true}
      - {text: "Qu'il a raison : le test continu a déjà joué exactement les mêmes vérifications", correct: false}
      - {text: "Qu'il faut d'abord relancer le mode dev, qui garde les résultats d'une session", correct: false}
      - {text: "Qu'il faut livrer en mode dev, pour garder le test continu en production", correct: false}
    answer: |-
      Le test continu ne rejoue que les tests touchés, dans la JVM du mode dev. `./mvnw verify` construit l'artefact
      et lance aussi les `@QuarkusIntegrationTest`, qui le testent de l'extérieur, en jar ou en natif.
