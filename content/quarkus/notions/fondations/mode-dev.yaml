notion: mode-dev
lesson: |-
  Le **mode dev** est la façon normale de développer avec Quarkus : on le lance une fois, et l'on modifie le code
  sans jamais relancer la commande.

  ```bash
  quarkus dev              # avec la CLI
  ./mvnw quarkus:dev       # avec Maven
  ./gradlew quarkusDev     # avec Gradle
  ```

  **Le rechargement à chaud.** Quand tu modifies une classe Java, une ressource ou `application.properties`, Quarkus
  ne fait rien tout de suite : à la **requête HTTP suivante**, il voit les fichiers changés, recompile ce qui a bougé
  et redémarre l'application **dans la même JVM**, avec un nouveau chargeur de classes. Le redémarrage prend une
  fraction de seconde à quelques secondes ; la JVM, elle, reste chaude. La touche `s` force ce redémarrage sans
  attendre de requête.

  Si le code ne compile plus, l'application ne s'arrête pas : la requête suivante affiche **une page d'erreur** avec
  l'erreur de compilation, et tout repart dès que le code est corrigé.

  **Le profil `dev`.** En mode dev, le profil actif est `dev` : une propriété préfixée `%dev.` ne vaut que là.

  ```properties
  %dev.quarkus.log.category."fr.boutique".level=DEBUG
  %dev.quarkus.http.port=8090
  ```

  **Le terminal interactif.** Le mode dev lit des touches :

  | Touche | Effet |
  |---|---|
  | `s` | forcer le redémarrage |
  | `r` | lancer (ou relancer) les tests, voir « test continu » |
  | `d` | ouvrir la Dev UI dans le navigateur |
  | `w` | ouvrir l'application dans le navigateur |
  | `h` | afficher l'aide |
  | `q` | quitter |

  **Le débogage.** Le mode dev ouvre un port de débogage, **5005** par défaut : l'IDE s'y attache comme à une
  application distante. `-Ddebug=false` le désactive, `-Dsuspend` fait attendre le débogueur avant de démarrer.

  **Ce qui vient avec.** Le mode dev démarre aussi les **Dev Services** (une base, un broker...) et sert la **Dev UI**
  sous `/q/dev-ui`. Ce n'est pas un mode de production : il garde l'outillage de compilation et surveille les fichiers.

  **En entretien** : « En mode dev, je lance `quarkus dev` une fois ; à la requête suivante, Quarkus recompile ce qui a
  changé et redémarre l'application dans la même JVM, en une fraction de seconde. Le profil `dev` est actif, un port de
  débogage est ouvert, et les Dev Services et la Dev UI sont là. C'est un outil de développement, jamais de
  production. »
cards:
  - key: quand-le-rechargement
    format: course
    question: "En mode dev, à quel moment Quarkus prend-il en compte une classe que tu viens de modifier ?"
    choices:
      - {text: "À la requête HTTP suivante, ou quand tu forces le redémarrage", correct: true}
      - {text: "Immédiatement à l'enregistrement, en arrêtant toute la JVM", correct: false}
      - {text: "Seulement après avoir relancé `quarkus dev` à la main", correct: false}
      - {text: "Toutes les minutes, à heure fixe, comme une tâche planifiée", correct: false}
    answer: "Le rechargement est paresseux : la requête suivante déclenche la recompilation et le redémarrage dans la même JVM. La touche `s` le provoque sans requête."
  - key: profil-actif-en-dev
    format: course
    question: "Quel profil de configuration est actif en mode dev ?"
    choices:
      - {text: "Le profil `dev`", correct: true}
      - {text: "Le profil `test`", correct: false}
      - {text: "Le profil `prod`", correct: false}
      - {text: "Aucun : les profils ne servent qu'en production", correct: false}
    answer: "Les propriétés `%dev.` ne valent qu'en mode dev, `%test.` dans les tests, `%prod.` dans l'application construite. Une propriété sans préfixe vaut partout."
  - key: erreur-de-compilation
    format: course
    question: "En mode dev, que se passe-t-il quand tu enregistres du code qui ne compile pas, puis envoies une requête ?"
    choices:
      - {text: "Une page d'erreur montre l'erreur de compilation ; l'application reste lancée", correct: true}
      - {text: "Le mode dev s'arrête, et il faut relancer la commande après correction", correct: false}
      - {text: "L'ancienne version continue de répondre, sans rien signaler", correct: false}
      - {text: "Quarkus annule la modification dans le fichier source", correct: false}
    answer: "Le mode dev survit à l'erreur : il affiche le message du compilateur dans le navigateur et le terminal. Dès que le code compile, la requête suivante recharge l'application."
  - key: touche-redemarrage
    format: course
    question: "Dans le terminal du mode dev, quelle touche force le redémarrage de l'application ?"
    choices:
      - {text: "`s`", correct: true}
      - {text: "`r`", correct: false}
      - {text: "`d`", correct: false}
      - {text: "`h`", correct: false}
    answer: "`s` redémarre sans attendre une requête. `r` lance les tests, `d` ouvre la Dev UI, `h` affiche l'aide."
  - key: vf-redemarrage-jvm
    format: true-false
    question: "En mode dev, Quarkus redémarre toute la JVM à chaque modification du code."
    truth: false
    answer: "La JVM reste lancée : seule l'application redémarre, avec un nouveau chargeur de classes. C'est pourquoi le rechargement est si rapide."
  - key: vf-port-de-debogage
    format: true-false
    question: "Le mode dev ouvre un port de débogage, 5005 par défaut, auquel l'IDE peut s'attacher."
    truth: true
    answer: "On crée dans l'IDE une configuration « Remote JVM Debug » sur le port 5005. `-Ddebug=false` ferme ce port ; `-Dsuspend` attend le débogueur avant de démarrer."
  - key: vf-application-properties
    format: true-false
    question: "En mode dev, une modification d'`application.properties` est prise en compte sans relancer la commande."
    truth: true
    answer: "Le fichier est surveillé comme le code : la requête suivante redémarre l'application avec la nouvelle configuration."
  - key: vf-mode-dev-en-production
    format: true-false
    question: "Le mode dev convient à la production, puisqu'il évite de redéployer l'application à chaque correction."
    truth: false
    answer: "Le mode dev garde le compilateur, surveille les fichiers, ouvre un port de débogage et la Dev UI. En production, on lance l'application construite par `./mvnw package`."
  - key: qcm-commande-cli
    format: multiple-choice
    question: "Avec la CLI, quelle commande lance le mode dev ?"
    choices:
      - {text: "`quarkus dev`", correct: true}
      - {text: "`quarkus run --dev`", correct: false}
      - {text: "`quarkus start`", correct: false}
      - {text: "`quarkus watch`", correct: false}
    answer: "`quarkus dev` appelle `./mvnw quarkus:dev` ou `./gradlew quarkusDev` selon le projet."
  - key: qcm-prefixe-dev
    format: multiple-choice
    question: "Comment écrire une propriété qui ne vaut qu'en mode dev ?"
    choices:
      - {text: "La préfixer par `%dev.`", correct: true}
      - {text: "La préfixer par `dev.`", correct: false}
      - {text: "La mettre dans `application-dev.yaml`", correct: false}
      - {text: "La suffixer par `.dev`", correct: false}
    answer: "`%dev.quarkus.http.port=8090` ne vaut qu'en mode dev ; la même propriété sans préfixe vaudrait dans tous les profils. Le `%` distingue le profil d'une simple partie du nom."
  - key: qcm-quitter
    format: multiple-choice
    question: "Dans le terminal du mode dev, quelle touche arrête l'application et quitte le mode dev ?"
    choices:
      - {text: "`q`", correct: true}
      - {text: "`s`", correct: false}
      - {text: "`w`", correct: false}
      - {text: "`e`", correct: false}
    answer: "`q` quitte proprement (Ctrl+C aussi). `s` redémarre, `w` ouvre l'application dans le navigateur."
  - key: qcm-pourquoi-rapide
    format: multiple-choice
    question: "Pourquoi le rechargement du mode dev est-il si rapide ?"
    choices:
      - {text: "Il recompile ce qui a changé et redémarre dans la même JVM, déjà chaude", correct: true}
      - {text: "Il interprète le code source Java sans le compiler du tout", correct: false}
      - {text: "Il garde l'ancienne version en mémoire et n'applique que la différence", correct: false}
      - {text: "Il désactive l'injection de dépendances pendant le développement", correct: false}
    answer: "Pas de nouvelle JVM à démarrer, pas de JIT à refaire chauffer : seuls le code modifié et l'application sont rechargés."
  - key: trous-goal-maven
    format: fill-in
    question: |-
      Complète pour lancer le mode dev avec Maven :
      ```bash
      ./mvnw quarkus:___
      ```
    blanks:
      - [dev]
    answer: "Le goal `quarkus:dev` du plugin Quarkus lance le mode dev ; avec Gradle, c'est la tâche `quarkusDev`."
  - key: trous-profil-dev
    format: fill-in
    question: |-
      Complète pour journaliser en `DEBUG` seulement en mode dev :
      ```properties
      %___.quarkus.log.category."fr.boutique".level=DEBUG
      ```
    blanks:
      - [dev]
    answer: "Le préfixe `%dev.` limite la propriété au profil `dev`. Sans préfixe, elle vaudrait aussi en production."
  - key: trous-tache-gradle
    format: fill-in
    question: |-
      Complète pour lancer le mode dev avec Gradle :
      ```bash
      ./gradlew ___
      ```
    blanks:
      - [quarkusDev]
    answer: "La tâche `quarkusDev` du plugin Gradle de Quarkus fait comme `./mvnw quarkus:dev`."
  - key: trous-port-debogage
    format: fill-in
    question: |-
      Complète le port de débogage ouvert par défaut en mode dev :
      ```properties
      # l'IDE s'attache à localhost:___
      ```
    blanks:
      - ["5005"]
    answer: "Le mode dev écoute le débogueur sur le port 5005. On le désactive avec `-Ddebug=false`."
  - key: situation-package-a-chaque-modif
    format: scenario
    question: |-
      Un collègue relance `./mvnw package` puis `java -jar` après chaque modification, et perd une minute à chaque
      fois. Que lui proposes-tu ?
    choices:
      - {text: "De lancer `quarkus dev` une fois, puis de simplement envoyer une requête", correct: true}
      - {text: "D'ajouter `-DskipTests` au `package` pour gagner quelques secondes", correct: false}
      - {text: "De compiler en natif, qui démarre plus vite à chaque essai", correct: false}
      - {text: "De garder ce cycle, le seul qui reflète vraiment la production", correct: false}
    answer: |-
      Le mode dev recompile et redémarre à la requête suivante, sans relancer la JVM. Le cycle complet reste utile
      avant de livrer, pour tester l'application construite.
  - key: situation-deboguer
    format: scenario
    question: |-
      Tu veux suivre pas à pas l'exécution d'une méthode, dans ton IDE, pendant que l'application tourne en mode dev.
      Que fais-tu ?
    choices:
      - {text: "J'attache le débogueur de l'IDE au port 5005, ouvert par le mode dev", correct: true}
      - {text: "J'arrête le mode dev et je relance l'application avec un agent de profilage", correct: false}
      - {text: "J'ajoute des `System.out.println` : le mode dev ne permet pas le débogage", correct: false}
      - {text: "Je compile en natif, qui expose un port de débogage plus complet", correct: false}
    answer: |-
      Le mode dev ouvre d'office le port 5005 : une configuration « Remote JVM Debug » suffit. Les points d'arrêt
      survivent aux rechargements.
  - key: situation-debug-seulement-en-dev
    format: scenario
    question: |-
      Tu veux des journaux en `DEBUG` pour ton package pendant le développement, sans risquer de les activer en
      production. Comment l'écris-tu ?
    choices:
      - {text: "Avec une propriété préfixée `%dev.` dans `application.properties`", correct: true}
      - {text: "Avec la propriété sans préfixe, que je retirerai avant chaque livraison", correct: false}
      - {text: "Avec un `if` dans le code qui teste le nom de la machine", correct: false}
      - {text: "Avec une variable d'environnement posée sur le serveur de production", correct: false}
    answer: |-
      `%dev.quarkus.log.category."fr.boutique".level=DEBUG` ne vaut qu'en mode dev. Rien à retirer avant de livrer :
      le profil `prod` l'ignore.
  - key: situation-rechargement-invisible
    format: scenario
    question: |-
      En mode dev, tu modifies une méthode et tu regardes le terminal : rien ne se passe. Un collègue pense que le
      rechargement est cassé. Qu'en dis-tu ?
    choices:
      - {text: "C'est normal : le rechargement attend la requête suivante, ou la touche `s`", correct: true}
      - {text: "Il a raison : il faut relancer `quarkus dev` après chaque modification", correct: false}
      - {text: "Il a raison : le rechargement ne marche qu'avec les fichiers de configuration", correct: false}
      - {text: "C'est normal : le rechargement n'a lieu qu'une fois par heure", correct: false}
    answer: |-
      Quarkus recharge paresseusement : rien ne bouge avant qu'une requête arrive. Envoie une requête (ou appuie sur
      `s`) : le terminal montre alors les fichiers changés et le redémarrage.
