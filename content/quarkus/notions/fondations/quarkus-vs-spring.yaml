notion: quarkus-vs-spring
lesson: |-
  « Pourquoi Quarkus plutôt que Spring Boot ? » est une question d'entretien classique. Les deux frameworks font le
  même métier ; ils diffèrent surtout par **le moment où le travail se fait**, par leurs API, et par leur écosystème.

  **Les équivalences, pour passer de l'un à l'autre.**

  | Besoin | Spring Boot | Quarkus |
  |---|---|---|
  | Injection | `@Autowired`, `@Component`, `@Service` | `@Inject`, `@ApplicationScoped` (CDI) |
  | API REST | `@RestController`, `@GetMapping` | `@Path`, `@GET` (Jakarta REST) |
  | Configuration | `@Value`, `@ConfigurationProperties` | `@ConfigProperty`, `@ConfigMapping` |
  | Persistance simplifiée | Spring Data JPA (`JpaRepository`) | Panache (`PanacheRepository`, `PanacheEntity`) |
  | Test de l'application | `@SpringBootTest` | `@QuarkusTest` |
  | Doublure d'un bean | `@MockitoBean` | `@InjectMock` |
  | Services en dev | Testcontainers, support de Docker Compose | Dev Services |
  | Réactif | WebFlux, Reactor (`Mono`, `Flux`) | Quarkus REST, Mutiny (`Uni`, `Multi`) |

  **La différence d'architecture.** Spring Boot construit l'essentiel de son contexte **au démarrage** : scan des
  composants, conditions d'auto-configuration, proxies créés à l'exécution. Quarkus fait ce travail **au build**. Spring
  a réduit l'écart (le moteur AOT de Spring Boot 3 et l'image native avec GraalVM), mais le build time reste au cœur de
  Quarkus, alors qu'il est une option dans Spring.

  **Des différences de comportement qui surprennent.**

  - Un bean `@ApplicationScoped` de Quarkus est créé **à sa première utilisation** ; un singleton de Spring l'est au
    démarrage.
  - Quarkus **retire au build les beans inutilisés** ; Spring garde tout ce qu'il a scanné.
  - Les intercepteurs de Quarkus s'appliquent aussi aux **appels internes** (`this.methode()`), car ArC génère une
    sous-classe ; dans Spring, un appel par `this` contourne le proxy et son `@Transactional`.
  - Une dépendance introuvable fait échouer **le build** avec Quarkus, **le démarrage** avec Spring.

  **Comment choisir.**

  | Plutôt Spring Boot | Plutôt Quarkus |
  |---|---|
  | une équipe qui le maîtrise déjà | démarrage rapide et mémoire réduite comptent (Kubernetes dense, serverless) |
  | des projets de l'écosystème Spring (Spring Batch, Spring Cloud, Spring Security avancé) | une compilation native visée dès le départ |
  | un vivier de recrutement plus large | une équipe à l'aise avec Jakarta EE et MicroProfile |

  Il n'y a pas de gagnant absolu : on compare sur **ses propres critères**, mesurés sur un prototype, plutôt que sur
  des chiffres de démonstration. Et une migration a un coût : réécrire les contrôleurs, la configuration, les tests.
  Les extensions de compatibilité Spring de Quarkus aident, sans tout couvrir.

  **En entretien** : « Les deux font le même métier ; Quarkus déplace au build ce que Spring Boot fait surtout au
  démarrage, d'où un démarrage plus rapide et moins de mémoire, surtout en natif. Spring Boot a l'écosystème le plus
  riche et le plus connu. Je choisis selon le contexte : contraintes de démarrage et de mémoire, compétences de
  l'équipe, besoins de l'écosystème. »
cards:
  - key: equivalent-restcontroller
    format: course
    question: "Quel est l'équivalent Quarkus d'un `@RestController` avec `@GetMapping(\"/produits\")` ?"
    choices:
      - {text: "Une classe `@Path(\"/produits\")` avec une méthode `@GET`", correct: true}
      - {text: "Une classe `@Controller` avec une méthode `@RequestMapping`", correct: false}
      - {text: "Une classe `@WebServlet(\"/produits\")` avec une méthode `doGet`", correct: false}
      - {text: "Une classe `@Route(\"/produits\")` avec une méthode `@Handler`", correct: false}
    answer: "Quarkus REST implémente Jakarta REST : `@Path` sur la classe ou la méthode, `@GET`, `@POST`... La valeur renvoyée devient le corps de la réponse, en JSON avec `quarkus-rest-jackson`."
  - key: equivalent-configurationproperties
    format: course
    question: "Quel est l'équivalent Quarkus de `@ConfigurationProperties`, pour lier un groupe de propriétés à un type ?"
    choices:
      - {text: "`@ConfigMapping` sur une interface", correct: true}
      - {text: "`@ConfigProperty` sur une classe", correct: false}
      - {text: "`@Value` sur chaque champ", correct: false}
      - {text: "`@PropertySource` sur la classe", correct: false}
    answer: "`@ConfigMapping(prefix = \"boutique\")` sur une interface lie toutes les propriétés `boutique.*`, validées au démarrage. `@ConfigProperty` injecte une seule valeur, comme `@Value`."
  - key: equivalent-springboottest
    format: course
    question: "Quel est l'équivalent Quarkus de `@SpringBootTest` ?"
    choices:
      - {text: "`@QuarkusTest`", correct: true}
      - {text: "`@QuarkusIntegrationTest`", correct: false}
      - {text: "`@TestProfile`", correct: false}
      - {text: "`@InjectMock`", correct: false}
    answer: "`@QuarkusTest` démarre l'application dans la JVM des tests et permet `@Inject`. `@QuarkusIntegrationTest` teste l'artefact construit (jar, image native ou conteneur), de l'extérieur."
  - key: difference-d-architecture
    format: course
    question: "Quelle est la principale différence d'architecture entre Quarkus et Spring Boot ?"
    choices:
      - {text: "Quarkus fait au build l'essentiel de ce que Spring Boot fait au démarrage", correct: true}
      - {text: "Quarkus n'utilise pas l'injection de dépendances, contrairement à Spring Boot", correct: false}
      - {text: "Quarkus ne s'exécute qu'en natif, Spring Boot qu'en JVM", correct: false}
      - {text: "Quarkus impose la programmation réactive, Spring Boot l'impératif", correct: false}
    answer: "Scan, conditions, proxies : Spring Boot les traite surtout au démarrage (son moteur AOT en avance une partie), Quarkus au build. Les deux font de l'injection, de l'impératif et du réactif, en JVM ou en natif."
  - key: vf-spring-natif
    format: true-false
    question: "Spring Boot ne permet pas de compiler une application en image native."
    truth: false
    answer: "Spring Boot 3 produit des images natives avec GraalVM, grâce à son moteur AOT. Quarkus reste conçu pour le natif dès l'origine, mais ce n'est plus une exclusivité."
  - key: vf-auto-interception
    format: true-false
    question: "Dans Quarkus, un appel interne `this.methode()` vers une méthode interceptée passe par l'intercepteur."
    truth: true
    answer: "ArC intercepte en générant une sous-classe du bean : l'appel par `this` atteint la méthode redéfinie, donc l'intercepteur. Dans Spring, le même appel contourne le proxy, et son `@Transactional`."
  - key: vf-application-scoped-au-demarrage
    format: true-false
    question: "Comme un singleton de Spring, un bean `@ApplicationScoped` de Quarkus est créé au démarrage de l'application."
    truth: false
    answer: "Il est créé à la première utilisation, à travers son proxy client. Pour le créer au démarrage, on ajoute `@Startup`, ou l'on observe `StartupEvent`."
  - key: vf-compatibilite-spring
    format: true-false
    question: "Quarkus propose des extensions qui comprennent une partie des annotations de Spring, comme `@Autowired` ou `@GetMapping`."
    truth: true
    answer: "`quarkus-spring-di`, `quarkus-spring-web`, `quarkus-spring-data-jpa` traduisent ces annotations au build. Elles facilitent une migration, sans faire tourner Spring lui-même."
  - key: qcm-equivalent-spring-data
    format: multiple-choice
    question: "Quel est l'équivalent Quarkus d'un `JpaRepository` de Spring Data ?"
    choices:
      - {text: "Un `PanacheRepository<Produit>`", correct: true}
      - {text: "Un `EntityManagerFactory`", correct: false}
      - {text: "Un `CrudResource<Produit>`", correct: false}
      - {text: "Un `@Repository` de Jakarta", correct: false}
    answer: "`PanacheRepository<T>` apporte `findById`, `list`, `persist`, `delete`, `find(\"nom\", valeur)`... Panache propose aussi le style « entité active » avec `PanacheEntity`."
  - key: qcm-equivalent-autowired
    format: multiple-choice
    question: "Quelle annotation remplace `@Autowired` dans une application Quarkus ?"
    choices:
      - {text: "`@Inject`", correct: true}
      - {text: "`@Resource`", correct: false}
      - {text: "`@Produces`", correct: false}
      - {text: "`@Bean`", correct: false}
    answer: "`@Inject` (Jakarta) marque un point d'injection. Avec un seul constructeur, Quarkus n'exige même pas l'annotation. `@Produces` déclare un producteur, comme `@Bean` dans Spring."
  - key: qcm-equivalent-testcontainers-en-dev
    format: multiple-choice
    question: "En dev, Spring Boot peut démarrer les services de `compose.yaml`. Quel est l'équivalent Quarkus ?"
    choices:
      - {text: "Les Dev Services, qui démarrent seuls les services manquants", correct: true}
      - {text: "La Dev UI, qui installe les services sur le poste", correct: false}
      - {text: "Le test continu, qui lance une base à chaque test", correct: false}
      - {text: "Les profils, qui embarquent une base en mémoire", correct: false}
    answer: "Une extension qui a besoin d'une base ou d'un broker non configurés en démarre un conteneur, en dev et en test, sans aucun fichier à écrire."
  - key: qcm-equivalent-reactif
    format: multiple-choice
    question: "Quel est l'équivalent Quarkus de Spring WebFlux et de Reactor ?"
    choices:
      - {text: "Quarkus REST avec Mutiny (`Uni`, `Multi`)", correct: true}
      - {text: "RESTEasy Classic avec RxJava", correct: false}
      - {text: "Quarkus REST avec `CompletableFuture` seulement", correct: false}
      - {text: "Vert.x seul, sans aucune API REST", correct: false}
    answer: "Quarkus REST sert à la fois l'impératif et le réactif ; une méthode qui renvoie un `Uni` reste sur la boucle d'événements. `Uni` et `Multi` jouent le rôle de `Mono` et `Flux`."
  - key: situation-equipe-spring
    format: scenario
    question: |-
      Une équipe experte en Spring Boot démarre une application interne, déployée sur deux machines virtuelles, sans
      contrainte de mémoire ni de démarrage. Que lui conseilles-tu ?
    choices:
      - {text: "Rester sur Spring Boot : les atouts de Quarkus n'y apportent presque rien", correct: true}
      - {text: "Passer à Quarkus : Spring Boot est déconseillé pour toute nouvelle application", correct: false}
      - {text: "Passer à Quarkus natif : la JVM est trop lente pour une application interne", correct: false}
      - {text: "Écrire l'application avec les deux, et garder celle qui démarre le plus vite", correct: false}
    answer: |-
      Démarrage et mémoire ne sont pas un enjeu ici ; la maîtrise de l'équipe, si. Changer de framework aurait un coût
      (apprentissage, nouvelles API) sans gain mesurable.
  - key: situation-serverless
    format: scenario
    question: |-
      Tu dois écrire des fonctions serverless en Java, démarrées à la demande, facturées à la milliseconde. Quel choix
      défends-tu ?
    choices:
      - {text: "Quarkus compilé en natif, pour un démarrage à froid quasi instantané", correct: true}
      - {text: "Spring Boot sur la JVM, pour profiter de son écosystème le plus large", correct: false}
      - {text: "N'importe lequel : le démarrage ne compte pas en serverless", correct: false}
      - {text: "Un serveur d'applications Jakarta EE, démarré une fois pour toutes", correct: false}
    answer: |-
      Chaque démarrage à froid se paie en latence et en facture. Une image native Quarkus démarre en quelques dizaines
      de millisecondes. Spring Boot natif est possible aussi ; Quarkus y est conçu dès l'origine.
  - key: situation-spring-batch
    format: scenario
    question: |-
      Le projet repose sur Spring Batch pour des traitements par lots complexes, avec reprise sur erreur. Un collègue
      propose de passer à Quarkus. Que réponds-tu ?
    choices:
      - {text: "Que Spring Batch n'a pas d'équivalent direct, et que la migration coûterait cher", correct: true}
      - {text: "Que Quarkus exécute Spring Batch tel quel, grâce à `quarkus-spring-di`", correct: false}
      - {text: "Que Quarkus interdit les traitements par lots, réservés aux serveurs", correct: false}
      - {text: "Que la reprise sur erreur est automatique dans Quarkus, sans aucun code", correct: false}
    answer: |-
      Les extensions de compatibilité couvrent l'injection, le web et Spring Data, pas Spring Batch. Quarkus a ses
      propres outils (planification, JBeret pour Jakarta Batch), mais réécrire des traitements éprouvés se justifie
      rarement.
  - key: situation-lequel-est-meilleur
    format: scenario
    question: |-
      Un recruteur te demande : « Quarkus ou Spring Boot, lequel est le meilleur ? » Quelle réponse est la plus
      convaincante ?
    choices:
      - {text: "Ça dépend du contexte : démarrage, mémoire, compétences de l'équipe, écosystème", correct: true}
      - {text: "Quarkus, car il démarre plus vite dans tous les cas, ce qui suffit à trancher", correct: false}
      - {text: "Spring Boot, car Quarkus est un projet expérimental, encore instable", correct: false}
      - {text: "Aucun des deux : les microservices doivent s'écrire sans framework", correct: false}
    answer: |-
      Une bonne réponse nomme les critères et donne un exemple de chaque choix : Quarkus natif pour du serverless,
      Spring Boot pour une équipe qui le maîtrise ou un besoin de Spring Batch. Et l'on mesure sur un prototype.
