notion: conteneurs-kubernetes
lesson: |-
  Quarkus sait **construire l'image de conteneur** de l'application et **écrire ses manifestes Kubernetes**, au
  moment du build, à partir de sa configuration. Pas de Dockerfile ni de YAML à maintenir à la main pour le cas
  courant.

  **Les images.** Une extension choisit l'outil de construction :

  | Extension | Construit avec | Particularité |
  |---|---|---|
  | `quarkus-container-image-jib` | Jib | **sans démon Docker**, couches optimisées, peut pousser directement |
  | `quarkus-container-image-docker` | Docker | utilise les Dockerfile de `src/main/docker/` |
  | `quarkus-container-image-podman` | Podman | idem, sans démon |
  | `quarkus-container-image-buildpack` | Buildpacks | images construites par un builder |

  ```properties
  quarkus.container-image.registry=registry.exemple.fr
  quarkus.container-image.group=boutique
  quarkus.container-image.name=catalogue
  quarkus.container-image.tag=1.4.0
  ```

  ```bash
  ./mvnw package -Dquarkus.container-image.build=true                                  # construit l'image
  ./mvnw package -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true  # et la pousse
  ./mvnw package -Dnative -Dquarkus.container-image.build=true                           # une image native
  ```

  Par défaut, le nom vient de l'`artifactId` et l'étiquette de la version du projet ; `quarkus.container-image.image`
  donne le nom complet d'un coup.

  **Les manifestes Kubernetes.** Avec `quarkus-kubernetes`, chaque build écrit `target/kubernetes/kubernetes.yml` :
  un `Deployment` et un `Service`, qui pointent vers l'image configurée. Si SmallRye Health est présent, les **sondes**
  liveness et readiness y sont déjà, sur `/q/health/live` et `/q/health/ready`.

  ```properties
  quarkus.kubernetes.replicas=3
  quarkus.kubernetes.env.vars.boutique-devise=EUR
  quarkus.kubernetes.env.secrets=catalogue-db
  quarkus.kubernetes.resources.requests.memory=128Mi
  quarkus.kubernetes.resources.limits.memory=256Mi
  quarkus.kubernetes.ingress.expose=true
  ```

  Un fichier `src/main/kubernetes/kubernetes.yml` est **fusionné** avec ce qui est généré, pour ce que la
  configuration ne couvre pas. `quarkus.kubernetes.deploy=true` applique les manifestes au cluster du `kubeconfig`
  courant. Des variantes visent d'autres plateformes : `quarkus-openshift`, `quarkus-minikube`, `quarkus-kind`.

  **Les bonnes pratiques.** Une étiquette **immuable** par version (pas `latest`), les secrets dans des `Secret`
  Kubernetes (référencés par `env.secrets`), jamais dans `application.properties`, et des limites de mémoire
  mesurées, pas devinées.

  **En entretien** : « Avec une extension `container-image`, Jib par exemple, Quarkus construit et pousse l'image au
  build, sans Dockerfile ni démon Docker. Avec `quarkus-kubernetes`, il génère le `Deployment` et le `Service` dans
  `target/kubernetes`, sondes de santé comprises, et je règle répliques, variables et ressources dans
  `application.properties`. Les secrets restent dans des `Secret` Kubernetes, et chaque version a son étiquette. »
cards:
  - key: jib-sans-docker
    format: course
    question: "Quel avantage `quarkus-container-image-jib` a-t-il sur `quarkus-container-image-docker` ?"
    choices:
      - {text: "Il construit l'image sans démon Docker, et peut la pousser seul", correct: true}
      - {text: "Il produit des images natives, que Docker ne sait pas construire", correct: false}
      - {text: "Il écrit aussi les manifestes Kubernetes de l'application", correct: false}
      - {text: "Il lit les Dockerfile de `src/main/docker/`, sans les modifier", correct: false}
    answer: "Jib assemble les couches de l'image lui-même, depuis la JVM du build : pas besoin de Docker sur l'agent de CI. C'est l'extension Docker qui utilise les Dockerfile."
  - key: declencher-la-construction
    format: course
    question: "Quelle propriété demande à Quarkus de construire l'image de conteneur pendant le build ?"
    choices:
      - {text: "`quarkus.container-image.build=true`", correct: true}
      - {text: "`quarkus.container-image.push=true`", correct: false}
      - {text: "`quarkus.kubernetes.deploy=true`", correct: false}
      - {text: "`quarkus.docker.enabled=true`", correct: false}
    answer: "`build=true` construit l'image ; `push=true` la pousse en plus dans le registre ; `quarkus.kubernetes.deploy=true` applique les manifestes au cluster."
  - key: manifestes-generes
    format: course
    question: "Où `quarkus-kubernetes` écrit-il les manifestes générés ?"
    choices:
      - {text: "Dans `target/kubernetes/kubernetes.yml`", correct: true}
      - {text: "Dans `src/main/kubernetes/kubernetes.yml`", correct: false}
      - {text: "Dans `k8s/deployment.yaml`, à la racine", correct: false}
      - {text: "Directement dans le cluster, sans fichier", correct: false}
    answer: "Le build écrit `target/kubernetes/kubernetes.yml` (et sa version JSON). `src/main/kubernetes/` contient au contraire ce qu'on veut y fusionner à la main."
  - key: sondes-automatiques
    format: course
    question: "Que gagne le `Deployment` généré quand l'application a l'extension SmallRye Health ?"
    choices:
      - {text: "Des sondes liveness et readiness, sur les chemins de santé", correct: true}
      - {text: "Un `HorizontalPodAutoscaler` réglé sur la charge du processeur", correct: false}
      - {text: "Un tableau de bord Grafana des sondes de santé", correct: false}
      - {text: "Un redémarrage du pod à chaque déploiement d'une autre application", correct: false}
    answer: "Quarkus voit l'extension de santé et branche les sondes sur `/q/health/live` et `/q/health/ready`, sans configuration supplémentaire."
  - key: vf-docker-pour-jib
    format: true-false
    question: "L'extension `quarkus-container-image-jib` a besoin d'un démon Docker pour construire l'image."
    truth: false
    answer: "Jib construit les couches et le manifeste de l'image sans Docker. C'est pratique sur un agent de CI qui n'en a pas."
  - key: vf-fusion-manuelle
    format: true-false
    question: "Un fichier `src/main/kubernetes/kubernetes.yml` est fusionné avec les manifestes que Quarkus génère."
    truth: true
    answer: "On y écrit ce que la configuration ne sait pas exprimer ; Quarkus le combine avec ce qu'il génère, dans `target/kubernetes/`."
  - key: vf-etiquette-par-defaut
    format: true-false
    question: "Sans réglage, l'image construite par Quarkus prend pour étiquette la version du projet."
    truth: true
    answer: "L'étiquette par défaut est la version Maven, et le nom vient de l'`artifactId`. `quarkus.container-image.tag` la remplace."
  - key: vf-secret-en-clair
    format: true-false
    question: "Le mot de passe de la base de production a sa place dans `application.properties`, puisque l'image est privée."
    truth: false
    answer: "Un secret ne va ni dans le dépôt ni dans l'image : il vit dans un `Secret` Kubernetes, que `quarkus.kubernetes.env.secrets` injecte en variables d'environnement."
  - key: qcm-ci-sans-docker
    format: multiple-choice
    question: "Ton agent de CI n'a pas Docker. Avec quelle extension construis-tu et pousses-tu l'image ?"
    choices:
      - {text: "`quarkus-container-image-jib`", correct: true}
      - {text: "`quarkus-container-image-docker`", correct: false}
      - {text: "`quarkus-kubernetes`", correct: false}
      - {text: "`quarkus-smallrye-health`", correct: false}
    answer: "Jib n'a besoin que de la JVM du build et d'un accès au registre. L'extension Docker a besoin du démon ; `quarkus-kubernetes` écrit des manifestes, il ne construit pas d'image."
  - key: qcm-injecter-un-secret
    format: multiple-choice
    question: "Comment le `Deployment` généré reçoit-il les clés du `Secret` Kubernetes `catalogue-db` en variables d'environnement ?"
    choices:
      - {text: "`quarkus.kubernetes.env.secrets=catalogue-db`", correct: true}
      - {text: "`quarkus.kubernetes.secrets.mount=catalogue-db`", correct: false}
      - {text: "`quarkus.container-image.secrets=catalogue-db`", correct: false}
      - {text: "`%prod.quarkus.datasource.password=catalogue-db`", correct: false}
    answer: "`env.secrets` ajoute au conteneur toutes les clés du `Secret` comme variables, que Quarkus lit au démarrage (`QUARKUS_DATASOURCE_PASSWORD`...)."
  - key: qcm-nom-complet
    format: multiple-choice
    question: "Quelle propriété donne d'un coup le nom complet de l'image, registre et étiquette compris ?"
    choices:
      - {text: "`quarkus.container-image.image`", correct: true}
      - {text: "`quarkus.container-image.name`", correct: false}
      - {text: "`quarkus.container-image.group`", correct: false}
      - {text: "`quarkus.kubernetes.image-name`", correct: false}
    answer: "`image=registry.exemple.fr/boutique/catalogue:1.4.0` remplace `registry`, `group`, `name` et `tag`, qui composent sinon le nom."
  - key: qcm-appliquer-au-cluster
    format: multiple-choice
    question: "Quel réglage fait appliquer les manifestes générés au cluster Kubernetes, pendant le build ?"
    choices:
      - {text: "`quarkus.kubernetes.deploy=true`", correct: true}
      - {text: "`quarkus.container-image.push=true`", correct: false}
      - {text: "`quarkus.kubernetes.apply=always`", correct: false}
      - {text: "`quarkus.kubernetes.replicas=1`", correct: false}
    answer: "`deploy=true` envoie les manifestes au cluster du `kubeconfig` courant. Pousser l'image ne déploie rien."
  - key: trous-construire-l-image
    format: fill-in
    question: |-
      Complète pour construire l'image pendant le build :
      ```bash
      ./mvnw package -Dquarkus.container-image.___=true
      ```
    blanks:
      - [build]
    answer: "`quarkus.container-image.build=true` ; `push=true` la pousse en plus."
  - key: trous-repliques
    format: fill-in
    question: |-
      Complète pour que le `Deployment` généré demande trois pods :
      ```properties
      quarkus.kubernetes.___=3
      ```
    blanks:
      - [replicas]
    answer: "`quarkus.kubernetes.replicas` fixe le nombre de répliques du `Deployment`."
  - key: trous-etiquette
    format: fill-in
    question: |-
      Complète pour étiqueter l'image `1.4.0` :
      ```properties
      quarkus.container-image.___=1.4.0
      ```
    blanks:
      - [tag]
    answer: "`quarkus.container-image.tag` ; sans lui, l'étiquette est la version du projet."
  - key: trous-limite-memoire
    format: fill-in
    question: |-
      Complète pour limiter la mémoire du conteneur à 256 Mi :
      ```properties
      quarkus.kubernetes.resources.___.memory=256Mi
      ```
    blanks:
      - [limits]
    answer: "`resources.limits.memory` fixe la limite ; `resources.requests.memory`, ce que le pod réserve."
  - key: situation-latest
    format: scenario
    question: |-
      Ton équipe pousse toujours l'image avec l'étiquette `latest`. Après un retour arrière raté, personne ne sait
      quelle version tourne. Que proposes-tu ?
    choices:
      - {text: "Une étiquette immuable par version, comme la version du projet", correct: true}
      - {text: "Garder `latest`, et redémarrer les pods après chaque poussée", correct: false}
      - {text: "Pousser deux fois `latest`, pour être sûr que l'image arrive", correct: false}
      - {text: "Supprimer l'étiquette, pour que Kubernetes choisisse l'image", correct: false}
    answer: |-
      Une étiquette par version dit exactement ce qui tourne, et un retour arrière revient à une étiquette connue.
      C'est le comportement par défaut de Quarkus, qui prend la version du projet.
  - key: situation-yaml-a-la-main
    format: scenario
    question: |-
      L'équipe maintient à la main trois fichiers YAML Kubernetes par service, souvent désynchronisés du code (port,
      sondes, variables). Que proposes-tu ?
    choices:
      - {text: "Générer les manifestes avec `quarkus-kubernetes`, réglés dans la configuration", correct: true}
      - {text: "Copier les YAML dans chaque dépôt, et les relire à chaque version", correct: false}
      - {text: "Écrire les manifestes dans le code Java, avec le client Kubernetes", correct: false}
      - {text: "Abandonner les sondes de santé, source de la plupart des écarts", correct: false}
    answer: |-
      Les manifestes générés suivent l'application : port, image et sondes viennent de sa configuration. Ce que la
      configuration ne couvre pas va dans `src/main/kubernetes/`, fusionné au build.
  - key: situation-memoire-natif
    format: scenario
    question: |-
      Ton service passe en natif. Les pods gardent les limites mémoire de la version JVM, bien plus larges que
      nécessaire. Que fais-tu ?
    choices:
      - {text: "Je mesure la mémoire réelle en charge, puis j'ajuste requests et limits", correct: true}
      - {text: "Je divise les limites par dix, puisque le natif consomme toujours moins", correct: false}
      - {text: "Je supprime les limites : un exécutable natif ne peut pas déborder", correct: false}
      - {text: "Je garde les limites de la JVM, qui ne coûtent rien de plus au cluster", correct: false}
    answer: |-
      Le natif consomme moins, mais combien dépend de la charge. Des `requests` trop larges réservent des ressources
      que le cluster ne peut plus donner à d'autres ; trop justes, le pod est tué. On mesure, puis on règle.
  - key: situation-image-native
    format: scenario
    question: |-
      Tu veux livrer l'exécutable natif dans une image Linux, construite en CI. L'agent a Docker, mais pas GraalVM.
      Comment t'y prends-tu ?
    choices:
      - {text: "`-Dnative`, la compilation en conteneur et `quarkus.container-image.build=true`", correct: true}
      - {text: "Je compile en natif sur mon Mac, puis je copie l'exécutable dans l'image", correct: false}
      - {text: "Je mets un uber-jar dans l'image, que la JVM compilera en natif au démarrage", correct: false}
      - {text: "Je construis une image JVM étiquetée `native`, optimisée par Kubernetes", correct: false}
    answer: |-
      `quarkus.native.container-build=true` compile un exécutable Linux dans l'image Mandrel, sans GraalVM sur
      l'agent ; l'extension d'image l'emballe ensuite. Un exécutable compilé sur macOS ne tourne pas dans une image
      Linux, et aucune JVM ne se compile en natif au démarrage.
