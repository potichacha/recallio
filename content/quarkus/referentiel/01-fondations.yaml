# Référentiel Quarkus (ADR 0025, 0026, 0061) : l'inventaire de toutes les notions.
# Le sujet vise Quarkus 3, sur Java 25. Pas de « qu'affiche ce code ? » : la CI les exécute avec JShell, sans Quarkus.
# Pas de Tour : le Tour est réservé aux langages. Les exercices se jugent dans le bac à sable Java, qui embarque un
# projet Quarkus (ADR 0061).
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats.
domain: fondations
title: Les fondations de Quarkus
position: 10
chapters:
  - id: philosophie
    title: Pourquoi Quarkus
    notions:
      - {id: quarkus-presentation, title: "Ce qu'est Quarkus : un framework Java pensé pour les conteneurs", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: build-time, title: "Le build time : ce que Quarkus fait à la compilation plutôt qu'au démarrage", level: beginner, priority: 1, requires: [quarkus-presentation], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: extensions, title: "Les extensions : une partie deployment au build, une partie runtime", level: beginner, priority: 1, requires: [build-time], formats: [course, true-false, multiple-choice, fill-in, scenario, definition], complete: true}
      - {id: standards, title: "Les standards : Jakarta EE, MicroProfile, et ce que Quarkus en prend", level: beginner, priority: 2, requires: [quarkus-presentation], formats: [course, true-false, multiple-choice, definition], complete: true}
      - {id: vertx, title: "Vert.x sous Quarkus : la boucle d'événements et les threads", level: intermediate, priority: 1, requires: [quarkus-presentation], formats: [course, true-false, multiple-choice, definition], complete: true}
      - {id: quarkus-vs-spring, title: "Quarkus ou Spring Boot : comparer et choisir", level: intermediate, priority: 1, requires: [build-time], formats: [course, true-false, multiple-choice, scenario], complete: true}
  - id: outillage
    title: L'outillage du développeur
    notions:
      - {id: creer-projet, title: "Créer un projet : code.quarkus.io, la CLI quarkus, le plugin Maven", level: beginner, priority: 1, requires: [extensions], formats: [course, true-false, multiple-choice, fill-in], complete: true}
      - {id: mode-dev, title: "Le mode dev : quarkus dev et le rechargement à chaud", level: beginner, priority: 1, requires: [creer-projet], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: dev-services, title: "Les Dev Services : une base, un Kafka, un Keycloak démarrés pour toi", level: beginner, priority: 1, requires: [mode-dev], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: dev-ui, title: "La Dev UI : configuration, beans et endpoints sous /q/dev-ui", level: beginner, priority: 2, requires: [mode-dev], formats: [course, true-false, multiple-choice], complete: true}
      - {id: test-continu, title: "Le test continu : les tests relancés à chaque modification", level: intermediate, priority: 3, requires: [mode-dev], formats: [course, true-false, multiple-choice, scenario], complete: true}
