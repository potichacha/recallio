# Référentiel Quarkus : les API REST avec Quarkus REST, et le modèle d'exécution.
domain: rest
title: Les API REST
position: 40
chapters:
  - id: ressources
    title: Ressources REST
    notions:
      - {id: quarkus-rest, title: "Quarkus REST et Jakarta REST : @Path, @GET, @POST", level: beginner, priority: 1, requires: [injection], formats: [course, true-false, multiple-choice, fill-in, bug-fix, exercise], complete: true}
      - {id: parametres, title: "@PathParam, @QueryParam, @HeaderParam, et @RestPath, @RestQuery", level: beginner, priority: 1, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: json, title: "Le JSON avec Jackson : quarkus-rest-jackson, records, ObjectMapperCustomizer", level: beginner, priority: 1, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: reponses, title: "Le statut et les en-têtes de la réponse : Response, RestResponse", level: beginner, priority: 1, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: validation, title: "La validation : Hibernate Validator, @Valid et la réponse 400", level: beginner, priority: 1, requires: [json], formats: [course, true-false, multiple-choice, fill-in, bug-fix, exercise], complete: true}
      - {id: erreurs, title: "Traduire les exceptions : ExceptionMapper et @ServerExceptionMapper", level: intermediate, priority: 1, requires: [reponses], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario, exercise], complete: true}
      - {id: openapi, title: "OpenAPI et Swagger UI avec SmallRye OpenAPI", level: intermediate, priority: 2, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: filtres, title: "Les filtres : @ServerRequestFilter et @ServerResponseFilter", level: intermediate, priority: 3, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in], complete: true}
      - {id: cors, title: "CORS : autoriser un front servi depuis une autre origine", level: intermediate, priority: 3, requires: [quarkus-rest], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
  - id: clients
    title: Appeler une API
    notions:
      - {id: rest-client, title: "Le REST Client : @RegisterRestClient, configKey et l'URL en configuration", level: intermediate, priority: 1, requires: [quarkus-rest, application-properties], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
