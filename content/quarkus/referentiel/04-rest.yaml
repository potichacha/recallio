      - {id: blocking, title: "@Blocking et @NonBlocking : choisir le thread", level: intermediate, priority: 1, requires: [event-loop-worker], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: run-on-virtual-thread, title: "@RunOnVirtualThread : un endpoint sur un thread virtuel", level: intermediate, priority: 2, requires: [blocking], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
