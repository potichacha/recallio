statement: |-
  La caisse de la boutique additionne les prix du catalogue, puis applique la remise de fidélité, réglée par la
  propriété `boutique.remise-fidelite` (10 % par défaut). Deux problèmes sont remontés :

  - les clients fidèles ne reçoivent jamais leur remise ;
  - le test qui remplace le catalogue par une doublure (`@InjectMock`) échoue : la caisse ne demande jamais ses prix
    à la doublure.

  Les beans `Catalogue` et `Remises` sont prêts, et ne doivent pas changer. Corrige `Caisse` pour qu'elle **reçoive**
  ses deux dépendances du conteneur, de préférence par son constructeur, au lieu de les fabriquer elle-même.
explanation: |-
  `new Remises()` crée un objet ordinaire, que le conteneur ne connaît pas : il n'injecte rien dans ses champs, et
  `pourcentage` garde la valeur par défaut d'un `int`, 0. Aucune remise n'est donc appliquée. De même,
  `new Catalogue()` contourne le bean : la doublure que `@InjectMock` installe derrière le proxy client n'est jamais
  appelée.

  Avec l'injection par constructeur, la caisse reçoit les beans du conteneur :

  ```java
  private final Catalogue catalogue;
  private final Remises remises;

  Caisse(Catalogue catalogue, Remises remises) {
      this.catalogue = catalogue;
      this.remises = remises;
  }
  ```

  Avec un seul constructeur, Quarkus n'exige pas `@Inject`. Les champs restent `final`, et un test unitaire peut
  construire `new Caisse(catalogue, remises)` sans démarrer Quarkus. L'injection par champ
  (`@Inject Catalogue catalogue;`, sans `private`) marcherait aussi, mais rend la classe plus difficile à construire
  hors du conteneur.
