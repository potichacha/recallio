statement: |-
  La banque doit tracer les opérations sur les comptes. Les méthodes de `Compte` qui modifient le solde sont déjà
  annotées `@Audite`, mais rien n'est écrit dans le `Journal`.

  Écris l'intercepteur d'audit. Pour chaque appel d'une méthode annotée `@Audite`, il ajoute une ligne au journal :

  - `deposer : ok` quand la méthode réussit (le nom de la méthode, puis `: ok`) ;
  - `retirer : échec` quand elle lève une exception, qui doit continuer de remonter jusqu'à l'appelant.

  La valeur renvoyée par la méthode doit arriver intacte à l'appelant, et les méthodes non annotées ne sont pas
  journalisées. Deux pièces manquent : l'annotation `@Audite` n'est pas encore une liaison d'intercepteur, et la
  classe `AuditInterceptor` n'est pas encore un intercepteur. Ne change ni `Compte`, ni `Journal`.
explanation: |-
  L'annotation devient une liaison avec `@InterceptorBinding`. La classe devient un intercepteur avec trois
  annotations : la liaison qu'elle sert (`@Audite`), `@Interceptor`, et `@Priority`, qui l'active et fixe son rang
  parmi les autres intercepteurs. Sa méthode reçoit `@AroundInvoke` :

  ```java
  @AroundInvoke
  Object auditer(InvocationContext contexte) throws Exception {
      String methode = contexte.getMethod().getName();
      try {
          Object resultat = contexte.proceed();
          journal.ecrire(methode + " : ok");
          return resultat;
      } catch (Exception e) {
          journal.ecrire(methode + " : échec");
          throw e;
      }
  }
  ```

  `contexte.proceed()` appelle la méthode interceptée (ou l'intercepteur suivant) : l'oublier, c'est ne plus exécuter
  la méthode. Renvoyer son résultat, c'est le rendre à l'appelant ; renvoyer `null` le perdrait. L'exception est
  journalisée puis relancée, pour que l'appelant la voie comme sans intercepteur.

  ArC applique l'intercepteur au build, en générant une sous-classe de `Compte`. Une liaison posée sur une méthode
  privée ferait échouer le build ; et une annotation sans `@InterceptorBinding` donnerait « Interceptor has no
  bindings ».
