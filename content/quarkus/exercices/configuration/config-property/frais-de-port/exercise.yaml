statement: |-
  La boutique veut régler ses frais de port sans recompiler. Aujourd'hui, `FraisDePort` les écrit en dur.

  Lis ces trois valeurs dans la configuration, avec `@ConfigProperty` :

  | Propriété | Rôle | Si elle manque |
  |---|---|---|
  | `boutique.livraison.seuil-gratuit` | le montant à partir duquel la livraison est offerte | 50 |
  | `boutique.livraison.forfait` | les frais en dessous du seuil | 5 |
  | `boutique.livraison.pays` | les pays livrés, séparés par des virgules (`FR,BE`) | le démarrage échoue |

  `calculer(montant)` renvoie 0 dès que le montant atteint le seuil, le forfait sinon ; `livrable(pays)` dit si le
  pays fait partie de la liste.

  Les tests surchargent la configuration par un `@TestProfile` : un seuil à 30, les pays `FR,BE`, et aucun forfait,
  pour vérifier ta valeur par défaut. Ne change pas la signature des méthodes.
explanation: |-
  Chaque champ reçoit son `@ConfigProperty`, avec `defaultValue` pour le seuil et le forfait. La valeur par défaut
  est une chaîne, convertie en `int` comme une valeur lue dans le fichier.

  ```java
  @ConfigProperty(name = "boutique.livraison.seuil-gratuit", defaultValue = "50")
  int seuilGratuit;

  @ConfigProperty(name = "boutique.livraison.forfait", defaultValue = "5")
  int forfait;

  @ConfigProperty(name = "boutique.livraison.pays")
  List<String> paysLivres;
  ```

  La liste des pays n'a pas de valeur par défaut : si elle manque, Quarkus refuse de démarrer (« SRCFG00014 ... is
  required »), ce qui vaut mieux qu'une boutique qui ne livre personne sans le dire. Les virgules séparent les
  éléments de la `List`.

  Les champs sont package-private : Quarkus les remplit sans réflexion. `@Inject` n'est pas nécessaire devant
  `@ConfigProperty`, qui est un qualificateur. Le `@TestProfile` des tests montre comment donner une autre
  configuration à une classe de test : `getConfigOverrides()` renvoie les propriétés à surcharger.
