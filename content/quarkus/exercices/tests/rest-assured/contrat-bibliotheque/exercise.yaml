statement: |-
  L'API des livres de la bibliothèque a ses tests, écrits avec RestAssured : ils décrivent son contrat, statut par
  statut et champ par champ. Plusieurs échouent. Lis-les, puis corrige `LivreResource` pour qu'ils passent :

  - `POST /livres` crée un livre et répond **201 Created**, avec l'adresse du livre dans l'en-tête `Location` et le
    livre créé dans le corps ;
  - `POST /livres` refuse une saisie invalide (titre ou auteur vides, année avant 1450) par un **400** : les
    contraintes sont déjà écrites sur `NouveauLivre` ;
  - `GET /livres/{id}` répond **404** pour un livre qui n'existe pas.

  Ne change ni `Livre`, ni `NouveauLivre`.
explanation: |-
  Trois corrections, une par partie du contrat.

  **La création.** Une méthode qui renvoie l'entité répond 200. Pour un 201 avec son adresse, on renvoie une
  `Response` : `Response.created(URI.create("/livres/" + livre.id)).entity(livre).build()`. Quarkus complète l'URI
  relative avec l'adresse du serveur ; le test vérifie seulement sa fin, avec `endsWith`.

  **La validation.** Les contraintes de `NouveauLivre` ne s'appliquent que si le paramètre est annoté `@Valid`.
  Quarkus répond alors 400, avec la liste des `violations` : le test lit leurs champs avec
  `body("violations.field", hasItem(containsString("titre")))`.

  **Le livre inconnu.** `Livre.findById` renvoie `null`, et une méthode qui renvoie `null` répond **204 No
  Content**, pas 404. On lève `NotFoundException`, que Quarkus REST traduit en 404.

  Côté tests, remarque les outils de RestAssured : `extract().path("id")` garde l'identifiant pour la requête
  suivante, `get("/livres/{id}", id)` remplit le chemin, et `hasItems` vérifie une liste sans dépendre des autres
  livres créés par les autres tests.
