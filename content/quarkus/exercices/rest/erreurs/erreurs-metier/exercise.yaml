statement: |-
  `POST /commandes` retire du stock la quantité commandée. Quand le produit n'existe pas, ou que le stock manque,
  `Stock` lève une exception métier... et le client reçoit une 500.

  Complète `GestionnaireErreurs` pour traduire ces exceptions, dans toute l'application, en réponses utiles :

  | Exception | Statut | Corps |
  |---|---|---|
  | `ProduitIntrouvableException` | 404 | `{"code": "PRODUIT_INTROUVABLE", "message": ...}` |
  | `StockInsuffisantException` | 409 | `{"code": "STOCK_INSUFFISANT", "message": ...}` |

  Le message est celui de l'exception. Le corps est le record `Erreur`, déjà écrit. Un chemin inconnu doit toujours
  répondre 404. Ne modifie ni `Stock`, ni `CommandeResource`, ni les exceptions : le service ne sait rien de HTTP.
explanation: |-
  Une méthode `@ServerExceptionMapper` par exception, dans une classe qui n'est pas une ressource : elle vaut pour
  toute l'application.

  ```java
  public class GestionnaireErreurs {

      @ServerExceptionMapper
      public RestResponse<Erreur> produitIntrouvable(ProduitIntrouvableException e) {
          return RestResponse.status(Response.Status.NOT_FOUND, new Erreur("PRODUIT_INTROUVABLE", e.getMessage()));
      }

      @ServerExceptionMapper
      public RestResponse<Erreur> stockInsuffisant(StockInsuffisantException e) {
          return RestResponse.status(Response.Status.CONFLICT, new Erreur("STOCK_INSUFFISANT", e.getMessage()));
      }
  }
  ```

  Le type du paramètre dit quelle exception la méthode traite ; le `RestResponse` donne le statut et le corps, écrit
  en JSON. Placées dans `CommandeResource`, les mêmes méthodes ne vaudraient que pour elle.

  Un `ExceptionMapper<ProduitIntrouvableException>` de Jakarta REST marcherait aussi, à condition de porter
  `@Provider`. En revanche, un seul mapper sur `Exception` attraperait aussi les 404 de Quarkus REST : c'est ce que
  vérifie le test du chemin inconnu.
