statement: |-
  `POST /produits` enregistre n'importe quoi : un nom vide, un prix négatif, une référence fantaisiste. Et
  `GET /produits?taille=...` accepte toutes les tailles de page.

  Ajoute la validation, pour que ces requêtes répondent **400** avant d'atteindre le `Catalogue` :

  - `nom` : obligatoire, pas vide ni fait d'espaces, 50 caractères au plus ;
  - `prix` : strictement positif ;
  - `reference` : obligatoire, au format `ABC-123` (trois majuscules, un tiret, trois chiffres) ;
  - une requête **sans corps** ;
  - `taille` : entre 1 et 100, 20 par défaut.

  Un produit valide répond toujours 201. Ne modifie pas le `Catalogue`.
explanation: |-
  Les contraintes de Bean Validation se posent sur les composants du record :

  ```java
  public record NouveauProduit(
          @NotBlank @Size(max = 50) String nom,
          @Positive int prix,
          @NotNull @Pattern(regexp = "[A-Z]{3}-\\d{3}") String reference) {}
  ```

  `@Pattern` accepte `null` : `@NotNull` rend la référence obligatoire. `@NotBlank` refuse `null`, le vide et les
  espaces.

  Les contraintes ne sont vérifiées que si le paramètre porte `@Valid`. Et `@Valid` seul laisse passer un corps
  absent, qui arrive en `null` : `@NotNull` le refuse.

  ```java
  public Produit creer(@NotNull @Valid NouveauProduit nouveau)
  ```

  Un paramètre simple se contraint directement, sans `@Valid` :
  `@RestQuery @DefaultValue("20") @Min(1) @Max(100) int taille`.

  Une entrée invalide répond 400, avec la liste des violations : chaque champ y est désigné par son chemin, comme
  `creer.nouveau.nom`.
