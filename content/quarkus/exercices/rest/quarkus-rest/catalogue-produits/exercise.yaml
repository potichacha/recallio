statement: |-
  `ProduitResource` expose le catalogue, mais le front se plaint de ses réponses. Corrige-la pour qu'elle respecte
  ce contrat :

  | Requête | Réponse attendue |
  |---|---|
  | `GET /produits` | 200, la liste en JSON |
  | `GET /produits/{id}` | 200 et le produit ; **404** s'il n'existe pas (aujourd'hui : 204) |
  | `POST /produits` | **201**, le produit créé, et l'en-tête **`Location`** vers `/produits/{id}` (aujourd'hui : 200) |
  | `DELETE /produits/{id}` | **204** ; 404 si le produit n'existe pas (aujourd'hui : la méthode manque) |

  Le `Catalogue`, un bean en mémoire, est déjà écrit : ne le modifie pas.
explanation: |-
  Trois corrections, une par écart au contrat.

  **Le 404.** Une méthode qui renvoie `null` répond 204 : pas d'entité. `orElseThrow(NotFoundException::new)` lève
  une exception de Jakarta REST qui porte déjà son statut, 404.

  **Le 201 et `Location`.** Un objet renvoyé donne 200, quel que soit le verbe. `Response.created(uri)` fixe le 201
  et l'en-tête `Location` ; l'URI relative est résolue par rapport à l'adresse de l'application.

  ```java
  @POST
  public Response creer(NouveauProduit nouveau) {
      Produit cree = catalogue.ajouter(nouveau);
      return Response.created(URI.create("/produits/" + cree.id())).entity(cree).build();
  }
  ```

  `RestResponse.ResponseBuilder.<Produit>created(...)` ferait de même, en gardant le type du corps.

  **Le `DELETE`.** Une méthode `void` répond 204 quand elle se termine sans erreur ; un produit absent lève
  `NotFoundException`. Son `@Path("/{id}")` s'ajoute à celui de la classe.
