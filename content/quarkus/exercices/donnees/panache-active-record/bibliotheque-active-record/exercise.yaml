statement: |-
  La bibliothèque range ses livres dans une entité Panache, `Livre`, en active record. Ses méthodes sont restées
  vides : écris-les, dans l'entité elle-même.

  - `parAuteur(auteur)` : les livres de cet auteur, **triés par titre** ;
  - `parTitre(titre)` : le livre de ce titre, dans un `Optional`, vide si aucun livre ne porte ce titre ;
  - `nombreDisponibles()` : le nombre de livres disponibles, compté par la base ;
  - `emprunter()` : rend le livre indisponible ; s'il l'est déjà, lève `LivreIndisponibleException`.

  `LivreResource` est déjà écrite : `POST /livres/{id}/emprunt` répond 204, ou 409 quand le livre est déjà emprunté.
  Ne la modifie pas. Utilise les méthodes héritées de `PanacheEntity` (`list`, `find`, `count`...), sans
  `EntityManager`.
explanation: |-
  ```java
  public static List<Livre> parAuteur(String auteur) {
      return list("auteur", Sort.by("titre"), auteur);
  }

  public static Optional<Livre> parTitre(String titre) {
      return find("titre", titre).firstResultOptional();
  }

  public static long nombreDisponibles() {
      return count("disponible", true);
  }
  ```

  `list("auteur", ...)` est une requête simplifiée : Panache la complète en `from Livre where auteur = ?1`, et
  `Sort.by("titre")` ajoute le tri, fait par la base. `firstResultOptional()` évite le `null` ; `count(...)` envoie un
  `select count(*)` au lieu de charger les livres pour les compter.

  `emprunter()` ne fait que changer un champ : `LivreResource` l'appelle dans une méthode `@Transactional`, où le
  livre chargé est suivi par Hibernate. La modification est écrite au commit, sans `persist()`. Une exception non
  vérifiée annule la transaction ; ici, la ressource la rattrape pour répondre 409.
