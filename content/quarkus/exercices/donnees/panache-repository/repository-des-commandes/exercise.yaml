statement: |-
  Les commandes sont des entités JPA ordinaires, servies par un repository Panache, `CommandeRepository`. Le service
  d'expédition s'appuie dessus. Complète les deux classes :

  - dans `CommandeRepository` :
    - `duClient(client)` : les commandes de ce client, **triées par identifiant** ;
    - `nombreEnAttente()` : le nombre de commandes au statut `EN_ATTENTE`, compté par la base ;
  - dans `ExpeditionService`, `expedier(id)` : passe la commande au statut `EXPEDIEE` ; si aucune commande n'a cet
    identifiant, lève `CommandeIntrouvableException`.

  Le service reçoit le repository par son constructeur : garde-le ainsi. Les tests du service remplacent le
  repository par un mock (`@InjectMock`) : passe par ses méthodes, sans requête écrite à la main. Ne change pas
  l'entité `Commande`.
explanation: |-
  ```java
  public List<Commande> duClient(String client) {
      return list("client", Sort.by("id"), client);
  }

  public long nombreEnAttente() {
      return count("statut", Statut.EN_ATTENTE);
  }
  ```

  ```java
  @Transactional
  public void expedier(Long id) {
      Commande commande = commandes.findByIdOptional(id).orElseThrow(() -> new CommandeIntrouvableException(id));
      commande.statut = Statut.EXPEDIEE;
  }
  ```

  Le repository hérite de `PanacheRepository<Commande>` : `list`, `count`, `findByIdOptional` y sont des méthodes
  d'instance, et les requêtes métier s'y ajoutent. L'entité reste une simple entité JPA, qui ne sait rien de sa
  persistance.

  Le repository est un bean `@ApplicationScoped` : le service le reçoit par injection, et un test peut le remplacer
  par un mock Mockito avec `@InjectMock`, sans base de données. C'est le grand avantage de ce style sur l'active
  record, dont les méthodes statiques se remplacent mal.

  `expedier` est `@Transactional` : la commande chargée est suivie par Hibernate, et le nouveau statut est écrit au
  commit, sans appel à `persist`.
