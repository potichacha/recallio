statement: |-
  Le catalogue range ses articles dans une entité Panache, `Article`. Écris ses quatre requêtes, en méthodes
  statiques de l'entité, avec les requêtes de Panache (`list`, `find`, `count`), sans `EntityManager` :

  - `deCategorie(categorie)` : les articles de cette catégorie, **du moins cher au plus cher** ;
  - `entre(min, max)` : les articles dont le prix est compris entre `min` et `max` (bornes comprises), triés par
    prix puis par nom ; utilise des **paramètres nommés** ;
  - `nombreEnRupture()` : le nombre d'articles dont le stock est à zéro ;
  - `leMoinsCher(categorie)` : l'article le moins cher de la catégorie, dans un `Optional`, vide si la catégorie n'a
    aucun article.

  Le tri et le filtre se font dans la base : ne charge pas tous les articles pour les filtrer en Java.
explanation: |-
  ```java
  public static List<Article> deCategorie(String categorie) {
      return list("categorie", Sort.by("prix"), categorie);
  }

  public static List<Article> entre(int min, int max) {
      return list("prix >= :min and prix <= :max", Sort.by("prix").and("nom"),
              Parameters.with("min", min).and("max", max));
  }

  public static long nombreEnRupture() {
      return count("stock", 0);
  }

  public static Optional<Article> leMoinsCher(String categorie) {
      return find("categorie", Sort.by("prix"), categorie).firstResultOptional();
  }
  ```

  Un nom de champ seul (`"categorie"`) est une requête simplifiée : Panache la complète en `categorie = ?1`. Pour une
  condition plus riche, on écrit la clause `where` en HQL, ici avec des paramètres nommés que `Parameters.with(...)`
  remplit. Les valeurs ne sont jamais concaténées dans la requête : pas d'injection, et pas de guillemet qui casse
  la syntaxe.

  `Sort.by("prix").and("nom")` ajoute un `order by prix, nom`, exécuté par la base. Pour le moins cher, `find` renvoie
  une `PanacheQuery` triée, dont `firstResultOptional()` ne lit que le premier résultat.
