statement: |-
  Écris `Podium(scores map[string]int, n int) []string`, qui renvoie les noms des `n` meilleurs joueurs :

  - du plus grand score au plus petit ;
  - à score égal, par **ordre alphabétique** des noms ;
  - s'il y a moins de `n` joueurs, tous sont renvoyés ; si `n <= 0`, le résultat est vide ;
  - la map `scores` n'est pas modifiée.

  Par exemple, `{"ada": 30, "bob": 50, "eve": 30, "max": 10}` avec `n = 3` donne `[bob ada eve]`.
explanation: |-
  On ne peut pas trier une map : on rassemble d'abord ses clés dans une slice avec `slices.Collect(maps.Keys(scores))`.
  `slices.SortFunc` trie ensuite avec une fonction qui renvoie un **entier** : `cmp.Compare(scores[b], scores[a])`
  (arguments inversés pour l'ordre décroissant), puis, avec `cmp.Or`, `cmp.Compare(a, b)` pour départager les égalités
  par le nom. Sans ce second critère, l'ordre des ex aequo dépendrait de l'ordre aléatoire de la map. Enfin, on garde
  les `n` premiers avec `noms[:min(n, len(noms))]`, en traitant `n <= 0` à part.
