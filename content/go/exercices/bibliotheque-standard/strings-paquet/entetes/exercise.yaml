statement: |-
  Écris `Parser(texte string) (map[string]string, error)`, qui lit des en-têtes de la forme `Nom: valeur`, une par
  ligne :

  - le nom est mis en **minuscules** et les espaces autour du nom et de la valeur sont retirés :
    `"  Content-Type :  text/html "` donne `"content-type"` → `"text/html"` ;
  - la valeur peut elle-même contenir des `:` (`"Host: localhost:8080"`) : seul le **premier** sépare ;
  - les lignes **vides** (ou faites seulement d'espaces) sont ignorées, et les lignes peuvent finir par `\n` ou
    `\r\n` ;
  - une ligne sans `:`, ou dont le nom est vide, renvoie une erreur qui contient son **numéro** (à partir de 1), par
    exemple `ligne 3 : en-tête invalide "sans separateur"` ;
  - si un nom revient, la dernière valeur l'emporte.
explanation: |-
  `strings.Lines` (Go 1.24) parcourt les lignes sans créer de slice, et `strings.TrimSpace` retire à la fois les espaces
  et le `\r\n` final. `strings.Cut(ligne, ":")` sépare au **premier** `:` et dit si le séparateur était présent : c'est
  plus clair qu'un `Index` suivi de deux découpes, et `Split` couperait aussi la valeur `localhost:8080`. Le numéro de
  ligne se compte dans la boucle, même pour les lignes ignorées, et l'erreur l'inclut avec `fmt.Errorf` et `%q` pour
  montrer la ligne fautive entre guillemets. `strings.ToLower` normalise le nom.
