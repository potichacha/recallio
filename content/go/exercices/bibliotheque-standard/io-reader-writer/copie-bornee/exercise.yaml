statement: |-
  Un service reçoit des fichiers envoyés par ses utilisateurs et ne doit jamais en accepter plus qu'une taille donnée.
  Écris `Copier(dst io.Writer, src io.Reader, limite int64) (int64, error)` :

  - elle recopie `src` dans `dst` et renvoie le nombre d'octets écrits ;
  - si `src` contient **plus** de `limite` octets, elle n'écrit que les `limite` premiers et renvoie l'erreur
    `ErrTropGros` (déjà déclarée) ;
  - une erreur de lecture ou d'écriture est renvoyée telle quelle ;
  - la copie se fait **en flux** : rien n'est chargé entièrement en mémoire, quelle que soit la taille de `src`.
explanation: |-
  On compose les outils du package `io` au lieu d'écrire une boucle de lecture : `io.LimitReader(src, limite)` ne laisse
  passer que `limite` octets, et `io.Copy` les recopie par morceaux, avec une mémoire constante. Reste à savoir si `src`
  avait **plus** à donner : on essaie de lire **un octet de plus** avec `io.CopyN(io.Discard, src, 1)`. S'il en obtient
  un, la source dépassait la limite. Une fonction qui accepte des `io.Reader` et des `io.Writer` se teste avec un
  `strings.Reader`, un `bytes.Buffer`, et de petits lecteurs piégés écrits dans le test (lecture
  octet par octet, erreur).
