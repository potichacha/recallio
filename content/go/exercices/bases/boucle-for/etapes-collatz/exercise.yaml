statement: |-
  La suite de Collatz part d'un entier `n` strictement positif : s'il est pair, on le divise par 2 ; sinon, on le
  remplace par `3*n + 1`. On répète jusqu'à atteindre 1.

  Écris `Etapes(n int) int`, qui renvoie le nombre d'étapes nécessaires pour atteindre 1 :

  - `Etapes(1)` renvoie `0` (on y est déjà) ;
  - `Etapes(6)` renvoie `8` (6, 3, 10, 5, 16, 8, 4, 2, 1) ;
  - pour `n` nul ou négatif, la suite n'est pas définie : la fonction renvoie `-1`.
explanation: |-
  Une boucle `for` avec une seule condition (`for n != 1`) joue le rôle d'un `while`. Le test de parité se fait avec
  le reste de la division : `n%2 == 0`. Le compteur `etapes` augmente à chaque tour. Le cas `n <= 0` est traité
  **avant** la boucle : sans lui, la boucle ne s'arrêterait jamais (0 reste 0, et un nombre négatif ne mène jamais à 1).
