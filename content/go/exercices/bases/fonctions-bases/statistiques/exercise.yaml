statement: |-
  Écris `Statistiques(notes []float64) (min, max, moyenne float64, err error)`, qui renvoie la plus petite note, la
  plus grande et la moyenne :

  - `Statistiques([]float64{12, 8, 16})` renvoie `8, 16, 12, nil` ;
  - sans note, la fonction renvoie des zéros et l'erreur `ErrAucuneNote`, déjà déclarée, que l'appelant teste avec
    `errors.Is`.

  Les fonctions natives `min` et `max` (Go 1.21) peuvent servir.
explanation: |-
  Go renvoie plusieurs valeurs : le résultat et l'erreur, en dernier. Le cas vide est traité d'abord, avec un retour
  anticipé qui renvoie l'erreur sentinelle ; c'est aussi ce qui évite une division par zéro. Les retours nommés
  documentent l'ordre des trois valeurs. On initialise `min` et `max` avec la première note, puis la boucle les met à
  jour ; la moyenne est la somme divisée par `float64(len(notes))`.
