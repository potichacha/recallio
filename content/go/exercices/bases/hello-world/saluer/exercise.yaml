statement: |-
  Écris `Saluer`, qui prépare la phrase d'accueil d'un programme :

  - `Saluer("Ada")` renvoie `"Bonjour, Ada !"` ;
  - les espaces autour du prénom sont ignorés : `Saluer("  Ada ")` renvoie aussi `"Bonjour, Ada !"` ;
  - sans prénom (une chaîne vide ou faite d'espaces), elle renvoie `"Bonjour !"`.

  Le package `strings` de la bibliothèque standard t'aidera.
explanation: |-
  `strings.TrimSpace` retire les espaces (et les tabulations, les retours à la ligne) au début et à la fin d'une chaîne.
  Une chaîne vide se teste par `prenom == ""` : en Go, une `string` n'est jamais `nil`, sa valeur zéro est la chaîne
  vide. La concaténation avec `+` construit ensuite la phrase ; `fmt.Sprintf("Bonjour, %s !", prenom)` conviendrait
  aussi.
