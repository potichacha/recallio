statement: |-
  Un service partenaire répond parfois très lentement, et sa bibliothèque cliente **ignore** parfois le contexte qu'on
  lui passe. Écris `Appeler(ctx context.Context, delai time.Duration, f func(context.Context) (int, error)) (int,
  error)`, qui borne l'appel :

  - `f` reçoit un contexte dérivé de `ctx`, qui expire au bout de `delai` ;
  - si `f` répond à temps, `Appeler` renvoie son résultat et son erreur ;
  - sinon, `Appeler` rend la main **dès l'échéance**, même si `f` continue de tourner, avec `0` et
    `context.DeadlineExceeded` ;
  - si `ctx` est annulé avant, `Appeler` rend la main avec `context.Canceled` ;
  - une fois `Appeler` terminé, le contexte reçu par `f` est annulé, et aucune goroutine ne reste bloquée pour
    toujours.
explanation: |-
  `context.WithTimeout(ctx, delai)` dérive un contexte qui expire tout seul et garde l'annulation du parent ; le
  `defer cancel()` l'annule dans tous les cas au retour, ce qui prévient `f` et libère le minuteur. Comme `f` peut
  ignorer son contexte, on l'appelle dans une **goroutine** et l'on attend, dans un `select`, soit son résultat, soit
  `ctx.Done()` ; dans ce cas `ctx.Err()` vaut `DeadlineExceeded` ou `Canceled` selon la raison. Le channel du résultat
  est **bufferisé de taille 1** : si l'on est parti avant la réponse, la goroutine peut quand même y déposer son
  résultat et se terminer, au lieu de rester bloquée sur un envoi que personne ne lira.
