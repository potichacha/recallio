statement: |-
  Écris `EstPalindrome(s string) bool`, qui dit si une phrase se lit de la même façon dans les deux sens, en ne gardant
  que les **lettres et les chiffres**, sans tenir compte de la casse :

  - `"Engage le jeu que je le gagne"` est un palindrome ;
  - `"Été"` aussi : ses lettres accentuées sont des runes, comparées comme telles ;
  - `"Ésope reste ici et se repose"` n'en est pas un (« É » et « e » sont deux lettres différentes) ;
  - la chaîne vide est un palindrome.
explanation: |-
  On parcourt la chaîne avec `range`, qui décode l'UTF-8 : chaque élément est une **rune**, et non un octet. On garde
  les runes pour lesquelles `unicode.IsLetter` ou `unicode.IsDigit` est vrai, mises en minuscules avec
  `unicode.ToLower`. On compare ensuite le slice de runes à lui-même lu à l'envers. Travailler sur les octets (`s[i]`)
  casserait les lettres accentuées, codées sur deux octets.
