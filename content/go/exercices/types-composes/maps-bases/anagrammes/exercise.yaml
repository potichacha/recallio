statement: |-
  Écris `Grouper(mots []string) [][]string`, qui regroupe les **anagrammes** (les mots formés des mêmes lettres) :

  - `["chien", "niche", "rat", "chine", "art", "go"]` donne `[[chien niche chine] [rat art] [go]]` ;
  - les groupes apparaissent dans l'ordre du premier mot de chaque groupe, et les mots d'un groupe dans leur ordre
    d'arrivée ;
  - la casse est ignorée pour comparer (« Niche » est une anagramme de « chien »), mais les mots sont renvoyés tels
    quels.
explanation: |-
  Deux anagrammes ont les mêmes lettres une fois triées : c'est la **clé** d'une `map[string]int` qui donne l'indice du
  groupe dans le résultat. On calcule la clé en convertissant le mot en minuscules puis en `[]rune`, qu'on trie avant de
  le reconvertir en chaîne. Le résultat est un slice de groupes, et non la map elle-même : l'ordre d'itération d'une map
  est aléatoire, alors que l'énoncé demande l'ordre d'arrivée.
