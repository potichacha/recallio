statement: |-
  Un panier contient des lignes : une référence de produit, un prix unitaire en centimes et une quantité. Complète le
  type `Panier` :

  - `Ajouter(ref string, prix, quantite int)` ajoute une ligne, ou augmente la quantité si la référence est déjà dans le
    panier (le prix reste celui de la première ligne) ;
  - `Total() int` renvoie le montant total en centimes ;
  - un `Panier` déclaré par `var p Panier` doit être utilisable tout de suite ;
  - `Lignes()` renvoie une copie des lignes : la modifier ne doit pas changer le panier.
explanation: |-
  Les lignes vivent dans un slice de structs. Pour augmenter une quantité, on modifie l'élément **par son indice**
  (`p.lignes[i].Quantite += quantite`) : la variable d'une boucle `range` serait une copie. Les méthodes qui modifient le
  panier ont un **receveur pointeur** (`*Panier`), sinon elles travailleraient sur une copie. La valeur zéro est
  utilisable parce qu'`append` accepte un slice nil. Enfin, `slices.Clone` dans `Lignes` protège l'état interne : sans
  copie, l'appelant partagerait le tableau du panier.
