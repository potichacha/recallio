statement: |-
  Un agenda stocke des créneaux sous forme d'intervalles `[debut, fin]` (en minutes). Écris
  `Fusionner(creneaux []Intervalle) []Intervalle`, qui fusionne les intervalles qui se chevauchent ou se touchent, et
  renvoie le résultat trié par début :

  - `[[1 3] [2 6] [8 10]]` donne `[[1 6] [8 10]]` ;
  - `[[1 4] [4 5]]` donne `[[1 5]]` (des intervalles qui se touchent fusionnent) ;
  - l'entrée peut être dans le désordre ; elle ne doit **pas** être modifiée ;
  - une entrée vide donne un résultat vide (de longueur 0).
explanation: |-
  On trie d'abord une **copie** de l'entrée (`slices.Clone` puis `slices.SortFunc` par début) : trier l'entrée elle-même
  modifierait le slice de l'appelant, qui partage le même tableau. On parcourt ensuite les intervalles triés : si le
  suivant commence avant (ou à) la fin du dernier intervalle gardé, on étend ce dernier avec `max` ; sinon on l'ajoute
  avec `append`. On modifie le dernier élément par son indice (`res[len(res)-1].Fin = ...`), car une variable de range
  serait une copie.
