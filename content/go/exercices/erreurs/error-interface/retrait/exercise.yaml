statement: |-
  Le type `Compte` gère un solde en centimes. Complète `Retirer(montant int) error`, qui renvoie :

  - `nil` en cas de succès, après avoir débité le compte ;
  - une `*ErrMontant` (déjà déclarée) si le montant est nul ou négatif ; l'appelant la récupère avec `errors.As` pour
    lire le montant refusé ;
  - une erreur qui **enveloppe** la sentinelle `ErrSoldeInsuffisant` si le solde ne suffit pas, avec un contexte qui
    donne le montant et le solde : `retrait de 500 (solde 300) : solde insuffisant`.

  Dans les deux cas d'erreur, le solde ne change pas.
explanation: |-
  L'erreur vient en **dernier** retour, `nil` en cas de succès, écrit explicitement : renvoyer une variable
  `*ErrMontant` restée nil donnerait une erreur non nil. Les cas d'erreur sont traités **d'abord**, par des retours
  anticipés, ce qui garde le débit sur le chemin heureux et garantit que le solde ne change pas en cas d'échec.
  `fmt.Errorf` avec `%w` ajoute le contexte tout en gardant la sentinelle testable par `errors.Is` ; `%v` aurait coupé
  la chaîne. Le type `*ErrMontant` porte une donnée, que l'appelant lit avec `errors.As`.
