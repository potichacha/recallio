statement: |-
  Écris `Traiter(taches []int, nWorkers int, f func(int) int) []int`, qui applique `f` à chaque tâche avec un **pool
  de workers** :

  - au plus `nWorkers` appels à `f` sont en cours au même moment, et les tests vérifient que ce nombre est atteint ;
  - le résultat de `f(taches[i])` est rangé à l'indice `i`, dans l'ordre des tâches ;
  - si `nWorkers` vaut moins de 1, on utilise un seul worker.
explanation: |-
  On lance **exactement `nWorkers` goroutines** qui lisent les indices des tâches sur un channel `jobs`, avec
  `for i := range jobs`. Le producteur envoie les indices puis **ferme** `jobs` : c'est ce qui fait sortir les workers de
  leur boucle ; sans `close`, `wg.Wait()` ne rendrait jamais la main. Chaque worker écrit à l'indice de la tâche reçue
  dans un slice préalloué, ce qui garde l'ordre sans verrou. Lancer une goroutine par tâche ne borne pas la concurrence ;
  un seul worker la supprime.
