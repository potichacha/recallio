statement: |-
  `f` est une fonction lente (un appel réseau, par exemple). Écris `Somme(valeurs []int, f func(int) int) int`, qui
  renvoie la somme des `f(v)` pour toutes les valeurs :

  - les appels à `f` se font **en parallèle**, une goroutine par valeur ;
  - la fonction ne rend la main qu'une fois **tous** les appels terminés ;
  - `Somme(nil, f)` renvoie `0` sans appeler `f`.

  Les tests vérifient que tous les appels sont bien en cours au même moment.
explanation: |-
  Chaque goroutine écrit le résultat de son appel à **son indice** dans un slice préalloué : aucune goroutine n'écrit au
  même endroit qu'une autre, donc pas besoin de verrou. Un `sync.WaitGroup` attend la fin de toutes les goroutines ;
  depuis Go 1.25, `wg.Go(func() { ... })` fait à la fois le `Add(1)`, le lancement et le `Done()`. Après `wg.Wait()`,
  les écritures des goroutines sont visibles, et l'on peut additionner sans risque. Additionner directement dans une
  variable partagée depuis les goroutines serait une course de données.
