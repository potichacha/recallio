statement: |-
  Écris deux fonctions d'aide pour les tests de ton équipe, qui reçoivent un `testing.TB` (l'interface commune à
  `*testing.T` et `*testing.B`) :

  - `Egal(t, obtenu, attendu)` signale un échec avec `t.Errorf` si les deux valeurs (de n'importe quel type
    comparable) diffèrent, avec le message exact `obtenu 3, attendu 4` (valeurs affichées avec `%v`), et **continue** ;
  - `SansErreur(t, err)` arrête le test avec `t.Fatalf` si `err` n'est pas nil, avec le message `erreur inattendue : `
    suivi de l'erreur ;
  - les deux appellent **`t.Helper()`**, pour que l'échec soit rapporté à la ligne du test qui les appelle ;
  - quand tout va bien, elles ne signalent rien.
explanation: |-
  Une fonction d'aide générique `Egal[T comparable](t testing.TB, obtenu, attendu T)` accepte tous les types
  comparables avec `!=`. Elle utilise `t.Errorf`, qui marque l'échec et laisse le test continuer, pour voir tous les
  écarts d'un coup ; `SansErreur` utilise `t.Fatalf`, car la suite d'un test n'a plus de sens après une erreur
  inattendue. `t.Helper()`, appelé en premier, retire la fonction d'aide de la pile rapportée : le message pointe vers
  la ligne du test. Accepter `testing.TB` plutôt que `*testing.T` permet de s'en servir aussi dans les benchmarks, et
  de les tester avec un faux, comme le font les tests de cet exercice.
