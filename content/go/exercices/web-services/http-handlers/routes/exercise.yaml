statement: |-
  Écris `Routes() http.Handler`, qui renvoie le routeur d'un petit service :

  - `GET /bonjour?nom=Ada` répond `200` avec le texte `Bonjour, Ada !` ; sans paramètre `nom`, `Bonjour, inconnu !` ;
  - `GET /mots/{mot}` répond `200` en JSON (`Content-Type: application/json`) :
    `{"mot":"été","longueur":3}`, où la longueur compte les **caractères**, pas les octets ;
  - `GET /sante` répond `204 No Content`, sans corps ;
  - une méthode non prévue sur ces chemins (`POST /bonjour`) répond `405`, et un chemin inconnu `404`.
explanation: |-
  Depuis Go 1.22, le `ServeMux` comprend les motifs avec méthode et variables : `mux.HandleFunc("GET /mots/{mot}", ...)`
  et `r.PathValue("mot")` dans le handler. Il répond lui-même `405` quand le chemin correspond mais pas la méthode, et
  `404` pour un chemin inconnu. Dans chaque handler, l'ordre compte : d'abord les **en-têtes**
  (`w.Header().Set("Content-Type", ...)`), puis le **statut** (`w.WriteHeader`, facultatif pour 200), puis le **corps**.
  `utf8.RuneCountInString` compte les caractères (`len` compterait 5 octets pour « été »). Le service se teste sans
  réseau avec `httptest.NewRecorder` et `httptest.NewRequest`.
