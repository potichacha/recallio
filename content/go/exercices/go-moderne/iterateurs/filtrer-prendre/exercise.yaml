statement: |-
  Écris deux fonctions qui transforment des itérateurs `iter.Seq[T]` :

  - `Filtrer(seq, garder)` renvoie la séquence des éléments de `seq` pour lesquels `garder` renvoie `true` ;
  - `Prendre(seq, n)` renvoie au plus les `n` premiers éléments de `seq` (aucun si `n <= 0`).

  Les deux fonctions sont **paresseuses** : elles ne demandent à `seq` que les éléments nécessaires. Elles doivent
  donc fonctionner sur une séquence **infinie** : `Prendre(Filtrer(naturels, pair), 3)` donne `2 4 6` et s'arrête.
  Elles respectent aussi l'arrêt de la boucle appelante (`break`).
explanation: |-
  Chaque fonction renvoie une **nouvelle fonction** `func(yield func(T) bool)`, qui parcourt `seq` avec `for v := range
  seq` et appelle `yield` pour les éléments qu'elle transmet. Quand `yield` renvoie `false` (la boucle appelante s'est
  arrêtée), on fait `return` : le `range` sur `seq` se termine, ce qui fait à son tour renvoyer `false` au `yield` de la
  source, et l'arrêt remonte toute la chaîne. `Prendre` compte les éléments transmis et sort de sa boucle dès qu'il en
  a donné `n`, sans demander l'élément suivant : c'est ce qui permet de s'arrêter sur une source infinie. Rien n'est
  stocké : aucune slice intermédiaire.
