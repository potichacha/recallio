statement: |-
  Le type `Duree` représente une durée en secondes. Écris ses méthodes :

  - `String() string` affiche la durée en heures, minutes et secondes : `Duree(3725)` donne `"1h02m05s"`,
    `Duree(65)` donne `"1m05s"` et `Duree(5)` donne `"5s"` (on n'affiche les heures et les minutes que si elles sont
    utiles) ; une durée négative est précédée d'un signe moins : `Duree(-65)` donne `"-1m05s"` ;
  - `Ajouter(autre Duree) Duree` renvoie la somme des deux durées, sans modifier le receveur.

  Grâce à `String`, `fmt.Println(d)` affichera directement la durée lisible.
explanation: |-
  On peut déclarer des méthodes sur tout type nommé du package, ici `type Duree int`. Un **receveur valeur** convient :
  une durée est une petite valeur immuable, et `Ajouter` renvoie une nouvelle `Duree` au lieu de modifier la sienne.
  `String` traite d'abord le signe, puis découpe avec `/` et `%` (3725 s = 1 h, 2 min, 5 s), et formate avec
  `fmt.Sprintf("%dh%02dm%02ds", ...)`. En implémentant `String() string`, le type satisfait `fmt.Stringer`, que `fmt`
  utilise automatiquement. Attention à ne pas appeler `fmt.Sprint(d)` dans `String` : ce serait une récursion infinie.
