statement: |-
  L'interface `Forme` demande `Aire()` et `Perimetre()`. `Rectangle` et `Cercle` l'implémentent déjà.

  1. Fais en sorte que `Triangle` (ses trois côtés `A`, `B`, `C`) l'implémente : le périmètre est la somme des côtés,
     et l'aire se calcule par la formule de Héron, avec `p` le demi-périmètre :
     `aire = √(p(p-A)(p-B)(p-C))`.
  2. Écris `PlusGrande(formes []Forme) (Forme, bool)`, qui renvoie la forme de plus grande aire, et `false` si la liste
     est vide.

  Aucune déclaration « implements » n'est nécessaire : il suffit d'avoir les bonnes méthodes.
explanation: |-
  En Go, un type implémente une interface **implicitement**, dès qu'il a toutes ses méthodes avec les bonnes signatures.
  `Triangle` reçoit donc `Aire() float64` et `Perimetre() float64` ; la ligne `var _ Forme = Triangle{}` vérifie la
  correspondance à la compilation. `PlusGrande` ne connaît que l'interface : elle appelle `Aire()` sur chaque forme, et
  l'appel va au type concret (rectangle, cercle ou triangle). La forme vide renvoie `nil, false` : la forme à deux
  valeurs évite de faire deviner à l'appelant qu'une interface nil signifie « rien ».
