statement: |-
  Une urne électronique reçoit des votes depuis de nombreuses goroutines en même temps (une par requête HTTP).
  Complète le type `Urne` :

  - `NouvelleUrne()` renvoie une urne vide ;
  - `Voter(candidat string)` ajoute une voix au candidat ;
  - `Voix(candidat string) int` renvoie ses voix (0 pour un candidat inconnu) ;
  - `Total() int` renvoie le nombre total de voix.

  Toutes les méthodes peuvent être appelées en même temps par plusieurs goroutines. Les tests font voter des centaines
  de goroutines à la fois : aucune voix ne doit se perdre.
explanation: |-
  La map est un **état partagé** : un `sync.Mutex` placé à côté d'elle protège **toutes** ses lectures et écritures,
  dans `Voix` et `Total` comme dans `Voter`. Sans lui, deux écritures simultanées font planter le programme
  (« concurrent map writes »). Chaque méthode fait `Lock()` puis `defer Unlock()`. Les méthodes ont un **récepteur
  pointeur** : avec un récepteur valeur, chaque appel verrouillerait une copie du mutex et ne protégerait rien.
  `NouvelleUrne` renvoie un pointeur pour la même raison. Le total peut se calculer en parcourant la map sous le verrou,
  ou être tenu à jour dans un champ protégé par le même verrou.
