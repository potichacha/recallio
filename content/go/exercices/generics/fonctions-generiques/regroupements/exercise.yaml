statement: |-
  Écris deux fonctions génériques du package `collections` :

  - `Grouper(xs []T, cle func(T) K) map[K][]T` range chaque élément sous sa clé, en gardant l'ordre d'arrivée dans
    chaque groupe : grouper `["ada", "bob", "alan"]` par première lettre donne `map[a:[ada alan] b:[bob]]` ;
  - `Unique(xs []T) []T` retire les doublons en gardant la première occurrence de chaque valeur, dans l'ordre :
    `[3 1 3 2 1]` donne `[3 1 2]`.

  Choisis pour chaque paramètre de type la contrainte la plus faible qui permet ton code : les éléments de `Grouper`
  peuvent être de n'importe quel type.
explanation: |-
  `Grouper[T any, K comparable]` : les éléments sont seulement rangés, `any` suffit ; mais la clé sert d'index de map,
  donc elle doit être `comparable`. `Unique[T comparable]` a besoin de `==`, via une map des valeurs déjà vues
  (`map[T]struct{}`). L'inférence déduit `T` et `K` des arguments : l'appelant écrit `Grouper(noms, premiereLettre)`
  sans crochets. Le code reste vérifié à la compilation pour chaque type, sans `any` ni assertions.
