notion: fonctions-variadiques
lesson: "Une fonction **variadique** accepte un nombre variable d'arguments du même type, avec `...` devant le type du\n**dernier** paramètre :\n\n```go\nfunc somme(nombres ...int) int {\n\ttotal := 0\n\tfor _, n := range nombres { // nombres est un []int\n\t\ttotal += n\n\t}\n\treturn total\n}\n\nsomme()           // 0 : nombres est un slice vide (nil)\nsomme(1, 2, 3)    // 6\nxs := []int{4, 5}\nsomme(xs...)      // 9 : on « étale » un slice\n```\n\n- Dans la fonction, le paramètre est un **slice** (`[]int`).\n- Un seul paramètre variadique, **en dernier** : `func log(niveau string, args ...any)`.\n- `xs...` passe le slice **lui-même**, sans copie : la fonction peut modifier ses éléments.\n- On ne peut pas mélanger : `somme(1, xs...)` ne compile pas.\n- `fmt.Println(a ...any)` et `append(s, xs...)` sont variadiques.\n\n**Piège classique** : passer un `[]string` à une fonction `...any`. `f(noms...)` ne compile pas (`[]string` n'est pas\n`[]any`) ; il faut construire un `[]any`.\n\n**En entretien** : « `...T` en dernier paramètre, reçu comme un `[]T` ; `xs...` étale un slice sans le copier ; un\n`[]string` ne s'étale pas dans un `...any`. »"
tour:
  - title: Les fonctions variadiques
    text: |-
      Le dernier paramètre d'une fonction peut être **variadique** : `func somme(nombres ...int)` accepte zéro, un ou
      plusieurs entiers. Dans la fonction, `nombres` est une slice `[]int`.

      Pour passer une slice existante à une fonction variadique, on l'**étale** avec `...` : `somme(notes...)`.
      `fmt.Println` et `append` sont variadiques.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func somme(nombres ...int) int {
          	total := 0
          	for _, n := range nombres {
          		total += n
          	}
          	return total
          }

          func main() {
          	fmt.Println(somme())
          	fmt.Println(somme(1, 2, 3))
          	notes := []int{12, 15, 20}
          	fmt.Println(somme(notes...))
          }
      output: |-
        0
        6
        47
cards:
  - key: type-interne
    format: course
    question: Quel est le type du paramètre `nombres ...int` à l'intérieur de la fonction ?
    choices:
      - {text: "Une slice `[]int`, nil quand on ne passe aucun argument", correct: true}
      - {text: "Un tableau `[n]int`, dont la taille dépend de l'appel", correct: false}
      - {text: "Un type à part, `...int`, qu'on ne parcourt qu'avec `range`", correct: false}
      - {text: "Une slice `[]int`, jamais nil : vide si l'on ne passe rien", correct: false}
    answer: "Une slice `[]int` ; sans argument, elle vaut nil (longueur 0). Elle s'utilise comme toute slice : `len`, indices, `range`."
  - key: etaler
    format: course
    question: Comment passer un slice existant à une fonction variadique ?
    choices:
      - {text: "En l'étalant avec `...` : `somme(xs...)`", correct: true}
      - {text: "En la passant telle quelle : `somme(xs)`", correct: false}
      - {text: "En la préfixant, comme en JavaScript : `somme(...xs)`", correct: false}
      - {text: "Avec une étoile, comme en Python : `somme(*xs)`", correct: false}
    answer: "En l'étalant avec `...` placé après : `somme(xs...)`. Passée telle quelle, une slice ne compile pas comme argument `int`."
  - key: pas-copie
    format: course
    question: "L'appel `f(xs...)` copie-t-il la slice ?"
    choices:
      - {text: "Non : la fonction reçoit la même slice, sur le même tableau", correct: true}
      - {text: "Oui : Go copie toujours les arguments variadiques dans une slice neuve", correct: false}
      - {text: "Oui, mais seulement si la fonction modifie l'un des éléments", correct: false}
      - {text: "Non, mais la fonction la reçoit en lecture seule", correct: false}
    answer: "Non : la fonction reçoit la même slice (même tableau) ; si elle modifie un élément, l'appelant le voit. Seul un appel avec des valeurs individuelles crée une slice neuve."
  - key: any
    format: course
    question: Pourquoi `fmt.Println(noms...)` ne compile-t-il pas avec `noms` de type `[]string` ?
    choices:
      - {text: "`Println` attend `...any`, et un `[]string` n'est pas un `[]any`", correct: true}
      - {text: "`Println` n'est pas variadique : il n'accepte qu'un seul argument", correct: false}
      - {text: "On ne peut étaler qu'une slice de nombres, pas une slice de chaînes", correct: false}
      - {text: "`...` ne s'applique qu'aux fonctions qu'on a soi-même déclarées", correct: false}
    answer: "`Println` attend `...any` : il faut un `[]any`, et un `[]string` n'en est pas un (Go ne convertit pas les slices) ; on convertit élément par élément."
  - key: vf-premier
    format: true-false
    question: Le paramètre variadique peut être le premier d'une fonction à plusieurs paramètres.
    truth: false
    answer: Il doit être le dernier.
  - key: vf-zero-argument
    format: true-false
    question: Une fonction `f(xs ...int)` peut être appelée sans argument.
    truth: true
    answer: '`xs` vaut alors nil, de longueur 0.'
  - key: vf-melange
    format: true-false
    question: '`somme(1, xs...)` compile.'
    truth: false
    answer: On passe soit des valeurs individuelles, soit un slice étalé, pas les deux.
  - key: vf-append
    format: true-false
    question: '`append` est une fonction variadique.'
    truth: true
    answer: '`append(s, a, b)` ou `append(s, autre...)`.'
  - key: qcm-signatures
    format: multiple-choice
    question: "Laquelle de ces signatures variadiques compile ?"
    choices:
      - {text: "`func log(niveau string, args ...any)`", correct: true}
      - {text: "`func f(xs ...int, s string)`", correct: false}
      - {text: "`func f(a ...int, b ...string)`", correct: false}
      - {text: "`func f(...xs int)`", correct: false}
    answer: "Un seul paramètre variadique, en dernier, avec `...` devant le type. `func max(premier int, autres ...int) int` compile aussi."
  - key: qcm-appels
    format: multiple-choice
    question: "Avec `func somme(xs ...int) int` et `ys := []int{1, 2}`, lesquels de ces appels compilent ?"
    choices:
      - text: '`somme(ys...)`'
        correct: true
      - text: '`somme()`'
        correct: true
      - text: '`somme(ys)`'
        correct: false
      - text: '`somme(0, ys...)`'
        correct: false
    answer: Un slice s'étale avec `...`, et seul.
  - key: qcm-modification
    format: multiple-choice
    question: Que voit l'appelant si la fonction fait `xs[0] = 99` après un appel `f(ys...)` ?
    choices:
      - text: '`ys[0]` vaut 99'
        correct: true
      - text: '`ys` est inchangé'
        correct: false
      - text: Le code ne compile pas
        correct: false
      - text: Une panique
        correct: false
    answer: Le slice est passé tel quel, sans copie.
  - key: qcm-any
    format: multiple-choice
    question: Comment passer `noms []string` à `fmt.Println` pour afficher chaque nom comme un argument ?
    choices:
      - {text: "Construire un `[]any` avec une boucle, puis `fmt.Println(args...)`", correct: true}
      - {text: "Étaler directement la slice de chaînes : `fmt.Println(noms...)`", correct: false}
      - {text: "Convertir la slice d'un coup : `fmt.Println([]any(noms)...)`", correct: false}
      - {text: "Faire une assertion de type : `fmt.Println(noms.([]any)...)`", correct: false}
    answer: Il n'y a pas de conversion directe entre `[]string` et `[]any`.
  - key: trous-variadique
    format: fill-in
    question: |-
      Complète la signature variadique :
      ```go
      func somme(nombres ___int) int { ... }
      ```
    blanks:
      - - '...'
    answer: '`...T` accepte zéro, une ou plusieurs valeurs.'
  - key: trous-etaler
    format: fill-in
    question: |-
      Complète pour passer le slice :
      ```go
      total := somme(notes___)
      ```
    blanks:
      - - '...'
    answer: '`...` étale le slice en arguments.'
  - key: trous-append
    format: fill-in
    question: |-
      Complète pour concaténer deux slices :
      ```go
      tous := append(a, b___)
      ```
    blanks:
      - - '...'
    answer: '`append` est variadique : on étale le second slice.'
  - key: trous-any
    format: fill-in
    question: |-
      Complète la signature d'une fonction de log qui transmet à `fmt.Printf` :
      ```go
      func logf(format string, args ...___) {
      	fmt.Printf(format, args...)
      }
      ```
    blanks:
      - - any
        - interface{}
    answer: '`...any` accepte des valeurs de tout type.'
  - key: code-somme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func somme(xs ...int) int {
      	t := 0
      	for _, x := range xs {
      		t += x
      	}
      	return t
      }

      ys := []int{4, 5}
      fmt.Println(somme(), somme(1, 2, 3), somme(ys...))
      ```
    choices:
      - {text: "`0 6 9`", correct: true}
      - {text: "`0 6 0`", correct: false}
      - {text: "`6 9`", correct: false}
      - {text: "Ça ne compile pas : `somme()` n'a pas d'argument", correct: false}
    answer: "`0 6 9` : zéro argument (une slice nil, somme 0), des valeurs, puis une slice étalée."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc somme(xs ...int) int {\n\tt := 0\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\nfunc main() {\n\tys := []int{4, 5}\n\tfmt.Println(somme(), somme(1, 2, 3), somme(ys...))\n}\n"
      output: 0 6 9
  - key: code-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func raz(xs ...int) {
      	xs[0] = 0
      }

      ys := []int{7, 8}
      raz(ys...)
      raz(5, 6)
      fmt.Println(ys)
      ```
    choices:
      - {text: "`[0 8]`", correct: true}
      - {text: "`[7 8]`", correct: false}
      - {text: "`[5 6]`", correct: false}
      - {text: "`[0 0]`", correct: false}
    answer: "`[0 8]` : la slice étalée est passée sans copie ; l'appel avec des valeurs crée une nouvelle slice, sans lien avec `ys`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc raz(xs ...int) {\n\txs[0] = 0\n}\n\nfunc main() {\n\tys := []int{7, 8}\n\traz(ys...)\n\traz(5, 6)\n\tfmt.Println(ys)\n}\n"
      output: '[0 8]'
  - key: code-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func compter(xs ...string) {
      	fmt.Println(len(xs), xs == nil)
      }

      compter()
      compter([]string{}...)
      ```
    choices:
      - text: |-
          ```
          0 true
          0 false
          ```
        correct: true
      - text: |-
          ```
          0 true
          0 true
          ```
        correct: false
      - text: |-
          ```
          0 false
          0 false
          ```
        correct: false
      - text: |-
          ```
          0 false
          0 true
          ```
        correct: false
    answer: "`0 true` puis `0 false` : sans argument, la slice est nil ; étaler une slice vide la passe telle quelle, non nil."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc compter(xs ...string) {\n\tfmt.Println(len(xs), xs == nil)\n}\n\nfunc main() {\n\tcompter()\n\tcompter([]string{}...)\n}\n"
      output: |-
        0 true
        0 false
  - key: code-any
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      noms := []string{"ada", "bob"}
      args := make([]any, len(noms))
      for i, n := range noms {
      	args[i] = n
      }
      fmt.Println(args...)
      ```
    choices:
      - {text: "`ada bob`", correct: true}
      - {text: "`[ada bob]`", correct: false}
      - {text: "`adabob`", correct: false}
      - {text: "Ça ne compile pas : `args` ne contient que des `any`", correct: false}
    answer: "`ada bob` : chaque élément devient un argument de `Println`, qui les sépare par une espace. Sans `...`, on verrait `[ada bob]`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnoms := []string{\"ada\", \"bob\"}\n\targs := make([]any, len(noms))\n\tfor i, n := range noms {\n\t\targs[i] = n\n\t}\n\tfmt.Println(args...)\n}\n"
      output: ada bob
  - key: bug-pas-etale
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use notes (variable of type []int) as int value in argument to somme ». Quelle correction est la bonne ?
      ```go
      total := somme(notes)
      ```
    choices:
      - {text: "`somme(notes...)` : étaler la slice en arguments", correct: true}
      - {text: "`somme(...notes)` : étaler avec `...` placé devant", correct: false}
      - {text: "`somme([]int(notes))` : convertir la slice en `[]int`", correct: false}
      - {text: "`somme(*notes)` : déréférencer la slice en arguments", correct: false}
    answer: |-
      ```go
      total := somme(notes...)
      ```
      Une slice passée à une fonction variadique doit être étalée, avec `...` placé après.
  - key: bug-any
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use champs (variable of type []string) as []any value ». Quelle correction est la bonne ?
      ```go
      log.Printf("%s %s %s", champs...)
      ```
    choices:
      - {text: "Construire un `[]any` élément par élément, puis l'étaler", correct: true}
      - {text: "Convertir d'un coup la slice : `[]any(champs)...`", correct: false}
      - {text: "Retirer `...` pour passer la slice en un seul argument", correct: false}
      - {text: "Remplacer `%s` par `%v`, qui accepte un `[]string`", correct: false}
    answer: |-
      ```go
      args := make([]any, len(champs))
      for i, c := range champs {
      	args[i] = c
      }
      log.Printf("%s %s %s", args...)
      ```
      Un `[]string` n'est pas un `[]any` : on construit la slice d'arguments (`strings.Join` est souvent plus simple). Sans `...`, la slice entière irait dans le premier `%s`.
  - key: bug-modification
    format: bug-fix
    question: |-
      Après l'appel, la slice de l'appelant est triée, ce qui casse l'affichage. Quelle correction est la bonne ?
      ```go
      func mediane(xs ...float64) float64 {
      	slices.Sort(xs)
      	return xs[len(xs)/2]
      }

      m := mediane(mesures...)
      ```
    choices:
      - {text: "Trier une copie, `slices.Clone(xs)`, et laisser `xs` intacte", correct: true}
      - {text: "Recevoir `xs []float64` plutôt que `...float64`, qui copie", correct: false}
      - {text: "Appeler `mediane(mesures)` sans `...`, pour passer une copie", correct: false}
      - {text: "Trier avec `sort.Float64s(xs)`, qui ne touche pas l'original", correct: false}
    answer: |-
      ```go
      func mediane(xs ...float64) float64 {
      	tri := slices.Clone(xs)
      	slices.Sort(tri)
      	return tri[len(tri)/2]
      }
      ```
      `mesures...` passe la slice elle-même : la fonction la triait sur place. On travaille sur une copie ; `sort.Float64s` trie aussi sur place.
  - key: bug-melange
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      total := somme(base, extras...)
      ```
    choices:
      - {text: "`somme(append([]int{base}, extras...)...)`, ou `base + somme(extras...)`", correct: true}
      - {text: "`somme(base, extras)`, en passant la slice sans l'étaler", correct: false}
      - {text: "`somme(base..., extras...)`, en étalant les deux arguments", correct: false}
      - {text: "`somme([base, extras...])`, en construisant la liste sur place", correct: false}
    answer: |-
      ```go
      total := somme(append([]int{base}, extras...)...)
      // ou : total := base + somme(extras...)
      ```
      On ne mélange pas valeurs individuelles et slice étalée : une slice étalée doit être le seul argument variadique.
