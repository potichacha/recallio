notion: fonctions-variadiques
lesson: "Une fonction **variadique** accepte un nombre variable d'arguments du même type, avec `...` devant le type du\n**dernier** paramètre :\n\n```go\nfunc somme(nombres ...int) int {\n\ttotal := 0\n\tfor _, n := range nombres { // nombres est un []int\n\t\ttotal += n\n\t}\n\treturn total\n}\n\nsomme()           // 0 : nombres est un slice vide (nil)\nsomme(1, 2, 3)    // 6\nxs := []int{4, 5}\nsomme(xs...)      // 9 : on « étale » un slice\n```\n\n- Dans la fonction, le paramètre est un **slice** (`[]int`).\n- Un seul paramètre variadique, **en dernier** : `func log(niveau string, args ...any)`.\n- `xs...` passe le slice **lui-même**, sans copie : la fonction peut modifier ses éléments.\n- On ne peut pas mélanger : `somme(1, xs...)` ne compile pas.\n- `fmt.Println(a ...any)` et `append(s, xs...)` sont variadiques.\n\n**Piège classique** : passer un `[]string` à une fonction `...any`. `f(noms...)` ne compile pas (`[]string` n'est pas\n`[]any`) ; il faut construire un `[]any`.\n\n**En entretien** : « `...T` en dernier paramètre, reçu comme un `[]T` ; `xs...` étale un slice sans le copier ; un\n`[]string` ne s'étale pas dans un `...any`. »"
cards:
  - key: type-interne
    format: course
    question: Quel est le type du paramètre `nombres ...int` à l'intérieur de la fonction ?
    answer: Un slice `[]int` ; sans argument, il vaut nil (longueur 0).
  - key: etaler
    format: course
    question: Comment passer un slice existant à une fonction variadique ?
    answer: 'En l''étalant avec `...` : `somme(xs...)`.'
  - key: pas-copie
    format: course
    question: '`f(xs...)` copie-t-il le slice ?'
    answer: 'Non : la fonction reçoit le même slice (même tableau) ; si elle modifie un élément, l''appelant le voit.'
  - key: any
    format: course
    question: Pourquoi `fmt.Println(noms...)` ne compile-t-il pas avec `noms` de type `[]string` ?
    answer: '`Println` attend `...any` : il faut un `[]any`, et un `[]string` n''en est pas un ; on convertit élément par élément.'
  - key: vf-premier
    format: true-false
    question: Le paramètre variadique peut être le premier d'une fonction à plusieurs paramètres.
    truth: false
    answer: Il doit être le dernier.
  - key: vf-zero-argument
    format: true-false
    question: Une fonction `f(xs ...int)` peut être appelée sans argument.
    truth: true
    answer: '`xs` vaut alors nil, de longueur 0.'
  - key: vf-melange
    format: true-false
    question: '`somme(1, xs...)` compile.'
    truth: false
    answer: On passe soit des valeurs individuelles, soit un slice étalé, pas les deux.
  - key: vf-append
    format: true-false
    question: '`append` est une fonction variadique.'
    truth: true
    answer: '`append(s, a, b)` ou `append(s, autre...)`.'
  - key: qcm-signatures
    format: multiple-choice
    question: Quelles signatures sont valides ?
    choices:
      - text: '`func log(niveau string, args ...any)`'
        correct: true
      - text: '`func max(premier int, autres ...int) int`'
        correct: true
      - text: '`func f(xs ...int, s string)`'
        correct: false
      - text: '`func f(a ...int, b ...string)`'
        correct: false
    answer: Un seul paramètre variadique, en dernier.
  - key: qcm-appels
    format: multiple-choice
    question: Avec `func somme(xs ...int) int` et `ys := []int{1, 2}`, quels appels compilent ?
    choices:
      - text: '`somme(ys...)`'
        correct: true
      - text: '`somme()`'
        correct: true
      - text: '`somme(ys)`'
        correct: false
      - text: '`somme(0, ys...)`'
        correct: false
    answer: Un slice s'étale avec `...`, et seul.
  - key: qcm-modification
    format: multiple-choice
    question: Que voit l'appelant si la fonction fait `xs[0] = 99` après un appel `f(ys...)` ?
    choices:
      - text: '`ys[0]` vaut 99'
        correct: true
      - text: '`ys` est inchangé'
        correct: false
      - text: Le code ne compile pas
        correct: false
      - text: Une panique
        correct: false
    answer: Le slice est passé tel quel, sans copie.
  - key: qcm-any
    format: multiple-choice
    question: Comment passer `noms []string` à `fmt.Println` pour afficher chaque nom comme un argument ?
    choices:
      - text: Construire un `[]any` avec une boucle, puis `fmt.Println(args...)`
        correct: true
      - text: '`fmt.Println(noms...)`'
        correct: false
      - text: '`fmt.Println([]any(noms)...)`'
        correct: false
      - text: '`fmt.Println(noms.(...any))`'
        correct: false
    answer: Il n'y a pas de conversion directe entre `[]string` et `[]any`.
  - key: trous-variadique
    format: fill-in
    question: |-
      Complétez la signature variadique :
      ```go
      func somme(nombres ___int) int { ... }
      ```
    blanks:
      - - '...'
    answer: '`...T` accepte zéro, une ou plusieurs valeurs.'
  - key: trous-etaler
    format: fill-in
    question: |-
      Complétez pour passer le slice :
      ```go
      total := somme(notes___)
      ```
    blanks:
      - - '...'
    answer: '`...` étale le slice en arguments.'
  - key: trous-append
    format: fill-in
    question: |-
      Complétez pour concaténer deux slices :
      ```go
      tous := append(a, b___)
      ```
    blanks:
      - - '...'
    answer: '`append` est variadique : on étale le second slice.'
  - key: trous-any
    format: fill-in
    question: "Complétez la signature d'une fonction de log qui transmet à `fmt.Printf` :\n```go\nfunc logf(format string, args ...___) {\n\tfmt.Printf(format, args...)\n}\n```"
    blanks:
      - - any
        - interface{}
    answer: '`...any` accepte des valeurs de tout type.'
  - key: code-somme
    format: code-output
    question: "```go\nfunc somme(xs ...int) int {\n\tt := 0\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\nys := []int{4, 5}\nfmt.Println(somme(), somme(1, 2, 3), somme(ys...))\n```"
    answer: '`0 6 9` : zéro argument, des valeurs, puis un slice étalé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc somme(xs ...int) int {\n\tt := 0\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\nfunc main() {\n\tys := []int{4, 5}\n\tfmt.Println(somme(), somme(1, 2, 3), somme(ys...))\n}\n"
      output: 0 6 9
  - key: code-partage
    format: code-output
    question: "```go\nfunc raz(xs ...int) {\n\txs[0] = 0\n}\n\nys := []int{7, 8}\nraz(ys...)\nraz(5, 6)\nfmt.Println(ys)\n```"
    answer: '`[0 8]` : le slice étalé est passé sans copie ; l''appel avec des valeurs crée un nouveau slice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc raz(xs ...int) {\n\txs[0] = 0\n}\n\nfunc main() {\n\tys := []int{7, 8}\n\traz(ys...)\n\traz(5, 6)\n\tfmt.Println(ys)\n}\n"
      output: '[0 8]'
  - key: code-nil
    format: code-output
    question: "```go\nfunc compter(xs ...string) {\n\tfmt.Println(len(xs), xs == nil)\n}\n\ncompter()\ncompter([]string{}...)\n```"
    answer: '`0 true` puis `0 false` : sans argument, le slice est nil ; étaler un slice vide le passe tel quel.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc compter(xs ...string) {\n\tfmt.Println(len(xs), xs == nil)\n}\n\nfunc main() {\n\tcompter()\n\tcompter([]string{}...)\n}\n"
      output: |-
        0 true
        0 false
  - key: code-any
    format: code-output
    question: "```go\nnoms := []string{\"ada\", \"bob\"}\nargs := make([]any, len(noms))\nfor i, n := range noms {\n\targs[i] = n\n}\nfmt.Println(args...)\n```"
    answer: '`ada bob` : chaque élément devient un argument de `Println`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnoms := []string{\"ada\", \"bob\"}\n\targs := make([]any, len(noms))\n\tfor i, n := range noms {\n\t\targs[i] = n\n\t}\n\tfmt.Println(args...)\n}\n"
      output: ada bob
  - key: bug-pas-etale
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use notes (variable of type []int) as int value in argument to somme » :
      ```go
      total := somme(notes)
      ```
    answer: |-
      ```go
      total := somme(notes...)
      ```
      Un slice passé à une fonction variadique doit être étalé.
  - key: bug-any
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use champs (variable of type []string) as []any value » :
      ```go
      log.Printf("%s %s %s", champs...)
      ```
    answer: "```go\nargs := make([]any, len(champs))\nfor i, c := range champs {\n\targs[i] = c\n}\nlog.Printf(\"%s %s %s\", args...)\n```\nUn `[]string` n'est pas un `[]any` : on construit le slice d'arguments. (`strings.Join` est souvent plus simple.)"
  - key: bug-modification
    format: bug-fix
    question: "Après l'appel, le slice de l'appelant est trié, ce qui casse l'affichage :\n```go\nfunc mediane(xs ...float64) float64 {\n\tslices.Sort(xs)\n\treturn xs[len(xs)/2]\n}\n\nm := mediane(mesures...)\n```"
    answer: "```go\nfunc mediane(xs ...float64) float64 {\n\ttri := slices.Clone(xs)\n\tslices.Sort(tri)\n\treturn tri[len(tri)/2]\n}\n```\n`mesures...` passe le slice lui-même : la fonction le triait sur place. On travaille sur une copie."
  - key: bug-melange
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```go
      total := somme(base, extras...)
      ```
    answer: |-
      ```go
      total := somme(append([]int{base}, extras...)...)
      // ou : total := base + somme(extras...)
      ```
      On ne mélange pas valeurs individuelles et slice étalé.
