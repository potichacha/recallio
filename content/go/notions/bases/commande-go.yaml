notion: commande-go
lesson: |-
  Toute la chaîne d'outils tient dans une commande, `go` :

  | Commande | Rôle |
  |---|---|
  | `go run .` | compiler dans un dossier temporaire et exécuter |
  | `go build` | compiler ; un package `main` donne un exécutable |
  | `go install chemin@version` | compiler et installer un outil dans `$GOPATH/bin` (ou `GOBIN`) |
  | `go test ./...` | lancer les tests de tous les packages |
  | `go vet ./...` | l'analyse statique de base |
  | `go fmt ./...` | formater (`gofmt -l -w`) |
  | `go mod init`, `go mod tidy`, `go get` | gérer le module et ses dépendances |
  | `go env` | les variables de la chaîne d'outils (`GOPATH`, `GOOS`, `GOCACHE`...) |
  | `go doc fmt.Println` | la documentation en ligne de commande |
  | `go list -m all` | les modules de la build |

  `./...` désigne le package courant et tous ses sous-packages. `go build` garde un **cache** de compilation
  (`go env GOCACHE`) : seul ce qui a changé est recompilé, d'où des builds incrémentaux très rapides.

  **Piège classique** : utiliser `go get` pour installer un outil. Depuis Go 1.17, `go get` modifie seulement les
  dépendances du module courant ; on installe un outil avec `go install outil@latest`.

  **En entretien** : « Une seule commande pour tout : build, run, test, vet, fmt, modules, doc ; avec un cache qui rend
  les builds incrémentaux, et `./...` pour viser tout le module. »
cards:
  - key: explique-passe-quand-executes-build
    format: scenario
    question: Explique ce qui se passe quand tu exécutes `go build`.
    answer: |-
      La commande lit le `go.mod` pour connaître le module et ses dépendances, télécharge au besoin les modules manquants (via le proxy, vérifiés par `go.sum`), puis compile chaque package dans l'ordre des dépendances. Le compilateur produit du code machine directement, sans bytecode intermédiaire, et met en cache les résultats : un package inchangé n'est pas recompilé.
      Le linker assemble ensuite tout, runtime compris (scheduler, GC), dans **un binaire statique** pour la plateforme cible, définie par `GOOS` et `GOARCH`. Sans cgo, ce binaire n'a aucune dépendance système, ce qui permet de le placer dans une image `scratch` ou distroless.
  - key: go-run
    format: course
    question: Que fait `go run .` ?
    answer: Il compile le package du dossier courant dans un dossier temporaire puis exécute le binaire, sans le laisser sur place.
  - key: points
    format: course
    question: Que signifie `./...` dans `go test ./...` ?
    answer: Le package du dossier courant et tous les packages des sous-dossiers.
  - key: install-get
    format: course
    question: go install ou go get pour installer un outil ?
    answer: '`go install outil@version` ; `go get` ne fait plus que modifier les dépendances du module courant.'
  - key: cache
    format: course
    question: Pourquoi un second `go build` est-il presque instantané ?
    answer: Le cache de compilation (`GOCACHE`) garde les packages déjà compilés ; seuls ceux qui ont changé, et ceux qui en dépendent, sont recompilés.
  - key: vf-run-binaire
    format: true-false
    question: '`go run` laisse l''exécutable compilé dans le dossier courant.'
    truth: false
    answer: Il compile dans un dossier temporaire ; c'est `go build` qui produit l'exécutable sur place.
  - key: vf-test-vet
    format: true-false
    question: '`go test` lance aussi une partie des vérifications de `go vet`.'
    truth: true
    answer: Un sous-ensemble fiable de `vet` tourne avant les tests ; un problème trouvé fait échouer `go test`.
  - key: vf-env
    format: true-false
    question: '`go env GOOS` affiche le système d''exploitation cible de la compilation.'
    truth: true
    answer: '`go env` liste les variables de la chaîne d''outils, comme `GOOS`, `GOARCH` ou `GOCACHE`.'
  - key: vf-doc
    format: true-false
    question: Il faut un navigateur pour lire la documentation d'un package Go.
    truth: false
    answer: '`go doc strings.Cut` l''affiche dans le terminal, à partir des commentaires du code.'
  - key: qcm-commandes
    format: multiple-choice
    question: Quelle commande fait quoi ?
    choices:
      - text: '`go vet` : signaler les erreurs probables'
        correct: true
      - text: '`go mod tidy` : aligner go.mod et go.sum sur les imports'
        correct: true
      - text: '`go fmt` : lancer les tests'
        correct: false
      - text: '`go build` : publier le module'
        correct: false
    answer: '`go fmt` formate, `go build` compile ; publier un module, c''est pousser un tag de version.'
  - key: qcm-installer
    format: multiple-choice
    question: Comment installer l'outil `staticcheck` en dernière version ?
    choices:
      - text: '`go install honnef.co/go/tools/cmd/staticcheck@latest`'
        correct: true
      - text: '`go get -u staticcheck`'
        correct: false
      - text: '`go build staticcheck`'
        correct: false
      - text: '`go run staticcheck --install`'
        correct: false
    answer: '`go install` avec un chemin de package et une version.'
  - key: qcm-tout-tester
    format: multiple-choice
    question: Comment lancer les tests de tous les packages du module ?
    choices:
      - text: '`go test ./...`'
        correct: true
      - text: '`go test *`'
        correct: false
      - text: '`go test --all`'
        correct: false
      - text: '`go test .`'
        correct: false
    answer: '`.` ne vise que le package courant ; `./...` descend dans les sous-dossiers.'
  - key: qcm-env
    format: multiple-choice
    question: Que donne `go env` ?
    choices:
      - text: L'emplacement du cache de compilation (GOCACHE)
        correct: true
      - text: La plateforme cible (GOOS, GOARCH)
        correct: true
      - text: La liste des tests en échec
        correct: false
      - text: Les variables d'environnement de l'application
        correct: false
    answer: Les réglages de la chaîne d'outils, pas ceux de l'application.
  - key: trous-run
    format: fill-in
    question: |-
      Complétez pour compiler et exécuter le package du dossier courant :
      ```
      go ___ .
      ```
    blanks:
      - - run
    answer: '`go run .` compile puis exécute.'
  - key: trous-test-tout
    format: fill-in
    question: |-
      Complétez pour tester tout le module :
      ```
      go test ___
      ```
    blanks:
      - - ./...
    answer: '`./...` vise le package courant et tous ses sous-packages.'
  - key: trous-install
    format: fill-in
    question: |-
      Complétez pour installer un outil en dernière version :
      ```
      go ___ golang.org/x/tools/cmd/goimports@___
      ```
    blanks:
      - - install
      - - latest
    answer: '`go install chemin@version` ; `latest` désigne la dernière version publiée.'
  - key: trous-doc
    format: fill-in
    question: |-
      Complétez pour lire la documentation de `strings.Cut` dans le terminal :
      ```
      go ___ strings.Cut
      ```
    blanks:
      - - doc
    answer: '`go doc` affiche la documentation tirée des commentaires.'
  - key: scenario-nouveau-poste
    format: scenario
    question: Tu clones un projet Go inconnu. Quelles commandes lances-tu pour t'y retrouver ?
    answer: |-
      `go version` et la directive `go` du go.mod pour la version attendue, `go build ./...` pour vérifier que tout
      compile, `go test ./...` pour l'état des tests, `go vet ./...` pour les erreurs évidentes. `go list ./...` liste les
      packages, `go list -m all` les dépendances, et `go doc` sur les packages principaux donne leur API. Le dossier
      `cmd/` indique les exécutables.
  - key: scenario-build-lent
    format: scenario
    question: Un collègue se plaint qu'en CI chaque build Go recompile tout. Que proposes-tu ?
    answer: |-
      Garder le cache de compilation et celui des modules entre deux exécutions : le dossier de `go env GOCACHE` et
      `GOMODCACHE`, mis en cache par la CI (l'action `setup-go` le fait). On télécharge les dépendances une fois
      (`go mod download`) et l'on réutilise le cache des tests quand rien n'a changé. Sur une image Docker, on copie
      `go.mod` et `go.sum` avant le code pour garder la couche des dépendances.
  - key: scenario-outil-projet
    format: scenario
    question: Ton projet utilise un générateur de code. Comment t'assures-tu que tout le monde utilise la même version ?
    answer: |-
      Avec la directive `tool` du go.mod (Go 1.24) : `go get -tool chemin/du/generateur@v1.2.3` l'enregistre avec sa
      version, et `go tool generateur` le lance. La version est figée dans go.mod et go.sum comme une dépendance, sans
      installation manuelle ni fichier `tools.go`.
