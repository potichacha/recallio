notion: commande-go
lesson: |-
  Toute la chaîne d'outils tient dans une commande, `go` :

  | Commande | Rôle |
  |---|---|
  | `go run .` | compiler dans un dossier temporaire et exécuter |
  | `go build` | compiler ; un package `main` donne un exécutable |
  | `go install chemin@version` | compiler et installer un outil dans `$GOPATH/bin` (ou `GOBIN`) |
  | `go test ./...` | lancer les tests de tous les packages |
  | `go vet ./...` | l'analyse statique de base |
  | `go fmt ./...` | formater (`gofmt -l -w`) |
  | `go mod init`, `go mod tidy`, `go get` | gérer le module et ses dépendances |
  | `go env` | les variables de la chaîne d'outils (`GOPATH`, `GOOS`, `GOCACHE`...) |
  | `go doc fmt.Println` | la documentation en ligne de commande |
  | `go list -m all` | les modules de la build |

  `./...` désigne le package courant et tous ses sous-packages. `go build` garde un **cache** de compilation
  (`go env GOCACHE`) : seul ce qui a changé est recompilé, d'où des builds incrémentaux très rapides.

  **Piège classique** : utiliser `go get` pour installer un outil. Depuis Go 1.17, `go get` modifie seulement les
  dépendances du module courant ; on installe un outil avec `go install outil@latest`.

  **En entretien** : « Une seule commande pour tout : build, run, test, vet, fmt, modules, doc ; avec un cache qui rend
  les builds incrémentaux, et `./...` pour viser tout le module. »
tour:
  - title: go run, go build
    text: |-
      Ici, le bouton « Exécuter » fait le travail pour toi. Sur ta machine, tout passe par une seule commande, `go` :

      - `go run .` compile le package du dossier courant et lance le programme ;
      - `go build` produit un **exécutable** : un seul fichier, sans dépendance à installer ;
      - `go test ./...`, `go vet ./...` et `go fmt ./...` testent, analysent et formatent tous les packages du module.

      Un exécutable est compilé pour un système (`GOOS`) et une architecture (`GOARCH`). Changer ces deux variables
      suffit pour viser une autre machine : `GOOS=windows GOARCH=amd64 go build` produit un `.exe` depuis Linux ou macOS.

      Le programme de cette page affiche le système pour lequel il a été compilé : celui du bac à sable qui l'exécute.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"runtime"
          )

          func main() {
          	fmt.Println("Ce programme a été compilé pour", runtime.GOOS)
          }
      output: Ce programme a été compilé pour linux
cards:
  - key: explique-passe-quand-executes-build
    format: scenario
    question: "Que se passe-t-il quand tu lances `go build` ?"
    choices:
      - {text: "Il résout les modules du `go.mod`, compile chaque package en code machine, puis lie tout en un binaire statique", correct: true}
      - {text: "Il compile le code en bytecode, que le runtime Go interprète ensuite au lancement du binaire", correct: false}
      - {text: "Il recompile tous les packages, puis produit un binaire qui dépend des bibliothèques du système", correct: false}
      - {text: "Il compile chaque fichier à part et produit une bibliothèque partagée, à charger avec `go run`", correct: false}
    answer: "La commande lit le `go.mod`, télécharge au besoin les modules manquants (vérifiés par `go.sum`), puis compile chaque package en code machine, sans bytecode, en réutilisant le cache pour ceux qui n'ont pas changé. Le linker assemble tout, runtime compris (scheduler, GC), en un binaire statique pour la plateforme `GOOS`/`GOARCH` : sans cgo, il n'a aucune dépendance système et tient dans une image `scratch`."
  - key: go-run
    format: course
    question: Que fait `go run .` ?
    choices:
      - {text: "Il compile le package dans un dossier temporaire, puis exécute le binaire", correct: true}
      - {text: "Il interprète le code source sans le compiler, comme `python script.py`", correct: false}
      - {text: "Il compile le package et laisse le binaire dans le dossier courant", correct: false}
      - {text: "Il lance les tests du package courant, puis exécute sa fonction `main`", correct: false}
    answer: "Il compile le package du dossier courant dans un dossier temporaire, puis exécute le binaire, sans le laisser sur place. Go est toujours compilé : `go run` n'interprète rien."
  - key: points
    format: course
    question: Que signifie `./...` dans `go test ./...` ?
    choices:
      - {text: "Le package du dossier courant et ceux de tous les sous-dossiers", correct: true}
      - {text: "Le seul package du dossier courant, sans les sous-dossiers", correct: false}
      - {text: "Tous les packages du module et ceux de ses dépendances", correct: false}
      - {text: "Les fichiers `_test.go` du dossier courant, sans le reste", correct: false}
    answer: "Le package du dossier courant et tous les packages des sous-dossiers ; les dépendances ne sont pas testées."
  - key: install-get
    format: course
    question: "Pour installer un outil en ligne de commande, utilises-tu `go install` ou `go get` ?"
    choices:
      - {text: "`go install outil@version` ; `go get` ne gère que les dépendances", correct: true}
      - {text: "`go get -u outil`, qui télécharge, compile et installe l'outil", correct: false}
      - {text: "`go build outil`, qui place le binaire dans `$GOPATH/bin`", correct: false}
      - {text: "`go mod download outil`, qui installe l'outil pour le module", correct: false}
    answer: "`go install outil@version` compile l'outil et place son binaire dans `$GOBIN` (ou `$GOPATH/bin`). Depuis Go 1.18, `go get` ne fait plus que modifier les dépendances du module courant."
  - key: cache
    format: course
    question: Pourquoi un second `go build` est-il presque instantané ?
    choices:
      - {text: "Le cache de compilation (`GOCACHE`) garde les packages déjà compilés", correct: true}
      - {text: "Le binaire du premier build est réutilisé tel quel, même si le code change", correct: false}
      - {text: "Le second build ne vérifie que la syntaxe, sans rien recompiler", correct: false}
      - {text: "Un démon `go` reste en mémoire et garde le programme déjà compilé", correct: false}
    answer: "Le cache de compilation (`GOCACHE`) garde les packages déjà compilés ; seuls ceux qui ont changé, et ceux qui en dépendent, sont recompilés. Il n'y a pas de démon, comme celui de Gradle."
  - key: vf-run-binaire
    format: true-false
    question: '`go run` laisse l''exécutable compilé dans le dossier courant.'
    truth: false
    answer: Il compile dans un dossier temporaire ; c'est `go build` qui produit l'exécutable sur place.
  - key: vf-test-vet
    format: true-false
    question: '`go test` lance aussi une partie des vérifications de `go vet`.'
    truth: true
    answer: Un sous-ensemble fiable de `vet` tourne avant les tests ; un problème trouvé fait échouer `go test`.
  - key: vf-env
    format: true-false
    question: '`go env GOOS` affiche le système d''exploitation cible de la compilation.'
    truth: true
    answer: '`go env` liste les variables de la chaîne d''outils, comme `GOOS`, `GOARCH` ou `GOCACHE`.'
  - key: vf-doc
    format: true-false
    question: Il faut un navigateur pour lire la documentation d'un package Go.
    truth: false
    answer: '`go doc strings.Cut` l''affiche dans le terminal, à partir des commentaires du code.'
  - key: qcm-commandes
    format: multiple-choice
    question: "Quelle commande aligne `go.mod` et `go.sum` sur les imports du code ?"
    choices:
      - {text: "`go mod tidy`", correct: true}
      - {text: "`go mod vendor`", correct: false}
      - {text: "`go get -u ./...`", correct: false}
      - {text: "`go vet ./...`", correct: false}
    answer: "`go mod tidy` ajoute les dépendances importées et retire celles qui ne servent plus. `go get -u` met les versions à jour, `go mod vendor` copie les dépendances, `go vet` signale les erreurs probables."
  - key: qcm-installer
    format: multiple-choice
    question: Comment installer l'outil `staticcheck` en dernière version ?
    choices:
      - {text: "`go install honnef.co/go/tools/cmd/staticcheck@latest`", correct: true}
      - {text: "`go get -u honnef.co/go/tools/cmd/staticcheck@latest`", correct: false}
      - {text: "`go build honnef.co/go/tools/cmd/staticcheck@latest`", correct: false}
      - {text: "`go mod download honnef.co/go/tools/cmd/staticcheck`", correct: false}
    answer: "`go install` avec un chemin de package et une version compile et installe l'outil, sans toucher au `go.mod`. `go get` ne fait plus que gérer les dépendances, et `go build` refuse la forme `@version`."
  - key: qcm-tout-tester
    format: multiple-choice
    question: Comment lancer les tests de tous les packages du module ?
    choices:
      - text: '`go test ./...`'
        correct: true
      - text: '`go test *`'
        correct: false
      - text: '`go test --all`'
        correct: false
      - text: '`go test .`'
        correct: false
    answer: '`.` ne vise que le package courant ; `./...` descend dans les sous-dossiers.'
  - key: qcm-env
    format: multiple-choice
    question: "Que montre la commande `go env` ?"
    choices:
      - {text: "Les réglages de la chaîne d'outils, comme `GOCACHE`, `GOOS` et `GOARCH`", correct: true}
      - {text: "Les variables d'environnement que lit l'application à son lancement", correct: false}
      - {text: "La liste des dépendances du module, avec leurs versions exactes", correct: false}
      - {text: "La version de Go installée et les tests en échec du module courant", correct: false}
    answer: "Les réglages de la chaîne d'outils : emplacement du cache (`GOCACHE`), plateforme cible (`GOOS`, `GOARCH`), proxy des modules. Pas ceux de l'application ; les dépendances, c'est `go list -m all`."
  - key: trous-run
    format: fill-in
    question: |-
      Complète pour compiler et exécuter le package du dossier courant :
      ```
      go ___ .
      ```
    blanks:
      - - run
    answer: '`go run .` compile puis exécute.'
  - key: trous-test-tout
    format: fill-in
    question: |-
      Complète pour tester tout le module :
      ```
      go test ___
      ```
    blanks:
      - - ./...
    answer: '`./...` vise le package courant et tous ses sous-packages.'
  - key: trous-install
    format: fill-in
    question: |-
      Complète pour installer un outil en dernière version :
      ```
      go ___ golang.org/x/tools/cmd/goimports@___
      ```
    blanks:
      - - install
      - - latest
    answer: '`go install chemin@version` ; `latest` désigne la dernière version publiée.'
  - key: trous-doc
    format: fill-in
    question: |-
      Complète pour lire la documentation de `strings.Cut` dans le terminal :
      ```
      go ___ strings.Cut
      ```
    blanks:
      - - doc
    answer: '`go doc` affiche la documentation tirée des commentaires.'
  - key: scenario-nouveau-poste
    format: scenario
    question: "Tu clones un projet Go inconnu. Par quelles commandes commences-tu pour t'y retrouver ?"
    choices:
      - {text: "`go build ./...`, `go test ./...` et `go vet ./...`, puis `go list` et `go doc` pour la structure", correct: true}
      - {text: "`go get -u ./...` d'abord, pour mettre à jour toutes les dépendances avant de lire le code", correct: false}
      - {text: "`go mod init` pour recréer le module à ton nom, puis `go build main.go` pour lancer le programme", correct: false}
      - {text: "`go install ./...`, qui installe chaque package dans le `GOPATH` pour pouvoir les parcourir", correct: false}
    answer: "`go version` et la directive `go` du go.mod pour la version attendue, `go build ./...` pour vérifier que tout compile, `go test ./...` pour l'état des tests, `go vet ./...` pour les erreurs évidentes. `go list ./...` liste les packages, `go list -m all` les dépendances, `go doc` donne l'API ; le dossier `cmd/` indique les exécutables. Mettre à jour les dépendances d'entrée changerait le projet avant même de le comprendre."
  - key: scenario-build-lent
    format: scenario
    question: Un collègue se plaint qu'en CI chaque build Go recompile tout. Que proposes-tu ?
    choices:
      - {text: "Garder `GOCACHE` et `GOMODCACHE` entre deux exécutions, et copier `go.mod` avant le code dans Docker", correct: true}
      - {text: "Lancer `go clean -cache` au début de chaque build, pour repartir à chaque fois d'un état propre", correct: false}
      - {text: "Passer l'option `-a` à `go build`, qui réutilise les packages déjà compilés au build précédent", correct: false}
      - {text: "Committer un dossier `vendor/` déjà compilé, pour ne plus jamais recompiler les dépendances", correct: false}
    answer: "Garder le cache de compilation et celui des modules entre deux exécutions (`go env GOCACHE` et `GOMODCACHE`), que l'action `setup-go` met en cache. Sur une image Docker, on copie `go.mod` et `go.sum` avant le code pour garder la couche des dépendances. L'option `-a`, elle, force à tout recompiler."
  - key: scenario-outil-projet
    format: scenario
    question: Ton projet utilise un générateur de code. Comment t'assures-tu que tout le monde utilise la même version ?
    choices:
      - {text: "La directive `tool` du go.mod : `go get -tool chemin@v1.2.3`, puis `go tool generateur`", correct: true}
      - {text: "Un `go install chemin@latest` dans le README, que chacun lance sur son poste", correct: false}
      - {text: "Committer le binaire du générateur dans le dépôt, pour chaque système", correct: false}
      - {text: "Une variable `GENERATOR_VERSION` dans la CI, que chacun recopie à la main", correct: false}
    answer: "Avec la directive `tool` du go.mod (Go 1.24) : `go get -tool chemin/du/generateur@v1.2.3` l'enregistre avec sa version, et `go tool generateur` le lance. La version est figée dans go.mod et go.sum comme une dépendance, sans installation manuelle ni fichier `tools.go` ; `@latest` donnerait une version différente à chacun."
