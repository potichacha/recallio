notion: constantes-iota
lesson: "Une **constante** est fixée à la compilation : `const max = 100`. Elle peut être un nombre, une chaîne, un booléen ou\nune rune, jamais un slice, une map ou une struct.\n\nUne constante **non typée** (`const n = 10`) n'a pas encore de type : elle prend celui du contexte (int, float64,\n`time.Duration`) et elle est calculée en **précision arbitraire**. Une constante **typée** (`const n int64 = 10`) a un\ntype fixe.\n\n**iota** est un compteur qui vaut 0 à la première ligne d'un bloc `const` et augmente de 1 à chaque ligne. Une ligne\nsans expression répète la précédente :\n\n```go\ntype Statut int\n\nconst (\n\tBrouillon Statut = iota // 0\n\tPublie                  // 1\n\tArchive                 // 2\n)\n\nconst (\n\t_  = iota             // on saute 0\n\tKo = 1 << (10 * iota) // 1 << 10\n\tMo                    // 1 << 20\n\tGo                    // 1 << 30\n)\n```\n\nGo n'a pas de type `enum` : on déclare un **type nommé** et des constantes de ce type, et souvent une méthode `String`\n(que `stringer` génère). Ce n'est pas fermé : `Statut(42)` reste une valeur valide pour le compilateur.\n\n**Piège classique** : commencer une énumération par une valeur significative à 0. La valeur zéro d'un champ `Statut`\nvaudra `Brouillon` même si personne ne l'a choisi ; on réserve souvent 0 à « inconnu ».\n\n**En entretien** : « Constantes non typées en précision arbitraire ; iota pour numéroter dans un bloc const ; une\nénumération, c'est un type nommé, des constantes et une méthode String, sans fermeture garantie. »"
tour:
  - title: Constantes et iota
    text: |-
      `const` déclare une valeur connue à la compilation. Une constante écrite sans type, comme `const Pi =
      3.14159`, est **non typée** : elle prend le type de l'endroit où on l'utilise, ici un `float32`.

      Dans un bloc `const ( … )`, `iota` vaut 0 sur la première ligne, puis 1, 2… Une ligne sans expression reprend
      celle du dessus : c'est la façon idiomatique d'écrire une **énumération**, avec un type nommé pour ses valeurs. Le
      second bloc s'en sert pour les puissances de 1024.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          const Pi = 3.14159

          type Jour int

          const (
          	Lundi Jour = iota
          	Mardi
          	Mercredi
          )

          const (
          	_  = iota
          	Ko = 1 << (10 * iota)
          	Mo
          	Go
          )

          func main() {
          	var rayon float32 = 2
          	fmt.Println(Pi * rayon * rayon)
          	fmt.Println(Lundi, Mardi, Mercredi)
          	fmt.Println(Ko, Mo, Go)
          }
      output: |-
        12.56636
        0 1 2
        1024 1048576 1073741824
    task:
      instructions: |-
        Ajoute `Jeudi` et `Vendredi` à l'énumération des jours, puis affiche `Vendredi` au lieu de `Mercredi` : le
        programme doit afficher `4`.
      starter:
        main.go: |-
          package main

          import "fmt"

          type Jour int

          const (
          	Lundi Jour = iota
          	Mardi
          	Mercredi
          )

          func main() {
          	fmt.Println(Mercredi)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          type Jour int

          const (
          	Lundi Jour = iota
          	Mardi
          	Mercredi
          	Jeudi
          	Vendredi
          )

          func main() {
          	fmt.Println(Vendredi)
          }
      output: |-
        4
cards:
  - key: iota
    format: course
    question: "Qu'est-ce que `iota` en Go ?"
    choices:
      - {text: "Un compteur de constantes qui repart de 0 dans chaque bloc `const`", correct: true}
      - {text: "Un compteur global, qui continue d'un bloc `const` au suivant", correct: false}
      - {text: "Une fonction qui génère un identifiant unique à l'exécution", correct: false}
      - {text: "Le mot-clé qui déclare une énumération, comme `enum` en Java", correct: false}
    answer: "Un compteur de constantes qui vaut 0 sur la première ligne de chaque bloc `const` et augmente de 1 à chaque ligne ; il sert aux énumérations. Il repart de 0 dans le bloc suivant."
  - key: code-const-big-1-62-fmt
    format: code-output
    question: "Qu'affiche `const big = 1 << 62; fmt.Println(big / (1 << 60))` ?"
    choices:
      - {text: "`4`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`4` : 2⁶² / 2⁶⁰ = 2² = 4. L'expression est constante, calculée exactement par le compilateur."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tconst big = 1 << 62\n\tfmt.Println(big / (1 << 60))\n}\n"
      output: '4'
  - key: enumerations-natives
    format: course
    question: Go a-t-il des énumérations natives ?
    choices:
      - {text: "Non : on utilise un type nommé et des constantes numérotées par `iota`", correct: true}
      - {text: "Oui : le mot-clé `enum`, ajouté au langage en même temps que les génériques", correct: false}
      - {text: "Oui : `type Statut enum { ... }`, dont les valeurs sont vérifiées à la compilation", correct: false}
      - {text: "Non : on utilise des chaînes, Go n'ayant pas d'entiers typés", correct: false}
    answer: "Non : on déclare un type nommé (`type Statut int`) et des constantes de ce type numérotées par `iota`. Rien n'empêche une valeur hors de la liste."
  - key: terme-iota
    format: course
    question: Que désigne « iota » ?
    choices:
      - {text: "Le compteur de constantes qui sert aux énumérations", correct: true}
      - {text: "Le plus petit entier représentable par le type `int`", correct: false}
      - {text: "L'identifiant blanc qui saute une valeur dans un bloc `const`", correct: false}
      - {text: "Une constante prédéfinie qui vaut toujours 0, comme `nil`", correct: false}
    answer: "Le compteur de constantes d'un bloc `const` : 0 sur la première ligne, puis 1, 2... Il ne vaut pas toujours 0 ; c'est `_` qui saute une valeur."
  - key: qcm-typee
    format: multiple-choice
    question: Quelle différence entre `const a = 5` et `const b int64 = 5` ?
    choices:
      - {text: "`a` est non typée et s'adapte au contexte, `b` est de type int64", correct: true}
      - {text: "Aucune : les deux sont des constantes de type `int64` équivalentes", correct: false}
      - {text: "`a` est une variable modifiable, `b` une constante de type int64", correct: false}
      - {text: "`b` est calculée à l'exécution, `a` à la compilation par le compilateur", correct: false}
    answer: "`b` ne s'affecte qu'à un int64 sans conversion ; `a`, non typée, va aussi bien dans un int, un float64 ou un time.Duration. Les deux sont des constantes, calculées à la compilation."
  - key: types-permis
    format: course
    question: Quels types peut avoir une constante ?
    choices:
      - {text: "Nombres, chaînes, booléens et runes, mais ni slice, ni map, ni struct", correct: true}
      - {text: "Tous les types, pourvu que la valeur soit connue à la compilation", correct: false}
      - {text: "Les nombres seulement : une chaîne constante se déclare par `var`", correct: false}
      - {text: "Les types de base et les structs, mais ni slice, ni map, ni pointeur", correct: false}
    answer: "Les nombres, les chaînes, les booléens et les runes ; pas de slice, de map, de struct ni de pointeur, même avec une valeur connue à la compilation."
  - key: zero-inconnu
    format: course
    question: Pourquoi réserver la valeur 0 d'une énumération à « inconnu » ?
    choices:
      - {text: "Un champ jamais renseigné vaut 0 : il prendrait sinon la première valeur réelle", correct: true}
      - {text: "Le compilateur refuse une énumération dont la valeur 0 a un sens métier", correct: false}
      - {text: "`iota` commence à 1 dans un bloc typé : la valeur 0 n'a donc pas de nom", correct: false}
      - {text: "Pour que `String()` affiche « inconnu » pour toute valeur hors de la liste", correct: false}
    answer: "Parce qu'un champ jamais renseigné vaut 0 : sinon il prendrait silencieusement la première valeur réelle. `iota` commence toujours à 0, typé ou non."
  - key: vf-iota-bloc
    format: true-false
    question: '`iota` repart de 0 dans chaque bloc `const`.'
    truth: true
    answer: Il compte les lignes du bloc, à partir de 0.
  - key: vf-enum-ferme
    format: true-false
    question: Le compilateur empêche de créer une valeur `Statut(42)` hors des constantes déclarées.
    truth: false
    answer: 'Une énumération Go est un simple type nommé : toute valeur du type de base est permise.'
  - key: vf-slice-const
    format: true-false
    question: '`const jours = []string{"lun", "mar"}` compile.'
    truth: false
    answer: Un slice n'est pas une constante ; on utilise une variable de package.
  - key: vf-repetition
    format: true-false
    question: Dans un bloc `const`, une ligne sans expression répète l'expression de la ligne précédente.
    truth: true
    answer: Avec `iota`, qui a avancé, ce qui produit la suite des valeurs.
  - key: qcm-valeurs
    format: multiple-choice
    question: Dans `const ( A = iota; B; C )`, que vaut `C` ?
    choices:
      - text: '2'
        correct: true
      - text: '0'
        correct: false
      - text: '3'
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: '`iota` vaut 0, 1, 2 sur les trois lignes.'
  - key: qcm-enum
    format: multiple-choice
    question: "Comment écrit-on une énumération idiomatique en Go ?"
    choices:
      - {text: "Un type nommé (`type Statut int`) et des constantes de ce type numérotées par `iota`", correct: true}
      - {text: "Le mot-clé `enum` : `enum Statut { Brouillon, Publie }`, comme en Java ou en C", correct: false}
      - {text: "Une interface `Enum` du package `reflect`, que chaque valeur de la liste implémente", correct: false}
      - {text: "Une map globale `map[string]int` qui associe chaque nom à sa valeur au démarrage", correct: false}
    answer: "Un type nommé et des constantes de ce type numérotées par `iota`, souvent complétés par une méthode `String()` générée par `stringer`. Go n'a pas de mot-clé `enum`."
  - key: qcm-non-typee
    format: multiple-choice
    question: "Avec `const delai = 2`, lesquelles de ces lignes compilent ?"
    choices:
      - text: '`time.Sleep(delai * time.Second)`'
        correct: true
      - text: '`var f float64 = delai`'
        correct: true
      - text: '`var s string = delai`'
        correct: false
      - text: '`delai = 3`'
        correct: false
    answer: Une constante non typée s'adapte aux types numériques, mais pas à string, et elle ne se réaffecte pas.
  - key: trous-iota
    format: fill-in
    question: |-
      Complète l'énumération :
      ```go
      const (
      	Rouge Couleur = ___
      	Vert
      	Bleu
      )
      ```
    blanks:
      - - iota
    answer: '`iota` numérote les lignes du bloc à partir de 0.'
  - key: trous-sauter
    format: fill-in
    question: |-
      Complète pour que la première constante utile vaille 1 :
      ```go
      const (
      	___ = iota
      	Premier
      	Second
      )
      ```
    blanks:
      - - _
    answer: L'identifiant blanc consomme la valeur 0.
  - key: trous-ko
    format: fill-in
    question: |-
      Complète pour que Ko vaille 1024 :
      ```go
      const (
      	_  = iota
      	Ko = 1 ___ (10 * iota)
      )
      ```
    blanks:
      - - '<<'
    answer: Le décalage à gauche de 10 bits multiplie par 1024.
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type de l'énumération :
      ```go
      ___ Statut int
      ```
    blanks:
      - - type
    answer: Un type nommé distingue les statuts des autres entiers.
  - key: code-iota
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      const (
      	A = iota
      	B
      	_
      	D
      )

      fmt.Println(A, B, D)
      ```
    choices:
      - {text: "`0 1 3`", correct: true}
      - {text: "`0 1 2`", correct: false}
      - {text: "`1 2 4`", correct: false}
      - {text: "Ça ne compile pas : `_` ne peut pas nommer une constante", correct: false}
    answer: "`0 1 3` : la ligne `_` consomme la valeur 2, que personne ne lit."
    check:
      code: "package main\n\nimport \"fmt\"\n\nconst (\n\tA = iota\n\tB\n\t_\n\tD\n)\n\nfunc main() {\n\tfmt.Println(A, B, D)\n}\n"
      output: 0 1 3
  - key: code-ko
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      const (
      	_  = iota
      	Ko = 1 << (10 * iota)
      	Mo
      )

      fmt.Println(Ko, Mo)
      ```
    choices:
      - {text: "`1024 1048576`", correct: true}
      - {text: "`1024 2048`", correct: false}
      - {text: "`1024 1024`", correct: false}
      - {text: "`1024 0`", correct: false}
    answer: "`1024 1048576` : la ligne de `Mo` répète l'expression `1 << (10 * iota)` avec `iota` à 2, soit 2²⁰."
    check:
      code: "package main\n\nimport \"fmt\"\n\nconst (\n\t_  = iota\n\tKo = 1 << (10 * iota)\n\tMo\n)\n\nfunc main() {\n\tfmt.Println(Ko, Mo)\n}\n"
      output: 1024 1048576
  - key: code-hors-enum
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Statut int

      const (
      	Brouillon Statut = iota
      	Publie
      )

      s := Statut(42)
      fmt.Println(s, s == Publie)
      ```
    choices:
      - {text: "`42 false`", correct: true}
      - {text: "`Publie false`", correct: false}
      - {text: "Une panic : 42 n'est pas un `Statut` déclaré", correct: false}
      - {text: "Ça ne compile pas : 42 n'est pas un `Statut`", correct: false}
    answer: "`42 false` : rien n'empêche une valeur hors des constantes déclarées, ni à la compilation ni à l'exécution. Sans méthode `String()`, le statut s'affiche comme un entier."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Statut int\n\n\nconst (\n\tBrouillon Statut = iota\n\tPublie\n)\n\nfunc main() {\n\ts := Statut(42)\n\tfmt.Println(s, s == Publie)\n}\n"
      output: 42 false
  - key: bug-zero-significatif
    format: bug-fix
    question: |-
      Des commandes jamais traitées apparaissent comme « payées ». Quelle correction est la bonne ?
      ```go
      const (
      	Payee Etat = iota
      	EnAttente
      	Annulee
      )
      ```
    choices:
      - {text: "Ajouter en tête une valeur `EtatInconnu`, pour que 0 ne soit pas un état réel", correct: true}
      - {text: "Placer `Payee` à la fin du bloc, pour que la valeur 0 soit `EnAttente`", correct: false}
      - {text: "Écrire `Payee Etat = 1` en tête, en gardant les autres lignes telles quelles", correct: false}
      - {text: "Faire de `Etat` un `uint`, un type non signé qui n'a pas de valeur zéro", correct: false}
    answer: |-
      ```go
      const (
      	EtatInconnu Etat = iota
      	Payee
      	EnAttente
      	Annulee
      )
      ```
      Un champ `Etat` non renseigné vaut 0 : la valeur zéro doit signifier « inconnu », pas un état réel. Avec `Payee` à la fin, les commandes vides passeraient pour « en attente » ; avec `Payee Etat = 1`, les lignes suivantes répéteraient `1`.
  - key: bug-ordre
    format: bug-fix
    question: |-
      Après l'ajout de `Suspendu` en tête de liste, les statuts déjà enregistrés en base sont faux. Quelle correction est la bonne ?
      ```go
      const (
      	Suspendu Statut = iota
      	Actif
      	Clos
      )
      ```
    choices:
      - {text: "Rendre leurs valeurs aux statuts existants, et ajouter `Suspendu` à la fin", correct: true}
      - {text: "Trier les constantes par ordre alphabétique, pour un ordre stable", correct: false}
      - {text: "Ajouter `_` en tête du bloc, pour réserver la valeur 0", correct: false}
      - {text: "Relancer `go generate`, pour que `stringer` renumérote les statuts", correct: false}
    answer: |-
      ```go
      const (
      	Actif Statut = iota + 1 // 1, valeur déjà en base
      	Clos                    // 2
      	Suspendu                // 3, ajouté à la fin
      )
      ```
      Les valeurs persistées ne doivent pas changer : on ajoute à la fin, ou on fixe les valeurs explicitement. Toute insertion avant les valeurs existantes les décale.
  - key: bug-slice-const
    format: bug-fix
    question: |-
      Le compilateur signale « is not constant ». Quelle correction est la bonne ?
      ```go
      const extensions = []string{".jpg", ".png"}
      ```
    choices:
      - {text: "Une variable de package : `var extensions = []string{...}`", correct: true}
      - {text: "Un tableau constant : `const extensions = [...]string{...}`", correct: false}
      - {text: "Typer la constante : `const extensions []string = {...}`", correct: false}
      - {text: "Une constante par élément, numérotée dans un bloc avec `iota`", correct: false}
    answer: |-
      ```go
      var extensions = []string{".jpg", ".png"}
      ```
      Ni une slice ni un tableau ne peuvent être constants : seuls les nombres, les chaînes et les booléens le peuvent. On utilise une variable de package, non exportée pour qu'on ne la modifie pas de l'extérieur.
  - key: bug-validation
    format: bug-fix
    question: |-
      Une API accepte n'importe quel entier comme statut. Quelle correction est la bonne ?
      ```go
      func (c *Commande) Changer(s Statut) { c.statut = s }
      ```
    choices:
      - {text: "Une méthode `Valide()` sur `Statut`, et `Changer` qui renvoie une erreur hors de la liste", correct: true}
      - {text: "Rien : le type `Statut` garantit déjà qu'on ne passe qu'une constante déclarée", correct: false}
      - {text: "Faire de `Statut` un `uint8`, qui borne les valeurs possibles à l'énumération", correct: false}
      - {text: "Un `default` qui panique dans la méthode `String()` du type, pour bloquer l'appel", correct: false}
    answer: |-
      ```go
      func (s Statut) Valide() bool {
      	return s >= Brouillon && s <= Archive
      }

      func (c *Commande) Changer(s Statut) error {
      	if !s.Valide() {
      		return fmt.Errorf("statut inconnu : %d", s)
      	}
      	c.statut = s
      	return nil
      }
      ```
      Une énumération Go n'est pas fermée : `Statut(42)` compile. On valide donc les valeurs qui viennent de l'extérieur, et l'on renvoie une erreur plutôt qu'une panic.
