notion: constantes-iota
lesson: "Une **constante** est fixée à la compilation : `const max = 100`. Elle peut être un nombre, une chaîne, un booléen ou\nune rune, jamais un slice, une map ou une struct.\n\nUne constante **non typée** (`const n = 10`) n'a pas encore de type : elle prend celui du contexte (int, float64,\n`time.Duration`) et elle est calculée en **précision arbitraire**. Une constante **typée** (`const n int64 = 10`) a un\ntype fixe.\n\n**iota** est un compteur qui vaut 0 à la première ligne d'un bloc `const` et augmente de 1 à chaque ligne. Une ligne\nsans expression répète la précédente :\n\n```go\ntype Statut int\n\nconst (\n\tBrouillon Statut = iota // 0\n\tPublie                  // 1\n\tArchive                 // 2\n)\n\nconst (\n\t_  = iota             // on saute 0\n\tKo = 1 << (10 * iota) // 1 << 10\n\tMo                    // 1 << 20\n\tGo                    // 1 << 30\n)\n```\n\nGo n'a pas de type `enum` : on déclare un **type nommé** et des constantes de ce type, et souvent une méthode `String`\n(que `stringer` génère). Ce n'est pas fermé : `Statut(42)` reste une valeur valide pour le compilateur.\n\n**Piège classique** : commencer une énumération par une valeur significative à 0. La valeur zéro d'un champ `Statut`\nvaudra `Brouillon` même si personne ne l'a choisi ; on réserve souvent 0 à « inconnu ».\n\n**En entretien** : « Constantes non typées en précision arbitraire ; iota pour numéroter dans un bloc const ; une\nénumération, c'est un type nommé, des constantes et une méthode String, sans fermeture garantie. »"
cards:
  - key: iota
    format: course
    question: C'est quoi iota ?
    answer: Un compteur de constantes qui repart de 0 dans chaque bloc const, utilisé pour les énumérations.
  - key: code-const-big-1-62-fmt
    format: code-output
    question: '`const big = 1 << 62; fmt.Println(big / (1 << 60))`'
    answer: '`4`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tconst big = 1 << 62\n\tfmt.Println(big / (1 << 60))\n}\n"
      output: '4'
  - key: enumerations-natives
    format: course
    question: Go a-t-il des énumérations natives ?
    answer: Non, on utilise un type nommé et iota.
  - key: terme-iota
    format: course
    question: Que désigne « iota » ?
    answer: Compteur de constantes pour les énumérations
  - key: qcm-typee
    format: multiple-choice
    question: Quelle différence entre `const a = 5` et `const b int64 = 5` ?
    choices:
      - text: '`a` est non typée et s''adapte au contexte, `b` est de type int64'
        correct: true
      - text: Aucune
        correct: false
      - text: '`a` est une variable, `b` une constante'
        correct: false
      - text: '`b` est calculée à l''exécution'
        correct: false
    answer: '`b` ne s''affecte qu''à un int64 sans conversion ; `a` va dans un int, un float64 ou un time.Duration.'
  - key: types-permis
    format: course
    question: Quels types peut avoir une constante ?
    answer: Les nombres, les chaînes, les booléens et les runes ; pas de slice, de map, de struct ni de pointeur.
  - key: zero-inconnu
    format: course
    question: Pourquoi réserver la valeur 0 d'une énumération à « inconnu » ?
    answer: 'Parce qu''un champ jamais renseigné vaut 0 : sinon il prendrait silencieusement la première valeur réelle.'
  - key: vf-iota-bloc
    format: true-false
    question: '`iota` repart de 0 dans chaque bloc `const`.'
    truth: true
    answer: Il compte les lignes du bloc, à partir de 0.
  - key: vf-enum-ferme
    format: true-false
    question: Le compilateur empêche de créer une valeur `Statut(42)` hors des constantes déclarées.
    truth: false
    answer: 'Une énumération Go est un simple type nommé : toute valeur du type de base est permise.'
  - key: vf-slice-const
    format: true-false
    question: '`const jours = []string{"lun", "mar"}` compile.'
    truth: false
    answer: Un slice n'est pas une constante ; on utilise une variable de package.
  - key: vf-repetition
    format: true-false
    question: Dans un bloc `const`, une ligne sans expression répète l'expression de la ligne précédente.
    truth: true
    answer: Avec `iota`, qui a avancé, ce qui produit la suite des valeurs.
  - key: qcm-valeurs
    format: multiple-choice
    question: Dans `const ( A = iota; B; C )`, que vaut `C` ?
    choices:
      - text: '2'
        correct: true
      - text: '0'
        correct: false
      - text: '3'
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: '`iota` vaut 0, 1, 2 sur les trois lignes.'
  - key: qcm-enum
    format: multiple-choice
    question: Quels éléments composent une énumération idiomatique en Go ?
    choices:
      - text: Un type nommé, par exemple `type Statut int`
        correct: true
      - text: Des constantes de ce type numérotées avec iota
        correct: true
      - text: Le mot-clé `enum`
        correct: false
      - text: Une interface `Enum` à implémenter
        correct: false
    answer: Souvent complété par une méthode `String()` générée par `stringer`.
  - key: qcm-non-typee
    format: multiple-choice
    question: Avec `const delai = 2`, quelles lignes compilent ?
    choices:
      - text: '`time.Sleep(delai * time.Second)`'
        correct: true
      - text: '`var f float64 = delai`'
        correct: true
      - text: '`var s string = delai`'
        correct: false
      - text: '`delai = 3`'
        correct: false
    answer: Une constante non typée s'adapte aux types numériques, mais pas à string, et elle ne se réaffecte pas.
  - key: trous-iota
    format: fill-in
    question: "Complétez l'énumération :\n```go\nconst (\n\tRouge Couleur = ___\n\tVert\n\tBleu\n)\n```"
    blanks:
      - - iota
    answer: '`iota` numérote les lignes du bloc à partir de 0.'
  - key: trous-sauter
    format: fill-in
    question: "Complétez pour que la première constante utile vaille 1 :\n```go\nconst (\n\t___ = iota\n\tPremier\n\tSecond\n)\n```"
    blanks:
      - - _
    answer: L'identifiant blanc consomme la valeur 0.
  - key: trous-ko
    format: fill-in
    question: "Complétez pour que Ko vaille 1024 :\n```go\nconst (\n\t_  = iota\n\tKo = 1 ___ (10 * iota)\n)\n```"
    blanks:
      - - '<<'
    answer: Le décalage à gauche de 10 bits multiplie par 1024.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez le type de l'énumération :
      ```go
      ___ Statut int
      ```
    blanks:
      - - type
    answer: Un type nommé distingue les statuts des autres entiers.
  - key: code-iota
    format: code-output
    question: "```go\nconst (\n\tA = iota\n\tB\n\t_\n\tD\n)\n\nfmt.Println(A, B, D)\n```"
    answer: '`0 1 3` : la ligne `_` consomme la valeur 2.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nconst (\n\tA = iota\n\tB\n\t_\n\tD\n)\n\nfunc main() {\n\tfmt.Println(A, B, D)\n}\n"
      output: 0 1 3
  - key: code-ko
    format: code-output
    question: "```go\nconst (\n\t_  = iota\n\tKo = 1 << (10 * iota)\n\tMo\n)\n\nfmt.Println(Ko, Mo)\n```"
    answer: '`1024 1048576` : la ligne de `Mo` répète l''expression avec `iota` à 2.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nconst (\n\t_  = iota\n\tKo = 1 << (10 * iota)\n\tMo\n)\n\nfunc main() {\n\tfmt.Println(Ko, Mo)\n}\n"
      output: 1024 1048576
  - key: code-hors-enum
    format: code-output
    question: "```go\ntype Statut int\n\nconst (\n\tBrouillon Statut = iota\n\tPublie\n)\n\ns := Statut(42)\nfmt.Println(s, s == Publie)\n```"
    answer: '`42 false` : rien n''empêche une valeur hors des constantes déclarées.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Statut int\n\n\nconst (\n\tBrouillon Statut = iota\n\tPublie\n)\n\nfunc main() {\n\ts := Statut(42)\n\tfmt.Println(s, s == Publie)\n}\n"
      output: 42 false
  - key: bug-zero-significatif
    format: bug-fix
    question: "Des commandes jamais traitées apparaissent comme « payées » :\n```go\nconst (\n\tPayee Etat = iota\n\tEnAttente\n\tAnnulee\n)\n```"
    answer: "```go\nconst (\n\tEtatInconnu Etat = iota\n\tPayee\n\tEnAttente\n\tAnnulee\n)\n```\nUn champ `Etat` non renseigné vaut 0 : la valeur zéro doit signifier « inconnu », pas un état réel."
  - key: bug-ordre
    format: bug-fix
    question: "Après l'ajout de `Suspendu` en tête de liste, les statuts déjà enregistrés en base sont faux :\n```go\nconst (\n\tSuspendu Statut = iota\n\tActif\n\tClos\n)\n```"
    answer: "```go\nconst (\n\tActif Statut = iota + 1 // 1, valeur déjà en base\n\tClos                    // 2\n\tSuspendu                // 3, ajouté à la fin\n)\n```\nLes valeurs persistées ne doivent pas changer : on ajoute à la fin, ou on fixe les valeurs explicitement."
  - key: bug-slice-const
    format: bug-fix
    question: |-
      Le compilateur signale « is not constant » :
      ```go
      const extensions = []string{".jpg", ".png"}
      ```
    answer: |-
      ```go
      var extensions = []string{".jpg", ".png"}
      ```
      Un slice ne peut pas être une constante ; on utilise une variable de package (non exportée pour éviter qu'on la
      modifie de l'extérieur).
  - key: bug-validation
    format: bug-fix
    question: |-
      Une API accepte n'importe quel entier comme statut :
      ```go
      func (c *Commande) Changer(s Statut) { c.statut = s }
      ```
    answer: "```go\nfunc (s Statut) Valide() bool {\n\treturn s >= Brouillon && s <= Archive\n}\n\nfunc (c *Commande) Changer(s Statut) error {\n\tif !s.Valide() {\n\t\treturn fmt.Errorf(\"statut inconnu : %d\", s)\n\t}\n\tc.statut = s\n\treturn nil\n}\n```\nUne énumération Go n'est pas fermée : on valide les valeurs qui viennent de l'extérieur."
