notion: defer
lesson: "`defer` programme un appel de fonction pour **la sortie de la fonction courante**, quelle qu'elle soit : `return`\nnormal, retour anticipé, ou panique.\n\n```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn err\n}\ndefer f.Close() // fermé quoi qu'il arrive, juste après l'ouverture\n\nmu.Lock()\ndefer mu.Unlock()\n```\n\nTrois règles à connaître :\n1. Les appels différés s'exécutent en ordre **LIFO** (dernier déclaré, premier exécuté), comme une pile.\n2. Les **arguments** sont évalués **au moment du `defer`**, pas à l'exécution : `defer fmt.Println(x)` affiche la\n   valeur de `x` à cette ligne. Une closure (`defer func() { fmt.Println(x) }()`) lit la valeur à la sortie.\n3. Un `defer` peut **modifier les retours nommés**, car il s'exécute après leur affectation.\n\n`defer` est aussi le seul endroit où `recover` arrête une panique.\n\nLe coût d'un `defer` est devenu négligeable (Go 1.14, « open-coded defers »). Mais un `defer` dans une **boucle**\nn'exécute rien avant la fin de la **fonction** : les fichiers ouverts s'accumulent. On extrait le corps de la boucle\ndans une fonction.\n\n`os.Exit` ne lance **pas** les defer, et `log.Fatal` appelle `os.Exit`.\n\n**Piège classique** : `defer resp.Body.Close()` avant d'avoir vérifié l'erreur. Si `err != nil`, `resp` est nil et le\ndefer panique à la sortie.\n\n**En entretien** : « Exécuté à la sortie de la fonction, en ordre LIFO, arguments évalués tout de suite ; idéal juste\naprès l'acquisition d'une ressource ; pas dans une boucle longue, et pas avec os.Exit. »"
tour:
  - title: defer
    text: |-
      `defer` programme un appel de fonction pour **la fin de la fonction en cours**, quelle que soit la façon d'en
      sortir : `return`, fin du code, ou panic. C'est l'outil idiomatique pour libérer une ressource juste après l'avoir
      obtenue : `f, err := os.Open(…)`, puis `defer f.Close()`.

      Plusieurs `defer` s'exécutent dans l'ordre **inverse** de leur déclaration, comme une pile. Et les arguments de
      l'appel différé sont évalués **tout de suite**, au moment du `defer`, pas à la fin : le programme affiche la
      valeur qu'avait `x` à ce moment.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("début")
          	for i := range 3 {
          		defer fmt.Println("defer", i)
          	}
          	x := 1
          	defer fmt.Println("x valait", x)
          	x = 2
          	fmt.Println("fin, x vaut", x)
          }
      output: |-
        début
        fin, x vaut 2
        x valait 1
        defer 2
        defer 1
        defer 0
cards:
  - key: ordre-executent-plusieurs-defer
    format: course
    question: Dans quel ordre s'exécutent plusieurs defer ?
    answer: En ordre inverse (LIFO).
  - key: quand-arguments-defer-sont-ils-evalues
    format: course
    question: Quand les arguments d'un defer sont-ils évalués ?
    answer: Au moment où le defer est déclaré.
  - key: defer-modifier-valeur-retournee
    format: course
    question: Un defer peut-il modifier la valeur retournée ?
    answer: Oui, si la fonction a des retours nommés.
  - key: eviter-defer-boucle
    format: course
    question: Pourquoi éviter defer dans une boucle ?
    answer: Les appels ne s'exécutent qu'à la fin de la fonction, les ressources s'accumulent ; extraire le corps dans une fonction.
  - key: ordre-executent-plusieurs-defer-meme-fonction
    format: multiple-choice
    question: Dans quel ordre s'exécutent plusieurs `defer` d'une même fonction ?
    choices:
      - text: Dans l'ordre où ils sont écrits
        correct: false
      - text: Dans l'ordre inverse (dernier entré, premier sorti)
        correct: true
      - text: Dans un ordre non garanti
        correct: false
    answer: 'Les appels différés sont empilés : au retour de la fonction, le dernier `defer` déclaré s''exécute en premier. C''est ce qui permet de libérer les ressources dans l''ordre inverse de leur acquisition.'
  - key: code-x-1-defer-fmt-println
    format: code-output
    question: |-
      ```go
      x := 1
      defer fmt.Println("defer x =", x)
      x = 2
      fmt.Println("x =", x)
      ```
    answer: '`x = 2` puis `defer x = 1` : les arguments du defer sont évalués au moment de sa déclaration.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tdefer fmt.Println(\"defer x =\", x)\n\tx = 2\n\tfmt.Println(\"x =\", x)\n}\n"
      output: |-
        x = 2
        defer x = 1
  - key: code-for-i-0-i-3
    format: code-output
    question: '`for i := 0; i < 3; i++ { defer fmt.Print(i, " ") }`'
    answer: '`2 1 0` : ordre LIFO.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := 0; i < 3; i++ {\n\t    defer fmt.Print(i, \" \")\n\t}\n}\n"
      output: 2 1 0
  - key: terme-defer
    format: course
    question: Que désigne « defer » ?
    answer: Appel différé à la sortie de la fonction, en ordre LIFO
  - key: vf-panique
    format: true-false
    question: Les appels différés s'exécutent même si la fonction panique.
    truth: true
    answer: C'est ce qui permet de libérer les ressources et de récupérer la panique avec `recover`.
  - key: vf-arguments
    format: true-false
    question: Dans `defer fmt.Println(x)`, la valeur de `x` est lue à la sortie de la fonction.
    truth: false
    answer: Les arguments sont évalués au moment du `defer` ; une closure lirait la valeur à la sortie.
  - key: vf-os-exit
    format: true-false
    question: '`os.Exit(1)` exécute les appels différés avant de quitter.'
    truth: false
    answer: '`os.Exit` quitte immédiatement ; `log.Fatal` aussi, puisqu''il l''appelle.'
  - key: vf-bloc
    format: true-false
    question: Un `defer` déclaré dans un bloc `if` s'exécute à la fin de ce bloc.
    truth: false
    answer: Il s'exécute à la sortie de la fonction, pas du bloc.
  - key: qcm-arguments
    format: multiple-choice
    question: Que affiche `x := 1; defer fmt.Println(x); x = 2` à la fin de la fonction ?
    choices:
      - text: '1'
        correct: true
      - text: '2'
        correct: false
      - text: '0'
        correct: false
      - text: Rien
        correct: false
    answer: L'argument est évalué à la ligne du `defer`.
  - key: qcm-boucle
    format: multiple-choice
    question: Comment fermer chaque fichier à chaque tour d'une boucle qui en ouvre des milliers ?
    choices:
      - text: Extraire le corps dans une fonction qui ouvre, diffère la fermeture et traite
        correct: true
      - text: Appeler `f.Close()` explicitement à la fin du tour, en gérant chaque sortie
        correct: true
      - text: '`defer f.Close()` dans la boucle'
        correct: false
      - text: Compter sur le GC pour fermer les fichiers
        correct: false
    answer: 'Un `defer` dans la boucle n''agit qu''à la sortie de la fonction : les descripteurs s''accumulent.'
  - key: qcm-placement
    format: multiple-choice
    question: Où placer `defer resp.Body.Close()` après `resp, err := client.Get(url)` ?
    choices:
      - text: Après le test `if err != nil { return err }`
        correct: true
      - text: Juste avant le test d'erreur
        correct: false
      - text: À la fin de la fonction
        correct: false
      - text: Dans un `init`
        correct: false
    answer: En cas d'erreur, `resp` est nil ; le defer placé avant paniquerait.
  - key: trous-fermer
    format: fill-in
    question: "Complétez pour fermer le fichier à la sortie de la fonction :\n```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn err\n}\n___ f.Close()\n```"
    blanks:
      - - defer
    answer: '`defer` juste après l''acquisition réussie.'
  - key: trous-verrou
    format: fill-in
    question: |-
      Complétez le verrouillage :
      ```go
      mu.Lock()
      defer mu.___()
      ```
    blanks:
      - - Unlock
    answer: Le verrou est relâché quelle que soit la sortie.
  - key: trous-closure
    format: fill-in
    question: |-
      Complétez pour lire la valeur de `etat` à la sortie, pas maintenant :
      ```go
      defer ___() { log.Println("état final :", etat) }()
      ```
    blanks:
      - - func
    answer: Une closure différée lit la variable à son exécution.
  - key: trous-chrono
    format: fill-in
    question: |-
      Complétez pour mesurer la durée de la fonction :
      ```go
      debut := time.Now()
      defer func() { log.Println("durée :", time.___(debut)) }()
      ```
    blanks:
      - - Since
    answer: '`time.Since(debut)` est calculé à la sortie, grâce à la closure.'
  - key: code-closure
    format: code-output
    question: |-
      ```go
      x := 1
      defer func() { fmt.Println("closure", x) }()
      defer fmt.Println("argument", x)
      x = 2
      ```
    answer: '`argument 1` puis `closure 2` : ordre LIFO ; l''argument est figé, la closure lit à la sortie.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tdefer func() { fmt.Println(\"closure\", x) }()\n\tdefer fmt.Println(\"argument\", x)\n\tx = 2\n}\n"
      output: |-
        argument 1
        closure 2
  - key: code-panique
    format: code-output
    question: "```go\nfunc f() {\n\tdefer fmt.Println(\"nettoyage\")\n\tpanic(\"boum\")\n}\n\ndefer func() { fmt.Println(\"récupéré :\", recover()) }()\nf()\n```"
    answer: '`nettoyage` puis `récupéré : boum` : les defer s''exécutent pendant la panique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc f() {\n\tdefer fmt.Println(\"nettoyage\")\n\tpanic(\"boum\")\n}\n\nfunc main() {\n\tdefer func() { fmt.Println(\"récupéré :\", recover()) }()\n\tf()\n}\n"
      output: |-
        nettoyage
        récupéré : boum
  - key: bug-boucle
    format: bug-fix
    question: "Le programme échoue avec « too many open files » sur un gros dossier :\n```go\nfor _, chemin := range chemins {\n\tf, err := os.Open(chemin)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer f.Close()\n\ttraiter(f)\n}\n```"
    answer: "```go\nfor _, chemin := range chemins {\n\tif err := traiterFichier(chemin); err != nil {\n\t\treturn err\n\t}\n}\n\nfunc traiterFichier(chemin string) error {\n\tf, err := os.Open(chemin)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer f.Close()\n\treturn traiter(f)\n}\n```\nLes `defer` de la boucle n'agissaient qu'à la fin de la fonction ; chaque fichier se ferme maintenant à la fin de\nsa propre fonction."
  - key: bug-nil
    format: bug-fix
    question: "Le service panique quand l'API distante est injoignable :\n```go\nresp, err := http.Get(url)\ndefer resp.Body.Close()\nif err != nil {\n\treturn err\n}\n```"
    answer: "```go\nresp, err := http.Get(url)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\n```\nEn cas d'erreur, `resp` est nil : le defer doit venir après le test."
  - key: bug-exit
    format: bug-fix
    question: "Le fichier de sortie reste vide quand le programme s'arrête sur une erreur :\n```go\nfunc main() {\n\tw := bufio.NewWriter(f)\n\tdefer w.Flush()\n\tif err := generer(w); err != nil {\n\t\tlog.Fatal(err)\n\t}\n}\n```"
    answer: "```go\nfunc main() {\n\tif err := run(); err != nil {\n\t\tlog.Println(err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\tw := bufio.NewWriter(f)\n\tdefer w.Flush()\n\treturn generer(w)\n}\n```\n`log.Fatal` appelle `os.Exit`, qui saute les defer : on travaille dans `run`, dont les defer s'exécutent avant la\nsortie."
  - key: bug-valeur
    format: bug-fix
    question: "Le log affiche toujours « tentatives : 0 » :\n```go\ntentatives := 0\ndefer log.Println(\"tentatives :\", tentatives)\nfor !reussi() {\n\ttentatives++\n}\n```"
    answer: |-
      ```go
      defer func() { log.Println("tentatives :", tentatives) }()
      ```
      L'argument était évalué à la ligne du `defer` ; la closure lit la valeur à la sortie.
  - key: scenario-transaction
    format: scenario
    question: Comment utilises-tu `defer` pour garantir qu'une transaction SQL est annulée en cas d'échec ?
    answer: |-
      Juste après `tx, err := db.BeginTx(ctx, nil)` et son test d'erreur, j'écris `defer tx.Rollback()`. Si la fonction
      sort sur une erreur ou une panique, la transaction est annulée ; si elle arrive à `tx.Commit()`, le `Rollback`
      différé ne fait plus rien (il renvoie `sql.ErrTxDone`, qu'on ignore). Le code n'a pas à appeler `Rollback` à chaque
      sortie, et l'on ne peut pas l'oublier.
  - key: scenario-performance
    format: scenario
    question: Un collègue évite `defer` « parce que c'est lent ». Que lui réponds-tu ?
    answer: |-
      Depuis Go 1.14, la plupart des defer sont « open-coded » : leur coût est de l'ordre de quelques nanosecondes, comme
      un appel direct. L'argument ne vaut que pour une boucle très chaude mesurée au profileur. En échange, `defer`
      garantit la libération des ressources sur toutes les sorties, y compris les paniques ; c'est presque toujours le
      bon choix.
  - key: scenario-ordre
    format: scenario
    question: Une fonction ouvre une connexion, démarre une transaction et prend un verrou. Dans quel ordre les libérer, et comment ?
    answer: |-
      Dans l'ordre inverse de l'acquisition : relâcher le verrou, terminer la transaction, fermer la connexion. Il suffit
      d'écrire un `defer` juste après chaque acquisition réussie : l'ordre LIFO des defer fait exactement cela, sans y
      penser.
  - key: scenario-close-erreur
    format: scenario
    question: Faut-il ignorer l'erreur de `defer f.Close()` ?
    answer: |-
      Pour un fichier ouvert en lecture, oui en général : la fermeture ne perd rien. Pour un fichier écrit, non : des
      données peuvent n'être vidées sur le disque qu'à la fermeture, et `Close` signale alors l'échec. On utilise un
      retour nommé et une closure différée qui remonte l'erreur de `Close` si aucune autre erreur n'a eu lieu, ou l'on
      appelle `f.Sync()` puis `Close` explicitement à la fin.
