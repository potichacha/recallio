  - key: code-panique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func f() {
      	defer fmt.Println("nettoyage")
      	panic("boum")
      }

      defer func() { fmt.Println("récupéré :", recover()) }()
      f()
      ```
    choices:
      - text: |-
          ```
          nettoyage
          récupéré : boum
          ```
        correct: true
      - text: |-
          ```
          récupéré : boum
          nettoyage
          ```
        correct: false
      - {text: "`nettoyage`, puis une panic : boum", correct: false}
      - {text: "`récupéré : boum`", correct: false}
    answer: "`nettoyage` puis `récupéré : boum` : pendant la panic, les `defer` de `f` s'exécutent d'abord, puis ceux de l'appelant, où `recover` arrête la panic."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc f() {\n\tdefer fmt.Println(\"nettoyage\")\n\tpanic(\"boum\")\n}\n\nfunc main() {\n\tdefer func() { fmt.Println(\"récupéré :\", recover()) }()\n\tf()\n}\n"
      output: |-
        nettoyage
        récupéré : boum
  - key: bug-boucle
    format: bug-fix
    question: |-
      Le programme échoue avec « too many open files » sur un gros dossier. Quelle correction est la bonne ?
      ```go
      for _, chemin := range chemins {
      	f, err := os.Open(chemin)
      	if err != nil {
      		return err
      	}
      	defer f.Close()
      	traiter(f)
      }
      ```
    choices:
      - {text: "Extraire le corps dans une fonction `traiterFichier`, qui diffère sa propre fermeture", correct: true}
      - {text: "Remplacer `defer f.Close()` par `go f.Close()`, pour fermer en arrière-plan", correct: false}
      - {text: "Placer `defer f.Close()` avant le test de `err`, pour fermer aussi en cas d'erreur", correct: false}
      - {text: "Relever la limite de fichiers ouverts avec `ulimit -n`, sans toucher au code", correct: false}
    answer: |-
      ```go
      for _, chemin := range chemins {
      	if err := traiterFichier(chemin); err != nil {
      		return err
      	}
      }

      func traiterFichier(chemin string) error {
      	f, err := os.Open(chemin)
      	if err != nil {
      		return err
      	}
      	defer f.Close()
      	return traiter(f)
      }
      ```
      Les `defer` de la boucle n'agissaient qu'à la fin de la fonction ; chaque fichier se ferme maintenant à la fin de sa propre fonction. Relever la limite ne fait que repousser l'échec.
  - key: bug-nil
    format: bug-fix
    question: |-
      Le service panique quand l'API distante est injoignable. Quelle correction est la bonne ?
      ```go
      resp, err := http.Get(url)
      defer resp.Body.Close()
      if err != nil {
      	return err
      }
      ```
    choices:
      - {text: "Placer `defer resp.Body.Close()` après le test de `err`", correct: true}
      - {text: "Remplacer le `defer` par un appel direct à `resp.Body.Close()`", correct: false}
      - {text: "Appeler `recover()` dans le `defer`, pour ignorer la panic", correct: false}
      - {text: "Écrire `defer http.Close(resp)`, qui accepte une réponse nil", correct: false}
    answer: |-
      ```go
      resp, err := http.Get(url)
      if err != nil {
      	return err
      }
      defer resp.Body.Close()
      ```
      En cas d'erreur, `resp` est nil : `resp.Body` panique dès la ligne du `defer`, qui évalue ses arguments tout de suite. Le `defer` doit venir après le test.
  - key: bug-exit
    format: bug-fix
    question: |-
      Le fichier de sortie reste vide quand le programme s'arrête sur une erreur. Quelle correction est la bonne ?
      ```go
      func main() {
      	w := bufio.NewWriter(f)
      	defer w.Flush()
      	if err := generer(w); err != nil {
      		log.Fatal(err)
      	}
      }
      ```
    choices:
      - {text: "Travailler dans une fonction `run() error`, et n'appeler `os.Exit` qu'après son retour", correct: true}
      - {text: "Déplacer `defer w.Flush()` après le `if`, juste avant la fin de `main`", correct: false}
      - {text: "Ajouter `defer f.Close()` juste après `defer w.Flush()`, pour tout vider", correct: false}
      - {text: "Appeler `log.Fatal` dans une goroutine, pour laisser `main` se terminer", correct: false}
    answer: |-
      ```go
      func main() {
      	if err := run(); err != nil {
      		log.Println(err)
      		os.Exit(1)
      	}
      }

      func run() error {
      	w := bufio.NewWriter(f)
      	defer w.Flush()
      	return generer(w)
      }
      ```
      `log.Fatal` appelle `os.Exit`, qui saute les `defer`, où qu'ils soient : on travaille dans `run`, dont les `defer` s'exécutent avant la sortie.
  - key: bug-valeur
    format: bug-fix
    question: |-
      Le log affiche toujours « tentatives : 0 ». Quelle correction est la bonne ?
      ```go
      tentatives := 0
      defer log.Println("tentatives :", tentatives)
      for !reussi() {
      	tentatives++
      }
      ```
    choices:
      - {text: "Une closure différée : `defer func() { log.Println(...) }()`", correct: true}
      - {text: "Passer l'adresse : `defer log.Println(\"tentatives :\", &tentatives)`", correct: false}
      - {text: "Déplacer le `defer` au-dessus de `tentatives := 0`", correct: false}
      - {text: "Remplacer `defer` par `go`, pour lire la valeur plus tard", correct: false}
    answer: |-
      ```go
      defer func() { log.Println("tentatives :", tentatives) }()
      ```
      L'argument était évalué à la ligne du `defer` ; la closure lit la valeur à la sortie. Passer `&tentatives` afficherait une adresse.
  - key: scenario-transaction
    format: scenario
    question: Comment utilises-tu `defer` pour garantir qu'une transaction SQL est annulée en cas d'échec ?
    choices:
      - {text: "`defer tx.Rollback()` juste après le `BeginTx` réussi ; après `Commit`, il ne fait plus rien", correct: true}
      - {text: "`defer tx.Commit()` juste après `BeginTx`, et un `Rollback` à chaque sortie en erreur", correct: false}
      - {text: "Un `Rollback` explicite avant chaque `return` d'erreur, sans aucun `defer`", correct: false}
      - {text: "`defer tx.Rollback()` avant le test d'erreur de `BeginTx`, pour couvrir tous les cas", correct: false}
    answer: "Juste après `tx, err := db.BeginTx(ctx, nil)` et son test d'erreur, j'écris `defer tx.Rollback()`. Si la fonction sort sur une erreur ou une panic, la transaction est annulée ; si elle arrive à `tx.Commit()`, le `Rollback` différé ne fait plus rien (il renvoie `sql.ErrTxDone`, qu'on ignore). Avant le test d'erreur, `tx` pourrait être nil."
  - key: scenario-performance
    format: scenario
    question: Un collègue évite `defer` « parce que c'est lent ». Que lui réponds-tu ?
    choices:
      - {text: "Depuis Go 1.14, un `defer` coûte quelques nanosecondes ; on ne l'évite qu'après mesure", correct: true}
      - {text: "Il a raison : chaque `defer` alloue sur le tas, mieux vaut l'éviter partout", correct: false}
      - {text: "Il a raison : un `defer` lance une goroutine, ce qui coûte cher à chaque appel", correct: false}
      - {text: "Il a tort, car le compilateur retire tous les `defer` en optimisant le code", correct: false}
    answer: "Depuis Go 1.14, la plupart des `defer` sont « open-coded » : leur coût est de l'ordre de quelques nanosecondes, comme un appel direct. L'argument ne vaut que pour une boucle très chaude mesurée au profileur ; en échange, `defer` garantit la libération des ressources sur toutes les sorties, paniques comprises."
  - key: scenario-ordre
    format: scenario
    question: Une fonction ouvre une connexion, démarre une transaction et prend un verrou. Dans quel ordre les libérer, et comment ?
    choices:
      - {text: "Dans l'ordre inverse, avec un `defer` juste après chaque acquisition réussie", correct: true}
      - {text: "Dans l'ordre d'acquisition : connexion, puis transaction, puis verrou", correct: false}
      - {text: "Tout libérer dans un seul `defer`, écrit à la fin de la fonction", correct: false}
      - {text: "Dans n'importe quel ordre, tant que tout est libéré avant le `return`", correct: false}
    answer: "Dans l'ordre inverse de l'acquisition : relâcher le verrou, terminer la transaction, fermer la connexion. Un `defer` juste après chaque acquisition réussie suffit : l'ordre LIFO des `defer` fait exactement cela."
  - key: scenario-close-erreur
    format: scenario
    question: Faut-il ignorer l'erreur de `defer f.Close()` ?
    choices:
      - {text: "En lecture, oui en général ; en écriture, non : `Close` peut signaler des données perdues", correct: true}
      - {text: "Toujours : `Close` ne peut pas échouer sur un fichier ouvert sans erreur", correct: false}
      - {text: "Jamais : on fait paniquer le programme dès que `Close` renvoie une erreur", correct: false}
      - {text: "Oui, puisque `os.File` écrit chaque `Write` sur le disque avant de rendre la main", correct: false}
    answer: "Pour un fichier ouvert en lecture, la fermeture ne perd rien. Pour un fichier écrit, des données peuvent n'atteindre le disque qu'à la fermeture, et `Close` signale alors l'échec : on remonte son erreur par un retour nommé et une closure différée, ou l'on appelle `f.Sync()` puis `Close` explicitement à la fin."
