notion: defer
lesson: "`defer` programme un appel de fonction pour **la sortie de la fonction courante**, quelle qu'elle soit : `return`\nnormal, retour anticipé, ou panique.\n\n```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn err\n}\ndefer f.Close() // fermé quoi qu'il arrive, juste après l'ouverture\n\nmu.Lock()\ndefer mu.Unlock()\n```\n\nTrois règles à connaître :\n1. Les appels différés s'exécutent en ordre **LIFO** (dernier déclaré, premier exécuté), comme une pile.\n2. Les **arguments** sont évalués **au moment du `defer`**, pas à l'exécution : `defer fmt.Println(x)` affiche la\n   valeur de `x` à cette ligne. Une closure (`defer func() { fmt.Println(x) }()`) lit la valeur à la sortie.\n3. Un `defer` peut **modifier les retours nommés**, car il s'exécute après leur affectation.\n\n`defer` est aussi le seul endroit où `recover` arrête une panique.\n\nLe coût d'un `defer` est devenu négligeable (Go 1.14, « open-coded defers »). Mais un `defer` dans une **boucle**\nn'exécute rien avant la fin de la **fonction** : les fichiers ouverts s'accumulent. On extrait le corps de la boucle\ndans une fonction.\n\n`os.Exit` ne lance **pas** les defer, et `log.Fatal` appelle `os.Exit`.\n\n**Piège classique** : `defer resp.Body.Close()` avant d'avoir vérifié l'erreur. Si `err != nil`, `resp` est nil et le\ndefer panique à la sortie.\n\n**En entretien** : « Exécuté à la sortie de la fonction, en ordre LIFO, arguments évalués tout de suite ; idéal juste\naprès l'acquisition d'une ressource ; pas dans une boucle longue, et pas avec os.Exit. »"
tour:
  - title: defer
    text: |-
      `defer` programme un appel de fonction pour **la fin de la fonction en cours**, quelle que soit la façon d'en
      sortir : `return`, fin du code, ou panic. C'est l'outil idiomatique pour libérer une ressource juste après l'avoir
      obtenue : `f, err := os.Open(…)`, puis `defer f.Close()`.

      Plusieurs `defer` s'exécutent dans l'ordre **inverse** de leur déclaration, comme une pile. Et les arguments de
      l'appel différé sont évalués **tout de suite**, au moment du `defer`, pas à la fin : le programme affiche la
      valeur qu'avait `x` à ce moment.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("début")
          	for i := range 3 {
          		defer fmt.Println("defer", i)
          	}
          	x := 1
          	defer fmt.Println("x valait", x)
          	x = 2
          	fmt.Println("fin, x vaut", x)
          }
      output: |-
        début
        fin, x vaut 2
        x valait 1
        defer 2
        defer 1
        defer 0
cards:
  - key: ordre-executent-plusieurs-defer
    format: course
    question: "Dans quel ordre s'exécutent plusieurs `defer` à la sortie d'une fonction ?"
    choices:
      - {text: "En ordre inverse : le dernier déclaré passe en premier", correct: true}
      - {text: "Dans l'ordre où ils sont écrits, du premier au dernier", correct: false}
      - {text: "Dans un ordre non garanti, choisi par le runtime", correct: false}
      - {text: "En parallèle, chacun dans sa propre goroutine", correct: false}
    answer: "En ordre inverse (LIFO) : les appels différés sont empilés, et le dernier déclaré s'exécute en premier."
  - key: quand-arguments-defer-sont-ils-evalues
    format: course
    question: "Quand les arguments d'un `defer` sont-ils évalués ?"
    choices:
      - {text: "À la ligne du `defer`, quand il est déclaré", correct: true}
      - {text: "À la sortie de la fonction, quand l'appel s'exécute", correct: false}
      - {text: "Au premier accès à la variable après le `defer`", correct: false}
      - {text: "Au `return`, juste avant de renvoyer les résultats", correct: false}
    answer: "Au moment où le `defer` est déclaré : l'appel est différé, pas l'évaluation de ses arguments. Pour lire une variable à la sortie, on diffère une closure."
  - key: defer-modifier-valeur-retournee
    format: course
    question: "Un `defer` peut-il modifier la valeur retournée ?"
    choices:
      - {text: "Oui, si la fonction a des retours nommés, par une closure différée", correct: true}
      - {text: "Non : la valeur de retour est figée dès l'instruction `return`", correct: false}
      - {text: "Oui, toujours, en appelant `return` une seconde fois dans le `defer`", correct: false}
      - {text: "Non : un `defer` ne peut appeler qu'une fonction sans effet de bord", correct: false}
    answer: "Oui, si la fonction a des retours nommés : `return` les affecte, puis les `defer` s'exécutent et une closure différée peut encore les changer. Sans retour nommé, elle n'a pas de variable à modifier."
  - key: eviter-defer-boucle
    format: course
    question: "Pourquoi éviter `defer` dans une boucle ?"
    choices:
      - {text: "Les appels n'ont lieu qu'à la fin de la fonction : les ressources s'accumulent", correct: true}
      - {text: "Le compilateur refuse un `defer` placé à l'intérieur d'une boucle `for`", correct: false}
      - {text: "Chaque `defer` s'exécute au tour suivant, sur la variable du nouveau tour", correct: false}
      - {text: "Un `defer` dans une boucle ne s'exécute qu'une fois, au dernier tour", correct: false}
    answer: "Les appels ne s'exécutent qu'à la fin de la fonction : les ressources s'accumulent tour après tour. On extrait le corps de la boucle dans une fonction, dont le `defer` agit à chaque tour."
  - key: ordre-executent-plusieurs-defer-meme-fonction
    format: multiple-choice
    question: Dans quel ordre s'exécutent plusieurs `defer` d'une même fonction ?
    choices:
      - {text: "Dans l'ordre où ils sont écrits (premier entré, premier sorti)", correct: false}
      - {text: "Dans l'ordre inverse (dernier entré, premier sorti)", correct: true}
      - {text: "Dans un ordre non garanti, choisi par le runtime à chaque appel", correct: false}
      - {text: "Tous en même temps, chacun dans sa propre goroutine", correct: false}
    answer: 'Les appels différés sont empilés : au retour de la fonction, le dernier `defer` déclaré s''exécute en premier. C''est ce qui permet de libérer les ressources dans l''ordre inverse de leur acquisition.'
  - key: code-x-1-defer-fmt-println
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 1
      defer fmt.Println("defer x =", x)
      x = 2
      fmt.Println("x =", x)
      ```
    choices:
      - text: |-
          ```
          x = 2
          defer x = 1
          ```
        correct: true
      - text: |-
          ```
          x = 2
          defer x = 2
          ```
        correct: false
      - text: |-
          ```
          defer x = 1
          x = 2
          ```
        correct: false
      - text: |-
          ```
          defer x = 2
          x = 2
          ```
        correct: false
    answer: "`x = 2` puis `defer x = 1` : l'appel différé s'exécute à la sortie, mais ses arguments sont évalués à la ligne du `defer`, quand `x` vaut encore 1."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tdefer fmt.Println(\"defer x =\", x)\n\tx = 2\n\tfmt.Println(\"x =\", x)\n}\n"
      output: |-
        x = 2
        defer x = 1
  - key: code-for-i-0-i-3
    format: code-output
    question: "Qu'affiche `for i := 0; i < 3; i++ { defer fmt.Print(i, \" \") }` ?"
    choices:
      - {text: "`2 1 0`", correct: true}
      - {text: "`0 1 2`", correct: false}
      - {text: "`3 3 3`", correct: false}
      - {text: "`2 2 2`", correct: false}
    answer: "`2 1 0` : les appels différés s'exécutent en ordre LIFO, et chacun a évalué `i` à sa déclaration."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := 0; i < 3; i++ {\n\t    defer fmt.Print(i, \" \")\n\t}\n}\n"
      output: 2 1 0
  - key: terme-defer
    format: course
    question: Que désigne « defer » ?
    choices:
      - {text: "Un appel différé à la sortie de la fonction, en ordre LIFO", correct: true}
      - {text: "Un appel lancé en arrière-plan, dans une nouvelle goroutine", correct: false}
      - {text: "Un appel retardé d'une durée donnée, comme `time.AfterFunc`", correct: false}
      - {text: "Un appel différé à la fin du bloc courant, comme `using` en C#", correct: false}
    answer: "Un appel différé à la sortie de la fonction (pas du bloc), y compris lors d'une panic, en ordre LIFO."
  - key: vf-panique
    format: true-false
    question: Les appels différés s'exécutent même si la fonction panique.
    truth: true
    answer: C'est ce qui permet de libérer les ressources et de récupérer la panique avec `recover`.
  - key: vf-arguments
    format: true-false
    question: Dans `defer fmt.Println(x)`, la valeur de `x` est lue à la sortie de la fonction.
    truth: false
    answer: Les arguments sont évalués au moment du `defer` ; une closure lirait la valeur à la sortie.
  - key: vf-os-exit
    format: true-false
    question: '`os.Exit(1)` exécute les appels différés avant de quitter.'
    truth: false
    answer: '`os.Exit` quitte immédiatement ; `log.Fatal` aussi, puisqu''il l''appelle.'
  - key: vf-bloc
    format: true-false
    question: Un `defer` déclaré dans un bloc `if` s'exécute à la fin de ce bloc.
    truth: false
    answer: Il s'exécute à la sortie de la fonction, pas du bloc.
  - key: qcm-arguments
    format: multiple-choice
    question: Que affiche `x := 1; defer fmt.Println(x); x = 2` à la fin de la fonction ?
    choices:
      - text: '1'
        correct: true
      - text: '2'
        correct: false
      - text: '0'
        correct: false
      - text: Rien
        correct: false
    answer: L'argument est évalué à la ligne du `defer`.
  - key: qcm-boucle
    format: multiple-choice
    question: "Une boucle ouvre des milliers de fichiers. Quelle façon de fermer chacun à la fin de son tour est la plus sûre ?"
    choices:
      - {text: "Extraire le corps dans une fonction qui ouvre, diffère la fermeture et traite", correct: true}
      - {text: "Écrire `defer f.Close()` dans la boucle, juste après l'ouverture réussie", correct: false}
      - {text: "Compter sur le GC pour fermer les fichiers qui ne sont plus référencés", correct: false}
      - {text: "Écrire `defer f.Close()` après la boucle, pour tout fermer d'un coup", correct: false}
    answer: "Une fonction par fichier ferme chacun à la fin de son tour, sur toutes les sorties. Un `defer` dans la boucle n'agit qu'à la sortie de la fonction : les descripteurs s'accumulent. Un `f.Close()` explicite en fin de tour marche aussi, s'il est placé sur chaque sortie."
  - key: qcm-placement
    format: multiple-choice
    question: Où placer `defer resp.Body.Close()` après `resp, err := client.Get(url)` ?
    choices:
      - text: Après le test `if err != nil { return err }`
        correct: true
      - text: Juste avant le test d'erreur
        correct: false
      - text: À la fin de la fonction
        correct: false
      - text: Dans un `init`
        correct: false
    answer: En cas d'erreur, `resp` est nil ; le defer placé avant paniquerait.
