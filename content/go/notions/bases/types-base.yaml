notion: types-base
lesson: |-
  Les types de base de Go :

  | Catégorie | Types |
  |---|---|
  | booléen | `bool` |
  | entiers signés | `int8`, `int16`, `int32`, `int64`, et `int` (64 bits sur les plateformes courantes) |
  | entiers non signés | `uint8`... `uint64`, `uint`, `uintptr` |
  | flottants | `float32`, `float64` |
  | complexes | `complex64`, `complex128` |
  | chaîne | `string` (immuable, des octets UTF-8) |
  | alias | `byte` = `uint8`, `rune` = `int32` (un point de code Unicode) |

  En pratique : **`int`** pour les compteurs et les indices, **`float64`** pour les flottants, `int64` quand la taille
  doit être fixe (un identifiant, un format de fichier), `byte` pour des données binaires, `rune` pour un caractère.

  Littéraux : `42`, `0x2A`, `0o52`, `0b101010`, `1_000_000` (séparateur), `3.14`, `1e6`, `'é'` (une rune), `"texte"`
  (chaîne interprétée), `` `brut\n` `` (chaîne brute, sans échappement, multiligne).

  `fmt.Printf("%T", x)` affiche le type d'une valeur.

  **Piège classique** : croire que `int` vaut 32 bits. Sa taille est celle du mot de la machine : 64 bits sur amd64 et
  arm64, 32 bits sur les plateformes 32 bits.

  **En entretien** : « `int` et `float64` par défaut ; `byte` est `uint8`, `rune` est `int32` et représente un point de
  code ; une chaîne est une suite d'octets UTF-8 immuable. »
tour:
  - title: Les types de base
    text: |-
      Les types de base de Go :

      - les entiers `int`, `int8` … `int64`, et leurs versions non signées `uint`, `uint8` … `uint64` ; `int` fait 64
      bits sur les machines actuelles ; - les flottants `float32` et `float64`, le type par défaut d'un littéral comme
      `3.5` ; - `bool`, qui vaut `true` ou `false` ; - `string`, une suite d'octets immuable, en UTF-8 ; - `byte`, un
      autre nom de `uint8`, et `rune`, un autre nom de `int32`, qui représente un caractère Unicode.

      Le verbe `%T` de `Printf` affiche le type d'une valeur : pratique pour voir ce que Go a déduit. `%c` affiche une
      rune comme un caractère.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	entier := 42
          	flottant := 3.5
          	vrai := true
          	texte := "Go"
          	octet := byte('A')
          	lettre := 'é'
          	fmt.Printf("%T %T %T %T\n", entier, flottant, vrai, texte)
          	fmt.Printf("%T %v\n", octet, octet)
          	fmt.Printf("%T %v %c\n", lettre, lettre, lettre)
          }
      output: |-
        int float64 bool string
        uint8 65
        int32 233 é
    task:
      instructions: |-
        Range `1 << 40` (un 1 décalé de 40 bits) dans `grand`, pour que le programme affiche `int 1099511627776` : un
        `int` de 64 bits le contient sans problème.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	grand := 1
          	fmt.Printf("%T %v\n", grand, grand)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	grand := 1 << 40
          	fmt.Printf("%T %v\n", grand, grand)
          }
      output: |-
        int 1099511627776
cards:
  - key: byte-rune
    format: course
    question: '`byte` et `rune` ?'
    answer: Alias de uint8 et int32 ; rune représente un point de code Unicode.
  - key: definition-rune
    format: definition
    question: rune
    answer: Alias de int32 représentant un point de code Unicode
  - key: int-taille
    format: course
    question: Quelle est la taille d'un `int` en Go ?
    answer: 'Celle du mot de la machine : 64 bits sur amd64 et arm64, 32 bits sur une plateforme 32 bits.'
  - key: chaine-brute
    format: course
    question: Quelle différence entre `"a\nb"` et `` `a\nb` `` ?
    answer: La première est une chaîne interprétée (le `\n` est un retour à la ligne) ; la seconde est une chaîne brute, où `\n` reste deux caractères.
  - key: quel-flottant
    format: course
    question: Quel type flottant utiliser par défaut ?
    answer: '`float64` : c''est le type par défaut des constantes flottantes et celui des fonctions de `math`.'
  - key: vf-byte
    format: true-false
    question: '`byte` est un alias de `uint8`.'
    truth: true
    answer: Ce sont exactement le même type.
  - key: vf-rune
    format: true-false
    question: '`rune` est un alias de `int32` qui représente un point de code Unicode.'
    truth: true
    answer: Un littéral entre apostrophes (`'é'`) est une rune.
  - key: vf-char
    format: true-false
    question: Go possède un type `char` pour les caractères.
    truth: false
    answer: On utilise `rune` pour un point de code et `byte` pour un octet.
  - key: vf-separateur
    format: true-false
    question: '`1_000_000` est un littéral entier valide.'
    truth: true
    answer: Le tiret bas sépare les chiffres pour la lisibilité (depuis Go 1.13).
  - key: qcm-alias
    format: multiple-choice
    question: Quelles affirmations sont vraies ?
    choices:
      - text: '`byte` et `uint8` sont le même type'
        correct: true
      - text: '`rune` et `int32` sont le même type'
        correct: true
      - text: '`int` et `int64` sont le même type'
        correct: false
      - text: '`float` est un type de Go'
        correct: false
    answer: '`int` et `int64` sont deux types distincts, même s''ils ont la même taille ; `float` n''existe pas.'
  - key: qcm-litteraux
    format: multiple-choice
    question: Quels littéraux valent 42 ?
    choices:
      - text: '`0x2A`'
        correct: true
      - text: '`0b101010`'
        correct: true
      - text: '`052` ou `0o52`'
        correct: true
      - text: '`42.0` affecté à un `int` via une variable float64'
        correct: false
    answer: Hexadécimal, binaire et octal ; une variable float64 ne s'affecte pas à un int sans conversion.
  - key: qcm-choix
    format: multiple-choice
    question: Quel type choisir pour stocker des données binaires lues d'un fichier ?
    choices:
      - text: '`[]byte`'
        correct: true
      - text: '`[]rune`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`[]int`'
        correct: false
    answer: '`[]byte` est modifiable et c''est ce que manipulent `io.Reader` et `os.ReadFile`.'
  - key: qcm-rune-litteral
    format: multiple-choice
    question: Quel est le type de `r` dans `r := 'é'` ?
    choices:
      - text: '`rune` (int32)'
        correct: true
      - text: '`byte`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`char`'
        correct: false
    answer: Une constante rune donne une variable de type `rune`.
  - key: trous-rune
    format: fill-in
    question: |-
      Complétez le type d'un point de code Unicode :
      ```go
      var initiale ___ = 'A'
      ```
    blanks:
      - - rune
        - int32
    answer: '`rune` est l''alias de `int32` qui représente un caractère.'
  - key: trous-octet
    format: fill-in
    question: |-
      Complétez le type des données binaires :
      ```go
      donnees := make([]___, 0, 512)
      ```
    blanks:
      - - byte
        - uint8
    answer: '`[]byte` est le type des données binaires.'
  - key: trous-brute
    format: fill-in
    question: |-
      Complétez pour écrire une chaîne brute sur plusieurs lignes :
      ```go
      requete := ___SELECT nom
      FROM client___
      ```
    blanks:
      - - '`'
      - - '`'
    answer: Les accents graves délimitent une chaîne brute, sans échappement.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez pour afficher le type d'une valeur :
      ```go
      fmt.Printf("%___\n", x)
      ```
    blanks:
      - - T
    answer: '`%T` affiche le type dynamique.'
  - key: code-types
    format: code-output
    question: |-
      ```go
      a, b, c, d := 1, 2.5, 'x', "x"
      fmt.Printf("%T %T %T %T\n", a, b, c, d)
      ```
    answer: '`int float64 int32 string` : une rune s''affiche comme `int32`, son type réel.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b, c, d := 1, 2.5, 'x', \"x\"\n\tfmt.Printf(\"%T %T %T %T\\n\", a, b, c, d)\n}\n"
      output: int float64 int32 string
  - key: code-rune-valeur
    format: code-output
    question: |-
      ```go
      r := 'A'
      fmt.Println(r, string(r))
      ```
    answer: '`65 A` : une rune est un nombre (le point de code) ; `string(r)` donne le caractère.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tr := 'A'\n\tfmt.Println(r, string(r))\n}\n"
      output: 65 A
  - key: code-brute
    format: code-output
    question: |-
      ```go
      fmt.Println(len("a\nb"), len(`a\nb`))
      ```
    answer: '`3 4` : dans la chaîne brute, `\n` reste deux caractères.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(len(\"a\\nb\"), len(`a\\nb`))\n}\n"
      output: 3 4
  - key: code-separateur
    format: code-output
    question: |-
      ```go
      fmt.Println(1_000 + 0x10, 0b11)
      ```
    answer: '`1016 3` : séparateur de chiffres, hexadécimal et binaire.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(1_000 + 0x10, 0b11)\n}\n"
      output: 1016 3
  - key: definition-byte
    format: definition
    question: byte
    answer: Alias de `uint8`, le type d'un octet ; `[]byte` représente des données binaires.
  - key: definition-uintptr
    format: definition
    question: uintptr
    answer: Un entier non signé assez grand pour contenir une adresse mémoire, réservé aux usages bas niveau avec `unsafe`.
  - key: definition-chaine-brute
    format: definition
    question: chaîne brute (raw string)
    answer: Une chaîne entre accents graves, sans séquence d'échappement, qui peut tenir sur plusieurs lignes.
