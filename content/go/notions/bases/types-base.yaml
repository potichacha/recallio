notion: types-base
lesson: |-
  Les types de base de Go :

  | Catégorie | Types |
  |---|---|
  | booléen | `bool` |
  | entiers signés | `int8`, `int16`, `int32`, `int64`, et `int` (64 bits sur les plateformes courantes) |
  | entiers non signés | `uint8`... `uint64`, `uint`, `uintptr` |
  | flottants | `float32`, `float64` |
  | complexes | `complex64`, `complex128` |
  | chaîne | `string` (immuable, des octets UTF-8) |
  | alias | `byte` = `uint8`, `rune` = `int32` (un point de code Unicode) |

  En pratique : **`int`** pour les compteurs et les indices, **`float64`** pour les flottants, `int64` quand la taille
  doit être fixe (un identifiant, un format de fichier), `byte` pour des données binaires, `rune` pour un caractère.

  Littéraux : `42`, `0x2A`, `0o52`, `0b101010`, `1_000_000` (séparateur), `3.14`, `1e6`, `'é'` (une rune), `"texte"`
  (chaîne interprétée), `` `brut\n` `` (chaîne brute, sans échappement, multiligne).

  `fmt.Printf("%T", x)` affiche le type d'une valeur.

  **Piège classique** : croire que `int` vaut 32 bits. Sa taille est celle du mot de la machine : 64 bits sur amd64 et
  arm64, 32 bits sur les plateformes 32 bits.

  **En entretien** : « `int` et `float64` par défaut ; `byte` est `uint8`, `rune` est `int32` et représente un point de
  code ; une chaîne est une suite d'octets UTF-8 immuable. »
tour:
  - title: Les types de base
    text: |-
      Les types de base de Go :

      - les entiers `int`, `int8` … `int64`, et leurs versions non signées `uint`, `uint8` … `uint64` ; `int` fait 64
      bits sur les machines actuelles ; - les flottants `float32` et `float64`, le type par défaut d'un littéral comme
      `3.5` ; - `bool`, qui vaut `true` ou `false` ; - `string`, une suite d'octets immuable, en UTF-8 ; - `byte`, un
      autre nom de `uint8`, et `rune`, un autre nom de `int32`, qui représente un caractère Unicode.

      Le verbe `%T` de `Printf` affiche le type d'une valeur : pratique pour voir ce que Go a déduit. `%c` affiche une
      rune comme un caractère.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	entier := 42
          	flottant := 3.5
          	vrai := true
          	texte := "Go"
          	octet := byte('A')
          	lettre := 'é'
          	fmt.Printf("%T %T %T %T\n", entier, flottant, vrai, texte)
          	fmt.Printf("%T %v\n", octet, octet)
          	fmt.Printf("%T %v %c\n", lettre, lettre, lettre)
          }
      output: |-
        int float64 bool string
        uint8 65
        int32 233 é
    task:
      instructions: |-
        Range `1 << 40` (un 1 décalé de 40 bits) dans `grand`, pour que le programme affiche `int 1099511627776` : un
        `int` de 64 bits le contient sans problème.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	grand := 1
          	fmt.Printf("%T %v\n", grand, grand)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	grand := 1 << 40
          	fmt.Printf("%T %v\n", grand, grand)
          }
      output: |-
        int 1099511627776
cards:
  - key: byte-rune
    format: course
    question: "Que sont `byte` et `rune` en Go ?"
    choices:
      - {text: "Des alias de `uint8` et `int32` ; une `rune` représente un point de code Unicode", correct: true}
      - {text: "Des alias de `int8` et `uint16`, la `rune` valant le `char` de Java", correct: false}
      - {text: "Deux types distincts de `uint8` et `int32`, qu'il faut convertir", correct: false}
      - {text: "Un octet et un caractère ASCII, tous deux codés sur 8 bits", correct: false}
    answer: "Des alias de `uint8` et `int32` : ce sont exactement ces types. Une `rune` représente un point de code Unicode, sur 32 bits, pas un `char` de 16 bits."
  - key: definition-rune
    format: definition
    question: "Que désigne le type « rune » ?"
    choices:
      - {text: "Un alias de `int32` qui représente un point de code Unicode", correct: true}
      - {text: "Un alias de `uint8` qui représente un octet de texte", correct: false}
      - {text: "Un caractère sur 16 bits, comme le `char` de Java", correct: false}
      - {text: "Une chaîne d'un seul caractère, comme en Python", correct: false}
    answer: "Un alias de `int32` représentant un point de code Unicode : `'é'` est une rune, et `range` sur une chaîne en donne une par caractère."
  - key: int-taille
    format: course
    question: Quelle est la taille d'un `int` en Go ?
    choices:
      - {text: "Celle du mot de la machine : 64 bits sur amd64 et arm64", correct: true}
      - {text: "Toujours 32 bits, comme le `int` de Java", correct: false}
      - {text: "Toujours 64 bits, sur toutes les plateformes", correct: false}
      - {text: "Variable : elle grandit avec la valeur, comme en Python", correct: false}
    answer: "Celle du mot de la machine : 64 bits sur amd64 et arm64, 32 bits sur une plateforme 32 bits. Pour une taille fixe, on prend `int32` ou `int64`."
  - key: chaine-brute
    format: course
    question: Quelle différence entre `"a\nb"` et `` `a\nb` `` ?
    choices:
      - {text: "La première interprète `\\n` en retour à la ligne ; la seconde, brute, le garde tel quel", correct: true}
      - {text: "Aucune : les accents graves ne sont qu'un autre style de guillemets", correct: false}
      - {text: "La seconde est une slice d'octets `[]byte`, la première une `string`", correct: false}
      - {text: "La seconde ne contient qu'un caractère, comme une rune entre apostrophes", correct: false}
    answer: "La première est une chaîne interprétée (le `\\n` est un retour à la ligne) ; la seconde est une chaîne brute, où `\\n` reste deux caractères. Les deux sont des `string`."
  - key: quel-flottant
    format: course
    question: Quel type flottant utiliser par défaut ?
    choices:
      - {text: "`float64` : type par défaut des constantes, et celui de `math`", correct: true}
      - {text: "`float32`, plus rapide et suffisant dans la plupart des cas", correct: false}
      - {text: "`float`, le type flottant générique de Go", correct: false}
      - {text: "`double`, comme en Java ou en C", correct: false}
    answer: "`float64` : c'est le type par défaut des constantes flottantes et celui des fonctions de `math`. Go n'a ni `float` ni `double`."
  - key: vf-byte
    format: true-false
    question: '`byte` est un alias de `uint8`.'
    truth: true
    answer: Ce sont exactement le même type.
  - key: vf-rune
    format: true-false
    question: '`rune` est un alias de `int32` qui représente un point de code Unicode.'
    truth: true
    answer: Un littéral entre apostrophes (`'é'`) est une rune.
  - key: vf-char
    format: true-false
    question: Go possède un type `char` pour les caractères.
    truth: false
    answer: On utilise `rune` pour un point de code et `byte` pour un octet.
  - key: vf-separateur
    format: true-false
    question: '`1_000_000` est un littéral entier valide.'
    truth: true
    answer: Le tiret bas sépare les chiffres pour la lisibilité (depuis Go 1.13).
  - key: qcm-alias
    format: multiple-choice
    question: "Laquelle de ces affirmations est vraie ?"
    choices:
      - {text: "`byte` et `uint8` sont le même type", correct: true}
      - {text: "`int` et `int64` sont le même type", correct: false}
      - {text: "`float` est un type de Go", correct: false}
      - {text: "`char` est un alias de `rune`", correct: false}
    answer: "`byte` est un alias de `uint8`, comme `rune` de `int32`. `int` et `int64` sont deux types distincts, même s'ils ont la même taille ; ni `float` ni `char` n'existent."
  - key: qcm-litteraux
    format: multiple-choice
    question: "Lequel de ces littéraux ne vaut pas 42 ?"
    choices:
      - {text: "`0x42`", correct: true}
      - {text: "`0x2A`", correct: false}
      - {text: "`0b101010`", correct: false}
      - {text: "`0o52`", correct: false}
    answer: "`0x42` vaut 66. `0x2A` (hexadécimal), `0b101010` (binaire) et `0o52` ou `052` (octal) valent tous 42."
  - key: qcm-choix
    format: multiple-choice
    question: Quel type choisir pour stocker des données binaires lues d'un fichier ?
    choices:
      - text: '`[]byte`'
        correct: true
      - text: '`[]rune`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`[]int`'
        correct: false
    answer: '`[]byte` est modifiable et c''est ce que manipulent `io.Reader` et `os.ReadFile`.'
  - key: qcm-rune-litteral
    format: multiple-choice
    question: Quel est le type de `r` dans `r := 'é'` ?
    choices:
      - text: '`rune` (int32)'
        correct: true
      - text: '`byte`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`char`'
        correct: false
    answer: Une constante rune donne une variable de type `rune`.
  - key: trous-rune
    format: fill-in
    question: |-
      Complète le type d'un point de code Unicode :
      ```go
      var initiale ___ = 'A'
      ```
    blanks:
      - - rune
        - int32
    answer: '`rune` est l''alias de `int32` qui représente un caractère.'
  - key: trous-octet
    format: fill-in
    question: |-
      Complète le type des données binaires :
      ```go
      donnees := make([]___, 0, 512)
      ```
    blanks:
      - - byte
        - uint8
    answer: '`[]byte` est le type des données binaires.'
  - key: trous-brute
    format: fill-in
    question: |-
      Complète pour écrire une chaîne brute sur plusieurs lignes :
      ```go
      requete := ___SELECT nom
      FROM client___
      ```
    blanks:
      - - '`'
      - - '`'
    answer: Les accents graves délimitent une chaîne brute, sans échappement.
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour afficher le type d'une valeur :
      ```go
      fmt.Printf("%___\n", x)
      ```
    blanks:
      - - T
    answer: '`%T` affiche le type dynamique.'
  - key: code-types
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a, b, c, d := 1, 2.5, 'x', "x"
      fmt.Printf("%T %T %T %T\n", a, b, c, d)
      ```
    choices:
      - {text: "`int float64 int32 string`", correct: true}
      - {text: "`int float64 rune string`", correct: false}
      - {text: "`int float64 char string`", correct: false}
      - {text: "`int float32 int32 string`", correct: false}
    answer: "`int float64 int32 string` : une rune s'affiche comme `int32`, son type réel, puisque `rune` n'en est qu'un alias."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b, c, d := 1, 2.5, 'x', \"x\"\n\tfmt.Printf(\"%T %T %T %T\\n\", a, b, c, d)\n}\n"
      output: int float64 int32 string
  - key: code-rune-valeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := 'A'
      fmt.Println(r, string(r))
      ```
    choices:
      - {text: "`65 A`", correct: true}
      - {text: "`A A`", correct: false}
      - {text: "`65 65`", correct: false}
      - {text: "`A 65`", correct: false}
    answer: "`65 A` : une rune est un nombre (le point de code) ; `string(r)` donne le caractère."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tr := 'A'\n\tfmt.Println(r, string(r))\n}\n"
      output: 65 A
  - key: code-brute
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(len("a\nb"), len(`a\nb`))
      ```
    choices:
      - {text: "`3 4`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`2 4`", correct: false}
    answer: "`3 4` : dans la chaîne interprétée, `\\n` est un seul caractère ; dans la chaîne brute, il en reste deux."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(len(\"a\\nb\"), len(`a\\nb`))\n}\n"
      output: 3 4
  - key: code-separateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(1_000 + 0x10, 0b11)
      ```
    choices:
      - {text: "`1016 3`", correct: true}
      - {text: "`1010 3`", correct: false}
      - {text: "`1016 11`", correct: false}
      - {text: "Ça ne compile pas : `_` est interdit dans un nombre", correct: false}
    answer: "`1016 3` : `_` sépare les chiffres sans rien changer, `0x10` vaut 16 et `0b11` vaut 3 ; `Println` affiche en décimal."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(1_000 + 0x10, 0b11)\n}\n"
      output: 1016 3
  - key: definition-byte
    format: definition
    question: "Que désigne le type « byte » ?"
    choices:
      - {text: "Un alias de `uint8`, le type d'un octet ; `[]byte` sert aux données binaires", correct: true}
      - {text: "Un alias de `int8`, un entier signé de -128 à 127", correct: false}
      - {text: "Un caractère Unicode, codé sur un ou plusieurs octets", correct: false}
      - {text: "Un type distinct de `uint8`, à convertir pour calculer", correct: false}
    answer: "Un alias de `uint8`, le type d'un octet ; `[]byte` représente des données binaires. Un caractère Unicode, c'est une `rune`."
  - key: definition-uintptr
    format: definition
    question: "Que désigne le type « uintptr » ?"
    choices:
      - {text: "Un entier non signé assez grand pour une adresse, réservé aux usages avec `unsafe`", correct: true}
      - {text: "Un pointeur typé, qui garde l'objet pointé en vie pour le ramasse-miettes", correct: false}
      - {text: "Le type des pointeurs vers des entiers non signés, comme `*uint`", correct: false}
      - {text: "Un entier non signé de taille fixe, toujours sur 64 bits", correct: false}
    answer: "Un entier non signé assez grand pour contenir une adresse mémoire, réservé aux usages bas niveau avec `unsafe`. Ce n'est pas un pointeur : il ne retient pas l'objet pour le GC."
  - key: definition-chaine-brute
    format: definition
    question: "Qu'est-ce qu'une chaîne brute (raw string) en Go ?"
    choices:
      - {text: "Une chaîne entre accents graves, sans échappement, qui peut tenir sur plusieurs lignes", correct: true}
      - {text: "Une chaîne entre guillemets dont le compilateur ne vérifie pas l'encodage UTF-8", correct: false}
      - {text: "Une slice d'octets `[]byte`, qu'on n'a pas encore convertie en `string`", correct: false}
      - {text: "Une chaîne préfixée par `r`, comme `r\"...\"` en Python", correct: false}
    answer: "Une chaîne entre accents graves, sans séquence d'échappement, qui peut tenir sur plusieurs lignes : pratique pour une expression régulière ou une requête SQL."
