notion: visibilite-casse
lesson: "Go n'a pas de mots-clés `public` ou `private`. La **casse de la première lettre** décide :\n- une **majuscule** (`Client`, `Reserver`, `Total`) : le nom est **exporté**, visible depuis les autres packages ;\n- une **minuscule** (`client`, `reserver`, `total`) : il reste **interne au package**.\n\nLa règle vaut pour tout : types, fonctions, méthodes, variables, constantes, **champs de struct**.\n\n```go\npackage stock\n\ntype Article struct {\n\tRef      string // exporté\n\tquantite int    // interne au package stock\n}\n\nfunc Nouveau(ref string) *Article { return &Article{Ref: ref} }\nfunc (a *Article) Quantite() int  { return a.quantite }\n```\n\nL'unité d'encapsulation est le **package**, pas le type : tout le code du package `stock` voit `quantite`. Les autres\npackages passent par les fonctions et méthodes exportées.\n\nConséquences pratiques : `encoding/json` ignore les champs non exportés ; un type non exporté peut être renvoyé par une\nfonction exportée (l'appelant l'utilise sans pouvoir le nommer) ; le dossier `internal/` limite en plus qui peut\nimporter un package.\n\n**Piège classique** : un champ en minuscule dans une struct qu'on sérialise en JSON. Il n'apparaît jamais dans la sortie.\n\n**En entretien** : « Majuscule exporté, minuscule privé au package ; l'encapsulation est au niveau du package ; JSON ne\nvoit que les champs exportés. »"
tour:
  - title: Les noms exportés
    text: |-
      Go n'a ni `public` ni `private` : c'est la **première lettre** d'un nom qui décide. Un nom qui commence par une
      majuscule est **exporté** : on peut s'en servir depuis un autre package, comme `math.Pi` ou `fmt.Println`. Un nom
      qui commence par une minuscule reste **interne** à son package.

      Essaie : écris `math.pi` au lieu de `math.Pi`, puis exécute. Le compilateur refuse : un nom en minuscule n'est
      pas visible hors de son package.

      La règle vaut pour tout : fonctions, types, variables, constantes, et même les champs d'une struct.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.Pi)
          }
      output: "3.141592653589793"
    task:
      instructions: |-
        Le package `math` exporte aussi les limites des types numériques. Fais afficher la plus grande valeur d'un
        entier sur 8 bits : `math.MaxInt8`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.Pi)
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.MaxInt8)
          }
      output: "127"
cards:
  - key: rend-identifiant-public
    format: course
    question: Comment rend-on un identifiant public ?
    choices:
      - {text: "En le faisant commencer par une majuscule", correct: true}
      - {text: "Avec le mot-clé `public` devant sa déclaration", correct: false}
      - {text: "En le listant dans un bloc `export` du package", correct: false}
      - {text: "En le déclarant dans un fichier nommé `public.go`", correct: false}
    answer: "En le faisant commencer par une majuscule ; la visibilité est au niveau du package. Go n'a ni `public` ni `private`."
  - key: champs
    format: course
    question: La règle de la majuscule s'applique-t-elle aux champs de struct ?
    choices:
      - {text: "Oui : un champ en minuscule n'est accessible que dans le package de la struct", correct: true}
      - {text: "Non : tous les champs d'une struct exportée sont publics", correct: false}
      - {text: "Non : un champ en minuscule est privé au type, même dans son package", correct: false}
      - {text: "Non : un champ se rend privé avec une étiquette `private`", correct: false}
    answer: "Oui : un champ en minuscule n'est accessible que depuis le package qui déclare la struct, mais tout ce package y a accès."
  - key: unite
    format: course
    question: Quelle est l'unité d'encapsulation en Go ?
    choices:
      - {text: "Le package : tout son code voit ses noms non exportés", correct: true}
      - {text: "Le type : seules ses méthodes voient ses champs en minuscule", correct: false}
      - {text: "Le fichier : un nom en minuscule n'est visible que dans son fichier", correct: false}
      - {text: "Le module : il voit tous les noms non exportés de ses packages", correct: false}
    answer: "Le package : tout le code d'un package voit ses noms non exportés, quel que soit le type ou le fichier qui les déclare."
  - key: json-champs
    format: course
    question: Pourquoi un champ `nom string` n'apparaît-il pas dans le JSON produit par `json.Marshal` ?
    choices:
      - {text: "`encoding/json` ne voit que les champs exportés : il faut `Nom`, avec un tag", correct: true}
      - {text: "Il manque le tag `json:\"nom\"`, sans lequel aucun champ n'est encodé", correct: false}
      - {text: "`json.Marshal` ignore les champs `string` qui n'ont pas de valeur par défaut", correct: false}
      - {text: "Le champ est vide, et `encoding/json` omet toujours les chaînes vides", correct: false}
    answer: "`encoding/json` ne voit que les champs exportés ; il faut `Nom string` (avec un tag `json:\"nom\"` pour garder le nom en minuscules). Un tag sur un champ non exporté n'y change rien."
  - key: vf-mot-cle
    format: true-false
    question: Go dispose des mots-clés `public` et `private`.
    truth: false
    answer: La visibilité se déduit de la casse de la première lettre du nom.
  - key: vf-meme-package
    format: true-false
    question: Deux fichiers différents du même package peuvent utiliser leurs noms non exportés l'un de l'autre.
    truth: true
    answer: La visibilité est celle du package, pas du fichier.
  - key: vf-methode
    format: true-false
    question: Une méthode `calculer` d'un type exporté est appelable depuis un autre package.
    truth: false
    answer: 'Elle commence par une minuscule : elle reste interne au package.'
  - key: vf-type-non-exporte
    format: true-false
    question: Une fonction exportée peut renvoyer une valeur d'un type non exporté.
    truth: true
    answer: L'appelant peut l'utiliser et appeler ses méthodes exportées, mais pas nommer le type ; un linter le signale souvent comme peu lisible.
  - key: qcm-exportes
    format: multiple-choice
    question: "Lequel de ces noms est exporté ?"
    choices:
      - {text: "`MaxTentatives`", correct: true}
      - {text: "`maxTentatives`", correct: false}
      - {text: "`client`", correct: false}
      - {text: "`_Client`", correct: false}
    answer: "Seule une majuscule initiale exporte, comme dans `MaxTentatives` ou `Client` ; `_` n'est pas une majuscule."
  - key: qcm-acces
    format: multiple-choice
    question: "Depuis le package `main`, avec `a := stock.Nouveau(\"A1\")`, lesquelles de ces expressions compilent ?"
    choices:
      - text: '`a.Ref`'
        correct: true
      - text: '`a.Quantite()`'
        correct: true
      - text: '`a.quantite`'
        correct: false
      - text: '`stock.Article{quantite: 2}`'
        correct: false
    answer: '`quantite` n''est pas exporté : on passe par la méthode `Quantite()`.'
  - key: qcm-encapsuler
    format: multiple-choice
    question: Comment empêcher les autres packages de modifier directement le solde d'un `Compte` ?
    choices:
      - text: Un champ non exporté `solde` et des méthodes exportées qui le modifient
        correct: true
      - text: Un champ exporté `Solde` avec un commentaire « ne pas modifier »
        correct: false
      - text: Le mot-clé `private` devant le champ
        correct: false
      - text: Un champ `const`
        correct: false
    answer: Le champ en minuscule n'est accessible qu'au package ; les méthodes gardent les règles métier.
  - key: qcm-json
    format: multiple-choice
    question: Avec `type U struct { Nom string; age int }`, que contient `json.Marshal(U{"Ada", 36})` ?
    choices:
      - text: '`{"Nom":"Ada"}`'
        correct: true
      - text: '`{"Nom":"Ada","age":36}`'
        correct: false
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
    answer: Le champ non exporté est ignoré, sans erreur.
  - key: trous-exporter
    format: fill-in
    question: |-
      Complète pour que la fonction soit utilisable depuis un autre package :
      ```go
      func ___(ref string) *Article { ... }
      ```
    blanks:
      - - Nouveau
        - New
        - NouvelArticle
        - NewArticle
    answer: Un nom qui commence par une majuscule est exporté.
  - key: trous-champ-prive
    format: fill-in
    question: |-
      Complète pour que la quantité ne soit modifiable que par le package `stock` :
      ```go
      type Article struct {
      	Ref string
      	___ int
      }
      ```
    blanks:
      - - quantite
        - qte
        - stock
    answer: Un champ en minuscule reste interne au package.
  - key: trous-json
    format: fill-in
    question: |-
      Complète pour que le champ soit sérialisé sous la clé `nom` :
      ```go
      type Client struct {
      	___ string `json:"nom"`
      }
      ```
    blanks:
      - - Nom
    answer: Le champ doit être exporté ; le tag donne le nom JSON.
  - key: trous-acces
    format: fill-in
    question: |-
      Complète l'accesseur idiomatique du champ `quantite` :
      ```go
      func (a *Article) ___() int { return a.quantite }
      ```
    blanks:
      - - Quantite
    answer: En Go, l'accesseur porte le nom du champ avec une majuscule, sans préfixe `Get`.
  - key: code-json
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	Nom string
      	age int
      }

      b, _ := json.Marshal(U{"Ada", 36})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"Nom\":\"Ada\"}`", correct: true}
      - {text: "`{\"Nom\":\"Ada\",\"age\":36}`", correct: false}
      - {text: "`{\"nom\":\"Ada\"}`", correct: false}
      - {text: "`{}`", correct: false}
    answer: "`{\"Nom\":\"Ada\"}` : le champ non exporté `age` est ignoré, et sans tag la clé garde le nom du champ, majuscule comprise."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{\"Ada\", 36})\n\tfmt.Println(string(b))\n}\n"
      output: '{"Nom":"Ada"}'
  - key: code-tag
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	Nom string `json:"nom"`
      	Age int    `json:"age"`
      }

      b, _ := json.Marshal(U{"Ada", 36})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"nom\":\"Ada\",\"age\":36}`", correct: true}
      - {text: "`{\"Nom\":\"Ada\",\"Age\":36}`", correct: false}
      - {text: "`{\"nom\":\"Ada\"}`", correct: false}
      - {text: "`{\"nom\":\"Ada\",\"age\":\"36\"}`", correct: false}
    answer: "`{\"nom\":\"Ada\",\"age\":36}` : les tags donnent les clés JSON des champs exportés, et un entier reste un nombre JSON."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string `json:\"nom\"`\n\tAge int    `json:\"age\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{\"Ada\", 36})\n\tfmt.Println(string(b))\n}\n"
      output: '{"nom":"Ada","age":36}'
  - key: code-printf-champs
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	Nom string
      	age int
      }

      fmt.Printf("%+v\n", U{"Ada", 36})
      ```
    choices:
      - {text: "`{Nom:Ada age:36}`", correct: true}
      - {text: "`{Nom:Ada}`", correct: false}
      - {text: "`{Ada 36}`", correct: false}
      - {text: "`{Nom:\"Ada\" age:36}`", correct: false}
    answer: "`{Nom:Ada age:36}` : `fmt` affiche aussi les champs non exportés (il lit la valeur par réflexion), contrairement à `encoding/json`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tfmt.Printf(\"%+v\\n\", U{\"Ada\", 36})\n}\n"
      output: '{Nom:Ada age:36}'
  - key: code-unmarshal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	Nom string
      	age int
      }

      var u U
      json.Unmarshal([]byte(`{"Nom":"Ada","age":36}`), &u)
      fmt.Println(u.Nom, u.age)
      ```
    choices:
      - {text: "`Ada 0`", correct: true}
      - {text: "`Ada 36`", correct: false}
      - {text: "Une panic : le champ `age` n'est pas exporté", correct: false}
      - {text: "Ça ne compile pas : `u.age` est privé", correct: false}
    answer: "`Ada 0` : `Unmarshal` ne peut pas remplir le champ non exporté, et l'ignore sans erreur. `main` lit `u.age` sans souci : c'est son propre package."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tvar u U\n\tjson.Unmarshal([]byte(`{\"Nom\":\"Ada\",\"age\":36}`), &u)\n\tfmt.Println(u.Nom, u.age)\n}\n"
      output: Ada 0
  - key: bug-json-vide
    format: bug-fix
    question: |-
      L'API répond toujours `{}`. Quelle correction est la bonne ?
      ```go
      type reponse struct {
      	statut string
      	total  int
      }
      json.NewEncoder(w).Encode(reponse{"ok", 3})
      ```
    choices:
      - {text: "Exporter les champs, `Statut` et `Total`, avec des tags pour les clés", correct: true}
      - {text: "Exporter le type, `type Reponse struct`, en gardant ses champs", correct: false}
      - {text: "Ajouter des tags `json:\"statut\"` aux champs en minuscule", correct: false}
      - {text: "Passer un pointeur à l'encodeur : `Encode(&reponse{...})`", correct: false}
    answer: |-
      ```go
      type reponse struct {
      	Statut string `json:"statut"`
      	Total  int    `json:"total"`
      }
      ```
      `encoding/json` ignore les champs non exportés, tags ou pas. Le type lui-même peut rester non exporté ; ce sont les champs qui doivent l'être.
  - key: bug-non-exporte
    format: bug-fix
    question: |-
      Dans le package `main`, le compilateur signale « cannot refer to unexported name stock.reserver ». Quelle correction est la bonne ?
      ```go
      stock.reserver("A1", 2)
      ```
    choices:
      - {text: "Exporter la fonction dans `stock` sous le nom `Reserver`, et l'appeler ainsi", correct: true}
      - {text: "Importer `stock` avec un point, `import . \"stock\"`, pour tout voir", correct: false}
      - {text: "Appeler `stock.Reserver` sans rien changer dans le package `stock`", correct: false}
      - {text: "Déplacer `main.go` dans un sous-dossier de `stock/`, pour en hériter", correct: false}
    answer: |-
      ```go
      // dans le package stock
      func Reserver(ref string, n int) error { ... }

      // dans main
      stock.Reserver("A1", 2)
      ```
      Une fonction appelée depuis un autre package doit être exportée (majuscule initiale). Un sous-dossier est un autre package, sans accès aux noms internes.
  - key: bug-champ-public
    format: bug-fix
    question: |-
      N'importe quel package peut rendre un solde négatif. Quelle correction est la bonne ?
      ```go
      type Compte struct {
      	Solde int
      }
      ```
    choices:
      - {text: "Un champ `solde` non exporté, lu par `Solde()` et changé par `Retirer`, qui vérifie", correct: true}
      - {text: "Un commentaire « ne jamais rendre négatif » au-dessus du champ `Solde`", correct: false}
      - {text: "Un type `uint` pour `Solde`, qui ne peut pas devenir négatif", correct: false}
      - {text: "Une méthode `SetSolde` exportée, à côté du champ `Solde` exporté", correct: false}
    answer: |-
      ```go
      type Compte struct {
      	solde int
      }

      func (c *Compte) Solde() int { return c.solde }

      func (c *Compte) Retirer(montant int) error {
      	if montant > c.solde {
      		return errors.New("solde insuffisant")
      	}
      	c.solde -= montant
      	return nil
      }
      ```
      Le champ devient interne au package, et la méthode `Retirer` garde la règle. Un `uint` ferait le tour vers un très grand nombre au lieu de refuser.
  - key: bug-getter
    format: bug-fix
    question: |-
      En revue, comment rendre cet accesseur idiomatique ?
      ```go
      func (a *Article) GetQuantite() int { return a.quantite }
      ```
    choices:
      - {text: "Le renommer `Quantite()`, sans préfixe `Get`", correct: true}
      - {text: "L'appeler `getQuantite()`, en minuscule comme en Java", correct: false}
      - {text: "Exporter le champ `Quantite` et supprimer la méthode", correct: false}
      - {text: "L'appeler `QuantiteGet()`, le verbe en fin de nom", correct: false}
    answer: |-
      ```go
      func (a *Article) Quantite() int { return a.quantite }
      ```
      L'accesseur porte le nom du champ avec une majuscule, sans `Get` ; le mutateur, s'il existe, s'appelle `SetQuantite`.
