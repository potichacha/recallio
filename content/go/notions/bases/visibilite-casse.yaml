notion: visibilite-casse
lesson: "Go n'a pas de mots-clés `public` ou `private`. La **casse de la première lettre** décide :\n- une **majuscule** (`Client`, `Reserver`, `Total`) : le nom est **exporté**, visible depuis les autres packages ;\n- une **minuscule** (`client`, `reserver`, `total`) : il reste **interne au package**.\n\nLa règle vaut pour tout : types, fonctions, méthodes, variables, constantes, **champs de struct**.\n\n```go\npackage stock\n\ntype Article struct {\n\tRef      string // exporté\n\tquantite int    // interne au package stock\n}\n\nfunc Nouveau(ref string) *Article { return &Article{Ref: ref} }\nfunc (a *Article) Quantite() int  { return a.quantite }\n```\n\nL'unité d'encapsulation est le **package**, pas le type : tout le code du package `stock` voit `quantite`. Les autres\npackages passent par les fonctions et méthodes exportées.\n\nConséquences pratiques : `encoding/json` ignore les champs non exportés ; un type non exporté peut être renvoyé par une\nfonction exportée (l'appelant l'utilise sans pouvoir le nommer) ; le dossier `internal/` limite en plus qui peut\nimporter un package.\n\n**Piège classique** : un champ en minuscule dans une struct qu'on sérialise en JSON. Il n'apparaît jamais dans la sortie.\n\n**En entretien** : « Majuscule exporté, minuscule privé au package ; l'encapsulation est au niveau du package ; JSON ne\nvoit que les champs exportés. »"
tour:
  - title: Les noms exportés
    text: |-
      Go n'a ni `public` ni `private` : c'est la **première lettre** d'un nom qui décide. Un nom qui commence par une
      majuscule est **exporté** : on peut s'en servir depuis un autre package, comme `math.Pi` ou `fmt.Println`. Un nom
      qui commence par une minuscule reste **interne** à son package.

      Essaie : écris `math.pi` au lieu de `math.Pi`, puis exécute. Le compilateur refuse : un nom en minuscule n'est
      pas visible hors de son package.

      La règle vaut pour tout : fonctions, types, variables, constantes, et même les champs d'une struct.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.Pi)
          }
      output: "3.141592653589793"
    task:
      instructions: |-
        Le package `math` exporte aussi les limites des types numériques. Fais afficher la plus grande valeur d'un
        entier sur 8 bits : `math.MaxInt8`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.Pi)
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          func main() {
          	fmt.Println(math.MaxInt8)
          }
      output: "127"
cards:
  - key: rend-identifiant-public
    format: course
    question: Comment rend-on un identifiant public ?
    answer: En le faisant commencer par une majuscule ; la visibilité est au niveau du package.
  - key: champs
    format: course
    question: La règle de la majuscule s'applique-t-elle aux champs de struct ?
    answer: 'Oui : un champ en minuscule n''est accessible que depuis le package qui déclare la struct.'
  - key: unite
    format: course
    question: Quelle est l'unité d'encapsulation en Go ?
    answer: 'Le package : tout le code d''un package voit ses noms non exportés, quel que soit le type qui les déclare.'
  - key: json-champs
    format: course
    question: Pourquoi un champ `nom string` n'apparaît-il pas dans le JSON produit par `json.Marshal` ?
    answer: '`encoding/json` ne voit que les champs exportés ; il faut `Nom string` (avec un tag `json:"nom"` pour garder le nom en minuscules).'
  - key: vf-mot-cle
    format: true-false
    question: Go dispose des mots-clés `public` et `private`.
    truth: false
    answer: La visibilité se déduit de la casse de la première lettre du nom.
  - key: vf-meme-package
    format: true-false
    question: Deux fichiers différents du même package peuvent utiliser leurs noms non exportés l'un de l'autre.
    truth: true
    answer: La visibilité est celle du package, pas du fichier.
  - key: vf-methode
    format: true-false
    question: Une méthode `calculer` d'un type exporté est appelable depuis un autre package.
    truth: false
    answer: 'Elle commence par une minuscule : elle reste interne au package.'
  - key: vf-type-non-exporte
    format: true-false
    question: Une fonction exportée peut renvoyer une valeur d'un type non exporté.
    truth: true
    answer: L'appelant peut l'utiliser et appeler ses méthodes exportées, mais pas nommer le type ; un linter le signale souvent comme peu lisible.
  - key: qcm-exportes
    format: multiple-choice
    question: Quels noms sont exportés ?
    choices:
      - text: '`Client`'
        correct: true
      - text: '`MaxTentatives`'
        correct: true
      - text: '`client`'
        correct: false
      - text: '`_Client`'
        correct: false
    answer: Seule une majuscule initiale exporte ; `_` n'est pas une majuscule.
  - key: qcm-acces
    format: multiple-choice
    question: Depuis le package `main`, qu'est-ce qui compile avec `a := stock.Nouveau("A1")` ?
    choices:
      - text: '`a.Ref`'
        correct: true
      - text: '`a.Quantite()`'
        correct: true
      - text: '`a.quantite`'
        correct: false
      - text: '`stock.Article{quantite: 2}`'
        correct: false
    answer: '`quantite` n''est pas exporté : on passe par la méthode `Quantite()`.'
  - key: qcm-encapsuler
    format: multiple-choice
    question: Comment empêcher les autres packages de modifier directement le solde d'un `Compte` ?
    choices:
      - text: Un champ non exporté `solde` et des méthodes exportées qui le modifient
        correct: true
      - text: Un champ exporté `Solde` avec un commentaire « ne pas modifier »
        correct: false
      - text: Le mot-clé `private` devant le champ
        correct: false
      - text: Un champ `const`
        correct: false
    answer: Le champ en minuscule n'est accessible qu'au package ; les méthodes gardent les règles métier.
  - key: qcm-json
    format: multiple-choice
    question: Avec `type U struct { Nom string; age int }`, que contient `json.Marshal(U{"Ada", 36})` ?
    choices:
      - text: '`{"Nom":"Ada"}`'
        correct: true
      - text: '`{"Nom":"Ada","age":36}`'
        correct: false
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
    answer: Le champ non exporté est ignoré, sans erreur.
  - key: trous-exporter
    format: fill-in
    question: |-
      Complétez pour que la fonction soit utilisable depuis un autre package :
      ```go
      func ___(ref string) *Article { ... }
      ```
    blanks:
      - - Nouveau
        - New
        - NouvelArticle
        - NewArticle
    answer: Un nom qui commence par une majuscule est exporté.
  - key: trous-champ-prive
    format: fill-in
    question: "Complétez pour que la quantité ne soit modifiable que par le package `stock` :\n```go\ntype Article struct {\n\tRef string\n\t___ int\n}\n```"
    blanks:
      - - quantite
        - qte
        - stock
    answer: Un champ en minuscule reste interne au package.
  - key: trous-json
    format: fill-in
    question: "Complétez pour que le champ soit sérialisé sous la clé `nom` :\n```go\ntype Client struct {\n\t___ string `json:\"nom\"`\n}\n```"
    blanks:
      - - Nom
    answer: Le champ doit être exporté ; le tag donne le nom JSON.
  - key: trous-acces
    format: fill-in
    question: |-
      Complétez l'accesseur idiomatique du champ `quantite` :
      ```go
      func (a *Article) ___() int { return a.quantite }
      ```
    blanks:
      - - Quantite
    answer: En Go, l'accesseur porte le nom du champ avec une majuscule, sans préfixe `Get`.
  - key: code-json
    format: code-output
    question: "```go\ntype U struct {\n\tNom string\n\tage int\n}\n\nb, _ := json.Marshal(U{\"Ada\", 36})\nfmt.Println(string(b))\n```"
    answer: '`{"Nom":"Ada"}` : le champ non exporté `age` est ignoré.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{\"Ada\", 36})\n\tfmt.Println(string(b))\n}\n"
      output: '{"Nom":"Ada"}'
  - key: code-tag
    format: code-output
    question: "```go\ntype U struct {\n\tNom string `json:\"nom\"`\n\tAge int    `json:\"age\"`\n}\n\nb, _ := json.Marshal(U{\"Ada\", 36})\nfmt.Println(string(b))\n```"
    answer: '`{"nom":"Ada","age":36}` : les tags donnent les clés JSON des champs exportés.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string `json:\"nom\"`\n\tAge int    `json:\"age\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{\"Ada\", 36})\n\tfmt.Println(string(b))\n}\n"
      output: '{"nom":"Ada","age":36}'
  - key: code-printf-champs
    format: code-output
    question: "```go\ntype U struct {\n\tNom string\n\tage int\n}\n\nfmt.Printf(\"%+v\\n\", U{\"Ada\", 36})\n```"
    answer: '`{Nom:Ada age:36}` : `fmt` affiche aussi les champs non exportés (il lit la valeur par réflexion), contrairement à `encoding/json`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tfmt.Printf(\"%+v\\n\", U{\"Ada\", 36})\n}\n"
      output: '{Nom:Ada age:36}'
  - key: code-unmarshal
    format: code-output
    question: "```go\ntype U struct {\n\tNom string\n\tage int\n}\n\nvar u U\njson.Unmarshal([]byte(`{\"Nom\":\"Ada\",\"age\":36}`), &u)\nfmt.Println(u.Nom, u.age)\n```"
    answer: '`Ada 0` : `Unmarshal` ne peut pas remplir le champ non exporté.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tNom string\n\tage int\n}\n\nfunc main() {\n\tvar u U\n\tjson.Unmarshal([]byte(`{\"Nom\":\"Ada\",\"age\":36}`), &u)\n\tfmt.Println(u.Nom, u.age)\n}\n"
      output: Ada 0
  - key: bug-json-vide
    format: bug-fix
    question: "L'API répond toujours `{}` :\n```go\ntype reponse struct {\n\tstatut string\n\ttotal  int\n}\njson.NewEncoder(w).Encode(reponse{\"ok\", 3})\n```"
    answer: "```go\ntype reponse struct {\n\tStatut string `json:\"statut\"`\n\tTotal  int    `json:\"total\"`\n}\n```\n`encoding/json` ignore les champs non exportés. Le type lui-même peut rester non exporté ; ce sont les champs qui\ndoivent l'être."
  - key: bug-non-exporte
    format: bug-fix
    question: |-
      Dans le package `main`, le compilateur signale « cannot refer to unexported name stock.reserver » :
      ```go
      stock.reserver("A1", 2)
      ```
    answer: |-
      ```go
      // dans le package stock
      func Reserver(ref string, n int) error { ... }

      // dans main
      stock.Reserver("A1", 2)
      ```
      Une fonction appelée depuis un autre package doit être exportée (majuscule initiale).
  - key: bug-champ-public
    format: bug-fix
    question: "N'importe quel package peut rendre un solde négatif :\n```go\ntype Compte struct {\n\tSolde int\n}\n```"
    answer: "```go\ntype Compte struct {\n\tsolde int\n}\n\nfunc (c *Compte) Solde() int { return c.solde }\n\nfunc (c *Compte) Retirer(montant int) error {\n\tif montant > c.solde {\n\t\treturn errors.New(\"solde insuffisant\")\n\t}\n\tc.solde -= montant\n\treturn nil\n}\n```\nLe champ devient interne au package, et la méthode `Retirer` garde la règle."
  - key: bug-getter
    format: bug-fix
    question: |-
      En revue, on te demande de rendre ce code idiomatique :
      ```go
      func (a *Article) GetQuantite() int { return a.quantite }
      ```
    answer: |-
      ```go
      func (a *Article) Quantite() int { return a.quantite }
      ```
      L'accesseur porte le nom du champ avec une majuscule, sans `Get` ; le mutateur, s'il existe, s'appelle
      `SetQuantite`.
