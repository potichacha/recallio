notion: debordement-flottants
lesson: |-
  **Les entiers débordent sans erreur** : au-delà de la plage, la valeur « fait le tour » (arithmétique modulaire).
  `int8(127) + 1` donne `-128`, et `uint8(0) - 1` donne `255`. Ni panique ni exception : c'est au code de vérifier.
  Les limites sont dans `math` (`math.MaxInt64`, `math.MinInt32`, `math.MaxUint8`...).

  Seules les **constantes** sont contrôlées : `var b int8 = 200` ne compile pas (« constant 200 overflows int8 »), car
  la valeur est connue à la compilation.

  **Les flottants** suivent IEEE 754 : `0.1 + 0.2` ne vaut pas exactement `0.3` (`0.30000000000000004`). Mais
  attention : avec des **constantes**, le calcul se fait en précision arbitraire à la compilation, et `0.1+0.2 == 0.3`
  est vrai. La différence apparaît dès qu'on passe par des variables `float64`.

  Conséquences :
  - comparer des flottants avec une tolérance (`math.Abs(a-b) < 1e-9`), jamais avec `==` après calcul ;
  - pas de flottant pour l'**argent** : des centimes en `int64`, ou un type décimal ;
  - une division flottante par zéro donne `+Inf` ou `NaN` (pas de panique), mais une division **entière** par zéro
    panique (« integer divide by zero ») ;
  - `NaN != NaN` : il faut `math.IsNaN`.

  **Piège classique** : calculer le milieu d'un intervalle par `(bas + haut) / 2`, qui peut déborder ; on écrit
  `bas + (haut-bas)/2`.

  **En entretien** : « Les entiers débordent silencieusement, les flottants sont IEEE 754 ; jamais d'argent en float, des
  comparaisons avec tolérance, et les constantes sont calculées en précision arbitraire. »
cards:
  - key: code-fmt-println-0-1-0
    format: code-output
    question: '`fmt.Println(0.1+0.2 == 0.3)`'
    answer: '`true` ! Ce sont des **constantes non typées**, calculées en précision arbitraire à la compilation.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(0.1+0.2 == 0.3)\n}\n"
      output: 'true'
  - key: code-b-0-1-0-2
    format: code-output
    question: '`a, b := 0.1, 0.2; fmt.Println(a+b == 0.3, a+b)`'
    answer: '`false 0.30000000000000004` : ce sont maintenant des variables `float64`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 0.1, 0.2\n\tfmt.Println(a+b == 0.3, a+b)\n}\n"
      output: false 0.30000000000000004
  - key: code-var-i8-int8-127-i8
    format: code-output
    question: '`var i8 int8 = 127; i8++; fmt.Println(i8)`'
    answer: '`-128` : débordement silencieux.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar i8 int8 = 127\n\ti8++\n\tfmt.Println(i8)\n}\n"
      output: '-128'
  - key: code-var-x-uint8-0-x
    format: code-output
    question: '`var x uint8 = 0; x--; fmt.Println(x)`'
    answer: '`255`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar x uint8 = 0\n\tx--\n\tfmt.Println(x)\n}\n"
      output: '255'
  - key: eviter-debordement-calcul-milieu
    format: course
    question: Comment éviter le débordement dans le calcul du milieu ?
    answer: lo + (hi-lo)/2.
  - key: limites
    format: course
    question: Où trouver la plus grande valeur d'un `int64` ?
    answer: Dans la constante `math.MaxInt64` (de même `math.MinInt64`, `math.MaxUint8`, etc.).
  - key: argent
    format: course
    question: Comment représenter un montant d'argent en Go ?
    answer: En entier de la plus petite unité (des centimes en `int64`), ou avec un type décimal d'une bibliothèque ; jamais en `float64`.
  - key: division-zero
    format: course
    question: Que se passe-t-il en divisant par zéro un entier, puis un flottant ?
    answer: La division entière par zéro panique (« integer divide by zero ») ; la division flottante donne `+Inf`, `-Inf` ou `NaN`, sans panique.
  - key: vf-panique
    format: true-false
    question: Un débordement d'entier provoque une panique en Go.
    truth: false
    answer: La valeur fait le tour silencieusement ; seules les constantes sont vérifiées à la compilation.
  - key: vf-constante-deborde
    format: true-false
    question: '`var b int8 = 200` ne compile pas.'
    truth: true
    answer: '« constant 200 overflows int8 » : une constante est contrôlée à la compilation.'
  - key: vf-nan
    format: true-false
    question: '`math.NaN() == math.NaN()` vaut `true`.'
    truth: false
    answer: NaN n'est égal à rien, pas même à lui-même ; on teste avec `math.IsNaN`.
  - key: vf-constantes-precision
    format: true-false
    question: Les constantes numériques sont calculées en précision arbitraire à la compilation.
    truth: true
    answer: C'est pourquoi `0.1+0.2 == 0.3` est vrai avec des constantes, et faux avec des variables float64.
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer deux résultats de calculs flottants ?
    choices:
      - text: '`math.Abs(a-b) < epsilon`'
        correct: true
      - text: '`a == b`'
        correct: false
      - text: '`int(a) == int(b)`'
        correct: false
      - text: '`a.Equals(b)`'
        correct: false
    answer: Les erreurs d'arrondi rendent `==` peu fiable ; la tolérance dépend du domaine.
  - key: qcm-milieu
    format: multiple-choice
    question: Quelle expression calcule le milieu sans risque de débordement ?
    choices:
      - text: '`bas + (haut-bas)/2`'
        correct: true
      - text: '`(bas + haut) / 2`'
        correct: false
      - text: '`bas/2 + haut`'
        correct: false
      - text: '`(bas + haut) >> 2`'
        correct: false
    answer: '`bas + haut` peut dépasser la plage du type ; la différence ne le peut pas.'
  - key: qcm-paniquent
    format: multiple-choice
    question: Quelles opérations paniquent ?
    choices:
      - text: '`a / b` avec deux int et `b == 0`'
        correct: true
      - text: '`a / b` avec deux float64 et `b == 0`'
        correct: false
      - text: '`x + 1` avec `x == math.MaxInt64`'
        correct: false
      - text: '`int8(300)` avec 300 dans une variable'
        correct: false
    answer: Seule la division entière par zéro panique ; les autres débordent ou donnent Inf.
  - key: qcm-somme-euros
    format: multiple-choice
    question: Pourquoi éviter `var prix float64 = 0.1` pour des euros ?
    choices:
      - text: 0.1 n'a pas de représentation binaire exacte, et les erreurs s'accumulent dans les sommes
        correct: true
      - text: float64 ne peut pas représenter les nombres négatifs
        correct: false
      - text: Go interdit les flottants dans les calculs financiers
        correct: false
      - text: float64 est plus lent que int64 au point d'être inutilisable
        correct: false
    answer: Des centimes entiers évitent toute erreur d'arrondi.
  - key: code-division-flottante
    format: code-output
    question: |-
      ```go
      zero := 0.0
      fmt.Println(1/zero, -1/zero, zero/zero)
      ```
    answer: '`+Inf -Inf NaN` : la division flottante par zéro ne panique pas.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tzero := 0.0\n\tfmt.Println(1/zero, -1/zero, zero/zero)\n}\n"
      output: +Inf -Inf NaN
  - key: code-division-entiere
    format: code-output
    question: |-
      ```go
      a, b := 10, 0
      fmt.Println("avant")
      fmt.Println(a / b)
      ```
    answer: '`avant`, puis une panique « integer divide by zero ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 10, 0\n\tfmt.Println(\"avant\")\n\tfmt.Println(a / b)\n}\n"
      output: avant
      panics: integer divide by zero
  - key: code-maxint
    format: code-output
    question: |-
      ```go
      x := math.MaxInt64
      x++
      fmt.Println(x == math.MinInt64)
      ```
    answer: '`true` : la valeur fait le tour, sans erreur.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n\nfunc main() {\n\tx := math.MaxInt64\n\tx++\n\tfmt.Println(x == math.MinInt64)\n}\n"
      output: 'true'
  - key: bug-argent
    format: bug-fix
    question: "La somme de trois articles à 0,10 € ne vaut pas 0,30 € :\n```go\ntotal := 0.0\nfor _, a := range articles {\n\ttotal += a.Prix // Prix float64\n}\nif total == 0.30 { ... }\n```"
    answer: "```go\ntype Article struct {\n\tPrixCentimes int64\n}\n\nvar total int64\nfor _, a := range articles {\n\ttotal += a.PrixCentimes\n}\nif total == 30 { ... }\n```\nDes centimes entiers sont exacts ; les flottants accumulent des erreurs d'arrondi."
  - key: bug-milieu
    format: bug-fix
    question: |-
      Une recherche dichotomique boucle mal sur de très grands tableaux indexés par int32 :
      ```go
      milieu := (bas + haut) / 2
      ```
    answer: |-
      ```go
      milieu := bas + (haut-bas)/2
      ```
      `bas + haut` peut dépasser la plage du type et devenir négatif.
  - key: bug-division
    format: bug-fix
    question: |-
      Le service panique quand une commande n'a aucun article :
      ```go
      prixMoyen := total / len(articles)
      ```
    answer: "```go\nif len(articles) == 0 {\n\treturn 0, errors.New(\"commande vide\")\n}\nprixMoyen := total / len(articles)\n```\nUne division entière par zéro panique : on traite le cas vide avant."
  - key: bug-egalite
    format: bug-fix
    question: "Ce test échoue alors que le calcul semble juste :\n```go\nif taux*3 != 0.3 { // taux vaut 0.1 dans une variable\n\tt.Error(\"calcul faux\")\n}\n```"
    answer: "```go\nif math.Abs(taux*3-0.3) > 1e-9 {\n\tt.Error(\"calcul faux\")\n}\n```\nAvec des variables float64, `0.1*3` vaut `0.30000000000000004` ; on compare avec une tolérance."
