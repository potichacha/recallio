notion: debordement-flottants
lesson: |-
  **Les entiers débordent sans erreur** : au-delà de la plage, la valeur « fait le tour » (arithmétique modulaire).
  `int8(127) + 1` donne `-128`, et `uint8(0) - 1` donne `255`. Ni panique ni exception : c'est au code de vérifier.
  Les limites sont dans `math` (`math.MaxInt64`, `math.MinInt32`, `math.MaxUint8`...).

  Seules les **constantes** sont contrôlées : `var b int8 = 200` ne compile pas (« constant 200 overflows int8 »), car
  la valeur est connue à la compilation.

  **Les flottants** suivent IEEE 754 : `0.1 + 0.2` ne vaut pas exactement `0.3` (`0.30000000000000004`). Mais
  attention : avec des **constantes**, le calcul se fait en précision arbitraire à la compilation, et `0.1+0.2 == 0.3`
  est vrai. La différence apparaît dès qu'on passe par des variables `float64`.

  Conséquences :
  - comparer des flottants avec une tolérance (`math.Abs(a-b) < 1e-9`), jamais avec `==` après calcul ;
  - pas de flottant pour l'**argent** : des centimes en `int64`, ou un type décimal ;
  - une division flottante par zéro donne `+Inf` ou `NaN` (pas de panique), mais une division **entière** par zéro
    panique (« integer divide by zero ») ;
  - `NaN != NaN` : il faut `math.IsNaN`.

  **Piège classique** : calculer le milieu d'un intervalle par `(bas + haut) / 2`, qui peut déborder ; on écrit
  `bas + (haut-bas)/2`.

  **En entretien** : « Les entiers débordent silencieusement, les flottants sont IEEE 754 ; jamais d'argent en float, des
  comparaisons avec tolérance, et les constantes sont calculées en précision arbitraire. »
cards:
  - key: code-fmt-println-0-1-0
    format: code-output
    question: "Qu'affiche `fmt.Println(0.1+0.2 == 0.3)` ?"
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Ça ne compile pas : on ne compare pas des flottants avec `==`", correct: false}
    answer: "`true` : ce sont des constantes non typées, calculées en précision arbitraire à la compilation. Avec des variables `float64`, on obtiendrait `false`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(0.1+0.2 == 0.3)\n}\n"
      output: 'true'
  - key: code-b-0-1-0-2
    format: code-output
    question: "Qu'affiche `a, b := 0.1, 0.2; fmt.Println(a+b == 0.3, a+b)` ?"
    choices:
      - {text: "`false 0.30000000000000004`", correct: true}
      - {text: "`true 0.3`", correct: false}
      - {text: "`false 0.3`", correct: false}
      - {text: "`true 0.30000000000000004`", correct: false}
    answer: "`false 0.30000000000000004` : ce sont maintenant des variables `float64`, et ni 0,1 ni 0,2 ne s'écrivent exactement en binaire."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 0.1, 0.2\n\tfmt.Println(a+b == 0.3, a+b)\n}\n"
      output: false 0.30000000000000004
  - key: code-var-i8-int8-127-i8
    format: code-output
    question: "Qu'affiche `var i8 int8 = 127; i8++; fmt.Println(i8)` ?"
    choices:
      - {text: "`-128`", correct: true}
      - {text: "`128`", correct: false}
      - {text: "`127`", correct: false}
      - {text: "Une panic : dépassement de capacité d'un `int8`", correct: false}
    answer: "`-128` : le débordement d'un entier est silencieux, la valeur fait le tour. Ni panic, ni saturation à 127."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar i8 int8 = 127\n\ti8++\n\tfmt.Println(i8)\n}\n"
      output: '-128'
  - key: code-var-x-uint8-0-x
    format: code-output
    question: "Qu'affiche `var x uint8 = 0; x--; fmt.Println(x)` ?"
    choices:
      - {text: "`255`", correct: true}
      - {text: "`-1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Une panic : un `uint8` ne descend pas sous zéro", correct: false}
    answer: "`255` : un entier non signé qui passe sous zéro fait le tour, sans panic."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar x uint8 = 0\n\tx--\n\tfmt.Println(x)\n}\n"
      output: '255'
  - key: eviter-debordement-calcul-milieu
    format: course
    question: "Comment calculer le milieu de `lo` et `hi` sans risquer de débordement ?"
    choices:
      - {text: "`lo + (hi-lo)/2`", correct: true}
      - {text: "`(lo + hi) / 2`", correct: false}
      - {text: "`(lo + hi) >> 1`", correct: false}
      - {text: "`lo/2 + hi/2`", correct: false}
    answer: "`lo + (hi-lo)/2` : `hi-lo` reste dans la plage, alors que `lo + hi` peut déborder et devenir négatif, décalé ou non. `lo/2 + hi/2` perd 1 quand les deux sont impairs."
  - key: limites
    format: course
    question: Où trouver la plus grande valeur d'un `int64` ?
    choices:
      - {text: "Dans la constante `math.MaxInt64`", correct: true}
      - {text: "Dans le champ `int64.MaxValue`, comme en C#", correct: false}
      - {text: "Avec l'appel de fonction `math.Max(int64)`", correct: false}
      - {text: "Dans la constante `limits.Int64Max`", correct: false}
    answer: "Dans la constante `math.MaxInt64` (de même `math.MinInt64`, `math.MaxUint8`, etc.). Les types de base de Go n'ont ni champ ni méthode."
  - key: argent
    format: course
    question: Comment représenter un montant d'argent en Go ?
    choices:
      - {text: "En entier de la plus petite unité, comme des centimes en `int64`", correct: true}
      - {text: "En `float64`, arrondi à deux décimales après chaque opération", correct: false}
      - {text: "En `float32`, qui suffit pour des montants à deux décimales", correct: false}
      - {text: "En chaîne `\"12.50\"`, convertie en `float64` pour chaque calcul", correct: false}
    answer: "En entier de la plus petite unité (des centimes en `int64`), ou avec un type décimal d'une bibliothèque ; jamais en flottant, qui ne représente pas exactement 0,10."
  - key: division-zero
    format: course
    question: "Que se passe-t-il en divisant par zéro une variable entière, puis une variable flottante ?"
    choices:
      - {text: "L'entière panique ; la flottante donne `+Inf`, `-Inf` ou `NaN`", correct: true}
      - {text: "Les deux paniquent avec « integer divide by zero »", correct: false}
      - {text: "Les deux renvoient 0, sans panic ni erreur", correct: false}
      - {text: "L'entière renvoie une erreur ; la flottante panique", correct: false}
    answer: "La division entière par zéro panique (« integer divide by zero ») ; la division flottante donne `+Inf`, `-Inf` ou `NaN`, sans panic. Par une constante zéro, la division entière ne compile même pas."
  - key: vf-panique
    format: true-false
    question: Un débordement d'entier provoque une panique en Go.
    truth: false
    answer: La valeur fait le tour silencieusement ; seules les constantes sont vérifiées à la compilation.
  - key: vf-constante-deborde
    format: true-false
    question: '`var b int8 = 200` ne compile pas.'
    truth: true
    answer: '« constant 200 overflows int8 » : une constante est contrôlée à la compilation.'
  - key: vf-nan
    format: true-false
    question: '`math.NaN() == math.NaN()` vaut `true`.'
    truth: false
    answer: NaN n'est égal à rien, pas même à lui-même ; on teste avec `math.IsNaN`.
  - key: vf-constantes-precision
    format: true-false
    question: Les constantes numériques sont calculées en précision arbitraire à la compilation.
    truth: true
    answer: C'est pourquoi `0.1+0.2 == 0.3` est vrai avec des constantes, et faux avec des variables float64.
  - key: qcm-comparer
    format: multiple-choice
    question: Comment comparer deux résultats de calculs flottants ?
    choices:
      - text: '`math.Abs(a-b) < epsilon`'
        correct: true
      - text: '`a == b`'
        correct: false
      - text: '`int(a) == int(b)`'
        correct: false
      - text: '`a.Equals(b)`'
        correct: false
    answer: Les erreurs d'arrondi rendent `==` peu fiable ; la tolérance dépend du domaine.
  - key: qcm-milieu
    format: multiple-choice
    question: Quelle expression calcule le milieu sans risque de débordement ?
    choices:
      - text: '`bas + (haut-bas)/2`'
        correct: true
      - text: '`(bas + haut) / 2`'
        correct: false
      - text: '`bas/2 + haut`'
        correct: false
      - text: '`(bas + haut) >> 2`'
        correct: false
    answer: '`bas + haut` peut dépasser la plage du type ; la différence ne le peut pas.'
  - key: qcm-paniquent
    format: multiple-choice
    question: Quelles opérations paniquent ?
    choices:
      - text: '`a / b` avec deux int et `b == 0`'
        correct: true
      - text: '`a / b` avec deux float64 et `b == 0`'
        correct: false
      - text: '`x + 1` avec `x == math.MaxInt64`'
        correct: false
      - text: '`int8(300)` avec 300 dans une variable'
        correct: false
    answer: Seule la division entière par zéro panique ; les autres débordent ou donnent Inf.
  - key: qcm-somme-euros
    format: multiple-choice
    question: Pourquoi éviter `var prix float64 = 0.1` pour des euros ?
    choices:
      - text: 0.1 n'a pas de représentation binaire exacte, et les erreurs s'accumulent dans les sommes
        correct: true
      - text: float64 ne peut pas représenter les nombres négatifs
        correct: false
      - text: Go interdit les flottants dans les calculs financiers
        correct: false
      - text: float64 est plus lent que int64 au point d'être inutilisable
        correct: false
    answer: Des centimes entiers évitent toute erreur d'arrondi.
  - key: code-division-flottante
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      zero := 0.0
      fmt.Println(1/zero, -1/zero, zero/zero)
      ```
    choices:
      - {text: "`+Inf -Inf NaN`", correct: true}
      - {text: "`Inf -Inf NaN`", correct: false}
      - {text: "`0 0 0`", correct: false}
      - {text: "Une panic : division par zéro", correct: false}
    answer: "`+Inf -Inf NaN` : la division flottante par zéro suit la norme IEEE 754 et ne panique pas ; `Println` écrit le signe de l'infini positif."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tzero := 0.0\n\tfmt.Println(1/zero, -1/zero, zero/zero)\n}\n"
      output: +Inf -Inf NaN
  - key: code-division-entiere
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a, b := 10, 0
      fmt.Println("avant")
      fmt.Println(a / b)
      ```
    choices:
      - {text: "`avant`, puis une panic : integer divide by zero", correct: true}
      - {text: "`avant`, puis `+Inf`", correct: false}
      - {text: "`avant`, puis `0`", correct: false}
      - {text: "Ça ne compile pas : division par zéro", correct: false}
    answer: "`avant`, puis une panic « integer divide by zero ». Le diviseur est une variable : le compilateur ne voit rien, et seule la division flottante donnerait `+Inf`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 10, 0\n\tfmt.Println(\"avant\")\n\tfmt.Println(a / b)\n}\n"
      output: avant
      panics: integer divide by zero
  - key: code-maxint
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := math.MaxInt64
      x++
      fmt.Println(x == math.MinInt64)
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Une panic : dépassement d'un `int64`", correct: false}
      - {text: "Ça ne compile pas : `x` dépasse `math.MaxInt64`", correct: false}
    answer: "`true` : la valeur fait le tour, sans erreur ni panic. Le compilateur ne refuse que le dépassement d'une constante, pas celui d'une variable."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n\nfunc main() {\n\tx := math.MaxInt64\n\tx++\n\tfmt.Println(x == math.MinInt64)\n}\n"
      output: 'true'
  - key: bug-argent
    format: bug-fix
    question: |-
      La somme de trois articles à 0,10 € ne vaut pas 0,30 €. Quelle correction est la bonne ?
      ```go
      total := 0.0
      for _, a := range articles {
      	total += a.Prix // Prix float64
      }
      if total == 0.30 { ... }
      ```
    choices:
      - {text: "Stocker les prix en centimes entiers (`int64`) et comparer `total == 30`", correct: true}
      - {text: "Arrondir `total` avec `math.Round` à chaque tour de boucle, en euros", correct: false}
      - {text: "Passer les prix en `float32`, plus précis pour de petits montants", correct: false}
      - {text: "Comparer avec `total >= 0.30` plutôt qu'avec une égalité stricte", correct: false}
    answer: |-
      ```go
      type Article struct {
      	PrixCentimes int64
      }

      var total int64
      for _, a := range articles {
      	total += a.PrixCentimes
      }
      if total == 30 { ... }
      ```
      Des centimes entiers sont exacts ; les flottants accumulent des erreurs d'arrondi, et `float32` en fait davantage.
  - key: bug-milieu
    format: bug-fix
    question: |-
      Une recherche dichotomique boucle mal sur de très grands tableaux indexés par int32. Quelle correction est la bonne ?
      ```go
      milieu := (bas + haut) / 2
      ```
    choices:
      - {text: "`milieu := bas + (haut-bas)/2`", correct: true}
      - {text: "`milieu := (bas + haut) >> 1`", correct: false}
      - {text: "`milieu := (bas + haut) / 2.0`", correct: false}
      - {text: "`milieu := bas/2 + haut/2`", correct: false}
    answer: |-
      ```go
      milieu := bas + (haut-bas)/2
      ```
      `bas + haut` peut dépasser la plage du type et devenir négatif ; `haut-bas` reste dans la plage. `bas/2 + haut/2` perd 1 quand les deux sont impairs.
  - key: bug-division
    format: bug-fix
    question: |-
      Le service panique quand une commande n'a aucun article. Quelle correction est la bonne ?
      ```go
      prixMoyen := total / len(articles)
      ```
    choices:
      - {text: "Traiter la commande vide avant de diviser, et renvoyer une erreur", correct: true}
      - {text: "Entourer la division d'un `recover`, qui renvoie 0 à la place", correct: false}
      - {text: "Convertir en `float64`, pour obtenir `NaN` au lieu de la panic", correct: false}
      - {text: "Diviser par `len(articles) + 1`, pour ne jamais diviser par zéro", correct: false}
    answer: |-
      ```go
      if len(articles) == 0 {
      	return 0, errors.New("commande vide")
      }
      prixMoyen := total / len(articles)
      ```
      Une division entière par zéro panique : on traite le cas vide avant. Un `NaN` ou un 0 silencieux cacherait l'erreur au lieu de la signaler.
  - key: bug-egalite
    format: bug-fix
    question: |-
      Ce test échoue alors que le calcul semble juste. Quelle correction est la bonne ?
      ```go
      if taux*3 != 0.3 { // taux vaut 0.1 dans une variable
      	t.Error("calcul faux")
      }
      ```
    choices:
      - {text: "Comparer avec une tolérance : `math.Abs(taux*3-0.3) > 1e-9`", correct: true}
      - {text: "Écrire la constante avec deux décimales : `taux*3 != 0.30`", correct: false}
      - {text: "Convertir les deux côtés en `float32` avant de les comparer", correct: false}
      - {text: "Comparer les textes : `fmt.Sprint(taux*3) != \"0.3\"`", correct: false}
    answer: |-
      ```go
      if math.Abs(taux*3-0.3) > 1e-9 {
      	t.Error("calcul faux")
      }
      ```
      Avec des variables float64, `0.1*3` vaut `0.30000000000000004` ; on compare avec une tolérance. Son texte n'est pas non plus `0.3`.
