notion: identifiant-blanc
lesson: |-
  L'**identifiant blanc** `_` est un nom qui jette ce qu'on lui donne. Il sert à :

  - **ignorer une valeur de retour** : `_, err := fmt.Sscan(s, &x)` ;
  - **ignorer l'indice ou la valeur** d'un `range` : `for _, v := range xs`, `for i := range xs` ;
  - **importer pour les effets de bord** : `import _ "github.com/jackc/pgx/v5/stdlib"` (le `init` du package enregistre
    le pilote) ;
  - **vérifier à la compilation** qu'un type implémente une interface : `var _ io.Writer = (*Journal)(nil)` ;
  - **sauter une valeur** d'`iota` dans un bloc `const` ;
  - garder une variable pendant le développement : `_ = x`.

  `_` n'est pas une variable : on ne peut pas le lire (`fmt.Println(_)` ne compile pas), et plusieurs `_` peuvent
  apparaître dans la même affectation.

  **Piège classique** : ignorer une erreur avec `_`. `data, _ := os.ReadFile(chemin)` compile, mais une erreur passe
  inaperçue et l'on travaille sur des données vides. On réserve `_` aux valeurs dont on n'a vraiment pas besoin.

  **En entretien** : « `_` ignore une valeur, un indice de range, importe pour un init, ou vérifie qu'un type implémente
  une interface ; jamais pour ignorer une erreur sans raison. »
tour:
  - title: L'identifiant blanc
    text: |-
      Go refuse une variable locale déclarée et jamais utilisée, et un import inutile. Pour ignorer volontairement une
      valeur, on l'affecte à `_`, l'**identifiant blanc** : on peut y écrire autant qu'on veut, jamais le lire.

      Les usages courants :

      - ignorer un des résultats d'une fonction : `n, _ := strconv.Atoi("42")` ;
      - ignorer l'indice dans un `range` : `for _, v := range xs` ;
      - vérifier à la compilation qu'un type satisfait une interface : `var _ fmt.Stringer = Temperature(0)`.

      Ignorer une erreur avec `_` doit rester une décision consciente : ici, la chaîne est un nombre connu.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func main() {
          	n, _ := strconv.Atoi("42")
          	fmt.Println(n + 1)

          	somme := 0
          	for _, v := range []int{10, 20, 30} {
          		somme += v
          	}
          	fmt.Println(somme)
          }
      output: |-
        43
        60
cards:
  - key: qcm-range-blanc
    format: multiple-choice
    question: Comment parcourir un slice sans utiliser ni l'indice ni la valeur ?
    choices:
      - text: '`for range xs`'
        correct: true
      - text: '`for _, _ = range xs`'
        correct: false
      - text: '`for _ := range xs` puis lire `_`'
        correct: false
      - text: '`for nil := range xs`'
        correct: false
    answer: '`for range xs` répète le corps `len(xs)` fois sans variable.'
  - key: usages
    format: course
    question: À quoi sert l'identifiant blanc `_` ?
    answer: À ignorer une valeur de retour ou un élément de range, à importer un package pour ses effets de bord, à vérifier qu'un type implémente une interface, et à sauter une valeur d'iota.
  - key: verifier-interface
    format: course
    question: Que fait `var _ io.Writer = (*Journal)(nil)` ?
    answer: Il fait échouer la compilation si `*Journal` n'implémente pas `io.Writer`, sans rien allouer à l'exécution.
  - key: erreur-ignoree
    format: course
    question: Pourquoi `data, _ := os.ReadFile(p)` est-il dangereux ?
    answer: En cas d'erreur, `data` est vide et le programme continue comme si de rien n'était ; l'erreur doit être traitée.
  - key: lire
    format: course
    question: Peut-on lire la valeur de `_` ?
    answer: 'Non : `_` n''est pas une variable, il ne garde rien ; l''utiliser comme valeur ne compile pas.'
  - key: vf-plusieurs
    format: true-false
    question: '`_, _ = f()` est valide pour ignorer deux valeurs de retour.'
    truth: true
    answer: Le blanc peut apparaître plusieurs fois dans la même affectation.
  - key: vf-lire
    format: true-false
    question: '`fmt.Println(_)` affiche la dernière valeur ignorée.'
    truth: false
    answer: '« cannot use _ as value » : le blanc ne garde aucune valeur.'
  - key: vf-range
    format: true-false
    question: '`for i := range xs` parcourt les indices sans qu''il faille écrire `_` pour la valeur.'
    truth: true
    answer: Avec une seule variable, `range` donne l'indice (ou la clé) ; `_` n'est nécessaire que pour ignorer l'indice.
  - key: vf-import
    format: true-false
    question: '`import _ "pkg"` exécute les fonctions `init` du package.'
    truth: true
    answer: 'C''est son seul effet : les noms du package restent inaccessibles.'
  - key: qcm-usages
    format: multiple-choice
    question: Quels usages de `_` sont idiomatiques ?
    choices:
      - text: '`for _, v := range valeurs`'
        correct: true
      - text: '`var _ http.Handler = (*Routeur)(nil)`'
        correct: true
      - text: '`resultat, _ := json.Marshal(v)` dans du code de production'
        correct: false
      - text: '`_ := 5` pour déclarer une variable anonyme'
        correct: false
    answer: Ignorer une erreur masque les pannes ; `_ := 5` ne déclare rien (« no new variables »).
  - key: qcm-verification
    format: multiple-choice
    question: Que se passe-t-il si `*Journal` n'a pas de méthode `Write` avec `var _ io.Writer = (*Journal)(nil)` ?
    choices:
      - text: Une erreur de compilation qui nomme la méthode manquante
        correct: true
      - text: Une panique au démarrage
        correct: false
      - text: Rien, la ligne est ignorée
        correct: false
      - text: Un avertissement de go vet seulement
        correct: false
    answer: 'C''est tout l''intérêt : la vérification est faite par le compilateur.'
  - key: qcm-iota
    format: multiple-choice
    question: Dans `const ( _ = iota; Ko = 1 << (10 * iota) )`, à quoi sert `_` ?
    choices:
      - text: À consommer la valeur 0 d'iota
        correct: true
      - text: À rendre la constante privée
        correct: false
      - text: À déclarer une constante nommée `_` réutilisable
        correct: false
      - text: À remettre iota à zéro
        correct: false
    answer: Ko vaut ainsi `1 << 10`.
  - key: trous-sscan
    format: fill-in
    question: |-
      Complétez pour ignorer le nombre de valeurs lues :
      ```go
      ___, err := fmt.Sscan(entree, &valeur)
      ```
    blanks:
      - - _
    answer: Seule l'erreur nous intéresse.
  - key: trous-range
    format: fill-in
    question: "Complétez pour parcourir seulement les valeurs :\n```go\nfor ___, prix := range tarifs {\n\ttotal += prix\n}\n```"
    blanks:
      - - _
    answer: L'indice est ignoré.
  - key: trous-interface
    format: fill-in
    question: |-
      Complétez la vérification à la compilation :
      ```go
      var ___ io.Reader = (*Fichier)(nil)
      ```
    blanks:
      - - _
    answer: La variable n'existe pas ; seule la vérification de type reste.
  - key: trous-import
    format: fill-in
    question: |-
      Complétez pour enregistrer le décodeur PNG :
      ```go
      import ___ "image/png"
      ```
    blanks:
      - - _
    answer: Le package s'enregistre dans son `init`.
  - key: bug-erreur
    format: bug-fix
    question: |-
      Une configuration corrompue donne des valeurs vides sans aucun message :
      ```go
      data, _ := os.ReadFile("config.json")
      var cfg Config
      _ = json.Unmarshal(data, &cfg)
      ```
    answer: "```go\ndata, err := os.ReadFile(\"config.json\")\nif err != nil {\n\treturn Config{}, fmt.Errorf(\"lecture de la configuration : %w\", err)\n}\nvar cfg Config\nif err := json.Unmarshal(data, &cfg); err != nil {\n\treturn Config{}, fmt.Errorf(\"configuration invalide : %w\", err)\n}\n```\nLes erreurs ignorées par `_` cachaient la cause : on les traite."
  - key: bug-lire-blanc
    format: bug-fix
    question: "Le compilateur signale « cannot use _ as value » :\n```go\nfor _ := range lignes {\n\tcompte++\n}\nfmt.Println(_)\n```"
    answer: "```go\nfor range lignes {\n\tcompte++\n}\nfmt.Println(compte)\n```\n`_` ne garde aucune valeur ; et `for range xs` suffit quand on n'a besoin ni de l'indice ni de la valeur."
  - key: bug-verification
    format: bug-fix
    question: Un refactoring a renommé la méthode `ServeHTTP` d'un routeur, et l'erreur n'est apparue qu'au démarrage du serveur. Comment l'attraper à la compilation ?
    answer: |-
      ```go
      var _ http.Handler = (*Routeur)(nil)
      ```
      La compilation du package échoue dès que `*Routeur` n'implémente plus `http.Handler`.
  - key: bug-pilote
    format: bug-fix
    question: |-
      `sql.Open("pgx", dsn)` répond « sql: unknown driver "pgx" » :
      ```go
      import "database/sql"
      ```
    answer: "```go\nimport (\n\t\"database/sql\"\n\n\t_ \"github.com/jackc/pgx/v5/stdlib\"\n)\n```\nLe pilote s'enregistre dans le `init` de son package : il faut l'importer pour ses effets de bord."
