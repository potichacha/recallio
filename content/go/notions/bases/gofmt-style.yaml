notion: gofmt-style
lesson: "En Go, le format du code n'est pas une préférence : **`gofmt`** le fixe, et presque tout le code Go du monde a le même\naspect. Il n'a **aucune option de style**.\n\nCe qu'il impose : indentation par **tabulations**, alignement des commentaires et des champs, espaces autour des\nopérateurs selon la priorité, imports triés par groupe. `goimports` fait la même chose et, en plus, **ajoute et retire\nles imports**.\n\nUne règle de la grammaire complète ce style : le **point-virgule automatique**. Le lexer insère un `;` à la fin d'une\nligne qui se termine par un identifiant, un littéral, `)`, `]`, `}`, `return`, `break`... D'où :\n- l'accolade ouvrante doit être **sur la même ligne** (`if x {`, `func f() {`) ;\n- dans un littéral sur plusieurs lignes, le dernier élément prend une **virgule finale** ;\n- un opérateur binaire se met en fin de ligne, pas au début de la suivante.\n\n```go\nnoms := []string{\n\t\"ada\",\n\t\"bob\", // virgule obligatoire avant le retour à la ligne\n}\n```\n\nEn pratique : l'éditeur lance `gofmt` (ou `goimports`, via gopls) à l'enregistrement, et la CI vérifie que\n`gofmt -l .` ne liste aucun fichier.\n\n**Piège classique** : oublier la virgule finale d'un littéral multiligne. Le compilateur répond « syntax error:\nunexpected newline in composite literal; possibly missing comma or } ».\n\n**En entretien** : « gofmt sans options, tabulations, accolade sur la même ligne à cause du point-virgule automatique,\nvirgule finale dans les littéraux ; goimports pour les imports, et la CI qui vérifie. »"
tour:
  - title: Un seul style, gofmt
    text: |-
      En Go, la mise en forme n'est pas une affaire de goût : **gofmt** la fixe, et presque tout le code Go du monde a le
      même aspect. Les éditeurs l'appliquent à l'enregistrement, et l'indentation se fait par tabulations.

      Une règle de la grammaire explique une partie de ce style : le compilateur ajoute un **point-virgule** à la fin de
      toute ligne qui finit par un nom, un nombre, une chaîne, une parenthèse ou une accolade fermante. C'est pourquoi on
      n'écrit presque jamais de `;`, et pourquoi l'accolade ouvrante reste **sur la même ligne** que `func main()`.

      Ce programme compile, mais gofmt le réécrirait : il met deux instructions sur une ligne, séparées par un `;`.
      Essaie ensuite de passer l'accolade de `func main()` à la ligne suivante, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("un"); fmt.Println("deux")
          }
      output: |-
        un
        deux
cards:
  - key: gofmt-configurable
    format: course
    question: gofmt est-il configurable ?
    answer: 'Non, c''est volontaire : un seul style pour tout l''écosystème.'
  - key: gofmt-vs-goimports
    format: course
    question: gofmt vs goimports ?
    answer: goimports formate aussi et gère automatiquement les imports.
  - key: point-virgule
    format: course
    question: Pourquoi l'accolade ouvrante doit-elle être sur la même ligne en Go ?
    answer: Le lexer insère un point-virgule à la fin d'une ligne qui se termine par `)` ; `func main()` suivi d'un retour à la ligne deviendrait une déclaration incomplète.
  - key: virgule-finale
    format: course
    question: Pourquoi faut-il une virgule après le dernier élément d'un littéral écrit sur plusieurs lignes ?
    answer: Sans elle, le point-virgule automatique serait inséré après l'élément ; la virgule finale l'empêche, et rend les diffs plus propres.
  - key: verifier-ci
    format: course
    question: Comment vérifier en CI que le code est formaté ?
    answer: '`test -z "$(gofmt -l .)"` : `gofmt -l` liste les fichiers mal formatés ; la CI échoue si la liste n''est pas vide.'
  - key: vf-tabulations
    format: true-false
    question: gofmt indente avec des tabulations.
    truth: true
    answer: Les tabulations pour l'indentation, les espaces pour l'alignement.
  - key: vf-options
    format: true-false
    question: Une équipe peut choisir avec gofmt une indentation de 2 espaces.
    truth: false
    answer: gofmt n'a pas d'option de style ; c'est ce qui supprime les débats.
  - key: vf-goimports
    format: true-false
    question: goimports formate le code comme gofmt et gère aussi les imports.
    truth: true
    answer: Il ajoute les imports manquants, retire les inutiles et les regroupe.
  - key: vf-operateur
    format: true-false
    question: Dans une expression coupée sur deux lignes, on peut commencer la seconde ligne par `&&`.
    truth: false
    answer: Un point-virgule serait inséré à la fin de la première ligne ; l'opérateur se met en fin de ligne.
  - key: qcm-impose
    format: multiple-choice
    question: Que fixe gofmt ?
    choices:
      - text: L'indentation par tabulations
        correct: true
      - text: L'alignement des commentaires et des champs de struct
        correct: true
      - text: Le nom des variables
        correct: false
      - text: La longueur maximale des lignes
        correct: false
    answer: gofmt ne renomme rien et ne coupe pas les lignes trop longues.
  - key: qcm-compile
    format: multiple-choice
    question: Quels extraits compilent ?
    choices:
      - text: '`if x > 0 {` puis le corps'
        correct: true
      - text: Un littéral `[]int{` sur plusieurs lignes dont le dernier élément est suivi d'une virgule
        correct: true
      - text: '`if x > 0` puis `{` sur la ligne suivante'
        correct: false
      - text: Un littéral multiligne sans virgule après le dernier élément
        correct: false
    answer: Le point-virgule automatique explique les deux erreurs.
  - key: qcm-outils
    format: multiple-choice
    question: Comment appliquer le format automatiquement ?
    choices:
      - text: Lancer goimports ou gopls à l'enregistrement dans l'éditeur
        correct: true
      - text: '`go fmt ./...` avant de committer'
        correct: true
      - text: Écrire un fichier `.gofmtrc`
        correct: false
      - text: Compiler avec `go build -fmt`
        correct: false
    answer: gofmt n'a pas de fichier de configuration ; `go fmt` appelle `gofmt -l -w`.
  - key: qcm-ci
    format: multiple-choice
    question: Que vérifie `gofmt -l .` ?
    choices:
      - text: Il liste les fichiers dont le format diffère de celui de gofmt
        correct: true
      - text: Il reformate tous les fichiers
        correct: false
      - text: Il vérifie que le code compile
        correct: false
      - text: Il lance les linters
        correct: false
    answer: '`-l` liste sans modifier ; `-w` réécrit les fichiers.'
  - key: bug-accolade-if
    format: bug-fix
    question: "Le compilateur signale « unexpected newline, expected { after if clause » :\n```go\nif total > 100\n{\n\tremise = 10\n}\n```"
    answer: "```go\nif total > 100 {\n\tremise = 10\n}\n```\nL'accolade ouvrante reste sur la ligne de l'instruction."
  - key: bug-virgule
    format: bug-fix
    question: "Le compilateur signale « unexpected newline in composite literal; possibly missing comma or } » :\n```go\ncouleurs := []string{\n\t\"rouge\",\n\t\"vert\"\n}\n```"
    answer: "```go\ncouleurs := []string{\n\t\"rouge\",\n\t\"vert\",\n}\n```\nLa virgule finale empêche le point-virgule automatique après `\"vert\"`."
  - key: bug-operateur
    format: bug-fix
    question: "Ce code ne compile pas :\n```go\nok := age >= 18\n\t&& pays == \"FR\"\n```"
    answer: "```go\nok := age >= 18 &&\n\tpays == \"FR\"\n```\nL'opérateur se place en fin de ligne : sinon, un point-virgule est inséré après `18`."
  - key: bug-diff
    format: bug-fix
    question: Les revues de code sont polluées par des changements d'indentation entre éditeurs. Que mettre en place ?
    answer: |-
      Faire appliquer gofmt (ou goimports) à l'enregistrement par tous les éditeurs, et vérifier en CI avec
      `test -z "$(gofmt -l .)"`. Le format devient unique et automatique, et les diffs ne montrent plus que le fond.
