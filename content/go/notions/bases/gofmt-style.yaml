notion: gofmt-style
lesson: "En Go, le format du code n'est pas une préférence : **`gofmt`** le fixe, et presque tout le code Go du monde a le même\naspect. Il n'a **aucune option de style**.\n\nCe qu'il impose : indentation par **tabulations**, alignement des commentaires et des champs, espaces autour des\nopérateurs selon la priorité, imports triés par groupe. `goimports` fait la même chose et, en plus, **ajoute et retire\nles imports**.\n\nUne règle de la grammaire complète ce style : le **point-virgule automatique**. Le lexer insère un `;` à la fin d'une\nligne qui se termine par un identifiant, un littéral, `)`, `]`, `}`, `return`, `break`... D'où :\n- l'accolade ouvrante doit être **sur la même ligne** (`if x {`, `func f() {`) ;\n- dans un littéral sur plusieurs lignes, le dernier élément prend une **virgule finale** ;\n- un opérateur binaire se met en fin de ligne, pas au début de la suivante.\n\n```go\nnoms := []string{\n\t\"ada\",\n\t\"bob\", // virgule obligatoire avant le retour à la ligne\n}\n```\n\nEn pratique : l'éditeur lance `gofmt` (ou `goimports`, via gopls) à l'enregistrement, et la CI vérifie que\n`gofmt -l .` ne liste aucun fichier.\n\n**Piège classique** : oublier la virgule finale d'un littéral multiligne. Le compilateur répond « syntax error:\nunexpected newline in composite literal; possibly missing comma or } ».\n\n**En entretien** : « gofmt sans options, tabulations, accolade sur la même ligne à cause du point-virgule automatique,\nvirgule finale dans les littéraux ; goimports pour les imports, et la CI qui vérifie. »"
tour:
  - title: Un seul style, gofmt
    text: |-
      En Go, la mise en forme n'est pas une affaire de goût : **gofmt** la fixe, et presque tout le code Go du monde a le
      même aspect. Les éditeurs l'appliquent à l'enregistrement, et l'indentation se fait par tabulations.

      Une règle de la grammaire explique une partie de ce style : le compilateur ajoute un **point-virgule** à la fin de
      toute ligne qui finit par un nom, un nombre, une chaîne, une parenthèse ou une accolade fermante. C'est pourquoi on
      n'écrit presque jamais de `;`, et pourquoi l'accolade ouvrante reste **sur la même ligne** que `func main()`.

      Ce programme compile, mais gofmt le réécrirait : il met deux instructions sur une ligne, séparées par un `;`.
      Essaie ensuite de passer l'accolade de `func main()` à la ligne suivante, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("un"); fmt.Println("deux")
          }
      output: |-
        un
        deux
cards:
  - key: gofmt-configurable
    format: course
    question: "`gofmt` est-il configurable ?"
    choices:
      - {text: "Non, c'est voulu : un seul style pour tout l'écosystème", correct: true}
      - {text: "Oui, par un fichier `.gofmt` à la racine du module", correct: false}
      - {text: "Oui, par des commentaires `//gofmt:` en tête de fichier", correct: false}
      - {text: "Oui, mais seulement la longueur maximale des lignes", correct: false}
    answer: "Non, c'est volontaire : un seul style pour tout l'écosystème, sans fichier de configuration ni débat d'équipe. Il ne coupe même pas les lignes longues."
  - key: gofmt-vs-goimports
    format: course
    question: "Quelle différence entre `gofmt` et `goimports` ?"
    choices:
      - {text: "`goimports` formate aussi, et ajoute ou retire les imports tout seul", correct: true}
      - {text: "`goimports` trie les imports, sans rien formater d'autre", correct: false}
      - {text: "`gofmt` gère les imports, `goimports` seulement l'indentation", correct: false}
      - {text: "Aucune : `goimports` est l'ancien nom de `gofmt`", correct: false}
    answer: "`goimports` applique le format de `gofmt` et gère en plus les imports : il ajoute ceux qui manquent et retire ceux qui ne servent plus."
  - key: point-virgule
    format: course
    question: Pourquoi l'accolade ouvrante doit-elle être sur la même ligne en Go ?
    choices:
      - {text: "Le lexer insère un `;` après `)` en fin de ligne : la déclaration serait incomplète", correct: true}
      - {text: "C'est une convention de `gofmt`, que le compilateur ne vérifie pas", correct: false}
      - {text: "Le compilateur ignore les lignes qui commencent par une accolade", correct: false}
      - {text: "Pour gagner une ligne, selon une règle du guide de style de Google", correct: false}
    answer: "Le lexer insère un point-virgule à la fin d'une ligne qui se termine par `)` ; `func main()` suivi d'un retour à la ligne deviendrait une déclaration incomplète. C'est une règle du langage, pas du style."
  - key: virgule-finale
    format: course
    question: Pourquoi faut-il une virgule après le dernier élément d'un littéral écrit sur plusieurs lignes ?
    choices:
      - {text: "Sans elle, un `;` automatique serait inséré après l'élément", correct: true}
      - {text: "Pour que `gofmt` aligne les éléments, sans effet sur la compilation", correct: false}
      - {text: "Pour indiquer au compilateur que le littéral est modifiable", correct: false}
      - {text: "Parce que le dernier élément serait sinon ignoré en silence", correct: false}
    answer: "Sans elle, le point-virgule automatique serait inséré après l'élément, et le code ne compilerait pas ; la virgule finale l'empêche, et rend les diffs plus propres."
  - key: verifier-ci
    format: course
    question: Comment vérifier en CI que le code est formaté ?
    choices:
      - {text: "`test -z \"$(gofmt -l .)\"` : la CI échoue si `gofmt -l` liste un fichier", correct: true}
      - {text: "`go build -fmt ./...`, qui refuse de compiler un code mal formaté", correct: false}
      - {text: "`gofmt -w .`, qui échoue dès qu'il doit réécrire un fichier", correct: false}
      - {text: "`go vet ./...`, qui signale aussi chaque écart de format", correct: false}
    answer: "`test -z \"$(gofmt -l .)\"` : `gofmt -l` liste les fichiers mal formatés sans les modifier ; la CI échoue si la liste n'est pas vide. `-w` réécrit les fichiers sans échouer."
  - key: vf-tabulations
    format: true-false
    question: gofmt indente avec des tabulations.
    truth: true
    answer: Les tabulations pour l'indentation, les espaces pour l'alignement.
  - key: vf-options
    format: true-false
    question: Une équipe peut choisir avec gofmt une indentation de 2 espaces.
    truth: false
    answer: gofmt n'a pas d'option de style ; c'est ce qui supprime les débats.
  - key: vf-goimports
    format: true-false
    question: goimports formate le code comme gofmt et gère aussi les imports.
    truth: true
    answer: Il ajoute les imports manquants, retire les inutiles et les regroupe.
  - key: vf-operateur
    format: true-false
    question: Dans une expression coupée sur deux lignes, on peut commencer la seconde ligne par `&&`.
    truth: false
    answer: Un point-virgule serait inséré à la fin de la première ligne ; l'opérateur se met en fin de ligne.
  - key: qcm-impose
    format: multiple-choice
    question: "Lesquels de ces points `gofmt` fixe-t-il ?"
    choices:
      - text: L'indentation par tabulations
        correct: true
      - text: L'alignement des commentaires et des champs de struct
        correct: true
      - text: Le nom des variables
        correct: false
      - text: La longueur maximale des lignes
        correct: false
    answer: gofmt ne renomme rien et ne coupe pas les lignes trop longues.
  - key: qcm-compile
    format: multiple-choice
    question: "Lequel de ces extraits compile ?"
    choices:
      - {text: "`if x > 0 {` puis le corps sur les lignes suivantes", correct: true}
      - {text: "`if x > 0` puis `{` seul sur la ligne suivante", correct: false}
      - {text: "Un littéral `[]int{` multiligne, sans virgule après le dernier élément", correct: false}
      - {text: "`ok := a > 0` puis `&& b > 0` au début de la ligne suivante", correct: false}
    answer: "Le point-virgule automatique explique les trois erreurs : il est inséré après `0`, après le dernier élément et après `a > 0`. L'accolade, la virgule finale et l'opérateur se placent en fin de ligne."
  - key: qcm-outils
    format: multiple-choice
    question: "Comment appliquer le format de Go automatiquement à chaque enregistrement ?"
    choices:
      - {text: "Laisser goimports ou gopls formater le fichier dans l'éditeur", correct: true}
      - {text: "Écrire un fichier `.gofmtrc` à la racine du projet", correct: false}
      - {text: "Compiler avec `go build -fmt`, qui reformate au passage", correct: false}
      - {text: "Lancer `go vet -fix` à chaque enregistrement du fichier", correct: false}
    answer: "L'éditeur appelle goimports ou gopls à l'enregistrement ; `go fmt ./...` avant de committer marche aussi (il appelle `gofmt -l -w`). gofmt n'a pas de fichier de configuration, et `go build` ne formate rien."
  - key: qcm-ci
    format: multiple-choice
    question: Que vérifie `gofmt -l .` ?
    choices:
      - {text: "Il liste les fichiers dont le format diffère de celui de gofmt", correct: true}
      - {text: "Il reformate sur place tous les fichiers du dossier courant", correct: false}
      - {text: "Il vérifie que tous les fichiers du dossier courant compilent", correct: false}
      - {text: "Il lance les linters de la chaîne d'outils sur le dossier", correct: false}
    answer: '`-l` liste sans modifier ; `-w` réécrit les fichiers.'
  - key: bug-accolade-if
    format: bug-fix
    question: |-
      Le compilateur signale « unexpected newline, expected { after if clause ». Quelle correction est la bonne ?
      ```go
      if total > 100
      {
      	remise = 10
      }
      ```
    choices:
      - {text: "Remonter l'accolade ouvrante sur la ligne du `if`", correct: true}
      - {text: "Mettre la condition entre parenthèses : `if (total > 100)`", correct: false}
      - {text: "Ajouter `then` à la fin de la ligne du `if`", correct: false}
      - {text: "Finir la ligne du `if` par un point-virgule explicite", correct: false}
    answer: |-
      ```go
      if total > 100 {
      	remise = 10
      }
      ```
      L'accolade ouvrante reste sur la ligne de l'instruction : sinon, un point-virgule est inséré après la condition.
  - key: bug-virgule
    format: bug-fix
    question: |-
      Le compilateur signale « unexpected newline in composite literal; possibly missing comma or } ». Quelle correction est la bonne ?
      ```go
      couleurs := []string{
      	"rouge",
      	"vert"
      }
      ```
    choices:
      - {text: "Ajouter une virgule après `\"vert\"`", correct: true}
      - {text: "Ajouter un point-virgule après `\"vert\"`", correct: false}
      - {text: "Retirer la virgule après `\"rouge\"`", correct: false}
      - {text: "Indenter `}` au niveau des éléments", correct: false}
    answer: |-
      ```go
      couleurs := []string{
      	"rouge",
      	"vert",
      }
      ```
      La virgule finale empêche le point-virgule automatique après `"vert"`.
  - key: bug-operateur
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      ok := age >= 18
      	&& pays == "FR"
      ```
    choices:
      - {text: "Placer `&&` à la fin de la première ligne, pas au début de la seconde", correct: true}
      - {text: "Indenter davantage la seconde ligne, pour la rattacher à la première", correct: false}
      - {text: "Finir la première ligne par `\\`, comme en Python ou en shell", correct: false}
      - {text: "Remplacer `&&` par `and`, que Go accepte en début de ligne", correct: false}
    answer: |-
      ```go
      ok := age >= 18 &&
      	pays == "FR"
      ```
      L'opérateur se place en fin de ligne : sinon, un point-virgule est inséré après `18`, et l'indentation n'y change rien.
  - key: bug-diff
    format: bug-fix
    question: "Les revues de code sont polluées par des changements d'indentation entre éditeurs. Que mets-tu en place ?"
    choices:
      - {text: "gofmt ou goimports à l'enregistrement, et `test -z \"$(gofmt -l .)\"` en CI", correct: true}
      - {text: "Un fichier `.editorconfig` qui impose des espaces au lieu des tabulations", correct: false}
      - {text: "Une règle d'équipe : indenter avec quatre espaces, vérifiée en revue", correct: false}
      - {text: "Masquer les espaces dans l'outil de revue, sans rien changer au code", correct: false}
    answer: "Faire appliquer gofmt (ou goimports) à l'enregistrement par tous les éditeurs, et vérifier en CI avec `test -z \"$(gofmt -l .)\"`. Le format devient unique et automatique, et les diffs ne montrent plus que le fond. gofmt indente par tabulations : imposer des espaces le contredirait."
