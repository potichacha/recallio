notion: closures
lesson: "Une **closure** est une fonction anonyme qui **capture** des variables de son environnement : elle les utilise, et\nles modifie, **par référence** (c'est la même variable, pas une copie).\n\n```go\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++ // la closure garde n vivante après le retour de compteur\n\t\treturn n\n\t}\n}\n\nc := compteur()\nc(); c() // 1, 2\nd := compteur()\nd()      // 1 : chaque appel de compteur crée sa propre variable n\n```\n\nUsages : générateurs et compteurs, callbacks qui ont besoin de contexte (`slices.SortFunc` qui lit une variable),\nmiddlewares et options fonctionnelles, `defer` et goroutines.\n\nCe qu'il faut savoir :\n- la variable capturée **survit** à la fonction qui l'a déclarée (elle « s'échappe » sur le tas) ;\n- une closure lancée dans une **goroutine** qui modifie une variable partagée crée une **data race** sans\n  synchronisation ;\n- depuis Go 1.22, la variable de boucle est propre à chaque itération, ce qui supprime le piège classique de la\n  capture dans une boucle.\n\n**Piège classique** : une closure qui capture une variable modifiée **après** sa création. Elle voit la valeur au\nmoment de l'**appel**, pas au moment de la création.\n\n**En entretien** : « Une fonction qui capture ses variables par référence et les garde vivantes ; utile pour l'état\nprivé, les callbacks et les middlewares ; attention aux goroutines qui partagent une variable capturée. »"
cards:
  - key: closure
    format: course
    question: C'est quoi une closure ?
    answer: Une fonction anonyme qui capture des variables de son environnement par référence.
  - key: reference
    format: course
    question: Une closure capture-t-elle les variables par valeur ou par référence ?
    answer: 'Par référence : elle partage la variable avec son environnement et voit (ou fait) ses modifications.'
  - key: survie
    format: course
    question: Que devient une variable locale capturée par une closure renvoyée ?
    answer: Elle reste vivante tant que la closure existe ; le compilateur l'alloue sur le tas (elle « s'échappe »).
  - key: goroutine
    format: course
    question: Quel risque quand plusieurs goroutines lancées par des closures modifient une même variable capturée ?
    answer: 'Une data race : il faut un mutex, un atomique, ou que chaque goroutine écrive dans sa propre variable.'
  - key: vf-copie
    format: true-false
    question: Une closure travaille sur une copie des variables capturées, faite à sa création.
    truth: false
    answer: Elle partage les variables ; elle voit leur valeur au moment de l'appel.
  - key: vf-independantes
    format: true-false
    question: Deux appels de `compteur()` renvoient deux closures qui partagent le même compteur.
    truth: false
    answer: Chaque appel crée une nouvelle variable `n`, propre à sa closure.
  - key: vf-tas
    format: true-false
    question: Une variable capturée par une closure qui survit à la fonction est allouée sur le tas.
    truth: true
    answer: L'analyse d'échappement le décide ; `go build -gcflags=-m` le montre.
  - key: vf-modifier
    format: true-false
    question: Une closure peut modifier une variable de la fonction qui l'a créée.
    truth: true
    answer: Puisqu'elle la partage.
  - key: qcm-valeur-vue
    format: multiple-choice
    question: Que affiche `x := 1; f := func() { fmt.Print(x) }; x = 2; f()` ?
    choices:
      - text: '2'
        correct: true
      - text: '1'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: La closure lit `x` au moment de l'appel.
  - key: qcm-usages
    format: multiple-choice
    question: Quels usages reposent sur les closures ?
    choices:
      - text: Un middleware HTTP qui enveloppe un handler
        correct: true
      - text: Les options fonctionnelles d'un constructeur
        correct: true
      - text: La déclaration d'une struct
        correct: false
      - text: Les constantes iota
        correct: false
    answer: Le middleware et l'option capturent leurs paramètres.
  - key: qcm-race
    format: multiple-choice
    question: Comment compter sans data race dans 100 goroutines qui capturent `total` ?
    choices:
      - text: Protéger `total` par un `sync.Mutex`
        correct: true
      - text: Utiliser un `atomic.Int64`
        correct: true
      - text: Capturer `total` par valeur avec `total := total`
        correct: false
      - text: Lancer les goroutines avec `defer`
        correct: false
    answer: Une copie locale ferait compter chaque goroutine dans son coin, sans résultat commun.
  - key: qcm-compteur
    format: multiple-choice
    question: Avec `c := compteur()`, que donnent trois appels `c()` ?
    choices:
      - text: 1, 2, 3
        correct: true
      - text: 1, 1, 1
        correct: false
      - text: 0, 0, 0
        correct: false
      - text: 3, 3, 3
        correct: false
    answer: La variable capturée garde son état entre les appels.
  - key: code-compteur
    format: code-output
    question: "```go\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n\nc, d := compteur(), compteur()\nfmt.Println(c(), c(), d())\n```"
    answer: '`1 2 1` : chaque compteur a sa propre variable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n\nfunc main() {\n\tc, d := compteur(), compteur()\n\tfmt.Println(c(), c(), d())\n}\n"
      output: 1 2 1
  - key: code-modifie-apres
    format: code-output
    question: |-
      ```go
      x := 1
      f := func() int { return x * 10 }
      x = 5
      fmt.Println(f())
      ```
    answer: '`50` : la closure lit la valeur de `x` au moment de l''appel.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tf := func() int { return x * 10 }\n\tx = 5\n\tfmt.Println(f())\n}\n"
      output: '50'
  - key: code-modifie-externe
    format: code-output
    question: |-
      ```go
      total := 0
      ajouter := func(n int) { total += n }
      ajouter(3)
      ajouter(4)
      fmt.Println(total)
      ```
    answer: '`7` : la closure modifie la variable de la fonction englobante.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttotal := 0\n\tajouter := func(n int) { total += n }\n\tajouter(3)\n\tajouter(4)\n\tfmt.Println(total)\n}\n"
      output: '7'
  - key: code-generateur
    format: code-output
    question: "```go\nfunc fibonacci() func() int {\n\ta, b := 0, 1\n\treturn func() int {\n\t\tr := a\n\t\ta, b = b, a+b\n\t\treturn r\n\t}\n}\n\nf := fibonacci()\nfor range 7 {\n\tfmt.Print(f(), \" \")\n}\nfmt.Println()\n```"
    answer: '`0 1 1 2 3 5 8` : la closure garde l''état du générateur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc fibonacci() func() int {\n\ta, b := 0, 1\n\treturn func() int {\n\t\tr := a\n\t\ta, b = b, a+b\n\t\treturn r\n\t}\n}\n\nfunc main() {\n\tf := fibonacci()\n\tfor range 7 {\n\t\tfmt.Print(f(), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 1 1 2 3 5 8
  - key: bug-race
    format: bug-fix
    question: "Le total est faux et `go test -race` signale une data race :\n```go\ntotal := 0\nvar wg sync.WaitGroup\nfor _, f := range fichiers {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\ttotal += taille(f)\n\t}()\n}\nwg.Wait()\n```"
    answer: "```go\nvar total atomic.Int64\nfor _, f := range fichiers {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\ttotal.Add(int64(taille(f)))\n\t}()\n}\nwg.Wait()\nfmt.Println(total.Load())\n```\nToutes les closures modifiaient la même variable sans synchronisation ; un atomique (ou un mutex) corrige."
  - key: bug-valeur-capturee
    format: bug-fix
    question: |-
      Le message de log affiche toujours le dernier statut au lieu de celui du moment :
      ```go
      statut := "démarrage"
      defer func() { log.Println("statut initial :", statut) }()
      statut = "en cours"
      ```
    answer: |-
      ```go
      statut := "démarrage"
      defer log.Println("statut initial :", statut)
      statut = "en cours"
      // ou : initial := statut, capturé par la closure
      ```
      La closure lit la variable à l'exécution du defer ; un appel direct évalue l'argument tout de suite.
  - key: bug-etat-global
    format: bug-fix
    question: |-
      Un compteur de requêtes est une variable globale que n'importe quel package modifie :
      ```go
      var compteur int

      func suivant() int { compteur++; return compteur }
      ```
    answer: "```go\nfunc nouveauCompteur() func() int {\n\tvar mu sync.Mutex\n\tn := 0\n\treturn func() int {\n\t\tmu.Lock()\n\t\tdefer mu.Unlock()\n\t\tn++\n\t\treturn n\n\t}\n}\n```\nLa closure encapsule l'état : seul le code qui détient la fonction peut faire avancer le compteur. (Un type avec\nune méthode convient tout aussi bien.)"
  - key: bug-boucle-ancienne
    format: bug-fix
    question: "Dans un module `go 1.21`, les boutons affichent tous le dernier libellé :\n```go\nfor _, l := range libelles {\n\tboutons = append(boutons, func() string { return l })\n}\n```"
    answer: "```go\nfor _, l := range libelles {\n\tl := l\n\tboutons = append(boutons, func() string { return l })\n}\n// ou monter la directive go du module à 1.22 ou plus\n```\nAvant 1.22, `l` était une seule variable partagée par toutes les closures."
  - key: scenario-middleware
    format: scenario
    question: Explique comment une closure permet d'écrire un middleware HTTP qui mesure la durée des requêtes.
    answer: |-
      Le middleware est une fonction qui reçoit le handler suivant et renvoie un nouveau handler :
      `func Mesurer(suivant http.Handler) http.Handler { return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) { debut := time.Now(); suivant.ServeHTTP(w, r); log.Println(r.URL.Path, time.Since(debut)) }) }`.
      La fonction anonyme capture `suivant` : chaque requête l'appelle, entourée de la mesure. On empile ainsi les
      middlewares (journalisation, authentification) sans héritage.
  - key: scenario-cache
    format: scenario
    question: Tu veux mémoriser les résultats d'une fonction coûteuse sans variable globale. Comment t'y prends-tu avec une closure ?
    answer: |-
      J'écris `func memoriser(f func(int) int) func(int) int` qui crée une map et un mutex, puis renvoie une closure : elle
      cherche l'argument dans la map, appelle `f` seulement en cas d'absence, et range le résultat. La map vit dans la
      closure, invisible du reste du programme ; le mutex rend l'ensemble sûr entre goroutines. Pour des appels
      concurrents identiques, `singleflight` évite même les calculs en double.
  - key: scenario-revue-goroutines
    format: scenario
    question: En revue, tu vois des goroutines lancées dans une boucle qui écrivent dans une slice commune avec `append`. Que dis-tu ?
    answer: |-
      Que c'est une data race : `append` sur un slice partagé depuis plusieurs goroutines corrompt les données ou perd
      des éléments, et `-race` le signale. Deux solutions : préallouer le slice et faire écrire chaque goroutine à son
      propre indice (`resultats[i] = ...`), ce qui ne demande aucun verrou ; ou envoyer les résultats dans un channel lu
      par une seule goroutine. Un mutex autour de `append` marche aussi, au prix de la contention.
  - key: scenario-options
    format: scenario
    question: Comment les closures rendent-elles possibles les options fonctionnelles d'un constructeur ?
    answer: |-
      Chaque option est une fonction qui capture sa valeur et modifie la configuration :
      `func AvecDelai(d time.Duration) Option { return func(c *Client) { c.delai = d } }`. Le constructeur
      `NewClient(opts ...Option)` applique les valeurs par défaut puis chaque option. La closure garde `d` jusqu'à
      l'application ; l'API reste extensible sans casser les appelants.
