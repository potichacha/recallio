notion: closures
lesson: "Une **closure** est une fonction anonyme qui **capture** des variables de son environnement : elle les utilise, et\nles modifie, **par référence** (c'est la même variable, pas une copie).\n\n```go\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++ // la closure garde n vivante après le retour de compteur\n\t\treturn n\n\t}\n}\n\nc := compteur()\nc(); c() // 1, 2\nd := compteur()\nd()      // 1 : chaque appel de compteur crée sa propre variable n\n```\n\nUsages : générateurs et compteurs, callbacks qui ont besoin de contexte (`slices.SortFunc` qui lit une variable),\nmiddlewares et options fonctionnelles, `defer` et goroutines.\n\nCe qu'il faut savoir :\n- la variable capturée **survit** à la fonction qui l'a déclarée (elle « s'échappe » sur le tas) ;\n- une closure lancée dans une **goroutine** qui modifie une variable partagée crée une **data race** sans\n  synchronisation ;\n- depuis Go 1.22, la variable de boucle est propre à chaque itération, ce qui supprime le piège classique de la\n  capture dans une boucle.\n\n**Piège classique** : une closure qui capture une variable modifiée **après** sa création. Elle voit la valeur au\nmoment de l'**appel**, pas au moment de la création.\n\n**En entretien** : « Une fonction qui capture ses variables par référence et les garde vivantes ; utile pour l'état\nprivé, les callbacks et les middlewares ; attention aux goroutines qui partagent une variable capturée. »"
cards:
  - key: closure
    format: course
    question: "Qu'est-ce qu'une closure en Go ?"
    choices:
      - {text: "Une fonction anonyme qui capture des variables de son environnement", correct: true}
      - {text: "Une fonction qui ferme les ressources ouvertes, comme un `defer`", correct: false}
      - {text: "Une fonction privée au package, qu'aucun autre package ne voit", correct: false}
      - {text: "Une fonction anonyme qui reçoit une copie figée des variables autour", correct: false}
    answer: "Une fonction anonyme qui capture des variables de son environnement, par référence : elle les partage avec la fonction englobante, elle ne les copie pas."
  - key: reference
    format: course
    question: Une closure capture-t-elle les variables par valeur ou par référence ?
    choices:
      - {text: "Par référence : elle partage la variable et voit ses modifications", correct: true}
      - {text: "Par valeur : elle copie la variable au moment de sa création", correct: false}
      - {text: "Par valeur pour les types de base, par référence pour slices et maps", correct: false}
      - {text: "Par référence, mais en lecture seule : elle ne peut pas la modifier", correct: false}
    answer: "Par référence : elle partage la variable avec son environnement, voit ses modifications et peut la modifier elle-même. Rien n'est copié à la création de la closure."
  - key: survie
    format: course
    question: Que devient une variable locale capturée par une closure renvoyée ?
    choices:
      - {text: "Elle reste vivante tant que la closure existe, allouée sur le tas", correct: true}
      - {text: "Elle est détruite au retour : la closure lit alors sa valeur zéro", correct: false}
      - {text: "Elle est copiée dans la closure au retour, puis ne change plus", correct: false}
      - {text: "Le compilateur refuse de renvoyer une closure qui capture une locale", correct: false}
    answer: "Elle reste vivante tant que la closure existe : le compilateur l'alloue sur le tas (elle « s'échappe »). Go n'a pas de pointeur vers une pile disparue, comme en C."
  - key: goroutine
    format: course
    question: Quel risque quand plusieurs goroutines lancées par des closures modifient une même variable capturée ?
    choices:
      - {text: "Une data race : il faut un mutex, un atomique, ou une variable par goroutine", correct: true}
      - {text: "Aucun : chaque goroutine reçoit sa propre copie de la variable capturée", correct: false}
      - {text: "Une fuite mémoire : la variable capturée n'est jamais libérée par le GC", correct: false}
      - {text: "Un deadlock : la variable reste verrouillée par la première goroutine", correct: false}
    answer: "Une data race : les closures partagent la même variable, sans synchronisation. Il faut un mutex, un atomique, ou que chaque goroutine écrive dans sa propre variable."
  - key: vf-copie
    format: true-false
    question: Une closure travaille sur une copie des variables capturées, faite à sa création.
    truth: false
    answer: Elle partage les variables ; elle voit leur valeur au moment de l'appel.
  - key: vf-independantes
    format: true-false
    question: Deux appels de `compteur()` renvoient deux closures qui partagent le même compteur.
    truth: false
    answer: Chaque appel crée une nouvelle variable `n`, propre à sa closure.
  - key: vf-tas
    format: true-false
    question: Une variable capturée par une closure qui survit à la fonction est allouée sur le tas.
    truth: true
    answer: L'analyse d'échappement le décide ; `go build -gcflags=-m` le montre.
  - key: vf-modifier
    format: true-false
    question: Une closure peut modifier une variable de la fonction qui l'a créée.
    truth: true
    answer: Puisqu'elle la partage.
  - key: qcm-valeur-vue
    format: multiple-choice
    question: Que affiche `x := 1; f := func() { fmt.Print(x) }; x = 2; f()` ?
    choices:
      - text: '2'
        correct: true
      - text: '1'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: La closure lit `x` au moment de l'appel.
  - key: qcm-usages
    format: multiple-choice
    question: "Lesquels de ces usages reposent sur les closures ?"
    choices:
      - text: Un middleware HTTP qui enveloppe un handler
        correct: true
      - text: Les options fonctionnelles d'un constructeur
        correct: true
      - text: La déclaration d'une struct
        correct: false
      - text: Les constantes iota
        correct: false
    answer: Le middleware et l'option capturent leurs paramètres.
  - key: qcm-race
    format: multiple-choice
    question: "Quelle solution compte sans data race dans 100 goroutines qui incrémentent la variable capturée `total` ?"
    choices:
      - {text: "Faire de `total` un `atomic.Int64`, incrémenté par `Add`", correct: true}
      - {text: "Copier `total := total` dans chaque goroutine", correct: false}
      - {text: "Lancer chaque goroutine avec `defer go f()`", correct: false}
      - {text: "Déclarer `total` avec `var` plutôt qu'avec `:=`", correct: false}
    answer: "Un `atomic.Int64` rend chaque incrément indivisible ; un `sync.Mutex` autour de `total` marche aussi. Une copie locale ferait compter chaque goroutine dans son coin, sans résultat commun."
  - key: qcm-compteur
    format: multiple-choice
    question: Avec `c := compteur()`, que donnent trois appels `c()` ?
    choices:
      - text: 1, 2, 3
        correct: true
      - text: 1, 1, 1
        correct: false
      - text: 0, 0, 0
        correct: false
      - text: 3, 3, 3
        correct: false
    answer: La variable capturée garde son état entre les appels.
  - key: code-compteur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func compteur() func() int {
      	n := 0
      	return func() int {
      		n++
      		return n
      	}
      }

      c, d := compteur(), compteur()
      fmt.Println(c(), c(), d())
      ```
    choices:
      - {text: "`1 2 1`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`1 1 1`", correct: false}
      - {text: "`0 1 0`", correct: false}
    answer: "`1 2 1` : chaque appel à `compteur()` crée sa propre variable `n` ; `c` et `d` ne la partagent pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n\nfunc main() {\n\tc, d := compteur(), compteur()\n\tfmt.Println(c(), c(), d())\n}\n"
      output: 1 2 1
  - key: code-modifie-apres
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 1
      f := func() int { return x * 10 }
      x = 5
      fmt.Println(f())
      ```
    choices:
      - {text: "`50`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`50` : la closure lit `x` au moment de l'appel, pas à sa création ; elle voit donc 5, et non 1."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tf := func() int { return x * 10 }\n\tx = 5\n\tfmt.Println(f())\n}\n"
      output: '50'
  - key: code-modifie-externe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      total := 0
      ajouter := func(n int) { total += n }
      ajouter(3)
      ajouter(4)
      fmt.Println(total)
      ```
    choices:
      - {text: "`7`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`7` : la closure modifie la variable `total` de la fonction englobante, qu'elle partage ; avec une copie, on lirait 0."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttotal := 0\n\tajouter := func(n int) { total += n }\n\tajouter(3)\n\tajouter(4)\n\tfmt.Println(total)\n}\n"
      output: '7'
  - key: code-generateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func fibonacci() func() int {
      	a, b := 0, 1
      	return func() int {
      		r := a
      		a, b = b, a+b
      		return r
      	}
      }

      f := fibonacci()
      for range 7 {
      	fmt.Print(f(), " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`0 1 1 2 3 5 8`", correct: true}
      - {text: "`1 1 2 3 5 8 13`", correct: false}
      - {text: "`0 1 2 3 4 5 6`", correct: false}
      - {text: "`0 0 0 0 0 0 0`", correct: false}
    answer: "`0 1 1 2 3 5 8` : la closure garde `a` et `b` d'un appel à l'autre ; elle renvoie `a` avant de faire avancer la suite."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc fibonacci() func() int {\n\ta, b := 0, 1\n\treturn func() int {\n\t\tr := a\n\t\ta, b = b, a+b\n\t\treturn r\n\t}\n}\n\nfunc main() {\n\tf := fibonacci()\n\tfor range 7 {\n\t\tfmt.Print(f(), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 1 1 2 3 5 8
  - key: bug-race
    format: bug-fix
    question: |-
      Le total est faux et `go test -race` signale une data race. Quelle correction est la bonne ?
      ```go
      total := 0
      var wg sync.WaitGroup
      for _, f := range fichiers {
      	wg.Add(1)
      	go func() {
      		defer wg.Done()
      		total += taille(f)
      	}()
      }
      wg.Wait()
      ```
    choices:
      - {text: "Faire de `total` un `atomic.Int64`, incrémenté avec `total.Add`", correct: true}
      - {text: "Copier `total := total` dans la goroutine avant de l'incrémenter", correct: false}
      - {text: "Passer `f` en paramètre : `go func(f string) { ... }(f)`", correct: false}
      - {text: "Déplacer `wg.Add(1)` dans la goroutine, avant `defer wg.Done()`", correct: false}
    answer: |-
      ```go
      var total atomic.Int64
      for _, f := range fichiers {
      	wg.Add(1)
      	go func() {
      		defer wg.Done()
      		total.Add(int64(taille(f)))
      	}()
      }
      wg.Wait()
      fmt.Println(total.Load())
      ```
      Toutes les closures modifiaient la même variable sans synchronisation ; un atomique (ou un mutex) corrige. Une copie locale ferait compter chaque goroutine dans son coin, et passer `f` en paramètre ne change rien depuis Go 1.22.
  - key: bug-valeur-capturee
    format: bug-fix
    question: |-
      Le message de log affiche toujours le dernier statut au lieu de celui du moment. Quelle correction est la bonne ?
      ```go
      statut := "démarrage"
      defer func() { log.Println("statut initial :", statut) }()
      statut = "en cours"
      ```
    choices:
      - {text: "`defer log.Println(\"statut initial :\", statut)` : l'argument est évalué tout de suite", correct: true}
      - {text: "Passer `&statut` à la closure, pour qu'elle garde la valeur d'origine", correct: false}
      - {text: "Déclarer `statut` avec `var` plutôt qu'avec `:=`, pour figer sa valeur", correct: false}
      - {text: "Remplacer `defer` par `go`, pour écrire le log au moment de la ligne", correct: false}
    answer: |-
      ```go
      statut := "démarrage"
      defer log.Println("statut initial :", statut)
      statut = "en cours"
      // ou : initial := statut, capturé par la closure
      ```
      La closure lit la variable à l'exécution du `defer`, à la fin de la fonction ; un appel direct évalue ses arguments dès la ligne du `defer`.
  - key: bug-etat-global
    format: bug-fix
    question: |-
      Un compteur de requêtes est une variable globale que tout le code du package peut modifier. Comment l'encapsuler ?
      ```go
      var compteur int

      func suivant() int { compteur++; return compteur }
      ```
    choices:
      - {text: "Une fonction qui crée `n` et un mutex, et renvoie une closure qui l'incrémente", correct: true}
      - {text: "Renommer la variable en `Compteur`, pour l'exporter et la documenter", correct: false}
      - {text: "Garder la globale, et l'incrémenter dans une goroutine à chaque appel", correct: false}
      - {text: "Déplacer la globale dans un fichier `compteur.go` du même package", correct: false}
    answer: |-
      ```go
      func nouveauCompteur() func() int {
      	var mu sync.Mutex
      	n := 0
      	return func() int {
      		mu.Lock()
      		defer mu.Unlock()
      		n++
      		return n
      	}
      }
      ```
      La closure encapsule l'état : seul le code qui détient la fonction peut faire avancer le compteur (un type avec une méthode convient tout aussi bien). Un fichier à part ne cache rien : la visibilité se joue au niveau du package.
  - key: bug-boucle-ancienne
    format: bug-fix
    question: |-
      Dans un module `go 1.21`, les boutons affichent tous le dernier libellé. Quelle correction est la bonne ?
      ```go
      for _, l := range libelles {
      	boutons = append(boutons, func() string { return l })
      }
      ```
    choices:
      - {text: "Copier la variable dans la boucle (`l := l`), ou passer le module en `go 1.22`", correct: true}
      - {text: "Remplacer le `range` par une boucle classique `for i := 0; i < n; i++`", correct: false}
      - {text: "Déclarer la closure avant la boucle, pour ne la créer qu'une fois", correct: false}
      - {text: "Ajouter `defer` devant `append`, pour l'exécuter à la fin de chaque tour", correct: false}
    answer: |-
      ```go
      for _, l := range libelles {
      	l := l
      	boutons = append(boutons, func() string { return l })
      }
      // ou monter la directive go du module à 1.22 ou plus
      ```
      Avant Go 1.22, `l` était une seule variable, partagée par toutes les closures, qui lisent sa dernière valeur. Une boucle classique avait le même défaut avant 1.22.
  - key: scenario-middleware
    format: scenario
    question: "Comment une closure permet-elle d'écrire un middleware HTTP qui mesure la durée des requêtes ?"
    choices:
      - {text: "Une fonction reçoit le handler suivant et renvoie un handler qui l'appelle, entouré de la mesure", correct: true}
      - {text: "Chaque handler hérite d'un type de base `Mesure`, qui chronomètre ses appels de `ServeHTTP`", correct: false}
      - {text: "Une variable globale garde l'heure de début, que chaque handler lit puis remet à zéro", correct: false}
      - {text: "Chaque handler appelle lui-même `time.Now()` au début et journalise la durée à la fin", correct: false}
    answer: |-
      Le middleware reçoit le handler suivant et renvoie un nouveau handler :
      `func Mesurer(suivant http.Handler) http.Handler { return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) { debut := time.Now(); suivant.ServeHTTP(w, r); log.Println(r.URL.Path, time.Since(debut)) }) }`.
      La fonction anonyme capture `suivant` : on empile ainsi les middlewares (journalisation, authentification) sans héritage, que Go n'a pas, ni code répété dans chaque handler.
  - key: scenario-cache
    format: scenario
    question: Tu veux mémoriser les résultats d'une fonction coûteuse sans variable globale. Comment t'y prends-tu avec une closure ?
    choices:
      - {text: "`memoriser(f)` crée une map et un mutex, et renvoie une closure qui consulte la map avant d'appeler `f`", correct: true}
      - {text: "Une map globale au package, remplie par la fonction coûteuse à chaque appel, sans verrou", correct: false}
      - {text: "Une closure qui recopie la map à chaque appel, pour éviter les accès concurrents", correct: false}
      - {text: "Un `sync.Once` autour de la fonction, pour qu'elle ne calcule qu'une seule fois", correct: false}
    answer: "`func memoriser(f func(int) int) func(int) int` crée une map et un mutex, puis renvoie une closure : elle cherche l'argument dans la map, appelle `f` seulement en cas d'absence, et range le résultat. La map vit dans la closure, invisible du reste du programme, et le mutex la protège. Un `sync.Once` ne calculerait qu'un seul résultat, quel que soit l'argument."
  - key: scenario-revue-goroutines
    format: scenario
    question: En revue, tu vois des goroutines lancées dans une boucle qui écrivent dans une slice commune avec `append`. Que dis-tu ?
    choices:
      - {text: "C'est une data race : préallouer et écrire chacune à son indice, ou passer par un channel", correct: true}
      - {text: "C'est sûr : `append` réalloue la slice sous un verrou interne au runtime", correct: false}
      - {text: "C'est sûr tant que la capacité de la slice suffit pour tous les éléments", correct: false}
      - {text: "Il suffit de passer la slice par valeur en paramètre de chaque goroutine", correct: false}
    answer: "C'est une data race : `append` sur une slice partagée depuis plusieurs goroutines perd des éléments ou corrompt les données, et `-race` le signale. On préalloue la slice et chaque goroutine écrit à son propre indice (`resultats[i] = ...`), sans verrou ; ou on envoie les résultats dans un channel lu par une seule goroutine. Un mutex autour d'`append` marche aussi, au prix de la contention."
  - key: scenario-options
    format: scenario
    question: Comment les closures rendent-elles possibles les options fonctionnelles d'un constructeur ?
    choices:
      - {text: "Chaque option est une fonction qui capture sa valeur et modifie la configuration", correct: true}
      - {text: "Chaque option est une constante `iota`, que le constructeur teste dans un `switch`", correct: false}
      - {text: "Le constructeur a une surcharge par combinaison d'options, choisie à la compilation", correct: false}
      - {text: "Chaque option est un champ facultatif de la struct, avec une valeur par défaut déclarée", correct: false}
    answer: "Chaque option est une fonction qui capture sa valeur et modifie la configuration : `func AvecDelai(d time.Duration) Option { return func(c *Client) { c.delai = d } }`. `NewClient(opts ...Option)` applique les valeurs par défaut, puis chaque option. Go n'a ni surcharge ni valeur par défaut de paramètre : la closure garde `d` jusqu'à l'application, et l'API s'étend sans casser les appelants."
