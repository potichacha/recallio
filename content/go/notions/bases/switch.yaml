notion: switch
lesson: "Le `switch` de Go :\n\n```go\nswitch jour {\ncase \"sam\", \"dim\":           // plusieurs valeurs dans un case\n\tfmt.Println(\"week-end\")\ncase \"lun\":\n\tfmt.Println(\"courage\")\ndefault:\n\tfmt.Println(\"semaine\")\n}\n\nswitch {                     // sans expression : chaque case est une condition\ncase note >= 16:\n\tmention = \"très bien\"\ncase note >= 12:\n\tmention = \"bien\"\n}\n\nswitch n := len(xs); {       // avec une initialisation\ncase n == 0:\n}\n```\n\n- **Pas de fall-through** : un `case` s'arrête à sa fin, pas besoin de `break`. Le mot-clé `fallthrough` force\n  l'exécution du **corps du case suivant**, **sans tester** sa condition.\n- Les `case` sont évalués **de haut en bas** ; le premier qui correspond gagne.\n- Les valeurs d'un `case` peuvent être des expressions, pas seulement des constantes.\n- `break` dans un `switch` sort du `switch`, pas d'une boucle qui l'entoure (il faut un label).\n- Le `switch` de type (`switch v := x.(type)`) est vu avec les interfaces.\n\n**Piège classique** : écrire `break` dans un `switch` à l'intérieur d'un `for` pour sortir de la boucle. Il ne sort\nque du `switch` ; on utilise un label (`break boucle`) ou un `return`.\n\n**En entretien** : « Pas de fall-through par défaut, plusieurs valeurs par case, un switch sans expression remplace\nles if/else en chaîne ; fallthrough exécute le case suivant sans le tester. »"
cards:
  - key: switch-fall-through
    format: course
    question: Le switch a-t-il du fall-through ?
    answer: Non par défaut ; le mot-clé fallthrough le force.
  - key: code-switch-2-case-1-fmt
    format: code-output
    question: |-
      ```go
      switch 2 {
      case 1:
          fmt.Println("un")
      case 2:
          fmt.Println("deux")
          fallthrough
      case 3:
          fmt.Println("trois")
      case 4:
          fmt.Println("quatre")
      }
      ```
    answer: '`deux` puis `trois` : pas de fall-through par défaut, mais `fallthrough` force l''exécution du cas suivant (sans tester sa condition), et un seul.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tswitch 2 {\n\tcase 1:\n\t    fmt.Println(\"un\")\n\tcase 2:\n\t    fmt.Println(\"deux\")\n\t    fallthrough\n\tcase 3:\n\t    fmt.Println(\"trois\")\n\tcase 4:\n\t    fmt.Println(\"quatre\")\n\t}\n}\n"
      output: |-
        deux
        trois
  - key: plusieurs-valeurs
    format: course
    question: Comment exécuter le même code pour plusieurs valeurs ?
    answer: 'En les listant dans un seul `case`, séparées par des virgules : `case "sam", "dim":`.'
  - key: sans-expression
    format: course
    question: À quoi sert un `switch` sans expression ?
    answer: 'À remplacer une chaîne de `if`/`else if` : chaque `case` est une condition booléenne, et la première vraie l''emporte.'
  - key: break-boucle
    format: course
    question: Que fait `break` dans un `switch` placé dans une boucle `for` ?
    answer: Il sort du `switch` seulement ; pour sortir de la boucle, on utilise un label (`break boucle`) ou un `return`.
  - key: vf-break
    format: true-false
    question: Il faut un `break` à la fin de chaque `case` pour éviter de passer au suivant.
    truth: false
    answer: Go n'a pas de fall-through par défaut.
  - key: vf-fallthrough-condition
    format: true-false
    question: '`fallthrough` teste la condition du case suivant avant de l''exécuter.'
    truth: false
    answer: Il exécute le corps du case suivant sans tester sa condition.
  - key: vf-expressions
    format: true-false
    question: Les valeurs d'un `case` peuvent être des appels de fonction.
    truth: true
    answer: Ce ne sont pas forcément des constantes ; elles sont évaluées dans l'ordre.
  - key: vf-default
    format: true-false
    question: Le `default` doit être le dernier cas d'un switch.
    truth: false
    answer: Il peut être n'importe où ; il ne s'exécute que si aucun case ne correspond.
  - key: qcm-valides
    format: multiple-choice
    question: Quels switch compilent ?
    choices:
      - text: '`switch x { case 1, 2: ... }`'
        correct: true
      - text: '`switch { case x > 0: ... }`'
        correct: true
      - text: '`switch (x) { case 1: break; }` avec des points-virgules'
        correct: true
      - text: '`switch x { case > 0: ... }`'
        correct: false
    answer: Une comparaison se fait dans un switch sans expression ; les parenthèses et `break` sont permis mais inutiles.
  - key: qcm-ordre
    format: multiple-choice
    question: 'Avec `note := 17`, que vaut `mention` après `switch { case note >= 12: mention = "bien"; case note >= 16: mention = "très bien" }` ?'
    choices:
      - text: '`bien`'
        correct: true
      - text: '`très bien`'
        correct: false
      - text: Les deux, successivement
        correct: false
      - text: La chaîne vide
        correct: false
    answer: 'Le premier case vrai gagne : on met les conditions les plus restrictives en premier.'
  - key: qcm-fallthrough
    format: multiple-choice
    question: Quelles affirmations sur `fallthrough` sont vraies ?
    choices:
      - text: Il doit être la dernière instruction du case
        correct: true
      - text: Il est interdit dans le dernier case
        correct: true
      - text: Il saute au default
        correct: false
      - text: Il fonctionne dans un switch de type
        correct: false
    answer: Il passe au case suivant, quel qu'il soit, et n'existe pas dans un switch de type.
  - key: qcm-break-label
    format: multiple-choice
    question: Comment sortir d'une boucle depuis un `case` ?
    choices:
      - text: '`break boucle` avec un label `boucle:` sur le for'
        correct: true
      - text: '`return` si la fonction peut s''arrêter là'
        correct: true
      - text: '`break` seul'
        correct: false
      - text: '`continue switch`'
        correct: false
    answer: Un `break` seul ne sort que du switch.
  - key: trous-plusieurs
    format: fill-in
    question: "Complétez pour traiter samedi et dimanche ensemble :\n```go\nswitch jour {\ncase \"sam\"___ \"dim\":\n\trepos = true\n}\n```"
    blanks:
      - - ','
    answer: Les valeurs d'un case se séparent par des virgules.
  - key: trous-sans-expression
    format: fill-in
    question: "Complétez le switch qui remplace des if en chaîne :\n```go\nswitch ___\ncase age < 13:\n\ttarif = enfant\ncase age >= 65:\n\ttarif = senior\n}\n```"
    blanks:
      - - '{'
    answer: Sans expression, chaque case est une condition.
  - key: trous-default
    format: fill-in
    question: "Complétez le cas par défaut :\n```go\nswitch code {\ncase 200:\n\tok = true\n___:\n\tok = false\n}\n```"
    blanks:
      - - default
    answer: '`default` s''exécute quand aucun case ne correspond.'
  - key: trous-fallthrough
    format: fill-in
    question: "Complétez pour exécuter aussi le corps du case suivant :\n```go\ncase 1:\n\tfmt.Println(\"un\")\n\t___\ncase 2:\n\tfmt.Println(\"deux\")\n```"
    blanks:
      - - fallthrough
    answer: '`fallthrough` force l''exécution du corps suivant, sans test.'
  - key: code-sans-expression
    format: code-output
    question: "```go\nnote := 17\nswitch {\ncase note >= 12:\n\tfmt.Println(\"bien\")\ncase note >= 16:\n\tfmt.Println(\"très bien\")\n}\n```"
    answer: '`bien` : le premier case vrai l''emporte, les suivants ne sont pas testés.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnote := 17\n\tswitch {\n\tcase note >= 12:\n\t\tfmt.Println(\"bien\")\n\tcase note >= 16:\n\t\tfmt.Println(\"très bien\")\n\t}\n}\n"
      output: bien
  - key: code-break-boucle
    format: code-output
    question: "```go\nfor i := range 4 {\n\tswitch i {\n\tcase 2:\n\t\tbreak\n\t}\n\tfmt.Print(i)\n}\nfmt.Println()\n```"
    answer: '`0123` : `break` ne sort que du switch, la boucle continue.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range 4 {\n\t\tswitch i {\n\t\tcase 2:\n\t\t\tbreak\n\t\t}\n\t\tfmt.Print(i)\n\t}\n\tfmt.Println()\n}\n"
      output: '0123'
  - key: code-default
    format: code-output
    question: "```go\nfor _, c := range []int{200, 404, 500} {\n\tswitch c {\n\tdefault:\n\t\tfmt.Print(\"autre \")\n\tcase 200:\n\t\tfmt.Print(\"ok \")\n\tcase 404:\n\t\tfmt.Print(\"absent \")\n\t}\n}\nfmt.Println()\n```"
    answer: '`ok absent autre` : le `default` placé en premier ne s''exécute que si rien ne correspond.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor _, c := range []int{200, 404, 500} {\n\t\tswitch c {\n\t\tdefault:\n\t\t\tfmt.Print(\"autre \")\n\t\tcase 200:\n\t\t\tfmt.Print(\"ok \")\n\t\tcase 404:\n\t\t\tfmt.Print(\"absent \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: ok absent autre
  - key: bug-break
    format: bug-fix
    question: "La boucle ne s'arrête jamais sur la commande « quitter » :\n```go\nfor {\n\tswitch lireCommande() {\n\tcase \"quitter\":\n\t\tbreak\n\tdefault:\n\t\texecuter()\n\t}\n}\n```"
    answer: "```go\nboucle:\n\tfor {\n\t\tswitch lireCommande() {\n\t\tcase \"quitter\":\n\t\t\tbreak boucle\n\t\tdefault:\n\t\t\texecuter()\n\t\t}\n\t}\n```\n`break` seul ne sortait que du switch ; le label vise la boucle."
  - key: bug-ordre
    format: bug-fix
    question: "Les clients premium (plus de 1000 €) ont la remise standard :\n```go\nswitch {\ncase total > 100:\n\tremise = 5\ncase total > 1000:\n\tremise = 15\n}\n```"
    answer: "```go\nswitch {\ncase total > 1000:\n\tremise = 15\ncase total > 100:\n\tremise = 5\n}\n```\nLe premier case vrai gagne : la condition la plus restrictive vient en premier."
  - key: bug-fallthrough
    format: bug-fix
    question: "Un développeur venant de C met des `break` partout et oublie celui-ci, attendant que « admin » hérite des droits d'« editeur » :\n```go\nswitch role {\ncase \"admin\":\n\tdroits = append(droits, \"supprimer\")\ncase \"editeur\":\n\tdroits = append(droits, \"modifier\")\n}\n```"
    answer: "```go\nswitch role {\ncase \"admin\":\n\tdroits = append(droits, \"supprimer\")\n\tfallthrough\ncase \"editeur\":\n\tdroits = append(droits, \"modifier\")\n}\n```\nSans fall-through par défaut, il faut `fallthrough` explicitement (ou, plus lisible, des droits calculés sans\ndépendre de l'ordre des case)."
  - key: bug-comparaison
    format: bug-fix
    question: "Ce code ne compile pas :\n```go\nswitch age {\ncase < 18:\n\ttarif = reduit\ndefault:\n\ttarif = plein\n}\n```"
    answer: "```go\nswitch {\ncase age < 18:\n\ttarif = reduit\ndefault:\n\ttarif = plein\n}\n```\nUne comparaison s'écrit dans un switch sans expression."
