notion: switch
lesson: "Le `switch` de Go :\n\n```go\nswitch jour {\ncase \"sam\", \"dim\":           // plusieurs valeurs dans un case\n\tfmt.Println(\"week-end\")\ncase \"lun\":\n\tfmt.Println(\"courage\")\ndefault:\n\tfmt.Println(\"semaine\")\n}\n\nswitch {                     // sans expression : chaque case est une condition\ncase note >= 16:\n\tmention = \"très bien\"\ncase note >= 12:\n\tmention = \"bien\"\n}\n\nswitch n := len(xs); {       // avec une initialisation\ncase n == 0:\n}\n```\n\n- **Pas de fall-through** : un `case` s'arrête à sa fin, pas besoin de `break`. Le mot-clé `fallthrough` force\n  l'exécution du **corps du case suivant**, **sans tester** sa condition.\n- Les `case` sont évalués **de haut en bas** ; le premier qui correspond gagne.\n- Les valeurs d'un `case` peuvent être des expressions, pas seulement des constantes.\n- `break` dans un `switch` sort du `switch`, pas d'une boucle qui l'entoure (il faut un label).\n- Le `switch` de type (`switch v := x.(type)`) est vu avec les interfaces.\n\n**Piège classique** : écrire `break` dans un `switch` à l'intérieur d'un `for` pour sortir de la boucle. Il ne sort\nque du `switch` ; on utilise un label (`break boucle`) ou un `return`.\n\n**En entretien** : « Pas de fall-through par défaut, plusieurs valeurs par case, un switch sans expression remplace\nles if/else en chaîne ; fallthrough exécute le case suivant sans le tester. »"
tour:
  - title: switch
    text: |-
      `switch` compare une valeur à des cas, de haut en bas. Contrairement à C ou Java, un cas **ne déborde pas** sur le
      suivant : pas besoin de `break`. Un cas peut lister plusieurs valeurs, séparées par des virgules.

      Sans valeur après `switch`, chaque `case` est une condition : c'est une façon lisible d'écrire une suite de
      `if … else if`.

      `fallthrough`, rare, force le passage au cas suivant.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	for _, jour := range []string{"lundi", "samedi"} {
          		switch jour {
          		case "samedi", "dimanche":
          			fmt.Println(jour, ": week-end")
          		default:
          			fmt.Println(jour, ": semaine")
          		}
          	}

          	note := 14
          	switch {
          	case note >= 16:
          		fmt.Println("très bien")
          	case note >= 12:
          		fmt.Println("bien")
          	default:
          		fmt.Println("à revoir")
          	}
          }
      output: |-
        lundi : semaine
        samedi : week-end
        bien
    task:
      instructions: |-
        Ajoute un cas pour que le mercredi affiche `mercredi : jour des enfants`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	jour := "mercredi"
          	switch jour {
          	case "samedi", "dimanche":
          		fmt.Println(jour, ": week-end")
          	default:
          		fmt.Println(jour, ": semaine")
          	}
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	jour := "mercredi"
          	switch jour {
          	case "samedi", "dimanche":
          		fmt.Println(jour, ": week-end")
          	case "mercredi":
          		fmt.Println(jour, ": jour des enfants")
          	default:
          		fmt.Println(jour, ": semaine")
          	}
          }
      output: |-
        mercredi : jour des enfants
cards:
  - key: switch-fall-through
    format: course
    question: "Un `switch` Go passe-t-il au `case` suivant quand il n'y a pas de `break` (fall-through) ?"
    choices:
      - {text: "Non : chaque `case` s'arrête seul ; le mot-clé `fallthrough` force le passage", correct: true}
      - {text: "Oui, comme en C : il faut un `break` à la fin de chaque `case`", correct: false}
      - {text: "Oui, mais seulement vers le `default`, s'il y en a un", correct: false}
      - {text: "Non, et aucun mot-clé ne permet de passer au `case` suivant", correct: false}
    answer: "Non par défaut : un `case` s'arrête à sa fin, sans `break`. Le mot-clé `fallthrough` force l'exécution du `case` suivant."
  - key: code-switch-2-case-1-fmt
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      switch 2 {
      case 1:
          fmt.Println("un")
      case 2:
          fmt.Println("deux")
          fallthrough
      case 3:
          fmt.Println("trois")
      case 4:
          fmt.Println("quatre")
      }
      ```
    choices:
      - text: |-
          ```
          deux
          trois
          ```
        correct: true
      - {text: "`deux`", correct: false}
      - text: |-
          ```
          deux
          trois
          quatre
          ```
        correct: false
      - text: |-
          ```
          un
          deux
          trois
          ```
        correct: false
    answer: "`deux` puis `trois` : pas de fall-through par défaut, mais `fallthrough` force l'exécution du cas suivant (sans tester sa condition), et d'un seul."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tswitch 2 {\n\tcase 1:\n\t    fmt.Println(\"un\")\n\tcase 2:\n\t    fmt.Println(\"deux\")\n\t    fallthrough\n\tcase 3:\n\t    fmt.Println(\"trois\")\n\tcase 4:\n\t    fmt.Println(\"quatre\")\n\t}\n}\n"
      output: |-
        deux
        trois
  - key: plusieurs-valeurs
    format: course
    question: "Comment exécuter le même code pour plusieurs valeurs dans un `switch` ?"
    choices:
      - {text: "En les listant dans un seul `case`, séparées par des virgules", correct: true}
      - {text: "En enchaînant des `case` vides, comme en C : `case \"sam\": case \"dim\":`", correct: false}
      - {text: "Avec `||` dans le `case` : `case \"sam\" || \"dim\":`", correct: false}
      - {text: "Avec une liste entre crochets : `case [\"sam\", \"dim\"]:`", correct: false}
    answer: "En les listant dans un seul `case`, séparées par des virgules : `case \"sam\", \"dim\":`. Un `case` vide ne fait rien : il ne passe pas au suivant."
  - key: sans-expression
    format: course
    question: À quoi sert un `switch` sans expression ?
    choices:
      - {text: "À remplacer une chaîne de `if`/`else if` : chaque `case` est une condition", correct: true}
      - {text: "À faire un `switch` sur le type dynamique d'une interface", correct: false}
      - {text: "À exécuter tous les `case` vrais, l'un après l'autre", correct: false}
      - {text: "À rien : un `switch` sans expression ne compile pas", correct: false}
    answer: "À remplacer une chaîne de `if`/`else if` : chaque `case` est une condition booléenne, et la première vraie l'emporte. Le switch de type s'écrit `switch v := x.(type)`."
  - key: break-boucle
    format: course
    question: Que fait `break` dans un `switch` placé dans une boucle `for` ?
    choices:
      - {text: "Il sort du `switch` seulement ; pour la boucle, un label ou un `return`", correct: true}
      - {text: "Il sort de la boucle `for` qui entoure le `switch`", correct: false}
      - {text: "Il passe au tour suivant de la boucle, comme `continue`", correct: false}
      - {text: "Il ne compile pas : `break` est interdit dans un `switch`", correct: false}
    answer: "Il sort du `switch` seulement ; pour sortir de la boucle, on utilise un label (`break boucle`) ou un `return`."
  - key: vf-break
    format: true-false
    question: Il faut un `break` à la fin de chaque `case` pour éviter de passer au suivant.
    truth: false
    answer: Go n'a pas de fall-through par défaut.
  - key: vf-fallthrough-condition
    format: true-false
    question: '`fallthrough` teste la condition du case suivant avant de l''exécuter.'
    truth: false
    answer: Il exécute le corps du case suivant sans tester sa condition.
  - key: vf-expressions
    format: true-false
    question: Les valeurs d'un `case` peuvent être des appels de fonction.
    truth: true
    answer: Ce ne sont pas forcément des constantes ; elles sont évaluées dans l'ordre.
  - key: vf-default
    format: true-false
    question: Le `default` doit être le dernier cas d'un switch.
    truth: false
    answer: Il peut être n'importe où ; il ne s'exécute que si aucun case ne correspond.
  - key: qcm-valides
    format: multiple-choice
    question: "Lequel de ces `switch` ne compile pas ?"
    choices:
      - {text: "`switch x { case > 0: ... }`", correct: true}
      - {text: "`switch x { case 1, 2: ... }`", correct: false}
      - {text: "`switch { case x > 0: ... }`", correct: false}
      - {text: "`switch (x) { case 1: break; }`", correct: false}
    answer: "Une comparaison s'écrit dans un switch sans expression : `switch { case x > 0: ... }`. Les parenthèses, `break` et les points-virgules sont permis, mais inutiles."
  - key: qcm-ordre
    format: multiple-choice
    question: 'Avec `note := 17`, que vaut `mention` après `switch { case note >= 12: mention = "bien"; case note >= 16: mention = "très bien" }` ?'
    choices:
      - text: '`bien`'
        correct: true
      - text: '`très bien`'
        correct: false
      - text: Les deux, successivement
        correct: false
      - text: La chaîne vide
        correct: false
    answer: 'Le premier case vrai gagne : on met les conditions les plus restrictives en premier.'
  - key: qcm-fallthrough
    format: multiple-choice
    question: "Lesquelles de ces affirmations sur `fallthrough` sont vraies ?"
    choices:
      - text: Il doit être la dernière instruction du case
        correct: true
      - text: Il est interdit dans le dernier case
        correct: true
      - text: Il saute au default
        correct: false
      - text: Il fonctionne dans un switch de type
        correct: false
    answer: Il passe au case suivant, quel qu'il soit, et n'existe pas dans un switch de type.
  - key: qcm-break-label
    format: multiple-choice
    question: "Quelle instruction, écrite dans un `case`, sort de la boucle `for` qui entoure le `switch` ?"
    choices:
      - {text: "`break boucle`, avec le label `boucle:` sur le `for`", correct: true}
      - {text: "`break` seul, placé à la fin du `case`", correct: false}
      - {text: "`continue switch`, qui quitte le `switch` et la boucle", correct: false}
      - {text: "`fallthrough`, qui passe du dernier `case` à la boucle", correct: false}
    answer: "Un `break` seul ne sort que du `switch` : il faut un label sur le `for`, ou un `return` si la fonction peut s'arrêter là."
  - key: trous-plusieurs
    format: fill-in
    question: |-
      Complète pour traiter samedi et dimanche ensemble :
      ```go
      switch jour {
      case "sam"___ "dim":
      	repos = true
      }
      ```
    blanks:
      - - ','
    answer: Les valeurs d'un case se séparent par des virgules.
  - key: trous-sans-expression
    format: fill-in
    question: |-
      Complète le switch qui remplace des if en chaîne :
      ```go
      switch ___
      case age < 13:
      	tarif = enfant
      case age >= 65:
      	tarif = senior
      }
      ```
    blanks:
      - - '{'
    answer: Sans expression, chaque case est une condition.
  - key: trous-default
    format: fill-in
    question: |-
      Complète le cas par défaut :
      ```go
      switch code {
      case 200:
      	ok = true
      ___:
      	ok = false
      }
      ```
    blanks:
      - - default
    answer: '`default` s''exécute quand aucun case ne correspond.'
  - key: trous-fallthrough
    format: fill-in
    question: |-
      Complète pour exécuter aussi le corps du case suivant :
      ```go
      case 1:
      	fmt.Println("un")
      	___
      case 2:
      	fmt.Println("deux")
      ```
    blanks:
      - - fallthrough
    answer: '`fallthrough` force l''exécution du corps suivant, sans test.'
  - key: code-sans-expression
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      note := 17
      switch {
      case note >= 12:
      	fmt.Println("bien")
      case note >= 16:
      	fmt.Println("très bien")
      }
      ```
    choices:
      - {text: "`bien`", correct: true}
      - {text: "`très bien`", correct: false}
      - text: |-
          ```
          bien
          très bien
          ```
        correct: false
      - {text: "Rien : aucun `case` n'est atteint", correct: false}
    answer: "`bien` : le premier `case` vrai l'emporte, les suivants ne sont pas testés. La condition la plus restrictive doit venir en premier."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnote := 17\n\tswitch {\n\tcase note >= 12:\n\t\tfmt.Println(\"bien\")\n\tcase note >= 16:\n\t\tfmt.Println(\"très bien\")\n\t}\n}\n"
      output: bien
  - key: code-break-boucle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i := range 4 {
      	switch i {
      	case 2:
      		break
      	}
      	fmt.Print(i)
      }
      fmt.Println()
      ```
    choices:
      - {text: "`0123`", correct: true}
      - {text: "`01`", correct: false}
      - {text: "`013`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`0123` : `break` ne sort que du `switch`, la boucle continue et affiche aussi 2."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range 4 {\n\t\tswitch i {\n\t\tcase 2:\n\t\t\tbreak\n\t\t}\n\t\tfmt.Print(i)\n\t}\n\tfmt.Println()\n}\n"
      output: '0123'
  - key: code-default
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for _, c := range []int{200, 404, 500} {
      	switch c {
      	default:
      		fmt.Print("autre ")
      	case 200:
      		fmt.Print("ok ")
      	case 404:
      		fmt.Print("absent ")
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`ok absent autre`", correct: true}
      - {text: "`autre ok absent`", correct: false}
      - {text: "`autre autre autre`", correct: false}
      - {text: "`ok absent`", correct: false}
    answer: "`ok absent autre` : le `default` placé en premier ne s'exécute que si rien ne correspond ; sa place ne compte pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor _, c := range []int{200, 404, 500} {\n\t\tswitch c {\n\t\tdefault:\n\t\t\tfmt.Print(\"autre \")\n\t\tcase 200:\n\t\t\tfmt.Print(\"ok \")\n\t\tcase 404:\n\t\t\tfmt.Print(\"absent \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: ok absent autre
  - key: bug-break
    format: bug-fix
    question: |-
      La boucle ne s'arrête jamais sur la commande « quitter ». Quelle correction est la bonne ?
      ```go
      for {
      	switch lireCommande() {
      	case "quitter":
      		break
      	default:
      		executer()
      	}
      }
      ```
    choices:
      - {text: "Un label `boucle:` sur le `for`, et `break boucle` dans le `case`", correct: true}
      - {text: "Remplacer `break` par `continue`, qui sort du `switch` et de la boucle", correct: false}
      - {text: "Ajouter `fallthrough` après `break`, pour atteindre la boucle", correct: false}
      - {text: "Remplacer `switch` par `select`, où `break` sort de la boucle", correct: false}
    answer: |-
      ```go
      boucle:
      	for {
      		switch lireCommande() {
      		case "quitter":
      			break boucle
      		default:
      			executer()
      		}
      	}
      ```
      `break` seul ne sortait que du `switch` ; le label vise la boucle. Un `return` conviendrait aussi.
  - key: bug-ordre
    format: bug-fix
    question: |-
      Les clients premium (plus de 1000 €) ont la remise standard. Quelle correction est la bonne ?
      ```go
      switch {
      case total > 100:
      	remise = 5
      case total > 1000:
      	remise = 15
      }
      ```
    choices:
      - {text: "Tester `total > 1000` avant `total > 100`", correct: true}
      - {text: "Ajouter `fallthrough` à la fin du premier `case`", correct: false}
      - {text: "Ajouter un `break` à la fin du premier `case`", correct: false}
      - {text: "Remplacer `>` par `>=` dans les deux `case`", correct: false}
    answer: |-
      ```go
      switch {
      case total > 1000:
      	remise = 15
      case total > 100:
      	remise = 5
      }
      ```
      Le premier `case` vrai gagne : la condition la plus restrictive vient en premier. Un `fallthrough` donnerait 15 à tous les totaux au-dessus de 100.
  - key: bug-fallthrough
    format: bug-fix
    question: |-
      Un développeur venant de C met des `break` partout et oublie celui-ci, attendant que « admin » hérite des droits d'« editeur ». Quelle correction donne le comportement voulu ?
      ```go
      switch role {
      case "admin":
      	droits = append(droits, "supprimer")
      case "editeur":
      	droits = append(droits, "modifier")
      }
      ```
    choices:
      - {text: "Ajouter `fallthrough` à la fin du `case \"admin\"`", correct: true}
      - {text: "Fusionner les deux : `case \"admin\", \"editeur\":`", correct: false}
      - {text: "Ajouter `break` à la fin du `case \"editeur\"`", correct: false}
      - {text: "Rien : Go passe déjà au `case` suivant sans `break`", correct: false}
    answer: |-
      ```go
      switch role {
      case "admin":
      	droits = append(droits, "supprimer")
      	fallthrough
      case "editeur":
      	droits = append(droits, "modifier")
      }
      ```
      Sans fall-through par défaut, il faut `fallthrough` explicitement (ou, plus lisible, des droits calculés sans dépendre de l'ordre des `case`). Fusionner les `case` donnerait « supprimer » aux éditeurs.
  - key: bug-comparaison
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      switch age {
      case < 18:
      	tarif = reduit
      default:
      	tarif = plein
      }
      ```
    choices:
      - {text: "Un `switch` sans expression : `switch { case age < 18: ... }`", correct: true}
      - {text: "Garder `switch age` et écrire `case age < 18:`", correct: false}
      - {text: "Mettre la comparaison entre parenthèses : `case (< 18):`", correct: false}
      - {text: "Écrire un intervalle : `case 0..17:`", correct: false}
    answer: |-
      ```go
      switch {
      case age < 18:
      	tarif = reduit
      default:
      	tarif = plein
      }
      ```
      Une comparaison s'écrit dans un switch sans expression. Avec `switch age`, `case age < 18` comparerait un entier à un booléen.
