notion: packages-imports
lesson: "Un **package** est un dossier : tous les fichiers `.go` d'un dossier déclarent le même package (sauf les tests externes\n`_test`). Le nom du package est en général celui du dossier, court et en minuscules (`http`, `strconv`).\n\nUn **module** (go.mod) regroupe des packages sous un chemin, par exemple `github.com/acme/boutique`. Le chemin d'import\nd'un package est le chemin du module suivi du dossier :\n\n```go\nimport (\n\t\"fmt\"                                   // bibliothèque standard\n\t\"github.com/acme/boutique/internal/stock\" // un package du même module\n\t\"golang.org/x/sync/errgroup\"           // une dépendance\n)\n```\n\n- On utilise le **nom du package** comme préfixe : `stock.Reserver(...)`.\n- Un alias évite un conflit : `import mrand \"math/rand/v2\"`.\n- `import _ \"pkg\"` importe pour les **effets de bord** seulement (son `init`, par exemple un pilote SQL).\n- Les **cycles d'import sont interdits** : deux packages ne peuvent pas s'importer l'un l'autre.\n- Un import inutilisé est une erreur de compilation.\n\n**Piège classique** : mettre des fichiers `package a` et `package b` dans le même dossier. Le compilateur refuse :\nun dossier, un package.\n\n**En entretien** : « Un dossier égale un package, un go.mod égale un module ; on importe par chemin et on préfixe par le\nnom du package ; pas de cycles, pas d'imports inutilisés. »"
tour:
  - title: Packages et imports
    text: |-
      Un programme Go est fait de **packages**. On importe ceux dont on a besoin, puis on les utilise par leur nom :
      `strings.ToUpper`, `math.Sqrt`. Le nom d'un package est le dernier élément de son chemin d'import : le package
      importé par `"math/rand/v2"` s'appelle `rand`.

      Plusieurs imports se regroupent entre parenthèses, un par ligne, comme dans ce programme.

      Un import qui ne sert à rien est une **erreur de compilation**, pas un simple avertissement. Essaie : ajoute
      `"os"` à la liste, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          	"strings"
          )

          func main() {
          	fmt.Println(strings.ToUpper("gopher"))
          	fmt.Println(math.Sqrt(16))
          }
      output: |-
        GOPHER
        4
    task:
      instructions: |-
        `strings.Repeat(s, n)` répète `n` fois la chaîne `s`. Avec elle, fais afficher `ga-ga-ga-`. N'oublie pas
        l'import.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("ga-")
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	fmt.Println(strings.Repeat("ga-", 3))
          }
      output: ga-ga-ga-
cards:
  - key: package-dossier
    format: course
    question: Quel lien entre un package et un dossier ?
    choices:
      - {text: "Tous les fichiers `.go` d'un dossier forment un seul package, tests externes à part", correct: true}
      - {text: "Chaque fichier `.go` forme son propre package, quel que soit son dossier", correct: false}
      - {text: "Un dossier peut contenir autant de packages qu'il a de fichiers", correct: false}
      - {text: "Le package se déclare dans un fichier `package.go` à la racine du dossier", correct: false}
    answer: "Tous les fichiers `.go` d'un dossier forment un seul package (à part les tests externes `_test`) ; un dossier ne peut pas en contenir deux, et chaque fichier déclare ce package en tête."
  - key: chemin-import
    format: course
    question: Comment se construit le chemin d'import d'un package de son propre module ?
    choices:
      - {text: "Le chemin du module du `go.mod`, suivi du dossier du package", correct: true}
      - {text: "Un chemin relatif depuis le fichier courant, comme `../stock`", correct: false}
      - {text: "Le nom du package seul, que Go cherche dans tout le module", correct: false}
      - {text: "Le chemin du dossier depuis `$GOPATH/src`, quel que soit le module", correct: false}
    answer: "Le chemin du module déclaré dans go.mod, suivi du dossier du package (`github.com/acme/boutique/internal/stock`). Les chemins relatifs ne s'utilisent pas dans un module."
  - key: alias
    format: course
    question: Comment importer deux packages qui ont le même nom ?
    choices:
      - {text: "Avec un alias d'import : `import mrand \"math/rand/v2\"`", correct: true}
      - {text: "Avec `as` : `import \"math/rand/v2\" as mrand`", correct: false}
      - {text: "Avec le chemin complet à chaque appel : `math/rand/v2.IntN(10)`", correct: false}
      - {text: "C'est impossible : deux packages de même nom s'excluent", correct: false}
    answer: "Avec un alias d'import pour l'un d'eux, placé devant le chemin : `import mrand \"math/rand/v2\"`. Go n'a pas de `as`."
  - key: cycles
    format: course
    question: Pourquoi Go interdit-il les cycles d'import ?
    choices:
      - {text: "Pour un graphe de dépendances clair et une compilation rapide et ordonnée", correct: true}
      - {text: "Parce que le linker ne sait pas assembler deux packages qui se connaissent", correct: false}
      - {text: "Pour empêcher deux packages d'avoir des fonctions de même nom", correct: false}
      - {text: "Parce qu'un cycle provoquerait une boucle infinie à l'exécution", correct: false}
    answer: "Pour garder un graphe de dépendances clair et une compilation rapide et ordonnée ; un cycle révèle en général un découpage à revoir (une interface ou un troisième package)."
  - key: vf-deux-packages
    format: true-false
    question: Un même dossier peut contenir des fichiers `package a` et des fichiers `package b`.
    truth: false
    answer: Un dossier forme un seul package ; seuls les tests externes peuvent déclarer `package a_test`.
  - key: vf-cycle
    format: true-false
    question: Le package `commande` peut importer `client` pendant que `client` importe `commande`.
    truth: false
    answer: Le compilateur refuse les cycles d'import.
  - key: vf-blank
    format: true-false
    question: '`import _ "github.com/lib/pq"` sert à exécuter le `init` du package sans utiliser ses noms.'
    truth: true
    answer: C'est ainsi qu'un pilote de base de données s'enregistre auprès de `database/sql`.
  - key: vf-nom-dossier
    format: true-false
    question: Le nom d'un package doit obligatoirement être celui de son dossier.
    truth: false
    answer: C'est la convention, fortement recommandée, mais pas une règle du compilateur (le package `main` en est l'exemple).
  - key: qcm-import-valide
    format: multiple-choice
    question: "Lequel de ces imports est valide ?"
    choices:
      - {text: "`import mrand \"math/rand/v2\"`", correct: true}
      - {text: "`import strings`", correct: false}
      - {text: "`import \"strings\" as s`", correct: false}
      - {text: "`import mrand = \"math/rand/v2\"`", correct: false}
    answer: "Le chemin est entre guillemets, et l'alias se place devant, sans `as` ni `=`. `import \"strings\"` est aussi valide."
  - key: qcm-appel
    format: multiple-choice
    question: Comment appeler la fonction `Reserver` du package importé `"github.com/acme/boutique/internal/stock"` ?
    choices:
      - text: '`stock.Reserver()`'
        correct: true
      - text: '`boutique.stock.Reserver()`'
        correct: false
      - text: '`Reserver()`'
        correct: false
      - text: '`internal.stock.Reserver()`'
        correct: false
    answer: On préfixe par le nom du package, le dernier élément du chemin en général.
  - key: qcm-cycle
    format: multiple-choice
    question: "Les packages `commande` et `client` s'importent mutuellement. Lesquelles de ces solutions cassent le cycle ?"
    choices:
      - text: Définir une interface du côté du package qui consomme
        correct: true
      - text: Extraire les types partagés dans un troisième package
        correct: true
      - text: Activer une option du compilateur qui accepte les cycles
        correct: false
      - text: Fusionner les deux dossiers en gardant deux noms de package
        correct: false
    answer: Le cycle se casse par une abstraction ou un package commun ; aucune option ne l'autorise.
  - key: qcm-effet-bord
    format: multiple-choice
    question: "Que fait `import _ \"image/png\"` ?"
    choices:
      - {text: "Il exécute l'initialisation du package, qui enregistre le décodeur PNG", correct: true}
      - {text: "Il importe tous les noms du package, utilisables sans préfixe", correct: false}
      - {text: "Il désactive le package pour le reste du programme", correct: false}
      - {text: "Il importe le package en différé, chargé à son premier usage", correct: false}
    answer: "L'identifiant blanc garde l'import pour ses effets de bord : l'`init` du package s'exécute, sans qu'on puisse utiliser ses noms. Les noms sans préfixe, c'est `import .`."
  - key: trous-groupe
    format: fill-in
    question: |-
      Complète l'import groupé :
      ```go
      import ___
      	"fmt"
      	"strings"
      ___
      ```
    blanks:
      - - (
      - - )
    answer: Les imports se regroupent entre parenthèses, un par ligne.
  - key: trous-alias
    format: fill-in
    question: |-
      Complète pour importer `math/rand/v2` sous le nom `mrand` :
      ```go
      import ___ "math/rand/v2"
      ```
    blanks:
      - - mrand
    answer: L'alias se place avant le chemin.
  - key: trous-blank
    format: fill-in
    question: |-
      Complète pour importer le pilote PostgreSQL seulement pour son enregistrement :
      ```go
      import ___ "github.com/jackc/pgx/v5/stdlib"
      ```
    blanks:
      - - _
    answer: L'identifiant blanc garde l'import sans nom utilisable.
  - key: trous-package
    format: fill-in
    question: |-
      Complète la première ligne de `stock/reservation.go` :
      ```go
      ___ stock
      ```
    blanks:
      - - package
    answer: Chaque fichier commence par la déclaration de son package.
  - key: bug-deux-packages
    format: bug-fix
    question: "Le dossier `stock/` contient `reservation.go` (`package stock`) et `alerte.go` (`package alertes`). `go build` échoue avec « found packages stock and alertes ». Quelle correction est la bonne ?"
    choices:
      - {text: "Déclarer `package stock` dans `alerte.go`, ou le déplacer dans `stock/alertes/`", correct: true}
      - {text: "Importer `alertes` dans `reservation.go`, pour relier les deux packages", correct: false}
      - {text: "Renommer `alerte.go` en `alertes.go`, pour qu'il corresponde à son package", correct: false}
      - {text: "Déclarer `package stock, alertes` dans un fichier `doc.go` du dossier", correct: false}
    answer: |-
      ```go
      // stock/alerte.go
      package stock
      ```
      Un dossier forme un seul package. Si les alertes sont une notion à part, on les place dans leur propre dossier (`stock/alertes/`), importé par chemin.
  - key: bug-prefixe
    format: bug-fix
    question: |-
      Le compilateur signale « undefined: Reserver ». Quelle correction est la bonne ?
      ```go
      import "github.com/acme/boutique/internal/stock"

      func main() {
      	Reserver("A12", 2)
      }
      ```
    choices:
      - {text: "Préfixer par le nom du package : `stock.Reserver(\"A12\", 2)`", correct: true}
      - {text: "Utiliser la syntaxe de C++ : `stock::Reserver(\"A12\", 2)`", correct: false}
      - {text: "Donner le chemin : `internal.stock.Reserver(\"A12\", 2)`", correct: false}
      - {text: "Déclarer la fonction `main` dans le package `stock`", correct: false}
    answer: |-
      ```go
      stock.Reserver("A12", 2)
      ```
      Les noms d'un package importé s'utilisent préfixés par le nom du package, le dernier élément de son chemin.
  - key: bug-conflit
    format: bug-fix
    question: |-
      Le compilateur signale « rand redeclared in this block ». Quelle correction est la bonne ?
      ```go
      import (
      	"crypto/rand"
      	"math/rand/v2"
      )
      ```
    choices:
      - {text: "Donner un alias à l'un des deux : `mrand \"math/rand/v2\"`", correct: true}
      - {text: "Ne garder que `math/rand/v2`, qui fait aussi l'aléa cryptographique", correct: false}
      - {text: "Écrire les deux imports dans deux blocs `import` séparés", correct: false}
      - {text: "Importer `crypto/rand` en dernier, l'ordre levant l'ambiguïté", correct: false}
    answer: |-
      ```go
      import (
      	"crypto/rand"
      	mrand "math/rand/v2"
      )
      ```
      Deux packages s'appellent `rand` : un alias distingue l'un des deux. `math/rand/v2` n'est pas fait pour la cryptographie, et ni l'ordre ni les blocs ne changent le conflit de noms.
  - key: bug-import-inutile
    format: bug-fix
    question: "Après une refonte, la compilation échoue avec « \"strings\" imported and not used ». Que fais-tu, et comment ne plus y penser ?"
    choices:
      - {text: "Retirer l'import, et lancer `goimports` ou gopls à l'enregistrement", correct: true}
      - {text: "Importer le package avec `_`, pour faire taire le compilateur", correct: false}
      - {text: "Ajouter `var _ = strings.ToUpper` pour utiliser le package", correct: false}
      - {text: "Compiler avec `-gcflags=-unused`, qui tolère les imports inutiles", correct: false}
    answer: "Retirer l'import inutilisé. Pour ne plus y penser, l'éditeur lance `goimports` (ou gopls) à l'enregistrement : il ajoute les imports manquants et retire les inutiles. Un import `_` ferait taire l'erreur en gardant un import qui ne sert à rien."
