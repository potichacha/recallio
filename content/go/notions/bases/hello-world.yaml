notion: hello-world
lesson: "Le plus petit programme Go :\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Bonjour !\")\n}\n```\n\n- `package main` : le package d'un **exécutable**. Un autre nom de package fait une bibliothèque, qui ne se lance pas.\n- `import \"fmt\"` : le package de formatage de la bibliothèque standard. Un import **inutilisé** est une erreur de\n  compilation.\n- `func main()` : le point d'entrée, **sans paramètre ni valeur de retour**. Les arguments de la ligne de commande sont\n  dans `os.Args`, et le code de sortie se donne avec `os.Exit`.\n- `fmt.Println` affiche ses arguments séparés par des espaces, puis un retour à la ligne. `fmt.Print` n'ajoute ni\n  espace entre deux chaînes ni retour à la ligne, `fmt.Printf` formate (`%d`, `%s`, `%v`).\n- Le nom exporté `Println` commence par une **majuscule** : c'est ce qui le rend visible hors de son package.\n\nOn lance avec `go run main.go` (compiler puis exécuter), ou `go build` (produire l'exécutable). Le fichier doit être en\nUTF-8 ; l'accolade ouvrante est **sur la même ligne** que `func main()`, sinon le point-virgule automatique casse la\ncompilation.\n\n**Piège classique** : écrire `func main(args []string)` comme en Java ou en C. En Go, `main` ne prend rien.\n\n**En entretien** : « `package main`, `func main()` sans paramètre, les imports utilisés ; `os.Args` pour les arguments et\n`os.Exit` pour le code de sortie. »"
tour:
  - title: Le premier programme
    text: |-
      Tout programme Go exécutable a la même forme :

      - `package main` : le fichier appartient au package `main`, celui d'un **exécutable** ;
      - `import "fmt"` : on importe le package de la bibliothèque standard qui affiche et formate ;
      - `func main()` : le point d'entrée. Il ne prend **aucun paramètre** et ne renvoie rien.

      `fmt.Println` affiche ses arguments séparés par des espaces, puis passe à la ligne. Ses arguments peuvent être de
      n'importe quel type : ici une chaîne, puis le résultat d'un calcul.

      Essaie : remplace un `Println` par `Print` et exécute. `Print` ne passe pas à la ligne, et ne met un espace
      qu'entre deux arguments qui ne sont pas des chaînes.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Bonjour, Go !")
          	fmt.Println("2 + 3 =", 2+3)
          }
      output: |-
        Bonjour, Go !
        2 + 3 = 5
    task:
      instructions: |-
        Fais afficher `Go a été rendu public en 2009`, en passant l'année à `fmt.Println` comme un **nombre**, dans un
        second argument.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Go a été rendu public en ...")
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Go a été rendu public en", 2009)
          }
      output: Go a été rendu public en 2009
cards:
  - key: package-main
    format: course
    question: Que doit déclarer le fichier d'un programme exécutable ?
    choices:
      - {text: "Le package `main` et une fonction `main` sans paramètre ni retour", correct: true}
      - {text: "Une classe `Main` avec une méthode `main(args []string)`", correct: false}
      - {text: "Le package au nom du dossier et une fonction `Main` exportée", correct: false}
      - {text: "Le package `main` et une fonction `main` qui renvoie un `int`", correct: false}
    answer: "Le package `main` et une fonction `main` sans paramètre ni valeur de retour. Les arguments se lisent dans `os.Args`, le code de sortie se donne à `os.Exit`."
  - key: args
    format: course
    question: Où lire les arguments de la ligne de commande ?
    choices:
      - {text: "Dans `os.Args`, dont le premier élément est le nom du programme", correct: true}
      - {text: "Dans le paramètre `args` de la fonction `main`", correct: false}
      - {text: "Dans `os.Args`, dont le premier élément est le premier argument", correct: false}
      - {text: "Dans la variable d'environnement `ARGS`, lue par `os.Getenv`", correct: false}
    answer: "Dans `os.Args` (le premier élément est le nom du programme, les arguments commencent à `os.Args[1]`), ou avec le package `flag` pour des options."
  - key: println-print
    format: course
    question: Quelle différence entre `fmt.Print` et `fmt.Println` ?
    choices:
      - {text: "`Println` sépare toujours les arguments et passe à la ligne ; `Print` ne passe pas à la ligne", correct: true}
      - {text: "`Print` passe à la ligne après le texte ; `Println` écrit sans retour à la ligne", correct: false}
      - {text: "`Println` écrit sur la sortie d'erreur ; `Print` écrit sur la sortie standard", correct: false}
      - {text: "Aucune : `Println` n'est qu'un ancien nom de `Print`, gardé pour la compatibilité", correct: false}
    answer: "`Println` ajoute toujours une espace entre les arguments et un retour à la ligne final ; `Print` n'ajoute une espace qu'entre deux arguments qui ne sont pas des chaînes, et pas de retour à la ligne."
  - key: run-build
    format: course
    question: Que font `go run` et `go build` ?
    choices:
      - {text: "`go run` compile dans un dossier temporaire et exécute ; `go build` produit l'exécutable", correct: true}
      - {text: "`go run` interprète le code source ; `go build` le compile en binaire", correct: false}
      - {text: "`go run` compile et installe dans `$GOPATH/bin` ; `go build` exécute", correct: false}
      - {text: "`go run` lance les tests ; `go build` compile et exécute le programme", correct: false}
    answer: "`go run` compile dans un dossier temporaire puis exécute ; `go build` produit l'exécutable dans le dossier courant. Les deux compilent : Go n'est jamais interprété."
  - key: vf-main-parametres
    format: true-false
    question: La fonction `main` peut recevoir les arguments de la ligne de commande en paramètre.
    truth: false
    answer: '`main` ne prend aucun paramètre ; les arguments sont dans `os.Args`.'
  - key: vf-import-inutilise
    format: true-false
    question: Un import inutilisé est une erreur de compilation en Go.
    truth: true
    answer: Le compilateur le refuse, pour garder des dépendances exactes ; `goimports` les retire automatiquement.
  - key: vf-package-nom
    format: true-false
    question: Un fichier `package outils` qui contient une fonction `main` produit un exécutable.
    truth: false
    answer: Seul le package `main` produit un exécutable ; ailleurs, `main` n'est qu'une fonction comme une autre.
  - key: vf-accolade
    format: true-false
    question: En Go, on peut mettre l'accolade ouvrante d'une fonction sur la ligne suivante.
    truth: false
    answer: Le point-virgule automatique serait inséré en fin de ligne et casserait la déclaration.
  - key: qcm-entree
    format: multiple-choice
    question: Quelle signature est celle du point d'entrée d'un programme Go ?
    choices:
      - text: '`func main()`'
        correct: true
      - text: '`func main(args []string)`'
        correct: false
      - text: '`func main() int`'
        correct: false
      - text: '`func Main()`'
        correct: false
    answer: Sans paramètre ni retour, en minuscules, dans le package `main`.
  - key: qcm-sortie
    format: multiple-choice
    question: Comment terminer un programme avec le code de sortie 1 ?
    choices:
      - text: '`os.Exit(1)`'
        correct: true
      - text: '`return 1` dans `main`'
        correct: false
      - text: '`panic(1)` seulement'
        correct: false
      - text: '`exit(1)`'
        correct: false
    answer: '`main` ne retourne rien ; `os.Exit` donne le code de sortie (sans exécuter les `defer`). Une `panic` non récupérée termine avec le code 2.'
  - key: qcm-fmt
    format: multiple-choice
    question: "Laquelle de ces fonctions de `fmt` écrit sur la sortie standard ?"
    choices:
      - {text: "`fmt.Printf`", correct: true}
      - {text: "`fmt.Sprintf`", correct: false}
      - {text: "`fmt.Errorf`", correct: false}
      - {text: "`fmt.Sscan`", correct: false}
    answer: "Les fonctions `Print*` écrivent sur la sortie standard, `Printf` comme `Println`. `Sprintf` renvoie une chaîne, `Errorf` une erreur, et `Sscan` lit une chaîne."
  - key: qcm-compile
    format: multiple-choice
    question: Pourquoi ce programme ne compile-t-il pas ? `package main` / `import ("fmt"; "os")` / `func main() { fmt.Println("ok") }`
    choices:
      - text: Le package `os` est importé mais pas utilisé
        correct: true
      - text: '`main` doit retourner un int'
        correct: false
      - text: '`fmt` doit être importé en premier'
        correct: false
      - text: Il manque un point-virgule
        correct: false
    answer: Un import inutilisé est une erreur ; il faut le retirer.
  - key: trous-main
    format: fill-in
    question: |-
      Complète le programme minimal :
      ```go
      package ___

      import "fmt"

      func ___() {
      	fmt.Println("Bonjour !")
      }
      ```
    blanks:
      - - main
      - - main
    answer: Le package `main` et la fonction `main` font un exécutable.
  - key: trous-import
    format: fill-in
    question: |-
      Complète l'import :
      ```go
      import ___

      func main() {
      	fmt.Println("ok")
      }
      ```
    blanks:
      - - '"fmt"'
    answer: Un chemin d'import s'écrit entre guillemets.
  - key: trous-println
    format: fill-in
    question: |-
      Complète pour afficher « Bonjour » puis passer à la ligne :
      ```go
      fmt.___("Bonjour")
      ```
    blanks:
      - - Println
    answer: '`Println` ajoute le retour à la ligne.'
  - key: trous-args
    format: fill-in
    question: |-
      Complète pour afficher le premier argument de la ligne de commande :
      ```go
      fmt.Println(os.___[1])
      ```
    blanks:
      - - Args
    answer: '`os.Args[0]` est le nom du programme, `os.Args[1]` le premier argument.'
  - key: code-println
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println("a", "b", 3)
      fmt.Print("c", "d", "\n")
      ```
    choices:
      - text: |-
          ```
          a b 3
          cd
          ```
        correct: true
      - text: |-
          ```
          a b 3
          c d
          ```
        correct: false
      - text: |-
          ```
          ab3
          cd
          ```
        correct: false
      - {text: "`a b 3 cd`", correct: false}
    answer: "`a b 3` puis `cd` : `Println` sépare toujours par des espaces et passe à la ligne, `Print` ne sépare que deux arguments qui ne sont pas des chaînes."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"a\", \"b\", 3)\n\tfmt.Print(\"c\", \"d\", \"\\n\")\n}\n"
      output: |-
        a b 3
        cd
  - key: code-print-nombres
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Print(1, 2, "x", 3)
      fmt.Println()
      ```
    choices:
      - {text: "`1 2x3`", correct: true}
      - {text: "`1 2 x 3`", correct: false}
      - {text: "`12x3`", correct: false}
      - {text: "`1 2x 3`", correct: false}
    answer: "`1 2x3` : `Print` met une espace entre deux opérandes qui ne sont pas des chaînes, ici entre 1 et 2 seulement."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Print(1, 2, \"x\", 3)\n\tfmt.Println()\n}\n"
      output: 1 2x3
  - key: code-printf
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      nom, age := "Ada", 36
      fmt.Printf("%s a %d ans\n", nom, age)
      ```
    choices:
      - {text: "`Ada a 36 ans`", correct: true}
      - {text: "`%s a %d ans`", correct: false}
      - {text: "`\"Ada\" a 36 ans`", correct: false}
      - {text: "Ça ne compile pas : `%d` attend un `int64`", correct: false}
    answer: "`Ada a 36 ans` : `%s` pour une chaîne, `%d` pour un entier de tout type. Les guillemets autour du nom, ce serait `%q`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnom, age := \"Ada\", 36\n\tfmt.Printf(\"%s a %d ans\\n\", nom, age)\n}\n"
      output: Ada a 36 ans
  - key: code-import-inutilise
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      package main

      import (
      	"fmt"
      	"strings"
      )

      func main() {
      	fmt.Println("ok")
      }
      ```
    choices:
      - {text: "Ça ne compile pas : `\"strings\" imported and not used`", correct: true}
      - {text: "`ok`", correct: false}
      - {text: "`ok`, avec un avertissement sur `strings`", correct: false}
      - {text: "Une panic au lancement : `strings` n'est jamais initialisé", correct: false}
    answer: "Rien : le programme ne compile pas, `\"strings\" imported and not used`. Un import inutilisé est une erreur, pas un avertissement."
    check:
      compiles: false
  - key: bug-main-args
    format: bug-fix
    question: |-
      Ce programme ne compile pas. Quelle correction est la bonne ?
      ```go
      package main

      import "fmt"

      func main(args []string) {
      	fmt.Println(args[1])
      }
      ```
    choices:
      - {text: "`func main()` sans paramètre, et lire l'argument dans `os.Args[1]`", correct: true}
      - {text: "`func main(args ...string)`, la forme variadique qu'attend Go", correct: false}
      - {text: "`func Main(args []string)`, avec une majuscule pour l'exporter", correct: false}
      - {text: "`func main(args []string) int`, qui renvoie un code de sortie", correct: false}
    answer: |-
      ```go
      package main

      import (
      	"fmt"
      	"os"
      )

      func main() {
      	fmt.Println(os.Args[1])
      }
      ```
      `main` ne prend aucun paramètre et ne renvoie rien : les arguments se lisent dans `os.Args`.
  - key: bug-accolade
    format: bug-fix
    question: |-
      Le compilateur signale « unexpected semicolon or newline before { ». Quelle correction est la bonne ?
      ```go
      func main()
      {
      	fmt.Println("Bonjour")
      }
      ```
    choices:
      - {text: "Remonter l'accolade ouvrante sur la ligne de `func main()`", correct: true}
      - {text: "Ajouter un point-virgule explicite après `func main()`", correct: false}
      - {text: "Indenter l'accolade ouvrante d'une tabulation", correct: false}
      - {text: "Écrire `func main() ->` pour annoncer le corps", correct: false}
    answer: |-
      ```go
      func main() {
      	fmt.Println("Bonjour")
      }
      ```
      Le point-virgule automatique est inséré à la fin de `func main()` : l'accolade ouvrante doit être sur la même ligne.
  - key: bug-package
    format: bug-fix
    question: |-
      `go run main.go` répond « package command-line-arguments is not a main package ». Quelle correction est la bonne ?
      ```go
      package bonjour

      import "fmt"

      func main() {
      	fmt.Println("Bonjour")
      }
      ```
    choices:
      - {text: "Déclarer `package main` en tête du fichier", correct: true}
      - {text: "Renommer la fonction `main` en `Main`, pour l'exporter", correct: false}
      - {text: "Lancer `go run .` au lieu de `go run main.go`", correct: false}
      - {text: "Ajouter une fonction `init()`, le point d'entrée d'un package", correct: false}
    answer: |-
      ```go
      package main
      ```
      Seul le package `main` produit un exécutable ; `init` s'exécute au chargement d'un package, mais ne le rend pas exécutable. `go run .` échouerait de même, en nommant le module (« package exemple.com/outils is not a main package »).
  - key: bug-minuscule
    format: bug-fix
    question: |-
      Le compilateur signale « undefined: fmt.println ». Quelle correction est la bonne ?
      ```go
      fmt.println("Bonjour")
      ```
    choices:
      - {text: "`fmt.Println` : les noms exportés commencent par une majuscule", correct: true}
      - {text: "Importer `fmt/println`, le sous-package qui définit la fonction", correct: false}
      - {text: "Écrire `fmt::println`, la syntaxe d'accès à un package", correct: false}
      - {text: "Exporter la fonction avec `export fmt.println` en tête de fichier", correct: false}
    answer: |-
      ```go
      fmt.Println("Bonjour")
      ```
      Les noms exportés d'un package commencent par une majuscule ; `println` (minuscule) n'existe pas dans `fmt`.
