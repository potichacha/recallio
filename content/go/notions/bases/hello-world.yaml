notion: hello-world
lesson: "Le plus petit programme Go :\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Bonjour !\")\n}\n```\n\n- `package main` : le package d'un **exécutable**. Un autre nom de package fait une bibliothèque, qui ne se lance pas.\n- `import \"fmt\"` : le package de formatage de la bibliothèque standard. Un import **inutilisé** est une erreur de\n  compilation.\n- `func main()` : le point d'entrée, **sans paramètre ni valeur de retour**. Les arguments de la ligne de commande sont\n  dans `os.Args`, et le code de sortie se donne avec `os.Exit`.\n- `fmt.Println` affiche ses arguments séparés par des espaces, puis un retour à la ligne. `fmt.Print` n'ajoute ni\n  espace entre deux chaînes ni retour à la ligne, `fmt.Printf` formate (`%d`, `%s`, `%v`).\n- Le nom exporté `Println` commence par une **majuscule** : c'est ce qui le rend visible hors de son package.\n\nOn lance avec `go run main.go` (compiler puis exécuter), ou `go build` (produire l'exécutable). Le fichier doit être en\nUTF-8 ; l'accolade ouvrante est **sur la même ligne** que `func main()`, sinon le point-virgule automatique casse la\ncompilation.\n\n**Piège classique** : écrire `func main(args []string)` comme en Java ou en C. En Go, `main` ne prend rien.\n\n**En entretien** : « `package main`, `func main()` sans paramètre, les imports utilisés ; `os.Args` pour les arguments et\n`os.Exit` pour le code de sortie. »"
tour:
  - title: Le premier programme
    text: |-
      Tout programme Go exécutable a la même forme :

      - `package main` : le fichier appartient au package `main`, celui d'un **exécutable** ;
      - `import "fmt"` : on importe le package de la bibliothèque standard qui affiche et formate ;
      - `func main()` : le point d'entrée. Il ne prend **aucun paramètre** et ne renvoie rien.

      `fmt.Println` affiche ses arguments séparés par des espaces, puis passe à la ligne. Ses arguments peuvent être de
      n'importe quel type : ici une chaîne, puis le résultat d'un calcul.

      Essaie : remplace un `Println` par `Print` et exécute. `Print` ne passe pas à la ligne, et ne met un espace
      qu'entre deux arguments qui ne sont pas des chaînes.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Bonjour, Go !")
          	fmt.Println("2 + 3 =", 2+3)
          }
      output: |-
        Bonjour, Go !
        2 + 3 = 5
    task:
      instructions: |-
        Fais afficher `Go a été rendu public en 2009`, en passant l'année à `fmt.Println` comme un **nombre**, dans un
        second argument.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Go a été rendu public en ...")
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Go a été rendu public en", 2009)
          }
      output: Go a été rendu public en 2009
cards:
  - key: package-main
    format: course
    question: Que doit déclarer le fichier d'un programme exécutable ?
    answer: Le package `main` et une fonction `main` sans paramètre ni valeur de retour.
  - key: args
    format: course
    question: Où lire les arguments de la ligne de commande ?
    answer: Dans `os.Args` (le premier élément est le nom du programme), ou avec le package `flag` pour des options.
  - key: println-print
    format: course
    question: Quelle différence entre `fmt.Print` et `fmt.Println` ?
    answer: '`Println` ajoute toujours un espace entre les arguments et un retour à la ligne final ; `Print` n''ajoute un espace qu''entre deux arguments qui ne sont pas des chaînes, et pas de retour à la ligne.'
  - key: run-build
    format: course
    question: Que font `go run` et `go build` ?
    answer: '`go run` compile dans un dossier temporaire puis exécute ; `go build` produit l''exécutable dans le dossier courant.'
  - key: vf-main-parametres
    format: true-false
    question: La fonction `main` peut recevoir les arguments de la ligne de commande en paramètre.
    truth: false
    answer: '`main` ne prend aucun paramètre ; les arguments sont dans `os.Args`.'
  - key: vf-import-inutilise
    format: true-false
    question: Un import inutilisé est une erreur de compilation en Go.
    truth: true
    answer: Le compilateur le refuse, pour garder des dépendances exactes ; `goimports` les retire automatiquement.
  - key: vf-package-nom
    format: true-false
    question: Un fichier `package outils` qui contient une fonction `main` produit un exécutable.
    truth: false
    answer: Seul le package `main` produit un exécutable ; ailleurs, `main` n'est qu'une fonction comme une autre.
  - key: vf-accolade
    format: true-false
    question: En Go, on peut mettre l'accolade ouvrante d'une fonction sur la ligne suivante.
    truth: false
    answer: Le point-virgule automatique serait inséré en fin de ligne et casserait la déclaration.
  - key: qcm-entree
    format: multiple-choice
    question: Quelle signature est celle du point d'entrée d'un programme Go ?
    choices:
      - text: '`func main()`'
        correct: true
      - text: '`func main(args []string)`'
        correct: false
      - text: '`func main() int`'
        correct: false
      - text: '`func Main()`'
        correct: false
    answer: Sans paramètre ni retour, en minuscules, dans le package `main`.
  - key: qcm-sortie
    format: multiple-choice
    question: Comment terminer un programme avec le code de sortie 1 ?
    choices:
      - text: '`os.Exit(1)`'
        correct: true
      - text: '`return 1` dans `main`'
        correct: false
      - text: '`panic(1)` seulement'
        correct: false
      - text: '`exit(1)`'
        correct: false
    answer: '`main` ne retourne rien ; `os.Exit` donne le code de sortie (sans exécuter les `defer`). Une `panic` non récupérée termine avec le code 2.'
  - key: qcm-fmt
    format: multiple-choice
    question: Quelles fonctions de `fmt` écrivent sur la sortie standard ?
    choices:
      - text: '`fmt.Println`'
        correct: true
      - text: '`fmt.Printf`'
        correct: true
      - text: '`fmt.Sprintf`'
        correct: false
      - text: '`fmt.Errorf`'
        correct: false
    answer: '`Sprintf` renvoie une chaîne, `Errorf` une erreur ; seules les fonctions `Print*` écrivent.'
  - key: qcm-compile
    format: multiple-choice
    question: Pourquoi ce programme ne compile-t-il pas ? `package main` / `import ("fmt"; "os")` / `func main() { fmt.Println("ok") }`
    choices:
      - text: Le package `os` est importé mais pas utilisé
        correct: true
      - text: '`main` doit retourner un int'
        correct: false
      - text: '`fmt` doit être importé en premier'
        correct: false
      - text: Il manque un point-virgule
        correct: false
    answer: Un import inutilisé est une erreur ; il faut le retirer.
  - key: trous-main
    format: fill-in
    question: "Complétez le programme minimal :\n```go\npackage ___\n\nimport \"fmt\"\n\nfunc ___() {\n\tfmt.Println(\"Bonjour !\")\n}\n```"
    blanks:
      - - main
      - - main
    answer: Le package `main` et la fonction `main` font un exécutable.
  - key: trous-import
    format: fill-in
    question: "Complétez l'import :\n```go\nimport ___\n\nfunc main() {\n\tfmt.Println(\"ok\")\n}\n```"
    blanks:
      - - '"fmt"'
    answer: Un chemin d'import s'écrit entre guillemets.
  - key: trous-println
    format: fill-in
    question: |-
      Complétez pour afficher « Bonjour » puis passer à la ligne :
      ```go
      fmt.___("Bonjour")
      ```
    blanks:
      - - Println
    answer: '`Println` ajoute le retour à la ligne.'
  - key: trous-args
    format: fill-in
    question: |-
      Complétez pour afficher le premier argument de la ligne de commande :
      ```go
      fmt.Println(os.___[1])
      ```
    blanks:
      - - Args
    answer: '`os.Args[0]` est le nom du programme, `os.Args[1]` le premier argument.'
  - key: code-println
    format: code-output
    question: |-
      ```go
      fmt.Println("a", "b", 3)
      fmt.Print("c", "d", "\n")
      ```
    answer: '`a b 3` puis `cd` : `Println` sépare toujours par des espaces, `Print` seulement entre deux arguments qui ne sont pas des chaînes.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"a\", \"b\", 3)\n\tfmt.Print(\"c\", \"d\", \"\\n\")\n}\n"
      output: |-
        a b 3
        cd
  - key: code-print-nombres
    format: code-output
    question: |-
      ```go
      fmt.Print(1, 2, "x", 3)
      fmt.Println()
      ```
    answer: '`1 2x3` : `Print` met un espace entre deux opérandes qui ne sont pas des chaînes, ici entre 1 et 2 seulement.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Print(1, 2, \"x\", 3)\n\tfmt.Println()\n}\n"
      output: 1 2x3
  - key: code-printf
    format: code-output
    question: |-
      ```go
      nom, age := "Ada", 36
      fmt.Printf("%s a %d ans\n", nom, age)
      ```
    answer: '`Ada a 36 ans` : `%s` pour une chaîne, `%d` pour un entier.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnom, age := \"Ada\", 36\n\tfmt.Printf(\"%s a %d ans\\n\", nom, age)\n}\n"
      output: Ada a 36 ans
  - key: code-import-inutilise
    format: code-output
    question: "```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(\"ok\")\n}\n```"
    answer: 'Rien : le programme ne compile pas, `"strings" imported and not used`.'
    check:
      compiles: false
  - key: bug-main-args
    format: bug-fix
    question: "Ce programme ne compile pas :\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main(args []string) {\n\tfmt.Println(args[1])\n}\n```"
    answer: "```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tfmt.Println(os.Args[1])\n}\n```\n`main` ne prend aucun paramètre : les arguments se lisent dans `os.Args`."
  - key: bug-accolade
    format: bug-fix
    question: "Le compilateur signale « unexpected semicolon or newline before { » :\n```go\nfunc main()\n{\n\tfmt.Println(\"Bonjour\")\n}\n```"
    answer: "```go\nfunc main() {\n\tfmt.Println(\"Bonjour\")\n}\n```\nLe point-virgule automatique est inséré à la fin de `func main()` : l'accolade ouvrante doit être sur la même ligne."
  - key: bug-package
    format: bug-fix
    question: "`go run .` répond « package command-line-arguments is not a main package » :\n```go\npackage bonjour\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Bonjour\")\n}\n```"
    answer: |-
      ```go
      package main
      ```
      Seul le package `main` produit un exécutable.
  - key: bug-minuscule
    format: bug-fix
    question: |-
      Le compilateur signale « undefined: fmt.println » :
      ```go
      fmt.println("Bonjour")
      ```
    answer: |-
      ```go
      fmt.Println("Bonjour")
      ```
      Les noms exportés d'un package commencent par une majuscule ; `println` (minuscule) n'existe pas dans `fmt`.
