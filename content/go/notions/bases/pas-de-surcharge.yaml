notion: pas-de-surcharge
lesson: |-
  Go laisse volontairement de côté plusieurs fonctionnalités courantes ailleurs :

  - **Pas de surcharge** de fonctions ni de méthodes : un nom, une signature. On choisit des noms distincts
    (`strings.Index`, `strings.IndexByte`, `strings.IndexRune`), ou des generics quand seul le type change.
  - **Pas de paramètres par défaut** ni d'arguments nommés : on utilise une **struct d'options** dont les champs à zéro
    valent « défaut », ou des **options fonctionnelles** (`NewClient(AvecDelai(5*time.Second))`).
  - **Pas d'exceptions** : les erreurs sont des **valeurs** renvoyées et testées (`if err != nil`) ; `panic` est réservé
    aux bugs et aux situations irrécupérables.
  - **Pas de surcharge d'opérateurs** : `+` ne s'applique qu'aux types numériques et aux chaînes.
  - **Pas d'opérateur ternaire** (`a ? b : c`) : un `if` suffit.

  La raison est la même partout : **lisibilité et simplicité**. Un appel `f(x)` désigne toujours la même fonction,
  sans résolution compliquée ; une erreur possible se voit dans la signature ; le code d'un autre se lit sans surprise.
  Le coût : un code parfois plus long à écrire.

  **Piège classique** : simuler des paramètres par défaut avec des `...` (`func Connecter(opts ...string)`). On perd le
  typage et le sens de chaque argument ; une struct d'options est plus claire.

  **En entretien** : « Ni surcharge, ni valeurs par défaut, ni exceptions, ni ternaire : des choix pour la lisibilité ;
  on les remplace par des noms explicites, des structs d'options, des erreurs valeurs et un simple if. »
cards:
  - key: supporte-surcharge-fonctions
    format: course
    question: Go supporte-t-il la surcharge de fonctions ?
    answer: Non, ni les paramètres par défaut.
  - key: remplacer-defaut
    format: course
    question: Comment remplacer des paramètres par défaut en Go ?
    answer: Par une struct d'options dont les champs à zéro valent « défaut », ou par des options fonctionnelles passées en paramètres variadiques.
  - key: ternaire
    format: course
    question: Go a-t-il un opérateur ternaire ?
    answer: 'Non : on écrit un `if`/`else` (ou une petite fonction) ; les concepteurs le jugeaient source d''expressions illisibles.'
  - key: pourquoi
    format: course
    question: Pourquoi Go refuse-t-il la surcharge ?
    answer: 'Pour qu''un nom désigne toujours une seule fonction : pas de résolution d''appel compliquée, un code plus facile à lire et à outiller.'
  - key: vf-surcharge
    format: true-false
    question: On peut déclarer `func Aire(r float64)` et `func Aire(l, h float64)` dans le même package.
    truth: false
    answer: '« Aire redeclared in this block » : un nom par fonction.'
  - key: vf-operateurs
    format: true-false
    question: On peut définir l'opérateur `+` pour une struct `Vecteur`.
    truth: false
    answer: Go n'a pas de surcharge d'opérateurs ; on écrit une méthode `Ajouter`.
  - key: vf-exceptions
    format: true-false
    question: En Go, une erreur attendue (fichier absent) se signale par une panique.
    truth: false
    answer: Par une valeur `error` renvoyée ; `panic` est pour les bugs et l'irrécupérable.
  - key: vf-generics
    format: true-false
    question: Les generics remplacent certaines surcharges qui ne différaient que par le type.
    truth: true
    answer: '`func Max[T cmp.Ordered](a, b T) T` évite `MaxInt`, `MaxFloat`...'
  - key: qcm-absents
    format: multiple-choice
    question: Quelles fonctionnalités Go n'a-t-il pas ?
    choices:
      - text: L'opérateur ternaire
        correct: true
      - text: Les paramètres par défaut
        correct: true
      - text: Les fonctions anonymes
        correct: false
      - text: Les retours multiples
        correct: false
    answer: Go a les closures et les retours multiples, mais pas de ternaire ni de valeurs par défaut.
  - key: qcm-remplacer
    format: multiple-choice
    question: Comment offrir plusieurs façons de construire un `Client` ?
    choices:
      - text: Des options fonctionnelles `NewClient(opts ...Option)`
        correct: true
      - text: Une struct `ClientOptions` passée à `NewClient`
        correct: true
      - text: Plusieurs fonctions `NewClient` avec des signatures différentes
        correct: false
      - text: Des paramètres par défaut dans `NewClient`
        correct: false
    answer: Ou des noms distincts (`NewClientAvecDelai`), à petite dose.
  - key: qcm-noms
    format: multiple-choice
    question: Comment la bibliothèque standard gère-t-elle l'absence de surcharge dans `strings` ?
    choices:
      - text: 'Des noms distincts : `Index`, `IndexByte`, `IndexRune`, `IndexFunc`'
        correct: true
      - text: Une seule fonction `Index` qui accepte `any`
        correct: false
      - text: Des annotations de surcharge
        correct: false
      - text: Des sous-packages par type
        correct: false
    answer: Le nom dit ce que prend la fonction.
  - key: qcm-ternaire
    format: multiple-choice
    question: Comment écrire « `mot` vaut "un" si n == 1, "plusieurs" sinon » ?
    choices:
      - text: '`mot := "plusieurs"` puis `if n == 1 { mot = "un" }`'
        correct: true
      - text: '`mot := n == 1 ? "un" : "plusieurs"`'
        correct: false
      - text: '`mot := if n == 1 { "un" } else { "plusieurs" }`'
        correct: false
      - text: '`mot := ternary(n == 1, "un", "plusieurs")` sans la définir'
        correct: false
    answer: '`if` est une instruction, pas une expression ; on affecte dans les branches.'
  - key: scenario-api
    format: scenario
    question: Tu portes en Go une bibliothèque Java dont la méthode `envoyer` a cinq surcharges. Comment conçois-tu l'API ?
    answer: |-
      Je regarde ce qui varie vraiment. Si c'est le type d'un argument, des generics ou une interface (`io.Reader` au lieu
      de `String`, `byte[]` et `File`) donnent une seule fonction. Si ce sont des paramètres facultatifs, une struct
      d'options ou des options fonctionnelles. Si les comportements diffèrent, des noms distincts (`Envoyer`,
      `EnvoyerAvecPieceJointe`). Le but est qu'un appel se lise sans connaître la règle de résolution.
  - key: scenario-exceptions
    format: scenario
    question: Un développeur Java regrette les exceptions. Quels avantages des erreurs-valeurs lui présentes-tu ?
    answer: |-
      La signature dit qu'une fonction peut échouer, et le code qui traite l'erreur est juste à côté de l'appel : pas de
      chemin d'exécution caché. On décide localement d'ajouter du contexte (`fmt.Errorf("lecture %s : %w", p, err)`), de
      réessayer ou de remonter. Les erreurs se composent (`errors.Is`, `errors.As`) sans hiérarchie de classes. Le prix
      est la répétition de `if err != nil`, qui rend aussi les cas d'échec visibles en revue.
  - key: scenario-ternaire
    format: scenario
    question: On te demande en entretien pourquoi Go n'a pas d'opérateur ternaire. Que réponds-tu ?
    answer: |-
      Les concepteurs ont jugé que le ternaire mène trop souvent à des expressions imbriquées illisibles, et qu'un `if`
      de trois lignes est toujours clair. Go préfère une seule façon d'écrire une décision. Quand le cas revient souvent,
      on écrit une petite fonction ; depuis Go 1.22, `cmp.Or` couvre aussi le cas « la première valeur non nulle ».
  - key: scenario-config
    format: scenario
    question: Une fonction prend huit paramètres, dont six facultatifs. Comment la rendre lisible sans paramètres par défaut ?
    answer: |-
      Je regroupe les paramètres facultatifs dans une struct d'options, avec des valeurs zéro qui signifient « défaut »
      et un commentaire sur chaque champ : `Exporter(ctx, donnees, ExportOptions{Format: CSV, Compresser: true})`. Les
      paramètres obligatoires restent explicites. Si la struct doit évoluer sans casser les appelants ou valider ses
      options, les options fonctionnelles sont une alternative.
