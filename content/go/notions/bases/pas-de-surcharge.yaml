notion: pas-de-surcharge
lesson: |-
  Go laisse volontairement de côté plusieurs fonctionnalités courantes ailleurs :

  - **Pas de surcharge** de fonctions ni de méthodes : un nom, une signature. On choisit des noms distincts
    (`strings.Index`, `strings.IndexByte`, `strings.IndexRune`), ou des generics quand seul le type change.
  - **Pas de paramètres par défaut** ni d'arguments nommés : on utilise une **struct d'options** dont les champs à zéro
    valent « défaut », ou des **options fonctionnelles** (`NewClient(AvecDelai(5*time.Second))`).
  - **Pas d'exceptions** : les erreurs sont des **valeurs** renvoyées et testées (`if err != nil`) ; `panic` est réservé
    aux bugs et aux situations irrécupérables.
  - **Pas de surcharge d'opérateurs** : `+` ne s'applique qu'aux types numériques et aux chaînes.
  - **Pas d'opérateur ternaire** (`a ? b : c`) : un `if` suffit.

  La raison est la même partout : **lisibilité et simplicité**. Un appel `f(x)` désigne toujours la même fonction,
  sans résolution compliquée ; une erreur possible se voit dans la signature ; le code d'un autre se lit sans surprise.
  Le coût : un code parfois plus long à écrire.

  **Piège classique** : simuler des paramètres par défaut avec des `...` (`func Connecter(opts ...string)`). On perd le
  typage et le sens de chaque argument ; une struct d'options est plus claire.

  **En entretien** : « Ni surcharge, ni valeurs par défaut, ni exceptions, ni ternaire : des choix pour la lisibilité ;
  on les remplace par des noms explicites, des structs d'options, des erreurs valeurs et un simple if. »
tour:
  - title: Ni surcharge, ni paramètres par défaut
    text: |-
      Go a choisi la simplicité : pas de **surcharge** (deux fonctions d'un même package n'ont jamais le même nom), pas
      de **paramètres par défaut**, pas d'**exceptions**.

      À la place :

      - des noms différents, comme `strconv.Itoa` et `strconv.FormatFloat` ;
      - une struct d'options quand les paramètres sont nombreux : sa valeur zéro sert de réglage par défaut ;
      - une `error` en dernier résultat quand une fonction peut échouer. Les erreurs ont leur chapitre.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          type Options struct {
          	Majuscules  bool
          	Ponctuation string
          }

          func saluer(nom string, opts Options) string {
          	if opts.Ponctuation == "" {
          		opts.Ponctuation = "."
          	}
          	salut := "Bonjour, " + nom + opts.Ponctuation
          	if opts.Majuscules {
          		salut = strings.ToUpper(salut)
          	}
          	return salut
          }

          func main() {
          	fmt.Println(saluer("Ada", Options{}))
          	fmt.Println(saluer("Ada", Options{Majuscules: true, Ponctuation: " !"}))
          }
      output: |-
        Bonjour, Ada.
        BONJOUR, ADA !
cards:
  - key: supporte-surcharge-fonctions
    format: course
    question: Go supporte-t-il la surcharge de fonctions ?
    choices:
      - {text: "Non, et il n'a pas non plus de paramètres par défaut", correct: true}
      - {text: "Oui, comme Java, sur le nombre et le type des paramètres", correct: false}
      - {text: "Oui, mais pour les méthodes seulement, pas les fonctions", correct: false}
      - {text: "Oui, depuis l'arrivée des génériques en Go 1.18", correct: false}
    answer: "Non, ni les paramètres par défaut : un nom désigne une seule fonction. Les génériques ne sont pas de la surcharge : une seule fonction, paramétrée par un type."
  - key: remplacer-defaut
    format: course
    question: Comment remplacer des paramètres par défaut en Go ?
    choices:
      - {text: "Une struct d'options aux champs zéro « défaut », ou des options fonctionnelles", correct: true}
      - {text: "Une valeur après le type, `port int = 5432`, comme en Python ou en Kotlin", correct: false}
      - {text: "Une surcharge de la fonction pour chaque combinaison de paramètres", correct: false}
      - {text: "Une directive `//go:default` placée au-dessus du paramètre", correct: false}
    answer: "Par une struct d'options dont les champs à zéro valent « défaut », ou par des options fonctionnelles passées en paramètres variadiques."
  - key: ternaire
    format: course
    question: Go a-t-il un opérateur ternaire ?
    choices:
      - {text: "Non : on écrit un `if`/`else`, ou une petite fonction", correct: true}
      - {text: "Oui : `x := cond ? a : b`, comme en C ou en Java", correct: false}
      - {text: "Oui : `x := a if cond else b`, comme en Python", correct: false}
      - {text: "Non, mais `x := if cond { a } else { b }` le remplace", correct: false}
    answer: "Non : on écrit un `if`/`else` (ou une petite fonction) ; les concepteurs le jugeaient source d'expressions illisibles. Et `if` n'est pas une expression en Go."
  - key: pourquoi
    format: course
    question: Pourquoi Go refuse-t-il la surcharge ?
    choices:
      - {text: "Pour qu'un nom désigne une seule fonction, sans résolution d'appel compliquée", correct: true}
      - {text: "Parce que le linker ne sait pas distinguer deux fonctions de même nom", correct: false}
      - {text: "Parce que les génériques l'ont rendue inutile depuis Go 1.18", correct: false}
      - {text: "Pour réduire la taille des binaires produits par le compilateur", correct: false}
    answer: "Pour qu'un nom désigne toujours une seule fonction : pas de résolution d'appel compliquée, un code plus facile à lire et à outiller. Le refus date d'avant les génériques."
  - key: vf-surcharge
    format: true-false
    question: On peut déclarer `func Aire(r float64)` et `func Aire(l, h float64)` dans le même package.
    truth: false
    answer: '« Aire redeclared in this block » : un nom par fonction.'
  - key: vf-operateurs
    format: true-false
    question: On peut définir l'opérateur `+` pour une struct `Vecteur`.
    truth: false
    answer: Go n'a pas de surcharge d'opérateurs ; on écrit une méthode `Ajouter`.
  - key: vf-exceptions
    format: true-false
    question: En Go, une erreur attendue (fichier absent) se signale par une panique.
    truth: false
    answer: Par une valeur `error` renvoyée ; `panic` est pour les bugs et l'irrécupérable.
  - key: vf-generics
    format: true-false
    question: Les generics remplacent certaines surcharges qui ne différaient que par le type.
    truth: true
    answer: '`func Max[T cmp.Ordered](a, b T) T` évite `MaxInt`, `MaxFloat`...'
  - key: qcm-absents
    format: multiple-choice
    question: "Lesquelles de ces fonctionnalités Go n'a-t-il pas ?"
    choices:
      - text: L'opérateur ternaire
        correct: true
      - text: Les paramètres par défaut
        correct: true
      - text: Les fonctions anonymes
        correct: false
      - text: Les retours multiples
        correct: false
    answer: Go a les closures et les retours multiples, mais pas de ternaire ni de valeurs par défaut.
  - key: qcm-remplacer
    format: multiple-choice
    question: "Quelle façon idiomatique permet de construire un `Client` de plusieurs manières ?"
    choices:
      - {text: "Des options fonctionnelles : `NewClient(opts ...Option)`", correct: true}
      - {text: "Plusieurs fonctions `NewClient` aux signatures différentes", correct: false}
      - {text: "Des paramètres par défaut dans la signature de `NewClient`", correct: false}
      - {text: "Un `NewClient(args ...any)` qui teste le type de chaque argument", correct: false}
    answer: "Des options fonctionnelles, ou une struct `ClientOptions` passée à `NewClient` ; à petite dose, des noms distincts (`NewClientAvecDelai`). Ni surcharge ni valeur par défaut, et `...any` perd le typage."
  - key: qcm-noms
    format: multiple-choice
    question: Comment la bibliothèque standard gère-t-elle l'absence de surcharge dans `strings` ?
    choices:
      - {text: "Des noms distincts : `Index`, `IndexByte`, `IndexRune`, `IndexFunc`", correct: true}
      - {text: "Une seule fonction `Index` qui accepte `any` et teste le type reçu", correct: false}
      - {text: "Des annotations de surcharge, lues par le compilateur Go", correct: false}
      - {text: "Des sous-packages par type : `strings/byte`, `strings/rune`", correct: false}
    answer: Le nom dit ce que prend la fonction.
  - key: qcm-ternaire
    format: multiple-choice
    question: Comment écrire « `mot` vaut "un" si n == 1, "plusieurs" sinon » ?
    choices:
      - text: '`mot := "plusieurs"` puis `if n == 1 { mot = "un" }`'
        correct: true
      - text: '`mot := n == 1 ? "un" : "plusieurs"`'
        correct: false
      - text: '`mot := if n == 1 { "un" } else { "plusieurs" }`'
        correct: false
      - text: '`mot := ternary(n == 1, "un", "plusieurs")` sans la définir'
        correct: false
    answer: '`if` est une instruction, pas une expression ; on affecte dans les branches.'
  - key: scenario-api
    format: scenario
    question: Tu portes en Go une bibliothèque Java dont la méthode `envoyer` a cinq surcharges. Comment conçois-tu l'API ?
    choices:
      - {text: "Selon ce qui varie : une interface comme `io.Reader`, une struct d'options, ou des noms distincts", correct: true}
      - {text: "Cinq fonctions `envoyer` aux signatures différentes, entre lesquelles le compilateur choisit", correct: false}
      - {text: "Une seule fonction `envoyer(args ...any)`, qui teste le type de chaque argument reçu", correct: false}
      - {text: "Une interface `Envoyeur` à cinq méthodes, une par surcharge de la version Java", correct: false}
    answer: "Je regarde ce qui varie vraiment. Si c'est le type d'un argument, des generics ou une interface (`io.Reader` au lieu de `String`, `byte[]` et `File`) donnent une seule fonction. Si ce sont des paramètres facultatifs, une struct d'options ou des options fonctionnelles. Si les comportements diffèrent, des noms distincts (`Envoyer`, `EnvoyerAvecPieceJointe`). Un `...any` perdrait tout le typage."
  - key: scenario-exceptions
    format: scenario
    question: Un développeur Java regrette les exceptions. Quels avantages des erreurs-valeurs lui présentes-tu ?
    choices:
      - {text: "La signature dit qu'on peut échouer, et l'erreur se traite à côté de l'appel, sans chemin caché", correct: true}
      - {text: "Les erreurs-valeurs sont plus rapides, parce que Go n'a pas de pile d'appels à remonter", correct: false}
      - {text: "Les erreurs-valeurs forment une hiérarchie de classes, plus riche que celle de Java", correct: false}
      - {text: "Le compilateur vérifie que chaque erreur est traitée, comme les exceptions vérifiées", correct: false}
    answer: "La signature dit qu'une fonction peut échouer, et le code qui traite l'erreur est juste à côté de l'appel : pas de chemin d'exécution caché. On décide localement d'ajouter du contexte (`fmt.Errorf(\"lecture %s : %w\", p, err)`), de réessayer ou de remonter, et les erreurs se composent (`errors.Is`, `errors.As`) sans hiérarchie de classes. Le compilateur, lui, n'oblige pas à les traiter."
  - key: scenario-ternaire
    format: scenario
    question: On te demande en entretien pourquoi Go n'a pas d'opérateur ternaire. Que réponds-tu ?
    choices:
      - {text: "Il mène souvent à des expressions illisibles ; un `if` de trois lignes reste clair", correct: true}
      - {text: "Le lexer de Go ne sait pas analyser le caractère `?` dans une expression", correct: false}
      - {text: "Il est prévu pour une future version, avec la refonte de la gestion des erreurs", correct: false}
      - {text: "Les génériques l'ont rendu inutile depuis Go 1.18, avec `cmp.Compare`", correct: false}
    answer: "Les concepteurs ont jugé que le ternaire mène trop souvent à des expressions imbriquées illisibles, et qu'un `if` de trois lignes est toujours clair : Go préfère une seule façon d'écrire une décision. Quand le cas revient souvent, on écrit une petite fonction ; depuis Go 1.22, `cmp.Or` couvre aussi le cas « la première valeur non nulle »."
  - key: scenario-config
    format: scenario
    question: Une fonction prend huit paramètres, dont six facultatifs. Comment la rendre lisible sans paramètres par défaut ?
    choices:
      - {text: "Une struct d'options aux valeurs zéro « défaut », les paramètres obligatoires restant explicites", correct: true}
      - {text: "Huit paramètres `any`, auxquels l'appelant passe `nil` pour obtenir la valeur par défaut", correct: false}
      - {text: "Huit fonctions aux noms différents, une par combinaison de paramètres utile", correct: false}
      - {text: "Une `map[string]any` d'options, que la fonction lit clé par clé", correct: false}
    answer: "Je regroupe les paramètres facultatifs dans une struct d'options, avec des valeurs zéro qui signifient « défaut » et un commentaire sur chaque champ : `Exporter(ctx, donnees, ExportOptions{Format: CSV, Compresser: true})`. Les paramètres obligatoires restent explicites. Si la struct doit évoluer sans casser les appelants, les options fonctionnelles sont une alternative ; une map d'`any` perdrait le typage."
