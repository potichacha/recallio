notion: compatibilite-go1
lesson: |-
  La **promesse de compatibilité Go 1** (2012) : un programme écrit pour Go 1.x continue de compiler et de fonctionner
  avec les versions suivantes de Go 1, sans modification. Elle couvre le langage et la bibliothèque standard ; on peut
  monter de version de Go sans réécrire son code.

  Quand un changement de comportement est nécessaire (sécurité, correction), Go l'introduit de façon contrôlée :
  - la **directive `go`** du go.mod (`go 1.22`) dit pour quelle version le module est écrit. Certains comportements en
    dépendent : la variable de boucle par itération ne s'applique qu'aux modules en `go 1.22` ou plus ;
  - les réglages **`GODEBUG`** (`GODEBUG=http2client=0`) permettent de revenir temporairement à l'ancien comportement ;
    leurs valeurs par défaut suivent la directive `go` ;
  - la directive **`toolchain`** et la variable `GOTOOLCHAIN` choisissent la chaîne d'outils : depuis Go 1.21, un module
    qui exige une version plus récente peut faire télécharger automatiquement le bon outil (`GOTOOLCHAIN=auto`).

  Il n'y aura pas de « Go 2 » qui casse le code : les nouveautés (generics, itérateurs) arrivent dans Go 1.x.

  Les versions : deux par an (février et août), et les **deux dernières** reçoivent les correctifs de sécurité.

  **Piège classique** : croire que monter la directive `go` du go.mod ne change rien. Elle active des comportements
  nouveaux (sémantique des boucles, valeurs par défaut de GODEBUG) : on la monte en relisant les notes de version.

  **En entretien** : « Le code Go 1 compile avec tous les Go 1 suivants ; les changements de comportement passent par la
  directive go et GODEBUG ; deux versions par an, les deux dernières supportées. »
cards:
  - key: garantit-promesse-compatibilite-1
    format: course
    question: Que garantit la promesse de compatibilité Go 1 ?
    answer: Que le code valide continue de compiler et de fonctionner avec les nouvelles versions de Go 1.x.
  - key: godebug
    format: course
    question: C'est quoi GODEBUG ?
    answer: Des réglages de diagnostic et de compatibilité du runtime, contrôlables aussi par la version go du go.mod.
  - key: sert-directive-mod
    format: course
    question: À quoi sert la directive go du go.mod ?
    answer: Fixer la version minimale du langage et activer les comportements correspondants.
  - key: directive-vs-directive-toolchain
    format: course
    question: Directive go vs directive toolchain ?
    answer: Version minimale du langage vs version de la chaîne d'outils préférée.
  - key: gotoolchain-auto
    format: course
    question: Que fait GOTOOLCHAIN=auto ?
    answer: Télécharge automatiquement la chaîne d'outils exigée par le module si elle est plus récente.
  - key: terme-godebug
    format: course
    question: Que désigne « GODEBUG » ?
    answer: Réglages de comportement et de diagnostic du runtime
  - key: terme-gotoolchain
    format: course
    question: Que désigne « GOTOOLCHAIN » ?
    answer: Sélection automatique de la chaîne d'outils (Go 1.21)
  - key: terme-toolchain
    format: course
    question: Que désigne « toolchain » ?
    answer: Directive go.mod de chaîne d'outils préférée
  - key: vf-go2
    format: true-false
    question: Une version Go 2, incompatible avec Go 1, est prévue pour introduire les grandes nouveautés.
    truth: false
    answer: Les nouveautés arrivent dans Go 1.x en gardant la compatibilité ; il n'y a pas de rupture prévue.
  - key: vf-directive
    format: true-false
    question: La directive `go` du go.mod peut changer le comportement d'un programme.
    truth: true
    answer: Par exemple la variable de boucle par itération (go 1.22) et les valeurs par défaut des réglages GODEBUG.
  - key: vf-support
    format: true-false
    question: Toutes les versions de Go 1 reçoivent les correctifs de sécurité.
    truth: false
    answer: Seules les deux versions majeures les plus récentes sont maintenues.
  - key: vf-godebug
    format: true-false
    question: GODEBUG permet de revenir temporairement à un ancien comportement après une montée de version.
    truth: true
    answer: Par exemple `GODEBUG=x509sha1=1`, ou une ligne `godebug` dans le go.mod.
  - key: qcm-couvre
    format: multiple-choice
    question: Que couvre la promesse de compatibilité Go 1 ?
    choices:
      - text: Le langage
        correct: true
      - text: La bibliothèque standard
        correct: true
      - text: Les bibliothèques tierces du module
        correct: false
      - text: Les détails non spécifiés, comme l'ordre d'itération d'une map
        correct: false
    answer: Ce que la spécification ne garantit pas peut changer, et le code qui en dépend peut casser.
  - key: qcm-rythme
    format: multiple-choice
    question: À quel rythme sortent les versions majeures de Go ?
    choices:
      - text: Deux par an, en février et en août
        correct: true
      - text: Une tous les trois ans
        correct: false
      - text: Une par mois
        correct: false
      - text: Sans calendrier
        correct: false
    answer: Un rythme régulier de six mois, chaque version étant supportée environ un an.
  - key: qcm-toolchain
    format: multiple-choice
    question: Que se passe-t-il avec Go 1.25 installé et `GOTOOLCHAIN=auto` dans un module qui exige `go 1.27` ?
    choices:
      - text: La commande go télécharge et utilise la chaîne d'outils 1.27
        correct: true
      - text: La compilation échoue sans rien télécharger
        correct: false
      - text: Le code est compilé en Go 1.25 en ignorant la directive
        correct: false
      - text: go.mod est réécrit en go 1.25
        correct: false
    answer: Depuis Go 1.21 ; avec `GOTOOLCHAIN=local`, la commande refuse au lieu de télécharger.
  - key: qcm-monter
    format: multiple-choice
    question: Que faire avant de monter la directive `go` d'un module de 1.21 à 1.27 ?
    choices:
      - text: Lire les notes de version pour les changements de comportement
        correct: true
      - text: Lancer les tests avec le détecteur de courses
        correct: true
      - text: Réécrire le code pour Go 2
        correct: false
      - text: Supprimer go.sum
        correct: false
    answer: La directive active des comportements nouveaux, comme la sémantique des boucles depuis 1.22.
  - key: scenario-montee
    format: scenario
    question: Ton service est encore compilé en Go 1.21, qui n'est plus supporté. Comment montes-tu de version sans risque ?
    answer: |-
      Je compile d'abord avec le nouveau Go sans toucher la directive `go` : la compatibilité Go 1 garantit que le code
      fonctionne, et les tests le confirment. Puis je monte la directive par étapes en lisant les notes de version, en
      particulier la sémantique des boucles de 1.22 (qui corrige plus de bugs qu'elle n'en crée). Je lance les tests avec
      `-race`, je garde des réglages GODEBUG pour un comportement qui gênerait, et je retire ces réglages ensuite.
      `go fix` modernise le code au passage.
  - key: scenario-casse
    format: scenario
    question: Après une montée de version de Go, un test échoue parce qu'il comparait la sortie d'une map affichée. Est-ce une rupture de compatibilité ?
    answer: |-
      Non : l'ordre d'itération d'une map n'a jamais été garanti, la spécification le dit. Le test dépendait d'un détail
      non spécifié. On le corrige en triant les clés (`slices.Sorted(maps.Keys(m))`) ou en comparant les maps
      elles-mêmes. La promesse couvre le comportement spécifié, pas les détails d'implémentation.
  - key: scenario-godebug
    format: scenario
    question: Une montée de version rend un client TLS incompatible avec un vieux serveur partenaire. Que fais-tu en urgence, puis à terme ?
    answer: |-
      En urgence, je rétablis l'ancien comportement par le réglage GODEBUG correspondant (en variable d'environnement,
      ou par une ligne `godebug` dans go.mod), documenté dans les notes de version. À terme, je demande au partenaire de
      mettre à jour son serveur et je retire le réglage : ces options disparaissent après quelques versions, et elles
      désactivent souvent une protection.
  - key: scenario-equipe-versions
    format: scenario
    question: Comment garantir que toute l'équipe et la CI compilent avec la même version de Go ?
    answer: |-
      La directive `go` fixe la version minimale du langage ; la directive `toolchain` (ou `go` seule, depuis 1.21)
      indique la chaîne d'outils attendue, et `GOTOOLCHAIN=auto` la fait télécharger aux postes plus anciens. En CI, on
      installe exactement cette version (setup-go avec `go-version-file: go.mod`) et l'on peut mettre
      `GOTOOLCHAIN=local` pour éviter un téléchargement surprise.
