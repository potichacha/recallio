notion: compatibilite-go1
lesson: |-
  La **promesse de compatibilité Go 1** (2012) : un programme écrit pour Go 1.x continue de compiler et de fonctionner
  avec les versions suivantes de Go 1, sans modification. Elle couvre le langage et la bibliothèque standard ; on peut
  monter de version de Go sans réécrire son code.

  Quand un changement de comportement est nécessaire (sécurité, correction), Go l'introduit de façon contrôlée :
  - la **directive `go`** du go.mod (`go 1.22`) dit pour quelle version le module est écrit. Certains comportements en
    dépendent : la variable de boucle par itération ne s'applique qu'aux modules en `go 1.22` ou plus ;
  - les réglages **`GODEBUG`** (`GODEBUG=http2client=0`) permettent de revenir temporairement à l'ancien comportement ;
    leurs valeurs par défaut suivent la directive `go` ;
  - la directive **`toolchain`** et la variable `GOTOOLCHAIN` choisissent la chaîne d'outils : depuis Go 1.21, un module
    qui exige une version plus récente peut faire télécharger automatiquement le bon outil (`GOTOOLCHAIN=auto`).

  Il n'y aura pas de « Go 2 » qui casse le code : les nouveautés (generics, itérateurs) arrivent dans Go 1.x.

  Les versions : deux par an (février et août), et les **deux dernières** reçoivent les correctifs de sécurité.

  **Piège classique** : croire que monter la directive `go` du go.mod ne change rien. Elle active des comportements
  nouveaux (sémantique des boucles, valeurs par défaut de GODEBUG) : on la monte en relisant les notes de version.

  **En entretien** : « Le code Go 1 compile avec tous les Go 1 suivants ; les changements de comportement passent par la
  directive go et GODEBUG ; deux versions par an, les deux dernières supportées. »
cards:
  - key: garantit-promesse-compatibilite-1
    format: course
    question: Que garantit la promesse de compatibilité Go 1 ?
    choices:
      - {text: "Que le code valide continue de compiler et de fonctionner avec les versions 1.x suivantes", correct: true}
      - {text: "Que tout code écrit pour une version récente compile aussi avec les versions plus anciennes", correct: false}
      - {text: "Que les bibliothèques tierces restent compatibles d'une version de Go à l'autre", correct: false}
      - {text: "Que le comportement non spécifié, comme l'ordre d'une map, ne change jamais", correct: false}
    answer: "Que le code valide continue de compiler et de fonctionner avec les nouvelles versions de Go 1.x. Elle couvre le langage et la bibliothèque standard tels que spécifiés, pas les détails d'implémentation ni les bibliothèques tierces."
  - key: godebug
    format: course
    question: "Qu'est-ce que `GODEBUG` ?"
    choices:
      - {text: "Des réglages du runtime, de diagnostic et de compatibilité, liés aussi à la directive `go`", correct: true}
      - {text: "Un mode de compilation qui ajoute les symboles de débogage au binaire produit", correct: false}
      - {text: "Le débogueur officiel de Go, qui pose des points d'arrêt dans un programme", correct: false}
      - {text: "Une variable qui active les logs détaillés de la commande `go build`", correct: false}
    answer: "Une variable d'environnement de réglages du runtime, de diagnostic (`gctrace=1`) et de compatibilité ; leurs valeurs par défaut suivent la directive `go` du go.mod. Le débogueur, lui, c'est Delve."
  - key: sert-directive-mod
    format: course
    question: "À quoi sert la directive `go` du `go.mod` ?"
    choices:
      - {text: "Fixer la version minimale du langage, et activer les comportements de cette version", correct: true}
      - {text: "Indiquer la version exacte de Go installée sur le poste du développeur", correct: false}
      - {text: "Donner le chemin du module, sous lequel ses packages sont importés", correct: false}
      - {text: "Lister les versions de Go sur lesquelles la CI doit lancer les tests", correct: false}
    answer: "Elle fixe la version minimale du langage et active les comportements correspondants (la variable de boucle par tour depuis 1.22, par exemple). Le chemin du module, c'est la directive `module`."
  - key: directive-vs-directive-toolchain
    format: course
    question: "Quelle différence entre les directives `go` et `toolchain` du `go.mod` ?"
    choices:
      - {text: "`go` fixe la version minimale du langage, `toolchain` la chaîne d'outils préférée", correct: true}
      - {text: "`go` fixe la chaîne d'outils exacte, `toolchain` la version minimale du langage", correct: false}
      - {text: "`go` sert à compiler, `toolchain` ne sert qu'aux outils comme `gofmt` ou `vet`", correct: false}
      - {text: "Aucune : `toolchain` est l'ancien nom de `go`, gardé pour la compatibilité", correct: false}
    answer: "`go` fixe la version minimale du langage ; `toolchain` indique la chaîne d'outils préférée pour compiler le module, téléchargée au besoin avec `GOTOOLCHAIN=auto`."
  - key: gotoolchain-auto
    format: course
    question: "Que fait `GOTOOLCHAIN=auto` ?"
    choices:
      - {text: "Il télécharge la chaîne d'outils exigée par le module si elle est plus récente", correct: true}
      - {text: "Il met à jour le Go installé sur le poste vers la dernière version publiée", correct: false}
      - {text: "Il compile avec la version locale, même si le module en exige une plus récente", correct: false}
      - {text: "Il choisit la plus ancienne version de Go capable de compiler le module", correct: false}
    answer: "Il télécharge automatiquement la chaîne d'outils exigée par le module si elle est plus récente que celle installée, sans rien changer à l'installation. `GOTOOLCHAIN=local` refuse au contraire de télécharger."
  - key: terme-godebug
    format: course
    question: Que désigne « GODEBUG » ?
    choices:
      - {text: "Des réglages de comportement et de diagnostic du runtime", correct: true}
      - {text: "Le débogueur pas à pas livré avec la chaîne d'outils Go", correct: false}
      - {text: "Une option de `go build` qui désactive les optimisations", correct: false}
      - {text: "La variable qui choisit la version de Go à télécharger", correct: false}
    answer: "Des réglages de comportement et de diagnostic du runtime, comme `GODEBUG=gctrace=1`. Choisir la version de Go à télécharger, c'est `GOTOOLCHAIN`."
  - key: terme-gotoolchain
    format: course
    question: Que désigne « GOTOOLCHAIN » ?
    choices:
      - {text: "La sélection automatique de la chaîne d'outils, depuis Go 1.21", correct: true}
      - {text: "Le dossier où `go install` range les binaires qu'il installe", correct: false}
      - {text: "La plateforme cible de la compilation, comme `linux/amd64`", correct: false}
      - {text: "Les réglages de compatibilité et de diagnostic du runtime", correct: false}
    answer: "La variable qui pilote la sélection de la chaîne d'outils (Go 1.21) : `auto` télécharge celle qu'exige le module, `local` s'en tient à celle installée. Le dossier des binaires, c'est `GOBIN` ; la plateforme, `GOOS` et `GOARCH`."
  - key: terme-toolchain
    format: course
    question: "Que désigne la directive « toolchain » du `go.mod` ?"
    choices:
      - {text: "La chaîne d'outils préférée pour compiler le module", correct: true}
      - {text: "La version minimale du langage exigée par le module", correct: false}
      - {text: "La liste des outils de génération de code du projet", correct: false}
      - {text: "Le compilateur C qu'utilise cgo pour ce module", correct: false}
    answer: "La chaîne d'outils préférée, par exemple `toolchain go1.27.1`. La version minimale du langage, c'est la directive `go` ; les outils du projet, la directive `tool`."
  - key: vf-go2
    format: true-false
    question: Une version Go 2, incompatible avec Go 1, est prévue pour introduire les grandes nouveautés.
    truth: false
    answer: Les nouveautés arrivent dans Go 1.x en gardant la compatibilité ; il n'y a pas de rupture prévue.
  - key: vf-directive
    format: true-false
    question: La directive `go` du go.mod peut changer le comportement d'un programme.
    truth: true
    answer: Par exemple la variable de boucle par itération (go 1.22) et les valeurs par défaut des réglages GODEBUG.
  - key: vf-support
    format: true-false
    question: Toutes les versions de Go 1 reçoivent les correctifs de sécurité.
    truth: false
    answer: Seules les deux versions majeures les plus récentes sont maintenues.
  - key: vf-godebug
    format: true-false
    question: GODEBUG permet de revenir temporairement à un ancien comportement après une montée de version.
    truth: true
    answer: Par exemple `GODEBUG=x509sha1=1`, ou une ligne `godebug` dans le go.mod.
  - key: qcm-couvre
    format: multiple-choice
    question: "Lesquels de ces éléments la promesse de compatibilité Go 1 couvre-t-elle ?"
    choices:
      - text: Le langage
        correct: true
      - text: La bibliothèque standard
        correct: true
      - text: Les bibliothèques tierces du module
        correct: false
      - text: Les détails non spécifiés, comme l'ordre d'itération d'une map
        correct: false
    answer: Ce que la spécification ne garantit pas peut changer, et le code qui en dépend peut casser.
  - key: qcm-rythme
    format: multiple-choice
    question: À quel rythme sortent les versions majeures de Go ?
    choices:
      - text: Deux par an, en février et en août
        correct: true
      - text: Une tous les trois ans
        correct: false
      - text: Une par mois
        correct: false
      - text: Sans calendrier
        correct: false
    answer: Un rythme régulier de six mois, chaque version étant supportée environ un an.
  - key: qcm-toolchain
    format: multiple-choice
    question: Que se passe-t-il avec Go 1.25 installé et `GOTOOLCHAIN=auto` dans un module qui exige `go 1.27` ?
    choices:
      - text: La commande go télécharge et utilise la chaîne d'outils 1.27
        correct: true
      - text: La compilation échoue sans rien télécharger
        correct: false
      - text: Le code est compilé en Go 1.25 en ignorant la directive
        correct: false
      - text: go.mod est réécrit en go 1.25
        correct: false
    answer: Depuis Go 1.21 ; avec `GOTOOLCHAIN=local`, la commande refuse au lieu de télécharger.
  - key: qcm-monter
    format: multiple-choice
    question: "Quelle précaution prendre avant de monter la directive `go` d'un module de 1.21 à 1.27 ?"
    choices:
      - {text: "Lire les notes de version et lancer les tests, avec le détecteur de courses", correct: true}
      - {text: "Réécrire le code pour Go 2, qui remplacera Go 1 dans les versions suivantes", correct: false}
      - {text: "Supprimer `go.sum`, que la nouvelle version régénère avec ses propres règles", correct: false}
      - {text: "Aucune : la promesse Go 1 garantit un comportement identique en tout point", correct: false}
    answer: "La directive active des comportements nouveaux, comme la sémantique des boucles depuis 1.22 : on lit les notes de version et on lance les tests, avec `-race`. Il n'y aura pas de Go 2 qui casse le code Go 1."
  - key: scenario-montee
    format: scenario
    question: Ton service est encore compilé en Go 1.21, qui n'est plus supporté. Comment montes-tu de version sans risque ?
    choices:
      - {text: "Compiler avec le nouveau Go sans toucher la directive, puis la monter par étapes, tests et `-race` à l'appui", correct: true}
      - {text: "Monter d'un coup la directive à la dernière version : la promesse Go 1 garantit le même comportement", correct: false}
      - {text: "Rester en 1.21 tant que rien ne casse : une version non supportée reste sûre pour un service stable", correct: false}
      - {text: "Réécrire à la main toutes les boucles et les maps avant de changer de version, par précaution", correct: false}
    answer: "Je compile d'abord avec le nouveau Go sans toucher la directive `go` : la compatibilité Go 1 garantit que le code fonctionne, et les tests le confirment. Puis je monte la directive par étapes en lisant les notes de version (la sémantique des boucles de 1.22, notamment), avec `-race`, en gardant au besoin un réglage GODEBUG que je retire ensuite. Une version non supportée ne reçoit plus de correctifs de sécurité."
  - key: scenario-casse
    format: scenario
    question: Après une montée de version de Go, un test échoue parce qu'il comparait la sortie d'une map affichée. Est-ce une rupture de compatibilité ?
    choices:
      - {text: "Non : l'ordre d'une map n'a jamais été spécifié ; on trie les clés dans le test", correct: true}
      - {text: "Oui : Go 1 garantit l'ordre d'itération d'une map d'une version à l'autre", correct: false}
      - {text: "Oui : il faut signaler le bug et rester sur l'ancienne version de Go", correct: false}
      - {text: "Non, mais on règle `GODEBUG` pour retrouver l'ancien ordre de la map", correct: false}
    answer: "Non : l'ordre d'itération d'une map n'a jamais été garanti, la spécification le dit, et il est même rendu aléatoire exprès. Le test dépendait d'un détail non spécifié : on trie les clés (`slices.Sorted(maps.Keys(m))`) ou on compare les maps elles-mêmes. Aucun réglage GODEBUG ne fixe cet ordre."
  - key: scenario-godebug
    format: scenario
    question: Une montée de version rend un client TLS incompatible avec un vieux serveur partenaire. Que fais-tu en urgence, puis à terme ?
    choices:
      - {text: "Rétablir l'ancien comportement par son réglage `GODEBUG`, puis faire mettre à jour le serveur et retirer le réglage", correct: true}
      - {text: "Revenir pour de bon à l'ancienne version de Go, et ne plus jamais faire monter ce service de version", correct: false}
      - {text: "Désactiver la vérification des certificats avec `InsecureSkipVerify`, le temps que l'incident passe", correct: false}
      - {text: "Copier dans le projet le code TLS de l'ancienne bibliothèque standard, pour le garder tel quel", correct: false}
    answer: "En urgence, je rétablis l'ancien comportement par le réglage GODEBUG documenté dans les notes de version (en variable d'environnement, ou par une ligne `godebug` dans go.mod). À terme, je fais mettre à jour le serveur du partenaire et je retire le réglage : ces options disparaissent après quelques versions, et elles désactivent souvent une protection."
  - key: scenario-equipe-versions
    format: scenario
    question: Comment garantir que toute l'équipe et la CI compilent avec la même version de Go ?
    choices:
      - {text: "Les directives `go` et `toolchain` du go.mod, et une CI qui installe la version du go.mod", correct: true}
      - {text: "Un paragraphe du README qui indique la version de Go à installer à la main", correct: false}
      - {text: "`GOTOOLCHAIN=local` partout, pour que chacun garde la version déjà installée", correct: false}
      - {text: "Le dossier `vendor/`, qui fige la version du compilateur avec les dépendances", correct: false}
    answer: "La directive `go` fixe la version minimale du langage, la directive `toolchain` la chaîne d'outils attendue, et `GOTOOLCHAIN=auto` la fait télécharger aux postes plus anciens. En CI, on installe exactement cette version (setup-go avec `go-version-file: go.mod`), et `GOTOOLCHAIN=local` y évite un téléchargement surprise. `vendor/` fige les dépendances, pas le compilateur."
