notion: types-nommes-alias
lesson: |-
  Deux déclarations se ressemblent mais n'ont rien à voir :

  ```go
  type Celsius float64 // un NOUVEAU type, de type sous-jacent float64
  type Octet = byte    // un ALIAS : un autre nom pour le même type
  ```

  Un **type nommé** (ou type défini) :
  - est **distinct** de son type sous-jacent : un `Celsius` ne s'affecte pas à un `float64` sans conversion
    (`float64(c)`), ni à un `Fahrenheit` ;
  - peut porter ses **propres méthodes** (`func (c Celsius) String() string`) ;
  - garde les opérations du type sous-jacent (`c + 1`, `c * 2`).

  Un **alias** (`=`) est exactement le même type : mêmes méthodes, affectation libre. Il sert surtout à **déplacer** un
  type d'un package à un autre sans casser les utilisateurs, et pour `byte`/`rune`. Les alias génériques sont permis
  depuis Go 1.24 (`type Ensemble[T comparable] = map[T]struct{}`).

  Les types nommés rendent le code plus sûr : `type IDClient int64` et `type IDCommande int64` ne se mélangent plus par
  erreur.

  **Piège classique** : croire que `type MonTemps time.Time` garde les méthodes de `time.Time`. Un type défini ne reprend
  **pas** les méthodes de son type sous-jacent (il faudrait l'embarquer dans une struct, ou un alias).

  **En entretien** : « `type T U` crée un nouveau type, qui a ses méthodes et demande une conversion ; `type T = U` est un
  alias, le même type sous un autre nom, utile pour les refactorings. »
cards:
  - key: type-nomme-vs-alias
    format: course
    question: Type nommé vs alias ?
    answer: '`type A B` crée un nouveau type distinct ; `type A = B` est le même type sous un autre nom.'
  - key: qcm-alias-generique
    format: multiple-choice
    question: Depuis quelle version peut-on déclarer un alias générique comme `type Ensemble[T comparable] = map[T]struct{}` ?
    choices:
      - text: Go 1.24
        correct: true
      - text: Go 1.18, avec les generics
        correct: false
      - text: Go 1.0
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: Les alias génériques sont arrivés en Go 1.24, après une préversion en 1.23.
  - key: code-ids
    format: code-output
    question: |-
      ```go
      type IDClient int64

      id := IDClient(7)
      fmt.Println(id+1, int64(id)*2)
      ```
    answer: '`8 14` : un type nommé garde l''arithmétique de son type sous-jacent.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype IDClient int64\n\nfunc main() {\n\tid := IDClient(7)\n\tfmt.Println(id+1, int64(id)*2)\n}\n"
      output: 8 14
  - key: methodes-perdues
    format: course
    question: '`type MonTemps time.Time` reprend-il les méthodes de `time.Time` ?'
    answer: 'Non : un type défini ne reprend pas les méthodes de son type sous-jacent ; un alias ou l''embarquement dans une struct les garderait.'
  - key: usage-alias
    format: course
    question: À quoi servent les alias de type en pratique ?
    answer: À déplacer un type entre packages sans casser les utilisateurs (l'ancien nom devient un alias du nouveau), et à donner un nom plus court ; `byte` et `rune` en sont.
  - key: securite-ids
    format: course
    question: Pourquoi déclarer `type IDClient int64` plutôt qu'utiliser `int64` ?
    answer: Pour que le compilateur refuse de passer un identifiant de commande là où on attend un identifiant de client, et pour pouvoir ajouter des méthodes.
  - key: vf-affectation
    format: true-false
    question: Avec `type Celsius float64`, une valeur `Celsius` s'affecte à une variable `float64` sans conversion.
    truth: false
    answer: Ce sont deux types distincts ; il faut `float64(c)`.
  - key: vf-alias-meme
    format: true-false
    question: Avec `type Octet = byte`, `Octet` et `byte` sont le même type.
    truth: true
    answer: Un alias n'est qu'un autre nom.
  - key: vf-operations
    format: true-false
    question: Un type `Celsius` défini sur `float64` garde l'addition et la multiplication.
    truth: true
    answer: Les opérations du type sous-jacent restent permises entre valeurs du même type.
  - key: vf-methode-alias
    format: true-false
    question: On peut déclarer une méthode sur un alias d'un type d'un autre package.
    truth: false
    answer: Une méthode se déclare dans le package du type ; un alias de `time.Time` reste `time.Time`.
  - key: qcm-compile
    format: multiple-choice
    question: Avec `type Celsius float64` et `var c Celsius = 20`, qu'est-ce qui compile ?
    choices:
      - text: '`c + 5`'
        correct: true
      - text: '`float64(c) * 1.8`'
        correct: true
      - text: '`var f float64 = c`'
        correct: false
      - text: '`math.Sqrt(c)`'
        correct: false
    answer: '`math.Sqrt` attend un `float64` : il faut convertir.'
  - key: qcm-alias-defini
    format: multiple-choice
    question: Lesquels sont des alias ?
    choices:
      - text: '`type Octet = byte`'
        correct: true
      - text: '`byte` lui-même, alias de `uint8`'
        correct: true
      - text: '`type Celsius float64`'
        correct: false
      - text: '`type Statut int`'
        correct: false
    answer: Le signe `=` distingue l'alias du type défini.
  - key: qcm-methodes
    format: multiple-choice
    question: Sur quels types peut-on déclarer une méthode dans son propre package ?
    choices:
      - text: '`type Celsius float64` déclaré dans ce package'
        correct: true
      - text: '`type Panier struct{...}` déclaré dans ce package'
        correct: true
      - text: '`float64` directement'
        correct: false
      - text: '`time.Duration`'
        correct: false
    answer: Une méthode se déclare sur un type défini dans le même package.
  - key: trous-defini
    format: fill-in
    question: |-
      Complétez pour créer un nouveau type distinct de `int64` :
      ```go
      type IDClient ___
      ```
    blanks:
      - - int64
    answer: Sans `=`, c'est un nouveau type.
  - key: trous-alias
    format: fill-in
    question: |-
      Complétez pour faire de `AncienNom` un alias de `nouveau.Type` :
      ```go
      type AncienNom ___ nouveau.Type
      ```
    blanks:
      - - '='
    answer: Le signe `=` fait un alias.
  - key: trous-conversion
    format: fill-in
    question: |-
      Complétez pour passer un `Celsius` à une fonction qui attend un `float64` :
      ```go
      math.Round(___(c))
      ```
    blanks:
      - - float64
    answer: La conversion explicite vers le type sous-jacent.
  - key: trous-methode
    format: fill-in
    question: |-
      Complétez la méthode du type nommé :
      ```go
      func (c ___) Fahrenheit() float64 { return float64(c)*1.8 + 32 }
      ```
    blanks:
      - - Celsius
    answer: Le receveur est le type défini.
  - key: code-methode
    format: code-output
    question: |-
      ```go
      type Celsius float64

      func (c Celsius) String() string { return fmt.Sprintf("%.1f°C", float64(c)) }

      var c Celsius = 21.5
      fmt.Println(c, c+1)
      ```
    answer: '`21.5°C 22.5°C` : `fmt` utilise la méthode `String` du type nommé, et `c+1` reste un `Celsius`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.1f°C\", float64(c)) }\n\nfunc main() {\n\tvar c Celsius = 21.5\n\tfmt.Println(c, c+1)\n}\n"
      output: 21.5°C 22.5°C
  - key: code-type
    format: code-output
    question: |-
      ```go
      type Celsius float64
      type Octet = byte

      var c Celsius
      var o Octet
      fmt.Printf("%T %T\n", c, o)
      ```
    answer: '`main.Celsius uint8` : le type défini a son propre nom, l''alias est le type `uint8` lui-même.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\ntype Octet = byte\n\nfunc main() {\n\tvar c Celsius\n\tvar o Octet\n\tfmt.Printf(\"%T %T\\n\", c, o)\n}\n"
      output: main.Celsius uint8
  - key: code-melange
    format: code-output
    question: |-
      ```go
      type Celsius float64
      type Fahrenheit float64

      var c Celsius = 10
      var f Fahrenheit = c
      fmt.Println(f)
      ```
    answer: 'Rien : le code ne compile pas, `Celsius` et `Fahrenheit` sont deux types distincts.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\ntype Fahrenheit float64\n\nfunc main() {\n\tvar c Celsius = 10\n\tvar f Fahrenheit = c\n\tfmt.Println(f)\n}\n"
      compiles: false
  - key: bug-ids
    format: bug-fix
    question: |-
      Un bug a supprimé un client au lieu d'une commande :
      ```go
      func SupprimerClient(id int64) error   { ... }
      func SupprimerCommande(id int64) error { ... }

      SupprimerClient(commande.ID)
      ```
    answer: |-
      ```go
      type IDClient int64
      type IDCommande int64

      func SupprimerClient(id IDClient) error     { ... }
      func SupprimerCommande(id IDCommande) error { ... }
      ```
      Avec des types nommés, passer un `IDCommande` à `SupprimerClient` ne compile plus.
  - key: bug-methodes
    format: bug-fix
    question: |-
      Le compilateur signale « d.Hours undefined » :
      ```go
      type Duree time.Duration

      var d Duree = Duree(90 * time.Minute)
      fmt.Println(d.Hours())
      ```
    answer: |-
      ```go
      fmt.Println(time.Duration(d).Hours())
      // ou bien : type Duree = time.Duration (un alias garde les méthodes)
      ```
      Un type défini ne reprend pas les méthodes de son type sous-jacent.
  - key: bug-math
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use temp (variable of type Celsius) as float64 value » :
      ```go
      arrondi := math.Round(temp)
      ```
    answer: |-
      ```go
      arrondi := Celsius(math.Round(float64(temp)))
      ```
      On convertit vers `float64` pour la fonction, puis on revient au type nommé.
  - key: bug-deplacement
    format: bug-fix
    question: Tu déplaces le type `Commande` du package `legacy` vers `commandes`, mais cinquante appelants utilisent `legacy.Commande`. Comment éviter de tout casser d'un coup ?
    answer: |-
      ```go
      // package legacy
      // Deprecated: utilisez commandes.Commande.
      type Commande = commandes.Commande
      ```
      L'alias garde l'ancien nom valide (c'est le même type) ; les appelants migrent ensuite à leur rythme, et l'on
      retire l'alias à la fin. `go fix` peut même faire la réécriture avec `//go:fix inline`.
