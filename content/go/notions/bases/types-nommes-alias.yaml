notion: types-nommes-alias
lesson: |-
  Deux déclarations se ressemblent mais n'ont rien à voir :

  ```go
  type Celsius float64 // un NOUVEAU type, de type sous-jacent float64
  type Octet = byte    // un ALIAS : un autre nom pour le même type
  ```

  Un **type nommé** (ou type défini) :
  - est **distinct** de son type sous-jacent : un `Celsius` ne s'affecte pas à un `float64` sans conversion
    (`float64(c)`), ni à un `Fahrenheit` ;
  - peut porter ses **propres méthodes** (`func (c Celsius) String() string`) ;
  - garde les opérations du type sous-jacent (`c + 1`, `c * 2`).

  Un **alias** (`=`) est exactement le même type : mêmes méthodes, affectation libre. Il sert surtout à **déplacer** un
  type d'un package à un autre sans casser les utilisateurs, et pour `byte`/`rune`. Les alias génériques sont permis
  depuis Go 1.24 (`type Ensemble[T comparable] = map[T]struct{}`).

  Les types nommés rendent le code plus sûr : `type IDClient int64` et `type IDCommande int64` ne se mélangent plus par
  erreur.

  **Piège classique** : croire que `type MonTemps time.Time` garde les méthodes de `time.Time`. Un type défini ne reprend
  **pas** les méthodes de son type sous-jacent (il faudrait l'embarquer dans une struct, ou un alias).

  **En entretien** : « `type T U` crée un nouveau type, qui a ses méthodes et demande une conversion ; `type T = U` est un
  alias, le même type sous un autre nom, utile pour les refactorings. »
cards:
  - key: type-nomme-vs-alias
    format: course
    question: "Quelle différence entre `type A B` et `type A = B` ?"
    choices:
      - {text: "`type A B` crée un type distinct ; `type A = B` est le même type sous un autre nom", correct: true}
      - {text: "`type A B` est un alias ; `type A = B` crée un nouveau type distinct", correct: false}
      - {text: "Aucune : le `=` est facultatif dans une déclaration de type", correct: false}
      - {text: "`type A = B` copie les méthodes de `B`, `type A B` les partage", correct: false}
    answer: "`type A B` crée un nouveau type défini, distinct de `B` et sans ses méthodes ; `type A = B` est le même type sous un autre nom."
  - key: qcm-alias-generique
    format: multiple-choice
    question: Depuis quelle version peut-on déclarer un alias générique comme `type Ensemble[T comparable] = map[T]struct{}` ?
    choices:
      - text: Go 1.24
        correct: true
      - text: Go 1.18, avec les generics
        correct: false
      - text: Go 1.0
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: Les alias génériques sont arrivés en Go 1.24, après une préversion en 1.23.
  - key: code-ids
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type IDClient int64

      id := IDClient(7)
      fmt.Println(id+1, int64(id)*2)
      ```
    choices:
      - {text: "`8 14`", correct: true}
      - {text: "`7 14`", correct: false}
      - {text: "`IDClient(8) 14`", correct: false}
      - {text: "Ça ne compile pas : `id+1` mélange `IDClient` et `int`", correct: false}
    answer: "`8 14` : un type nommé garde l'arithmétique de son type sous-jacent, et la constante 1 s'adapte au type `IDClient`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype IDClient int64\n\nfunc main() {\n\tid := IDClient(7)\n\tfmt.Println(id+1, int64(id)*2)\n}\n"
      output: 8 14
  - key: methodes-perdues
    format: course
    question: '`type MonTemps time.Time` reprend-il les méthodes de `time.Time` ?'
    choices:
      - {text: "Non : un type défini ne reprend pas les méthodes de son type sous-jacent", correct: true}
      - {text: "Oui : il reprend toutes les méthodes, comme une sous-classe", correct: false}
      - {text: "Oui, mais seulement les méthodes à receveur valeur", correct: false}
      - {text: "Non, sauf `String()`, que `fmt` retrouve toujours", correct: false}
    answer: "Non : un type défini ne reprend pas les méthodes de son type sous-jacent ; un alias ou l'embarquement dans une struct les garderait."
  - key: usage-alias
    format: course
    question: À quoi servent les alias de type en pratique ?
    choices:
      - {text: "À déplacer un type entre packages sans casser ses utilisateurs", correct: true}
      - {text: "À créer un type distinct, que le compilateur refuse de mélanger", correct: false}
      - {text: "À ajouter des méthodes à un type d'un autre package", correct: false}
      - {text: "À accélérer la compilation, en raccourcissant les noms", correct: false}
    answer: "À déplacer un type entre packages sans casser les utilisateurs (l'ancien nom devient un alias du nouveau), et à donner un nom plus court ; `byte` et `rune` en sont. Un type distinct, c'est un type défini, sans `=`."
  - key: securite-ids
    format: course
    question: Pourquoi déclarer `type IDClient int64` plutôt qu'utiliser `int64` ?
    choices:
      - {text: "Pour que le compilateur refuse un identifiant de commande à la place d'un client", correct: true}
      - {text: "Pour économiser de la mémoire par rapport à un simple `int64`", correct: false}
      - {text: "Pour que l'identifiant ne puisse jamais devenir négatif", correct: false}
      - {text: "Pour que l'identifiant soit généré automatiquement à la création", correct: false}
    answer: "Pour que le compilateur refuse de passer un identifiant de commande là où on attend un identifiant de client, et pour pouvoir ajouter des méthodes. La représentation, elle, reste un `int64`."
  - key: vf-affectation
    format: true-false
    question: Avec `type Celsius float64`, une valeur `Celsius` s'affecte à une variable `float64` sans conversion.
    truth: false
    answer: Ce sont deux types distincts ; il faut `float64(c)`.
  - key: vf-alias-meme
    format: true-false
    question: Avec `type Octet = byte`, `Octet` et `byte` sont le même type.
    truth: true
    answer: Un alias n'est qu'un autre nom.
  - key: vf-operations
    format: true-false
    question: Un type `Celsius` défini sur `float64` garde l'addition et la multiplication.
    truth: true
    answer: Les opérations du type sous-jacent restent permises entre valeurs du même type.
  - key: vf-methode-alias
    format: true-false
    question: On peut déclarer une méthode sur un alias d'un type d'un autre package.
    truth: false
    answer: Une méthode se déclare dans le package du type ; un alias de `time.Time` reste `time.Time`.
  - key: qcm-compile
    format: multiple-choice
    question: "Avec `type Celsius float64` et `var c Celsius = 20`, laquelle de ces lignes ne compile pas ?"
    choices:
      - {text: "`math.Sqrt(c)`", correct: true}
      - {text: "`c + 5`", correct: false}
      - {text: "`float64(c) * 1.8`", correct: false}
      - {text: "`c * 2`", correct: false}
    answer: "`math.Sqrt` attend un `float64`, et Go ne convertit pas un `Celsius` implicitement : il faut `math.Sqrt(float64(c))`. Une constante non typée comme 5 s'adapte au `Celsius`."
  - key: qcm-alias-defini
    format: multiple-choice
    question: "Lesquels de ces types sont des alias ?"
    choices:
      - text: '`type Octet = byte`'
        correct: true
      - text: '`byte` lui-même, alias de `uint8`'
        correct: true
      - text: '`type Celsius float64`'
        correct: false
      - text: '`type Statut int`'
        correct: false
    answer: Le signe `=` distingue l'alias du type défini.
  - key: qcm-methodes
    format: multiple-choice
    question: "Sur lequel de ces types peut-on déclarer une méthode dans son propre package ?"
    choices:
      - {text: "`type Celsius float64`, déclaré dans ce package", correct: true}
      - {text: "`float64`, directement", correct: false}
      - {text: "`time.Duration`, du package `time`", correct: false}
      - {text: "`[]string`, une slice sans nom", correct: false}
    answer: "Une méthode se déclare sur un type défini dans le même package, comme `Celsius` ou une struct `Panier`. Ni un type prédéclaré, ni le type d'un autre package, ni un type sans nom."
  - key: trous-defini
    format: fill-in
    question: |-
      Complète pour créer un nouveau type distinct de `int64` :
      ```go
      type IDClient ___
      ```
    blanks:
      - - int64
    answer: Sans `=`, c'est un nouveau type.
  - key: trous-alias
    format: fill-in
    question: |-
      Complète pour faire de `AncienNom` un alias de `nouveau.Type` :
      ```go
      type AncienNom ___ nouveau.Type
      ```
    blanks:
      - - '='
    answer: Le signe `=` fait un alias.
  - key: trous-conversion
    format: fill-in
    question: |-
      Complète pour passer un `Celsius` à une fonction qui attend un `float64` :
      ```go
      math.Round(___(c))
      ```
    blanks:
      - - float64
    answer: La conversion explicite vers le type sous-jacent.
  - key: trous-methode
    format: fill-in
    question: |-
      Complète la méthode du type nommé :
      ```go
      func (c ___) Fahrenheit() float64 { return float64(c)*1.8 + 32 }
      ```
    blanks:
      - - Celsius
    answer: Le receveur est le type défini.
  - key: code-methode
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Celsius float64

      func (c Celsius) String() string { return fmt.Sprintf("%.1f°C", float64(c)) }

      var c Celsius = 21.5
      fmt.Println(c, c+1)
      ```
    choices:
      - {text: "`21.5°C 22.5°C`", correct: true}
      - {text: "`21.5 22.5`", correct: false}
      - {text: "`21.5°C 22.5`", correct: false}
      - {text: "Ça ne compile pas : `c+1` mélange `Celsius` et `int`", correct: false}
    answer: "`21.5°C 22.5°C` : `fmt` utilise la méthode `String` du type nommé, et `c+1` reste un `Celsius`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.1f°C\", float64(c)) }\n\nfunc main() {\n\tvar c Celsius = 21.5\n\tfmt.Println(c, c+1)\n}\n"
      output: 21.5°C 22.5°C
  - key: code-type
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Celsius float64
      type Octet = byte

      var c Celsius
      var o Octet
      fmt.Printf("%T %T\n", c, o)
      ```
    choices:
      - {text: "`main.Celsius uint8`", correct: true}
      - {text: "`main.Celsius main.Octet`", correct: false}
      - {text: "`float64 uint8`", correct: false}
      - {text: "`float64 main.Octet`", correct: false}
    answer: "`main.Celsius uint8` : le type défini a son propre nom, l'alias est le type `uint8` lui-même (via `byte`)."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\ntype Octet = byte\n\nfunc main() {\n\tvar c Celsius\n\tvar o Octet\n\tfmt.Printf(\"%T %T\\n\", c, o)\n}\n"
      output: main.Celsius uint8
  - key: code-melange
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Celsius float64
      type Fahrenheit float64

      var c Celsius = 10
      var f Fahrenheit = c
      fmt.Println(f)
      ```
    choices:
      - {text: "Ça ne compile pas : `Celsius` et `Fahrenheit` sont deux types distincts", correct: true}
      - {text: "`10` : les deux types ont le même type sous-jacent", correct: false}
      - {text: "`50` : Go convertit les degrés à l'affectation", correct: false}
      - {text: "`0`", correct: false}
    answer: "Rien : le code ne compile pas, `Celsius` et `Fahrenheit` sont deux types distincts, même avec le même type sous-jacent. Il faudrait `Fahrenheit(c)`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\ntype Fahrenheit float64\n\nfunc main() {\n\tvar c Celsius = 10\n\tvar f Fahrenheit = c\n\tfmt.Println(f)\n}\n"
      compiles: false
  - key: bug-ids
    format: bug-fix
    question: |-
      Un bug a supprimé un client au lieu d'une commande. Quelle correction empêche cette erreur dès la compilation ?
      ```go
      func SupprimerClient(id int64) error   { ... }
      func SupprimerCommande(id int64) error { ... }

      SupprimerClient(commande.ID)
      ```
    choices:
      - {text: "Des types nommés `IDClient` et `IDCommande` dans les signatures", correct: true}
      - {text: "Des alias `type IDClient = int64` et `type IDCommande = int64`", correct: false}
      - {text: "Un commentaire sur chaque fonction, qui précise l'identifiant", correct: false}
      - {text: "Des identifiants `uint64`, qui ne peuvent pas être négatifs", correct: false}
    answer: |-
      ```go
      type IDClient int64
      type IDCommande int64

      func SupprimerClient(id IDClient) error     { ... }
      func SupprimerCommande(id IDCommande) error { ... }
      ```
      Avec des types nommés, passer un `IDCommande` à `SupprimerClient` ne compile plus. Des alias resteraient le même type `int64`, sans protection.
  - key: bug-methodes
    format: bug-fix
    question: |-
      Le compilateur signale « d.Hours undefined ». Quelle correction est la bonne ?
      ```go
      type Duree time.Duration

      var d Duree = Duree(90 * time.Minute)
      fmt.Println(d.Hours())
      ```
    choices:
      - {text: "Convertir avant l'appel, `time.Duration(d).Hours()`, ou faire de `Duree` un alias", correct: true}
      - {text: "Appeler `d.Duration.Hours()`, la méthode du type sous-jacent", correct: false}
      - {text: "Appeler `Hours(d)`, la forme fonction de la méthode", correct: false}
      - {text: "Importer `time` une seconde fois dans le fichier de `Duree`", correct: false}
    answer: |-
      ```go
      fmt.Println(time.Duration(d).Hours())
      // ou bien : type Duree = time.Duration (un alias garde les méthodes)
      ```
      Un type défini ne reprend pas les méthodes de son type sous-jacent : on convertit, ou l'on déclare un alias, qui est le même type.
  - key: bug-math
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use temp (variable of type Celsius) as float64 value ». Quelle correction est la bonne ?
      ```go
      arrondi := math.Round(temp)
      ```
    choices:
      - {text: "`Celsius(math.Round(float64(temp)))` : convertir à l'aller et au retour", correct: true}
      - {text: "`math.Round(temp.(float64))` : une assertion de type vers `float64`", correct: false}
      - {text: "`math.Round(temp * 1.0)` : multiplier par un flottant pour convertir", correct: false}
      - {text: "`temp.Round()` : la méthode que `Celsius` reprend de `float64`", correct: false}
    answer: |-
      ```go
      arrondi := Celsius(math.Round(float64(temp)))
      ```
      On convertit vers `float64` pour la fonction, puis on revient au type nommé. Une assertion de type ne vaut que pour une interface, et `temp * 1.0` reste un `Celsius`.
  - key: bug-deplacement
    format: bug-fix
    question: Tu déplaces le type `Commande` du package `legacy` vers `commandes`, mais cinquante appelants utilisent `legacy.Commande`. Comment éviter de tout casser d'un coup ?
    choices:
      - {text: "Un alias dans `legacy`, `type Commande = commandes.Commande`, marqué `Deprecated`", correct: true}
      - {text: "Un type défini dans `legacy`, `type Commande commandes.Commande`", correct: false}
      - {text: "Copier le type dans les deux packages, et les garder synchronisés à la main", correct: false}
      - {text: "Modifier les cinquante appelants dans un seul commit, sans transition", correct: false}
    answer: |-
      ```go
      // package legacy
      // Deprecated: utilise commandes.Commande.
      type Commande = commandes.Commande
      ```
      L'alias garde l'ancien nom valide (c'est le même type) ; les appelants migrent ensuite à leur rythme, et l'on retire l'alias à la fin. Un type défini serait un autre type, sans les méthodes.
