notion: valeur-zero
lesson: |-
  Toute variable a une valeur dès sa déclaration : sa **valeur zéro**. Il n'y a pas de variable « non initialisée ».

  | Type | Valeur zéro |
  |---|---|
  | nombres | `0` |
  | `bool` | `false` |
  | `string` | `""` |
  | pointeurs, slices, maps, channels, fonctions, interfaces | `nil` |
  | struct | chaque champ à sa valeur zéro |
  | tableau | chaque élément à sa valeur zéro |

  Principe de conception central : **rendre la valeur zéro utile**. Un type bien conçu fonctionne sans constructeur :
  - `var mu sync.Mutex` est un verrou déverrouillé, prêt à servir ;
  - `var b bytes.Buffer` ou `var sb strings.Builder` sont des tampons vides utilisables ;
  - un slice `nil` accepte `append`, `len` et `range` ;
  - une struct de configuration dont les champs à zéro signifient « valeur par défaut ».

  Les exceptions à connaître : une **map nil** se lit mais **panique à l'écriture**, et un **pointeur nil** panique quand
  on le déréférence. Ces types demandent `make` ou une initialisation.

  **Piège classique** : distinguer « absent » et « zéro ». Avec un champ `int`, on ne sait pas si `0` a été donné ou
  oublié ; il faut un pointeur (`*int`) ou un booléen à côté quand la différence compte.

  **En entretien** : « Toute variable a sa valeur zéro ; on conçoit les types pour que cette valeur soit utilisable,
  comme `sync.Mutex` et `bytes.Buffer` ; attention à la map nil et au pointeur nil. »
cards:
  - key: valeur-zero
    format: course
    question: C'est quoi la valeur zéro ?
    answer: 'La valeur qu''a toute variable non initialisée : 0, false, "", nil, ou une struct de valeurs zéro.'
  - key: rendre-valeur-zero-utile
    format: course
    question: Pourquoi "rendre la valeur zéro utile" ?
    answer: Pour qu'un type soit utilisable sans constructeur (sync.Mutex, bytes.Buffer), ce qui simplifie l'API.
  - key: valeur-zero-variable-type-string
    format: multiple-choice
    question: Quelle est la valeur zéro d'une variable de type `string` ?
    choices:
      - text: '`nil`'
        correct: false
      - text: '`""` (la chaîne vide)'
        correct: true
      - text: '`" "` (un espace)'
        correct: false
      - text: 'Il n''y en a pas : la variable doit être initialisée'
        correct: false
    answer: 'En Go, toute variable déclarée sans valeur reçoit la valeur zéro de son type : `""` pour une chaîne, `0` pour un nombre, `false` pour un booléen. `nil` n''est pas une valeur possible pour un `string`.'
  - key: signifie-make-the-zero-value-useful
    format: course
    question: Que signifie "make the zero value useful" ?
    answer: Concevoir les types pour qu'ils soient utilisables sans initialisation explicite.
  - key: terme-valeur-zero
    format: course
    question: Que désigne « valeur zéro » ?
    answer: Valeur par défaut de toute variable non initialisée
  - key: scenario-nil-slice-json
    format: scenario
    question: Une API renvoie `null` au lieu de `[]` quand une liste est vide, et le front plante. Pourquoi, et que fais-tu ?
    answer: |-
      La liste vaut sa valeur zéro, un slice nil, que `encoding/json` encode en `null`. J'initialise le slice vide
      (`resultats := []Produit{}` ou `make([]Produit, 0)`) avant l'encodage, ou je normalise dans le DTO de réponse.
      Depuis `encoding/json/v2`, une option permet aussi d'encoder les slices nil en `[]`. Je documente le contrat de
      l'API : une liste est toujours un tableau.
  - key: struct-zero
    format: course
    question: Quelle est la valeur zéro d'une struct ?
    answer: La struct dont chaque champ a sa propre valeur zéro (récursivement).
  - key: vf-non-initialisee
    format: true-false
    question: En Go, lire une variable déclarée sans valeur donne un résultat imprévisible, comme en C.
    truth: false
    answer: Toute variable vaut la valeur zéro de son type dès sa déclaration.
  - key: vf-mutex
    format: true-false
    question: '`var mu sync.Mutex` est utilisable sans initialisation.'
    truth: true
    answer: La valeur zéro d'un `sync.Mutex` est un verrou déverrouillé.
  - key: vf-map-nil
    format: true-false
    question: On peut écrire dans une map déclarée par `var m map[string]int`.
    truth: false
    answer: Une map nil se lit (elle renvoie la valeur zéro) mais une écriture panique ; il faut `make`.
  - key: vf-slice-nil
    format: true-false
    question: On peut appeler `append` sur un slice nil.
    truth: true
    answer: '`append` alloue le tableau au besoin ; `len` et `range` fonctionnent aussi.'
  - key: qcm-zeros
    format: multiple-choice
    question: Quelles valeurs zéro sont correctes ?
    choices:
      - text: '`bool` : `false`'
        correct: true
      - text: '`[]int` : `nil`'
        correct: true
      - text: '`string` : `nil`'
        correct: false
      - text: '`*int` : `0`'
        correct: false
    answer: Une chaîne vaut `""` et ne peut pas être nil ; un pointeur vaut `nil`.
  - key: qcm-utiles
    format: multiple-choice
    question: Quels types sont utilisables directement à leur valeur zéro ?
    choices:
      - text: '`bytes.Buffer`'
        correct: true
      - text: '`sync.WaitGroup`'
        correct: true
      - text: '`map[string]int` pour y écrire'
        correct: false
      - text: '`*Client` pour appeler une méthode qui lit un champ'
        correct: false
    answer: La map et le pointeur nil demandent une initialisation avant usage.
  - key: qcm-absent
    format: multiple-choice
    question: Comment distinguer « âge non fourni » et « âge 0 » dans une struct décodée depuis du JSON ?
    choices:
      - text: Un champ `Age *int`, nil quand la clé est absente
        correct: true
      - text: Un champ `Age int` et tester `Age == 0`
        correct: false
      - text: Un champ `Age int` avec `omitempty`
        correct: false
      - text: Ce n'est pas possible en Go
        correct: false
    answer: '`omitempty` agit à l''encodage, pas au décodage ; le pointeur garde la différence.'
  - key: trous-buffer
    format: fill-in
    question: |-
      Complétez pour obtenir un `strings.Builder` vide et utilisable :
      ```go
      ___ sb strings.Builder
      sb.WriteString("ok")
      ```
    blanks:
      - - var
    answer: Sa valeur zéro est un tampon vide prêt à servir.
  - key: trous-map
    format: fill-in
    question: |-
      Complétez pour pouvoir écrire dans la map :
      ```go
      m := ___(map[string]int)
      m["a"] = 1
      ```
    blanks:
      - - make
    answer: '`make` crée une map vide non nil (ou le littéral `map[string]int{}`).'
  - key: trous-zero-string
    format: fill-in
    question: "Complétez le test d'une chaîne qui vaut sa valeur zéro :\n```go\nif nom == ___ {\n\tnom = \"anonyme\"\n}\n```"
    blanks:
      - - '""'
    answer: La valeur zéro d'une chaîne est la chaîne vide.
  - key: trous-pointeur
    format: fill-in
    question: "Complétez le test d'un pointeur qui vaut sa valeur zéro :\n```go\nif client == ___ {\n\treturn errors.New(\"client absent\")\n}\n```"
    blanks:
      - - nil
    answer: Pointeurs, slices, maps, channels, fonctions et interfaces valent nil par défaut.
  - key: code-zeros
    format: code-output
    question: |-
      ```go
      var i int
      var s string
      var b bool
      var p *int
      fmt.Printf("%d %q %t %v\n", i, s, b, p)
      ```
    answer: '`0 "" false <nil>` : chaque type a sa valeur zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar i int\n\tvar s string\n\tvar b bool\n\tvar p *int\n\tfmt.Printf(\"%d %q %t %v\\n\", i, s, b, p)\n}\n"
      output: 0 "" false <nil>
  - key: code-struct
    format: code-output
    question: "```go\ntype Config struct {\n\tHote  string\n\tPort  int\n\tDebug bool\n}\n\nvar c Config\nfmt.Printf(\"%+v\\n\", c)\n```"
    answer: '`{Hote: Port:0 Debug:false}` : chaque champ vaut sa valeur zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct {\n\tHote  string\n\tPort  int\n\tDebug bool\n}\n\nfunc main() {\n\tvar c Config\n\tfmt.Printf(\"%+v\\n\", c)\n}\n"
      output: '{Hote: Port:0 Debug:false}'
  - key: code-builder
    format: code-output
    question: |-
      ```go
      var sb strings.Builder
      sb.WriteString("Go")
      sb.WriteString("!")
      fmt.Println(sb.String(), sb.Len())
      ```
    answer: '`Go! 3` : le `strings.Builder` à sa valeur zéro est utilisable.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar sb strings.Builder\n\tsb.WriteString(\"Go\")\n\tsb.WriteString(\"!\")\n\tfmt.Println(sb.String(), sb.Len())\n}\n"
      output: Go! 3
  - key: code-map-nil
    format: code-output
    question: |-
      ```go
      var m map[string]int
      fmt.Println(m["absent"], m == nil)
      ```
    answer: '`0 true` : lire une map nil renvoie la valeur zéro, sans panique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"absent\"], m == nil)\n}\n"
      output: 0 true
  - key: bug-map
    format: bug-fix
    question: "Ce code panique avec « assignment to entry in nil map » :\n```go\ntype Index struct {\n\tpages map[string][]int\n}\n\nfunc (i *Index) Ajouter(mot string, page int) {\n\ti.pages[mot] = append(i.pages[mot], page)\n}\n```"
    answer: "```go\nfunc (i *Index) Ajouter(mot string, page int) {\n\tif i.pages == nil {\n\t\ti.pages = make(map[string][]int)\n\t}\n\ti.pages[mot] = append(i.pages[mot], page)\n}\n```\nCréer la map au premier usage garde la valeur zéro de `Index` utilisable, sans constructeur obligatoire."
  - key: bug-pointeur
    format: bug-fix
    question: |-
      Ce code panique avec « invalid memory address or nil pointer dereference » :
      ```go
      var cfg *Config
      cfg.Port = 8080
      ```
    answer: |-
      ```go
      cfg := &Config{}
      cfg.Port = 8080
      // ou, sans pointeur :
      var cfg Config
      cfg.Port = 8080
      ```
      La valeur zéro d'un pointeur est nil : il faut une struct à pointer.
  - key: bug-absent-zero
    format: bug-fix
    question: "Un client qui envoie `\"remise\": 0` voit sa remise remplacée par la remise par défaut :\n```go\ntype Commande struct {\n\tRemise int `json:\"remise\"`\n}\n\nif c.Remise == 0 {\n\tc.Remise = remiseParDefaut\n}\n```"
    answer: "```go\ntype Commande struct {\n\tRemise *int `json:\"remise\"`\n}\n\nif c.Remise == nil {\n\tc.Remise = &remiseParDefaut\n}\n```\nAvec un `int`, « absent » et « 0 » se confondent ; le pointeur reste nil quand la clé est absente."
  - key: bug-constructeur-oublie
    format: bug-fix
    question: "Ce compteur panique si on l'utilise sans passer par `NouveauCompteur` :\n```go\ntype Compteur struct {\n\tvaleurs map[string]int\n}\n\nfunc (c *Compteur) Incrementer(cle string) { c.valeurs[cle]++ }\n```"
    answer: "```go\nfunc (c *Compteur) Incrementer(cle string) {\n\tif c.valeurs == nil {\n\t\tc.valeurs = map[string]int{}\n\t}\n\tc.valeurs[cle]++\n}\n```\nUne initialisation paresseuse rend la valeur zéro utile : `var c Compteur` suffit."
  - key: scenario-api-zero
    format: scenario
    question: Tu conçois un type `Limiteur` pour une bibliothèque. Comment rendre sa valeur zéro utile ?
    answer: |-
      Je choisis des champs dont le zéro a un sens (0 voulant dire « pas de limite », par exemple), j'initialise
      paresseusement ce qui doit l'être (une map au premier appel), et j'utilise des types eux-mêmes utilisables à zéro
      (`sync.Mutex`). Je documente le comportement de `var l Limiteur`. Une fonction `NewLimiteur(options)` reste utile
      pour une configuration, mais elle n'est pas obligatoire : on évite ainsi les paniques d'un type mal construit.
  - key: scenario-config-defaut
    format: scenario
    question: Comment appliquer des valeurs par défaut à une configuration lue en JSON, sans confondre zéro et absence ?
    answer: |-
      Si zéro n'est jamais une valeur valide (un port, un délai), je remplace le zéro par la valeur par défaut après le
      décodage. Si zéro est valide, j'utilise un pointeur (`*int`) pour savoir si la clé était présente, ou je pré-remplis
      la struct avec les valeurs par défaut avant `json.Unmarshal`, qui n'écrase que les clés présentes. C'est la
      technique la plus simple et la plus lisible.
  - key: scenario-revue-nil
    format: scenario
    question: En revue, un collègue ajoute partout des constructeurs `NewX` pour éviter les paniques de valeurs nil. Ton avis ?
    answer: |-
      Un constructeur est utile quand le type a des invariants ou des dépendances obligatoires. Mais pour un simple
      conteneur, mieux vaut rendre la valeur zéro utilisable (initialisation paresseuse, champs dont zéro a un sens) :
      un utilisateur qui écrit `var x X` ou embarque le type dans une struct ne tombera pas sur une panique. C'est l'idiome
      de la bibliothèque standard (`sync.Mutex`, `bytes.Buffer`, `http.Client`).
