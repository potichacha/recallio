notion: valeur-zero
lesson: |-
  Toute variable a une valeur dès sa déclaration : sa **valeur zéro**. Il n'y a pas de variable « non initialisée ».

  | Type | Valeur zéro |
  |---|---|
  | nombres | `0` |
  | `bool` | `false` |
  | `string` | `""` |
  | pointeurs, slices, maps, channels, fonctions, interfaces | `nil` |
  | struct | chaque champ à sa valeur zéro |
  | tableau | chaque élément à sa valeur zéro |

  Principe de conception central : **rendre la valeur zéro utile**. Un type bien conçu fonctionne sans constructeur :
  - `var mu sync.Mutex` est un verrou déverrouillé, prêt à servir ;
  - `var b bytes.Buffer` ou `var sb strings.Builder` sont des tampons vides utilisables ;
  - un slice `nil` accepte `append`, `len` et `range` ;
  - une struct de configuration dont les champs à zéro signifient « valeur par défaut ».

  Les exceptions à connaître : une **map nil** se lit mais **panique à l'écriture**, et un **pointeur nil** panique quand
  on le déréférence. Ces types demandent `make` ou une initialisation.

  **Piège classique** : distinguer « absent » et « zéro ». Avec un champ `int`, on ne sait pas si `0` a été donné ou
  oublié ; il faut un pointeur (`*int`) ou un booléen à côté quand la différence compte.

  **En entretien** : « Toute variable a sa valeur zéro ; on conçoit les types pour que cette valeur soit utilisable,
  comme `sync.Mutex` et `bytes.Buffer` ; attention à la map nil et au pointeur nil. »
tour:
  - title: La valeur zéro
    text: |-
      Une variable déclarée sans valeur n'est jamais « indéfinie » : elle vaut la **valeur zéro** de son type. `0` pour
      les nombres, `false` pour un booléen, `""` pour une chaîne, et `nil` pour un pointeur, une slice, une map, un
      channel, une fonction ou une interface.

      La valeur zéro d'une struct est une struct dont chaque champ vaut sa propre valeur zéro. Go encourage les types
      dont la valeur zéro est **utilisable** telle quelle : un `strings.Builder` déclaré sans valeur est prêt à servir.

      `%q` affiche une chaîne entre guillemets, ce qui rend la chaîne vide visible, et `%+v` affiche les champs d'une
      struct avec leur nom.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          type Compteur struct {
          	nom   string
          	total int
          }

          func main() {
          	var n int
          	var f float64
          	var ok bool
          	var s string
          	var c Compteur
          	fmt.Println(n, f, ok)
          	fmt.Printf("%q\n", s)
          	fmt.Printf("%+v\n", c)

          	var b strings.Builder
          	b.WriteString("prêt à servir")
          	fmt.Println(b.String())
          }
      output: |-
        0 0 false
        ""
        {nom: total:0}
        prêt à servir
cards:
  - key: valeur-zero
    format: course
    question: "Qu'est-ce que la valeur zéro en Go ?"
    choices:
      - {text: "La valeur de toute variable non initialisée : 0, false, \"\", nil, ou une struct de zéros", correct: true}
      - {text: "Une valeur indéfinie, qu'il faut affecter avant de pouvoir lire la variable", correct: false}
      - {text: "La valeur `nil`, que prend toute variable déclarée sans valeur", correct: false}
      - {text: "Le nombre 0, que seuls les types numériques peuvent prendre", correct: false}
    answer: "La valeur qu'a toute variable non initialisée : 0, false, \"\", nil, ou une struct de valeurs zéro. Go n'a jamais de valeur indéfinie, et une chaîne ne vaut jamais nil."
  - key: rendre-valeur-zero-utile
    format: course
    question: "Pourquoi chercher à « rendre la valeur zéro utile » ?"
    choices:
      - {text: "Pour qu'un type serve sans constructeur, comme `sync.Mutex` ou `bytes.Buffer`", correct: true}
      - {text: "Pour que le compilateur retire les variables qui ne sont jamais affectées", correct: false}
      - {text: "Pour économiser la mémoire occupée par les variables qui valent zéro", correct: false}
      - {text: "Pour que les valeurs zéro s'affichent autrement que `0` ou `<nil>`", correct: false}
    answer: "Pour qu'un type soit utilisable sans constructeur (`sync.Mutex`, `bytes.Buffer`), ce qui simplifie l'API et évite les paniques d'un type mal construit."
  - key: valeur-zero-variable-type-string
    format: multiple-choice
    question: Quelle est la valeur zéro d'une variable de type `string` ?
    choices:
      - text: '`nil`'
        correct: false
      - text: '`""` (la chaîne vide)'
        correct: true
      - text: '`" "` (un espace)'
        correct: false
      - text: 'Il n''y en a pas : la variable doit être initialisée'
        correct: false
    answer: 'En Go, toute variable déclarée sans valeur reçoit la valeur zéro de son type : `""` pour une chaîne, `0` pour un nombre, `false` pour un booléen. `nil` n''est pas une valeur possible pour un `string`.'
  - key: signifie-make-the-zero-value-useful
    format: course
    question: "Que signifie le proverbe « make the zero value useful » ?"
    choices:
      - {text: "Concevoir les types pour qu'ils servent sans initialisation explicite", correct: true}
      - {text: "Toujours initialiser les variables avec `make`, jamais avec `var`", correct: false}
      - {text: "Éviter les valeurs zéro en donnant un constructeur à chaque type", correct: false}
      - {text: "Remplacer les zéros par des constantes nommées, plus lisibles", correct: false}
    answer: "Concevoir les types pour qu'ils soient utilisables sans initialisation explicite : `var mu sync.Mutex` est prêt à servir. Le proverbe ne parle pas de la fonction `make`."
  - key: terme-valeur-zero
    format: course
    question: Que désigne « valeur zéro » ?
    choices:
      - {text: "La valeur par défaut de toute variable non initialisée", correct: true}
      - {text: "La valeur `0`, réservée aux types numériques", correct: false}
      - {text: "Une valeur invalide, à tester avant chaque usage", correct: false}
      - {text: "La première constante d'un bloc numéroté par `iota`", correct: false}
    answer: "La valeur par défaut de toute variable non initialisée, propre à chaque type : 0, false, \"\", nil, ou une struct de valeurs zéro."
  - key: scenario-nil-slice-json
    format: scenario
    question: Une API renvoie `null` au lieu de `[]` quand une liste est vide, et le front plante. Pourquoi, et que fais-tu ?
    choices:
      - {text: "Une slice nil s'encode en `null` : j'initialise une slice vide avant l'encodage", correct: true}
      - {text: "C'est un bug d'`encoding/json` : je passe à une autre bibliothèque JSON", correct: false}
      - {text: "Le front doit accepter `null` : rien à changer côté Go, c'est son problème", correct: false}
      - {text: "J'ajoute `omitempty` au champ, qui encode alors la slice vide en `[]`", correct: false}
    answer: "La liste vaut sa valeur zéro, une slice nil, que `encoding/json` encode en `null`. J'initialise la slice vide (`resultats := []Produit{}` ou `make([]Produit, 0)`) avant l'encodage, ou je normalise dans le DTO de réponse, et je documente le contrat : une liste est toujours un tableau. `omitempty` retirerait le champ, ce qui ne vaut pas mieux."
  - key: struct-zero
    format: course
    question: Quelle est la valeur zéro d'une struct ?
    choices:
      - {text: "La struct dont chaque champ vaut sa propre valeur zéro", correct: true}
      - {text: "`nil`, tant qu'aucun champ n'a été affecté", correct: false}
      - {text: "Une struct vide, `struct{}`, sans aucun champ", correct: false}
      - {text: "Une struct aux champs indéfinis, à initialiser", correct: false}
    answer: "La struct dont chaque champ a sa propre valeur zéro (récursivement). Une struct n'est jamais nil ; seul un pointeur vers elle peut l'être."
  - key: vf-non-initialisee
    format: true-false
    question: En Go, lire une variable déclarée sans valeur donne un résultat imprévisible, comme en C.
    truth: false
    answer: Toute variable vaut la valeur zéro de son type dès sa déclaration.
  - key: vf-mutex
    format: true-false
    question: '`var mu sync.Mutex` est utilisable sans initialisation.'
    truth: true
    answer: La valeur zéro d'un `sync.Mutex` est un verrou déverrouillé.
  - key: vf-map-nil
    format: true-false
    question: On peut écrire dans une map déclarée par `var m map[string]int`.
    truth: false
    answer: Une map nil se lit (elle renvoie la valeur zéro) mais une écriture panique ; il faut `make`.
  - key: vf-slice-nil
    format: true-false
    question: On peut appeler `append` sur un slice nil.
    truth: true
    answer: '`append` alloue le tableau au besoin ; `len` et `range` fonctionnent aussi.'
  - key: qcm-zeros
    format: multiple-choice
    question: "Laquelle de ces valeurs zéro est correcte ?"
    choices:
      - {text: "`[]int` : `nil`", correct: true}
      - {text: "`string` : `nil`", correct: false}
      - {text: "`*int` : `0`", correct: false}
      - {text: "`map[string]int` : une map vide, prête à l'écriture", correct: false}
    answer: "Une slice vaut `nil`, comme `bool` vaut `false`. Une chaîne vaut `\"\"` et ne peut pas être nil, un pointeur vaut `nil`, et une map nil se lit mais ne s'écrit pas."
  - key: qcm-utiles
    format: multiple-choice
    question: "Lesquels de ces types sont utilisables directement à leur valeur zéro ?"
    choices:
      - text: '`bytes.Buffer`'
        correct: true
      - text: '`sync.WaitGroup`'
        correct: true
      - text: '`map[string]int` pour y écrire'
        correct: false
      - text: '`*Client` pour appeler une méthode qui lit un champ'
        correct: false
    answer: La map et le pointeur nil demandent une initialisation avant usage.
  - key: qcm-absent
    format: multiple-choice
    question: Comment distinguer « âge non fourni » et « âge 0 » dans une struct décodée depuis du JSON ?
    choices:
      - text: Un champ `Age *int`, nil quand la clé est absente
        correct: true
      - text: Un champ `Age int` et tester `Age == 0`
        correct: false
      - text: Un champ `Age int` avec `omitempty`
        correct: false
      - text: Ce n'est pas possible en Go
        correct: false
    answer: '`omitempty` agit à l''encodage, pas au décodage ; le pointeur garde la différence.'
  - key: trous-buffer
    format: fill-in
    question: |-
      Complète pour obtenir un `strings.Builder` vide et utilisable :
      ```go
      ___ sb strings.Builder
      sb.WriteString("ok")
      ```
    blanks:
      - - var
    answer: Sa valeur zéro est un tampon vide prêt à servir.
  - key: trous-map
    format: fill-in
    question: |-
      Complète pour pouvoir écrire dans la map :
      ```go
      m := ___(map[string]int)
      m["a"] = 1
      ```
    blanks:
      - - make
    answer: '`make` crée une map vide non nil (ou le littéral `map[string]int{}`).'
  - key: trous-zero-string
    format: fill-in
    question: |-
      Complète le test d'une chaîne qui vaut sa valeur zéro :
      ```go
      if nom == ___ {
      	nom = "anonyme"
      }
      ```
    blanks:
      - - '""'
    answer: La valeur zéro d'une chaîne est la chaîne vide.
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complète le test d'un pointeur qui vaut sa valeur zéro :
      ```go
      if client == ___ {
      	return errors.New("client absent")
      }
      ```
    blanks:
      - - nil
    answer: Pointeurs, slices, maps, channels, fonctions et interfaces valent nil par défaut.
  - key: code-zeros
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var i int
      var s string
      var b bool
      var p *int
      fmt.Printf("%d %q %t %v\n", i, s, b, p)
      ```
    choices:
      - {text: "`0 \"\" false <nil>`", correct: true}
      - {text: "`0 nil false nil`", correct: false}
      - {text: "`0 \"\" false 0`", correct: false}
      - {text: "`0 <nil> false <nil>`", correct: false}
    answer: "`0 \"\" false <nil>` : chaque type a sa valeur zéro ; `%q` affiche la chaîne vide entre guillemets, et le pointeur nil s'écrit `<nil>`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar i int\n\tvar s string\n\tvar b bool\n\tvar p *int\n\tfmt.Printf(\"%d %q %t %v\\n\", i, s, b, p)\n}\n"
      output: 0 "" false <nil>
  - key: code-struct
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Config struct {
      	Hote  string
      	Port  int
      	Debug bool
      }

      var c Config
      fmt.Printf("%+v\n", c)
      ```
    choices:
      - {text: "`{Hote: Port:0 Debug:false}`", correct: true}
      - {text: "`{ 0 false}`", correct: false}
      - {text: "`<nil>`", correct: false}
      - {text: "`{Hote:<nil> Port:0 Debug:false}`", correct: false}
    answer: "`{Hote: Port:0 Debug:false}` : chaque champ vaut sa valeur zéro, et `%+v` écrit leurs noms ; la chaîne vide n'affiche rien."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct {\n\tHote  string\n\tPort  int\n\tDebug bool\n}\n\nfunc main() {\n\tvar c Config\n\tfmt.Printf(\"%+v\\n\", c)\n}\n"
      output: '{Hote: Port:0 Debug:false}'
  - key: code-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var sb strings.Builder
      sb.WriteString("Go")
      sb.WriteString("!")
      fmt.Println(sb.String(), sb.Len())
      ```
    choices:
      - {text: "`Go! 3`", correct: true}
      - {text: "`Go! 2`", correct: false}
      - {text: "`Go 3`", correct: false}
      - {text: "Une panic : le `Builder` n'a pas été créé", correct: false}
    answer: "`Go! 3` : le `strings.Builder` à sa valeur zéro est utilisable, sans constructeur ; `Len` compte les octets."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar sb strings.Builder\n\tsb.WriteString(\"Go\")\n\tsb.WriteString(\"!\")\n\tfmt.Println(sb.String(), sb.Len())\n}\n"
      output: Go! 3
  - key: code-map-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]int
      fmt.Println(m["absent"], m == nil)
      ```
    choices:
      - {text: "`0 true`", correct: true}
      - {text: "`0 false`", correct: false}
      - {text: "`<nil> true`", correct: false}
      - {text: "Une panic : lecture dans une map nil", correct: false}
    answer: "`0 true` : lire une map nil renvoie la valeur zéro, sans panic ; c'est l'écriture qui panique."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"absent\"], m == nil)\n}\n"
      output: 0 true
  - key: bug-map
    format: bug-fix
    question: |-
      Ce code panique avec « assignment to entry in nil map ». Quelle correction est la bonne ?
      ```go
      type Index struct {
      	pages map[string][]int
      }

      func (i *Index) Ajouter(mot string, page int) {
      	i.pages[mot] = append(i.pages[mot], page)
      }
      ```
    choices:
      - {text: "Créer la map au premier usage, quand `i.pages` est nil", correct: true}
      - {text: "Recevoir `i Index` par valeur plutôt que par pointeur", correct: false}
      - {text: "Lire avant d'écrire, `_ = i.pages[mot]`, pour créer l'entrée", correct: false}
      - {text: "Ajouter `append` sur la map elle-même, qui l'alloue au besoin", correct: false}
    answer: |-
      ```go
      func (i *Index) Ajouter(mot string, page int) {
      	if i.pages == nil {
      		i.pages = make(map[string][]int)
      	}
      	i.pages[mot] = append(i.pages[mot], page)
      }
      ```
      Créer la map au premier usage garde la valeur zéro d'`Index` utilisable, sans constructeur obligatoire. Lire une map nil ne crée rien.
  - key: bug-pointeur
    format: bug-fix
    question: |-
      Ce code panique avec « invalid memory address or nil pointer dereference ». Quelle correction est la bonne ?
      ```go
      var cfg *Config
      cfg.Port = 8080
      ```
    choices:
      - {text: "Pointer vers une struct, `cfg := &Config{}`, ou se passer du pointeur", correct: true}
      - {text: "Déréférencer explicitement : `(*cfg).Port = 8080`", correct: false}
      - {text: "Allouer le pointeur : `cfg = new(*Config)`, puis affecter", correct: false}
      - {text: "Tester `cfg != nil` juste après l'affectation du port", correct: false}
    answer: |-
      ```go
      cfg := &Config{}
      cfg.Port = 8080
      // ou, sans pointeur :
      var cfg Config
      cfg.Port = 8080
      ```
      La valeur zéro d'un pointeur est nil : il faut une struct à pointer. `new(*Config)` alloue un pointeur vers un pointeur, lui-même nil.
  - key: bug-absent-zero
    format: bug-fix
    question: |-
      Un client qui envoie `"remise": 0` voit sa remise remplacée par la remise par défaut. Quelle correction est la bonne ?
      ```go
      type Commande struct {
      	Remise int `json:"remise"`
      }

      if c.Remise == 0 {
      	c.Remise = remiseParDefaut
      }
      ```
    choices:
      - {text: "Un champ `*int`, nil quand la clé est absente, testé avant d'appliquer le défaut", correct: true}
      - {text: "Ajouter `omitempty` au tag, qui distingue au décodage l'absence du zéro", correct: false}
      - {text: "Tester `c.Remise < 0` plutôt que `== 0`, pour garder le zéro valide", correct: false}
      - {text: "Passer `Remise` en `float64`, dont le zéro se distingue de l'absence", correct: false}
    answer: |-
      ```go
      type Commande struct {
      	Remise *int `json:"remise"`
      }

      if c.Remise == nil {
      	c.Remise = &remiseParDefaut
      }
      ```
      Avec un `int`, « absent » et « 0 » se confondent ; le pointeur reste nil quand la clé est absente. `omitempty` ne joue qu'à l'encodage.
  - key: bug-constructeur-oublie
    format: bug-fix
    question: |-
      Ce compteur panique si on l'utilise sans passer par `NouveauCompteur`. Quelle correction est la bonne ?
      ```go
      type Compteur struct {
      	valeurs map[string]int
      }

      func (c *Compteur) Incrementer(cle string) { c.valeurs[cle]++ }
      ```
    choices:
      - {text: "Initialiser la map paresseusement dans `Incrementer`, quand elle est nil", correct: true}
      - {text: "Ajouter un `recover` dans `Incrementer`, qui ignore la panic", correct: false}
      - {text: "Déclarer `valeurs` en `map[string]*int`, sans autre changement", correct: false}
      - {text: "Documenter l'appel à `NouveauCompteur`, sans toucher au code", correct: false}
    answer: |-
      ```go
      func (c *Compteur) Incrementer(cle string) {
      	if c.valeurs == nil {
      		c.valeurs = map[string]int{}
      	}
      	c.valeurs[cle]++
      }
      ```
      Une initialisation paresseuse rend la valeur zéro utile : `var c Compteur` suffit. Une documentation n'empêche pas l'oubli.
  - key: scenario-api-zero
    format: scenario
    question: Tu conçois un type `Limiteur` pour une bibliothèque. Comment rendre sa valeur zéro utile ?
    choices:
      - {text: "Des champs dont le zéro a un sens, une initialisation paresseuse, des champs utiles à zéro", correct: true}
      - {text: "Un constructeur `NewLimiteur` obligatoire, et une panic si l'on s'en passe", correct: false}
      - {text: "Des champs exportés, que chaque utilisateur remplit lui-même avant le premier appel", correct: false}
      - {text: "Un test `if l == nil` dans chaque méthode, qui renvoie une erreur", correct: false}
    answer: "Je choisis des champs dont le zéro a un sens (0 voulant dire « pas de limite », par exemple), j'initialise paresseusement ce qui doit l'être (une map au premier appel), et j'utilise des types eux-mêmes utilisables à zéro (`sync.Mutex`). Je documente le comportement de `var l Limiteur` ; `NewLimiteur(options)` reste utile pour configurer, mais n'est pas obligatoire."
  - key: scenario-config-defaut
    format: scenario
    question: Comment appliquer des valeurs par défaut à une configuration lue en JSON, sans confondre zéro et absence ?
    choices:
      - {text: "Pré-remplir la struct avec les défauts avant `json.Unmarshal`, qui n'écrase que les clés présentes", correct: true}
      - {text: "Remplacer chaque zéro par le défaut après le décodage, même quand zéro est valide", correct: false}
      - {text: "Ajouter `omitempty` aux tags, pour que le décodeur ignore les valeurs à zéro", correct: false}
      - {text: "Écrire les défauts dans les tags, comme `json:\"port,default=8080\"`", correct: false}
    answer: "Je pré-remplis la struct avec les valeurs par défaut avant `json.Unmarshal`, qui n'écrase que les clés présentes : c'est la technique la plus simple. Si zéro n'est jamais valide (un port), remplacer le zéro après coup suffit ; sinon, un pointeur (`*int`) dit si la clé était présente. `encoding/json` n'a pas d'option `default`."
  - key: scenario-revue-nil
    format: scenario
    question: En revue, un collègue ajoute partout des constructeurs `NewX` pour éviter les paniques de valeurs nil. Ton avis ?
    choices:
      - {text: "Un constructeur pour les invariants ; sinon, une valeur zéro utile, comme `sync.Mutex`", correct: true}
      - {text: "D'accord : chaque type exporté doit avoir son `NewX`, c'est l'idiome de Go", correct: false}
      - {text: "Mieux vaut des types non exportés, pour qu'on ne les crée jamais à zéro", correct: false}
      - {text: "Mieux vaut des pointeurs partout, et un test `if x == nil` dans chaque méthode", correct: false}
    answer: "Un constructeur est utile quand le type a des invariants ou des dépendances obligatoires. Pour un simple conteneur, mieux vaut rendre la valeur zéro utilisable (initialisation paresseuse, champs dont zéro a un sens) : `var x X`, ou le type embarqué dans une struct, ne paniquera pas. C'est l'idiome de la bibliothèque standard (`sync.Mutex`, `bytes.Buffer`, `http.Client`)."
