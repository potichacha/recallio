notion: fonctions-bases
lesson: "Une fonction se déclare avec `func`, ses paramètres (nom puis type) et ses types de retour :\n\n```go\nfunc diviser(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division par zéro\")\n\t}\n\treturn a / b, nil\n}\n\nq, err := diviser(10, 3)\n```\n\n- Des paramètres consécutifs de même type se groupent : `a, b int`.\n- **Plusieurs valeurs de retour** sont la norme, en particulier `(résultat, error)` ; l'erreur vient en dernier.\n- Les arguments sont **toujours passés par valeur** : la fonction reçoit une copie. Une copie d'un pointeur, d'un\n  slice, d'une map ou d'un channel donne accès aux **mêmes données** sous-jacentes ; une copie d'une struct ou d'un\n  tableau est indépendante.\n- Pas de surcharge, pas de paramètres par défaut, pas de paramètres nommés à l'appel.\n- Une fonction exportée (majuscule) est visible hors du package.\n\n**Piège classique** : modifier une struct reçue en paramètre et croire que l'appelant voit le changement. Il faut\npasser un pointeur (`*Config`) ou renvoyer la nouvelle valeur.\n\n**En entretien** : « Paramètres typés après le nom, plusieurs retours avec l'erreur en dernier, tout passe par valeur ;\nun pointeur, un slice ou une map partagent leurs données parce que c'est l'en-tête qui est copié. »"
tour:
  - title: Les fonctions
    text: |-
      Une fonction déclare le type de chaque paramètre **après** son nom : `func aire(largeur, hauteur float64)
      float64`. Des paramètres consécutifs du même type partagent leur type.

      Une fonction peut renvoyer **plusieurs valeurs** : c'est ainsi que Go renvoie un résultat et une erreur, ou un
      quotient et un reste. On les récupère avec `q, r := divise(17, 5)`.

      Les arguments sont passés **par valeur** : la fonction reçoit une copie, et modifier un paramètre ne change rien
      chez l'appelant.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func aire(largeur, hauteur float64) float64 {
          	return largeur * hauteur
          }

          func divise(a, b int) (int, int) {
          	return a / b, a % b
          }

          func double(n int) {
          	n *= 2
          }

          func main() {
          	fmt.Println(aire(3, 4.5))
          	q, r := divise(17, 5)
          	fmt.Println(q, r)

          	n := 10
          	double(n)
          	fmt.Println(n)
          }
      output: |-
        13.5
        3 2
        10
    task:
      instructions: |-
        Complète `minMax`, qui renvoie le plus petit de ses deux arguments, puis le plus grand : le programme doit
        afficher `3 8`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func minMax(a, b int) (int, int) {
          	return a, b
          }

          func main() {
          	fmt.Println(minMax(8, 3))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func minMax(a, b int) (int, int) {
          	if a < b {
          		return a, b
          	}
          	return b, a
          }

          func main() {
          	fmt.Println(minMax(8, 3))
          }
      output: |-
        3 8
cards:
  - key: passe-arguments-valeur-reference
    format: course
    question: Go passe-t-il les arguments par valeur ou par référence ?
    choices:
      - {text: "Toujours par valeur ; une slice, une map ou un pointeur copient un en-tête ou une adresse", correct: true}
      - {text: "Par valeur pour les types de base, par référence pour les structs et les slices", correct: false}
      - {text: "Par référence, sauf si l'on copie explicitement la valeur avant l'appel", correct: false}
      - {text: "Au choix de l'appelant, avec le mot-clé `ref` placé devant l'argument", correct: false}
    answer: "Toujours par valeur. Une slice, une map ou un pointeur copient un en-tête ou une adresse, ce qui donne accès aux mêmes données ; une struct est copiée en entier."
  - key: retours-multiples
    format: course
    question: Pourquoi les fonctions Go renvoient-elles souvent deux valeurs ?
    choices:
      - {text: "Pour renvoyer le résultat et une erreur, `(T, error)` : Go n'a pas d'exceptions", correct: true}
      - {text: "Pour renvoyer une valeur et sa taille, comme une paire tableau et longueur en C", correct: false}
      - {text: "Parce qu'une fonction Go ne peut pas renvoyer de struct en une seule valeur", correct: false}
      - {text: "Pour renvoyer le résultat et un booléen, l'erreur passant par une panic", correct: false}
    answer: "Pour renvoyer le résultat et une erreur, `(T, error)`, l'erreur en dernier : c'est la manière de signaler un échec sans exceptions. La panic est réservée aux bugs."
  - key: struct-copie
    format: course
    question: Une fonction modifie un champ d'une struct reçue par valeur. L'appelant voit-il le changement ?
    choices:
      - {text: "Non : la fonction a reçu une copie ; il faut un pointeur ou renvoyer la valeur", correct: true}
      - {text: "Oui : une struct est passée par référence, comme un objet en Java", correct: false}
      - {text: "Oui, si le champ modifié est exporté, avec une majuscule", correct: false}
      - {text: "Non, et rien ne le permet : une struct reçue ne se modifie jamais", correct: false}
    answer: "Non : la fonction a reçu une copie ; il faut un pointeur (`*T`) ou renvoyer la valeur modifiée."
  - key: slice-partage
    format: course
    question: Pourquoi une fonction peut-elle modifier les éléments d'un slice reçu par valeur ?
    choices:
      - {text: "L'en-tête copié (pointeur, longueur, capacité) pointe sur le même tableau", correct: true}
      - {text: "Une slice est passée par référence, contrairement aux autres types", correct: false}
      - {text: "Go copie le tableau entier, puis le recopie dans l'appelant au retour", correct: false}
      - {text: "Le compilateur passe un pointeur dès qu'une fonction modifie un argument", correct: false}
    answer: "Parce que c'est l'en-tête de la slice (pointeur, longueur, capacité) qui est copié : la copie pointe sur le même tableau. Un `append` qui change la longueur, lui, reste invisible pour l'appelant."
  - key: vf-reference
    format: true-false
    question: Go passe certains arguments par référence, comme les maps.
    truth: false
    answer: Tout est passé par valeur ; une map est elle-même une référence vers une table, d'où le partage.
  - key: vf-defaut
    format: true-false
    question: Une fonction Go peut avoir des paramètres avec une valeur par défaut.
    truth: false
    answer: Ni valeurs par défaut ni surcharge ; on utilise une struct d'options ou des options fonctionnelles.
  - key: vf-groupe
    format: true-false
    question: '`func f(a, b int, s string)` déclare deux paramètres int et un string.'
    truth: true
    answer: Les paramètres consécutifs de même type partagent la déclaration de type.
  - key: vf-ignorer-retour
    format: true-false
    question: On peut appeler une fonction à deux retours et n'en récupérer qu'un avec `x := f()`.
    truth: false
    answer: Il faut récupérer toutes les valeurs (`x, _ := f()`), ou aucune en appelant `f()` comme instruction.
  - key: qcm-signatures
    format: multiple-choice
    question: "Laquelle de ces signatures de fonction compile ?"
    choices:
      - {text: "`func somme(a, b int) int`", correct: true}
      - {text: "`func somme(int a, int b) int`", correct: false}
      - {text: "`func somme(a int, b int = 0) int`", correct: false}
      - {text: "`func somme(a, b) int`", correct: false}
    answer: "Le type suit le nom, les paramètres consécutifs de même type se groupent (`a, b int`), et il n'y a pas de valeur par défaut. `func lire(chemin string) ([]byte, error)` compile aussi : plusieurs retours s'écrivent entre parenthèses."
  - key: qcm-appel
    format: multiple-choice
    question: "Avec `func diviser(a, b int) (int, error)`, lesquels de ces appels compilent ?"
    choices:
      - text: '`q, err := diviser(6, 3)`'
        correct: true
      - text: '`_, err := diviser(6, 3)`'
        correct: true
      - text: '`q := diviser(6, 3)`'
        correct: false
      - text: '`diviser(b: 3, a: 6)`'
        correct: false
    answer: Toutes les valeurs de retour se récupèrent, et les arguments ne se nomment pas.
  - key: qcm-copie
    format: multiple-choice
    question: "Une fonction reçoit ses arguments par valeur. Laquelle de ses modifications l'appelant voit-il ?"
    choices:
      - {text: "Un élément changé dans une slice reçue", correct: true}
      - {text: "Un champ changé dans une struct reçue", correct: false}
      - {text: "Un entier reçu, incrémenté par la fonction", correct: false}
      - {text: "Un `append` sur une slice reçue, non renvoyée", correct: false}
    answer: "La slice partage son tableau, comme la map ses entrées : un élément changé se voit. La struct et l'entier sont copiés, et un `append` change la longueur de la seule copie."
  - key: qcm-ordre-retour
    format: multiple-choice
    question: Dans quel ordre placer un résultat et une erreur ?
    choices:
      - text: Le résultat d'abord, l'erreur en dernier
        correct: true
      - text: L'erreur d'abord
        correct: false
      - text: Dans une struct obligatoirement
        correct: false
      - text: Peu importe, la convention n'existe pas
        correct: false
    answer: '`(T, error)` est la convention suivie par toute la bibliothèque standard.'
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature d'une fonction qui renvoie un entier et une erreur :
      ```go
      func analyser(s string) (___, ___) { ... }
      ```
    blanks:
      - - int
      - - error
    answer: Le résultat, puis l'erreur.
  - key: trous-retour
    format: fill-in
    question: |-
      Complète le retour en cas de succès :
      ```go
      return resultat, ___
      ```
    blanks:
      - - nil
    answer: Une erreur nil signifie « pas d'erreur ».
  - key: trous-groupe
    format: fill-in
    question: |-
      Complète pour déclarer deux paramètres float64 :
      ```go
      func distance(x, y ___) float64 { ... }
      ```
    blanks:
      - - float64
    answer: Les paramètres consécutifs de même type se groupent.
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complète pour que la fonction modifie la configuration de l'appelant :
      ```go
      func activerDebug(c ___Config) {
      	c.Debug = true
      }
      ```
    blanks:
      - - '*'
    answer: Un pointeur donne accès à la valeur de l'appelant.
  - key: code-copie-struct
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Config struct{ Debug bool }

      func activer(c Config) { c.Debug = true }

      c := Config{}
      activer(c)
      fmt.Println(c.Debug)
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Ça ne compile pas : `c` n'est pas un pointeur", correct: false}
    answer: "`false` : `activer` a modifié une copie de la struct, pas celle de l'appelant."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct{ Debug bool }\n\n\nfunc activer(c Config) { c.Debug = true }\n\nfunc main() {\n\tc := Config{}\n\tactiver(c)\n\tfmt.Println(c.Debug)\n}\n"
      output: 'false'
  - key: code-slice-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func doubler(xs []int) {
      	for i := range xs {
      		xs[i] *= 2
      	}
      }

      xs := []int{1, 2, 3}
      doubler(xs)
      fmt.Println(xs)
      ```
    choices:
      - {text: "`[2 4 6]`", correct: true}
      - {text: "`[1 2 3]`", correct: false}
      - {text: "Ça ne compile pas : `xs` est reçue par valeur", correct: false}
    answer: "`[2 4 6]` : la copie de l'en-tête pointe sur le même tableau, que la fonction modifie."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc doubler(xs []int) {\n\tfor i := range xs {\n\t\txs[i] *= 2\n\t}\n}\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tdoubler(xs)\n\tfmt.Println(xs)\n}\n"
      output: '[2 4 6]'
  - key: code-retours
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func minMax(xs []int) (int, int) {
      	lo, hi := xs[0], xs[0]
      	for _, x := range xs {
      		lo, hi = min(lo, x), max(hi, x)
      	}
      	return lo, hi
      }

      lo, hi := minMax([]int{4, 1, 7})
      fmt.Println(lo, hi)
      ```
    choices:
      - {text: "`1 7`", correct: true}
      - {text: "`4 7`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`1 4`", correct: false}
    answer: "`1 7` : la fonction renvoie deux valeurs, le minimum et le maximum, récupérées ensemble."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc minMax(xs []int) (int, int) {\n\tlo, hi := xs[0], xs[0]\n\tfor _, x := range xs {\n\t\tlo, hi = min(lo, x), max(hi, x)\n\t}\n\treturn lo, hi\n}\n\nfunc main() {\n\tlo, hi := minMax([]int{4, 1, 7})\n\tfmt.Println(lo, hi)\n}\n"
      output: 1 7
  - key: code-append-perdu
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func ajouter(xs []int) {
      	xs = append(xs, 4)
      }

      xs := []int{1, 2, 3}
      ajouter(xs)
      fmt.Println(xs)
      ```
    choices:
      - {text: "`[1 2 3]`", correct: true}
      - {text: "`[1 2 3 4]`", correct: false}
      - {text: "`[1 2 3 0]`", correct: false}
      - {text: "Ça ne compile pas : `xs` est affectée sans être lue", correct: false}
    answer: "`[1 2 3]` : `append` modifie la copie locale de l'en-tête ; l'appelant garde sa longueur de 3. Un paramètre n'est jamais « déclaré et non utilisé »."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(xs []int) {\n\txs = append(xs, 4)\n}\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tajouter(xs)\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3]'
  - key: bug-struct-valeur
    format: bug-fix
    question: |-
      Le compteur de visites reste à 0. Quelle correction est la bonne ?
      ```go
      type Page struct{ Visites int }

      func visiter(p Page) { p.Visites++ }
      ```
    choices:
      - {text: "Recevoir un pointeur, `func visiter(p *Page)`, et appeler `visiter(&page)`", correct: true}
      - {text: "Incrémenter avec `p.Visites += 1`, que Go applique à l'original", correct: false}
      - {text: "Renvoyer `p` avec `func visiter(p Page) Page`, sans changer l'appel", correct: false}
      - {text: "Recevoir la page en `any`, qu'une interface passe par référence", correct: false}
    answer: |-
      ```go
      func visiter(p *Page) { p.Visites++ }

      visiter(&page)
      ```
      La struct passée par valeur était copiée ; un pointeur modifie celle de l'appelant. Renvoyer la page marche aussi, à condition que l'appelant récupère le résultat.
  - key: bug-append
    format: bug-fix
    question: |-
      Les éléments ajoutés par la fonction disparaissent. Quelle correction est la bonne ?
      ```go
      func ajouterDefauts(opts []string) {
      	opts = append(opts, "-v", "-race")
      }
      ```
    choices:
      - {text: "Renvoyer la nouvelle slice, et écrire `opts = ajouterDefauts(opts)`", correct: true}
      - {text: "Créer `opts` avec une grande capacité, pour qu'`append` ne réalloue pas", correct: false}
      - {text: "Remplacer `append` par `copy(opts, ...)`, qui modifie l'original", correct: false}
      - {text: "Appeler `ajouterDefauts(&opts)`, sans changer la signature", correct: false}
    answer: |-
      ```go
      func ajouterDefauts(opts []string) []string {
      	return append(opts, "-v", "-race")
      }

      opts = ajouterDefauts(opts)
      ```
      `append` peut réallouer et change la longueur, que l'appelant ne voit pas : on renvoie la nouvelle slice, comme `append` lui-même. Même sans réallocation, la longueur de l'appelant resterait la même.
  - key: bug-retour-ignore
    format: bug-fix
    question: |-
      Le compilateur signale « assignment mismatch: 1 variable but strconv.Atoi returns 2 values ». Quelle correction est la bonne ?
      ```go
      n := strconv.Atoi(saisie)
      ```
    choices:
      - {text: "Récupérer les deux valeurs, `n, err := strconv.Atoi(saisie)`, et traiter `err`", correct: true}
      - {text: "Prendre le premier retour seulement : `n := strconv.Atoi(saisie)[0]`", correct: false}
      - {text: "Convertir directement, sans `strconv` : `n := int(saisie)`", correct: false}
      - {text: "Ignorer l'erreur, plus court : `n, _ := strconv.Atoi(saisie)`", correct: false}
    answer: |-
      ```go
      n, err := strconv.Atoi(saisie)
      if err != nil {
      	return fmt.Errorf("nombre invalide %q : %w", saisie, err)
      }
      ```
      Toutes les valeurs de retour se récupèrent, et l'erreur se traite : l'ignorer donnerait 0 en silence pour une saisie invalide.
  - key: bug-defaut
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      func connecter(hote string, port int = 5432) error { ... }
      ```
    choices:
      - {text: "Retirer `= 5432`, et appliquer le défaut dans le corps quand `port` vaut 0", correct: true}
      - {text: "Placer le paramètre qui a une valeur par défaut en première position", correct: false}
      - {text: "Ajouter une fonction `connecter(hote string)`, qui surcharge la première", correct: false}
      - {text: "Remplacer `=` par `:=` dans la signature : `port int := 5432`", correct: false}
    answer: |-
      ```go
      const portParDefaut = 5432

      func connecter(hote string, port int) error {
      	if port == 0 {
      		port = portParDefaut
      	}
      	...
      }
      ```
      Go n'a ni valeurs par défaut ni surcharge : on applique le défaut dans le corps (zéro signifie « défaut »), ou l'on prend une struct d'options.
