notion: fonctions-bases
lesson: "Une fonction se déclare avec `func`, ses paramètres (nom puis type) et ses types de retour :\n\n```go\nfunc diviser(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division par zéro\")\n\t}\n\treturn a / b, nil\n}\n\nq, err := diviser(10, 3)\n```\n\n- Des paramètres consécutifs de même type se groupent : `a, b int`.\n- **Plusieurs valeurs de retour** sont la norme, en particulier `(résultat, error)` ; l'erreur vient en dernier.\n- Les arguments sont **toujours passés par valeur** : la fonction reçoit une copie. Une copie d'un pointeur, d'un\n  slice, d'une map ou d'un channel donne accès aux **mêmes données** sous-jacentes ; une copie d'une struct ou d'un\n  tableau est indépendante.\n- Pas de surcharge, pas de paramètres par défaut, pas de paramètres nommés à l'appel.\n- Une fonction exportée (majuscule) est visible hors du package.\n\n**Piège classique** : modifier une struct reçue en paramètre et croire que l'appelant voit le changement. Il faut\npasser un pointeur (`*Config`) ou renvoyer la nouvelle valeur.\n\n**En entretien** : « Paramètres typés après le nom, plusieurs retours avec l'erreur en dernier, tout passe par valeur ;\nun pointeur, un slice ou une map partagent leurs données parce que c'est l'en-tête qui est copié. »"
cards:
  - key: passe-arguments-valeur-reference
    format: course
    question: Go passe-t-il les arguments par valeur ou par référence ?
    answer: Toujours par valeur ; un slice, une map ou un pointeur copient un en-tête ou une adresse.
  - key: retours-multiples
    format: course
    question: Pourquoi les fonctions Go renvoient-elles souvent deux valeurs ?
    answer: 'Pour renvoyer le résultat et une erreur, `(T, error)`, l''erreur en dernier : c''est la manière de signaler un échec sans exceptions.'
  - key: struct-copie
    format: course
    question: Une fonction modifie un champ d'une struct reçue par valeur. L'appelant voit-il le changement ?
    answer: 'Non : la fonction a reçu une copie ; il faut un pointeur (`*T`) ou renvoyer la valeur modifiée.'
  - key: slice-partage
    format: course
    question: Pourquoi une fonction peut-elle modifier les éléments d'un slice reçu par valeur ?
    answer: 'Parce que c''est l''en-tête du slice (pointeur, longueur, capacité) qui est copié : la copie pointe sur le même tableau.'
  - key: vf-reference
    format: true-false
    question: Go passe certains arguments par référence, comme les maps.
    truth: false
    answer: Tout est passé par valeur ; une map est elle-même une référence vers une table, d'où le partage.
  - key: vf-defaut
    format: true-false
    question: Une fonction Go peut avoir des paramètres avec une valeur par défaut.
    truth: false
    answer: Ni valeurs par défaut ni surcharge ; on utilise une struct d'options ou des options fonctionnelles.
  - key: vf-groupe
    format: true-false
    question: '`func f(a, b int, s string)` déclare deux paramètres int et un string.'
    truth: true
    answer: Les paramètres consécutifs de même type partagent la déclaration de type.
  - key: vf-ignorer-retour
    format: true-false
    question: On peut appeler une fonction à deux retours et n'en récupérer qu'un avec `x := f()`.
    truth: false
    answer: Il faut récupérer toutes les valeurs (`x, _ := f()`), ou aucune en appelant `f()` comme instruction.
  - key: qcm-signatures
    format: multiple-choice
    question: Quelles signatures sont valides ?
    choices:
      - text: '`func somme(a, b int) int`'
        correct: true
      - text: '`func lire(chemin string) ([]byte, error)`'
        correct: true
      - text: '`func somme(int a, int b) int`'
        correct: false
      - text: '`func somme(a int, b int = 0) int`'
        correct: false
    answer: Le type suit le nom, et il n'y a pas de valeur par défaut.
  - key: qcm-appel
    format: multiple-choice
    question: Avec `func diviser(a, b int) (int, error)`, quels appels compilent ?
    choices:
      - text: '`q, err := diviser(6, 3)`'
        correct: true
      - text: '`_, err := diviser(6, 3)`'
        correct: true
      - text: '`q := diviser(6, 3)`'
        correct: false
      - text: '`diviser(b: 3, a: 6)`'
        correct: false
    answer: Toutes les valeurs de retour se récupèrent, et les arguments ne se nomment pas.
  - key: qcm-copie
    format: multiple-choice
    question: Quels arguments une fonction peut-elle modifier de façon visible pour l'appelant ?
    choices:
      - text: Les éléments d'un slice
        correct: true
      - text: Les entrées d'une map
        correct: true
      - text: Les champs d'une struct passée par valeur
        correct: false
      - text: Un entier passé par valeur
        correct: false
    answer: Le slice et la map partagent leurs données ; la struct et l'entier sont copiés.
  - key: qcm-ordre-retour
    format: multiple-choice
    question: Dans quel ordre placer un résultat et une erreur ?
    choices:
      - text: Le résultat d'abord, l'erreur en dernier
        correct: true
      - text: L'erreur d'abord
        correct: false
      - text: Dans une struct obligatoirement
        correct: false
      - text: Peu importe, la convention n'existe pas
        correct: false
    answer: '`(T, error)` est la convention suivie par toute la bibliothèque standard.'
  - key: trous-signature
    format: fill-in
    question: |-
      Complétez la signature d'une fonction qui renvoie un entier et une erreur :
      ```go
      func analyser(s string) (___, ___) { ... }
      ```
    blanks:
      - - int
      - - error
    answer: Le résultat, puis l'erreur.
  - key: trous-retour
    format: fill-in
    question: |-
      Complétez le retour en cas de succès :
      ```go
      return resultat, ___
      ```
    blanks:
      - - nil
    answer: Une erreur nil signifie « pas d'erreur ».
  - key: trous-groupe
    format: fill-in
    question: |-
      Complétez pour déclarer deux paramètres float64 :
      ```go
      func distance(x, y ___) float64 { ... }
      ```
    blanks:
      - - float64
    answer: Les paramètres consécutifs de même type se groupent.
  - key: trous-pointeur
    format: fill-in
    question: "Complétez pour que la fonction modifie la configuration de l'appelant :\n```go\nfunc activerDebug(c ___Config) {\n\tc.Debug = true\n}\n```"
    blanks:
      - - '*'
    answer: Un pointeur donne accès à la valeur de l'appelant.
  - key: code-copie-struct
    format: code-output
    question: |-
      ```go
      type Config struct{ Debug bool }

      func activer(c Config) { c.Debug = true }

      c := Config{}
      activer(c)
      fmt.Println(c.Debug)
      ```
    answer: '`false` : la fonction a modifié une copie.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct{ Debug bool }\n\n\nfunc activer(c Config) { c.Debug = true }\n\nfunc main() {\n\tc := Config{}\n\tactiver(c)\n\tfmt.Println(c.Debug)\n}\n"
      output: 'false'
  - key: code-slice-partage
    format: code-output
    question: "```go\nfunc doubler(xs []int) {\n\tfor i := range xs {\n\t\txs[i] *= 2\n\t}\n}\n\nxs := []int{1, 2, 3}\ndoubler(xs)\nfmt.Println(xs)\n```"
    answer: '`[2 4 6]` : la copie de l''en-tête pointe sur le même tableau.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc doubler(xs []int) {\n\tfor i := range xs {\n\t\txs[i] *= 2\n\t}\n}\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tdoubler(xs)\n\tfmt.Println(xs)\n}\n"
      output: '[2 4 6]'
  - key: code-retours
    format: code-output
    question: "```go\nfunc minMax(xs []int) (int, int) {\n\tlo, hi := xs[0], xs[0]\n\tfor _, x := range xs {\n\t\tlo, hi = min(lo, x), max(hi, x)\n\t}\n\treturn lo, hi\n}\n\nlo, hi := minMax([]int{4, 1, 7})\nfmt.Println(lo, hi)\n```"
    answer: '`1 7` : deux valeurs de retour, récupérées ensemble.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc minMax(xs []int) (int, int) {\n\tlo, hi := xs[0], xs[0]\n\tfor _, x := range xs {\n\t\tlo, hi = min(lo, x), max(hi, x)\n\t}\n\treturn lo, hi\n}\n\nfunc main() {\n\tlo, hi := minMax([]int{4, 1, 7})\n\tfmt.Println(lo, hi)\n}\n"
      output: 1 7
  - key: code-append-perdu
    format: code-output
    question: "```go\nfunc ajouter(xs []int) {\n\txs = append(xs, 4)\n}\n\nxs := []int{1, 2, 3}\najouter(xs)\nfmt.Println(xs)\n```"
    answer: '`[1 2 3]` : `append` modifie la copie locale de l''en-tête ; l''appelant garde sa longueur de 3.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(xs []int) {\n\txs = append(xs, 4)\n}\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tajouter(xs)\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3]'
  - key: bug-struct-valeur
    format: bug-fix
    question: |-
      Le compteur de visites reste à 0 :
      ```go
      type Page struct{ Visites int }

      func visiter(p Page) { p.Visites++ }
      ```
    answer: |-
      ```go
      func visiter(p *Page) { p.Visites++ }

      visiter(&page)
      ```
      La struct passée par valeur était copiée ; un pointeur modifie celle de l'appelant.
  - key: bug-append
    format: bug-fix
    question: "Les éléments ajoutés par la fonction disparaissent :\n```go\nfunc ajouterDefauts(opts []string) {\n\topts = append(opts, \"-v\", \"-race\")\n}\n```"
    answer: "```go\nfunc ajouterDefauts(opts []string) []string {\n\treturn append(opts, \"-v\", \"-race\")\n}\n\nopts = ajouterDefauts(opts)\n```\n`append` peut réallouer et change la longueur : on renvoie le nouveau slice, comme `append` lui-même."
  - key: bug-retour-ignore
    format: bug-fix
    question: |-
      Le compilateur signale « assignment mismatch: 1 variable but strconv.Atoi returns 2 values » :
      ```go
      n := strconv.Atoi(saisie)
      ```
    answer: "```go\nn, err := strconv.Atoi(saisie)\nif err != nil {\n\treturn fmt.Errorf(\"nombre invalide %q : %w\", saisie, err)\n}\n```\nToutes les valeurs de retour se récupèrent, et l'erreur se traite."
  - key: bug-defaut
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```go
      func connecter(hote string, port int = 5432) error { ... }
      ```
    answer: "```go\nconst portParDefaut = 5432\n\nfunc connecter(hote string, port int) error {\n\tif port == 0 {\n\t\tport = portParDefaut\n\t}\n\t...\n}\n```\nGo n'a pas de valeurs par défaut : on les applique dans le corps (zéro signifie « défaut »), ou l'on prend une\nstruct d'options."
