notion: conversions-numeriques
lesson: |-
  Go ne fait **aucune conversion implicite** entre types numériques, même entre `int` et `int64` :

  ```go
  var i int = 42
  var f float64 = i          // erreur : cannot use i (variable of type int) as float64
  var f float64 = float64(i) // conversion explicite
  var n int64 = int64(i)
  moyenne := float64(somme) / float64(len(notes))
  ```

  La conversion s'écrit `T(v)`. Ce qu'elle fait :
  - **flottant vers entier** : la partie décimale est **tronquée** vers zéro (`int(2.9) == 2`, `int(-2.9) == -2`) ;
    pour arrondir, `math.Round` ;
  - **vers un entier plus petit** : les bits de poids fort sont perdus, sans erreur (`int8(200) == -56`) ;
  - entier vers `string` : donne le **caractère** de ce point de code, pas le texte du nombre (`strconv.Itoa` pour ça).

  Les **constantes non typées** font exception : `const n = 10` s'utilise comme `int`, `float64` ou `time.Duration`
  selon le contexte, car elle n'a pas encore de type.

  La division entre entiers est entière, **tronquée vers zéro** : `7/2 == 3`, `-7/2 == -3`, et le reste `%` a le signe
  du dividende.

  **Piège classique** : `float64(a / b)` avec deux entiers. La division entière a lieu **avant** la conversion ; il faut
  `float64(a) / float64(b)`.

  **En entretien** : « Aucune conversion implicite ; `T(v)` explicite, qui tronque les flottants et coupe les entiers
  sans erreur ; seules les constantes non typées s'adaptent. »
tour:
  - title: Pas de conversion implicite
    text: |-
      Go ne convertit jamais un nombre d'un type à un autre en silence : additionner un `int` et un `float64` ne compile
      pas. On convertit explicitement, avec le nom du type comme une fonction : `float64(n)`, `int(x)`.

      Convertir un flottant en entier **tronque** vers zéro : `int(2.9)` vaut `2`. Convertir vers un type plus petit ne
      garde que les bits de poids faible : un `int` qui vaut 300 devient 44 en `uint8`.

      Les constantes échappent à la règle : `2 * 3.5` compile, car une constante non typée prend le type qu'il faut
      (page suivante).

      Essaie : enlève le `float64(…)` autour de `total`, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	total := 7
          	nombre := 2
          	moyenne := float64(total) / float64(nombre)
          	fmt.Println(moyenne)

          	x := 2.9
          	fmt.Println(int(x), int(-x))

          	grand := 300
          	fmt.Println(uint8(grand))
          }
      output: |-
        3.5
        2 -2
        44
cards:
  - key: conversions-numeriques-implicites
    format: course
    question: Go fait-il des conversions numériques implicites ?
    answer: Non, même entre int et int64 ; seules les constantes non typées s'adaptent au contexte.
  - key: code-fmt-println-7-2-7
    format: code-output
    question: '`fmt.Println(7/2, -7/2, 7%3, -7%3)`'
    answer: '`3 -3 1 -1` : division entière tronquée vers zéro, le signe du modulo suit le dividende.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(7/2, -7/2, 7%3, -7%3)\n}\n"
      output: 3 -3 1 -1
  - key: constante-non-typee
    format: course
    question: Pourquoi `const n = 10` peut-il servir à la fois comme `int` et comme `float64` ?
    answer: 'Parce qu''une constante non typée n''a pas encore de type : elle prend celui que le contexte demande, tant que la valeur y tient.'
  - key: qcm-string-int
    format: multiple-choice
    question: Que vaut `string(rune(65))` ?
    choices:
      - text: '`"A"`'
        correct: true
      - text: '`"65"`'
        correct: false
      - text: Une erreur de compilation
        correct: false
      - text: '`""`'
        correct: false
    answer: La conversion d'un entier en chaîne donne le caractère de ce point de code ; `strconv.Itoa(65)` donnerait `"65"`.
  - key: troncature
    format: course
    question: Que vaut `int(2.9)` ? Et `int(-2.9)` ?
    answer: '`2` et `-2` : la conversion tronque vers zéro ; pour arrondir, `int(math.Round(x))`.'
  - key: moyenne
    format: course
    question: Pourquoi `float64(somme / n)` donne-t-il une moyenne fausse avec deux entiers ?
    answer: 'La division entière a lieu avant la conversion ; il faut convertir les opérandes : `float64(somme) / float64(n)`.'
  - key: vf-int-int64
    format: true-false
    question: Une variable `int` s'affecte directement à une variable `int64`.
    truth: false
    answer: Ce sont deux types distincts ; il faut `int64(i)`.
  - key: vf-constante
    format: true-false
    question: '`const delai = 5` puis `time.Sleep(delai * time.Second)` compile.'
    truth: true
    answer: Une constante non typée prend le type que le contexte demande, ici `time.Duration`.
  - key: vf-depassement
    format: true-false
    question: Convertir `int` vers `int8` une valeur trop grande provoque une panique.
    truth: false
    answer: Les bits de poids fort sont perdus silencieusement ; il faut vérifier la plage soi-même.
  - key: vf-modulo
    format: true-false
    question: En Go, `-7 % 3` vaut `-1`.
    truth: true
    answer: Le reste a le signe du dividende ; la division est tronquée vers zéro.
  - key: qcm-compile
    format: multiple-choice
    question: Avec `var i int = 3` et `var f float64 = 1.5`, qu'est-ce qui compile ?
    choices:
      - text: '`f + float64(i)`'
        correct: true
      - text: '`int(f) + i`'
        correct: true
      - text: '`f + i`'
        correct: false
      - text: '`var g float64 = i`'
        correct: false
    answer: Les deux opérandes d'une opération doivent avoir le même type.
  - key: qcm-moyenne
    format: multiple-choice
    question: Avec `somme, n := 7, 2` (des int), quelle expression donne 3.5 ?
    choices:
      - text: '`float64(somme) / float64(n)`'
        correct: true
      - text: '`float64(somme / n)`'
        correct: false
      - text: '`somme / n`'
        correct: false
      - text: '`float64(somme) / n`'
        correct: false
    answer: La dernière ne compile pas (float64 et int) ; les deux autres font une division entière.
  - key: qcm-arrondi
    format: multiple-choice
    question: Comment obtenir l'entier le plus proche de `x := 2.6` ?
    choices:
      - text: '`int(math.Round(x))`'
        correct: true
      - text: '`int(x)`'
        correct: false
      - text: '`math.Floor(x)` seul, sans conversion'
        correct: false
      - text: '`round(x)`'
        correct: false
    answer: '`int(x)` tronque (2) ; `math.Round` arrondit (3.0), puis on convertit.'
  - key: trous-conversion
    format: fill-in
    question: |-
      Complétez pour calculer une moyenne flottante :
      ```go
      moyenne := ___(total) / ___(len(notes))
      ```
    blanks:
      - - float64
      - - float64
    answer: On convertit chaque opérande avant de diviser.
  - key: trous-int64
    format: fill-in
    question: |-
      Complétez pour passer un `int` à une fonction qui attend un `int64` :
      ```go
      enregistrer(___(n))
      ```
    blanks:
      - - int64
    answer: La conversion explicite `int64(n)`.
  - key: trous-arrondi
    format: fill-in
    question: |-
      Complétez pour arrondir avant de convertir :
      ```go
      euros := int(math.___(montant))
      ```
    blanks:
      - - Round
    answer: '`math.Round` arrondit au plus proche ; `int` seul tronquerait.'
  - key: trous-itoa
    format: fill-in
    question: |-
      Complétez pour obtenir le texte "42" à partir de l'entier 42 :
      ```go
      texte := strconv.___(42)
      ```
    blanks:
      - - Itoa
    answer: '`string(42)` donnerait le caractère `*`, pas le texte du nombre.'
  - key: code-tronquer
    format: code-output
    question: |-
      ```go
      f := 2.9
      fmt.Println(int(f), int(-f))
      ```
    answer: '`2 -2` : la conversion tronque vers zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tf := 2.9\n\tfmt.Println(int(f), int(-f))\n}\n"
      output: 2 -2
  - key: code-moyenne
    format: code-output
    question: |-
      ```go
      somme, n := 7, 2
      fmt.Println(float64(somme/n), float64(somme)/float64(n))
      ```
    answer: '`3 3.5` : la première division est entière, faite avant la conversion.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsomme, n := 7, 2\n\tfmt.Println(float64(somme/n), float64(somme)/float64(n))\n}\n"
      output: 3 3.5
  - key: code-int8
    format: code-output
    question: |-
      ```go
      x := 200
      fmt.Println(int8(x), uint8(x))
      ```
    answer: '`-56 200` : convertir vers un type plus petit garde les 8 bits de poids faible, réinterprétés selon le signe.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 200\n\tfmt.Println(int8(x), uint8(x))\n}\n"
      output: "-56 200"
  - key: bug-moyenne
    format: bug-fix
    question: "La note moyenne affichée est toujours un nombre entier :\n```go\nfunc moyenne(notes []int) float64 {\n\ttotal := 0\n\tfor _, n := range notes {\n\t\ttotal += n\n\t}\n\treturn float64(total / len(notes))\n}\n```"
    answer: |-
      ```go
      return float64(total) / float64(len(notes))
      ```
      La division entière tronquait le résultat avant la conversion.
  - key: bug-mismatched
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: prix * quantite (mismatched types float64 and int) » :
      ```go
      total := prix * quantite
      ```
    answer: |-
      ```go
      total := prix * float64(quantite)
      ```
      Les deux opérandes doivent avoir le même type : on convertit explicitement.
  - key: bug-itoa
    format: bug-fix
    question: |-
      Le message affiche « Commande n°* » au lieu de « Commande n°42 » :
      ```go
      msg := "Commande n°" + string(numero) // numero vaut 42
      ```
    answer: |-
      ```go
      msg := "Commande n°" + strconv.Itoa(numero)
      // ou fmt.Sprintf("Commande n°%d", numero)
      ```
      `string(42)` donne le caractère de point de code 42 (`*`) ; `go vet` le signale.
  - key: bug-plage
    format: bug-fix
    question: |-
      Un âge de 300 lu dans un formulaire devient 44 en base :
      ```go
      age := uint8(valeurSaisie) // valeurSaisie est un int
      ```
    answer: "```go\nif valeurSaisie < 0 || valeurSaisie > 150 {\n\treturn fmt.Errorf(\"âge invalide : %d\", valeurSaisie)\n}\nage := uint8(valeurSaisie)\n```\nLa conversion coupe les bits sans erreur (300 mod 256 = 44) : on vérifie la plage avant de convertir."
