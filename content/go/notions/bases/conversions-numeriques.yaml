notion: conversions-numeriques
lesson: |-
  Go ne fait **aucune conversion implicite** entre types numériques, même entre `int` et `int64` :

  ```go
  var i int = 42
  var f float64 = i          // erreur : cannot use i (variable of type int) as float64
  var f float64 = float64(i) // conversion explicite
  var n int64 = int64(i)
  moyenne := float64(somme) / float64(len(notes))
  ```

  La conversion s'écrit `T(v)`. Ce qu'elle fait :
  - **flottant vers entier** : la partie décimale est **tronquée** vers zéro (`int(2.9) == 2`, `int(-2.9) == -2`) ;
    pour arrondir, `math.Round` ;
  - **vers un entier plus petit** : les bits de poids fort sont perdus, sans erreur (`int8(200) == -56`) ;
  - entier vers `string` : donne le **caractère** de ce point de code, pas le texte du nombre (`strconv.Itoa` pour ça).

  Les **constantes non typées** font exception : `const n = 10` s'utilise comme `int`, `float64` ou `time.Duration`
  selon le contexte, car elle n'a pas encore de type.

  La division entre entiers est entière, **tronquée vers zéro** : `7/2 == 3`, `-7/2 == -3`, et le reste `%` a le signe
  du dividende.

  **Piège classique** : `float64(a / b)` avec deux entiers. La division entière a lieu **avant** la conversion ; il faut
  `float64(a) / float64(b)`.

  **En entretien** : « Aucune conversion implicite ; `T(v)` explicite, qui tronque les flottants et coupe les entiers
  sans erreur ; seules les constantes non typées s'adaptent. »
tour:
  - title: Pas de conversion implicite
    text: |-
      Go ne convertit jamais un nombre d'un type à un autre en silence : additionner un `int` et un `float64` ne compile
      pas. On convertit explicitement, avec le nom du type comme une fonction : `float64(n)`, `int(x)`.

      Convertir un flottant en entier **tronque** vers zéro : `int(2.9)` vaut `2`. Convertir vers un type plus petit ne
      garde que les bits de poids faible : un `int` qui vaut 300 devient 44 en `uint8`.

      Les constantes échappent à la règle : `2 * 3.5` compile, car une constante non typée prend le type qu'il faut
      (page suivante).

      Essaie : enlève le `float64(…)` autour de `total`, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	total := 7
          	nombre := 2
          	moyenne := float64(total) / float64(nombre)
          	fmt.Println(moyenne)

          	x := 2.9
          	fmt.Println(int(x), int(-x))

          	grand := 300
          	fmt.Println(uint8(grand))
          }
      output: |-
        3.5
        2 -2
        44
cards:
  - key: conversions-numeriques-implicites
    format: course
    question: Go fait-il des conversions numériques implicites ?
    choices:
      - {text: "Non, même entre `int` et `int64` ; seules les constantes non typées s'adaptent", correct: true}
      - {text: "Oui, vers le type le plus large, comme de `int` vers `int64` en Java", correct: false}
      - {text: "Oui, entre entiers ; seul le passage aux flottants demande une conversion", correct: false}
      - {text: "Non, sauf dans une affectation, où la valeur prend le type de la variable", correct: false}
    answer: "Non, même entre `int` et `int64` : chaque conversion s'écrit, `int64(n)`. Seules les constantes non typées s'adaptent au contexte."
  - key: code-fmt-println-7-2-7
    format: code-output
    question: "Qu'affiche `fmt.Println(7/2, -7/2, 7%3, -7%3)` ?"
    choices:
      - {text: "`3 -3 1 -1`", correct: true}
      - {text: "`3 -4 1 2`", correct: false}
      - {text: "`3.5 -3.5 1 -1`", correct: false}
      - {text: "`3 -3 1 2`", correct: false}
    answer: "`3 -3 1 -1` : la division entière tronque vers zéro, et le signe du modulo suit le dividende. Python, qui arrondit vers le bas, donnerait -4 et 2."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(7/2, -7/2, 7%3, -7%3)\n}\n"
      output: 3 -3 1 -1
  - key: constante-non-typee
    format: course
    question: Pourquoi `const n = 10` peut-il servir à la fois comme `int` et comme `float64` ?
    choices:
      - {text: "Une constante non typée prend le type que demande le contexte, si la valeur y tient", correct: true}
      - {text: "Go convertit implicitement un `int` en `float64`, comme toute valeur numérique", correct: false}
      - {text: "`const` déclare toujours un `float64`, que Go tronque au besoin en `int`", correct: false}
      - {text: "Le compilateur crée deux constantes, l'une `int` et l'autre `float64`", correct: false}
    answer: "Parce qu'une constante non typée n'a pas encore de type : elle prend celui que le contexte demande, tant que la valeur y tient. Une variable `int`, elle, ne se convertit jamais implicitement."
  - key: qcm-string-int
    format: multiple-choice
    question: Que vaut `string(rune(65))` ?
    choices:
      - text: '`"A"`'
        correct: true
      - text: '`"65"`'
        correct: false
      - text: Une erreur de compilation
        correct: false
      - text: '`""`'
        correct: false
    answer: La conversion d'un entier en chaîne donne le caractère de ce point de code ; `strconv.Itoa(65)` donnerait `"65"`.
  - key: troncature
    format: course
    question: "Avec `x := 2.9`, que valent `int(x)` et `int(-x)` ?"
    choices:
      - {text: "`2` et `-2` : la conversion tronque vers zéro", correct: true}
      - {text: "`3` et `-3` : la conversion arrondit au plus proche", correct: false}
      - {text: "`2` et `-3` : la conversion arrondit vers le bas", correct: false}
      - {text: "`3` et `-2` : la conversion arrondit vers le haut", correct: false}
    answer: "`2` et `-2` : la conversion tronque vers zéro ; pour arrondir, `int(math.Round(x))`. Écrite avec la constante, `int(2.9)` ne compilerait pas : une constante doit tenir exactement dans le type."
  - key: moyenne
    format: course
    question: Pourquoi `float64(somme / n)` donne-t-il une moyenne fausse avec deux entiers ?
    choices:
      - {text: "La division entière a lieu avant la conversion : il faut convertir les opérandes", correct: true}
      - {text: "`float64` arrondit le résultat à l'entier le plus proche : il faut `math.Round`", correct: false}
      - {text: "`float64` manque de précision pour une moyenne : il faut passer par `big.Float`", correct: false}
      - {text: "La conversion échoue en silence et renvoie 0 dès que `n` est un `int`", correct: false}
    answer: "La division entière a lieu avant la conversion et tronque le résultat ; il faut convertir les opérandes : `float64(somme) / float64(n)`."
  - key: vf-int-int64
    format: true-false
    question: Une variable `int` s'affecte directement à une variable `int64`.
    truth: false
    answer: Ce sont deux types distincts ; il faut `int64(i)`.
  - key: vf-constante
    format: true-false
    question: '`const delai = 5` puis `time.Sleep(delai * time.Second)` compile.'
    truth: true
    answer: Une constante non typée prend le type que le contexte demande, ici `time.Duration`.
  - key: vf-depassement
    format: true-false
    question: Convertir `int` vers `int8` une valeur trop grande provoque une panique.
    truth: false
    answer: Les bits de poids fort sont perdus silencieusement ; il faut vérifier la plage soi-même.
  - key: vf-modulo
    format: true-false
    question: En Go, `-7 % 3` vaut `-1`.
    truth: true
    answer: Le reste a le signe du dividende ; la division est tronquée vers zéro.
  - key: qcm-compile
    format: multiple-choice
    question: "Avec `var i int = 3` et `var f float64 = 1.5`, laquelle de ces lignes compile ?"
    choices:
      - {text: "`g := f + float64(i)`", correct: true}
      - {text: "`g := f + i`", correct: false}
      - {text: "`g := float64(i + f)`", correct: false}
      - {text: "`var g float64 = i`", correct: false}
    answer: "Les deux opérandes d'une opération doivent avoir le même type, et Go ne convertit jamais une variable implicitement : on écrit `float64(i)` (ou `int(f) + i`, qui tronque `f`)."
  - key: qcm-moyenne
    format: multiple-choice
    question: Avec `somme, n := 7, 2` (des int), quelle expression donne 3.5 ?
    choices:
      - text: '`float64(somme) / float64(n)`'
        correct: true
      - text: '`float64(somme / n)`'
        correct: false
      - text: '`somme / n`'
        correct: false
      - text: '`float64(somme) / n`'
        correct: false
    answer: La dernière ne compile pas (float64 et int) ; les deux autres font une division entière.
  - key: qcm-arrondi
    format: multiple-choice
    question: Comment obtenir l'entier le plus proche de `x := 2.6` ?
    choices:
      - text: '`int(math.Round(x))`'
        correct: true
      - text: '`int(x)`'
        correct: false
      - text: '`math.Floor(x)` seul, sans conversion'
        correct: false
      - text: '`round(x)`'
        correct: false
    answer: '`int(x)` tronque (2) ; `math.Round` arrondit (3.0), puis on convertit.'
  - key: trous-conversion
    format: fill-in
    question: |-
      Complète pour calculer une moyenne flottante :
      ```go
      moyenne := ___(total) / ___(len(notes))
      ```
    blanks:
      - - float64
      - - float64
    answer: On convertit chaque opérande avant de diviser.
  - key: trous-int64
    format: fill-in
    question: |-
      Complète pour passer un `int` à une fonction qui attend un `int64` :
      ```go
      enregistrer(___(n))
      ```
    blanks:
      - - int64
    answer: La conversion explicite `int64(n)`.
  - key: trous-arrondi
    format: fill-in
    question: |-
      Complète pour arrondir avant de convertir :
      ```go
      euros := int(math.___(montant))
      ```
    blanks:
      - - Round
    answer: '`math.Round` arrondit au plus proche ; `int` seul tronquerait.'
  - key: trous-itoa
    format: fill-in
    question: |-
      Complète pour obtenir le texte "42" à partir de l'entier 42 :
      ```go
      texte := strconv.___(42)
      ```
    blanks:
      - - Itoa
    answer: '`string(42)` donnerait le caractère `*`, pas le texte du nombre.'
  - key: code-tronquer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      f := 2.9
      fmt.Println(int(f), int(-f))
      ```
    choices:
      - {text: "`2 -2`", correct: true}
      - {text: "`3 -3`", correct: false}
      - {text: "`2 -3`", correct: false}
      - {text: "`3 -2`", correct: false}
    answer: "`2 -2` : la conversion d'un flottant en entier tronque vers zéro, dans les deux sens ; elle n'arrondit pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tf := 2.9\n\tfmt.Println(int(f), int(-f))\n}\n"
      output: 2 -2
  - key: code-moyenne
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      somme, n := 7, 2
      fmt.Println(float64(somme/n), float64(somme)/float64(n))
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3.5 3.5`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`3.0 3.5`", correct: false}
    answer: "`3 3.5` : la première division est entière, faite avant la conversion. `Println` affiche le `float64` 3 sans décimale."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsomme, n := 7, 2\n\tfmt.Println(float64(somme/n), float64(somme)/float64(n))\n}\n"
      output: 3 3.5
  - key: code-int8
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 200
      fmt.Println(int8(x), uint8(x))
      ```
    choices:
      - {text: "`-56 200`", correct: true}
      - {text: "`127 200`", correct: false}
      - {text: "`200 200`", correct: false}
      - {text: "Une panic : 200 dépasse la plage d'un `int8`", correct: false}
    answer: "`-56 200` : convertir vers un type plus petit garde les 8 bits de poids faible, réinterprétés selon le signe (200 - 256 = -56). Rien ne sature ni ne panique."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 200\n\tfmt.Println(int8(x), uint8(x))\n}\n"
      output: "-56 200"
  - key: bug-moyenne
    format: bug-fix
    question: |-
      La note moyenne affichée est toujours un nombre entier. Quelle correction est la bonne ?
      ```go
      func moyenne(notes []int) float64 {
      	total := 0
      	for _, n := range notes {
      		total += n
      	}
      	return float64(total / len(notes))
      }
      ```
    choices:
      - {text: "Convertir avant de diviser : `float64(total) / float64(len(notes))`", correct: true}
      - {text: "Arrondir le résultat : `math.Round(float64(total / len(notes)))`", correct: false}
      - {text: "Déclarer `total := 0.0`, en gardant `float64(total / len(notes))`", correct: false}
      - {text: "Renvoyer un `float32`, plus adapté que `float64` aux petites notes", correct: false}
    answer: |-
      ```go
      return float64(total) / float64(len(notes))
      ```
      La division entière tronquait le résultat avant la conversion : on convertit les opérandes, pas le quotient. Avec `total := 0.0`, `total += n` ne compilerait plus.
  - key: bug-mismatched
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: prix * quantite (mismatched types float64 and int) ». Quelle correction est la bonne ?
      ```go
      total := prix * quantite
      ```
    choices:
      - {text: "Convertir explicitement : `total := prix * float64(quantite)`", correct: true}
      - {text: "Typer le résultat : `var total float64 = prix * quantite`", correct: false}
      - {text: "Convertir le prix : `total := int(prix) * quantite`", correct: false}
      - {text: "Parenthéser : `total := (prix) * (quantite)`", correct: false}
    answer: |-
      ```go
      total := prix * float64(quantite)
      ```
      Les deux opérandes doivent avoir le même type : on convertit explicitement. Convertir le prix en `int` compilerait, mais perdrait ses centimes.
  - key: bug-itoa
    format: bug-fix
    question: |-
      Le message affiche « Commande n°* » au lieu de « Commande n°42 ». Quelle correction est la bonne ?
      ```go
      msg := "Commande n°" + string(numero) // numero vaut 42
      ```
    choices:
      - {text: "`strconv.Itoa(numero)`, ou `fmt.Sprintf(\"Commande n°%d\", numero)`", correct: true}
      - {text: "`string(rune(numero))`, qui convertit l'entier en son texte", correct: false}
      - {text: "`string([]byte{byte(numero)})`, qui garde chaque chiffre", correct: false}
      - {text: "`numero.String()`, la méthode de conversion des entiers", correct: false}
    answer: |-
      ```go
      msg := "Commande n°" + strconv.Itoa(numero)
      // ou fmt.Sprintf("Commande n°%d", numero)
      ```
      `string(42)` donne le caractère de point de code 42 (`*`), tout comme `string(rune(42))` ; `go vet` le signale. Un `int` n'a pas de méthode `String()`.
  - key: bug-plage
    format: bug-fix
    question: |-
      Un âge de 300 lu dans un formulaire devient 44 en base. Quelle correction est la bonne ?
      ```go
      age := uint8(valeurSaisie) // valeurSaisie est un int
      ```
    choices:
      - {text: "Vérifier la plage de `valeurSaisie` avant de convertir, et renvoyer une erreur", correct: true}
      - {text: "Convertir en `int8` plutôt qu'en `uint8`, pour garder le signe de la valeur", correct: false}
      - {text: "Rattraper la panic de dépassement avec `recover` autour de la conversion", correct: false}
      - {text: "Convertir en deux temps, `uint8(uint16(valeurSaisie))`, sans troncature", correct: false}
    answer: |-
      ```go
      if valeurSaisie < 0 || valeurSaisie > 150 {
      	return fmt.Errorf("âge invalide : %d", valeurSaisie)
      }
      age := uint8(valeurSaisie)
      ```
      La conversion coupe les bits sans erreur ni panic (300 mod 256 = 44) : on vérifie la plage avant de convertir.
