notion: declaration-variables
lesson: |-
  Trois façons de déclarer une variable :

  ```go
  var total int          // type explicite, valeur zéro (0)
  var nom = "Ada"        // type déduit de la valeur (string)
  age := 36              // déclaration courte : seulement dans une fonction
  var x, y = 1, 2        // plusieurs à la fois
  a, err := f()          // très courant avec les retours multiples
  ```

  - `:=` **déclare et initialise** ; il n'existe que dans le corps d'une fonction. Au niveau du package, on écrit `var`.
  - `:=` exige qu'**au moins une** variable à gauche soit nouvelle ; les autres sont simplement réaffectées (d'où
    `a, err := f()` puis `b, err := g()`).
  - Une variable **locale** déclarée et jamais lue est une **erreur de compilation** (« declared and not used »). Les
    variables de package, elles, sont permises.
  - `var` sans valeur donne la **valeur zéro** du type ; on l'utilise quand la valeur viendra plus tard, ou pour dire
    explicitement « zéro ».
  - Un bloc `var ( ... )` regroupe des déclarations.

  **Piège classique** : écrire `x := 5` au niveau du package. Le compilateur répond « syntax error: non-declaration
  statement outside function body ».

  **En entretien** : « `:=` dans les fonctions, `var` partout et quand on veut la valeur zéro ; une variable locale
  inutilisée ne compile pas. »
tour:
  - title: Déclarer des variables
    text: |-
      Go déclare une variable de deux façons. `var nom type = valeur` est la forme complète : le type ou la valeur peut
      manquer, mais pas les deux. Dans une fonction, on écrit le plus souvent `nom := valeur`, et Go **déduit le type**
      de la valeur.

      `:=` déclare *et* initialise. Il ne sert qu'à l'intérieur d'une fonction, et au moins une des variables à sa
      gauche doit être nouvelle. Pour changer la valeur d'une variable qui existe déjà, on écrit `=`.

      On déclare plusieurs variables d'un coup : `x, y := 3, 4`, ou un bloc `var ( … )`.

      Essaie : ajoute la ligne `langage = 42` dans `main`. Le compilateur refuse : une variable garde le type de sa
      déclaration.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          var version = "1.27"

          func main() {
          	var annee int = 2009
          	langage := "Go"
          	x, y := 3, 4
          	var (
          		actif bool = true
          		ratio float64
          	)
          	fmt.Println(langage, version, annee)
          	fmt.Println(x+y, actif, ratio)
          }
      output: |-
        Go 1.27 2009
        7 true 0
    task:
      instructions: |-
        Échange les valeurs de `a` et de `b` en **une seule** affectation, `a, b = b, a`, avant de les afficher : le
        programme doit afficher `2 1`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	a, b := 1, 2
          	fmt.Println(a, b)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	a, b := 1, 2
          	a, b = b, a
          	fmt.Println(a, b)
          }
      output: |-
        2 1
cards:
  - key: var-vs
    format: course
    question: "Quelle différence entre `var` et `:=` ?"
    choices:
      - {text: "`var` marche partout et peut omettre la valeur ; `:=` seulement dans une fonction", correct: true}
      - {text: "`:=` marche partout ; `var` est réservé aux variables du package", correct: false}
      - {text: "`var` déclare une variable modifiable, `:=` une variable non modifiable", correct: false}
      - {text: "Aucune : `:=` est un raccourci permis partout où `var` l'est", correct: false}
    answer: "`var` fonctionne partout et permet de ne pas initialiser ; `:=` n'existe que dans une fonction, et déclare et initialise avec inférence du type. Les deux donnent une variable modifiable."
  - key: passe-avec-variable-locale-non-utilisee
    format: course
    question: "Que se passe-t-il quand une variable locale est déclarée mais jamais lue ?"
    choices:
      - {text: "Le code ne compile pas, comme avec un import inutilisé", correct: true}
      - {text: "Le compilateur affiche un avertissement, mais compile", correct: false}
      - {text: "Rien : le compilateur la retire en optimisant le code", correct: false}
      - {text: "`go vet` la signale, mais le compilateur l'accepte", correct: false}
    answer: "Le code ne compile pas (« declared and not used »), comme avec un import inutilisé. Go n'a pas d'avertissements : c'est une erreur ou rien."
  - key: declarations-sont-valides-hors-fonction-niveau
    format: multiple-choice
    question: "Laquelle de ces lignes compile hors d'une fonction, au niveau du package ?"
    choices:
      - {text: "`var x = 1`", correct: true}
      - {text: "`x := 1`", correct: false}
      - {text: "`x = 1`", correct: false}
      - {text: "`int x = 1`", correct: false}
    answer: "La déclaration courte `:=` n'existe qu'à l'intérieur d'une fonction. Au niveau du package, toute déclaration commence par un mot-clé (`var`, `const`, `type`, `func`), et une simple affectation n'y est pas permise."
  - key: code-code-compile-x-1-puis
    format: code-output
    question: "Qu'affiche un programme dont la fonction `main` ne contient que `x := 1` ?"
    choices:
      - {text: "Ça ne compile pas : `declared and not used: x`", correct: true}
      - {text: "Rien : le programme compile et ne fait rien", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Il compile, avec un avertissement sur `x`", correct: false}
    answer: "Ça ne compile pas : une variable locale déclarée et jamais lue est une erreur, `declared and not used: x`."
    check:
      code: "package main\n\nfunc main() {\n\tx := 1\n}\n"
      compiles: false
  - key: au-moins-une-nouvelle
    format: course
    question: Que faut-il pour que `a, err := g()` compile alors que `err` existe déjà ?
    choices:
      - {text: "Qu'au moins une variable de gauche soit nouvelle, ici `a`", correct: true}
      - {text: "Que `err` ait été déclarée dans le même bloc que la ligne", correct: false}
      - {text: "Rien : `:=` réaffecte toujours les variables qui existent", correct: false}
      - {text: "Qu'on écrive `a, var err := g()` pour réutiliser `err`", correct: false}
    answer: "Qu'au moins une variable de gauche soit nouvelle (ici `a`) ; `err` est alors simplement réaffectée si elle est du même bloc. Sans aucune nouvelle variable, `:=` ne compile pas."
  - key: quand-var
    format: course
    question: Quand préférer `var x T` à `x := ...` ?
    choices:
      - {text: "Au niveau du package, et pour partir de la valeur zéro : `var mu sync.Mutex`", correct: true}
      - {text: "Toujours : les conventions de Go déconseillent `:=` dans le code de production", correct: false}
      - {text: "Pour une variable qu'on ne modifiera plus, puisque `var` la rend constante", correct: false}
      - {text: "Pour les types de base, `:=` étant réservé aux structs et aux slices", correct: false}
    answer: "Au niveau du package (où `:=` est interdit), et quand on veut la valeur zéro sans valeur initiale explicite (`var total int`, `var mu sync.Mutex`). Pour une valeur constante, c'est `const`."
  - key: vf-package
    format: true-false
    question: La déclaration courte `:=` est permise au niveau du package.
    truth: false
    answer: Au niveau du package, il faut `var` (ou `const`).
  - key: vf-inutilisee
    format: true-false
    question: Une variable locale déclarée mais jamais lue empêche la compilation.
    truth: true
    answer: « declared and not used » ; on la supprime, ou on l'affecte à `_` si c'est voulu.
  - key: vf-package-inutilisee
    format: true-false
    question: Une variable de package jamais utilisée empêche aussi la compilation.
    truth: false
    answer: La règle ne vise que les variables locales.
  - key: vf-redeclarer
    format: true-false
    question: '`x := 1` suivi de `x := 2` dans le même bloc compile.'
    truth: false
    answer: « no new variables on left side of := » ; il faut `x = 2`.
  - key: qcm-valides-fonction
    format: multiple-choice
    question: "Lesquelles de ces déclarations sont valides dans le corps d'une fonction ?"
    choices:
      - text: '`n := 10`'
        correct: true
      - text: '`var n int = 10`'
        correct: true
      - text: '`int n = 10`'
        correct: false
      - text: '`let n = 10`'
        correct: false
    answer: Le type se place après le nom, et `:=` ou `var` introduisent la variable.
  - key: qcm-type-deduit
    format: multiple-choice
    question: Quel est le type de `x` dans `x := 3.0` ?
    choices:
      - text: '`float64`'
        correct: true
      - text: '`float32`'
        correct: false
      - text: '`int`'
        correct: false
      - text: Une constante non typée
        correct: false
    answer: Une constante flottante non typée donne `float64` par défaut à une variable.
  - key: qcm-multiples
    format: multiple-choice
    question: Après `a, b := 1, 2` puis `a, b = b, a`, que valent `a` et `b` ?
    choices:
      - text: '`a == 2` et `b == 1`'
        correct: true
      - text: '`a == 2` et `b == 2`'
        correct: false
      - text: '`a == 1` et `b == 2`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: L'affectation multiple évalue d'abord toutes les valeurs de droite, ce qui permet l'échange sans variable temporaire.
  - key: trous-courte
    format: fill-in
    question: |-
      Complète pour déclarer et initialiser `age` dans une fonction :
      ```go
      age ___ 36
      ```
    blanks:
      - - :=
    answer: La déclaration courte déclare et initialise.
  - key: trous-var
    format: fill-in
    question: |-
      Complète pour déclarer au niveau du package une variable entière à zéro :
      ```go
      ___ compteur ___
      ```
    blanks:
      - - var
      - - int
    answer: '`var nom type` ; la valeur zéro est 0.'
  - key: trous-bloc
    format: fill-in
    question: |-
      Complète le bloc de déclarations :
      ```go
      var ___
      	hote = "localhost"
      	port = 8080
      ___
      ```
    blanks:
      - - (
      - - )
    answer: Un bloc `var ( ... )` regroupe plusieurs déclarations.
  - key: trous-echange
    format: fill-in
    question: |-
      Complète pour échanger `a` et `b` en une ligne :
      ```go
      a, b = ___, ___
      ```
    blanks:
      - - b
      - - a
    answer: Les valeurs de droite sont évaluées avant l'affectation.
  - key: code-echange
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a, b := 1, 2
      a, b = b, a
      fmt.Println(a, b)
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`2 1` : les valeurs de droite sont évaluées avant l'affectation, l'affectation multiple échange donc les valeurs sans variable temporaire."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 1, 2\n\ta, b = b, a\n\tfmt.Println(a, b)\n}\n"
      output: 2 1
  - key: code-type-deduit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 3.0
      y := 3
      fmt.Printf("%T %T\n", x, y)
      ```
    choices:
      - {text: "`float64 int`", correct: true}
      - {text: "`float32 int`", correct: false}
      - {text: "`float64 int64`", correct: false}
      - {text: "`float64 float64`", correct: false}
    answer: "`float64 int` : les types par défaut des constantes flottantes et entières. `int` vaut 64 bits sur une machine 64 bits, mais reste un type distinct d'`int64`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 3.0\n\ty := 3\n\tfmt.Printf(\"%T %T\\n\", x, y)\n}\n"
      output: float64 int
  - key: code-pas-nouvelle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 1
      x := 2
      fmt.Println(x)
      ```
    choices:
      - {text: "Ça ne compile pas : `no new variables on left side of :=`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Une panic : `x` est déclarée deux fois", correct: false}
    answer: "Ça ne compile pas : « no new variables on left side of := ». Dans le même bloc, on réaffecte avec `x = 2`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tx := 2\n\tfmt.Println(x)\n}\n"
      compiles: false
  - key: bug-package-courte
    format: bug-fix
    question: |-
      Le compilateur signale « non-declaration statement outside function body ». Quelle correction est la bonne ?
      ```go
      package main

      seuil := 100

      func main() { ... }
      ```
    choices:
      - {text: "`var seuil = 100` : `:=` n'existe que dans une fonction", correct: true}
      - {text: "`seuil = 100` : hors d'une fonction, on affecte sans `:`", correct: false}
      - {text: "`int seuil = 100` : hors d'une fonction, le type est requis", correct: false}
      - {text: "Déplacer `seuil := 100` dans une fonction `init()`", correct: false}
    answer: |-
      ```go
      var seuil = 100
      ```
      `:=` n'existe que dans une fonction ; au niveau du package, on écrit `var` (ou `const` pour une constante). Dans `init()`, `seuil` deviendrait une variable locale, invisible de `main`.
  - key: bug-inutilisee
    format: bug-fix
    question: |-
      Le compilateur signale « declared and not used: n ». Quelle correction est la bonne ?
      ```go
      n, err := fmt.Sscan(entree, &valeur)
      if err != nil {
      	return err
      }
      ```
    choices:
      - {text: "Ignorer le nombre lu avec l'identifiant blanc : `_, err := ...`", correct: true}
      - {text: "Ignorer l'erreur à la place : `n, _ := fmt.Sscan(...)`", correct: false}
      - {text: "Déclarer `var n int` avant la ligne, pour que `n` existe déjà", correct: false}
      - {text: "Ajouter un commentaire `//nolint` au-dessus de la ligne", correct: false}
    answer: |-
      ```go
      _, err := fmt.Sscan(entree, &valeur)
      ```
      On ignore explicitement la valeur dont on n'a pas besoin avec l'identifiant blanc. Déclarer `n` avant ne la rend pas plus lue, et un commentaire ne change rien au compilateur.
  - key: bug-redeclarer
    format: bug-fix
    question: |-
      Le compilateur signale « declared and not used: total ». Quelle correction est la bonne ?
      ```go
      total := 0
      for _, p := range prix {
      	total := total + p
      }
      ```
    choices:
      - {text: "Réaffecter avec `total += p`, au lieu de redéclarer avec `:=`", correct: true}
      - {text: "Renommer la variable de la boucle : `somme := total + p`", correct: false}
      - {text: "Déclarer `var total int` avant la boucle, au lieu de `:=`", correct: false}
      - {text: "Ajouter `_ = total` dans la boucle, pour lire la variable", correct: false}
    answer: |-
      ```go
      total := 0
      for _, p := range prix {
      	total += p
      }
      ```
      Le `:=` de la boucle crée une nouvelle variable `total`, qui masque l'autre et n'est jamais lue : d'où l'erreur. La faire taire avec `_ = total` laisserait le total à 0 : il faut réaffecter, pas redéclarer.
  - key: bug-type-c
    format: bug-fix
    question: |-
      Un développeur venant de C écrit cette ligne, qui ne compile pas. Quelle correction est la bonne ?
      ```go
      int compteur = 0
      ```
    choices:
      - {text: "`compteur := 0`, ou `var compteur int`", correct: true}
      - {text: "`int compteur := 0`", correct: false}
      - {text: "`var int compteur = 0`", correct: false}
      - {text: "`compteur int = 0`", correct: false}
    answer: |-
      ```go
      compteur := 0
      // ou
      var compteur int
      ```
      En Go, le nom précède le type, et la déclaration commence par `var` (ou utilise `:=`).
