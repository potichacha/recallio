notion: declaration-variables
lesson: |-
  Trois façons de déclarer une variable :

  ```go
  var total int          // type explicite, valeur zéro (0)
  var nom = "Ada"        // type déduit de la valeur (string)
  age := 36              // déclaration courte : seulement dans une fonction
  var x, y = 1, 2        // plusieurs à la fois
  a, err := f()          // très courant avec les retours multiples
  ```

  - `:=` **déclare et initialise** ; il n'existe que dans le corps d'une fonction. Au niveau du package, on écrit `var`.
  - `:=` exige qu'**au moins une** variable à gauche soit nouvelle ; les autres sont simplement réaffectées (d'où
    `a, err := f()` puis `b, err := g()`).
  - Une variable **locale** déclarée et jamais lue est une **erreur de compilation** (« declared and not used »). Les
    variables de package, elles, sont permises.
  - `var` sans valeur donne la **valeur zéro** du type ; on l'utilise quand la valeur viendra plus tard, ou pour dire
    explicitement « zéro ».
  - Un bloc `var ( ... )` regroupe des déclarations.

  **Piège classique** : écrire `x := 5` au niveau du package. Le compilateur répond « syntax error: non-declaration
  statement outside function body ».

  **En entretien** : « `:=` dans les fonctions, `var` partout et quand on veut la valeur zéro ; une variable locale
  inutilisée ne compile pas. »
cards:
  - key: var-vs
    format: course
    question: '`var` vs `:=` ?'
    answer: '`var` fonctionne partout et permet de ne pas initialiser ; `:=` uniquement dans une fonction, déclare et initialise avec inférence.'
  - key: passe-avec-variable-locale-non-utilisee
    format: course
    question: Que se passe-t-il avec une variable locale non utilisée ?
    answer: Erreur de compilation, comme un import inutilisé.
  - key: declarations-sont-valides-hors-fonction-niveau
    format: multiple-choice
    question: Quelles déclarations sont valides hors d'une fonction, au niveau du package ?
    choices:
      - text: '`var x = 1`'
        correct: true
      - text: '`x := 1`'
        correct: false
      - text: '`const y = 2`'
        correct: true
      - text: '`x = 1`'
        correct: false
    answer: La déclaration courte `:=` n'existe qu'à l'intérieur d'une fonction. Au niveau du package, toute déclaration commence par un mot-clé (`var`, `const`, `type`, `func`), et une simple affectation n'y est pas permise.
  - key: code-code-compile-x-1-puis
    format: code-output
    question: Ce code compile-t-il ? `x := 1` puis plus rien n'utilise x.
    answer: 'Non : `declared and not used`.'
    check:
      code: "package main\n\nfunc main() {\n\tx := 1\n}\n"
      compiles: false
  - key: au-moins-une-nouvelle
    format: course
    question: Que faut-il pour que `a, err := g()` compile alors que `err` existe déjà ?
    answer: Qu'au moins une variable de gauche soit nouvelle (ici `a`) ; `err` est alors simplement réaffectée.
  - key: quand-var
    format: course
    question: Quand préférer `var x T` à `x := ...` ?
    answer: Au niveau du package (où `:=` est interdit), et quand on veut la valeur zéro sans valeur initiale explicite (`var total int`, `var mu sync.Mutex`).
  - key: vf-package
    format: true-false
    question: La déclaration courte `:=` est permise au niveau du package.
    truth: false
    answer: Au niveau du package, il faut `var` (ou `const`).
  - key: vf-inutilisee
    format: true-false
    question: Une variable locale déclarée mais jamais lue empêche la compilation.
    truth: true
    answer: « declared and not used » ; on la supprime, ou on l'affecte à `_` si c'est voulu.
  - key: vf-package-inutilisee
    format: true-false
    question: Une variable de package jamais utilisée empêche aussi la compilation.
    truth: false
    answer: La règle ne vise que les variables locales.
  - key: vf-redeclarer
    format: true-false
    question: '`x := 1` suivi de `x := 2` dans le même bloc compile.'
    truth: false
    answer: « no new variables on left side of := » ; il faut `x = 2`.
  - key: qcm-valides-fonction
    format: multiple-choice
    question: Quelles déclarations sont valides dans le corps d'une fonction ?
    choices:
      - text: '`n := 10`'
        correct: true
      - text: '`var n int = 10`'
        correct: true
      - text: '`int n = 10`'
        correct: false
      - text: '`let n = 10`'
        correct: false
    answer: Le type se place après le nom, et `:=` ou `var` introduisent la variable.
  - key: qcm-type-deduit
    format: multiple-choice
    question: Quel est le type de `x` dans `x := 3.0` ?
    choices:
      - text: '`float64`'
        correct: true
      - text: '`float32`'
        correct: false
      - text: '`int`'
        correct: false
      - text: Une constante non typée
        correct: false
    answer: Une constante flottante non typée donne `float64` par défaut à une variable.
  - key: qcm-multiples
    format: multiple-choice
    question: Après `a, b := 1, 2` puis `a, b = b, a`, que valent `a` et `b` ?
    choices:
      - text: '`a == 2` et `b == 1`'
        correct: true
      - text: '`a == 2` et `b == 2`'
        correct: false
      - text: '`a == 1` et `b == 2`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: L'affectation multiple évalue d'abord toutes les valeurs de droite, ce qui permet l'échange sans variable temporaire.
  - key: trous-courte
    format: fill-in
    question: |-
      Complétez pour déclarer et initialiser `age` dans une fonction :
      ```go
      age ___ 36
      ```
    blanks:
      - - :=
    answer: La déclaration courte déclare et initialise.
  - key: trous-var
    format: fill-in
    question: |-
      Complétez pour déclarer au niveau du package une variable entière à zéro :
      ```go
      ___ compteur ___
      ```
    blanks:
      - - var
      - - int
    answer: '`var nom type` ; la valeur zéro est 0.'
  - key: trous-bloc
    format: fill-in
    question: "Complétez le bloc de déclarations :\n```go\nvar ___\n\thote = \"localhost\"\n\tport = 8080\n___\n```"
    blanks:
      - - (
      - - )
    answer: Un bloc `var ( ... )` regroupe plusieurs déclarations.
  - key: trous-echange
    format: fill-in
    question: |-
      Complétez pour échanger `a` et `b` en une ligne :
      ```go
      a, b = ___, ___
      ```
    blanks:
      - - b
      - - a
    answer: Les valeurs de droite sont évaluées avant l'affectation.
  - key: code-echange
    format: code-output
    question: |-
      ```go
      a, b := 1, 2
      a, b = b, a
      fmt.Println(a, b)
      ```
    answer: '`2 1` : l''affectation multiple échange les valeurs.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := 1, 2\n\ta, b = b, a\n\tfmt.Println(a, b)\n}\n"
      output: 2 1
  - key: code-type-deduit
    format: code-output
    question: |-
      ```go
      x := 3.0
      y := 3
      fmt.Printf("%T %T\n", x, y)
      ```
    answer: '`float64 int` : les types par défaut des constantes flottantes et entières.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 3.0\n\ty := 3\n\tfmt.Printf(\"%T %T\\n\", x, y)\n}\n"
      output: float64 int
  - key: code-pas-nouvelle
    format: code-output
    question: |-
      ```go
      x := 1
      x := 2
      fmt.Println(x)
      ```
    answer: 'Rien : « no new variables on left side of := », le code ne compile pas.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tx := 2\n\tfmt.Println(x)\n}\n"
      compiles: false
  - key: bug-package-courte
    format: bug-fix
    question: |-
      Le compilateur signale « non-declaration statement outside function body » :
      ```go
      package main

      seuil := 100

      func main() { ... }
      ```
    answer: |-
      ```go
      var seuil = 100
      ```
      `:=` n'existe que dans une fonction ; au niveau du package, on écrit `var` (ou `const` pour une constante).
  - key: bug-inutilisee
    format: bug-fix
    question: "Le compilateur signale « declared and not used: n » :\n```go\nn, err := fmt.Sscan(entree, &valeur)\nif err != nil {\n\treturn err\n}\n```"
    answer: |-
      ```go
      _, err := fmt.Sscan(entree, &valeur)
      ```
      On ignore explicitement la valeur dont on n'a pas besoin avec l'identifiant blanc.
  - key: bug-redeclarer
    format: bug-fix
    question: "Le compilateur signale « no new variables on left side of := » :\n```go\ntotal := 0\nfor _, p := range prix {\n\ttotal := total + p\n}\n```"
    answer: "```go\ntotal := 0\nfor _, p := range prix {\n\ttotal += p\n}\n```\nIci l'erreur n'apparaît pas (le `:=` de la boucle crée une nouvelle variable qui masque `total`), mais le total reste\n0 : il faut réaffecter avec `=` ou `+=`, pas redéclarer."
  - key: bug-type-c
    format: bug-fix
    question: |-
      Un développeur venant de C écrit :
      ```go
      int compteur = 0
      ```
    answer: |-
      ```go
      compteur := 0
      // ou
      var compteur int
      ```
      En Go, le nom précède le type, et la déclaration commence par `var` (ou utilise `:=`).
