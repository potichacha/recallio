notion: range
lesson: |-
  `range` parcourt une collection et donne, selon le type :

  | Sur | Première valeur | Seconde valeur |
  |---|---|---|
  | tableau, slice | indice | **copie** de l'élément |
  | chaîne | indice de l'**octet** de début | la **rune** (caractère) |
  | map | clé | valeur (ordre **aléatoire**) |
  | channel | élément reçu | — (jusqu'à la fermeture) |
  | entier n (Go 1.22) | 0 à n-1 | — |
  | fonction itérateur (Go 1.23) | selon `iter.Seq` / `iter.Seq2` | |

  ```go
  for i, v := range []string{"a", "b"} { }  // 0 a, 1 b
  for i, r := range "héllo" { }              // 0 h, 1 é, 3 l...
  for k, v := range m { }                    // ordre non garanti
  for v := range ch { }                      // jusqu'à close(ch)
  ```

  Une seule variable donne l'indice (ou la clé) : `for i := range xs`. Pour la valeur seule : `for _, v := range xs`.

  À savoir :
  - l'expression est évaluée **une fois** au début : pour un slice, la longueur est fixée au départ ;
  - la valeur est une **copie** : la modifier ne change pas la collection ;
  - pour une chaîne, l'indice saute de plusieurs octets sur un caractère non ASCII ;
  - **supprimer** des clés d'une map pendant un range est permis ; en ajouter donne un résultat imprévisible.

  **Piège classique** : afficher une map avec range dans un test qui attend un ordre. L'ordre change d'une exécution à
  l'autre ; on trie les clés (`slices.Sorted(maps.Keys(m))`).

  **En entretien** : « range donne indice et copie pour un slice, octet et rune pour une chaîne, clé et valeur en ordre
  aléatoire pour une map, et reçoit jusqu'à la fermeture pour un channel. »
tour:
  - title: Parcourir avec range
    text: |-
      `for … range` parcourt une collection, et donne deux valeurs à chaque tour :

      - sur une slice ou un tableau, l'**indice** et une **copie** de l'élément ;
      - sur une chaîne, la position en octets et la **rune** (le caractère) ;
      - sur une map, la clé et la valeur, dans un ordre qui change d'une exécution à l'autre.

      On ignore l'indice avec `_`, ou on ne garde que lui : `for i := range xs`. Les slices et les maps ont leur
      chapitre un peu plus loin : ici, `[]string{…}` est simplement une liste de chaînes.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	langages := []string{"Go", "Java", "Rust"}
          	for i, nom := range langages {
          		fmt.Println(i, nom)
          	}

          	for position, r := range "été" {
          		fmt.Println(position, string(r))
          	}
          }
      output: |-
        0 Go
        1 Java
        2 Rust
        0 é
        2 t
        3 é
    task:
      instructions: |-
        Avec `range`, calcule la somme de `notes` : le programme doit afficher `somme : 47`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 20}
          	somme := 0
          	fmt.Println("somme :", somme, len(notes))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 20}
          	somme := 0
          	for _, note := range notes {
          		somme += note
          	}
          	fmt.Println("somme :", somme)
          }
      output: |-
        somme : 47
cards:
  - key: chaine
    format: course
    question: Que donne `range` sur une chaîne ?
    choices:
      - {text: "L'indice de l'octet où commence chaque caractère, et la rune elle-même", correct: true}
      - {text: "L'indice du caractère (0, 1, 2...) et l'octet à cette position", correct: false}
      - {text: "L'indice de chaque octet et cet octet, un octet par tour", correct: false}
      - {text: "Le caractère seul, sous forme de chaîne d'une lettre", correct: false}
    answer: "L'indice de l'octet où commence chaque caractère et la rune elle-même ; l'indice saute de 2 à 4 octets sur un caractère non ASCII."
  - key: une-variable
    format: course
    question: Que donne `for i := range xs` avec une seule variable ?
    choices:
      - {text: "Seulement l'indice (ou la clé pour une map)", correct: true}
      - {text: "Seulement la valeur, comme un for-each en Java", correct: false}
      - {text: "Une paire indice et valeur, réunies dans une struct", correct: false}
      - {text: "Rien : `range` exige deux variables, ou `_`", correct: false}
    answer: "Seulement l'indice (ou la clé pour une map) ; la valeur n'est pas copiée. Pour la valeur seule, on écrit `for _, v := range xs`."
  - key: evaluation
    format: course
    question: "Si l'on ajoute des éléments à une slice pendant qu'on la parcourt avec `range`, sont-ils parcourus ?"
    choices:
      - {text: "Non : la longueur parcourue est celle du départ", correct: true}
      - {text: "Oui : `range` relit la longueur à chaque tour", correct: false}
      - {text: "Non : le programme panique dès qu'on modifie la slice", correct: false}
      - {text: "Oui, et la boucle ne finit pas si l'on ajoute à chaque tour", correct: false}
    answer: "Non : l'expression est évaluée une fois au début, et la longueur parcourue est celle du départ. Pas de `ConcurrentModificationException` comme en Java."
  - key: suppression-map
    format: course
    question: "Peut-on supprimer des clés d'une map pendant un `range` sur elle ?"
    choices:
      - {text: "Oui : une clé supprimée avant d'être atteinte n'est pas parcourue", correct: true}
      - {text: "Non : le programme panique, comme une `ConcurrentModificationException`", correct: false}
      - {text: "Non : le compilateur refuse un `delete` dans une boucle `range`", correct: false}
      - {text: "Oui, mais les clés supprimées sont quand même parcourues ensuite", correct: false}
    answer: "Oui, c'est permis : une clé supprimée avant d'être atteinte n'est pas parcourue. En ajouter donne un résultat imprévisible : la nouvelle clé peut être parcourue ou non."
  - key: vf-ordre-map
    format: true-false
    question: '`range` sur une map parcourt les clés dans l''ordre d''insertion.'
    truth: false
    answer: L'ordre est volontairement aléatoire et change d'une exécution à l'autre.
  - key: vf-copie
    format: true-false
    question: Modifier la valeur `v` de `for _, v := range xs` modifie `xs`.
    truth: false
    answer: '`v` est une copie ; on écrit `xs[i]`.'
  - key: vf-channel
    format: true-false
    question: '`for v := range ch` s''arrête quand le channel est fermé et vidé.'
    truth: true
    answer: Sans fermeture, la boucle attend indéfiniment.
  - key: vf-rune
    format: true-false
    question: Dans `for i, c := range "é"`, `c` est un octet.
    truth: false
    answer: C'est une rune (le point de code complet) ; l'indexation `s[i]`, elle, donne un octet.
  - key: qcm-valeurs
    format: multiple-choice
    question: "Dans quel ordre `range` parcourt-il une map ?"
    choices:
      - {text: "Dans un ordre non spécifié, qui peut changer d'une exécution à l'autre", correct: true}
      - {text: "Dans l'ordre où les clés ont été insérées", correct: false}
      - {text: "Dans l'ordre croissant des clés", correct: false}
      - {text: "Dans l'ordre des hachages, stable d'une exécution à l'autre", correct: false}
    answer: "`range` donne la clé et la valeur, dans un ordre non spécifié, que le runtime rend même aléatoire. Pour un ordre stable, on trie les clés."
  - key: qcm-une-variable
    format: multiple-choice
    question: Que contient `k` dans `for k := range m` avec `m` une map ?
    choices:
      - text: Les clés
        correct: true
      - text: Les valeurs
        correct: false
      - text: Des paires clé-valeur
        correct: false
      - text: Des indices 0, 1, 2...
        correct: false
    answer: Une seule variable donne la clé.
  - key: qcm-trie
    format: multiple-choice
    question: "Pour afficher une map `m` par ordre de clés, quelle boucle écris-tu ?"
    choices:
      - {text: "`for _, k := range slices.Sorted(maps.Keys(m))`", correct: true}
      - {text: "`for k := range sort(m)`", correct: false}
      - {text: "`for k := range m`, ses clés sortant déjà triées", correct: false}
      - {text: "`for k := range maps.Keys(m)`, qui les trie", correct: false}
    answer: "Les maps ne sont jamais ordonnées, et `maps.Keys` (Go 1.23) les donne dans le même désordre : on trie les clés. Copier les clés dans une slice, puis `slices.Sort`, marche aussi."
  - key: qcm-chaine-indices
    format: multiple-choice
    question: Quels indices donne `for i := range "aé!"` ?
    choices:
      - text: 0, 1, 3
        correct: true
      - text: 0, 1, 2
        correct: false
      - text: 0, 1, 2, 3
        correct: false
      - text: 1, 2, 3
        correct: false
    answer: '`é` occupe deux octets en UTF-8 : l''indice suivant est 3.'
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour parcourir seulement les valeurs :
      ```go
      for ___, nom := range noms {
      	fmt.Println(nom)
      }
      ```
    blanks:
      - - _
    answer: L'identifiant blanc ignore l'indice.
  - key: trous-map
    format: fill-in
    question: |-
      Complète le parcours d'une map :
      ```go
      for ___, prix := ___ tarifs {
      	fmt.Println(produit, prix)
      }
      ```
    blanks:
      - - produit
      - - range
    answer: Clé puis valeur.
  - key: trous-channel
    format: fill-in
    question: |-
      Complète pour recevoir jusqu'à la fermeture du channel :
      ```go
      for msg := ___ messages {
      	traiter(msg)
      }
      ```
    blanks:
      - - range
    answer: '`range` sur un channel reçoit jusqu''à `close`.'
  - key: trous-indice
    format: fill-in
    question: |-
      Complète pour modifier les éléments sur place :
      ```go
      for i := range xs {
      	xs[___] = strings.ToUpper(xs[i])
      }
      ```
    blanks:
      - - i
    answer: On écrit via l'indice ; la variable de valeur serait une copie.
  - key: code-chaine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i, r := range "aé!" {
      	fmt.Printf("%d:%c ", i, r)
      }
      fmt.Println()
      ```
    choices:
      - {text: "`0:a 1:é 3:!`", correct: true}
      - {text: "`0:a 1:é 2:!`", correct: false}
      - {text: "`1:a 2:é 3:!`", correct: false}
      - {text: "`0:a 1:Ã 2:© 3:!`", correct: false}
    answer: "`0:a 1:é 3:!` : l'indice est celui de l'octet de début, et `é` occupe deux octets ; `range` décode bien les runes."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i, r := range \"aé!\" {\n\t\tfmt.Printf(\"%d:%c \", i, r)\n\t}\n\tfmt.Println()\n}\n"
      output: 0:a 1:é 3:!
  - key: code-longueur-fixe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      xs := []int{1, 2, 3}
      for _, x := range xs {
      	xs = append(xs, x*10)
      }
      fmt.Println(xs)
      ```
    choices:
      - {text: "`[1 2 3 10 20 30]`", correct: true}
      - {text: "`[10 20 30]`", correct: false}
      - {text: "`[1 2 3]`", correct: false}
      - {text: "Rien : la boucle tourne sans fin", correct: false}
    answer: "`[1 2 3 10 20 30]` : la longueur parcourue est fixée au départ, la boucle ne tourne pas sans fin."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tfor _, x := range xs {\n\t\txs = append(xs, x*10)\n\t}\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3 10 20 30]'
  - key: code-une-variable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i := range []string{"a", "b", "c"} {
      	fmt.Print(i)
      }
      fmt.Println()
      ```
    choices:
      - {text: "`012`", correct: true}
      - {text: "`abc`", correct: false}
      - {text: "`0a1b2c`", correct: false}
      - {text: "`123`", correct: false}
    answer: "`012` : une seule variable donne l'indice, pas la valeur."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range []string{\"a\", \"b\", \"c\"} {\n\t\tfmt.Print(i)\n\t}\n\tfmt.Println()\n}\n"
      output: '012'
  - key: code-channel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      ch <- 3
      close(ch)
      somme := 0
      for v := range ch {
      	somme += v
      }
      fmt.Println(somme)
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien : la boucle reste bloquée après la dernière valeur", correct: false}
    answer: "`6` : la boucle reçoit les trois valeurs puis s'arrête, le channel étant fermé."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tclose(ch)\n\tsomme := 0\n\tfor v := range ch {\n\t\tsomme += v\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '6'
  - key: bug-ordre-test
    format: bug-fix
    question: |-
      Ce test échoue une fois sur deux. Quelle correction est la bonne ?
      ```go
      var b strings.Builder
      for k, v := range map[string]int{"a": 1, "b": 2} {
      	fmt.Fprintf(&b, "%s=%d;", k, v)
      }
      if b.String() != "a=1;b=2;" { t.Fail() }
      ```
    choices:
      - {text: "Parcourir les clés triées : `slices.Sorted(maps.Keys(m))`", correct: true}
      - {text: "Lancer le test avec `-count=1`, pour vider son cache", correct: false}
      - {text: "Insérer les clés dans l'ordre voulu, que la map garde", correct: false}
      - {text: "Fixer la graine avec `rand.Seed(1)` au début du test", correct: false}
    answer: |-
      ```go
      m := map[string]int{"a": 1, "b": 2}
      for _, k := range slices.Sorted(maps.Keys(m)) {
      	fmt.Fprintf(&b, "%s=%d;", k, m[k])
      }
      ```
      L'ordre d'itération d'une map est aléatoire, quelle que soit l'insertion : on trie les clés pour un résultat stable.
  - key: bug-octets
    format: bug-fix
    question: |-
      Un mot accentué est mal coupé à 3 caractères. Quelle correction est la bonne ?
      ```go
      debut := mot[:3] // "héllo" donne "hé"
      ```
    choices:
      - {text: "Passer par les runes : `[]rune(mot)`, puis couper à 3 au plus", correct: true}
      - {text: "Couper à `mot[:6]`, un caractère accentué faisant deux octets", correct: false}
      - {text: "Nettoyer le résultat avec `strings.ToValidUTF8(mot[:3], \"\")`", correct: false}
      - {text: "Convertir en octets avant de couper : `string([]byte(mot)[:3])`", correct: false}
    answer: |-
      ```go
      runes := []rune(mot)
      debut := string(runes[:min(3, len(runes))])
      ```
      L'indexation d'une chaîne compte des octets, et un caractère non ASCII en occupe plusieurs : on passe par les runes.
  - key: bug-modifier
    format: bug-fix
    question: |-
      Les noms ne sont pas mis en majuscules. Quelle correction est la bonne ?
      ```go
      for _, n := range noms {
      	n = strings.ToUpper(n)
      }
      ```
    choices:
      - {text: "Écrire par l'indice : `noms[i] = strings.ToUpper(n)`", correct: true}
      - {text: "Passer par un pointeur : `p := &n`, puis `*p = ...`", correct: false}
      - {text: "Passer en Go 1.22, où `n` est l'élément de la slice", correct: false}
      - {text: "Remplacer `=` par `:=`, pour écrire dans l'élément", correct: false}
    answer: |-
      ```go
      for i, n := range noms {
      	noms[i] = strings.ToUpper(n)
      }
      ```
      La variable de valeur est une copie, même depuis Go 1.22 : on écrit dans la slice par l'indice.
  - key: bug-channel-ouvert
    format: bug-fix
    question: |-
      Le programme se bloque avec « all goroutines are asleep - deadlock! ». Quelle correction est la bonne ?
      ```go
      ch := make(chan int)
      go func() {
      	for i := range 3 {
      		ch <- i
      	}
      }()
      for v := range ch {
      	fmt.Println(v)
      }
      ```
    choices:
      - {text: "Fermer le channel dans l'émetteur, avec `defer close(ch)`", correct: true}
      - {text: "Créer le channel avec un tampon, `make(chan int, 3)`", correct: false}
      - {text: "Fermer le channel côté lecteur, juste après la boucle", correct: false}
      - {text: "Remplacer `range ch` par `for { v := <-ch ... }`", correct: false}
    answer: |-
      ```go
      go func() {
      	defer close(ch)
      	for i := range 3 {
      		ch <- i
      	}
      }()
      ```
      `range` sur un channel attend sa fermeture : l'émetteur doit le fermer quand il a fini. Un tampon ne change rien, et le lecteur n'atteint jamais la fin de sa boucle.
