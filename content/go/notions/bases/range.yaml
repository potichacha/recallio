notion: range
lesson: |-
  `range` parcourt une collection et donne, selon le type :

  | Sur | Première valeur | Seconde valeur |
  |---|---|---|
  | tableau, slice | indice | **copie** de l'élément |
  | chaîne | indice de l'**octet** de début | la **rune** (caractère) |
  | map | clé | valeur (ordre **aléatoire**) |
  | channel | élément reçu | — (jusqu'à la fermeture) |
  | entier n (Go 1.22) | 0 à n-1 | — |
  | fonction itérateur (Go 1.23) | selon `iter.Seq` / `iter.Seq2` | |

  ```go
  for i, v := range []string{"a", "b"} { }  // 0 a, 1 b
  for i, r := range "héllo" { }              // 0 h, 1 é, 3 l...
  for k, v := range m { }                    // ordre non garanti
  for v := range ch { }                      // jusqu'à close(ch)
  ```

  Une seule variable donne l'indice (ou la clé) : `for i := range xs`. Pour la valeur seule : `for _, v := range xs`.

  À savoir :
  - l'expression est évaluée **une fois** au début : pour un slice, la longueur est fixée au départ ;
  - la valeur est une **copie** : la modifier ne change pas la collection ;
  - pour une chaîne, l'indice saute de plusieurs octets sur un caractère non ASCII ;
  - **supprimer** des clés d'une map pendant un range est permis ; en ajouter donne un résultat imprévisible.

  **Piège classique** : afficher une map avec range dans un test qui attend un ordre. L'ordre change d'une exécution à
  l'autre ; on trie les clés (`slices.Sorted(maps.Keys(m))`).

  **En entretien** : « range donne indice et copie pour un slice, octet et rune pour une chaîne, clé et valeur en ordre
  aléatoire pour une map, et reçoit jusqu'à la fermeture pour un channel. »
tour:
  - title: Parcourir avec range
    text: |-
      `for … range` parcourt une collection, et donne deux valeurs à chaque tour :

      - sur une slice ou un tableau, l'**indice** et une **copie** de l'élément ;
      - sur une chaîne, la position en octets et la **rune** (le caractère) ;
      - sur une map, la clé et la valeur, dans un ordre qui change d'une exécution à l'autre.

      On ignore l'indice avec `_`, ou on ne garde que lui : `for i := range xs`. Les slices et les maps ont leur
      chapitre un peu plus loin : ici, `[]string{…}` est simplement une liste de chaînes.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	langages := []string{"Go", "Java", "Rust"}
          	for i, nom := range langages {
          		fmt.Println(i, nom)
          	}

          	for position, r := range "été" {
          		fmt.Println(position, string(r))
          	}
          }
      output: |-
        0 Go
        1 Java
        2 Rust
        0 é
        2 t
        3 é
    task:
      instructions: |-
        Avec `range`, calcule la somme de `notes` : le programme doit afficher `somme : 47`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 20}
          	somme := 0
          	fmt.Println("somme :", somme, len(notes))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 20}
          	somme := 0
          	for _, note := range notes {
          		somme += note
          	}
          	fmt.Println("somme :", somme)
          }
      output: |-
        somme : 47
cards:
  - key: chaine
    format: course
    question: Que donne `range` sur une chaîne ?
    answer: L'indice de l'octet où commence chaque caractère et la rune elle-même ; l'indice saute de 2 à 4 octets sur un caractère non ASCII.
  - key: une-variable
    format: course
    question: Que donne `for i := range xs` avec une seule variable ?
    answer: Seulement l'indice (ou la clé pour une map) ; la valeur n'est pas copiée.
  - key: evaluation
    format: course
    question: Si on ajoute des éléments à un slice pendant qu'on le parcourt avec range, sont-ils parcourus ?
    answer: 'Non : l''expression est évaluée une fois au début, et la longueur parcourue est celle du départ.'
  - key: suppression-map
    format: course
    question: Peut-on supprimer des clés d'une map pendant un range sur elle ?
    answer: 'Oui, c''est permis : une clé supprimée avant d''être atteinte n''est pas parcourue. En ajouter donne un résultat imprévisible.'
  - key: vf-ordre-map
    format: true-false
    question: '`range` sur une map parcourt les clés dans l''ordre d''insertion.'
    truth: false
    answer: L'ordre est volontairement aléatoire et change d'une exécution à l'autre.
  - key: vf-copie
    format: true-false
    question: Modifier la valeur `v` de `for _, v := range xs` modifie `xs`.
    truth: false
    answer: '`v` est une copie ; on écrit `xs[i]`.'
  - key: vf-channel
    format: true-false
    question: '`for v := range ch` s''arrête quand le channel est fermé et vidé.'
    truth: true
    answer: Sans fermeture, la boucle attend indéfiniment.
  - key: vf-rune
    format: true-false
    question: Dans `for i, c := range "é"`, `c` est un octet.
    truth: false
    answer: C'est une rune (le point de code complet) ; l'indexation `s[i]`, elle, donne un octet.
  - key: qcm-valeurs
    format: multiple-choice
    question: Que donne `range` sur une map ?
    choices:
      - text: La clé et la valeur
        correct: true
      - text: Un ordre qui peut changer à chaque exécution
        correct: true
      - text: L'indice d'insertion et la valeur
        correct: false
      - text: Les clés triées
        correct: false
    answer: Pour un ordre stable, on trie les clés.
  - key: qcm-une-variable
    format: multiple-choice
    question: Que contient `k` dans `for k := range m` avec `m` une map ?
    choices:
      - text: Les clés
        correct: true
      - text: Les valeurs
        correct: false
      - text: Des paires clé-valeur
        correct: false
      - text: Des indices 0, 1, 2...
        correct: false
    answer: Une seule variable donne la clé.
  - key: qcm-trie
    format: multiple-choice
    question: Comment parcourir une map dans l'ordre de ses clés ?
    choices:
      - text: '`for _, k := range slices.Sorted(maps.Keys(m))`'
        correct: true
      - text: Copier les clés dans un slice, le trier avec `slices.Sort`, puis le parcourir
        correct: true
      - text: '`for k := range sort(m)`'
        correct: false
      - text: Utiliser `range` deux fois de suite
        correct: false
    answer: Les maps ne sont jamais ordonnées ; on trie les clés (Go 1.23 pour `maps.Keys` itérateur).
  - key: qcm-chaine-indices
    format: multiple-choice
    question: Quels indices donne `for i := range "aé!"` ?
    choices:
      - text: 0, 1, 3
        correct: true
      - text: 0, 1, 2
        correct: false
      - text: 0, 1, 2, 3
        correct: false
      - text: 1, 2, 3
        correct: false
    answer: '`é` occupe deux octets en UTF-8 : l''indice suivant est 3.'
  - key: trous-valeur
    format: fill-in
    question: "Complétez pour parcourir seulement les valeurs :\n```go\nfor ___, nom := range noms {\n\tfmt.Println(nom)\n}\n```"
    blanks:
      - - _
    answer: L'identifiant blanc ignore l'indice.
  - key: trous-map
    format: fill-in
    question: "Complétez le parcours d'une map :\n```go\nfor ___, prix := ___ tarifs {\n\tfmt.Println(produit, prix)\n}\n```"
    blanks:
      - - produit
      - - range
    answer: Clé puis valeur.
  - key: trous-channel
    format: fill-in
    question: "Complétez pour recevoir jusqu'à la fermeture du channel :\n```go\nfor msg := ___ messages {\n\ttraiter(msg)\n}\n```"
    blanks:
      - - range
    answer: '`range` sur un channel reçoit jusqu''à `close`.'
  - key: trous-indice
    format: fill-in
    question: "Complétez pour modifier les éléments sur place :\n```go\nfor i := range xs {\n\txs[___] = strings.ToUpper(xs[i])\n}\n```"
    blanks:
      - - i
    answer: On écrit via l'indice ; la variable de valeur serait une copie.
  - key: code-chaine
    format: code-output
    question: "```go\nfor i, r := range \"aé!\" {\n\tfmt.Printf(\"%d:%c \", i, r)\n}\nfmt.Println()\n```"
    answer: '`0:a 1:é 3:!` : l''indice est celui de l''octet de début.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i, r := range \"aé!\" {\n\t\tfmt.Printf(\"%d:%c \", i, r)\n\t}\n\tfmt.Println()\n}\n"
      output: 0:a 1:é 3:!
  - key: code-longueur-fixe
    format: code-output
    question: "```go\nxs := []int{1, 2, 3}\nfor _, x := range xs {\n\txs = append(xs, x*10)\n}\nfmt.Println(xs)\n```"
    answer: '`[1 2 3 10 20 30]` : la longueur parcourue est fixée au départ, la boucle ne tourne pas sans fin.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tfor _, x := range xs {\n\t\txs = append(xs, x*10)\n\t}\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3 10 20 30]'
  - key: code-une-variable
    format: code-output
    question: "```go\nfor i := range []string{\"a\", \"b\", \"c\"} {\n\tfmt.Print(i)\n}\nfmt.Println()\n```"
    answer: '`012` : une seule variable donne l''indice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range []string{\"a\", \"b\", \"c\"} {\n\t\tfmt.Print(i)\n\t}\n\tfmt.Println()\n}\n"
      output: '012'
  - key: code-channel
    format: code-output
    question: "```go\nch := make(chan int, 3)\nch <- 1\nch <- 2\nch <- 3\nclose(ch)\nsomme := 0\nfor v := range ch {\n\tsomme += v\n}\nfmt.Println(somme)\n```"
    answer: '`6` : la boucle reçoit les trois valeurs puis s''arrête à la fermeture.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tclose(ch)\n\tsomme := 0\n\tfor v := range ch {\n\t\tsomme += v\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '6'
  - key: bug-ordre-test
    format: bug-fix
    question: "Ce test échoue une fois sur deux :\n```go\nvar b strings.Builder\nfor k, v := range map[string]int{\"a\": 1, \"b\": 2} {\n\tfmt.Fprintf(&b, \"%s=%d;\", k, v)\n}\nif b.String() != \"a=1;b=2;\" { t.Fail() }\n```"
    answer: "```go\nm := map[string]int{\"a\": 1, \"b\": 2}\nfor _, k := range slices.Sorted(maps.Keys(m)) {\n\tfmt.Fprintf(&b, \"%s=%d;\", k, m[k])\n}\n```\nL'ordre d'itération d'une map est aléatoire : on trie les clés pour un résultat stable."
  - key: bug-octets
    format: bug-fix
    question: |-
      Un mot accentué est mal coupé à 3 caractères :
      ```go
      debut := mot[:3] // "héllo" donne "hé"
      ```
    answer: |-
      ```go
      runes := []rune(mot)
      debut := string(runes[:min(3, len(runes))])
      ```
      L'indexation d'une chaîne compte des octets ; un caractère non ASCII en occupe plusieurs. On passe par les runes.
  - key: bug-modifier
    format: bug-fix
    question: "Les noms ne sont pas mis en majuscules :\n```go\nfor _, n := range noms {\n\tn = strings.ToUpper(n)\n}\n```"
    answer: "```go\nfor i, n := range noms {\n\tnoms[i] = strings.ToUpper(n)\n}\n```\nLa variable de valeur est une copie : on écrit dans le slice par l'indice."
  - key: bug-channel-ouvert
    format: bug-fix
    question: "Le programme se bloque avec « all goroutines are asleep - deadlock! » :\n```go\nch := make(chan int)\ngo func() {\n\tfor i := range 3 {\n\t\tch <- i\n\t}\n}()\nfor v := range ch {\n\tfmt.Println(v)\n}\n```"
    answer: "```go\ngo func() {\n\tdefer close(ch)\n\tfor i := range 3 {\n\t\tch <- i\n\t}\n}()\n```\n`range` sur un channel attend sa fermeture : l'émetteur doit le fermer quand il a fini."
