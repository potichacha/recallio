notion: boucle-for
lesson: |-
  Go n'a **qu'une boucle** : `for`, sous plusieurs formes.

  ```go
  for i := 0; i < 10; i++ { ... }   // classique : initialisation ; condition ; post-instruction
  for n > 1 { ... }                  // comme un while
  for { ... }                        // infinie, jusqu'à break ou return
  for i, v := range xs { ... }       // sur une collection
  for i := range 10 { ... }          // sur un entier : 0 à 9 (Go 1.22)
  ```

  - Pas de parenthèses autour de l'en-tête, accolades obligatoires.
  - `i++` est une **instruction**, pas une expression : `x = i++` ne compile pas, et il n'y a pas de `++i`.
  - `break` sort de la boucle, `continue` passe à l'itération suivante.
  - Depuis Go 1.22, **chaque itération a sa propre variable** de boucle (voir la notion dédiée).
  - `for range 3` (sans variable) répète le corps trois fois.

  Il n'y a ni `while` ni `do ... while` : `for cond {}` remplace le premier, et `for { ...; if !cond { break } }` le
  second.

  **Piège classique** : modifier la variable d'une boucle `range` en croyant modifier la collection. `v` est une **copie**
  de l'élément ; pour modifier, on passe par l'indice (`xs[i] = ...`).

  **En entretien** : « Une seule boucle, `for`, qui fait aussi while et boucle infinie ; `range` sur les collections et sur
  un entier depuis 1.22 ; `i++` est une instruction. »
cards:
  - key: combien-types-boucles
    format: course
    question: Combien de types de boucles en Go ?
    answer: Une seule, `for`, avec plusieurs formes (classique, condition, infinie, range).
  - key: for-i-range-10
    format: course
    question: Que fait `for i := range 10` ?
    answer: Parcourt les entiers de 0 à 9 (Go 1.22).
  - key: while
    format: course
    question: Comment écrire l'équivalent d'un `while` en Go ?
    answer: 'Avec un `for` qui n''a que la condition : `for n > 1 { ... }`.'
  - key: increment
    format: course
    question: '`x = i++` compile-t-il ?'
    answer: 'Non : `i++` est une instruction, pas une expression ; et il n''existe pas de `++i`.'
  - key: vf-while
    format: true-false
    question: Go dispose d'un mot-clé `while`.
    truth: false
    answer: '`for condition { }` en tient lieu.'
  - key: vf-infinie
    format: true-false
    question: '`for { }` est une boucle infinie.'
    truth: true
    answer: On en sort par `break`, `return` ou une panique.
  - key: vf-range-entier
    format: true-false
    question: Depuis Go 1.22, `for i := range 5` parcourt 0, 1, 2, 3, 4.
    truth: true
    answer: Le range sur un entier n parcourt de 0 à n-1.
  - key: vf-do-while
    format: true-false
    question: Go dispose d'une boucle `do ... while`.
    truth: false
    answer: On écrit `for { ...; if !cond { break } }`.
  - key: qcm-formes
    format: multiple-choice
    question: Quelles boucles sont valides ?
    choices:
      - text: '`for i := 0; i < n; i++ { }`'
        correct: true
      - text: '`for x < 100 { }`'
        correct: true
      - text: '`for (i = 0; i < n; i++) { }`'
        correct: false
      - text: '`while x < 100 { }`'
        correct: false
    answer: Pas de parenthèses autour de l'en-tête, et pas de `while`.
  - key: qcm-break-continue
    format: multiple-choice
    question: Que fait `continue` dans une boucle `for` classique ?
    choices:
      - text: Il exécute la post-instruction (`i++`) puis passe à l'itération suivante
        correct: true
      - text: Il sort de la boucle
        correct: false
      - text: Il recommence l'itération courante sans incrémenter
        correct: false
      - text: Il sort de la fonction
        correct: false
    answer: '`break` sort de la boucle ; `continue` saute le reste du corps.'
  - key: qcm-repeter
    format: multiple-choice
    question: Comment répéter une action trois fois sans variable inutilisée ?
    choices:
      - text: '`for range 3 { }`'
        correct: true
      - text: '`for i := 0; i < 3; i++ { }` en utilisant i ou non'
        correct: true
      - text: '`repeat 3 { }`'
        correct: false
      - text: '`for 3 { }`'
        correct: false
    answer: Une variable de boucle classique non lue est tolérée (elle sert dans la condition).
  - key: qcm-modifier
    format: multiple-choice
    question: Comment doubler chaque élément de `xs` sur place ?
    choices:
      - text: '`for i := range xs { xs[i] *= 2 }`'
        correct: true
      - text: '`for _, v := range xs { v *= 2 }`'
        correct: false
      - text: '`for v := range xs { v *= 2 }`'
        correct: false
      - text: '`xs *= 2`'
        correct: false
    answer: '`v` est une copie de l''élément ; il faut écrire via l''indice.'
  - key: trous-classique
    format: fill-in
    question: "Complétez la boucle de 0 à 9 :\n```go\nfor i := 0; i ___ 10; i___ {\n\tfmt.Println(i)\n}\n```"
    blanks:
      - - <
      - - ++
    answer: Initialisation, condition, post-instruction.
  - key: trous-while
    format: fill-in
    question: "Complétez l'équivalent d'un while :\n```go\n___ n > 1 {\n\tn /= 2\n}\n```"
    blanks:
      - - for
    answer: Un `for` avec la seule condition.
  - key: trous-range-entier
    format: fill-in
    question: "Complétez pour parcourir 0 à 4 (Go 1.22) :\n```go\nfor i := ___ 5 {\n\tfmt.Println(i)\n}\n```"
    blanks:
      - - range
    answer: Le range sur un entier.
  - key: trous-break
    format: fill-in
    question: "Complétez pour sortir de la boucle infinie :\n```go\nfor {\n\tligne, err := lire()\n\tif err != nil {\n\t\t___\n\t}\n\ttraiter(ligne)\n}\n```"
    blanks:
      - - break
        - return
    answer: '`break` sort de la boucle (ou `return` de la fonction).'
  - key: code-continue
    format: code-output
    question: "```go\nfor i := 0; i < 6; i++ {\n\tif i%2 == 0 {\n\t\tcontinue\n\t}\n\tfmt.Print(i, \" \")\n}\nfmt.Println()\n```"
    answer: '`1 3 5` : `continue` saute les nombres pairs.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := 0; i < 6; i++ {\n\t\tif i%2 == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tfmt.Print(i, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 3 5
  - key: code-while
    format: code-output
    question: "```go\nn, etapes := 20, 0\nfor n > 1 {\n\tn /= 2\n\tetapes++\n}\nfmt.Println(n, etapes)\n```"
    answer: '`1 4` : 20, 10, 5, 2, 1.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tn, etapes := 20, 0\n\tfor n > 1 {\n\t\tn /= 2\n\t\tetapes++\n\t}\n\tfmt.Println(n, etapes)\n}\n"
      output: 1 4
  - key: code-copie
    format: code-output
    question: "```go\nxs := []int{1, 2, 3}\nfor _, v := range xs {\n\tv *= 10\n}\nfmt.Println(xs)\n```"
    answer: '`[1 2 3]` : `v` est une copie, la slice ne change pas.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tfor _, v := range xs {\n\t\tv *= 10\n\t}\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3]'
  - key: code-range-entier
    format: code-output
    question: "```go\ntotal := 0\nfor i := range 5 {\n\ttotal += i\n}\nfmt.Println(total)\n```"
    answer: '`10` : 0 + 1 + 2 + 3 + 4.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttotal := 0\n\tfor i := range 5 {\n\t\ttotal += i\n\t}\n\tfmt.Println(total)\n}\n"
      output: '10'
  - key: bug-copie
    format: bug-fix
    question: "Les prix ne sont jamais augmentés :\n```go\nfor _, p := range produits {\n\tp.Prix = p.Prix * 110 / 100\n}\n```"
    answer: "```go\nfor i := range produits {\n\tproduits[i].Prix = produits[i].Prix * 110 / 100\n}\n```\nLa variable de `range` est une copie de l'élément : on modifie via l'indice."
  - key: bug-while
    format: bug-fix
    question: "Ce code ne compile pas :\n```go\nwhile essais < 3 {\n\tessais++\n}\n```"
    answer: "```go\nfor essais < 3 {\n\tessais++\n}\n```\n`while` n'existe pas : `for` avec une condition seule le remplace."
  - key: bug-increment
    format: bug-fix
    question: |-
      Le compilateur signale « syntax error: unexpected ++ » :
      ```go
      suivant := compteur++
      ```
    answer: |-
      ```go
      compteur++
      suivant := compteur
      ```
      `++` est une instruction, pas une expression qui renvoie une valeur.
  - key: bug-parentheses
    format: bug-fix
    question: "Un développeur venant de Java écrit :\n```go\nfor (int i = 0; i < n; i++) {\n\tsomme += xs[i]\n}\n```"
    answer: "```go\nfor i := 0; i < n; i++ {\n\tsomme += xs[i]\n}\n// ou plus simplement : for _, x := range xs { somme += x }\n```\nPas de parenthèses ni de type devant la variable : `i := 0`."
