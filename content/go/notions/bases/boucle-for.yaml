notion: boucle-for
lesson: |-
  Go n'a **qu'une boucle** : `for`, sous plusieurs formes.

  ```go
  for i := 0; i < 10; i++ { ... }   // classique : initialisation ; condition ; post-instruction
  for n > 1 { ... }                  // comme un while
  for { ... }                        // infinie, jusqu'à break ou return
  for i, v := range xs { ... }       // sur une collection
  for i := range 10 { ... }          // sur un entier : 0 à 9 (Go 1.22)
  ```

  - Pas de parenthèses autour de l'en-tête, accolades obligatoires.
  - `i++` est une **instruction**, pas une expression : `x = i++` ne compile pas, et il n'y a pas de `++i`.
  - `break` sort de la boucle, `continue` passe à l'itération suivante.
  - Depuis Go 1.22, **chaque itération a sa propre variable** de boucle (voir la notion dédiée).
  - `for range 3` (sans variable) répète le corps trois fois.

  Il n'y a ni `while` ni `do ... while` : `for cond {}` remplace le premier, et `for { ...; if !cond { break } }` le
  second.

  **Piège classique** : modifier la variable d'une boucle `range` en croyant modifier la collection. `v` est une **copie**
  de l'élément ; pour modifier, on passe par l'indice (`xs[i] = ...`).

  **En entretien** : « Une seule boucle, `for`, qui fait aussi while et boucle infinie ; `range` sur les collections et sur
  un entier depuis 1.22 ; `i++` est une instruction. »
tour:
  - title: "Une seule boucle : for"
    text: |-
      Go n'a qu'une boucle, `for`, sous trois formes :

      - la forme classique, `for i := 0; i < 3; i++`, sans parenthèses ;
      - la forme « tant que », avec une seule condition : `for n != 1` ;
      - la boucle infinie, `for { … }`, dont on sort avec `break` ou `return`.

      Depuis Go 1.22, `for i := range 3` compte de 0 à 2, et chaque tour de boucle a **sa propre** variable `i`.
      `continue` passe au tour suivant.

      Essaie : remplace `n := 27` par `n := 7`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	for i := 0; i < 3; i++ {
          		fmt.Println("tour", i)
          	}

          	n := 27
          	etapes := 0
          	for n != 1 {
          		if n%2 == 0 {
          			n /= 2
          		} else {
          			n = 3*n + 1
          		}
          		etapes++
          	}
          	fmt.Println("étapes :", etapes)

          	for i := range 3 {
          		fmt.Println("carré :", i*i)
          	}
          }
      output: |-
        tour 0
        tour 1
        tour 2
        étapes : 111
        carré : 0
        carré : 1
        carré : 4
    task:
      instructions: |-
        Avec une boucle `for`, calcule la somme des entiers de 1 à 100 : le programme doit afficher `somme : 5050`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	somme := 0
          	fmt.Println("somme :", somme)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	somme := 0
          	for i := 1; i <= 100; i++ {
          		somme += i
          	}
          	fmt.Println("somme :", somme)
          }
      output: |-
        somme : 5050
cards:
  - key: combien-types-boucles
    format: course
    question: "Combien de mots-clés de boucle existe-t-il en Go ?"
    choices:
      - {text: "Un seul, `for`, qui prend plusieurs formes : classique, condition, infinie, `range`", correct: true}
      - {text: "Trois : `for`, `while` et `do ... while`, comme en Java ou en C", correct: false}
      - {text: "Deux : `for` pour compter avec un indice, et `while` pour une condition seule", correct: false}
      - {text: "Deux : `for` pour les indices, et `foreach` pour parcourir une collection", correct: false}
    answer: "Un seul, `for`, avec plusieurs formes : classique, condition seule (le `while` des autres langages), infinie, et `range`. Ni `while` ni `do` n'existent en Go."
  - key: for-i-range-10
    format: course
    question: "Que fait `for i := range 10` ?"
    choices:
      - {text: "Il parcourt les entiers de 0 à 9 (depuis Go 1.22)", correct: true}
      - {text: "Il parcourt les entiers de 1 à 10, bornes comprises", correct: false}
      - {text: "Il parcourt les entiers de 0 à 10, bornes comprises", correct: false}
      - {text: "Rien : `range` ne s'applique qu'à une slice ou une map", correct: false}
    answer: "Depuis Go 1.22, `range` sur un entier `n` parcourt 0, 1, …, n-1 : ici de 0 à 9. Avant Go 1.22, ce code ne compilait pas."
  - key: while
    format: course
    question: "Comment écrire l'équivalent d'un `while` en Go ?"
    choices:
      - {text: "`for n > 1 { ... }` : un `for` qui n'a que la condition", correct: true}
      - {text: "`while n > 1 { ... }` : le mot-clé existe, comme en Java", correct: false}
      - {text: "`do { ... } while n > 1` : la boucle conditionnelle de Go", correct: false}
      - {text: "`loop n > 1 { ... }` : le mot-clé `loop` remplace `while`", correct: false}
    answer: "Avec un `for` qui n'a que la condition : `for n > 1 { ... }`. Go n'a ni `while`, ni `do ... while`, ni `loop`."
  - key: increment
    format: course
    question: "Le code `x = i++` compile-t-il en Go ?"
    choices:
      - {text: "Non : `i++` est une instruction, pas une expression", correct: true}
      - {text: "Oui : `x` reçoit l'ancienne valeur de `i`, comme en Java", correct: false}
      - {text: "Oui : `x` reçoit la nouvelle valeur de `i`, après l'incrément", correct: false}
      - {text: "Non, mais `x = ++i` compile et fait la même chose", correct: false}
    answer: "Non : en Go, `i++` est une instruction, pas une expression qui renvoie une valeur, et `++i` n'existe pas. On écrit `i++`, puis `x = i`."
  - key: vf-while
    format: true-false
    question: Go dispose d'un mot-clé `while`.
    truth: false
    answer: '`for condition { }` en tient lieu.'
  - key: vf-infinie
    format: true-false
    question: '`for { }` est une boucle infinie.'
    truth: true
    answer: On en sort par `break`, `return` ou une panique.
  - key: vf-range-entier
    format: true-false
    question: Depuis Go 1.22, `for i := range 5` parcourt 0, 1, 2, 3, 4.
    truth: true
    answer: Le range sur un entier n parcourt de 0 à n-1.
  - key: vf-do-while
    format: true-false
    question: Go dispose d'une boucle `do ... while`.
    truth: false
    answer: On écrit `for { ...; if !cond { break } }`.
  - key: qcm-formes
    format: multiple-choice
    question: "Laquelle de ces boucles compile en Go ?"
    choices:
      - {text: "`for x < 100 { }`", correct: true}
      - {text: "`for (i = 0; i < n; i++) { }`", correct: false}
      - {text: "`while x < 100 { }`", correct: false}
      - {text: "`for int i = 0; i < n; i++ { }`", correct: false}
    answer: "`for x < 100 { }` est la forme « condition seule » de `for`. L'en-tête ne prend pas de parenthèses, `while` n'existe pas, et la variable se déclare avec `:=`, sans type devant (`for i := 0; i < n; i++`)."
  - key: qcm-break-continue
    format: multiple-choice
    question: Que fait `continue` dans une boucle `for` classique ?
    choices:
      - text: Il exécute la post-instruction (`i++`) puis passe à l'itération suivante
        correct: true
      - text: Il sort de la boucle
        correct: false
      - text: Il recommence l'itération courante sans incrémenter
        correct: false
      - text: Il sort de la fonction
        correct: false
    answer: '`break` sort de la boucle ; `continue` saute le reste du corps.'
  - key: qcm-repeter
    format: multiple-choice
    question: "Quelle boucle répète une action trois fois sans déclarer de variable (Go 1.22 et plus) ?"
    choices:
      - {text: "`for range 3 { }`", correct: true}
      - {text: "`repeat 3 { }`", correct: false}
      - {text: "`for 3 { }`", correct: false}
      - {text: "`for i in range(3) { }`", correct: false}
    answer: "`for range 3` répète trois fois sans variable. Une boucle classique `for i := 0; i < 3; i++` marche aussi : sa variable sert dans la condition, le compilateur ne la dit donc pas inutilisée. `for 3` ne compile pas : la condition doit être un booléen."
  - key: qcm-modifier
    format: multiple-choice
    question: Comment doubler chaque élément de `xs` sur place ?
    choices:
      - text: '`for i := range xs { xs[i] *= 2 }`'
        correct: true
      - text: '`for _, v := range xs { v *= 2 }`'
        correct: false
      - text: '`for v := range xs { v *= 2 }`'
        correct: false
      - text: '`xs *= 2`'
        correct: false
    answer: '`v` est une copie de l''élément ; il faut écrire via l''indice.'
  - key: trous-classique
    format: fill-in
    question: |-
      Complète la boucle de 0 à 9 :
      ```go
      for i := 0; i ___ 10; i___ {
      	fmt.Println(i)
      }
      ```
    blanks:
      - - <
      - - ++
    answer: Initialisation, condition, post-instruction.
  - key: trous-while
    format: fill-in
    question: |-
      Complète l'équivalent d'un while :
      ```go
      ___ n > 1 {
      	n /= 2
      }
      ```
    blanks:
      - - for
    answer: Un `for` avec la seule condition.
  - key: trous-range-entier
    format: fill-in
    question: |-
      Complète pour parcourir 0 à 4 (Go 1.22) :
      ```go
      for i := ___ 5 {
      	fmt.Println(i)
      }
      ```
    blanks:
      - - range
    answer: Le range sur un entier.
  - key: trous-break
    format: fill-in
    question: |-
      Complète pour sortir de la boucle infinie :
      ```go
      for {
      	ligne, err := lire()
      	if err != nil {
      		___
      	}
      	traiter(ligne)
      }
      ```
    blanks:
      - - break
        - return
    answer: '`break` sort de la boucle (ou `return` de la fonction).'
  - key: code-continue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i := 0; i < 6; i++ {
      	if i%2 == 0 {
      		continue
      	}
      	fmt.Print(i, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`1 3 5`", correct: true}
      - {text: "`0 2 4`", correct: false}
      - {text: "`1 3`", correct: false}
      - {text: "`0 1 2 3 4 5`", correct: false}
    answer: "`1 3 5` : `continue` saute la fin du tour pour les nombres pairs et passe au suivant ; il ne sort pas de la boucle."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := 0; i < 6; i++ {\n\t\tif i%2 == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tfmt.Print(i, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 3 5
  - key: code-while
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      n, etapes := 20, 0
      for n > 1 {
      	n /= 2
      	etapes++
      }
      fmt.Println(n, etapes)
      ```
    choices:
      - {text: "`1 4`", correct: true}
      - {text: "`0 5`", correct: false}
      - {text: "`1 5`", correct: false}
      - {text: "`2 3`", correct: false}
    answer: "`1 4` : 20, 10, 5, 2, 1. La division entière tronque 5 / 2 en 2, et la boucle s'arrête quand `n` vaut 1."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tn, etapes := 20, 0\n\tfor n > 1 {\n\t\tn /= 2\n\t\tetapes++\n\t}\n\tfmt.Println(n, etapes)\n}\n"
      output: 1 4
  - key: code-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      xs := []int{1, 2, 3}
      for _, v := range xs {
      	v *= 10
      }
      fmt.Println(xs)
      ```
    choices:
      - {text: "`[1 2 3]`", correct: true}
      - {text: "`[10 20 30]`", correct: false}
      - {text: "`[10 2 3]`", correct: false}
      - {text: "Ça ne compile pas : `v` n'est jamais lue", correct: false}
    answer: "`[1 2 3]` : `v` est une copie de l'élément, la slice ne change pas. Pour modifier, on passe par l'indice : `xs[i] *= 10`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tfor _, v := range xs {\n\t\tv *= 10\n\t}\n\tfmt.Println(xs)\n}\n"
      output: '[1 2 3]'
  - key: code-range-entier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      total := 0
      for i := range 5 {
      	total += i
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`4`", correct: false}
    answer: "`10` : `range 5` donne 0, 1, 2, 3 et 4, pas 5 ; la somme vaut 10, et non 15."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttotal := 0\n\tfor i := range 5 {\n\t\ttotal += i\n\t}\n\tfmt.Println(total)\n}\n"
      output: '10'
  - key: bug-copie
    format: bug-fix
    question: |-
      Les prix ne sont jamais augmentés. Quelle correction est la bonne ?
      ```go
      for _, p := range produits {
      	p.Prix = p.Prix * 110 / 100
      }
      ```
    choices:
      - {text: "Modifier l'élément par son indice : `produits[i].Prix = ...`", correct: true}
      - {text: "Prendre l'adresse de la copie : `q := &p`, puis `q.Prix = ...`", correct: false}
      - {text: "Passer en Go 1.22, où `p` désigne l'élément de la slice", correct: false}
      - {text: "Remettre `p` dans la slice avec `append(produits, p)`", correct: false}
    answer: |-
      ```go
      for i := range produits {
      	produits[i].Prix = produits[i].Prix * 110 / 100
      }
      ```
      La variable de `range` est une copie de l'élément : on modifie via l'indice. Depuis Go 1.22, `p` est une variable neuve à chaque tour, mais toujours une copie.
  - key: bug-while
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      while essais < 3 {
      	essais++
      }
      ```
    choices:
      - {text: "Remplacer `while` par `for` : `for essais < 3 { ... }`", correct: true}
      - {text: "Mettre la condition entre parenthèses : `while (essais < 3)`", correct: false}
      - {text: "Écrire la boucle `do { essais++ } while essais < 3`", correct: false}
      - {text: "Remplacer `while` par `loop`, le mot-clé conditionnel de Go", correct: false}
    answer: |-
      ```go
      for essais < 3 {
      	essais++
      }
      ```
      `while` n'existe pas : `for` avec une condition seule le remplace. Go n'a pas non plus de `do ... while`.
  - key: bug-increment
    format: bug-fix
    question: |-
      Le compilateur signale « syntax error: unexpected ++ » sur ce code. Quelle correction est la bonne ?
      ```go
      suivant := compteur++
      ```
    choices:
      - {text: "Incrémenter, puis copier : `compteur++`, puis `suivant := compteur`", correct: true}
      - {text: "Utiliser l'incrément préfixé : `suivant := ++compteur`", correct: false}
      - {text: "Mettre l'incrément entre parenthèses : `suivant := (compteur++)`", correct: false}
      - {text: "Déclarer avec `var` : `var suivant int = compteur++`", correct: false}
    answer: |-
      ```go
      compteur++
      suivant := compteur
      ```
      `++` est une instruction, pas une expression qui renvoie une valeur, et `++compteur` n'existe pas en Go.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Un développeur venant de Java écrit cette boucle, qui ne compile pas. Quelle correction est la bonne ?
      ```go
      for (int i = 0; i < n; i++) {
      	somme += xs[i]
      }
      ```
    choices:
      - {text: "`for i := 0; i < n; i++ { ... }` : ni parenthèses, ni type devant `i`", correct: true}
      - {text: "`for (i := 0; i < n; i++) { ... }` : seul le type `int` est de trop", correct: false}
      - {text: "`for int i = 0; i < n; i++ { ... }` : seules les parenthèses gênent", correct: false}
      - {text: "`for (var i int = 0; i < n; i++) { ... }` : on déclare par `var`", correct: false}
    answer: |-
      ```go
      for i := 0; i < n; i++ {
      	somme += xs[i]
      }
      // ou plus simplement : for _, x := range xs { somme += x }
      ```
      L'en-tête d'un `for` ne prend pas de parenthèses, et la variable se déclare avec `i := 0`, sans type devant.
