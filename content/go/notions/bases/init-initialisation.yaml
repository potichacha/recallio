notion: init-initialisation
lesson: "L'ordre d'initialisation d'un programme Go :\n\n1. Les **packages importés** sont initialisés d'abord, chacun une seule fois, dans l'ordre des dépendances.\n2. Dans un package, les **variables de package** sont initialisées dans l'ordre de leurs **dépendances** (une\n   variable qui en utilise une autre attend qu'elle soit prête), puis dans l'ordre d'apparition.\n3. Les fonctions **`init()`** du package s'exécutent ensuite, dans l'ordre des fichiers (triés par nom) et, dans un\n   fichier, dans l'ordre d'écriture.\n4. Enfin `main()` du package `main`.\n\n```go\nvar config = charger() // avant init\n\nfunc init() {\n\t// pas de paramètre, pas de retour ; il peut y en avoir plusieurs par package\n\tenregistrer(\"csv\", lireCSV)\n}\n```\n\n`init` ne peut pas être appelée explicitement. Usage légitime : enregistrer un pilote ou un format\n(`database/sql`, `image/png`), via `import _ \"pkg\"`.\n\nÀ éviter dans `init` : les entrées-sorties, l'accès au réseau, la lecture de variables d'environnement, ce qui peut\néchouer. Une erreur dans `init` ne peut que paniquer, rend les tests difficiles et ralentit chaque démarrage, même\npour `go test`. On préfère une initialisation **explicite** depuis `main`.\n\n**Piège classique** : une variable de package qui dépend d'un flag (`var verbose = *flagVerbose`). Elle est évaluée\navant `flag.Parse()`, donc toujours à la valeur par défaut.\n\n**En entretien** : « Imports, variables de package selon leurs dépendances, init, puis main ; init seulement pour des\nenregistrements sans effet de bord risqué ; le reste explicitement dans main. »"
cards:
  - key: quand-execute-init
    format: course
    question: "Quand s'exécute la fonction `init()` d'un package ?"
    choices:
      - {text: "Après l'initialisation des variables du package et de ses dépendances, avant `main`", correct: true}
      - {text: "Avant l'initialisation des variables du package, pour les préparer", correct: false}
      - {text: "Au premier appel d'une fonction du package, à la demande", correct: false}
      - {text: "Après `main`, au moment où le programme se termine", correct: false}
    answer: "Après l'initialisation des variables du package et des packages dont il dépend, avant `main`. Elle s'exécute une seule fois, même si le package est importé plusieurs fois."
  - key: sert-import-pkg
    format: course
    question: À quoi sert `import _ "pkg"` ?
    choices:
      - {text: "Importer un package pour les seuls effets de bord de son `init` (pilotes, pprof)", correct: true}
      - {text: "Importer un package sans l'ajouter au `go.mod` du module courant", correct: false}
      - {text: "Importer un package en différé, chargé à son premier usage", correct: false}
      - {text: "Importer tous les noms du package sans préfixe, comme `import *`", correct: false}
    answer: "Importer un package uniquement pour les effets de bord de son `init` (pilotes de base, pprof, décodeurs d'images). Importer les noms sans préfixe, c'est `import . \"pkg\"`."
  - key: plusieurs-init
    format: course
    question: Un package peut-il avoir plusieurs fonctions `init` ?
    choices:
      - {text: "Oui, même dans un fichier ; elles s'exécutent dans l'ordre des fichiers, puis d'écriture", correct: true}
      - {text: "Non : une seconde `init` est une redéclaration, qui ne compile pas", correct: false}
      - {text: "Oui, mais une seule par fichier, dans un ordre non garanti", correct: false}
      - {text: "Oui, mais seule la dernière déclarée s'exécute", correct: false}
    answer: "Oui, même dans un seul fichier : `init` est le seul nom qu'on peut déclarer plusieurs fois. Elles s'exécutent dans l'ordre des fichiers, puis dans l'ordre d'écriture."
  - key: appeler
    format: course
    question: Peut-on appeler `init()` soi-même ?
    choices:
      - {text: "Non : le compilateur refuse de l'appeler ; seul le runtime la lance", correct: true}
      - {text: "Oui, pour réinitialiser le package, par exemple dans un test", correct: false}
      - {text: "Oui, mais seulement depuis la fonction `main` du programme", correct: false}
      - {text: "Oui : elle s'exécute alors une seconde fois, sans effet de bord", correct: false}
    answer: "Non : le compilateur la refuse comme valeur ou appel (« undefined: init ») ; elle n'est lancée que par le runtime."
  - key: vf-ordre
    format: true-false
    question: Les variables de package sont initialisées avant les fonctions `init` du même package.
    truth: true
    answer: Puis viennent les `init`, puis `main`.
  - key: vf-imports
    format: true-false
    question: Les packages importés sont initialisés après le package qui les importe.
    truth: false
    answer: Ils le sont avant, chacun une seule fois.
  - key: vf-parametres
    format: true-false
    question: '`init` peut prendre des paramètres de configuration.'
    truth: false
    answer: '`init` n''a ni paramètre ni valeur de retour.'
  - key: vf-flag
    format: true-false
    question: '`var verbose = *flagVerbose` voit la valeur passée en ligne de commande.'
    truth: false
    answer: Elle est évaluée à l'initialisation du package, avant `flag.Parse()` dans `main`.
  - key: qcm-ordre
    format: multiple-choice
    question: Quel est l'ordre d'initialisation d'un programme ?
    choices:
      - text: Packages importés, variables de package, init, main
        correct: true
      - text: main, init, variables de package
        correct: false
      - text: init, variables de package, packages importés, main
        correct: false
      - text: Un ordre aléatoire
        correct: false
    answer: Les dépendances d'abord, puis le package lui-même.
  - key: qcm-legitime
    format: multiple-choice
    question: "Lequel de ces usages de `init` est raisonnable ?"
    choices:
      - {text: "Enregistrer un pilote ou un décodeur dans un registre", correct: true}
      - {text: "Ouvrir une connexion à la base de données", correct: false}
      - {text: "Lire un fichier de configuration, et paniquer s'il manque", correct: false}
      - {text: "Démarrer le serveur HTTP dans une goroutine", correct: false}
    answer: "Enregistrer un pilote, ou calculer une table de constantes en mémoire, ne peut pas échouer. Ce qui peut échouer ou dépend de l'environnement se fait explicitement depuis `main`."
  - key: qcm-dependances
    format: multiple-choice
    question: Avec `var a = b + 1` puis `var b = 2` dans le même fichier, que vaut `a` ?
    choices:
      - text: '3'
        correct: true
      - text: '1'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Les variables de package sont initialisées selon leurs dépendances, pas seulement dans l'ordre du texte.
  - key: qcm-tests
    format: multiple-choice
    question: "Lesquelles de ces raisons expliquent qu'un `init` qui se connecte au réseau gêne les tests ?"
    choices:
      - text: Il s'exécute à chaque `go test` du package, avant tout test
        correct: true
      - text: Une erreur ne peut que paniquer, sans être testée proprement
        correct: true
      - text: '`go test` ignore les fonctions init'
        correct: false
      - text: Il rend le package impossible à importer
        correct: false
    answer: On ne peut ni le désactiver ni lui injecter une dépendance.
  - key: code-ordre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var x = initialiser()

      func initialiser() int {
      	fmt.Println("variable")
      	return 1
      }

      func init() {
      	fmt.Println("init")
      }

      func main() {
      	fmt.Println("main", x)
      }
      ```
    choices:
      - text: |-
          ```
          variable
          init
          main 1
          ```
        correct: true
      - text: |-
          ```
          init
          variable
          main 1
          ```
        correct: false
      - text: |-
          ```
          variable
          main 1
          init
          ```
        correct: false
      - text: |-
          ```
          init
          main 0
          variable
          ```
        correct: false
    answer: "`variable`, `init`, puis `main 1` : les variables du package s'initialisent d'abord, puis `init`, puis `main`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nvar x = initialiser()\n\nfunc initialiser() int {\n\tfmt.Println(\"variable\")\n\treturn 1\n}\n\nfunc init() {\n\tfmt.Println(\"init\")\n}\n\nfunc main() {\n\tfmt.Println(\"main\", x)\n}"
      output: |-
        variable
        init
        main 1
  - key: code-dependances
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a = b + 1
      var b = 2

      func main() {
      	fmt.Println(a, b)
      }
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`0 2`", correct: false}
      - {text: "Ça ne compile pas : `b` est lue avant sa déclaration", correct: false}
    answer: "`3 2` : `b` est initialisée d'abord, parce que `a` en dépend. Au niveau du package, l'ordre suit les dépendances, pas l'ordre d'écriture."
    check:
      code: "package main\n\nimport \"fmt\"\n\nvar a = b + 1\nvar b = 2\n\nfunc main() {\n\tfmt.Println(a, b)\n}"
      output: 3 2
  - key: code-plusieurs-init
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func init() { fmt.Print("A") }
      func init() { fmt.Print("B") }

      func main() { fmt.Println("C") }
      ```
    choices:
      - {text: "`ABC`", correct: true}
      - {text: "`BAC`", correct: false}
      - {text: "`C`", correct: false}
      - {text: "Ça ne compile pas : `init` est déclarée deux fois", correct: false}
    answer: "`ABC` : les deux `init` s'exécutent dans l'ordre d'écriture, avant `main`. `init` est le seul nom qu'on peut déclarer plusieurs fois."
    check:
      code: |-
        package main

        import "fmt"

        func init() { fmt.Print("A") }
        func init() { fmt.Print("B") }

        func main() { fmt.Println("C") }
      output: ABC
  - key: code-appel-init
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func init() { fmt.Println("init") }

      func main() { init() }
      ```
    choices:
      - {text: "Ça ne compile pas : `undefined: init`", correct: true}
      - text: |-
          ```
          init
          init
          ```
        correct: false
      - {text: "`init`", correct: false}
      - {text: "`init`, puis une panic : `init` déjà exécutée", correct: false}
    answer: "Rien : le code ne compile pas, « undefined: init ». Seul le runtime appelle `init`."
    check:
      code: |-
        package main

        import "fmt"

        func init() { fmt.Println("init") }

        func main() { init() }
      compiles: false
  - key: bug-flag
    format: bug-fix
    question: |-
      L'option `-verbose` n'a jamais d'effet. Quelle correction est la bonne ?
      ```go
      var flagVerbose = flag.Bool("verbose", false, "logs détaillés")
      var verbose = *flagVerbose

      func main() {
      	flag.Parse()
      	if verbose { ... }
      }
      ```
    choices:
      - {text: "Lire `*flagVerbose` dans `main`, après `flag.Parse()`", correct: true}
      - {text: "Appeler `flag.Parse()` dans une fonction `init()`", correct: false}
      - {text: "Déclarer `verbose` avec `const` plutôt qu'avec `var`", correct: false}
      - {text: "Déplacer `flag.Parse()` à la dernière ligne de `main`", correct: false}
    answer: |-
      ```go
      var flagVerbose = flag.Bool("verbose", false, "logs détaillés")

      func main() {
      	flag.Parse()
      	if *flagVerbose { ... }
      }
      ```
      `verbose` était évaluée à l'initialisation du package, avant `flag.Parse()` et même avant toute `init` ; on lit le flag après l'analyse.
  - key: bug-init-reseau
    format: bug-fix
    question: |-
      Les tests unitaires du package échouent sur les postes sans accès à la base. Quelle correction est la bonne ?
      ```go
      var db *sql.DB

      func init() {
      	var err error
      	db, err = sql.Open("pgx", os.Getenv("DSN"))
      	if err == nil {
      		err = db.Ping()
      	}
      	if err != nil {
      		panic(err)
      	}
      }
      ```
    choices:
      - {text: "Ouvrir la base dans `main`, puis l'injecter dans un `Depot` par son constructeur", correct: true}
      - {text: "Remplacer `panic(err)` par `log.Println(err)`, pour laisser passer les tests", correct: false}
      - {text: "Ajouter un second `init` dans un fichier de test, qui s'exécute avant le premier", correct: false}
      - {text: "Lancer les tests avec `-short` sur les postes qui n'ont pas accès à la base", correct: false}
    answer: |-
      ```go
      type Depot struct{ db *sql.DB }

      func NouveauDepot(db *sql.DB) *Depot { return &Depot{db: db} }

      // dans main : ouvrir la base, vérifier, puis injecter
      ```
      L'`init` s'exécutait à chaque import, même pour les tests ; une dépendance injectée depuis `main` rend le code testable et l'erreur traitable. Journaliser l'erreur laisserait `db` inutilisable, en silence.
  - key: bug-ordre-fichiers
    format: bug-fix
    question: Le registre des formats dépend de l'ordre de deux `init` placés dans `a.go` et `z.go`, et un renommage de fichier a cassé le démarrage. Comment rendre l'ordre explicite ?
    choices:
      - {text: "Remplacer les deux `init` par un enregistrement explicite, appelé depuis `main` dans l'ordre voulu", correct: true}
      - {text: "Renommer les fichiers `01_a.go` et `02_z.go`, pour fixer l'ordre alphabétique", correct: false}
      - {text: "Ajouter un `time.Sleep` dans la seconde `init`, pour qu'elle passe après l'autre", correct: false}
      - {text: "Appeler la première `init` depuis la seconde, pour imposer l'ordre d'exécution", correct: false}
    answer: "Ne pas faire dépendre une `init` d'une autre : les remplacer par une seule fonction d'enregistrement appelée explicitement depuis `main` (`formats.Enregistrer(csv.Format, json.Format)`), dans l'ordre voulu. L'ordre des fichiers est un détail fragile, et `init` ne s'appelle pas ; un appel explicite se lit et se teste."
  - key: bug-env
    format: bug-fix
    question: |-
      Le port du serveur ne change pas quand on le fixe dans un test avec `t.Setenv`. Quelle correction est la bonne ?
      ```go
      var port = os.Getenv("PORT")
      ```
    choices:
      - {text: "Lire l'environnement dans une fonction, au moment où l'on a besoin du port", correct: true}
      - {text: "Appeler `os.Setenv` dans une fonction `init` du fichier de test", correct: false}
      - {text: "Déclarer `port` avec `const`, pour qu'elle suive l'environnement", correct: false}
      - {text: "Remplacer `os.Getenv` par `os.LookupEnv`, qui relit à chaque accès", correct: false}
    answer: |-
      ```go
      func portEcoute() string {
      	if p := os.Getenv("PORT"); p != "" {
      		return p
      	}
      	return "8080"
      }
      ```
      La variable de package était lue une seule fois, à l'initialisation, avant toute `init` ; une fonction lit l'environnement au moment où l'on en a besoin (ou mieux : la configuration est passée explicitement).
