notion: init-initialisation
lesson: "L'ordre d'initialisation d'un programme Go :\n\n1. Les **packages importés** sont initialisés d'abord, chacun une seule fois, dans l'ordre des dépendances.\n2. Dans un package, les **variables de package** sont initialisées dans l'ordre de leurs **dépendances** (une\n   variable qui en utilise une autre attend qu'elle soit prête), puis dans l'ordre d'apparition.\n3. Les fonctions **`init()`** du package s'exécutent ensuite, dans l'ordre des fichiers (triés par nom) et, dans un\n   fichier, dans l'ordre d'écriture.\n4. Enfin `main()` du package `main`.\n\n```go\nvar config = charger() // avant init\n\nfunc init() {\n\t// pas de paramètre, pas de retour ; il peut y en avoir plusieurs par package\n\tenregistrer(\"csv\", lireCSV)\n}\n```\n\n`init` ne peut pas être appelée explicitement. Usage légitime : enregistrer un pilote ou un format\n(`database/sql`, `image/png`), via `import _ \"pkg\"`.\n\nÀ éviter dans `init` : les entrées-sorties, l'accès au réseau, la lecture de variables d'environnement, ce qui peut\néchouer. Une erreur dans `init` ne peut que paniquer, rend les tests difficiles et ralentit chaque démarrage, même\npour `go test`. On préfère une initialisation **explicite** depuis `main`.\n\n**Piège classique** : une variable de package qui dépend d'un flag (`var verbose = *flagVerbose`). Elle est évaluée\navant `flag.Parse()`, donc toujours à la valeur par défaut.\n\n**En entretien** : « Imports, variables de package selon leurs dépendances, init, puis main ; init seulement pour des\nenregistrements sans effet de bord risqué ; le reste explicitement dans main. »"
cards:
  - key: quand-execute-init
    format: course
    question: Quand s'exécute init() ?
    answer: Après l'initialisation des variables du package et des dépendances, avant main.
  - key: sert-import-pkg
    format: course
    question: À quoi sert `import _ "pkg"` ?
    answer: Importer un package uniquement pour les effets de bord de son init (pilotes, pprof).
  - key: plusieurs-init
    format: course
    question: Un package peut-il avoir plusieurs fonctions `init` ?
    answer: Oui, même dans un seul fichier ; elles s'exécutent dans l'ordre des fichiers puis d'écriture.
  - key: appeler
    format: course
    question: Peut-on appeler `init()` soi-même ?
    answer: 'Non : le compilateur la refuse comme valeur ou appel ; elle n''est lancée que par le runtime.'
  - key: vf-ordre
    format: true-false
    question: Les variables de package sont initialisées avant les fonctions `init` du même package.
    truth: true
    answer: Puis viennent les `init`, puis `main`.
  - key: vf-imports
    format: true-false
    question: Les packages importés sont initialisés après le package qui les importe.
    truth: false
    answer: Ils le sont avant, chacun une seule fois.
  - key: vf-parametres
    format: true-false
    question: '`init` peut prendre des paramètres de configuration.'
    truth: false
    answer: '`init` n''a ni paramètre ni valeur de retour.'
  - key: vf-flag
    format: true-false
    question: '`var verbose = *flagVerbose` voit la valeur passée en ligne de commande.'
    truth: false
    answer: Elle est évaluée à l'initialisation du package, avant `flag.Parse()` dans `main`.
  - key: qcm-ordre
    format: multiple-choice
    question: Quel est l'ordre d'initialisation d'un programme ?
    choices:
      - text: Packages importés, variables de package, init, main
        correct: true
      - text: main, init, variables de package
        correct: false
      - text: init, variables de package, packages importés, main
        correct: false
      - text: Un ordre aléatoire
        correct: false
    answer: Les dépendances d'abord, puis le package lui-même.
  - key: qcm-legitime
    format: multiple-choice
    question: Quels usages de `init` sont raisonnables ?
    choices:
      - text: Enregistrer un pilote ou un décodeur dans un registre
        correct: true
      - text: Calculer une table de constantes en mémoire
        correct: true
      - text: Ouvrir une connexion à la base de données
        correct: false
      - text: Lire un fichier de configuration et paniquer s'il manque
        correct: false
    answer: Ce qui peut échouer ou dépendre de l'environnement se fait explicitement depuis `main`.
  - key: qcm-dependances
    format: multiple-choice
    question: Avec `var a = b + 1` puis `var b = 2` dans le même fichier, que vaut `a` ?
    choices:
      - text: '3'
        correct: true
      - text: '1'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Les variables de package sont initialisées selon leurs dépendances, pas seulement dans l'ordre du texte.
  - key: qcm-tests
    format: multiple-choice
    question: Pourquoi un `init` qui se connecte au réseau gêne-t-il les tests ?
    choices:
      - text: Il s'exécute à chaque `go test` du package, avant tout test
        correct: true
      - text: Une erreur ne peut que paniquer, sans être testée proprement
        correct: true
      - text: '`go test` ignore les fonctions init'
        correct: false
      - text: Il rend le package impossible à importer
        correct: false
    answer: On ne peut ni le désactiver ni lui injecter une dépendance.
  - key: code-ordre
    format: code-output
    question: "```go\nvar x = initialiser()\n\nfunc initialiser() int {\n\tfmt.Println(\"variable\")\n\treturn 1\n}\n\nfunc init() {\n\tfmt.Println(\"init\")\n}\n\nfunc main() {\n\tfmt.Println(\"main\", x)\n}\n```"
    answer: '`variable`, `init`, puis `main 1`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nvar x = initialiser()\n\nfunc initialiser() int {\n\tfmt.Println(\"variable\")\n\treturn 1\n}\n\nfunc init() {\n\tfmt.Println(\"init\")\n}\n\nfunc main() {\n\tfmt.Println(\"main\", x)\n}"
      output: |-
        variable
        init
        main 1
  - key: code-dependances
    format: code-output
    question: "```go\nvar a = b + 1\nvar b = 2\n\nfunc main() {\n\tfmt.Println(a, b)\n}\n```"
    answer: '`3 2` : `b` est initialisée d''abord, parce que `a` en dépend.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nvar a = b + 1\nvar b = 2\n\nfunc main() {\n\tfmt.Println(a, b)\n}"
      output: 3 2
  - key: code-plusieurs-init
    format: code-output
    question: |-
      ```go
      func init() { fmt.Print("A") }
      func init() { fmt.Print("B") }

      func main() { fmt.Println("C") }
      ```
    answer: '`ABC` : les deux `init` s''exécutent dans l''ordre d''écriture, avant `main`.'
    check:
      code: |-
        package main

        import "fmt"

        func init() { fmt.Print("A") }
        func init() { fmt.Print("B") }

        func main() { fmt.Println("C") }
      output: ABC
  - key: code-appel-init
    format: code-output
    question: |-
      ```go
      func init() { fmt.Println("init") }

      func main() { init() }
      ```
    answer: 'Rien : le code ne compile pas, « undefined: init ».'
    check:
      code: |-
        package main

        import "fmt"

        func init() { fmt.Println("init") }

        func main() { init() }
      compiles: false
  - key: bug-flag
    format: bug-fix
    question: "L'option `-verbose` n'a jamais d'effet :\n```go\nvar flagVerbose = flag.Bool(\"verbose\", false, \"logs détaillés\")\nvar verbose = *flagVerbose\n\nfunc main() {\n\tflag.Parse()\n\tif verbose { ... }\n}\n```"
    answer: "```go\nvar flagVerbose = flag.Bool(\"verbose\", false, \"logs détaillés\")\n\nfunc main() {\n\tflag.Parse()\n\tif *flagVerbose { ... }\n}\n```\n`verbose` était évaluée à l'initialisation, avant `flag.Parse()` ; on lit le flag après l'analyse."
  - key: bug-init-reseau
    format: bug-fix
    question: "Les tests unitaires du package échouent sur les postes sans accès à la base :\n```go\nvar db *sql.DB\n\nfunc init() {\n\tvar err error\n\tdb, err = sql.Open(\"pgx\", os.Getenv(\"DSN\"))\n\tif err == nil {\n\t\terr = db.Ping()\n\t}\n\tif err != nil {\n\t\tpanic(err)\n\t}\n}\n```"
    answer: |-
      ```go
      type Depot struct{ db *sql.DB }

      func NouveauDepot(db *sql.DB) *Depot { return &Depot{db: db} }

      // dans main : ouvrir la base, vérifier, puis injecter
      ```
      L'`init` s'exécutait à chaque import, même pour les tests ; une dépendance injectée depuis `main` rend le code
      testable et l'erreur traitable.
  - key: bug-ordre-fichiers
    format: bug-fix
    question: Le registre des formats dépend de l'ordre de deux `init` placés dans `a.go` et `z.go`, et un renommage de fichier a cassé le démarrage. Comment rendre l'ordre explicite ?
    answer: |-
      Ne pas faire dépendre une `init` d'une autre : remplacer les deux par une seule fonction d'enregistrement appelée
      explicitement depuis `main` (`formats.Enregistrer(csv.Format, json.Format)`), dans l'ordre voulu. L'ordre des
      fichiers est un détail fragile ; un appel explicite se lit et se teste.
  - key: bug-env
    format: bug-fix
    question: |-
      Le port du serveur ne change pas quand on le fixe dans un test avec `t.Setenv` :
      ```go
      var port = os.Getenv("PORT")
      ```
    answer: "```go\nfunc portEcoute() string {\n\tif p := os.Getenv(\"PORT\"); p != \"\" {\n\t\treturn p\n\t}\n\treturn \"8080\"\n}\n```\nLa variable de package était lue une seule fois, à l'initialisation ; une fonction lit l'environnement au moment\noù l'on en a besoin (ou mieux : la configuration est passée explicitement)."
