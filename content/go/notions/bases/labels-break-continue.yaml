notion: labels-break-continue
lesson: "`break` et `continue` agissent sur la boucle (ou le `switch`/`select`) **la plus proche**. Pour viser une boucle\nexterne, on lui donne un **label** :\n\n```go\nrecherche:\n\tfor i, ligne := range grille {\n\t\tfor j, v := range ligne {\n\t\t\tif v == cible {\n\t\t\t\tfmt.Println(\"trouvé en\", i, j)\n\t\t\t\tbreak recherche // sort des deux boucles\n\t\t\t}\n\t\t\tif v < 0 {\n\t\t\t\tcontinue recherche // passe à la ligne suivante\n\t\t\t}\n\t\t}\n\t}\n```\n\n- Un label se place juste avant l'instruction `for`, `switch` ou `select`, suivi de `:`.\n- `break label` sort de l'instruction étiquetée ; `continue label` passe à l'itération suivante de la boucle\n  étiquetée.\n- C'est l'outil indispensable pour sortir d'une boucle depuis un **`select`** ou un **`switch`**, où `break` seul ne\n  sort que du `select`/`switch`.\n- Un label inutilisé est une **erreur de compilation**.\n- `goto` existe, avec des restrictions (pas de saut dans un bloc, ni par-dessus une déclaration) ; il est très rare\n  dans du code applicatif.\n\nSouvent, extraire la double boucle dans une **fonction** et faire `return` est plus lisible qu'un label.\n\n**Piège classique** : un `select` dans un `for` avec `break` dans un case pour arrêter la boucle. Le `break` ne sort que\ndu `select`, et la boucle tourne indéfiniment.\n\n**En entretien** : « break et continue visent la boucle la plus proche ; un label permet de viser une boucle externe,\nindispensable depuis un select ; une fonction avec return est souvent plus claire. »"
cards:
  - key: select
    format: course
    question: Pourquoi un label est-il souvent nécessaire avec `select` ?
    choices:
      - {text: "`break` dans un `case` ne sort que du `select`, pas de la boucle `for` autour", correct: true}
      - {text: "Un `break` sans label ne compile pas dans un `select`", correct: false}
      - {text: "Un label permet au `select` d'attendre plusieurs channels à la fois", correct: false}
      - {text: "`break` dans un `select` quitte la fonction entière : le label le limite", correct: false}
    answer: "Parce que `break` dans un case de `select` ne sort que du `select` ; pour arrêter la boucle `for` qui l'entoure, il faut `break label` ou un `return`."
  - key: continue-label
    format: course
    question: Que fait `continue externe` dans une boucle imbriquée ?
    choices:
      - {text: "Il abandonne la boucle interne et passe au tour suivant de la boucle `externe`", correct: true}
      - {text: "Il passe au tour suivant de la boucle interne, comme un `continue` simple", correct: false}
      - {text: "Il sort des deux boucles, exactement comme un `break externe`", correct: false}
      - {text: "Il recommence la boucle `externe` depuis son premier tour", correct: false}
    answer: "Il abandonne l'itération de la boucle interne et passe à l'itération suivante de la boucle étiquetée `externe`, sans la recommencer."
  - key: alternative
    format: course
    question: Quelle alternative plus lisible à un label pour sortir de deux boucles ?
    choices:
      - {text: "Extraire les boucles dans une fonction, et en sortir par `return`", correct: true}
      - {text: "Lever une panic dans la boucle interne, rattrapée par `recover`", correct: false}
      - {text: "Sauter à la fin de la fonction avec un `goto` placé dans la boucle", correct: false}
      - {text: "Écrire `break break`, qui sort de deux niveaux de boucle d'un coup", correct: false}
    answer: "Extraire les boucles dans une fonction et en sortir par `return` : la fonction porte un nom, et sa sortie se lit d'un coup d'œil. Une panic n'est pas un moyen de contrôle du flux."
  - key: goto
    format: course
    question: Go a-t-il `goto` ?
    choices:
      - {text: "Oui, avec des restrictions ; il est très rare hors du code généré", correct: true}
      - {text: "Non : il a été retiré du langage avant Go 1.0", correct: false}
      - {text: "Oui, sans aucune restriction, comme en C", correct: false}
      - {text: "Non, mais `jump label` en tient lieu", correct: false}
    answer: "Oui, avec des restrictions (pas de saut dans un bloc ni par-dessus une déclaration de variable) ; il est très rare hors du code généré."
  - key: vf-break-imbrique
    format: true-false
    question: Dans deux boucles imbriquées, `break` dans la boucle interne sort des deux.
    truth: false
    answer: Il ne sort que de la boucle la plus proche ; il faut un label pour l'externe.
  - key: vf-label-inutilise
    format: true-false
    question: Un label déclaré mais jamais utilisé empêche la compilation.
    truth: true
    answer: « label defined and not used ».
  - key: vf-select
    format: true-false
    question: '`break` dans un case de `select` sort de la boucle `for` qui contient le `select`.'
    truth: false
    answer: Il ne sort que du `select`.
  - key: vf-goto
    format: true-false
    question: '`goto` peut sauter à l''intérieur d''un autre bloc.'
    truth: false
    answer: Le saut dans un bloc est interdit, comme le saut par-dessus une déclaration.
  - key: qcm-sortir
    format: multiple-choice
    question: "Lesquelles de ces instructions, écrites dans un `case` de `select`, font sortir de la boucle `for` qui l'entoure ?"
    choices:
      - text: '`break boucle` avec le label `boucle:` sur le for'
        correct: true
      - text: '`return` si l''on peut quitter la fonction'
        correct: true
      - text: '`break`'
        correct: false
      - text: '`continue`'
        correct: false
    answer: '`continue` sans label passe à l''itération suivante du for, il ne sort pas.'
  - key: qcm-placement
    format: multiple-choice
    question: Où se place un label ?
    choices:
      - text: Juste avant l'instruction for, switch ou select qu'il nomme
        correct: true
      - text: Dans le corps de la boucle
        correct: false
      - text: Après l'accolade fermante
        correct: false
      - text: N'importe où dans la fonction pour break
        correct: false
    answer: '`nom:` puis l''instruction, en général sur la ligne au-dessus.'
  - key: qcm-continue
    format: multiple-choice
    question: "Dans une grille, quelle instruction ignore le reste d'une ligne dès qu'une valeur est négative ?"
    choices:
      - {text: "`continue lignes`, avec le label sur la boucle des lignes", correct: true}
      - {text: "`continue`, dans la boucle des colonnes", correct: false}
      - {text: "`return`, dans la boucle des colonnes", correct: false}
      - {text: "`goto` vers la fin du programme", correct: false}
    answer: "`continue lignes` passe à la ligne suivante ; un `break` dans la boucle des colonnes reviendrait ici au même. Le `continue` interne passe juste à la colonne suivante, et `return` quitterait toute la fonction."
  - key: qcm-lisibilite
    format: multiple-choice
    question: "Dans lequel de ces cas un label est-il justifié ?"
    choices:
      - {text: "Pour sortir d'une boucle `for` depuis un `select` ou un `switch`", correct: true}
      - {text: "Pour écrire une boucle infinie, qui sinon n'aurait pas de fin", correct: false}
      - {text: "Pour nommer une boucle, afin de documenter son rôle", correct: false}
      - {text: "Pour remplacer une fonction appelée à plusieurs endroits", correct: false}
    answer: "Pour sortir d'une boucle depuis un `select` ou un `switch`, ou de boucles imbriquées quand une fonction séparée serait artificielle. Un label qui ne sert à aucun `break` ou `continue` ne compile même pas."
  - key: code-break-label
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      externe:
      	for i := range 3 {
      		for j := range 3 {
      			if j == 1 {
      				continue externe
      			}
      			if i == 2 {
      				break externe
      			}
      			fmt.Printf("%d%d ", i, j)
      		}
      	}
      fmt.Println()
      ```
    choices:
      - {text: "`00 10`", correct: true}
      - {text: "`00 10 20`", correct: false}
      - {text: "`00 01 10 11`", correct: false}
      - {text: "`00`", correct: false}
    answer: "`00 10` : pour chaque ligne, j=0 s'affiche puis `continue externe` passe à la ligne suivante ; à i=2, `break externe` arrête tout."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\texterne:\n\t\tfor i := range 3 {\n\t\t\tfor j := range 3 {\n\t\t\t\tif j == 1 {\n\t\t\t\t\tcontinue externe\n\t\t\t\t}\n\t\t\t\tif i == 2 {\n\t\t\t\t\tbreak externe\n\t\t\t\t}\n\t\t\t\tfmt.Printf(\"%d%d \", i, j)\n\t\t\t}\n\t\t}\n\tfmt.Println()\n}\n"
      output: 00 10
  - key: code-break-simple
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i := range 3 {
      	for j := range 3 {
      		if j == 1 {
      			break
      		}
      		fmt.Printf("%d%d ", i, j)
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`00 10 20`", correct: true}
      - {text: "`00`", correct: false}
      - {text: "`00 10`", correct: false}
      - {text: "`00 02 10 12 20 22`", correct: false}
    answer: "`00 10 20` : `break` ne sort que de la boucle interne ; la boucle externe continue."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range 3 {\n\t\tfor j := range 3 {\n\t\t\tif j == 1 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tfmt.Printf(\"%d%d \", i, j)\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: 00 10 20
  - key: code-select
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      close(ch)
      n := 0
      boucle:
      	for {
      		select {
      		case _, ok := <-ch:
      			if !ok {
      				break boucle
      			}
      			n++
      		}
      	}
      fmt.Println(n)
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien : la boucle tourne sans fin", correct: false}
    answer: "`2` : deux valeurs sont lues, puis le channel fermé donne `ok` à false, et le label permet de sortir de la boucle depuis le `select`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tclose(ch)\n\tn := 0\n\tboucle:\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase _, ok := <-ch:\n\t\t\t\tif !ok {\n\t\t\t\t\tbreak boucle\n\t\t\t\t}\n\t\t\t\tn++\n\t\t\t}\n\t\t}\n\tfmt.Println(n)\n}\n"
      output: '2'
  - key: code-label-inutilise
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fin:
      	for i := range 2 {
      		fmt.Println(i)
      	}
      ```
    choices:
      - {text: "Ça ne compile pas : `label fin defined and not used`", correct: true}
      - text: |-
          ```
          0
          1
          ```
        correct: false
      - text: |-
          ```
          0
          1
          2
          ```
        correct: false
      - {text: "Rien : le label `fin` arrête la boucle avant son premier tour", correct: false}
    answer: "Rien : le code ne compile pas, « label fin defined and not used ». Un label inutilisé est une erreur, comme une variable."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfin:\n\t\tfor i := range 2 {\n\t\t\tfmt.Println(i)\n\t\t}\n}\n"
      compiles: false
  - key: bug-select
    format: bug-fix
    question: |-
      Le worker ne s'arrête jamais quand on annule le contexte. Quelle correction est la bonne ?
      ```go
      for {
      	select {
      	case <-ctx.Done():
      		break
      	case job := <-jobs:
      		traiter(job)
      	}
      }
      ```
    choices:
      - {text: "Remplacer `break` par `return`, ou par un `break` vers un label sur le `for`", correct: true}
      - {text: "Remplacer `break` par `continue`, qui sort de la boucle `for`", correct: false}
      - {text: "Ajouter un `default` au `select`, pour que le `break` atteigne le `for`", correct: false}
      - {text: "Placer le `case <-ctx.Done()` en dernier, pour le rendre prioritaire", correct: false}
    answer: |-
      ```go
      for {
      	select {
      	case <-ctx.Done():
      		return
      	case job := <-jobs:
      		traiter(job)
      	}
      }
      ```
      `break` ne sortait que du `select` ; `return` (ou `break` vers un label sur le `for`) arrête vraiment. L'ordre des `case` ne donne aucune priorité.
  - key: bug-double-boucle
    format: bug-fix
    question: |-
      La recherche continue après avoir trouvé la valeur. Quelle correction est la bonne ?
      ```go
      for i := range grille {
      	for j := range grille[i] {
      		if grille[i][j] == cible {
      			pos = [2]int{i, j}
      			break
      		}
      	}
      }
      ```
    choices:
      - {text: "Extraire la recherche dans une fonction qui renvoie la position par `return`", correct: true}
      - {text: "Remplacer `break` par `continue`, qui passe directement à la ligne suivante", correct: false}
      - {text: "Ajouter un second `break` juste après le premier, pour sortir des deux boucles", correct: false}
      - {text: "Parcourir les valeurs plutôt que les indices, avec `for _, v := range`", correct: false}
    answer: |-
      ```go
      func trouver(grille [][]int, cible int) (int, int, bool) {
      	for i := range grille {
      		for j := range grille[i] {
      			if grille[i][j] == cible {
      				return i, j, true
      			}
      		}
      	}
      	return 0, 0, false
      }
      ```
      `break` ne sortait que de la boucle interne, et un second `break` ne serait jamais atteint. Une fonction avec `return` est plus claire qu'un label.
  - key: bug-continue
    format: bug-fix
    question: |-
      Les commandes invalides sont quand même envoyées. Quelle correction est la bonne ?
      ```go
      for _, c := range commandes {
      	for _, l := range c.Lignes {
      		if l.Quantite <= 0 {
      			continue
      		}
      	}
      	envoyer(c)
      }
      ```
    choices:
      - {text: "Un label `commandes:` sur la boucle externe, et `continue commandes`", correct: true}
      - {text: "Remplacer `continue` par `break`, qui saute la commande entière", correct: false}
      - {text: "Déplacer `envoyer(c)` dans la boucle interne, après le `if`", correct: false}
      - {text: "Remplacer `continue` par `return`, pour ignorer la commande", correct: false}
    answer: |-
      ```go
      commandes:
      	for _, c := range commandes {
      		for _, l := range c.Lignes {
      			if l.Quantite <= 0 {
      				continue commandes
      			}
      		}
      		envoyer(c)
      	}
      ```
      Le `continue` interne passait seulement à la ligne suivante ; `continue commandes` saute la commande invalide. Un `break` sortirait de la boucle des lignes, mais `envoyer(c)` s'exécuterait encore.
  - key: bug-label-inutilise
    format: bug-fix
    question: "Après un refactoring, le compilateur signale « label boucle defined and not used ». Que fais-tu ?"
    choices:
      - {text: "Retirer le label `boucle:`, qui ne sert plus à aucun `break` ni `continue`", correct: true}
      - {text: "Ajouter `_ = boucle`, pour que le label compte comme utilisé", correct: false}
      - {text: "Ajouter un `goto boucle` à la fin de la boucle, pour l'utiliser", correct: false}
      - {text: "Désactiver l'erreur avec un commentaire `//go:nolabelcheck`", correct: false}
    answer: "Retirer le label `boucle:` s'il n'a plus de `break boucle` ou `continue boucle`. Un label inutilisé est une erreur, comme une variable ou un import inutilisé ; un label n'est pas une valeur, et un `goto` ajouté changerait le comportement."
