notion: labels-break-continue
lesson: "`break` et `continue` agissent sur la boucle (ou le `switch`/`select`) **la plus proche**. Pour viser une boucle\nexterne, on lui donne un **label** :\n\n```go\nrecherche:\n\tfor i, ligne := range grille {\n\t\tfor j, v := range ligne {\n\t\t\tif v == cible {\n\t\t\t\tfmt.Println(\"trouvé en\", i, j)\n\t\t\t\tbreak recherche // sort des deux boucles\n\t\t\t}\n\t\t\tif v < 0 {\n\t\t\t\tcontinue recherche // passe à la ligne suivante\n\t\t\t}\n\t\t}\n\t}\n```\n\n- Un label se place juste avant l'instruction `for`, `switch` ou `select`, suivi de `:`.\n- `break label` sort de l'instruction étiquetée ; `continue label` passe à l'itération suivante de la boucle\n  étiquetée.\n- C'est l'outil indispensable pour sortir d'une boucle depuis un **`select`** ou un **`switch`**, où `break` seul ne\n  sort que du `select`/`switch`.\n- Un label inutilisé est une **erreur de compilation**.\n- `goto` existe, avec des restrictions (pas de saut dans un bloc, ni par-dessus une déclaration) ; il est très rare\n  dans du code applicatif.\n\nSouvent, extraire la double boucle dans une **fonction** et faire `return` est plus lisible qu'un label.\n\n**Piège classique** : un `select` dans un `for` avec `break` dans un case pour arrêter la boucle. Le `break` ne sort que\ndu `select`, et la boucle tourne indéfiniment.\n\n**En entretien** : « break et continue visent la boucle la plus proche ; un label permet de viser une boucle externe,\nindispensable depuis un select ; une fonction avec return est souvent plus claire. »"
cards:
  - key: select
    format: course
    question: Pourquoi un label est-il souvent nécessaire avec `select` ?
    answer: Parce que `break` dans un case de `select` ne sort que du `select` ; pour arrêter la boucle `for` qui l'entoure, il faut `break label` ou un `return`.
  - key: continue-label
    format: course
    question: Que fait `continue externe` dans une boucle imbriquée ?
    answer: Il abandonne l'itération de la boucle interne et passe à l'itération suivante de la boucle étiquetée `externe`.
  - key: alternative
    format: course
    question: Quelle alternative plus lisible à un label pour sortir de deux boucles ?
    answer: Extraire les boucles dans une fonction et en sortir par `return`.
  - key: goto
    format: course
    question: Go a-t-il `goto` ?
    answer: Oui, avec des restrictions (pas de saut dans un bloc ni par-dessus une déclaration de variable) ; il est très rare hors du code généré.
  - key: vf-break-imbrique
    format: true-false
    question: Dans deux boucles imbriquées, `break` dans la boucle interne sort des deux.
    truth: false
    answer: Il ne sort que de la boucle la plus proche ; il faut un label pour l'externe.
  - key: vf-label-inutilise
    format: true-false
    question: Un label déclaré mais jamais utilisé empêche la compilation.
    truth: true
    answer: « label defined and not used ».
  - key: vf-select
    format: true-false
    question: '`break` dans un case de `select` sort de la boucle `for` qui contient le `select`.'
    truth: false
    answer: Il ne sort que du `select`.
  - key: vf-goto
    format: true-false
    question: '`goto` peut sauter à l''intérieur d''un autre bloc.'
    truth: false
    answer: Le saut dans un bloc est interdit, comme le saut par-dessus une déclaration.
  - key: qcm-sortir
    format: multiple-choice
    question: Comment sortir d'une boucle `for` depuis un case de `select` ?
    choices:
      - text: '`break boucle` avec le label `boucle:` sur le for'
        correct: true
      - text: '`return` si l''on peut quitter la fonction'
        correct: true
      - text: '`break`'
        correct: false
      - text: '`continue`'
        correct: false
    answer: '`continue` sans label passe à l''itération suivante du for, il ne sort pas.'
  - key: qcm-placement
    format: multiple-choice
    question: Où se place un label ?
    choices:
      - text: Juste avant l'instruction for, switch ou select qu'il nomme
        correct: true
      - text: Dans le corps de la boucle
        correct: false
      - text: Après l'accolade fermante
        correct: false
      - text: N'importe où dans la fonction pour break
        correct: false
    answer: '`nom:` puis l''instruction, en général sur la ligne au-dessus.'
  - key: qcm-continue
    format: multiple-choice
    question: Dans une grille, comment ignorer le reste d'une ligne dès qu'une valeur est négative ?
    choices:
      - text: '`continue lignes` avec le label sur la boucle des lignes'
        correct: true
      - text: '`break` dans la boucle des colonnes'
        correct: true
      - text: '`continue` dans la boucle des colonnes'
        correct: false
      - text: '`goto` vers la fin du programme'
        correct: false
    answer: Le `break` interne sort de la boucle des colonnes, ce qui revient ici au même ; le `continue` interne passe juste à la colonne suivante.
  - key: qcm-lisibilite
    format: multiple-choice
    question: Quand un label est-il justifié ?
    choices:
      - text: Pour sortir d'une boucle depuis un select ou un switch
        correct: true
      - text: Pour sortir de boucles imbriquées quand une fonction séparée serait artificielle
        correct: true
      - text: Pour remplacer toutes les fonctions
        correct: false
      - text: Pour faire des boucles infinies
        correct: false
    answer: Sinon, une fonction avec `return` se lit mieux.
  - key: code-break-label
    format: code-output
    question: "```go\nexterne:\n\tfor i := range 3 {\n\t\tfor j := range 3 {\n\t\t\tif j == 1 {\n\t\t\t\tcontinue externe\n\t\t\t}\n\t\t\tif i == 2 {\n\t\t\t\tbreak externe\n\t\t\t}\n\t\t\tfmt.Printf(\"%d%d \", i, j)\n\t\t}\n\t}\nfmt.Println()\n```"
    answer: '`00 10` : pour chaque ligne, j=0 s''affiche puis `continue externe` passe à la ligne suivante ; à i=2, `break externe` arrête tout.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\texterne:\n\t\tfor i := range 3 {\n\t\t\tfor j := range 3 {\n\t\t\t\tif j == 1 {\n\t\t\t\t\tcontinue externe\n\t\t\t\t}\n\t\t\t\tif i == 2 {\n\t\t\t\t\tbreak externe\n\t\t\t\t}\n\t\t\t\tfmt.Printf(\"%d%d \", i, j)\n\t\t\t}\n\t\t}\n\tfmt.Println()\n}\n"
      output: 00 10
  - key: code-break-simple
    format: code-output
    question: "```go\nfor i := range 3 {\n\tfor j := range 3 {\n\t\tif j == 1 {\n\t\t\tbreak\n\t\t}\n\t\tfmt.Printf(\"%d%d \", i, j)\n\t}\n}\nfmt.Println()\n```"
    answer: '`00 10 20` : `break` ne sort que de la boucle interne.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor i := range 3 {\n\t\tfor j := range 3 {\n\t\t\tif j == 1 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tfmt.Printf(\"%d%d \", i, j)\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: 00 10 20
  - key: code-select
    format: code-output
    question: "```go\nch := make(chan int, 3)\nch <- 1\nch <- 2\nclose(ch)\nn := 0\nboucle:\n\tfor {\n\t\tselect {\n\t\tcase _, ok := <-ch:\n\t\t\tif !ok {\n\t\t\t\tbreak boucle\n\t\t\t}\n\t\t\tn++\n\t\t}\n\t}\nfmt.Println(n)\n```"
    answer: '`2` : le label permet de sortir de la boucle depuis le select quand le channel est fermé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tclose(ch)\n\tn := 0\n\tboucle:\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase _, ok := <-ch:\n\t\t\t\tif !ok {\n\t\t\t\t\tbreak boucle\n\t\t\t\t}\n\t\t\t\tn++\n\t\t\t}\n\t\t}\n\tfmt.Println(n)\n}\n"
      output: '2'
  - key: code-label-inutilise
    format: code-output
    question: "```go\nfin:\n\tfor i := range 2 {\n\t\tfmt.Println(i)\n\t}\n```"
    answer: 'Rien : le code ne compile pas, « label fin defined and not used ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfin:\n\t\tfor i := range 2 {\n\t\t\tfmt.Println(i)\n\t\t}\n}\n"
      compiles: false
  - key: bug-select
    format: bug-fix
    question: "Le worker ne s'arrête jamais quand on annule le contexte :\n```go\nfor {\n\tselect {\n\tcase <-ctx.Done():\n\t\tbreak\n\tcase job := <-jobs:\n\t\ttraiter(job)\n\t}\n}\n```"
    answer: "```go\nfor {\n\tselect {\n\tcase <-ctx.Done():\n\t\treturn\n\tcase job := <-jobs:\n\t\ttraiter(job)\n\t}\n}\n```\n`break` ne sortait que du `select` ; `return` (ou `break` vers un label sur le `for`) arrête vraiment."
  - key: bug-double-boucle
    format: bug-fix
    question: "La recherche continue après avoir trouvé la valeur :\n```go\nfor i := range grille {\n\tfor j := range grille[i] {\n\t\tif grille[i][j] == cible {\n\t\t\tpos = [2]int{i, j}\n\t\t\tbreak\n\t\t}\n\t}\n}\n```"
    answer: "```go\nfunc trouver(grille [][]int, cible int) (int, int, bool) {\n\tfor i := range grille {\n\t\tfor j := range grille[i] {\n\t\t\tif grille[i][j] == cible {\n\t\t\t\treturn i, j, true\n\t\t\t}\n\t\t}\n\t}\n\treturn 0, 0, false\n}\n```\n`break` ne sortait que de la boucle interne. Une fonction avec `return` est plus claire qu'un label."
  - key: bug-continue
    format: bug-fix
    question: "Les commandes invalides sont quand même envoyées :\n```go\nfor _, c := range commandes {\n\tfor _, l := range c.Lignes {\n\t\tif l.Quantite <= 0 {\n\t\t\tcontinue\n\t\t}\n\t}\n\tenvoyer(c)\n}\n```"
    answer: "```go\ncommandes:\n\tfor _, c := range commandes {\n\t\tfor _, l := range c.Lignes {\n\t\t\tif l.Quantite <= 0 {\n\t\t\t\tcontinue commandes\n\t\t\t}\n\t\t}\n\t\tenvoyer(c)\n\t}\n```\nLe `continue` interne passait seulement à la ligne suivante ; `continue commandes` saute la commande invalide."
  - key: bug-label-inutilise
    format: bug-fix
    question: Après un refactoring, le compilateur signale « label boucle defined and not used ». Que faire ?
    answer: |-
      Retirer le label `boucle:` s'il n'a plus de `break boucle` ou `continue boucle`. Un label inutilisé est une
      erreur, comme une variable ou un import inutilisé.
