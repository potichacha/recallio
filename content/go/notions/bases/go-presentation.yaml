notion: go-presentation
lesson: |-
  **Go** est un langage créé chez Google en 2007 par Robert Griesemer, Rob Pike et Ken Thompson, rendu public en 2009,
  stable depuis Go 1.0 (2012). Il est né d'un constat : les builds C++ étaient lents, le code difficile à lire à grande
  échelle, et la concurrence pénible à écrire.

  Ses choix :
  - **compilé en code natif**, en un seul binaire statique, sans machine virtuelle ni dépendances à installer ;
  - **compilation très rapide**, grâce à des dépendances explicites et sans en-têtes ;
  - un **garbage collector** concurrent, à faibles pauses ;
  - une **concurrence intégrée** au langage : les goroutines et les channels ;
  - un langage **petit** (25 mots-clés), une seule façon de formater (`gofmt`), peu de magie ;
  - une **bibliothèque standard** riche (HTTP, JSON, crypto, tests) et une chaîne d'outils unique (`go`).

  Ce que Go n'a **pas**, volontairement : ni classes ni héritage (des structs, des méthodes et des interfaces), ni
  exceptions (les erreurs sont des valeurs), ni surcharge de fonctions.

  Où on le trouve : le cloud et l'infrastructure (Docker, Kubernetes, Terraform, Prometheus, etcd), les services réseau,
  les outils en ligne de commande.

  **Piège classique** : présenter Go comme « un C moderne » ou « un Java simplifié ». Il a son propre modèle :
  composition, interfaces implicites, erreurs explicites, concurrence par messages.

  **En entretien** : « Un langage compilé, simple et rapide à builder, avec un GC et une concurrence intégrée, pensé pour
  de grandes équipes et des services réseau ; on gagne en lisibilité et en déploiement ce qu'on perd en expressivité. »
tour:
  - title: Bienvenue
    text: |-
      Bienvenue dans le Tour de Go. Chaque page présente une notion en quelques lignes, avec un programme que tu peux
      **modifier et exécuter** ici même : change-le, casse-le, regarde ce que répond le compilateur. Rien ne s'installe
      sur ta machine.

      Go est né chez Google et a été rendu public en 2009. C'est un langage **compilé** : le programme devient un
      exécutable natif, sans machine virtuelle. Il a un **ramasse-miettes** (*garbage collector*), comme Java, et la
      **concurrence** fait partie du langage. Il est volontairement **petit** : 25 mots-clés, et une seule façon de
      formater le code.

      Ce Tour suppose que tu programmes déjà dans un autre langage. Les questions à la fin de chaque notion vérifient ce
      que tu viens de voir, et « S'entraîner » ouvre les cartes de la notion, que la révision espacée te fera revoir.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println("Bienvenue dans le Tour de Go !")
          	fmt.Println("Modifie ce programme, puis exécute-le.")
          }
      output: |-
        Bienvenue dans le Tour de Go !
        Modifie ce programme, puis exécute-le.
cards:
  - key: cree
    format: course
    question: Qui a créé Go et pourquoi ?
    choices:
      - {text: "Griesemer, Pike et Thompson chez Google, pour des builds rapides et une concurrence simple", correct: true}
      - {text: "James Gosling chez Sun, pour remplacer C++ sur les appareils embarqués et le web", correct: false}
      - {text: "Graydon Hoare chez Mozilla, pour un langage système sûr sans ramasse-miettes", correct: false}
      - {text: "Une fondation open source, pour unifier les langages de script du cloud", correct: false}
    answer: "Robert Griesemer, Rob Pike et Ken Thompson chez Google (2007, public en 2009), pour des builds rapides, un code lisible à grande échelle et une concurrence simple. Gosling a créé Java, Hoare Rust."
  - key: combien-mots-cles
    format: course
    question: "Combien de mots-clés le langage Go compte-t-il ?"
    choices:
      - {text: "25", correct: true}
      - {text: "Une cinquantaine, comme Java", correct: false}
      - {text: "35, comme Python", correct: false}
      - {text: "Plus de 80, comme C++", correct: false}
    answer: "25, soit deux fois moins que Java : Go se veut petit, au point qu'on peut lire sa spécification en entier."
  - key: outils-distribues-celebres-sont-ecrits
    format: course
    question: "Quelle liste ne contient que des outils distribués écrits en Go ?"
    choices:
      - {text: "Kubernetes, etcd, Consul, Prometheus, Docker", correct: true}
      - {text: "Kafka, ZooKeeper, Cassandra, Elasticsearch", correct: false}
      - {text: "Redis, Nginx, PostgreSQL, HAProxy", correct: false}
      - {text: "Spark, Akka, Flink, Hadoop", correct: false}
    answer: "Kubernetes, etcd, Consul, NATS, Temporal, Prometheus, Docker sont écrits en Go. Kafka, Cassandra et Hadoop sont en Java ou Scala, Redis et Nginx en C."
  - key: pourquoi-binaire-statique
    format: course
    question: Pourquoi un programme Go est-il simple à déployer ?
    choices:
      - {text: "Il est compilé en un seul binaire natif, runtime et GC compris, sans VM à installer", correct: true}
      - {text: "Il est livré avec une machine virtuelle légère, installée avec le programme", correct: false}
      - {text: "Il s'exécute dans un conteneur que la chaîne d'outils Go impose", correct: false}
      - {text: "Il se compile sur la machine cible au premier lancement, comme un script", correct: false}
    answer: "Il est compilé en un seul binaire natif, le plus souvent statique, qui contient le runtime et le GC ; il n'y a ni machine virtuelle ni bibliothèque à installer sur la machine cible."
  - key: vf-vm
    format: true-false
    question: Un programme Go s'exécute dans une machine virtuelle, comme Java.
    truth: false
    answer: Il est compilé en code machine natif ; le runtime (ordonnanceur, GC) est inclus dans le binaire.
  - key: vf-gc
    format: true-false
    question: Go gère la mémoire avec un garbage collector.
    truth: true
    answer: Un GC concurrent, à faibles pauses ; on ne libère pas la mémoire à la main.
  - key: vf-classes
    format: true-false
    question: Go propose des classes et l'héritage.
    truth: false
    answer: Il a des structs, des méthodes et des interfaces ; la réutilisation passe par la composition (embedding).
  - key: vf-concurrence
    format: true-false
    question: La concurrence fait partie du langage Go lui-même, avec le mot-clé `go` et les channels.
    truth: true
    answer: 'Pas besoin de bibliothèque : `go f()` lance une goroutine, et `chan` est un type du langage.'
  - key: qcm-objectifs
    format: multiple-choice
    question: "Lesquels de ces objectifs ont guidé la conception de Go ?"
    choices:
      - text: Des builds rapides
        correct: true
      - text: Un code lisible et homogène dans de grandes équipes
        correct: true
      - text: Le plus grand nombre possible de fonctionnalités de langage
        correct: false
      - text: La compatibilité avec le bytecode de la JVM
        correct: false
    answer: Go privilégie la simplicité ; il a peu de fonctionnalités, et il les veut orthogonales.
  - key: qcm-absent
    format: multiple-choice
    question: "Laquelle de ces fonctionnalités n'existe pas en Go ?"
    choices:
      - {text: "Les exceptions avec `try` et `catch`", correct: true}
      - {text: "Les fonctions anonymes", correct: false}
      - {text: "Les interfaces", correct: false}
      - {text: "Les génériques", correct: false}
    answer: "Les erreurs sont des valeurs retournées, pas des exceptions ; la surcharge de fonctions n'existe pas non plus. Les fonctions anonymes, les interfaces et, depuis Go 1.18, les génériques existent."
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces projets est écrit en Go ?"
    choices:
      - {text: "Kubernetes", correct: true}
      - {text: "Le noyau Linux", correct: false}
      - {text: "Le JDK", correct: false}
      - {text: "PostgreSQL", correct: false}
    answer: "Kubernetes, comme Docker, Terraform ou Prometheus : l'infrastructure cloud est le domaine de prédilection de Go. Linux et PostgreSQL sont en C, le JDK en Java et C++."
  - key: qcm-livrable
    format: multiple-choice
    question: Que produit `go build` pour un programme ?
    choices:
      - text: Un exécutable natif pour la plateforme cible
        correct: true
      - text: Un fichier de bytecode à exécuter avec `go run`
        correct: false
      - text: Une archive à décompresser dans un serveur d'applications
        correct: false
      - text: Un script interprété
        correct: false
    answer: Un binaire autonome, qu'on copie et qu'on lance.
  - key: scenario-choisir-go
    format: scenario
    question: Ton équipe hésite entre Go et Python pour un nouveau service réseau à forte charge. Quels arguments avances-tu pour Go ?
    choices:
      - {text: "Compilé et sans GIL, il sert des milliers de connexions sur tous les cœurs, et se déploie en un binaire", correct: true}
      - {text: "Son écosystème data et machine learning est plus riche que celui de Python", correct: false}
      - {text: "Il permet d'écrire le service plus vite, sans types ni compilation à gérer", correct: false}
      - {text: "Il n'a pas de ramasse-miettes, donc aucune pause sous forte charge", correct: false}
    answer: "La performance d'un langage compilé, sans GIL : les goroutines utilisent tous les cœurs pour servir des milliers de connexions. Le typage statique attrape tôt les erreurs, et un binaire unique se déploie sans environnement Python. En contrepartie, l'écosystème data et machine learning reste en Python, et Go a bien un ramasse-miettes, aux pauses très courtes."
  - key: scenario-presenter
    format: scenario
    question: On te demande de présenter Go en deux minutes à des développeurs Java. Que dis-tu ?
    choices:
      - {text: "Binaire natif sans JVM, structs et interfaces implicites, erreurs en valeurs, goroutines et `gofmt`", correct: true}
      - {text: "Un Java sans point-virgule : mêmes classes, même héritage, mais compilé en binaire natif", correct: false}
      - {text: "Un langage de script typé, interprété comme Python, avec les annotations de Java", correct: false}
      - {text: "Un langage fonctionnel pur, sans mutation, avec des exceptions vérifiées", correct: false}
    answer: "Go est compilé en binaire natif, démarre en millisecondes et consomme peu de mémoire : pas de JVM. Il n'a ni classes ni héritage : des structs avec des méthodes, et des interfaces satisfaites implicitement. Les erreurs sont des valeurs (`if err != nil`), la concurrence passe par les goroutines et les channels, et le style est imposé par `gofmt`."
  - key: scenario-limites
    format: scenario
    question: Quand déconseillerais-tu Go ?
    choices:
      - {text: "Pour une appli de bureau, du ML, du code sans pause de GC, ou un domaine très riche à modéliser", correct: true}
      - {text: "Pour tout service réseau à forte charge, où son ramasse-miettes le rend trop lent", correct: false}
      - {text: "Pour les outils en ligne de commande, que Go compile en binaires trop lourds", correct: false}
      - {text: "Pour un projet en grande équipe, où l'absence de conventions imposées gêne", correct: false}
    answer: "Pour une application graphique de bureau, où l'écosystème est pauvre ; pour le machine learning, où Python domine ; pour du code au plus près du matériel sans pause de GC, où Rust ou C conviennent mieux ; et pour un domaine métier très riche, où les types somme de Kotlin ou Scala aident. Go excelle au contraire pour les services réseau, les outils et l'infrastructure."
  - key: scenario-equipe
    format: scenario
    question: Pourquoi dit-on que Go est conçu pour les grandes équipes ?
    choices:
      - {text: "Il réduit débats et surprises : un format unique, peu de façons de faire, pas de magie", correct: true}
      - {text: "Il impose une architecture en couches, que le compilateur vérifie à chaque build", correct: false}
      - {text: "Il permet à chaque équipe de définir sa propre syntaxe, par des macros", correct: false}
      - {text: "Il génère le code répétitif à partir d'annotations, comme Lombok en Java", correct: false}
    answer: "Parce qu'il réduit les débats et les surprises : un format unique (`gofmt`), peu de façons d'écrire la même chose, pas de magie (ni surcharge d'opérateurs, ni annotations qui changent le comportement), des dépendances explicites et des imports inutilisés interdits. La compilation rapide garde des cycles courts, même sur des millions de lignes."
  - key: definition-goroutine
    format: definition
    question: "Que désigne le mot « goroutine » quand on présente Go ?"
    choices:
      - {text: "Une fonction exécutée de façon concurrente, ordonnancée par le runtime, bien plus légère qu'un thread", correct: true}
      - {text: "Un thread du système d'exploitation, créé et ordonnancé par le noyau pour chaque appel", correct: false}
      - {text: "Une coroutine que le programmeur doit suspendre et reprendre à la main, comme un générateur", correct: false}
      - {text: "Un processus séparé, qui communique avec les autres par des sockets locales", correct: false}
    answer: "Une fonction qui s'exécute de façon concurrente, gérée par le runtime de Go plutôt que par le système, et bien plus légère qu'un thread : quelques Ko de pile, et le runtime la suspend tout seul."
  - key: definition-gofmt
    format: definition
    question: "Que désigne « gofmt » ?"
    choices:
      - {text: "L'outil qui formate le code Go selon le style unique du langage, sans option", correct: true}
      - {text: "Le linter qui signale les erreurs probables du code, comme les `Printf` mal formés", correct: false}
      - {text: "Le package de formatage des chaînes, qui fournit `Printf` et `Sprintf`", correct: false}
      - {text: "Un formateur configurable, réglé par un fichier propre à chaque projet", correct: false}
    answer: "L'outil qui formate le code Go selon le style unique du langage, sans option de configuration. Le linter, c'est `go vet` ; le package de formatage, `fmt`."
  - key: definition-runtime
    format: definition
    question: "Que désigne le runtime de Go ?"
    choices:
      - {text: "Le code inclus dans chaque binaire, qui ordonnance les goroutines et gère la mémoire", correct: true}
      - {text: "La machine virtuelle à installer sur une machine pour y lancer un binaire Go", correct: false}
      - {text: "L'interpréteur qui exécute le code Go ligne par ligne au lancement", correct: false}
      - {text: "Le package `runtime`, à importer pour que les goroutines fonctionnent", correct: false}
    answer: "Le code inclus dans chaque binaire qui ordonnance les goroutines, gère la mémoire et le garbage collector. Rien à installer ni à importer : il est lié au programme."
  - key: definition-binaire-statique
    format: definition
    question: "Qu'est-ce qu'un binaire statique ?"
    choices:
      - {text: "Un exécutable qui contient tout son code, sans bibliothèque partagée à installer", correct: true}
      - {text: "Un exécutable qui ne peut plus être modifié une fois compilé", correct: false}
      - {text: "Un exécutable compilé pour toutes les plateformes à la fois", correct: false}
      - {text: "Un exécutable sans état, qui ne garde rien entre deux lancements", correct: false}
    answer: "Un exécutable qui contient tout le code dont il a besoin, sans dépendre de bibliothèques partagées présentes sur la machine : il tourne même dans une image `scratch`."
