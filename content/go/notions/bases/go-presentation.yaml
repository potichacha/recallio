notion: go-presentation
lesson: |-
  **Go** est un langage créé chez Google en 2007 par Robert Griesemer, Rob Pike et Ken Thompson, rendu public en 2009,
  stable depuis Go 1.0 (2012). Il est né d'un constat : les builds C++ étaient lents, le code difficile à lire à grande
  échelle, et la concurrence pénible à écrire.

  Ses choix :
  - **compilé en code natif**, en un seul binaire statique, sans machine virtuelle ni dépendances à installer ;
  - **compilation très rapide**, grâce à des dépendances explicites et sans en-têtes ;
  - un **garbage collector** concurrent, à faibles pauses ;
  - une **concurrence intégrée** au langage : les goroutines et les channels ;
  - un langage **petit** (25 mots-clés), une seule façon de formater (`gofmt`), peu de magie ;
  - une **bibliothèque standard** riche (HTTP, JSON, crypto, tests) et une chaîne d'outils unique (`go`).

  Ce que Go n'a **pas**, volontairement : ni classes ni héritage (des structs, des méthodes et des interfaces), ni
  exceptions (les erreurs sont des valeurs), ni surcharge de fonctions.

  Où on le trouve : le cloud et l'infrastructure (Docker, Kubernetes, Terraform, Prometheus, etcd), les services réseau,
  les outils en ligne de commande.

  **Piège classique** : présenter Go comme « un C moderne » ou « un Java simplifié ». Il a son propre modèle :
  composition, interfaces implicites, erreurs explicites, concurrence par messages.

  **En entretien** : « Un langage compilé, simple et rapide à builder, avec un GC et une concurrence intégrée, pensé pour
  de grandes équipes et des services réseau ; on gagne en lisibilité et en déploiement ce qu'on perd en expressivité. »
cards:
  - key: cree
    format: course
    question: Qui a créé Go et pourquoi ?
    answer: Griesemer, Pike et Thompson chez Google (2007, public en 2009), pour des builds rapides, un code lisible à grande échelle et une concurrence simple.
  - key: combien-mots-cles
    format: course
    question: Combien de mots-clés en Go ?
    answer: '25.'
  - key: outils-distribues-celebres-sont-ecrits
    format: course
    question: Quels outils distribués célèbres sont écrits en Go ?
    answer: Kubernetes, etcd, Consul, NATS, Temporal, Prometheus, Docker.
  - key: pourquoi-binaire-statique
    format: course
    question: Pourquoi un programme Go est-il simple à déployer ?
    answer: Il est compilé en un seul binaire natif, le plus souvent statique, qui contient le runtime et le GC ; il n'y a ni machine virtuelle ni bibliothèque à installer sur la machine cible.
  - key: vf-vm
    format: true-false
    question: Un programme Go s'exécute dans une machine virtuelle, comme Java.
    truth: false
    answer: Il est compilé en code machine natif ; le runtime (ordonnanceur, GC) est inclus dans le binaire.
  - key: vf-gc
    format: true-false
    question: Go gère la mémoire avec un garbage collector.
    truth: true
    answer: Un GC concurrent, à faibles pauses ; on ne libère pas la mémoire à la main.
  - key: vf-classes
    format: true-false
    question: Go propose des classes et l'héritage.
    truth: false
    answer: Il a des structs, des méthodes et des interfaces ; la réutilisation passe par la composition (embedding).
  - key: vf-concurrence
    format: true-false
    question: La concurrence fait partie du langage Go lui-même, avec le mot-clé `go` et les channels.
    truth: true
    answer: 'Pas besoin de bibliothèque : `go f()` lance une goroutine, et `chan` est un type du langage.'
  - key: qcm-objectifs
    format: multiple-choice
    question: Quels objectifs ont guidé la conception de Go ?
    choices:
      - text: Des builds rapides
        correct: true
      - text: Un code lisible et homogène dans de grandes équipes
        correct: true
      - text: Le plus grand nombre possible de fonctionnalités de langage
        correct: false
      - text: La compatibilité avec le bytecode de la JVM
        correct: false
    answer: Go privilégie la simplicité ; il a peu de fonctionnalités, et il les veut orthogonales.
  - key: qcm-absent
    format: multiple-choice
    question: Que n'existe-t-il pas en Go ?
    choices:
      - text: Les exceptions avec try/catch
        correct: true
      - text: La surcharge de fonctions
        correct: true
      - text: Les fonctions anonymes
        correct: false
      - text: Les interfaces
        correct: false
    answer: Les erreurs sont des valeurs retournées, et une fonction a un seul nom pour une seule signature.
  - key: qcm-usages
    format: multiple-choice
    question: Quels projets sont écrits en Go ?
    choices:
      - text: Docker et Kubernetes
        correct: true
      - text: Terraform et Prometheus
        correct: true
      - text: Le noyau Linux
        correct: false
      - text: Le JDK
        correct: false
    answer: L'infrastructure cloud est le domaine de prédilection de Go.
  - key: qcm-livrable
    format: multiple-choice
    question: Que produit `go build` pour un programme ?
    choices:
      - text: Un exécutable natif pour la plateforme cible
        correct: true
      - text: Un fichier de bytecode à exécuter avec `go run`
        correct: false
      - text: Une archive à décompresser dans un serveur d'applications
        correct: false
      - text: Un script interprété
        correct: false
    answer: Un binaire autonome, qu'on copie et qu'on lance.
  - key: scenario-choisir-go
    format: scenario
    question: Ton équipe hésite entre Go et Python pour un nouveau service réseau à forte charge. Quels arguments avances-tu pour Go ?
    answer: |-
      La performance d'un langage compilé, sans GIL : les goroutines utilisent tous les cœurs pour servir des milliers de
      connexions. Le typage statique attrape tôt les erreurs, et un binaire unique se déploie sans gérer d'environnement
      Python. La bibliothèque standard couvre HTTP, JSON et TLS. En contrepartie, l'écosystème data et machine learning
      reste en Python : si le service en dépend, on peut garder Python pour cette partie et appeler un service Go pour le
      reste.
  - key: scenario-presenter
    format: scenario
    question: On te demande de présenter Go en deux minutes à des développeurs Java. Que dis-tu ?
    answer: |-
      Go est compilé en binaire natif, démarre en millisecondes et consomme peu de mémoire : pas de JVM. Il n'a ni
      classes ni héritage : des structs avec des méthodes, et des interfaces satisfaites implicitement. Les erreurs sont
      des valeurs qu'on teste (`if err != nil`), pas des exceptions. La concurrence est dans le langage : goroutines et
      channels. Le style est imposé par `gofmt`, et l'outillage (build, tests, modules, profilage) est dans la commande
      `go`. On écrit plus de code « plat », mais il se lit vite, même dans un projet qu'on découvre.
  - key: scenario-limites
    format: scenario
    question: Quand déconseillerais-tu Go ?
    answer: |-
      Pour une application graphique de bureau, où l'écosystème est pauvre ; pour du calcul scientifique ou du machine
      learning, où Python domine ; pour du code au plus près du matériel sans aucune pause de GC, où Rust ou C conviennent
      mieux ; et pour un domaine métier très riche en modélisation, où les types somme et les generics plus expressifs de
      Kotlin ou Scala aident. Go excelle pour les services réseau, les outils et l'infrastructure.
  - key: scenario-equipe
    format: scenario
    question: Pourquoi dit-on que Go est conçu pour les grandes équipes ?
    answer: |-
      Parce qu'il réduit les débats et les surprises : un format unique (`gofmt`), peu de façons d'écrire la même chose,
      pas de magie (ni surcharge d'opérateurs, ni annotations qui changent le comportement), des dépendances explicites et
      des imports inutilisés interdits. Un développeur lit le code d'une autre équipe sans apprendre ses conventions. La
      compilation rapide garde des cycles courts même sur des millions de lignes.
  - key: definition-goroutine
    format: definition
    question: goroutine
    answer: Une fonction qui s'exécute de façon concurrente, gérée par le runtime de Go plutôt que par le système, et bien plus légère qu'un thread.
  - key: definition-gofmt
    format: definition
    question: gofmt
    answer: L'outil qui formate le code Go selon le style unique du langage, sans option de configuration.
  - key: definition-runtime
    format: definition
    question: runtime (Go)
    answer: Le code inclus dans chaque binaire qui ordonnance les goroutines, gère la mémoire et le garbage collector.
  - key: definition-binaire-statique
    format: definition
    question: binaire statique
    answer: Un exécutable qui contient tout le code dont il a besoin, sans dépendre de bibliothèques partagées présentes sur la machine.
