notion: retours-nommes
lesson: "Les valeurs de retour peuvent être **nommées** :\n\n```go\nfunc diviser(a, b int) (quotient, reste int) {\n\tquotient = a / b\n\treste = a % b\n\treturn // return « nu » : renvoie quotient et reste\n}\n```\n\n- Les retours nommés sont des **variables** déclarées au début de la fonction, à leur valeur zéro.\n- Un `return` sans valeur (**return nu**) renvoie leurs valeurs courantes.\n- Ils **documentent** la signature : `(lat, lon float64)` se lit mieux que `(float64, float64)`.\n- Ils permettent à un **`defer`** de modifier le résultat après le `return`, par exemple pour envelopper une erreur\n  ou fermer une ressource :\n\n```go\nfunc sauver(chemin string) (err error) {\n\tf, err := os.Create(chemin)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer func() {\n\t\tif cerr := f.Close(); cerr != nil && err == nil {\n\t\t\terr = cerr\n\t\t}\n\t}()\n\t_, err = f.Write(donnees)\n\treturn err\n}\n```\n\nBonne pratique : nommer les retours quand cela clarifie ou quand un `defer` en a besoin ; éviter le **return nu**\ndans une fonction longue, où l'on ne voit plus ce qui est renvoyé.\n\n**Piège classique** : un retour nommé `err` masqué par `x, err := ...` dans un bloc interne ; le `return` nu renvoie\nalors l'`err` externe, souvent nil.\n\n**En entretien** : « Des variables déclarées en début de fonction ; utiles pour documenter et pour qu'un defer\nmodifie le résultat ; le return nu est à réserver aux fonctions courtes. »"
cards:
  - key: code-func-nomme-int-defer-func
    format: code-output
    question: |-
      Qu'affiche `fmt.Println(nomme())` avec cette fonction ?
      ```go
      func nomme() (n int) {
          defer func() { n *= 2 }()
          return 3
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas : `return 3` avec un retour nommé", correct: false}
    answer: "`6` : `return 3` affecte `n = 3`, puis le `defer` modifie le retour nommé avant que la fonction ne rende la main."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nomme() (n int) {\n    defer func() { n *= 2 }()\n    return 3\n}\n\nfunc main() {\n\tfmt.Println(nomme())\n}\n"
      output: '6'
  - key: valeur-initiale
    format: course
    question: Quelle valeur ont les retours nommés au début de la fonction ?
    choices:
      - {text: "Leur valeur zéro : ce sont des variables locales déclarées avec la fonction", correct: true}
      - {text: "Une valeur indéfinie, comme une variable locale non initialisée en C", correct: false}
      - {text: "Aucune : les lire avant de les affecter ne compile pas", correct: false}
      - {text: "La valeur renvoyée par l'appel précédent de la même fonction", correct: false}
    answer: "Leur valeur zéro : ce sont des variables locales déclarées avec la fonction. Go n'a jamais de valeur indéfinie."
  - key: return-nu
    format: course
    question: Que renvoie un `return` sans valeur dans une fonction à retours nommés ?
    choices:
      - {text: "Les valeurs courantes des variables de retour nommées", correct: true}
      - {text: "Les valeurs zéro des types de retour, quoi qu'on ait affecté", correct: false}
      - {text: "Rien : un `return` sans valeur ne compile pas ici", correct: false}
      - {text: "Les valeurs qu'avaient les retours à l'entrée de la fonction", correct: false}
    answer: "Les valeurs courantes des variables de retour nommées, celles qu'on leur a affectées en dernier."
  - key: defer
    format: course
    question: Pourquoi les retours nommés sont-ils utiles avec `defer` ?
    choices:
      - {text: "Un `defer` s'exécute après l'affectation des retours, et peut alors les modifier", correct: true}
      - {text: "Un `defer` ne peut lire que les variables nommées dans la signature", correct: false}
      - {text: "Sans retour nommé, le `defer` s'exécute avant le `return`, trop tôt", correct: false}
      - {text: "Ils rendent le `defer` plus rapide, en évitant une copie du résultat", correct: false}
    answer: "Un `defer` s'exécute après l'affectation des valeurs de retour ; avec des retours nommés, il peut lire et modifier le résultat (par exemple l'erreur d'un `Close`)."
  - key: eviter
    format: course
    question: "Quand éviter le `return` nu ?"
    choices:
      - {text: "Dans une fonction longue, où l'on ne voit plus ce qui est renvoyé", correct: true}
      - {text: "Jamais : c'est la forme conseillée dès que les retours sont nommés", correct: false}
      - {text: "Dans une fonction qui renvoie une erreur, où il ne compile pas", correct: false}
      - {text: "Dans une méthode, où seul un `return` explicite est permis", correct: false}
    answer: "Dans une fonction longue : on ne voit plus ce qui est renvoyé ; on écrit les valeurs explicitement (`return q, r`), même avec des retours nommés."
  - key: vf-zero
    format: true-false
    question: Un retour nommé vaut sa valeur zéro tant qu'on ne l'a pas affecté.
    truth: true
    answer: Comme toute variable déclarée sans valeur.
  - key: vf-obligatoire
    format: true-false
    question: Avec des retours nommés, on est obligé d'utiliser le return nu.
    truth: false
    answer: '`return q, r` explicite reste permis et souvent plus lisible.'
  - key: vf-defer-modifie
    format: true-false
    question: Un `defer` peut changer la valeur renvoyée par une fonction à retours nommés.
    truth: true
    answer: Il s'exécute après l'affectation du résultat et peut le modifier.
  - key: vf-defer-sans-nom
    format: true-false
    question: Un `defer` peut changer la valeur renvoyée par une fonction à retours non nommés.
    truth: false
    answer: Sans nom, le defer n'a aucun moyen d'atteindre la valeur de retour.
  - key: qcm-interet
    format: multiple-choice
    question: "Lesquels de ces usages justifient des retours nommés ?"
    choices:
      - text: Documenter le sens des valeurs renvoyées
        correct: true
      - text: Permettre à un defer de modifier le résultat
        correct: true
      - text: Rendre la fonction plus rapide
        correct: false
      - text: Permettre la surcharge
        correct: false
    answer: Aucun effet sur les performances ; c'est de la lisibilité et le lien avec defer.
  - key: qcm-defer
    format: multiple-choice
    question: Que renvoie `func f() (n int) { defer func() { n++ }(); return 10 }` ?
    choices:
      - text: '11'
        correct: true
      - text: '10'
        correct: false
      - text: '1'
        correct: false
      - text: '0'
        correct: false
    answer: '`return 10` affecte n = 10, puis le defer l''incrémente.'
  - key: qcm-masque
    format: multiple-choice
    question: Que renvoie `func f() (err error) { if true { _, err := g(); _ = err }; return }` si g échoue ?
    choices:
      - {text: "`nil`, car le `err` du bloc masque le retour nommé", correct: true}
      - {text: "L'erreur de `g`, que le `return` nu renvoie en dernier", correct: false}
      - {text: "Une panic, car le `err` du bloc sort de sa portée", correct: false}
      - {text: "Rien : `err` déclarée deux fois ne compile pas", correct: false}
    answer: Le `:=` du bloc déclare un nouveau `err` ; le retour nommé reste nil.
  - key: qcm-lisibilite
    format: multiple-choice
    question: Quelle signature est la plus lisible ?
    choices:
      - text: '`func position() (lat, lon float64)`'
        correct: true
      - text: '`func position() (float64, float64)`'
        correct: false
      - text: '`func position() []float64`'
        correct: false
      - text: '`func position() (a, b float64)`'
        correct: false
    answer: Les noms disent quelle valeur est la latitude.
  - key: code-return-nu
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func diviser(a, b int) (q, r int) {
      	q = a / b
      	r = a % b
      	return
      }

      fmt.Println(diviser(17, 5))
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`0 0`", correct: false}
      - {text: "`2 3`", correct: false}
      - {text: "Ça ne compile pas : `return` n'a pas de valeur", correct: false}
    answer: "`3 2` : le `return` nu renvoie les valeurs courantes de `q` et `r`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc diviser(a, b int) (q, r int) {\n\tq = a / b\n\tr = a % b\n\treturn\n}\n\nfunc main() {\n\tfmt.Println(diviser(17, 5))\n}\n"
      output: 3 2
  - key: code-defer-incremente
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func f() (n int) {
      	defer func() { n++ }()
      	return 10
      }

      fmt.Println(f())
      ```
    choices:
      - {text: "`11`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`11` : le `defer` s'exécute après l'affectation de `n` par `return 10`, et l'incrémente."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc f() (n int) {\n\tdefer func() { n++ }()\n\treturn 10\n}\n\nfunc main() {\n\tfmt.Println(f())\n}\n"
      output: '11'
  - key: code-zero
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func chercher(xs []string, cible string) (indice int, trouve bool) {
      	for i, x := range xs {
      		if x == cible {
      			return i, true
      		}
      	}
      	return
      }

      fmt.Println(chercher([]string{"a", "b"}, "z"))
      ```
    choices:
      - {text: "`0 false`", correct: true}
      - {text: "`-1 false`", correct: false}
      - {text: "`1 false`", correct: false}
      - {text: "Ça ne compile pas : `return` n'a pas de valeur", correct: false}
    answer: "`0 false` : sans affectation, les retours nommés gardent leur valeur zéro ; Go ne renvoie pas -1 comme `indexOf` en Java."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc chercher(xs []string, cible string) (indice int, trouve bool) {\n\tfor i, x := range xs {\n\t\tif x == cible {\n\t\t\treturn i, true\n\t\t}\n\t}\n\treturn\n}\n\nfunc main() {\n\tfmt.Println(chercher([]string{\"a\", \"b\"}, \"z\"))\n}\n"
      output: 0 false
  - key: bug-close
    format: bug-fix
    question: |-
      Une erreur d'écriture sur disque, détectée à la fermeture, n'est jamais signalée. Quelle correction est la bonne ?
      ```go
      func sauver(p string, data []byte) error {
      	f, err := os.Create(p)
      	if err != nil {
      		return err
      	}
      	defer f.Close()
      	_, err = f.Write(data)
      	return err
      }
      ```
    choices:
      - {text: "Un retour nommé `err`, et un `defer` qui y remonte l'erreur de `f.Close()`", correct: true}
      - {text: "Remplacer `defer f.Close()` par `defer f.Sync()`, qui suffit à tout écrire", correct: false}
      - {text: "Écrire `defer log.Println(f.Close())`, pour voir l'erreur de fermeture", correct: false}
      - {text: "Rien : `Close` ne peut pas échouer après un `Write` qui a réussi", correct: false}
    answer: |-
      ```go
      func sauver(p string, data []byte) (err error) {
      	f, err := os.Create(p)
      	if err != nil {
      		return err
      	}
      	defer func() {
      		if cerr := f.Close(); cerr != nil && err == nil {
      			err = cerr
      		}
      	}()
      	_, err = f.Write(data)
      	return err
      }
      ```
      Le retour nommé permet au `defer` de remonter l'erreur de `Close`, qui peut être la vraie erreur d'écriture. La journaliser ne la rend pas à l'appelant.
  - key: bug-masque
    format: bug-fix
    question: |-
      La fonction renvoie nil alors que le parsing échoue. Quelle correction est la bonne ?
      ```go
      func charger(s string) (cfg Config, err error) {
      	if s != "" {
      		cfg, err := parser(s)
      		_ = cfg
      		_ = err
      	}
      	return
      }
      ```
    choices:
      - {text: "Retirer les retours nommés et renvoyer `parser(s)` explicitement", correct: true}
      - {text: "Ajouter un `return` nu à la fin du bloc `if`, après les `_ =`", correct: false}
      - {text: "Remplacer `_ = err` par `err = err`, pour remplir le retour nommé", correct: false}
      - {text: "Déclarer `var err error` au début du bloc `if`, avant l'appel", correct: false}
    answer: |-
      ```go
      func charger(s string) (Config, error) {
      	if s == "" {
      		return Config{}, nil
      	}
      	return parser(s)
      }
      ```
      Le `:=` du bloc masquait les retours nommés ; un retour explicite évite le piège. Un `return` nu dans le bloc ne compilerait pas (« err is shadowed during return »).
  - key: bug-return-nu-long
    format: bug-fix
    question: En revue, une fonction de 60 lignes à cinq retours nommés finit par des `return` nus disséminés. Que proposes-tu ?
    choices:
      - {text: "Des `return` explicites, et une struct de retour ou une fonction plus courte", correct: true}
      - {text: "Garder les `return` nus, mais commenter chaque sortie de la fonction", correct: false}
      - {text: "Ranger les résultats dans des variables globales, lues par l'appelant", correct: false}
      - {text: "Passer un pointeur par résultat, que la fonction remplit au fil de l'eau", correct: false}
    answer: "Écrire des `return` explicites (`return total, remise, nil`) pour que chaque sortie dise ce qu'elle renvoie, et garder les noms seulement s'ils documentent la signature. Avec cinq résultats, une struct de retour serait plus claire ; et une fonction plus courte aussi."
  - key: bug-defer-sans-nom
    format: bug-fix
    question: |-
      Le `defer` censé convertir une panic en erreur n'a aucun effet sur le résultat. Quelle correction est la bonne ?
      ```go
      func executer() error {
      	var err error
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("panique : %v", r)
      		}
      	}()
      	risque()
      	return err
      }
      ```
    choices:
      - {text: "Nommer le retour, `func executer() (err error)`, que le `defer` modifie", correct: true}
      - {text: "Écrire `return err` dans le `defer`, juste après le `recover`", correct: false}
      - {text: "Appeler `recover()` juste après `risque()`, sans `defer`", correct: false}
      - {text: "Déclarer `err` en variable globale, partagée avec le `defer`", correct: false}
    answer: |-
      ```go
      func executer() (err error) {
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("panique : %v", r)
      		}
      	}()
      	risque()
      	return nil
      }
      ```
      Seul un retour nommé peut être modifié par le `defer` après la panic : sans lui, la fonction renvoie la valeur zéro. Un `return` dans la closure ne sort que de la closure, et `recover` n'agit que dans un `defer`.
