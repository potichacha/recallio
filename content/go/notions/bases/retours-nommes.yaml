notion: retours-nommes
lesson: "Les valeurs de retour peuvent être **nommées** :\n\n```go\nfunc diviser(a, b int) (quotient, reste int) {\n\tquotient = a / b\n\treste = a % b\n\treturn // return « nu » : renvoie quotient et reste\n}\n```\n\n- Les retours nommés sont des **variables** déclarées au début de la fonction, à leur valeur zéro.\n- Un `return` sans valeur (**return nu**) renvoie leurs valeurs courantes.\n- Ils **documentent** la signature : `(lat, lon float64)` se lit mieux que `(float64, float64)`.\n- Ils permettent à un **`defer`** de modifier le résultat après le `return`, par exemple pour envelopper une erreur\n  ou fermer une ressource :\n\n```go\nfunc sauver(chemin string) (err error) {\n\tf, err := os.Create(chemin)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer func() {\n\t\tif cerr := f.Close(); cerr != nil && err == nil {\n\t\t\terr = cerr\n\t\t}\n\t}()\n\t_, err = f.Write(donnees)\n\treturn err\n}\n```\n\nBonne pratique : nommer les retours quand cela clarifie ou quand un `defer` en a besoin ; éviter le **return nu**\ndans une fonction longue, où l'on ne voit plus ce qui est renvoyé.\n\n**Piège classique** : un retour nommé `err` masqué par `x, err := ...` dans un bloc interne ; le `return` nu renvoie\nalors l'`err` externe, souvent nil.\n\n**En entretien** : « Des variables déclarées en début de fonction ; utiles pour documenter et pour qu'un defer\nmodifie le résultat ; le return nu est à réserver aux fonctions courtes. »"
cards:
  - key: code-func-nomme-int-defer-func
    format: code-output
    question: |-
      ```go
      func nomme() (n int) {
          defer func() { n *= 2 }()
          return 3
      }
      ```
    answer: '`6` : `return 3` affecte `n = 3`, puis le defer modifie le retour nommé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nomme() (n int) {\n    defer func() { n *= 2 }()\n    return 3\n}\n\nfunc main() {\n\tfmt.Println(nomme())\n}\n"
      output: '6'
  - key: valeur-initiale
    format: course
    question: Quelle valeur ont les retours nommés au début de la fonction ?
    answer: 'Leur valeur zéro : ce sont des variables locales déclarées avec la fonction.'
  - key: return-nu
    format: course
    question: Que renvoie un `return` sans valeur dans une fonction à retours nommés ?
    answer: Les valeurs courantes des variables de retour nommées.
  - key: defer
    format: course
    question: Pourquoi les retours nommés sont-ils utiles avec `defer` ?
    answer: Un `defer` s'exécute après l'affectation des valeurs de retour ; avec des retours nommés, il peut lire et modifier le résultat (par exemple l'erreur d'un `Close`).
  - key: eviter
    format: course
    question: Quand éviter le return nu ?
    answer: 'Dans une fonction longue : on ne voit plus ce qui est renvoyé ; on écrit les valeurs explicitement (`return q, r`), même avec des retours nommés.'
  - key: vf-zero
    format: true-false
    question: Un retour nommé vaut sa valeur zéro tant qu'on ne l'a pas affecté.
    truth: true
    answer: Comme toute variable déclarée sans valeur.
  - key: vf-obligatoire
    format: true-false
    question: Avec des retours nommés, on est obligé d'utiliser le return nu.
    truth: false
    answer: '`return q, r` explicite reste permis et souvent plus lisible.'
  - key: vf-defer-modifie
    format: true-false
    question: Un `defer` peut changer la valeur renvoyée par une fonction à retours nommés.
    truth: true
    answer: Il s'exécute après l'affectation du résultat et peut le modifier.
  - key: vf-defer-sans-nom
    format: true-false
    question: Un `defer` peut changer la valeur renvoyée par une fonction à retours non nommés.
    truth: false
    answer: Sans nom, le defer n'a aucun moyen d'atteindre la valeur de retour.
  - key: qcm-interet
    format: multiple-choice
    question: À quoi servent les retours nommés ?
    choices:
      - text: Documenter le sens des valeurs renvoyées
        correct: true
      - text: Permettre à un defer de modifier le résultat
        correct: true
      - text: Rendre la fonction plus rapide
        correct: false
      - text: Permettre la surcharge
        correct: false
    answer: Aucun effet sur les performances ; c'est de la lisibilité et le lien avec defer.
  - key: qcm-defer
    format: multiple-choice
    question: Que renvoie `func f() (n int) { defer func() { n++ }(); return 10 }` ?
    choices:
      - text: '11'
        correct: true
      - text: '10'
        correct: false
      - text: '1'
        correct: false
      - text: '0'
        correct: false
    answer: '`return 10` affecte n = 10, puis le defer l''incrémente.'
  - key: qcm-masque
    format: multiple-choice
    question: Que renvoie `func f() (err error) { if true { _, err := g(); _ = err }; return }` si g échoue ?
    choices:
      - text: nil, car le err du bloc masque le retour nommé
        correct: true
      - text: L'erreur de g
        correct: false
      - text: Une panique
        correct: false
      - text: Le code ne compile jamais
        correct: false
    answer: Le `:=` du bloc déclare un nouveau `err` ; le retour nommé reste nil.
  - key: qcm-lisibilite
    format: multiple-choice
    question: Quelle signature est la plus lisible ?
    choices:
      - text: '`func position() (lat, lon float64)`'
        correct: true
      - text: '`func position() (float64, float64)`'
        correct: false
      - text: '`func position() []float64`'
        correct: false
      - text: '`func position() (a, b float64)`'
        correct: false
    answer: Les noms disent quelle valeur est la latitude.
  - key: code-return-nu
    format: code-output
    question: "```go\nfunc diviser(a, b int) (q, r int) {\n\tq = a / b\n\tr = a % b\n\treturn\n}\n\nfmt.Println(diviser(17, 5))\n```"
    answer: '`3 2` : le return nu renvoie les valeurs courantes de q et r.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc diviser(a, b int) (q, r int) {\n\tq = a / b\n\tr = a % b\n\treturn\n}\n\nfunc main() {\n\tfmt.Println(diviser(17, 5))\n}\n"
      output: 3 2
  - key: code-defer-incremente
    format: code-output
    question: "```go\nfunc f() (n int) {\n\tdefer func() { n++ }()\n\treturn 10\n}\n\nfmt.Println(f())\n```"
    answer: '`11` : le defer s''exécute après l''affectation de n par `return 10`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc f() (n int) {\n\tdefer func() { n++ }()\n\treturn 10\n}\n\nfunc main() {\n\tfmt.Println(f())\n}\n"
      output: '11'
  - key: code-zero
    format: code-output
    question: "```go\nfunc chercher(xs []string, cible string) (indice int, trouve bool) {\n\tfor i, x := range xs {\n\t\tif x == cible {\n\t\t\treturn i, true\n\t\t}\n\t}\n\treturn\n}\n\nfmt.Println(chercher([]string{\"a\", \"b\"}, \"z\"))\n```"
    answer: '`0 false` : sans affectation, les retours nommés gardent leur valeur zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc chercher(xs []string, cible string) (indice int, trouve bool) {\n\tfor i, x := range xs {\n\t\tif x == cible {\n\t\t\treturn i, true\n\t\t}\n\t}\n\treturn\n}\n\nfunc main() {\n\tfmt.Println(chercher([]string{\"a\", \"b\"}, \"z\"))\n}\n"
      output: 0 false
  - key: bug-close
    format: bug-fix
    question: "Une erreur d'écriture sur disque (détectée à la fermeture) n'est jamais signalée :\n```go\nfunc sauver(p string, data []byte) error {\n\tf, err := os.Create(p)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer f.Close()\n\t_, err = f.Write(data)\n\treturn err\n}\n```"
    answer: "```go\nfunc sauver(p string, data []byte) (err error) {\n\tf, err := os.Create(p)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer func() {\n\t\tif cerr := f.Close(); cerr != nil && err == nil {\n\t\t\terr = cerr\n\t\t}\n\t}()\n\t_, err = f.Write(data)\n\treturn err\n}\n```\nLe retour nommé permet au defer de remonter l'erreur de `Close`, qui peut être la vraie erreur d'écriture."
  - key: bug-masque
    format: bug-fix
    question: "La fonction renvoie nil alors que le parsing échoue :\n```go\nfunc charger(s string) (cfg Config, err error) {\n\tif s != \"\" {\n\t\tcfg, err := parser(s)\n\t\t_ = cfg\n\t\t_ = err\n\t}\n\treturn\n}\n```"
    answer: "```go\nfunc charger(s string) (Config, error) {\n\tif s == \"\" {\n\t\treturn Config{}, nil\n\t}\n\treturn parser(s)\n}\n```\nLe `:=` du bloc masquait les retours nommés ; un retour explicite évite le piège."
  - key: bug-return-nu-long
    format: bug-fix
    question: En revue, une fonction de 60 lignes à cinq retours nommés finit par des `return` nus disséminés. Que proposes-tu ?
    answer: |-
      Écrire des `return` explicites (`return total, remise, nil`) pour que chaque sortie dise ce qu'elle renvoie, et
      garder les noms seulement s'ils documentent la signature. Si la fonction a cinq résultats, une struct de retour
      serait plus claire ; et une fonction plus courte aussi.
  - key: bug-defer-sans-nom
    format: bug-fix
    question: "Le defer censé convertir une panique en erreur n'a aucun effet sur le résultat :\n```go\nfunc executer() error {\n\tvar err error\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\terr = fmt.Errorf(\"panique : %v\", r)\n\t\t}\n\t}()\n\trisque()\n\treturn err\n}\n```"
    answer: "```go\nfunc executer() (err error) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\terr = fmt.Errorf(\"panique : %v\", r)\n\t\t}\n\t}()\n\trisque()\n\treturn nil\n}\n```\nSeul un retour nommé peut être modifié par le defer après la panique."
