notion: fonctions-valeurs
lesson: "En Go, les fonctions sont des **valeurs** : on les affecte à des variables, on les passe en argument, on les renvoie.\n\n```go\ntype Operation func(a, b int) int   // un type de fonction\n\nfunc appliquer(op Operation, a, b int) int { return op(a, b) }\n\naddition := func(a, b int) int { return a + b } // fonction anonyme\nappliquer(addition, 2, 3)                        // 5\nappliquer(func(a, b int) int { return a * b }, 2, 3)\n\nslices.SortFunc(personnes, func(a, b Personne) int {\n\treturn cmp.Compare(a.Age, b.Age)\n})\n```\n\n- Le **type** d'une fonction est sa signature : `func(int, int) int`.\n- La valeur zéro d'une variable de type fonction est **nil** ; l'appeler panique.\n- Deux fonctions ne se comparent qu'à `nil` (`f == nil`), pas entre elles.\n- Une **fonction anonyme** s'écrit `func(...) ... { ... }` et peut être appelée tout de suite :\n  `func() { ... }()`.\n- Une méthode est aussi une valeur : `p.Saluer` (valeur de méthode).\n\nUsages courants : les callbacks (`slices.SortFunc`, `strings.Map`), les handlers HTTP (`http.HandlerFunc`), les\nmiddlewares, les options fonctionnelles, les tables de dispatch (`map[string]func()`).\n\n**Piège classique** : un champ de type fonction laissé à nil, appelé sans vérification ; la panique survient loin de la\ncause. On le teste, ou on lui donne une valeur par défaut.\n\n**En entretien** : « Les fonctions sont des valeurs de première classe, typées par leur signature ; nil par défaut ;\nbase des callbacks, handlers et middlewares. »"
tour:
  - title: Les fonctions sont des valeurs
    text: |-
      En Go, une fonction est une **valeur** comme une autre : on la range dans une variable, on la passe en argument,
      on la renvoie. Son type s'écrit comme sa signature : `func(int) int`.

      Une **fonction anonyme** s'écrit sans nom, là où on en a besoin. Elle peut utiliser les variables de la fonction
      qui l'entoure : c'est une **fermeture** (*closure*), qui garde ces variables vivantes aussi longtemps qu'elle.
      Chaque appel à `compteur` crée ainsi son propre `n`.

      Essaie : crée un second compteur avec `autre := compteur()`, et appelle-le.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func applique(f func(int) int, xs []int) []int {
          	var resultat []int
          	for _, x := range xs {
          		resultat = append(resultat, f(x))
          	}
          	return resultat
          }

          func compteur() func() int {
          	n := 0
          	return func() int {
          		n++
          		return n
          	}
          }

          func main() {
          	carre := func(x int) int { return x * x }
          	fmt.Println(applique(carre, []int{1, 2, 3}))

          	suivant := compteur()
          	fmt.Println(suivant(), suivant(), suivant())
          }
      output: |-
        [1 4 9]
        1 2 3
cards:
  - key: type
    format: course
    question: Quel est le type d'une fonction en Go ?
    choices:
      - {text: "Sa signature, par exemple `func(int, int) int`", correct: true}
      - {text: "Le type `Function`, commun à toutes les fonctions", correct: false}
      - {text: "Le type `any` : une fonction n'a pas de type propre", correct: false}
      - {text: "Une interface à méthode unique, comme en Java", correct: false}
    answer: "Sa signature, par exemple `func(int, int) int` ; on peut lui donner un nom avec `type Operation func(int, int) int`. Go n'a pas besoin d'interface fonctionnelle, comme Java."
  - key: nil
    format: course
    question: Que se passe-t-il quand on appelle une variable de fonction qui vaut nil ?
    choices:
      - {text: "Une panic : « invalid memory address or nil pointer dereference »", correct: true}
      - {text: "Rien : l'appel d'une fonction nil est simplement ignoré", correct: false}
      - {text: "Le compilateur refuse d'appeler une variable qui peut valoir nil", correct: false}
      - {text: "L'appel renvoie les valeurs zéro des résultats de la fonction", correct: false}
    answer: "Une panic (« invalid memory address or nil pointer dereference ») ; il faut tester la variable avant, ou lui donner une valeur par défaut. Le compilateur ne peut pas le voir."
  - key: comparer
    format: course
    question: Peut-on comparer deux fonctions avec `==` ?
    choices:
      - {text: "Non : une fonction ne se compare qu'à nil", correct: true}
      - {text: "Oui : `==` compare les adresses des deux fonctions", correct: false}
      - {text: "Oui : `==` compare les signatures des deux fonctions", correct: false}
      - {text: "Seulement deux fonctions nommées, pas deux anonymes", correct: false}
    answer: "Non : une fonction ne se compare qu'à nil, et `f == g` ne compile pas. Elle ne peut donc pas non plus servir de clé de map."
  - key: immediate
    format: course
    question: Comment appeler une fonction anonyme dès sa déclaration ?
    choices:
      - {text: "En ajoutant les parenthèses d'appel après le corps : `func() { ... }()`", correct: true}
      - {text: "Avec un mot-clé devant la fonction : `call func() { ... }`", correct: false}
      - {text: "En l'entourant de parenthèses seules : `(func() { ... })`", correct: false}
      - {text: "C'est impossible : une fonction anonyme s'affecte d'abord", correct: false}
    answer: "En ajoutant les parenthèses d'appel après son corps : `func() { ... }()` ; c'est courant avec `go` et `defer`. Sans elles, on n'a qu'une valeur de fonction."
  - key: vf-argument
    format: true-false
    question: On peut passer une fonction en argument à une autre fonction.
    truth: true
    answer: C'est la base des callbacks comme `slices.SortFunc`.
  - key: vf-comparer
    format: true-false
    question: '`f == g` compile si f et g ont le même type de fonction.'
    truth: false
    answer: Les fonctions ne sont comparables qu'à nil.
  - key: vf-zero
    format: true-false
    question: La valeur zéro d'une variable de type `func()` est nil.
    truth: true
    answer: L'appeler panique.
  - key: vf-map
    format: true-false
    question: Une map peut avoir des fonctions comme valeurs.
    truth: true
    answer: '`map[string]func()` fait une table de dispatch ; une fonction ne peut pas être une clé, faute d''être comparable.'
  - key: qcm-valides
    format: multiple-choice
    question: "Laquelle de ces écritures déclare une fonction anonyme valide ?"
    choices:
      - {text: "`f := func(x int) int { return x * 2 }`", correct: true}
      - {text: "`h := func x int { x * 2 }`", correct: false}
      - {text: "`f := (x) => x * 2`", correct: false}
      - {text: "`f := lambda x: x * 2`", correct: false}
    answer: "Go n'a pas de syntaxe fléchée ni de `lambda` : une fonction anonyme a sa signature complète et son `return`. `var g func(string) error` est aussi valide : une variable de type fonction, nil."
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lesquels de ces cas la bibliothèque standard utilise-t-elle des fonctions-valeurs ?"
    choices:
      - text: '`slices.SortFunc`, pour la comparaison'
        correct: true
      - text: '`http.HandlerFunc`, pour les handlers'
        correct: true
      - text: '`strings.ToUpper`, qui prend un callback'
        correct: false
      - text: '`fmt.Println`, qui prend une fonction de formatage'
        correct: false
    answer: '`strings.Map` prend un callback, pas `ToUpper`.'
  - key: qcm-type-nomme
    format: multiple-choice
    question: "Quel avantage apporte `type Filtre func(Produit) bool` par rapport au type de fonction anonyme ?"
    choices:
      - {text: "On peut lui ajouter des méthodes, comme `ServeHTTP` sur `http.HandlerFunc`", correct: true}
      - {text: "Il devient comparable avec `==`, et peut donc servir de clé de map", correct: false}
      - {text: "Ses appels deviennent plus rapides, le compilateur les mettant en ligne", correct: false}
      - {text: "Il peut déclarer des valeurs par défaut pour ses paramètres", correct: false}
    answer: "Un type nommé peut porter des méthodes, comme `http.HandlerFunc` et sa méthode `ServeHTTP` ; il nomme et documente aussi le rôle de la fonction dans les signatures. Il ne devient ni comparable ni plus rapide."
  - key: qcm-dispatch
    format: multiple-choice
    question: "Quelle structure associe des commandes textuelles à des actions ?"
    choices:
      - {text: "Une `map[string]func() error`", correct: true}
      - {text: "Une `map[func()]string`", correct: false}
      - {text: "Un tableau de fonctions indexé par des chaînes", correct: false}
      - {text: "Une `map[string]any`, dont on appelle les valeurs", correct: false}
    answer: "Une map de la commande vers la fonction ; un `switch` sur la commande marche aussi. Une fonction ne peut pas être une clé de map, un tableau s'indexe par des entiers, et une valeur `any` ne s'appelle pas sans assertion."
  - key: trous-anonyme
    format: fill-in
    question: |-
      Complète la fonction anonyme :
      ```go
      doubler := ___(x int) int { return x * 2 }
      ```
    blanks:
      - - func
    answer: Une fonction anonyme commence par `func`.
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type de fonction :
      ```go
      type Operation ___(a, b int) int
      ```
    blanks:
      - - func
    answer: Un type de fonction est une signature.
  - key: trous-appel-immediat
    format: fill-in
    question: |-
      Complète pour appeler la fonction anonyme dans une goroutine :
      ```go
      go func() {
      	travailler()
      }___
      ```
    blanks:
      - - ()
    answer: Les parenthèses d'appel suivent le corps.
  - key: trous-sortfunc
    format: fill-in
    question: |-
      Complète le tri par âge :
      ```go
      slices.SortFunc(gens, func(a, b Personne) int {
      	return cmp.___(a.Age, b.Age)
      })
      ```
    blanks:
      - - Compare
    answer: '`cmp.Compare` renvoie -1, 0 ou 1.'
  - key: code-appliquer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func appliquer(f func(int) int, xs []int) []int {
      	r := make([]int, len(xs))
      	for i, x := range xs {
      		r[i] = f(x)
      	}
      	return r
      }

      carre := func(x int) int { return x * x }
      fmt.Println(appliquer(carre, []int{1, 2, 3}))
      ```
    choices:
      - {text: "`[1 4 9]`", correct: true}
      - {text: "`[1 2 3]`", correct: false}
      - {text: "`[2 4 6]`", correct: false}
      - {text: "`[1 8 27]`", correct: false}
    answer: "`[1 4 9]` : la fonction `carre` est passée comme une valeur, puis appelée sur chaque élément."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc appliquer(f func(int) int, xs []int) []int {\n\tr := make([]int, len(xs))\n\tfor i, x := range xs {\n\t\tr[i] = f(x)\n\t}\n\treturn r\n}\n\nfunc main() {\n\tcarre := func(x int) int { return x * x }\n\tfmt.Println(appliquer(carre, []int{1, 2, 3}))\n}\n"
      output: '[1 4 9]'
  - key: code-dispatch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ops := map[string]func(int, int) int{
      	"+": func(a, b int) int { return a + b },
      	"*": func(a, b int) int { return a * b },
      }
      fmt.Println(ops["+"](2, 3), ops["*"](2, 3), ops["-"] == nil)
      ```
    choices:
      - {text: "`5 6 true`", correct: true}
      - {text: "`5 6 false`", correct: false}
      - {text: "Une panic : la clé `-` est absente", correct: false}
      - {text: "Ça ne compile pas : on ne compare pas une fonction", correct: false}
    answer: "`5 6 true` : une clé absente donne la valeur zéro, une fonction nil, qu'on peut comparer à nil sans l'appeler."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tops := map[string]func(int, int) int{\n\t\t\"+\": func(a, b int) int { return a + b },\n\t\t\"*\": func(a, b int) int { return a * b },\n\t}\n\tfmt.Println(ops[\"+\"](2, 3), ops[\"*\"](2, 3), ops[\"-\"] == nil)\n}\n"
      output: 5 6 true
  - key: code-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var f func()
      fmt.Println(f == nil)
      f()
      ```
    choices:
      - {text: "`true`, puis une panic : nil pointer dereference", correct: true}
      - {text: "`true`, puis rien : l'appel d'une fonction nil est ignoré", correct: false}
      - {text: "`false`, puis une panic : nil pointer dereference", correct: false}
      - {text: "Ça ne compile pas : `f` est appelée sans corps", correct: false}
    answer: "`true`, puis une panic : appeler une fonction nil est une déréférence de pointeur nil, que le compilateur ne voit pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar f func()\n\tfmt.Println(f == nil)\n\tf()\n}\n"
      output: 'true'
      panics: nil pointer dereference
  - key: code-sortfunc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      mots := []string{"pomme", "kiwi", "banane"}
      slices.SortFunc(mots, func(a, b string) int {
      	return cmp.Compare(len(a), len(b))
      })
      fmt.Println(mots)
      ```
    choices:
      - {text: "`[kiwi pomme banane]`", correct: true}
      - {text: "`[banane kiwi pomme]`", correct: false}
      - {text: "`[pomme kiwi banane]`", correct: false}
      - {text: "`[banane pomme kiwi]`", correct: false}
    answer: "`[kiwi pomme banane]` : le callback compare les longueurs (4, 5, 6), pas l'ordre alphabétique."
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tmots := []string{\"pomme\", \"kiwi\", \"banane\"}\n\tslices.SortFunc(mots, func(a, b string) int {\n\t\treturn cmp.Compare(len(a), len(b))\n\t})\n\tfmt.Println(mots)\n}\n"
      output: '[kiwi pomme banane]'
