notion: fonctions-valeurs
lesson: "En Go, les fonctions sont des **valeurs** : on les affecte à des variables, on les passe en argument, on les renvoie.\n\n```go\ntype Operation func(a, b int) int   // un type de fonction\n\nfunc appliquer(op Operation, a, b int) int { return op(a, b) }\n\naddition := func(a, b int) int { return a + b } // fonction anonyme\nappliquer(addition, 2, 3)                        // 5\nappliquer(func(a, b int) int { return a * b }, 2, 3)\n\nslices.SortFunc(personnes, func(a, b Personne) int {\n\treturn cmp.Compare(a.Age, b.Age)\n})\n```\n\n- Le **type** d'une fonction est sa signature : `func(int, int) int`.\n- La valeur zéro d'une variable de type fonction est **nil** ; l'appeler panique.\n- Deux fonctions ne se comparent qu'à `nil` (`f == nil`), pas entre elles.\n- Une **fonction anonyme** s'écrit `func(...) ... { ... }` et peut être appelée tout de suite :\n  `func() { ... }()`.\n- Une méthode est aussi une valeur : `p.Saluer` (valeur de méthode).\n\nUsages courants : les callbacks (`slices.SortFunc`, `strings.Map`), les handlers HTTP (`http.HandlerFunc`), les\nmiddlewares, les options fonctionnelles, les tables de dispatch (`map[string]func()`).\n\n**Piège classique** : un champ de type fonction laissé à nil, appelé sans vérification ; la panique survient loin de la\ncause. On le teste, ou on lui donne une valeur par défaut.\n\n**En entretien** : « Les fonctions sont des valeurs de première classe, typées par leur signature ; nil par défaut ;\nbase des callbacks, handlers et middlewares. »"
tour:
  - title: Les fonctions sont des valeurs
    text: |-
      En Go, une fonction est une **valeur** comme une autre : on la range dans une variable, on la passe en argument,
      on la renvoie. Son type s'écrit comme sa signature : `func(int) int`.

      Une **fonction anonyme** s'écrit sans nom, là où on en a besoin. Elle peut utiliser les variables de la fonction
      qui l'entoure : c'est une **fermeture** (*closure*), qui garde ces variables vivantes aussi longtemps qu'elle.
      Chaque appel à `compteur` crée ainsi son propre `n`.

      Essaie : crée un second compteur avec `autre := compteur()`, et appelle-le.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func applique(f func(int) int, xs []int) []int {
          	var resultat []int
          	for _, x := range xs {
          		resultat = append(resultat, f(x))
          	}
          	return resultat
          }

          func compteur() func() int {
          	n := 0
          	return func() int {
          		n++
          		return n
          	}
          }

          func main() {
          	carre := func(x int) int { return x * x }
          	fmt.Println(applique(carre, []int{1, 2, 3}))

          	suivant := compteur()
          	fmt.Println(suivant(), suivant(), suivant())
          }
      output: |-
        [1 4 9]
        1 2 3
cards:
  - key: type
    format: course
    question: Quel est le type d'une fonction en Go ?
    answer: Sa signature, par exemple `func(int, int) int` ; on peut lui donner un nom avec `type Operation func(int, int) int`.
  - key: nil
    format: course
    question: Que se passe-t-il quand on appelle une variable de fonction qui vaut nil ?
    answer: Une panique (« invalid memory address or nil pointer dereference ») ; il faut la tester avant ou lui donner une valeur par défaut.
  - key: comparer
    format: course
    question: Peut-on comparer deux fonctions avec `==` ?
    answer: 'Non : une fonction ne se compare qu''à nil.'
  - key: immediate
    format: course
    question: Comment appeler une fonction anonyme dès sa déclaration ?
    answer: 'En ajoutant les parenthèses d''appel après son corps : `func() { ... }()` ; c''est courant avec `go` et `defer`.'
  - key: vf-argument
    format: true-false
    question: On peut passer une fonction en argument à une autre fonction.
    truth: true
    answer: C'est la base des callbacks comme `slices.SortFunc`.
  - key: vf-comparer
    format: true-false
    question: '`f == g` compile si f et g ont le même type de fonction.'
    truth: false
    answer: Les fonctions ne sont comparables qu'à nil.
  - key: vf-zero
    format: true-false
    question: La valeur zéro d'une variable de type `func()` est nil.
    truth: true
    answer: L'appeler panique.
  - key: vf-map
    format: true-false
    question: Une map peut avoir des fonctions comme valeurs.
    truth: true
    answer: '`map[string]func()` fait une table de dispatch ; une fonction ne peut pas être une clé, faute d''être comparable.'
  - key: qcm-valides
    format: multiple-choice
    question: Quelles écritures sont valides ?
    choices:
      - text: '`f := func(x int) int { return x * 2 }`'
        correct: true
      - text: '`var g func(string) error`'
        correct: true
      - text: '`h := func x int { x * 2 }`'
        correct: false
      - text: '`f := (x) => x * 2`'
        correct: false
    answer: Go n'a pas de syntaxe fléchée ; une fonction anonyme a sa signature complète.
  - key: qcm-usages
    format: multiple-choice
    question: Où les fonctions-valeurs sont-elles utilisées dans la bibliothèque standard ?
    choices:
      - text: '`slices.SortFunc`, pour la comparaison'
        correct: true
      - text: '`http.HandlerFunc`, pour les handlers'
        correct: true
      - text: '`strings.ToUpper`, qui prend un callback'
        correct: false
      - text: '`fmt.Println`, qui prend une fonction de formatage'
        correct: false
    answer: '`strings.Map` prend un callback, pas `ToUpper`.'
  - key: qcm-type-nomme
    format: multiple-choice
    question: Pourquoi déclarer `type Filtre func(Produit) bool` ?
    choices:
      - text: Pour nommer et documenter le rôle de la fonction dans les signatures
        correct: true
      - text: Pour pouvoir lui ajouter des méthodes
        correct: true
      - text: Pour la rendre comparable
        correct: false
      - text: Pour qu'elle soit plus rapide
        correct: false
    answer: Comme `http.HandlerFunc`, qui a une méthode `ServeHTTP`.
  - key: qcm-dispatch
    format: multiple-choice
    question: Comment associer des commandes textuelles à des actions ?
    choices:
      - text: Une `map[string]func() error`
        correct: true
      - text: Un switch sur la commande
        correct: true
      - text: Une `map[func()]string`
        correct: false
      - text: Un tableau de fonctions indexé par des chaînes
        correct: false
    answer: Une fonction ne peut pas être une clé de map.
  - key: trous-anonyme
    format: fill-in
    question: |-
      Complétez la fonction anonyme :
      ```go
      doubler := ___(x int) int { return x * 2 }
      ```
    blanks:
      - - func
    answer: Une fonction anonyme commence par `func`.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez le type de fonction :
      ```go
      type Operation ___(a, b int) int
      ```
    blanks:
      - - func
    answer: Un type de fonction est une signature.
  - key: trous-appel-immediat
    format: fill-in
    question: "Complétez pour appeler la fonction anonyme dans une goroutine :\n```go\ngo func() {\n\ttravailler()\n}___\n```"
    blanks:
      - - ()
    answer: Les parenthèses d'appel suivent le corps.
  - key: trous-sortfunc
    format: fill-in
    question: "Complétez le tri par âge :\n```go\nslices.SortFunc(gens, func(a, b Personne) int {\n\treturn cmp.___(a.Age, b.Age)\n})\n```"
    blanks:
      - - Compare
    answer: '`cmp.Compare` renvoie -1, 0 ou 1.'
  - key: code-appliquer
    format: code-output
    question: "```go\nfunc appliquer(f func(int) int, xs []int) []int {\n\tr := make([]int, len(xs))\n\tfor i, x := range xs {\n\t\tr[i] = f(x)\n\t}\n\treturn r\n}\n\ncarre := func(x int) int { return x * x }\nfmt.Println(appliquer(carre, []int{1, 2, 3}))\n```"
    answer: '`[1 4 9]` : la fonction est passée comme une valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc appliquer(f func(int) int, xs []int) []int {\n\tr := make([]int, len(xs))\n\tfor i, x := range xs {\n\t\tr[i] = f(x)\n\t}\n\treturn r\n}\n\nfunc main() {\n\tcarre := func(x int) int { return x * x }\n\tfmt.Println(appliquer(carre, []int{1, 2, 3}))\n}\n"
      output: '[1 4 9]'
  - key: code-dispatch
    format: code-output
    question: "```go\nops := map[string]func(int, int) int{\n\t\"+\": func(a, b int) int { return a + b },\n\t\"*\": func(a, b int) int { return a * b },\n}\nfmt.Println(ops[\"+\"](2, 3), ops[\"*\"](2, 3), ops[\"-\"] == nil)\n```"
    answer: '`5 6 true` : une clé absente donne la valeur zéro, une fonction nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tops := map[string]func(int, int) int{\n\t\t\"+\": func(a, b int) int { return a + b },\n\t\t\"*\": func(a, b int) int { return a * b },\n\t}\n\tfmt.Println(ops[\"+\"](2, 3), ops[\"*\"](2, 3), ops[\"-\"] == nil)\n}\n"
      output: 5 6 true
  - key: code-nil
    format: code-output
    question: |-
      ```go
      var f func()
      fmt.Println(f == nil)
      f()
      ```
    answer: '`true`, puis une panique : appeler une fonction nil est une déréférence de pointeur nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar f func()\n\tfmt.Println(f == nil)\n\tf()\n}\n"
      output: 'true'
      panics: nil pointer dereference
  - key: code-sortfunc
    format: code-output
    question: "```go\nmots := []string{\"pomme\", \"kiwi\", \"banane\"}\nslices.SortFunc(mots, func(a, b string) int {\n\treturn cmp.Compare(len(a), len(b))\n})\nfmt.Println(mots)\n```"
    answer: '`[kiwi pomme banane]` : trié par longueur grâce au callback.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tmots := []string{\"pomme\", \"kiwi\", \"banane\"}\n\tslices.SortFunc(mots, func(a, b string) int {\n\t\treturn cmp.Compare(len(a), len(b))\n\t})\n\tfmt.Println(mots)\n}\n"
      output: '[kiwi pomme banane]'
