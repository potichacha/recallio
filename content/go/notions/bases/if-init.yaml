notion: if-init
lesson: "`if` n'a pas de parenthèses autour de la condition, mais toujours des accolades, même pour une seule instruction. La\ncondition est un `bool` : pas de « vrai si non nul » comme en C.\n\nIl accepte une **instruction d'initialisation**, séparée de la condition par `;` :\n\n```go\nif err := sauver(c); err != nil {\n\treturn fmt.Errorf(\"sauvegarde : %w\", err)\n}\n\nif v, ok := cache[cle]; ok {\n\treturn v\n} else if len(cle) == 0 {\n\treturn defaut\n} else {\n\treturn charger(cle)\n}\n```\n\nLes variables déclarées dans l'initialisation sont visibles dans la condition, le bloc `if` **et** les `else`, mais\npas après. C'est l'idiome pour une erreur qu'on ne réutilise pas.\n\nStyle Go : **le chemin heureux à gauche**. On traite les cas d'erreur d'abord, avec un `return` précoce, plutôt que\nd'imbriquer le code normal dans des `else` :\n\n```go\nif err != nil {\n\treturn err\n}\n// suite normale, sans indentation\n```\n\n**Piège classique** : avoir besoin de la variable après le `if`. Si `v, err := f()` est dans l'initialisation, `v`\nn'existe plus ensuite : on la déclare avant le `if`.\n\n**En entretien** : « Accolades obligatoires, condition booléenne, une instruction d'initialisation pour limiter la\nportée ; erreurs traitées tôt avec un return, chemin heureux non indenté. »"
cards:
  - key: portee
    format: course
    question: Où sont visibles les variables déclarées dans l'initialisation d'un `if` ?
    answer: Dans la condition, le bloc du `if` et tous ses `else if` et `else` ; plus après la fin de l'instruction.
  - key: chemin-heureux
    format: course
    question: Que signifie « garder le chemin heureux à gauche » ?
    answer: Traiter les erreurs et les cas particuliers d'abord, avec un `return` précoce, pour que le code normal reste sans indentation plutôt que dans des `else` imbriqués.
  - key: condition-bool
    format: course
    question: Peut-on écrire `if n { ... }` avec `n` un entier ?
    answer: 'Non : la condition doit être un `bool` ; on écrit `if n != 0`.'
  - key: accolades
    format: course
    question: Les accolades sont-elles facultatives pour un `if` d'une seule ligne ?
    answer: 'Non : elles sont toujours obligatoires, et la condition s''écrit sans parenthèses.'
  - key: vf-parentheses
    format: true-false
    question: '`if (x > 0) { ... }` compile en Go.'
    truth: true
    answer: Les parenthèses sont permises mais inutiles ; gofmt les retire.
  - key: vf-sans-accolades
    format: true-false
    question: '`if x > 0 return` compile en Go.'
    truth: false
    answer: Les accolades sont obligatoires.
  - key: vf-apres
    format: true-false
    question: La variable `v` de `if v, ok := m[k]; ok { ... }` est utilisable après le `if`.
    truth: false
    answer: Sa portée s'arrête à la fin de l'instruction `if` (else compris).
  - key: vf-else
    format: true-false
    question: Les variables de l'initialisation sont visibles dans le `else`.
    truth: true
    answer: Toute l'instruction `if`, `else` compris, partage cette portée.
  - key: qcm-valides
    format: multiple-choice
    question: Quels `if` compilent ?
    choices:
      - text: '`if err := f(); err != nil { ... }`'
        correct: true
      - text: '`if x := 3; x > 2 { ... }`'
        correct: true
      - text: '`if n { ... }` avec n un int'
        correct: false
      - text: '`if x > 2 then { ... }`'
        correct: false
    answer: La condition est un booléen, sans mot-clé `then`.
  - key: qcm-style
    format: multiple-choice
    question: Quel style est idiomatique ?
    choices:
      - text: '`if err != nil { return err }` puis la suite sans indentation'
        correct: true
      - text: '`if err == nil { ...tout le code... } else { return err }`'
        correct: false
      - text: Un `else` après chaque `return`
        correct: false
      - text: Des parenthèses autour de chaque condition
        correct: false
    answer: Les erreurs sortent tôt ; un `else` après un `return` est inutile (golint le signalait).
  - key: qcm-portee-besoin
    format: multiple-choice
    question: Il faut utiliser `cfg` après le `if`. Quelle écriture choisir ?
    choices:
      - text: '`cfg, err := charger()` puis `if err != nil { return err }`'
        correct: true
      - text: '`if cfg, err := charger(); err != nil { return err }` puis utiliser cfg'
        correct: false
      - text: Déclarer `cfg` dans le `else`
        correct: false
      - text: Rendre `cfg` globale
        correct: false
    answer: Une variable de l'initialisation n'existe plus après le `if`.
  - key: qcm-else-if
    format: multiple-choice
    question: Comment enchaîner plusieurs conditions ?
    choices:
      - text: '`if a { } else if b { } else { }`'
        correct: true
      - text: Un `switch` sans expression, avec une condition par `case`
        correct: true
      - text: '`if a { } elif b { }`'
        correct: false
      - text: '`if a { } elseif b { }`'
        correct: false
    answer: '`else if`, ou souvent plus lisible : `switch { case a: ... case b: ... }`.'
  - key: trous-init
    format: fill-in
    question: "Complétez l'initialisation dans le `if` :\n```go\nif err := sauver(c)___ err != nil {\n\treturn err\n}\n```"
    blanks:
      - - ;
    answer: Le point-virgule sépare l'initialisation de la condition.
  - key: trous-ok
    format: fill-in
    question: "Complétez la lecture d'une map dans le `if` :\n```go\nif v, ___ := cache[cle]; ok {\n\treturn v\n}\n```"
    blanks:
      - - ok
    answer: La forme « v, ok » dit si la clé existe.
  - key: trous-nil
    format: fill-in
    question: "Complétez la condition d'erreur :\n```go\nif err ___ nil {\n\treturn err\n}\n```"
    blanks:
      - - '!='
    answer: Une erreur non nil signale un échec.
  - key: trous-else-if
    format: fill-in
    question: "Complétez la chaîne de conditions :\n```go\nif n < 0 {\n\tsigne = -1\n} ___ ___ n > 0 {\n\tsigne = 1\n}\n```"
    blanks:
      - - else
      - - if
    answer: '`else if` enchaîne une nouvelle condition.'
  - key: code-init-else
    format: code-output
    question: "```go\nif x := 5; x > 10 {\n\tfmt.Println(\"grand\", x)\n} else {\n\tfmt.Println(\"petit\", x)\n}\n```"
    answer: '`petit 5` : `x` est visible dans le `else`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tif x := 5; x > 10 {\n\t\tfmt.Println(\"grand\", x)\n\t} else {\n\t\tfmt.Println(\"petit\", x)\n\t}\n}\n"
      output: petit 5
  - key: code-map-ok
    format: code-output
    question: "```go\nstock := map[string]int{\"pomme\": 0}\nif n, ok := stock[\"pomme\"]; ok {\n\tfmt.Println(\"connu\", n)\n}\nif _, ok := stock[\"poire\"]; !ok {\n\tfmt.Println(\"inconnu\")\n}\n```"
    answer: '`connu 0` puis `inconnu` : `ok` distingue une clé présente à zéro d''une clé absente.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstock := map[string]int{\"pomme\": 0}\n\tif n, ok := stock[\"pomme\"]; ok {\n\t\tfmt.Println(\"connu\", n)\n\t}\n\tif _, ok := stock[\"poire\"]; !ok {\n\t\tfmt.Println(\"inconnu\")\n\t}\n}\n"
      output: |-
        connu 0
        inconnu
  - key: code-portee
    format: code-output
    question: "```go\nif x := 1; x > 0 {\n\tfmt.Println(x)\n}\nfmt.Println(x)\n```"
    answer: 'Rien : le code ne compile pas, `x` n''existe plus après le `if` (« undefined: x »).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tif x := 1; x > 0 {\n\t\tfmt.Println(x)\n\t}\n\tfmt.Println(x)\n}\n"
      compiles: false
  - key: code-else-if
    format: code-output
    question: "```go\nfor _, n := range []int{-3, 0, 4} {\n\tif n < 0 {\n\t\tfmt.Print(\"négatif \")\n\t} else if n == 0 {\n\t\tfmt.Print(\"zéro \")\n\t} else {\n\t\tfmt.Print(\"positif \")\n\t}\n}\nfmt.Println()\n```"
    answer: '`négatif zéro positif` : la première condition vraie gagne.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor _, n := range []int{-3, 0, 4} {\n\t\tif n < 0 {\n\t\t\tfmt.Print(\"négatif \")\n\t\t} else if n == 0 {\n\t\t\tfmt.Print(\"zéro \")\n\t\t} else {\n\t\t\tfmt.Print(\"positif \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: négatif zéro positif
  - key: bug-condition-int
    format: bug-fix
    question: "Le compilateur signale « non-boolean condition in if statement » :\n```go\nif len(panier) {\n\tenvoyer(panier)\n}\n```"
    answer: "```go\nif len(panier) > 0 {\n\tenvoyer(panier)\n}\n```\nLa condition doit être un booléen."
  - key: bug-portee
    format: bug-fix
    question: "Le compilateur signale « undefined: cfg » :\n```go\nif cfg, err := charger(); err != nil {\n\treturn err\n}\ndemarrer(cfg)\n```"
    answer: "```go\ncfg, err := charger()\nif err != nil {\n\treturn err\n}\ndemarrer(cfg)\n```\nLes variables de l'initialisation n'existent que dans l'instruction `if`."
  - key: bug-imbrication
    format: bug-fix
    question: "Rendez ce code idiomatique :\n```go\nif err == nil {\n\tif u.Actif {\n\t\treturn envoyer(u)\n\t} else {\n\t\treturn nil\n\t}\n} else {\n\treturn err\n}\n```"
    answer: "```go\nif err != nil {\n\treturn err\n}\nif !u.Actif {\n\treturn nil\n}\nreturn envoyer(u)\n```\nLes cas particuliers sortent tôt ; le chemin heureux reste à gauche, sans `else`."
  - key: bug-accolades
    format: bug-fix
    question: "Ce code ne compile pas :\n```go\nif total > 100\n\tremise = 10\n```"
    answer: "```go\nif total > 100 {\n\tremise = 10\n}\n```\nLes accolades sont obligatoires et l'ouvrante est sur la ligne du `if`."
