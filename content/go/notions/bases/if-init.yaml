notion: if-init
lesson: "`if` n'a pas de parenthèses autour de la condition, mais toujours des accolades, même pour une seule instruction. La\ncondition est un `bool` : pas de « vrai si non nul » comme en C.\n\nIl accepte une **instruction d'initialisation**, séparée de la condition par `;` :\n\n```go\nif err := sauver(c); err != nil {\n\treturn fmt.Errorf(\"sauvegarde : %w\", err)\n}\n\nif v, ok := cache[cle]; ok {\n\treturn v\n} else if len(cle) == 0 {\n\treturn defaut\n} else {\n\treturn charger(cle)\n}\n```\n\nLes variables déclarées dans l'initialisation sont visibles dans la condition, le bloc `if` **et** les `else`, mais\npas après. C'est l'idiome pour une erreur qu'on ne réutilise pas.\n\nStyle Go : **le chemin heureux à gauche**. On traite les cas d'erreur d'abord, avec un `return` précoce, plutôt que\nd'imbriquer le code normal dans des `else` :\n\n```go\nif err != nil {\n\treturn err\n}\n// suite normale, sans indentation\n```\n\n**Piège classique** : avoir besoin de la variable après le `if`. Si `v, err := f()` est dans l'initialisation, `v`\nn'existe plus ensuite : on la déclare avant le `if`.\n\n**En entretien** : « Accolades obligatoires, condition booléenne, une instruction d'initialisation pour limiter la\nportée ; erreurs traitées tôt avec un return, chemin heureux non indenté. »"
tour:
  - title: if et son initialisation
    text: |-
      `if` n'a pas de parenthèses autour de sa condition, mais toujours des accolades. Il peut commencer par une
      **instruction d'initialisation**, séparée de la condition par un point-virgule : la variable qu'elle déclare
      n'existe que dans le `if` et ses `else`.

      C'est la forme qu'on rencontre partout avec les erreurs : `if err := f(); err != nil { … }`. La variable ne
      déborde pas sur la suite de la fonction.

      `else` se place sur la même ligne que l'accolade fermante : le point-virgule automatique l'impose.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func main() {
          	for _, saisie := range []string{"42", "quarante-deux", "7"} {
          		if n, err := strconv.Atoi(saisie); err != nil {
          			fmt.Println("pas un nombre :", saisie)
          		} else if n%2 == 0 {
          			fmt.Println(n, "est pair")
          		} else {
          			fmt.Println(n, "est impair")
          		}
          	}
          }
      output: |-
        42 est pair
        pas un nombre : quarante-deux
        7 est impair
    task:
      instructions: |-
        Ajoute une branche pour les nombres négatifs, testée avant la parité : le programme doit afficher
        `-3 est négatif`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func main() {
          	if n, err := strconv.Atoi("-3"); err != nil {
          		fmt.Println("pas un nombre")
          	} else if n%2 == 0 {
          		fmt.Println(n, "est pair")
          	} else {
          		fmt.Println(n, "est impair")
          	}
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func main() {
          	if n, err := strconv.Atoi("-3"); err != nil {
          		fmt.Println("pas un nombre")
          	} else if n < 0 {
          		fmt.Println(n, "est négatif")
          	} else if n%2 == 0 {
          		fmt.Println(n, "est pair")
          	} else {
          		fmt.Println(n, "est impair")
          	}
          }
      output: |-
        -3 est négatif
cards:
  - key: portee
    format: course
    question: Où sont visibles les variables déclarées dans l'initialisation d'un `if` ?
    choices:
      - {text: "Dans la condition, le bloc du `if` et ses `else if` et `else`, plus ensuite", correct: true}
      - {text: "Dans le bloc du `if` seulement, pas dans les `else`", correct: false}
      - {text: "Dans toute la fonction, à partir de la ligne du `if`", correct: false}
      - {text: "Dans la condition seulement : le bloc doit la redéclarer", correct: false}
    answer: "Dans la condition, le bloc du `if` et tous ses `else if` et `else` ; plus du tout après la fin de l'instruction."
  - key: chemin-heureux
    format: course
    question: Que signifie « garder le chemin heureux à gauche » ?
    choices:
      - {text: "Traiter erreurs et cas particuliers d'abord, par un `return` précoce, sans `else` imbriqués", correct: true}
      - {text: "Écrire le cas normal dans le `if`, et rassembler les erreurs dans un `else` final", correct: false}
      - {text: "Aligner tout le code à gauche, sans aucune indentation, comme l'impose `gofmt`", correct: false}
      - {text: "Mettre la gestion des erreurs dans un `defer`, pour garder le cas normal en haut", correct: false}
    answer: "Traiter les erreurs et les cas particuliers d'abord, avec un `return` précoce, pour que le code normal reste sans indentation plutôt que dans des `else` imbriqués."
  - key: condition-bool
    format: course
    question: Peut-on écrire `if n { ... }` avec `n` un entier ?
    choices:
      - {text: "Non : la condition doit être un `bool` ; on écrit `if n != 0`", correct: true}
      - {text: "Oui : comme en C, toute valeur non nulle compte pour vrai", correct: false}
      - {text: "Oui, mais `go vet` signale la conversion implicite", correct: false}
      - {text: "Non, sauf si `n` ne peut valoir que 0 ou 1", correct: false}
    answer: "Non : la condition doit être un `bool`, et Go ne convertit jamais un entier en booléen ; on écrit `if n != 0`."
  - key: accolades
    format: course
    question: Les accolades sont-elles facultatives pour un `if` d'une seule ligne ?
    choices:
      - {text: "Non : elles sont toujours obligatoires, et la condition s'écrit sans parenthèses", correct: true}
      - {text: "Oui, comme en Java ou en C, pour une instruction unique", correct: false}
      - {text: "Oui, si l'instruction tient sur la ligne de la condition", correct: false}
      - {text: "Oui, à condition de mettre la condition entre parenthèses", correct: false}
    answer: "Non : elles sont toujours obligatoires, et l'ouvrante reste sur la ligne du `if` ; la condition s'écrit sans parenthèses."
  - key: vf-parentheses
    format: true-false
    question: '`if (x > 0) { ... }` compile en Go.'
    truth: true
    answer: Les parenthèses sont permises mais inutiles ; gofmt les retire.
  - key: vf-sans-accolades
    format: true-false
    question: '`if x > 0 return` compile en Go.'
    truth: false
    answer: Les accolades sont obligatoires.
  - key: vf-apres
    format: true-false
    question: La variable `v` de `if v, ok := m[k]; ok { ... }` est utilisable après le `if`.
    truth: false
    answer: Sa portée s'arrête à la fin de l'instruction `if` (else compris).
  - key: vf-else
    format: true-false
    question: Les variables de l'initialisation sont visibles dans le `else`.
    truth: true
    answer: Toute l'instruction `if`, `else` compris, partage cette portée.
  - key: qcm-valides
    format: multiple-choice
    question: "Lequel de ces `if` compile ?"
    choices:
      - {text: "`if err := f(); err != nil { ... }`", correct: true}
      - {text: "`if n { ... }`, avec `n` un `int`", correct: false}
      - {text: "`if x > 2 then { ... }`", correct: false}
      - {text: "`if (x > 2) return`", correct: false}
    answer: "Une initialisation, un point-virgule, puis une condition booléenne, sans `then` ; `if x := 3; x > 2 { ... }` compile aussi. Les accolades sont obligatoires, et un entier n'est pas un booléen."
  - key: qcm-style
    format: multiple-choice
    question: Quel style est idiomatique ?
    choices:
      - text: '`if err != nil { return err }` puis la suite sans indentation'
        correct: true
      - text: '`if err == nil { ...tout le code... } else { return err }`'
        correct: false
      - text: Un `else` après chaque `return`
        correct: false
      - text: Des parenthèses autour de chaque condition
        correct: false
    answer: Les erreurs sortent tôt ; un `else` après un `return` est inutile (golint le signalait).
  - key: qcm-portee-besoin
    format: multiple-choice
    question: Il faut utiliser `cfg` après le `if`. Quelle écriture choisir ?
    choices:
      - text: '`cfg, err := charger()` puis `if err != nil { return err }`'
        correct: true
      - text: '`if cfg, err := charger(); err != nil { return err }` puis utiliser cfg'
        correct: false
      - text: Déclarer `cfg` dans le `else`
        correct: false
      - text: Rendre `cfg` globale
        correct: false
    answer: Une variable de l'initialisation n'existe plus après le `if`.
  - key: qcm-else-if
    format: multiple-choice
    question: "Lesquelles de ces écritures enchaînent plusieurs conditions en Go ?"
    choices:
      - text: '`if a { } else if b { } else { }`'
        correct: true
      - text: Un `switch` sans expression, avec une condition par `case`
        correct: true
      - text: '`if a { } elif b { }`'
        correct: false
      - text: '`if a { } elseif b { }`'
        correct: false
    answer: '`else if`, ou souvent plus lisible : `switch { case a: ... case b: ... }`.'
  - key: trous-init
    format: fill-in
    question: |-
      Complète l'initialisation dans le `if` :
      ```go
      if err := sauver(c)___ err != nil {
      	return err
      }
      ```
    blanks:
      - - ;
    answer: Le point-virgule sépare l'initialisation de la condition.
  - key: trous-ok
    format: fill-in
    question: |-
      Complète la lecture d'une map dans le `if` :
      ```go
      if v, ___ := cache[cle]; ok {
      	return v
      }
      ```
    blanks:
      - - ok
    answer: La forme « v, ok » dit si la clé existe.
  - key: trous-nil
    format: fill-in
    question: |-
      Complète la condition d'erreur :
      ```go
      if err ___ nil {
      	return err
      }
      ```
    blanks:
      - - '!='
    answer: Une erreur non nil signale un échec.
  - key: trous-else-if
    format: fill-in
    question: |-
      Complète la chaîne de conditions :
      ```go
      if n < 0 {
      	signe = -1
      } ___ ___ n > 0 {
      	signe = 1
      }
      ```
    blanks:
      - - else
      - - if
    answer: '`else if` enchaîne une nouvelle condition.'
  - key: code-init-else
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      if x := 5; x > 10 {
      	fmt.Println("grand", x)
      } else {
      	fmt.Println("petit", x)
      }
      ```
    choices:
      - {text: "`petit 5`", correct: true}
      - {text: "`grand 5`", correct: false}
      - {text: "`petit 0`", correct: false}
      - {text: "Ça ne compile pas : `x` n'existe pas dans le `else`", correct: false}
    answer: "`petit 5` : la condition est fausse, et `x`, déclarée dans l'initialisation, est visible dans le `else`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tif x := 5; x > 10 {\n\t\tfmt.Println(\"grand\", x)\n\t} else {\n\t\tfmt.Println(\"petit\", x)\n\t}\n}\n"
      output: petit 5
  - key: code-map-ok
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      stock := map[string]int{"pomme": 0}
      if n, ok := stock["pomme"]; ok {
      	fmt.Println("connu", n)
      }
      if _, ok := stock["poire"]; !ok {
      	fmt.Println("inconnu")
      }
      ```
    choices:
      - text: |-
          ```
          connu 0
          inconnu
          ```
        correct: true
      - {text: "`inconnu`", correct: false}
      - {text: "`connu 0`", correct: false}
      - text: |-
          ```
          inconnu
          inconnu
          ```
        correct: false
    answer: "`connu 0` puis `inconnu` : `ok` distingue une clé présente à zéro d'une clé absente, que la valeur seule ne distingue pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstock := map[string]int{\"pomme\": 0}\n\tif n, ok := stock[\"pomme\"]; ok {\n\t\tfmt.Println(\"connu\", n)\n\t}\n\tif _, ok := stock[\"poire\"]; !ok {\n\t\tfmt.Println(\"inconnu\")\n\t}\n}\n"
      output: |-
        connu 0
        inconnu
  - key: code-portee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      if x := 1; x > 0 {
      	fmt.Println(x)
      }
      fmt.Println(x)
      ```
    choices:
      - {text: "Ça ne compile pas : `undefined: x`", correct: true}
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - text: |-
          ```
          1
          0
          ```
        correct: false
      - {text: "`1`, puis une panic : `x` n'existe plus", correct: false}
    answer: "Rien : le code ne compile pas, `x` n'existe plus après le `if` (« undefined: x »)."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tif x := 1; x > 0 {\n\t\tfmt.Println(x)\n\t}\n\tfmt.Println(x)\n}\n"
      compiles: false
  - key: code-else-if
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for _, n := range []int{-3, 0, 4} {
      	if n < 0 {
      		fmt.Print("négatif ")
      	} else if n == 0 {
      		fmt.Print("zéro ")
      	} else {
      		fmt.Print("positif ")
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`négatif zéro positif`", correct: true}
      - {text: "`négatif positif positif`", correct: false}
      - {text: "`zéro zéro positif`", correct: false}
      - {text: "`négatif zéro zéro`", correct: false}
    answer: "`négatif zéro positif` : pour chaque nombre, la première condition vraie gagne, et le `else` final prend le reste."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfor _, n := range []int{-3, 0, 4} {\n\t\tif n < 0 {\n\t\t\tfmt.Print(\"négatif \")\n\t\t} else if n == 0 {\n\t\t\tfmt.Print(\"zéro \")\n\t\t} else {\n\t\t\tfmt.Print(\"positif \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: négatif zéro positif
  - key: bug-condition-int
    format: bug-fix
    question: |-
      Le compilateur signale « non-boolean condition in if statement ». Quelle correction est la bonne ?
      ```go
      if len(panier) {
      	envoyer(panier)
      }
      ```
    choices:
      - {text: "`if len(panier) > 0 {`", correct: true}
      - {text: "`if bool(len(panier)) {`", correct: false}
      - {text: "`if (len(panier)) {`", correct: false}
      - {text: "`if len(panier) != nil {`", correct: false}
    answer: |-
      ```go
      if len(panier) > 0 {
      	envoyer(panier)
      }
      ```
      La condition doit être un booléen, et un entier ne se convertit pas en `bool`.
  - key: bug-portee
    format: bug-fix
    question: |-
      Le compilateur signale « undefined: cfg ». Quelle correction est la bonne ?
      ```go
      if cfg, err := charger(); err != nil {
      	return err
      }
      demarrer(cfg)
      ```
    choices:
      - {text: "Sortir l'appel du `if` : `cfg, err := charger()`, puis tester `err`", correct: true}
      - {text: "Utiliser `cfg` dans le `else` du `if`, pour qu'il survive après", correct: false}
      - {text: "Remplacer `:=` par `=` dans le `if`, sans autre déclaration", correct: false}
      - {text: "Différer l'appel après le `if` : `defer demarrer(cfg)`", correct: false}
    answer: |-
      ```go
      cfg, err := charger()
      if err != nil {
      	return err
      }
      demarrer(cfg)
      ```
      Les variables de l'initialisation n'existent que dans l'instruction `if` : pour s'en servir après, on les déclare avant.
  - key: bug-imbrication
    format: bug-fix
    question: |-
      Comment rendre ce code idiomatique ?
      ```go
      if err == nil {
      	if u.Actif {
      		return envoyer(u)
      	} else {
      		return nil
      	}
      } else {
      	return err
      }
      ```
    choices:
      - {text: "Sortir tôt : `if err != nil { return err }`, `if !u.Actif { return nil }`, puis `return envoyer(u)`", correct: true}
      - {text: "Remplacer les `if` imbriqués par un `switch` sur `err` et `u.Actif`, avec des `fallthrough`", correct: false}
      - {text: "Garder la structure, mais retirer les accolades des `else` qui n'ont qu'une ligne", correct: false}
      - {text: "Inverser chaque condition en gardant les `else`, pour mettre le cas normal en premier", correct: false}
    answer: |-
      ```go
      if err != nil {
      	return err
      }
      if !u.Actif {
      	return nil
      }
      return envoyer(u)
      ```
      Les cas particuliers sortent tôt ; le chemin heureux reste à gauche, sans `else`. Les accolades, elles, ne se retirent jamais.
  - key: bug-accolades
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      if total > 100
      	remise = 10
      ```
    choices:
      - {text: "Entourer le corps d'accolades, l'ouvrante sur la ligne du `if`", correct: true}
      - {text: "Mettre la condition entre parenthèses : `if (total > 100)`", correct: false}
      - {text: "Écrire le corps sur la ligne : `if total > 100 remise = 10`", correct: false}
      - {text: "Ajouter `:` après la condition, comme en Python", correct: false}
    answer: |-
      ```go
      if total > 100 {
      	remise = 10
      }
      ```
      Les accolades sont obligatoires et l'ouvrante est sur la ligne du `if`.
