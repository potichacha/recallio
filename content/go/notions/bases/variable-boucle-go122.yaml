notion: variable-boucle-go122
lesson: "Jusqu'à Go 1.21, la variable d'une boucle `for` était **une seule variable** pour toute la boucle, mise à jour à chaque\nitération. Une closure ou une goroutine qui la capturait voyait sa **dernière valeur** :\n\n```go\nvar fs []func()\nfor i := 0; i < 3; i++ {\n\tfs = append(fs, func() { fmt.Print(i) })\n}\nfor _, f := range fs { f() } // Go 1.21 : 333 — Go 1.22 : 012\n```\n\nDepuis **Go 1.22**, **chaque itération a sa propre variable** (`for i := ...` comme `for i, v := range ...`). Le\nchangement ne s'applique qu'aux modules dont le go.mod déclare `go 1.22` ou plus : un vieux module garde l'ancienne\nsémantique, même compilé avec un Go récent.\n\nAvant 1.22, on contournait avec une copie : `i := i` dans le corps, ou un paramètre de goroutine `go func(i int)\n{...}(i)`. Ces copies sont désormais inutiles ; `go fix` (analyseur `forvar`) les retire.\n\nCe que le changement ne règle pas : prendre l'**adresse** d'un élément via la variable de range (`&v`) donne toujours\nl'adresse d'une copie, pas celle de l'élément du slice. Et une **variable déclarée hors** de la boucle reste partagée.\n\n**Piège classique** : un module ancien (`go 1.20` dans go.mod) compilé avec Go 1.27. L'ancien comportement s'applique\ntoujours ; c'est la directive du module qui compte, pas la version du compilateur.\n\n**En entretien** : « Avant 1.22 la variable de boucle était partagée, et les goroutines voyaient la dernière valeur ;\ndepuis, une variable par itération, pour les modules en go 1.22 ou plus ; les copies `i := i` deviennent inutiles. »"
cards:
  - key: change-1-22-boucles
    format: course
    question: Qu'a changé Go 1.22 pour les boucles ?
    answer: Chaque itération a sa propre variable, et on peut écrire `for i := range 10`.
  - key: code-var-funcs-func-for-i
    format: code-output
    question: |-
      ```go
      var funcs []func()
      for i := 0; i < 3; i++ {
          funcs = append(funcs, func() { fmt.Print(i, " ") })
      }
      for _, f := range funcs { f() }
      ```
    answer: '`0 1 2` avec un module en Go 1.22 ou plus (une variable par itération) ; `3 3 3` en Go 1.21 et avant (une seule variable partagée, qui vaut 3 à la fin).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar funcs []func()\n\tfor i := 0; i < 3; i++ {\n\t    funcs = append(funcs, func() { fmt.Print(i, \" \") })\n\t}\n\tfor _, f := range funcs {\n\t    f()\n\t}\n}\n"
      output: 0 1 2
  - key: directive
    format: course
    question: Qu'est-ce qui décide de la sémantique de la variable de boucle, le compilateur ou le module ?
    answer: 'La directive `go` du go.mod du module : `go 1.22` ou plus donne une variable par itération, même compilé avec un Go plus récent sinon.'
  - key: contournement
    format: course
    question: Comment contournait-on le partage de la variable de boucle avant Go 1.22 ?
    answer: En copiant la variable dans le corps (`i := i`) ou en la passant en paramètre à la goroutine (`go func(i int) { ... }(i)`).
  - key: adresse
    format: course
    question: Depuis Go 1.22, `&v` dans `for _, v := range xs` donne-t-il l'adresse de l'élément du slice ?
    answer: 'Non : `v` reste une copie de l''élément, désormais une par itération ; pour l''adresse de l''élément, il faut `&xs[i]`.'
  - key: vf-122
    format: true-false
    question: Depuis Go 1.22, chaque itération d'une boucle `for` a sa propre variable.
    truth: true
    answer: Pour les modules en `go 1.22` ou plus, aussi bien pour la forme classique que pour `range`.
  - key: vf-vieux-module
    format: true-false
    question: Un module qui déclare `go 1.20`, compilé avec Go 1.27, a une variable par itération.
    truth: false
    answer: La sémantique dépend de la directive `go` du module ; il garde l'ancien comportement.
  - key: vf-copie-utile
    format: true-false
    question: En Go 1.22 et plus, la ligne `v := v` dans une boucle range reste nécessaire avant de lancer une goroutine.
    truth: false
    answer: Elle est devenue inutile ; `go fix` la retire.
  - key: vf-externe
    format: true-false
    question: Une variable déclarée avant la boucle et modifiée dans le corps est aussi copiée à chaque itération.
    truth: false
    answer: Seules les variables déclarées par l'en-tête du `for` sont par itération.
  - key: qcm-resultat
    format: multiple-choice
    question: Dans un module `go 1.27`, que affiche `for i := range 3 { defer fmt.Print(i) }` à la fin de la fonction ?
    choices:
      - text: '`210`'
        correct: true
      - text: '`333`'
        correct: false
      - text: '`012`'
        correct: false
      - text: '`222`'
        correct: false
    answer: Les arguments du `defer` sont évalués à sa déclaration, et les defer s'exécutent en ordre inverse.
  - key: qcm-ancien
    format: multiple-choice
    question: Quel bug classique Go 1.22 a-t-il corrigé ?
    choices:
      - text: Des goroutines lancées dans une boucle qui voient toutes la dernière valeur de la variable
        correct: true
      - text: Les closures stockées dans un slice qui affichent toutes la même valeur
        correct: true
      - text: Le débordement des entiers
        correct: false
      - text: L'ordre aléatoire des maps
        correct: false
    answer: Le partage de la variable de boucle ; le reste n'a pas changé.
  - key: qcm-outil
    format: multiple-choice
    question: Quel outil retire les copies `v := v` devenues inutiles ?
    choices:
      - text: '`go fix` (ses modernisations)'
        correct: true
      - text: '`gofmt`'
        correct: false
      - text: '`go mod tidy`'
        correct: false
      - text: '`go vet -copylocks`'
        correct: false
    answer: Depuis Go 1.26, `go fix` applique des modernisations, dont celle-ci.
  - key: qcm-encore-piege
    format: multiple-choice
    question: Qu'est-ce qui reste un piège depuis Go 1.22 ?
    choices:
      - text: Garder `&v` d'une variable de range pour modifier l'élément du slice
        correct: true
      - text: Capturer dans une goroutine une variable déclarée avant la boucle
        correct: true
      - text: Capturer `i` de `for i := 0; i < n; i++` dans une closure
        correct: false
      - text: Lancer `go f(v)` dans un range
        correct: false
    answer: '`v` reste une copie, et une variable externe reste partagée.'
  - key: code-goroutines
    format: code-output
    question: "```go\nvar wg sync.WaitGroup\nresultats := make([]int, 3)\nfor i := range 3 {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tresultats[i] = i * i\n\t}()\n}\nwg.Wait()\nfmt.Println(resultats)\n```"
    answer: '`[0 1 4]` : chaque goroutine capture la variable de son itération (Go 1.22 et plus).'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tresultats := make([]int, 3)\n\tfor i := range 3 {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresultats[i] = i * i\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(resultats)\n}\n"
      output: '[0 1 4]'
  - key: code-adresses
    format: code-output
    question: "```go\nxs := []int{1, 2, 3}\nvar ptrs []*int\nfor _, v := range xs {\n\tptrs = append(ptrs, &v)\n}\n*ptrs[0] = 100\nfmt.Println(xs[0], *ptrs[0], *ptrs[1])\n```"
    answer: '`1 100 2` : chaque `&v` pointe sur la copie de son itération, pas sur l''élément du slice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tvar ptrs []*int\n\tfor _, v := range xs {\n\t\tptrs = append(ptrs, &v)\n\t}\n\t*ptrs[0] = 100\n\tfmt.Println(xs[0], *ptrs[0], *ptrs[1])\n}\n"
      output: 1 100 2
  - key: code-externe
    format: code-output
    question: "```go\nvar fs []func()\nn := 0\nfor range 3 {\n\tn++\n\tfs = append(fs, func() { fmt.Print(n) })\n}\nfor _, f := range fs {\n\tf()\n}\nfmt.Println()\n```"
    answer: '`333` : `n` est déclarée hors de la boucle, une seule variable partagée par les trois closures.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar fs []func()\n\tn := 0\n\tfor range 3 {\n\t\tn++\n\t\tfs = append(fs, func() { fmt.Print(n) })\n\t}\n\tfor _, f := range fs {\n\t\tf()\n\t}\n\tfmt.Println()\n}\n"
      output: '333'
  - key: bug-ancien-module
    format: bug-fix
    question: "Dans un module `go 1.20`, toutes les tâches envoient le même identifiant :\n```go\nfor _, id := range ids {\n\tgo envoyer(func() string { return id })\n}\n```"
    answer: |-
      ```go
      // go.mod : monter la directive
      go 1.22
      ```
      Avec `go 1.22` ou plus dans go.mod, chaque itération a son `id`. Sans montée de version, on copie :
      `id := id` au début du corps.
  - key: bug-adresse-element
    format: bug-fix
    question: "Les remises appliquées par pointeur ne touchent pas les articles du panier :\n```go\nvar cibles []*Article\nfor _, a := range panier.Articles {\n\tif a.Promo {\n\t\tcibles = append(cibles, &a)\n\t}\n}\nfor _, c := range cibles {\n\tc.Prix -= 100\n}\n```"
    answer: "```go\nfor i := range panier.Articles {\n\tif panier.Articles[i].Promo {\n\t\tcibles = append(cibles, &panier.Articles[i])\n\t}\n}\n```\n`&a` est l'adresse d'une copie ; `&panier.Articles[i]` est celle de l'élément."
  - key: bug-copie-inutile
    format: bug-fix
    question: "En revue d'un module `go 1.26`, rendez ce code plus simple :\n```go\nfor _, t := range taches {\n\tt := t\n\tgo func(t Tache) {\n\t\texecuter(t)\n\t}(t)\n}\n```"
    answer: "```go\nfor _, t := range taches {\n\tgo func() {\n\t\texecuter(t)\n\t}()\n}\n```\nDepuis Go 1.22, `t` est propre à chaque itération : la copie et le paramètre sont inutiles."
  - key: bug-externe
    format: bug-fix
    question: "Les goroutines lisent toutes la dernière ligne :\n```go\nvar ligne string\nfor scanner.Scan() {\n\tligne = scanner.Text()\n\tgo traiter(func() string { return ligne })\n}\n```"
    answer: "```go\nfor scanner.Scan() {\n\tligne := scanner.Text()\n\tgo traiter(func() string { return ligne })\n}\n```\n`ligne`, déclarée hors de la boucle, était partagée ; déclarée dans le corps, elle est propre à chaque itération."
  - key: scenario-migration
    format: scenario
    question: Tu montes la directive `go` d'un gros module de 1.21 à 1.22. Quels effets de la nouvelle sémantique des boucles attends-tu ?
    answer: |-
      Surtout des corrections : des bugs latents de goroutines ou de closures qui capturaient la variable de boucle
      disparaissent. Les cas cassés sont rares (du code qui comptait sur le partage, ou une légère hausse d'allocations
      dans une boucle très chaude qui capture la variable). Je lance la suite de tests avec `-race`, et l'outil
      `bisect` de l'équipe Go aide à trouver une boucle responsable si un test change de comportement. Ensuite, `go fix`
      retire les copies `v := v` devenues inutiles.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te montre une boucle qui lance des goroutines capturant `i` et on te demande ce qu'elle affiche. Comment réponds-tu ?
    answer: |-
      Je demande (ou je précise) la version : dans un module en `go 1.22` ou plus, chaque goroutine voit sa propre valeur
      de `i`, dans un ordre quelconque puisque les goroutines sont concurrentes. Avant 1.22, elles partageaient une seule
      variable et voyaient probablement la dernière valeur, avec une data race que `-race` signale. J'ajoute que l'ordre
      d'affichage n'est jamais garanti sans synchronisation.
  - key: scenario-revue
    format: scenario
    question: Un collègue retire toutes les copies `i := i` d'un module encore en `go 1.21`. Que lui dis-tu ?
    answer: |-
      Que c'est prématuré : tant que la directive du module est `go 1.21`, la variable de boucle est partagée, et
      retirer les copies réintroduit les bugs. Il faut d'abord monter la directive à `go 1.22` ou plus (après tests),
      puis laisser `go fix` retirer les copies.
  - key: scenario-defer
    format: scenario
    question: Pourquoi la sémantique par itération rend-elle aussi plus sûr `defer` dans une boucle avec une closure ?
    answer: |-
      Un `defer func() { fermer(f) }()` dans une boucle capture `f` ; avec une variable partagée, tous les defer fermaient
      le dernier fichier. Avec une variable par itération, chacun ferme le sien. Mais le defer ne s'exécute toujours
      qu'à la fin de la fonction : dans une boucle sur beaucoup de fichiers, on extrait le corps dans une fonction pour
      fermer à chaque tour.
