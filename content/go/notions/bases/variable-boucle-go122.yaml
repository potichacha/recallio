notion: variable-boucle-go122
lesson: "Jusqu'à Go 1.21, la variable d'une boucle `for` était **une seule variable** pour toute la boucle, mise à jour à chaque\nitération. Une closure ou une goroutine qui la capturait voyait sa **dernière valeur** :\n\n```go\nvar fs []func()\nfor i := 0; i < 3; i++ {\n\tfs = append(fs, func() { fmt.Print(i) })\n}\nfor _, f := range fs { f() } // Go 1.21 : 333 — Go 1.22 : 012\n```\n\nDepuis **Go 1.22**, **chaque itération a sa propre variable** (`for i := ...` comme `for i, v := range ...`). Le\nchangement ne s'applique qu'aux modules dont le go.mod déclare `go 1.22` ou plus : un vieux module garde l'ancienne\nsémantique, même compilé avec un Go récent.\n\nAvant 1.22, on contournait avec une copie : `i := i` dans le corps, ou un paramètre de goroutine `go func(i int)\n{...}(i)`. Ces copies sont désormais inutiles ; `go fix` (analyseur `forvar`) les retire.\n\nCe que le changement ne règle pas : prendre l'**adresse** d'un élément via la variable de range (`&v`) donne toujours\nl'adresse d'une copie, pas celle de l'élément du slice. Et une **variable déclarée hors** de la boucle reste partagée.\n\n**Piège classique** : un module ancien (`go 1.20` dans go.mod) compilé avec Go 1.27. L'ancien comportement s'applique\ntoujours ; c'est la directive du module qui compte, pas la version du compilateur.\n\n**En entretien** : « Avant 1.22 la variable de boucle était partagée, et les goroutines voyaient la dernière valeur ;\ndepuis, une variable par itération, pour les modules en go 1.22 ou plus ; les copies `i := i` deviennent inutiles. »"
cards:
  - key: change-1-22-boucles
    format: course
    question: Qu'a changé Go 1.22 pour les boucles ?
    choices:
      - {text: "Chaque itération a sa propre variable, et `range` accepte un entier", correct: true}
      - {text: "La variable de boucle est désormais partagée par toutes les itérations", correct: false}
      - {text: "Le mot-clé `while` a été ajouté pour les boucles conditionnelles", correct: false}
      - {text: "`range` donne désormais un pointeur vers l'élément, plus une copie", correct: false}
    answer: "Chaque itération a sa propre variable, ce qui corrige les closures et goroutines qui capturaient la variable partagée ; et l'on peut écrire `for i := range 10`. La valeur reste une copie de l'élément."
  - key: code-var-funcs-func-for-i
    format: code-output
    question: |-
      Qu'affiche ce code, dans un module en `go 1.22` ou plus ?
      ```go
      var funcs []func()
      for i := 0; i < 3; i++ {
          funcs = append(funcs, func() { fmt.Print(i, " ") })
      }
      for _, f := range funcs { f() }
      ```
    choices:
      - {text: "`0 1 2`", correct: true}
      - {text: "`3 3 3`", correct: false}
      - {text: "`2 2 2`", correct: false}
      - {text: "`0 0 0`", correct: false}
    answer: "`0 1 2` avec un module en Go 1.22 ou plus (une variable par itération) ; `3 3 3` en Go 1.21 et avant (une seule variable partagée, qui vaut 3 à la fin)."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar funcs []func()\n\tfor i := 0; i < 3; i++ {\n\t    funcs = append(funcs, func() { fmt.Print(i, \" \") })\n\t}\n\tfor _, f := range funcs {\n\t    f()\n\t}\n}\n"
      output: 0 1 2
  - key: directive
    format: course
    question: Qu'est-ce qui décide de la sémantique de la variable de boucle, le compilateur ou le module ?
    choices:
      - {text: "La directive `go` du go.mod : `go 1.22` ou plus donne une variable par tour", correct: true}
      - {text: "La version du compilateur installé, quel que soit le go.mod", correct: false}
      - {text: "Une option `-loopvar` à passer à chaque `go build`", correct: false}
      - {text: "Le système d'exploitation cible, choisi par `GOOS`", correct: false}
    answer: "La directive `go` du go.mod du module : `go 1.22` ou plus donne une variable par itération ; un module plus ancien garde la variable partagée, même compilé avec un Go récent."
  - key: contournement
    format: course
    question: Comment contournait-on le partage de la variable de boucle avant Go 1.22 ?
    choices:
      - {text: "En copiant la variable dans le corps (`i := i`), ou en la passant en paramètre", correct: true}
      - {text: "En déclarant la variable avec `var` plutôt qu'avec `:=` dans l'en-tête", correct: false}
      - {text: "En appelant `runtime.Gosched()` après chaque `go` de la boucle", correct: false}
      - {text: "En passant de `for` à `range`, qui copiait déjà la variable à chaque tour", correct: false}
    answer: "En copiant la variable dans le corps (`i := i`) ou en la passant en paramètre à la goroutine (`go func(i int) { ... }(i)`). Avant 1.22, `range` partageait lui aussi sa variable."
  - key: adresse
    format: course
    question: Depuis Go 1.22, `&v` dans `for _, v := range xs` donne-t-il l'adresse de l'élément du slice ?
    choices:
      - {text: "Non : `v` reste une copie, une par tour ; l'adresse de l'élément, c'est `&xs[i]`", correct: true}
      - {text: "Oui : depuis Go 1.22, `v` est un alias de l'élément de la slice", correct: false}
      - {text: "Oui, mais seulement quand la slice contient des pointeurs", correct: false}
      - {text: "Non : prendre `&v` ne compile plus depuis Go 1.22", correct: false}
    answer: "Non : `v` reste une copie de l'élément, désormais une par itération ; pour l'adresse de l'élément, il faut `&xs[i]`."
  - key: vf-122
    format: true-false
    question: Depuis Go 1.22, chaque itération d'une boucle `for` a sa propre variable.
    truth: true
    answer: Pour les modules en `go 1.22` ou plus, aussi bien pour la forme classique que pour `range`.
  - key: vf-vieux-module
    format: true-false
    question: Un module qui déclare `go 1.20`, compilé avec Go 1.27, a une variable par itération.
    truth: false
    answer: La sémantique dépend de la directive `go` du module ; il garde l'ancien comportement.
  - key: vf-copie-utile
    format: true-false
    question: En Go 1.22 et plus, la ligne `v := v` dans une boucle range reste nécessaire avant de lancer une goroutine.
    truth: false
    answer: Elle est devenue inutile ; `go fix` la retire.
  - key: vf-externe
    format: true-false
    question: Une variable déclarée avant la boucle et modifiée dans le corps est aussi copiée à chaque itération.
    truth: false
    answer: Seules les variables déclarées par l'en-tête du `for` sont par itération.
  - key: qcm-resultat
    format: multiple-choice
    question: Dans un module `go 1.27`, que affiche `for i := range 3 { defer fmt.Print(i) }` à la fin de la fonction ?
    choices:
      - text: '`210`'
        correct: true
      - text: '`333`'
        correct: false
      - text: '`012`'
        correct: false
      - text: '`222`'
        correct: false
    answer: Les arguments du `defer` sont évalués à sa déclaration, et les defer s'exécutent en ordre inverse.
  - key: qcm-ancien
    format: multiple-choice
    question: Quel bug classique Go 1.22 a-t-il corrigé ?
    choices:
      - {text: "Des goroutines d'une boucle qui voient toutes la dernière valeur", correct: true}
      - {text: "Le débordement silencieux des entiers signés", correct: false}
      - {text: "L'ordre aléatoire d'itération des maps", correct: false}
      - {text: "La lecture d'une map nil, qui paniquait avant", correct: false}
    answer: "Le partage de la variable de boucle : les goroutines, comme les closures rangées dans une slice, voyaient toutes la même variable. Le reste n'a pas changé, et lire une map nil n'a jamais paniqué."
  - key: qcm-outil
    format: multiple-choice
    question: Quel outil retire les copies `v := v` devenues inutiles ?
    choices:
      - text: '`go fix` (ses modernisations)'
        correct: true
      - text: '`gofmt`'
        correct: false
      - text: '`go mod tidy`'
        correct: false
      - text: '`go vet -copylocks`'
        correct: false
    answer: Depuis Go 1.26, `go fix` applique des modernisations, dont celle-ci.
  - key: qcm-encore-piege
    format: multiple-choice
    question: "Lesquels de ces cas restent des pièges depuis Go 1.22 ?"
    choices:
      - text: Garder `&v` d'une variable de range pour modifier l'élément du slice
        correct: true
      - text: Capturer dans une goroutine une variable déclarée avant la boucle
        correct: true
      - text: Capturer `i` de `for i := 0; i < n; i++` dans une closure
        correct: false
      - text: Lancer `go f(v)` dans un range
        correct: false
    answer: '`v` reste une copie, et une variable externe reste partagée.'
  - key: code-goroutines
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var wg sync.WaitGroup
      resultats := make([]int, 3)
      for i := range 3 {
      	wg.Add(1)
      	go func() {
      		defer wg.Done()
      		resultats[i] = i * i
      	}()
      }
      wg.Wait()
      fmt.Println(resultats)
      ```
    choices:
      - {text: "`[0 1 4]`", correct: true}
      - {text: "`[0 1 2]`", correct: false}
      - {text: "`[0 0 0]`", correct: false}
      - {text: "Une panic : index out of range [3]", correct: false}
    answer: "`[0 1 4]` : chaque goroutine capture la variable de son itération (Go 1.22 et plus), et écrit à son propre indice, sans course."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tresultats := make([]int, 3)\n\tfor i := range 3 {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresultats[i] = i * i\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(resultats)\n}\n"
      output: '[0 1 4]'
  - key: code-adresses
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      xs := []int{1, 2, 3}
      var ptrs []*int
      for _, v := range xs {
      	ptrs = append(ptrs, &v)
      }
      *ptrs[0] = 100
      fmt.Println(xs[0], *ptrs[0], *ptrs[1])
      ```
    choices:
      - {text: "`1 100 2`", correct: true}
      - {text: "`100 100 2`", correct: false}
      - {text: "`1 100 100`", correct: false}
      - {text: "`1 1 2`", correct: false}
    answer: "`1 100 2` : chaque `&v` pointe sur la copie de son itération, pas sur l'élément de la slice, qui ne change pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\txs := []int{1, 2, 3}\n\tvar ptrs []*int\n\tfor _, v := range xs {\n\t\tptrs = append(ptrs, &v)\n\t}\n\t*ptrs[0] = 100\n\tfmt.Println(xs[0], *ptrs[0], *ptrs[1])\n}\n"
      output: 1 100 2
  - key: code-externe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var fs []func()
      n := 0
      for range 3 {
      	n++
      	fs = append(fs, func() { fmt.Print(n) })
      }
      for _, f := range fs {
      	f()
      }
      fmt.Println()
      ```
    choices:
      - {text: "`333`", correct: true}
      - {text: "`123`", correct: false}
      - {text: "`012`", correct: false}
      - {text: "`000`", correct: false}
    answer: "`333` : `n` est déclarée hors de la boucle, une seule variable partagée par les trois closures, même depuis Go 1.22."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar fs []func()\n\tn := 0\n\tfor range 3 {\n\t\tn++\n\t\tfs = append(fs, func() { fmt.Print(n) })\n\t}\n\tfor _, f := range fs {\n\t\tf()\n\t}\n\tfmt.Println()\n}\n"
      output: '333'
  - key: bug-ancien-module
    format: bug-fix
    question: |-
      Dans un module `go 1.20`, toutes les tâches envoient le même identifiant. Quelle correction est la bonne ?
      ```go
      for _, id := range ids {
      	go envoyer(func() string { return id })
      }
      ```
    choices:
      - {text: "Monter la directive du go.mod à `go 1.22`, ou copier `id := id` dans le corps", correct: true}
      - {text: "Installer Go 1.22 sur les postes, sans toucher au go.mod du module", correct: false}
      - {text: "Remplacer `go envoyer(...)` par `defer envoyer(...)` dans la boucle", correct: false}
      - {text: "Ajouter `runtime.Gosched()` après chaque `go`, pour laisser partir la tâche", correct: false}
    answer: |-
      ```go
      // go.mod : monter la directive
      go 1.22
      ```
      Avec `go 1.22` ou plus dans go.mod, chaque itération a son `id`. Sans montée de version, on copie : `id := id` au début du corps. Un compilateur récent ne suffit pas : c'est la directive qui décide.
  - key: bug-adresse-element
    format: bug-fix
    question: |-
      Les remises appliquées par pointeur ne touchent pas les articles du panier. Quelle correction est la bonne ?
      ```go
      var cibles []*Article
      for _, a := range panier.Articles {
      	if a.Promo {
      		cibles = append(cibles, &a)
      	}
      }
      for _, c := range cibles {
      	c.Prix -= 100
      }
      ```
    choices:
      - {text: "Prendre l'adresse de l'élément : `&panier.Articles[i]`", correct: true}
      - {text: "Passer le module en `go 1.22`, où `&a` vise l'élément", correct: false}
      - {text: "Copier `a := a` dans le corps, avant de prendre `&a`", correct: false}
      - {text: "Déclarer `cibles` en `[]Article` plutôt qu'en `[]*Article`", correct: false}
    answer: |-
      ```go
      for i := range panier.Articles {
      	if panier.Articles[i].Promo {
      		cibles = append(cibles, &panier.Articles[i])
      	}
      }
      ```
      `&a` est l'adresse d'une copie, même depuis Go 1.22 ; `&panier.Articles[i]` est celle de l'élément.
  - key: bug-copie-inutile
    format: bug-fix
    question: |-
      En revue d'un module `go 1.26`, comment simplifier ce code ?
      ```go
      for _, t := range taches {
      	t := t
      	go func(t Tache) {
      		executer(t)
      	}(t)
      }
      ```
    choices:
      - {text: "Retirer la copie et le paramètre : `go func() { executer(t) }()`", correct: true}
      - {text: "Rien : sans la copie, les goroutines verraient la dernière tâche", correct: false}
      - {text: "Lancer `go executer(&t)`, qui évite de copier la tâche", correct: false}
      - {text: "Déclarer la copie avec `var t = t`, plus lisible que `:=`", correct: false}
    answer: |-
      ```go
      for _, t := range taches {
      	go func() {
      		executer(t)
      	}()
      }
      ```
      Depuis Go 1.22, `t` est propre à chaque itération : la copie et le paramètre sont inutiles.
  - key: bug-externe
    format: bug-fix
    question: |-
      Les goroutines lisent toutes la dernière ligne. Quelle correction est la bonne ?
      ```go
      var ligne string
      for scanner.Scan() {
      	ligne = scanner.Text()
      	go traiter(func() string { return ligne })
      }
      ```
    choices:
      - {text: "Déclarer `ligne` dans le corps : `ligne := scanner.Text()`", correct: true}
      - {text: "Passer le module en `go 1.22`, qui donne une `ligne` par tour", correct: false}
      - {text: "Appeler `scanner.Text()` dans la goroutine, au moment du traitement", correct: false}
      - {text: "Ajouter `runtime.Gosched()` après chaque `go`, pour lire la ligne", correct: false}
    answer: |-
      ```go
      for scanner.Scan() {
      	ligne := scanner.Text()
      	go traiter(func() string { return ligne })
      }
      ```
      `ligne`, déclarée hors de la boucle, était partagée, et Go 1.22 n'y change rien ; déclarée dans le corps, elle est propre à chaque itération.
  - key: scenario-migration
    format: scenario
    question: Tu montes la directive `go` d'un gros module de 1.21 à 1.22. Quels effets de la nouvelle sémantique des boucles attends-tu ?
    choices:
      - {text: "Surtout des bugs corrigés ; je lance les tests avec `-race`, puis `go fix` retire les `v := v`", correct: true}
      - {text: "Beaucoup de code cassé : il faut réécrire chaque boucle avant de monter de version", correct: false}
      - {text: "Aucun effet : la sémantique dépend du compilateur, pas de la directive du module", correct: false}
      - {text: "Des boucles plus lentes partout, à compenser en parcourant par indices", correct: false}
    answer: "Surtout des corrections : des bugs latents de goroutines ou de closures qui capturaient la variable de boucle disparaissent. Les cas cassés sont rares (du code qui comptait sur le partage, ou un peu plus d'allocations dans une boucle très chaude). Je lance les tests avec `-race`, l'outil `bisect` aide à trouver une boucle responsable, puis `go fix` retire les copies devenues inutiles."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te montre une boucle qui lance des goroutines capturant `i` et on te demande ce qu'elle affiche. Comment réponds-tu ?
    choices:
      - {text: "Selon la directive : en 1.22 ou plus, chaque goroutine a son `i`, dans un ordre quelconque", correct: true}
      - {text: "`0 1 2 ...` dans l'ordre, puisque les goroutines démarrent dans l'ordre de la boucle", correct: false}
      - {text: "Toujours la dernière valeur de `i`, quelle que soit la version de Go du module", correct: false}
      - {text: "Une erreur de compilation : une goroutine ne peut pas capturer `i`", correct: false}
    answer: "Je demande (ou je précise) la version : dans un module en `go 1.22` ou plus, chaque goroutine voit sa propre valeur de `i`, dans un ordre quelconque puisque les goroutines sont concurrentes. Avant 1.22, elles partageaient une seule variable et voyaient probablement la dernière valeur, avec une data race que `-race` signale."
  - key: scenario-revue
    format: scenario
    question: Un collègue retire toutes les copies `i := i` d'un module encore en `go 1.21`. Que lui dis-tu ?
    choices:
      - {text: "C'est prématuré : il faut d'abord monter la directive à `go 1.22`, puis laisser `go fix` faire", correct: true}
      - {text: "Très bien : depuis que les postes ont Go 1.22, les copies ne servent plus à rien", correct: false}
      - {text: "Très bien, à condition de lancer les tests une fois de plus, sans `-race`", correct: false}
      - {text: "C'est inutile mais sans risque : ces copies n'ont jamais rien changé", correct: false}
    answer: "Que c'est prématuré : tant que la directive du module est `go 1.21`, la variable de boucle est partagée, même avec un compilateur récent, et retirer les copies réintroduit les bugs. Il faut d'abord monter la directive à `go 1.22` ou plus (après tests), puis laisser `go fix` retirer les copies."
  - key: scenario-defer
    format: scenario
    question: Pourquoi la sémantique par itération rend-elle aussi plus sûr `defer` dans une boucle avec une closure ?
    choices:
      - {text: "Chaque closure différée ferme son propre fichier ; mais les `defer` attendent toujours la fin de la fonction", correct: true}
      - {text: "Les `defer` d'une boucle s'exécutent désormais à la fin de chaque tour, et non plus de la fonction", correct: false}
      - {text: "Les `defer` ne peuvent plus capturer de variable de boucle depuis Go 1.22", correct: false}
      - {text: "Les fichiers sont fermés par le GC, qui suit désormais chaque variable de boucle", correct: false}
    answer: "Un `defer func() { fermer(f) }()` dans une boucle capture `f` ; avec une variable partagée, tous les `defer` fermaient le dernier fichier. Avec une variable par itération, chacun ferme le sien. Mais le `defer` ne s'exécute toujours qu'à la fin de la fonction : sur beaucoup de fichiers, on extrait le corps dans une fonction pour fermer à chaque tour."
