notion: shadowing
lesson: "Le **masquage** (shadowing) : une déclaration dans un bloc interne crée une **nouvelle** variable du même nom, qui\ncache celle du bloc externe jusqu'à la fin du bloc.\n\n```go\nvar err error\nif cond {\n\tresultat, err := calculer() // NOUVEAU err, local au if\n\t_ = resultat\n}\nreturn err // toujours nil : l'erreur de calculer() est perdue\n```\n\nC'est `:=` qui piège : dans un nouveau bloc (`if`, `for`, `switch`, une fonction anonyme), il déclare de nouvelles\nvariables pour **tous** les noms de gauche, même si un nom existe dans le bloc externe. Dans un **même** bloc, en\nrevanche, `:=` réutilise les variables existantes (il suffit qu'une seule soit nouvelle).\n\nLes endroits typiques : `if v, err := f(); err != nil` (le `err` est local au `if`, c'est souvent voulu), les blocs\n`if`/`else` qui affectent un résultat déclaré avant, les retours nommés masqués dans un bloc.\n\nOn s'en protège avec `=` quand on veut affecter la variable externe, et avec des outils : `go vet` avec l'analyseur\n`shadow`, ou des linters (`govet` dans golangci-lint).\n\n**Piège classique** : un retour nommé `err` masqué par `x, err := ...` dans un bloc, puis un `return` nu. Le\ncompilateur refuse parfois (« err is shadowed during return »), mais pas dans tous les cas.\n\n**En entretien** : « `:=` dans un bloc interne crée une nouvelle variable qui masque l'externe ; on utilise `=` pour\naffecter, et l'analyseur shadow pour le détecter. »"
tour:
  - title: Le masquage
    text: |-
      `:=` déclare une **nouvelle** variable dans le bloc courant. Dans un bloc interne (`if`, `for`, ou de simples
      accolades), il peut donc créer une variable du même nom qu'une variable extérieure : elle la **masque** jusqu'à la
      fin du bloc, et la variable du dehors ne change pas.

      Le piège classique : vouloir modifier une variable déclarée plus haut, et écrire `:=` au lieu de `=`. Le
      compilateur ne dit rien tant que la nouvelle variable sert à quelque chose.

      Ici, `total := total + n` crée à chaque tour un nouveau `total`, qui part du `total` extérieur, resté à 0.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	total := 0
          	for _, n := range []int{1, 2, 3} {
          		total := total + n
          		fmt.Println("dans la boucle :", total)
          	}
          	fmt.Println("après la boucle :", total)
          }
      output: |-
        dans la boucle : 1
        dans la boucle : 2
        dans la boucle : 3
        après la boucle : 0
    task:
      instructions: |-
        Ce programme devait additionner les nombres, mais il affiche `total : 0`. Corrige-le pour qu'il affiche
        `total : 6`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	total := 0
          	for _, n := range []int{1, 2, 3} {
          		total := total + n
          		_ = total
          	}
          	fmt.Println("total :", total)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	total := 0
          	for _, n := range []int{1, 2, 3} {
          		total += n
          	}
          	fmt.Println("total :", total)
          }
      output: |-
        total : 6
cards:
  - key: shadowing
    format: course
    question: "Qu'est-ce que le shadowing (masquage) d'une variable en Go ?"
    choices:
      - {text: "Une variable déclarée dans un bloc interne sous le même nom, qui masque l'externe", correct: true}
      - {text: "Une copie cachée d'une variable, que le compilateur crée à chaque affectation", correct: false}
      - {text: "Une variable de package qu'on ne peut lire que depuis son propre fichier", correct: false}
      - {text: "Une réaffectation par `=` d'une variable déjà déclarée dans le même bloc", correct: false}
    answer: "Une variable déclarée dans un bloc interne avec le même nom masque la variable externe : jusqu'à la fin du bloc, le nom désigne la nouvelle, et l'externe ne change pas."
  - key: qcm-vet
    format: multiple-choice
    question: Quel outil signale les masquages de variables ?
    choices:
      - {text: "L'analyseur `shadow` de go vet (activable dans golangci-lint)", correct: true}
      - {text: "`gofmt -s`, qui simplifie le code et signale les noms masqués", correct: false}
      - {text: "Le compilateur, qui refuse par défaut tout masquage", correct: false}
      - {text: "`go mod tidy`, qui vérifie aussi les déclarations", correct: false}
    answer: '`shadow` n''est pas actif par défaut dans `go vet` ; on l''active explicitement.'
  - key: meme-bloc
    format: course
    question: Dans un même bloc, `a, err := f()` puis `b, err := g()` crée-t-il deux variables `err` ?
    choices:
      - {text: "Non : `err` est réutilisée, seul `b` est nouveau", correct: true}
      - {text: "Oui : chaque `:=` crée une `err` qui masque la précédente", correct: false}
      - {text: "Non : le second `:=` ne compile pas, `err` existant déjà", correct: false}
      - {text: "Oui, et la première `err` est aussitôt libérée", correct: false}
    answer: "Non : dans le même bloc, `err` est réutilisée (seul `b` est nouveau, ce qui suffit à `:=`). Le masquage n'arrive que dans un bloc interne."
  - key: detecter
    format: course
    question: Comment détecter les masquages dangereux ?
    choices:
      - {text: "Avec l'analyseur `shadow` de `go vet`, et en relisant les `:=` dans les blocs", correct: true}
      - {text: "En compilant : le compilateur refuse tout masquage par défaut", correct: false}
      - {text: "Avec `gofmt -d`, qui affiche les variables masquées en couleur", correct: false}
      - {text: "Avec le détecteur de courses, en lançant `go test -race`", correct: false}
    answer: "Avec l'analyseur `shadow` de `go vet` (ou via golangci-lint), et en relisant les `:=` dans les blocs `if`, `for` et les fonctions anonymes. Le compilateur, lui, accepte le masquage."
  - key: if-init
    format: course
    question: Le `err` de `if v, err := f(); err != nil { ... }` existe-t-il après le `if` ?
    choices:
      - {text: "Non : les variables de l'initialisation sont locales au `if` et à ses `else`", correct: true}
      - {text: "Oui : elles restent visibles jusqu'à la fin de la fonction", correct: false}
      - {text: "Oui, mais seulement si le `if` n'a pas de `else`", correct: false}
      - {text: "Oui, avec la valeur qu'elle avait au dernier test du `if`", correct: false}
    answer: "Non : les variables de l'instruction d'initialisation sont locales au `if` et à ses `else`, ce qui est souvent voulu."
  - key: vf-interne
    format: true-false
    question: Dans un bloc `if`, `x := 2` modifie la variable `x` déclarée avant le `if`.
    truth: false
    answer: Il déclare un nouveau `x` local au bloc ; l'externe ne change pas.
  - key: vf-egal
    format: true-false
    question: Utiliser `=` au lieu de `:=` dans le bloc interne évite le masquage.
    truth: true
    answer: '`=` affecte la variable existante ; il faut alors déclarer avant les autres noms nouveaux.'
  - key: vf-compilateur
    format: true-false
    question: Le compilateur refuse toujours le code qui masque une variable.
    truth: false
    answer: Le masquage est légal ; seuls quelques cas (retour nu avec un retour nommé masqué) sont refusés.
  - key: vf-package
    format: true-false
    question: Une variable locale peut masquer un nom de package importé, comme `strings`.
    truth: true
    answer: C'est légal, et le package devient inaccessible dans ce bloc ; on évite de nommer ses variables comme ses imports.
  - key: qcm-perdu
    format: multiple-choice
    question: Pourquoi cette fonction renvoie-t-elle toujours nil ? `var err error` / `if ok { _, err := f() }` / `return err`
    choices:
      - text: Le `err` du bloc `if` est une nouvelle variable
        correct: true
      - text: '`f` ne renvoie jamais d''erreur'
        correct: false
      - text: '`var err error` n''est pas initialisé'
        correct: false
      - text: '`return` ignore les variables d''erreur'
        correct: false
    answer: On remplace `:=` par `=` dans le bloc.
  - key: qcm-endroits
    format: multiple-choice
    question: "Dans lesquels de ces endroits un `:=` peut-il masquer une variable ?"
    choices:
      - text: Dans le corps d'un `if` ou d'un `for`
        correct: true
      - text: Dans une fonction anonyme (closure)
        correct: true
      - text: Dans le même bloc que la déclaration d'origine
        correct: false
      - text: Au niveau du package
        correct: false
    answer: Il faut un bloc plus interne que celui de la variable masquée.
  - key: qcm-corriger
    format: multiple-choice
    question: Comment affecter le résultat à `client` déclaré avant le `if` ? `var client *Client` / `if cache { client, err := charger() ... }`
    choices:
      - {text: "Déclarer `var err error` avant, puis écrire `client, err = charger()`", correct: true}
      - {text: "Écrire `client, err := charger()` deux fois, dans le bloc et après", correct: false}
      - {text: "Renommer `client` en `Client`, pour qu'il soit visible dans le bloc", correct: false}
      - {text: "Rien : une variable déclarée avant un `if` ne s'affecte pas dedans", correct: false}
    answer: Avec `=`, les deux noms doivent exister ; on déclare `err` d'abord.
  - key: code-masque
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 1
      if true {
      	x := 2
      	fmt.Println(x)
      }
      fmt.Println(x)
      ```
    choices:
      - text: |-
          ```
          2
          1
          ```
        correct: true
      - text: |-
          ```
          2
          2
          ```
        correct: false
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - text: |-
          ```
          1
          2
          ```
        correct: false
    answer: "`2` puis `1` : le `x` du bloc est une nouvelle variable, qui masque l'externe sans la modifier."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 1\n\tif true {\n\t\tx := 2\n\t\tfmt.Println(x)\n\t}\n\tfmt.Println(x)\n}\n"
      output: |-
        2
        1
  - key: code-for
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      total := 0
      for i := 1; i <= 3; i++ {
      	total := total + i
      	_ = total
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas : `total` est déclarée deux fois", correct: false}
    answer: "`0` : chaque itération déclare un nouveau `total` local, l'externe ne change jamais. Le masquage dans un bloc interne est permis."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttotal := 0\n\tfor i := 1; i <= 3; i++ {\n\t\ttotal := total + i\n\t\t_ = total\n\t}\n\tfmt.Println(total)\n}\n"
      output: '0'
  - key: code-erreur-perdue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func f() (int, error) { return 0, errors.New("échec") }

      var err error
      if true {
      	_, err := f()
      	_ = err
      }
      fmt.Println(err)
      ```
    choices:
      - {text: "`<nil>`", correct: true}
      - {text: "`échec`", correct: false}
      - {text: "`nil`", correct: false}
      - {text: "Ça ne compile pas : `err` est déclarée deux fois", correct: false}
    answer: "`<nil>` : l'erreur a été affectée au `err` local du bloc ; celui de la fonction reste nil, que `Println` écrit `<nil>`."
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc f() (int, error) { return 0, errors.New(\"échec\") }\n\nfunc main() {\n\tvar err error\n\tif true {\n\t\t_, err := f()\n\t\t_ = err\n\t}\n\tfmt.Println(err)\n}\n"
      output: <nil>
  - key: code-package
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      strings := []string{"a", "b"}
      fmt.Println(strings.Join(strings, ","))
      ```
    choices:
      - {text: "Ça ne compile pas : la variable `strings` masque le package", correct: true}
      - {text: "`a,b` : Go distingue la variable du package par l'appel", correct: false}
      - {text: "`[a b]`", correct: false}
      - {text: "`a b`", correct: false}
    answer: "Rien : le code ne compile pas, la variable `strings` masque le package (« strings.Join undefined »)."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tstrings := []string{\"a\", \"b\"}\n\tfmt.Println(strings.Join(strings, \",\"))\n}\n"
      compiles: false
  - key: bug-erreur-perdue
    format: bug-fix
    question: |-
      Les erreurs de chargement ne remontent jamais. Quelle correction est la bonne ?
      ```go
      func charger(cache bool) (*Config, error) {
      	var cfg *Config
      	var err error
      	if !cache {
      		cfg, err := lireFichier()
      		_ = cfg
      	}
      	return cfg, err
      }
      ```
    choices:
      - {text: "Affecter avec `=` dans le bloc : `cfg, err = lireFichier()`", correct: true}
      - {text: "Retirer `_ = cfg`, qui efface la valeur lue par le bloc", correct: false}
      - {text: "Déclarer `var err error` une seconde fois dans le bloc", correct: false}
      - {text: "Remplacer `var cfg *Config` par `cfg := &Config{}`", correct: false}
    answer: |-
      ```go
      if !cache {
      	cfg, err = lireFichier()
      }
      return cfg, err
      ```
      Le `:=` du bloc déclarait de nouvelles variables `cfg` et `err` ; `=` affecte celles de la fonction.
  - key: bug-closure
    format: bug-fix
    question: |-
      Le compteur reste à 0. Quelle correction est la bonne ?
      ```go
      compte := 0
      traiter := func(n int) {
      	compte := compte + n
      	_ = compte
      }
      traiter(5)
      ```
    choices:
      - {text: "Modifier la variable capturée : `compte += n`", correct: true}
      - {text: "Passer `compte` en paramètre : `func(compte, n int)`", correct: false}
      - {text: "Renvoyer `compte` depuis la closure, sans changer l'appel", correct: false}
      - {text: "Déclarer `var compte int` au début de la closure", correct: false}
    answer: |-
      ```go
      traiter := func(n int) {
      	compte += n
      }
      ```
      Dans la closure, `:=` créait une variable locale au lieu de modifier `compte` capturée ; un paramètre serait lui aussi une copie.
  - key: bug-retour-nomme
    format: bug-fix
    question: |-
      Le compilateur signale « err is shadowed during return ». Quelle correction est la bonne ?
      ```go
      func sauver() (err error) {
      	if ok {
      		n, err := ecrire()
      		_ = n
      		return
      	}
      	return nil
      }
      ```
    choices:
      - {text: "Affecter le retour nommé, `_, err = ecrire()`, puis `return err`", correct: true}
      - {text: "Remplacer le `return` nu par `return nil`, qui compile", correct: false}
      - {text: "Ajouter `_ = err` juste avant le `return` nu", correct: false}
      - {text: "Déclarer `var err error` au début du bloc `if`", correct: false}
    answer: |-
      ```go
      func sauver() (err error) {
      	if ok {
      		_, err = ecrire()
      		return err
      	}
      	return nil
      }
      ```
      Le `err` du bloc masquait le retour nommé ; on affecte celui de la fonction et l'on préfère un `return` explicite. `return nil` compilerait, mais perdrait l'erreur.
  - key: bug-import
    format: bug-fix
    question: |-
      Le compilateur signale « url.Parse undefined (type string has no field or method Parse) ». Quelle correction est la bonne ?
      ```go
      url := "https://exemple.fr"
      u, err := url.Parse(url)
      ```
    choices:
      - {text: "Renommer la variable : `adresse := ...`, puis `url.Parse(adresse)`", correct: true}
      - {text: "Importer `net/url` une seconde fois, sous le même nom", correct: false}
      - {text: "Appeler le package par son chemin : `net/url.Parse(url)`", correct: false}
      - {text: "Écrire `url.url.Parse(url)`, pour viser le package", correct: false}
    answer: |-
      ```go
      adresse := "https://exemple.fr"
      u, err := url.Parse(adresse)
      ```
      La variable `url` masquait le package `net/url` : on la renomme. Un appel ne peut pas nommer un package par son chemin.
