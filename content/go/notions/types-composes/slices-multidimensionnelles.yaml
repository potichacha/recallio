notion: slices-multidimensionnelles
lesson: "Go n'a pas de type « matrice » : une grille se fait avec un **slice de slices** (ou un tableau de tableaux pour une\ntaille fixe).\n\n```go\n// slice de slices : chaque ligne est allouée à part\ngrille := make([][]int, hauteur)\nfor i := range grille {\n\tgrille[i] = make([]int, largeur)\n}\ngrille[2][3] = 1\n\n// tableau de tableaux : taille fixe, un seul bloc contigu\nvar plateau [8][8]rune\n\n// un seul slice et un calcul d'indice : contigu et rapide\ncases := make([]int, hauteur*largeur)\ncases[y*largeur+x] = 1\n```\n\n- `make([][]int, n)` crée seulement le slice **externe** : ses lignes valent **nil** tant qu'on ne les alloue pas.\n  Écrire `grille[0][0]` avant panique.\n- Les lignes peuvent avoir des **longueurs différentes** (tableau « déchiqueté »).\n- Copier une grille demande de copier **chaque ligne** (sinon les lignes sont partagées).\n- Pour la performance, un slice unique indexé par `y*largeur+x` évite une allocation par ligne et améliore la\n  localité mémoire.\n\n**Piège classique** : réutiliser la même ligne pour toutes les rangées (`ligne := make([]int, l); for i := range g {\ng[i] = ligne }`). Toutes les rangées partagent alors le même tableau.\n\n**En entretien** : « Un slice de slices, en allouant chaque ligne ; un tableau de tableaux pour une taille fixe ; un\nslice plat indexé par y*largeur+x pour la performance. »"
cards:
  - key: lignes-nil
    format: course
    question: Que contient `make([][]int, 3)` ?
    answer: 'Trois lignes nil : seul le slice externe est alloué, il faut créer chaque ligne avec `make`.'
  - key: plat
    format: course
    question: Pourquoi utiliser un slice plat indexé par `y*largeur+x` ?
    answer: Une seule allocation, des données contiguës (meilleure localité de cache) et une copie triviale ; au prix d'un calcul d'indice.
  - key: dechiquete
    format: course
    question: Les lignes d'un `[][]int` ont-elles toutes la même longueur ?
    answer: 'Pas forcément : chaque ligne est un slice indépendant, qui peut avoir sa propre longueur.'
  - key: copie
    format: course
    question: Comment copier une grille `[][]int` sans partager les lignes ?
    answer: Créer un nouveau slice externe, puis cloner chaque ligne (`slices.Clone(grille[i])`).
  - key: vf-make-lignes
    format: true-false
    question: '`make([][]int, 3, 3)` alloue aussi trois lignes de longueur 3.'
    truth: false
    answer: Le second argument est la capacité du slice externe ; les lignes restent nil.
  - key: vf-tableau
    format: true-false
    question: '`var p [8][8]int` est un seul bloc mémoire contigu de 64 entiers.'
    truth: true
    answer: Un tableau de tableaux est contigu ; un slice de slices ne l'est pas.
  - key: vf-partage
    format: true-false
    question: Affecter la même ligne à toutes les rangées d'une grille crée des rangées indépendantes.
    truth: false
    answer: Toutes les rangées partagent alors le même tableau.
  - key: vf-copie-grille
    format: true-false
    question: Copier un `[8][8]int` par affectation copie toutes les cases.
    truth: true
    answer: Un tableau est une valeur, copiée en entier.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer une grille 3x4 d'entiers modifiable ?
    choices:
      - text: '`g := make([][]int, 3)` puis `g[i] = make([]int, 4)` pour chaque i'
        correct: true
      - text: '`var g [3][4]int`'
        correct: true
      - text: '`g := make([][]int, 3, 4)`'
        correct: false
      - text: '`g := make([3][4]int)`'
        correct: false
    answer: '`make` ne crée pas de tableau, et ne crée pas les lignes d''un slice de slices.'
  - key: qcm-indice-plat
    format: multiple-choice
    question: Dans un slice plat de largeur 5, quel est l'indice de la case (x=2, y=3) ?
    choices:
      - text: '17'
        correct: true
      - text: '13'
        correct: false
      - text: '10'
        correct: false
      - text: '6'
        correct: false
    answer: '`y*largeur + x = 3*5 + 2`.'
  - key: qcm-panique
    format: multiple-choice
    question: Après `g := make([][]int, 2)`, que fait `g[0][0] = 1` ?
    choices:
      - text: Une panique « index out of range [0] with length 0 »
        correct: true
      - text: Elle écrit 1 dans la première case
        correct: false
      - text: Elle alloue la ligne automatiquement
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: '`g[0]` est un slice nil, de longueur 0.'
  - key: qcm-copie
    format: multiple-choice
    question: Quelle copie de `g [][]int` est indépendante ?
    choices:
      - text: Un nouveau slice externe dont chaque ligne est `slices.Clone(g[i])`
        correct: true
      - text: '`slices.Clone(g)`'
        correct: false
      - text: '`copy(dst, g)` avec `dst` de même longueur'
        correct: false
      - text: '`h := g`'
        correct: false
    answer: Les trois autres partagent les lignes.
  - key: code-dechiquete
    format: code-output
    question: "```go\ntriangle := make([][]int, 4)\nfor i := range triangle {\n\ttriangle[i] = make([]int, i+1)\n\ttriangle[i][0], triangle[i][i] = 1, 1\n\tfor j := 1; j < i; j++ {\n\t\ttriangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j]\n\t}\n}\nfmt.Println(triangle)\n```"
    answer: '`[[1] [1 1] [1 2 1] [1 3 3 1]]` : des lignes de longueurs différentes.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ttriangle := make([][]int, 4)\n\tfor i := range triangle {\n\t\ttriangle[i] = make([]int, i+1)\n\t\ttriangle[i][0], triangle[i][i] = 1, 1\n\t\tfor j := 1; j < i; j++ {\n\t\t\ttriangle[i][j] = triangle[i-1][j-1] + triangle[i-1][j]\n\t\t}\n\t}\n\tfmt.Println(triangle)\n}\n"
      output: '[[1] [1 1] [1 2 1] [1 3 3 1]]'
  - key: code-ligne-partagee
    format: code-output
    question: "```go\nligne := make([]int, 3)\ng := make([][]int, 2)\nfor i := range g {\n\tg[i] = ligne\n}\ng[0][1] = 5\nfmt.Println(g)\n```"
    answer: '`[[0 5 0] [0 5 0]]` : les deux rangées partagent le même tableau.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tligne := make([]int, 3)\n\tg := make([][]int, 2)\n\tfor i := range g {\n\t\tg[i] = ligne\n\t}\n\tg[0][1] = 5\n\tfmt.Println(g)\n}\n"
      output: '[[0 5 0] [0 5 0]]'
  - key: code-plat
    format: code-output
    question: |-
      ```go
      largeur, hauteur := 3, 2
      cases := make([]int, largeur*hauteur)
      cases[1*largeur+2] = 9
      fmt.Println(cases)
      ```
    answer: '`[0 0 0 0 0 9]` : la case (x=2, y=1) est à l''indice 5.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tlargeur, hauteur := 3, 2\n\tcases := make([]int, largeur*hauteur)\n\tcases[1*largeur+2] = 9\n\tfmt.Println(cases)\n}\n"
      output: '[0 0 0 0 0 9]'
  - key: code-lignes-nil
    format: code-output
    question: |-
      ```go
      g := make([][]int, 2)
      fmt.Println(len(g), g[0] == nil)
      g[0][0] = 1
      ```
    answer: '`2 true`, puis une panique : la ligne n''a pas été allouée.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tg := make([][]int, 2)\n\tfmt.Println(len(g), g[0] == nil)\n\tg[0][0] = 1\n}\n"
      output: 2 true
      panics: index out of range [0] with length 0
  - key: bug-lignes
    format: bug-fix
    question: |-
      Le service panique avec « index out of range [0] with length 0 » :
      ```go
      g := make([][]bool, h)
      g[y][x] = true
      ```
    answer: "```go\ng := make([][]bool, h)\nfor i := range g {\n\tg[i] = make([]bool, l)\n}\ng[y][x] = true\n```\n`make` ne crée que le slice externe : chaque ligne doit être allouée."
  - key: bug-partage
    format: bug-fix
    question: "Colorier une case colorie toute la colonne :\n```go\nligne := make([]int, largeur)\nfor y := range grille {\n\tgrille[y] = ligne\n}\n```"
    answer: "```go\nfor y := range grille {\n\tgrille[y] = make([]int, largeur)\n}\n```\nToutes les rangées pointaient sur le même tableau : chacune doit avoir le sien."
  - key: bug-copie
    format: bug-fix
    question: |-
      Annuler un coup ne restaure pas l'état du plateau :
      ```go
      sauvegarde := slices.Clone(plateau) // plateau [][]rune
      jouer(plateau)
      plateau = sauvegarde
      ```
    answer: "```go\nsauvegarde := make([][]rune, len(plateau))\nfor i, ligne := range plateau {\n\tsauvegarde[i] = slices.Clone(ligne)\n}\n```\nLe clone superficiel partageait les lignes, modifiées par `jouer`. (Avec un `[8][8]rune`, une simple affectation\nsuffirait.)"
  - key: bug-performance
    format: bug-fix
    question: Le profileur montre des milliers de petites allocations pour une image de 1000x1000 pixels stockée en `[][]uint32`. Que proposes-tu ?
    answer: "```go\ntype Image struct {\n\tLargeur, Hauteur int\n\tPixels           []uint32\n}\n\nfunc (im *Image) At(x, y int) uint32 { return im.Pixels[y*im.Largeur+x] }\n```\nUn slice plat fait une seule allocation et garde les pixels contigus ; c'est l'approche du package `image`."
