notion: slice-interne
lesson: |-
  Un slice est un petit **descripteur** de trois mots :

  ```
  slice ─► [ pointeur vers le tableau | len | cap ]
  ```

  Copier un slice (affectation, passage en paramètre) copie ce descripteur, pas les éléments : les deux copies
  pointent sur le **même tableau**.

  **append** :
  - si `len < cap`, il écrit dans le tableau existant et renvoie un descripteur de longueur `len+1` (même pointeur) ;
  - sinon, il **alloue un nouveau tableau** plus grand, copie les éléments, et renvoie un descripteur qui pointe
    ailleurs.

  D'où la règle : **toujours réaffecter** le résultat, `s = append(s, x)` ; l'ancien descripteur garde l'ancienne
  longueur (et parfois l'ancien tableau).

  La croissance : la capacité **double** pour les petits slices, puis augmente d'environ **25 %** au-delà de quelques
  centaines d'éléments (la règle exacte, arrondie aux tailles d'allocation, n'est pas garantie par la spécification).
  Ajouter n éléments un par un coûte donc O(n) en moyenne, mais chaque réallocation copie tout : quand on connaît la
  taille, on **préalloue** avec `make([]T, 0, n)`.

  **Piège classique** : croire qu'`append` dans une fonction modifie le slice de l'appelant. La fonction modifie sa copie
  du descripteur ; l'appelant garde sa longueur.

  **En entretien** : « Un descripteur pointeur, longueur, capacité ; append écrit en place s'il reste de la capacité,
  sinon réalloue ; on réaffecte toujours le résultat, et l'on préalloue quand on connaît la taille. »
cards:
  - key: contient-tete-slice
    format: course
    question: "Que contient l'en-tête d'un slice ?"
    choices:
      - {text: "Un pointeur vers le tableau sous-jacent, la longueur et la capacité", correct: true}
      - {text: "Une copie des éléments, avec la longueur et la capacité", correct: false}
      - {text: "Un pointeur vers le tableau sous-jacent, et la longueur seule", correct: false}
      - {text: "Le type des éléments, la longueur et un pointeur vers le suivant", correct: false}
    answer: "Trois mots : un pointeur vers le tableau sous-jacent, la longueur (`len`) et la capacité (`cap`). Les éléments vivent dans le tableau ; copier un slice ne copie que ces trois mots."
  - key: ecrire-append-x
    format: course
    question: Pourquoi écrire `s = append(s, x)` ?
    choices:
      - {text: "`append` peut renvoyer un en-tête vers un nouveau tableau, perdu sans réaffectation", correct: true}
      - {text: "`append` modifie `s` en place ; la réaffectation ne sert qu'à la lisibilité", correct: false}
      - {text: "La réaffectation libère tout de suite l'ancien tableau, sans attendre le GC", correct: false}
      - {text: "Sans réaffectation, `append` panique dès que la capacité est atteinte", correct: false}
    answer: "`append` renvoie un nouvel en-tête : la longueur a changé, et le tableau aussi s'il a fallu réallouer. Sans réaffectation, ce résultat est perdu (et le compilateur refuse un `append` dont le résultat n'est pas utilisé)."
  - key: croit-capacite-lors-append
    format: course
    question: "Comment croît la capacité d'un slice quand un `append` la dépasse ?"
    choices:
      - {text: "Elle double environ pour les petits slices, puis grandit plus doucement", correct: true}
      - {text: "Elle augmente d'un seul élément à chaque `append`, au plus juste", correct: false}
      - {text: "Elle double toujours, quelle que soit la taille du slice", correct: false}
      - {text: "Elle augmente toujours de 50 %, comme une `ArrayList` Java", correct: false}
    answer: "Environ un doublement jusqu'à 256 éléments, puis une croissance plus progressive (vers 1,25 fois), arrondie aux classes de taille de l'allocateur : le coût amorti d'`append` reste constant."
  - key: definition-append
    format: definition
    question: "Que désigne `append` en Go ?"
    choices:
      - {text: "La fonction native qui ajoute des éléments à un slice, en réallouant au besoin", correct: true}
      - {text: "La méthode des slices qui ajoute un élément en place, sans rien renvoyer", correct: false}
      - {text: "La fonction native qui copie les éléments d'un slice dans un autre", correct: false}
      - {text: "La fonction de `strings` qui concatène des chaînes avec un séparateur", correct: false}
    answer: "Une fonction intégrée, `s = append(s, x...)`, qui ajoute à un slice et peut réallouer : elle renvoie le nouveau slice. Copier, c'est `copy` ; concaténer avec un séparateur, `strings.Join`."
  - key: definition-slice
    format: definition
    question: "Que désigne un slice en Go ?"
    choices:
      - {text: "Une vue (pointeur, longueur, capacité) sur un tableau sous-jacent", correct: true}
      - {text: "Un tableau de taille fixe, dont la taille fait partie du type", correct: false}
      - {text: "Une liste chaînée d'éléments, qui grandit nœud par nœud", correct: false}
      - {text: "Une copie d'une partie d'un tableau, indépendante de l'original", correct: false}
    answer: "Une vue sur un tableau : un pointeur, une longueur et une capacité. Le tableau de taille fixe, c'est `[N]T` ; découper ne copie rien."
  - key: copie-descripteur
    format: course
    question: Que copie l'affectation `t := s` pour un slice ?
    choices:
      - {text: "L'en-tête seulement : `t` et `s` partagent le même tableau", correct: true}
      - {text: "Tous les éléments, dans un nouveau tableau de même capacité", correct: false}
      - {text: "Rien : `t` devient un autre nom pour la variable `s` elle-même", correct: false}
      - {text: "Les éléments, mais pas la capacité, remise à la longueur", correct: false}
    answer: "Le descripteur (pointeur, longueur, capacité) : `t` et `s` partagent le même tableau, donc `t[0] = x` se voit dans `s`. Mais ce sont deux variables : un `append` sur `t` ne change pas la longueur de `s`."
  - key: vf-toujours-realloue
    format: true-false
    question: '`append` alloue toujours un nouveau tableau.'
    truth: false
    answer: Seulement quand la capacité est insuffisante ; sinon il écrit dans le tableau existant.
  - key: vf-descripteur
    format: true-false
    question: Un slice passé à une fonction lui donne accès aux mêmes éléments que l'appelant.
    truth: true
    answer: Le descripteur copié pointe sur le même tableau.
  - key: vf-croissance-garantie
    format: true-false
    question: La spécification de Go garantit que la capacité double à chaque réallocation.
    truth: false
    answer: La règle de croissance est un détail d'implémentation (doublement pour les petits slices, environ 25 % ensuite).
  - key: vf-taille
    format: true-false
    question: Sur une machine 64 bits, un descripteur de slice occupe 24 octets.
    truth: true
    answer: 'Trois mots de 8 octets : pointeur, longueur, capacité.'
  - key: qcm-contenu
    format: multiple-choice
    question: "Que contient le descripteur d'un slice, en plus de sa longueur et de sa capacité ?"
    choices:
      - {text: "Un pointeur vers le tableau sous-jacent", correct: true}
      - {text: "Une copie des éléments du slice", correct: false}
      - {text: "Le type des éléments, lu à l'exécution", correct: false}
      - {text: "Un verrou pour les accès concurrents", correct: false}
    answer: "Trois mots : pointeur, longueur, capacité ; les éléments vivent dans le tableau, et leur type est connu à la compilation."
  - key: qcm-reaffecter
    format: multiple-choice
    question: "Que fait le compilateur d'une instruction `append(s, x)` seule, sans réaffectation ?"
    choices:
      - {text: "Il la refuse : le résultat d'`append` n'est pas utilisé", correct: true}
      - {text: "Il l'accepte, et `s` grandit d'un élément en place", correct: false}
      - {text: "Il l'accepte, mais l'élément ajouté est perdu", correct: false}
      - {text: "Il l'accepte, et seul `go vet` la signale", correct: false}
    answer: "« append(s, x) (value of type []int) is not used » : le compilateur refuse d'ignorer le résultat d'`append`, qui porte la nouvelle longueur, et parfois le nouveau tableau."
  - key: qcm-prealloc
    format: multiple-choice
    question: Pourquoi préallouer avec `make([]T, 0, n)` quand on connaît la taille finale ?
    choices:
      - {text: "Pour éviter les réallocations et copies successives d'`append`", correct: true}
      - {text: "Parce qu'`append` ne fonctionne pas sur un slice sans capacité", correct: false}
      - {text: "Pour que le slice devienne comparable avec `==`", correct: false}
      - {text: "Pour que `len(s)` vaille n dès la création du slice", correct: false}
    answer: "Un seul tableau est alloué, rempli sans copie ; le ramasse-miettes a aussi moins de tableaux abandonnés à récupérer. `append` marche sans capacité, et la longueur reste 0."
  - key: qcm-apres-append
    format: multiple-choice
    question: Avec `s := make([]int, 3, 3)` puis `t := append(s, 4)`, que vaut `cap(s)` ?
    choices:
      - text: 3, `s` n'a pas changé
        correct: true
      - text: '4'
        correct: false
      - text: 6, la capacité de t
        correct: false
      - text: '0'
        correct: false
    answer: '`append` a renvoyé un nouveau descripteur (et un nouveau tableau) dans `t`.'
  - key: code-capacite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := make([]int, 0, 2)
      for i := range 3 {
      	s = append(s, i)
      	fmt.Print(len(s), cap(s) >= len(s), " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`1 true 2 true 3 true`", correct: true}
      - {text: "`1 true 2 true 3 false`", correct: false}
      - {text: "`0 true 1 true 2 true`", correct: false}
      - {text: "`1 false 2 false 3 false`", correct: false}
    answer: "`1 true 2 true 3 true` : la longueur suit les ajouts, et la capacité grandit quand il le faut ; elle n'est jamais inférieure à la longueur."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 0, 2)\n\tfor i := range 3 {\n\t\ts = append(s, i)\n\t\tfmt.Print(len(s), cap(s) >= len(s), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 true 2 true 3 true
  - key: code-pointeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := make([]int, 2, 2)
      t := append(s, 3)
      t[0] = 9
      u := s[:1]
      u[0] = 7
      fmt.Println(s[0], t[0])
      ```
    choices:
      - {text: "`7 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`7 7`", correct: false}
      - {text: "`0 9`", correct: false}
    answer: "`7 9` : `s` est plein (capacité 2), donc `append` donne à `t` un nouveau tableau ; `u` partage celui de `s`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 2, 2)\n\tt := append(s, 3)\n\tt[0] = 9\n\tu := s[:1]\n\tu[0] = 7\n\tfmt.Println(s[0], t[0])\n}\n"
      output: 7 9
  - key: code-fonction-append
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func ajouter(s []int) []int {
      	return append(s, 100)
      }

      s := []int{1, 2}
      ajouter(s)
      t := ajouter(s)
      fmt.Println(len(s), len(t))
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`4 4`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`2 2`", correct: false}
    answer: "`2 3` : le slice de l'appelant garde sa longueur ; seul le résultat réaffecté (`t`) voit l'élément ajouté."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(s []int) []int {\n\treturn append(s, 100)\n}\n\nfunc main() {\n\ts := []int{1, 2}\n\tajouter(s)\n\tt := ajouter(s)\n\tfmt.Println(len(s), len(t))\n}\n"
      output: 2 3
  - key: code-prealloc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := make([]int, 0, 1000)
      p := &s[:1][0]
      for i := range 1000 {
      	s = append(s, i)
      }
      fmt.Println(p == &s[0], len(s), cap(s))
      ```
    choices:
      - {text: "`true 1000 1000`", correct: true}
      - {text: "`false 1000 1024`", correct: false}
      - {text: "`true 1000 1024`", correct: false}
      - {text: "`false 1000 1000`", correct: false}
    answer: "`true 1000 1000` : avec la capacité préallouée, `append` n'a jamais réalloué le tableau ; le premier élément est resté à la même adresse."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 0, 1000)\n\tp := &s[:1][0]\n\tfor i := range 1000 {\n\t\ts = append(s, i)\n\t}\n\tfmt.Println(p == &s[0], len(s), cap(s))\n}\n"
      output: true 1000 1000
  - key: bug-append-ignore
    format: bug-fix
    question: |-
      Le compilateur signale « append(lignes, l) (value of type []string) is not used ». Quelle correction est la bonne ?
      ```go
      for _, l := range entree {
      	append(lignes, l)
      }
      ```
    choices:
      - {text: "Réaffecter le résultat : `lignes = append(lignes, l)`", correct: true}
      - {text: "Ignorer le résultat explicitement : `_ = append(lignes, l)`", correct: false}
      - {text: "Préallouer `lignes` avec `make([]string, 0, len(entree))`", correct: false}
      - {text: "Appeler `append` comme une méthode : `lignes.append(l)`", correct: false}
    answer: |-
      ```go
      for _, l := range entree {
      	lignes = append(lignes, l)
      }
      ```
      Le résultat d'`append` est le nouveau descripteur : il faut le réaffecter. `_ = append(...)` compilerait, mais perdrait chaque ligne.
  - key: bug-fonction
    format: bug-fix
    question: |-
      Les erreurs collectées par la fonction disparaissent. Quelle correction est la bonne ?
      ```go
      func valider(c Commande, erreurs []string) {
      	if c.Total < 0 {
      		erreurs = append(erreurs, "total négatif")
      	}
      }
      ```
    choices:
      - {text: "Renvoyer le slice et le réaffecter : `erreurs = valider(c, erreurs)`", correct: true}
      - {text: "Créer `erreurs` avec `make([]string, 0, 10)` avant d'appeler la fonction", correct: false}
      - {text: "Déclarer le paramètre en variadique, `erreurs ...string`", correct: false}
      - {text: "Écrire `erreurs[len(erreurs)] = \"total négatif\"` au lieu d'`append`", correct: false}
    answer: |-
      ```go
      func valider(c Commande, erreurs []string) []string {
      	if c.Total < 0 {
      		erreurs = append(erreurs, "total négatif")
      	}
      	return erreurs
      }

      erreurs = valider(c, erreurs)
      ```
      La fonction modifiait sa copie du descripteur ; on renvoie le nouveau slice (ou l'on passe un `*[]string`). Avec de la capacité, l'élément serait écrit dans le tableau partagé, mais la longueur de l'appelant resterait 0.
  - key: bug-reallocations
    format: bug-fix
    question: |-
      Le profileur montre que la construction d'un rapport d'un million de lignes passe son temps en `growslice`. Quelle correction est la bonne ?
      ```go
      var lignes []Ligne
      for _, e := range evenements {
      	lignes = append(lignes, convertir(e))
      }
      ```
    choices:
      - {text: "Préallouer la capacité : `make([]Ligne, 0, len(evenements))`", correct: true}
      - {text: "Préallouer la longueur : `make([]Ligne, len(evenements))`, avec le même `append`", correct: false}
      - {text: "Remplacer le slice par une `container/list`, qui ne réalloue jamais", correct: false}
      - {text: "Appeler `runtime.GC()` toutes les mille lignes, pour libérer les anciens tableaux", correct: false}
    answer: |-
      ```go
      lignes := make([]Ligne, 0, len(evenements))
      for _, e := range evenements {
      	lignes = append(lignes, convertir(e))
      }
      ```
      Préallouer la capacité évite les réallocations et copies répétées. Préallouer la longueur ajouterait un million de zéros avant les lignes.
  - key: bug-pointeur-element
    format: bug-fix
    question: |-
      Le pointeur vers le premier article ne voit plus les modifications après des ajouts. Pourquoi ?
      ```go
      premier := &articles[0]
      articles = append(articles, nouveaux...)
      articles[0].Prix = 0
      fmt.Println(premier.Prix) // ancien prix
      ```
    choices:
      - {text: "`append` a réalloué le tableau : le pointeur désigne l'ancien", correct: true}
      - {text: "`&articles[0]` copie l'article au moment où on prend l'adresse", correct: false}
      - {text: "Le ramasse-miettes a déplacé le tableau pendant les ajouts", correct: false}
      - {text: "`articles[0].Prix = 0` modifie une copie temporaire de l'article", correct: false}
    answer: |-
      ```go
      articles = append(articles, nouveaux...)
      premier := &articles[0]
      ```
      `append` a réalloué le tableau : l'ancien pointeur désigne l'ancien tableau. On prend l'adresse après les ajouts,
      ou l'on garde un indice plutôt qu'un pointeur. Le ramasse-miettes de Go ne déplace pas les objets du tas.
  - key: scenario-expliquer
    format: scenario
    question: "Ton collègue ne comprend pas pourquoi une fonction qui fait `append` sur un slice reçu semble parfois modifier l'appelant, et parfois non. Que lui expliques-tu ?"
    choices:
      - {text: "Elle reçoit une copie de l'en-tête : avec de la capacité, elle écrit dans le tableau partagé ; sinon, dans un nouveau", correct: true}
      - {text: "Les slices passent par référence, mais le compilateur copie parfois le tableau pour l'optimiser", correct: false}
      - {text: "`append` est asynchrone : l'appelant ne voit l'élément que si la fonction a fini à temps", correct: false}
      - {text: "Elle reçoit une copie de tous les éléments ; l'appelant ne voit un changement que par hasard", correct: false}
    answer: "La fonction reçoit une copie du descripteur. Avec de la capacité, `append` écrit dans le tableau partagé, mais la longueur de l'appelant ne change pas ; sans capacité, il réalloue et la fonction travaille sur un autre tableau. Règle : une fonction qui ajoute renvoie le nouveau slice, comme `append`."
  - key: scenario-memoire
    format: scenario
    question: Un service garde en mémoire de nombreux petits slices obtenus en découpant de gros tampons, et sa mémoire ne baisse jamais. Que se passe-t-il ?
    choices:
      - {text: "Chaque petit slice garde vivant son gros tableau : je copie la partie utile", correct: true}
      - {text: "Le ramasse-miettes ne libère jamais un slice : je force `runtime.GC()`", correct: false}
      - {text: "Les petits slices vivent sur la pile, qui ne rétrécit jamais", correct: false}
      - {text: "Je limite la capacité des petits slices, ce qui libère le reste du tampon", correct: false}
    answer: "Chaque petit slice pointe sur le gros tableau d'origine : tant qu'il existe, le GC ne peut pas libérer le tableau entier, et limiter la capacité n'y change rien. On copie les données utiles (`slices.Clone(gros[a:b])`, `bytes.Clone`) avant de les garder ; le profil mémoire (`inuse_space`) montre où les gros tableaux sont alloués."
  - key: scenario-prealloc
    format: scenario
    question: Quand préallouer un slice, et quand ne pas s'en soucier ?
    choices:
      - {text: "Quand je connais la taille finale ou une bonne borne ; sinon, `append` sur un slice nil suffit", correct: true}
      - {text: "Toujours : un slice sans capacité initiale réalloue son tableau à chaque `append`", correct: false}
      - {text: "Jamais : le compilateur devine la taille finale et préalloue lui-même le tableau", correct: false}
      - {text: "Seulement au-delà de 256 éléments, quand la croissance de la capacité ralentit", correct: false}
    answer: "Préallouer vaut quand on connaît la taille finale ou une bonne borne (conversion d'un autre slice, nombre de lignes connu), surtout dans un chemin chaud. Sinon, `append` sur un slice nil suffit : sa croissance amortie est efficace, et le code reste simple ; le linter `prealloc` signale les cas évidents."
  - key: scenario-capacite-cachee
    format: scenario
    question: Une fonction renvoie `buf[:n]` d'un tampon interne réutilisé. Quel risque pour l'appelant ?
    choices:
      - {text: "Ses données changent au prochain appel, qui réécrit dans le tampon partagé", correct: true}
      - {text: "Aucun : `buf[:n]` renvoie une copie des n premiers octets du tampon", correct: false}
      - {text: "Le tampon est libéré au retour, et l'appelant lit de la mémoire libérée", correct: false}
      - {text: "Le résultat est en lecture seule : un `append` de l'appelant panique", correct: false}
    answer: "Le slice renvoyé partage le tampon interne : au prochain appel, la fonction réécrit dedans, et un `append` de l'appelant écrit dans sa capacité restante. On documente que le résultat ne vaut que jusqu'au prochain appel (comme `bufio.Scanner.Bytes`), ou l'on renvoie une copie (`bytes.Clone`)."
  - key: definition-capacite
    format: definition
    question: "Que désigne la capacité d'un slice ?"
    choices:
      - {text: "Le nombre d'éléments que le tableau peut contenir depuis le début du slice, sans réallouer", correct: true}
      - {text: "Le nombre d'éléments accessibles par un indice, de 0 à `len(s) - 1`", correct: false}
      - {text: "La taille totale du tableau sous-jacent, comptée depuis son premier élément", correct: false}
      - {text: "Le nombre maximal d'éléments que le slice pourra jamais contenir", correct: false}
    answer: "`cap(s)` : la place disponible dans le tableau sous-jacent à partir du début du slice ; `s[2:]` a deux places de moins que `s`. Les éléments accessibles, c'est la longueur, et `append` dépasse la capacité en réallouant."
  - key: definition-tableau-sous-jacent
    format: definition
    question: "Que désigne le tableau sous-jacent d'un slice ?"
    choices:
      - {text: "Le tableau sur lequel pointe le slice, que plusieurs slices peuvent partager", correct: true}
      - {text: "Une copie privée des éléments, propre à chaque slice", correct: false}
      - {text: "Un tableau `[N]T` qu'il faut déclarer avant de créer un slice", correct: false}
      - {text: "La zone où sont rangées la longueur et la capacité du slice", correct: false}
    answer: "Le tableau où vivent les éléments, alloué par `make`, un littéral ou `append` : plusieurs slices peuvent le partager, et une écriture par l'un se voit par les autres."
