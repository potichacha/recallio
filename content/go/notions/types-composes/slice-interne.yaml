notion: slice-interne
lesson: |-
  Un slice est un petit **descripteur** de trois mots :

  ```
  slice ─► [ pointeur vers le tableau | len | cap ]
  ```

  Copier un slice (affectation, passage en paramètre) copie ce descripteur, pas les éléments : les deux copies
  pointent sur le **même tableau**.

  **append** :
  - si `len < cap`, il écrit dans le tableau existant et renvoie un descripteur de longueur `len+1` (même pointeur) ;
  - sinon, il **alloue un nouveau tableau** plus grand, copie les éléments, et renvoie un descripteur qui pointe
    ailleurs.

  D'où la règle : **toujours réaffecter** le résultat, `s = append(s, x)` ; l'ancien descripteur garde l'ancienne
  longueur (et parfois l'ancien tableau).

  La croissance : la capacité **double** pour les petits slices, puis augmente d'environ **25 %** au-delà de quelques
  centaines d'éléments (la règle exacte, arrondie aux tailles d'allocation, n'est pas garantie par la spécification).
  Ajouter n éléments un par un coûte donc O(n) en moyenne, mais chaque réallocation copie tout : quand on connaît la
  taille, on **préalloue** avec `make([]T, 0, n)`.

  **Piège classique** : croire qu'`append` dans une fonction modifie le slice de l'appelant. La fonction modifie sa copie
  du descripteur ; l'appelant garde sa longueur.

  **En entretien** : « Un descripteur pointeur, longueur, capacité ; append écrit en place s'il reste de la capacité,
  sinon réalloue ; on réaffecte toujours le résultat, et l'on préalloue quand on connaît la taille. »
cards:
  - key: contient-tete-slice
    format: course
    question: Que contient un en-tête de slice ?
    answer: Un pointeur vers le tableau sous-jacent, la longueur et la capacité.
  - key: ecrire-append-x
    format: course
    question: Pourquoi écrire `s = append(s, x)` ?
    answer: append peut renvoyer un en-tête vers un nouveau tableau ; sans réaffectation on perd le résultat.
  - key: croit-capacite-lors-append
    format: course
    question: Comment croît la capacité lors d'un append ?
    answer: Environ un doublement pour les petits slices, puis une croissance plus progressive au-delà de 256 éléments.
  - key: definition-append
    format: definition
    question: append
    answer: Fonction intégrée qui ajoute à un slice et peut réallouer
  - key: definition-slice
    format: definition
    question: slice
    answer: Vue (pointeur, longueur, capacité) sur un tableau
  - key: copie-descripteur
    format: course
    question: Que copie l'affectation `t := s` pour un slice ?
    answer: Le descripteur (pointeur, longueur, capacité) ; `t` et `s` partagent le même tableau.
  - key: vf-toujours-realloue
    format: true-false
    question: '`append` alloue toujours un nouveau tableau.'
    truth: false
    answer: Seulement quand la capacité est insuffisante ; sinon il écrit dans le tableau existant.
  - key: vf-descripteur
    format: true-false
    question: Un slice passé à une fonction lui donne accès aux mêmes éléments que l'appelant.
    truth: true
    answer: Le descripteur copié pointe sur le même tableau.
  - key: vf-croissance-garantie
    format: true-false
    question: La spécification de Go garantit que la capacité double à chaque réallocation.
    truth: false
    answer: La règle de croissance est un détail d'implémentation (doublement pour les petits slices, environ 25 % ensuite).
  - key: vf-taille
    format: true-false
    question: Sur une machine 64 bits, un descripteur de slice occupe 24 octets.
    truth: true
    answer: 'Trois mots de 8 octets : pointeur, longueur, capacité.'
  - key: qcm-contenu
    format: multiple-choice
    question: Que contient le descripteur d'un slice ?
    choices:
      - text: Un pointeur vers le tableau sous-jacent
        correct: true
      - text: La longueur et la capacité
        correct: true
      - text: Une copie des éléments
        correct: false
      - text: Le type des éléments à l'exécution
        correct: false
    answer: Trois mots ; les éléments vivent dans le tableau.
  - key: qcm-reaffecter
    format: multiple-choice
    question: Pourquoi écrire `s = append(s, x)` et pas seulement `append(s, x)` ?
    choices:
      - text: '`append` renvoie un descripteur dont la longueur, et parfois le tableau, ont changé'
        correct: true
      - text: Le compilateur refuse d'ignorer le résultat d'`append`
        correct: true
      - text: '`append` modifie toujours `s` en place'
        correct: false
      - text: Pour libérer l'ancien tableau immédiatement
        correct: false
    answer: « append(s, x) (value of type []int) is not used » ; et sans réaffectation, le nouvel élément serait perdu.
  - key: qcm-prealloc
    format: multiple-choice
    question: Pourquoi préallouer avec `make([]T, 0, n)` quand on connaît la taille finale ?
    choices:
      - text: Pour éviter les réallocations et copies successives d'append
        correct: true
      - text: Pour réduire le travail du GC sur les tableaux abandonnés
        correct: true
      - text: Parce qu'append ne fonctionne pas sans capacité
        correct: false
      - text: Pour rendre le slice comparable
        correct: false
    answer: Un seul tableau est alloué, rempli sans copie.
  - key: qcm-apres-append
    format: multiple-choice
    question: Avec `s := make([]int, 3, 3)` puis `t := append(s, 4)`, que vaut `cap(s)` ?
    choices:
      - text: 3, `s` n'a pas changé
        correct: true
      - text: '4'
        correct: false
      - text: 6, la capacité de t
        correct: false
      - text: '0'
        correct: false
    answer: '`append` a renvoyé un nouveau descripteur (et un nouveau tableau) dans `t`.'
  - key: code-capacite
    format: code-output
    question: "```go\ns := make([]int, 0, 2)\nfor i := range 3 {\n\ts = append(s, i)\n\tfmt.Print(len(s), cap(s) >= len(s), \" \")\n}\nfmt.Println()\n```"
    answer: '`1 true 2 true 3 true` : la longueur suit les ajouts, la capacité grandit quand il le faut.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 0, 2)\n\tfor i := range 3 {\n\t\ts = append(s, i)\n\t\tfmt.Print(len(s), cap(s) >= len(s), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 true 2 true 3 true
  - key: code-pointeur
    format: code-output
    question: |-
      ```go
      s := make([]int, 2, 2)
      t := append(s, 3)
      t[0] = 9
      u := s[:1]
      u[0] = 7
      fmt.Println(s[0], t[0])
      ```
    answer: '`7 9` : `t` a reçu un nouveau tableau (capacité dépassée), `u` partage celui de `s`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 2, 2)\n\tt := append(s, 3)\n\tt[0] = 9\n\tu := s[:1]\n\tu[0] = 7\n\tfmt.Println(s[0], t[0])\n}\n"
      output: 7 9
  - key: code-fonction-append
    format: code-output
    question: "```go\nfunc ajouter(s []int) []int {\n\treturn append(s, 100)\n}\n\ns := []int{1, 2}\najouter(s)\nt := ajouter(s)\nfmt.Println(len(s), len(t))\n```"
    answer: '`2 3` : le slice de l''appelant garde sa longueur ; seul le résultat réaffecté voit l''élément.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(s []int) []int {\n\treturn append(s, 100)\n}\n\nfunc main() {\n\ts := []int{1, 2}\n\tajouter(s)\n\tt := ajouter(s)\n\tfmt.Println(len(s), len(t))\n}\n"
      output: 2 3
  - key: code-prealloc
    format: code-output
    question: "```go\ns := make([]int, 0, 1000)\np := &s[:1][0]\nfor i := range 1000 {\n\ts = append(s, i)\n}\nfmt.Println(p == &s[0], len(s), cap(s))\n```"
    answer: '`true 1000 1000` : avec la capacité préallouée, append n''a jamais réalloué le tableau.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 0, 1000)\n\tp := &s[:1][0]\n\tfor i := range 1000 {\n\t\ts = append(s, i)\n\t}\n\tfmt.Println(p == &s[0], len(s), cap(s))\n}\n"
      output: true 1000 1000
  - key: bug-append-ignore
    format: bug-fix
    question: "Le compilateur signale « append(lignes, l) (value of type []string) is not used » :\n```go\nfor _, l := range entree {\n\tappend(lignes, l)\n}\n```"
    answer: "```go\nfor _, l := range entree {\n\tlignes = append(lignes, l)\n}\n```\nLe résultat d'`append` est le nouveau descripteur : il faut le réaffecter."
  - key: bug-fonction
    format: bug-fix
    question: "Les erreurs collectées par la fonction disparaissent :\n```go\nfunc valider(c Commande, erreurs []string) {\n\tif c.Total < 0 {\n\t\terreurs = append(erreurs, \"total négatif\")\n\t}\n}\n```"
    answer: "```go\nfunc valider(c Commande, erreurs []string) []string {\n\tif c.Total < 0 {\n\t\terreurs = append(erreurs, \"total négatif\")\n\t}\n\treturn erreurs\n}\n\nerreurs = valider(c, erreurs)\n```\nLa fonction modifiait sa copie du descripteur ; on renvoie le nouveau slice (ou l'on passe un `*[]string`)."
  - key: bug-reallocations
    format: bug-fix
    question: "Le profileur montre que la construction d'un rapport de 1 million de lignes passe son temps en `growslice` :\n```go\nvar lignes []Ligne\nfor _, e := range evenements {\n\tlignes = append(lignes, convertir(e))\n}\n```"
    answer: "```go\nlignes := make([]Ligne, 0, len(evenements))\nfor _, e := range evenements {\n\tlignes = append(lignes, convertir(e))\n}\n```\nPréallouer la capacité évite les réallocations et copies répétées."
  - key: bug-pointeur-element
    format: bug-fix
    question: |-
      Le pointeur vers le premier article ne voit plus les modifications après des ajouts :
      ```go
      premier := &articles[0]
      articles = append(articles, nouveaux...)
      articles[0].Prix = 0
      fmt.Println(premier.Prix) // ancien prix
      ```
    answer: |-
      ```go
      articles = append(articles, nouveaux...)
      premier := &articles[0]
      ```
      `append` a réalloué le tableau : l'ancien pointeur désigne l'ancien tableau. On prend l'adresse après les ajouts,
      ou l'on garde un indice plutôt qu'un pointeur.
  - key: scenario-expliquer
    format: scenario
    question: Explique à un collègue pourquoi une fonction qui fait `append` sur un slice reçu en paramètre semble parfois modifier l'appelant, et parfois non.
    answer: |-
      La fonction reçoit une copie du descripteur. Si elle modifie des éléments existants, l'appelant les voit (même
      tableau). Si elle fait `append` et qu'il reste de la capacité, l'élément est écrit dans le tableau partagé, mais la
      longueur de l'appelant ne change pas : il ne le voit pas, sauf en redécoupant. Si la capacité est épuisée, append
      réalloue et la fonction travaille sur un autre tableau. Règle : une fonction qui ajoute des éléments renvoie le
      nouveau slice, comme `append`.
  - key: scenario-memoire
    format: scenario
    question: Un service garde en mémoire de nombreux petits slices obtenus en découpant de gros tampons, et sa mémoire ne baisse jamais. Que se passe-t-il ?
    answer: |-
      Chaque petit slice pointe sur le gros tableau d'origine : tant qu'il existe, le GC ne peut pas libérer le tableau
      entier. On copie les données utiles dans un nouveau slice (`slices.Clone(gros[a:b])` ou `bytes.Clone`) avant de les
      garder, pour que le gros tampon devienne libérable. Le profil mémoire (`pprof`, inuse_space) montre où les gros
      tableaux sont alloués.
  - key: scenario-prealloc
    format: scenario
    question: Quand préallouer un slice, et quand ne pas s'en soucier ?
    answer: |-
      Je préalloue quand je connais la taille finale ou une bonne borne : une conversion élément par élément d'un autre
      slice, une lecture dont on connaît le nombre de lignes. Dans un chemin chaud, cela supprime les réallocations. Pour
      un petit slice ou une taille inconnue, `append` sur un slice nil suffit : la croissance amortie est efficace, et le
      code reste simple. Les linters comme `prealloc` signalent les cas évidents.
  - key: scenario-capacite-cachee
    format: scenario
    question: Une fonction renvoie `buf[:n]` d'un tampon interne réutilisé. Quel risque pour l'appelant ?
    answer: |-
      Le slice renvoyé partage le tampon interne : au prochain appel, la fonction réécrit dedans et les données de
      l'appelant changent sous lui. Et si l'appelant fait `append`, il écrit dans la capacité restante du tampon. On
      documente que le résultat n'est valide que jusqu'au prochain appel (comme `bufio.Scanner.Bytes`), ou l'on renvoie
      une copie (`bytes.Clone`), selon le coût acceptable.
  - key: definition-capacite
    format: definition
    question: capacité (d'un slice)
    answer: Le nombre d'éléments que le tableau sous-jacent peut contenir à partir du début du slice, sans réallocation ; `cap(s)`.
  - key: definition-tableau-sous-jacent
    format: definition
    question: tableau sous-jacent
    answer: Le tableau sur lequel pointe un slice ; plusieurs slices peuvent partager le même.
