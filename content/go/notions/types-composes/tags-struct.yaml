notion: tags-struct
lesson: "Un **tag** est une chaîne attachée à un champ de struct, lue par **réflexion** par les bibliothèques :\n\n```go\ntype Utilisateur struct {\n\tID        int       `json:\"id\" db:\"id\"`\n\tEmail     string    `json:\"email\" validate:\"required,email\"`\n\tMotDePasse string   `json:\"-\"`                  // jamais sérialisé\n\tSurnom    string    `json:\"surnom,omitempty\"`   // omis si vide\n\tCreeLe    time.Time `json:\"cree_le,omitzero\"`   // omis si valeur zéro (Go 1.24)\n}\n```\n\n- Le format conventionnel est `cle:\"valeur\"`, plusieurs paires séparées par des **espaces**, sans espace autour des `:`.\n- Pour `encoding/json` : le nom de la clé, `-` pour ignorer, `omitempty` pour omettre les valeurs « vides » (0, \"\",\n  false, nil, slice ou map vide), `omitzero` (Go 1.24) pour omettre la **valeur zéro**, y compris d'une struct comme\n  `time.Time`, et `string` pour encoder un nombre en chaîne.\n- D'autres bibliothèques ont leurs clés : `db` (sqlx), `yaml`, `validate`, `gorm`...\n- On lit un tag avec `reflect` : `reflect.TypeOf(u).Field(0).Tag.Get(\"json\")`.\n- Les tags ne s'appliquent qu'aux **champs exportés** pour `encoding/json`.\n- `go vet` vérifie la **syntaxe** des tags (l'analyseur `structtag`).\n\n**Piège classique** : une faute de syntaxe (`json: \"email\"` avec une espace) ignorée silencieusement par\n`encoding/json`, qui utilise alors le nom du champ. `go vet` la signale.\n\n**En entretien** : « Des métadonnées de champ lues par réflexion ; json:\"nom\", \"-\", omitempty, omitzero ; d'autres\nclés pour db ou validate ; go vet vérifie la syntaxe. »"
cards:
  - key: servent-tags-struct
    format: course
    question: À quoi servent les tags de struct ?
    choices:
      - {text: "À donner aux champs des métadonnées, lues par réflexion (json, db, validate)", correct: true}
      - {text: "À documenter les champs pour `go doc`, sans effet à l'exécution", correct: false}
      - {text: "À rendre des champs non exportés lisibles par d'autres packages", correct: false}
      - {text: "À valider les valeurs des champs dès la compilation", correct: false}
    answer: "À attacher des métadonnées aux champs, que des bibliothèques lisent par réflexion : nom de clé JSON, colonne SQL, règles de validation. Le compilateur ne les interprète pas, et ils ne rendent pas un champ non exporté visible."
  - key: terme-tag-struct
    format: course
    question: "Que désigne, en Go, le « tag » d'un champ de struct ?"
    choices:
      - {text: "La chaîne écrite après le type du champ, souvent entre accents graves, lue par réflexion", correct: true}
      - {text: "Le commentaire placé au-dessus du champ, que reprend la documentation de `go doc`", correct: false}
      - {text: "Un mot-clé qui rend le champ facultatif au moment de la compilation du package", correct: false}
      - {text: "Le nom du type du champ, rangé dans le binaire pour aider au débogage", correct: false}
    answer: "Une chaîne littérale placée après le type du champ (`json:\"email\" db:\"mail\"`) : le compilateur la garde sans l'interpréter, et des bibliothèques la lisent par réflexion avec `Tag.Get`."
  - key: omitempty-omitzero
    format: course
    question: Quelle différence entre `omitempty` et `omitzero` ?
    choices:
      - {text: "`omitzero` (Go 1.24) omet aussi une struct à sa valeur zéro, comme un `time.Time`", correct: true}
      - {text: "`omitempty` omet aussi une struct à zéro ; `omitzero` ne vise que les nombres à 0", correct: false}
      - {text: "Aucune : `omitzero` n'est qu'un alias de `omitempty`, ajouté pour la lisibilité", correct: false}
      - {text: "`omitzero` omet les chaînes vides, que `omitempty` garde toujours dans le JSON", correct: false}
    answer: '`omitempty` omet 0, "", false, nil et les slices ou maps vides, mais pas une struct ; `omitzero` (Go 1.24) omet la valeur zéro du type, y compris une struct comme `time.Time` zéro.'
  - key: lire
    format: course
    question: Comment une bibliothèque lit-elle les tags ?
    choices:
      - {text: "Par réflexion : `reflect.TypeOf(v).Field(i).Tag.Get(\"json\")`", correct: true}
      - {text: "Par un générateur de code que `go build` lance à chaque compilation", correct: false}
      - {text: "En relisant le fichier source du type au moment de l'exécution", correct: false}
      - {text: "Par une méthode `Tags()` que le compilateur ajoute à toute struct", correct: false}
    answer: "Par réflexion : `reflect.TypeOf(v).Field(i).Tag.Get(\"json\")` renvoie la valeur de la clé `json`, ou une chaîne vide si elle manque. Aucune génération de code ni méthode ajoutée."
  - key: vf-ignorer
    format: true-false
    question: Le tag `json:"-"` empêche le champ d'apparaître dans le JSON.
    truth: true
    answer: Utile pour un mot de passe ou un champ interne.
  - key: vf-non-exporte
    format: true-false
    question: Un tag `json` sur un champ non exporté le fait apparaître dans le JSON.
    truth: false
    answer: '`encoding/json` ignore toujours les champs non exportés.'
  - key: vf-vet
    format: true-false
    question: '`go vet` signale un tag mal formé comme `json: "email"`.'
    truth: true
    answer: L'analyseur `structtag` vérifie la syntaxe ; `encoding/json` l'ignorerait sans rien dire.
  - key: vf-espaces
    format: true-false
    question: 'Plusieurs clés de tag se séparent par des virgules : `json:"id",db:"id"`.'
    truth: false
    answer: 'Par des espaces : `json:"id" db:"id"` ; la virgule sépare les options d''une même clé.'
  - key: qcm-json
    format: multiple-choice
    question: "Lequel de ces tags est correct pour `encoding/json` ?"
    choices:
      - {text: "`json:\"surnom,omitempty\"`", correct: true}
      - {text: "`json:surnom`", correct: false}
      - {text: "`json=\"surnom\"`", correct: false}
      - {text: "`json: \"surnom\"`", correct: false}
    answer: "Une clé, deux-points sans espace, puis la valeur entre guillemets, options après une virgule ; `json:\"nom\"` est correct aussi. Une espace après les deux-points rend le tag illisible, et `encoding/json` l'ignore sans erreur."
  - key: qcm-omitempty
    format: multiple-choice
    question: "Laquelle de ces valeurs l'option `omitempty` fait-elle disparaître ?"
    choices:
      - {text: "Un slice vide", correct: true}
      - {text: "Un `time.Time` zéro", correct: false}
      - {text: "Une struct dont tous les champs sont à zéro", correct: false}
      - {text: "Un tableau `[2]int{0, 0}`", correct: false}
    answer: "`omitempty` omet false, 0, un pointeur ou une interface nil, et un tableau, une map, un slice ou une chaîne de longueur 0 : un `[2]int` a une longueur 2. Une struct n'est jamais « vide » : il faut `omitzero` (Go 1.24)."
  - key: qcm-plusieurs
    format: multiple-choice
    question: Comment donner à un champ un nom JSON et un nom de colonne SQL ?
    choices:
      - text: '`` `json:"cree_le" db:"created_at"` ``'
        correct: true
      - text: '`` `json:"cree_le",db:"created_at"` ``'
        correct: false
      - text: '`` `json:"cree_le";db:"created_at"` ``'
        correct: false
      - text: Deux tags sur deux lignes
        correct: false
    answer: Les paires clé-valeur se séparent par une espace.
  - key: qcm-nombre-chaine
    format: multiple-choice
    question: Comment encoder un `int64` en chaîne JSON (pour JavaScript) ?
    choices:
      - text: Le tag `json:"id,string"`
        correct: true
      - text: Le tag `json:"id,omitempty"`
        correct: false
      - text: Le tag `json:"string"`
        correct: false
      - text: C'est impossible sans changer le type
        correct: false
    answer: L'option `string` encode les nombres et booléens entre guillemets.
  - key: trous-nom
    format: fill-in
    question: |-
      Complète pour que la clé JSON soit `email` :
      ```go
      Email string `___:"email"`
      ```
    blanks:
      - - json
    answer: La clé du tag est `json`.
  - key: trous-ignorer
    format: fill-in
    question: |-
      Complète pour ne jamais sérialiser le mot de passe :
      ```go
      MotDePasse string `json:"___"`
      ```
    blanks:
      - - '-'
    answer: '`-` exclut le champ.'
  - key: trous-omit
    format: fill-in
    question: |-
      Complète pour omettre le surnom s'il est vide :
      ```go
      Surnom string `json:"surnom,___"`
      ```
    blanks:
      - - omitempty
        - omitzero
    answer: Pour une chaîne, les deux options l'omettent quand elle vaut "".
  - key: trous-reflect
    format: fill-in
    question: |-
      Complète la lecture du tag :
      ```go
      champ := reflect.TypeOf(Utilisateur{}).Field(0)
      nom := champ.Tag.___("json")
      ```
    blanks:
      - - Get
    answer: '`Tag.Get` renvoie la valeur d''une clé.'
  - key: code-tags
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	ID     int    `json:"id"`
      	Mdp    string `json:"-"`
      	Surnom string `json:"surnom,omitempty"`
      }

      b, _ := json.Marshal(U{ID: 7, Mdp: "secret"})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"id\":7}`", correct: true}
      - {text: "`{\"id\":7,\"surnom\":\"\"}`", correct: false}
      - {text: "`{\"id\":7,\"Mdp\":\"secret\"}`", correct: false}
      - {text: "`{\"id\":7,\"-\":\"secret\"}`", correct: false}
    answer: "`{\"id\":7}` : `json:\"-\"` exclut le mot de passe, et `omitempty` omet le surnom vide."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tID     int    `json:\"id\"`\n\tMdp    string `json:\"-\"`\n\tSurnom string `json:\"surnom,omitempty\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{ID: 7, Mdp: \"secret\"})\n\tfmt.Println(string(b))\n}\n"
      output: '{"id":7}'
  - key: code-omitzero
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type E struct {
      	A time.Time `json:"a,omitempty"`
      	B time.Time `json:"b,omitzero"`
      }

      b, _ := json.Marshal(E{})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"a\":\"0001-01-01T00:00:00Z\"}`", correct: true}
      - {text: "`{}`", correct: false}
      - {text: "`{\"b\":\"0001-01-01T00:00:00Z\"}`", correct: false}
      - {text: "`{\"a\":\"0001-01-01T00:00:00Z\",\"b\":\"0001-01-01T00:00:00Z\"}`", correct: false}
    answer: "`omitempty` ne sait pas omettre une struct, même à sa valeur zéro ; `omitzero` (Go 1.24) l'omet. Seul `a` reste."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"time\"\n)\n\ntype E struct {\n\tA time.Time `json:\"a,omitempty\"`\n\tB time.Time `json:\"b,omitzero\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(E{})\n\tfmt.Println(string(b))\n}\n"
      output: '{"a":"0001-01-01T00:00:00Z"}'
  - key: code-reflect
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type U struct {
      	Email string `json:"email" db:"mail"`
      }

      f := reflect.TypeOf(U{}).Field(0)
      fmt.Println(f.Tag.Get("json"), f.Tag.Get("db"), f.Tag.Get("yaml") == "")
      ```
    choices:
      - {text: "`email mail true`", correct: true}
      - {text: "`email mail false`", correct: false}
      - {text: "`json db true`", correct: false}
      - {text: "`\"email\" \"mail\" true`", correct: false}
    answer: "`Tag.Get` renvoie la valeur d'une clé, sans guillemets ; une clé absente donne une chaîne vide."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n)\n\ntype U struct {\n\tEmail string `json:\"email\" db:\"mail\"`\n}\n\nfunc main() {\n\tf := reflect.TypeOf(U{}).Field(0)\n\tfmt.Println(f.Tag.Get(\"json\"), f.Tag.Get(\"db\"), f.Tag.Get(\"yaml\") == \"\")\n}\n"
      output: email mail true
  - key: code-string
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type C struct {
      	ID int64 `json:"id,string"`
      }

      b, _ := json.Marshal(C{ID: 9007199254740993})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"id\":\"9007199254740993\"}`", correct: true}
      - {text: "`{\"id\":9007199254740993}`", correct: false}
      - {text: "`{\"id\":9007199254740992}`", correct: false}
      - {text: "`{\"id\":\"9007199254740992\"}`", correct: false}
    answer: "L'option `string` encode le nombre dans une chaîne JSON, sans perte : un client JavaScript, limité à 2^53 en entier exact, n'arrondit pas l'identifiant."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype C struct {\n\tID int64 `json:\"id,string\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(C{ID: 9007199254740993})\n\tfmt.Println(string(b))\n}\n"
      output: '{"id":"9007199254740993"}'
  - key: bug-espace
    format: bug-fix
    question: |-
      La clé JSON reste « Email » malgré le tag. Quelle correction est la bonne ?
      ```go
      Email string `json: "email"`
      ```
    choices:
      - {text: "Retirer l'espace après les deux-points : `json:\"email\"`", correct: true}
      - {text: "Mettre la clé en majuscule : `json: \"Email\"`", correct: false}
      - {text: "Remplacer les accents graves par des guillemets doubles", correct: false}
      - {text: "Ajouter `omitempty` au tag, ce qui force sa lecture", correct: false}
    answer: |-
      ```go
      Email string `json:"email"`
      ```
      L'espace après les deux-points rend le tag invalide, ignoré sans erreur par `encoding/json` ; `go vet` le signale.
  - key: bug-mot-de-passe
    format: bug-fix
    question: |-
      L'API renvoie le hash du mot de passe des utilisateurs. Quelle correction est la bonne ?
      ```go
      type Utilisateur struct {
      	Email     string `json:"email"`
      	HashMotDePasse string
      }
      ```
    choices:
      - {text: "Exclure le champ par le tag `json:\"-\"`, ou passer par un DTO sans lui", correct: true}
      - {text: "Ajouter le tag `json:\"hash,omitempty\"` au champ du hash", correct: false}
      - {text: "Ajouter le tag `json:\"\"`, une clé vide qui masque le champ", correct: false}
      - {text: "Ajouter le tag `json:\"hash,string\"`, qui le chiffre à l'encodage", correct: false}
    answer: |-
      ```go
      HashMotDePasse string `json:"-"`
      ```
      Un champ exporté sans tag est sérialisé sous son nom. Mieux encore : un DTO de réponse qui ne contient pas le champ. Un tag à clé vide garde le nom du champ, et `omitempty` n'omet que le hash vide.
  - key: bug-date-vide
    format: bug-fix
    question: |-
      Les commandes jamais expédiées affichent `"expedie_le":"0001-01-01T00:00:00Z"`. Quelle correction est la bonne ?
      ```go
      ExpedieLe time.Time `json:"expedie_le,omitempty"`
      ```
    choices:
      - {text: "Remplacer `omitempty` par `omitzero` (Go 1.24)", correct: true}
      - {text: "Ajouter l'option `string` après `omitempty`", correct: false}
      - {text: "Remplacer `omitempty` par l'option `omitnil`", correct: false}
      - {text: "Affecter `nil` au champ avant l'encodage", correct: false}
    answer: |-
      ```go
      ExpedieLe time.Time `json:"expedie_le,omitzero"`
      ```
      `omitempty` n'omet pas une struct ; `omitzero` (Go 1.24) omet la valeur zéro de `time.Time`. Avant 1.24, on
      utilisait un `*time.Time`.
  - key: bug-separateur
    format: bug-fix
    question: |-
      Le tag `db` n'est jamais lu par la bibliothèque SQL. Quelle correction est la bonne ?
      ```go
      CreeLe time.Time `json:"cree_le",db:"created_at"`
      ```
    choices:
      - {text: "Séparer les paires par une espace : `json:\"cree_le\" db:\"created_at\"`", correct: true}
      - {text: "Séparer les paires par un point-virgule : `json:\"cree_le\";db:\"created_at\"`", correct: false}
      - {text: "Mettre `db` en premier : `db:\"created_at\",json:\"cree_le\"`", correct: false}
      - {text: "Regrouper les deux clés : `json,db:\"cree_le,created_at\"`", correct: false}
    answer: |-
      ```go
      CreeLe time.Time `json:"cree_le" db:"created_at"`
      ```
      Les paires d'un tag se séparent par une espace ; la virgule rendait le reste illisible.
