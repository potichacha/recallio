notion: tags-struct
lesson: "Un **tag** est une chaîne attachée à un champ de struct, lue par **réflexion** par les bibliothèques :\n\n```go\ntype Utilisateur struct {\n\tID        int       `json:\"id\" db:\"id\"`\n\tEmail     string    `json:\"email\" validate:\"required,email\"`\n\tMotDePasse string   `json:\"-\"`                  // jamais sérialisé\n\tSurnom    string    `json:\"surnom,omitempty\"`   // omis si vide\n\tCreeLe    time.Time `json:\"cree_le,omitzero\"`   // omis si valeur zéro (Go 1.24)\n}\n```\n\n- Le format conventionnel est `cle:\"valeur\"`, plusieurs paires séparées par des **espaces**, sans espace autour des `:`.\n- Pour `encoding/json` : le nom de la clé, `-` pour ignorer, `omitempty` pour omettre les valeurs « vides » (0, \"\",\n  false, nil, slice ou map vide), `omitzero` (Go 1.24) pour omettre la **valeur zéro**, y compris d'une struct comme\n  `time.Time`, et `string` pour encoder un nombre en chaîne.\n- D'autres bibliothèques ont leurs clés : `db` (sqlx), `yaml`, `validate`, `gorm`...\n- On lit un tag avec `reflect` : `reflect.TypeOf(u).Field(0).Tag.Get(\"json\")`.\n- Les tags ne s'appliquent qu'aux **champs exportés** pour `encoding/json`.\n- `go vet` vérifie la **syntaxe** des tags (l'analyseur `structtag`).\n\n**Piège classique** : une faute de syntaxe (`json: \"email\"` avec une espace) ignorée silencieusement par\n`encoding/json`, qui utilise alors le nom du champ. `go vet` la signale.\n\n**En entretien** : « Des métadonnées de champ lues par réflexion ; json:\"nom\", \"-\", omitempty, omitzero ; d'autres\nclés pour db ou validate ; go vet vérifie la syntaxe. »"
cards:
  - key: servent-tags-struct
    format: course
    question: À quoi servent les tags de struct ?
    answer: À fournir des métadonnées lues par réflexion (json, db, validate).
  - key: terme-tag-struct
    format: course
    question: Que désigne « tag de struct » ?
    answer: Métadonnées de champ lues par réflexion (json, db)
  - key: omitempty-omitzero
    format: course
    question: Quelle différence entre `omitempty` et `omitzero` ?
    answer: '`omitempty` omet 0, "", false, nil et les slices ou maps vides, mais pas une struct ; `omitzero` (Go 1.24) omet la valeur zéro du type, y compris une struct comme `time.Time` zéro.'
  - key: lire
    format: course
    question: Comment une bibliothèque lit-elle les tags ?
    answer: 'Par réflexion : `reflect.TypeOf(v).Field(i).Tag.Get("json")`.'
  - key: vf-ignorer
    format: true-false
    question: Le tag `json:"-"` empêche le champ d'apparaître dans le JSON.
    truth: true
    answer: Utile pour un mot de passe ou un champ interne.
  - key: vf-non-exporte
    format: true-false
    question: Un tag `json` sur un champ non exporté le fait apparaître dans le JSON.
    truth: false
    answer: '`encoding/json` ignore toujours les champs non exportés.'
  - key: vf-vet
    format: true-false
    question: '`go vet` signale un tag mal formé comme `json: "email"`.'
    truth: true
    answer: L'analyseur `structtag` vérifie la syntaxe ; `encoding/json` l'ignorerait sans rien dire.
  - key: vf-espaces
    format: true-false
    question: 'Plusieurs clés de tag se séparent par des virgules : `json:"id",db:"id"`.'
    truth: false
    answer: 'Par des espaces : `json:"id" db:"id"` ; la virgule sépare les options d''une même clé.'
  - key: qcm-json
    format: multiple-choice
    question: Quels tags sont corrects pour `encoding/json` ?
    choices:
      - text: '`json:"nom"`'
        correct: true
      - text: '`json:"surnom,omitempty"`'
        correct: true
      - text: '`json:nom`'
        correct: false
      - text: '`json="nom"`'
        correct: false
    answer: La valeur est entre guillemets, après deux-points.
  - key: qcm-omitempty
    format: multiple-choice
    question: Quelles valeurs `omitempty` fait-il disparaître ?
    choices:
      - text: Un entier à 0
        correct: true
      - text: Un slice vide
        correct: true
      - text: Un `time.Time` zéro
        correct: false
      - text: Une struct dont tous les champs sont à zéro
        correct: false
    answer: Pour les structs, il faut `omitzero` (Go 1.24).
  - key: qcm-plusieurs
    format: multiple-choice
    question: Comment donner à un champ un nom JSON et un nom de colonne SQL ?
    choices:
      - text: '`` `json:"cree_le" db:"created_at"` ``'
        correct: true
      - text: '`` `json:"cree_le",db:"created_at"` ``'
        correct: false
      - text: '`` `json:"cree_le";db:"created_at"` ``'
        correct: false
      - text: Deux tags sur deux lignes
        correct: false
    answer: Les paires clé-valeur se séparent par une espace.
  - key: qcm-nombre-chaine
    format: multiple-choice
    question: Comment encoder un `int64` en chaîne JSON (pour JavaScript) ?
    choices:
      - text: Le tag `json:"id,string"`
        correct: true
      - text: Le tag `json:"id,omitempty"`
        correct: false
      - text: Le tag `json:"string"`
        correct: false
      - text: C'est impossible sans changer le type
        correct: false
    answer: L'option `string` encode les nombres et booléens entre guillemets.
  - key: trous-nom
    format: fill-in
    question: |-
      Complétez pour que la clé JSON soit `email` :
      ```go
      Email string `___:"email"`
      ```
    blanks:
      - - json
    answer: La clé du tag est `json`.
  - key: trous-ignorer
    format: fill-in
    question: |-
      Complétez pour ne jamais sérialiser le mot de passe :
      ```go
      MotDePasse string `json:"___"`
      ```
    blanks:
      - - '-'
    answer: '`-` exclut le champ.'
  - key: trous-omit
    format: fill-in
    question: |-
      Complétez pour omettre le surnom s'il est vide :
      ```go
      Surnom string `json:"surnom,___"`
      ```
    blanks:
      - - omitempty
        - omitzero
    answer: Pour une chaîne, les deux options l'omettent quand elle vaut "".
  - key: trous-reflect
    format: fill-in
    question: |-
      Complétez la lecture du tag :
      ```go
      champ := reflect.TypeOf(Utilisateur{}).Field(0)
      nom := champ.Tag.___("json")
      ```
    blanks:
      - - Get
    answer: '`Tag.Get` renvoie la valeur d''une clé.'
  - key: code-tags
    format: code-output
    question: "```go\ntype U struct {\n\tID     int    `json:\"id\"`\n\tMdp    string `json:\"-\"`\n\tSurnom string `json:\"surnom,omitempty\"`\n}\n\nb, _ := json.Marshal(U{ID: 7, Mdp: \"secret\"})\nfmt.Println(string(b))\n```"
    answer: '`{"id":7}` : le mot de passe est exclu, le surnom vide omis.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype U struct {\n\tID     int    `json:\"id\"`\n\tMdp    string `json:\"-\"`\n\tSurnom string `json:\"surnom,omitempty\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(U{ID: 7, Mdp: \"secret\"})\n\tfmt.Println(string(b))\n}\n"
      output: '{"id":7}'
  - key: code-omitzero
    format: code-output
    question: "```go\ntype E struct {\n\tA time.Time `json:\"a,omitempty\"`\n\tB time.Time `json:\"b,omitzero\"`\n}\n\nb, _ := json.Marshal(E{})\nfmt.Println(string(b))\n```"
    answer: '`{"a":"0001-01-01T00:00:00Z"}` : `omitempty` ne sait pas omettre une struct, `omitzero` (Go 1.24) si.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"time\"\n)\n\ntype E struct {\n\tA time.Time `json:\"a,omitempty\"`\n\tB time.Time `json:\"b,omitzero\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(E{})\n\tfmt.Println(string(b))\n}\n"
      output: '{"a":"0001-01-01T00:00:00Z"}'
  - key: code-reflect
    format: code-output
    question: "```go\ntype U struct {\n\tEmail string `json:\"email\" db:\"mail\"`\n}\n\nf := reflect.TypeOf(U{}).Field(0)\nfmt.Println(f.Tag.Get(\"json\"), f.Tag.Get(\"db\"), f.Tag.Get(\"yaml\") == \"\")\n```"
    answer: '`email mail true` : une clé absente donne une chaîne vide.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n)\n\ntype U struct {\n\tEmail string `json:\"email\" db:\"mail\"`\n}\n\nfunc main() {\n\tf := reflect.TypeOf(U{}).Field(0)\n\tfmt.Println(f.Tag.Get(\"json\"), f.Tag.Get(\"db\"), f.Tag.Get(\"yaml\") == \"\")\n}\n"
      output: email mail true
  - key: code-string
    format: code-output
    question: "```go\ntype C struct {\n\tID int64 `json:\"id,string\"`\n}\n\nb, _ := json.Marshal(C{ID: 9007199254740993})\nfmt.Println(string(b))\n```"
    answer: '`{"id":"9007199254740993"}` : l''option `string` évite la perte de précision côté JavaScript.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype C struct {\n\tID int64 `json:\"id,string\"`\n}\n\nfunc main() {\n\tb, _ := json.Marshal(C{ID: 9007199254740993})\n\tfmt.Println(string(b))\n}\n"
      output: '{"id":"9007199254740993"}'
  - key: bug-espace
    format: bug-fix
    question: |-
      La clé JSON reste « Email » malgré le tag :
      ```go
      Email string `json: "email"`
      ```
    answer: |-
      ```go
      Email string `json:"email"`
      ```
      L'espace après les deux-points rend le tag invalide, ignoré sans erreur par `encoding/json` ; `go vet` le signale.
  - key: bug-mot-de-passe
    format: bug-fix
    question: "L'API renvoie le hash du mot de passe des utilisateurs :\n```go\ntype Utilisateur struct {\n\tEmail     string `json:\"email\"`\n\tHashMotDePasse string\n}\n```"
    answer: |-
      ```go
      HashMotDePasse string `json:"-"`
      ```
      Un champ exporté sans tag est sérialisé sous son nom. Mieux encore : un DTO de réponse qui ne contient pas le champ.
  - key: bug-date-vide
    format: bug-fix
    question: |-
      Les commandes jamais expédiées affichent `"expedie_le":"0001-01-01T00:00:00Z"` :
      ```go
      ExpedieLe time.Time `json:"expedie_le,omitempty"`
      ```
    answer: |-
      ```go
      ExpedieLe time.Time `json:"expedie_le,omitzero"`
      ```
      `omitempty` n'omet pas une struct ; `omitzero` (Go 1.24) omet la valeur zéro de `time.Time`. Avant 1.24, on
      utilisait un `*time.Time`.
  - key: bug-separateur
    format: bug-fix
    question: |-
      Le tag `db` n'est jamais lu par la bibliothèque SQL :
      ```go
      CreeLe time.Time `json:"cree_le",db:"created_at"`
      ```
    answer: |-
      ```go
      CreeLe time.Time `json:"cree_le" db:"created_at"`
      ```
      Les paires d'un tag se séparent par une espace ; la virgule rendait le reste illisible.
