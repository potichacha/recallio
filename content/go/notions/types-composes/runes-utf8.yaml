notion: runes-utf8
lesson: "Une **rune** (`int32`) représente un **point de code Unicode** : `'A'` vaut 65, `'é'` vaut 233, `'€'` vaut 8364. En\nUTF-8, un point de code s'encode sur **1 à 4 octets**.\n\nParcourir les caractères d'une chaîne :\n\n```go\nfor i, r := range \"héllo\" { // i : indice de l'octet de début, r : la rune\n\tfmt.Printf(\"%d:%c \", i, r) // 0:h 1:é 3:l 4:l 5:o\n}\n\nrunes := []rune(\"héllo\")    // conversion : un élément par caractère\nlen(runes)                  // 5\nstring(runes[1])            // \"é\"\nutf8.RuneCountInString(s)   // 5, sans allouer\nutf8.RuneLen('€')           // 3 octets\n```\n\n- `range` décode l'UTF-8 au fil de l'eau ; un octet invalide donne la rune de remplacement `U+FFFD` (�).\n- `[]rune(s)` alloue un slice : pratique pour inverser une chaîne ou accéder au n-ième caractère, mais coûteux sur de\n  longs textes.\n- Le package `unicode` classe les runes (`unicode.IsLetter`, `unicode.IsUpper`, `unicode.ToUpper`) ; `unicode/utf8`\n  encode et décode.\n- Une rune n'est pas toujours un « caractère visible » : un emoji drapeau ou une lettre avec un accent combinant\n  peuvent compter plusieurs runes (les graphèmes demandent une bibliothèque dédiée).\n\n**Piège classique** : inverser une chaîne octet par octet. Les caractères multi-octets sont détruits ; on inverse le\n`[]rune`.\n\n**En entretien** : « Une rune est un point de code (int32), encodé sur 1 à 4 octets en UTF-8 ; range décode les runes,\n[]rune(s) les convertit ; unicode et unicode/utf8 pour le reste. »"
tour:
  - title: Runes et UTF-8
    text: |-
      Une **rune** est un point de code Unicode, de type `rune` (un `int32`). Un littéral entre apostrophes, comme
      `'é'`, est une rune.

      `for … range` sur une chaîne la **décode** : à chaque tour, il donne la position de départ en octets et la rune.
      C'est la bonne façon de parcourir les caractères. `utf8.RuneCountInString` compte les runes, et `[]rune(s)`
      convertit la chaîne en une slice de runes, qu'on peut indexer.

      Une rune n'est pas toujours ce qu'un lecteur voit comme un caractère : un emoji composé en contient plusieurs.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"unicode/utf8"
          )

          func main() {
          	mot := "Noël"
          	fmt.Println(len(mot), utf8.RuneCountInString(mot))
          	for i, r := range mot {
          		fmt.Printf("%d %c\n", i, r)
          	}
          	runes := []rune(mot)
          	fmt.Println(string(runes[2]))
          }
      output: |-
        5 4
        0 N
        1 o
        2 ë
        4 l
        ë
    task:
      instructions: |-
        Inverse le mot caractère par caractère, en passant par `[]rune` : le programme doit afficher `lëoN`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "Noël"
          	fmt.Println(mot)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "Noël"
          	runes := []rune(mot)
          	for i, j := 0, len(runes)-1; i < j; i, j = i+1, j-1 {
          		runes[i], runes[j] = runes[j], runes[i]
          	}
          	fmt.Println(string(runes))
          }
      output: |-
        lëoN
cards:
  - key: parcourir-caracteres-chaine
    format: course
    question: Comment parcourir les caractères d'une chaîne ?
    answer: '`for i, r := range s`, qui décode l''UTF-8 en runes.'
  - key: code-fmt-println-len-hello-len
    format: code-output
    question: |-
      ```go
      fmt.Println(len("héllo"), len([]rune("héllo")))
      for i, r := range "hé!" {
          fmt.Print(i, ":", string(r), " ")
      }
      ```
    answer: '`6 5`, puis `0:h 1:é 3:! ` : len compte les octets ; range parcourt les runes et l''index saute de 1 à 3 car "é" occupe 2 octets.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(len(\"héllo\"), len([]rune(\"héllo\")))\n\tfor i, r := range \"hé!\" {\n\t    fmt.Print(i, \":\", string(r), \" \")\n\t}\n}\n"
      output: |-
        6 5
        0:h 1:é 3:!
  - key: rune-byte-manipuler-chaine
    format: course
    question: '[]rune ou []byte pour manipuler une chaîne ?'
    answer: '[]rune si Unicode possible, []byte pour de l''ASCII connu.'
  - key: convertir-rune-inverser-chaine
    format: course
    question: Pourquoi convertir en []rune pour inverser une chaîne ?
    answer: Pour ne pas casser les caractères Unicode multi-octets.
  - key: definition-rune
    format: course
    question: Que représente une rune ?
    answer: Un point de code Unicode, stocké dans un `int32` ; il s'encode sur 1 à 4 octets en UTF-8.
  - key: vf-octets
    format: true-false
    question: En UTF-8, un caractère occupe toujours un seul octet.
    truth: false
    answer: 'De 1 à 4 octets : 1 pour l''ASCII, 2 pour « é », 3 pour « € », 4 pour la plupart des emojis.'
  - key: vf-range
    format: true-false
    question: '`range` sur une chaîne donne les runes, pas les octets.'
    truth: true
    answer: Avec, en premier, l'indice de l'octet où commence chaque rune.
  - key: vf-invalide
    format: true-false
    question: '`range` sur des octets UTF-8 invalides provoque une panique.'
    truth: false
    answer: Chaque octet invalide donne la rune de remplacement U+FFFD.
  - key: vf-grapheme
    format: true-false
    question: Une rune correspond toujours à un caractère visible pour l'utilisateur.
    truth: false
    answer: Un drapeau ou une lettre avec accent combinant peut compter plusieurs runes.
  - key: qcm-inverser
    format: multiple-choice
    question: Comment inverser une chaîne qui contient des accents ?
    choices:
      - text: Convertir en `[]rune`, inverser le slice, reconvertir en string
        correct: true
      - text: Inverser le `[]byte` de la chaîne
        correct: false
      - text: Parcourir `s[i]` de la fin vers le début
        correct: false
      - text: '`strings.Reverse(s)`'
        correct: false
    answer: '`strings.Reverse` n''existe pas, et les octets d''un caractère ne doivent pas être séparés.'
  - key: qcm-tailles
    format: multiple-choice
    question: Combien d'octets occupent ces caractères en UTF-8 ?
    choices:
      - text: '« A » : 1'
        correct: true
      - text: '« € » : 3'
        correct: true
      - text: '« é » : 1'
        correct: false
      - text: '« 😀 » : 2'
        correct: false
    answer: « é » en occupe 2, et « 😀 » 4.
  - key: qcm-classer
    format: multiple-choice
    question: Quel package indique si une rune est une lettre ou une majuscule ?
    choices:
      - text: '`unicode`'
        correct: true
      - text: '`strings`'
        correct: false
      - text: '`strconv`'
        correct: false
      - text: '`bytes`'
        correct: false
    answer: '`unicode.IsLetter`, `unicode.IsUpper`, `unicode.ToUpper`...'
  - key: qcm-nieme
    format: multiple-choice
    question: Comment obtenir le troisième caractère de `s` (accents compris) ?
    choices:
      - text: '`string([]rune(s)[2])`'
        correct: true
      - text: '`string(s[2])`'
        correct: false
      - text: '`s[2:3]`'
        correct: false
      - text: '`s.charAt(2)`'
        correct: false
    answer: L'indexation et la découpe d'une chaîne travaillent en octets.
  - key: trous-range
    format: fill-in
    question: "Complétez pour compter les lettres majuscules :\n```go\nfor _, r := range texte {\n\tif unicode.___(r) {\n\t\tn++\n\t}\n}\n```"
    blanks:
      - - IsUpper
    answer: '`unicode.IsUpper` teste une rune.'
  - key: trous-runes
    format: fill-in
    question: |-
      Complétez la conversion en runes :
      ```go
      lettres := []___(mot)
      ```
    blanks:
      - - rune
    answer: Un élément par point de code.
  - key: trous-compter
    format: fill-in
    question: |-
      Complétez pour compter les caractères sans allouer :
      ```go
      n := utf8.___(s)
      ```
    blanks:
      - - RuneCountInString
    answer: '`utf8.RuneCountInString` parcourt les octets sans créer de slice.'
  - key: trous-verbe
    format: fill-in
    question: |-
      Complétez pour afficher une rune comme un caractère :
      ```go
      fmt.Printf("%___\n", 'é')
      ```
    blanks:
      - - c
    answer: '`%c` affiche le caractère, `%d` le nombre, `%U` le point de code U+00E9.'
  - key: code-tailles
    format: code-output
    question: "```go\nfor _, r := range \"Aé€\" {\n\tfmt.Print(utf8.RuneLen(r), \" \")\n}\nfmt.Println(len(\"Aé€\"))\n```"
    answer: '`1 2 3 6` : la longueur en octets est la somme.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unicode/utf8\"\n)\n\nfunc main() {\n\tfor _, r := range \"Aé€\" {\n\t\tfmt.Print(utf8.RuneLen(r), \" \")\n\t}\n\tfmt.Println(len(\"Aé€\"))\n}\n"
      output: 1 2 3 6
  - key: code-inverser
    format: code-output
    question: |-
      ```go
      r := []rune("été")
      slices.Reverse(r)
      fmt.Println(string(r))
      ```
    answer: '`été` : un palindrome, correctement inversé caractère par caractère.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tr := []rune(\"été\")\n\tslices.Reverse(r)\n\tfmt.Println(string(r))\n}\n"
      output: été
  - key: code-verbes
    format: code-output
    question: |-
      ```go
      r := 'é'
      fmt.Printf("%c %d %U\n", r, r, r)
      ```
    answer: '`é 233 U+00E9` : le caractère, sa valeur et son point de code.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tr := 'é'\n\tfmt.Printf(\"%c %d %U\\n\", r, r, r)\n}\n"
      output: é 233 U+00E9
  - key: bug-inverser-octets
    format: bug-fix
    question: |-
      Inverser « café » donne « �fac » :
      ```go
      b := []byte(s)
      slices.Reverse(b)
      return string(b)
      ```
    answer: |-
      ```go
      r := []rune(s)
      slices.Reverse(r)
      return string(r)
      ```
      Inverser les octets sépare les deux octets de « é » ; on inverse les runes.
  - key: bug-initiale
    format: bug-fix
    question: |-
      L'initiale d'« Élodie » s'affiche « � » :
      ```go
      initiale := string(prenom[0])
      ```
    answer: |-
      ```go
      r, _ := utf8.DecodeRuneInString(prenom)
      initiale := string(r)
      ```
      `prenom[0]` est le premier octet de « É » ; on décode la première rune.
  - key: bug-majuscule
    format: bug-fix
    question: |-
      La mise en majuscule de la première lettre casse les prénoms accentués :
      ```go
      b := []byte(prenom)
      b[0] = b[0] - 32
      ```
    answer: |-
      ```go
      r := []rune(prenom)
      r[0] = unicode.ToUpper(r[0])
      prenom = string(r)
      ```
      L'arithmétique sur les octets ne vaut que pour l'ASCII ; `unicode.ToUpper` gère tous les alphabets.
  - key: bug-boucle-octets
    format: bug-fix
    question: "Le comptage des voyelles ignore les « é » :\n```go\nfor i := 0; i < len(s); i++ {\n\tif strings.ContainsRune(\"aeiouyé\", rune(s[i])) {\n\t\tn++\n\t}\n}\n```"
    answer: "```go\nfor _, r := range s {\n\tif strings.ContainsRune(\"aeiouyé\", r) {\n\t\tn++\n\t}\n}\n```\nLa boucle sur les indices lit des octets ; `range` décode les runes."
