notion: runes-utf8
lesson: "Une **rune** (`int32`) représente un **point de code Unicode** : `'A'` vaut 65, `'é'` vaut 233, `'€'` vaut 8364. En\nUTF-8, un point de code s'encode sur **1 à 4 octets**.\n\nParcourir les caractères d'une chaîne :\n\n```go\nfor i, r := range \"héllo\" { // i : indice de l'octet de début, r : la rune\n\tfmt.Printf(\"%d:%c \", i, r) // 0:h 1:é 3:l 4:l 5:o\n}\n\nrunes := []rune(\"héllo\")    // conversion : un élément par caractère\nlen(runes)                  // 5\nstring(runes[1])            // \"é\"\nutf8.RuneCountInString(s)   // 5, sans allouer\nutf8.RuneLen('€')           // 3 octets\n```\n\n- `range` décode l'UTF-8 au fil de l'eau ; un octet invalide donne la rune de remplacement `U+FFFD` (�).\n- `[]rune(s)` alloue un slice : pratique pour inverser une chaîne ou accéder au n-ième caractère, mais coûteux sur de\n  longs textes.\n- Le package `unicode` classe les runes (`unicode.IsLetter`, `unicode.IsUpper`, `unicode.ToUpper`) ; `unicode/utf8`\n  encode et décode.\n- Une rune n'est pas toujours un « caractère visible » : un emoji drapeau ou une lettre avec un accent combinant\n  peuvent compter plusieurs runes (les graphèmes demandent une bibliothèque dédiée).\n\n**Piège classique** : inverser une chaîne octet par octet. Les caractères multi-octets sont détruits ; on inverse le\n`[]rune`.\n\n**En entretien** : « Une rune est un point de code (int32), encodé sur 1 à 4 octets en UTF-8 ; range décode les runes,\n[]rune(s) les convertit ; unicode et unicode/utf8 pour le reste. »"
tour:
  - title: Runes et UTF-8
    text: |-
      Une **rune** est un point de code Unicode, de type `rune` (un `int32`). Un littéral entre apostrophes, comme
      `'é'`, est une rune.

      `for … range` sur une chaîne la **décode** : à chaque tour, il donne la position de départ en octets et la rune.
      C'est la bonne façon de parcourir les caractères. `utf8.RuneCountInString` compte les runes, et `[]rune(s)`
      convertit la chaîne en une slice de runes, qu'on peut indexer.

      Une rune n'est pas toujours ce qu'un lecteur voit comme un caractère : un emoji composé en contient plusieurs.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"unicode/utf8"
          )

          func main() {
          	mot := "Noël"
          	fmt.Println(len(mot), utf8.RuneCountInString(mot))
          	for i, r := range mot {
          		fmt.Printf("%d %c\n", i, r)
          	}
          	runes := []rune(mot)
          	fmt.Println(string(runes[2]))
          }
      output: |-
        5 4
        0 N
        1 o
        2 ë
        4 l
        ë
    task:
      instructions: |-
        Inverse le mot caractère par caractère, en passant par `[]rune` : le programme doit afficher `lëoN`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "Noël"
          	fmt.Println(mot)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "Noël"
          	runes := []rune(mot)
          	for i, j := 0, len(runes)-1; i < j; i, j = i+1, j-1 {
          		runes[i], runes[j] = runes[j], runes[i]
          	}
          	fmt.Println(string(runes))
          }
      output: |-
        lëoN
cards:
  - key: parcourir-caracteres-chaine
    format: course
    question: "Comment parcourir les caractères d'une chaîne `s` ?"
    choices:
      - {text: "Avec `for i, r := range s`, qui décode l'UTF-8 en runes", correct: true}
      - {text: "Avec `for i := range len(s)`, en lisant `s[i]` comme un caractère", correct: false}
      - {text: "Avec `for _, c := range []byte(s)`, un octet par caractère", correct: false}
      - {text: "Avec `for i := 0; i < len(s); i++`, en convertissant `rune(s[i])`", correct: false}
    answer: "`range` sur une chaîne décode l'UTF-8 : `r` est une rune, `i` l'indice en octets de son début. Les boucles sur `s[i]` ou `[]byte(s)` lisent des octets, qui coupent les caractères non ASCII."
  - key: code-fmt-println-len-hello-len
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(len("héllo"), len([]rune("héllo")))
      for i, r := range "hé!" {
          fmt.Print(i, ":", string(r), " ")
      }
      ```
    choices:
      - text: |-
          ```
          6 5
          0:h 1:é 3:!
          ```
        correct: true
      - text: |-
          ```
          6 5
          0:h 1:é 2:!
          ```
        correct: false
      - text: |-
          ```
          5 5
          0:h 1:é 2:!
          ```
        correct: false
      - text: |-
          ```
          6 6
          0:h 1:é 3:!
          ```
        correct: false
    answer: "`len` compte les octets (6), `[]rune` les caractères (5) ; `range` donne l'indice en octets du début de chaque rune, qui saute de 1 à 3 car « é » occupe 2 octets."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(len(\"héllo\"), len([]rune(\"héllo\")))\n\tfor i, r := range \"hé!\" {\n\t    fmt.Print(i, \":\", string(r), \" \")\n\t}\n}\n"
      output: |-
        6 5
        0:h 1:é 3:!
  - key: rune-byte-manipuler-chaine
    format: course
    question: "Pour manipuler une chaîne caractère par caractère, faut-il la convertir en `[]rune` ou en `[]byte` ?"
    choices:
      - {text: "`[]rune` si le texte peut contenir de l'Unicode, `[]byte` pour de l'ASCII connu", correct: true}
      - {text: "Toujours `[]byte` : en Go, chaque caractère occupe exactement un octet", correct: false}
      - {text: "Toujours `[]rune` : `[]byte` ne compile pas sur une chaîne non ASCII", correct: false}
      - {text: "`[]byte` pour l'Unicode, plus compact ; `[]rune` pour l'ASCII seulement", correct: false}
    answer: "`[]rune` donne un élément par point de code, donc des caractères entiers ; `[]byte` donne les octets, ce qui suffit (et coûte moins) pour de l'ASCII connu. La conversion en `[]byte` compile toujours, mais coupe les caractères multi-octets."
  - key: convertir-rune-inverser-chaine
    format: course
    question: "Pourquoi convertir en `[]rune` pour inverser une chaîne ?"
    choices:
      - {text: "Pour ne pas séparer les octets d'un caractère multi-octets", correct: true}
      - {text: "Parce qu'une chaîne ne peut pas être parcourue à rebours", correct: false}
      - {text: "Parce que `slices.Reverse` refuse les slices de `byte`", correct: false}
      - {text: "Pour inverser la chaîne en place, sans aucune allocation", correct: false}
    answer: "Inverser les octets sépare ceux d'un caractère comme « é » et produit de l'UTF-8 invalide ; inverser les runes garde chaque caractère entier. Un accent combinant (une lettre suivie d'une rune d'accent) demande encore plus de soin."
  - key: definition-rune
    format: course
    question: Que représente une rune ?
    choices:
      - {text: "Un point de code Unicode, dans un `int32`, encodé sur 1 à 4 octets en UTF-8", correct: true}
      - {text: "Un octet d'une chaîne, alias de `uint8`, comme le type `byte`", correct: false}
      - {text: "Un caractère sur 16 bits, comme le `char` de Java", correct: false}
      - {text: "Un caractère tel qu'il s'affiche, accents combinés compris", correct: false}
    answer: "`rune` est un alias d'`int32` : un point de code Unicode, comme 'é' (U+00E9), qui s'encode sur 1 à 4 octets en UTF-8. Un caractère affiché peut réunir plusieurs runes (une lettre et un accent combinant)."
  - key: vf-octets
    format: true-false
    question: En UTF-8, un caractère occupe toujours un seul octet.
    truth: false
    answer: 'De 1 à 4 octets : 1 pour l''ASCII, 2 pour « é », 3 pour « € », 4 pour la plupart des emojis.'
  - key: vf-range
    format: true-false
    question: '`range` sur une chaîne donne les runes, pas les octets.'
    truth: true
    answer: Avec, en premier, l'indice de l'octet où commence chaque rune.
  - key: vf-invalide
    format: true-false
    question: '`range` sur des octets UTF-8 invalides provoque une panique.'
    truth: false
    answer: Chaque octet invalide donne la rune de remplacement U+FFFD.
  - key: vf-grapheme
    format: true-false
    question: Une rune correspond toujours à un caractère visible pour l'utilisateur.
    truth: false
    answer: Un drapeau ou une lettre avec accent combinant peut compter plusieurs runes.
  - key: qcm-inverser
    format: multiple-choice
    question: Comment inverser une chaîne qui contient des accents ?
    choices:
      - {text: "Convertir en `[]rune`, inverser le slice, reconvertir en string", correct: true}
      - {text: "Inverser le `[]byte` de la chaîne, puis le reconvertir en string", correct: false}
      - {text: "Parcourir `s[i]` de la fin vers le début, en concaténant", correct: false}
      - {text: "Appeler `strings.Reverse(s)`, de la bibliothèque standard", correct: false}
    answer: '`strings.Reverse` n''existe pas, et les octets d''un caractère ne doivent pas être séparés.'
  - key: qcm-tailles
    format: multiple-choice
    question: "Combien d'octets occupe « € » en UTF-8 ?"
    choices:
      - {text: "3", correct: true}
      - {text: "1", correct: false}
      - {text: "2", correct: false}
      - {text: "4", correct: false}
    answer: "« € » (U+20AC) occupe 3 octets ; « A » en occupe 1, « é » 2, et les caractères hors du plan de base, comme beaucoup de symboles récents, 4."
  - key: qcm-classer
    format: multiple-choice
    question: Quel package indique si une rune est une lettre ou une majuscule ?
    choices:
      - text: '`unicode`'
        correct: true
      - text: '`strings`'
        correct: false
      - text: '`strconv`'
        correct: false
      - text: '`bytes`'
        correct: false
    answer: '`unicode.IsLetter`, `unicode.IsUpper`, `unicode.ToUpper`...'
  - key: qcm-nieme
    format: multiple-choice
    question: Comment obtenir le troisième caractère de `s` (accents compris) ?
    choices:
      - text: '`string([]rune(s)[2])`'
        correct: true
      - text: '`string(s[2])`'
        correct: false
      - text: '`s[2:3]`'
        correct: false
      - text: '`s.charAt(2)`'
        correct: false
    answer: L'indexation et la découpe d'une chaîne travaillent en octets.
