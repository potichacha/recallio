notion: runes-utf8
cards:
  - key: parcourir-caracteres-chaine
    format: course
    question: Comment parcourir les caractères d'une chaîne ?
    answer: '`for i, r := range s`, qui décode l''UTF-8 en runes.'
  - key: code-fmt-println-len-hello-len
    format: code-output
    question: |-
      ```go
      fmt.Println(len("héllo"), len([]rune("héllo")))
      for i, r := range "hé!" {
          fmt.Print(i, ":", string(r), " ")
      }
      ```
    answer: '`6 5`, puis `0:h 1:é 3:! ` : len compte les octets ; range parcourt les runes et l''index saute de 1 à 3 car "é" occupe 2 octets.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(len(\"héllo\"), len([]rune(\"héllo\")))\n\tfor i, r := range \"hé!\" {\n\t    fmt.Print(i, \":\", string(r), \" \")\n\t}\n}\n"
      output: |-
        6 5
        0:h 1:é 3:!
  - key: rune-byte-manipuler-chaine
    format: course
    question: '[]rune ou []byte pour manipuler une chaîne ?'
    answer: '[]rune si Unicode possible, []byte pour de l''ASCII connu.'
  - key: convertir-rune-inverser-chaine
    format: course
    question: Pourquoi convertir en []rune pour inverser une chaîne ?
    answer: Pour ne pas casser les caractères Unicode multi-octets.
