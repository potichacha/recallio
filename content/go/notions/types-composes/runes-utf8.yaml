      Complète pour compter les caractères sans allouer :
      ```go
      n := utf8.___(s)
      ```
    blanks:
      - - RuneCountInString
    answer: '`utf8.RuneCountInString` parcourt les octets sans créer de slice.'
  - key: trous-verbe
    format: fill-in
    question: |-
      Complète pour afficher une rune comme un caractère :
      ```go
      fmt.Printf("%___\n", 'é')
      ```
    blanks:
      - - c
    answer: '`%c` affiche le caractère, `%d` le nombre, `%U` le point de code U+00E9.'
  - key: code-tailles
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for _, r := range "Aé€" {
      	fmt.Print(utf8.RuneLen(r), " ")
      }
      fmt.Println(len("Aé€"))
      ```
    choices:
      - {text: "`1 2 3 6`", correct: true}
      - {text: "`1 1 1 3`", correct: false}
      - {text: "`1 2 2 5`", correct: false}
      - {text: "`1 2 3 3`", correct: false}
    answer: "`1 2 3 6` : « A » occupe 1 octet, « é » 2, « € » 3 ; `len` compte les octets, donc leur somme."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unicode/utf8\"\n)\n\nfunc main() {\n\tfor _, r := range \"Aé€\" {\n\t\tfmt.Print(utf8.RuneLen(r), \" \")\n\t}\n\tfmt.Println(len(\"Aé€\"))\n}\n"
      output: 1 2 3 6
  - key: code-inverser
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := []rune("été")
      slices.Reverse(r)
      fmt.Println(string(r))
      ```
    choices:
      - {text: "`été`", correct: true}
      - {text: "`eté`", correct: false}
      - {text: "`tée`", correct: false}
      - {text: "Des octets invalides, affichés « �t� »", correct: false}
    answer: "`été` : un palindrome, correctement inversé caractère par caractère grâce aux runes. Inverser les octets aurait cassé les deux « é »."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tr := []rune(\"été\")\n\tslices.Reverse(r)\n\tfmt.Println(string(r))\n}\n"
      output: été
  - key: code-verbes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := 'é'
      fmt.Printf("%c %d %U\n", r, r, r)
      ```
    choices:
      - {text: "`é 233 U+00E9`", correct: true}
      - {text: "`é é U+00E9`", correct: false}
      - {text: "`233 233 U+E9`", correct: false}
      - {text: "`é 195 U+00C3`", correct: false}
    answer: "`é 233 U+00E9` : `%c` affiche le caractère, `%d` la valeur de la rune (233, son point de code, pas un octet), `%U` le point de code en notation Unicode."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tr := 'é'\n\tfmt.Printf(\"%c %d %U\\n\", r, r, r)\n}\n"
      output: é 233 U+00E9
  - key: bug-inverser-octets
    format: bug-fix
    question: |-
      Inverser « café » donne « �fac ». Quelle correction est la bonne ?
      ```go
      b := []byte(s)
      slices.Reverse(b)
      return string(b)
      ```
    choices:
      - {text: "Inverser les runes : `r := []rune(s)`, puis `slices.Reverse(r)`", correct: true}
      - {text: "Inverser la chaîne directement, avec `slices.Reverse(s)`", correct: false}
      - {text: "Parcourir `s` à rebours avec `s[i]`, en ajoutant chaque octet", correct: false}
      - {text: "Normaliser la chaîne en NFC, puis inverser ses octets", correct: false}
    answer: |-
      ```go
      r := []rune(s)
      slices.Reverse(r)
      return string(r)
      ```
      Inverser les octets sépare les deux octets de « é » ; on inverse les runes.
  - key: bug-initiale
    format: bug-fix
    question: |-
      L'initiale d'« Élodie » s'affiche « � ». Quelle correction est la bonne ?
      ```go
      initiale := string(prenom[0])
      ```
    choices:
      - {text: "Décoder la première rune : `utf8.DecodeRuneInString(prenom)`", correct: true}
      - {text: "Convertir l'octet en rune : `string(rune(prenom[0]))`", correct: false}
      - {text: "Prendre les deux premiers octets : `prenom[0:2]`", correct: false}
      - {text: "Passer en majuscules : `string(strings.ToUpper(prenom)[0])`", correct: false}
    answer: |-
      ```go
      r, _ := utf8.DecodeRuneInString(prenom)
      initiale := string(r)
      ```
      `prenom[0]` est le premier octet de « É » ; on décode la première rune. `rune(prenom[0])` donnerait « Ã », et deux octets ne valent que pour certains caractères.
  - key: bug-majuscule
    format: bug-fix
    question: |-
      La mise en majuscule de la première lettre casse les prénoms accentués. Quelle correction est la bonne ?
      ```go
      b := []byte(prenom)
      b[0] = b[0] - 32
      ```
    choices:
      - {text: "Passer par les runes, et mettre `unicode.ToUpper(r[0])`", correct: true}
      - {text: "Ne soustraire 32 que si `b[0]` est entre 'a' et 'z'", correct: false}
      - {text: "Appliquer `strings.ToUpper(string(b[0]))` au premier octet", correct: false}
      - {text: "Soustraire 64 aux lettres accentuées, codées sur deux octets", correct: false}
    answer: |-
      ```go
      r := []rune(prenom)
      r[0] = unicode.ToUpper(r[0])
      prenom = string(r)
      ```
      L'arithmétique sur les octets ne vaut que pour l'ASCII ; `unicode.ToUpper` gère tous les alphabets.
  - key: bug-boucle-octets
    format: bug-fix
    question: |-
      Le comptage des voyelles ignore les « é ». Quelle correction est la bonne ?
      ```go
      for i := 0; i < len(s); i++ {
      	if strings.ContainsRune("aeiouyé", rune(s[i])) {
      		n++
      	}
      }
      ```
    choices:
      - {text: "Parcourir les runes avec `for _, r := range s`", correct: true}
      - {text: "Tester `strings.Contains(\"aeiouyé\", string(s[i]))`", correct: false}
      - {text: "Ajouter les deux octets de « é » à la liste des voyelles", correct: false}
      - {text: "Convertir chaque octet avec `unicode.ToLower(rune(s[i]))`", correct: false}
    answer: "```go\nfor _, r := range s {\n\tif strings.ContainsRune(\"aeiouyé\", r) {\n\t\tn++\n\t}\n}\n```\nLa boucle sur les indices lit des octets ; `range` décode les runes."
