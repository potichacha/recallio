notion: slices-bases
lesson: |-
  Un **slice** est une **vue** sur une portion d'un tableau : il a une **longueur** (`len`, les éléments visibles) et
  une **capacité** (`cap`, la place disponible dans le tableau à partir du début du slice).

  ```go
  s := []int{1, 2, 3}         // littéral : len 3, cap 3
  t := make([]int, 2, 10)     // [0 0], len 2, cap 10
  u := make([]int, 0, 100)    // vide, prêt à recevoir 100 éléments sans réallouer
  var v []int                 // nil : len 0, cap 0

  s = append(s, 4)            // ajoute à la fin (peut réallouer)
  d := s[1:3]                 // découpe : éléments 1 et 2, partage le tableau
  premier, dernier := s[0], s[len(s)-1]
  ```

  - `s[a:b]` donne les éléments de `a` (inclus) à `b` (exclu) ; `s[:b]`, `s[a:]` et `s[:]` sont permis.
  - Un indice hors de `[0, len)` **panique** (« index out of range »).
  - Les slices ne se comparent qu'à `nil` ; pour comparer les contenus : `slices.Equal`.
  - Une **pile** s'écrit avec un slice : `append` pour empiler, `s[len(s)-1]` et `s = s[:len(s)-1]` pour dépiler.

  **Piège classique** : `make([]int, n)` puis `append`. On obtient n zéros **suivis** des éléments ajoutés ; pour
  préallouer, c'est `make([]int, 0, n)`.

  **En entretien** : « Une vue sur un tableau avec une longueur et une capacité ; make pour préallouer, append pour
  ajouter, s[a:b] pour découper en partageant ; slices.Equal pour comparer. »
tour:
  - title: Les slices
    text: |-
      Une **slice** est une vue sur une partie d'un tableau. Elle a une longueur, `len`, et une capacité, `cap` : le
      nombre d'éléments disponibles jusqu'à la fin du tableau sous-jacent. C'est la liste de tous les jours en Go :
      `[]int`, sans taille.

      `s[1:3]` découpe une slice, du premier indice inclus au second exclu. Le résultat **partage** le même tableau :
      modifier l'un modifie l'autre.

      `append` ajoute des éléments et renvoie la slice, éventuellement dans un nouveau tableau plus grand : on écrit
      toujours `s = append(s, x)`. Une slice `nil` accepte `append`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 9, 18}
          	milieu := notes[1:3]
          	fmt.Println(milieu, len(milieu), cap(milieu))

          	milieu[0] = 16
          	fmt.Println(notes)

          	var liste []int
          	liste = append(liste, 1, 2, 3)
          	fmt.Println(liste, len(liste))
          }
      output: |-
        [15 9] 2 3
        [12 16 9 18]
        [1 2 3] 3
    task:
      instructions: |-
        Découpe `notes` pour ne garder que ses deux dernières valeurs, sans écrire leurs indices en dur (avec `len`) :
        le programme doit afficher `[9 18]`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 9, 18}
          	fin := notes[0:2]
          	fmt.Println(fin)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	notes := []int{12, 15, 9, 18}
          	fin := notes[len(notes)-2:]
          	fmt.Println(fin)
          }
      output: |-
        [9 18]
cards:
  - key: len-vs-cap
    format: course
    question: len vs cap ?
    answer: Nombre d'éléments accessibles vs place disponible dans le tableau sous-jacent.
  - key: comparer-deux-slices-avec
    format: course
    question: Peut-on comparer deux slices avec == ?
    answer: Non, seulement à nil ; utiliser slices.Equal.
  - key: code-make-int-3-append-1
    format: code-output
    question: |-
      ```go
      s := make([]int, 3)
      s = append(s, 1)
      fmt.Println(s, len(s))
      ```
    answer: '`[0 0 0 1] 4` : `make([]int, 3)` crée trois zéros, `append` ajoute après (piège fréquent : on voulait `make([]int, 0, 3)`).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := make([]int, 3)\n\ts = append(s, 1)\n\tfmt.Println(s, len(s))\n}\n"
      output: '[0 0 0 1] 4'
  - key: implementer-pile
    format: course
    question: Comment implémenter une pile en Go ?
    answer: 'Avec un slice : append pour empiler, re-slicing pour dépiler.'
  - key: decouper
    format: course
    question: Que contient `s[1:3]` ?
    answer: Les éléments d'indice 1 et 2 (la borne haute est exclue) ; ce nouveau slice partage le tableau de `s`.
  - key: make
    format: course
    question: Quelle différence entre `make([]int, 5)` et `make([]int, 0, 5)` ?
    answer: Le premier contient 5 zéros (len 5) ; le second est vide (len 0) avec une capacité de 5, prêt pour `append`.
  - key: vf-comparer
    format: true-false
    question: '`a == b` compare le contenu de deux slices.'
    truth: false
    answer: Un slice ne se compare qu'à nil ; on utilise `slices.Equal(a, b)`.
  - key: vf-hors-limites
    format: true-false
    question: Lire `s[len(s)]` panique.
    truth: true
    answer: Les indices valides vont de 0 à len(s)-1.
  - key: vf-decoupe-copie
    format: true-false
    question: '`t := s[1:3]` crée une copie indépendante des éléments.'
    truth: false
    answer: '`t` partage le tableau sous-jacent : modifier `t[0]` modifie `s[1]`.'
  - key: vf-borne-capacite
    format: true-false
    question: Avec `s := make([]int, 2, 10)`, `s[:5]` est permis.
    truth: true
    answer: On peut redécouper jusqu'à la capacité ; les éléments révélés valent zéro.
  - key: qcm-len-cap
    format: multiple-choice
    question: Avec `s := make([]int, 3, 8)`, que valent `len(s)` et `cap(s)` ?
    choices:
      - text: 3 et 8
        correct: true
      - text: 8 et 3
        correct: false
      - text: 0 et 8
        correct: false
      - text: 3 et 3
        correct: false
    answer: '`make([]T, len, cap)`.'
  - key: qcm-dernier
    format: multiple-choice
    question: Comment obtenir le dernier élément d'un slice non vide ?
    choices:
      - text: '`s[len(s)-1]`'
        correct: true
      - text: '`s[-1]`'
        correct: false
      - text: '`s.last()`'
        correct: false
      - text: '`s[len(s)]`'
        correct: false
    answer: Go n'a pas d'indices négatifs.
  - key: qcm-depiler
    format: multiple-choice
    question: Comment dépiler le dernier élément d'une pile `p []int` ?
    choices:
      - text: '`haut := p[len(p)-1]` puis `p = p[:len(p)-1]`'
        correct: true
      - text: '`haut := p.pop()`'
        correct: false
      - text: '`p = p[1:]`'
        correct: false
      - text: '`delete(p, len(p)-1)`'
        correct: false
    answer: '`p[1:]` retirerait le premier élément ; `delete` ne s''applique qu''aux maps.'
  - key: qcm-egalite
    format: multiple-choice
    question: Comment tester que deux slices ont le même contenu ?
    choices:
      - text: '`slices.Equal(a, b)`'
        correct: true
      - text: '`reflect.DeepEqual(a, b)`, plus lent et moins précis sur nil'
        correct: true
      - text: '`a == b`'
        correct: false
      - text: '`&a == &b`'
        correct: false
    answer: '`slices.Equal` est le choix idiomatique depuis Go 1.21.'
  - key: trous-make
    format: fill-in
    question: |-
      Complétez pour préallouer un slice vide de capacité 100 :
      ```go
      resultats := make([]string, ___, ___)
      ```
    blanks:
      - - '0'
      - - '100'
    answer: Longueur 0, capacité 100.
  - key: trous-append
    format: fill-in
    question: |-
      Complétez l'ajout en fin de slice :
      ```go
      noms = ___(noms, "ada")
      ```
    blanks:
      - - append
    answer: On réaffecte le résultat d'`append`.
  - key: trous-decoupe
    format: fill-in
    question: |-
      Complétez pour garder les trois premiers éléments :
      ```go
      top3 := classement[___]
      ```
    blanks:
      - - :3
        - 0:3
    answer: La borne haute est exclue.
  - key: trous-equal
    format: fill-in
    question: "Complétez la comparaison de contenus :\n```go\nif !slices.___(attendu, obtenu) {\n\tt.Errorf(\"obtenu %v\", obtenu)\n}\n```"
    blanks:
      - - Equal
    answer: '`slices.Equal` compare longueur et éléments.'
  - key: code-decoupe
    format: code-output
    question: |-
      ```go
      s := []int{10, 20, 30, 40, 50}
      t := s[1:3]
      t[0] = 99
      fmt.Println(s, t, len(t), cap(t))
      ```
    answer: '`[10 99 30 40 50] [99 30] 2 4` : `t` partage le tableau de `s`, sa capacité court jusqu''à la fin.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{10, 20, 30, 40, 50}\n\tt := s[1:3]\n\tt[0] = 99\n\tfmt.Println(s, t, len(t), cap(t))\n}\n"
      output: '[10 99 30 40 50] [99 30] 2 4'
  - key: code-pile
    format: code-output
    question: |-
      ```go
      var pile []string
      pile = append(pile, "a", "b", "c")
      haut := pile[len(pile)-1]
      pile = pile[:len(pile)-1]
      fmt.Println(haut, pile)
      ```
    answer: '`c [a b]` : on empile avec append et l''on dépile en réduisant la longueur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar pile []string\n\tpile = append(pile, \"a\", \"b\", \"c\")\n\thaut := pile[len(pile)-1]\n\tpile = pile[:len(pile)-1]\n\tfmt.Println(haut, pile)\n}\n"
      output: c [a b]
  - key: code-hors-limites
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3}
      i := 3
      fmt.Println(s[i])
      ```
    answer: Une panique « index out of range [3] with length 3 ».
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3}\n\ti := 3\n\tfmt.Println(s[i])\n}\n"
      panics: index out of range [3] with length 3
  - key: bug-make-append
    format: bug-fix
    question: "La liste contient des zéros en trop au début :\n```go\nids := make([]int, len(clients))\nfor _, c := range clients {\n\tids = append(ids, c.ID)\n}\n```"
    answer: "```go\nids := make([]int, 0, len(clients))\nfor _, c := range clients {\n\tids = append(ids, c.ID)\n}\n```\n`make([]int, n)` crée n zéros ; avec une longueur 0 et une capacité n, `append` remplit sans réallouer."
  - key: bug-comparaison
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: a == b (slice can only be compared to nil) » :
      ```go
      if attendu == obtenu { ... }
      ```
    answer: |-
      ```go
      if slices.Equal(attendu, obtenu) { ... }
      ```
      Les slices ne se comparent qu'à nil.
  - key: bug-vide
    format: bug-fix
    question: |-
      Le service panique sur un panier vide :
      ```go
      dernier := panier.Articles[len(panier.Articles)-1]
      ```
    answer: "```go\nif len(panier.Articles) == 0 {\n\treturn errors.New(\"panier vide\")\n}\ndernier := panier.Articles[len(panier.Articles)-1]\n```\nSur un slice vide, l'indice -1 panique : on vérifie la longueur d'abord."
  - key: bug-partage
    format: bug-fix
    question: "Après la mise en majuscules du titre affiché, le titre original est modifié lui aussi :\n```go\naffiche := lettres[:10]\nfor i := range affiche {\n\taffiche[i] = unicode.ToUpper(affiche[i])\n}\n```"
    answer: "```go\naffiche := slices.Clone(lettres[:10])\nfor i := range affiche {\n\taffiche[i] = unicode.ToUpper(affiche[i])\n}\n```\nUne découpe partage le tableau ; une copie isole les modifications."
