notion: maps-bases
lesson: |-
  Une **map** associe des clés à des valeurs : `map[K]V`. C'est une table de hachage ; lecture, écriture et suppression
  sont en O(1) en moyenne.

  ```go
  stock := map[string]int{"pomme": 3, "poire": 0} // littéral
  vide := make(map[string]int)                    // map vide, prête à l'écriture
  grosse := make(map[string]int, 10_000)          // avec une capacité estimée

  stock["kiwi"] = 5          // écrire
  n := stock["pomme"]        // lire : 3
  m := stock["absent"]       // clé absente : valeur zéro (0), pas d'erreur
  n, ok := stock["poire"]    // forme « v, ok » : 0, true
  delete(stock, "kiwi")      // supprimer (sans erreur si absente)
  len(stock)                 // nombre d'entrées
  ```

  - La forme **`v, ok`** distingue une clé **absente** d'une clé présente à **zéro**.
  - `m[k]++` fonctionne même si la clé est absente : on part de la valeur zéro. C'est l'idiome pour **compter**.
  - Une map est une **référence** : la passer à une fonction ou l'affecter partage les mêmes données.
  - L'ordre d'itération est **aléatoire**, et une map **nil** panique à l'écriture.
  - Une map n'est **pas sûre entre goroutines** : des écritures concurrentes provoquent une erreur fatale
    (« concurrent map writes »). On la protège par un `sync.Mutex` (ou `sync.Map` dans des cas précis).
  - `clear(m)` (Go 1.21) vide une map ; `maps.Clone`, `maps.Keys` (itérateur) complètent.

  **Piège classique** : tester `if m[k] == 0` pour savoir si une clé existe ; une clé présente à 0 est confondue avec une
  clé absente. On utilise `v, ok`.

  **En entretien** : « Une table de hachage, une référence ; une clé absente donne la valeur zéro, la forme v, ok dit si
  elle existe ; pas sûre entre goroutines, ordre aléatoire, et make avant d'écrire. »
tour:
  - title: Les maps
    text: |-
      Une **map** associe des clés à des valeurs : `map[string]int`. On la crée avec un littéral, ou vide avec
      `make(map[string]int)`.

      Lire une clé absente ne plante pas : on obtient la **valeur zéro**. Pour distinguer une clé absente d'une valeur
      zéro, on utilise la forme à deux valeurs : `age, ok := ages["Linus"]`.

      `delete(m, clé)` supprime une entrée, et `len(m)` les compte. `fmt.Println` affiche une map avec ses clés
      **triées**.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	ages := map[string]int{"Ada": 36, "Alan": 41}
          	ages["Grace"] = 85
          	fmt.Println(ages["Ada"], ages["Linus"])

          	if age, ok := ages["Linus"]; !ok {
          		fmt.Println("Linus est absent", age)
          	}

          	delete(ages, "Alan")
          	fmt.Println(ages, len(ages))
          }
      output: |-
        36 0
        Linus est absent 0
        map[Ada:36 Grace:85] 2
    task:
      instructions: |-
        Compte les mots de `mots` dans la map `compte` : le programme doit afficher `map[go:3 java:1]`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mots := []string{"go", "java", "go", "go"}
          	compte := map[string]int{}
          	fmt.Println(compte, len(mots))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mots := []string{"go", "java", "go", "go"}
          	compte := map[string]int{}
          	for _, mot := range mots {
          		compte[mot]++
          	}
          	fmt.Println(compte)
          }
      output: |-
        map[go:3 java:1]
cards:
  - key: renvoie-lecture-cle-absente-map
    format: course
    question: Que renvoie la lecture d'une clé absente d'une map ?
    choices:
      - {text: "La valeur zéro du type des valeurs, sans erreur", correct: true}
      - {text: "nil, quel que soit le type des valeurs", correct: false}
      - {text: "Une panic « key not found »", correct: false}
      - {text: "Une erreur, en second résultat obligatoire", correct: false}
    answer: "La valeur zéro du type (0, \"\", nil...), sans panic ni erreur. Pour distinguer « absent » de « présent à zéro », la forme `v, ok := m[k]`."
  - key: map-thread-safe
    format: course
    question: "Une map est-elle sûre entre goroutines (thread-safe) ?"
    choices:
      - {text: "Non : un accès concurrent avec écriture provoque une erreur fatale", correct: true}
      - {text: "Oui : le runtime verrouille la map à chaque lecture et à chaque écriture", correct: false}
      - {text: "Oui pour les lectures et les écritures, mais pas pendant un `range`", correct: false}
      - {text: "Non, mais l'accès concurrent provoque une panic qu'un `recover` rattrape", correct: false}
    answer: "Non : le runtime détecte souvent l'accès concurrent avec écriture et arrête le programme (« concurrent map writes »), une erreur fatale que `recover` ne rattrape pas. On protège la map par un `sync.Mutex` ou un `RWMutex`, ou l'on utilise `sync.Map`."
  - key: dois-compter-mots-fichier-afficher-tries
    format: scenario
    question: "Tu dois compter les mots d'un fichier et les afficher triés par fréquence. Comment t'y prends-tu ?"
    choices:
      - {text: "Je lis en flux avec `bufio.Scanner`, compte dans une map, puis trie ses clés par fréquence", correct: true}
      - {text: "Je compte dans une map, puis je l'affiche avec `range` : elle garde ses clés triées par valeur", correct: false}
      - {text: "Je compte dans une map, puis j'appelle `sort.Map` pour la trier par valeur décroissante", correct: false}
      - {text: "Je compte dans une `sync.Map`, qui parcourt ses clés de la plus fréquente à la plus rare", correct: false}
    answer: "La map compte en O(n), mais son ordre d'itération est aléatoire : on extrait les clés (`slices.Collect(maps.Keys(compte))`) et on les trie avec `slices.SortFunc`, par fréquence décroissante. `bufio.Scanner` lit en flux : la mémoire dépend du nombre de mots distincts, pas de la taille du fichier (attention à sa ligne maximale de 64 Ko, réglable avec `Buffer`)."
  - key: code-m-map-string-int-m
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[string][]int{}
      m["a"] = append(m["a"], 1)
      fmt.Println(m)
      ```
    choices:
      - {text: "`map[a:[1]]`", correct: true}
      - {text: "`map[a:[]]`", correct: false}
      - {text: "`map[]`", correct: false}
      - {text: "Une panic : `append` sur `m[\"a\"]`, qui vaut nil", correct: false}
    answer: "`map[a:[1]]` : la valeur zéro d'une clé absente est un slice nil, que `append` accepte (il alloue) ; l'affectation crée ensuite l'entrée."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string][]int{}\n\tm[\"a\"] = append(m[\"a\"], 1)\n\tfmt.Println(m)\n}\n"
      output: map[a:[1]]
  - key: v-ok
    format: course
    question: Comment savoir si une clé est présente dans une map ?
    choices:
      - {text: "Avec `v, ok := m[k]` : `ok` vaut true si la clé existe, même à la valeur zéro", correct: true}
      - {text: "En comparant `m[k]` à nil : une clé absente donne toujours nil", correct: false}
      - {text: "Avec `m.containsKey(k)`, comme sur une `Map` en Java", correct: false}
      - {text: "En comparant `m[k]` à la valeur zéro du type des valeurs", correct: false}
    answer: "La forme `v, ok := m[k]` : `ok` vaut true si la clé existe, même si sa valeur est la valeur zéro. Comparer `m[k]` à zéro confond « absent » et « présent à zéro »."
  - key: compter
    format: course
    question: Pourquoi `compte[mot]++` fonctionne-t-il sur une clé absente ?
    choices:
      - {text: "La lecture donne la valeur zéro (0), et l'affectation crée l'entrée avec 1", correct: true}
      - {text: "Go initialise à 0 toutes les clés possibles dès la création de la map", correct: false}
      - {text: "`++` sur une clé absente appelle `make` pour créer la valeur manquante", correct: false}
      - {text: "Il ne fonctionne pas : il faut d'abord écrire `compte[mot] = 0`", correct: false}
    answer: "`compte[mot]++` vaut `compte[mot] = compte[mot] + 1` : lire une clé absente donne 0, et l'affectation crée l'entrée avec 1. Pas besoin d'initialiser la clé, contrairement à un `dict` Python."
  - key: vf-absente-erreur
    format: true-false
    question: Lire une clé absente d'une map provoque une panique.
    truth: false
    answer: On obtient la valeur zéro du type des valeurs.
  - key: vf-delete-absente
    format: true-false
    question: '`delete(m, k)` sur une clé absente provoque une erreur.'
    truth: false
    answer: '`delete` ne fait rien si la clé n''existe pas.'
  - key: vf-reference
    format: true-false
    question: Une fonction qui reçoit une map peut y ajouter des entrées visibles par l'appelant.
    truth: true
    answer: La map est une référence vers la même table.
  - key: vf-concurrence
    format: true-false
    question: Plusieurs goroutines peuvent écrire dans une même map sans synchronisation.
    truth: false
    answer: Le runtime détecte souvent les écritures concurrentes et arrête le programme (« concurrent map writes »).
  - key: qcm-operations
    format: multiple-choice
    question: "Laquelle de ces opérations retire la clé `\"a\"` de `m := map[string]int{}` ?"
    choices:
      - {text: "`delete(m, \"a\")`", correct: true}
      - {text: "`m.remove(\"a\")`", correct: false}
      - {text: "`m.delete(\"a\")`", correct: false}
      - {text: "`m[\"a\"] = nil`", correct: false}
    answer: "On retire une clé avec la fonction native `delete`, et l'on compte avec `len(m)` : une map n'a pas de méthodes. `m[\"a\"] = nil` ne compile pas pour des valeurs `int`."
  - key: qcm-presence
    format: multiple-choice
    question: 'Avec `stock := map[string]int{"poire": 0}`, comment savoir si « poire » est référencée ?'
    choices:
      - text: '`_, ok := stock["poire"]`'
        correct: true
      - text: '`stock["poire"] != 0`'
        correct: false
      - text: '`stock.contains("poire")`'
        correct: false
      - text: '`stock["poire"] != nil`'
        correct: false
    answer: La valeur 0 ne dit pas si la clé existe ; `ok` le dit.
  - key: qcm-capacite
    format: multiple-choice
    question: À quoi sert le second argument de `make(map[string]int, 1000)` ?
    choices:
      - {text: "À préallouer de la place pour environ 1000 entrées, sans limite stricte", correct: true}
      - {text: "À limiter la map à 1000 entrées, au-delà desquelles elle panique", correct: false}
      - {text: "À créer d'emblée 1000 entrées dont la valeur vaut zéro", correct: false}
      - {text: "À fixer la longueur, que `len(m)` renvoie dès la création", correct: false}
    answer: C'est une indication de taille qui évite des réallocations ; la map grandit au besoin.
  - key: qcm-vider
    format: multiple-choice
    question: "Quelles écritures vident une map `m` en gardant la même variable ?"
    choices:
      - text: '`clear(m)` (Go 1.21)'
        correct: true
      - text: Une boucle `for k := range m { delete(m, k) }`
        correct: true
      - text: '`m = nil` puis écrire dedans'
        correct: false
      - text: '`m.clear()`'
        correct: false
    answer: '`m = nil` rendrait toute écriture fatale.'
