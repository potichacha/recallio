notion: maps-bases
lesson: |-
  Une **map** associe des clés à des valeurs : `map[K]V`. C'est une table de hachage ; lecture, écriture et suppression
  sont en O(1) en moyenne.

  ```go
  stock := map[string]int{"pomme": 3, "poire": 0} // littéral
  vide := make(map[string]int)                    // map vide, prête à l'écriture
  grosse := make(map[string]int, 10_000)          // avec une capacité estimée

  stock["kiwi"] = 5          // écrire
  n := stock["pomme"]        // lire : 3
  m := stock["absent"]       // clé absente : valeur zéro (0), pas d'erreur
  n, ok := stock["poire"]    // forme « v, ok » : 0, true
  delete(stock, "kiwi")      // supprimer (sans erreur si absente)
  len(stock)                 // nombre d'entrées
  ```

  - La forme **`v, ok`** distingue une clé **absente** d'une clé présente à **zéro**.
  - `m[k]++` fonctionne même si la clé est absente : on part de la valeur zéro. C'est l'idiome pour **compter**.
  - Une map est une **référence** : la passer à une fonction ou l'affecter partage les mêmes données.
  - L'ordre d'itération est **aléatoire**, et une map **nil** panique à l'écriture.
  - Une map n'est **pas sûre entre goroutines** : des écritures concurrentes provoquent une erreur fatale
    (« concurrent map writes »). On la protège par un `sync.Mutex` (ou `sync.Map` dans des cas précis).
  - `clear(m)` (Go 1.21) vide une map ; `maps.Clone`, `maps.Keys` (itérateur) complètent.

  **Piège classique** : tester `if m[k] == 0` pour savoir si une clé existe ; une clé présente à 0 est confondue avec une
  clé absente. On utilise `v, ok`.

  **En entretien** : « Une table de hachage, une référence ; une clé absente donne la valeur zéro, la forme v, ok dit si
  elle existe ; pas sûre entre goroutines, ordre aléatoire, et make avant d'écrire. »
tour:
  - title: Les maps
    text: |-
      Une **map** associe des clés à des valeurs : `map[string]int`. On la crée avec un littéral, ou vide avec
      `make(map[string]int)`.

      Lire une clé absente ne plante pas : on obtient la **valeur zéro**. Pour distinguer une clé absente d'une valeur
      zéro, on utilise la forme à deux valeurs : `age, ok := ages["Linus"]`.

      `delete(m, clé)` supprime une entrée, et `len(m)` les compte. `fmt.Println` affiche une map avec ses clés
      **triées**.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	ages := map[string]int{"Ada": 36, "Alan": 41}
          	ages["Grace"] = 85
          	fmt.Println(ages["Ada"], ages["Linus"])

          	if age, ok := ages["Linus"]; !ok {
          		fmt.Println("Linus est absent", age)
          	}

          	delete(ages, "Alan")
          	fmt.Println(ages, len(ages))
          }
      output: |-
        36 0
        Linus est absent 0
        map[Ada:36 Grace:85] 2
    task:
      instructions: |-
        Compte les mots de `mots` dans la map `compte` : le programme doit afficher `map[go:3 java:1]`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mots := []string{"go", "java", "go", "go"}
          	compte := map[string]int{}
          	fmt.Println(compte, len(mots))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mots := []string{"go", "java", "go", "go"}
          	compte := map[string]int{}
          	for _, mot := range mots {
          		compte[mot]++
          	}
          	fmt.Println(compte)
          }
      output: |-
        map[go:3 java:1]
cards:
  - key: renvoie-lecture-cle-absente-map
    format: course
    question: Que renvoie la lecture d'une clé absente d'une map ?
    answer: La valeur zéro du type ; l'idiome `v, ok := m[k]` distingue absent et zéro.
  - key: map-thread-safe
    format: course
    question: Une map est-elle thread-safe ?
    answer: Non ; un accès concurrent avec écriture provoque une erreur fatale non récupérable.
  - key: dois-compter-mots-fichier-afficher-tries
    format: scenario
    question: Tu dois compter les mots d'un fichier et les afficher triés par fréquence.
    answer: |-
      ```go
      compte := make(map[string]int)
      scanner := bufio.NewScanner(f)
      scanner.Split(bufio.ScanWords)
      for scanner.Scan() {
          compte[strings.ToLower(scanner.Text())]++
      }
      mots := slices.Collect(maps.Keys(compte))    // Go 1.23+
      slices.SortFunc(mots, func(a, b string) int {
          return cmp.Compare(compte[b], compte[a])  // fréquence décroissante
      })
      ```
      "La map compte en O(n) ; comme son ordre est aléatoire, j'extrais les clés et je les trie avec un comparateur. `bufio.Scanner` lit en flux, donc la mémoire dépend du nombre de mots distincts, pas de la taille du fichier. Attention à la taille de ligne maximale par défaut du Scanner (64 Ko), réglable avec `Buffer`."
  - key: code-m-map-string-int-m
    format: code-output
    question: |-
      ```go
      m := map[string][]int{}
      m["a"] = append(m["a"], 1)
      fmt.Println(m)
      ```
    answer: '`map[a:[1]]` : la valeur zéro d''une clé absente est un slice nil, accepté par `append`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string][]int{}\n\tm[\"a\"] = append(m[\"a\"], 1)\n\tfmt.Println(m)\n}\n"
      output: map[a:[1]]
  - key: v-ok
    format: course
    question: Comment savoir si une clé est présente dans une map ?
    answer: 'Avec la forme `v, ok := m[k]` : `ok` vaut true si la clé existe, même si sa valeur est la valeur zéro.'
  - key: compter
    format: course
    question: Pourquoi `compte[mot]++` fonctionne-t-il sur une clé absente ?
    answer: Lire une clé absente donne la valeur zéro (0), et l'affectation crée l'entrée avec 1.
  - key: vf-absente-erreur
    format: true-false
    question: Lire une clé absente d'une map provoque une panique.
    truth: false
    answer: On obtient la valeur zéro du type des valeurs.
  - key: vf-delete-absente
    format: true-false
    question: '`delete(m, k)` sur une clé absente provoque une erreur.'
    truth: false
    answer: '`delete` ne fait rien si la clé n''existe pas.'
  - key: vf-reference
    format: true-false
    question: Une fonction qui reçoit une map peut y ajouter des entrées visibles par l'appelant.
    truth: true
    answer: La map est une référence vers la même table.
  - key: vf-concurrence
    format: true-false
    question: Plusieurs goroutines peuvent écrire dans une même map sans synchronisation.
    truth: false
    answer: Le runtime détecte souvent les écritures concurrentes et arrête le programme (« concurrent map writes »).
  - key: qcm-operations
    format: multiple-choice
    question: Quelles opérations sont valides sur `m := map[string]int{}` ?
    choices:
      - text: '`m["a"] = 1`'
        correct: true
      - text: '`delete(m, "a")`'
        correct: true
      - text: '`m.remove("a")`'
        correct: false
      - text: '`m.size()`'
        correct: false
    answer: On utilise `delete` et `len`, des fonctions natives.
  - key: qcm-presence
    format: multiple-choice
    question: 'Avec `stock := map[string]int{"poire": 0}`, comment savoir si « poire » est référencée ?'
    choices:
      - text: '`_, ok := stock["poire"]`'
        correct: true
      - text: '`stock["poire"] != 0`'
        correct: false
      - text: '`stock.contains("poire")`'
        correct: false
      - text: '`stock["poire"] != nil`'
        correct: false
    answer: La valeur 0 ne dit pas si la clé existe ; `ok` le dit.
  - key: qcm-capacite
    format: multiple-choice
    question: À quoi sert le second argument de `make(map[string]int, 1000)` ?
    choices:
      - text: À préallouer de la place pour environ 1000 entrées, sans limite stricte
        correct: true
      - text: À limiter la map à 1000 entrées
        correct: false
      - text: À créer 1000 entrées à zéro
        correct: false
      - text: À fixer la longueur
        correct: false
    answer: C'est une indication de taille qui évite des réallocations ; la map grandit au besoin.
  - key: qcm-vider
    format: multiple-choice
    question: Comment vider une map en gardant la même variable ?
    choices:
      - text: '`clear(m)` (Go 1.21)'
        correct: true
      - text: Une boucle `for k := range m { delete(m, k) }`
        correct: true
      - text: '`m = nil` puis écrire dedans'
        correct: false
      - text: '`m.clear()`'
        correct: false
    answer: '`m = nil` rendrait toute écriture fatale.'
  - key: trous-v-ok
    format: fill-in
    question: "Complétez pour savoir si l'utilisateur existe :\n```go\nu, ___ := utilisateurs[id]\nif !ok {\n\treturn ErrInconnu\n}\n```"
    blanks:
      - - ok
    answer: La forme « v, ok » dit si la clé est présente.
  - key: trous-delete
    format: fill-in
    question: |-
      Complétez pour retirer la session :
      ```go
      ___(sessions, jeton)
      ```
    blanks:
      - - delete
    answer: La fonction native `delete`.
  - key: trous-make
    format: fill-in
    question: |-
      Complétez pour créer une map vide utilisable :
      ```go
      compte := ___(map[string]int)
      ```
    blanks:
      - - make
    answer: Ou le littéral `map[string]int{}`.
  - key: trous-compter
    format: fill-in
    question: "Complétez le comptage des mots :\n```go\nfor _, mot := range mots {\n\tcompte[mot]___\n}\n```"
    blanks:
      - - ++
    answer: Une clé absente part de 0.
  - key: code-absent
    format: code-output
    question: |-
      ```go
      stock := map[string]int{"poire": 0}
      a := stock["kiwi"]
      b, ok := stock["poire"]
      c, ok2 := stock["kiwi"]
      fmt.Println(a, b, ok, c, ok2)
      ```
    answer: '`0 0 true 0 false` : la valeur zéro dans les deux cas, `ok` fait la différence.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstock := map[string]int{\"poire\": 0}\n\ta := stock[\"kiwi\"]\n\tb, ok := stock[\"poire\"]\n\tc, ok2 := stock[\"kiwi\"]\n\tfmt.Println(a, b, ok, c, ok2)\n}\n"
      output: 0 0 true 0 false
  - key: code-compter
    format: code-output
    question: "```go\ncompte := map[string]int{}\nfor _, m := range strings.Fields(\"le chat et le chien et le rat\") {\n\tcompte[m]++\n}\nfmt.Println(compte[\"le\"], compte[\"et\"], len(compte))\n```"
    answer: '`3 2 5` : cinq mots distincts.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tcompte := map[string]int{}\n\tfor _, m := range strings.Fields(\"le chat et le chien et le rat\") {\n\t\tcompte[m]++\n\t}\n\tfmt.Println(compte[\"le\"], compte[\"et\"], len(compte))\n}\n"
      output: 3 2 5
  - key: code-reference
    format: code-output
    question: |-
      ```go
      func ajouter(m map[string]int) { m["x"] = 1 }

      m := map[string]int{}
      n := m
      ajouter(m)
      fmt.Println(len(m), len(n))
      ```
    answer: '`1 1` : `n`, `m` et le paramètre désignent la même map.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(m map[string]int) { m[\"x\"] = 1 }\n\nfunc main() {\n\tm := map[string]int{}\n\tn := m\n\tajouter(m)\n\tfmt.Println(len(m), len(n))\n}\n"
      output: 1 1
  - key: bug-zero
    format: bug-fix
    question: "Un produit en rupture (stock 0) est signalé comme « inconnu » :\n```go\nif stock[ref] == 0 {\n\treturn ErrProduitInconnu\n}\n```"
    answer: "```go\nn, ok := stock[ref]\nif !ok {\n\treturn ErrProduitInconnu\n}\nif n == 0 {\n\treturn ErrRupture\n}\n```\nLa valeur zéro ne distingue pas une clé absente d'une clé à 0."
  - key: bug-concurrence
    format: bug-fix
    question: "Le service s'arrête avec « fatal error: concurrent map writes » :\n```go\nvar vues = map[string]int{}\n\nfunc compter(w http.ResponseWriter, r *http.Request) {\n\tvues[r.URL.Path]++\n}\n```"
    answer: "```go\nvar (\n\tmu   sync.Mutex\n\tvues = map[string]int{}\n)\n\nfunc compter(w http.ResponseWriter, r *http.Request) {\n\tmu.Lock()\n\tvues[r.URL.Path]++\n\tmu.Unlock()\n}\n```\nLes handlers s'exécutent dans des goroutines concurrentes ; la map doit être protégée."
  - key: bug-reaffecter-nil
    format: bug-fix
    question: |-
      Après la réinitialisation, l'ajout suivant panique :
      ```go
      func (c *Cache) Vider() { c.entrees = nil }
      func (c *Cache) Ajouter(k, v string) { c.entrees[k] = v }
      ```
    answer: |-
      ```go
      func (c *Cache) Vider() { clear(c.entrees) }
      ```
      Une map nil panique à l'écriture ; `clear` vide la map sans la détruire (ou l'on réaffecte `make(map[string]string)`).
  - key: bug-copie
    format: bug-fix
    question: |-
      Les modifications de la configuration d'un test fuient dans les autres tests :
      ```go
      cfg := configParDefaut // une map[string]string de package
      cfg["mode"] = "test"
      ```
    answer: |-
      ```go
      cfg := maps.Clone(configParDefaut)
      cfg["mode"] = "test"
      ```
      L'affectation copie la référence : on modifiait la map partagée.
  - key: scenario-mots
    format: scenario
    question: Tu dois compter les mots d'un texte et afficher les dix plus fréquents. Comment t'y prends-tu en Go ?
    answer: |-
      Je compte dans une `map[string]int` (`compte[mot]++`), en normalisant les mots (`strings.ToLower`, retrait de la
      ponctuation). Puis je copie les clés dans un slice et je le trie avec `slices.SortFunc` par fréquence
      décroissante, en départageant par ordre alphabétique pour un résultat stable. Je garde les dix premiers. La map
      seule ne suffit pas : son ordre d'itération est aléatoire.
  - key: scenario-cache
    format: scenario
    question: Ton cache en mémoire est une map partagée par les handlers HTTP. Comment le rends-tu sûr et quelles limites vois-tu ?
    answer: |-
      Je l'encapsule dans un type avec un `sync.RWMutex` : `RLock` pour les lectures, `Lock` pour les écritures, et aucun
      accès direct à la map. Je surveille sa taille : sans éviction, il grandit sans limite ; il faut une expiration ou
      une politique LRU. Si les lectures dominent fortement et que les clés sont stables, `sync.Map` peut être plus
      performant. Pour des appels coûteux simultanés sur la même clé, `singleflight` évite les calculs en double.
  - key: scenario-index
    format: scenario
    question: Tu dois retrouver rapidement des commandes par numéro de client parmi un million de commandes en mémoire. Que construis-tu ?
    answer: |-
      Un index `map[IDClient][]Commande` (ou `[]int` d'indices pour éviter de copier les commandes), construit en une
      passe, préalloué avec `make(map[IDClient][]int, nbClients)` si l'on connaît l'ordre de grandeur. La recherche passe
      de O(n) à O(1) en moyenne. Si l'index doit se mettre à jour en concurrence, je le protège par un mutex ; si les
      données sont figées après le chargement, des lectures concurrentes sans écriture sont sûres.
