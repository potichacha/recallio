  - key: code-absent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      stock := map[string]int{"poire": 0}
      a := stock["kiwi"]
      b, ok := stock["poire"]
      c, ok2 := stock["kiwi"]
      fmt.Println(a, b, ok, c, ok2)
      ```
    choices:
      - {text: "`0 0 true 0 false`", correct: true}
