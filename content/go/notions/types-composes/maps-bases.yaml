      - {text: "`0 0 true 0 true`", correct: false}
      - {text: "`<nil> 0 true <nil> false`", correct: false}
    answer: "`0 0 true 0 false` : la valeur zéro dans les deux cas ; seul `ok` distingue la poire présente à 0 du kiwi absent."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstock := map[string]int{\"poire\": 0}\n\ta := stock[\"kiwi\"]\n\tb, ok := stock[\"poire\"]\n\tc, ok2 := stock[\"kiwi\"]\n\tfmt.Println(a, b, ok, c, ok2)\n}\n"
      output: 0 0 true 0 false
  - key: code-compter
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      compte := map[string]int{}
      for _, m := range strings.Fields("le chat et le chien et le rat") {
      	compte[m]++
      }
      fmt.Println(compte["le"], compte["et"], len(compte))
      ```
    choices:
      - {text: "`3 2 5`", correct: true}
      - {text: "`3 2 8`", correct: false}
      - {text: "`1 1 5`", correct: false}
      - {text: "`0 0 5`", correct: false}
    answer: "`3 2 5` : « le » apparaît trois fois, « et » deux fois, et la map a cinq mots distincts sur les huit lus."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tcompte := map[string]int{}\n\tfor _, m := range strings.Fields(\"le chat et le chien et le rat\") {\n\t\tcompte[m]++\n\t}\n\tfmt.Println(compte[\"le\"], compte[\"et\"], len(compte))\n}\n"
      output: 3 2 5
  - key: code-reference
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func ajouter(m map[string]int) { m["x"] = 1 }

      m := map[string]int{}
      n := m
      ajouter(m)
      fmt.Println(len(m), len(n))
      ```
    choices:
      - {text: "`1 1`", correct: true}
      - {text: "`1 0`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "`0 1`", correct: false}
    answer: "`1 1` : une map est une référence vers sa table ; `n := m` et le passage en paramètre copient cette référence, pas les entrées. Les trois désignent la même map."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc ajouter(m map[string]int) { m[\"x\"] = 1 }\n\nfunc main() {\n\tm := map[string]int{}\n\tn := m\n\tajouter(m)\n\tfmt.Println(len(m), len(n))\n}\n"
      output: 1 1
  - key: bug-zero
    format: bug-fix
    question: |-
      Un produit en rupture (stock 0) est signalé comme « inconnu ». Quelle correction est la bonne ?
      ```go
      if stock[ref] == 0 {
      	return ErrProduitInconnu
      }
      ```
    choices:
      - {text: "Lire avec `n, ok := stock[ref]`, et ne dire « inconnu » que si `!ok`", correct: true}
      - {text: "Tester `stock[ref] == nil` pour repérer un produit inconnu", correct: false}
      - {text: "Tester `len(stock[ref]) == 0` plutôt que la valeur elle-même", correct: false}
      - {text: "Stocker -1 pour une rupture, pour que 0 veuille dire « inconnu »", correct: false}
    answer: "```go\nn, ok := stock[ref]\nif !ok {\n\treturn ErrProduitInconnu\n}\nif n == 0 {\n\treturn ErrRupture\n}\n```\nLa valeur zéro ne distingue pas une clé absente d'une clé à 0."
  - key: bug-concurrence
    format: bug-fix
    question: |-
      Le service s'arrête avec « fatal error: concurrent map writes ». Quelle correction est la bonne ?
      ```go
      var vues = map[string]int{}

      func compter(w http.ResponseWriter, r *http.Request) {
      	vues[r.URL.Path]++
      }
      ```
    choices:
      - {text: "Protéger la map par un `sync.Mutex`, verrouillé autour de chaque accès", correct: true}
      - {text: "Entourer l'incrément d'un `recover`, pour rattraper l'erreur fatale", correct: false}
      - {text: "Créer la map avec `make(map[string]int, 1000)`, pour ne plus la réallouer", correct: false}
      - {text: "Écrire `vues[p] = vues[p] + 1` au lieu de `vues[p]++`, une opération atomique", correct: false}
    answer: |-
      ```go
      var (
      	mu   sync.Mutex
      	vues = map[string]int{}
      )

      func compter(w http.ResponseWriter, r *http.Request) {
      	mu.Lock()
      	vues[r.URL.Path]++
      	mu.Unlock()
      }
      ```
      Les handlers s'exécutent dans des goroutines concurrentes ; la map doit être protégée. Une erreur fatale ne se rattrape pas avec `recover`.
  - key: bug-reaffecter-nil
    format: bug-fix
    question: |-
      Après la réinitialisation, l'ajout suivant panique. Quelle correction est la bonne ?
      ```go
      func (c *Cache) Vider() { c.entrees = nil }
      func (c *Cache) Ajouter(k, v string) { c.entrees[k] = v }
      ```
    choices:
      - {text: "Vider sans détruire : `clear(c.entrees)`, ou réaffecter une map neuve", correct: true}
      - {text: "Rattraper la panique dans `Ajouter` avec `recover`, puis réessayer", correct: false}
      - {text: "Écrire `c.entrees = *new(map[string]string)`, une map déjà allouée", correct: false}
      - {text: "Passer le receveur de `Vider` par valeur, pour ne pas toucher au cache", correct: false}
    answer: |-
      ```go
      func (c *Cache) Vider() { clear(c.entrees) }
      ```
      Une map nil panique à l'écriture ; `clear` vide la map sans la détruire (ou l'on réaffecte `make(map[string]string)`). `new(map[string]string)` renvoie un pointeur vers une map nil.
  - key: bug-copie
    format: bug-fix
    question: |-
      Les modifications de la configuration d'un test fuient dans les autres tests. Quelle correction est la bonne ?
      ```go
      cfg := configParDefaut // une map[string]string de package
      cfg["mode"] = "test"
      ```
    choices:
      - {text: "`cfg := maps.Clone(configParDefaut)`, une copie propre au test", correct: true}
      - {text: "`cfg := &configParDefaut`, pour travailler à travers un pointeur", correct: false}
      - {text: "`var cfg map[string]string = configParDefaut`, une déclaration explicite", correct: false}
      - {text: "`cfg := configParDefaut` dans un `t.Run`, qui isole chaque sous-test", correct: false}
    answer: |-
      ```go
      cfg := maps.Clone(configParDefaut)
      cfg["mode"] = "test"
      ```
      L'affectation copie la référence : on modifiait la map partagée.
  - key: scenario-mots
    format: scenario
    question: Tu dois compter les mots d'un texte et afficher les dix plus fréquents. Comment t'y prends-tu en Go ?
    choices:
      - {text: "Une `map[string]int` pour compter, puis ses clés triées par fréquence, à égalité par ordre alphabétique", correct: true}
      - {text: "Une `map[string]int` pour compter, puis les dix premières clés que donne son parcours par `range`", correct: false}
      - {text: "Un slice de tous les mots, trié par `slices.Sort`, dont je garde les dix premiers éléments", correct: false}
      - {text: "Une `map[int]string` de la fréquence vers le mot, parcourue de la plus haute à la plus basse", correct: false}
    answer: "La map compte en O(n), en normalisant les mots (`strings.ToLower`, ponctuation retirée) ; son ordre d'itération est aléatoire, donc on copie les clés dans un slice trié par `slices.SortFunc`, par fréquence décroissante puis par ordre alphabétique pour un résultat stable, et l'on garde les dix premiers."
  - key: scenario-cache
    format: scenario
    question: Ton cache en mémoire est une map partagée par les handlers HTTP. Comment le rends-tu sûr et quelles limites vois-tu ?
    choices:
      - {text: "Je l'encapsule avec un `sync.RWMutex`, et je borne sa taille (expiration ou LRU)", correct: true}
      - {text: "Rien à faire : `net/http` exécute les handlers un par un, la map n'est pas partagée", correct: false}
      - {text: "Je remplace la map par un slice, que plusieurs goroutines écrivent sans risque", correct: false}
      - {text: "J'entoure chaque accès d'un `recover`, qui rattrape les accès concurrents", correct: false}
    answer: "Un type qui cache la map derrière un `sync.RWMutex` (`RLock` pour lire, `Lock` pour écrire) ; sans éviction, il grandit sans limite, d'où une expiration ou une politique LRU. `sync.Map` aide si les lectures dominent, et `singleflight` évite les calculs en double. Les handlers s'exécutent en parallèle, et l'erreur fatale d'une map ne se rattrape pas."
  - key: scenario-index
    format: scenario
    question: Tu dois retrouver rapidement des commandes par numéro de client parmi un million de commandes en mémoire. Que construis-tu ?
    choices:
      - {text: "Un index `map[IDClient][]int` des positions, construit en une passe et préalloué", correct: true}
      - {text: "Un parcours du slice des commandes à chaque recherche, avec `slices.IndexFunc`", correct: false}
      - {text: "Un slice des commandes trié par client, interrogé avec `slices.Contains`", correct: false}
      - {text: "Une `map[Commande]IDClient`, qui associe chaque commande à son client", correct: false}
    answer: "Un index `map[IDClient][]int` (des indices, pour ne pas copier les commandes), construit en une passe et préalloué avec `make(map[IDClient][]int, nbClients)` : la recherche passe de O(n) à O(1) en moyenne. Des lectures concurrentes sans écriture sont sûres ; si l'index change, un mutex le protège."
