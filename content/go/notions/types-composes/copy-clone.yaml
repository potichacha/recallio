notion: copy-clone
lesson: |-
  Pour obtenir des données **indépendantes**, il faut copier les éléments, pas seulement le descripteur.

  ```go
  dst := make([]int, len(src))
  n := copy(dst, src)        // copie min(len(dst), len(src)) éléments, renvoie ce nombre

  c := slices.Clone(src)     // Go 1.21 : nouveau slice, mêmes éléments
  b := bytes.Clone(donnees)  // pour []byte
  m2 := maps.Clone(m)        // pour une map
  ```

  - `copy(dst, src)` copie le **minimum des deux longueurs** (pas des capacités) : copier dans un slice vide (`len 0`)
    ne copie rien.
  - `copy` gère le **chevauchement** : `copy(s[1:], s)` décale correctement.
  - `copy` d'une chaîne vers un `[]byte` est permis : `copy(buf, "texte")`.
  - `slices.Clone` d'un slice nil renvoie nil.

  Ces copies sont **superficielles** : si les éléments sont des pointeurs, des slices ou des maps, la copie partage
  encore les données pointées. Pour une copie profonde, on copie chaque niveau.

  Cas d'usage : protéger l'état interne d'un type (copier en entrée et en sortie), isoler un sous-slice avant de le
  garder, retirer un élément sans toucher l'original.

  **Piège classique** : `dst := make([]int, 0, len(src)); copy(dst, src)`. La longueur de `dst` est 0, donc rien n'est
  copié ; il faut `make([]int, len(src))`.

  **En entretien** : « copy copie le minimum des longueurs et gère le chevauchement ; slices.Clone, bytes.Clone et
  maps.Clone pour une copie rapide ; ce sont des copies superficielles. »
cards:
  - key: code-fmt-println-copy-make-int
    format: code-output
    question: '`fmt.Println(copy(make([]int, 2), []int{1, 2, 3}))`'
    answer: '`2` : copy copie le minimum des deux longueurs.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(copy(make([]int, 2), []int{1, 2, 3}))\n}\n"
      output: '2'
  - key: minimum
    format: course
    question: Combien d'éléments `copy(dst, src)` copie-t-il ?
    answer: Le minimum de `len(dst)` et `len(src)` ; il renvoie ce nombre.
  - key: superficielle
    format: course
    question: '`slices.Clone` d''un `[]*Client` copie-t-il les clients ?'
    answer: 'Non : il copie les pointeurs, et les deux slices désignent les mêmes clients ; la copie est superficielle.'
  - key: chevauchement
    format: course
    question: Que fait `copy(s[1:], s)` ?
    answer: Il décale les éléments d'une position vers la droite, correctement même si les zones se chevauchent (le dernier élément est perdu).
  - key: vf-capacite
    format: true-false
    question: '`copy` remplit `dst` jusqu''à sa capacité.'
    truth: false
    answer: Jusqu'à sa longueur ; un slice de longueur 0 ne reçoit rien.
  - key: vf-chaine
    format: true-false
    question: '`copy(buf, "abc")` copie les octets d''une chaîne dans un `[]byte`.'
    truth: true
    answer: C'est un cas particulier permis par `copy`.
  - key: vf-clone-nil
    format: true-false
    question: '`slices.Clone(nil)` renvoie un slice vide non nil.'
    truth: false
    answer: 'Il renvoie nil : le clone d''un slice nil reste nil.'
  - key: vf-maps-clone
    format: true-false
    question: '`maps.Clone(m)` renvoie une map indépendante dont les ajouts ne touchent pas `m`.'
    truth: true
    answer: C'est une nouvelle map ; ses valeurs restent partagées si ce sont des pointeurs ou des slices.
  - key: qcm-retour
    format: multiple-choice
    question: Que renvoie `copy(make([]int, 5), []int{1, 2})` ?
    choices:
      - text: '2'
        correct: true
      - text: '5'
        correct: false
      - text: '0'
        correct: false
      - text: Le slice de destination
        correct: false
    answer: Le nombre d'éléments copiés, le minimum des longueurs.
  - key: qcm-copies
    format: multiple-choice
    question: Quelles écritures copient les éléments de `src` dans un nouveau tableau ?
    choices:
      - text: '`slices.Clone(src)`'
        correct: true
      - text: '`dst := make([]int, len(src)); copy(dst, src)`'
        correct: true
      - text: '`dst := src[:]`'
        correct: false
      - text: '`dst := make([]int, 0, len(src)); copy(dst, src)`'
        correct: false
    answer: 'La dernière ne copie rien : `dst` est de longueur 0.'
  - key: qcm-profonde
    format: multiple-choice
    question: Comment copier en profondeur un `[][]int` ?
    choices:
      - text: Cloner le slice externe, puis cloner chaque ligne
        correct: true
      - text: '`slices.Clone(grille)` suffit'
        correct: false
      - text: '`copy(dst, grille)` suffit'
        correct: false
      - text: '`maps.Clone(grille)`'
        correct: false
    answer: Un clone simple partagerait les lignes.
  - key: qcm-supprimer
    format: multiple-choice
    question: Comment retirer l'élément d'indice i sans modifier le slice d'origine ?
    choices:
      - text: '`slices.Delete(slices.Clone(s), i, i+1)`'
        correct: true
      - text: '`slices.Delete(s, i, i+1)`'
        correct: false
      - text: '`append(s[:i], s[i+1:]...)`'
        correct: false
      - text: '`delete(s, i)`'
        correct: false
    answer: '`slices.Delete` et `append(s[:i], ...)` travaillent sur le tableau de `s`.'
  - key: trous-make-copy
    format: fill-in
    question: |-
      Complétez pour copier tous les éléments :
      ```go
      dst := make([]int, ___(src))
      copy(dst, src)
      ```
    blanks:
      - - len
    answer: La longueur de la destination limite la copie.
  - key: trous-clone
    format: fill-in
    question: |-
      Complétez la copie en une ligne :
      ```go
      sauvegarde := slices.___(etat)
      ```
    blanks:
      - - Clone
    answer: '`slices.Clone` (Go 1.21).'
  - key: trous-copy
    format: fill-in
    question: |-
      Complétez pour copier les octets d'une chaîne dans le tampon :
      ```go
      n := ___(buf, "bonjour")
      ```
    blanks:
      - - copy
    answer: '`copy` accepte une chaîne comme source vers un `[]byte`.'
  - key: trous-maps
    format: fill-in
    question: |-
      Complétez pour copier une map :
      ```go
      copie := ___.Clone(reglages)
      ```
    blanks:
      - - maps
    answer: '`maps.Clone`, superficiel comme `slices.Clone`.'
  - key: code-longueur-zero
    format: code-output
    question: |-
      ```go
      src := []int{1, 2, 3}
      dst := make([]int, 0, 3)
      n := copy(dst, src)
      fmt.Println(n, dst)
      ```
    answer: '`0 []` : la destination a une longueur de 0, rien n''est copié.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsrc := []int{1, 2, 3}\n\tdst := make([]int, 0, 3)\n\tn := copy(dst, src)\n\tfmt.Println(n, dst)\n}\n"
      output: 0 []
  - key: code-decaler
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3, 4}
      copy(s[1:], s)
      fmt.Println(s)
      ```
    answer: '`[1 1 2 3]` : copy gère le chevauchement et décale vers la droite.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4}\n\tcopy(s[1:], s)\n\tfmt.Println(s)\n}\n"
      output: '[1 1 2 3]'
  - key: code-superficielle
    format: code-output
    question: |-
      ```go
      grille := [][]int{{1, 2}, {3, 4}}
      copie := slices.Clone(grille)
      copie[0][0] = 99
      copie[1] = []int{0, 0}
      fmt.Println(grille)
      ```
    answer: '`[[99 2] [3 4]]` : les lignes sont partagées (copie superficielle), mais remplacer une ligne de la copie ne touche pas l''original.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tgrille := [][]int{{1, 2}, {3, 4}}\n\tcopie := slices.Clone(grille)\n\tcopie[0][0] = 99\n\tcopie[1] = []int{0, 0}\n\tfmt.Println(grille)\n}\n"
      output: '[[99 2] [3 4]]'
  - key: bug-longueur
    format: bug-fix
    question: |-
      La copie de sauvegarde est toujours vide :
      ```go
      sauvegarde := make([]Etat, 0, len(etats))
      copy(sauvegarde, etats)
      ```
    answer: |-
      ```go
      sauvegarde := make([]Etat, len(etats))
      copy(sauvegarde, etats)
      // ou simplement : sauvegarde := slices.Clone(etats)
      ```
      `copy` s'arrête à la longueur de la destination, ici 0.
  - key: bug-etat-interne
    format: bug-fix
    question: "Un appelant modifie la liste après l'avoir passée au constructeur, et l'objet change avec elle :\n```go\nfunc NouvelleEquipe(membres []string) *Equipe {\n\treturn &Equipe{membres: membres}\n}\n```"
    answer: "```go\nfunc NouvelleEquipe(membres []string) *Equipe {\n\treturn &Equipe{membres: slices.Clone(membres)}\n}\n```\nLe type gardait une référence au tableau de l'appelant ; une copie en entrée protège son état."
  - key: bug-profonde
    format: bug-fix
    question: |-
      Modifier la configuration d'un locataire modifie celle de tous les autres :
      ```go
      cfg := maps.Clone(defaut) // map[string][]string
      cfg["origines"] = append(cfg["origines"], "https://client.fr")
      ```
    answer: "```go\ncfg := make(map[string][]string, len(defaut))\nfor k, v := range defaut {\n\tcfg[k] = slices.Clone(v)\n}\ncfg[\"origines\"] = append(cfg[\"origines\"], \"https://client.fr\")\n```\n`maps.Clone` est superficiel : les slices de valeurs restaient partagés, et append écrivait dans leur capacité."
  - key: bug-delete
    format: bug-fix
    question: |-
      Retirer un élément pour l'affichage modifie la liste originale :
      ```go
      visibles := slices.Delete(tous, i, i+1)
      ```
    answer: |-
      ```go
      visibles := slices.Delete(slices.Clone(tous), i, i+1)
      ```
      `slices.Delete` décale les éléments dans le tableau du slice reçu ; on travaille sur une copie.
