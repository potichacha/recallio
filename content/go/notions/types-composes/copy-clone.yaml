notion: copy-clone
lesson: |-
  Pour obtenir des données **indépendantes**, il faut copier les éléments, pas seulement le descripteur.

  ```go
  dst := make([]int, len(src))
  n := copy(dst, src)        // copie min(len(dst), len(src)) éléments, renvoie ce nombre

  c := slices.Clone(src)     // Go 1.21 : nouveau slice, mêmes éléments
  b := bytes.Clone(donnees)  // pour []byte
  m2 := maps.Clone(m)        // pour une map
  ```

  - `copy(dst, src)` copie le **minimum des deux longueurs** (pas des capacités) : copier dans un slice vide (`len 0`)
    ne copie rien.
  - `copy` gère le **chevauchement** : `copy(s[1:], s)` décale correctement.
  - `copy` d'une chaîne vers un `[]byte` est permis : `copy(buf, "texte")`.
  - `slices.Clone` d'un slice nil renvoie nil.

  Ces copies sont **superficielles** : si les éléments sont des pointeurs, des slices ou des maps, la copie partage
  encore les données pointées. Pour une copie profonde, on copie chaque niveau.

  Cas d'usage : protéger l'état interne d'un type (copier en entrée et en sortie), isoler un sous-slice avant de le
  garder, retirer un élément sans toucher l'original.

  **Piège classique** : `dst := make([]int, 0, len(src)); copy(dst, src)`. La longueur de `dst` est 0, donc rien n'est
  copié ; il faut `make([]int, len(src))`.

  **En entretien** : « copy copie le minimum des longueurs et gère le chevauchement ; slices.Clone, bytes.Clone et
  maps.Clone pour une copie rapide ; ce sont des copies superficielles. »
cards:
  - key: code-fmt-println-copy-make-int
    format: code-output
    question: "Qu'affiche `fmt.Println(copy(make([]int, 2), []int{1, 2, 3}))` ?"
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`[1 2]`", correct: false}
    answer: "`2` : `copy` copie le minimum des deux longueurs et renvoie ce nombre, pas le slice."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(copy(make([]int, 2), []int{1, 2, 3}))\n}\n"
      output: '2'
  - key: minimum
    format: course
    question: Combien d'éléments `copy(dst, src)` copie-t-il ?
    choices:
      - {text: "Le minimum de `len(dst)` et `len(src)`, nombre qu'il renvoie", correct: true}
      - {text: "Le minimum de `cap(dst)` et `len(src)`, nombre qu'il renvoie", correct: false}
      - {text: "Tous ceux de `src`, en agrandissant `dst` quand il le faut", correct: false}
      - {text: "Tous ceux de `src`, ou une panic si `dst` est trop court", correct: false}
    answer: "`copy` s'arrête à la plus petite des deux longueurs et renvoie le nombre copié ; il n'agrandit jamais `dst`, et sa capacité ne compte pas. D'où le piège d'une destination créée par `make([]T, 0, n)`."
  - key: superficielle
    format: course
    question: '`slices.Clone` d''un `[]*Client` copie-t-il les clients ?'
    choices:
      - {text: "Non : il copie les pointeurs, et les deux slices désignent les mêmes clients", correct: true}
      - {text: "Oui : il suit chaque pointeur et copie le client pointé dans le nouveau slice", correct: false}
      - {text: "Oui, à condition que `Client` n'ait que des champs de types simples", correct: false}
      - {text: "Non : il ne copie rien, les deux slices partagent le même tableau", correct: false}
    answer: "`slices.Clone` copie les éléments dans un nouveau tableau, mais ces éléments sont des pointeurs : les deux slices désignent les mêmes clients. La copie est superficielle ; une copie profonde clone chaque client."
  - key: chevauchement
    format: course
    question: Que fait `copy(s[1:], s)` ?
    choices:
      - {text: "Il décale les éléments d'un cran vers la droite ; le dernier est perdu", correct: true}
      - {text: "Il remplit tout le slice avec le premier élément, recopié de case en case", correct: false}
      - {text: "Il panique, car la source et la destination se chevauchent en mémoire", correct: false}
      - {text: "Il ajoute une copie de `s` à la fin, ce qui double sa longueur", correct: false}
    answer: "`copy` gère le chevauchement comme `memmove` : `[1 2 3 4]` devient `[1 1 2 3]`. Une copie naïve, de gauche à droite, aurait propagé `s[0]` partout ; et `copy` n'agrandit jamais un slice."
  - key: vf-capacite
    format: true-false
    question: '`copy` remplit `dst` jusqu''à sa capacité.'
    truth: false
    answer: Jusqu'à sa longueur ; un slice de longueur 0 ne reçoit rien.
  - key: vf-chaine
    format: true-false
    question: '`copy(buf, "abc")` copie les octets d''une chaîne dans un `[]byte`.'
    truth: true
    answer: C'est un cas particulier permis par `copy`.
  - key: vf-clone-nil
    format: true-false
    question: '`slices.Clone(nil)` renvoie un slice vide non nil.'
    truth: false
    answer: 'Il renvoie nil : le clone d''un slice nil reste nil.'
  - key: vf-maps-clone
    format: true-false
    question: '`maps.Clone(m)` renvoie une map indépendante dont les ajouts ne touchent pas `m`.'
    truth: true
    answer: C'est une nouvelle map ; ses valeurs restent partagées si ce sont des pointeurs ou des slices.
  - key: qcm-retour
    format: multiple-choice
    question: Que renvoie `copy(make([]int, 5), []int{1, 2})` ?
    choices:
      - text: '2'
        correct: true
      - text: '5'
        correct: false
      - text: '0'
        correct: false
      - text: Le slice de destination
        correct: false
    answer: Le nombre d'éléments copiés, le minimum des longueurs.
  - key: qcm-copies
    format: multiple-choice
    question: Quelles écritures copient les éléments de `src` dans un nouveau tableau ?
    choices:
      - text: '`slices.Clone(src)`'
        correct: true
      - text: '`dst := make([]int, len(src)); copy(dst, src)`'
        correct: true
      - text: '`dst := src[:]`'
        correct: false
      - text: '`dst := make([]int, 0, len(src)); copy(dst, src)`'
        correct: false
    answer: 'La dernière ne copie rien : `dst` est de longueur 0.'
  - key: qcm-profonde
    format: multiple-choice
    question: Comment copier en profondeur un `[][]int` ?
    choices:
      - {text: "Cloner le slice externe, puis cloner chaque ligne", correct: true}
      - {text: "`slices.Clone(grille)`, qui copie aussi les lignes", correct: false}
      - {text: "`copy(dst, grille)` avec un `dst` de même longueur", correct: false}
      - {text: "`maps.Clone(grille)`, qui copie en profondeur", correct: false}
    answer: "`slices.Clone` et `copy` ne copient que les en-têtes des lignes, qui restent partagées avec l'original ; il faut un nouveau slice externe, puis `slices.Clone` de chaque ligne. `maps.Clone` ne s'applique qu'aux maps."
  - key: qcm-supprimer
    format: multiple-choice
    question: Comment retirer l'élément d'indice i sans modifier le slice d'origine ?
    choices:
      - text: '`slices.Delete(slices.Clone(s), i, i+1)`'
        correct: true
      - text: '`slices.Delete(s, i, i+1)`'
        correct: false
      - text: '`append(s[:i], s[i+1:]...)`'
        correct: false
      - text: '`delete(s, i)`'
        correct: false
    answer: '`slices.Delete` et `append(s[:i], ...)` travaillent sur le tableau de `s`.'
  - key: trous-make-copy
    format: fill-in
    question: |-
      Complète pour copier tous les éléments :
      ```go
      dst := make([]int, ___(src))
      copy(dst, src)
      ```
    blanks:
      - - len
    answer: La longueur de la destination limite la copie.
  - key: trous-clone
    format: fill-in
    question: |-
      Complète la copie en une ligne :
      ```go
      sauvegarde := slices.___(etat)
      ```
    blanks:
      - - Clone
    answer: '`slices.Clone` (Go 1.21).'
  - key: trous-copy
    format: fill-in
    question: |-
      Complète pour copier les octets d'une chaîne dans le tampon :
      ```go
      n := ___(buf, "bonjour")
      ```
    blanks:
      - - copy
    answer: '`copy` accepte une chaîne comme source vers un `[]byte`.'
  - key: trous-maps
    format: fill-in
    question: |-
      Complète pour copier une map :
      ```go
      copie := ___.Clone(reglages)
      ```
    blanks:
      - - maps
    answer: '`maps.Clone`, superficiel comme `slices.Clone`.'
  - key: code-longueur-zero
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      src := []int{1, 2, 3}
      dst := make([]int, 0, 3)
      n := copy(dst, src)
      fmt.Println(n, dst)
      ```
    choices:
      - {text: "`0 []`", correct: true}
      - {text: "`3 [1 2 3]`", correct: false}
      - {text: "`3 []`", correct: false}
      - {text: "`0 [0 0 0]`", correct: false}
    answer: "`0 []` : la destination a une longueur de 0, et `copy` s'arrête à la plus petite longueur ; sa capacité de 3 ne compte pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsrc := []int{1, 2, 3}\n\tdst := make([]int, 0, 3)\n\tn := copy(dst, src)\n\tfmt.Println(n, dst)\n}\n"
      output: 0 []
  - key: code-decaler
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{1, 2, 3, 4}
      copy(s[1:], s)
      fmt.Println(s)
      ```
    choices:
      - {text: "`[1 1 2 3]`", correct: true}
      - {text: "`[1 1 1 1]`", correct: false}
      - {text: "`[1 2 3 4]`", correct: false}
      - {text: "`[2 3 4 4]`", correct: false}
    answer: "`[1 1 2 3]` : `copy` gère le chevauchement et décale vers la droite, comme si la source était copiée d'abord. `[1 1 1 1]` serait une copie naïve de gauche à droite."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4}\n\tcopy(s[1:], s)\n\tfmt.Println(s)\n}\n"
      output: '[1 1 2 3]'
  - key: code-superficielle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      grille := [][]int{{1, 2}, {3, 4}}
      copie := slices.Clone(grille)
      copie[0][0] = 99
      copie[1] = []int{0, 0}
      fmt.Println(grille)
      ```
    choices:
      - {text: "`[[99 2] [3 4]]`", correct: true}
      - {text: "`[[1 2] [3 4]]`", correct: false}
      - {text: "`[[99 2] [0 0]]`", correct: false}
      - {text: "`[[1 2] [0 0]]`", correct: false}
    answer: "`[[99 2] [3 4]]` : les lignes sont partagées (copie superficielle), donc `copie[0][0] = 99` touche l'original ; remplacer une ligne de la copie, en revanche, ne change que la copie."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tgrille := [][]int{{1, 2}, {3, 4}}\n\tcopie := slices.Clone(grille)\n\tcopie[0][0] = 99\n\tcopie[1] = []int{0, 0}\n\tfmt.Println(grille)\n}\n"
      output: '[[99 2] [3 4]]'
  - key: bug-longueur
    format: bug-fix
    question: |-
      La copie de sauvegarde est toujours vide. Quelle correction est la bonne ?
      ```go
      sauvegarde := make([]Etat, 0, len(etats))
      copy(sauvegarde, etats)
      ```
    choices:
      - {text: "Créer `sauvegarde` avec `make([]Etat, len(etats))`, ou utiliser `slices.Clone`", correct: true}
      - {text: "Inverser les arguments, en écrivant `copy(etats, sauvegarde)`", correct: false}
      - {text: "Doubler la capacité, avec `make([]Etat, 0, 2*len(etats))`", correct: false}
      - {text: "Récupérer le résultat : `sauvegarde = copy(sauvegarde, etats)`", correct: false}
    answer: |-
      ```go
      sauvegarde := make([]Etat, len(etats))
      copy(sauvegarde, etats)
      // ou simplement : sauvegarde := slices.Clone(etats)
      ```
      `copy` s'arrête à la longueur de la destination, ici 0. La capacité n'y change rien, et `copy` renvoie un nombre, pas le slice.
  - key: bug-etat-interne
    format: bug-fix
    question: |-
      Un appelant modifie la liste après l'avoir passée au constructeur, et l'objet change avec elle. Quelle correction est la bonne ?
      ```go
      func NouvelleEquipe(membres []string) *Equipe {
      	return &Equipe{membres: membres}
      }
      ```
    choices:
      - {text: "Copier en entrée : `&Equipe{membres: slices.Clone(membres)}`", correct: true}
      - {text: "Renvoyer une `Equipe` par valeur plutôt qu'un `*Equipe`", correct: false}
      - {text: "Recevoir les membres en paramètre variadique, `membres ...string`", correct: false}
      - {text: "Stocker `&membres`, un pointeur vers le slice reçu", correct: false}
    answer: |-
      ```go
      func NouvelleEquipe(membres []string) *Equipe {
      	return &Equipe{membres: slices.Clone(membres)}
      }
      ```
      Le type gardait une référence au tableau de l'appelant ; une copie en entrée protège son état. Un paramètre variadique appelé avec `liste...` reçoit le même tableau.
  - key: bug-profonde
    format: bug-fix
    question: |-
      Modifier la configuration d'un locataire modifie celle de tous les autres. Quelle correction est la bonne ?
      ```go
      cfg := maps.Clone(defaut) // map[string][]string
      cfg["origines"] = append(cfg["origines"], "https://client.fr")
      ```
    choices:
      - {text: "Copier la map, puis cloner chaque slice de valeurs avec `slices.Clone`", correct: true}
      - {text: "Appeler `maps.Clone` deux fois de suite, pour copier sur deux niveaux", correct: false}
      - {text: "Copier avec `maps.Copy(cfg, defaut)` dans une map neuve créée par `make`", correct: false}
      - {text: "Remplacer `maps.Clone(defaut)` par l'affectation directe `cfg := defaut`", correct: false}
    answer: |-
      ```go
      cfg := make(map[string][]string, len(defaut))
      for k, v := range defaut {
      	cfg[k] = slices.Clone(v)
      }
      cfg["origines"] = append(cfg["origines"], "https://client.fr")
      ```
      `maps.Clone` est superficiel : les slices de valeurs restaient partagés, et append écrivait dans leur capacité. `maps.Copy` est tout aussi superficiel.
  - key: bug-delete
    format: bug-fix
    question: |-
      Retirer un élément pour l'affichage modifie la liste originale. Quelle correction est la bonne ?
      ```go
      visibles := slices.Delete(tous, i, i+1)
      ```
    choices:
      - {text: "`slices.Delete(slices.Clone(tous), i, i+1)`, sur une copie", correct: true}
      - {text: "`slices.Delete(tous[:], i, i+1)`, sur une vue de la liste", correct: false}
      - {text: "`append(tous[:i], tous[i+1:]...)`, qui alloue un nouveau slice", correct: false}
      - {text: "`slices.Delete(tous[:len(tous):len(tous)], i, i+1)`", correct: false}
    answer: |-
      ```go
      visibles := slices.Delete(slices.Clone(tous), i, i+1)
      ```
      `slices.Delete` décale les éléments dans le tableau du slice reçu ; on travaille sur une copie. `append(tous[:i], ...)` et une capacité limitée décalent eux aussi dans le même tableau.
  - key: protection
    format: course
    question: Quand faut-il copier un slice reçu ou renvoyé par un type ?
    choices:
      - {text: "Quand le type le garde dans son état : en entrée, et en sortie des accesseurs", correct: true}
      - {text: "Jamais : un slice passé en paramètre est déjà une copie de l'original", correct: false}
      - {text: "Seulement en sortie : un slice reçu appartient au type dès l'appel", correct: false}
      - {text: "Seulement quand le slice contient des pointeurs, pas des valeurs", correct: false}
    answer: "Quand le type garde le slice dans son état : on copie en entrée (le constructeur) et en sortie (les accesseurs), pour qu'aucun appelant ne modifie l'état interne. Passer un slice ne copie que son en-tête, jamais ses éléments."
