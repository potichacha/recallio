notion: append-partage
lesson: |-
  Comme plusieurs slices peuvent partager un tableau, `append` peut **écraser** les données d'un autre slice quand il
  reste de la capacité :

  ```go
  s := []int{1, 2, 3, 4}
  t := s[:2]         // [1 2], cap 4
  t = append(t, 99)  // écrit dans s[2] !
  fmt.Println(s)     // [1 2 99 4]
  ```

  Et deux `append` sur le **même** slice de base peuvent se marcher dessus :

  ```go
  base := make([]int, 3, 10)
  a := append(base, 1) // écrit base[3]
  b := append(base, 2) // écrit aussi base[3] : a[3] vaut maintenant 2
  ```

  Les parades :
  - **limiter la capacité** avec l'expression complète `s[a:b:b]` : le prochain `append` doit réallouer ;
  - **copier** avant de modifier : `slices.Clone(s)` ou `append([]int(nil), s...)` ;
  - ne pas garder de référence à un slice qu'une autre partie du code va étendre.

  Autre effet du partage : un petit sous-slice garde **vivant** tout le tableau d'origine (fuite mémoire). On copie la
  partie utile avant de la conserver.

  **Piège classique** : un sous-slice renvoyé par une fonction, que l'appelant étend avec `append`, ce qui écrase les
  éléments suivants de l'original.

  **En entretien** : « Des slices qui partagent un tableau ; append écrit en place tant qu'il reste de la capacité et peut
  écraser un voisin ; on limite la capacité avec s[a:b:b] ou l'on copie. »
cards:
  - key: deux-slices-peuvent-ils-partager-donnees
    format: course
    question: Deux slices peuvent-ils partager des données ?
    answer: Oui, un sous-slice partage le tableau sous-jacent ; modifier l'un modifie l'autre.
  - key: sous-slice-provoquer-fuite-memoire
    format: course
    question: Pourquoi un sous-slice peut-il provoquer une fuite mémoire ?
    answer: Il retient tout le tableau sous-jacent ; copier la partie utile.
  - key: fonction-modifie-slice-passe-parametre-parfois
    format: scenario
    question: Une fonction modifie un slice passé en paramètre. Parfois l'appelant voit le changement, parfois non.
    answer: |-
      C'est le comportement normal des slices. La fonction reçoit une **copie de l'en-tête** qui pointe vers le même tableau. Si elle modifie des éléments existants (`s[0] = x`), l'appelant le voit. Si elle fait un `append` et que la capacité suffit, elle écrit dans le tableau partagé, mais l'appelant ne voit pas la nouvelle longueur ; si la capacité ne suffit pas, `append` alloue un nouveau tableau et l'appelant ne voit rien du tout.
      Règle claire pour l'API : soit la fonction **retourne** le slice modifié (`s = ajouter(s, x)`, comme `append`), soit elle reçoit un pointeur `*[]T`, soit elle ne fait que lire. J'éviterais les fonctions qui modifient silencieusement un slice reçu.
  - key: code-int-1-2-3-2
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3}
      t := s[:2]
      t = append(t, 99)
      fmt.Println(s, t)
      ```
    answer: '`[1 2 99] [1 2 99]` : `t` a une capacité de 3, `append` écrit dans le tableau partagé et écrase `s[2]`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3}\n\tt := s[:2]\n\tt = append(t, 99)\n\tfmt.Println(s, t)\n}\n"
      output: '[1 2 99] [1 2 99]'
  - key: code-make-int-3-10-b
    format: code-output
    question: |-
      ```go
      a := make([]int, 3, 10)
      b := append(a, 4)
      c := append(a, 5)
      fmt.Println(b[3], c[3])
      ```
    answer: '`5 5` : `b` et `c` partagent le même tableau (capacité suffisante), le second `append` écrase la valeur écrite par le premier.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta := make([]int, 3, 10)\n\tb := append(a, 4)\n\tc := append(a, 5)\n\tfmt.Println(b[3], c[3])\n}\n"
      output: 5 5
  - key: entretien-montre-extrait-avec-slices-hesites
    format: scenario
    question: En entretien, on te montre un extrait avec des slices et tu hésites sur le résultat.
    answer: |-
      Je dessinerais le tableau sous-jacent et les en-têtes (pointeur, longueur, capacité) de chaque slice, puis j'appliquerais la règle d'`append` : si la capacité suffit, il écrit en place dans le tableau partagé ; sinon il alloue un nouveau tableau. Ce schéma rend presque tous ces pièges évidents.
      En revue de code réelle, je chercherais justement ces situations : un `append` sur un sous-slice d'un slice qui continue d'être utilisé, et je proposerais `slices.Clone` ou l'expression à trois indices pour rendre l'intention explicite.
  - key: parades
    format: course
    question: Comment empêcher qu'un `append` sur un sous-slice écrase l'original ?
    answer: En limitant la capacité avec `s[a:b:b]` (le prochain append réalloue), ou en copiant avec `slices.Clone`.
  - key: deux-append
    format: course
    question: Pourquoi `a := append(base, 1)` puis `b := append(base, 2)` est-il dangereux ?
    answer: 'Si `base` a de la capacité, les deux écrivent au même emplacement du tableau partagé : `a` voit la valeur de `b`.'
  - key: vf-ecrase
    format: true-false
    question: Un `append` sur un sous-slice peut modifier les éléments de l'original situés après lui.
    truth: true
    answer: Quand il reste de la capacité, il écrit dans le tableau partagé.
  - key: vf-clone
    format: true-false
    question: '`slices.Clone(s)` renvoie un slice qui ne partage pas le tableau de `s`.'
    truth: true
    answer: Il copie les éléments dans un nouveau tableau.
  - key: vf-toujours-sur
    format: true-false
    question: Un sous-slice est toujours sûr à étendre, puisqu'append réalloue.
    truth: false
    answer: Append ne réalloue que si la capacité manque ; sinon il écrit en place.
  - key: vf-fuite
    format: true-false
    question: Garder un sous-slice de 10 octets d'un tampon de 100 Mo garde les 100 Mo en mémoire.
    truth: true
    answer: Le sous-slice pointe sur le tableau entier, que le GC ne peut pas libérer.
  - key: qcm-resultat
    format: multiple-choice
    question: Que vaut `s` après `s := []int{1, 2, 3, 4}; t := s[:2]; t = append(t, 99)` ?
    choices:
      - text: '`[1 2 99 4]`'
        correct: true
      - text: '`[1 2 3 4]`'
        correct: false
      - text: '`[1 2 99 3 4]`'
        correct: false
      - text: '`[1 2]`'
        correct: false
    answer: '`t` avait une capacité de 4 : append a écrit dans `s[2]`.'
  - key: qcm-isoler
    format: multiple-choice
    question: Quelles écritures donnent un slice indépendant de `s` ?
    choices:
      - text: '`slices.Clone(s)`'
        correct: true
      - text: '`append([]int(nil), s...)`'
        correct: true
      - text: '`s[:]`'
        correct: false
      - text: '`t := s`'
        correct: false
    answer: Découper ou affecter copie seulement le descripteur.
  - key: qcm-capacite
    format: multiple-choice
    question: Que fait `t := s[1:3:3]` ?
    choices:
      - text: Un slice des éléments 1 et 2, de capacité 2
        correct: true
      - text: Un slice dont le prochain append réallouera
        correct: true
      - text: Une copie indépendante des éléments
        correct: false
      - text: Un slice de capacité 3
        correct: false
    answer: La capacité vaut `max - bas` = 3 - 1 = 2.
  - key: qcm-fuite
    format: multiple-choice
    question: Comment garder l'en-tête de 64 octets d'un fichier de 1 Go lu en mémoire sans garder tout le fichier ?
    choices:
      - text: '`entete := bytes.Clone(donnees[:64])`'
        correct: true
      - text: '`entete := donnees[:64]`'
        correct: false
      - text: '`entete := donnees[:64:64]`'
        correct: false
      - text: Appeler `runtime.GC()`
        correct: false
    answer: Limiter la capacité ne libère rien ; seule une copie détache l'en-tête du gros tableau.
  - key: code-deux-append
    format: code-output
    question: |-
      ```go
      base := make([]int, 0, 5)
      a := append(base, 1)
      b := append(base, 2)
      fmt.Println(a[0], b[0])
      ```
    answer: '`2 2` : les deux append ont écrit au même emplacement du tableau partagé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tbase := make([]int, 0, 5)\n\ta := append(base, 1)\n\tb := append(base, 2)\n\tfmt.Println(a[0], b[0])\n}\n"
      output: 2 2
  - key: code-capacite-limitee
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3, 4}
      t := s[:2:2]
      t = append(t, 99)
      fmt.Println(s, t)
      ```
    answer: '`[1 2 3 4] [1 2 99]` : avec la capacité limitée, append a réalloué.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4}\n\tt := s[:2:2]\n\tt = append(t, 99)\n\tfmt.Println(s, t)\n}\n"
      output: '[1 2 3 4] [1 2 99]'
  - key: bug-ecrase
    format: bug-fix
    question: |-
      Ajouter une option à la commande de test modifie aussi la commande de build :
      ```go
      base := []string{"go", "build", "-v", "./..."}
      args := base[:2]
      args = append(args, "-race")
      ```
    answer: |-
      ```go
      args := slices.Clone(base[:2])
      args = append(args, "-race")
      // ou : args := base[:2:2]
      ```
      `args` partageait le tableau de `base` : append écrivait par-dessus `-v`.
  - key: bug-deux-variantes
    format: bug-fix
    question: |-
      Les deux chemins construits à partir du même préfixe finissent identiques :
      ```go
      prefixe := make([]string, 0, 10)
      prefixe = append(prefixe, "api", "v1")
      clients := append(prefixe, "clients")
      commandes := append(prefixe, "commandes")
      ```
    answer: |-
      ```go
      clients := append(prefixe[:len(prefixe):len(prefixe)], "clients")
      commandes := append(prefixe[:len(prefixe):len(prefixe)], "commandes")
      // ou des copies avec slices.Clone(prefixe)
      ```
      Les deux append écrivaient dans la même case libre du tableau partagé.
  - key: bug-fuite
    format: bug-fix
    question: "La mémoire du cache grandit sans cesse alors qu'on n'y garde que les identifiants :\n```go\nfunc identifiant(ligne []byte) []byte {\n\treturn ligne[:16]\n}\ncache[cle] = identifiant(ligneLue) // ligneLue fait plusieurs Ko\n```"
    answer: "```go\nfunc identifiant(ligne []byte) []byte {\n\treturn bytes.Clone(ligne[:16])\n}\n```\nLe sous-slice gardait vivant tout le tableau de la ligne ; une copie ne retient que 16 octets."
  - key: bug-retour-interne
    format: bug-fix
    question: "Un appelant qui ajoute un élément à la liste renvoyée corrompt les données internes du type :\n```go\nfunc (r *Registre) Premiers(n int) []Entree {\n\treturn r.entrees[:n]\n}\n```"
    answer: "```go\nfunc (r *Registre) Premiers(n int) []Entree {\n\treturn slices.Clone(r.entrees[:n])\n}\n```\nLe slice renvoyé partageait le tableau interne : un `append` de l'appelant écrasait l'entrée n. Une copie protège\nl'invariant (ou au minimum `r.entrees[:n:n]`)."
  - key: scenario-api
    format: scenario
    question: Tu exposes une méthode qui renvoie une partie d'un slice interne. Comment choisis-tu entre renvoyer une vue et renvoyer une copie ?
    answer: |-
      Par défaut une copie (`slices.Clone`) : l'appelant peut la modifier ou l'étendre sans toucher l'état interne, et
      le type garde ses invariants. Si le coût de la copie compte (chemin chaud, gros volumes), je renvoie une vue à
      capacité limitée (`s[a:b:b]`) et je documente qu'il ne faut pas la modifier, ou je propose un itérateur
      (`iter.Seq`) qui ne donne aucun accès au tableau.
  - key: scenario-test
    format: scenario
    question: Comment détecterais-tu dans un test qu'une fonction modifie par erreur le slice qu'on lui passe ?
    answer: |-
      Je garde une copie de l'entrée (`avant := slices.Clone(entree)`), j'appelle la fonction, puis je vérifie
      `slices.Equal(entree, avant)`. Pour les effets de bord par append, je passe une entrée avec de la capacité en
      réserve (`entree := make([]int, 3, 10)`) et je vérifie aussi `entree[:cap(entree)]`. Le fuzzing aide à couvrir
      beaucoup de formes d'entrée.
