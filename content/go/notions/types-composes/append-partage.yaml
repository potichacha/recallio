notion: append-partage
lesson: |-
  Comme plusieurs slices peuvent partager un tableau, `append` peut **écraser** les données d'un autre slice quand il
  reste de la capacité :

  ```go
  s := []int{1, 2, 3, 4}
  t := s[:2]         // [1 2], cap 4
  t = append(t, 99)  // écrit dans s[2] !
  fmt.Println(s)     // [1 2 99 4]
  ```

  Et deux `append` sur le **même** slice de base peuvent se marcher dessus :

  ```go
  base := make([]int, 3, 10)
  a := append(base, 1) // écrit base[3]
  b := append(base, 2) // écrit aussi base[3] : a[3] vaut maintenant 2
  ```

  Les parades :
  - **limiter la capacité** avec l'expression complète `s[a:b:b]` : le prochain `append` doit réallouer ;
  - **copier** avant de modifier : `slices.Clone(s)` ou `append([]int(nil), s...)` ;
  - ne pas garder de référence à un slice qu'une autre partie du code va étendre.

  Autre effet du partage : un petit sous-slice garde **vivant** tout le tableau d'origine (fuite mémoire). On copie la
  partie utile avant de la conserver.

  **Piège classique** : un sous-slice renvoyé par une fonction, que l'appelant étend avec `append`, ce qui écrase les
  éléments suivants de l'original.

  **En entretien** : « Des slices qui partagent un tableau ; append écrit en place tant qu'il reste de la capacité et peut
  écraser un voisin ; on limite la capacité avec s[a:b:b] ou l'on copie. »
cards:
  - key: deux-slices-peuvent-ils-partager-donnees
    format: course
    question: "Deux slices peuvent-ils partager les mêmes données ?"
    choices:
      - {text: "Oui : un sous-slice partage le tableau sous-jacent, modifier l'un modifie l'autre", correct: true}
      - {text: "Non : chaque découpage `s[a:b]` copie les éléments dans un nouveau tableau", correct: false}
      - {text: "Oui, en lecture seule : écrire dans l'un provoque d'abord une copie du tableau", correct: false}
      - {text: "Non, sauf si les deux sont déclarés comme des pointeurs `*[]T` vers le même slice", correct: false}
    answer: "Oui : `s[a:b]` crée un nouvel en-tête (pointeur, longueur, capacité) qui pointe dans le même tableau. Une écriture par l'un se voit par l'autre ; Go ne fait pas de copie sur écriture."
  - key: sous-slice-provoquer-fuite-memoire
    format: course
    question: Pourquoi un sous-slice peut-il provoquer une fuite mémoire ?
    choices:
      - {text: "Il garde vivant tout le tableau sous-jacent, même s'il n'en montre qu'une petite partie", correct: true}
      - {text: "Il copie le tableau entier à chaque découpage, et ces copies s'accumulent en mémoire", correct: false}
      - {text: "Le ramasse-miettes ne libère jamais un tableau qui a été découpé au moins une fois", correct: false}
      - {text: "Sa capacité grandit à chaque lecture, jusqu'à occuper toute la mémoire disponible", correct: false}
    answer: "Tant qu'un sous-slice est référencé, tout le tableau sous-jacent reste vivant : garder 16 octets d'une ligne de plusieurs Ko retient toute la ligne. On copie la partie utile (`slices.Clone`, `bytes.Clone`)."
  - key: fonction-modifie-slice-passe-parametre-parfois
    format: scenario
    question: "Une fonction modifie un slice reçu en paramètre ; parfois l'appelant voit le changement, parfois non. Comment l'expliques-tu, et que proposes-tu ?"
    choices:
      - {text: "Elle reçoit une copie de l'en-tête : je lui fais renvoyer le slice, comme `append`", correct: true}
      - {text: "Un slice passe par référence : je cherche une course de données entre goroutines", correct: false}
      - {text: "`append` copie toujours le tableau : je le remplace par des affectations `s[i] = x`", correct: false}
      - {text: "Le slice est copié en entier à l'appel : je passe plutôt un tableau `[N]T` à la fonction", correct: false}
    answer: "La fonction reçoit une copie de l'en-tête, qui pointe vers le même tableau : une écriture `s[0] = x` se voit, mais pas la nouvelle longueur après un `append`, et s'il réalloue, plus rien ne se voit. On rend le contrat clair : la fonction renvoie le slice (`s = ajouter(s, x)`), reçoit un `*[]T`, ou ne fait que lire."
  - key: code-int-1-2-3-2
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{1, 2, 3}
      t := s[:2]
      t = append(t, 99)
      fmt.Println(s, t)
      ```
    choices:
      - {text: "`[1 2 99] [1 2 99]`", correct: true}
      - {text: "`[1 2 3] [1 2 99]`", correct: false}
      - {text: "`[1 2 99] [1 2 3 99]`", correct: false}
      - {text: "`[1 2 3] [1 2 3 99]`", correct: false}
    answer: "`t` a une longueur 2 et une capacité 3 : `append` écrit dans la case libre du tableau partagé, qui est `s[2]`. Sans réallocation, `s` voit le 99."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3}\n\tt := s[:2]\n\tt = append(t, 99)\n\tfmt.Println(s, t)\n}\n"
      output: '[1 2 99] [1 2 99]'
  - key: code-make-int-3-10-b
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a := make([]int, 3, 10)
      b := append(a, 4)
      c := append(a, 5)
      fmt.Println(b[3], c[3])
      ```
    choices:
      - {text: "`5 5`", correct: true}
      - {text: "`4 5`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: "`b` et `c` partagent le tableau de `a` (capacité 10) : les deux `append` écrivent à l'indice 3, et le second écrase le 4 du premier."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta := make([]int, 3, 10)\n\tb := append(a, 4)\n\tc := append(a, 5)\n\tfmt.Println(b[3], c[3])\n}\n"
      output: 5 5
  - key: entretien-montre-extrait-avec-slices-hesites
    format: scenario
    question: "En entretien, on te montre un extrait avec des slices et tu hésites sur le résultat. Comment raisonnes-tu ?"
    choices:
      - {text: "Je dessine le tableau et l'en-tête de chaque slice, puis j'applique la règle d'`append`", correct: true}
      - {text: "Je raisonne comme avec une `ArrayList` Java : chaque slice est un objet passé par référence", correct: false}
      - {text: "Je réponds que le résultat dépend du ramasse-miettes, donc qu'il n'est pas prévisible", correct: false}
      - {text: "Je dis qu'il faut l'exécuter : la sortie de ces extraits change selon la version de Go", correct: false}
    answer: "Pointeur, longueur, capacité : avec ce schéma, la règle d'`append` (en place si la capacité suffit, sinon un nouveau tableau) rend presque tous ces pièges évidents. Le résultat est déterministe ; en revue, on rend l'intention explicite avec `slices.Clone` ou l'expression à trois indices."
  - key: parades
    format: course
    question: Comment empêcher qu'un `append` sur un sous-slice écrase l'original ?
    choices:
      - {text: "En limitant la capacité avec `s[a:b:b]`, ou en copiant avec `slices.Clone`", correct: true}
      - {text: "En affectant le sous-slice à une nouvelle variable avant l'`append`", correct: false}
      - {text: "En passant le sous-slice par un pointeur `*[]T` à la fonction qui ajoute", correct: false}
      - {text: "En appelant `copy(t, s[a:b])` sur un `t` déclaré par `var t []int`", correct: false}
    answer: "`s[a:b:b]` fixe la capacité à la longueur : le prochain `append` réalloue ; `slices.Clone` copie. Une affectation ne copie que l'en-tête, et `copy` vers un slice nil ne copie rien : il s'arrête à la plus petite longueur."
  - key: deux-append
    format: course
    question: Pourquoi `a := append(base, 1)` puis `b := append(base, 2)` est-il dangereux ?
    choices:
      - {text: "Si `base` a de la capacité, les deux écrivent au même endroit : `a` voit le 2", correct: true}
      - {text: "Le second `append` panique, car `base` a déjà été étendu par le premier", correct: false}
      - {text: "`base` grandit de deux éléments, et finit par contenir 1 puis 2", correct: false}
      - {text: "Chaque `append` copie `base` : on alloue deux tableaux pour rien", correct: false}
    answer: "`append` ne change pas la longueur de `base` : si la capacité suffit, les deux écrivent dans la même case du tableau partagé, et `a[len(base)]` vaut 2. Si `base` est plein, chacun réalloue et le piège disparaît : un bug intermittent."
  - key: vf-ecrase
    format: true-false
    question: Un `append` sur un sous-slice peut modifier les éléments de l'original situés après lui.
    truth: true
    answer: Quand il reste de la capacité, il écrit dans le tableau partagé.
  - key: vf-clone
    format: true-false
    question: '`slices.Clone(s)` renvoie un slice qui ne partage pas le tableau de `s`.'
    truth: true
    answer: Il copie les éléments dans un nouveau tableau.
  - key: vf-toujours-sur
    format: true-false
    question: Un sous-slice est toujours sûr à étendre, puisqu'append réalloue.
    truth: false
    answer: Append ne réalloue que si la capacité manque ; sinon il écrit en place.
  - key: vf-fuite
    format: true-false
    question: Garder un sous-slice de 10 octets d'un tampon de 100 Mo garde les 100 Mo en mémoire.
    truth: true
    answer: Le sous-slice pointe sur le tableau entier, que le GC ne peut pas libérer.
  - key: qcm-resultat
    format: multiple-choice
    question: Que vaut `s` après `s := []int{1, 2, 3, 4}; t := s[:2]; t = append(t, 99)` ?
    choices:
      - text: '`[1 2 99 4]`'
        correct: true
      - text: '`[1 2 3 4]`'
        correct: false
      - text: '`[1 2 99 3 4]`'
        correct: false
      - text: '`[1 2]`'
        correct: false
    answer: '`t` avait une capacité de 4 : append a écrit dans `s[2]`.'
  - key: qcm-isoler
    format: multiple-choice
    question: "Laquelle de ces écritures donne un slice indépendant de `s` ?"
    choices:
      - {text: "`slices.Clone(s)`", correct: true}
      - {text: "`s[:]`", correct: false}
      - {text: "`t := s`", correct: false}
      - {text: "`s[:len(s):len(s)]`", correct: false}
    answer: "`slices.Clone` copie les éléments dans un nouveau tableau (comme `append([]int(nil), s...)`). Découper ou affecter ne copie que l'en-tête ; limiter la capacité protège des `append`, mais les éléments restent partagés."
  - key: qcm-capacite
    format: multiple-choice
    question: "Avec `s` de longueur 5, que donne `t := s[1:3:3]` ?"
    choices:
      - {text: "Un slice des éléments 1 et 2, de capacité 2", correct: true}
      - {text: "Une copie indépendante des éléments 1 et 2", correct: false}
      - {text: "Un slice des éléments 1 et 2, de capacité 3", correct: false}
      - {text: "Un slice des éléments 1 à 3, de capacité 3", correct: false}
    answer: "La borne haute est exclue (éléments 1 et 2), et la capacité vaut `max - bas` = 3 - 1 = 2 : le prochain `append` réallouera au lieu d'écraser `s[3]`. Les deux éléments restent partagés avec `s`."
  - key: qcm-fuite
    format: multiple-choice
    question: Comment garder l'en-tête de 64 octets d'un fichier de 1 Go lu en mémoire sans garder tout le fichier ?
    choices:
      - text: '`entete := bytes.Clone(donnees[:64])`'
        correct: true
      - text: '`entete := donnees[:64]`'
        correct: false
      - text: '`entete := donnees[:64:64]`'
        correct: false
      - text: Appeler `runtime.GC()`
        correct: false
    answer: Limiter la capacité ne libère rien ; seule une copie détache l'en-tête du gros tableau.
  - key: code-deux-append
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      base := make([]int, 0, 5)
      a := append(base, 1)
      b := append(base, 2)
      fmt.Println(a[0], b[0])
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: "`2 2` : `base` a une capacité de 5, les deux `append` écrivent à l'indice 0 du même tableau, et le second écrase le 1."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tbase := make([]int, 0, 5)\n\ta := append(base, 1)\n\tb := append(base, 2)\n\tfmt.Println(a[0], b[0])\n}\n"
      output: 2 2
  - key: code-capacite-limitee
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{1, 2, 3, 4}
      t := s[:2:2]
      t = append(t, 99)
      fmt.Println(s, t)
      ```
    choices:
      - {text: "`[1 2 3 4] [1 2 99]`", correct: true}
      - {text: "`[1 2 99 4] [1 2 99]`", correct: false}
      - {text: "`[1 2 3 4] [1 2]`", correct: false}
      - {text: "`[1 2 3 4] [1 2 3 99]`", correct: false}
    answer: "`t` a une capacité de 2 : `append` réalloue un nouveau tableau, et `s` garde son 3. Sans le troisième indice, il aurait écrasé `s[2]`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4}\n\tt := s[:2:2]\n\tt = append(t, 99)\n\tfmt.Println(s, t)\n}\n"
      output: '[1 2 3 4] [1 2 99]'
  - key: bug-ecrase
    format: bug-fix
    question: |-
      Ajouter une option à la commande de test modifie aussi la commande de build. Quelle correction est la bonne ?
      ```go
      base := []string{"go", "build", "-v", "./..."}
      args := base[:2]
      args = append(args, "-race")
      ```
    choices:
      - {text: "Copier avant d'ajouter : `args := slices.Clone(base[:2])`, ou découper `base[:2:2]`", correct: true}
      - {text: "Écrire `args = append(args[:], \"-race\")`, qui travaille sur une copie de `args`", correct: false}
      - {text: "Déclarer `args` avec `var args []string` avant de l'affecter, pour qu'il ait son tableau", correct: false}
      - {text: "Remplacer `base[:2]` par `base[0:2]`, qui crée un nouveau tableau de deux éléments", correct: false}
    answer: |-
      ```go
      args := slices.Clone(base[:2])
      args = append(args, "-race")
      // ou : args := base[:2:2]
      ```
      `args` partageait le tableau de `base` : append écrivait par-dessus `-v`. `args[:]` et `base[0:2]` ne copient que l'en-tête.
  - key: bug-deux-variantes
    format: bug-fix
    question: |-
      Les deux chemins construits à partir du même préfixe finissent identiques. Pourquoi ?
      ```go
      prefixe := make([]string, 0, 10)
      prefixe = append(prefixe, "api", "v1")
      clients := append(prefixe, "clients")
      commandes := append(prefixe, "commandes")
      ```
    choices:
      - {text: "Les deux `append` écrivent dans la même case libre du tableau de `prefixe`", correct: true}
      - {text: "`append` de plusieurs valeurs ne garde que la dernière, et perd `\"api\"`", correct: false}
      - {text: "La capacité de 10 est dépassée, et Go réutilise le dernier tableau alloué", correct: false}
      - {text: "Le compilateur fusionne deux `append` sur le même slice en un seul appel", correct: false}
    answer: |-
      ```go
      clients := append(prefixe[:len(prefixe):len(prefixe)], "clients")
      commandes := append(prefixe[:len(prefixe):len(prefixe)], "commandes")
      // ou des copies avec slices.Clone(prefixe)
      ```
      Les deux append écrivaient dans la même case libre du tableau partagé. `prefixe` a une longueur 2 et une capacité 10 : les deux écrivent à l'indice 2, et le second écrase le premier.
  - key: bug-fuite
    format: bug-fix
    question: |-
      La mémoire du cache grandit sans cesse alors qu'on n'y garde que les identifiants. Quelle correction est la bonne ?
      ```go
      func identifiant(ligne []byte) []byte {
      	return ligne[:16]
      }
      cache[cle] = identifiant(ligneLue) // ligneLue fait plusieurs Ko
      ```
    choices:
      - {text: "Renvoyer `bytes.Clone(ligne[:16])`, une copie qui ne retient que 16 octets", correct: true}
      - {text: "Renvoyer `ligne[:16:16]`, pour limiter la capacité du résultat à 16 octets", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque insertion, pour libérer les lignes lues", correct: false}
      - {text: "Renvoyer `ligne[0:16]`, qui ne garde que ces octets et libère le reste", correct: false}
    answer: |-
      ```go
      func identifiant(ligne []byte) []byte {
      	return bytes.Clone(ligne[:16])
      }
      ```
      Le sous-slice gardait vivant tout le tableau de la ligne ; une copie ne retient que 16 octets. Limiter la capacité n'y change rien : le tableau de la ligne reste référencé.
  - key: bug-retour-interne
    format: bug-fix
    question: |-
      Un appelant qui ajoute un élément à la liste renvoyée corrompt les données internes du type. Quelle correction est la bonne ?
      ```go
      func (r *Registre) Premiers(n int) []Entree {
      	return r.entrees[:n]
      }
      ```
    choices:
      - {text: "Renvoyer `slices.Clone(r.entrees[:n])`, une copie que l'appelant peut étendre", correct: true}
      - {text: "Passer le receveur par valeur, `(r Registre)`, pour que la méthode lise une copie", correct: false}
      - {text: "Renvoyer un pointeur `*[]Entree` vers `r.entrees`, pour que l'appelant voie l'original", correct: false}
      - {text: "Renvoyer `r.entrees[0:n]` plutôt que `r.entrees[:n]`, qui crée un nouveau tableau", correct: false}
    answer: |-
      ```go
      func (r *Registre) Premiers(n int) []Entree {
      	return slices.Clone(r.entrees[:n])
      }
      ```
      Le slice renvoyé partageait le tableau interne : un `append` de l'appelant écrasait l'entrée n. Une copie protège
      l'invariant (ou au minimum `r.entrees[:n:n]`). Un receveur par valeur copie la struct, pas le tableau du slice.
  - key: scenario-api
    format: scenario
    question: Tu exposes une méthode qui renvoie une partie d'un slice interne. Comment choisis-tu entre renvoyer une vue et renvoyer une copie ?
    choices:
      - {text: "Une copie par défaut ; une vue à capacité limitée, documentée, si le coût compte", correct: true}
      - {text: "Toujours la vue `s[a:b]` : en Go, copier un slice est une mauvaise pratique", correct: false}
      - {text: "Toujours un pointeur vers le slice interne, pour n'allouer jamais rien", correct: false}
      - {text: "La vue `s[a:b]`, car l'appelant ne peut pas modifier un slice qu'on lui renvoie", correct: false}
    answer: "Une copie (`slices.Clone`) laisse l'appelant modifier ou étendre le résultat sans toucher l'état interne. Si la copie coûte trop (chemin chaud, gros volumes), une vue à capacité limitée (`s[a:b:b]`) documentée en lecture seule, ou un itérateur (`iter.Seq`) qui ne donne aucun accès au tableau."
  - key: scenario-test
    format: scenario
    question: Comment détecterais-tu dans un test qu'une fonction modifie par erreur le slice qu'on lui passe ?
    choices:
      - {text: "Je garde `slices.Clone` de l'entrée, j'appelle, puis je compare avec `slices.Equal`", correct: true}
      - {text: "Je compare l'entrée avant et après l'appel avec `==`, qui compare les éléments", correct: false}
      - {text: "Je passe un slice nil : si la fonction tente de le modifier, elle panique", correct: false}
      - {text: "Je compare `&entree[0]` avant et après : une modification change cette adresse", correct: false}
    answer: "Une copie gardée avant l'appel, puis `slices.Equal(entree, avant)` ; pour les effets de bord par `append`, une entrée avec de la capacité en réserve (`make([]int, 3, 10)`) et une vérification de `entree[:cap(entree)]`. Deux slices ne se comparent pas avec `==`, et une écriture ne change pas l'adresse des éléments."
