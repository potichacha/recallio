notion: strings-builder
lesson: "Une chaîne étant immuable, `s += x` dans une boucle **crée une nouvelle chaîne à chaque tour** et recopie tout : le\ncoût est quadratique.\n\nPour construire une chaîne par morceaux, on utilise **`strings.Builder`** :\n\n```go\nvar b strings.Builder   // valeur zéro utilisable\nb.Grow(64)              // facultatif : réserver de la place\nfor i, nom := range noms {\n\tif i > 0 {\n\t\tb.WriteString(\", \")\n\t}\n\tb.WriteString(nom)\n}\nb.WriteByte('.')\nfmt.Fprintf(&b, \" (%d noms)\", len(noms)) // Builder est un io.Writer\nresultat := b.String()                   // sans copie\n```\n\n- `WriteString`, `WriteByte`, `WriteRune`, `Write` ; `Len()` donne la taille courante.\n- `String()` renvoie la chaîne **sans copier** le tampon.\n- Un `Builder` **ne doit pas être copié** après usage (il panique) : on le passe par pointeur.\n- **`bytes.Buffer`** est l'équivalent pour des octets, qui sait aussi être **lu** (`io.Reader`) ; on le choisit quand\n  on manipule des `[]byte` ou qu'on enchaîne écriture et lecture.\n- Pour joindre un slice : **`strings.Join(noms, \", \")`**, le plus simple.\n\nQuelques concaténations isolées (`a + \" \" + b`) sont parfaitement acceptables : le compilateur les optimise.\n\n**Piège classique** : un rapport de 100 000 lignes construit avec `rapport += ligne + \"\\n\"`. Le temps explose ; un\n`strings.Builder` le rend linéaire.\n\n**En entretien** : « += en boucle recopie tout, c'est quadratique ; strings.Builder (ou strings.Join) pour construire,\nbytes.Buffer pour des octets qu'on relit. »"
tour:
  - title: Construire une chaîne
    text: |-
      Comme une chaîne est immuable, `s += x` dans une boucle crée une nouvelle chaîne à chaque tour, et recopie tout.
      Pour construire une longue chaîne, on utilise `strings.Builder` : il accumule les morceaux dans un tampon, et
      `String()` rend le résultat.

      Sa valeur zéro est prête à servir. `fmt.Fprintf(&b, …)` écrit dedans avec un format, car un `Builder` est un
      `io.Writer`. `bytes.Buffer` joue le même rôle pour des octets.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	var b strings.Builder
          	for i := 1; i <= 3; i++ {
          		fmt.Fprintf(&b, "ligne %d;", i)
          	}
          	b.WriteString("fin")
          	fmt.Println(b.String())
          	fmt.Println(b.Len())
          }
      output: |-
        ligne 1;ligne 2;ligne 3;fin
        27
cards:
  - key: concatener-efficacement-boucle
    format: course
    question: Comment concaténer efficacement en boucle ?
    answer: strings.Builder.
  - key: quadratique
    format: course
    question: Pourquoi `s += x` dans une grande boucle est-il lent ?
    answer: 'Chaque concaténation crée une nouvelle chaîne et recopie tout le contenu précédent : le coût total est quadratique.'
  - key: buffer
    format: course
    question: Quand préférer `bytes.Buffer` à `strings.Builder` ?
    answer: Quand on manipule des octets, ou qu'on veut aussi lire le contenu (`bytes.Buffer` est un `io.Reader`) ; pour produire une chaîne, `strings.Builder`.
  - key: copie
    format: course
    question: Peut-on copier un `strings.Builder` déjà utilisé ?
    answer: 'Non : il détecte la copie et panique ; on le passe par pointeur.'
  - key: vf-zero
    format: true-false
    question: '`var b strings.Builder` est utilisable sans initialisation.'
    truth: true
    answer: Sa valeur zéro est un tampon vide.
  - key: vf-string-copie
    format: true-false
    question: '`b.String()` copie tout le tampon dans une nouvelle chaîne.'
    truth: false
    answer: '`strings.Builder.String` renvoie la chaîne sans copie.'
  - key: vf-writer
    format: true-false
    question: On peut écrire dans un `strings.Builder` avec `fmt.Fprintf(&b, ...)`.
    truth: true
    answer: '`*strings.Builder` implémente `io.Writer`.'
  - key: vf-petites
    format: true-false
    question: Toute concaténation avec `+` est à proscrire.
    truth: false
    answer: Quelques concaténations isolées sont lisibles et efficaces ; le problème est la boucle.
  - key: qcm-efficace
    format: multiple-choice
    question: Comment construire efficacement une chaîne de 10 000 morceaux ?
    choices:
      - text: '`strings.Builder` et `WriteString`'
        correct: true
      - text: '`strings.Join(morceaux, "")` si l''on a déjà un slice'
        correct: true
      - text: '`s += morceau` dans la boucle'
        correct: false
      - text: '`fmt.Sprintf("%s%s", s, morceau)` dans la boucle'
        correct: false
    answer: Les deux dernières recopient tout à chaque tour.
  - key: qcm-methodes
    format: multiple-choice
    question: Quelles méthodes possède `strings.Builder` ?
    choices:
      - text: '`WriteString` et `WriteRune`'
        correct: true
      - text: '`Grow` et `Len`'
        correct: true
      - text: '`Append`'
        correct: false
      - text: '`ReadString`'
        correct: false
    answer: '`ReadString` est sur `bytes.Buffer` et `bufio.Reader`, pas sur `Builder`.'
  - key: qcm-join
    format: multiple-choice
    question: Que donne `strings.Join([]string{"a", "b", "c"}, "-")` ?
    choices:
      - text: '`a-b-c`'
        correct: true
      - text: '`a-b-c-`'
        correct: false
      - text: '`-a-b-c`'
        correct: false
      - text: '`abc`'
        correct: false
    answer: Le séparateur va seulement entre les éléments.
  - key: qcm-grow
    format: multiple-choice
    question: À quoi sert `b.Grow(n)` ?
    choices:
      - text: À réserver au moins n octets de plus, pour éviter des réallocations
        correct: true
      - text: À limiter la taille du tampon à n
        correct: false
      - text: À remplir le tampon de n espaces
        correct: false
      - text: À vider le tampon
        correct: false
    answer: Comme la capacité d'un slice ; utile quand on connaît la taille finale.
  - key: trous-write
    format: fill-in
    question: "Complétez la construction :\n```go\nvar b strings.Builder\nfor _, l := range lignes {\n\tb.___(l)\n\tb.WriteByte('\\n')\n}\n```"
    blanks:
      - - WriteString
    answer: '`WriteString` ajoute une chaîne.'
  - key: trous-string
    format: fill-in
    question: |-
      Complétez pour obtenir le résultat :
      ```go
      texte := b.___()
      ```
    blanks:
      - - String
    answer: '`String()` renvoie le contenu, sans copie.'
  - key: trous-join
    format: fill-in
    question: |-
      Complétez pour joindre les noms :
      ```go
      liste := strings.___(noms, ", ")
      ```
    blanks:
      - - Join
    answer: '`strings.Join` est la solution la plus simple pour un slice.'
  - key: trous-fprintf
    format: fill-in
    question: |-
      Complétez pour écrire un texte formaté dans le builder :
      ```go
      fmt.___(&b, "%d articles\n", n)
      ```
    blanks:
      - - Fprintf
    answer: '`Fprintf` écrit dans un `io.Writer`.'
  - key: code-builder
    format: code-output
    question: "```go\nvar b strings.Builder\nfor i, n := range []string{\"ada\", \"bob\", \"eve\"} {\n\tif i > 0 {\n\t\tb.WriteString(\", \")\n\t}\n\tb.WriteString(n)\n}\nfmt.Fprintf(&b, \" (%d)\", 3)\nfmt.Println(b.String(), b.Len())\n```"
    answer: '`ada, bob, eve (3) 17`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar b strings.Builder\n\tfor i, n := range []string{\"ada\", \"bob\", \"eve\"} {\n\t\tif i > 0 {\n\t\t\tb.WriteString(\", \")\n\t\t}\n\t\tb.WriteString(n)\n\t}\n\tfmt.Fprintf(&b, \" (%d)\", 3)\n\tfmt.Println(b.String(), b.Len())\n}\n"
      output: ada, bob, eve (3) 17
  - key: code-buffer
    format: code-output
    question: |-
      ```go
      var buf bytes.Buffer
      buf.WriteString("ligne1\nligne2\n")
      premiere, _ := buf.ReadString('\n')
      fmt.Printf("%q %q\n", premiere, buf.String())
      ```
    answer: '`"ligne1\n" "ligne2\n"` : un `bytes.Buffer` se lit aussi, et la lecture consomme.'
    check:
      code: "package main\n\nimport (\n\t\"bytes\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar buf bytes.Buffer\n\tbuf.WriteString(\"ligne1\\nligne2\\n\")\n\tpremiere, _ := buf.ReadString('\\n')\n\tfmt.Printf(\"%q %q\\n\", premiere, buf.String())\n}\n"
      output: '"ligne1\n" "ligne2\n"'
  - key: code-join
    format: code-output
    question: |-
      ```go
      fmt.Println(strings.Join([]string{"a", "b", "c"}, "-"), strings.Join(nil, "-") == "")
      ```
    answer: '`a-b-c true` : joindre un slice vide donne une chaîne vide.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Join([]string{\"a\", \"b\", \"c\"}, \"-\"), strings.Join(nil, \"-\") == \"\")\n}\n"
      output: a-b-c true
  - key: code-copie-panique
    format: code-output
    question: |-
      ```go
      var a strings.Builder
      a.WriteString("x")
      b := a
      fmt.Println(b.Len())
      b.WriteString("y")
      ```
    answer: '`1`, puis une panique : un `Builder` copié après usage refuse d''écrire.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar a strings.Builder\n\ta.WriteString(\"x\")\n\tb := a\n\tfmt.Println(b.Len())\n\tb.WriteString(\"y\")\n}\n"
      output: '1'
      panics: illegal use of non-zero Builder copied by value
  - key: bug-quadratique
    format: bug-fix
    question: "L'export CSV de 200 000 lignes prend plusieurs minutes :\n```go\ncsv := \"\"\nfor _, l := range lignes {\n\tcsv += l.Nom + \";\" + l.Ville + \"\\n\"\n}\n```"
    answer: "```go\nvar b strings.Builder\nfor _, l := range lignes {\n\tb.WriteString(l.Nom)\n\tb.WriteByte(';')\n\tb.WriteString(l.Ville)\n\tb.WriteByte('\\n')\n}\ncsv := b.String()\n```\nChaque `+=` recopiait tout le texte déjà produit ; le Builder écrit en temps linéaire. (Pour du vrai CSV,\n`encoding/csv` gère aussi l'échappement.)"
  - key: bug-separateur
    format: bug-fix
    question: "La liste affichée finit par une virgule en trop :\n```go\nvar b strings.Builder\nfor _, t := range tags {\n\tb.WriteString(t + \", \")\n}\n```"
    answer: |-
      ```go
      liste := strings.Join(tags, ", ")
      ```
      `strings.Join` place le séparateur seulement entre les éléments.
  - key: bug-copie
    format: bug-fix
    question: |-
      Une fonction d'aide panique avec « illegal use of non-zero Builder copied by value » :
      ```go
      func ajouterEntete(b strings.Builder) { b.WriteString("# Rapport\n") }
      ```
    answer: |-
      ```go
      func ajouterEntete(b *strings.Builder) { b.WriteString("# Rapport\n") }

      ajouterEntete(&b)
      ```
      Un Builder se passe par pointeur ; mieux encore, la fonction peut accepter un `io.Writer`.
  - key: bug-sprintf
    format: bug-fix
    question: "Le profileur montre beaucoup d'allocations dans cette boucle :\n```go\nfor _, m := range mesures {\n\tligne = fmt.Sprintf(\"%s%d;\", ligne, m)\n}\n```"
    answer: "```go\nvar b strings.Builder\nfor _, m := range mesures {\n\tb.WriteString(strconv.Itoa(m))\n\tb.WriteByte(';')\n}\nligne := b.String()\n```\n`Sprintf` recrée et recopie la chaîne à chaque tour ; `strconv` et un Builder évitent la réflexion et les copies."
