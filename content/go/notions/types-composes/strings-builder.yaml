notion: strings-builder
lesson: "Une chaîne étant immuable, `s += x` dans une boucle **crée une nouvelle chaîne à chaque tour** et recopie tout : le\ncoût est quadratique.\n\nPour construire une chaîne par morceaux, on utilise **`strings.Builder`** :\n\n```go\nvar b strings.Builder   // valeur zéro utilisable\nb.Grow(64)              // facultatif : réserver de la place\nfor i, nom := range noms {\n\tif i > 0 {\n\t\tb.WriteString(\", \")\n\t}\n\tb.WriteString(nom)\n}\nb.WriteByte('.')\nfmt.Fprintf(&b, \" (%d noms)\", len(noms)) // Builder est un io.Writer\nresultat := b.String()                   // sans copie\n```\n\n- `WriteString`, `WriteByte`, `WriteRune`, `Write` ; `Len()` donne la taille courante.\n- `String()` renvoie la chaîne **sans copier** le tampon.\n- Un `Builder` **ne doit pas être copié** après usage (il panique) : on le passe par pointeur.\n- **`bytes.Buffer`** est l'équivalent pour des octets, qui sait aussi être **lu** (`io.Reader`) ; on le choisit quand\n  on manipule des `[]byte` ou qu'on enchaîne écriture et lecture.\n- Pour joindre un slice : **`strings.Join(noms, \", \")`**, le plus simple.\n\nQuelques concaténations isolées (`a + \" \" + b`) sont parfaitement acceptables : le compilateur les optimise.\n\n**Piège classique** : un rapport de 100 000 lignes construit avec `rapport += ligne + \"\\n\"`. Le temps explose ; un\n`strings.Builder` le rend linéaire.\n\n**En entretien** : « += en boucle recopie tout, c'est quadratique ; strings.Builder (ou strings.Join) pour construire,\nbytes.Buffer pour des octets qu'on relit. »"
tour:
  - title: Construire une chaîne
    text: |-
      Comme une chaîne est immuable, `s += x` dans une boucle crée une nouvelle chaîne à chaque tour, et recopie tout.
      Pour construire une longue chaîne, on utilise `strings.Builder` : il accumule les morceaux dans un tampon, et
      `String()` rend le résultat.

      Sa valeur zéro est prête à servir. `fmt.Fprintf(&b, …)` écrit dedans avec un format, car un `Builder` est un
      `io.Writer`. `bytes.Buffer` joue le même rôle pour des octets.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	var b strings.Builder
          	for i := 1; i <= 3; i++ {
          		fmt.Fprintf(&b, "ligne %d;", i)
          	}
          	b.WriteString("fin")
          	fmt.Println(b.String())
          	fmt.Println(b.Len())
          }
      output: |-
        ligne 1;ligne 2;ligne 3;fin
        27
cards:
  - key: concatener-efficacement-boucle
    format: course
    question: "Comment concaténer efficacement des chaînes dans une boucle ?"
    choices:
      - {text: "Avec un `strings.Builder` et sa méthode `WriteString`", correct: true}
      - {text: "Avec `s += morceau`, que le compilateur optimise", correct: false}
      - {text: "Avec `fmt.Sprintf(\"%s%s\", s, morceau)` à chaque tour", correct: false}
      - {text: "Avec `s = s + morceau`, plus rapide que `+=`", correct: false}
    answer: "`strings.Builder` accumule dans un tampon qui grandit comme un slice : le coût total est linéaire. `+=` ou `Sprintf` recréent et recopient la chaîne à chaque tour ; `strings.Join` convient si l'on a déjà un slice."
  - key: quadratique
    format: course
    question: Pourquoi `s += x` dans une grande boucle est-il lent ?
    choices:
      - {text: "Chaque `+=` crée une nouvelle chaîne et recopie tout le texte précédent", correct: true}
      - {text: "Chaque `+=` verrouille la chaîne contre les autres goroutines", correct: false}
      - {text: "Chaque `+=` revalide l'UTF-8 de toute la chaîne déjà construite", correct: false}
      - {text: "Chaque `+=` déclenche un passage complet du ramasse-miettes", correct: false}
    answer: "Une chaîne est immuable : chaque concaténation crée une nouvelle chaîne et recopie tout le contenu précédent, donc le coût total est quadratique. Un `strings.Builder` rend la construction linéaire."
  - key: buffer
    format: course
    question: Quand préférer `bytes.Buffer` à `strings.Builder` ?
    choices:
      - {text: "Pour des octets, ou s'il faut aussi relire le contenu, comme un `io.Reader`", correct: true}
      - {text: "Toujours : `strings.Builder` est déprécié depuis Go 1.20", correct: false}
      - {text: "Pour produire une chaîne, car `bytes.Buffer.String` ne copie rien", correct: false}
      - {text: "Quand plusieurs goroutines écrivent, car `bytes.Buffer` se verrouille", correct: false}
    answer: "`bytes.Buffer` convient aux octets et se lit aussi (`io.Reader`, `ReadString`) ; pour produire une chaîne, `strings.Builder` évite la copie finale de `String()`. Aucun des deux n'est sûr entre goroutines."
  - key: copie
    format: course
    question: Peut-on copier un `strings.Builder` déjà utilisé ?
    choices:
      - {text: "Non : il détecte la copie et panique à l'écriture ; on le passe par pointeur", correct: true}
      - {text: "Oui : la copie reçoit son propre tampon, indépendant de l'original", correct: false}
      - {text: "Oui, mais les deux copies écrivent ensuite dans le même tampon", correct: false}
      - {text: "Non : le compilateur refuse toute copie d'un `strings.Builder`", correct: false}
    answer: "Non : un `Builder` utilisé garde un pointeur vers lui-même, et la copie panique à la première écriture (« illegal use of non-zero Builder copied by value »). Le compilateur accepte la copie ; on passe un `*strings.Builder` ou un `io.Writer`."
  - key: vf-zero
    format: true-false
    question: '`var b strings.Builder` est utilisable sans initialisation.'
    truth: true
    answer: Sa valeur zéro est un tampon vide.
  - key: vf-string-copie
    format: true-false
    question: '`b.String()` copie tout le tampon dans une nouvelle chaîne.'
    truth: false
    answer: '`strings.Builder.String` renvoie la chaîne sans copie.'
  - key: vf-writer
    format: true-false
    question: On peut écrire dans un `strings.Builder` avec `fmt.Fprintf(&b, ...)`.
    truth: true
    answer: '`*strings.Builder` implémente `io.Writer`.'
  - key: vf-petites
    format: true-false
    question: Toute concaténation avec `+` est à proscrire.
    truth: false
    answer: Quelques concaténations isolées sont lisibles et efficaces ; le problème est la boucle.
  - key: qcm-efficace
    format: multiple-choice
    question: "Quelles façons de construire une chaîne de 10 000 morceaux sont efficaces ?"
    choices:
      - text: '`strings.Builder` et `WriteString`'
        correct: true
      - text: '`strings.Join(morceaux, "")` si l''on a déjà un slice'
        correct: true
      - text: '`s += morceau` dans la boucle'
        correct: false
      - text: '`fmt.Sprintf("%s%s", s, morceau)` dans la boucle'
        correct: false
    answer: Les deux dernières recopient tout à chaque tour.
  - key: qcm-methodes
    format: multiple-choice
    question: "Laquelle de ces méthodes possède `strings.Builder` ?"
    choices:
      - {text: "`WriteRune`", correct: true}
      - {text: "`ReadString`", correct: false}
      - {text: "`Append`", correct: false}
      - {text: "`Insert`", correct: false}
    answer: "`strings.Builder` écrit (`WriteString`, `WriteRune`, `WriteByte`), mesure (`Len`, `Cap`), réserve (`Grow`) et rend le résultat (`String`). `ReadString` est sur `bytes.Buffer` et `bufio.Reader` ; il n'y a ni `Append` ni `Insert`."
  - key: qcm-join
    format: multiple-choice
    question: Que donne `strings.Join([]string{"a", "b", "c"}, "-")` ?
    choices:
      - text: '`a-b-c`'
        correct: true
      - text: '`a-b-c-`'
        correct: false
      - text: '`-a-b-c`'
        correct: false
      - text: '`abc`'
        correct: false
    answer: Le séparateur va seulement entre les éléments.
  - key: qcm-grow
    format: multiple-choice
    question: À quoi sert `b.Grow(n)` ?
    choices:
      - {text: "À réserver au moins n octets de plus, pour éviter des réallocations", correct: true}
      - {text: "À limiter la taille du tampon à n octets, au-delà il panique", correct: false}
      - {text: "À remplir le tampon de n espaces, écrasés ensuite", correct: false}
      - {text: "À vider le tampon, puis à lui donner une capacité de n", correct: false}
    answer: Comme la capacité d'un slice ; utile quand on connaît la taille finale.
  - key: trous-write
    format: fill-in
    question: |-
      Complète la construction :
      ```go
      var b strings.Builder
      for _, l := range lignes {
      	b.___(l)
      	b.WriteByte('\n')
      }
      ```
    blanks:
      - - WriteString
    answer: '`WriteString` ajoute une chaîne.'
  - key: trous-string
    format: fill-in
    question: |-
      Complète pour obtenir le résultat :
      ```go
      texte := b.___()
      ```
    blanks:
      - - String
    answer: '`String()` renvoie le contenu, sans copie.'
  - key: trous-join
    format: fill-in
    question: |-
      Complète pour joindre les noms :
      ```go
      liste := strings.___(noms, ", ")
      ```
    blanks:
      - - Join
    answer: '`strings.Join` est la solution la plus simple pour un slice.'
  - key: trous-fprintf
    format: fill-in
    question: |-
      Complète pour écrire un texte formaté dans le builder :
      ```go
      fmt.___(&b, "%d articles\n", n)
      ```
    blanks:
      - - Fprintf
    answer: '`Fprintf` écrit dans un `io.Writer`.'
  - key: code-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var b strings.Builder
      for i, n := range []string{"ada", "bob", "eve"} {
      	if i > 0 {
      		b.WriteString(", ")
      	}
      	b.WriteString(n)
      }
      fmt.Fprintf(&b, " (%d)", 3)
      fmt.Println(b.String(), b.Len())
      ```
    choices:
      - {text: "`ada, bob, eve (3) 17`", correct: true}
      - {text: "`ada, bob, eve, (3) 18`", correct: false}
      - {text: "`ada, bob, eve (3) 13`", correct: false}
      - {text: "`ada bob eve (3) 15`", correct: false}
    answer: "La virgule ne s'écrit qu'à partir du deuxième nom, puis `Fprintf` ajoute « (3) » dans le Builder : 17 octets en tout, que `Len` compte."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar b strings.Builder\n\tfor i, n := range []string{\"ada\", \"bob\", \"eve\"} {\n\t\tif i > 0 {\n\t\t\tb.WriteString(\", \")\n\t\t}\n\t\tb.WriteString(n)\n\t}\n\tfmt.Fprintf(&b, \" (%d)\", 3)\n\tfmt.Println(b.String(), b.Len())\n}\n"
      output: ada, bob, eve (3) 17
  - key: code-buffer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var buf bytes.Buffer
      buf.WriteString("ligne1\nligne2\n")
      premiere, _ := buf.ReadString('\n')
      fmt.Printf("%q %q\n", premiere, buf.String())
      ```
    choices:
      - {text: "`\"ligne1\\n\" \"ligne2\\n\"`", correct: true}
      - {text: "`\"ligne1\\n\" \"ligne1\\nligne2\\n\"`", correct: false}
      - {text: "`\"ligne1\" \"ligne2\\n\"`", correct: false}
      - {text: "`\"ligne1\\n\" \"\"`", correct: false}
    answer: "`ReadString` lit jusqu'au délimiteur compris, et la lecture consomme : `String()` ne rend plus que la partie non lue. Un `bytes.Buffer` s'écrit et se lit."
    check:
      code: "package main\n\nimport (\n\t\"bytes\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar buf bytes.Buffer\n\tbuf.WriteString(\"ligne1\\nligne2\\n\")\n\tpremiere, _ := buf.ReadString('\\n')\n\tfmt.Printf(\"%q %q\\n\", premiere, buf.String())\n}\n"
      output: '"ligne1\n" "ligne2\n"'
  - key: code-join
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(strings.Join([]string{"a", "b", "c"}, "-"), strings.Join(nil, "-") == "")
      ```
    choices:
      - {text: "`a-b-c true`", correct: true}
      - {text: "`a-b-c- true`", correct: false}
      - {text: "`a-b-c false`", correct: false}
      - {text: "`-a-b-c true`", correct: false}
    answer: "`a-b-c true` : `strings.Join` place le séparateur entre les éléments seulement, et joindre un slice vide (même nil) donne une chaîne vide."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Join([]string{\"a\", \"b\", \"c\"}, \"-\"), strings.Join(nil, \"-\") == \"\")\n}\n"
      output: a-b-c true
  - key: code-copie-panique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a strings.Builder
      a.WriteString("x")
      b := a
      fmt.Println(b.Len())
      b.WriteString("y")
      ```
    choices:
      - {text: "`1`, puis une panic : illegal use of non-zero Builder copied by value", correct: true}
      - {text: "Ça ne compile pas : un `strings.Builder` ne se copie pas", correct: false}
      - {text: "`1`, puis `b` vaut `xy` et `a` vaut `x`, sans erreur", correct: false}
      - {text: "`0`, puis une panic, car la copie a perdu le contenu de `a`", correct: false}
    answer: "La copie garde le contenu (`Len` vaut 1), mais un `Builder` déjà utilisé et copié refuse d'écrire : il panique. On passe un `Builder` par pointeur."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar a strings.Builder\n\ta.WriteString(\"x\")\n\tb := a\n\tfmt.Println(b.Len())\n\tb.WriteString(\"y\")\n}\n"
      output: '1'
      panics: illegal use of non-zero Builder copied by value
  - key: bug-quadratique
    format: bug-fix
    question: |-
      L'export CSV de 200 000 lignes prend plusieurs minutes. Quelle correction est la bonne ?
      ```go
      csv := ""
      for _, l := range lignes {
      	csv += l.Nom + ";" + l.Ville + "\n"
      }
      ```
    choices:
      - {text: "Écrire dans un `strings.Builder`, puis appeler `String()` à la fin", correct: true}
      - {text: "Remplacer `csv +=` par `csv = csv + ...`, plus rapide", correct: false}
      - {text: "Construire chaque ligne avec `fmt.Sprintf`, puis l'ajouter par `+=`", correct: false}
      - {text: "Préallouer la chaîne avec `csv := strings.Repeat(\" \", n)`", correct: false}
    answer: "```go\nvar b strings.Builder\nfor _, l := range lignes {\n\tb.WriteString(l.Nom)\n\tb.WriteByte(';')\n\tb.WriteString(l.Ville)\n\tb.WriteByte('\\n')\n}\ncsv := b.String()\n```\nChaque `+=` recopiait tout le texte déjà produit ; le Builder écrit en temps linéaire. (Pour du vrai CSV,\n`encoding/csv` gère aussi l'échappement.)"
  - key: bug-separateur
    format: bug-fix
    question: |-
      La liste affichée finit par une virgule en trop. Quelle correction est la bonne ?
      ```go
      var b strings.Builder
      for _, t := range tags {
      	b.WriteString(t + ", ")
      }
      ```
    choices:
      - {text: "`strings.Join(tags, \", \")`, qui sépare les éléments sans rien ajouter à la fin", correct: true}
      - {text: "`b.WriteString(t + \",\")`, sans l'espace qui suit la virgule", correct: false}
      - {text: "Un appel à `b.Reset()` après le dernier tag, pour effacer la virgule", correct: false}
      - {text: "Un Builder préalloué avec `b.Grow(len(tags))`, qui s'arrête au bon endroit", correct: false}
    answer: |-
      ```go
      liste := strings.Join(tags, ", ")
      ```
      `strings.Join` place le séparateur seulement entre les éléments.
  - key: bug-copie
    format: bug-fix
    question: |-
      Une fonction d'aide panique avec « illegal use of non-zero Builder copied by value ». Quelle correction est la bonne ?
      ```go
      func ajouterEntete(b strings.Builder) { b.WriteString("# Rapport\n") }
      ```
    choices:
      - {text: "Recevoir un `*strings.Builder` (ou un `io.Writer`) et passer `&b`", correct: true}
      - {text: "Appeler `b.Reset()` au début de la fonction d'aide", correct: false}
      - {text: "Recevoir le Builder par valeur et renvoyer la copie modifiée", correct: false}
      - {text: "Créer un Builder neuf dans la fonction, puis y copier `b`", correct: false}
    answer: |-
      ```go
      func ajouterEntete(b *strings.Builder) { b.WriteString("# Rapport\n") }

      ajouterEntete(&b)
      ```
      Un Builder se passe par pointeur ; mieux encore, la fonction peut accepter un `io.Writer`. `Reset` éviterait la panique, mais l'en-tête serait écrit dans une copie perdue.
  - key: bug-sprintf
    format: bug-fix
    question: |-
      Le profileur montre beaucoup d'allocations dans cette boucle. Quelle correction est la bonne ?
      ```go
      for _, m := range mesures {
      	ligne = fmt.Sprintf("%s%d;", ligne, m)
      }
      ```
    choices:
      - {text: "Un `strings.Builder`, avec `strconv.Itoa` pour chaque mesure", correct: true}
      - {text: "`ligne = fmt.Sprint(ligne, m, \";\")` au lieu de `Sprintf`", correct: false}
      - {text: "`ligne += fmt.Sprintf(\"%d;\", m)`, qui ne formate que la mesure", correct: false}
      - {text: "`fmt.Sprintf` avec `%v` plutôt que `%s%d`, plus rapide", correct: false}
    answer: |-
      ```go
      var b strings.Builder
      for _, m := range mesures {
      	b.WriteString(strconv.Itoa(m))
      	b.WriteByte(';')
      }
      ligne := b.String()
      ```
      `Sprintf` recrée et recopie la chaîne à chaque tour ; `strconv` et un Builder évitent la réflexion et les copies. `+=` recopierait encore toute la ligne à chaque tour.
