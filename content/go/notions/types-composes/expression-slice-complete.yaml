notion: expression-slice-complete
lesson: |-
  L'**expression de slice complète** `s[bas:haut:max]` découpe comme `s[bas:haut]`, mais fixe aussi la **capacité** du
  résultat à `max - bas`.

  ```go
  s := []int{1, 2, 3, 4, 5}
  t := s[1:3]    // [2 3], len 2, cap 4 (jusqu'à la fin de s)
  u := s[1:3:3]  // [2 3], len 2, cap 2
  u = append(u, 99) // capacité épuisée : nouveau tableau, s est intact
  ```

  Contraintes : `0 <= bas <= haut <= max <= cap(s)`. Elle s'applique aux slices et aux tableaux, **pas aux chaînes**.

  Usage : renvoyer une **vue** sur des données internes, ou passer un sous-slice à du code qui fera `append`, sans risque
  qu'il écrase les éléments suivants. Le premier `append` sur le résultat réalloue forcément.

  Ce n'est **pas** une copie : les éléments existants restent partagés, et une écriture `u[0] = 7` modifie toujours
  `s[1]`. Ce n'est pas non plus un moyen de libérer la mémoire du grand tableau.

  **Piège classique** : croire que `s[a:b:b]` isole complètement le sous-slice. Il protège seulement des `append` ; pour
  des modifications d'éléments, il faut une copie.

  **En entretien** : « s[a:b:c] limite la capacité à c-a ; le prochain append réalloue au lieu d'écraser ; les éléments
  restent partagés. »
cards:
  - key: sert-b
    format: course
    question: À quoi sert `s[a:b:c]` ?
    answer: Limiter la capacité du sous-slice pour qu'un append réalloue au lieu d'écraser les données suivantes.
  - key: code-sx-int-1-2-3
    format: code-output
    question: |-
      ```go
      sx := []int{1, 2, 3, 4, 5}
      sy := sx[1:3]
      fmt.Println(len(sy), cap(sy))
      sz := sx[1:3:3]
      sz = append(sz, 100)
      fmt.Println(sx, sz)
      ```
    answer: '`2 4`, puis `[1 2 3 4 5] [2 3 100]` : la capacité de `sz` est limitée à 2, donc `append` réalloue et `sx` n''est pas modifié.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsx := []int{1, 2, 3, 4, 5}\n\tsy := sx[1:3]\n\tfmt.Println(len(sy), cap(sy))\n\tsz := sx[1:3:3]\n\tsz = append(sz, 100)\n\tfmt.Println(sx, sz)\n}\n"
      output: |-
        2 4
        [1 2 3 4 5] [2 3 100]
  - key: capacite
    format: course
    question: Quelle capacité a `s[2:5:7]` ?
    answer: '`7 - 2 = 5` : la capacité vaut max moins bas.'
  - key: pas-copie
    format: course
    question: '`u := s[1:3:3]` protège-t-il `s` des écritures `u[0] = x` ?'
    answer: 'Non : les éléments existants restent partagés ; seule la capacité est limitée, ce qui protège des `append`.'
  - key: chaines
    format: course
    question: L'expression complète s'applique-t-elle aux chaînes ?
    answer: 'Non : seulement aux slices et aux tableaux ; une chaîne est immuable, la question de la capacité ne se pose pas.'
  - key: vf-append-realloue
    format: true-false
    question: Le premier append sur `s[a:b:b]` réalloue toujours.
    truth: true
    answer: Sa capacité est égale à sa longueur.
  - key: vf-max
    format: true-false
    question: Le troisième indice de `s[a:b:c]` peut dépasser `cap(s)`.
    truth: false
    answer: '`c` doit être au plus `cap(s)`, sinon c''est une panique (ou une erreur de compilation si constant).'
  - key: vf-copie
    format: true-false
    question: '`s[a:b:b]` crée une copie indépendante des éléments.'
    truth: false
    answer: C'est une vue sur le même tableau, à capacité limitée.
  - key: vf-memoire
    format: true-false
    question: Limiter la capacité d'un sous-slice permet au GC de libérer le reste du gros tableau.
    truth: false
    answer: Le sous-slice pointe toujours sur le tableau ; seule une copie le libère.
  - key: qcm-len-cap
    format: multiple-choice
    question: Avec `s := make([]int, 10)`, que valent len et cap de `s[2:4:6]` ?
    choices:
      - text: len 2, cap 4
        correct: true
      - text: len 2, cap 8
        correct: false
      - text: len 4, cap 6
        correct: false
      - text: len 2, cap 6
        correct: false
    answer: len = 4-2, cap = 6-2.
  - key: qcm-usage
    format: multiple-choice
    question: Dans quels cas l'expression complète est-elle utile ?
    choices:
      - text: Renvoyer une vue sur un slice interne que l'appelant pourrait étendre
        correct: true
      - text: Construire deux variantes d'un même préfixe avec append
        correct: true
      - text: Copier en profondeur un slice de slices
        correct: false
      - text: Découper une chaîne
        correct: false
    answer: Elle évite qu'un append écrive dans la capacité partagée.
  - key: qcm-invalide
    format: multiple-choice
    question: Avec `s := make([]int, 3, 5)`, quelles expressions paniquent ou ne compilent pas ?
    choices:
      - text: '`s[1:2:6]`'
        correct: true
      - text: '`s[2:1:3]`'
        correct: true
      - text: '`s[1:2:5]`'
        correct: false
      - text: '`s[0:3:3]`'
        correct: false
    answer: Il faut `bas <= haut <= max <= cap(s)`.
  - key: code-capacite
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3, 4, 5, 6}
      t := s[1:3:4]
      fmt.Println(t, len(t), cap(t))
      t = append(t, 10)
      t = append(t, 11)
      fmt.Println(s)
      ```
    answer: '`[2 3] 2 3`, puis `[1 2 3 10 5 6]` : le premier append écrit dans la capacité restante (s[3]), le second réalloue.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4, 5, 6}\n\tt := s[1:3:4]\n\tfmt.Println(t, len(t), cap(t))\n\tt = append(t, 10)\n\tt = append(t, 11)\n\tfmt.Println(s)\n}\n"
      output: |-
        [2 3] 2 3
        [1 2 3 10 5 6]
  - key: code-partage
    format: code-output
    question: |-
      ```go
      s := []int{1, 2, 3}
      u := s[0:2:2]
      u[0] = 9
      u = append(u, 7)
      u[1] = 8
      fmt.Println(s, u)
      ```
    answer: '`[9 2 3] [9 8 7]` : l''écriture avant l''append touche `s`, celle d''après non (nouveau tableau).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3}\n\tu := s[0:2:2]\n\tu[0] = 9\n\tu = append(u, 7)\n\tu[1] = 8\n\tfmt.Println(s, u)\n}\n"
      output: '[9 2 3] [9 8 7]'
  - key: code-chaine
    format: code-output
    question: |-
      ```go
      s := "bonjour"
      fmt.Println(s[0:3:3])
      ```
    answer: 'Rien : le code ne compile pas, l''expression à trois indices ne s''applique pas aux chaînes.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"bonjour\"\n\tfmt.Println(s[0:3:3])\n}\n"
      compiles: false
  - key: bug-vue
    format: bug-fix
    question: "Un appelant qui ajoute à la liste des derniers événements écrase l'événement suivant du journal :\n```go\nfunc (j *Journal) Derniers(n int) []Evenement {\n\tdebut := len(j.evts) - n\n\treturn j.evts[debut : debut+n/2]\n}\n```"
    answer: |-
      ```go
      fin := debut + n/2
      return j.evts[debut:fin:fin]
      ```
      La capacité limitée force l'appelant qui fait append à réallouer. (Une copie protégerait aussi des écritures.)
  - key: bug-isolation
    format: bug-fix
    question: |-
      Un collègue pense que `s[a:b:b]` suffit à isoler les données passées à une fonction qui les trie sur place. Corrigez :
      ```go
      trierEtAfficher(mesures[0:10:10])
      ```
    answer: |-
      ```go
      trierEtAfficher(slices.Clone(mesures[0:10]))
      ```
      La capacité limitée protège des `append`, pas des écritures sur les éléments : le tri modifiait `mesures`.
  - key: bug-indices
    format: bug-fix
    question: |-
      Le service panique avec « slice bounds out of range [::12] with capacity 10 » :
      ```go
      vue := tampon[deb:fin:fin+2]
      ```
    answer: |-
      ```go
      max := min(fin+2, cap(tampon))
      vue := tampon[deb:fin:max]
      ```
      Le troisième indice ne peut pas dépasser la capacité du slice d'origine.
  - key: bug-memoire
    format: bug-fix
    question: Un collègue limite la capacité des petits slices extraits d'un gros tampon pour « libérer la mémoire », sans effet. Qu'expliques-tu, et que fais-tu ?
    answer: |-
      ```go
      petit := bytes.Clone(gros[a:b])
      ```
      Limiter la capacité ne change pas le tableau pointé : le gros tampon reste vivant tant qu'un petit slice existe.
      Seule une copie détache les données du gros tableau.
  - key: qcm-vs-clone
    format: multiple-choice
    question: Quelle différence entre `s[a:b:b]` et `slices.Clone(s[a:b])` ?
    choices:
      - text: Le premier partage les éléments, le second les copie
        correct: true
      - text: Les deux empêchent un append de l'appelant d'écraser `s`
        correct: true
      - text: Les deux libèrent le reste du tableau de `s`
        correct: false
      - text: Aucune
        correct: false
    answer: Seule la copie isole aussi des écritures et détache du gros tableau.
