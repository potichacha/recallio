notion: expression-slice-complete
lesson: |-
  L'**expression de slice complète** `s[bas:haut:max]` découpe comme `s[bas:haut]`, mais fixe aussi la **capacité** du
  résultat à `max - bas`.

  ```go
  s := []int{1, 2, 3, 4, 5}
  t := s[1:3]    // [2 3], len 2, cap 4 (jusqu'à la fin de s)
  u := s[1:3:3]  // [2 3], len 2, cap 2
  u = append(u, 99) // capacité épuisée : nouveau tableau, s est intact
  ```

  Contraintes : `0 <= bas <= haut <= max <= cap(s)`. Elle s'applique aux slices et aux tableaux, **pas aux chaînes**.

  Usage : renvoyer une **vue** sur des données internes, ou passer un sous-slice à du code qui fera `append`, sans risque
  qu'il écrase les éléments suivants. Le premier `append` sur le résultat réalloue forcément.

  Ce n'est **pas** une copie : les éléments existants restent partagés, et une écriture `u[0] = 7` modifie toujours
  `s[1]`. Ce n'est pas non plus un moyen de libérer la mémoire du grand tableau.

  **Piège classique** : croire que `s[a:b:b]` isole complètement le sous-slice. Il protège seulement des `append` ; pour
  des modifications d'éléments, il faut une copie.

  **En entretien** : « s[a:b:c] limite la capacité à c-a ; le prochain append réalloue au lieu d'écraser ; les éléments
  restent partagés. »
cards:
  - key: sert-b
    format: course
    question: À quoi sert `s[a:b:c]` ?
    choices:
      - {text: "À limiter la capacité du sous-slice, pour qu'un `append` réalloue sans rien écraser", correct: true}
      - {text: "À découper de `a` à `b` en ne gardant qu'un élément sur `c`, comme en Python", correct: false}
      - {text: "À copier les éléments de `a` à `b` dans un nouveau tableau de capacité `c`", correct: false}
      - {text: "À découper de `a` à `c`, en limitant la longueur du résultat à `b - a`", correct: false}
    answer: "Le troisième indice fixe la capacité (`c - a`) : un `append` au-delà réalloue au lieu d'écraser les éléments suivants du tableau. Ce n'est pas un pas, comme en Python, et rien n'est copié."
  - key: code-sx-int-1-2-3
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      sx := []int{1, 2, 3, 4, 5}
      sy := sx[1:3]
      fmt.Println(len(sy), cap(sy))
      sz := sx[1:3:3]
      sz = append(sz, 100)
      fmt.Println(sx, sz)
      ```
    choices:
      - text: |-
          ```
          2 4
          [1 2 3 4 5] [2 3 100]
          ```
        correct: true
      - text: |-
          ```
          2 2
          [1 2 3 4 5] [2 3 100]
          ```
        correct: false
      - text: |-
          ```
          2 4
          [1 2 3 100 5] [2 3 100]
          ```
        correct: false
      - text: |-
          ```
          2 2
          [1 2 3 100 5] [2 3 100]
          ```
        correct: false
    answer: "`sy` a une capacité de 4, jusqu'à la fin de `sx` ; `sz` est limité à une capacité de 2, donc `append` réalloue et `sx` n'est pas modifié."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsx := []int{1, 2, 3, 4, 5}\n\tsy := sx[1:3]\n\tfmt.Println(len(sy), cap(sy))\n\tsz := sx[1:3:3]\n\tsz = append(sz, 100)\n\tfmt.Println(sx, sz)\n}\n"
      output: |-
        2 4
        [1 2 3 4 5] [2 3 100]
  - key: capacite
    format: course
    question: "Quelle capacité a `s[2:5:7]` ?"
    choices:
      - {text: "`5`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`7 - 2 = 5` : la capacité vaut max moins bas ; la longueur, elle, vaut `5 - 2 = 3`."
  - key: pas-copie
    format: course
    question: '`u := s[1:3:3]` protège-t-il `s` des écritures `u[0] = x` ?'
    choices:
      - {text: "Non : les éléments restent partagés, seuls les `append` sont protégés", correct: true}
      - {text: "Oui : le troisième indice fait une copie des éléments découpés", correct: false}
      - {text: "Oui, tant que `u` n'a pas encore été agrandi par un `append`", correct: false}
      - {text: "Non, et il ne protège pas non plus `s` des `append` faits sur `u`", correct: false}
    answer: "Non : `u[0]` et `s[1]` sont la même case ; seule la capacité est limitée, ce qui force un `append` à réallouer. Pour isoler aussi des écritures, il faut une copie (`slices.Clone`)."
  - key: chaines
    format: course
    question: "L'expression à trois indices `s[a:b:c]` s'applique-t-elle aux chaînes ?"
    choices:
      - {text: "Non : seulement aux slices et aux tableaux ; une chaîne n'a pas de capacité", correct: true}
      - {text: "Oui : elle limite la capacité de la sous-chaîne, comme pour un slice", correct: false}
      - {text: "Oui, mais elle copie toujours la sous-chaîne dans un nouveau tableau", correct: false}
      - {text: "Oui, à condition que la chaîne ne contienne que des caractères ASCII", correct: false}
    answer: "Non : seulement aux slices, aux tableaux et aux pointeurs de tableau. Une chaîne est immuable, on ne peut pas lui ajouter d'éléments : la question de la capacité ne se pose pas, et `s[0:3:3]` ne compile pas."
  - key: vf-append-realloue
    format: true-false
    question: Le premier append sur `s[a:b:b]` réalloue toujours.
    truth: true
    answer: Sa capacité est égale à sa longueur.
  - key: vf-max
    format: true-false
    question: Le troisième indice de `s[a:b:c]` peut dépasser `cap(s)`.
    truth: false
    answer: '`c` doit être au plus `cap(s)`, sinon c''est une panique (ou une erreur de compilation si constant).'
  - key: vf-copie
    format: true-false
    question: '`s[a:b:b]` crée une copie indépendante des éléments.'
    truth: false
    answer: C'est une vue sur le même tableau, à capacité limitée.
  - key: vf-memoire
    format: true-false
    question: Limiter la capacité d'un sous-slice permet au GC de libérer le reste du gros tableau.
    truth: false
    answer: Le sous-slice pointe toujours sur le tableau ; seule une copie le libère.
  - key: qcm-len-cap
    format: multiple-choice
    question: Avec `s := make([]int, 10)`, que valent len et cap de `s[2:4:6]` ?
    choices:
      - text: len 2, cap 4
        correct: true
      - text: len 2, cap 8
        correct: false
      - text: len 4, cap 6
        correct: false
      - text: len 2, cap 6
        correct: false
    answer: len = 4-2, cap = 6-2.
  - key: qcm-usage
    format: multiple-choice
    question: "Dans lequel de ces cas l'expression à trois indices est-elle utile ?"
    choices:
      - {text: "Construire deux variantes d'un même préfixe avec `append`", correct: true}
      - {text: "Copier en profondeur un slice de slices", correct: false}
      - {text: "Découper une chaîne sans copier ses octets", correct: false}
      - {text: "Isoler un slice d'une fonction qui le trie sur place", correct: false}
    answer: "Elle évite qu'un `append` écrive dans la capacité partagée : deux variantes d'un préfixe, ou une vue renvoyée à un appelant qui pourrait l'étendre. Elle ne copie rien, donc ne protège pas d'un tri sur place, et ne s'applique pas aux chaînes."
  - key: qcm-invalide
    format: multiple-choice
    question: Avec `s := make([]int, 3, 5)`, quelles expressions paniquent ou ne compilent pas ?
    choices:
      - text: '`s[1:2:6]`'
        correct: true
      - text: '`s[2:1:3]`'
        correct: true
      - text: '`s[1:2:5]`'
        correct: false
      - text: '`s[0:3:3]`'
        correct: false
    answer: Il faut `bas <= haut <= max <= cap(s)`.
  - key: code-capacite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{1, 2, 3, 4, 5, 6}
      t := s[1:3:4]
      fmt.Println(t, len(t), cap(t))
      t = append(t, 10)
      t = append(t, 11)
      fmt.Println(s)
      ```
    choices:
      - text: |-
          ```
          [2 3] 2 3
          [1 2 3 10 5 6]
          ```
        correct: true
      - text: |-
          ```
          [2 3] 2 3
          [1 2 3 10 11 6]
          ```
        correct: false
      - text: |-
          ```
          [2 3] 2 3
          [1 2 3 4 5 6]
          ```
        correct: false
      - text: |-
          ```
          [2 3] 2 5
          [1 2 3 10 11 6]
          ```
        correct: false
    answer: "`t` a une capacité de `4 - 1 = 3` : le premier `append` écrit dans la case restante (`s[3]`), le second dépasse la capacité et réalloue ; `s[4]` garde son 5."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3, 4, 5, 6}\n\tt := s[1:3:4]\n\tfmt.Println(t, len(t), cap(t))\n\tt = append(t, 10)\n\tt = append(t, 11)\n\tfmt.Println(s)\n}\n"
      output: |-
        [2 3] 2 3
        [1 2 3 10 5 6]
  - key: code-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{1, 2, 3}
      u := s[0:2:2]
      u[0] = 9
      u = append(u, 7)
      u[1] = 8
      fmt.Println(s, u)
      ```
    choices:
      - {text: "`[9 2 3] [9 8 7]`", correct: true}
      - {text: "`[9 8 3] [9 8 7]`", correct: false}
      - {text: "`[9 8 7] [9 8 7]`", correct: false}
      - {text: "`[1 2 3] [9 8 7]`", correct: false}
    answer: "`[9 2 3] [9 8 7]` : l'écriture avant l'`append` touche `s` (même tableau) ; l'`append` dépasse la capacité de 2 et réalloue, donc l'écriture d'après ne touche que `u`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []int{1, 2, 3}\n\tu := s[0:2:2]\n\tu[0] = 9\n\tu = append(u, 7)\n\tu[1] = 8\n\tfmt.Println(s, u)\n}\n"
      output: '[9 2 3] [9 8 7]'
  - key: code-chaine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := "bonjour"
      fmt.Println(s[0:3:3])
      ```
    choices:
      - {text: "Ça ne compile pas : pas de troisième indice sur une chaîne", correct: true}
      - {text: "`bon`", correct: false}
      - {text: "`bonjour`", correct: false}
      - {text: "Une panic à l'exécution : slice bounds out of range", correct: false}
    answer: "L'expression à trois indices ne s'applique pas aux chaînes : le compilateur la refuse (« 3-index slice of string »), avant toute exécution."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"bonjour\"\n\tfmt.Println(s[0:3:3])\n}\n"
      compiles: false
  - key: bug-vue
    format: bug-fix
    question: |-
      Un appelant qui ajoute à la liste des derniers événements écrase l'événement suivant du journal. Quelle correction est la bonne ?
      ```go
      func (j *Journal) Derniers(n int) []Evenement {
      	debut := len(j.evts) - n
      	return j.evts[debut : debut+n/2]
      }
      ```
    choices:
      - {text: "Limiter la capacité : `j.evts[debut:fin:fin]`, avec `fin := debut + n/2`", correct: true}
      - {text: "Renvoyer la vue `j.evts[debut:fin]` derrière un pointeur `*[]Evenement`", correct: false}
      - {text: "Prendre un receveur par valeur, `(j Journal)`, pour isoler la vue", correct: false}
      - {text: "Découper `j.evts[debut:fin:len(j.evts)]`, pour garder la capacité utile", correct: false}
    answer: |-
      ```go
      fin := debut + n/2
      return j.evts[debut:fin:fin]
      ```
      La capacité limitée force l'appelant qui fait append à réallouer. (Une copie protégerait aussi des écritures.)
  - key: bug-isolation
    format: bug-fix
    question: |-
      Un collègue pense que `s[a:b:b]` suffit à isoler les données passées à une fonction qui les trie sur place. Que lui proposes-tu ?
      ```go
      trierEtAfficher(mesures[0:10:10])
      ```
    choices:
      - {text: "Passer une copie : `trierEtAfficher(slices.Clone(mesures[0:10]))`", correct: true}
      - {text: "Garder `mesures[0:10:10]` : la capacité limitée protège déjà du tri", correct: false}
      - {text: "Passer `mesures[:10]`, une vue indépendante des dix premières mesures", correct: false}
      - {text: "Passer `mesures[0:10:0]`, une capacité nulle qui interdit d'écrire", correct: false}
    answer: |-
      ```go
      trierEtAfficher(slices.Clone(mesures[0:10]))
      ```
      La capacité limitée protège des `append`, pas des écritures sur les éléments : le tri modifiait `mesures`.
  - key: bug-indices
    format: bug-fix
    question: |-
      Le service panique avec « slice bounds out of range [::12] with capacity 10 ». Quelle correction est la bonne ?
      ```go
      vue := tampon[deb:fin:fin+2]
      ```
    choices:
      - {text: "Borner le troisième indice : `max := min(fin+2, cap(tampon))`", correct: true}
      - {text: "Rattraper la panique avec un `recover` autour de la découpe", correct: false}
      - {text: "Inverser les deux derniers indices : `tampon[deb:fin+2:fin]`", correct: false}
      - {text: "Ajuster la capacité d'abord : `tampon = slices.Clip(tampon)`", correct: false}
    answer: |-
      ```go
      max := min(fin+2, cap(tampon))
      vue := tampon[deb:fin:max]
      ```
      Le troisième indice ne peut pas dépasser la capacité du slice d'origine. `slices.Clip` réduit la capacité à la longueur : la découpe paniquerait encore plus tôt.
  - key: bug-memoire
    format: bug-fix
    question: Un collègue limite la capacité des petits slices extraits d'un gros tampon pour « libérer la mémoire », sans effet. Qu'expliques-tu, et que fais-tu ?
    choices:
      - {text: "La capacité ne change pas le tableau pointé : je copie avec `bytes.Clone`", correct: true}
      - {text: "La capacité limitée libère bien le reste, mais seulement au prochain GC", correct: false}
      - {text: "Il faut appeler `runtime.GC()` après chaque découpe pour libérer le reste", correct: false}
      - {text: "Il faut aussi limiter la longueur, avec un troisième indice égal au premier", correct: false}
    answer: |-
      ```go
      petit := bytes.Clone(gros[a:b])
      ```
      Limiter la capacité ne change pas le tableau pointé : le gros tampon reste vivant tant qu'un petit slice existe.
      Seule une copie détache les données du gros tableau.
  - key: qcm-vs-clone
    format: multiple-choice
    question: Quelle différence entre `s[a:b:b]` et `slices.Clone(s[a:b])` ?
    choices:
      - {text: "Le premier partage les éléments avec `s`, le second les copie", correct: true}
      - {text: "Le premier copie les éléments, le second partage le tableau de `s`", correct: false}
      - {text: "Les deux libèrent le reste du tableau de `s` pour le ramasse-miettes", correct: false}
      - {text: "Aucune : les deux empêchent toute modification de `s` par l'appelant", correct: false}
    answer: "Les deux empêchent un `append` de l'appelant d'écraser `s`, mais seule la copie isole aussi des écritures sur les éléments, et détache du gros tableau."
