notion: maps-ordre-iteration
lesson: "L'ordre dans lequel `range` parcourt une map **n'est pas défini**, et Go le rend **volontairement aléatoire** : il\nchange d'une exécution à l'autre, et même d'un parcours à l'autre. Le but est d'empêcher le code de dépendre d'un ordre\nqui n'est pas garanti.\n\nPour un ordre stable, on **trie les clés** :\n\n```go\nfor _, k := range slices.Sorted(maps.Keys(m)) { // Go 1.23\n\tfmt.Println(k, m[k])\n}\n\n// avant Go 1.23\ncles := make([]string, 0, len(m))\nfor k := range m {\n\tcles = append(cles, k)\n}\nsort.Strings(cles)\n```\n\nÀ l'inverse, `fmt.Println(m)` (et `%v`) affiche une map **triée par clé** depuis Go 1.12 : l'affichage est stable,\nmême si l'itération ne l'est pas. `encoding/json` trie aussi les clés d'une map à l'encodage.\n\nConséquences : un test qui compare la concaténation d'un parcours de map est **instable** ; un traitement qui doit\nêtre reproductible (une signature, un hash, un export) doit trier.\n\n**Piège classique** : un test qui passe en local et échoue en CI de temps en temps, parce qu'il dépend de l'ordre d'un\nrange sur une map.\n\n**En entretien** : « L'ordre d'itération est aléatoire par conception ; on trie les clés pour un ordre stable ; fmt et\njson trient les clés à l'affichage. »"
cards:
  - key: ordre-iteration-map-garanti
    format: course
    question: L'ordre d'itération d'une map est-il garanti ?
    answer: Non, il est volontairement aléatoire.
  - key: pourquoi-aleatoire
    format: course
    question: Pourquoi Go rend-il l'ordre d'itération des maps aléatoire ?
    answer: Pour que personne ne dépende d'un ordre que la spécification ne garantit pas ; l'implémentation peut ainsi évoluer sans casser de code.
  - key: fmt-trie
    format: course
    question: Pourquoi `fmt.Println(m)` affiche-t-il toujours les clés dans le même ordre ?
    answer: Depuis Go 1.12, `fmt` trie les clés d'une map pour l'affichage ; l'itération par range, elle, reste aléatoire.
  - key: reproductible
    format: course
    question: Comment produire une signature reproductible des paramètres d'une requête stockés dans une map ?
    answer: En triant les clés avant de les concaténer (`slices.Sorted(maps.Keys(params))`), pour que le même contenu donne toujours la même chaîne.
  - key: vf-insertion
    format: true-false
    question: Une map Go conserve l'ordre d'insertion de ses clés.
    truth: false
    answer: Aucun ordre n'est conservé ; pour l'ordre d'insertion, on garde un slice des clés à côté.
  - key: vf-meme-programme
    format: true-false
    question: Deux parcours successifs de la même map, sans modification, donnent forcément le même ordre.
    truth: false
    answer: L'ordre peut changer à chaque parcours.
  - key: vf-json
    format: true-false
    question: '`json.Marshal` d''une map produit les clés triées.'
    truth: true
    answer: L'encodage JSON d'une map trie ses clés, ce qui rend la sortie stable.
  - key: vf-fmt
    format: true-false
    question: '`fmt.Println(m)` affiche les clés dans un ordre aléatoire.'
    truth: false
    answer: '`fmt` les trie depuis Go 1.12.'
  - key: qcm-trier
    format: multiple-choice
    question: Comment parcourir une map dans l'ordre de ses clés ?
    choices:
      - text: '`for _, k := range slices.Sorted(maps.Keys(m))`'
        correct: true
      - text: Copier les clés dans un slice, le trier, puis lire `m[k]`
        correct: true
      - text: '`for k := range m` suffit si la map est petite'
        correct: false
      - text: '`for k := range sort.Map(m)`'
        correct: false
    answer: Même une petite map n'a pas d'ordre garanti.
  - key: qcm-stables
    format: multiple-choice
    question: Quelles sorties sont stables d'une exécution à l'autre ?
    choices:
      - text: '`fmt.Sprint(m)`'
        correct: true
      - text: '`json.Marshal(m)`'
        correct: true
      - text: La concaténation des clés obtenues par `for k := range m`
        correct: false
      - text: '`maps.Keys(m)` parcouru tel quel'
        correct: false
    answer: '`maps.Keys` renvoie un itérateur dans l''ordre de la map, donc aléatoire.'
  - key: qcm-insertion
    format: multiple-choice
    question: Comment garder l'ordre d'insertion de clés tout en ayant un accès rapide ?
    choices:
      - text: Une map pour l'accès et un slice des clés dans l'ordre d'insertion
        correct: true
      - text: Une map seule, qui garde l'ordre
        correct: false
      - text: Un `sync.Map`
        correct: false
      - text: Trier la map
        correct: false
    answer: Le slice garde l'ordre, la map l'accès en O(1).
  - key: qcm-test
    format: multiple-choice
    question: Un test compare `strings.Join` des clés d'un range sur une map à une chaîne attendue. Que se passe-t-il ?
    choices:
      - text: Il échoue de façon intermittente
        correct: true
      - text: Il passe toujours si la map a moins de 8 clés
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il passe toujours en CI
        correct: false
    answer: Même petite, une map est parcourue dans un ordre aléatoire.
  - key: code-fmt
    format: code-output
    question: |-
      ```go
      m := map[string]int{"c": 3, "a": 1, "b": 2}
      fmt.Println(m)
      ```
    answer: '`map[a:1 b:2 c:3]` : fmt trie les clés à l''affichage.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"c\": 3, \"a\": 1, \"b\": 2}\n\tfmt.Println(m)\n}\n"
      output: map[a:1 b:2 c:3]
  - key: code-trie
    format: code-output
    question: "```go\nnotes := map[string]int{\"zoe\": 14, \"ada\": 18, \"max\": 9}\nfor _, nom := range slices.Sorted(maps.Keys(notes)) {\n\tfmt.Print(nom, \"=\", notes[nom], \" \")\n}\nfmt.Println()\n```"
    answer: '`ada=18 max=9 zoe=14` : les clés triées donnent un ordre stable.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n)\n\nfunc main() {\n\tnotes := map[string]int{\"zoe\": 14, \"ada\": 18, \"max\": 9}\n\tfor _, nom := range slices.Sorted(maps.Keys(notes)) {\n\t\tfmt.Print(nom, \"=\", notes[nom], \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: ada=18 max=9 zoe=14
  - key: code-json
    format: code-output
    question: |-
      ```go
      b, _ := json.Marshal(map[string]int{"z": 1, "a": 2})
      fmt.Println(string(b))
      ```
    answer: '`{"a":2,"z":1}` : l''encodage JSON trie les clés.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tb, _ := json.Marshal(map[string]int{\"z\": 1, \"a\": 2})\n\tfmt.Println(string(b))\n}\n"
      output: '{"a":2,"z":1}'
  - key: code-somme
    format: code-output
    question: "```go\nm := map[string]int{\"a\": 1, \"b\": 2, \"c\": 3}\ntotal := 0\nfor _, v := range m {\n\ttotal += v\n}\nfmt.Println(total)\n```"
    answer: '`6` : une somme ne dépend pas de l''ordre, le résultat est stable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"a\": 1, \"b\": 2, \"c\": 3}\n\ttotal := 0\n\tfor _, v := range m {\n\t\ttotal += v\n\t}\n\tfmt.Println(total)\n}\n"
      output: '6'
  - key: bug-signature
    format: bug-fix
    question: "La signature HMAC des requêtes est rejetée une fois sur deux par le partenaire :\n```go\nvar b strings.Builder\nfor k, v := range params {\n\tb.WriteString(k + \"=\" + v + \"&\")\n}\nsignature := hmac(b.String())\n```"
    answer: "```go\nfor _, k := range slices.Sorted(maps.Keys(params)) {\n\tb.WriteString(k + \"=\" + params[k] + \"&\")\n}\n```\nL'ordre aléatoire du range changeait la chaîne signée ; les clés triées la rendent reproductible."
  - key: bug-test
    format: bug-fix
    question: "Ce test échoue de temps en temps :\n```go\nvar noms []string\nfor nom := range inscrits {\n\tnoms = append(noms, nom)\n}\nif !slices.Equal(noms, []string{\"ada\", \"bob\"}) { t.Fail() }\n```"
    answer: |-
      ```go
      noms := slices.Sorted(maps.Keys(inscrits))
      if !slices.Equal(noms, []string{"ada", "bob"}) { t.Fail() }
      ```
      L'ordre d'un range sur une map est aléatoire : on trie avant de comparer.
  - key: bug-ordre-insertion
    format: bug-fix
    question: "Le menu s'affiche dans un ordre différent à chaque démarrage :\n```go\nmenu := map[string]func(){\"Ouvrir\": ouvrir, \"Enregistrer\": enregistrer, \"Quitter\": quitter}\nfor libelle := range menu {\n\tafficher(libelle)\n}\n```"
    answer: "```go\ntype entree struct {\n\tlibelle string\n\taction  func()\n}\n\nmenu := []entree{{\"Ouvrir\", ouvrir}, {\"Enregistrer\", enregistrer}, {\"Quitter\", quitter}}\nfor _, e := range menu {\n\tafficher(e.libelle)\n}\n```\nUne map ne garde aucun ordre ; un slice garde l'ordre voulu."
  - key: bug-premier
    format: bug-fix
    question: "Le « premier » fournisseur choisi change à chaque exécution :\n```go\nfor nom := range fournisseurs {\n\tchoisi = nom\n\tbreak\n}\n```"
    answer: |-
      ```go
      choisi = slices.Min(slices.Collect(maps.Keys(fournisseurs)))
      // ou une règle explicite : le moins cher, le plus fiable...
      ```
      Il n'y a pas de « premier » élément dans une map : on choisit selon une règle explicite.
