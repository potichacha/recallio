notion: maps-ordre-iteration
lesson: "L'ordre dans lequel `range` parcourt une map **n'est pas défini**, et Go le rend **volontairement aléatoire** : il\nchange d'une exécution à l'autre, et même d'un parcours à l'autre. Le but est d'empêcher le code de dépendre d'un ordre\nqui n'est pas garanti.\n\nPour un ordre stable, on **trie les clés** :\n\n```go\nfor _, k := range slices.Sorted(maps.Keys(m)) { // Go 1.23\n\tfmt.Println(k, m[k])\n}\n\n// avant Go 1.23\ncles := make([]string, 0, len(m))\nfor k := range m {\n\tcles = append(cles, k)\n}\nsort.Strings(cles)\n```\n\nÀ l'inverse, `fmt.Println(m)` (et `%v`) affiche une map **triée par clé** depuis Go 1.12 : l'affichage est stable,\nmême si l'itération ne l'est pas. `encoding/json` trie aussi les clés d'une map à l'encodage.\n\nConséquences : un test qui compare la concaténation d'un parcours de map est **instable** ; un traitement qui doit\nêtre reproductible (une signature, un hash, un export) doit trier.\n\n**Piège classique** : un test qui passe en local et échoue en CI de temps en temps, parce qu'il dépend de l'ordre d'un\nrange sur une map.\n\n**En entretien** : « L'ordre d'itération est aléatoire par conception ; on trie les clés pour un ordre stable ; fmt et\njson trient les clés à l'affichage. »"
tour:
  - title: L'ordre d'une map
    text: |-
      Parcourir une map avec `range` ne suit **aucun ordre** : Go le rend volontairement aléatoire, d'une exécution à
      l'autre, pour qu'aucun programme ne dépende d'un ordre qui n'est pas garanti.

      Quand l'ordre compte, on trie les clés : `slices.Sorted(maps.Keys(m))` renvoie les clés triées, qu'on parcourt
      ensuite.

      Essaie : remplace la boucle par `for nom, p := range prix` et affiche `nom` et `p`, puis exécute plusieurs fois.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"maps"
          	"slices"
          )

          func main() {
          	prix := map[string]float64{"pain": 1.2, "lait": 0.9, "café": 4.5, "riz": 2.1}
          	for _, nom := range slices.Sorted(maps.Keys(prix)) {
          		fmt.Println(nom, prix[nom])
          	}
          }
      output: |-
        café 4.5
        lait 0.9
        pain 1.2
        riz 2.1
cards:
  - key: ordre-iteration-map-garanti
    format: course
    question: "L'ordre d'itération d'une map par `range` est-il garanti ?"
    choices:
      - {text: "Non : il est volontairement aléatoire, d'un parcours à l'autre", correct: true}
      - {text: "Oui : c'est l'ordre dans lequel les clés ont été insérées", correct: false}
      - {text: "Oui : c'est l'ordre croissant des clés, comme dans un arbre", correct: false}
      - {text: "Non pour les grandes maps, mais oui en dessous de huit entrées", correct: false}
    answer: "Non : la spécification ne garantit aucun ordre, et le runtime choisit un point de départ aléatoire à chaque parcours, même pour une petite map. Pour un ordre stable, on trie les clés."
  - key: pourquoi-aleatoire
    format: course
    question: Pourquoi Go rend-il l'ordre d'itération des maps aléatoire ?
    choices:
      - {text: "Pour que personne ne dépende d'un ordre que la spécification ne garantit pas", correct: true}
      - {text: "Pour répartir le parcours entre les cœurs du processeur, plus rapidement", correct: false}
      - {text: "Pour protéger la map des écritures concurrentes pendant un `range`", correct: false}
      - {text: "Parce que le hachage d'une clé change à chaque accès à la map", correct: false}
    answer: "Pour que personne ne dépende d'un ordre que la spécification ne garantit pas : l'implémentation peut évoluer (comme les Swiss Tables de Go 1.24) sans casser de code. Le hachage d'une clé, lui, reste fixe pour une map donnée."
  - key: fmt-trie
    format: course
    question: Pourquoi `fmt.Println(m)` affiche-t-il toujours les clés dans le même ordre ?
    choices:
      - {text: "Depuis Go 1.12, `fmt` trie les clés d'une map pour l'affichage", correct: true}
      - {text: "La map garde ses clés triées, mais `range` les mélange au parcours", correct: false}
      - {text: "Les petites maps gardent l'ordre d'insertion, et `fmt` le suit", correct: false}
      - {text: "C'est un hasard : l'ordre affiché change d'une exécution à l'autre", correct: false}
    answer: "Depuis Go 1.12, `fmt` trie les clés d'une map pour l'affichage, ce qui rend la sortie stable (pratique pour les tests). L'itération par `range`, elle, reste aléatoire."
  - key: reproductible
    format: course
    question: Comment produire une signature reproductible des paramètres d'une requête stockés dans une map ?
    choices:
      - {text: "En triant les clés avant de les concaténer : `slices.Sorted(maps.Keys(params))`", correct: true}
      - {text: "En parcourant la map avec `range`, qui suit l'ordre d'insertion des paramètres", correct: false}
      - {text: "En parcourant `maps.Keys(params)`, qui renvoie les clés dans un ordre fixe", correct: false}
      - {text: "En fixant la graine de hachage par `GODEBUG`, pour figer l'ordre du `range`", correct: false}
    answer: "En triant les clés avant de les concaténer, pour que le même contenu donne toujours la même chaîne. `maps.Keys` suit l'ordre aléatoire de la map, et aucun réglage ne fige l'ordre d'un `range`."
  - key: vf-insertion
    format: true-false
    question: Une map Go conserve l'ordre d'insertion de ses clés.
    truth: false
    answer: Aucun ordre n'est conservé ; pour l'ordre d'insertion, on garde un slice des clés à côté.
  - key: vf-meme-programme
    format: true-false
    question: Deux parcours successifs de la même map, sans modification, donnent forcément le même ordre.
    truth: false
    answer: L'ordre peut changer à chaque parcours.
  - key: vf-json
    format: true-false
    question: '`json.Marshal` d''une map produit les clés triées.'
    truth: true
    answer: L'encodage JSON d'une map trie ses clés, ce qui rend la sortie stable.
  - key: vf-fmt
    format: true-false
    question: '`fmt.Println(m)` affiche les clés dans un ordre aléatoire.'
    truth: false
    answer: '`fmt` les trie depuis Go 1.12.'
  - key: qcm-trier
    format: multiple-choice
    question: "Laquelle de ces boucles parcourt la map `notes` dans l'ordre alphabétique de ses clés ?"
    choices:
      - {text: "`for _, k := range slices.Sorted(maps.Keys(notes))`", correct: true}
      - {text: "`for k := range maps.Keys(notes)`", correct: false}
      - {text: "`for _, k := range slices.Collect(maps.Keys(notes))`", correct: false}
      - {text: "`for k := range notes`, si la map est petite", correct: false}
    answer: "`maps.Keys` renvoie un itérateur dans l'ordre aléatoire de la map, que `slices.Collect` garde tel quel ; `slices.Sorted` le collecte et le trie. Copier les clés dans un slice puis le trier marche aussi ; même une petite map n'a pas d'ordre garanti."
  - key: qcm-stables
    format: multiple-choice
    question: Quelles sorties sont stables d'une exécution à l'autre ?
    choices:
      - text: '`fmt.Sprint(m)`'
        correct: true
      - text: '`json.Marshal(m)`'
        correct: true
      - text: La concaténation des clés obtenues par `for k := range m`
        correct: false
      - text: '`maps.Keys(m)` parcouru tel quel'
        correct: false
    answer: '`maps.Keys` renvoie un itérateur dans l''ordre de la map, donc aléatoire.'
  - key: qcm-insertion
    format: multiple-choice
    question: Comment garder l'ordre d'insertion de clés tout en ayant un accès rapide ?
    choices:
      - {text: "Une map pour l'accès et un slice des clés dans l'ordre d'insertion", correct: true}
      - {text: "Une map seule, qui garde l'ordre d'insertion de ses clés", correct: false}
      - {text: "Une `sync.Map`, qui mémorise l'ordre de ses écritures", correct: false}
      - {text: "Une map triée à chaque insertion avec `slices.Sort`", correct: false}
    answer: Le slice garde l'ordre, la map l'accès en O(1).
  - key: qcm-test
    format: multiple-choice
    question: Un test compare `strings.Join` des clés d'un range sur une map à une chaîne attendue. Que se passe-t-il ?
    choices:
      - text: Il échoue de façon intermittente
        correct: true
      - text: Il passe toujours si la map a moins de 8 clés
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il passe toujours en CI
        correct: false
    answer: Même petite, une map est parcourue dans un ordre aléatoire.
  - key: code-fmt
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[string]int{"c": 3, "a": 1, "b": 2}
      fmt.Println(m)
      ```
    choices:
      - {text: "`map[a:1 b:2 c:3]`", correct: true}
      - {text: "`map[c:3 a:1 b:2]`", correct: false}
      - {text: "`map[c:3 b:2 a:1]`", correct: false}
      - {text: "`map[1:a 2:b 3:c]`", correct: false}
    answer: "`map[a:1 b:2 c:3]` : `fmt` trie les clés à l'affichage, quel que soit l'ordre du littéral ; le parcours par `range` resterait aléatoire."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"c\": 3, \"a\": 1, \"b\": 2}\n\tfmt.Println(m)\n}\n"
      output: map[a:1 b:2 c:3]
  - key: code-trie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      notes := map[string]int{"zoe": 14, "ada": 18, "max": 9}
      for _, nom := range slices.Sorted(maps.Keys(notes)) {
      	fmt.Print(nom, "=", notes[nom], " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`ada=18 max=9 zoe=14`", correct: true}
      - {text: "`zoe=14 ada=18 max=9`", correct: false}
      - {text: "`ada=18 zoe=14 max=9`", correct: false}
      - {text: "`max=9 zoe=14 ada=18`", correct: false}
    answer: "`ada=18 max=9 zoe=14` : les clés triées par ordre alphabétique donnent un ordre stable, sans rapport avec celui du littéral ni avec les valeurs."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n)\n\nfunc main() {\n\tnotes := map[string]int{\"zoe\": 14, \"ada\": 18, \"max\": 9}\n\tfor _, nom := range slices.Sorted(maps.Keys(notes)) {\n\t\tfmt.Print(nom, \"=\", notes[nom], \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: ada=18 max=9 zoe=14
  - key: code-json
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      b, _ := json.Marshal(map[string]int{"z": 1, "a": 2})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"a\":2,\"z\":1}`", correct: true}
      - {text: "`{\"z\":1,\"a\":2}`", correct: false}
      - {text: "`map[a:2 z:1]`", correct: false}
      - {text: "`{a:2,z:1}`", correct: false}
    answer: "`encoding/json` trie les clés d'une map à l'encodage : la sortie est stable, au format JSON (clés entre guillemets)."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tb, _ := json.Marshal(map[string]int{\"z\": 1, \"a\": 2})\n\tfmt.Println(string(b))\n}\n"
      output: '{"a":2,"z":1}'
  - key: code-somme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[string]int{"a": 1, "b": 2, "c": 3}
      total := 0
      for _, v := range m {
      	total += v
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Un total qui change d'une exécution à l'autre", correct: false}
    answer: "`6` : l'ordre du parcours est aléatoire, mais une somme ne dépend pas de l'ordre ; le résultat est stable."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"a\": 1, \"b\": 2, \"c\": 3}\n\ttotal := 0\n\tfor _, v := range m {\n\t\ttotal += v\n\t}\n\tfmt.Println(total)\n}\n"
      output: '6'
  - key: bug-signature
    format: bug-fix
    question: |-
      La signature HMAC des requêtes est rejetée une fois sur deux par le partenaire. Quelle correction est la bonne ?
      ```go
      var b strings.Builder
      for k, v := range params {
      	b.WriteString(k + "=" + v + "&")
      }
      signature := hmac(b.String())
      ```
    choices:
      - {text: "Parcourir les clés triées : `slices.Sorted(maps.Keys(params))`", correct: true}
      - {text: "Parcourir `maps.Keys(params)`, qui fixe l'ordre des clés", correct: false}
      - {text: "Préallouer le Builder avec `b.Grow`, pour une chaîne stable", correct: false}
      - {text: "Remplacer le Builder par des `+=`, dans l'ordre du `range`", correct: false}
    answer: "```go\nfor _, k := range slices.Sorted(maps.Keys(params)) {\n\tb.WriteString(k + \"=\" + params[k] + \"&\")\n}\n```\nL'ordre aléatoire du range changeait la chaîne signée ; les clés triées la rendent reproductible."
  - key: bug-test
    format: bug-fix
    question: |-
      Ce test échoue de temps en temps. Quelle correction est la bonne ?
      ```go
      var noms []string
      for nom := range inscrits {
      	noms = append(noms, nom)
      }
      if !slices.Equal(noms, []string{"ada", "bob"}) { t.Fail() }
      ```
    choices:
      - {text: "Trier avant de comparer : `noms := slices.Sorted(maps.Keys(inscrits))`", correct: true}
      - {text: "Comparer avec `reflect.DeepEqual` plutôt qu'avec `slices.Equal`", correct: false}
      - {text: "Préallouer `noms` avec `make([]string, 0, len(inscrits))`", correct: false}
      - {text: "Lancer le test avec `-count=1`, pour ignorer le cache des résultats", correct: false}
    answer: |-
      ```go
      noms := slices.Sorted(maps.Keys(inscrits))
      if !slices.Equal(noms, []string{"ada", "bob"}) { t.Fail() }
      ```
      L'ordre d'un range sur une map est aléatoire : on trie avant de comparer.
  - key: bug-ordre-insertion
    format: bug-fix
    question: |-
      Le menu doit afficher Ouvrir, Enregistrer, Quitter, mais l'ordre change à chaque démarrage. Quelle correction est la bonne ?
      ```go
      menu := map[string]func(){"Ouvrir": ouvrir, "Enregistrer": enregistrer, "Quitter": quitter}
      for libelle := range menu {
      	afficher(libelle)
      }
      ```
    choices:
      - {text: "Ranger les entrées dans un slice de structs, qui garde l'ordre voulu", correct: true}
      - {text: "Trier les libellés avant l'affichage : `slices.Sorted(maps.Keys(menu))`", correct: false}
      - {text: "Créer la map avec `make` et une capacité de 3, pour figer l'ordre", correct: false}
      - {text: "Insérer les entrées une par une, dans l'ordre voulu, plutôt qu'en littéral", correct: false}
    answer: |-
      ```go
      type entree struct {
      	libelle string
      	action  func()
      }

      menu := []entree{{"Ouvrir", ouvrir}, {"Enregistrer", enregistrer}, {"Quitter", quitter}}
      for _, e := range menu {
      	afficher(e.libelle)
      }
      ```
      Une map ne garde aucun ordre ; un slice garde l'ordre voulu. Trier donnerait un ordre stable, mais alphabétique : Enregistrer, Ouvrir, Quitter.
  - key: bug-premier
    format: bug-fix
    question: |-
      Le « premier » fournisseur choisi change à chaque exécution. Quelle correction est la bonne ?
      ```go
      for nom := range fournisseurs {
      	choisi = nom
      	break
      }
      ```
    choices:
      - {text: "Choisir selon une règle explicite, par exemple `slices.Min` des clés", correct: true}
      - {text: "Garder la boucle, mais remplir la map dans l'ordre alphabétique", correct: false}
      - {text: "Prendre la première clé que renvoie l'itérateur `maps.Keys`", correct: false}
      - {text: "Remplacer `break` par `continue`, pour parcourir toute la map", correct: false}
    answer: |-
      ```go
      choisi = slices.Min(slices.Collect(maps.Keys(fournisseurs)))
      // ou une règle explicite : le moins cher, le plus fiable...
      ```
      Il n'y a pas de « premier » élément dans une map : on choisit selon une règle explicite.
