notion: tableaux
lesson: |-
  Un **tableau** a une taille **fixe, qui fait partie de son type** : `[3]int` et `[4]int` sont deux types différents.

  ```go
  var a [3]int              // [0 0 0]
  b := [3]string{"a", "b"}  // [a b ""]
  c := [...]int{1, 2, 3}    // le compilateur compte : [3]int
  d := [5]int{2: 9}         // [0 0 9 0 0], par indice
  ```

  Un tableau est une **valeur** : l'affecter ou le passer à une fonction **copie tous ses éléments**. Deux tableaux de
  même type se comparent avec `==` (élément par élément), et un tableau peut servir de **clé de map** (`[2]int` pour des
  coordonnées).

  En pratique, on manipule surtout des **slices**, qui sont des vues sur un tableau. Les tableaux servent pour des tailles
  connues et fixes : une empreinte (`[32]byte` de `sha256.Sum256`), des coordonnées, une table de correspondance de
  taille fixe, un tampon sur la pile.

  `len(a)` est une constante pour un tableau ; un indice constant hors limites est une erreur de compilation, un indice
  variable hors limites une panique.

  **Piège classique** : passer un gros tableau à une fonction (`func f(t [1000000]int)`) : tout est copié à chaque appel.
  On passe un slice ou un pointeur.

  **En entretien** : « Taille dans le type, valeur copiée à l'affectation, comparable et utilisable comme clé ; on
  utilise surtout des slices, qui sont des vues sur un tableau. »
cards:
  - key: tableau-vs-slice
    format: course
    question: Tableau vs slice ?
    answer: Le tableau a une taille fixe incluse dans son type et se copie en entier ; le slice est une vue (pointeur, len, cap) sur un tableau.
  - key: code-arr-3-int-1-2
    format: code-output
    question: |-
      ```go
      arr := [3]int{1, 2, 3}
      arr2 := arr
      arr2[0] = 9
      fmt.Println(arr[0])
      ```
    answer: '`1` : un tableau est une valeur, l''affectation le copie (avec un slice, ce serait 9).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tarr := [3]int{1, 2, 3}\n\tarr2 := arr\n\tarr2[0] = 9\n\tfmt.Println(arr[0])\n}\n"
      output: '1'
  - key: taille-type
    format: course
    question: Pourquoi `[3]int` et `[4]int` ne sont-ils pas le même type ?
    answer: La taille fait partie du type d'un tableau ; on ne peut pas affecter l'un à l'autre.
  - key: copie
    format: course
    question: Que se passe-t-il quand on passe un tableau à une fonction ?
    answer: Il est copié en entier ; la fonction travaille sur sa copie, et un gros tableau coûte cher à chaque appel.
  - key: usages
    format: course
    question: Quand utiliser un tableau plutôt qu'un slice ?
    answer: 'Pour une taille fixe connue à la compilation : une empreinte `[32]byte`, des coordonnées `[2]int` comme clé de map, un petit tampon local.'
  - key: vf-comparable
    format: true-false
    question: Deux tableaux de même type se comparent avec `==`.
    truth: true
    answer: Élément par élément ; c'est pourquoi un tableau peut être une clé de map, contrairement à un slice.
  - key: vf-taille-variable
    format: true-false
    question: '`n := 5; var t [n]int` compile.'
    truth: false
    answer: La taille d'un tableau doit être une constante ; pour une taille variable, on utilise `make([]int, n)`.
  - key: vf-points
    format: true-false
    question: '`[...]int{1, 2, 3}` a le type `[3]int`.'
    truth: true
    answer: '`...` demande au compilateur de compter les éléments.'
  - key: vf-reference
    format: true-false
    question: Un tableau affecté à une autre variable partage ses éléments avec elle.
    truth: false
    answer: L'affectation copie le tableau ; seul un slice partagerait les données.
  - key: qcm-declarations
    format: multiple-choice
    question: Quelles déclarations créent un tableau ?
    choices:
      - text: '`var t [4]int`'
        correct: true
      - text: '`t := [...]string{"a", "b"}`'
        correct: true
      - text: '`t := []int{1, 2}`'
        correct: false
      - text: '`t := make([4]int)`'
        correct: false
    answer: '`[]int{...}` est un slice, et `make` ne crée pas de tableau.'
  - key: qcm-cle
    format: multiple-choice
    question: Quelles clés de map sont permises ?
    choices:
      - text: '`map[[2]int]bool`'
        correct: true
      - text: '`map[string]int`'
        correct: true
      - text: '`map[[]int]bool`'
        correct: false
      - text: '`map[map[string]int]bool`'
        correct: false
    answer: Une clé doit être comparable ; les tableaux le sont, pas les slices ni les maps.
  - key: qcm-indice
    format: multiple-choice
    question: Avec `t := [3]int{}`, que se passe-t-il pour `t[5]` ?
    choices:
      - text: Une erreur de compilation, l'indice constant est hors limites
        correct: true
      - text: Une panique à l'exécution
        correct: false
      - text: La valeur 0
        correct: false
      - text: Le tableau grandit
        correct: false
    answer: Un indice variable hors limites, lui, panique à l'exécution.
  - key: qcm-indices
    format: multiple-choice
    question: 'Que contient `t := [5]int{1: 7, 3: 9}` ?'
    choices:
      - text: '`[0 7 0 9 0]`'
        correct: true
      - text: '`[7 9 0 0 0]`'
        correct: false
      - text: '`[1 7 3 9 0]`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Un littéral peut donner les éléments par indice ; les autres valent zéro.
  - key: trous-taille
    format: fill-in
    question: |-
      Complétez pour déclarer un tableau de 4 entiers :
      ```go
      var scores [___]int
      ```
    blanks:
      - - '4'
    answer: La taille fait partie du type.
  - key: trous-compter
    format: fill-in
    question: |-
      Complétez pour que le compilateur compte les éléments :
      ```go
      jours := [___]string{"lun", "mar", "mer"}
      ```
    blanks:
      - - '...'
    answer: Le type devient `[3]string`.
  - key: trous-empreinte
    format: fill-in
    question: |-
      Complétez le type renvoyé par `sha256.Sum256` :
      ```go
      var empreinte [___]byte = sha256.Sum256(donnees)
      ```
    blanks:
      - - '32'
    answer: Une empreinte SHA-256 fait 32 octets, une taille fixe.
  - key: trous-cle
    format: fill-in
    question: |-
      Complétez pour indexer une grille par coordonnées :
      ```go
      visites := map[___]bool{}
      visites[[2]int{3, 4}] = true
      ```
    blanks:
      - - '[2]int'
    answer: Un tableau est comparable, donc utilisable comme clé.
  - key: code-comparaison
    format: code-output
    question: |-
      ```go
      a := [3]int{1, 2, 3}
      b := [...]int{1, 2, 3}
      fmt.Println(a == b, len(b))
      ```
    answer: '`true 3` : même type `[3]int`, comparés élément par élément.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta := [3]int{1, 2, 3}\n\tb := [...]int{1, 2, 3}\n\tfmt.Println(a == b, len(b))\n}\n"
      output: true 3
  - key: code-fonction
    format: code-output
    question: |-
      ```go
      func raz(t [3]int) { t[0] = 0 }

      t := [3]int{5, 6, 7}
      raz(t)
      fmt.Println(t)
      ```
    answer: '`[5 6 7]` : la fonction a reçu une copie du tableau.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc raz(t [3]int) { t[0] = 0 }\n\nfunc main() {\n\tt := [3]int{5, 6, 7}\n\traz(t)\n\tfmt.Println(t)\n}\n"
      output: '[5 6 7]'
  - key: code-indices
    format: code-output
    question: |-
      ```go
      t := [5]int{1: 7, 3: 9}
      fmt.Println(t, len(t))
      ```
    answer: '`[0 7 0 9 0] 5` : les éléments sont donnés par indice, les autres valent zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tt := [5]int{1: 7, 3: 9}\n\tfmt.Println(t, len(t))\n}\n"
      output: '[0 7 0 9 0] 5'
  - key: bug-copie-fonction
    format: bug-fix
    question: "La fonction de normalisation ne change rien aux mesures :\n```go\nfunc normaliser(m [100]float64) {\n\tfor i := range m {\n\t\tm[i] /= 100\n\t}\n}\n```"
    answer: "```go\nfunc normaliser(m []float64) {\n\tfor i := range m {\n\t\tm[i] /= 100\n\t}\n}\n\nnormaliser(mesures[:])\n```\nLe tableau était copié ; un slice (ou un pointeur `*[100]float64`) donne accès aux éléments de l'appelant."
  - key: bug-taille-variable
    format: bug-fix
    question: "Le compilateur signale « invalid array length n » :\n```go\nfunc tampon(n int) []byte {\n\tvar t [n]byte\n\treturn t[:]\n}\n```"
    answer: "```go\nfunc tampon(n int) []byte {\n\treturn make([]byte, n)\n}\n```\nLa taille d'un tableau est une constante de compilation ; une taille variable demande un slice."
  - key: bug-gros-tableau
    format: bug-fix
    question: |-
      Le profileur montre beaucoup de temps passé à copier de la mémoire :
      ```go
      type Image struct{ Pixels [4096 * 4096]uint32 }

      func luminosite(img Image) float64 { ... }
      ```
    answer: |-
      ```go
      func luminosite(img *Image) float64 { ... }
      ```
      Passer la struct par valeur copiait 64 Mo de pixels à chaque appel ; un pointeur évite la copie.
  - key: bug-cle-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid map key type []int » :
      ```go
      vus := map[[]int]bool{}
      vus[[]int{x, y}] = true
      ```
    answer: |-
      ```go
      vus := map[[2]int]bool{}
      vus[[2]int{x, y}] = true
      ```
      Un slice n'est pas comparable ; un tableau de taille fixe, ou une struct `Point{X, Y int}`, convient comme clé.
