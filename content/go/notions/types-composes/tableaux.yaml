notion: tableaux
lesson: |-
  Un **tableau** a une taille **fixe, qui fait partie de son type** : `[3]int` et `[4]int` sont deux types différents.

  ```go
  var a [3]int              // [0 0 0]
  b := [3]string{"a", "b"}  // [a b ""]
  c := [...]int{1, 2, 3}    // le compilateur compte : [3]int
  d := [5]int{2: 9}         // [0 0 9 0 0], par indice
  ```

  Un tableau est une **valeur** : l'affecter ou le passer à une fonction **copie tous ses éléments**. Deux tableaux de
  même type se comparent avec `==` (élément par élément), et un tableau peut servir de **clé de map** (`[2]int` pour des
  coordonnées).

  En pratique, on manipule surtout des **slices**, qui sont des vues sur un tableau. Les tableaux servent pour des tailles
  connues et fixes : une empreinte (`[32]byte` de `sha256.Sum256`), des coordonnées, une table de correspondance de
  taille fixe, un tampon sur la pile.

  `len(a)` est une constante pour un tableau ; un indice constant hors limites est une erreur de compilation, un indice
  variable hors limites une panique.

  **Piège classique** : passer un gros tableau à une fonction (`func f(t [1000000]int)`) : tout est copié à chaque appel.
  On passe un slice ou un pointeur.

  **En entretien** : « Taille dans le type, valeur copiée à l'affectation, comparable et utilisable comme clé ; on
  utilise surtout des slices, qui sont des vues sur un tableau. »
tour:
  - title: Les tableaux
    text: |-
      Un tableau a une **taille fixe**, qui fait partie de son type : `[3]int` et `[4]int` sont deux types différents.
      Sa valeur zéro est un tableau rempli de valeurs zéro.

      Un tableau est une **valeur** : l'affecter ou le passer à une fonction le **copie** entièrement. En pratique, on
      manipule rarement des tableaux directement : on utilise des slices, qui s'appuient sur eux (page suivante).

      `[...]string{…}` laisse le compilateur compter les éléments.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	var scores [3]int
          	scores[0] = 12
          	fmt.Println(scores, len(scores))

          	jours := [...]string{"lun", "mar", "mer"}
          	copie := jours
          	copie[0] = "LUN"
          	fmt.Println(jours, copie)
          }
      output: |-
        [12 0 0] 3
        [lun mar mer] [LUN mar mer]
cards:
  - key: tableau-vs-slice
    format: course
    question: "Quelle différence entre un tableau et un slice ?"
    choices:
      - {text: "Le tableau a une taille fixe, inscrite dans son type, et se copie en entier ; le slice est une vue", correct: true}
      - {text: "Aucune : un slice n'est qu'un tableau dont on n'a pas écrit la taille dans le type", correct: false}
      - {text: "Le slice a une taille fixe, inscrite dans son type ; le tableau grandit avec `append`", correct: false}
      - {text: "Le tableau vit toujours sur la pile, le slice sur le tas, sans autre différence", correct: false}
    answer: "Le tableau a une taille fixe, qui fait partie de son type, et se copie en entier à l'affectation ; le slice est une vue (pointeur, longueur, capacité) sur un tableau, qui peut grandir avec `append`."
  - key: code-arr-3-int-1-2
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      arr := [3]int{1, 2, 3}
      arr2 := arr
      arr2[0] = 9
      fmt.Println(arr[0])
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas : un tableau ne s'affecte pas", correct: false}
    answer: "`1` : un tableau est une valeur, l'affectation le copie en entier ; avec un slice, ce serait 9."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tarr := [3]int{1, 2, 3}\n\tarr2 := arr\n\tarr2[0] = 9\n\tfmt.Println(arr[0])\n}\n"
      output: '1'
  - key: taille-type
    format: course
    question: Pourquoi `[3]int` et `[4]int` ne sont-ils pas le même type ?
    choices:
      - {text: "La taille fait partie du type : on ne peut pas affecter l'un à l'autre", correct: true}
      - {text: "Ils sont du même type, mais `[4]int` réserve une case de plus", correct: false}
      - {text: "Parce que `[3]int` est un slice, et `[4]int` un tableau", correct: false}
      - {text: "Ils sont du même type ; seule une conversion explicite les distingue", correct: false}
    answer: "La taille fait partie du type d'un tableau : `[3]int` et `[4]int` sont deux types distincts, qu'on ne peut ni affecter l'un à l'autre ni comparer."
  - key: copie
    format: course
    question: Que se passe-t-il quand on passe un tableau à une fonction ?
    choices:
      - {text: "Il est copié en entier ; la fonction travaille sur sa copie", correct: true}
      - {text: "La fonction reçoit une référence et modifie l'original", correct: false}
      - {text: "La fonction reçoit un slice qui partage le tableau", correct: false}
      - {text: "Il n'est copié que si la fonction le modifie", correct: false}
    answer: "Il est copié en entier : la fonction travaille sur sa copie, et un gros tableau coûte cher à chaque appel. Pour modifier l'original, on passe un slice ou un pointeur `*[N]T`."
  - key: usages
    format: course
    question: Quand utiliser un tableau plutôt qu'un slice ?
    choices:
      - {text: "Pour une taille fixe connue à la compilation : une empreinte `[32]byte`, une clé `[2]int`", correct: true}
      - {text: "Pour toute collection, car un tableau est toujours plus rapide qu'un slice", correct: false}
      - {text: "Pour une collection qui grandit, car un tableau se réalloue de lui-même", correct: false}
      - {text: "Pour passer de gros volumes de données à une fonction sans aucune copie", correct: false}
    answer: "Pour une taille fixe connue à la compilation : une empreinte `[32]byte`, des coordonnées `[2]int` comme clé de map, un petit tampon local. Un tableau ne grandit pas, et se copie à chaque passage en paramètre."
  - key: vf-comparable
    format: true-false
    question: Deux tableaux de même type se comparent avec `==`.
    truth: true
    answer: Élément par élément ; c'est pourquoi un tableau peut être une clé de map, contrairement à un slice.
  - key: vf-taille-variable
    format: true-false
    question: '`n := 5; var t [n]int` compile.'
    truth: false
    answer: La taille d'un tableau doit être une constante ; pour une taille variable, on utilise `make([]int, n)`.
  - key: vf-points
    format: true-false
    question: '`[...]int{1, 2, 3}` a le type `[3]int`.'
    truth: true
    answer: '`...` demande au compilateur de compter les éléments.'
  - key: vf-reference
    format: true-false
    question: Un tableau affecté à une autre variable partage ses éléments avec elle.
    truth: false
    answer: L'affectation copie le tableau ; seul un slice partagerait les données.
  - key: qcm-declarations
    format: multiple-choice
    question: Quelles déclarations créent un tableau ?
    choices:
      - text: '`var t [4]int`'
        correct: true
      - text: '`t := [...]string{"a", "b"}`'
        correct: true
      - text: '`t := []int{1, 2}`'
        correct: false
      - text: '`t := make([4]int)`'
        correct: false
    answer: '`[]int{...}` est un slice, et `make` ne crée pas de tableau.'
  - key: qcm-cle
    format: multiple-choice
    question: "Laquelle de ces maps peut indexer une grille par coordonnées `(x, y)`, comparées par valeur ?"
    choices:
      - {text: "`map[[2]int]bool`", correct: true}
      - {text: "`map[[]int]bool`", correct: false}
      - {text: "`map[*[2]int]bool`", correct: false}
      - {text: "`map[map[int]int]bool`", correct: false}
    answer: "Un tableau est comparable : `[2]int{3, 4}` est une clé qui se compare par valeur. Un slice et une map ne sont pas comparables, et un pointeur se compare par adresse."
  - key: qcm-indice
    format: multiple-choice
    question: Avec `t := [3]int{}`, que se passe-t-il pour `t[5]` ?
    choices:
      - {text: "Une erreur de compilation, l'indice constant est hors limites", correct: true}
      - {text: "Une panic à l'exécution, index out of range [5]", correct: false}
      - {text: "La valeur 0, la valeur zéro d'une case absente", correct: false}
      - {text: "Le tableau grandit jusqu'à six cases", correct: false}
    answer: Un indice variable hors limites, lui, panique à l'exécution.
  - key: qcm-indices
    format: multiple-choice
    question: 'Que contient `t := [5]int{1: 7, 3: 9}` ?'
    choices:
      - text: '`[0 7 0 9 0]`'
        correct: true
      - text: '`[7 9 0 0 0]`'
        correct: false
      - text: '`[1 7 3 9 0]`'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Un littéral peut donner les éléments par indice ; les autres valent zéro.
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour déclarer un tableau de 4 entiers :
      ```go
      var scores [___]int
      ```
    blanks:
      - - '4'
    answer: La taille fait partie du type.
  - key: trous-compter
    format: fill-in
    question: |-
      Complète pour que le compilateur compte les éléments :
      ```go
      jours := [___]string{"lun", "mar", "mer"}
      ```
    blanks:
      - - '...'
    answer: Le type devient `[3]string`.
  - key: trous-empreinte
    format: fill-in
    question: |-
      Complète le type renvoyé par `sha256.Sum256` :
      ```go
      var empreinte [___]byte = sha256.Sum256(donnees)
      ```
    blanks:
      - - '32'
    answer: Une empreinte SHA-256 fait 32 octets, une taille fixe.
  - key: trous-cle
    format: fill-in
    question: |-
      Complète pour indexer une grille par coordonnées :
      ```go
      visites := map[___]bool{}
      visites[[2]int{3, 4}] = true
      ```
    blanks:
      - - '[2]int'
    answer: Un tableau est comparable, donc utilisable comme clé.
  - key: code-comparaison
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a := [3]int{1, 2, 3}
      b := [...]int{1, 2, 3}
      fmt.Println(a == b, len(b))
      ```
    choices:
      - {text: "`true 3`", correct: true}
      - {text: "`false 3`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "Ça ne compile pas : `[3]int` et `[...]int` diffèrent", correct: false}
    answer: "`true 3` : `[...]` laisse le compilateur compter, donc `b` est aussi un `[3]int` ; deux tableaux du même type se comparent élément par élément."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta := [3]int{1, 2, 3}\n\tb := [...]int{1, 2, 3}\n\tfmt.Println(a == b, len(b))\n}\n"
      output: true 3
  - key: code-fonction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func raz(t [3]int) { t[0] = 0 }

      t := [3]int{5, 6, 7}
      raz(t)
      fmt.Println(t)
      ```
    choices:
      - {text: "`[5 6 7]`", correct: true}
      - {text: "`[0 6 7]`", correct: false}
      - {text: "`[0 0 0]`", correct: false}
      - {text: "`[5 6 0]`", correct: false}
    answer: "`[5 6 7]` : la fonction a reçu une copie du tableau, et l'a modifiée sans toucher l'original."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc raz(t [3]int) { t[0] = 0 }\n\nfunc main() {\n\tt := [3]int{5, 6, 7}\n\traz(t)\n\tfmt.Println(t)\n}\n"
      output: '[5 6 7]'
  - key: code-indices
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      t := [5]int{1: 7, 3: 9}
      fmt.Println(t, len(t))
      ```
    choices:
      - {text: "`[0 7 0 9 0] 5`", correct: true}
      - {text: "`[7 9 0 0 0] 5`", correct: false}
      - {text: "`[0 7 0 9 0] 2`", correct: false}
      - {text: "`[0 0 7 0 9] 5`", correct: false}
    answer: "`[0 7 0 9 0] 5` : les éléments sont donnés par indice (`1: 7`, `3: 9`), les autres valent zéro, et la longueur est celle du type."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tt := [5]int{1: 7, 3: 9}\n\tfmt.Println(t, len(t))\n}\n"
      output: '[0 7 0 9 0] 5'
  - key: bug-copie-fonction
    format: bug-fix
    question: |-
      La fonction de normalisation ne change rien aux mesures. Quelle correction est la bonne ?
      ```go
      func normaliser(m [100]float64) {
      	for i := range m {
      		m[i] /= 100
      	}
      }
      ```
    choices:
      - {text: "Recevoir un `[]float64` (ou un `*[100]float64`) et passer `mesures[:]`", correct: true}
      - {text: "Remplacer `range m` par une boucle `for i := 0; i < 100; i++`", correct: false}
      - {text: "Déclarer le paramètre en `[...]float64`, de taille déduite", correct: false}
      - {text: "Renvoyer `m` à la fin de la fonction, sans changer l'appel", correct: false}
    answer: "```go\nfunc normaliser(m []float64) {\n\tfor i := range m {\n\t\tm[i] /= 100\n\t}\n}\n\nnormaliser(mesures[:])\n```\nLe tableau était copié ; un slice (ou un pointeur `*[100]float64`) donne accès aux éléments de l'appelant."
  - key: bug-taille-variable
    format: bug-fix
    question: |-
      Le compilateur signale « invalid array length n ». Quelle correction est la bonne ?
      ```go
      func tampon(n int) []byte {
      	var t [n]byte
      	return t[:]
      }
      ```
    choices:
      - {text: "Allouer un slice : `return make([]byte, n)`", correct: true}
      - {text: "Déclarer `var t [...]byte`, de taille déduite", correct: false}
      - {text: "Allouer le tableau sur le tas : `new([n]byte)`", correct: false}
      - {text: "Copier le paramètre dans une constante : `const m = n`", correct: false}
    answer: "```go\nfunc tampon(n int) []byte {\n\treturn make([]byte, n)\n}\n```\nLa taille d'un tableau est une constante de compilation ; une taille variable demande un slice."
  - key: bug-gros-tableau
    format: bug-fix
    question: |-
      Le profileur montre beaucoup de temps passé à copier de la mémoire. Quelle correction est la bonne ?
      ```go
      type Image struct{ Pixels [4096 * 4096]uint32 }

      func luminosite(img Image) float64 { ... }
      ```
    choices:
      - {text: "Passer un pointeur : `func luminosite(img *Image) float64`", correct: true}
      - {text: "Déclarer `Pixels` en `[...]uint32`, pour éviter la copie", correct: false}
      - {text: "Appeler `luminosite(img)` dans une goroutine séparée", correct: false}
      - {text: "Marquer le paramètre `const`, pour qu'il ne soit pas copié", correct: false}
    answer: |-
      ```go
      func luminosite(img *Image) float64 { ... }
      ```
      Passer la struct par valeur copiait 64 Mo de pixels à chaque appel ; un pointeur évite la copie.
  - key: bug-cle-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid map key type []int ». Quelle correction est la bonne ?
      ```go
      vus := map[[]int]bool{}
      vus[[]int{x, y}] = true
      ```
    choices:
      - {text: "Une clé tableau : `map[[2]int]bool`, et `vus[[2]int{x, y}] = true`", correct: true}
      - {text: "Une clé pointeur : `map[*[]int]bool`, et `vus[&[]int{x, y}] = true`", correct: false}
      - {text: "Une clé `any` : `map[any]bool`, qui accepte aussi le slice", correct: false}
      - {text: "Une clé entière : `map[int]bool`, et `vus[x+y] = true`", correct: false}
    answer: |-
      ```go
      vus := map[[2]int]bool{}
      vus[[2]int{x, y}] = true
      ```
      Un slice n'est pas comparable ; un tableau de taille fixe, ou une struct `Point{X, Y int}`, convient comme clé. Une clé `any` compilerait, mais paniquerait à l'exécution.
