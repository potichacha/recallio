notion: structs-bases
lesson: "Une **struct** regroupe des champs nommés : c'est le type composite de base pour modéliser des données.\n\n```go\ntype Client struct {\n\tID     int\n\tNom    string\n\tEmail  string\n\tActif  bool\n}\n\nc1 := Client{ID: 1, Nom: \"Ada\", Actif: true} // par nom : les champs omis valent zéro\nc2 := Client{2, \"Bob\", \"bob@ex.fr\", false}   // par position : tous les champs, dans l'ordre\nvar c3 Client                                 // valeur zéro\np := &Client{Nom: \"Eve\"}                      // pointeur vers une struct\np.Nom = \"Ève\"                                 // pas besoin de (*p).Nom\n```\n\n- On préfère l'initialisation **par nom** : elle résiste à l'ajout de champs et se lit mieux (`go vet` signale les\n  littéraux par position de structs d'autres packages).\n- L'accès aux champs passe par `.`, même à travers un pointeur (déréférencement automatique).\n- Une struct est une **valeur** : l'affecter ou la passer à une fonction la **copie**.\n- Les champs non exportés (minuscule) ne sont visibles que dans le package.\n- Une struct peut contenir d'autres structs, des slices, des maps, des pointeurs.\n\n**Piège classique** : modifier une struct dans une fonction qui la reçoit par valeur. L'appelant ne voit rien ; il faut\nun pointeur, ou renvoyer la struct modifiée.\n\n**En entretien** : « Des champs nommés ; un littéral par nom, où les champs omis valent zéro ; une valeur copiée à\nl'affectation ; le point fonctionne aussi à travers un pointeur. »"
tour:
  - title: Les structs
    text: |-
      Une **struct** regroupe des champs nommés. On la crée avec un littéral, en nommant les champs :
      `Personne{Nom: "Ada", Age: 36}`. Un champ omis prend sa valeur zéro.

      On lit et on écrit un champ avec un point : `ada.Age++`. Une struct est une **valeur** : l'affecter la copie. Deux
      structs du même type se comparent avec `==` si tous leurs champs sont comparables.

      `%+v` affiche les noms des champs.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Personne struct {
          	Nom string
          	Age int
          }

          func main() {
          	ada := Personne{Nom: "Ada", Age: 36}
          	ada.Age++
          	fmt.Printf("%+v\n", ada)

          	copie := ada
          	copie.Nom = "Grace"
          	fmt.Println(ada.Nom, copie.Nom)
          	fmt.Println(ada == Personne{Nom: "Ada", Age: 37})
          }
      output: |-
        {Nom:Ada Age:37}
        Ada Grace
        true
    task:
      instructions: |-
        Ajoute à `Personne` un champ `Langage` de type `string`, donne-lui la valeur `"Go"` pour Ada : le programme doit
        afficher `{Nom:Ada Age:36 Langage:Go}`.
      starter:
        main.go: |-
          package main

          import "fmt"

          type Personne struct {
          	Nom string
          	Age int
          }

          func main() {
          	ada := Personne{Nom: "Ada", Age: 36}
          	fmt.Printf("%+v\n", ada)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          type Personne struct {
          	Nom     string
          	Age     int
          	Langage string
          }

          func main() {
          	ada := Personne{Nom: "Ada", Age: 36, Langage: "Go"}
          	fmt.Printf("%+v\n", ada)
          }
      output: |-
        {Nom:Ada Age:36 Langage:Go}
cards:
  - key: par-nom
    format: course
    question: 'Pourquoi préférer `Client{Nom: "Ada"}` à `Client{1, "Ada", "", false}` ?'
    choices:
      - {text: "Il se lit mieux, permet d'omettre des champs et ne casse pas si l'on en ajoute", correct: true}
      - {text: "Il est plus rapide : le compilateur n'initialise que les champs nommés", correct: false}
      - {text: "Le littéral par position ne compile pas hors du package du type", correct: false}
      - {text: "Il rend obligatoires, à la compilation, tous les champs qu'on a omis", correct: false}
    answer: "L'initialisation par nom se lit mieux, permet d'omettre des champs (qui valent zéro) et ne casse pas quand on ajoute un champ. Le littéral par position compile aussi ailleurs, mais `go vet` le signale pour les types d'autres packages."
  - key: pointeur-point
    format: course
    question: Faut-il écrire `(*p).Nom` pour accéder au champ d'un pointeur de struct ?
    choices:
      - {text: "Non : `p.Nom` suffit, Go déréférence automatiquement", correct: true}
      - {text: "Oui : `p.Nom` sur un pointeur ne compile pas", correct: false}
      - {text: "Non : on écrit `p->Nom`, comme en C", correct: false}
      - {text: "Oui, sauf pour les champs non exportés", correct: false}
    answer: "Non : `p.Nom` suffit, Go déréférence automatiquement ; `(*p).Nom` compile aussi, mais personne ne l'écrit. Go n'a pas d'opérateur `->`."
  - key: copie
    format: course
    question: Que se passe-t-il quand on affecte une struct à une autre variable ?
    choices:
      - {text: "Elle est copiée champ par champ ; les deux variables évoluent séparément", correct: true}
      - {text: "Les deux variables désignent la même struct, comme deux références Java", correct: false}
      - {text: "Elle est copiée en profondeur, slices et maps compris", correct: false}
      - {text: "Rien n'est copié avant la première modification, puis tout l'est", correct: false}
    answer: "Une struct est une valeur : l'affectation la copie champ par champ, et les deux variables évoluent indépendamment. Seul ce que partagent les champs pointeurs, slices ou maps reste commun : la copie est superficielle."
  - key: omis
    format: course
    question: Que valent les champs omis dans un littéral par nom ?
    choices:
      - {text: "Leur valeur zéro : 0, \"\", false, nil...", correct: true}
      - {text: "Ils restent indéfinis jusqu'à leur première affectation", correct: false}
      - {text: "Le compilateur refuse un littéral qui omet des champs", correct: false}
      - {text: "La valeur donnée par le constructeur `New` du type", correct: false}
    answer: "Leur valeur zéro (0, \"\", false, nil...) : Go n'a pas de valeur indéfinie. Un constructeur `NewX` n'est qu'une convention, jamais appelé automatiquement."
  - key: vf-position
    format: true-false
    question: Un littéral par position doit donner tous les champs, dans l'ordre.
    truth: true
    answer: C'est ce qui le rend fragile quand la struct évolue.
  - key: vf-classe
    format: true-false
    question: Une struct Go peut déclarer des méthodes à l'intérieur de ses accolades, comme une classe.
    truth: false
    answer: 'Les méthodes se déclarent à part, avec un receveur : `func (c Client) Nom() string`.'
  - key: vf-reference
    format: true-false
    question: Passer une struct à une fonction lui donne accès à la struct de l'appelant.
    truth: false
    answer: La fonction reçoit une copie ; il faut un pointeur pour modifier l'original.
  - key: vf-pointeur-litteral
    format: true-false
    question: '`&Client{Nom: "Ada"}` crée une struct et renvoie son adresse.'
    truth: true
    answer: C'est la façon idiomatique d'obtenir un pointeur vers une nouvelle struct.
  - key: qcm-litteraux
    format: multiple-choice
    question: Quels littéraux sont valides pour `type P struct{ X, Y int }` ?
    choices:
      - text: '`P{X: 1}`'
        correct: true
      - text: '`P{1, 2}`'
        correct: true
      - text: '`P{1}`'
        correct: false
      - text: '`P{X: 1, 2}`'
        correct: false
    answer: Par position, il faut tous les champs ; on ne mélange pas les deux formes.
  - key: qcm-acces
    format: multiple-choice
    question: "Avec `p := &P{X: 1}`, laquelle de ces instructions compile ?"
    choices:
      - {text: "`p.X = 2`", correct: true}
      - {text: "`p->X = 2`", correct: false}
      - {text: "`p::X = 2`", correct: false}
      - {text: "`*p.X = 2`", correct: false}
    answer: "Le point suffit : Go déréférence automatiquement (`(*p).X = 2` compile aussi). `*p.X` se lit `*(p.X)`, l'indirection d'un `int`, qui ne compile pas."
  - key: qcm-copie
    format: multiple-choice
    question: 'Après `a := P{X: 1}; b := a; b.X = 9`, que vaut `a.X` ?'
    choices:
      - text: '1'
        correct: true
      - text: '9'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: '`b` est une copie de `a`.'
  - key: qcm-anonyme
    format: multiple-choice
    question: Que contient `var c Client` ?
    choices:
      - {text: "Une struct dont tous les champs valent leur valeur zéro", correct: true}
      - {text: "Un pointeur nil, en attendant un `new(Client)`", correct: false}
      - {text: "Rien : il faut d'abord appeler un constructeur", correct: false}
      - {text: "Une erreur de compilation : `c` n'est pas initialisé", correct: false}
    answer: Une variable struct est toujours utilisable.
  - key: trous-type
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      type Produit ___ {
      	Ref  string
      	Prix int
      }
      ```
    blanks:
      - - struct
    answer: '`type Nom struct { ... }`.'
  - key: trous-litteral
    format: fill-in
    question: |-
      Complète le littéral par nom :
      ```go
      p := Produit{Ref___ "A12", Prix: 990}
      ```
    blanks:
      - - ':'
    answer: '`Champ: valeur`, séparés par des virgules.'
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complète pour obtenir un pointeur vers une nouvelle struct :
      ```go
      p := ___Produit{Ref: "A12"}
      ```
    blanks:
      - - '&'
    answer: '`&T{...}` alloue la struct et renvoie son adresse.'
  - key: trous-acces
    format: fill-in
    question: |-
      Complète pour augmenter le prix à travers le pointeur :
      ```go
      p___Prix += 100
      ```
    blanks:
      - - .
    answer: Le point déréférence automatiquement le pointeur.
  - key: code-omis
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Client struct {
      	ID    int
      	Nom   string
      	Actif bool
      }

      c := Client{Nom: "Ada"}
      fmt.Printf("%+v\n", c)
      ```
    choices:
      - {text: "`{ID:0 Nom:Ada Actif:false}`", correct: true}
      - {text: "`{Nom:Ada}`", correct: false}
      - {text: "`{0 Ada false}`", correct: false}
      - {text: "`{ID: Nom:Ada Actif:}`", correct: false}
    answer: "`%+v` affiche le nom et la valeur de chaque champ, et les champs omis valent zéro : `ID:0`, `Actif:false`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Client struct {\n\tID    int\n\tNom   string\n\tActif bool\n}\n\nfunc main() {\n\tc := Client{Nom: \"Ada\"}\n\tfmt.Printf(\"%+v\\n\", c)\n}\n"
      output: '{ID:0 Nom:Ada Actif:false}'
  - key: code-copie
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type P struct{ X, Y int }

      a := P{1, 2}
      b := a
      b.X = 9
      p := &a
      p.Y = 7
      fmt.Println(a, b)
      ```
    choices:
      - {text: "`{1 7} {9 2}`", correct: true}
      - {text: "`{9 7} {9 7}`", correct: false}
      - {text: "`{1 2} {9 2}`", correct: false}
      - {text: "`{9 7} {9 2}`", correct: false}
    answer: "`{1 7} {9 2}` : `b` est une copie de `a`, indépendante ; `p` pointe sur `a`, donc `p.Y = 7` modifie `a`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X, Y int }\n\nfunc main() {\n\ta := P{1, 2}\n\tb := a\n\tb.X = 9\n\tp := &a\n\tp.Y = 7\n\tfmt.Println(a, b)\n}\n"
      output: '{1 7} {9 2}'
  - key: code-fonction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compteur struct{ N int }

      func incrementer(c Compteur) { c.N++ }
      func incrementerP(c *Compteur) { c.N++ }

      c := Compteur{}
      incrementer(c)
      incrementerP(&c)
      fmt.Println(c.N)
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas : `incrementer` attend un pointeur", correct: false}
    answer: "`1` : `incrementer` reçoit une copie, et seule la version par pointeur modifie l'original."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ N int }\n\n\nfunc incrementer(c Compteur) { c.N++ }\n\nfunc incrementerP(c *Compteur) { c.N++ }\n\nfunc main() {\n\tc := Compteur{}\n\tincrementer(c)\n\tincrementerP(&c)\n\tfmt.Println(c.N)\n}\n"
      output: '1'
  - key: code-imbrique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Adresse struct{ Ville string }
      type Client struct {
      	Nom     string
      	Adresse Adresse
      }

      c := Client{Nom: "Ada", Adresse: Adresse{Ville: "Lyon"}}
      c.Adresse.Ville = "Lille"
      fmt.Println(c.Nom, c.Adresse.Ville)
      ```
    choices:
      - {text: "`Ada Lille`", correct: true}
      - {text: "`Ada Lyon`", correct: false}
      - {text: "`Ada {Lille}`", correct: false}
      - {text: "`Ada {Lyon}`", correct: false}
    answer: "`Ada Lille` : on accède aux champs d'une struct imbriquée par des points successifs, et `c.Adresse.Ville = ...` modifie la struct rangée dans `c`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Adresse struct{ Ville string }\n\ntype Client struct {\n\tNom     string\n\tAdresse Adresse\n}\n\nfunc main() {\n\tc := Client{Nom: \"Ada\", Adresse: Adresse{Ville: \"Lyon\"}}\n\tc.Adresse.Ville = \"Lille\"\n\tfmt.Println(c.Nom, c.Adresse.Ville)\n}\n"
      output: Ada Lille
