notion: structs-bases
lesson: "Une **struct** regroupe des champs nommés : c'est le type composite de base pour modéliser des données.\n\n```go\ntype Client struct {\n\tID     int\n\tNom    string\n\tEmail  string\n\tActif  bool\n}\n\nc1 := Client{ID: 1, Nom: \"Ada\", Actif: true} // par nom : les champs omis valent zéro\nc2 := Client{2, \"Bob\", \"bob@ex.fr\", false}   // par position : tous les champs, dans l'ordre\nvar c3 Client                                 // valeur zéro\np := &Client{Nom: \"Eve\"}                      // pointeur vers une struct\np.Nom = \"Ève\"                                 // pas besoin de (*p).Nom\n```\n\n- On préfère l'initialisation **par nom** : elle résiste à l'ajout de champs et se lit mieux (`go vet` signale les\n  littéraux par position de structs d'autres packages).\n- L'accès aux champs passe par `.`, même à travers un pointeur (déréférencement automatique).\n- Une struct est une **valeur** : l'affecter ou la passer à une fonction la **copie**.\n- Les champs non exportés (minuscule) ne sont visibles que dans le package.\n- Une struct peut contenir d'autres structs, des slices, des maps, des pointeurs.\n\n**Piège classique** : modifier une struct dans une fonction qui la reçoit par valeur. L'appelant ne voit rien ; il faut\nun pointeur, ou renvoyer la struct modifiée.\n\n**En entretien** : « Des champs nommés ; un littéral par nom, où les champs omis valent zéro ; une valeur copiée à\nl'affectation ; le point fonctionne aussi à travers un pointeur. »"
cards:
  - key: par-nom
    format: course
    question: 'Pourquoi préférer `Client{Nom: "Ada"}` à `Client{1, "Ada", "", false}` ?'
    answer: L'initialisation par nom se lit mieux, permet d'omettre des champs (qui valent zéro) et ne casse pas quand on ajoute un champ.
  - key: pointeur-point
    format: course
    question: Faut-il écrire `(*p).Nom` pour accéder au champ d'un pointeur de struct ?
    answer: 'Non : `p.Nom` suffit, Go déréférence automatiquement.'
  - key: copie
    format: course
    question: Que se passe-t-il quand on affecte une struct à une autre variable ?
    answer: Elle est copiée champ par champ ; les deux variables évoluent indépendamment (sauf ce que partagent les champs pointeurs, slices ou maps).
  - key: omis
    format: course
    question: Que valent les champs omis dans un littéral par nom ?
    answer: Leur valeur zéro (0, "", false, nil...).
  - key: vf-position
    format: true-false
    question: Un littéral par position doit donner tous les champs, dans l'ordre.
    truth: true
    answer: C'est ce qui le rend fragile quand la struct évolue.
  - key: vf-classe
    format: true-false
    question: Une struct Go peut déclarer des méthodes à l'intérieur de ses accolades, comme une classe.
    truth: false
    answer: 'Les méthodes se déclarent à part, avec un receveur : `func (c Client) Nom() string`.'
  - key: vf-reference
    format: true-false
    question: Passer une struct à une fonction lui donne accès à la struct de l'appelant.
    truth: false
    answer: La fonction reçoit une copie ; il faut un pointeur pour modifier l'original.
  - key: vf-pointeur-litteral
    format: true-false
    question: '`&Client{Nom: "Ada"}` crée une struct et renvoie son adresse.'
    truth: true
    answer: C'est la façon idiomatique d'obtenir un pointeur vers une nouvelle struct.
  - key: qcm-litteraux
    format: multiple-choice
    question: Quels littéraux sont valides pour `type P struct{ X, Y int }` ?
    choices:
      - text: '`P{X: 1}`'
        correct: true
      - text: '`P{1, 2}`'
        correct: true
      - text: '`P{1}`'
        correct: false
      - text: '`P{X: 1, 2}`'
        correct: false
    answer: Par position, il faut tous les champs ; on ne mélange pas les deux formes.
  - key: qcm-acces
    format: multiple-choice
    question: 'Avec `p := &P{X: 1}`, qu''est-ce qui compile ?'
    choices:
      - text: '`p.X = 2`'
        correct: true
      - text: '`(*p).X = 2`'
        correct: true
      - text: '`p->X = 2`'
        correct: false
      - text: '`p::X = 2`'
        correct: false
    answer: Le point suffit, avec ou sans déréférencement explicite.
  - key: qcm-copie
    format: multiple-choice
    question: 'Après `a := P{X: 1}; b := a; b.X = 9`, que vaut `a.X` ?'
    choices:
      - text: '1'
        correct: true
      - text: '9'
        correct: false
      - text: '0'
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: '`b` est une copie de `a`.'
  - key: qcm-anonyme
    format: multiple-choice
    question: Que contient `var c Client` ?
    choices:
      - text: Une struct dont tous les champs valent leur valeur zéro
        correct: true
      - text: Un pointeur nil
        correct: false
      - text: Rien, il faut un constructeur
        correct: false
      - text: Une erreur
        correct: false
    answer: Une variable struct est toujours utilisable.
  - key: trous-type
    format: fill-in
    question: "Complétez la déclaration :\n```go\ntype Produit ___ {\n\tRef  string\n\tPrix int\n}\n```"
    blanks:
      - - struct
    answer: '`type Nom struct { ... }`.'
  - key: trous-litteral
    format: fill-in
    question: |-
      Complétez le littéral par nom :
      ```go
      p := Produit{Ref___ "A12", Prix: 990}
      ```
    blanks:
      - - ':'
    answer: '`Champ: valeur`, séparés par des virgules.'
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complétez pour obtenir un pointeur vers une nouvelle struct :
      ```go
      p := ___Produit{Ref: "A12"}
      ```
    blanks:
      - - '&'
    answer: '`&T{...}` alloue la struct et renvoie son adresse.'
  - key: trous-acces
    format: fill-in
    question: |-
      Complétez pour augmenter le prix à travers le pointeur :
      ```go
      p___Prix += 100
      ```
    blanks:
      - - .
    answer: Le point déréférence automatiquement le pointeur.
  - key: code-omis
    format: code-output
    question: "```go\ntype Client struct {\n\tID    int\n\tNom   string\n\tActif bool\n}\n\nc := Client{Nom: \"Ada\"}\nfmt.Printf(\"%+v\\n\", c)\n```"
    answer: '`{ID:0 Nom:Ada Actif:false}` : les champs omis valent zéro.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Client struct {\n\tID    int\n\tNom   string\n\tActif bool\n}\n\nfunc main() {\n\tc := Client{Nom: \"Ada\"}\n\tfmt.Printf(\"%+v\\n\", c)\n}\n"
      output: '{ID:0 Nom:Ada Actif:false}'
  - key: code-copie
    format: code-output
    question: |-
      ```go
      type P struct{ X, Y int }

      a := P{1, 2}
      b := a
      b.X = 9
      p := &a
      p.Y = 7
      fmt.Println(a, b)
      ```
    answer: '`{1 7} {9 2}` : `b` est une copie, `p` pointe sur `a`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X, Y int }\n\nfunc main() {\n\ta := P{1, 2}\n\tb := a\n\tb.X = 9\n\tp := &a\n\tp.Y = 7\n\tfmt.Println(a, b)\n}\n"
      output: '{1 7} {9 2}'
  - key: code-fonction
    format: code-output
    question: |-
      ```go
      type Compteur struct{ N int }

      func incrementer(c Compteur) { c.N++ }
      func incrementerP(c *Compteur) { c.N++ }

      c := Compteur{}
      incrementer(c)
      incrementerP(&c)
      fmt.Println(c.N)
      ```
    answer: '`1` : seule la version par pointeur modifie l''original.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ N int }\n\n\nfunc incrementer(c Compteur) { c.N++ }\n\nfunc incrementerP(c *Compteur) { c.N++ }\n\nfunc main() {\n\tc := Compteur{}\n\tincrementer(c)\n\tincrementerP(&c)\n\tfmt.Println(c.N)\n}\n"
      output: '1'
  - key: code-imbrique
    format: code-output
    question: "```go\ntype Adresse struct{ Ville string }\ntype Client struct {\n\tNom     string\n\tAdresse Adresse\n}\n\nc := Client{Nom: \"Ada\", Adresse: Adresse{Ville: \"Lyon\"}}\nc.Adresse.Ville = \"Lille\"\nfmt.Println(c.Nom, c.Adresse.Ville)\n```"
    answer: '`Ada Lille` : on accède aux champs d''une struct imbriquée par des points successifs.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Adresse struct{ Ville string }\n\ntype Client struct {\n\tNom     string\n\tAdresse Adresse\n}\n\nfunc main() {\n\tc := Client{Nom: \"Ada\", Adresse: Adresse{Ville: \"Lyon\"}}\n\tc.Adresse.Ville = \"Lille\"\n\tfmt.Println(c.Nom, c.Adresse.Ville)\n}\n"
      output: Ada Lille
