notion: slice-nil-vide
lesson: |-
  Deux slices sans élément ne sont pas tout à fait identiques :

  ```go
  var a []int        // nil : pointeur nil, len 0, cap 0
  b := []int{}       // vide non nil : pointe sur un tableau de taille 0
  c := make([]int, 0)
  ```

  Pour **presque tout**, ils se comportent pareil : `len` vaut 0, `range` ne fait rien, `append` fonctionne. La
  différence apparaît :
  - avec `== nil` : seul `a` est nil ;
  - en **JSON** : `json.Marshal(a)` donne `null`, `json.Marshal(b)` donne `[]` ;
  - avec `reflect.DeepEqual`, qui distingue nil et vide.

  Bonnes pratiques :
  - **tester la vacuité avec `len(s) == 0`**, jamais avec `s == nil` ;
  - préférer `var s []T` (nil) comme valeur de départ : c'est la valeur zéro, sans allocation ;
  - dans une API JSON, choisir explicitement `[]` (slice vide) quand le client attend toujours un tableau ;
  - `slices.Equal` traite nil et vide comme égaux.

  **Piège classique** : une API qui renvoie tantôt `null`, tantôt `[]` pour une liste vide, selon le chemin de code qui
  a produit le slice. Les clients JavaScript plantent sur `null.length`.

  **En entretien** : « Un slice nil et un slice vide ont tous deux len 0 et se comportent pareil, sauf pour == nil, le JSON
  (null contre []) et DeepEqual ; on teste len(s) == 0. »
cards:
  - key: nil-slice-vs-slice-vide
    format: course
    question: "Quelle différence entre un slice nil et un slice vide ?"
    choices:
      - {text: "Les deux ont une longueur 0 ; le nil devient `null` en JSON, le vide `[]`", correct: true}
      - {text: "Le nil panique sur `append` et sur `len`, le vide fonctionne normalement", correct: false}
      - {text: "Aucune : `var s []int` et `[]int{}` valent tous deux nil", correct: false}
      - {text: "Le vide a une capacité d'au moins 1, le nil ne peut pas grandir", correct: false}
    answer: "Les deux ont une longueur 0 et marchent avec `len`, `range` et `append` ; seul le nil vaut nil. La différence se voit surtout en JSON (`null` contre `[]`) et avec `reflect.DeepEqual`."
  - key: code-var-sl-int-fmt-println
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var sl []int
      fmt.Println(sl == nil, len(sl), cap(sl))
      sl = append(sl, 1)
      fmt.Println(sl)
      ```
    choices:
      - text: |-
          ```
          true 0 0
          [1]
          ```
        correct: true
      - text: |-
          ```
          true 0 0
          [0 1]
          ```
        correct: false
      - text: |-
          ```
          false 0 0
          [1]
          ```
        correct: false
      - {text: "`true 0 0`, puis une panic : append sur un slice nil", correct: false}
    answer: "`var sl []int` déclare un slice nil, de longueur et de capacité 0 ; `append` marche dessus et alloue un tableau."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar sl []int\n\tfmt.Println(sl == nil, len(sl), cap(sl))\n\tsl = append(sl, 1)\n\tfmt.Println(sl)\n}\n"
      output: |-
        true 0 0
        [1]
  - key: json
    format: course
    question: Comment `encoding/json` encode-t-il un slice nil et un slice vide ?
    choices:
      - {text: "Le nil en `null`, le vide en `[]`", correct: true}
      - {text: "Les deux en `[]`", correct: false}
      - {text: "Les deux en `null`", correct: false}
      - {text: "Le nil est omis, le vide devient `[]`", correct: false}
    answer: "Le slice nil s'encode en `null`, le vide en `[]` ; une API qui promet toujours un tableau initialise ses slices vides avant l'encodage. Sans `omitempty`, le champ n'est jamais omis."
  - key: tester
    format: course
    question: Comment tester qu'un slice n'a aucun élément ?
    choices:
      - {text: "Avec `len(s) == 0`, vrai pour un slice nil comme pour un vide", correct: true}
      - {text: "Avec `s == nil`, vrai pour tout slice qui n'a aucun élément", correct: false}
      - {text: "Avec `s == []int{}`, qui compare au slice vide", correct: false}
      - {text: "Avec `cap(s) == 0`, qui dit qu'aucune place n'est utilisée", correct: false}
    answer: "`len(s) == 0` couvre le nil et le vide. `s == nil` rate un slice vide créé par `make` ou `[]T{}`, `s == []int{}` ne compile pas, et la capacité peut être non nulle sur un slice vide."
  - key: depart
    format: course
    question: Quelle déclaration préférer pour un slice qu'on va remplir avec append ?
    choices:
      - {text: "`var s []T`, ou `make([]T, 0, n)` si l'on connaît la taille", correct: true}
      - {text: "`s := make([]T, n)`, pour réserver la place des n éléments", correct: false}
      - {text: "`s := []T{}`, car `append` panique sur un slice nil", correct: false}
      - {text: "`s := new([]T)`, pour obtenir un slice déjà alloué", correct: false}
    answer: "`var s []T` ne coûte rien, et `append` alloue au besoin ; `make([]T, 0, n)` évite les réallocations quand on connaît la taille. `make([]T, n)` créerait n zéros avant les éléments ajoutés."
  - key: vf-append-nil
    format: true-false
    question: On peut faire `append` sur un slice nil.
    truth: true
    answer: Il alloue un tableau au premier ajout.
  - key: vf-egaux
    format: true-false
    question: '`slices.Equal([]int(nil), []int{})` vaut `true`.'
    truth: true
    answer: '`slices.Equal` compare longueurs et éléments ; nil et vide ont tous deux zéro élément.'
  - key: vf-deepequal
    format: true-false
    question: '`reflect.DeepEqual([]int(nil), []int{})` vaut `true`.'
    truth: false
    answer: '`DeepEqual` distingue un slice nil d''un slice vide.'
  - key: vf-range
    format: true-false
    question: Parcourir un slice nil avec range panique.
    truth: false
    answer: La boucle ne fait simplement aucune itération.
  - key: qcm-nil
    format: multiple-choice
    question: Lesquels sont des slices nil ?
    choices:
      - text: '`var s []string`'
        correct: true
      - text: '`s := []string(nil)`'
        correct: true
      - text: '`s := []string{}`'
        correct: false
      - text: '`s := make([]string, 0)`'
        correct: false
    answer: Un littéral vide ou `make` donnent un slice vide non nil.
  - key: qcm-json
    format: multiple-choice
    question: Que donne `json.Marshal(struct{ Tags []string }{})` ?
    choices:
      - text: '`{"Tags":null}`'
        correct: true
      - text: '`{"Tags":[]}`'
        correct: false
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
    answer: Le champ vaut sa valeur zéro, un slice nil, encodé en null.
  - key: qcm-vacuite
    format: multiple-choice
    question: Quel test de vacuité est correct pour tout slice ?
    choices:
      - text: '`len(s) == 0`'
        correct: true
      - text: '`s == nil`'
        correct: false
      - text: '`s == []int{}`'
        correct: false
      - text: '`cap(s) == 0`'
        correct: false
    answer: '`s == nil` rate les slices vides non nil ; `cap` peut être non nulle sur un slice vide.'
  - key: qcm-api
    format: multiple-choice
    question: Comment garantir qu'un champ liste d'une réponse JSON vaut toujours `[]` quand il est vide ?
    choices:
      - {text: "Initialiser le slice à `[]T{}` (ou le normaliser) avant l'encodage", correct: true}
      - {text: "Ajouter l'option `omitempty` au tag du champ", correct: false}
      - {text: "Rien : `encoding/json` écrit déjà `[]` pour un slice nil", correct: false}
      - {text: "Ajouter l'option `,string` au tag du champ", correct: false}
    answer: "Un slice non nil s'encode en `[]` : on l'initialise, ou le DTO de réponse normalise (`if r.Items == nil { r.Items = []T{} }`). `omitempty` ferait disparaître le champ, ce qui n'est pas `[]` non plus."
  - key: code-json
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a []int
      b := []int{}
      ja, _ := json.Marshal(a)
      jb, _ := json.Marshal(b)
      fmt.Println(string(ja), string(jb))
      ```
    choices:
      - {text: "`null []`", correct: true}
      - {text: "`[] []`", correct: false}
      - {text: "`null null`", correct: false}
      - {text: "`[] null`", correct: false}
    answer: "`null []` : le slice nil devient `null`, le slice vide un tableau vide."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar a []int\n\tb := []int{}\n\tja, _ := json.Marshal(a)\n\tjb, _ := json.Marshal(b)\n\tfmt.Println(string(ja), string(jb))\n}\n"
      output: null []
  - key: code-comportement
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a []string
      b := []string{}
      fmt.Println(len(a), len(b), a == nil, b == nil)
      a = append(a, "x")
      fmt.Println(a)
      ```
    choices:
      - text: |-
          ```
          0 0 true false
          [x]
          ```
        correct: true
      - text: |-
          ```
          0 0 true true
          [x]
          ```
        correct: false
      - text: |-
          ```
          0 0 false false
          [x]
          ```
        correct: false
      - {text: "`0 0 true false`, puis une panic : append sur un slice nil", correct: false}
    answer: "Même longueur, seul `a` est nil, et `append` marche sur les deux : il alloue pour le slice nil."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a []string\n\tb := []string{}\n\tfmt.Println(len(a), len(b), a == nil, b == nil)\n\ta = append(a, \"x\")\n\tfmt.Println(a)\n}\n"
      output: |-
        0 0 true false
        [x]
  - key: code-deepequal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a []int
      b := []int{}
      fmt.Println(slices.Equal(a, b), reflect.DeepEqual(a, b))
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `slices.Equal` compare longueurs et éléments, et juge égaux le nil et le vide ; `reflect.DeepEqual` les distingue."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n\t\"slices\"\n)\n\nfunc main() {\n\tvar a []int\n\tb := []int{}\n\tfmt.Println(slices.Equal(a, b), reflect.DeepEqual(a, b))\n}\n"
      output: true false
  - key: bug-null
    format: bug-fix
    question: |-
      Le front plante sur `resultats.length` quand la recherche ne trouve rien. Quelle correction est la bonne ?
      ```go
      var resultats []Produit
      for _, p := range catalogue {
      	if correspond(p, q) {
      		resultats = append(resultats, p)
      	}
      }
      json.NewEncoder(w).Encode(resultats)
      ```
    choices:
      - {text: "Partir d'un slice vide : `resultats := []Produit{}`", correct: true}
      - {text: "Encoder avec `json.Marshal` plutôt qu'avec `json.NewEncoder`", correct: false}
      - {text: "Encoder `&resultats`, un pointeur vers le slice", correct: false}
      - {text: "Déclarer `var resultats []Produit = nil`, explicitement", correct: false}
    answer: |-
      ```go
      resultats := []Produit{}
      ```
      Sans correspondance, le slice restait nil et s'encodait en `null` ; un slice vide s'encode en `[]`.
  - key: bug-test-nil
    format: bug-fix
    question: |-
      Un panier vide créé par `make` est considéré comme non vide. Quelle correction est la bonne ?
      ```go
      if panier.Articles == nil {
      	return errPanierVide
      }
      ```
    choices:
      - {text: "Tester la longueur : `len(panier.Articles) == 0`", correct: true}
      - {text: "Tester la capacité : `cap(panier.Articles) == 0`", correct: false}
      - {text: "Comparer au vide : `panier.Articles == []Article{}`", correct: false}
      - {text: "Créer le panier avec `var` plutôt qu'avec `make`", correct: false}
    answer: |-
      ```go
      if len(panier.Articles) == 0 {
      	return errPanierVide
      }
      ```
      Un slice vide non nil passe le test `== nil` ; la longueur couvre les deux cas. Un slice vide peut avoir de la capacité, et `== []Article{}` ne compile pas.
  - key: bug-deepequal
    format: bug-fix
    question: |-
      Ce test échoue alors que les deux listes sont vides. Quelle correction est la bonne ?
      ```go
      if !reflect.DeepEqual(obtenu, attendu) { // obtenu nil, attendu []string{}
      	t.Fatal("différent")
      }
      ```
    choices:
      - {text: "Comparer avec `slices.Equal(obtenu, attendu)`", correct: true}
      - {text: "Comparer avec `obtenu == attendu`", correct: false}
      - {text: "Comparer `&obtenu` et `&attendu` avec `reflect.DeepEqual`", correct: false}
      - {text: "Remplacer `t.Fatal` par `t.Error`, pour continuer le test", correct: false}
    answer: "```go\nif !slices.Equal(obtenu, attendu) {\n\tt.Fatal(\"différent\")\n}\n```\n`DeepEqual` distingue nil et vide ; `slices.Equal` compare seulement les éléments."
  - key: bug-omitempty
    format: bug-fix
    question: Un collègue ajoute `json:"tags,omitempty"` pour éviter `null`, et le client ne trouve plus la clé `tags`. Que proposes-tu ?
    choices:
      - {text: "Retirer `omitempty`, et initialiser `Tags` à `[]string{}` s'il vaut nil", correct: true}
      - {text: "Remplacer `omitempty` par `omitzero`, qui garde un tableau vide", correct: false}
      - {text: "Garder `omitempty` : au client de traiter la clé absente comme `null`", correct: false}
      - {text: "Remplacer le tag par `json:\"tags,string\"`, qui écrit toujours `\"[]\"`", correct: false}
    answer: |-
      ```go
      type Reponse struct {
      	Tags []string `json:"tags"`
      }

      if r.Tags == nil {
      	r.Tags = []string{}
      }
      ```
      `omitempty` retire la clé quand le slice est vide ; si le contrat dit « toujours un tableau », on initialise le
      slice vide avant l'encodage. `omitzero` omettrait aussi le slice nil, sa valeur zéro.
