notion: slice-nil-vide
lesson: |-
  Deux slices sans élément ne sont pas tout à fait identiques :

  ```go
  var a []int        // nil : pointeur nil, len 0, cap 0
  b := []int{}       // vide non nil : pointe sur un tableau de taille 0
  c := make([]int, 0)
  ```

  Pour **presque tout**, ils se comportent pareil : `len` vaut 0, `range` ne fait rien, `append` fonctionne. La
  différence apparaît :
  - avec `== nil` : seul `a` est nil ;
  - en **JSON** : `json.Marshal(a)` donne `null`, `json.Marshal(b)` donne `[]` ;
  - avec `reflect.DeepEqual`, qui distingue nil et vide.

  Bonnes pratiques :
  - **tester la vacuité avec `len(s) == 0`**, jamais avec `s == nil` ;
  - préférer `var s []T` (nil) comme valeur de départ : c'est la valeur zéro, sans allocation ;
  - dans une API JSON, choisir explicitement `[]` (slice vide) quand le client attend toujours un tableau ;
  - `slices.Equal` traite nil et vide comme égaux.

  **Piège classique** : une API qui renvoie tantôt `null`, tantôt `[]` pour une liste vide, selon le chemin de code qui
  a produit le slice. Les clients JavaScript plantent sur `null.length`.

  **En entretien** : « Un slice nil et un slice vide ont tous deux len 0 et se comportent pareil, sauf pour == nil, le JSON
  (null contre []) et DeepEqual ; on teste len(s) == 0. »
cards:
  - key: nil-slice-vs-slice-vide
    format: course
    question: nil slice vs slice vide ?
    answer: Tous deux de longueur 0 et utilisables ; le nil vaut nil et devient null en JSON, le vide devient [].
  - key: code-var-sl-int-fmt-println
    format: code-output
    question: |-
      ```go
      var sl []int
      fmt.Println(sl == nil, len(sl), cap(sl))
      sl = append(sl, 1)
      fmt.Println(sl)
      ```
    answer: '`true 0 0` puis `[1]` : on peut faire `append` sur un slice nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar sl []int\n\tfmt.Println(sl == nil, len(sl), cap(sl))\n\tsl = append(sl, 1)\n\tfmt.Println(sl)\n}\n"
      output: |-
        true 0 0
        [1]
  - key: json
    format: course
    question: Comment `encoding/json` encode-t-il un slice nil et un slice vide ?
    answer: Le nil en `null`, le vide en `[]` ; une API qui veut toujours un tableau initialise ses slices vides.
  - key: tester
    format: course
    question: Comment tester qu'un slice n'a aucun élément ?
    answer: Avec `len(s) == 0`, qui vaut pour un slice nil comme pour un slice vide.
  - key: depart
    format: course
    question: Quelle déclaration préférer pour un slice qu'on va remplir avec append ?
    answer: '`var s []T` (nil, sans allocation), ou `make([]T, 0, n)` si l''on connaît la taille.'
  - key: vf-append-nil
    format: true-false
    question: On peut faire `append` sur un slice nil.
    truth: true
    answer: Il alloue un tableau au premier ajout.
  - key: vf-egaux
    format: true-false
    question: '`slices.Equal([]int(nil), []int{})` vaut `true`.'
    truth: true
    answer: '`slices.Equal` compare longueurs et éléments ; nil et vide ont tous deux zéro élément.'
  - key: vf-deepequal
    format: true-false
    question: '`reflect.DeepEqual([]int(nil), []int{})` vaut `true`.'
    truth: false
    answer: '`DeepEqual` distingue un slice nil d''un slice vide.'
  - key: vf-range
    format: true-false
    question: Parcourir un slice nil avec range panique.
    truth: false
    answer: La boucle ne fait simplement aucune itération.
  - key: qcm-nil
    format: multiple-choice
    question: Lesquels sont des slices nil ?
    choices:
      - text: '`var s []string`'
        correct: true
      - text: '`s := []string(nil)`'
        correct: true
      - text: '`s := []string{}`'
        correct: false
      - text: '`s := make([]string, 0)`'
        correct: false
    answer: Un littéral vide ou `make` donnent un slice vide non nil.
  - key: qcm-json
    format: multiple-choice
    question: Que donne `json.Marshal(struct{ Tags []string }{})` ?
    choices:
      - text: '`{"Tags":null}`'
        correct: true
      - text: '`{"Tags":[]}`'
        correct: false
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
    answer: Le champ vaut sa valeur zéro, un slice nil, encodé en null.
  - key: qcm-vacuite
    format: multiple-choice
    question: Quel test de vacuité est correct pour tout slice ?
    choices:
      - text: '`len(s) == 0`'
        correct: true
      - text: '`s == nil`'
        correct: false
      - text: '`s == []int{}`'
        correct: false
      - text: '`cap(s) == 0`'
        correct: false
    answer: '`s == nil` rate les slices vides non nil ; `cap` peut être non nulle sur un slice vide.'
  - key: qcm-api
    format: multiple-choice
    question: Comment garantir qu'un champ liste d'une réponse JSON vaut toujours `[]` quand il est vide ?
    choices:
      - text: Initialiser le slice à `[]T{}` avant l'encodage
        correct: true
      - text: Normaliser dans le DTO de réponse (`if r.Items == nil { r.Items = []T{} }`)
        correct: true
      - text: Ajouter le tag `omitempty`
        correct: false
      - text: Rien, encoding/json produit déjà `[]`
        correct: false
    answer: '`omitempty` ferait disparaître le champ, ce qui n''est pas `[]` non plus.'
  - key: code-json
    format: code-output
    question: |-
      ```go
      var a []int
      b := []int{}
      ja, _ := json.Marshal(a)
      jb, _ := json.Marshal(b)
      fmt.Println(string(ja), string(jb))
      ```
    answer: '`null []` : le slice nil devient null, le slice vide un tableau vide.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar a []int\n\tb := []int{}\n\tja, _ := json.Marshal(a)\n\tjb, _ := json.Marshal(b)\n\tfmt.Println(string(ja), string(jb))\n}\n"
      output: null []
  - key: code-comportement
    format: code-output
    question: |-
      ```go
      var a []string
      b := []string{}
      fmt.Println(len(a), len(b), a == nil, b == nil)
      a = append(a, "x")
      fmt.Println(a)
      ```
    answer: '`0 0 true false` puis `[x]` : même longueur, seule `a` est nil, et append marche sur les deux.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a []string\n\tb := []string{}\n\tfmt.Println(len(a), len(b), a == nil, b == nil)\n\ta = append(a, \"x\")\n\tfmt.Println(a)\n}\n"
      output: |-
        0 0 true false
        [x]
  - key: code-deepequal
    format: code-output
    question: |-
      ```go
      var a []int
      b := []int{}
      fmt.Println(slices.Equal(a, b), reflect.DeepEqual(a, b))
      ```
    answer: '`true false` : `slices.Equal` les juge égaux, `DeepEqual` les distingue.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n\t\"slices\"\n)\n\nfunc main() {\n\tvar a []int\n\tb := []int{}\n\tfmt.Println(slices.Equal(a, b), reflect.DeepEqual(a, b))\n}\n"
      output: true false
  - key: bug-null
    format: bug-fix
    question: "Le front plante sur `resultats.length` quand la recherche ne trouve rien :\n```go\nvar resultats []Produit\nfor _, p := range catalogue {\n\tif correspond(p, q) {\n\t\tresultats = append(resultats, p)\n\t}\n}\njson.NewEncoder(w).Encode(resultats)\n```"
    answer: |-
      ```go
      resultats := []Produit{}
      ```
      Sans correspondance, le slice restait nil et s'encodait en `null` ; un slice vide s'encode en `[]`.
  - key: bug-test-nil
    format: bug-fix
    question: "Un panier vide créé par `make` est considéré comme non vide :\n```go\nif panier.Articles == nil {\n\treturn errPanierVide\n}\n```"
    answer: "```go\nif len(panier.Articles) == 0 {\n\treturn errPanierVide\n}\n```\nUn slice vide non nil passe le test `== nil` ; la longueur couvre les deux cas."
  - key: bug-deepequal
    format: bug-fix
    question: "Ce test échoue alors que les deux listes sont vides :\n```go\nif !reflect.DeepEqual(obtenu, attendu) { // obtenu nil, attendu []string{}\n\tt.Fatal(\"différent\")\n}\n```"
    answer: "```go\nif !slices.Equal(obtenu, attendu) {\n\tt.Fatal(\"différent\")\n}\n```\n`DeepEqual` distingue nil et vide ; `slices.Equal` compare seulement les éléments."
  - key: bug-omitempty
    format: bug-fix
    question: Un collègue ajoute `json:"tags,omitempty"` pour éviter `null`, et le client ne trouve plus la clé `tags`. Que proposes-tu ?
    answer: "```go\ntype Reponse struct {\n\tTags []string `json:\"tags\"`\n}\n\nif r.Tags == nil {\n\tr.Tags = []string{}\n}\n```\n`omitempty` retire la clé quand le slice est vide ; si le contrat dit « toujours un tableau », on initialise le\nslice vide avant l'encodage."
