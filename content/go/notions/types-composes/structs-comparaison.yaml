notion: structs-comparaison
cards:
  - key: struct-comparable
    format: course
    question: Une struct est-elle comparable ?
    answer: Oui si tous ses champs sont comparables.
  - key: code-type-p-struct-x-int
    format: code-output
    question: '`type P struct{ X int }; p1 := P{1}; p2 := p1; p2.X = 2; fmt.Println(p1.X, p1 == P{1})`'
    answer: '`1 true` : la struct est copiée et comparable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tp1 := P{1}\n\tp2 := p1\n\tp2.X = 2\n\tfmt.Println(p1.X, p1 == P{1})\n}\n"
      output: 1 true
