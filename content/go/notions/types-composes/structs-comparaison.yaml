notion: structs-comparaison
lesson: "Une struct est **comparable** avec `==` si **tous ses champs** sont comparables : deux structs sont égales quand\nchacun de leurs champs l'est.\n\n```go\ntype Point struct{ X, Y int }\nPoint{1, 2} == Point{1, 2} // true\n\ntype Panier struct {\n\tArticles []string // un slice : Panier n'est PAS comparable\n}\n// Panier{} == Panier{} : erreur de compilation\n```\n\n- Un champ slice, map ou fonction rend la struct **non comparable** : `==` ne compile pas, et elle ne peut pas être\n  une clé de map. On compare alors avec une fonction (`slices.Equal` sur les champs), ou `reflect.DeepEqual` en test.\n- Les champs **pointeurs** se comparent par **adresse**, pas par contenu.\n- Les champs non exportés participent aussi à la comparaison.\n\nLa **copie** d'une struct (affectation, paramètre, retour, valeur de range) copie tous les champs, mais seulement « en\nsurface » : un champ slice, map ou pointeur copié désigne toujours les **mêmes** données. Pour une copie profonde, on\ncopie ces champs explicitement.\n\nCopier coûte autant que la taille de la struct : pour de grosses structs, on passe souvent un pointeur.\n\n**Piège classique** : comparer deux structs contenant un `time.Time` avec `==`. Deux instants égaux peuvent différer\npar leur fuseau ou leur lecture monotone ; on utilise `t1.Equal(t2)`.\n\n**En entretien** : « == compare champ par champ si tous les champs sont comparables ; un slice ou une map l'interdit ;\nla copie est superficielle ; time.Time se compare avec Equal. »"
cards:
  - key: struct-comparable
    format: course
    question: Une struct est-elle comparable ?
    answer: Oui si tous ses champs sont comparables.
  - key: code-type-p-struct-x-int
    format: code-output
    question: '`type P struct{ X int }; p1 := P{1}; p2 := p1; p2.X = 2; fmt.Println(p1.X, p1 == P{1})`'
    answer: '`1 true` : la struct est copiée et comparable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tp1 := P{1}\n\tp2 := p1\n\tp2.X = 2\n\tfmt.Println(p1.X, p1 == P{1})\n}\n"
      output: 1 true
  - key: non-comparable
    format: course
    question: Qu'est-ce qui rend une struct non comparable ?
    answer: Un champ de type slice, map ou fonction (directement ou dans une struct imbriquée).
  - key: superficielle
    format: course
    question: Copier une struct qui contient un slice copie-t-il les éléments du slice ?
    answer: 'Non : la copie partage le même tableau ; il faut cloner le slice pour une copie profonde.'
  - key: time
    format: course
    question: Pourquoi ne pas comparer des `time.Time` avec `==` ?
    answer: Deux valeurs du même instant peuvent avoir un fuseau ou une lecture d'horloge monotone différents ; `t1.Equal(t2)` compare l'instant.
  - key: vf-egalite
    format: true-false
    question: Deux structs comparables sont égales si tous leurs champs sont égaux.
    truth: true
    answer: Champs non exportés compris.
  - key: vf-slice
    format: true-false
    question: Une struct qui contient un slice peut être comparée avec `==`.
    truth: false
    answer: « struct containing []string cannot be compared ».
  - key: vf-pointeur
    format: true-false
    question: Deux structs dont les champs pointeurs désignent des valeurs égales mais distinctes sont égales.
    truth: false
    answer: Les pointeurs se comparent par adresse.
  - key: vf-cle
    format: true-false
    question: Une struct comparable peut servir de clé de map.
    truth: true
    answer: C'est l'outil des clés composées.
  - key: qcm-comparables
    format: multiple-choice
    question: Lesquelles de ces structs sont comparables ?
    choices:
      - text: '`struct{ X, Y int }`'
        correct: true
      - text: '`struct{ Nom string; Age int; Actif bool }`'
        correct: true
      - text: '`struct{ Tags []string }`'
        correct: false
      - text: '`struct{ Meta map[string]string }`'
        correct: false
    answer: Slices et maps ne sont pas comparables.
  - key: qcm-comparer-panier
    format: multiple-choice
    question: Comment comparer deux structs `Panier` qui contiennent un slice d'articles ?
    choices:
      - text: Une méthode `Egal` qui compare les champs, avec `slices.Equal` pour le slice
        correct: true
      - text: '`reflect.DeepEqual` dans un test'
        correct: true
      - text: '`p1 == p2`'
        correct: false
      - text: '`&p1 == &p2`'
        correct: false
    answer: '`&p1 == &p2` compare des adresses, presque toujours différentes.'
  - key: qcm-copie
    format: multiple-choice
    question: Après `b := a` avec `a` une struct qui a un champ `Tags []string`, que fait `b.Tags[0] = "x"` ?
    choices:
      - text: Il modifie aussi `a.Tags[0]`
        correct: true
      - text: Il ne modifie que `b`
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il panique
        correct: false
    answer: La copie de la struct partage le tableau du slice.
  - key: code-egalite
    format: code-output
    question: |-
      ```go
      type Point struct{ X, Y int }

      a, b := Point{1, 2}, Point{1, 2}
      c := Point{2, 1}
      fmt.Println(a == b, a == c)
      ```
    answer: '`true false` : comparaison champ par champ.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\nfunc main() {\n\ta, b := Point{1, 2}, Point{1, 2}\n\tc := Point{2, 1}\n\tfmt.Println(a == b, a == c)\n}\n"
      output: true false
  - key: code-superficielle
    format: code-output
    question: "```go\ntype Equipe struct {\n\tNom     string\n\tMembres []string\n}\n\na := Equipe{\"A\", []string{\"ada\", \"bob\"}}\nb := a\nb.Nom = \"B\"\nb.Membres[0] = \"eve\"\nfmt.Println(a.Nom, a.Membres)\n```"
    answer: '`A [eve bob]` : le nom est copié, mais le slice est partagé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Equipe struct {\n\tNom     string\n\tMembres []string\n}\n\nfunc main() {\n\ta := Equipe{\"A\", []string{\"ada\", \"bob\"}}\n\tb := a\n\tb.Nom = \"B\"\n\tb.Membres[0] = \"eve\"\n\tfmt.Println(a.Nom, a.Membres)\n}\n"
      output: A [eve bob]
  - key: code-non-comparable
    format: code-output
    question: |-
      ```go
      type Panier struct{ Articles []string }

      fmt.Println(Panier{} == Panier{})
      ```
    answer: 'Rien : le code ne compile pas, la struct contient un slice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Panier struct{ Articles []string }\n\nfunc main() {\n\tfmt.Println(Panier{} == Panier{})\n}\n"
      compiles: false
  - key: bug-time
    format: bug-fix
    question: "Deux rendez-vous au même instant ne sont pas reconnus comme identiques :\n```go\ntype RDV struct {\n\tDebut time.Time\n\tSalle string\n}\n\nif r1 == r2 { ... } // r1 vient de la base, r2 de time.Now arrondi\n```"
    answer: "```go\nfunc (r RDV) Egal(o RDV) bool {\n\treturn r.Debut.Equal(o.Debut) && r.Salle == o.Salle\n}\n```\n`==` compare aussi le fuseau et la lecture monotone de `time.Time` ; `Equal` compare l'instant."
  - key: bug-comparaison-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: a == b (struct containing []Ligne cannot be compared) » :
      ```go
      if attendu == obtenu { ... }
      ```
    answer: "```go\nfunc (c Commande) Egal(o Commande) bool {\n\treturn c.ID == o.ID && slices.Equal(c.Lignes, o.Lignes)\n}\n```\nUne struct avec un slice n'est pas comparable : on écrit une comparaison explicite (ou `reflect.DeepEqual` en test)."
  - key: bug-copie-profonde
    format: bug-fix
    question: |-
      Modifier les options d'une copie de configuration modifie l'originale :
      ```go
      copie := cfg
      copie.Origines = append(copie.Origines[:0], "https://autre.fr")
      ```
    answer: |-
      ```go
      copie := cfg
      copie.Origines = slices.Clone(cfg.Origines)
      copie.Origines = append(copie.Origines[:0], "https://autre.fr")
      ```
      La copie de struct partageait le slice ; on clone les champs de référence pour une copie profonde.
  - key: bug-pointeurs
    format: bug-fix
    question: "Deux adresses identiques ne sont pas reconnues comme égales :\n```go\ntype Client struct {\n\tNom     string\n\tAdresse *Adresse\n}\n\nif c1 == c2 { ... }\n```"
    answer: "```go\nfunc (c Client) Egal(o Client) bool {\n\tif c.Nom != o.Nom {\n\t\treturn false\n\t}\n\tif c.Adresse == nil || o.Adresse == nil {\n\t\treturn c.Adresse == o.Adresse\n\t}\n\treturn *c.Adresse == *o.Adresse\n}\n```\nLes champs pointeurs se comparent par adresse ; on compare les valeurs pointées."
  - key: qcm-time-equal
    format: multiple-choice
    question: Comment comparer deux instants `t1` et `t2` de type `time.Time` ?
    choices:
      - text: '`t1.Equal(t2)`'
        correct: true
      - text: '`t1 == t2`, toujours fiable'
        correct: false
      - text: '`t1.String() == t2.String()`'
        correct: false
      - text: '`reflect.DeepEqual(t1, t2)`'
        correct: false
    answer: '`==` et `DeepEqual` comparent aussi le fuseau et la lecture monotone.'
