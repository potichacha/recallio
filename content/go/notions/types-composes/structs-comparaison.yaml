notion: structs-comparaison
lesson: "Une struct est **comparable** avec `==` si **tous ses champs** sont comparables : deux structs sont égales quand\nchacun de leurs champs l'est.\n\n```go\ntype Point struct{ X, Y int }\nPoint{1, 2} == Point{1, 2} // true\n\ntype Panier struct {\n\tArticles []string // un slice : Panier n'est PAS comparable\n}\n// Panier{} == Panier{} : erreur de compilation\n```\n\n- Un champ slice, map ou fonction rend la struct **non comparable** : `==` ne compile pas, et elle ne peut pas être\n  une clé de map. On compare alors avec une fonction (`slices.Equal` sur les champs), ou `reflect.DeepEqual` en test.\n- Les champs **pointeurs** se comparent par **adresse**, pas par contenu.\n- Les champs non exportés participent aussi à la comparaison.\n\nLa **copie** d'une struct (affectation, paramètre, retour, valeur de range) copie tous les champs, mais seulement « en\nsurface » : un champ slice, map ou pointeur copié désigne toujours les **mêmes** données. Pour une copie profonde, on\ncopie ces champs explicitement.\n\nCopier coûte autant que la taille de la struct : pour de grosses structs, on passe souvent un pointeur.\n\n**Piège classique** : comparer deux structs contenant un `time.Time` avec `==`. Deux instants égaux peuvent différer\npar leur fuseau ou leur lecture monotone ; on utilise `t1.Equal(t2)`.\n\n**En entretien** : « == compare champ par champ si tous les champs sont comparables ; un slice ou une map l'interdit ;\nla copie est superficielle ; time.Time se compare avec Equal. »"
cards:
  - key: struct-comparable
    format: course
    question: "Une struct est-elle comparable avec `==` ?"
    choices:
      - {text: "Oui, si tous ses champs sont comparables", correct: true}
      - {text: "Non, jamais : il faut une méthode `Equals`", correct: false}
      - {text: "Oui, toujours : `==` compare leurs adresses", correct: false}
      - {text: "Oui, si tous ses champs sont exportés", correct: false}
    answer: "Oui, si tous ses champs sont comparables : `==` compare alors champ par champ, par valeur. Un champ slice, map ou fonction rend la struct non comparable."
  - key: code-type-p-struct-x-int
    format: code-output
    question: "Qu'affiche `type P struct{ X int }; p1 := P{1}; p2 := p1; p2.X = 2; fmt.Println(p1.X, p1 == P{1})` ?"
    choices:
      - {text: "`1 true`", correct: true}
      - {text: "`2 false`", correct: false}
      - {text: "`2 true`", correct: false}
      - {text: "`1 false`", correct: false}
    answer: "`1 true` : `p2` est une copie, la modifier ne touche pas `p1` ; et deux structs aux champs égaux sont égales."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tp1 := P{1}\n\tp2 := p1\n\tp2.X = 2\n\tfmt.Println(p1.X, p1 == P{1})\n}\n"
      output: 1 true
  - key: non-comparable
    format: course
    question: Qu'est-ce qui rend une struct non comparable ?
    choices:
      - {text: "Un champ slice, map ou fonction, même dans une struct imbriquée", correct: true}
      - {text: "Un champ pointeur, qui ne se compare pas par valeur", correct: false}
      - {text: "Un champ non exporté, invisible pour l'opérateur `==`", correct: false}
      - {text: "Un champ de type interface, qui peut valoir nil", correct: false}
    answer: "Un champ de type slice, map ou fonction, directement ou dans une struct imbriquée. Un pointeur se compare (par adresse), comme une interface ; un champ non exporté compte comme les autres."
  - key: superficielle
    format: course
    question: Copier une struct qui contient un slice copie-t-il les éléments du slice ?
    choices:
      - {text: "Non : la copie partage le même tableau ; il faut cloner le slice", correct: true}
      - {text: "Oui : copier une struct copie tout son contenu en profondeur", correct: false}
      - {text: "Oui, si le slice a été créé par `make`", correct: false}
      - {text: "Non : la copie reçoit un slice nil, à remplir de nouveau", correct: false}
    answer: "Non : la copie reçoit le même en-tête de slice, qui pointe vers le même tableau ; pour une copie profonde, on clone le slice (`slices.Clone`)."
  - key: time
    format: course
    question: Pourquoi ne pas comparer des `time.Time` avec `==` ?
    choices:
      - {text: "Le même instant peut avoir un fuseau ou une lecture monotone différents", correct: true}
      - {text: "`time.Time` contient un slice, donc `==` ne compile pas", correct: false}
      - {text: "`==` compare les instants à la seconde près, sans les nanosecondes", correct: false}
      - {text: "`==` convertit d'abord les deux dates en UTC, ce qui est lent", correct: false}
    answer: "`==` compare tous les champs de `time.Time`, dont le fuseau et la lecture d'horloge monotone : deux valeurs du même instant peuvent différer. `t1.Equal(t2)` compare l'instant."
  - key: vf-egalite
    format: true-false
    question: Deux structs comparables sont égales si tous leurs champs sont égaux.
    truth: true
    answer: Champs non exportés compris.
  - key: vf-slice
    format: true-false
    question: Une struct qui contient un slice peut être comparée avec `==`.
    truth: false
    answer: « struct containing []string cannot be compared ».
  - key: vf-pointeur
    format: true-false
    question: Deux structs dont les champs pointeurs désignent des valeurs égales mais distinctes sont égales.
    truth: false
    answer: Les pointeurs se comparent par adresse.
  - key: vf-cle
    format: true-false
    question: Une struct comparable peut servir de clé de map.
    truth: true
    answer: C'est l'outil des clés composées.
  - key: qcm-comparables
    format: multiple-choice
    question: "Laquelle de ces structs est comparable avec `==` ?"
    choices:
      - {text: "`struct{ Nom string; Age int; Actif bool }`", correct: true}
      - {text: "`struct{ Tags []string }`", correct: false}
      - {text: "`struct{ Meta map[string]string }`", correct: false}
      - {text: "`struct{ Rappel func() }`", correct: false}
    answer: "Chaînes, entiers et booléens sont comparables, donc la struct aussi. Slices, maps et fonctions ne le sont pas, et rendent leur struct non comparable."
  - key: qcm-comparer-panier
    format: multiple-choice
    question: "Quelles façons de comparer deux structs `Panier` qui contiennent un slice d'articles sont correctes ?"
    choices:
      - text: Une méthode `Egal` qui compare les champs, avec `slices.Equal` pour le slice
        correct: true
      - text: '`reflect.DeepEqual` dans un test'
        correct: true
      - text: '`p1 == p2`'
        correct: false
      - text: '`&p1 == &p2`'
        correct: false
    answer: '`&p1 == &p2` compare des adresses, presque toujours différentes.'
  - key: qcm-copie
    format: multiple-choice
    question: Après `b := a` avec `a` une struct qui a un champ `Tags []string`, que fait `b.Tags[0] = "x"` ?
    choices:
      - text: Il modifie aussi `a.Tags[0]`
        correct: true
      - text: Il ne modifie que `b`
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il panique
        correct: false
    answer: La copie de la struct partage le tableau du slice.
  - key: code-egalite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Point struct{ X, Y int }

      a, b := Point{1, 2}, Point{1, 2}
      c := Point{2, 1}
      fmt.Println(a == b, a == c)
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : la comparaison se fait champ par champ, dans l'ordre ; `{2, 1}` n'est pas `{1, 2}`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\nfunc main() {\n\ta, b := Point{1, 2}, Point{1, 2}\n\tc := Point{2, 1}\n\tfmt.Println(a == b, a == c)\n}\n"
      output: true false
  - key: code-superficielle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Equipe struct {
      	Nom     string
      	Membres []string
      }

      a := Equipe{"A", []string{"ada", "bob"}}
      b := a
      b.Nom = "B"
      b.Membres[0] = "eve"
      fmt.Println(a.Nom, a.Membres)
      ```
    choices:
      - {text: "`A [eve bob]`", correct: true}
      - {text: "`A [ada bob]`", correct: false}
      - {text: "`B [eve bob]`", correct: false}
      - {text: "`B [ada bob]`", correct: false}
    answer: "`A [eve bob]` : le nom est copié, mais le slice est partagé ; écrire `b.Membres[0]` modifie le tableau commun."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Equipe struct {\n\tNom     string\n\tMembres []string\n}\n\nfunc main() {\n\ta := Equipe{\"A\", []string{\"ada\", \"bob\"}}\n\tb := a\n\tb.Nom = \"B\"\n\tb.Membres[0] = \"eve\"\n\tfmt.Println(a.Nom, a.Membres)\n}\n"
      output: A [eve bob]
  - key: code-non-comparable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Panier struct{ Articles []string }

      fmt.Println(Panier{} == Panier{})
      ```
    choices:
      - {text: "Ça ne compile pas : la struct contient un slice", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`false`", correct: false}
      - {text: "Une panic : comparing uncomparable type", correct: false}
    answer: "Une struct qui contient un slice n'est pas comparable : le compilateur refuse `==`. La panic n'existe que derrière une interface, quand le type n'est connu qu'à l'exécution."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Panier struct{ Articles []string }\n\nfunc main() {\n\tfmt.Println(Panier{} == Panier{})\n}\n"
      compiles: false
  - key: bug-time
    format: bug-fix
    question: |-
      Deux réunions au même instant ne sont pas reconnues comme identiques. Quelle correction est la bonne ?
      ```go
      type RDV struct {
      	Debut time.Time
      	Salle string
      }

      if r1 == r2 { ... } // r1 vient de la base, r2 de time.Now arrondi
      ```
    choices:
      - {text: "Une méthode `Egal` qui compare `Debut` avec `Equal`, et `Salle` avec `==`", correct: true}
      - {text: "Comparer `r1.Debut.String() == r2.Debut.String()`, puis les salles", correct: false}
      - {text: "Comparer les deux structs avec `reflect.DeepEqual(r1, r2)`", correct: false}
      - {text: "Comparer les adresses des deux structs avec `&r1 == &r2`", correct: false}
    answer: |-
      ```go
      func (r RDV) Egal(o RDV) bool {
      	return r.Debut.Equal(o.Debut) && r.Salle == o.Salle
      }
      ```
      `==` compare aussi le fuseau et la lecture monotone de `time.Time` ; `Equal` compare l'instant. `String()` et `DeepEqual` voient aussi le fuseau.
  - key: bug-comparaison-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: a == b (struct containing []Ligne cannot be compared) ». Quelle correction est la bonne ?
      ```go
      if attendu == obtenu { ... }
      ```
    choices:
      - {text: "Une méthode `Egal` qui compare l'ID, puis les lignes avec `slices.Equal`", correct: true}
      - {text: "Comparer les adresses des deux commandes : `&attendu == &obtenu`", correct: false}
      - {text: "Comparer `attendu.Lignes == obtenu.Lignes`, en plus de l'ID", correct: false}
      - {text: "Convertir les deux commandes en `any` avant de les comparer", correct: false}
    answer: |-
      ```go
      func (c Commande) Egal(o Commande) bool {
      	return c.ID == o.ID && slices.Equal(c.Lignes, o.Lignes)
      }
      ```
      Une struct avec un slice n'est pas comparable : on écrit une comparaison explicite (ou `reflect.DeepEqual` en test). Passer par `any` compilerait, mais paniquerait à l'exécution.
  - key: bug-copie-profonde
    format: bug-fix
    question: |-
      Modifier les options d'une copie de configuration modifie l'originale. Quelle correction est la bonne ?
      ```go
      copie := cfg
      copie.Origines = append(copie.Origines[:0], "https://autre.fr")
      ```
    choices:
      - {text: "Cloner le slice dans la copie : `copie.Origines = slices.Clone(cfg.Origines)`", correct: true}
      - {text: "Copier la struct par déréférencement : `copie := *(&cfg)`", correct: false}
      - {text: "Remplacer `copie.Origines[:0]` par `copie.Origines[0:0]`", correct: false}
      - {text: "Copier la struct à travers un pointeur : `copie := &cfg`", correct: false}
    answer: |-
      ```go
      copie := cfg
      copie.Origines = slices.Clone(cfg.Origines)
      copie.Origines = append(copie.Origines[:0], "https://autre.fr")
      ```
      La copie de struct partageait le slice ; on clone les champs de référence pour une copie profonde.
  - key: bug-pointeurs
    format: bug-fix
    question: |-
      Deux adresses identiques ne sont pas reconnues comme égales. Quelle correction est la bonne ?
      ```go
      type Client struct {
      	Nom     string
      	Adresse *Adresse
      }

      if c1 == c2 { ... }
      ```
    choices:
      - {text: "Une méthode `Egal` qui compare les valeurs pointées, en gérant nil", correct: true}
      - {text: "Comparer aussi `c1.Adresse == c2.Adresse`, en plus des noms", correct: false}
      - {text: "Comparer les adresses des champs : `&c1.Adresse == &c2.Adresse`", correct: false}
      - {text: "Comparer les textes : `fmt.Sprint(c1) == fmt.Sprint(c2)`", correct: false}
    answer: |-
      ```go
      func (c Client) Egal(o Client) bool {
      	if c.Nom != o.Nom {
      		return false
      	}
      	if c.Adresse == nil || o.Adresse == nil {
      		return c.Adresse == o.Adresse
      	}
      	return *c.Adresse == *o.Adresse
      }
      ```
      Les champs pointeurs se comparent par adresse ; on compare les valeurs pointées. `fmt.Sprint` affiche l'adresse du pointeur, pas l'adresse postale.
  - key: qcm-time-equal
    format: multiple-choice
    question: Comment comparer deux instants `t1` et `t2` de type `time.Time` ?
    choices:
      - text: '`t1.Equal(t2)`'
        correct: true
      - text: '`t1 == t2`, toujours fiable'
        correct: false
      - text: '`t1.String() == t2.String()`'
        correct: false
      - text: '`reflect.DeepEqual(t1, t2)`'
        correct: false
    answer: '`==` et `DeepEqual` comparent aussi le fuseau et la lecture monotone.'
