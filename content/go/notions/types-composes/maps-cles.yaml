notion: maps-cles
lesson: "Une clé de map doit être d'un type **comparable** avec `==` :\n- **permis** : nombres, chaînes, booléens, pointeurs, channels, interfaces, **tableaux** et **structs** dont tous les\n  champs sont comparables ;\n- **interdits** : **slices**, **maps** et **fonctions** (erreur de compilation « invalid map key type »).\n\nUne struct comme clé est très pratique pour une clé composée :\n\n```go\ntype cle struct {\n\tVille string\n\tAnnee int\n}\nventes := map[cle]int{}\nventes[cle{\"Lyon\", 2026}] += 100\n```\n\nAttention aux clés de type **interface** (`map[any]int`) : la compilation passe, mais une valeur dynamique non\ncomparable (un slice) provoque une **panique à l'exécution**. Et un `float64` NaN comme clé crée une entrée qu'on ne\npeut plus relire, puisque `NaN != NaN`.\n\nLes **valeurs** d'une map ne sont **pas adressables** : `&m[k]` ne compile pas, et `m[k].Champ = x` non plus quand la\nvaleur est une struct. On relit la valeur, on la modifie, on la réécrit, ou l'on stocke des **pointeurs**\n(`map[string]*T`).\n\n**Piège classique** : `m[\"a\"].Total += 5` avec `map[string]Stat`. Le compilateur refuse (« cannot assign to struct\nfield m[\"a\"].Total in map »).\n\n**En entretien** : « Clés comparables : pas de slice, map ni fonction ; une struct pour une clé composée ; les valeurs\nne sont pas adressables, on réécrit la valeur ou l'on stocke des pointeurs. »"
cards:
  - key: types-peuvent-etre-cles-map
    format: course
    question: Quels types peuvent être clés de map ?
    answer: Les types comparables ; pas les slices, maps ni fonctions.
  - key: m-k-compile
    format: course
    question: Pourquoi `&m[k]` ne compile-t-il pas ?
    answer: Les éléments d'une map peuvent être déplacés lors de la croissance.
  - key: code-ecrire-m-5-avec-m
    format: code-output
    question: Peut-on écrire `m["a"].n = 5` avec `m := map[string]T{...}` ? Et avec `map[string]*T` ?
    answer: Non pour une map de valeurs (élément non adressable, erreur de compilation) ; oui pour une map de pointeurs.
    check:
      code: "package main\n\ntype T struct{ n int }\n\nfunc main() {\n\tm := map[string]T{\"a\": {}}\n\tm[\"a\"].n = 5\n}\n"
      compiles: false
  - key: cle-composee
    format: course
    question: Comment indexer une map par deux valeurs, une ville et une année ?
    answer: Avec une struct comparable comme clé, `map[struct{Ville string; Annee int}]int`, ou un tableau `[2]string`.
  - key: interface-panique
    format: course
    question: Pourquoi `map[any]int` peut-il paniquer à l'exécution ?
    answer: 'Si la valeur dynamique d''une clé n''est pas comparable (un slice, une map), le hachage panique : la vérification ne se fait qu''à l''exécution.'
  - key: vf-slice
    format: true-false
    question: '`map[[]string]int` compile.'
    truth: false
    answer: Un slice n'est pas comparable, donc pas une clé valide.
  - key: vf-struct
    format: true-false
    question: Une struct dont tous les champs sont comparables peut servir de clé.
    truth: true
    answer: Deux clés sont égales si tous leurs champs le sont.
  - key: vf-pointeur
    format: true-false
    question: Avec `map[*Client]bool`, deux pointeurs vers deux clients identiques sont la même clé.
    truth: false
    answer: Un pointeur se compare par adresse, pas par contenu.
  - key: vf-adresse
    format: true-false
    question: '`p := &m["a"]` compile.'
    truth: false
    answer: Les valeurs d'une map ne sont pas adressables (la table peut les déplacer).
  - key: qcm-cles
    format: multiple-choice
    question: Quels types de clés sont permis ?
    choices:
      - text: '`map[[2]int]bool`'
        correct: true
      - text: '`map[struct{ X, Y int }]bool`'
        correct: true
      - text: '`map[func()]bool`'
        correct: false
      - text: '`map[map[string]int]bool`'
        correct: false
    answer: Tableaux et structs comparables sont permis ; fonctions et maps ne le sont pas.
  - key: qcm-modifier
    format: multiple-choice
    question: Comment augmenter `Total` d'une valeur `Stat` dans `m map[string]Stat` ?
    choices:
      - text: '`s := m[k]; s.Total += 5; m[k] = s`'
        correct: true
      - text: Stocker des pointeurs `map[string]*Stat` et écrire `m[k].Total += 5`
        correct: true
      - text: '`m[k].Total += 5` directement'
        correct: false
      - text: '`(&m[k]).Total += 5`'
        correct: false
    answer: Une valeur de map n'est pas adressable ; on la réécrit, ou l'on passe par un pointeur.
  - key: qcm-nan
    format: multiple-choice
    question: Que se passe-t-il avec une clé NaN dans une `map[float64]int` ?
    choices:
      - text: L'entrée est créée mais ne peut plus être relue par sa clé
        correct: true
      - text: Chaque écriture avec NaN crée une nouvelle entrée
        correct: true
      - text: Le programme panique
        correct: false
      - text: La clé est convertie en 0
        correct: false
    answer: '`NaN != NaN` : aucune recherche ne retrouve la clé ; `clear` l''efface.'
  - key: code-struct-cle
    format: code-output
    question: "```go\ntype cle struct {\n\tVille string\n\tAnnee int\n}\n\nventes := map[cle]int{}\nventes[cle{\"Lyon\", 2026}] += 100\nventes[cle{\"Lyon\", 2026}] += 50\nventes[cle{\"Lyon\", 2025}] += 10\nfmt.Println(ventes[cle{\"Lyon\", 2026}], len(ventes))\n```"
    answer: '`150 2` : deux structs égales sont la même clé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype cle struct {\n\tVille string\n\tAnnee int\n}\n\nfunc main() {\n\tventes := map[cle]int{}\n\tventes[cle{\"Lyon\", 2026}] += 100\n\tventes[cle{\"Lyon\", 2026}] += 50\n\tventes[cle{\"Lyon\", 2025}] += 10\n\tfmt.Println(ventes[cle{\"Lyon\", 2026}], len(ventes))\n}\n"
      output: 150 2
  - key: code-reecrire
    format: code-output
    question: |-
      ```go
      type Stat struct{ Total int }

      m := map[string]Stat{"a": {1}}
      s := m["a"]
      s.Total += 5
      fmt.Println(m["a"].Total)
      m["a"] = s
      fmt.Println(m["a"].Total)
      ```
    answer: '`1` puis `6` : `s` est une copie, il faut la réécrire dans la map.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Stat struct{ Total int }\n\nfunc main() {\n\tm := map[string]Stat{\"a\": {1}}\n\ts := m[\"a\"]\n\ts.Total += 5\n\tfmt.Println(m[\"a\"].Total)\n\tm[\"a\"] = s\n\tfmt.Println(m[\"a\"].Total)\n}\n"
      output: |-
        1
        6
  - key: code-any-panique
    format: code-output
    question: |-
      ```go
      m := map[any]int{}
      m["a"] = 1
      fmt.Println(len(m))
      m[[]int{1}] = 2
      ```
    answer: '`1`, puis une panique : un slice n''est pas hachable, même derrière une interface.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[any]int{}\n\tm[\"a\"] = 1\n\tfmt.Println(len(m))\n\tm[[]int{1}] = 2\n}\n"
      output: '1'
      panics: hash of unhashable type
  - key: bug-struct-valeur
    format: bug-fix
    question: |-
      Le compilateur signale « cannot assign to struct field compteurs[nom].Vues in map » :
      ```go
      compteurs[nom].Vues++
      ```
    answer: |-
      ```go
      c := compteurs[nom]
      c.Vues++
      compteurs[nom] = c
      // ou une map de pointeurs : map[string]*Compteur
      ```
      Une valeur de map n'est pas adressable : on la lit, la modifie et la réécrit.
  - key: bug-cle-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid map key type []string » :
      ```go
      cache := map[[]string]Resultat{}
      cache[motsCles] = r
      ```
    answer: |-
      ```go
      cache := map[string]Resultat{}
      cache[strings.Join(motsCles, "\x00")] = r
      ```
      Un slice n'est pas comparable ; on dérive une clé chaîne avec un séparateur qui ne peut pas apparaître dans les
      mots (ou un tableau si la taille est fixe).
  - key: bug-pointeur
    format: bug-fix
    question: |-
      Le cache ne trouve jamais les clients déjà vus :
      ```go
      vus := map[*Client]bool{}
      vus[&Client{ID: 7}] = true
      if vus[&Client{ID: 7}] { ... } // jamais vrai
      ```
    answer: |-
      ```go
      vus := map[int]bool{}
      vus[client.ID] = true
      if vus[7] { ... }
      ```
      Une clé pointeur se compare par adresse ; on indexe par l'identifiant (ou par une struct comparable).
  - key: bug-any
    format: bug-fix
    question: |-
      Un cache générique panique avec « runtime error: hash of unhashable type []int » :
      ```go
      var cache = map[any]any{}

      func memoriser(cle any, v any) { cache[cle] = v }
      ```
    answer: "```go\nfunc memoriser[K comparable, V any](cache map[K]V, cle K, v V) {\n\tcache[cle] = v\n}\n```\nAvec `any`, une clé non comparable passe la compilation et panique à l'exécution ; la contrainte `comparable`\nreporte la vérification à la compilation."
  - key: qcm-egalite-struct
    format: multiple-choice
    question: Avec `type K struct{ A string; B int }`, quand `K{"x", 1}` et `K{"x", 1}` désignent-elles la même entrée d'une map ?
    choices:
      - text: Toujours, car tous leurs champs sont égaux
        correct: true
      - text: Seulement si ce sont la même variable
        correct: false
      - text: Jamais, chaque struct est une clé distincte
        correct: false
      - text: Seulement si K a une méthode Equals
        correct: false
    answer: L'égalité de structs compare les champs ; Go n'utilise pas de méthode d'égalité.
