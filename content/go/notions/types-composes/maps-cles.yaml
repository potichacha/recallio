notion: maps-cles
lesson: "Une clé de map doit être d'un type **comparable** avec `==` :\n- **permis** : nombres, chaînes, booléens, pointeurs, channels, interfaces, **tableaux** et **structs** dont tous les\n  champs sont comparables ;\n- **interdits** : **slices**, **maps** et **fonctions** (erreur de compilation « invalid map key type »).\n\nUne struct comme clé est très pratique pour une clé composée :\n\n```go\ntype cle struct {\n\tVille string\n\tAnnee int\n}\nventes := map[cle]int{}\nventes[cle{\"Lyon\", 2026}] += 100\n```\n\nAttention aux clés de type **interface** (`map[any]int`) : la compilation passe, mais une valeur dynamique non\ncomparable (un slice) provoque une **panique à l'exécution**. Et un `float64` NaN comme clé crée une entrée qu'on ne\npeut plus relire, puisque `NaN != NaN`.\n\nLes **valeurs** d'une map ne sont **pas adressables** : `&m[k]` ne compile pas, et `m[k].Champ = x` non plus quand la\nvaleur est une struct. On relit la valeur, on la modifie, on la réécrit, ou l'on stocke des **pointeurs**\n(`map[string]*T`).\n\n**Piège classique** : `m[\"a\"].Total += 5` avec `map[string]Stat`. Le compilateur refuse (« cannot assign to struct\nfield m[\"a\"].Total in map »).\n\n**En entretien** : « Clés comparables : pas de slice, map ni fonction ; une struct pour une clé composée ; les valeurs\nne sont pas adressables, on réécrit la valeur ou l'on stocke des pointeurs. »"
cards:
  - key: types-peuvent-etre-cles-map
    format: course
    question: "Quels types peuvent être clés d'une map ?"
    choices:
      - {text: "Les types comparables : ni slices, ni maps, ni fonctions", correct: true}
      - {text: "Tous les types, car Go sait hacher n'importe quelle valeur", correct: false}
      - {text: "Seulement les types de base : entiers, chaînes et booléens", correct: false}
      - {text: "Les types qui définissent des méthodes `Hash()` et `Equals()`", correct: false}
    answer: "Les types comparables avec `==` : types de base, pointeurs, channels, interfaces, et tableaux ou structs de types comparables. Slices, maps et fonctions sont exclus ; Go n'utilise pas de méthodes de hachage comme Java."
  - key: m-k-compile
    format: course
    question: Pourquoi `&m[k]` ne compile-t-il pas ?
    choices:
      - {text: "Les éléments d'une map peuvent être déplacés quand elle grandit", correct: true}
      - {text: "Les éléments d'une map sont rangés sur la pile, sans adresse fixe", correct: false}
      - {text: "Une map n'a pas d'adresse tant qu'elle n'est pas créée par `make`", correct: false}
      - {text: "`&` ne s'applique jamais à une expression indexée, comme `s[i]`", correct: false}
    answer: "Quand la map grandit, ses éléments changent de place : un pointeur vers l'un d'eux deviendrait invalide, donc une valeur de map n'est pas adressable. `&s[i]`, sur un slice, est permis."
  - key: code-ecrire-m-5-avec-m
    format: code-output
    question: "Avec `type T struct{ n int }` et `m := map[string]T{\"a\": {}}`, que se passe-t-il pour l'instruction `m[\"a\"].n = 5` ?"
    choices:
      - {text: "Ça ne compile pas : une valeur de map n'est pas adressable", correct: true}
      - {text: "Ça compile, et `m[\"a\"].n` vaut ensuite 5", correct: false}
      - {text: "Ça compile, mais la modification porte sur une copie perdue", correct: false}
      - {text: "Ça compile, puis une panic à l'exécution de l'affectation", correct: false}
    answer: "Le compilateur refuse (« cannot assign to struct field m[\"a\"].n in map ») : une valeur de map n'est pas adressable. Avec une `map[string]*T`, `m[\"a\"].n = 5` compile et modifie la struct pointée."
    check:
      code: "package main\n\ntype T struct{ n int }\n\nfunc main() {\n\tm := map[string]T{\"a\": {}}\n\tm[\"a\"].n = 5\n}\n"
      compiles: false
  - key: cle-composee
    format: course
    question: Comment indexer une map par deux valeurs, une ville et une année ?
    choices:
      - {text: "Avec une struct comparable en clé, `map[struct{Ville string; Annee int}]int`", correct: true}
      - {text: "Avec un slice en clé, `map[[]any]int`, qui accepte la ville et l'année", correct: false}
      - {text: "Avec la clé `ville + strconv.Itoa(annee)`, concaténée sans séparateur", correct: false}
      - {text: "Avec deux maps séparées, une par critère, consultées l'une après l'autre", correct: false}
    answer: "Une struct de champs comparables fait une clé composée (ou un tableau `[2]string`). Un slice n'est pas comparable, une concaténation sans séparateur peut confondre deux couples, et deux maps séparées ne combinent pas les critères."
  - key: interface-panique
    format: course
    question: Pourquoi `map[any]int` peut-il paniquer à l'exécution ?
    choices:
      - {text: "Une clé dont la valeur dynamique n'est pas comparable, un slice par exemple", correct: true}
      - {text: "Une clé nil, car une interface nil ne peut pas être hachée", correct: false}
      - {text: "Deux clés de même valeur mais de types différents, `1` et `int64(1)`", correct: false}
      - {text: "Une clé chaîne trop longue, qui dépasse la taille d'un seau de la map", correct: false}
    answer: "Avec `any`, le compilateur ne vérifie rien : si la valeur dynamique d'une clé n'est pas comparable (un slice, une map), le hachage panique à l'exécution. Une interface nil est une clé valide, et `1` et `int64(1)` sont deux clés distinctes."
  - key: vf-slice
    format: true-false
    question: '`map[[]string]int` compile.'
    truth: false
    answer: Un slice n'est pas comparable, donc pas une clé valide.
  - key: vf-struct
    format: true-false
    question: Une struct dont tous les champs sont comparables peut servir de clé.
    truth: true
    answer: Deux clés sont égales si tous leurs champs le sont.
  - key: vf-pointeur
    format: true-false
    question: Avec `map[*Client]bool`, deux pointeurs vers deux clients identiques sont la même clé.
    truth: false
    answer: Un pointeur se compare par adresse, pas par contenu.
  - key: vf-adresse
    format: true-false
    question: '`p := &m["a"]` compile.'
    truth: false
    answer: Les valeurs d'une map ne sont pas adressables (la table peut les déplacer).
  - key: qcm-cles
    format: multiple-choice
    question: "Lequel de ces types de map compile ?"
    choices:
      - {text: "`map[[2]int]bool`", correct: true}
      - {text: "`map[func()]bool`", correct: false}
      - {text: "`map[map[string]int]bool`", correct: false}
      - {text: "`map[[]int]bool`", correct: false}
    answer: "Une clé doit être comparable : un tableau l'est, comme une struct de champs comparables (`map[struct{ X, Y int }]bool` compile aussi). Fonctions, maps et slices ne le sont pas."
  - key: qcm-modifier
    format: multiple-choice
    question: "Quelles solutions permettent d'augmenter `Total` d'une valeur `Stat` rangée dans `m map[string]Stat` ?"
    choices:
      - text: '`s := m[k]; s.Total += 5; m[k] = s`'
        correct: true
      - text: Stocker des pointeurs `map[string]*Stat` et écrire `m[k].Total += 5`
        correct: true
      - text: '`m[k].Total += 5` directement'
        correct: false
      - text: '`(&m[k]).Total += 5`'
        correct: false
    answer: Une valeur de map n'est pas adressable ; on la réécrit, ou l'on passe par un pointeur.
  - key: qcm-nan
    format: multiple-choice
    question: "Que se passe-t-il quand on écrit deux fois avec la clé `math.NaN()` dans une `map[float64]int` ?"
    choices:
      - {text: "Deux entrées distinctes, qu'aucune lecture par la clé ne retrouve", correct: true}
      - {text: "Le programme panique : NaN n'est pas une clé valide", correct: false}
      - {text: "La clé devient 0, et la seconde écriture remplace la première", correct: false}
      - {text: "La seconde écriture remplace la première, comme pour toute clé", correct: false}
    answer: "`NaN != NaN` : chaque écriture crée une nouvelle entrée, et aucune recherche ne la retrouve ; seuls `range` et `clear` y accèdent."
  - key: code-struct-cle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type cle struct {
      	Ville string
      	Annee int
      }

      ventes := map[cle]int{}
      ventes[cle{"Lyon", 2026}] += 100
      ventes[cle{"Lyon", 2026}] += 50
      ventes[cle{"Lyon", 2025}] += 10
      fmt.Println(ventes[cle{"Lyon", 2026}], len(ventes))
      ```
    choices:
      - {text: "`150 2`", correct: true}
      - {text: "`150 3`", correct: false}
      - {text: "`100 2`", correct: false}
      - {text: "`50 3`", correct: false}
    answer: "`150 2` : deux structs aux champs égaux sont la même clé ; Lyon 2026 cumule 150, et Lyon 2025 fait une seconde entrée."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype cle struct {\n\tVille string\n\tAnnee int\n}\n\nfunc main() {\n\tventes := map[cle]int{}\n\tventes[cle{\"Lyon\", 2026}] += 100\n\tventes[cle{\"Lyon\", 2026}] += 50\n\tventes[cle{\"Lyon\", 2025}] += 10\n\tfmt.Println(ventes[cle{\"Lyon\", 2026}], len(ventes))\n}\n"
      output: 150 2
  - key: code-reecrire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Stat struct{ Total int }

      m := map[string]Stat{"a": {1}}
      s := m["a"]
      s.Total += 5
      fmt.Println(m["a"].Total)
      m["a"] = s
      fmt.Println(m["a"].Total)
      ```
    choices:
      - text: |-
          ```
          1
          6
          ```
        correct: true
      - text: |-
          ```
          6
          6
          ```
        correct: false
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - text: |-
          ```
          0
          6
          ```
        correct: false
    answer: "`s := m[\"a\"]` copie la valeur : la modifier ne change pas la map (1), il faut la réécrire avec `m[\"a\"] = s` (6)."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Stat struct{ Total int }\n\nfunc main() {\n\tm := map[string]Stat{\"a\": {1}}\n\ts := m[\"a\"]\n\ts.Total += 5\n\tfmt.Println(m[\"a\"].Total)\n\tm[\"a\"] = s\n\tfmt.Println(m[\"a\"].Total)\n}\n"
      output: |-
        1
        6
  - key: code-any-panique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[any]int{}
      m["a"] = 1
      fmt.Println(len(m))
      m[[]int{1}] = 2
      ```
    choices:
      - {text: "`1`, puis une panic : hash of unhashable type []int", correct: true}
      - {text: "Ça ne compile pas : `[]int` ne peut pas être une clé", correct: false}
      - {text: "Une panic dès `m[\"a\"] = 1`, avant tout affichage", correct: false}
      - {text: "`1`, puis rien : le slice est haché par son adresse", correct: false}
    answer: "Avec `map[any]int`, la clé `[]int{1}` passe la compilation ; à l'exécution, son hachage panique, car un slice n'est pas comparable, même derrière une interface."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[any]int{}\n\tm[\"a\"] = 1\n\tfmt.Println(len(m))\n\tm[[]int{1}] = 2\n}\n"
      output: '1'
      panics: hash of unhashable type
  - key: bug-struct-valeur
    format: bug-fix
    question: |-
      Le compilateur signale « cannot assign to struct field compteurs[nom].Vues in map ». Quelle correction est la bonne ?
      ```go
      compteurs[nom].Vues++
      ```
    choices:
      - {text: "Lire la valeur, l'incrémenter, puis la réécrire dans la map", correct: true}
      - {text: "Prendre son adresse : `(&compteurs[nom]).Vues++`", correct: false}
      - {text: "Entourer l'accès de parenthèses : `(compteurs[nom]).Vues++`", correct: false}
      - {text: "Initialiser d'abord l'entrée avec `compteurs[nom] = Compteur{}`", correct: false}
    answer: |-
      ```go
      c := compteurs[nom]
      c.Vues++
      compteurs[nom] = c
      // ou une map de pointeurs : map[string]*Compteur
      ```
      Une valeur de map n'est pas adressable : on la lit, la modifie et la réécrit.
  - key: bug-cle-slice
    format: bug-fix
    question: |-
      Le compilateur signale « invalid map key type []string ». Quelle correction est la bonne ?
      ```go
      cache := map[[]string]Resultat{}
      cache[motsCles] = r
      ```
    choices:
      - {text: "Dériver une clé chaîne : `strings.Join(motsCles, \"\\x00\")`", correct: true}
      - {text: "Utiliser `map[*[]string]Resultat`, avec l'adresse du slice", correct: false}
      - {text: "Utiliser `map[any]Resultat`, qui accepte tous les types", correct: false}
      - {text: "Dériver une clé avec `fmt.Sprint(len(motsCles))`", correct: false}
    answer: |-
      ```go
      cache := map[string]Resultat{}
      cache[strings.Join(motsCles, "\x00")] = r
      ```
      Un slice n'est pas comparable ; on dérive une clé chaîne avec un séparateur qui ne peut pas apparaître dans les
      mots (ou un tableau si la taille est fixe). Une clé `any` compilerait, mais paniquerait à l'exécution.
  - key: bug-pointeur
    format: bug-fix
    question: |-
      Le cache ne trouve jamais les clients déjà vus. Pourquoi ?
      ```go
      vus := map[*Client]bool{}
      vus[&Client{ID: 7}] = true
      if vus[&Client{ID: 7}] { ... } // jamais vrai
      ```
    choices:
      - {text: "Une clé pointeur se compare par adresse, et chaque `&Client{}` est un nouvel objet", correct: true}
      - {text: "Une map de pointeurs doit être créée avec `make`, pas avec un littéral", correct: false}
      - {text: "La valeur `true` est écrasée par la valeur zéro au moment de la lecture", correct: false}
      - {text: "Les structs `Client` ne sont pas comparables et ne peuvent pas servir de clé", correct: false}
    answer: |-
      ```go
      vus := map[int]bool{}
      vus[client.ID] = true
      if vus[7] { ... }
      ```
      Une clé pointeur se compare par adresse ; on indexe par l'identifiant (ou par une struct comparable).
  - key: bug-any
    format: bug-fix
    question: |-
      Un cache générique panique avec « runtime error: hash of unhashable type []int ». Quelle correction est la bonne ?
      ```go
      var cache = map[any]any{}

      func memoriser(cle any, v any) { cache[cle] = v }
      ```
    choices:
      - {text: "Un cache générique contraint par `K comparable`, vérifié à la compilation", correct: true}
      - {text: "Un `recover` dans `memoriser`, qui ignore les clés qui paniquent", correct: false}
      - {text: "Une clé `*any`, qui rend toute valeur hachable par son adresse", correct: false}
      - {text: "Une clé `fmt.Sprint(cle)`, pour transformer toute valeur en chaîne", correct: false}
    answer: |-
      ```go
      func memoriser[K comparable, V any](cache map[K]V, cle K, v V) {
      	cache[cle] = v
      }
      ```
      Avec `any`, une clé non comparable passe la compilation et panique à l'exécution ; la contrainte `comparable`
      reporte la vérification à la compilation. `fmt.Sprint` confondrait des clés différentes qui s'affichent pareil.
  - key: qcm-egalite-struct
    format: multiple-choice
    question: Avec `type K struct{ A string; B int }`, quand `K{"x", 1}` et `K{"x", 1}` désignent-elles la même entrée d'une map ?
    choices:
      - text: Toujours, car tous leurs champs sont égaux
        correct: true
      - text: Seulement si ce sont la même variable
        correct: false
      - text: Jamais, chaque struct est une clé distincte
        correct: false
      - text: Seulement si K a une méthode Equals
        correct: false
    answer: L'égalité de structs compare les champs ; Go n'utilise pas de méthode d'égalité.
