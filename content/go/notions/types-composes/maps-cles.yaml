notion: maps-cles
cards:
  - key: types-peuvent-etre-cles-map
    format: course
    question: Quels types peuvent être clés de map ?
    answer: Les types comparables ; pas les slices, maps ni fonctions.
  - key: m-k-compile
    format: course
    question: Pourquoi `&m[k]` ne compile-t-il pas ?
    answer: Les éléments d'une map peuvent être déplacés lors de la croissance.
  - key: code-ecrire-m-5-avec-m
    format: code-output
    question: Peut-on écrire `m["a"].n = 5` avec `m := map[string]T{...}` ? Et avec `map[string]*T` ?
    answer: Non pour une map de valeurs (élément non adressable, erreur de compilation) ; oui pour une map de pointeurs.
    check:
      code: "package main\n\ntype T struct{ n int }\n\nfunc main() {\n\tm := map[string]T{\"a\": {}}\n\tm[\"a\"].n = 5\n}\n"
      compiles: false
