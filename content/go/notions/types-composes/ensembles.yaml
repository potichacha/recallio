notion: ensembles
lesson: |-
  Go n'a pas de type « ensemble » natif : on utilise une **map dont seules les clés comptent**.

  ```go
  vus := map[string]struct{}{}   // struct{} n'occupe aucun octet
  vus["ada"] = struct{}{}
  _, ok := vus["ada"]            // appartenance
  delete(vus, "ada")             // retrait
  len(vus)                       // taille

  actifs := map[string]bool{}    // variante plus lisible
  actifs["ada"] = true
  if actifs["ada"] { ... }       // une clé absente vaut false
  ```

  - **`map[T]struct{}`** : la valeur vide ne coûte rien en mémoire ; l'appartenance se teste avec `_, ok`.
  - **`map[T]bool`** : un peu plus de mémoire, mais `if s[x]` se lit plus simplement. Attention à ne stocker que `true`,
    sinon `false` présent et absent se confondent.
  - Depuis les generics, on écrit volontiers un petit type `Ensemble[T comparable] map[T]struct{}` avec `Ajouter`,
    `Contient`, `Union`...
  - Les éléments doivent être **comparables** (règle des clés de map), et l'ensemble n'a **pas d'ordre**.

  Usages : dédoublonner, mémoriser les éléments déjà vus (parcours de graphe), tester l'appartenance en O(1) au lieu d'un
  `slices.Contains` en O(n).

  **Piège classique** : dédoublonner un slice avec une map et perdre l'ordre d'origine. On parcourt le slice et l'on
  n'ajoute au résultat que les éléments pas encore vus.

  **En entretien** : « Une map[T]struct{} (ou map[T]bool) : appartenance en O(1), pas d'ordre, éléments comparables ; un
  type générique Ensemble[T] pour l'API. »
tour:
  - title: Un ensemble
    text: |-
      Go n'a pas de type « ensemble » : on utilise une map dont seules les clés comptent. Deux écritures :

      - `map[string]bool`, qu'on teste avec `if vus[x]`, simple à lire ; - `map[string]struct{}`, dont la valeur
      `struct{}{}` n'occupe aucune mémoire, et qu'on teste avec la forme `_, ok := vus[x]`.

      Les deux conviennent ; la seconde est courante dans les bibliothèques. Ici, on retire les doublons d'une liste en
      gardant l'ordre de première apparition.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mots := []string{"go", "java", "go", "rust", "java"}
          	vus := map[string]struct{}{}
          	var uniques []string
          	for _, mot := range mots {
          		if _, ok := vus[mot]; !ok {
          			vus[mot] = struct{}{}
          			uniques = append(uniques, mot)
          		}
          	}
          	fmt.Println(uniques, len(vus))
          }
      output: |-
        [go java rust] 3
cards:
  - key: implementer-ensemble
    format: course
    question: "Comment implémente-t-on un ensemble en Go ?"
    choices:
      - {text: "Avec une `map[T]struct{}`, dont les clés sont les éléments", correct: true}
      - {text: "Avec le type natif `set[T]`, ajouté par les génériques", correct: false}
      - {text: "Avec un `[]T` et `slices.Contains`, qui teste en O(1)", correct: false}
      - {text: "Avec une `container/list`, qui refuse les doublons", correct: false}
    answer: "Go n'a pas de type ensemble : on utilise une `map[T]struct{}`, dont les clés sont les éléments et la valeur vide ne coûte rien. `slices.Contains` parcourt le slice, en O(n)."
  - key: struct-vide
    format: course
    question: Pourquoi utiliser `struct{}` comme valeur d'un ensemble ?
    choices:
      - {text: "Elle n'occupe aucun octet : seules les clés coûtent de la mémoire", correct: true}
      - {text: "Elle vaut nil, ce qui marque l'absence d'un élément de l'ensemble", correct: false}
      - {text: "Elle rend la map sûre entre goroutines, sans verrou à ajouter", correct: false}
      - {text: "Elle fait garder à la map ses clés dans l'ordre d'insertion", correct: false}
    answer: "`struct{}` n'occupe aucun octet : seules les clés coûtent de la mémoire, et le type dit qu'aucune donnée n'est associée. Une `map[T]bool` marche aussi, avec un octet par entrée et un test plus court (`if vus[k]`)."
  - key: dedoublonner
    format: course
    question: Comment dédoublonner un slice en gardant l'ordre ?
    choices:
      - {text: "Parcourir le slice, garder un ensemble des vus, n'ajouter que les nouveaux", correct: true}
      - {text: "Trier le slice, puis retirer les voisins égaux avec `slices.Compact`", correct: false}
      - {text: "Mettre les éléments dans une map, puis reparcourir ses clés avec `range`", correct: false}
      - {text: "Appeler `slices.Compact` sur le slice, qui retire tous les doublons", correct: false}
    answer: "Un ensemble des éléments déjà vus, consulté à chaque tour, garde l'ordre d'origine en O(n). Trier puis compacter dédoublonne aussi, mais perd l'ordre, tout comme le parcours d'une map ; `Compact` seul ne retire que les doublons voisins."
  - key: contains
    format: course
    question: Pourquoi un ensemble plutôt que `slices.Contains` pour tester l'appartenance ?
    choices:
      - {text: "Le test dans une map est en O(1) en moyenne, contre O(n) pour le slice", correct: true}
      - {text: "`slices.Contains` ne marche que sur un slice trié au préalable", correct: false}
      - {text: "`slices.Contains` compare les adresses des éléments, pas leurs valeurs", correct: false}
      - {text: "Une map garde ses éléments triés, ce qui accélère chaque recherche", correct: false}
    answer: "Le test dans une map est en O(1) en moyenne, contre O(n) pour un parcours du slice ; dans une boucle, c'est la différence entre O(n) et O(n²). `slices.Contains` marche sur tout slice, trié ou non, et compare les valeurs."
  - key: vf-natif
    format: true-false
    question: Go dispose d'un type `set` natif.
    truth: false
    answer: On utilise une map dont seules les clés comptent.
  - key: vf-bool
    format: true-false
    question: Avec `map[string]bool`, `if s["x"]` est faux pour un élément absent.
    truth: true
    answer: Une clé absente donne la valeur zéro, false.
  - key: vf-ordre
    format: true-false
    question: Un ensemble fondé sur une map garde l'ordre d'insertion.
    truth: false
    answer: Comme toute map, il n'a pas d'ordre.
  - key: vf-taille
    format: true-false
    question: '`struct{}{}` occupe un octet en mémoire.'
    truth: false
    answer: Une struct vide a une taille de zéro.
  - key: qcm-declarer
    format: multiple-choice
    question: Quelles déclarations font un ensemble de chaînes ?
    choices:
      - text: '`map[string]struct{}{}`'
        correct: true
      - text: '`map[string]bool{}`'
        correct: true
      - text: '`[]string{}`, pour l''appartenance en O(1)'
        correct: false
      - text: '`set[string]{}`'
        correct: false
    answer: Un slice demande un parcours pour tester l'appartenance.
  - key: qcm-tester
    format: multiple-choice
    question: Comment tester l'appartenance dans `vus := map[int]struct{}{}` ?
    choices:
      - text: '`_, ok := vus[x]`'
        correct: true
      - text: '`vus[x] == struct{}{}`'
        correct: false
      - text: '`vus.contains(x)`'
        correct: false
      - text: '`vus[x] != nil`'
        correct: false
    answer: La forme `v, ok` ; la valeur vide est la même que l'élément soit présent ou non.
  - key: qcm-generique
    format: multiple-choice
    question: Quelle contrainte faut-il pour `type Ensemble[T ???] map[T]struct{}` ?
    choices:
      - text: '`comparable`'
        correct: true
      - text: '`any`'
        correct: false
      - text: '`cmp.Ordered`, obligatoirement'
        correct: false
      - text: '`fmt.Stringer`'
        correct: false
    answer: Une clé de map doit être comparable.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lequel de ces cas un ensemble est-il le bon outil ?"
    choices:
      - {text: "Mémoriser les nœuds déjà visités dans un parcours de graphe", correct: true}
      - {text: "Garder des éléments triés, pour les afficher dans l'ordre", correct: false}
      - {text: "Compter les occurrences de chaque élément d'une liste", correct: false}
      - {text: "Garder les éléments dans leur ordre d'arrivée, doublons compris", correct: false}
    answer: "Un ensemble répond à « déjà vu ? » en O(1) : nœuds visités, dédoublonnage d'identifiants. Pour compter, une `map[T]int` ; pour trier, un slice trié ; pour garder l'ordre et les doublons, un slice."
  - key: trous-ajouter
    format: fill-in
    question: |-
      Complète l'ajout dans un ensemble :
      ```go
      vus := map[string]struct{}{}
      vus["ada"] = ___
      ```
    blanks:
      - - struct{}{}
    answer: La valeur de la struct vide.
  - key: trous-tester
    format: fill-in
    question: |-
      Complète le test d'appartenance :
      ```go
      if _, ___ := vus[id]; ok {
      	continue
      }
      ```
    blanks:
      - - ok
    answer: La forme « v, ok ».
  - key: trous-type
    format: fill-in
    question: |-
      Complète l'ensemble générique :
      ```go
      type Ensemble[T ___] map[T]struct{}
      ```
    blanks:
      - - comparable
    answer: Les clés doivent être comparables.
  - key: trous-bool
    format: fill-in
    question: |-
      Complète la variante booléenne :
      ```go
      actifs := map[string]___{}
      actifs["ada"] = true
      ```
    blanks:
      - - bool
    answer: Une clé absente vaut false.
  - key: code-dedoublonner
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ids := []int{3, 1, 3, 2, 1}
      vus := map[int]struct{}{}
      var uniques []int
      for _, id := range ids {
      	if _, ok := vus[id]; !ok {
      		vus[id] = struct{}{}
      		uniques = append(uniques, id)
      	}
      }
      fmt.Println(uniques, len(vus))
      ```
    choices:
      - {text: "`[3 1 2] 3`", correct: true}
      - {text: "`[1 2 3] 3`", correct: false}
      - {text: "`[3 1 2] 5`", correct: false}
      - {text: "`[3 1 3 2 1] 3`", correct: false}
    answer: "`[3 1 2] 3` : l'ordre d'origine est gardé (on parcourt le slice, pas la map), et l'ensemble a trois éléments."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tids := []int{3, 1, 3, 2, 1}\n\tvus := map[int]struct{}{}\n\tvar uniques []int\n\tfor _, id := range ids {\n\t\tif _, ok := vus[id]; !ok {\n\t\t\tvus[id] = struct{}{}\n\t\t\tuniques = append(uniques, id)\n\t\t}\n\t}\n\tfmt.Println(uniques, len(vus))\n}\n"
      output: '[3 1 2] 3'
  - key: code-taille
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(unsafe.Sizeof(struct{}{}), unsafe.Sizeof(true))
      ```
    choices:
      - {text: "`0 1`", correct: true}
      - {text: "`0 0`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`8 1`", correct: false}
    answer: "`0 1` : la struct vide n'occupe aucun octet, un booléen en occupe un."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\nfunc main() {\n\tfmt.Println(unsafe.Sizeof(struct{}{}), unsafe.Sizeof(true))\n}\n"
      output: 0 1
  - key: code-generique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Ensemble[T comparable] map[T]struct{}

      func (e Ensemble[T]) Ajouter(v T)          { e[v] = struct{}{} }
      func (e Ensemble[T]) Contient(v T) bool { _, ok := e[v]; return ok }

      e := Ensemble[string]{}
      e.Ajouter("go")
      e.Ajouter("go")
      fmt.Println(e.Contient("go"), e.Contient("java"), len(e))
      ```
    choices:
      - {text: "`true false 1`", correct: true}
      - {text: "`true false 2`", correct: false}
      - {text: "`true true 1`", correct: false}
      - {text: "`false false 0`", correct: false}
    answer: "`true false 1` : ajouter deux fois `\"go\"` écrit la même clé, et un ensemble ne garde qu'un exemplaire de chaque élément. Une map passée par valeur au receveur reste la même map."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Ensemble[T comparable] map[T]struct{}\n\n\nfunc (e Ensemble[T]) Ajouter(v T)          { e[v] = struct{}{} }\n\nfunc (e Ensemble[T]) Contient(v T) bool { _, ok := e[v]; return ok }\n\nfunc main() {\n\te := Ensemble[string]{}\n\te.Ajouter(\"go\")\n\te.Ajouter(\"go\")\n\tfmt.Println(e.Contient(\"go\"), e.Contient(\"java\"), len(e))\n}\n"
      output: true false 1
  - key: code-intersection
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a := map[string]bool{"go": true, "java": true, "rust": true}
      b := map[string]bool{"go": true, "rust": true, "c": true}
      var communs []string
      for k := range a {
      	if b[k] {
      		communs = append(communs, k)
      	}
      }
      slices.Sort(communs)
      fmt.Println(communs)
      ```
    choices:
      - {text: "`[go rust]`", correct: true}
      - {text: "`[rust go]`", correct: false}
      - {text: "`[go java rust]`", correct: false}
      - {text: "`[c go java rust]`", correct: false}
    answer: "`[go rust]` : l'intersection, triée par `slices.Sort` pour un résultat stable ; sans le tri, l'ordre suivrait celui, aléatoire, du parcours de la map."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ta := map[string]bool{\"go\": true, \"java\": true, \"rust\": true}\n\tb := map[string]bool{\"go\": true, \"rust\": true, \"c\": true}\n\tvar communs []string\n\tfor k := range a {\n\t\tif b[k] {\n\t\t\tcommuns = append(communs, k)\n\t\t}\n\t}\n\tslices.Sort(communs)\n\tfmt.Println(communs)\n}\n"
      output: '[go rust]'
