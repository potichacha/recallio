notion: maps-nil
cards:
  - key: passe-si-ecrit-map-nil
    format: course
    question: Que se passe-t-il si on écrit dans une map nil ?
    answer: Un panic ; la lecture renvoie la valeur zéro.
  - key: code-var-m-map-string-int
    format: code-output
    question: |-
      ```go
      var m map[string]int
      fmt.Println(m["x"], len(m))
      m["x"] = 1
      ```
    answer: '`0 0`, puis **panic** (`assignment to entry in nil map`) : lire une map nil est permis, y écrire non.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"x\"], len(m))\n\tm[\"x\"] = 1\n}\n"
      output: 0 0
      panics: assignment to entry in nil map
