notion: maps-nil
lesson: |-
  La valeur zéro d'une map est **nil**. Une map nil se comporte comme une map **vide en lecture**, mais **panique à
  l'écriture** :

  ```go
  var m map[string]int   // nil
  fmt.Println(m["x"])    // 0 : lecture permise
  fmt.Println(len(m))    // 0
  for k := range m {}    // aucune itération
  delete(m, "x")         // permis, ne fait rien
  m["x"] = 1             // panic: assignment to entry in nil map
  ```

  On crée une map utilisable avec `make(map[K]V)` ou un littéral `map[K]V{}`.

  Le cas typique : un **champ de struct** de type map, jamais initialisé. Deux réponses :
  - un **constructeur** qui crée la map ;
  - une **initialisation paresseuse** dans la méthode qui écrit (`if c.m == nil { c.m = make(...) }`), qui rend la
    valeur zéro du type utilisable.

  Décoder du JSON dans une map nil est permis : `json.Unmarshal` crée la map. Et `maps.Clone(nil)` renvoie nil.

  **Piège classique** : une struct décodée ou créée par `var c Config`, dont le champ `Options map[string]string` est nil,
  puis `c.Options["mode"] = "x"`. La panique survient loin de la déclaration.

  **En entretien** : « Une map nil se lit comme une map vide, mais toute écriture panique ; make ou un littéral avant
  d'écrire, ou une initialisation paresseuse dans les méthodes. »
tour:
  - title: La map nil
    text: |-
      La valeur zéro d'une map est `nil`. Une map `nil` se **lit** sans problème : elle est vide, `len` vaut 0, et toute
      clé donne la valeur zéro. Mais **écrire** dedans provoque une panic : « assignment to entry in nil map ».

      Il faut donc créer la map avant d'y écrire, avec un littéral ou `make`. Le piège arrive souvent avec un champ de
      struct de type map, resté à sa valeur zéro.

      Essaie : supprime la ligne qui appelle `make`, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	var stock map[string]int
          	fmt.Println(stock == nil, len(stock), stock["pommes"])

          	stock = make(map[string]int)
          	stock["pommes"] = 3
          	fmt.Println(stock)
          }
      output: |-
        true 0 0
        map[pommes:3]
cards:
  - key: passe-si-ecrit-map-nil
    format: course
    question: "Que se passe-t-il quand on écrit dans une map nil ?"
    choices:
      - {text: "Une panic, alors que la lecture renvoie la valeur zéro", correct: true}
      - {text: "Go crée la map à la volée, puis y range la valeur", correct: false}
      - {text: "Une erreur de compilation : la map n'est pas initialisée", correct: false}
      - {text: "Rien : l'écriture est ignorée, sans erreur ni panic", correct: false}
    answer: "Une panic (« assignment to entry in nil map ») ; la lecture, elle, renvoie la valeur zéro. Le compilateur ne peut pas le voir : une map peut devenir nil à l'exécution."
  - key: code-var-m-map-string-int
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]int
      fmt.Println(m["x"], len(m))
      m["x"] = 1
      ```
    choices:
      - {text: "`0 0`, puis une panic : assignment to entry in nil map", correct: true}
      - {text: "Une panic dès la lecture de `m[\"x\"]`, avant tout affichage", correct: false}
      - {text: "Ça ne compile pas : `m` est utilisée sans être initialisée", correct: false}
      - {text: "`0 0`, puis la map contient `x` sans aucune erreur", correct: false}
    answer: "Lire une map nil est permis (valeur zéro, `len` à 0) ; y écrire panique. Le compilateur accepte le code : une variable non initialisée vaut sa valeur zéro, ici nil."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"x\"], len(m))\n\tm[\"x\"] = 1\n}\n"
      output: 0 0
      panics: assignment to entry in nil map
  - key: operations-permises
    format: course
    question: Quelles opérations sont permises sur une map nil ?
    choices:
      - {text: "La lecture, `len`, `range` et `delete` ; seule l'écriture panique", correct: true}
      - {text: "Aucune : toute opération sur une map nil provoque une panic", correct: false}
      - {text: "La lecture seulement ; `len`, `range` et `delete` paniquent", correct: false}
      - {text: "Toutes : la première écriture crée la map automatiquement", correct: false}
    answer: "Une map nil se comporte comme une map vide en lecture : valeur zéro, `len` à 0, `range` sans tour, `delete` sans effet. Seule l'écriture panique."
  - key: paresseuse
    format: course
    question: Comment rendre utilisable la valeur zéro d'un type qui contient une map ?
    choices:
      - {text: "Créer la map au premier besoin, dans la méthode qui écrit, si elle vaut nil", correct: true}
      - {text: "Donner au champ une valeur par défaut dans la struct : `m map[K]V = make(...)`", correct: false}
      - {text: "Rattraper la panique de la première écriture avec `recover`, puis la créer", correct: false}
      - {text: "Déclarer le champ comme un `*map[K]V`, qui ne vaut jamais nil", correct: false}
    answer: "Dans la méthode qui écrit : `if t.m == nil { t.m = make(map[K]V) }`. Ainsi `var t T` ou `T{}` sont utilisables tels quels ; Go n'a pas de valeur par défaut pour un champ de struct."
  - key: unmarshal
    format: course
    question: Faut-il créer la map avant `json.Unmarshal(data, &m)` ?
    choices:
      - {text: "Non : si `m` est nil, `Unmarshal` alloue une nouvelle map", correct: true}
      - {text: "Oui : sinon `Unmarshal` panique en écrivant dans la map nil", correct: false}
      - {text: "Oui : sinon `Unmarshal` renvoie une erreur et laisse `m` à nil", correct: false}
      - {text: "Non, à condition de passer `m` plutôt que `&m` à `Unmarshal`", correct: false}
    answer: "Non : avec `&m`, `Unmarshal` alloue une map si `m` vaut nil, puis la remplit. Il faut bien passer un pointeur : sans lui, `Unmarshal` renvoie une erreur `InvalidUnmarshalError`."
  - key: vf-lecture
    format: true-false
    question: Lire une clé dans une map nil panique.
    truth: false
    answer: La lecture renvoie la valeur zéro.
  - key: vf-ecriture
    format: true-false
    question: Écrire dans une map nil panique.
    truth: true
    answer: « assignment to entry in nil map ».
  - key: vf-delete
    format: true-false
    question: '`delete` sur une map nil panique.'
    truth: false
    answer: Il ne fait rien.
  - key: vf-litteral
    format: true-false
    question: '`m := map[string]int{}` crée une map nil.'
    truth: false
    answer: Un littéral, même vide, crée une map utilisable.
  - key: qcm-nil
    format: multiple-choice
    question: Lesquelles sont des maps nil ?
    choices:
      - text: '`var m map[string]int`'
        correct: true
      - text: Le champ map d'une struct déclarée par `var c Config`
        correct: true
      - text: '`m := make(map[string]int)`'
        correct: false
      - text: '`m := map[string]int{}`'
        correct: false
    answer: '`make` et le littéral allouent la table.'
  - key: qcm-paniques
    format: multiple-choice
    question: "Sur une map nil `m`, laquelle de ces opérations panique ?"
    choices:
      - {text: "`m[\"a\"]++`", correct: true}
      - {text: "`v := m[\"a\"]`", correct: false}
      - {text: "`len(m)`", correct: false}
      - {text: "`delete(m, \"a\")`", correct: false}
    answer: "`m[\"a\"]++` lit puis écrit : l'écriture panique, comme `m[\"a\"] = 1`. Lecture, `len` et `delete` sont permis sur une map nil."
  - key: qcm-corriger
    format: multiple-choice
    question: "Comment éviter la panique d'un champ map jamais initialisé, même pour une valeur créée sans constructeur ?"
    choices:
      - {text: "Une initialisation paresseuse dans la méthode qui écrit", correct: true}
      - {text: "Un constructeur qui crée la map, et rien d'autre", correct: false}
      - {text: "Un `recover` autour de chaque écriture dans la map", correct: false}
      - {text: "Un champ déclaré avec le type `*map[string]int`", correct: false}
    answer: "L'initialisation paresseuse (`if t.m == nil { t.m = make(...) }`) protège aussi les valeurs créées sans le constructeur, comme `T{}` ou `var t T`. Un constructeur seul ne couvre pas ces cas ; `recover` masquerait le bug, et un pointeur vers une map n'aide pas."
  - key: code-lecture
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]int
      v, ok := m["x"]
      delete(m, "x")
      fmt.Println(v, ok, len(m), m == nil)
      ```
    choices:
      - {text: "`0 false 0 true`", correct: true}
      - {text: "`0 false 0 false`", correct: false}
      - {text: "`0 true 0 true`", correct: false}
      - {text: "Une panic : `delete` sur une map nil", correct: false}
    answer: "`0 false 0 true` : lecture, `delete` et `len` fonctionnent sur une map nil, qui reste nil."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tv, ok := m[\"x\"]\n\tdelete(m, \"x\")\n\tfmt.Println(v, ok, len(m), m == nil)\n}\n"
      output: 0 false 0 true
  - key: code-unmarshal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]int
      json.Unmarshal([]byte(`{"a":1}`), &m)
      fmt.Println(m, m == nil)
      ```
    choices:
      - {text: "`map[a:1] false`", correct: true}
      - {text: "`map[] true`", correct: false}
      - {text: "`map[a:1] true`", correct: false}
      - {text: "Une panic : assignment to entry in nil map", correct: false}
    answer: "`map[a:1] false` : recevant un pointeur vers une map nil, `Unmarshal` a créé la map avant de la remplir."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]int\n\tjson.Unmarshal([]byte(`{\"a\":1}`), &m)\n\tfmt.Println(m, m == nil)\n}\n"
      output: map[a:1] false
  - key: code-champ
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Config struct {
      	Options map[string]string
      }

      var c Config
      fmt.Println(len(c.Options))
      c.Options["mode"] = "test"
      ```
    choices:
      - {text: "`0`, puis une panic : assignment to entry in nil map", correct: true}
      - {text: "Ça ne compile pas : `Options` n'est pas initialisé", correct: false}
      - {text: "Une panic dès `len(c.Options)`, avant tout affichage", correct: false}
      - {text: "`0`, puis la map contient `mode` sans erreur", correct: false}
    answer: "`var c Config` met chaque champ à sa valeur zéro : `Options` vaut nil. `len` y donne 0, mais l'écriture panique."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct {\n\tOptions map[string]string\n}\n\nfunc main() {\n\tvar c Config\n\tfmt.Println(len(c.Options))\n\tc.Options[\"mode\"] = \"test\"\n}\n"
      output: '0'
      panics: assignment to entry in nil map
  - key: bug-champ
    format: bug-fix
    question: |-
      Le service panique au premier enregistrement. Quelle correction est la bonne ?
      ```go
      type Registre struct {
      	handlers map[string]Handler
      }

      func (r *Registre) Enregistrer(nom string, h Handler) {
      	r.handlers[nom] = h
      }
      ```
    choices:
      - {text: "Créer la map si elle vaut nil, au début d'`Enregistrer`", correct: true}
      - {text: "Passer le receveur par valeur, `(r Registre)`, initialisé à l'appel", correct: false}
      - {text: "Déclarer le champ `handlers map[string]Handler{}` dans la struct", correct: false}
      - {text: "Rattraper la panique dans `Enregistrer` avec `defer recover()`", correct: false}
    answer: "```go\nfunc (r *Registre) Enregistrer(nom string, h Handler) {\n\tif r.handlers == nil {\n\t\tr.handlers = make(map[string]Handler)\n\t}\n\tr.handlers[nom] = h\n}\n```\nL'initialisation paresseuse rend `var r Registre` utilisable."
  - key: bug-var
    format: bug-fix
    question: |-
      Ce code panique. Quelle correction est la bonne ?
      ```go
      var compte map[string]int
      for _, m := range mots {
      	compte[m]++
      }
      ```
    choices:
      - {text: "Allouer la map : `compte := make(map[string]int)`", correct: true}
      - {text: "Initialiser l'entrée avec `compte[m] = 0` avant `compte[m]++`", correct: false}
      - {text: "Déclarer `var compte map[string]int{}`, une map vide", correct: false}
      - {text: "Remplacer `compte[m]++` par `compte[m] += 1`", correct: false}
    answer: |-
      ```go
      compte := make(map[string]int)
      for _, m := range mots {
      	compte[m]++
      }
      ```
      `var` déclare une map nil ; il faut l'allouer avant d'écrire. `compte[m] = 0` est déjà une écriture, qui panique de la même façon.
  - key: bug-reset
    format: bug-fix
    question: |-
      Après `Reinitialiser`, la méthode `Ajouter` panique. Quelle correction est la bonne ?
      ```go
      func (s *Stats) Reinitialiser() { s.parJour = nil }
      ```
    choices:
      - {text: "Vider la map sans la détruire : `clear(s.parJour)`", correct: true}
      - {text: "Vider comme un slice : `s.parJour = s.parJour[:0]`", correct: false}
      - {text: "Appeler `runtime.GC()` juste après la remise à nil", correct: false}
      - {text: "Passer le receveur par valeur : `(s Stats) Reinitialiser()`", correct: false}
    answer: |-
      ```go
      func (s *Stats) Reinitialiser() { clear(s.parJour) }
      ```
      Remettre la map à nil rend les écritures fatales ; `clear` la vide en la gardant utilisable. Un receveur par valeur ne panique plus, mais ne réinitialise plus rien.
  - key: bug-copie-struct
    format: bug-fix
    question: |-
      Le constructeur crée bien la map, mais les tests qui construisent `Panier{}` directement paniquent. Quelle correction est la bonne ?
      ```go
      func NouveauPanier() *Panier { return &Panier{lignes: map[string]int{}} }
      func (p *Panier) Ajouter(ref string) { p.lignes[ref]++ }
      ```
    choices:
      - {text: "Créer la map dans `Ajouter` si elle vaut nil : une initialisation paresseuse", correct: true}
      - {text: "Faire de `lignes` un `*map[string]int`, alloué par `new` dans le constructeur", correct: false}
      - {text: "Interdire `Panier{}` dans les tests et n'utiliser que `NouveauPanier()`", correct: false}
      - {text: "Écrire `p.lignes[ref] = p.lignes[ref] + 1` au lieu de `p.lignes[ref]++`", correct: false}
    answer: "```go\nfunc (p *Panier) Ajouter(ref string) {\n\tif p.lignes == nil {\n\t\tp.lignes = map[string]int{}\n\t}\n\tp.lignes[ref]++\n}\n```\nUne initialisation paresseuse protège aussi les valeurs créées sans le constructeur."
  - key: qcm-json-nil
    format: multiple-choice
    question: Comment `json.Marshal` encode-t-il une map nil de type `map[string]int` ?
    choices:
      - text: '`null`'
        correct: true
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
      - text: Une chaîne vide
        correct: false
    answer: Comme un slice nil ; une map vide non nil donne `{}`.
