notion: maps-nil
lesson: |-
  La valeur zéro d'une map est **nil**. Une map nil se comporte comme une map **vide en lecture**, mais **panique à
  l'écriture** :

  ```go
  var m map[string]int   // nil
  fmt.Println(m["x"])    // 0 : lecture permise
  fmt.Println(len(m))    // 0
  for k := range m {}    // aucune itération
  delete(m, "x")         // permis, ne fait rien
  m["x"] = 1             // panic: assignment to entry in nil map
  ```

  On crée une map utilisable avec `make(map[K]V)` ou un littéral `map[K]V{}`.

  Le cas typique : un **champ de struct** de type map, jamais initialisé. Deux réponses :
  - un **constructeur** qui crée la map ;
  - une **initialisation paresseuse** dans la méthode qui écrit (`if c.m == nil { c.m = make(...) }`), qui rend la
    valeur zéro du type utilisable.

  Décoder du JSON dans une map nil est permis : `json.Unmarshal` crée la map. Et `maps.Clone(nil)` renvoie nil.

  **Piège classique** : une struct décodée ou créée par `var c Config`, dont le champ `Options map[string]string` est nil,
  puis `c.Options["mode"] = "x"`. La panique survient loin de la déclaration.

  **En entretien** : « Une map nil se lit comme une map vide, mais toute écriture panique ; make ou un littéral avant
  d'écrire, ou une initialisation paresseuse dans les méthodes. »
cards:
  - key: passe-si-ecrit-map-nil
    format: course
    question: Que se passe-t-il si on écrit dans une map nil ?
    answer: Un panic ; la lecture renvoie la valeur zéro.
  - key: code-var-m-map-string-int
    format: code-output
    question: |-
      ```go
      var m map[string]int
      fmt.Println(m["x"], len(m))
      m["x"] = 1
      ```
    answer: '`0 0`, puis **panic** (`assignment to entry in nil map`) : lire une map nil est permis, y écrire non.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"x\"], len(m))\n\tm[\"x\"] = 1\n}\n"
      output: 0 0
      panics: assignment to entry in nil map
  - key: operations-permises
    format: course
    question: Quelles opérations sont permises sur une map nil ?
    answer: La lecture (valeur zéro), `len` (0), `range` (aucune itération) et `delete` (sans effet) ; seule l'écriture panique.
  - key: paresseuse
    format: course
    question: Comment rendre utilisable la valeur zéro d'un type qui contient une map ?
    answer: 'En créant la map au premier besoin dans la méthode qui écrit : `if t.m == nil { t.m = make(map[K]V) }`.'
  - key: unmarshal
    format: course
    question: Faut-il créer la map avant `json.Unmarshal(data, &m)` ?
    answer: 'Non : si `m` est nil, `Unmarshal` alloue une nouvelle map.'
  - key: vf-lecture
    format: true-false
    question: Lire une clé dans une map nil panique.
    truth: false
    answer: La lecture renvoie la valeur zéro.
  - key: vf-ecriture
    format: true-false
    question: Écrire dans une map nil panique.
    truth: true
    answer: « assignment to entry in nil map ».
  - key: vf-delete
    format: true-false
    question: '`delete` sur une map nil panique.'
    truth: false
    answer: Il ne fait rien.
  - key: vf-litteral
    format: true-false
    question: '`m := map[string]int{}` crée une map nil.'
    truth: false
    answer: Un littéral, même vide, crée une map utilisable.
  - key: qcm-nil
    format: multiple-choice
    question: Lesquelles sont des maps nil ?
    choices:
      - text: '`var m map[string]int`'
        correct: true
      - text: Le champ map d'une struct déclarée par `var c Config`
        correct: true
      - text: '`m := make(map[string]int)`'
        correct: false
      - text: '`m := map[string]int{}`'
        correct: false
    answer: '`make` et le littéral allouent la table.'
  - key: qcm-paniques
    format: multiple-choice
    question: Sur une map nil `m`, quelles opérations paniquent ?
    choices:
      - text: '`m["a"] = 1`'
        correct: true
      - text: '`m["a"]++`'
        correct: true
      - text: '`v := m["a"]`'
        correct: false
      - text: '`len(m)`'
        correct: false
    answer: '`m["a"]++` est une écriture.'
  - key: qcm-corriger
    format: multiple-choice
    question: Comment éviter la panique d'un champ map jamais initialisé ?
    choices:
      - text: Un constructeur qui crée la map
        correct: true
      - text: Une initialisation paresseuse dans la méthode qui écrit
        correct: true
      - text: Un `recover` autour de chaque écriture
        correct: false
      - text: Déclarer le champ avec `*map[string]int`
        correct: false
    answer: '`recover` masquerait le bug, et un pointeur vers une map n''aide pas.'
  - key: code-lecture
    format: code-output
    question: |-
      ```go
      var m map[string]int
      v, ok := m["x"]
      delete(m, "x")
      fmt.Println(v, ok, len(m), m == nil)
      ```
    answer: '`0 false 0 true` : lecture, delete et len fonctionnent sur une map nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar m map[string]int\n\tv, ok := m[\"x\"]\n\tdelete(m, \"x\")\n\tfmt.Println(v, ok, len(m), m == nil)\n}\n"
      output: 0 false 0 true
  - key: code-unmarshal
    format: code-output
    question: |-
      ```go
      var m map[string]int
      json.Unmarshal([]byte(`{"a":1}`), &m)
      fmt.Println(m, m == nil)
      ```
    answer: '`map[a:1] false` : Unmarshal a créé la map.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]int\n\tjson.Unmarshal([]byte(`{\"a\":1}`), &m)\n\tfmt.Println(m, m == nil)\n}\n"
      output: map[a:1] false
  - key: code-champ
    format: code-output
    question: "```go\ntype Config struct {\n\tOptions map[string]string\n}\n\nvar c Config\nfmt.Println(len(c.Options))\nc.Options[\"mode\"] = \"test\"\n```"
    answer: '`0`, puis une panique : le champ map vaut nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Config struct {\n\tOptions map[string]string\n}\n\nfunc main() {\n\tvar c Config\n\tfmt.Println(len(c.Options))\n\tc.Options[\"mode\"] = \"test\"\n}\n"
      output: '0'
      panics: assignment to entry in nil map
  - key: bug-champ
    format: bug-fix
    question: "Le service panique au premier enregistrement :\n```go\ntype Registre struct {\n\thandlers map[string]Handler\n}\n\nfunc (r *Registre) Enregistrer(nom string, h Handler) {\n\tr.handlers[nom] = h\n}\n```"
    answer: "```go\nfunc (r *Registre) Enregistrer(nom string, h Handler) {\n\tif r.handlers == nil {\n\t\tr.handlers = make(map[string]Handler)\n\t}\n\tr.handlers[nom] = h\n}\n```\nL'initialisation paresseuse rend `var r Registre` utilisable."
  - key: bug-var
    format: bug-fix
    question: "Ce code panique :\n```go\nvar compte map[string]int\nfor _, m := range mots {\n\tcompte[m]++\n}\n```"
    answer: "```go\ncompte := make(map[string]int)\nfor _, m := range mots {\n\tcompte[m]++\n}\n```\n`var` déclare une map nil ; il faut l'allouer avant d'écrire."
  - key: bug-reset
    format: bug-fix
    question: |-
      Après `Reinitialiser`, la méthode `Ajouter` panique :
      ```go
      func (s *Stats) Reinitialiser() { s.parJour = nil }
      ```
    answer: |-
      ```go
      func (s *Stats) Reinitialiser() { clear(s.parJour) }
      ```
      Remettre la map à nil rend les écritures fatales ; `clear` la vide en la gardant utilisable.
  - key: bug-copie-struct
    format: bug-fix
    question: |-
      Le constructeur crée bien la map, mais les tests qui construisent `Panier{}` directement paniquent :
      ```go
      func NouveauPanier() *Panier { return &Panier{lignes: map[string]int{}} }
      func (p *Panier) Ajouter(ref string) { p.lignes[ref]++ }
      ```
    answer: "```go\nfunc (p *Panier) Ajouter(ref string) {\n\tif p.lignes == nil {\n\t\tp.lignes = map[string]int{}\n\t}\n\tp.lignes[ref]++\n}\n```\nUne initialisation paresseuse protège aussi les valeurs créées sans le constructeur."
  - key: qcm-json-nil
    format: multiple-choice
    question: Comment `json.Marshal` encode-t-il une map nil de type `map[string]int` ?
    choices:
      - text: '`null`'
        correct: true
      - text: '`{}`'
        correct: false
      - text: Une erreur
        correct: false
      - text: Une chaîne vide
        correct: false
    answer: Comme un slice nil ; une map vide non nil donne `{}`.
