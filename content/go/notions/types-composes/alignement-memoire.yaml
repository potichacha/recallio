notion: alignement-memoire
lesson: "Chaque type a une **contrainte d'alignement** : un `int64` doit commencer à une adresse multiple de 8, un `int32` de\n4. Pour la respecter, le compilateur insère des **octets de remplissage** (padding) entre les champs d'une struct, et à\nla fin pour que la taille soit un multiple de l'alignement.\n\n```go\ntype Mal struct {   // 24 octets sur 64 bits\n\ta bool          // 1 + 7 de remplissage\n\tb int64         // 8\n\tc bool          // 1 + 7 de remplissage\n}\n\ntype Bien struct {  // 16 octets\n\tb int64         // 8\n\ta bool          // 1\n\tc bool          // 1 + 6 de remplissage\n}\n```\n\nGo **ne réordonne pas** les champs : l'ordre du code est l'ordre en mémoire. Ranger les champs du plus grand au plus\npetit alignement réduit la taille. On mesure avec `unsafe.Sizeof`, `unsafe.Alignof`, `unsafe.Offsetof`, et l'analyseur\n`fieldalignment` (de golang.org/x/tools) signale les structs améliorables.\n\nQuand s'en soucier : pour des structs créées **par millions** (un cache, un index en mémoire, un slice de points), où\nquelques octets par élément font des centaines de mégaoctets. Pour une struct de configuration, la lisibilité de\nl'ordre des champs compte davantage.\n\nCas particulier : sur une plateforme 32 bits, les opérations atomiques 64 bits exigent un champ aligné sur 8 ; les\ntypes `atomic.Int64` le garantissent.\n\n**Piège classique** : réordonner toutes les structs d'un projet pour gagner quelques octets, au prix de la lisibilité.\nOn ne le fait que là où la mesure le justifie.\n\n**En entretien** : « Les champs sont alignés, avec du remplissage ; Go garde l'ordre du code ; ranger du plus grand au\nplus petit réduit la taille ; utile pour des millions d'instances. »"
cards:
  - key: ordre-champs-struct-compter
    format: course
    question: "Pourquoi l'ordre des champs d'une struct peut-il changer sa taille ?"
    choices:
      - {text: "Le remplissage d'alignement inséré entre les champs dépend de leur ordre", correct: true}
      - {text: "Go range les champs par ordre alphabétique, et l'ordre écrit est ignoré", correct: false}
      - {text: "Chaque champ déclaré après un pointeur est copié dans un bloc à part", correct: false}
      - {text: "Les premiers champs sont stockés sur la pile, les suivants dans le tas", correct: false}
    answer: "Chaque champ est aligné sur sa taille : entre un `bool` et un `int64`, le compilateur insère du remplissage (padding). Ranger les champs par taille décroissante réduit ce remplissage, donc la taille de la struct."
  - key: reordonne
    format: course
    question: Le compilateur Go réordonne-t-il les champs d'une struct pour réduire sa taille ?
    choices:
      - {text: "Non : les champs restent dans l'ordre du code, au développeur de les ranger", correct: true}
      - {text: "Oui : il trie toujours les champs par taille décroissante à la compilation", correct: false}
      - {text: "Oui, mais seulement pour les structs non exportées, invisibles ailleurs", correct: false}
      - {text: "Oui en build de production ; `go run` garde l'ordre du code pour déboguer", correct: false}
    answer: "Non : le compilateur garde l'ordre de la déclaration (le code `unsafe`, cgo et les formats binaires en dépendent). C'est au développeur de ranger les champs, aidé par l'analyseur `fieldalignment` ; contrairement à Rust, Go ne réordonne rien."
  - key: mesurer
    format: course
    question: Comment mesurer la taille et le remplissage d'une struct ?
    choices:
      - {text: "Avec `unsafe.Sizeof`, `unsafe.Offsetof` et `unsafe.Alignof`, ou l'analyseur `fieldalignment`", correct: true}
      - {text: "Avec `len` et `cap` appliqués à la struct, qui donnent sa taille et son remplissage", correct: false}
      - {text: "Avec `runtime.ReadMemStats`, qui détaille la mémoire occupée par chaque type déclaré", correct: false}
      - {text: "Avec `go vet -size`, qui imprime la taille et le remplissage de chaque struct du package", correct: false}
    answer: "`unsafe.Sizeof` donne la taille, `Offsetof` la position d'un champ, `Alignof` son alignement ; l'analyseur `fieldalignment` signale les structs mal rangées et propose un meilleur ordre. `len` ne s'applique pas à une struct, et `MemStats` ne donne que des totaux."
  - key: quand
    format: course
    question: Quand l'ordre des champs vaut-il la peine d'être optimisé ?
    choices:
      - {text: "Pour une struct présente par millions en mémoire, où le remplissage se multiplie", correct: true}
      - {text: "Pour toute struct exportée, avant de publier une version du package", correct: false}
      - {text: "Toujours : un champ mal aligné ralentit chaque accès, même sur une seule valeur", correct: false}
      - {text: "Jamais : le ramasse-miettes compacte la mémoire et retire le remplissage", correct: false}
    answer: "Quand la struct existe en très grand nombre (caches, slices de millions d'éléments) : quelques octets gagnés par élément font des mégaoctets. Ailleurs, on garde l'ordre le plus lisible ; le ramasse-miettes ne retire jamais le remplissage."
  - key: vf-padding
    format: true-false
    question: Le compilateur peut insérer des octets inutilisés entre les champs d'une struct.
    truth: true
    answer: Pour respecter l'alignement de chaque champ.
  - key: vf-taille-somme
    format: true-false
    question: La taille d'une struct est toujours la somme des tailles de ses champs.
    truth: false
    answer: Le remplissage peut l'augmenter.
  - key: vf-ordre
    format: true-false
    question: Ranger les champs du plus grand au plus petit alignement réduit en général la taille.
    truth: true
    answer: Le remplissage ne sert plus qu'à la fin.
  - key: vf-atomic
    format: true-false
    question: '`atomic.Int64` garantit l''alignement sur 8 octets, même sur une plateforme 32 bits.'
    truth: true
    answer: Les opérations atomiques 64 bits l'exigent.
  - key: qcm-taille
    format: multiple-choice
    question: Sur 64 bits, quelle est la taille de `struct{ a bool; b int64; c bool }` ?
    choices:
      - text: 24 octets
        correct: true
      - text: 10 octets
        correct: false
      - text: 16 octets
        correct: false
      - text: 17 octets
        correct: false
    answer: 1 + 7 de remplissage, 8, puis 1 + 7.
  - key: qcm-mieux
    format: multiple-choice
    question: Quel ordre minimise la taille de ces champs bool, int64, int32 et bool ?
    choices:
      - text: int64, int32, bool, bool
        correct: true
      - text: bool, int64, bool, int32
        correct: false
      - text: bool, bool, int64, int32
        correct: false
      - text: L'ordre n'a pas d'importance
        correct: false
    answer: 8 + 4 + 1 + 1 = 14, arrondi à 16 octets.
  - key: qcm-outils
    format: multiple-choice
    question: "Quel outil propose un meilleur ordre pour les champs d'une struct ?"
    choices:
      - {text: "L'analyseur `fieldalignment`", correct: true}
      - {text: "`gofmt -s`, qui simplifie le code", correct: false}
      - {text: "`go mod tidy`, qui range le module", correct: false}
      - {text: "`go vet`, avec ses analyseurs par défaut", correct: false}
    answer: "L'analyseur `fieldalignment` signale les structs mal rangées et propose un ordre ; `unsafe.Sizeof` et `unsafe.Offsetof` mesurent, sans rien proposer. `gofmt` ne touche pas à l'ordre des champs, et `go vet` ne lance pas cet analyseur par défaut."
  - key: qcm-quand
    format: multiple-choice
    question: Dans quel cas optimiser l'ordre des champs est-il justifié ?
    choices:
      - text: Un slice de 50 millions de points en mémoire
        correct: true
      - text: La struct de configuration lue au démarrage
        correct: false
      - text: Un DTO de réponse HTTP
        correct: false
      - text: Toutes les structs du projet, par principe
        correct: false
    answer: Le gain se multiplie seulement avec le nombre d'instances.
  - key: code-tailles
    format: code-output
    question: |-
      Qu'affiche ce code, sur une plateforme 64 bits ?
      ```go
      type Mal struct {
      	a bool
      	b int64
      	c bool
      }
      type Bien struct {
      	b int64
      	a bool
      	c bool
      }

      fmt.Println(unsafe.Sizeof(Mal{}), unsafe.Sizeof(Bien{}))
      ```
    choices:
      - {text: "`24 16`", correct: true}
      - {text: "`10 10`", correct: false}
      - {text: "`16 16`", correct: false}
      - {text: "`24 24`", correct: false}
    answer: "`24 16` : dans `Mal`, chaque `bool` est suivi de 7 octets de remplissage (pour aligner le `int64`, puis la fin) ; dans `Bien`, les deux `bool` se suivent après le `int64`, et seul le remplissage final reste. `10` serait la somme sans aucun remplissage."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\ntype Mal struct {\n\ta bool\n\tb int64\n\tc bool\n}\n\ntype Bien struct {\n\tb int64\n\ta bool\n\tc bool\n}\n\nfunc main() {\n\tfmt.Println(unsafe.Sizeof(Mal{}), unsafe.Sizeof(Bien{}))\n}\n"
      output: 24 16
  - key: code-offset
    format: code-output
    question: |-
      Qu'affiche ce code, sur une plateforme 64 bits ?
      ```go
      type S struct {
      	a bool
      	b int32
      	c int64
      }

      var s S
      fmt.Println(unsafe.Offsetof(s.b), unsafe.Offsetof(s.c), unsafe.Sizeof(s))
      ```
    choices:
      - {text: "`4 8 16`", correct: true}
      - {text: "`1 5 13`", correct: false}
      - {text: "`1 8 16`", correct: false}
      - {text: "`8 16 24`", correct: false}
    answer: "`4 8 16` : `b` (`int32`) s'aligne sur 4, donc 3 octets de remplissage après `a` ; `c` (`int64`) s'aligne sur 8 et commence juste après `b`. Total 16, sans remplissage final."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\ntype S struct {\n\ta bool\n\tb int32\n\tc int64\n}\n\nfunc main() {\n\tvar s S\n\tfmt.Println(unsafe.Offsetof(s.b), unsafe.Offsetof(s.c), unsafe.Sizeof(s))\n}\n"
      output: 4 8 16
  - key: code-alignof
    format: code-output
    question: |-
      Qu'affiche ce code, sur une plateforme 64 bits ?
      ```go
      fmt.Println(unsafe.Alignof(int64(0)), unsafe.Alignof(int32(0)), unsafe.Alignof(true))
      ```
    choices:
      - {text: "`8 4 1`", correct: true}
      - {text: "`8 8 8`", correct: false}
      - {text: "`64 32 1`", correct: false}
      - {text: "`8 4 8`", correct: false}
    answer: "`8 4 1` : un type de base s'aligne sur sa taille en octets (8 pour `int64`, 4 pour `int32`, 1 pour `bool`). `Alignof` compte en octets, pas en bits."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\nfunc main() {\n\tfmt.Println(unsafe.Alignof(int64(0)), unsafe.Alignof(int32(0)), unsafe.Alignof(true))\n}\n"
      output: 8 4 1
  - key: code-vide-fin
    format: code-output
    question: |-
      Qu'affiche ce code, sur une plateforme 64 bits ?
      ```go
      type A struct {
      	x int64
      	y bool
      }

      fmt.Println(unsafe.Sizeof(A{}), unsafe.Sizeof([4]A{}))
      ```
    choices:
      - {text: "`16 64`", correct: true}
      - {text: "`9 36`", correct: false}
      - {text: "`16 36`", correct: false}
      - {text: "`12 48`", correct: false}
    answer: "`16 64` : la taille d'une struct est arrondie au multiple de son alignement (8), pour que chaque élément d'un tableau reste aligné ; d'où 7 octets de remplissage final, et 4 × 16 = 64."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\ntype A struct {\n\tx int64\n\ty bool\n}\n\nfunc main() {\n\tfmt.Println(unsafe.Sizeof(A{}), unsafe.Sizeof([4]A{}))\n}\n"
      output: 16 64
