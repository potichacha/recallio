notion: structs-anonymes-vide
lesson: "**Une struct anonyme** se déclare et s'utilise sur place, sans nommer de type. Pratique pour des données locales ou\nponctuelles :\n\n```go\nconfig := struct {\n\tHote string\n\tPort int\n}{Hote: \"localhost\", Port: 8080}\n\n// très courant pour les tests pilotés par une table\ncas := []struct {\n\tentree  string\n\tattendu int\n}{\n\t{\"12\", 12},\n\t{\"-3\", -3},\n}\n\n// ou pour décoder une petite réponse JSON\nvar rep struct {\n\tStatut string `json:\"statut\"`\n}\njson.Unmarshal(data, &rep)\n```\n\n**La struct vide** `struct{}` n'a aucun champ et **occupe zéro octet**. Toutes ses valeurs sont égales. Usages :\n- la valeur d'un ensemble : `map[string]struct{}` ;\n- un **signal** dans un channel, quand seul l'événement compte : `done := make(chan struct{})` puis `close(done)` ;\n- un type qui ne porte que des méthodes (une implémentation sans état).\n\n**Piège classique** : réutiliser une struct anonyme dans plusieurs fonctions en la recopiant. Dès qu'elle sert à deux\nendroits, on lui donne un nom.\n\n**En entretien** : « Une struct anonyme pour des données locales, les cas de test ou un petit JSON ; struct{} occupe zéro\noctet, pour les ensembles et les signaux de channel. »"
cards:
  - key: taille-struct
    format: course
    question: "Quelle est la taille en mémoire d'une valeur `struct{}{}` ?"
    choices:
      - {text: "Zéro octet", correct: true}
      - {text: "Un octet", correct: false}
      - {text: "Huit octets, un mot machine", correct: false}
      - {text: "La taille d'un pointeur", correct: false}
    answer: "Zéro octet : `unsafe.Sizeof(struct{}{})` vaut 0. C'est pourquoi elle sert de valeur d'ensemble ou d'élément d'un channel de signal."
  - key: usages-anonyme
    format: course
    question: Quand utiliser une struct anonyme ?
    choices:
      - {text: "Pour des données locales : une table de cas de test, une petite réponse JSON", correct: true}
      - {text: "Pour un type partagé entre plusieurs packages, sans avoir à l'exporter", correct: false}
      - {text: "Pour remplacer une interface dans la signature d'une fonction publique", correct: false}
      - {text: "Pour éviter une allocation : une struct anonyme vit toujours sur la pile", correct: false}
    answer: "Pour des données locales à une fonction : la table de cas d'un test, une petite réponse JSON à décoder, un regroupement ponctuel. Anonyme ou nommée, une struct est placée sur la pile ou le tas selon l'analyse d'échappement."
  - key: signal
    format: course
    question: "Pourquoi utiliser un `chan struct{}` pour un signal ?"
    choices:
      - {text: "Seul l'événement compte : la valeur vide ne coûte rien et ne transporte rien", correct: true}
      - {text: "Parce qu'un `chan bool` ne peut pas être fermé par l'émetteur", correct: false}
      - {text: "Parce qu'un `chan struct{}` ne bloque jamais l'émetteur", correct: false}
      - {text: "Parce que seul un `chan struct{}` peut servir dans un `select`", correct: false}
    answer: "Seul l'événement compte : la struct vide ne coûte rien, et le type dit clairement qu'aucune donnée n'est transmise. Tout channel peut être fermé ou servir dans un `select`."
  - key: nommer
    format: course
    question: Quand faut-il donner un nom à une struct anonyme ?
    choices:
      - {text: "Dès qu'elle sert à plusieurs endroits ou apparaît dans une signature", correct: true}
      - {text: "Jamais : une struct anonyme vaut toujours mieux qu'un type de plus", correct: false}
      - {text: "Dès qu'elle a plus de trois champs, quel que soit son usage", correct: false}
      - {text: "Seulement quand ses champs portent des tags JSON", correct: false}
    answer: "Dès qu'elle sert à plusieurs endroits, ou qu'elle apparaît dans une signature : un type nommé évite de la recopier et documente l'intention. Le nombre de champs ou les tags n'y changent rien."
  - key: vf-taille
    format: true-false
    question: '`struct{}` occupe zéro octet.'
    truth: true
    answer: '`unsafe.Sizeof(struct{}{})` vaut 0.'
  - key: vf-tests
    format: true-false
    question: Les tests pilotés par une table utilisent souvent un slice de structs anonymes.
    truth: true
    answer: '`cas := []struct{ entree string; attendu int }{...}`.'
  - key: vf-methodes
    format: true-false
    question: On peut déclarer une méthode sur une struct anonyme.
    truth: false
    answer: Une méthode demande un type nommé.
  - key: vf-egales
    format: true-false
    question: Deux valeurs `struct{}{}` sont toujours égales.
    truth: true
    answer: Elles n'ont aucun champ pour différer.
  - key: qcm-signal
    format: multiple-choice
    question: "Quels moyens signalent à plusieurs goroutines qu'elles doivent s'arrêter ?"
    choices:
      - text: Fermer un `chan struct{}` qu'elles écoutent
        correct: true
      - text: Annuler un `context.Context` qu'elles surveillent
        correct: true
      - text: Envoyer `true` une seule fois sur un `chan bool`
        correct: false
      - text: Mettre une variable globale à true sans synchronisation
        correct: false
    answer: Une fermeture est vue par tous les récepteurs ; un envoi n'est reçu que par un seul.
  - key: qcm-anonyme
    format: multiple-choice
    question: "Laquelle de ces déclarations utilise une struct anonyme ?"
    choices:
      - {text: "`cas := []struct{ a, b int }{{1, 2}}`", correct: true}
      - {text: "`type Rep struct{ Statut string }`", correct: false}
      - {text: "`var rep Rep`", correct: false}
      - {text: "`rep := new(Rep)`", correct: false}
    answer: "Le type `struct{ a, b int }` est écrit sur place, sans nom ; `var rep struct{ Statut string }` en serait une autre. `type Rep struct{...}` déclare un type nommé, qu'utilisent les deux dernières."
  - key: qcm-vide
    format: multiple-choice
    question: "À quoi sert typiquement `struct{}` ?"
    choices:
      - {text: "De valeur dans un ensemble `map[T]struct{}`", correct: true}
      - {text: "À déclarer une interface vide, comme `any`", correct: false}
      - {text: "À remplacer nil dans un champ optionnel", correct: false}
      - {text: "À marquer une valeur que le GC ignore", correct: false}
    answer: "Une valeur qui n'occupe rien : la valeur d'un ensemble `map[T]struct{}`, ou l'élément d'un channel de signal. L'interface vide est `interface{}` (`any`), un autre type."
  - key: trous-vide
    format: fill-in
    question: |-
      Complète le channel de signal :
      ```go
      done := make(chan ___)
      close(done)
      ```
    blanks:
      - - struct{}
    answer: Seul l'événement compte.
  - key: trous-table
    format: fill-in
    question: |-
      Complète la table de cas :
      ```go
      cas := []___{
      	entree  string
      	attendu bool
      }{
      	{"", false},
      }
      ```
    blanks:
      - - struct
    answer: Une struct anonyme, déclarée sur place.
  - key: trous-json
    format: fill-in
    question: |-
      Complète pour décoder une petite réponse sans déclarer de type :
      ```go
      var rep ___ {
      	Token string `json:"token"`
      }
      json.Unmarshal(corps, &rep)
      ```
    blanks:
      - - struct
    answer: Une struct anonyme convient à un usage unique.
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète l'envoi d'un signal :
      ```go
      pret <- ___
      ```
    blanks:
      - - struct{}{}
    answer: La valeur de la struct vide.
  - key: code-anonyme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      p := struct {
      	Nom string
      	Age int
      }{"Ada", 36}
      fmt.Printf("%v %+v\n", p, p)
      ```
    choices:
      - {text: "`{Ada 36} {Nom:Ada Age:36}`", correct: true}
      - {text: "`{Nom:Ada Age:36} {Ada 36}`", correct: false}
      - {text: "`{Ada 36} {Ada 36}`", correct: false}
      - {text: "`{\"Ada\" 36} {Nom:\"Ada\" Age:36}`", correct: false}
    answer: "`%v` affiche les valeurs des champs, `%+v` ajoute leurs noms ; les chaînes ne sont pas entre guillemets (ce serait `%#v`)."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tp := struct {\n\t\tNom string\n\t\tAge int\n\t}{\"Ada\", 36}\n\tfmt.Printf(\"%v %+v\\n\", p, p)\n}\n"
      output: '{Ada 36} {Nom:Ada Age:36}'
  - key: code-taille
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var tableau [1000]struct{}
      fmt.Println(unsafe.Sizeof(tableau), struct{}{} == struct{}{})
      ```
    choices:
      - {text: "`0 true`", correct: true}
      - {text: "`1000 true`", correct: false}
      - {text: "`0 false`", correct: false}
      - {text: "`8 true`", correct: false}
    answer: "`0 true` : même mille structs vides n'occupent rien, et deux structs vides sont toujours égales."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\nfunc main() {\n\tvar tableau [1000]struct{}\n\tfmt.Println(unsafe.Sizeof(tableau), struct{}{} == struct{}{})\n}\n"
      output: 0 true
  - key: code-signal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      done := make(chan struct{})
      go func() {
      	fmt.Println("travail")
      	close(done)
      }()
      <-done
      fmt.Println("fini")
      ```
    choices:
      - text: |-
          ```
          travail
          fini
          ```
        correct: true
      - text: |-
          ```
          fini
          travail
          ```
        correct: false
      - {text: "`fini`", correct: false}
      - {text: "`travail`", correct: false}
    answer: "`main` attend la fermeture du channel (`<-done`) : « travail » s'affiche toujours avant « fini »."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tdone := make(chan struct{})\n\tgo func() {\n\t\tfmt.Println(\"travail\")\n\t\tclose(done)\n\t}()\n\t<-done\n\tfmt.Println(\"fini\")\n}\n"
      output: |-
        travail
        fini
  - key: code-json
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var rep struct {
      	Statut string `json:"statut"`
      }
      json.Unmarshal([]byte(`{"statut":"ok","autre":1}`), &rep)
      fmt.Println(rep.Statut)
      ```
    choices:
      - {text: "`ok`", correct: true}
      - {text: "`{ok}`", correct: false}
      - {text: "`ok 1`", correct: false}
      - {text: "Une ligne vide : la struct anonyme n'est pas remplie", correct: false}
    answer: "`ok` : une struct anonyme suffit pour lire un champ ; `Unmarshal` ignore les champs JSON qu'elle ne déclare pas."
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar rep struct {\n\t\tStatut string `json:\"statut\"`\n\t}\n\tjson.Unmarshal([]byte(`{\"statut\":\"ok\",\"autre\":1}`), &rep)\n\tfmt.Println(rep.Statut)\n}\n"
      output: ok
  - key: qcm-close-signal
    format: multiple-choice
    question: Pourquoi fermer un `chan struct{}` plutôt qu'y envoyer une valeur pour signaler l'arrêt ?
    choices:
      - {text: "La fermeture est vue par tous les récepteurs, un envoi par un seul", correct: true}
      - {text: "Un envoi sur un `chan struct{}` ne compile pas", correct: false}
      - {text: "La fermeture libère aussitôt la mémoire du channel", correct: false}
      - {text: "Un envoi sur un `chan struct{}` ne réveille personne", correct: false}
    answer: "Un channel fermé fait réussir immédiatement toutes les réceptions, présentes et futures, sans bloquer l'émetteur ; un envoi n'est reçu que par un seul récepteur. Envoyer `struct{}{}` compile très bien."
