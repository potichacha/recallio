notion: structs-anonymes-vide
lesson: "**Une struct anonyme** se déclare et s'utilise sur place, sans nommer de type. Pratique pour des données locales ou\nponctuelles :\n\n```go\nconfig := struct {\n\tHote string\n\tPort int\n}{Hote: \"localhost\", Port: 8080}\n\n// très courant pour les tests pilotés par une table\ncas := []struct {\n\tentree  string\n\tattendu int\n}{\n\t{\"12\", 12},\n\t{\"-3\", -3},\n}\n\n// ou pour décoder une petite réponse JSON\nvar rep struct {\n\tStatut string `json:\"statut\"`\n}\njson.Unmarshal(data, &rep)\n```\n\n**La struct vide** `struct{}` n'a aucun champ et **occupe zéro octet**. Toutes ses valeurs sont égales. Usages :\n- la valeur d'un ensemble : `map[string]struct{}` ;\n- un **signal** dans un channel, quand seul l'événement compte : `done := make(chan struct{})` puis `close(done)` ;\n- un type qui ne porte que des méthodes (une implémentation sans état).\n\n**Piège classique** : réutiliser une struct anonyme dans plusieurs fonctions en la recopiant. Dès qu'elle sert à deux\nendroits, on lui donne un nom.\n\n**En entretien** : « Une struct anonyme pour des données locales, les cas de test ou un petit JSON ; struct{} occupe zéro\noctet, pour les ensembles et les signaux de channel. »"
cards:
  - key: taille-struct
    format: course
    question: Taille d'une struct{} ?
    answer: Zéro octet.
  - key: usages-anonyme
    format: course
    question: Quand utiliser une struct anonyme ?
    answer: 'Pour des données locales à une fonction : la table de cas d''un test, une petite réponse JSON à décoder, un regroupement ponctuel.'
  - key: signal
    format: course
    question: Pourquoi `chan struct{}` pour un signal ?
    answer: 'Parce que seul l''événement compte : la struct vide ne coûte rien, et le type dit clairement qu''aucune donnée n''est transmise.'
  - key: nommer
    format: course
    question: Quand faut-il donner un nom à une struct anonyme ?
    answer: 'Dès qu''elle sert à plusieurs endroits, ou qu''elle apparaît dans une signature : un type nommé évite de la recopier.'
  - key: vf-taille
    format: true-false
    question: '`struct{}` occupe zéro octet.'
    truth: true
    answer: '`unsafe.Sizeof(struct{}{})` vaut 0.'
  - key: vf-tests
    format: true-false
    question: Les tests pilotés par une table utilisent souvent un slice de structs anonymes.
    truth: true
    answer: '`cas := []struct{ entree string; attendu int }{...}`.'
  - key: vf-methodes
    format: true-false
    question: On peut déclarer une méthode sur une struct anonyme.
    truth: false
    answer: Une méthode demande un type nommé.
  - key: vf-egales
    format: true-false
    question: Deux valeurs `struct{}{}` sont toujours égales.
    truth: true
    answer: Elles n'ont aucun champ pour différer.
  - key: qcm-signal
    format: multiple-choice
    question: Comment signaler à plusieurs goroutines qu'elles doivent s'arrêter ?
    choices:
      - text: Fermer un `chan struct{}` qu'elles écoutent
        correct: true
      - text: Annuler un `context.Context` qu'elles surveillent
        correct: true
      - text: Envoyer `true` une seule fois sur un `chan bool`
        correct: false
      - text: Mettre une variable globale à true sans synchronisation
        correct: false
    answer: Une fermeture est vue par tous les récepteurs ; un envoi n'est reçu que par un seul.
  - key: qcm-anonyme
    format: multiple-choice
    question: Quelles déclarations utilisent une struct anonyme ?
    choices:
      - text: '`var rep struct{ Statut string }`'
        correct: true
      - text: '`cas := []struct{ a, b int }{{1, 2}}`'
        correct: true
      - text: '`type Rep struct{ Statut string }`'
        correct: false
      - text: '`var rep Rep`'
        correct: false
    answer: Les deux dernières utilisent un type nommé.
  - key: qcm-vide
    format: multiple-choice
    question: À quoi sert `struct{}` ?
    choices:
      - text: Valeur d'un ensemble `map[T]struct{}`
        correct: true
      - text: Élément d'un channel de signal
        correct: true
      - text: Remplacer nil
        correct: false
      - text: Déclarer une interface vide
        correct: false
    answer: L'interface vide est `interface{}` (any), un autre type.
  - key: trous-vide
    format: fill-in
    question: |-
      Complétez le channel de signal :
      ```go
      done := make(chan ___)
      close(done)
      ```
    blanks:
      - - struct{}
    answer: Seul l'événement compte.
  - key: trous-table
    format: fill-in
    question: "Complétez la table de cas :\n```go\ncas := []___{\n\tentree  string\n\tattendu bool\n}{\n\t{\"\", false},\n}\n```"
    blanks:
      - - struct
    answer: Une struct anonyme, déclarée sur place.
  - key: trous-json
    format: fill-in
    question: "Complétez pour décoder une petite réponse sans déclarer de type :\n```go\nvar rep ___ {\n\tToken string `json:\"token\"`\n}\njson.Unmarshal(corps, &rep)\n```"
    blanks:
      - - struct
    answer: Une struct anonyme convient à un usage unique.
  - key: trous-valeur
    format: fill-in
    question: |-
      Complétez l'envoi d'un signal :
      ```go
      pret <- ___
      ```
    blanks:
      - - struct{}{}
    answer: La valeur de la struct vide.
  - key: code-anonyme
    format: code-output
    question: "```go\np := struct {\n\tNom string\n\tAge int\n}{\"Ada\", 36}\nfmt.Printf(\"%v %+v\\n\", p, p)\n```"
    answer: '`{Ada 36} {Nom:Ada Age:36}`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tp := struct {\n\t\tNom string\n\t\tAge int\n\t}{\"Ada\", 36}\n\tfmt.Printf(\"%v %+v\\n\", p, p)\n}\n"
      output: '{Ada 36} {Nom:Ada Age:36}'
  - key: code-taille
    format: code-output
    question: |-
      ```go
      var tableau [1000]struct{}
      fmt.Println(unsafe.Sizeof(tableau), struct{}{} == struct{}{})
      ```
    answer: '`0 true` : même mille structs vides n''occupent rien.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unsafe\"\n)\n\nfunc main() {\n\tvar tableau [1000]struct{}\n\tfmt.Println(unsafe.Sizeof(tableau), struct{}{} == struct{}{})\n}\n"
      output: 0 true
  - key: code-signal
    format: code-output
    question: "```go\ndone := make(chan struct{})\ngo func() {\n\tfmt.Println(\"travail\")\n\tclose(done)\n}()\n<-done\nfmt.Println(\"fini\")\n```"
    answer: '`travail` puis `fini` : `main` attend la fermeture du channel.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tdone := make(chan struct{})\n\tgo func() {\n\t\tfmt.Println(\"travail\")\n\t\tclose(done)\n\t}()\n\t<-done\n\tfmt.Println(\"fini\")\n}\n"
      output: |-
        travail
        fini
  - key: code-json
    format: code-output
    question: "```go\nvar rep struct {\n\tStatut string `json:\"statut\"`\n}\njson.Unmarshal([]byte(`{\"statut\":\"ok\",\"autre\":1}`), &rep)\nfmt.Println(rep.Statut)\n```"
    answer: '`ok` : une struct anonyme suffit pour lire un champ, les autres sont ignorés.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar rep struct {\n\t\tStatut string `json:\"statut\"`\n\t}\n\tjson.Unmarshal([]byte(`{\"statut\":\"ok\",\"autre\":1}`), &rep)\n\tfmt.Println(rep.Statut)\n}\n"
      output: ok
  - key: qcm-close-signal
    format: multiple-choice
    question: Pourquoi fermer un `chan struct{}` plutôt qu'y envoyer une valeur pour signaler l'arrêt ?
    choices:
      - text: La fermeture est vue par tous les récepteurs, un envoi par un seul
        correct: true
      - text: La fermeture ne bloque pas l'émetteur
        correct: true
      - text: Un envoi sur un chan struct{} est interdit
        correct: false
      - text: La fermeture libère la mémoire du channel
        correct: false
    answer: Un channel fermé fait réussir immédiatement toutes les réceptions, présentes et futures.
