notion: maps-internes
lesson: |-
  Une map Go est une **table de hachage** gérée par le runtime ; la variable de type map n'est qu'un **pointeur** vers
  cette structure (d'où le partage à l'affectation).

  Depuis **Go 1.24**, l'implémentation repose sur les **Swiss Tables** (une technique venue de la bibliothèque Abseil de
  Google) : les entrées sont rangées par groupes de 8 emplacements, avec un mot de contrôle qui permet de tester
  plusieurs emplacements à la fois. Résultat : des recherches et insertions plus rapides et une meilleure occupation de
  la mémoire. Avant 1.24, c'était une table à « buckets » de 8 entrées chaînés par des buckets de débordement.

  Ce qu'il faut savoir en pratique :
  - les opérations sont en **O(1) en moyenne** ; la fonction de hachage utilise une graine aléatoire par map ;
  - la map **grandit** en réallouant ses tables quand elle se remplit ; `make(map[K]V, n)` évite ces croissances ;
  - elle **ne rétrécit jamais** : après des millions de `delete`, la mémoire n'est pas rendue. Pour la récupérer, on
    recrée une map et l'on y copie les entrées restantes ;
  - l'**ordre d'itération** est aléatoire, et l'itération reste correcte même si l'on supprime pendant le parcours ;
  - le runtime détecte (au mieux) les **accès concurrents** et arrête le programme plutôt que de corrompre la table.

  **Piège classique** : un cache qui supprime ses entrées expirées mais dont la mémoire ne baisse jamais. La map garde
  sa taille maximale ; il faut la reconstruire périodiquement.

  **En entretien** : « Une table de hachage du runtime, Swiss Tables depuis Go 1.24 ; O(1) en moyenne ; elle grandit mais
  ne rétrécit jamais ; on préalloue avec make et l'on recrée la map pour rendre la mémoire. »
cards:
  - key: map-rend-memoire-apres-delete
    format: course
    question: "Une map rend-elle sa mémoire après des `delete` ?"
    choices:
      - {text: "Non : elle ne rétrécit jamais, il faut la recréer pour récupérer la place", correct: true}
      - {text: "Oui : chaque `delete` libère aussitôt la place de l'entrée retirée", correct: false}
      - {text: "Oui, mais seulement au prochain passage du ramasse-miettes", correct: false}
      - {text: "Non, sauf après un `clear(m)`, qui ramène ses tables à zéro", correct: false}
    answer: "Non : une map ne rétrécit pas, même vidée par `delete` ou `clear` ; ses tables gardent leur taille maximale. Pour récupérer la mémoire, on crée une nouvelle map et l'on y copie les entrées restantes."
  - key: implementation-maps-depuis-1-24
    format: course
    question: "Sur quelle structure reposent les maps de Go depuis la version 1.24 ?"
    choices:
      - {text: "Des Swiss Tables : des groupes d'emplacements, avec des octets de contrôle", correct: true}
      - {text: "Des arbres rouge-noir, qui gardent les clés triées en permanence", correct: false}
      - {text: "Des listes chaînées par seau, comme la `HashMap` de Java 7", correct: false}
      - {text: "Des tableaux triés, interrogés par recherche dichotomique", correct: false}
    answer: "Une implémentation de type Swiss Table : la clé hachée choisit un groupe d'emplacements, dont les octets de contrôle se comparent plusieurs à la fois. Avant 1.24, des seaux de 8 entrées, chaînés à des seaux de débordement."
  - key: apporte-1-24-maps
    format: course
    question: "Qu'a changé Go 1.24 pour les maps ?"
    choices:
      - {text: "Une nouvelle implémentation, plus rapide, sans rien changer à leur usage", correct: true}
      - {text: "L'ordre d'itération, qui suit désormais celui de l'insertion des clés", correct: false}
      - {text: "La sûreté entre goroutines, sans verrou à ajouter autour des accès", correct: false}
      - {text: "Une syntaxe `maps.New[K, V]()`, qui remplace désormais `make`", correct: false}
    answer: "Les Swiss Tables, plus rapides en recherche et en insertion ; l'API et le comportement ne changent pas : ordre d'itération toujours aléatoire, map toujours non sûre entre goroutines."
  - key: complexite-recherche-map
    format: course
    question: "Quelle est la complexité d'une recherche dans une map Go ?"
    choices:
      - {text: "O(1) en moyenne", correct: true}
      - {text: "O(log n), comme dans un arbre", correct: false}
      - {text: "O(n), les clés étant parcourues", correct: false}
      - {text: "O(1) dans tous les cas, même au pire", correct: false}
    answer: "O(1) en moyenne : le hachage mène directement au bon groupe d'emplacements ; avec beaucoup de collisions, c'est plus lent. Ce n'est pas un arbre : ni O(log n), ni ordre des clés."
  - key: terme-swiss-table
    format: course
    question: "Que désigne « Swiss Table » en Go ?"
    choices:
      - {text: "L'implémentation des maps depuis Go 1.24, une table de hachage à octets de contrôle", correct: true}
      - {text: "L'algorithme de tri de `slices.Sort`, un tri rapide qui évite le pire cas", correct: false}
      - {text: "La table des méthodes qu'utilise le runtime pour appeler une méthode d'interface", correct: false}
      - {text: "Le format binaire qu'emploie `encoding/gob` pour encoder les maps", correct: false}
    answer: "La table de hachage conçue chez Google (Abseil) et adoptée par les maps de Go 1.24 : des groupes d'emplacements et des octets de contrôle comparés plusieurs à la fois. Le tri de `slices.Sort` est pdqsort, et la table des méthodes d'une interface s'appelle l'itab."
  - key: vf-swiss
    format: true-false
    question: Depuis Go 1.24, les maps sont implémentées avec des Swiss Tables.
    truth: true
    answer: Une implémentation plus rapide et plus compacte que l'ancienne table à buckets.
  - key: vf-retrecit
    format: true-false
    question: Une map rend sa mémoire au système quand on supprime la plupart de ses entrées.
    truth: false
    answer: Elle ne rétrécit jamais ; on recrée une map pour libérer la place.
  - key: vf-graine
    format: true-false
    question: La fonction de hachage des maps utilise une graine aléatoire.
    truth: true
    answer: Ce qui protège contre les attaques par collisions et participe à l'ordre d'itération aléatoire.
  - key: vf-variable
    format: true-false
    question: Une variable de type map contient directement toute la table de hachage.
    truth: false
    answer: Elle contient un pointeur vers la structure du runtime ; c'est pourquoi l'affectation partage la map.
  - key: qcm-complexite
    format: multiple-choice
    question: Quelle est la complexité moyenne d'une lecture dans une map ?
    choices:
      - text: O(1)
        correct: true
      - text: O(log n)
        correct: false
      - text: O(n)
        correct: false
      - text: O(n log n)
        correct: false
    answer: En moyenne ; le pire cas dépend des collisions, rendues improbables par la graine aléatoire.
  - key: qcm-memoire
    format: multiple-choice
    question: Comment récupérer la mémoire d'une map qui a beaucoup diminué ?
    choices:
      - {text: "Créer une nouvelle map et y copier les entrées restantes", correct: true}
      - {text: "Appeler `clear(m)`, qui rend ses tables au système", correct: false}
      - {text: "Appeler `runtime.GC()`, qui compacte les maps", correct: false}
      - {text: "Supprimer les entrées une par une avec `delete`", correct: false}
    answer: "Une map ne rétrécit jamais : ni `delete` ni `clear` ne rendent ses tables, et le ramasse-miettes ne les compacte pas. On copie les entrées vivantes dans une nouvelle map, et l'ancienne devient libérable."
  - key: qcm-croissance
    format: multiple-choice
    question: Que fait `make(map[string]int, 1_000_000)` ?
    choices:
      - {text: "Il réserve la place d'environ un million d'entrées, sans croissance au remplissage", correct: true}
      - {text: "Il crée un million d'entrées à zéro, que `len(m)` compte aussitôt", correct: false}
      - {text: "Il limite la map à un million d'entrées, au-delà elle panique", correct: false}
      - {text: "Il fixe la longueur, et chaque nouvelle clé remplace la plus ancienne", correct: false}
    answer: Une indication de taille qui évite les réallocations successives.
  - key: qcm-concurrence
    format: multiple-choice
    question: Que fait le runtime quand il détecte une écriture concurrente dans une map ?
    choices:
      - text: Il arrête le programme avec une erreur fatale non récupérable
        correct: true
      - text: Il pose un verrou automatiquement
        correct: false
      - text: Il ignore l'écriture
        correct: false
      - text: Il lève une panique qu'on peut récupérer avec recover
        correct: false
    answer: '« fatal error: concurrent map writes » n''est pas une panique : `recover` ne l''attrape pas.'
  - key: scenario-cache-memoire
    format: scenario
    question: Un cache en mémoire supprime bien ses entrées expirées, mais la mémoire du service ne baisse jamais après un pic. Que se passe-t-il et que fais-tu ?
    choices:
      - {text: "La map ne rétrécit pas : je la reconstruis de temps en temps, et je borne le cache", correct: true}
      - {text: "C'est une fuite du ramasse-miettes : je force `runtime.GC()` après chaque purge", correct: false}
      - {text: "`delete` est paresseux : j'appelle `clear` après chaque purge pour libérer", correct: false}
      - {text: "Le pic a fragmenté le tas : je redémarre le service chaque nuit pour le compacter", correct: false}
    answer: "Après le pic, les tables de la map gardent leur taille maximale, même vides. On reconstruit la map (quand elle a perdu une grande part de ses entrées) en copiant les entrées vivantes, sous le verrou du cache, et l'on borne sa taille (LRU) ; le profil mémoire (`inuse_space`) le confirme. Ni `clear` ni le GC ne font rétrécir une map."
  - key: scenario-performance
    format: scenario
    question: Une boucle chaude remplit une map de plusieurs millions d'entrées et le profileur montre beaucoup de temps en croissance de map. Que fais-tu ?
    choices:
      - {text: "Je préalloue avec `make(map[K]V, n)`, pour éviter les rehachages successifs", correct: true}
      - {text: "Je remplace la map par une `sync.Map`, plus rapide pour les écritures", correct: false}
      - {text: "J'appelle `runtime.GC()` toutes les mille insertions, pour libérer les tables", correct: false}
      - {text: "Je trie les clés avant de les insérer, pour que la map grandisse moins", correct: false}
    answer: "Préallouer avec `make(map[K]V, n)`, quand on connaît ou estime le nombre d'entrées, supprime les réallocations et les rehachages. Une clé compacte (entier, petite struct) se hache plus vite qu'une longue chaîne ; si les clés sont des entiers denses, un slice indexé est encore plus rapide."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande comment fonctionne une map en Go. Que réponds-tu ?
    choices:
      - {text: "Une table de hachage du runtime, en O(1) moyen, qui double sans rétrécir, à l'ordre aléatoire", correct: true}
      - {text: "Un arbre équilibré, en O(log n), qui garde ses clés triées et se parcourt dans l'ordre", correct: false}
      - {text: "Une table de hachage sûre entre goroutines, qui garde l'ordre d'insertion des clés", correct: false}
      - {text: "Une liste de paires clé-valeur, parcourue jusqu'à trouver la clé, en O(n)", correct: false}
    answer: "Une table de hachage gérée par le runtime : la clé est hachée avec une graine aléatoire par map, et des octets de contrôle comparent plusieurs emplacements à la fois (Swiss Tables, depuis Go 1.24). O(1) en moyenne ; la table double quand elle se remplit, sans jamais rétrécir ; l'ordre d'itération est aléatoire, et la map n'est pas sûre entre goroutines."
  - key: scenario-dense
    format: scenario
    question: "Tes clés sont des identifiants entiers de 0 à 10 000, presque tous utilisés. Prends-tu une map ou un slice ?"
    choices:
      - {text: "Un slice indexé par l'identifiant : accès direct, sans hachage, mémoire contiguë", correct: true}
      - {text: "Une map : c'est la seule structure qui donne un accès en O(1) par clé", correct: false}
      - {text: "Une map préallouée à 10 001 entrées, plus compacte qu'un slice", correct: false}
      - {text: "Un slice trié de paires, interrogé par recherche dichotomique", correct: false}
    answer: "Un slice de 10 001 éléments (avec un booléen de présence si besoin) : accès direct sans hachage, mémoire contiguë, itération dans l'ordre. Une map convient mieux à des clés éparses ou non entières."
