notion: chaines-octets
lesson: |-
  Une `string` Go est une **suite d'octets immuable**, en pratique de l'**UTF-8**. Elle est représentée par un
  descripteur de deux mots (pointeur vers les octets, longueur) ; la copier ne copie pas les octets.

  ```go
  s := "héllo"
  len(s)        // 6 : le nombre d'OCTETS (é en occupe 2)
  s[1]          // 195 : un octet (byte), pas un caractère
  s[1:3]        // "é" : une découpe en octets
  s + " !"      // une nouvelle chaîne
  s[0] = 'H'    // erreur de compilation : une chaîne est immuable
  ```

  - `len` compte les **octets** ; pour les caractères : `utf8.RuneCountInString(s)`.
  - L'indexation `s[i]` donne un **octet** ; `range` donne les **runes** (caractères).
  - Les chaînes se comparent avec `==`, `<` (ordre des octets) et sont utilisables comme clés de map.
  - « Modifier » une chaîne, c'est en créer une nouvelle : par concaténation, `strings.Builder`, ou en passant par
    `[]byte` ou `[]rune`.
  - Une découpe `s[a:b]` partage les octets de `s` (sans copie, puisqu'ils sont immuables).
  - La valeur zéro est `""` : une chaîne n'est jamais nil.

  **Piège classique** : couper une chaîne non ASCII au milieu d'un caractère (`s[:3]`) et produire de l'UTF-8 invalide,
  affiché avec le caractère de remplacement �.

  **En entretien** : « Des octets immuables, en UTF-8 ; len compte les octets, s[i] donne un octet, range donne les
  runes ; on la modifie en en créant une autre. »
tour:
  - title: Une chaîne est une suite d'octets
    text: |-
      Une `string` Go est une suite d'**octets** immuable, presque toujours de l'UTF-8. `len(s)` compte les **octets**,
      pas les caractères : `"été"` en fait 5, car `é` en prend deux.

      `s[i]` donne un octet (un `byte`), pas un caractère, et `s[2:3]` découpe aussi en octets. Une chaîne ne se modifie
      pas en place : `s[0] = 'x'` ne compile pas, on en construit une autre.

      Pour compter les caractères, on passe par les runes (page suivante).
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "été"
          	fmt.Println(len(mot))
          	fmt.Println(mot[0], mot[1])
          	fmt.Println(mot[2:3])
          	fmt.Println("Go" + " " + "1.27")
          }
      output: |-
        5
        195 169
        t
        Go 1.27
cards:
  - key: renvoie-len-hello
    format: course
    question: Que renvoie len("héllo") ?
    answer: '6 : len compte les octets, et "é" en occupe 2.'
  - key: i-chaine-renvoie
    format: course
    question: s[i] sur une chaîne renvoie quoi ?
    answer: Un octet (byte), pas un caractère.
  - key: string-mutable
    format: course
    question: Une string est-elle mutable ?
    answer: Non ; on passe par []byte ou strings.Builder.
  - key: code-fmt-println-abc-1-string
    format: code-output
    question: '`fmt.Println("abc"[1], string("abc"[1]))`'
    answer: '`98 b` : l''indexation renvoie un octet (98 est le code de ''b'').'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"abc\"[1], string(\"abc\"[1]))\n}\n"
      output: 98 b
  - key: modifier
    format: course
    question: Comment « modifier » le premier caractère d'une chaîne ?
    answer: 'En créant une nouvelle chaîne : via `[]rune(s)` (ou `[]byte` pour de l''ASCII), modification, puis conversion en string ; une chaîne est immuable.'
  - key: vf-len
    format: true-false
    question: '`len("été")` vaut 3.'
    truth: false
    answer: 'Il vaut 5 : chaque « é » occupe deux octets en UTF-8.'
  - key: vf-nil
    format: true-false
    question: Une variable de type string peut valoir nil.
    truth: false
    answer: Sa valeur zéro est la chaîne vide ; seul un `*string` peut être nil.
  - key: vf-comparaison
    format: true-false
    question: Deux chaînes se comparent avec `==` et `<`.
    truth: true
    answer: L'ordre est celui des octets, qui coïncide avec l'ordre des points de code en UTF-8.
  - key: vf-decoupe
    format: true-false
    question: '`s[2:5]` copie trois octets dans une nouvelle zone mémoire.'
    truth: false
    answer: La découpe partage les octets de `s` ; c'est sans danger puisqu'ils sont immuables.
  - key: qcm-len
    format: multiple-choice
    question: Comment compter les caractères de `"héllo"` ?
    choices:
      - text: '`utf8.RuneCountInString(s)`'
        correct: true
      - text: '`len([]rune(s))`'
        correct: true
      - text: '`len(s)`'
        correct: false
      - text: '`s.length()`'
        correct: false
    answer: '`len` compte les octets (6 ici), les deux autres les runes (5).'
  - key: qcm-indexation
    format: multiple-choice
    question: Quel est le type de `s[0]` pour une chaîne `s` ?
    choices:
      - text: '`byte` (uint8)'
        correct: true
      - text: '`rune`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`char`'
        correct: false
    answer: L'indexation donne un octet ; `range` donne des runes.
  - key: qcm-immuable
    format: multiple-choice
    question: Avec `s := "chat"`, quelles instructions compilent ?
    choices:
      - text: '`s = "C" + s[1:]`'
        correct: true
      - text: '`b := []byte(s); b[0] = ''C''`'
        correct: true
      - text: '`s[0] = ''C''`'
        correct: false
      - text: '`s.set(0, ''C'')`'
        correct: false
    answer: On remplace la chaîne entière, ou l'on modifie une copie en `[]byte`.
  - key: qcm-valeur-zero
    format: multiple-choice
    question: Comment tester qu'une chaîne est vide ?
    choices:
      - text: '`s == ""`'
        correct: true
      - text: '`len(s) == 0`'
        correct: true
      - text: '`s == nil`'
        correct: false
      - text: '`s.isEmpty()`'
        correct: false
    answer: Les deux tests sont équivalents ; une chaîne n'est jamais nil.
  - key: code-octet
    format: code-output
    question: |-
      ```go
      s := "héllo"
      fmt.Println(len(s), s[0], s[1], s[1:3])
      ```
    answer: '`6 104 195 é` : `s[1]` est le premier octet de « é », `s[1:3]` ses deux octets.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"héllo\"\n\tfmt.Println(len(s), s[0], s[1], s[1:3])\n}\n"
      output: 6 104 195 é
  - key: code-coupe
    format: code-output
    question: |-
      ```go
      s := "été"
      fmt.Println(utf8.ValidString(s[:1]), utf8.ValidString(s[:2]))
      ```
    answer: '`false true` : couper après le premier octet casse le caractère « é ».'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unicode/utf8\"\n)\n\nfunc main() {\n\ts := \"été\"\n\tfmt.Println(utf8.ValidString(s[:1]), utf8.ValidString(s[:2]))\n}\n"
      output: false true
  - key: code-immuable
    format: code-output
    question: |-
      ```go
      s := "chat"
      s[0] = 'C'
      fmt.Println(s)
      ```
    answer: 'Rien : le code ne compile pas, « cannot assign to s[0] (neither addressable nor a map index expression) ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"chat\"\n\ts[0] = 'C'\n\tfmt.Println(s)\n}\n"
      compiles: false
  - key: bug-coupe
    format: bug-fix
    question: |-
      Les aperçus de commentaires finissent parfois par « � » :
      ```go
      apercu := commentaire[:50]
      ```
    answer: |-
      ```go
      runes := []rune(commentaire)
      apercu := string(runes[:min(50, len(runes))])
      ```
      La découpe en octets coupait des caractères multi-octets ; on découpe en runes (et l'on évite aussi la panique
      quand le commentaire fait moins de 50 octets).
  - key: bug-longueur
    format: bug-fix
    question: "Un pseudo de 10 caractères accentués est refusé par la limite de 12 caractères :\n```go\nif len(pseudo) > 12 {\n\treturn ErrPseudoTropLong\n}\n```"
    answer: "```go\nif utf8.RuneCountInString(pseudo) > 12 {\n\treturn ErrPseudoTropLong\n}\n```\n`len` comptait les octets ; une limite exprimée en caractères compte les runes."
  - key: bug-modification
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```go
      nom := "ada"
      nom[0] = 'A'
      ```
    answer: |-
      ```go
      nom := "ada"
      nom = strings.ToUpper(nom[:1]) + nom[1:]
      ```
      Une chaîne est immuable : on en construit une nouvelle. (Pour des initiales non ASCII, on passerait par les runes.)
  - key: bug-nil
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: s == nil (mismatched types string and untyped nil) » :
      ```go
      if s == nil || s == "" { ... }
      ```
    answer: |-
      ```go
      if s == "" { ... }
      ```
      Une chaîne ne peut pas être nil ; sa valeur zéro est la chaîne vide.
