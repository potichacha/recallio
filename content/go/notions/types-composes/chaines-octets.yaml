notion: chaines-octets
lesson: |-
  Une `string` Go est une **suite d'octets immuable**, en pratique de l'**UTF-8**. Elle est représentée par un
  descripteur de deux mots (pointeur vers les octets, longueur) ; la copier ne copie pas les octets.

  ```go
  s := "héllo"
  len(s)        // 6 : le nombre d'OCTETS (é en occupe 2)
  s[1]          // 195 : un octet (byte), pas un caractère
  s[1:3]        // "é" : une découpe en octets
  s + " !"      // une nouvelle chaîne
  s[0] = 'H'    // erreur de compilation : une chaîne est immuable
  ```

  - `len` compte les **octets** ; pour les caractères : `utf8.RuneCountInString(s)`.
  - L'indexation `s[i]` donne un **octet** ; `range` donne les **runes** (caractères).
  - Les chaînes se comparent avec `==`, `<` (ordre des octets) et sont utilisables comme clés de map.
  - « Modifier » une chaîne, c'est en créer une nouvelle : par concaténation, `strings.Builder`, ou en passant par
    `[]byte` ou `[]rune`.
  - Une découpe `s[a:b]` partage les octets de `s` (sans copie, puisqu'ils sont immuables).
  - La valeur zéro est `""` : une chaîne n'est jamais nil.

  **Piège classique** : couper une chaîne non ASCII au milieu d'un caractère (`s[:3]`) et produire de l'UTF-8 invalide,
  affiché avec le caractère de remplacement �.

  **En entretien** : « Des octets immuables, en UTF-8 ; len compte les octets, s[i] donne un octet, range donne les
  runes ; on la modifie en en créant une autre. »
tour:
  - title: Une chaîne est une suite d'octets
    text: |-
      Une `string` Go est une suite d'**octets** immuable, presque toujours de l'UTF-8. `len(s)` compte les **octets**,
      pas les caractères : `"été"` en fait 5, car `é` en prend deux.

      `s[i]` donne un octet (un `byte`), pas un caractère, et `s[2:3]` découpe aussi en octets. Une chaîne ne se modifie
      pas en place : `s[0] = 'x'` ne compile pas, on en construit une autre.

      Pour compter les caractères, on passe par les runes (page suivante).
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	mot := "été"
          	fmt.Println(len(mot))
          	fmt.Println(mot[0], mot[1])
          	fmt.Println(mot[2:3])
          	fmt.Println("Go" + " " + "1.27")
          }
      output: |-
        5
        195 169
        t
        Go 1.27
cards:
  - key: renvoie-len-hello
    format: course
    question: "Que renvoie `len(\"héllo\")` ?"
    choices:
      - {text: "`6`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`7`", correct: false}
    answer: "`6` : `len` compte les octets, et « é » en occupe 2 en UTF-8. Pour compter les 5 caractères, `utf8.RuneCountInString`."
  - key: i-chaine-renvoie
    format: course
    question: "Que renvoie `s[i]` sur une chaîne `s` ?"
    choices:
      - {text: "Un octet (`byte`), qui peut n'être qu'un morceau de caractère", correct: true}
      - {text: "Une rune, le i-ème caractère de la chaîne", correct: false}
      - {text: "Une chaîne d'un caractère, comme en Python", correct: false}
      - {text: "Un `char` sur 16 bits, comme en Java", correct: false}
    answer: "Le i-ème octet, de type `byte` : pour un texte non ASCII, ce n'est qu'un morceau de caractère. Pour les caractères, on passe par `range s` ou `[]rune(s)`."
  - key: string-mutable
    format: course
    question: "Une `string` Go est-elle mutable ?"
    choices:
      - {text: "Non : pour la changer, on passe par un `[]byte` ou un `strings.Builder`", correct: true}
      - {text: "Oui : `s[0] = 'A'` remplace le premier octet de la chaîne en place", correct: false}
      - {text: "Oui, si elle a été créée par une conversion plutôt que par un littéral", correct: false}
      - {text: "Non, sauf à travers un `*string`, qui permet d'écrire `(*p)[0] = 'A'`", correct: false}
    answer: "Non : une chaîne est immuable, `s[0] = 'A'` ne compile pas. On construit une nouvelle chaîne, à partir d'un `[]byte`, de runes ou d'un `strings.Builder` ; un `*string` permet de remplacer la chaîne entière, pas un de ses octets."
  - key: code-fmt-println-abc-1-string
    format: code-output
    question: "Qu'affiche `fmt.Println(\"abc\"[1], string(\"abc\"[1]))` ?"
    choices:
      - {text: "`98 b`", correct: true}
      - {text: "`b b`", correct: false}
      - {text: "`98 98`", correct: false}
      - {text: "`b 98`", correct: false}
    answer: "`98 b` : l'indexation renvoie un octet, affiché comme un nombre (98 est le code de « b ») ; `string` sur cet octet donne le caractère."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"abc\"[1], string(\"abc\"[1]))\n}\n"
      output: 98 b
  - key: modifier
    format: course
    question: Comment « modifier » le premier caractère d'une chaîne ?
    choices:
      - {text: "En créant une nouvelle chaîne, à partir de `[]rune(s)` modifié puis reconverti", correct: true}
      - {text: "En écrivant `s[0] = 'X'`, qui remplace le premier octet sans rien copier", correct: false}
      - {text: "En prenant `p := &s[0]`, puis en écrivant `*p = 'X'` à travers le pointeur", correct: false}
      - {text: "Avec `s.Replace(0, \"X\")`, comme la méthode d'un `StringBuilder` Java", correct: false}
    answer: "Une chaîne est immuable : on en construit une nouvelle, via `[]rune(s)` (ou `[]byte` pour de l'ASCII), modifié puis reconverti en `string`. `s[0]` n'est pas adressable : ni affectation, ni `&s[0]`."
  - key: vf-len
    format: true-false
    question: '`len("été")` vaut 3.'
    truth: false
    answer: 'Il vaut 5 : chaque « é » occupe deux octets en UTF-8.'
  - key: vf-nil
    format: true-false
    question: Une variable de type string peut valoir nil.
    truth: false
    answer: Sa valeur zéro est la chaîne vide ; seul un `*string` peut être nil.
  - key: vf-comparaison
    format: true-false
    question: Deux chaînes se comparent avec `==` et `<`.
    truth: true
    answer: L'ordre est celui des octets, qui coïncide avec l'ordre des points de code en UTF-8.
  - key: vf-decoupe
    format: true-false
    question: '`s[2:5]` copie trois octets dans une nouvelle zone mémoire.'
    truth: false
    answer: La découpe partage les octets de `s` ; c'est sans danger puisqu'ils sont immuables.
  - key: qcm-len
    format: multiple-choice
    question: "Quelles expressions comptent les 5 caractères de `s := \"héllo\"` ?"
    choices:
      - text: '`utf8.RuneCountInString(s)`'
        correct: true
      - text: '`len([]rune(s))`'
        correct: true
      - text: '`len(s)`'
        correct: false
      - text: '`s.length()`'
        correct: false
    answer: '`len` compte les octets (6 ici), les deux autres les runes (5).'
  - key: qcm-indexation
    format: multiple-choice
    question: Quel est le type de `s[0]` pour une chaîne `s` ?
    choices:
      - text: '`byte` (uint8)'
        correct: true
      - text: '`rune`'
        correct: false
      - text: '`string`'
        correct: false
      - text: '`char`'
        correct: false
    answer: L'indexation donne un octet ; `range` donne des runes.
  - key: qcm-immuable
    format: multiple-choice
    question: "Avec `s := \"chat\"`, laquelle de ces instructions compile ?"
    choices:
      - {text: "`s = \"C\" + s[1:]`", correct: true}
      - {text: "`s[0] = 'C'`", correct: false}
      - {text: "`s[0:1] = \"C\"`", correct: false}
      - {text: "`p := &s[0]; *p = 'C'`", correct: false}
    answer: "On remplace la chaîne entière : une chaîne est immuable, et ni ses octets ni ses découpes ne sont assignables ou adressables. Modifier une copie en `[]byte` (`b := []byte(s); b[0] = 'C'`) compile aussi."
  - key: qcm-valeur-zero
    format: multiple-choice
    question: "Quels tests disent qu'une chaîne `s` est vide ?"
    choices:
      - text: '`s == ""`'
        correct: true
      - text: '`len(s) == 0`'
        correct: true
      - text: '`s == nil`'
        correct: false
      - text: '`s.isEmpty()`'
        correct: false
    answer: Les deux tests sont équivalents ; une chaîne n'est jamais nil.
  - key: code-octet
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := "héllo"
      fmt.Println(len(s), s[0], s[1], s[1:3])
      ```
    choices:
      - {text: "`6 104 195 é`", correct: true}
      - {text: "`5 104 233 él`", correct: false}
      - {text: "`6 104 233 é`", correct: false}
      - {text: "`5 h é él`", correct: false}
    answer: "`len` compte 6 octets ; `s[1]` est le premier octet de « é » (195), pas sa valeur Unicode (233), et `s[1:3]` prend ses deux octets, donc « é »."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"héllo\"\n\tfmt.Println(len(s), s[0], s[1], s[1:3])\n}\n"
      output: 6 104 195 é
  - key: code-coupe
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := "été"
      fmt.Println(utf8.ValidString(s[:1]), utf8.ValidString(s[:2]))
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "« é » occupe 2 octets : `s[:1]` coupe au milieu du caractère (UTF-8 invalide), `s[:2]` le garde entier."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"unicode/utf8\"\n)\n\nfunc main() {\n\ts := \"été\"\n\tfmt.Println(utf8.ValidString(s[:1]), utf8.ValidString(s[:2]))\n}\n"
      output: false true
  - key: code-immuable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := "chat"
      s[0] = 'C'
      fmt.Println(s)
      ```
    choices:
      - {text: "Ça ne compile pas : `s[0]` n'est pas assignable", correct: true}
      - {text: "`Chat`", correct: false}
      - {text: "`chat`", correct: false}
      - {text: "Une panic à l'exécution, à l'affectation de `s[0]`", correct: false}
    answer: "Une chaîne est immuable : le compilateur refuse `s[0] = 'C'` (« cannot assign to s[0] »). L'erreur se voit dès la compilation, pas à l'exécution."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := \"chat\"\n\ts[0] = 'C'\n\tfmt.Println(s)\n}\n"
      compiles: false
  - key: bug-coupe
    format: bug-fix
    question: |-
      Les aperçus de commentaires finissent parfois par « � ». Quelle correction est la bonne ?
      ```go
      apercu := commentaire[:50]
      ```
    choices:
      - {text: "Découper les runes, pas les octets : `[]rune(commentaire)`, borné à 50", correct: true}
      - {text: "Découper `commentaire[:50:50]`, pour limiter aussi la capacité", correct: false}
      - {text: "Passer par les octets : `string([]byte(commentaire)[:50])`", correct: false}
      - {text: "Écrire `commentaire[0:50]`, qui s'arrête à la fin d'un caractère", correct: false}
    answer: |-
      ```go
      runes := []rune(commentaire)
      apercu := string(runes[:min(50, len(runes))])
      ```
      La découpe en octets coupait des caractères multi-octets ; on découpe en runes (et l'on évite aussi la panique
      quand le commentaire fait moins de 50 octets). Passer par `[]byte` ou écrire `[0:50]` coupe exactement au même endroit.
  - key: bug-longueur
    format: bug-fix
    question: |-
      Un pseudo de 10 caractères accentués est refusé par la limite de 12 caractères. Quelle correction est la bonne ?
      ```go
      if len(pseudo) > 12 {
      	return ErrPseudoTropLong
      }
      ```
    choices:
      - {text: "Compter les runes : `utf8.RuneCountInString(pseudo) > 12`", correct: true}
      - {text: "Compter les octets : `len([]byte(pseudo)) > 12`", correct: false}
      - {text: "Normaliser d'abord : `len(strings.ToLower(pseudo)) > 12`", correct: false}
      - {text: "Doubler la limite : `len(pseudo) > 24`, deux octets par lettre", correct: false}
    answer: |-
      ```go
      if utf8.RuneCountInString(pseudo) > 12 {
      	return ErrPseudoTropLong
      }
      ```
      `len` comptait les octets ; une limite exprimée en caractères compte les runes. Doubler la limite ne marche pas : un caractère occupe de 1 à 4 octets.
  - key: bug-modification
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      nom := "ada"
      nom[0] = 'A'
      ```
    choices:
      - {text: "Construire une nouvelle chaîne : `nom = strings.ToUpper(nom[:1]) + nom[1:]`", correct: true}
      - {text: "Passer par un pointeur : `p := &nom[0]`, puis `*p = 'A'`", correct: false}
      - {text: "Déclarer `nom` avec `var` plutôt que `:=`, pour la rendre modifiable", correct: false}
      - {text: "Écrire `nom[0] = \"A\"`, avec des guillemets doubles pour une chaîne", correct: false}
    answer: |-
      ```go
      nom := "ada"
      nom = strings.ToUpper(nom[:1]) + nom[1:]
      ```
      Une chaîne est immuable : on en construit une nouvelle. (Pour des initiales non ASCII, on passerait par les runes.)
  - key: bug-nil
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: s == nil (mismatched types string and untyped nil) ». Quelle correction est la bonne ?
      ```go
      if s == nil || s == "" { ... }
      ```
    choices:
      - {text: "Ne garder que `s == \"\"` : une chaîne ne vaut jamais nil", correct: true}
      - {text: "Écrire `s == string(nil)`, qui convertit nil en chaîne", correct: false}
      - {text: "Inverser les tests : `s == \"\" || s == nil`", correct: false}
      - {text: "Remplacer le test par `len(s) == nil`", correct: false}
    answer: |-
      ```go
      if s == "" { ... }
      ```
      Une chaîne ne peut pas être nil ; sa valeur zéro est la chaîne vide.
