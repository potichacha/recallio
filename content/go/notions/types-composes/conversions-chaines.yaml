notion: conversions-chaines
lesson: |-
  Les conversions courantes autour des chaînes :

  | De | Vers | Comment | Remarque |
  |---|---|---|---|
  | `string` | `[]byte` | `[]byte(s)` | copie les octets |
  | `[]byte` | `string` | `string(b)` | copie les octets |
  | `string` | `[]rune` | `[]rune(s)` | décode l'UTF-8 |
  | `rune` | `string` | `string(r)` | le caractère |
  | entier | texte | `strconv.Itoa(n)`, `strconv.FormatInt(n, 10)` | **pas** `string(n)` |
  | texte | entier | `strconv.Atoi(s)`, `strconv.ParseInt(s, 10, 64)` | renvoie une erreur |
  | texte | flottant, bool | `strconv.ParseFloat(s, 64)`, `strconv.ParseBool` | renvoie une erreur |
  | tout | texte | `fmt.Sprint(v)`, `fmt.Sprintf("%v", v)` | plus lent, par réflexion |

  - `string(65)` donne `"A"` (le caractère de point de code 65), **pas** `"65"` ; `go vet` le signale.
  - Les conversions `string` ↔ `[]byte` **copient** : la chaîne reste immuable. Le compilateur évite la copie dans
    certains cas (une clé de map `m[string(b)]`, une comparaison).
  - `strconv.Atoi` renvoie une **erreur** pour un texte invalide ou hors limites (`*strconv.NumError`), qu'on doit
    traiter ; `strconv.Quote` produit une chaîne Go entre guillemets.

  **Piège classique** : ignorer l'erreur de `strconv.Atoi` ; une saisie invalide devient silencieusement 0.

  **En entretien** : « strconv pour nombres et texte (Itoa, Atoi, ParseFloat), avec une erreur à traiter ; string(n)
  donne un caractère ; []byte et string se convertissent en copiant. »
cards:
  - key: vaut-string-rune-65
    format: course
    question: Que vaut string(rune(65)) ?
    answer: '"A" ; pour "65" il faut strconv.Itoa.'
  - key: code-str-hello-bs-byte-str
    format: code-output
    question: '`str := "hello"; bs := []byte(str); bs[0] = ''H''; fmt.Println(str, string(bs))`'
    answer: '`hello Hello` : la conversion copie les octets, la chaîne est immuable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstr := \"hello\"\n\tbs := []byte(str)\n\tbs[0] = 'H'\n\tfmt.Println(str, string(bs))\n}\n"
      output: hello Hello
  - key: code-fmt-println-string-rune-65
    format: code-output
    question: '`fmt.Println(string(rune(65)), fmt.Sprint(65))`'
    answer: '`A 65` : convertir un entier en string donne le caractère correspondant, pas le texte du nombre.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(string(rune(65)), fmt.Sprint(65))\n}\n"
      output: A 65
  - key: itoa-atoi
    format: course
    question: Quelles fonctions convertissent entre un entier et son texte ?
    answer: '`strconv.Itoa(n)` vers le texte, `strconv.Atoi(s)` vers l''entier, qui renvoie aussi une erreur.'
  - key: sprint
    format: course
    question: Pourquoi préférer `strconv.Itoa` à `fmt.Sprint` pour un entier ?
    answer: Il est plus rapide (pas de réflexion) et dit précisément ce qu'il fait ; `fmt.Sprint` reste pratique pour des valeurs de types variés.
  - key: vf-string-int
    format: true-false
    question: '`string(42)` donne la chaîne "42".'
    truth: false
    answer: Il donne le caractère de point de code 42, « * » ; `go vet` signale cette conversion.
  - key: vf-copie
    format: true-false
    question: '`[]byte(s)` copie les octets de la chaîne.'
    truth: true
    answer: Sinon on pourrait modifier une chaîne immuable à travers le slice.
  - key: vf-atoi-erreur
    format: true-false
    question: '`strconv.Atoi("12a")` renvoie 12 et une erreur nil.'
    truth: false
    answer: Il renvoie 0 et une erreur de syntaxe (`*strconv.NumError`).
  - key: vf-parsebool
    format: true-false
    question: '`strconv.ParseBool("1")` renvoie true.'
    truth: true
    answer: Il accepte 1, t, T, TRUE, true, True et leurs équivalents faux.
  - key: qcm-entier-texte
    format: multiple-choice
    question: Comment obtenir "42" à partir de l'entier 42 ?
    choices:
      - text: '`strconv.Itoa(42)`'
        correct: true
      - text: '`fmt.Sprint(42)`'
        correct: true
      - text: '`string(42)`'
        correct: false
      - text: '`42.String()`'
        correct: false
    answer: '`string(42)` donne « * ».'
  - key: qcm-parse
    format: multiple-choice
    question: Comment lire un int64 depuis le texte "9000000000" ?
    choices:
      - text: '`strconv.ParseInt(s, 10, 64)`'
        correct: true
      - text: '`strconv.Atoi(s)` sur une plateforme 64 bits'
        correct: true
      - text: '`int64(s)`'
        correct: false
      - text: '`strconv.Itoa(s)`'
        correct: false
    answer: '`Atoi` renvoie un `int`, de 64 bits sur amd64 ; `ParseInt` précise la base et la taille.'
  - key: qcm-erreur
    format: multiple-choice
    question: Que renvoie `strconv.Atoi("abc")` ?
    choices:
      - text: 0 et une erreur `*strconv.NumError` (invalid syntax)
        correct: true
      - text: 0 et nil
        correct: false
      - text: Une panique
        correct: false
      - text: "-1 et nil"
        correct: false
    answer: L'erreur dit quelle entrée et pourquoi.
  - key: qcm-conversions
    format: multiple-choice
    question: Lesquelles décodent l'UTF-8 ?
    choices:
      - text: '`[]rune(s)`'
        correct: true
      - text: '`range s`'
        correct: true
      - text: '`[]byte(s)`'
        correct: false
      - text: '`s[i]`'
        correct: false
    answer: Les deux autres travaillent sur les octets.
  - key: trous-atoi
    format: fill-in
    question: "Complétez la lecture d'un entier saisi :\n```go\nn, err := strconv.___(saisie)\nif err != nil {\n\treturn err\n}\n```"
    blanks:
      - - Atoi
    answer: '`Atoi` renvoie l''entier et une erreur.'
  - key: trous-itoa
    format: fill-in
    question: |-
      Complétez pour fabriquer l'étiquette :
      ```go
      etiquette := "page-" + strconv.___(numero)
      ```
    blanks:
      - - Itoa
    answer: '`Itoa` convertit un int en texte.'
  - key: trous-float
    format: fill-in
    question: |-
      Complétez la lecture d'un prix :
      ```go
      prix, err := strconv.___(texte, 64)
      ```
    blanks:
      - - ParseFloat
    answer: '`ParseFloat` avec la taille en bits.'
  - key: trous-bytes
    format: fill-in
    question: |-
      Complétez pour obtenir un slice d'octets modifiable :
      ```go
      b := ___(texte)
      ```
    blanks:
      - - '[]byte'
    answer: La conversion copie les octets de la chaîne.
  - key: code-atoi
    format: code-output
    question: |-
      ```go
      n, err := strconv.Atoi("12a")
      fmt.Println(n, err)
      ```
    answer: '`0 strconv.Atoi: parsing "12a": invalid syntax`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tn, err := strconv.Atoi(\"12a\")\n\tfmt.Println(n, err)\n}\n"
      output: '0 strconv.Atoi: parsing "12a": invalid syntax'
  - key: code-quote
    format: code-output
    question: |-
      ```go
      fmt.Println(strconv.Quote("a\"b\n"), strconv.FormatInt(255, 16))
      ```
    answer: '`"a\"b\n" ff` : `Quote` échappe, `FormatInt` change de base.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tfmt.Println(strconv.Quote(\"a\\\"b\\n\"), strconv.FormatInt(255, 16))\n}\n"
      output: '"a\"b\n" ff'
  - key: bug-string-int
    format: bug-fix
    question: |-
      L'identifiant de la commande s'affiche « Commande ☺ » :
      ```go
      titre := "Commande " + string(cmd.ID) // ID vaut 1
      ```
    answer: |-
      ```go
      titre := "Commande " + strconv.Itoa(cmd.ID)
      ```
      `string(1)` donne le caractère de point de code 1, pas le texte « 1 ».
  - key: bug-erreur-ignoree
    format: bug-fix
    question: |-
      Une quantité « 3,5 » saisie par un client devient 0 sans message :
      ```go
      q, _ := strconv.Atoi(r.FormValue("quantite"))
      ```
    answer: "```go\nq, err := strconv.Atoi(r.FormValue(\"quantite\"))\nif err != nil || q <= 0 {\n\thttp.Error(w, \"quantité invalide\", http.StatusBadRequest)\n\treturn\n}\n```\nL'erreur ignorée transformait une saisie invalide en 0 ; on la traite et l'on répond 400."
  - key: bug-taille
    format: bug-fix
    question: |-
      Un identifiant de 12 chiffres est refusé sur une machine 32 bits :
      ```go
      id, err := strconv.Atoi(s)
      ```
    answer: |-
      ```go
      id, err := strconv.ParseInt(s, 10, 64)
      ```
      `Atoi` produit un `int`, de 32 bits sur cette plateforme ; `ParseInt` avec 64 bits fixe la taille.
  - key: bug-sprint
    format: bug-fix
    question: |-
      En revue, rendez cette conversion plus directe :
      ```go
      cle := fmt.Sprintf("%d", id)
      ```
    answer: |-
      ```go
      cle := strconv.Itoa(id)
      ```
      `Sprintf` passe par la réflexion et l'analyse du format ; `strconv.Itoa` fait exactement la conversion voulue.
  - key: bytes-string-cout
    format: course
    question: Pourquoi convertir sans cesse entre `string` et `[]byte` coûte-t-il cher ?
    answer: Chaque conversion copie les octets (et alloue) ; on choisit un type et l'on s'y tient, ou l'on utilise les fonctions jumelles des packages `strings` et `bytes`.
