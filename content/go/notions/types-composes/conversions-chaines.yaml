notion: conversions-chaines
lesson: |-
  Les conversions courantes autour des chaînes :

  | De | Vers | Comment | Remarque |
  |---|---|---|---|
  | `string` | `[]byte` | `[]byte(s)` | copie les octets |
  | `[]byte` | `string` | `string(b)` | copie les octets |
  | `string` | `[]rune` | `[]rune(s)` | décode l'UTF-8 |
  | `rune` | `string` | `string(r)` | le caractère |
  | entier | texte | `strconv.Itoa(n)`, `strconv.FormatInt(n, 10)` | **pas** `string(n)` |
  | texte | entier | `strconv.Atoi(s)`, `strconv.ParseInt(s, 10, 64)` | renvoie une erreur |
  | texte | flottant, bool | `strconv.ParseFloat(s, 64)`, `strconv.ParseBool` | renvoie une erreur |
  | tout | texte | `fmt.Sprint(v)`, `fmt.Sprintf("%v", v)` | plus lent, par réflexion |

  - `string(65)` donne `"A"` (le caractère de point de code 65), **pas** `"65"` ; `go vet` le signale.
  - Les conversions `string` ↔ `[]byte` **copient** : la chaîne reste immuable. Le compilateur évite la copie dans
    certains cas (une clé de map `m[string(b)]`, une comparaison).
  - `strconv.Atoi` renvoie une **erreur** pour un texte invalide ou hors limites (`*strconv.NumError`), qu'on doit
    traiter ; `strconv.Quote` produit une chaîne Go entre guillemets.

  **Piège classique** : ignorer l'erreur de `strconv.Atoi` ; une saisie invalide devient silencieusement 0.

  **En entretien** : « strconv pour nombres et texte (Itoa, Atoi, ParseFloat), avec une erreur à traiter ; string(n)
  donne un caractère ; []byte et string se convertissent en copiant. »
tour:
  - title: Conversions de chaînes
    text: |-
      Une chaîne se convertit en `[]byte` ou en `[]rune`, et inversement : `[]byte(s)`, `string(b)`. Chaque conversion
      **copie** les données.

      Pour les nombres, c'est le package `strconv` : `strconv.Itoa(42)` donne la chaîne `"42"`, et `strconv.Atoi("42")`
      le nombre 42, avec une erreur si la chaîne n'est pas un nombre. `ParseFloat`, `ParseBool` et `FormatInt`
      complètent la famille.

      Piège : `string(65)` ne donne pas `"65"`, mais `"A"`, le caractère de code 65. `go vet` le signale.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func main() {
          	octets := []byte("Go")
          	fmt.Println(octets, string(octets))

          	n, err := strconv.Atoi("2026")
          	fmt.Println(n+1, err)

          	_, err = strconv.Atoi("vingt")
          	fmt.Println(err)

          	fmt.Println(strconv.Itoa(42) + "!")
          	f, _ := strconv.ParseFloat("3.5", 64)
          	fmt.Println(f * 2)
          }
      output: |-
        [71 111] Go
        2027 <nil>
        strconv.Atoi: parsing "vingt": invalid syntax
        42!
        7
cards:
  - key: vaut-string-rune-65
    format: course
    question: "Que vaut `string(rune(65))` ?"
    choices:
      - {text: "`\"A\"`", correct: true}
      - {text: "`\"65\"`", correct: false}
      - {text: "Une chaîne vide", correct: false}
      - {text: "Une erreur de compilation", correct: false}
    answer: "`\"A\"` : convertir un entier en `string` donne le caractère de ce point de code (65 est « A »). Pour le texte « 65 », il faut `strconv.Itoa`."
  - key: code-str-hello-bs-byte-str
    format: code-output
    question: "Qu'affiche `str := \"hello\"; bs := []byte(str); bs[0] = 'H'; fmt.Println(str, string(bs))` ?"
    choices:
      - {text: "`hello Hello`", correct: true}
      - {text: "`Hello Hello`", correct: false}
      - {text: "`hello hello`", correct: false}
      - {text: "`Hello hello`", correct: false}
    answer: "`hello Hello` : la conversion `[]byte(str)` copie les octets ; modifier `bs` ne touche pas `str`, qui reste immuable."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstr := \"hello\"\n\tbs := []byte(str)\n\tbs[0] = 'H'\n\tfmt.Println(str, string(bs))\n}\n"
      output: hello Hello
  - key: code-fmt-println-string-rune-65
    format: code-output
    question: "Qu'affiche `fmt.Println(string(rune(65)), fmt.Sprint(65))` ?"
    choices:
      - {text: "`A 65`", correct: true}
      - {text: "`65 65`", correct: false}
      - {text: "`A A`", correct: false}
      - {text: "`65 A`", correct: false}
    answer: "`A 65` : convertir un entier en `string` donne le caractère correspondant ; `fmt.Sprint` écrit le texte du nombre."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(string(rune(65)), fmt.Sprint(65))\n}\n"
      output: A 65
  - key: itoa-atoi
    format: course
    question: "Quelle paire de fonctions convertit un entier en texte, puis un texte en entier ?"
    choices:
      - {text: "`strconv.Itoa(n)`, puis `strconv.Atoi(s)`, qui renvoie aussi une erreur", correct: true}
      - {text: "`strconv.Atoi(n)`, puis `strconv.Itoa(s)`, qui renvoie aussi une erreur", correct: false}
      - {text: "`string(n)`, puis `int(s)`, des conversions directes sans erreur", correct: false}
      - {text: "`fmt.Sprint(n)`, puis `strconv.Itoa(s)`, qui panique sur un texte invalide", correct: false}
    answer: "`Itoa` (integer to ASCII) produit le texte ; `Atoi` lit l'entier et renvoie une erreur si le texte n'en est pas un. `string(n)` donne un caractère, et `int(s)` ne compile pas."
  - key: sprint
    format: course
    question: Pourquoi préférer `strconv.Itoa` à `fmt.Sprint` pour un entier ?
    choices:
      - {text: "Il est plus rapide, sans réflexion, et dit exactement ce qu'il fait", correct: true}
      - {text: "`fmt.Sprint` ajoute une espace après chaque entier converti", correct: false}
      - {text: "`fmt.Sprint` ne sait pas convertir les entiers négatifs", correct: false}
      - {text: "`strconv.Itoa` accepte aussi les `int64` et les flottants", correct: false}
    answer: "`strconv.Itoa` fait une seule conversion, sans réflexion ni analyse de format, et son nom dit ce qu'il fait ; `fmt.Sprint` reste pratique pour des valeurs de types variés. `Itoa` ne prend qu'un `int` : pour un `int64`, `strconv.FormatInt`."
  - key: vf-string-int
    format: true-false
    question: '`string(42)` donne la chaîne "42".'
    truth: false
    answer: Il donne le caractère de point de code 42, « * » ; `go vet` signale cette conversion.
  - key: vf-copie
    format: true-false
    question: '`[]byte(s)` copie les octets de la chaîne.'
    truth: true
    answer: Sinon on pourrait modifier une chaîne immuable à travers le slice.
  - key: vf-atoi-erreur
    format: true-false
    question: '`strconv.Atoi("12a")` renvoie 12 et une erreur nil.'
    truth: false
    answer: Il renvoie 0 et une erreur de syntaxe (`*strconv.NumError`).
  - key: vf-parsebool
    format: true-false
    question: '`strconv.ParseBool("1")` renvoie true.'
    truth: true
    answer: Il accepte 1, t, T, TRUE, true, True et leurs équivalents faux.
  - key: qcm-entier-texte
    format: multiple-choice
    question: "Quelles expressions donnent la chaîne `\"42\"` à partir de l'entier 42 ?"
    choices:
      - text: '`strconv.Itoa(42)`'
        correct: true
      - text: '`fmt.Sprint(42)`'
        correct: true
      - text: '`string(42)`'
        correct: false
      - text: '`42.String()`'
        correct: false
    answer: '`string(42)` donne « * ».'
  - key: qcm-parse
    format: multiple-choice
    question: "Quelle fonction lit un `int64` depuis le texte `\"9000000000\"`, sur toutes les plateformes ?"
    choices:
      - {text: "`strconv.ParseInt(s, 10, 64)`", correct: true}
      - {text: "`strconv.Atoi(s)`", correct: false}
      - {text: "`int64(s)`", correct: false}
      - {text: "`strconv.Itoa(s)`", correct: false}
    answer: "`ParseInt` précise la base et la taille : 64 bits partout. `Atoi` renvoie un `int`, de 64 bits sur amd64 mais de 32 bits ailleurs, où ce nombre déborde ; `int64(s)` ne compile pas."
  - key: qcm-erreur
    format: multiple-choice
    question: Que renvoie `strconv.Atoi("abc")` ?
    choices:
      - {text: "0 et une erreur `*strconv.NumError` (invalid syntax)", correct: true}
      - {text: "0 et nil, puisque le texte ne contient aucun chiffre", correct: false}
      - {text: "Une panic « invalid syntax », à rattraper par `recover`", correct: false}
      - {text: "-1 et nil, la valeur de repli des conversions ratées", correct: false}
    answer: "`Atoi` ne panique pas : il renvoie 0 et une erreur `*strconv.NumError` qui dit quelle entrée et pourquoi (« invalid syntax »). On teste toujours cette erreur."
  - key: qcm-conversions
    format: multiple-choice
    question: "Lesquelles de ces écritures décodent l'UTF-8 d'une chaîne `s` ?"
    choices:
      - text: '`[]rune(s)`'
        correct: true
      - text: '`range s`'
        correct: true
      - text: '`[]byte(s)`'
        correct: false
      - text: '`s[i]`'
        correct: false
    answer: Les deux autres travaillent sur les octets.
  - key: trous-atoi
    format: fill-in
    question: |-
      Complète la lecture d'un entier saisi :
      ```go
      n, err := strconv.___(saisie)
      if err != nil {
      	return err
      }
      ```
    blanks:
      - - Atoi
    answer: '`Atoi` renvoie l''entier et une erreur.'
  - key: trous-itoa
    format: fill-in
    question: |-
      Complète pour fabriquer l'étiquette :
      ```go
      etiquette := "page-" + strconv.___(numero)
      ```
    blanks:
      - - Itoa
    answer: '`Itoa` convertit un int en texte.'
  - key: trous-float
    format: fill-in
    question: |-
      Complète la lecture d'un prix :
      ```go
      prix, err := strconv.___(texte, 64)
      ```
    blanks:
      - - ParseFloat
    answer: '`ParseFloat` avec la taille en bits.'
  - key: trous-bytes
    format: fill-in
    question: |-
      Complète pour obtenir un slice d'octets modifiable :
      ```go
      b := ___(texte)
      ```
    blanks:
      - - '[]byte'
    answer: La conversion copie les octets de la chaîne.
  - key: code-atoi
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      n, err := strconv.Atoi("12a")
      fmt.Println(n, err)
      ```
    choices:
      - {text: "`0 strconv.Atoi: parsing \"12a\": invalid syntax`", correct: true}
      - {text: "`12 strconv.Atoi: parsing \"12a\": invalid syntax`", correct: false}
      - {text: "`12 <nil>`", correct: false}
      - {text: "`0 <nil>`", correct: false}
    answer: "`Atoi` refuse toute l'entrée dès un caractère invalide : il renvoie 0, pas le début lu (12), et une erreur qui cite l'entrée."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tn, err := strconv.Atoi(\"12a\")\n\tfmt.Println(n, err)\n}\n"
      output: '0 strconv.Atoi: parsing "12a": invalid syntax'
  - key: code-quote
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(strconv.Quote("a\"b\n"), strconv.FormatInt(255, 16))
      ```
    choices:
      - {text: "`\"a\\\"b\\n\" ff`", correct: true}
      - {text: "`\"a\\\"b\\n\" FF`", correct: false}
      - {text: "`\"a\\\"b\\n\" 255`", correct: false}
      - {text: "`\"a\"b\\n\" ff`", correct: false}
    answer: "`Quote` entoure la chaîne de guillemets et échappe le guillemet et le retour à la ligne ; `FormatInt(255, 16)` écrit 255 en base 16, en minuscules : `ff`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tfmt.Println(strconv.Quote(\"a\\\"b\\n\"), strconv.FormatInt(255, 16))\n}\n"
      output: '"a\"b\n" ff'
  - key: bug-string-int
    format: bug-fix
    question: |-
      L'identifiant de la commande s'affiche « Commande » suivi d'un caractère illisible au lieu de « Commande 1 », et `go vet` signale la ligne. Quelle correction est la bonne ?
      ```go
      titre := "Commande " + string(cmd.ID) // ID vaut 1
      ```
    choices:
      - {text: "`\"Commande \" + strconv.Itoa(cmd.ID)`", correct: true}
      - {text: "`\"Commande \" + string(rune(cmd.ID))`", correct: false}
      - {text: "`\"Commande \" + string(cmd.ID + '0')`", correct: false}
      - {text: "`\"Commande \" + string([]byte{byte(cmd.ID)})`", correct: false}
    answer: |-
      ```go
      titre := "Commande " + strconv.Itoa(cmd.ID)
      ```
      `string(1)` donne la chaîne du point de code U+0001, un caractère de contrôle, et non le texte « 1 » : `go vet` le signale (« yields a string of one rune, not a string of digits »). `strconv.Itoa` écrit le nombre en décimal ; ajouter `'0'` ne marche que pour un seul chiffre.
  - key: bug-erreur-ignoree
    format: bug-fix
    question: |-
      Une quantité « 3,5 » saisie par un client devient 0 sans message. Quelle correction est la bonne ?
      ```go
      q, _ := strconv.Atoi(r.FormValue("quantite"))
      ```
    choices:
      - {text: "Tester l'erreur d'`Atoi`, et répondre 400 si la saisie est invalide", correct: true}
      - {text: "Remplacer `Atoi` par `ParseFloat`, qui accepte la virgule décimale", correct: false}
      - {text: "Utiliser `strconv.MustAtoi`, qui panique sur une saisie invalide", correct: false}
      - {text: "Garder `_`, puis vérifier que `q` n'est pas nil avant de l'utiliser", correct: false}
    answer: |-
      ```go
      q, err := strconv.Atoi(r.FormValue("quantite"))
      if err != nil || q <= 0 {
      	http.Error(w, "quantité invalide", http.StatusBadRequest)
      	return
      }
      ```
      L'erreur ignorée transformait une saisie invalide en 0 ; on la traite et l'on répond 400. `ParseFloat` ne lit pas non plus la virgule, et un `int` ne vaut jamais nil.
  - key: bug-taille
    format: bug-fix
    question: |-
      Un identifiant de 12 chiffres est refusé sur une machine 32 bits. Quelle correction est la bonne ?
      ```go
      id, err := strconv.Atoi(s)
      ```
    choices:
      - {text: "`strconv.ParseInt(s, 10, 64)`, qui lit 64 bits sur toute plateforme", correct: true}
      - {text: "`strconv.Atoi(s)`, suivi d'une conversion `int64(id)` du résultat", correct: false}
      - {text: "`strconv.ParseInt(s, 10, 32)`, la taille native de la machine", correct: false}
      - {text: "`strconv.ParseUint(s, 10, 0)`, qui choisit lui-même la bonne taille", correct: false}
    answer: |-
      ```go
      id, err := strconv.ParseInt(s, 10, 64)
      ```
      `Atoi` produit un `int`, de 32 bits sur cette plateforme ; `ParseInt` avec 64 bits fixe la taille. Convertir après coup ne sert à rien : `Atoi` a déjà échoué, et une taille 0 veut dire celle d'un `int`.
  - key: bug-sprint
    format: bug-fix
    question: |-
      En revue, ton collègue a écrit cette conversion. Quelle version est la plus directe ?
      ```go
      cle := fmt.Sprintf("%d", id)
      ```
    choices:
      - {text: "`cle := strconv.Itoa(id)`", correct: true}
      - {text: "`cle := string(id)`", correct: false}
      - {text: "`cle := fmt.Sprintf(\"%v\", id)`", correct: false}
      - {text: "`cle := string(rune(id))`", correct: false}
    answer: |-
      ```go
      cle := strconv.Itoa(id)
      ```
      `Sprintf` passe par la réflexion et l'analyse du format ; `strconv.Itoa` fait exactement la conversion voulue. `string(id)` et `string(rune(id))` donneraient un caractère, pas des chiffres.
  - key: bytes-string-cout
    format: course
    question: Pourquoi convertir sans cesse entre `string` et `[]byte` coûte-t-il cher ?
    choices:
      - {text: "Chaque conversion copie les octets, et alloue le plus souvent", correct: true}
      - {text: "Chaque conversion revalide l'UTF-8 et remplace les octets invalides", correct: false}
      - {text: "Chaque conversion passe par la réflexion pour connaître le type", correct: false}
      - {text: "Chaque conversion verrouille la chaîne contre les autres goroutines", correct: false}
    answer: "Une chaîne est immuable et un `[]byte` modifiable : la conversion doit copier (le compilateur l'évite dans quelques cas, comme une clé de map). On choisit un type et l'on s'y tient, ou l'on utilise les fonctions jumelles de `strings` et `bytes` ; aucune validation UTF-8 n'a lieu."
