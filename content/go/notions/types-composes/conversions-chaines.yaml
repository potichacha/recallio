notion: conversions-chaines
cards:
  - key: vaut-string-rune-65
    format: course
    question: Que vaut string(rune(65)) ?
    answer: '"A" ; pour "65" il faut strconv.Itoa.'
  - key: code-str-hello-bs-byte-str
    format: code-output
    question: '`str := "hello"; bs := []byte(str); bs[0] = ''H''; fmt.Println(str, string(bs))`'
    answer: '`hello Hello` : la conversion copie les octets, la chaîne est immuable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstr := \"hello\"\n\tbs := []byte(str)\n\tbs[0] = 'H'\n\tfmt.Println(str, string(bs))\n}\n"
      output: hello Hello
  - key: code-fmt-println-string-rune-65
    format: code-output
    question: '`fmt.Println(string(rune(65)), fmt.Sprint(65))`'
    answer: '`A 65` : convertir un entier en string donne le caractère correspondant, pas le texte du nombre.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(string(rune(65)), fmt.Sprint(65))\n}\n"
      output: A 65
