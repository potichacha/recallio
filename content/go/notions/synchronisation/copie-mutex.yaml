notion: copie-mutex
cards:
  - key: copier-struct-contenant-sync-mutex
    format: course
    question: Pourquoi ne pas copier une struct contenant un sync.Mutex ?
    answer: La copie duplique l'état du verrou ; go vet (copylocks) le signale.
  - key: linter-signale-copylocks-struct-cache-grave
    format: scenario
    question: Le linter signale 'copylocks' sur ta struct de cache. Pourquoi est-ce grave ?
    answer: |-
      Ma struct contient un `sync.Mutex` et je la passe ou la retourne par valeur, ou une de ses méthodes a un receveur valeur. Chaque copie a son propre état de verrou : deux goroutines peuvent alors 'verrouiller' deux copies différentes et accéder en même temps aux mêmes données sous-jacentes (la map, partagée par référence). La protection est perdue sans aucune erreur visible.
      Correction : receveurs pointeurs pour toutes les méthodes, construction par une fonction `New...` qui renvoie un `*Cache`, et jamais de copie de la struct. On peut aussi y ajouter un champ `noCopy` (convention utilisée par la bibliothèque standard) pour que vet le détecte encore mieux.
  - key: copier-mutex
    format: course
    question: Peut-on copier un Mutex ?
    answer: 'Non après usage : la copie duplique l''état ; go vet le signale.'
