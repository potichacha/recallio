notion: cond
lesson: "**`sync.Cond`** permet à des goroutines d'**attendre qu'une condition devienne vraie**, et à une autre de les\n**réveiller** quand l'état change. Elle s'utilise toujours avec un verrou.\n\n```go\ntype File struct {\n\tmu       sync.Mutex\n\tnonVide  *sync.Cond\n\telements []int\n}\n\nfunc NouvelleFile() *File {\n\tf := &File{}\n\tf.nonVide = sync.NewCond(&f.mu)\n\treturn f\n}\n\nfunc (f *File) Retirer() int {\n\tf.mu.Lock()\n\tdefer f.mu.Unlock()\n\tfor len(f.elements) == 0 { // une boucle, pas un if\n\t\tf.nonVide.Wait()          // relâche le verrou, dort, le reprend au réveil\n\t}\n\te := f.elements[0]\n\tf.elements = f.elements[1:]\n\treturn e\n}\n\nfunc (f *File) Ajouter(e int) {\n\tf.mu.Lock()\n\tf.elements = append(f.elements, e)\n\tf.mu.Unlock()\n\tf.nonVide.Signal() // réveille une goroutine en attente\n}\n```\n\nLes règles :\n- `Wait` **relâche** le verrou pendant l'attente et le **reprend** avant de rendre la main ;\n- on attend **toujours dans une boucle** `for !condition { c.Wait() }` : au réveil, une autre goroutine a pu\n  consommer l'état, et la condition peut être fausse de nouveau ;\n- **`Signal`** réveille une goroutine, **`Broadcast`** les réveille toutes (quand l'état intéresse tout le monde,\n  comme un arrêt) ;\n- `Wait` **ne connaît pas les contextes** : pas d'attente avec délai ni d'annulation, c'est sa grande limite.\n\nEn pratique, un **channel** exprime presque toujours mieux l'attente (avec `select`, délai et annulation). sync.Cond\nreste utile pour réveiller **de nombreuses goroutines plusieurs fois** sur un état partagé.\n\n**En entretien** : « Wait dans une boucle sous verrou ; Signal pour un, Broadcast pour tous ; pas de contexte ; un\nchannel convient mieux dans la plupart des cas. »"
cards:
  - key: wait
    format: course
    question: "Que fait `c.Wait()` sur une `sync.Cond` ?"
    choices:
      - {text: "Il relâche le verrou, endort la goroutine jusqu'au réveil, puis reprend le verrou", correct: true}
      - {text: "Il garde le verrou pendant l'attente, pour que personne ne change l'état entre-temps", correct: false}
      - {text: "Il attend que la condition devienne vraie, en la testant lui-même en boucle", correct: false}
      - {text: "Il endort la goroutine pour une durée fixe, puis rend la main sans le verrou", correct: false}
    answer: "Il relâche le verrou associé, endort la goroutine jusqu'à un `Signal` ou un `Broadcast`, puis reprend le verrou avant de rendre la main. Il ne connaît pas la condition : c'est à l'appelant de la revérifier."
  - key: boucle
    format: course
    question: "Pourquoi attendre une `sync.Cond` dans une boucle `for` plutôt qu'avec un `if` ?"
    choices:
      - {text: "Au réveil, la condition a pu redevenir fausse : il faut la revérifier avant d'agir", correct: true}
      - {text: "Un `if` ne compile pas avec `Wait`, qui doit toujours être appelé dans un `for`", correct: false}
      - {text: "La boucle relance `Wait` s'il a expiré, car il rend la main au bout d'un délai", correct: false}
      - {text: "La boucle évite de reprendre le verrou, que `Wait` rend libéré au réveil", correct: false}
    answer: "Au réveil, une autre goroutine a pu consommer l'état ou le modifier : la condition peut être fausse de nouveau. `Wait` n'a pas de délai ; la boucle sert à revérifier, pas à réessayer."
  - key: signal-broadcast
    format: course
    question: "Quelle différence entre `Signal` et `Broadcast` sur une `sync.Cond` ?"
    choices:
      - {text: "`Signal` réveille une goroutine en attente, `Broadcast` les réveille toutes", correct: true}
      - {text: "`Signal` réveille toutes les goroutines, `Broadcast` en réveille une au hasard", correct: false}
      - {text: "`Signal` libère le verrou associé, `Broadcast` réveille les goroutines en attente", correct: false}
      - {text: "`Signal` se mémorise jusqu'au prochain `Wait`, `Broadcast` se perd sans attente", correct: false}
    answer: "`Signal` réveille une seule goroutine en attente ; `Broadcast` les réveille toutes, quand l'état intéresse tout le monde (un arrêt, beaucoup de ressources libérées). Ni l'un ni l'autre ne se mémorise : sans goroutine en attente, il est perdu."
  - key: limite
    format: course
    question: "Quelle est la principale limite de `sync.Cond` ?"
    choices:
      - {text: "`Wait` ne prend pas de contexte : ni délai ni annulation possibles", correct: true}
      - {text: "Elle ne réveille qu'une goroutine à la fois, faute de diffusion", correct: false}
      - {text: "Elle ne marche qu'avec un `sync.RWMutex`, jamais avec un `sync.Mutex`", correct: false}
      - {text: "Elle lance une goroutine par appel à `Wait`, ce qui coûte cher en mémoire", correct: false}
    answer: "`Wait` ne prend pas de contexte : impossible d'attendre avec un délai ou d'être annulé. Un channel avec `select` est presque toujours préférable pour cette raison."
  - key: vf-verrou
    format: true-false
    question: Il faut détenir le verrou de la Cond avant d'appeler Wait.
    truth: true
    answer: Wait le relâche pendant l'attente et le reprend au réveil.
  - key: vf-signal-verrou
    format: true-false
    question: Signal et Broadcast doivent obligatoirement être appelés en détenant le verrou.
    truth: false
    answer: C'est permis mais pas obligatoire ; seul l'état doit être modifié sous verrou.
  - key: vf-contexte
    format: true-false
    question: '`c.Wait()` rend la main quand le contexte de la requête est annulé.'
    truth: false
    answer: Il ne connaît pas les contextes.
  - key: vf-memoire
    format: true-false
    question: Un Signal envoyé quand personne n'attend est mémorisé pour la prochaine goroutine qui appellera Wait.
    truth: false
    answer: Il est perdu ; c'est l'état protégé, revérifié dans la boucle, qui porte l'information.
  - key: qcm-usage
    format: multiple-choice
    question: "Laquelle de ces façons d'attendre une `sync.Cond` est correcte ?"
    choices:
      - {text: "`for !pret { c.Wait() }`, sous le verrou", correct: true}
      - {text: "`if !pret { c.Wait() }`, sous le verrou", correct: false}
      - {text: "`for !pret { c.Wait() }`, sans détenir le verrou", correct: false}
      - {text: "`c.Wait()` seul, sous le verrou, sans tester `pret`", correct: false}
    answer: "On attend sous le verrou, dans une boucle qui revérifie la condition au réveil. Un `if` ne la revérifie pas, et `Wait` sans le verrou panique en le relâchant. Côté producteur, on modifie l'état sous le verrou avant `Broadcast`."
  - key: qcm-alternative
    format: multiple-choice
    question: "Par quoi remplace-t-on le plus souvent une `sync.Cond` ?"
    choices:
      - {text: "Un channel, avec `select` pour le délai et l'annulation", correct: true}
      - {text: "Une boucle active qui teste l'état sans jamais dormir", correct: false}
      - {text: "Un `time.Sleep` entre deux vérifications de l'état", correct: false}
      - {text: "Un `sync.WaitGroup` dont chaque attente rappelle `Add`", correct: false}
    answer: "Un channel accepte un délai et une annulation par `select`, et sa fermeture réveille tout le monde une fois. Une boucle active ou des sommeils gaspillent le processeur et ajoutent de la latence."
  - key: qcm-broadcast
    format: multiple-choice
    question: "Quand faut-il préférer `Broadcast` à `Signal` ?"
    choices:
      - {text: "Quand toutes les goroutines en attente doivent voir le changement, comme un arrêt", correct: true}
      - {text: "Quand on veut réveiller exactement une goroutine parmi celles qui attendent", correct: false}
      - {text: "Jamais : `Signal` suffit toujours, et `Broadcast` coûte bien plus cher", correct: false}
      - {text: "Quand aucune goroutine n'attend encore, pour que le signal soit gardé", correct: false}
    answer: "Un arrêt intéresse toutes les goroutines : `Broadcast`. Il le faut aussi quand elles attendent des conditions différentes sur la même Cond, car `Signal` pourrait réveiller la mauvaise."
  - key: qcm-newcond
    format: multiple-choice
    question: Comment crée-t-on une sync.Cond ?
    choices:
      - {text: "`sync.NewCond(&mu)`, avec le verrou qui protège l'état", correct: true}
      - {text: "`sync.Cond{}`, sans verrou, qui en crée un tout seul", correct: false}
      - {text: "`make(sync.Cond)`, comme pour un channel ou une map", correct: false}
      - {text: "`new(sync.Cond).Lock()`, qui crée et verrouille d'un coup", correct: false}
    answer: La Cond garde le verrou dans son champ L.
  - key: scenario-remplacer
    format: scenario
    question: "En revue, tu trouves une file bloquante écrite avec `sync.Cond`. Que proposes-tu ?"
    choices:
      - {text: "Un channel bufferisé, qui fait la même chose et accepte un délai ou un contexte par `select`", correct: true}
      - {text: "Garder la `Cond`, mais remplacer chaque `Signal` par un `Broadcast` pour plus de sûreté", correct: false}
      - {text: "Un slice sous mutex, avec un `time.Sleep` court entre deux vérifications de la file", correct: false}
      - {text: "Une `sync.Map` des éléments en attente, que les consommateurs parcourent avec `Range`", correct: false}
    answer: "Si la file a une capacité connue, un channel bufferisé fait la même chose en une ligne, avec `select` pour un délai ou l'annulation, ce que `Cond` ne permet pas. Je garde `Cond` seulement pour réveiller souvent de nombreuses goroutines sur un état complexe."
  - key: scenario-arret
    format: scenario
    question: "Des goroutines attendent une `sync.Cond`, et le service doit s'arrêter. Comment les réveilles-tu ?"
    choices:
      - {text: "Je passe `ferme` à true sous verrou, j'appelle `Broadcast`, et la boucle d'attente teste `ferme`", correct: true}
      - {text: "J'appelle `Signal` autant de fois qu'il y a de goroutines, sans changer l'état partagé", correct: false}
      - {text: "J'appelle `Broadcast` sans toucher à l'état : les goroutines réveillées sortent d'elles-mêmes", correct: false}
      - {text: "Je libère le verrou associé à la `Cond`, ce qui fait paniquer et sortir chaque `Wait`", correct: false}
    answer: "Le drapeau `ferme`, posé sous verrou, puis `Broadcast` : toutes se réveillent, voient `ferme` dans leur condition (`for len(f.elements) == 0 && !f.ferme`) et sortent. Sans ce drapeau dans la condition, elles se rendormiraient."
  - key: scenario-signal-perdu
    format: scenario
    question: "Une goroutine reste bloquée sur `Wait` alors que le producteur a bien appelé `Signal`. Que vérifies-tu ?"
    choices:
      - {text: "Que l'état est modifié sous le verrou et testé dans la boucle, car un `Signal` sans attente se perd", correct: true}
      - {text: "Que le producteur appelle `Signal` avant de modifier l'état, pour réveiller plus tôt", correct: false}
      - {text: "Que la goroutine appelle `Wait` sans verrou, pour ne pas bloquer le producteur", correct: false}
      - {text: "Que le `Signal` est bien mis en file, car il attend toujours le prochain `Wait`", correct: false}
    answer: "Un `Signal` envoyé avant que la goroutine n'attende est perdu ; seul l'état, modifié sous le verrou et testé dans la boucle, peut la faire passer. Si plusieurs conditions partagent la même Cond, `Signal` a pu réveiller une autre goroutine : il faut `Broadcast` ou une Cond par condition."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande d'expliquer `sync.Cond` et quand tu l'utiliserais. Que réponds-tu ?"
    choices:
      - {text: "Une attente sous verrou, en boucle, qu'un état devienne vrai ; rare, car un channel accepte un délai", correct: true}
      - {text: "Un verrou réentrant, que la même goroutine peut prendre plusieurs fois sans se bloquer", correct: false}
      - {text: "Un compteur de goroutines à attendre, que l'on utilise à la place d'un `WaitGroup`", correct: false}
      - {text: "Une file de messages typés, à préférer aux channels quand les messages sont nombreux", correct: false}
    answer: "C'est une variable de condition : on attend sous verrou, dans une boucle, qu'un état devienne vrai ; `Signal` réveille une goroutine, `Broadcast` toutes. Je l'utilise rarement : un channel exprime mieux la plupart des attentes et accepte un délai ou un contexte."
