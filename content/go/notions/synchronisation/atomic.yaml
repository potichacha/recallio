    answer: Add ajoute de façon atomique.
  - key: trous-load
    format: fill-in
    question: |-
      Complète pour lire la valeur :
      ```go
      n := requetes.___()
      ```
    blanks:
      - - Load
    answer: Load lit de façon atomique.
  - key: trous-pointer
    format: fill-in
    question: |-
      Complète pour publier une configuration :
      ```go
      var config atomic.___[Config]
      config.Store(&Config{Delai: time.Second})
      ```
    blanks:
      - - Pointer
    answer: atomic.Pointer, générique depuis Go 1.19.
  - key: trous-cas
    format: fill-in
    question: |-
      Complète pour garder le maximum :
      ```go
      for {
      	ancien := max.Load()
      	if v <= ancien || max.___(ancien, v) {
      		break
      	}
      }
      ```
    blanks:
      - - CompareAndSwap
    answer: CAS dans une boucle.
  - key: code-swap
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var x atomic.Int32
      x.Store(5)
      ancien := x.Swap(9)
      fmt.Println(ancien, x.Load())
      ```
    choices:
      - {text: "`5 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`9 5`", correct: false}
      - {text: "`0 9`", correct: false}
    answer: "`5 9` : `Swap` écrit la nouvelle valeur et renvoie l'ancienne."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar x atomic.Int32\n\tx.Store(5)\n\tancien := x.Swap(9)\n\tfmt.Println(ancien, x.Load())\n}\n"
      output: 5 9
  - key: code-cas
