notion: atomic
cards:
  - key: preferer-atomic-int64-atomic-addint64
    format: course
    question: Pourquoi préférer atomic.Int64 à atomic.AddInt64 ?
    answer: Le type empêche les accès non atomiques accidentels et gère l'alignement.
  - key: partager-configuration-rechargee-chaud
    format: course
    question: Comment partager une configuration rechargée à chaud ?
    answer: atomic.Pointer[Config] vers une copie immuable remplacée en bloc.
