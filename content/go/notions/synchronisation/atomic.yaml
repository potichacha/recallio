  - key: bug-load-add
    format: bug-fix
    question: |-
      Le quota est parfois dépassé quand les requêtes arrivent en même temps :
      ```go
      if utilises.Load() < quota {
      	utilises.Add(1)
      	traiter()
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Réserver d'abord avec `Add(1)`, et rendre la place avec `Add(-1)` si le quota est dépassé", correct: true}
      - {text: "Appeler `traiter()` avant `utilises.Add(1)`, pour raccourcir la fenêtre entre test et ajout", correct: false}
      - {text: "Passer le compteur en `atomic.Int32`, dont les opérations sont plus rapides et plus sûres", correct: false}
      - {text: "Entourer seulement `utilises.Add(1)` d'un `sync.Mutex`, en gardant le test hors du verrou", correct: false}
    answer: |-
      ```go
      if utilises.Add(1) <= quota {
      	traiter()
      } else {
      	utilises.Add(-1)
      }
      ```
      Entre `Load` et `Add`, d'autres goroutines passaient le même test : la vérification et l'ajout n'étaient pas atomiques ensemble. `Add` renvoie la nouvelle valeur, qui dit à elle seule si la place existe (une boucle `CompareAndSwap` marche aussi).
  - key: bug-deux-champs
    format: bug-fix
    question: |-
      La moyenne affichée est parfois incohérente :
      ```go
      type Stats struct {
      	total atomic.Int64
      	nb    atomic.Int64
      }

      func (s *Stats) Ajouter(v int64) { s.total.Add(v); s.nb.Add(1) }
      func (s *Stats) Moyenne() int64  { return s.total.Load() / s.nb.Load() }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `sync.Mutex` qui protège `total` et `nb` ensemble, avec un cas pour `nb == 0`", correct: true}
      - {text: "Lire `nb` avant `total` dans `Moyenne`, pour suivre l'ordre inverse d'`Ajouter`", correct: false}
      - {text: "Remplacer les deux `atomic.Int64` par des `atomic.Int32`, mis à jour plus vite", correct: false}
      - {text: "Inverser les deux `Add` dans `Ajouter`, pour compter l'élément avant sa valeur", correct: false}
    answer: |-
      ```go
      type Stats struct {
      	mu    sync.Mutex
      	total int64
      	nb    int64
      }

      func (s *Stats) Ajouter(v int64) {
      	s.mu.Lock()
      	defer s.mu.Unlock()
      	s.total += v
      	s.nb++
      }

      func (s *Stats) Moyenne() int64 {
      	s.mu.Lock()
      	defer s.mu.Unlock()
      	if s.nb == 0 {
      		return 0
      	}
      	return s.total / s.nb
      }
      ```
      Chaque champ était atomique, mais pas le couple : `Moyenne` pouvait lire un total à jour et un nombre ancien. Changer l'ordre des accès ne crée pas d'atomicité ; un mutex garde l'invariant, et la division par zéro est traitée.
  - key: bug-melange
    format: bug-fix
    question: |-
      Le détecteur de courses signale une course malgré l'atomique :
      ```go
      var n int64
      go func() { atomic.AddInt64(&n, 1) }()
      fmt.Println(n)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer `n` en `atomic.Int64`, avec `n.Add(1)` et `n.Load()`", correct: true}
      - {text: "Déclarer `n` `volatile`, comme en Java, pour rendre sa lecture visible", correct: false}
      - {text: "Ajouter un `time.Sleep` avant l'affichage, pour laisser finir la goroutine", correct: false}
      - {text: "Passer `n` en `int32`, dont les accès sont atomiques sur tous les processeurs", correct: false}
    answer: |-
      ```go
      var n atomic.Int64
      go func() { n.Add(1) }()
      fmt.Println(n.Load())
      ```
      La lecture directe de `n` n'était pas atomique : un seul accès ordinaire suffit à faire une course. Le type `atomic.Int64` interdit ce mélange ; un `Sleep` ne synchronise rien, et Go n'a pas de `volatile`.
  - key: bug-config
    format: bug-fix
    question: |-
      Des requêtes voient une configuration à moitié rechargée :
      ```go
      c := config.Load()
      c.Delai = nouveau.Delai
      c.Hote = nouveau.Hote
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Construire une nouvelle `Config` complète et la publier d'un coup avec `Store`", correct: true}
      - {text: "Modifier `Hote` avant `Delai`, pour que le champ le plus lu change en dernier", correct: false}
      - {text: "Appeler `config.Load()` une seconde fois après les affectations, pour les publier", correct: false}
      - {text: "Remplacer `atomic.Pointer` par `atomic.Value`, qui copie la struct à la lecture", correct: false}
    answer: |-
      ```go
      config.Store(&Config{Delai: nouveau.Delai, Hote: nouveau.Hote})
      ```
      Le code modifiait la valeur publiée pendant que les lecteurs la lisaient : une course, et un état mélangé. On ne touche jamais à la valeur publiée ; on en construit une nouvelle, complète, et `Store` la remplace en bloc.
