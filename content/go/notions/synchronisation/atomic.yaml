notion: atomic
lesson: "Le package **`sync/atomic`** fournit des opérations **indivisibles** sur des valeurs simples, sans verrou : aucune\ngoroutine ne voit une opération à moitié faite.\n\nDepuis Go 1.19, on utilise les **types** (plus sûrs que les fonctions `atomic.AddInt64(&x, 1)`, car on ne peut pas\naccéder à la valeur sans passer par eux, et ils sont bien alignés) :\n\n```go\nvar requetes atomic.Int64\nrequetes.Add(1)\nn := requetes.Load()\n\nvar pret atomic.Bool\npret.Store(true)\n\nvar config atomic.Pointer[Config] // publier une configuration immuable\nconfig.Store(&Config{Delai: time.Second})\ndelai := config.Load().Delai\n```\n\nLes opérations :\n- **`Load`**, **`Store`** : lire et écrire ;\n- **`Add`** : ajouter et renvoyer la nouvelle valeur ;\n- **`Swap`** : écrire et renvoyer l'ancienne valeur ;\n- **`CompareAndSwap(ancien, nouveau)`** (CAS) : écrire seulement si la valeur vaut toujours `ancien`, et dire si cela\n  a réussi. C'est la base des algorithmes sans verrou, en boucle :\n\n```go\nfor {\n\tancien := maximum.Load()\n\tif v <= ancien || maximum.CompareAndSwap(ancien, v) {\n\t\tbreak\n\t}\n}\n```\n\nTypes disponibles : `Int32`, `Int64`, `Uint32`, `Uint64`, `Uintptr`, `Bool`, `Pointer[T]`, `Value` (n'importe quel type,\nmais toujours le même).\n\nLa limite : une opération atomique protège **une** valeur. Deux atomiques modifiés « ensemble » ne le sont pas\nensemble : dès qu'un invariant porte sur plusieurs champs, il faut un mutex.\n\n**En entretien** : « Pour un compteur, un drapeau ou un pointeur publié : atomic.Int64, Bool, Pointer ; CAS en boucle\npour une mise à jour conditionnelle ; un mutex dès que plusieurs valeurs doivent rester cohérentes. »"
cards:
  - key: preferer-atomic-int64-atomic-addint64
    format: course
    question: "Pourquoi préférer le type `atomic.Int64` à la fonction `atomic.AddInt64` ?"
    choices:
      - {text: "Le type interdit tout accès non atomique à la valeur et garantit son alignement", correct: true}
      - {text: "Le type est plus rapide, car il évite toute barrière mémoire à la lecture", correct: false}
      - {text: "La fonction `atomic.AddInt64` est dépréciée et retirée depuis Go 1.19", correct: false}
      - {text: "Le type protège aussi les autres champs de la struct, comme un mutex", correct: false}
    answer: "Avec le type, la valeur ne se lit et ne s'écrit que par ses méthodes : impossible de la lire directement par mégarde, et l'alignement sur 64 bits est garanti même en 32 bits. Les fonctions comme `atomic.AddInt64` existent toujours, mais n'empêchent pas ce mélange."
  - key: partager-configuration-rechargee-chaud
    format: course
    question: "Comment partager entre goroutines une configuration rechargée à chaud ?"
    choices:
      - {text: "Un `atomic.Pointer[Config]` vers une copie immuable, remplacée en bloc", correct: true}
      - {text: "Un `atomic.Int64` par champ de la configuration, mis à jour un par un", correct: false}
      - {text: "Une variable globale `Config`, modifiée champ par champ sans verrou", correct: false}
      - {text: "Un `sync.Once` qui recharge la configuration à chaque changement", correct: false}
    answer: "On construit une nouvelle `Config` complète, puis on publie son adresse d'un coup avec `Store` : chaque lecteur voit l'ancienne ou la nouvelle, jamais un mélange. Un atomique par champ laisserait voir un état à moitié mis à jour."
  - key: cas
    format: course
    question: "Que fait `CompareAndSwap(ancien, nouveau)` sur un `atomic.Int64` ?"
    choices:
      - {text: "Il écrit `nouveau` seulement si la valeur vaut encore `ancien`, et dit s'il l'a fait", correct: true}
      - {text: "Il échange les deux valeurs et renvoie celle qui était stockée avant l'appel", correct: false}
      - {text: "Il écrit `nouveau` dans tous les cas, puis dit si la valeur valait `ancien`", correct: false}
      - {text: "Il bloque jusqu'à ce que la valeur vaille `ancien`, puis écrit `nouveau`", correct: false}
    answer: "Il écrit `nouveau` seulement si la valeur vaut encore `ancien`, de façon atomique, et renvoie true si l'écriture a eu lieu ; on le met dans une boucle qui recommence en cas d'échec. Il ne bloque jamais."
  - key: limite
    format: course
    question: "Quand un atomique ne suffit-il plus, au point qu'il faut un mutex ?"
    choices:
      - {text: "Quand un invariant lie plusieurs valeurs, comme un total et un nombre d'éléments", correct: true}
      - {text: "Quand la valeur dépasse 32 bits, les atomiques ne gérant que les `int32`", correct: false}
      - {text: "Quand beaucoup de goroutines lisent la valeur, bien plus qu'elles ne l'écrivent", correct: false}
      - {text: "Quand la valeur est un pointeur, que les atomiques ne savent pas publier", correct: false}
    answer: "Quand un invariant porte sur plusieurs valeurs (un total et un nombre d'éléments, deux champs liés) : chaque opération est atomique, mais pas leur combinaison ; il faut un mutex."
  - key: vf-types
    format: true-false
    question: Depuis Go 1.19, on préfère `atomic.Int64` aux fonctions comme `atomic.AddInt64`.
    truth: true
    answer: Le type empêche les accès non atomiques et garantit l'alignement.
  - key: vf-deux
    format: true-false
    question: Deux opérations atomiques successives sur deux variables forment une opération atomique.
    truth: false
    answer: Une autre goroutine peut s'intercaler entre les deux.
  - key: vf-add
    format: true-false
    question: '`Add` renvoie la nouvelle valeur.'
    truth: true
    answer: Ce qui évite un Load séparé, qui ne serait plus cohérent.
  - key: vf-value
    format: true-false
    question: Un atomic.Value peut stocker un int puis une string.
    truth: false
    answer: Tous les Store doivent avoir le même type concret, sinon il panique.
  - key: qcm-usages
    format: multiple-choice
    question: "Pour lequel de ces besoins un atomique ne suffit-il pas ?"
    choices:
      - {text: "Mettre à jour un solde et son historique ensemble", correct: true}
      - {text: "Compter les requêtes reçues par le serveur", correct: false}
      - {text: "Un drapeau « en cours d'arrêt » lu par les workers", correct: false}
      - {text: "Publier une configuration immuable rechargée à chaud", correct: false}
    answer: "Le solde et l'historique sont deux valeurs liées : chaque opération atomique est sûre, mais pas leur combinaison, il faut un mutex. Un compteur, un drapeau ou une configuration immuable sont une seule valeur, faite pour un atomique."
  - key: qcm-operations
    format: multiple-choice
    question: "Laquelle de ces paires de méthodes n'existe pas sur `atomic.Int64` ?"
    choices:
      - {text: "`Lock` et `Unlock`", correct: true}
      - {text: "`Load` et `Store`", correct: false}
      - {text: "`Swap` et `CompareAndSwap`", correct: false}
      - {text: "`And` et `Or`", correct: false}
    answer: "`atomic.Int64` offre `Load`, `Store`, `Add`, `Swap`, `CompareAndSwap` et, depuis Go 1.23, `And` et `Or`. `Lock` et `Unlock` sont les méthodes d'un mutex : un atomique ne verrouille rien."
  - key: qcm-config
    format: multiple-choice
    question: Comment publier une nouvelle configuration lue par toutes les requêtes ?
    choices:
      - {text: "Construire une nouvelle Config, puis la publier avec `Store` sur un `atomic.Pointer[Config]`", correct: true}
      - {text: "Modifier un à un les champs de la Config publiée, derrière son `atomic.Pointer`", correct: false}
      - {text: "Remplacer la variable globale Config sans synchronisation, l'écriture étant rapide", correct: false}
      - {text: "Ranger chaque champ de la Config dans son propre `atomic.Int64`, mis à jour à part", correct: false}
    answer: 'La Config publiée ne doit plus être modifiée : les lecteurs voient toujours un état complet.'
  - key: qcm-cas
    format: multiple-choice
    question: Pourquoi écrire CompareAndSwap dans une boucle ?
    choices:
      - {text: "Il échoue si une autre goroutine a modifié la valeur entre-temps, et il faut recommencer", correct: true}
      - {text: "Il échoue parfois sans raison sur certains processeurs, et il faut alors réessayer", correct: false}
      - {text: "Pour attendre activement qu'une autre goroutine libère le verrou qu'elle détient", correct: false}
      - {text: "Le compilateur l'exige : un CompareAndSwap hors d'une boucle ne compile pas", correct: false}
    answer: L'échec signale un conflit ; on relit la valeur et l'on recalcule.
  - key: trous-add
