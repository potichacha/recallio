  - key: code-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var max atomic.Int64
      var wg sync.WaitGroup
      for _, v := range []int64{3, 42, 7, 19, 8} {
      	wg.Go(func() {
      		for {
      			ancien := max.Load()
      			if v <= ancien || max.CompareAndSwap(ancien, v) {
      				return
      			}
      		}
      	})
      }
      wg.Wait()
      fmt.Println(max.Load())
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`19`", correct: false}
      - {text: "Un nombre variable, selon l'ordre des goroutines", correct: false}
    answer: "`42` : la boucle CAS garde le plus grand, quel que soit l'ordre ; un CAS qui échoue relit la valeur et recommence."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar max atomic.Int64\n\tvar wg sync.WaitGroup\n\tfor _, v := range []int64{3, 42, 7, 19, 8} {\n\t\twg.Go(func() {\n\t\t\tfor {\n\t\t\t\tancien := max.Load()\n\t\t\t\tif v <= ancien || max.CompareAndSwap(ancien, v) {\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\t}\n\twg.Wait()\n\tfmt.Println(max.Load())\n}\n"
      output: '42'
