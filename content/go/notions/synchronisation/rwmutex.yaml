notion: rwmutex
lesson: "Un **`sync.RWMutex`** distingue deux sortes d'accès :\n- **`RLock` / `RUnlock`** : plusieurs **lecteurs** à la fois ;\n- **`Lock` / `Unlock`** : un seul **écrivain**, et aucun lecteur pendant qu'il écrit.\n\n```go\ntype Config struct {\n\tmu      sync.RWMutex\n\tvaleurs map[string]string\n}\n\nfunc (c *Config) Lire(cle string) (string, bool) {\n\tc.mu.RLock()\n\tdefer c.mu.RUnlock()\n\tv, ok := c.valeurs[cle]\n\treturn v, ok\n}\n\nfunc (c *Config) Ecrire(cle, v string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.valeurs[cle] = v\n}\n```\n\nCe qu'il faut savoir :\n- il n'apporte un gain que si les lectures sont **nettement majoritaires** et durent un peu : un RWMutex coûte plus\n  cher qu'un Mutex à chaque opération ;\n- un écrivain qui attend **bloque les nouveaux lecteurs** (pour ne pas être affamé) : prendre deux `RLock` imbriqués\n  dans la même goroutine peut donc se bloquer si un écrivain arrive entre les deux ;\n- on ne peut pas **passer** d'un verrou de lecture à un verrou d'écriture : il faut relâcher le `RLock`, prendre le\n  `Lock`, puis **revérifier** l'état, qui a pu changer entre-temps ;\n- une lecture qui **modifie** quelque chose (un LRU qui déplace l'élément lu, un compteur de lectures) a besoin du\n  verrou d'écriture.\n\n**En entretien** : « RLock pour plusieurs lecteurs, Lock pour un écrivain ; utile seulement si les lectures dominent ;\npas de promotion de RLock vers Lock ; un écrivain en attente bloque les nouveaux lecteurs. »"
cards:
  - key: mutex-vs-rwmutex
    format: course
    question: "Quelle différence entre `sync.Mutex` et `sync.RWMutex` ?"
    choices:
      - {text: "Le RWMutex laisse passer plusieurs lecteurs ensemble, ou un seul écrivain", correct: true}
      - {text: "Le RWMutex est toujours plus rapide, et remplace le Mutex dans tous les cas", correct: false}
      - {text: "Le RWMutex laisse passer plusieurs écrivains ensemble, ou un seul lecteur", correct: false}
      - {text: "Le RWMutex est réentrant, contrairement au Mutex qui bloque au second `Lock`", correct: false}
    answer: "Un Mutex donne un accès exclusif ; un RWMutex laisse plusieurs lecteurs simultanés ou un seul écrivain. Il coûte plus par opération : on ne le prend que si les lectures dominent nettement."
  - key: lru-utilise-mutex-rwmutex
    format: course
    question: "Pourquoi un cache LRU utilise-t-il un `Mutex` et pas un `RWMutex` ?"
    choices:
      - {text: "`Get` modifie l'ordre d'usage : c'est une écriture, qui demande un verrou exclusif", correct: true}
      - {text: "Un `RWMutex` ne sait pas protéger une liste chaînée, seulement une map", correct: false}
      - {text: "Un LRU n'a que des écritures, car on n'y lit jamais deux fois la même valeur", correct: false}
      - {text: "Un `RWMutex` ne marche pas avec des types génériques comme `LRU[K, V]`", correct: false}
    answer: "`Get` déplace l'entrée en tête de la liste d'usage : c'est une écriture. Sous un `RLock`, deux lecteurs modifieraient la liste en même temps ; il faut un verrou exclusif, donc un simple Mutex."
  - key: promotion
    format: course
    question: Comment passer d'un verrou de lecture à un verrou d'écriture avec un RWMutex ?
    choices:
      - {text: "On ne peut pas : on relâche le `RLock`, on prend le `Lock`, puis on revérifie l'état", correct: true}
      - {text: "On appelle `Lock` sous le `RLock` : le RWMutex promeut le verrou de lecture", correct: false}
      - {text: "On appelle `RUnlock` puis `Lock`, et l'état lu sous le `RLock` reste valable", correct: false}
      - {text: "On appelle `Upgrade()` sur le RWMutex, qui attend la fin des autres lecteurs", correct: false}
    answer: "On ne peut pas le promouvoir : un `Lock` sous son propre `RLock` se bloque pour toujours. On relâche le `RLock`, on prend le `Lock`, puis on revérifie l'état, car une autre goroutine a pu le modifier entre-temps."
  - key: ecrivain-attente
    format: course
    question: Que se passe-t-il pour les nouveaux lecteurs quand un écrivain attend un RWMutex ?
    choices:
      - {text: "Ils sont bloqués jusqu'au passage de l'écrivain, pour qu'il ne soit pas affamé", correct: true}
      - {text: "Ils passent avant l'écrivain, qui attend que plus aucun lecteur n'arrive", correct: false}
      - {text: "Ils passent en même temps que l'écrivain, qui n'exclut que les autres écrivains", correct: false}
      - {text: "Ils échouent aussitôt, comme un `TryRLock` qui renverrait toujours false", correct: false}
    answer: "Ils sont bloqués jusqu'à ce que l'écrivain soit passé, pour qu'un flux continu de lecteurs ne l'affame pas. Conséquence : deux `RLock` imbriqués peuvent se bloquer si un écrivain arrive entre les deux."
  - key: vf-lecteurs
    format: true-false
    question: Plusieurs goroutines peuvent détenir le RLock d'un RWMutex en même temps.
    truth: true
    answer: C'est tout son intérêt.
  - key: vf-toujours
    format: true-false
    question: Un RWMutex est toujours plus rapide qu'un Mutex.
    truth: false
    answer: Il coûte plus cher par opération ; il gagne seulement quand les lectures dominent et durent.
  - key: vf-promotion
    format: true-false
    question: Une goroutine qui détient un RLock peut appeler Lock sur le même RWMutex pour passer en écriture.
    truth: false
    answer: 'Lock attend la fin de tous les lecteurs, dont elle-même : blocage.'
  - key: vf-lru
    format: true-false
    question: La lecture d'un cache LRU peut se faire sous RLock.
    truth: false
    answer: 'Lire déplace l''élément en tête de liste : c''est une écriture.'
  - key: qcm-quand
    format: multiple-choice
    question: "Dans lequel de ces cas un `RWMutex` est-il un bon choix ?"
    choices:
      - {text: "Un catalogue lu par des milliers de requêtes, mis à jour rarement", correct: true}
      - {text: "Un compteur incrémenté par chaque requête reçue par le serveur", correct: false}
      - {text: "Une file où chaque opération retire un élément pour le traiter", correct: false}
      - {text: "Un journal en mémoire où chaque requête ajoute sa ligne", correct: false}
    answer: "Les lectures dominent nettement : plusieurs lecteurs passent ensemble, comme pour une configuration lue à chaque requête et modifiée une fois par heure. Quand chaque opération écrit, il n'y a rien à partager entre lecteurs."
  - key: qcm-operations
    format: multiple-choice
    question: "Lesquelles de ces paires d'opérations d'un `RWMutex` vont ensemble ?"
    choices:
      - text: RLock et RUnlock
        correct: true
      - text: Lock et Unlock
        correct: true
      - text: RLock et Unlock
        correct: false
      - text: Lock et RUnlock
        correct: false
    answer: Mélanger les paires provoque une panique « unlock of unlocked mutex » ou un état incohérent.
  - key: qcm-imbriques
    format: multiple-choice
    question: Une fonction prend un RLock puis appelle une autre fonction qui reprend un RLock. Quel risque ?
    choices:
      - text: Un blocage si un écrivain attend entre les deux RLock
        correct: true
      - text: Aucun, les lecteurs sont toujours compatibles
        correct: false
      - text: Une panique immédiate
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: L'écrivain en attente bloque le second RLock, et attend lui-même le premier.
  - key: qcm-alternatives
    format: multiple-choice
    question: "Quelle alternative à un `RWMutex` convient pour une donnée lue très souvent ?"
    choices:
      - {text: "Un `atomic.Pointer` vers une copie immuable, remplacée en entier", correct: true}
      - {text: "Aucune protection, puisque des lectures simultanées sont sûres", correct: false}
      - {text: "Un `sync.WaitGroup` que chaque lecteur attend avant de lire", correct: false}
      - {text: "Un `sync.Once` qui recharge la donnée à chaque modification", correct: false}
    answer: "Les lecteurs font `Load` sans verrou, et l'écrivain publie une nouvelle copie complète avec `Store`. Un découpage en segments, chacun avec son verrou, en est une autre ; sans protection, une seule écriture suffit à faire une course."
  - key: trous-rlock
    format: fill-in
    question: |-
      Complète la lecture :
      ```go
      c.mu.___()
      defer c.mu.___()
      return c.valeurs[cle]
      ```
    blanks:
      - - RLock
      - - RUnlock
    answer: Le verrou de lecture partagé.
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour autoriser plusieurs lecteurs :
      ```go
      type Catalogue struct {
      	mu       sync.___
      	produits map[string]Produit
      }
      ```
    blanks:
      - - RWMutex
    answer: Un RWMutex.
  - key: trous-ecriture
    format: fill-in
    question: |-
      Complète l'écriture :
      ```go
      c.mu.___()
      defer c.mu.Unlock()
      c.valeurs[cle] = v
      ```
    blanks:
      - - Lock
    answer: Le verrou exclusif.
  - key: trous-reverifier
    format: fill-in
    question: |-
      Complète le chargement paresseux :
      ```go
      c.mu.RLock()
      v, ok := c.items[k]
      c.mu.RUnlock()
      if ok {
      	return v
      }
      c.mu.Lock()
      defer c.mu.Unlock()
      if v, ok := c.items[k]; ___ {
      	return v
      }
      v = charger(k)
      c.items[k] = v
      return v
      ```
    blanks:
      - - ok
    answer: On revérifie sous le verrou d'écriture, car une autre goroutine a pu charger entre-temps.
  - key: bug-promotion
    format: bug-fix
    question: |-
      Le chargement bloque pour toujours au premier défaut de cache :
      ```go
      c.mu.RLock()
      defer c.mu.RUnlock()
      v, ok := c.items[k]
      if !ok {
      	c.mu.Lock()
      	v = charger(k)
      	c.items[k] = v
      	c.mu.Unlock()
      }
      return v
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Relâcher le `RLock`, prendre le `Lock`, puis revérifier la clé avant de charger", correct: true}
      - {text: "Retirer le `defer`, et appeler `RUnlock` juste après le `Lock`", correct: false}
      - {text: "Remplacer `c.mu.Lock()` par un second `c.mu.RLock()`, toujours permis", correct: false}
      - {text: "Prendre le `Lock` dans une goroutine, pour ne pas bloquer celle qui lit", correct: false}
    answer: |-
      ```go
      c.mu.RLock()
      v, ok := c.items[k]
      c.mu.RUnlock()
      if ok {
      	return v
      }
      c.mu.Lock()
      defer c.mu.Unlock()
      if v, ok := c.items[k]; ok {
      	return v
      }
      v = charger(k)
      c.items[k] = v
      return v
      ```
      `Lock` attendait la fin du `RLock` détenu par la même goroutine. On relâche, on prend `Lock`, et l'on revérifie : une autre goroutine a pu charger la clé entre-temps.
  - key: bug-ecriture-rlock
    format: bug-fix
    question: |-
      Le détecteur de courses signale le compteur de lectures :
      ```go
      func (c *Cache) Lire(k string) string {
      	c.mu.RLock()
      	defer c.mu.RUnlock()
      	c.lectures++
      	return c.items[k]
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer `lectures` en `atomic.Int64`, incrémenté par `Add(1)`", correct: true}
      - {text: "Incrémenter `lectures` après `RUnlock`, hors de la lecture", correct: false}
      - {text: "Prendre un second `RLock` autour de l'incrément de `lectures`", correct: false}
      - {text: "Déplacer l'incrément dans le `defer`, pour qu'il passe en dernier", correct: false}
    answer: |-
      ```go
      type Cache struct {
      	mu       sync.RWMutex
      	items    map[string]string
      	lectures atomic.Int64
      }

      func (c *Cache) Lire(k string) string {
      	c.lectures.Add(1)
      	c.mu.RLock()
      	defer c.mu.RUnlock()
      	return c.items[k]
      }
      ```
      Plusieurs lecteurs tiennent le `RLock` ensemble : ils écrivaient le compteur en même temps. Un atomique (ou le verrou exclusif) le protège ; le sortir du verrou ne fait qu'aggraver la course.
  - key: bug-inutile
    format: bug-fix
    question: Un RWMutex protège un compteur que chaque requête incrémente, et le profil montre de la contention. Que proposes-tu ?
    choices:
      - {text: "Un `atomic.Int64` incrémenté par `Add(1)`, qui ne bloque personne", correct: true}
      - {text: "Prendre `RLock` plutôt que `Lock` pour l'incrément, afin de paralléliser", correct: false}
      - {text: "Un channel bufferisé de capacité 1, utilisé comme verrou autour du compteur", correct: false}
      - {text: "Une `sync.Map` dont une seule clé contient la valeur du compteur", correct: false}
    answer: |-
      ```go
      var requetes atomic.Int64
      requetes.Add(1)
      ```
      Chaque opération est une écriture : le RWMutex n'apporte rien et coûte plus qu'un Mutex. Pour un compteur, un atomique suffit ; un `RLock` laisserait plusieurs goroutines écrire en même temps.
  - key: bug-imbrication
    format: bug-fix
    question: |-
      Sous forte charge, le service se fige de temps en temps :
      ```go
      func (s *Stock) Total() int {
      	s.mu.RLock()
      	defer s.mu.RUnlock()
      	total := 0
      	for id := range s.quantites {
      		total += s.Quantite(id) // reprend s.mu.RLock()
      	}
      	return total
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lire `s.quantites` directement dans la boucle, sans rappeler `Quantite`", correct: true}
      - {text: "Prendre `Lock` plutôt que `RLock` dans `Total`, plus sûr pour une boucle", correct: false}
      - {text: "Retirer le `defer`, et relâcher le `RLock` à la main après la boucle", correct: false}
      - {text: "Passer à un `sync.Mutex`, qui n'a pas ce problème de lecteurs imbriqués", correct: false}
    answer: |-
      ```go
      func (s *Stock) Total() int {
      	s.mu.RLock()
      	defer s.mu.RUnlock()
      	total := 0
      	for _, q := range s.quantites {
      		total += q
      	}
      	return total
      }
      ```
      Un écrivain en attente bloquait le `RLock` imbriqué de `Quantite`, et attendait lui-même le premier `RLock` : on ne reprend pas le verrou dans une section qui le détient déjà. Un `Lock` ou un Mutex bloqueraient à coup sûr.
  - key: scenario-mesurer
    format: scenario
    question: "Un collègue veut remplacer tous les Mutex du projet par des RWMutex « pour les performances ». Que réponds-tu ?"
    choices:
      - {text: "Ce n'est pas un gain par défaut : on mesure endroit par endroit, et l'on change là où ça paie", correct: true}
      - {text: "Bonne idée : un RWMutex est plus rapide qu'un Mutex dans tous les cas, lectures ou écritures", correct: false}
      - {text: "Bonne idée, à condition de remplacer aussi chaque `Lock` par un `RLock` pour paralléliser", correct: false}
      - {text: "Mauvaise idée : un RWMutex ne protège que les lectures concurrentes, pas les écritures", correct: false}
    answer: "Le RWMutex coûte plus par opération et ne gagne que si les lectures dominent et durent. Je propose un benchmark parallèle (`b.RunParallel`) et le profil de contention, endroit par endroit, et je signale les pièges : `RLock` imbriqués, lectures qui écrivent."
  - key: scenario-config
    format: scenario
    question: "Une configuration est lue à chaque requête et rechargée toutes les minutes. Faut-il un RWMutex, ou autre chose ?"
    choices:
      - {text: "Un `atomic.Pointer[Config]` vers une copie immuable, publiée par `Store` à chaque rechargement", correct: true}
      - {text: "Un `sync.Mutex` à chaque requête, car un RWMutex ne sert qu'aux écritures fréquentes", correct: false}
      - {text: "Aucun verrou : une configuration rechargée une fois par minute ne peut pas faire de course", correct: false}
      - {text: "Un `sync.Once` qui recharge la configuration toutes les minutes, à la première requête", correct: false}
    answer: "Un RWMutex convient, mais un `atomic.Pointer[Config]` est plus simple et plus rapide : le rechargement construit une Config complète puis la publie avec `Store`, et chaque requête fait `Load` sans verrou. La Config publiée n'est jamais modifiée."
  - key: scenario-starvation
    format: scenario
    question: "Pourquoi un écrivain en attente bloque-t-il les nouveaux lecteurs d'un RWMutex, et avec quelles conséquences ?"
    choices:
      - {text: "Pour éviter la famine de l'écrivain ; deux `RLock` imbriqués peuvent alors se bloquer", correct: true}
      - {text: "Pour garder l'ordre d'arrivée des lecteurs ; sans conséquence sur le code", correct: false}
      - {text: "Pour économiser la mémoire du verrou ; les lectures deviennent séquentielles", correct: false}
      - {text: "Pour éviter les courses entre lecteurs ; il faut donc un `RLock` par champ lu", correct: false}
    answer: "Sans cette règle, un flux continu de lecteurs empêcherait l'écrivain de passer (famine). Conséquence : deux `RLock` imbriqués se bloquent si un écrivain arrive entre les deux, et une longue lecture retarde toutes les suivantes ; on garde les lectures courtes."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande quand tu choisirais RWMutex plutôt que Mutex. Que réponds-tu ?"
    choices:
      - {text: "Quand les lectures dominent nettement, durent un peu, et que la contention est mesurée", correct: true}
      - {text: "Toujours : un RWMutex fait tout ce que fait un Mutex, et plus rapidement", correct: false}
      - {text: "Quand les écritures dominent, car le RWMutex les laisse passer en parallèle", correct: false}
      - {text: "Quand la section critique est très courte, comme la lecture d'un seul entier", correct: false}
    answer: "Quand l'état est lu bien plus souvent qu'il n'est modifié, que les lectures prennent un peu de temps (parcourir une structure, pas lire un entier) et que la contention est mesurée. Dans le doute, un Mutex, plus simple et plus rapide sur les sections courtes."
