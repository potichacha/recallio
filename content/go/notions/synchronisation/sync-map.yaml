notion: sync-map
lesson: "**`sync.Map`** est une map sûre entre goroutines, sans verrou à écrire soi-même. Elle n'est **pas** un remplacement\ngénéral de `map` + `Mutex` : la documentation la réserve à **deux cas** :\n- des clés **écrites une fois, lues très souvent** (un cache qui ne fait que grandir) ;\n- des goroutines qui travaillent sur des **ensembles de clés disjoints**.\n\n```go\nvar sessions sync.Map // map[string]*Session\n\nsessions.Store(id, s)\nif v, ok := sessions.Load(id); ok {\n\ts := v.(*Session)                       // valeurs de type any : assertion à chaque lecture\n\t_ = s\n}\nactuelle, dejaLa := sessions.LoadOrStore(id, nouvelle) // insérer si absent, en une opération\nsessions.Delete(id)\nsessions.Range(func(k, v any) bool {\n\treturn true                             // false pour arrêter le parcours\n})\n```\n\nCe qu'il faut savoir :\n- les clés et valeurs sont des **`any`** : pas de typage, une assertion à chaque lecture (on l'enveloppe souvent dans\n  un type générique) ;\n- **pas de `Len`** : il faut compter avec `Range` ;\n- `Range` ne donne **pas d'instantané** cohérent : des écritures concurrentes peuvent apparaître ou non ;\n- les opérations combinées (`LoadOrStore`, `LoadAndDelete`, `CompareAndSwap`, `Swap`) sont **atomiques** ; une suite\n  `Load` puis `Store` ne l'est pas ;\n- dans les autres cas (écritures fréquentes, besoin de la taille, de plusieurs maps cohérentes), une `map` avec un\n  `Mutex` est plus claire et souvent plus rapide.\n\n**En entretien** : « sync.Map pour des clés écrites une fois et lues souvent, ou des ensembles disjoints ; sinon map +\nMutex, typée et plus lisible ; LoadOrStore pour une insertion atomique. »"
cards:
  - key: quand-utiliser-sync-map
    format: course
    question: "Quand utiliser `sync.Map` plutôt qu'une map et un mutex ?"
    choices:
      - {text: "Pour des clés écrites une fois puis lues souvent, ou des clés disjointes par goroutine", correct: true}
      - {text: "Dans tous les cas : `sync.Map` est la version sûre et plus rapide d'une map", correct: false}
      - {text: "Pour des compteurs par clé, mis à jour à chaque requête par toutes les goroutines", correct: false}
      - {text: "Quand il faut souvent connaître la taille de la map, et la parcourir de façon cohérente", correct: false}
    answer: "Ses deux cas : des clés écrites une fois puis lues très souvent, ou des goroutines qui travaillent sur des ensembles de clés disjoints. Sinon, une map et un mutex sont plus simples, typés, et plus rapides."
  - key: singleflight
    format: course
    question: "Que fait `singleflight` quand dix goroutines demandent la même clé en même temps ?"
    choices:
      - {text: "Un seul appel s'exécute, et les dix goroutines partagent son résultat", correct: true}
      - {text: "Dix appels s'exécutent, et le premier résultat arrivé est gardé en cache", correct: false}
      - {text: "Un seul appel s'exécute, et les neuf autres goroutines reçoivent une erreur", correct: false}
      - {text: "Les appels s'exécutent un par un, chacun attendant la fin du précédent", correct: false}
    answer: "Il déduplique les appels concurrents pour une même clé : un seul s'exécute, les autres attendent et partagent son résultat. Ce n'est pas un cache : une fois l'appel fini, le suivant recommence."
  - key: caches-memoire
    format: course
    question: "Quelle liste ne contient que des bibliothèques de cache en mémoire pour Go ?"
    choices:
      - {text: "ristretto, otter, golang-lru v2, bigcache, freecache", correct: true}
      - {text: "Caffeine, Guava Cache, Ehcache, cache2k", correct: false}
      - {text: "Redis, Memcached, Valkey, KeyDB", correct: false}
      - {text: "cachetools, diskcache, functools.lru_cache", correct: false}
    answer: "ristretto, otter, golang-lru v2, bigcache et freecache sont des caches en mémoire pour Go. Caffeine et Guava sont en Java, cachetools en Python ; Redis et Memcached sont des serveurs, joints par le réseau."
  - key: bigcache-freecache
    format: course
    question: "Pourquoi choisir bigcache ou freecache comme cache en mémoire ?"
    choices:
      - {text: "Pour de très gros caches, sans multiplier les pointeurs que le GC doit parcourir", correct: true}
      - {text: "Pour garder le cache sur disque, et le retrouver après un redémarrage", correct: false}
      - {text: "Pour partager le cache entre plusieurs instances du service par le réseau", correct: false}
      - {text: "Pour avoir une API typée par génériques, que les autres caches n'offrent pas", correct: false}
    answer: "Ils rangent les entrées dans de grands tableaux d'octets, sans pointeurs : le GC n'a presque rien à parcourir, même avec des millions d'entrées. Ce sont des caches locaux, en mémoire, pas des serveurs partagés."
  - key: terme-singleflight
    format: course
    question: "Que désigne « singleflight », du module `golang.org/x/sync` ?"
    choices:
      - {text: "La déduplication des appels concurrents identiques, faits pour une même clé", correct: true}
      - {text: "Un cache en mémoire avec expiration, partagé entre toutes les goroutines", correct: false}
      - {text: "Un verrou qui ne laisse passer qu'une goroutine à la fois dans tout le programme", correct: false}
      - {text: "Un groupe de goroutines qui s'arrête à la première erreur rencontrée", correct: false}
    answer: "Le package `golang.org/x/sync/singleflight` déduplique les appels concurrents identiques : un seul s'exécute par clé, les autres partagent son résultat. Le groupe qui s'arrête à la première erreur, c'est `errgroup`."
  - key: vf-remplace
    format: true-false
    question: sync.Map est le remplacement recommandé de map + Mutex dans tous les cas.
    truth: false
    answer: La documentation la réserve à deux cas précis ; ailleurs, map + Mutex est préférable.
  - key: vf-len
    format: true-false
    question: sync.Map a une méthode Len.
    truth: false
    answer: Il faut compter avec Range.
  - key: vf-load-or-store
    format: true-false
    question: '`LoadOrStore` insère la valeur seulement si la clé est absente, de façon atomique.'
    truth: true
    answer: Et indique si la clé était déjà là.
  - key: vf-range
    format: true-false
    question: '`Range` parcourt un instantané cohérent de la map.'
    truth: false
    answer: Des écritures concurrentes peuvent être vues ou non pendant le parcours.
  - key: qcm-cas
    format: multiple-choice
    question: "Dans lequel de ces cas `sync.Map` est-elle adaptée ?"
    choices:
      - {text: "Un cache dont les entrées sont écrites une fois puis lues très souvent", correct: true}
      - {text: "Un compteur par clé, mis à jour à chaque requête", correct: false}
      - {text: "Deux maps qui doivent rester cohérentes entre elles", correct: false}
      - {text: "Une map dont on affiche souvent la taille exacte", correct: false}
    answer: "Des clés écrites une fois puis lues souvent : son cas d'usage, comme des goroutines qui écrivent chacune sur leurs propres clés. Des écritures fréquentes, une cohérence entre structures ou la taille demandent une map et un mutex."
  - key: qcm-atomiques
    format: multiple-choice
    question: "Lesquelles de ces opérations de `sync.Map` sont atomiques ?"
    choices:
      - text: '`LoadOrStore`'
        correct: true
      - text: '`LoadAndDelete`'
        correct: true
      - text: '`CompareAndSwap`'
        correct: true
      - text: Un `Load` suivi d'un `Store`
        correct: false
    answer: Entre Load et Store, une autre goroutine peut écrire.
  - key: qcm-inconvenients
    format: multiple-choice
    question: "Quel inconvénient a `sync.Map` face à une map et un mutex ?"
    choices:
      - {text: "Clés et valeurs de type `any`, avec une assertion à chaque lecture", correct: true}
      - {text: "Elle n'est pas sûre quand plusieurs goroutines y écrivent", correct: false}
      - {text: "Elle interdit les clés de type `string`", correct: false}
      - {text: "Elle se vide quand le ramasse-miettes passe", correct: false}
    answer: "Ses clés et valeurs sont des `any` : une assertion à chaque lecture, et aucune erreur à la compilation ; elle n'a pas non plus de taille directe. Un type générique qui l'enveloppe rend l'API typée."
  - key: qcm-arret
    format: multiple-choice
    question: Comment arrêter un parcours `Range` ?
    choices:
      - text: Renvoyer false depuis la fonction
        correct: true
      - text: Appeler break
        correct: false
      - text: Paniquer
        correct: false
      - text: Appeler Delete sur la clé courante
        correct: false
    answer: break n'est pas possible dans une fonction passée en argument.
  - key: bug-load-store
    format: bug-fix
    question: |-
      Deux connexions sont parfois créées pour le même hôte :
      ```go
      if v, ok := connexions.Load(hote); ok {
      	return v.(*Conn)
      }
      c := ouvrir(hote)
      connexions.Store(hote, c)
      return c
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ranger la connexion par `LoadOrStore`, et fermer la sienne si une autre a gagné", correct: true}
      - {text: "Appeler `Load` une seconde fois juste avant `Store`, pour revérifier l'hôte", correct: false}
      - {text: "Remplacer `Store` par `Swap`, qui renvoie l'ancienne connexion à réutiliser", correct: false}
      - {text: "Remplacer la `sync.Map` par une map simple, plus rapide pour ce cas", correct: false}
    answer: |-
      ```go
      if v, ok := connexions.Load(hote); ok {
      	return v.(*Conn)
      }
      c := ouvrir(hote)
      v, deja := connexions.LoadOrStore(hote, c)
      if deja {
      	c.Close() // une autre goroutine a gagné
      }
      return v.(*Conn)
      ```
      `Load` puis `Store` n'est pas atomique, et un second `Load` laisse la même fenêtre. `LoadOrStore` garde une seule valeur, et l'on ferme la connexion perdante (`singleflight` éviterait même d'en ouvrir deux).
  - key: bug-compteurs
    format: bug-fix
    question: |-
      Les compteurs par page perdent des incréments :
      ```go
      v, _ := vues.LoadOrStore(page, 0)
      vues.Store(page, v.(int)+1)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une map et un `sync.Mutex`, avec `v.n[page]++` sous le verrou", correct: true}
      - {text: "Un second `LoadOrStore` avec la valeur incrémentée, à la place du `Store`", correct: false}
      - {text: "Lire la valeur avec `Load` plutôt qu'avec `LoadOrStore`, avant le `Store`", correct: false}
      - {text: "L'assertion `v.(int64)` au lieu de `v.(int)`, pour un incrément atomique", correct: false}
    answer: |-
      ```go
      type Vues struct {
      	mu sync.Mutex
      	n  map[string]int
      }

      func (v *Vues) Ajouter(page string) {
      	v.mu.Lock()
      	defer v.mu.Unlock()
      	v.n[page]++
      }
      ```
      La lecture puis l'écriture n'étaient pas atomiques ensemble. Pour des mises à jour fréquentes, une map et un mutex sont plus simples (ou des `*atomic.Int64` rangés dans la `sync.Map`).
  - key: bug-len
    format: bug-fix
    question: |-
      La taille affichée par le tableau de bord est incohérente, et le parcours coûte cher à chaque appel :
      ```go
      func (c *Cache) Taille() int {
      	n := 0
      	c.m.Range(func(_, _ any) bool { n++; return true })
      	return n
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une map protégée par un `sync.Mutex`, dont `len` donne la taille en temps constant", correct: true}
      - {text: "Appeler `c.m.Len()`, la méthode de `sync.Map` qui donne directement la taille", correct: false}
      - {text: "Compter dans `Range` avec un `atomic.Int64` plutôt qu'avec un `int`", correct: false}
      - {text: "Garder le résultat de `Range` pendant une minute dans un champ du cache", correct: false}
    answer: |-
      ```go
      type Cache struct {
      	mu sync.Mutex
      	m  map[string]Entree
      }

      func (c *Cache) Taille() int {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	return len(c.m)
      }
      ```
      `sync.Map` n'a pas de `Len` : quand on a besoin de la taille, d'un parcours cohérent ou d'écritures fréquentes, c'est le mauvais outil. Une map protégée donne `len` en temps constant.
  - key: bug-assertion
    format: bug-fix
    question: |-
      Le service panique avec « interface conversion: interface {} is string, not *main.Session » :
      ```go
      sessions.Store(id, s.Jeton) // une string
      // ailleurs
      s := v.(*Session)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Envelopper `sync.Map` dans un type générique `Map[K, V]` aux méthodes typées", correct: true}
      - {text: "Écrire `s, _ := v.(*Session)`, qui ne panique plus quand le type diffère", correct: false}
      - {text: "Ranger `&s.Jeton` plutôt que `s.Jeton`, pour stocker un pointeur", correct: false}
      - {text: "Remplacer `sync.Map` par une `map[string]any` protégée par un mutex", correct: false}
    answer: |-
      ```go
      type Map[K comparable, V any] struct{ m sync.Map }

      func (m *Map[K, V]) Store(k K, v V) { m.m.Store(k, v) }

      func (m *Map[K, V]) Load(k K) (V, bool) {
      	v, ok := m.m.Load(k)
      	if !ok {
      		var zero V
      		return zero, false
      	}
      	return v.(V), true
      }

      var sessions Map[string, *Session]
      ```
      Les valeurs `any` acceptaient n'importe quoi ; un type générique qui enveloppe `sync.Map` rend l'erreur visible à la compilation. Ignorer le `ok` de l'assertion cacherait l'erreur sous un pointeur nil.
  - key: scenario-choix
    format: scenario
    question: "Un collègue propose `sync.Map` pour le cache des profils utilisateur, mis à jour à chaque connexion. Ton avis ?"
    choices:
      - {text: "Mauvais choix : les écritures sont fréquentes ; une map et un mutex, typés, conviennent mieux", correct: true}
      - {text: "Bon choix : `sync.Map` est faite pour les caches, quelle que soit la fréquence des écritures", correct: false}
      - {text: "Bon choix, à condition d'appeler `Range` après chaque écriture pour garder la cohérence", correct: false}
      - {text: "Mauvais choix : `sync.Map` n'est pas sûre quand plusieurs goroutines écrivent la même clé", correct: false}
    answer: "Ce n'est pas un des deux cas prévus : les écritures sont fréquentes et les clés réécrites. Une map protégée par un Mutex (ou un RWMutex si les lectures dominent) est typée, donne la taille et facilite l'éviction ; `sync.Map` reste sûre, mais n'y gagne rien."
  - key: scenario-cache-croissant
    format: scenario
    question: "Dans lequel de ces exemples `sync.Map` est-elle le bon choix ?"
    choices:
      - {text: "Un cache de métadonnées calculées une fois par type, puis lues des millions de fois", correct: true}
      - {text: "Un compteur de visites par page, incrémenté à chaque requête de chaque utilisateur", correct: false}
      - {text: "Une file de tâches que des workers vident pendant que d'autres la remplissent", correct: false}
      - {text: "Un cache de sessions dont il faut afficher la taille exacte toutes les secondes", correct: false}
    answer: "Comme le cache des champs de structs d'`encoding/json` : chaque clé est écrite une fois puis lue sans cesse par toutes les goroutines. `sync.Map` évite alors la contention d'un verrou partagé, et `LoadOrStore` règle le cas où deux goroutines calculent la même entrée."
  - key: scenario-typage
    format: scenario
    question: "Comment rends-tu l'usage de `sync.Map` plus sûr dans une base de code ?"
    choices:
      - {text: "Je l'enveloppe dans un type générique `Map[K, V]` aux méthodes typées, et documenté", correct: true}
      - {text: "J'ajoute un commentaire au-dessus de chaque assertion, pour dire le type attendu", correct: false}
      - {text: "Je remplace chaque assertion par `v.(T)` à deux résultats, en ignorant le `ok`", correct: false}
      - {text: "Je la déclare en variable globale, pour qu'un seul exemplaire existe dans le code", correct: false}
    answer: "Un type générique `Map[K, V]` qui expose `Load`, `Store`, `LoadOrStore` et `Range` typés : plus d'assertion dispersée ni de valeur du mauvais type. Je documente pourquoi `sync.Map` plutôt qu'une map et un mutex, et je garde ce type dans un package interne."
  - key: scenario-shards
    format: scenario
    question: "Une map protégée par un seul mutex est très contendue sous des écritures fréquentes. `sync.Map`, ou autre chose ?"
    choices:
      - {text: "Je découpe la map en segments, chacun avec son mutex, choisis par un hash de la clé", correct: true}
      - {text: "Je passe à `sync.Map`, faite pour les écritures fréquentes sur des clés partagées", correct: false}
      - {text: "Je retire le mutex des lectures, pour que seules les écritures attendent le verrou", correct: false}
      - {text: "Je remplace le mutex par un `RWMutex`, qui laisse passer les écritures ensemble", correct: false}
    answer: "`sync.Map` n'est pas faite pour des écritures fréquentes sur des clés partagées. N maps, chacune avec son mutex, choisies par un hash de la clé, divisent la contention par N ; je mesure avant et après avec le profil de contention et un benchmark parallèle."
