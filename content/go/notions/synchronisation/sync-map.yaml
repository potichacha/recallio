notion: sync-map
cards:
  - key: quand-utiliser-sync-map
    format: course
    question: Quand utiliser sync.Map ?
    answer: Pour des clés écrites une fois et lues souvent, ou des ensembles de clés disjoints par goroutine ; sinon map + mutex.
  - key: singleflight
    format: course
    question: C'est quoi singleflight ?
    answer: 'Un mécanisme qui déduplique des appels concurrents pour une même clé : un seul s''exécute, les autres partagent le résultat.'
  - key: caches-memoire
    format: course
    question: Quels caches en mémoire en Go ?
    answer: ristretto, otter, golang-lru v2, bigcache, freecache.
  - key: bigcache-freecache
    format: course
    question: Pourquoi bigcache ou freecache ?
    answer: Pour de très gros caches sans multiplier les pointeurs que le GC doit scanner.
  - key: terme-singleflight
    format: course
    question: Que désigne « singleflight » ?
    answer: Déduplication d'appels concurrents identiques (x/sync)
