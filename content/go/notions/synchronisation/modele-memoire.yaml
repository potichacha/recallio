notion: modele-memoire
lesson: "Le **modèle mémoire** de Go dit quand une goroutine est **garantie** de voir l'écriture d'une autre. Sans ces\ngaranties, le compilateur et le processeur peuvent **réordonner** ou garder en registre les accès, et une goroutine\npeut voir des valeurs anciennes, ou les écritures dans le désordre.\n\nLa notion centrale est la relation **happens-before** (« arrive avant ») : si une écriture *arrive avant* une\nlecture, la lecture voit cette écriture (ou une plus récente). Elle s'établit par les **synchronisations** :\n- **channels** : un envoi arrive avant la réception correspondante ; pour un channel non bufferisé, la réception\n  arrive avant la fin de l'envoi ; la fermeture arrive avant une réception qui voit le channel fermé ;\n- **mutex** : un `Unlock` arrive avant le `Lock` suivant ;\n- **`sync.Once`** : la fonction passée à `Do` arrive avant le retour de tous les `Do` ;\n- **`WaitGroup`** : chaque `Done` arrive avant le retour de `Wait` ;\n- **atomiques** : depuis Go 1.19, ils sont **séquentiellement cohérents** (comme en Java `volatile`) ;\n- **lancement** : l'instruction `go` arrive avant le début de la goroutine. La **fin** d'une goroutine, elle, n'est\n  synchronisée avec rien.\n\n```go\nvar message string\nvar pret = make(chan struct{})\n\ngo func() {\n\tmessage = \"bonjour\"\n\tclose(pret)          // l'écriture de message arrive avant la fermeture\n}()\n<-pret                   // ... qui arrive avant cette réception\nfmt.Println(message)     // garanti : « bonjour »\n```\n\nUn programme **sans data race** se comporte comme si les goroutines s'entrelaçaient sur un seul processeur\n(*DRF-SC*). Avec une course, tout peut arriver : les valeurs de plusieurs mots (interfaces, slices, strings) peuvent\nêtre lues **à moitié écrites**.\n\n**En entretien** : « happens-before s'établit par les channels, les mutex, Once, WaitGroup et les atomiques ; sans\nsynchronisation, aucune garantie de visibilité ; sans data race, le programme est séquentiellement cohérent. »"
cards:
  - key: relation-happens-before
    format: course
    question: "Que garantit une relation happens-before entre deux opérations ?"
    choices:
      - {text: "Que la première est ordonnée avant la seconde, et que ses écritures y sont visibles", correct: true}
      - {text: "Que la première s'exécute plus tôt en temps réel, même sans synchronisation", correct: false}
      - {text: "Que les deux opérations s'exécutent sur le même thread du système", correct: false}
      - {text: "Que la seconde attend un délai fixe après la fin de la première", correct: false}
    answer: "Que la première est ordonnée avant la seconde et que ses écritures y sont visibles. Elle naît de l'ordre du code dans une goroutine et des synchronisations (channels, verrous, `Once`, `WaitGroup`, atomiques) ; l'heure à laquelle les opérations s'exécutent ne suffit pas."
  - key: fin-goroutine-synchronisee
    format: course
    question: "La fin d'une goroutine est-elle synchronisée avec le reste du programme ?"
    choices:
      - {text: "Non : il faut un mécanisme explicite, comme un `WaitGroup` ou un channel", correct: true}
      - {text: "Oui : ses écritures sont visibles par toutes les goroutines dès qu'elle finit", correct: false}
      - {text: "Oui, si `main` attend assez longtemps avec un `time.Sleep` bien choisi", correct: false}
      - {text: "Non, sauf si la goroutine finit par un `return` explicite", correct: false}
    answer: "Non : la sortie d'une goroutine n'établit aucune relation happens-before. Pour voir ses écritures, il faut un `WaitGroup`, un channel ou un verrou ; un `Sleep` ne synchronise rien."
  - key: interface-string-peuvent-elles-etre-lues
    format: course
    question: "Une interface ou une string peuvent-elles être lues à moitié écrites ?"
    choices:
      - {text: "Oui, en cas de data race : ce sont des valeurs de plusieurs mots", correct: true}
      - {text: "Non : le runtime écrit toujours une interface ou une string d'un coup", correct: false}
      - {text: "Non : ce sont des valeurs immuables, donc sûres entre goroutines", correct: false}
      - {text: "Oui, mais seulement sur les processeurs 32 bits, jamais en 64 bits", correct: false}
    answer: "Oui, en cas de data race : une interface (type et pointeur) ou une string (pointeur et longueur) tiennent sur plusieurs mots, et une lecture peut mélanger deux écritures, jusqu'à un accès mémoire invalide. Une string est immuable, mais la variable qui la contient ne l'est pas."
  - key: definition-happens-before
    format: definition
    question: "Que désigne le terme happens-before ?"
    choices:
      - {text: "La relation d'ordre et de visibilité entre opérations du modèle mémoire", correct: true}
      - {text: "L'ordre dans lequel l'ordonnanceur lance les goroutines créées par `go`", correct: false}
      - {text: "L'ordre d'exécution des `defer` d'une fonction, du dernier au premier", correct: false}
      - {text: "Le délai minimal qu'impose le runtime entre deux écritures d'une variable", correct: false}
    answer: "La relation d'ordre et de visibilité du modèle mémoire : si une écriture arrive avant (happens before) une lecture, la lecture la voit. Elle ne dit rien de l'ordre de lancement des goroutines."
  - key: drf-sc
    format: course
    question: Que garantit Go à un programme sans data race ?
    choices:
      - {text: "Qu'il se comporte de façon séquentiellement cohérente, sans réordonnancement visible", correct: true}
      - {text: "Qu'il s'exécute plus vite, le compilateur pouvant tout réordonner librement", correct: false}
      - {text: "Que ses goroutines s'exécutent dans l'ordre où elles ont été lancées", correct: false}
      - {text: "Qu'il ne peut ni se bloquer ni avoir de race condition logique", correct: false}
    answer: "La cohérence séquentielle (DRF-SC) : il se comporte comme si les opérations des goroutines s'entrelaçaient dans un ordre unique. Ça n'exclut ni les interblocages ni les race conditions logiques."
  - key: vf-go
    format: true-false
    question: Les écritures faites avant l'instruction `go` sont visibles dans la goroutine lancée.
    truth: true
    answer: Le lancement arrive avant le début de la goroutine.
  - key: vf-fin
    format: true-false
    question: Les écritures d'une goroutine sont visibles dès qu'elle est terminée, sans autre synchronisation.
    truth: false
    answer: Sa fin n'est synchronisée avec rien ; il faut un WaitGroup, un channel ou un mutex.
  - key: vf-atomiques
    format: true-false
    question: Depuis Go 1.19, les opérations atomiques sont séquentiellement cohérentes.
    truth: true
    answer: Comme les variables volatile de Java ; le modèle mémoire a été révisé en 1.19.
  - key: vf-sleep
    format: true-false
    question: Un `time.Sleep` assez long garantit qu'une goroutine voit l'écriture d'une autre.
    truth: false
    answer: Le sommeil n'établit aucune relation happens-before.
  - key: qcm-synchronisent
    format: multiple-choice
    question: Lesquels établissent une relation happens-before ?
    choices:
      - text: Un envoi sur un channel et la réception correspondante
        correct: true
      - text: Un Unlock et le Lock suivant du même mutex
        correct: true
      - text: Un Done et le retour de Wait du même WaitGroup
        correct: true
      - text: Deux goroutines qui écrivent au même moment
        correct: false
    answer: Des accès simultanés sans synchronisation sont une course.
  - key: qcm-demi
    format: multiple-choice
    question: "Lesquelles de ces valeurs peuvent être lues « à moitié écrites » en cas de data race ?"
    choices:
      - text: Une interface (type et pointeur)
        correct: true
      - text: Un slice (pointeur, longueur, capacité)
        correct: true
      - text: Une string (pointeur et longueur)
        correct: true
      - text: Aucune, Go l'empêche
        correct: false
    answer: Ce sont des valeurs de plusieurs mots ; la lecture peut mélanger deux écritures et provoquer un accès mémoire invalide.
  - key: qcm-close
    format: multiple-choice
    question: Que garantit la fermeture d'un channel ?
    choices:
      - {text: "Les écritures faites avant close sont visibles par une goroutine qui reçoit et voit le channel fermé", correct: true}
      - {text: "Toutes les goroutines qui lisent le channel s'arrêtent aussitôt, quel que soit leur travail", correct: false}
      - {text: "Rien : fermer un channel libère ses ressources, mais ne synchronise aucune goroutine", correct: false}
      - {text: "Seule la première goroutine qui reçoit voit les écritures faites avant la fermeture", correct: false}
    answer: C'est ce qui rend ctx.Done() utilisable comme signal.
  - key: qcm-once
    format: multiple-choice
    question: Que garantit `once.Do(f)` vis-à-vis de la mémoire ?
    choices:
      - {text: "Les écritures faites par f sont visibles après le retour de chaque appel à Do", correct: true}
      - {text: "f s'exécute dans une goroutine séparée, que Do lance au premier appel", correct: false}
      - {text: "Rien : il faut un mutex en plus pour lire ce que f a écrit", correct: false}
      - {text: "Les écritures de f sont visibles par les autres avant même la fin de f", correct: false}
    answer: C'est pourquoi l'initialisation paresseuse avec Once est sûre.
  - key: bug-drapeau
    format: bug-fix
    question: |-
      Le programme affiche parfois une chaîne vide, ou boucle pour toujours :
      ```go
      var message string
      var pret bool

      go func() {
      	message = "bonjour"
      	pret = true
      }()
      for !pret {
      }
      fmt.Println(message)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Fermer un channel `pret` après l'écriture, et l'attendre avec `<-pret`", correct: true}
      - {text: "Écrire `pret = true` avant `message`, pour que le drapeau soit vu en premier", correct: false}
      - {text: "Ajouter un `time.Sleep` dans la boucle `for !pret`, pour laisser écrire la goroutine", correct: false}
      - {text: "Déclarer `message` et `pret` dans la goroutine plutôt qu'en dehors", correct: false}
    answer: |-
      ```go
      var message string
      pret := make(chan struct{})

      go func() {
      	message = "bonjour"
      	close(pret)
      }()
      <-pret
      fmt.Println(message)
      ```
      Sans synchronisation, rien ne garantit l'ordre ni la visibilité des écritures ; la fermeture du channel crée la relation happens-before (et supprime l'attente active). Changer l'ordre des écritures ou dormir ne synchronise rien.
  - key: bug-fin
    format: bug-fix
    question: |-
      Le résultat est parfois vide, même si la goroutine a fini :
      ```go
      var resultat []int
      go func() { resultat = calculer() }()
      time.Sleep(100 * time.Millisecond)
      fmt.Println(resultat)
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Lancer la goroutine avec `wg.Go`, et attendre `wg.Wait()` avant l'affichage", correct: true}
      - {text: "Allonger le `time.Sleep` à une seconde, pour être sûr que `calculer` a fini", correct: false}
      - {text: "Appeler `runtime.Gosched()` à la place du `Sleep`, pour céder la main", correct: false}
      - {text: "Déclarer `resultat` par `var resultat = []int{}`, plutôt que nil", correct: false}
    answer: |-
      ```go
      var resultat []int
      var wg sync.WaitGroup
      wg.Go(func() { resultat = calculer() })
      wg.Wait()
      fmt.Println(resultat)
      ```
      Le sommeil ne synchronise rien, et la fin d'une goroutine non plus ; `Wait` garantit que l'écriture est visible.
  - key: bug-double-check
    format: bug-fix
    question: |-
      Une initialisation « optimisée » avec double vérification lit parfois un objet incomplet :
      ```go
      if instance == nil {
      	mu.Lock()
      	if instance == nil {
      		instance = &Service{config: charger()}
      	}
      	mu.Unlock()
      }
      return instance
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `sync.OnceValue` qui construit le `Service`, à la place du double test", correct: true}
      - {text: "Ajouter un troisième test `instance == nil` juste avant le `return`", correct: false}
      - {text: "Déclarer `instance` comme `volatile`, comme on le fait en Java", correct: false}
      - {text: "Retirer le second test sous verrou, devenu inutile après le premier", correct: false}
    answer: |-
      ```go
      var instance = sync.OnceValue(func() *Service {
      	return &Service{config: charger()}
      })
      ```
      La première lecture de `instance` se faisait hors verrou : une course, qui peut voir le pointeur avant les champs. `Once` (ou un `atomic.Pointer`) publie l'objet correctement ; Go n'a pas de `volatile`.
  - key: bug-interface
    format: bug-fix
    question: |-
      Le service plante de temps en temps avec un « invalid memory address » dans un appel de méthode :
      ```go
      var courant Stockage // une interface, changée par le rechargement

      func recharger() { courant = nouveauStockage() }
      func lire(k string) string { return courant.Lire(k) }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Publier le stockage par un `atomic.Pointer` (ou sous mutex), lu par `Load`", correct: true}
      - {text: "Vérifier `courant != nil` dans `lire`, avant d'appeler la méthode", correct: false}
      - {text: "Remplacer l'interface par un pointeur nu `*Stockage`, écrit sans verrou", correct: false}
      - {text: "Copier `courant` dans une variable locale avant de l'utiliser dans `lire`", correct: false}
    answer: |-
      ```go
      var courant atomic.Pointer[stockageCourant]

      type stockageCourant struct{ s Stockage }

      func recharger() { courant.Store(&stockageCourant{s: nouveauStockage()}) }
      func lire(k string) string { return courant.Load().s.Lire(k) }
      ```
      Une interface a deux mots (type, pointeur) : une lecture en course peut combiner le type de l'un et les données de l'autre. Tester `nil` ou copier dans une variable locale lit toujours en course ; un `atomic.Pointer` (ou un mutex) publie la valeur en entier.
  - key: scenario-expliquer
    format: scenario
    question: "En entretien, on te demande ce qu'est la relation happens-before en Go. Que réponds-tu ?"
    choices:
      - {text: "L'ordre partiel qui dit quelles écritures une lecture est garantie de voir, établi par les synchronisations", correct: true}
      - {text: "L'ordre total dans lequel le processeur exécute les instructions, identique pour toutes les goroutines", correct: false}
      - {text: "L'ordre de lancement des goroutines : celle lancée en premier voit les écritures des suivantes", correct: false}
      - {text: "L'ordre chronologique des opérations : ce qui s'est passé plus tôt est toujours visible ensuite", correct: false}
    answer: "C'est l'ordre partiel qui dit quelles écritures une lecture est garantie de voir. Il découle de l'ordre du code dans une goroutine et des synchronisations : channels, `Unlock` puis `Lock`, `Done` puis `Wait`, `Once`, atomiques. Deux accès concurrents sans cet ordre, dont une écriture, font une data race."
  - key: scenario-java
    format: scenario
    question: "Tu compares le modèle mémoire de Go à celui de Java. Quelle est la différence majeure ?"
    choices:
      - {text: "En Go, une course sur une valeur de plusieurs mots peut corrompre la mémoire ; en Java, non", correct: true}
      - {text: "Go n'a pas de relation happens-before : seuls les channels y ordonnent les accès", correct: false}
      - {text: "Java garantit DRF-SC, mais Go ne garantit rien, même à un programme sans data race", correct: false}
      - {text: "`sync.Mutex` est réentrant comme `synchronized`, mais Go n'a aucun atomique", correct: false}
    answer: "Les deux reposent sur happens-before et garantissent DRF-SC. Mais en Java une course reste limitée (pas de référence « inventée »), alors qu'en Go une course sur une interface, une string ou un slice peut corrompre la mémoire. Et `sync.Mutex` n'est pas réentrant."
  - key: scenario-revue
    format: scenario
    question: "En revue, un collègue a écrit une attente avec un booléen et un `time.Sleep`. Comment le convaincs-tu de changer ?"
    choices:
      - {text: "Ni le booléen ni le sommeil ne synchronisent : je propose un channel fermé ou un `atomic.Bool`", correct: true}
      - {text: "Le code est juste, mais je propose un sommeil plus court pour réduire la latence", correct: false}
      - {text: "Un booléen est atomique en Go : seul le `time.Sleep` est à retirer du code", correct: false}
      - {text: "Je propose de déclarer le booléen `volatile`, pour que la lecture soit toujours fraîche", correct: false}
    answer: "Ni le booléen ni le sommeil n'établissent de happens-before : le compilateur peut sortir la lecture de la boucle, et la goroutine peut ne jamais voir le changement ; `go test -race` le signale. Un channel fermé, un contexte annulé ou un `atomic.Bool` sont plus courts et garantis."
  - key: scenario-publication
    format: scenario
    question: "Comment publies-tu un objet construit par une goroutine pour que les autres le voient entièrement initialisé ?"
    choices:
      - {text: "Par une synchronisation : un channel, un mutex partagé, un `atomic.Pointer` ou un `sync.Once`", correct: true}
      - {text: "En l'affectant à une variable globale, puis en attendant un peu avec `time.Sleep`", correct: false}
      - {text: "En initialisant tous ses champs avant d'affecter son pointeur, sans autre précaution", correct: false}
      - {text: "En rendant ses champs non exportés, que les autres goroutines ne lisent pas à moitié", correct: false}
    answer: "Par une synchronisation qui établit happens-before entre la construction et la lecture : l'envoyer sur un channel, l'affecter sous le mutex des lecteurs, le stocker dans un `atomic.Pointer` ou le créer dans un `sync.Once`. Initialiser les champs avant le pointeur ne suffit pas : sans synchronisation, l'ordre n'est pas garanti."
  - key: definition-modele-memoire
    format: definition
    question: "Qu'est-ce que le modèle mémoire de Go ?"
    choices:
      - {text: "Les règles qui disent quand une goroutine est garantie de voir les écritures d'une autre", correct: true}
      - {text: "Le découpage de la mémoire d'un programme Go en pile, tas et segments de données", correct: false}
      - {text: "L'algorithme du ramasse-miettes, qui décide quand libérer la mémoire inutilisée", correct: false}
      - {text: "Les règles d'échappement, qui placent une variable sur la pile ou sur le tas", correct: false}
    answer: "Les règles qui définissent quand une goroutine est garantie de voir les écritures d'une autre, par la relation happens-before. La pile, le tas et le ramasse-miettes relèvent de la gestion de la mémoire, pas du modèle mémoire."
  - key: definition-drf-sc
    format: definition
    question: "Que désigne la garantie DRF-SC ?"
    choices:
      - {text: "Un programme sans data race se comporte de façon séquentiellement cohérente", correct: true}
      - {text: "Un programme sans interblocage s'exécute toujours dans le même ordre", correct: false}
      - {text: "Le runtime détecte et corrige seul les data races, à l'exécution", correct: false}
      - {text: "Chaque goroutine voit ses propres écritures, mais jamais celles des autres", correct: false}
    answer: "Data-Race-Free implique Sequentially Consistent : un programme sans data race se comporte comme si les opérations s'entrelaçaient dans un ordre unique. Avec une course, plus aucune garantie."
  - key: definition-coherence-sequentielle
    format: definition
    question: "Qu'est-ce que la cohérence séquentielle ?"
    choices:
      - {text: "Toutes les opérations semblent suivre un ordre unique, qui respecte l'ordre de chaque goroutine", correct: true}
      - {text: "Les goroutines s'exécutent l'une après l'autre, dans l'ordre de leur lancement", correct: false}
      - {text: "Chaque goroutine exécute ses instructions dans un ordre choisi par le processeur", correct: false}
      - {text: "Les écritures d'une goroutine deviennent visibles après un délai fixe et connu", correct: false}
    answer: "Un comportement où toutes les opérations semblent s'exécuter dans un ordre unique, qui respecte l'ordre du code de chaque goroutine. Les goroutines restent concurrentes : seul l'entrelacement doit être explicable."
