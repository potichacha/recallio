notion: channels-ou-mutex
lesson: "La devise de Go : **« Ne communiquez pas en partageant la mémoire ; partagez la mémoire en communiquant. »** Plutôt que\nplusieurs goroutines qui modifient le même état sous verrou, on **transmet** les données par un channel : une seule\ngoroutine en est propriétaire à un instant donné.\n\nMais la devise n'interdit pas les mutex. La règle pratique :\n\n| Besoin | Outil |\n|---|---|\n| transférer la **propriété** d'une donnée (une tâche, un résultat) | channel |\n| **coordonner** des goroutines : signal d'arrêt, fin de travail, pipeline | channel (ou context, WaitGroup) |\n| **protéger un état** partagé : cache, compteur, map de sessions | mutex (ou atomique) |\n| une goroutine **propriétaire** d'un état, servie par messages | channel |\n\n```go\n// un état partagé : un mutex est le plus simple\ntype Compteur struct {\n\tmu sync.Mutex\n\tn  map[string]int\n}\n\n// un transfert de travail : un channel exprime le flux\njobs := make(chan Tache)\n```\n\nLes signes qu'on a choisi le mauvais outil :\n- un channel de capacité 1 utilisé comme verrou, ou une goroutine « gardienne » qui ne fait que servir des lectures et\n  écritures d'une map : un mutex serait plus court et plus rapide ;\n- plusieurs mutex et des conditions pour enchaîner des étapes : un pipeline de channels serait plus clair.\n\n« Utilisez ce qui est le plus expressif et le plus simple » (Go Wiki, *MutexOrChannel*).\n\n**En entretien** : « Channels pour transférer des données et coordonner, mutex pour protéger un état ; on choisit\nle plus simple et le plus lisible, pas le plus idiomatique en apparence. »"
cards:
  - key: channel-mutex
    format: course
    question: Channel ou mutex ?
    answer: Channel pour transférer des données et coordonner ; mutex pour protéger un état partagé.
  - key: signifie-share-memory-by-communicating
    format: course
    question: Que signifie "share memory by communicating" ?
    answer: Faire circuler les données par des channels plutôt que les partager sous verrou.
  - key: collegue-protege-compteur-avec-channel-bufferise
    format: scenario
    question: Un collègue protège un compteur avec un channel bufferisé de taille 1 utilisé comme verrou.
    answer: 'Ça fonctionne, mais c''est une complexité sans bénéfice : c''est plus lent qu''un mutex, moins lisible, et un oubli de libération bloque tout. Pour un compteur, `atomic.Int64` suffit ; pour un état plus riche, un `sync.Mutex`. Les channels sont faits pour **communiquer** des données et coordonner des goroutines, pas pour protéger un état. Utiliser un mutex quand c''est la solution la plus simple n''a rien de honteux en Go.'
  - key: etat
    format: course
    question: Quel outil pour protéger un cache partagé entre goroutines ?
    answer: 'Un mutex (ou un RWMutex) à côté de la map : c''est un état partagé, pas un flux de données. Un channel ou une goroutine gardienne serait plus long et plus lent.'
  - key: flux
    format: course
    question: Quel outil pour distribuer des tâches à des workers ?
    answer: 'Un channel : il transfère la propriété de chaque tâche à un worker, et sa fermeture signale la fin du travail.'
  - key: vf-devise
    format: true-false
    question: La devise « partagez la mémoire en communiquant » interdit d'utiliser des mutex en Go.
    truth: false
    answer: Le package sync existe pour cela ; on choisit le plus simple.
  - key: vf-propriete
    format: true-false
    question: Envoyer un pointeur sur un channel transfère la propriété de la donnée, à condition que l'émetteur ne l'utilise plus ensuite.
    truth: true
    answer: Le channel synchronise, mais ne copie pas la donnée pointée.
  - key: vf-gardienne
    format: true-false
    question: Une goroutine propriétaire d'une map, servie par des messages, est toujours plus rapide qu'une map protégée par un mutex.
    truth: false
    answer: Chaque accès coûte deux passages par des channels ; elle est en général plus lente.
  - key: vf-coordination
    format: true-false
    question: Fermer un channel est un bon moyen de signaler l'arrêt à plusieurs goroutines.
    truth: true
    answer: Toutes les réceptions rendent la main ; c'est ce que fait ctx.Done().
  - key: qcm-channel
    format: multiple-choice
    question: Pour quels besoins un channel est-il le bon outil ?
    choices:
      - text: Envoyer des résultats d'un worker au consommateur
        correct: true
      - text: Signaler l'arrêt à des goroutines
        correct: true
      - text: Protéger un compteur incrémenté par chaque requête
        correct: false
      - text: Protéger une map de sessions lue par chaque requête
        correct: false
    answer: 'Les deux derniers sont des états partagés : mutex ou atomique.'
  - key: qcm-mutex
    format: multiple-choice
    question: Pour quels besoins un mutex est-il le bon outil ?
    choices:
      - text: Un cache en mémoire
        correct: true
      - text: L'état interne d'une struct appelée par plusieurs goroutines
        correct: true
      - text: Enchaîner les étapes d'un traitement
        correct: false
      - text: Attendre le premier de deux résultats
        correct: false
    answer: Enchaîner et attendre sont des affaires de channels et de select.
  - key: qcm-signes
    format: multiple-choice
    question: Quels signes montrent qu'un channel a été utilisé là où un mutex suffisait ?
    choices:
      - text: Un channel de capacité 1 utilisé comme verrou
        correct: true
      - text: Une goroutine qui ne fait que servir des Get et des Set sur une map
        correct: true
      - text: Un channel de tâches lu par des workers
        correct: false
      - text: Un channel fermé pour annoncer la fin
        correct: false
    answer: Les deux derniers sont des usages naturels.
  - key: qcm-devise
    format: multiple-choice
    question: Que signifie « partagez la mémoire en communiquant » ?
    choices:
      - text: Transmettre les données par des channels, pour qu'une seule goroutine les possède à la fois
        correct: true
      - text: Copier toutes les données avant de les partager
        correct: false
      - text: Partager toutes les variables globales
        correct: false
      - text: Ne jamais utiliser de pointeur
        correct: false
    answer: La synchronisation vient de la communication elle-même.
  - key: bug-verrou-channel
    format: bug-fix
    question: "Que proposes-tu pour ce code ?\n```go\ntype Stats struct {\n\tverrou chan struct{}\n\tvues   map[string]int\n}\n\nfunc (s *Stats) Ajouter(p string) {\n\ts.verrou <- struct{}{}\n\ts.vues[p]++\n\t<-s.verrou\n}\n```"
    answer: "```go\ntype Stats struct {\n\tmu   sync.Mutex\n\tvues map[string]int\n}\n\nfunc (s *Stats) Ajouter(p string) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.vues[p]++\n}\n```\nC'est un état partagé : un mutex dit l'intention, coûte moins, et le defer rend le verrou en cas de panique."
  - key: bug-gardienne
    format: bug-fix
    question: "Une goroutine gardienne sert un cache par messages, et le profil montre qu'elle est le goulot d'étranglement :\n```go\nfor req := range requetes {\n\tswitch req.op {\n\tcase \"get\":\n\t\treq.reponse <- cache[req.cle]\n\tcase \"set\":\n\t\tcache[req.cle] = req.valeur\n\t}\n}\n```"
    answer: "```go\ntype Cache struct {\n\tmu    sync.RWMutex\n\titems map[string]string\n}\n\nfunc (c *Cache) Get(k string) string {\n\tc.mu.RLock()\n\tdefer c.mu.RUnlock()\n\treturn c.items[k]\n}\n\nfunc (c *Cache) Set(k, v string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.items[k] = v\n}\n```\nTous les accès passaient en file par une seule goroutine et deux channels ; un verrou permet les lectures en\nparallèle et coûte bien moins."
  - key: bug-mutex-pipeline
    format: bug-fix
    question: "Un traitement en trois étapes est coordonné par un slice partagé, un mutex et une boucle qui attend des éléments avec `time.Sleep`. Que proposes-tu ?\n```go\nfor {\n\tmu.Lock()\n\tif len(aTraiter) == 0 {\n\t\tmu.Unlock()\n\t\ttime.Sleep(10 * time.Millisecond)\n\t\tcontinue\n\t}\n\te := aTraiter[0]\n\taTraiter = aTraiter[1:]\n\tmu.Unlock()\n\tetape2(e)\n}\n```"
    answer: "```go\netape1 := make(chan Element)\ngo produire(ctx, etape1)\nfor e := range etape1 {\n\tetape2(e)\n}\n```\nC'est un flux de données : un channel transmet chaque élément et bloque sans attente active, et sa fermeture\nannonce la fin."
  - key: bug-pointeur-partage
    format: bug-fix
    question: "Après l'envoi d'un lot sur le channel, le producteur continue de le remplir, et le consommateur voit des données changer :\n```go\nlot := make([]Ligne, 0, 100)\nfor l := range lignes {\n\tlot = append(lot, l)\n\tif len(lot) == 100 {\n\t\tsortie <- lot\n\t\tlot = lot[:0]\n\t}\n}\n```"
    answer: "```go\nlot := make([]Ligne, 0, 100)\nfor l := range lignes {\n\tlot = append(lot, l)\n\tif len(lot) == 100 {\n\t\tsortie <- lot\n\t\tlot = make([]Ligne, 0, 100) // un nouveau lot : l'ancien appartient au consommateur\n\t}\n}\n```\n`lot[:0]` réutilisait le tableau envoyé : le producteur écrasait des données dont le consommateur était devenu\npropriétaire."
  - key: scenario-choix
    format: scenario
    question: Comment choisis-tu entre un channel et un mutex ?
    answer: |-
      Je me demande si je transfère des données ou si je protège un état. Transfert de propriété, flux, coordination
      (fin, arrêt, premier résultat) : channel. État partagé consulté et modifié par plusieurs goroutines (cache,
      compteur, registre) : mutex ou atomique. Puis je prends la version la plus courte et la plus lisible, et je mesure
      si la performance compte.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande d'expliquer « Don't communicate by sharing memory; share memory by communicating ».
    answer: |-
      Plutôt que plusieurs goroutines qui modifient une même variable sous verrou, on fait circuler les données par des
      channels : à chaque instant une seule goroutine possède une donnée, donc pas de course possible sur elle. C'est un
      conseil de conception, pas une interdiction : pour un état partagé simple, le package sync reste le bon outil, et
      la bibliothèque standard en utilise beaucoup.
  - key: scenario-revue
    format: scenario
    question: En revue, comment repères-tu un mauvais choix entre channel et mutex ?
    answer: |-
      Un channel de capacité 1 ou une goroutine gardienne autour d'une simple map signalent un mutex déguisé. À l'inverse,
      un slice partagé sous mutex avec une boucle d'attente, ou plusieurs verrous pour faire avancer des étapes, signalent
      un flux qui serait plus clair avec des channels. Je regarde aussi la gestion de l'arrêt : les channels s'accordent
      bien avec select et le contexte.
