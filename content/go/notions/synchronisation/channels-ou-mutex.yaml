notion: channels-ou-mutex
lesson: "La devise de Go : **« Ne communiquez pas en partageant la mémoire ; partagez la mémoire en communiquant. »** Plutôt que\nplusieurs goroutines qui modifient le même état sous verrou, on **transmet** les données par un channel : une seule\ngoroutine en est propriétaire à un instant donné.\n\nMais la devise n'interdit pas les mutex. La règle pratique :\n\n| Besoin | Outil |\n|---|---|\n| transférer la **propriété** d'une donnée (une tâche, un résultat) | channel |\n| **coordonner** des goroutines : signal d'arrêt, fin de travail, pipeline | channel (ou context, WaitGroup) |\n| **protéger un état** partagé : cache, compteur, map de sessions | mutex (ou atomique) |\n| une goroutine **propriétaire** d'un état, servie par messages | channel |\n\n```go\n// un état partagé : un mutex est le plus simple\ntype Compteur struct {\n\tmu sync.Mutex\n\tn  map[string]int\n}\n\n// un transfert de travail : un channel exprime le flux\njobs := make(chan Tache)\n```\n\nLes signes qu'on a choisi le mauvais outil :\n- un channel de capacité 1 utilisé comme verrou, ou une goroutine « gardienne » qui ne fait que servir des lectures et\n  écritures d'une map : un mutex serait plus court et plus rapide ;\n- plusieurs mutex et des conditions pour enchaîner des étapes : un pipeline de channels serait plus clair.\n\n« Utilisez ce qui est le plus expressif et le plus simple » (Go Wiki, *MutexOrChannel*).\n\n**En entretien** : « Channels pour transférer des données et coordonner, mutex pour protéger un état ; on choisit\nle plus simple et le plus lisible, pas le plus idiomatique en apparence. »"
cards:
  - key: channel-mutex
    format: course
    question: "Quand préférer un channel à un mutex en Go ?"
    choices:
      - {text: "Pour transférer des données ou coordonner ; un mutex protège un état partagé", correct: true}
      - {text: "Toujours : la devise de Go interdit les mutex, sauf dans des cas extrêmes", correct: false}
      - {text: "Pour un état lu souvent ; un mutex sert aux flux de données entre étapes", correct: false}
      - {text: "Quand la performance compte, un channel coûtant moins cher qu'un verrou", correct: false}
    answer: "Un channel transfère des données et coordonne des goroutines (fin, arrêt, résultats) ; un mutex protège un état partagé. La devise de Go est un conseil de conception, pas une interdiction des mutex."
  - key: signifie-share-memory-by-communicating
    format: course
    question: "Que signifie la devise Go « share memory by communicating » ?"
    choices:
      - {text: "Faire circuler les données par des channels plutôt que les partager sous verrou", correct: true}
      - {text: "Copier chaque donnée avant de l'envoyer, pour qu'aucune mémoire ne soit partagée", correct: false}
      - {text: "Ne plus utiliser `sync.Mutex`, réservé au runtime, au profit des seuls channels", correct: false}
      - {text: "Communiquer par une mémoire partagée, en lisant les variables des autres goroutines", correct: false}
    answer: "Faire circuler les données par des channels : à chaque instant, une seule goroutine possède une donnée, donc aucune course sur elle. C'est un conseil de conception, pas une interdiction des mutex."
  - key: collegue-protege-compteur-avec-channel-bufferise
    format: scenario
    question: "Un collègue protège un compteur avec un channel bufferisé de taille 1, utilisé comme verrou. Que lui réponds-tu ?"
    choices:
      - {text: "Ça marche, mais un `atomic.Int64` ou un `sync.Mutex` serait plus simple et plus rapide", correct: true}
      - {text: "C'est l'usage idiomatique en Go : la devise demande des channels plutôt que des verrous", correct: false}
      - {text: "Ça ne marche pas : un channel de taille 1 laisse passer deux goroutines à la fois", correct: false}
      - {text: "Il faut agrandir le buffer au nombre de goroutines, pour éviter tout blocage", correct: false}
    answer: "Ça fonctionne, mais c'est plus lent qu'un mutex, moins lisible, et un oubli de libération bloque tout. Pour un compteur, `atomic.Int64` suffit ; les channels servent à communiquer et à coordonner, pas à protéger un état."
  - key: etat
    format: course
    question: "Quel outil choisir pour protéger un cache partagé entre goroutines ?"
    choices:
      - {text: "Un `sync.Mutex` ou un `sync.RWMutex` à côté de la map, dans une struct", correct: true}
      - {text: "Une goroutine gardienne qui sert les lectures et les écritures par des channels", correct: false}
      - {text: "Un channel bufferisé de la taille du cache, qui contient toutes les entrées", correct: false}
      - {text: "Un `sync.WaitGroup` qui attend la fin des écritures avant chaque lecture", correct: false}
    answer: "C'est un état partagé, pas un flux de données : un mutex (ou un RWMutex) à côté de la map. Une goroutine gardienne marcherait, mais serait plus longue à écrire et plus lente."
  - key: flux
    format: course
    question: "Quel outil choisir pour distribuer des tâches à des workers ?"
    choices:
      - {text: "Un channel de tâches, que les workers lisent et que le producteur ferme à la fin", correct: true}
      - {text: "Un slice de tâches sous mutex, que chaque worker consulte en boucle avec un `Sleep`", correct: false}
      - {text: "Une `sync.Map` dont chaque worker supprime les tâches qu'il prend en charge", correct: false}
      - {text: "Une variable globale `tache`, que le producteur réécrit et que chaque worker lit", correct: false}
    answer: "Un channel : il transfère la propriété de chaque tâche à un seul worker, bloque sans attente active, et sa fermeture signale la fin du travail."
  - key: vf-devise
    format: true-false
    question: "La devise « partage la mémoire en communiquant » interdit d'utiliser des mutex en Go."
    truth: false
    answer: Le package sync existe pour cela ; on choisit le plus simple.
  - key: vf-propriete
    format: true-false
    question: Envoyer un pointeur sur un channel transfère la propriété de la donnée, à condition que l'émetteur ne l'utilise plus ensuite.
    truth: true
    answer: Le channel synchronise, mais ne copie pas la donnée pointée.
  - key: vf-gardienne
    format: true-false
    question: Une goroutine propriétaire d'une map, servie par des messages, est toujours plus rapide qu'une map protégée par un mutex.
    truth: false
    answer: Chaque accès coûte deux passages par des channels ; elle est en général plus lente.
  - key: vf-coordination
    format: true-false
    question: Fermer un channel est un bon moyen de signaler l'arrêt à plusieurs goroutines.
    truth: true
    answer: Toutes les réceptions rendent la main ; c'est ce que fait ctx.Done().
  - key: qcm-channel
    format: multiple-choice
    question: "Pour lequel de ces besoins un channel est-il le bon outil ?"
    choices:
      - {text: "Envoyer les résultats d'un worker au consommateur", correct: true}
      - {text: "Protéger un compteur incrémenté par chaque requête", correct: false}
      - {text: "Protéger une map de sessions lue par chaque requête", correct: false}
      - {text: "Garder l'état interne d'une struct appelée de partout", correct: false}
    answer: "Transmettre des résultats est un flux : un channel, comme pour signaler l'arrêt à des goroutines. Le compteur, la map et l'état d'une struct sont des états partagés : mutex ou atomique."
  - key: qcm-mutex
    format: multiple-choice
    question: "Pour lequel de ces besoins un mutex est-il le bon outil ?"
    choices:
      - {text: "Protéger un cache en mémoire lu et écrit par les requêtes", correct: true}
      - {text: "Enchaîner les étapes d'un traitement en pipeline", correct: false}
      - {text: "Attendre le premier de deux résultats calculés en parallèle", correct: false}
      - {text: "Annoncer aux workers que le travail est fini", correct: false}
    answer: "Un cache est un état partagé : un mutex le protège, comme l'état interne d'une struct appelée par plusieurs goroutines. Enchaîner des étapes, attendre le premier résultat ou annoncer la fin sont des affaires de channels et de `select`."
  - key: qcm-signes
    format: multiple-choice
    question: "Lequel de ces signes montre qu'un channel a été utilisé là où un mutex suffisait ?"
    choices:
      - {text: "Un channel de capacité 1 utilisé comme verrou autour d'une map", correct: true}
      - {text: "Un channel de tâches lu par plusieurs workers en parallèle", correct: false}
      - {text: "Un channel fermé pour annoncer la fin du travail aux workers", correct: false}
      - {text: "Un channel de résultats lu par un seul consommateur", correct: false}
    answer: "Un channel de capacité 1 qui sert de verrou est un mutex déguisé, comme une goroutine qui ne fait que servir des Get et des Set sur une map. Distribuer des tâches, annoncer la fin ou remonter des résultats sont des usages naturels."
  - key: qcm-devise
    format: multiple-choice
    question: "Que veut dire la devise de Go « partage la mémoire en communiquant » ?"
    choices:
      - {text: "Transmettre les données par des channels, pour qu'une seule goroutine les possède à la fois", correct: true}
      - {text: "Copier toutes les données avant de les partager, pour que chacun ait sa propre version", correct: false}
      - {text: "Partager toutes les variables globales, que les goroutines lisent ensuite sans verrou", correct: false}
      - {text: "Ne jamais utiliser de pointeur, pour que chaque goroutine travaille sur une copie", correct: false}
    answer: La synchronisation vient de la communication elle-même.
  - key: bug-verrou-channel
    format: bug-fix
    question: |-
      Ton collègue protège un compteur de vues avec un channel utilisé comme verrou :
      ```go
      type Stats struct {
      	verrou chan struct{}
      	vues   map[string]int
      }

      func (s *Stats) Ajouter(p string) {
      	s.verrou <- struct{}{}
      	s.vues[p]++
      	<-s.verrou
      }
      ```
      Que proposes-tu ?
    choices:
      - {text: "Un `sync.Mutex` à la place du channel, avec `Lock` et `defer Unlock`", correct: true}
      - {text: "Un channel bufferisé de capacité 2, pour laisser passer deux goroutines", correct: false}
      - {text: "Une `sync.Map` à la place de la map, en gardant le channel comme verrou", correct: false}
      - {text: "Rien : un channel est toujours plus idiomatique qu'un mutex en Go", correct: false}
    answer: |-
      ```go
      type Stats struct {
      	mu   sync.Mutex
      	vues map[string]int
      }

      func (s *Stats) Ajouter(p string) {
      	s.mu.Lock()
      	defer s.mu.Unlock()
      	s.vues[p]++
      }
      ```
      C'est un état partagé : un mutex dit l'intention, coûte moins, et le `defer` rend le verrou même en cas de panic, ce que le channel ne faisait pas.
  - key: bug-gardienne
    format: bug-fix
    question: |-
      Une goroutine gardienne sert un cache par messages, et le profil montre qu'elle est le goulot d'étranglement :
      ```go
      for req := range requetes {
      	switch req.op {
      	case "get":
      		req.reponse <- cache[req.cle]
      	case "set":
      		cache[req.cle] = req.valeur
      	}
      }
      ```
      Que proposes-tu ?
    choices:
      - {text: "Un cache protégé par un `sync.RWMutex`, pour que les lectures passent en parallèle", correct: true}
      - {text: "Plus de buffer sur le channel `requetes`, pour absorber les pics de charge", correct: false}
      - {text: "Une seconde goroutine gardienne qui lit le même channel `requetes`", correct: false}
      - {text: "Un `select` avec `default`, pour ne jamais bloquer la goroutine gardienne", correct: false}
    answer: |-
      ```go
      type Cache struct {
      	mu    sync.RWMutex
      	items map[string]string
      }

      func (c *Cache) Get(k string) string {
      	c.mu.RLock()
      	defer c.mu.RUnlock()
      	return c.items[k]
      }

      func (c *Cache) Set(k, v string) {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	c.items[k] = v
      }
      ```
      Tous les accès passaient en file par une seule goroutine et deux channels ; un verrou permet les lectures en parallèle et coûte bien moins. Plus de buffer ne change rien au goulot : une seule goroutine traite tout.
  - key: bug-mutex-pipeline
    format: bug-fix
    question: |-
      Un traitement en trois étapes est coordonné par un slice partagé, un mutex et une boucle qui attend des éléments avec `time.Sleep` :
      ```go
      for {
      	mu.Lock()
      	if len(aTraiter) == 0 {
      		mu.Unlock()
      		time.Sleep(10 * time.Millisecond)
      		continue
      	}
      	e := aTraiter[0]
      	aTraiter = aTraiter[1:]
      	mu.Unlock()
      	etape2(e)
      }
      ```
      Que proposes-tu ?
    choices:
      - {text: "Un channel entre les étapes, lu avec `range` et fermé par le producteur", correct: true}
      - {text: "Un `time.Sleep` plus court, d'une milliseconde, pour réduire la latence", correct: false}
      - {text: "Un `sync.RWMutex` à la place du mutex, pour que les lectures soient parallèles", correct: false}
      - {text: "Un `atomic.Int64` qui compte les éléments, testé avant de prendre le verrou", correct: false}
    answer: |-
      ```go
      etape1 := make(chan Element)
      go produire(ctx, etape1)
      for e := range etape1 {
      	etape2(e)
      }
      ```
      C'est un flux de données : un channel transmet chaque élément et bloque sans attente active, et sa fermeture annonce la fin. Raccourcir le sommeil garde l'attente active et consomme plus de processeur.
  - key: bug-pointeur-partage
    format: bug-fix
    question: |-
      Après l'envoi d'un lot sur le channel, le producteur continue de le remplir, et le consommateur voit des données changer :
      ```go
      lot := make([]Ligne, 0, 100)
      for l := range lignes {
      	lot = append(lot, l)
      	if len(lot) == 100 {
      		sortie <- lot
      		lot = lot[:0]
      	}
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Allouer un nouveau lot avec `make` après chaque envoi, au lieu de `lot[:0]`", correct: true}
      - {text: "Envoyer `&lot` plutôt que `lot`, pour que le consommateur ait sa propre copie", correct: false}
      - {text: "Rendre `sortie` bufferisé, pour que le lot soit copié dans le buffer du channel", correct: false}
      - {text: "Vider le lot avec `clear(lot)` avant `lot[:0]`, pour effacer les anciennes lignes", correct: false}
    answer: |-
      ```go
      lot := make([]Ligne, 0, 100)
      for l := range lignes {
      	lot = append(lot, l)
      	if len(lot) == 100 {
      		sortie <- lot
      		lot = make([]Ligne, 0, 100) // un nouveau lot : l'ancien appartient au consommateur
      	}
      }
      ```
      `lot[:0]` réutilisait le tableau envoyé : le producteur écrasait des données dont le consommateur était devenu propriétaire. Un channel bufferisé ne copie que l'en-tête du slice, pas son tableau.
  - key: scenario-choix
    format: scenario
    question: "Comment choisis-tu entre un channel et un mutex ?"
    choices:
      - {text: "Je me demande si je transfère des données (channel) ou si je protège un état (mutex)", correct: true}
      - {text: "Je prends toujours un channel, plus idiomatique, et un mutex en dernier recours", correct: false}
      - {text: "Je prends un mutex pour les flux entre étapes, et un channel pour un cache partagé", correct: false}
      - {text: "Je prends le plus rapide sur un micro-benchmark, quelle que soit la forme du problème", correct: false}
    answer: "Transfert de propriété, flux, coordination (fin, arrêt, premier résultat) : channel. État partagé consulté et modifié par plusieurs goroutines (cache, compteur, registre) : mutex ou atomique. Puis je prends la version la plus lisible, et je mesure si la performance compte."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande d'expliquer « Don't communicate by sharing memory; share memory by communicating ». Que réponds-tu ?"
    choices:
      - {text: "Faire circuler les données par des channels, pour qu'une seule goroutine les possède : un conseil, pas un interdit", correct: true}
      - {text: "Partager les données par des variables globales, que Go rend visibles à toutes les goroutines sans verrou", correct: false}
      - {text: "Ne jamais utiliser `sync.Mutex` : la bibliothèque standard l'évite, et les channels le remplacent toujours", correct: false}
      - {text: "Copier chaque donnée avant de la transmettre, pour que les goroutines ne partagent aucune mémoire", correct: false}
    answer: "Plutôt que plusieurs goroutines qui modifient une même variable sous verrou, on fait circuler les données par des channels : une seule goroutine possède une donnée à la fois, donc pas de course sur elle. Pour un état partagé simple, le package `sync` reste le bon outil, et la bibliothèque standard en utilise beaucoup."
  - key: scenario-revue
    format: scenario
    question: "En revue, comment repères-tu un mauvais choix entre channel et mutex ?"
    choices:
      - {text: "Un channel de capacité 1 ou une goroutine gardienne autour d'une map trahissent un mutex déguisé", correct: true}
      - {text: "Tout mutex dans du code Go trahit un mauvais choix, à remplacer par un channel", correct: false}
      - {text: "Un channel de tâches lu par plusieurs workers trahit un mutex qui aurait suffi", correct: false}
      - {text: "Une goroutine qui ferme un channel pour annoncer la fin trahit un mutex déguisé", correct: false}
    answer: "Un channel de capacité 1 ou une goroutine gardienne autour d'une simple map sont des mutex déguisés. À l'inverse, un slice partagé sous mutex avec une boucle d'attente signale un flux plus clair avec des channels."
