notion: once
lesson: "**`sync.Once`** exécute une fonction **une seule fois**, même si plusieurs goroutines l'appellent en même temps. Les\nautres appels attendent la fin de cette première exécution, puis rendent la main.\n\n```go\nvar (\n\tonce  sync.Once\n\tmotif *regexp.Regexp\n)\n\nfunc Motif() *regexp.Regexp {\n\tonce.Do(func() {\n\t\tmotif = regexp.MustCompile(`^[a-z]+$`)\n\t})\n\treturn motif\n}\n```\n\nDepuis Go 1.21, trois fonctions évitent les variables globales séparées :\n\n```go\nvar motif = sync.OnceValue(func() *regexp.Regexp {\n\treturn regexp.MustCompile(`^[a-z]+$`)\n})\n// motif() compile au premier appel, puis renvoie toujours la même valeur\n\nvar charger = sync.OnceValues(func() (Config, error) {\n\treturn lireConfig(\"app.yaml\")\n})\n// cfg, err := charger()\n\nvar fermer = sync.OnceFunc(func() { close(arret) }) // fermer() plusieurs fois sans panique\n```\n\nCe qu'il faut savoir :\n- si la fonction **panique**, `Once.Do` la considère quand même comme faite : les appels suivants ne la relancent\n  pas. Avec `OnceFunc` et `OnceValue`, chaque appel suivant **repanique** avec la même valeur ;\n- une **erreur** n'est pas réessayée : `OnceValues` mémorise l'erreur et la renvoie à chaque appel ;\n- appeler `once.Do` depuis la fonction passée à ce même `Do` **bloque** pour toujours ;\n- un `sync.Once` ne se copie pas et ne se réinitialise pas.\n\n**En entretien** : « Once pour une initialisation paresseuse et sûre ; OnceValue et OnceValues depuis Go 1.21 ;\nl'erreur et la panique sont mémorisées, pas réessayées. »"
cards:
  - key: garantit-sync-once
    format: course
    question: "Que garantit `sync.Once` ?"
    choices:
      - {text: "Que la fonction s'exécute une seule fois, et que tous les appelants voient son effet", correct: true}
      - {text: "Que la fonction s'exécute une fois par goroutine, sans verrou partagé entre elles", correct: false}
      - {text: "Que la fonction est réessayée jusqu'à ce qu'elle se termine sans panic", correct: false}
      - {text: "Que la fonction s'exécute au démarrage du programme, comme une fonction `init`", correct: false}
    answer: "Que la fonction passée à `Do` s'exécute exactement une fois, même appelée par plusieurs goroutines, et que tous les appelants voient ses écritures au retour de `Do`. Elle s'exécute au premier appel, pas au démarrage."
  - key: apportent-sync-oncefunc-oncevalue-oncevalues
    format: course
    question: "Qu'apportent `sync.OnceFunc`, `sync.OnceValue` et `sync.OnceValues` ?"
    choices:
      - {text: "Des fonctions mémoïsées, qui font l'initialisation une fois et renvoient son résultat", correct: true}
      - {text: "Des variantes de `Once` qui réessaient l'initialisation tant qu'elle renvoie une erreur", correct: false}
      - {text: "Des variantes de `Once` qui exécutent la fonction une fois par goroutine appelante", correct: false}
      - {text: "Des remplaçants de `init`, exécutés au démarrage dans l'ordre de leur déclaration", correct: false}
    answer: "Depuis Go 1.21, elles enveloppent une fonction et renvoient une fonction mémoïsée : `OnceFunc` sans résultat, `OnceValue` avec une valeur, `OnceValues` avec une valeur et une erreur. L'erreur est mémorisée, pas réessayée."
  - key: erreur
    format: course
    question: Que se passe-t-il si l'initialisation passée à `sync.OnceValues` renvoie une erreur ?
    choices:
      - {text: "L'erreur est mémorisée : chaque appel suivant renvoie la même erreur, sans réessayer", correct: true}
      - {text: "L'initialisation est relancée au prochain appel, jusqu'à ce qu'elle réussisse", correct: false}
      - {text: "L'appel panique avec l'erreur, puis l'initialisation est relancée la fois suivante", correct: false}
      - {text: "L'erreur est renvoyée une fois, puis les appels suivants renvoient une valeur nulle", correct: false}
    answer: "L'erreur est mémorisée : chaque appel suivant renvoie la même valeur et la même erreur, sans réessayer. Pour réessayer après un échec passager, il faut un autre mécanisme (un mutex et un état)."
  - key: panique
    format: course
    question: Que se passe-t-il si la fonction passée à `once.Do` panique ?
    choices:
      - {text: "`Do` la considère comme exécutée : les appels suivants ne la relancent pas", correct: true}
      - {text: "`Do` la relance au prochain appel, jusqu'à ce qu'elle finisse sans panic", correct: false}
      - {text: "`Do` rattrape la panic et la renvoie comme une erreur à chaque appel", correct: false}
      - {text: "`Do` reste verrouillé, et tous les appels suivants bloquent pour toujours", correct: false}
    answer: "`Do` la considère comme exécutée : les appels suivants ne la relancent pas, et la valeur reste non initialisée. `OnceFunc` et `OnceValue`, eux, repaniquent à chaque appel avec la même valeur."
  - key: vf-une-fois
    format: true-false
    question: Si dix goroutines appellent `once.Do(f)` en même temps, `f` s'exécute une seule fois.
    truth: true
    answer: Et les neuf autres attendent qu'elle soit terminée.
  - key: vf-attente
    format: true-false
    question: Les goroutines qui appellent `once.Do` pendant la première exécution rendent la main immédiatement, avant la fin de l'initialisation.
    truth: false
    answer: 'Elles attendent la fin : elles voient donc la valeur initialisée.'
  - key: vf-reset
    format: true-false
    question: On peut réinitialiser un sync.Once pour relancer la fonction.
    truth: false
    answer: Il n'a pas de méthode Reset ; il faut un autre mécanisme.
  - key: vf-oncevalue
    format: true-false
    question: '`sync.OnceValue` existe depuis Go 1.21.'
    truth: true
    answer: Avec OnceFunc et OnceValues.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Lesquelles de ces fonctions du package sync existent pour une exécution unique ?"
    choices:
      - text: '`sync.OnceFunc`'
        correct: true
      - text: '`sync.OnceValue`'
        correct: true
      - text: '`sync.OnceValues`'
        correct: true
      - text: '`sync.OnceError`'
        correct: false
    answer: OnceValues renvoie une valeur et une erreur.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lequel de ces cas `sync.Once` convient-il ?"
    choices:
      - {text: "Compiler une expression régulière à son premier usage", correct: true}
      - {text: "Réessayer une connexion jusqu'à son premier succès", correct: false}
      - {text: "Compter le nombre d'appels d'une fonction partagée", correct: false}
      - {text: "Recharger la configuration à chaque modification", correct: false}
    answer: "Une initialisation paresseuse faite une fois : `Once` convient, comme pour fermer un channel d'arrêt sans double fermeture. Une erreur n'est pas réessayée, et `Once` ne compte rien ni ne recharge."
  - key: qcm-recursif
    format: multiple-choice
    question: Que se passe-t-il si la fonction passée à `once.Do` appelle elle-même `once.Do` ?
    choices:
      - text: Le programme se bloque
        correct: true
      - text: L'appel intérieur ne fait rien
        correct: false
      - text: La fonction s'exécute deux fois
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: L'appel intérieur attend la fin du premier, qui l'attend.
  - key: qcm-vs-init
    format: multiple-choice
    question: "Pourquoi préférer `sync.OnceValue` à une fonction `init` pour une ressource coûteuse ?"
    choices:
      - {text: "Elle n'est construite que si on s'en sert, au premier appel", correct: true}
      - {text: "`init` n'est pas sûre quand plusieurs goroutines tournent", correct: false}
      - {text: "`init` ne peut appeler aucune autre fonction du package", correct: false}
      - {text: "`init` s'exécute de nouveau à chaque import du package", correct: false}
    answer: "`init` s'exécute avant `main`, sur une seule goroutine, et toujours ; `OnceValue` ne construit la ressource que si on s'en sert, ce qui garde aussi rapide le démarrage du programme et des tests."
  - key: trous-do
    format: fill-in
    question: |-
      Complète l'initialisation unique :
      ```go
      var once sync.Once
      once.___(func() {
      	client = nouveauClient()
      })
      ```
    blanks:
      - - Do
    answer: Do exécute la fonction une seule fois.
  - key: trous-oncevalue
    format: fill-in
    question: |-
      Complète pour mémoriser la valeur :
      ```go
      var motif = sync.___(func() *regexp.Regexp {
      	return regexp.MustCompile(`\d+`)
      })
      ```
    blanks:
      - - OnceValue
    answer: OnceValue renvoie une fonction qui calcule la valeur au premier appel.
  - key: trous-oncevalues
    format: fill-in
    question: |-
      Complète pour une valeur et une erreur :
      ```go
      var config = sync.___(func() (Config, error) {
      	return lire("app.yaml")
      })
      ```
    blanks:
      - - OnceValues
    answer: OnceValues pour deux résultats.
  - key: trous-oncefunc
    format: fill-in
    question: |-
      Complète pour pouvoir appeler arreter plusieurs fois sans panique :
      ```go
      arreter := sync.___(func() { close(stop) })
      ```
    blanks:
      - - OnceFunc
    answer: OnceFunc ferme le channel une seule fois.
  - key: code-une-fois
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var once sync.Once
      var wg sync.WaitGroup
      appels := 0
      for range 10 {
      	wg.Go(func() {
      		once.Do(func() { appels++ })
      	})
      }
      wg.Wait()
      fmt.Println(appels)
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Un nombre variable, entre `1` et `10`", correct: false}
    answer: "`1` : `once.Do` exécute la fonction une seule fois, quel que soit le nombre de goroutines qui l'appellent, et `Wait` rend l'écriture visible."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once\n\tvar wg sync.WaitGroup\n\tappels := 0\n\tfor range 10 {\n\t\twg.Go(func() {\n\t\t\tonce.Do(func() { appels++ })\n\t\t})\n\t}\n\twg.Wait()\n\tfmt.Println(appels)\n}\n"
      output: '1'
  - key: code-oncevalue
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      n := 0
      valeur := sync.OnceValue(func() int {
      	n++
      	return n * 10
      })
      fmt.Println(valeur(), valeur(), n)
      ```
    choices:
      - {text: "`10 10 1`", correct: true}
      - {text: "`10 20 2`", correct: false}
      - {text: "`10 10 2`", correct: false}
      - {text: "`10 10 0`", correct: false}
    answer: "`10 10 1` : la fonction est calculée au premier appel, puis la valeur est réutilisée ; `n` n'a été incrémenté qu'une fois, et il est lu après les deux appels."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tn := 0\n\tvaleur := sync.OnceValue(func() int {\n\t\tn++\n\t\treturn n * 10\n\t})\n\tfmt.Println(valeur(), valeur(), n)\n}\n"
      output: 10 10 1
  - key: code-erreur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      essais := 0
      charger := sync.OnceValues(func() (string, error) {
      	essais++
      	return "", errors.New("indisponible")
      })
      _, err1 := charger()
      _, err2 := charger()
      fmt.Println(err1, err2, essais)
      ```
    choices:
      - {text: "`indisponible indisponible 1`", correct: true}
      - {text: "`indisponible indisponible 2`", correct: false}
      - {text: "`indisponible <nil> 1`", correct: false}
      - {text: "`<nil> <nil> 1`", correct: false}
    answer: "`indisponible indisponible 1` : la fonction ne s'exécute qu'une fois, et son erreur est mémorisée, pas réessayée."
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tessais := 0\n\tcharger := sync.OnceValues(func() (string, error) {\n\t\tessais++\n\t\treturn \"\", errors.New(\"indisponible\")\n\t})\n\t_, err1 := charger()\n\t_, err2 := charger()\n\tfmt.Println(err1, err2, essais)\n}\n"
      output: indisponible indisponible 1
  - key: code-oncefunc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      stop := make(chan struct{})
      arreter := sync.OnceFunc(func() { close(stop) })
      arreter()
      arreter()
      _, ouvert := <-stop
      fmt.Println(ouvert)
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Une panic : `close of closed channel`", correct: false}
      - {text: "Rien : la réception bloque pour toujours", correct: false}
    answer: "`false` : le channel est fermé une seule fois, sans panic au second appel, et une réception sur un channel fermé renvoie aussitôt la valeur zéro et `false`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tstop := make(chan struct{})\n\tarreter := sync.OnceFunc(func() { close(stop) })\n\tarreter()\n\tarreter()\n\t_, ouvert := <-stop\n\tfmt.Println(ouvert)\n}\n"
      output: 'false'
  - key: bug-double-check
    format: bug-fix
    question: |-
      Le détecteur de courses signale l'initialisation paresseuse :
      ```go
      var client *Client

      func Obtenir() *Client {
      	if client == nil {
      		client = nouveauClient()
      	}
      	return client
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Remplacer `Obtenir` par un `sync.OnceValue` qui appelle `nouveauClient`", correct: true}
      - {text: "Tester `client == nil` deux fois de suite, pour éviter de créer deux clients", correct: false}
      - {text: "Créer le client dans une goroutine lancée par `Obtenir`, sans l'attendre", correct: false}
      - {text: "Déclarer `client` en variable locale d'`Obtenir` plutôt qu'en globale", correct: false}
    answer: |-
      ```go
      var Obtenir = sync.OnceValue(func() *Client {
      	return nouveauClient()
      })
      ```
      Deux goroutines pouvaient tester `nil` en même temps et créer deux clients, avec une course sur la variable ; `OnceValue` initialise une seule fois et publie la valeur proprement.
  - key: bug-erreur
    format: bug-fix
    question: |-
      Après une panne passagère de la base au démarrage, le service reste en erreur jusqu'au redémarrage :
      ```go
      var connexion = sync.OnceValues(func() (*sql.DB, error) {
      	return ouvrir()
      })
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un mutex et un état : on garde la connexion réussie, et l'on réessaie après un échec", correct: true}
      - {text: "Remplacer `sync.OnceValues` par `sync.OnceValue`, qui ne mémorise pas les erreurs", correct: false}
      - {text: "Appeler `connexion()` deux fois au démarrage, pour laisser une seconde chance à la base", correct: false}
      - {text: "Paniquer dans la fonction en cas d'erreur, pour que `OnceValues` la relance ensuite", correct: false}
    answer: |-
      ```go
      type Connexion struct {
      	mu sync.Mutex
      	db *sql.DB
      }

      func (c *Connexion) Obtenir() (*sql.DB, error) {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	if c.db != nil {
      		return c.db, nil
      	}
      	db, err := ouvrir()
      	if err != nil {
      		return nil, err // on réessaiera au prochain appel
      	}
      	c.db = db
      	return db, nil
      }
      ```
      `OnceValues` mémorise l'erreur pour toujours, et une panic serait mémorisée elle aussi ; quand l'échec peut être passager, un mutex et un état permettent de réessayer.
  - key: bug-double-close
    format: bug-fix
    question: |-
      L'arrêt panique avec « close of closed channel » quand il est déclenché par le signal et par une erreur :
      ```go
      func (s *Serveur) Arreter() {
      	close(s.stop)
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un champ `stopOnce sync.Once`, et `close` appelé dans `s.stopOnce.Do`", correct: true}
      - {text: "Un `recover` dans `Arreter`, pour ignorer la panic de la seconde fermeture", correct: false}
      - {text: "Tester `if s.stop != nil` avant de fermer le channel", correct: false}
      - {text: "Lire `<-s.stop` avant `close`, pour savoir s'il est déjà fermé", correct: false}
    answer: |-
      ```go
      type Serveur struct {
      	stop     chan struct{}
      	stopOnce sync.Once
      }

      func (s *Serveur) Arreter() {
      	s.stopOnce.Do(func() { close(s.stop) })
      }
      ```
      `Once` garantit une seule fermeture, quel que soit le nombre d'appels. Un channel fermé n'est pas nil, et une réception sur un channel encore ouvert bloquerait `Arreter`.
  - key: bug-copie
    format: bug-fix
    question: |-
      L'initialisation s'exécute à chaque appel :
      ```go
      type Service struct {
      	once  sync.Once
      	cache map[string]string
      }

      func (s Service) Cache() map[string]string {
      	s.once.Do(func() { s.cache = charger() })
      	return s.cache
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un récepteur pointeur : `func (s *Service) Cache()`", correct: true}
      - {text: "Un `sync.Once` global, déclaré hors de la struct", correct: false}
      - {text: "Un booléen `charge`, testé avant d'appeler `charger`", correct: false}
      - {text: "Appeler `s.once.Do` deux fois, pour bien enregistrer l'état", correct: false}
    answer: |-
      ```go
      func (s *Service) Cache() map[string]string {
      	s.once.Do(func() { s.cache = charger() })
      	return s.cache
      }
      ```
      Le récepteur valeur copiait le `Once` (et la map) à chaque appel : chaque copie neuve relançait l'initialisation. Avec un pointeur, l'état est partagé ; `go vet` signale d'ailleurs cette copie de verrou.
