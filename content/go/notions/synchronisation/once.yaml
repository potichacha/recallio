notion: once
lesson: "**`sync.Once`** exécute une fonction **une seule fois**, même si plusieurs goroutines l'appellent en même temps. Les\nautres appels attendent la fin de cette première exécution, puis rendent la main.\n\n```go\nvar (\n\tonce  sync.Once\n\tmotif *regexp.Regexp\n)\n\nfunc Motif() *regexp.Regexp {\n\tonce.Do(func() {\n\t\tmotif = regexp.MustCompile(`^[a-z]+$`)\n\t})\n\treturn motif\n}\n```\n\nDepuis Go 1.21, trois fonctions évitent les variables globales séparées :\n\n```go\nvar motif = sync.OnceValue(func() *regexp.Regexp {\n\treturn regexp.MustCompile(`^[a-z]+$`)\n})\n// motif() compile au premier appel, puis renvoie toujours la même valeur\n\nvar charger = sync.OnceValues(func() (Config, error) {\n\treturn lireConfig(\"app.yaml\")\n})\n// cfg, err := charger()\n\nvar fermer = sync.OnceFunc(func() { close(arret) }) // fermer() plusieurs fois sans panique\n```\n\nCe qu'il faut savoir :\n- si la fonction **panique**, `Once.Do` la considère quand même comme faite : les appels suivants ne la relancent\n  pas. Avec `OnceFunc` et `OnceValue`, chaque appel suivant **repanique** avec la même valeur ;\n- une **erreur** n'est pas réessayée : `OnceValues` mémorise l'erreur et la renvoie à chaque appel ;\n- appeler `once.Do` depuis la fonction passée à ce même `Do` **bloque** pour toujours ;\n- un `sync.Once` ne se copie pas et ne se réinitialise pas.\n\n**En entretien** : « Once pour une initialisation paresseuse et sûre ; OnceValue et OnceValues depuis Go 1.21 ;\nl'erreur et la panique sont mémorisées, pas réessayées. »"
cards:
  - key: garantit-sync-once
    format: course
    question: Que garantit sync.Once ?
    answer: Que la fonction s'exécute exactement une fois, et que tous les appelants voient son effet.
  - key: apportent-sync-oncefunc-oncevalue-oncevalues
    format: course
    question: Qu'apportent sync.OnceFunc, OnceValue, OnceValues ?
    answer: Des variantes de Once qui renvoient une fonction mémoïsée, avec valeur et éventuellement erreur (Go 1.21).
  - key: erreur
    format: course
    question: Que se passe-t-il si l'initialisation passée à `sync.OnceValues` renvoie une erreur ?
    answer: 'L''erreur est mémorisée : chaque appel suivant renvoie la même valeur et la même erreur, sans réessayer. Pour réessayer, il faut un autre mécanisme (un mutex et un état).'
  - key: panique
    format: course
    question: Que se passe-t-il si la fonction passée à `once.Do` panique ?
    answer: 'Do la considère comme exécutée : les appels suivants ne la relancent pas (et la valeur reste non initialisée). OnceFunc et OnceValue, eux, repaniquent à chaque appel.'
  - key: vf-une-fois
    format: true-false
    question: Si dix goroutines appellent `once.Do(f)` en même temps, `f` s'exécute une seule fois.
    truth: true
    answer: Et les neuf autres attendent qu'elle soit terminée.
  - key: vf-attente
    format: true-false
    question: Les goroutines qui appellent `once.Do` pendant la première exécution rendent la main immédiatement, avant la fin de l'initialisation.
    truth: false
    answer: 'Elles attendent la fin : elles voient donc la valeur initialisée.'
  - key: vf-reset
    format: true-false
    question: On peut réinitialiser un sync.Once pour relancer la fonction.
    truth: false
    answer: Il n'a pas de méthode Reset ; il faut un autre mécanisme.
  - key: vf-oncevalue
    format: true-false
    question: '`sync.OnceValue` existe depuis Go 1.21.'
    truth: true
    answer: Avec OnceFunc et OnceValues.
  - key: qcm-fonctions
    format: multiple-choice
    question: Quelles fonctions du package sync existent pour une exécution unique ?
    choices:
      - text: '`sync.OnceFunc`'
        correct: true
      - text: '`sync.OnceValue`'
        correct: true
      - text: '`sync.OnceValues`'
        correct: true
      - text: '`sync.OnceError`'
        correct: false
    answer: OnceValues renvoie une valeur et une erreur.
  - key: qcm-usages
    format: multiple-choice
    question: Dans quels cas sync.Once convient-il ?
    choices:
      - text: Compiler une expression régulière au premier usage
        correct: true
      - text: Fermer un channel d'arrêt depuis plusieurs endroits sans double fermeture
        correct: true
      - text: Réessayer une connexion jusqu'au succès
        correct: false
      - text: Compter le nombre d'appels
        correct: false
    answer: Une erreur n'est pas réessayée.
  - key: qcm-recursif
    format: multiple-choice
    question: Que se passe-t-il si la fonction passée à `once.Do` appelle elle-même `once.Do` ?
    choices:
      - text: Le programme se bloque
        correct: true
      - text: L'appel intérieur ne fait rien
        correct: false
      - text: La fonction s'exécute deux fois
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: L'appel intérieur attend la fin du premier, qui l'attend.
  - key: qcm-vs-init
    format: multiple-choice
    question: Pourquoi préférer sync.OnceValue à une fonction init pour une ressource coûteuse ?
    choices:
      - text: Elle n'est construite que si on s'en sert
        correct: true
      - text: Le démarrage du programme et des tests reste rapide
        correct: true
      - text: init n'est pas sûre entre goroutines
        correct: false
      - text: init ne peut pas appeler de fonction
        correct: false
    answer: init s'exécute avant main, sur une seule goroutine, et toujours.
  - key: trous-do
    format: fill-in
    question: "Complétez l'initialisation unique :\n```go\nvar once sync.Once\nonce.___(func() {\n\tclient = nouveauClient()\n})\n```"
    blanks:
      - - Do
    answer: Do exécute la fonction une seule fois.
  - key: trous-oncevalue
    format: fill-in
    question: "Complétez pour mémoriser la valeur :\n```go\nvar motif = sync.___(func() *regexp.Regexp {\n\treturn regexp.MustCompile(`\\d+`)\n})\n```"
    blanks:
      - - OnceValue
    answer: OnceValue renvoie une fonction qui calcule la valeur au premier appel.
  - key: trous-oncevalues
    format: fill-in
    question: "Complétez pour une valeur et une erreur :\n```go\nvar config = sync.___(func() (Config, error) {\n\treturn lire(\"app.yaml\")\n})\n```"
    blanks:
      - - OnceValues
    answer: OnceValues pour deux résultats.
  - key: trous-oncefunc
    format: fill-in
    question: |-
      Complétez pour pouvoir appeler arreter plusieurs fois sans panique :
      ```go
      arreter := sync.___(func() { close(stop) })
      ```
    blanks:
      - - OnceFunc
    answer: OnceFunc ferme le channel une seule fois.
  - key: code-une-fois
    format: code-output
    question: "```go\nvar once sync.Once\nvar wg sync.WaitGroup\nappels := 0\nfor range 10 {\n\twg.Go(func() {\n\t\tonce.Do(func() { appels++ })\n\t})\n}\nwg.Wait()\nfmt.Println(appels)\n```"
    answer: '`1` : once.Do exécute la fonction une seule fois.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once\n\tvar wg sync.WaitGroup\n\tappels := 0\n\tfor range 10 {\n\t\twg.Go(func() {\n\t\t\tonce.Do(func() { appels++ })\n\t\t})\n\t}\n\twg.Wait()\n\tfmt.Println(appels)\n}\n"
      output: '1'
  - key: code-oncevalue
    format: code-output
    question: "```go\nn := 0\nvaleur := sync.OnceValue(func() int {\n\tn++\n\treturn n * 10\n})\nfmt.Println(valeur(), valeur(), n)\n```"
    answer: '`10 10 1` : la fonction est calculée au premier appel, puis la valeur est réutilisée.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tn := 0\n\tvaleur := sync.OnceValue(func() int {\n\t\tn++\n\t\treturn n * 10\n\t})\n\tfmt.Println(valeur(), valeur(), n)\n}\n"
      output: 10 10 1
  - key: code-erreur
    format: code-output
    question: "```go\nessais := 0\ncharger := sync.OnceValues(func() (string, error) {\n\tessais++\n\treturn \"\", errors.New(\"indisponible\")\n})\n_, err1 := charger()\n_, err2 := charger()\nfmt.Println(err1, err2, essais)\n```"
    answer: '`indisponible indisponible 1` : l''erreur est mémorisée, pas réessayée.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tessais := 0\n\tcharger := sync.OnceValues(func() (string, error) {\n\t\tessais++\n\t\treturn \"\", errors.New(\"indisponible\")\n\t})\n\t_, err1 := charger()\n\t_, err2 := charger()\n\tfmt.Println(err1, err2, essais)\n}\n"
      output: indisponible indisponible 1
  - key: code-oncefunc
    format: code-output
    question: |-
      ```go
      stop := make(chan struct{})
      arreter := sync.OnceFunc(func() { close(stop) })
      arreter()
      arreter()
      _, ouvert := <-stop
      fmt.Println(ouvert)
      ```
    answer: '`false` : le channel est fermé une seule fois, sans panique au second appel.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tstop := make(chan struct{})\n\tarreter := sync.OnceFunc(func() { close(stop) })\n\tarreter()\n\tarreter()\n\t_, ouvert := <-stop\n\tfmt.Println(ouvert)\n}\n"
      output: 'false'
  - key: bug-double-check
    format: bug-fix
    question: "Le détecteur de courses signale l'initialisation paresseuse :\n```go\nvar client *Client\n\nfunc Obtenir() *Client {\n\tif client == nil {\n\t\tclient = nouveauClient()\n\t}\n\treturn client\n}\n```"
    answer: "```go\nvar Obtenir = sync.OnceValue(func() *Client {\n\treturn nouveauClient()\n})\n```\nDeux goroutines pouvaient tester `nil` en même temps et créer deux clients, avec une course sur la variable ;\nOnceValue initialise une seule fois et publie la valeur proprement."
  - key: bug-erreur
    format: bug-fix
    question: "Après une panne passagère de la base au démarrage, le service reste en erreur jusqu'au redémarrage :\n```go\nvar connexion = sync.OnceValues(func() (*sql.DB, error) {\n\treturn ouvrir()\n})\n```"
    answer: "```go\ntype Connexion struct {\n\tmu sync.Mutex\n\tdb *sql.DB\n}\n\nfunc (c *Connexion) Obtenir() (*sql.DB, error) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tif c.db != nil {\n\t\treturn c.db, nil\n\t}\n\tdb, err := ouvrir()\n\tif err != nil {\n\t\treturn nil, err // on réessaiera au prochain appel\n\t}\n\tc.db = db\n\treturn db, nil\n}\n```\nOnceValues mémorise l'erreur pour toujours ; quand l'échec peut être passager, un mutex et un état permettent de\nréessayer."
  - key: bug-double-close
    format: bug-fix
    question: "L'arrêt panique avec « close of closed channel » quand il est déclenché par le signal et par une erreur :\n```go\nfunc (s *Serveur) Arreter() {\n\tclose(s.stop)\n}\n```"
    answer: "```go\ntype Serveur struct {\n\tstop     chan struct{}\n\tstopOnce sync.Once\n}\n\nfunc (s *Serveur) Arreter() {\n\ts.stopOnce.Do(func() { close(s.stop) })\n}\n```\nOnce garantit une seule fermeture, quel que soit le nombre d'appels."
  - key: bug-copie
    format: bug-fix
    question: "L'initialisation s'exécute à chaque appel :\n```go\ntype Service struct {\n\tonce  sync.Once\n\tcache map[string]string\n}\n\nfunc (s Service) Cache() map[string]string {\n\ts.once.Do(func() { s.cache = charger() })\n\treturn s.cache\n}\n```"
    answer: "```go\nfunc (s *Service) Cache() map[string]string {\n\ts.once.Do(func() { s.cache = charger() })\n\treturn s.cache\n}\n```\nLe récepteur valeur copiait le Once (et la map) à chaque appel ; avec un pointeur, l'état est partagé."
