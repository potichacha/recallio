notion: data-races
lesson: "Une **data race** (course de données) se produit quand deux goroutines accèdent **à la même variable** en même temps,\nqu'**au moins un** des accès est une **écriture**, et que rien ne les **synchronise** (ni verrou, ni channel, ni\natomique).\n\n```go\ntotal := 0\nvar wg sync.WaitGroup\nfor range 1000 {\n\twg.Go(func() {\n\t\ttotal++ // lire, ajouter, écrire : trois étapes que deux goroutines peuvent entrelacer\n\t})\n}\nwg.Wait()\nfmt.Println(total) // souvent moins de 1000, et le comportement est indéfini\n```\n\nPourquoi c'est grave :\n- le résultat est **faux** et **non reproductible** (incréments perdus, valeurs incohérentes) ;\n- en Go, une course sur une **map** fait planter le programme (« concurrent map writes ») ; sur une **interface**,\n  un **slice** ou une **string** (valeurs de plusieurs mots), elle peut produire une valeur à moitié écrite et un\n  crash mémoire ;\n- le compilateur et le processeur **réordonnent** les accès : sans synchronisation, une goroutine peut ne jamais voir\n  une écriture.\n\nLe **détecteur de courses** les trouve à l'exécution : `go test -race ./...` (ou `go run -race`, `go build -race`). Il\ninstrumente chaque accès mémoire, ne signale **que des courses réelles** (pas de faux positif), mais seulement sur les\nchemins **exécutés** : il faut des tests qui exercent la concurrence. Il ralentit le programme (2 à 20 fois) et\nmultiplie la mémoire : on l'active en CI, pas en production.\n\nUne **race condition** est plus large : un résultat qui dépend de l'ordre des événements, même sans data race (deux\nrequêtes qui lisent puis écrivent un solde sous verrou, mais en deux temps).\n\n**En entretien** : « Deux accès concurrents, dont une écriture, sans synchronisation ; comportement indéfini ; go test\n-race en CI, qui ne voit que les chemins exécutés. »"
tour:
  - title: Les data races
    text: |-
      Une **data race** : deux goroutines accèdent à la même variable en même temps, dont au moins une en écriture, sans
      synchronisation. Le résultat devient imprévisible, et le modèle mémoire de Go ne garantit plus rien.

      Le **détecteur de races** les repère à l'exécution : `go run -race`, `go test -race`. On le lance en CI sur les
      tests, car il ne voit que les races qui se produisent pendant l'exécution.

      Les remèdes : un mutex, un channel, ou `sync/atomic` pour un simple compteur, comme ici.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"sync"
          	"sync/atomic"
          )

          func main() {
          	var vues atomic.Int64
          	var wg sync.WaitGroup
          	for range 500 {
          		wg.Go(func() {
          			vues.Add(1)
          		})
          	}
          	wg.Wait()
          	fmt.Println("vues :", vues.Load())
          }
      output: |-
        vues : 500
cards:
  - key: data-race-vs-race-condition
    format: course
    question: "Quelle différence entre une data race et une race condition ?"
    choices:
      - {text: "Data race : accès concurrent non synchronisé ; race condition : résultat qui dépend de l'ordre", correct: true}
      - {text: "Ce sont deux noms de la même chose, que le détecteur `-race` signale tous les deux", correct: false}
      - {text: "Data race : défaut logique d'ordre ; race condition : accès mémoire non synchronisé", correct: false}
      - {text: "Data race : deux lectures simultanées ; race condition : deux écritures simultanées", correct: false}
    answer: "Une data race est un accès concurrent non synchronisé à la même mémoire, dont au moins une écriture ; une race condition est un défaut logique qui dépend de l'ordre d'exécution, possible même sans data race. `-race` ne voit que les premières."
  - key: detecter-data-race
    format: course
    question: "Comment détecter une data race en Go ?"
    choices:
      - {text: "Avec le détecteur de courses : `go test -race` ou `go run -race`", correct: true}
      - {text: "Avec `go vet`, qui trouve toutes les courses dès la compilation", correct: false}
      - {text: "Avec `go build`, qui refuse un accès partagé sans verrou", correct: false}
      - {text: "Avec `go test -cover`, qui montre les lignes exécutées en parallèle", correct: false}
    answer: "Avec le détecteur de courses, activé par `-race` (`go test -race`, `go run -race`, `go build -race`) : il signale à l'exécution les accès concurrents non synchronisés. `go vet` ne voit que quelques motifs, comme la copie d'un verrou."
  - key: detecteur-courses-faux-positifs
    format: course
    question: "Le détecteur de courses a-t-il des faux positifs ?"
    choices:
      - {text: "Non, mais il ne voit que les courses des chemins réellement exécutés", correct: true}
      - {text: "Oui, souvent : il faut vérifier à la main chacune de ses alertes", correct: false}
      - {text: "Non, et il trouve toutes les courses du code, même jamais exécutées", correct: false}
      - {text: "Oui, sur les atomiques, qu'il prend pour des accès non synchronisés", correct: false}
    answer: "Non : chaque course qu'il signale est réelle. Mais il ne détecte que les courses effectivement exécutées pendant le test : un chemin concurrent que les tests n'exercent pas reste invisible."
  - key: activer-race-production
    format: course
    question: "Pourquoi ne pas activer `-race` en production ?"
    choices:
      - {text: "Il multiplie le temps processeur et la mémoire consommés par le service", correct: true}
      - {text: "Il change l'ordre d'exécution des goroutines et crée de nouvelles courses", correct: false}
      - {text: "Il n'existe que pour `go test`, et ne sait pas compiler un binaire", correct: false}
      - {text: "Il arrête le programme à chaque course, sans laisser de rapport lisible", correct: false}
    answer: "Le surcoût est important : de l'ordre de 2 à 20 fois plus de temps processeur et 5 à 10 fois plus de mémoire. On le garde pour la CI, les tests de charge ou une instance canary ; `go build -race` existe bel et bien."
  - key: ci-passe-mais-production-valeurs-incoherentes
    format: scenario
    question: "La CI passe, mais en production des valeurs incohérentes apparaissent sous charge. Que soupçonnes-tu, et que fais-tu ?"
    choices:
      - {text: "Une data race que les tests n'exercent pas : `-race` sur des tests vraiment concurrents, puis en charge", correct: true}
      - {text: "Un bug du ramasse-miettes : je désactive le GC avec `GOGC=off` pour le confirmer", correct: false}
      - {text: "Un manque de mémoire : j'augmente les ressources du conteneur et j'observe la suite", correct: false}
      - {text: "Un problème réseau : j'ajoute des `time.Sleep` entre les appels pour les espacer", correct: false}
    answer: "Une data race que les tests ne déclenchent pas. Je lance la suite avec `-race` en ajoutant des tests qui exercent vraiment la concurrence, puis un build `-race` sous charge ou en canary ; et je cherche les suspects classiques : map partagée, `append` concurrent, champ modifié par des handlers HTTP."
  - key: eviter-course-donnees-collectant-resultats
    format: course
    question: "Comment éviter une course de données en collectant des résultats parallèles ?"
    choices:
      - {text: "Écrire chaque résultat à son propre indice d'un slice préalloué", correct: true}
      - {text: "Faire `append` sur un slice partagé, qui est sûr entre goroutines", correct: false}
      - {text: "Préallouer la capacité du slice avant les `append` concurrents", correct: false}
      - {text: "Remplir une map partagée, plus sûre qu'un slice entre goroutines", correct: false}
    answer: "Chaque goroutine écrit à un indice distinct d'un slice préalloué : des cases distinctes sont des variables distinctes. Sinon, un mutex. Un `append` concurrent reste une course, même avec de la capacité."
  - key: definition-data-race
    format: definition
    question: "Qu'est-ce qu'une data race ?"
    choices:
      - {text: "Des accès concurrents non synchronisés à la même mémoire, dont au moins une écriture", correct: true}
      - {text: "Un résultat qui dépend de l'ordre d'exécution des goroutines, même sous verrou", correct: false}
      - {text: "Deux goroutines qui attendent chacune un verrou que l'autre détient, pour toujours", correct: false}
      - {text: "Une goroutine qui n'obtient jamais le verrou, car d'autres passent toujours avant", correct: false}
    answer: "Des accès concurrents à la même mémoire, sans synchronisation, dont au moins une écriture. Le résultat qui dépend de l'ordre, c'est une race condition ; l'attente mutuelle, un interblocage ; la goroutine jamais servie, une famine."
  - key: vf-lectures
    format: true-false
    question: Deux goroutines qui lisent la même variable en même temps, sans aucune écriture, provoquent une data race.
    truth: false
    answer: Il faut au moins une écriture.
  - key: vf-chemins
    format: true-false
    question: Le détecteur de courses trouve toutes les courses du programme, même dans le code jamais exécuté par les tests.
    truth: false
    answer: Il ne voit que les accès réellement exécutés.
  - key: vf-map
    format: true-false
    question: Des écritures concurrentes sur une map peuvent arrêter le programme avec une erreur fatale.
    truth: true
    answer: « concurrent map writes », que recover ne rattrape pas.
  - key: vf-increment
    format: true-false
    question: '`n++` sur un int partagé est atomique.'
    truth: false
    answer: Lire, ajouter et écrire sont trois étapes qui peuvent s'entrelacer.
  - key: qcm-race
    format: multiple-choice
    question: Lesquels de ces codes contiennent une data race ?
    choices:
      - text: Deux goroutines qui font `compteur++` sans verrou
        correct: true
      - text: Une goroutine qui écrit une variable pendant qu'une autre la lit, sans synchronisation
        correct: true
      - text: Dix goroutines qui lisent une configuration jamais modifiée après leur lancement
        correct: false
      - text: Des goroutines qui écrivent chacune à leur indice d'un slice préalloué, lu après wg.Wait
        correct: false
    answer: Des indices distincts sont des variables distinctes, et Wait synchronise.
  - key: qcm-detecter
    format: multiple-choice
    question: "Quelle méthode détecte les data races d'un projet Go ?"
    choices:
      - {text: "`go test -race ./...` en CI, sur des tests vraiment concurrents", correct: true}
      - {text: "`go vet ./...`, qui les trouve toutes dès la compilation", correct: false}
      - {text: "`go build`, qui refuse le code concerné par une course", correct: false}
      - {text: "`gofmt -l`, qui liste les variables partagées sans verrou", correct: false}
    answer: "Les courses se voient à l'exécution : `go test -race` en CI, avec des tests qui exercent vraiment les chemins concurrents. `go vet` ne voit que quelques motifs, comme la copie d'un verrou."
  - key: qcm-corriger
    format: multiple-choice
    question: "Laquelle de ces corrections ne supprime pas la course sur un compteur partagé ?"
    choices:
      - {text: "Déclarer le compteur `volatile`, comme en Java", correct: true}
      - {text: "Un `sync.Mutex` autour de l'incrément", correct: false}
      - {text: "Un `atomic.Int64` à la place de l'`int`", correct: false}
      - {text: "Un compteur par goroutine, additionnés après `Wait`", correct: false}
    answer: "Go n'a pas de mot-clé `volatile` : ce code ne compile même pas. Un mutex, un atomique ou des compteurs séparés additionnés après `Wait` suppriment tous la course."
  - key: qcm-race-condition
    format: multiple-choice
    question: Quelle affirmation sur race condition et data race est juste ?
    choices:
      - {text: "Un code peut avoir une race condition sans data race, par exemple une vérification puis une action en deux sections verrouillées", correct: true}
      - {text: "Toute race condition est détectée par `-race`, puisqu'elle passe forcément par un accès mémoire non synchronisé", correct: false}
      - {text: "Une data race est sans conséquence si le résultat semble correct, car le runtime corrige les valeurs mélangées", correct: false}
      - {text: "Les deux termes sont synonymes : une race condition et une data race désignent le même accès concurrent", correct: false}
    answer: Le détecteur ne voit que les accès mémoire non synchronisés.
  - key: code-mutex
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      total := 0
      var mu sync.Mutex
      var wg sync.WaitGroup
      for range 1000 {
      	wg.Go(func() {
      		mu.Lock()
      		total++
      		mu.Unlock()
      	})
      }
      wg.Wait()
      fmt.Println(total)
      ```
    choices:
      - {text: "`1000`", correct: true}
      - {text: "Un nombre variable, inférieur ou égal à `1000`", correct: false}
      - {text: "`999`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`1000` : le verrou rend chaque incrément exclusif, et `wg.Wait()` attend les 1000 goroutines avant l'affichage."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\ttotal := 0\n\tvar mu sync.Mutex\n\tvar wg sync.WaitGroup\n\tfor range 1000 {\n\t\twg.Go(func() {\n\t\t\tmu.Lock()\n\t\t\ttotal++\n\t\t\tmu.Unlock()\n\t\t})\n\t}\n\twg.Wait()\n\tfmt.Println(total)\n}\n"
      output: '1000'
  - key: code-atomic
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var total atomic.Int64
      var wg sync.WaitGroup
      for range 50 {
      	wg.Go(func() {
      		for range 100 {
      			total.Add(1)
      		}
      	})
      }
      wg.Wait()
      fmt.Println(total.Load())
      ```
    choices:
      - {text: "`5000`", correct: true}
      - {text: "`100`", correct: false}
      - {text: "`50`", correct: false}
      - {text: "Un nombre variable, inférieur à `5000`", correct: false}
    answer: "`5000` : 50 goroutines font chacune 100 `Add`, et chaque `Add` est atomique : aucun incrément ne se perd."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar total atomic.Int64\n\tvar wg sync.WaitGroup\n\tfor range 50 {\n\t\twg.Go(func() {\n\t\t\tfor range 100 {\n\t\t\t\ttotal.Add(1)\n\t\t\t}\n\t\t})\n\t}\n\twg.Wait()\n\tfmt.Println(total.Load())\n}\n"
      output: '5000'
  - key: code-locaux
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      parts := make([]int, 4)
      var wg sync.WaitGroup
      for i := range 4 {
      	wg.Go(func() {
      		for j := range 10 {
      			parts[i] += j
      		}
      	})
      }
      wg.Wait()
      total := 0
      for _, p := range parts {
      	total += p
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`180`", correct: true}
      - {text: "`45`", correct: false}
      - {text: "`220`", correct: false}
      - {text: "Un nombre variable, selon l'ordre des goroutines", correct: false}
    answer: "`180` : chaque goroutine remplit sa propre case (0 + 1 + ... + 9 = 45), sans état partagé, et les quatre cases sont additionnées après `Wait`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tparts := make([]int, 4)\n\tvar wg sync.WaitGroup\n\tfor i := range 4 {\n\t\twg.Go(func() {\n\t\t\tfor j := range 10 {\n\t\t\t\tparts[i] += j\n\t\t\t}\n\t\t})\n\t}\n\twg.Wait()\n\ttotal := 0\n\tfor _, p := range parts {\n\t\ttotal += p\n\t}\n\tfmt.Println(total)\n}\n"
      output: '180'
  - key: code-channel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      res := make(chan int)
      for i := 1; i <= 3; i++ {
      	go func() { res <- i * i }()
      }
      total := 0
      for range 3 {
      	total += <-res
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`14`", correct: true}
      - {text: "`48`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`27`", correct: false}
    answer: "`14` : depuis Go 1.22, chaque itération a sa propre `i`, et les résultats passent par un channel, sans état partagé (1 + 4 + 9). Avec l'ancienne variable de boucle partagée, on aurait pu obtenir `48`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tres := make(chan int)\n\tfor i := 1; i <= 3; i++ {\n\t\tgo func() { res <- i * i }()\n\t}\n\ttotal := 0\n\tfor range 3 {\n\t\ttotal += <-res\n\t}\n\tfmt.Println(total)\n}\n"
      output: '14'
  - key: bug-compteur
    format: bug-fix
    question: |-
      Le nombre de requêtes affiché est toujours trop bas sous charge :
      ```go
      var requetes int

      func compter(next http.Handler) http.Handler {
      	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      		requetes++
      		next.ServeHTTP(w, r)
      	})
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer `requetes` en `atomic.Int64`, incrémenté par `requetes.Add(1)`", correct: true}
      - {text: "Incrémenter `requetes` après `next.ServeHTTP`, une fois la requête finie", correct: false}
      - {text: "Lancer l'incrément dans sa propre goroutine : `go func() { requetes++ }()`", correct: false}
      - {text: "Passer `requetes` en `int64`, dont l'incrément est atomique sur 64 bits", correct: false}
    answer: |-
      ```go
      var requetes atomic.Int64

      func compter(next http.Handler) http.Handler {
      	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      		requetes.Add(1)
      		next.ServeHTTP(w, r)
      	})
      }
      ```
      Chaque requête est servie par sa propre goroutine : l'incrément non synchronisé (lire, ajouter, écrire) perdait des valeurs. Le déplacer ou le lancer dans une goroutine ne le rend pas atomique.
  - key: bug-append
    format: bug-fix
    question: |-
      Le détecteur signale une course et il manque des résultats :
      ```go
      var resultats []string
      for _, u := range urls {
      	wg.Go(func() {
      		resultats = append(resultats, lire(u))
      	})
      }
      wg.Wait()
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Préallouer `resultats` avec `len(urls)` et écrire chacun à son indice `i`", correct: true}
      - {text: "Préallouer la capacité avec `make([]string, 0, len(urls))`, et garder `append`", correct: false}
      - {text: "Remplacer `wg.Go` par `go func()`, pour que chaque goroutine ait sa copie du slice", correct: false}
      - {text: "Trier `resultats` après `wg.Wait()`, pour remettre les réponses dans l'ordre", correct: false}
    answer: |-
      ```go
      resultats := make([]string, len(urls))
      for i, u := range urls {
      	wg.Go(func() {
      		resultats[i] = lire(u)
      	})
      }
      wg.Wait()
      ```
      `append` lit et réécrit l'en-tête du slice partagé : deux goroutines écrasaient leurs ajouts. Préallouer la capacité ne change rien à cette course ; un indice par goroutine supprime l'état partagé.
  - key: bug-drapeau
    format: bug-fix
    question: |-
      La goroutine ne s'arrête parfois jamais :
      ```go
      var arret bool
      go func() {
      	for !arret {
      		travailler()
      	}
      }()
      time.Sleep(time.Second)
      arret = true
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Passer `arret` en `atomic.Bool`, lu par `Load` et écrit par `Store`", correct: true}
      - {text: "Allonger le `time.Sleep`, pour laisser à la goroutine le temps de voir `arret`", correct: false}
      - {text: "Déclarer `arret` en variable globale plutôt qu'en variable locale", correct: false}
      - {text: "Appeler `runtime.Gosched()` dans la boucle, pour forcer la relecture d'`arret`", correct: false}
    answer: |-
      ```go
      var arret atomic.Bool
      go func() {
      	for !arret.Load() {
      		travailler()
      	}
      }()
      time.Sleep(time.Second)
      arret.Store(true)
      ```
      Sans synchronisation, rien ne garantit que la goroutine voie l'écriture (le compilateur peut même sortir la lecture de la boucle). Un atomique, ou mieux un contexte annulé, publie l'arrêt ; `Gosched` ne synchronise rien.
  - key: bug-map
    format: bug-fix
    question: |-
      Le service s'arrête avec « fatal error: concurrent map writes » :
      ```go
      var sessions = map[string]*Session{}

      func ouvrir(id string, s *Session) {
      	sessions[id] = s
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Un `sync.Mutex` pris autour de toutes les lectures et écritures de `sessions`", correct: true}
      - {text: "Un `recover` dans `ouvrir`, pour rattraper l'erreur et continuer le service", correct: false}
      - {text: "Une map préallouée par `make(map[string]*Session, 1000)`, sans réallocation", correct: false}
      - {text: "Un `sync.Mutex` pris seulement dans `ouvrir`, les lectures restant sans verrou", correct: false}
    answer: |-
      ```go
      var (
      	mu       sync.Mutex
      	sessions = map[string]*Session{}
      )

      func ouvrir(id string, s *Session) {
      	mu.Lock()
      	defer mu.Unlock()
      	sessions[id] = s
      }
      ```
      Une map n'est pas sûre entre goroutines, et cette erreur fatale ne se rattrape pas avec `recover`. Toutes ses lectures et écritures passent par le verrou, les lectures comprises.
  - key: scenario-ci
    format: scenario
    question: "Comment intègres-tu le détecteur de courses dans ton projet ?"
    choices:
      - {text: "`go test -race ./...` à chaque pull request, sur des tests qui exercent vraiment la concurrence", correct: true}
      - {text: "Un binaire compilé avec `-race` en production, pour attraper les courses des vrais clients", correct: false}
      - {text: "Une fois par version, à la main, sur la machine d'un développeur avant la livraison", correct: false}
      - {text: "Nulle part : `go vet` en CI trouve déjà toutes les courses dès la compilation", correct: false}
    answer: "`go test -race ./...` dans la CI à chaque pull request, avec des tests concurrents (`t.Parallel()`, plusieurs goroutines sur les mêmes objets) ; aussi sur les tests de charge en préproduction. Pas en production : il ralentit beaucoup et consomme de la mémoire."
  - key: scenario-intermittent
    format: scenario
    question: "Un test échoue une fois sur cinquante en CI. Comment vérifies-tu qu'il s'agit d'une course ?"
    choices:
      - {text: "Je le relance en boucle avec le détecteur : `go test -race -run TestX -count=200`", correct: true}
      - {text: "J'ajoute un `time.Sleep` dans le test : s'il passe ensuite, c'était une course", correct: false}
      - {text: "Je le marque `t.Skip` en CI et je le lance seulement en local, sans `-race`", correct: false}
      - {text: "Je relance la CI jusqu'à ce qu'il passe : un échec sur cinquante est négligeable", correct: false}
    answer: "`go test -race -run TestX -count=200`, éventuellement avec `-cpu=1,4,8` pour varier l'ordonnancement : le rapport donne les deux accès en conflit. Si rien n'apparaît, je cherche une race condition logique ou une dépendance à l'heure ou au réseau."
  - key: scenario-rapport
    format: scenario
    question: "Comment lis-tu un rapport « WARNING: DATA RACE » ?"
    choices:
      - {text: "Je repère la variable commune aux deux accès et leurs piles, puis la synchronisation qui manque", correct: true}
      - {text: "Je lis seulement la première pile : la seconde n'est qu'une copie de la même trace", correct: false}
      - {text: "J'ajoute un délai à l'endroit signalé, pour que les deux accès ne se croisent plus", correct: false}
      - {text: "Je cherche la ligne qui a paniqué : le rapport est celui d'un crash du programme", correct: false}
    answer: "Le rapport donne deux accès (« Write at », « Previous read at »...) avec leurs piles, puis les piles de création des goroutines. Je repère la variable commune, la synchronisation qui manque, et je corrige à la source (verrou, channel, atomique), jamais avec des délais."
  - key: definition-race-detector
    format: definition
    question: "Qu'est-ce que le détecteur de courses de Go (`-race`) ?"
    choices:
      - {text: "Une instrumentation qui signale à l'exécution les accès concurrents non synchronisés", correct: true}
      - {text: "Une analyse de `go vet` qui trouve les courses en lisant le code, sans l'exécuter", correct: false}
      - {text: "Un mode du compilateur qui refuse les variables partagées sans verrou", correct: false}
      - {text: "Un ordonnanceur qui exécute les goroutines dans un ordre fixe, reproductible", correct: false}
    answer: "Une instrumentation du code, activée par `-race`, qui signale à l'exécution les accès concurrents non synchronisés, avec leurs piles. Elle ne lit pas le code comme `go vet` : elle ne voit que les chemins exécutés."
  - key: definition-race-condition
    format: definition
    question: "Qu'est-ce qu'une race condition ?"
    choices:
      - {text: "Un résultat qui dépend de l'ordre d'exécution des goroutines, avec ou sans data race", correct: true}
      - {text: "Des accès concurrents non synchronisés à la même variable, dont une écriture", correct: false}
      - {text: "Deux goroutines qui attendent chacune un verrou tenu par l'autre, pour toujours", correct: false}
      - {text: "Une goroutine qui reste bloquée pour toujours, sans que personne ne l'attende", correct: false}
    answer: "Un défaut logique : le résultat dépend de l'ordre d'exécution, même quand chaque accès est synchronisé (une vérification puis une action en deux sections verrouillées). Les accès non synchronisés, c'est une data race."
  - key: definition-section-critique
    format: definition
    question: "Qu'est-ce qu'une section critique ?"
    choices:
      - {text: "Une portion de code qui accède à un état partagé, exécutée par une goroutine à la fois", correct: true}
      - {text: "Une portion de code qui ne doit jamais paniquer, entourée d'un `recover`", correct: false}
      - {text: "Une portion de code exécutée en priorité par l'ordonnanceur, avant les autres", correct: false}
      - {text: "Une portion de code exécutée une seule fois, comme la fonction d'un `sync.Once`", correct: false}
    answer: "La portion de code qui accède à un état partagé et ne doit être exécutée que par une goroutine à la fois : celle qu'on entoure de `Lock` et `Unlock`. On la garde courte."
