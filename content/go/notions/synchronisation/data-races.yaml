notion: data-races
cards:
  - key: data-race-vs-race-condition
    format: course
    question: Data race vs race condition ?
    answer: Accès concurrent non synchronisé vs défaut logique dépendant de l'ordre d'exécution.
  - key: detecter-data-race
    format: course
    question: Comment détecter une data race ?
    answer: 'Avec le détecteur de courses : go test -race.'
  - key: detecteur-courses-faux-positifs
    format: course
    question: Le détecteur de courses a-t-il des faux positifs ?
    answer: Non, mais il ne détecte que les courses effectivement exécutées.
  - key: activer-race-production
    format: course
    question: Pourquoi ne pas activer -race en production ?
    answer: Surcoût important en CPU et mémoire.
  - key: ci-passe-mais-production-valeurs-incoherentes
    format: scenario
    question: La CI passe, mais en production des valeurs incohérentes apparaissent sous charge.
    answer: |-
      Je soupçonnerais une **data race** que les tests ne déclenchent pas. Je lancerais la suite avec `-race`, en ajoutant des tests qui exercent vraiment la concurrence (plusieurs goroutines appelant la même méthode en boucle). Si les tests ne suffisent pas, je ferais tourner un build `-race` dans un environnement de charge ou sur une instance canary : le détecteur donnera les deux piles en conflit.
      En relisant le code, je chercherais les suspects classiques : une map partagée, un slice auquel plusieurs goroutines ajoutent des éléments, un champ de struct modifié par un handler HTTP (les handlers s'exécutent en parallèle), une variable de boucle capturée sur une version de Go antérieure à 1.22.
  - key: eviter-course-donnees-collectant-resultats
    format: course
    question: Comment éviter la course de données en collectant des résultats parallèles ?
    answer: Écrire chaque résultat à un indice distinct d'un slice préalloué, ou protéger par un mutex.
  - key: definition-data-race
    format: definition
    question: data race
    answer: Accès concurrent non synchronisé dont au moins une écriture
