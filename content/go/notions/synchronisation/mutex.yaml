  - key: bug-reentrant
    format: bug-fix
    question: |-
      `Vider` bloque pour toujours :
      ```go
      func (c *Cache) Taille() int {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	return len(c.items)
      }

      func (c *Cache) Vider() int {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	n := c.Taille()
      	clear(c.items)
      	return n
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Une méthode interne `taille()` sans verrou, appelée par `Vider` et `Taille`", correct: true}
      - {text: "Un `sync.RWMutex`, avec `RLock` dans `Taille` et `Lock` dans `Vider`", correct: false}
      - {text: "Un second `Unlock` dans `Taille`, pour rendre le verrou pris par `Vider`", correct: false}
      - {text: "Appeler `c.Taille()` dans une goroutine, pour ne pas bloquer `Vider`", correct: false}
    answer: |-
      ```go
      func (c *Cache) Taille() int {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	return c.taille()
      }

      // taille suppose que c.mu est verrouillé.
      func (c *Cache) taille() int { return len(c.items) }

      func (c *Cache) Vider() int {
      	c.mu.Lock()
      	defer c.mu.Unlock()
      	n := c.taille()
      	clear(c.items)
      	return n
      }
      ```
      Le mutex n'est pas réentrant : `Vider` détenait le verrou que `Taille` reprenait. Une version interne non verrouillée sert aux méthodes qui l'ont déjà ; un `RLock` sous un `Lock` bloquerait de la même façon.
  - key: bug-io
    format: bug-fix
    question: |-
      Sous charge, toutes les requêtes attendent derrière celle qui rafraîchit le cache :
      ```go
      c.mu.Lock()
      defer c.mu.Unlock()
      if time.Since(c.date) > time.Minute {
      	c.valeur, _ = appelerAPI() // 2 secondes
      	c.date = time.Now()
      }
      return c.valeur
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler l'API hors verrou, et ne verrouiller que la lecture et l'écriture de l'état", correct: true}
      - {text: "Passer à un `sync.RWMutex`, en gardant l'appel à l'API sous le verrou d'écriture", correct: false}
      - {text: "Retirer le `defer`, et appeler `Unlock` juste après `appelerAPI()`", correct: false}
      - {text: "Lancer `appelerAPI()` dans une goroutine sous le verrou, sans attendre son résultat", correct: false}
    answer: |-
      ```go
      c.mu.Lock()
      perime := time.Since(c.date) > time.Minute
      valeur := c.valeur
      c.mu.Unlock()
      if !perime {
      	return valeur
      }

      nouvelle, err := appelerAPI() // hors verrou
      if err != nil {
      	return valeur
      }
      c.mu.Lock()
      c.valeur, c.date = nouvelle, time.Now()
      c.mu.Unlock()
      return nouvelle
      ```
      L'appel lent se fait hors verrou ; le verrou ne protège plus que la lecture et l'écriture de l'état. Un RWMutex garderait l'appel sous le verrou d'écriture et bloquerait tout autant (`singleflight` évite en plus les rafraîchissements en double).
