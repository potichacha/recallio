    answer: "`defer` rend le verrou sur tous les chemins. Placer le mutex à côté des champs qu'il protège est aussi une bonne pratique ; un appel lent sous verrou bloque tout, une copie a son propre verrou, et un mutex incorporé expose `Lock` dans l'API."
  - key: qcm-deadlock
    format: multiple-choice
    question: "Lequel de ces codes provoque un blocage ?"
    choices:
      - {text: "Une méthode qui verrouille, puis appelle une méthode qui reverrouille le même mutex", correct: true}
      - {text: "`Lock`, `defer Unlock`, puis un `return` anticipé au milieu de la fonction", correct: false}
      - {text: "Deux mutex différents, pris toujours dans le même ordre par toutes les goroutines", correct: false}
      - {text: "Un `TryLock` qui échoue parce qu'une autre goroutine détient déjà le verrou", correct: false}
    answer: "Le mutex n'est pas réentrant : la seconde méthode attend un verrou que sa propre goroutine détient. Deux goroutines qui prennent A puis B et B puis A peuvent aussi se bloquer ; le `defer` rend le verrou, l'ordre fixe évite l'attente circulaire, et `TryLock` n'attend jamais."
  - key: qcm-recepteur
