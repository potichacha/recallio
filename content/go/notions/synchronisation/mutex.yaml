notion: mutex
lesson: "Quand plusieurs goroutines lisent et modifient **le même état**, il faut les empêcher d'y toucher en même temps. Un\n**`sync.Mutex`** (verrou d'exclusion mutuelle) laisse **une seule** goroutine à la fois dans la section protégée.\n\n```go\ntype Compteurs struct {\n\tmu     sync.Mutex     // protège vus\n\tvus    map[string]int\n}\n\nfunc (c *Compteurs) Ajouter(page string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.vus[page]++\n}\n\nfunc (c *Compteurs) Lire(page string) int {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\treturn c.vus[page]       // les lectures aussi passent par le verrou\n}\n```\n\nLes règles :\n- **toutes** les lectures et écritures de l'état protégé passent par le verrou, pas seulement les écritures ;\n- `defer mu.Unlock()` juste après `Lock()` : le verrou est rendu même en cas de retour anticipé ou de panique ;\n- le mutex se place **à côté** des champs qu'il protège, avec un commentaire qui le dit ;\n- la valeur zéro est un mutex **déverrouillé**, prêt à l'emploi ;\n- les méthodes ont un **récepteur pointeur** : copier un mutex copie son état (voir `go vet copylocks`) ;\n- un `sync.Mutex` **n'est pas réentrant** : appeler `Lock()` deux fois dans la même goroutine bloque pour toujours.\n\nGarder les sections critiques **courtes** : pas d'appel réseau ni d'entrée-sortie sous verrou, et toujours le même\nordre quand il faut prendre plusieurs verrous (sinon deux goroutines peuvent s'attendre mutuellement).\n\nDepuis Go 1.18, `TryLock()` existe, mais son usage est rarement justifié.\n\n**En entretien** : « Un mutex à côté de l'état qu'il protège, lectures comprises ; Lock puis defer Unlock ; non\nréentrant ; sections courtes, ordre fixe entre verrous. »"
tour:
  - title: sync.Mutex
    text: |-
      Quand plusieurs goroutines modifient la même variable, il faut une **exclusion mutuelle** : `sync.Mutex`.
      `mu.Lock()` attend que personne ne tienne le verrou, et `mu.Unlock()` le rend. Le code entre les deux ne s'exécute
      que dans une goroutine à la fois.

      On place le mutex à côté des données qu'il protège, dans la même struct, et on écrit souvent `defer
      mu.Unlock()` juste après `Lock`. La valeur zéro d'un `Mutex` est un verrou ouvert, prêt à servir, et un mutex ne
      se copie pas : d'où le receveur pointeur.

      Essaie : retire les deux lignes du verrou, puis exécute plusieurs fois.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"sync"
          )

          type Compteur struct {
          	mu sync.Mutex
          	n  int
          }

          func (c *Compteur) Incremente() {
          	c.mu.Lock()
          	defer c.mu.Unlock()
          	c.n++
          }

          func main() {
          	var c Compteur
          	var wg sync.WaitGroup
          	for range 1000 {
          		wg.Go(c.Incremente)
          	}
          	wg.Wait()
          	fmt.Println(c.n)
          }
      output: |-
        1000
cards:
  - key: cache-memoire-partage-plusieurs-goroutines
    format: scenario
    question: "Un cache en mémoire est partagé entre plusieurs goroutines, et le service plante avec 'concurrent map writes'. Que fais-tu ?"
    choices:
      - {text: "Une struct qui encapsule la map et un `sync.RWMutex`, avec des méthodes `Get` et `Set`", correct: true}
      - {text: "Un `recover` dans chaque handler, pour rattraper l'erreur et servir la requête", correct: false}
      - {text: "Une map préallouée assez grande pour que les écritures ne la réallouent plus", correct: false}
      - {text: "Un `sync.Mutex` pris seulement dans `Set`, les lectures restant sans verrou", correct: false}
    answer: "Les maps Go ne sont pas protégées, et cette erreur fatale ne se rattrape pas. J'encapsule la map et un `sync.RWMutex` derrière `Get` et `Set`, pour que personne n'y accède sans verrou, lectures comprises ; et je lance les tests avec `-race` pour trouver les autres accès."
  - key: sync-mutex-reentrant
    format: course
    question: "`sync.Mutex` est-il réentrant ?"
    choices:
      - {text: "Non : le reverrouiller depuis la goroutine qui le détient la bloque", correct: true}
      - {text: "Oui : la goroutine qui le détient peut le reprendre autant de fois", correct: false}
      - {text: "Oui, mais il faut autant d'`Unlock` que de `Lock` pour le relâcher", correct: false}
      - {text: "Non : le reverrouiller fait paniquer avec « mutex already locked »", correct: false}
    answer: "Non : un second `Lock` par la goroutine qui le détient attend un `Unlock` qui ne viendra pas, et la goroutine se bloque. Go ne sait pas quelle goroutine détient un mutex, contrairement au `ReentrantLock` de Java."
  - key: defer-mu-unlock
    format: course
    question: "Pourquoi écrire `defer mu.Unlock()` juste après `mu.Lock()` ?"
    choices:
      - {text: "Pour libérer le verrou sur tous les chemins de sortie, panics comprises", correct: true}
      - {text: "Pour libérer le verrou plus tôt, avant la fin de la section critique", correct: false}
      - {text: "Parce qu'un `Unlock` hors d'un `defer` ne compile pas en Go", correct: false}
      - {text: "Pour libérer le verrou si une autre goroutine tue celle qui le détient", correct: false}
    answer: "Pour garantir la libération sur tous les chemins de sortie, y compris un `return` anticipé ou une panic. `defer` libère à la fin de la fonction, pas plus tôt."
  - key: i-o-sous-verrou
    format: course
    question: "Pourquoi ne pas faire d'entrée-sortie sous verrou ?"
    choices:
      - {text: "La section critique s'allonge, et toutes les goroutines qui attendent sont bloquées", correct: true}
      - {text: "Le runtime libère le verrou de lui-même pendant toute entrée-sortie", correct: false}
      - {text: "Une entrée-sortie sous verrou ne compile pas : le compilateur l'interdit", correct: false}
      - {text: "Le verrou expire au bout d'une seconde, avant la fin de l'entrée-sortie", correct: false}
    answer: "Une entrée-sortie peut durer longtemps : la section critique s'allonge, et toutes les goroutines qui attendent le verrou sont bloquées. Le verrou n'expire jamais et n'est pas relâché pendant l'attente."
  - key: eviter-deadlock-avec-plusieurs-mutex
    format: course
    question: "Comment éviter un deadlock avec plusieurs mutex ?"
    choices:
      - {text: "Les prendre toujours dans le même ordre, sans appeler de code externe sous verrou", correct: true}
      - {text: "Les prendre dans un ordre différent à chaque fois, pour répartir l'attente", correct: false}
      - {text: "Remplacer chacun par un `sync.RWMutex`, qui ne peut pas se bloquer", correct: false}
      - {text: "Ajouter un `time.Sleep` entre deux `Lock`, pour laisser passer les autres", correct: false}
    answer: "Les acquérir toujours dans le même ordre supprime l'attente circulaire ; ne pas appeler de code externe sous verrou évite qu'il en prenne un autre. Un `RWMutex` se bloque comme un `Mutex`."
  - key: implemente-cache-thread-safe-avec-expiration
    format: scenario
    question: "Tu dois écrire un cache thread-safe avec une expiration simple. Quelle conception choisis-tu ?"
    choices:
      - {text: "Une map d'entrées datées sous `sync.RWMutex`, avec une horloge injectable pour les tests", correct: true}
      - {text: "Une `sync.Map`, dont la méthode `Range` purge d'elle-même les entrées expirées", correct: false}
      - {text: "Une map sans verrou, puisque chaque requête n'y lit que sa propre clé", correct: false}
      - {text: "Un `sync.Pool` d'entrées, que le ramasse-miettes vide quand elles expirent", correct: false}
    answer: |-
      ```go
      type entree[V any] struct {
          val    V
          expire time.Time
      }

      type Cache[K comparable, V any] struct {
          mu   sync.RWMutex
          data map[K]entree[V]
          ttl  time.Duration
          now  func() time.Time      // injectable pour les tests
      }

      func NewCache[K comparable, V any](ttl time.Duration) *Cache[K, V] {
          return &Cache[K, V]{data: make(map[K]entree[V]), ttl: ttl, now: time.Now}
      }

      func (c *Cache[K, V]) Get(k K) (V, bool) {
          c.mu.RLock()
          e, ok := c.data[k]
          c.mu.RUnlock()
          if !ok || c.now().After(e.expire) {
              var zero V
              return zero, false
          }
          return e.val, true
      }

      func (c *Cache[K, V]) Set(k K, v V) {
          c.mu.Lock()
          c.data[k] = entree[V]{val: v, expire: c.now().Add(c.ttl)}
          c.mu.Unlock()
      }
      ```
      RWMutex parce que les lectures dominent ; l'horloge est injectable pour tester l'expiration sans attendre. Il manque une purge des entrées expirées et une taille maximale : en production, une bibliothèque éprouvée, et `singleflight` pour éviter que cent requêtes rechargent la même clé.
  - key: code-var-wg-sync-waitgroup-var
    format: code-output
    question: |-
      Qu'affiche ce code, en Go 1.22 ou plus ?
      ```go
      var wg sync.WaitGroup
      var mu sync.Mutex
      total := 0
      for i := 1; i <= 100; i++ {
          wg.Add(1)
          go func() { defer wg.Done(); mu.Lock(); total += i; mu.Unlock() }()
      }
      wg.Wait()
      fmt.Println(total)
      ```
    choices:
      - {text: "`5050`", correct: true}
      - {text: "`10100`", correct: false}
      - {text: "`5000`", correct: false}
      - {text: "Un nombre variable, selon l'ordre des goroutines", correct: false}
    answer: "`5050` : depuis Go 1.22, chaque itération a sa propre `i`, et le verrou rend chaque ajout exclusif. Avant, les goroutines lisaient une variable partagée qui changeait : un résultat imprévisible, et une data race."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tvar mu sync.Mutex\n\ttotal := 0\n\tfor i := 1; i <= 100; i++ {\n\t    wg.Add(1)\n\t    go func() {\n\t        defer wg.Done()\n\t        mu.Lock()\n\t        total += i\n\t        mu.Unlock()\n\t    }()\n\t}\n\twg.Wait()\n\tfmt.Println(total)\n}\n"
      output: '5050'
