    question: "Laquelle de ces pratiques est recommandée avec un `sync.Mutex` ?"
    choices:
      - {text: "`defer mu.Unlock()` juste après `mu.Lock()`", correct: true}
      - {text: "Faire les appels HTTP sous verrou, pour être sûr", correct: false}
