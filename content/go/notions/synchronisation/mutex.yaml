notion: mutex
lesson: "Quand plusieurs goroutines lisent et modifient **le même état**, il faut les empêcher d'y toucher en même temps. Un\n**`sync.Mutex`** (verrou d'exclusion mutuelle) laisse **une seule** goroutine à la fois dans la section protégée.\n\n```go\ntype Compteurs struct {\n\tmu     sync.Mutex     // protège vus\n\tvus    map[string]int\n}\n\nfunc (c *Compteurs) Ajouter(page string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.vus[page]++\n}\n\nfunc (c *Compteurs) Lire(page string) int {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\treturn c.vus[page]       // les lectures aussi passent par le verrou\n}\n```\n\nLes règles :\n- **toutes** les lectures et écritures de l'état protégé passent par le verrou, pas seulement les écritures ;\n- `defer mu.Unlock()` juste après `Lock()` : le verrou est rendu même en cas de retour anticipé ou de panique ;\n- le mutex se place **à côté** des champs qu'il protège, avec un commentaire qui le dit ;\n- la valeur zéro est un mutex **déverrouillé**, prêt à l'emploi ;\n- les méthodes ont un **récepteur pointeur** : copier un mutex copie son état (voir `go vet copylocks`) ;\n- un `sync.Mutex` **n'est pas réentrant** : appeler `Lock()` deux fois dans la même goroutine bloque pour toujours.\n\nGarder les sections critiques **courtes** : pas d'appel réseau ni d'entrée-sortie sous verrou, et toujours le même\nordre quand il faut prendre plusieurs verrous (sinon deux goroutines peuvent s'attendre mutuellement).\n\nDepuis Go 1.18, `TryLock()` existe, mais son usage est rarement justifié.\n\n**En entretien** : « Un mutex à côté de l'état qu'il protège, lectures comprises ; Lock puis defer Unlock ; non\nréentrant ; sections courtes, ordre fixe entre verrous. »"
tour:
  - title: sync.Mutex
    text: |-
      Quand plusieurs goroutines modifient la même variable, il faut une **exclusion mutuelle** : `sync.Mutex`.
      `mu.Lock()` attend que personne ne tienne le verrou, et `mu.Unlock()` le rend. Le code entre les deux ne s'exécute
      que dans une goroutine à la fois.

      On place le mutex à côté des données qu'il protège, dans la même struct, et on écrit souvent `defer
      mu.Unlock()` juste après `Lock`. La valeur zéro d'un `Mutex` est un verrou ouvert, prêt à servir, et un mutex ne
      se copie pas : d'où le receveur pointeur.

      Essaie : retire les deux lignes du verrou, puis exécute plusieurs fois.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"sync"
          )

          type Compteur struct {
          	mu sync.Mutex
          	n  int
          }

          func (c *Compteur) Incremente() {
          	c.mu.Lock()
          	defer c.mu.Unlock()
          	c.n++
          }

          func main() {
          	var c Compteur
          	var wg sync.WaitGroup
          	for range 1000 {
          		wg.Go(c.Incremente)
          	}
          	wg.Wait()
          	fmt.Println(c.n)
          }
      output: |-
        1000
cards:
  - key: cache-memoire-partage-plusieurs-goroutines
    format: scenario
    question: Un cache en mémoire est partagé entre plusieurs goroutines et le service plante avec 'concurrent map writes'.
    answer: |-
      Les maps Go ne sont pas protégées, et le runtime détecte certains accès concurrents et arrête le programme, ce qui n'est pas récupérable. Je protégerais la map par un `sync.RWMutex` encapsulé dans une struct avec des méthodes `Get`/`Set`, pour que personne ne puisse accéder à la map sans verrou. Le `RWMutex` laisse plusieurs lectures simultanées.
      `sync.Map` est une alternative pour des cas précis : clés écrites une fois puis lues souvent, ou goroutines qui manipulent des ensembles de clés disjoints. Pour un cache avec expiration et taille maximale, j'utiliserais une bibliothèque éprouvée (ristretto, otter) plutôt que de la réinventer.
      Et je lancerais les tests avec `-race` pour trouver les autres accès non protégés.
  - key: sync-mutex-reentrant
    format: course
    question: sync.Mutex est-il réentrant ?
    answer: Non ; reverrouiller un mutex détenu bloque la goroutine.
  - key: defer-mu-unlock
    format: course
    question: Pourquoi `defer mu.Unlock()` ?
    answer: Pour garantir la libération sur tous les chemins de sortie, y compris les panics.
  - key: i-o-sous-verrou
    format: course
    question: Pourquoi ne pas faire d'I/O sous verrou ?
    answer: La section critique s'allonge et toutes les goroutines en attente sont bloquées.
  - key: eviter-deadlock-avec-plusieurs-mutex
    format: course
    question: Comment éviter un deadlock avec plusieurs mutex ?
    answer: Les acquérir toujours dans le même ordre, et ne jamais appeler de code externe sous verrou.
  - key: implemente-cache-thread-safe-avec-expiration
    format: scenario
    question: Implémente un cache thread-safe avec expiration simple.
    answer: |-
      ```go
      type entree[V any] struct {
          val    V
          expire time.Time
      }

      type Cache[K comparable, V any] struct {
          mu   sync.RWMutex
          data map[K]entree[V]
          ttl  time.Duration
          now  func() time.Time      // injectable pour les tests
      }

      func NewCache[K comparable, V any](ttl time.Duration) *Cache[K, V] {
          return &Cache[K, V]{data: make(map[K]entree[V]), ttl: ttl, now: time.Now}
      }

      func (c *Cache[K, V]) Get(k K) (V, bool) {
          c.mu.RLock()
          e, ok := c.data[k]
          c.mu.RUnlock()
          if !ok || c.now().After(e.expire) {
              var zero V
              return zero, false
          }
          return e.val, true
      }

      func (c *Cache[K, V]) Set(k K, v V) {
          c.mu.Lock()
          c.data[k] = entree[V]{val: v, expire: c.now().Add(c.ttl)}
          c.mu.Unlock()
      }
      ```
      "RWMutex parce que les lectures dominent. L'horloge est injectable pour tester l'expiration sans attendre. Il manque une purge des entrées expirées (une goroutine périodique arrêtée par un contexte, ou une purge lors des écritures) et une taille maximale ; en production j'utiliserais une bibliothèque éprouvée. Et pour éviter que 100 requêtes rechargent la même clé expirée, j'ajouterais `singleflight` autour du chargement."
  - key: code-var-wg-sync-waitgroup-var
    format: code-output
    question: |-
      ```go
      var wg sync.WaitGroup
      var mu sync.Mutex
      total := 0
      for i := 1; i <= 100; i++ {
          wg.Add(1)
          go func() { defer wg.Done(); mu.Lock(); total += i; mu.Unlock() }()
      }
      wg.Wait()
      fmt.Println(total)
      ```
    answer: '`5050` en Go 1.22+ (chaque goroutine capture sa propre variable `i`). En Go 1.21, le résultat serait imprévisible (les goroutines liraient une variable partagée qui change) et le détecteur de courses signalerait une data race.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tvar mu sync.Mutex\n\ttotal := 0\n\tfor i := 1; i <= 100; i++ {\n\t    wg.Add(1)\n\t    go func() {\n\t        defer wg.Done()\n\t        mu.Lock()\n\t        total += i\n\t        mu.Unlock()\n\t    }()\n\t}\n\twg.Wait()\n\tfmt.Println(total)\n}\n"
      output: '5050'
  - key: vf-lectures
    format: true-false
    question: Seules les écritures d'un état partagé ont besoin du verrou ; les lectures peuvent s'en passer.
    truth: false
    answer: Une lecture concurrente d'une écriture est aussi une data race.
  - key: vf-zero
    format: true-false
    question: Un `sync.Mutex` déclaré sans initialisation est utilisable tel quel.
    truth: true
    answer: Sa valeur zéro est un mutex déverrouillé.
  - key: vf-reentrant
    format: true-false
    question: Une goroutine qui a déjà le verrou peut appeler `Lock()` une seconde fois sans bloquer.
    truth: false
    answer: 'sync.Mutex n''est pas réentrant : le second Lock bloque pour toujours.'
  - key: vf-unlock-autre
    format: true-false
    question: En Go, une goroutine peut déverrouiller un Mutex verrouillé par une autre.
    truth: true
    answer: Le Mutex n'est pas attaché à une goroutine, mais ce style rend le code difficile à suivre.
  - key: qcm-regles
    format: multiple-choice
    question: Quelles pratiques sont recommandées avec un sync.Mutex ?
    choices:
      - text: '`defer mu.Unlock()` juste après `mu.Lock()`'
        correct: true
      - text: Placer le mutex à côté des champs qu'il protège
        correct: true
      - text: Faire les appels HTTP sous verrou pour être sûr
        correct: false
      - text: Passer la struct qui contient le mutex par valeur
        correct: false
    answer: Une copie a son propre verrou et ne protège plus rien.
  - key: qcm-deadlock
    format: multiple-choice
    question: Lesquels de ces codes provoquent un blocage ?
    choices:
      - text: Une méthode qui verrouille puis appelle une autre méthode qui reverrouille le même mutex
        correct: true
      - text: Deux goroutines qui prennent A puis B, et B puis A
        correct: true
      - text: Lock, defer Unlock, puis un return anticipé
        correct: false
      - text: Deux mutex différents pris toujours dans le même ordre
        correct: false
    answer: Le defer rend le verrou ; l'ordre fixe évite l'attente circulaire.
  - key: qcm-recepteur
    format: multiple-choice
    question: Une struct contient un `sync.Mutex`. Quel récepteur pour ses méthodes ?
    choices:
      - text: Un récepteur pointeur
        correct: true
      - text: Un récepteur valeur
        correct: false
      - text: Peu importe
        correct: false
      - text: Un récepteur valeur pour les lectures, pointeur pour les écritures
        correct: false
    answer: Un récepteur valeur copie le mutex à chaque appel, et la copie ne protège rien.
  - key: qcm-section
    format: multiple-choice
    question: Pourquoi garder une section critique courte ?
    choices:
      - text: Les autres goroutines attendent pendant qu'elle s'exécute
        correct: true
      - text: Une entrée-sortie lente sous verrou bloque tout le service
        correct: true
      - text: Le verrou expire au bout d'une seconde
        correct: false
      - text: Le compilateur l'exige
        correct: false
    answer: Un verrou n'expire jamais.
  - key: trous-lock
    format: fill-in
