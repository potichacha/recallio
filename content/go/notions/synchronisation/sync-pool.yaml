notion: sync-pool
lesson: "**`sync.Pool`** garde des objets **temporaires** pour les réutiliser au lieu de les réallouer : moins d'allocations,\ndonc moins de travail pour le ramasse-miettes sur un chemin très sollicité.\n\n```go\nvar tampons = sync.Pool{\n\tNew: func() any { return new(bytes.Buffer) },\n}\n\nfunc encoder(v Valeur) []byte {\n\tb := tampons.Get().(*bytes.Buffer)\n\tb.Reset()                 // l'objet peut contenir les données d'un usage précédent\n\tdefer tampons.Put(b)\n\tecrire(b, v)\n\treturn bytes.Clone(b.Bytes()) // ne pas renvoyer la mémoire du pool\n}\n```\n\nCe qu'il faut savoir :\n- le pool **peut vider** ses objets à tout moment, en pratique à chaque cycle du ramasse-miettes : ce n'est **pas un\n  cache** ni un pool de connexions ;\n- `Get` renvoie un objet du pool, ou le résultat de `New` s'il est vide (ou `nil` sans `New`) ;\n- un objet rendu doit être **remis à zéro** (`Reset`) avant usage, et ne plus être utilisé après `Put` ;\n- on y met de préférence des **pointeurs** : un `Put` de valeur non pointeur alloue (l'interface `any` l'emballe) ;\n- éviter de rendre des objets **énormes** (un tampon qui a grossi à 50 Mo) : ils resteraient en mémoire, on les jette\n  au-delà d'une taille ;\n- le pool est sûr entre goroutines, et chaque processeur a son cache local : il passe bien à l'échelle.\n\nOn ne l'utilise **qu'après mesure** : un profil d'allocations (`go test -bench -benchmem`, pprof) qui montre un objet\nalloué en masse. Sinon il ajoute de la complexité et des bugs (données qui fuient d'une requête à l'autre).\n\n**En entretien** : « Un sac d'objets temporaires, vidé par le GC ; Get, Reset, Put ; pas un cache ni un pool de\nconnexions ; seulement sur un chemin chaud mesuré. »"
cards:
  - key: sync-pool-pool-connexions
    format: course
    question: "`sync.Pool` est-il un pool de connexions ?"
    choices:
      - {text: "Non : un cache d'objets temporaires, que le GC peut vider à tout moment", correct: true}
      - {text: "Oui : il garde les connexions ouvertes, et les ferme quand il est plein", correct: false}
      - {text: "Oui, mais il faut appeler `Close` sur le pool à l'arrêt du programme", correct: false}
      - {text: "Non : un pool de goroutines, qui exécute les tâches qu'on lui confie", correct: false}
    answer: "Non : c'est un cache d'objets temporaires réutilisables, que le GC peut vider à tout moment sans les fermer. Pour des connexions, il faut un vrai pool (`net/http`, `database/sql`)."
  - key: avant-remettre-objet-sync-pool
    format: course
    question: "Que faut-il faire avant de remettre un objet dans un `sync.Pool` ?"
    choices:
      - {text: "Le remettre à zéro, par exemple avec `Reset`, pour effacer son contenu", correct: true}
      - {text: "Le fermer avec `Close`, pour que le pool puisse le libérer proprement", correct: false}
      - {text: "Le copier, pour que l'appelant garde l'original après le `Put`", correct: false}
      - {text: "Rien : le pool remet lui-même chaque objet à zéro lors du `Get`", correct: false}
    answer: "Le réinitialiser (`Reset` sur un `bytes.Buffer`) : sinon, le prochain `Get` récupère le contenu d'un usage précédent. Le pool ne remet rien à zéro de lui-même ; on peut aussi le faire juste après `Get`."
  - key: terme-sync-pool
    format: course
    question: "Que désigne le type `sync.Pool` de la bibliothèque standard ?"
    choices:
      - {text: "Un cache d'objets temporaires réutilisables, pour soulager le ramasse-miettes", correct: true}
      - {text: "Un pool de goroutines, qui limite le nombre de tâches exécutées en parallèle", correct: false}
      - {text: "Un pool de connexions réseau, réutilisées d'une requête à l'autre", correct: false}
      - {text: "Un cache de résultats par clé, avec une durée de vie pour chaque entrée", correct: false}
    answer: "Un cache d'objets temporaires réutilisables, pour éviter des allocations répétées. Ce n'est ni un pool de goroutines, ni un pool de connexions, ni un cache par clé : le GC peut le vider à tout moment."
  - key: quand
    format: course
    question: "Quand utiliser `sync.Pool` ?"
    choices:
      - {text: "Sur un chemin chaud où un profil montre beaucoup d'allocations d'objets temporaires", correct: true}
      - {text: "Pour tout objet alloué plus d'une fois, par principe, dès l'écriture du code", correct: false}
      - {text: "Pour garder des résultats de calcul d'une requête à l'autre, comme un cache", correct: false}
      - {text: "Pour limiter le nombre de goroutines qui tournent en même temps dans le service", correct: false}
    answer: "Sur un chemin très sollicité où un profil montre beaucoup d'allocations d'objets temporaires du même type (tampons, encodeurs) : on les réutilise pour soulager le ramasse-miettes. Jamais par principe, et jamais comme cache."
  - key: vf-gc
    format: true-false
    question: Les objets d'un sync.Pool peuvent disparaître à tout moment, notamment lors d'un cycle du ramasse-miettes.
    truth: true
    answer: C'est pourquoi ce n'est pas un cache.
  - key: vf-reset
    format: true-false
    question: Un objet obtenu par `Get` est toujours dans son état initial.
    truth: false
    answer: 'Il peut contenir les données d''un usage précédent : on le remet à zéro.'
  - key: vf-concurrent
    format: true-false
    question: sync.Pool peut être utilisé par plusieurs goroutines sans verrou supplémentaire.
    truth: true
    answer: Il est conçu pour, avec un cache local par processeur.
  - key: vf-apres-put
    format: true-false
    question: On peut continuer à lire un tampon après l'avoir remis dans le pool, tant qu'on ne l'a pas modifié.
    truth: false
    answer: Une autre goroutine peut le récupérer et l'écraser aussitôt.
  - key: qcm-bon-usage
    format: multiple-choice
    question: "Lequel de ces usages de `sync.Pool` est correct ?"
    choices:
      - {text: "Réutiliser des `bytes.Buffer` pour encoder des réponses JSON", correct: true}
      - {text: "Garder ouvertes des connexions à la base de données", correct: false}
      - {text: "Mettre en cache des résultats de calcul pour une heure", correct: false}
      - {text: "Limiter le nombre de goroutines lancées en même temps", correct: false}
    answer: "Des tampons temporaires réutilisés : le bon usage, comme de gros tableaux temporaires dans un traitement intensif. Le pool se vide sans prévenir : ni connexions, ni cache."
  - key: qcm-etapes
    format: multiple-choice
    question: "Lesquelles de ces étapes font partie de l'usage d'un objet du pool ?"
    choices:
      - text: '`Get`, puis assertion de type'
        correct: true
      - text: Remettre l'objet à zéro avant de s'en servir
        correct: true
      - text: '`Put` quand on a fini, sans plus le toucher ensuite'
        correct: true
      - text: '`Close` sur le pool à la fin de la requête'
        correct: false
    answer: Le pool n'a pas de Close.
  - key: qcm-pointeurs
    format: multiple-choice
    question: Pourquoi mettre des pointeurs dans un sync.Pool ?
    choices:
      - {text: "Mettre une valeur non pointeur dans un `any` alloue, ce qui annule le gain", correct: true}
      - {text: "Le pool refuse les valeurs non pointeurs, et `Put` panique s'il en reçoit une", correct: false}
      - {text: "Les pointeurs ne sont jamais ramassés par le GC, contrairement aux valeurs", correct: false}
      - {text: "Pour que `Get` soit plus rapide que `New`, qui copie les valeurs reçues", correct: false}
    answer: staticcheck signale d'ailleurs SA6002 pour un Put de slice.
  - key: qcm-gros
    format: multiple-choice
    question: Un tampon du pool a grossi à 100 Mo pour une requête exceptionnelle. Que faire au moment du Put ?
    choices:
      - {text: "Ne pas le remettre dans le pool, au-delà d'une taille limite", correct: true}
      - {text: "Le remettre dans le pool, qui saura s'en occuper lui-même", correct: false}
      - {text: "Appeler `runtime.GC()`, pour libérer la mémoire du tampon", correct: false}
      - {text: "Appeler `Reset`, qui rend sa mémoire au système avant le `Put`", correct: false}
    answer: Sinon toutes les requêtes suivantes gardent 100 Mo en mémoire.
  - key: bug-reset
    format: bug-fix
    question: |-
      Des réponses contiennent parfois des morceaux de la réponse précédente :
      ```go
      b := tampons.Get().(*bytes.Buffer)
      defer tampons.Put(b)
      json.NewEncoder(b).Encode(v)
      w.Write(b.Bytes())
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Appeler `b.Reset()` juste après le `Get`, avant d'écrire dans le tampon", correct: true}
      - {text: "Appeler `tampons.Put(b)` sans `defer`, juste après `w.Write`", correct: false}
      - {text: "Créer un seul encodeur JSON hors de la fonction, partagé par tous", correct: false}
      - {text: "Remplacer `b.Bytes()` par `b.String()` dans l'appel à `w.Write`", correct: false}
    answer: |-
      ```go
      b := tampons.Get().(*bytes.Buffer)
      b.Reset()
      defer tampons.Put(b)
      json.NewEncoder(b).Encode(v)
      w.Write(b.Bytes())
      ```
      Le tampon gardait le contenu de son usage précédent : le pool ne remet rien à zéro. Déplacer le `Put` ne change rien à ce contenu.
  - key: bug-fuite-memoire
    format: bug-fix
    question: |-
      La fonction renvoie des données qui changent toutes seules plus tard :
      ```go
      func encoder(v Valeur) []byte {
      	b := tampons.Get().(*bytes.Buffer)
      	b.Reset()
      	defer tampons.Put(b)
      	ecrire(b, v)
      	return b.Bytes()
      }
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Renvoyer une copie, avec `bytes.Clone(b.Bytes())`", correct: true}
      - {text: "Renvoyer `b.Bytes()[:b.Len()]`, borné à la taille écrite", correct: false}
      - {text: "Appeler `b.Reset()` après `b.Bytes()`, avant le retour", correct: false}
      - {text: "Retirer le `b.Reset()` du début, qui efface les données", correct: false}
    answer: |-
      ```go
      func encoder(v Valeur) []byte {
      	b := tampons.Get().(*bytes.Buffer)
      	b.Reset()
      	defer tampons.Put(b)
      	ecrire(b, v)
      	return bytes.Clone(b.Bytes())
      }
      ```
      `b.Bytes()` partageait la mémoire du tampon rendu au pool, réutilisé par d'autres appels ; on renvoie une copie. Un sous-slice partage toujours la même mémoire.
  - key: bug-connexions
    format: bug-fix
    question: "Un collègue stocke les connexions TCP vers un service dans un `sync.Pool`, et des connexions se ferment sans jamais être rendues proprement. Que proposes-tu ?"
    choices:
      - {text: "Un vrai pool de connexions, borné et fermé proprement, comme celui de `net/http`", correct: true}
      - {text: "Appeler `runtime.GC()` moins souvent, pour que le pool garde ses connexions", correct: false}
      - {text: "Fermer chaque connexion avant le `Put`, pour que le pool la rouvre au `Get`", correct: false}
      - {text: "Agrandir le pool avec son champ `Size`, pour qu'il garde plus de connexions", correct: false}
    answer: |-
      ```go
      // un pool de connexions fait pour cela, borné et fermé proprement
      transport := &http.Transport{MaxIdleConnsPerHost: 20}
      client := &http.Client{Transport: transport}
      ```
      `sync.Pool` lâche ses objets au GC sans les fermer : les connexions fuient. Il faut un vrai pool de connexions (celui de `net/http`, de `database/sql`, ou un channel bufferisé avec une fermeture explicite) ; `sync.Pool` n'a d'ailleurs pas de taille.
  - key: bug-slice
    format: bug-fix
    question: |-
      Le pool ne réduit pas les allocations, et staticcheck signale SA6002 :
      ```go
      var pool = sync.Pool{New: func() any { return make([]byte, 0, 4096) }}

      b := pool.Get().([]byte)
      // ...
      pool.Put(b[:0])
      ```
      Quelle correction est la bonne ?
    choices:
      - {text: "Ranger un `*[]byte` dans le pool, pour que `Put` n'alloue plus l'en-tête du slice", correct: true}
      - {text: "Remettre `b` sans le tronquer, avec `pool.Put(b)` au lieu de `pool.Put(b[:0])`", correct: false}
      - {text: "Agrandir la capacité initiale du slice, de 4096 à 65536 octets", correct: false}
      - {text: "Ranger un tableau `[4096]byte` tel quel, à la place du slice", correct: false}
    answer: |-
      ```go
      var pool = sync.Pool{New: func() any {
      	b := make([]byte, 0, 4096)
      	return &b
      }}

      pb := pool.Get().(*[]byte)
      b := (*pb)[:0]
      // ...
      *pb = b[:0]
      pool.Put(pb)
      ```
      Mettre un slice dans un `any` alloue son en-tête à chaque `Put` ; avec un pointeur vers le slice, plus d'allocation. Un tableau rangé par valeur dans un `any` serait copié et alloué lui aussi.
  - key: scenario-mesurer
    format: scenario
    question: "Comment décides-tu d'introduire un `sync.Pool` ?"
    choices:
      - {text: "Sur preuve : un profil ou un benchmark `-benchmem` montre des allocations en masse", correct: true}
      - {text: "Par principe, pour chaque struct allouée dans un handler HTTP du service", correct: false}
      - {text: "Dès qu'un objet est alloué dans une boucle, avant toute mesure du gain", correct: false}
      - {text: "Quand le service manque de connexions à la base, pour les réutiliser", correct: false}
    answer: "Seulement sur preuve : un profil d'allocations ou un benchmark `-benchmem` montre qu'un objet temporaire est alloué en masse sur un chemin chaud, et que le GC pèse. Je compare avant et après ; si le gain est faible, je garde le code simple."
  - key: scenario-vs-cache
    format: scenario
    question: "Pourquoi `sync.Pool` n'est-il pas un cache, et que prendre si tu veux un cache ?"
    choices:
      - {text: "Le GC peut le vider à tout moment, et sans clé : pour un cache, une map avec éviction", correct: true}
      - {text: "C'est un cache, mais sans durée de vie : il suffit d'y ajouter un `time.AfterFunc`", correct: false}
      - {text: "Il garde ses objets pour toujours : pour un cache, une `sync.Map` vidée à la main", correct: false}
      - {text: "Il n'accepte que des pointeurs : pour un cache de valeurs, un channel bufferisé", correct: false}
    answer: "Le pool peut lâcher tous ses objets à chaque cycle du GC, sans prévenir, et on y obtient « un objet du type », pas « le résultat pour cette clé ». Pour un cache : une map protégée avec une éviction (LRU, durée de vie), ou une bibliothèque (ristretto), et `singleflight` contre les calculs en double."
  - key: scenario-donnees-sensibles
    format: scenario
    question: "Quels risques de sécurité un `sync.Pool` peut-il introduire, et comment les éviter ?"
    choices:
      - {text: "Des données d'une requête qui fuient dans une autre : remise à zéro, et une copie renvoyée", correct: true}
      - {text: "Le pool garde ses objets en clair en mémoire : je chiffre chaque objet avant le `Put`", correct: false}
      - {text: "Un autre processus peut lire le pool : je le déclare dans un package interne", correct: false}
      - {text: "Aucun risque : chaque goroutine a son propre pool, isolé de celui des autres", correct: false}
    answer: "Des données d'une requête peuvent apparaître dans la réponse d'une autre, si un objet n'est pas remis à zéro ou si une référence à sa mémoire survit au `Put`. Je remets à zéro systématiquement, je ne renvoie jamais la mémoire du pool (une copie), et je n'utilise plus l'objet après `Put`."
  - key: scenario-gros-objets
    format: scenario
    question: "La mémoire de ton service reste haute après un pic de trafic, et le profil montre des tampons de `sync.Pool` énormes. Que fais-tu ?"
    choices:
      - {text: "Je ne remets dans le pool que les tampons sous une taille limite, les autres vont au GC", correct: true}
      - {text: "J'appelle `runtime.GC()` après chaque requête, pour vider le pool plus souvent", correct: false}
      - {text: "J'appelle `Reset` sur chaque tampon avant le `Put`, pour rendre sa mémoire", correct: false}
      - {text: "Je passe le pool en variable locale de chaque handler, pour qu'il soit libéré", correct: false}
    answer: "Les tampons agrandis par quelques requêtes géantes sont remis dans le pool et réutilisés. Je ne remets que ceux sous une taille limite (`if b.Cap() <= 64<<10 { pool.Put(b) }`) ; `Reset` garde la capacité. Si les tailles varient beaucoup, plusieurs pools par classe de taille."
