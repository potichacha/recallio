notion: cmp-ordered
lesson: "Depuis Go 1.21, trois packages génériques couvrent la plupart des besoins courants :\n\n**`cmp`**\n- `cmp.Ordered` : la contrainte des types ordonnés (entiers, flottants, chaînes, et leurs types dérivés) ;\n- `cmp.Compare(a, b)` : -1, 0 ou 1, et ordonne correctement les NaN ;\n- `cmp.Less(a, b)` ;\n- `cmp.Or(valeurs...)` (Go 1.22) : la **première valeur non nulle**, pratique pour les valeurs par défaut :\n  `port := cmp.Or(os.Getenv(\"PORT\"), \"8080\")`.\n\n**`slices`** : `Sort`, `SortFunc`, `SortStableFunc`, `Contains`, `Index`, `IndexFunc`, `BinarySearch`, `Max`, `Min`,\n`Reverse`, `Equal`, `Compact`, `Insert`, `Delete`, `Clone`, `Collect`, `Sorted`, `All`, `Values`...\n\n**`maps`** : `Keys`, `Values` (des itérateurs, Go 1.23), `Clone`, `Copy`, `Equal`, `DeleteFunc`, `Collect`.\n\n```go\nslices.SortFunc(gens, func(a, b Personne) int {\n\treturn cmp.Or(\n\t\tcmp.Compare(a.Nom, b.Nom), // d'abord le nom\n\t\tcmp.Compare(a.Age, b.Age), // puis l'âge, en cas d'égalité\n\t)\n})\ncles := slices.Sorted(maps.Keys(m))\n```\n\n`cmp.Or` combiné à `cmp.Compare` donne un **tri multicritère** très lisible : le premier critère non nul décide.\n\n**Piège classique** : écrire `return a.Age - b.Age` comme comparateur. La soustraction peut déborder sur des entiers\nextrêmes ; `cmp.Compare` est toujours correct.\n\n**En entretien** : « cmp.Ordered pour contraindre aux types ordonnés, cmp.Compare et cmp.Or pour les comparateurs et\nles valeurs par défaut, slices et maps pour les opérations courantes, génériques et testées. »"
cards:
  - key: contrainte-types-ordonnes
    format: course
    question: Quelle contrainte pour les types ordonnés ?
    answer: cmp.Ordered (Go 1.21).
  - key: contiennent-packages-slices-maps-cmp
    format: course
    question: Que contiennent les packages slices, maps et cmp ?
    answer: Des fonctions génériques sur les slices, les maps et la comparaison (Go 1.21).
  - key: sert-cmp-or
    format: course
    question: À quoi sert cmp.Or ?
    answer: Renvoyer le premier argument non nul, pratique pour enchaîner des critères de tri.
  - key: terme-cmp
    format: course
    question: Que désigne « cmp » ?
    answer: Package de comparaison (Compare, Or, Ordered), Go 1.21
  - key: or
    format: course
    question: À quoi sert `cmp.Or` ?
    answer: 'Il renvoie le premier argument qui n''est pas la valeur zéro : pratique pour une valeur par défaut, ou pour enchaîner les critères d''un tri.'
  - key: compare
    format: course
    question: Pourquoi préférer `cmp.Compare(a, b)` à `a - b` dans un comparateur ?
    answer: La soustraction peut déborder sur de grands entiers et ne gère pas les flottants NaN ; `cmp.Compare` renvoie toujours -1, 0 ou 1 correctement.
  - key: vf-ordered
    format: true-false
    question: '`cmp.Ordered` accepte les chaînes.'
    truth: true
    answer: Entiers, flottants et chaînes, dérivés compris.
  - key: vf-or
    format: true-false
    question: '`cmp.Or("", "8080")` vaut "8080".'
    truth: true
    answer: La chaîne vide est la valeur zéro, ignorée.
  - key: vf-keys
    format: true-false
    question: '`maps.Keys` renvoie un slice trié des clés.'
    truth: false
    answer: Il renvoie un itérateur (Go 1.23), dans l'ordre aléatoire de la map ; `slices.Sorted(maps.Keys(m))` donne un slice trié.
  - key: vf-struct
    format: true-false
    question: '`cmp.Ordered` accepte une struct `Point{X, Y int}`.'
    truth: false
    answer: Une struct n'est pas ordonnée ; on trie avec `slices.SortFunc` et un comparateur.
  - key: qcm-multicritere
    format: multiple-choice
    question: Comment trier des personnes par nom, puis par âge ?
    choices:
      - text: '`slices.SortFunc(gens, func(a, b P) int { return cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age)) })`'
        correct: true
      - text: '`slices.Sort(gens)`'
        correct: false
      - text: '`sort.Strings(gens)`'
        correct: false
      - text: Deux appels `slices.SortFunc` successifs, nom puis âge
        correct: false
    answer: '`cmp.Or` garde le premier critère non nul. Deux tris successifs ne marcheraient qu''avec un tri stable, en commençant par l''âge.'
  - key: qcm-fonctions
    format: multiple-choice
    question: Quelles fonctions existent dans le package `slices` ?
    choices:
      - text: '`slices.Contains`'
        correct: true
      - text: '`slices.BinarySearch`'
        correct: true
      - text: '`slices.Map`'
        correct: false
      - text: '`slices.Sum`'
        correct: false
    answer: Ni Map ni Sum dans la bibliothèque standard.
  - key: qcm-defaut
    format: multiple-choice
    question: Que vaut `cmp.Or(0, 0, 3, 5)` ?
    choices:
      - text: '3'
        correct: true
      - text: '0'
        correct: false
      - text: '5'
        correct: false
      - text: '8'
        correct: false
    answer: Le premier argument non nul.
  - key: qcm-max
    format: multiple-choice
    question: Que fait `slices.Max([]int{})` ?
    choices:
      - text: Il panique, le slice étant vide
        correct: true
      - text: Il renvoie 0
        correct: false
      - text: Il renvoie -1
        correct: false
      - text: Il renvoie une erreur
        correct: false
    answer: On vérifie la longueur avant, ou l'on utilise `max` natif sur des valeurs connues.
  - key: trous-compare
    format: fill-in
    question: "Complétez le comparateur :\n```go\nslices.SortFunc(produits, func(a, b Produit) int {\n\treturn cmp.___(a.Prix, b.Prix)\n})\n```"
    blanks:
      - - Compare
    answer: '`cmp.Compare` renvoie -1, 0 ou 1.'
  - key: trous-or
    format: fill-in
    question: |-
      Complétez la valeur par défaut :
      ```go
      port := cmp.___(os.Getenv("PORT"), "8080")
      ```
    blanks:
      - - Or
    answer: '`cmp.Or` renvoie la première valeur non vide.'
  - key: trous-sorted
    format: fill-in
    question: |-
      Complétez pour obtenir les clés triées :
      ```go
      cles := slices.___(maps.Keys(m))
      ```
    blanks:
      - - Sorted
    answer: '`slices.Sorted` collecte et trie un itérateur.'
  - key: trous-ordered
    format: fill-in
    question: |-
      Complétez la contrainte :
      ```go
      func Borner[T cmp.___](x, lo, hi T) T { return min(max(x, lo), hi) }
      ```
    blanks:
      - - Ordered
    answer: '`min` et `max` demandent des types ordonnés.'
  - key: code-multicritere
    format: code-output
    question: "```go\ntype P struct {\n\tNom string\n\tAge int\n}\n\ngens := []P{{\"bob\", 30}, {\"ada\", 40}, {\"bob\", 25}}\nslices.SortFunc(gens, func(a, b P) int {\n\treturn cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age))\n})\nfmt.Println(gens)\n```"
    answer: '`[{ada 40} {bob 25} {bob 30}]` : par nom, puis par âge pour départager.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype P struct {\n\tNom string\n\tAge int\n}\n\nfunc main() {\n\tgens := []P{{\"bob\", 30}, {\"ada\", 40}, {\"bob\", 25}}\n\tslices.SortFunc(gens, func(a, b P) int {\n\t\treturn cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age))\n\t})\n\tfmt.Println(gens)\n}\n"
      output: '[{ada 40} {bob 25} {bob 30}]'
  - key: code-or
    format: code-output
    question: |-
      ```go
      fmt.Println(cmp.Or("", "défaut"), cmp.Or(0, 0, 7), cmp.Or("a", "b"))
      ```
    answer: '`défaut 7 a` : la première valeur non nulle.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tfmt.Println(cmp.Or(\"\", \"défaut\"), cmp.Or(0, 0, 7), cmp.Or(\"a\", \"b\"))\n}\n"
      output: défaut 7 a
  - key: code-binary
    format: code-output
    question: |-
      ```go
      xs := []int{10, 20, 30, 40}
      i, trouve := slices.BinarySearch(xs, 30)
      j, trouve2 := slices.BinarySearch(xs, 25)
      fmt.Println(i, trouve, j, trouve2)
      ```
    answer: '`2 true 2 false` : pour une valeur absente, l''indice où l''insérer.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\txs := []int{10, 20, 30, 40}\n\ti, trouve := slices.BinarySearch(xs, 30)\n\tj, trouve2 := slices.BinarySearch(xs, 25)\n\tfmt.Println(i, trouve, j, trouve2)\n}\n"
      output: 2 true 2 false
  - key: code-compare
    format: code-output
    question: |-
      ```go
      fmt.Println(cmp.Compare(1, 2), cmp.Compare("b", "a"), cmp.Compare(2.0, 2.0))
      ```
    answer: '`-1 1 0`.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tfmt.Println(cmp.Compare(1, 2), cmp.Compare(\"b\", \"a\"), cmp.Compare(2.0, 2.0))\n}\n"
      output: "-1 1 0"
