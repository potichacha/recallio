notion: cmp-ordered
lesson: "Depuis Go 1.21, trois packages génériques couvrent la plupart des besoins courants :\n\n**`cmp`**\n- `cmp.Ordered` : la contrainte des types ordonnés (entiers, flottants, chaînes, et leurs types dérivés) ;\n- `cmp.Compare(a, b)` : -1, 0 ou 1, et ordonne correctement les NaN ;\n- `cmp.Less(a, b)` ;\n- `cmp.Or(valeurs...)` (Go 1.22) : la **première valeur non nulle**, pratique pour les valeurs par défaut :\n  `port := cmp.Or(os.Getenv(\"PORT\"), \"8080\")`.\n\n**`slices`** : `Sort`, `SortFunc`, `SortStableFunc`, `Contains`, `Index`, `IndexFunc`, `BinarySearch`, `Max`, `Min`,\n`Reverse`, `Equal`, `Compact`, `Insert`, `Delete`, `Clone`, `Collect`, `Sorted`, `All`, `Values`...\n\n**`maps`** : `Keys`, `Values` (des itérateurs, Go 1.23), `Clone`, `Copy`, `Equal`, `DeleteFunc`, `Collect`.\n\n```go\nslices.SortFunc(gens, func(a, b Personne) int {\n\treturn cmp.Or(\n\t\tcmp.Compare(a.Nom, b.Nom), // d'abord le nom\n\t\tcmp.Compare(a.Age, b.Age), // puis l'âge, en cas d'égalité\n\t)\n})\ncles := slices.Sorted(maps.Keys(m))\n```\n\n`cmp.Or` combiné à `cmp.Compare` donne un **tri multicritère** très lisible : le premier critère non nul décide.\n\n**Piège classique** : écrire `return a.Age - b.Age` comme comparateur. La soustraction peut déborder sur des entiers\nextrêmes ; `cmp.Compare` est toujours correct.\n\n**En entretien** : « cmp.Ordered pour contraindre aux types ordonnés, cmp.Compare et cmp.Or pour les comparateurs et\nles valeurs par défaut, slices et maps pour les opérations courantes, génériques et testées. »"
cards:
  - key: contrainte-types-ordonnes
    format: course
    question: "Quelle contrainte de la bibliothèque standard accepte les types qu'on peut comparer avec `<` ?"
    choices:
      - {text: "`cmp.Ordered`, du package `cmp` de la bibliothèque standard", correct: true}
      - {text: "`comparable`, la contrainte prédéclarée qui autorise `==`", correct: false}
      - {text: "`sort.Interface`, avec ses méthodes `Len`, `Less` et `Swap`", correct: false}
      - {text: "`any`, car `<` existe pour tous les types de base de Go", correct: false}
    answer: "`cmp.Ordered` (Go 1.21) regroupe, avec `~`, les entiers, les flottants et les chaînes : elle autorise `<`, `>`, `min` et `max`. `comparable` n'autorise que `==` et `!=`."
  - key: contiennent-packages-slices-maps-cmp
    format: course
    question: "Que contiennent les packages `slices`, `maps` et `cmp` ?"
    choices:
      - {text: "Des fonctions génériques sur les slices, les maps et la comparaison", correct: true}
      - {text: "Des collections triées et concurrentes, comme une `SortedMap`", correct: false}
      - {text: "Des interfaces à implémenter pour trier et comparer ses types", correct: false}
      - {text: "Des alias des fonctions de `sort` et de `container`, sans generics", correct: false}
    answer: "Des fonctions génériques (Go 1.21) : `slices.Sort`, `slices.Contains`, `maps.Keys`, `cmp.Compare`, `cmp.Or`... Elles remplacent les helpers écrits pour chaque type, sans ajouter de nouvelles collections."
  - key: sert-cmp-or
    format: course
    question: "Dans un comparateur de tri, à quoi sert `cmp.Or` ?"
    choices:
      - {text: "À enchaîner les critères : il renvoie le premier résultat non nul", correct: true}
      - {text: "À combiner les résultats par un « ou » logique, comme `||`", correct: false}
      - {text: "À inverser l'ordre du tri quand le premier critère renvoie 0", correct: false}
      - {text: "À additionner les comparaisons pour en faire un score global", correct: false}
    answer: "`cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age))` renvoie le premier résultat qui n'est pas 0 : le nom décide, l'âge départage. Ce n'est pas un `||` : il renvoie une valeur, pas un booléen."
  - key: terme-cmp
    format: course
    question: "Que désigne le package `cmp` de la bibliothèque standard ?"
    choices:
      - {text: "Le package de comparaison : `Compare`, `Less`, `Or` et `Ordered`", correct: true}
      - {text: "L'interface `Comparable` qu'un type implémente pour se trier", correct: false}
      - {text: "Le package des collections triées, comme les arbres et les tas", correct: false}
      - {text: "La commande qui compare deux binaires Go octet par octet", correct: false}
    answer: "Le package `cmp` (Go 1.21) regroupe `Compare`, `Less`, `Or` et la contrainte `Ordered`. Go n'a pas d'interface `Comparable` à la Java : on passe une fonction de comparaison."
  - key: or
    format: course
    question: "À quoi sert `cmp.Or` ?"
    choices:
      - {text: "Il renvoie le premier argument qui n'est pas la valeur zéro", correct: true}
      - {text: "Il renvoie `true` si l'un des arguments vaut `true`, comme `||`", correct: false}
      - {text: "Il renvoie le plus petit de ses arguments, selon l'ordre de `<`", correct: false}
      - {text: "Il renvoie le dernier argument non nul, pour écraser les défauts", correct: false}
    answer: "Il renvoie le premier argument qui n'est pas la valeur zéro : pratique pour une valeur par défaut (`cmp.Or(port, \"8080\")`), ou pour enchaîner les critères d'un tri. Ce n'est pas un `||` booléen."
  - key: compare
    format: course
    question: "Pourquoi préférer `cmp.Compare(a, b)` à `a - b` dans un comparateur ?"
    choices:
      - {text: "La soustraction peut déborder, et `cmp.Compare` gère aussi les NaN", correct: true}
      - {text: "`slices.SortFunc` refuse un résultat autre que -1, 0 ou 1", correct: false}
      - {text: "`cmp.Compare` est plus rapide, car il évite une soustraction", correct: false}
      - {text: "La soustraction inverse l'ordre du tri pour les nombres négatifs", correct: false}
    answer: "Sur de grands entiers, `a - b` peut déborder et changer de signe, et un NaN fausse l'ordre ; `cmp.Compare` renvoie toujours -1, 0 ou 1 correctement. `SortFunc` accepte n'importe quel entier négatif ou positif : le problème est le débordement."
  - key: vf-ordered
    format: true-false
    question: '`cmp.Ordered` accepte les chaînes.'
    truth: true
    answer: Entiers, flottants et chaînes, dérivés compris.
  - key: vf-or
    format: true-false
    question: '`cmp.Or("", "8080")` vaut "8080".'
    truth: true
    answer: La chaîne vide est la valeur zéro, ignorée.
  - key: vf-keys
    format: true-false
    question: '`maps.Keys` renvoie un slice trié des clés.'
    truth: false
    answer: Il renvoie un itérateur (Go 1.23), dans l'ordre aléatoire de la map ; `slices.Sorted(maps.Keys(m))` donne un slice trié.
  - key: vf-struct
    format: true-false
    question: '`cmp.Ordered` accepte une struct `Point{X, Y int}`.'
    truth: false
    answer: Une struct n'est pas ordonnée ; on trie avec `slices.SortFunc` et un comparateur.
  - key: qcm-multicritere
    format: multiple-choice
    question: Comment trier des personnes par nom, puis par âge ?
    choices:
      - {text: "`slices.SortFunc(gens, func(a, b P) int { return cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age)) })`", correct: true}
      - {text: "`slices.SortFunc(gens, func(a, b P) int { return cmp.Compare(a.Nom, b.Nom) + cmp.Compare(a.Age, b.Age) })`", correct: false}
      - {text: "`slices.SortFunc(gens, func(a, b P) int { return cmp.Or(cmp.Compare(a.Age, b.Age), cmp.Compare(a.Nom, b.Nom)) })`", correct: false}
      - {text: "Deux tris successifs : `slices.SortFunc` par nom, puis `slices.SortFunc` par âge, sur la même slice", correct: false}
    answer: "`cmp.Or` garde le premier critère non nul : le nom décide, l'âge départage. Additionner les comparaisons mélange les critères ; deux tris successifs ne marcheraient qu'avec un tri stable, en commençant par l'âge."
  - key: qcm-fonctions
    format: multiple-choice
    question: "Laquelle de ces fonctions existe dans le package `slices` ?"
    choices:
      - {text: "`slices.BinarySearch`", correct: true}
      - {text: "`slices.Map`", correct: false}
      - {text: "`slices.Sum`", correct: false}
      - {text: "`slices.Reduce`", correct: false}
    answer: "`slices.BinarySearch` cherche dans une slice triée, comme `slices.Contains` dans une slice quelconque. La bibliothèque standard n'a ni `Map`, ni `Sum`, ni `Reduce` : une boucle `for` les remplace."
  - key: qcm-defaut
    format: multiple-choice
    question: Que vaut `cmp.Or(0, 0, 3, 5)` ?
    choices:
      - text: '3'
        correct: true
      - text: '0'
        correct: false
      - text: '5'
        correct: false
      - text: '8'
        correct: false
    answer: Le premier argument non nul.
  - key: qcm-max
    format: multiple-choice
    question: Que fait `slices.Max([]int{})` ?
    choices:
      - text: Il panique, le slice étant vide
        correct: true
      - text: Il renvoie 0
        correct: false
      - text: Il renvoie -1
        correct: false
      - text: Il renvoie une erreur
        correct: false
    answer: On vérifie la longueur avant, ou l'on utilise `max` natif sur des valeurs connues.
  - key: trous-compare
    format: fill-in
    question: |-
      Complète le comparateur :
      ```go
      slices.SortFunc(produits, func(a, b Produit) int {
      	return cmp.___(a.Prix, b.Prix)
      })
      ```
    blanks:
      - - Compare
    answer: '`cmp.Compare` renvoie -1, 0 ou 1.'
  - key: trous-or
    format: fill-in
    question: |-
      Complète la valeur par défaut :
      ```go
      port := cmp.___(os.Getenv("PORT"), "8080")
      ```
    blanks:
      - - Or
    answer: '`cmp.Or` renvoie la première valeur non vide.'
  - key: trous-sorted
    format: fill-in
    question: |-
      Complète pour obtenir les clés triées :
      ```go
      cles := slices.___(maps.Keys(m))
      ```
    blanks:
      - - Sorted
    answer: '`slices.Sorted` collecte et trie un itérateur.'
  - key: trous-ordered
    format: fill-in
    question: |-
      Complète la contrainte :
      ```go
      func Borner[T cmp.___](x, lo, hi T) T { return min(max(x, lo), hi) }
      ```
    blanks:
      - - Ordered
    answer: '`min` et `max` demandent des types ordonnés.'
  - key: code-multicritere
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type P struct {
      	Nom string
      	Age int
      }

      gens := []P{{"bob", 30}, {"ada", 40}, {"bob", 25}}
      slices.SortFunc(gens, func(a, b P) int {
      	return cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age))
      })
      fmt.Println(gens)
      ```
    choices:
      - {text: "`[{ada 40} {bob 25} {bob 30}]`", correct: true}
      - {text: "`[{ada 40} {bob 30} {bob 25}]`", correct: false}
      - {text: "`[{bob 25} {bob 30} {ada 40}]`", correct: false}
      - {text: "`[{bob 30} {bob 25} {ada 40}]`", correct: false}
    answer: "`[{ada 40} {bob 25} {bob 30}]` : par nom, puis par âge pour départager les deux « bob ». Trier par âge seul donnerait `bob 25`, `bob 30`, puis `ada 40`."
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype P struct {\n\tNom string\n\tAge int\n}\n\nfunc main() {\n\tgens := []P{{\"bob\", 30}, {\"ada\", 40}, {\"bob\", 25}}\n\tslices.SortFunc(gens, func(a, b P) int {\n\t\treturn cmp.Or(cmp.Compare(a.Nom, b.Nom), cmp.Compare(a.Age, b.Age))\n\t})\n\tfmt.Println(gens)\n}\n"
      output: '[{ada 40} {bob 25} {bob 30}]'
  - key: code-or
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(cmp.Or("", "défaut"), cmp.Or(0, 0, 7), cmp.Or("a", "b"))
      ```
    choices:
      - {text: "`défaut 7 a`", correct: true}
      - {text: "`défaut 0 a`", correct: false}
      - {text: "`défaut 7 b`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`défaut 7 a` : `cmp.Or` renvoie la première valeur non nulle, pas un booléen. `\"a\"` n'est pas vide : c'est elle qui sort, pas `\"b\"`."
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tfmt.Println(cmp.Or(\"\", \"défaut\"), cmp.Or(0, 0, 7), cmp.Or(\"a\", \"b\"))\n}\n"
      output: défaut 7 a
  - key: code-binary
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      xs := []int{10, 20, 30, 40}
      i, trouve := slices.BinarySearch(xs, 30)
      j, trouve2 := slices.BinarySearch(xs, 25)
      fmt.Println(i, trouve, j, trouve2)
      ```
    choices:
      - {text: "`2 true 2 false`", correct: true}
      - {text: "`2 true -1 false`", correct: false}
      - {text: "`2 true -3 false`", correct: false}
      - {text: "`2 true 1 false`", correct: false}
    answer: "`2 true 2 false` : pour une valeur absente, `slices.BinarySearch` renvoie l'indice où l'insérer, avec `false`. Pas d'indice négatif comme le `-(insertion) - 1` de Java."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\txs := []int{10, 20, 30, 40}\n\ti, trouve := slices.BinarySearch(xs, 30)\n\tj, trouve2 := slices.BinarySearch(xs, 25)\n\tfmt.Println(i, trouve, j, trouve2)\n}\n"
      output: 2 true 2 false
  - key: code-compare
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(cmp.Compare(1, 2), cmp.Compare("b", "a"), cmp.Compare(2.0, 2.0))
      ```
    choices:
      - {text: "`-1 1 0`", correct: true}
      - {text: "`1 -1 0`", correct: false}
      - {text: "`-1 -1 0`", correct: false}
      - {text: "`-1 1 1`", correct: false}
    answer: "`-1 1 0` : `cmp.Compare(a, b)` renvoie -1 si `a < b`, 1 si `a > b`, 0 si égaux ; `\"b\"` est après `\"a\"`."
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tfmt.Println(cmp.Compare(1, 2), cmp.Compare(\"b\", \"a\"), cmp.Compare(2.0, 2.0))\n}\n"
      output: "-1 1 0"
