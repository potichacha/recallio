notion: cmp-ordered
cards:
  - key: contrainte-types-ordonnes
    format: course
    question: Quelle contrainte pour les types ordonnés ?
    answer: cmp.Ordered (Go 1.21).
  - key: contiennent-packages-slices-maps-cmp
    format: course
    question: Que contiennent les packages slices, maps et cmp ?
    answer: Des fonctions génériques sur les slices, les maps et la comparaison (Go 1.21).
  - key: sert-cmp-or
    format: course
    question: À quoi sert cmp.Or ?
    answer: Renvoyer le premier argument non nul, pratique pour enchaîner des critères de tri.
  - key: terme-cmp
    format: course
    question: Que désigne « cmp » ?
    answer: Package de comparaison (Compare, Or, Ordered), Go 1.21
