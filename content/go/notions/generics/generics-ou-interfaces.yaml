notion: generics-ou-interfaces
lesson: |-
  Generics et interfaces répondent à des besoins différents :

  | Besoin | Outil |
  |---|---|
  | Le code **appelle des méthodes** sur des valeurs de types variés | une **interface** |
  | Le code **manipule des valeurs** sans appeler de méthodes : stocker, comparer, trier | des **generics** |
  | Une collection **homogène** typée (une pile de `Commande`) | des **generics** |
  | Une collection **hétérogène** (des formes de types différents) | un slice d'**interface** |
  | Un seul type concerné | ni l'un ni l'autre : du code concret |

  Les interfaces offrent un **polymorphisme à l'exécution** : un `[]Forme` contient des carrés et des cercles. Les
  generics offrent un **polymorphisme à la compilation** : chaque instanciation est d'un seul type, et les opérations
  (`<`, `+`, `==`) peuvent porter sur les valeurs elles-mêmes.

  La règle de l'équipe Go : **si une interface suffit, on prend l'interface** ; les generics servent quand on manipule
  des types de base, des collections, ou quand une interface obligerait à des assertions.

  Une fonction générique contrainte par une interface (`func Tous[T Validable](xs []T) error`) combine les deux : elle
  accepte un `[]Commande` tel quel (pas de covariance à contourner) tout en appelant `Valider()`.

  **Piège classique** : rendre générique une couche entière (un `Repository[T]` pour toutes les entités) ; les besoins
  réels de chaque entité (requêtes, contraintes) finissent par imposer des exceptions partout.

  **En entretien** : « Interface si l'on appelle des méthodes et pour les collections hétérogènes ; generics pour
  manipuler des valeurs et les collections homogènes ; code concret pour un seul type. »
cards:
  - key: quand-preferer-interface-generics
    format: course
    question: Quand préférer une interface aux generics ?
    answer: Quand on veut un comportement différent derrière un même contrat, ou qu'on n'appelle que des méthodes.
  - key: collegue-veut-rendre-generique-toute-couche
    format: scenario
    question: Un collègue veut rendre générique toute la couche repository. Ton avis ?
    answer: |-
      C'est tentant (un `Repository[T]` avec `Find`, `Save`, `Delete`), mais je serais prudent. Les requêtes réelles divergent vite d'une entité à l'autre (filtres, jointures, pagination spécifique), et un repository générique finit soit très limité, soit plein d'options et de réflexion.
      Je préfère des repositories **concrets** par agrégat, avec des méthodes nommées selon le métier (`CommandesEnAttente(ctx, clientID)`), et éventuellement de petites **fonctions génériques** pour le code réellement répétitif (scanner des lignes, paginer). Les generics doivent supprimer de la duplication, pas créer un framework.
  - key: regle
    format: course
    question: Quelle règle simple aide à choisir entre generics et interfaces ?
    answer: Si le code appelle des méthodes, une interface suffit souvent ; si le code manipule les valeurs elles-mêmes (stocker, comparer, trier) ou une collection homogène typée, des generics.
  - key: heterogene
    format: course
    question: Peut-on mettre des carrés et des cercles dans un `Pile[T]` générique ?
    answer: 'Seulement avec `T` égal à une interface commune (`Pile[Forme]`) : une instanciation n''a qu''un type ; pour une collection hétérogène, c''est l''interface qui fait le travail.'
  - key: vf-interface-suffit
    format: true-false
    question: Si une interface suffit, l'équipe Go recommande de la préférer aux generics.
    truth: true
    answer: Les interfaces restent l'outil principal d'abstraction.
  - key: vf-heterogene
    format: true-false
    question: Une fonction générique `[T Forme]` peut recevoir un slice qui mélange des carrés et des cercles.
    truth: false
    answer: '`T` ne vaut qu''un type par appel ; un `[]Forme` d''interface peut mélanger.'
  - key: vf-combinaison
    format: true-false
    question: Une fonction générique peut être contrainte par une interface avec méthodes et appeler ces méthodes.
    truth: true
    answer: '`func Tous[T Validable](xs []T)` appelle `x.Valider()`.'
  - key: vf-repository
    format: true-false
    question: Rendre générique toute la couche repository d'une application est presque toujours une bonne idée.
    truth: false
    answer: Les besoins propres à chaque entité imposent vite des exceptions ; on garde des repositories concrets.
  - key: qcm-choisir
    format: multiple-choice
    question: Quel outil pour quel besoin ?
    choices:
      - text: 'Un `Notifieur` qu''on implémente par courriel ou par SMS : une interface'
        correct: true
      - text: 'Une fonction `Inverser` sur des slices de tout type : des generics'
        correct: true
      - text: 'Un service métier utilisé pour un seul type de commande : des generics'
        correct: false
      - text: 'Un slice qui mélange des formes : des generics'
        correct: false
    answer: Le service est concret, et le mélange demande une interface.
  - key: qcm-generics-avantage
    format: multiple-choice
    question: Qu'apportent les generics que les interfaces n'offrent pas ?
    choices:
      - text: Des opérations sur les valeurs elles-mêmes (`<`, `+`, `==`)
        correct: true
      - text: Des collections typées sans assertion à la lecture
        correct: true
      - text: Un polymorphisme à l'exécution sur des types mélangés
        correct: false
      - text: Des méthodes virtuelles
        correct: false
    answer: Le mélange à l'exécution est le domaine des interfaces.
  - key: qcm-combiner
    format: multiple-choice
    question: Pourquoi écrire `func Tous[T Validable](xs []T) error` plutôt que `func Tous(xs []Validable) error` ?
    choices:
      - text: Pour accepter un `[]Commande` sans le convertir en `[]Validable`
        correct: true
      - text: Pour garder le type concret des éléments
        correct: true
      - text: Parce qu'une interface ne peut pas avoir de méthodes
        correct: false
      - text: Pour éviter d'appeler Valider
        correct: false
    answer: La version générique contourne l'absence de covariance.
  - key: qcm-concret
    format: multiple-choice
    question: Quand se passer à la fois des generics et des interfaces ?
    choices:
      - text: Quand un seul type est concerné et qu'aucun test ne demande de doublure
        correct: true
      - text: Jamais, il faut toujours abstraire
        correct: false
      - text: Pour tout le code métier
        correct: false
      - text: Pour les bibliothèques publiques
        correct: false
    answer: Le code concret est le plus simple à lire.
  - key: bug-generics-inutile
    format: bug-fix
    question: "En revue, simplifiez :\n```go\nfunc Envoyer[T Notifieur](n T, msg string) error {\n\treturn n.Notifier(msg)\n}\n```"
    answer: "```go\nfunc Envoyer(n Notifieur, msg string) error {\n\treturn n.Notifier(msg)\n}\n```\nLe code ne fait qu'appeler une méthode : une interface suffit, sans paramètre de type."
  - key: bug-any-collection
    format: bug-fix
    question: |-
      Rendez cette file typée, sans assertions chez les appelants :
      ```go
      type File struct{ elements []any }

      func (f *File) Retirer() any { ... }

      cmd := file.Retirer().(Commande)
      ```
    answer: |-
      ```go
      type File[T any] struct{ elements []T }

      func (f *File[T]) Retirer() (T, bool) { ... }

      cmd, ok := file.Retirer()
      ```
      Une collection homogène est le cas d'usage idéal des generics.
  - key: bug-repository
    format: bug-fix
    question: Un `Repository[T any]` générique sert toutes les entités, et chaque nouvelle requête spécifique ajoute un paramètre ou un cas particulier. Que proposes-tu ?
    answer: |-
      ```go
      type DepotCommandes struct{ db *sql.DB }

      func (d *DepotCommandes) Trouver(ctx context.Context, id string) (Commande, error) { ... }
      func (d *DepotCommandes) EnAttente(ctx context.Context, depuis time.Time) ([]Commande, error) { ... }
      ```
      Des dépôts concrets par entité, qui portent leurs requêtes métier ; les parties vraiment communes (un scan de
      lignes générique, une transaction) deviennent de petites fonctions génériques ou utilitaires.
  - key: bug-heterogene
    format: bug-fix
    question: |-
      Le compilateur refuse de mélanger des carrés et des cercles :
      ```go
      formes := Pile[Carre]{}
      formes.Empiler(Cercle{1})
      ```
    answer: |-
      ```go
      formes := Pile[Forme]{}
      formes.Empiler(Carre{2})
      formes.Empiler(Cercle{1})
      ```
      Pour une collection hétérogène, l'argument de type est l'interface commune.
  - key: scenario-repository
    format: scenario
    question: Un collègue veut rendre générique toute la couche repository. Quel est ton avis ?
    answer: |-
      Je le déconseille comme principe : chaque entité a ses requêtes, ses index, ses contraintes, et un `Repository[T]`
      générique finit avec des options et des exceptions partout, plus difficile à lire que des dépôts concrets. Je garde
      les generics pour les morceaux réellement communs et techniques : un helper qui scanne des lignes dans un `[]T`, un
      wrapper de transaction, une pagination. Le métier reste concret et explicite.
  - key: scenario-bibliotheque
    format: scenario
    question: Tu écris une bibliothèque de validation. Interface, generics, ou les deux ?
    answer: |-
      Une interface `Validable { Valider() error }` que les types implémentent : c'est un comportement, appelé par la
      bibliothèque. J'ajoute des fonctions génériques pour les collections (`TousValides[T Validable](xs []T) error`), qui
      acceptent un `[]Commande` sans conversion. Pour des règles sur des valeurs simples (`Entre[T cmp.Ordered](v, min,
      max T)`), des generics purs. Chaque outil sert là où il est le plus simple.
  - key: scenario-performance
    format: scenario
    question: Les generics sont-ils plus rapides que les interfaces ?
    answer: |-
      Parfois, mais pas systématiquement. Go compile les generics par « formes » (GC shape) avec un dictionnaire : pour
      les types pointeurs ou interfaces, un appel de méthode passe encore par une indirection. Pour des types de base
      (int, float64), une fonction générique évite l'allocation et l'appel indirect d'une interface, et peut être plus
      rapide. Je choisis d'abord pour la clarté, et je mesure si la performance compte.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande quand tu utilises les generics en Go. Que réponds-tu ?
    answer: |-
      Pour les structures de données et les algorithmes qui servent plusieurs types : collections typées, fonctions sur
      des slices et des maps (même si `slices` et `maps` couvrent l'essentiel), utilitaires comme un `Max` ou un cache
      typé. Quand le code appelle des méthodes, je reste sur les interfaces ; quand un seul type est concerné, je reste
      concret. Je commence toujours par le code concret et je généralise au deuxième usage.
  - key: polymorphismes
    format: course
    question: Quelle différence entre le polymorphisme des interfaces et celui des generics ?
    answer: Les interfaces le résolvent à l'exécution (une valeur peut être de types variés) ; les generics à la compilation (chaque instanciation a un seul type, et l'on peut opérer sur les valeurs elles-mêmes).
