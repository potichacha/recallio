notion: generics-ou-interfaces
lesson: |-
  Generics et interfaces répondent à des besoins différents :

  | Besoin | Outil |
  |---|---|
  | Le code **appelle des méthodes** sur des valeurs de types variés | une **interface** |
  | Le code **manipule des valeurs** sans appeler de méthodes : stocker, comparer, trier | des **generics** |
  | Une collection **homogène** typée (une pile de `Commande`) | des **generics** |
  | Une collection **hétérogène** (des formes de types différents) | un slice d'**interface** |
  | Un seul type concerné | ni l'un ni l'autre : du code concret |

  Les interfaces offrent un **polymorphisme à l'exécution** : un `[]Forme` contient des carrés et des cercles. Les
  generics offrent un **polymorphisme à la compilation** : chaque instanciation est d'un seul type, et les opérations
  (`<`, `+`, `==`) peuvent porter sur les valeurs elles-mêmes.

  La règle de l'équipe Go : **si une interface suffit, on prend l'interface** ; les generics servent quand on manipule
  des types de base, des collections, ou quand une interface obligerait à des assertions.

  Une fonction générique contrainte par une interface (`func Tous[T Validable](xs []T) error`) combine les deux : elle
  accepte un `[]Commande` tel quel (pas de covariance à contourner) tout en appelant `Valider()`.

  **Piège classique** : rendre générique une couche entière (un `Repository[T]` pour toutes les entités) ; les besoins
  réels de chaque entité (requêtes, contraintes) finissent par imposer des exceptions partout.

  **En entretien** : « Interface si l'on appelle des méthodes et pour les collections hétérogènes ; generics pour
  manipuler des valeurs et les collections homogènes ; code concret pour un seul type. »
cards:
  - key: quand-preferer-interface-generics
    format: course
    question: Quand préférer une interface aux generics ?
    choices:
      - {text: "Quand le code ne fait qu'appeler des méthodes, aux comportements variés", correct: true}
      - {text: "Quand le code compare ou additionne des valeurs, avec `<` ou `+`", correct: false}
      - {text: "Quand une collection doit rester homogène et typée, sans assertion", correct: false}
      - {text: "Quand la performance compte, une interface étant toujours plus rapide", correct: false}
    answer: "Quand on veut un comportement différent derrière un même contrat, ou qu'on n'appelle que des méthodes. Pour opérer sur les valeurs elles-mêmes ou garder une collection typée, ce sont les generics."
  - key: collegue-veut-rendre-generique-toute-couche
    format: scenario
    question: "Un collègue propose un `Repository[T any]` unique, avec `Find`, `Save` et `Delete`, pour toutes les entités. Que lui réponds-tu ?"
    choices:
      - {text: "Des dépôts concrets par agrégat, et de petites fonctions génériques pour le vraiment répétitif", correct: true}
      - {text: "Bonne idée : un seul dépôt générique supprime toute la duplication de la couche", correct: false}
      - {text: "Plutôt un dépôt unique sur `any`, avec une assertion de type à chaque lecture", correct: false}
      - {text: "Plutôt la réflexion, qui découvre les champs de chaque entité à l'exécution", correct: false}
    answer: "Les requêtes réelles divergent vite d'une entité à l'autre (filtres, jointures, pagination), et un dépôt générique finit très limité ou plein d'options. Je préfère des dépôts concrets aux méthodes métier (`CommandesEnAttente`), et de petites fonctions génériques pour scanner des lignes ou paginer."
  - key: regle
    format: course
    question: Quelle règle simple aide à choisir entre generics et interfaces ?
    choices:
      - {text: "Méthodes appelées : une interface ; valeurs manipulées ou collection typée : des generics", correct: true}
      - {text: "Code de bibliothèque : des generics ; code d'application : toujours des interfaces", correct: false}
      - {text: "Peu de types concernés : une interface ; beaucoup : des generics, plus rapides", correct: false}
      - {text: "Toujours des generics depuis Go 1.18, les interfaces étant devenues obsolètes", correct: false}
    answer: "Si le code appelle des méthodes, une interface suffit souvent ; s'il manipule les valeurs elles-mêmes (stocker, comparer, trier) ou une collection homogène typée, des generics."
  - key: heterogene
    format: course
    question: "Peut-on mettre des carrés et des cercles dans une même `Pile[T]` générique ?"
    choices:
      - {text: "Oui, avec `Pile[Forme]`, `Forme` étant leur interface commune", correct: true}
      - {text: "Oui, avec `Pile[Carre | Cercle]`, une union des deux types", correct: false}
      - {text: "Oui, avec `Pile[Carre]`, puisque les deux ont une méthode `Aire`", correct: false}
      - {text: "Non : une pile générique n'accepte pas de valeurs d'interface", correct: false}
    answer: "Seulement avec `T` égal à une interface commune (`Pile[Forme]`) : une instanciation n'a qu'un type. Une union ne sert que de contrainte, pas d'argument de type ; pour une collection hétérogène, c'est l'interface qui fait le travail."
  - key: vf-interface-suffit
    format: true-false
    question: Si une interface suffit, l'équipe Go recommande de la préférer aux generics.
    truth: true
    answer: Les interfaces restent l'outil principal d'abstraction.
  - key: vf-heterogene
    format: true-false
    question: Une fonction générique `[T Forme]` peut recevoir un slice qui mélange des carrés et des cercles.
    truth: false
    answer: '`T` ne vaut qu''un type par appel ; un `[]Forme` d''interface peut mélanger.'
  - key: vf-combinaison
    format: true-false
    question: Une fonction générique peut être contrainte par une interface avec méthodes et appeler ces méthodes.
    truth: true
    answer: '`func Tous[T Validable](xs []T)` appelle `x.Valider()`.'
  - key: vf-repository
    format: true-false
    question: Rendre générique toute la couche repository d'une application est presque toujours une bonne idée.
    truth: false
    answer: Les besoins propres à chaque entité imposent vite des exceptions ; on garde des repositories concrets.
  - key: qcm-choisir
    format: multiple-choice
    question: "Lequel de ces besoins appelle des generics plutôt qu'une interface ?"
    choices:
      - {text: "Une fonction `Inverser` sur des slices de tout type", correct: true}
      - {text: "Un `Notifieur` qu'on implémente par courriel ou par SMS", correct: false}
      - {text: "Un service métier utilisé pour un seul type de commande", correct: false}
      - {text: "Une slice qui mélange des carrés et des cercles", correct: false}
    answer: "`Inverser` manipule des valeurs de tout type sans appeler de méthode : des generics. Le `Notifieur` est un comportement (une interface), le service est concret, et le mélange demande une interface."
  - key: qcm-generics-avantage
    format: multiple-choice
    question: "Lesquels de ces apports sont propres aux generics, et non aux interfaces ?"
    choices:
      - text: Des opérations sur les valeurs elles-mêmes (`<`, `+`, `==`)
        correct: true
      - text: Des collections typées sans assertion à la lecture
        correct: true
      - text: Un polymorphisme à l'exécution sur des types mélangés
        correct: false
      - text: Des méthodes virtuelles
        correct: false
    answer: Le mélange à l'exécution est le domaine des interfaces.
  - key: qcm-combiner
    format: multiple-choice
    question: "Pourquoi écrire `func Tous[T Validable](xs []T) error` plutôt que `func Tous(xs []Validable) error` ?"
    choices:
      - {text: "Pour accepter un `[]Commande` sans le recopier dans un `[]Validable`", correct: true}
      - {text: "Parce qu'une interface ne peut pas servir de type de paramètre", correct: false}
      - {text: "Pour éviter d'appeler `Valider` sur chaque élément de la slice", correct: false}
      - {text: "Parce qu'un `[]Validable` ne peut contenir que des pointeurs", correct: false}
    answer: "La version générique contourne l'absence de covariance : elle accepte un `[]Commande` tel quel et garde le type concret des éléments."
  - key: qcm-concret
    format: multiple-choice
    question: Quand se passer à la fois des generics et des interfaces ?
    choices:
      - {text: "Quand un seul type est concerné et qu'aucun test ne demande de doublure", correct: true}
      - {text: "Jamais : il faut toujours abstraire, au cas où un second type arriverait", correct: false}
      - {text: "Pour tout le code métier, qui ne doit dépendre d'aucune abstraction", correct: false}
      - {text: "Pour les bibliothèques publiques, dont l'API doit rester la plus simple", correct: false}
    answer: "Le code concret est le plus simple à lire : on généralise au deuxième usage, ou quand un test demande une doublure."
  - key: bug-generics-inutile
    format: bug-fix
    question: |-
      En revue, cette fonction a un paramètre de type. Comment la simplifier ?
      ```go
      func Envoyer[T Notifieur](n T, msg string) error {
      	return n.Notifier(msg)
      }
      ```
    choices:
      - {text: "Prendre le paramètre en `Notifieur`, sans paramètre de type", correct: true}
      - {text: "Contraindre `T` par `any`, plus simple que par `Notifieur`", correct: false}
      - {text: "Rendre l'interface générique : `Notifieur[T]`, avec `T` le message", correct: false}
      - {text: "Remplacer `n T` par `n *T`, pour éviter une copie à chaque appel", correct: false}
    answer: "```go\nfunc Envoyer(n Notifieur, msg string) error {\n\treturn n.Notifier(msg)\n}\n```\nLe code ne fait qu'appeler une méthode : une interface suffit, sans paramètre de type."
  - key: bug-any-collection
    format: bug-fix
    question: |-
      Comment rendre cette file typée, sans assertion chez les appelants ?
      ```go
      type File struct{ elements []any }

      func (f *File) Retirer() any { ... }

      cmd := file.Retirer().(Commande)
      ```
    choices:
      - {text: "`type File[T any] struct{ elements []T }`, et `Retirer() (T, bool)`", correct: true}
      - {text: "Garder `[]any` et ajouter une méthode `RetirerCommande() Commande`", correct: false}
      - {text: "`type File[T Commande] struct{ elements []any }`, contrainte par le type", correct: false}
      - {text: "Remplacer `any` par `interface{}`, plus explicite pour les appelants", correct: false}
    answer: |-
      ```go
      type File[T any] struct{ elements []T }

      func (f *File[T]) Retirer() (T, bool) { ... }

      cmd, ok := file.Retirer()
      ```
      Une collection homogène est le cas d'usage idéal des generics.
  - key: bug-repository
    format: bug-fix
    question: Un `Repository[T any]` générique sert toutes les entités, et chaque nouvelle requête spécifique ajoute un paramètre ou un cas particulier. Que proposes-tu ?
    choices:
      - {text: "Des dépôts concrets par entité, qui portent leurs requêtes métier", correct: true}
      - {text: "Un paramètre de plus dans `Repository[T]` pour chaque requête", correct: false}
      - {text: "Des requêtes SQL construites par réflexion à partir de `T`", correct: false}
      - {text: "Un `Repository[any]`, où chaque entité fait ses assertions", correct: false}
    answer: |-
      ```go
      type DepotCommandes struct{ db *sql.DB }

      func (d *DepotCommandes) Trouver(ctx context.Context, id string) (Commande, error) { ... }
      func (d *DepotCommandes) EnAttente(ctx context.Context, depuis time.Time) ([]Commande, error) { ... }
      ```
      Des dépôts concrets par entité, qui portent leurs requêtes métier ; les parties vraiment communes (un scan de
      lignes générique, une transaction) deviennent de petites fonctions génériques ou utilitaires.
  - key: bug-heterogene
    format: bug-fix
    question: |-
      Le compilateur refuse de mélanger des carrés et des cercles. Quelle correction est la bonne ?
      ```go
      formes := Pile[Carre]{}
      formes.Empiler(Cercle{1})
      ```
    choices:
      - {text: "Instancier la pile avec l'interface commune : `Pile[Forme]{}`", correct: true}
      - {text: "Instancier la pile avec une union : `Pile[Carre | Cercle]{}`", correct: false}
      - {text: "Convertir le cercle : `formes.Empiler(Carre(Cercle{1}))`", correct: false}
      - {text: "Une pile par forme, fusionnées ensuite avec `append`", correct: false}
    answer: |-
      ```go
      formes := Pile[Forme]{}
      formes.Empiler(Carre{2})
      formes.Empiler(Cercle{1})
      ```
      Pour une collection hétérogène, l'argument de type est l'interface commune.
  - key: scenario-repository
    format: scenario
    question: Un collègue veut rendre générique toute la couche repository. Quel est ton avis ?
    choices:
      - {text: "Je le déconseille : le métier reste concret, les generics vont aux morceaux techniques", correct: true}
      - {text: "J'approuve : un `Repository[T]` générique est l'usage idéal des generics en Go", correct: false}
      - {text: "J'approuve, à condition d'ajouter une option au dépôt pour chaque requête spécifique", correct: false}
      - {text: "Je le déconseille : les generics sont trop lents pour servir sur un accès en base", correct: false}
    answer: "Chaque entité a ses requêtes, ses index, ses contraintes : un `Repository[T]` générique finit avec des options et des exceptions partout. Je garde les generics pour les morceaux communs et techniques (scanner des lignes dans un `[]T`, une transaction, une pagination) ; le métier reste concret."
  - key: scenario-bibliotheque
    format: scenario
    question: Tu écris une bibliothèque de validation. Interface, generics, ou les deux ?
    choices:
      - {text: "Les deux : une interface `Validable`, et des fonctions génériques pour les collections", correct: true}
      - {text: "Une interface seule : les generics n'apportent rien dès qu'on appelle des méthodes", correct: false}
      - {text: "Des generics seuls : `Valider[T any](v T)`, avec la réflexion pour lire les champs", correct: false}
      - {text: "Ni l'un ni l'autre : une fonction de validation par type, écrite à la main", correct: false}
    answer: "Une interface `Validable { Valider() error }` pour le comportement, et des fonctions génériques pour les collections (`TousValides[T Validable](xs []T) error`), qui acceptent un `[]Commande` sans conversion. Pour des règles sur des valeurs simples, des generics purs (`Entre[T cmp.Ordered]`)."
  - key: scenario-performance
    format: scenario
    question: Les generics sont-ils plus rapides que les interfaces ?
    choices:
      - {text: "Parfois : sur des types de base, oui ; sur des pointeurs, le dictionnaire coûte encore", correct: true}
      - {text: "Toujours : le compilateur copie le code pour chaque type, sans aucune indirection", correct: false}
      - {text: "Jamais : le dictionnaire de types rend chaque appel générique plus coûteux", correct: false}
      - {text: "Autant : les generics sont compilés en interfaces, avec les mêmes appels", correct: false}
    answer: "Parfois. Go compile les generics par formes mémoire avec un dictionnaire : pour les types pointeurs ou interfaces, un appel de méthode passe encore par une indirection. Pour des types de base, une fonction générique évite l'allocation et l'appel indirect d'une interface. Je choisis pour la clarté, et je mesure."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande quand tu utilises les generics en Go. Que réponds-tu ?
    choices:
      - {text: "Pour les structures et algorithmes qui servent plusieurs types ; sinon interface ou code concret", correct: true}
      - {text: "Partout où c'est possible : les generics remplacent les interfaces depuis Go 1.18", correct: false}
      - {text: "Jamais en production : ils compliquent le code et ralentissent la compilation", correct: false}
      - {text: "Pour tout code qui appelle des méthodes, à la place des interfaces classiques", correct: false}
    answer: "Pour les structures de données et les algorithmes qui servent plusieurs types : collections typées, fonctions sur des slices et des maps, un `Max` ou un cache typé. Quand le code appelle des méthodes, je reste sur les interfaces ; pour un seul type, je reste concret, et je généralise au deuxième usage."
  - key: polymorphismes
    format: course
    question: Quelle différence entre le polymorphisme des interfaces et celui des generics ?
    choices:
      - {text: "Interfaces : résolu à l'exécution ; generics : à la compilation, un type par instanciation", correct: true}
      - {text: "Interfaces : résolu à la compilation ; generics : à l'exécution, par réflexion", correct: false}
      - {text: "Aucune : les generics sont compilés en interfaces, comme l'effacement de Java", correct: false}
      - {text: "Interfaces : pour les types de base ; generics : pour les structs et les pointeurs", correct: false}
    answer: "Les interfaces le résolvent à l'exécution (une valeur peut être de types variés) ; les generics à la compilation (chaque instanciation a un seul type, et l'on peut opérer sur les valeurs elles-mêmes)."
