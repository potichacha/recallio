notion: contraintes
lesson: "Une **contrainte** est une **interface** qui dit quels types un paramètre de type accepte, et donc quelles opérations\nsont permises sur lui :\n\n```go\nany          // tous les types : on ne peut que stocker, passer, affecter\ncomparable   // les types qui acceptent == et != (clés de map)\n\ntype Nombre interface {\n\t~int | ~int32 | ~int64 | ~float64   // une union de types\n}\n\ntype Affichable interface {\n\tfmt.Stringer                        // une méthode exigée\n}\n```\n\n- Une **union** (`int | float64`) liste les types permis ; l'opération (`+`, `<`) doit exister pour **tous**.\n- **`~T`** signifie « tout type dont le type **sous-jacent** est T » : `~int` accepte `int` et aussi\n  `type Celsius int`. Sans `~`, seul `int` lui-même est accepté.\n- Une contrainte peut combiner méthodes et types.\n- Une interface qui contient une union (ou `comparable`) ne sert **que de contrainte** : on ne peut pas déclarer une\n  variable de ce type.\n- `cmp.Ordered` (Go 1.21) regroupe tous les types ordonnés (`~int`, `~float64`, `~string`...) ; le module\n  `golang.org/x/exp/constraints` en propose d'autres (`Integer`, `Float`).\n- Une contrainte s'écrit aussi en ligne : `func Somme[T ~int | ~float64](xs []T) T`.\n\n**Piège classique** : une contrainte `int | int64` sans `~` qui refuse un type défini du projet (`type ID int64`). On\najoute `~` pour accepter les types dérivés.\n\n**En entretien** : « Une contrainte est une interface ; any et comparable de base, des unions de types pour les\nopérateurs, ~T pour accepter les types dérivés ; une interface à union ne sert que de contrainte. »"
cards:
  - key: interface-avec-union-types-typer-variable
    format: course
    question: "Une interface avec une union de types, comme `interface{ ~int | ~float64 }`, peut-elle typer une variable ?"
    choices:
      - {text: "Non : elle ne sert que de contrainte d'un paramètre de type", correct: true}
      - {text: "Oui : la variable accepte alors un `int` ou un `float64`", correct: false}
      - {text: "Oui, mais il faut une assertion de type pour lire sa valeur", correct: false}
      - {text: "Seulement si l'union ne contient aucun terme en `~`", correct: false}
    answer: "Non : une interface qui contient des types (une union, un `~`) ne sert que de contrainte. `var n Nombre` ne compile pas : « interface contains type constraints »."
  - key: contrainte
    format: course
    question: "Qu'est-ce qu'une contrainte en Go ?"
    choices:
      - {text: "Une interface qui décrit les méthodes ou les types permis pour un paramètre de type", correct: true}
      - {text: "Une annotation qui vérifie la valeur d'un argument au moment de l'exécution", correct: false}
      - {text: "Un mot-clé `extends` qui limite un paramètre de type à une classe et ses filles", correct: false}
      - {text: "Un commentaire `//go:` qui restreint les types qu'une fonction peut recevoir", correct: false}
    answer: "Une interface, placée dans la liste des paramètres de type : elle décrit les méthodes et/ou l'ensemble de types autorisés (`any`, `comparable`, `cmp.Ordered`, une union). Go n'a pas de `extends` : une contrainte est toujours une interface."
  - key: any-vs-comparable
    format: course
    question: "Quelle différence entre les contraintes `any` et `comparable` ?"
    choices:
      - {text: "`any` accepte tout ; `comparable`, seulement les types permettant `==`", correct: true}
      - {text: "`any` accepte tout ; `comparable`, seulement les types ordonnés par `<`", correct: false}
      - {text: "Aucune : `comparable` est un alias d'`any`, gardé pour la lisibilité", correct: false}
      - {text: "`comparable` accepte tout ; `any` exclut les slices, maps et fonctions", correct: false}
    answer: "`any` accepte tous les types mais n'autorise aucune opération ; `comparable` n'accepte que les types utilisables avec `==` et `!=`, ce qu'exige une clé de map. Pour `<`, c'est `cmp.Ordered`."
  - key: signifie-int
    format: course
    question: "Que signifie `~int` dans une contrainte ?"
    choices:
      - {text: "Tous les types dont le type sous-jacent est `int`, comme `type ID int`", correct: true}
      - {text: "Tous les types entiers : `int`, `int8`, `int32`, `int64` et `uint`", correct: false}
      - {text: "Tous les types sauf `int` : le `~` est une négation, comme `!`", correct: false}
      - {text: "Le type `int` exactement, sans les types définis à partir de lui", correct: false}
    answer: "Le `~` désigne le type sous-jacent : `~int` accepte `int` et tout type défini sur lui, comme `type ID int`. Il n'élargit pas aux autres entiers : `int64` reste exclu."
  - key: interface-avec-union-types-typer-variable-2
    format: course
    question: "Où peut-on utiliser une interface qui contient une union de types ?"
    choices:
      - {text: "Seulement comme contrainte d'un paramètre de type", correct: true}
      - {text: "Partout où une interface ordinaire est permise", correct: false}
      - {text: "Comme type de variable, mais pas comme paramètre", correct: false}
      - {text: "Comme type de champ de struct, pas comme contrainte", correct: false}
    answer: "Uniquement comme contrainte (`[T Nombre]`). Elle décrit un ensemble de types pour le compilateur et n'a pas de valeur à l'exécution : ni variable, ni paramètre, ni champ."
  - key: terme-comparable
    format: course
    question: "Que désigne la contrainte prédéclarée `comparable` ?"
    choices:
      - {text: "Les types utilisables avec `==` et `!=`, comme les clés de map", correct: true}
      - {text: "Les types ordonnés, utilisables avec `<`, `>`, `min` et `max`", correct: false}
      - {text: "Les types qui ont une méthode `Compare(other T) int`", correct: false}
      - {text: "Les types de base seulement : nombres, chaînes et booléens", correct: false}
    answer: "La contrainte des types utilisables avec `==` et `!=` : nombres, chaînes, pointeurs, et structs ou tableaux de types comparables. C'est celle d'une clé de map. Elle ne permet pas `<`, qui demande `cmp.Ordered`."
  - key: tilde-exemple
    format: course
    question: Pourquoi écrire `~int64` plutôt que `int64` dans une contrainte ?
    choices:
      - {text: "Pour accepter aussi les types définis sur `int64`, comme `type ID int64`", correct: true}
      - {text: "Pour accepter aussi les autres entiers, comme `int32` ou `int`", correct: false}
      - {text: "Pour accepter les pointeurs vers `int64` en plus des valeurs", correct: false}
      - {text: "Pour interdire les constantes non typées, comme `42`, à l'appel", correct: false}
    answer: "Pour accepter aussi les types définis dont le type sous-jacent est `int64`, comme `type ID int64` ; sans `~`, seul `int64` lui-même convient. Les autres entiers restent exclus."
  - key: union-operations
    format: course
    question: Quelles opérations permet une union comme `~int | ~float64` ?
    choices:
      - {text: "Celles communes à tous ses types : l'arithmétique et `<`, mais pas `%`", correct: true}
      - {text: "Celles d'au moins un de ses types : `+`, `<`, et `%` grâce à `int`", correct: false}
      - {text: "Aucune : il faut une interface à méthodes pour opérer sur `T`", correct: false}
      - {text: "Seulement `==` et `!=`, comme avec la contrainte `comparable`", correct: false}
    answer: "Une opération n'est permise que si elle existe pour tous les types de l'union : ici l'arithmétique et les comparaisons d'ordre, mais pas `%`, absent pour `float64`."
  - key: vf-tilde
    format: true-false
    question: La contrainte `~int` accepte `type Celsius int`.
    truth: true
    answer: Le type sous-jacent de Celsius est int.
  - key: vf-sans-tilde
    format: true-false
    question: La contrainte `int | int64` accepte `type ID int64`.
    truth: false
    answer: Sans `~`, le type doit être exactement int ou int64.
  - key: vf-variable
    format: true-false
    question: On peut déclarer `var n Nombre` avec `type Nombre interface{ ~int | ~float64 }`.
    truth: false
    answer: Une interface à union ne sert que de contrainte.
  - key: vf-comparable
    format: true-false
    question: '`comparable` permet d''utiliser `<` sur les valeurs.'
    truth: false
    answer: Seulement `==` et `!=` ; pour `<`, `cmp.Ordered`.
  - key: qcm-contraintes
    format: multiple-choice
    question: "Laquelle de ces listes de paramètres de type compile ?"
    choices:
      - {text: "`[T interface{ ~int | ~float64 }]`", correct: true}
      - {text: "`[T int || float64]`", correct: false}
      - {text: "`[T extends Number]`", correct: false}
      - {text: "`[T interface{ int, float64 }]`", correct: false}
    answer: "Une union s'écrit avec une seule barre, dans une interface ou directement (`[T ~string]` compile aussi). Go n'a ni `||` dans les contraintes, ni mot-clé `extends`, ni liste de types séparés par des virgules."
  - key: qcm-acceptes
    format: multiple-choice
    question: "Avec `type Nombre interface{ ~int | ~float64 }` et `type Euros float64`, lequel de ces types satisfait `Nombre` ?"
    choices:
      - {text: "`Euros`", correct: true}
      - {text: "`int64`", correct: false}
      - {text: "`*float64`", correct: false}
      - {text: "`[]int`", correct: false}
    answer: "`~float64` accepte `Euros`, dont le type sous-jacent est `float64` (et `int` passe aussi). `int64` n'est pas dans l'union, même s'il est numérique, et le sous-jacent d'un pointeur n'est pas `float64`."
  - key: qcm-modulo
    format: multiple-choice
    question: Pourquoi `a % b` ne compile-t-il pas avec `[T ~int | ~float64]` ?
    choices:
      - {text: "`%` n'existe pas pour `float64`, et l'union doit le permettre pour tous ses types", correct: true}
      - {text: "`%` est interdit dans toute fonction générique, quelle que soit la contrainte", correct: false}
      - {text: "Il faut la contrainte `cmp.Ordered` pour utiliser les opérateurs arithmétiques", correct: false}
      - {text: "`%` n'existe que pour les entiers non signés, et `~int` est un type signé", correct: false}
    answer: "Une opération n'est permise que si elle existe pour tous les types de l'union ; `%` n'existe pas pour les flottants. On sépare alors les contraintes entières et flottantes."
  - key: qcm-mixte
    format: multiple-choice
    question: Que demande `type IDAffichable interface { ~int64; String() string }` ?
    choices:
      - text: Un type de type sous-jacent int64 qui a une méthode String
        correct: true
      - text: Un int64 ou un type qui a une méthode String
        correct: false
      - text: Seulement une méthode String
        correct: false
      - text: Ce n'est pas valide
        correct: false
    answer: Les éléments d'une interface de contrainte se cumulent (intersection).
  - key: trous-union
    format: fill-in
    question: |-
      Complète l'union :
      ```go
      type Nombre interface {
      	~int ___ ~int64 ___ ~float64
      }
      ```
    blanks:
      - - '|'
      - - '|'
    answer: Les types d'une union se séparent par une barre.
  - key: trous-tilde
    format: fill-in
    question: |-
      Complète pour accepter les types dérivés de string :
      ```go
      func Majuscules[S ___string](s S) S { return S(strings.ToUpper(string(s))) }
      ```
    blanks:
      - - '~'
    answer: '`~string` accepte `type Nom string`.'
  - key: trous-comparable
    format: fill-in
    question: |-
      Complète la contrainte des clés :
      ```go
      func Cles[K ___, V any](m map[K]V) []K { ... }
      ```
    blanks:
      - - comparable
    answer: Une clé de map est comparable.
  - key: trous-ligne
    format: fill-in
    question: |-
      Complète la contrainte écrite en ligne :
      ```go
      func Somme[T ~int ___ ~float64](xs []T) T { ... }
      ```
    blanks:
      - - '|'
    answer: Une union peut s'écrire directement dans la liste des paramètres.
  - key: code-tilde
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Nombre interface{ ~int | ~float64 }

      func Somme[T Nombre](xs []T) T {
      	var t T
      	for _, x := range xs {
      		t += x
      	}
      	return t
      }

      type Euros float64

      fmt.Println(Somme([]int{1, 2, 3}), Somme([]Euros{1.5, 2.5}))
      ```
    choices:
      - {text: "`6 4`", correct: true}
      - {text: "`6 4.0`", correct: false}
      - {text: "`6 0`", correct: false}
      - {text: "Ça ne compile pas : `Euros` n'est pas un `float64`", correct: false}
    answer: "`6 4` : `~float64` accepte le type défini `Euros`, et un `float64` entier s'affiche sans décimale."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ ~int | ~float64 }\n\n\nfunc Somme[T Nombre](xs []T) T {\n\tvar t T\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\n\ntype Euros float64\n\nfunc main() {\n\tfmt.Println(Somme([]int{1, 2, 3}), Somme([]Euros{1.5, 2.5}))\n}\n"
      output: 6 4
  - key: code-sans-tilde
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Nombre interface{ int | float64 }

      func Double[T Nombre](x T) T { return x * 2 }

      type Euros float64

      fmt.Println(Double(Euros(2)))
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`4.0`", correct: false}
      - {text: "Une panic à l'exécution", correct: false}
    answer: "Le code ne compile pas : sans `~`, la contrainte n'accepte que `int` et `float64` eux-mêmes, pas le type défini `Euros`. Il faudrait `~float64`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ int | float64 }\n\n\nfunc Double[T Nombre](x T) T { return x * 2 }\n\n\ntype Euros float64\n\nfunc main() {\n\tfmt.Println(Double(Euros(2)))\n}\n"
      compiles: false
  - key: code-conversion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func Majuscules[S ~string](s S) S {
      	return S(strings.ToUpper(string(s)))
      }

      type Nom string

      n := Majuscules(Nom("ada"))
      fmt.Printf("%v %T\n", n, n)
      ```
    choices:
      - {text: "`ADA main.Nom`", correct: true}
      - {text: "`ADA string`", correct: false}
      - {text: "`ada main.Nom`", correct: false}
      - {text: "`Ada main.Nom`", correct: false}
    answer: "`ADA main.Nom` : le résultat est converti en `S`, donc le type d'origine `Nom` est conservé, pas `string`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc Majuscules[S ~string](s S) S {\n\treturn S(strings.ToUpper(string(s)))\n}\n\n\ntype Nom string\n\nfunc main() {\n\tn := Majuscules(Nom(\"ada\"))\n\tfmt.Printf(\"%v %T\\n\", n, n)\n}\n"
      output: ADA main.Nom
  - key: code-variable
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Nombre interface{ ~int | ~float64 }

      var n Nombre = 3
      fmt.Println(n)
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`3.0`", correct: false}
      - {text: "`<nil>`", correct: false}
    answer: "Le code ne compile pas : une interface à union ne sert que de contrainte, elle ne peut pas typer une variable."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ ~int | ~float64 }\n\nfunc main() {\n\tvar n Nombre = 3\n\tfmt.Println(n)\n}\n"
      compiles: false
  - key: bug-tilde
    format: bug-fix
    question: |-
      Le compilateur refuse `Max(id1, id2)` avec `type ID int64`. Quelle correction est la bonne ?
      ```go
      func Max[T int | int64 | float64](a, b T) T { ... }
      ```
    choices:
      - {text: "Contraindre par `cmp.Ordered`, dont les termes utilisent `~`", correct: true}
      - {text: "Ajouter `ID` à l'union, et chaque nouveau type défini ensuite", correct: false}
      - {text: "Appeler `Max(int64(id1), int64(id2))`, sans changer la fonction", correct: false}
      - {text: "Contraindre par `comparable`, qui accepte tous les types définis", correct: false}
    answer: |-
      ```go
      func Max[T cmp.Ordered](a, b T) T { ... }
      ```
      Sans `~`, les types définis du projet sont refusés ; `cmp.Ordered` (qui utilise `~`) accepte tous les types ordonnés, dérivés compris. Convertir à chaque appel marche, mais perd le type `ID` du résultat, et `comparable` ne permet pas `>`.
  - key: bug-modulo
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: operator % not defined on x (variable of type T constrained by Nombre) ». Quelle correction est la bonne ?
      ```go
      type Nombre interface{ ~int | ~float64 }

      func EstPair[T Nombre](x T) bool { return x%2 == 0 }
      ```
    choices:
      - {text: "Contraindre `EstPair` par une union d'entiers seulement", correct: true}
      - {text: "Contraindre `EstPair` par `cmp.Ordered`, qui permet `%`", correct: false}
      - {text: "Remplacer `x%2 == 0` par `x/2*2 == x`, permis partout", correct: false}
      - {text: "Contraindre `EstPair` par `any`, qui n'interdit rien", correct: false}
    answer: |-
      ```go
      type Entier interface{ ~int | ~int64 | ~uint }

      func EstPair[T Entier](x T) bool { return x%2 == 0 }
      ```
      `%` n'existe pas pour les flottants : la contrainte doit se limiter aux entiers.
  - key: bug-variable
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use type Nombre outside a type constraint: interface contains type constraints ». Quelle correction est la bonne ?
      ```go
      func Moyenne(xs []Nombre) Nombre { ... }
      ```
    choices:
      - {text: "Un paramètre de type : `func Moyenne[T Nombre](xs []T) float64`", correct: true}
      - {text: "Un type de slice : `func Moyenne(xs []any) float64`, sans contrainte", correct: false}
      - {text: "Une conversion : `func Moyenne(xs []Nombre(float64)) float64`", correct: false}
      - {text: "Un pointeur : `func Moyenne(xs []*Nombre) *Nombre`, pour l'indirection", correct: false}
    answer: |-
      ```go
      func Moyenne[T Nombre](xs []T) float64 { ... }
      ```
      Une interface à union ne s'utilise que comme contrainte d'un paramètre de type.
  - key: bug-any-plus
    format: bug-fix
    question: |-
      Le compilateur signale « operator + not defined on total (variable of type T constrained by any) ». Quelle correction est la bonne ?
      ```go
      func Somme[T any](xs []T) T {
      	var total T
      	for _, x := range xs {
      		total += x
      	}
      	return total
      }
      ```
    choices:
      - {text: "Contraindre `T` par une union de types numériques", correct: true}
      - {text: "Contraindre `T` par `comparable`, qui permet `+`", correct: false}
      - {text: "Écrire `total = any(total) + any(x)` dans la boucle", correct: false}
      - {text: "Initialiser `total` à `0` au lieu de `var total T`", correct: false}
    answer: |-
      ```go
      func Somme[T ~int | ~int64 | ~float64](xs []T) T { ... }
      ```
      `any` ne permet aucune opération ; une union de types numériques autorise `+`.
