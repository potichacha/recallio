notion: contraintes
lesson: "Une **contrainte** est une **interface** qui dit quels types un paramètre de type accepte, et donc quelles opérations\nsont permises sur lui :\n\n```go\nany          // tous les types : on ne peut que stocker, passer, affecter\ncomparable   // les types qui acceptent == et != (clés de map)\n\ntype Nombre interface {\n\t~int | ~int32 | ~int64 | ~float64   // une union de types\n}\n\ntype Affichable interface {\n\tfmt.Stringer                        // une méthode exigée\n}\n```\n\n- Une **union** (`int | float64`) liste les types permis ; l'opération (`+`, `<`) doit exister pour **tous**.\n- **`~T`** signifie « tout type dont le type **sous-jacent** est T » : `~int` accepte `int` et aussi\n  `type Celsius int`. Sans `~`, seul `int` lui-même est accepté.\n- Une contrainte peut combiner méthodes et types.\n- Une interface qui contient une union (ou `comparable`) ne sert **que de contrainte** : on ne peut pas déclarer une\n  variable de ce type.\n- `cmp.Ordered` (Go 1.21) regroupe tous les types ordonnés (`~int`, `~float64`, `~string`...) ; le module\n  `golang.org/x/exp/constraints` en propose d'autres (`Integer`, `Float`).\n- Une contrainte s'écrit aussi en ligne : `func Somme[T ~int | ~float64](xs []T) T`.\n\n**Piège classique** : une contrainte `int | int64` sans `~` qui refuse un type défini du projet (`type ID int64`). On\najoute `~` pour accepter les types dérivés.\n\n**En entretien** : « Une contrainte est une interface ; any et comparable de base, des unions de types pour les\nopérateurs, ~T pour accepter les types dérivés ; une interface à union ne sert que de contrainte. »"
cards:
  - key: interface-avec-union-types-typer-variable
    format: course
    question: Une interface avec union de types peut-elle typer une variable ?
    answer: Non, seulement servir de contrainte de generic.
  - key: contrainte
    format: course
    question: Qu'est-ce qu'une contrainte en Go ?
    answer: Une interface qui décrit les méthodes et/ou l'ensemble de types autorisés pour un paramètre de type.
  - key: any-vs-comparable
    format: course
    question: any vs comparable ?
    answer: any accepte tout ; comparable n'accepte que les types utilisables avec == (nécessaire pour une clé de map).
  - key: signifie-int
    format: course
    question: Que signifie `~int` ?
    answer: Tous les types dont le type sous-jacent est int, y compris les types nommés comme `type ID int`.
  - key: interface-avec-union-types-typer-variable-2
    format: course
    question: Une interface avec union de types peut-elle typer une variable ?
    answer: Non, uniquement servir de contrainte.
  - key: terme-comparable
    format: course
    question: Que désigne « comparable » ?
    answer: Contrainte des types utilisables avec ==
  - key: tilde-exemple
    format: course
    question: Pourquoi écrire `~int64` plutôt que `int64` dans une contrainte ?
    answer: Pour accepter aussi les types définis dont le type sous-jacent est int64, comme `type ID int64` ; sans `~`, seul `int64` lui-même convient.
  - key: union-operations
    format: course
    question: Quelles opérations permet une union comme `~int | ~float64` ?
    answer: 'Celles qui existent pour tous les types de l''union : ici l''arithmétique et les comparaisons d''ordre, mais pas `%` (absent pour float64).'
  - key: vf-tilde
    format: true-false
    question: La contrainte `~int` accepte `type Celsius int`.
    truth: true
    answer: Le type sous-jacent de Celsius est int.
  - key: vf-sans-tilde
    format: true-false
    question: La contrainte `int | int64` accepte `type ID int64`.
    truth: false
    answer: Sans `~`, le type doit être exactement int ou int64.
  - key: vf-variable
    format: true-false
    question: On peut déclarer `var n Nombre` avec `type Nombre interface{ ~int | ~float64 }`.
    truth: false
    answer: Une interface à union ne sert que de contrainte.
  - key: vf-comparable
    format: true-false
    question: '`comparable` permet d''utiliser `<` sur les valeurs.'
    truth: false
    answer: Seulement `==` et `!=` ; pour `<`, `cmp.Ordered`.
  - key: qcm-contraintes
    format: multiple-choice
    question: Quelles contraintes sont valides ?
    choices:
      - text: '`[T interface{ ~int | ~float64 }]`'
        correct: true
      - text: '`[T ~string]`'
        correct: true
      - text: '`[T int || float64]`'
        correct: false
      - text: '`[T extends Number]`'
        correct: false
    answer: L'union s'écrit avec une seule barre, et Go n'a pas de mot-clé extends.
  - key: qcm-acceptes
    format: multiple-choice
    question: Avec `type Nombre interface{ ~int | ~float64 }` et `type Euros float64`, quels types sont acceptés ?
    choices:
      - text: '`int`'
        correct: true
      - text: '`Euros`'
        correct: true
      - text: '`int64`'
        correct: false
      - text: '`string`'
        correct: false
    answer: '`int64` n''est pas dans l''union, même s''il est numérique.'
  - key: qcm-modulo
    format: multiple-choice
    question: Pourquoi `a % b` ne compile-t-il pas avec `[T ~int | ~float64]` ?
    choices:
      - text: L'opérateur `%` n'existe pas pour les flottants
        correct: true
      - text: Une opération doit être permise pour tous les types de l'union
        correct: true
      - text: '`%` est interdit dans les fonctions génériques'
        correct: false
      - text: Il faut `cmp.Ordered`
        correct: false
    answer: On sépare alors les contraintes entières et flottantes.
  - key: qcm-mixte
    format: multiple-choice
    question: Que demande `type IDAffichable interface { ~int64; String() string }` ?
    choices:
      - text: Un type de type sous-jacent int64 qui a une méthode String
        correct: true
      - text: Un int64 ou un type qui a une méthode String
        correct: false
      - text: Seulement une méthode String
        correct: false
      - text: Ce n'est pas valide
        correct: false
    answer: Les éléments d'une interface de contrainte se cumulent (intersection).
  - key: trous-union
    format: fill-in
    question: "Complétez l'union :\n```go\ntype Nombre interface {\n\t~int ___ ~int64 ___ ~float64\n}\n```"
    blanks:
      - - '|'
      - - '|'
    answer: Les types d'une union se séparent par une barre.
  - key: trous-tilde
    format: fill-in
    question: |-
      Complétez pour accepter les types dérivés de string :
      ```go
      func Majuscules[S ___string](s S) S { return S(strings.ToUpper(string(s))) }
      ```
    blanks:
      - - '~'
    answer: '`~string` accepte `type Nom string`.'
  - key: trous-comparable
    format: fill-in
    question: |-
      Complétez la contrainte des clés :
      ```go
      func Cles[K ___, V any](m map[K]V) []K { ... }
      ```
    blanks:
      - - comparable
    answer: Une clé de map est comparable.
  - key: trous-ligne
    format: fill-in
    question: |-
      Complétez la contrainte écrite en ligne :
      ```go
      func Somme[T ~int ___ ~float64](xs []T) T { ... }
      ```
    blanks:
      - - '|'
    answer: Une union peut s'écrire directement dans la liste des paramètres.
  - key: code-tilde
    format: code-output
    question: "```go\ntype Nombre interface{ ~int | ~float64 }\n\nfunc Somme[T Nombre](xs []T) T {\n\tvar t T\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\ntype Euros float64\n\nfmt.Println(Somme([]int{1, 2, 3}), Somme([]Euros{1.5, 2.5}))\n```"
    answer: '`6 4` : `~float64` accepte le type défini `Euros`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ ~int | ~float64 }\n\n\nfunc Somme[T Nombre](xs []T) T {\n\tvar t T\n\tfor _, x := range xs {\n\t\tt += x\n\t}\n\treturn t\n}\n\n\ntype Euros float64\n\nfunc main() {\n\tfmt.Println(Somme([]int{1, 2, 3}), Somme([]Euros{1.5, 2.5}))\n}\n"
      output: 6 4
  - key: code-sans-tilde
    format: code-output
    question: |-
      ```go
      type Nombre interface{ int | float64 }

      func Double[T Nombre](x T) T { return x * 2 }

      type Euros float64

      fmt.Println(Double(Euros(2)))
      ```
    answer: 'Rien : le code ne compile pas, `Euros` n''est pas exactement `float64` ; il faudrait `~float64`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ int | float64 }\n\n\nfunc Double[T Nombre](x T) T { return x * 2 }\n\n\ntype Euros float64\n\nfunc main() {\n\tfmt.Println(Double(Euros(2)))\n}\n"
      compiles: false
  - key: code-conversion
    format: code-output
    question: "```go\nfunc Majuscules[S ~string](s S) S {\n\treturn S(strings.ToUpper(string(s)))\n}\n\ntype Nom string\n\nn := Majuscules(Nom(\"ada\"))\nfmt.Printf(\"%v %T\\n\", n, n)\n```"
    answer: '`ADA main.Nom` : le type d''origine est conservé.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc Majuscules[S ~string](s S) S {\n\treturn S(strings.ToUpper(string(s)))\n}\n\n\ntype Nom string\n\nfunc main() {\n\tn := Majuscules(Nom(\"ada\"))\n\tfmt.Printf(\"%v %T\\n\", n, n)\n}\n"
      output: ADA main.Nom
  - key: code-variable
    format: code-output
    question: |-
      ```go
      type Nombre interface{ ~int | ~float64 }

      var n Nombre = 3
      fmt.Println(n)
      ```
    answer: 'Rien : le code ne compile pas, une interface à union ne sert que de contrainte.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Nombre interface{ ~int | ~float64 }\n\nfunc main() {\n\tvar n Nombre = 3\n\tfmt.Println(n)\n}\n"
      compiles: false
  - key: bug-tilde
    format: bug-fix
    question: |-
      Le compilateur refuse `MaxID(id1, id2)` avec `type ID int64` :
      ```go
      func Max[T int | int64 | float64](a, b T) T { ... }
      ```
    answer: |-
      ```go
      func Max[T cmp.Ordered](a, b T) T { ... }
      ```
      Sans `~`, les types définis du projet sont refusés ; `cmp.Ordered` (qui utilise `~`) accepte tous les types
      ordonnés, dérivés compris.
  - key: bug-modulo
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: operator % not defined on x (variable of type T constrained by Nombre) » :
      ```go
      type Nombre interface{ ~int | ~float64 }

      func EstPair[T Nombre](x T) bool { return x%2 == 0 }
      ```
    answer: |-
      ```go
      type Entier interface{ ~int | ~int64 | ~uint }

      func EstPair[T Entier](x T) bool { return x%2 == 0 }
      ```
      `%` n'existe pas pour les flottants : la contrainte doit se limiter aux entiers.
  - key: bug-variable
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use type Nombre outside a type constraint: interface contains type constraints » :
      ```go
      func Moyenne(xs []Nombre) Nombre { ... }
      ```
    answer: |-
      ```go
      func Moyenne[T Nombre](xs []T) float64 { ... }
      ```
      Une interface à union ne s'utilise que comme contrainte d'un paramètre de type.
  - key: bug-any-plus
    format: bug-fix
    question: "Le compilateur signale « operator + not defined on total (variable of type T constrained by any) » :\n```go\nfunc Somme[T any](xs []T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n```"
    answer: |-
      ```go
      func Somme[T ~int | ~int64 | ~float64](xs []T) T { ... }
      ```
      `any` ne permet aucune opération ; une union de types numériques autorise `+`.
