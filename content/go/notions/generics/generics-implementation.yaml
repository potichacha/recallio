notion: generics-implementation
lesson: |-
  Go ne génère **ni une copie par type** (comme les templates C++), **ni du code entièrement dynamique** (comme
  l'effacement de types de Java). Il utilise une approche intermédiaire, le **GC shape stenciling** avec
  **dictionnaires** :

  - les types sont regroupés par **forme** (« GC shape ») : leur disposition mémoire vue par le ramasse-miettes. Tous
    les **types pointeurs** partagent une même forme, un `int` et un `type Euros int` aussi ;
  - le compilateur génère **une version du code par forme** ;
  - un **dictionnaire**, passé en paramètre caché, fournit à chaque appel les informations propres au type exact
    (méthodes, conversions, tailles).

  Conséquences :
  - les binaires restent **petits** et la compilation **rapide** (pas d'explosion du nombre d'instanciations) ;
  - pour des **types de base** (`int`, `float64`), le code généré est spécialisé et efficace ;
  - pour des **pointeurs ou des interfaces**, plusieurs types partagent le même code : un appel de méthode passe par le
    dictionnaire, une **indirection** comparable à une interface, parfois un peu plus lente ;
  - les détails peuvent évoluer d'une version à l'autre (c'est de l'implémentation).

  En pratique, les generics sont rarement un problème de performance ; on mesure avec un benchmark avant de réécrire du
  code générique en code concret.

  **Piège classique** : supposer qu'une fonction générique est toujours aussi rapide qu'une version écrite à la main pour
  chaque type. Pour des types pointeurs avec des appels de méthodes, ce n'est pas toujours le cas.

  **En entretien** : « Ni monomorphisation complète ni effacement : une version par forme mémoire, avec un dictionnaire
  pour les détails du type ; des binaires compacts, du code efficace pour les types de base, une indirection pour les
  pointeurs. »
cards:
  - key: compile-generics
    format: course
    question: Comment Go compile-t-il les generics ?
    choices:
      - {text: "Une version du code par forme mémoire (GC shape), avec un dictionnaire de types", correct: true}
      - {text: "Une copie complète du code pour chaque type utilisé, comme les templates de C++", correct: false}
      - {text: "Une seule version, les types étant effacés à la compilation, comme en Java", correct: false}
      - {text: "Aucune version : les appels génériques passent par la réflexion à l'exécution", correct: false}
    answer: "Par « GC shape stenciling » : une version par forme mémoire, à laquelle un dictionnaire caché apporte les informations du type exact. Ce n'est ni la copie par type de C++, ni l'effacement de Java."
  - key: generics-sont-ils-gratuits-performance
    format: course
    question: Les generics sont-ils gratuits en performance ?
    choices:
      - {text: "Pas toujours : sur des pointeurs ou des interfaces, le dictionnaire ajoute une indirection", correct: true}
      - {text: "Oui : le compilateur copie le code pour chaque type, sans aucun surcoût à l'exécution", correct: false}
      - {text: "Non : chaque appel générique passe par la réflexion, et reste toujours plus lent", correct: false}
      - {text: "Oui : le seul coût est à la compilation, qui génère une version pour chaque appel", correct: false}
    answer: "Pas toujours : avec des pointeurs ou des interfaces, les appels de méthodes passent par le dictionnaire et peuvent être plus lents qu'une version spécifique. Pour des types de base, le code est souvent équivalent au code écrit à la main."
  - key: gc-shape
    format: course
    question: Qu'est-ce qu'une « GC shape » dans l'implémentation des generics ?
    choices:
      - {text: "Un groupe de types de même disposition mémoire, comme tous les pointeurs", correct: true}
      - {text: "La forme d'un objet sur le tas, que le ramasse-miettes suit pour le libérer", correct: false}
      - {text: "Le type sous-jacent d'un type défini, désigné par `~` dans une contrainte", correct: false}
      - {text: "La version de la fonction compilée pour un type précis, comme en C++", correct: false}
    answer: "Un regroupement de types qui ont la même disposition mémoire pour le ramasse-miettes, par exemple tous les types pointeurs. Le compilateur génère une version du code par forme, pas par type."
  - key: dictionnaire
    format: course
    question: À quoi sert le dictionnaire passé aux fonctions génériques ?
    choices:
      - {text: "À fournir les informations du type exact, que la forme partagée ignore", correct: true}
      - {text: "À mémoriser les résultats des appels précédents, comme un cache", correct: false}
      - {text: "À retrouver les types effacés à la compilation, comme en Java", correct: false}
      - {text: "À traduire les noms des types dans les messages d'erreur", correct: false}
    answer: "À fournir, pour le type exact de l'appel, ce que la forme partagée ne connaît pas : méthodes, conversions, tailles, descripteurs de type. Les types ne sont jamais effacés."
  - key: comparaison
    format: course
    question: En quoi l'approche de Go diffère-t-elle de C++ et de Java ?
    choices:
      - {text: "C++ copie par type, Java efface les types ; Go génère une version par forme mémoire", correct: true}
      - {text: "C++ efface les types, Java copie par type ; Go fait comme Java, avec moins de code", correct: false}
      - {text: "Go copie le code par type comme C++, puis efface les types comme Java", correct: false}
      - {text: "Go efface les types comme Java, et vérifie les conversions à l'exécution", correct: false}
    answer: "C++ génère une copie par type (monomorphisation), Java efface les types (une seule version) ; Go génère une version par forme mémoire, complétée par un dictionnaire."
  - key: vf-copie-par-type
    format: true-false
    question: Go génère une copie complète du code pour chaque type qui instancie une fonction générique.
    truth: false
    answer: Une version par forme mémoire ; les types pointeurs partagent le même code.
  - key: vf-effacement
    format: true-false
    question: Les generics de Go fonctionnent par effacement de types, comme en Java.
    truth: false
    answer: Les types restent connus ; le code est partagé par forme avec un dictionnaire.
  - key: vf-pointeurs
    format: true-false
    question: Deux instanciations avec deux types pointeurs différents peuvent partager le même code machine.
    truth: true
    answer: Ils ont la même forme pour le ramasse-miettes.
  - key: vf-mesurer
    format: true-false
    question: Les détails de l'implémentation des generics peuvent changer d'une version de Go à l'autre.
    truth: true
    answer: Ce n'est pas couvert par la spécification ; on mesure plutôt que de supposer.
  - key: qcm-consequences
    format: multiple-choice
    question: "Quelle conséquence a l'approche par formes et dictionnaires ?"
    choices:
      - {text: "Des binaires plus petits qu'avec une copie du code par type", correct: true}
      - {text: "La perte des types à l'exécution, comme avec l'effacement de Java", correct: false}
      - {text: "L'impossibilité d'instancier une fonction avec des types de base", correct: false}
      - {text: "Une copie du code pour chaque type, qui allonge la compilation", correct: false}
    answer: "Le code est partagé par forme : moins de code compilé qu'une copie par type. En contrepartie, un appel de méthode sur un type pointeur peut passer par une indirection. Les types restent connus grâce au dictionnaire."
  - key: qcm-rapide
    format: multiple-choice
    question: Dans quel cas une fonction générique est-elle le plus susceptible d'être aussi rapide qu'une version écrite à la main ?
    choices:
      - text: Une somme sur un `[]int`
        correct: true
      - text: Des appels de méthodes sur des éléments pointeurs de types variés
        correct: false
      - text: Toujours, quel que soit le type
        correct: false
      - text: Jamais
        correct: false
    answer: Les types de base ont une forme propre et un code spécialisé.
  - key: qcm-forme
    format: multiple-choice
    question: Lesquels partagent la même forme mémoire ?
    choices:
      - text: '`*Client` et `*Commande`'
        correct: true
      - text: '`int` et `type Euros int`'
        correct: true
      - text: '`int` et `string`'
        correct: false
      - text: '`int32` et `int64`'
        correct: false
    answer: La taille et la disposition des pointeurs comptent, pas le type nommé.
  - key: scenario-perf
    format: scenario
    question: Un benchmark montre qu'une fonction générique de tri d'un `[]*Produit` est plus lente qu'une version concrète. Pourquoi, et que fais-tu ?
    choices:
      - {text: "Le dictionnaire ajoute une indirection pour les pointeurs ; si ce tri est un vrai point chaud, je le spécialise", correct: true}
      - {text: "Le code générique passe par la réflexion à chaque appel ; je bannis les generics de tout le projet", correct: false}
      - {text: "Le code générique copie chaque `*Produit` à chaque comparaison ; je trie un `[]any` à la place", correct: false}
      - {text: "Le benchmark est faussé : une fonction générique coûte toujours autant qu'une version concrète", correct: false}
    answer: "Pour un type pointeur, la fonction générique partage le code de tous les pointeurs et passe par un dictionnaire pour la comparaison : une indirection qui empêche aussi certains inlinings. Si ce tri est un point chaud mesuré, je garde une version concrète ; sinon, le code générique, plus simple à maintenir."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande comment Go compile les generics. Que réponds-tu ?
    choices:
      - {text: "Par formes mémoire et dictionnaire : un compromis entre la copie de C++ et l'effacement de Java", correct: true}
      - {text: "Par monomorphisation, comme C++ : une copie du code par type, pour des performances maximales", correct: false}
      - {text: "Par effacement, comme Java : une seule version, avec des conversions vers `any` à l'exécution", correct: false}
      - {text: "Par réflexion : le type exact est relu à chaque appel, ce qui rend les generics plus lents", correct: false}
    answer: "Par « GC shape stenciling » : une version du code par forme mémoire, avec un dictionnaire caché pour le type exact. C'est un compromis entre la monomorphisation de C++ (rapide mais lourde) et l'effacement de Java : des binaires compacts, une compilation rapide, des performances proches du code manuel pour les types de base."
  - key: scenario-binaire
    format: scenario
    question: Pourquoi l'équipe Go n'a-t-elle pas simplement copié le code pour chaque type, comme C++ ?
    choices:
      - {text: "Pour garder des compilations rapides et des binaires de taille raisonnable", correct: true}
      - {text: "Parce que le ramasse-miettes ne sait pas gérer plusieurs copies d'une fonction", correct: false}
      - {text: "Parce qu'une copie par type empêcherait d'instancier avec des types de base", correct: false}
      - {text: "Pour effacer les types à l'exécution et garder ainsi la compatibilité Go 1", correct: false}
    answer: "La vitesse de compilation et la taille des binaires sont des priorités de Go. Une copie par type multiplie le code compilé pour chaque instanciation, dans chaque package ; le partage par forme limite ce coût, au prix d'une indirection dans certains cas."
  - key: scenario-choix
    format: scenario
    question: Faut-il éviter les generics dans un chemin critique à cause de leur implémentation ?
    choices:
      - {text: "Non par principe : on écrit pour la clarté, on mesure, puis on spécialise si besoin", correct: true}
      - {text: "Oui : le dictionnaire rend tout appel générique plus lent qu'un appel d'interface", correct: false}
      - {text: "Oui : on réserve les generics aux tests et aux outils, jamais au code de production", correct: false}
      - {text: "Non : le compilateur copie toujours le code par type, il n'y a donc aucun coût", correct: false}
    answer: "Non par principe : on les écrit pour la clarté, puis on mesure. Pour des types de base, le code généré équivaut souvent au code manuel ; si un profil montre une perte réelle (des appels de méthodes sur des pointeurs dans une boucle chaude), on spécialise ce chemin précis."
  - key: qcm-objectifs
    format: multiple-choice
    question: "Lesquels de ces objectifs expliquent le choix de l'implémentation des generics en Go ?"
    choices:
      - text: Garder une compilation rapide
        correct: true
      - text: Limiter la taille des binaires
        correct: true
      - text: Supprimer les types à l'exécution
        correct: false
      - text: Permettre la spécialisation par type
        correct: false
    answer: Le partage par forme mémoire limite le code généré.
