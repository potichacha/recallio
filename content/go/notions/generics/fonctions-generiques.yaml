notion: fonctions-generiques
lesson: "Une **fonction générique** déclare des **paramètres de type** entre crochets, chacun avec sa **contrainte** :\n\n```go\nfunc Filtrer[T any](xs []T, garder func(T) bool) []T {\n\tvar res []T\n\tfor _, x := range xs {\n\t\tif garder(x) {\n\t\t\tres = append(res, x)\n\t\t}\n\t}\n\treturn res\n}\n\nfunc Grouper[T any, K comparable](xs []T, cle func(T) K) map[K][]T {\n\tres := make(map[K][]T)\n\tfor _, x := range xs {\n\t\tres[cle(x)] = append(res[cle(x)], x)\n\t}\n\treturn res\n}\n\npairs := Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }) // T déduit : int\n```\n\n- L'**inférence** déduit les arguments de type des arguments de la fonction : on écrit rarement `Filtrer[int](...)`.\n  On les précise quand rien ne permet de les déduire : `Zero[int]()`, ou une fonction qui ne prend pas de valeur de\n  type T.\n- La **valeur zéro** d'un paramètre de type s'obtient avec `var zero T` (ou `*new(T)`).\n- Le corps ne peut utiliser que les opérations permises par la **contrainte** : avec `any`, ni `==` ni `<` ; avec\n  `comparable`, `==` ; avec `cmp.Ordered`, `<` et `>`.\n- Une fonction générique ne peut pas être utilisée **sans être instanciée** : `f := Filtrer` ne compile pas, `f :=\n  Filtrer[int]` oui.\n\n**Piège classique** : comparer avec `==` dans une fonction `[T any]`. Le compilateur refuse (« incomparable types in\ntype set ») : il faut la contrainte `comparable`.\n\n**En entretien** : « Des paramètres de type entre crochets, contraints par une interface ; l'inférence les déduit des\narguments ; var zero T pour la valeur zéro ; seules les opérations de la contrainte sont permises. »"
cards:
  - key: obtenir-valeur-zero-parametre-type
    format: course
    question: "Quelle déclaration donne la valeur zéro d'un paramètre de type `T` contraint par `any` ?"
    choices:
      - {text: "`var zero T`", correct: true}
      - {text: "`zero := nil`", correct: false}
      - {text: "`zero := T{}`", correct: false}
      - {text: "`zero := T(0)`", correct: false}
    answer: "`var zero T` donne la valeur zéro de n'importe quel type : 0, `\"\"`, `nil` ou une struct vide. `nil` ne convient qu'à certains types, et `T{}` ou `T(0)` ne compilent pas avec la contrainte `any`."
  - key: arguments-type-sont-ils-toujours-explicites
    format: course
    question: "Faut-il toujours écrire les arguments de type à l'appel d'une fonction générique ?"
    choices:
      - {text: "Non : ils sont le plus souvent inférés des arguments de la fonction", correct: true}
      - {text: "Oui : `Max[int](1, 2)` est la seule forme d'appel que Go accepte", correct: false}
      - {text: "Non : ils sont inférés du type de la variable qui reçoit le résultat", correct: false}
      - {text: "Oui, sauf pour les fonctions génériques de la bibliothèque standard", correct: false}
    answer: "Non : le compilateur les déduit des arguments (`Max(1, 2)`). On les écrit quand rien ne permet l'inférence, par exemple un `T` qui n'apparaît que dans le résultat : `Zero[int]()`."
  - key: ecris-fonction-generique-regroupe-elements-cle
    format: scenario
    question: "Tu écris une fonction générique qui regroupe des éléments par une clé. Quelle signature choisis-tu ?"
    choices:
      - {text: "`func GroupBy[T any, K comparable](xs []T, cle func(T) K) map[K][]T`", correct: true}
      - {text: "`func GroupBy[T comparable, K any](xs []T, cle func(T) K) map[K][]T`", correct: false}
      - {text: "`func GroupBy[T, K any](xs []T, cle func(T) K) map[K][]T`", correct: false}
      - {text: "`func GroupBy(xs []any, cle func(any) any) map[any][]any`", correct: false}
    answer: |-
      ```go
      func GroupBy[T any, K comparable](xs []T, cle func(T) K) map[K][]T {
          out := make(map[K][]T)
          for _, x := range xs {
              k := cle(x)
              out[k] = append(out[k], x)
          }
          return out
      }

      parDept := GroupBy(employes, func(e Employe) string { return e.Departement })
      ```
      La clé sert de clé de map : elle doit être `comparable` ; les éléments, eux, peuvent être de tout type. L'`append` sur une entrée absente fonctionne, car la valeur zéro d'une slice est `nil`. Avec `[]any`, on perdrait le typage.
  - key: zero
    format: course
    question: "Comment renvoyer la valeur zéro d'un paramètre de type `T` en une seule expression ?"
    choices:
      - {text: "`return *new(T)`", correct: true}
      - {text: "`return nil`", correct: false}
      - {text: "`return default(T)`", correct: false}
      - {text: "`return T{}`", correct: false}
    answer: "`*new(T)` alloue un `T` à zéro et le déréférence ; on écrit plus souvent `var zero T` puis `return zero`. `nil` n'est pas une valeur de tout type, et `default(T)` est du C#."
  - key: inference
    format: course
    question: Quand faut-il écrire explicitement les arguments de type ?
    choices:
      - {text: "Quand un paramètre de type n'apparaît que dans le résultat, ou nulle part", correct: true}
      - {text: "À chaque appel d'une fonction générique définie dans un autre package", correct: false}
      - {text: "Quand les arguments sont des constantes non typées, comme `Max(1, 2)`", correct: false}
      - {text: "Quand la fonction a plus d'un paramètre de type, comme `Map[T, U]`", correct: false}
    answer: "Quand le compilateur ne peut pas les déduire des arguments : une fonction sans paramètre de type `T`, ou un type qui n'apparaît que dans le résultat (`Zero[int]()`). Les constantes non typées s'infèrent : `Max(1, 2)` donne `int`."
  - key: operations
    format: course
    question: Pourquoi `a == b` ne compile-t-il pas dans une fonction `[T any]` ?
    choices:
      - {text: "`any` admet des types non comparables, comme les slices et les maps", correct: true}
      - {text: "`==` est interdit dans les fonctions génériques, il faut une méthode `Equals`", correct: false}
      - {text: "`any` est une interface, et deux valeurs d'interface ne se comparent jamais", correct: false}
      - {text: "`==` n'existe que pour les types de base, pas pour un paramètre de type", correct: false}
    answer: "Parce que `any` autorise des types non comparables (slices, maps, fonctions) ; la contrainte `comparable` garantit que `==` existe pour tous les types acceptés."
  - key: instanciation
    format: course
    question: Peut-on affecter une fonction générique à une variable sans l'instancier ?
    choices:
      - {text: "Non : `f := Filtrer` est refusé, `f := Filtrer[int]` donne une fonction concrète", correct: true}
      - {text: "Oui : `f := Filtrer` garde une fonction générique, instanciée à chaque appel", correct: false}
      - {text: "Oui, à condition de déclarer la variable avec un type `func[T any]`", correct: false}
      - {text: "Non : une fonction générique ne peut jamais devenir une valeur de fonction", correct: false}
    answer: "Non : `f := Filtrer` ne compile pas (« cannot use generic function without instantiation ») ; `f := Filtrer[int]` crée une fonction concrète. Depuis Go 1.21, l'instanciation peut aussi s'inférer du type déclaré de la variable."
  - key: vf-inference
    format: true-false
    question: Avec `func Max[T cmp.Ordered](a, b T) T`, on peut appeler `Max(3, 7)` sans préciser `T`.
    truth: true
    answer: L'inférence déduit `T = int` des arguments.
  - key: vf-plusieurs
    format: true-false
    question: Une fonction peut avoir plusieurs paramètres de type, comme `[T any, K comparable]`.
    truth: true
    answer: Chacun avec sa propre contrainte.
  - key: vf-any-egal
    format: true-false
    question: Dans `func Index[T any](xs []T, v T) int`, on peut écrire `if x == v`.
    truth: false
    answer: Il faut `T comparable`.
  - key: vf-melange
    format: true-false
    question: '`Max(3, 2.5)` compile avec `func Max[T cmp.Ordered](a, b T) T`.'
    truth: true
    answer: Les deux constantes non typées se rejoignent en `float64`, et T vaut float64.
  - key: qcm-signatures
    format: multiple-choice
    question: "Laquelle de ces signatures génériques compile ?"
    choices:
      - {text: "`func Map[T, U any](xs []T, f func(T) U) []U`", correct: true}
      - {text: "`func Map<T, U>(xs []T, f func(T) U) []U`", correct: false}
      - {text: "`func Map[T, U](xs []T, f func(T) U) []U`", correct: false}
      - {text: "`func Map(T, U any)(xs []T, f func(T) U) []U`", correct: false}
    answer: "Les paramètres de type s'écrivent entre crochets, et chacun a une contrainte, au moins `any` ; `func Cles[K comparable, V any](m map[K]V) []K` compile aussi. Les chevrons `<T>` sont ceux de Java."
  - key: qcm-explicite
    format: multiple-choice
    question: "Dans lesquels de ces appels faut-il préciser l'argument de type ?"
    choices:
      - text: '`func Zero[T any]() T` appelée par `Zero[int]()`'
        correct: true
      - text: '`func Nouveau[T any]() *Pile[T]` appelée par `Nouveau[string]()`'
        correct: true
      - text: '`Max(1, 2)` avec `func Max[T cmp.Ordered](a, b T) T`'
        correct: false
      - text: '`slices.Contains(noms, "ada")`'
        correct: false
    answer: Sans argument de type T, rien ne permet l'inférence.
  - key: qcm-contrainte
    format: multiple-choice
    question: Quelle contrainte faut-il pour écrire `if a < b` sur des valeurs de type T ?
    choices:
      - text: '`cmp.Ordered`'
        correct: true
      - text: '`comparable`'
        correct: false
      - text: '`any`'
        correct: false
      - text: '`fmt.Stringer`'
        correct: false
    answer: '`comparable` n''autorise que `==` et `!=`.'
  - key: qcm-instancier
    format: multiple-choice
    question: "Avec `func Filtrer[T any](xs []T, f func(T) bool) []T`, laquelle de ces lignes ne compile pas ?"
    choices:
      - {text: "`f := Filtrer`", correct: true}
      - {text: "`f := Filtrer[int]`", correct: false}
      - {text: "`Filtrer([]string{\"a\"}, func(s string) bool { return s != \"\" })`", correct: false}
      - {text: "`Filtrer[string](nil, func(s string) bool { return true })`", correct: false}
    answer: "Une fonction générique doit être instanciée pour devenir une valeur : `f := Filtrer` ne compile pas, `f := Filtrer[int]` si. À l'appel, l'argument de type s'infère ou s'écrit, mais en bon nombre : `Filtrer[int, string]` serait refusé."
  - key: trous-crochets
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      func Premier___T any___(xs []T) T { return xs[0] }
      ```
    blanks:
      - - '['
      - - ']'
    answer: Les paramètres de type s'écrivent entre crochets.
  - key: trous-zero
    format: fill-in
    question: |-
      Complète le renvoi de la valeur zéro :
      ```go
      func PremierOuZero[T any](xs []T) T {
      	if len(xs) == 0 {
      		var zero ___
      		return zero
      	}
      	return xs[0]
      }
      ```
    blanks:
      - - T
    answer: '`var zero T` donne la valeur zéro de n''importe quel type.'
  - key: trous-comparable
    format: fill-in
    question: |-
      Complète la contrainte qui permet `==` :
      ```go
      func Index[T ___](xs []T, v T) int { ... }
      ```
    blanks:
      - - comparable
    answer: '`comparable` autorise `==` et `!=`.'
  - key: trous-explicite
    format: fill-in
    question: |-
      Complète l'appel d'une fonction sans argument de type T :
      ```go
      p := NouvellePile___string___()
      ```
    blanks:
      - - '['
      - - ']'
    answer: L'argument de type se précise entre crochets.
  - key: code-filtrer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func Filtrer[T any](xs []T, garder func(T) bool) []T {
      	var res []T
      	for _, x := range xs {
      		if garder(x) {
      			res = append(res, x)
      		}
      	}
      	return res
      }

      fmt.Println(Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }))
      fmt.Println(Filtrer([]string{"go", "", "java"}, func(s string) bool { return s != "" }))
      ```
    choices:
      - text: |-
          ```
          [2 4]
          [go java]
          ```
        correct: true
      - text: |-
          ```
          [1 3]
          [go java]
          ```
        correct: false
      - text: |-
          ```
          [2 4]
          []
          ```
        correct: false
      - {text: "Ça ne compile pas : `Filtrer` ne peut servir qu'à un seul type", correct: false}
    answer: "`[2 4]` puis `[go java]` : la même fonction, instanciée pour `int` puis pour `string`, garde les éléments pour lesquels `garder` renvoie `true`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Filtrer[T any](xs []T, garder func(T) bool) []T {\n\tvar res []T\n\tfor _, x := range xs {\n\t\tif garder(x) {\n\t\t\tres = append(res, x)\n\t\t}\n\t}\n\treturn res\n}\n\nfunc main() {\n\tfmt.Println(Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }))\n\tfmt.Println(Filtrer([]string{\"go\", \"\", \"java\"}, func(s string) bool { return s != \"\" }))\n}\n"
      output: |-
        [2 4]
        [go java]
  - key: code-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func Max[T cmp.Ordered](a, b T) T {
      	if a > b {
      		return a
      	}
      	return b
      }

      fmt.Println(Max(3, 7), Max("go", "java"), Max(3, 2.5))
      ```
    choices:
      - {text: "`7 java 3`", correct: true}
      - {text: "`7 java 2.5`", correct: false}
      - {text: "`7 go 3`", correct: false}
      - {text: "Ça ne compile pas : `3` et `2.5` n'ont pas le même type", correct: false}
    answer: "`7 java 3` : `T` vaut `int`, `string`, puis `float64`. Les constantes non typées `3` et `2.5` s'unifient en `float64`, et `3.0` s'affiche `3`."
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc Max[T cmp.Ordered](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nfunc main() {\n\tfmt.Println(Max(3, 7), Max(\"go\", \"java\"), Max(3, 2.5))\n}\n"
      output: 7 java 3
  - key: code-zero
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func PremierOuZero[T any](xs []T) T {
      	var zero T
      	if len(xs) == 0 {
      		return zero
      	}
      	return xs[0]
      }

      fmt.Printf("%q %v %v\n", PremierOuZero([]string{}), PremierOuZero([]int{}), PremierOuZero([]*int{}))
      ```
    choices:
      - {text: "`\"\" 0 <nil>`", correct: true}
      - {text: "`\"\" 0 0`", correct: false}
      - {text: "`<nil> 0 <nil>`", correct: false}
      - {text: "`\"\" <nil> <nil>`", correct: false}
    answer: "`\"\" 0 <nil>` : `var zero T` donne la valeur zéro de chaque type d'élément, la chaîne vide (affichée `\"\"` par `%q`), 0, puis le pointeur `nil`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc PremierOuZero[T any](xs []T) T {\n\tvar zero T\n\tif len(xs) == 0 {\n\t\treturn zero\n\t}\n\treturn xs[0]\n}\n\nfunc main() {\n\tfmt.Printf(\"%q %v %v\\n\", PremierOuZero([]string{}), PremierOuZero([]int{}), PremierOuZero([]*int{}))\n}\n"
      output: '"" 0 <nil>'
  - key: code-any-egal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func Index[T any](xs []T, v T) int {
      	for i, x := range xs {
      		if x == v {
      			return i
      		}
      	}
      	return -1
      }

      fmt.Println(Index([]int{1, 2}, 2))
      ```
    choices:
      - {text: "Ça ne compile pas : `==` n'est pas permis avec `any`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`-1`", correct: false}
      - {text: "Une panic : comparaison de valeurs non comparables", correct: false}
    answer: "Le code ne compile pas : `any` admet des types non comparables, donc `==` n'est pas permis ; il faut la contrainte `comparable`. L'erreur se voit à la compilation, pas à l'exécution."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Index[T any](xs []T, v T) int {\n\tfor i, x := range xs {\n\t\tif x == v {\n\t\t\treturn i\n\t\t}\n\t}\n\treturn -1\n}\n\nfunc main() {\n\tfmt.Println(Index([]int{1, 2}, 2))\n}\n"
      compiles: false
  - key: bug-any-egal
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: x == v (incomparable types in type set) ». Quelle correction est la bonne ?
      ```go
      func Contient[T any](xs []T, v T) bool {
      	for _, x := range xs {
      		if x == v {
      			return true
      		}
      	}
      	return false
      }
      ```
    choices:
      - {text: "Contraindre `T` par `comparable`, ou appeler `slices.Contains`", correct: true}
      - {text: "Comparer `any(x) == any(v)`, pour passer par des interfaces", correct: false}
      - {text: "Remplacer `x == v` par `x.Equals(v)`, comme en Java", correct: false}
      - {text: "Écrire `[T any, comparable]` pour cumuler les deux contraintes", correct: false}
    answer: |-
      ```go
      func Contient[T comparable](xs []T, v T) bool { ... }
      // ou simplement : slices.Contains(xs, v)
      ```
      `==` exige la contrainte `comparable` ; et la bibliothèque standard fournit déjà `slices.Contains`.
  - key: bug-zero-nil
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use nil as T value in return statement ». Quelle correction est la bonne ?
      ```go
      func Premier[T any](xs []T) T {
      	if len(xs) == 0 {
      		return nil
      	}
      	return xs[0]
      }
      ```
    choices:
      - {text: "Renvoyer `(T, bool)` : `var zero T` et `false` si la slice est vide", correct: true}
      - {text: "Contraindre `T` par `comparable`, pour que `nil` soit une valeur de `T`", correct: false}
      - {text: "Renvoyer `any(nil).(T)`, qui convertit `nil` vers le type `T`", correct: false}
      - {text: "Remplacer `return nil` par `return T(nil)`, une conversion explicite", correct: false}
    answer: "```go\nfunc Premier[T any](xs []T) (T, bool) {\n\tif len(xs) == 0 {\n\t\tvar zero T\n\t\treturn zero, false\n\t}\n\treturn xs[0], true\n}\n```\n`nil` n'est pas une valeur de tout type ; on renvoie la valeur zéro, avec un booléen pour signaler l'absence."
  - key: bug-instanciation
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use generic function Filtrer without instantiation ». Quelle correction est la bonne ?
      ```go
      f := Filtrer
      pairs := f([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 })
      ```
    choices:
      - {text: "Instancier la fonction à l'affectation : `f := Filtrer[int]`", correct: true}
      - {text: "Déclarer `f` en `func[T any]([]T, func(T) bool) []T`", correct: false}
      - {text: "Passer par une interface : `f := any(Filtrer)`", correct: false}
      - {text: "Instancier à l'appel : `pairs := f[int]([]int{1, 2, 3, 4}, ...)`", correct: false}
    answer: |-
      ```go
      f := Filtrer[int]
      ```
      Sans type cible, rien ne dit quel `T` choisir : il faut instancier la fonction pour en faire une valeur. Un type de fonction générique n'existe pas, et `f` n'est pas générique. Dès que le type cible est connu, Go infère `T` : `var f func([]int, func(int) bool) []int = Filtrer`, ou une valeur de map typée, compilent sans instanciation (Go 1.27 l'étend à toute affectation).
  - key: bug-duplication
    format: bug-fix
    question: |-
      En revue, ces trois fonctions font la même somme sur des types différents. Comment les simplifier ?
      ```go
      func SommeInt(xs []int) int { ... }
      func SommeFloat(xs []float64) float64 { ... }
      func SommeInt64(xs []int64) int64 { ... }
      ```
    choices:
      - {text: "Une seule `Somme[T Nombre]`, `Nombre` étant l'union `~int | ~int64 | ~float64`", correct: true}
      - {text: "Une seule `Somme[T any]`, puisque `any` accepte tous les types numériques", correct: false}
      - {text: "Une seule `Somme(xs []any) any`, avec un switch de type sur chaque élément", correct: false}
      - {text: "Une seule `Somme[T comparable]`, puisque tous les nombres sont comparables", correct: false}
    answer: |-
      ```go
      type Nombre interface {
      	~int | ~int64 | ~float64
      }

      func Somme[T Nombre](xs []T) T {
      	var total T
      	for _, x := range xs {
      		total += x
      	}
      	return total
      }
      ```
      Une seule fonction, contrainte par une union de types numériques qui autorise `+`. Avec `any` ou `comparable`, `total += x` ne compilerait pas.
  - key: scenario-grouper
    format: scenario
    question: "Pour une fonction `Grouper` qui range des éléments dans une map selon une clé, quelles contraintes donnes-tu aux éléments `T` et à la clé `K` ?"
    choices:
      - {text: "`T any` et `K comparable` : seule la clé sert d'index de map", correct: true}
      - {text: "`T comparable` et `K any` : ce sont les éléments qu'on compare", correct: false}
      - {text: "`T any` et `K cmp.Ordered` : la map garde ainsi ses clés triées", correct: false}
      - {text: "`T comparable` et `K comparable` : tout ce qui entre dans une map", correct: false}
    answer: "La clé sert d'index de map, donc `K comparable` ; les éléments ne sont que rangés, donc `T any`. Une contrainte plus forte exclurait des types sans raison, et une map Go ne trie jamais ses clés."
  - key: scenario-map
    format: scenario
    question: Pourquoi la bibliothèque standard n'a-t-elle pas de fonction `slices.Map` générique ?
    choices:
      - {text: "Une boucle `for` est jugée plus lisible en Go qu'une chaîne de transformations", correct: true}
      - {text: "Les generics de Go ne permettent pas deux paramètres de type, comme `T` et `U`", correct: false}
      - {text: "Un `Map` allouerait une nouvelle slice, et Go interdit les allocations cachées", correct: false}
      - {text: "Elle existe déjà sous le nom `slices.Transform`, ajoutée en même temps que `slices`", correct: false}
    answer: "Les concepteurs ont jugé qu'une boucle `for` explicite reste plus lisible en Go, et qu'un `Map` encouragerait des chaînes de transformations peu idiomatiques. Rien n'empêche d'écrire son propre `Map[T, U any]` : deux paramètres de type sont permis."
  - key: scenario-contrainte
    format: scenario
    question: Comment choisis-tu la contrainte d'un paramètre de type ?
    choices:
      - {text: "La plus faible qui permet le corps : `any`, sinon `comparable`, `cmp.Ordered`...", correct: true}
      - {text: "La plus forte possible, pour que le compilateur vérifie un maximum de choses", correct: false}
      - {text: "Toujours `any`, avec des assertions de type dans le corps quand il le faut", correct: false}
      - {text: "Toujours `comparable`, pour pouvoir ranger les valeurs dans une map plus tard", correct: false}
    answer: "La plus faible qui permet le corps : `any` pour stocker ou passer les valeurs, `comparable` pour `==` ou une clé de map, `cmp.Ordered` pour `<`, une union numérique pour l'arithmétique, une interface à méthodes pour appeler des méthodes. Une contrainte plus forte exclut des types sans raison."
  - key: scenario-test
    format: scenario
    question: Comment testes-tu une fonction générique ?
    choices:
      - {text: "Avec au moins deux types qui exercent la contrainte, dont un type défini si elle a `~`", correct: true}
      - {text: "Avec un seul type, `int`, puisque toutes les instanciations partagent le même code", correct: false}
      - {text: "Avec `any` comme argument de type, qui couvre tous les types en une seule fois", correct: false}
      - {text: "Par réflexion, en générant un test pour chaque type qui satisfait la contrainte", correct: false}
    answer: "Avec au moins deux types qui exercent la contrainte différemment : `int`, une chaîne, et un type défini (`type ID int`) si la contrainte utilise `~`. Quelques tests concrets par type valent mieux qu'un test trop abstrait."
