notion: fonctions-generiques
lesson: "Une **fonction générique** déclare des **paramètres de type** entre crochets, chacun avec sa **contrainte** :\n\n```go\nfunc Filtrer[T any](xs []T, garder func(T) bool) []T {\n\tvar res []T\n\tfor _, x := range xs {\n\t\tif garder(x) {\n\t\t\tres = append(res, x)\n\t\t}\n\t}\n\treturn res\n}\n\nfunc Grouper[T any, K comparable](xs []T, cle func(T) K) map[K][]T {\n\tres := make(map[K][]T)\n\tfor _, x := range xs {\n\t\tres[cle(x)] = append(res[cle(x)], x)\n\t}\n\treturn res\n}\n\npairs := Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }) // T déduit : int\n```\n\n- L'**inférence** déduit les arguments de type des arguments de la fonction : on écrit rarement `Filtrer[int](...)`.\n  On les précise quand rien ne permet de les déduire : `Zero[int]()`, ou une fonction qui ne prend pas de valeur de\n  type T.\n- La **valeur zéro** d'un paramètre de type s'obtient avec `var zero T` (ou `*new(T)`).\n- Le corps ne peut utiliser que les opérations permises par la **contrainte** : avec `any`, ni `==` ni `<` ; avec\n  `comparable`, `==` ; avec `cmp.Ordered`, `<` et `>`.\n- Une fonction générique ne peut pas être utilisée **sans être instanciée** : `f := Filtrer` ne compile pas, `f :=\n  Filtrer[int]` oui.\n\n**Piège classique** : comparer avec `==` dans une fonction `[T any]`. Le compilateur refuse (« incomparable types in\ntype set ») : il faut la contrainte `comparable`.\n\n**En entretien** : « Des paramètres de type entre crochets, contraints par une interface ; l'inférence les déduit des\narguments ; var zero T pour la valeur zéro ; seules les opérations de la contrainte sont permises. »"
cards:
  - key: obtenir-valeur-zero-parametre-type
    format: course
    question: Comment obtenir la valeur zéro d'un paramètre de type ?
    answer: '`var zero T`.'
  - key: arguments-type-sont-ils-toujours-explicites
    format: course
    question: Les arguments de type sont-ils toujours explicites ?
    answer: Non, ils sont généralement inférés depuis les arguments de la fonction.
  - key: ecris-fonction-generique-regroupe-elements-cle
    format: scenario
    question: Écris une fonction générique qui regroupe des éléments par une clé.
    answer: |-
      ```go
      func GroupBy[T any, K comparable](xs []T, cle func(T) K) map[K][]T {
          out := make(map[K][]T)
          for _, x := range xs {
              k := cle(x)
              out[k] = append(out[k], x)
          }
          return out
      }

      parDept := GroupBy(employes, func(e Employe) string { return e.Departement })
      ```
      "La clé doit être `comparable` puisqu'elle sert de clé de map ; les éléments peuvent être de n'importe quel type. L'`append` sur une entrée absente fonctionne car la valeur zéro d'un slice est nil et `append` l'accepte."
  - key: zero
    format: course
    question: Comment obtenir la valeur zéro d'un paramètre de type `T` ?
    answer: Avec `var zero T`, puis `return zero` ; ou `*new(T)`.
  - key: inference
    format: course
    question: Quand faut-il écrire explicitement les arguments de type ?
    answer: 'Quand le compilateur ne peut pas les déduire des arguments : une fonction sans paramètre de type T, ou un type qui n''apparaît que dans le résultat.'
  - key: operations
    format: course
    question: Pourquoi `a == b` ne compile-t-il pas dans une fonction `[T any]` ?
    answer: Parce que `any` autorise des types non comparables (slices, maps) ; il faut la contrainte `comparable` pour utiliser `==`.
  - key: instanciation
    format: course
    question: Peut-on affecter une fonction générique à une variable sans l'instancier ?
    answer: 'Non : `f := Filtrer` ne compile pas ; `f := Filtrer[int]` crée une fonction concrète.'
  - key: vf-inference
    format: true-false
    question: Avec `func Max[T cmp.Ordered](a, b T) T`, on peut appeler `Max(3, 7)` sans préciser `T`.
    truth: true
    answer: L'inférence déduit `T = int` des arguments.
  - key: vf-plusieurs
    format: true-false
    question: Une fonction peut avoir plusieurs paramètres de type, comme `[T any, K comparable]`.
    truth: true
    answer: Chacun avec sa propre contrainte.
  - key: vf-any-egal
    format: true-false
    question: Dans `func Index[T any](xs []T, v T) int`, on peut écrire `if x == v`.
    truth: false
    answer: Il faut `T comparable`.
  - key: vf-melange
    format: true-false
    question: '`Max(3, 2.5)` compile avec `func Max[T cmp.Ordered](a, b T) T`.'
    truth: true
    answer: Les deux constantes non typées se rejoignent en `float64`, et T vaut float64.
  - key: qcm-signatures
    format: multiple-choice
    question: Quelles signatures génériques sont valides ?
    choices:
      - text: '`func Map[T, U any](xs []T, f func(T) U) []U`'
        correct: true
      - text: '`func Cles[K comparable, V any](m map[K]V) []K`'
        correct: true
      - text: '`func Map<T>(xs []T) []T`'
        correct: false
      - text: '`func Cles[K, V](m map[K]V) []K` sans contrainte'
        correct: false
    answer: Go utilise des crochets, et chaque paramètre a une contrainte (au moins `any`).
  - key: qcm-explicite
    format: multiple-choice
    question: Dans quels cas faut-il préciser l'argument de type ?
    choices:
      - text: '`func Zero[T any]() T` appelée par `Zero[int]()`'
        correct: true
      - text: '`func Nouveau[T any]() *Pile[T]` appelée par `Nouveau[string]()`'
        correct: true
      - text: '`Max(1, 2)` avec `func Max[T cmp.Ordered](a, b T) T`'
        correct: false
      - text: '`slices.Contains(noms, "ada")`'
        correct: false
    answer: Sans argument de type T, rien ne permet l'inférence.
  - key: qcm-contrainte
    format: multiple-choice
    question: Quelle contrainte faut-il pour écrire `if a < b` sur des valeurs de type T ?
    choices:
      - text: '`cmp.Ordered`'
        correct: true
      - text: '`comparable`'
        correct: false
      - text: '`any`'
        correct: false
      - text: '`fmt.Stringer`'
        correct: false
    answer: '`comparable` n''autorise que `==` et `!=`.'
  - key: qcm-instancier
    format: multiple-choice
    question: Lesquelles compilent avec `func Filtrer[T any](xs []T, f func(T) bool) []T` ?
    choices:
      - text: '`f := Filtrer[int]`'
        correct: true
      - text: '`Filtrer([]string{"a"}, func(s string) bool { return s != "" })`'
        correct: true
      - text: '`f := Filtrer`'
        correct: false
      - text: '`Filtrer[int, string](...)`'
        correct: false
    answer: Une fonction générique doit être instanciée, avec le bon nombre d'arguments de type.
  - key: trous-crochets
    format: fill-in
    question: |-
      Complétez la déclaration :
      ```go
      func Premier___T any___(xs []T) T { return xs[0] }
      ```
    blanks:
      - - '['
      - - ']'
    answer: Les paramètres de type s'écrivent entre crochets.
  - key: trous-zero
    format: fill-in
    question: "Complétez le renvoi de la valeur zéro :\n```go\nfunc PremierOuZero[T any](xs []T) T {\n\tif len(xs) == 0 {\n\t\tvar zero ___\n\t\treturn zero\n\t}\n\treturn xs[0]\n}\n```"
    blanks:
      - - T
    answer: '`var zero T` donne la valeur zéro de n''importe quel type.'
  - key: trous-comparable
    format: fill-in
    question: |-
      Complétez la contrainte qui permet `==` :
      ```go
      func Index[T ___](xs []T, v T) int { ... }
      ```
    blanks:
      - - comparable
    answer: '`comparable` autorise `==` et `!=`.'
  - key: trous-explicite
    format: fill-in
    question: |-
      Complétez l'appel d'une fonction sans argument de type T :
      ```go
      p := NouvellePile___string___()
      ```
    blanks:
      - - '['
      - - ']'
    answer: L'argument de type se précise entre crochets.
  - key: code-filtrer
    format: code-output
    question: "```go\nfunc Filtrer[T any](xs []T, garder func(T) bool) []T {\n\tvar res []T\n\tfor _, x := range xs {\n\t\tif garder(x) {\n\t\t\tres = append(res, x)\n\t\t}\n\t}\n\treturn res\n}\n\nfmt.Println(Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }))\nfmt.Println(Filtrer([]string{\"go\", \"\", \"java\"}, func(s string) bool { return s != \"\" }))\n```"
    answer: '`[2 4]` puis `[go java]` : la même fonction pour deux types.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Filtrer[T any](xs []T, garder func(T) bool) []T {\n\tvar res []T\n\tfor _, x := range xs {\n\t\tif garder(x) {\n\t\t\tres = append(res, x)\n\t\t}\n\t}\n\treturn res\n}\n\nfunc main() {\n\tfmt.Println(Filtrer([]int{1, 2, 3, 4}, func(n int) bool { return n%2 == 0 }))\n\tfmt.Println(Filtrer([]string{\"go\", \"\", \"java\"}, func(s string) bool { return s != \"\" }))\n}\n"
      output: |-
        [2 4]
        [go java]
  - key: code-max
    format: code-output
    question: "```go\nfunc Max[T cmp.Ordered](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nfmt.Println(Max(3, 7), Max(\"go\", \"java\"), Max(3, 2.5))\n```"
    answer: '`7 java 3` : `T` vaut int, string, puis float64.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n)\n\nfunc Max[T cmp.Ordered](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nfunc main() {\n\tfmt.Println(Max(3, 7), Max(\"go\", \"java\"), Max(3, 2.5))\n}\n"
      output: 7 java 3
  - key: code-zero
    format: code-output
    question: "```go\nfunc PremierOuZero[T any](xs []T) T {\n\tvar zero T\n\tif len(xs) == 0 {\n\t\treturn zero\n\t}\n\treturn xs[0]\n}\n\nfmt.Printf(\"%q %v %v\\n\", PremierOuZero([]string{}), PremierOuZero([]int{}), PremierOuZero([]*int{}))\n```"
    answer: '`"" 0 <nil>` : la valeur zéro de chaque type d''élément.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc PremierOuZero[T any](xs []T) T {\n\tvar zero T\n\tif len(xs) == 0 {\n\t\treturn zero\n\t}\n\treturn xs[0]\n}\n\nfunc main() {\n\tfmt.Printf(\"%q %v %v\\n\", PremierOuZero([]string{}), PremierOuZero([]int{}), PremierOuZero([]*int{}))\n}\n"
      output: '"" 0 <nil>'
  - key: code-any-egal
    format: code-output
    question: "```go\nfunc Index[T any](xs []T, v T) int {\n\tfor i, x := range xs {\n\t\tif x == v {\n\t\t\treturn i\n\t\t}\n\t}\n\treturn -1\n}\n\nfmt.Println(Index([]int{1, 2}, 2))\n```"
    answer: 'Rien : le code ne compile pas, `==` n''est pas permis avec la contrainte `any`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Index[T any](xs []T, v T) int {\n\tfor i, x := range xs {\n\t\tif x == v {\n\t\t\treturn i\n\t\t}\n\t}\n\treturn -1\n}\n\nfunc main() {\n\tfmt.Println(Index([]int{1, 2}, 2))\n}\n"
      compiles: false
  - key: bug-any-egal
    format: bug-fix
    question: "Le compilateur signale « invalid operation: x == v (incomparable types in type set) » :\n```go\nfunc Contient[T any](xs []T, v T) bool {\n\tfor _, x := range xs {\n\t\tif x == v {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n```"
    answer: |-
      ```go
      func Contient[T comparable](xs []T, v T) bool { ... }
      // ou simplement : slices.Contains(xs, v)
      ```
      `==` exige la contrainte `comparable` ; et la bibliothèque standard fournit déjà `slices.Contains`.
  - key: bug-zero-nil
    format: bug-fix
    question: "Le compilateur signale « cannot use nil as T value in return statement » :\n```go\nfunc Premier[T any](xs []T) T {\n\tif len(xs) == 0 {\n\t\treturn nil\n\t}\n\treturn xs[0]\n}\n```"
    answer: "```go\nfunc Premier[T any](xs []T) (T, bool) {\n\tif len(xs) == 0 {\n\t\tvar zero T\n\t\treturn zero, false\n\t}\n\treturn xs[0], true\n}\n```\n`nil` n'est pas une valeur de tout type ; on renvoie la valeur zéro, avec un booléen pour signaler l'absence."
  - key: bug-instanciation
    format: bug-fix
    question: "Le compilateur signale « cannot use generic function Filtrer without instantiation » :\n```go\nfiltres := map[string]func([]int, func(int) bool) []int{\n\t\"pairs\": Filtrer,\n}\n```"
    answer: "```go\nfiltres := map[string]func([]int, func(int) bool) []int{\n\t\"pairs\": Filtrer[int],\n}\n```\nUne fonction générique doit être instanciée pour devenir une valeur de fonction."
  - key: bug-duplication
    format: bug-fix
    question: |-
      En revue, simplifiez :
      ```go
      func SommeInt(xs []int) int { ... }
      func SommeFloat(xs []float64) float64 { ... }
      func SommeInt64(xs []int64) int64 { ... }
      ```
    answer: "```go\ntype Nombre interface {\n\t~int | ~int64 | ~float64\n}\n\nfunc Somme[T Nombre](xs []T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n```\nUne seule fonction, contrainte par une union de types numériques qui autorise `+`."
  - key: scenario-grouper
    format: scenario
    question: Écris une fonction générique qui regroupe des éléments par une clé, et explique tes choix de contraintes.
    answer: |-
      `func Grouper[T any, K comparable](xs []T, cle func(T) K) map[K][]T`. Les éléments peuvent être de n'importe quel
      type (`any`), mais la clé sert d'index de map, donc elle doit être `comparable`. Le corps crée la map avec
      `make(map[K][]T)` puis fait `res[k] = append(res[k], x)` pour chaque élément. On l'appelle sans arguments de type :
      `Grouper(commandes, func(c Commande) string { return c.Client })`.
  - key: scenario-map
    format: scenario
    question: Pourquoi la bibliothèque standard n'a-t-elle pas de fonction `slices.Map` générique ?
    answer: |-
      Les concepteurs ont jugé qu'une boucle `for` explicite reste plus lisible en Go et qu'un `Map` encouragerait des
      chaînes de transformations peu idiomatiques. Les itérateurs (Go 1.23) ouvrent la voie à des adaptateurs, mais la
      bibliothèque reste prudente. Rien n'empêche d'écrire son propre `Map[T, U any]` si l'équipe le trouve utile, en
      gardant la boucle comme référence de lisibilité.
  - key: scenario-contrainte
    format: scenario
    question: Comment choisis-tu la contrainte d'un paramètre de type ?
    answer: |-
      Je prends la plus faible qui permet le corps de la fonction : `any` si je ne fais que stocker ou passer les
      valeurs, `comparable` si j'utilise `==` ou des clés de map, `cmp.Ordered` si je compare avec `<`, une union de
      types numériques si je fais de l'arithmétique, et une interface avec méthodes si j'appelle des méthodes. Une
      contrainte plus forte que nécessaire exclut des types sans raison.
  - key: scenario-test
    format: scenario
    question: Comment testes-tu une fonction générique ?
    answer: |-
      Je la teste avec au moins deux types qui exercent la contrainte différemment : un type de base (int), une chaîne,
      et un type défini (`type ID int`) si la contrainte utilise `~`. Un test de table générique peut factoriser les
      cas, mais la clarté prime : quelques tests concrets par type valent mieux qu'un test trop abstrait.
