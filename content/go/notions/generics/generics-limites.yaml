notion: generics-limites
cards:
  - key: change-1-27-methodes
    format: course
    question: Qu'a changé Go 1.27 pour les méthodes ?
    answer: Une méthode peut déclarer ses propres paramètres de type (méthodes génériques).
  - key: methode-interface-etre-generique
    format: course
    question: Une méthode d'interface peut-elle être générique ?
    answer: Non, même en Go 1.27.
  - key: specialisation-generics
    format: course
    question: Go a-t-il la spécialisation de generics ?
    answer: Non.
  - key: chien-animal
    format: course
    question: '`[]Chien` est-il un `[]Animal` ?'
    answer: Non, il n'y a pas de covariance.
