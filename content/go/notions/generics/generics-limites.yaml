notion: generics-limites
lesson: |-
  Les generics de Go sont volontairement **simples**, et certaines limites surprennent :

  - **Méthodes génériques** : jusqu'à Go 1.26, une méthode ne pouvait pas déclarer ses propres paramètres de type (seulement
    utiliser ceux de son type). **Go 1.27** les autorise sur les types concrets, mais une **méthode d'interface** ne peut
    toujours pas être générique : on ne saurait pas quelles instanciations générer pour chaque implémentation.
  - **Pas de spécialisation** : on ne peut pas écrire une version particulière d'une fonction générique pour un type donné.
    On passe par un switch de type sur `any(x)` dans le corps, ou par une interface.
  - **Pas de covariance** : un `[]Chien` n'est pas un `[]Animal`, et un `Pile[Chien]` n'est pas un `Pile[Animal]`, même si
    `Chien` implémente `Animal`. On convertit élément par élément, ou l'on rend la fonction générique.
  - **Pas de paramètres de type variadiques** ni de métaprogrammation : pas de « tuple de n types ».
  - **Pas d'opérateurs surchargés** : une contrainte ne peut pas demander `+` pour un type struct.
  - **On ne peut pas embarquer un paramètre de type** dans une struct (`struct{ T }`).
  - Les contraintes ne peuvent pas exprimer « a une méthode qui renvoie T » de façon récursive avant Go 1.26 (contraintes
    autoréférentes depuis).

  Ces limites gardent le langage et la compilation simples. Souvent, la solution est plus simple que la fonctionnalité
  manquante : une interface, une fonction en paramètre, ou du code non générique.

  **Piège classique** : vouloir passer un `[]*Commande` à une fonction qui attend un `[]Identifiable`. Le compilateur
  refuse ; une fonction `func Ids[T Identifiable](xs []T)` accepte le slice tel quel.

  **En entretien** : « Pas de spécialisation ni de covariance, pas de méthode générique dans une interface (méthodes
  génériques sur les types depuis 1.27) ; on contourne par une fonction générique, une interface ou un switch de type. »
cards:
  - key: change-1-27-methodes
    format: course
    question: Qu'a changé Go 1.27 pour les méthodes ?
    choices:
      - {text: "Une méthode d'un type concret peut déclarer ses propres paramètres de type", correct: true}
      - {text: "Une méthode d'interface peut désormais déclarer ses paramètres de type", correct: false}
      - {text: "Une méthode peut être surchargée selon le type de ses paramètres", correct: false}
      - {text: "Un receveur peut être un type défini dans un autre package", correct: false}
    answer: "Une méthode d'un type concret peut déclarer ses propres paramètres de type (méthodes génériques). Les méthodes d'interface ne le peuvent toujours pas, et Go n'a toujours pas de surcharge."
  - key: methode-interface-etre-generique
    format: course
    question: "Une méthode d'interface peut-elle être générique en Go 1.27 ?"
    choices:
      - {text: "Non : seules les méthodes des types concrets peuvent l'être", correct: true}
      - {text: "Oui : depuis Go 1.27, toute méthode peut avoir ses paramètres de type", correct: false}
      - {text: "Oui, à condition que l'interface ne contienne qu'une seule méthode", correct: false}
      - {text: "Non : une interface ne peut contenir que des méthodes sans paramètre", correct: false}
    answer: "Non, même en Go 1.27 : seules les méthodes des types concrets peuvent déclarer leurs paramètres de type. Une interface peut, elle, être générique (`Depot[T]`), mais ses méthodes n'ont pas de paramètres de type propres."
  - key: specialisation-generics
    format: course
    question: "Go permet-il de spécialiser une fonction générique pour un type précis, comme les templates de C++ ?"
    choices:
      - {text: "Non : une fonction générique a un seul corps pour tous les types", correct: true}
      - {text: "Oui : une seconde version `Max[int]` remplace la première pour `int`", correct: false}
      - {text: "Oui, avec une directive `//go:specialize` au-dessus de la version dédiée", correct: false}
      - {text: "Seulement pour les types de base, que le compilateur traite à part", correct: false}
    answer: "Non : un seul corps sert à tous les types. Pour un cas particulier, on teste le type dans le corps (`switch any(v).(type)`) ou on demande une méthode par la contrainte."
  - key: chien-animal
    format: course
    question: "Si `Chien` implémente l'interface `Animal`, un `[]Chien` est-il un `[]Animal` ?"
    choices:
      - {text: "Non : Go n'a pas de covariance, ce sont deux types distincts", correct: true}
      - {text: "Oui : un `[]Chien` se passe partout où un `[]Animal` est attendu", correct: false}
      - {text: "Oui, mais en lecture seule, comme les tableaux covariants de Java", correct: false}
      - {text: "Non, sauf si les éléments sont des pointeurs, comme `[]*Chien`", correct: false}
    answer: "Non : il n'y a pas de covariance. Un `[]Animal` est une slice de valeurs d'interface, de disposition mémoire différente d'un `[]Chien` : il faut le construire élément par élément, ou rendre la fonction générique."
  - key: covariance-solution
    format: course
    question: Comment passer un `[]Chien` à une fonction qui traite des `Animal` ?
    choices:
      - {text: "Rendre la fonction générique : `func Nourrir[T Animal](xs []T)`", correct: true}
      - {text: "Convertir la slice à l'appel : `Nourrir([]Animal(chiens))`", correct: false}
      - {text: "Étaler la slice à l'appel : `Nourrir(chiens...)`, élément par élément", correct: false}
      - {text: "Déclarer le paramètre en `[]any`, qui accepte n'importe quelle slice", correct: false}
    answer: "En rendant la fonction générique, `func Nourrir[T Animal](xs []T)`, qui accepte le slice tel quel ; sinon il faut construire un `[]Animal` élément par élément. La conversion `[]Animal(chiens)` n'existe pas, et `[]any` n'accepte pas plus un `[]Chien`."
  - key: specialisation
    format: course
    question: Comment traiter un type particulier dans une fonction générique, faute de spécialisation ?
    choices:
      - {text: "Avec un switch de type sur `any(x)`, ou une méthode exigée par la contrainte", correct: true}
      - {text: "Avec un switch de type directement sur `x`, de type `T`, sans conversion", correct: false}
      - {text: "En déclarant une surcharge de la fonction pour ce type précis", correct: false}
      - {text: "Avec une directive de compilation qui choisit le corps selon le type", correct: false}
    answer: "Avec un switch de type sur `any(x)` dans le corps, ou en demandant une méthode par la contrainte. Un switch de type directement sur une valeur de type `T` ne compile pas : il faut d'abord la convertir en `any`."
  - key: vf-interface-generique
    format: true-false
    question: Une méthode d'interface peut déclarer ses propres paramètres de type.
    truth: false
    answer: Même en Go 1.27, une méthode d'interface ne peut pas être générique.
  - key: vf-covariance
    format: true-false
    question: '`[]Chien` est assignable à `[]Animal` si `Chien` implémente l''interface `Animal`.'
    truth: false
    answer: Go n'a pas de covariance ; les deux types de slices sont distincts.
  - key: vf-embarquer
    format: true-false
    question: 'On peut embarquer un paramètre de type dans une struct : `type Enveloppe[T any] struct{ T }`.'
    truth: false
    answer: Ce n'est pas permis ; on déclare un champ nommé `Valeur T`.
  - key: vf-operateur
    format: true-false
    question: Une contrainte peut exiger qu'un type struct définisse l'opérateur `+`.
    truth: false
    answer: Go n'a pas de surcharge d'opérateurs ; on demande une méthode `Ajouter`.
  - key: qcm-limites
    format: multiple-choice
    question: "Lesquelles de ces fonctionnalités les generics de Go n'ont-ils pas ?"
    choices:
      - text: La spécialisation par type
        correct: true
      - text: La covariance des types génériques
        correct: true
      - text: Plusieurs paramètres de type dans une fonction
        correct: false
      - text: Les contraintes par union de types
        correct: false
    answer: Plusieurs paramètres et les unions existent.
  - key: qcm-contourner
    format: multiple-choice
    question: "Comment passer un `[]Article` à `func Total(xs []Prixable) int` sans recopier la slice ?"
    choices:
      - {text: "La rendre générique : `func Total[T Prixable](xs []T) int`", correct: true}
      - {text: "Convertir la slice à l'appel : `Total([]Prixable(articles))`", correct: false}
      - {text: "Étaler la slice à l'appel : `Total(articles...)`", correct: false}
      - {text: "Convertir la slice avec `unsafe`, les deux ayant la même taille", correct: false}
    answer: "La version générique accepte le `[]Article` tel quel. Sinon, il faut construire un `[]Prixable` élément par élément : la conversion directe de type de slice n'existe pas, et une valeur d'interface n'a pas la disposition mémoire d'un `Article`."
  - key: qcm-switch
    format: multiple-choice
    question: Comment, dans `func Formater[T any](v T) string`, traiter les chaînes à part ?
    choices:
      - text: '`switch x := any(v).(type) { case string: ... }`'
        correct: true
      - text: '`switch T { case string: ... }`'
        correct: false
      - text: Déclarer une seconde fonction `Formater[string]`
        correct: false
      - text: '`if T == string`'
        correct: false
    answer: On convertit la valeur en `any` pour faire un switch de type.
  - key: qcm-127
    format: multiple-choice
    question: Que permet Go 1.27 pour les méthodes ?
    choices:
      - {text: "Qu'une méthode d'un type concret déclare ses propres paramètres de type", correct: true}
      - {text: "Qu'une méthode d'interface déclare ses propres paramètres de type", correct: false}
      - {text: "Qu'une méthode soit spécialisée pour un type précis, comme en C++", correct: false}
      - {text: "Qu'un type ait plusieurs méthodes du même nom, selon leurs paramètres", correct: false}
    answer: "Go 1.27 permet les méthodes génériques sur les types concrets ; les méthodes d'interface ne peuvent toujours pas l'être, et Go n'a ni spécialisation ni surcharge."
  - key: code-covariance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Animal interface{ Cri() string }
      type Chien struct{}

      func (Chien) Cri() string { return "wouf" }

      func Chorale(as []Animal) {}

      Chorale([]Chien{{}, {}})
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "Rien", correct: false}
      - {text: "`wouf wouf`", correct: false}
      - {text: "Une panic à l'exécution", correct: false}
    answer: "Le code ne compile pas : un `[]Chien` n'est pas un `[]Animal`, Go n'a pas de covariance. S'il compilait, il n'afficherait rien, `Chorale` étant vide."
    check:
      code: "package main\n\ntype Animal interface{ Cri() string }\n\ntype Chien struct{}\n\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\n\nfunc Chorale(as []Animal) {}\n\nfunc main() {\n\tChorale([]Chien{{}, {}})\n}\n"
      compiles: false
  - key: code-generique-covariance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Animal interface{ Cri() string }
      type Chien struct{}

      func (Chien) Cri() string { return "wouf" }

      func Chorale[T Animal](as []T) string {
      	s := ""
      	for _, a := range as {
      		s += a.Cri() + " "
      	}
      	return s
      }

      fmt.Println(Chorale([]Chien{{}, {}}))
      ```
    choices:
      - {text: "`wouf wouf`", correct: true}
      - {text: "`wouf`", correct: false}
      - {text: "`[wouf wouf]`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`wouf wouf` : la fonction générique, contrainte par `Animal`, accepte le `[]Chien` tel quel, là où `[]Animal` le refuserait."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Animal interface{ Cri() string }\n\ntype Chien struct{}\n\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\n\nfunc Chorale[T Animal](as []T) string {\n\ts := \"\"\n\tfor _, a := range as {\n\t\ts += a.Cri() + \" \"\n\t}\n\treturn s\n}\n\nfunc main() {\n\tfmt.Println(Chorale([]Chien{{}, {}}))\n}\n"
      output: wouf wouf
  - key: code-switch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func Decrire[T any](v T) string {
      	switch x := any(v).(type) {
      	case string:
      		return "texte " + x
      	case int:
      		return fmt.Sprint("entier ", x)
      	default:
      		return fmt.Sprintf("autre %T", x)
      	}
      }

      fmt.Println(Decrire("go"), Decrire(3), Decrire(2.5))
      ```
    choices:
      - {text: "`texte go entier 3 autre float64`", correct: true}
      - {text: "`texte go entier 3 autre 2.5`", correct: false}
      - {text: "`autre string autre int autre float64`", correct: false}
      - {text: "`texte go entier 3 autre float32`", correct: false}
    answer: "`texte go entier 3 autre float64` : le switch de type sur `any(v)` voit le type exact de chaque instanciation, et la constante `2.5` devient un `float64`. Il remplace la spécialisation."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Decrire[T any](v T) string {\n\tswitch x := any(v).(type) {\n\tcase string:\n\t\treturn \"texte \" + x\n\tcase int:\n\t\treturn fmt.Sprint(\"entier \", x)\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre %T\", x)\n\t}\n}\n\nfunc main() {\n\tfmt.Println(Decrire(\"go\"), Decrire(3), Decrire(2.5))\n}\n"
      output: texte go entier 3 autre float64
  - key: code-embarquer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Enveloppe[T any] struct {
      	T
      }

      fmt.Println(Enveloppe[int]{})
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`{0}`", correct: false}
      - {text: "`{}`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Le code ne compile pas : on ne peut pas embarquer un paramètre de type (« embedded field type cannot be a (pointer to a) type parameter ») ; il faut un champ nommé."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Enveloppe[T any] struct {\n\tT\n}\n\nfunc main() {\n\tfmt.Println(Enveloppe[int]{})\n}\n"
      compiles: false
  - key: bug-covariance
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use commandes (variable of type []*Commande) as []Identifiable value ». Quelle correction est la bonne ?
      ```go
      func Ids(xs []Identifiable) []string { ... }

      ids := Ids(commandes)
      ```
    choices:
      - {text: "Rendre `Ids` générique : `func Ids[T Identifiable](xs []T) []string`", correct: true}
      - {text: "Convertir la slice à l'appel : `Ids([]Identifiable(commandes))`", correct: false}
      - {text: "Déclarer `commandes` en `[]Commande` plutôt qu'en `[]*Commande`", correct: false}
      - {text: "Étaler la slice à l'appel : `Ids(commandes...)`, élément par élément", correct: false}
    answer: "```go\nfunc Ids[T Identifiable](xs []T) []string {\n\tres := make([]string, len(xs))\n\tfor i, x := range xs {\n\t\tres[i] = x.ID()\n\t}\n\treturn res\n}\n```\nFaute de covariance, une fonction générique contrainte par l'interface accepte n'importe quel slice d'éléments qui\nl'implémentent."
  - key: bug-interface
    format: bug-fix
    question: |-
      Le compilateur refuse cette interface. Quelle correction est la bonne ?
      ```go
      type Depot interface {
      	Lire[T any](id string) (T, error)
      }
      ```
    choices:
      - {text: "Rendre l'interface générique : `type Depot[T any] interface { Lire(id string) (T, error) }`", correct: true}
      - {text: "Passer à Go 1.27, qui permet les méthodes génériques dans les interfaces", correct: false}
      - {text: "Écrire `Lire<T>(id string)`, la syntaxe des méthodes génériques d'interface", correct: false}
      - {text: "Contraindre par `comparable`, seule contrainte permise dans une interface", correct: false}
    answer: "```go\ntype Depot[T any] interface {\n\tLire(id string) (T, error)\n}\n```\nUne méthode d'interface ne peut pas être générique ; on rend l'interface elle-même générique."
  - key: bug-specialisation
    format: bug-fix
    question: |-
      Un collègue duplique une fonction générique pour un cas particulier, et les deux versions divergent. Quelle correction est la bonne ?
      ```go
      func Formater[T any](v T) string { return fmt.Sprint(v) }
      func FormaterTemps(v time.Time) string { return v.Format(time.RFC3339) }
      ```
    choices:
      - {text: "Un seul `Formater`, qui teste `any(v).(time.Time)` dans son corps", correct: true}
      - {text: "Déclarer `Formater[time.Time]` comme spécialisation de `Formater`", correct: false}
      - {text: "Renommer `FormaterTemps` en `Formater` : Go choisira selon le type", correct: false}
      - {text: "Contraindre `Formater` par `time.Time | any` pour couvrir les deux", correct: false}
    answer: "```go\nfunc Formater[T any](v T) string {\n\tif t, ok := any(v).(time.Time); ok {\n\t\treturn t.Format(time.RFC3339)\n\t}\n\treturn fmt.Sprint(v)\n}\n```\nFaute de spécialisation, un test de type dans le corps garde un seul point d'entrée (ou une interface `Formateur`\nque les types implémentent)."
  - key: bug-embarquer
    format: bug-fix
    question: |-
      Le compilateur signale « embedded field type cannot be a (pointer to a) type parameter ». Quelle correction est la bonne ?
      ```go
      type Horodate[T any] struct {
      	T
      	Le time.Time
      }
      ```
    choices:
      - {text: "Un champ nommé : `Valeur T` à la place de `T`", correct: true}
      - {text: "Un pointeur embarqué : `*T` à la place de `T`", correct: false}
      - {text: "Une contrainte plus précise : `[T comparable]`", correct: false}
      - {text: "Un alias `type Base = T`, puis embarquer `Base`", correct: false}
    answer: "```go\ntype Horodate[T any] struct {\n\tValeur T\n\tLe     time.Time\n}\n```\nUn paramètre de type ne s'embarque pas : on utilise un champ nommé."
