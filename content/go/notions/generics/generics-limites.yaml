notion: generics-limites
lesson: |-
  Les generics de Go sont volontairement **simples**, et certaines limites surprennent :

  - **Méthodes génériques** : jusqu'à Go 1.26, une méthode ne pouvait pas déclarer ses propres paramètres de type (seulement
    utiliser ceux de son type). **Go 1.27** les autorise sur les types concrets, mais une **méthode d'interface** ne peut
    toujours pas être générique : on ne saurait pas quelles instanciations générer pour chaque implémentation.
  - **Pas de spécialisation** : on ne peut pas écrire une version particulière d'une fonction générique pour un type donné.
    On passe par un switch de type sur `any(x)` dans le corps, ou par une interface.
  - **Pas de covariance** : un `[]Chien` n'est pas un `[]Animal`, et un `Pile[Chien]` n'est pas un `Pile[Animal]`, même si
    `Chien` implémente `Animal`. On convertit élément par élément, ou l'on rend la fonction générique.
  - **Pas de paramètres de type variadiques** ni de métaprogrammation : pas de « tuple de n types ».
  - **Pas d'opérateurs surchargés** : une contrainte ne peut pas demander `+` pour un type struct.
  - **On ne peut pas embarquer un paramètre de type** dans une struct (`struct{ T }`).
  - Les contraintes ne peuvent pas exprimer « a une méthode qui renvoie T » de façon récursive avant Go 1.26 (contraintes
    autoréférentes depuis).

  Ces limites gardent le langage et la compilation simples. Souvent, la solution est plus simple que la fonctionnalité
  manquante : une interface, une fonction en paramètre, ou du code non générique.

  **Piège classique** : vouloir passer un `[]*Commande` à une fonction qui attend un `[]Identifiable`. Le compilateur
  refuse ; une fonction `func Ids[T Identifiable](xs []T)` accepte le slice tel quel.

  **En entretien** : « Pas de spécialisation ni de covariance, pas de méthode générique dans une interface (méthodes
  génériques sur les types depuis 1.27) ; on contourne par une fonction générique, une interface ou un switch de type. »
cards:
  - key: change-1-27-methodes
    format: course
    question: Qu'a changé Go 1.27 pour les méthodes ?
    answer: Une méthode peut déclarer ses propres paramètres de type (méthodes génériques).
  - key: methode-interface-etre-generique
    format: course
    question: Une méthode d'interface peut-elle être générique ?
    answer: Non, même en Go 1.27.
  - key: specialisation-generics
    format: course
    question: Go a-t-il la spécialisation de generics ?
    answer: Non.
  - key: chien-animal
    format: course
    question: '`[]Chien` est-il un `[]Animal` ?'
    answer: Non, il n'y a pas de covariance.
  - key: covariance-solution
    format: course
    question: Comment passer un `[]Chien` à une fonction qui traite des `Animal` ?
    answer: En rendant la fonction générique, `func Nourrir[T Animal](xs []T)`, qui accepte le slice tel quel ; sinon il faut construire un `[]Animal` élément par élément.
  - key: specialisation
    format: course
    question: Comment traiter un type particulier dans une fonction générique, faute de spécialisation ?
    answer: Avec un switch de type sur `any(x)` dans le corps, ou en demandant une méthode par la contrainte.
  - key: vf-interface-generique
    format: true-false
    question: Une méthode d'interface peut déclarer ses propres paramètres de type.
    truth: false
    answer: Même en Go 1.27, une méthode d'interface ne peut pas être générique.
  - key: vf-covariance
    format: true-false
    question: '`[]Chien` est assignable à `[]Animal` si `Chien` implémente l''interface `Animal`.'
    truth: false
    answer: Go n'a pas de covariance ; les deux types de slices sont distincts.
  - key: vf-embarquer
    format: true-false
    question: 'On peut embarquer un paramètre de type dans une struct : `type Enveloppe[T any] struct{ T }`.'
    truth: false
    answer: Ce n'est pas permis ; on déclare un champ nommé `Valeur T`.
  - key: vf-operateur
    format: true-false
    question: Une contrainte peut exiger qu'un type struct définisse l'opérateur `+`.
    truth: false
    answer: Go n'a pas de surcharge d'opérateurs ; on demande une méthode `Ajouter`.
  - key: qcm-limites
    format: multiple-choice
    question: Quelles fonctionnalités les generics de Go n'ont-ils pas ?
    choices:
      - text: La spécialisation par type
        correct: true
      - text: La covariance des types génériques
        correct: true
      - text: Plusieurs paramètres de type dans une fonction
        correct: false
      - text: Les contraintes par union de types
        correct: false
    answer: Plusieurs paramètres et les unions existent.
  - key: qcm-contourner
    format: multiple-choice
    question: Comment contourner l'absence de covariance pour `func Total(xs []Prixable) int` ?
    choices:
      - text: 'La rendre générique : `func Total[T Prixable](xs []T) int`'
        correct: true
      - text: Convertir les éléments dans un `[]Prixable`
        correct: true
      - text: Écrire `Total([]Prixable(articles))`
        correct: false
      - text: Utiliser `unsafe` pour convertir le slice
        correct: false
    answer: La conversion directe de type de slice n'existe pas.
  - key: qcm-switch
    format: multiple-choice
    question: Comment, dans `func Formater[T any](v T) string`, traiter les chaînes à part ?
    choices:
      - text: '`switch x := any(v).(type) { case string: ... }`'
        correct: true
      - text: '`switch T { case string: ... }`'
        correct: false
      - text: Déclarer une seconde fonction `Formater[string]`
        correct: false
      - text: '`if T == string`'
        correct: false
    answer: On convertit la valeur en `any` pour faire un switch de type.
  - key: qcm-127
    format: multiple-choice
    question: Que permet Go 1.27 pour les méthodes ?
    choices:
      - text: Qu'une méthode d'un type concret déclare ses propres paramètres de type
        correct: true
      - text: Qu'une méthode d'interface soit générique
        correct: false
      - text: La spécialisation des méthodes
        correct: false
      - text: La surcharge des méthodes
        correct: false
    answer: Les interfaces restent sans méthodes génériques.
  - key: code-covariance
    format: code-output
    question: |-
      ```go
      type Animal interface{ Cri() string }
      type Chien struct{}

      func (Chien) Cri() string { return "wouf" }

      func Chorale(as []Animal) {}

      Chorale([]Chien{{}, {}})
      ```
    answer: 'Rien : le code ne compile pas, un `[]Chien` n''est pas un `[]Animal`.'
    check:
      code: "package main\n\ntype Animal interface{ Cri() string }\n\ntype Chien struct{}\n\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\n\nfunc Chorale(as []Animal) {}\n\nfunc main() {\n\tChorale([]Chien{{}, {}})\n}\n"
      compiles: false
  - key: code-generique-covariance
    format: code-output
    question: "```go\ntype Animal interface{ Cri() string }\ntype Chien struct{}\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\nfunc Chorale[T Animal](as []T) string {\n\ts := \"\"\n\tfor _, a := range as {\n\t\ts += a.Cri() + \" \"\n\t}\n\treturn s\n}\n\nfmt.Println(Chorale([]Chien{{}, {}}))\n```"
    answer: '`wouf wouf` : la fonction générique accepte le slice de type concret tel quel.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Animal interface{ Cri() string }\n\ntype Chien struct{}\n\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\n\nfunc Chorale[T Animal](as []T) string {\n\ts := \"\"\n\tfor _, a := range as {\n\t\ts += a.Cri() + \" \"\n\t}\n\treturn s\n}\n\nfunc main() {\n\tfmt.Println(Chorale([]Chien{{}, {}}))\n}\n"
      output: wouf wouf
  - key: code-switch
    format: code-output
    question: "```go\nfunc Decrire[T any](v T) string {\n\tswitch x := any(v).(type) {\n\tcase string:\n\t\treturn \"texte \" + x\n\tcase int:\n\t\treturn fmt.Sprint(\"entier \", x)\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre %T\", x)\n\t}\n}\n\nfmt.Println(Decrire(\"go\"), Decrire(3), Decrire(2.5))\n```"
    answer: '`texte go entier 3 autre float64` : un switch de type remplace la spécialisation.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc Decrire[T any](v T) string {\n\tswitch x := any(v).(type) {\n\tcase string:\n\t\treturn \"texte \" + x\n\tcase int:\n\t\treturn fmt.Sprint(\"entier \", x)\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre %T\", x)\n\t}\n}\n\nfunc main() {\n\tfmt.Println(Decrire(\"go\"), Decrire(3), Decrire(2.5))\n}\n"
      output: texte go entier 3 autre float64
  - key: code-embarquer
    format: code-output
    question: "```go\ntype Enveloppe[T any] struct {\n\tT\n}\n\nfmt.Println(Enveloppe[int]{})\n```"
    answer: 'Rien : le code ne compile pas, on ne peut pas embarquer un paramètre de type.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Enveloppe[T any] struct {\n\tT\n}\n\nfunc main() {\n\tfmt.Println(Enveloppe[int]{})\n}\n"
      compiles: false
  - key: bug-covariance
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use commandes (variable of type []*Commande) as []Identifiable value » :
      ```go
      func Ids(xs []Identifiable) []string { ... }

      ids := Ids(commandes)
      ```
    answer: "```go\nfunc Ids[T Identifiable](xs []T) []string {\n\tres := make([]string, len(xs))\n\tfor i, x := range xs {\n\t\tres[i] = x.ID()\n\t}\n\treturn res\n}\n```\nFaute de covariance, une fonction générique contrainte par l'interface accepte n'importe quel slice d'éléments qui\nl'implémentent."
  - key: bug-interface
    format: bug-fix
    question: "Le compilateur refuse cette interface :\n```go\ntype Depot interface {\n\tLire[T any](id string) (T, error)\n}\n```"
    answer: "```go\ntype Depot[T any] interface {\n\tLire(id string) (T, error)\n}\n```\nUne méthode d'interface ne peut pas être générique ; on rend l'interface elle-même générique."
  - key: bug-specialisation
    format: bug-fix
    question: |-
      Un collègue duplique une fonction générique pour un cas particulier, et les deux divergent :
      ```go
      func Formater[T any](v T) string { return fmt.Sprint(v) }
      func FormaterTemps(v time.Time) string { return v.Format(time.RFC3339) }
      ```
    answer: "```go\nfunc Formater[T any](v T) string {\n\tif t, ok := any(v).(time.Time); ok {\n\t\treturn t.Format(time.RFC3339)\n\t}\n\treturn fmt.Sprint(v)\n}\n```\nFaute de spécialisation, un test de type dans le corps garde un seul point d'entrée (ou une interface `Formateur`\nque les types implémentent)."
  - key: bug-embarquer
    format: bug-fix
    question: "Le compilateur signale « embedded field type cannot be a (pointer to a) type parameter » :\n```go\ntype Horodate[T any] struct {\n\tT\n\tLe time.Time\n}\n```"
    answer: "```go\ntype Horodate[T any] struct {\n\tValeur T\n\tLe     time.Time\n}\n```\nUn paramètre de type ne s'embarque pas : on utilise un champ nommé."
