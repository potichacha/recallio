notion: generics-presentation
lesson: "Les **generics** (ou paramètres de type) sont arrivés en **Go 1.18** (2022), après plus de dix ans de discussions. Ils\npermettent d'écrire une fonction ou un type **une seule fois pour plusieurs types**, en gardant la vérification à la\ncompilation :\n\n```go\nfunc Max[T cmp.Ordered](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nMax(3, 7)         // 7, T = int\nMax(\"go\", \"java\") // \"java\", T = string\n```\n\nAvant eux, on avait le choix entre dupliquer le code (`MaxInt`, `MaxFloat64`) et utiliser `interface{}` avec des\nassertions, au prix du typage.\n\n**Quand s'en servir** : les structures de données (piles, ensembles, caches typés), les algorithmes sur des collections\n(`slices.Sort`, `slices.Contains`, `maps.Keys`), les fonctions utilitaires qui ne dépendent que d'une propriété du type\n(comparable, ordonné). **Quand s'en passer** : si une **interface** suffit (le code appelle des méthodes), ou si un\nseul type est concerné. La règle de l'équipe Go : écrire d'abord le code pour un type concret, et généraliser quand un\nsecond type en a besoin.\n\nLes évolutions : alias génériques (Go 1.24), contraintes autoréférentes (Go 1.26), méthodes génériques (Go 1.27). La\nbibliothèque standard s'en sert dans `slices`, `maps`, `cmp`, `iter`, `sync/atomic.Pointer[T]`.\n\n**Piège classique** : tout rendre générique « au cas où ». Le code devient plus abstrait et plus difficile à lire pour\nun gain nul quand un seul type l'utilise.\n\n**En entretien** : « Depuis Go 1.18, des paramètres de type contraints par des interfaces ; utiles pour les collections\net les algorithmes ; une interface reste le bon choix quand on appelle des méthodes ; on généralise quand le second\ntype arrive. »"
cards:
  - key: depuis-version-generics
    format: course
    question: Depuis quelle version Go a-t-il des generics ?
    answer: Go 1.18 (mars 2022).
  - key: apporte-1-24-generics
    format: course
    question: Qu'apporte Go 1.24 aux generics ?
    answer: Les alias de types génériques.
  - key: apporte-1-26-generics
    format: course
    question: Qu'apporte Go 1.26 aux generics ?
    answer: Les contraintes autoréférentes (un type générique peut se citer dans sa liste de paramètres de type).
  - key: avant
    format: course
    question: Comment écrivait-on du code réutilisable sur plusieurs types avant les generics ?
    answer: En dupliquant le code pour chaque type, avec des générateurs (`go generate`), ou avec `interface{}` et des assertions, au prix de la vérification des types.
  - key: vf-118
    format: true-false
    question: Les generics sont arrivés dans Go 1.18.
    truth: true
    answer: En mars 2022.
  - key: vf-typage
    format: true-false
    question: Une fonction générique perd la vérification des types à la compilation, comme `any`.
    truth: false
    answer: Chaque instanciation est vérifiée à la compilation.
  - key: vf-stdlib
    format: true-false
    question: Les packages `slices` et `maps` de la bibliothèque standard sont écrits avec des generics.
    truth: true
    answer: Depuis Go 1.21.
  - key: vf-partout
    format: true-false
    question: L'équipe Go recommande de rendre génériques toutes les fonctions qui pourraient servir à plusieurs types.
    truth: false
    answer: On écrit d'abord pour un type concret, et l'on généralise quand un second type en a besoin.
  - key: qcm-usages
    format: multiple-choice
    question: Dans quels cas les generics sont-ils un bon choix ?
    choices:
      - text: Une pile ou un ensemble typé
        correct: true
      - text: Une fonction de filtre sur un slice de n'importe quel type
        correct: true
      - text: Un service qui appelle une méthode `Envoyer` sur ses dépendances
        correct: false
      - text: Une fonction qui ne sert qu'aux commandes
        correct: false
    answer: Quand on appelle des méthodes, une interface suffit ; pour un seul type, rien n'est à généraliser.
  - key: qcm-stdlib
    format: multiple-choice
    question: Quels éléments de la bibliothèque standard sont génériques ?
    choices:
      - text: '`slices.Contains`'
        correct: true
      - text: '`atomic.Pointer[T]`'
        correct: true
      - text: '`fmt.Println`'
        correct: false
      - text: '`sort.Ints`'
        correct: false
    answer: '`fmt.Println` prend des `any`, et `sort.Ints` est antérieur aux generics.'
  - key: qcm-alternatives
    format: multiple-choice
    question: Que gagne `func Max[T cmp.Ordered](a, b T) T` par rapport à `func Max(a, b any) any` ?
    choices:
      - text: La vérification des types à la compilation
        correct: true
      - text: L'absence d'assertion de type chez l'appelant
        correct: true
      - text: La possibilité de comparer des slices
        correct: false
      - text: Un code plus court en toutes circonstances
        correct: false
    answer: Avec `any`, il faudrait des assertions, et `>` ne compilerait même pas.
  - key: qcm-versions
    format: multiple-choice
    question: Quelles évolutions des generics sont arrivées après Go 1.18 ?
    choices:
      - text: Les alias génériques (Go 1.24)
        correct: true
      - text: Les méthodes génériques (Go 1.27)
        correct: true
      - text: La spécialisation par type
        correct: false
      - text: La covariance des slices
        correct: false
    answer: La spécialisation et la covariance n'existent toujours pas.
  - key: scenario-quand
    format: scenario
    question: Un collègue hésite à écrire une fonction générique pour dédoublonner des slices. Comment l'aides-tu à décider ?
    answer: |-
      Je regarde combien de types en ont besoin aujourd'hui. Si c'est un seul, une fonction concrète suffit. Si plusieurs
      types d'éléments comparables doivent être dédoublonnés, une fonction `Dedoublonner[T comparable](xs []T) []T` est
      idéale : elle ne dépend que de l'égalité, garde le typage, et se teste une fois. Je vérifie aussi que la
      bibliothèque standard ne le fait pas déjà (`slices.Compact` après un tri, par exemple).
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi Go a mis si longtemps à avoir des generics. Que réponds-tu ?
    answer: |-
      L'équipe voulait une conception qui garde la simplicité du langage, des compilations rapides et des binaires de
      taille raisonnable ; plusieurs propositions ont été rejetées parce qu'elles compliquaient trop le langage. La
      version retenue (Go 1.18) s'appuie sur les interfaces existantes comme contraintes, sans spécialisation ni
      métaprogrammation. Entre-temps, les interfaces et la génération de code couvraient la plupart des besoins.
  - key: scenario-migration
    format: scenario
    question: Une base de code a des fonctions `ContientInt`, `ContientString`, `ContientID`. Que proposes-tu ?
    answer: |-
      Les remplacer par `slices.Contains` de la bibliothèque standard, générique et déjà testée, et supprimer les trois
      fonctions. Plus généralement, je cherche les helpers dupliqués par type (filtres, max, clés de map) qui ont un
      équivalent dans `slices`, `maps` ou `cmp`. `go fix` propose aussi certaines de ces modernisations.
  - key: scenario-equipe
    format: scenario
    question: Quelles règles proposes-tu à une équipe pour l'usage des generics ?
    answer: |-
      Utiliser d'abord ce que fournissent `slices`, `maps` et `cmp`. Écrire du code générique pour les structures de
      données et les algorithmes qui servent à au moins deux types, avec la contrainte la plus faible possible (`any`,
      `comparable`, `cmp.Ordered`). Préférer une interface quand le code appelle des méthodes. Ne pas rendre générique
      une couche métier entière, et garder des noms de paramètres de type courts (`T`, `K`, `V`).
