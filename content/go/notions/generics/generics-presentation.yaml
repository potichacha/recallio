notion: generics-presentation
cards:
  - key: depuis-version-generics
    format: course
    question: Depuis quelle version Go a-t-il des generics ?
    answer: Go 1.18 (mars 2022).
  - key: apporte-1-24-generics
    format: course
    question: Qu'apporte Go 1.24 aux generics ?
    answer: Les alias de types génériques.
  - key: apporte-1-26-generics
    format: course
    question: Qu'apporte Go 1.26 aux generics ?
    answer: Les contraintes autoréférentes (un type générique peut se citer dans sa liste de paramètres de type).
