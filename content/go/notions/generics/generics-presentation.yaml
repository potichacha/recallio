notion: generics-presentation
lesson: "Les **generics** (ou paramètres de type) sont arrivés en **Go 1.18** (2022), après plus de dix ans de discussions. Ils\npermettent d'écrire une fonction ou un type **une seule fois pour plusieurs types**, en gardant la vérification à la\ncompilation :\n\n```go\nfunc Max[T cmp.Ordered](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nMax(3, 7)         // 7, T = int\nMax(\"go\", \"java\") // \"java\", T = string\n```\n\nAvant eux, on avait le choix entre dupliquer le code (`MaxInt`, `MaxFloat64`) et utiliser `interface{}` avec des\nassertions, au prix du typage.\n\n**Quand s'en servir** : les structures de données (piles, ensembles, caches typés), les algorithmes sur des collections\n(`slices.Sort`, `slices.Contains`, `maps.Keys`), les fonctions utilitaires qui ne dépendent que d'une propriété du type\n(comparable, ordonné). **Quand s'en passer** : si une **interface** suffit (le code appelle des méthodes), ou si un\nseul type est concerné. La règle de l'équipe Go : écrire d'abord le code pour un type concret, et généraliser quand un\nsecond type en a besoin.\n\nLes évolutions : alias génériques (Go 1.24), contraintes autoréférentes (Go 1.26), méthodes génériques (Go 1.27). La\nbibliothèque standard s'en sert dans `slices`, `maps`, `cmp`, `iter`, `sync/atomic.Pointer[T]`.\n\n**Piège classique** : tout rendre générique « au cas où ». Le code devient plus abstrait et plus difficile à lire pour\nun gain nul quand un seul type l'utilise.\n\n**En entretien** : « Depuis Go 1.18, des paramètres de type contraints par des interfaces ; utiles pour les collections\net les algorithmes ; une interface reste le bon choix quand on appelle des méthodes ; on généralise quand le second\ntype arrive. »"
cards:
  - key: depuis-version-generics
    format: course
    question: Depuis quelle version Go a-t-il des generics ?
    choices:
      - {text: "Go 1.18, sorti en mars 2022", correct: true}
      - {text: "Go 1.21, sorti en août 2023", correct: false}
      - {text: "Go 1.16, sorti en février 2021", correct: false}
      - {text: "Go 1.0 : depuis le début du langage", correct: false}
    answer: "Go 1.18 (mars 2022). Go 1.21 a ensuite ajouté les packages génériques `slices`, `maps` et `cmp` ; avant 1.18, le langage n'avait pas de generics."
  - key: apporte-1-24-generics
    format: course
    question: Qu'apporte Go 1.24 aux generics ?
    choices:
      - {text: "Les alias de types génériques, comme `type Liste[T any] = []T`", correct: true}
      - {text: "Les méthodes génériques sur les types concrets", correct: false}
      - {text: "Les contraintes autoréférentes dans les types génériques", correct: false}
      - {text: "Les packages génériques `slices`, `maps` et `cmp`", correct: false}
    answer: "Les alias de types génériques (`type Liste[T any] = []T`). `slices` et `maps` datent de Go 1.21, les contraintes autoréférentes de Go 1.26 et les méthodes génériques de Go 1.27."
  - key: apporte-1-26-generics
    format: course
    question: Qu'apporte Go 1.26 aux generics ?
    choices:
      - {text: "Les contraintes autoréférentes : un type générique peut se citer dans ses paramètres", correct: true}
      - {text: "Les alias de types génériques, comme `type Liste[T any] = []T`", correct: false}
      - {text: "Les méthodes génériques sur les types concrets, avec leurs propres paramètres", correct: false}
      - {text: "L'inférence des arguments de type depuis le type du résultat attendu", correct: false}
    answer: "Les contraintes autoréférentes : un type générique peut se citer dans sa propre liste de paramètres de type. Les alias génériques datent de Go 1.24, les méthodes génériques de Go 1.27."
  - key: avant
    format: course
    question: Comment écrivait-on du code réutilisable sur plusieurs types avant les generics ?
    choices:
      - {text: "En dupliquant, avec `go generate`, ou avec `interface{}` et des assertions", correct: true}
      - {text: "Avec des templates C, inclus par le préprocesseur de `cgo`", correct: false}
      - {text: "Avec la surcharge de fonctions, permise avant Go 1.18", correct: false}
      - {text: "Avec des classes abstraites, retirées du langage depuis", correct: false}
    answer: "En dupliquant le code pour chaque type, avec des générateurs (`go generate`), ou avec `interface{}` et des assertions, au prix de la vérification des types. Go n'a jamais eu ni surcharge ni classes."
  - key: vf-118
    format: true-false
    question: Les generics sont arrivés dans Go 1.18.
    truth: true
    answer: En mars 2022.
  - key: vf-typage
    format: true-false
    question: Une fonction générique perd la vérification des types à la compilation, comme `any`.
    truth: false
    answer: Chaque instanciation est vérifiée à la compilation.
  - key: vf-stdlib
    format: true-false
    question: Les packages `slices` et `maps` de la bibliothèque standard sont écrits avec des generics.
    truth: true
    answer: Depuis Go 1.21.
  - key: vf-partout
    format: true-false
    question: L'équipe Go recommande de rendre génériques toutes les fonctions qui pourraient servir à plusieurs types.
    truth: false
    answer: On écrit d'abord pour un type concret, et l'on généralise quand un second type en a besoin.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lesquels de ces cas les generics sont-ils un bon choix ?"
    choices:
      - text: Une pile ou un ensemble typé
        correct: true
      - text: Une fonction de filtre sur un slice de n'importe quel type
        correct: true
      - text: Un service qui appelle une méthode `Envoyer` sur ses dépendances
        correct: false
      - text: Une fonction qui ne sert qu'aux commandes
        correct: false
    answer: Quand on appelle des méthodes, une interface suffit ; pour un seul type, rien n'est à généraliser.
  - key: qcm-stdlib
    format: multiple-choice
    question: "Lesquels de ces éléments de la bibliothèque standard sont génériques ?"
    choices:
      - text: '`slices.Contains`'
        correct: true
      - text: '`atomic.Pointer[T]`'
        correct: true
      - text: '`fmt.Println`'
        correct: false
      - text: '`sort.Ints`'
        correct: false
    answer: '`fmt.Println` prend des `any`, et `sort.Ints` est antérieur aux generics.'
  - key: qcm-alternatives
    format: multiple-choice
    question: Que gagne `func Max[T cmp.Ordered](a, b T) T` par rapport à `func Max(a, b any) any` ?
    choices:
      - {text: "La vérification des types à la compilation, sans assertion chez l'appelant", correct: true}
      - {text: "La possibilité de comparer des slices et des maps avec l'opérateur `>`", correct: false}
      - {text: "Un code plus court en toutes circonstances, sans aucune contrepartie", correct: false}
      - {text: "Un appel par réflexion, plus rapide qu'un appel par une interface", correct: false}
    answer: "Les types sont vérifiés à la compilation et l'appelant récupère un `T`, sans assertion. Avec `any`, il faudrait des assertions, et `>` ne compilerait même pas."
  - key: qcm-versions
    format: multiple-choice
    question: "Laquelle de ces évolutions des generics est arrivée après Go 1.18 ?"
    choices:
      - {text: "Les alias génériques (Go 1.24)", correct: true}
      - {text: "La spécialisation par type", correct: false}
      - {text: "La covariance des slices", correct: false}
      - {text: "Les méthodes génériques d'interface", correct: false}
    answer: "Les alias génériques (Go 1.24), puis les méthodes génériques des types concrets (Go 1.27). La spécialisation, la covariance et les méthodes génériques d'interface n'existent toujours pas."
  - key: scenario-quand
    format: scenario
    question: Un collègue hésite à écrire une fonction générique pour dédoublonner des slices. Comment l'aides-tu à décider ?
    choices:
      - {text: "Générique si plusieurs types en ont besoin, après avoir vérifié le package `slices`", correct: true}
      - {text: "Générique d'office : toute fonction qui travaille sur des slices doit l'être", correct: false}
      - {text: "Concrète d'office : les generics sont à réserver aux bibliothèques publiques", correct: false}
      - {text: "Générique sur `any`, avec `reflect.DeepEqual` pour comparer les éléments", correct: false}
    answer: "Je regarde combien de types en ont besoin : pour un seul, une fonction concrète suffit ; pour plusieurs, `Dedoublonner[T comparable](xs []T) []T` ne dépend que de l'égalité et se teste une fois. Je vérifie aussi que la bibliothèque standard ne le fait pas déjà (`slices.Compact` après un tri)."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi Go a mis si longtemps à avoir des generics. Que réponds-tu ?
    choices:
      - {text: "L'équipe voulait garder la simplicité, des compilations rapides et des binaires légers", correct: true}
      - {text: "Le ramasse-miettes devait d'abord être réécrit pour gérer les types génériques", correct: false}
      - {text: "La compatibilité Go 1 interdisait d'ajouter le moindre mot-clé avant Go 1.18", correct: false}
      - {text: "Le compilateur, écrit en C jusqu'en 2015, ne pouvait pas gérer les paramètres de type", correct: false}
    answer: "L'équipe voulait une conception qui garde la simplicité du langage, des compilations rapides et des binaires de taille raisonnable ; plusieurs propositions ont été rejetées. La version retenue (Go 1.18) s'appuie sur les interfaces comme contraintes, sans spécialisation ni métaprogrammation."
  - key: scenario-migration
    format: scenario
    question: Une base de code a des fonctions `ContientInt`, `ContientString`, `ContientID`. Que proposes-tu ?
    choices:
      - {text: "Les remplacer par `slices.Contains`, générique et déjà testée", correct: true}
      - {text: "Les fusionner en `Contient(xs []any, v any) bool`, avec `==`", correct: false}
      - {text: "Écrire notre propre `Contient[T any]` dans un package `utils`", correct: false}
      - {text: "Les garder : chaque type a besoin de sa propre fonction", correct: false}
    answer: "Les remplacer par `slices.Contains`, générique et déjà testée, et supprimer les trois fonctions. Plus largement, je cherche les helpers dupliqués par type qui ont un équivalent dans `slices`, `maps` ou `cmp` ; `go fix` propose aussi certaines de ces modernisations."
  - key: scenario-equipe
    format: scenario
    question: Quelles règles proposes-tu à une équipe pour l'usage des generics ?
    choices:
      - {text: "D'abord `slices`, `maps` et `cmp` ; du générique dès deux types, à la contrainte la plus faible", correct: true}
      - {text: "Des generics partout où c'est possible, avec les contraintes les plus fortes pour tout vérifier", correct: false}
      - {text: "Aucun generic, ni dans le code métier ni ailleurs, pour garder le code simple à lire", correct: false}
      - {text: "Des noms de paramètres de type longs et explicites, comme `ElementType` ou `KeyType`", correct: false}
    answer: "Utiliser d'abord `slices`, `maps` et `cmp` ; écrire du code générique pour les structures et algorithmes qui servent au moins deux types, avec la contrainte la plus faible ; préférer une interface quand le code appelle des méthodes ; ne pas rendre générique une couche métier entière, et garder des noms courts (`T`, `K`, `V`)."
