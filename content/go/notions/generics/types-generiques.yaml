notion: types-generiques
lesson: "Un **type générique** déclare des paramètres de type, que ses méthodes réutilisent :\n\n```go\ntype Pile[T any] struct {\n\telements []T\n}\n\nfunc (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }\n\nfunc (p *Pile[T]) Depiler() (T, bool) {\n\tvar zero T\n\tif len(p.elements) == 0 {\n\t\treturn zero, false\n\t}\n\tv := p.elements[len(p.elements)-1]\n\tp.elements = p.elements[:len(p.elements)-1]\n\treturn v, true\n}\n\nvar p Pile[string] // instanciation : le type est Pile[string]\np.Empiler(\"a\")\n```\n\n- Le type s'**instancie** avec ses arguments : `Pile[int]`, `Cache[string, *Client]`. Il n'y a pas d'inférence pour un\n  type : `var p Pile` ne compile pas.\n- Les méthodes répètent les paramètres dans le **receveur** (`func (p *Pile[T])`), sans les contraintes.\n- `Pile[int]` et `Pile[string]` sont **deux types différents**.\n- On peut aussi déclarer des types génériques non struct : `type Ensemble[T comparable] map[T]struct{}`,\n  `type Liste[T any] []T`.\n- Exemples standard : `atomic.Pointer[T]`, `sync.OnceValue`, `iter.Seq[V]`, `list.List` n'en est pas un (antérieur).\n\n**Piège classique** : oublier les crochets du receveur (`func (p *Pile) Empiler`). Le compilateur refuse : un type\ngénérique s'écrit toujours avec ses paramètres.\n\n**En entretien** : « type Pile[T any] struct ; les méthodes répètent [T] dans le receveur ; on instancie Pile[int],\nsans inférence ; Pile[int] et Pile[string] sont des types distincts. »"
cards:
  - key: implemente-ensemble-generique
    format: scenario
    question: "Tu implémentes un ensemble générique `Set[T]`. Quelle représentation choisis-tu ?"
    choices:
      - {text: "Une `map[T]struct{}`, avec `T comparable` : la valeur vide ne coûte rien", correct: true}
      - {text: "Une `map[T]bool`, avec `T any` : la valeur `true` marque la présence", correct: false}
      - {text: "Une `[]T`, avec `T any` : on parcourt la slice pour tester l'appartenance", correct: false}
      - {text: "Une `map[T]T`, avec `T comparable` : la valeur répète la clé pour la relire", correct: false}
    answer: |-
      ```go
      type Set[T comparable] struct{ m map[T]struct{} }

      func NewSet[T comparable](xs ...T) *Set[T] {
          s := &Set[T]{m: make(map[T]struct{}, len(xs))}
          for _, x := range xs {
              s.Add(x)
          }
          return s
      }
      func (s *Set[T]) Add(v T)      { s.m[v] = struct{}{} }
      func (s *Set[T]) Has(v T) bool { _, ok := s.m[v]; return ok }
      func (s *Set[T]) Len() int     { return len(s.m) }
      func (s *Set[T]) Remove(v T)   { delete(s.m, v) }
      ```
      La struct vide comme valeur ne coûte rien, et la clé d'une map impose `comparable` (`any` ne compilerait pas). Le constructeur initialise la map, sinon `Add` paniquerait sur une map `nil`. Ce type n'est pas sûr entre goroutines : je le documenterais.
  - key: receveur
    format: course
    question: "Comment s'écrit le receveur d'une méthode du type générique `Pile[T any]` ?"
    choices:
      - {text: "`func (p *Pile[T]) Empiler(v T)`", correct: true}
      - {text: "`func (p *Pile[T any]) Empiler(v T)`", correct: false}
      - {text: "`func (p *Pile) Empiler(v T)`", correct: false}
      - {text: "`func [T any](p *Pile[T]) Empiler(v T)`", correct: false}
    answer: "Avec les paramètres de type, sans les contraintes : `func (p *Pile[T]) Empiler(v T)`. Sans `[T]`, le type n'est pas instancié ; avec `any`, la contrainte serait répétée à tort."
  - key: instancier
    format: course
    question: Peut-on déclarer `var p Pile` pour un type `Pile[T any]` ?
    choices:
      - {text: "Non : il faut l'instancier, comme `Pile[int]` ; un type ne s'infère pas", correct: true}
      - {text: "Oui : `T` vaut alors `any`, et la pile accepte tous les types", correct: false}
      - {text: "Oui : `T` sera inféré au premier appel de la méthode `Empiler`", correct: false}
      - {text: "Non, sauf si `Pile` a un constructeur `NewPile` qui l'initialise", correct: false}
    answer: "Non : un type générique doit être instancié avec ses arguments (`Pile[int]`) ; il n'y a pas d'inférence pour les types, ni de valeur par défaut `any`."
  - key: types-distincts
    format: course
    question: '`Pile[int]` et `Pile[string]` sont-ils le même type ?'
    choices:
      - {text: "Non : chaque instanciation est un type distinct, sans affectation possible", correct: true}
      - {text: "Oui : ce sont deux vues d'un même type générique, `Pile`", correct: false}
      - {text: "Oui à l'exécution, où les types sont effacés ; non à la compilation", correct: false}
      - {text: "Non, mais on convertit l'un en l'autre avec `Pile[int](b)`", correct: false}
    answer: "Non : chaque instanciation est un type distinct ; on ne peut ni affecter ni convertir l'un en l'autre. Les types ne sont pas effacés à l'exécution."
  - key: vf-non-struct
    format: true-false
    question: '`type Ensemble[T comparable] map[T]struct{}` est un type générique valide.'
    truth: true
    answer: Un type générique n'est pas forcément une struct.
  - key: vf-contrainte-receveur
    format: true-false
    question: Le receveur d'une méthode doit répéter la contrainte, comme `func (p *Pile[T any])`.
    truth: false
    answer: 'Seulement le nom du paramètre : `func (p *Pile[T])`.'
  - key: vf-zero
    format: true-false
    question: La valeur zéro d'un `Pile[int]` déclaré par `var p Pile[int]` est utilisable si ses méthodes gèrent un slice nil.
    truth: true
    answer: Comme pour un type non générique.
  - key: vf-atomic
    format: true-false
    question: '`atomic.Pointer[T]` est un type générique de la bibliothèque standard.'
    truth: true
    answer: Il stocke un `*T` de façon atomique et typée.
  - key: qcm-declarations
    format: multiple-choice
    question: "Laquelle de ces déclarations de type générique compile ?"
    choices:
      - {text: "`type Paire[K comparable, V any] struct { Cle K; Valeur V }`", correct: true}
      - {text: "`type Paire<K, V> struct { Cle K; Valeur V }`", correct: false}
      - {text: "`type Paire[K, V] struct { Cle K; Valeur V }`", correct: false}
      - {text: "`type Paire(K comparable, V any) struct { Cle K; Valeur V }`", correct: false}
    answer: "Crochets et contrainte sont obligatoires à la déclaration. `type Liste[T any] []T` compile aussi : un type générique n'est pas forcément une struct."
  - key: qcm-utiliser
    format: multiple-choice
    question: "Avec `type Pile[T any] struct{...}`, laquelle de ces déclarations ne compile pas ?"
    choices:
      - {text: "`var p Pile`", correct: true}
      - {text: "`var p Pile[int]`", correct: false}
      - {text: "`p := &Pile[int]{}`", correct: false}
      - {text: "`p := Pile[string]{}`", correct: false}
    answer: "Un type générique s'écrit avec son argument entre crochets : `var p Pile` est refusé. Les trois autres déclarent bien une pile."
  - key: qcm-methodes
    format: multiple-choice
    question: "Laquelle de ces méthodes est correctement déclarée pour `type Cache[K comparable, V any] struct{...}` ?"
    choices:
      - {text: "`func (c *Cache[K, V]) Get(k K) (V, bool)`", correct: true}
      - {text: "`func (c *Cache) Get(k K) (V, bool)`", correct: false}
      - {text: "`func (c *Cache[K comparable, V any]) Get(k K) (V, bool)`", correct: false}
      - {text: "`func (c *Cache[K]) Get(k K) (V, bool)`", correct: false}
    answer: "Le receveur nomme tous les paramètres de type, sans leurs contraintes : `Cache[K, V]`."
  - key: qcm-distincts
    format: multiple-choice
    question: "Avec `a := Pile[int]{}` et `b := Pile[string]{}`, que fait `a = b` ?"
    choices:
      - {text: "Ça ne compile pas : ce sont deux types différents", correct: true}
      - {text: "Ça copie `b` dans `a`, les deux étant des `Pile`", correct: false}
      - {text: "Ça compile, mais panique à l'exécution", correct: false}
      - {text: "Ça convertit les chaînes de `b` en entiers", correct: false}
    answer: "Chaque instanciation crée un type distinct : `Pile[int]` et `Pile[string]` ne s'affectent pas l'un à l'autre."
  - key: trous-type
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      type Pile[T ___] struct {
      	elements []T
      }
      ```
    blanks:
      - - any
    answer: Une pile accepte des éléments de tout type.
  - key: trous-receveur
    format: fill-in
    question: |-
      Complète le receveur :
      ```go
      func (p *Pile___) Empiler(v T) { p.elements = append(p.elements, v) }
      ```
    blanks:
      - - '[T]'
    answer: Le receveur répète les paramètres de type.
  - key: trous-instancier
    format: fill-in
    question: |-
      Complète l'instanciation :
      ```go
      var historique Pile___
      historique.Empiler("ouvrir")
      ```
    blanks:
      - - '[string]'
    answer: On choisit le type des éléments.
  - key: trous-ensemble
    format: fill-in
    question: |-
      Complète l'ensemble générique :
      ```go
      type Ensemble[T comparable] ___[T]struct{}
      ```
    blanks:
      - - map
    answer: Un type générique peut être une map.
  - key: code-pile
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Pile[T any] struct{ elements []T }

      func (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }

      func (p *Pile[T]) Depiler() (T, bool) {
      	var zero T
      	if len(p.elements) == 0 {
      		return zero, false
      	}
      	v := p.elements[len(p.elements)-1]
      	p.elements = p.elements[:len(p.elements)-1]
      	return v, true
      }

      var p Pile[string]
      p.Empiler("a")
      p.Empiler("b")
      v1, _ := p.Depiler()
      v2, _ := p.Depiler()
      _, ok := p.Depiler()
      fmt.Println(v1, v2, ok)
      ```
    choices:
      - {text: "`b a false`", correct: true}
      - {text: "`a b false`", correct: false}
      - {text: "`b a true`", correct: false}
      - {text: "`b b false`", correct: false}
    answer: "`b a false` : dernier entré, premier sorti, puis la pile est vide et `Depiler` renvoie `false`."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Pile[T any] struct{ elements []T }\n\n\nfunc (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }\n\n\nfunc (p *Pile[T]) Depiler() (T, bool) {\n\tvar zero T\n\tif len(p.elements) == 0 {\n\t\treturn zero, false\n\t}\n\tv := p.elements[len(p.elements)-1]\n\tp.elements = p.elements[:len(p.elements)-1]\n\treturn v, true\n}\n\nfunc main() {\n\tvar p Pile[string]\n\tp.Empiler(\"a\")\n\tp.Empiler(\"b\")\n\tv1, _ := p.Depiler()\n\tv2, _ := p.Depiler()\n\t_, ok := p.Depiler()\n\tfmt.Println(v1, v2, ok)\n}\n"
      output: b a false
  - key: code-paire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Paire[K comparable, V any] struct {
      	Cle    K
      	Valeur V
      }

      p := Paire[string, int]{"age", 36}
      q := Paire[int, []string]{1, []string{"go"}}
      fmt.Printf("%v %v %T\n", p, q, p)
      ```
    choices:
      - {text: "`{age 36} {1 [go]} main.Paire[string,int]`", correct: true}
      - {text: "`{age 36} {1 [go]} main.Paire`", correct: false}
      - {text: "`{age 36} {1 [go]} main.Paire[K,V]`", correct: false}
      - {text: "`{Cle:age Valeur:36} {Cle:1 Valeur:[go]} main.Paire[string,int]`", correct: false}
    answer: "`{age 36} {1 [go]} main.Paire[string,int]` : le nom du type inclut ses arguments ; `%v` n'affiche pas les noms des champs (c'est `%+v`)."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Paire[K comparable, V any] struct {\n\tCle    K\n\tValeur V\n}\n\nfunc main() {\n\tp := Paire[string, int]{\"age\", 36}\n\tq := Paire[int, []string]{1, []string{\"go\"}}\n\tfmt.Printf(\"%v %v %T\\n\", p, q, p)\n}\n"
      output: '{age 36} {1 [go]} main.Paire[string,int]'
  - key: code-ensemble
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Ensemble[T comparable] map[T]struct{}

      func (e Ensemble[T]) Ajouter(v T) { e[v] = struct{}{} }

      e := Ensemble[int]{}
      for _, n := range []int{3, 1, 3, 2, 1} {
      	e.Ajouter(n)
      }
      fmt.Println(len(e))
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`3` : la map ne garde chaque valeur qu'une fois (1, 2 et 3). Le receveur valeur suffit, une map étant une référence."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Ensemble[T comparable] map[T]struct{}\n\n\nfunc (e Ensemble[T]) Ajouter(v T) { e[v] = struct{}{} }\n\nfunc main() {\n\te := Ensemble[int]{}\n\tfor _, n := range []int{3, 1, 3, 2, 1} {\n\t\te.Ajouter(n)\n\t}\n\tfmt.Println(len(e))\n}\n"
      output: '3'
  - key: code-sans-instance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Pile[T any] struct{ elements []T }

      var p Pile
      fmt.Println(p)
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`{[]}`", correct: false}
      - {text: "`{}`", correct: false}
      - {text: "`<nil>`", correct: false}
    answer: "Le code ne compile pas : « cannot use generic type Pile[T any] without instantiation ». Il faut écrire `var p Pile[int]`, par exemple."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Pile[T any] struct{ elements []T }\n\nfunc main() {\n\tvar p Pile\n\tfmt.Println(p)\n}\n"
      compiles: false
  - key: bug-receveur
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use generic type Pile[T any] without instantiation ». Quelle correction est la bonne ?
      ```go
      func (p *Pile) Taille() int { return len(p.elements) }
      ```
    choices:
      - {text: "Répéter le paramètre de type : `func (p *Pile[T]) Taille() int`", correct: true}
      - {text: "Répéter la contrainte : `func (p *Pile[T any]) Taille() int`", correct: false}
      - {text: "Fixer l'argument de type : `func (p *Pile[any]) Taille() int`", correct: false}
      - {text: "Rendre la méthode générique : `func (p *Pile) Taille[T any]() int`", correct: false}
    answer: |-
      ```go
      func (p *Pile[T]) Taille() int { return len(p.elements) }
      ```
      Le receveur d'une méthode d'un type générique répète ses paramètres de type.
  - key: bug-any
    format: bug-fix
    question: |-
      En revue, comment rendre ce cache typé, sans assertion chez l'appelant ?
      ```go
      type Cache struct {
      	entrees map[string]any
      }

      func (c *Cache) Get(k string) any { return c.entrees[k] }

      profil := cache.Get(id).(*Profil)
      ```
    choices:
      - {text: "Un `type Cache[V any]`, avec `Get(k string) (V, bool)`", correct: true}
      - {text: "Garder `any` et ajouter `GetProfil(k string) *Profil` par type", correct: false}
      - {text: "Un `type Cache[V *Profil]`, contraint par le seul type stocké", correct: false}
      - {text: "Garder `any` et documenter le type attendu en commentaire", correct: false}
    answer: "```go\ntype Cache[V any] struct {\n\tentrees map[string]V\n}\n\nfunc (c *Cache[V]) Get(k string) (V, bool) {\n\tv, ok := c.entrees[k]\n\treturn v, ok\n}\n\nvar cache Cache[*Profil]\nprofil, ok := cache.Get(id)\n```\nLe paramètre de type supprime les assertions, et une erreur de type devient une erreur de compilation."
  - key: bug-melange
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use b (variable of type Pile[string]) as Pile[int] value ». Quelle correction est la bonne ?
      ```go
      var a Pile[int]
      b := Pile[string]{}
      a = b
      ```
    choices:
      - {text: "Donner aux deux piles le même argument de type, ou une interface commune", correct: true}
      - {text: "Convertir la pile à l'affectation : `a = Pile[int](b)`", correct: false}
      - {text: "Déclarer `a` en `Pile[any]`, qui accepte toutes les piles", correct: false}
      - {text: "Déclarer `a` en `Pile`, sans argument de type, pour tout accepter", correct: false}
    answer: |-
      ```go
      var a Pile[int]
      var b Pile[int]
      a = b
      ```
      Chaque instanciation est un type distinct ; si l'on a besoin de mélanger, c'est que les éléments devraient être
      d'un même type (ou d'une interface commune).
  - key: bug-zero
    format: bug-fix
    question: |-
      La méthode panique quand la pile est vide. Quelle correction est la bonne ?
      ```go
      func (p *Pile[T]) Sommet() T {
      	return p.elements[len(p.elements)-1]
      }
      ```
    choices:
      - {text: "Renvoyer `(T, bool)` : `var zero T` et `false` si la pile est vide", correct: true}
      - {text: "Renvoyer `nil` si la pile est vide, avant de lire le dernier élément", correct: false}
      - {text: "Lire `p.elements[0]` plutôt que le dernier élément de la slice", correct: false}
      - {text: "Rattraper la panic avec `recover` dans un `defer` de `Sommet`", correct: false}
    answer: "```go\nfunc (p *Pile[T]) Sommet() (T, bool) {\n\tif len(p.elements) == 0 {\n\t\tvar zero T\n\t\treturn zero, false\n\t}\n\treturn p.elements[len(p.elements)-1], true\n}\n```\nL'indice -1 paniquait ; la forme `(T, bool)` signale la pile vide."
  - key: scenario-cache
    format: scenario
    question: Conçois un cache en mémoire générique, sûr entre goroutines. Quelle API proposes-tu ?
    choices:
      - {text: "`Cache[K comparable, V any]` avec un mutex, et `Get`, `Set`, `Delete` sur receveur pointeur", correct: true}
      - {text: "`Cache[K any, V any]` sans mutex, les maps Go étant sûres entre goroutines", correct: false}
      - {text: "Un `Cache` non générique sur `map[string]any`, avec des assertions à la lecture", correct: false}
      - {text: "`Cache[K comparable, V any]` sur receveur valeur, le mutex étant copié à chaque appel", correct: false}
    answer: "`type Cache[K comparable, V any] struct { mu sync.Mutex; entrees map[K]V }`, avec `Get`, `Set` et `Delete` sur receveur pointeur, protégés par le mutex. `comparable` vient de la map ; un receveur valeur copierait le mutex, et une map n'est pas sûre entre goroutines."
  - key: scenario-liste
    format: scenario
    question: Pourquoi `container/list` n'est-il pas générique, et que fais-tu aujourd'hui ?
    choices:
      - {text: "Il date d'avant Go 1.18 ; j'utilise surtout une slice, ou un petit type générique", correct: true}
      - {text: "Une liste chaînée ne peut pas être générique ; je stocke donc des `[]any`", correct: false}
      - {text: "Il l'est depuis Go 1.21 : `list.List[T]` a remplacé l'ancienne version", correct: false}
      - {text: "Il le deviendra avec Go 2 ; en attendant, j'écris des assertions partout", correct: false}
    answer: "Il date d'avant Go 1.18 et stocke des `any` ; le changer casserait la compatibilité Go 1. Un slice suffit dans la plupart des cas, avec de meilleures performances ; pour un vrai besoin (un LRU), un petit type générique `Noeud[T]` ou une bibliothèque maintenue."
  - key: scenario-ensemble
    format: scenario
    question: "Quelle API donnes-tu à un ensemble générique `type Ensemble[T comparable] map[T]struct{}` ?"
    choices:
      - {text: "`Ajouter`, `Contient`, `Retirer`, `Len`, et `Union` ou `Intersection` qui créent un ensemble", correct: true}
      - {text: "`Get(i int) T` et `Set(i int, v T)`, pour lire et écrire par indice comme une slice", correct: false}
      - {text: "`Ajouter` et `Contient` seulement, l'ensemble triant ses éléments à chaque insertion", correct: false}
      - {text: "`Push` et `Pop`, qui ajoutent et retirent le dernier élément inséré dans l'ensemble", correct: false}
    answer: "`Ajouter(v T)`, `Contient(v T) bool`, `Retirer(v T)` et `Len() int`, plus `Union` et `Intersection` qui renvoient un nouvel ensemble, et `NouvelEnsemble[T comparable](vs ...T)` pour créer et remplir. Une map n'a ni ordre ni indice."
  - key: scenario-arbre
    format: scenario
    question: Comment écris-tu un arbre binaire de recherche générique ?
    choices:
      - {text: "`Arbre[T cmp.Ordered]` et ses `noeud[T]`, ou une fonction de comparaison avec `any`", correct: true}
      - {text: "`Arbre[T comparable]`, puisque `==` suffit pour placer les valeurs dans l'arbre", correct: false}
      - {text: "`Arbre` sur `any`, avec `reflect` pour comparer les valeurs à l'exécution", correct: false}
      - {text: "`Arbre[T any]`, en utilisant `<` directement sur les valeurs de type `T`", correct: false}
    answer: "`type Arbre[T cmp.Ordered] struct { racine *noeud[T] }` : `cmp.Ordered` permet `<` pour placer les valeurs. Pour des types non ordonnés, une variante `any` reçoit une fonction `func(a, b T) int` au constructeur. `comparable` ne permet pas `<`."
  - key: non-struct
    format: course
    question: Un type générique est-il forcément une struct ?
    choices:
      - {text: "Non : `type Liste[T any] []T` ou une map générique, méthodes comprises", correct: true}
      - {text: "Oui : seules les structs peuvent avoir des paramètres de type", correct: false}
      - {text: "Non, mais seules les structs génériques peuvent avoir des méthodes", correct: false}
      - {text: "Oui, à part les interfaces, qui peuvent aussi être génériques", correct: false}
    answer: "Non : `type Liste[T any] []T` ou `type Ensemble[T comparable] map[T]struct{}` sont aussi des types génériques, qui peuvent avoir des méthodes."
