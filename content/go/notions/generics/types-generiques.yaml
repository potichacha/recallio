notion: types-generiques
lesson: "Un **type générique** déclare des paramètres de type, que ses méthodes réutilisent :\n\n```go\ntype Pile[T any] struct {\n\telements []T\n}\n\nfunc (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }\n\nfunc (p *Pile[T]) Depiler() (T, bool) {\n\tvar zero T\n\tif len(p.elements) == 0 {\n\t\treturn zero, false\n\t}\n\tv := p.elements[len(p.elements)-1]\n\tp.elements = p.elements[:len(p.elements)-1]\n\treturn v, true\n}\n\nvar p Pile[string] // instanciation : le type est Pile[string]\np.Empiler(\"a\")\n```\n\n- Le type s'**instancie** avec ses arguments : `Pile[int]`, `Cache[string, *Client]`. Il n'y a pas d'inférence pour un\n  type : `var p Pile` ne compile pas.\n- Les méthodes répètent les paramètres dans le **receveur** (`func (p *Pile[T])`), sans les contraintes.\n- `Pile[int]` et `Pile[string]` sont **deux types différents**.\n- On peut aussi déclarer des types génériques non struct : `type Ensemble[T comparable] map[T]struct{}`,\n  `type Liste[T any] []T`.\n- Exemples standard : `atomic.Pointer[T]`, `sync.OnceValue`, `iter.Seq[V]`, `list.List` n'en est pas un (antérieur).\n\n**Piège classique** : oublier les crochets du receveur (`func (p *Pile) Empiler`). Le compilateur refuse : un type\ngénérique s'écrit toujours avec ses paramètres.\n\n**En entretien** : « type Pile[T any] struct ; les méthodes répètent [T] dans le receveur ; on instancie Pile[int],\nsans inférence ; Pile[int] et Pile[string] sont des types distincts. »"
cards:
  - key: implemente-ensemble-generique
    format: scenario
    question: Implémente un ensemble générique.
    answer: |-
      ```go
      type Set[T comparable] struct{ m map[T]struct{} }

      func NewSet[T comparable](xs ...T) *Set[T] {
          s := &Set[T]{m: make(map[T]struct{}, len(xs))}
          for _, x := range xs {
              s.Add(x)
          }
          return s
      }
      func (s *Set[T]) Add(v T)      { s.m[v] = struct{}{} }
      func (s *Set[T]) Has(v T) bool { _, ok := s.m[v]; return ok }
      func (s *Set[T]) Len() int     { return len(s.m) }
      func (s *Set[T]) Remove(v T)   { delete(s.m, v) }
      ```
      "La struct vide comme valeur ne coûte rien. Le constructeur initialise la map, sinon `Add` paniquerait sur une map nil. Pour une version utilisable sans constructeur (valeur zéro utile), `Add` initialiserait la map paresseusement. Je pourrais ajouter un itérateur `All() iter.Seq[T]` pour la parcourir avec `range`. Et ce type n'est pas thread-safe : je le documenterais."
  - key: receveur
    format: course
    question: Comment s'écrit le receveur d'une méthode d'un type générique ?
    answer: 'Avec les paramètres de type, sans les contraintes : `func (p *Pile[T]) Empiler(v T)`.'
  - key: instancier
    format: course
    question: Peut-on déclarer `var p Pile` pour un type `Pile[T any]` ?
    answer: 'Non : un type générique doit être instancié avec ses arguments (`Pile[int]`) ; il n''y a pas d''inférence pour les types.'
  - key: types-distincts
    format: course
    question: '`Pile[int]` et `Pile[string]` sont-ils le même type ?'
    answer: 'Non : chaque instanciation est un type distinct ; on ne peut pas affecter l''un à l''autre.'
  - key: vf-non-struct
    format: true-false
    question: '`type Ensemble[T comparable] map[T]struct{}` est un type générique valide.'
    truth: true
    answer: Un type générique n'est pas forcément une struct.
  - key: vf-contrainte-receveur
    format: true-false
    question: Le receveur d'une méthode doit répéter la contrainte, comme `func (p *Pile[T any])`.
    truth: false
    answer: 'Seulement le nom du paramètre : `func (p *Pile[T])`.'
  - key: vf-zero
    format: true-false
    question: La valeur zéro d'un `Pile[int]` déclaré par `var p Pile[int]` est utilisable si ses méthodes gèrent un slice nil.
    truth: true
    answer: Comme pour un type non générique.
  - key: vf-atomic
    format: true-false
    question: '`atomic.Pointer[T]` est un type générique de la bibliothèque standard.'
    truth: true
    answer: Il stocke un `*T` de façon atomique et typée.
  - key: qcm-declarations
    format: multiple-choice
    question: Lesquelles déclarent un type générique valide ?
    choices:
      - text: '`type Paire[K comparable, V any] struct { Cle K; Valeur V }`'
        correct: true
      - text: '`type Liste[T any] []T`'
        correct: true
      - text: '`type Pile<T> struct{ elements []T }`'
        correct: false
      - text: '`type Pile[T] struct{ elements []T }`'
        correct: false
    answer: Crochets et contrainte obligatoires à la déclaration.
  - key: qcm-utiliser
    format: multiple-choice
    question: Comment déclarer une pile d'entiers avec `type Pile[T any] struct{...}` ?
    choices:
      - text: '`var p Pile[int]`'
        correct: true
      - text: '`p := &Pile[int]{}`'
        correct: true
      - text: '`var p Pile`'
        correct: false
      - text: '`p := Pile(int){}`'
        correct: false
    answer: Le type s'écrit avec son argument entre crochets.
  - key: qcm-methodes
    format: multiple-choice
    question: Quelles méthodes sont correctement déclarées pour `type Cache[K comparable, V any] struct{...}` ?
    choices:
      - text: '`func (c *Cache[K, V]) Get(k K) (V, bool)`'
        correct: true
      - text: '`func (c *Cache[K, V]) Set(k K, v V)`'
        correct: true
      - text: '`func (c *Cache) Get(k K) (V, bool)`'
        correct: false
      - text: '`func (c *Cache[K comparable, V any]) Get(k K) (V, bool)`'
        correct: false
    answer: Le receveur nomme les paramètres sans leurs contraintes.
  - key: qcm-distincts
    format: multiple-choice
    question: Avec `a := Pile[int]{}` et `b := Pile[string]{}`, qu'est-ce qui est vrai ?
    choices:
      - text: '`a` et `b` ont deux types différents'
        correct: true
      - text: '`a = b` ne compile pas'
        correct: true
      - text: '`a == b` compare leurs éléments'
        correct: false
      - text: Les deux sont des `Pile[any]`
        correct: false
    answer: Chaque instanciation crée un type distinct.
  - key: trous-type
    format: fill-in
    question: "Complétez la déclaration :\n```go\ntype Pile[T ___] struct {\n\telements []T\n}\n```"
    blanks:
      - - any
    answer: Une pile accepte des éléments de tout type.
  - key: trous-receveur
    format: fill-in
    question: |-
      Complétez le receveur :
      ```go
      func (p *Pile___) Empiler(v T) { p.elements = append(p.elements, v) }
      ```
    blanks:
      - - '[T]'
    answer: Le receveur répète les paramètres de type.
  - key: trous-instancier
    format: fill-in
    question: |-
      Complétez l'instanciation :
      ```go
      var historique Pile___
      historique.Empiler("ouvrir")
      ```
    blanks:
      - - '[string]'
    answer: On choisit le type des éléments.
  - key: trous-ensemble
    format: fill-in
    question: |-
      Complétez l'ensemble générique :
      ```go
      type Ensemble[T comparable] ___[T]struct{}
      ```
    blanks:
      - - map
    answer: Un type générique peut être une map.
  - key: code-pile
    format: code-output
    question: "```go\ntype Pile[T any] struct{ elements []T }\n\nfunc (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }\n\nfunc (p *Pile[T]) Depiler() (T, bool) {\n\tvar zero T\n\tif len(p.elements) == 0 {\n\t\treturn zero, false\n\t}\n\tv := p.elements[len(p.elements)-1]\n\tp.elements = p.elements[:len(p.elements)-1]\n\treturn v, true\n}\n\nvar p Pile[string]\np.Empiler(\"a\")\np.Empiler(\"b\")\nv1, _ := p.Depiler()\nv2, _ := p.Depiler()\n_, ok := p.Depiler()\nfmt.Println(v1, v2, ok)\n```"
    answer: '`b a false` : dernier entré, premier sorti, puis la pile est vide.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Pile[T any] struct{ elements []T }\n\n\nfunc (p *Pile[T]) Empiler(v T) { p.elements = append(p.elements, v) }\n\n\nfunc (p *Pile[T]) Depiler() (T, bool) {\n\tvar zero T\n\tif len(p.elements) == 0 {\n\t\treturn zero, false\n\t}\n\tv := p.elements[len(p.elements)-1]\n\tp.elements = p.elements[:len(p.elements)-1]\n\treturn v, true\n}\n\nfunc main() {\n\tvar p Pile[string]\n\tp.Empiler(\"a\")\n\tp.Empiler(\"b\")\n\tv1, _ := p.Depiler()\n\tv2, _ := p.Depiler()\n\t_, ok := p.Depiler()\n\tfmt.Println(v1, v2, ok)\n}\n"
      output: b a false
  - key: code-paire
    format: code-output
    question: "```go\ntype Paire[K comparable, V any] struct {\n\tCle    K\n\tValeur V\n}\n\np := Paire[string, int]{\"age\", 36}\nq := Paire[int, []string]{1, []string{\"go\"}}\nfmt.Printf(\"%v %v %T\\n\", p, q, p)\n```"
    answer: '`{age 36} {1 [go]} main.Paire[string,int]` : le nom du type inclut ses arguments.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Paire[K comparable, V any] struct {\n\tCle    K\n\tValeur V\n}\n\nfunc main() {\n\tp := Paire[string, int]{\"age\", 36}\n\tq := Paire[int, []string]{1, []string{\"go\"}}\n\tfmt.Printf(\"%v %v %T\\n\", p, q, p)\n}\n"
      output: '{age 36} {1 [go]} main.Paire[string,int]'
  - key: code-ensemble
    format: code-output
    question: "```go\ntype Ensemble[T comparable] map[T]struct{}\n\nfunc (e Ensemble[T]) Ajouter(v T) { e[v] = struct{}{} }\n\ne := Ensemble[int]{}\nfor _, n := range []int{3, 1, 3, 2, 1} {\n\te.Ajouter(n)\n}\nfmt.Println(len(e))\n```"
    answer: '`3` : chaque valeur n''est gardée qu''une fois.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Ensemble[T comparable] map[T]struct{}\n\n\nfunc (e Ensemble[T]) Ajouter(v T) { e[v] = struct{}{} }\n\nfunc main() {\n\te := Ensemble[int]{}\n\tfor _, n := range []int{3, 1, 3, 2, 1} {\n\t\te.Ajouter(n)\n\t}\n\tfmt.Println(len(e))\n}\n"
      output: '3'
  - key: code-sans-instance
    format: code-output
    question: |-
      ```go
      type Pile[T any] struct{ elements []T }

      var p Pile
      fmt.Println(p)
      ```
    answer: 'Rien : le code ne compile pas, « cannot use generic type Pile[T any] without instantiation ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Pile[T any] struct{ elements []T }\n\nfunc main() {\n\tvar p Pile\n\tfmt.Println(p)\n}\n"
      compiles: false
  - key: bug-receveur
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use generic type Pile[T any] without instantiation » :
      ```go
      func (p *Pile) Taille() int { return len(p.elements) }
      ```
    answer: |-
      ```go
      func (p *Pile[T]) Taille() int { return len(p.elements) }
      ```
      Le receveur d'une méthode d'un type générique répète ses paramètres de type.
  - key: bug-any
    format: bug-fix
    question: "En revue, rendez ce cache typé :\n```go\ntype Cache struct {\n\tentrees map[string]any\n}\n\nfunc (c *Cache) Get(k string) any { return c.entrees[k] }\n\nprofil := cache.Get(id).(*Profil)\n```"
    answer: "```go\ntype Cache[V any] struct {\n\tentrees map[string]V\n}\n\nfunc (c *Cache[V]) Get(k string) (V, bool) {\n\tv, ok := c.entrees[k]\n\treturn v, ok\n}\n\nvar cache Cache[*Profil]\nprofil, ok := cache.Get(id)\n```\nLe paramètre de type supprime les assertions, et une erreur de type devient une erreur de compilation."
  - key: bug-melange
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use b (variable of type Pile[string]) as Pile[int] value » :
      ```go
      var a Pile[int]
      b := Pile[string]{}
      a = b
      ```
    answer: |-
      ```go
      var a Pile[int]
      var b Pile[int]
      a = b
      ```
      Chaque instanciation est un type distinct ; si l'on a besoin de mélanger, c'est que les éléments devraient être
      d'un même type (ou d'une interface commune).
  - key: bug-zero
    format: bug-fix
    question: "La méthode panique quand la pile est vide :\n```go\nfunc (p *Pile[T]) Sommet() T {\n\treturn p.elements[len(p.elements)-1]\n}\n```"
    answer: "```go\nfunc (p *Pile[T]) Sommet() (T, bool) {\n\tif len(p.elements) == 0 {\n\t\tvar zero T\n\t\treturn zero, false\n\t}\n\treturn p.elements[len(p.elements)-1], true\n}\n```\nL'indice -1 paniquait ; la forme `(T, bool)` signale la pile vide."
  - key: scenario-cache
    format: scenario
    question: Conçois un cache en mémoire générique, sûr entre goroutines. Quelle API proposes-tu ?
    answer: |-
      `type Cache[K comparable, V any] struct { mu sync.Mutex; entrees map[K]V }` avec `Get(k K) (V, bool)`,
      `Set(k K, v V)` et `Delete(k K)`, toutes à receveur pointeur et protégées par le mutex. La contrainte `comparable`
      vient de la map. Un constructeur `NewCache[K comparable, V any]()` crée la map (ou une initialisation paresseuse).
      Pour l'expiration, j'ajoute une date par entrée et une méthode de nettoyage.
  - key: scenario-liste
    format: scenario
    question: Pourquoi `container/list` n'est-il pas générique, et que fais-tu aujourd'hui ?
    answer: |-
      Il date d'avant Go 1.18 et stocke des `any` ; le changer casserait la compatibilité Go 1. Aujourd'hui, j'écris
      rarement une liste chaînée : un slice suffit dans la plupart des cas, avec de meilleures performances. Si j'en ai
      vraiment besoin (un LRU), j'écris un petit type générique `Noeud[T]` ou j'utilise une bibliothèque générique
      maintenue.
  - key: scenario-ensemble
    format: scenario
    question: Implémente un ensemble générique et décris son API.
    answer: |-
      `type Ensemble[T comparable] map[T]struct{}`, avec `Ajouter(v T)`, `Contient(v T) bool`, `Retirer(v T)` et
      `Len() int`, plus des fonctions `Union` et `Intersection` qui renvoient un nouvel ensemble. Le type map garde la
      valeur zéro utilisable en lecture ; je fournis `NouvelEnsemble[T comparable](vs ...T)` pour créer et remplir. Pour
      un ordre stable à l'affichage, une méthode `Trie()` qui renvoie les éléments triés (avec `cmp.Ordered`) peut
      servir.
  - key: scenario-arbre
    format: scenario
    question: Comment écris-tu un arbre binaire de recherche générique ?
    answer: |-
      `type Arbre[T cmp.Ordered] struct { racine *noeud[T] }` et `type noeud[T cmp.Ordered] struct { valeur T; gauche,
      droite *noeud[T] }`. La contrainte `cmp.Ordered` permet `<` pour placer les valeurs. Pour des types non ordonnés
      nativement, une variante accepte une fonction de comparaison `func(a, b T) int` au constructeur, avec la contrainte
      `any`. Le parcours s'expose par un itérateur `iter.Seq[T]`.
  - key: non-struct
    format: course
    question: Un type générique est-il forcément une struct ?
    answer: 'Non : `type Liste[T any] []T` ou `type Ensemble[T comparable] map[T]struct{}` sont aussi des types génériques, qui peuvent avoir des méthodes.'
