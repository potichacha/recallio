notion: regexp
lesson: |-
  Le package **`regexp`** implémente la syntaxe **RE2** : une expression est compilée en automate et s'exécute en
  **temps linéaire** dans la taille du texte, quelle que soit l'expression. Pas de « catastrophic backtracking »
  possible, donc pas de déni de service par une regex (ReDoS) ; en contrepartie, **pas de références arrière** (`\1`)
  ni de lookahead (`(?=...)`).

  ```go
  var reCode = regexp.MustCompile(`^([A-Z]{2})-(\d{4})$`) // compilée une fois, au niveau du package

  reCode.MatchString("FR-2026")                  // true
  m := reCode.FindStringSubmatch("FR-2026")      // ["FR-2026" "FR" "2026"]
  regexp.MustCompile(`\d+`).FindAllString("a1b22c333", -1) // [1 22 333]
  regexp.MustCompile(`(\w+)@(\w+)`).ReplaceAllString("ada@go", "$2:$1") // "go:ada"
  ```

  Les bonnes pratiques :
  - **compiler une seule fois** : `regexp.MustCompile` dans une variable du package (elle panique au démarrage si
    l'expression est invalide), ou `regexp.Compile` pour une expression fournie par l'utilisateur, qui renvoie une
    erreur ;
  - écrire les expressions entre **backquotes** pour éviter de doubler les `\` ;
  - un `*regexp.Regexp` est **sûr entre goroutines** ;
  - nommer les groupes avec `(?P<annee>\d{4})` et `SubexpIndex("annee")` ;
  - avant une regex, se demander si `strings` suffit (`HasPrefix`, `Contains`, `Cut`) : c'est plus lisible et bien
    plus rapide.

  **En entretien** : « RE2 en temps linéaire, sans backtracking ni références arrière ; MustCompile une fois au niveau
  du package ; backquotes ; strings d'abord quand c'est suffisant. »
cards:
  - key: regex-ont-elles-references-arriere
    format: course
    question: Pourquoi les regex Go n'ont-elles pas de références arrière ?
    answer: Le moteur RE2 garantit un temps linéaire, sans backtracking.
  - key: compiler-une-fois
    format: course
    question: Pourquoi compiler une expression régulière une seule fois, au niveau du package ?
    answer: La compilation coûte bien plus que l'exécution ; la refaire à chaque appel (dans un handler, une boucle) ralentit beaucoup. Un *regexp.Regexp est sûr entre goroutines et se partage sans risque.
  - key: compile-vs-must
    format: course
    question: Quand utiliser regexp.Compile plutôt que regexp.MustCompile ?
    answer: Compile pour une expression qui vient de l'extérieur (configuration, utilisateur), car il renvoie une erreur ; MustCompile pour une expression écrite dans le code, qui panique au démarrage si elle est invalide.
  - key: lineaire
    format: course
    question: Pourquoi les regex de Go protègent-elles contre le ReDoS ?
    answer: 'RE2 garantit un temps d''exécution linéaire dans la taille du texte, sans retour arrière : une expression comme `(a+)+$` ne peut pas exploser sur une entrée piégée, contrairement aux moteurs à backtracking.'
  - key: vf-backrefs
    format: true-false
    question: Les expressions régulières de Go acceptent les références arrière comme `(\w)\1`.
    truth: false
    answer: RE2 ne les accepte pas, pour garantir le temps linéaire.
  - key: vf-goroutines
    format: true-false
    question: Un même *regexp.Regexp peut être utilisé par plusieurs goroutines en même temps.
    truth: true
    answer: Il est sûr entre goroutines.
  - key: vf-mustcompile
    format: true-false
    question: '`regexp.MustCompile` renvoie une erreur si l''expression est invalide.'
    truth: false
    answer: Il panique ; c'est Compile qui renvoie une erreur.
  - key: vf-backquotes
    format: true-false
    question: Écrire une regex entre backquotes évite de doubler les antislashs.
    truth: true
    answer: Une chaîne brute ne traite pas les échappements.
  - key: qcm-fonctions
    format: multiple-choice
    question: Quelle méthode pour quel besoin ?
    choices:
      - text: '`MatchString` pour savoir si le texte correspond'
        correct: true
      - text: '`FindAllString(s, -1)` pour toutes les correspondances'
        correct: true
      - text: '`FindStringSubmatch` pour les groupes capturés'
        correct: true
      - text: '`ReplaceAllString` pour compter les correspondances'
        correct: false
    answer: ReplaceAllString remplace ; pour compter, len(FindAllString(...)).
  - key: qcm-strings
    format: multiple-choice
    question: Dans quels cas strings suffit-il, sans regex ?
    choices:
      - text: Tester qu'une URL commence par « https:// »
        correct: true
      - text: Séparer « clé=valeur »
        correct: true
      - text: Valider un format comme deux lettres, un tiret et quatre chiffres
        correct: false
      - text: Extraire tous les nombres d'un texte libre
        correct: false
    answer: HasPrefix et Cut sont plus lisibles et plus rapides.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Lesquelles de ces constructions RE2 accepte-t-il ?
    choices:
      - text: Les groupes nommés `(?P<nom>...)`
        correct: true
      - text: Les classes `\d`, `\w`, `\s`
        correct: true
      - text: Le lookahead `(?=...)`
        correct: false
      - text: Les références arrière `\1`
        correct: false
    answer: Les assertions avant et les références arrière demandent du backtracking.
  - key: qcm-utilisateur
    format: multiple-choice
    question: Un administrateur saisit une regex de filtrage dans l'interface. Comment la traiter ?
    choices:
      - text: '`regexp.Compile`, et une erreur claire si elle est invalide'
        correct: true
      - text: Limiter sa longueur
        correct: true
      - text: '`regexp.MustCompile`, pour simplifier'
        correct: false
      - text: La compiler à chaque ligne filtrée
        correct: false
    answer: MustCompile ferait paniquer le service sur une saisie invalide.
  - key: trous-must
    format: fill-in
    question: |-
      Complétez la déclaration au niveau du package :
      ```go
      var reEmail = regexp.___(`^[^@\s]+@[^@\s]+$`)
      ```
    blanks:
      - - MustCompile
    answer: MustCompile, une fois.
  - key: trous-match
    format: fill-in
    question: "Complétez pour tester la correspondance :\n```go\nif !reCode.___(code) {\n\treturn ErrCodeInvalide\n}\n```"
    blanks:
      - - MatchString
    answer: MatchString.
  - key: trous-findall
    format: fill-in
    question: |-
      Complétez pour toutes les correspondances :
      ```go
      nombres := reNombre.FindAllString(texte, ___)
      ```
    blanks:
      - - '-1'
    answer: "-1 signifie sans limite."
  - key: trous-submatch
    format: fill-in
    question: |-
      Complétez pour récupérer les groupes :
      ```go
      m := reDate.___(s) // [complet annee mois jour]
      ```
    blanks:
      - - FindStringSubmatch
    answer: FindStringSubmatch.
  - key: code-findall
    format: code-output
    question: |-
      ```go
      re := regexp.MustCompile(`\d+`)
      fmt.Println(re.FindAllString("a1b22c333", -1), re.FindAllString("a1b22c333", 2))
      ```
    answer: '`[1 22 333] [1 22]` : le second argument limite le nombre de correspondances.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`\\d+`)\n\tfmt.Println(re.FindAllString(\"a1b22c333\", -1), re.FindAllString(\"a1b22c333\", 2))\n}\n"
      output: '[1 22 333] [1 22]'
  - key: code-submatch
    format: code-output
    question: |-
      ```go
      re := regexp.MustCompile(`^([A-Z]{2})-(\d{4})$`)
      m := re.FindStringSubmatch("FR-2026")
      fmt.Println(len(m), m[1], m[2], re.MatchString("fr-2026"))
      ```
    answer: '`3 FR 2026 false` : la correspondance complète puis les deux groupes ; les minuscules ne correspondent pas.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`^([A-Z]{2})-(\\d{4})$`)\n\tm := re.FindStringSubmatch(\"FR-2026\")\n\tfmt.Println(len(m), m[1], m[2], re.MatchString(\"fr-2026\"))\n}\n"
      output: 3 FR 2026 false
  - key: code-replace
    format: code-output
    question: |-
      ```go
      re := regexp.MustCompile(`(\w+)@(\w+)`)
      fmt.Println(re.ReplaceAllString("ada@go et rob@plan9", "$2:$1"))
      ```
    answer: '`go:ada et plan9:rob` : $1 et $2 désignent les groupes capturés.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`(\\w+)@(\\w+)`)\n\tfmt.Println(re.ReplaceAllString(\"ada@go et rob@plan9\", \"$2:$1\"))\n}\n"
      output: go:ada et plan9:rob
  - key: code-nomme
    format: code-output
    question: |-
      ```go
      re := regexp.MustCompile(`(?P<annee>\d{4})-(?P<mois>\d{2})`)
      m := re.FindStringSubmatch("sortie : 2026-11")
      fmt.Println(m[re.SubexpIndex("mois")], m[re.SubexpIndex("annee")])
      ```
    answer: '`11 2026` : SubexpIndex donne l''indice d''un groupe nommé.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`(?P<annee>\\d{4})-(?P<mois>\\d{2})`)\n\tm := re.FindStringSubmatch(\"sortie : 2026-11\")\n\tfmt.Println(m[re.SubexpIndex(\"mois\")], m[re.SubexpIndex(\"annee\")])\n}\n"
      output: 11 2026
