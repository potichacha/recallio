notion: regexp
lesson: |-
  Le package **`regexp`** implémente la syntaxe **RE2** : une expression est compilée en automate et s'exécute en
  **temps linéaire** dans la taille du texte, quelle que soit l'expression. Pas de « catastrophic backtracking »
  possible, donc pas de déni de service par une regex (ReDoS) ; en contrepartie, **pas de références arrière** (`\1`)
  ni de lookahead (`(?=...)`).

  ```go
  var reCode = regexp.MustCompile(`^([A-Z]{2})-(\d{4})$`) // compilée une fois, au niveau du package

  reCode.MatchString("FR-2026")                  // true
  m := reCode.FindStringSubmatch("FR-2026")      // ["FR-2026" "FR" "2026"]
  regexp.MustCompile(`\d+`).FindAllString("a1b22c333", -1) // [1 22 333]
  regexp.MustCompile(`(\w+)@(\w+)`).ReplaceAllString("ada@go", "$2:$1") // "go:ada"
  ```

  Les bonnes pratiques :
  - **compiler une seule fois** : `regexp.MustCompile` dans une variable du package (elle panique au démarrage si
    l'expression est invalide), ou `regexp.Compile` pour une expression fournie par l'utilisateur, qui renvoie une
    erreur ;
  - écrire les expressions entre **backquotes** pour éviter de doubler les `\` ;
  - un `*regexp.Regexp` est **sûr entre goroutines** ;
  - nommer les groupes avec `(?P<annee>\d{4})` et `SubexpIndex("annee")` ;
  - avant une regex, se demander si `strings` suffit (`HasPrefix`, `Contains`, `Cut`) : c'est plus lisible et bien
    plus rapide.

  **En entretien** : « RE2 en temps linéaire, sans backtracking ni références arrière ; MustCompile une fois au niveau
  du package ; backquotes ; strings d'abord quand c'est suffisant. »
cards:
  - key: regex-ont-elles-references-arriere
    format: course
    question: "Pourquoi les expressions régulières de Go n'ont-elles pas de références arrière, comme `\\1` ?"
    choices:
      - {text: "Le moteur RE2 garantit un temps linéaire, ce que le retour arrière empêcherait", correct: true}
      - {text: "Elles ralentiraient la compilation de l'expression, qui ne se fait qu'une fois", correct: false}
      - {text: "Go les remplace par les groupes nommés, qui font exactement la même chose", correct: false}
      - {text: "Elles ne se comportent pas de la même façon sous Linux et sous Windows", correct: false}
    answer: "Le paquet `regexp` suit RE2 : un temps d'exécution linéaire dans la taille du texte, sans retour arrière. Les références arrière (et les assertions avant) en exigent, d'où leur absence ; les groupes nommés, eux, sont permis."
  - key: compiler-une-fois
    format: course
    question: Pourquoi compiler une expression régulière une seule fois, au niveau du package ?
    choices:
      - {text: "La compilation coûte bien plus que l'exécution, et un `*regexp.Regexp` se partage entre goroutines", correct: true}
      - {text: "Une expression compilée deux fois renvoie l'erreur `regexp: already compiled` au second appel", correct: false}
      - {text: "`regexp.MustCompile` n'est permis qu'au niveau du package, jamais dans le corps d'une fonction", correct: false}
      - {text: "Une variable de package garde en cache les textes déjà testés, ce qu'une variable locale ne fait pas", correct: false}
    answer: La compilation coûte bien plus que l'exécution ; la refaire à chaque appel (dans un handler, une boucle) ralentit beaucoup. Un *regexp.Regexp est sûr entre goroutines et se partage sans risque.
  - key: compile-vs-must
    format: course
    question: "Quand utiliser `regexp.Compile` plutôt que `regexp.MustCompile` ?"
    choices:
      - {text: "`Compile` pour une expression venue de l'extérieur, `MustCompile` pour une expression écrite dans le code", correct: true}
      - {text: "`Compile` pour une expression écrite dans le code, `MustCompile` pour une saisie de l'utilisateur", correct: false}
      - {text: "`Compile` pour un usage unique, `MustCompile` pour une expression partagée entre goroutines", correct: false}
      - {text: "`Compile` pour la syntaxe POSIX, `MustCompile` pour la syntaxe Perl, plus riche", correct: false}
    answer: Compile pour une expression qui vient de l'extérieur (configuration, utilisateur), car il renvoie une erreur ; MustCompile pour une expression écrite dans le code, qui panique au démarrage si elle est invalide.
  - key: lineaire
    format: course
    question: "Pourquoi les expressions régulières de Go protègent-elles contre le ReDoS ?"
    choices:
      - {text: "RE2 garantit un temps linéaire dans la taille du texte, sans retour arrière", correct: true}
      - {text: "`regexp` coupe toute recherche qui dépasse une seconde, avec une erreur", correct: false}
      - {text: "Le compilateur refuse les expressions dangereuses comme `(a+)+$`", correct: false}
      - {text: "Chaque recherche tourne dans sa goroutine, qui ne bloque pas le serveur", correct: false}
    answer: 'RE2 garantit un temps d''exécution linéaire dans la taille du texte, sans retour arrière : une expression comme `(a+)+$` ne peut pas exploser sur une entrée piégée, contrairement aux moteurs à backtracking.'
  - key: vf-backrefs
    format: true-false
    question: Les expressions régulières de Go acceptent les références arrière comme `(\w)\1`.
    truth: false
    answer: RE2 ne les accepte pas, pour garantir le temps linéaire.
  - key: vf-goroutines
    format: true-false
    question: Un même *regexp.Regexp peut être utilisé par plusieurs goroutines en même temps.
    truth: true
    answer: Il est sûr entre goroutines.
  - key: vf-mustcompile
    format: true-false
    question: '`regexp.MustCompile` renvoie une erreur si l''expression est invalide.'
    truth: false
    answer: Il panique ; c'est Compile qui renvoie une erreur.
  - key: vf-backquotes
    format: true-false
    question: Écrire une regex entre backquotes évite de doubler les antislashs.
    truth: true
    answer: Une chaîne brute ne traite pas les échappements.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Quelle méthode d'un `*regexp.Regexp` récupère les groupes capturés d'une correspondance ?"
    choices:
      - {text: "`FindStringSubmatch`", correct: true}
      - {text: "`MatchString`", correct: false}
      - {text: "`FindAllString(s, -1)`", correct: false}
      - {text: "`ReplaceAllString`", correct: false}
    answer: "`FindStringSubmatch` renvoie la correspondance complète, puis chaque groupe. `MatchString` dit seulement si le texte correspond, `FindAllString` renvoie toutes les correspondances, `ReplaceAllString` remplace."
  - key: qcm-strings
    format: multiple-choice
    question: "Dans lequel de ces cas une expression régulière est-elle superflue, le paquet `strings` suffisant ?"
    choices:
      - {text: "Tester qu'une URL commence par « https:// »", correct: true}
      - {text: "Valider un format comme deux lettres, un tiret et quatre chiffres", correct: false}
      - {text: "Extraire tous les nombres d'un texte libre", correct: false}
      - {text: "Repérer des dates aux formats variés dans un journal", correct: false}
    answer: "`strings.HasPrefix` suffit, plus lisible et plus rapide ; de même, `strings.Cut` sépare « clé=valeur ». Un format à valider ou des motifs à extraire d'un texte libre justifient une regex."
  - key: qcm-syntaxe
    format: multiple-choice
    question: Lesquelles de ces constructions RE2 accepte-t-il ?
    choices:
      - text: Les groupes nommés `(?P<nom>...)`
        correct: true
      - text: Les classes `\d`, `\w`, `\s`
        correct: true
      - text: Le lookahead `(?=...)`
        correct: false
      - text: Les références arrière `\1`
        correct: false
    answer: Les assertions avant et les références arrière demandent du backtracking.
  - key: qcm-utilisateur
    format: multiple-choice
    question: "Un administrateur saisit une regex de filtrage dans l'interface. Comment la compiler ?"
    choices:
      - {text: "Avec `regexp.Compile`, et une erreur claire si elle est invalide", correct: true}
      - {text: "Avec `regexp.MustCompile`, pour simplifier le code du handler", correct: false}
      - {text: "Avec `regexp.MustCompile` sous un `recover`, à chaque ligne filtrée", correct: false}
      - {text: "À chaque ligne filtrée, pour toujours suivre la dernière saisie", correct: false}
    answer: "`regexp.Compile` renvoie une erreur sur une saisie invalide, à montrer à l'administrateur ; on limite aussi sa longueur. `MustCompile` ferait paniquer le service, et compiler à chaque ligne coûte cher."
  - key: trous-must
    format: fill-in
    question: |-
      Complète la déclaration au niveau du package :
      ```go
      var reEmail = regexp.___(`^[^@\s]+@[^@\s]+$`)
      ```
    blanks:
      - - MustCompile
    answer: MustCompile, une fois.
  - key: trous-match
    format: fill-in
    question: |-
      Complète pour tester la correspondance :
      ```go
      if !reCode.___(code) {
      	return ErrCodeInvalide
      }
      ```
    blanks:
      - - MatchString
    answer: MatchString.
  - key: trous-findall
    format: fill-in
    question: |-
      Complète pour toutes les correspondances :
      ```go
      nombres := reNombre.FindAllString(texte, ___)
      ```
    blanks:
      - - '-1'
    answer: "-1 signifie sans limite."
  - key: trous-submatch
    format: fill-in
    question: |-
      Complète pour récupérer les groupes :
      ```go
      m := reDate.___(s) // [complet annee mois jour]
      ```
    blanks:
      - - FindStringSubmatch
    answer: FindStringSubmatch.
  - key: code-findall
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      re := regexp.MustCompile(`\d+`)
      fmt.Println(re.FindAllString("a1b22c333", -1), re.FindAllString("a1b22c333", 2))
      ```
    choices:
      - {text: "`[1 22 333] [1 22]`", correct: true}
      - {text: "`[1 22 333] [1 2]`", correct: false}
      - {text: "`[1 2 2 3 3 3] [1 2]`", correct: false}
      - {text: "`[1 22 333] [22 333]`", correct: false}
    answer: '`[1 22 333] [1 22]` : le second argument limite le nombre de correspondances.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`\\d+`)\n\tfmt.Println(re.FindAllString(\"a1b22c333\", -1), re.FindAllString(\"a1b22c333\", 2))\n}\n"
      output: '[1 22 333] [1 22]'
  - key: code-submatch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      re := regexp.MustCompile(`^([A-Z]{2})-(\d{4})$`)
      m := re.FindStringSubmatch("FR-2026")
      fmt.Println(len(m), m[1], m[2], re.MatchString("fr-2026"))
      ```
    choices:
      - {text: "`3 FR 2026 false`", correct: true}
      - {text: "`2 FR 2026 false`", correct: false}
      - {text: "`3 FR 2026 true`", correct: false}
      - {text: "`3 FR-2026 FR false`", correct: false}
    answer: '`3 FR 2026 false` : la correspondance complète puis les deux groupes ; les minuscules ne correspondent pas.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`^([A-Z]{2})-(\\d{4})$`)\n\tm := re.FindStringSubmatch(\"FR-2026\")\n\tfmt.Println(len(m), m[1], m[2], re.MatchString(\"fr-2026\"))\n}\n"
      output: 3 FR 2026 false
  - key: code-replace
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      re := regexp.MustCompile(`(\w+)@(\w+)`)
      fmt.Println(re.ReplaceAllString("ada@go et rob@plan9", "$2:$1"))
      ```
    choices:
      - {text: "`go:ada et plan9:rob`", correct: true}
      - {text: "`ada:go et rob:plan9`", correct: false}
      - {text: "`$2:$1 et $2:$1`", correct: false}
      - {text: "`go:ada et rob@plan9`", correct: false}
    answer: '`go:ada et plan9:rob` : $1 et $2 désignent les groupes capturés.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`(\\w+)@(\\w+)`)\n\tfmt.Println(re.ReplaceAllString(\"ada@go et rob@plan9\", \"$2:$1\"))\n}\n"
      output: go:ada et plan9:rob
  - key: code-nomme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      re := regexp.MustCompile(`(?P<annee>\d{4})-(?P<mois>\d{2})`)
      m := re.FindStringSubmatch("sortie : 2026-11")
      fmt.Println(m[re.SubexpIndex("mois")], m[re.SubexpIndex("annee")])
      ```
    choices:
      - {text: "`11 2026`", correct: true}
      - {text: "`2026 11`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: '`11 2026` : SubexpIndex donne l''indice d''un groupe nommé.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n)\n\nfunc main() {\n\tre := regexp.MustCompile(`(?P<annee>\\d{4})-(?P<mois>\\d{2})`)\n\tm := re.FindStringSubmatch(\"sortie : 2026-11\")\n\tfmt.Println(m[re.SubexpIndex(\"mois\")], m[re.SubexpIndex(\"annee\")])\n}\n"
      output: 11 2026
