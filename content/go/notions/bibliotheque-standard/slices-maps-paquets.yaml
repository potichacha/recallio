notion: slices-maps-paquets
lesson: "Depuis Go 1.21, les packages génériques **`slices`** et **`maps`** remplacent la plupart des boucles écrites à la main.\n\n| Besoin | Fonction |\n|---|---|\n| trier | `slices.Sort(s)`, `slices.SortFunc(s, cmp)`, `slices.SortStableFunc` |\n| chercher | `slices.Contains`, `slices.Index`, `slices.IndexFunc`, `slices.BinarySearch` (sur une slice triée) |\n| modifier | `slices.Insert`, `slices.Delete`, `slices.DeleteFunc`, `slices.Compact`, `slices.Reverse` |\n| comparer, copier | `slices.Equal`, `slices.Clone`, `slices.Max`, `slices.Min` |\n| maps | `maps.Clone`, `maps.Copy`, `maps.DeleteFunc`, `maps.Equal`, `maps.Keys`, `maps.Values` |\n\n```go\nslices.SortFunc(commandes, func(a, b Commande) int {\n\treturn cmp.Or(\n\t\tcmp.Compare(a.Client, b.Client), // d'abord par client\n\t\tb.Date.Compare(a.Date),          // puis la plus récente d'abord\n\t)\n})\n\ni, trouve := slices.BinarySearch(triee, 42) // position et présence\n```\n\nCe qu'il faut savoir :\n- `slices.Sort` **n'est pas stable** : pour garder l'ordre des égaux, `SortStableFunc` ;\n- la fonction de comparaison renvoie un **entier** (négatif, zéro, positif), et `cmp.Compare` le calcule pour tout\n  type ordonné ; `cmp.Or` enchaîne plusieurs critères ;\n- `Delete`, `Insert`, `Compact` **renvoient** la nouvelle slice : il faut réaffecter (`s = slices.Delete(s, i, i+1)`) ;\n- `Compact` retire les doublons **consécutifs** (on trie d'abord pour tous les retirer) ;\n- `BinarySearch` suppose une slice **triée**.\n\n**En entretien** : « slices.Sort, SortFunc avec cmp.Compare et cmp.Or, Contains, Index, BinarySearch ; réaffecter le\nrésultat de Delete et Insert ; Sort n'est pas stable. »"
tour:
  - title: Les paquets slices et maps
    text: |-
      Les paquets génériques `slices` et `maps` remplacent bien des boucles :

      - `slices.Sort`, `slices.Contains`, `slices.Index`, `slices.Max` ; - `slices.BinarySearch`, qui cherche dans une
      slice **triée** ; - `maps.Keys` et `maps.Values`, des itérateurs que `slices.Sorted` ou `slices.Collect`
      transforment en slice.

      Grâce aux génériques, ils fonctionnent avec tous les types d'éléments.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"maps"
          	"slices"
          )

          func main() {
          	notes := []int{15, 9, 18, 12}
          	slices.Sort(notes)
          	fmt.Println(notes, slices.Contains(notes, 18), slices.Index(notes, 12))
          	position, trouve := slices.BinarySearch(notes, 15)
          	fmt.Println(position, trouve, slices.Max(notes))

          	stock := map[string]int{"pommes": 3, "poires": 0, "kiwis": 7}
          	fmt.Println(slices.Sorted(maps.Keys(stock)))
          }
      output: |-
        [9 12 15 18] true 1
        2 true 18
        [kiwis poires pommes]
cards:
  - key: supprimer-element-slice
    format: course
    question: "Comment supprimer l'élément d'indice `i` d'une slice en gardant l'ordre ?"
    choices:
      - {text: "`s = slices.Delete(s, i, i+1)`, ou `append(s[:i], s[i+1:]...)`", correct: true}
      - {text: "`delete(s, i)`, comme pour retirer une clé d'une map", correct: false}
      - {text: "`s[i] = nil`, puis `s = s[:len(s)-1]` pour raccourcir", correct: false}
      - {text: "`s = s[:i]`, qui retire l'élément sans toucher à la suite", correct: false}
    answer: "`slices.Delete(s, i, i+1)` ou `append(s[:i], s[i+1:]...)` décalent la suite, en O(n), et gardent l'ordre. Sans ordre à garder, on échange avec le dernier puis l'on raccourcit, en O(1). `delete` ne s'applique qu'aux maps."
  - key: slices-sort-stable
    format: course
    question: "`slices.Sort` est-il un tri stable ?"
    choices:
      - {text: "Non, c'est un pdqsort ; `slices.SortStableFunc` est stable", correct: true}
      - {text: "Oui, comme tous les tris de la bibliothèque standard", correct: false}
      - {text: "Oui, depuis Go 1.21, car il repose sur un tri fusion", correct: false}
      - {text: "Non, et aucune fonction de `slices` ne trie de façon stable", correct: false}
    answer: "Non : `slices.Sort` utilise un pdqsort, qui ne garde pas l'ordre des éléments égaux. Pour un tri stable, `slices.SortStableFunc` (ou `sort.SliceStable`)."
  - key: renvoie-slices-binarysearch
    format: course
    question: "Que renvoie `slices.BinarySearch(s, x)` ?"
    choices:
      - {text: "L'indice où `x` est ou serait inséré, et un booléen de présence", correct: true}
      - {text: "L'indice de `x`, ou -1 s'il est absent de la slice", correct: false}
      - {text: "Un booléen seul, qui dit si `x` est présent dans la slice", correct: false}
      - {text: "L'indice de `x`, et une erreur s'il est absent de la slice", correct: false}
    answer: "L'indice où `x` se trouve, ou celui où il faudrait l'insérer pour garder la slice triée, et un booléen qui dit s'il est présent. Le -1 des absents, c'est `slices.Index`."
  - key: reaffecter
    format: course
    question: Pourquoi écrire `s = slices.Delete(s, i, i+1)` et pas seulement `slices.Delete(s, i, i+1)` ?
    choices:
      - {text: "`Delete` renvoie la slice raccourcie ; `s` garderait l'ancienne longueur, avec une valeur zéro à la fin", correct: true}
      - {text: "`Delete` travaille sur une copie de `s`, qui reste donc entièrement inchangée après l'appel", correct: false}
      - {text: "Sans réaffectation, `Delete` panique, car son résultat ne doit jamais être ignoré", correct: false}
      - {text: "C'est une simple convention de style : `s` est raccourcie en place dans tous les cas", correct: false}
    answer: Delete renvoie la slice raccourcie ; la variable s garderait l'ancienne longueur, avec les éléments décalés et une valeur zéro à la fin.
  - key: vf-stable
    format: true-false
    question: '`slices.Sort` garde l''ordre d''origine des éléments égaux.'
    truth: false
    answer: Il n'est pas stable ; SortStableFunc l'est.
  - key: vf-compact
    format: true-false
    question: '`slices.Compact` retire tous les doublons d''une slice non triée.'
    truth: false
    answer: Seulement les doublons consécutifs ; on trie d'abord.
  - key: vf-binary
    format: true-false
    question: '`slices.BinarySearch` renvoie la position où insérer l''élément s''il est absent.'
    truth: true
    answer: Avec found à false.
  - key: vf-cmp
    format: true-false
    question: La fonction passée à slices.SortFunc renvoie un booléen « a avant b ».
    truth: false
    answer: Elle renvoie un entier négatif, nul ou positif, comme cmp.Compare.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Laquelle de ces fonctions n'existe pas dans le paquet `slices` ?"
    choices:
      - {text: "`slices.Filter`", correct: true}
      - {text: "`slices.Contains`", correct: false}
      - {text: "`slices.Reverse`", correct: false}
      - {text: "`slices.IndexFunc`", correct: false}
    answer: "`slices` n'a pas de `Filter` : on retire les éléments indésirables avec `slices.DeleteFunc`, ou l'on construit une nouvelle slice dans une boucle. `Contains`, `Reverse` et `IndexFunc` existent."
  - key: qcm-tri
    format: multiple-choice
    question: Comment trier des produits par prix croissant, puis par nom ?
    choices:
      - {text: "`slices.SortFunc(p, func(a, b Produit) int { return cmp.Or(cmp.Compare(a.Prix, b.Prix), cmp.Compare(a.Nom, b.Nom)) })`", correct: true}
      - {text: "`slices.Sort(p)`, qui compare les produits champ par champ, dans l'ordre de leur déclaration", correct: false}
      - {text: "Deux appels à `slices.SortFunc`, d'abord par prix, puis par nom, chacun sur toute la slice", correct: false}
      - {text: "`sort.Ints(p)`, après avoir converti chaque produit en un entier qui combine prix et nom", correct: false}
    answer: cmp.Or renvoie le premier résultat non nul.
  - key: qcm-maps
    format: multiple-choice
    question: "Laquelle de ces fonctions n'existe pas dans le paquet `maps` ?"
    choices:
      - {text: "`maps.Sort`", correct: true}
      - {text: "`maps.Clone`", correct: false}
      - {text: "`maps.DeleteFunc`", correct: false}
      - {text: "`maps.Equal`", correct: false}
    answer: "Une map n'a pas d'ordre à trier : pas de `maps.Sort`. Pour parcourir ses clés dans l'ordre, `slices.Sorted(maps.Keys(m))`. `Clone`, `DeleteFunc` et `Equal` existent."
  - key: qcm-filtrer
    format: multiple-choice
    question: "Lesquelles de ces façons retirent d'une slice les commandes annulées ?"
    choices:
      - text: '`cmds = slices.DeleteFunc(cmds, func(c Commande) bool { return c.Annulee })`'
        correct: true
      - text: Une boucle qui construit une nouvelle slice des commandes gardées
        correct: true
      - text: '`slices.Delete(cmds, c)` pour chaque commande annulée'
        correct: false
      - text: '`delete(cmds, i)`'
        correct: false
    answer: delete ne s'applique qu'aux maps ; slices.Delete prend des indices.
  - key: trous-sort
    format: fill-in
    question: |-
      Complète pour trier une slice d'entiers :
      ```go
      slices.___(notes)
      ```
    blanks:
      - - Sort
    answer: slices.Sort.
  - key: trous-contains
    format: fill-in
    question: |-
      Complète :
      ```go
      if slices.___(rolesAutorises, role) {
      ```
    blanks:
      - - Contains
    answer: slices.Contains.
  - key: trous-compare
    format: fill-in
    question: |-
      Complète le tri par âge :
      ```go
      slices.SortFunc(personnes, func(a, b Personne) int {
      	return cmp.___(a.Age, b.Age)
      })
      ```
    blanks:
      - - Compare
    answer: cmp.Compare.
  - key: trous-delete
    format: fill-in
    question: |-
      Complète pour supprimer l'élément d'indice i :
      ```go
      s = slices.___(s, i, i+1)
      ```
    blanks:
      - - Delete
    answer: slices.Delete, en réaffectant.
  - key: code-binary
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{10, 20, 30, 40}
      i, ok := slices.BinarySearch(s, 30)
      j, ok2 := slices.BinarySearch(s, 25)
      fmt.Println(i, ok, j, ok2)
      ```
    choices:
      - {text: "`2 true 2 false`", correct: true}
      - {text: "`2 true -1 false`", correct: false}
      - {text: "`2 true 1 false`", correct: false}
      - {text: "`3 true 2 false`", correct: false}
    answer: '`2 true 2 false` : 25 serait inséré à l''indice 2.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []int{10, 20, 30, 40}\n\ti, ok := slices.BinarySearch(s, 30)\n\tj, ok2 := slices.BinarySearch(s, 25)\n\tfmt.Println(i, ok, j, ok2)\n}\n"
      output: 2 true 2 false
  - key: code-compact
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []int{3, 1, 3, 2, 1}
      fmt.Println(slices.Compact(slices.Clone(s)))
      slices.Sort(s)
      fmt.Println(slices.Compact(s))
      ```
    choices:
      - text: |-
          ```
          [3 1 3 2 1]
          [1 2 3]
          ```
        correct: true
      - text: |-
          ```
          [3 1 2]
          [1 2 3]
          ```
        correct: false
      - text: |-
          ```
          [3 1 3 2 1]
          [1 1 2 3 3]
          ```
        correct: false
      - text: |-
          ```
          [3 1 2]
          [3 1 2]
          ```
        correct: false
    answer: '`[3 1 3 2 1]` puis `[1 2 3]` : Compact ne retire que les doublons consécutifs.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []int{3, 1, 3, 2, 1}\n\tfmt.Println(slices.Compact(slices.Clone(s)))\n\tslices.Sort(s)\n\tfmt.Println(slices.Compact(s))\n}\n"
      output: |-
        [3 1 3 2 1]
        [1 2 3]
  - key: code-sortfunc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type P struct {
      	Nom string
      	Age int
      }

      ps := []P{{"Zoé", 30}, {"Ada", 36}, {"Bob", 30}}
      slices.SortFunc(ps, func(a, b P) int {
      	return cmp.Or(cmp.Compare(a.Age, b.Age), cmp.Compare(a.Nom, b.Nom))
      })
      fmt.Println(ps)
      ```
    choices:
      - {text: "`[{Bob 30} {Zoé 30} {Ada 36}]`", correct: true}
      - {text: "`[{Zoé 30} {Bob 30} {Ada 36}]`", correct: false}
      - {text: "`[{Ada 36} {Bob 30} {Zoé 30}]`", correct: false}
      - {text: "`[{Ada 36} {Zoé 30} {Bob 30}]`", correct: false}
    answer: '`[{Bob 30} {Zoé 30} {Ada 36}]` : par âge, puis par nom.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype P struct {\n\tNom string\n\tAge int\n}\n\nfunc main() {\n\tps := []P{{\"Zoé\", 30}, {\"Ada\", 36}, {\"Bob\", 30}}\n\tslices.SortFunc(ps, func(a, b P) int {\n\t\treturn cmp.Or(cmp.Compare(a.Age, b.Age), cmp.Compare(a.Nom, b.Nom))\n\t})\n\tfmt.Println(ps)\n}\n"
      output: '[{Bob 30} {Zoé 30} {Ada 36}]'
  - key: code-insert
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []string{"a", "c"}
      s = slices.Insert(s, 1, "b")
      s = slices.Delete(s, 0, 1)
      fmt.Println(s, slices.Index(s, "c"))
      ```
    choices:
      - {text: "`[b c] 1`", correct: true}
      - {text: "`[a b c] 2`", correct: false}
      - {text: "`[b c] 2`", correct: false}
      - {text: "`[a c] 1`", correct: false}
    answer: "`[b c] 1` : `Insert` donne `[a b c]`, `Delete(s, 0, 1)` retire `a`, et `c` se trouve alors à l'indice 1."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []string{\"a\", \"c\"}\n\ts = slices.Insert(s, 1, \"b\")\n\ts = slices.Delete(s, 0, 1)\n\tfmt.Println(s, slices.Index(s, \"c\"))\n}\n"
      output: '[b c] 1'
