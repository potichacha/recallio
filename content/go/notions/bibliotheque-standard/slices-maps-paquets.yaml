notion: slices-maps-paquets
cards:
  - key: supprimer-element-slice
    format: course
    question: Comment supprimer un élément d'un slice ?
    answer: '`append(s[:i], s[i+1:]...)` ou slices.Delete pour garder l''ordre ; échange avec le dernier pour O(1) sans ordre.'
  - key: slices-sort-stable
    format: course
    question: slices.Sort est-il stable ?
    answer: Non (pdqsort) ; SortStableFunc l'est.
  - key: renvoie-slices-binarysearch
    format: course
    question: Que renvoie slices.BinarySearch ?
    answer: L'index où l'élément est ou serait inséré, et un booléen de présence.
