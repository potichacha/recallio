notion: slices-maps-paquets
lesson: "Depuis Go 1.21, les packages génériques **`slices`** et **`maps`** remplacent la plupart des boucles écrites à la main.\n\n| Besoin | Fonction |\n|---|---|\n| trier | `slices.Sort(s)`, `slices.SortFunc(s, cmp)`, `slices.SortStableFunc` |\n| chercher | `slices.Contains`, `slices.Index`, `slices.IndexFunc`, `slices.BinarySearch` (sur une slice triée) |\n| modifier | `slices.Insert`, `slices.Delete`, `slices.DeleteFunc`, `slices.Compact`, `slices.Reverse` |\n| comparer, copier | `slices.Equal`, `slices.Clone`, `slices.Max`, `slices.Min` |\n| maps | `maps.Clone`, `maps.Copy`, `maps.DeleteFunc`, `maps.Equal`, `maps.Keys`, `maps.Values` |\n\n```go\nslices.SortFunc(commandes, func(a, b Commande) int {\n\treturn cmp.Or(\n\t\tcmp.Compare(a.Client, b.Client), // d'abord par client\n\t\tb.Date.Compare(a.Date),          // puis la plus récente d'abord\n\t)\n})\n\ni, trouve := slices.BinarySearch(triee, 42) // position et présence\n```\n\nCe qu'il faut savoir :\n- `slices.Sort` **n'est pas stable** : pour garder l'ordre des égaux, `SortStableFunc` ;\n- la fonction de comparaison renvoie un **entier** (négatif, zéro, positif), et `cmp.Compare` le calcule pour tout\n  type ordonné ; `cmp.Or` enchaîne plusieurs critères ;\n- `Delete`, `Insert`, `Compact` **renvoient** la nouvelle slice : il faut réaffecter (`s = slices.Delete(s, i, i+1)`) ;\n- `Compact` retire les doublons **consécutifs** (on trie d'abord pour tous les retirer) ;\n- `BinarySearch` suppose une slice **triée**.\n\n**En entretien** : « slices.Sort, SortFunc avec cmp.Compare et cmp.Or, Contains, Index, BinarySearch ; réaffecter le\nrésultat de Delete et Insert ; Sort n'est pas stable. »"
tour:
  - title: Les paquets slices et maps
    text: |-
      Les paquets génériques `slices` et `maps` remplacent bien des boucles :

      - `slices.Sort`, `slices.Contains`, `slices.Index`, `slices.Max` ; - `slices.BinarySearch`, qui cherche dans une
      slice **triée** ; - `maps.Keys` et `maps.Values`, des itérateurs que `slices.Sorted` ou `slices.Collect`
      transforment en slice.

      Grâce aux génériques, ils fonctionnent avec tous les types d'éléments.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"maps"
          	"slices"
          )

          func main() {
          	notes := []int{15, 9, 18, 12}
          	slices.Sort(notes)
          	fmt.Println(notes, slices.Contains(notes, 18), slices.Index(notes, 12))
          	position, trouve := slices.BinarySearch(notes, 15)
          	fmt.Println(position, trouve, slices.Max(notes))

          	stock := map[string]int{"pommes": 3, "poires": 0, "kiwis": 7}
          	fmt.Println(slices.Sorted(maps.Keys(stock)))
          }
      output: |-
        [9 12 15 18] true 1
        2 true 18
        [kiwis poires pommes]
cards:
  - key: supprimer-element-slice
    format: course
    question: Comment supprimer un élément d'un slice ?
    answer: '`append(s[:i], s[i+1:]...)` ou slices.Delete pour garder l''ordre ; échange avec le dernier pour O(1) sans ordre.'
  - key: slices-sort-stable
    format: course
    question: slices.Sort est-il stable ?
    answer: Non (pdqsort) ; SortStableFunc l'est.
  - key: renvoie-slices-binarysearch
    format: course
    question: Que renvoie slices.BinarySearch ?
    answer: L'index où l'élément est ou serait inséré, et un booléen de présence.
  - key: reaffecter
    format: course
    question: Pourquoi écrire `s = slices.Delete(s, i, i+1)` et pas seulement `slices.Delete(s, i, i+1)` ?
    answer: Delete renvoie la slice raccourcie ; la variable s garderait l'ancienne longueur, avec les éléments décalés et une valeur zéro à la fin.
  - key: vf-stable
    format: true-false
    question: '`slices.Sort` garde l''ordre d''origine des éléments égaux.'
    truth: false
    answer: Il n'est pas stable ; SortStableFunc l'est.
  - key: vf-compact
    format: true-false
    question: '`slices.Compact` retire tous les doublons d''une slice non triée.'
    truth: false
    answer: Seulement les doublons consécutifs ; on trie d'abord.
  - key: vf-binary
    format: true-false
    question: '`slices.BinarySearch` renvoie la position où insérer l''élément s''il est absent.'
    truth: true
    answer: Avec found à false.
  - key: vf-cmp
    format: true-false
    question: La fonction passée à slices.SortFunc renvoie un booléen « a avant b ».
    truth: false
    answer: Elle renvoie un entier négatif, nul ou positif, comme cmp.Compare.
  - key: qcm-fonctions
    format: multiple-choice
    question: Lesquelles de ces fonctions existent dans le package slices ?
    choices:
      - text: '`slices.Contains`'
        correct: true
      - text: '`slices.Reverse`'
        correct: true
      - text: '`slices.IndexFunc`'
        correct: true
      - text: '`slices.Filter`'
        correct: false
    answer: Pour filtrer, slices.DeleteFunc garde les éléments qui ne correspondent pas.
  - key: qcm-tri
    format: multiple-choice
    question: Comment trier des produits par prix croissant, puis par nom ?
    choices:
      - text: '`slices.SortFunc(p, func(a, b Produit) int { return cmp.Or(cmp.Compare(a.Prix, b.Prix), cmp.Compare(a.Nom, b.Nom)) })`'
        correct: true
      - text: '`slices.Sort(p)`'
        correct: false
      - text: Deux appels successifs à slices.Sort
        correct: false
      - text: '`sort.Ints(p)`'
        correct: false
    answer: cmp.Or renvoie le premier résultat non nul.
  - key: qcm-maps
    format: multiple-choice
    question: Quelles fonctions du package maps existent ?
    choices:
      - text: '`maps.Clone`'
        correct: true
      - text: '`maps.DeleteFunc`'
        correct: true
      - text: '`maps.Equal`'
        correct: true
      - text: '`maps.Sort`'
        correct: false
    answer: Une map n'a pas d'ordre à trier.
  - key: qcm-filtrer
    format: multiple-choice
    question: Comment retirer d'une slice les commandes annulées ?
    choices:
      - text: '`cmds = slices.DeleteFunc(cmds, func(c Commande) bool { return c.Annulee })`'
        correct: true
      - text: Une boucle qui construit une nouvelle slice des commandes gardées
        correct: true
      - text: '`slices.Delete(cmds, c)` pour chaque commande annulée'
        correct: false
      - text: '`delete(cmds, i)`'
        correct: false
    answer: delete ne s'applique qu'aux maps ; slices.Delete prend des indices.
  - key: trous-sort
    format: fill-in
    question: |-
      Complétez pour trier une slice d'entiers :
      ```go
      slices.___(notes)
      ```
    blanks:
      - - Sort
    answer: slices.Sort.
  - key: trous-contains
    format: fill-in
    question: |-
      Complétez :
      ```go
      if slices.___(rolesAutorises, role) {
      ```
    blanks:
      - - Contains
    answer: slices.Contains.
  - key: trous-compare
    format: fill-in
    question: "Complétez le tri par âge :\n```go\nslices.SortFunc(personnes, func(a, b Personne) int {\n\treturn cmp.___(a.Age, b.Age)\n})\n```"
    blanks:
      - - Compare
    answer: cmp.Compare.
  - key: trous-delete
    format: fill-in
    question: |-
      Complétez pour supprimer l'élément d'indice i :
      ```go
      s = slices.___(s, i, i+1)
      ```
    blanks:
      - - Delete
    answer: slices.Delete, en réaffectant.
  - key: code-binary
    format: code-output
    question: |-
      ```go
      s := []int{10, 20, 30, 40}
      i, ok := slices.BinarySearch(s, 30)
      j, ok2 := slices.BinarySearch(s, 25)
      fmt.Println(i, ok, j, ok2)
      ```
    answer: '`2 true 2 false` : 25 serait inséré à l''indice 2.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []int{10, 20, 30, 40}\n\ti, ok := slices.BinarySearch(s, 30)\n\tj, ok2 := slices.BinarySearch(s, 25)\n\tfmt.Println(i, ok, j, ok2)\n}\n"
      output: 2 true 2 false
  - key: code-compact
    format: code-output
    question: |-
      ```go
      s := []int{3, 1, 3, 2, 1}
      fmt.Println(slices.Compact(slices.Clone(s)))
      slices.Sort(s)
      fmt.Println(slices.Compact(s))
      ```
    answer: '`[3 1 3 2 1]` puis `[1 2 3]` : Compact ne retire que les doublons consécutifs.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []int{3, 1, 3, 2, 1}\n\tfmt.Println(slices.Compact(slices.Clone(s)))\n\tslices.Sort(s)\n\tfmt.Println(slices.Compact(s))\n}\n"
      output: |-
        [3 1 3 2 1]
        [1 2 3]
  - key: code-sortfunc
    format: code-output
    question: "```go\ntype P struct {\n\tNom string\n\tAge int\n}\n\nps := []P{{\"Zoé\", 30}, {\"Ada\", 36}, {\"Bob\", 30}}\nslices.SortFunc(ps, func(a, b P) int {\n\treturn cmp.Or(cmp.Compare(a.Age, b.Age), cmp.Compare(a.Nom, b.Nom))\n})\nfmt.Println(ps)\n```"
    answer: '`[{Bob 30} {Zoé 30} {Ada 36}]` : par âge, puis par nom.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype P struct {\n\tNom string\n\tAge int\n}\n\nfunc main() {\n\tps := []P{{\"Zoé\", 30}, {\"Ada\", 36}, {\"Bob\", 30}}\n\tslices.SortFunc(ps, func(a, b P) int {\n\t\treturn cmp.Or(cmp.Compare(a.Age, b.Age), cmp.Compare(a.Nom, b.Nom))\n\t})\n\tfmt.Println(ps)\n}\n"
      output: '[{Bob 30} {Zoé 30} {Ada 36}]'
  - key: code-insert
    format: code-output
    question: |-
      ```go
      s := []string{"a", "c"}
      s = slices.Insert(s, 1, "b")
      s = slices.Delete(s, 0, 1)
      fmt.Println(s, slices.Index(s, "c"))
      ```
    answer: '`[b c] 1`'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\ts := []string{\"a\", \"c\"}\n\ts = slices.Insert(s, 1, \"b\")\n\ts = slices.Delete(s, 0, 1)\n\tfmt.Println(s, slices.Index(s, \"c\"))\n}\n"
      output: '[b c] 1'
