notion: embed
lesson: |-
  La directive **`//go:embed`** (Go 1.16) inclut des fichiers **dans le binaire** au moment de la compilation : pas de
  fichier à déployer à côté, et un binaire autonome.

  ```go
  import "embed"

  //go:embed version.txt
  var version string // un fichier dans une string

  //go:embed logo.png
  var logo []byte // ou dans un []byte

  //go:embed templates/*.html static
  var fichiers embed.FS // plusieurs fichiers ou dossiers dans un système de fichiers en lecture seule
  ```

  `embed.FS` implémente `fs.FS` : il s'utilise avec `template.ParseFS`, `http.FileServerFS`, `fs.ReadFile`,
  `fs.WalkDir`.

  ```go
  tmpl := template.Must(template.ParseFS(fichiers, "templates/*.html"))
  http.Handle("/static/", http.FileServerFS(fichiers))
  ```

  Les règles :
  - la directive se place **juste avant** une variable du **package** (pas dans une fonction), de type `string`,
    `[]byte` ou `embed.FS` ;
  - les chemins sont **relatifs au dossier du fichier source**, sans `..` : on ne peut pas embarquer un fichier hors du
    module ou d'un dossier parent ;
  - les fichiers qui commencent par `.` ou `_` sont exclus d'un dossier, sauf avec le préfixe `all:` ;
  - le contenu est figé à la **compilation** : modifier le fichier demande de recompiler.

  Usages courants : migrations SQL, templates HTML, fichiers statiques d'une interface web, données de test, numéro de
  version.

  **En entretien** : « //go:embed sur une variable de package string, []byte ou embed.FS ; chemins relatifs au
  dossier, sans .. ; embed.FS est un fs.FS ; binaire autonome. »
cards:
  - key: sert-embed
    format: course
    question: À quoi sert embed ?
    answer: Inclure des fichiers dans le binaire à la compilation.
  - key: terme-embed
    format: course
    question: Que désigne « embed » ?
    answer: Package et directive pour inclure des fichiers dans le binaire
  - key: fs
    format: course
    question: Comment servir les fichiers statiques embarqués avec net/http ?
    answer: Avec `http.FileServerFS(fichiers)` (Go 1.22) ou `http.FileServer(http.FS(fichiers))`, car embed.FS implémente fs.FS.
  - key: parent
    format: course
    question: Peut-on embarquer un fichier d'un dossier parent avec `//go:embed ../config.yaml` ?
    answer: 'Non : les chemins sont relatifs au dossier du fichier source et ne peuvent pas contenir « .. » ; on place les fichiers sous ce dossier, ou on embarque depuis un package situé plus haut.'
  - key: vf-recompiler
    format: true-false
    question: Modifier un fichier embarqué change le contenu du binaire déjà compilé.
    truth: false
    answer: Le contenu est figé à la compilation.
  - key: vf-fonction
    format: true-false
    question: //go:embed peut s'appliquer à une variable locale d'une fonction.
    truth: false
    answer: Seulement à une variable du package.
  - key: vf-types
    format: true-false
    question: Une variable embarquée peut être de type string, []byte ou embed.FS.
    truth: true
    answer: string et []byte pour un seul fichier.
  - key: vf-caches
    format: true-false
    question: Par défaut, embarquer un dossier inclut ses fichiers qui commencent par un point.
    truth: false
    answer: Ils sont exclus, sauf avec le préfixe all:.
  - key: qcm-usages
    format: multiple-choice
    question: Quels usages de //go:embed sont courants ?
    choices:
      - text: Les migrations SQL d'un service
        correct: true
      - text: Les templates HTML et les fichiers statiques
        correct: true
      - text: Des secrets de production
        correct: false
      - text: Un fichier de configuration modifié à chaud
        correct: false
    answer: Un secret embarqué est lisible dans le binaire ; une configuration à chaud doit rester un fichier externe.
  - key: qcm-fs
    format: multiple-choice
    question: Avec quelles fonctions peut-on utiliser un embed.FS ?
    choices:
      - text: '`template.ParseFS`'
        correct: true
      - text: '`fs.ReadFile` et `fs.WalkDir`'
        correct: true
      - text: '`http.FileServerFS`'
        correct: true
      - text: '`os.WriteFile`'
        correct: false
    answer: embed.FS est en lecture seule.
  - key: qcm-placement
    format: multiple-choice
    question: Où placer la directive //go:embed ?
    choices:
      - text: Juste au-dessus de la déclaration d'une variable du package
        correct: true
      - text: Dans le corps de main
        correct: false
      - text: Dans le go.mod
        correct: false
      - text: En tête du fichier, avant package
        correct: false
    answer: Le package embed doit aussi être importé (au moins avec _ pour string et []byte).
  - key: qcm-avantages
    format: multiple-choice
    question: Quels avantages apporte l'embarquement des fichiers ?
    choices:
      - text: Un seul binaire à déployer
        correct: true
      - text: Pas de fichier manquant ou désynchronisé au démarrage
        correct: true
      - text: Des fichiers modifiables sans recompiler
        correct: false
      - text: Un binaire plus petit
        correct: false
    answer: Le binaire grossit de la taille des fichiers.
  - key: trous-directive
    format: fill-in
    question: |-
      Complétez pour embarquer les migrations :
      ```go
      //go:___ migrations/*.sql
      var migrations embed.FS
      ```
    blanks:
      - - embed
    answer: La directive //go:embed.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez le type pour un dossier entier :
      ```go
      //go:embed static
      var statiques embed.___
      ```
    blanks:
      - - FS
    answer: embed.FS.
  - key: trous-parsefs
    format: fill-in
    question: |-
      Complétez :
      ```go
      tmpl := template.Must(template.___(fichiers, "templates/*.html"))
      ```
    blanks:
      - - ParseFS
    answer: template.ParseFS lit depuis un fs.FS.
  - key: trous-all
    format: fill-in
    question: |-
      Complétez pour inclure aussi les fichiers cachés :
      ```go
      //go:embed ___static
      var statiques embed.FS
      ```
    blanks:
      - - 'all:'
    answer: Le préfixe all:.
