notion: embed
lesson: |-
  La directive **`//go:embed`** (Go 1.16) inclut des fichiers **dans le binaire** au moment de la compilation : pas de
  fichier à déployer à côté, et un binaire autonome.

  ```go
  import "embed"

  //go:embed version.txt
  var version string // un fichier dans une string

  //go:embed logo.png
  var logo []byte // ou dans un []byte

  //go:embed templates/*.html static
  var fichiers embed.FS // plusieurs fichiers ou dossiers dans un système de fichiers en lecture seule
  ```

  `embed.FS` implémente `fs.FS` : il s'utilise avec `template.ParseFS`, `http.FileServerFS`, `fs.ReadFile`,
  `fs.WalkDir`.

  ```go
  tmpl := template.Must(template.ParseFS(fichiers, "templates/*.html"))
  http.Handle("/static/", http.FileServerFS(fichiers))
  ```

  Les règles :
  - la directive se place **juste avant** une variable du **package** (pas dans une fonction), de type `string`,
    `[]byte` ou `embed.FS` ;
  - les chemins sont **relatifs au dossier du fichier source**, sans `..` : on ne peut pas embarquer un fichier hors du
    module ou d'un dossier parent ;
  - les fichiers qui commencent par `.` ou `_` sont exclus d'un dossier, sauf avec le préfixe `all:` ;
  - le contenu est figé à la **compilation** : modifier le fichier demande de recompiler.

  Usages courants : migrations SQL, templates HTML, fichiers statiques d'une interface web, données de test, numéro de
  version.

  **En entretien** : « //go:embed sur une variable de package string, []byte ou embed.FS ; chemins relatifs au
  dossier, sans .. ; embed.FS est un fs.FS ; binaire autonome. »
cards:
  - key: sert-embed
    format: course
    question: "À quoi sert le paquet `embed` ?"
    choices:
      - {text: "À inclure des fichiers dans le binaire, au moment de la compilation", correct: true}
      - {text: "À charger des fichiers au démarrage, depuis le dossier du binaire", correct: false}
      - {text: "À intégrer une struct dans une autre, pour en promouvoir les champs", correct: false}
      - {text: "À embarquer du code C dans un programme Go, à la manière de cgo", correct: false}
    answer: "Avec la directive `//go:embed`, le compilateur inclut des fichiers dans le binaire : rien à lire sur le disque au démarrage. L'intégration d'une struct dans une autre, c'est l'embedding, sans rapport."
  - key: terme-embed
    format: course
    question: "Que désigne `//go:embed` dans un fichier Go ?"
    choices:
      - {text: "Une directive qui place des fichiers dans une variable, à la compilation", correct: true}
      - {text: "Un commentaire de documentation, ignoré par le compilateur", correct: false}
      - {text: "Une directive qui lit des fichiers à l'exécution, au premier accès", correct: false}
      - {text: "Une directive qui intègre un autre paquet Go dans le binaire", correct: false}
    answer: "`//go:embed` est une directive du paquet `embed` : au-dessus d'une variable `string`, `[]byte` ou `embed.FS`, elle y place le contenu des fichiers désignés, à la compilation."
  - key: fs
    format: course
    question: Comment servir les fichiers statiques embarqués avec net/http ?
    choices:
      - {text: "`http.FileServerFS(fichiers)`, car `embed.FS` implémente `fs.FS`", correct: true}
      - {text: "`http.FileServer(http.Dir(fichiers))`, car `embed.FS` est un dossier", correct: false}
      - {text: "`http.ServeFile`, après avoir copié les fichiers dans un dossier temporaire", correct: false}
      - {text: "Rien de direct : il faut lire chaque fichier et l'écrire dans la réponse", correct: false}
    answer: Avec `http.FileServerFS(fichiers)` (Go 1.22) ou `http.FileServer(http.FS(fichiers))`, car embed.FS implémente fs.FS.
  - key: parent
    format: course
    question: Peut-on embarquer un fichier d'un dossier parent avec `//go:embed ../config.yaml` ?
    choices:
      - {text: "Non : les chemins sont relatifs au dossier du fichier source et ne peuvent pas contenir « .. »", correct: true}
      - {text: "Oui : les chemins sont relatifs à la racine du module, et « .. » y est permis", correct: false}
      - {text: "Oui, à condition que le dossier parent appartienne au même module", correct: false}
      - {text: "Non : `//go:embed` n'accepte qu'un nom de fichier, sans aucun dossier", correct: false}
    answer: 'Non : les chemins sont relatifs au dossier du fichier source et ne peuvent pas contenir « .. » ; on place les fichiers sous ce dossier, ou on embarque depuis un package situé plus haut.'
  - key: vf-recompiler
    format: true-false
    question: Modifier un fichier embarqué change le contenu du binaire déjà compilé.
    truth: false
    answer: Le contenu est figé à la compilation.
  - key: vf-fonction
    format: true-false
    question: //go:embed peut s'appliquer à une variable locale d'une fonction.
    truth: false
    answer: Seulement à une variable du package.
  - key: vf-types
    format: true-false
    question: Une variable embarquée peut être de type string, []byte ou embed.FS.
    truth: true
    answer: string et []byte pour un seul fichier.
  - key: vf-caches
    format: true-false
    question: Par défaut, embarquer un dossier inclut ses fichiers qui commencent par un point.
    truth: false
    answer: Ils sont exclus, sauf avec le préfixe all:.
  - key: qcm-usages
    format: multiple-choice
    question: "Lesquels de ces usages de `//go:embed` sont courants et sûrs ?"
    choices:
      - text: Les migrations SQL d'un service
        correct: true
      - text: Les templates HTML et les fichiers statiques
        correct: true
      - text: Des secrets de production
        correct: false
      - text: Un fichier de configuration modifié à chaud
        correct: false
    answer: Un secret embarqué est lisible dans le binaire ; une configuration à chaud doit rester un fichier externe.
  - key: qcm-fs
    format: multiple-choice
    question: "Laquelle de ces opérations est impossible sur un `embed.FS` ?"
    choices:
      - {text: "Y écrire un fichier avec `os.WriteFile`", correct: true}
      - {text: "Y lire des templates avec `template.ParseFS`", correct: false}
      - {text: "Le parcourir avec `fs.ReadFile` et `fs.WalkDir`", correct: false}
      - {text: "Le servir en HTTP avec `http.FileServerFS`", correct: false}
    answer: "`embed.FS` est en lecture seule et implémente `fs.FS` : `template.ParseFS`, `fs.ReadFile`, `fs.WalkDir` et `http.FileServerFS` l'acceptent. On ne peut rien y écrire."
  - key: qcm-placement
    format: multiple-choice
    question: Où placer la directive //go:embed ?
    choices:
      - {text: "Juste au-dessus de la déclaration d'une variable du package", correct: true}
      - {text: "Dans le corps de `main`, juste avant d'utiliser les fichiers", correct: false}
      - {text: "Dans le `go.mod`, à côté des dépendances du module", correct: false}
      - {text: "En tête du fichier, avant la clause `package`", correct: false}
    answer: Le package embed doit aussi être importé (au moins avec _ pour string et []byte).
  - key: qcm-avantages
    format: multiple-choice
    question: "Quel avantage apporte l'embarquement des fichiers dans le binaire ?"
    choices:
      - {text: "Un seul binaire à déployer, sans fichier manquant au démarrage", correct: true}
      - {text: "Des fichiers modifiables sans recompiler le programme", correct: false}
      - {text: "Un binaire plus petit, car les fichiers y sont compressés", correct: false}
      - {text: "Des fichiers chiffrés, illisibles dans le binaire", correct: false}
    answer: "Tout tient dans un binaire : pas de fichier manquant ou désynchronisé au démarrage. En échange, le binaire grossit de la taille des fichiers, et les changer demande de recompiler."
  - key: trous-directive
    format: fill-in
    question: |-
      Complète pour embarquer les migrations :
      ```go
      //go:___ migrations/*.sql
      var migrations embed.FS
      ```
    blanks:
      - - embed
    answer: La directive //go:embed.
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type pour un dossier entier :
      ```go
      //go:embed static
      var statiques embed.___
      ```
    blanks:
      - - FS
    answer: embed.FS.
  - key: trous-parsefs
    format: fill-in
    question: |-
      Complète :
      ```go
      tmpl := template.Must(template.___(fichiers, "templates/*.html"))
      ```
    blanks:
      - - ParseFS
    answer: template.ParseFS lit depuis un fs.FS.
  - key: trous-all
    format: fill-in
    question: |-
      Complète pour inclure aussi les fichiers cachés :
      ```go
      //go:embed ___static
      var statiques embed.FS
      ```
    blanks:
      - - 'all:'
    answer: Le préfixe all:.
