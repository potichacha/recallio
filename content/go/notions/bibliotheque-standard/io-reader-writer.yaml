notion: io-reader-writer
lesson: "Deux interfaces d'une seule méthode sont au cœur des entrées-sorties en Go :\n\n```go\ntype Reader interface {\n\tRead(p []byte) (n int, err error) // remplit p, renvoie le nombre d'octets lus\n}\n\ntype Writer interface {\n\tWrite(p []byte) (n int, err error) // écrit p, renvoie le nombre d'octets écrits\n}\n```\n\nUn fichier, une connexion réseau, le corps d'une requête HTTP, un `strings.Reader`, un `bytes.Buffer`, un\ncompresseur gzip, un hash : tous sont des `Reader` ou des `Writer`. Une fonction qui accepte un `io.Reader`\nfonctionne donc avec **toutes** ces sources, et se teste avec un simple `strings.NewReader`.\n\nLes règles de `Read` :\n- il peut renvoyer **moins** d'octets que `len(p)`, même si d'autres arrivent ensuite ;\n- il peut renvoyer **des données et une erreur** en même temps : on traite toujours les `n` octets **avant**\n  l'erreur ;\n- la fin des données se signale par **`io.EOF`**, qui n'est pas une vraie erreur.\n\nOn écrit rarement la boucle de lecture soi-même ; le package `io` compose les flux :\n\n| Fonction | Rôle |\n|---|---|\n| `io.Copy(dst, src)` | recopie tout, par morceaux, sans tout charger en mémoire |\n| `io.ReadAll(r)` | lit tout en mémoire (à borner pour une source non fiable) |\n| `io.LimitReader(r, n)` | ne laisse passer que n octets |\n| `io.MultiReader(a, b)` | enchaîne des sources |\n| `io.TeeReader(r, w)` | recopie dans w ce qui est lu |\n| `io.MultiWriter(a, b)` | écrit dans plusieurs destinations |\n\n```go\n// télécharger, calculer le hash et écrire le fichier en un seul passage\nh := sha256.New()\n_, err := io.Copy(io.MultiWriter(fichier, h), resp.Body)\n```\n\n**En entretien** : « Deux interfaces d'une méthode ; Read peut lire moins et renvoyer données et erreur ; io.EOF\nmarque la fin ; on compose avec io.Copy, LimitReader, MultiWriter, et l'on accepte des io.Reader pour tester\nfacilement. »"
tour:
  - title: io.Reader et io.Writer
    text: |-
      `io.Reader` et `io.Writer` sont les deux interfaces des flux d'octets : un fichier, une connexion réseau, un
      `strings.Reader`, un tampon, la sortie standard. Une fonction qui prend un `io.Reader` lit depuis n'importe
      laquelle de ces sources.

      Elles se **composent** : `io.Copy` copie un Reader dans un Writer, `io.MultiWriter` écrit dans plusieurs Writers à
      la fois, et `io.LimitReader` coupe un flux après un nombre d'octets.
    example:
      files:
        main.go: |-
          package main

          import (
          	"bytes"
          	"fmt"
          	"io"
          	"os"
          	"strings"
          )

          func main() {
          	var copie bytes.Buffer
          	sortie := io.MultiWriter(os.Stdout, &copie)
          	source := io.LimitReader(strings.NewReader("Bonjour, les flux ! Et la suite..."), 19)
          	n, err := io.Copy(sortie, source)
          	fmt.Println()
          	fmt.Println(n, err, copie.Len())
          }
      output: |-
        Bonjour, les flux !
        19 <nil> 19
cards:
  - key: signifie-io-eof
    format: course
    question: "Que signifie `io.EOF` renvoyé par `Read` ?"
    choices:
      - {text: "La fin normale des données, pas une erreur à remonter", correct: true}
      - {text: "Une erreur de lecture, à remonter avec `%w` à l'appelant", correct: false}
      - {text: "Une coupure de connexion, après laquelle il faut réessayer", correct: false}
      - {text: "Un tampon trop petit, qu'il faut agrandir avant de relire", correct: false}
    answer: "`io.EOF` signale la fin normale de l'entrée : on arrête de lire, sans la remonter comme une erreur. `io.ErrUnexpectedEOF`, lui, dit que les données se sont arrêtées trop tôt."
  - key: read-renvoyer-donnees-erreur
    format: course
    question: "Un `Read` peut-il renvoyer à la fois des données et une erreur ?"
    choices:
      - {text: "Oui : on traite les `n` octets lus avant de regarder l'erreur", correct: true}
      - {text: "Non : quand l'erreur n'est pas nil, `n` vaut toujours 0", correct: false}
      - {text: "Oui, mais seulement si l'erreur est autre chose que `io.EOF`", correct: false}
      - {text: "Non : une erreur annule la lecture et remet le tampon à zéro", correct: false}
    answer: "Oui : `Read` peut renvoyer `n > 0` avec une erreur, `io.EOF` compris. On traite d'abord `buf[:n]`, puis l'on regarde l'erreur, sinon les derniers octets se perdent."
  - key: io-readall-etre-dangereux
    format: course
    question: "Pourquoi `io.ReadAll` peut-il être dangereux ?"
    choices:
      - {text: "Il charge tout en mémoire : une entrée non fiable doit être bornée", correct: true}
      - {text: "Il ne lit que les 512 premiers octets, et tronque le reste", correct: false}
      - {text: "Il ferme la source après lecture, ce qui casse les appels suivants", correct: false}
      - {text: "Il n'est pas sûr en concurrence, même sur des sources distinctes", correct: false}
    answer: "`io.ReadAll` garde toute l'entrée en mémoire : un corps de 10 Go fait tomber le service. On borne les entrées non fiables avec `io.LimitReader` ou `http.MaxBytesReader`, ou l'on traite en flux."
  - key: dois-telecharger-fichier-plusieurs-sauvegarder
    format: scenario
    question: "Tu dois télécharger un fichier de plusieurs Go et le sauvegarder sur disque. Comment fais-tu ?"
    choices:
      - {text: "`io.Copy` du corps vers un fichier temporaire, puis `os.Rename` vers la destination", correct: true}
      - {text: "`io.ReadAll` du corps, puis `os.WriteFile` vers le fichier de destination", correct: false}
      - {text: "`io.ReadAll` du corps dans une goroutine, pour ne pas bloquer le programme", correct: false}
      - {text: "Une goroutine par mégaoctet, qui écrit chacune sa partie avec `WriteAt`", correct: false}
    answer: "Jamais d'`io.ReadAll` : `io.Copy` recopie en flux, avec un tampon de taille fixe, donc une mémoire constante. J'écris dans un fichier temporaire du même dossier, je vérifie l'erreur de `Close`, puis je le renomme, pour qu'un lecteur ne voie jamais un fichier partiel ; une somme de contrôle et une limite de taille si la source n'est pas fiable."
  - key: accepter
    format: course
    question: Pourquoi une fonction devrait-elle accepter un io.Reader plutôt qu'un nom de fichier ?
    choices:
      - {text: "Elle marche avec toute source (fichier, HTTP, chaîne) et se teste sans fichier", correct: true}
      - {text: "Elle est plus rapide, car un `io.Reader` lit tout le fichier d'un coup", correct: false}
      - {text: "Elle n'a plus d'erreur à gérer, puisque l'appelant a ouvert le fichier", correct: false}
      - {text: "Elle peut relire les données plusieurs fois, ce qu'un fichier interdit", correct: false}
    answer: Elle fonctionne alors avec toute source (fichier, requête HTTP, chaîne, connexion, flux compressé), et se teste avec un simple strings.NewReader, sans fichier sur le disque.
  - key: vf-moins
    format: true-false
    question: Un appel à Read peut renvoyer moins d'octets que la taille du tampon, sans erreur.
    truth: true
    answer: Il faut boucler, ou utiliser io.ReadFull ou io.Copy.
  - key: vf-eof
    format: true-false
    question: '`io.EOF` signale une panne de lecture qu''il faut journaliser comme une erreur.'
    truth: false
    answer: C'est la fin normale des données.
  - key: vf-copy
    format: true-false
    question: '`io.Copy` charge toute la source en mémoire avant d''écrire.'
    truth: false
    answer: Il recopie par morceaux (32 Ko par défaut).
  - key: vf-donnees-erreur
    format: true-false
    question: Si Read renvoie n > 0 et une erreur, il faut traiter les n octets avant l'erreur.
    truth: true
    answer: Sinon on perd les dernières données.
  - key: qcm-implementations
    format: multiple-choice
    question: "Lequel de ces types n'est pas un `io.Reader` ?"
    choices:
      - {text: "`string`", correct: true}
      - {text: "`*os.File`", correct: false}
      - {text: "Le corps d'une réponse HTTP (`resp.Body`)", correct: false}
      - {text: "`*strings.Reader`, renvoyé par `strings.NewReader`", correct: false}
    answer: "Une `string` n'a pas de méthode `Read` : `strings.NewReader` l'enveloppe dans un `*strings.Reader`. Les fichiers et les corps HTTP sont des `io.Reader`."
  - key: qcm-borner
    format: multiple-choice
    question: "Lesquelles de ces lectures du corps d'une requête évitent d'épuiser la mémoire ?"
    choices:
      - text: '`io.ReadAll(io.LimitReader(r.Body, 1<<20))`'
        correct: true
      - text: '`http.MaxBytesReader(w, r.Body, 1<<20)`'
        correct: true
      - text: '`io.ReadAll(r.Body)` sans limite'
        correct: false
      - text: Lire octet par octet jusqu'à la fin
        correct: false
    answer: Un client peut envoyer des gigaoctets ; on borne toujours.
  - key: qcm-composer
    format: multiple-choice
    question: "Lesquelles de ces lignes écrivent un téléchargement dans un fichier tout en calculant son hash, en un seul passage ?"
    choices:
      - text: '`io.Copy(io.MultiWriter(f, h), body)`'
        correct: true
      - text: '`io.Copy(f, io.TeeReader(body, h))`'
        correct: true
      - text: Lire tout en mémoire, puis écrire et hacher
        correct: false
      - text: Télécharger deux fois
        correct: false
    answer: Les deux premières font un seul passage sans tout charger.
  - key: qcm-eof
    format: multiple-choice
    question: "Comment reconnaître la fin des données, quand l'erreur a pu être enveloppée ?"
    choices:
      - {text: "`errors.Is(err, io.EOF)`", correct: true}
      - {text: "`n == 0`, sans regarder l'erreur", correct: false}
      - {text: "`err.Error() == \"EOF\"`", correct: false}
      - {text: "`err != nil`, quelle qu'elle soit", correct: false}
    answer: "`errors.Is` reconnaît `io.EOF` même enveloppé ; `err == io.EOF` suffit pour l'erreur que `Read` renvoie directement. `n == 0` sans erreur ne signifie pas la fin, et comparer des messages est fragile."
  - key: trous-copy
    format: fill-in
    question: |-
      Complète pour recopier le corps dans le fichier :
      ```go
      if _, err := io.___(f, resp.Body); err != nil {
      	return err
      }
      ```
    blanks:
      - - Copy
    answer: io.Copy recopie par morceaux.
  - key: trous-eof
    format: fill-in
    question: |-
      Complète la boucle de lecture :
      ```go
      for {
      	n, err := r.Read(buf)
      	traiter(buf[:n])
      	if err == io.___ {
      		break
      	}
      	if err != nil {
      		return err
      	}
      }
      ```
    blanks:
      - - EOF
    answer: io.EOF marque la fin.
  - key: trous-limit
    format: fill-in
    question: |-
      Complète pour lire au plus 1 Mo :
      ```go
      donnees, err := io.ReadAll(io.___(r, 1<<20))
      ```
    blanks:
      - - LimitReader
    answer: LimitReader borne la lecture.
  - key: trous-interface
    format: fill-in
    question: |-
      Complète la signature pour accepter toute source :
      ```go
      func CompterLignes(r io.___) (int, error)
      ```
    blanks:
      - - Reader
    answer: io.Reader.
  - key: code-copy
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      n, err := io.Copy(os.Stdout, strings.NewReader("bonjour\n"))
      fmt.Println(n, err)
      ```
    choices:
      - text: |-
          ```
          bonjour
          8 <nil>
          ```
        correct: true
      - text: |-
          ```
          bonjour
          7 <nil>
          ```
        correct: false
      - {text: "`8 <nil>`", correct: false}
      - text: |-
          ```
          bonjour
          8 EOF
          ```
        correct: false
    answer: '`bonjour` puis `8 <nil>` : io.Copy renvoie le nombre d''octets recopiés.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"os\"\n\t\"strings\"\n)\n\nfunc main() {\n\tn, err := io.Copy(os.Stdout, strings.NewReader(\"bonjour\\n\"))\n\tfmt.Println(n, err)\n}\n"
      output: |-
        bonjour
        8 <nil>
  - key: code-limit
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      donnees, _ := io.ReadAll(io.LimitReader(strings.NewReader("abcdefgh"), 3))
      fmt.Println(string(donnees))
      ```
    choices:
      - {text: "`abc`", correct: true}
      - {text: "`abcdefgh`", correct: false}
      - {text: "`ab`", correct: false}
      - {text: "`abcd`", correct: false}
    answer: '`abc` : LimitReader ne laisse passer que trois octets.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tdonnees, _ := io.ReadAll(io.LimitReader(strings.NewReader(\"abcdefgh\"), 3))\n\tfmt.Println(string(donnees))\n}\n"
      output: abc
  - key: code-multi
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := io.MultiReader(strings.NewReader("go"), strings.NewReader("pher"))
      var b strings.Builder
      io.Copy(&b, r)
      fmt.Println(b.String())
      ```
    choices:
      - {text: "`gopher`", correct: true}
      - {text: "`go`", correct: false}
      - {text: "`pher`", correct: false}
      - {text: "`go pher`", correct: false}
    answer: '`gopher` : MultiReader enchaîne les sources ; strings.Builder est un io.Writer.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := io.MultiReader(strings.NewReader(\"go\"), strings.NewReader(\"pher\"))\n\tvar b strings.Builder\n\tio.Copy(&b, r)\n\tfmt.Println(b.String())\n}\n"
      output: gopher
  - key: code-lecture-partielle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := strings.NewReader("abcde")
      buf := make([]byte, 2)
      for {
      	n, err := r.Read(buf)
      	fmt.Printf("%q ", buf[:n])
      	if err == io.EOF {
      		break
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`\"ab\" \"cd\" \"e\" \"\"`", correct: true}
      - {text: "`\"ab\" \"cd\" \"e\"`", correct: false}
      - {text: "`\"ab\" \"cd\" \"ed\"`", correct: false}
      - {text: "`\"ab\" \"cd\" \"e\" \"e\"`", correct: false}
    answer: '`"ab" "cd" "e" ""` : le dernier morceau est court, puis un Read renvoie 0 et io.EOF.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := strings.NewReader(\"abcde\")\n\tbuf := make([]byte, 2)\n\tfor {\n\t\tn, err := r.Read(buf)\n\t\tfmt.Printf(\"%q \", buf[:n])\n\t\tif err == io.EOF {\n\t\t\tbreak\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: '"ab" "cd" "e" ""'
  - key: bug-readall
    format: bug-fix
    question: |-
      Un client malveillant fait tomber le service en envoyant un corps de 10 Go. Quelle correction est la bonne ?
      ```go
      donnees, err := io.ReadAll(r.Body)
      ```
    choices:
      - {text: "Envelopper `r.Body` dans `http.MaxBytesReader(w, r.Body, 1<<20)` avant de lire", correct: true}
      - {text: "Lire le corps dans une goroutine, pour ne pas bloquer le serveur", correct: false}
      - {text: "Remplacer `io.ReadAll` par `bufio.NewReader(r.Body)`, qui lit par tampon", correct: false}
      - {text: "Vérifier que `r.ContentLength` est positif avant de lire le corps", correct: false}
    answer: "```go\nr.Body = http.MaxBytesReader(w, r.Body, 1<<20)\ndonnees, err := io.ReadAll(r.Body)\nif err != nil {\n\thttp.Error(w, \"corps trop volumineux\", http.StatusRequestEntityTooLarge)\n\treturn\n}\n```\nLe corps est borné à 1 Mo ; au-delà, la lecture échoue au lieu d'épuiser la mémoire."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Les derniers octets du fichier ne sont jamais traités. Quelle correction est la bonne ?
      ```go
      for {
      	n, err := r.Read(buf)
      	if err != nil {
      		break
      	}
      	traiter(buf[:n])
      }
      ```
    choices:
      - {text: "Traiter `buf[:n]` avant de regarder l'erreur, puis distinguer `io.EOF`", correct: true}
      - {text: "Agrandir `buf`, pour lire tout le fichier en un seul `Read`", correct: false}
      - {text: "Traiter `buf` en entier, et non `buf[:n]`, à chaque tour", correct: false}
      - {text: "Remplacer `break` par `continue`, pour relire après l'erreur", correct: false}
    answer: "```go\nfor {\n\tn, err := r.Read(buf)\n\ttraiter(buf[:n])\n\tif err == io.EOF {\n\t\tbreak\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n}\n```\nRead peut renvoyer des données avec io.EOF ; on traite les n octets avant de regarder l'erreur (et l'on ne\nconfond plus la fin avec une vraie erreur)."
  - key: bug-fichier
    format: bug-fix
    question: |-
      Cette fonction est impossible à tester sans créer de fichier. Quelle correction est la bonne ?
      ```go
      func Compter(chemin string) (int, error) {
      	f, err := os.Open(chemin)
      	if err != nil {
      		return 0, err
      	}
      	defer f.Close()
      	// ... lit f ligne par ligne
      }
      ```
    choices:
      - {text: "Lui faire accepter un `io.Reader`, et laisser l'ouverture du fichier à l'appelant", correct: true}
      - {text: "Créer un fichier temporaire avec `os.CreateTemp` dans chacun des tests", correct: false}
      - {text: "Lui faire accepter un `*os.File` déjà ouvert, plutôt qu'un chemin", correct: false}
      - {text: "Remplacer `os.Open` par une variable globale, changée dans les tests", correct: false}
    answer: "```go\nfunc Compter(r io.Reader) (int, error) {\n\tsc := bufio.NewScanner(r)\n\tn := 0\n\tfor sc.Scan() {\n\t\tn++\n\t}\n\treturn n, sc.Err()\n}\n```\nEn acceptant un io.Reader, la fonction se teste avec strings.NewReader ; l'ouverture du fichier reste chez\nl'appelant."
  - key: bug-memoire
    format: bug-fix
    question: |-
      La copie d'une sauvegarde de 4 Go fait exploser la mémoire. Quelle correction est la bonne ?
      ```go
      donnees, err := io.ReadAll(src)
      if err != nil {
      	return err
      }
      _, err = dst.Write(donnees)
      ```
    choices:
      - {text: "`io.Copy(dst, src)`, qui recopie par morceaux", correct: true}
      - {text: "`io.ReadAll` dans une goroutine séparée", correct: false}
      - {text: "`dst.Write` appelé deux fois, sur chaque moitié", correct: false}
      - {text: "`runtime.GC()` juste après le `io.ReadAll`", correct: false}
    answer: |-
      ```go
      _, err := io.Copy(dst, src)
      ```
      io.Copy recopie par morceaux, avec une mémoire constante.
  - key: scenario-proxy
    format: scenario
    question: Ton service relaie des fichiers depuis un stockage objet vers le client HTTP. Comment le fais-tu efficacement ?
    choices:
      - {text: "`io.Copy(w, objet.Body)` en flux, avec le contexte de la requête pour arrêter si le client part", correct: true}
      - {text: "Télécharger l'objet entier avec `io.ReadAll`, puis l'écrire d'un coup dans la réponse", correct: false}
      - {text: "Copier l'objet sur le disque local, puis le servir au client avec `http.ServeFile`", correct: false}
      - {text: "Lire l'objet octet par octet avec `Read` et appeler `Flush` après chaque octet écrit", correct: false}
    answer: "`io.Copy(w, objet.Body)` fait passer les octets par morceaux, avec une mémoire constante. J'envoie d'abord les en-têtes utiles (taille, type), je ferme le corps en defer et je passe le contexte de la requête à l'appel au stockage ; un `TeeReader` calcule un hash au passage si besoin."
  - key: scenario-api
    format: scenario
    question: Comment conçois-tu l'API d'une bibliothèque qui lit un format de fichier maison ?
    choices:
      - {text: "Un `NewReader(r io.Reader)` qui renvoie un lecteur du format, comme `csv.NewReader`", correct: true}
      - {text: "Une fonction `Lire(chemin string)` qui ouvre et lit tout le fichier d'un coup", correct: false}
      - {text: "Une fonction `Lire(donnees []byte)` qui exige le fichier entier en mémoire", correct: false}
      - {text: "Une variable globale `Fichier`, que l'appelant remplit avant d'appeler `Lire`", correct: false}
    answer: "Un `NewReader(r io.Reader)` qui renvoie un lecteur du format, avec une méthode `Read` ou un itérateur, comme `csv.NewReader` ou `json.NewDecoder`. L'appelant fournit un fichier, une connexion ou un flux décompressé ; les tests passent des chaînes."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce qui rend `io.Reader` et `io.Writer` si importants en Go. Que réponds-tu ?"
    choices:
      - {text: "Deux interfaces minuscules, satisfaites par des dizaines de types, qui se composent en flux", correct: true}
      - {text: "Ce sont les seules interfaces que le compilateur optimise sans aucune allocation", correct: false}
      - {text: "Elles sont obligatoires pour tout type qui manipule des octets dans un programme Go", correct: false}
      - {text: "Elles garantissent que toute lecture est sûre entre plusieurs goroutines à la fois", correct: false}
    answer: "Ce sont des interfaces d'une méthode, satisfaites implicitement par les fichiers, le réseau, HTTP, la compression, le hachage... Une fonction écrite pour un `io.Reader` marche avec tous, et `io.Copy`, `MultiWriter` ou `TeeReader` les composent comme des tuyaux Unix, sans tout charger en mémoire."
