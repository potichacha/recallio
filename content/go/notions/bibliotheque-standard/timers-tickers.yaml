notion: timers-tickers
lesson: "Le package `time` fournit des minuteurs qui délivrent leurs signaux sur des **channels** :\n\n| Outil | Effet |\n|---|---|\n| `time.After(d)` | un channel qui reçoit une valeur une fois, après d |\n| `time.NewTimer(d)` | idem, avec `Stop` et `Reset` |\n| `time.AfterFunc(d, f)` | appelle f dans sa propre goroutine après d |\n| `time.NewTicker(d)` | un channel qui reçoit une valeur toutes les d |\n| `time.Tick(d)` | un ticker sans possibilité de l'arrêter |\n\n```go\ntick := time.NewTicker(30 * time.Second)\ndefer tick.Stop()\nfor {\n\tselect {\n\tcase <-tick.C:\n\t\trafraichir()\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\n\n**Depuis Go 1.23** (modules en `go 1.23` ou plus) :\n- les timers et tickers **non référencés** sont ramassés par le GC même sans `Stop` : `time.After` dans une boucle ne\n  fuit plus ;\n- leurs channels sont **non bufferisés** : après `Stop` ou `Reset`, aucune valeur périmée ne peut être reçue, et\n  l'ancien motif « vider le channel avant Reset » est inutile.\n\nLes règles restantes :\n- `defer tick.Stop()` reste une bonne habitude pour un ticker : il dit l'intention et libère tout de suite ;\n- un ticker **saute** les tics si le traitement est plus long que la période (il ne les accumule pas) ;\n- pour une attente annulable, `select` avec `time.After` (ou un `context.WithTimeout`) plutôt que `time.Sleep` ;\n- dans les tests, `testing/synctest` (Go 1.25) fait avancer une horloge virtuelle : un test avec un ticker de\n  5 minutes s'exécute instantanément.\n\n**En entretien** : « After et Timer pour une fois, Ticker pour une période, AfterFunc pour un rappel ; Stop en defer ;\nGo 1.23 : timers ramassés sans Stop et channels sans valeur périmée ; select pour combiner avec le contexte. »"
cards:
  - key: change-1-23-timers
    format: course
    question: Qu'a changé Go 1.23 pour les timers ?
    choices:
      - {text: "Des channels non bufferisés, sans valeur périmée après `Stop`, et des timers inutilisés ramassés", correct: true}
      - {text: "Les timers sont devenus sûrs en concurrence, ce qu'ils n'étaient pas auparavant", correct: false}
      - {text: "`time.After` a été retiré, au profit d'un `time.NewTimer` désormais obligatoire", correct: false}
      - {text: "Les tickers cumulent désormais les tics manqués, pour n'en perdre plus aucun", correct: false}
    answer: "Depuis Go 1.23, le channel d'un timer est non bufferisé : après `Stop` ou `Reset`, aucune valeur périmée n'y attend. Et un timer ou un ticker que plus rien ne référence est ramassé, même sans `Stop`."
  - key: saute
    format: course
    question: Que fait un Ticker quand le traitement dure plus longtemps que sa période ?
    choices:
      - {text: "Il ne cumule pas les tics : ceux qu'il manque sont perdus, et le rythme se recale", correct: true}
      - {text: "Il accumule les tics manqués dans son channel, livrés ensuite d'affilée", correct: false}
      - {text: "Il s'arrête de lui-même, et il faut le relancer avec `Reset`", correct: false}
      - {text: "Il attend que le traitement lise le tic, puis double sa période", correct: false}
    answer: 'Il ne cumule pas les tics : son channel garde au plus une valeur en attente (ou aucune depuis Go 1.23), et les tics manqués sont perdus ; le rythme se recale sur la période.'
  - key: afterfunc
    format: course
    question: "Que fait `time.AfterFunc(d, f)` ?"
    choices:
      - {text: "Il appelle `f` dans sa propre goroutine après `d`, et renvoie un `*Timer` annulable", correct: true}
      - {text: "Il appelle `f` dans la goroutine courante après `d`, qui reste bloquée jusque-là", correct: false}
      - {text: "Il appelle `f` toutes les `d`, jusqu'à l'appel de `Stop` sur le timer renvoyé", correct: false}
      - {text: "Il renvoie un channel qui reçoit le résultat de `f` une fois `d` écoulée", correct: false}
    answer: Il appelle la fonction dans sa propre goroutine une fois le délai écoulé, et renvoie un *Timer dont Stop annule l'appel s'il n'a pas encore eu lieu.
  - key: sleep
    format: course
    question: "Pourquoi préférer un `select` avec `time.After` à `time.Sleep` dans un service ?"
    choices:
      - {text: "`Sleep` ne s'interrompt pas ; un `select` sur `ctx.Done()` arrête l'attente dès l'annulation", correct: true}
      - {text: "`Sleep` bloque tout le programme, alors que `select` ne bloque que la goroutine courante", correct: false}
      - {text: "`Sleep` consomme du processeur pendant l'attente, contrairement à `time.After`", correct: false}
      - {text: "`Sleep` est imprécis de plusieurs secondes, alors que `time.After` est exact", correct: false}
    answer: Sleep ne peut pas être interrompu ; un select qui attend aussi ctx.Done() permet d'arrêter l'attente dès l'annulation, par exemple à l'arrêt du service.
  - key: vf-123-gc
    format: true-false
    question: Depuis Go 1.23, un Timer non référencé est ramassé par le GC même s'il n'a pas été arrêté.
    truth: true
    answer: Pour les modules qui déclarent go 1.23 ou plus.
  - key: vf-tick
    format: true-false
    question: Un ticker créé par time.Tick peut être arrêté.
    truth: false
    answer: Il n'expose pas de Stop ; NewTicker le permet.
  - key: vf-afterfunc
    format: true-false
    question: La fonction passée à time.AfterFunc s'exécute dans la goroutine qui a créé le timer.
    truth: false
    answer: Dans sa propre goroutine.
  - key: vf-perime
    format: true-false
    question: Depuis Go 1.23, après Reset d'un Timer, on ne peut pas recevoir une valeur périmée de l'ancien délai.
    truth: true
    answer: Les channels des timers sont devenus non bufferisés.
  - key: qcm-choisir
    format: multiple-choice
    question: "Quel outil choisis-tu pour rafraîchir un cache toutes les 5 minutes, jusqu'à l'arrêt du service ?"
    choices:
      - {text: "Un `time.NewTicker`, arrêté par `Stop` et lu dans un `select` avec `ctx.Done()`", correct: true}
      - {text: "Un `time.AfterFunc` de 5 minutes, qui se relance de lui-même ensuite", correct: false}
      - {text: "Une boucle avec `time.Sleep(5 * time.Minute)`, simple et annulable", correct: false}
      - {text: "Un `time.After(5 * time.Minute)`, créé une seule fois avant la boucle", correct: false}
    answer: "Un ticker donne un tic toutes les 5 minutes ; avec un `select` sur `ctx.Done()`, la boucle s'arrête dès l'annulation. `AfterFunc` ne part qu'une fois, `Sleep` ne s'interrompt pas, et un seul `time.After` ne livre qu'une valeur."
  - key: qcm-tests
    format: multiple-choice
    question: "Lesquelles de ces solutions testent un code qui utilise un ticker de 5 minutes, sans attendre ?"
    choices:
      - text: '`testing/synctest` (Go 1.25), avec son horloge virtuelle'
        correct: true
      - text: Rendre la période configurable et la réduire dans le test
        correct: true
      - text: Attendre 5 minutes dans le test
        correct: false
      - text: Modifier l'heure du système
        correct: false
    answer: Dans une bulle synctest, le temps avance dès que toutes les goroutines sont bloquées.
  - key: qcm-stop
    format: multiple-choice
    question: "Que renvoie `t.Stop()` sur un timer qui s'était déjà déclenché ?"
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "La durée restante, soit zéro", correct: false}
      - {text: "L'erreur `time.ErrStopped`", correct: false}
    answer: "`Stop` renvoie `true` s'il a empêché le déclenchement, `false` si le timer s'était déjà déclenché ou était arrêté. Avec `AfterFunc`, `true` signifie que la fonction ne sera pas appelée."
  - key: qcm-boucle
    format: multiple-choice
    question: "Un serveur utilise `select { case m := <-msgs: ... case <-time.After(time.Minute): ... }` dans une boucle très rapide. Qu'en penser depuis Go 1.23 ?"
    choices:
      - {text: "Les timers inutilisés sont ramassés ; un seul `Timer` avec `Reset` évite encore une allocation par tour", correct: true}
      - {text: "Chaque tour garde son timer en mémoire une minute entière : une fuite qui grossit sans fin", correct: false}
      - {text: "Chaque tour bloque la boucle une minute entière, même quand un message est déjà arrivé", correct: false}
      - {text: "Ça ne compile pas : `time.After` est interdit dans un `select` placé dans une boucle", correct: false}
    answer: "Avant Go 1.23, chaque timer restait en mémoire jusqu'à son échéance ; depuis, ceux qui ne servent plus sont ramassés. Réutiliser un seul `Timer` avec `Reset` évite quand même une allocation par tour."
  - key: trous-ticker
    format: fill-in
    question: |-
      Complète :
      ```go
      tick := time.___(time.Minute)
      defer tick.___()
      ```
    blanks:
      - - NewTicker
      - - Stop
    answer: NewTicker puis defer Stop.
  - key: trous-c
    format: fill-in
    question: |-
      Complète la réception du tic :
      ```go
      select {
      case <-tick.___:
      	rafraichir()
      case <-ctx.Done():
      	return
      }
      ```
    blanks:
      - - C
    answer: Le champ C est le channel du ticker.
  - key: trous-after
    format: fill-in
    question: |-
      Complète pour abandonner après 2 secondes :
      ```go
      select {
      case r := <-resultat:
      	return r, nil
      case <-time.___(2 * time.Second):
      	return nil, ErrDelai
      }
      ```
    blanks:
      - - After
    answer: time.After.
  - key: trous-reset
    format: fill-in
    question: |-
      Complète pour repousser l'échéance d'inactivité :
      ```go
      minuteur.___(30 * time.Second)
      ```
    blanks:
      - - Reset
    answer: Reset relance le timer.
  - key: bug-sleep
    format: bug-fix
    question: |-
      L'arrêt du service prend jusqu'à 5 minutes. Quelle correction est la bonne ?
      ```go
      for {
      	synchroniser()
      	time.Sleep(5 * time.Minute)
      }
      ```
    choices:
      - {text: "Un ticker et un `select` qui attend le tic ou `ctx.Done()`", correct: true}
      - {text: "Un `time.Sleep(time.Minute)`, cinq fois plus court", correct: false}
      - {text: "Tester `ctx.Err()` juste avant le `time.Sleep`", correct: false}
      - {text: "Lancer `synchroniser` dans une nouvelle goroutine", correct: false}
    answer: "```go\ntick := time.NewTicker(5 * time.Minute)\ndefer tick.Stop()\nfor {\n\tsynchroniser()\n\tselect {\n\tcase <-tick.C:\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\nLe sommeil ne pouvait pas être interrompu ; le select attend le tic ou l'annulation."
  - key: bug-tick
    format: bug-fix
    question: |-
      Ce flux d'abonné ne réagit à l'annulation qu'au tic suivant, et son ticker n'est jamais arrêté. Quelle correction est la bonne ?
      ```go
      func (s *Serveur) abonner(ctx context.Context, w io.Writer) {
      	for t := range time.Tick(time.Second) {
      		if ctx.Err() != nil {
      			return
      		}
      		fmt.Fprintln(w, t)
      	}
      }
      ```
    choices:
      - {text: "Un `time.NewTicker` arrêté par `defer Stop`, et un `select` sur `tick.C` et `ctx.Done()`", correct: true}
      - {text: "Garder `time.Tick`, mais tester `ctx.Err()` après l'écriture plutôt qu'avant", correct: false}
      - {text: "Remplacer `time.Tick(time.Second)` par `time.After(time.Second)` dans le `range`", correct: false}
      - {text: "Lancer la boucle dans une goroutine, qui s'arrêtera en même temps que le serveur", correct: false}
    answer: "```go\nfunc (s *Serveur) abonner(ctx context.Context, w io.Writer) {\n\ttick := time.NewTicker(time.Second)\n\tdefer tick.Stop()\n\tfor {\n\t\tselect {\n\t\tcase t := <-tick.C:\n\t\t\tfmt.Fprintln(w, t)\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\t}\n\t}\n}\n```\nUn ticker arrêtable et un select : la goroutine part dès l'annulation, sans attendre le tic suivant."
  - key: bug-afterfunc
    format: bug-fix
    question: |-
      La session est parfois supprimée alors que l'utilisateur vient de se reconnecter. Quelle correction est la bonne ?
      ```go
      func (s *Sessions) Deconnecter(id string) {
      	time.AfterFunc(10*time.Minute, func() { s.supprimer(id) })
      }

      func (s *Sessions) Reconnecter(id string) { s.marquerActive(id) }
      ```
    choices:
      - {text: "Garder le `*Timer` de chaque session, et l'arrêter avec `Stop` à la reconnexion", correct: true}
      - {text: "Remplacer `time.AfterFunc` par `time.Sleep` dans une nouvelle goroutine", correct: false}
      - {text: "Dans `Reconnecter`, lancer un second `AfterFunc` de 10 minutes", correct: false}
      - {text: "Allonger le délai à une heure, pour laisser le temps de revenir", correct: false}
    answer: "```go\nfunc (s *Sessions) Deconnecter(id string) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.expirations[id] = time.AfterFunc(10*time.Minute, func() { s.supprimer(id) })\n}\n\nfunc (s *Sessions) Reconnecter(id string) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tif t, ok := s.expirations[id]; ok {\n\t\tt.Stop()\n\t\tdelete(s.expirations, id)\n\t}\n\ts.marquerActive(id)\n}\n```\nLe timer n'était jamais annulé ; on le garde pour l'arrêter à la reconnexion."
  - key: bug-intervalle
    format: bug-fix
    question: |-
      Le cache est rafraîchi plusieurs fois par seconde. Quelle correction est la bonne ?
      ```go
      tick := time.NewTicker(time.Duration(cfg.IntervalleMinutes))
      ```
    choices:
      - {text: "Multiplier par l'unité : `time.Duration(cfg.IntervalleMinutes) * time.Minute`", correct: true}
      - {text: "Remplacer `NewTicker` par `time.Tick`, qui compte en minutes", correct: false}
      - {text: "Ajouter `defer tick.Stop()`, qui espace les tics suivants", correct: false}
      - {text: "Lire `cfg.IntervalleMinutes` en `float64` avant la conversion", correct: false}
    answer: |-
      ```go
      tick := time.NewTicker(time.Duration(cfg.IntervalleMinutes) * time.Minute)
      ```
      Sans l'unité, la valeur était comprise comme des nanosecondes.
