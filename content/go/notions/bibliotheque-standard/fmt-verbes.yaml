notion: fmt-verbes
cards:
  - key: v-vs-v-vs-v
    format: course
    question: '%v vs %+v vs %#v ?'
    answer: Valeur par défaut / struct avec noms de champs / syntaxe Go.
  - key: controler-affichage-type-avec-fmt
    format: course
    question: Comment contrôler l'affichage d'un type avec fmt ?
    answer: En implémentant String() string (fmt.Stringer).
  - key: methode-string-provoquer-recursion-infinie
    format: course
    question: Pourquoi une méthode String peut-elle provoquer une récursion infinie ?
    answer: Si elle formate le receveur avec %v, qui rappelle String.
  - key: code-fmt-printf-v-v-p
    format: code-output
    question: '`fmt.Printf("%v %+v %T\n", P{1}, P{1}, P{1})`'
    answer: '`{1} {X:1} main.P`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tfmt.Printf(\"%v %+v %T\\n\", P{1}, P{1}, P{1})\n}\n"
      output: '{1} {X:1} main.P'
  - key: code-fmt-println-fmt-sprint-nil
    format: code-output
    question: '`fmt.Println(fmt.Sprint(nil), fmt.Sprintf("%d", 3.5))`'
    answer: '`<nil> %!d(float64=3.5)` : fmt ne panique pas sur un mauvais verbe, il l''indique dans la sortie (et `go vet` le signale avant).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(fmt.Sprint(nil), fmt.Sprintf(\"%d\", 3.5))\n}\n"
      output: <nil> %!d(float64=3.5)
