notion: fmt-verbes
lesson: |-
  Le package **`fmt`** formate avec des **verbes**, comme printf en C, mais en connaissant les types Go.

  | Verbe | Affiche | `P{X: 1, Y: 2}` |
  |---|---|---|
  | `%v` | la valeur, au format par défaut | `{1 2}` |
  | `%+v` | avec les noms des champs | `{X:1 Y:2}` |
  | `%#v` | en syntaxe Go | `main.P{X:1, Y:2}` |
  | `%T` | le type | `main.P` |
  | `%q` | une chaîne entre guillemets, échappée | `"a\tb"` |
  | `%d`, `%x`, `%b`, `%o` | un entier en décimal, hexadécimal, binaire, octal | |
  | `%f`, `%.2f`, `%e`, `%g` | un flottant | |
  | `%s` | une chaîne ou un `[]byte` | |
  | `%p` | une adresse | |
  | `%w` | une erreur enveloppée, dans `fmt.Errorf` seulement | |

  La **largeur** et la **précision** s'insèrent avant le verbe : `%8.2f` (8 caractères, 2 décimales), `%-10s`
  (aligné à gauche), `%05d` (complété par des zéros).

  Les familles de fonctions :
  - `Print`, `Println`, `Printf` : vers la sortie standard ;
  - `Sprint...` : renvoient une chaîne ;
  - `Fprint...` : vers un `io.Writer` (fichier, réponse HTTP, `os.Stderr`) ;
  - `Errorf` : construit une erreur.

  Un type contrôle son affichage en implémentant **`String() string`** (interface `fmt.Stringer`), utilisée par `%v` et
  `%s` ; `Error() string` a la priorité pour les erreurs. **Piège** : appeler `fmt.Sprintf("%v", p)` dans la méthode
  `String` de `p` provoque une récursion infinie.

  `go vet` vérifie que les verbes correspondent aux arguments (`%d` avec une chaîne, argument manquant).

  **En entretien** : « %v, %+v avec les champs, %#v en syntaxe Go, %T le type, %q entre guillemets ; Sprint, Fprint,
  Errorf ; String() pour personnaliser ; vet vérifie les formats. »
tour:
  - title: Les verbes de fmt
    text: |-
      `fmt.Printf` formate avec des **verbes** :

      - `%v` pour la valeur, `%+v` avec les noms des champs, `%#v` en syntaxe Go ; - `%T` pour le type ; - `%d` pour un
      entier, `%f` pour un flottant (`%.2f` : deux décimales), `%s` pour une chaîne, `%q` pour une chaîne entre
      guillemets ; - `%5d` ou `%-8s` pour une largeur, alignée à droite ou à gauche ; `%%` pour un signe pour cent.

      `fmt.Sprintf` renvoie la chaîne au lieu de l'afficher, et `fmt.Fprintf` l'écrit dans un `io.Writer`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Point struct{ X, Y int }

          func main() {
          	p := Point{1, 2}
          	fmt.Printf("%v | %+v | %#v | %T\n", p, p, p, p)
          	fmt.Printf("%d %.2f %s %q\n", 42, 3.14159, "go", "go")
          	fmt.Printf("[%5d] [%-8s] [%08.3f]\n", 42, "go", 3.14159)
          	message := fmt.Sprintf("%d%%", 75)
          	fmt.Println(message)
          }
      output: |-
        {1 2} | {X:1 Y:2} | main.Point{X:1, Y:2} | main.Point
        42 3.14 go "go"
        [   42] [go      ] [0003.142]
        75%
cards:
  - key: v-vs-v-vs-v
    format: course
    question: '%v vs %+v vs %#v ?'
    answer: Valeur par défaut / struct avec noms de champs / syntaxe Go.
  - key: controler-affichage-type-avec-fmt
    format: course
    question: Comment contrôler l'affichage d'un type avec fmt ?
    answer: En implémentant String() string (fmt.Stringer).
  - key: methode-string-provoquer-recursion-infinie
    format: course
    question: Pourquoi une méthode String peut-elle provoquer une récursion infinie ?
    answer: Si elle formate le receveur avec %v, qui rappelle String.
  - key: code-fmt-printf-v-v-p
    format: code-output
    question: '`fmt.Printf("%v %+v %T\n", P{1}, P{1}, P{1})`'
    answer: '`{1} {X:1} main.P`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tfmt.Printf(\"%v %+v %T\\n\", P{1}, P{1}, P{1})\n}\n"
      output: '{1} {X:1} main.P'
  - key: code-fmt-println-fmt-sprint-nil
    format: code-output
    question: '`fmt.Println(fmt.Sprint(nil), fmt.Sprintf("%d", 3.5))`'
    answer: '`<nil> %!d(float64=3.5)` : fmt ne panique pas sur un mauvais verbe, il l''indique dans la sortie (et `go vet` le signale avant).'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(fmt.Sprint(nil), fmt.Sprintf(\"%d\", 3.5))\n}\n"
      output: <nil> %!d(float64=3.5)
  - key: familles
    format: course
    question: Quelle différence entre Printf, Sprintf et Fprintf ?
    answer: Printf écrit sur la sortie standard, Sprintf renvoie la chaîne formatée, Fprintf écrit dans un io.Writer donné (fichier, réponse HTTP, os.Stderr).
  - key: vf-plus-v
    format: true-false
    question: '`%+v` affiche une struct avec les noms de ses champs.'
    truth: true
    answer: Par exemple {X:1 Y:2}.
  - key: vf-stringer
    format: true-false
    question: Si un type a une méthode `String() string`, `%v` l'utilise.
    truth: true
    answer: C'est l'interface fmt.Stringer.
  - key: vf-vet
    format: true-false
    question: Le compilateur refuse `fmt.Printf("%d", "texte")`.
    truth: false
    answer: Le code compile ; go vet le signale, et l'exécution affiche %!d(string=texte).
  - key: vf-w
    format: true-false
    question: Le verbe `%w` peut s'utiliser avec fmt.Printf.
    truth: false
    answer: Il n'a de sens que dans fmt.Errorf ; ailleurs il s'affiche comme une erreur de format.
  - key: qcm-verbes
    format: multiple-choice
    question: Quelles correspondances sont justes ?
    choices:
      - text: '`%T` affiche le type'
        correct: true
      - text: '`%q` affiche une chaîne entre guillemets'
        correct: true
      - text: '`%#v` affiche la valeur en syntaxe Go'
        correct: true
      - text: '`%s` affiche le type d''une struct'
        correct: false
    answer: '`%s` affiche une chaîne, ou la méthode String.'
  - key: qcm-largeur
    format: multiple-choice
    question: Que produit `fmt.Sprintf("%05.1f", 3.14159)` ?
    choices:
      - text: '`003.1`'
        correct: true
      - text: '`3.14159`'
        correct: false
      - text: '`00003`'
        correct: false
      - text: '`3.1`'
        correct: false
    answer: Largeur 5, une décimale, complété par des zéros.
  - key: qcm-recursion
    format: multiple-choice
    question: Pourquoi cette méthode boucle-t-elle à l'infini ? `func (p P) String() string { return fmt.Sprintf("%v", p) }`
    choices:
      - text: '`%v` sur p rappelle la méthode String de p'
        correct: true
      - text: Sprintf ne peut pas formater une struct
        correct: false
      - text: Le récepteur devrait être un pointeur
        correct: false
      - text: Elle ne boucle pas
        correct: false
    answer: On formate les champs (`p.X`, `p.Y`) ou l'on convertit vers un type sans méthode.
  - key: qcm-fprint
    format: multiple-choice
    question: Comment écrire un message d'erreur sur la sortie d'erreur ?
    choices:
      - text: '`fmt.Fprintln(os.Stderr, "erreur :", err)`'
        correct: true
      - text: '`log.Println("erreur :", err)`, qui écrit sur stderr par défaut'
        correct: true
      - text: '`fmt.Println(os.Stderr, err)`'
        correct: false
      - text: '`fmt.Errorf("erreur : %v", err)` seul'
        correct: false
    answer: Println afficherait l'adresse de os.Stderr ; Errorf construit une erreur sans l'afficher.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez pour afficher le type de v :
      ```go
      fmt.Printf("%___\n", v)
      ```
    blanks:
      - - T
    answer: '%T.'
  - key: trous-champs
    format: fill-in
    question: |-
      Complétez pour afficher la struct avec ses noms de champs :
      ```go
      fmt.Printf("%___v\n", commande)
      ```
    blanks:
      - - +
    answer: '%+v.'
  - key: trous-stringer
    format: fill-in
    question: "Complétez pour que fmt affiche un Statut lisible :\n```go\nfunc (s Statut) ___() string {\n\treturn noms[s]\n}\n```"
    blanks:
      - - String
    answer: La méthode String de fmt.Stringer.
  - key: trous-sprintf
    format: fill-in
    question: |-
      Complétez pour construire la chaîne sans l'afficher :
      ```go
      cle := fmt.___("%s:%d", nom, id)
      ```
    blanks:
      - - Sprintf
    answer: Sprintf renvoie la chaîne.
  - key: code-verbes
    format: code-output
    question: |-
      ```go
      fmt.Printf("%q %x %5.2f|%-4s|\n", "go", 255, 3.14159, "ab")
      ```
    answer: '`"go" ff  3.14|ab  |` : guillemets, hexadécimal, largeur 5 avec deux décimales, alignement à gauche sur 4.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Printf(\"%q %x %5.2f|%-4s|\\n\", \"go\", 255, 3.14159, \"ab\")\n}\n"
      output: '"go" ff  3.14|ab  |'
  - key: code-pointeur
    format: code-output
    question: |-
      ```go
      type P struct{ X, Y int }

      p := &P{1, 2}
      fmt.Printf("%v %+v %#v\n", p, *p, *p)
      ```
    answer: '`&{1 2} {X:1 Y:2} main.P{X:1, Y:2}` : un pointeur de struct s''affiche avec &.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X, Y int }\n\nfunc main() {\n\tp := &P{1, 2}\n\tfmt.Printf(\"%v %+v %#v\\n\", p, *p, *p)\n}\n"
      output: '&{1 2} {X:1 Y:2} main.P{X:1, Y:2}'
