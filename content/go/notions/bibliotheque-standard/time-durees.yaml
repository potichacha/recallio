notion: time-durees
lesson: |-
  Le package **`time`** distingue deux types :
  - **`time.Time`** : un instant, avec un fuseau horaire (`time.Now()`, `time.Date(2026, 11, 4, 9, 0, 0, 0, time.UTC)`) ;
  - **`time.Duration`** : une durée, un `int64` de **nanosecondes** (`90 * time.Minute`, `d.Seconds()`).

  ```go
  debut := time.Now()
  // ...
  ecoule := time.Since(debut)              // une Duration
  echeance := debut.Add(30 * time.Second)  // un Time
  if time.Now().After(echeance) { ... }
  delta := fin.Sub(debut)                  // Time - Time = Duration
  ```

  **Le formatage** n'utilise pas `yyyy-MM-dd` mais une **date de référence** : le **lundi 2 janvier 2006 à 15:04:05,
  fuseau MST** (moyen mnémotechnique : 1 2 3 4 5 6, soit mois 01, jour 02, heure 03 ou 15, minutes 04, secondes 05,
  année 06).

  ```go
  t.Format("2006-01-02 15:04")   // "2026-11-04 09:05"
  t.Format(time.RFC3339)         // "2026-11-04T09:05:00Z"
  time.Parse("02/01/2006", "04/11/2026")
  ```

  Les pièges :
  - comparer des instants avec **`t.Equal(u)`**, `Before`, `After`, pas avec `==` (qui compare aussi le fuseau et
    l'horloge monotone) ;
  - `time.Duration(5)` vaut **5 nanosecondes** : on écrit `5 * time.Second` ;
  - multiplier une durée par une variable entière demande une conversion : `time.Duration(n) * time.Second` ;
  - `time.Now()` contient une **horloge monotone**, utilisée par `Sub` et `Since` : une mesure de durée reste juste même
    si l'heure du système change ;
  - stocker et échanger en **UTC**, convertir dans le fuseau de l'utilisateur seulement pour l'affichage
    (`t.In(loc)`, `time.LoadLocation("Europe/Paris")`) ;
  - pour tester, injecter l'heure (une fonction ou une interface) plutôt que d'appeler `time.Now()` partout.

  **En entretien** : « Time pour un instant, Duration en nanosecondes ; formatage par la date de référence 2006-01-02
  15:04:05 ; Equal plutôt que == ; UTC en stockage ; horloge monotone pour mesurer. »
cards:
  - key: formater-date
    format: course
    question: Comment formater une date en Go ?
    answer: Par l'exemple, avec la date de référence `2006-01-02 15:04:05`.
  - key: comparer-deux-time-time
    format: course
    question: Comment comparer deux time.Time ?
    answer: Avec Equal, Before, After, pas avec ==.
  - key: horloge-monotone
    format: course
    question: C'est quoi l'horloge monotone ?
    answer: Une lecture incluse dans time.Now, utilisée par Sub et Since, insensible aux ajustements de l'horloge système.
  - key: vaut-time-duration-5
    format: course
    question: Que vaut time.Duration(5) ?
    answer: 5 nanosecondes.
  - key: code-fmt-println-time-duration-1500
    format: code-output
    question: '`fmt.Println(time.Duration(1500) * time.Millisecond)`'
    answer: '`1.5s`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tfmt.Println(time.Duration(1500) * time.Millisecond)\n}\n"
      output: 1.5s
  - key: vf-reference
    format: true-false
    question: Pour formater une date en Go, on écrit un modèle comme « yyyy-MM-dd ».
    truth: false
    answer: On écrit la date de référence dans le format voulu, par exemple « 2006-01-02 ».
  - key: vf-equal
    format: true-false
    question: Pour comparer deux instants, `t.Equal(u)` est plus sûr que `t == u`.
    truth: true
    answer: == compare aussi le fuseau et la lecture monotone.
  - key: vf-duration
    format: true-false
    question: Une time.Duration est un nombre de millisecondes.
    truth: false
    answer: De nanosecondes.
  - key: vf-monotone
    format: true-false
    question: Une durée mesurée avec time.Since reste juste si l'heure du système est corrigée pendant la mesure.
    truth: true
    answer: Grâce à l'horloge monotone contenue dans time.Now().
  - key: qcm-format
    format: multiple-choice
    question: Quels modèles de format sont corrects ?
    choices:
      - text: '`"2006-01-02"` pour une date ISO'
        correct: true
      - text: '`"15:04"` pour l''heure sur 24 h'
        correct: true
      - text: '`time.RFC3339` pour un horodatage standard'
        correct: true
      - text: '`"YYYY-MM-DD"`'
        correct: false
    answer: Le dernier serait recopié tel quel.
  - key: qcm-multiplier
    format: multiple-choice
    question: n est un int qui contient un nombre de secondes. Comment en faire une durée ?
    choices:
      - text: '`time.Duration(n) * time.Second`'
        correct: true
      - text: '`n * time.Second`'
        correct: false
      - text: '`time.Second(n)`'
        correct: false
      - text: '`time.Duration(n)`'
        correct: false
    answer: n * time.Second ne compile pas (types différents) ; time.Duration(n) seul donne des nanosecondes.
  - key: qcm-fuseaux
    format: multiple-choice
    question: Quelles pratiques sont recommandées avec les fuseaux horaires ?
    choices:
      - text: Stocker et échanger les instants en UTC
        correct: true
      - text: Convertir avec `t.In(loc)` pour l'affichage
        correct: true
      - text: Stocker l'heure locale du serveur
        correct: false
      - text: Ajouter une heure à la main pour l'heure d'été
        correct: false
    answer: time.LoadLocation connaît les changements d'heure.
  - key: qcm-operations
    format: multiple-choice
    question: Quelles opérations renvoient une time.Duration ?
    choices:
      - text: '`fin.Sub(debut)`'
        correct: true
      - text: '`time.Since(debut)`'
        correct: true
      - text: '`debut.Add(time.Hour)`'
        correct: false
      - text: '`time.Now()`'
        correct: false
    answer: Add et Now renvoient un time.Time.
  - key: trous-format
    format: fill-in
    question: |-
      Complétez pour afficher « 04/11/2026 » :
      ```go
      t.Format("02/01/___")
      ```
    blanks:
      - - '2006'
    answer: L'année de référence est 2006.
  - key: trous-since
    format: fill-in
    question: |-
      Complétez pour mesurer la durée :
      ```go
      debut := time.Now()
      traiter()
      log.Printf("durée : %v", time.___(debut))
      ```
    blanks:
      - - Since
    answer: time.Since.
  - key: trous-duree
    format: fill-in
    question: |-
      Complétez pour un délai de 3 secondes :
      ```go
      delai := 3 * time.___
      ```
    blanks:
      - - Second
    answer: time.Second.
  - key: trous-before
    format: fill-in
    question: "Complétez pour tester l'expiration :\n```go\nif jeton.Expiration.___(time.Now()) {\n\treturn ErrJetonExpire\n}\n```"
    blanks:
      - - Before
    answer: Before.
  - key: code-duree
    format: code-output
    question: |-
      ```go
      d := 90*time.Minute + 30*time.Second
      fmt.Println(d, d.Minutes())
      ```
    answer: '`1h30m30s 90.5`'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\td := 90*time.Minute + 30*time.Second\n\tfmt.Println(d, d.Minutes())\n}\n"
      output: 1h30m30s 90.5
  - key: code-format
    format: code-output
    question: |-
      ```go
      t := time.Date(2026, 11, 4, 9, 5, 0, 0, time.UTC)
      fmt.Println(t.Format("02/01/2006 15:04"), t.Weekday())
      ```
    answer: '`04/11/2026 09:05 Wednesday`'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tt := time.Date(2026, 11, 4, 9, 5, 0, 0, time.UTC)\n\tfmt.Println(t.Format(\"02/01/2006 15:04\"), t.Weekday())\n}\n"
      output: 04/11/2026 09:05 Wednesday
  - key: code-adddate
    format: code-output
    question: |-
      ```go
      t := time.Date(2026, 1, 31, 0, 0, 0, 0, time.UTC)
      fmt.Println(t.AddDate(0, 1, 0).Format("2006-01-02"))
      _, err := time.Parse("2006-01-02", "2026-02-30")
      fmt.Println(err != nil)
      ```
    answer: '`2026-03-03` puis `true` : le 31 février est normalisé en 3 mars, mais Parse refuse un 30 février.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tt := time.Date(2026, 1, 31, 0, 0, 0, 0, time.UTC)\n\tfmt.Println(t.AddDate(0, 1, 0).Format(\"2006-01-02\"))\n\t_, err := time.Parse(\"2006-01-02\", \"2026-02-30\")\n\tfmt.Println(err != nil)\n}\n"
      output: |-
        2026-03-03
        true
  - key: bug-format
    format: bug-fix
    question: |-
      Les dates s'affichent « YYYY-11-DD » :
      ```go
      t.Format("YYYY-MM-DD")
      ```
    answer: |-
      ```go
      t.Format("2006-01-02") // ou time.DateOnly
      ```
      Go formate par la date de référence ; time.DateOnly (Go 1.20) vaut "2006-01-02".
  - key: bug-nanosecondes
    format: bug-fix
    question: |-
      Le délai de reconnexion est quasi nul :
      ```go
      attente := time.Duration(cfg.DelaiSecondes)
      time.Sleep(attente)
      ```
    answer: |-
      ```go
      attente := time.Duration(cfg.DelaiSecondes) * time.Second
      time.Sleep(attente)
      ```
      Une Duration compte des nanosecondes : il faut multiplier par l'unité.
  - key: bug-egalite
    format: bug-fix
    question: "Un test échoue alors que les deux dates sont le même instant :\n```go\nif attendu != obtenu {\n\tt.Errorf(\"date %v, attendu %v\", obtenu, attendu)\n}\n```"
    answer: "```go\nif !attendu.Equal(obtenu) {\n\tt.Errorf(\"date %v, attendu %v\", obtenu, attendu)\n}\n```\n== compare aussi le fuseau et la lecture monotone ; Equal compare l'instant."
  - key: bug-local
    format: bug-fix
    question: |-
      Les rendez-vous enregistrés depuis le serveur de Singapour sont décalés de sept heures pour les clients de Paris :
      ```go
      rdv.Debut = time.Date(a, m, j, h, min, 0, 0, time.Local)
      ```
    answer: "```go\nparis, err := time.LoadLocation(\"Europe/Paris\")\nif err != nil {\n\treturn err\n}\nrdv.Debut = time.Date(a, m, j, h, min, 0, 0, paris).UTC()\n```\ntime.Local dépend du serveur ; on interprète l'heure dans le fuseau de l'utilisateur, puis on stocke en UTC."
