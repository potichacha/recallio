notion: time-durees
lesson: |-
  Le package **`time`** distingue deux types :
  - **`time.Time`** : un instant, avec un fuseau horaire (`time.Now()`, `time.Date(2026, 11, 4, 9, 0, 0, 0, time.UTC)`) ;
  - **`time.Duration`** : une durée, un `int64` de **nanosecondes** (`90 * time.Minute`, `d.Seconds()`).

  ```go
  debut := time.Now()
  // ...
  ecoule := time.Since(debut)              // une Duration
  echeance := debut.Add(30 * time.Second)  // un Time
  if time.Now().After(echeance) { ... }
  delta := fin.Sub(debut)                  // Time - Time = Duration
  ```

  **Le formatage** n'utilise pas `yyyy-MM-dd` mais une **date de référence** : le **lundi 2 janvier 2006 à 15:04:05,
  fuseau MST** (moyen mnémotechnique : 1 2 3 4 5 6, soit mois 01, jour 02, heure 03 ou 15, minutes 04, secondes 05,
  année 06).

  ```go
  t.Format("2006-01-02 15:04")   // "2026-11-04 09:05"
  t.Format(time.RFC3339)         // "2026-11-04T09:05:00Z"
  time.Parse("02/01/2006", "04/11/2026")
  ```

  Les pièges :
  - comparer des instants avec **`t.Equal(u)`**, `Before`, `After`, pas avec `==` (qui compare aussi le fuseau et
    l'horloge monotone) ;
  - `time.Duration(5)` vaut **5 nanosecondes** : on écrit `5 * time.Second` ;
  - multiplier une durée par une variable entière demande une conversion : `time.Duration(n) * time.Second` ;
  - `time.Now()` contient une **horloge monotone**, utilisée par `Sub` et `Since` : une mesure de durée reste juste même
    si l'heure du système change ;
  - stocker et échanger en **UTC**, convertir dans le fuseau de l'utilisateur seulement pour l'affichage
    (`t.In(loc)`, `time.LoadLocation("Europe/Paris")`) ;
  - pour tester, injecter l'heure (une fonction ou une interface) plutôt que d'appeler `time.Now()` partout.

  **En entretien** : « Time pour un instant, Duration en nanosecondes ; formatage par la date de référence 2006-01-02
  15:04:05 ; Equal plutôt que == ; UTC en stockage ; horloge monotone pour mesurer. »
tour:
  - title: Le temps et les durées
    text: |-
      `time.Time` est un instant, et `time.Duration` une durée, en nanosecondes : `90 * time.Minute`, `t.Add(d)`,
      `t2.Sub(t1)`.

      Le formatage est original : on écrit le format avec la **date de référence**, le 2 janvier 2006 à 15:04:05.
      `"02/01/2006 15:04"` donne donc le jour, le mois, l'année, l'heure et les minutes. `time.DateOnly` et
      `time.RFC3339` sont des formats prêts à l'emploi.

      `time.Now()` donne l'instant présent : on l'évite ici, car la sortie d'une page du Tour doit rester la même.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	depart := time.Date(2026, time.November, 5, 9, 30, 0, 0, time.UTC)
          	duree := 90 * time.Minute
          	arrivee := depart.Add(duree)

          	fmt.Println(duree, duree.Hours())
          	fmt.Println(arrivee.Format("02/01/2006 15:04"))
          	fmt.Println(arrivee.Sub(depart) == duree, depart.Before(arrivee))
          	fmt.Println(depart.Format(time.DateOnly), depart.Weekday())
          }
      output: |-
        1h30m0s 1.5
        05/11/2026 11:00
        true true
        2026-11-05 Thursday
cards:
  - key: formater-date
    format: course
    question: Comment formater une date en Go ?
    choices:
      - {text: "Par l'exemple, avec la date de référence `2006-01-02 15:04:05`", correct: true}
      - {text: "Avec des lettres comme `yyyy-MM-dd HH:mm:ss`, comme en Java", correct: false}
      - {text: "Avec des directives comme `%Y-%m-%d`, comme `strftime` en C", correct: false}
      - {text: "Avec `time.Layout`, qui devine le format d'après un exemple quelconque", correct: false}
    answer: "`t.Format` prend un modèle écrit avec la date de référence, le 2 janvier 2006 à 15:04:05 : `2006-01-02` pour une date ISO, `time.DateOnly` en raccourci. Les `yyyy` de Java ou les `%Y` de C seraient recopiés tels quels."
  - key: comparer-deux-time-time
    format: course
    question: "Comment comparer deux `time.Time` ?"
    choices:
      - {text: "Avec `Equal`, `Before` et `After`, pas avec `==`", correct: true}
      - {text: "Avec `==`, qui compare l'instant représenté", correct: false}
      - {text: "Avec `<` et `>`, comme deux nombres", correct: false}
      - {text: "Avec `Compare` seulement, `Equal` étant déprécié", correct: false}
    answer: "`==` compare aussi le fuseau et la lecture monotone : deux valeurs du même instant peuvent différer. `Equal`, `Before`, `After` (et `Compare` depuis Go 1.20) comparent l'instant ; `<` ne compile pas sur une struct."
  - key: horloge-monotone
    format: course
    question: "Qu'est-ce que l'horloge monotone de `time.Now` ?"
    choices:
      - {text: "Une lecture jointe à `time.Now`, utilisée par `Sub` et `Since`, insensible aux réglages de l'horloge", correct: true}
      - {text: "L'heure UTC du système, que `time.Now` renvoie toujours, quel que soit le fuseau local", correct: false}
      - {text: "Une horloge synchronisée par NTP, bien plus précise que celle du système d'exploitation", correct: false}
      - {text: "Une horloge propre à chaque goroutine, remise à zéro au démarrage de la goroutine", correct: false}
    answer: Une lecture incluse dans time.Now, utilisée par Sub et Since, insensible aux ajustements de l'horloge système.
  - key: vaut-time-duration-5
    format: course
    question: "Que vaut `time.Duration(5)` ?"
    choices:
      - {text: "5 nanosecondes", correct: true}
      - {text: "5 secondes", correct: false}
      - {text: "5 millisecondes", correct: false}
      - {text: "5 minutes", correct: false}
    answer: "Une `time.Duration` est un `int64` qui compte des nanosecondes : `time.Duration(5)` vaut 5 ns. Pour 5 secondes, on multiplie par l'unité, `5 * time.Second`."
  - key: code-fmt-println-time-duration-1500
    format: code-output
    question: "Qu'affiche `fmt.Println(time.Duration(1500) * time.Millisecond)` ?"
    choices:
      - {text: "`1.5s`", correct: true}
      - {text: "`1500ms`", correct: false}
      - {text: "`1500`", correct: false}
      - {text: "`1.5µs`", correct: false}
    answer: "`1.5s` : 1500 fois une milliseconde font 1,5 seconde, et `String` choisit l'unité la plus lisible. `time.Duration(1500)` seul vaudrait 1,5 µs."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tfmt.Println(time.Duration(1500) * time.Millisecond)\n}\n"
      output: 1.5s
  - key: vf-reference
    format: true-false
    question: Pour formater une date en Go, on écrit un modèle comme « yyyy-MM-dd ».
    truth: false
    answer: On écrit la date de référence dans le format voulu, par exemple « 2006-01-02 ».
  - key: vf-equal
    format: true-false
    question: Pour comparer deux instants, `t.Equal(u)` est plus sûr que `t == u`.
    truth: true
    answer: == compare aussi le fuseau et la lecture monotone.
  - key: vf-duration
    format: true-false
    question: Une time.Duration est un nombre de millisecondes.
    truth: false
    answer: De nanosecondes.
  - key: vf-monotone
    format: true-false
    question: Une durée mesurée avec time.Since reste juste si l'heure du système est corrigée pendant la mesure.
    truth: true
    answer: Grâce à l'horloge monotone contenue dans time.Now().
  - key: qcm-format
    format: multiple-choice
    question: "Lequel de ces modèles ne donne pas le résultat voulu avec `t.Format` ?"
    choices:
      - {text: "`\"YYYY-MM-DD\"`, pour une date ISO", correct: true}
      - {text: "`\"2006-01-02\"`, pour une date ISO", correct: false}
      - {text: "`\"15:04\"`, pour l'heure sur 24 h", correct: false}
      - {text: "`time.RFC3339`, pour un horodatage standard", correct: false}
    answer: "Go formate par la date de référence : `YYYY-MM-DD` n'en contient aucun élément et serait recopié tel quel. `2006-01-02`, `15:04` et `time.RFC3339` sont corrects."
  - key: qcm-multiplier
    format: multiple-choice
    question: n est un int qui contient un nombre de secondes. Comment en faire une durée ?
    choices:
      - text: '`time.Duration(n) * time.Second`'
        correct: true
      - text: '`n * time.Second`'
        correct: false
      - text: '`time.Second(n)`'
        correct: false
      - text: '`time.Duration(n)`'
        correct: false
    answer: n * time.Second ne compile pas (types différents) ; time.Duration(n) seul donne des nanosecondes.
  - key: qcm-fuseaux
    format: multiple-choice
    question: "Lesquelles de ces pratiques sont recommandées avec les fuseaux horaires ?"
    choices:
      - text: Stocker et échanger les instants en UTC
        correct: true
      - text: Convertir avec `t.In(loc)` pour l'affichage
        correct: true
      - text: Stocker l'heure locale du serveur
        correct: false
      - text: Ajouter une heure à la main pour l'heure d'été
        correct: false
    answer: time.LoadLocation connaît les changements d'heure.
  - key: qcm-operations
    format: multiple-choice
    question: "Laquelle de ces opérations renvoie une `time.Duration` ?"
    choices:
      - {text: "`time.Since(debut)`", correct: true}
      - {text: "`debut.Add(time.Hour)`", correct: false}
      - {text: "`time.Now()`", correct: false}
      - {text: "`debut.Truncate(time.Hour)`", correct: false}
    answer: "`time.Since(debut)`, comme `fin.Sub(debut)`, renvoie une durée. `Add`, `Now` et `Truncate` renvoient un `time.Time`."
  - key: trous-format
    format: fill-in
    question: |-
      Complète pour afficher « 04/11/2026 » :
      ```go
      t.Format("02/01/___")
      ```
    blanks:
      - - '2006'
    answer: L'année de référence est 2006.
  - key: trous-since
    format: fill-in
    question: |-
      Complète pour mesurer la durée :
      ```go
      debut := time.Now()
      traiter()
      log.Printf("durée : %v", time.___(debut))
      ```
    blanks:
      - - Since
    answer: time.Since.
  - key: trous-duree
    format: fill-in
    question: |-
      Complète pour un délai de 3 secondes :
      ```go
      delai := 3 * time.___
      ```
    blanks:
      - - Second
    answer: time.Second.
  - key: trous-before
    format: fill-in
    question: |-
      Complète pour tester l'expiration :
      ```go
      if jeton.Expiration.___(time.Now()) {
      	return ErrJetonExpire
      }
      ```
    blanks:
      - - Before
    answer: Before.
  - key: code-duree
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      d := 90*time.Minute + 30*time.Second
      fmt.Println(d, d.Minutes())
      ```
    choices:
      - {text: "`1h30m30s 90.5`", correct: true}
      - {text: "`90m30s 90.5`", correct: false}
      - {text: "`1h30m30s 90`", correct: false}
      - {text: "`1:30:30 90.5`", correct: false}
    answer: "`1h30m30s 90.5` : `String` découpe la durée en heures, minutes et secondes, et `Minutes` renvoie un `float64`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\td := 90*time.Minute + 30*time.Second\n\tfmt.Println(d, d.Minutes())\n}\n"
      output: 1h30m30s 90.5
  - key: code-format
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      t := time.Date(2026, 11, 4, 9, 5, 0, 0, time.UTC)
      fmt.Println(t.Format("02/01/2006 15:04"), t.Weekday())
      ```
    choices:
      - {text: "`04/11/2026 09:05 Wednesday`", correct: true}
      - {text: "`11/04/2026 09:05 Wednesday`", correct: false}
      - {text: "`04/11/2026 9:5 Wednesday`", correct: false}
      - {text: "`04/11/2026 09:05 mercredi`", correct: false}
    answer: "`04/11/2026 09:05 Wednesday` : `02/01` place le jour avant le mois, `15:04` donne l'heure sur 24 h avec ses zéros, et `Weekday` s'affiche en anglais."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tt := time.Date(2026, 11, 4, 9, 5, 0, 0, time.UTC)\n\tfmt.Println(t.Format(\"02/01/2006 15:04\"), t.Weekday())\n}\n"
      output: 04/11/2026 09:05 Wednesday
  - key: code-adddate
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      t := time.Date(2026, 1, 31, 0, 0, 0, 0, time.UTC)
      fmt.Println(t.AddDate(0, 1, 0).Format("2006-01-02"))
      _, err := time.Parse("2006-01-02", "2026-02-30")
      fmt.Println(err != nil)
      ```
    choices:
      - text: |-
          ```
          2026-03-03
          true
          ```
        correct: true
      - text: |-
          ```
          2026-02-28
          true
          ```
        correct: false
      - text: |-
          ```
          2026-03-03
          false
          ```
        correct: false
      - text: |-
          ```
          2026-02-28
          false
          ```
        correct: false
    answer: '`2026-03-03` puis `true` : le 31 février est normalisé en 3 mars, mais Parse refuse un 30 février.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tt := time.Date(2026, 1, 31, 0, 0, 0, 0, time.UTC)\n\tfmt.Println(t.AddDate(0, 1, 0).Format(\"2006-01-02\"))\n\t_, err := time.Parse(\"2006-01-02\", \"2026-02-30\")\n\tfmt.Println(err != nil)\n}\n"
      output: |-
        2026-03-03
        true
  - key: bug-format
    format: bug-fix
    question: |-
      Les dates s'affichent littéralement « YYYY-MM-DD ». Quelle correction est la bonne ?
      ```go
      t.Format("YYYY-MM-DD")
      ```
    choices:
      - {text: "`t.Format(\"2006-01-02\")`, ou `time.DateOnly`", correct: true}
      - {text: "`t.Format(\"yyyy-MM-dd\")`, en minuscules", correct: false}
      - {text: "`t.Format(\"%Y-%m-%d\")`, comme en C", correct: false}
      - {text: "`t.Format(time.Kitchen)`, pour une date", correct: false}
    answer: |-
      ```go
      t.Format("2006-01-02") // ou time.DateOnly
      ```
      Go formate par la date de référence, et « YYYY-MM-DD » n'en contient aucun élément : il est recopié tel quel. `time.DateOnly` (Go 1.20) vaut "2006-01-02".
  - key: bug-nanosecondes
    format: bug-fix
    question: |-
      Le délai de reconnexion est quasi nul. Quelle correction est la bonne ?
      ```go
      attente := time.Duration(cfg.DelaiSecondes)
      time.Sleep(attente)
      ```
    choices:
      - {text: "Multiplier par l'unité : `time.Duration(cfg.DelaiSecondes) * time.Second`", correct: true}
      - {text: "Remplacer `time.Sleep` par `<-time.After(attente)`, plus précis", correct: false}
      - {text: "Convertir avec `time.ParseDuration(cfg.DelaiSecondes)`", correct: false}
      - {text: "Convertir en `float64` avant de créer la `time.Duration`", correct: false}
    answer: |-
      ```go
      attente := time.Duration(cfg.DelaiSecondes) * time.Second
      time.Sleep(attente)
      ```
      Une Duration compte des nanosecondes : il faut multiplier par l'unité.
  - key: bug-egalite
    format: bug-fix
    question: |-
      Un test échoue alors que les deux dates représentent le même instant. Quelle correction est la bonne ?
      ```go
      if attendu != obtenu {
      	t.Errorf("date %v, attendu %v", obtenu, attendu)
      }
      ```
    choices:
      - {text: "Comparer avec `attendu.Equal(obtenu)`", correct: true}
      - {text: "Comparer `attendu.String()` et `obtenu.String()`", correct: false}
      - {text: "Comparer avec `reflect.DeepEqual(attendu, obtenu)`", correct: false}
      - {text: "Comparer avec `!attendu.Before(obtenu)`", correct: false}
    answer: "```go\nif !attendu.Equal(obtenu) {\n\tt.Errorf(\"date %v, attendu %v\", obtenu, attendu)\n}\n```\n== compare aussi le fuseau et la lecture monotone ; Equal compare l'instant."
  - key: bug-local
    format: bug-fix
    question: |-
      Les réservations enregistrées depuis le serveur de Singapour sont décalées de sept heures pour les clients de Paris. Quelle correction est la bonne ?
      ```go
      rdv.Debut = time.Date(a, m, j, h, min, 0, 0, time.Local)
      ```
    choices:
      - {text: "Interpréter l'heure dans le fuseau de l'utilisateur (`time.LoadLocation`), puis stocker en UTC", correct: true}
      - {text: "Remplacer `time.Local` par `time.UTC`, sans tenir compte du fuseau de l'utilisateur", correct: false}
      - {text: "Ajouter sept heures à `rdv.Debut` avec `Add(7 * time.Hour)` avant de l'enregistrer", correct: false}
      - {text: "Régler le serveur de Singapour sur l'heure de Paris, pour aligner `time.Local`", correct: false}
    answer: "```go\nparis, err := time.LoadLocation(\"Europe/Paris\")\nif err != nil {\n\treturn err\n}\nrdv.Debut = time.Date(a, m, j, h, min, 0, 0, paris).UTC()\n```\ntime.Local dépend du serveur ; on interprète l'heure dans le fuseau de l'utilisateur, puis on stocke en UTC."
