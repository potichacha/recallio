notion: strings-paquet
lesson: |-
  Le package **`strings`** rassemble les opérations sur les chaînes. Les plus utiles :

  | Besoin | Fonction |
  |---|---|
  | chercher | `Contains`, `HasPrefix`, `HasSuffix`, `Index`, `Count` |
  | découper | `Split`, `Fields` (sur les espaces), `Cut`, `SplitSeq`, `Lines` |
  | assembler | `Join`, `Repeat`, `strings.Builder` |
  | transformer | `ToUpper`, `ToLower`, `TrimSpace`, `Trim`, `TrimPrefix`, `TrimSuffix`, `ReplaceAll` |
  | comparer | `==`, `EqualFold` (sans tenir compte de la casse), `Compare` |

  ```go
  cle, valeur, trouve := strings.Cut("port=8080", "=") // "port", "8080", true
  mots := strings.Fields("  le   petit chat ")        // [le petit chat]
  parties := strings.Split("a,b,,c", ",")             // [a b  c] : les vides sont gardés
  ligne := strings.Join([]string{"a", "b"}, ";")      // "a;b"
  ```

  Ce qu'il faut savoir :
  - les chaînes sont **immuables** : chaque fonction renvoie une nouvelle chaîne ;
  - `Split` garde les morceaux **vides**, `Fields` les ignore ; `Split("", ",")` renvoie `[""]`, une slice d'**un**
    élément ;
  - **`Cut`** (Go 1.18) remplace élégamment `Index` suivi de deux découpes ; `CutPrefix` et `CutSuffix` (1.20)
    retirent un préfixe en disant s'il était là ;
  - `TrimPrefix` retire un préfixe **exact**, alors que `TrimLeft` retire un **ensemble de caractères** : un piège
    classique ;
  - les fonctions travaillent en octets (UTF-8) : `len` compte des octets, pas des caractères.

  Le package **`bytes`** offre les mêmes fonctions pour `[]byte`, et `strconv` convertit vers et depuis les nombres
  (`Atoi`, `Itoa`, `ParseFloat`, `Quote`).

  **En entretien** : « Split garde les vides, Fields non ; Cut pour séparer en deux ; TrimPrefix et non TrimLeft ;
  Builder pour assembler ; bytes pour les []byte et strconv pour les nombres. »
cards:
  - key: sert-strings-cut
    format: course
    question: À quoi sert strings.Cut ?
    answer: Découper une chaîne autour de la première occurrence d'un séparateur, en renvoyant avant, après et un booléen.
  - key: code-fmt-println-strings-split-b
    format: code-output
    question: '`fmt.Println(strings.Split("a,b,", ","), len(strings.Split("a,b,", ",")), len(strings.Split("", ",")))`'
    answer: '`[a b ] 3 1` : la chaîne vide finale est conservée, et découper "" renvoie un slice d''un élément vide.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Split(\"a,b,\", \",\"), len(strings.Split(\"a,b,\", \",\")), len(strings.Split(\"\", \",\")))\n}\n"
      output: '[a b ] 3 1'
  - key: code-fmt-println-strings-fields-b
    format: code-output
    question: '`fmt.Println(strings.Fields("  a  b "))`'
    answer: '`[a b]` : Fields découpe sur les espaces et ignore les vides.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Fields(\"  a  b \"))\n}\n"
      output: '[a b]'
  - key: split-fields
    format: course
    question: Quelle différence entre strings.Split et strings.Fields ?
    answer: Split coupe sur un séparateur donné et garde les morceaux vides ; Fields coupe sur les suites d'espaces (espaces, tabulations, retours à la ligne) et ne garde aucun morceau vide.
  - key: trim
    format: course
    question: Quelle différence entre TrimPrefix et TrimLeft ?
    answer: 'TrimPrefix retire le préfixe exact une fois s''il est présent ; TrimLeft retire tous les caractères de début qui appartiennent à l''ensemble donné : `TrimLeft("aab", "ab")` donne "", alors que `TrimPrefix("aab", "ab")` donne "aab".'
  - key: equalfold
    format: course
    question: Comment comparer deux chaînes sans tenir compte de la casse ?
    answer: Avec `strings.EqualFold(a, b)`, qui gère aussi Unicode ; comparer `ToLower(a) == ToLower(b)` alloue deux chaînes et peut se tromper sur certains caractères.
  - key: vf-immuable
    format: true-false
    question: '`strings.ToUpper(s)` modifie s sur place.'
    truth: false
    answer: Les chaînes sont immuables ; elle renvoie une nouvelle chaîne.
  - key: vf-split-vide
    format: true-false
    question: '`strings.Split("", ",")` renvoie une slice vide.'
    truth: false
    answer: Elle renvoie [""], un élément vide.
  - key: vf-cut
    format: true-false
    question: '`strings.Cut` renvoie le texte avant et après le séparateur, et un booléen qui dit s''il a été trouvé.'
    truth: true
    answer: Depuis Go 1.18.
  - key: vf-contains
    format: true-false
    question: '`strings.Contains(s, "")` renvoie true.'
    truth: true
    answer: La chaîne vide est contenue dans toute chaîne.
  - key: qcm-decouper
    format: multiple-choice
    question: Comment séparer « utilisateur@domaine » en deux parties ?
    choices:
      - text: '`avant, apres, ok := strings.Cut(s, "@")`'
        correct: true
      - text: '`parties := strings.SplitN(s, "@", 2)`'
        correct: true
      - text: '`strings.Fields(s)`'
        correct: false
      - text: '`strings.Trim(s, "@")`'
        correct: false
    answer: Cut est le plus lisible et dit si le séparateur était là.
  - key: qcm-espaces
    format: multiple-choice
    question: Comment obtenir les mots d'une phrase avec des espaces multiples ?
    choices:
      - text: '`strings.Fields(phrase)`'
        correct: true
      - text: '`strings.Split(phrase, " ")`, qui ignore les vides'
        correct: false
      - text: '`strings.TrimSpace(phrase)`'
        correct: false
      - text: '`strings.Join(phrase, " ")`'
        correct: false
    answer: Split garderait des morceaux vides entre les espaces multiples.
  - key: qcm-prefixe
    format: multiple-choice
    question: Comment retirer le préfixe « v » d'un numéro de version et savoir s'il était là ?
    choices:
      - text: '`num, ok := strings.CutPrefix(version, "v")`'
        correct: true
      - text: '`strings.HasPrefix` puis `strings.TrimPrefix`'
        correct: true
      - text: '`strings.TrimLeft(version, "v")`, identique'
        correct: false
      - text: '`version[1:]` sans vérifier'
        correct: false
    answer: TrimLeft retirerait aussi « vv » ; version[1:] coupe même sans préfixe.
  - key: qcm-conversions
    format: multiple-choice
    question: Comment convertir la chaîne « 42 » en entier ?
    choices:
      - text: '`n, err := strconv.Atoi("42")`'
        correct: true
      - text: '`n, err := strconv.ParseInt("42", 10, 64)`'
        correct: true
      - text: '`int("42")`'
        correct: false
      - text: '`strings.ToInt("42")`'
        correct: false
    answer: int("42") ne compile pas ; strings.ToInt n'existe pas.
  - key: trous-join
    format: fill-in
    question: |-
      Complétez pour assembler avec des virgules :
      ```go
      ligne := strings.___(champs, ",")
      ```
    blanks:
      - - Join
    answer: Join.
  - key: trous-cut
    format: fill-in
    question: "Complétez :\n```go\ncle, valeur, ok := strings.___(ligne, \"=\")\nif !ok {\n\treturn fmt.Errorf(\"ligne invalide : %q\", ligne)\n}\n```"
    blanks:
      - - Cut
    answer: Cut sépare en deux.
  - key: trous-trimspace
    format: fill-in
    question: |-
      Complétez pour retirer les espaces autour de la saisie :
      ```go
      nom := strings.___(saisie)
      ```
    blanks:
      - - TrimSpace
    answer: TrimSpace.
  - key: trous-prefix
    format: fill-in
    question: |-
      Complétez pour tester le début de l'URL :
      ```go
      if strings.___(url, "https://") {
      ```
    blanks:
      - - HasPrefix
    answer: HasPrefix.
  - key: code-cut
    format: code-output
    question: |-
      ```go
      avant, apres, ok := strings.Cut("cle=valeur=x", "=")
      fmt.Println(avant, apres, ok)
      _, _, ok = strings.Cut("sans", "=")
      fmt.Println(ok)
      ```
    answer: '`cle valeur=x true` puis `false` : Cut coupe à la première occurrence.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tavant, apres, ok := strings.Cut(\"cle=valeur=x\", \"=\")\n\tfmt.Println(avant, apres, ok)\n\t_, _, ok = strings.Cut(\"sans\", \"=\")\n\tfmt.Println(ok)\n}\n"
      output: |-
        cle valeur=x true
        false
  - key: code-divers
    format: code-output
    question: "```go\nfmt.Println(strings.EqualFold(\"Go\", \"GO\"), strings.Repeat(\"ab\", 3),\n\tstrings.ReplaceAll(\"a-b-c\", \"-\", \"+\"), strings.TrimLeft(\"aab\", \"ab\") == \"\")\n```"
    answer: '`true ababab a+b+c true` : TrimLeft retire tous les « a » et « b » du début.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.EqualFold(\"Go\", \"GO\"), strings.Repeat(\"ab\", 3),\n\t\tstrings.ReplaceAll(\"a-b-c\", \"-\", \"+\"), strings.TrimLeft(\"aab\", \"ab\") == \"\")\n}\n"
      output: true ababab a+b+c true
