notion: strings-paquet
cards:
  - key: sert-strings-cut
    format: course
    question: À quoi sert strings.Cut ?
    answer: Découper une chaîne autour de la première occurrence d'un séparateur, en renvoyant avant, après et un booléen.
  - key: code-fmt-println-strings-split-b
    format: code-output
    question: '`fmt.Println(strings.Split("a,b,", ","), len(strings.Split("a,b,", ",")), len(strings.Split("", ",")))`'
    answer: '`[a b ] 3 1` : la chaîne vide finale est conservée, et découper "" renvoie un slice d''un élément vide.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Split(\"a,b,\", \",\"), len(strings.Split(\"a,b,\", \",\")), len(strings.Split(\"\", \",\")))\n}\n"
      output: '[a b ] 3 1'
  - key: code-fmt-println-strings-fields-b
    format: code-output
    question: '`fmt.Println(strings.Fields("  a  b "))`'
    answer: '`[a b]` : Fields découpe sur les espaces et ignore les vides.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Fields(\"  a  b \"))\n}\n"
      output: '[a b]'
