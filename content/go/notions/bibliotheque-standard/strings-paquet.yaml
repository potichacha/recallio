notion: strings-paquet
lesson: |-
  Le package **`strings`** rassemble les opérations sur les chaînes. Les plus utiles :

  | Besoin | Fonction |
  |---|---|
  | chercher | `Contains`, `HasPrefix`, `HasSuffix`, `Index`, `Count` |
  | découper | `Split`, `Fields` (sur les espaces), `Cut`, `SplitSeq`, `Lines` |
  | assembler | `Join`, `Repeat`, `strings.Builder` |
  | transformer | `ToUpper`, `ToLower`, `TrimSpace`, `Trim`, `TrimPrefix`, `TrimSuffix`, `ReplaceAll` |
  | comparer | `==`, `EqualFold` (sans tenir compte de la casse), `Compare` |

  ```go
  cle, valeur, trouve := strings.Cut("port=8080", "=") // "port", "8080", true
  mots := strings.Fields("  le   petit chat ")        // [le petit chat]
  parties := strings.Split("a,b,,c", ",")             // [a b  c] : les vides sont gardés
  ligne := strings.Join([]string{"a", "b"}, ";")      // "a;b"
  ```

  Ce qu'il faut savoir :
  - les chaînes sont **immuables** : chaque fonction renvoie une nouvelle chaîne ;
  - `Split` garde les morceaux **vides**, `Fields` les ignore ; `Split("", ",")` renvoie `[""]`, une slice d'**un**
    élément ;
  - **`Cut`** (Go 1.18) remplace élégamment `Index` suivi de deux découpes ; `CutPrefix` et `CutSuffix` (1.20)
    retirent un préfixe en disant s'il était là ;
  - `TrimPrefix` retire un préfixe **exact**, alors que `TrimLeft` retire un **ensemble de caractères** : un piège
    classique ;
  - les fonctions travaillent en octets (UTF-8) : `len` compte des octets, pas des caractères.

  Le package **`bytes`** offre les mêmes fonctions pour `[]byte`, et `strconv` convertit vers et depuis les nombres
  (`Atoi`, `Itoa`, `ParseFloat`, `Quote`).

  **En entretien** : « Split garde les vides, Fields non ; Cut pour séparer en deux ; TrimPrefix et non TrimLeft ;
  Builder pour assembler ; bytes pour les []byte et strconv pour les nombres. »
tour:
  - title: Le package strings
    text: |-
      Le package `strings` regroupe les opérations courantes sur les chaînes :

      - `Contains`, `HasPrefix`, `HasSuffix` et `Index` pour chercher ;
      - `Split` et `Fields` pour découper (par un séparateur, ou par les espaces), `Join` pour recoller ;
      - `ToUpper`, `ToLower`, `TrimSpace` et `ReplaceAll` pour transformer ;
      - `Cut`, qui coupe une chaîne en deux autour d'un séparateur et dit s'il l'a trouvé.

      Toutes renvoient une **nouvelle** chaîne : l'originale ne change pas.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	ligne := "  Go, Java, Rust  "
          	propre := strings.TrimSpace(ligne)
          	langages := strings.Split(propre, ", ")
          	fmt.Println(len(langages), strings.Join(langages, " | "))
          	fmt.Println(strings.Contains(propre, "Java"), strings.HasPrefix(propre, "Go"))
          	fmt.Println(strings.Fields("un  deux\ttrois"))

          	cle, valeur, trouve := strings.Cut("langage=go", "=")
          	fmt.Println(cle, valeur, trouve)
          	fmt.Println(strings.ToUpper(cle), strings.ReplaceAll("a-b-c", "-", "+"))
          }
      output: |-
        3 Go | Java | Rust
        true true
        [un deux trois]
        langage go true
        LANGAGE a+b+c
    task:
      instructions: |-
        Avec `strings.Cut`, sépare l'utilisateur et le domaine de l'adresse : le programme doit afficher
        `ada exemple.fr`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	adresse := "ada@exemple.fr"
          	fmt.Println(strings.ToUpper(adresse))
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func main() {
          	adresse := "ada@exemple.fr"
          	utilisateur, domaine, _ := strings.Cut(adresse, "@")
          	fmt.Println(utilisateur, domaine)
          }
      output: |-
        ada exemple.fr
cards:
  - key: sert-strings-cut
    format: course
    question: "À quoi sert `strings.Cut` ?"
    choices:
      - {text: "À couper une chaîne autour de la première occurrence d'un séparateur", correct: true}
      - {text: "À couper une chaîne autour de chaque occurrence d'un séparateur", correct: false}
      - {text: "À tronquer une chaîne à une longueur maximale, comptée en octets", correct: false}
      - {text: "À retirer un séparateur au début et à la fin d'une chaîne", correct: false}
    answer: "`strings.Cut(s, sep)` renvoie ce qui précède la première occurrence, ce qui la suit, et un booléen qui dit si le séparateur était là. Couper à chaque occurrence, c'est `strings.Split`."
  - key: code-fmt-println-strings-split-b
    format: code-output
    question: "Qu'affiche `fmt.Println(strings.Split(\"a,b,\", \",\"), len(strings.Split(\"a,b,\", \",\")), len(strings.Split(\"\", \",\")))` ?"
    choices:
      - {text: "`[a b ] 3 1`", correct: true}
      - {text: "`[a b] 2 0`", correct: false}
      - {text: "`[a b ] 3 0`", correct: false}
      - {text: "`[a b] 2 1`", correct: false}
    answer: '`[a b ] 3 1` : la chaîne vide finale est conservée, et découper "" renvoie un slice d''un élément vide.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Split(\"a,b,\", \",\"), len(strings.Split(\"a,b,\", \",\")), len(strings.Split(\"\", \",\")))\n}\n"
      output: '[a b ] 3 1'
  - key: code-fmt-println-strings-fields-b
    format: code-output
    question: "Qu'affiche `fmt.Println(strings.Fields(\"  a  b \"))` ?"
    choices:
      - {text: "`[a b]`", correct: true}
      - {text: "`[ a  b ]`", correct: false}
      - {text: "`[a b ]`", correct: false}
      - {text: "`[  a b]`", correct: false}
    answer: '`[a b]` : Fields découpe sur les espaces et ignore les vides.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.Fields(\"  a  b \"))\n}\n"
      output: '[a b]'
  - key: split-fields
    format: course
    question: "Quelle différence y a-t-il entre `strings.Split` et `strings.Fields` ?"
    choices:
      - {text: "`Split` coupe sur un séparateur donné et garde les vides ; `Fields` coupe sur les espaces, sans vides", correct: true}
      - {text: "`Split` coupe sur les espaces et retire les vides ; `Fields` coupe sur un séparateur donné", correct: false}
      - {text: "`Split` renvoie une slice de morceaux ; `Fields` renvoie un itérateur sur ces morceaux", correct: false}
      - {text: "Aucune : `Fields(s)` est un simple raccourci pour `Split(s, \" \")`", correct: false}
    answer: Split coupe sur un séparateur donné et garde les morceaux vides ; Fields coupe sur les suites d'espaces (espaces, tabulations, retours à la ligne) et ne garde aucun morceau vide.
  - key: trim
    format: course
    question: "Quelle différence y a-t-il entre `strings.TrimPrefix` et `strings.TrimLeft` ?"
    choices:
      - {text: "`TrimPrefix` retire un préfixe exact une fois ; `TrimLeft` retire tous les caractères d'un ensemble", correct: true}
      - {text: "`TrimPrefix` retire tous les caractères d'un ensemble ; `TrimLeft` retire un préfixe exact", correct: false}
      - {text: "Aucune : `TrimLeft` est l'ancien nom de `TrimPrefix`, gardé pour la compatibilité", correct: false}
      - {text: "`TrimPrefix` retire le préfixe à chaque répétition ; `TrimLeft` une seule fois", correct: false}
    answer: 'TrimPrefix retire le préfixe exact une fois s''il est présent ; TrimLeft retire tous les caractères de début qui appartiennent à l''ensemble donné : `TrimLeft("aab", "ab")` donne "", alors que `TrimPrefix("aab", "ab")` donne "aab".'
  - key: equalfold
    format: course
    question: Comment comparer deux chaînes sans tenir compte de la casse ?
    choices:
      - {text: "Avec `strings.EqualFold(a, b)`, qui gère aussi Unicode", correct: true}
      - {text: "Avec `strings.ToLower(a) == strings.ToLower(b)`, la seule façon sûre", correct: false}
      - {text: "Avec `strings.Compare(a, b) == 0`, insensible à la casse", correct: false}
      - {text: "Avec `a == b`, car Go compare les chaînes sans la casse", correct: false}
    answer: Avec `strings.EqualFold(a, b)`, qui gère aussi Unicode ; comparer `ToLower(a) == ToLower(b)` alloue deux chaînes et peut se tromper sur certains caractères.
  - key: vf-immuable
    format: true-false
    question: '`strings.ToUpper(s)` modifie s sur place.'
    truth: false
    answer: Les chaînes sont immuables ; elle renvoie une nouvelle chaîne.
  - key: vf-split-vide
    format: true-false
    question: '`strings.Split("", ",")` renvoie une slice vide.'
    truth: false
    answer: Elle renvoie [""], un élément vide.
  - key: vf-cut
    format: true-false
    question: '`strings.Cut` renvoie le texte avant et après le séparateur, et un booléen qui dit s''il a été trouvé.'
    truth: true
    answer: Depuis Go 1.18.
  - key: vf-contains
    format: true-false
    question: '`strings.Contains(s, "")` renvoie true.'
    truth: true
    answer: La chaîne vide est contenue dans toute chaîne.
  - key: qcm-decouper
    format: multiple-choice
    question: "Lesquelles de ces lignes séparent « utilisateur@domaine » en deux parties ?"
    choices:
      - text: '`avant, apres, ok := strings.Cut(s, "@")`'
        correct: true
      - text: '`parties := strings.SplitN(s, "@", 2)`'
        correct: true
      - text: '`strings.Fields(s)`'
        correct: false
      - text: '`strings.Trim(s, "@")`'
        correct: false
    answer: Cut est le plus lisible et dit si le séparateur était là.
  - key: qcm-espaces
    format: multiple-choice
    question: Comment obtenir les mots d'une phrase avec des espaces multiples ?
    choices:
      - text: '`strings.Fields(phrase)`'
        correct: true
      - text: '`strings.Split(phrase, " ")`, qui ignore les vides'
        correct: false
      - text: '`strings.TrimSpace(phrase)`'
        correct: false
      - text: '`strings.Join(phrase, " ")`'
        correct: false
    answer: Split garderait des morceaux vides entre les espaces multiples.
  - key: qcm-prefixe
    format: multiple-choice
    question: Comment retirer le préfixe « v » d'un numéro de version et savoir s'il était là ?
    choices:
      - {text: "`num, ok := strings.CutPrefix(version, \"v\")`", correct: true}
      - {text: "`strings.TrimLeft(version, \"v\")`, qui fait la même chose", correct: false}
      - {text: "`version[1:]`, sans vérifier le premier caractère", correct: false}
      - {text: "`strings.Trim(version, \"v\")`, qui renvoie aussi un booléen", correct: false}
    answer: "`strings.CutPrefix` (Go 1.20) retire le préfixe et dit s'il était là ; `HasPrefix` puis `TrimPrefix` marche aussi. `TrimLeft` retirerait aussi « vv », et `version[1:]` coupe même sans préfixe."
  - key: qcm-conversions
    format: multiple-choice
    question: "Comment convertir la chaîne « 42 » en `int` ?"
    choices:
      - {text: "`n, err := strconv.Atoi(\"42\")`", correct: true}
      - {text: "`n := int(\"42\")`", correct: false}
      - {text: "`n, err := strings.ToInt(\"42\")`", correct: false}
      - {text: "`n := int([]byte(\"42\")[0])`", correct: false}
    answer: "`strconv.Atoi` (ou `strconv.ParseInt(s, 10, 64)`) analyse la chaîne et renvoie une erreur si elle n'est pas un nombre. `int(\"42\")` ne compile pas, `strings.ToInt` n'existe pas, et le premier octet vaut 52, le code de « 4 »."
  - key: trous-join
    format: fill-in
    question: |-
      Complète pour assembler avec des virgules :
      ```go
      ligne := strings.___(champs, ",")
      ```
    blanks:
      - - Join
    answer: Join.
  - key: trous-cut
    format: fill-in
    question: |-
      Complète :
      ```go
      cle, valeur, ok := strings.___(ligne, "=")
      if !ok {
      	return fmt.Errorf("ligne invalide : %q", ligne)
      }
      ```
    blanks:
      - - Cut
    answer: Cut sépare en deux.
  - key: trous-trimspace
    format: fill-in
    question: |-
      Complète pour retirer les espaces autour de la saisie :
      ```go
      nom := strings.___(saisie)
      ```
    blanks:
      - - TrimSpace
    answer: TrimSpace.
  - key: trous-prefix
    format: fill-in
    question: |-
      Complète pour tester le début de l'URL :
      ```go
      if strings.___(url, "https://") {
      ```
    blanks:
      - - HasPrefix
    answer: HasPrefix.
  - key: code-cut
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      avant, apres, ok := strings.Cut("cle=valeur=x", "=")
      fmt.Println(avant, apres, ok)
      _, _, ok = strings.Cut("sans", "=")
      fmt.Println(ok)
      ```
    choices:
      - text: |-
          ```
          cle valeur=x true
          false
          ```
        correct: true
      - text: |-
          ```
          cle valeur true
          false
          ```
        correct: false
      - text: |-
          ```
          cle=valeur x true
          false
          ```
        correct: false
      - text: |-
          ```
          cle valeur=x true
          true
          ```
        correct: false
    answer: '`cle valeur=x true` puis `false` : Cut coupe à la première occurrence.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tavant, apres, ok := strings.Cut(\"cle=valeur=x\", \"=\")\n\tfmt.Println(avant, apres, ok)\n\t_, _, ok = strings.Cut(\"sans\", \"=\")\n\tfmt.Println(ok)\n}\n"
      output: |-
        cle valeur=x true
        false
  - key: code-divers
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(strings.EqualFold("Go", "GO"), strings.Repeat("ab", 3),
      	strings.ReplaceAll("a-b-c", "-", "+"), strings.TrimLeft("aab", "ab") == "")
      ```
    choices:
      - {text: "`true ababab a+b+c true`", correct: true}
      - {text: "`false ababab a+b+c false`", correct: false}
      - {text: "`true ababab a+b-c true`", correct: false}
      - {text: "`true ababab a+b+c false`", correct: false}
    answer: '`true ababab a+b+c true` : TrimLeft retire tous les « a » et « b » du début.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tfmt.Println(strings.EqualFold(\"Go\", \"GO\"), strings.Repeat(\"ab\", 3),\n\t\tstrings.ReplaceAll(\"a-b-c\", \"-\", \"+\"), strings.TrimLeft(\"aab\", \"ab\") == \"\")\n}\n"
      output: true ababab a+b+c true
