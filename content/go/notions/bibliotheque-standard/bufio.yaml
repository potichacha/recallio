notion: bufio
lesson: "Le package **`bufio`** ajoute un **tampon** autour d'un `io.Reader` ou d'un `io.Writer` : moins d'appels système, et\ndes outils pour lire ligne par ligne.\n\n**Lire ligne par ligne** avec un `Scanner` :\n\n```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\tligne := sc.Text() // sans le \"\\n\" (ni le \"\\r\\n\")\n\ttraiter(ligne)\n}\nif err := sc.Err(); err != nil { // à vérifier après la boucle\n\treturn err\n}\n```\n\n- `sc.Split(bufio.ScanWords)` découpe par mots, `bufio.ScanRunes` par caractères ;\n- une ligne de plus de **64 Ko** fait échouer le Scanner avec `bufio.ErrTooLong` : `sc.Buffer(make([]byte, 0, 64*1024),\n  10<<20)` relève la limite ;\n- `sc.Bytes()` évite une allocation mais n'est valable que jusqu'au prochain `Scan`.\n\n**Écrire avec un tampon** :\n\n```go\nw := bufio.NewWriter(f)\nfor _, l := range lignes {\n\tfmt.Fprintln(w, l)\n}\nif err := w.Flush(); err != nil { // sans Flush, la fin reste dans le tampon\n\treturn err\n}\n```\n\n`bufio.Reader` offre aussi `ReadString('\\n')`, `ReadRune` et `Peek`, pour les analyses plus fines.\n\n**En entretien** : « Scanner pour lire ligne par ligne, Err à vérifier après la boucle, limite de 64 Ko par ligne ;\nWriter tamponné et Flush obligatoire à la fin. »"
tour:
  - title: bufio
    text: |-
      `bufio` ajoute un **tampon** à un Reader ou à un Writer. `bufio.Scanner` découpe un flux en lignes (ou en mots) :
      `for sc.Scan() { … sc.Text() … }`, puis on vérifie `sc.Err()`.

      `bufio.Writer` accumule les écritures et ne les transmet qu'en gros morceaux, ce qui fait bien moins d'appels
      système. Il faut penser à `Flush()` à la fin, sinon la dernière partie reste dans le tampon.
    example:
      files:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"os"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	n := 0
          	for sc.Scan() {
          		n++
          		fmt.Println(n, sc.Text())
          	}
          	if err := sc.Err(); err != nil {
          		fmt.Println("erreur :", err)
          	}

          	w := bufio.NewWriter(os.Stdout)
          	fmt.Fprintln(w, "écrit via un tampon")
          	w.Flush()
          }
      output: |-
        1 première ligne
        2 deuxième ligne
        3 troisième ligne
        écrit via un tampon
    task:
      instructions: |-
        Compte les **mots** du texte plutôt que ses lignes, en réglant le Scanner avec `sc.Split(bufio.ScanWords)` : le
        programme doit afficher `mots : 6`.
      starter:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	n := 0
          	for sc.Scan() {
          		n++
          	}
          	fmt.Println("lignes :", n)
          }
      solution:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	sc.Split(bufio.ScanWords)
          	n := 0
          	for sc.Scan() {
          		n++
          	}
          	fmt.Println("mots :", n)
          }
      output: |-
        mots : 6
cards:
  - key: appeler-flush-bufio-writer
    format: course
    question: "Pourquoi appeler `Flush` sur un `bufio.Writer` ?"
    choices:
      - {text: "Sinon, les données restées dans le tampon ne sont jamais écrites", correct: true}
      - {text: "Sinon, le fichier sous-jacent reste ouvert et verrouillé", correct: false}
      - {text: "Pour libérer la mémoire du tampon, que le GC ne récupère pas", correct: false}
      - {text: "Pour lire les erreurs, que `Write` ne renvoie jamais", correct: false}
    answer: "`bufio.Writer` garde les petites écritures dans un tampon et n'écrit que quand il est plein : la fin reste en mémoire tant qu'on n'appelle pas `Flush`. Fermer le fichier ne vide pas ce tampon, que le fichier ignore."
  - key: limite-defaut-bufio-scanner
    format: course
    question: "Quelle est, par défaut, la taille maximale d'une ligne lue par un `bufio.Scanner` ?"
    choices:
      - {text: "64 Ko, réglable avec `sc.Buffer`", correct: true}
      - {text: "4 Ko, la taille de son tampon initial", correct: false}
      - {text: "Aucune : le tampon grandit sans limite", correct: false}
      - {text: "1 Mo, réglable avec `sc.Split`", correct: false}
    answer: "`bufio.MaxScanTokenSize` vaut 64 Ko : au-delà, `Scan` s'arrête et `Err` renvoie `bufio.ErrTooLong`. `sc.Buffer` relève la limite ; le tampon initial, lui, fait 4 Ko et grandit jusqu'à elle."
  - key: err
    format: course
    question: Pourquoi appeler `sc.Err()` après une boucle `for sc.Scan()` ?
    choices:
      - {text: "`Scan` renvoie `false` à la fin comme sur une erreur : seul `Err` les distingue", correct: true}
      - {text: "`Err` ferme le fichier et rend son descripteur au système", correct: false}
      - {text: "`Err` renvoie `io.EOF` à la fin normale, qu'il faut ignorer", correct: false}
      - {text: "`Scan` panique sur une erreur, et `Err` permet de la rattraper", correct: false}
    answer: "`Scan` renvoie `false` à la fin du fichier comme sur une erreur de lecture ou une ligne trop longue ; seul `Err` les distingue. À la fin normale, il vaut `nil`, pas `io.EOF`."
  - key: bytes
    format: course
    question: "Quelle différence y a-t-il entre `sc.Text()` et `sc.Bytes()` ?"
    choices:
      - {text: "`Bytes` donne une vue sur le tampon, écrasée au `Scan` suivant ; `Text` une copie", correct: true}
      - {text: "`Bytes` donne une copie neuve à chaque appel ; `Text` une vue sur le tampon", correct: false}
      - {text: "`Bytes` garde le saut de ligne final ; `Text` le retire de la ligne", correct: false}
      - {text: "Aucune : `Text` appelle `Bytes` et convertit, sans autre effet", correct: false}
    answer: "`Text` alloue une nouvelle `string` ; `Bytes` renvoie une vue sur le tampon interne, sans allocation, mais réécrite au `Scan` suivant : il faut la copier pour la garder."
  - key: vf-flush
    format: true-false
    question: Sans appel à Flush, les dernières données d'un bufio.Writer peuvent ne jamais être écrites.
    truth: true
    answer: Elles restent dans le tampon.
  - key: vf-newline
    format: true-false
    question: '`sc.Text()` renvoie la ligne avec son "\n" final.'
    truth: false
    answer: Le séparateur est retiré, ainsi qu'un \r avant lui.
  - key: vf-limite
    format: true-false
    question: Par défaut, un bufio.Scanner refuse les lignes de plus de 64 Ko.
    truth: true
    answer: sc.Buffer relève la limite.
  - key: vf-bytes
    format: true-false
    question: La slice renvoyée par `sc.Bytes()` reste valable après le Scan suivant.
    truth: false
    answer: Le tampon est réutilisé ; on copie si l'on veut la garder.
  - key: qcm-split
    format: multiple-choice
    question: "Laquelle de ces fonctions de découpage n'existe pas dans `bufio` ?"
    choices:
      - {text: "`bufio.ScanSentences`", correct: true}
      - {text: "`bufio.ScanLines`, le défaut", correct: false}
      - {text: "`bufio.ScanWords`", correct: false}
      - {text: "`bufio.ScanRunes`", correct: false}
    answer: "bufio fournit `ScanLines` (le défaut), `ScanWords`, `ScanRunes` et `ScanBytes`, mais aucun découpage en phrases ; on peut écrire sa propre `SplitFunc`."
  - key: qcm-tampon
    format: multiple-choice
    question: Pourquoi envelopper un fichier dans un bufio.Writer pour écrire un million de petites lignes ?
    choices:
      - {text: "Pour regrouper les écritures et faire bien moins d'appels système", correct: true}
      - {text: "Pour que le fichier se ferme seul à la fin de l'écriture", correct: false}
      - {text: "Pour écrire les lignes en parallèle, dans plusieurs goroutines", correct: false}
      - {text: "Pour garantir que chaque ligne est sur le disque dès son écriture", correct: false}
    answer: "Chaque `Write` sur un `*os.File` est un appel système ; le tampon les regroupe, ce qui accélère nettement l'écriture. Il faut toujours `Flush`, puis `Close`."
  - key: qcm-longue
    format: multiple-choice
    question: "Un fichier contient des lignes JSON de 2 Mo. Lesquelles de ces solutions permettent de les lire ?"
    choices:
      - text: Relever la limite avec sc.Buffer
        correct: true
      - text: Ou utiliser un bufio.Reader avec ReadBytes('\n')
        correct: true
      - text: Rien, la limite par défaut suffit
        correct: false
      - text: Lire caractère par caractère avec fmt.Scan
        correct: false
    answer: Sans cela, Scan s'arrête avec bufio.ErrTooLong.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre terminer l'écriture d'un fichier tamponné ?
    choices:
      - {text: "Flush du bufio.Writer, puis Close du fichier, en vérifiant les deux erreurs", correct: true}
      - {text: "Close du fichier, puis Flush du bufio.Writer, en vérifiant les deux erreurs", correct: false}
      - {text: "Flush seulement : Close est facultatif pour un fichier écrit par bufio", correct: false}
      - {text: "Close seulement : il vide le tampon du bufio.Writer avant de fermer", correct: false}
    answer: Le fichier ne connaît pas le tampon de bufio.
  - key: trous-scan
    format: fill-in
    question: |-
      Complète la lecture ligne par ligne :
      ```go
      sc := bufio.NewScanner(f)
      for sc.___() {
      	fmt.Println(sc.___())
      }
      ```
    blanks:
      - - Scan
      - - Text
    answer: Scan avance, Text donne la ligne.
  - key: trous-err
    format: fill-in
    question: |-
      Complète la vérification après la boucle :
      ```go
      if err := sc.___(); err != nil {
      	return err
      }
      ```
    blanks:
      - - Err
    answer: Err distingue la fin d'une erreur.
  - key: trous-flush
    format: fill-in
    question: |-
      Complète pour vider le tampon :
      ```go
      w := bufio.NewWriter(f)
      fmt.Fprintln(w, "fin")
      if err := w.___(); err != nil {
      	return err
      }
      ```
    blanks:
      - - Flush
    answer: Flush écrit ce qui reste dans le tampon.
  - key: trous-words
    format: fill-in
    question: |-
      Complète pour découper par mots :
      ```go
      sc.Split(bufio.___)
      ```
    blanks:
      - - ScanWords
    answer: ScanWords sépare sur les espaces.
  - key: code-lignes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      sc := bufio.NewScanner(strings.NewReader("un\ndeux\r\ntrois"))
      for sc.Scan() {
      	fmt.Printf("%q ", sc.Text())
      }
      fmt.Println()
      ```
    choices:
      - {text: "`\"un\" \"deux\" \"trois\"`", correct: true}
      - {text: "`\"un\" \"deux\\r\" \"trois\"`", correct: false}
      - {text: "`\"un\\n\" \"deux\\r\\n\" \"trois\"`", correct: false}
      - {text: "`\"un\" \"deux\"`", correct: false}
    answer: '`"un" "deux" "trois"` : le séparateur est retiré, \r compris.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tsc := bufio.NewScanner(strings.NewReader(\"un\\ndeux\\r\\ntrois\"))\n\tfor sc.Scan() {\n\t\tfmt.Printf(\"%q \", sc.Text())\n\t}\n\tfmt.Println()\n}\n"
      output: '"un" "deux" "trois"'
  - key: code-mots
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      sc := bufio.NewScanner(strings.NewReader("  le   petit\tchat \n"))
      sc.Split(bufio.ScanWords)
      n := 0
      for sc.Scan() {
      	n++
      }
      fmt.Println(n)
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`1`", correct: false}
    answer: '`3` : ScanWords ignore les espaces multiples, tabulations et retours à la ligne.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tsc := bufio.NewScanner(strings.NewReader(\"  le   petit\\tchat \\n\"))\n\tsc.Split(bufio.ScanWords)\n\tn := 0\n\tfor sc.Scan() {\n\t\tn++\n\t}\n\tfmt.Println(n)\n}\n"
      output: '3'
  - key: code-sans-flush
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      w := bufio.NewWriter(os.Stdout)
      fmt.Fprint(w, "perdu ")
      fmt.Println("fin")
      ```
    choices:
      - {text: "`fin`", correct: true}
      - {text: "`perdu fin`", correct: false}
      - {text: "`fin perdu`", correct: false}
      - {text: "`perdu`", correct: false}
    answer: '`fin` seulement : « perdu » est resté dans le tampon, jamais vidé.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tw := bufio.NewWriter(os.Stdout)\n\tfmt.Fprint(w, \"perdu \")\n\tfmt.Println(\"fin\")\n}\n"
      output: fin
  - key: code-flush
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      w := bufio.NewWriter(os.Stdout)
      fmt.Fprintln(w, "un")
      fmt.Println("deux")
      w.Flush()
      ```
    choices:
      - text: |-
          ```
          deux
          un
          ```
        correct: true
      - text: |-
          ```
          un
          deux
          ```
        correct: false
      - {text: "`deux`", correct: false}
      - {text: "`un deux`", correct: false}
    answer: '`deux` puis `un` : « un » n''est écrit qu''au Flush.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tw := bufio.NewWriter(os.Stdout)\n\tfmt.Fprintln(w, \"un\")\n\tfmt.Println(\"deux\")\n\tw.Flush()\n}\n"
      output: |-
        deux
        un
  - key: bug-err
    format: bug-fix
    question: |-
      L'import s'arrête au milieu d'un fichier sans le signaler. Quelle correction est la bonne ?
      ```go
      sc := bufio.NewScanner(f)
      for sc.Scan() {
      	importer(sc.Text())
      }
      return nil
      ```
    choices:
      - {text: "Renvoyer `sc.Err()` après la boucle, au lieu de `nil`", correct: true}
      - {text: "Tester si `sc.Text()` est vide, signe de la fin du fichier", correct: false}
      - {text: "Remplacer `for sc.Scan()` par une boucle `for` infinie", correct: false}
      - {text: "Appeler `f.Close()` après la boucle, qui renvoie l'erreur", correct: false}
    answer: "```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\timporter(sc.Text())\n}\nreturn sc.Err()\n```\nUne ligne trop longue ou une erreur de lecture arrêtait la boucle comme une fin normale ; Err la remonte."
  - key: bug-flush
    format: bug-fix
    question: |-
      Les rapports générés sont tronqués à la fin. Quelle correction est la bonne ?
      ```go
      f, err := os.Create(chemin)
      if err != nil {
      	return err
      }
      defer f.Close()
      w := bufio.NewWriter(f)
      for _, l := range lignes {
      	fmt.Fprintln(w, l)
      }
      return nil
      ```
    choices:
      - {text: "Appeler `w.Flush()` après la boucle, puis renvoyer l'erreur de `f.Close()`", correct: true}
      - {text: "Appeler `f.Sync()` avant de quitter, qui vide aussi le tampon de bufio", correct: false}
      - {text: "Créer le `bufio.Writer` avec un tampon plus grand, qui contienne tout", correct: false}
      - {text: "Écrire avec `fmt.Fprint` plutôt que `fmt.Fprintln`, pour garder la fin", correct: false}
    answer: "```go\nw := bufio.NewWriter(f)\nfor _, l := range lignes {\n\tfmt.Fprintln(w, l)\n}\nif err := w.Flush(); err != nil {\n\treturn err\n}\nreturn f.Close()\n```\nSans Flush, la fin restait dans le tampon ; on vérifie aussi l'erreur de Close pour un fichier écrit."
  - key: bug-bytes
    format: bug-fix
    question: |-
      Sur un gros fichier, les lignes gardées finissent par contenir des morceaux d'autres lignes. Quelle correction est la bonne ?
      ```go
      var lignes [][]byte
      for sc.Scan() {
      	lignes = append(lignes, sc.Bytes())
      }
      ```
    choices:
      - {text: "Copier chaque ligne avec `bytes.Clone(sc.Bytes())`, ou garder `sc.Text()`", correct: true}
      - {text: "Préallouer `lignes` avec `make([][]byte, 0, 1000)` avant la boucle", correct: false}
      - {text: "Appeler `sc.Buffer` avec un tampon plus grand, pour garder les lignes", correct: false}
      - {text: "Ajouter `[:]` à `sc.Bytes()`, pour obtenir une nouvelle slice", correct: false}
    answer: |-
      ```go
      var lignes [][]byte
      for sc.Scan() {
      	lignes = append(lignes, bytes.Clone(sc.Bytes()))
      }
      ```
      `Bytes` renvoie une vue sur le tampon, réutilisé à chaque `Scan` : les lignes gardées pointent toutes dans ce tampon. On copie la vue pour la garder (ou l'on garde `sc.Text()`) ; `[:]` ne copie rien.
  - key: bug-longue
    format: bug-fix
    question: |-
      L'import d'un fichier JSON Lines s'arrête avec « bufio.Scanner: token too long ». Quelle correction est la bonne ?
      ```go
      sc := bufio.NewScanner(f)
      for sc.Scan() {
      	decoder(sc.Bytes())
      }
      ```
    choices:
      - {text: "Relever la limite avec `sc.Buffer`, et vérifier `sc.Err()` après la boucle", correct: true}
      - {text: "Passer à `bufio.ScanWords`, qui découpe les lignes en morceaux plus courts", correct: false}
      - {text: "Envelopper `f` dans un `bufio.NewReaderSize(f, 16<<20)` avant le `Scanner`", correct: false}
      - {text: "Appeler `sc.Scan()` une seconde fois, qui reprend après la ligne trop longue", correct: false}
    answer: "```go\nsc := bufio.NewScanner(f)\nsc.Buffer(make([]byte, 0, 64*1024), 16<<20) // lignes jusqu'à 16 Mo\nfor sc.Scan() {\n\tdecoder(sc.Bytes())\n}\nif err := sc.Err(); err != nil {\n\treturn err\n}\n```\nLa limite par défaut de 64 Ko par ligne était dépassée ; sc.Buffer la relève, et Err signale le problème."
