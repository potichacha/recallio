notion: bufio
cards:
  - key: appeler-flush-bufio-writer
    format: course
    question: Pourquoi appeler Flush sur un bufio.Writer ?
    answer: Sinon les données restées dans le buffer ne sont jamais écrites.
  - key: limite-defaut-bufio-scanner
    format: course
    question: Quelle est la limite par défaut de bufio.Scanner ?
    answer: 64 Ko par jeton, réglable avec Buffer.
