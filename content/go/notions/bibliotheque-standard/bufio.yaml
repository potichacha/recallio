notion: bufio
lesson: "Le package **`bufio`** ajoute un **tampon** autour d'un `io.Reader` ou d'un `io.Writer` : moins d'appels système, et\ndes outils pour lire ligne par ligne.\n\n**Lire ligne par ligne** avec un `Scanner` :\n\n```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\tligne := sc.Text() // sans le \"\\n\" (ni le \"\\r\\n\")\n\ttraiter(ligne)\n}\nif err := sc.Err(); err != nil { // à vérifier après la boucle\n\treturn err\n}\n```\n\n- `sc.Split(bufio.ScanWords)` découpe par mots, `bufio.ScanRunes` par caractères ;\n- une ligne de plus de **64 Ko** fait échouer le Scanner avec `bufio.ErrTooLong` : `sc.Buffer(make([]byte, 0, 64*1024),\n  10<<20)` relève la limite ;\n- `sc.Bytes()` évite une allocation mais n'est valable que jusqu'au prochain `Scan`.\n\n**Écrire avec un tampon** :\n\n```go\nw := bufio.NewWriter(f)\nfor _, l := range lignes {\n\tfmt.Fprintln(w, l)\n}\nif err := w.Flush(); err != nil { // sans Flush, la fin reste dans le tampon\n\treturn err\n}\n```\n\n`bufio.Reader` offre aussi `ReadString('\\n')`, `ReadRune` et `Peek`, pour les analyses plus fines.\n\n**En entretien** : « Scanner pour lire ligne par ligne, Err à vérifier après la boucle, limite de 64 Ko par ligne ;\nWriter tamponné et Flush obligatoire à la fin. »"
tour:
  - title: bufio
    text: |-
      `bufio` ajoute un **tampon** à un Reader ou à un Writer. `bufio.Scanner` découpe un flux en lignes (ou en mots) :
      `for sc.Scan() { … sc.Text() … }`, puis on vérifie `sc.Err()`.

      `bufio.Writer` accumule les écritures et ne les transmet qu'en gros morceaux, ce qui fait bien moins d'appels
      système. Il faut penser à `Flush()` à la fin, sinon la dernière partie reste dans le tampon.
    example:
      files:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"os"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	n := 0
          	for sc.Scan() {
          		n++
          		fmt.Println(n, sc.Text())
          	}
          	if err := sc.Err(); err != nil {
          		fmt.Println("erreur :", err)
          	}

          	w := bufio.NewWriter(os.Stdout)
          	fmt.Fprintln(w, "écrit via un tampon")
          	w.Flush()
          }
      output: |-
        1 première ligne
        2 deuxième ligne
        3 troisième ligne
        écrit via un tampon
    task:
      instructions: |-
        Compte les **mots** du texte plutôt que ses lignes, en réglant le Scanner avec `sc.Split(bufio.ScanWords)` : le
        programme doit afficher `mots : 6`.
      starter:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	n := 0
          	for sc.Scan() {
          		n++
          	}
          	fmt.Println("lignes :", n)
          }
      solution:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"strings"
          )

          func main() {
          	texte := "première ligne\ndeuxième ligne\ntroisième ligne"
          	sc := bufio.NewScanner(strings.NewReader(texte))
          	sc.Split(bufio.ScanWords)
          	n := 0
          	for sc.Scan() {
          		n++
          	}
          	fmt.Println("mots :", n)
          }
      output: |-
        mots : 6
cards:
  - key: appeler-flush-bufio-writer
    format: course
    question: Pourquoi appeler Flush sur un bufio.Writer ?
    answer: Sinon les données restées dans le buffer ne sont jamais écrites.
  - key: limite-defaut-bufio-scanner
    format: course
    question: Quelle est la limite par défaut de bufio.Scanner ?
    answer: 64 Ko par jeton, réglable avec Buffer.
  - key: err
    format: course
    question: Pourquoi appeler `sc.Err()` après une boucle `for sc.Scan()` ?
    answer: Scan renvoie false aussi bien à la fin du fichier qu'en cas d'erreur de lecture (ou de ligne trop longue) ; seul Err dit laquelle, et vaut nil à la fin normale.
  - key: bytes
    format: course
    question: Quelle différence entre `sc.Text()` et `sc.Bytes()` ?
    answer: 'Text renvoie une nouvelle string (une allocation) ; Bytes renvoie une vue sur le tampon interne, sans allocation, mais écrasée au Scan suivant : il faut la copier pour la garder.'
  - key: vf-flush
    format: true-false
    question: Sans appel à Flush, les dernières données d'un bufio.Writer peuvent ne jamais être écrites.
    truth: true
    answer: Elles restent dans le tampon.
  - key: vf-newline
    format: true-false
    question: '`sc.Text()` renvoie la ligne avec son "\n" final.'
    truth: false
    answer: Le séparateur est retiré, ainsi qu'un \r avant lui.
  - key: vf-limite
    format: true-false
    question: Par défaut, un bufio.Scanner refuse les lignes de plus de 64 Ko.
    truth: true
    answer: sc.Buffer relève la limite.
  - key: vf-bytes
    format: true-false
    question: La slice renvoyée par `sc.Bytes()` reste valable après le Scan suivant.
    truth: false
    answer: Le tampon est réutilisé ; on copie si l'on veut la garder.
  - key: qcm-split
    format: multiple-choice
    question: Quelles fonctions de découpage fournit bufio ?
    choices:
      - text: '`bufio.ScanLines`, le défaut'
        correct: true
      - text: '`bufio.ScanWords`'
        correct: true
      - text: '`bufio.ScanRunes`'
        correct: true
      - text: '`bufio.ScanSentences`'
        correct: false
    answer: On peut aussi écrire sa propre SplitFunc.
  - key: qcm-tampon
    format: multiple-choice
    question: Pourquoi envelopper un fichier dans un bufio.Writer pour écrire un million de petites lignes ?
    choices:
      - text: Pour regrouper les écritures et faire bien moins d'appels système
        correct: true
      - text: Pour accélérer nettement l'écriture
        correct: true
      - text: Pour chiffrer le fichier
        correct: false
      - text: Pour ne plus avoir à fermer le fichier
        correct: false
    answer: Il faut toujours Flush puis Close.
  - key: qcm-longue
    format: multiple-choice
    question: Un fichier contient des lignes JSON de 2 Mo. Que faire avec un Scanner ?
    choices:
      - text: Relever la limite avec sc.Buffer
        correct: true
      - text: Ou utiliser un bufio.Reader avec ReadBytes('\n')
        correct: true
      - text: Rien, la limite par défaut suffit
        correct: false
      - text: Lire caractère par caractère avec fmt.Scan
        correct: false
    answer: Sans cela, Scan s'arrête avec bufio.ErrTooLong.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre terminer l'écriture d'un fichier tamponné ?
    choices:
      - text: Flush du bufio.Writer, puis Close du fichier, en vérifiant les deux erreurs
        correct: true
      - text: Close du fichier, puis Flush
        correct: false
      - text: Flush seulement, Close est facultatif
        correct: false
      - text: Close seulement, il vide le tampon
        correct: false
    answer: Le fichier ne connaît pas le tampon de bufio.
  - key: trous-scan
    format: fill-in
    question: "Complétez la lecture ligne par ligne :\n```go\nsc := bufio.NewScanner(f)\nfor sc.___() {\n\tfmt.Println(sc.___())\n}\n```"
    blanks:
      - - Scan
      - - Text
    answer: Scan avance, Text donne la ligne.
  - key: trous-err
    format: fill-in
    question: "Complétez la vérification après la boucle :\n```go\nif err := sc.___(); err != nil {\n\treturn err\n}\n```"
    blanks:
      - - Err
    answer: Err distingue la fin d'une erreur.
  - key: trous-flush
    format: fill-in
    question: "Complétez pour vider le tampon :\n```go\nw := bufio.NewWriter(f)\nfmt.Fprintln(w, \"fin\")\nif err := w.___(); err != nil {\n\treturn err\n}\n```"
    blanks:
      - - Flush
    answer: Flush écrit ce qui reste dans le tampon.
  - key: trous-words
    format: fill-in
    question: |-
      Complétez pour découper par mots :
      ```go
      sc.Split(bufio.___)
      ```
    blanks:
      - - ScanWords
    answer: ScanWords sépare sur les espaces.
  - key: code-lignes
    format: code-output
    question: "```go\nsc := bufio.NewScanner(strings.NewReader(\"un\\ndeux\\r\\ntrois\"))\nfor sc.Scan() {\n\tfmt.Printf(\"%q \", sc.Text())\n}\nfmt.Println()\n```"
    answer: '`"un" "deux" "trois"` : le séparateur est retiré, \r compris.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tsc := bufio.NewScanner(strings.NewReader(\"un\\ndeux\\r\\ntrois\"))\n\tfor sc.Scan() {\n\t\tfmt.Printf(\"%q \", sc.Text())\n\t}\n\tfmt.Println()\n}\n"
      output: '"un" "deux" "trois"'
  - key: code-mots
    format: code-output
    question: "```go\nsc := bufio.NewScanner(strings.NewReader(\"  le   petit\\tchat \\n\"))\nsc.Split(bufio.ScanWords)\nn := 0\nfor sc.Scan() {\n\tn++\n}\nfmt.Println(n)\n```"
    answer: '`3` : ScanWords ignore les espaces multiples, tabulations et retours à la ligne.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tsc := bufio.NewScanner(strings.NewReader(\"  le   petit\\tchat \\n\"))\n\tsc.Split(bufio.ScanWords)\n\tn := 0\n\tfor sc.Scan() {\n\t\tn++\n\t}\n\tfmt.Println(n)\n}\n"
      output: '3'
  - key: code-sans-flush
    format: code-output
    question: |-
      ```go
      w := bufio.NewWriter(os.Stdout)
      fmt.Fprint(w, "perdu ")
      fmt.Println("fin")
      ```
    answer: '`fin` seulement : « perdu » est resté dans le tampon, jamais vidé.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tw := bufio.NewWriter(os.Stdout)\n\tfmt.Fprint(w, \"perdu \")\n\tfmt.Println(\"fin\")\n}\n"
      output: fin
  - key: code-flush
    format: code-output
    question: |-
      ```go
      w := bufio.NewWriter(os.Stdout)
      fmt.Fprintln(w, "un")
      fmt.Println("deux")
      w.Flush()
      ```
    answer: '`deux` puis `un` : « un » n''est écrit qu''au Flush.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tw := bufio.NewWriter(os.Stdout)\n\tfmt.Fprintln(w, \"un\")\n\tfmt.Println(\"deux\")\n\tw.Flush()\n}\n"
      output: |-
        deux
        un
  - key: bug-err
    format: bug-fix
    question: "L'import s'arrête au milieu d'un fichier sans le signaler :\n```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\timporter(sc.Text())\n}\nreturn nil\n```"
    answer: "```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\timporter(sc.Text())\n}\nreturn sc.Err()\n```\nUne ligne trop longue ou une erreur de lecture arrêtait la boucle comme une fin normale ; Err la remonte."
  - key: bug-flush
    format: bug-fix
    question: "Les rapports générés sont tronqués à la fin :\n```go\nf, err := os.Create(chemin)\nif err != nil {\n\treturn err\n}\ndefer f.Close()\nw := bufio.NewWriter(f)\nfor _, l := range lignes {\n\tfmt.Fprintln(w, l)\n}\nreturn nil\n```"
    answer: "```go\nw := bufio.NewWriter(f)\nfor _, l := range lignes {\n\tfmt.Fprintln(w, l)\n}\nif err := w.Flush(); err != nil {\n\treturn err\n}\nreturn f.Close()\n```\nSans Flush, la fin restait dans le tampon ; on vérifie aussi l'erreur de Close pour un fichier écrit."
  - key: bug-bytes
    format: bug-fix
    question: "Toutes les lignes gardées ont le même contenu, celui de la dernière :\n```go\nvar lignes [][]byte\nfor sc.Scan() {\n\tlignes = append(lignes, sc.Bytes())\n}\n```"
    answer: "```go\nvar lignes [][]byte\nfor sc.Scan() {\n\tlignes = append(lignes, bytes.Clone(sc.Bytes()))\n}\n```\nBytes renvoie une vue sur le tampon, réutilisé à chaque Scan ; on la copie pour la garder (ou l'on garde sc.Text())."
  - key: bug-longue
    format: bug-fix
    question: "L'import d'un fichier JSON Lines s'arrête avec « bufio.Scanner: token too long » :\n```go\nsc := bufio.NewScanner(f)\nfor sc.Scan() {\n\tdecoder(sc.Bytes())\n}\n```"
    answer: "```go\nsc := bufio.NewScanner(f)\nsc.Buffer(make([]byte, 0, 64*1024), 16<<20) // lignes jusqu'à 16 Mo\nfor sc.Scan() {\n\tdecoder(sc.Bytes())\n}\nif err := sc.Err(); err != nil {\n\treturn err\n}\n```\nLa limite par défaut de 64 Ko par ligne était dépassée ; sc.Buffer la relève, et Err signale le problème."
