notion: sort-paquet
lesson: |-
  Avant les génériques, on triait avec le package **`sort`**. Il reste très présent dans le code existant :

  ```go
  sort.Ints(entiers)
  sort.Strings(noms)
  sort.Slice(personnes, func(i, j int) bool { return personnes[i].Age < personnes[j].Age })
  sort.SliceStable(personnes, func(i, j int) bool { ... })
  ```

  Pour un type à soi, on implémente **`sort.Interface`** :

  ```go
  type ParAge []Personne

  func (p ParAge) Len() int           { return len(p) }
  func (p ParAge) Less(i, j int) bool { return p[i].Age < p[j].Age }
  func (p ParAge) Swap(i, j int)      { p[i], p[j] = p[j], p[i] }

  sort.Sort(ParAge(personnes))
  sort.Sort(sort.Reverse(ParAge(personnes))) // ordre inverse
  ```

  Différences avec `slices` :
  - la fonction de `sort.Slice` reçoit des **indices** et renvoie un **booléen** « i avant j », alors que
    `slices.SortFunc` reçoit des **éléments** et renvoie un **entier** ;
  - `slices` est plus rapide et typé : la documentation de `sort` recommande `slices` pour le nouveau code ;
  - `sort.Sort` et `sort.Slice` ne sont **pas stables** ; `sort.Stable` et `sort.SliceStable` le sont.

  **`sort.Search(n, f)`** cherche par dichotomie le plus petit indice i dans [0, n) pour lequel `f(i)` est vrai ;
  `f` doit être faux puis vrai sur l'intervalle.

  La fonction `Less` doit définir un **ordre strict** cohérent ; sinon le résultat du tri est imprévisible.

  **En entretien** : « sort.Interface : Len, Less, Swap ; sort.Slice avec des indices et un booléen ; Stable pour garder
  l'ordre des égaux ; sort.Search pour la dichotomie ; slices pour le nouveau code. »
cards:
  - key: trier-plusieurs-criteres
    format: course
    question: Comment trier par plusieurs critères ?
    answer: SortFunc avec cmp.Or(cmp.Compare(...), cmp.Compare(...)).
  - key: interface
    format: course
    question: Quelles méthodes faut-il implémenter pour trier un type avec sort.Sort ?
    answer: Len() int, Less(i, j int) bool et Swap(i, j int), qui forment sort.Interface.
  - key: search
    format: course
    question: Que fait sort.Search(n, f) ?
    answer: Il renvoie, par dichotomie, le plus petit indice i de [0, n) pour lequel f(i) est vrai (ou n si aucun) ; f doit être faux puis vrai sur l'intervalle.
  - key: vs-slices
    format: course
    question: Pourquoi préférer slices.SortFunc à sort.Slice dans du nouveau code ?
    answer: slices est générique et typé (la fonction reçoit des éléments, pas des indices), plus rapide, et la documentation de sort le recommande ; sort reste utile dans le code existant ou avec sort.Interface.
  - key: vf-stable
    format: true-false
    question: '`sort.Slice` est un tri stable.'
    truth: false
    answer: sort.SliceStable l'est.
  - key: vf-reverse
    format: true-false
    question: '`sort.Sort(sort.Reverse(x))` trie x dans l''ordre inverse de Less.'
    truth: true
    answer: Reverse inverse la méthode Less.
  - key: vf-indices
    format: true-false
    question: La fonction passée à sort.Slice reçoit deux indices.
    truth: true
    answer: Elle compare s[i] et s[j].
  - key: vf-less
    format: true-false
    question: Une fonction Less incohérente (par exemple <= au lieu de <) n'a aucun effet sur le tri.
    truth: false
    answer: Less doit être un ordre strict ; sinon le résultat est imprévisible.
  - key: qcm-fonctions
    format: multiple-choice
    question: Lesquelles de ces fonctions existent dans le package sort ?
    choices:
      - text: '`sort.Ints`'
        correct: true
      - text: '`sort.SliceStable`'
        correct: true
      - text: '`sort.Search`'
        correct: true
      - text: '`sort.Max`'
        correct: false
    answer: Pour le maximum, slices.Max.
  - key: qcm-search
    format: multiple-choice
    question: Comment trouver le premier indice d'une slice triée dont la valeur est au moins x ?
    choices:
      - text: '`sort.Search(len(s), func(i int) bool { return s[i] >= x })`'
        correct: true
      - text: '`slices.BinarySearch(s, x)`'
        correct: true
      - text: '`sort.Search(len(s), func(i int) bool { return s[i] == x })`'
        correct: false
      - text: '`sort.Find(s, x)` avec une slice non triée'
        correct: false
    answer: Avec ==, la fonction ne serait pas faux puis vrai sur l'intervalle.
  - key: qcm-stable
    format: multiple-choice
    question: Des commandes déjà triées par date doivent être triées par client en gardant l'ordre des dates. Que choisir ?
    choices:
      - text: '`sort.SliceStable` par client'
        correct: true
      - text: '`slices.SortStableFunc` par client'
        correct: true
      - text: '`sort.Slice` par client'
        correct: false
      - text: '`sort.Ints`'
        correct: false
    answer: Un tri stable garde l'ordre précédent entre égaux.
  - key: qcm-less
    format: multiple-choice
    question: Quelle méthode Less trie des personnes par âge décroissant ?
    choices:
      - text: '`return p[i].Age > p[j].Age`'
        correct: true
      - text: '`return p[i].Age >= p[j].Age`'
        correct: false
      - text: '`return p[i].Age - p[j].Age`'
        correct: false
      - text: '`return p[j].Age <= p[i].Age`'
        correct: false
    answer: Less doit être strict et renvoyer un booléen.
  - key: trous-slice
    format: fill-in
    question: "Complétez pour trier par prix :\n```go\nsort.___(produits, func(i, j int) bool {\n\treturn produits[i].Prix < produits[j].Prix\n})\n```"
    blanks:
      - - Slice
    answer: sort.Slice.
  - key: trous-less
    format: fill-in
    question: |-
      Complétez sort.Interface :
      ```go
      func (p ParNom) Len() int { return len(p) }
      func (p ParNom) ___(i, j int) bool { return p[i].Nom < p[j].Nom }
      func (p ParNom) Swap(i, j int) { p[i], p[j] = p[j], p[i] }
      ```
    blanks:
      - - Less
    answer: Less.
  - key: trous-reverse
    format: fill-in
    question: |-
      Complétez pour trier à l'envers :
      ```go
      sort.Sort(sort.___(ParNom(personnes)))
      ```
    blanks:
      - - Reverse
    answer: sort.Reverse.
  - key: trous-strings
    format: fill-in
    question: |-
      Complétez pour trier des chaînes :
      ```go
      sort.___(noms)
      ```
    blanks:
      - - Strings
    answer: sort.Strings (ou slices.Sort).
  - key: code-interface
    format: code-output
    question: |-
      ```go
      type ParLongueur []string

      func (p ParLongueur) Len() int           { return len(p) }
      func (p ParLongueur) Less(i, j int) bool { return len(p[i]) < len(p[j]) }
      func (p ParLongueur) Swap(i, j int)      { p[i], p[j] = p[j], p[i] }

      mots := []string{"banane", "kiwi", "pomme"}
      sort.Sort(ParLongueur(mots))
      fmt.Println(mots)
      ```
    answer: '`[kiwi pomme banane]` : trié par longueur.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sort\"\n)\n\ntype ParLongueur []string\n\n\nfunc (p ParLongueur) Len() int           { return len(p) }\n\nfunc (p ParLongueur) Less(i, j int) bool { return len(p[i]) < len(p[j]) }\n\nfunc (p ParLongueur) Swap(i, j int)      { p[i], p[j] = p[j], p[i] }\n\nfunc main() {\n\tmots := []string{\"banane\", \"kiwi\", \"pomme\"}\n\tsort.Sort(ParLongueur(mots))\n\tfmt.Println(mots)\n}\n"
      output: '[kiwi pomme banane]'
  - key: code-search
    format: code-output
    question: |-
      ```go
      s := []int{1, 3, 5, 7, 9}
      i := sort.Search(len(s), func(i int) bool { return s[i] >= 6 })
      j := sort.Search(len(s), func(i int) bool { return s[i] >= 10 })
      fmt.Println(i, s[i], j)
      ```
    answer: '`3 7 5` : le premier élément ≥ 6 est à l''indice 3 ; aucun n''est ≥ 10, d''où len(s).'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sort\"\n)\n\nfunc main() {\n\ts := []int{1, 3, 5, 7, 9}\n\ti := sort.Search(len(s), func(i int) bool { return s[i] >= 6 })\n\tj := sort.Search(len(s), func(i int) bool { return s[i] >= 10 })\n\tfmt.Println(i, s[i], j)\n}\n"
      output: 3 7 5
  - key: code-stable
    format: code-output
    question: "```go\ntype C struct {\n\tClient string\n\tN      int\n}\n\ncs := []C{{\"b\", 1}, {\"a\", 2}, {\"b\", 3}, {\"a\", 4}}\nsort.SliceStable(cs, func(i, j int) bool { return cs[i].Client < cs[j].Client })\nfmt.Println(cs)\n```"
    answer: '`[{a 2} {a 4} {b 1} {b 3}]` : l''ordre d''origine est gardé entre clients égaux.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sort\"\n)\n\ntype C struct {\n\tClient string\n\tN      int\n}\n\nfunc main() {\n\tcs := []C{{\"b\", 1}, {\"a\", 2}, {\"b\", 3}, {\"a\", 4}}\n\tsort.SliceStable(cs, func(i, j int) bool { return cs[i].Client < cs[j].Client })\n\tfmt.Println(cs)\n}\n"
      output: '[{a 2} {a 4} {b 1} {b 3}]'
  - key: code-reverse
    format: code-output
    question: |-
      ```go
      s := []int{3, 1, 2}
      sort.Sort(sort.Reverse(sort.IntSlice(s)))
      fmt.Println(s)
      ```
    answer: '`[3 2 1]` : sort.IntSlice implémente sort.Interface, Reverse inverse Less.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sort\"\n)\n\nfunc main() {\n\ts := []int{3, 1, 2}\n\tsort.Sort(sort.Reverse(sort.IntSlice(s)))\n\tfmt.Println(s)\n}\n"
      output: '[3 2 1]'
