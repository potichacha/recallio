notion: encoding-json
cards:
  - key: omitempty-vs-omitzero
    format: course
    question: omitempty vs omitzero ?
    answer: omitempty omet les valeurs "vides" selon des règles fixes ; omitzero (Go 1.24) omet selon la vraie valeur zéro, y compris time.Time et IsZero().
  - key: devenu-encoding-json-1-27
    format: course
    question: Qu'est devenu encoding/json en Go 1.27 ?
    answer: Il repose sur l'implémentation v2, et encoding/json/v2 est disponible en version stable.
  - key: champs-encoding-json-serialise
    format: course
    question: Quels champs encoding/json sérialise-t-il ?
    answer: Seulement les champs exportés.
  - key: sont-decodes-nombres-interface
    format: course
    question: En quoi sont décodés les nombres dans une interface{} ?
    answer: En float64, d'où une perte de précision possible ; UseNumber les garde en json.Number.
  - key: rejeter-champs-json-inconnus
    format: course
    question: Comment rejeter les champs JSON inconnus ?
    answer: Decoder.DisallowUnknownFields().
  - key: apporte-encoding-json-v2
    format: course
    question: Qu'apporte encoding/json/v2 ?
    answer: Une API plus cohérente, des défauts plus stricts et un décodage plus rapide (stable en Go 1.27).
  - key: client-envoie-montants-json-certains-arrivent
    format: scenario
    question: Un client envoie des montants en JSON et certains arrivent arrondis.
    answer: 'Si le JSON est décodé dans une `map[string]any` ou un `float64`, les nombres passent par un flottant 64 bits : les grands entiers perdent des chiffres et les décimaux comme 0.1 ne sont pas exacts. Je décoderais dans une struct avec des types adaptés : un `int64` en centimes, ou un type décimal qui implémente `UnmarshalJSON`, ou `json.Number` avec `UseNumber()`. Le plus robuste pour une API financière est de transmettre les montants en centimes entiers, ou en chaîne décimale explicite.'
