notion: encoding-json
lesson: "Le package **`encoding/json`** convertit entre structs Go et JSON. Seuls les champs **exportés** (majuscule) sont\nencodés ; les **tags** fixent les noms et les options.\n\n```go\ntype Utilisateur struct {\n\tID       int       `json:\"id\"`\n\tNom      string    `json:\"nom\"`\n\tEmail    string    `json:\"email,omitempty\"` // omis s'il est vide\n\tCree     time.Time `json:\"cree,omitzero\"`   // omis s'il vaut zéro (Go 1.24)\n\tmotDePasse string                            // non exporté : jamais encodé\n\tInterne  string    `json:\"-\"`               // ignoré\n}\n\ndonnees, err := json.Marshal(u)            // struct → JSON\nerr = json.Unmarshal(donnees, &u)          // JSON → struct (passer un pointeur)\n```\n\nPour des flux (requêtes HTTP, fichiers) : `json.NewDecoder(r.Body).Decode(&v)` et\n`json.NewEncoder(w).Encode(v)`.\n\nLes comportements à connaître :\n- au décodage, les champs JSON **inconnus** sont ignorés, et les champs **absents** gardent leur valeur ;\n  `dec.DisallowUnknownFields()` rejette les champs inconnus ;\n- les noms sont rapprochés **sans tenir compte de la casse** (`\"NOM\"` remplit `Nom`) ;\n- dans un `any` ou un `map[string]any`, les nombres deviennent des **`float64`** (perte de précision au-delà de\n  2^53) : `dec.UseNumber()` ou un type précis évitent cela ;\n- une slice **nil** s'encode `null`, une slice vide `[]` ;\n- les clés d'une map sont encodées **triées** ;\n- un type peut personnaliser son encodage avec `MarshalJSON` et `UnmarshalJSON`.\n\n`encoding/json/v2` (expérimental en Go 1.25) apporte des défauts plus stricts et de meilleures performances.\n\n**En entretien** : « Champs exportés et tags ; omitempty et omitzero ; Unmarshal vers un pointeur ; inconnus ignorés\nsauf DisallowUnknownFields ; nombres en float64 dans un any ; Decoder et Encoder pour les flux. »"
cards:
  - key: omitempty-vs-omitzero
    format: course
    question: omitempty vs omitzero ?
    answer: omitempty omet les valeurs "vides" selon des règles fixes ; omitzero (Go 1.24) omet selon la vraie valeur zéro, y compris time.Time et IsZero().
  - key: devenu-encoding-json-1-27
    format: course
    question: Qu'est devenu encoding/json en Go 1.27 ?
    answer: Il repose sur l'implémentation v2, et encoding/json/v2 est disponible en version stable.
  - key: champs-encoding-json-serialise
    format: course
    question: Quels champs encoding/json sérialise-t-il ?
    answer: Seulement les champs exportés.
  - key: sont-decodes-nombres-interface
    format: course
    question: En quoi sont décodés les nombres dans une interface{} ?
    answer: En float64, d'où une perte de précision possible ; UseNumber les garde en json.Number.
  - key: rejeter-champs-json-inconnus
    format: course
    question: Comment rejeter les champs JSON inconnus ?
    answer: Decoder.DisallowUnknownFields().
  - key: apporte-encoding-json-v2
    format: course
    question: Qu'apporte encoding/json/v2 ?
    answer: Une API plus cohérente, des défauts plus stricts et un décodage plus rapide (stable en Go 1.27).
  - key: client-envoie-montants-json-certains-arrivent
    format: scenario
    question: Un client envoie des montants en JSON et certains arrivent arrondis.
    answer: 'Si le JSON est décodé dans une `map[string]any` ou un `float64`, les nombres passent par un flottant 64 bits : les grands entiers perdent des chiffres et les décimaux comme 0.1 ne sont pas exacts. Je décoderais dans une struct avec des types adaptés : un `int64` en centimes, ou un type décimal qui implémente `UnmarshalJSON`, ou `json.Number` avec `UseNumber()`. Le plus robuste pour une API financière est de transmettre les montants en centimes entiers, ou en chaîne décimale explicite.'
  - key: vf-exportes
    format: true-false
    question: Les champs non exportés d'une struct sont encodés par json.Marshal.
    truth: false
    answer: Seuls les champs exportés le sont.
  - key: vf-inconnus
    format: true-false
    question: Par défaut, json.Unmarshal échoue si le JSON contient un champ inconnu de la struct.
    truth: false
    answer: Il est ignoré ; Decoder.DisallowUnknownFields le rejette.
  - key: vf-pointeur
    format: true-false
    question: '`json.Unmarshal(donnees, u)` avec u une struct (sans &) remplit u.'
    truth: false
    answer: Il faut un pointeur ; sinon Unmarshal renvoie une erreur InvalidUnmarshalError.
  - key: vf-nil-slice
    format: true-false
    question: Une slice nil s'encode en JSON par `null`, une slice vide par `[]`.
    truth: true
    answer: D'où des surprises côté client ; on initialise la slice si l'on veut [].
  - key: qcm-tags
    format: multiple-choice
    question: Que font ces tags ?
    choices:
      - text: '`json:"nom"` renomme le champ en « nom »'
        correct: true
      - text: '`json:",omitempty"` omet le champ s''il est vide'
        correct: true
      - text: '`json:"-"` exclut le champ'
        correct: true
      - text: '`json:"nom,required"` rend le champ obligatoire au décodage'
        correct: false
    answer: encoding/json n'a pas d'option required ; on valide après le décodage.
  - key: qcm-nombres
    format: multiple-choice
    question: Comment éviter de perdre la précision d'un identifiant numérique de 19 chiffres ?
    choices:
      - text: Décoder vers une struct avec un champ int64
        correct: true
      - text: Utiliser Decoder.UseNumber() pour un décodage générique
        correct: true
      - text: Décoder vers map[string]any, qui garde les entiers
        correct: false
      - text: Passer par float32
        correct: false
    answer: Dans un any, les nombres deviennent des float64, exacts seulement jusqu'à 2^53.
  - key: qcm-flux
    format: multiple-choice
    question: Comment décoder le corps JSON d'une requête HTTP ?
    choices:
      - text: '`json.NewDecoder(r.Body).Decode(&entree)`'
        correct: true
      - text: Avec http.MaxBytesReader pour borner la taille
        correct: true
      - text: '`json.Unmarshal(r.Body, &entree)`'
        correct: false
      - text: '`json.Marshal(r.Body)`'
        correct: false
    answer: Unmarshal prend des octets, pas un io.Reader.
  - key: qcm-omit
    format: multiple-choice
    question: Pourquoi omitzero (Go 1.24) plutôt qu'omitempty pour un champ time.Time ?
    choices:
      - text: omitempty n'omet pas une struct, même à zéro
        correct: true
      - text: omitzero omet la valeur zéro, ou ce que dit la méthode IsZero
        correct: true
      - text: omitempty fait planter l'encodage d'un time.Time
        correct: false
      - text: Ils sont identiques
        correct: false
    answer: Avec omitempty, une date nulle s'encode "0001-01-01T00:00:00Z".
  - key: trous-marshal
    format: fill-in
    question: |-
      Complétez pour encoder :
      ```go
      donnees, err := json.___(commande)
      ```
    blanks:
      - - Marshal
    answer: json.Marshal.
  - key: trous-unmarshal
    format: fill-in
    question: |-
      Complétez pour décoder :
      ```go
      var c Commande
      err := json.Unmarshal(donnees, ___c)
      ```
    blanks:
      - - '&'
    answer: Un pointeur.
  - key: trous-tag
    format: fill-in
    question: |-
      Complétez le tag pour omettre l'email vide :
      ```go
      Email string `json:"email,___"`
      ```
    blanks:
      - - omitempty
    answer: omitempty.
  - key: trous-decoder
    format: fill-in
    question: |-
      Complétez pour rejeter les champs inconnus :
      ```go
      dec := json.NewDecoder(r.Body)
      dec.___()
      err := dec.Decode(&entree)
      ```
    blanks:
      - - DisallowUnknownFields
    answer: DisallowUnknownFields.
  - key: code-marshal
    format: code-output
    question: "```go\ntype Utilisateur struct {\n\tNom        string `json:\"nom\"`\n\tEmail      string `json:\"email,omitempty\"`\n\tAge        int    `json:\"age\"`\n\tmotDePasse string\n}\n\nb, _ := json.Marshal(Utilisateur{Nom: \"Ada\", Age: 36, motDePasse: \"secret\"})\nfmt.Println(string(b))\n```"
    answer: '`{"nom":"Ada","age":36}` : l''email vide est omis, le champ non exporté ignoré.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype Utilisateur struct {\n\tNom        string `json:\"nom\"`\n\tEmail      string `json:\"email,omitempty\"`\n\tAge        int    `json:\"age\"`\n\tmotDePasse string\n}\n\nfunc main() {\n\tb, _ := json.Marshal(Utilisateur{Nom: \"Ada\", Age: 36, motDePasse: \"secret\"})\n\tfmt.Println(string(b))\n}\n"
      output: '{"nom":"Ada","age":36}'
  - key: code-float
    format: code-output
    question: |-
      ```go
      var v map[string]any
      json.Unmarshal([]byte(`{"n": 42, "ok": true}`), &v)
      fmt.Printf("%T %T\n", v["n"], v["ok"])
      ```
    answer: '`float64 bool` : dans un any, les nombres JSON deviennent des float64.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar v map[string]any\n\tjson.Unmarshal([]byte(`{\"n\": 42, \"ok\": true}`), &v)\n\tfmt.Printf(\"%T %T\\n\", v[\"n\"], v[\"ok\"])\n}\n"
      output: float64 bool
  - key: code-map
    format: code-output
    question: |-
      ```go
      b, _ := json.Marshal(map[string]int{"zoe": 3, "ada": 1, "max": 2})
      fmt.Println(string(b))
      ```
    answer: '`{"ada":1,"max":2,"zoe":3}` : les clés d''une map sont encodées triées.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tb, _ := json.Marshal(map[string]int{\"zoe\": 3, \"ada\": 1, \"max\": 2})\n\tfmt.Println(string(b))\n}\n"
      output: '{"ada":1,"max":2,"zoe":3}'
  - key: code-inconnu
    format: code-output
    question: "```go\ntype Produit struct {\n\tNom  string `json:\"nom\"`\n\tPrix int    `json:\"prix\"`\n}\n\np := Produit{Prix: 10}\nerr := json.Unmarshal([]byte(`{\"nom\": \"stylo\", \"couleur\": \"bleu\"}`), &p)\nfmt.Println(p.Nom, p.Prix, err)\n```"
    answer: '`stylo 10 <nil>` : le champ inconnu est ignoré, le champ absent garde sa valeur.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype Produit struct {\n\tNom  string `json:\"nom\"`\n\tPrix int    `json:\"prix\"`\n}\n\nfunc main() {\n\tp := Produit{Prix: 10}\n\terr := json.Unmarshal([]byte(`{\"nom\": \"stylo\", \"couleur\": \"bleu\"}`), &p)\n\tfmt.Println(p.Nom, p.Prix, err)\n}\n"
      output: stylo 10 <nil>
  - key: bug-minuscules
    format: bug-fix
    question: "L'API renvoie toujours `{}` :\n```go\ntype reponse struct {\n\tid  int\n\tnom string\n}\njson.NewEncoder(w).Encode(reponse{id: 1, nom: \"Ada\"})\n```"
    answer: "```go\ntype reponse struct {\n\tID  int    `json:\"id\"`\n\tNom string `json:\"nom\"`\n}\njson.NewEncoder(w).Encode(reponse{ID: 1, Nom: \"Ada\"})\n```\nencoding/json ne voit que les champs exportés ; les tags gardent les noms en minuscules dans le JSON."
  - key: bug-null
    format: bug-fix
    question: "Le client JavaScript plante sur `\"articles\": null` quand le panier est vide :\n```go\nvar articles []Article\nfor _, a := range panier {\n\tarticles = append(articles, a)\n}\njson.NewEncoder(w).Encode(Reponse{Articles: articles})\n```"
    answer: "```go\narticles := make([]Article, 0, len(panier))\nfor _, a := range panier {\n\tarticles = append(articles, a)\n}\njson.NewEncoder(w).Encode(Reponse{Articles: articles})\n```\nUne slice nil s'encode null ; une slice vide initialisée s'encode []."
  - key: bug-precision
    format: bug-fix
    question: |-
      Les identifiants de commande reçus par le service sont parfois faux d'une unité :
      ```go
      var corps map[string]any
      json.Unmarshal(donnees, &corps)
      id := int64(corps["id"].(float64))
      ```
    answer: "```go\nvar corps struct {\n\tID int64 `json:\"id\"`\n}\nif err := json.Unmarshal(donnees, &corps); err != nil {\n\treturn err\n}\nid := corps.ID\n```\nPassé par un float64, un entier au-delà de 2^53 perd sa précision ; une struct typée le décode exactement."
  - key: bug-erreur-ignoree
    format: bug-fix
    question: |-
      Une requête mal formée crée une commande vide en base :
      ```go
      var c Commande
      json.NewDecoder(r.Body).Decode(&c)
      depot.Creer(r.Context(), c)
      ```
    answer: "```go\nvar c Commande\ndec := json.NewDecoder(http.MaxBytesReader(w, r.Body, 1<<20))\ndec.DisallowUnknownFields()\nif err := dec.Decode(&c); err != nil {\n\thttp.Error(w, \"corps invalide\", http.StatusBadRequest)\n\treturn\n}\nif err := c.Valider(); err != nil {\n\thttp.Error(w, err.Error(), http.StatusUnprocessableEntity)\n\treturn\n}\ndepot.Creer(r.Context(), c)\n```\nL'erreur de décodage était ignorée ; on la traite, on borne le corps, et l'on valide les champs."
  - key: scenario-dto
    format: scenario
    question: Pourquoi ne pas encoder directement tes entités de base de données en JSON dans l'API ?
    answer: |-
      Le format de l'API deviendrait lié au schéma de la base : renommer une colonne casserait les clients, et un champ
      ajouté (un hash de mot de passe, une note interne) pourrait fuiter. Je définis des types de réponse dédiés, avec
      leurs tags et seulement les champs voulus, et une fonction de conversion testée. C'est un peu plus de code, mais
      l'API devient un contrat explicite.
  - key: scenario-dates
    format: scenario
    question: Comment gères-tu les dates dans une API JSON en Go ?
    answer: |-
      time.Time s'encode par défaut en RFC 3339 (`"2026-11-04T10:00:00Z"`), un format standard que je garde, en UTC
      côté serveur. Pour une date optionnelle, `omitzero` ou un `*time.Time`. Pour une date seule (sans heure), un type
      maison avec `MarshalJSON` et `UnmarshalJSON` au format `"2006-01-02"`, testé dans les deux sens.
  - key: scenario-versionner
    format: scenario
    question: Ton API JSON doit évoluer sans casser les clients existants. Quelles règles suis-tu ?
    answer: |-
      Ajouter des champs est sans risque (les clients ignorent les inconnus, comme encoding/json par défaut) ; renommer
      ou supprimer un champ, changer son type ou son sens, ne l'est pas. Pour ces changements, je garde l'ancien champ un
      temps, ou je crée une nouvelle version de la ressource (`/v2`). Côté serveur, je teste le JSON produit avec des
      fichiers de référence (golden files) pour voir chaque changement en revue.
