notion: encoding-json
lesson: "Le package **`encoding/json`** convertit entre structs Go et JSON. Seuls les champs **exportés** (majuscule) sont\nencodés ; les **tags** fixent les noms et les options.\n\n```go\ntype Utilisateur struct {\n\tID       int       `json:\"id\"`\n\tNom      string    `json:\"nom\"`\n\tEmail    string    `json:\"email,omitempty\"` // omis s'il est vide\n\tCree     time.Time `json:\"cree,omitzero\"`   // omis s'il vaut zéro (Go 1.24)\n\tmotDePasse string                            // non exporté : jamais encodé\n\tInterne  string    `json:\"-\"`               // ignoré\n}\n\ndonnees, err := json.Marshal(u)            // struct → JSON\nerr = json.Unmarshal(donnees, &u)          // JSON → struct (passer un pointeur)\n```\n\nPour des flux (requêtes HTTP, fichiers) : `json.NewDecoder(r.Body).Decode(&v)` et\n`json.NewEncoder(w).Encode(v)`.\n\nLes comportements à connaître :\n- au décodage, les champs JSON **inconnus** sont ignorés, et les champs **absents** gardent leur valeur ;\n  `dec.DisallowUnknownFields()` rejette les champs inconnus ;\n- les noms sont rapprochés **sans tenir compte de la casse** (`\"NOM\"` remplit `Nom`) ;\n- dans un `any` ou un `map[string]any`, les nombres deviennent des **`float64`** (perte de précision au-delà de\n  2^53) : `dec.UseNumber()` ou un type précis évitent cela ;\n- une slice **nil** s'encode `null`, une slice vide `[]` ;\n- les clés d'une map sont encodées **triées** ;\n- un type peut personnaliser son encodage avec `MarshalJSON` et `UnmarshalJSON`.\n\n`encoding/json/v2` (expérimental en Go 1.25) apporte des défauts plus stricts et de meilleures performances.\n\n**En entretien** : « Champs exportés et tags ; omitempty et omitzero ; Unmarshal vers un pointeur ; inconnus ignorés\nsauf DisallowUnknownFields ; nombres en float64 dans un any ; Decoder et Encoder pour les flux. »"
tour:
  - title: encoding/json
    text: |-
      `json.Marshal` transforme une valeur Go en JSON, et `json.Unmarshal` fait l'inverse. Seuls les champs
      **exportés**, en majuscule, sont pris en compte.

      Les **tags** de struct règlent le nom JSON d'un champ : `json:"titre"`. `omitempty` omet un champ resté à sa
      valeur zéro, et `json:"-"` l'ignore. `Unmarshal` reçoit un pointeur, et ignore les champs JSON qu'il ne connaît
      pas.
    example:
      files:
        main.go: |-
          package main

          import (
          	"encoding/json"
          	"fmt"
          )

          type Livre struct {
          	Titre  string   `json:"titre"`
          	Annee  int      `json:"annee"`
          	Tags   []string `json:"tags,omitempty"`
          	Secret string   `json:"-"`
          }

          func main() {
          	l := Livre{Titre: "Le langage Go", Annee: 2015, Secret: "caché"}
          	donnees, err := json.Marshal(l)
          	if err != nil {
          		fmt.Println(err)
          		return
          	}
          	fmt.Println(string(donnees))

          	var lu Livre
          	err = json.Unmarshal([]byte(`{"titre":"Go en action","annee":2016,"tags":["go"],"inconnu":1}`), &lu)
          	fmt.Printf("%+v %v\n", lu, err)
          }
      output: |-
        {"titre":"Le langage Go","annee":2015}
        {Titre:Go en action Annee:2016 Tags:[go] Secret:} <nil>
cards:
  - key: omitempty-vs-omitzero
    format: course
    question: "Quelle différence y a-t-il entre les options de tag `omitempty` et `omitzero` ?"
    choices:
      - {text: "`omitzero` (Go 1.24) omet la vraie valeur zéro, ou ce que dit `IsZero`", correct: true}
      - {text: "`omitzero` omet aussi les slices vides non nil, qu'`omitempty` garde", correct: false}
      - {text: "`omitempty` omet une struct à zéro, qu'`omitzero` garde dans le JSON", correct: false}
      - {text: "Aucune : `omitzero` n'est que le nouveau nom d'`omitempty`", correct: false}
    answer: "`omitempty` omet selon des règles fixes (false, 0, chaîne, slice ou map vide, nil), jamais une struct ; `omitzero` omet la vraie valeur zéro, ou ce que renvoie une méthode `IsZero`, comme pour un `time.Time`."
  - key: devenu-encoding-json-1-27
    format: course
    question: "Qu'est devenu `encoding/json` en Go 1.27 ?"
    choices:
      - {text: "Il repose sur l'implémentation v2, et `encoding/json/v2` est stable", correct: true}
      - {text: "Il est retiré de la bibliothèque standard, remplacé par la v2", correct: false}
      - {text: "Il est inchangé : `encoding/json/v2` reste une expérimentation", correct: false}
      - {text: "Il devient un module externe, `golang.org/x/json`, à importer", correct: false}
    answer: "En Go 1.27, `encoding/json` repose sur l'implémentation v2 tout en gardant son comportement, et `encoding/json/v2` est disponible en version stable. Rien n'est retiré : la promesse de compatibilité de Go 1 s'applique."
  - key: champs-encoding-json-serialise
    format: course
    question: "Quels champs d'une struct `encoding/json` sérialise-t-il ?"
    choices:
      - {text: "Seulement les champs exportés, ceux qui commencent par une majuscule", correct: true}
      - {text: "Tous les champs, exportés ou non, dans l'ordre de leur déclaration", correct: false}
      - {text: "Seulement les champs qui portent un tag `json`, exportés ou non", correct: false}
      - {text: "Seulement les champs qui ne sont pas à zéro, sauf tag contraire", correct: false}
    answer: "Seulement les champs exportés : un champ en minuscule est invisible pour `encoding/json`, tag ou non. Un champ exporté sans tag est encodé sous son nom Go."
  - key: sont-decodes-nombres-interface
    format: course
    question: "En quel type sont décodés les nombres JSON rangés dans un `any` ?"
    choices:
      - {text: "En `float64`, d'où une perte possible ; `UseNumber` les garde en `json.Number`", correct: true}
      - {text: "En `int` quand ils sont entiers, et en `float64` quand ils ont une virgule", correct: false}
      - {text: "En `json.Number` par défaut, une chaîne qu'il faut convertir soi-même", correct: false}
      - {text: "En `int64` ou en `float64`, selon la taille du nombre à décoder", correct: false}
    answer: "En `float64`, exact seulement jusqu'à 2^53 : un grand entier peut perdre des chiffres. `Decoder.UseNumber()` les garde en `json.Number`, et une struct typée les décode exactement."
  - key: rejeter-champs-json-inconnus
    format: course
    question: "Comment rejeter les champs inconnus d'un JSON reçu ?"
    choices:
      - {text: "Avec `Decoder.DisallowUnknownFields()` avant `Decode`", correct: true}
      - {text: "Avec le tag `json:\",strict\"` sur chaque champ", correct: false}
      - {text: "Rien à faire : `json.Unmarshal` les refuse déjà", correct: false}
      - {text: "Avec `json.Valid`, qui vérifie les champs attendus", correct: false}
    answer: "`dec.DisallowUnknownFields()` fait échouer `Decode` sur un champ que la struct ne connaît pas. Par défaut, `encoding/json` les ignore, et `json.Valid` ne vérifie que la syntaxe."
  - key: apporte-encoding-json-v2
    format: course
    question: "Qu'apporte `encoding/json/v2` ?"
    choices:
      - {text: "Une API plus cohérente, des défauts plus stricts et un décodage plus rapide", correct: true}
      - {text: "La prise en charge de YAML et de TOML, en plus du JSON", correct: false}
      - {text: "Un encodage binaire compact, incompatible avec le JSON texte", correct: false}
      - {text: "La validation des structs par des tags `required` et `min`", correct: false}
    answer: "Une API plus cohérente, des défauts plus stricts (noms de champs sensibles à la casse, noms en double refusés, UTF-8 invalide rejeté) et un décodage plus rapide ; elle est stable en Go 1.27."
  - key: client-envoie-montants-json-certains-arrivent
    format: scenario
    question: "Un client envoie des montants en JSON, et certains arrivent arrondis. Que fais-tu ?"
    choices:
      - {text: "Décoder dans une struct typée : des centimes en `int64`, ou un type décimal", correct: true}
      - {text: "Décoder dans une `map[string]any`, puis arrondir à deux décimales", correct: false}
      - {text: "Passer les montants en `float32`, plus adapté aux petites valeurs", correct: false}
      - {text: "Multiplier par 100 le `float64` reçu, puis le convertir en `int`", correct: false}
    answer: "Décodés dans un `any` ou un `float64`, les nombres passent par un flottant : les grands entiers perdent des chiffres, et 0.1 n'est pas exact. Je décode dans une struct typée (centimes en `int64`, type décimal avec `UnmarshalJSON`, ou `json.Number`) ; le plus sûr pour une API financière est de transmettre des centimes entiers ou une chaîne décimale."
  - key: vf-exportes
    format: true-false
    question: Les champs non exportés d'une struct sont encodés par json.Marshal.
    truth: false
    answer: Seuls les champs exportés le sont.
  - key: vf-inconnus
    format: true-false
    question: Par défaut, json.Unmarshal échoue si le JSON contient un champ inconnu de la struct.
    truth: false
    answer: Il est ignoré ; Decoder.DisallowUnknownFields le rejette.
  - key: vf-pointeur
    format: true-false
    question: '`json.Unmarshal(donnees, u)` avec u une struct (sans &) remplit u.'
    truth: false
    answer: Il faut un pointeur ; sinon Unmarshal renvoie une erreur InvalidUnmarshalError.
  - key: vf-nil-slice
    format: true-false
    question: Une slice nil s'encode en JSON par `null`, une slice vide par `[]`.
    truth: true
    answer: D'où des surprises côté client ; on initialise la slice si l'on veut [].
  - key: qcm-tags
    format: multiple-choice
    question: "Lequel de ces tags `encoding/json` n'a pas l'effet annoncé ?"
    choices:
      - {text: "`json:\"nom,required\"`, qui rend le champ obligatoire", correct: true}
      - {text: "`json:\"nom\"`, qui renomme le champ en « nom »", correct: false}
      - {text: "`json:\",omitempty\"`, qui omet le champ s'il est vide", correct: false}
      - {text: "`json:\"-\"`, qui exclut le champ du JSON", correct: false}
    answer: "`encoding/json` n'a pas d'option `required` : elle est ignorée, et l'on valide après le décodage. Les trois autres tags renomment, omettent une valeur vide et excluent le champ."
  - key: qcm-nombres
    format: multiple-choice
    question: "Lesquelles de ces solutions évitent de perdre la précision d'un identifiant numérique de 19 chiffres ?"
    choices:
      - text: Décoder vers une struct avec un champ int64
        correct: true
      - text: Utiliser Decoder.UseNumber() pour un décodage générique
        correct: true
      - text: Décoder vers map[string]any, qui garde les entiers
        correct: false
      - text: Passer par float32
        correct: false
    answer: Dans un any, les nombres deviennent des float64, exacts seulement jusqu'à 2^53.
  - key: qcm-flux
    format: multiple-choice
    question: Comment décoder le corps JSON d'une requête HTTP ?
    choices:
      - {text: "`json.NewDecoder(r.Body).Decode(&entree)`", correct: true}
      - {text: "`json.Unmarshal(r.Body, &entree)`", correct: false}
      - {text: "`json.Marshal(r.Body)`", correct: false}
      - {text: "`json.NewDecoder(r.Body).Decode(entree)`", correct: false}
    answer: "`json.NewDecoder` lit directement un `io.Reader`, idéalement borné par `http.MaxBytesReader` ; `Unmarshal` prend des octets, pas un `io.Reader`, et `Decode` veut un pointeur."
  - key: qcm-omit
    format: multiple-choice
    question: Pourquoi omitzero (Go 1.24) plutôt qu'omitempty pour un champ time.Time ?
    choices:
      - {text: "`omitempty` n'omet jamais une struct, même à sa valeur zéro", correct: true}
      - {text: "`omitempty` fait planter l'encodage d'un `time.Time` à zéro", correct: false}
      - {text: "`omitzero` encode la date en RFC 3339, `omitempty` en secondes", correct: false}
      - {text: "Aucune raison : `omitzero` n'est qu'un alias plus lisible", correct: false}
    answer: "Avec `omitempty`, une date nulle s'encode `\"0001-01-01T00:00:00Z\"` : une struct n'est jamais vide. `omitzero` omet la valeur zéro, ou ce que dit sa méthode `IsZero`."
  - key: trous-marshal
    format: fill-in
    question: |-
      Complète pour encoder :
      ```go
      donnees, err := json.___(commande)
      ```
    blanks:
      - - Marshal
    answer: json.Marshal.
  - key: trous-unmarshal
    format: fill-in
    question: |-
      Complète pour décoder :
      ```go
      var c Commande
      err := json.Unmarshal(donnees, ___c)
      ```
    blanks:
      - - '&'
    answer: Un pointeur.
  - key: trous-tag
    format: fill-in
    question: |-
      Complète le tag pour omettre l'email vide :
      ```go
      Email string `json:"email,___"`
      ```
    blanks:
      - - omitempty
    answer: omitempty.
  - key: trous-decoder
    format: fill-in
    question: |-
      Complète pour rejeter les champs inconnus :
      ```go
      dec := json.NewDecoder(r.Body)
      dec.___()
      err := dec.Decode(&entree)
      ```
    blanks:
      - - DisallowUnknownFields
    answer: DisallowUnknownFields.
  - key: code-marshal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Utilisateur struct {
      	Nom        string `json:"nom"`
      	Email      string `json:"email,omitempty"`
      	Age        int    `json:"age"`
      	motDePasse string
      }

      b, _ := json.Marshal(Utilisateur{Nom: "Ada", Age: 36, motDePasse: "secret"})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"nom\":\"Ada\",\"age\":36}`", correct: true}
      - {text: "`{\"nom\":\"Ada\",\"email\":\"\",\"age\":36}`", correct: false}
      - {text: "`{\"nom\":\"Ada\",\"age\":36,\"motDePasse\":\"secret\"}`", correct: false}
      - {text: "`{\"Nom\":\"Ada\",\"Age\":36}`", correct: false}
    answer: '`{"nom":"Ada","age":36}` : l''email vide est omis, le champ non exporté ignoré.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype Utilisateur struct {\n\tNom        string `json:\"nom\"`\n\tEmail      string `json:\"email,omitempty\"`\n\tAge        int    `json:\"age\"`\n\tmotDePasse string\n}\n\nfunc main() {\n\tb, _ := json.Marshal(Utilisateur{Nom: \"Ada\", Age: 36, motDePasse: \"secret\"})\n\tfmt.Println(string(b))\n}\n"
      output: '{"nom":"Ada","age":36}'
  - key: code-float
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var v map[string]any
      json.Unmarshal([]byte(`{"n": 42, "ok": true}`), &v)
      fmt.Printf("%T %T\n", v["n"], v["ok"])
      ```
    choices:
      - {text: "`float64 bool`", correct: true}
      - {text: "`int bool`", correct: false}
      - {text: "`int64 bool`", correct: false}
      - {text: "`json.Number bool`", correct: false}
    answer: '`float64 bool` : dans un any, les nombres JSON deviennent des float64.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar v map[string]any\n\tjson.Unmarshal([]byte(`{\"n\": 42, \"ok\": true}`), &v)\n\tfmt.Printf(\"%T %T\\n\", v[\"n\"], v[\"ok\"])\n}\n"
      output: float64 bool
  - key: code-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      b, _ := json.Marshal(map[string]int{"zoe": 3, "ada": 1, "max": 2})
      fmt.Println(string(b))
      ```
    choices:
      - {text: "`{\"ada\":1,\"max\":2,\"zoe\":3}`", correct: true}
      - {text: "`{\"zoe\":3,\"ada\":1,\"max\":2}`", correct: false}
      - {text: "`{\"zoe\":3,\"max\":2,\"ada\":1}`", correct: false}
      - {text: "`{\"ada\":1,\"zoe\":3,\"max\":2}`", correct: false}
    answer: '`{"ada":1,"max":2,"zoe":3}` : les clés d''une map sont encodées triées.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tb, _ := json.Marshal(map[string]int{\"zoe\": 3, \"ada\": 1, \"max\": 2})\n\tfmt.Println(string(b))\n}\n"
      output: '{"ada":1,"max":2,"zoe":3}'
  - key: code-inconnu
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Produit struct {
      	Nom  string `json:"nom"`
      	Prix int    `json:"prix"`
      }

      p := Produit{Prix: 10}
      err := json.Unmarshal([]byte(`{"nom": "stylo", "couleur": "bleu"}`), &p)
      fmt.Println(p.Nom, p.Prix, err)
      ```
    choices:
      - {text: "`stylo 10 <nil>`", correct: true}
      - {text: "`stylo 0 <nil>`", correct: false}
      - {text: "`stylo 10 json: unknown field \"couleur\"`", correct: false}
      - {text: "`stylo 0 json: unknown field \"couleur\"`", correct: false}
    answer: '`stylo 10 <nil>` : le champ inconnu est ignoré, le champ absent garde sa valeur.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\ntype Produit struct {\n\tNom  string `json:\"nom\"`\n\tPrix int    `json:\"prix\"`\n}\n\nfunc main() {\n\tp := Produit{Prix: 10}\n\terr := json.Unmarshal([]byte(`{\"nom\": \"stylo\", \"couleur\": \"bleu\"}`), &p)\n\tfmt.Println(p.Nom, p.Prix, err)\n}\n"
      output: stylo 10 <nil>
  - key: bug-minuscules
    format: bug-fix
    question: |-
      L'API renvoie toujours `{}`. Quelle correction est la bonne ?
      ```go
      type reponse struct {
      	id  int
      	nom string
      }
      json.NewEncoder(w).Encode(reponse{id: 1, nom: "Ada"})
      ```
    choices:
      - {text: "Exporter les champs (`ID`, `Nom`), et garder les noms en minuscules par des tags", correct: true}
      - {text: "Ajouter des tags `json:\"id\"` et `json:\"nom\"` aux champs restés en minuscules", correct: false}
      - {text: "Passer un pointeur `&reponse{...}` à `Encode`, qui peut alors lire les champs", correct: false}
      - {text: "Exporter le type, `Reponse`, en gardant ses champs en minuscules", correct: false}
    answer: "```go\ntype reponse struct {\n\tID  int    `json:\"id\"`\n\tNom string `json:\"nom\"`\n}\njson.NewEncoder(w).Encode(reponse{ID: 1, Nom: \"Ada\"})\n```\nencoding/json ne voit que les champs exportés ; les tags gardent les noms en minuscules dans le JSON."
  - key: bug-null
    format: bug-fix
    question: |-
      Le client JavaScript plante sur `"articles": null` quand le panier est vide. Quelle correction est la bonne ?
      ```go
      var articles []Article
      for _, a := range panier {
      	articles = append(articles, a)
      }
      json.NewEncoder(w).Encode(Reponse{Articles: articles})
      ```
    choices:
      - {text: "Initialiser `articles` avec `make([]Article, 0, len(panier))`", correct: true}
      - {text: "Ajouter `omitempty` au tag du champ `Articles`, pour l'omettre", correct: false}
      - {text: "Encoder avec `json.Marshal` au lieu de `json.NewEncoder`", correct: false}
      - {text: "Déclarer `articles` avec `var articles []Article = nil`", correct: false}
    answer: "```go\narticles := make([]Article, 0, len(panier))\nfor _, a := range panier {\n\tarticles = append(articles, a)\n}\njson.NewEncoder(w).Encode(Reponse{Articles: articles})\n```\nUne slice nil s'encode null ; une slice vide initialisée s'encode []."
  - key: bug-precision
    format: bug-fix
    question: |-
      Les identifiants de commande reçus par le service sont parfois faux d'une unité. Quelle correction est la bonne ?
      ```go
      var corps map[string]any
      json.Unmarshal(donnees, &corps)
      id := int64(corps["id"].(float64))
      ```
    choices:
      - {text: "Décoder dans une struct avec un champ `ID int64`, et vérifier l'erreur", correct: true}
      - {text: "Arrondir avec `math.Round` avant la conversion en `int64`", correct: false}
      - {text: "Convertir en `uint64` plutôt qu'en `int64`, qui garde plus de chiffres", correct: false}
      - {text: "Remplacer `float64` par `float32` dans l'assertion de type", correct: false}
    answer: "```go\nvar corps struct {\n\tID int64 `json:\"id\"`\n}\nif err := json.Unmarshal(donnees, &corps); err != nil {\n\treturn err\n}\nid := corps.ID\n```\nPassé par un float64, un entier au-delà de 2^53 perd sa précision ; une struct typée le décode exactement."
  - key: bug-erreur-ignoree
    format: bug-fix
    question: |-
      Une requête mal formée crée une commande vide en base. Quelle correction est la bonne ?
      ```go
      var c Commande
      json.NewDecoder(r.Body).Decode(&c)
      depot.Creer(r.Context(), c)
      ```
    choices:
      - {text: "Vérifier l'erreur de `Decode`, répondre 400, puis valider les champs avant de créer", correct: true}
      - {text: "Vérifier seulement que `c` n'est pas nil avant d'appeler `depot.Creer`", correct: false}
      - {text: "Remplacer `NewDecoder` par `json.Unmarshal`, qui refuse un JSON mal formé", correct: false}
      - {text: "Ajouter `defer r.Body.Close()`, qui annule la requête mal formée", correct: false}
    answer: "```go\nvar c Commande\ndec := json.NewDecoder(http.MaxBytesReader(w, r.Body, 1<<20))\ndec.DisallowUnknownFields()\nif err := dec.Decode(&c); err != nil {\n\thttp.Error(w, \"corps invalide\", http.StatusBadRequest)\n\treturn\n}\nif err := c.Valider(); err != nil {\n\thttp.Error(w, err.Error(), http.StatusUnprocessableEntity)\n\treturn\n}\ndepot.Creer(r.Context(), c)\n```\nL'erreur de décodage était ignorée ; on la traite, on borne le corps, et l'on valide les champs."
  - key: scenario-dto
    format: scenario
    question: Pourquoi ne pas encoder directement tes entités de base de données en JSON dans l'API ?
    choices:
      - {text: "L'API serait liée au schéma de la base, et des champs internes pourraient fuiter", correct: true}
      - {text: "`encoding/json` ne sait pas encoder les structs qui portent des tags `db`", correct: false}
      - {text: "Les entités sont lourdes : l'encodage JSON en serait nettement plus lent", correct: false}
      - {text: "Les entités contiennent des pointeurs, que `encoding/json` refuse d'encoder", correct: false}
    answer: "Renommer une colonne casserait les clients, et un champ ajouté (un hash de mot de passe, une note interne) pourrait fuiter. Des types de réponse dédiés, avec leurs tags et les seuls champs voulus, font de l'API un contrat explicite."
  - key: scenario-dates
    format: scenario
    question: Comment gères-tu les dates dans une API JSON en Go ?
    choices:
      - {text: "En RFC 3339 et en UTC, le format par défaut de `time.Time`, avec `omitzero` si optionnelle", correct: true}
      - {text: "En timestamp Unix en secondes, plus compact, converti à la main dans chaque handler", correct: false}
      - {text: "Dans le fuseau du serveur, au format `02/01/2006 15:04`, plus lisible pour un humain", correct: false}
      - {text: "En chaîne libre, que chaque client analyse comme il l'entend selon sa langue", correct: false}
    answer: "`time.Time` s'encode par défaut en RFC 3339 (`2026-11-04T10:00:00Z`), un format standard, gardé en UTC côté serveur. Une date optionnelle prend `omitzero` ou un `*time.Time` ; une date sans heure, un type maison avec `MarshalJSON` et `UnmarshalJSON` au format `2006-01-02`."
  - key: scenario-versionner
    format: scenario
    question: Ton API JSON doit évoluer sans casser les clients existants. Quelles règles suis-tu ?
    choices:
      - {text: "Ajouter des champs sans risque ; ne jamais renommer ni supprimer sans garder l'ancien un temps", correct: true}
      - {text: "Renommer les champs librement : les clients s'adaptent à chaque nouvelle version", correct: false}
      - {text: "Refuser tout ajout de champ, qui casserait les clients qui décodent les réponses", correct: false}
      - {text: "Changer le type d'un champ suffit, tant que son nom reste identique pour les clients", correct: false}
    answer: "Ajouter un champ est sans risque : les clients ignorent les inconnus, comme `encoding/json` par défaut. Renommer, supprimer, changer un type ou un sens casse : je garde l'ancien champ un temps ou je crée une version (`/v2`), et des fichiers de référence (golden files) montrent chaque changement en revue."
