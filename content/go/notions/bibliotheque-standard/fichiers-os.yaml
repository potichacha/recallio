notion: fichiers-os
cards:
  - key: verifier-erreur-close-fichier-ecrit
    format: course
    question: Pourquoi vérifier l'erreur de Close sur un fichier écrit ?
    answer: Elle peut signaler que des données n'ont pas été écrites.
  - key: permet-os-root-1-24
    format: course
    question: Que permet os.Root (Go 1.24) ?
    answer: Accéder à des fichiers en restant confiné dans un répertoire, contre le path traversal.
  - key: sert-os-root
    format: course
    question: À quoi sert os.Root ?
    answer: Confiner l'accès aux fichiers sous un répertoire (Go 1.24), contre le path traversal.
  - key: terme-os-root
    format: course
    question: Que désigne « os.Root » ?
    answer: Accès fichiers confiné à un répertoire (Go 1.24)
