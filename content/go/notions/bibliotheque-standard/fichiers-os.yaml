notion: fichiers-os
lesson: "Pour un petit fichier, deux fonctions suffisent :\n\n```go\ndonnees, err := os.ReadFile(\"config.yaml\")\nerr = os.WriteFile(\"rapport.txt\", donnees, 0o644) // crée ou remplace, permissions rw-r--r--\n```\n\nPour un gros fichier ou un flux, on ouvre un `*os.File` (un `io.Reader` et un `io.Writer`) :\n\n```go\nf, err := os.Open(chemin) // lecture seule\nif err != nil {\n\treturn err\n}\ndefer f.Close()\n\ng, err := os.Create(sortie) // écriture, crée ou tronque\n// os.OpenFile(chemin, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644) pour ajouter à la fin\n```\n\nLes règles :\n- **toujours fermer** : `defer f.Close()` juste après la vérification de l'erreur ;\n- pour un fichier **écrit**, l'erreur de `Close` compte : les données peuvent n'être vraiment écrites qu'à la\n  fermeture (disque plein) ;\n- une écriture **atomique** passe par un fichier temporaire dans le même dossier puis `os.Rename` : un lecteur ne\n  voit jamais un fichier à moitié écrit ;\n- `errors.Is(err, fs.ErrNotExist)` reconnaît un fichier absent, quel que soit le système ;\n- `filepath.Join` construit les chemins avec le bon séparateur ;\n- `os.MkdirAll`, `os.Remove`, `os.RemoveAll`, `os.Stat`, `os.ReadDir`, `filepath.WalkDir` couvrent le reste.\n\n**`os.Root`** (Go 1.24) ouvre un dossier et **interdit** d'en sortir (`../`, liens symboliques) : à utiliser pour tout\nchemin venant d'un utilisateur.\n\n**En entretien** : « ReadFile et WriteFile pour les petits fichiers, Open et Create avec defer Close sinon ; vérifier\nle Close d'un fichier écrit ; écriture atomique par renommage ; fs.ErrNotExist ; os.Root contre la traversée de\nchemins. »"
tour:
  - title: Lire et écrire des fichiers
    text: |-
      `os.WriteFile` et `os.ReadFile` écrivent et lisent un fichier entier d'un coup. Pour un gros fichier, on l'ouvre
      avec `os.Open` (en lecture) ou `os.Create` (en écriture), et on le traite comme un flux : un `*os.File` est un
      `io.Reader` et un `io.Writer`.

      Un fichier ouvert se **ferme** : `defer f.Close()`, juste après avoir vérifié l'erreur d'ouverture. Ce programme
      travaille dans un dossier temporaire, qu'il supprime en partant.
    example:
      files:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"os"
          	"path/filepath"
          )

          func main() {
          	dossier, err := os.MkdirTemp("", "tour")
          	if err != nil {
          		fmt.Println(err)
          		return
          	}
          	defer os.RemoveAll(dossier)

          	chemin := filepath.Join(dossier, "notes.txt")
          	if err := os.WriteFile(chemin, []byte("12\n15\n18\n"), 0o644); err != nil {
          		fmt.Println(err)
          		return
          	}

          	f, err := os.Open(chemin)
          	if err != nil {
          		fmt.Println(err)
          		return
          	}
          	defer f.Close()
          	sc := bufio.NewScanner(f)
          	for sc.Scan() {
          		fmt.Println("note :", sc.Text())
          	}
          }
      output: |-
        note : 12
        note : 15
        note : 18
cards:
  - key: verifier-erreur-close-fichier-ecrit
    format: course
    question: Pourquoi vérifier l'erreur de Close sur un fichier écrit ?
    answer: Elle peut signaler que des données n'ont pas été écrites.
  - key: permet-os-root-1-24
    format: course
    question: Que permet os.Root (Go 1.24) ?
    answer: Accéder à des fichiers en restant confiné dans un répertoire, contre le path traversal.
  - key: sert-os-root
    format: course
    question: À quoi sert os.Root ?
    answer: Confiner l'accès aux fichiers sous un répertoire (Go 1.24), contre le path traversal.
  - key: terme-os-root
    format: course
    question: Que désigne « os.Root » ?
    answer: Accès fichiers confiné à un répertoire (Go 1.24)
  - key: vf-readfile
    format: true-false
    question: '`os.ReadFile` charge tout le fichier en mémoire.'
    truth: true
    answer: Pour un gros fichier, on lit en flux avec os.Open.
  - key: vf-create
    format: true-false
    question: '`os.Create` ajoute à la fin d''un fichier existant.'
    truth: false
    answer: Il le tronque ; pour ajouter, os.OpenFile avec O_APPEND.
  - key: vf-notexist
    format: true-false
    question: '`errors.Is(err, fs.ErrNotExist)` reconnaît un fichier absent sur Linux comme sur Windows.'
    truth: true
    answer: L'erreur du système est enveloppée dans un *fs.PathError.
  - key: vf-rename
    format: true-false
    question: Écrire dans un fichier temporaire puis le renommer permet de remplacer un fichier de façon atomique sur le même système de fichiers.
    truth: true
    answer: Un lecteur voit l'ancien ou le nouveau, jamais un mélange.
  - key: qcm-fonctions
    format: multiple-choice
    question: Quelle fonction pour quel besoin ?
    choices:
      - text: '`os.ReadFile` pour un petit fichier de configuration'
        correct: true
      - text: '`os.Open` puis bufio.Scanner pour un journal de 5 Go'
        correct: true
      - text: '`os.Create` pour ajouter une ligne à un journal existant'
        correct: false
      - text: '`os.ReadFile` pour un fichier vidéo de 20 Go'
        correct: false
    answer: Create tronque ; ReadFile chargerait 20 Go en mémoire.
  - key: qcm-close
    format: multiple-choice
    question: Pourquoi vérifier l'erreur de Close après avoir écrit un fichier ?
    choices:
      - text: Une erreur d'écriture différée peut n'apparaître qu'à la fermeture
        correct: true
      - text: Un disque plein peut se révéler au Close
        correct: true
      - text: Close renvoie toujours nil pour un fichier
        correct: false
      - text: Pour libérer la mémoire du fichier
        correct: false
    answer: Pour un fichier seulement lu, l'erreur de Close importe peu.
  - key: qcm-root
    format: multiple-choice
    question: À quoi sert os.Root (Go 1.24) ?
    choices:
      - text: Empêcher qu'un chemin fourni par un utilisateur sorte d'un dossier
        correct: true
      - text: Bloquer les « ../ » et les liens symboliques qui pointent ailleurs
        correct: true
      - text: Exécuter le programme en administrateur
        correct: false
      - text: Trouver la racine du système de fichiers
        correct: false
    answer: Il protège contre la traversée de chemins.
  - key: qcm-chemins
    format: multiple-choice
    question: Comment construire un chemin portable ?
    choices:
      - text: '`filepath.Join(dossier, nom)`'
        correct: true
      - text: '`dossier + "/" + nom`'
        correct: false
      - text: '`path.Join` pour les chemins de fichiers de Windows'
        correct: false
      - text: '`fmt.Sprintf("%s\\%s", dossier, nom)`'
        correct: false
    answer: path sert aux chemins avec des « / » (URL), filepath aux fichiers du système.
  - key: trous-readfile
    format: fill-in
    question: |-
      Complétez pour lire un petit fichier :
      ```go
      donnees, err := os.___("config.json")
      ```
    blanks:
      - - ReadFile
    answer: os.ReadFile.
  - key: trous-defer
    format: fill-in
    question: "Complétez :\n```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn err\n}\n___ f.Close()\n```"
    blanks:
      - - defer
    answer: defer juste après la vérification de l'erreur.
  - key: trous-notexist
    format: fill-in
    question: "Complétez pour un fichier absent :\n```go\nif errors.Is(err, fs.___) {\n\treturn ConfigParDefaut(), nil\n}\n```"
    blanks:
      - - ErrNotExist
    answer: fs.ErrNotExist.
  - key: trous-append
    format: fill-in
    question: |-
      Complétez pour ajouter à la fin du journal :
      ```go
      f, err := os.OpenFile("app.log", os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
      ```
      Quel drapeau fait écrire à la fin ? ___
    blanks:
      - - O_APPEND
        - os.O_APPEND
    answer: O_APPEND.
  - key: bug-close-oublie
    format: bug-fix
    question: "Après quelques heures, le service échoue avec « too many open files » :\n```go\nfunc lire(chemin string) ([]byte, error) {\n\tf, err := os.Open(chemin)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn io.ReadAll(f)\n}\n```"
    answer: "```go\nfunc lire(chemin string) ([]byte, error) {\n\tf, err := os.Open(chemin)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer f.Close()\n\treturn io.ReadAll(f)\n}\n```\nChaque appel laissait un descripteur ouvert. (Ici, `os.ReadFile(chemin)` ferait tout en une ligne.)"
  - key: bug-defer-avant
    format: bug-fix
    question: "Le programme panique quand le fichier n'existe pas :\n```go\nf, err := os.Open(chemin)\ndefer f.Close()\nif err != nil {\n\treturn err\n}\n```"
    answer: "```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn err\n}\ndefer f.Close()\n```\nEn cas d'erreur, f est nil ; le defer se place après la vérification."
  - key: bug-atomique
    format: bug-fix
    question: |-
      Après une coupure de courant pendant la sauvegarde, le fichier d'état est à moitié écrit et illisible :
      ```go
      os.WriteFile("etat.json", donnees, 0o644)
      ```
    answer: "```go\ntmp, err := os.CreateTemp(\".\", \"etat-*.json\")\nif err != nil {\n\treturn err\n}\ndefer os.Remove(tmp.Name()) // sans effet si le renommage a réussi\nif _, err := tmp.Write(donnees); err != nil {\n\ttmp.Close()\n\treturn err\n}\nif err := tmp.Sync(); err != nil {\n\ttmp.Close()\n\treturn err\n}\nif err := tmp.Close(); err != nil {\n\treturn err\n}\nreturn os.Rename(tmp.Name(), \"etat.json\")\n```\nOn écrit un fichier temporaire dans le même dossier, on le synchronise sur le disque, puis on le renomme :\nl'ancien fichier reste intact jusqu'au dernier moment."
  - key: bug-traversee
    format: bug-fix
    question: |-
      Un utilisateur télécharge `/etc/passwd` en demandant le fichier « ../../etc/passwd » :
      ```go
      chemin := filepath.Join("/srv/fichiers", r.URL.Query().Get("nom"))
      http.ServeFile(w, r, chemin)
      ```
    answer: "```go\nracine, err := os.OpenRoot(\"/srv/fichiers\") // une fois, au démarrage\nif err != nil {\n\tlog.Fatal(err)\n}\n\n// dans le handler\nf, err := racine.Open(r.URL.Query().Get(\"nom\"))\nif err != nil {\n\thttp.NotFound(w, r)\n\treturn\n}\ndefer f.Close()\nio.Copy(w, f)\n```\nfilepath.Join résolvait les « .. » et sortait du dossier ; os.Root refuse tout chemin qui en sort."
