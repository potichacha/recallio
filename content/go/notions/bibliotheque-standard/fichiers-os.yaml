notion: fichiers-os
lesson: "Pour un petit fichier, deux fonctions suffisent :\n\n```go\ndonnees, err := os.ReadFile(\"config.yaml\")\nerr = os.WriteFile(\"rapport.txt\", donnees, 0o644) // crée ou remplace, permissions rw-r--r--\n```\n\nPour un gros fichier ou un flux, on ouvre un `*os.File` (un `io.Reader` et un `io.Writer`) :\n\n```go\nf, err := os.Open(chemin) // lecture seule\nif err != nil {\n\treturn err\n}\ndefer f.Close()\n\ng, err := os.Create(sortie) // écriture, crée ou tronque\n// os.OpenFile(chemin, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644) pour ajouter à la fin\n```\n\nLes règles :\n- **toujours fermer** : `defer f.Close()` juste après la vérification de l'erreur ;\n- pour un fichier **écrit**, l'erreur de `Close` compte : les données peuvent n'être vraiment écrites qu'à la\n  fermeture (disque plein) ;\n- une écriture **atomique** passe par un fichier temporaire dans le même dossier puis `os.Rename` : un lecteur ne\n  voit jamais un fichier à moitié écrit ;\n- `errors.Is(err, fs.ErrNotExist)` reconnaît un fichier absent, quel que soit le système ;\n- `filepath.Join` construit les chemins avec le bon séparateur ;\n- `os.MkdirAll`, `os.Remove`, `os.RemoveAll`, `os.Stat`, `os.ReadDir`, `filepath.WalkDir` couvrent le reste.\n\n**`os.Root`** (Go 1.24) ouvre un dossier et **interdit** d'en sortir (`../`, liens symboliques) : à utiliser pour tout\nchemin venant d'un utilisateur.\n\n**En entretien** : « ReadFile et WriteFile pour les petits fichiers, Open et Create avec defer Close sinon ; vérifier\nle Close d'un fichier écrit ; écriture atomique par renommage ; fs.ErrNotExist ; os.Root contre la traversée de\nchemins. »"
tour:
  - title: Lire et écrire des fichiers
    text: |-
      `os.WriteFile` et `os.ReadFile` écrivent et lisent un fichier entier d'un coup. Pour un gros fichier, on l'ouvre
      avec `os.Open` (en lecture) ou `os.Create` (en écriture), et on le traite comme un flux : un `*os.File` est un
      `io.Reader` et un `io.Writer`.

      Un fichier ouvert se **ferme** : `defer f.Close()`, juste après avoir vérifié l'erreur d'ouverture. Ce programme
      travaille dans un dossier temporaire, qu'il supprime en partant.
    example:
      files:
        main.go: |-
          package main

          import (
          	"bufio"
          	"fmt"
          	"os"
          	"path/filepath"
          )

          func main() {
          	dossier, err := os.MkdirTemp("", "tour")
          	if err != nil {
          		fmt.Println(err)
          		return
          	}
          	defer os.RemoveAll(dossier)

          	chemin := filepath.Join(dossier, "notes.txt")
          	if err := os.WriteFile(chemin, []byte("12\n15\n18\n"), 0o644); err != nil {
          		fmt.Println(err)
          		return
          	}

          	f, err := os.Open(chemin)
          	if err != nil {
          		fmt.Println(err)
          		return
          	}
          	defer f.Close()
          	sc := bufio.NewScanner(f)
          	for sc.Scan() {
          		fmt.Println("note :", sc.Text())
          	}
          }
      output: |-
        note : 12
        note : 15
        note : 18
cards:
  - key: verifier-erreur-close-fichier-ecrit
    format: course
    question: "Pourquoi vérifier l'erreur de `Close` sur un fichier qu'on a écrit ?"
    choices:
      - {text: "Elle peut signaler que des données n'ont pas été écrites, comme un disque plein", correct: true}
      - {text: "Elle dit si le fichier a été supprimé par un autre processus entre-temps", correct: false}
      - {text: "Sans la lire, le descripteur reste ouvert jusqu'à la fin du programme", correct: false}
      - {text: "Elle seule confirme que les données sont synchronisées sur le disque", correct: false}
    answer: "Une erreur d'écriture différée (disque plein, quota, système de fichiers réseau) peut n'apparaître qu'à la fermeture. Même sans erreur, rien ne garantit que les données sont sur le disque : c'est le rôle de `Sync`."
  - key: permet-os-root-1-24
    format: course
    question: "Que permet `os.Root`, ajouté en Go 1.24 ?"
    choices:
      - {text: "D'ouvrir des fichiers en restant confiné dans un répertoire", correct: true}
      - {text: "De lancer le programme avec les droits d'administrateur", correct: false}
      - {text: "De trouver la racine du module Go en cours de compilation", correct: false}
      - {text: "De changer la racine du processus entier, comme `chroot`", correct: false}
    answer: "`os.OpenRoot(dir)` renvoie un `*os.Root` dont les méthodes (`Open`, `Create`...) refusent tout chemin qui sort du répertoire, « .. » ou lien symbolique compris : une protection contre la traversée de chemins."
  - key: sert-os-root
    format: course
    question: "Contre quelle attaque `os.Root` protège-t-il ?"
    choices:
      - {text: "La traversée de chemins, comme un nom de fichier « ../../etc/passwd »", correct: true}
      - {text: "L'injection SQL, quand un nom de fichier finit dans une requête", correct: false}
      - {text: "L'épuisement des descripteurs de fichiers par trop d'ouvertures", correct: false}
      - {text: "La lecture concurrente d'un même fichier par deux goroutines", correct: false}
    answer: "La traversée de chemins (path traversal) : un nom fourni par l'utilisateur qui remonte hors du dossier prévu. `os.Root` refuse les « .. » et les liens symboliques qui en sortent."
  - key: terme-os-root
    format: course
    question: "Que désigne un `*os.Root` dans un programme Go ?"
    choices:
      - {text: "Un accès aux fichiers confiné à un répertoire, ouvert par `os.OpenRoot`", correct: true}
      - {text: "Le compte administrateur du système, exposé par le paquet `os`", correct: false}
      - {text: "Le répertoire racine `/`, ouvert en lecture seule au démarrage", correct: false}
      - {text: "Le répertoire du binaire, qu'on obtient aussi par `os.Executable`", correct: false}
    answer: "Un répertoire ouvert par `os.OpenRoot` (Go 1.24) : toutes ses opérations restent confinées dessous. Ce n'est ni le compte administrateur ni la racine du système de fichiers."
  - key: vf-readfile
    format: true-false
    question: '`os.ReadFile` charge tout le fichier en mémoire.'
    truth: true
    answer: Pour un gros fichier, on lit en flux avec os.Open.
  - key: vf-create
    format: true-false
    question: '`os.Create` ajoute à la fin d''un fichier existant.'
    truth: false
    answer: Il le tronque ; pour ajouter, os.OpenFile avec O_APPEND.
  - key: vf-notexist
    format: true-false
    question: '`errors.Is(err, fs.ErrNotExist)` reconnaît un fichier absent sur Linux comme sur Windows.'
    truth: true
    answer: L'erreur du système est enveloppée dans un *fs.PathError.
  - key: vf-rename
    format: true-false
    question: Écrire dans un fichier temporaire puis le renommer permet de remplacer un fichier de façon atomique sur le même système de fichiers.
    truth: true
    answer: Un lecteur voit l'ancien ou le nouveau, jamais un mélange.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Pour lire un journal de 5 Go ligne par ligne, quelle approche choisis-tu ?"
    choices:
      - {text: "`os.Open`, puis un `bufio.Scanner`", correct: true}
      - {text: "`os.ReadFile`, puis `strings.Split` sur les sauts de ligne", correct: false}
      - {text: "`os.Create`, puis une boucle de `Read`", correct: false}
      - {text: "`io.ReadAll` sur le fichier, puis `bytes.Split`", correct: false}
    answer: "`os.Open` et un `bufio.Scanner` lisent en flux, avec une mémoire constante. `os.ReadFile` ou `io.ReadAll` chargeraient les 5 Go en mémoire, et `os.Create` tronquerait le fichier. `os.ReadFile` reste parfait pour un petit fichier de configuration."
  - key: qcm-close
    format: multiple-choice
    question: "Lesquelles de ces raisons justifient de vérifier l'erreur de `Close` après avoir écrit un fichier ?"
    choices:
      - text: Une erreur d'écriture différée peut n'apparaître qu'à la fermeture
        correct: true
      - text: Un disque plein peut se révéler au Close
        correct: true
      - text: Close renvoie toujours nil pour un fichier
        correct: false
      - text: Pour libérer la mémoire du fichier
        correct: false
    answer: Pour un fichier seulement lu, l'erreur de Close importe peu.
  - key: qcm-root
    format: multiple-choice
    question: "Un handler sert des fichiers dont le nom vient de l'utilisateur. Que garantit `os.Root` ?"
    choices:
      - {text: "Qu'aucun chemin, « ../ » ou lien symbolique compris, ne sorte du dossier", correct: true}
      - {text: "Que le programme tourne avec les droits d'administrateur", correct: false}
      - {text: "Que les fichiers servis sont en lecture seule pour tous", correct: false}
      - {text: "Que le nom demandé existe, sans quoi il crée le fichier", correct: false}
    answer: "`os.Root` refuse tout chemin qui sort du dossier, par « ../ » comme par un lien symbolique qui pointe ailleurs : c'est une protection contre la traversée de chemins."
  - key: qcm-chemins
    format: multiple-choice
    question: Comment construire un chemin portable ?
    choices:
      - text: '`filepath.Join(dossier, nom)`'
        correct: true
      - text: '`dossier + "/" + nom`'
        correct: false
      - text: '`path.Join` pour les chemins de fichiers de Windows'
        correct: false
      - text: '`fmt.Sprintf("%s\\%s", dossier, nom)`'
        correct: false
    answer: path sert aux chemins avec des « / » (URL), filepath aux fichiers du système.
  - key: trous-readfile
    format: fill-in
    question: |-
      Complète pour lire un petit fichier :
      ```go
      donnees, err := os.___("config.json")
      ```
    blanks:
      - - ReadFile
    answer: os.ReadFile.
  - key: trous-defer
    format: fill-in
    question: |-
      Complète :
      ```go
      f, err := os.Open(chemin)
      if err != nil {
      	return err
      }
      ___ f.Close()
      ```
    blanks:
      - - defer
    answer: defer juste après la vérification de l'erreur.
  - key: trous-notexist
    format: fill-in
    question: |-
      Complète pour un fichier absent :
      ```go
      if errors.Is(err, fs.___) {
      	return ConfigParDefaut(), nil
      }
      ```
    blanks:
      - - ErrNotExist
    answer: fs.ErrNotExist.
  - key: trous-append
    format: fill-in
    question: |-
      Complète pour ajouter à la fin du journal :
      ```go
      f, err := os.OpenFile("app.log", os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
      ```
      Quel drapeau fait écrire à la fin ? ___
    blanks:
      - - O_APPEND
        - os.O_APPEND
    answer: O_APPEND.
  - key: bug-close-oublie
    format: bug-fix
    question: |-
      Après quelques heures, le service échoue avec « too many open files ». Quelle correction est la bonne ?
      ```go
      func lire(chemin string) ([]byte, error) {
      	f, err := os.Open(chemin)
      	if err != nil {
      		return nil, err
      	}
      	return io.ReadAll(f)
      }
      ```
    choices:
      - {text: "Ajouter `defer f.Close()` juste après la vérification de l'erreur", correct: true}
      - {text: "Relever la limite de descripteurs du système avec `ulimit -n`", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque lecture, pour fermer le fichier", correct: false}
      - {text: "Remplacer `io.ReadAll(f)` par une boucle de `f.Read` explicite", correct: false}
    answer: "```go\nfunc lire(chemin string) ([]byte, error) {\n\tf, err := os.Open(chemin)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer f.Close()\n\treturn io.ReadAll(f)\n}\n```\nChaque appel laissait un descripteur ouvert. (Ici, `os.ReadFile(chemin)` ferait tout en une ligne.)"
  - key: bug-defer-avant
    format: bug-fix
    question: |-
      Ton collègue place le `defer` avant la vérification de l'erreur. Que se passe-t-il quand le fichier n'existe pas ?
      ```go
      f, err := os.Open(chemin)
      defer f.Close()
      if err != nil {
      	return err
      }
      ```
    choices:
      - {text: "`f` vaut nil, et `Close` renvoie une erreur ignorée : ça marche par chance", correct: true}
      - {text: "`f.Close()` panique sur un `*os.File` nil, au retour de la fonction", correct: false}
      - {text: "Le `defer` n'est pas enregistré, puisque `err` n'est pas nil", correct: false}
      - {text: "Ça ne compile pas : `f` est utilisé avant d'être vérifié", correct: false}
    answer: |-
      ```go
      f, err := os.Open(chemin)
      if err != nil {
      	return err
      }
      defer f.Close()
      ```
      En cas d'erreur, `f` vaut nil : `(*os.File).Close` le vérifie et renvoie `os.ErrInvalid`, sans panic. Ça ne marche que par chance (la méthode `Close` d'un autre type paniquerait) : le `defer` se place après la vérification.
  - key: bug-atomique
    format: bug-fix
    question: |-
      Après une coupure de courant pendant la sauvegarde, le fichier d'état est à moitié écrit et illisible. Quelle correction est la bonne ?
      ```go
      os.WriteFile("etat.json", donnees, 0o644)
      ```
    choices:
      - {text: "Écrire dans un fichier temporaire du même dossier, `Sync`, puis `os.Rename`", correct: true}
      - {text: "Écrire deux fois le fichier, pour que l'une des copies soit complète", correct: false}
      - {text: "Ouvrir le fichier avec `os.O_APPEND`, pour ne jamais effacer l'ancien", correct: false}
      - {text: "Vérifier l'erreur de `os.WriteFile`, puis recommencer en cas d'échec", correct: false}
    answer: "```go\ntmp, err := os.CreateTemp(\".\", \"etat-*.json\")\nif err != nil {\n\treturn err\n}\ndefer os.Remove(tmp.Name()) // sans effet si le renommage a réussi\nif _, err := tmp.Write(donnees); err != nil {\n\ttmp.Close()\n\treturn err\n}\nif err := tmp.Sync(); err != nil {\n\ttmp.Close()\n\treturn err\n}\nif err := tmp.Close(); err != nil {\n\treturn err\n}\nreturn os.Rename(tmp.Name(), \"etat.json\")\n```\nOn écrit un fichier temporaire dans le même dossier, on le synchronise sur le disque, puis on le renomme :\nl'ancien fichier reste intact jusqu'au dernier moment."
  - key: bug-traversee
    format: bug-fix
    question: |-
      Un utilisateur télécharge `/etc/passwd` en demandant le fichier « ../../etc/passwd ». Quelle correction est la bonne ?
      ```go
      chemin := filepath.Join("/srv/fichiers", r.URL.Query().Get("nom"))
      http.ServeFile(w, r, chemin)
      ```
    choices:
      - {text: "Ouvrir le dossier une fois avec `os.OpenRoot`, puis `racine.Open(nom)`", correct: true}
      - {text: "Appeler `filepath.Clean` sur le nom avant le `filepath.Join`", correct: false}
      - {text: "Remplacer `filepath.Join` par une concaténation avec `+`", correct: false}
      - {text: "Refuser les noms qui commencent par `/`, puis garder le `Join`", correct: false}
    answer: "```go\nracine, err := os.OpenRoot(\"/srv/fichiers\") // une fois, au démarrage\nif err != nil {\n\tlog.Fatal(err)\n}\n\n// dans le handler\nf, err := racine.Open(r.URL.Query().Get(\"nom\"))\nif err != nil {\n\thttp.NotFound(w, r)\n\treturn\n}\ndefer f.Close()\nio.Copy(w, f)\n```\nfilepath.Join résolvait les « .. » et sortait du dossier ; os.Root refuse tout chemin qui en sort."
