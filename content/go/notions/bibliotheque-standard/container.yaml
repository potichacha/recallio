notion: container
lesson: "Le dossier **`container`** de la bibliothèque standard fournit trois structures :\n\n**`container/heap`** : un **tas binaire** (file de priorité) sur **votre** slice. On implémente `heap.Interface`, soit\n`sort.Interface` plus `Push` et `Pop`, puis on passe par les fonctions du package :\n\n```go\ntype TasMin []int\n\nfunc (h TasMin) Len() int           { return len(h) }\nfunc (h TasMin) Less(i, j int) bool { return h[i] < h[j] }\nfunc (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *TasMin) Pop() any {\n\told := *h\n\tn := len(old)\n\tx := old[n-1]\n\t*h = old[:n-1]\n\treturn x\n}\n\nh := &TasMin{5, 2, 8}\nheap.Init(h)\nheap.Push(h, 1)\nfmt.Println(heap.Pop(h)) // 1 : toujours le plus petit\n```\n\n- `heap.Push` et `heap.Pop` coûtent **O(log n)**, le minimum se lit en O(1) dans `h[0]` ;\n- on appelle **`heap.Push(h, x)`**, jamais `h.Push(x)` directement (qui n'ordonne rien) ;\n- `heap.Fix(h, i)` rétablit l'ordre après avoir changé la priorité de l'élément i.\n\n**`container/list`** : une liste **doublement chaînée** (`PushBack`, `PushFront`, `Remove`, `MoveToFront`), utile\npour un cache **LRU** combiné à une map. **`container/ring`** : une liste circulaire, rarement utilisée.\n\nDans la plupart des cas, une simple slice est plus rapide qu'une liste chaînée (mémoire contiguë). On sort le tas\npour les files de priorité : Dijkstra, ordonnancement de tâches, les k plus grands éléments.\n\n**En entretien** : « heap : implémenter Len, Less, Swap, Push, Pop, puis heap.Init, heap.Push, heap.Pop en O(log n) ;\nlist pour un LRU avec une map ; une slice reste le choix par défaut. »"
cards:
  - key: implementer-file-priorite
    format: course
    question: "Comment implémenter une file de priorité avec la bibliothèque standard ?"
    choices:
      - {text: "Implémenter `heap.Interface` sur une slice et utiliser `container/heap`", correct: true}
      - {text: "Utiliser `container/list`, triée à chaque insertion avec `sort.Slice`", correct: false}
      - {text: "Utiliser une map dont les clés sont les priorités, parcourue dans l'ordre", correct: false}
      - {text: "Utiliser un channel bufferisé, qui livre d'abord les éléments prioritaires", correct: false}
    answer: "`container/heap` fournit les algorithmes de tas ; on lui donne une slice qui implémente `heap.Interface` (Len, Less, Swap, Push, Pop). Une map n'est pas parcourue dans l'ordre, et un channel livre dans l'ordre d'arrivée."
  - key: methodes-heap-interface
    format: course
    question: "Quelles méthodes faut-il pour implémenter `heap.Interface` ?"
    choices:
      - {text: "`Len`, `Less` et `Swap` (de `sort.Interface`), plus `Push` et `Pop`", correct: true}
      - {text: "`Len`, `Less` et `Swap` seulement, comme `sort.Interface`", correct: false}
      - {text: "`Push`, `Pop` et `Peek`, comme une pile classique", correct: false}
      - {text: "`Init`, `Push`, `Pop` et `Fix`, les fonctions du paquet", correct: false}
    answer: "`heap.Interface` embarque `sort.Interface` (Len, Less, Swap) et ajoute `Push(x any)` et `Pop() any`. `Init`, `Fix` et `Remove` sont des fonctions du paquet, qui appellent ces méthodes."
  - key: representer-graphe
    format: course
    question: "Comment représente-t-on le plus souvent un graphe en Go ?"
    choices:
      - {text: "Par des listes d'adjacence : une map ou une slice de slices de voisins", correct: true}
      - {text: "Par une `container/list` de nœuds, chacun relié au suivant", correct: false}
      - {text: "Par le type `graph.Graph` de la bibliothèque standard", correct: false}
      - {text: "Par un `container/heap` de nœuds, ordonné par leur degré", correct: false}
    answer: "Des listes d'adjacence, en `map[string][]string` ou en `[][]int` quand les nœuds sont numérotés ; une matrice d'adjacence pour un graphe dense. La bibliothèque standard n'a pas de type graphe."
  - key: implemente-dijkstra
    format: scenario
    question: "En entretien, on te demande d'implémenter Dijkstra en Go. Quelles structures choisis-tu ?"
    choices:
      - {text: "Des listes d'adjacence et un tas `container/heap` ordonné par distance", correct: true}
      - {text: "Une matrice d'adjacence et un parcours en largeur avec une file FIFO", correct: false}
      - {text: "Des listes d'adjacence et une slice retriée par `sort.Slice` à chaque tour", correct: false}
      - {text: "Une `container/list` de nœuds, parcourue en profondeur depuis la source", correct: false}
    answer: "Des listes d'adjacence et `container/heap` comme file de priorité sur la distance : on extrait le nœud le plus proche, on ignore les entrées périmées et l'on relâche ses arcs, en O((V + E) log V) pour des poids positifs. Un parcours en largeur ne vaut que pour des arcs de même poids."
  - key: push-direct
    format: course
    question: "Pourquoi appeler `heap.Push(h, x)` et pas `h.Push(x)` ?"
    choices:
      - {text: "`h.Push` ajoute seulement à la fin ; `heap.Push` l'appelle puis fait remonter l'élément", correct: true}
      - {text: "`h.Push` trie toute la slice à chaque appel, ce qui coûte O(n log n)", correct: false}
      - {text: "`h.Push` n'est pas sûr en concurrence, contrairement à `heap.Push`", correct: false}
      - {text: "Aucune différence : `heap.Push` n'est qu'un raccourci pour `h.Push`", correct: false}
    answer: La méthode Push du type se contente d'ajouter à la fin de la slice ; c'est heap.Push qui l'appelle puis fait remonter l'élément pour garder la propriété de tas.
  - key: vf-complexite
    format: true-false
    question: heap.Push et heap.Pop s'exécutent en O(log n).
    truth: true
    answer: Le minimum se lit en O(1) dans h[0].
  - key: vf-generique
    format: true-false
    question: container/heap fournit un type de tas générique prêt à l'emploi.
    truth: false
    answer: On implémente heap.Interface sur son propre type.
  - key: vf-list-rapide
    format: true-false
    question: Une container/list est en général plus rapide qu'une slice pour parcourir des éléments.
    truth: false
    answer: La slice est contiguë en mémoire, la liste suit des pointeurs.
  - key: vf-fix
    format: true-false
    question: Après avoir modifié la priorité d'un élément du tas, il faut appeler heap.Fix.
    truth: true
    answer: Sinon l'ordre du tas n'est plus garanti.
  - key: qcm-interface
    format: multiple-choice
    question: "Quelles méthodes `heap.Interface` demande-t-elle en plus de celles de `sort.Interface` ?"
    choices:
      - {text: "`Push(x any)` et `Pop() any`", correct: true}
      - {text: "`Peek() any` et `Size() int`", correct: false}
      - {text: "`Init()` et `Fix(i int)`", correct: false}
      - {text: "`Insert(x any)` et `Min() any`", correct: false}
    answer: "`heap.Interface` ajoute `Push(x any)` et `Pop() any` à `Len`, `Less` et `Swap`. Il n'y a pas de `Peek` : le minimum se lit dans `h[0]`."
  - key: qcm-usages
    format: multiple-choice
    question: "Pour lequel de ces problèmes un tas n'est-il pas adapté ?"
    choices:
      - {text: "Chercher un élément par sa clé", correct: true}
      - {text: "L'algorithme de Dijkstra", correct: false}
      - {text: "Garder les k plus grands éléments d'un flux", correct: false}
      - {text: "Un planificateur qui exécute la tâche la plus urgente", correct: false}
    answer: "Un tas donne vite le minimum, pas un élément quelconque : y chercher par clé coûte O(n), une map le fait en O(1). Dijkstra, le top k et un planificateur ont justement besoin du minimum."
  - key: qcm-lru
    format: multiple-choice
    question: Comment construire un cache LRU avec la bibliothèque standard ?
    choices:
      - {text: "Une map de la clé vers un élément de `container/list`, avec `MoveToFront` à chaque accès", correct: true}
      - {text: "Un `container/heap` trié par clé, dont on retire la racine quand le cache est plein", correct: false}
      - {text: "Une slice triée par date d'accès, retriée avec `sort.Slice` à chaque lecture", correct: false}
      - {text: "Une map seule, dont on supprime une clé au hasard quand le cache est plein", correct: false}
    answer: "La map retrouve l'élément en O(1), la liste garde l'ordre d'usage : `MoveToFront` à chaque accès, `Remove` de l'élément du fond quand le cache est plein. Toutes les opérations restent en O(1)."
  - key: qcm-max
    format: multiple-choice
    question: Comment obtenir un tas max plutôt qu'un tas min ?
    choices:
      - text: Inverser la comparaison dans Less (`h[i] > h[j]`)
        correct: true
      - text: Appeler heap.Reverse
        correct: false
      - text: Trier la slice à l'envers avant heap.Init
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: heap.Reverse n'existe pas.
  - key: trous-init
    format: fill-in
    question: |-
      Complète pour organiser une slice existante en tas :
      ```go
      h := &TasMin{5, 2, 8}
      heap.___(h)
      ```
    blanks:
      - - Init
    answer: heap.Init, en O(n).
  - key: trous-pop
    format: fill-in
    question: |-
      Complète pour retirer le plus petit :
      ```go
      min := heap.___(h).(int)
      ```
    blanks:
      - - Pop
    answer: heap.Pop renvoie un any.
  - key: trous-push-methode
    format: fill-in
    question: |-
      Complète la méthode Push :
      ```go
      func (h *TasMin) Push(x any) {
      	*h = ___(*h, x.(int))
      }
      ```
    blanks:
      - - append
    answer: Elle ajoute à la fin ; heap.Push fait remonter.
  - key: trous-list
    format: fill-in
    question: |-
      Complète pour marquer l'élément comme le plus récent :
      ```go
      c.liste.___(element)
      ```
    blanks:
      - - MoveToFront
    answer: MoveToFront.
  - key: code-tas
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type TasMin []int

      func (h TasMin) Len() int           { return len(h) }
      func (h TasMin) Less(i, j int) bool { return h[i] < h[j] }
      func (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
      func (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }
      func (h *TasMin) Pop() any {
      	old := *h
      	x := old[len(old)-1]
      	*h = old[:len(old)-1]
      	return x
      }

      h := &TasMin{5, 2, 8}
      heap.Init(h)
      heap.Push(h, 1)
      for h.Len() > 0 {
      	fmt.Print(heap.Pop(h), " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`1 2 5 8`", correct: true}
      - {text: "`5 2 8 1`", correct: false}
      - {text: "`8 5 2 1`", correct: false}
      - {text: "`2 5 8 1`", correct: false}
    answer: '`1 2 5 8` : heap.Pop renvoie toujours le plus petit.'
    check:
      code: "package main\n\nimport (\n\t\"container/heap\"\n\t\"fmt\"\n)\n\ntype TasMin []int\n\n\nfunc (h TasMin) Len() int           { return len(h) }\n\nfunc (h TasMin) Less(i, j int) bool { return h[i] < h[j] }\n\nfunc (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\n\nfunc (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }\n\nfunc (h *TasMin) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nfunc main() {\n\th := &TasMin{5, 2, 8}\n\theap.Init(h)\n\theap.Push(h, 1)\n\tfor h.Len() > 0 {\n\t\tfmt.Print(heap.Pop(h), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 2 5 8
  - key: code-premier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type TasMax []int

      func (h TasMax) Len() int           { return len(h) }
      func (h TasMax) Less(i, j int) bool { return h[i] > h[j] }
      func (h TasMax) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
      func (h *TasMax) Push(x any)        { *h = append(*h, x.(int)) }
      func (h *TasMax) Pop() any {
      	old := *h
      	x := old[len(old)-1]
      	*h = old[:len(old)-1]
      	return x
      }

      h := &TasMax{}
      for _, v := range []int{4, 9, 1, 7} {
      	heap.Push(h, v)
      }
      fmt.Println((*h)[0], h.Len())
      ```
    choices:
      - {text: "`9 4`", correct: true}
      - {text: "`1 4`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`7 4`", correct: false}
    answer: '`9 4` : dans un tas max, la racine est le plus grand.'
    check:
      code: "package main\n\nimport (\n\t\"container/heap\"\n\t\"fmt\"\n)\n\ntype TasMax []int\n\n\nfunc (h TasMax) Len() int           { return len(h) }\n\nfunc (h TasMax) Less(i, j int) bool { return h[i] > h[j] }\n\nfunc (h TasMax) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\n\nfunc (h *TasMax) Push(x any)        { *h = append(*h, x.(int)) }\n\nfunc (h *TasMax) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nfunc main() {\n\th := &TasMax{}\n\tfor _, v := range []int{4, 9, 1, 7} {\n\t\theap.Push(h, v)\n\t}\n\tfmt.Println((*h)[0], h.Len())\n}\n"
      output: 9 4
  - key: code-list
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      l := list.New()
      l.PushBack("b")
      l.PushFront("a")
      e := l.PushBack("c")
      l.MoveToFront(e)
      for x := l.Front(); x != nil; x = x.Next() {
      	fmt.Print(x.Value, " ")
      }
      fmt.Println(l.Len())
      ```
    choices:
      - {text: "`c a b 3`", correct: true}
      - {text: "`a b c 3`", correct: false}
      - {text: "`c b a 3`", correct: false}
      - {text: "`a c b 3`", correct: false}
    answer: '`c a b 3` : MoveToFront place c en tête.'
    check:
      code: "package main\n\nimport (\n\t\"container/list\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tl := list.New()\n\tl.PushBack(\"b\")\n\tl.PushFront(\"a\")\n\te := l.PushBack(\"c\")\n\tl.MoveToFront(e)\n\tfor x := l.Front(); x != nil; x = x.Next() {\n\t\tfmt.Print(x.Value, \" \")\n\t}\n\tfmt.Println(l.Len())\n}\n"
      output: c a b 3
  - key: code-remove
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      l := list.New()
      for _, v := range []int{1, 2, 3} {
      	l.PushBack(v)
      }
      l.Remove(l.Back())
      fmt.Println(l.Len(), l.Front().Value, l.Back().Value)
      ```
    choices:
      - {text: "`2 1 2`", correct: true}
      - {text: "`2 2 3`", correct: false}
      - {text: "`3 1 3`", correct: false}
      - {text: "`2 1 3`", correct: false}
    answer: '`2 1 2` : le dernier élément est retiré.'
    check:
      code: "package main\n\nimport (\n\t\"container/list\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tl := list.New()\n\tfor _, v := range []int{1, 2, 3} {\n\t\tl.PushBack(v)\n\t}\n\tl.Remove(l.Back())\n\tfmt.Println(l.Len(), l.Front().Value, l.Back().Value)\n}\n"
      output: 2 1 2
  - key: scenario-topk
    format: scenario
    question: Comment garder les 10 produits les plus vendus d'un flux de millions de ventes, avec peu de mémoire ?
    choices:
      - {text: "Compter par produit dans une map, puis garder un tas min de taille 10", correct: true}
      - {text: "Compter par produit dans une map, puis trier toutes ses entrées par ventes", correct: false}
      - {text: "Garder un tas max de tous les produits, puis en retirer les 10 premiers", correct: false}
      - {text: "Garder une slice des 10 meilleurs, retriée entièrement à chaque vente", correct: false}
    answer: "Je compte les ventes par produit dans une map, puis je la parcours avec un tas min de taille 10 : un produit plus vendu que la racine (le plus faible des 10) la remplace, suivi de `heap.Fix(h, 0)`. C'est O(n log 10) ; trier ou mettre en tas tous les produits coûterait une mémoire en O(n)."
  - key: scenario-planificateur
    format: scenario
    question: Comment implémenterais-tu un planificateur qui exécute les tâches à leur heure prévue ?
    choices:
      - {text: "Un tas min ordonné par heure, protégé par un mutex, et un `Timer` réglé sur la racine", correct: true}
      - {text: "Une seule goroutine qui exécute les tâches dans l'ordre d'ajout, avec `time.Sleep`", correct: false}
      - {text: "Une slice parcourue chaque seconde, pour exécuter les tâches dont l'heure est passée", correct: false}
      - {text: "Un channel bufferisé, lu dans l'ordre d'arrivée des tâches par un seul worker", correct: false}
    answer: "Un tas min ordonné par heure d'exécution, protégé par un mutex. Une goroutine regarde la racine : si son heure est passée, elle la retire avec `heap.Pop` et l'exécute ; sinon elle attend sur un `Timer`, ou sur un channel qui signale une tâche plus urgente. `heap.Fix` reprogramme une tâche dont on garde l'indice."
  - key: scenario-lru
    format: scenario
    question: En entretien, on te demande d'implémenter un cache LRU en Go. Comment t'y prends-tu ?
    choices:
      - {text: "Une `map[string]*list.Element` et une `container/list`, la plus récente en tête", correct: true}
      - {text: "Une `map[string]V` seule, vidée entièrement quand la capacité est atteinte", correct: false}
      - {text: "Une slice de clés, dont on déplace la clé lue au début avec `append`", correct: false}
      - {text: "Une `sync.Map`, qui évince d'elle-même les entrées les moins utilisées", correct: false}
    answer: "Une `map[string]*list.Element` retrouve une entrée en O(1) ; la `container/list` garde l'ordre d'usage, la plus récente en tête. Get fait `MoveToFront` ; Put ajoute en tête et, au-delà de la capacité, retire l'élément du fond et sa clé. Un `sync.Mutex` (pas un RWMutex, car Get modifie la liste) le rend sûr."
