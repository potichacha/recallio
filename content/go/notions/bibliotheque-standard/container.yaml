notion: container
lesson: "Le dossier **`container`** de la bibliothèque standard fournit trois structures :\n\n**`container/heap`** : un **tas binaire** (file de priorité) sur **votre** slice. On implémente `heap.Interface`, soit\n`sort.Interface` plus `Push` et `Pop`, puis on passe par les fonctions du package :\n\n```go\ntype TasMin []int\n\nfunc (h TasMin) Len() int           { return len(h) }\nfunc (h TasMin) Less(i, j int) bool { return h[i] < h[j] }\nfunc (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *TasMin) Pop() any {\n\told := *h\n\tn := len(old)\n\tx := old[n-1]\n\t*h = old[:n-1]\n\treturn x\n}\n\nh := &TasMin{5, 2, 8}\nheap.Init(h)\nheap.Push(h, 1)\nfmt.Println(heap.Pop(h)) // 1 : toujours le plus petit\n```\n\n- `heap.Push` et `heap.Pop` coûtent **O(log n)**, le minimum se lit en O(1) dans `h[0]` ;\n- on appelle **`heap.Push(h, x)`**, jamais `h.Push(x)` directement (qui n'ordonne rien) ;\n- `heap.Fix(h, i)` rétablit l'ordre après avoir changé la priorité de l'élément i.\n\n**`container/list`** : une liste **doublement chaînée** (`PushBack`, `PushFront`, `Remove`, `MoveToFront`), utile\npour un cache **LRU** combiné à une map. **`container/ring`** : une liste circulaire, rarement utilisée.\n\nDans la plupart des cas, une simple slice est plus rapide qu'une liste chaînée (mémoire contiguë). On sort le tas\npour les files de priorité : Dijkstra, ordonnancement de tâches, les k plus grands éléments.\n\n**En entretien** : « heap : implémenter Len, Less, Swap, Push, Pop, puis heap.Init, heap.Push, heap.Pop en O(log n) ;\nlist pour un LRU avec une map ; une slice reste le choix par défaut. »"
cards:
  - key: implementer-file-priorite
    format: course
    question: Comment implémenter une file de priorité ?
    answer: Implémenter heap.Interface sur un slice et utiliser container/heap.
  - key: methodes-heap-interface
    format: course
    question: Quelles méthodes faut-il pour heap.Interface ?
    answer: Len, Less, Swap (sort.Interface) plus Push et Pop.
  - key: representer-graphe
    format: course
    question: Comment représenter un graphe en Go ?
    answer: Listes d'adjacence en map ou en slice de slices.
  - key: implemente-dijkstra
    format: scenario
    question: Implémente Dijkstra en Go.
    answer: Je représente le graphe par des listes d'adjacence `map[string][]Arc` et j'utilise `container/heap` comme file de priorité sur la distance. On extrait le nœud de distance minimale, on ignore les entrées périmées (distance plus grande que celle déjà connue), on relâche ses arcs et on pousse les voisins améliorés. Complexité O((V + E) log V), valable pour des poids positifs. En Go, je ferais attention à initialiser les distances avec `math.MaxInt` et à renvoyer un booléen si la destination est inatteignable plutôt qu'une valeur magique.
  - key: push-direct
    format: course
    question: Pourquoi appeler heap.Push(h, x) et pas h.Push(x) ?
    answer: La méthode Push du type se contente d'ajouter à la fin de la slice ; c'est heap.Push qui l'appelle puis fait remonter l'élément pour garder la propriété de tas.
  - key: vf-complexite
    format: true-false
    question: heap.Push et heap.Pop s'exécutent en O(log n).
    truth: true
    answer: Le minimum se lit en O(1) dans h[0].
  - key: vf-generique
    format: true-false
    question: container/heap fournit un type de tas générique prêt à l'emploi.
    truth: false
    answer: On implémente heap.Interface sur son propre type.
  - key: vf-list-rapide
    format: true-false
    question: Une container/list est en général plus rapide qu'une slice pour parcourir des éléments.
    truth: false
    answer: La slice est contiguë en mémoire, la liste suit des pointeurs.
  - key: vf-fix
    format: true-false
    question: Après avoir modifié la priorité d'un élément du tas, il faut appeler heap.Fix.
    truth: true
    answer: Sinon l'ordre du tas n'est plus garanti.
  - key: qcm-interface
    format: multiple-choice
    question: Quelles méthodes demande heap.Interface ?
    choices:
      - text: Len, Less, Swap
        correct: true
      - text: Push(x any) et Pop() any
        correct: true
      - text: Peek
        correct: false
      - text: Sort
        correct: false
    answer: Le minimum se lit dans h[0].
  - key: qcm-usages
    format: multiple-choice
    question: Pour quels problèmes un tas est-il adapté ?
    choices:
      - text: L'algorithme de Dijkstra
        correct: true
      - text: Garder les k plus grands éléments d'un flux
        correct: true
      - text: Un planificateur qui exécute la tâche la plus urgente
        correct: true
      - text: Chercher un élément par sa clé
        correct: false
    answer: Pour une recherche par clé, une map.
  - key: qcm-lru
    format: multiple-choice
    question: Comment construire un cache LRU avec la bibliothèque standard ?
    choices:
      - text: Une map de la clé vers l'élément d'une container/list
        correct: true
      - text: MoveToFront à chaque accès, et Remove de l'élément du fond quand le cache est plein
        correct: true
      - text: Un container/heap trié par clé
        correct: false
      - text: Une slice triée à chaque accès
        correct: false
    answer: Toutes les opérations restent en O(1).
  - key: qcm-max
    format: multiple-choice
    question: Comment obtenir un tas max plutôt qu'un tas min ?
    choices:
      - text: Inverser la comparaison dans Less (`h[i] > h[j]`)
        correct: true
      - text: Appeler heap.Reverse
        correct: false
      - text: Trier la slice à l'envers avant heap.Init
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: heap.Reverse n'existe pas.
  - key: trous-init
    format: fill-in
    question: |-
      Complétez pour organiser une slice existante en tas :
      ```go
      h := &TasMin{5, 2, 8}
      heap.___(h)
      ```
    blanks:
      - - Init
    answer: heap.Init, en O(n).
  - key: trous-pop
    format: fill-in
    question: |-
      Complétez pour retirer le plus petit :
      ```go
      min := heap.___(h).(int)
      ```
    blanks:
      - - Pop
    answer: heap.Pop renvoie un any.
  - key: trous-push-methode
    format: fill-in
    question: "Complétez la méthode Push :\n```go\nfunc (h *TasMin) Push(x any) {\n\t*h = ___(*h, x.(int))\n}\n```"
    blanks:
      - - append
    answer: Elle ajoute à la fin ; heap.Push fait remonter.
  - key: trous-list
    format: fill-in
    question: |-
      Complétez pour marquer l'élément comme le plus récent :
      ```go
      c.liste.___(element)
      ```
    blanks:
      - - MoveToFront
    answer: MoveToFront.
  - key: code-tas
    format: code-output
    question: "```go\ntype TasMin []int\n\nfunc (h TasMin) Len() int           { return len(h) }\nfunc (h TasMin) Less(i, j int) bool { return h[i] < h[j] }\nfunc (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *TasMin) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nh := &TasMin{5, 2, 8}\nheap.Init(h)\nheap.Push(h, 1)\nfor h.Len() > 0 {\n\tfmt.Print(heap.Pop(h), \" \")\n}\nfmt.Println()\n```"
    answer: '`1 2 5 8` : heap.Pop renvoie toujours le plus petit.'
    check:
      code: "package main\n\nimport (\n\t\"container/heap\"\n\t\"fmt\"\n)\n\ntype TasMin []int\n\n\nfunc (h TasMin) Len() int           { return len(h) }\n\nfunc (h TasMin) Less(i, j int) bool { return h[i] < h[j] }\n\nfunc (h TasMin) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\n\nfunc (h *TasMin) Push(x any)        { *h = append(*h, x.(int)) }\n\nfunc (h *TasMin) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nfunc main() {\n\th := &TasMin{5, 2, 8}\n\theap.Init(h)\n\theap.Push(h, 1)\n\tfor h.Len() > 0 {\n\t\tfmt.Print(heap.Pop(h), \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 2 5 8
  - key: code-premier
    format: code-output
    question: "```go\ntype TasMax []int\n\nfunc (h TasMax) Len() int           { return len(h) }\nfunc (h TasMax) Less(i, j int) bool { return h[i] > h[j] }\nfunc (h TasMax) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *TasMax) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *TasMax) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nh := &TasMax{}\nfor _, v := range []int{4, 9, 1, 7} {\n\theap.Push(h, v)\n}\nfmt.Println((*h)[0], h.Len())\n```"
    answer: '`9 4` : dans un tas max, la racine est le plus grand.'
    check:
      code: "package main\n\nimport (\n\t\"container/heap\"\n\t\"fmt\"\n)\n\ntype TasMax []int\n\n\nfunc (h TasMax) Len() int           { return len(h) }\n\nfunc (h TasMax) Less(i, j int) bool { return h[i] > h[j] }\n\nfunc (h TasMax) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\n\nfunc (h *TasMax) Push(x any)        { *h = append(*h, x.(int)) }\n\nfunc (h *TasMax) Pop() any {\n\told := *h\n\tx := old[len(old)-1]\n\t*h = old[:len(old)-1]\n\treturn x\n}\n\nfunc main() {\n\th := &TasMax{}\n\tfor _, v := range []int{4, 9, 1, 7} {\n\t\theap.Push(h, v)\n\t}\n\tfmt.Println((*h)[0], h.Len())\n}\n"
      output: 9 4
  - key: code-list
    format: code-output
    question: "```go\nl := list.New()\nl.PushBack(\"b\")\nl.PushFront(\"a\")\ne := l.PushBack(\"c\")\nl.MoveToFront(e)\nfor x := l.Front(); x != nil; x = x.Next() {\n\tfmt.Print(x.Value, \" \")\n}\nfmt.Println(l.Len())\n```"
    answer: '`c a b 3` : MoveToFront place c en tête.'
    check:
      code: "package main\n\nimport (\n\t\"container/list\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tl := list.New()\n\tl.PushBack(\"b\")\n\tl.PushFront(\"a\")\n\te := l.PushBack(\"c\")\n\tl.MoveToFront(e)\n\tfor x := l.Front(); x != nil; x = x.Next() {\n\t\tfmt.Print(x.Value, \" \")\n\t}\n\tfmt.Println(l.Len())\n}\n"
      output: c a b 3
  - key: code-remove
    format: code-output
    question: "```go\nl := list.New()\nfor _, v := range []int{1, 2, 3} {\n\tl.PushBack(v)\n}\nl.Remove(l.Back())\nfmt.Println(l.Len(), l.Front().Value, l.Back().Value)\n```"
    answer: '`2 1 2` : le dernier élément est retiré.'
    check:
      code: "package main\n\nimport (\n\t\"container/list\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tl := list.New()\n\tfor _, v := range []int{1, 2, 3} {\n\t\tl.PushBack(v)\n\t}\n\tl.Remove(l.Back())\n\tfmt.Println(l.Len(), l.Front().Value, l.Back().Value)\n}\n"
      output: 2 1 2
  - key: scenario-topk
    format: scenario
    question: Comment garder les 10 produits les plus vendus d'un flux de millions de ventes, avec peu de mémoire ?
    answer: |-
      Je compte les ventes par produit dans une map, puis je parcours la map en gardant un tas **min** de taille 10 :
      chaque produit plus vendu que la racine (le plus faible des 10) la remplace, suivi de `heap.Fix(h, 0)`. À la fin,
      le tas contient les 10 meilleurs, en O(n log 10). Si les produits sont trop nombreux pour la map, une structure
      approchée (Count-Min Sketch) prend le relais.
  - key: scenario-planificateur
    format: scenario
    question: Comment implémenterais-tu un planificateur qui exécute les tâches à leur heure prévue ?
    answer: |-
      Un tas min ordonné par heure d'exécution, protégé par un mutex. Une goroutine regarde la racine : si son heure est
      passée, elle la retire avec heap.Pop et l'exécute ; sinon elle attend avec un Timer jusqu'à cette heure, ou un
      signal sur un channel quand une tâche plus urgente est ajoutée. heap.Fix permet de reprogrammer une tâche, à
      condition de garder son indice dans le tas.
  - key: scenario-lru
    format: scenario
    question: En entretien, on te demande d'implémenter un cache LRU en Go. Comment t'y prends-tu ?
    answer: |-
      Une `map[string]*list.Element` pour retrouver une entrée en O(1), et une `container/list` dont chaque élément
      contient la clé et la valeur, la plus récente en tête. Get : trouver dans la map, MoveToFront, renvoyer la valeur.
      Put : mettre à jour et MoveToFront si la clé existe, sinon PushFront et ajout dans la map ; au-delà de la capacité,
      retirer l'élément du fond et sa clé. Un mutex (pas un RWMutex, car Get modifie la liste) le rend sûr entre goroutines.
