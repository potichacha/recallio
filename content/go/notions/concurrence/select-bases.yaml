notion: select-bases
lesson: "**`select`** attend **plusieurs opérations de channel** à la fois, et exécute la première qui peut se faire :\n\n```go\nselect {\ncase msg := <-messages:\n\ttraiter(msg)\ncase err := <-erreurs:\n\treturn err\ncase sortie <- prochain:\n\tprochain = suivant()\ncase <-ctx.Done():\n\treturn ctx.Err()\n}\n```\n\n- Chaque `case` est un envoi ou une réception. `select` **bloque** jusqu'à ce qu'un cas soit possible.\n- Si **plusieurs** cas sont prêts, `select` en choisit un **au hasard** (uniformément), pour qu'aucun channel n'en\n  affame un autre. On ne peut donc pas compter sur l'ordre d'écriture des cas pour une priorité.\n- Un `select {}` vide bloque pour toujours.\n- Les expressions des cas (le channel, la valeur à envoyer) sont **évaluées à l'entrée** du select, une fois.\n- On l'utilise presque toujours dans une **boucle `for`** pour traiter un flux, avec un cas d'arrêt (`ctx.Done()`).\n- Un `break` dans un cas ne sort que du `select` ; pour quitter la boucle, `return` ou un label.\n\nUsages : attendre un résultat **ou** une annulation, fusionner plusieurs sources, ajouter un délai (`time.After`),\nrendre une opération non bloquante (`default`).\n\n**Piège classique** : croire que le premier cas écrit est prioritaire. Avec deux channels prêts, le choix est aléatoire ;\npour une vraie priorité, on teste d'abord le channel prioritaire dans un select séparé.\n\n**En entretien** : « select attend plusieurs channels et prend le premier prêt, au hasard si plusieurs le sont ; dans\nune boucle avec un cas ctx.Done ; break ne sort que du select. »"
tour:
  - title: select
    text: |-
      `select` attend **plusieurs** opérations de channel à la fois, et exécute la première qui est prête. Si plusieurs
      le sont en même temps, il en choisit une au hasard.

      C'est la brique de base pour combiner des sources : des résultats, un signal d'arrêt, un délai. Chaque `case` est
      une réception ou un envoi. Ici, `main` affiche les résultats jusqu'à recevoir le signal de fin.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	resultats := make(chan string)
          	quitter := make(chan bool)
          	go func() {
          		for i := range 3 {
          			resultats <- fmt.Sprint("résultat ", i)
          		}
          		quitter <- true
          	}()
          	for {
          		select {
          		case r := <-resultats:
          			fmt.Println(r)
          		case <-quitter:
          			fmt.Println("terminé")
          			return
          		}
          	}
          }
      output: |-
        résultat 0
        résultat 1
        résultat 2
        terminé
cards:
  - key: select-avec-plusieurs-cas-prets
    format: course
    question: "Que fait `select` quand plusieurs de ses cas sont prêts ?"
    choices:
      - {text: "Il en choisit un au hasard", correct: true}
      - {text: "Il prend le premier cas écrit", correct: false}
      - {text: "Il les exécute tous, dans l'ordre", correct: false}
      - {text: "Il panique, faute de pouvoir choisir", correct: false}
    answer: "Il en choisit un au hasard, uniformément. L'ordre d'écriture des cas ne donne aucune priorité, contrairement à un `switch`."
  - key: implemente-fonction-renvoie-resultat-premier
    format: scenario
    question: "Tu renvoies la réponse du premier de plusieurs serveurs miroirs à répondre. Pourquoi donner au channel des réponses une capacité égale au nombre de serveurs ?"
    choices:
      - {text: "Pour que les goroutines perdantes envoient quand même et se terminent : pas de fuite", correct: true}
      - {text: "Pour que la première réponse arrive plus vite, sans attendre qu'un lecteur soit prêt", correct: false}
      - {text: "Pour garder toutes les réponses, et choisir ensuite la plus complète d'entre elles", correct: false}
      - {text: "Pour que `cancel` puisse fermer le channel sans faire paniquer les émetteurs", correct: false}
    answer: |-
      ```go
      func premier(ctx context.Context, serveurs []string) (string, error) {
          ctx, cancel := context.WithCancel(ctx)
          defer cancel()                               // annule les requêtes perdantes

          type rep struct { val string; err error }
          ch := make(chan rep, len(serveurs))          // buffer : aucun émetteur ne bloque
          for _, s := range serveurs {
              go func() {
                  v, err := requete(ctx, s)
                  ch <- rep{v, err}
              }()
          }
          var derniere error
          for range serveurs {
              r := <-ch
              if r.err == nil {
                  return r.val, nil
              }
              derniere = r.err
          }
          return "", derniere
      }
      ```
      "Le buffer de la taille du nombre de serveurs est essentiel : quand je retourne après la première réponse, les goroutines restantes peuvent encore envoyer sans bloquer, donc pas de fuite. Le `cancel` différé interrompt les requêtes encore en cours."
  - key: terme-select
    format: course
    question: "Que désigne l'instruction `select` en Go ?"
    choices:
      - {text: "Une attente sur plusieurs opérations de channel à la fois", correct: true}
      - {text: "Un `switch` sur des valeurs, évalué dans l'ordre des cas", correct: false}
      - {text: "Une boucle qui lit un channel jusqu'à sa fermeture", correct: false}
      - {text: "Le choix, par le runtime, de la goroutine qui s'exécute", correct: false}
    answer: "Une attente sur plusieurs opérations de channel (envois ou réceptions) : `select` bloque jusqu'à ce que l'une soit possible. La boucle qui lit jusqu'à la fermeture, c'est `range`."
  - key: aleatoire
    format: course
    question: "Pourquoi `select` choisit-il au hasard parmi les cas prêts, plutôt que dans l'ordre d'écriture ?"
    choices:
      - {text: "Pour qu'aucun channel n'en affame un autre : l'ordre ne donne aucune priorité", correct: true}
      - {text: "Pour aller plus vite, en évitant de parcourir les cas dans l'ordre", correct: false}
      - {text: "Parce que l'ordre des cas est perdu à la compilation du programme", correct: false}
      - {text: "Pour imiter `switch`, qui choisit lui aussi au hasard entre ses cas", correct: false}
    answer: "Il choisit uniformément au hasard pour qu'aucun channel n'en affame un autre : un channel toujours prêt, écrit en premier, ne bloquerait pas les autres pour toujours. Pour une vraie priorité, il faut deux `select`."
  - key: break
    format: course
    question: "Que fait `break` dans un cas de `select` placé dans une boucle `for` ?"
    choices:
      - {text: "Il sort seulement du `select` ; la boucle continue", correct: true}
      - {text: "Il sort à la fois du `select` et de la boucle `for`", correct: false}
      - {text: "Il passe au cas suivant du `select`, comme `fallthrough`", correct: false}
      - {text: "Il ne compile pas : `break` est interdit dans un `select`", correct: false}
    answer: "Il sort seulement du `select` ; pour quitter la boucle, on utilise `return` ou un `break` vers un label posé sur le `for`."
  - key: vf-aleatoire
    format: true-false
    question: Si plusieurs cas d'un select sont prêts, le premier écrit est toujours choisi.
    truth: false
    answer: Le choix est aléatoire parmi les cas prêts.
  - key: vf-bloque
    format: true-false
    question: Sans cas `default`, un select bloque tant qu'aucun cas n'est possible.
    truth: true
    answer: Le default le rend non bloquant.
  - key: vf-vide
    format: true-false
    question: '`select {}` bloque pour toujours.'
    truth: true
    answer: Sans cas, rien ne peut jamais le débloquer.
  - key: vf-envoi
    format: true-false
    question: Un cas de select peut être un envoi sur un channel.
    truth: true
    answer: '`case sortie <- v:` s''exécute quand l''envoi est possible.'
  - key: qcm-cas
    format: multiple-choice
    question: "Lesquels de ces cas sont valides dans un `select` ?"
    choices:
      - text: '`case v := <-ch:`'
        correct: true
      - text: '`case ch <- v:`'
        correct: true
      - text: '`case x > 0:`'
        correct: false
      - text: '`case f():` sans opération de channel'
        correct: false
    answer: Chaque cas est une opération de channel.
  - key: qcm-usages
    format: multiple-choice
    question: "À quoi sert `select` ?"
    choices:
      - {text: "Attendre un résultat ou une annulation, selon ce qui arrive d'abord", correct: true}
      - {text: "Remplacer un `switch` sur des valeurs, en plus rapide", correct: false}
      - {text: "Trier des channels selon la priorité de leurs messages", correct: false}
      - {text: "Choisir la goroutine qui s'exécutera ensuite sur le cœur", correct: false}
    answer: "C'est un `switch` sur des opérations de communication : attendre plusieurs sources, une annulation, ou ajouter un délai à une attente."
  - key: qcm-priorite
    format: multiple-choice
    question: Comment donner la priorité aux messages urgents sur les messages normaux ?
    choices:
      - {text: "Tester d'abord `urgents` dans un select avec default, puis attendre les deux dans un second select", correct: true}
      - {text: "Écrire le cas `urgents` en premier dans un seul `select`, qui teste les cas dans l'ordre", correct: false}
      - {text: "Donner au channel `urgents` une plus grande capacité que celle des messages normaux", correct: false}
      - {text: "Ce n'est pas possible : `select` choisit toujours au hasard, sans aucun moyen d'agir", correct: false}
    answer: Un seul select choisit au hasard entre les cas prêts.
  - key: qcm-boucle
    format: multiple-choice
    question: "Comment sortir d'une boucle `for { select { ... } }` quand le contexte est annulé ?"
    choices:
      - {text: "`case <-ctx.Done(): return ctx.Err()`", correct: true}
      - {text: "`case <-ctx.Done(): break`", correct: false}
      - {text: "`case <-ctx.Done(): continue`", correct: false}
      - {text: "`case <-ctx.Done(): fallthrough`", correct: false}
    answer: "`return` quitte la fonction, donc la boucle ; `break boucle`, vers un label posé sur le `for`, marche aussi. Un `break` seul ne quitte que le `select`."
  - key: trous-select
    format: fill-in
    question: |-
      Complète l'attente d'un résultat ou d'une annulation :
      ```go
      ___ {
      case r := <-resultats:
      	return r, nil
      case <-ctx.Done():
      	return Resultat{}, ctx.Err()
      }
      ```
    blanks:
      - - select
    answer: '`select` attend le premier des deux.'
  - key: trous-done
    format: fill-in
    question: |-
      Complète le cas d'annulation :
      ```go
      case <-ctx.___():
      	return ctx.Err()
      ```
    blanks:
      - - Done
    answer: '`ctx.Done()` est fermé à l''annulation.'
  - key: trous-envoi
    format: fill-in
    question: |-
      Complète le cas d'envoi :
      ```go
      select {
      case sortie ___ v:
      case <-ctx.Done():
      	return
      }
      ```
    blanks:
      - - <-
    answer: Un cas peut être un envoi.
  - key: trous-label
    format: fill-in
    question: |-
      Complète pour quitter la boucle :
      ```go
      boucle:
      	for {
      		select {
      		case <-stop:
      			break ___
      		case v := <-entree:
      			traiter(v)
      		}
      	}
      ```
    blanks:
      - - boucle
    answer: Le label vise la boucle for.
  - key: code-premier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      rapide, lent := make(chan string), make(chan string)
      go func() { time.Sleep(50 * time.Millisecond); lent <- "lent" }()
      go func() { rapide <- "rapide" }()
      select {
      case m := <-rapide:
      	fmt.Println(m)
      case m := <-lent:
      	fmt.Println(m)
      }
      ```
    choices:
      - {text: "`rapide`", correct: true}
      - {text: "`lent`", correct: false}
      - text: |-
          ```
          rapide
          lent
          ```
        correct: false
      - {text: "Rien : le `select` attend que les deux soient prêts", correct: false}
    answer: "`rapide` : le `select` prend le premier cas prêt, et un seul ; le message lent arrive 50 ms plus tard, quand plus personne ne l'attend."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\trapide, lent := make(chan string), make(chan string)\n\tgo func() { time.Sleep(50 * time.Millisecond); lent <- \"lent\" }()\n\tgo func() { rapide <- \"rapide\" }()\n\tselect {\n\tcase m := <-rapide:\n\t\tfmt.Println(m)\n\tcase m := <-lent:\n\t\tfmt.Println(m)\n\t}\n}\n"
      output: rapide
  - key: code-aleatoire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a, b := make(chan int, 1), make(chan int, 1)
      compte := map[string]int{}
      for range 1000 {
      	a <- 1
      	b <- 1
      	select {
      	case <-a:
      		compte["a"]++
      		<-b
      	case <-b:
      		compte["b"]++
      		<-a
      	}
      }
      fmt.Println(compte["a"] > 300, compte["b"] > 300)
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`true false`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`false false`", correct: false}
    answer: "`true true` : avec deux cas prêts, chacun est choisi environ une fois sur deux. Écrire `a` en premier ne lui donne aucune priorité."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := make(chan int, 1), make(chan int, 1)\n\tcompte := map[string]int{}\n\tfor range 1000 {\n\t\ta <- 1\n\t\tb <- 1\n\t\tselect {\n\t\tcase <-a:\n\t\t\tcompte[\"a\"]++\n\t\t\t<-b\n\t\tcase <-b:\n\t\t\tcompte[\"b\"]++\n\t\t\t<-a\n\t\t}\n\t}\n\tfmt.Println(compte[\"a\"] > 300, compte[\"b\"] > 300)\n}\n"
      output: true true
  - key: code-break
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      ch <- 3
      n := 0
      for n < 3 {
      	select {
      	case <-ch:
      		n++
      		break
      	}
      }
      fmt.Println(n)
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien : la boucle ne s'arrête jamais", correct: false}
    answer: "`3` : le `break` ne sort que du `select`, et la boucle continue jusqu'à sa condition `n < 3`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tn := 0\n\tfor n < 3 {\n\t\tselect {\n\t\tcase <-ch:\n\t\t\tn++\n\t\t\tbreak\n\t\t}\n\t}\n\tfmt.Println(n)\n}\n"
      output: '3'
  - key: code-boucle-ctx
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancel(context.Background())
      entree := make(chan int)
      go func() {
      	for i := 1; ; i++ {
      		if i == 4 {
      			cancel()
      			return
      		}
      		entree <- i
      	}
      }()
      somme := 0
      for {
      	select {
      	case v := <-entree:
      		somme += v
      		continue
      	case <-ctx.Done():
      	}
      	break
      }
      fmt.Println(somme)
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`6` : la boucle reçoit 1, 2 et 3, puis la source annule le contexte au lieu d'envoyer 4 ; le cas `ctx.Done()` mène au `break` qui suit le `select`."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tentree := make(chan int)\n\tgo func() {\n\t\tfor i := 1; ; i++ {\n\t\t\tif i == 4 {\n\t\t\t\tcancel()\n\t\t\t\treturn\n\t\t\t}\n\t\t\tentree <- i\n\t\t}\n\t}()\n\tsomme := 0\n\tfor {\n\t\tselect {\n\t\tcase v := <-entree:\n\t\t\tsomme += v\n\t\t\tcontinue\n\t\tcase <-ctx.Done():\n\t\t}\n\t\tbreak\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '6'
  - key: bug-break
    format: bug-fix
    question: |-
      Ce worker ne s'arrête jamais. Quelle correction est la bonne ?
      ```go
      for {
      	select {
      	case j := <-jobs:
      		traiter(j)
      	case <-ctx.Done():
      		break
      	}
      }
      ```
    choices:
      - {text: "Remplacer `break` par `return`, ou par un `break` vers un label posé sur le `for`", correct: true}
      - {text: "Remplacer `break` par `continue`, qui quitte à la fois le `select` et la boucle", correct: false}
      - {text: "Ajouter un `default` au `select`, pour que la boucle puisse enfin se terminer", correct: false}
      - {text: "Fermer `jobs` dans le cas `ctx.Done()`, juste avant le `break`", correct: false}
    answer: "```go\nfor {\n\tselect {\n\tcase j := <-jobs:\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\n`break` ne sortait que du select ; `return` (ou un label) quitte la boucle."
  - key: bug-priorite
    format: bug-fix
    question: |-
      Les commandes d'arrêt passent parfois après plusieurs messages normaux, alors qu'elles devraient passer en premier. Quelle correction est la bonne ?
      ```go
      select {
      case <-arret:
      	return
      case m := <-messages:
      	traiter(m)
      }
      ```
    choices:
      - {text: "Un premier `select` non bloquant (avec `default`) sur `arret`, puis le `select` à deux cas", correct: true}
      - {text: "Donner à `arret` un tampon plus grand que celui de `messages`, pour le favoriser", correct: false}
      - {text: "Appeler `runtime.Gosched()` avant le `select`, pour laisser arriver l'arrêt", correct: false}
      - {text: "Ajouter un `default` au `select` existant, pour qu'il ne bloque plus sur `messages`", correct: false}
    answer: "```go\nselect {\ncase <-arret:\n\treturn\ndefault:\n}\nselect {\ncase <-arret:\n\treturn\ncase m := <-messages:\n\ttraiter(m)\n}\n```\nUn seul select choisit au hasard entre les cas prêts ; un premier select non bloquant vérifie l'arrêt en priorité."
  - key: bug-sans-annulation
    format: bug-fix
    question: |-
      Cette goroutine d'écoute reste bloquée après l'arrêt du serveur. Quelle correction est la bonne ?
      ```go
      go func() {
      	for m := range s.entree {
      		s.diffuser(m)
      	}
      }()
      ```
    choices:
      - {text: "Une boucle `for` avec un `select` sur `s.entree` et sur `ctx.Done()`", correct: true}
      - {text: "Tester `ctx.Err()` dans le corps du `range`, puis sortir de la boucle", correct: false}
      - {text: "Fermer `s.entree` depuis la goroutine d'écoute, au moment de l'arrêt", correct: false}
      - {text: "Donner un tampon à `s.entree`, pour que le `range` finisse plus tôt", correct: false}
    answer: "```go\ngo func() {\n\tfor {\n\t\tselect {\n\t\tcase m := <-s.entree:\n\t\t\ts.diffuser(m)\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\t}\n\t}\n}()\n```\nUn select avec le contexte donne à la goroutine une condition d'arrêt, même si `entree` n'est jamais fermé."
  - key: bug-evaluation
    format: bug-fix
    question: |-
      Ce `select` n'utilise jamais la nouvelle file renvoyée par `fileCourante()`, appelée une seule fois avant la boucle. Quelle correction est la bonne ?
      ```go
      file := fileCourante()
      for {
      	select {
      	case j := <-file:
      		traiter(j)
      	case <-ctx.Done():
      		return
      	}
      }
      ```
    choices:
      - {text: "Appeler `fileCourante()` dans le cas : il est évalué à chaque entrée dans le `select`", correct: true}
      - {text: "Ajouter un `default` au `select`, pour qu'il relise la variable `file` à chaque tour", correct: false}
      - {text: "Fermer `file` à chaque tour de boucle, pour forcer le `select` à la recharger", correct: false}
      - {text: "Mettre `file` à nil à chaque tour, pour que le `select` rappelle `fileCourante()`", correct: false}
    answer: "```go\nfor {\n\tselect {\n\tcase j := <-fileCourante():\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\nLes expressions des cas sont évaluées à chaque entrée dans le select ; en appelant la fonction dans le cas, chaque\ntour reprend la file courante."
  - key: scenario-miroirs
    format: scenario
    question: "Tu dois renvoyer la réponse du premier de plusieurs serveurs miroirs, sans laisser fuir de goroutines. Comment t'y prends-tu ?"
    choices:
      - {text: "Un contexte annulable, un channel de capacité `len(miroirs)`, une goroutine par miroir, et `defer cancel()`", correct: true}
      - {text: "Un channel non bufferisé, une goroutine par miroir, et un `return` dès que la première réponse arrive", correct: false}
      - {text: "Une goroutine par miroir, et un `runtime.Goexit` sur les autres dès que la première a répondu", correct: false}
      - {text: "Interroger les miroirs l'un après l'autre, et garder le premier qui renvoie une réponse", correct: false}
    answer: "Je crée un contexte annulable et un channel de résultats de capacité `len(miroirs)`, pour que les goroutines lentes puissent envoyer et se terminer, puis une goroutine par miroir qui appelle avec ce contexte. Un `select` attend le premier résultat ou `ctx.Done()` ; au retour, `defer cancel()` annule les requêtes en cours, et si tous échouent, je joins leurs erreurs."
  - key: scenario-fusion
    format: scenario
    question: Comment lirais-tu à la fois des commandes, des événements de configuration et un signal d'arrêt dans un même worker ?
    choices:
      - {text: "Une boucle `for` avec un `select` à trois cas, dans une seule goroutine qui garde l'état", correct: true}
      - {text: "Trois goroutines, une par flux, qui partagent l'état du worker sous un mutex", correct: false}
      - {text: "Trois boucles `range` l'une après l'autre, chacune sur un des trois channels", correct: false}
      - {text: "Un `select` avec un `default`, qui teste les trois channels en boucle sans bloquer", correct: false}
    answer: "Une boucle `for` avec un `select` à trois cas : la commande (traitée), la nouvelle configuration (appliquée entre deux commandes, sans verrou puisqu'une seule goroutine la lit) et `ctx.Done()` (arrêt propre). Le `select` sérialise les trois flux dans une seule goroutine, ce qui évite de partager l'état du worker."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande la différence entre select et switch. Que réponds-tu ?
    choices:
      - {text: "`switch` compare des valeurs dans l'ordre ; `select` attend des opérations de channel et choisit au hasard parmi les prêtes", correct: true}
      - {text: "`select` est un `switch` plus rapide, réservé aux valeurs de type channel, qu'il compare dans l'ordre", correct: false}
      - {text: "`select` teste ses cas dans l'ordre, comme `switch`, mais sans `fallthrough` ni cas `default`", correct: false}
      - {text: "`switch` bloque jusqu'à ce qu'un cas corresponde ; `select` ne bloque jamais, même sans `default`", correct: false}
    answer: "Un `switch` compare des valeurs et exécute le premier cas qui correspond, dans l'ordre. Un `select` attend des opérations de channel (envois ou réceptions), bloque tant qu'aucune n'est possible, et choisit au hasard parmi celles qui sont prêtes : il sert à attendre plusieurs sources, ajouter un délai, réagir à une annulation."
