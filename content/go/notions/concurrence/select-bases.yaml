notion: select-bases
lesson: "**`select`** attend **plusieurs opérations de channel** à la fois, et exécute la première qui peut se faire :\n\n```go\nselect {\ncase msg := <-messages:\n\ttraiter(msg)\ncase err := <-erreurs:\n\treturn err\ncase sortie <- prochain:\n\tprochain = suivant()\ncase <-ctx.Done():\n\treturn ctx.Err()\n}\n```\n\n- Chaque `case` est un envoi ou une réception. `select` **bloque** jusqu'à ce qu'un cas soit possible.\n- Si **plusieurs** cas sont prêts, `select` en choisit un **au hasard** (uniformément), pour qu'aucun channel n'en\n  affame un autre. On ne peut donc pas compter sur l'ordre d'écriture des cas pour une priorité.\n- Un `select {}` vide bloque pour toujours.\n- Les expressions des cas (le channel, la valeur à envoyer) sont **évaluées à l'entrée** du select, une fois.\n- On l'utilise presque toujours dans une **boucle `for`** pour traiter un flux, avec un cas d'arrêt (`ctx.Done()`).\n- Un `break` dans un cas ne sort que du `select` ; pour quitter la boucle, `return` ou un label.\n\nUsages : attendre un résultat **ou** une annulation, fusionner plusieurs sources, ajouter un délai (`time.After`),\nrendre une opération non bloquante (`default`).\n\n**Piège classique** : croire que le premier cas écrit est prioritaire. Avec deux channels prêts, le choix est aléatoire ;\npour une vraie priorité, on teste d'abord le channel prioritaire dans un select séparé.\n\n**En entretien** : « select attend plusieurs channels et prend le premier prêt, au hasard si plusieurs le sont ; dans\nune boucle avec un cas ctx.Done ; break ne sort que du select. »"
tour:
  - title: select
    text: |-
      `select` attend **plusieurs** opérations de channel à la fois, et exécute la première qui est prête. Si plusieurs
      le sont en même temps, il en choisit une au hasard.

      C'est la brique de base pour combiner des sources : des résultats, un signal d'arrêt, un délai. Chaque `case` est
      une réception ou un envoi. Ici, `main` affiche les résultats jusqu'à recevoir le signal de fin.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	resultats := make(chan string)
          	quitter := make(chan bool)
          	go func() {
          		for i := range 3 {
          			resultats <- fmt.Sprint("résultat ", i)
          		}
          		quitter <- true
          	}()
          	for {
          		select {
          		case r := <-resultats:
          			fmt.Println(r)
          		case <-quitter:
          			fmt.Println("terminé")
          			return
          		}
          	}
          }
      output: |-
        résultat 0
        résultat 1
        résultat 2
        terminé
cards:
  - key: select-avec-plusieurs-cas-prets
    format: course
    question: Que fait select avec plusieurs cas prêts ?
    answer: Il en choisit un au hasard.
  - key: implemente-fonction-renvoie-resultat-premier
    format: scenario
    question: Implémente une fonction qui renvoie le résultat du premier de plusieurs serveurs miroirs qui répond.
    answer: |-
      ```go
      func premier(ctx context.Context, serveurs []string) (string, error) {
          ctx, cancel := context.WithCancel(ctx)
          defer cancel()                               // annule les requêtes perdantes

          type rep struct { val string; err error }
          ch := make(chan rep, len(serveurs))          // buffer : aucun émetteur ne bloque
          for _, s := range serveurs {
              go func() {
                  v, err := requete(ctx, s)
                  ch <- rep{v, err}
              }()
          }
          var derniere error
          for range serveurs {
              r := <-ch
              if r.err == nil {
                  return r.val, nil
              }
              derniere = r.err
          }
          return "", derniere
      }
      ```
      "Le buffer de la taille du nombre de serveurs est essentiel : quand je retourne après la première réponse, les goroutines restantes peuvent encore envoyer sans bloquer, donc pas de fuite. Le `cancel` différé interrompt les requêtes encore en cours."
  - key: terme-select
    format: course
    question: Que désigne « select » ?
    answer: Attente sur plusieurs opérations de channel
  - key: aleatoire
    format: course
    question: Que fait `select` si plusieurs cas sont prêts en même temps ?
    answer: Il en choisit un au hasard, uniformément, pour qu'aucun channel n'en affame un autre ; l'ordre d'écriture des cas ne donne aucune priorité.
  - key: break
    format: course
    question: Que fait `break` dans un cas de `select` placé dans une boucle `for` ?
    answer: Il sort seulement du select ; pour quitter la boucle, on utilise `return` ou un `break` vers un label posé sur le for.
  - key: vf-aleatoire
    format: true-false
    question: Si plusieurs cas d'un select sont prêts, le premier écrit est toujours choisi.
    truth: false
    answer: Le choix est aléatoire parmi les cas prêts.
  - key: vf-bloque
    format: true-false
    question: Sans cas `default`, un select bloque tant qu'aucun cas n'est possible.
    truth: true
    answer: Le default le rend non bloquant.
  - key: vf-vide
    format: true-false
    question: '`select {}` bloque pour toujours.'
    truth: true
    answer: Sans cas, rien ne peut jamais le débloquer.
  - key: vf-envoi
    format: true-false
    question: Un cas de select peut être un envoi sur un channel.
    truth: true
    answer: '`case sortie <- v:` s''exécute quand l''envoi est possible.'
  - key: qcm-cas
    format: multiple-choice
    question: Quels cas sont valides dans un select ?
    choices:
      - text: '`case v := <-ch:`'
        correct: true
      - text: '`case ch <- v:`'
        correct: true
      - text: '`case x > 0:`'
        correct: false
      - text: '`case f():` sans opération de channel'
        correct: false
    answer: Chaque cas est une opération de channel.
  - key: qcm-usages
    format: multiple-choice
    question: À quoi sert select ?
    choices:
      - text: Attendre un résultat ou une annulation
        correct: true
      - text: Ajouter un délai à une attente
        correct: true
      - text: Remplacer un switch sur des valeurs
        correct: false
      - text: Trier des channels
        correct: false
    answer: C'est un switch sur des opérations de communication.
  - key: qcm-priorite
    format: multiple-choice
    question: Comment donner la priorité aux messages urgents sur les messages normaux ?
    choices:
      - text: Tester d'abord `urgents` dans un select avec default, puis attendre les deux dans un second select
        correct: true
      - text: Écrire le cas `urgents` en premier dans un seul select
        correct: false
      - text: Donner plus de capacité au channel urgent
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: Un seul select choisit au hasard entre les cas prêts.
  - key: qcm-boucle
    format: multiple-choice
    question: Comment sortir d'une boucle `for { select { ... } }` quand le contexte est annulé ?
    choices:
      - text: '`case <-ctx.Done(): return ctx.Err()`'
        correct: true
      - text: '`case <-ctx.Done(): break boucle` avec un label sur le for'
        correct: true
      - text: '`case <-ctx.Done(): break`'
        correct: false
      - text: '`case <-ctx.Done(): continue`'
        correct: false
    answer: Un break seul ne quitte que le select.
  - key: trous-select
    format: fill-in
    question: "Complétez l'attente d'un résultat ou d'une annulation :\n```go\n___ {\ncase r := <-resultats:\n\treturn r, nil\ncase <-ctx.Done():\n\treturn Resultat{}, ctx.Err()\n}\n```"
    blanks:
      - - select
    answer: '`select` attend le premier des deux.'
  - key: trous-done
    format: fill-in
    question: "Complétez le cas d'annulation :\n```go\ncase <-ctx.___():\n\treturn ctx.Err()\n```"
    blanks:
      - - Done
    answer: '`ctx.Done()` est fermé à l''annulation.'
  - key: trous-envoi
    format: fill-in
    question: "Complétez le cas d'envoi :\n```go\nselect {\ncase sortie ___ v:\ncase <-ctx.Done():\n\treturn\n}\n```"
    blanks:
      - - <-
    answer: Un cas peut être un envoi.
  - key: trous-label
    format: fill-in
    question: "Complétez pour quitter la boucle :\n```go\nboucle:\n\tfor {\n\t\tselect {\n\t\tcase <-stop:\n\t\t\tbreak ___\n\t\tcase v := <-entree:\n\t\t\ttraiter(v)\n\t\t}\n\t}\n```"
    blanks:
      - - boucle
    answer: Le label vise la boucle for.
  - key: code-premier
    format: code-output
    question: "```go\nrapide, lent := make(chan string), make(chan string)\ngo func() { time.Sleep(50 * time.Millisecond); lent <- \"lent\" }()\ngo func() { rapide <- \"rapide\" }()\nselect {\ncase m := <-rapide:\n\tfmt.Println(m)\ncase m := <-lent:\n\tfmt.Println(m)\n}\n```"
    answer: '`rapide` : le select prend le premier cas prêt.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\trapide, lent := make(chan string), make(chan string)\n\tgo func() { time.Sleep(50 * time.Millisecond); lent <- \"lent\" }()\n\tgo func() { rapide <- \"rapide\" }()\n\tselect {\n\tcase m := <-rapide:\n\t\tfmt.Println(m)\n\tcase m := <-lent:\n\t\tfmt.Println(m)\n\t}\n}\n"
      output: rapide
  - key: code-aleatoire
    format: code-output
    question: "```go\na, b := make(chan int, 1), make(chan int, 1)\ncompte := map[string]int{}\nfor range 1000 {\n\ta <- 1\n\tb <- 1\n\tselect {\n\tcase <-a:\n\t\tcompte[\"a\"]++\n\t\t<-b\n\tcase <-b:\n\t\tcompte[\"b\"]++\n\t\t<-a\n\t}\n}\nfmt.Println(compte[\"a\"] > 300, compte[\"b\"] > 300)\n```"
    answer: '`true true` : avec deux cas prêts, chacun est choisi environ une fois sur deux.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := make(chan int, 1), make(chan int, 1)\n\tcompte := map[string]int{}\n\tfor range 1000 {\n\t\ta <- 1\n\t\tb <- 1\n\t\tselect {\n\t\tcase <-a:\n\t\t\tcompte[\"a\"]++\n\t\t\t<-b\n\t\tcase <-b:\n\t\t\tcompte[\"b\"]++\n\t\t\t<-a\n\t\t}\n\t}\n\tfmt.Println(compte[\"a\"] > 300, compte[\"b\"] > 300)\n}\n"
      output: true true
  - key: code-break
    format: code-output
    question: "```go\nch := make(chan int, 3)\nch <- 1\nch <- 2\nch <- 3\nn := 0\nfor n < 3 {\n\tselect {\n\tcase <-ch:\n\t\tn++\n\t\tbreak\n\t}\n}\nfmt.Println(n)\n```"
    answer: '`3` : le break ne sort que du select, la boucle continue jusqu''à sa condition.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tn := 0\n\tfor n < 3 {\n\t\tselect {\n\t\tcase <-ch:\n\t\t\tn++\n\t\t\tbreak\n\t\t}\n\t}\n\tfmt.Println(n)\n}\n"
      output: '3'
  - key: code-boucle-ctx
    format: code-output
    question: "```go\nctx, cancel := context.WithCancel(context.Background())\nentree := make(chan int)\ngo func() {\n\tfor i := 1; ; i++ {\n\t\tif i == 4 {\n\t\t\tcancel()\n\t\t\treturn\n\t\t}\n\t\tentree <- i\n\t}\n}()\nsomme := 0\nfor {\n\tselect {\n\tcase v := <-entree:\n\t\tsomme += v\n\t\tcontinue\n\tcase <-ctx.Done():\n\t}\n\tbreak\n}\nfmt.Println(somme)\n```"
    answer: '`6` : la boucle traite 1, 2 et 3, puis s''arrête à l''annulation.'
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tentree := make(chan int)\n\tgo func() {\n\t\tfor i := 1; ; i++ {\n\t\t\tif i == 4 {\n\t\t\t\tcancel()\n\t\t\t\treturn\n\t\t\t}\n\t\t\tentree <- i\n\t\t}\n\t}()\n\tsomme := 0\n\tfor {\n\t\tselect {\n\t\tcase v := <-entree:\n\t\t\tsomme += v\n\t\t\tcontinue\n\t\tcase <-ctx.Done():\n\t\t}\n\t\tbreak\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '6'
  - key: bug-break
    format: bug-fix
    question: "Le worker ne s'arrête jamais :\n```go\nfor {\n\tselect {\n\tcase j := <-jobs:\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\tbreak\n\t}\n}\n```"
    answer: "```go\nfor {\n\tselect {\n\tcase j := <-jobs:\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\n`break` ne sortait que du select ; `return` (ou un label) quitte la boucle."
  - key: bug-priorite
    format: bug-fix
    question: "Les commandes d'arrêt sont parfois traitées après plusieurs messages normaux, alors qu'elles devraient passer en premier :\n```go\nselect {\ncase <-arret:\n\treturn\ncase m := <-messages:\n\ttraiter(m)\n}\n```"
    answer: "```go\nselect {\ncase <-arret:\n\treturn\ndefault:\n}\nselect {\ncase <-arret:\n\treturn\ncase m := <-messages:\n\ttraiter(m)\n}\n```\nUn seul select choisit au hasard entre les cas prêts ; un premier select non bloquant vérifie l'arrêt en priorité."
  - key: bug-sans-annulation
    format: bug-fix
    question: "La goroutine d'écoute reste bloquée après l'arrêt du serveur :\n```go\ngo func() {\n\tfor m := range s.entree {\n\t\ts.diffuser(m)\n\t}\n}()\n```"
    answer: "```go\ngo func() {\n\tfor {\n\t\tselect {\n\t\tcase m := <-s.entree:\n\t\t\ts.diffuser(m)\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\t}\n\t}\n}()\n```\nUn select avec le contexte donne à la goroutine une condition d'arrêt, même si `entree` n'est jamais fermé."
  - key: bug-evaluation
    format: bug-fix
    question: "Le select n'utilise jamais la nouvelle file renvoyée par `fileCourante()` dans la boucle, parce qu'elle est appelée une seule fois avant :\n```go\nfile := fileCourante()\nfor {\n\tselect {\n\tcase j := <-file:\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```"
    answer: "```go\nfor {\n\tselect {\n\tcase j := <-fileCourante():\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\nLes expressions des cas sont évaluées à chaque entrée dans le select ; en appelant la fonction dans le cas, chaque\ntour reprend la file courante."
  - key: scenario-miroirs
    format: scenario
    question: Implémente une fonction qui renvoie la réponse du premier de plusieurs serveurs miroirs, sans laisser fuir les goroutines.
    answer: |-
      `func Premier(ctx context.Context, miroirs []string) (Reponse, error)` : je crée un contexte annulable, un channel
      de résultats de capacité `len(miroirs)` (pour que les goroutines lentes puissent envoyer et se terminer), et je lance
      une goroutine par miroir qui appelle avec ce contexte. Un `select` attend le premier résultat ou `ctx.Done()` ;
      au retour, `defer cancel()` annule les requêtes encore en cours. Si tous échouent, je joins leurs erreurs.
  - key: scenario-fusion
    format: scenario
    question: Comment lirais-tu à la fois des commandes, des événements de configuration et un signal d'arrêt dans un même worker ?
    answer: |-
      Une boucle `for` avec un `select` à trois cas : la réception d'une commande (traitée), la réception d'une nouvelle
      configuration (appliquée entre deux commandes, sans verrou puisqu'une seule goroutine la lit) et `ctx.Done()`
      (arrêt propre). Le select sérialise naturellement les trois flux dans une seule goroutine, ce qui évite de partager
      l'état du worker.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande la différence entre select et switch. Que réponds-tu ?
    answer: |-
      Un switch compare des valeurs et exécute le premier cas qui correspond, dans l'ordre. Un select attend des
      opérations de channel (envois ou réceptions), bloque tant qu'aucune n'est possible, et choisit au hasard parmi
      celles qui sont prêtes. Il sert à la concurrence : attendre plusieurs sources, ajouter un délai, réagir à une
      annulation.
