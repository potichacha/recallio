notion: select-bases
cards:
  - key: select-avec-plusieurs-cas-prets
    format: course
    question: Que fait select avec plusieurs cas prêts ?
    answer: Il en choisit un au hasard.
  - key: implemente-fonction-renvoie-resultat-premier
    format: scenario
    question: Implémente une fonction qui renvoie le résultat du premier de plusieurs serveurs miroirs qui répond.
    answer: |-
      ```go
      func premier(ctx context.Context, serveurs []string) (string, error) {
          ctx, cancel := context.WithCancel(ctx)
          defer cancel()                               // annule les requêtes perdantes

          type rep struct { val string; err error }
          ch := make(chan rep, len(serveurs))          // buffer : aucun émetteur ne bloque
          for _, s := range serveurs {
              go func() {
                  v, err := requete(ctx, s)
                  ch <- rep{v, err}
              }()
          }
          var derniere error
          for range serveurs {
              r := <-ch
              if r.err == nil {
                  return r.val, nil
              }
              derniere = r.err
          }
          return "", derniere
      }
      ```
      "Le buffer de la taille du nombre de serveurs est essentiel : quand je retourne après la première réponse, les goroutines restantes peuvent encore envoyer sans bloquer, donc pas de fuite. Le `cancel` différé interrompt les requêtes encore en cours."
  - key: terme-select
    format: course
    question: Que désigne « select » ?
    answer: Attente sur plusieurs opérations de channel
