notion: fan-in-fan-out
lesson: "Deux motifs complémentaires pour paralléliser une étape :\n\n**Fan-out** : plusieurs goroutines lisent **le même channel** d'entrée et se partagent le travail. Chaque valeur n'est\nreçue que par **une** goroutine.\n\n**Fan-in** : on **fusionne** plusieurs channels en un seul.\n\n```go\nfunc fusionner(ctx context.Context, entrees ...<-chan Resultat) <-chan Resultat {\n\tsortie := make(chan Resultat)\n\tvar wg sync.WaitGroup\n\tfor _, e := range entrees {\n\t\twg.Go(func() {\n\t\t\tfor r := range e {\n\t\t\t\tselect {\n\t\t\t\tcase sortie <- r:\n\t\t\t\tcase <-ctx.Done():\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\t}\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(sortie) // une seule fermeture, après tous les émetteurs\n\t}()\n\treturn sortie\n}\n\n// fan-out : 4 workers sur la même entrée, puis fan-in de leurs sorties\nvar sorties []<-chan Resultat\nfor range 4 {\n\tsorties = append(sorties, traiter(ctx, entree))\n}\nfor r := range fusionner(ctx, sorties...) { ... }\n```\n\nCe qu'il faut savoir :\n- le fan-out **perd l'ordre** des éléments : on ajoute un indice si l'ordre compte ;\n- la sortie fusionnée se ferme **une seule fois**, après la fin de **tous** les émetteurs (un `WaitGroup`) ;\n- pour **deux** sources seulement, un `select` dans une boucle (avec l'idiome du channel mis à nil) suffit.\n\n**Piège classique** : chaque goroutine de fan-in ferme la sortie à la fin de son entrée. La première à finir la ferme,\net les autres paniquent sur « send on closed channel ».\n\n**En entretien** : « Fan-out : plusieurs goroutines lisent la même entrée ; fan-in : une goroutine par source copie vers\nune sortie unique, fermée après un WaitGroup ; l'ordre est perdu. »"
cards:
  - key: fan-out
    format: course
    question: "Qu'est-ce que le fan-out ?"
    choices:
      - {text: "Plusieurs goroutines lisent le même channel et se partagent le travail", correct: true}
      - {text: "Une goroutine envoie chaque valeur à toutes les goroutines abonnées", correct: false}
      - {text: "Plusieurs channels sont fusionnés en un seul channel de sortie", correct: false}
      - {text: "Une goroutine lit plusieurs channels l'un après l'autre, dans l'ordre", correct: false}
    answer: "Plusieurs goroutines lisent le même channel d'entrée et se partagent le travail : chaque valeur n'est reçue que par l'une d'elles. Ce n'est pas une diffusion ; la fusion, c'est le fan-in."
  - key: fan-in
    format: course
    question: "Qu'est-ce que le fan-in ?"
    choices:
      - {text: "La fusion de plusieurs channels en un seul, chaque source recopiée vers la sortie", correct: true}
      - {text: "La répartition d'un channel d'entrée entre plusieurs workers qui le lisent", correct: false}
      - {text: "La diffusion de chaque valeur d'un channel à tous ses lecteurs à la fois", correct: false}
      - {text: "Le tri des valeurs de plusieurs channels selon leur ordre d'origine", correct: false}
    answer: "La fusion de plusieurs channels en un seul, en général une goroutine par source qui recopie vers la sortie commune. La répartition entre workers, c'est le fan-out."
  - key: fermeture
    format: course
    question: "Quand fermer la sortie d'un fan-in ?"
    choices:
      - {text: "Une seule fois, après la fin de toutes les goroutines qui y envoient", correct: true}
      - {text: "Dans chaque goroutine de copie, dès que sa source est épuisée", correct: false}
      - {text: "Dès que la première source est fermée, pour prévenir le consommateur", correct: false}
      - {text: "Dans le consommateur, dès qu'il a reçu sa première valeur nulle", correct: false}
    answer: "Une seule fois, après la fin de toutes les goroutines qui y envoient : une goroutine attend leur `WaitGroup` puis ferme. Fermer depuis une copie ferait paniquer les autres (« send on closed channel »)."
  - key: ordre
    format: course
    question: "Comment garder l'ordre des résultats après un fan-out ?"
    choices:
      - {text: "Joindre à chaque élément son indice d'origine, et ranger les résultats à la réception", correct: true}
      - {text: "Donner au channel de sortie un tampon, qui garde l'ordre d'envoi des workers", correct: false}
      - {text: "Lancer les workers dans l'ordre des éléments : ils finissent dans le même ordre", correct: false}
      - {text: "Fixer `GOMAXPROCS(1)`, pour que les workers traitent les éléments dans l'ordre", correct: false}
    answer: "En joignant à chaque élément son indice d'origine, puis en rangeant les résultats à la réception (ou en écrivant dans une slice préallouée). Rien ne garantit l'ordre de fin des workers, même sur un seul cœur."
  - key: vf-une-fois
    format: true-false
    question: Dans un fan-out, chaque valeur du channel d'entrée est reçue par une seule goroutine.
    truth: true
    answer: Une réception consomme la valeur.
  - key: vf-ordre
    format: true-false
    question: Un fan-out garde l'ordre des éléments.
    truth: false
    answer: Les workers finissent dans un ordre quelconque.
  - key: vf-chaque-ferme
    format: true-false
    question: Dans un fan-in, chaque goroutine de copie peut fermer la sortie quand sa source est épuisée.
    truth: false
    answer: La première fermeture ferait paniquer les autres émetteurs.
  - key: vf-deux-sources
    format: true-false
    question: Pour fusionner deux channels, un select dans une boucle suffit.
    truth: true
    answer: Avec les channels fermés mis à nil pour désactiver leur cas.
  - key: qcm-motifs
    format: multiple-choice
    question: "Lesquelles de ces phrases décrivent correctement le fan-out et le fan-in ?"
    choices:
      - text: Fan-out pour paralléliser une étape lente
        correct: true
      - text: Fan-in pour regrouper les sorties de plusieurs workers
        correct: true
      - text: Fan-out pour diffuser chaque valeur à toutes les goroutines
        correct: false
      - text: Fan-in pour garder l'ordre des éléments
        correct: false
    answer: Pour diffuser à tous, il faut un channel par abonné (ou une fermeture pour un signal).
  - key: qcm-fermer
    format: multiple-choice
    question: Comment fermer la sortie d'un fan-in de n sources ?
    choices:
      - text: Une goroutine fait `wg.Wait()` puis `close(sortie)`
        correct: true
      - text: Chaque goroutine de copie appelle `close(sortie)` à la fin
        correct: false
      - text: Le consommateur ferme la sortie
        correct: false
      - text: On ne la ferme jamais
        correct: false
    answer: Sans fermeture, le consommateur qui fait range attendrait pour toujours.
  - key: qcm-diffusion
    format: multiple-choice
    question: Comment envoyer chaque événement à trois abonnés ?
    choices:
      - {text: "Un channel par abonné, et une goroutine qui recopie chaque événement sur les trois", correct: true}
      - {text: "Trois goroutines qui lisent toutes le même channel d'événements, sans tampon", correct: false}
      - {text: "Un seul channel bufferisé de capacité 3, soit une place pour chaque abonné", correct: false}
      - {text: "Fermer le channel après chaque événement, pour réveiller les trois lecteurs", correct: false}
    answer: Lire le même channel partage les événements au lieu de les diffuser.
  - key: qcm-quand
    format: multiple-choice
    question: "Quand le fan-out apporte-t-il un gain ?"
    choices:
      - {text: "Quand une étape lente fait des entrées-sorties qui peuvent se chevaucher", correct: true}
      - {text: "Quand le traitement de chaque élément se limite à une simple addition", correct: false}
      - {text: "Toujours : plus de goroutines rend toujours un programme plus rapide", correct: false}
      - {text: "Quand l'ordre des résultats doit rester celui des éléments d'entrée", correct: false}
    answer: "Quand une étape est nettement plus lente que les autres, surtout si elle fait des entrées-sorties qui se chevauchent. Pour un travail minuscule, la coordination coûte plus qu'elle ne rapporte, et le fan-out perd l'ordre."
  - key: bug-close-multiple
    format: bug-fix
    question: |-
      La fusion panique avec « send on closed channel ». Quelle correction est la bonne ?
      ```go
      for _, e := range entrees {
      	go func() {
      		for r := range e {
      			sortie <- r
      		}
      		close(sortie)
      	}()
      }
      ```
    choices:
      - {text: "Fermer la sortie une seule fois, dans une goroutine qui attend le `WaitGroup` des copies", correct: true}
      - {text: "Entourer `close(sortie)` d'un `recover`, pour ignorer les fermetures en double", correct: false}
      - {text: "Fermer `sortie` avant de lancer les goroutines de copie, une fois pour toutes", correct: false}
      - {text: "Fermer chaque source `e` à la place de `sortie`, à la fin de sa copie", correct: false}
    answer: "```go\nvar wg sync.WaitGroup\nfor _, e := range entrees {\n\twg.Go(func() {\n\t\tfor r := range e {\n\t\t\tsortie <- r\n\t\t}\n\t})\n}\ngo func() {\n\twg.Wait()\n\tclose(sortie)\n}()\n```\nLa première source épuisée fermait la sortie des autres ; on ferme une fois, après tous les émetteurs."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Après la parallélisation de la conversion, les lignes de l'export sortent dans le désordre. Quelle correction est la bonne ?
      ```go
      for r := range fusionner(convertir(lignes), convertir(lignes), convertir(lignes)) {
      	ecrire(r)
      }
      ```
    choices:
      - {text: "Numéroter chaque ligne, la faire suivre par les workers, et ranger par numéro à la fin", correct: true}
      - {text: "Donner un tampon au channel fusionné, pour qu'il garde l'ordre d'arrivée des lignes", correct: false}
      - {text: "Trier les lignes par ordre alphabétique juste avant de les écrire dans l'export", correct: false}
      - {text: "Lancer les trois `convertir` l'un après l'autre, avec un `Sleep` entre chacun", correct: false}
    answer: "```go\ntype ligneNumerotee struct {\n\tN     int\n\tLigne string\n}\n\n// les workers recopient N ; à la réception :\nresultats := make([]string, total)\nfor r := range fusionner(...) {\n\tresultats[r.N] = r.Ligne\n}\nfor _, l := range resultats {\n\tecrire(l)\n}\n```\nLe fan-out perd l'ordre : chaque élément porte son numéro, et l'on reconstruit l'ordre à la fin."
  - key: bug-diffusion
    format: bug-fix
    question: |-
      Chaque abonné ne reçoit qu'une partie des notifications. Quelle correction est la bonne ?
      ```go
      for _, a := range abonnes {
      	go a.Ecouter(notifications) // tous lisent le même channel
      }
      ```
    choices:
      - {text: "Donner un channel à chaque abonné, et recopier chaque notification sur tous", correct: true}
      - {text: "Donner au channel `notifications` un tampon d'une place par abonné", correct: false}
      - {text: "Lancer les abonnés l'un après l'autre, sans `go`, sur le même channel", correct: false}
      - {text: "Fermer `notifications` après chaque envoi, pour réveiller tous les abonnés", correct: false}
    answer: "```go\ncanaux := make([]chan Notification, len(abonnes))\nfor i, a := range abonnes {\n\tcanaux[i] = make(chan Notification, 16)\n\tgo a.Ecouter(canaux[i])\n}\nfor n := range notifications {\n\tfor _, c := range canaux {\n\t\tc <- n\n\t}\n}\n```\nPlusieurs lecteurs d'un même channel se partagent les valeurs ; pour diffuser, chaque abonné a son channel."
  - key: bug-fuite
    format: bug-fix
    question: |-
      Ce fan-in laisse des goroutines bloquées quand le consommateur s'arrête tôt. Quelle correction est la bonne ?
      ```go
      wg.Go(func() {
      	for r := range e {
      		sortie <- r
      	}
      })
      ```
    choices:
      - {text: "Envoyer dans un `select` avec `ctx.Done()`, annulé par le consommateur qui abandonne", correct: true}
      - {text: "Fermer `sortie` dans le consommateur, quand il s'arrête plus tôt que prévu", correct: false}
      - {text: "Donner à `sortie` un grand tampon, pour que les copies finissent toujours", correct: false}
      - {text: "Ajouter un `default` à l'envoi, pour abandonner toute valeur pas encore lue", correct: false}
    answer: "```go\nwg.Go(func() {\n\tfor r := range e {\n\t\tselect {\n\t\tcase sortie <- r:\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\t}\n\t}\n})\n```\nChaque copie surveille le contexte, annulé par le consommateur quand il abandonne."
  - key: scenario-crawler
    format: scenario
    question: "Tu conçois un collecteur qui télécharge 10 000 pages, au plus 20 à la fois, et rassemble les résultats. Quelle architecture choisis-tu ?"
    choices:
      - {text: "Un producteur d'URL, 20 workers qui lisent le même channel, et une sortie fermée après leur `WaitGroup`", correct: true}
      - {text: "10 000 goroutines, une par page, qui écrivent toutes leur résultat dans une même slice partagée", correct: false}
      - {text: "20 workers qui ont chacun leur channel d'URL, et qui ferment la sortie commune en finissant", correct: false}
      - {text: "Un seul worker qui télécharge les pages une à une, en gardant 20 connexions ouvertes", correct: false}
    answer: "Un producteur envoie les URL sur un channel ; 20 workers (fan-out) le lisent, téléchargent avec le contexte du collecteur et envoient leur résultat sur un channel commun, qu'une goroutine ferme après le `WaitGroup` des workers (fan-in). Un délai par requête, une annulation globale et un limiteur de débit évitent les blocages et ménagent les sites."
  - key: scenario-ordre-besoin
    format: scenario
    question: "Ton traitement parallèle doit produire un fichier dans l'ordre d'origine. Quelle option choisis-tu ?"
    choices:
      - {text: "Écrire chaque résultat à son indice dans une slice préallouée, puis écrire le fichier", correct: true}
      - {text: "Fusionner les sorties des workers, et écrire chaque résultat dès son arrivée", correct: false}
      - {text: "Donner au channel des résultats un tampon assez grand pour garder leur ordre", correct: false}
      - {text: "Lancer les workers dans l'ordre des éléments, puisqu'ils finissent dans cet ordre", correct: false}
    answer: "Écrire les résultats dans une slice préallouée, à l'indice de chaque élément, puis le fichier une fois tout reçu : simple, mais tout tient en mémoire. Pour un flux, un tampon de réordonnancement écrit le résultat n dès que ceux d'avant sont écrits, en gardant les suivants dans une map."
  - key: scenario-fusion-deux
    format: scenario
    question: "Tu dois fusionner exactement deux flux d'événements. Fan-in avec WaitGroup ou `select` ?"
    choices:
      - {text: "Un `select` en boucle sur les deux channels et `ctx.Done()`, en mettant à nil un channel fermé", correct: true}
      - {text: "Un fan-in avec WaitGroup, obligatoire dès qu'il y a plus d'un flux à fusionner", correct: false}
      - {text: "Un `select` en boucle sur les deux channels, dont on sort dès que le premier est fermé", correct: false}
      - {text: "Deux goroutines qui écrivent dans une même slice, lue une fois qu'elles ont fini", correct: false}
    answer: "Un `select` dans une boucle, avec les deux channels et `ctx.Done()`, suffit et évite deux goroutines : un channel fermé est mis à nil, et la boucle s'arrête quand les deux sont nil. Le fan-in générique avec WaitGroup devient plus simple dès que le nombre de sources varie."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande d'illustrer le fan-out et le fan-in par un exemple concret. Que réponds-tu ?"
    choices:
      - {text: "Des workers lisent un channel d'images à redimensionner (fan-out), puis une fusion regroupe leurs sorties (fan-in)", correct: true}
      - {text: "Un serveur envoie chaque notification à tous ses abonnés (fan-out), qui lui répondent tous à la fois (fan-in)", correct: false}
      - {text: "Une goroutine lit plusieurs fichiers l'un après l'autre (fan-out), puis elle les concatène (fan-in)", correct: false}
      - {text: "Un mutex répartit les requêtes entre les workers (fan-out), puis les libère dans l'ordre (fan-in)", correct: false}
    answer: "Pour redimensionner des images téléversées : plusieurs workers lisent le channel des noms de fichiers (fan-out) et envoient chacun leurs résultats ; une fusion (fan-in) les recopie vers un channel unique, fermé une fois tous les workers finis, que lit la goroutine qui met à jour la base. Diffuser à tous les abonnés n'est pas du fan-out : chaque valeur n'y va qu'à un worker."
