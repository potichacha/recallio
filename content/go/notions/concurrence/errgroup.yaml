notion: errgroup
lesson: "Le paquet **`golang.org/x/sync/errgroup`** (hors bibliothèque standard, mais maintenu par l'équipe Go) combine trois\nbesoins courants : lancer des goroutines, **attendre** leur fin, et récupérer la **première erreur**.\n\n```go\ng, ctx := errgroup.WithContext(ctx)\ng.SetLimit(8) // facultatif : au plus 8 goroutines à la fois\n\nvar profil Profil\nvar commandes []Commande\ng.Go(func() error {\n\tvar err error\n\tprofil, err = clientProfils.Lire(ctx, id)\n\treturn err\n})\ng.Go(func() error {\n\tvar err error\n\tcommandes, err = clientCommandes.Lister(ctx, id)\n\treturn err\n})\nif err := g.Wait(); err != nil {\n\treturn Page{}, err // la première erreur renvoyée\n}\n```\n\nCe qu'il faut savoir :\n- `g.Wait()` attend **toutes** les goroutines, puis renvoie la **première** erreur non nil (les suivantes sont\n  perdues) ;\n- avec **`WithContext`**, le contexte dérivé est **annulé** dès la première erreur : les autres tâches doivent le\n  surveiller pour s'arrêter tôt ;\n- **`SetLimit(n)`** borne le nombre de goroutines actives : `g.Go` **bloque** tant que la limite est atteinte\n  (`TryGo` essaie sans bloquer) ;\n- chaque goroutine écrit dans **sa propre variable** : `Wait` rend ces écritures visibles ensuite ;\n- errgroup **ne récupère pas les paniques** : une panique dans une tâche arrête le programme.\n\nLe contexte renvoyé par `WithContext` est aussi annulé quand `Wait` rend la main : il ne faut pas le réutiliser\naprès.\n\n**En entretien** : « errgroup = WaitGroup + première erreur + annulation du contexte ; SetLimit pour borner ; chaque\ntâche écrit son résultat dans sa variable. »"
cards:
  - key: errgroup
    format: course
    question: "Qu'est-ce qu'un `errgroup.Group` ?"
    choices:
      - {text: "Un groupe de goroutines qui renvoie la première erreur, annule le contexte et peut limiter la concurrence", correct: true}
      - {text: "Un `WaitGroup` qui collecte toutes les erreurs des goroutines, et les renvoie jointes à la fin", correct: false}
      - {text: "Un groupe de goroutines qui relance automatiquement celles qui échouent, jusqu'à leur réussite", correct: false}
      - {text: "Un pool de workers fixe, créé une fois, qui exécute toutes les tâches qu'on lui envoie", correct: false}
    answer: "Un groupe de goroutines qui attend leur fin, renvoie la première erreur, annule le contexte (avec `WithContext`) et peut limiter la concurrence (`SetLimit`). Il ne garde pas les autres erreurs et ne relance rien."
  - key: appelle-trois-services-parallele-renvoie-erreur
    format: scenario
    question: "Tu dois appeler trois services en parallèle, échouer si l'un échoue, avec un délai global de 2 secondes. Quelle structure choisis-tu ?"
    choices:
      - {text: "`context.WithTimeout`, puis `errgroup.WithContext`, trois `g.Go` qui écrivent chacun leur champ, et `Wait`", correct: true}
      - {text: "Trois goroutines qui ajoutent résultats et erreurs à une même slice, puis un `Sleep` de 2 secondes", correct: false}
      - {text: "Un `sync.WaitGroup`, puis un `time.After(2 * time.Second)` vérifié une fois que `Wait` a rendu la main", correct: false}
      - {text: "Trois appels l'un après l'autre, chacun avec son propre délai de 2 secondes, et leurs erreurs jointes", correct: false}
    answer: |-
      ```go
      func agreger(ctx context.Context) (Resultat, error) {
          ctx, cancel := context.WithTimeout(ctx, 2*time.Second)
          defer cancel()

          var r Resultat
          g, ctx := errgroup.WithContext(ctx)
          g.Go(func() (err error) { r.Profil, err = profil(ctx); return })
          g.Go(func() (err error) { r.Commandes, err = commandes(ctx); return })
          g.Go(func() (err error) { r.Reco, err = recommandations(ctx); return })
          if err := g.Wait(); err != nil {
              return Resultat{}, err
          }
          return r, nil
      }
      ```
      "Chaque goroutine écrit dans un champ distinct de `r`, donc pas de course de données, et `Wait` établit la synchronisation avant que je lise `r`. Au premier échec, `errgroup` annule le contexte, ce qui interrompt les autres appels s'ils respectent `ctx`. Si une réponse partielle est acceptable (les recommandations sont optionnelles), je ne renverrais pas son erreur et je la loggerais à la place."
  - key: paralleliser-avec-limite-arret-premier-echec
    format: course
    question: "Comment paralléliser des tâches avec une limite, en s'arrêtant au premier échec ?"
    choices:
      - {text: "`errgroup.WithContext`, puis `SetLimit` pour borner les tâches simultanées", correct: true}
      - {text: "Un `sync.WaitGroup`, et `GOMAXPROCS` réglé à la limite voulue", correct: false}
      - {text: "Un channel bufferisé de résultats, de la capacité de la limite voulue", correct: false}
      - {text: "Un `errgroup.Group` sans contexte, dont `Wait` arrête les tâches restantes", correct: false}
    answer: "`errgroup.WithContext` donne un contexte annulé au premier échec, et `SetLimit` borne les tâches simultanées. `GOMAXPROCS` limite les threads, pas les tâches, et sans contexte rien n'arrête les autres tâches."
  - key: terme-errgroup
    format: course
    question: "Dans quel module se trouve `errgroup`, et que réunit-il ?"
    choices:
      - {text: "Dans `golang.org/x/sync` : des goroutines, la première erreur et l'annulation", correct: true}
      - {text: "Dans `sync`, de la bibliothèque standard : un `WaitGroup` et un `Mutex` réunis", correct: false}
      - {text: "Dans `errors`, de la bibliothèque standard : plusieurs erreurs jointes en une", correct: false}
      - {text: "Dans `context` : un contexte par goroutine, annulé quand elle se termine", correct: false}
    answer: "Dans `golang.org/x/sync/errgroup`, hors de la bibliothèque standard : un groupe de goroutines, la première erreur et l'annulation du contexte. Pour joindre plusieurs erreurs, c'est `errors.Join`."
  - key: wait
    format: course
    question: "Que renvoie `g.Wait()` d'un errgroup ?"
    choices:
      - {text: "La première erreur non nil, une fois toutes les tâches finies (ou nil)", correct: true}
      - {text: "Toutes les erreurs, jointes par `errors.Join`, une fois les tâches finies", correct: false}
      - {text: "La première erreur, dès qu'elle survient, sans attendre les autres tâches", correct: false}
      - {text: "Les valeurs renvoyées par les tâches, dans une slice, et la première erreur", correct: false}
    answer: "Il attend la fin de toutes les goroutines lancées par `g.Go`, puis renvoie la première erreur non nil (ou nil si toutes ont réussi). Il attend même après une erreur : c'est le contexte qui fait s'arrêter tôt les autres."
  - key: with-context
    format: course
    question: "Que fait `errgroup.WithContext` ?"
    choices:
      - {text: "Il renvoie un groupe et un contexte dérivé, annulé à la première erreur ou au retour de `Wait`", correct: true}
      - {text: "Il renvoie un groupe dont chaque tâche reçoit son propre contexte, indépendant des autres", correct: false}
      - {text: "Il arrête de force les tâches en cours dès qu'une d'elles renvoie une erreur", correct: false}
      - {text: "Il ajoute un délai au contexte, au bout duquel `Wait` renvoie une erreur de délai", correct: false}
    answer: "Il renvoie un groupe et un contexte dérivé, annulé dès qu'une tâche renvoie une erreur (ou quand `Wait` rend la main) : les autres tâches qui le surveillent s'arrêtent tôt. Il n'interrompt de force aucune tâche."
  - key: panique
    format: course
    question: "Un `errgroup` récupère-t-il les panics de ses tâches ?"
    choices:
      - {text: "Non : une panic dans une tâche arrête le programme ; il faut un `recover` dans la tâche", correct: true}
      - {text: "Oui : `Wait` la renvoie comme une erreur, au même titre que les erreurs des tâches", correct: false}
      - {text: "Oui, et il relance une fois la tâche qui a paniqué, avant d'abandonner", correct: false}
      - {text: "Oui, s'il a été créé par `WithContext`, qui annule alors les autres tâches", correct: false}
    answer: "Non : une panic dans une tâche arrête le programme, comme dans toute goroutine. Pour la convertir en erreur, on met un `recover` dans la tâche, avec un retour nommé."
  - key: scenario-flux
    format: scenario
    question: "Quand préfères-tu un simple `sync.WaitGroup` à `errgroup` ?"
    choices:
      - {text: "Quand les tâches ne peuvent pas échouer, ou que chaque erreur doit être collectée", correct: true}
      - {text: "Quand une seule erreur doit arrêter toutes les autres tâches du groupe", correct: false}
      - {text: "Quand il faut limiter le nombre de tâches qui tournent en même temps", correct: false}
      - {text: "Quand les tâches doivent recevoir un contexte annulé au premier échec", correct: false}
    answer: "Quand les tâches ne peuvent pas échouer, ou quand chaque erreur doit être collectée plutôt que d'arrêter le groupe : un `sync.WaitGroup` (avec `wg.Go`) et des résultats qui portent leur erreur suffisent, sans dépendance à `golang.org/x/sync`. errgroup sert dès qu'on veut « la première erreur arrête tout », éventuellement avec une limite."
  - key: vf-premiere
    format: true-false
    question: '`g.Wait()` d''un errgroup renvoie toutes les erreurs des tâches, jointes.'
    truth: false
    answer: Seulement la première ; les suivantes sont perdues (on les collecte soi-même avec errors.Join si besoin).
  - key: vf-annule
    format: true-false
    question: Avec errgroup.WithContext, le contexte dérivé est annulé dès qu'une tâche renvoie une erreur.
    truth: true
    answer: Les tâches qui le surveillent s'arrêtent tôt.
  - key: vf-attend-tout
    format: true-false
    question: '`g.Wait()` rend la main dès la première erreur, sans attendre les autres tâches.'
    truth: false
    answer: Il attend toujours la fin de toutes les goroutines ; c'est l'annulation du contexte qui les fait finir plus vite.
  - key: vf-stdlib
    format: true-false
    question: errgroup fait partie de la bibliothèque standard.
    truth: false
    answer: Il est dans golang.org/x/sync, un module maintenu par l'équipe Go mais à ajouter au go.mod.
  - key: qcm-setlimit
    format: multiple-choice
    question: "Que fait `g.SetLimit(4)` sur un errgroup ?"
    choices:
      - {text: "Au plus 4 tâches tournent à la fois ; `g.Go` bloque tant qu'elles sont 4", correct: true}
      - {text: "Le groupe refuse plus de 4 tâches au total, et `g.Go` panique au-delà", correct: false}
      - {text: "Il règle `GOMAXPROCS` à 4 pendant toute la durée de vie du groupe", correct: false}
      - {text: "`Wait` rend la main dès que 4 tâches du groupe ont renvoyé une erreur", correct: false}
    answer: "Au plus 4 goroutines du groupe tournent à la fois : `g.Go` bloque tant que 4 tâches sont actives. `TryGo` existe pour essayer sans bloquer."
  - key: qcm-resultats
    format: multiple-choice
    question: "Comment récupérer sans course les résultats de tâches lancées avec errgroup ?"
    choices:
      - {text: "Chaque tâche écrit à son indice dans une slice préallouée, lue après `Wait`", correct: true}
      - {text: "`g.Wait()` renvoie les valeurs des tâches, dans leur ordre de lancement", correct: false}
      - {text: "Toutes les tâches font `append` sur la même slice, sans verrou", correct: false}
      - {text: "Chaque tâche écrit dans une même variable, lue juste avant `Wait`", correct: false}
    answer: "`Wait` ne renvoie qu'une erreur ; chaque tâche écrit dans sa propre case (ou sa propre variable), et `Wait` rend ces écritures visibles. L'`append` concurrent est une course."
  - key: qcm-apres-wait
    format: multiple-choice
    question: Que vaut le contexte de `errgroup.WithContext` après `g.Wait()` ?
    choices:
      - text: Il est annulé, même si aucune tâche n'a échoué
        correct: true
      - text: Il est toujours actif et réutilisable
        correct: false
      - text: Il est annulé seulement en cas d'erreur
        correct: false
      - text: Il est remplacé par context.Background
        correct: false
    answer: Il ne faut pas le passer à des appels faits après Wait.
  - key: qcm-quand
    format: multiple-choice
    question: "Dans lequel de ces cas `errgroup` convient-il ?"
    choices:
      - {text: "Appeler plusieurs services en parallèle, et échouer si l'un échoue", correct: true}
      - {text: "Collecter toutes les erreurs de mille validations indépendantes", correct: false}
      - {text: "Récupérer les panics des goroutines, pour les journaliser", correct: false}
      - {text: "Diffuser chaque événement à plusieurs abonnés à la fois", correct: false}
    answer: "Il garde la première erreur et annule les autres tâches ; avec `SetLimit`, il traite aussi une liste avec un nombre borné de traitements simultanés. Il ne collecte pas toutes les erreurs et ne récupère pas les panics."
  - key: trous-go
    format: fill-in
    question: |-
      Complète pour lancer une tâche dans le groupe :
      ```go
      g, ctx := errgroup.WithContext(ctx)
      g.___(func() error {
      	return appeler(ctx)
      })
      ```
    blanks:
      - - Go
    answer: '`g.Go` lance la fonction dans une goroutine.'
  - key: trous-wait
    format: fill-in
    question: |-
      Complète pour attendre et récupérer la première erreur :
      ```go
      if err := g.___(); err != nil {
      	return err
      }
      ```
    blanks:
      - - Wait
    answer: '`Wait` attend toutes les tâches.'
  - key: trous-with-context
    format: fill-in
    question: |-
      Complète pour que la première erreur annule les autres tâches :
      ```go
      g, ctx := errgroup.___(ctx)
      ```
    blanks:
      - - WithContext
    answer: Le contexte dérivé est annulé à la première erreur.
  - key: trous-limite
    format: fill-in
    question: |-
      Complète pour limiter à 10 tâches simultanées :
      ```go
      g.___(10)
      ```
    blanks:
      - - SetLimit
    answer: '`g.Go` bloque alors tant que 10 tâches tournent.'
  - key: bug-ctx-ignore
    format: bug-fix
    question: |-
      Quand le premier appel échoue, les autres continuent et la requête met 30 secondes à échouer. Quelle correction est la bonne ?
      ```go
      g, ctx := errgroup.WithContext(ctx)
      for _, s := range services {
      	g.Go(func() error {
      		return s.Appeler(context.Background())
      	})
      }
      return g.Wait()
      ```
    choices:
      - {text: "Passer à chaque appel le `ctx` du groupe, annulé à la première erreur", correct: true}
      - {text: "Appeler `g.SetLimit(1)`, pour que les appels se fassent un par un", correct: false}
      - {text: "Remplacer `errgroup.WithContext` par un `errgroup.Group` sans contexte", correct: false}
      - {text: "Renvoyer `nil` au lieu de l'erreur, pour que `Wait` rende la main plus tôt", correct: false}
    answer: "```go\ng.Go(func() error {\n\treturn s.Appeler(ctx)\n})\n```\nLes tâches doivent utiliser le contexte du groupe, annulé à la première erreur ; avec `context.Background()`,\nrien ne les arrête."
  - key: bug-race
    format: bug-fix
    question: |-
      Le détecteur de courses signale `noms`. Quelle correction est la bonne ?
      ```go
      var noms []string
      for _, id := range ids {
      	g.Go(func() error {
      		n, err := lireNom(ctx, id)
      		noms = append(noms, n)
      		return err
      	})
      }
      ```
    choices:
      - {text: "Préallouer `noms` à `len(ids)`, et faire écrire chaque tâche à son indice", correct: true}
      - {text: "Préallouer la capacité, `make([]string, 0, len(ids))`, et garder `append`", correct: false}
      - {text: "Copier `id` dans une variable locale avant chaque appel à `g.Go`", correct: false}
      - {text: "Lire `noms` seulement après `g.Wait()`, sans rien changer d'autre", correct: false}
    answer: "```go\nnoms := make([]string, len(ids))\nfor i, id := range ids {\n\tg.Go(func() error {\n\t\tn, err := lireNom(ctx, id)\n\t\tnoms[i] = n\n\t\treturn err\n\t})\n}\n```\nChaque tâche écrit à son indice ; `Wait` rend les écritures visibles."
  - key: bug-ctx-apres
    format: bug-fix
    question: |-
      L'enregistrement final échoue toujours avec « context canceled ». Quelle correction est la bonne ?
      ```go
      g, ctx := errgroup.WithContext(ctx)
      g.Go(func() error { return charger(ctx, &a) })
      g.Go(func() error { return charger(ctx, &b) })
      if err := g.Wait(); err != nil {
      	return err
      }
      return enregistrer(ctx, a, b)
      ```
    choices:
      - {text: "Nommer autrement le contexte du groupe (`gctx`), et garder `ctx` pour l'enregistrement", correct: true}
      - {text: "Appeler `enregistrer` avant `g.Wait()`, tant que le contexte du groupe est vivant", correct: false}
      - {text: "Passer `context.Background()` aux deux `charger`, pour qu'ils ne soient jamais annulés", correct: false}
      - {text: "Appeler `g.SetLimit(2)` avant de lancer les deux chargements du groupe", correct: false}
    answer: "```go\ng, gctx := errgroup.WithContext(ctx)\ng.Go(func() error { return charger(gctx, &a) })\ng.Go(func() error { return charger(gctx, &b) })\nif err := g.Wait(); err != nil {\n\treturn err\n}\nreturn enregistrer(ctx, a, b)\n```\nLe contexte du groupe est annulé quand `Wait` rend la main ; on le nomme autrement pour garder le contexte\nd'origine après."
  - key: bug-panique
    format: bug-fix
    question: Une tâche errgroup panique sur une donnée corrompue et fait tomber tout le service. Comment la convertir en erreur ?
    choices:
      - {text: "Un `defer` avec `recover` dans la tâche, et un retour nommé `err` pour la panic", correct: true}
      - {text: "Rien à faire : `g.Wait()` renvoie déjà la panic de la tâche comme une erreur", correct: false}
      - {text: "Un `recover` dans `main`, qui rattrape les panics de toutes les goroutines", correct: false}
      - {text: "Lancer `traiter` dans une goroutine à part, à l'intérieur de la tâche du groupe", correct: false}
    answer: "```go\ng.Go(func() (err error) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\terr = fmt.Errorf(\"panique dans la tâche : %v\", r)\n\t\t}\n\t}()\n\treturn traiter(ctx, donnee)\n})\n```\nerrgroup ne récupère pas les paniques : le recover se fait dans la tâche, avec un retour nommé pour transformer la\npanique en erreur."
  - key: scenario-page
    format: scenario
    question: Une page agrège le profil, les commandes et les recommandations d'un client. Comment la construis-tu avec errgroup ?
    choices:
      - {text: "Profil et commandes renvoient leur erreur ; les recommandations journalisent la leur et renvoient nil", correct: true}
      - {text: "Les trois tâches renvoient leur erreur : la page échoue dès que l'une des trois parties manque", correct: false}
      - {text: "Les trois tâches renvoient toujours nil, et l'on vérifie après `Wait` les champs restés vides", correct: false}
      - {text: "Un errgroup par service, chacun attendu à son tour par `Wait`, l'un après l'autre", correct: false}
    answer: "`errgroup.WithContext` sur le contexte de la requête, avec un délai global, et trois `g.Go` qui écrivent chacun leur variable. Le profil et les commandes sont indispensables : leur erreur est renvoyée et annule le reste ; les recommandations sont accessoires : leur tâche journalise l'erreur et renvoie nil, et la page s'affiche sans elles."
  - key: scenario-mille
    format: scenario
    question: Tu dois appeler une API pour 10 000 identifiants, au plus 20 à la fois, et t'arrêter à la première erreur. Comment ?
    choices:
      - {text: "`errgroup.WithContext`, `SetLimit(20)`, un `g.Go` par identifiant, et `ctx.Err()` testé avant chaque lancement", correct: true}
      - {text: "10 000 goroutines lancées d'un coup, et un `rate.Limiter` réglé à 20 requêtes par seconde", correct: false}
      - {text: "Un channel bufferisé de 20 résultats, dans lequel envoient 10 000 goroutines lancées d'un coup", correct: false}
      - {text: "Un `sync.WaitGroup` et `GOMAXPROCS(20)`, pour que 20 tâches au plus tournent en même temps", correct: false}
    answer: "`g, ctx := errgroup.WithContext(ctx)` puis `g.SetLimit(20)` : `g.Go` bloque quand 20 tâches tournent, et chaque tâche écrit son résultat à son indice et utilise `ctx`. Avant chaque `g.Go`, je teste `ctx.Err()` pour ne plus lancer de tâche après une erreur ; un `rate.Limiter` s'ajoute si l'API impose aussi un débit."
