notion: attendre-goroutines
cards:
  - key: apporte-sync-waitgroup
    format: course
    question: Qu'apporte sync.WaitGroup.Go ?
    answer: Lancer une goroutine suivie par le WaitGroup en une seule ligne (Go 1.25).
  - key: appeler-wg-add-avant
    format: course
    question: Pourquoi appeler wg.Add avant go ?
    answer: Sinon Wait peut s'exécuter avant que l'Add n'ait eu lieu.
  - key: eviter-time-sleep-synchroniser
    format: course
    question: Pourquoi éviter time.Sleep pour synchroniser ?
    answer: C'est fragile et lent ; utiliser WaitGroup, channels ou contextes.
