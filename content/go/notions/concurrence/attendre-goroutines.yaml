notion: attendre-goroutines
lesson: "Pour attendre la fin d'un groupe de goroutines, on utilise **`sync.WaitGroup`** :\n\n```go\nvar wg sync.WaitGroup\nfor _, url := range urls {\n\twg.Add(1)                // AVANT de lancer la goroutine\n\tgo func() {\n\t\tdefer wg.Done()      // à la fin, quoi qu'il arrive\n\t\ttelecharger(url)\n\t}()\n}\nwg.Wait()                    // bloque jusqu'à ce que le compteur revienne à 0\n\n// Depuis Go 1.25 : Add, go et Done en un seul appel\nfor _, url := range urls {\n\twg.Go(func() { telecharger(url) })\n}\nwg.Wait()\n```\n\n- **`Add` avant `go`**, jamais dans la goroutine : sinon `Wait` peut passer avant que la goroutine ait incrémenté le\n  compteur.\n- **`defer wg.Done()`** garantit le décompte même en cas de retour anticipé.\n- Un `WaitGroup` **ne se copie pas** : on le passe par pointeur (ou on utilise une closure).\n- Il n'offre **ni résultats ni erreurs** : pour des tâches qui peuvent échouer, `errgroup.Group` attend et renvoie la\n  première erreur.\n- Pour une seule goroutine, un **channel** fermé à la fin (`done := make(chan struct{})`) suffit.\n- **`time.Sleep` n'est jamais une synchronisation** : il ne garantit rien et ralentit les tests.\n\n**Piège classique** : `wg.Add(1)` à l'intérieur de la goroutine. `Wait` peut trouver le compteur à zéro et rendre la main\ntrop tôt.\n\n**En entretien** : « WaitGroup avec Add avant go, defer Done, Wait pour attendre ; wg.Go depuis Go 1.25 ; errgroup quand\nil faut les erreurs ; jamais de Sleep pour synchroniser. »"
tour:
  - title: Attendre des goroutines
    text: |-
      `sync.WaitGroup` attend qu'un groupe de goroutines ait fini. Depuis Go 1.25, `wg.Go(f)` lance `f` dans une
      goroutine et la compte, et `wg.Wait()` bloque jusqu'à ce que toutes aient terminé.

      Avant Go 1.25, on écrivait `wg.Add(1)` avant `go`, et `defer wg.Done()` au début de la goroutine : une forme qu'on
      croise encore souvent.

      Les goroutines finissent dans n'importe quel ordre : ici, chacune écrit son résultat à sa propre place dans une
      slice, et on l'affiche une fois `Wait` revenu.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"sync"
          )

          func main() {
          	mots := []string{"go", "java", "rust"}
          	longueurs := make([]int, len(mots))
          	var wg sync.WaitGroup
          	for i, mot := range mots {
          		wg.Go(func() {
          			longueurs[i] = len(mot)
          		})
          	}
          	wg.Wait()
          	fmt.Println(longueurs)
          }
      output: |-
        [2 4 4]
cards:
  - key: apporte-sync-waitgroup
    format: course
    question: "Qu'apporte `sync.WaitGroup.Go`, ajouté en Go 1.25 ?"
    choices:
      - {text: "Lancer une goroutine suivie par le groupe en une ligne, sans `Add` ni `Done` à écrire", correct: true}
      - {text: "Lancer une goroutine qui renvoie une erreur, récupérée par `Wait` comme avec `errgroup`", correct: false}
      - {text: "Limiter le nombre de goroutines du groupe qui tournent en même temps, comme un sémaphore", correct: false}
      - {text: "Attendre les goroutines du groupe avec un délai, pour ne jamais bloquer pour toujours", correct: false}
    answer: "Il lance une goroutine suivie par le `WaitGroup` en une seule ligne : plus d'`Add` oublié ou placé trop tard, plus de `Done` sauté. Il ne gère ni les erreurs (c'est `errgroup`) ni de limite."
  - key: appeler-wg-add-avant
    format: course
    question: "Pourquoi appeler `wg.Add` avant l'instruction `go`, et non dans la goroutine ?"
    choices:
      - {text: "Sinon `Wait` peut s'exécuter avant l'`Add`, et rendre la main trop tôt", correct: true}
      - {text: "Sinon le compilateur refuse le `WaitGroup` capturé par la goroutine", correct: false}
      - {text: "Sinon le compteur déborde, car chaque goroutine l'incrémente deux fois", correct: false}
      - {text: "Sinon `Done` panique toujours, car il passe avant l'`Add` de la goroutine", correct: false}
    answer: "L'ordonnanceur peut exécuter `Wait` avant que la goroutine ait commencé : le compteur vaut encore 0 et `Wait` rend la main sans l'attendre. `Add` avant `go` (ou `wg.Go`) garantit l'ordre."
  - key: eviter-time-sleep-synchroniser
    format: course
    question: "Pourquoi éviter `time.Sleep` pour attendre la fin de goroutines ?"
    choices:
      - {text: "Il attend trop ou pas assez : rien ne garantit qu'elles aient fini", correct: true}
      - {text: "Il bloque tous les threads du programme, pas seulement l'appelant", correct: false}
      - {text: "Il empêche les autres goroutines de s'exécuter pendant l'attente", correct: false}
      - {text: "Il occupe tout un cœur du processeur pendant toute la durée de l'attente", correct: false}
    answer: "Une durée fixe est fragile (trop courte sur une machine lente) et lente (trop longue le reste du temps). On attend la fin réelle avec un `WaitGroup`, un channel ou un contexte ; `Sleep` ne bloque que la goroutine qui l'appelle."
  - key: copie
    format: course
    question: "Pourquoi ne faut-il pas passer un `sync.WaitGroup` par valeur ?"
    choices:
      - {text: "La copie a son propre compteur : son `Done` ne réveille jamais le `Wait` de l'original", correct: true}
      - {text: "La copie partage le compteur de l'original, et chaque `Done` y est compté deux fois", correct: false}
      - {text: "Le compilateur refuse de copier un type qui contient un verrou, et le build échoue", correct: false}
      - {text: "Un `WaitGroup` pèse plusieurs Ko, et le copier à chaque appel ralentit le programme", correct: false}
    answer: "La copie a son propre compteur : `Done` sur la copie ne réveille jamais le `Wait` de l'original. On le passe par pointeur. Le compilateur accepte la copie ; c'est `go vet` qui la signale."
  - key: wg-go
    format: course
    question: "Que fait exactement `wg.Go(f)` ?"
    choices:
      - {text: "Il fait `Add(1)`, lance `f` dans une goroutine, puis appelle `Done` quand `f` se termine", correct: true}
      - {text: "Il lance `f` dans une goroutine, puis attend sa fin, comme le ferait un appel à `Wait`", correct: false}
      - {text: "Il exécute `f` dans la goroutine courante, puis appelle `Done` quand `f` se termine", correct: false}
      - {text: "Il fait `Add(1)` et lance `f`, mais `f` doit encore appeler `Done` elle-même", correct: false}
    answer: "Il incrémente le compteur, lance `f` dans une goroutine et appelle `Done` à sa fin : l'équivalent sûr de `Add(1)`, `go` et `defer Done()`. Il n'attend rien : c'est `Wait` qui attend."
  - key: errgroup
    format: course
    question: "Quand préférer `errgroup` à `sync.WaitGroup` ?"
    choices:
      - {text: "Quand les goroutines peuvent échouer : il renvoie la première erreur et annule les autres", correct: true}
      - {text: "Quand il y a plus de mille goroutines, au-delà de ce que `WaitGroup` sait compter", correct: false}
      - {text: "Quand les goroutines doivent se terminer dans l'ordre exact où elles ont été lancées", correct: false}
      - {text: "Quand on veut toutes les erreurs, qu'il regroupe d'office avec `errors.Join`", correct: false}
    answer: "Quand les goroutines peuvent échouer : `errgroup` attend, renvoie la première erreur et, avec `WithContext`, annule les autres. Il ne regroupe pas toutes les erreurs : seule la première est renvoyée."
  - key: vf-add-dans
    format: true-false
    question: '`wg.Add(1)` peut sans risque être appelé au début de la goroutine.'
    truth: false
    answer: '`Wait` pourrait s''exécuter avant ; on appelle `Add` avant `go`.'
  - key: vf-defer-done
    format: true-false
    question: '`defer wg.Done()` garantit le décompte même si la goroutine sort tôt.'
    truth: true
    answer: Le defer s'exécute à toute sortie de la fonction.
  - key: vf-negatif
    format: true-false
    question: Appeler `Done` plus de fois que `Add` provoque une panique.
    truth: true
    answer: '« sync: negative WaitGroup counter ».'
  - key: vf-sleep
    format: true-false
    question: Un `time.Sleep` suffisamment long est une synchronisation acceptable dans un test.
    truth: false
    answer: Il ne garantit rien et rend les tests lents et instables.
  - key: qcm-ordre
    format: multiple-choice
    question: "Lequel de ces enchaînements attend correctement la goroutine ?"
    choices:
      - {text: "`wg.Add(1)`, puis `go func() { defer wg.Done(); ... }()`, puis `wg.Wait()`", correct: true}
      - {text: "`go func() { wg.Add(1); ...; wg.Done() }()`, puis `wg.Wait()`", correct: false}
      - {text: "`wg.Wait()`, puis `wg.Add(1)` et `go func() { defer wg.Done(); ... }()`", correct: false}
      - {text: "`go func() { ...; wg.Done() }()`, puis `wg.Add(1)`, puis `wg.Wait()`", correct: false}
    answer: "Le compteur doit être incrémenté avant que `Wait` puisse s'exécuter, et avant tout `Done`. `wg.Go(func() { ... })` puis `wg.Wait()` est aussi correct, depuis Go 1.25."
  - key: qcm-outils
    format: multiple-choice
    question: "Lequel de ces outils attend vraiment la fin d'un groupe de goroutines ?"
    choices:
      - {text: "`sync.WaitGroup`", correct: true}
      - {text: "`time.Sleep`", correct: false}
      - {text: "`runtime.Gosched`", correct: false}
      - {text: "`runtime.NumGoroutine`", correct: false}
    answer: "`sync.WaitGroup` attend que son compteur revienne à zéro ; `errgroup.Group` aussi, avec les erreurs en plus. `Gosched` cède seulement le processeur un instant, et `Sleep` attend une durée, pas une fin."
  - key: qcm-passer
    format: multiple-choice
    question: "Comment donner un `sync.WaitGroup` à une fonction de travail lancée par `go` ?"
    choices:
      - {text: "Passer `&wg`, un `*sync.WaitGroup`", correct: true}
      - {text: "Passer `wg` par valeur, en paramètre", correct: false}
      - {text: "Créer un `WaitGroup` dans chaque goroutine", correct: false}
      - {text: "Envoyer `wg` à la goroutine par un channel", correct: false}
    answer: "Un pointeur partage le même compteur ; une copie (par valeur ou par un channel) a un compteur séparé. Une closure qui capture `wg` marche aussi."
  - key: qcm-erreurs
    format: multiple-choice
    question: Trois téléchargements en parallèle peuvent échouer. Quel outil garde la première erreur ?
    choices:
      - text: '`errgroup.Group` et `g.Wait()`'
        correct: true
      - text: '`sync.WaitGroup` seul'
        correct: false
      - text: '`time.Sleep` puis vérifier'
        correct: false
      - text: '`panic` dans la goroutine'
        correct: false
    answer: Le WaitGroup n'a pas de notion d'erreur.
  - key: trous-add
    format: fill-in
    question: |-
      Complète :
      ```go
      wg.___(1)
      go func() {
      	defer wg.Done()
      	travailler()
      }()
      ```
    blanks:
      - - Add
    answer: '`Add` avant de lancer la goroutine.'
  - key: trous-done
    format: fill-in
    question: |-
      Complète le décompte :
      ```go
      go func() {
      	defer wg.___()
      	travailler()
      }()
      ```
    blanks:
      - - Done
    answer: '`Done` décrémente le compteur.'
  - key: trous-wait
    format: fill-in
    question: |-
      Complète l'attente :
      ```go
      wg.___()
      fmt.Println("tout est fini")
      ```
    blanks:
      - - Wait
    answer: '`Wait` bloque jusqu''à ce que le compteur soit nul.'
  - key: trous-go
    format: fill-in
    question: |-
      Complète la forme de Go 1.25 :
      ```go
      for _, u := range urls {
      	wg.___(func() { telecharger(u) })
      }
      ```
    blanks:
      - - Go
    answer: '`wg.Go` regroupe Add, go et Done.'
  - key: code-waitgroup
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var wg sync.WaitGroup
      res := make([]int, 5)
      for i := range 5 {
      	wg.Add(1)
      	go func() {
      		defer wg.Done()
      		res[i] = i * 10
      	}()
      }
      wg.Wait()
      fmt.Println(res)
      ```
    choices:
      - {text: "`[0 10 20 30 40]`", correct: true}
      - {text: "`[40 40 40 40 40]`", correct: false}
      - {text: "`[0 0 0 0 0]`", correct: false}
      - {text: "`[]`", correct: false}
    answer: "`[0 10 20 30 40]` : chaque goroutine écrit à son propre indice, avec son propre `i`, et `Wait` attend toutes les écritures avant l'affichage."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tres := make([]int, 5)\n\tfor i := range 5 {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tres[i] = i * 10\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(res)\n}\n"
      output: '[0 10 20 30 40]'
  - key: code-wg-go
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var wg sync.WaitGroup
      var total atomic.Int64
      for i := 1; i <= 100; i++ {
      	wg.Go(func() { total.Add(int64(i)) })
      }
      wg.Wait()
      fmt.Println(total.Load())
      ```
    choices:
      - {text: "`5050`", correct: true}
      - {text: "`4950`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`10100`", correct: false}
    answer: "`5050` : `wg.Go` (Go 1.25) suit chaque goroutine, `Wait` les attend toutes, et l'atomique additionne sans data race les nombres de 1 à 100."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\tvar total atomic.Int64\n\tfor i := 1; i <= 100; i++ {\n\t\twg.Go(func() { total.Add(int64(i)) })\n\t}\n\twg.Wait()\n\tfmt.Println(total.Load())\n}\n"
      output: '5050'
  - key: code-negatif
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var wg sync.WaitGroup
      wg.Add(1)
      wg.Done()
      wg.Done()
      ```
    choices:
      - {text: "Une panic : `sync: negative WaitGroup counter`", correct: true}
      - {text: "Rien : le second `Done` est simplement ignoré", correct: false}
      - {text: "Une erreur fatale : `all goroutines are asleep`", correct: false}
      - {text: "Ça ne compile pas : `Done` est appelé deux fois", correct: false}
    answer: "Une panic « sync: negative WaitGroup counter » : le second `Done` fait passer le compteur sous zéro. Le compilateur ne voit rien, c'est une erreur d'exécution."
    check:
      code: "package main\n\nimport \"sync\"\n\nfunc main() {\n\tvar wg sync.WaitGroup\n\twg.Add(1)\n\twg.Done()\n\twg.Done()\n}\n"
      panics: negative WaitGroup counter
  - key: code-done-channel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fini := make(chan struct{})
      go func() {
      	defer close(fini)
      	fmt.Println("travail")
      }()
      <-fini
      fmt.Println("après")
      ```
    choices:
      - text: |-
          ```
          travail
          après
          ```
        correct: true
      - text: |-
          ```
          après
          travail
          ```
        correct: false
      - {text: "`après`", correct: false}
      - {text: "`travail`", correct: false}
    answer: "`travail` puis `après` : `<-fini` bloque jusqu'à la fermeture du channel, faite par `defer` à la fin de la goroutine. Pour une seule goroutine, un channel fermé suffit."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfini := make(chan struct{})\n\tgo func() {\n\t\tdefer close(fini)\n\t\tfmt.Println(\"travail\")\n\t}()\n\t<-fini\n\tfmt.Println(\"après\")\n}\n"
      output: |-
        travail
        après
  - key: bug-add-dedans
    format: bug-fix
    question: |-
      Ce rapport de facturation est parfois incomplet. Quelle correction est la bonne ?
      ```go
      for _, c := range clients {
      	go func() {
      		wg.Add(1)
      		defer wg.Done()
      		facturer(c)
      	}()
      }
      wg.Wait()
      ```
    choices:
      - {text: "Appeler `wg.Add(1)` dans la boucle, avant `go`, et non dans la goroutine", correct: true}
      - {text: "Remplacer `defer wg.Done()` par un `wg.Done()` à la fin de la goroutine", correct: false}
      - {text: "Ajouter un court `time.Sleep` avant `wg.Wait()`, le temps des `Add`", correct: false}
      - {text: "Copier `c` dans une variable locale avant de lancer chaque goroutine", correct: false}
    answer: "```go\nfor _, c := range clients {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tfacturer(c)\n\t}()\n}\nwg.Wait()\n```\n`Add` dans la goroutine pouvait arriver après `Wait`, qui rendait la main trop tôt."
  - key: bug-copie
    format: bug-fix
    question: |-
      `Wait` ne rend jamais la main, et go vet signale « passes lock by value ». Quelle correction est la bonne ?
      ```go
      func travailler(wg sync.WaitGroup) {
      	defer wg.Done()
      	...
      }

      wg.Add(1)
      go travailler(wg)
      wg.Wait()
      ```
    choices:
      - {text: "Passer un pointeur : `travailler(wg *sync.WaitGroup)` et `go travailler(&wg)`", correct: true}
      - {text: "Appeler `wg.Add(1)` dans `travailler`, juste avant son `defer wg.Done()`", correct: false}
      - {text: "Remplacer `defer wg.Done()` par un `wg.Done()` à la fin de `travailler`", correct: false}
      - {text: "Faire renvoyer `wg` par `travailler`, et appeler `Wait` sur la valeur renvoyée", correct: false}
    answer: "```go\nfunc travailler(wg *sync.WaitGroup) {\n\tdefer wg.Done()\n\t...\n}\n\ngo travailler(&wg)\n```\nLa copie avait son propre compteur ; le `Done` ne touchait pas celui qu'attendait `Wait`."
  - key: bug-done-oublie
    format: bug-fix
    question: |-
      Ce programme se bloque dès qu'un téléchargement échoue. Quelle correction est la bonne ?
      ```go
      go func() {
      	if err := telecharger(u); err != nil {
      		log.Println(err)
      		return
      	}
      	wg.Done()
      }()
      ```
    choices:
      - {text: "Appeler `defer wg.Done()` en tête de la goroutine, pour couvrir toutes les sorties", correct: true}
      - {text: "Remplacer le `return` par un `panic(err)`, pour sortir proprement de la goroutine", correct: false}
      - {text: "Appeler `wg.Done()` avant `telecharger(u)`, pour ne jamais l'oublier", correct: false}
      - {text: "Appeler `wg.Add(-1)` dans `main` après chaque erreur affichée dans le journal", correct: false}
    answer: "```go\ngo func() {\n\tdefer wg.Done()\n\tif err := telecharger(u); err != nil {\n\t\tlog.Println(err)\n\t\treturn\n\t}\n}()\n```\nLe retour anticipé sautait `Done` ; `defer` le garantit sur toutes les sorties."
  - key: bug-sleep
    format: bug-fix
    question: |-
      Cette attente de la fin des tâches est fragile. Quelle correction est la bonne ?
      ```go
      for _, t := range taches {
      	go executer(t)
      }
      time.Sleep(2 * time.Second)
      ```
    choices:
      - {text: "Un `sync.WaitGroup` : `wg.Go` pour chaque tâche, puis `wg.Wait()`", correct: true}
      - {text: "Un `Sleep` plus long, calculé d'après le nombre de tâches lancées", correct: false}
      - {text: "Un `runtime.Gosched()` à la place du `Sleep`, pour céder la main", correct: false}
      - {text: "Un `Sleep` dans chaque goroutine, avant l'appel à `executer(t)`", correct: false}
    answer: "```go\nvar wg sync.WaitGroup\nfor _, t := range taches {\n\twg.Go(func() { executer(t) })\n}\nwg.Wait()\n```\n`Sleep` attendait trop ou pas assez ; le WaitGroup attend exactement la fin des tâches."
