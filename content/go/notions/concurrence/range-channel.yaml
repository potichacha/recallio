notion: range-channel
cards:
  - key: code-ch-make-chan-int-2
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 2)
      ch <- 1; ch <- 2
      close(ch)
      for v := range ch { fmt.Print(v, " ") }
      v, ok := <-ch
      fmt.Println(v, ok)
      ```
    answer: '`1 2 ` puis `0 false` : les valeurs restantes sont lues après la fermeture, puis la réception renvoie la valeur zéro et `ok = false`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tclose(ch)\n\tfor v := range ch {\n\t    fmt.Print(v, \" \")\n\t}\n\tv, ok := <-ch\n\tfmt.Println(v, ok)\n}\n"
      output: 1 2 0 false
