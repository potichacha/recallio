notion: range-channel
lesson: "**`for v := range ch`** reçoit les valeurs d'un channel une par une, et **s'arrête quand le channel est fermé** et vidé.\nC'est la façon idiomatique de consommer un flux :\n\n```go\nfunc produire(n int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)          // sans close, le range ne s'arrêterait jamais\n\t\tfor i := range n {\n\t\t\tch <- i\n\t\t}\n\t}()\n\treturn ch\n}\n\nfor v := range produire(3) {\n\tfmt.Println(v)               // 0, 1, 2, puis la boucle se termine\n}\n```\n\n- Le `range` sur un channel ne donne qu'**une** variable (la valeur), pas d'indice.\n- Il équivaut à une boucle `for { v, ok := <-ch; if !ok { break }; ... }`.\n- Si le channel n'est **jamais fermé**, la boucle attend indéfiniment : interblocage (si plus rien ne tourne) ou fuite.\n- Pour pouvoir arrêter la lecture avant la fin (un délai, une annulation), on remplace le `range` par une boucle avec\n  `select` sur le channel et `ctx.Done()`.\n- Renvoyer un **`<-chan T`** (en réception seule) dit à l'appelant qu'il ne doit ni envoyer ni fermer.\n\n**Piège classique** : oublier `close` dans le producteur. Le consommateur reçoit toutes les valeurs, puis reste bloqué\nsur le `range` ; le programme se termine sur « all goroutines are asleep - deadlock! ».\n\n**En entretien** : « range sur un channel reçoit jusqu'à la fermeture ; c'est au producteur de fermer ; pour pouvoir\nabandonner, un select avec le contexte. »"
cards:
  - key: code-ch-make-chan-int-2
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 2)
      ch <- 1; ch <- 2
      close(ch)
      for v := range ch { fmt.Print(v, " ") }
      v, ok := <-ch
      fmt.Println(v, ok)
      ```
    answer: '`1 2 ` puis `0 false` : les valeurs restantes sont lues après la fermeture, puis la réception renvoie la valeur zéro et `ok = false`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tclose(ch)\n\tfor v := range ch {\n\t    fmt.Print(v, \" \")\n\t}\n\tv, ok := <-ch\n\tfmt.Println(v, ok)\n}\n"
      output: 1 2 0 false
  - key: equivalent
    format: course
    question: À quelle boucle `for v := range ch` équivaut-elle ?
    answer: 'À `for { v, ok := <-ch; if !ok { break }; ... }` : elle reçoit jusqu''à ce que le channel soit fermé et vide.'
  - key: une-variable
    format: course
    question: Combien de variables donne un `range` sur un channel ?
    answer: Une seule, la valeur reçue ; il n'y a pas d'indice.
  - key: abandonner
    format: course
    question: Comment arrêter la lecture d'un channel avant sa fermeture ?
    answer: En remplaçant le `range` par une boucle `for` avec un `select` sur le channel et sur `ctx.Done()` (ou un channel de signal).
  - key: retour-recepteur
    format: course
    question: Pourquoi une fonction productrice renvoie-t-elle un `<-chan T` ?
    answer: 'Pour que l''appelant ne puisse que recevoir : ni envoyer ni fermer, le compilateur l''interdit.'
  - key: vf-fermeture
    format: true-false
    question: Un `range` sur un channel s'arrête quand le channel est fermé et que toutes ses valeurs ont été reçues.
    truth: true
    answer: Les valeurs déjà en tampon sont reçues avant la fin.
  - key: vf-sans-close
    format: true-false
    question: Sans `close`, un `range` sur un channel s'arrête quand le producteur a fini sa boucle.
    truth: false
    answer: Il attend indéfiniment une valeur qui ne viendra pas.
  - key: vf-indice
    format: true-false
    question: '`for i, v := range ch` donne l''indice de chaque valeur reçue.'
    truth: false
    answer: Le range sur un channel n'accepte qu'une variable.
  - key: vf-tampon
    format: true-false
    question: Les valeurs restées dans le tampon d'un channel fermé sont perdues pour le range.
    truth: false
    answer: Le range les reçoit toutes avant de s'arrêter.
  - key: qcm-arret
    format: multiple-choice
    question: Quand s'arrête `for v := range ch` ?
    choices:
      - text: Quand le channel est fermé et vide
        correct: true
      - text: Sur un `break` ou un `return` dans le corps
        correct: true
      - text: Quand plus aucune valeur n'est envoyée pendant une seconde
        correct: false
      - text: Quand le channel est plein
        correct: false
    answer: Sans fermeture ni sortie explicite, il attend.
  - key: qcm-producteur
    format: multiple-choice
    question: Qu'est-ce qu'un bon producteur pour un consommateur qui utilise range ?
    choices:
      - text: Une goroutine qui envoie puis `close` (souvent avec `defer close(ch)`)
        correct: true
      - text: Une fonction qui renvoie un `<-chan T`
        correct: true
      - text: Une goroutine qui envoie sans jamais fermer
        correct: false
      - text: Un consommateur qui ferme le channel
        correct: false
    answer: Le producteur ferme, et son type de retour empêche le consommateur de le faire.
  - key: qcm-sortie
    format: multiple-choice
    question: Le consommateur doit pouvoir s'arrêter sur un délai. Que faire ?
    choices:
      - text: 'Une boucle `for` avec `select { case v, ok := <-ch: ...; case <-ctx.Done(): return }`'
        correct: true
      - text: '`for v := range ch` avec un `time.Sleep`'
        correct: false
      - text: Fermer le channel côté consommateur
        correct: false
      - text: Rien, range gère les délais
        correct: false
    answer: Le producteur doit aussi surveiller le contexte pour ne pas fuir.
  - key: qcm-type-retour
    format: multiple-choice
    question: Quelle signature pour une fonction qui produit des lignes au fil de l'eau ?
    choices:
      - text: '`func Lignes(r io.Reader) <-chan string`'
        correct: true
      - text: '`func Lignes(r io.Reader) chan<- string`'
        correct: false
      - text: '`func Lignes(r io.Reader) []chan string`'
        correct: false
      - text: '`func Lignes(r io.Reader) *chan string`'
        correct: false
    answer: '`chan<-` serait un channel où l''appelant ne pourrait qu''envoyer. (Un itérateur `iter.Seq[string]` est aussi une bonne option.)'
  - key: trous-range
    format: fill-in
    question: "Complétez la consommation :\n```go\nfor v := ___ resultats {\n\tfmt.Println(v)\n}\n```"
    blanks:
      - - range
    answer: Le range reçoit jusqu'à la fermeture.
  - key: trous-close
    format: fill-in
    question: "Complétez le producteur :\n```go\ngo func() {\n\t___ close(ch)\n\tfor _, x := range donnees {\n\t\tch <- x\n\t}\n}()\n```"
    blanks:
      - - defer
    answer: '`defer close(ch)` ferme quoi qu''il arrive.'
  - key: trous-type
    format: fill-in
    question: |-
      Complétez le type de retour en réception seule :
      ```go
      func produire(n int) ___chan int { ... }
      ```
    blanks:
      - - <-
    answer: L'appelant ne peut que recevoir.
  - key: trous-equivalent
    format: fill-in
    question: "Complétez l'équivalent explicite du range :\n```go\nfor {\n\tv, ok := <-ch\n\tif ___ {\n\t\tbreak\n\t}\n\ttraiter(v)\n}\n```"
    blanks:
      - - '!ok'
    answer: '`ok` passe à false quand le channel est fermé et vide.'
  - key: code-produire
    format: code-output
    question: "```go\nfunc produire(n int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor i := range n {\n\t\t\tch <- i * i\n\t\t}\n\t}()\n\treturn ch\n}\n\nfor v := range produire(4) {\n\tfmt.Print(v, \" \")\n}\nfmt.Println()\n```"
    answer: '`0 1 4 9` : la boucle s''arrête à la fermeture.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc produire(n int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor i := range n {\n\t\t\tch <- i * i\n\t\t}\n\t}()\n\treturn ch\n}\n\nfunc main() {\n\tfor v := range produire(4) {\n\t\tfmt.Print(v, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 1 4 9
  - key: code-sans-close
    format: code-output
    question: "```go\nch := make(chan int)\ngo func() {\n\tfor i := range 2 {\n\t\tch <- i\n\t}\n}()\nfor v := range ch {\n\tfmt.Println(v)\n}\n```"
    answer: '`0`, `1`, puis « all goroutines are asleep - deadlock! » : sans fermeture, le range attend pour toujours.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tgo func() {\n\t\tfor i := range 2 {\n\t\t\tch <- i\n\t\t}\n\t}()\n\tfor v := range ch {\n\t\tfmt.Println(v)\n\t}\n}\n"
      output: |-
        0
        1
      panics: all goroutines are asleep
  - key: code-break
    format: code-output
    question: "```go\nch := make(chan int, 5)\nfor i := range 5 {\n\tch <- i\n}\nclose(ch)\nfor v := range ch {\n\tif v == 3 {\n\t\tbreak\n\t}\n\tfmt.Print(v)\n}\nfmt.Println(\" reste\", len(ch))\n```"
    answer: '`012 reste 1` : le break arrête la boucle, une valeur reste dans le tampon.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 5)\n\tfor i := range 5 {\n\t\tch <- i\n\t}\n\tclose(ch)\n\tfor v := range ch {\n\t\tif v == 3 {\n\t\t\tbreak\n\t\t}\n\t\tfmt.Print(v)\n\t}\n\tfmt.Println(\" reste\", len(ch))\n}\n"
      output: 012 reste 1
  - key: bug-sans-close
    format: bug-fix
    question: "Le programme s'arrête sur « all goroutines are asleep - deadlock! » après avoir affiché toutes les lignes :\n```go\ngo func() {\n\tfor _, l := range lignes {\n\t\tch <- l\n\t}\n}()\nfor l := range ch {\n\tfmt.Println(l)\n}\n```"
    answer: "```go\ngo func() {\n\tdefer close(ch)\n\tfor _, l := range lignes {\n\t\tch <- l\n\t}\n}()\n```\nLe producteur doit fermer le channel pour que le range se termine."
  - key: bug-abandon
    format: bug-fix
    question: "Le consommateur ne peut pas s'arrêter quand la requête est annulée :\n```go\nfor r := range resultats {\n\tenvoyer(w, r)\n}\n```"
    answer: "```go\nfor {\n\tselect {\n\tcase r, ok := <-resultats:\n\t\tif !ok {\n\t\t\treturn nil\n\t\t}\n\t\tenvoyer(w, r)\n\tcase <-ctx.Done():\n\t\treturn ctx.Err()\n\t}\n}\n```\nUn select avec le contexte permet d'abandonner ; le producteur doit lui aussi surveiller le contexte."
  - key: bug-type
    format: bug-fix
    question: |-
      Un appelant ferme par erreur le channel renvoyé, et le producteur panique :
      ```go
      func Evenements() chan Evenement { ... }
      ```
    answer: |-
      ```go
      func Evenements() <-chan Evenement { ... }
      ```
      En réception seule, le channel ne peut être ni fermé ni alimenté par l'appelant : le compilateur l'interdit.
  - key: bug-indice
    format: bug-fix
    question: "Le compilateur signale « range over ch permits only one iteration variable » :\n```go\nfor i, v := range ch {\n\tfmt.Println(i, v)\n}\n```"
    answer: "```go\ni := 0\nfor v := range ch {\n\tfmt.Println(i, v)\n\ti++\n}\n```\nUn range sur un channel ne donne que la valeur ; on compte soi-même si l'on a besoin d'un indice."
