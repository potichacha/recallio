notion: range-channel
lesson: "**`for v := range ch`** reçoit les valeurs d'un channel une par une, et **s'arrête quand le channel est fermé** et vidé.\nC'est la façon idiomatique de consommer un flux :\n\n```go\nfunc produire(n int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)          // sans close, le range ne s'arrêterait jamais\n\t\tfor i := range n {\n\t\t\tch <- i\n\t\t}\n\t}()\n\treturn ch\n}\n\nfor v := range produire(3) {\n\tfmt.Println(v)               // 0, 1, 2, puis la boucle se termine\n}\n```\n\n- Le `range` sur un channel ne donne qu'**une** variable (la valeur), pas d'indice.\n- Il équivaut à une boucle `for { v, ok := <-ch; if !ok { break }; ... }`.\n- Si le channel n'est **jamais fermé**, la boucle attend indéfiniment : interblocage (si plus rien ne tourne) ou fuite.\n- Pour pouvoir arrêter la lecture avant la fin (un délai, une annulation), on remplace le `range` par une boucle avec\n  `select` sur le channel et `ctx.Done()`.\n- Renvoyer un **`<-chan T`** (en réception seule) dit à l'appelant qu'il ne doit ni envoyer ni fermer.\n\n**Piège classique** : oublier `close` dans le producteur. Le consommateur reçoit toutes les valeurs, puis reste bloqué\nsur le `range` ; le programme se termine sur « all goroutines are asleep - deadlock! ».\n\n**En entretien** : « range sur un channel reçoit jusqu'à la fermeture ; c'est au producteur de fermer ; pour pouvoir\nabandonner, un select avec le contexte. »"
tour:
  - title: range sur un channel
    text: |-
      `for v := range ch` reçoit les valeurs d'un channel une à une, et s'arrête quand le channel est **fermé** et vide.
      C'est la façon la plus simple de consommer tout ce que produit une goroutine.

      Sans `close`, la boucle attendrait pour toujours une valeur de plus, et le runtime arrêterait le programme sur un
      interblocage.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func produit(n int, sortie chan int) {
          	for i := 1; i <= n; i++ {
          		sortie <- i * 10
          	}
          	close(sortie)
          }

          func main() {
          	valeurs := make(chan int)
          	go produit(3, valeurs)
          	for v := range valeurs {
          		fmt.Println(v)
          	}
          	fmt.Println("channel fermé")
          }
      output: |-
        10
        20
        30
        channel fermé
    task:
      instructions: |-
        Modifie `produit` pour qu'elle envoie les carrés de 1 à 4 : le programme doit afficher 1, 4, 9 et 16, une valeur
        par ligne, puis `channel fermé`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func produit(n int, sortie chan int) {
          	for i := 1; i <= n; i++ {
          		sortie <- i * 10
          	}
          	close(sortie)
          }

          func main() {
          	valeurs := make(chan int)
          	go produit(3, valeurs)
          	for v := range valeurs {
          		fmt.Println(v)
          	}
          	fmt.Println("channel fermé")
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func produit(n int, sortie chan int) {
          	for i := 1; i <= n; i++ {
          		sortie <- i * i
          	}
          	close(sortie)
          }

          func main() {
          	valeurs := make(chan int)
          	go produit(4, valeurs)
          	for v := range valeurs {
          		fmt.Println(v)
          	}
          	fmt.Println("channel fermé")
          }
      output: |-
        1
        4
        9
        16
        channel fermé
cards:
  - key: code-ch-make-chan-int-2
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 2)
      ch <- 1; ch <- 2
      close(ch)
      for v := range ch { fmt.Print(v, " ") }
      v, ok := <-ch
      fmt.Println(v, ok)
      ```
    choices:
      - {text: "`1 2 0 false`", correct: true}
      - {text: "`1 2 0 true`", correct: false}
      - {text: "`1 2 2 false`", correct: false}
      - {text: "`1 2`, puis une panic : receive from closed channel", correct: false}
    answer: "`1 2 0 false` : le `range` lit les valeurs restantes après la fermeture, puis s'arrête ; la réception suivante renvoie aussitôt la valeur zéro et `ok` à false, sans panic."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tclose(ch)\n\tfor v := range ch {\n\t    fmt.Print(v, \" \")\n\t}\n\tv, ok := <-ch\n\tfmt.Println(v, ok)\n}\n"
      output: 1 2 0 false
  - key: equivalent
    format: course
    question: "À quelle boucle `for v := range ch` équivaut-elle ?"
    choices:
      - {text: "`for { v, ok := <-ch; if !ok { break }; ... }`", correct: true}
      - {text: "`for { v := <-ch; if v == 0 { break }; ... }`", correct: false}
      - {text: "`for len(ch) > 0 { v := <-ch; ... }`", correct: false}
      - {text: "`for i := 0; i < cap(ch); i++ { v := <-ch; ... }`", correct: false}
    answer: "Elle reçoit jusqu'à ce que le channel soit fermé et vide, ce que dit `ok` à false. Une valeur zéro peut être une vraie valeur, et `len` ne dit rien des envois à venir."
  - key: une-variable
    format: course
    question: "Combien de variables d'itération donne un `range` sur un channel ?"
    choices:
      - {text: "Une seule, la valeur reçue : il n'y a pas d'indice", correct: true}
      - {text: "Deux, l'indice de réception et la valeur, comme sur une slice", correct: false}
      - {text: "Deux, la valeur et un booléen `ok` qui dit si le channel est ouvert", correct: false}
      - {text: "Aucune : on reçoit la valeur avec `<-ch` dans le corps de la boucle", correct: false}
    answer: "Une seule, la valeur reçue ; il n'y a pas d'indice, et la fermeture arrête la boucle au lieu de passer par un `ok`. Pour un indice, on compte soi-même."
  - key: abandonner
    format: course
    question: "Comment arrêter la lecture d'un channel avant sa fermeture, sur une annulation ?"
    choices:
      - {text: "Une boucle `for` avec un `select` sur le channel et sur `ctx.Done()`", correct: true}
      - {text: "Fermer le channel côté lecteur, ce qui termine aussitôt le `range`", correct: false}
      - {text: "Mettre le channel à nil dans le corps du `range`, pour l'interrompre", correct: false}
      - {text: "Tester `ctx.Err()` dans le corps du `range`, à chaque valeur reçue", correct: false}
    answer: "En remplaçant le `range` par une boucle `for` avec un `select` sur le channel et sur `ctx.Done()` (ou un channel de signal). Tester `ctx.Err()` dans le `range` n'agit qu'à l'arrivée d'une valeur, et fermer côté lecteur fait paniquer l'émetteur."
  - key: retour-recepteur
    format: course
    question: "Pourquoi une fonction productrice renvoie-t-elle un `<-chan T` ?"
    choices:
      - {text: "Pour que l'appelant ne puisse que recevoir : ni envoyer, ni fermer", correct: true}
      - {text: "Pour que l'appelant puisse fermer le channel quand il a fini de lire", correct: false}
      - {text: "Pour que le `range` de l'appelant s'arrête tout seul, sans fermeture", correct: false}
      - {text: "Pour que le channel soit bufferisé, ce qu'exige tout producteur", correct: false}
    answer: "Pour que l'appelant ne puisse que recevoir : ni envoyer ni fermer, le compilateur l'interdit. Le producteur reste seul à fermer, ce qui arrête le `range` de l'appelant."
  - key: vf-fermeture
    format: true-false
    question: Un `range` sur un channel s'arrête quand le channel est fermé et que toutes ses valeurs ont été reçues.
    truth: true
    answer: Les valeurs déjà en tampon sont reçues avant la fin.
  - key: vf-sans-close
    format: true-false
    question: Sans `close`, un `range` sur un channel s'arrête quand le producteur a fini sa boucle.
    truth: false
    answer: Il attend indéfiniment une valeur qui ne viendra pas.
  - key: vf-indice
    format: true-false
    question: '`for i, v := range ch` donne l''indice de chaque valeur reçue.'
    truth: false
    answer: Le range sur un channel n'accepte qu'une variable.
  - key: vf-tampon
    format: true-false
    question: Les valeurs restées dans le tampon d'un channel fermé sont perdues pour le range.
    truth: false
    answer: Le range les reçoit toutes avant de s'arrêter.
  - key: qcm-arret
    format: multiple-choice
    question: "Quand s'arrête `for v := range ch`, sans `break` ni `return` dans le corps ?"
    choices:
      - {text: "Quand le channel est fermé et vide", correct: true}
      - {text: "Quand plus rien n'arrive pendant une seconde", correct: false}
      - {text: "Quand le channel est plein", correct: false}
      - {text: "Quand le tampon est vide, même non fermé", correct: false}
    answer: "Seulement quand le channel est fermé et vide ; sinon, un `break` ou un `return` l'arrête. Sans fermeture ni sortie explicite, il attend pour toujours."
  - key: qcm-producteur
    format: multiple-choice
    question: "Qu'est-ce qu'un bon producteur pour un consommateur qui utilise `range` ?"
    choices:
      - {text: "Une goroutine qui envoie, puis ferme le channel (`defer close(ch)`)", correct: true}
      - {text: "Une goroutine qui envoie, sans jamais fermer le channel", correct: false}
      - {text: "Un producteur qui laisse le consommateur fermer le channel", correct: false}
      - {text: "Une goroutine qui ferme le channel avant d'y envoyer", correct: false}
    answer: "Le producteur ferme, et une fonction qui renvoie un `<-chan T` empêche le consommateur de le faire. Sans fermeture, le `range` attend pour toujours."
  - key: qcm-sortie
    format: multiple-choice
    question: Le consommateur doit pouvoir s'arrêter sur un délai. Que faire ?
    choices:
      - {text: "Une boucle `for` avec `select { case v, ok := <-ch: ...; case <-ctx.Done(): return }`", correct: true}
      - {text: "`for v := range ch`, avec un `time.Sleep` du délai voulu dans le corps", correct: false}
      - {text: "Fermer le channel côté consommateur quand le délai est dépassé", correct: false}
      - {text: "Rien : `range` s'arrête seul quand le contexte de l'appelant expire", correct: false}
    answer: Le producteur doit aussi surveiller le contexte pour ne pas fuir.
  - key: qcm-type-retour
    format: multiple-choice
    question: Quelle signature pour une fonction qui produit des lignes au fil de l'eau ?
    choices:
      - text: '`func Lignes(r io.Reader) <-chan string`'
        correct: true
      - text: '`func Lignes(r io.Reader) chan<- string`'
        correct: false
      - text: '`func Lignes(r io.Reader) []chan string`'
        correct: false
      - text: '`func Lignes(r io.Reader) *chan string`'
        correct: false
    answer: '`chan<-` serait un channel où l''appelant ne pourrait qu''envoyer. (Un itérateur `iter.Seq[string]` est aussi une bonne option.)'
  - key: trous-range
    format: fill-in
    question: |-
      Complète la consommation :
      ```go
      for v := ___ resultats {
      	fmt.Println(v)
      }
      ```
    blanks:
      - - range
    answer: Le range reçoit jusqu'à la fermeture.
  - key: trous-close
    format: fill-in
    question: |-
      Complète le producteur :
      ```go
      go func() {
      	___ close(ch)
      	for _, x := range donnees {
      		ch <- x
      	}
      }()
      ```
    blanks:
      - - defer
    answer: '`defer close(ch)` ferme quoi qu''il arrive.'
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type de retour en réception seule :
      ```go
      func produire(n int) ___chan int { ... }
      ```
    blanks:
      - - <-
    answer: L'appelant ne peut que recevoir.
  - key: trous-equivalent
    format: fill-in
    question: |-
      Complète l'équivalent explicite du range :
      ```go
      for {
      	v, ok := <-ch
      	if ___ {
      		break
      	}
      	traiter(v)
      }
      ```
    blanks:
      - - '!ok'
    answer: '`ok` passe à false quand le channel est fermé et vide.'
  - key: code-produire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func produire(n int) <-chan int {
      	ch := make(chan int)
      	go func() {
      		defer close(ch)
      		for i := range n {
      			ch <- i * i
      		}
      	}()
      	return ch
      }

      for v := range produire(4) {
      	fmt.Print(v, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`0 1 4 9`", correct: true}
      - {text: "`0 1 4 9 16`", correct: false}
      - {text: "`1 4 9 16`", correct: false}
      - {text: "`0 1 2 3`", correct: false}
    answer: "`0 1 4 9` : les carrés de 0 à 3 ; la boucle s'arrête à la fermeture faite par `defer close(ch)`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc produire(n int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor i := range n {\n\t\t\tch <- i * i\n\t\t}\n\t}()\n\treturn ch\n}\n\nfunc main() {\n\tfor v := range produire(4) {\n\t\tfmt.Print(v, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 1 4 9
  - key: code-sans-close
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int)
      go func() {
      	for i := range 2 {
      		ch <- i
      	}
      }()
      for v := range ch {
      	fmt.Println(v)
      }
      ```
    choices:
      - {text: "`0` et `1` sur deux lignes, puis une erreur fatale plus grave qu'une panic : all goroutines are asleep", correct: true}
      - {text: "`0` et `1` sur deux lignes, puis le programme se termine normalement, sans aucun message", correct: false}
      - {text: "`0` seulement, puis une erreur fatale : all goroutines are asleep - deadlock!", correct: false}
      - {text: "Rien : le `range` attend la fermeture du channel avant de livrer la moindre valeur", correct: false}
    answer: "`0`, `1`, puis « all goroutines are asleep - deadlock! » : sans fermeture, le `range` attend une troisième valeur pour toujours, et le producteur est déjà terminé."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tgo func() {\n\t\tfor i := range 2 {\n\t\t\tch <- i\n\t\t}\n\t}()\n\tfor v := range ch {\n\t\tfmt.Println(v)\n\t}\n}\n"
      output: |-
        0
        1
      panics: all goroutines are asleep
  - key: code-break
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 5)
      for i := range 5 {
      	ch <- i
      }
      close(ch)
      for v := range ch {
      	if v == 3 {
      		break
      	}
      	fmt.Print(v)
      }
      fmt.Println(" reste", len(ch))
      ```
    choices:
      - {text: "`012 reste 1`", correct: true}
      - {text: "`012 reste 2`", correct: false}
      - {text: "`0123 reste 1`", correct: false}
      - {text: "`012 reste 0`", correct: false}
    answer: "`012 reste 1` : le `break` arrête la boucle à la réception de 3, qui n'est pas affiché ; la valeur 4 reste dans le tampon."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 5)\n\tfor i := range 5 {\n\t\tch <- i\n\t}\n\tclose(ch)\n\tfor v := range ch {\n\t\tif v == 3 {\n\t\t\tbreak\n\t\t}\n\t\tfmt.Print(v)\n\t}\n\tfmt.Println(\" reste\", len(ch))\n}\n"
      output: 012 reste 1
  - key: bug-sans-close
    format: bug-fix
    question: |-
      Ce programme affiche toutes les lignes, puis s'arrête sur « all goroutines are asleep - deadlock! ». Quelle correction est la bonne ?
      ```go
      go func() {
      	for _, l := range lignes {
      		ch <- l
      	}
      }()
      for l := range ch {
      	fmt.Println(l)
      }
      ```
    choices:
      - {text: "Fermer `ch` dans le producteur, par `defer close(ch)`", correct: true}
      - {text: "Fermer `ch` dans le consommateur, après la boucle `range`", correct: false}
      - {text: "Donner à `ch` un tampon de `len(lignes)` places", correct: false}
      - {text: "Remplacer le `range` par une boucle `for` sur `<-ch`", correct: false}
    answer: "```go\ngo func() {\n\tdefer close(ch)\n\tfor _, l := range lignes {\n\t\tch <- l\n\t}\n}()\n```\nLe producteur doit fermer le channel pour que le range se termine."
  - key: bug-abandon
    format: bug-fix
    question: |-
      Ce consommateur ne peut pas s'arrêter quand la requête est annulée. Quelle correction est la bonne ?
      ```go
      for r := range resultats {
      	envoyer(w, r)
      }
      ```
    choices:
      - {text: "Une boucle `for` avec un `select` sur `resultats` (forme `r, ok`) et sur `ctx.Done()`", correct: true}
      - {text: "Tester `ctx.Err()` dans le corps du `range`, et sortir s'il ne vaut pas nil", correct: false}
      - {text: "Fermer `resultats` depuis le consommateur, dès que le contexte est annulé", correct: false}
      - {text: "Donner à `resultats` un tampon, pour que le `range` se termine plus vite", correct: false}
    answer: "```go\nfor {\n\tselect {\n\tcase r, ok := <-resultats:\n\t\tif !ok {\n\t\t\treturn nil\n\t\t}\n\t\tenvoyer(w, r)\n\tcase <-ctx.Done():\n\t\treturn ctx.Err()\n\t}\n}\n```\nUn select avec le contexte permet d'abandonner ; le producteur doit lui aussi surveiller le contexte."
  - key: bug-type
    format: bug-fix
    question: |-
      Un appelant ferme par erreur le channel renvoyé, et le producteur panique. Quelle correction est la bonne ?
      ```go
      func Evenements() chan Evenement { ... }
      ```
    choices:
      - {text: "Renvoyer un `<-chan Evenement`, que l'appelant ne peut pas fermer", correct: true}
      - {text: "Renvoyer un `chan<- Evenement`, que seul le producteur alimente", correct: false}
      - {text: "Renvoyer un `*chan Evenement`, pour protéger le channel", correct: false}
      - {text: "Protéger chaque envoi du producteur par un `recover`", correct: false}
    answer: |-
      ```go
      func Evenements() <-chan Evenement { ... }
      ```
      En réception seule, le channel ne peut être ni fermé ni alimenté par l'appelant : le compilateur l'interdit.
  - key: bug-indice
    format: bug-fix
    question: |-
      Le compilateur signale « range over ch permits only one iteration variable ». Quelle correction est la bonne ?
      ```go
      for i, v := range ch {
      	fmt.Println(i, v)
      }
      ```
    choices:
      - {text: "Garder une seule variable, et compter l'indice soi-même", correct: true}
      - {text: "Écrire `for v, i := range ch`, la valeur en premier", correct: false}
      - {text: "Écrire `for i, v := range len(ch)`, pour avoir l'indice", correct: false}
      - {text: "Écrire `for i, v := range <-ch`, qui donne l'indice", correct: false}
    answer: "```go\ni := 0\nfor v := range ch {\n\tfmt.Println(i, v)\n\ti++\n}\n```\nUn range sur un channel ne donne que la valeur ; on compte soi-même si l'on a besoin d'un indice."
