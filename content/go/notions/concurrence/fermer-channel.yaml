notion: fermer-channel
lesson: |-
  **`close(ch)`** signale qu'aucune valeur ne sera plus **envoyée** sur le channel. Les règles :

  | Opération | Channel ouvert | Channel **fermé** |
  |---|---|---|
  | `ch <- v` | envoie (ou bloque) | **panique** (« send on closed channel ») |
  | `v := <-ch` | reçoit (ou bloque) | reçoit les valeurs restantes, puis la **valeur zéro** immédiatement |
  | `v, ok := <-ch` | `ok` vaut true | `ok` vaut **false** une fois le tampon vide |
  | `close(ch)` | ferme | **panique** (« close of closed channel ») |
  | `range ch` | continue | se termine après les valeurs restantes |

  Les principes :
  - **c'est l'émetteur qui ferme**, jamais le récepteur : seul l'émetteur sait qu'il n'enverra plus rien ;
  - avec **plusieurs émetteurs**, aucun ne ferme seul : on attend leur fin (un `WaitGroup`) dans une goroutine qui ferme
    ensuite ;
  - **il n'est pas obligatoire de fermer** un channel : le ramasse-miettes le libère quand plus personne ne le
    référence. On ferme pour **signaler la fin** à un récepteur (`range`, `v, ok`) ;
  - fermer un `chan struct{}` est le moyen de **diffuser un signal** à tous les récepteurs à la fois (c'est ce que fait
    `ctx.Done()`).

  **Piège classique** : un récepteur qui ferme le channel « pour arrêter l'émetteur ». L'émetteur panique au prochain
  envoi ; on arrête un émetteur par un contexte ou un channel de signal séparé.

  **En entretien** : « L'émetteur ferme ; envoyer ou refermer panique ; recevoir sur un channel fermé donne la valeur zéro
  avec ok à false ; fermer n'est pas obligatoire mais sert à signaler la fin ou à diffuser un arrêt. »
tour:
  - title: Fermer un channel
    text: |-
      `close(ch)` signale qu'aucune valeur ne sera plus envoyée. C'est l'**émetteur** qui ferme, jamais le récepteur :
      envoyer sur un channel fermé provoque une panic.

      Recevoir sur un channel fermé ne bloque pas : on obtient d'abord les valeurs restées dans le tampon, puis la
      valeur zéro. La forme `v, ok := <-ch` les distingue : `ok` vaut `false` quand le channel est fermé et vide.

      Fermer n'est pas obligatoire : on ferme pour **prévenir** les récepteurs qu'il n'y aura plus rien.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	ch := make(chan int, 2)
          	ch <- 1
          	ch <- 2
          	close(ch)

          	for range 3 {
          		v, ok := <-ch
          		fmt.Println(v, ok)
          	}
          }
      output: |-
        1 true
        2 true
        0 false
cards:
  - key: passe-envoyant-channel-ferme
    format: course
    question: "Que se passe-t-il quand on envoie sur un channel fermé ?"
    choices:
      - {text: "Une panic : send on closed channel", correct: true}
      - {text: "L'envoi bloque pour toujours, comme sur un channel nil", correct: false}
      - {text: "La valeur est ignorée en silence, sans aucune erreur", correct: false}
      - {text: "Le channel se rouvre, et l'envoi réussit normalement", correct: false}
    answer: "Une panic « send on closed channel ». C'est pourquoi seul l'émetteur ferme : il sait qu'il n'enverra plus rien."
  - key: recevant-depuis-channel-ferme
    format: course
    question: "Que renvoie une réception sur un channel fermé ?"
    choices:
      - {text: "Les valeurs restantes, puis aussitôt la valeur zéro, avec `ok` à false", correct: true}
      - {text: "Une panic dès la première réception, même s'il reste des valeurs", correct: false}
      - {text: "Les valeurs restantes, puis la réception bloque pour toujours", correct: false}
      - {text: "La valeur zéro tout de suite : les valeurs restantes sont perdues", correct: false}
    answer: "Les valeurs restantes d'abord, puis la valeur zéro immédiatement, avec `ok` à false. La réception sur un channel fermé ne bloque ni ne panique."
  - key: doit-fermer-channel
    format: course
    question: "Qui doit fermer un channel ?"
    choices:
      - {text: "L'émetteur, quand il n'enverra plus rien ; jamais le récepteur", correct: true}
      - {text: "Le récepteur, quand il a lu tout ce qui l'intéresse", correct: false}
      - {text: "Le ramasse-miettes, quand plus personne ne le référence", correct: false}
      - {text: "Celui qui l'a créé avec `make`, quel que soit son rôle", correct: false}
    answer: "L'émetteur, jamais le récepteur : fermer veut dire « plus rien ne viendra », et un envoi après la fermeture panique. Le ramasse-miettes libère un channel inutilisé, mais ne le ferme pas."
  - key: toujours-fermer-channel
    format: course
    question: "Faut-il toujours fermer un channel ?"
    choices:
      - {text: "Non : seulement pour signaler la fin des valeurs, à un `range` ou à des récepteurs", correct: true}
      - {text: "Oui : un channel jamais fermé n'est jamais libéré par le ramasse-miettes", correct: false}
      - {text: "Oui, sinon `main` attend sa fermeture avant de pouvoir se terminer", correct: false}
      - {text: "Non : on ne ferme que les channels bufferisés, jamais les autres", correct: false}
    answer: "Non : on ferme seulement pour signaler la fin des valeurs (un `range`, des récepteurs en attente). Un channel inutilisé est ramassé par le GC, fermé ou non."
  - key: fermer-channel-avec-plusieurs-emetteurs
    format: course
    question: "Comment fermer un channel qui a plusieurs émetteurs ?"
    choices:
      - {text: "Attendre tous les émetteurs (`WaitGroup`), puis fermer depuis une seule goroutine", correct: true}
      - {text: "Chaque émetteur le ferme quand il a fini, protégé par un `recover`", correct: false}
      - {text: "Le dernier émetteur à finir le ferme, repéré par `len(ch) == 0`", correct: false}
      - {text: "Ne jamais le fermer : avec plusieurs émetteurs, `close` est interdit", correct: false}
    answer: "On attend tous les émetteurs (`WaitGroup`), puis une seule goroutine ferme. `len(ch) == 0` dit seulement que le tampon est vide, pas que les émetteurs ont fini."
  - key: code-close-ch-channel-deja-ferme
    format: code-output
    question: Que fait `close(ch)` sur un channel déjà fermé ?
    choices:
      - {text: "Une panic : close of closed channel", correct: true}
      - {text: "Rien : fermer deux fois est sans effet", correct: false}
      - {text: "Il rouvre le channel, qui reçoit de nouveau", correct: false}
      - {text: "Il bloque jusqu'à ce que le channel soit vidé", correct: false}
    answer: "Une panic « close of closed channel ». Envoyer sur un channel fermé panique aussi ; `sync.Once` évite une double fermeture."
    check:
      code: "package main\n\nfunc main() {\n\tch := make(chan int)\n\tclose(ch)\n\tclose(ch)\n}\n"
      panics: close of closed channel
  - key: vf-envoi-ferme
    format: true-false
    question: Envoyer sur un channel fermé provoque une panique.
    truth: true
    answer: « send on closed channel ».
  - key: vf-reception-fermee
    format: true-false
    question: Recevoir sur un channel fermé et vide bloque indéfiniment.
    truth: false
    answer: La réception renvoie immédiatement la valeur zéro, avec `ok` à false.
  - key: vf-recepteur-ferme
    format: true-false
    question: C'est au récepteur de fermer un channel quand il n'en veut plus.
    truth: false
    answer: C'est l'émetteur qui ferme ; un récepteur qui ferme fait paniquer l'émetteur.
  - key: vf-obligatoire
    format: true-false
    question: Un channel doit toujours être fermé, sinon il fuit.
    truth: false
    answer: Le GC libère un channel inaccessible ; on ferme pour signaler la fin aux récepteurs.
  - key: qcm-paniques
    format: multiple-choice
    question: "Lesquelles de ces opérations paniquent sur un channel fermé ?"
    choices:
      - text: '`ch <- 1`'
        correct: true
      - text: '`close(ch)`'
        correct: true
      - text: '`v := <-ch`'
        correct: false
      - text: '`for v := range ch`'
        correct: false
    answer: Recevoir est permis et ne bloque plus.
  - key: qcm-plusieurs
    format: multiple-choice
    question: Plusieurs goroutines envoient sur le même channel. Comment le fermer correctement ?
    choices:
      - text: Une goroutine attend la fin des émetteurs (WaitGroup) puis ferme
        correct: true
      - text: Le dernier émetteur à finir ferme, déterminé par un compteur atomique
        correct: false
      - text: Chaque émetteur ferme à la fin de son travail
        correct: false
      - text: Le récepteur ferme quand il a reçu assez de valeurs
        correct: false
    answer: Le compteur atomique est fragile ; le WaitGroup dédié est l'idiome.
  - key: qcm-ok
    format: multiple-choice
    question: Que valent `v` et `ok` dans `v, ok := <-ch` avec `ch` un `chan int` fermé et vide ?
    choices:
      - text: '`0` et `false`'
        correct: true
      - text: '`0` et `true`'
        correct: false
      - text: Une panique
        correct: false
      - text: La dernière valeur envoyée et `false`
        correct: false
    answer: La valeur zéro du type, et false.
  - key: qcm-diffuser
    format: multiple-choice
    question: "Comment prévenir dix goroutines en même temps qu'elles doivent s'arrêter ?"
    choices:
      - {text: "Fermer un `chan struct{}` qu'elles écoutent toutes", correct: true}
      - {text: "Envoyer une seule valeur sur un channel commun", correct: false}
      - {text: "Fermer le channel sur lequel elles envoient leurs résultats", correct: false}
      - {text: "Mettre à nil le channel qu'elles écoutent toutes", correct: false}
    answer: "Un envoi n'est reçu que par une goroutine ; une fermeture est vue par toutes. Annuler un contexte partagé marche aussi : c'est la même fermeture, derrière `ctx.Done()`."
  - key: trous-close
    format: fill-in
    question: |-
      Complète pour signaler la fin des envois :
      ```go
      go func() {
      	defer ___(sortie)
      	for _, l := range lignes {
      		sortie <- l
      	}
      }()
      ```
    blanks:
      - - close
    answer: L'émetteur ferme quand il a fini.
  - key: trous-ok
    format: fill-in
    question: |-
      Complète pour savoir si le channel est fermé :
      ```go
      v, ___ := <-ch
      if !ok {
      	return
      }
      ```
    blanks:
      - - ok
    answer: '`ok` vaut false quand le channel est fermé et vide.'
  - key: trous-plusieurs
    format: fill-in
    question: |-
      Complète la fermeture après plusieurs émetteurs :
      ```go
      go func() {
      	wg.___()
      	close(resultats)
      }()
      ```
    blanks:
      - - Wait
    answer: On ferme une fois que tous les émetteurs ont terminé.
  - key: trous-signal
    format: fill-in
    question: |-
      Complète pour diffuser l'arrêt à tous les workers :
      ```go
      stop := make(chan struct{})
      // ...
      ___(stop)
      ```
    blanks:
      - - close
    answer: Tous les récepteurs voient la fermeture.
  - key: code-zero
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 2)
      ch <- 7
      close(ch)
      a, ok1 := <-ch
      b, ok2 := <-ch
      fmt.Println(a, ok1, b, ok2)
      ```
    choices:
      - {text: "`7 true 0 false`", correct: true}
      - {text: "`7 true 7 false`", correct: false}
      - {text: "`7 false 0 false`", correct: false}
      - {text: "`0 false 0 false`", correct: false}
    answer: "`7 true 0 false` : la valeur restante d'abord, avec `ok` à true, puis la valeur zéro avec `ok` à false. La fermeture ne perd pas les valeurs du tampon."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 7\n\tclose(ch)\n\ta, ok1 := <-ch\n\tb, ok2 := <-ch\n\tfmt.Println(a, ok1, b, ok2)\n}\n"
      output: 7 true 0 false
  - key: code-envoi-ferme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 1)
      close(ch)
      fmt.Println("fermé")
      ch <- 1
      ```
    choices:
      - {text: "`fermé`, puis une panic : send on closed channel", correct: true}
      - {text: "`fermé`, puis rien : l'envoi est ignoré sans bruit", correct: false}
      - {text: "`fermé`, puis le programme reste bloqué sur l'envoi", correct: false}
      - {text: "Une panic dès `close(ch)`, avant tout affichage", correct: false}
    answer: "`fermé`, puis une panic « send on closed channel » : fermer est permis, mais tout envoi qui suit panique, même s'il reste de la place dans le tampon."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 1)\n\tclose(ch)\n\tfmt.Println(\"fermé\")\n\tch <- 1\n}\n"
      output: fermé
      panics: send on closed channel
  - key: code-diffusion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      stop := make(chan struct{})
      var wg sync.WaitGroup
      var arretes atomic.Int32
      for range 5 {
      	wg.Go(func() {
      		<-stop
      		arretes.Add(1)
      	})
      }
      close(stop)
      wg.Wait()
      fmt.Println(arretes.Load())
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien : `Wait` attend pour toujours", correct: false}
    answer: "`5` : une seule fermeture réveille tous les récepteurs, alors qu'un envoi n'en aurait réveillé qu'un."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tstop := make(chan struct{})\n\tvar wg sync.WaitGroup\n\tvar arretes atomic.Int32\n\tfor range 5 {\n\t\twg.Go(func() {\n\t\t\t<-stop\n\t\t\tarretes.Add(1)\n\t\t})\n\t}\n\tclose(stop)\n\twg.Wait()\n\tfmt.Println(arretes.Load())\n}\n"
      output: '5'
  - key: bug-recepteur
    format: bug-fix
    question: |-
      Le producteur panique avec « send on closed channel » quand le consommateur veut l'arrêter. Quelle correction est la bonne ?
      ```go
      for v := range donnees {
      	if v.Fin {
      		close(donnees) // le consommateur veut arrêter le producteur
      		break
      	}
      	traiter(v)
      }
      ```
    choices:
      - {text: "Annuler un contexte que le producteur surveille ; lui seul ferme `donnees`", correct: true}
      - {text: "Entourer l'envoi du producteur d'un `recover`, pour ignorer la panic", correct: false}
      - {text: "Vider `donnees` avant de le fermer, pour qu'aucun envoi n'y reste", correct: false}
      - {text: "Fermer `donnees` dans un `sync.Once`, pour ne le fermer qu'une fois", correct: false}
    answer: "```go\nctx, cancel := context.WithCancel(ctx)\ndefer cancel()\n// le producteur surveille ctx.Done() et ferme lui-même donnees\nfor v := range donnees {\n\tif v.Fin {\n\t\tcancel()\n\t\tbreak\n\t}\n\ttraiter(v)\n}\n```\nSeul l'émetteur ferme son channel ; le consommateur l'arrête par un contexte (ou un channel de signal séparé)."
  - key: bug-double-close
    format: bug-fix
    question: |-
      Le service panique avec « close of closed channel » quand `Arreter` est appelé deux fois. Quelle correction est la bonne ?
      ```go
      func (s *Service) Arreter() { close(s.stop) }
      ```
    choices:
      - {text: "Fermer dans un `sync.Once`, qui garantit une seule fermeture", correct: true}
      - {text: "Tester `if s.stop != nil` avant de fermer le channel", correct: false}
      - {text: "Lire `<-s.stop` avant de fermer, pour voir s'il est ouvert", correct: false}
      - {text: "Mettre `s.stop = nil` juste après l'avoir fermé", correct: false}
    answer: "```go\ntype Service struct {\n\tstop     chan struct{}\n\tstopOnce sync.Once\n}\n\nfunc (s *Service) Arreter() { s.stopOnce.Do(func() { close(s.stop) }) }\n```\n`sync.Once` garantit une seule fermeture, même avec des appels concurrents."
  - key: bug-plusieurs
    format: bug-fix
    question: |-
      Ce programme panique de temps en temps avec « send on closed channel ». Quelle correction est la bonne ?
      ```go
      for _, u := range urls {
      	go func() {
      		resultats <- telecharger(u)
      		close(resultats)
      	}()
      }
      ```
    choices:
      - {text: "Fermer `resultats` une seule fois, dans une goroutine qui attend le `WaitGroup` des émetteurs", correct: true}
      - {text: "Fermer `resultats` seulement si `len(resultats) == 0`, juste après chaque envoi", correct: false}
      - {text: "Entourer chaque envoi d'un `recover`, pour ignorer les envois qui suivent la fermeture", correct: false}
      - {text: "Donner à `resultats` une capacité de `len(urls)`, pour que tous les envois passent", correct: false}
    answer: "```go\nvar wg sync.WaitGroup\nfor _, u := range urls {\n\twg.Go(func() { resultats <- telecharger(u) })\n}\ngo func() {\n\twg.Wait()\n\tclose(resultats)\n}()\n```\nLe premier émetteur à finir fermait le channel des autres ; on ferme une seule fois, après tous les émetteurs."
  - key: bug-ok
    format: bug-fix
    question: |-
      Cette boucle tourne sans fin en traitant des zéros après la fin du producteur. Quelle correction est la bonne ?
      ```go
      for {
      	v := <-mesures
      	enregistrer(v)
      }
      ```
    choices:
      - {text: "Lire avec `for v := range mesures`, qui s'arrête à la fermeture", correct: true}
      - {text: "Ignorer les valeurs nulles avec `if v == 0 { continue }`", correct: false}
      - {text: "Mettre `mesures` à nil dès la première valeur zéro reçue", correct: false}
      - {text: "Ajouter un court `time.Sleep` à chaque tour de la boucle", correct: false}
    answer: "```go\nfor v := range mesures {\n\tenregistrer(v)\n}\n```\nSur un channel fermé, la réception renvoie la valeur zéro immédiatement : `range` (ou la forme `v, ok`) détecte\nla fermeture."
