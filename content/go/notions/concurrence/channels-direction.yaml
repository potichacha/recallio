notion: channels-direction
lesson: "Un type de channel peut être **orienté** :\n\n```go\nchan T     // envoyer et recevoir\nchan<- T   // envoyer seulement\n<-chan T   // recevoir seulement\n```\n\nUn `chan T` se **convertit implicitement** en l'un ou l'autre, mais pas l'inverse. On s'en sert dans les **signatures**,\npour dire et faire vérifier par le compilateur qui fait quoi :\n\n```go\nfunc producteur(sortie chan<- int) {   // ne peut qu'envoyer (et fermer)\n\tdefer close(sortie)\n\tsortie <- 1\n}\n\nfunc consommateur(entree <-chan int) { // ne peut que recevoir\n\tfor v := range entree {\n\t\tfmt.Println(v)\n\t}\n}\n\nch := make(chan int)\ngo producteur(ch)\nconsommateur(ch)\n```\n\n- On ne peut **pas fermer** un `<-chan T` : seul celui qui envoie ferme, et le type l'impose.\n- Une fonction qui **crée et alimente** un channel renvoie un `<-chan T` (comme `time.After`, `ctx.Done()`).\n- Les directions documentent le rôle de chaque goroutine dans un pipeline, et transforment une erreur de conception en\n  **erreur de compilation**.\n\n**Piège classique** : passer un `chan T` bidirectionnel partout « pour être tranquille ». Rien n'empêche alors un\nconsommateur de fermer le channel ou d'y écrire par erreur.\n\n**En entretien** : « chan<- T pour envoyer, <-chan T pour recevoir ; un chan T s'y convertit implicitement ; dans les\nsignatures, elles documentent les rôles et le compilateur les vérifie ; on ne ferme pas un <-chan. »"
tour:
  - title: Les channels orientés
    text: |-
      Un paramètre peut restreindre un channel à un sens : `chan<- string` ne sert qu'à **envoyer**, `<-chan
      string` qu'à **recevoir**. Un `chan string` se convertit tout seul vers l'un ou l'autre.

      Le compilateur refuse alors toute opération dans le mauvais sens : la signature documente qui envoie, qui reçoit,
      et donc qui doit fermer.

      Essaie : ajoute `entree <- "quatre"` dans `affiche`, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func genere(sortie chan<- string) {
          	for _, mot := range []string{"un", "deux", "trois"} {
          		sortie <- mot
          	}
          	close(sortie)
          }

          func affiche(entree <-chan string, fini chan<- bool) {
          	for mot := range entree {
          		fmt.Println(mot)
          	}
          	fini <- true
          }

          func main() {
          	mots := make(chan string)
          	fini := make(chan bool)
          	go genere(mots)
          	go affiche(mots, fini)
          	<-fini
          }
      output: |-
        un
        deux
        trois
cards:
  - key: servent-directions-chan-chan
    format: course
    question: "À quoi servent les directions `chan<-` et `<-chan` dans un type de channel ?"
    choices:
      - {text: "À restreindre un channel à l'envoi ou à la réception, ce que vérifie le compilateur", correct: true}
      - {text: "À choisir le sens de copie des valeurs, du tampon vers le récepteur ou l'inverse", correct: false}
      - {text: "À rendre le channel plus rapide, en évitant un verrou dans un des deux sens", correct: false}
      - {text: "À indiquer qui doit fermer le channel, ce que vérifie le runtime à l'exécution", correct: false}
    answer: "Elles restreignent un channel à l'envoi (`chan<-`) ou à la réception (`<-chan`), et le compilateur refuse toute autre opération. Elles documentent les rôles sans rien coûter à l'exécution."
  - key: conversion
    format: course
    question: "Un `chan int` peut-il être passé à une fonction qui attend un `<-chan int` ?"
    choices:
      - {text: "Oui, il devient implicitement orienté ; l'inverse est impossible", correct: true}
      - {text: "Oui, et l'inverse aussi : un `<-chan int` se passe à un `chan int`", correct: false}
      - {text: "Non : il faut d'abord écrire la conversion `(<-chan int)(ch)`", correct: false}
      - {text: "Non : un channel garde pour toujours la direction donnée par `make`", correct: false}
    answer: "Oui : un channel bidirectionnel se convertit implicitement en `<-chan` comme en `chan<-`. L'inverse est impossible : on ne regagne pas une direction perdue."
  - key: fermer
    format: course
    question: "Peut-on fermer un channel de type `<-chan T` ?"
    choices:
      - {text: "Non : ça ne compile pas ; seul un côté qui peut envoyer peut fermer", correct: true}
      - {text: "Oui : fermer, c'est dire qu'on ne lira plus, ce que fait le récepteur", correct: false}
      - {text: "Oui, mais seulement s'il est vide, sinon le runtime déclenche une panic", correct: false}
      - {text: "Oui, mais l'émetteur panique alors au premier envoi qui suit la fermeture", correct: false}
    answer: "Non : « invalid operation: cannot close receive-only channel ». Fermer signifie « je n'enverrai plus » : c'est le rôle de l'émetteur, jamais du récepteur."
  - key: stdlib
    format: course
    question: "Laquelle de ces fonctions de la bibliothèque standard renvoie un channel en réception seule ?"
    choices:
      - {text: "`time.After`, qui renvoie un `<-chan time.Time`", correct: true}
      - {text: "`sync.WaitGroup.Wait`, qui renvoie un `<-chan struct{}`", correct: false}
      - {text: "`os.ReadFile`, qui renvoie un `<-chan []byte` de blocs lus", correct: false}
      - {text: "`make`, qui renvoie un `<-chan T` quand on lui donne une capacité", correct: false}
    answer: "`time.After`, comme `time.Tick`, `ctx.Done()` et le champ `time.Timer.C` : l'appelant ne fait qu'attendre. `Wait` ne renvoie rien, et `make` renvoie un channel bidirectionnel."
  - key: vf-recevoir
    format: true-false
    question: On peut recevoir sur un `chan<- int`.
    truth: false
    answer: C'est un channel en envoi seulement.
  - key: vf-implicite
    format: true-false
    question: Un `<-chan int` se convertit en `chan int`.
    truth: false
    answer: La conversion ne va que du bidirectionnel vers l'orienté.
  - key: vf-documente
    format: true-false
    question: Les directions de channel documentent le rôle de chaque fonction et sont vérifiées par le compilateur.
    truth: true
    answer: Une écriture dans un channel en réception seule ne compile pas.
  - key: vf-make
    format: true-false
    question: '`make(<-chan int)` crée un channel utile en pratique.'
    truth: false
    answer: Personne ne pourrait y envoyer ; on crée un `chan int` et on le convertit dans les signatures.
  - key: qcm-signatures
    format: multiple-choice
    question: "Laquelle de ces signatures est cohérente avec ce que fait la fonction ?"
    choices:
      - {text: "`func producteur(sortie chan<- Ligne)`, qui envoie puis ferme", correct: true}
      - {text: "`func consommateur(entree chan<- Ligne)`, qui reçoit", correct: false}
      - {text: "`func producteur(sortie <-chan Ligne)`, qui envoie puis ferme", correct: false}
      - {text: "`func consommateur(entree <-chan Ligne)`, qui ferme à la fin", correct: false}
    answer: "La flèche indique le sens du flux pour la fonction : le producteur envoie et ferme un `chan<-`. `func consommateur(entree <-chan Ligne)` est cohérent s'il ne fait que recevoir, mais il ne peut pas fermer."
  - key: qcm-erreurs
    format: multiple-choice
    question: "Avec `func f(ch <-chan int)`, lesquelles de ces instructions ne compilent pas dans `f` ?"
    choices:
      - text: '`ch <- 1`'
        correct: true
      - text: '`close(ch)`'
        correct: true
      - text: '`v := <-ch`'
        correct: false
      - text: '`for v := range ch {}`'
        correct: false
    answer: Recevoir est la seule opération permise.
  - key: qcm-retour
    format: multiple-choice
    question: "Pourquoi `time.After` renvoie-t-il un `<-chan time.Time` plutôt qu'un `chan time.Time` ?"
    choices:
      - {text: "Pour que l'appelant ne puisse que recevoir : seul le runtime envoie", correct: true}
      - {text: "Pour que l'appelant puisse le fermer s'il n'attend plus l'instant", correct: false}
      - {text: "Pour économiser la mémoire d'un channel dans les deux sens", correct: false}
      - {text: "Pour que plusieurs appelants reçoivent tous le même instant", correct: false}
    answer: "Le type protège le contrat : l'appelant ne fait que recevoir l'instant, et seul le runtime envoie sur ce channel. Un `<-chan` ne peut justement pas être fermé."
  - key: qcm-conversion
    format: multiple-choice
    question: "Avec `ch := make(chan int)`, lequel de ces passages de channel compile ?"
    choices:
      - {text: "`ch` à `func producteur(chan<- int)`", correct: true}
      - {text: "Un `<-chan int` à `func f(chan int)`", correct: false}
      - {text: "Un `chan<- int` à `func g(<-chan int)`", correct: false}
      - {text: "Un `<-chan int` à `func h(chan<- int)`", correct: false}
    answer: "Seul le bidirectionnel se convertit en orienté : `ch` passe aussi à `func consommateur(<-chan int)`. Un channel orienté ne change jamais de direction."
  - key: trous-envoi
    format: fill-in
    question: |-
      Complète la direction du producteur :
      ```go
      func producteur(sortie ___ int) {
      	defer close(sortie)
      	sortie <- 1
      }
      ```
    blanks:
      - - chan<-
    answer: En envoi seulement.
  - key: trous-reception
    format: fill-in
    question: |-
      Complète la direction du consommateur :
      ```go
      func consommateur(entree ___ int) {
      	for v := range entree {
      		fmt.Println(v)
      	}
      }
      ```
    blanks:
      - - <-chan
    answer: En réception seulement.
  - key: trous-retour
    format: fill-in
    question: |-
      Complète le type de retour :
      ```go
      func Tick(d time.Duration) ___ time.Time { ... }
      ```
    blanks:
      - - <-chan
    answer: L'appelant ne fait que recevoir.
  - key: trous-done
    format: fill-in
    question: |-
      Complète le type de `ctx.Done()` :
      ```go
      var done ___struct{} = ctx.Done()
      ```
    blanks:
      - - '<-chan '
    answer: '`Done` renvoie un channel en réception seule.'
  - key: bug-consommateur-ferme
    format: bug-fix
    question: "Le consommateur ferme le channel par erreur, et le producteur panique. Comment l'empêcher à la compilation ?\n```go\nfunc consommer(ch chan Commande) {\n\tfor c := range ch {\n\t\ttraiter(c)\n\t}\n\tclose(ch)\n}\n```"
    choices:
      - {text: "Déclarer le paramètre `ch <-chan Commande`, et retirer le `close`", correct: true}
      - {text: "Entourer le `close` d'un `recover`, pour éviter la panic du producteur", correct: false}
      - {text: "Fermer le channel dans un `sync.Once`, pour qu'il ne le soit qu'une fois", correct: false}
      - {text: "Déclarer le paramètre `ch chan<- Commande`, en envoi seulement", correct: false}
    answer: "```go\nfunc consommer(ch <-chan Commande) {\n\tfor c := range ch {\n\t\ttraiter(c)\n\t}\n}\n```\nEn réception seule, `close(ch)` ne compile plus."
  - key: bug-mauvais-sens
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: cannot receive from send-only channel ». Quelle correction est la bonne ?
      ```go
      func lire(ch chan<- string) {
      	for s := range ch {
      		fmt.Println(s)
      	}
      }
      ```
    choices:
      - {text: "Déclarer le paramètre `ch <-chan string`, en réception seule", correct: true}
      - {text: "Remplacer le `range` par une boucle `for` qui fait `s := <-ch`", correct: false}
      - {text: "Convertir dans la boucle : `for s := range (chan string)(ch)`", correct: false}
      - {text: "Passer un pointeur `&ch`, et lire avec `for s := range *ch`", correct: false}
    answer: "```go\nfunc lire(ch <-chan string) {\n\tfor s := range ch {\n\t\tfmt.Println(s)\n\t}\n}\n```\nLa flèche était dans le mauvais sens : `<-chan` pour recevoir."
  - key: bug-retour
    format: bug-fix
    question: |-
      En revue, comment protéger ce générateur contre les mauvais usages de l'appelant ?
      ```go
      func Nombres(n int) chan int {
      	ch := make(chan int)
      	go func() {
      		defer close(ch)
      		for i := range n {
      			ch <- i
      		}
      	}()
      	return ch
      }
      ```
    choices:
      - {text: "Renvoyer un `<-chan int` : l'appelant ne peut ni envoyer ni fermer", correct: true}
      - {text: "Renvoyer un `chan<- int`, pour que seul le générateur puisse envoyer", correct: false}
      - {text: "Renvoyer un `*chan int`, pour que l'appelant ne puisse pas le copier", correct: false}
      - {text: "Garder `chan int`, et documenter qu'il ne faut pas fermer le channel", correct: false}
    answer: |-
      ```go
      func Nombres(n int) <-chan int { ... }
      ```
      Le channel renvoyé en réception seule ne peut être ni alimenté ni fermé par l'appelant.
  - key: bug-pipeline
    format: bug-fix
    question: |-
      Dans ce pipeline, chaque étape reçoit des channels bidirectionnels et l'on ne sait plus qui ferme quoi. Comment rendre les rôles explicites ?
      ```go
      func filtrer(entree chan int, sortie chan int) { ... }
      ```
    choices:
      - {text: "`entree <-chan int` et `sortie chan<- int`, et l'étape ferme sa sortie", correct: true}
      - {text: "`entree chan<- int` et `sortie <-chan int`, et l'étape ferme sa sortie", correct: false}
      - {text: "Garder `chan int`, et fermer l'entrée comme la sortie à la fin de l'étape", correct: false}
      - {text: "Passer des `*chan int`, pour que chaque étape possède ses deux channels", correct: false}
    answer: "```go\nfunc filtrer(entree <-chan int, sortie chan<- int) {\n\tdefer close(sortie)\n\tfor v := range entree {\n\t\tif v%2 == 0 {\n\t\t\tsortie <- v\n\t\t}\n\t}\n}\n```\nChaque étape reçoit sur un `<-chan`, envoie et ferme son `chan<-` : le compilateur vérifie les rôles."
