notion: channels-direction
lesson: "Un type de channel peut être **orienté** :\n\n```go\nchan T     // envoyer et recevoir\nchan<- T   // envoyer seulement\n<-chan T   // recevoir seulement\n```\n\nUn `chan T` se **convertit implicitement** en l'un ou l'autre, mais pas l'inverse. On s'en sert dans les **signatures**,\npour dire et faire vérifier par le compilateur qui fait quoi :\n\n```go\nfunc producteur(sortie chan<- int) {   // ne peut qu'envoyer (et fermer)\n\tdefer close(sortie)\n\tsortie <- 1\n}\n\nfunc consommateur(entree <-chan int) { // ne peut que recevoir\n\tfor v := range entree {\n\t\tfmt.Println(v)\n\t}\n}\n\nch := make(chan int)\ngo producteur(ch)\nconsommateur(ch)\n```\n\n- On ne peut **pas fermer** un `<-chan T` : seul celui qui envoie ferme, et le type l'impose.\n- Une fonction qui **crée et alimente** un channel renvoie un `<-chan T` (comme `time.After`, `ctx.Done()`).\n- Les directions documentent le rôle de chaque goroutine dans un pipeline, et transforment une erreur de conception en\n  **erreur de compilation**.\n\n**Piège classique** : passer un `chan T` bidirectionnel partout « pour être tranquille ». Rien n'empêche alors un\nconsommateur de fermer le channel ou d'y écrire par erreur.\n\n**En entretien** : « chan<- T pour envoyer, <-chan T pour recevoir ; un chan T s'y convertit implicitement ; dans les\nsignatures, elles documentent les rôles et le compilateur les vérifie ; on ne ferme pas un <-chan. »"
cards:
  - key: servent-directions-chan-chan
    format: course
    question: À quoi servent les directions `chan<-` et `<-chan` ?
    answer: Restreindre un channel à l'envoi ou à la réception, vérifié par le compilateur.
  - key: conversion
    format: course
    question: Un `chan int` peut-il être passé à une fonction qui attend un `<-chan int` ?
    answer: Oui, la conversion d'un channel bidirectionnel vers un channel orienté est implicite ; l'inverse est impossible.
  - key: fermer
    format: course
    question: Peut-on fermer un `<-chan T` ?
    answer: 'Non : « invalid operation: cannot close receive-only channel » ; seul celui qui peut envoyer peut fermer.'
  - key: stdlib
    format: course
    question: Citez des fonctions de la bibliothèque standard qui renvoient un channel en réception seule.
    answer: '`time.After`, `time.Tick`, `ctx.Done()` et le champ `time.Timer.C` : l''appelant ne fait qu''attendre.'
  - key: vf-recevoir
    format: true-false
    question: On peut recevoir sur un `chan<- int`.
    truth: false
    answer: C'est un channel en envoi seulement.
  - key: vf-implicite
    format: true-false
    question: Un `<-chan int` se convertit en `chan int`.
    truth: false
    answer: La conversion ne va que du bidirectionnel vers l'orienté.
  - key: vf-documente
    format: true-false
    question: Les directions de channel documentent le rôle de chaque fonction et sont vérifiées par le compilateur.
    truth: true
    answer: Une écriture dans un channel en réception seule ne compile pas.
  - key: vf-make
    format: true-false
    question: '`make(<-chan int)` crée un channel utile en pratique.'
    truth: false
    answer: Personne ne pourrait y envoyer ; on crée un `chan int` et on le convertit dans les signatures.
  - key: qcm-signatures
    format: multiple-choice
    question: Quelles signatures sont cohérentes ?
    choices:
      - text: '`func producteur(sortie chan<- Ligne)` qui envoie et ferme'
        correct: true
      - text: '`func consommateur(entree <-chan Ligne)` qui reçoit'
        correct: true
      - text: '`func consommateur(entree chan<- Ligne)` qui reçoit'
        correct: false
      - text: '`func producteur(sortie <-chan Ligne)` qui ferme'
        correct: false
    answer: La flèche indique le sens du flux pour la fonction.
  - key: qcm-erreurs
    format: multiple-choice
    question: Avec `func f(ch <-chan int)`, qu'est-ce qui ne compile pas dans `f` ?
    choices:
      - text: '`ch <- 1`'
        correct: true
      - text: '`close(ch)`'
        correct: true
      - text: '`v := <-ch`'
        correct: false
      - text: '`for v := range ch {}`'
        correct: false
    answer: Recevoir est la seule opération permise.
  - key: qcm-retour
    format: multiple-choice
    question: Pourquoi `time.After` renvoie-t-il un `<-chan time.Time` ?
    choices:
      - text: L'appelant ne doit que recevoir l'instant
        correct: true
      - text: Seul le runtime doit envoyer sur ce channel
        correct: true
      - text: Pour que l'appelant puisse le fermer
        correct: false
      - text: Pour économiser de la mémoire
        correct: false
    answer: Le type protège le contrat.
  - key: qcm-conversion
    format: multiple-choice
    question: Avec `ch := make(chan int)`, quels appels compilent ?
    choices:
      - text: '`producteur(ch)` avec `func producteur(chan<- int)`'
        correct: true
      - text: '`consommateur(ch)` avec `func consommateur(<-chan int)`'
        correct: true
      - text: Passer un `<-chan int` à `func f(chan int)`
        correct: false
      - text: Passer un `chan<- int` à `func g(<-chan int)`
        correct: false
    answer: Seul le bidirectionnel se convertit.
  - key: trous-envoi
    format: fill-in
    question: "Complétez la direction du producteur :\n```go\nfunc producteur(sortie ___ int) {\n\tdefer close(sortie)\n\tsortie <- 1\n}\n```"
    blanks:
      - - chan<-
    answer: En envoi seulement.
  - key: trous-reception
    format: fill-in
    question: "Complétez la direction du consommateur :\n```go\nfunc consommateur(entree ___ int) {\n\tfor v := range entree {\n\t\tfmt.Println(v)\n\t}\n}\n```"
    blanks:
      - - <-chan
    answer: En réception seulement.
  - key: trous-retour
    format: fill-in
    question: |-
      Complétez le type de retour :
      ```go
      func Tick(d time.Duration) ___ time.Time { ... }
      ```
    blanks:
      - - <-chan
    answer: L'appelant ne fait que recevoir.
  - key: trous-done
    format: fill-in
    question: |-
      Complétez le type de `ctx.Done()` :
      ```go
      var done ___struct{} = ctx.Done()
      ```
    blanks:
      - - '<-chan '
    answer: '`Done` renvoie un channel en réception seule.'
  - key: bug-consommateur-ferme
    format: bug-fix
    question: "Le consommateur ferme le channel par erreur, et le producteur panique. Comment l'empêcher à la compilation ?\n```go\nfunc consommer(ch chan Commande) {\n\tfor c := range ch {\n\t\ttraiter(c)\n\t}\n\tclose(ch)\n}\n```"
    answer: "```go\nfunc consommer(ch <-chan Commande) {\n\tfor c := range ch {\n\t\ttraiter(c)\n\t}\n}\n```\nEn réception seule, `close(ch)` ne compile plus."
  - key: bug-mauvais-sens
    format: bug-fix
    question: "Le compilateur signale « invalid operation: cannot receive from send-only channel » :\n```go\nfunc lire(ch chan<- string) {\n\tfor s := range ch {\n\t\tfmt.Println(s)\n\t}\n}\n```"
    answer: "```go\nfunc lire(ch <-chan string) {\n\tfor s := range ch {\n\t\tfmt.Println(s)\n\t}\n}\n```\nLa flèche était dans le mauvais sens : `<-chan` pour recevoir."
  - key: bug-retour
    format: bug-fix
    question: "En revue, protégez ce générateur contre les mauvais usages :\n```go\nfunc Nombres(n int) chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor i := range n {\n\t\t\tch <- i\n\t\t}\n\t}()\n\treturn ch\n}\n```"
    answer: |-
      ```go
      func Nombres(n int) <-chan int { ... }
      ```
      Le channel renvoyé en réception seule ne peut être ni alimenté ni fermé par l'appelant.
  - key: bug-pipeline
    format: bug-fix
    question: |-
      Dans ce pipeline, chaque étape reçoit des channels bidirectionnels et l'on ne sait plus qui ferme quoi. Comment rendre les rôles explicites ?
      ```go
      func filtrer(entree chan int, sortie chan int) { ... }
      ```
    answer: "```go\nfunc filtrer(entree <-chan int, sortie chan<- int) {\n\tdefer close(sortie)\n\tfor v := range entree {\n\t\tif v%2 == 0 {\n\t\t\tsortie <- v\n\t\t}\n\t}\n}\n```\nChaque étape reçoit sur un `<-chan`, envoie et ferme son `chan<-` : le compilateur vérifie les rôles."
