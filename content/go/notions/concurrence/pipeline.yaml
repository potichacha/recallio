  - key: bug-fuite
    format: bug-fix
    question: |-
      Le nombre de goroutines augmente à chaque recherche qui trouve vite son résultat. Quelle correction est la bonne ?
      ```go
      for r := range filtrer(lire(fichier)) {
      	if r.Correspond(q) {
      		return r, nil
      	}
      }
      ```
    choices:
      - {text: "Passer aux étapes un contexte annulé au retour (`defer cancel()`), surveillé à chaque envoi", correct: true}
      - {text: "Fermer le channel renvoyé par `filtrer` juste avant de rendre le résultat trouvé", correct: false}
      - {text: "Donner un tampon d'une place aux sorties de `lire` et de `filtrer`", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque recherche, pour ramasser les étapes bloquées", correct: false}
    answer: "```go\nctx, cancel := context.WithCancel(ctx)\ndefer cancel()\nfor r := range filtrer(ctx, lire(ctx, fichier)) {\n\tif r.Correspond(q) {\n\t\treturn r, nil\n\t}\n}\n```\nEn sortant tôt, le consommateur laissait les étapes bloquées sur leurs envois ; le contexte annulé au retour\n(avec des envois dans un select sur `ctx.Done()`) les arrête."
  - key: bug-close
    format: bug-fix
    question: |-
      Le consommateur reste bloqué après le dernier élément. Quelle correction est la bonne ?
      ```go
      func majuscules(in <-chan string) <-chan string {
      	out := make(chan string)
      	go func() {
      		for s := range in {
      			out <- strings.ToUpper(s)
      		}
      	}()
      	return out
      }
      ```
    choices:
      - {text: "Fermer `out` par `defer close(out)`, dans la goroutine de l'étape", correct: true}
      - {text: "Fermer `in` à la fin de la boucle, pour signaler la fin des données", correct: false}
      - {text: "Donner un tampon à `out`, pour que le dernier envoi passe sans attendre", correct: false}
      - {text: "Fermer `out` juste après `make`, avant de lancer la goroutine", correct: false}
    answer: "```go\ngo func() {\n\tdefer close(out)\n\tfor s := range in {\n\t\tout <- strings.ToUpper(s)\n\t}\n}()\n```\nL'étape doit fermer sa sortie pour que la fin se propage."
  - key: bug-envoi-sans-select
    format: bug-fix
    question: |-
      Cette étape ne s'arrête pas quand le contexte est annulé. Quelle correction est la bonne ?
      ```go
      for n := range entree {
      	if ctx.Err() != nil {
      		return
      	}
      	sortie <- traiter(n)
      }
      ```
    choices:
      - {text: "Envoyer dans un `select` qui surveille aussi `ctx.Done()`", correct: true}
      - {text: "Tester `ctx.Err()` aussi après l'envoi, en plus d'avant", correct: false}
      - {text: "Donner un tampon d'une place à `sortie`, pour ne pas bloquer", correct: false}
      - {text: "Fermer `entree` dès que `ctx.Err()` ne vaut plus nil", correct: false}
    answer: "```go\nfor n := range entree {\n\tselect {\n\tcase sortie <- traiter(n):\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\nLe test de `ctx.Err()` avant l'envoi ne suffit pas : l'étape peut rester bloquée sur l'envoi lui-même ; le select\nsurveille les deux en même temps."
  - key: bug-fermer-entree
    format: bug-fix
    question: |-
      Ce pipeline panique avec « close of closed channel » ou « send on closed channel ». Quelle correction est la bonne ?
      ```go
      func doubler(in chan int) chan int {
      	out := make(chan int)
      	go func() {
      		for v := range in {
      			out <- v * 2
      		}
      		close(in)
      		close(out)
      	}()
      	return out
      }
      ```
    choices:
      - {text: "Ne fermer que `out`, et typer l'entrée `<-chan int` pour interdire `close(in)`", correct: true}
      - {text: "Fermer `in` dans un `sync.Once`, pour qu'il ne soit fermé qu'une seule fois", correct: false}
      - {text: "Fermer `out` avant `in`, pour respecter l'ordre des étapes du pipeline", correct: false}
      - {text: "Entourer les deux `close` d'un `recover`, pour ignorer la panique", correct: false}
    answer: "```go\nfunc doubler(in <-chan int) <-chan int {\n\tout := make(chan int)\n\tgo func() {\n\t\tdefer close(out)\n\t\tfor v := range in {\n\t\t\tout <- v * 2\n\t\t}\n\t}()\n\treturn out\n}\n```\nL'étape fermait son entrée, qui appartient à l'étape précédente ; avec des types orientés, le compilateur\nl'interdit."
  - key: scenario-import
    format: scenario
    question: "Tu conçois l'import d'un fichier CSV de 10 Go dans une base de données. Quel pipeline choisis-tu ?"
    choices:
      - {text: "Lecture, validation dupliquée, lots de 1 000 lignes, écriture bornée par le pool, et un contexte commun", correct: true}
      - {text: "Lire tout le fichier en mémoire, puis insérer chaque ligne dans sa propre goroutine", correct: false}
      - {text: "Une goroutine par ligne lue, qui valide puis insère aussitôt sa ligne, seule", correct: false}
      - {text: "Une étape par colonne du fichier, chacune qui insère sa colonne dans la table", correct: false}
    answer: "Une étape de lecture (`csv.Reader`), une de validation (dupliquée si elle est coûteuse), une de regroupement en lots de 1 000 lignes, et une d'écriture (avec `COPY` pour PostgreSQL), limitée par le pool de connexions. Toutes partagent un contexte annulé à la première erreur grave, et les lignes invalides partent sur un channel d'erreurs ; la mémoire reste bornée, rien n'est chargé en entier."
  - key: scenario-quand
    format: scenario
    question: Quand un pipeline de goroutines n'est-il pas une bonne idée ?
    choices:
      - {text: "Quand les étapes sont très légères : les envois coûtent plus que le travail", correct: true}
      - {text: "Quand une étape fait des entrées-sorties lentes, comme un appel réseau", correct: false}
      - {text: "Quand les données sont trop grosses pour tenir en mémoire d'un coup", correct: false}
      - {text: "Quand une étape coûte bien plus cher que toutes les autres", correct: false}
    answer: "Quand les étapes sont très légères (une addition, une conversion simple) : le coût des envois sur les channels dépasse le travail, et une simple boucle est plus rapide et plus lisible. Le pipeline vaut le coup pour des étapes coûteuses ou inégales, un traitement au fil de l'eau, ou une étape à paralléliser."
  - key: scenario-erreurs
    format: scenario
    question: Comment remonter les erreurs d'un pipeline ?
    choices:
      - {text: "Des valeurs qui portent leur erreur, ou `errgroup.WithContext` si une erreur arrête tout", correct: true}
      - {text: "Une panique dans l'étape fautive, récupérée par un `recover` dans le consommateur", correct: false}
      - {text: "Un journal des erreurs dans chaque étape, sans rien remonter au consommateur", correct: false}
      - {text: "Une variable `err` globale, écrite par l'étape qui échoue et lue à la fin", correct: false}
    answer: "Deux options : faire circuler des valeurs qui portent leur erreur (`type Resultat struct { Valeur T; Err error }`), que le consommateur traite ; ou lancer les étapes avec `errgroup.WithContext`, qui annule tout à la première erreur et la renvoie par `Wait`. Je choisis selon que l'erreur concerne un élément (on continue) ou l'ensemble (on arrête)."
  - key: scenario-iterateurs
    format: scenario
    question: Depuis Go 1.23, faut-il remplacer les pipelines de channels par des itérateurs ?
    choices:
      - {text: "Pour un traitement séquentiel, oui ; les channels restent pour une vraie concurrence", correct: true}
      - {text: "Oui, toujours : les itérateurs font tourner les étapes en parallèle, sans goroutine", correct: false}
      - {text: "Non, jamais : les itérateurs sont plus lents que les channels, même sans concurrence", correct: false}
      - {text: "Oui : `iter.Seq` lance une goroutine par étape, exactement comme un pipeline", correct: false}
    answer: "Pour un traitement séquentiel (lire, filtrer, transformer), des itérateurs `iter.Seq` sont plus simples et plus rapides : ni goroutine, ni channel, ni fuite possible. Les pipelines de channels restent utiles quand les étapes doivent vraiment tourner en parallèle ; on choisit les itérateurs par défaut, la concurrence quand elle apporte un gain mesuré."
