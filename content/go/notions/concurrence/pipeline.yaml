notion: pipeline
lesson: "Un **pipeline** enchaîne des **étapes** reliées par des channels : chaque étape est une goroutine (ou un groupe) qui\nreçoit sur un channel d'entrée, transforme, et envoie sur un channel de sortie qu'elle **ferme** à la fin.\n\n```go\nfunc generer(ctx context.Context, nombres ...int) <-chan int {\n\tsortie := make(chan int)\n\tgo func() {\n\t\tdefer close(sortie)\n\t\tfor _, n := range nombres {\n\t\t\tselect {\n\t\t\tcase sortie <- n:\n\t\t\tcase <-ctx.Done():\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}()\n\treturn sortie\n}\n\nfunc carres(ctx context.Context, entree <-chan int) <-chan int {\n\tsortie := make(chan int)\n\tgo func() {\n\t\tdefer close(sortie)\n\t\tfor n := range entree {\n\t\t\tselect {\n\t\t\tcase sortie <- n * n:\n\t\t\tcase <-ctx.Done():\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}()\n\treturn sortie\n}\n\nfor v := range carres(ctx, generer(ctx, 1, 2, 3)) {\n\tfmt.Println(v)\n}\n```\n\nLes règles d'un pipeline sain :\n- chaque étape **ferme son channel de sortie** quand son entrée est épuisée : la fermeture se propage jusqu'au bout ;\n- chaque envoi est dans un **select avec `ctx.Done()`** : si le consommateur abandonne, toutes les étapes s'arrêtent,\n  sans fuite ;\n- les étapes reçoivent un `<-chan` et renvoient un `<-chan` : les rôles sont vérifiés par le compilateur.\n\nLes étapes travaillent **en parallèle** sur des éléments différents ; une étape lente peut être dupliquée (fan-out).\n\n**Piège classique** : un consommateur qui s'arrête au premier résultat utile sans annuler le contexte. Les étapes\nprécédentes restent bloquées sur leur envoi : fuite de goroutines.\n\n**En entretien** : « Des étapes reliées par des channels, chacune ferme sa sortie ; chaque envoi surveille le contexte\npour qu'un abandon arrête tout ; des signatures <-chan pour les rôles. »"
tour:
  - title: Les pipelines
    text: |-
      Un **pipeline** enchaîne des étapes reliées par des channels. Chaque étape est une goroutine qui lit son entrée,
      transforme, écrit sa sortie, et **ferme** sa sortie quand son entrée est épuisée : la fermeture se propage d'étape
      en étape.

      Chaque étape est une fonction qui prend un `<-chan` et renvoie un `<-chan` : on les compose comme des fonctions.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func genere(nombres ...int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for _, n := range nombres {
          			sortie <- n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func carres(entree <-chan int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for n := range entree {
          			sortie <- n * n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func main() {
          	for n := range carres(carres(genere(1, 2, 3))) {
          		fmt.Println(n)
          	}
          }
      output: |-
        1
        16
        81
    task:
      instructions: |-
        Écris une étape `plusUn`, sur le modèle de `carres`, et place-la après les carrés : le programme doit afficher
        2, 5 et 10.
      starter:
        main.go: |-
          package main

          import "fmt"

          func genere(nombres ...int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for _, n := range nombres {
          			sortie <- n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func carres(entree <-chan int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for n := range entree {
          			sortie <- n * n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func main() {
          	for n := range carres(genere(1, 2, 3)) {
          		fmt.Println(n)
          	}
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func genere(nombres ...int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for _, n := range nombres {
          			sortie <- n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func carres(entree <-chan int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for n := range entree {
          			sortie <- n * n
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func plusUn(entree <-chan int) <-chan int {
          	sortie := make(chan int)
          	go func() {
          		for n := range entree {
          			sortie <- n + 1
          		}
          		close(sortie)
          	}()
          	return sortie
          }

          func main() {
          	for n := range plusUn(carres(genere(1, 2, 3))) {
          		fmt.Println(n)
          	}
          }
      output: |-
        2
        5
        10
cards:
  - key: fermeture
    format: course
    question: "Comment la fin des données se propage-t-elle dans un pipeline ?"
    choices:
      - {text: "Chaque étape ferme sa sortie quand son `range` sur l'entrée se termine", correct: true}
      - {text: "Le consommateur ferme tous les channels, du dernier au premier", correct: false}
      - {text: "Chaque étape ferme son entrée, une fois qu'elle l'a lue en entier", correct: false}
      - {text: "Le ramasse-miettes ferme les channels que plus personne n'utilise", correct: false}
    answer: "Chaque étape ferme son channel de sortie quand son `range` sur l'entrée se termine : la fermeture descend d'étape en étape jusqu'au consommateur. L'entrée appartient à l'étape précédente, qui seule la ferme."
  - key: abandon
    format: course
    question: "Que doit faire chaque étape pour qu'un pipeline ne fuie pas quand le consommateur abandonne ?"
    choices:
      - {text: "Envoyer dans un `select` avec `ctx.Done()`, pour sortir sur annulation", correct: true}
      - {text: "Tester `ctx.Err()` avant chaque envoi, puis envoyer normalement", correct: false}
      - {text: "Donner un tampon d'une place à chacun de ses channels de sortie", correct: false}
      - {text: "Fermer son entrée, pour arrêter l'étape qui la précède", correct: false}
    answer: "Envoyer dans un `select` avec `ctx.Done()` : quand le contexte est annulé, l'étape sort au lieu de rester bloquée sur un envoi que personne ne lit. Tester `ctx.Err()` avant l'envoi ne suffit pas : l'étape peut rester bloquée sur l'envoi lui-même."
  - key: parallelisme
    format: course
    question: "En quoi un pipeline est-il concurrent ?"
    choices:
      - {text: "Ses étapes tournent dans des goroutines distinctes, sur des éléments différents à la fois", correct: true}
      - {text: "Chaque élément passe par toutes les étapes à la fois, en parallèle", correct: false}
      - {text: "Les étapes tournent l'une après l'autre, chacune sur tous les éléments", correct: false}
      - {text: "Il ne l'est pas : un pipeline n'est qu'une suite d'appels de fonctions", correct: false}
    answer: "Les étapes tournent dans des goroutines distinctes et traitent des éléments différents en même temps, comme une chaîne de montage. Un même élément, lui, passe les étapes l'une après l'autre."
  - key: lente
    format: course
    question: "Que faire d'une étape nettement plus lente que les autres ?"
    choices:
      - {text: "La dupliquer (fan-out), puis fusionner ses sorties (fan-in)", correct: true}
      - {text: "Donner un grand tampon à son entrée, ce qui la rend plus rapide", correct: false}
      - {text: "La placer en tête du pipeline, pour qu'elle commence plus tôt", correct: false}
      - {text: "La fusionner avec l'étape suivante, dans une même goroutine", correct: false}
    answer: "La dupliquer (plusieurs goroutines lisent la même entrée) puis fusionner leurs sorties. Un tampon n'aide que si la lenteur est passagère : il ne rend pas l'étape plus rapide."
  - key: vf-fermer-sortie
    format: true-false
    question: Chaque étape d'un pipeline ferme son propre channel de sortie.
    truth: true
    answer: Elle en est le seul émetteur.
  - key: vf-ordre
    format: true-false
    question: Un pipeline à une goroutine par étape conserve l'ordre des éléments.
    truth: true
    answer: Chaque étape traite les éléments un par un, dans l'ordre reçu ; c'est le fan-out qui casse l'ordre.
  - key: vf-fuite
    format: true-false
    question: Si le consommateur cesse de lire sans annuler, les étapes précédentes s'arrêtent d'elles-mêmes.
    truth: false
    answer: Elles restent bloquées sur leurs envois ; il faut un contexte annulé.
  - key: vf-signatures
    format: true-false
    question: Une étape qui reçoit un `<-chan int` et renvoie un `<-chan int` ne peut ni fermer son entrée ni écrire dedans.
    truth: true
    answer: Le compilateur vérifie les rôles.
  - key: qcm-etape
    format: multiple-choice
    question: "Que fait une étape de pipeline bien écrite, à la fin de son entrée ?"
    choices:
      - {text: "Elle ferme sa sortie, par `defer close(sortie)`", correct: true}
      - {text: "Elle ferme son channel d'entrée", correct: false}
      - {text: "Elle ferme son entrée, puis sa sortie", correct: false}
      - {text: "Elle ne ferme rien : le consommateur s'en charge", correct: false}
    answer: "Elle lit son entrée avec `range` jusqu'à la fermeture, et ferme sa sortie. L'entrée appartient à l'étape précédente : la fermer ferait paniquer celle-ci."
  - key: qcm-arret
    format: multiple-choice
    question: "Le consommateur n'a besoin que du premier résultat. Comment éviter que le pipeline fuie ?"
    choices:
      - {text: "Annuler le contexte des étapes (`defer cancel()`), qui envoient dans un `select` sur `ctx.Done()`", correct: true}
      - {text: "Fermer, côté consommateur, le channel de sortie de la dernière étape du pipeline", correct: false}
      - {text: "Laisser le ramasse-miettes s'occuper des goroutines restées bloquées sur leurs envois", correct: false}
      - {text: "Donner un tampon d'une place à la sortie de la dernière étape, pour son dernier envoi", correct: false}
    answer: "L'annulation débloque chaque étape, qui sort de son `select`. Le GC ne ramasse pas les goroutines bloquées, et fermer côté consommateur ferait paniquer l'étape qui envoie."
  - key: qcm-avantages
    format: multiple-choice
    question: "Lesquels de ces avantages offre un pipeline ?"
    choices:
      - text: Des étapes simples, chacune testable seule
        correct: true
      - text: Un traitement au fil de l'eau, sans tout charger en mémoire
        correct: true
      - text: Un traitement toujours plus rapide qu'une boucle simple
        correct: false
      - text: Aucune synchronisation à écrire
        correct: false
    answer: Pour des étapes très légères, une boucle simple reste plus rapide.
  - key: qcm-signature
    format: multiple-choice
    question: Quelle signature pour une étape qui double des entiers ?
    choices:
      - text: '`func doubler(ctx context.Context, entree <-chan int) <-chan int`'
        correct: true
      - text: '`func doubler(entree chan int, sortie chan int)` sans fermer'
        correct: false
      - text: '`func doubler(entree []int) []int`, dans une goroutine'
        correct: false
      - text: '`func doubler(entree chan<- int) chan<- int`'
        correct: false
    answer: Elle reçoit, renvoie un channel en lecture seule, et prend le contexte.
  - key: code-pipeline
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      generer := func(ns ...int) <-chan int {
      	out := make(chan int)
      	go func() {
      		defer close(out)
      		for _, n := range ns {
      			out <- n
      		}
      	}()
      	return out
      }
      carres := func(in <-chan int) <-chan int {
      	out := make(chan int)
      	go func() {
      		defer close(out)
      		for n := range in {
      			out <- n * n
      		}
      	}()
      	return out
      }

      for v := range carres(carres(generer(1, 2, 3))) {
      	fmt.Print(v, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`1 16 81`", correct: true}
      - {text: "`1 4 9`", correct: false}
      - {text: "`81 16 1`", correct: false}
      - {text: "`1 8 27`", correct: false}
    answer: "`1 16 81` : deux étapes de carrés à la suite, soit la puissance quatrième, dans l'ordre d'origine."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tgenerer := func(ns ...int) <-chan int {\n\t\tout := make(chan int)\n\t\tgo func() {\n\t\t\tdefer close(out)\n\t\t\tfor _, n := range ns {\n\t\t\t\tout <- n\n\t\t\t}\n\t\t}()\n\t\treturn out\n\t}\n\tcarres := func(in <-chan int) <-chan int {\n\t\tout := make(chan int)\n\t\tgo func() {\n\t\t\tdefer close(out)\n\t\t\tfor n := range in {\n\t\t\t\tout <- n * n\n\t\t\t}\n\t\t}()\n\t\treturn out\n\t}\n\n\tfor v := range carres(carres(generer(1, 2, 3))) {\n\t\tfmt.Print(v, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 1 16 81
  - key: code-filtre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      source := func(n int) <-chan int {
      	out := make(chan int)
      	go func() {
      		defer close(out)
      		for i := range n {
      			out <- i
      		}
      	}()
      	return out
      }
      pairs := func(in <-chan int) <-chan int {
      	out := make(chan int)
      	go func() {
      		defer close(out)
      		for v := range in {
      			if v%2 == 0 {
      				out <- v
      			}
      		}
      	}()
      	return out
      }

      somme := 0
      for v := range pairs(source(10)) {
      	somme += v
      }
      fmt.Println(somme)
      ```
    choices:
      - {text: "`20`", correct: true}
      - {text: "`25`", correct: false}
      - {text: "`30`", correct: false}
      - {text: "`45`", correct: false}
    answer: "`20` : 0 + 2 + 4 + 6 + 8. La source envoie de 0 à 9, et le filtre ne garde que les pairs."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tsource := func(n int) <-chan int {\n\t\tout := make(chan int)\n\t\tgo func() {\n\t\t\tdefer close(out)\n\t\t\tfor i := range n {\n\t\t\t\tout <- i\n\t\t\t}\n\t\t}()\n\t\treturn out\n\t}\n\tpairs := func(in <-chan int) <-chan int {\n\t\tout := make(chan int)\n\t\tgo func() {\n\t\t\tdefer close(out)\n\t\t\tfor v := range in {\n\t\t\t\tif v%2 == 0 {\n\t\t\t\t\tout <- v\n\t\t\t\t}\n\t\t\t}\n\t\t}()\n\t\treturn out\n\t}\n\n\tsomme := 0\n\tfor v := range pairs(source(10)) {\n\t\tsomme += v\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '20'
  - key: code-annulation
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancel(context.Background())
      infini := func() <-chan int {
      	out := make(chan int)
      	go func() {
      		defer close(out)
      		for i := 0; ; i++ {
      			select {
      			case out <- i:
      			case <-ctx.Done():
      				return
      			}
      		}
      	}()
      	return out
      }

      ch := infini()
      fmt.Println(<-ch, <-ch, <-ch)
      cancel()
      for range ch {
      }
      fmt.Println("source arrêtée")
      ```
    choices:
      - text: |-
          ```
          0 1 2
          source arrêtée
          ```
        correct: true
      - text: |-
          ```
          1 2 3
          source arrêtée
          ```
        correct: false
      - {text: "`0 1 2`, puis le programme reste bloqué pour toujours", correct: false}
      - text: |-
          ```
          0 0 0
          source arrêtée
          ```
        correct: false
    answer: "`0 1 2` puis `source arrêtée` : l'annulation arrête la source infinie, qui ferme sa sortie ; le `range` vide ce qui reste puis se termine."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tinfini := func() <-chan int {\n\t\tout := make(chan int)\n\t\tgo func() {\n\t\t\tdefer close(out)\n\t\t\tfor i := 0; ; i++ {\n\t\t\t\tselect {\n\t\t\t\tcase out <- i:\n\t\t\t\tcase <-ctx.Done():\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t}()\n\t\treturn out\n\t}\n\n\tch := infini()\n\tfmt.Println(<-ch, <-ch, <-ch)\n\tcancel()\n\tfor range ch {\n\t}\n\tfmt.Println(\"source arrêtée\")\n}\n"
      output: |-
        0 1 2
        source arrêtée
