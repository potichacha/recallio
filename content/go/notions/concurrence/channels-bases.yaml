notion: channels-bases
lesson: "Un **channel** est un tuyau typé qui transmet des valeurs entre goroutines, et les **synchronise** :\n\n```go\nch := make(chan int)   // non bufferisé\ngo func() {\n\tch <- 42           // envoyer : bloque jusqu'à ce qu'un récepteur prenne la valeur\n}()\nv := <-ch              // recevoir : bloque jusqu'à ce qu'une valeur arrive\n```\n\n- Sur un channel **non bufferisé**, l'envoi et la réception se **rencontrent** : l'émetteur attend le récepteur, et\n  inversement. C'est un point de synchronisation.\n- La valeur zéro d'un channel est **nil** : on le crée avec `make`.\n- Un channel est une **référence** : le passer à une fonction partage le même canal.\n- `len(ch)` et `cap(ch)` donnent le nombre d'éléments en attente et la capacité (pour un channel bufferisé).\n\nLa philosophie de Go (modèle **CSP**, Hoare 1978) : « **ne communiquez pas en partageant la mémoire ; partagez la\nmémoire en communiquant** ». Au lieu de protéger une donnée par un verrou, on la transmet d'une goroutine à l'autre :\nà chaque instant, une seule la possède.\n\nLes channels servent à : transmettre des résultats, distribuer du travail, signaler un événement (`chan struct{}`),\nlimiter la concurrence (un channel bufferisé comme sémaphore).\n\n**Piège classique** : envoyer sur un channel non bufferisé dans la **même goroutine** que celle qui doit recevoir.\nL'envoi attend un récepteur qui n'arrivera jamais : interblocage.\n\n**En entretien** : « Un tuyau typé et synchronisant ; sans tampon, l'envoi et la réception se rencontrent ; on partage\nla mémoire en communiquant (CSP) ; make pour le créer, nil sinon. »"
cards:
  - key: modele-csp
    format: course
    question: C'est quoi le modèle CSP ?
    answer: Des processus séquentiels indépendants qui communiquent par des canaux.
  - key: definition-channel
    format: definition
    question: channel
    answer: Canal typé de communication entre goroutines
  - key: rendez-vous
    format: course
    question: Que se passe-t-il lors d'un envoi sur un channel non bufferisé ?
    answer: 'L''émetteur bloque jusqu''à ce qu''un récepteur prenne la valeur : les deux goroutines se rencontrent, ce qui les synchronise.'
  - key: proverbe
    format: course
    question: Que signifie « partagez la mémoire en communiquant » ?
    answer: Au lieu de protéger une donnée partagée par un verrou, on la transmet par un channel d'une goroutine à l'autre, pour qu'une seule la possède à chaque instant.
  - key: reference
    format: course
    question: Que partage-t-on en passant un channel à une fonction ?
    answer: 'Le même canal : un channel est une référence, comme une map.'
  - key: vf-make
    format: true-false
    question: Un channel déclaré par `var ch chan int` est prêt à l'emploi.
    truth: false
    answer: Il vaut nil ; on le crée avec `make(chan int)`.
  - key: vf-type
    format: true-false
    question: Un channel ne transmet que des valeurs de son type.
    truth: true
    answer: '`chan int` transmet des int ; le compilateur le vérifie.'
  - key: vf-meme-goroutine
    format: true-false
    question: Envoyer puis recevoir sur un channel non bufferisé dans la même goroutine fonctionne.
    truth: false
    answer: L'envoi bloque en attendant un récepteur qui n'arrive jamais.
  - key: vf-csp
    format: true-false
    question: Le modèle de concurrence de Go s'inspire de CSP, de Tony Hoare.
    truth: true
    answer: Communicating Sequential Processes (1978).
  - key: qcm-syntaxe
    format: multiple-choice
    question: Quelles écritures sont correctes ?
    choices:
      - text: '`ch <- v` pour envoyer'
        correct: true
      - text: '`v := <-ch` pour recevoir'
        correct: true
      - text: '`ch.send(v)`'
        correct: false
      - text: '`v := ch->`'
        correct: false
    answer: La flèche indique le sens du flux.
  - key: qcm-usages
    format: multiple-choice
    question: À quoi servent les channels ?
    choices:
      - text: Transmettre des résultats entre goroutines
        correct: true
      - text: Signaler un événement, avec un `chan struct{}` fermé
        correct: true
      - text: Remplacer toutes les variables
        correct: false
      - text: Accélérer un calcul séquentiel
        correct: false
    answer: Ils communiquent et synchronisent.
  - key: qcm-bloque
    format: multiple-choice
    question: Quand une réception `<-ch` sur un channel non bufferisé bloque-t-elle ?
    choices:
      - text: Tant qu'aucune goroutine n'envoie
        correct: true
      - text: Pour toujours si le channel est nil
        correct: true
      - text: Jamais
        correct: false
      - text: Seulement si le channel est fermé
        correct: false
    answer: Un channel fermé, au contraire, ne bloque plus.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer un channel de chaînes ?
    choices:
      - text: '`make(chan string)`'
        correct: true
      - text: '`make(chan string, 10)`'
        correct: true
      - text: '`new(chan string)`, prêt à l''emploi'
        correct: false
      - text: '`chan string{}`'
        correct: false
    answer: '`new` donnerait un pointeur vers un channel nil.'
  - key: trous-make
    format: fill-in
    question: |-
      Complétez la création :
      ```go
      resultats := ___(chan Resultat)
      ```
    blanks:
      - - make
    answer: '`make` crée le channel.'
  - key: trous-envoyer
    format: fill-in
    question: |-
      Complétez l'envoi :
      ```go
      go func() { resultats ___ calculer() }()
      ```
    blanks:
      - - <-
    answer: '`ch <- v` envoie.'
  - key: trous-recevoir
    format: fill-in
    question: |-
      Complétez la réception :
      ```go
      r := ___resultats
      ```
    blanks:
      - - <-
    answer: '`<-ch` reçoit.'
  - key: trous-type
    format: fill-in
    question: |-
      Complétez le type d'un channel de signal :
      ```go
      done := make(chan ___)
      ```
    blanks:
      - - struct{}
    answer: Seul l'événement compte.
  - key: code-ping-pong
    format: code-output
    question: "```go\nping, pong := make(chan string), make(chan string)\ngo func() {\n\tm := <-ping\n\tpong <- m + \" pong\"\n}()\nping <- \"ping\"\nfmt.Println(<-pong)\n```"
    answer: '`ping pong` : les deux goroutines se synchronisent par les deux channels.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tping, pong := make(chan string), make(chan string)\n\tgo func() {\n\t\tm := <-ping\n\t\tpong <- m + \" pong\"\n\t}()\n\tping <- \"ping\"\n\tfmt.Println(<-pong)\n}\n"
      output: ping pong
  - key: code-sequence
    format: code-output
    question: "```go\nch := make(chan int)\ngo func() {\n\tfor i := range 3 {\n\t\tch <- i\n\t}\n}()\nfmt.Println(<-ch, <-ch, <-ch)\n```"
    answer: '`0 1 2` : un seul émetteur, les valeurs arrivent dans l''ordre d''envoi.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tgo func() {\n\t\tfor i := range 3 {\n\t\t\tch <- i\n\t\t}\n\t}()\n\tfmt.Println(<-ch, <-ch, <-ch)\n}\n"
      output: 0 1 2
  - key: code-meme-goroutine
    format: code-output
    question: |-
      ```go
      ch := make(chan int)
      ch <- 1
      fmt.Println(<-ch)
      ```
    answer: '« fatal error: all goroutines are asleep - deadlock! » : l''envoi attend un récepteur qui n''existe pas.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tch <- 1\n\tfmt.Println(<-ch)\n}\n"
      panics: all goroutines are asleep
  - key: code-len-cap
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      fmt.Println(len(ch), cap(ch))
      ```
    answer: '`2 3` : deux valeurs en attente, capacité trois.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(len(ch), cap(ch))\n}\n"
      output: 2 3
  - key: bug-nil
    format: bug-fix
    question: |-
      Le programme se bloque à la première ligne :
      ```go
      var resultats chan int
      go func() { resultats <- 1 }()
      fmt.Println(<-resultats)
      ```
    answer: |-
      ```go
      resultats := make(chan int)
      ```
      Un channel nil bloque à jamais en envoi comme en réception ; il faut le créer avec `make`.
  - key: bug-meme-goroutine
    format: bug-fix
    question: |-
      Le programme s'arrête sur « all goroutines are asleep - deadlock! » :
      ```go
      ch := make(chan string)
      ch <- "bonjour"
      fmt.Println(<-ch)
      ```
    answer: |-
      ```go
      ch := make(chan string)
      go func() { ch <- "bonjour" }()
      fmt.Println(<-ch)
      // ou un channel bufferisé : make(chan string, 1)
      ```
      Sans tampon, l'envoi attend un récepteur dans une autre goroutine.
  - key: bug-partage
    format: bug-fix
    question: "Plusieurs goroutines modifient une liste partagée et se marchent dessus :\n```go\nvar resultats []Resultat\nfor _, t := range taches {\n\tgo func() { resultats = append(resultats, executer(t)) }()\n}\n```"
    answer: "```go\nch := make(chan Resultat, len(taches))\nfor _, t := range taches {\n\tgo func() { ch <- executer(t) }()\n}\nresultats := make([]Resultat, 0, len(taches))\nfor range taches {\n\tresultats = append(resultats, <-ch)\n}\n```\nLes goroutines communiquent leurs résultats par un channel ; une seule goroutine construit la liste."
  - key: bug-type
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use "fini" (untyped string constant) as int value in send » :
      ```go
      ch := make(chan int)
      go func() { ch <- "fini" }()
      ```
    answer: |-
      ```go
      ch := make(chan string)
      go func() { ch <- "fini" }()
      ```
      Un channel ne transmet que des valeurs de son type.
  - key: definition-csp
    format: definition
    question: Communicating Sequential Processes
    answer: Le modèle de Tony Hoare où des processus séquentiels communiquent par des canaux ; il inspire les goroutines et les channels.
  - key: definition-non-bufferise
    format: definition
    question: channel non bufferisé
    answer: 'Un channel sans tampon, où chaque envoi attend une réception : un point de synchronisation entre deux goroutines.'
  - key: definition-envoi
    format: definition
    question: envoi (`ch <- v`)
    answer: L'opération qui dépose une valeur dans un channel ; elle bloque tant qu'aucun récepteur ou aucune place de tampon n'est disponible.
