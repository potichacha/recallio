notion: channels-bases
lesson: "Un **channel** est un tuyau typé qui transmet des valeurs entre goroutines, et les **synchronise** :\n\n```go\nch := make(chan int)   // non bufferisé\ngo func() {\n\tch <- 42           // envoyer : bloque jusqu'à ce qu'un récepteur prenne la valeur\n}()\nv := <-ch              // recevoir : bloque jusqu'à ce qu'une valeur arrive\n```\n\n- Sur un channel **non bufferisé**, l'envoi et la réception se **rencontrent** : l'émetteur attend le récepteur, et\n  inversement. C'est un point de synchronisation.\n- La valeur zéro d'un channel est **nil** : on le crée avec `make`.\n- Un channel est une **référence** : le passer à une fonction partage le même canal.\n- `len(ch)` et `cap(ch)` donnent le nombre d'éléments en attente et la capacité (pour un channel bufferisé).\n\nLa philosophie de Go (modèle **CSP**, Hoare 1978) : « **ne communiquez pas en partageant la mémoire ; partagez la\nmémoire en communiquant** ». Au lieu de protéger une donnée par un verrou, on la transmet d'une goroutine à l'autre :\nà chaque instant, une seule la possède.\n\nLes channels servent à : transmettre des résultats, distribuer du travail, signaler un événement (`chan struct{}`),\nlimiter la concurrence (un channel bufferisé comme sémaphore).\n\n**Piège classique** : envoyer sur un channel non bufferisé dans la **même goroutine** que celle qui doit recevoir.\nL'envoi attend un récepteur qui n'arrivera jamais : interblocage.\n\n**En entretien** : « Un tuyau typé et synchronisant ; sans tampon, l'envoi et la réception se rencontrent ; on partage\nla mémoire en communiquant (CSP) ; make pour le créer, nil sinon. »"
tour:
  - title: Les channels
    text: |-
      Un **channel** transmet des valeurs entre goroutines : `ch := make(chan string)`. `ch <- v` envoie, et `v := <-ch`
      reçoit.

      Sur un channel **sans tampon**, l'envoi attend qu'une autre goroutine reçoive, et la réception attend un envoi :
      l'échange **synchronise** les deux goroutines. D'où la devise de Go : *ne communiquez pas en partageant la
      mémoire ; partagez la mémoire en communiquant*.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	messages := make(chan string)
          	go func() {
          		messages <- "ping"
          	}()
          	fmt.Println(<-messages)

          	fini := make(chan bool)
          	go func() {
          		fmt.Println("travail terminé")
          		fini <- true
          	}()
          	<-fini
          	fmt.Println("main repart")
          }
      output: |-
        ping
        travail terminé
        main repart
    task:
      instructions: |-
        Fais calculer `6 * 7` dans la goroutine, envoie le résultat sur `resultat`, et reçois-le dans `main` : le
        programme doit afficher `42`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	resultat := make(chan int)
          	go func() {
          		_ = resultat
          	}()
          	fmt.Println("rien reçu")
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	resultat := make(chan int)
          	go func() {
          		resultat <- 6 * 7
          	}()
          	fmt.Println(<-resultat)
          }
      output: |-
        42
cards:
  - key: modele-csp
    format: course
    question: "Qu'est-ce que le modèle CSP, dont s'inspirent les channels de Go ?"
    choices:
      - {text: "Des processus séquentiels indépendants qui communiquent par des canaux", correct: true}
      - {text: "Des objets qui partagent la mémoire, protégée par des verrous explicites", correct: false}
      - {text: "Des acteurs qui ont chacun une boîte aux lettres, adressée par leur nom", correct: false}
      - {text: "Des fonctions pures, sans état, composées les unes après les autres", correct: false}
    answer: "Communicating Sequential Processes : des processus séquentiels indépendants qui communiquent par des canaux. À la différence des acteurs, on n'écrit pas à un destinataire nommé, mais dans un canal, que n'importe qui peut lire."
  - key: definition-channel
    format: definition
    question: "Dans la concurrence en Go, que désigne un « channel » ?"
    choices:
      - {text: "Un canal typé par lequel des goroutines communiquent", correct: true}
      - {text: "Une file du système, partagée entre plusieurs processus", correct: false}
      - {text: "Une fonction légère, exécutée de façon concurrente", correct: false}
      - {text: "Un verrou qui protège une donnée partagée entre tâches", correct: false}
    answer: "Un canal typé de communication entre goroutines, qui les synchronise aussi. La fonction légère, c'est la goroutine ; le verrou, c'est `sync.Mutex`."
  - key: rendez-vous
    format: course
    question: "Que se passe-t-il lors d'un envoi sur un channel non bufferisé ?"
    choices:
      - {text: "L'émetteur bloque jusqu'à ce qu'un récepteur prenne la valeur", correct: true}
      - {text: "La valeur est déposée, et l'émetteur continue aussitôt son travail", correct: false}
      - {text: "L'envoi échoue en silence s'il n'y a pas de récepteur prêt", correct: false}
      - {text: "Le programme panique si aucune goroutine ne lit encore le channel", correct: false}
    answer: "L'émetteur bloque jusqu'à ce qu'un récepteur prenne la valeur : les deux goroutines se rencontrent, ce qui les synchronise. Sans tampon, il n'y a nulle part où déposer la valeur."
  - key: proverbe
    format: course
    question: "Que signifie le proverbe Go « ne communique pas en partageant la mémoire ; partage la mémoire en communiquant » ?"
    choices:
      - {text: "Transmettre la donnée par un channel, pour qu'une seule goroutine la possède à la fois", correct: true}
      - {text: "Protéger chaque donnée partagée par un verrou plutôt que d'en faire des copies", correct: false}
      - {text: "Copier toute donnée avant de la lire, pour éviter les accès concurrents", correct: false}
      - {text: "Garder toute la donnée dans `main`, et ne lancer de goroutines que sans état", correct: false}
    answer: "Au lieu de protéger une donnée partagée par un verrou, on la transmet par un channel d'une goroutine à l'autre : une seule la possède à chaque instant. Le verrou reste légitime, mais ce n'est pas ce que dit le proverbe."
  - key: reference
    format: course
    question: "Que partage-t-on en passant un channel à une fonction ?"
    choices:
      - {text: "Le même canal : un channel est une référence, comme une map", correct: true}
      - {text: "Une copie du channel, avec les valeurs qui y attendent", correct: false}
      - {text: "Un nouveau channel vide, de même type et de même capacité", correct: false}
      - {text: "Rien : un channel ne se passe que par un pointeur `*chan`", correct: false}
    answer: "Le même canal : une valeur de type `chan` désigne la structure partagée, comme une map. Un `*chan T` est inutile : la fonction envoie et reçoit sur le channel de l'appelant."
  - key: vf-make
    format: true-false
    question: Un channel déclaré par `var ch chan int` est prêt à l'emploi.
    truth: false
    answer: Il vaut nil ; on le crée avec `make(chan int)`.
  - key: vf-type
    format: true-false
    question: Un channel ne transmet que des valeurs de son type.
    truth: true
    answer: '`chan int` transmet des int ; le compilateur le vérifie.'
  - key: vf-meme-goroutine
    format: true-false
    question: Envoyer puis recevoir sur un channel non bufferisé dans la même goroutine fonctionne.
    truth: false
    answer: L'envoi bloque en attendant un récepteur qui n'arrive jamais.
  - key: vf-csp
    format: true-false
    question: Le modèle de concurrence de Go s'inspire de CSP, de Tony Hoare.
    truth: true
    answer: Communicating Sequential Processes (1978).
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Quelle écriture envoie la valeur `v` dans le channel `ch` ?"
    choices:
      - {text: "`ch <- v`", correct: true}
      - {text: "`ch.send(v)`", correct: false}
      - {text: "`ch -> v`", correct: false}
      - {text: "`<-ch v`", correct: false}
    answer: "La flèche indique le sens du flux : `ch <- v` envoie, `v := <-ch` reçoit. Un channel n'a pas de méthodes."
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces usages est bien celui d'un channel ?"
    choices:
      - {text: "Transmettre des résultats d'une goroutine à une autre", correct: true}
      - {text: "Remplacer les variables partagées par tout le programme", correct: false}
      - {text: "Accélérer un calcul séquentiel, sans lancer de goroutine", correct: false}
      - {text: "Garder des valeurs de façon durable, comme une file persistante", correct: false}
    answer: "Un channel communique et synchronise : il transmet des résultats, ou signale un événement quand on ferme un `chan struct{}`. Il ne persiste rien et n'accélère pas un calcul à lui seul."
  - key: qcm-bloque
    format: multiple-choice
    question: "Dans lesquels de ces cas une réception `<-ch` sur un channel non bufferisé bloque-t-elle ?"
    choices:
      - text: Tant qu'aucune goroutine n'envoie
        correct: true
      - text: Pour toujours si le channel est nil
        correct: true
      - text: Jamais
        correct: false
      - text: Seulement si le channel est fermé
        correct: false
    answer: Un channel fermé, au contraire, ne bloque plus.
  - key: qcm-creer
    format: multiple-choice
    question: "Laquelle de ces écritures crée un channel de chaînes prêt à l'emploi ?"
    choices:
      - {text: "`make(chan string)`", correct: true}
      - {text: "`new(chan string)`", correct: false}
      - {text: "`chan string{}`", correct: false}
      - {text: "`var ch chan string`", correct: false}
    answer: "`make` crée le channel (`make(chan string, 10)` aussi, avec un tampon). `new` donne un pointeur vers un channel nil, et `var` un channel nil, qui bloque pour toujours."
  - key: trous-make
    format: fill-in
    question: |-
      Complète la création :
      ```go
      resultats := ___(chan Resultat)
      ```
    blanks:
      - - make
    answer: '`make` crée le channel.'
  - key: trous-envoyer
    format: fill-in
    question: |-
      Complète l'envoi :
      ```go
      go func() { resultats ___ calculer() }()
      ```
    blanks:
      - - <-
    answer: '`ch <- v` envoie.'
  - key: trous-recevoir
    format: fill-in
    question: |-
      Complète la réception :
      ```go
      r := ___resultats
      ```
    blanks:
      - - <-
    answer: '`<-ch` reçoit.'
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type d'un channel de signal :
      ```go
      done := make(chan ___)
      ```
    blanks:
      - - struct{}
    answer: Seul l'événement compte.
  - key: code-ping-pong
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ping, pong := make(chan string), make(chan string)
      go func() {
      	m := <-ping
      	pong <- m + " pong"
      }()
      ping <- "ping"
      fmt.Println(<-pong)
      ```
    choices:
      - {text: "`ping pong`", correct: true}
      - {text: "`pong ping`", correct: false}
      - {text: "`ping`", correct: false}
      - {text: "`pong`", correct: false}
    answer: "`ping pong` : la goroutine reçoit `ping` et renvoie `ping pong` ; les deux goroutines se synchronisent par les deux channels."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tping, pong := make(chan string), make(chan string)\n\tgo func() {\n\t\tm := <-ping\n\t\tpong <- m + \" pong\"\n\t}()\n\tping <- \"ping\"\n\tfmt.Println(<-pong)\n}\n"
      output: ping pong
  - key: code-sequence
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int)
      go func() {
      	for i := range 3 {
      		ch <- i
      	}
      }()
      fmt.Println(<-ch, <-ch, <-ch)
      ```
    choices:
      - {text: "`0 1 2`", correct: true}
      - {text: "`2 1 0`", correct: false}
      - {text: "`1 2 3`", correct: false}
      - {text: "`0 0 0`", correct: false}
    answer: "`0 1 2` : un seul émetteur, et un channel livre les valeurs dans l'ordre d'envoi. Les trois réceptions sont évaluées de gauche à droite."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tgo func() {\n\t\tfor i := range 3 {\n\t\t\tch <- i\n\t\t}\n\t}()\n\tfmt.Println(<-ch, <-ch, <-ch)\n}\n"
      output: 0 1 2
  - key: code-meme-goroutine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int)
      ch <- 1
      fmt.Println(<-ch)
      ```
    choices:
      - {text: "Une erreur fatale, plus grave qu'une panic : `all goroutines are asleep - deadlock!`", correct: true}
      - {text: "`1` : l'envoi dépose la valeur dans le channel, et la réception la reprend", correct: false}
      - {text: "Rien : le programme reste bloqué pour toujours, sans afficher de message", correct: false}
      - {text: "`0`, la valeur zéro, car le channel n'a pas de tampon où garder le 1", correct: false}
    answer: "« fatal error: all goroutines are asleep - deadlock! » : l'envoi attend un récepteur qui n'existe pas, et le runtime voit qu'aucune goroutine ne peut plus avancer. Ce n'est pas une panic : `recover` ne l'attrape pas."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tch <- 1\n\tfmt.Println(<-ch)\n}\n"
      panics: all goroutines are asleep
  - key: code-len-cap
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      fmt.Println(len(ch), cap(ch))
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`0 3`", correct: false}
    answer: "`2 3` : `len` donne les deux valeurs en attente dans le tampon, `cap` sa capacité de trois."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(len(ch), cap(ch))\n}\n"
      output: 2 3
  - key: bug-nil
    format: bug-fix
    question: |-
      Ce programme reste bloqué sans rien afficher. Quelle correction est la bonne ?
      ```go
      var resultats chan int
      go func() { resultats <- 1 }()
      fmt.Println(<-resultats)
      ```
    choices:
      - {text: "Créer le channel avec `make(chan int)` au lieu de le déclarer par `var`", correct: true}
      - {text: "Envoyer depuis `main` et recevoir dans la goroutine, plutôt que l'inverse", correct: false}
      - {text: "Fermer le channel avant de recevoir, pour débloquer la réception", correct: false}
      - {text: "Ajouter un `time.Sleep` avant la réception, le temps que l'envoi arrive", correct: false}
    answer: |-
      ```go
      resultats := make(chan int)
      ```
      Un channel nil bloque à jamais en envoi comme en réception ; il faut le créer avec `make`.
  - key: bug-meme-goroutine
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « all goroutines are asleep - deadlock! ». Quelle correction est la bonne ?
      ```go
      ch := make(chan string)
      ch <- "bonjour"
      fmt.Println(<-ch)
      ```
    choices:
      - {text: "Envoyer depuis une autre goroutine (ou donner au channel un tampon de 1)", correct: true}
      - {text: "Inverser les deux lignes : recevoir d'abord dans `main`, puis envoyer", correct: false}
      - {text: "Fermer le channel juste après l'envoi, pour libérer la réception", correct: false}
      - {text: "Déclarer le channel par `var ch chan string`, sans passer par `make`", correct: false}
    answer: |-
      ```go
      ch := make(chan string)
      go func() { ch <- "bonjour" }()
      fmt.Println(<-ch)
      // ou un channel bufferisé : make(chan string, 1)
      ```
      Sans tampon, l'envoi attend un récepteur dans une autre goroutine.
  - key: bug-partage
    format: bug-fix
    question: |-
      Plusieurs goroutines ajoutent à la même slice et se marchent dessus. Quelle correction est la bonne ?
      ```go
      var resultats []Resultat
      for _, t := range taches {
      	go func() { resultats = append(resultats, executer(t)) }()
      }
      ```
    choices:
      - {text: "Envoyer chaque résultat dans un channel, et construire la liste dans une seule goroutine", correct: true}
      - {text: "Préallouer la slice avec `make([]Resultat, 0, len(taches))`, pour éviter les réallocations", correct: false}
      - {text: "Copier `t` dans une variable locale avant de lancer chaque goroutine de la boucle", correct: false}
      - {text: "Remplacer la slice par une map, que plusieurs goroutines peuvent remplir sans risque", correct: false}
    answer: "```go\nch := make(chan Resultat, len(taches))\nfor _, t := range taches {\n\tgo func() { ch <- executer(t) }()\n}\nresultats := make([]Resultat, 0, len(taches))\nfor range taches {\n\tresultats = append(resultats, <-ch)\n}\n```\nLes goroutines communiquent leurs résultats par un channel ; une seule goroutine construit la liste."
  - key: bug-type
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use "fini" (untyped string constant) as int value in send ». Quelle correction est la bonne ?
      ```go
      ch := make(chan int)
      go func() { ch <- "fini" }()
      ```
    choices:
      - {text: "Déclarer un channel du type envoyé : `make(chan string)`", correct: true}
      - {text: "Convertir la valeur à l'envoi : `ch <- int(\"fini\")`", correct: false}
      - {text: "Créer le channel avec `new(chan string)`, sans `make`", correct: false}
      - {text: "Recevoir avec une assertion de type : `(<-ch).(string)`", correct: false}
    answer: |-
      ```go
      ch := make(chan string)
      go func() { ch <- "fini" }()
      ```
      Un channel ne transmet que des valeurs de son type.
  - key: definition-csp
    format: definition
    question: "Que désigne « Communicating Sequential Processes » (CSP) ?"
    choices:
      - {text: "Le modèle de Hoare où des processus séquentiels communiquent par des canaux", correct: true}
      - {text: "Le modèle d'acteurs, où chacun reçoit ses messages dans une boîte aux lettres", correct: false}
      - {text: "Un protocole réseau qui fait communiquer des processus sur plusieurs machines", correct: false}
      - {text: "La norme POSIX des threads et des verrous, utilisée par les programmes en C", correct: false}
    answer: "Le modèle de Tony Hoare (1978) où des processus séquentiels communiquent par des canaux ; il inspire les goroutines et les channels. Les acteurs, eux, s'adressent des messages par leur nom."
  - key: definition-non-bufferise
    format: definition
    question: "Que désigne un « channel non bufferisé » ?"
    choices:
      - {text: "Un channel sans tampon, où chaque envoi attend une réception", correct: true}
      - {text: "Un channel sans type, qui accepte des valeurs de tout type", correct: false}
      - {text: "Un channel fermé, qui ne transmet plus aucune nouvelle valeur", correct: false}
      - {text: "Un channel déclaré sans `make`, qui vaut donc `nil`", correct: false}
    answer: "Un channel sans tampon (`make(chan T)`), où chaque envoi attend une réception : un point de synchronisation entre deux goroutines. Déclaré sans `make`, un channel est nil, ce qui est tout autre chose."
  - key: definition-envoi
    format: definition
    question: "Que désigne l'« envoi » `ch <- v` sur un channel ?"
    choices:
      - {text: "L'opération qui dépose une valeur, et bloque faute de récepteur ou de place", correct: true}
      - {text: "L'opération qui lit une valeur, et bloque tant que le channel est vide", correct: false}
      - {text: "Une affectation de `v` au channel `ch`, qui ne bloque jamais l'émetteur", correct: false}
      - {text: "L'opération qui dépose une valeur, et panique faute de récepteur prêt", correct: false}
    answer: "L'opération qui dépose une valeur dans un channel ; elle bloque tant qu'aucun récepteur ou aucune place de tampon n'est disponible. Elle ne panique que sur un channel fermé."
