notion: select-default
lesson: "Un cas **`default`** rend le `select` **non bloquant** : si aucun autre cas n'est prêt **tout de suite**, `default`\ns'exécute.\n\n```go\n// essayer d'envoyer, sans attendre\nselect {\ncase evenements <- e:\ndefault:\n\tperdus++ // le tampon est plein : on abandonne l'événement\n}\n\n// essayer de recevoir, sans attendre\nselect {\ncase m := <-messages:\n\ttraiter(m)\ndefault:\n\t// rien à traiter pour l'instant\n}\n```\n\nUsages :\n- **ne jamais bloquer** un chemin critique : un envoi de métrique ou de journal qu'on accepte de perdre ;\n- **tester** si un signal est arrivé (`select { case <-stop: return; default: }`), par exemple pour vérifier une\n  priorité ;\n- un channel de capacité 1 comme **verrou non bloquant** (« essayer de prendre la main »).\n\nPiège majeur : un **`for` avec un `select` qui a un `default` vide** tourne en boucle **active** (busy loop) et consomme\n100 % d'un cœur. Si l'on doit attendre, on retire le `default` et l'on laisse le select bloquer.\n\n**Piège classique** : ajouter un `default` « pour éviter un interblocage ». Le programme ne se bloque plus, mais il perd\ndes messages ou tourne à vide, et le vrai problème reste.\n\n**En entretien** : « default rend le select non bloquant : envoi ou réception si c'est possible tout de suite, sinon\ndefault ; utile pour abandonner un envoi ou tester un signal ; jamais un default vide dans une boucle d'attente. »"
tour:
  - title: select avec default
    text: |-
      Avec un cas `default`, `select` ne bloque **jamais** : si aucun channel n'est prêt, c'est `default` qui s'exécute.
      On obtient une réception ou un envoi **non bloquants** : « s'il y a un message, je le prends ; sinon, je
      continue ».

      Attention à ne pas en faire une boucle d'attente active, qui tournerait à vide en occupant un cœur.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	messages := make(chan string, 1)

          	select {
          	case m := <-messages:
          		fmt.Println("reçu :", m)
          	default:
          		fmt.Println("aucun message")
          	}

          	messages <- "bonjour"
          	select {
          	case m := <-messages:
          		fmt.Println("reçu :", m)
          	default:
          		fmt.Println("aucun message")
          	}

          	for _, m := range []string{"un", "deux"} {
          		select {
          		case messages <- m:
          			fmt.Println("envoyé :", m)
          		default:
          			fmt.Println("tampon plein, abandon de", m)
          		}
          	}
          }
      output: |-
        aucun message
        reçu : bonjour
        envoyé : un
        tampon plein, abandon de deux
cards:
  - key: sert-default-select
    format: course
    question: "À quoi sert `default` dans un `select` ?"
    choices:
      - {text: "À rendre le `select` non bloquant : il s'exécute si aucun cas n'est prêt", correct: true}
      - {text: "À donner le cas choisi quand plusieurs cas sont prêts en même temps", correct: false}
      - {text: "À attendre un délai par défaut, avant d'abandonner le `select`", correct: false}
      - {text: "À traiter la fermeture de l'un des channels du `select`", correct: false}
    answer: "Il rend le `select` non bloquant : s'il n'y a aucun cas prêt à l'instant, `default` s'exécute aussitôt. Il n'attend aucun délai ; pour cela, on ajoute un cas `time.After` ou `ctx.Done()`."
  - key: code-ch-make-chan-int-select
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int)
      select {
      case v := <-ch:
          fmt.Println(v)
      default:
          fmt.Println("default")
      }
      ```
    choices:
      - {text: "`default`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Une erreur fatale : all goroutines are asleep - deadlock!", correct: false}
      - {text: "Rien : le `select` attend un envoi pour toujours", correct: false}
    answer: "`default` : personne n'envoie sur `ch`, et le `select` non bloquant prend le cas `default` au lieu d'attendre."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tselect {\n\tcase v := <-ch:\n\t    fmt.Println(v)\n\tdefault:\n\t    fmt.Println(\"default\")\n\t}\n}\n"
      output: default
  - key: abandon
    format: course
    question: "Comment envoyer une métrique sans jamais bloquer le chemin principal ?"
    choices:
      - {text: "Un `select` avec l'envoi et un `default`, qui abandonne la métrique si le channel est plein", correct: true}
      - {text: "Un envoi dans une nouvelle goroutine pour chaque métrique, sans attendre qu'elle finisse", correct: false}
      - {text: "Un channel bufferisé assez grand pour que l'envoi ne puisse jamais bloquer", correct: false}
      - {text: "Un `select` avec l'envoi et un `time.After` d'une seconde, puis l'abandon", correct: false}
    answer: "Avec un `select` à deux cas, l'envoi et `default` : si le channel est plein, la métrique est abandonnée (et l'on compte les pertes). Une goroutine par envoi s'accumule si le consommateur ralentit, et aucun tampon n'est assez grand pour toujours."
  - key: busy-loop
    format: course
    question: "Pourquoi un `for { select { case ...: default: } }` est-il dangereux ?"
    choices:
      - {text: "Quand rien n'est prêt, `default` repart aussitôt : la boucle occupe un cœur entier", correct: true}
      - {text: "Le `default` fait perdre les messages qui arrivent pendant qu'il s'exécute", correct: false}
      - {text: "Le `select` panique quand `default` s'exécute deux fois de suite", correct: false}
      - {text: "La boucle bloque pour toujours dès que le channel attendu est vide", correct: false}
    answer: "Quand aucun cas n'est prêt, `default` s'exécute aussitôt et la boucle recommence : elle tourne à vide et consomme un cœur entier. Sans `default`, le `select` bloquerait sans rien consommer."
  - key: interblocage
    format: course
    question: "Un `default` corrige-t-il un interblocage ?"
    choices:
      - {text: "Non : il évite le blocage en abandonnant l'opération, et masque le défaut de conception", correct: true}
      - {text: "Oui : sans blocage possible, il ne peut plus jamais y avoir d'interblocage", correct: false}
      - {text: "Oui, à condition de le placer en premier cas du `select`, avant les autres", correct: false}
      - {text: "Non, car `default` n'est jamais choisi quand l'un des channels est nil", correct: false}
    answer: "Non : il évite le blocage en abandonnant l'opération, ce qui perd des messages ou fait tourner à vide ; il faut corriger la conception. La place de `default` dans le `select` ne change rien."
  - key: vf-non-bloquant
    format: true-false
    question: Un select avec un cas default ne bloque jamais.
    truth: true
    answer: Si aucun cas n'est prêt, default s'exécute immédiatement.
  - key: vf-default-prioritaire
    format: true-false
    question: Le cas default est choisi même si un autre cas est prêt.
    truth: false
    answer: Il ne s'exécute que si aucun autre cas n'est prêt.
  - key: vf-busy
    format: true-false
    question: Une boucle for avec un select dont le default est vide peut consommer 100 % d'un cœur.
    truth: true
    answer: Elle ne bloque jamais et repasse sans cesse.
  - key: vf-un-seul
    format: true-false
    question: Un select peut avoir plusieurs cas default.
    truth: false
    answer: Un seul default par select.
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces usages de `default` dans un `select` est raisonnable ?"
    choices:
      - {text: "Abandonner l'envoi d'un événement de télémétrie quand le tampon est plein", correct: true}
      - {text: "Attendre un message en boucle, avec un `default` vide dans le `select`", correct: false}
      - {text: "Débloquer un interblocage entre deux goroutines qui s'attendent", correct: false}
      - {text: "Ne pas attendre l'envoi d'une commande qui ne doit pas se perdre", correct: false}
    answer: "Perdre un événement de télémétrie est acceptable ; vérifier sans attendre si un signal d'arrêt est arrivé l'est aussi. Pour attendre, on laisse le `select` bloquer ; une commande perdue, elle, est un bug."
  - key: qcm-resultat
    format: multiple-choice
    question: 'Que fait `select { case v := <-ch: f(v); default: g() }` si `ch` est vide et ouvert ?'
    choices:
      - text: Il appelle g immédiatement
        correct: true
      - text: Il attend une valeur puis appelle f
        correct: false
      - text: Il panique
        correct: false
      - text: Il bloque pour toujours
        correct: false
    answer: 'Aucun cas n''est prêt : default s''exécute.'
  - key: qcm-verrou
    format: multiple-choice
    question: Comment « essayer de prendre la main » sans attendre, avec `jeton := make(chan struct{}, 1)` ?
    choices:
      - {text: "`select { case jeton <- struct{}{}: travailler(); <-jeton; default: return }`", correct: true}
      - {text: "`jeton <- struct{}{}` sans `select`, puis `travailler()` et `<-jeton`", correct: false}
      - {text: "`close(jeton)` pour prendre la main, puis `travailler()`", correct: false}
      - {text: "Tester `len(jeton) == 0`, puis envoyer et travailler", correct: false}
    answer: Le test de longueur puis l'envoi n'est pas atomique (deux goroutines peuvent passer).
  - key: qcm-busy
    format: multiple-choice
    question: "Comment corriger une boucle d'attente qui tourne à vide à cause d'un `default` ?"
    choices:
      - {text: "Retirer le `default`, pour que le `select` bloque", correct: true}
      - {text: "Ajouter `time.Sleep(time.Nanosecond)` dans le `default`", correct: false}
      - {text: "Augmenter la capacité du channel attendu", correct: false}
      - {text: "Ajouter `runtime.Gosched()` dans le `default`", correct: false}
    answer: "Sans `default`, le `select` bloque jusqu'à ce qu'un cas soit prêt ; on ajoute un cas `ctx.Done()` pour pouvoir s'arrêter. Un sommeil minuscule ou `Gosched` réduit la consommation sans corriger la conception."
  - key: code-plein
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 2)
      perdus := 0
      for i := range 5 {
      	select {
      	case ch <- i:
      	default:
      		perdus++
      	}
      }
      fmt.Println(len(ch), perdus)
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`5 0`", correct: false}
      - {text: "`2 0`", correct: false}
      - {text: "`3 2`", correct: false}
    answer: "`2 3` : deux envois tiennent dans le tampon ; les trois autres prennent le `default` et sont abandonnés, au lieu de bloquer."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tperdus := 0\n\tfor i := range 5 {\n\t\tselect {\n\t\tcase ch <- i:\n\t\tdefault:\n\t\t\tperdus++\n\t\t}\n\t}\n\tfmt.Println(len(ch), perdus)\n}\n"
      output: 2 3
  - key: code-pret
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 1)
      ch <- 9
      select {
      case v := <-ch:
      	fmt.Println("reçu", v)
      default:
      	fmt.Println("rien")
      }
      ```
    choices:
      - {text: "`reçu 9`", correct: true}
      - {text: "`rien`", correct: false}
      - {text: "`reçu 0`", correct: false}
      - text: |-
          ```
          reçu 9
          rien
          ```
        correct: false
    answer: "`reçu 9` : un cas prêt passe toujours avant `default`, qui ne sert que si aucun ne l'est."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 1)\n\tch <- 9\n\tselect {\n\tcase v := <-ch:\n\t\tfmt.Println(\"reçu\", v)\n\tdefault:\n\t\tfmt.Println(\"rien\")\n\t}\n}\n"
      output: reçu 9
  - key: code-signal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      stop := make(chan struct{})
      arrete := func() bool {
      	select {
      	case <-stop:
      		return true
      	default:
      		return false
      	}
      }
      fmt.Print(arrete(), " ")
      close(stop)
      fmt.Println(arrete())
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false`, puis le programme reste bloqué", correct: false}
    answer: "`false true` : on teste le signal sans attendre ; avant la fermeture, c'est `default`, après, la réception sur le channel fermé réussit aussitôt."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tstop := make(chan struct{})\n\tarrete := func() bool {\n\t\tselect {\n\t\tcase <-stop:\n\t\t\treturn true\n\t\tdefault:\n\t\t\treturn false\n\t\t}\n\t}\n\tfmt.Print(arrete(), \" \")\n\tclose(stop)\n\tfmt.Println(arrete())\n}\n"
      output: false true
  - key: bug-busy
    format: bug-fix
    question: |-
      Ce worker consomme 100 % d'un cœur alors qu'il n'a presque rien à faire. Quelle correction est la bonne ?
      ```go
      for {
      	select {
      	case j := <-jobs:
      		traiter(j)
      	default:
      	}
      }
      ```
    choices:
      - {text: "Retirer le `default`, et ajouter un cas `ctx.Done()` pour pouvoir s'arrêter", correct: true}
      - {text: "Ajouter un `time.Sleep(time.Millisecond)` dans le `default`", correct: false}
      - {text: "Donner un plus grand tampon au channel `jobs`", correct: false}
      - {text: "Remplacer le `default` vide par un `runtime.Gosched()`", correct: false}
    answer: "```go\nfor {\n\tselect {\n\tcase j := <-jobs:\n\t\ttraiter(j)\n\tcase <-ctx.Done():\n\t\treturn\n\t}\n}\n```\nLe default vide faisait tourner la boucle à vide ; sans lui, le select bloque jusqu'au prochain job."
  - key: bug-masque
    format: bug-fix
    question: |-
      Après l'ajout d'un `default` « pour débloquer », des commandes disparaissent. Quelle correction est la bonne ?
      ```go
      select {
      case commandes <- c:
      default:
      }
      ```
    choices:
      - {text: "Remplacer le `default` par un cas `ctx.Done()` : on attend que la commande soit acceptée", correct: true}
      - {text: "Garder le `default`, et réessayer l'envoi en boucle juste après le `select`", correct: false}
      - {text: "Garder le `default`, et agrandir le tampon du channel `commandes`", correct: false}
      - {text: "Envoyer la commande dans une goroutine lancée depuis le `default`", correct: false}
    answer: "```go\nselect {\ncase commandes <- c:\ncase <-ctx.Done():\n\treturn ctx.Err()\n}\n```\nUne commande ne doit pas être abandonnée : on attend qu'elle soit acceptée (ou que le contexte expire), et l'on\ncorrige la lenteur du consommateur s'il le faut. Le default ne convient qu'aux données qu'on accepte de perdre."
  - key: bug-len
    format: bug-fix
    question: |-
      Deux goroutines entrent parfois toutes les deux dans la section réservée. Quelle correction est la bonne ?
      ```go
      if len(jeton) == 0 {
      	jeton <- struct{}{}
      	travailler()
      	<-jeton
      }
      ```
    choices:
      - {text: "Tenter l'envoi du jeton dans un `select` avec `default`, en une seule opération", correct: true}
      - {text: "Tester `len(jeton) == 0` deux fois de suite, juste avant d'envoyer le jeton", correct: false}
      - {text: "Remplacer `len(jeton)` par `cap(jeton)` dans la condition du `if`", correct: false}
      - {text: "Donner au channel `jeton` une capacité de 2, pour absorber la seconde goroutine", correct: false}
    answer: "```go\nselect {\ncase jeton <- struct{}{}:\n\tdefer func() { <-jeton }()\n\ttravailler()\ndefault:\n\t// déjà occupé\n}\n```\nTester la longueur puis envoyer n'est pas atomique ; le select avec default tente l'envoi en une seule opération."
  - key: bug-reception
    format: bug-fix
    question: |-
      Le traitement des messages ne se fait que de temps en temps. Quelle correction est la bonne ?
      ```go
      select {
      case m := <-messages:
      	traiter(m)
      default:
      	return
      }
      ```
    choices:
      - {text: "Attendre les messages : un `range`, ou un `select` sans `default` avec `ctx.Done()`", correct: true}
      - {text: "Remplacer `return` par `continue` dans le `default`, dans une boucle `for`", correct: false}
      - {text: "Donner un tampon au channel `messages`, pour qu'un message soit toujours prêt", correct: false}
      - {text: "Ajouter un `time.Sleep` avant le `select`, le temps qu'un message arrive", correct: false}
    answer: "```go\nfor m := range messages {\n\ttraiter(m)\n}\n```\nLe default faisait abandonner dès qu'aucun message n'était prêt à l'instant précis ; un consommateur attend les\nmessages (avec un cas ctx.Done si l'on doit pouvoir l'arrêter)."
