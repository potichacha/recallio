notion: semaphore
lesson: "Un **sémaphore** borne le nombre de goroutines qui font une chose **en même temps**, sans changer la façon dont elles\nsont lancées. En Go, le plus simple est un **channel bufferisé** de capacité n :\n\n```go\nsem := make(chan struct{}, 5) // au plus 5 téléchargements simultanés\n\nfor _, url := range urls {\n\twg.Go(func() {\n\t\tsem <- struct{}{}        // acquérir : bloque si 5 jetons sont pris\n\t\tdefer func() { <-sem }() // libérer\n\t\ttelecharger(url)\n\t})\n}\nwg.Wait()\n```\n\nVariantes :\n- **`golang.org/x/sync/semaphore`** : un sémaphore **pondéré** (`Acquire(ctx, poids)`), qui accepte un contexte pour\n  abandonner l'attente ;\n- **`errgroup.SetLimit(n)`**, quand on veut en plus la première erreur ;\n- un **pool de workers**, qui limite aussi mais crée seulement n goroutines au lieu d'une par tâche.\n\nPour que l'attente s'arrête avec le contexte, l'acquisition se fait dans un `select` :\n\n```go\nselect {\ncase sem <- struct{}{}:\ncase <-ctx.Done():\n\treturn ctx.Err()\n}\n```\n\n**Piège classique** : libérer sans `defer`. Un retour anticipé ou une panique garde le jeton, et la capacité fond\njusqu'à bloquer tout le monde.\n\n**En entretien** : « Un channel bufferisé de capacité n : envoyer pour acquérir, recevoir en defer pour libérer ;\nx/sync/semaphore pour des poids ou un contexte. »"
tour:
  - title: Limiter la concurrence
    text: |-
      Un channel avec tampon sert de **sémaphore** : `sem := make(chan struct{}, 2)` autorise deux tâches à la fois. On
      prend une place avant le travail en envoyant dans le channel, et on la rend après en recevant : au-delà de deux,
      l'envoi bloque.

      Utile pour lancer une goroutine par tâche tout en bornant l'accès à une ressource : des connexions, des fichiers,
      un service. Ici, un mutex (page suivante) protège les compteurs qui mesurent combien de tâches tournent ensemble.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"sync"
          	"time"
          )

          func main() {
          	sem := make(chan struct{}, 2)
          	var mu sync.Mutex
          	enCours, maximum := 0, 0
          	var wg sync.WaitGroup
          	for range 5 {
          		wg.Go(func() {
          			sem <- struct{}{}
          			mu.Lock()
          			enCours++
          			maximum = max(maximum, enCours)
          			mu.Unlock()

          			time.Sleep(20 * time.Millisecond)

          			mu.Lock()
          			enCours--
          			mu.Unlock()
          			<-sem
          		})
          	}
          	wg.Wait()
          	fmt.Println("au plus", maximum, "tâches en même temps")
          }
      output: |-
        au plus 2 tâches en même temps
cards:
  - key: limiter-concurrence
    format: course
    question: "Comment limiter le nombre de tâches qui tournent en même temps ?"
    choices:
      - {text: "Un pool de workers, un sémaphore (channel bufferisé) ou `errgroup.SetLimit`", correct: true}
      - {text: "Un `rate.Limiter`, un `time.Ticker` ou un `time.Sleep` entre deux tâches", correct: false}
      - {text: "`runtime.GOMAXPROCS(n)`, qui borne le nombre de goroutines vivantes", correct: false}
      - {text: "Un `sync.WaitGroup`, dont le compteur ne peut pas dépasser la limite", correct: false}
    answer: "Un pool de workers, un sémaphore (channel bufferisé) ou `errgroup.SetLimit`. Un limiteur de débit borne les opérations par seconde, pas celles en cours, et `GOMAXPROCS` borne les threads qui exécutent du Go, pas les goroutines."
  - key: channel
    format: course
    question: "Comment faire un sémaphore avec un channel ?"
    choices:
      - {text: "Un channel bufferisé de capacité n : envoyer acquiert, recevoir (en `defer`) libère", correct: true}
      - {text: "Un channel non bufferisé : recevoir acquiert un jeton, envoyer le libère", correct: false}
      - {text: "Un channel bufferisé de capacité n : `close` libère tous les jetons d'un coup", correct: false}
      - {text: "Un channel de capacité n, dont `len` dit à chaque goroutine si elle peut entrer", correct: false}
    answer: "Un channel bufferisé de capacité n : `sem <- struct{}{}` pour acquérir (bloque quand n jetons sont pris), `defer func() { <-sem }()` pour libérer. Tester `len` puis envoyer n'est pas atomique."
  - key: defer
    format: course
    question: "Pourquoi libérer un jeton de sémaphore avec `defer` ?"
    choices:
      - {text: "Pour qu'un retour anticipé ou une panique le rende quand même", correct: true}
      - {text: "Pour que le jeton soit rendu avant le travail, et non après lui", correct: false}
      - {text: "Parce que `<-sem` ne compile que dans une fonction différée", correct: false}
      - {text: "Pour que le ramasse-miettes rende le jeton à la fin du programme", correct: false}
    answer: "Pour qu'un retour anticipé ou une panique le rende quand même ; sinon la capacité fond jusqu'à bloquer toutes les goroutines. `defer` s'exécute à la fin de la fonction, après le travail."
  - key: pondere
    format: course
    question: "Qu'apporte `golang.org/x/sync/semaphore` par rapport à un channel ?"
    choices:
      - {text: "Des poids : une tâche lourde prend plusieurs unités, et l'attente suit le contexte", correct: true}
      - {text: "Une limite de débit, en opérations par seconde, au lieu d'opérations en cours", correct: false}
      - {text: "Une libération automatique des jetons à la fin de chaque goroutine", correct: false}
      - {text: "Un sémaphore partagé entre plusieurs instances du service, par le réseau", correct: false}
    answer: "Un sémaphore pondéré (`Acquire(ctx, poids)`, `Release(poids)`) : une tâche lourde prend plusieurs unités, et l'attente s'interrompt avec le contexte. Il faut toujours appeler `Release` soi-même."
  - key: vf-capacite
    format: true-false
    question: Un channel de capacité 3 utilisé comme sémaphore laisse au plus 3 goroutines dans la section protégée.
    truth: true
    answer: La quatrième bloque sur l'envoi jusqu'à une libération.
  - key: vf-mutex
    format: true-false
    question: Un sémaphore de capacité 1 se comporte comme un verrou exclusif.
    truth: true
    answer: Une seule goroutine à la fois, mais sync.Mutex reste plus simple et plus rapide pour cela.
  - key: vf-goroutines
    format: true-false
    question: Un sémaphore limite le nombre de goroutines créées.
    truth: false
    answer: Il limite celles qui travaillent en même temps ; les autres existent et attendent. Un pool de workers limite les goroutines.
  - key: vf-ctx
    format: true-false
    question: Une acquisition `sem <- struct{}{}` s'interrompt toute seule quand le contexte est annulé.
    truth: false
    answer: Il faut l'écrire dans un select avec ctx.Done().
  - key: qcm-acquerir
    format: multiple-choice
    question: "Avec `sem := make(chan struct{}, n)`, lesquelles de ces opérations sont correctes ?"
    choices:
      - text: '`sem <- struct{}{}` pour acquérir'
        correct: true
      - text: '`defer func() { <-sem }()` pour libérer'
        correct: true
      - text: '`close(sem)` pour libérer'
        correct: false
      - text: '`len(sem)` pour acquérir'
        correct: false
    answer: Fermer le channel ferait paniquer les acquisitions suivantes.
  - key: qcm-vs-pool
    format: multiple-choice
    question: "Sémaphore ou pool de workers, laquelle de ces différences est exacte ?"
    choices:
      - {text: "Le pool ne crée que n goroutines ; le sémaphore, une par tâche", correct: true}
      - {text: "Le sémaphore crée moins de goroutines que le pool de workers", correct: false}
      - {text: "Seul le pool de workers borne vraiment la concurrence", correct: false}
      - {text: "Seul le sémaphore garde l'ordre des tâches à leur sortie", correct: false}
    answer: "Les deux bornent la concurrence ; le sémaphore garde une goroutine par tâche, dont seules n travaillent, alors que le pool économise les goroutines en attente."
  - key: qcm-pondere
    format: multiple-choice
    question: "Pourquoi choisir un sémaphore pondéré ?"
    choices:
      - {text: "Quand les tâches consomment des quantités différentes d'une ressource, comme la mémoire", correct: true}
      - {text: "Pour récupérer les erreurs des tâches, comme le ferait un `errgroup.Group`", correct: false}
      - {text: "Pour garder l'ordre des tâches à leur sortie, quel que soit leur poids", correct: false}
      - {text: "Pour limiter le nombre de requêtes envoyées chaque seconde à une API", correct: false}
    answer: "Une image de 400 Mo prend 4 unités, une de 100 Mo une seule : la limite porte sur la ressource, pas sur le nombre de tâches. Son attente s'interrompt aussi avec un contexte."
  - key: qcm-bug
    format: multiple-choice
    question: "Que se passe-t-il si une goroutine oublie de libérer son jeton ?"
    choices:
      - {text: "La capacité disponible baisse d'une unité pour toujours", correct: true}
      - {text: "Le jeton est rendu à la fin de la goroutine", correct: false}
      - {text: "Le programme panique à la fin de la goroutine", correct: false}
      - {text: "Le ramasse-miettes rend le jeton au prochain passage", correct: false}
    answer: "Rien ne rend le jeton automatiquement : après n oublis, toutes les acquisitions bloquent. D'où la libération par `defer`."
  - key: trous-acquerir
    format: fill-in
    question: |-
      Complète l'acquisition et la libération :
      ```go
      sem := make(chan struct{}, 5)
      sem ___ struct{}{}
      ___ func() { <-sem }()
      ```
    blanks:
      - - <-
      - - defer
    answer: Envoyer acquiert, recevoir en defer libère.
  - key: trous-capacite
    format: fill-in
    question: |-
      Complète pour au plus 8 traitements simultanés :
      ```go
      sem := make(chan struct{}, ___)
      ```
    blanks:
      - - '8'
    answer: La capacité est la limite.
  - key: trous-select
    format: fill-in
    question: |-
      Complète pour abandonner l'attente si le contexte est annulé :
      ```go
      ___ {
      case sem <- struct{}{}:
      case <-ctx.___():
      	return ctx.Err()
      }
      ```
    blanks:
      - - select
      - - Done
    answer: Le select attend le jeton ou l'annulation.
  - key: trous-x-sync
    format: fill-in
    question: |-
      Complète avec x/sync/semaphore :
      ```go
      sem := semaphore.NewWeighted(10)
      if err := sem.___(ctx, 1); err != nil {
      	return err
      }
      defer sem.Release(1)
      ```
    blanks:
      - - Acquire
    answer: '`Acquire` attend des unités, ou l''annulation du contexte.'
  - key: bug-sans-defer
    format: bug-fix
    question: |-
      Après quelques erreurs, plus aucun téléchargement ne démarre. Quelle correction est la bonne ?
      ```go
      sem <- struct{}{}
      if err := telecharger(url); err != nil {
      	return err
      }
      <-sem
      ```
    choices:
      - {text: "Libérer le jeton par `defer func() { <-sem }()`, juste après l'acquisition", correct: true}
      - {text: "Agrandir la capacité de `sem`, pour supporter un plus grand nombre d'erreurs", correct: false}
      - {text: "Libérer le jeton avant d'appeler `telecharger`, pour ne jamais l'oublier", correct: false}
      - {text: "Remplacer `return err` par un `panic(err)`, qui libère aussi le jeton", correct: false}
    answer: |-
      ```go
      sem <- struct{}{}
      defer func() { <-sem }()
      return telecharger(url)
      ```
      Le retour en erreur gardait le jeton ; le defer le rend dans tous les cas.
  - key: bug-acquisition-dehors
    format: bug-fix
    question: |-
      Ce sémaphore ne limite rien : 1 000 téléchargements démarrent en même temps. Quelle correction est la bonne ?
      ```go
      for _, url := range urls {
      	sem := make(chan struct{}, 5)
      	wg.Go(func() {
      		sem <- struct{}{}
      		defer func() { <-sem }()
      		telecharger(url)
      	})
      }
      ```
    choices:
      - {text: "Créer `sem` une seule fois, avant la boucle, pour qu'il soit partagé", correct: true}
      - {text: "Acquérir le jeton avant `wg.Go`, en gardant un `sem` par tour", correct: false}
      - {text: "Passer la capacité de `sem` de 5 à 1, toujours dans chaque tour", correct: false}
      - {text: "Remplacer `wg.Go` par `go`, avec un `wg.Add(1)` juste avant", correct: false}
    answer: "```go\nsem := make(chan struct{}, 5)\nfor _, url := range urls {\n\twg.Go(func() {\n\t\tsem <- struct{}{}\n\t\tdefer func() { <-sem }()\n\t\ttelecharger(url)\n\t})\n}\n```\nChaque tour créait son propre sémaphore ; il doit être partagé par toutes les goroutines."
  - key: bug-ctx
    format: bug-fix
    question: |-
      Après l'annulation de la requête, des goroutines restent bloquées en attente d'un jeton. Quelle correction est la bonne ?
      ```go
      sem <- struct{}{}
      defer func() { <-sem }()
      return traiter(ctx, t)
      ```
    choices:
      - {text: "Acquérir dans un `select` entre l'envoi du jeton et `ctx.Done()`", correct: true}
      - {text: "Tester `ctx.Err()` après l'acquisition, juste avant de traiter", correct: false}
      - {text: "Fermer `sem` à l'annulation, pour réveiller ceux qui attendent", correct: false}
      - {text: "Donner à `sem` une plus grande capacité, pour attendre moins", correct: false}
    answer: "```go\nselect {\ncase sem <- struct{}{}:\ncase <-ctx.Done():\n\treturn ctx.Err()\n}\ndefer func() { <-sem }()\nreturn traiter(ctx, t)\n```\nL'acquisition attend désormais le jeton ou l'annulation."
  - key: bug-mutex
    format: bug-fix
    question: |-
      Un compteur partagé est protégé par un channel de capacité 1. Que proposes-tu ?
      ```go
      verrou := make(chan struct{}, 1)
      verrou <- struct{}{}
      compteur++
      <-verrou
      ```
    choices:
      - {text: "Un `sync.Mutex`, ou un `atomic.Int64`, qui dit l'intention et coûte moins", correct: true}
      - {text: "Rien : un channel de capacité 1 est la façon idiomatique de protéger un compteur", correct: false}
      - {text: "Un channel de capacité 2, pour laisser passer deux goroutines à la fois", correct: false}
      - {text: "Retirer la protection : un `++` sur un `int` est atomique en Go", correct: false}
    answer: |-
      ```go
      var mu sync.Mutex
      mu.Lock()
      compteur++
      mu.Unlock()
      ```
      Un sémaphore de capacité 1 marche, mais un `sync.Mutex` (ou `atomic.Int64` pour un compteur) dit l'intention et
      coûte moins.
  - key: scenario-memoire
    format: scenario
    question: "Ton service redimensionne des images de tailles très variées et manque parfois de mémoire. Comment limites-tu ?"
    choices:
      - {text: "Un sémaphore pondéré, de capacité le budget mémoire, pesé selon la taille de chaque image", correct: true}
      - {text: "Un pool de 10 workers, quelle que soit la taille des images à redimensionner", correct: false}
      - {text: "Un `rate.Limiter` à 10 images par seconde, pour lisser la charge du service", correct: false}
      - {text: "Un `runtime.GC()` après chaque image, pour libérer la mémoire au plus tôt", correct: false}
    answer: "Un nombre fixe de traitements ne suffit pas : dix petites images passent, trois énormes font exploser la mémoire. Un sémaphore pondéré (`x/sync/semaphore`) a pour capacité le budget mémoire (par exemple 2 Go en unités de 10 Mo), et chaque traitement acquiert un poids proportionnel à la taille estimée de l'image, avec le contexte de la requête pour abandonner l'attente."
  - key: scenario-choix
    format: scenario
    question: 'Sémaphore, pool de workers ou errgroup.SetLimit : comment choisis-tu pour borner la concurrence ?'
    choices:
      - {text: "`SetLimit` pour des tâches connues, arrêtées à la première erreur ; un pool pour un flux ; un sémaphore autour d'une section", correct: true}
      - {text: "Toujours un sémaphore : c'est le plus simple des trois, et il couvre tous les cas sans exception", correct: false}
      - {text: "Toujours un pool de workers : un sémaphore crée trop de goroutines, et `errgroup` ne borne rien", correct: false}
      - {text: "`errgroup.SetLimit` pour un flux continu de tâches ; un sémaphore pour un lot connu d'avance", correct: false}
    answer: "`errgroup.SetLimit` quand les tâches sont connues et que la première erreur doit tout arrêter ; un pool de workers quand les tâches arrivent en flux ou que chaque worker garde un état (une connexion) ; un sémaphore quand le code lance déjà une goroutine par tâche (un handler HTTP) et qu'on veut seulement limiter une section, comme les appels à une dépendance fragile."
  - key: scenario-handlers
    format: scenario
    question: Ton serveur HTTP appelle un service fragile qui tombe au-delà de 10 appels simultanés. Comment le protèges-tu ?
    choices:
      - {text: "Un sémaphore partagé de 10 autour de l'appel, acquis avec le contexte et un délai court, sinon 503", correct: true}
      - {text: "Un pool de 10 workers créé pour chaque requête HTTP, qui font l'appel à sa place", correct: false}
      - {text: "Un `rate.Limiter` à 10 appels par seconde, partagé par tous les handlers du serveur", correct: false}
      - {text: "`GOMAXPROCS(10)`, pour qu'au plus 10 goroutines tournent à la fois dans le serveur", correct: false}
    answer: "Chaque requête est déjà une goroutine : je partage un sémaphore de capacité 10 autour de l'appel, acquis dans un `select` sur le contexte de la requête avec un délai court ; si le jeton ne vient pas à temps, je réponds 503 au lieu d'empiler les requêtes. Un limiteur de débit borne les appels par seconde, pas ceux en cours."
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande d'implémenter un sémaphore en Go sans bibliothèque. Que réponds-tu ?
    choices:
      - {text: "Un `chan struct{}` de capacité n : `Acquire` envoie (dans un `select` avec `ctx.Done()`), `Release` reçoit", correct: true}
      - {text: "Un compteur `int` qu'on incrémente et décrémente, testé en boucle jusqu'à ce qu'il baisse", correct: false}
      - {text: "Un `sync.WaitGroup` initialisé à n, dont `Wait` bloque les goroutines en trop", correct: false}
      - {text: "Un `chan struct{}` non bufferisé : `Acquire` reçoit, et `Release` ferme le channel", correct: false}
    answer: "Un type qui enveloppe un `chan struct{}` de capacité n : `Acquire(ctx)` fait un `select` entre l'envoi d'un jeton et `ctx.Done()`, `Release()` reçoit un jeton. `struct{}` n'occupe pas de mémoire, chaque `Acquire` réussi est suivi d'un `Release` en `defer`, et `x/sync/semaphore` existe pour des poids variables."
