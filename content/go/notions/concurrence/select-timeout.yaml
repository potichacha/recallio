  - key: code-delai
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      res := make(chan string, 1)
      go func() {
      	time.Sleep(100 * time.Millisecond)
      	res <- "résultat"
      }()
      select {
      case r := <-res:
      	fmt.Println(r)
      case <-time.After(20 * time.Millisecond):
      	fmt.Println("délai dépassé")
      }
      ```
    choices:
      - {text: "`délai dépassé`", correct: true}
      - {text: "`résultat`", correct: false}
      - text: |-
          ```
          délai dépassé
          résultat
          ```
        correct: false
      - {text: "Rien : le `select` attend le résultat", correct: false}
    answer: "`délai dépassé` : le résultat arrive après 100 ms, le délai expire à 20 ms, et le `select` ne prend qu'un cas."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tres := make(chan string, 1)\n\tgo func() {\n\t\ttime.Sleep(100 * time.Millisecond)\n\t\tres <- \"résultat\"\n\t}()\n\tselect {\n\tcase r := <-res:\n\t\tfmt.Println(r)\n\tcase <-time.After(20 * time.Millisecond):\n\t\tfmt.Println(\"délai dépassé\")\n\t}\n}\n"
      output: délai dépassé
  - key: code-contexte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithTimeout(context.Background(), 20*time.Millisecond)
      defer cancel()
      select {
      case <-time.After(time.Second):
      	fmt.Println("fini")
      case <-ctx.Done():
      	fmt.Println(ctx.Err(), errors.Is(ctx.Err(), context.DeadlineExceeded))
      }
      ```
    choices:
      - {text: "`context deadline exceeded true`", correct: true}
      - {text: "`context canceled false`", correct: false}
      - {text: "`context deadline exceeded false`", correct: false}
      - {text: "`fini`", correct: false}
    answer: "`context deadline exceeded true` : le contexte expire à 20 ms, avant le travail d'une seconde, et son erreur est la sentinelle `context.DeadlineExceeded`. `canceled` viendrait d'un appel à `cancel`."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithTimeout(context.Background(), 20*time.Millisecond)\n\tdefer cancel()\n\tselect {\n\tcase <-time.After(time.Second):\n\t\tfmt.Println(\"fini\")\n\tcase <-ctx.Done():\n\t\tfmt.Println(ctx.Err(), errors.Is(ctx.Err(), context.DeadlineExceeded))\n\t}\n}\n"
      output: context deadline exceeded true
  - key: code-ticker
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      t := time.NewTicker(10 * time.Millisecond)
      defer t.Stop()
      fin := time.After(55 * time.Millisecond)
      n := 0
      for {
      	select {
      	case <-t.C:
      		n++
      		continue
      	case <-fin:
      	}
      	break
      }
      fmt.Println(n >= 3 && n <= 6)
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`true` : environ cinq tics de 10 ms en 55 ms, entre 3 et 6 ; le code affiche le booléen, pas le nombre."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tt := time.NewTicker(10 * time.Millisecond)\n\tdefer t.Stop()\n\tfin := time.After(55 * time.Millisecond)\n\tn := 0\n\tfor {\n\t\tselect {\n\t\tcase <-t.C:\n\t\t\tn++\n\t\t\tcontinue\n\t\tcase <-fin:\n\t\t}\n\t\tbreak\n\t}\n\tfmt.Println(n >= 3 && n <= 6)\n}\n"
      output: 'true'
  - key: code-global
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      messages := make(chan int)
      go func() {
      	for i := 0; ; i++ {
      		messages <- i
      		time.Sleep(5 * time.Millisecond)
      	}
      }()
      limite := time.NewTimer(30 * time.Millisecond)
      recus := 0
      for {
      	select {
      	case <-messages:
      		recus++
      		continue
      	case <-limite.C:
      	}
      	break
      }
      fmt.Println(recus > 0 && recus < 10)
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "Rien : la boucle ne s'arrête jamais", correct: false}
    answer: "`true` : le timer créé avant la boucle impose un délai global de 30 ms, malgré les messages qui arrivent toutes les 5 ms."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tmessages := make(chan int)\n\tgo func() {\n\t\tfor i := 0; ; i++ {\n\t\t\tmessages <- i\n\t\t\ttime.Sleep(5 * time.Millisecond)\n\t\t}\n\t}()\n\tlimite := time.NewTimer(30 * time.Millisecond)\n\trecus := 0\n\tfor {\n\t\tselect {\n\t\tcase <-messages:\n\t\t\trecus++\n\t\t\tcontinue\n\t\tcase <-limite.C:\n\t\t}\n\t\tbreak\n\t}\n\tfmt.Println(recus > 0 && recus < 10)\n}\n"
      output: 'true'
  - key: bug-global
    format: bug-fix
    question: |-
      L'import devait s'arrêter au bout d'une minute, mais il ne s'arrête jamais tant que des lignes arrivent. Quelle correction est la bonne ?
      ```go
      for {
      	select {
      	case l := <-lignes:
      		importer(l)
      	case <-time.After(time.Minute):
      		return ErrDelai
      	}
      }
      ```
    choices:
      - {text: "Créer le délai avant la boucle (`context.WithTimeout`), et écouter `ctx.Done()`", correct: true}
      - {text: "Raccourcir `time.After` à une seconde, pour qu'il expire entre deux lignes", correct: false}
      - {text: "Ajouter un `default` au `select`, pour sortir quand aucune ligne n'arrive", correct: false}
      - {text: "Remplacer `time.After` par `time.Tick(time.Minute)` dans le `select`", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(ctx, time.Minute)\ndefer cancel()\nfor {\n\tselect {\n\tcase l := <-lignes:\n\t\timporter(l)\n\tcase <-ctx.Done():\n\t\treturn ctx.Err()\n\t}\n}\n```\n`time.After` repartait à chaque ligne ; un délai créé avant la boucle est global."
  - key: bug-fuite
    format: bug-fix
    question: |-
      Chaque appel qui expire laisse une goroutine bloquée. Quelle correction est la bonne ?
      ```go
      res := make(chan Profil)
      go func() { res <- chargerProfil(id) }()
      select {
      case p := <-res:
      	return p, nil
      case <-time.After(time.Second):
      	return Profil{}, ErrDelai
      }
      ```
    choices:
      - {text: "Un contexte à délai transmis au chargement, et un channel `res` de capacité 1", correct: true}
      - {text: "Fermer `res` dans la branche du délai, avant de renvoyer l'erreur `ErrDelai`", correct: false}
      - {text: "Ajouter un `default` au `select`, pour ne jamais attendre le profil", correct: false}
      - {text: "Remplacer `time.After` par un `time.Sleep(time.Second)` avant le `select`", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(ctx, time.Second)\ndefer cancel()\nres := make(chan Profil, 1)\ngo func() { res <- chargerProfil(ctx, id) }()\nselect {\ncase p := <-res:\n\treturn p, nil\ncase <-ctx.Done():\n\treturn Profil{}, ctx.Err()\n}\n```\nLa capacité de 1 laisse la goroutine se terminer, et le contexte transmis arrête aussi le chargement."
  - key: bug-sleep
    format: bug-fix
    question: |-
      Ce service attend toujours 2 secondes, même quand la réponse arrive vite. Quelle correction est la bonne ?
      ```go
      time.Sleep(2 * time.Second)
      select {
      case r := <-reponses:
      	return r, nil
      default:
      	return Reponse{}, ErrDelai
      }
      ```
    choices:
      - {text: "Un `select` entre `reponses` et `time.After(2 * time.Second)`, sans `Sleep`", correct: true}
      - {text: "Réduire le `Sleep` à 200 ms, pour répondre plus vite en moyenne", correct: false}
      - {text: "Garder le `Sleep`, et remplacer `default` par un cas `time.After`", correct: false}
      - {text: "Lancer le `Sleep` dans une goroutine, pour qu'il ne bloque plus", correct: false}
    answer: "```go\nselect {\ncase r := <-reponses:\n\treturn r, nil\ncase <-time.After(2 * time.Second):\n\treturn Reponse{}, ErrDelai\n}\n```\nLe select attend la réponse ou le délai, le premier des deux."
  - key: bug-ticker
    format: bug-fix
    question: |-
      Cette synchronisation périodique continue après l'arrêt du service. Quelle correction est la bonne ?
      ```go
      go func() {
      	for range time.Tick(time.Minute) {
      		synchroniser()
      	}
      }()
      ```
    choices:
      - {text: "Un `time.NewTicker` arrêté par `defer`, et un `select` qui surveille aussi `ctx.Done()`", correct: true}
      - {text: "Remplacer `time.Tick` par `time.After(time.Minute)` dans la boucle `range`", correct: false}
      - {text: "Appeler `runtime.GC()` à l'arrêt, pour libérer le ticker de `time.Tick`", correct: false}
      - {text: "Lancer la boucle sans `go`, pour la lier à la durée de vie du service", correct: false}
    answer: "```go\ngo func() {\n\tt := time.NewTicker(time.Minute)\n\tdefer t.Stop()\n\tfor {\n\t\tselect {\n\t\tcase <-t.C:\n\t\t\tsynchroniser()\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\t}\n\t}\n}()\n```\n`time.Tick` dans une boucle range n'offre aucune condition d'arrêt ; un ticker et le contexte en donnent une."
