notion: channels-nil
lesson: "Un channel **nil** (la valeur zéro d'un type channel) a un comportement particulier :\n\n| Opération | Channel nil |\n|---|---|\n| `ch <- v` | **bloque pour toujours** |\n| `<-ch` | **bloque pour toujours** |\n| `close(ch)` | **panique** (« close of nil channel ») |\n| `len(ch)`, `cap(ch)` | 0 |\n\nBloquer à jamais semble inutile, mais c'est précieux dans un **`select`** : un cas sur un channel nil n'est **jamais\nchoisi**. Mettre un channel à nil **désactive** donc ce cas, sans réécrire le select. L'idiome sert à fusionner deux\nchannels jusqu'à ce que les deux soient fermés :\n\n```go\nfor a != nil || b != nil {\n\tselect {\n\tcase v, ok := <-a:\n\t\tif !ok {\n\t\t\ta = nil // a est fermé : on ne le lit plus\n\t\t\tcontinue\n\t\t}\n\t\tsortie <- v\n\tcase v, ok := <-b:\n\t\tif !ok {\n\t\t\tb = nil\n\t\t\tcontinue\n\t\t}\n\t\tsortie <- v\n\t}\n}\n```\n\nSans cela, un channel fermé serait choisi **en boucle** (il renvoie immédiatement la valeur zéro), et la boucle\ntournerait à vide.\n\nEn dehors d'un select, un channel nil est presque toujours un **bug** : un channel déclaré par `var ch chan T` et jamais\ncréé, qui bloque une goroutine pour toujours.\n\n**Piège classique** : un champ de struct de type channel jamais initialisé ; la première opération bloque\nsilencieusement, ou provoque un interblocage.\n\n**En entretien** : « Un channel nil bloque pour toujours en envoi et en réception, et close panique ; dans un select, le\nmettre à nil désactive un cas, utile pour ne plus lire un channel fermé. »"
cards:
  - key: channel-nil
    format: course
    question: "Que font l'envoi, la réception et `close` sur un channel nil ?"
    choices:
      - {text: "Envoi et réception bloquent pour toujours ; `close` panique", correct: true}
      - {text: "Envoi et réception paniquent ; `close` ne fait rien", correct: false}
      - {text: "L'envoi panique, la réception rend la valeur zéro ; `close` ne fait rien", correct: false}
      - {text: "Envoi et réception renvoient une erreur ; `close` bloque", correct: false}
    answer: "Envoi et réception bloquent pour toujours ; `close` panique (« close of nil channel »). Ce blocage est utile dans un `select`, et un bug partout ailleurs."
  - key: desactiver-cas-select
    format: course
    question: "Comment désactiver un cas d'un `select` sans réécrire la boucle ?"
    choices:
      - {text: "Mettre son channel à nil : ce cas n'est plus jamais choisi", correct: true}
      - {text: "Fermer son channel : un channel fermé n'est plus jamais choisi", correct: false}
      - {text: "Ajouter un cas `default`, prioritaire sur tous les autres cas", correct: false}
      - {text: "Appeler `break` dans ce cas, pour qu'il soit ignoré par la suite", correct: false}
    answer: "Mettre son channel à nil : une opération sur un channel nil ne peut jamais avancer, donc le `select` ne choisit plus ce cas. Un channel fermé, au contraire, est toujours prêt."
  - key: select
    format: course
    question: "Pourquoi mettre à nil un channel fermé dans une boucle `select` ?"
    choices:
      - {text: "Sinon son cas, toujours prêt, serait choisi en boucle avec des valeurs zéro", correct: true}
      - {text: "Pour libérer la mémoire du channel, que le ramasse-miettes garderait sinon", correct: false}
      - {text: "Pour que le `select` panique, au lieu de bloquer pour toujours sur ce cas", correct: false}
      - {text: "Pour rouvrir le channel, qu'on pourra réutiliser au tour de boucle suivant", correct: false}
    answer: "Un cas sur un channel nil n'est jamais choisi : on désactive ainsi la lecture d'un channel fermé, qui sinon serait sélectionné en boucle avec des valeurs zéro."
  - key: bug-habituel
    format: course
    question: "Hors d'un `select`, que signale le plus souvent un channel nil ?"
    choices:
      - {text: "Un bug : un channel déclaré mais jamais créé avec `make`", correct: true}
      - {text: "Un channel fermé, dont toutes les valeurs ont été lues", correct: false}
      - {text: "Un channel vide, qui attend encore son premier envoi", correct: false}
      - {text: "Un channel désactivé exprès, pour mettre fin au programme", correct: false}
    answer: "Un bug : un channel déclaré (champ de structure, `var`) mais jamais créé avec `make`, qui bloque pour toujours la goroutine qui l'utilise. Un channel fermé ou vide n'est pas nil."
  - key: vf-bloque
    format: true-false
    question: Recevoir sur un channel nil bloque pour toujours.
    truth: true
    answer: Comme envoyer.
  - key: vf-close
    format: true-false
    question: '`close` sur un channel nil ne fait rien.'
    truth: false
    answer: 'Il panique : « close of nil channel ».'
  - key: vf-select-nil
    format: true-false
    question: Dans un select, un cas sur un channel nil n'est jamais sélectionné.
    truth: true
    answer: C'est ce qui permet de désactiver un cas.
  - key: vf-ferme
    format: true-false
    question: Un channel fermé et un channel nil se comportent de la même façon en réception.
    truth: false
    answer: Le fermé renvoie immédiatement la valeur zéro ; le nil bloque pour toujours.
  - key: qcm-operations
    format: multiple-choice
    question: "Sur un channel nil, laquelle de ces opérations panique ?"
    choices:
      - {text: "`close(ch)`", correct: true}
      - {text: "`ch <- 1`", correct: false}
      - {text: "`<-ch`", correct: false}
      - {text: "`len(ch)`", correct: false}
    answer: "`close` panique ; l'envoi et la réception bloquent pour toujours, et `len` d'un channel nil vaut 0."
  - key: qcm-fusion
    format: multiple-choice
    question: "Pour fusionner deux channels `a` et `b` dans une boucle `select`, que faire quand `a` est fermé ?"
    choices:
      - {text: "Mettre `a = nil`, et boucler tant que `a` ou `b` n'est pas nil", correct: true}
      - {text: "Fermer `b` aussi, pour que la boucle s'arrête tout de suite", correct: false}
      - {text: "Laisser le cas de `a` actif : il ne sera plus jamais choisi", correct: false}
      - {text: "Sortir de la boucle avec `break`, puisque `b` a fini lui aussi", correct: false}
    answer: "Un channel fermé reste toujours prêt : il serait choisi en boucle. On le met à nil pour désactiver son cas, et l'on s'arrête quand les deux sont nil."
  - key: qcm-ferme-boucle
    format: multiple-choice
    question: "Pourquoi un channel fermé laissé dans un `select` fait-il tourner la boucle à vide ?"
    choices:
      - {text: "Sa réception réussit aussitôt avec la valeur zéro : il est choisi à chaque tour", correct: true}
      - {text: "Le `select` panique à chaque tour, et la panic relance aussitôt la boucle", correct: false}
      - {text: "Le channel se rouvre, puis attend une nouvelle valeur à chaque tour", correct: false}
      - {text: "Le `select` saute ce cas et passe au `default`, à chaque tour de boucle", correct: false}
    answer: "La réception sur un channel fermé réussit immédiatement avec la valeur zéro ; le `select` le choisit donc à chaque tour. D'où l'idiome du channel mis à nil."
  - key: qcm-bug
    format: multiple-choice
    question: "Une goroutine reste bloquée pour toujours sur `s.evenements <- e`. Que vérifier en premier ?"
    choices:
      - {text: "Que le champ `evenements` a bien été créé avec `make`", correct: true}
      - {text: "Que le channel n'a pas été fermé par une autre goroutine", correct: false}
      - {text: "Que `go vet` passe sans avertissement sur ce paquet", correct: false}
      - {text: "Que `GOMAXPROCS` vaut au moins 2 sur cette machine", correct: false}
    answer: "Un champ channel jamais créé vaut nil, et l'envoi y bloque pour toujours ; ensuite, qu'un récepteur existe. Un envoi sur un channel fermé paniquerait au lieu de bloquer."
  - key: code-select-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var jamais chan int
      ch := make(chan int, 1)
      ch <- 5
      select {
      case v := <-jamais:
      	fmt.Println("nil", v)
      case v := <-ch:
      	fmt.Println("ch", v)
      }
      ```
    choices:
      - {text: "`ch 5`", correct: true}
      - {text: "`nil 0`", correct: false}
      - {text: "`ch 0`", correct: false}
      - {text: "Une erreur fatale : all goroutines are asleep - deadlock!", correct: false}
    answer: "`ch 5` : le cas sur le channel nil n'est jamais choisi, et `ch` a une valeur prête dans son tampon."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar jamais chan int\n\tch := make(chan int, 1)\n\tch <- 5\n\tselect {\n\tcase v := <-jamais:\n\t\tfmt.Println(\"nil\", v)\n\tcase v := <-ch:\n\t\tfmt.Println(\"ch\", v)\n\t}\n}\n"
      output: ch 5
  - key: code-fusion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      a, b := make(chan int), make(chan int)
      go func() { defer close(a); a <- 1; a <- 2 }()
      go func() { defer close(b); b <- 10 }()
      total := 0
      for a != nil || b != nil {
      	select {
      	case v, ok := <-a:
      		if !ok {
      			a = nil
      			continue
      		}
      		total += v
      	case v, ok := <-b:
      		if !ok {
      			b = nil
      			continue
      		}
      		total += v
      	}
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`13`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Rien : la boucle ne s'arrête jamais", correct: false}
    answer: "`13` : 1 + 2 + 10. Chaque channel fermé est mis à nil, ce qui désactive son cas, et la boucle s'arrête quand les deux le sont."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ta, b := make(chan int), make(chan int)\n\tgo func() { defer close(a); a <- 1; a <- 2 }()\n\tgo func() { defer close(b); b <- 10 }()\n\ttotal := 0\n\tfor a != nil || b != nil {\n\t\tselect {\n\t\tcase v, ok := <-a:\n\t\t\tif !ok {\n\t\t\t\ta = nil\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttotal += v\n\t\tcase v, ok := <-b:\n\t\t\tif !ok {\n\t\t\t\tb = nil\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttotal += v\n\t\t}\n\t}\n\tfmt.Println(total)\n}\n"
      output: '13'
  - key: code-close-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ch chan int
      fmt.Println(len(ch), cap(ch))
      close(ch)
      ```
    choices:
      - {text: "`0 0`, puis une panic : close of nil channel", correct: true}
      - {text: "`0 0`, puis rien : fermer un channel nil ne fait rien", correct: false}
      - {text: "`0 0`, puis le programme reste bloqué pour toujours", correct: false}
      - {text: "Une panic dès `len(ch)` : invalid memory address", correct: false}
    answer: "`0 0`, puis une panic « close of nil channel » : `len` et `cap` d'un channel nil valent 0, mais le fermer panique."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar ch chan int\n\tfmt.Println(len(ch), cap(ch))\n\tclose(ch)\n}\n"
      output: 0 0
      panics: close of nil channel
  - key: code-reception-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ch chan string
      fmt.Println("avant")
      fmt.Println(<-ch)
      ```
    choices:
      - {text: "`avant`, puis une erreur fatale plus grave qu'une panic : all goroutines are asleep", correct: true}
      - {text: "`avant`, puis une ligne vide : la réception sur nil rend la valeur zéro de `string`", correct: false}
      - {text: "`avant`, puis rien : le programme reste bloqué pour toujours, sans aucun message", correct: false}
      - {text: "Rien : la réception bloque le programme avant même le premier `fmt.Println`", correct: false}
    answer: "`avant`, puis « fatal error: all goroutines are asleep - deadlock! » : la réception sur un channel nil bloque pour toujours, et `main` est la seule goroutine. Elle ne rend jamais la valeur zéro."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar ch chan string\n\tfmt.Println(\"avant\")\n\tfmt.Println(<-ch)\n}\n"
      output: avant
      panics: all goroutines are asleep
  - key: bug-champ
    format: bug-fix
    question: |-
      Le service se bloque dès le premier événement publié. Quelle correction est la bonne ?
      ```go
      type Bus struct {
      	evenements chan Evenement
      }

      func (b *Bus) Publier(e Evenement) { b.evenements <- e }

      var bus Bus
      ```
    choices:
      - {text: "Créer le channel dans un constructeur `NouveauBus`, avec `make`", correct: true}
      - {text: "Passer le récepteur de `Publier` par valeur : `func (b Bus)`", correct: false}
      - {text: "Envoyer dans une goroutine : `go func() { b.evenements <- e }()`", correct: false}
      - {text: "Fermer `b.evenements` avant le premier envoi, pour l'initialiser", correct: false}
    answer: "```go\nfunc NouveauBus(capacite int) *Bus {\n\treturn &Bus{evenements: make(chan Evenement, capacite)}\n}\n```\nLe champ channel valait nil : l'envoi bloquait pour toujours. Un constructeur crée le channel."
  - key: bug-boucle-vide
    format: bug-fix
    question: |-
      La fusion de deux flux occupe 100 % d'un cœur une fois le premier flux terminé. Quelle correction est la bonne ?
      ```go
      for {
      	select {
      	case v := <-a:
      		sortie <- v
      	case v := <-b:
      		sortie <- v
      	}
      }
      ```
    choices:
      - {text: "Lire avec `v, ok`, et mettre à nil le channel fermé pour désactiver son cas", correct: true}
      - {text: "Ajouter un `default` au `select`, pour céder la main quand rien n'arrive", correct: false}
      - {text: "Ajouter un court `time.Sleep` à chaque tour de la boucle `for`", correct: false}
      - {text: "Fermer `sortie` dès que l'un des deux flux est terminé, puis continuer", correct: false}
    answer: "```go\nfor a != nil || b != nil {\n\tselect {\n\tcase v, ok := <-a:\n\t\tif !ok {\n\t\t\ta = nil\n\t\t\tcontinue\n\t\t}\n\t\tsortie <- v\n\tcase v, ok := <-b:\n\t\tif !ok {\n\t\t\tb = nil\n\t\t\tcontinue\n\t\t}\n\t\tsortie <- v\n\t}\n}\nclose(sortie)\n```\nLe channel fermé était choisi en boucle avec des valeurs zéro ; le mettre à nil désactive son cas."
  - key: bug-close-nil
    format: bug-fix
    question: |-
      L'arrêt panique avec « close of nil channel » quand le service n'a jamais démarré. Quelle correction est la bonne ?
      ```go
      func (s *Service) Arreter() { close(s.stop) }
      ```
    choices:
      - {text: "Ne fermer que si `s.stop` n'est pas nil, et une seule fois avec `sync.Once`", correct: true}
      - {text: "Entourer `close` d'un `recover`, pour ignorer la panic quand elle survient", correct: false}
      - {text: "Remplacer `close(s.stop)` par `s.stop = nil`, qui prévient aussi les lecteurs", correct: false}
      - {text: "Envoyer une valeur sur `s.stop` au lieu de le fermer, pour signaler l'arrêt", correct: false}
    answer: "```go\nfunc (s *Service) Arreter() {\n\tif s.stop != nil {\n\t\ts.stopOnce.Do(func() { close(s.stop) })\n\t}\n}\n```\nLe channel n'est créé qu'au démarrage : on vérifie qu'il existe, et `sync.Once` évite une double fermeture."
  - key: bug-desactiver
    format: bug-fix
    question: "Un `select` doit cesser d'envoyer sur `sortie` quand la file `enAttente` est vide, sans réécrire la boucle. Quelle correction est la bonne ?"
    choices:
      - {text: "Envoyer sur une variable `envoi`, nil tant que la file est vide, `sortie` sinon", correct: true}
      - {text: "Fermer `sortie` quand la file est vide, et la rouvrir quand elle se remplit", correct: false}
      - {text: "Ajouter un `default` au `select`, qui saute l'envoi quand la file est vide", correct: false}
      - {text: "Mettre `sortie` à nil une fois pour toutes, dès que la file est vide", correct: false}
    answer: "```go\nvar envoi chan<- Lot // nil : cas désactivé\nif len(enAttente) > 0 {\n\tenvoi = sortie\n}\nselect {\ncase envoi <- enAttente[0]:\n\tenAttente = enAttente[1:]\ncase l := <-entree:\n\tenAttente = append(enAttente, l)\n}\n```\nUn channel nil désactive le cas d'envoi tant que la file est vide."
