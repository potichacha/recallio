notion: channels-bufferises
lesson: |-
  Un channel peut avoir un **tampon** (buffer) d'une capacité fixée à la création :

  ```go
  ch := make(chan int, 3) // jusqu'à 3 valeurs en attente
  ch <- 1                 // ne bloque pas
  ch <- 2
  ch <- 3
  ch <- 4                 // bloque : le tampon est plein
  ```

  | | non bufferisé (`make(chan T)`) | bufferisé (`make(chan T, n)`) |
  |---|---|---|
  | Envoi | bloque jusqu'à une réception | bloque seulement si le tampon est **plein** |
  | Réception | bloque jusqu'à un envoi | bloque seulement si le tampon est **vide** |
  | Synchronisation | forte : émetteur et récepteur se rencontrent | faible : l'émetteur peut prendre de l'avance |

  Quand utiliser un tampon :
  - un **résultat unique** dont le lecteur peut abandonner : `make(chan T, 1)` évite la fuite de l'émetteur ;
  - **absorber des pics** entre un producteur et un consommateur de débits proches ;
  - un **sémaphore** : la capacité limite le nombre de tâches simultanées ;
  - connaître d'avance le nombre de résultats : `make(chan T, len(taches))`.

  Ce que le tampon **ne fait pas** : il ne résout ni un consommateur trop lent (le tampon finit plein) ni un
  interblocage (il le retarde). Une grande capacité « au cas où » cache souvent un problème de conception.

  **Piège classique** : augmenter la capacité d'un channel pour « corriger » un blocage intermittent. Le blocage revient
  sous plus forte charge.

  **En entretien** : « Avec un tampon, l'envoi ne bloque que si c'est plein et la réception que si c'est vide ; utile pour
  un résultat unique, des pics ou un sémaphore ; ce n'est pas une file infinie ni un remède aux interblocages. »
tour:
  - title: Les channels avec tampon
    text: |-
      `make(chan string, 3)` crée un channel avec un **tampon** de trois places. L'envoi ne bloque que si le tampon est
      plein, et la réception que s'il est vide. `len(ch)` donne le nombre de valeurs en attente, `cap(ch)` la taille du
      tampon.

      Un tampon découple l'émetteur du récepteur, mais il ne remplace pas la synchronisation : il ne fait que l'amortir.
      On choisit sa taille pour une raison précise, pas pour « éviter un blocage ».
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	taches := make(chan string, 3)
          	taches <- "compiler"
          	taches <- "tester"
          	fmt.Println(len(taches), cap(taches))

          	fmt.Println(<-taches)
          	fmt.Println(<-taches)
          	fmt.Println(len(taches))
          }
      output: |-
        2 3
        compiler
        tester
        0
cards:
  - key: channel-bufferise-vs-non-bufferise
    format: course
    question: Channel bufferisé vs non bufferisé ?
    answer: Le non bufferisé synchronise émetteur et récepteur (rendez-vous) ; le bufferisé ne bloque que plein ou vide.
  - key: resultat-unique
    format: course
    question: Pourquoi un channel de résultat unique a-t-il souvent une capacité de 1 ?
    answer: Pour que l'émetteur puisse envoyer et se terminer même si le lecteur a abandonné (délai dépassé), au lieu de rester bloqué pour toujours.
  - key: pas-remede
    format: course
    question: Augmenter la capacité d'un channel corrige-t-il un interblocage ?
    answer: 'Non : cela le retarde ou le rend plus rare ; il faut corriger la conception (qui lit, qui ferme, qui attend qui).'
  - key: quand
    format: course
    question: Dans quels cas un channel bufferisé est-il utile ?
    answer: Un résultat unique que le lecteur peut abandonner, l'absorption de pics entre producteur et consommateur, un sémaphore, ou un nombre de résultats connu d'avance.
  - key: vf-plein
    format: true-false
    question: Un envoi sur un channel bufferisé bloque seulement quand le tampon est plein.
    truth: true
    answer: Sinon il dépose la valeur et continue.
  - key: vf-infini
    format: true-false
    question: Un channel bufferisé peut grandir indéfiniment si le consommateur est lent.
    truth: false
    answer: Sa capacité est fixée à la création ; plein, il bloque l'émetteur.
  - key: vf-ordre
    format: true-false
    question: Un channel bufferisé délivre les valeurs dans leur ordre d'envoi (FIFO).
    truth: true
    answer: C'est une file, pour un émetteur donné.
  - key: vf-synchro
    format: true-false
    question: Un channel bufferisé synchronise aussi fortement qu'un channel non bufferisé.
    truth: false
    answer: L'émetteur peut prendre de l'avance tant que le tampon n'est pas plein.
  - key: qcm-bloque
    format: multiple-choice
    question: Avec `ch := make(chan int, 2)`, quelles opérations bloquent dans une seule goroutine ?
    choices:
      - text: Un troisième envoi sans réception entre-temps
        correct: true
      - text: Une réception sur le channel vide
        correct: true
      - text: Le premier envoi
        correct: false
      - text: Le deuxième envoi
        correct: false
    answer: Deux envois passent ; le troisième attend une place.
  - key: qcm-capacite
    format: multiple-choice
    question: Quelle capacité choisir pour collecter exactement les résultats de 10 tâches ?
    choices:
      - text: 10, pour qu'aucune tâche ne bloque à l'envoi
        correct: true
      - text: 0 avec un lecteur qui reçoit les 10 résultats en parallèle
        correct: true
      - text: 1 000 000, par sécurité
        correct: false
      - text: Une capacité négative pour une file infinie
        correct: false
    answer: Une capacité démesurée gaspille et masque les erreurs.
  - key: qcm-difference
    format: multiple-choice
    question: Quelles différences entre un channel bufferisé et un non bufferisé ?
    choices:
      - text: Le bufferisé laisse l'émetteur prendre de l'avance
        correct: true
      - text: Le non bufferisé fait se rencontrer émetteur et récepteur
        correct: true
      - text: Seul le non bufferisé peut être fermé
        correct: false
      - text: Seul le bufferisé est sûr entre goroutines
        correct: false
    answer: Les deux se ferment et sont sûrs entre goroutines.
  - key: trous-capacite
    format: fill-in
    question: |-
      Complétez pour un résultat unique que le lecteur peut abandonner :
      ```go
      res := make(chan Resultat, ___)
      ```
    blanks:
      - - '1'
    answer: L'envoi réussira même sans lecteur.
  - key: trous-len
    format: fill-in
    question: |-
      Complétez pour connaître le nombre de valeurs en attente :
      ```go
      enAttente := ___(file)
      ```
    blanks:
      - - len
    answer: '`len` donne le remplissage du tampon, `cap` sa capacité.'
  - key: trous-cap
    format: fill-in
    question: |-
      Complétez pour créer un channel qui peut contenir un résultat par tâche :
      ```go
      res := make(chan int, ___(taches))
      ```
    blanks:
      - - len
    answer: Aucune tâche ne bloquera à l'envoi.
  - key: trous-non-bufferise
    format: fill-in
    question: |-
      Complétez pour un channel sans tampon :
      ```go
      synchro := make(chan bool___
      ```
    blanks:
      - - )
    answer: Sans second argument, la capacité est nulle.
  - key: code-avance
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      ch <- 3
      fmt.Println(<-ch, <-ch, len(ch))
      ```
    answer: '`1 2 1` : trois envois sans récepteur, puis deux réceptions dans l''ordre ; il reste une valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tfmt.Println(<-ch, <-ch, len(ch))\n}\n"
      output: 1 2 1
  - key: code-plein
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 1)
      ch <- 1
      ch <- 2
      fmt.Println("jamais")
      ```
    answer: '« all goroutines are asleep - deadlock! » : le second envoi bloque, le tampon est plein.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 1)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(\"jamais\")\n}\n"
      panics: all goroutines are asleep
  - key: code-resultat
    format: code-output
    question: "```go\nres := make(chan string, 1)\ngo func() {\n\ttime.Sleep(50 * time.Millisecond)\n\tres <- \"trop tard\"\n}()\nselect {\ncase r := <-res:\n\tfmt.Println(r)\ncase <-time.After(10 * time.Millisecond):\n\tfmt.Println(\"délai dépassé\")\n}\ntime.Sleep(100 * time.Millisecond)\nfmt.Println(len(res))\n```"
    answer: '`délai dépassé` puis `1` : grâce au tampon, l''émetteur a pu déposer son résultat et se terminer.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tres := make(chan string, 1)\n\tgo func() {\n\t\ttime.Sleep(50 * time.Millisecond)\n\t\tres <- \"trop tard\"\n\t}()\n\tselect {\n\tcase r := <-res:\n\t\tfmt.Println(r)\n\tcase <-time.After(10 * time.Millisecond):\n\t\tfmt.Println(\"délai dépassé\")\n\t}\n\ttime.Sleep(100 * time.Millisecond)\n\tfmt.Println(len(res))\n}\n"
      output: |-
        délai dépassé
        1
  - key: code-file
    format: code-output
    question: "```go\nch := make(chan string, 3)\nfor _, m := range []string{\"a\", \"b\", \"c\"} {\n\tch <- m\n}\nclose(ch)\nfor m := range ch {\n\tfmt.Print(m)\n}\nfmt.Println()\n```"
    answer: '`abc` : le tampon se vide dans l''ordre, même après la fermeture.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan string, 3)\n\tfor _, m := range []string{\"a\", \"b\", \"c\"} {\n\t\tch <- m\n\t}\n\tclose(ch)\n\tfor m := range ch {\n\t\tfmt.Print(m)\n\t}\n\tfmt.Println()\n}\n"
      output: abc
  - key: bug-capacite
    format: bug-fix
    question: |-
      Le service se bloque sous forte charge ; un collègue propose de passer la capacité de 100 à 100 000 :
      ```go
      evenements := make(chan Evenement, 100)
      ```
    answer: "```go\nevenements := make(chan Evenement, 100)\n\nselect {\ncase evenements <- e:\ncase <-ctx.Done():\n\treturn ctx.Err()\ndefault:\n\tevenementsPerdus.Inc() // ou attendre, selon la politique choisie\n}\n```\nUn tampon plus grand retarde seulement le blocage : le consommateur est plus lent que le producteur. On décide\nexplicitement quoi faire quand c'est plein (abandonner, ralentir, paralléliser le consommateur) et l'on mesure."
  - key: bug-fuite
    format: bug-fix
    question: "Chaque requête qui expire laisse une goroutine bloquée :\n```go\nres := make(chan Profil)\ngo func() { res <- charger(id) }()\nselect {\ncase p := <-res:\n\treturn p, nil\ncase <-time.After(time.Second):\n\treturn Profil{}, ErrDelai\n}\n```"
    answer: |-
      ```go
      res := make(chan Profil, 1)
      ```
      Sans tampon, l'envoi attendait un lecteur parti ; avec une capacité de 1, il réussit et la goroutine se termine.
  - key: bug-meme-goroutine
    format: bug-fix
    question: "Ce code se bloque au troisième envoi :\n```go\nch := make(chan int, 2)\nfor i := range 5 {\n\tch <- i\n}\nfor range 5 {\n\tfmt.Println(<-ch)\n}\n```"
    answer: "```go\nch := make(chan int, 2)\ngo func() {\n\tdefer close(ch)\n\tfor i := range 5 {\n\t\tch <- i\n\t}\n}()\nfor v := range ch {\n\tfmt.Println(v)\n}\n```\nLe tampon de 2 était plein ; le producteur doit tourner dans une autre goroutine que le consommateur."
  - key: bug-synchro
    format: bug-fix
    question: |-
      Un test suppose que le travail est fait dès que l'envoi a réussi, mais il échoue parfois :
      ```go
      travaux := make(chan Travail, 10)
      travaux <- t // le worker l'exécutera « tout de suite »
      verifierFait(t)
      ```
    answer: |-
      ```go
      fait := make(chan struct{})
      travaux <- Travail{Tache: t, Fait: fait}
      <-fait
      verifierFait(t)
      ```
      Avec un tampon, l'envoi réussit sans que le worker ait commencé ; on attend un signal explicite de fin.
  - key: qcm-pics
    format: multiple-choice
    question: Que permet un tampon entre un producteur et un consommateur de débits moyens égaux ?
    choices:
      - text: Absorber des pics passagers sans bloquer le producteur
        correct: true
      - text: Rien si le consommateur est durablement plus lent
        correct: true
      - text: Accélérer le consommateur
        correct: false
      - text: Supprimer le besoin de fermer le channel
        correct: false
    answer: Le tampon lisse les variations, pas un déséquilibre durable.
