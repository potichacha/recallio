notion: channels-bufferises
lesson: |-
  Un channel peut avoir un **tampon** (buffer) d'une capacité fixée à la création :

  ```go
  ch := make(chan int, 3) // jusqu'à 3 valeurs en attente
  ch <- 1                 // ne bloque pas
  ch <- 2
  ch <- 3
  ch <- 4                 // bloque : le tampon est plein
  ```

  | | non bufferisé (`make(chan T)`) | bufferisé (`make(chan T, n)`) |
  |---|---|---|
  | Envoi | bloque jusqu'à une réception | bloque seulement si le tampon est **plein** |
  | Réception | bloque jusqu'à un envoi | bloque seulement si le tampon est **vide** |
  | Synchronisation | forte : émetteur et récepteur se rencontrent | faible : l'émetteur peut prendre de l'avance |

  Quand utiliser un tampon :
  - un **résultat unique** dont le lecteur peut abandonner : `make(chan T, 1)` évite la fuite de l'émetteur ;
  - **absorber des pics** entre un producteur et un consommateur de débits proches ;
  - un **sémaphore** : la capacité limite le nombre de tâches simultanées ;
  - connaître d'avance le nombre de résultats : `make(chan T, len(taches))`.

  Ce que le tampon **ne fait pas** : il ne résout ni un consommateur trop lent (le tampon finit plein) ni un
  interblocage (il le retarde). Une grande capacité « au cas où » cache souvent un problème de conception.

  **Piège classique** : augmenter la capacité d'un channel pour « corriger » un blocage intermittent. Le blocage revient
  sous plus forte charge.

  **En entretien** : « Avec un tampon, l'envoi ne bloque que si c'est plein et la réception que si c'est vide ; utile pour
  un résultat unique, des pics ou un sémaphore ; ce n'est pas une file infinie ni un remède aux interblocages. »
tour:
  - title: Les channels avec tampon
    text: |-
      `make(chan string, 3)` crée un channel avec un **tampon** de trois places. L'envoi ne bloque que si le tampon est
      plein, et la réception que s'il est vide. `len(ch)` donne le nombre de valeurs en attente, `cap(ch)` la taille du
      tampon.

      Un tampon découple l'émetteur du récepteur, mais il ne remplace pas la synchronisation : il ne fait que l'amortir.
      On choisit sa taille pour une raison précise, pas pour « éviter un blocage ».
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	taches := make(chan string, 3)
          	taches <- "compiler"
          	taches <- "tester"
          	fmt.Println(len(taches), cap(taches))

          	fmt.Println(<-taches)
          	fmt.Println(<-taches)
          	fmt.Println(len(taches))
          }
      output: |-
        2 3
        compiler
        tester
        0
cards:
  - key: channel-bufferise-vs-non-bufferise
    format: course
    question: "Quelle différence entre un channel bufferisé et un channel non bufferisé ?"
    choices:
      - {text: "Le non bufferisé fait se rencontrer émetteur et récepteur ; le bufferisé ne bloque que plein ou vide", correct: true}
      - {text: "Le bufferisé est sûr entre goroutines ; le non bufferisé exige un verrou autour de chaque envoi", correct: false}
      - {text: "Le non bufferisé perd les valeurs que personne ne lit ; le bufferisé les garde jusqu'à leur lecture", correct: false}
      - {text: "Le bufferisé se ferme tout seul quand il est vide ; le non bufferisé doit être fermé par `close`", correct: false}
    answer: "Le non bufferisé synchronise émetteur et récepteur, qui se rencontrent ; le bufferisé ne bloque l'émetteur que plein, et le récepteur que vide. Les deux sont sûrs entre goroutines et se ferment de la même façon."
  - key: resultat-unique
    format: course
    question: "Pourquoi un channel de résultat unique a-t-il souvent une capacité de 1 ?"
    choices:
      - {text: "Pour que l'émetteur dépose sa valeur et se termine, même si le lecteur est parti", correct: true}
      - {text: "Pour que le lecteur ne bloque jamais, même s'il lit avant l'envoi du résultat", correct: false}
      - {text: "Pour garantir que le résultat soit lu une seule fois, et jamais deux fois", correct: false}
      - {text: "Pour pouvoir fermer le channel avant même que le résultat soit envoyé", correct: false}
    answer: "Pour que l'émetteur puisse envoyer et se terminer même si le lecteur a abandonné (délai dépassé), au lieu de rester bloqué pour toujours. Le lecteur, lui, bloque toujours tant que le channel est vide."
  - key: pas-remede
    format: course
    question: "Augmenter la capacité d'un channel corrige-t-il un interblocage ?"
    choices:
      - {text: "Non : cela le retarde ou le rend plus rare ; c'est la conception qu'il faut revoir", correct: true}
      - {text: "Oui : un tampon assez grand pour toutes les valeurs le supprime à coup sûr", correct: false}
      - {text: "Oui, à condition de doubler la capacité à chaque blocage observé en production", correct: false}
      - {text: "Non, car un interblocage vient toujours d'un verrou, jamais d'un channel", correct: false}
    answer: "Non : un tampon plus grand retarde le blocage ou le rend plus rare, sans le supprimer. On corrige la conception : qui lit, qui ferme, qui attend qui."
  - key: quand
    format: course
    question: "Dans lequel de ces cas un channel bufferisé est-il le bon choix ?"
    choices:
      - {text: "Un résultat unique, que le lecteur peut abandonner sur un délai dépassé", correct: true}
      - {text: "Synchroniser deux goroutines en un point de rencontre précis", correct: false}
      - {text: "Absorber un consommateur durablement plus lent que son producteur", correct: false}
      - {text: "Signaler la fin d'un travail à plusieurs goroutines à la fois", correct: false}
    answer: "Un résultat unique que le lecteur peut abandonner, mais aussi un pic entre producteur et consommateur, un sémaphore, ou un nombre de résultats connu d'avance. Un tampon ne compense pas un consommateur durablement plus lent ; un signal à plusieurs se fait en fermant un channel."
  - key: vf-plein
    format: true-false
    question: Un envoi sur un channel bufferisé bloque seulement quand le tampon est plein.
    truth: true
    answer: Sinon il dépose la valeur et continue.
  - key: vf-infini
    format: true-false
    question: Un channel bufferisé peut grandir indéfiniment si le consommateur est lent.
    truth: false
    answer: Sa capacité est fixée à la création ; plein, il bloque l'émetteur.
  - key: vf-ordre
    format: true-false
    question: Un channel bufferisé délivre les valeurs dans leur ordre d'envoi (FIFO).
    truth: true
    answer: C'est une file, pour un émetteur donné.
  - key: vf-synchro
    format: true-false
    question: Un channel bufferisé synchronise aussi fortement qu'un channel non bufferisé.
    truth: false
    answer: L'émetteur peut prendre de l'avance tant que le tampon n'est pas plein.
  - key: qcm-bloque
    format: multiple-choice
    question: "Dans une seule goroutine, après `ch := make(chan int, 2)`, laquelle de ces suites d'opérations bloque ?"
    choices:
      - {text: "Deux envois, puis un troisième sans réception", correct: true}
      - {text: "Un envoi, puis une réception", correct: false}
      - {text: "Deux envois, puis deux réceptions", correct: false}
      - {text: "Deux envois, une réception, puis un envoi", correct: false}
    answer: "Le tampon tient deux valeurs : le troisième envoi attend une place, que personne ne libérera. Une réception sur le channel vide bloquerait aussi."
  - key: qcm-capacite
    format: multiple-choice
    question: "Pour collecter les résultats de 10 tâches sans qu'aucune ne bloque à l'envoi, quelle capacité choisir ?"
    choices:
      - {text: "10, une place par tâche", correct: true}
      - {text: "1, puisqu'on lit un résultat à la fois", correct: false}
      - {text: "0, la capacité par défaut de `make`", correct: false}
      - {text: "1 000 000, par sécurité", correct: false}
    answer: "Une place par tâche : chacune dépose son résultat et se termine. Une capacité démesurée gaspille et masque les erreurs ; 0 marche aussi, mais seulement avec un lecteur qui reçoit en même temps."
  - key: qcm-difference
    format: multiple-choice
    question: "Laquelle de ces différences entre channel bufferisé et non bufferisé est exacte ?"
    choices:
      - {text: "Le bufferisé laisse l'émetteur prendre de l'avance sur le récepteur", correct: true}
      - {text: "Seul le non bufferisé peut être fermé par un appel à `close`", correct: false}
      - {text: "Seul le bufferisé est sûr entre plusieurs goroutines à la fois", correct: false}
      - {text: "Seul le non bufferisé livre les valeurs dans leur ordre d'envoi", correct: false}
    answer: "Le bufferisé laisse l'émetteur prendre de l'avance ; le non bufferisé fait se rencontrer émetteur et récepteur. Les deux se ferment, sont sûrs entre goroutines et gardent l'ordre d'envoi."
  - key: trous-capacite
    format: fill-in
    question: |-
      Complète pour un résultat unique que le lecteur peut abandonner :
      ```go
      res := make(chan Resultat, ___)
      ```
    blanks:
      - - '1'
    answer: L'envoi réussira même sans lecteur.
  - key: trous-len
    format: fill-in
    question: |-
      Complète pour connaître le nombre de valeurs en attente :
      ```go
      enAttente := ___(file)
      ```
    blanks:
      - - len
    answer: '`len` donne le remplissage du tampon, `cap` sa capacité.'
  - key: trous-cap
    format: fill-in
    question: |-
      Complète pour créer un channel qui peut contenir un résultat par tâche :
      ```go
      res := make(chan int, ___(taches))
      ```
    blanks:
      - - len
    answer: Aucune tâche ne bloquera à l'envoi.
  - key: trous-non-bufferise
    format: fill-in
    question: |-
      Complète pour un channel sans tampon :
      ```go
      synchro := make(chan bool___
      ```
    blanks:
      - - )
    answer: Sans second argument, la capacité est nulle.
  - key: code-avance
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 3)
      ch <- 1
      ch <- 2
      ch <- 3
      fmt.Println(<-ch, <-ch, len(ch))
      ```
    choices:
      - {text: "`1 2 1`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`3 2 1`", correct: false}
      - {text: "`1 2 0`", correct: false}
    answer: "`1 2 1` : trois envois sans récepteur tiennent dans le tampon, puis deux réceptions dans l'ordre d'envoi ; il reste une valeur, d'où `len(ch)` égal à 1."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 3)\n\tch <- 1\n\tch <- 2\n\tch <- 3\n\tfmt.Println(<-ch, <-ch, len(ch))\n}\n"
      output: 1 2 1
  - key: code-plein
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 1)
      ch <- 1
      ch <- 2
      fmt.Println("jamais")
      ```
    choices:
      - {text: "Une erreur fatale, plus grave qu'une panic : `all goroutines are asleep - deadlock!`", correct: true}
      - {text: "`jamais` : le second envoi écrase la première valeur gardée dans le tampon", correct: false}
      - {text: "`jamais` : le tampon s'agrandit tout seul pour accueillir la seconde valeur", correct: false}
      - {text: "Rien : le programme reste bloqué pour toujours, sans afficher de message", correct: false}
    answer: "« fatal error: all goroutines are asleep - deadlock! » : le second envoi bloque, le tampon d'une place est plein et aucune autre goroutine ne lit. Un tampon ne grandit jamais."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 1)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(\"jamais\")\n}\n"
      panics: all goroutines are asleep
  - key: code-resultat
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      res := make(chan string, 1)
      go func() {
      	time.Sleep(50 * time.Millisecond)
      	res <- "trop tard"
      }()
      select {
      case r := <-res:
      	fmt.Println(r)
      case <-time.After(10 * time.Millisecond):
      	fmt.Println("délai dépassé")
      }
      time.Sleep(100 * time.Millisecond)
      fmt.Println(len(res))
      ```
    choices:
      - text: |-
          ```
          délai dépassé
          1
          ```
        correct: true
      - text: |-
          ```
          délai dépassé
          0
          ```
        correct: false
      - text: |-
          ```
          trop tard
          0
          ```
        correct: false
      - {text: "`délai dépassé`", correct: false}
    answer: "`délai dépassé` puis `1` : le délai de 10 ms passe avant le résultat, et grâce au tampon, l'émetteur a pu déposer son résultat et se terminer. Sans tampon, il serait resté bloqué."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tres := make(chan string, 1)\n\tgo func() {\n\t\ttime.Sleep(50 * time.Millisecond)\n\t\tres <- \"trop tard\"\n\t}()\n\tselect {\n\tcase r := <-res:\n\t\tfmt.Println(r)\n\tcase <-time.After(10 * time.Millisecond):\n\t\tfmt.Println(\"délai dépassé\")\n\t}\n\ttime.Sleep(100 * time.Millisecond)\n\tfmt.Println(len(res))\n}\n"
      output: |-
        délai dépassé
        1
  - key: code-file
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan string, 3)
      for _, m := range []string{"a", "b", "c"} {
      	ch <- m
      }
      close(ch)
      for m := range ch {
      	fmt.Print(m)
      }
      fmt.Println()
      ```
    choices:
      - {text: "`abc`", correct: true}
      - {text: "`cba`", correct: false}
      - {text: "`a`", correct: false}
      - {text: "Rien : un channel fermé ne livre plus aucune valeur", correct: false}
    answer: "`abc` : le tampon se vide dans l'ordre, même après la fermeture ; `range` ne s'arrête qu'une fois le channel fermé et vide."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan string, 3)\n\tfor _, m := range []string{\"a\", \"b\", \"c\"} {\n\t\tch <- m\n\t}\n\tclose(ch)\n\tfor m := range ch {\n\t\tfmt.Print(m)\n\t}\n\tfmt.Println()\n}\n"
      output: abc
  - key: bug-capacite
    format: bug-fix
    question: |-
      Le service se bloque sous forte charge ; un collègue propose de passer la capacité de 100 à 100 000. Que lui réponds-tu ?
      ```go
      evenements := make(chan Evenement, 100)
      ```
    choices:
      - {text: "Non : le consommateur est trop lent ; décide quoi faire quand c'est plein, et mesure", correct: true}
      - {text: "Oui : 100 000 places absorbent tous les pics, et le blocage disparaît pour de bon", correct: false}
      - {text: "Oui, et mieux encore : un tampon sans limite, avec une slice qui grandit au besoin", correct: false}
      - {text: "Non : un channel non bufferisé, plus rapide, suffit à tenir une forte charge", correct: false}
    answer: "```go\nevenements := make(chan Evenement, 100)\n\nselect {\ncase evenements <- e:\ncase <-ctx.Done():\n\treturn ctx.Err()\ndefault:\n\tevenementsPerdus.Inc() // ou attendre, selon la politique choisie\n}\n```\nUn tampon plus grand retarde seulement le blocage : le consommateur est plus lent que le producteur. On décide\nexplicitement quoi faire quand c'est plein (abandonner, ralentir, paralléliser le consommateur) et l'on mesure."
  - key: bug-fuite
    format: bug-fix
    question: |-
      Chaque requête qui expire laisse une goroutine bloquée. Quelle correction est la bonne ?
      ```go
      res := make(chan Profil)
      go func() { res <- charger(id) }()
      select {
      case p := <-res:
      	return p, nil
      case <-time.After(time.Second):
      	return Profil{}, ErrDelai
      }
      ```
    choices:
      - {text: "Créer `res` avec une capacité de 1, pour que l'envoi réussisse sans lecteur", correct: true}
      - {text: "Fermer `res` dans la branche du délai, avant de renvoyer l'erreur `ErrDelai`", correct: false}
      - {text: "Ajouter une branche `default` au `select`, pour ne jamais attendre le résultat", correct: false}
      - {text: "Remplacer `time.After` par un `time.Sleep(time.Second)` placé avant le `select`", correct: false}
    answer: |-
      ```go
      res := make(chan Profil, 1)
      ```
      Sans tampon, l'envoi attendait un lecteur parti ; avec une capacité de 1, il réussit et la goroutine se termine. Fermer `res` dans la branche du délai ferait paniquer l'envoi (« send on closed channel »).
  - key: bug-meme-goroutine
    format: bug-fix
    question: |-
      Ce code se bloque au troisième envoi. Quelle correction est la bonne ?
      ```go
      ch := make(chan int, 2)
      for i := range 5 {
      	ch <- i
      }
      for range 5 {
      	fmt.Println(<-ch)
      }
      ```
    choices:
      - {text: "Produire dans une autre goroutine, qui ferme le channel, et lire avec `range`", correct: true}
      - {text: "Passer la capacité à 3, la place qui manquait au troisième envoi", correct: false}
      - {text: "Fermer le channel après le deuxième envoi, pour libérer le tampon", correct: false}
      - {text: "Remplacer le tampon de 2 par un channel non bufferisé, sans capacité", correct: false}
    answer: "```go\nch := make(chan int, 2)\ngo func() {\n\tdefer close(ch)\n\tfor i := range 5 {\n\t\tch <- i\n\t}\n}()\nfor v := range ch {\n\tfmt.Println(v)\n}\n```\nLe tampon de 2 était plein ; le producteur doit tourner dans une autre goroutine que le consommateur."
  - key: bug-synchro
    format: bug-fix
    question: |-
      Un test suppose que le travail est fait dès que l'envoi a réussi, mais il échoue parfois. Quelle correction est la bonne ?
      ```go
      travaux := make(chan Travail, 10)
      travaux <- t // le worker l'exécutera « tout de suite »
      verifierFait(t)
      ```
    choices:
      - {text: "Joindre au travail un channel `fait` que le worker ferme à la fin, et l'attendre", correct: true}
      - {text: "Rendre `travaux` non bufferisé, pour que l'envoi attende la fin du travail", correct: false}
      - {text: "Attendre que `len(travaux)` vaille 0 avant d'appeler `verifierFait(t)`", correct: false}
      - {text: "Ajouter un court `time.Sleep` entre l'envoi et l'appel à `verifierFait(t)`", correct: false}
    answer: |-
      ```go
      fait := make(chan struct{})
      travaux <- Travail{Tache: t, Fait: fait}
      <-fait
      verifierFait(t)
      ```
      Avec un tampon, l'envoi réussit sans que le worker ait commencé ; on attend un signal explicite de fin. Même sans tampon, l'envoi n'attendrait que la réception, pas la fin du travail.
  - key: qcm-pics
    format: multiple-choice
    question: "Que permet un tampon entre un producteur et un consommateur de même débit moyen ?"
    choices:
      - {text: "Absorber des pics passagers sans bloquer le producteur", correct: true}
      - {text: "Accélérer durablement le traitement du consommateur", correct: false}
      - {text: "Se passer de fermer le channel à la fin de la production", correct: false}
      - {text: "Garder les valeurs en attente si le programme redémarre", correct: false}
    answer: "Le tampon lisse les variations passagères ; il ne fait rien contre un consommateur durablement plus lent, qui finit par le remplir. Il vit en mémoire et ne survit pas à un redémarrage."
