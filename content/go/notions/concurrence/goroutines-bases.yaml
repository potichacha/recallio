notion: goroutines-bases
lesson: "Une **goroutine** est une fonction qui s'exécute **de façon concurrente**, lancée avec le mot-clé **`go`** :\n\n```go\ngo envoyerCourriel(c)          // lance et continue sans attendre\ngo func() {                    // une fonction anonyme\n\tresultat <- calculer()\n}()\n```\n\n- Elle est gérée par le **runtime de Go**, pas par le système : elle démarre avec une **petite pile** (quelques Ko) qui\n  grandit au besoin, et l'ordonnanceur répartit des milliers (voire des millions) de goroutines sur quelques threads\n  système. Créer une goroutine coûte environ une microseconde.\n- `go f(x)` **évalue les arguments tout de suite**, puis lance `f` ; on ne récupère **aucune valeur de retour** : les\n  résultats passent par un channel, une variable protégée ou un `errgroup`.\n- Quand **`main` se termine**, le programme s'arrête, **sans attendre** les autres goroutines.\n- Une goroutine **ne peut pas être tuée** de l'extérieur : on lui demande de s'arrêter (un `context`, un channel fermé)\n  et elle s'arrête d'elle-même.\n- L'ordre d'exécution entre goroutines n'est **pas garanti** : sans synchronisation, on ne sait pas qui s'exécute en\n  premier.\n\n**Concurrence n'est pas parallélisme** (Rob Pike) : la concurrence est une façon de **structurer** un programme en tâches\nindépendantes ; le parallélisme est leur exécution **simultanée** sur plusieurs cœurs. Un programme concurrent peut\ntourner sur un seul cœur.\n\n**Piège classique** : lancer une goroutine dans `main` puis laisser `main` se terminer ; la goroutine n'a pas le temps\nde s'exécuter, et rien ne s'affiche.\n\n**En entretien** : « go f() lance une fonction concurrente légère, gérée par le runtime ; pas de valeur de retour ni de\nmoyen de la tuer ; main n'attend personne ; la concurrence structure, le parallélisme exécute en même temps. »"
tour:
  - title: Les goroutines
    text: |-
      Le mot-clé `go` lance un appel de fonction dans une **goroutine** : une fonction qui s'exécute en même temps que
      le reste du programme. Une goroutine ne coûte que quelques kilo-octets : on en lance des milliers sans souci.

      `main` n'attend pas les goroutines : quand `main` se termine, le programme s'arrête, goroutines comprises. Il faut
      donc **synchroniser** ; ici, un channel, présenté un peu plus loin, rapporte chaque résultat.

      La **concurrence** organise des tâches qui avancent indépendamment ; le **parallélisme** les exécute au même
      instant, sur plusieurs cœurs. Go fait de la concurrence, et le runtime en tire du parallélisme quand la machine le
      permet.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func carre(n int, resultats chan int) {
          	resultats <- n * n
          }

          func main() {
          	resultats := make(chan int)
          	for n := 1; n <= 3; n++ {
          		go carre(n, resultats)
          	}
          	somme := 0
          	for range 3 {
          		somme += <-resultats
          	}
          	fmt.Println("somme des carrés :", somme)
          }
      output: |-
        somme des carrés : 14
cards:
  - key: goroutine
    format: course
    question: C'est quoi une goroutine ?
    answer: Une fonction exécutée de façon concurrente, gérée par le runtime Go, avec une petite pile extensible.
  - key: goroutine-vs-thread-os
    format: course
    question: Goroutine vs thread de l'OS ?
    answer: La goroutine est bien plus légère, ordonnancée par le runtime sur un petit nombre de threads.
  - key: concurrence-vs-parallelisme
    format: course
    question: Concurrence vs parallélisme ?
    answer: Structurer en tâches indépendantes vs les exécuter simultanément sur plusieurs cœurs.
  - key: passe-goroutines-quand-main-termine
    format: course
    question: Que se passe-t-il pour les goroutines quand main se termine ?
    answer: Le programme s'arrête sans les attendre.
  - key: goroutine-etre-tuee-exterieur
    format: course
    question: Une goroutine peut-elle être tuée de l'extérieur ?
    answer: Non, elle doit s'arrêter elle-même, en général en surveillant un contexte.
  - key: definition-goroutine
    format: definition
    question: goroutine
    answer: Fonction concurrente légère gérée par le runtime
  - key: arguments
    format: course
    question: Quand les arguments de `go f(x)` sont-ils évalués ?
    answer: Tout de suite, au moment de l'instruction `go` ; seule l'exécution de `f` est concurrente.
  - key: vf-main-attend
    format: true-false
    question: Le programme attend la fin de toutes les goroutines avant de s'arrêter.
    truth: false
    answer: Il s'arrête dès que `main` se termine ; il faut synchroniser explicitement.
  - key: vf-retour
    format: true-false
    question: '`resultat := go calculer()` récupère la valeur renvoyée par la goroutine.'
    truth: false
    answer: Une goroutine ne renvoie rien ; on passe par un channel ou une variable synchronisée.
  - key: vf-legere
    format: true-false
    question: Une goroutine démarre avec une pile de quelques kilo-octets.
    truth: true
    answer: Elle grandit au besoin ; on peut en lancer des centaines de milliers.
  - key: vf-ordre
    format: true-false
    question: Deux goroutines lancées l'une après l'autre s'exécutent dans cet ordre.
    truth: false
    answer: L'ordonnanceur ne garantit aucun ordre sans synchronisation.
  - key: qcm-lancer
    format: multiple-choice
    question: Quelles instructions lancent une goroutine ?
    choices:
      - text: '`go traiter(job)`'
        correct: true
      - text: '`go func() { traiter(job) }()`'
        correct: true
      - text: '`go traiter`'
        correct: false
      - text: '`async traiter(job)`'
        correct: false
    answer: '`go` doit être suivi d''un appel de fonction.'
  - key: qcm-arreter
    format: multiple-choice
    question: Comment arrêter une goroutine depuis l'extérieur ?
    choices:
      - text: Annuler un `context.Context` qu'elle surveille
        correct: true
      - text: Fermer un channel qu'elle écoute
        correct: true
      - text: L'appeler avec `kill(g)`
        correct: false
      - text: '`runtime.Goexit(g)`'
        correct: false
    answer: Une goroutine s'arrête d'elle-même ; on lui envoie un signal.
  - key: qcm-concurrence
    format: multiple-choice
    question: Que signifie « la concurrence n'est pas le parallélisme » ?
    choices:
      - text: La concurrence structure un programme en tâches indépendantes
        correct: true
      - text: Le parallélisme exécute des tâches en même temps sur plusieurs cœurs
        correct: true
      - text: Un programme concurrent tourne forcément sur plusieurs cœurs
        correct: false
      - text: Go ne sait pas faire de parallélisme
        correct: false
    answer: Un programme concurrent peut aussi tourner sur un seul cœur.
  - key: qcm-resultat
    format: multiple-choice
    question: Comment récupérer le résultat d'une goroutine ?
    choices:
      - text: Par un channel qu'elle remplit
        correct: true
      - text: Avec `errgroup` et une variable écrite par la goroutine, lue après `Wait`
        correct: true
      - text: Avec la valeur de retour de `go f()`
        correct: false
      - text: En lisant une variable sans synchronisation
        correct: false
    answer: Une lecture non synchronisée est une data race.
  - key: trous-go
    format: fill-in
    question: |-
      Complétez pour envoyer le courriel sans attendre :
      ```go
      ___ envoyerCourriel(c)
      ```
    blanks:
      - - go
    answer: Le mot-clé `go` lance une goroutine.
  - key: trous-anonyme
    format: fill-in
    question: "Complétez la goroutine anonyme :\n```go\ngo func() {\n\tresultats <- calculer()\n}___\n```"
    blanks:
      - - ()
    answer: Les parenthèses d'appel lancent la fonction.
  - key: trous-channel
    format: fill-in
    question: |-
      Complétez pour attendre le résultat :
      ```go
      res := make(chan int)
      go func() { res <- 42 }()
      v := ___res
      ```
    blanks:
      - - <-
    answer: La réception attend que la goroutine envoie.
  - key: trous-nombre
    format: fill-in
    question: |-
      Complétez pour afficher le nombre de goroutines en cours :
      ```go
      fmt.Println(runtime.___())
      ```
    blanks:
      - - NumGoroutine
    answer: '`runtime.NumGoroutine` aide à repérer les fuites.'
  - key: code-channel
    format: code-output
    question: "```go\nres := make(chan string)\ngo func() {\n\tres <- \"fini\"\n}()\nfmt.Println(<-res)\n```"
    answer: '`fini` : la réception attend l''envoi de la goroutine.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tres := make(chan string)\n\tgo func() {\n\t\tres <- \"fini\"\n\t}()\n\tfmt.Println(<-res)\n}\n"
      output: fini
  - key: code-arguments
    format: code-output
    question: |-
      ```go
      ch := make(chan int)
      x := 1
      go func(v int) { ch <- v }(x)
      x = 2
      fmt.Println(<-ch, x)
      ```
    answer: '`1 2` : l''argument est évalué au lancement de la goroutine.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tx := 1\n\tgo func(v int) { ch <- v }(x)\n\tx = 2\n\tfmt.Println(<-ch, x)\n}\n"
      output: 1 2
  - key: code-main-termine
    format: code-output
    question: "```go\ngo func() {\n\ttime.Sleep(time.Second)\n\tfmt.Println(\"goroutine\")\n}()\nfmt.Println(\"main\")\n```"
    answer: '`main` seulement : le programme s''arrête avec `main`, sans attendre la goroutine.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tgo func() {\n\t\ttime.Sleep(time.Second)\n\t\tfmt.Println(\"goroutine\")\n\t}()\n\tfmt.Println(\"main\")\n}\n"
      output: main
  - key: code-plusieurs
    format: code-output
    question: "```go\nres := make(chan int, 3)\nfor i := range 3 {\n\tgo func() { res <- i * i }()\n}\nsomme := 0\nfor range 3 {\n\tsomme += <-res\n}\nfmt.Println(somme)\n```"
    answer: '`5` : 0 + 1 + 4, quel que soit l''ordre d''arrivée des résultats.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tres := make(chan int, 3)\n\tfor i := range 3 {\n\t\tgo func() { res <- i * i }()\n\t}\n\tsomme := 0\n\tfor range 3 {\n\t\tsomme += <-res\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '5'
  - key: bug-main
    format: bug-fix
    question: "Le programme ne traite aucun fichier :\n```go\nfunc main() {\n\tfor _, f := range fichiers {\n\t\tgo traiter(f)\n\t}\n}\n```"
    answer: "```go\nfunc main() {\n\tvar wg sync.WaitGroup\n\tfor _, f := range fichiers {\n\t\twg.Go(func() { traiter(f) })\n\t}\n\twg.Wait()\n}\n```\n`main` se terminait avant les goroutines ; un `sync.WaitGroup` attend leur fin (`wg.Go` depuis Go 1.25)."
  - key: bug-retour
    format: bug-fix
    question: |-
      Ce code ne compile pas :
      ```go
      total := go calculerTotal(commandes)
      ```
    answer: |-
      ```go
      res := make(chan int, 1)
      go func() { res <- calculerTotal(commandes) }()
      total := <-res
      ```
      Une goroutine ne renvoie pas de valeur ; le résultat passe par un channel.
  - key: bug-sleep
    format: bug-fix
    question: |-
      Le test passe en local mais échoue en CI, plus lente :
      ```go
      go sauvegarder(d)
      time.Sleep(100 * time.Millisecond)
      verifierSauvegarde(t)
      ```
    answer: "```go\nfini := make(chan struct{})\ngo func() {\n\tdefer close(fini)\n\tsauvegarder(d)\n}()\n<-fini\nverifierSauvegarde(t)\n```\nUn `Sleep` ne garantit rien ; on attend la fin réelle de la goroutine."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le log affiche les étapes dans le désordre :
      ```go
      go etape1()
      go etape2()
      go etape3()
      ```
    answer: |-
      ```go
      etape1()
      etape2()
      etape3()
      ```
      Les goroutines n'ont aucun ordre garanti ; si les étapes doivent se suivre, on les exécute séquentiellement (dans
      une seule goroutine si l'ensemble doit être asynchrone).
  - key: definition-concurrence
    format: definition
    question: concurrence
    answer: La composition d'un programme en tâches qui progressent indépendamment, pas forcément en même temps.
  - key: definition-parallelisme
    format: definition
    question: parallélisme
    answer: L'exécution simultanée de plusieurs tâches, sur plusieurs cœurs de processeur.
  - key: definition-ordonnanceur
    format: definition
    question: ordonnanceur (scheduler) de Go
    answer: La partie du runtime qui répartit les goroutines sur les threads système et décide laquelle s'exécute.
