notion: goroutines-bases
lesson: "Une **goroutine** est une fonction qui s'exécute **de façon concurrente**, lancée avec le mot-clé **`go`** :\n\n```go\ngo envoyerCourriel(c)          // lance et continue sans attendre\ngo func() {                    // une fonction anonyme\n\tresultat <- calculer()\n}()\n```\n\n- Elle est gérée par le **runtime de Go**, pas par le système : elle démarre avec une **petite pile** (quelques Ko) qui\n  grandit au besoin, et l'ordonnanceur répartit des milliers (voire des millions) de goroutines sur quelques threads\n  système. Créer une goroutine coûte environ une microseconde.\n- `go f(x)` **évalue les arguments tout de suite**, puis lance `f` ; on ne récupère **aucune valeur de retour** : les\n  résultats passent par un channel, une variable protégée ou un `errgroup`.\n- Quand **`main` se termine**, le programme s'arrête, **sans attendre** les autres goroutines.\n- Une goroutine **ne peut pas être tuée** de l'extérieur : on lui demande de s'arrêter (un `context`, un channel fermé)\n  et elle s'arrête d'elle-même.\n- L'ordre d'exécution entre goroutines n'est **pas garanti** : sans synchronisation, on ne sait pas qui s'exécute en\n  premier.\n\n**Concurrence n'est pas parallélisme** (Rob Pike) : la concurrence est une façon de **structurer** un programme en tâches\nindépendantes ; le parallélisme est leur exécution **simultanée** sur plusieurs cœurs. Un programme concurrent peut\ntourner sur un seul cœur.\n\n**Piège classique** : lancer une goroutine dans `main` puis laisser `main` se terminer ; la goroutine n'a pas le temps\nde s'exécuter, et rien ne s'affiche.\n\n**En entretien** : « go f() lance une fonction concurrente légère, gérée par le runtime ; pas de valeur de retour ni de\nmoyen de la tuer ; main n'attend personne ; la concurrence structure, le parallélisme exécute en même temps. »"
tour:
  - title: Les goroutines
    text: |-
      Le mot-clé `go` lance un appel de fonction dans une **goroutine** : une fonction qui s'exécute en même temps que
      le reste du programme. Une goroutine ne coûte que quelques kilo-octets : on en lance des milliers sans souci.

      `main` n'attend pas les goroutines : quand `main` se termine, le programme s'arrête, goroutines comprises. Il faut
      donc **synchroniser** ; ici, un channel, présenté un peu plus loin, rapporte chaque résultat.

      La **concurrence** organise des tâches qui avancent indépendamment ; le **parallélisme** les exécute au même
      instant, sur plusieurs cœurs. Go fait de la concurrence, et le runtime en tire du parallélisme quand la machine le
      permet.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func carre(n int, resultats chan int) {
          	resultats <- n * n
          }

          func main() {
          	resultats := make(chan int)
          	for n := 1; n <= 3; n++ {
          		go carre(n, resultats)
          	}
          	somme := 0
          	for range 3 {
          		somme += <-resultats
          	}
          	fmt.Println("somme des carrés :", somme)
          }
      output: |-
        somme des carrés : 14
cards:
  - key: goroutine
    format: course
    question: "Qu'est-ce qu'une goroutine, et qui la gère ?"
    choices:
      - {text: "Une fonction exécutée de façon concurrente, gérée par le runtime Go, à petite pile extensible", correct: true}
      - {text: "Un thread du système, créé par le programme avec une pile fixe d'environ un mégaoctet", correct: false}
      - {text: "Une coroutine qui ne s'exécute que lorsqu'on attend son résultat avec `await`", correct: false}
      - {text: "Un processus léger, avec sa propre mémoire isolée de celle des autres goroutines", correct: false}
    answer: "Une fonction exécutée de façon concurrente, gérée par le runtime Go (et non par le système), avec une petite pile qui grandit au besoin. Elle partage la mémoire du programme : ce n'est pas un processus isolé."
  - key: goroutine-vs-thread-os
    format: course
    question: "Qu'est-ce qui distingue une goroutine d'un thread du système ?"
    choices:
      - {text: "Elle est bien plus légère, et le runtime en répartit beaucoup sur peu de threads", correct: true}
      - {text: "C'est un thread du système, mais créé et détruit plus vite par le runtime Go", correct: false}
      - {text: "Elle tourne toujours sur un seul thread, celui qui exécute la fonction `main`", correct: false}
      - {text: "Elle a sa propre mémoire, et ne communique qu'en copiant des valeurs", correct: false}
    answer: "Une goroutine démarre avec une pile de quelques Ko, et le runtime en ordonnance des milliers sur un petit nombre de threads du système. Ce n'est pas un thread déguisé : on peut en lancer des centaines de milliers, sur plusieurs cœurs."
  - key: concurrence-vs-parallelisme
    format: course
    question: "Quelle différence entre concurrence et parallélisme ?"
    choices:
      - {text: "La concurrence structure en tâches indépendantes ; le parallélisme les exécute en même temps", correct: true}
      - {text: "La concurrence exige plusieurs cœurs ; le parallélisme peut tourner sur un seul cœur", correct: false}
      - {text: "Aucune : ce sont deux noms pour l'exécution de plusieurs tâches au même instant", correct: false}
      - {text: "La concurrence partage la mémoire ; le parallélisme communique seulement par messages", correct: false}
    answer: "La concurrence structure un programme en tâches indépendantes ; le parallélisme exécute des tâches simultanément sur plusieurs cœurs. Un programme concurrent tourne aussi sur un seul cœur, en alternant ses tâches."
  - key: passe-goroutines-quand-main-termine
    format: course
    question: "Que deviennent les goroutines encore en cours quand `main` se termine ?"
    choices:
      - {text: "Elles sont arrêtées avec le programme, sans être attendues", correct: true}
      - {text: "Le programme les attend, comme les threads non démons de Java", correct: false}
      - {text: "Elles continuent en arrière-plan, rattachées au système", correct: false}
      - {text: "Le runtime panique, car des goroutines tournent encore", correct: false}
    answer: "Le programme s'arrête dès que `main` se termine, sans attendre les autres goroutines. Il n'y a pas de thread « non démon » en Go : pour attendre, on utilise un `sync.WaitGroup`, un channel ou `errgroup`."
  - key: goroutine-etre-tuee-exterieur
    format: course
    question: "Peut-on tuer une goroutine depuis une autre goroutine ?"
    choices:
      - {text: "Non : elle doit s'arrêter d'elle-même, en surveillant un contexte ou un channel", correct: true}
      - {text: "Oui, en appelant `runtime.Goexit` depuis la goroutine qui veut l'arrêter", correct: false}
      - {text: "Oui, en annulant son contexte, qui l'interrompt où qu'elle en soit", correct: false}
      - {text: "Oui, avec la méthode `Stop()` du descripteur que renvoie l'instruction `go`", correct: false}
    answer: "Non : une goroutine n'a pas d'identifiant ni de poignée, et elle s'arrête d'elle-même. Annuler un contexte ne fait que lui envoyer un signal, qu'elle doit surveiller (`<-ctx.Done()`) pour rendre la main."
  - key: definition-goroutine
    format: definition
    question: "Dans la concurrence en Go, que désigne une « goroutine » ?"
    choices:
      - {text: "Une fonction concurrente légère, gérée par le runtime Go", correct: true}
      - {text: "Un thread du système, réservé à un seul cœur du processeur", correct: false}
      - {text: "Un canal typé qui fait communiquer deux tâches concurrentes", correct: false}
      - {text: "La partie du runtime qui répartit les tâches sur les threads", correct: false}
    answer: "Une fonction concurrente légère, gérée par le runtime Go plutôt que par le système. Le canal typé, c'est le channel ; la répartition sur les threads, c'est l'ordonnanceur."
  - key: arguments
    format: course
    question: "Quand les arguments de `go f(x)` sont-ils évalués ?"
    choices:
      - {text: "Tout de suite, au moment de l'instruction `go`, dans la goroutine qui la lance", correct: true}
      - {text: "Au démarrage de `f`, quand l'ordonnanceur donne la main à la nouvelle goroutine", correct: false}
      - {text: "À la première lecture de `x` dans `f`, de façon paresseuse, comme en Haskell", correct: false}
      - {text: "À chaque lecture de `x` dans `f`, qui voit la variable partagée avec l'appelant", correct: false}
    answer: "Tout de suite, au moment de l'instruction `go`, comme pour `defer` : seule l'exécution de `f` est concurrente. Modifier `x` ensuite ne change pas la valeur que reçoit `f`."
  - key: vf-main-attend
    format: true-false
    question: Le programme attend la fin de toutes les goroutines avant de s'arrêter.
    truth: false
    answer: Il s'arrête dès que `main` se termine ; il faut synchroniser explicitement.
  - key: vf-retour
    format: true-false
    question: '`resultat := go calculer()` récupère la valeur renvoyée par la goroutine.'
    truth: false
    answer: Une goroutine ne renvoie rien ; on passe par un channel ou une variable synchronisée.
  - key: vf-legere
    format: true-false
    question: Une goroutine démarre avec une pile de quelques kilo-octets.
    truth: true
    answer: Elle grandit au besoin ; on peut en lancer des centaines de milliers.
  - key: vf-ordre
    format: true-false
    question: Deux goroutines lancées l'une après l'autre s'exécutent dans cet ordre.
    truth: false
    answer: L'ordonnanceur ne garantit aucun ordre sans synchronisation.
  - key: qcm-lancer
    format: multiple-choice
    question: "Laquelle de ces instructions lance correctement une goroutine ?"
    choices:
      - {text: "`go func() { traiter(job) }()`", correct: true}
      - {text: "`go func() { traiter(job) }`", correct: false}
      - {text: "`go traiter`", correct: false}
      - {text: "`async traiter(job)`", correct: false}
    answer: "`go` doit être suivi d'un appel de fonction : la fonction anonyme est appelée par ses `()` finales. `go traiter(job)` marche aussi ; sans les parenthèses d'appel, ça ne compile pas."
  - key: qcm-arreter
    format: multiple-choice
    question: "Comment demander à une goroutine de s'arrêter, depuis une autre goroutine ?"
    choices:
      - {text: "Annuler un `context.Context` qu'elle surveille", correct: true}
      - {text: "L'arrêter avec `kill(g)`, comme un processus", correct: false}
      - {text: "Appeler `runtime.Goexit(g)` en lui passant la goroutine", correct: false}
      - {text: "Affecter `nil` à la fonction qu'elle exécute", correct: false}
    answer: "Une goroutine s'arrête d'elle-même ; on lui envoie un signal, comme l'annulation d'un contexte qu'elle surveille (ou la fermeture d'un channel qu'elle écoute). `runtime.Goexit` n'arrête que la goroutine qui l'appelle."
  - key: qcm-concurrence
    format: multiple-choice
    question: "Que signifie « la concurrence n'est pas le parallélisme » ?"
    choices:
      - {text: "On structure en tâches indépendantes, qui ne tournent pas forcément en même temps", correct: true}
      - {text: "Un programme concurrent tourne forcément sur plusieurs cœurs du processeur", correct: false}
      - {text: "Go ne sait pas faire de parallélisme, seulement alterner ses goroutines", correct: false}
      - {text: "Les goroutines tournent toujours une à une, jamais sur deux cœurs à la fois", correct: false}
    answer: "La concurrence structure un programme en tâches indépendantes ; le parallélisme les exécute en même temps sur plusieurs cœurs. Un programme concurrent tourne aussi sur un seul cœur, et Go sait exécuter ses goroutines en parallèle."
  - key: qcm-resultat
    format: multiple-choice
    question: "Lesquelles de ces façons récupèrent sans risque le résultat d'une goroutine ?"
    choices:
      - text: Par un channel qu'elle remplit
        correct: true
      - text: Avec `errgroup` et une variable écrite par la goroutine, lue après `Wait`
        correct: true
      - text: Avec la valeur de retour de `go f()`
        correct: false
      - text: En lisant une variable sans synchronisation
        correct: false
    answer: Une lecture non synchronisée est une data race.
  - key: trous-go
    format: fill-in
    question: |-
      Complète pour envoyer le courriel sans attendre :
      ```go
      ___ envoyerCourriel(c)
      ```
    blanks:
      - - go
    answer: Le mot-clé `go` lance une goroutine.
  - key: trous-anonyme
    format: fill-in
    question: |-
      Complète la goroutine anonyme :
      ```go
      go func() {
      	resultats <- calculer()
      }___
      ```
    blanks:
      - - ()
    answer: Les parenthèses d'appel lancent la fonction.
  - key: trous-channel
    format: fill-in
    question: |-
      Complète pour attendre le résultat :
      ```go
      res := make(chan int)
      go func() { res <- 42 }()
      v := ___res
      ```
    blanks:
      - - <-
    answer: La réception attend que la goroutine envoie.
  - key: trous-nombre
    format: fill-in
    question: |-
      Complète pour afficher le nombre de goroutines en cours :
      ```go
      fmt.Println(runtime.___())
      ```
    blanks:
      - - NumGoroutine
    answer: '`runtime.NumGoroutine` aide à repérer les fuites.'
  - key: code-channel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      res := make(chan string)
      go func() {
      	res <- "fini"
      }()
      fmt.Println(<-res)
      ```
    choices:
      - {text: "`fini`", correct: true}
      - {text: "Rien : `main` n'attend pas la goroutine", correct: false}
      - {text: "Une chaîne vide, car la goroutine n'a pas encore envoyé", correct: false}
      - {text: "`<nil>`", correct: false}
    answer: "`fini` : la réception `<-res` bloque jusqu'à l'envoi de la goroutine. C'est elle qui fait attendre `main`, sans `Sleep` ni `WaitGroup`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tres := make(chan string)\n\tgo func() {\n\t\tres <- \"fini\"\n\t}()\n\tfmt.Println(<-res)\n}\n"
      output: fini
  - key: code-arguments
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int)
      x := 1
      go func(v int) { ch <- v }(x)
      x = 2
      fmt.Println(<-ch, x)
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`1 2` : l'argument `v` est évalué au lancement de la goroutine, quand `x` vaut encore 1. Changer `x` ensuite ne touche pas la copie reçue."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int)\n\tx := 1\n\tgo func(v int) { ch <- v }(x)\n\tx = 2\n\tfmt.Println(<-ch, x)\n}\n"
      output: 1 2
  - key: code-main-termine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      go func() {
      	time.Sleep(time.Second)
      	fmt.Println("goroutine")
      }()
      fmt.Println("main")
      ```
    choices:
      - {text: "`main`", correct: true}
      - text: |-
          ```
          main
          goroutine
          ```
        correct: false
      - text: |-
          ```
          goroutine
          main
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: "`main` seulement : le programme s'arrête avec `main`, sans attendre la goroutine qui dort encore une seconde."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tgo func() {\n\t\ttime.Sleep(time.Second)\n\t\tfmt.Println(\"goroutine\")\n\t}()\n\tfmt.Println(\"main\")\n}\n"
      output: main
  - key: code-plusieurs
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      res := make(chan int, 3)
      for i := range 3 {
      	go func() { res <- i * i }()
      }
      somme := 0
      for range 3 {
      	somme += <-res
      }
      fmt.Println(somme)
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`27`", correct: false}
      - {text: "`14`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`5` : 0 + 1 + 4, quel que soit l'ordre d'arrivée. Chaque tour de boucle a son propre `i` (Go 1.22) : les goroutines ne lisent pas toutes une même valeur finale."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tres := make(chan int, 3)\n\tfor i := range 3 {\n\t\tgo func() { res <- i * i }()\n\t}\n\tsomme := 0\n\tfor range 3 {\n\t\tsomme += <-res\n\t}\n\tfmt.Println(somme)\n}\n"
      output: '5'
  - key: bug-main
    format: bug-fix
    question: |-
      Ce programme se termine sans traiter aucun fichier. Quelle correction est la bonne ?
      ```go
      func main() {
      	for _, f := range fichiers {
      		go traiter(f)
      	}
      }
      ```
    choices:
      - {text: "Attendre les goroutines avec un `sync.WaitGroup` : `wg.Go` dans la boucle, puis `wg.Wait()`", correct: true}
      - {text: "Ajouter un `time.Sleep(time.Second)` à la fin de `main`, le temps qu'elles finissent", correct: false}
      - {text: "Appeler `runtime.Gosched()` après chaque `go traiter(f)`, pour leur céder la main", correct: false}
      - {text: "Copier `f` dans une variable locale avant chaque `go traiter(f)`, pour la figer", correct: false}
    answer: "```go\nfunc main() {\n\tvar wg sync.WaitGroup\n\tfor _, f := range fichiers {\n\t\twg.Go(func() { traiter(f) })\n\t}\n\twg.Wait()\n}\n```\n`main` se terminait avant les goroutines ; un `sync.WaitGroup` attend leur fin (`wg.Go` depuis Go 1.25)."
  - key: bug-retour
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```go
      total := go calculerTotal(commandes)
      ```
    choices:
      - {text: "Faire envoyer le résultat dans un channel par la goroutine, puis le recevoir", correct: true}
      - {text: "Écrire `total := await go calculerTotal(commandes)`, pour attendre la valeur", correct: false}
      - {text: "Déclarer `var total int` avant, puis écrire `total = go calculerTotal(commandes)`", correct: false}
      - {text: "Recevoir directement la valeur avec `total := <-go calculerTotal(commandes)`", correct: false}
    answer: |-
      ```go
      res := make(chan int, 1)
      go func() { res <- calculerTotal(commandes) }()
      total := <-res
      ```
      Une goroutine ne renvoie pas de valeur ; le résultat passe par un channel.
  - key: bug-sleep
    format: bug-fix
    question: |-
      Ce test passe en local mais échoue en CI, plus lente. Quelle correction est la bonne ?
      ```go
      go sauvegarder(d)
      time.Sleep(100 * time.Millisecond)
      verifierSauvegarde(t)
      ```
    choices:
      - {text: "Attendre la fin réelle de la goroutine, avec un channel qu'elle ferme quand elle a fini", correct: true}
      - {text: "Allonger le `Sleep` à une seconde, pour laisser de la marge aux machines de la CI", correct: false}
      - {text: "Appeler `runtime.Gosched()` avant la vérification, pour laisser tourner la goroutine", correct: false}
      - {text: "Lancer aussi la vérification dans une goroutine, en parallèle de la sauvegarde", correct: false}
    answer: "```go\nfini := make(chan struct{})\ngo func() {\n\tdefer close(fini)\n\tsauvegarder(d)\n}()\n<-fini\nverifierSauvegarde(t)\n```\nUn `Sleep` ne garantit rien ; on attend la fin réelle de la goroutine."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le log affiche ces étapes dans le désordre. Quelle correction est la bonne ?
      ```go
      go etape1()
      go etape2()
      go etape3()
      ```
    choices:
      - {text: "Les appeler à la suite, sans `go`, puisqu'elles doivent se suivre", correct: true}
      - {text: "Ajouter un court `time.Sleep` entre deux lancements de goroutine", correct: false}
      - {text: "Fixer `runtime.GOMAXPROCS(1)`, pour qu'elles tournent dans l'ordre", correct: false}
      - {text: "Les lancer dans une boucle, qui garantit leur ordre de démarrage", correct: false}
    answer: |-
      ```go
      etape1()
      etape2()
      etape3()
      ```
      Les goroutines n'ont aucun ordre garanti ; si les étapes doivent se suivre, on les exécute séquentiellement (dans
      une seule goroutine si l'ensemble doit être asynchrone).
  - key: definition-concurrence
    format: definition
    question: "Que désigne la « concurrence » en programmation ?"
    choices:
      - {text: "La composition en tâches qui progressent indépendamment, pas forcément en même temps", correct: true}
      - {text: "L'exécution simultanée de plusieurs tâches, chacune sur son propre cœur du processeur", correct: false}
      - {text: "La compétition entre goroutines pour obtenir le même verrou, qui les ralentit", correct: false}
      - {text: "L'exécution des tâches l'une après l'autre, dans un ordre fixé à l'avance", correct: false}
    answer: "La composition d'un programme en tâches qui progressent indépendamment, pas forcément en même temps. L'exécution simultanée sur plusieurs cœurs, c'est le parallélisme."
  - key: definition-parallelisme
    format: definition
    question: "Que désigne le « parallélisme » en programmation ?"
    choices:
      - {text: "L'exécution simultanée de plusieurs tâches, sur plusieurs cœurs", correct: true}
      - {text: "La composition en tâches indépendantes, pas forcément simultanées", correct: false}
      - {text: "L'alternance rapide de plusieurs tâches sur un seul cœur, à tour de rôle", correct: false}
      - {text: "Le découpage d'un programme en processus séparés, sans mémoire commune", correct: false}
    answer: "L'exécution simultanée de plusieurs tâches, sur plusieurs cœurs de processeur. L'alternance sur un seul cœur est de la concurrence, pas du parallélisme."
  - key: definition-ordonnanceur
    format: definition
    question: "Que désigne l'« ordonnanceur » (scheduler) de Go ?"
    choices:
      - {text: "La partie du runtime qui répartit les goroutines sur les threads système", correct: true}
      - {text: "L'ordonnanceur du système, qui crée un thread pour chaque goroutine lancée", correct: false}
      - {text: "Le ramasse-miettes, qui libère la mémoire des goroutines une fois terminées", correct: false}
      - {text: "Le paquet `time`, qui déclenche à l'heure dite les tâches planifiées", correct: false}
    answer: "La partie du runtime qui répartit les goroutines sur les threads système et décide laquelle s'exécute. Le système, lui, ne voit que quelques threads, pas les goroutines."
