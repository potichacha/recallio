notion: goroutines-bases
cards:
  - key: goroutine
    format: course
    question: C'est quoi une goroutine ?
    answer: Une fonction exécutée de façon concurrente, gérée par le runtime Go, avec une petite pile extensible.
  - key: goroutine-vs-thread-os
    format: course
    question: Goroutine vs thread de l'OS ?
    answer: La goroutine est bien plus légère, ordonnancée par le runtime sur un petit nombre de threads.
  - key: concurrence-vs-parallelisme
    format: course
    question: Concurrence vs parallélisme ?
    answer: Structurer en tâches indépendantes vs les exécuter simultanément sur plusieurs cœurs.
  - key: passe-goroutines-quand-main-termine
    format: course
    question: Que se passe-t-il pour les goroutines quand main se termine ?
    answer: Le programme s'arrête sans les attendre.
  - key: goroutine-etre-tuee-exterieur
    format: course
    question: Une goroutine peut-elle être tuée de l'extérieur ?
    answer: Non, elle doit s'arrêter elle-même, en général en surveillant un contexte.
  - key: definition-goroutine
    format: definition
    question: goroutine
    answer: Fonction concurrente légère gérée par le runtime
