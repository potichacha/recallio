notion: min-max-clear
lesson: |-
  Go 1.21 a ajouté trois **fonctions natives** (sans import), génériques par construction :

  **`min` et `max`** : le plus petit et le plus grand de leurs arguments, d'un même type **ordonné** (entiers,
  flottants, chaînes).

  ```go
  min(3, 1, 2)        // 1
  max(2.5, 1.0)       // 2.5
  min("go", "java")   // "go" (ordre lexicographique)
  delai := max(delai, time.Second) // borne inférieure
  ```

  - au moins **un** argument ; avec des constantes, le résultat est une constante ;
  - avec des flottants, un **NaN** donne NaN.

  **`clear`** :
  - sur une **map** : supprime **toutes** les entrées (la map reste utilisable, sa mémoire réservée est gardée) ;
  - sur une **slice** : remet tous les éléments à leur **valeur zéro**, sans changer la longueur.

  ```go
  m := map[string]int{"a": 1, "b": 2}
  clear(m)            // len(m) == 0

  s := []int{1, 2, 3}
  clear(s)            // s == [0 0 0], len(s) == 3
  ```

  `clear` sur une map est la seule façon de vider une map qui contient des clés **NaN** (impossibles à supprimer avec
  `delete`, car NaN n'est égal à rien).

  Les packages `slices` et `maps` complètent : `slices.Min(s)`, `slices.Max(s)` pour une slice (panique si elle est
  vide), `maps.DeleteFunc`, `slices.Delete`.

  **En entretien** : « min et max natifs depuis 1.21 pour des types ordonnés ; clear vide une map ou met à zéro les
  éléments d'une slice sans changer sa longueur. »
tour:
  - title: min, max et clear
    text: |-
      Depuis Go 1.21, trois fonctions natives :

      - `min` et `max` renvoient le plus petit et le plus grand de leurs arguments, d'un même type ordonné : des nombres
      ou des chaînes ; - `clear` vide une map, ou remet à zéro tous les éléments d'une slice, sans changer sa longueur.

      Elles remplacent les petites fonctions qu'on réécrivait dans chaque projet.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	fmt.Println(min(3, 1, 2), max(2.5, 4.0), min("go", "java"))

          	notes := []int{12, 15, 9}
          	clear(notes)
          	fmt.Println(notes, len(notes))

          	vus := map[string]bool{"go": true, "rust": true}
          	clear(vus)
          	fmt.Println(len(vus))
          }
      output: |-
        1 4 go
        [0 0 0] 3
        0
cards:
  - key: fonctions-integrees-generiques-sont-arrivees-1
    format: course
    question: "Quelles fonctions intégrées génériques Go 1.21 a-t-il ajoutées au langage ?"
    choices:
      - {text: "`min`, `max` et `clear`", correct: true}
      - {text: "`min`, `max` et `abs`", correct: false}
      - {text: "`append`, `copy` et `delete`", correct: false}
      - {text: "`sort`, `contains` et `clear`", correct: false}
    answer: "`min`, `max` et `clear`, intégrées et génériques depuis Go 1.21. `append`, `copy` et `delete` existent depuis Go 1.0, et il n'y a pas d'`abs` intégrée."
  - key: fonctions-integrees-sont-arrivees-1-21
    format: course
    question: "Dans quelle version de Go les fonctions intégrées `min`, `max` et `clear` sont-elles arrivées ?"
    choices:
      - {text: "Go 1.21", correct: true}
      - {text: "Go 1.18, avec les génériques", correct: false}
      - {text: "Go 1.22", correct: false}
      - {text: "Go 1.0", correct: false}
    answer: "Go 1.21 (août 2023), avec les packages `slices` et `maps`. Les génériques dataient de 1.18, mais ces fonctions sont venues trois versions plus tard."
  - key: clear-slice
    format: course
    question: "Que fait `clear(s)` sur une slice `s` ?"
    choices:
      - {text: "Il met chaque élément à sa valeur zéro, sans changer la longueur ni la capacité", correct: true}
      - {text: "Il vide la slice : sa longueur passe à 0, et sa capacité est conservée", correct: false}
      - {text: "Il met la slice à `nil` et laisse le GC libérer son tableau sous-jacent", correct: false}
      - {text: "Il retire les éléments égaux à la valeur zéro, et raccourcit la slice d'autant", correct: false}
    answer: "Il remet chaque élément à la valeur zéro de son type ; longueur et capacité ne changent pas. Pour vider la slice, on écrit `s = s[:0]` : c'est sur une map que `clear` supprime les entrées."
  - key: slices-min
    format: course
    question: "Comment obtenir le minimum d'une slice `s` non vide ?"
    choices:
      - {text: "`slices.Min(s)`", correct: true}
      - {text: "`min(s)`", correct: false}
      - {text: "`min(s...)`", correct: false}
      - {text: "`math.Min(s)`", correct: false}
    answer: "`slices.Min(s)` (et `slices.Max`), qui panique sur une slice vide. La fonction intégrée `min` prend des arguments séparés, ni slice ni `s...`, et `math.Min` prend deux `float64`."
  - key: vf-import
    format: true-false
    question: min et max demandent l'import du package math.
    truth: false
    answer: Ce sont des fonctions natives, sans import.
  - key: vf-chaines
    format: true-false
    question: '`max("pomme", "banane")` est valide.'
    truth: true
    answer: Les chaînes sont ordonnées ; le résultat est "pomme".
  - key: vf-clear-len
    format: true-false
    question: Après `clear(s)` sur une slice de 3 éléments, `len(s)` vaut 0.
    truth: false
    answer: La longueur reste 3 ; les éléments sont mis à zéro.
  - key: vf-types
    format: true-false
    question: '`min(1, 2.5)` est valide.'
    truth: true
    answer: Ce sont des constantes non typées, converties dans un même type ; avec des variables int et float64, ce serait une erreur.
  - key: qcm-clear-map
    format: multiple-choice
    question: "Que fait `clear(m)` sur une map `m` ?"
    choices:
      - {text: "Il supprime toutes les entrées, et la map reste utilisable ensuite", correct: true}
      - {text: "Il met la map à `nil`, si bien qu'une écriture ensuite panique", correct: false}
      - {text: "Il remet chaque valeur à zéro, en gardant toutes les clés", correct: false}
      - {text: "Il alloue une nouvelle map vide, qui remplace l'ancienne", correct: false}
    answer: "Les clés disparaissent et la map reste utilisable, contrairement à une slice, dont `clear` remet seulement les éléments à zéro. La map n'est ni mise à `nil` ni réallouée."
  - key: qcm-valide
    format: multiple-choice
    question: "Lequel de ces appels ne compile pas ?"
    choices:
      - {text: "`max(s)`, avec `s` de type `[]int`", correct: true}
      - {text: "`min(3, 1, 2)`", correct: false}
      - {text: "`max(a, b)`, avec `a` et `b` de type `time.Duration`", correct: false}
      - {text: "`min(x)`, avec un seul argument `x` de type `int`", correct: false}
    answer: "`min` et `max` prennent un ou plusieurs arguments d'un type ordonné, `time.Duration` compris, mais pas une slice : pour elle, `slices.Max`. `min()` sans argument ne compilerait pas non plus."
  - key: qcm-usage
    format: multiple-choice
    question: "Lequel de ces usages de `min` ou `max` est idiomatique ?"
    choices:
      - {text: "`n = min(n, limite)`, pour plafonner une valeur", correct: true}
      - {text: "`n = max(n, limite)`, pour plafonner une valeur", correct: false}
      - {text: "`max(s...)`, pour le maximum d'une slice", correct: false}
      - {text: "`min(p1, p2)`, pour la moins chère de deux structs `Prix`", correct: false}
    answer: "Plafonner, c'est `min(n, limite)` ; `max(delai, time.Second)` impose au contraire un minimum. Les structs ne sont pas ordonnées, et `max` n'accepte pas de slice dépliée."
  - key: qcm-nan
    format: multiple-choice
    question: Que vaut `max(1.0, math.NaN())` ?
    choices:
      - text: NaN
        correct: true
      - text: '1'
        correct: false
      - text: Une panique
        correct: false
      - text: '0'
        correct: false
    answer: Un NaN parmi les arguments donne NaN.
  - key: trous-min
    format: fill-in
    question: |-
      Complète pour plafonner la taille de page à 100 :
      ```go
      taille = ___(taille, 100)
      ```
    blanks:
      - - min
    answer: min plafonne.
  - key: trous-max
    format: fill-in
    question: |-
      Complète pour imposer au moins une seconde :
      ```go
      delai = ___(delai, time.Second)
      ```
    blanks:
      - - max
    answer: max impose un minimum.
  - key: trous-clear
    format: fill-in
    question: |-
      Complète pour vider le cache sans le réallouer :
      ```go
      ___(c.entrees)
      ```
    blanks:
      - - clear
    answer: clear supprime toutes les entrées de la map.
  - key: trous-slices-max
    format: fill-in
    question: |-
      Complète pour la note maximale d'une slice non vide :
      ```go
      meilleure := slices.___(notes)
      ```
    blanks:
      - - Max
    answer: slices.Max.
  - key: code-min-max
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      fmt.Println(min(4, 2, 8), max(4, 2, 8), min("go", "c"))
      ```
    choices:
      - {text: "`2 8 c`", correct: true}
      - {text: "`2 8 go`", correct: false}
      - {text: "`4 8 c`", correct: false}
      - {text: "Ça ne compile pas : `min` n'accepte pas de chaînes", correct: false}
    answer: "`min` et `max` acceptent tout type ordonné, chaînes comprises : « c » vient avant « go » dans l'ordre lexicographique."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(min(4, 2, 8), max(4, 2, 8), min(\"go\", \"c\"))\n}\n"
      output: 2 8 c
  - key: code-clear-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[string]int{"a": 1, "b": 2}
      clear(m)
      m["c"] = 3
      fmt.Println(len(m), m)
      ```
    choices:
      - {text: "`1 map[c:3]`", correct: true}
      - {text: "`3 map[a:0 b:0 c:3]`", correct: false}
      - {text: "`3 map[a:1 b:2 c:3]`", correct: false}
      - {text: "Une panic : écriture dans une map `nil`", correct: false}
    answer: "`clear` supprime toutes les entrées sans mettre la map à `nil` : elle reste utilisable, et ne contient ensuite que `c`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"a\": 1, \"b\": 2}\n\tclear(m)\n\tm[\"c\"] = 3\n\tfmt.Println(len(m), m)\n}\n"
      output: 1 map[c:3]
  - key: code-clear-slice
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      s := []string{"a", "b", "c"}
      clear(s[1:])
      fmt.Printf("%q %d\n", s, len(s))
      ```
    choices:
      - {text: "`[\"a\" \"\" \"\"] 3`", correct: true}
      - {text: "`[\"a\"] 1`", correct: false}
      - {text: "`[\"a\" \"b\" \"c\"] 3`", correct: false}
      - {text: "`[\"\" \"\" \"\"] 3`", correct: false}
    answer: "`clear` remet les éléments de `s[1:]` à la chaîne vide sans changer la longueur ; et `s[1:]` partage le tableau de `s`, d'où l'effet sur `s`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []string{\"a\", \"b\", \"c\"}\n\tclear(s[1:])\n\tfmt.Printf(\"%q %d\\n\", s, len(s))\n}\n"
      output: '["a" "" ""] 3'
  - key: code-nan
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[float64]string{}
      m[math.NaN()] = "x"
      m[math.NaN()] = "y"
      delete(m, math.NaN())
      fmt.Println(len(m))
      clear(m)
      fmt.Println(len(m))
      ```
    choices:
      - text: |-
          ```
          2
          0
          ```
        correct: true
      - text: |-
          ```
          1
          0
          ```
        correct: false
      - text: |-
          ```
          2
          2
          ```
        correct: false
      - text: |-
          ```
          0
          0
          ```
        correct: false
    answer: "NaN n'est égal à rien, pas même à lui-même : les deux écritures créent deux entrées, que `delete` ne retrouve pas. `clear` vide la map sans comparer les clés : c'est la seule façon de retirer ces entrées."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n\nfunc main() {\n\tm := map[float64]string{}\n\tm[math.NaN()] = \"x\"\n\tm[math.NaN()] = \"y\"\n\tdelete(m, math.NaN())\n\tfmt.Println(len(m))\n\tclear(m)\n\tfmt.Println(len(m))\n}\n"
      output: |-
        2
        0
