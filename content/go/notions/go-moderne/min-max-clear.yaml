notion: min-max-clear
lesson: |-
  Go 1.21 a ajouté trois **fonctions natives** (sans import), génériques par construction :

  **`min` et `max`** : le plus petit et le plus grand de leurs arguments, d'un même type **ordonné** (entiers,
  flottants, chaînes).

  ```go
  min(3, 1, 2)        // 1
  max(2.5, 1.0)       // 2.5
  min("go", "java")   // "go" (ordre lexicographique)
  delai := max(delai, time.Second) // borne inférieure
  ```

  - au moins **un** argument ; avec des constantes, le résultat est une constante ;
  - avec des flottants, un **NaN** donne NaN.

  **`clear`** :
  - sur une **map** : supprime **toutes** les entrées (la map reste utilisable, sa mémoire réservée est gardée) ;
  - sur une **slice** : remet tous les éléments à leur **valeur zéro**, sans changer la longueur.

  ```go
  m := map[string]int{"a": 1, "b": 2}
  clear(m)            // len(m) == 0

  s := []int{1, 2, 3}
  clear(s)            // s == [0 0 0], len(s) == 3
  ```

  `clear` sur une map est la seule façon de vider une map qui contient des clés **NaN** (impossibles à supprimer avec
  `delete`, car NaN n'est égal à rien).

  Les packages `slices` et `maps` complètent : `slices.Min(s)`, `slices.Max(s)` pour une slice (panique si elle est
  vide), `maps.DeleteFunc`, `slices.Delete`.

  **En entretien** : « min et max natifs depuis 1.21 pour des types ordonnés ; clear vide une map ou met à zéro les
  éléments d'une slice sans changer sa longueur. »
cards:
  - key: fonctions-integrees-generiques-sont-arrivees-1
    format: course
    question: Quelles fonctions intégrées génériques sont arrivées en 1.21 ?
    answer: min, max et clear.
  - key: fonctions-integrees-sont-arrivees-1-21
    format: course
    question: Quelles fonctions intégrées sont arrivées en 1.21 ?
    answer: min, max et clear.
  - key: clear-slice
    format: course
    question: Que fait clear sur une slice ?
    answer: Il remet chaque élément à la valeur zéro de son type, sans changer la longueur ni la capacité ; pour vider la slice, on écrit `s = s[:0]`.
  - key: slices-min
    format: course
    question: Comment obtenir le minimum d'une slice ?
    answer: Avec `slices.Min(s)` (et `slices.Max`), qui panique si la slice est vide ; la fonction native `min` prend des arguments séparés, pas une slice.
  - key: vf-import
    format: true-false
    question: min et max demandent l'import du package math.
    truth: false
    answer: Ce sont des fonctions natives, sans import.
  - key: vf-chaines
    format: true-false
    question: '`max("pomme", "banane")` est valide.'
    truth: true
    answer: Les chaînes sont ordonnées ; le résultat est "pomme".
  - key: vf-clear-len
    format: true-false
    question: Après `clear(s)` sur une slice de 3 éléments, `len(s)` vaut 0.
    truth: false
    answer: La longueur reste 3 ; les éléments sont mis à zéro.
  - key: vf-types
    format: true-false
    question: '`min(1, 2.5)` est valide.'
    truth: true
    answer: Ce sont des constantes non typées, converties dans un même type ; avec des variables int et float64, ce serait une erreur.
  - key: qcm-clear-map
    format: multiple-choice
    question: Que fait clear(m) sur une map ?
    choices:
      - text: Supprime toutes les entrées
        correct: true
      - text: Laisse la map utilisable ensuite
        correct: true
      - text: Met la map à nil
        correct: false
      - text: Met chaque valeur à zéro en gardant les clés
        correct: false
    answer: Les clés disparaissent, contrairement au comportement sur une slice.
  - key: qcm-valide
    format: multiple-choice
    question: Lesquels de ces appels compilent ?
    choices:
      - text: '`min(3, 1, 2)`'
        correct: true
      - text: '`max(a, b)` avec a et b de type time.Duration'
        correct: true
      - text: '`min()` sans argument'
        correct: false
      - text: '`max(s)` avec s de type []int'
        correct: false
    answer: Pour une slice, slices.Max.
  - key: qcm-usage
    format: multiple-choice
    question: Quels usages de min et max sont idiomatiques ?
    choices:
      - text: '`n = min(n, limite)` pour plafonner une valeur'
        correct: true
      - text: '`delai = max(delai, time.Second)` pour imposer un minimum'
        correct: true
      - text: '`max(s...)` pour le maximum d''une slice'
        correct: false
      - text: Comparer deux structs
        correct: false
    answer: Les structs ne sont pas ordonnées ; max n'accepte pas de slice dépliée.
  - key: qcm-nan
    format: multiple-choice
    question: Que vaut `max(1.0, math.NaN())` ?
    choices:
      - text: NaN
        correct: true
      - text: '1'
        correct: false
      - text: Une panique
        correct: false
      - text: '0'
        correct: false
    answer: Un NaN parmi les arguments donne NaN.
  - key: trous-min
    format: fill-in
    question: |-
      Complétez pour plafonner la taille de page à 100 :
      ```go
      taille = ___(taille, 100)
      ```
    blanks:
      - - min
    answer: min plafonne.
  - key: trous-max
    format: fill-in
    question: |-
      Complétez pour imposer au moins une seconde :
      ```go
      delai = ___(delai, time.Second)
      ```
    blanks:
      - - max
    answer: max impose un minimum.
  - key: trous-clear
    format: fill-in
    question: |-
      Complétez pour vider le cache sans le réallouer :
      ```go
      ___(c.entrees)
      ```
    blanks:
      - - clear
    answer: clear supprime toutes les entrées de la map.
  - key: trous-slices-max
    format: fill-in
    question: |-
      Complétez pour la note maximale d'une slice non vide :
      ```go
      meilleure := slices.___(notes)
      ```
    blanks:
      - - Max
    answer: slices.Max.
  - key: code-min-max
    format: code-output
    question: |-
      ```go
      fmt.Println(min(4, 2, 8), max(4, 2, 8), min("go", "c"))
      ```
    answer: '`2 8 c` : « c » vient avant « go » dans l''ordre lexicographique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(min(4, 2, 8), max(4, 2, 8), min(\"go\", \"c\"))\n}\n"
      output: 2 8 c
  - key: code-clear-map
    format: code-output
    question: |-
      ```go
      m := map[string]int{"a": 1, "b": 2}
      clear(m)
      m["c"] = 3
      fmt.Println(len(m), m)
      ```
    answer: '`1 map[c:3]` : la map vidée reste utilisable.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := map[string]int{\"a\": 1, \"b\": 2}\n\tclear(m)\n\tm[\"c\"] = 3\n\tfmt.Println(len(m), m)\n}\n"
      output: 1 map[c:3]
  - key: code-clear-slice
    format: code-output
    question: |-
      ```go
      s := []string{"a", "b", "c"}
      clear(s[1:])
      fmt.Printf("%q %d\n", s, len(s))
      ```
    answer: '`["a" "" ""] 3` : clear met les éléments à zéro sans changer la longueur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\ts := []string{\"a\", \"b\", \"c\"}\n\tclear(s[1:])\n\tfmt.Printf(\"%q %d\\n\", s, len(s))\n}\n"
      output: '["a" "" ""] 3'
  - key: code-nan
    format: code-output
    question: |-
      ```go
      m := map[float64]string{}
      m[math.NaN()] = "x"
      m[math.NaN()] = "y"
      delete(m, math.NaN())
      fmt.Println(len(m))
      clear(m)
      fmt.Println(len(m))
      ```
    answer: '`2` puis `0` : NaN n''est égal à rien, delete ne le trouve pas, clear vide tout.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n\nfunc main() {\n\tm := map[float64]string{}\n\tm[math.NaN()] = \"x\"\n\tm[math.NaN()] = \"y\"\n\tdelete(m, math.NaN())\n\tfmt.Println(len(m))\n\tclear(m)\n\tfmt.Println(len(m))\n}\n"
      output: |-
        2
        0
