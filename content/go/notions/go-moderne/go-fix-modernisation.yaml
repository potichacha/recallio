notion: go-fix-modernisation
lesson: |-
  Depuis **Go 1.26**, **`go fix`** applique des **modernisations** (*modernizers*) : des réécritures automatiques et sûres
  qui remplacent de vieux idiomes par les API récentes, sans changer le comportement.

  ```
  go fix ./...          # applique les réécritures
  go fix -diff ./...    # montre le diff sans rien modifier
  ```

  Quelques exemples de réécritures :

  ```go
  // avant                                      // après
  for i := 0; i < n; i++ { ... }                for i := range n { ... }
  if a < b { m = a } else { m = b }             m := min(a, b)
  sort.Slice(s, func(i, j int) bool {...})      slices.Sort(s)  (quand c'est équivalent)
  for _, v := range s { if v == x { return true } }   slices.Contains(s, x)
  wg.Add(1); go func() { defer wg.Done(); f() }()     wg.Go(f)
  strings.Split(s, sep) dans un range           strings.SplitSeq(s, sep)
  ```

  Les réécritures tiennent compte de la **version de Go** déclarée dans le `go.mod` : elles n'utilisent que ce qui y
  est disponible.

  La directive **`//go:fix inline`** permet à l'auteur d'une bibliothèque de marquer une fonction dépréciée comme un
  simple appel à sa remplaçante ; `go fix` réécrit alors les appels chez les utilisateurs.

  ```go
  // Deprecated: utiliser NouvelleAPI.
  //go:fix inline
  func AncienneAPI(x int) int { return NouvelleAPI(x, defaut) }
  ```

  Avant 1.26, ces analyseurs existaient dans `gopls` (suggestions de l'éditeur) et dans la commande `modernize` de
  golang.org/x/tools.

  **En entretien** : « go fix applique des modernisations sûres selon la version du go.mod ; -diff pour relire ;
  //go:fix inline pour faire migrer les appelants d'une API dépréciée. »
cards:
  - key: fix-depuis-1-26
    format: course
    question: Que fait go fix depuis Go 1.26 ?
    answer: Il applique des modernizers qui réécrivent le code vers les idiomes et API récents.
  - key: reprends-projet-1-19-mets-jour
    format: scenario
    question: Tu reprends un projet en Go 1.19. Comment le mets-tu à jour ?
    answer: |-
      Par étapes, en restant sur des versions supportées à chaque palier. Je monterais la directive `go` et la chaîne d'outils, je lancerais tous les tests avec `-race`, puis je regarderais les changements de comportement liés à la directive : le plus notable est la **sémantique des variables de boucle** de Go 1.22, qui corrige des bugs mais peut changer le comportement d'un code qui en dépendait (rare). Les réglages `GODEBUG` permettent de revenir temporairement à un ancien comportement si un test casse.
      Ensuite `go fix ./...` pour appliquer les modernizers, la mise à jour des dépendances et de golangci-lint, et `govulncheck` pour les vulnérabilités. Les gains attendus : performances (Swiss Tables, Green Tea, PGO), GOMAXPROCS correct en conteneur, et des API plus simples (`slices`, `slog`, itérateurs).
  - key: fix-depuis-1-26-2
    format: course
    question: Que fait go fix depuis Go 1.26 ?
    answer: Il applique des modernizers qui réécrivent le code vers les idiomes récents sans changer son comportement.
  - key: sert-fix-inline
    format: course
    question: À quoi sert //go:fix inline ?
    answer: Permettre à go fix de remplacer automatiquement les appels à une fonction dépréciée par sa nouvelle version.
  - key: terme-modernizers
    format: course
    question: Que désigne « modernizers » ?
    answer: Réécritures automatiques de go fix (Go 1.26)
  - key: vf-diff
    format: true-false
    question: '`go fix -diff` montre les réécritures sans modifier les fichiers.'
    truth: true
    answer: Pratique pour relire avant d'appliquer.
  - key: vf-version
    format: true-false
    question: go fix peut introduire des API plus récentes que la version déclarée dans le go.mod.
    truth: false
    answer: Il se limite à ce que permet la version du module.
  - key: vf-comportement
    format: true-false
    question: Les modernisations de go fix sont conçues pour ne pas changer le comportement du programme.
    truth: true
    answer: Elles ne s'appliquent que lorsque la réécriture est équivalente.
  - key: vf-inline
    format: true-false
    question: '`//go:fix inline` permet de faire réécrire les appels à une fonction dépréciée par son corps.'
    truth: true
    answer: Le corps doit être un simple appel à la nouvelle API.
  - key: qcm-reecritures
    format: multiple-choice
    question: Quelles réécritures sont des modernisations typiques ?
    choices:
      - text: '`for i := 0; i < n; i++` devient `for i := range n`'
        correct: true
      - text: Un if/else de minimum devient `min(a, b)`
        correct: true
      - text: '`wg.Add(1)` + `go func() { defer wg.Done(); ... }()` devient `wg.Go(...)`'
        correct: true
      - text: Toutes les boucles deviennent des itérateurs
        correct: false
    answer: Seules les formes équivalentes sont réécrites.
  - key: qcm-avant
    format: multiple-choice
    question: Où trouvait-on ces analyseurs avant Go 1.26 ?
    choices:
      - text: Dans gopls, sous forme de suggestions de l'éditeur
        correct: true
      - text: Dans la commande modernize de golang.org/x/tools
        correct: true
      - text: Dans go vet
        correct: false
      - text: Nulle part
        correct: false
    answer: go fix les a rendus accessibles avec la chaîne d'outils standard.
  - key: qcm-processus
    format: multiple-choice
    question: Comment intégrer go fix dans un projet ?
    choices:
      - text: Une pull request dédiée après chaque montée de version
        correct: true
      - text: Relire le diff et lancer les tests avant de fusionner
        correct: true
      - text: L'appliquer en production sur le binaire
        correct: false
      - text: Le lancer à chaque compilation
        correct: false
    answer: Il modifie le code source, à relire comme tout changement.
  - key: qcm-inline
    format: multiple-choice
    question: Que faut-il pour qu'un auteur de bibliothèque fasse migrer ses utilisateurs avec go fix ?
    choices:
      - text: Une fonction dépréciée dont le corps appelle la nouvelle API
        correct: true
      - text: La directive //go:fix inline sur cette fonction
        correct: true
      - text: Une nouvelle version majeure du module
        correct: false
      - text: Un fichier de configuration go.fix
        correct: false
    answer: Les utilisateurs lancent ensuite go fix sur leur code.
  - key: scenario-montee
    format: scenario
    question: Tu montes un projet de Go 1.20 à 1.26. Comment utilises-tu go fix ?
    answer: |-
      D'abord la montée seule : directive go du go.mod, tests, déploiement. Ensuite une pull request séparée avec
      `go fix ./...` : je relis le diff (souvent beaucoup de `range n`, `min`, `slices.Contains`), je lance les tests et
      les benchmarks des chemins chauds, et je la fusionne. Séparer les deux rend chaque changement facile à relire et
      à annuler.
  - key: scenario-bibliotheque
    format: scenario
    question: Tu maintiens une bibliothèque et tu renommes une fonction publique. Comment aides-tu tes utilisateurs ?
    answer: |-
      Je garde l'ancienne fonction, marquée `// Deprecated:` avec la remplaçante à utiliser, et la directive
      `//go:fix inline`, son corps se réduisant à un appel à la nouvelle. Les utilisateurs voient l'avertissement dans
      leur éditeur, et `go fix` réécrit leurs appels automatiquement. Je ne supprime l'ancienne qu'à la prochaine version
      majeure.
  - key: scenario-revue
    format: scenario
    question: Une pull request de go fix touche 300 fichiers. Comment la relis-tu ?
    answer: |-
      Je vérifie qu'elle ne contient que des réécritures automatiques (aucun changement manuel mélangé), je relis un
      échantillon par type de réécriture plutôt que chaque fichier, je m'assure que la CI (tests, `-race`, vet) est verte,
      et je regarde de près les fichiers sensibles (code généré, chemins chauds). Je fusionne vite pour éviter les
      conflits avec les autres branches.
