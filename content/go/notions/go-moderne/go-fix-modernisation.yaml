notion: go-fix-modernisation
lesson: |-
  Depuis **Go 1.26**, **`go fix`** applique des **modernisations** (*modernizers*) : des réécritures automatiques et sûres
  qui remplacent de vieux idiomes par les API récentes, sans changer le comportement.

  ```
  go fix ./...          # applique les réécritures
  go fix -diff ./...    # montre le diff sans rien modifier
  ```

  Quelques exemples de réécritures :

  ```go
  // avant                                      // après
  for i := 0; i < n; i++ { ... }                for i := range n { ... }
  if a < b { m = a } else { m = b }             m := min(a, b)
  sort.Slice(s, func(i, j int) bool {...})      slices.Sort(s)  (quand c'est équivalent)
  for _, v := range s { if v == x { return true } }   slices.Contains(s, x)
  wg.Add(1); go func() { defer wg.Done(); f() }()     wg.Go(f)
  strings.Split(s, sep) dans un range           strings.SplitSeq(s, sep)
  ```

  Les réécritures tiennent compte de la **version de Go** déclarée dans le `go.mod` : elles n'utilisent que ce qui y
  est disponible.

  La directive **`//go:fix inline`** permet à l'auteur d'une bibliothèque de marquer une fonction dépréciée comme un
  simple appel à sa remplaçante ; `go fix` réécrit alors les appels chez les utilisateurs.

  ```go
  // Deprecated: utiliser NouvelleAPI.
  //go:fix inline
  func AncienneAPI(x int) int { return NouvelleAPI(x, defaut) }
  ```

  Avant 1.26, ces analyseurs existaient dans `gopls` (suggestions de l'éditeur) et dans la commande `modernize` de
  golang.org/x/tools.

  **En entretien** : « go fix applique des modernisations sûres selon la version du go.mod ; -diff pour relire ;
  //go:fix inline pour faire migrer les appelants d'une API dépréciée. »
cards:
  - key: fix-depuis-1-26
    format: course
    question: "Que fait la commande `go fix ./...` depuis Go 1.26 ?"
    choices:
      - {text: "Elle applique des modernizers, qui réécrivent le code vers les idiomes et API récents", correct: true}
      - {text: "Elle corrige les bugs que signale `go vet`, comme un `Printf` aux arguments mal typés", correct: false}
      - {text: "Elle met à jour les dépendances du `go.mod` vers leurs dernières versions mineures", correct: false}
      - {text: "Elle reformate le code comme `gofmt`, puis trie et regroupe les imports du package", correct: false}
    answer: "Depuis Go 1.26, `go fix` applique des modernizers : des réécritures vers les idiomes et API récents (`range n`, `min`, `slices.Contains`). Mettre à jour les dépendances, c'est le rôle de `go get -u`."
  - key: reprends-projet-1-19-mets-jour
    format: scenario
    question: Tu reprends un projet en Go 1.19. Comment le mets-tu à jour ?
    choices:
      - {text: "Par paliers : directive `go` et chaîne d'outils, tests avec `-race`, puis `go fix` et `govulncheck`", correct: true}
      - {text: "D'un coup en 1.27, sans lancer les tests : la compatibilité Go 1 garantit que rien ne change", correct: false}
      - {text: "Réécrire d'abord le code à la main avec les génériques et les itérateurs, puis monter de version", correct: false}
      - {text: "Rester en 1.19 tant que rien ne casse : monter de version n'apporte que des risques au projet", correct: false}
    answer: "Par étapes : monter la directive `go` et la chaîne d'outils, lancer les tests avec `-race`, surveiller les changements liés à la directive (la variable de boucle de 1.22, réglable par `GODEBUG`), puis `go fix ./...` et `govulncheck`. La compatibilité Go 1 n'exclut pas ces changements de comportement liés à la version déclarée : les tests restent indispensables."
  - key: fix-depuis-1-26-2
    format: course
    question: "Les réécritures de `go fix` (Go 1.26) peuvent-elles changer le comportement du programme ?"
    choices:
      - {text: "Non : elles ne remplacent un code que par une forme équivalente, plus récente", correct: true}
      - {text: "Oui : elles adoptent les nouveaux comportements, comme la variable de boucle de 1.22", correct: false}
      - {text: "Oui : elles remplacent les boucles par des itérateurs, qui s'exécutent plus tard", correct: false}
      - {text: "Non, car `go fix` ne fait que signaler les modernisations, sans écrire de fichier", correct: false}
    answer: "Les modernizers ne réécrivent que des formes équivalentes, sans changer le comportement. `go fix` écrit bien les fichiers : on relit son diff comme tout changement."
  - key: sert-fix-inline
    format: course
    question: "À quoi sert la directive `//go:fix inline` placée sur une fonction ?"
    choices:
      - {text: "À laisser `go fix` remplacer les appels à cette fonction dépréciée par son corps", correct: true}
      - {text: "À demander au compilateur d'inliner toujours la fonction, comme `inline` en C++", correct: false}
      - {text: "À empêcher `go vet` de signaler les appels à cette fonction comme dépréciés", correct: false}
      - {text: "À marquer la fonction pour qu'elle disparaisse à la prochaine version majeure", correct: false}
    answer: "Elle permet à `go fix` de remplacer les appels à une fonction (souvent dépréciée) par son corps, c'est-à-dire par la nouvelle API. Elle ne règle pas l'inlining du compilateur, qui en décide seul."
  - key: terme-modernizers
    format: course
    question: "Que désigne le terme « modernizers » en Go ?"
    choices:
      - {text: "Les réécritures automatiques de `go fix` vers les idiomes récents (Go 1.26)", correct: true}
      - {text: "Les analyseurs de `go vet` qui signalent les bugs probables d'un package", correct: false}
      - {text: "Les réglages `GODEBUG` qui rétablissent un comportement d'une ancienne version", correct: false}
      - {text: "Les outils qui montent la directive `go` du `go.mod` à la dernière version", correct: false}
    answer: "Des réécritures automatiques, lancées par `go fix` depuis Go 1.26 (avant, par gopls ou la commande `modernize` de x/tools), qui remplacent un code par sa forme moderne équivalente."
  - key: vf-diff
    format: true-false
    question: '`go fix -diff` montre les réécritures sans modifier les fichiers.'
    truth: true
    answer: Pratique pour relire avant d'appliquer.
  - key: vf-version
    format: true-false
    question: go fix peut introduire des API plus récentes que la version déclarée dans le go.mod.
    truth: false
    answer: Il se limite à ce que permet la version du module.
  - key: vf-comportement
    format: true-false
    question: Les modernisations de go fix sont conçues pour ne pas changer le comportement du programme.
    truth: true
    answer: Elles ne s'appliquent que lorsque la réécriture est équivalente.
  - key: vf-inline
    format: true-false
    question: '`//go:fix inline` permet de faire réécrire les appels à une fonction dépréciée par son corps.'
    truth: true
    answer: Le corps doit être un simple appel à la nouvelle API.
  - key: qcm-reecritures
    format: multiple-choice
    question: "Laquelle de ces réécritures `go fix` ne fait-il pas ?"
    choices:
      - {text: "Toute boucle `for` sur une slice devient un itérateur `iter.Seq`", correct: true}
      - {text: "`for i := 0; i < n; i++` devient `for i := range n`", correct: false}
      - {text: "Un if/else qui calcule un minimum devient `min(a, b)`", correct: false}
      - {text: "`wg.Add(1)` + `go func() { defer wg.Done(); ... }()` devient `wg.Go(...)`", correct: false}
    answer: "Il ne réécrit que des formes équivalentes : `range n`, `min`, `wg.Go`, `slices.Contains`. Changer une boucle en itérateur modifierait la structure du code : ce n'est pas une modernisation sûre."
  - key: qcm-avant
    format: multiple-choice
    question: "Avant Go 1.26, quel outil appliquait les modernizers en ligne de commande ?"
    choices:
      - {text: "La commande `modernize` de `golang.org/x/tools`", correct: true}
      - {text: "`go vet`, avec son analyseur `modernize` par défaut", correct: false}
      - {text: "`gofmt -s`, qui simplifie déjà le code depuis Go 1.0", correct: false}
      - {text: "`go fix`, qui les contenait tous depuis Go 1.0", correct: false}
    answer: "La commande `modernize` de `golang.org/x/tools`, et gopls les proposait comme suggestions dans l'éditeur. `go fix` existait depuis Go 1.0, mais pour d'autres corrections : il les applique depuis 1.26."
  - key: qcm-processus
    format: multiple-choice
    question: "Comment intégrer `go fix` dans la vie d'un projet ?"
    choices:
      - {text: "Une pull request dédiée après chaque montée de version, relue et testée", correct: true}
      - {text: "Le lancer à chaque compilation, depuis le `Makefile` ou le script de build", correct: false}
      - {text: "Le mêler à la montée de version, dans le même commit, pour tout relire d'un coup", correct: false}
      - {text: "L'appliquer sans relire le diff : ses réécritures sont garanties équivalentes", correct: false}
    answer: "Une pull request à part, après la montée de version : on relit le diff et on lance les tests avant de fusionner, comme pour tout changement du code source. Mêlée à la montée, elle rendrait les deux changements difficiles à relire et à annuler."
  - key: qcm-inline
    format: multiple-choice
    question: "Une bibliothèque renomme sa fonction `Ancienne` en `Nouvelle`. Que doit faire son auteur pour que `go fix` migre les appels de ses utilisateurs ?"
    choices:
      - {text: "Garder `Ancienne`, dont le corps appelle `Nouvelle`, avec `//go:fix inline`", correct: true}
      - {text: "Publier une version majeure `/v2` du module, qui ne contient que `Nouvelle`", correct: false}
      - {text: "Ajouter un fichier `go.fix` qui associe l'ancien nom de la fonction au nouveau", correct: false}
      - {text: "Supprimer `Ancienne` : `go fix` retrouve seul la fonction qui la remplace", correct: false}
    answer: "L'ancienne fonction reste, son corps se réduit à un appel à la nouvelle, et la directive `//go:fix inline` permet à `go fix` d'inliner ces appels chez les utilisateurs. Il n'existe pas de fichier `go.fix`."
  - key: scenario-montee
    format: scenario
    question: "Tu montes un projet de Go 1.20 à 1.26. Comment utilises-tu `go fix` ?"
    choices:
      - {text: "Après la montée, déployée seule : une PR à part avec `go fix ./...`, relue et testée", correct: true}
      - {text: "Dans le même commit que la montée de version, pour ne relire qu'une seule fois", correct: false}
      - {text: "Avant la montée, sur le code encore en 1.20, pour préparer le terrain à la migration", correct: false}
      - {text: "Jamais sur un projet existant : ses réécritures sont faites pour le code neuf", correct: false}
    answer: "D'abord la montée seule (directive `go`, tests, déploiement), puis une PR séparée avec `go fix ./...`, relue et testée. Avant la montée, `go fix` ne proposerait rien de récent : ses réécritures dépendent de la version du `go.mod`. Séparer les deux rend chaque changement facile à relire et à annuler."
  - key: scenario-bibliotheque
    format: scenario
    question: Tu maintiens une bibliothèque et tu renommes une fonction publique. Comment aides-tu tes utilisateurs ?
    choices:
      - {text: "Garder l'ancienne, avec `// Deprecated:` et `//go:fix inline`, son corps appelant la nouvelle", correct: true}
      - {text: "Supprimer l'ancienne aussitôt, et documenter le renommage dans les notes de version", correct: false}
      - {text: "Publier une `/v2` qui ne contient que la nouvelle, et laisser la v1 telle qu'elle est", correct: false}
      - {text: "Garder les deux sans les marquer, pour n'imposer d'avertissement à aucun utilisateur", correct: false}
    answer: "Je garde l'ancienne, marquée `// Deprecated:` avec sa remplaçante, et `//go:fix inline`, son corps se réduisant à un appel à la nouvelle : l'éditeur avertit et `go fix` réécrit les appels. La supprimer tout de suite casserait les utilisateurs : on attend la prochaine version majeure."
  - key: scenario-revue
    format: scenario
    question: "Une pull request de `go fix` touche 300 fichiers. Comment la relis-tu ?"
    choices:
      - {text: "Je vérifie qu'elle n'a que des réécritures automatiques, j'en relis un échantillon par type, CI verte", correct: true}
      - {text: "Je relis chacun des 300 fichiers ligne à ligne, puis je l'approuve dans une semaine", correct: false}
      - {text: "Je la fais découper en 30 PR de 10 fichiers, à fusionner une par une sur plusieurs semaines", correct: false}
      - {text: "Je l'approuve sans la lire : les réécritures de `go fix` sont garanties sans risque", correct: false}
    answer: "Je vérifie qu'elle ne contient que des réécritures automatiques, sans changement manuel mêlé, j'en relis un échantillon par type de réécriture, je m'assure que la CI (tests, `-race`, vet) est verte et je regarde de près les fichiers sensibles. Puis je la fusionne vite, pour éviter les conflits ; la découper ou la faire traîner les multiplierait."
