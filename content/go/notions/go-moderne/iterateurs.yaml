  - key: bug-yield-ignore
    format: bug-fix
    question: |-
      Cette boucle panique avec « range function continued iteration after function for loop body returned false ». Quelle correction est la bonne ?
      ```go
      func (l *Liste) All() iter.Seq[int] {
      	return func(yield func(int) bool) {
      		for n := l.tete; n != nil; n = n.suivant {
      			yield(n.valeur)
      		}
      	}
      }
      ```
    choices:
      - {text: "Tester le résultat : `if !yield(n.valeur) { return }`", correct: true}
      - {text: "Récupérer la panic avec un `recover` dans l'itérateur", correct: false}
      - {text: "Renvoyer un `iter.Seq2[int, bool]` au lieu d'un `iter.Seq`", correct: false}
      - {text: "Interdire `break` dans les boucles qui parcourent `All()`", correct: false}
    answer: |-
      ```go
      func (l *Liste) All() iter.Seq[int] {
      	return func(yield func(int) bool) {
      		for n := l.tete; n != nil; n = n.suivant {
      			if !yield(n.valeur) {
      				return
      			}
      		}
      	}
      }
      ```
      Après un `break`, `yield` renvoyait `false` mais l'itérateur continuait de l'appeler : il doit rendre la main dès ce `false`.
  - key: bug-slice
    format: bug-fix
    question: |-
      Cette fonction charge 2 millions de lignes en mémoire, alors que l'appelant ne lit que les premières. Quelle correction est la bonne ?
      ```go
      func Lignes(r io.Reader) []string {
      	var res []string
      	sc := bufio.NewScanner(r)
      	for sc.Scan() {
      		res = append(res, sc.Text())
      	}
      	return res
      }
      ```
    choices:
      - {text: "Renvoyer un `iter.Seq[string]` qui lit à la demande et s'arrête quand `yield` renvoie `false`", correct: true}
      - {text: "Préallouer `res` avec `make([]string, 0, 2_000_000)` pour éviter les copies", correct: false}
      - {text: "Renvoyer un channel rempli par une goroutine, que l'appelant lit jusqu'où il veut", correct: false}
      - {text: "Renvoyer `res[:100]`, puisque l'appelant ne lit que les premières lignes du fichier", correct: false}
    answer: |-
      ```go
      func Lignes(r io.Reader) iter.Seq[string] {
      	return func(yield func(string) bool) {
      		sc := bufio.NewScanner(r)
      		for sc.Scan() {
      			if !yield(sc.Text()) {
      				return
      			}
      		}
      	}
      }
      ```
      Un itérateur paresseux ne lit que ce dont la boucle a besoin. Un channel fuirait sa goroutine si l'appelant s'arrête tôt ; pour remonter l'erreur de lecture, on renverrait un `iter.Seq2[string, error]`.
  - key: bug-pull-stop
    format: bug-fix
    question: |-
      Le profil montre des goroutines qui s'accumulent après chaque appel de ce code. Quelle correction est la bonne ?
      ```go
      next, _ := iter.Pull(seq)
      premier, ok := next()
      if !ok {
      	return 0
      }
      return premier
      ```
    choices:
      - {text: "Garder `stop` et l'appeler avec `defer stop()`", correct: true}
      - {text: "Mettre `next` à `nil` après usage, pour le libérer", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque comparaison", correct: false}
      - {text: "Remplacer `iter.Pull` par `iter.Pull2`, sans `stop`", correct: false}
    answer: |-
      ```go
      next, stop := iter.Pull(seq)
      defer stop()
      premier, ok := next()
      if !ok {
      	return 0
      }
      return premier
      ```
      Un itérateur tiré qui n'est pas allé au bout doit être arrêté avec `stop`, sinon ses ressources ne sont pas libérées. Le GC n'y peut rien, et `iter.Pull2` renvoie aussi un `stop` à appeler.
