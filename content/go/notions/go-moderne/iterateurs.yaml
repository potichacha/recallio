notion: iterateurs
lesson: "Depuis **Go 1.23**, `for range` accepte des **fonctions** : on écrit ses propres itérateurs, utilisables comme une\nslice ou une map.\n\nUn itérateur est une fonction qui reçoit une fonction **`yield`** et l'appelle pour chaque élément ; `yield` renvoie\n`false` quand la boucle s'arrête (`break`, `return`), et l'itérateur doit alors **s'arrêter**.\n\n```go\n// iter.Seq[V] = func(yield func(V) bool)\n// iter.Seq2[K, V] = func(yield func(K, V) bool)\n\nfunc Pairs(n int) iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; i < n; i += 2 {\n\t\t\tif !yield(i) {\n\t\t\t\treturn // la boucle appelante s'est arrêtée\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor p := range Pairs(10) {\n\tif p > 4 {\n\t\tbreak\n\t}\n\tfmt.Println(p) // 0 2 4\n}\n```\n\nLes trois formes acceptées par range : `func(yield func() bool)`, `func(yield func(V) bool)` (`iter.Seq`) et\n`func(yield func(K, V) bool)` (`iter.Seq2`, pour des paires : indice et valeur, clé et valeur, valeur et erreur).\n\nCe qu'il faut savoir :\n- un itérateur est **paresseux** : il ne calcule l'élément suivant que si la boucle le demande, ce qui permet des\n  séquences très longues, voire infinies ;\n- appeler `yield` après qu'il a renvoyé `false` provoque une **panique** à l'exécution ;\n- par convention, une méthode `All()` renvoie un itérateur sur tous les éléments d'une collection ;\n- **`iter.Pull`** transforme un itérateur « poussé » en fonctions `next()` et `stop()` « tirées », pour avancer dans\n  deux séquences à la fois (penser à appeler `stop`).\n\n**En entretien** : « Une fonction qui prend yield ; range dessus depuis Go 1.23 ; s'arrêter quand yield renvoie\nfalse ; iter.Seq et Seq2 ; paresseux ; iter.Pull pour tirer les éléments un par un. »"
cards:
  - key: forme-doit-avoir-fonction-etre-utilisee
    format: course
    question: Quelle forme doit avoir une fonction pour être utilisée avec range (Go 1.23) ?
    answer: '`func(yield func(...) bool)` avec zéro, un ou deux paramètres dans yield.'
  - key: doit-iterateur-quand-yield-renvoie-false
    format: course
    question: Que doit faire un itérateur quand yield renvoie false ?
    answer: S'arrêter immédiatement.
  - key: iter-seq-vs-iter-seq2
    format: course
    question: iter.Seq vs iter.Seq2 ?
    answer: Séquence de valeurs vs séquence de paires clé-valeur.
  - key: sert-iter-pull
    format: course
    question: À quoi sert iter.Pull ?
    answer: Transformer un itérateur push en fonctions next/stop pour le consommer pas à pas.
  - key: ecris-iterateur-uds-arbre-binaire-ordre
    format: scenario
    question: Écris un itérateur sur les nœuds d'un arbre binaire, en ordre infixe.
    answer: |-
      ```go
      type Noeud[T any] struct {
          Val           T
          Gauche, Droit *Noeud[T]
      }

      func (n *Noeud[T]) Infixe() iter.Seq[T] {
          return func(yield func(T) bool) {
              n.parcourir(yield)
          }
      }

      func (n *Noeud[T]) parcourir(yield func(T) bool) bool {
          if n == nil {
              return true
          }
          return n.Gauche.parcourir(yield) && yield(n.Val) && n.Droit.parcourir(yield)
      }

      for v := range racine.Infixe() {
          if v > 100 { break }       // l'itérateur s'arrête proprement
      }
      ```
      "La fonction récursive renvoie `false` dès que `yield` renvoie `false`, ce qui propage l'arrêt dans toute la récursion : un `break` dans la boucle de l'appelant arrête vraiment le parcours. Avant Go 1.23, j'aurais renvoyé un slice (allocation de tous les éléments) ou utilisé un channel (coûteux et risque de fuite si l'appelant n'allait pas jusqu'au bout)."
  - key: terme-iter-seq-seq2
    format: course
    question: Que désigne « iter.Seq / Seq2 » ?
    answer: Types d'itérateurs pour range sur fonctions (Go 1.23)
  - key: vf-arret
    format: true-false
    question: Un itérateur doit s'arrêter dès que `yield` renvoie false.
    truth: true
    answer: Rappeler yield ensuite provoque une panique.
  - key: vf-paresseux
    format: true-false
    question: Un itérateur calcule tous ses éléments avant le premier tour de boucle.
    truth: false
    answer: 'Il est paresseux : chaque élément est produit à la demande.'
  - key: vf-infini
    format: true-false
    question: Un itérateur peut représenter une séquence infinie, à condition que la boucle s'arrête.
    truth: true
    answer: Le break fait renvoyer false à yield.
  - key: vf-version
    format: true-false
    question: Le range sur une fonction est disponible depuis Go 1.21.
    truth: false
    answer: Depuis Go 1.23 (expérimental en 1.22).
  - key: qcm-formes
    format: multiple-choice
    question: Quelles fonctions peut-on parcourir avec for range ?
    choices:
      - text: '`func(yield func(int) bool)`'
        correct: true
      - text: '`func(yield func(string, error) bool)`'
        correct: true
      - text: '`func(yield func() bool)`'
        correct: true
      - text: '`func() []int`'
        correct: false
    answer: 'La dernière se parcourt en appelant d''abord la fonction : range f().'
  - key: qcm-seq2
    format: multiple-choice
    question: Pour quels usages iter.Seq2 convient-il ?
    choices:
      - text: Des paires clé et valeur
        correct: true
      - text: Des lignes lues avec une erreur possible à chaque élément
        correct: true
      - text: Une séquence d'entiers seuls
        correct: false
      - text: Trois valeurs par élément
        correct: false
    answer: Pour plus de deux valeurs, on itère sur une struct.
  - key: qcm-pull
    format: multiple-choice
    question: À quoi sert iter.Pull ?
    choices:
      - text: Obtenir les éléments un par un avec next()
        correct: true
      - text: Parcourir deux séquences en parallèle pour les fusionner ou les comparer
        correct: true
      - text: Rendre un itérateur plus rapide
        correct: false
      - text: Paralléliser un itérateur sur plusieurs goroutines
        correct: false
    answer: Il faut appeler stop() quand on abandonne avant la fin.
  - key: qcm-break
    format: multiple-choice
    question: Que se passe-t-il quand la boucle range fait break ?
    choices:
      - text: L'appel en cours à yield renvoie false
        correct: true
      - text: L'itérateur doit rendre la main, en exécutant ses defer
        correct: true
      - text: L'itérateur continue en arrière-plan
        correct: false
      - text: Une panique est levée dans l'itérateur
        correct: false
    answer: Les defer de l'itérateur s'exécutent normalement, ce qui permet de fermer une ressource.
