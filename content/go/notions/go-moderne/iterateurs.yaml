  - key: code-pairs
    format: code-output
    question: "```go\nfunc pairs(n int) iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; i < n; i += 2 {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor p := range pairs(10) {\n\tfmt.Print(p, \" \")\n}\nfmt.Println()\n```"
    answer: '`0 2 4 6 8`'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"iter\"\n)\n\nfunc pairs(n int) iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; i < n; i += 2 {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tfor p := range pairs(10) {\n\t\tfmt.Print(p, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 2 4 6 8
  - key: code-break
    format: code-output
    question: "```go\nfunc naturels() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tdefer fmt.Println(\"fin de l'itérateur\")\n\t\tfor i := 1; ; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor n := range naturels() {\n\tif n > 3 {\n\t\tbreak\n\t}\n\tfmt.Println(n)\n}\n```"
    answer: '`1`, `2`, `3` puis `fin de l''itérateur` : le break fait renvoyer false à yield, et le defer s''exécute.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"iter\"\n)\n\nfunc naturels() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tdefer fmt.Println(\"fin de l'itérateur\")\n\t\tfor i := 1; ; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tfor n := range naturels() {\n\t\tif n > 3 {\n\t\t\tbreak\n\t\t}\n\t\tfmt.Println(n)\n\t}\n}\n"
      output: |-
        1
        2
        3
        fin de l'itérateur
  - key: code-seq2
    format: code-output
    question: "```go\nfunc enumerer(s []string) iter.Seq2[int, string] {\n\treturn func(yield func(int, string) bool) {\n\t\tfor i, v := range s {\n\t\t\tif !yield(i+1, v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor n, v := range enumerer([]string{\"go\", \"java\"}) {\n\tfmt.Println(n, v)\n}\n```"
    answer: '`1 go` puis `2 java`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"iter\"\n)\n\nfunc enumerer(s []string) iter.Seq2[int, string] {\n\treturn func(yield func(int, string) bool) {\n\t\tfor i, v := range s {\n\t\t\tif !yield(i+1, v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tfor n, v := range enumerer([]string{\"go\", \"java\"}) {\n\t\tfmt.Println(n, v)\n\t}\n}\n"
      output: |-
        1 go
        2 java
  - key: code-pull
    format: code-output
    question: |-
      ```go
      next, stop := iter.Pull(slices.Values([]int{10, 20, 30}))
      defer stop()
      a, ok1 := next()
      b, ok2 := next()
      fmt.Println(a, ok1, b, ok2)
      next()
      _, ok4 := next()
      fmt.Println(ok4)
      ```
    answer: '`10 true 20 true` puis `false` : après le dernier élément, next renvoie false.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"iter\"\n\t\"slices\"\n)\n\nfunc main() {\n\tnext, stop := iter.Pull(slices.Values([]int{10, 20, 30}))\n\tdefer stop()\n\ta, ok1 := next()\n\tb, ok2 := next()\n\tfmt.Println(a, ok1, b, ok2)\n\tnext()\n\t_, ok4 := next()\n\tfmt.Println(ok4)\n}\n"
      output: |-
        10 true 20 true
        false
  - key: bug-yield-ignore
    format: bug-fix
    question: "La boucle panique avec « range function continued iteration after function for loop body returned false » :\n```go\nfunc (l *Liste) All() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor n := l.tete; n != nil; n = n.suivant {\n\t\t\tyield(n.valeur)\n\t\t}\n\t}\n}\n```"
    answer: "```go\nfunc (l *Liste) All() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor n := l.tete; n != nil; n = n.suivant {\n\t\t\tif !yield(n.valeur) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n```\nAprès un break, yield renvoyait false mais l'itérateur continuait de l'appeler."
  - key: bug-slice
    format: bug-fix
    question: "La fonction charge 2 millions de lignes en mémoire alors que l'appelant ne lit que les premières :\n```go\nfunc Lignes(r io.Reader) []string {\n\tvar res []string\n\tsc := bufio.NewScanner(r)\n\tfor sc.Scan() {\n\t\tres = append(res, sc.Text())\n\t}\n\treturn res\n}\n```"
    answer: "```go\nfunc Lignes(r io.Reader) iter.Seq[string] {\n\treturn func(yield func(string) bool) {\n\t\tsc := bufio.NewScanner(r)\n\t\tfor sc.Scan() {\n\t\t\tif !yield(sc.Text()) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n```\nUn itérateur paresseux ne lit que ce dont la boucle a besoin. (Pour remonter l'erreur de lecture, on renverrait un\n`iter.Seq2[string, error]`.)"
  - key: bug-pull-stop
    format: bug-fix
    question: "Le profil montre des goroutines qui s'accumulent après chaque comparaison :\n```go\nnext, _ := iter.Pull(seq)\npremier, ok := next()\nif !ok {\n\treturn 0\n}\nreturn premier\n```"
    answer: "```go\nnext, stop := iter.Pull(seq)\ndefer stop()\npremier, ok := next()\nif !ok {\n\treturn 0\n}\nreturn premier\n```\nUn itérateur tiré qui n'est pas terminé doit être arrêté avec stop, sinon ses ressources ne sont pas libérées."
  - key: bug-erreur
    format: bug-fix
    question: "Les erreurs de lecture disparaissent silencieusement :\n```go\nfunc Enregistrements(r *csv.Reader) iter.Seq[[]string] {\n\treturn func(yield func([]string) bool) {\n\t\tfor {\n\t\t\trec, err := r.Read()\n\t\t\tif err != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif !yield(rec) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n```"
    answer: "```go\nfunc Enregistrements(r *csv.Reader) iter.Seq2[[]string, error] {\n\treturn func(yield func([]string, error) bool) {\n\t\tfor {\n\t\t\trec, err := r.Read()\n\t\t\tif err == io.EOF {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif !yield(rec, err) || err != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n```\nAvec iter.Seq2, chaque élément porte son erreur, que l'appelant traite dans sa boucle."
  - key: scenario-quand
    format: scenario
    question: Quand exposes-tu un itérateur plutôt qu'une slice ?
    answer: |-
      Quand la collection est grande, coûteuse à construire ou infinie, et que l'appelant peut s'arrêter tôt : lignes d'un
      fichier, résultats paginés d'une API, parcours d'arbre. Quand la structure interne ne doit pas être exposée
      (`All()` sur mon type au lieu d'un slice modifiable). Pour une petite collection qu'on manipule ensuite (tri,
      indexation), une slice reste plus simple.
  - key: scenario-vs-channels
    format: scenario
    question: Itérateur ou channel pour exposer une séquence ?
    answer: |-
      Un itérateur, presque toujours : pas de goroutine, pas de fuite si l'appelant s'arrête, et bien plus rapide. Un
      channel n'a de sens que si les éléments sont produits par une autre goroutine, en parallèle du consommateur. Avant
      Go 1.23, on utilisait souvent un channel pour cela ; c'est désormais une source classique de fuites.
  - key: scenario-pagination
    format: scenario
    question: Comment exposerais-tu les résultats paginés d'une API avec un itérateur ?
    answer: |-
      Une méthode `func (c *Client) Commandes(ctx context.Context) iter.Seq2[Commande, error]` : l'itérateur demande une
      page, renvoie ses éléments un par un par yield, puis demande la page suivante tant qu'il y en a et que yield renvoie
      true. Une erreur réseau est passée avec un élément vide, puis l'itérateur s'arrête. L'appelant écrit une simple
      boucle range et peut s'arrêter quand il veut, sans charger les pages suivantes.
