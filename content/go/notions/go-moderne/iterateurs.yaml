    choices:
      - {text: "Renvoyer un `iter.Seq2[[]string, error]` qui passe chaque erreur à `yield`, sauf `io.EOF`", correct: true}
      - {text: "Appeler `log.Fatal(err)` dans l'itérateur dès que la lecture échoue", correct: false}
      - {text: "Paniquer avec l'erreur, pour que l'appelant la récupère avec `recover`", correct: false}
      - {text: "Ignorer l'erreur et passer à l'enregistrement suivant avec `continue`", correct: false}
    answer: |-
      ```go
      func Enregistrements(r *csv.Reader) iter.Seq2[[]string, error] {
      	return func(yield func([]string, error) bool) {
      		for {
      			rec, err := r.Read()
      			if err == io.EOF {
      				return
      			}
      			if !yield(rec, err) || err != nil {
      				return
      			}
      		}
      	}
      }
      ```
      Avec `iter.Seq2`, chaque élément porte son erreur, que l'appelant traite dans sa boucle ; `io.EOF` marque seulement la fin. Arrêter le programme ou paniquer retire ce choix à l'appelant.
  - key: scenario-quand
    format: scenario
    question: "Dans quel cas exposes-tu un itérateur plutôt qu'une slice ?"
    choices:
      - {text: "Une collection grande, coûteuse ou infinie, que l'appelant peut quitter tôt", correct: true}
      - {text: "Toujours : un itérateur est plus rapide qu'une slice, quelle que soit la taille", correct: false}
      - {text: "Une petite collection que l'appelant va trier puis indexer juste après", correct: false}
      - {text: "Jamais pour un type à moi : une slice exportée est plus simple à documenter", correct: false}
    answer: "Quand la collection est grande, coûteuse à construire ou infinie, et que l'appelant peut s'arrêter tôt : lignes d'un fichier, résultats paginés, parcours d'arbre ; ou pour ne pas exposer la structure interne (`All()` plutôt qu'une slice modifiable). Pour une petite collection qu'on trie ou indexe ensuite, une slice reste plus simple."
  - key: scenario-vs-channels
    format: scenario
    question: "Pour exposer une séquence d'éléments, choisis-tu un itérateur ou un channel ?"
    choices:
      - {text: "Un itérateur, sauf si les éléments viennent d'une autre goroutine, en parallèle", correct: true}
      - {text: "Un channel, toujours : c'est la façon idiomatique de produire une séquence en Go", correct: false}
      - {text: "Un channel tamponné, pour que le producteur ne bloque jamais le consommateur", correct: false}
      - {text: "Un itérateur, que je fais remplir par une goroutine pour aller plus vite", correct: false}
    answer: "Un itérateur, presque toujours : pas de goroutine, pas de fuite si l'appelant s'arrête, et bien plus rapide. Un channel n'a de sens que si les éléments sont produits par une autre goroutine ; avant Go 1.23, on en abusait, et c'est une source classique de fuites."
  - key: scenario-pagination
    format: scenario
    question: "Comment exposerais-tu les résultats paginés d'une API avec un itérateur ?"
    choices:
      - {text: "Un `iter.Seq2[Commande, error]` qui charge une page, la passe à `yield`, puis la suivante", correct: true}
      - {text: "Un `iter.Seq[Commande]` qui charge d'abord toutes les pages, puis les parcourt", correct: false}
      - {text: "Un `iter.Seq[[]Commande]` qui renvoie chaque page entière, sans gérer les erreurs", correct: false}
      - {text: "Un channel de commandes rempli par une goroutine, qui lit les pages en avance", correct: false}
    answer: "`func (c *Client) Commandes(ctx context.Context) iter.Seq2[Commande, error]` : l'itérateur demande une page, renvoie ses éléments un par un, puis demande la suivante tant que `yield` renvoie `true`. Une erreur réseau est passée avec un élément vide, puis l'itérateur s'arrête ; l'appelant peut s'arrêter quand il veut, sans charger les pages suivantes."
