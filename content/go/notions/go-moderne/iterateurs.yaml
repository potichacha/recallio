notion: iterateurs
lesson: "Depuis **Go 1.23**, `for range` accepte des **fonctions** : on écrit ses propres itérateurs, utilisables comme une\nslice ou une map.\n\nUn itérateur est une fonction qui reçoit une fonction **`yield`** et l'appelle pour chaque élément ; `yield` renvoie\n`false` quand la boucle s'arrête (`break`, `return`), et l'itérateur doit alors **s'arrêter**.\n\n```go\n// iter.Seq[V] = func(yield func(V) bool)\n// iter.Seq2[K, V] = func(yield func(K, V) bool)\n\nfunc Pairs(n int) iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; i < n; i += 2 {\n\t\t\tif !yield(i) {\n\t\t\t\treturn // la boucle appelante s'est arrêtée\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor p := range Pairs(10) {\n\tif p > 4 {\n\t\tbreak\n\t}\n\tfmt.Println(p) // 0 2 4\n}\n```\n\nLes trois formes acceptées par range : `func(yield func() bool)`, `func(yield func(V) bool)` (`iter.Seq`) et\n`func(yield func(K, V) bool)` (`iter.Seq2`, pour des paires : indice et valeur, clé et valeur, valeur et erreur).\n\nCe qu'il faut savoir :\n- un itérateur est **paresseux** : il ne calcule l'élément suivant que si la boucle le demande, ce qui permet des\n  séquences très longues, voire infinies ;\n- appeler `yield` après qu'il a renvoyé `false` provoque une **panique** à l'exécution ;\n- par convention, une méthode `All()` renvoie un itérateur sur tous les éléments d'une collection ;\n- **`iter.Pull`** transforme un itérateur « poussé » en fonctions `next()` et `stop()` « tirées », pour avancer dans\n  deux séquences à la fois (penser à appeler `stop`).\n\n**En entretien** : « Une fonction qui prend yield ; range dessus depuis Go 1.23 ; s'arrêter quand yield renvoie\nfalse ; iter.Seq et Seq2 ; paresseux ; iter.Pull pour tirer les éléments un par un. »"
cards:
  - key: forme-doit-avoir-fonction-etre-utilisee
    format: course
    question: "Quelle forme doit avoir une fonction pour qu'on la parcoure avec `range` (Go 1.23) ?"
    choices:
      - {text: "`func(yield func(...) bool)`, avec 0, 1 ou 2 paramètres dans `yield`", correct: true}
      - {text: "`func() (T, bool)`, appelée jusqu'à ce qu'elle renvoie `false`", correct: false}
      - {text: "`func(yield func(...))`, sans valeur de retour pour `yield`", correct: false}
      - {text: "Un type avec `HasNext() bool` et `Next() T`, comme un `Iterator` Java", correct: false}
    answer: "Une fonction qui reçoit `yield`, de forme `func(yield func(...) bool)`, avec zéro, un ou deux paramètres. Le `bool` renvoyé par `yield` dit à l'itérateur s'il doit continuer ; `func() (T, bool)` est la forme de `next` dans `iter.Pull`."
  - key: doit-iterateur-quand-yield-renvoie-false
    format: course
    question: "Que doit faire un itérateur quand `yield` renvoie `false` ?"
    choices:
      - {text: "S'arrêter aussitôt et rendre la main, ses `defer` s'exécutant", correct: true}
      - {text: "Continuer sa boucle, sans appeler `yield` pour les éléments restants", correct: false}
      - {text: "Appeler `yield` une dernière fois avec la valeur zéro, pour finir", correct: false}
      - {text: "Paniquer, pour signaler à l'appelant que sa boucle a été interrompue", correct: false}
    answer: "S'arrêter immédiatement : `false` veut dire que la boucle a fait `break` ou `return`. Rappeler `yield` après provoque une panic (« range function continued iteration »)."
  - key: iter-seq-vs-iter-seq2
    format: course
    question: "Quelle différence y a-t-il entre `iter.Seq` et `iter.Seq2` ?"
    choices:
      - {text: "`Seq` donne une valeur par élément, `Seq2` une paire, comme une clé et sa valeur", correct: true}
      - {text: "`Seq` est paresseux, `Seq2` charge tous ses éléments en mémoire avant le parcours", correct: false}
      - {text: "`Seq` se parcourt une seule fois, `Seq2` peut être parcouru deux fois de suite", correct: false}
      - {text: "`Seq2` est la version 2 de `Seq`, qui la remplace et la déprécie depuis Go 1.24", correct: false}
    answer: "`iter.Seq[V]` produit une valeur par tour, `iter.Seq2[K, V]` une paire (clé et valeur, valeur et erreur). Le 2 compte les valeurs, pas une version : les deux coexistent."
  - key: sert-iter-pull
    format: course
    question: "À quoi sert la fonction `iter.Pull` ?"
    choices:
      - {text: "À consommer un itérateur pas à pas, avec des fonctions `next` et `stop`", correct: true}
      - {text: "À paralléliser un itérateur, en répartissant ses éléments entre goroutines", correct: false}
      - {text: "À transformer une slice en itérateur, pour la parcourir avec `range`", correct: false}
      - {text: "À accélérer un itérateur, en préchargeant ses éléments dans un tampon", correct: false}
    answer: "Il transforme un itérateur « push » (qui appelle `yield`) en fonctions `next` et `stop`, pour tirer les éléments un par un, par exemple pour avancer dans deux séquences à la fois. On appelle `stop` si on abandonne avant la fin."
  - key: ecris-iterateur-uds-arbre-binaire-ordre
    format: scenario
    question: "Tu écris un itérateur infixe sur un arbre binaire, avec une fonction récursive `parcourir(yield) bool`. Comment fais-tu pour qu'un `break` de l'appelant arrête tout le parcours ?"
    choices:
      - {text: "`parcourir` renvoie `false` dès que `yield` renvoie `false`, et chaque appel le propage", correct: true}
      - {text: "Je lance le parcours dans une goroutine, qui envoie les nœuds dans un channel", correct: false}
      - {text: "J'ignore le résultat de `yield` : le `break` de l'appelant arrête la récursion seul", correct: false}
      - {text: "Je remplis d'abord une slice de tous les nœuds, puis j'appelle `yield` sur chacun", correct: false}
    answer: |-
      ```go
      type Noeud[T any] struct {
          Val           T
          Gauche, Droit *Noeud[T]
      }

      func (n *Noeud[T]) Infixe() iter.Seq[T] {
          return func(yield func(T) bool) {
              n.parcourir(yield)
          }
      }

      func (n *Noeud[T]) parcourir(yield func(T) bool) bool {
          if n == nil {
              return true
          }
          return n.Gauche.parcourir(yield) && yield(n.Val) && n.Droit.parcourir(yield)
      }

      for v := range racine.Infixe() {
          if v > 100 { break }       // l'itérateur s'arrête proprement
      }
      ```
      `parcourir` renvoie `false` dès que `yield` renvoie `false`, et `&&` propage l'arrêt dans toute la récursion : un `break` arrête vraiment le parcours. Ignorer `yield` ferait paniquer la boucle ; une slice allouerait tous les nœuds, un channel coûterait une goroutine qui fuit si l'appelant s'arrête tôt.
  - key: terme-iter-seq-seq2
    format: course
    question: "Que désignent les types `iter.Seq` et `iter.Seq2` ?"
    choices:
      - {text: "Les types des itérateurs qu'on parcourt avec `range` sur une fonction (Go 1.23)", correct: true}
      - {text: "Les types des channels qu'on ferme pour signaler la fin d'une séquence", correct: false}
      - {text: "Des interfaces `Iterator` à implémenter avec `Next` et `Value`, comme en Java", correct: false}
      - {text: "Les types des slices paresseuses, calculées à la demande (Go 1.21)", correct: false}
    answer: "Les types d'itérateurs du package `iter` : `Seq[V]` est `func(yield func(V) bool)`, `Seq2[K, V]` sa version à paires. Ce sont de simples fonctions, pas des interfaces à implémenter."
  - key: vf-arret
    format: true-false
    question: Un itérateur doit s'arrêter dès que `yield` renvoie false.
    truth: true
    answer: Rappeler yield ensuite provoque une panique.
  - key: vf-paresseux
    format: true-false
    question: Un itérateur calcule tous ses éléments avant le premier tour de boucle.
    truth: false
    answer: 'Il est paresseux : chaque élément est produit à la demande.'
  - key: vf-infini
    format: true-false
    question: Un itérateur peut représenter une séquence infinie, à condition que la boucle s'arrête.
    truth: true
    answer: Le break fait renvoyer false à yield.
  - key: vf-version
    format: true-false
    question: Le range sur une fonction est disponible depuis Go 1.21.
    truth: false
    answer: Depuis Go 1.23 (expérimental en 1.22).
  - key: qcm-formes
    format: multiple-choice
    question: "Laquelle de ces fonctions `f` ne peut-on pas parcourir directement avec `for range f` ?"
    choices:
      - {text: "`func() []int`", correct: true}
      - {text: "`func(yield func(int) bool)`", correct: false}
      - {text: "`func(yield func(string, error) bool)`", correct: false}
      - {text: "`func(yield func() bool)`", correct: false}
    answer: "Les trois autres sont des itérateurs (`yield` à zéro, un ou deux paramètres). `func() []int` se parcourt en l'appelant d'abord : `range f()`."
  - key: qcm-seq2
    format: multiple-choice
    question: "Lequel de ces usages appelle un `iter.Seq2` ?"
    choices:
      - {text: "Des lignes lues, avec une erreur possible à chaque élément", correct: true}
      - {text: "Une séquence d'entiers seuls, produits un par un", correct: false}
      - {text: "Trois valeurs par élément : un nom, un âge et une ville", correct: false}
      - {text: "Une séquence de chaînes, sans erreur possible à la lecture", correct: false}
    answer: "`Seq2` porte deux valeurs par tour : une clé et sa valeur, ou un élément et son erreur. Pour une valeur seule, `iter.Seq` ; pour trois, une struct dans un `iter.Seq`."
  - key: qcm-pull
    format: multiple-choice
    question: "Dans quel cas `iter.Pull` est-il utile ?"
    choices:
      - {text: "Parcourir deux séquences en parallèle, pour les fusionner ou les comparer", correct: true}
      - {text: "Rendre un itérateur plus rapide, en préchargeant ses éléments", correct: false}
      - {text: "Répartir les éléments d'un itérateur entre plusieurs goroutines", correct: false}
      - {text: "Parcourir une seule séquence, du début à la fin, sans `break`", correct: false}
    answer: "Avec `next`, on avance dans chaque séquence à son rythme, ce qu'une boucle `range` ne permet pas pour deux séquences. Il n'accélère ni ne parallélise rien, et il faut appeler `stop` si on abandonne avant la fin."
  - key: qcm-break
    format: multiple-choice
    question: "Quand une boucle `range` sur un itérateur fait `break`, que se passe-t-il ?"
    choices:
      - {text: "`yield` renvoie `false`, l'itérateur rend la main et ses `defer` s'exécutent", correct: true}
      - {text: "L'itérateur continue en arrière-plan jusqu'à son dernier élément", correct: false}
      - {text: "Une panic est levée dans l'itérateur, et `range` la récupère aussitôt", correct: false}
      - {text: "L'itérateur est suspendu, et reprendra là où il était à la boucle suivante", correct: false}
    answer: "L'appel en cours à `yield` renvoie `false` ; l'itérateur doit rendre la main, et ses `defer` s'exécutent normalement, ce qui permet de fermer une ressource. Rien ne tourne en arrière-plan."
