  - key: trous-arret
    format: fill-in
    question: "Complétez le test d'arrêt :\n```go\nfor n := l.tete; n != nil; n = n.suivant {\n\tif ___ yield(n.valeur) {\n\t\treturn\n\t}\n}\n```"
    blanks:
      - - '!'
