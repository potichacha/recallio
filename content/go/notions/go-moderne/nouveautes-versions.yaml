notion: nouveautes-versions
cards:
  - key: rythme-sortent-versions
    format: course
    question: À quel rythme sortent les versions de Go ?
    answer: Tous les six mois, en février et en août.
  - key: versions-sont-supportees
    format: course
    question: Quelles versions sont supportées ?
    answer: Les deux dernières versions majeures (1.26 et 1.27 en octobre 2026).
  - key: premier-package-v2-bibliotheque-standard
    format: course
    question: Quel est le premier package "v2" de la bibliothèque standard ?
    answer: math/rand/v2 (Go 1.22).
  - key: grande-nouveaute-1-27-langage
    format: course
    question: Quelle est la grande nouveauté de Go 1.27 pour le langage ?
    answer: Les méthodes génériques.
  - key: depuis-quand-modules-existent-ils
    format: course
    question: Depuis quand les modules existent-ils ?
    answer: Go 1.11 (expérimental), par défaut depuis Go 1.16.
  - key: depuis-quand-context-bibliotheque-standard
    format: course
    question: Depuis quand context est-il dans la bibliothèque standard ?
    answer: Go 1.7.
  - key: depuis-quand-wrapping-erreurs-existe
    format: course
    question: Depuis quand le wrapping d'erreurs existe-t-il ?
    answer: Go 1.13.
