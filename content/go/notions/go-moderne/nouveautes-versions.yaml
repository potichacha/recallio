notion: nouveautes-versions
lesson: |-
  Go sort une version majeure **tous les six mois** (février et août) ; les **deux dernières** sont maintenues
  (correctifs de sécurité). La **promesse de compatibilité Go 1** garantit qu'un programme valide continue de
  compiler et de fonctionner avec les versions suivantes.

  Les jalons à connaître :

  | Version | Nouveautés marquantes |
  |---|---|
  | 1.11-1.13 | les **modules** (`go.mod`), le wrapping d'erreurs (`%w`, `errors.Is`, `errors.As`) |
  | 1.18 (2022) | les **génériques**, le fuzzing intégré, les workspaces |
  | 1.19 | les types atomiques (`atomic.Int64`), `GOMEMLIMIT`, le modèle mémoire révisé |
  | 1.20 | `errors.Join`, `context.WithCancelCause`, la PGO en aperçu |
  | 1.21 | `min`, `max`, `clear`, les packages `slices`, `maps`, `log/slog`, la PGO stable, la directive `toolchain` |
  | 1.22 | une **variable de boucle par tour**, `range` sur un entier, `math/rand/v2`, les motifs de `net/http.ServeMux` |
  | 1.23 | les **itérateurs** (range sur une fonction), le package `unique` |
  | 1.24 | les alias de types génériques, `b.Loop`, `os.Root`, `weak`, `t.Context`, les outils du module (`go get -tool`), des maps plus rapides (Swiss tables) |
  | 1.25 | `sync.WaitGroup.Go`, `testing/synctest`, `GOMAXPROCS` adapté aux conteneurs, le flight recorder |
  | 1.26 | `new(expr)`, `go fix` et ses modernisations, `errors.AsType` |
  | 1.27 | les méthodes génériques |

  La directive **`go`** du `go.mod` fixe la version du langage du module (et active ses nouveautés, comme la variable
  de boucle de 1.22) ; la directive **`toolchain`** (1.21) indique la chaîne d'outils à utiliser, téléchargée
  automatiquement si besoin.

  **En entretien** : on attend surtout les génériques (1.18), slices, maps et slog (1.21), la variable de boucle (1.22) et
  les itérateurs (1.23), avec un exemple d'usage, et la compatibilité Go 1.
cards:
  - key: rythme-sortent-versions
    format: course
    question: "À quel rythme sortent les versions de Go ?"
    choices:
      - {text: "Tous les six mois, en février et en août", correct: true}
      - {text: "Une fois par an, en novembre, pour l'anniversaire", correct: false}
      - {text: "Tous les trois mois, une version par trimestre", correct: false}
      - {text: "Tous les six mois, en mars et en septembre", correct: false}
    answer: "Deux versions par an, en février et en août. Java sort aussi tous les six mois, mais en mars et en septembre."
  - key: versions-sont-supportees
    format: course
    question: "Quelles versions de Go reçoivent des correctifs de sécurité ?"
    choices:
      - {text: "Les deux dernières versions majeures, comme 1.26 et 1.27 fin 2026", correct: true}
      - {text: "Toutes les versions depuis Go 1.0, grâce à la promesse de compatibilité", correct: false}
      - {text: "La dernière seulement : il faut monter de version tous les six mois", correct: false}
      - {text: "Des versions LTS, choisies tous les deux ans et maintenues trois ans", correct: false}
    answer: "Les deux dernières versions majeures (1.26 et 1.27 en octobre 2026) : une version est donc supportée environ un an. Go n'a pas de LTS, et la compatibilité Go 1 ne prolonge pas les correctifs."
  - key: premier-package-v2-bibliotheque-standard
    format: course
    question: "Quel est le premier package « v2 » de la bibliothèque standard ?"
    choices:
      - {text: "`math/rand/v2`, en Go 1.22", correct: true}
      - {text: "`encoding/json/v2`, en Go 1.21", correct: false}
      - {text: "`net/http/v2`, en Go 1.6", correct: false}
      - {text: "`log/v2`, en Go 1.21", correct: false}
    answer: "`math/rand/v2` (Go 1.22), avec une API revue et de meilleurs générateurs. `encoding/json/v2` n'est venu qu'après, d'abord en expérimentation ; `log/slog` est un nouveau package, pas une v2 de `log`."
  - key: grande-nouveaute-1-27-langage
    format: course
    question: "Quelle est la grande nouveauté de Go 1.27 pour le langage ?"
    choices:
      - {text: "Les méthodes génériques", correct: true}
      - {text: "Les génériques eux-mêmes", correct: false}
      - {text: "Le range sur une fonction", correct: false}
      - {text: "Les types somme, ou unions", correct: false}
    answer: "Les méthodes génériques : une méthode peut avoir ses propres paramètres de type. Les génériques datent de 1.18, le range sur une fonction de 1.23."
  - key: depuis-quand-modules-existent-ils
    format: course
    question: "Depuis quelle version de Go les modules existent-ils ?"
    choices:
      - {text: "Go 1.11, en expérimental, et par défaut depuis Go 1.16", correct: true}
      - {text: "Go 1.0, avec le `GOPATH`, et par défaut depuis Go 1.5", correct: false}
      - {text: "Go 1.13, et par défaut depuis Go 1.18, avec les génériques", correct: false}
      - {text: "Go 1.16, en expérimental, et par défaut depuis Go 1.21", correct: false}
    answer: "Les modules arrivent en Go 1.11, en expérimental, et deviennent le mode par défaut en Go 1.16. Avant, tout le code vivait dans le `GOPATH`."
  - key: depuis-quand-context-bibliotheque-standard
    format: course
    question: "Depuis quelle version le package `context` est-il dans la bibliothèque standard ?"
    choices:
      - {text: "Go 1.7", correct: true}
      - {text: "Go 1.0", correct: false}
      - {text: "Go 1.11", correct: false}
      - {text: "Go 1.13", correct: false}
    answer: "Go 1.7 (2016) : il venait de `golang.org/x/net/context`. `net/http` l'a adopté dans la même version, avec `Request.Context()`."
  - key: depuis-quand-wrapping-erreurs-existe
    format: course
    question: "Depuis quelle version le wrapping d'erreurs (`%w`, `errors.Is`, `errors.As`) existe-t-il ?"
    choices:
      - {text: "Go 1.13", correct: true}
      - {text: "Go 1.0", correct: false}
      - {text: "Go 1.18", correct: false}
      - {text: "Go 1.20", correct: false}
    answer: "Go 1.13 : `%w` dans `fmt.Errorf`, `errors.Is`, `errors.As` et `errors.Unwrap`. Go 1.20 y a ajouté `errors.Join` et plusieurs `%w` dans un même appel."
  - key: vf-rythme
    format: true-false
    question: Go sort une nouvelle version majeure tous les six mois.
    truth: true
    answer: En février et en août.
  - key: vf-compat
    format: true-false
    question: La promesse de compatibilité Go 1 garantit qu'un programme valide continue de compiler avec les versions suivantes.
    truth: true
    answer: À quelques exceptions près (sécurité, bugs), ce qui permet de monter de version sans réécrire.
  - key: vf-generiques
    format: true-false
    question: Les génériques sont arrivés en Go 1.21.
    truth: false
    answer: En Go 1.18 (mars 2022) ; 1.21 a ajouté les packages slices et maps qui les utilisent.
  - key: vf-boucle
    format: true-false
    question: Depuis Go 1.22, chaque tour de boucle for a sa propre variable.
    truth: true
    answer: Pour les modules dont le go.mod déclare go 1.22 ou plus.
  - key: qcm-121
    format: multiple-choice
    question: "Lequel de ces ajouts date de Go 1.21 ?"
    choices:
      - {text: "Les packages `slices`, `maps` et `log/slog`", correct: true}
      - {text: "Les génériques, avec les contraintes de type", correct: false}
      - {text: "Les itérateurs, avec le range sur une fonction", correct: false}
      - {text: "Le range sur un entier, `for i := range 10`", correct: false}
    answer: "Go 1.21 a apporté `slices`, `maps`, `log/slog`, et aussi `min`, `max` et `clear`. Les génériques datent de 1.18, le range sur un entier de 1.22, les itérateurs de 1.23."
  - key: qcm-123
    format: multiple-choice
    question: "Lequel de ces ajouts date de Go 1.23 ?"
    choices:
      - {text: "Le range sur une fonction, c'est-à-dire les itérateurs", correct: true}
      - {text: "Les modules, qui remplacent le `GOPATH`", correct: false}
      - {text: "`errors.Join`, pour combiner plusieurs erreurs", correct: false}
      - {text: "Le package `slices`, et ses fonctions génériques", correct: false}
    answer: "Go 1.23 a apporté le range sur une fonction, avec le package `iter`, et aussi le package `unique`. Les modules datent de 1.11, `errors.Join` de 1.20, `slices` de 1.21."
  - key: qcm-125
    format: multiple-choice
    question: "Laquelle de ces nouveautés n'est pas de Go 1.25 ?"
    choices:
      - {text: "Le `range` sur un entier", correct: true}
      - {text: "`sync.WaitGroup.Go`", correct: false}
      - {text: "Le package `testing/synctest`", correct: false}
      - {text: "Un `GOMAXPROCS` par défaut qui tient compte des limites du conteneur", correct: false}
    answer: "Le range sur un entier date de Go 1.22. `sync.WaitGroup.Go`, `testing/synctest` et le `GOMAXPROCS` qui tient compte du conteneur sont de Go 1.25."
  - key: qcm-gomod
    format: multiple-choice
    question: "Lesquelles de ces affirmations sur les directives du `go.mod` sont justes ?"
    choices:
      - text: '`go` fixe la version du langage du module'
        correct: true
      - text: '`toolchain` indique la chaîne d''outils à utiliser'
        correct: true
      - text: '`go` fixe la version minimale du système d''exploitation'
        correct: false
      - text: '`toolchain` installe les dépendances'
        correct: false
    answer: "`go` fixe la version du langage du module, qui active ou non des changements comme la variable de boucle par tour ; `toolchain` indique la chaîne d'outils à utiliser. Les dépendances, c'est `require`."
  - key: scenario-montee
    format: scenario
    question: Comment montes-tu un service de Go 1.21 à la dernière version ?
    choices:
      - {text: "Notes de version, directive `go`, tests avec `-race`, puis un déploiement progressif surveillé", correct: true}
      - {text: "Changer la directive `go` et déployer partout d'un coup : la compatibilité Go 1 suffit", correct: false}
      - {text: "Réécrire le service avec les nouvelles API, avant de changer la version du `go.mod`", correct: false}
      - {text: "Attendre la prochaine version LTS de Go, qui garantit qu'aucun comportement ne change", correct: false}
    answer: "Je lis les notes de version (changements de comportement, `GODEBUG`), je change la directive `go`, je lance les tests avec `-race`, `go vet` et les linters, puis je déploie progressivement en surveillant latence, mémoire et GC. Les changements de comportement suivent la version du `go.mod` et se règlent par `GODEBUG` : je sais revenir en arrière ponctuellement. Enfin, `go fix` modernise le code."
  - key: scenario-boucle
    format: scenario
    question: "Qu'a changé Go 1.22 pour la variable d'une boucle `for`, et pourquoi ?"
    choices:
      - {text: "Chaque tour a sa propre variable, pour que les closures ne voient plus la dernière valeur", correct: true}
      - {text: "La variable est partagée entre les tours, pour éviter une allocation à chaque tour", correct: false}
      - {text: "La variable devient immuable dans le corps, pour qu'on ne la modifie plus par erreur", correct: false}
      - {text: "Les goroutines lancées dans la boucle copient la variable, mais pas les closures", correct: false}
    answer: "Avant 1.22, la boucle avait une seule variable, réutilisée à chaque tour : une closure ou une goroutine qui la capturait voyait souvent la dernière valeur (d'où les `i := i`). Depuis, chaque tour a la sienne, seulement pour les modules qui déclarent `go 1.22` ou plus, pour ne rien casser."
  - key: scenario-retard
    format: scenario
    question: Ton entreprise est restée en Go 1.19. Quels arguments donnes-tu pour monter de version ?
    choices:
      - {text: "Les correctifs de sécurité, des gains de performance gratuits et des API plus simples", correct: true}
      - {text: "Les génériques, absents de Go 1.19, sans lesquels le code ne peut plus évoluer", correct: false}
      - {text: "La fin de la compatibilité Go 1 : le code en 1.19 cessera bientôt de compiler", correct: false}
      - {text: "L'image : les candidats fuient les projets qui ne sont pas sur la dernière version", correct: false}
    answer: "La sécurité d'abord : seules les deux dernières versions reçoivent des correctifs. Puis les gains gratuits (compilateur, GC, PGO, `GOMAXPROCS` adapté aux conteneurs) et la productivité (`slices`, `slog`, itérateurs, `wg.Go`, la variable de boucle). Les génériques existent depuis 1.18, et la compatibilité Go 1 rend la montée peu risquée."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande quelles nouveautés récentes de Go tu utilises au quotidien. Que réponds-tu ?"
    choices:
      - {text: "Celles que j'utilise vraiment, chacune avec un exemple : `slices`, `slog`, les itérateurs", correct: true}
      - {text: "Les génériques partout, puisqu'ils remplacent les interfaces dans le code moderne", correct: false}
      - {text: "La liste complète des nouveautés de chaque version depuis Go 1.18, apprise par cœur", correct: false}
      - {text: "Aucune : grâce à la compatibilité Go 1, le Go d'il y a dix ans me suffit toujours", correct: false}
    answer: "Celles que j'utilise vraiment, chacune avec un exemple concret : `slices` et `maps`, `log/slog`, `errors.Join`, le range sur un entier, les itérateurs, `wg.Go`, `t.Context()` ou synctest. Les génériques pour quelques utilitaires, pas partout : ils ne remplacent pas les interfaces."
