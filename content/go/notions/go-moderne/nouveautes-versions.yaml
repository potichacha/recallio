notion: nouveautes-versions
lesson: |-
  Go sort une version majeure **tous les six mois** (février et août) ; les **deux dernières** sont maintenues
  (correctifs de sécurité). La **promesse de compatibilité Go 1** garantit qu'un programme valide continue de
  compiler et de fonctionner avec les versions suivantes.

  Les jalons à connaître :

  | Version | Nouveautés marquantes |
  |---|---|
  | 1.11-1.13 | les **modules** (`go.mod`), le wrapping d'erreurs (`%w`, `errors.Is`, `errors.As`) |
  | 1.18 (2022) | les **génériques**, le fuzzing intégré, les workspaces |
  | 1.19 | les types atomiques (`atomic.Int64`), `GOMEMLIMIT`, le modèle mémoire révisé |
  | 1.20 | `errors.Join`, `context.WithCancelCause`, la PGO en aperçu |
  | 1.21 | `min`, `max`, `clear`, les packages `slices`, `maps`, `log/slog`, la PGO stable, la directive `toolchain` |
  | 1.22 | une **variable de boucle par tour**, `range` sur un entier, `math/rand/v2`, les motifs de `net/http.ServeMux` |
  | 1.23 | les **itérateurs** (range sur une fonction), le package `unique` |
  | 1.24 | les alias de types génériques, `b.Loop`, `os.Root`, `weak`, `t.Context`, les outils du module (`go get -tool`), des maps plus rapides (Swiss tables) |
  | 1.25 | `sync.WaitGroup.Go`, `testing/synctest`, `GOMAXPROCS` adapté aux conteneurs, le flight recorder |
  | 1.26 | `new(expr)`, `go fix` et ses modernisations, `errors.AsType` |
  | 1.27 | les méthodes génériques |

  La directive **`go`** du `go.mod` fixe la version du langage du module (et active ses nouveautés, comme la variable
  de boucle de 1.22) ; la directive **`toolchain`** (1.21) indique la chaîne d'outils à utiliser, téléchargée
  automatiquement si besoin.

  **En entretien** : on attend surtout les génériques (1.18), slices, maps et slog (1.21), la variable de boucle (1.22) et
  les itérateurs (1.23), avec un exemple d'usage, et la compatibilité Go 1.
cards:
  - key: rythme-sortent-versions
    format: course
    question: À quel rythme sortent les versions de Go ?
    answer: Tous les six mois, en février et en août.
  - key: versions-sont-supportees
    format: course
    question: Quelles versions sont supportées ?
    answer: Les deux dernières versions majeures (1.26 et 1.27 en octobre 2026).
  - key: premier-package-v2-bibliotheque-standard
    format: course
    question: Quel est le premier package "v2" de la bibliothèque standard ?
    answer: math/rand/v2 (Go 1.22).
  - key: grande-nouveaute-1-27-langage
    format: course
    question: Quelle est la grande nouveauté de Go 1.27 pour le langage ?
    answer: Les méthodes génériques.
  - key: depuis-quand-modules-existent-ils
    format: course
    question: Depuis quand les modules existent-ils ?
    answer: Go 1.11 (expérimental), par défaut depuis Go 1.16.
  - key: depuis-quand-context-bibliotheque-standard
    format: course
    question: Depuis quand context est-il dans la bibliothèque standard ?
    answer: Go 1.7.
  - key: depuis-quand-wrapping-erreurs-existe
    format: course
    question: Depuis quand le wrapping d'erreurs existe-t-il ?
    answer: Go 1.13.
  - key: vf-rythme
    format: true-false
    question: Go sort une nouvelle version majeure tous les six mois.
    truth: true
    answer: En février et en août.
  - key: vf-compat
    format: true-false
    question: La promesse de compatibilité Go 1 garantit qu'un programme valide continue de compiler avec les versions suivantes.
    truth: true
    answer: À quelques exceptions près (sécurité, bugs), ce qui permet de monter de version sans réécrire.
  - key: vf-generiques
    format: true-false
    question: Les génériques sont arrivés en Go 1.21.
    truth: false
    answer: En Go 1.18 (mars 2022) ; 1.21 a ajouté les packages slices et maps qui les utilisent.
  - key: vf-boucle
    format: true-false
    question: Depuis Go 1.22, chaque tour de boucle for a sa propre variable.
    truth: true
    answer: Pour les modules dont le go.mod déclare go 1.22 ou plus.
  - key: qcm-121
    format: multiple-choice
    question: Qu'a apporté Go 1.21 ?
    choices:
      - text: Les fonctions natives min, max et clear
        correct: true
      - text: Les packages slices, maps et log/slog
        correct: true
      - text: Les génériques
        correct: false
      - text: Les itérateurs
        correct: false
    answer: Génériques en 1.18, itérateurs en 1.23.
  - key: qcm-123
    format: multiple-choice
    question: Qu'a apporté Go 1.23 ?
    choices:
      - text: Le range sur une fonction (itérateurs)
        correct: true
      - text: Le package unique
        correct: true
      - text: Les modules
        correct: false
      - text: errors.Join
        correct: false
    answer: Les modules datent de 1.11, errors.Join de 1.20.
  - key: qcm-125
    format: multiple-choice
    question: Lesquelles sont des nouveautés de Go 1.25 ?
    choices:
      - text: '`sync.WaitGroup.Go`'
        correct: true
      - text: '`testing/synctest`'
        correct: true
      - text: Une valeur par défaut de GOMAXPROCS qui tient compte des limites du conteneur
        correct: true
      - text: '`range` sur un entier'
        correct: false
    answer: Le range sur un entier date de 1.22.
  - key: qcm-gomod
    format: multiple-choice
    question: Que contrôlent les directives du go.mod ?
    choices:
      - text: '`go` fixe la version du langage du module'
        correct: true
      - text: '`toolchain` indique la chaîne d''outils à utiliser'
        correct: true
      - text: '`go` fixe la version minimale du système d''exploitation'
        correct: false
      - text: '`toolchain` installe les dépendances'
        correct: false
    answer: La version du langage active ou non des changements comme la variable de boucle par tour.
  - key: scenario-montee
    format: scenario
    question: Comment montes-tu un service de Go 1.21 à la dernière version ?
    answer: |-
      Je lis les notes de version intermédiaires (changements de comportement, GODEBUG), je change la directive `go` du
      go.mod, je lance la suite de tests avec `-race`, `go vet` et les linters, puis je déploie progressivement en
      surveillant les métriques (latence, mémoire, GC). Les changements de comportement sont protégés par des réglages
      `GODEBUG` liés à la version du go.mod : je les connais pour pouvoir revenir en arrière ponctuellement. Enfin,
      `go fix` modernise le code.
  - key: scenario-boucle
    format: scenario
    question: Explique le changement de la variable de boucle en Go 1.22 et pourquoi il a été fait.
    answer: |-
      Avant 1.22, une boucle for avait une seule variable, réutilisée à chaque tour : une closure ou une goroutine qui la
      capturait voyait souvent la dernière valeur, ce qui causait des bugs très courants (on écrivait `i := i`). Depuis
      1.22, chaque tour crée sa variable. Le changement ne s'applique qu'aux modules qui déclarent go 1.22 ou plus, pour
      ne rien casser, et `go vet` signalait déjà ce piège.
  - key: scenario-retard
    format: scenario
    question: Ton entreprise est restée en Go 1.19. Quels arguments donnes-tu pour monter de version ?
    answer: |-
      La sécurité d'abord : seules les deux dernières versions reçoivent des correctifs. Puis les gains gratuits :
      performances du compilateur et du GC, PGO, GOMAXPROCS adapté aux conteneurs. Enfin la productivité : slices, maps,
      slog, itérateurs, wg.Go, la variable de boucle qui supprime une classe de bugs. La compatibilité Go 1 rend la
      montée peu risquée, surtout avec une bonne suite de tests.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande quelles nouveautés récentes de Go tu utilises au quotidien.
    answer: |-
      Les génériques pour quelques utilitaires (pas partout), les packages slices et maps (`slices.Sort`,
      `slices.Contains`, `maps.Keys`), log/slog pour des journaux structurés, `errors.Join`, le range sur un entier, les
      itérateurs pour exposer des parcours, `wg.Go`, et `t.Context()` ou synctest dans les tests. Je donne un exemple
      concret pour chacun que je cite.
