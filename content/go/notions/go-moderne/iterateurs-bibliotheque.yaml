notion: iterateurs-bibliotheque
lesson: "Depuis Go 1.23, la bibliothèque standard fournit des itérateurs et des fonctions qui les consomment :\n\n| Fonction | Rôle |\n|---|---|\n| `slices.All(s)`, `slices.Values(s)`, `slices.Backward(s)` | parcourir une slice (indice et valeur, valeurs, à l'envers) |\n| `slices.Collect(seq)` | rassembler une séquence dans une nouvelle slice |\n| `slices.Sorted(seq)` | rassembler et trier |\n| `slices.Chunk(s, n)` | découper en sous-slices de n éléments |\n| `maps.Keys(m)`, `maps.Values(m)`, `maps.All(m)` | parcourir une map |\n| `maps.Collect(seq2)`, `maps.Insert(m, seq2)` | construire ou compléter une map |\n| `strings.Lines(s)`, `strings.SplitSeq(s, sep)`, `strings.FieldsSeq(s)` (Go 1.24) | découper sans créer de slice |\n\n```go\nm := map[string]int{\"go\": 2009, \"java\": 1995, \"rust\": 2015}\n\nfor _, k := range slices.Sorted(maps.Keys(m)) {\n\tfmt.Println(k, m[k]) // dans l'ordre des clés\n}\n\nfor ligne := range strings.Lines(texte) {\n\t// chaque ligne avec son \"\\n\" final\n}\n```\n\nCe qu'il faut savoir :\n- `maps.Keys` renvoie un **itérateur**, pas une slice : l'ordre reste **aléatoire**, d'où `slices.Sorted` ;\n- `strings.Lines` garde le **`\\n`** de chaque ligne ;\n- les versions `Seq` de `strings` et `bytes` évitent d'allouer une slice de tous les morceaux : utiles sur de gros\n  textes quand on parcourt une seule fois ;\n- ces fonctions se composent : `slices.Collect(maps.Values(m))`, `slices.Sorted(maps.Keys(m))`.\n\n**En entretien** : « slices.All, Values, Backward, Collect, Sorted ; maps.Keys, Values, All ; strings.Lines et\nSplitSeq ; maps.Keys n'est pas trié, on passe par slices.Sorted. »"
cards:
  - key: parcourir-cles-map-ordre
    format: course
    question: Comment parcourir les clés d'une map dans l'ordre ?
    answer: '`slices.Sorted(maps.Keys(m))`.'
  - key: collect
    format: course
    question: Comment obtenir une slice à partir d'un itérateur ?
    answer: Avec `slices.Collect(seq)` (ou `slices.Sorted(seq)` pour l'obtenir triée), qui parcourt la séquence et rassemble ses éléments.
  - key: lines
    format: course
    question: Que fournit strings.Lines et que contient chaque élément ?
    answer: Un itérateur sur les lignes d'une chaîne (Go 1.24) ; chaque ligne garde son « \n » final, sauf éventuellement la dernière.
  - key: backward
    format: course
    question: Comment parcourir une slice à l'envers avec la bibliothèque standard ?
    answer: Avec `for i, v := range slices.Backward(s)`, qui renvoie les indices et les valeurs du dernier au premier.
  - key: vf-keys-ordre
    format: true-false
    question: '`maps.Keys(m)` renvoie les clés triées.'
    truth: false
    answer: L'ordre est aléatoire ; slices.Sorted(maps.Keys(m)) les trie.
  - key: vf-keys-slice
    format: true-false
    question: '`maps.Keys(m)` renvoie un itérateur, pas une slice.'
    truth: true
    answer: Contrairement à l'ancien golang.org/x/exp/maps.Keys.
  - key: vf-splitseq
    format: true-false
    question: '`strings.SplitSeq` évite d''allouer une slice de tous les morceaux.'
    truth: true
    answer: Il les produit un par un.
  - key: vf-chunk
    format: true-false
    question: '`slices.Chunk(s, 3)` copie les éléments dans de nouvelles slices.'
    truth: false
    answer: Les morceaux sont des sous-slices de s, qui partagent son tableau.
  - key: qcm-trier-cles
    format: multiple-choice
    question: Comment parcourir une map dans l'ordre de ses clés ?
    choices:
      - text: '`for _, k := range slices.Sorted(maps.Keys(m))`'
        correct: true
      - text: Collecter les clés puis les trier avec slices.Sort
        correct: true
      - text: '`for k := range m`, l''ordre est déjà trié'
        correct: false
      - text: '`for k := range maps.Keys(m)`, trié par construction'
        correct: false
    answer: L'ordre d'une map est volontairement aléatoire.
  - key: qcm-fonctions
    format: multiple-choice
    question: Lesquelles de ces fonctions existent dans la bibliothèque standard ?
    choices:
      - text: '`slices.Collect`'
        correct: true
      - text: '`maps.Values`'
        correct: true
      - text: '`strings.Lines`'
        correct: true
      - text: '`slices.Map`'
        correct: false
    answer: Il n'y a ni Map ni Filter sur les itérateurs dans la bibliothèque standard.
  - key: qcm-composer
    format: multiple-choice
    question: Que renvoie `slices.Collect(maps.Values(m))` ?
    choices:
      - text: Une nouvelle slice des valeurs de m, dans un ordre quelconque
        correct: true
      - text: Une slice triée des valeurs
        correct: false
      - text: Un itérateur
        correct: false
      - text: Une map copiée
        correct: false
    answer: Collect rassemble, sans trier.
  - key: qcm-insert
    format: multiple-choice
    question: Comment ajouter à une map toutes les paires d'une autre ?
    choices:
      - text: '`maps.Insert(dst, maps.All(src))`'
        correct: true
      - text: '`maps.Copy(dst, src)`'
        correct: true
      - text: '`dst = append(dst, src)`'
        correct: false
      - text: '`maps.Merge(dst, src)`'
        correct: false
    answer: maps.Merge n'existe pas.
  - key: trous-sorted
    format: fill-in
    question: |-
      Complétez pour obtenir les clés triées :
      ```go
      cles := slices.___(maps.Keys(m))
      ```
    blanks:
      - - Sorted
    answer: slices.Sorted rassemble et trie.
  - key: trous-collect
    format: fill-in
    question: |-
      Complétez pour obtenir une slice des valeurs :
      ```go
      valeurs := slices.___(maps.Values(m))
      ```
    blanks:
      - - Collect
    answer: slices.Collect rassemble une séquence.
  - key: trous-lines
    format: fill-in
    question: "Complétez pour parcourir les lignes :\n```go\nfor ligne := range strings.___(texte) {\n\tfmt.Print(ligne)\n}\n```"
    blanks:
      - - Lines
    answer: strings.Lines, depuis Go 1.24.
  - key: trous-backward
    format: fill-in
    question: "Complétez pour parcourir à l'envers :\n```go\nfor i, v := range slices.___(s) {\n\tfmt.Println(i, v)\n}\n```"
    blanks:
      - - Backward
    answer: slices.Backward.
  - key: code-sorted
    format: code-output
    question: "```go\nm := map[string]int{\"rust\": 2015, \"go\": 2009, \"java\": 1995}\nfor _, k := range slices.Sorted(maps.Keys(m)) {\n\tfmt.Print(k, \" \")\n}\nfmt.Println()\n```"
    answer: '`go java rust` : les clés triées.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n)\n\nfunc main() {\n\tm := map[string]int{\"rust\": 2015, \"go\": 2009, \"java\": 1995}\n\tfor _, k := range slices.Sorted(maps.Keys(m)) {\n\t\tfmt.Print(k, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: go java rust
  - key: code-lines
    format: code-output
    question: "```go\nn := 0\nfor ligne := range strings.Lines(\"un\\ndeux\\ntrois\") {\n\tn++\n\tfmt.Printf(\"%q \", ligne)\n}\nfmt.Println(n)\n```"
    answer: '`"un\n" "deux\n" "trois" 3` : chaque ligne garde son retour à la ligne, sauf la dernière qui n''en a pas.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tn := 0\n\tfor ligne := range strings.Lines(\"un\\ndeux\\ntrois\") {\n\t\tn++\n\t\tfmt.Printf(\"%q \", ligne)\n\t}\n\tfmt.Println(n)\n}\n"
      output: '"un\n" "deux\n" "trois" 3'
  - key: code-backward
    format: code-output
    question: "```go\nfor i, v := range slices.Backward([]string{\"a\", \"b\", \"c\"}) {\n\tfmt.Print(i, v, \" \")\n}\nfmt.Println()\n```"
    answer: '`2c 1b 0a`'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tfor i, v := range slices.Backward([]string{\"a\", \"b\", \"c\"}) {\n\t\tfmt.Print(i, v, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 2c 1b 0a
  - key: code-chunk
    format: code-output
    question: "```go\nfor morceau := range slices.Chunk([]int{1, 2, 3, 4, 5}, 2) {\n\tfmt.Print(morceau, \" \")\n}\nfmt.Println()\n```"
    answer: '`[1 2] [3 4] [5]` : le dernier morceau peut être plus court.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tfor morceau := range slices.Chunk([]int{1, 2, 3, 4, 5}, 2) {\n\t\tfmt.Print(morceau, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: '[1 2] [3 4] [5]'
