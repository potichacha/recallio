notion: iterateurs-bibliotheque
lesson: "Depuis Go 1.23, la bibliothèque standard fournit des itérateurs et des fonctions qui les consomment :\n\n| Fonction | Rôle |\n|---|---|\n| `slices.All(s)`, `slices.Values(s)`, `slices.Backward(s)` | parcourir une slice (indice et valeur, valeurs, à l'envers) |\n| `slices.Collect(seq)` | rassembler une séquence dans une nouvelle slice |\n| `slices.Sorted(seq)` | rassembler et trier |\n| `slices.Chunk(s, n)` | découper en sous-slices de n éléments |\n| `maps.Keys(m)`, `maps.Values(m)`, `maps.All(m)` | parcourir une map |\n| `maps.Collect(seq2)`, `maps.Insert(m, seq2)` | construire ou compléter une map |\n| `strings.Lines(s)`, `strings.SplitSeq(s, sep)`, `strings.FieldsSeq(s)` (Go 1.24) | découper sans créer de slice |\n\n```go\nm := map[string]int{\"go\": 2009, \"java\": 1995, \"rust\": 2015}\n\nfor _, k := range slices.Sorted(maps.Keys(m)) {\n\tfmt.Println(k, m[k]) // dans l'ordre des clés\n}\n\nfor ligne := range strings.Lines(texte) {\n\t// chaque ligne avec son \"\\n\" final\n}\n```\n\nCe qu'il faut savoir :\n- `maps.Keys` renvoie un **itérateur**, pas une slice : l'ordre reste **aléatoire**, d'où `slices.Sorted` ;\n- `strings.Lines` garde le **`\\n`** de chaque ligne ;\n- les versions `Seq` de `strings` et `bytes` évitent d'allouer une slice de tous les morceaux : utiles sur de gros\n  textes quand on parcourt une seule fois ;\n- ces fonctions se composent : `slices.Collect(maps.Values(m))`, `slices.Sorted(maps.Keys(m))`.\n\n**En entretien** : « slices.All, Values, Backward, Collect, Sorted ; maps.Keys, Values, All ; strings.Lines et\nSplitSeq ; maps.Keys n'est pas trié, on passe par slices.Sorted. »"
cards:
  - key: parcourir-cles-map-ordre
    format: course
    question: "Comment parcourir les clés d'une map `m` dans l'ordre croissant ?"
    choices:
      - {text: "`for _, k := range slices.Sorted(maps.Keys(m))`", correct: true}
      - {text: "`for k := range m`, Go parcourt les clés triées", correct: false}
      - {text: "`for k := range maps.Keys(m)`, trié par construction", correct: false}
      - {text: "`for _, k := range sort.Keys(m)`, du package `sort`", correct: false}
    answer: "`slices.Sorted(maps.Keys(m))` rassemble les clés et les trie. L'ordre de parcours d'une map, et donc celui de `maps.Keys`, est volontairement aléatoire."
  - key: collect
    format: course
    question: "Comment obtenir une slice à partir d'un itérateur `seq` de type `iter.Seq[T]` ?"
    choices:
      - {text: "`slices.Collect(seq)`", correct: true}
      - {text: "`slices.From(seq)`", correct: false}
      - {text: "`[]T(seq)`, une conversion", correct: false}
      - {text: "`append([]T{}, seq...)`", correct: false}
    answer: "`slices.Collect(seq)` parcourt la séquence et rassemble ses éléments (`slices.Sorted(seq)` les rend triés). Un itérateur est une fonction : ni conversion ni `...` ne s'y appliquent."
  - key: lines
    format: course
    question: "Que fournit `strings.Lines`, et que contient chacun de ses éléments ?"
    choices:
      - {text: "Un itérateur sur les lignes, chacune gardant son retour à la ligne, sauf peut-être la dernière", correct: true}
      - {text: "Une slice des lignes, sans leur retour à la ligne, comme un `strings.Split` sur les sauts", correct: false}
      - {text: "Un itérateur sur les lignes, sans leur retour à la ligne, comme le fait `bufio.Scanner`", correct: false}
      - {text: "Une slice des lignes, chacune gardant son retour à la ligne final, même la dernière", correct: false}
    answer: "Un itérateur (Go 1.24) ; chaque ligne garde son retour à la ligne final, sauf éventuellement la dernière. C'est la différence avec `bufio.Scanner`, qui les retire."
  - key: backward
    format: course
    question: "Comment parcourir une slice `s` à l'envers avec la bibliothèque standard ?"
    choices:
      - {text: "`for i, v := range slices.Backward(s)`", correct: true}
      - {text: "`for i, v := range slices.Reverse(s)`", correct: false}
      - {text: "`for i, v := range s.Reverse()`", correct: false}
      - {text: "`for i, v := range s[::-1]`", correct: false}
    answer: "`slices.Backward(s)` renvoie un `iter.Seq2` des indices et des valeurs, du dernier au premier. `slices.Reverse` inverse la slice en place et ne renvoie rien ; `s[::-1]` est du Python."
  - key: vf-keys-ordre
    format: true-false
    question: '`maps.Keys(m)` renvoie les clés triées.'
    truth: false
    answer: L'ordre est aléatoire ; slices.Sorted(maps.Keys(m)) les trie.
  - key: vf-keys-slice
    format: true-false
    question: '`maps.Keys(m)` renvoie un itérateur, pas une slice.'
    truth: true
    answer: Contrairement à l'ancien golang.org/x/exp/maps.Keys.
  - key: vf-splitseq
    format: true-false
    question: '`strings.SplitSeq` évite d''allouer une slice de tous les morceaux.'
    truth: true
    answer: Il les produit un par un.
  - key: vf-chunk
    format: true-false
    question: '`slices.Chunk(s, 3)` copie les éléments dans de nouvelles slices.'
    truth: false
    answer: Les morceaux sont des sous-slices de s, qui partagent son tableau.
  - key: qcm-trier-cles
    format: multiple-choice
    question: "Pourquoi `for k := range maps.Keys(m)` ne donne-t-il pas les clés triées ?"
    choices:
      - {text: "`maps.Keys` suit l'ordre de la map, volontairement aléatoire", correct: true}
      - {text: "`maps.Keys` les trie, mais `range` les reparcourt dans le désordre", correct: false}
      - {text: "`maps.Keys` renvoie une slice, que `range` parcourt à l'envers", correct: false}
      - {text: "Il les donne bien triées, si les clés sont des chaînes ou des entiers", correct: false}
    answer: "L'ordre d'une map est volontairement aléatoire, et `maps.Keys` le suit. Pour un ordre stable : `slices.Sorted(maps.Keys(m))`, ou collecter les clés puis appeler `slices.Sort`."
  - key: qcm-fonctions
    format: multiple-choice
    question: "Laquelle de ces fonctions n'existe pas dans la bibliothèque standard ?"
    choices:
      - {text: "`slices.Map`", correct: true}
      - {text: "`slices.Collect`", correct: false}
      - {text: "`maps.Values`", correct: false}
      - {text: "`strings.Lines`", correct: false}
    answer: "Il n'y a ni `Map` ni `Filter` sur les itérateurs dans la bibliothèque standard ; `slices.Collect`, `maps.Values` et `strings.Lines` (Go 1.24) existent."
  - key: qcm-composer
    format: multiple-choice
    question: Que renvoie `slices.Collect(maps.Values(m))` ?
    choices:
      - {text: "Une nouvelle slice des valeurs de m, dans un ordre quelconque", correct: true}
      - {text: "Une nouvelle slice des valeurs de m, triée par ordre croissant", correct: false}
      - {text: "Un itérateur sur les valeurs de m, à parcourir avec `range`", correct: false}
      - {text: "Une copie de la map m, avec les mêmes clés et les mêmes valeurs", correct: false}
    answer: "`Collect` rassemble les valeurs dans une nouvelle slice, sans trier : l'ordre suit celui, aléatoire, de la map. Pour les trier, `slices.Sorted`."
  - key: qcm-insert
    format: multiple-choice
    question: "Lesquelles de ces instructions ajoutent à la map `dst` toutes les paires de `src` ?"
    choices:
      - text: '`maps.Insert(dst, maps.All(src))`'
        correct: true
      - text: '`maps.Copy(dst, src)`'
        correct: true
      - text: '`dst = append(dst, src)`'
        correct: false
      - text: '`maps.Merge(dst, src)`'
        correct: false
    answer: "`maps.Copy` copie chaque paire, `maps.Insert` fait de même depuis un itérateur. `maps.Merge` n'existe pas, et `append` ne marche que sur des slices."
  - key: trous-sorted
    format: fill-in
    question: |-
      Complète pour ranger dans `cles` les clés de `m`, triées :
      ```go
      cles := slices.___(maps.Keys(m))
      ```
    blanks:
      - - Sorted
    answer: slices.Sorted rassemble et trie.
  - key: trous-collect
    format: fill-in
    question: |-
      Complète pour obtenir une slice des valeurs :
      ```go
      valeurs := slices.___(maps.Values(m))
      ```
    blanks:
      - - Collect
    answer: slices.Collect rassemble une séquence.
  - key: trous-lines
    format: fill-in
    question: |-
      Complète pour parcourir les lignes :
      ```go
      for ligne := range strings.___(texte) {
      	fmt.Print(ligne)
      }
      ```
    blanks:
      - - Lines
    answer: strings.Lines, depuis Go 1.24.
  - key: trous-backward
    format: fill-in
    question: |-
      Complète pour parcourir à l'envers :
      ```go
      for i, v := range slices.___(s) {
      	fmt.Println(i, v)
      }
      ```
    blanks:
      - - Backward
    answer: slices.Backward.
  - key: code-sorted
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := map[string]int{"rust": 2015, "go": 2009, "java": 1995}
      for _, k := range slices.Sorted(maps.Keys(m)) {
      	fmt.Print(k, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`go java rust`", correct: true}
      - {text: "`java go rust`", correct: false}
      - {text: "`rust go java`", correct: false}
      - {text: "Un ordre différent à chaque exécution", correct: false}
    answer: "`go java rust` : `slices.Sorted` trie les clés par ordre alphabétique, quel que soit l'ordre aléatoire de la map. Trier par valeur aurait donné `java go rust`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n)\n\nfunc main() {\n\tm := map[string]int{\"rust\": 2015, \"go\": 2009, \"java\": 1995}\n\tfor _, k := range slices.Sorted(maps.Keys(m)) {\n\t\tfmt.Print(k, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: go java rust
  - key: code-lines
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      n := 0
      for ligne := range strings.Lines("un\ndeux\ntrois") {
      	n++
      	fmt.Printf("%q ", ligne)
      }
      fmt.Println(n)
      ```
    choices:
      - {text: "`\"un\\n\" \"deux\\n\" \"trois\" 3`", correct: true}
      - {text: "`\"un\" \"deux\" \"trois\" 3`", correct: false}
      - {text: "`\"un\\n\" \"deux\\n\" \"trois\\n\" 3`", correct: false}
      - {text: "`\"un\\ndeux\\ntrois\" 1`", correct: false}
    answer: "Chaque ligne garde son retour à la ligne, sauf la dernière, qui n'en a pas dans la chaîne. `%q` le montre sous la forme `\\n`."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tn := 0\n\tfor ligne := range strings.Lines(\"un\\ndeux\\ntrois\") {\n\t\tn++\n\t\tfmt.Printf(\"%q \", ligne)\n\t}\n\tfmt.Println(n)\n}\n"
      output: '"un\n" "deux\n" "trois" 3'
  - key: code-backward
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for i, v := range slices.Backward([]string{"a", "b", "c"}) {
      	fmt.Print(i, v, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`2c 1b 0a`", correct: true}
      - {text: "`0c 1b 2a`", correct: false}
      - {text: "`2a 1b 0c`", correct: false}
      - {text: "`0a 1b 2c`", correct: false}
    answer: "`slices.Backward` parcourt du dernier au premier en gardant les vrais indices. `fmt.Print` ne met pas d'espace entre un entier et une chaîne."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tfor i, v := range slices.Backward([]string{\"a\", \"b\", \"c\"}) {\n\t\tfmt.Print(i, v, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 2c 1b 0a
  - key: code-chunk
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      for morceau := range slices.Chunk([]int{1, 2, 3, 4, 5}, 2) {
      	fmt.Print(morceau, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`[1 2] [3 4] [5]`", correct: true}
      - {text: "`[1 2] [3 4]`", correct: false}
      - {text: "`[1 2] [3 4] [5 0]`", correct: false}
      - {text: "`[[1 2] [3 4] [5]]`", correct: false}
    answer: "`slices.Chunk` découpe en morceaux de 2, et le dernier peut être plus court : il n'est ni complété par des zéros ni abandonné."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tfor morceau := range slices.Chunk([]int{1, 2, 3, 4, 5}, 2) {\n\t\tfmt.Print(morceau, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: '[1 2] [3 4] [5]'
