notion: panic
cards:
  - key: quand-utiliser-panic
    format: course
    question: Quand utiliser panic ?
    answer: Pour des bugs et invariants violés, ou des initialisations Must au démarrage ; jamais pour des erreurs attendues.
  - key: declenche-panic-niveau-runtime
    format: course
    question: Que déclenche un panic au niveau du runtime ?
    answer: Index hors limites, nil pointer, division entière par zéro, écriture dans une map nil, assertion échouée, fermeture double d'un channel.
