notion: panic
lesson: |-
  **`panic`** arrête le déroulement normal de la goroutine : les fonctions remontent l'une après l'autre en exécutant
  leurs **`defer`**, et si rien ne récupère la panique (`recover`), le **programme entier s'arrête** avec le message et
  la pile d'appels de chaque goroutine, et le code de sortie 2.

  ```go
  panic("état impossible : solde négatif")
  panic(fmt.Sprintf("format inconnu %q", f))
  ```

  Le runtime panique aussi sur les **erreurs de programmation** : indice hors limites, déréférence d'un pointeur nil,
  écriture dans une map nil, division entière par zéro, assertion de type ratée, envoi sur un channel fermé.

  Quand utiliser `panic` soi-même :
  - un **bug** : un invariant violé, un cas « impossible » d'un switch ;
  - une **initialisation** qui ne peut pas échouer en fonctionnement normal (`regexp.MustCompile` sur un motif
    constant, un template embarqué) ;
  - jamais pour une **erreur attendue** (fichier absent, entrée invalide, réseau en panne) : ce sont des erreurs.

  Une panique dans une **goroutine** sans `recover` arrête tout le programme, même si la goroutine principale va bien.

  **Piège classique** : utiliser `panic` comme une exception pour remonter une erreur de validation, avec un `recover`
  plus haut. Le flux devient invisible, et la moindre goroutine oubliée fait tomber le service.

  **En entretien** : « panic pour les bugs et l'irrécupérable ; elle déroule la pile en exécutant les defer, et arrête le
  programme si personne ne la récupère ; les erreurs attendues sont des valeurs error. »
tour:
  - title: panic
    text: |-
      `panic` arrête l'exécution normale : les fonctions remontent une à une en exécutant leurs `defer`, puis le
      programme s'arrête avec un message et la pile d'appels. Le runtime panique de lui-même sur une erreur de
      programmation : indice hors limites, pointeur `nil`, écriture dans une map `nil`.

      On réserve `panic` aux situations **impossibles**, qui révèlent un bug. Une erreur attendue (un fichier absent,
      une saisie invalide) est une `error`. `recover`, appelé dans un `defer`, arrête la remontée : on ne s'en sert
      qu'aux frontières, comme un serveur qui ne veut pas tomber pour une seule requête.

      Essaie : supprime le `defer` de `main`, puis exécute.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func element(xs []int, i int) int {
          	return xs[i]
          }

          func main() {
          	defer func() {
          		if r := recover(); r != nil {
          			fmt.Println("récupéré :", r)
          		}
          	}()
          	fmt.Println(element([]int{1, 2, 3}, 1))
          	fmt.Println(element([]int{1, 2, 3}, 5))
          	fmt.Println("jamais affiché")
          }
      output: |-
        2
        récupéré : runtime error: index out of range [5] with length 3
cards:
  - key: quand-utiliser-panic
    format: course
    question: "Quand utiliser `panic` ?"
    choices:
      - {text: "Pour un bug ou un invariant violé, ou un `Must` à l'initialisation", correct: true}
      - {text: "Pour toute erreur grave, comme une base de données injoignable", correct: false}
      - {text: "Pour sortir de plusieurs boucles imbriquées d'un seul coup", correct: false}
      - {text: "Pour une saisie invalide, afin d'arrêter la requête au plus tôt", correct: false}
    answer: Pour des bugs et invariants violés, ou des initialisations Must au démarrage ; jamais pour des erreurs attendues.
  - key: declenche-panic-niveau-runtime
    format: course
    question: "Quelle liste ne contient que des opérations qui font paniquer le runtime ?"
    choices:
      - {text: "Indice hors limites, pointeur nil déréférencé, écriture dans une map nil", correct: true}
      - {text: "Indice hors limites, lecture dans une map nil, `append` sur une slice nil", correct: false}
      - {text: "Division flottante par zéro, pointeur nil déréférencé, réception d'un channel fermé", correct: false}
      - {text: "Écriture dans une map nil, débordement d'un `int`, division flottante par zéro", correct: false}
    answer: "Indice hors limites, nil déréférencé, écriture dans une map nil, division entière par zéro, assertion ratée, double fermeture d'un channel : le runtime panique. Lire une map nil, `append` sur une slice nil, diviser un flottant par zéro (`+Inf`) ou déborder un `int` (il repart de l'autre bout) ne paniquent pas."
  - key: deroulement
    format: course
    question: Que se passe-t-il quand une fonction panique ?
    choices:
      - {text: "Ses `defer` s'exécutent, puis ceux des appelants, jusqu'à un `recover` ou l'arrêt du programme", correct: true}
      - {text: "Le programme s'arrête aussitôt, sans exécuter aucun des `defer` en attente", correct: false}
      - {text: "Seule la goroutine fautive s'arrête, et le reste du programme continue", correct: false}
      - {text: "La panique remonte jusqu'à `main`, qui la reçoit comme une erreur ordinaire", correct: false}
    answer: Elle s'arrête, ses `defer` s'exécutent, puis l'appelant fait de même, et ainsi de suite ; si aucun `recover` n'arrête la panique, le programme s'arrête avec le message et les piles d'appels.
  - key: runtime
    format: course
    question: "Laquelle de ces opérations fait paniquer le runtime ?"
    choices:
      - {text: "Envoyer une valeur sur un channel fermé", correct: true}
      - {text: "Recevoir une valeur d'un channel fermé", correct: false}
      - {text: "Lire une clé absente dans une map nil", correct: false}
      - {text: "Ajouter avec `append` à une slice nil", correct: false}
    answer: "Envoyer sur un channel fermé panique, comme un indice hors limites, un nil déréférencé ou une écriture dans une map nil. Recevoir d'un channel fermé renvoie la valeur zéro, lire une map nil aussi, et `append` alloue."
  - key: vf-defer
    format: true-false
    question: Les fonctions différées s'exécutent pendant qu'une panique remonte la pile.
    truth: true
    answer: C'est ce qui permet de libérer les ressources et de récupérer la panique.
  - key: vf-code
    format: true-false
    question: Un programme arrêté par une panique non récupérée se termine avec le code de sortie 2.
    truth: true
    answer: Après avoir affiché le message et les piles d'appels.
  - key: vf-attendue
    format: true-false
    question: Un fichier de configuration absent justifie une panique dans une bibliothèque.
    truth: false
    answer: 'C''est une erreur attendue : la bibliothèque la renvoie, l''appelant décide.'
  - key: vf-goroutine
    format: true-false
    question: Une panique non récupérée dans une goroutine secondaire n'arrête que cette goroutine.
    truth: false
    answer: Elle arrête tout le programme.
  - key: qcm-legitimes
    format: multiple-choice
    question: "Lequel de ces usages de `panic` est légitime ?"
    choices:
      - {text: "Un cas « impossible » dans un switch exhaustif, signe d'un bug", correct: true}
      - {text: "Un utilisateur qui saisit une date invalide dans un formulaire", correct: false}
      - {text: "Une API distante qui répond 503 pendant une maintenance", correct: false}
      - {text: "Un fichier de configuration absent au démarrage du service", correct: false}
    answer: "Un cas impossible est un bug : le signaler bruyamment est légitime, comme `regexp.MustCompile` sur une expression constante. Les trois autres sont des cas attendus, à traiter comme des erreurs."
  - key: qcm-runtime
    format: multiple-choice
    question: "Laquelle de ces instructions provoque une panique ?"
    choices:
      - {text: "`var m map[string]int; m[\"a\"] = 1`", correct: true}
      - {text: "`var s []int; s = append(s, 1)`", correct: false}
      - {text: "`var m map[string]int; _ = m[\"a\"]`", correct: false}
      - {text: "`var s []int; _ = len(s)`", correct: false}
    answer: "Écrire dans une map nil panique, comme lire `s[0]` sur une slice nil. Lire une map nil, `append` et `len` sur une slice nil sont permis."
  - key: qcm-valeur
    format: multiple-choice
    question: "Que peut-on passer à `panic` ?"
    choices:
      - {text: "N'importe quelle valeur : le paramètre est de type `any`", correct: true}
      - {text: "Seulement une chaîne, le message affiché à l'arrêt", correct: false}
      - {text: "Seulement une valeur de type `error`", correct: false}
      - {text: "Seulement un code de sortie entier", correct: false}
    answer: "Le paramètre est un `any` : une chaîne, une erreur ou n'importe quelle valeur. `recover` renverra la même valeur."
  - key: qcm-must
    format: multiple-choice
    question: Que fait `template.Must(template.New("x").Parse(src))` si `src` est invalide ?
    choices:
      - text: Il panique
        correct: true
      - text: Il renvoie un template vide
        correct: false
      - text: Il renvoie une erreur
        correct: false
      - text: Il ignore l'erreur
        correct: false
    answer: Les fonctions `Must` transforment une erreur en panique, pour l'initialisation.
  - key: code-defer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func etape(n int) {
      	defer fmt.Println("fin de l'étape", n)
      	if n == 2 {
      		panic("boum")
      	}
      	etape(n + 1)
      }

      etape(1)
      ```
    choices:
      - {text: "`fin de l'étape 2`, puis `fin de l'étape 1`, puis une panic : `boum`", correct: true}
      - {text: "`fin de l'étape 1`, puis `fin de l'étape 2`, puis une panic : `boum`", correct: false}
      - {text: "Une panic : `boum`, sans rien afficher avant, les `defer` étant annulés", correct: false}
      - {text: "`fin de l'étape 2`, puis une panic : `boum`, sans le `defer` de l'étape 1", correct: false}
    answer: "Les `defer` s'exécutent pendant la remontée de la panique, du plus profond au plus haut : l'étape 2, puis l'étape 1. Puis le programme s'arrête sur `panic: boum`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc etape(n int) {\n\tdefer fmt.Println(\"fin de l'étape\", n)\n\tif n == 2 {\n\t\tpanic(\"boum\")\n\t}\n\tetape(n + 1)\n}\n\nfunc main() {\n\tetape(1)\n}\n"
      output: |-
        fin de l'étape 2
        fin de l'étape 1
      panics: 'panic: boum'
  - key: code-indice
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      notes := []int{12, 15}
      i := 2
      fmt.Println("avant")
      fmt.Println(notes[i])
      ```
    choices:
      - {text: "`avant`, puis une panic : index out of range [2] with length 2", correct: true}
      - {text: "`avant`, puis `15`, le dernier élément de la slice", correct: false}
      - {text: "`avant`, puis `0`, la valeur zéro d'un `int`", correct: false}
      - {text: "Ça ne compile pas : l'indice dépasse la longueur", correct: false}
    answer: '`avant`, puis `panic: runtime error: index out of range [2] with length 2`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnotes := []int{12, 15}\n\ti := 2\n\tfmt.Println(\"avant\")\n\tfmt.Println(notes[i])\n}\n"
      output: avant
      panics: index out of range [2] with length 2
  - key: code-assertion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var v any = "texte"
      n := v.(int)
      fmt.Println(n)
      ```
    choices:
      - {text: "Une panic : interface conversion, `string` au lieu de `int`", correct: true}
      - {text: "`0`, la valeur zéro d'un `int`", correct: false}
      - {text: "`texte`, la valeur rangée dans `v`", correct: false}
      - {text: "Ça ne compile pas : `v` contient une chaîne", correct: false}
    answer: "Une assertion à un seul résultat panique quand le type ne correspond pas : « interface conversion: interface {} is string, not int ». La forme `n, ok := v.(int)` renverrait `0, false` sans paniquer."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any = \"texte\"\n\tn := v.(int)\n\tfmt.Println(n)\n}\n"
      panics: interface conversion
  - key: code-erreur-valeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      defer func() {
      	r := recover()
      	err, estErreur := r.(error)
      	fmt.Println(estErreur, err)
      }()
      panic(fs.ErrNotExist)
      ```
    choices:
      - {text: "`true file does not exist`", correct: true}
      - {text: "`false file does not exist`", correct: false}
      - {text: "`false <nil>`", correct: false}
      - {text: "`true <nil>`", correct: false}
    answer: '`true file does not exist` : la valeur passée à `panic` peut être une erreur, retrouvée par `recover`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io/fs\"\n)\n\nfunc main() {\n\tdefer func() {\n\t\tr := recover()\n\t\terr, estErreur := r.(error)\n\t\tfmt.Println(estErreur, err)\n\t}()\n\tpanic(fs.ErrNotExist)\n}\n"
      output: true file does not exist
  - key: bug-validation
    format: bug-fix
    question: |-
      Une saisie invalide fait tomber tout le service. Quelle correction est la bonne ?
      ```go
      func analyserAge(s string) int {
      	n, err := strconv.Atoi(s)
      	if err != nil {
      		panic(err)
      	}
      	return n
      }
      ```
    choices:
      - {text: "Renvoyer `(int, error)`, avec l'erreur de `Atoi` enveloppée de contexte", correct: true}
      - {text: "Garder le `panic`, et ajouter un `recover` dans `analyserAge`", correct: false}
      - {text: "Renvoyer `0` en cas d'échec, l'âge zéro signalant une saisie invalide", correct: false}
      - {text: "Remplacer `panic(err)` par `log.Fatal(err)`, plus propre", correct: false}
    answer: "```go\nfunc analyserAge(s string) (int, error) {\n\tn, err := strconv.Atoi(s)\n\tif err != nil {\n\t\treturn 0, fmt.Errorf(\"âge %q invalide : %w\", s, err)\n\t}\n\treturn n, nil\n}\n```\nUne entrée invalide est attendue : on renvoie une erreur."
  - key: bug-switch
    format: bug-fix
    question: |-
      Un nouveau statut ajouté à l'énumération est silencieusement traité comme « brouillon ». Quelle correction est la bonne ?
      ```go
      switch s {
      case Publie:
      	return "publié"
      default:
      	return "brouillon"
      }
      ```
    choices:
      - {text: "Un `case` par statut connu, et un `default` qui panique sur un statut inconnu", correct: true}
      - {text: "Un `default` qui renvoie « inconnu », affiché tel quel à l'utilisateur", correct: false}
      - {text: "Supprimer le `default`, pour que le compilateur exige tous les cas", correct: false}
      - {text: "Remplacer le `switch` par une suite de `if`, plus facile à compléter", correct: false}
    answer: "```go\nswitch s {\ncase Brouillon:\n\treturn \"brouillon\"\ncase Publie:\n\treturn \"publié\"\ndefault:\n\tpanic(fmt.Sprintf(\"statut inconnu : %d\", s))\n}\n```\nUn cas impossible est un bug : le signaler bruyamment vaut mieux qu'un mauvais résultat silencieux (le linter\n`exhaustive` aide aussi)."
  - key: bug-goroutine
    format: bug-fix
    question: |-
      Une tâche d'arrière-plan qui panique arrête tout le serveur. Quelle correction est la bonne ?
      ```go
      go func() {
      	envoyerStatistiques()
      }()
      ```
    choices:
      - {text: "Un `defer` avec `recover` dans la goroutine, qui journalise la valeur et la pile", correct: true}
      - {text: "Un `defer` avec `recover` dans `main`, qui rattrape les paniques de toutes les goroutines", correct: false}
      - {text: "Un appel à `recover()` juste après `envoyerStatistiques()`, dans la goroutine", correct: false}
      - {text: "Un `sync.WaitGroup` qui attend la goroutine, pour que la panique reste dans le handler", correct: false}
    answer: "```go\ngo func() {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tslog.Error(\"panique dans envoyerStatistiques\", \"valeur\", r, \"pile\", string(debug.Stack()))\n\t\t}\n\t}()\n\tenvoyerStatistiques()\n}()\n```\nUne panique non récupérée dans une goroutine arrête le programme ; la goroutine récupère, journalise, et l'on\ncorrige la cause."
  - key: bug-must
    format: bug-fix
    question: |-
      Le service panique dès qu'un utilisateur saisit un motif de recherche mal formé. Quelle correction est la bonne ?
      ```go
      re := regexp.MustCompile(r.URL.Query().Get("motif"))
      ```
    choices:
      - {text: "`regexp.Compile`, et répondre 400 « motif invalide » si son erreur n'est pas nil", correct: true}
      - {text: "`regexp.MustCompile` dans un `recover`, qui répond 500 au client", correct: false}
      - {text: "`regexp.MustCompilePOSIX`, qui accepte tous les motifs saisis", correct: false}
      - {text: "`regexp.MustCompile` appelé dans une goroutine, à part du handler", correct: false}
    answer: "```go\nre, err := regexp.Compile(r.URL.Query().Get(\"motif\"))\nif err != nil {\n\thttp.Error(w, \"motif invalide\", http.StatusBadRequest)\n\treturn\n}\n```\n`MustCompile` est réservé aux motifs constants du programme ; une entrée utilisateur passe par `Compile` et son\nerreur."
