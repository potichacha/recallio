notion: error-interface
lesson: "En Go, une erreur est une **valeur** ordinaire, de type `error`, une interface d'une seule méthode :\n\n```go\ntype error interface {\n\tError() string\n}\n```\n\nPar convention, une fonction qui peut échouer renvoie l'erreur en **dernier** résultat, et `nil` quand tout va bien :\n\n```go\nfunc diviser(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division par zéro\")\n\t}\n\treturn a / b, nil\n}\n\nq, err := diviser(10, 0)\nif err != nil {\n\treturn fmt.Errorf(\"calcul du quotient : %w\", err)\n}\n```\n\n- `errors.New(\"message\")` crée une erreur simple ; `fmt.Errorf(\"format %v\", x)` une erreur formatée (et `%w` enveloppe\n  une autre erreur).\n- Quand l'erreur est non nil, les autres valeurs renvoyées sont en général des **valeurs zéro**, à ne pas utiliser.\n- Le message d'erreur commence par une **minuscule** et ne finit pas par un point : il sera souvent inclus dans un autre\n  (`lecture du fichier : permission refusée`).\n- Pas d'exceptions : le chemin d'erreur est **explicite**, visible dans la signature et dans le code appelant.\n\n**Piège classique** : utiliser la valeur renvoyée avant d'avoir testé l'erreur. Si `err != nil`, la valeur est\nsouvent zéro ou partielle.\n\n**En entretien** : « error est une interface Error() string ; on la renvoie en dernier, nil en cas de succès ; on teste\nif err != nil juste après l'appel ; errors.New et fmt.Errorf pour en créer. »"
cards:
  - key: gere-erreurs
    format: course
    question: Comment Go gère-t-il les erreurs ?
    answer: Par des valeurs de type error retournées en dernier résultat, vérifiées explicitement.
  - key: contient-interface-error
    format: course
    question: Que contient l'interface error ?
    answer: Une seule méthode, Error() string.
  - key: exceptions
    format: course
    question: Pourquoi pas d'exceptions en Go ?
    answer: Pour rendre chaque chemin d'échec visible et explicite, sans saut caché dans la pile.
  - key: convention
    format: course
    question: Quelle est la convention de retour d'une fonction qui peut échouer ?
    answer: Renvoyer l'erreur en dernier résultat, `nil` en cas de succès, et des valeurs zéro pour les autres résultats en cas d'échec.
  - key: vf-interface
    format: true-false
    question: '`error` est une interface qui ne demande qu''une méthode `Error() string`.'
    truth: true
    answer: Tout type qui a cette méthode est une erreur.
  - key: vf-majuscule
    format: true-false
    question: Un message d'erreur Go commence par une majuscule et finit par un point.
    truth: false
    answer: Minuscule et sans ponctuation finale, car il est souvent intégré à un autre message.
  - key: vf-valeur
    format: true-false
    question: Quand une fonction renvoie une erreur non nil, on peut utiliser sans risque les autres valeurs renvoyées.
    truth: false
    answer: Elles sont en général des valeurs zéro ou incomplètes, sauf mention contraire dans la documentation (comme `io.Reader.Read`).
  - key: vf-exceptions
    format: true-false
    question: Go dispose de try et catch pour traiter les erreurs.
    truth: false
    answer: Les erreurs sont des valeurs renvoyées et testées.
  - key: qcm-creer
    format: multiple-choice
    question: Comment créer une erreur ?
    choices:
      - text: '`errors.New("fichier vide")`'
        correct: true
      - text: '`fmt.Errorf("ligne %d invalide", n)`'
        correct: true
      - text: '`throw new Error("...")`'
        correct: false
      - text: '`error("...")`'
        correct: false
    answer: Deux fonctions standard, ou un type qui implémente `Error()`.
  - key: qcm-signature
    format: multiple-choice
    question: Quelle signature suit la convention ?
    choices:
      - text: '`func Lire(chemin string) ([]byte, error)`'
        correct: true
      - text: '`func Lire(chemin string) (error, []byte)`'
        correct: false
      - text: '`func Lire(chemin string) []byte` qui panique en cas d''échec'
        correct: false
      - text: '`func Lire(chemin string, err *error) []byte`'
        correct: false
    answer: L'erreur en dernier.
  - key: qcm-message
    format: multiple-choice
    question: Quel message d'erreur suit les conventions ?
    choices:
      - text: '`connexion à la base : délai dépassé`'
        correct: true
      - text: '`Erreur : la connexion a échoué.`'
        correct: false
      - text: '`ERREUR CONNEXION !!!`'
        correct: false
      - text: '`Error occurred`'
        correct: false
    answer: Une minuscule, du contexte, pas de ponctuation finale.
  - key: qcm-succes
    format: multiple-choice
    question: Que renvoie une fonction `(int, error)` en cas de succès ?
    choices:
      - text: Le résultat et `nil`
        correct: true
      - text: Le résultat et `errors.New("")`
        correct: false
      - text: '`0, nil` toujours'
        correct: false
      - text: Le résultat seul
        correct: false
    answer: Une erreur nil signifie « pas d'erreur ».
  - key: trous-signature
    format: fill-in
    question: |-
      Complétez la signature :
      ```go
      func Analyser(s string) (Config, ___) { ... }
      ```
    blanks:
      - - error
    answer: L'erreur vient en dernier.
  - key: trous-new
    format: fill-in
    question: |-
      Complétez la création de l'erreur :
      ```go
      return 0, ___.New("liste vide")
      ```
    blanks:
      - - errors
    answer: '`errors.New` crée une erreur à partir d''un message.'
  - key: trous-test
    format: fill-in
    question: "Complétez le test d'erreur :\n```go\ncfg, err := Analyser(texte)\nif err ___ nil {\n\treturn err\n}\n```"
    blanks:
      - - '!='
    answer: On teste l'erreur juste après l'appel.
  - key: trous-methode
    format: fill-in
    question: |-
      Complétez pour que le type soit une erreur :
      ```go
      func (e *ErrQuota) ___() string { return "quota dépassé" }
      ```
    blanks:
      - - Error
    answer: Implémenter `Error() string` suffit.
  - key: code-diviser
    format: code-output
    question: "```go\nfunc diviser(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division par zéro\")\n\t}\n\treturn a / b, nil\n}\n\nfor _, b := range []int{2, 0} {\n\tq, err := diviser(10, b)\n\tfmt.Println(q, err)\n}\n```"
    answer: '`5 <nil>` puis `0 division par zéro`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc diviser(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division par zéro\")\n\t}\n\treturn a / b, nil\n}\n\nfunc main() {\n\tfor _, b := range []int{2, 0} {\n\t\tq, err := diviser(10, b)\n\t\tfmt.Println(q, err)\n\t}\n}\n"
      output: |-
        5 <nil>
        0 division par zéro
  - key: code-errorf
    format: code-output
    question: |-
      ```go
      err := fmt.Errorf("ligne %d : champ %q manquant", 12, "email")
      fmt.Println(err)
      fmt.Println(err.Error() == err.(interface{ Error() string }).Error())
      ```
    answer: '`ligne 12 : champ "email" manquant` puis `true`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\terr := fmt.Errorf(\"ligne %d : champ %q manquant\", 12, \"email\")\n\tfmt.Println(err)\n\tfmt.Println(err.Error() == err.(interface{ Error() string }).Error())\n}\n"
      output: |-
        ligne 12 : champ "email" manquant
        true
  - key: code-type
    format: code-output
    question: |-
      ```go
      type ErrQuota struct{ Limite int }

      func (e ErrQuota) Error() string { return fmt.Sprintf("quota de %d atteint", e.Limite) }

      var err error = ErrQuota{100}
      fmt.Println(err)
      ```
    answer: '`quota de 100 atteint` : tout type qui a `Error() string` est une erreur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype ErrQuota struct{ Limite int }\n\n\nfunc (e ErrQuota) Error() string { return fmt.Sprintf(\"quota de %d atteint\", e.Limite) }\n\nfunc main() {\n\tvar err error = ErrQuota{100}\n\tfmt.Println(err)\n}\n"
      output: quota de 100 atteint
  - key: code-nil
    format: code-output
    question: |-
      ```go
      var err error
      fmt.Println(err == nil, err)
      ```
    answer: '`true <nil>` : la valeur zéro d''une erreur est nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar err error\n\tfmt.Println(err == nil, err)\n}\n"
      output: true <nil>
  - key: bug-valeur-avant
    format: bug-fix
    question: "Le service affiche parfois un utilisateur vide :\n```go\nu, err := depot.Trouver(id)\nfmt.Println(\"bonjour\", u.Nom)\nif err != nil {\n\treturn err\n}\n```"
    answer: "```go\nu, err := depot.Trouver(id)\nif err != nil {\n\treturn err\n}\nfmt.Println(\"bonjour\", u.Nom)\n```\nOn teste l'erreur avant d'utiliser le résultat, qui est une valeur zéro en cas d'échec."
  - key: bug-message
    format: bug-fix
    question: |-
      Les logs affichent « lecture : Fichier introuvable. » :
      ```go
      return errors.New("Fichier introuvable.")
      ```
    answer: |-
      ```go
      return errors.New("fichier introuvable")
      ```
      Le message est intégré à d'autres ; une minuscule et pas de point gardent l'ensemble lisible.
  - key: bug-panique
    format: bug-fix
    question: "Une fonction de bibliothèque arrête tout le programme sur une entrée invalide :\n```go\nfunc Analyser(s string) Config {\n\tif s == \"\" {\n\t\tpanic(\"configuration vide\")\n\t}\n\t...\n}\n```"
    answer: "```go\nfunc Analyser(s string) (Config, error) {\n\tif s == \"\" {\n\t\treturn Config{}, errors.New(\"configuration vide\")\n\t}\n\t...\n}\n```\nUne entrée invalide est une erreur attendue : on la renvoie pour que l'appelant décide."
  - key: bug-ordre
    format: bug-fix
    question: |-
      En revue, corrigez cette signature :
      ```go
      func Charger(chemin string) (error, *Config)
      ```
    answer: |-
      ```go
      func Charger(chemin string) (*Config, error)
      ```
      L'erreur vient toujours en dernier ; les linters (et les lecteurs) l'attendent là.
