notion: error-interface
cards:
  - key: gere-erreurs
    format: course
    question: Comment Go gère-t-il les erreurs ?
    answer: Par des valeurs de type error retournées en dernier résultat, vérifiées explicitement.
  - key: contient-interface-error
    format: course
    question: Que contient l'interface error ?
    answer: Une seule méthode, Error() string.
  - key: exceptions
    format: course
    question: Pourquoi pas d'exceptions en Go ?
    answer: Pour rendre chaque chemin d'échec visible et explicite, sans saut caché dans la pile.
