notion: errors-join
lesson: "**`errors.Join`** (Go 1.20) combine plusieurs erreurs en une seule :\n\n```go\nvar errs []error\nfor _, champ := range champs {\n\tif err := valider(champ); err != nil {\n\t\terrs = append(errs, err)\n\t}\n}\nreturn errors.Join(errs...) // nil si toutes les erreurs sont nil\n```\n\n- Le résultat a une méthode `Unwrap() []error` : **`errors.Is` et `errors.As`** retrouvent chacune des erreurs\n  jointes.\n- Les arguments **nil sont ignorés** ; si tous sont nil (ou s'il n'y en a aucun), `Join` renvoie **nil**.\n- Le message réunit les messages des erreurs, **séparés par des retours à la ligne**.\n- `fmt.Errorf` avec **plusieurs `%w`** produit aussi une erreur multiple, avec un message formaté librement.\n\nUsages : valider tous les champs d'un formulaire avant de répondre, fermer plusieurs ressources et garder toutes les\nerreurs de fermeture, rassembler les échecs de tâches parallèles (même si `errgroup` ne garde que la première).\n\n**Piège classique** : appeler `errors.Unwrap` sur une erreur jointe. Il renvoie **nil** : `Unwrap` ne connaît que\n`Unwrap() error`, pas `Unwrap() []error`.\n\n**En entretien** : « errors.Join réunit plusieurs erreurs, ignore les nil et renvoie nil si rien n'a échoué ; Is et As\nvoient chacune ; message sur plusieurs lignes ; plusieurs %w font pareil. »"
cards:
  - key: utiliser-plusieurs-w
    format: course
    question: Peut-on utiliser plusieurs %w ?
    answer: Oui depuis Go 1.20.
  - key: sert-errors-join
    format: course
    question: À quoi sert errors.Join ?
    answer: Combiner plusieurs erreurs en une ; Is et As cherchent dans toutes.
  - key: nil
    format: course
    question: Que renvoie `errors.Join(nil, nil)` ?
    answer: 'nil : les arguments nil sont ignorés, et sans erreur restante le résultat est nil.'
  - key: message
    format: course
    question: Comment est construit le message d'une erreur jointe ?
    answer: Les messages des erreurs jointes, séparés par des retours à la ligne.
  - key: usages
    format: course
    question: Dans quels cas utiliser `errors.Join` ?
    answer: Pour rapporter toutes les erreurs de validation d'un formulaire, toutes les erreurs de fermeture de plusieurs ressources, ou les échecs de plusieurs tâches.
  - key: unwrap
    format: course
    question: Pourquoi `errors.Unwrap` renvoie-t-il nil sur une erreur jointe ?
    answer: Parce qu'une erreur jointe expose `Unwrap() []error`, que `errors.Unwrap` ne connaît pas ; `errors.Is` et `errors.As` savent parcourir les deux formes.
  - key: vf-is
    format: true-false
    question: '`errors.Is(errors.Join(a, b), b)` vaut true.'
    truth: true
    answer: Is parcourt chacune des erreurs jointes.
  - key: vf-ignore-nil
    format: true-false
    question: '`errors.Join(err1, nil, err2)` contient trois erreurs.'
    truth: false
    answer: 'Les nil sont ignorés : deux erreurs.'
  - key: vf-version
    format: true-false
    question: '`errors.Join` existe depuis Go 1.20.'
    truth: true
    answer: Avec les `%w` multiples de `fmt.Errorf`.
  - key: vf-errgroup
    format: true-false
    question: '`errgroup.Group.Wait` renvoie toutes les erreurs des goroutines jointes.'
    truth: false
    answer: Il renvoie la première erreur ; pour toutes, on les collecte et on les joint.
  - key: qcm-resultat
    format: multiple-choice
    question: Que renvoie `errors.Join()` sans argument ?
    choices:
      - text: nil
        correct: true
      - text: Une erreur vide
        correct: false
      - text: Une panique
        correct: false
      - text: '`io.EOF`'
        correct: false
    answer: 'Aucune erreur, donc nil : on peut renvoyer le résultat sans test préalable.'
  - key: qcm-validation
    format: multiple-choice
    question: Comment rapporter toutes les erreurs de validation d'une requête ?
    choices:
      - text: Les collecter dans un slice puis `return errors.Join(errs...)`
        correct: true
      - text: Renvoyer à la première erreur
        correct: false
      - text: Paniquer avec la liste
        correct: false
      - text: Concaténer leurs messages dans une chaîne et la journaliser
        correct: false
    answer: Le résultat reste testable par `errors.Is` et `errors.As`.
  - key: qcm-fermer
    format: multiple-choice
    question: Comment garder les erreurs de fermeture de deux ressources ?
    choices:
      - text: '`return errors.Join(fichier.Close(), conn.Close())`'
        correct: true
      - text: '`fichier.Close(); return conn.Close()`'
        correct: false
      - text: '`return fichier.Close() || conn.Close()`'
        correct: false
      - text: '`defer fichier.Close(); defer conn.Close(); return nil`'
        correct: false
    answer: Join renvoie nil si les deux fermetures réussissent.
  - key: qcm-plusieurs-w
    format: multiple-choice
    question: 'Que produit `fmt.Errorf("a : %w ; b : %w", e1, e2)` ?'
    choices:
      - text: Une erreur que `errors.Is` reconnaît comme e1 et comme e2
        correct: true
      - text: Une erreur au message formaté librement
        correct: true
      - text: Une erreur qui ne garde que e1
        correct: false
      - text: Une erreur de compilation
        correct: false
    answer: Depuis Go 1.20, plusieurs `%w` sont permis.
  - key: code-join
    format: code-output
    question: |-
      ```go
      e1 := errors.New("email manquant")
      e2 := errors.New("âge négatif")
      err := errors.Join(e1, nil, e2)
      fmt.Println(err)
      fmt.Println(errors.Is(err, e2), errors.Join(nil, nil) == nil)
      ```
    answer: '`email manquant` et `âge négatif` sur deux lignes, puis `true true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\te1 := errors.New(\"email manquant\")\n\te2 := errors.New(\"âge négatif\")\n\terr := errors.Join(e1, nil, e2)\n\tfmt.Println(err)\n\tfmt.Println(errors.Is(err, e2), errors.Join(nil, nil) == nil)\n}\n"
      output: |-
        email manquant
        âge négatif
        true true
  - key: code-unwrap
    format: code-output
    question: |-
      ```go
      err := errors.Join(io.EOF, fs.ErrNotExist)
      fmt.Println(errors.Unwrap(err) == nil, errors.Is(err, fs.ErrNotExist))
      ```
    answer: '`true true` : `errors.Unwrap` ne sait pas défaire une erreur jointe, mais `errors.Is` la parcourt.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io\"\n\t\"io/fs\"\n)\n\nfunc main() {\n\terr := errors.Join(io.EOF, fs.ErrNotExist)\n\tfmt.Println(errors.Unwrap(err) == nil, errors.Is(err, fs.ErrNotExist))\n}\n"
      output: true true
  - key: code-validation
    format: code-output
    question: "```go\nvalider := func(nom string, age int) error {\n\tvar errs []error\n\tif nom == \"\" {\n\t\terrs = append(errs, errors.New(\"nom vide\"))\n\t}\n\tif age < 0 {\n\t\terrs = append(errs, errors.New(\"âge négatif\"))\n\t}\n\treturn errors.Join(errs...)\n}\n\nfmt.Println(valider(\"Ada\", 36) == nil)\nfmt.Println(valider(\"\", -1))\n```"
    answer: '`true`, puis `nom vide` et `âge négatif` sur deux lignes.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvalider := func(nom string, age int) error {\n\t\tvar errs []error\n\t\tif nom == \"\" {\n\t\t\terrs = append(errs, errors.New(\"nom vide\"))\n\t\t}\n\t\tif age < 0 {\n\t\t\terrs = append(errs, errors.New(\"âge négatif\"))\n\t\t}\n\t\treturn errors.Join(errs...)\n\t}\n\n\tfmt.Println(valider(\"Ada\", 36) == nil)\n\tfmt.Println(valider(\"\", -1))\n}\n"
      output: |-
        true
        nom vide
        âge négatif
  - key: code-deux-w
    format: code-output
    question: |-
      ```go
      err := fmt.Errorf("lecture (%w) puis écriture (%w)", io.EOF, fs.ErrPermission)
      fmt.Println(err)
      fmt.Println(errors.Is(err, io.EOF), errors.Is(err, fs.ErrPermission))
      ```
    answer: '`lecture (EOF) puis écriture (permission denied)` puis `true true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io\"\n\t\"io/fs\"\n)\n\nfunc main() {\n\terr := fmt.Errorf(\"lecture (%w) puis écriture (%w)\", io.EOF, fs.ErrPermission)\n\tfmt.Println(err)\n\tfmt.Println(errors.Is(err, io.EOF), errors.Is(err, fs.ErrPermission))\n}\n"
      output: |-
        lecture (EOF) puis écriture (permission denied)
        true true
