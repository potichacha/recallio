notion: erreurs-sentinelles
lesson: "Une **erreur sentinelle** est une valeur d'erreur **exportée**, déclarée une fois, que l'appelant compare pour\nreconnaître un cas précis :\n\n```go\n// dans la bibliothèque standard\nvar EOF = errors.New(\"EOF\")                        // io.EOF\nvar ErrNoRows = errors.New(\"sql: no rows in result set\") // sql.ErrNoRows\nvar ErrNotExist = errors.New(\"file does not exist\") // fs.ErrNotExist\n\n// dans son propre package\nvar ErrIntrouvable = errors.New(\"commande introuvable\")\n\nif errors.Is(err, ErrIntrouvable) {\n\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n}\n```\n\n- On les nomme **`ErrXxx`**, et on les compare avec **`errors.Is`**, qui suit la chaîne des erreurs enveloppées ; `==`\n  échoue dès que l'erreur a reçu du contexte avec `%w`.\n- `io.EOF` n'est **pas un échec** : c'est la fin normale d'un flux ; on la traite à part.\n- Une sentinelle fait partie de l'**API publique** du package : la renommer ou la supprimer casse les appelants.\n- Elle ne porte **pas de données** : pour transmettre un champ, un code ou une cause, on utilise un **type d'erreur**.\n\n**Piège classique** : envelopper `io.EOF` (`fmt.Errorf(\"lecture : %w\", io.EOF)`) puis tester `err == io.EOF` ;\nla comparaison échoue et la fin de flux devient une erreur.\n\n**En entretien** : « Une variable ErrXxx exportée, comparée avec errors.Is ; io.EOF et sql.ErrNoRows en sont les\nexemples ; pas de données, pour ça on prend un type d'erreur. »"
tour:
  - title: Les erreurs sentinelles
    text: |-
      Une **erreur sentinelle** est une variable d'erreur exportée par un package, qui désigne un cas précis : `io.EOF`
      signale la fin d'un flux, `sql.ErrNoRows` une requête sans résultat.

      On la déclare au niveau du package, `var ErrIntrouvable = errors.New("introuvable")`, et on la reconnaît avec
      `errors.Is(err, ErrIntrouvable)`, qui la retrouve même emballée par `%w`. Une simple comparaison avec `==` échoue
      dès que l'erreur est emballée.

      `io.EOF` n'est pas un échec : c'est la fin normale d'une lecture.
    example:
      files:
        main.go: |-
          package main

          import (
          	"errors"
          	"fmt"
          )

          var ErrIntrouvable = errors.New("introuvable")

          func cherche(annuaire map[string]string, nom string) (string, error) {
          	tel, ok := annuaire[nom]
          	if !ok {
          		return "", fmt.Errorf("cherche %s : %w", nom, ErrIntrouvable)
          	}
          	return tel, nil
          }

          func main() {
          	annuaire := map[string]string{"Ada": "01 23"}
          	_, err := cherche(annuaire, "Alan")
          	fmt.Println(err)
          	fmt.Println(errors.Is(err, ErrIntrouvable), err == ErrIntrouvable)
          }
      output: |-
        cherche Alan : introuvable
        true false
cards:
  - key: erreur-sentinelle
    format: course
    question: "Qu'est-ce qu'une erreur sentinelle ?"
    choices:
      - {text: "Une variable d'erreur exportée et unique, comme `io.EOF`, que l'on compare", correct: true}
      - {text: "Un type d'erreur qui porte des champs, comme `*fs.PathError`", correct: false}
      - {text: "Une erreur créée à chaque appel par `errors.New`, dans une fonction", correct: false}
      - {text: "Une panique récupérée par `recover`, puis changée en erreur", correct: false}
    answer: "Une variable d'erreur de package, créée une fois, comme `io.EOF` ou `sql.ErrNoRows` : on la compare avec `errors.Is`. Un type comme `*fs.PathError` porte des données, ce n'est pas une sentinelle."
  - key: comparer
    format: course
    question: Comment comparer une erreur à une sentinelle ?
    choices:
      - {text: "Avec `errors.Is(err, ErrXxx)`, qui suit les enveloppes `%w`", correct: true}
      - {text: "Avec `err == ErrXxx`, qui suit aussi les enveloppes `%w`", correct: false}
      - {text: "Avec `errors.As(err, ErrXxx)`, qui compare les valeurs", correct: false}
      - {text: "Avec `err.Error() == ErrXxx.Error()`, qui compare les textes", correct: false}
    answer: Avec `errors.Is(err, ErrXxx)`, qui retrouve la sentinelle même si l'erreur a été enveloppée avec `%w`.
  - key: eof
    format: course
    question: Pourquoi `io.EOF` n'est-il pas un échec ?
    choices:
      - {text: "Il signale la fin normale d'un flux : la boucle de lecture s'arrête dessus", correct: true}
      - {text: "Il n'est renvoyé que par les fichiers vides, un cas sans conséquence", correct: false}
      - {text: "Il vaut `nil`, donc `err != nil` est faux quand il arrive", correct: false}
      - {text: "Go le change en panique récupérée, que la boucle de lecture ignore", correct: false}
    answer: 'Parce qu''il signale la fin normale d''un flux : une boucle de lecture s''arrête dessus sans le remonter comme une erreur.'
  - key: api
    format: course
    question: Pourquoi une erreur sentinelle exportée engage-t-elle le package ?
    choices:
      - {text: "Elle fait partie de l'API publique : la renommer casse les appelants qui la testent", correct: true}
      - {text: "Elle alloue de la mémoire à chaque appel de chaque fonction du package", correct: false}
      - {text: "Elle empêche le package d'envelopper ses propres erreurs avec `%w`", correct: false}
      - {text: "Elle oblige les appelants à importer `errors` en plus du package", correct: false}
    answer: 'Elle fait partie de l''API publique : les appelants la testent, et la renommer ou la retirer casse leur code.'
  - key: vf-egal
    format: true-false
    question: '`err == ErrIntrouvable` reste vrai quand l''erreur a été enveloppée avec `fmt.Errorf("...: %w", ErrIntrouvable)`.'
    truth: false
    answer: L'enveloppe est une autre valeur ; `errors.Is` parcourt la chaîne.
  - key: vf-nommage
    format: true-false
    question: Par convention, une erreur sentinelle se nomme `ErrXxx`.
    truth: true
    answer: Comme `sql.ErrNoRows` ou `fs.ErrNotExist`.
  - key: vf-donnees
    format: true-false
    question: Une erreur sentinelle peut transporter l'identifiant de la ressource introuvable.
    truth: false
    answer: C'est une valeur fixe ; pour des données, on utilise un type d'erreur (ou l'on enveloppe la sentinelle avec un message).
  - key: vf-norows
    format: true-false
    question: '`QueryRow(...).Scan(...)` renvoie `sql.ErrNoRows` quand aucune ligne ne correspond.'
    truth: true
    answer: On la teste avec `errors.Is` pour répondre « introuvable ».
  - key: qcm-sentinelles
    format: multiple-choice
    question: "Laquelle est une erreur sentinelle de la bibliothèque standard ?"
    choices:
      - {text: "`sql.ErrNoRows`", correct: true}
      - {text: "`*fs.PathError`", correct: false}
      - {text: "`*json.SyntaxError`", correct: false}
      - {text: "`*strconv.NumError`", correct: false}
    answer: "`sql.ErrNoRows` est une variable unique, comme `io.EOF` ; les trois autres sont des types d'erreur, qui portent des données (chemin, position, valeur)."
  - key: qcm-declarer
    format: multiple-choice
    question: Comment déclarer une sentinelle dans son package ?
    choices:
      - text: '`var ErrQuotaDepasse = errors.New("quota dépassé")`'
        correct: true
      - text: '`const ErrQuotaDepasse = "quota dépassé"`'
        correct: false
      - text: '`func ErrQuotaDepasse() error { return errors.New("quota dépassé") }`'
        correct: false
      - text: '`type ErrQuotaDepasse string`'
        correct: false
    answer: Une variable de package ; une fonction qui crée une nouvelle erreur à chaque appel ne serait jamais égale à elle-même.
  - key: qcm-eof
    format: multiple-choice
    question: Comment lire un flux jusqu'au bout avec `Read` ?
    choices:
      - {text: "Boucler jusqu'à `errors.Is(err, io.EOF)` (ou `err == io.EOF` pour une erreur non enveloppée), en traitant les octets reçus", correct: true}
      - {text: "Remonter `io.EOF` à l'appelant comme une erreur dès qu'il arrive, sans traiter les octets de ce dernier appel", correct: false}
      - {text: "S'arrêter dès que `n == 0`, en considérant qu'un `Read` qui ne renvoie aucun octet marque la fin du flux", correct: false}
      - {text: "Boucler jusqu'à `io.EOF`, mais ignorer les octets du `Read` qui le renvoie, car ils sont incomplets", correct: false}
    answer: "Un `Read` peut renvoyer des octets et `io.EOF` en même temps : on traite les octets avant de s'arrêter. `n == 0` ne veut pas dire la fin : un `Read` peut renvoyer 0 octet sans erreur."
  - key: trous-is
    format: fill-in
    question: |-
      Complète le test de la sentinelle :
      ```go
      if errors.___(err, ErrIntrouvable) {
      	return http.StatusNotFound
      }
      ```
    blanks:
      - - Is
    answer: '`errors.Is` suit les enveloppes.'
  - key: trous-declarer
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      var ErrPanierVide = errors.___("panier vide")
      ```
    blanks:
      - - New
    answer: Une variable de package, créée une fois.
  - key: trous-norows
    format: fill-in
    question: |-
      Complète pour répondre « introuvable » :
      ```go
      if errors.Is(err, sql.___) {
      	return nil, ErrIntrouvable
      }
      ```
    blanks:
      - - ErrNoRows
    answer: '`QueryRow().Scan` la renvoie quand aucune ligne ne correspond.'
  - key: trous-eof
    format: fill-in
    question: |-
      Complète la condition de fin de lecture :
      ```go
      if err == io.___ {
      	break
      }
      ```
    blanks:
      - - EOF
    answer: '`io.EOF` signale la fin normale du flux.'
  - key: code-is-vs-egal
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      err := fmt.Errorf("commande 42 : %w", ErrIntrouvable)
      fmt.Println(err == ErrIntrouvable, errors.Is(err, ErrIntrouvable))
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false true` : seul `errors.Is` voit la sentinelle à travers l''enveloppe.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\nfunc main() {\n\terr := fmt.Errorf(\"commande 42 : %w\", ErrIntrouvable)\n\tfmt.Println(err == ErrIntrouvable, errors.Is(err, ErrIntrouvable))\n}\n"
      output: false true
  - key: code-eof
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      r := strings.NewReader("abcde")
      buf := make([]byte, 2)
      for {
      	n, err := r.Read(buf)
      	fmt.Print(string(buf[:n]), " ")
      	if err == io.EOF {
      		break
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`ab cd e`", correct: true}
      - {text: "`ab cd`", correct: false}
      - {text: "`ab cd ed`", correct: false}
      - {text: "`abcde`", correct: false}
    answer: "`ab cd e` : trois lectures de 2, 2 et 1 octets, puis une quatrième qui renvoie 0 octet et `io.EOF`. `buf[:n]` n'affiche que les octets lus, jamais le reste d'une lecture précédente."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := strings.NewReader(\"abcde\")\n\tbuf := make([]byte, 2)\n\tfor {\n\t\tn, err := r.Read(buf)\n\t\tfmt.Print(string(buf[:n]), \" \")\n\t\tif err == io.EOF {\n\t\t\tbreak\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: ab cd e
  - key: code-nouvelle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func errVide() error { return errors.New("vide") }

      fmt.Println(errVide() == errVide(), errors.Is(errVide(), errVide()))
      ```
    choices:
      - {text: "`false false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`false false` : chaque appel crée une nouvelle erreur ; une sentinelle doit être une variable unique.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc errVide() error { return errors.New(\"vide\") }\n\nfunc main() {\n\tfmt.Println(errVide() == errVide(), errors.Is(errVide(), errVide()))\n}\n"
      output: false false
  - key: code-notexist
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      _, err := os.Open("fichier-qui-n-existe-pas.txt")
      fmt.Println(errors.Is(err, fs.ErrNotExist), errors.Is(err, os.ErrNotExist))
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: '`true true` : `os.ErrNotExist` est la même sentinelle que `fs.ErrNotExist`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\t_, err := os.Open(\"fichier-qui-n-existe-pas.txt\")\n\tfmt.Println(errors.Is(err, fs.ErrNotExist), errors.Is(err, os.ErrNotExist))\n}\n"
      output: true true
  - key: bug-egal
    format: bug-fix
    question: |-
      Une commande introuvable répond 500 au lieu de 404 depuis que le dépôt ajoute du contexte à ses erreurs. Quelle correction est la bonne ?
      ```go
      if err == ErrIntrouvable {
      	http.Error(w, "introuvable", 404)
      	return
      }
      ```
    choices:
      - {text: "Tester avec `errors.Is(err, ErrIntrouvable)`, qui suit la chaîne des enveloppes", correct: true}
      - {text: "Tester avec `errors.As(err, &ErrIntrouvable)`, qui compare les messages", correct: false}
      - {text: "Chercher le texte de `ErrIntrouvable` dans `err.Error()` avec `strings.Contains`", correct: false}
      - {text: "Faire envelopper le dépôt avec `%v` au lieu de `%w`, pour que `==` marche", correct: false}
    answer: "```go\nif errors.Is(err, ErrIntrouvable) {\n\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n\treturn\n}\n```\n`==` ne voit plus la sentinelle une fois enveloppée ; `errors.Is` suit la chaîne."
  - key: bug-fonction
    format: bug-fix
    question: |-
      Le test `errors.Is(err, ErrVide())` n'est jamais vrai. Quelle correction est la bonne ?
      ```go
      func ErrVide() error { return errors.New("vide") }
      ```
    choices:
      - {text: "Une variable de package, `var ErrVide = errors.New(\"vide\")`", correct: true}
      - {text: "Une constante, `const ErrVide = errors.New(\"vide\")`", correct: false}
      - {text: "`func ErrVide() error { return fmt.Errorf(\"vide\") }`", correct: false}
      - {text: "Comparer avec `err == ErrVide()` au lieu de `errors.Is`", correct: false}
    answer: |-
      ```go
      var ErrVide = errors.New("vide")
      ```
      Chaque appel créait une nouvelle valeur, jamais égale à une autre ; une sentinelle est une variable unique.
  - key: bug-eof-erreur
    format: bug-fix
    question: |-
      L'import d'un fichier « échoue » toujours sur la dernière ligne. Quelle correction est la bonne ?
      ```go
      for {
      	ligne, err := r.ReadString('\n')
      	if err != nil {
      		return fmt.Errorf("lecture : %w", err)
      	}
      	traiter(ligne)
      }
      ```
    choices:
      - {text: "Traiter la ligne reçue, puis sortir sans erreur sur `io.EOF` et remonter les autres", correct: true}
      - {text: "Sortir sans erreur sur `io.EOF`, avant de traiter la ligne lue avec lui", correct: false}
      - {text: "Ignorer les erreurs de `ReadString`, et s'arrêter sur la première ligne vide", correct: false}
      - {text: "Remplacer `ReadString('\\n')` par `ReadString(0)`, pour lire tout le fichier", correct: false}
    answer: "```go\nfor {\n\tligne, err := r.ReadString('\\n')\n\tif ligne != \"\" {\n\t\ttraiter(ligne)\n\t}\n\tif errors.Is(err, io.EOF) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn fmt.Errorf(\"lecture : %w\", err)\n\t}\n}\n```\n`io.EOF` est la fin normale ; la dernière ligne sans retour à la ligne arrive avec lui et doit être traitée."
  - key: bug-donnees
    format: bug-fix
    question: |-
      On veut que l'erreur dise quel produit manque, mais la sentinelle n'a qu'un message fixe. Quelle correction est la bonne ?
      ```go
      var ErrStock = errors.New("stock insuffisant")
      ```
    choices:
      - {text: "Envelopper la sentinelle : `fmt.Errorf(\"produit %s : %w\", ref, ErrStock)`", correct: true}
      - {text: "Envelopper avec `%v` : `fmt.Errorf(\"produit %s : %v\", ref, ErrStock)`", correct: false}
      - {text: "Recréer la sentinelle : `errors.New(\"stock insuffisant : \" + ref)`", correct: false}
      - {text: "Réaffecter la variable : `ErrStock = errors.New(\"stock : \" + ref)`", correct: false}
    answer: |-
      ```go
      var ErrStock = errors.New("stock insuffisant")

      return fmt.Errorf("produit %s : %w", ref, ErrStock)
      ```
      On enveloppe la sentinelle avec le contexte : l'appelant teste toujours `errors.Is(err, ErrStock)`, et le message
      nomme le produit. Si l'appelant a besoin de la donnée elle-même, on passe à un type d'erreur.
  - key: qcm-comparaison
    format: multiple-choice
    question: "Avec `err := fmt.Errorf(\"lecture : %w\", io.EOF)`, quel test est vrai ?"
    choices:
      - {text: "`errors.Is(err, io.EOF)`", correct: true}
      - {text: "`err == io.EOF`", correct: false}
      - {text: "`errors.Unwrap(err) == nil`", correct: false}
      - {text: "`err.Error() == io.EOF.Error()`", correct: false}
    answer: "L'enveloppe n'est pas égale à la sentinelle (`err != io.EOF` est vrai aussi), mais `errors.Is` la retrouve dans la chaîne. `errors.Unwrap(err)` renvoie `io.EOF`, et le message est « lecture : EOF »."
