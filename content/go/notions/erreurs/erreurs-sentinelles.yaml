notion: erreurs-sentinelles
lesson: "Une **erreur sentinelle** est une valeur d'erreur **exportée**, déclarée une fois, que l'appelant compare pour\nreconnaître un cas précis :\n\n```go\n// dans la bibliothèque standard\nvar EOF = errors.New(\"EOF\")                        // io.EOF\nvar ErrNoRows = errors.New(\"sql: no rows in result set\") // sql.ErrNoRows\nvar ErrNotExist = errors.New(\"file does not exist\") // fs.ErrNotExist\n\n// dans son propre package\nvar ErrIntrouvable = errors.New(\"commande introuvable\")\n\nif errors.Is(err, ErrIntrouvable) {\n\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n}\n```\n\n- On les nomme **`ErrXxx`**, et on les compare avec **`errors.Is`**, qui suit la chaîne des erreurs enveloppées ; `==`\n  échoue dès que l'erreur a reçu du contexte avec `%w`.\n- `io.EOF` n'est **pas un échec** : c'est la fin normale d'un flux ; on la traite à part.\n- Une sentinelle fait partie de l'**API publique** du package : la renommer ou la supprimer casse les appelants.\n- Elle ne porte **pas de données** : pour transmettre un champ, un code ou une cause, on utilise un **type d'erreur**.\n\n**Piège classique** : envelopper `io.EOF` (`fmt.Errorf(\"lecture : %w\", io.EOF)`) puis tester `err == io.EOF` ;\nla comparaison échoue et la fin de flux devient une erreur.\n\n**En entretien** : « Une variable ErrXxx exportée, comparée avec errors.Is ; io.EOF et sql.ErrNoRows en sont les\nexemples ; pas de données, pour ça on prend un type d'erreur. »"
tour:
  - title: Les erreurs sentinelles
    text: |-
      Une **erreur sentinelle** est une variable d'erreur exportée par un package, qui désigne un cas précis : `io.EOF`
      signale la fin d'un flux, `sql.ErrNoRows` une requête sans résultat.

      On la déclare au niveau du package, `var ErrIntrouvable = errors.New("introuvable")`, et on la reconnaît avec
      `errors.Is(err, ErrIntrouvable)`, qui la retrouve même emballée par `%w`. Une simple comparaison avec `==` échoue
      dès que l'erreur est emballée.

      `io.EOF` n'est pas un échec : c'est la fin normale d'une lecture.
    example:
      files:
        main.go: |-
          package main

          import (
          	"errors"
          	"fmt"
          )

          var ErrIntrouvable = errors.New("introuvable")

          func cherche(annuaire map[string]string, nom string) (string, error) {
          	tel, ok := annuaire[nom]
          	if !ok {
          		return "", fmt.Errorf("cherche %s : %w", nom, ErrIntrouvable)
          	}
          	return tel, nil
          }

          func main() {
          	annuaire := map[string]string{"Ada": "01 23"}
          	_, err := cherche(annuaire, "Alan")
          	fmt.Println(err)
          	fmt.Println(errors.Is(err, ErrIntrouvable), err == ErrIntrouvable)
          }
      output: |-
        cherche Alan : introuvable
        true false
cards:
  - key: erreur-sentinelle
    format: course
    question: C'est quoi une erreur sentinelle ?
    answer: Une variable d'erreur exportée et comparable, comme io.EOF ou sql.ErrNoRows.
  - key: comparer
    format: course
    question: Comment comparer une erreur à une sentinelle ?
    answer: Avec `errors.Is(err, ErrXxx)`, qui retrouve la sentinelle même si l'erreur a été enveloppée avec `%w`.
  - key: eof
    format: course
    question: Pourquoi `io.EOF` n'est-il pas un échec ?
    answer: 'Parce qu''il signale la fin normale d''un flux : une boucle de lecture s''arrête dessus sans le remonter comme une erreur.'
  - key: api
    format: course
    question: Pourquoi une erreur sentinelle exportée engage-t-elle le package ?
    answer: 'Elle fait partie de l''API publique : les appelants la testent, et la renommer ou la retirer casse leur code.'
  - key: vf-egal
    format: true-false
    question: '`err == ErrIntrouvable` reste vrai quand l''erreur a été enveloppée avec `fmt.Errorf("...: %w", ErrIntrouvable)`.'
    truth: false
    answer: L'enveloppe est une autre valeur ; `errors.Is` parcourt la chaîne.
  - key: vf-nommage
    format: true-false
    question: Par convention, une erreur sentinelle se nomme `ErrXxx`.
    truth: true
    answer: Comme `sql.ErrNoRows` ou `fs.ErrNotExist`.
  - key: vf-donnees
    format: true-false
    question: Une erreur sentinelle peut transporter l'identifiant de la ressource introuvable.
    truth: false
    answer: C'est une valeur fixe ; pour des données, on utilise un type d'erreur (ou l'on enveloppe la sentinelle avec un message).
  - key: vf-norows
    format: true-false
    question: '`QueryRow(...).Scan(...)` renvoie `sql.ErrNoRows` quand aucune ligne ne correspond.'
    truth: true
    answer: On la teste avec `errors.Is` pour répondre « introuvable ».
  - key: qcm-sentinelles
    format: multiple-choice
    question: Lesquelles sont des erreurs sentinelles de la bibliothèque standard ?
    choices:
      - text: '`io.EOF`'
        correct: true
      - text: '`sql.ErrNoRows`'
        correct: true
      - text: '`*fs.PathError`'
        correct: false
      - text: '`*json.SyntaxError`'
        correct: false
    answer: Les deux dernières sont des types d'erreur, qui portent des données.
  - key: qcm-declarer
    format: multiple-choice
    question: Comment déclarer une sentinelle dans son package ?
    choices:
      - text: '`var ErrQuotaDepasse = errors.New("quota dépassé")`'
        correct: true
      - text: '`const ErrQuotaDepasse = "quota dépassé"`'
        correct: false
      - text: '`func ErrQuotaDepasse() error { return errors.New("quota dépassé") }`'
        correct: false
      - text: '`type ErrQuotaDepasse string`'
        correct: false
    answer: Une variable de package ; une fonction qui crée une nouvelle erreur à chaque appel ne serait jamais égale à elle-même.
  - key: qcm-eof
    format: multiple-choice
    question: Comment lire un flux jusqu'au bout avec `Read` ?
    choices:
      - text: Boucler jusqu'à `errors.Is(err, io.EOF)` (ou `err == io.EOF` pour une erreur non enveloppée), en traitant les octets reçus
        correct: true
      - text: Remonter `io.EOF` comme une erreur à l'appelant
        correct: false
      - text: S'arrêter dès que `n == 0`
        correct: false
      - text: Paniquer sur io.EOF
        correct: false
    answer: Un `Read` peut renvoyer des octets et `io.EOF` en même temps ; on traite les octets avant de s'arrêter.
  - key: trous-is
    format: fill-in
    question: "Complétez le test de la sentinelle :\n```go\nif errors.___(err, ErrIntrouvable) {\n\treturn http.StatusNotFound\n}\n```"
    blanks:
      - - Is
    answer: '`errors.Is` suit les enveloppes.'
  - key: trous-declarer
    format: fill-in
    question: |-
      Complétez la déclaration :
      ```go
      var ErrPanierVide = errors.___("panier vide")
      ```
    blanks:
      - - New
    answer: Une variable de package, créée une fois.
  - key: trous-norows
    format: fill-in
    question: "Complétez pour répondre « introuvable » :\n```go\nif errors.Is(err, sql.___) {\n\treturn nil, ErrIntrouvable\n}\n```"
    blanks:
      - - ErrNoRows
    answer: '`QueryRow().Scan` la renvoie quand aucune ligne ne correspond.'
  - key: trous-eof
    format: fill-in
    question: "Complétez la condition de fin de lecture :\n```go\nif err == io.___ {\n\tbreak\n}\n```"
    blanks:
      - - EOF
    answer: '`io.EOF` signale la fin normale du flux.'
  - key: code-is-vs-egal
    format: code-output
    question: |-
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      err := fmt.Errorf("commande 42 : %w", ErrIntrouvable)
      fmt.Println(err == ErrIntrouvable, errors.Is(err, ErrIntrouvable))
      ```
    answer: '`false true` : seul `errors.Is` voit la sentinelle à travers l''enveloppe.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\nfunc main() {\n\terr := fmt.Errorf(\"commande 42 : %w\", ErrIntrouvable)\n\tfmt.Println(err == ErrIntrouvable, errors.Is(err, ErrIntrouvable))\n}\n"
      output: false true
  - key: code-eof
    format: code-output
    question: "```go\nr := strings.NewReader(\"abcde\")\nbuf := make([]byte, 2)\nfor {\n\tn, err := r.Read(buf)\n\tfmt.Print(string(buf[:n]), \" \")\n\tif err == io.EOF {\n\t\tbreak\n\t}\n}\nfmt.Println()\n```"
    answer: '`ab cd e ` (suivi d''un espace vide) : trois lectures, puis `io.EOF` sans octet.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tr := strings.NewReader(\"abcde\")\n\tbuf := make([]byte, 2)\n\tfor {\n\t\tn, err := r.Read(buf)\n\t\tfmt.Print(string(buf[:n]), \" \")\n\t\tif err == io.EOF {\n\t\t\tbreak\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: ab cd e
  - key: code-nouvelle
    format: code-output
    question: |-
      ```go
      func errVide() error { return errors.New("vide") }

      fmt.Println(errVide() == errVide(), errors.Is(errVide(), errVide()))
      ```
    answer: '`false false` : chaque appel crée une nouvelle erreur ; une sentinelle doit être une variable unique.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc errVide() error { return errors.New(\"vide\") }\n\nfunc main() {\n\tfmt.Println(errVide() == errVide(), errors.Is(errVide(), errVide()))\n}\n"
      output: false false
  - key: code-notexist
    format: code-output
    question: |-
      ```go
      _, err := os.Open("fichier-qui-n-existe-pas.txt")
      fmt.Println(errors.Is(err, fs.ErrNotExist), errors.Is(err, os.ErrNotExist))
      ```
    answer: '`true true` : `os.ErrNotExist` est la même sentinelle que `fs.ErrNotExist`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\t_, err := os.Open(\"fichier-qui-n-existe-pas.txt\")\n\tfmt.Println(errors.Is(err, fs.ErrNotExist), errors.Is(err, os.ErrNotExist))\n}\n"
      output: true true
  - key: bug-egal
    format: bug-fix
    question: "Une commande introuvable répond 500 au lieu de 404 depuis que le dépôt ajoute du contexte à ses erreurs :\n```go\nif err == ErrIntrouvable {\n\thttp.Error(w, \"introuvable\", 404)\n\treturn\n}\n```"
    answer: "```go\nif errors.Is(err, ErrIntrouvable) {\n\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n\treturn\n}\n```\n`==` ne voit plus la sentinelle une fois enveloppée ; `errors.Is` suit la chaîne."
  - key: bug-fonction
    format: bug-fix
    question: |-
      Le test `errors.Is(err, ErrVide())` n'est jamais vrai :
      ```go
      func ErrVide() error { return errors.New("vide") }
      ```
    answer: |-
      ```go
      var ErrVide = errors.New("vide")
      ```
      Chaque appel créait une nouvelle valeur, jamais égale à une autre ; une sentinelle est une variable unique.
  - key: bug-eof-erreur
    format: bug-fix
    question: "L'import d'un fichier « échoue » toujours sur la dernière ligne :\n```go\nfor {\n\tligne, err := r.ReadString('\\n')\n\tif err != nil {\n\t\treturn fmt.Errorf(\"lecture : %w\", err)\n\t}\n\ttraiter(ligne)\n}\n```"
    answer: "```go\nfor {\n\tligne, err := r.ReadString('\\n')\n\tif ligne != \"\" {\n\t\ttraiter(ligne)\n\t}\n\tif errors.Is(err, io.EOF) {\n\t\treturn nil\n\t}\n\tif err != nil {\n\t\treturn fmt.Errorf(\"lecture : %w\", err)\n\t}\n}\n```\n`io.EOF` est la fin normale ; la dernière ligne sans retour à la ligne arrive avec lui et doit être traitée."
  - key: bug-donnees
    format: bug-fix
    question: |-
      On veut que l'erreur dise quel produit manque, mais la sentinelle n'a qu'un message fixe :
      ```go
      var ErrStock = errors.New("stock insuffisant")
      ```
    answer: |-
      ```go
      var ErrStock = errors.New("stock insuffisant")

      return fmt.Errorf("produit %s : %w", ref, ErrStock)
      ```
      On enveloppe la sentinelle avec le contexte : l'appelant teste toujours `errors.Is(err, ErrStock)`, et le message
      nomme le produit. Si l'appelant a besoin de la donnée elle-même, on passe à un type d'erreur.
  - key: qcm-comparaison
    format: multiple-choice
    question: 'Avec `err := fmt.Errorf("lecture : %w", io.EOF)`, quels tests sont vrais ?'
    choices:
      - text: '`errors.Is(err, io.EOF)`'
        correct: true
      - text: '`err != io.EOF`'
        correct: true
      - text: '`err == io.EOF`'
        correct: false
      - text: '`errors.As(err, io.EOF)`'
        correct: false
    answer: L'enveloppe n'est pas égale à la sentinelle, mais `errors.Is` la retrouve.
