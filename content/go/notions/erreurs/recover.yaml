notion: recover
lesson: "**`recover`** arrête une panique et renvoie la valeur passée à `panic`. Il ne fonctionne que **directement dans une\nfonction différée** de la goroutine qui panique :\n\n```go\nfunc executer(tache func()) (err error) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\terr = fmt.Errorf(\"panique : %v\", r)\n\t\t}\n\t}()\n\ttache()\n\treturn nil\n}\n```\n\n- Hors d'un `defer`, ou dans une fonction appelée **par** la fonction différée, `recover` renvoie **nil** et ne fait\n  rien.\n- Il ne rattrape que les paniques de **sa propre goroutine** : une goroutine lancée doit avoir son propre `defer` avec\n  `recover`.\n- Avec un **retour nommé**, la fonction différée peut transformer la panique en erreur.\n- Depuis Go 1.21, `panic(nil)` devient une `*runtime.PanicNilError` : `recover` ne renvoie plus nil pour une vraie\n  panique.\n- Certaines erreurs **ne se récupèrent pas** : les erreurs fatales du runtime (écritures concurrentes dans une map,\n  épuisement de la mémoire, interblocage de toutes les goroutines).\n\nOù l'utiliser : à une **frontière** (un serveur qui ne doit pas tomber pour une requête : `net/http` récupère déjà les\npaniques des handlers et journalise ; un worker qui traite des tâches indépendantes), pour journaliser avec la pile\n(`debug.Stack()`) et répondre une erreur. Pas pour masquer des bugs dans le code ordinaire.\n\n**Piège classique** : un `recover` dans `main` qui croit protéger les goroutines. Une panique dans une autre goroutine\narrête quand même tout le programme.\n\n**En entretien** : « recover dans une fonction différée de la même goroutine ; il renvoie la valeur de la panique et\npermet d'en faire une erreur ; il ne voit pas les autres goroutines ni les erreurs fatales ; à réserver aux\nfrontières. »"
cards:
  - key: appeler-recover
    format: course
    question: "Où appeler `recover` pour qu'il arrête une panique ?"
    choices:
      - {text: "Directement dans une fonction différée de la goroutine qui panique", correct: true}
      - {text: "N'importe où dans la goroutine, après l'appel qui peut paniquer", correct: false}
      - {text: "Dans `main`, qui rattrape les paniques de toutes les goroutines", correct: false}
      - {text: "Dans une fonction appelée par la fonction différée, à toute profondeur", correct: false}
    answer: "Dans une fonction différée de la goroutine qui panique, appelé directement par elle. Hors d'un `defer`, ou plus bas dans la pile, `recover` renvoie nil ; et `main` ne voit pas les paniques des autres goroutines."
  - key: toutes-erreurs-runtime-sont-elles-recuperables
    format: course
    question: "Toutes les erreurs du runtime sont-elles récupérables par `recover` ?"
    choices:
      - {text: "Non : écritures concurrentes dans une map, interblocage global, pile ou mémoire épuisée sont fatals", correct: true}
      - {text: "Oui : toute erreur du runtime est une panique, que `recover` arrête dans une fonction différée", correct: false}
      - {text: "Non : seules les paniques lancées explicitement par `panic` peuvent être récupérées", correct: false}
      - {text: "Oui, à condition d'appeler `recover` dans `main`, qui voit toutes les goroutines du programme", correct: false}
    answer: "Non : un accès concurrent à une map, un interblocage de toutes les goroutines, un débordement de pile ou un manque de mémoire sont des erreurs fatales, qui arrêtent le programme sans dérouler les `defer`. Un indice hors limites ou un nil déréférencé, eux, se récupèrent."
  - key: net-http-recupere-panics
    format: course
    question: "Le serveur de `net/http` récupère-t-il les paniques des handlers ?"
    choices:
      - {text: "Oui, par requête : il journalise la panique et ferme la connexion", correct: true}
      - {text: "Non : une panique dans un handler arrête tout le serveur", correct: false}
      - {text: "Oui, et il renvoie au client un 500 avec la pile d'appels", correct: false}
      - {text: "Oui, y compris celles des goroutines lancées par le handler", correct: false}
    answer: "Oui, pour chaque requête : il journalise la panique avec sa pile et ferme la connexion, sans réponse propre ni alerte. Les goroutines lancées par un handler, elles, ne sont pas protégées."
  - key: panic-nil-depuis-1-21
    format: course
    question: "Que fait `panic(nil)` depuis Go 1.21 ?"
    choices:
      - {text: "Il panique avec une `*runtime.PanicNilError`, et `recover` ne renvoie plus nil", correct: true}
      - {text: "Il ne fait rien : une panique sans valeur est ignorée par le runtime", correct: false}
      - {text: "Il panique, mais `recover` renvoie nil, comme si rien ne s'était passé", correct: false}
      - {text: "Il ne compile plus : `panic` refuse désormais un argument nil", correct: false}
    answer: "Il panique avec une `*runtime.PanicNilError` : `recover` renvoie cette erreur, et non nil. Avant Go 1.21, `recover` renvoyait nil, impossible à distinguer d'une absence de panique."
  - key: vf-hors-defer
    format: true-false
    question: Appeler `recover()` directement dans le corps d'une fonction, hors defer, arrête une panique en cours.
    truth: false
    answer: Hors d'une fonction différée, `recover` renvoie nil et n'arrête rien.
  - key: vf-autre-goroutine
    format: true-false
    question: Un recover dans `main` arrête les paniques des goroutines lancées par `main`.
    truth: false
    answer: Chaque goroutine doit récupérer ses propres paniques.
  - key: vf-fatal
    format: true-false
    question: '« fatal error: concurrent map writes » peut être récupéré avec recover.'
    truth: false
    answer: C'est une erreur fatale du runtime, pas une panique.
  - key: vf-http
    format: true-false
    question: Le serveur de `net/http` récupère les paniques des handlers et continue de servir les autres requêtes.
    truth: true
    answer: Il journalise la panique et ferme la connexion concernée.
  - key: qcm-ou
    format: multiple-choice
    question: Où `recover` arrête-t-il une panique ?
    choices:
      - text: Appelé directement dans une fonction différée de la goroutine qui panique
        correct: true
      - text: Dans une fonction appelée par la fonction différée
        correct: false
      - text: Dans une autre goroutine
        correct: false
      - text: Dans le corps de main, n'importe où
        correct: false
    answer: Il doit être appelé directement par la fonction différée.
  - key: qcm-frontieres
    format: multiple-choice
    question: "Lesquels de ces emplacements justifient un `recover` ?"
    choices:
      - {text: "Dans un worker qui traite des tâches indépendantes, pour qu'une tâche boguée ne fasse pas tomber les autres", correct: true}
      - {text: "Dans un middleware qui journalise la panique avec sa pile et répond 500", correct: true}
      - {text: "Autour de chaque appel de fonction, par prudence, au cas où une bibliothèque paniquerait", correct: false}
      - {text: "À la place de la gestion des erreurs attendues, pour alléger les `if err != nil`", correct: false}
    answer: "`recover` sert aux frontières, pour isoler une panne et alerter, pas au flux normal : une erreur attendue se renvoie."
  - key: qcm-nil
    format: multiple-choice
    question: Que renvoie `recover` depuis Go 1.21 après `panic(nil)` ?
    choices:
      - text: Une `*runtime.PanicNilError`
        correct: true
      - text: nil
        correct: false
      - text: Une chaîne vide
        correct: false
      - text: La panique n'est pas récupérable
        correct: false
    answer: Pour distinguer une vraie panique de l'absence de panique.
  - key: qcm-erreur
    format: multiple-choice
    question: Comment transformer une panique en erreur renvoyée ?
    choices:
      - {text: "Un retour nommé `err error` modifié par la fonction différée qui appelle recover", correct: true}
      - {text: "`return recover()` à la fin de la fonction, qui renvoie la valeur de la panique", correct: false}
      - {text: "Un bloc `try` autour de l'appel, puis un `catch` qui construit l'erreur", correct: false}
      - {text: "Une variable locale `err`, modifiée par la fonction différée puis renvoyée", correct: false}
    answer: "Seule une fonction différée voit la panique, et seul un retour nommé lui permet de changer le résultat : une variable locale renvoyée par `return err` est copiée avant que la fonction différée ne s'exécute."
