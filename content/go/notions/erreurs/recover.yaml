      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
    answer: '`true true` : depuis Go 1.21, `panic(nil)` donne une `*runtime.PanicNilError`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tdefer func() {\n\t\tr := recover()\n\t\t_, estPanicNil := r.(*runtime.PanicNilError)\n\t\tfmt.Println(r != nil, estPanicNil)\n\t}()\n\tpanic(nil)\n}\n"
      output: true true
  - key: bug-main
    format: bug-fix
    question: |-
      Le `recover` de `main` n'empêche pas le service de tomber. Quelle correction est la bonne ?
      ```go
      func main() {
      	defer func() { recover() }()
      	for job := range jobs {
      		go traiter(job)
      	}
      }
      ```
    choices:
      - {text: "Un `defer` avec `recover` dans chaque goroutine, autour de `traiter(job)`", correct: true}
      - {text: "Déplacer le `defer` de `main` après la boucle, pour qu'il voie les goroutines", correct: false}
      - {text: "Appeler `recover()` dans la boucle, juste après chaque `go traiter(job)`", correct: false}
      - {text: "Ajouter un `sync.WaitGroup`, pour que `main` attende et rattrape les paniques", correct: false}
    answer: "```go\nfor job := range jobs {\n\tgo func() {\n\t\tdefer func() {\n\t\t\tif r := recover(); r != nil {\n\t\t\t\tslog.Error(\"panique dans traiter\", \"job\", job.ID, \"valeur\", r)\n\t\t\t}\n\t\t}()\n\t\ttraiter(job)\n\t}()\n}\n```\n`recover` ne voit que les paniques de sa goroutine : chaque goroutine doit avoir le sien."
  - key: bug-hors-defer
    format: bug-fix
    question: |-
      Ce `recover` ne récupère jamais rien. Quelle correction est la bonne ?
      ```go
      func securise(f func()) {
      	f()
      	if r := recover(); r != nil {
      		log.Println(r)
      	}
      }
      ```
    choices:
      - {text: "Le mettre dans une fonction différée, posée avant l'appel à `f()`", correct: true}
      - {text: "Le mettre dans une fonction différée, posée après l'appel à `f()`", correct: false}
      - {text: "Appeler `recover()` avant `f()`, pour qu'il soit prêt à temps", correct: false}
      - {text: "Lancer `f()` dans une goroutine, puis appeler `recover()`", correct: false}
    answer: "```go\nfunc securise(f func()) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tlog.Println(r)\n\t\t}\n\t}()\n\tf()\n}\n```\n`recover` doit être appelé dans une fonction différée, mise en place avant l'appel qui peut paniquer."
  - key: bug-masquer
    format: bug-fix
    question: |-
      En revue, une fonction utilitaire avale toutes les paniques sans rien dire. Quelle correction est la bonne ?
      ```go
      defer func() { recover() }()
      ```
    choices:
      - {text: "Journaliser la valeur et la pile, puis renvoyer une erreur par un retour nommé", correct: true}
      - {text: "Afficher la valeur avec `fmt.Println(recover())`, sans rien changer d'autre", correct: false}
      - {text: "Relancer `panic(recover())` dans une seconde fonction différée, pour ne rien perdre", correct: false}
      - {text: "Garder le code : une panique avalée vaut toujours mieux qu'un service arrêté", correct: false}
    answer: "```go\ndefer func() {\n\tif r := recover(); r != nil {\n\t\tslog.Error(\"panique récupérée\", \"valeur\", r, \"pile\", string(debug.Stack()))\n\t\terr = fmt.Errorf(\"erreur interne : %v\", r)\n\t}\n}()\n```\nUne panique est un bug : on la journalise avec sa pile et l'on renvoie une erreur, au lieu de la faire disparaître."
  - key: bug-retour
    format: bug-fix
    question: |-
      La fonction renvoie nil même après une panique récupérée. Quelle correction est la bonne ?
      ```go
      func executer(t func()) error {
      	var err error
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("panique : %v", r)
      		}
      	}()
      	t()
      	return err
      }
      ```
    choices:
      - {text: "Un retour nommé `(err error)`, que la fonction différée modifie", correct: true}
      - {text: "Un `return err` dans la fonction différée, après l'affectation", correct: false}
      - {text: "Une variable `err` de type `*error`, modifiée par la fonction différée", correct: false}
      - {text: "Le `defer` placé après `t()`, pour qu'il s'exécute avant le `return`", correct: false}
    answer: |-
      ```go
      func executer(t func()) (err error) {
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("panique : %v", r)
      		}
      	}()
      	t()
      	return nil
      }
      ```
      Sans retour nommé, `return err` copie la valeur nil dans le résultat avant que la fonction différée ne s'exécute : modifier `err` ensuite ne change plus rien. Un retour nommé, lui, est le résultat même.
  - key: scenario-serveur
    format: scenario
    question: Ton serveur HTTP doit continuer à fonctionner si un handler panique, et tu veux une alerte. Que mets-tu en place ?
    choices:
      - {text: "Un middleware de récupération en tête de chaîne : log avec la pile, métrique pour l'alerte, réponse 500", correct: true}
      - {text: "Rien de plus : `net/http` récupère déjà les paniques, répond 500 et prévient l'équipe", correct: false}
      - {text: "Un `recover` dans `main`, qui rattrape les paniques de tous les handlers et de leurs goroutines", correct: false}
      - {text: "Un redémarrage automatique du conteneur à chaque panique, sans changer le code du serveur", correct: false}
    answer: |-
      `net/http` récupère déjà les paniques des handlers, mais il se contente d'un log et ferme la connexion. J'ajoute
      un middleware de récupération en tête de chaîne : il récupère la panique, la journalise avec la pile et
      l'identifiant de requête, incrémente une métrique (pour l'alerte), envoie l'événement à Sentry et répond 500 au
      client. Les goroutines lancées par les handlers ont chacune leur propre recover, puisque le middleware ne les voit
      pas.
  - key: scenario-worker
    format: scenario
    question: Un pool de workers traite des tâches indépendantes, et une tâche boguée fait tomber tout le processus. Comment l'isoler ?
    choices:
      - {text: "Chaque tâche dans une fonction avec `defer` et `recover`, qui la passe en échec et journalise sa pile", correct: true}
      - {text: "Un `recover` dans `main`, qui rattrape les paniques des workers et relance le pool en entier", correct: false}
      - {text: "Un `recover` autour de l'instruction `go worker()`, dans la fonction qui crée le pool", correct: false}
      - {text: "Un channel d'erreurs où chaque worker envoie ses échecs, sans `recover` dans les workers", correct: false}
    answer: |-
      Chaque worker exécute chaque tâche dans une fonction qui pose un `defer` avec `recover` : la panique est
      transformée en erreur de cette tâche, journalisée avec sa pile, et la tâche passe en échec (ou en file d'erreurs)
      pendant que le worker continue. Je garde une métrique des paniques pour être alerté : le recover n'est pas une
      correction, juste une isolation.
  - key: scenario-limites
    format: scenario
    question: 'Pourquoi un recover ne protège-t-il pas d''un « fatal error: concurrent map writes » ?'
    choices:
      - {text: "C'est une erreur fatale, pas une panique : le runtime arrête tout sans dérouler les `defer`", correct: true}
      - {text: "Le `recover` était mal placé : il doit être dans la goroutine qui écrit dans la map", correct: false}
      - {text: "Cette erreur se récupère, mais seulement après `debug.SetPanicOnFault(true)`", correct: false}
      - {text: "`recover` ne voit que les paniques lancées par `panic`, jamais celles du runtime", correct: false}
    answer: |-
      Parce que ce n'est pas une panique mais une erreur fatale : le runtime arrête le programme immédiatement, sans
      dérouler les defer, car l'état de la map (et peut-être de la mémoire) n'est plus fiable. Même chose pour
      l'épuisement de la mémoire ou l'interblocage de toutes les goroutines. La seule protection est de corriger la
      cause : un mutex autour de la map, détecté en amont par `go test -race`.
  - key: scenario-bibliotheque
    format: scenario
    question: Une bibliothèque qui utilise panic en interne peut-elle laisser passer ces paniques vers ses appelants ?
    choices:
      - {text: "Non : elle récupère à sa frontière et renvoie une erreur, sauf pour un mauvais usage documenté", correct: true}
      - {text: "Oui : c'est à l'appelant de poser un `recover` autour de chaque appel à la bibliothèque", correct: false}
      - {text: "Oui, si la panique porte une valeur `error`, que l'appelant peut tester après `recover`", correct: false}
      - {text: "Non : une bibliothèque ne doit jamais utiliser `panic`, même en interne et récupérée", correct: false}
    answer: |-
      Non : une panique qui traverse l'API publique transforme un problème interne en arrêt du programme de
      l'appelant. Si la bibliothèque utilise panic pour se simplifier la vie (comme `encoding/json` pour sortir d'une
      récursion profonde), elle récupère à sa frontière et renvoie une erreur. Les paniques qui restent sont réservées
      aux mauvais usages évidents de l'API, documentés.
