  - key: code-erreur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      executer := func(t func()) (err error) {
      	defer func() {
      		if r := recover(); r != nil {
      			err = fmt.Errorf("panique : %v", r)
      		}
      	}()
      	t()
      	return nil
      }

      fmt.Println(executer(func() {}))
      fmt.Println(executer(func() { panic("boum") }))
      ```
    choices:
      - text: |-
          ```
          <nil>
          panique : boum
          ```
        correct: true
      - text: |-
          ```
          <nil>
          <nil>
          ```
        correct: false
      - text: |-
          ```
          panique : boum
          panique : boum
          ```
        correct: false
      - {text: "`<nil>`, puis une panic : boum", correct: false}
    answer: '`<nil>` puis `panique : boum` : la panique devient une erreur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\texecuter := func(t func()) (err error) {\n\t\tdefer func() {\n\t\t\tif r := recover(); r != nil {\n\t\t\t\terr = fmt.Errorf(\"panique : %v\", r)\n\t\t\t}\n\t\t}()\n\t\tt()\n\t\treturn nil\n\t}\n\n\tfmt.Println(executer(func() {}))\n\tfmt.Println(executer(func() { panic(\"boum\") }))\n}\n"
      output: |-
        <nil>
        panique : boum
  - key: code-indirect
