notion: types-erreur
lesson: "Quand une erreur doit **porter des données** (un champ, un code, une cause), on définit un **type d'erreur** : une\nstruct qui implémente `Error() string`.\n\n```go\ntype ErrValidation struct {\n\tChamp  string\n\tRaison string\n}\n\nfunc (e *ErrValidation) Error() string {\n\treturn fmt.Sprintf(\"champ %s invalide : %s\", e.Champ, e.Raison)\n}\n\nreturn &ErrValidation{Champ: \"email\", Raison: \"format\"}\n\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\treponse400(w, ev.Champ)\n}\n```\n\n- On le nomme **`XxxError`** ou `ErrXxx` selon la convention du projet (la bibliothèque standard dit `PathError`,\n  `SyntaxError`).\n- On le récupère avec **`errors.As`** (ou `errors.AsType` depuis Go 1.26), qui suit la chaîne des enveloppes.\n- Pour qu'il participe à la chaîne, il peut **envelopper une cause** : un champ `Err error` et une méthode\n  `Unwrap() error`. Il peut aussi implémenter `Is(error) bool` pour se déclarer équivalent à une sentinelle.\n- On le renvoie en général par **pointeur** (`*ErrValidation`), et toujours derrière le type `error` dans les\n  signatures (voir le piège du pointeur nil typé).\n\nExemples de la bibliothèque standard : `*fs.PathError` (opération, chemin, cause), `*json.SyntaxError` (position),\n`*net.OpError`, `*strconv.NumError`.\n\n**Piège classique** : un type d'erreur à receveur pointeur testé avec `errors.As(err, &ErrValidation{})` ou un\n`ErrValidation` valeur ; la cible doit être un pointeur vers le **type exact** renvoyé (`**ErrValidation` ici).\n\n**En entretien** : « Une struct qui implémente Error() pour transporter des données ; récupérée avec errors.As ; un\nchamp Err et Unwrap pour garder la cause ; renvoyée comme error. »"
cards:
  - key: type-erreur-participe-chaine
    format: course
    question: Comment un type d'erreur participe-t-il à la chaîne ?
    answer: En implémentant Unwrap() error (ou Unwrap() []error).
  - key: quand
    format: course
    question: Quand préférer un type d'erreur à une sentinelle ?
    answer: 'Quand l''appelant a besoin de données sur l''erreur : le champ invalide, un code, la cause, un délai de nouvelle tentative.'
  - key: unwrap
    format: course
    question: Comment un type d'erreur garde-t-il la cause qu'il enveloppe ?
    answer: Avec un champ `Err error` et une méthode `Unwrap() error { return e.Err }`, que `errors.Is` et `errors.As` suivent.
  - key: vf-as
    format: true-false
    question: '`errors.As` retrouve un type d''erreur même enveloppé dans plusieurs couches de contexte.'
    truth: true
    answer: Il parcourt la chaîne des `Unwrap`.
  - key: vf-retour
    format: true-false
    question: Une fonction devrait renvoyer `*ErrValidation` plutôt que `error` dans sa signature.
    truth: false
    answer: Renvoyer `error` évite le piège du pointeur nil typé et garde l'API souple.
  - key: vf-stdlib
    format: true-false
    question: '`*fs.PathError` contient l''opération, le chemin et l''erreur sous-jacente.'
    truth: true
    answer: Ses champs `Op`, `Path` et `Err`, avec `Unwrap`.
  - key: vf-cible
    format: true-false
    question: '`errors.As(err, &e)` exige que `e` soit une variable du type d''erreur cherché (souvent un pointeur).'
    truth: true
    answer: La cible est l'adresse d'une variable de ce type ; `errors.As` y range l'erreur trouvée.
  - key: qcm-type
    format: multiple-choice
    question: Que faut-il pour qu'une struct soit un type d'erreur ?
    choices:
      - text: Une méthode `Error() string`
        correct: true
      - text: Une déclaration `implements error`
        correct: false
      - text: Embarquer `errors.Error`
        correct: false
      - text: Un champ `Message string`
        correct: false
    answer: L'interface `error` est implicite comme les autres.
  - key: qcm-as
    format: multiple-choice
    question: Comment récupérer le champ invalide d'une `*ErrValidation` peut-être enveloppée ?
    choices:
      - text: '`var ev *ErrValidation; if errors.As(err, &ev) { ev.Champ }`'
        correct: true
      - text: '`if ev, ok := errors.AsType[*ErrValidation](err); ok { ev.Champ }` (Go 1.26)'
        correct: true
      - text: '`ev := err.(*ErrValidation)`'
        correct: false
      - text: '`errors.Is(err, ErrValidation)`'
        correct: false
    answer: L'assertion directe échoue sur une erreur enveloppée.
  - key: qcm-stdlib
    format: multiple-choice
    question: Lesquels sont des types d'erreur de la bibliothèque standard ?
    choices:
      - text: '`*strconv.NumError`'
        correct: true
      - text: '`*json.SyntaxError`'
        correct: true
      - text: '`io.EOF`'
        correct: false
      - text: '`sql.ErrNoRows`'
        correct: false
    answer: Les deux derniers sont des sentinelles.
  - key: qcm-is
    format: multiple-choice
    question: À quoi sert une méthode `Is(target error) bool` sur un type d'erreur ?
    choices:
      - text: À déclarer que l'erreur équivaut à une sentinelle pour `errors.Is`
        correct: true
      - text: À remplacer `Error()`
        correct: false
      - text: À rendre l'erreur comparable avec `==`
        correct: false
      - text: À envelopper une cause
        correct: false
    answer: Par exemple une `*ErrHTTP` de statut 404 qui répond vrai pour `ErrIntrouvable`.
  - key: trous-methode
    format: fill-in
    question: "Complétez le type d'erreur :\n```go\nfunc (e *ErrValidation) ___() string {\n\treturn \"champ \" + e.Champ + \" invalide\"\n}\n```"
    blanks:
      - - Error
    answer: '`Error() string` fait de la struct une erreur.'
  - key: trous-as
    format: fill-in
    question: "Complétez la récupération du type :\n```go\nvar ev *ErrValidation\nif errors.___(err, &ev) {\n\tfmt.Println(ev.Champ)\n}\n```"
    blanks:
      - - As
    answer: '`errors.As` range l''erreur trouvée dans `ev`.'
  - key: trous-unwrap
    format: fill-in
    question: |-
      Complétez pour exposer la cause :
      ```go
      func (e *ErrRequete) ___() error { return e.Err }
      ```
    blanks:
      - - Unwrap
    answer: '`Unwrap` relie l''erreur à sa cause.'
  - key: trous-cible
    format: fill-in
    question: "Complétez l'appel :\n```go\nvar pe *fs.PathError\nif errors.As(err, ___pe) {\n\tlog.Println(\"chemin :\", pe.Path)\n}\n```"
    blanks:
      - - '&'
    answer: La cible est l'adresse de la variable.
  - key: code-as
    format: code-output
    question: |-
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "champ " + e.Champ + " invalide" }

      err := fmt.Errorf("inscription : %w", &ErrValidation{"email"})
      var ev *ErrValidation
      fmt.Println(errors.As(err, &ev), ev.Champ)
      fmt.Println(err)
      ```
    answer: '`true email` puis `inscription : champ email invalide`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"champ \" + e.Champ + \" invalide\" }\n\nfunc main() {\n\terr := fmt.Errorf(\"inscription : %w\", &ErrValidation{\"email\"})\n\tvar ev *ErrValidation\n\tfmt.Println(errors.As(err, &ev), ev.Champ)\n\tfmt.Println(err)\n}\n"
      output: |-
        true email
        inscription : champ email invalide
  - key: code-path-error
    format: code-output
    question: "```go\n_, err := os.Open(\"absent.txt\")\nvar pe *fs.PathError\nif errors.As(err, &pe) {\n\tfmt.Println(pe.Op, pe.Path, errors.Is(pe.Err, fs.ErrNotExist))\n}\n```"
    answer: '`open absent.txt true` : le type d''erreur porte l''opération, le chemin et la cause.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\t_, err := os.Open(\"absent.txt\")\n\tvar pe *fs.PathError\n\tif errors.As(err, &pe) {\n\t\tfmt.Println(pe.Op, pe.Path, errors.Is(pe.Err, fs.ErrNotExist))\n\t}\n}\n"
      output: open absent.txt true
  - key: code-unwrap
    format: code-output
    question: "```go\nvar ErrReseau = errors.New(\"réseau\")\n\ntype ErrRequete struct {\n\tURL string\n\tErr error\n}\n\nfunc (e *ErrRequete) Error() string { return e.URL + \" : \" + e.Err.Error() }\nfunc (e *ErrRequete) Unwrap() error { return e.Err }\n\nvar err error = &ErrRequete{\"https://api\", ErrReseau}\nfmt.Println(errors.Is(err, ErrReseau), err)\n```"
    answer: '`true https://api : réseau` : grâce à `Unwrap`, la cause reste visible pour `errors.Is`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrReseau = errors.New(\"réseau\")\n\n\ntype ErrRequete struct {\n\tURL string\n\tErr error\n}\n\n\nfunc (e *ErrRequete) Error() string { return e.URL + \" : \" + e.Err.Error() }\n\nfunc (e *ErrRequete) Unwrap() error { return e.Err }\n\nfunc main() {\n\tvar err error = &ErrRequete{\"https://api\", ErrReseau}\n\tfmt.Println(errors.Is(err, ErrReseau), err)\n}\n"
      output: 'true https://api : réseau'
  - key: code-astype
    format: code-output
    question: "```go\n_, err := strconv.Atoi(\"12a\")\nif ne, ok := errors.AsType[*strconv.NumError](err); ok {\n\tfmt.Println(ne.Func, ne.Num, ne.Err)\n}\n```"
    answer: '`Atoi 12a invalid syntax` : `errors.AsType` (Go 1.26) renvoie l''erreur typée et un booléen.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\t_, err := strconv.Atoi(\"12a\")\n\tif ne, ok := errors.AsType[*strconv.NumError](err); ok {\n\t\tfmt.Println(ne.Func, ne.Num, ne.Err)\n\t}\n}\n"
      output: Atoi 12a invalid syntax
  - key: bug-assertion
    format: bug-fix
    question: "Le code 400 n'est jamais renvoyé depuis que le service ajoute du contexte :\n```go\nif ev, ok := err.(*ErrValidation); ok {\n\thttp.Error(w, ev.Champ+\" invalide\", 400)\n}\n```"
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, ev.Champ+\" invalide\", http.StatusBadRequest)\n}\n```\nL'assertion ne regarde que l'erreur de premier niveau ; `errors.As` parcourt la chaîne."
  - key: bug-cible
    format: bug-fix
    question: |-
      Ce code panique avec « errors: target must be a non-nil pointer » :
      ```go
      var ev *ErrValidation
      errors.As(err, ev)
      ```
    answer: |-
      ```go
      var ev *ErrValidation
      errors.As(err, &ev)
      ```
      La cible est l'adresse de la variable, ici un `**ErrValidation`.
  - key: bug-cause-perdue
    format: bug-fix
    question: "Le type d'erreur cache la cause, et `errors.Is(err, context.DeadlineExceeded)` est toujours faux :\n```go\ntype ErrAppel struct {\n\tService string\n\tCause   string\n}\n\nreturn &ErrAppel{\"paiement\", err.Error()}\n```"
    answer: "```go\ntype ErrAppel struct {\n\tService string\n\tErr     error\n}\n\nfunc (e *ErrAppel) Error() string { return e.Service + \" : \" + e.Err.Error() }\nfunc (e *ErrAppel) Unwrap() error { return e.Err }\n\nreturn &ErrAppel{\"paiement\", err}\n```\nGarder la cause comme erreur (et non comme texte) avec `Unwrap` permet de la tester."
  - key: bug-valeur-pointeur
    format: bug-fix
    question: '`errors.As(err, &ev)` avec `var ev ErrValidation` ne trouve jamais l''erreur, renvoyée par `return &ErrValidation{...}`. Pourquoi ?'
    answer: |-
      ```go
      var ev *ErrValidation
      if errors.As(err, &ev) { ... }
      ```
      L'erreur dans la chaîne est un `*ErrValidation` : la cible doit avoir exactement ce type. On reste cohérent : un
      type d'erreur se renvoie et se cherche toujours sous la même forme (pointeur, en général).
  - key: pointeur
    format: course
    question: Pourquoi renvoie-t-on souvent un type d'erreur par pointeur (`&ErrValidation{}`) ?
    answer: Pour que chaque erreur soit une valeur distincte, éviter les copies et garder une forme unique à rechercher avec `errors.As` ; on le renvoie derrière le type `error`.
