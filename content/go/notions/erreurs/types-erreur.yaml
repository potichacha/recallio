notion: types-erreur
lesson: "Quand une erreur doit **porter des données** (un champ, un code, une cause), on définit un **type d'erreur** : une\nstruct qui implémente `Error() string`.\n\n```go\ntype ErrValidation struct {\n\tChamp  string\n\tRaison string\n}\n\nfunc (e *ErrValidation) Error() string {\n\treturn fmt.Sprintf(\"champ %s invalide : %s\", e.Champ, e.Raison)\n}\n\nreturn &ErrValidation{Champ: \"email\", Raison: \"format\"}\n\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\treponse400(w, ev.Champ)\n}\n```\n\n- On le nomme **`XxxError`** ou `ErrXxx` selon la convention du projet (la bibliothèque standard dit `PathError`,\n  `SyntaxError`).\n- On le récupère avec **`errors.As`** (ou `errors.AsType` depuis Go 1.26), qui suit la chaîne des enveloppes.\n- Pour qu'il participe à la chaîne, il peut **envelopper une cause** : un champ `Err error` et une méthode\n  `Unwrap() error`. Il peut aussi implémenter `Is(error) bool` pour se déclarer équivalent à une sentinelle.\n- On le renvoie en général par **pointeur** (`*ErrValidation`), et toujours derrière le type `error` dans les\n  signatures (voir le piège du pointeur nil typé).\n\nExemples de la bibliothèque standard : `*fs.PathError` (opération, chemin, cause), `*json.SyntaxError` (position),\n`*net.OpError`, `*strconv.NumError`.\n\n**Piège classique** : un type d'erreur à receveur pointeur testé avec `errors.As(err, &ErrValidation{})` ou un\n`ErrValidation` valeur ; la cible doit être un pointeur vers le **type exact** renvoyé (`**ErrValidation` ici).\n\n**En entretien** : « Une struct qui implémente Error() pour transporter des données ; récupérée avec errors.As ; un\nchamp Err et Unwrap pour garder la cause ; renvoyée comme error. »"
cards:
  - key: type-erreur-participe-chaine
    format: course
    question: "Comment un type d'erreur participe-t-il à la chaîne des erreurs enveloppées ?"
    choices:
      - {text: "En implémentant `Unwrap() error` (ou `Unwrap() []error`)", correct: true}
      - {text: "En embarquant le type `error` dans sa struct, sans méthode", correct: false}
      - {text: "En implémentant `Cause() error`, que lit `errors.Is`", correct: false}
      - {text: "En étant créé par `fmt.Errorf` plutôt que par un littéral", correct: false}
    answer: "En implémentant `Unwrap() error` (ou `Unwrap() []error` pour plusieurs causes), que suivent `errors.Is` et `errors.As`. `Cause()` est la convention de l'ancienne bibliothèque pkg/errors, que la bibliothèque standard ignore."
  - key: quand
    format: course
    question: Quand préférer un type d'erreur à une sentinelle ?
    choices:
      - {text: "Quand l'appelant a besoin de données sur l'erreur : un champ, un code, un délai", correct: true}
      - {text: "Quand l'erreur doit être comparée avec `==` par les appelants", correct: false}
      - {text: "Quand l'erreur est fréquente, un type étant plus rapide à créer", correct: false}
      - {text: "Jamais : un type d'erreur n'est pas reconnu par `errors.Is`", correct: false}
    answer: 'Quand l''appelant a besoin de données sur l''erreur : le champ invalide, un code, la cause, un délai de nouvelle tentative.'
  - key: unwrap
    format: course
    question: Comment un type d'erreur garde-t-il la cause qu'il enveloppe ?
    choices:
      - {text: "Avec un champ `Err error` et une méthode `Unwrap() error { return e.Err }`", correct: true}
      - {text: "Avec un champ `Cause string`, qui garde le message de l'erreur d'origine", correct: false}
      - {text: "Avec un champ `Err error` seul, que `errors.Is` trouve par réflexion", correct: false}
      - {text: "Avec une méthode `Error()` qui renvoie le message de la cause", correct: false}
    answer: Avec un champ `Err error` et une méthode `Unwrap() error { return e.Err }`, que `errors.Is` et `errors.As` suivent.
  - key: vf-as
    format: true-false
    question: '`errors.As` retrouve un type d''erreur même enveloppé dans plusieurs couches de contexte.'
    truth: true
    answer: Il parcourt la chaîne des `Unwrap`.
  - key: vf-retour
    format: true-false
    question: Une fonction devrait renvoyer `*ErrValidation` plutôt que `error` dans sa signature.
    truth: false
    answer: Renvoyer `error` évite le piège du pointeur nil typé et garde l'API souple.
  - key: vf-stdlib
    format: true-false
    question: '`*fs.PathError` contient l''opération, le chemin et l''erreur sous-jacente.'
    truth: true
    answer: Ses champs `Op`, `Path` et `Err`, avec `Unwrap`.
  - key: vf-cible
    format: true-false
    question: '`errors.As(err, &e)` exige que `e` soit une variable du type d''erreur cherché (souvent un pointeur).'
    truth: true
    answer: La cible est l'adresse d'une variable de ce type ; `errors.As` y range l'erreur trouvée.
  - key: qcm-type
    format: multiple-choice
    question: Que faut-il pour qu'une struct soit un type d'erreur ?
    choices:
      - text: Une méthode `Error() string`
        correct: true
      - text: Une déclaration `implements error`
        correct: false
      - text: Embarquer `errors.Error`
        correct: false
      - text: Un champ `Message string`
        correct: false
    answer: L'interface `error` est implicite comme les autres.
  - key: qcm-as
    format: multiple-choice
    question: Comment récupérer le champ invalide d'une `*ErrValidation` peut-être enveloppée ?
    choices:
      - {text: "`var ev *ErrValidation; if errors.As(err, &ev) { ev.Champ }`", correct: true}
      - {text: "`ev := err.(*ErrValidation); ev.Champ`", correct: false}
      - {text: "`if errors.Is(err, &ErrValidation{}) { ... }`", correct: false}
      - {text: "`var ev ErrValidation; if errors.As(err, &ev) { ev.Champ }`", correct: false}
    answer: "`errors.As` parcourt la chaîne et range l'erreur trouvée dans `ev` ; depuis Go 1.26, `errors.AsType[*ErrValidation](err)` fait de même sans variable. L'assertion directe échoue sur une erreur enveloppée, et une cible `ErrValidation` sans pointeur ne correspond pas à un `*ErrValidation`."
  - key: qcm-stdlib
    format: multiple-choice
    question: "Lequel est un type d'erreur de la bibliothèque standard ?"
    choices:
      - {text: "`*strconv.NumError`", correct: true}
      - {text: "`io.EOF`", correct: false}
      - {text: "`sql.ErrNoRows`", correct: false}
      - {text: "`fs.ErrNotExist`", correct: false}
    answer: "`*strconv.NumError` porte des données (la fonction, la saisie, la cause), comme `*json.SyntaxError` ; les trois autres sont des sentinelles, des variables uniques."
  - key: qcm-is
    format: multiple-choice
    question: À quoi sert une méthode `Is(target error) bool` sur un type d'erreur ?
    choices:
      - {text: "À déclarer que l'erreur équivaut à une sentinelle pour `errors.Is`", correct: true}
      - {text: "À remplacer `Error()`, pour fournir le message de l'erreur", correct: false}
      - {text: "À rendre l'erreur comparable avec `==`, sans passer par `errors.Is`", correct: false}
      - {text: "À envelopper une cause, pour la rendre visible à `errors.As`", correct: false}
    answer: Par exemple une `*ErrHTTP` de statut 404 qui répond vrai pour `ErrIntrouvable`.
  - key: trous-methode
    format: fill-in
    question: |-
      Complète le type d'erreur :
      ```go
      func (e *ErrValidation) ___() string {
      	return "champ " + e.Champ + " invalide"
      }
      ```
    blanks:
      - - Error
    answer: '`Error() string` fait de la struct une erreur.'
  - key: trous-as
    format: fill-in
    question: |-
      Complète la récupération du type :
      ```go
      var ev *ErrValidation
      if errors.___(err, &ev) {
      	fmt.Println(ev.Champ)
      }
      ```
    blanks:
      - - As
    answer: '`errors.As` range l''erreur trouvée dans `ev`.'
  - key: trous-unwrap
    format: fill-in
    question: |-
      Complète pour exposer la cause :
      ```go
      func (e *ErrRequete) ___() error { return e.Err }
      ```
    blanks:
      - - Unwrap
    answer: '`Unwrap` relie l''erreur à sa cause.'
  - key: trous-cible
    format: fill-in
    question: |-
      Complète l'appel :
      ```go
      var pe *fs.PathError
      if errors.As(err, ___pe) {
      	log.Println("chemin :", pe.Path)
      }
      ```
    blanks:
      - - '&'
    answer: La cible est l'adresse de la variable.
  - key: code-as
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "champ " + e.Champ + " invalide" }

      err := fmt.Errorf("inscription : %w", &ErrValidation{"email"})
      var ev *ErrValidation
      fmt.Println(errors.As(err, &ev), ev.Champ)
      fmt.Println(err)
      ```
    choices:
      - text: |-
          ```
          true email
          inscription : champ email invalide
          ```
        correct: true
      - text: |-
          ```
          true email
          champ email invalide
          ```
        correct: false
      - text: |-
          ```
          false email
          inscription : champ email invalide
          ```
        correct: false
      - text: |-
          ```
          true email
          inscription : &{email}
          ```
        correct: false
    answer: '`true email` puis `inscription : champ email invalide`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"champ \" + e.Champ + \" invalide\" }\n\nfunc main() {\n\terr := fmt.Errorf(\"inscription : %w\", &ErrValidation{\"email\"})\n\tvar ev *ErrValidation\n\tfmt.Println(errors.As(err, &ev), ev.Champ)\n\tfmt.Println(err)\n}\n"
      output: |-
        true email
        inscription : champ email invalide
  - key: code-path-error
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      _, err := os.Open("absent.txt")
      var pe *fs.PathError
      if errors.As(err, &pe) {
      	fmt.Println(pe.Op, pe.Path, errors.Is(pe.Err, fs.ErrNotExist))
      }
      ```
    choices:
      - {text: "`open absent.txt true`", correct: true}
      - {text: "`open absent.txt false`", correct: false}
      - {text: "`os.Open absent.txt true`", correct: false}
      - {text: "Rien : `errors.As` renvoie false", correct: false}
    answer: '`open absent.txt true` : le type d''erreur porte l''opération, le chemin et la cause.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\t_, err := os.Open(\"absent.txt\")\n\tvar pe *fs.PathError\n\tif errors.As(err, &pe) {\n\t\tfmt.Println(pe.Op, pe.Path, errors.Is(pe.Err, fs.ErrNotExist))\n\t}\n}\n"
      output: open absent.txt true
  - key: code-unwrap
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ErrReseau = errors.New("réseau")

      type ErrRequete struct {
      	URL string
      	Err error
      }

      func (e *ErrRequete) Error() string { return e.URL + " : " + e.Err.Error() }
      func (e *ErrRequete) Unwrap() error { return e.Err }

      var err error = &ErrRequete{"https://api", ErrReseau}
      fmt.Println(errors.Is(err, ErrReseau), err)
      ```
    choices:
      - {text: "`true https://api : réseau`", correct: true}
      - {text: "`false https://api : réseau`", correct: false}
      - {text: "`true réseau`", correct: false}
      - {text: "`false réseau`", correct: false}
    answer: '`true https://api : réseau` : grâce à `Unwrap`, la cause reste visible pour `errors.Is`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrReseau = errors.New(\"réseau\")\n\n\ntype ErrRequete struct {\n\tURL string\n\tErr error\n}\n\n\nfunc (e *ErrRequete) Error() string { return e.URL + \" : \" + e.Err.Error() }\n\nfunc (e *ErrRequete) Unwrap() error { return e.Err }\n\nfunc main() {\n\tvar err error = &ErrRequete{\"https://api\", ErrReseau}\n\tfmt.Println(errors.Is(err, ErrReseau), err)\n}\n"
      output: 'true https://api : réseau'
  - key: code-astype
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      _, err := strconv.Atoi("12a")
      if ne, ok := errors.AsType[*strconv.NumError](err); ok {
      	fmt.Println(ne.Func, ne.Num, ne.Err)
      }
      ```
    choices:
      - {text: "`Atoi 12a invalid syntax`", correct: true}
      - {text: "`Atoi \"12a\" invalid syntax`", correct: false}
      - {text: "`strconv.Atoi 12a invalid syntax`", correct: false}
      - {text: "Rien : `errors.AsType` renvoie false", correct: false}
    answer: '`Atoi 12a invalid syntax` : `errors.AsType` (Go 1.26) renvoie l''erreur typée et un booléen.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\t_, err := strconv.Atoi(\"12a\")\n\tif ne, ok := errors.AsType[*strconv.NumError](err); ok {\n\t\tfmt.Println(ne.Func, ne.Num, ne.Err)\n\t}\n}\n"
      output: Atoi 12a invalid syntax
  - key: bug-assertion
    format: bug-fix
    question: |-
      Le code 400 n'est jamais renvoyé depuis que le service ajoute du contexte. Quelle correction est la bonne ?
      ```go
      if ev, ok := err.(*ErrValidation); ok {
      	http.Error(w, ev.Champ+" invalide", 400)
      }
      ```
    choices:
      - {text: "`errors.As(err, &ev)` avec `var ev *ErrValidation`, qui parcourt la chaîne", correct: true}
      - {text: "`err.(ErrValidation)`, une assertion sur la valeur plutôt que sur le pointeur", correct: false}
      - {text: "`errors.Is(err, &ErrValidation{})`, qui reconnaît le type à travers l'enveloppe", correct: false}
      - {text: "`errors.Unwrap(err).(*ErrValidation)`, quel que soit le nombre d'enveloppes", correct: false}
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, ev.Champ+\" invalide\", http.StatusBadRequest)\n}\n```\nL'assertion ne regarde que l'erreur de premier niveau ; `errors.As` parcourt la chaîne."
  - key: bug-cible
    format: bug-fix
    question: |-
      Ce code panique avec « errors: target must be a non-nil pointer ». Quelle correction est la bonne ?
      ```go
      var ev *ErrValidation
      errors.As(err, ev)
      ```
    choices:
      - {text: "Passer l'adresse de la variable : `errors.As(err, &ev)`", correct: true}
      - {text: "Initialiser la cible avec `ev := &ErrValidation{}`, puis `errors.As(err, ev)`", correct: false}
      - {text: "Déclarer `var ev ErrValidation`, puis appeler `errors.As(err, ev)`", correct: false}
      - {text: "Remplacer par `errors.Is(err, ev)`, qui accepte un pointeur nil", correct: false}
    answer: |-
      ```go
      var ev *ErrValidation
      errors.As(err, &ev)
      ```
      La cible est l'adresse de la variable, ici un `**ErrValidation`.
  - key: bug-cause-perdue
    format: bug-fix
    question: |-
      Le type d'erreur cache la cause, et `errors.Is(err, context.DeadlineExceeded)` est toujours faux. Quelle correction est la bonne ?
      ```go
      type ErrAppel struct {
      	Service string
      	Cause   string
      }

      return &ErrAppel{"paiement", err.Error()}
      ```
    choices:
      - {text: "Garder la cause dans un champ `Err error`, exposé par une méthode `Unwrap`", correct: true}
      - {text: "Garder `Cause string`, et chercher « deadline » dans le message de l'erreur", correct: false}
      - {text: "Remplir `Cause` avec `fmt.Sprint(err)` plutôt qu'avec `err.Error()`", correct: false}
      - {text: "Envelopper `&ErrAppel{...}` dans un `fmt.Errorf` avec `%v`, avant de le renvoyer", correct: false}
    answer: "```go\ntype ErrAppel struct {\n\tService string\n\tErr     error\n}\n\nfunc (e *ErrAppel) Error() string { return e.Service + \" : \" + e.Err.Error() }\nfunc (e *ErrAppel) Unwrap() error { return e.Err }\n\nreturn &ErrAppel{\"paiement\", err}\n```\nGarder la cause comme erreur (et non comme texte) avec `Unwrap` permet de la tester."
  - key: bug-valeur-pointeur
    format: bug-fix
    question: '`errors.As(err, &ev)` avec `var ev ErrValidation` ne trouve jamais l''erreur, renvoyée par `return &ErrValidation{...}`. Pourquoi ?'
    choices:
      - {text: "La chaîne contient un `*ErrValidation`, et la cible doit avoir exactement ce type", correct: true}
      - {text: "`errors.As` ne cherche que des sentinelles, jamais des types d'erreur", correct: false}
      - {text: "`errors.As` compare les messages, différents entre la valeur et le pointeur", correct: false}
      - {text: "L'erreur doit d'abord être enveloppée avec `%w` pour qu'`errors.As` la trouve", correct: false}
    answer: |-
      ```go
      var ev *ErrValidation
      if errors.As(err, &ev) { ... }
      ```
      L'erreur dans la chaîne est un `*ErrValidation` : la cible doit avoir exactement ce type. On reste cohérent : un
      type d'erreur se renvoie et se cherche toujours sous la même forme (pointeur, en général).
  - key: pointeur
    format: course
    question: Pourquoi renvoie-t-on souvent un type d'erreur par pointeur (`&ErrValidation{}`) ?
    choices:
      - {text: "Pour que chaque erreur soit distincte, sans copie, et cherchée sous une seule forme", correct: true}
      - {text: "Parce qu'une struct renvoyée par valeur ne peut pas implémenter `error`", correct: false}
      - {text: "Pour que `errors.Is` compare les champs des erreurs un à un", correct: false}
      - {text: "Parce qu'un pointeur nil est la façon idiomatique de dire « pas d'erreur »", correct: false}
    answer: Pour que chaque erreur soit une valeur distincte, éviter les copies et garder une forme unique à rechercher avec `errors.As` ; on le renvoie derrière le type `error`.
