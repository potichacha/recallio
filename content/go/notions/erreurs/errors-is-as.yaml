notion: errors-is-as
lesson: "Deux fonctions inspectent une **chaîne d'erreurs** (les erreurs enveloppées les unes dans les autres par `%w` ou\n`Unwrap`) :\n\n- **`errors.Is(err, cible)`** : vrai si une erreur de la chaîne **est** la cible, une **valeur** comme une sentinelle\n  (`io.EOF`, `ErrIntrouvable`) ;\n- **`errors.As(err, &cible)`** : vrai si une erreur de la chaîne est d'un **type** donné, et la range dans `cible`.\n\n```go\nif errors.Is(err, context.DeadlineExceeded) { ... } // une valeur\n\nvar pe *fs.PathError\nif errors.As(err, &pe) {                             // un type\n\tlog.Println(\"chemin :\", pe.Path)\n}\n\nif pe, ok := errors.AsType[*fs.PathError](err); ok { // Go 1.26, générique\n\tlog.Println(pe.Path)\n}\n```\n\n- Elles suivent `Unwrap() error` et `Unwrap() []error` (plusieurs `%w`, `errors.Join`) en profondeur.\n- Un type peut personnaliser la correspondance avec `Is(target error) bool` ou `As(target any) bool`.\n- `errors.As` exige une **cible non nil** : un pointeur vers une variable du type cherché ; sinon elle panique.\n- Pour un **timeout**, on teste `errors.Is(err, context.DeadlineExceeded)` ou, pour une erreur réseau,\n  `var ne net.Error; errors.As(err, &ne) && ne.Timeout()`.\n\n`==` et l'assertion de type ne regardent que l'erreur de **premier niveau** : ils échouent dès qu'un niveau a ajouté du\ncontexte.\n\n**Piège classique** : `errors.Is(err, &ErrValidation{})` pour chercher un type d'erreur. `Is` compare des valeurs : deux\npointeurs différents ne sont jamais égaux ; il faut `errors.As`.\n\n**En entretien** : « errors.Is pour une valeur (sentinelle), errors.As pour un type ; les deux parcourent la chaîne des\nUnwrap ; errors.AsType depuis 1.26 ; == et l'assertion ne voient que le premier niveau. »"
cards:
  - key: errors-is-plutot
    format: course
    question: "Pourquoi utiliser `errors.Is` plutôt que `==` pour tester une erreur ?"
    choices:
      - {text: "`errors.Is` parcourt toute la chaîne des erreurs enveloppées", correct: true}
      - {text: "`==` compare les messages, qui peuvent changer d'une version à l'autre", correct: false}
      - {text: "`errors.Is` compare les types, alors que `==` compare les adresses", correct: false}
      - {text: "`==` ne compile pas entre deux valeurs de type `error`", correct: false}
    answer: "`errors.Is` parcourt toute la chaîne des erreurs enveloppées avec `%w` ; `==` ne voit que l'erreur de premier niveau. `==` compare les interfaces (type et valeur), jamais le message."
  - key: errors-is-vs-errors-as
    format: course
    question: "Quelle différence entre `errors.Is` et `errors.As` ?"
    choices:
      - {text: "`Is` cherche une valeur précise dans la chaîne, `As` y cherche un type et l'extrait", correct: true}
      - {text: "`Is` cherche un type dans la chaîne, `As` compare l'erreur à une valeur précise", correct: false}
      - {text: "`Is` ne regarde que le premier niveau, `As` parcourt toute la chaîne", correct: false}
      - {text: "`Is` compare les messages des erreurs, `As` compare leurs adresses", correct: false}
    answer: "`errors.Is(err, ErrX)` teste l'identité à une valeur, une sentinelle ; `errors.As(err, &cible)` cherche une erreur d'un type donné et la copie dans la cible, pour lire ses champs. Les deux parcourent toute la chaîne."
  - key: apporte-errors-astype
    format: course
    question: "Qu'apporte `errors.AsType`, ajoutée en Go 1.26 ?"
    choices:
      - {text: "Une version générique d'`errors.As`, sans variable cible, plus sûre et plus rapide", correct: true}
      - {text: "Une version d'`errors.Is` qui compare les types des erreurs au lieu de leurs valeurs", correct: false}
      - {text: "Une conversion qui panique quand l'erreur n'a pas le type demandé", correct: false}
      - {text: "Un moyen de changer le type d'une erreur avant de la remonter", correct: false}
    answer: "`errors.AsType[*ErrValidation](err)` renvoie l'erreur typée et un booléen : pas de variable cible à déclarer, un type vérifié à la compilation, et pas de réflexion. Elle ne panique pas : elle renvoie false."
  - key: tester-erreur-timeout
    format: course
    question: "Comment tester qu'une erreur est un dépassement de délai ?"
    choices:
      - {text: "Par une interface `Timeout() bool` avec `errors.As`, ou `errors.Is(err, context.DeadlineExceeded)`", correct: true}
      - {text: "Par `strings.Contains(err.Error(), \"timeout\")`, qui marche avec toutes les bibliothèques", correct: false}
      - {text: "Par `err == context.DeadlineExceeded`, même quand l'erreur a été enveloppée plus bas", correct: false}
      - {text: "Par une assertion `err.(*TimeoutError)`, le type que partagent tous les délais dépassés", correct: false}
    answer: Avec une interface de comportement (Timeout() bool) testée par errors.As, ou errors.Is(err, context.DeadlineExceeded).
  - key: code-e1-errors-new-e2-fmt
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      e1 := errors.New("a")
      e2 := fmt.Errorf("ctx: %w", e1)
      e3 := fmt.Errorf("ctx: %v", e1)
      fmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true true false`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: '`true false false` : seul `%w` conserve l''erreur dans la chaîne.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\te1 := errors.New(\"a\")\n\te2 := fmt.Errorf(\"ctx: %w\", e1)\n\te3 := fmt.Errorf(\"ctx: %v\", e1)\n\tfmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)\n}\n"
      output: true false false
  - key: terme-errors-is-as-astype-join
    format: course
    question: "Que regroupent les fonctions `errors.Is`, `errors.As`, `errors.AsType` et `errors.Join` ?"
    choices:
      - {text: "L'inspection et la combinaison des erreurs enveloppées", correct: true}
      - {text: "La création d'erreurs qui capturent la pile d'appels", correct: false}
      - {text: "La conversion des paniques récupérées en erreurs", correct: false}
      - {text: "Le formatage des messages d'erreur pour les logs", correct: false}
    answer: "`Is`, `As` et `AsType` inspectent la chaîne des erreurs enveloppées ; `Join` en combine plusieurs en une. Créer et formater une erreur, c'est `errors.New` et `fmt.Errorf`."
  - key: vf-is-valeur
    format: true-false
    question: '`errors.Is` cherche une valeur précise dans la chaîne, `errors.As` un type.'
    truth: true
    answer: Une sentinelle avec Is, un type d'erreur avec As.
  - key: vf-profondeur
    format: true-false
    question: '`errors.Is` ne regarde que l''erreur et sa cause directe.'
    truth: false
    answer: Elle parcourt toute la chaîne, y compris les erreurs multiples de `errors.Join`.
  - key: vf-cible-nil
    format: true-false
    question: '`errors.As(err, nil)` renvoie simplement false.'
    truth: false
    answer: 'Elle panique : la cible doit être un pointeur non nil.'
  - key: vf-astype
    format: true-false
    question: '`errors.AsType[*fs.PathError](err)` renvoie l''erreur typée et un booléen, sans variable intermédiaire.'
    truth: true
    answer: Ajoutée en Go 1.26.
  - key: qcm-choisir
    format: multiple-choice
    question: "Quel usage de `errors.Is` ou de `errors.As` est le bon ?"
    choices:
      - {text: "`errors.As` pour lire le champ `Path` d'un `*fs.PathError`", correct: true}
      - {text: "`errors.Is` pour récupérer un `*ErrValidation` et lire son champ", correct: false}
      - {text: "`errors.As` pour comparer l'erreur à la sentinelle `io.EOF`", correct: false}
      - {text: "`errors.Is` pour extraire le code d'un `*pgconn.PgError`", correct: false}
    answer: "Une valeur avec `Is`, un type avec `As` : lire un champ demande d'extraire l'erreur typée. `errors.Is(err, sql.ErrNoRows)` est l'autre bon usage, pour une sentinelle."
  - key: qcm-timeout
    format: multiple-choice
    question: "Lesquels de ces tests reconnaissent un dépassement de délai, même enveloppé ?"
    choices:
      - text: '`errors.Is(err, context.DeadlineExceeded)`'
        correct: true
      - text: '`var ne net.Error; errors.As(err, &ne) && ne.Timeout()`'
        correct: true
      - text: '`strings.Contains(err.Error(), "timeout")`'
        correct: false
      - text: '`err == context.DeadlineExceeded` sur une erreur enveloppée'
        correct: false
    answer: "On teste l'identité ou le type, jamais le texte, qui peut changer ; et `==` ne voit pas une sentinelle enveloppée."
  - key: qcm-personnaliser
    format: multiple-choice
    question: "Lesquels de ces moyens font répondre vrai à `errors.Is(err, ErrIntrouvable)` pour un type d'erreur ?"
    choices:
      - text: En implémentant `Is(target error) bool` qui renvoie vrai pour `ErrIntrouvable`
        correct: true
      - text: En enveloppant `ErrIntrouvable` et en l'exposant par `Unwrap`
        correct: true
      - text: En ayant le même message que `ErrIntrouvable`
        correct: false
      - text: En étant déclaré dans le même package
        correct: false
    answer: "`errors.Is` appelle la méthode `Is` de chaque niveau et suit `Unwrap` ; le texte et le package ne comptent jamais."
  - key: qcm-premier-niveau
    format: multiple-choice
    question: "Laquelle de ces vérifications retrouve encore `ErrIntrouvable` une fois l'erreur enveloppée avec `%w` ?"
    choices:
      - {text: "`errors.Is(err, ErrIntrouvable)`", correct: true}
      - {text: "`err == ErrIntrouvable`", correct: false}
      - {text: "`err.Error() == ErrIntrouvable.Error()`", correct: false}
      - {text: "`errors.Unwrap(err) == nil`", correct: false}
    answer: "`errors.Is` parcourt la chaîne ; `==` et une assertion comme `err.(*ErrValidation)` ne voient que le premier niveau, et échouent dès qu'un niveau a ajouté du contexte."
  - key: trous-is
    format: fill-in
    question: |-
      Complète le test de délai :
      ```go
      if errors.Is(err, context.___) {
      	return http.StatusGatewayTimeout
      }
      ```
    blanks:
      - - DeadlineExceeded
    answer: '`context.DeadlineExceeded` est la sentinelle des délais dépassés.'
  - key: trous-as
    format: fill-in
    question: |-
      Complète pour récupérer l'erreur réseau :
      ```go
      var ne net.Error
      if errors.___(err, &ne) && ne.Timeout() {
      	reessayer()
      }
      ```
    blanks:
      - - As
    answer: '`errors.As` accepte aussi une interface comme cible.'
  - key: trous-astype
    format: fill-in
    question: |-
      Complète la forme générique (Go 1.26) :
      ```go
      if ev, ok := errors.___[*ErrValidation](err); ok {
      	fmt.Println(ev.Champ)
      }
      ```
    blanks:
      - - AsType
    answer: '`errors.AsType` évite la variable cible.'
  - key: trous-methode-is
    format: fill-in
    question: |-
      Complète la méthode de correspondance :
      ```go
      func (e *ErrHTTP) ___(cible error) bool {
      	return e.Statut == 404 && cible == ErrIntrouvable
      }
      ```
    blanks:
      - - Is
    answer: '`errors.Is` appelle cette méthode à chaque niveau.'
  - key: code-is-as
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide : " + e.Champ }

      e1 := fmt.Errorf("commande : %w", ErrIntrouvable)
      e2 := fmt.Errorf("inscription : %w", &ErrValidation{"email"})
      var ev *ErrValidation
      fmt.Println(errors.Is(e1, ErrIntrouvable), errors.As(e1, &ev), errors.As(e2, &ev), ev.Champ)
      ```
    choices:
      - {text: "`true false true email`", correct: true}
      - {text: "`true true true email`", correct: false}
      - {text: "`false false true email`", correct: false}
      - {text: "`true false false email`", correct: false}
    answer: '`true false true email` : chaque fonction reconnaît ce qu''elle cherche, à travers l''enveloppe.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide : \" + e.Champ }\n\nfunc main() {\n\te1 := fmt.Errorf(\"commande : %w\", ErrIntrouvable)\n\te2 := fmt.Errorf(\"inscription : %w\", &ErrValidation{\"email\"})\n\tvar ev *ErrValidation\n\tfmt.Println(errors.Is(e1, ErrIntrouvable), errors.As(e1, &ev), errors.As(e2, &ev), ev.Champ)\n}\n"
      output: true false true email
  - key: code-is-type
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide" }

      err := fmt.Errorf("x : %w", &ErrValidation{"email"})
      fmt.Println(errors.Is(err, &ErrValidation{"email"}))
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: '`false` : `errors.Is` compare des valeurs, et deux pointeurs distincts ne sont jamais égaux ; il faut `errors.As`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide\" }\n\nfunc main() {\n\terr := fmt.Errorf(\"x : %w\", &ErrValidation{\"email\"})\n\tfmt.Println(errors.Is(err, &ErrValidation{\"email\"}))\n}\n"
      output: 'false'
  - key: code-methode-is
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      type ErrHTTP struct{ Statut int }

      func (e *ErrHTTP) Error() string        { return fmt.Sprint("statut ", e.Statut) }
      func (e *ErrHTTP) Is(cible error) bool { return e.Statut == 404 && cible == ErrIntrouvable }

      fmt.Println(errors.Is(&ErrHTTP{404}, ErrIntrouvable), errors.Is(&ErrHTTP{500}, ErrIntrouvable))
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: '`true false` : la méthode `Is` personnalise la correspondance.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\n\ntype ErrHTTP struct{ Statut int }\n\n\nfunc (e *ErrHTTP) Error() string        { return fmt.Sprint(\"statut \", e.Statut) }\n\nfunc (e *ErrHTTP) Is(cible error) bool { return e.Statut == 404 && cible == ErrIntrouvable }\n\nfunc main() {\n\tfmt.Println(errors.Is(&ErrHTTP{404}, ErrIntrouvable), errors.Is(&ErrHTTP{500}, ErrIntrouvable))\n}\n"
      output: true false
  - key: bug-is-type
    format: bug-fix
    question: |-
      Les erreurs de validation ne sont jamais reconnues. Quelle correction est la bonne ?
      ```go
      if errors.Is(err, &ErrValidation{}) {
      	http.Error(w, "requête invalide", 400)
      }
      ```
    choices:
      - {text: "Chercher le type avec `errors.As` et une cible `var ev *ErrValidation`", correct: true}
      - {text: "Comparer avec `errors.Is(err, ErrValidation{})`, sans le pointeur", correct: false}
      - {text: "Tester le texte avec `strings.HasPrefix(err.Error(), \"invalide\")`", correct: false}
      - {text: "Tester `err == &ErrValidation{}`, qui compare les champs un à un", correct: false}
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, \"requête invalide : \"+ev.Champ, http.StatusBadRequest)\n}\n```\nOn cherche un type, pas une valeur : c'est `errors.As`."
  - key: bug-texte-timeout
    format: bug-fix
    question: |-
      La détection des délais casse après une mise à jour qui change les messages. Quelle correction est la bonne ?
      ```go
      if strings.Contains(err.Error(), "deadline exceeded") {
      	compterTimeout()
      }
      ```
    choices:
      - {text: "`errors.Is(err, context.DeadlineExceeded)`, l'identité stable de l'erreur", correct: true}
      - {text: "`strings.Contains(strings.ToLower(err.Error()), \"deadline\")`", correct: false}
      - {text: "`err == context.DeadlineExceeded`, plus rapide qu'une recherche", correct: false}
      - {text: "`errors.As(err, &context.DeadlineExceeded)`, qui extrait le délai", correct: false}
    answer: "```go\nif errors.Is(err, context.DeadlineExceeded) {\n\tcompterTimeout()\n}\n```\nLe texte d'une erreur est destiné aux humains et peut changer ; son identité est stable."
  - key: bug-assertion-enveloppe
    format: bug-fix
    question: |-
      Depuis qu'un middleware ajoute du contexte, les erreurs de quota ne sont plus reconnues. Quelle correction est la bonne ?
      ```go
      if eq, ok := err.(*ErrQuota); ok {
      	w.Header().Set("Retry-After", strconv.Itoa(eq.Secondes))
      }
      ```
    choices:
      - {text: "`errors.AsType[*ErrQuota](err)` (ou `errors.As`), qui parcourt la chaîne", correct: true}
      - {text: "`err.(ErrQuota)`, une assertion sur la valeur plutôt que sur le pointeur", correct: false}
      - {text: "`errors.Is(err, &ErrQuota{})`, qui reconnaît le type à travers l'enveloppe", correct: false}
      - {text: "Faire envelopper le middleware avec `%v`, pour garder le type `*ErrQuota`", correct: false}
    answer: "```go\nif eq, ok := errors.AsType[*ErrQuota](err); ok {\n\tw.Header().Set(\"Retry-After\", strconv.Itoa(eq.Secondes))\n}\n```\nL'assertion ne voit que le premier niveau ; `errors.AsType` (ou `errors.As`) parcourt la chaîne."
  - key: bug-cible-valeur
    format: bug-fix
    question: |-
      Ce code panique avec « errors: *target must be interface or implement error ». Quelle correction est la bonne ?
      ```go
      var champ string
      errors.As(err, &champ)
      ```
    choices:
      - {text: "Cibler un type d'erreur, `var ev *ErrValidation`, puis lire `ev.Champ`", correct: true}
      - {text: "Passer `champ` sans `&`, pour donner la valeur et non son adresse", correct: false}
      - {text: "Déclarer `var champ error`, puis lire le champ avec `champ.Champ`", correct: false}
      - {text: "Remplacer `errors.As` par `errors.Is(err, &champ)`, qui accepte tout", correct: false}
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\tchamp := ev.Champ\n\t_ = champ\n}\n```\nLa cible de `errors.As` doit désigner un type d'erreur (ou une interface), pas un type quelconque."
