notion: errors-is-as
cards:
  - key: errors-is-plutot
    format: course
    question: Pourquoi errors.Is plutôt que == ?
    answer: errors.Is parcourt toute la chaîne d'erreurs enveloppées.
  - key: errors-is-vs-errors-as
    format: course
    question: errors.Is vs errors.As ?
    answer: Tester l'identité à une valeur vs extraire une erreur d'un type donné.
  - key: apporte-errors-astype
    format: course
    question: Qu'apporte errors.AsType ?
    answer: Une version générique d'errors.As (Go 1.26), plus sûre et plus rapide.
  - key: tester-erreur-timeout
    format: course
    question: Comment tester qu'une erreur est un timeout ?
    answer: Avec une interface de comportement (Timeout() bool) testée par errors.As, ou errors.Is(err, context.DeadlineExceeded).
  - key: code-e1-errors-new-e2-fmt
    format: code-output
    question: |-
      ```go
      e1 := errors.New("a")
      e2 := fmt.Errorf("ctx: %w", e1)
      e3 := fmt.Errorf("ctx: %v", e1)
      fmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)
      ```
    answer: '`true false false` : seul `%w` conserve l''erreur dans la chaîne.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\te1 := errors.New(\"a\")\n\te2 := fmt.Errorf(\"ctx: %w\", e1)\n\te3 := fmt.Errorf(\"ctx: %v\", e1)\n\tfmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)\n}\n"
      output: true false false
  - key: terme-errors-is-as-astype-join
    format: course
    question: Que désigne « errors.Is / As / AsType / Join » ?
    answer: Inspection et combinaison des erreurs enveloppées
