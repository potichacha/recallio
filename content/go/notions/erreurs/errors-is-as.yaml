notion: errors-is-as
lesson: "Deux fonctions inspectent une **chaîne d'erreurs** (les erreurs enveloppées les unes dans les autres par `%w` ou\n`Unwrap`) :\n\n- **`errors.Is(err, cible)`** : vrai si une erreur de la chaîne **est** la cible, une **valeur** comme une sentinelle\n  (`io.EOF`, `ErrIntrouvable`) ;\n- **`errors.As(err, &cible)`** : vrai si une erreur de la chaîne est d'un **type** donné, et la range dans `cible`.\n\n```go\nif errors.Is(err, context.DeadlineExceeded) { ... } // une valeur\n\nvar pe *fs.PathError\nif errors.As(err, &pe) {                             // un type\n\tlog.Println(\"chemin :\", pe.Path)\n}\n\nif pe, ok := errors.AsType[*fs.PathError](err); ok { // Go 1.26, générique\n\tlog.Println(pe.Path)\n}\n```\n\n- Elles suivent `Unwrap() error` et `Unwrap() []error` (plusieurs `%w`, `errors.Join`) en profondeur.\n- Un type peut personnaliser la correspondance avec `Is(target error) bool` ou `As(target any) bool`.\n- `errors.As` exige une **cible non nil** : un pointeur vers une variable du type cherché ; sinon elle panique.\n- Pour un **timeout**, on teste `errors.Is(err, context.DeadlineExceeded)` ou, pour une erreur réseau,\n  `var ne net.Error; errors.As(err, &ne) && ne.Timeout()`.\n\n`==` et l'assertion de type ne regardent que l'erreur de **premier niveau** : ils échouent dès qu'un niveau a ajouté du\ncontexte.\n\n**Piège classique** : `errors.Is(err, &ErrValidation{})` pour chercher un type d'erreur. `Is` compare des valeurs : deux\npointeurs différents ne sont jamais égaux ; il faut `errors.As`.\n\n**En entretien** : « errors.Is pour une valeur (sentinelle), errors.As pour un type ; les deux parcourent la chaîne des\nUnwrap ; errors.AsType depuis 1.26 ; == et l'assertion ne voient que le premier niveau. »"
cards:
  - key: errors-is-plutot
    format: course
    question: Pourquoi errors.Is plutôt que == ?
    answer: errors.Is parcourt toute la chaîne d'erreurs enveloppées.
  - key: errors-is-vs-errors-as
    format: course
    question: errors.Is vs errors.As ?
    answer: Tester l'identité à une valeur vs extraire une erreur d'un type donné.
  - key: apporte-errors-astype
    format: course
    question: Qu'apporte errors.AsType ?
    answer: Une version générique d'errors.As (Go 1.26), plus sûre et plus rapide.
  - key: tester-erreur-timeout
    format: course
    question: Comment tester qu'une erreur est un timeout ?
    answer: Avec une interface de comportement (Timeout() bool) testée par errors.As, ou errors.Is(err, context.DeadlineExceeded).
  - key: code-e1-errors-new-e2-fmt
    format: code-output
    question: |-
      ```go
      e1 := errors.New("a")
      e2 := fmt.Errorf("ctx: %w", e1)
      e3 := fmt.Errorf("ctx: %v", e1)
      fmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)
      ```
    answer: '`true false false` : seul `%w` conserve l''erreur dans la chaîne.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\te1 := errors.New(\"a\")\n\te2 := fmt.Errorf(\"ctx: %w\", e1)\n\te3 := fmt.Errorf(\"ctx: %v\", e1)\n\tfmt.Println(errors.Is(e2, e1), errors.Is(e3, e1), e2 == e1)\n}\n"
      output: true false false
  - key: terme-errors-is-as-astype-join
    format: course
    question: Que désigne « errors.Is / As / AsType / Join » ?
    answer: Inspection et combinaison des erreurs enveloppées
  - key: vf-is-valeur
    format: true-false
    question: '`errors.Is` cherche une valeur précise dans la chaîne, `errors.As` un type.'
    truth: true
    answer: Une sentinelle avec Is, un type d'erreur avec As.
  - key: vf-profondeur
    format: true-false
    question: '`errors.Is` ne regarde que l''erreur et sa cause directe.'
    truth: false
    answer: Elle parcourt toute la chaîne, y compris les erreurs multiples de `errors.Join`.
  - key: vf-cible-nil
    format: true-false
    question: '`errors.As(err, nil)` renvoie simplement false.'
    truth: false
    answer: 'Elle panique : la cible doit être un pointeur non nil.'
  - key: vf-astype
    format: true-false
    question: '`errors.AsType[*fs.PathError](err)` renvoie l''erreur typée et un booléen, sans variable intermédiaire.'
    truth: true
    answer: Ajoutée en Go 1.26.
  - key: qcm-choisir
    format: multiple-choice
    question: Quelle fonction utiliser ?
    choices:
      - text: '`errors.Is` pour reconnaître `sql.ErrNoRows`'
        correct: true
      - text: '`errors.As` pour lire le champ `Path` d''un `*fs.PathError`'
        correct: true
      - text: '`errors.Is` pour récupérer un `*ErrValidation` et lire son champ'
        correct: false
      - text: '`errors.As` pour comparer à `io.EOF`'
        correct: false
    answer: Une valeur avec Is, un type avec As.
  - key: qcm-timeout
    format: multiple-choice
    question: Comment reconnaître un dépassement de délai ?
    choices:
      - text: '`errors.Is(err, context.DeadlineExceeded)`'
        correct: true
      - text: '`var ne net.Error; errors.As(err, &ne) && ne.Timeout()`'
        correct: true
      - text: '`strings.Contains(err.Error(), "timeout")`'
        correct: false
      - text: '`err == context.DeadlineExceeded` sur une erreur enveloppée'
        correct: false
    answer: On teste l'identité ou le type, jamais le texte.
  - key: qcm-personnaliser
    format: multiple-choice
    question: Comment un type d'erreur peut-il répondre vrai à `errors.Is(err, ErrIntrouvable)` ?
    choices:
      - text: En implémentant `Is(target error) bool` qui renvoie vrai pour `ErrIntrouvable`
        correct: true
      - text: En enveloppant `ErrIntrouvable` et en l'exposant par `Unwrap`
        correct: true
      - text: En ayant le même message que `ErrIntrouvable`
        correct: false
      - text: En étant déclaré dans le même package
        correct: false
    answer: Le texte ne compte jamais pour `errors.Is`.
  - key: qcm-premier-niveau
    format: multiple-choice
    question: Quelles comparaisons ne voient que l'erreur de premier niveau ?
    choices:
      - text: '`err == ErrIntrouvable`'
        correct: true
      - text: '`err.(*ErrValidation)`'
        correct: true
      - text: '`errors.Is(err, ErrIntrouvable)`'
        correct: false
      - text: '`errors.As(err, &ev)`'
        correct: false
    answer: Elles échouent dès qu'un niveau a ajouté du contexte.
  - key: trous-is
    format: fill-in
    question: "Complétez le test de délai :\n```go\nif errors.Is(err, context.___) {\n\treturn http.StatusGatewayTimeout\n}\n```"
    blanks:
      - - DeadlineExceeded
    answer: '`context.DeadlineExceeded` est la sentinelle des délais dépassés.'
  - key: trous-as
    format: fill-in
    question: "Complétez pour récupérer l'erreur réseau :\n```go\nvar ne net.Error\nif errors.___(err, &ne) && ne.Timeout() {\n\treessayer()\n}\n```"
    blanks:
      - - As
    answer: '`errors.As` accepte aussi une interface comme cible.'
  - key: trous-astype
    format: fill-in
    question: "Complétez la forme générique (Go 1.26) :\n```go\nif ev, ok := errors.___[*ErrValidation](err); ok {\n\tfmt.Println(ev.Champ)\n}\n```"
    blanks:
      - - AsType
    answer: '`errors.AsType` évite la variable cible.'
  - key: trous-methode-is
    format: fill-in
    question: "Complétez la méthode de correspondance :\n```go\nfunc (e *ErrHTTP) ___(cible error) bool {\n\treturn e.Statut == 404 && cible == ErrIntrouvable\n}\n```"
    blanks:
      - - Is
    answer: '`errors.Is` appelle cette méthode à chaque niveau.'
  - key: code-is-as
    format: code-output
    question: |-
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide : " + e.Champ }

      e1 := fmt.Errorf("commande : %w", ErrIntrouvable)
      e2 := fmt.Errorf("inscription : %w", &ErrValidation{"email"})
      var ev *ErrValidation
      fmt.Println(errors.Is(e1, ErrIntrouvable), errors.As(e1, &ev), errors.As(e2, &ev), ev.Champ)
      ```
    answer: '`true false true email` : chaque fonction reconnaît ce qu''elle cherche, à travers l''enveloppe.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide : \" + e.Champ }\n\nfunc main() {\n\te1 := fmt.Errorf(\"commande : %w\", ErrIntrouvable)\n\te2 := fmt.Errorf(\"inscription : %w\", &ErrValidation{\"email\"})\n\tvar ev *ErrValidation\n\tfmt.Println(errors.Is(e1, ErrIntrouvable), errors.As(e1, &ev), errors.As(e2, &ev), ev.Champ)\n}\n"
      output: true false true email
  - key: code-is-type
    format: code-output
    question: |-
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide" }

      err := fmt.Errorf("x : %w", &ErrValidation{"email"})
      fmt.Println(errors.Is(err, &ErrValidation{"email"}))
      ```
    answer: '`false` : `errors.Is` compare des valeurs, et deux pointeurs distincts ne sont jamais égaux ; il faut `errors.As`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide\" }\n\nfunc main() {\n\terr := fmt.Errorf(\"x : %w\", &ErrValidation{\"email\"})\n\tfmt.Println(errors.Is(err, &ErrValidation{\"email\"}))\n}\n"
      output: 'false'
  - key: code-methode-is
    format: code-output
    question: |-
      ```go
      var ErrIntrouvable = errors.New("introuvable")

      type ErrHTTP struct{ Statut int }

      func (e *ErrHTTP) Error() string        { return fmt.Sprint("statut ", e.Statut) }
      func (e *ErrHTTP) Is(cible error) bool { return e.Statut == 404 && cible == ErrIntrouvable }

      fmt.Println(errors.Is(&ErrHTTP{404}, ErrIntrouvable), errors.Is(&ErrHTTP{500}, ErrIntrouvable))
      ```
    answer: '`true false` : la méthode `Is` personnalise la correspondance.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrIntrouvable = errors.New(\"introuvable\")\n\n\ntype ErrHTTP struct{ Statut int }\n\n\nfunc (e *ErrHTTP) Error() string        { return fmt.Sprint(\"statut \", e.Statut) }\n\nfunc (e *ErrHTTP) Is(cible error) bool { return e.Statut == 404 && cible == ErrIntrouvable }\n\nfunc main() {\n\tfmt.Println(errors.Is(&ErrHTTP{404}, ErrIntrouvable), errors.Is(&ErrHTTP{500}, ErrIntrouvable))\n}\n"
      output: true false
  - key: bug-is-type
    format: bug-fix
    question: "Les erreurs de validation ne sont jamais reconnues :\n```go\nif errors.Is(err, &ErrValidation{}) {\n\thttp.Error(w, \"requête invalide\", 400)\n}\n```"
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, \"requête invalide : \"+ev.Champ, http.StatusBadRequest)\n}\n```\nOn cherche un type, pas une valeur : c'est `errors.As`."
  - key: bug-texte-timeout
    format: bug-fix
    question: "La détection des délais casse après une mise à jour qui change les messages :\n```go\nif strings.Contains(err.Error(), \"deadline exceeded\") {\n\tcompterTimeout()\n}\n```"
    answer: "```go\nif errors.Is(err, context.DeadlineExceeded) {\n\tcompterTimeout()\n}\n```\nLe texte d'une erreur est destiné aux humains et peut changer ; son identité est stable."
  - key: bug-assertion-enveloppe
    format: bug-fix
    question: "Depuis qu'un middleware ajoute du contexte, les erreurs de quota ne sont plus reconnues :\n```go\nif eq, ok := err.(*ErrQuota); ok {\n\tw.Header().Set(\"Retry-After\", strconv.Itoa(eq.Secondes))\n}\n```"
    answer: "```go\nif eq, ok := errors.AsType[*ErrQuota](err); ok {\n\tw.Header().Set(\"Retry-After\", strconv.Itoa(eq.Secondes))\n}\n```\nL'assertion ne voit que le premier niveau ; `errors.AsType` (ou `errors.As`) parcourt la chaîne."
  - key: bug-cible-valeur
    format: bug-fix
    question: |-
      Ce code panique avec « errors: *target must be interface or implement error » :
      ```go
      var champ string
      errors.As(err, &champ)
      ```
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\tchamp := ev.Champ\n\t_ = champ\n}\n```\nLa cible de `errors.As` doit désigner un type d'erreur (ou une interface), pas un type quelconque."
