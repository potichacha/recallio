notion: wrapping
lesson: "**Envelopper** (wrap) une erreur, c'est lui ajouter du contexte en gardant l'erreur d'origine accessible :\n\n```go\nif err != nil {\n\treturn fmt.Errorf(\"chargement de la configuration %s : %w\", chemin, err)\n}\n```\n\n- **`%w`** enveloppe : l'erreur résultante a une méthode `Unwrap` qui renvoie l'originale, et `errors.Is` /\n  `errors.As` la retrouvent.\n- **`%v`** (ou `%s`) ne fait que **copier le texte** : la chaîne est coupée, l'appelant ne peut plus tester la cause.\n- Depuis Go 1.20, un `fmt.Errorf` peut contenir **plusieurs `%w`** (et `errors.Join` combine des erreurs).\n- Chaque niveau ajoute **ce qu'il sait** (le fichier, l'identifiant, l'étape), ce qui donne un message lisible de haut\n  en bas : `traitement de la commande 42 : réservation du stock : connexion refusée`.\n\nChoisir `%w` ou `%v` est une **décision d'API** : avec `%w`, la cause devient testable par les appelants, donc un\nengagement. On utilise `%v` pour **ne pas exposer** une erreur d'implémentation (le pilote SQL d'une couche\nd'infrastructure) et l'on traduit plutôt en erreur du domaine.\n\nGo n'ajoute **pas de pile d'appels** aux erreurs : le contexte des messages en tient lieu.\n\n**Piège classique** : ajouter un contexte vague (`fmt.Errorf(\"erreur : %w\", err)`) à chaque niveau ; le message s'allonge\nsans rien dire de plus. Chaque niveau doit dire **ce qu'il faisait**.\n\n**En entretien** : « fmt.Errorf avec %w ajoute du contexte et garde la cause pour errors.Is et As ; %v coupe la chaîne ;\nchaque niveau dit ce qu'il faisait ; %w est un engagement d'API. »"
cards:
  - key: w-vs-v-fmt-errorf
    format: course
    question: '%w vs %v dans fmt.Errorf ?'
    answer: '%w enveloppe et garde l''erreur inspectable par errors.Is/As ; %v ne garde que le texte.'
  - key: envelopper-erreur-dependance-avec-w-inconvenient
    format: course
    question: Envelopper une erreur de dépendance avec %w a-t-il un inconvénient ?
    answer: Elle devient partie de votre API publique ; traduire en sentinelle propre si on veut l'isoler.
  - key: terme-w
    format: course
    question: Que désigne « %w » ?
    answer: Verbe de fmt.Errorf qui enveloppe une erreur
  - key: engagement
    format: course
    question: Pourquoi choisir `%w` est-il un engagement d'API ?
    answer: 'Parce que la cause devient testable par les appelants : la remplacer plus tard (changer de pilote, de bibliothèque) casserait leur code.'
  - key: plusieurs-w
    format: course
    question: Peut-on envelopper plusieurs erreurs dans un seul `fmt.Errorf` ?
    answer: 'Oui, depuis Go 1.20 : plusieurs `%w` sont permis, et `errors.Is` retrouve chacune.'
  - key: vf-v
    format: true-false
    question: '`fmt.Errorf("lecture : %v", err)` permet à `errors.Is` de retrouver `err`.'
    truth: false
    answer: '`%v` ne copie que le texte ; seul `%w` garde la chaîne.'
  - key: vf-pile
    format: true-false
    question: Les erreurs de Go enregistrent automatiquement la pile d'appels.
    truth: false
    answer: Non ; le contexte ajouté à chaque niveau en tient lieu (des bibliothèques tierces en ajoutent si besoin).
  - key: vf-unwrap
    format: true-false
    question: Une erreur créée par `fmt.Errorf` avec `%w` a une méthode `Unwrap`.
    truth: true
    answer: Elle renvoie l'erreur enveloppée (ou `Unwrap() []error` avec plusieurs `%w`).
  - key: vf-contexte
    format: true-false
    question: Chaque niveau qui remonte une erreur devrait y ajouter ce qu'il était en train de faire.
    truth: true
    answer: Le message final raconte alors l'enchaînement, sans pile d'appels.
  - key: qcm-garder
    format: multiple-choice
    question: Quelles écritures permettent à `errors.Is(e, io.EOF)` d'être vrai ?
    choices:
      - text: '`e := fmt.Errorf("lecture : %w", io.EOF)`'
        correct: true
      - text: '`e := fmt.Errorf("a : %w, b : %w", io.EOF, autre)`'
        correct: true
      - text: '`e := fmt.Errorf("lecture : %v", io.EOF)`'
        correct: false
      - text: '`e := errors.New("lecture : " + io.EOF.Error())`'
        correct: false
    answer: Le texte seul ne garde pas la valeur.
  - key: qcm-message
    format: multiple-choice
    question: Quel contexte est le plus utile ?
    choices:
      - text: '`fmt.Errorf("réservation du stock pour %s : %w", ref, err)`'
        correct: true
      - text: '`fmt.Errorf("erreur : %w", err)`'
        correct: false
      - text: '`fmt.Errorf("échec : %w", err)`'
        correct: false
      - text: '`fmt.Errorf("%w", err)`'
        correct: false
    answer: Le contexte dit ce que faisait ce niveau, avec les données utiles.
  - key: qcm-v-justifie
    format: multiple-choice
    question: Quand préférer `%v` à `%w` ?
    choices:
      - text: Pour ne pas exposer une erreur d'implémentation aux appelants
        correct: true
      - text: Quand on traduit l'erreur en une erreur du domaine
        correct: true
      - text: Toujours, `%w` est déprécié
        correct: false
      - text: Pour que errors.Is fonctionne
        correct: false
    answer: '`%v` coupe volontairement la chaîne.'
  - key: qcm-message-final
    format: multiple-choice
    question: 'Que contient le message de `fmt.Errorf("commande %d : %w", 42, fmt.Errorf("stock : %w", ErrRupture))` si `ErrRupture` vaut « rupture » ?'
    choices:
      - text: '`commande 42 : stock : rupture`'
        correct: true
      - text: '`rupture`'
        correct: false
      - text: '`commande 42 : %w`'
        correct: false
      - text: '`stock : rupture : commande 42`'
        correct: false
    answer: Les contextes s'empilent de l'extérieur vers la cause.
  - key: trous-w
    format: fill-in
    question: |-
      Complétez pour garder la cause testable :
      ```go
      return fmt.Errorf("envoi du courriel à %s : ___", dest, err)
      ```
    blanks:
      - - '%w'
    answer: '`%w` enveloppe.'
  - key: trous-v
    format: fill-in
    question: |-
      Complétez pour ne garder que le texte de l'erreur du pilote :
      ```go
      return fmt.Errorf("enregistrement impossible : ___", err)
      ```
    blanks:
      - - '%v'
        - '%s'
    answer: '`%v` coupe la chaîne : l''appelant ne dépend plus du pilote.'
  - key: trous-unwrap
    format: fill-in
    question: |-
      Complétez pour obtenir l'erreur enveloppée :
      ```go
      cause := errors.___(err)
      ```
    blanks:
      - - Unwrap
    answer: '`errors.Unwrap` renvoie l''erreur de niveau inférieur (pour un seul `%w`).'
  - key: trous-errorf
    format: fill-in
    question: |-
      Complétez la fonction d'enveloppe :
      ```go
      return fmt.___("lecture de %s : %w", chemin, err)
      ```
    blanks:
      - - Errorf
    answer: '`fmt.Errorf` formate et enveloppe.'
  - key: code-chaine
    format: code-output
    question: |-
      ```go
      var ErrRupture = errors.New("rupture")

      e1 := fmt.Errorf("stock : %w", ErrRupture)
      e2 := fmt.Errorf("commande %d : %w", 42, e1)
      fmt.Println(e2)
      fmt.Println(errors.Is(e2, ErrRupture), errors.Unwrap(e2) == e1)
      ```
    answer: '`commande 42 : stock : rupture` puis `true true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrRupture = errors.New(\"rupture\")\n\nfunc main() {\n\te1 := fmt.Errorf(\"stock : %w\", ErrRupture)\n\te2 := fmt.Errorf(\"commande %d : %w\", 42, e1)\n\tfmt.Println(e2)\n\tfmt.Println(errors.Is(e2, ErrRupture), errors.Unwrap(e2) == e1)\n}\n"
      output: |-
        commande 42 : stock : rupture
        true true
  - key: code-v
    format: code-output
    question: |-
      ```go
      e := fmt.Errorf("lecture : %v", io.EOF)
      fmt.Println(e, errors.Is(e, io.EOF), errors.Unwrap(e) == nil)
      ```
    answer: '`lecture : EOF false true` : avec `%v`, le message est le même mais la chaîne est coupée.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io\"\n)\n\nfunc main() {\n\te := fmt.Errorf(\"lecture : %v\", io.EOF)\n\tfmt.Println(e, errors.Is(e, io.EOF), errors.Unwrap(e) == nil)\n}\n"
      output: 'lecture : EOF false true'
  - key: code-deux-w
    format: code-output
    question: |-
      ```go
      var A = errors.New("a")
      var B = errors.New("b")

      e := fmt.Errorf("%w puis %w", A, B)
      fmt.Println(e, errors.Is(e, A), errors.Is(e, B), errors.Unwrap(e) == nil)
      ```
    answer: '`a puis b true true true` : avec deux `%w`, `errors.Is` voit les deux, mais `errors.Unwrap` (une seule erreur) renvoie nil.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar A = errors.New(\"a\")\n\nvar B = errors.New(\"b\")\n\nfunc main() {\n\te := fmt.Errorf(\"%w puis %w\", A, B)\n\tfmt.Println(e, errors.Is(e, A), errors.Is(e, B), errors.Unwrap(e) == nil)\n}\n"
      output: a puis b true true true
  - key: bug-v
    format: bug-fix
    question: |-
      Le handler ne reconnaît plus `ErrIntrouvable` depuis une refonte du service :
      ```go
      return fmt.Errorf("lecture de la commande %d : %v", id, err)
      ```
    answer: |-
      ```go
      return fmt.Errorf("lecture de la commande %d : %w", id, err)
      ```
      `%v` coupait la chaîne ; `%w` garde la sentinelle testable par `errors.Is`.
  - key: bug-contexte-vide
    format: bug-fix
    question: |-
      Les logs affichent « erreur : erreur : erreur : délai dépassé » :
      ```go
      return fmt.Errorf("erreur : %w", err)
      ```
    answer: |-
      ```go
      return fmt.Errorf("appel du service de paiement pour la commande %d : %w", id, err)
      ```
      Chaque niveau doit dire ce qu'il faisait, avec les données utiles, au lieu d'un mot vide.
  - key: bug-fuite
    format: bug-fix
    question: "Le package `domaine` expose sans le vouloir les erreurs du pilote PostgreSQL, et les handlers testent `pgconn.PgError` :\n```go\nif err != nil {\n\treturn fmt.Errorf(\"sauvegarde : %w\", err)\n}\n```"
    answer: "```go\nvar pgErr *pgconn.PgError\nif errors.As(err, &pgErr) && pgErr.Code == \"23505\" {\n\treturn ErrDejaExistant\n}\nif err != nil {\n\treturn fmt.Errorf(\"sauvegarde : %v\", err)\n}\n```\nL'infrastructure traduit les erreurs qui comptent en erreurs du domaine, et ne fait pas fuiter le reste (`%v`)."
  - key: bug-texte
    format: bug-fix
    question: Le test `strings.Contains(err.Error(), "introuvable")` casse dès qu'on change un message. Que faire ?
    answer: |-
      ```go
      var ErrIntrouvable = errors.New("introuvable")
      // côté service : return fmt.Errorf("commande %d : %w", id, ErrIntrouvable)
      // côté test :
      if !errors.Is(err, ErrIntrouvable) { t.Fatal(err) }
      ```
      On teste l'identité de l'erreur (sentinelle ou type), jamais son texte, qui est destiné aux humains.
  - key: scenario-couches
    format: scenario
    question: Comment enveloppes-tu les erreurs entre les couches base de données, métier et HTTP ?
    answer: |-
      La couche base de données traduit ce qui a un sens métier (`sql.ErrNoRows` devient `ErrIntrouvable`, une violation
      d'unicité `ErrDejaExistant`) et enveloppe le reste avec `%v` ou `%w` selon ce qu'elle veut exposer. La couche
      métier ajoute son contexte (`réservation de la commande 42 : %w`). La couche HTTP est la seule à traiter : elle
      teste les erreurs du domaine avec `errors.Is` et `errors.As` pour choisir le statut, journalise l'erreur complète
      une seule fois, et renvoie au client un message sûr sans détails internes.
  - key: scenario-pile
    format: scenario
    question: Un collègue regrette que les erreurs Go n'aient pas de pile d'appels. Que proposes-tu ?
    answer: |-
      D'abord, un contexte riche à chaque niveau donne souvent un message plus utile qu'une pile : il dit ce que le
      programme faisait et avec quelles données. Si une pile est vraiment nécessaire (une erreur inattendue en
      production), on la capture à la frontière : un middleware qui journalise avec `runtime/debug.Stack()` lors d'une
      panique, ou un outil comme Sentry. Ajouter une pile à chaque erreur alourdit tout pour peu de gain.
  - key: scenario-decision
    format: scenario
    question: Tu écris une bibliothèque cliente pour une API. Exposes-tu les erreurs du package net/http avec `%w` ?
    answer: |-
      J'expose ce que l'appelant doit pouvoir tester, sous la forme d'erreurs de ma bibliothèque : `ErrNonAutorise`,
      `ErrLimiteAtteinte`, ou un type `*ErrAPI{Statut, Code}`. Pour les erreurs réseau, enveloppées avec `%w`, les
      appelants peuvent tester `context.DeadlineExceeded` ou `net.Error`, ce qui est utile et stable. Je documente ces
      erreurs dans l'API, puisque `%w` en fait un engagement.
  - key: code-niveaux
    format: code-output
    question: "```go\nlire := func() error { return fs.ErrPermission }\ncharger := func() error {\n\tif err := lire(); err != nil {\n\t\treturn fmt.Errorf(\"lecture de config.json : %w\", err)\n\t}\n\treturn nil\n}\n\nerr := charger()\nfmt.Println(err)\nfmt.Println(errors.Is(err, fs.ErrPermission))\n```"
    answer: '`lecture de config.json : permission denied` puis `true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n)\n\nfunc main() {\n\tlire := func() error { return fs.ErrPermission }\n\tcharger := func() error {\n\t\tif err := lire(); err != nil {\n\t\t\treturn fmt.Errorf(\"lecture de config.json : %w\", err)\n\t\t}\n\t\treturn nil\n\t}\n\n\terr := charger()\n\tfmt.Println(err)\n\tfmt.Println(errors.Is(err, fs.ErrPermission))\n}\n"
      output: |-
        lecture de config.json : permission denied
        true
  - key: scenario-message
    format: scenario
    question: 'Un utilisateur te montre le message « open config.json: no such file or directory ». Que manque-t-il, et comment l''améliorer ?'
    answer: |-
      Le message dit ce qui a échoué au plus bas niveau, mais pas pourquoi le programme lisait ce fichier ni ce qu'il
      faut faire. J'ajoute du contexte au niveau qui sait : `chargement de la configuration (option -config) : open
      config.json: no such file or directory`. Pour une erreur adressée à un utilisateur final, la frontière (la CLI, le
      handler) peut aussi traduire en conseil : « fichier de configuration introuvable, utilisez -config ».
