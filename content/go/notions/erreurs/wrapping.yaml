notion: wrapping
cards:
  - key: w-vs-v-fmt-errorf
    format: course
    question: '%w vs %v dans fmt.Errorf ?'
    answer: '%w enveloppe et garde l''erreur inspectable par errors.Is/As ; %v ne garde que le texte.'
  - key: envelopper-erreur-dependance-avec-w-inconvenient
    format: course
    question: Envelopper une erreur de dépendance avec %w a-t-il un inconvénient ?
    answer: Elle devient partie de votre API publique ; traduire en sentinelle propre si on veut l'isoler.
  - key: terme-w
    format: course
    question: Que désigne « %w » ?
    answer: Verbe de fmt.Errorf qui enveloppe une erreur
