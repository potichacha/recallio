notion: wrapping
lesson: "**Envelopper** (wrap) une erreur, c'est lui ajouter du contexte en gardant l'erreur d'origine accessible :\n\n```go\nif err != nil {\n\treturn fmt.Errorf(\"chargement de la configuration %s : %w\", chemin, err)\n}\n```\n\n- **`%w`** enveloppe : l'erreur résultante a une méthode `Unwrap` qui renvoie l'originale, et `errors.Is` /\n  `errors.As` la retrouvent.\n- **`%v`** (ou `%s`) ne fait que **copier le texte** : la chaîne est coupée, l'appelant ne peut plus tester la cause.\n- Depuis Go 1.20, un `fmt.Errorf` peut contenir **plusieurs `%w`** (et `errors.Join` combine des erreurs).\n- Chaque niveau ajoute **ce qu'il sait** (le fichier, l'identifiant, l'étape), ce qui donne un message lisible de haut\n  en bas : `traitement de la commande 42 : réservation du stock : connexion refusée`.\n\nChoisir `%w` ou `%v` est une **décision d'API** : avec `%w`, la cause devient testable par les appelants, donc un\nengagement. On utilise `%v` pour **ne pas exposer** une erreur d'implémentation (le pilote SQL d'une couche\nd'infrastructure) et l'on traduit plutôt en erreur du domaine.\n\nGo n'ajoute **pas de pile d'appels** aux erreurs : le contexte des messages en tient lieu.\n\n**Piège classique** : ajouter un contexte vague (`fmt.Errorf(\"erreur : %w\", err)`) à chaque niveau ; le message s'allonge\nsans rien dire de plus. Chaque niveau doit dire **ce qu'il faisait**.\n\n**En entretien** : « fmt.Errorf avec %w ajoute du contexte et garde la cause pour errors.Is et As ; %v coupe la chaîne ;\nchaque niveau dit ce qu'il faisait ; %w est un engagement d'API. »"
cards:
  - key: w-vs-v-fmt-errorf
    format: course
    question: "Quelle différence entre `%w` et `%v` dans `fmt.Errorf` ?"
    choices:
      - {text: "`%w` enveloppe l'erreur, inspectable par `errors.Is` et `As` ; `%v` ne garde que son texte", correct: true}
      - {text: "`%v` enveloppe l'erreur, inspectable par `errors.Is` et `As` ; `%w` ne garde que son texte", correct: false}
      - {text: "Aucune : les deux gardent la cause, `%w` est seulement plus récent", correct: false}
      - {text: "`%w` ajoute la pile d'appels au message, `%v` seulement le texte", correct: false}
    answer: "`%w` enveloppe : la cause reste accessible à `errors.Is` et `errors.As`. `%v` ne copie que le texte : le message est le même, mais la chaîne est coupée."
  - key: envelopper-erreur-dependance-avec-w-inconvenient
    format: course
    question: "Envelopper une erreur de dépendance avec `%w` a-t-il un inconvénient ?"
    choices:
      - {text: "Oui : elle entre dans ton API publique, et les appelants peuvent en dépendre", correct: true}
      - {text: "Oui : `%w` rend le message illisible, en y ajoutant le type de la dépendance", correct: false}
      - {text: "Non : la cause enveloppée reste invisible hors du package", correct: false}
      - {text: "Non : `%w` copie l'erreur, qui ne dépend plus de la bibliothèque", correct: false}
    answer: "L'erreur de la dépendance devient testable par tes appelants, donc partie de ton API publique ; pour l'isoler, on la traduit en sentinelle propre, ou on utilise `%v`."
  - key: terme-w
    format: course
    question: "Que fait le verbe `%w` dans `fmt.Errorf` ?"
    choices:
      - {text: "Il enveloppe une erreur, en gardant la cause accessible à `errors.Is`", correct: true}
      - {text: "Il affiche la valeur d'une erreur, comme `%v`, sans la garder", correct: false}
      - {text: "Il affiche une erreur entre guillemets, comme `%q` pour une chaîne", correct: false}
      - {text: "Il ajoute la pile d'appels à la fin du message de l'erreur", correct: false}
    answer: "`%w` enveloppe une erreur : le message l'inclut, et `errors.Is`, `errors.As` et `errors.Unwrap` la retrouvent."
  - key: engagement
    format: course
    question: Pourquoi choisir `%w` est-il un engagement d'API ?
    choices:
      - {text: "La cause devient testable par les appelants : la changer plus tard casserait leur code", correct: true}
      - {text: "`%w` fige le message, qu'on ne peut plus modifier sans casser les logs", correct: false}
      - {text: "`%w` oblige à exporter le type de la cause depuis le package", correct: false}
      - {text: "`%w` rend l'erreur comparable avec `==`, une propriété à garder", correct: false}
    answer: 'Parce que la cause devient testable par les appelants : la remplacer plus tard (changer de pilote, de bibliothèque) casserait leur code.'
  - key: plusieurs-w
    format: course
    question: Peut-on envelopper plusieurs erreurs dans un seul `fmt.Errorf` ?
    choices:
      - {text: "Oui, depuis Go 1.20 : plusieurs `%w`, et `errors.Is` retrouve chacune", correct: true}
      - {text: "Non : il faut passer par `errors.Join`, seul à en garder plusieurs", correct: false}
      - {text: "Oui, mais `errors.Is` ne retrouve que la dernière enveloppée", correct: false}
      - {text: "Non : un second `%w` est traité comme `%v`, quelle que soit la version", correct: false}
    answer: 'Oui, depuis Go 1.20 : plusieurs `%w` sont permis, et `errors.Is` retrouve chacune.'
  - key: vf-v
    format: true-false
    question: '`fmt.Errorf("lecture : %v", err)` permet à `errors.Is` de retrouver `err`.'
    truth: false
    answer: '`%v` ne copie que le texte ; seul `%w` garde la chaîne.'
  - key: vf-pile
    format: true-false
    question: Les erreurs de Go enregistrent automatiquement la pile d'appels.
    truth: false
    answer: Non ; le contexte ajouté à chaque niveau en tient lieu (des bibliothèques tierces en ajoutent si besoin).
  - key: vf-unwrap
    format: true-false
    question: Une erreur créée par `fmt.Errorf` avec `%w` a une méthode `Unwrap`.
    truth: true
    answer: Elle renvoie l'erreur enveloppée (ou `Unwrap() []error` avec plusieurs `%w`).
  - key: vf-contexte
    format: true-false
    question: Chaque niveau qui remonte une erreur devrait y ajouter ce qu'il était en train de faire.
    truth: true
    answer: Le message final raconte alors l'enchaînement, sans pile d'appels.
  - key: qcm-garder
    format: multiple-choice
    question: "Quelle écriture permet à `errors.Is(e, io.EOF)` d'être vrai ?"
    choices:
      - {text: "`e := fmt.Errorf(\"lecture : %w\", io.EOF)`", correct: true}
      - {text: "`e := fmt.Errorf(\"lecture : %v\", io.EOF)`", correct: false}
      - {text: "`e := errors.New(\"lecture : \" + io.EOF.Error())`", correct: false}
      - {text: "`e := fmt.Errorf(\"lecture : %s\", io.EOF)`", correct: false}
    answer: "Seul `%w` garde la valeur dans la chaîne (deux `%w` aussi, depuis Go 1.20) ; `%v`, `%s` ou la concaténation ne gardent que le texte."
  - key: qcm-message
    format: multiple-choice
    question: "Quel message ajoute le contexte le plus utile en remontant une erreur ?"
    choices:
      - {text: "`fmt.Errorf(\"réservation du stock pour %s : %w\", ref, err)`", correct: true}
      - {text: "`fmt.Errorf(\"erreur lors de l'opération : %w\", err)`", correct: false}
      - {text: "`fmt.Errorf(\"échec de la fonction, voir la cause : %w\", err)`", correct: false}
      - {text: "`fmt.Errorf(\"une erreur est survenue : %w\", err)`", correct: false}
    answer: Le contexte dit ce que faisait ce niveau, avec les données utiles.
  - key: qcm-v-justifie
    format: multiple-choice
    question: Quand préférer `%v` à `%w` ?
    choices:
      - {text: "Pour ne pas exposer aux appelants une erreur d'implémentation, comme celle du pilote", correct: true}
      - {text: "Toujours, `%w` étant déprécié depuis l'arrivée de `errors.Join`", correct: false}
      - {text: "Pour que `errors.Is` retrouve la cause à travers l'enveloppe", correct: false}
      - {text: "Pour obtenir un message plus court que celui que donne `%w`", correct: false}
    answer: "`%v` coupe volontairement la chaîne : l'appelant ne peut plus dépendre de l'erreur d'implémentation, par exemple quand on la traduit en erreur du domaine. Le message, lui, est le même qu'avec `%w`."
  - key: qcm-message-final
    format: multiple-choice
    question: 'Que contient le message de `fmt.Errorf("commande %d : %w", 42, fmt.Errorf("stock : %w", ErrRupture))` si `ErrRupture` vaut « rupture » ?'
    choices:
      - text: '`commande 42 : stock : rupture`'
        correct: true
      - text: '`rupture`'
        correct: false
      - text: '`commande 42 : %w`'
        correct: false
      - text: '`stock : rupture : commande 42`'
        correct: false
    answer: Les contextes s'empilent de l'extérieur vers la cause.
  - key: trous-w
    format: fill-in
    question: |-
      Complète pour garder la cause testable :
      ```go
      return fmt.Errorf("envoi du courriel à %s : ___", dest, err)
      ```
    blanks:
      - - '%w'
    answer: '`%w` enveloppe.'
  - key: trous-v
    format: fill-in
    question: |-
      Complète pour ne garder que le texte de l'erreur du pilote :
      ```go
      return fmt.Errorf("enregistrement impossible : ___", err)
      ```
    blanks:
      - - '%v'
        - '%s'
    answer: '`%v` coupe la chaîne : l''appelant ne dépend plus du pilote.'
  - key: trous-unwrap
    format: fill-in
    question: |-
      Complète pour obtenir l'erreur enveloppée :
      ```go
      cause := errors.___(err)
      ```
    blanks:
      - - Unwrap
    answer: '`errors.Unwrap` renvoie l''erreur de niveau inférieur (pour un seul `%w`).'
  - key: trous-errorf
    format: fill-in
    question: |-
      Complète la fonction d'enveloppe :
      ```go
      return fmt.___("lecture de %s : %w", chemin, err)
      ```
    blanks:
      - - Errorf
    answer: '`fmt.Errorf` formate et enveloppe.'
  - key: code-chaine
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var ErrRupture = errors.New("rupture")

      e1 := fmt.Errorf("stock : %w", ErrRupture)
      e2 := fmt.Errorf("commande %d : %w", 42, e1)
      fmt.Println(e2)
      fmt.Println(errors.Is(e2, ErrRupture), errors.Unwrap(e2) == e1)
      ```
    choices:
      - text: |-
          ```
          commande 42 : stock : rupture
          true true
          ```
        correct: true
      - text: |-
          ```
          commande 42 : rupture
          true true
          ```
        correct: false
      - text: |-
          ```
          commande 42 : stock : rupture
          true false
          ```
        correct: false
      - text: |-
          ```
          commande 42 : stock : rupture
          false true
          ```
        correct: false
    answer: '`commande 42 : stock : rupture` puis `true true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar ErrRupture = errors.New(\"rupture\")\n\nfunc main() {\n\te1 := fmt.Errorf(\"stock : %w\", ErrRupture)\n\te2 := fmt.Errorf(\"commande %d : %w\", 42, e1)\n\tfmt.Println(e2)\n\tfmt.Println(errors.Is(e2, ErrRupture), errors.Unwrap(e2) == e1)\n}\n"
      output: |-
        commande 42 : stock : rupture
        true true
  - key: code-v
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      e := fmt.Errorf("lecture : %v", io.EOF)
      fmt.Println(e, errors.Is(e, io.EOF), errors.Unwrap(e) == nil)
      ```
    choices:
      - {text: "`lecture : EOF false true`", correct: true}
      - {text: "`lecture : EOF true false`", correct: false}
      - {text: "`lecture : EOF true true`", correct: false}
      - {text: "`lecture : EOF false false`", correct: false}
    answer: '`lecture : EOF false true` : avec `%v`, le message est le même mais la chaîne est coupée.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io\"\n)\n\nfunc main() {\n\te := fmt.Errorf(\"lecture : %v\", io.EOF)\n\tfmt.Println(e, errors.Is(e, io.EOF), errors.Unwrap(e) == nil)\n}\n"
      output: 'lecture : EOF false true'
  - key: code-deux-w
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var A = errors.New("a")
      var B = errors.New("b")

      e := fmt.Errorf("%w puis %w", A, B)
      fmt.Println(e, errors.Is(e, A), errors.Is(e, B), errors.Unwrap(e) == nil)
      ```
    choices:
      - {text: "`a puis b true true true`", correct: true}
      - {text: "`a puis b true true false`", correct: false}
      - {text: "`a puis b true false true`", correct: false}
      - {text: "`a puis b true false false`", correct: false}
    answer: '`a puis b true true true` : avec deux `%w`, `errors.Is` voit les deux, mais `errors.Unwrap` (une seule erreur) renvoie nil.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nvar A = errors.New(\"a\")\n\nvar B = errors.New(\"b\")\n\nfunc main() {\n\te := fmt.Errorf(\"%w puis %w\", A, B)\n\tfmt.Println(e, errors.Is(e, A), errors.Is(e, B), errors.Unwrap(e) == nil)\n}\n"
      output: a puis b true true true
  - key: bug-v
    format: bug-fix
    question: |-
      Le handler ne reconnaît plus `ErrIntrouvable` depuis une refonte du service. Quelle correction est la bonne ?
      ```go
      return fmt.Errorf("lecture de la commande %d : %v", id, err)
      ```
    choices:
      - {text: "Envelopper avec `%w` au lieu de `%v`, pour garder la sentinelle dans la chaîne", correct: true}
      - {text: "Envelopper avec `%s` au lieu de `%v`, pour garder le texte exact de la cause", correct: false}
      - {text: "Faire comparer le handler avec `err == ErrIntrouvable`, plus direct", correct: false}
      - {text: "Faire chercher « introuvable » dans `err.Error()` par le handler", correct: false}
    answer: |-
      ```go
      return fmt.Errorf("lecture de la commande %d : %w", id, err)
      ```
      `%v` coupait la chaîne ; `%w` garde la sentinelle testable par `errors.Is`.
  - key: bug-contexte-vide
    format: bug-fix
    question: |-
      Les logs affichent « erreur : erreur : erreur : délai dépassé ». Quelle correction est la bonne ?
      ```go
      return fmt.Errorf("erreur : %w", err)
      ```
    choices:
      - {text: "Dire ce que faisait ce niveau, avec ses données : « appel du service de paiement pour la commande 42 »", correct: true}
      - {text: "Remonter `err` sans l'envelopper, à tous les niveaux, pour éviter la répétition", correct: false}
      - {text: "Remplacer `%w` par `%v`, pour que le préfixe n'apparaisse qu'une seule fois", correct: false}
      - {text: "Ajouter la date et l'heure au préfixe « erreur », pour distinguer les niveaux", correct: false}
    answer: |-
      ```go
      return fmt.Errorf("appel du service de paiement pour la commande %d : %w", id, err)
      ```
      Chaque niveau doit dire ce qu'il faisait, avec les données utiles, au lieu d'un mot vide.
  - key: bug-fuite
    format: bug-fix
    question: |-
      Le package `domaine` expose sans le vouloir les erreurs du pilote PostgreSQL, et les handlers testent `pgconn.PgError`. Quelle correction est la bonne ?
      ```go
      if err != nil {
      	return fmt.Errorf("sauvegarde : %w", err)
      }
      ```
    choices:
      - {text: "Traduire les erreurs utiles (le doublon) en erreurs du domaine, et envelopper le reste avec `%v`", correct: true}
      - {text: "Garder `%w`, et documenter que les handlers doivent connaître le pilote `pgconn`", correct: false}
      - {text: "Remplacer `%w` par `%v` partout, y compris pour le doublon que le handler doit signaler", correct: false}
      - {text: "Faire paniquer `domaine` sur toute erreur du pilote, et la rattraper dans le handler", correct: false}
    answer: "```go\nvar pgErr *pgconn.PgError\nif errors.As(err, &pgErr) && pgErr.Code == \"23505\" {\n\treturn ErrDejaExistant\n}\nif err != nil {\n\treturn fmt.Errorf(\"sauvegarde : %v\", err)\n}\n```\nL'infrastructure traduit les erreurs qui comptent en erreurs du domaine, et ne fait pas fuiter le reste (`%v`)."
  - key: bug-texte
    format: bug-fix
    question: Le test `strings.Contains(err.Error(), "introuvable")` casse dès qu'on change un message. Que faire ?
    choices:
      - {text: "Une sentinelle `ErrIntrouvable` enveloppée avec `%w`, testée par `errors.Is`", correct: true}
      - {text: "Une constante pour le message, partagée entre le service et le test", correct: false}
      - {text: "Une expression régulière plus souple, comme `(?i)introuv`", correct: false}
      - {text: "Un test qui compare `err.Error()` en entier, pour être plus précis", correct: false}
    answer: |-
      ```go
      var ErrIntrouvable = errors.New("introuvable")
      // côté service : return fmt.Errorf("commande %d : %w", id, ErrIntrouvable)
      // côté test :
      if !errors.Is(err, ErrIntrouvable) { t.Fatal(err) }
      ```
      On teste l'identité de l'erreur (sentinelle ou type), jamais son texte, qui est destiné aux humains.
  - key: scenario-couches
    format: scenario
    question: Comment enveloppes-tu les erreurs entre les couches base de données, métier et HTTP ?
    choices:
      - {text: "La base traduit ce qui a un sens métier, le métier ajoute son contexte, seul HTTP traite et journalise", correct: true}
      - {text: "Chaque couche enveloppe avec `%w` sans rien traduire, et HTTP teste les erreurs du pilote SQL", correct: false}
      - {text: "Chaque couche journalise puis remonte l'erreur, et HTTP renvoie `err.Error()` au client", correct: false}
      - {text: "La base panique, et le métier rattrape la panique pour renvoyer un code HTTP au handler", correct: false}
    answer: |-
      La couche base de données traduit ce qui a un sens métier (`sql.ErrNoRows` devient `ErrIntrouvable`, une violation
      d'unicité `ErrDejaExistant`) et enveloppe le reste avec `%v` ou `%w` selon ce qu'elle veut exposer. La couche
      métier ajoute son contexte (`réservation de la commande 42 : %w`). La couche HTTP est la seule à traiter : elle
      teste les erreurs du domaine avec `errors.Is` et `errors.As` pour choisir le statut, journalise l'erreur complète
      une seule fois, et renvoie au client un message sûr sans détails internes.
  - key: scenario-pile
    format: scenario
    question: Un collègue regrette que les erreurs Go n'aient pas de pile d'appels. Que proposes-tu ?
    choices:
      - {text: "Un contexte riche à chaque niveau, et une pile capturée à la frontière pour l'inattendu", correct: true}
      - {text: "Une pile capturée avec `debug.Stack()` dans chaque `fmt.Errorf` du projet", correct: false}
      - {text: "Des paniques à la place des erreurs, pour avoir la pile dans les logs", correct: false}
      - {text: "Des messages d'erreur plus longs, qui recopient le nom de chaque fonction", correct: false}
    answer: |-
      D'abord, un contexte riche à chaque niveau donne souvent un message plus utile qu'une pile : il dit ce que le
      programme faisait et avec quelles données. Si une pile est vraiment nécessaire (une erreur inattendue en
      production), on la capture à la frontière : un middleware qui journalise avec `runtime/debug.Stack()` lors d'une
      panique, ou un outil comme Sentry. Ajouter une pile à chaque erreur alourdit tout pour peu de gain.
  - key: scenario-decision
    format: scenario
    question: Tu écris une bibliothèque cliente pour une API. Exposes-tu les erreurs du package net/http avec `%w` ?
    choices:
      - {text: "J'expose mes propres erreurs (`ErrNonAutorise`, `*ErrAPI`), et j'enveloppe le réseau en le documentant", correct: true}
      - {text: "Oui, toutes, sans en créer : l'appelant teste lui-même les erreurs de `net/http`", correct: false}
      - {text: "Non, aucune : tout passe en `%v`, et l'appelant ne peut tester ni délai ni erreur réseau", correct: false}
      - {text: "Je renvoie des codes HTTP entiers à la place des erreurs, plus simples à tester", correct: false}
    answer: |-
      J'expose ce que l'appelant doit pouvoir tester, sous la forme d'erreurs de ma bibliothèque : `ErrNonAutorise`,
      `ErrLimiteAtteinte`, ou un type `*ErrAPI{Statut, Code}`. Pour les erreurs réseau, enveloppées avec `%w`, les
      appelants peuvent tester `context.DeadlineExceeded` ou `net.Error`, ce qui est utile et stable. Je documente ces
      erreurs dans l'API, puisque `%w` en fait un engagement.
  - key: code-niveaux
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      lire := func() error { return fs.ErrPermission }
      charger := func() error {
      	if err := lire(); err != nil {
      		return fmt.Errorf("lecture de config.json : %w", err)
      	}
      	return nil
      }

      err := charger()
      fmt.Println(err)
      fmt.Println(errors.Is(err, fs.ErrPermission))
      ```
    choices:
      - text: |-
          ```
          lecture de config.json : permission denied
          true
          ```
        correct: true
      - text: |-
          ```
          lecture de config.json : permission denied
          false
          ```
        correct: false
      - text: |-
          ```
          lecture de config.json : fs.ErrPermission
          true
          ```
        correct: false
      - text: |-
          ```
          permission denied
          true
          ```
        correct: false
    answer: '`lecture de config.json : permission denied` puis `true`.'
    check:
      code: "package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n)\n\nfunc main() {\n\tlire := func() error { return fs.ErrPermission }\n\tcharger := func() error {\n\t\tif err := lire(); err != nil {\n\t\t\treturn fmt.Errorf(\"lecture de config.json : %w\", err)\n\t\t}\n\t\treturn nil\n\t}\n\n\terr := charger()\n\tfmt.Println(err)\n\tfmt.Println(errors.Is(err, fs.ErrPermission))\n}\n"
      output: |-
        lecture de config.json : permission denied
        true
  - key: scenario-message
    format: scenario
    question: 'Un utilisateur te montre le message « open config.json: no such file or directory ». Que manque-t-il, et comment l''améliorer ?'
    choices:
      - {text: "Pourquoi le programme lisait ce fichier : j'ajoute du contexte, « chargement de la configuration (option -config) »", correct: true}
      - {text: "Rien : le message dit déjà tout, le chemin du fichier et la cause exacte de l'échec côté système", correct: false}
      - {text: "La pile d'appels : j'ajoute `debug.Stack()` au message, pour savoir d'où vient l'erreur", correct: false}
      - {text: "Le code d'erreur du système : j'affiche le numéro `errno` à la place du message", correct: false}
    answer: "Le message dit ce qui a échoué au plus bas niveau, mais pas pourquoi le programme lisait ce fichier ni quoi faire. J'ajoute du contexte au niveau qui sait : `chargement de la configuration (option -config) : open config.json: no such file or directory` ; pour un utilisateur final, la frontière (la CLI, le handler) peut aussi traduire en conseil : « fichier de configuration introuvable, utilise -config »."
