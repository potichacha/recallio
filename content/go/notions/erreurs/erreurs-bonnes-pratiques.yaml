notion: erreurs-bonnes-pratiques
cards:
  - key: messages-erreur-sont-ils-minuscules
    format: course
    question: Pourquoi les messages d'erreur sont-ils en minuscules ?
    answer: Ils sont concaténés avec d'autres contextes.
  - key: logger-erreur-retourner
    format: course
    question: Faut-il logger une erreur et la retourner ?
    answer: 'Non, on la traite une fois : soit on la gère, soit on la propage.'
  - key: erreurs-ont-elles-stack-trace
    format: course
    question: Les erreurs Go ont-elles une stack trace ?
    answer: Non par défaut ; le contexte vient du wrapping.
  - key: structures-gestion-erreurs-couche-base-donnees
    format: scenario
    question: Comment tu structures la gestion d'erreurs entre la couche base de données, la couche métier et l'API HTTP ?
    answer: |-
      Chaque couche parle son propre langage d'erreurs. La couche de **données** traduit les erreurs techniques en erreurs du domaine : `sql.ErrNoRows` devient `ErrNotFound` ; une violation de contrainte d'unicité devient `ErrDuplicate`. Le reste est enveloppé avec du contexte (`fmt.Errorf("insérer commande: %w", err)`).
      La couche **métier** ajoute ses propres erreurs (`ErrStockInsuffisant`, ou un `*ValidationError` avec les champs) et propage les autres en ajoutant du contexte.
      La couche **HTTP** est le seul endroit où l'on décide du code de statut et où l'on **logge** : un mapping avec `errors.Is` et `errors.As` (404, 409, 422), et tout le reste en 500 avec un message générique au client et l'erreur complète dans les logs avec l'identifiant de requête.
      Ainsi les erreurs ne sont loggées qu'une fois, le client ne voit jamais de détail interne, et la couche métier ignore tout de HTTP.
