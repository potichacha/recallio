notion: erreurs-bonnes-pratiques
lesson: |-
  Quelques règles qui rendent la gestion d'erreurs lisible et efficace :

  1. **Traiter une erreur une seule fois.** Soit on la remonte, soit on la traite (et on la journalise). Journaliser puis
     remonter produit la même erreur plusieurs fois dans les logs.
  2. **Ajouter du contexte en remontant**, avec ce que ce niveau sait : `réservation de la commande 42 : %w`.
  3. **Messages en minuscules**, sans ponctuation finale, sans « erreur » ou « échec » répétés : ils s'enchaînent.
  4. **Ne pas exposer les détails internes** à l'extérieur : la frontière (HTTP, CLI) traduit en message sûr et en code
     adapté, et journalise l'erreur complète.
  5. **Des erreurs du domaine** (sentinelles, types) pour les cas que les appelants doivent distinguer ; l'infrastructure
     traduit ses erreurs techniques vers elles.
  6. **Tester l'identité, pas le texte** : `errors.Is` et `errors.As`, jamais `strings.Contains(err.Error(), ...)`.
  7. **Garder les erreurs pour l'attendu**, et `panic` pour les bugs.

  Go n'ajoute pas de pile d'appels aux erreurs ; un contexte riche à chaque niveau, et une journalisation structurée à
  la frontière (`slog` avec l'erreur et les identifiants de requête) suffisent presque toujours.

  **Piège classique** : un `log.Println(err)` à chaque niveau, puis `return err`. Une seule panne remplit les logs de
  cinq lignes, et personne ne sait où elle a été traitée.

  **En entretien** : « Une erreur se traite une fois : on remonte avec du contexte ou l'on traite et journalise ; erreurs
  du domaine testées par Is et As ; messages chaînables ; détails internes cachés à la frontière. »
cards:
  - key: messages-erreur-sont-ils-minuscules
    format: course
    question: "Pourquoi un message d'erreur Go commence-t-il par une minuscule, sans point final ?"
    choices:
      - {text: "Il est concaténé à d'autres contextes, au milieu d'une phrase", correct: true}
      - {text: "Le paquet `errors` refuse un message qui commence par une majuscule", correct: false}
      - {text: "Les logs structurés trient mal les messages qui ont une majuscule", correct: false}
      - {text: "La majuscule est réservée aux erreurs exportées par un package", correct: false}
    answer: "Un message est souvent enveloppé dans un autre (« lecture de la config : fichier introuvable ») : une majuscule ou un point au milieu de la chaîne gênerait la lecture. C'est une convention vérifiée par les linters, pas une règle du compilateur."
  - key: logger-erreur-retourner
    format: course
    question: "Faut-il journaliser une erreur et la retourner ?"
    choices:
      - {text: "Non : on la traite une fois, soit en la journalisant, soit en la remontant", correct: true}
      - {text: "Oui : chaque niveau la journalise, au cas où l'appelant l'ignorerait", correct: false}
      - {text: "Oui, mais seulement au niveau `debug`, pour ne pas polluer les logs", correct: false}
      - {text: "Non : une erreur remontée ne doit être journalisée nulle part", correct: false}
    answer: "On la traite une fois : soit on la gère (et on la journalise), soit on la remonte avec du contexte. La journaliser à chaque niveau répète la même panne dans les logs ; mais quelqu'un, à la frontière, doit bien la journaliser."
  - key: erreurs-ont-elles-stack-trace
    format: course
    question: "Les erreurs Go ont-elles une pile d'appels (stack trace) ?"
    choices:
      - {text: "Non par défaut : le contexte vient des messages ajoutés en enveloppant", correct: true}
      - {text: "Oui : `errors.New` capture la pile, que `%+v` affiche", correct: false}
      - {text: "Oui, mais seulement dans un binaire compilé avec `-race`", correct: false}
      - {text: "Non, et c'est pourquoi on ne peut pas les envelopper", correct: false}
    answer: "Non : `errors.New` et `fmt.Errorf` ne capturent pas la pile. Le contexte vient du wrapping, chaque niveau ajoutant ce qu'il faisait ; la pile affichée par `%+v` vient de bibliothèques tierces comme pkg/errors."
  - key: structures-gestion-erreurs-couche-base-donnees
    format: scenario
    question: Comment tu structures la gestion d'erreurs entre la couche base de données, la couche métier et l'API HTTP ?
    choices:
      - {text: "Les données traduisent en erreurs du domaine, le métier ajoute du contexte, seul HTTP choisit le statut et journalise", correct: true}
      - {text: "Chaque couche journalise l'erreur et la remonte telle quelle, et HTTP renvoie son texte au client en 500", correct: false}
      - {text: "Les données remontent `sql.ErrNoRows` jusqu'au handler, qui teste les erreurs SQL pour choisir le statut", correct: false}
      - {text: "Le métier panique sur toute erreur technique, et un `recover` du handler la change en code 500", correct: false}
    answer: "La couche de données traduit les erreurs techniques en erreurs du domaine (`sql.ErrNoRows` devient `ErrNotFound`, une violation d'unicité `ErrDuplicate`) et enveloppe les autres ; le métier ajoute ses propres erreurs et propage avec du contexte. Seule la couche HTTP mappe avec `errors.Is` et `errors.As` (404, 409, 422, sinon 500 au message générique) et journalise, une fois, avec l'identifiant de requête : la couche métier ignore tout de HTTP."
  - key: une-fois
    format: course
    question: Que signifie « traiter une erreur une seule fois » ?
    choices:
      - {text: "À chaque niveau, soit la remonter avec du contexte, soit la traiter et la journaliser", correct: true}
      - {text: "La journaliser au premier niveau qui la voit, puis la remonter sans contexte", correct: false}
      - {text: "Ne jamais réessayer une opération qui a déjà renvoyé une erreur", correct: false}
      - {text: "N'écrire qu'un seul `if err != nil` par fonction, en regroupant les appels", correct: false}
    answer: 'À chaque niveau, soit on la remonte (avec du contexte), soit on la traite et on la journalise, mais pas les deux : sinon la même erreur apparaît plusieurs fois dans les logs.'
  - key: frontiere
    format: course
    question: Que fait la frontière HTTP d'une erreur interne ?
    choices:
      - {text: "Elle choisit le code selon l'erreur du domaine, renvoie un message sûr et journalise une fois", correct: true}
      - {text: "Elle renvoie `err.Error()` au client, pour qu'il sache exactement ce qui a échoué", correct: false}
      - {text: "Elle relance l'erreur avec `panic`, pour que le serveur HTTP la change en 500", correct: false}
      - {text: "Elle répond 200 sans rien faire, l'erreur ayant déjà été journalisée plus bas", correct: false}
    answer: Elle choisit le code de réponse selon l'erreur du domaine, renvoie au client un message sûr sans détails internes, et journalise l'erreur complète une seule fois.
  - key: domaine
    format: course
    question: Pourquoi traduire les erreurs techniques en erreurs du domaine ?
    choices:
      - {text: "Pour que les couches hautes ne dépendent ni du pilote SQL ni du client HTTP", correct: true}
      - {text: "Pour que les erreurs techniques gardent leur pile d'appels en remontant", correct: false}
      - {text: "Pour que le client HTTP reçoive le détail exact de la panne technique", correct: false}
      - {text: "Pour que le compilateur vérifie que chaque erreur est bien traitée", correct: false}
    answer: Pour que les couches supérieures ne dépendent pas de la technologie (le pilote SQL, le client HTTP) et testent des cas métier stables comme `ErrIntrouvable`.
  - key: vf-log-retour
    format: true-false
    question: Journaliser une erreur puis la remonter est une bonne pratique.
    truth: false
    answer: On fait l'un ou l'autre ; sinon les logs se remplissent de doublons.
  - key: vf-texte
    format: true-false
    question: Tester `strings.Contains(err.Error(), "introuvable")` est un moyen fiable de reconnaître une erreur.
    truth: false
    answer: Le texte change ; on teste l'identité avec `errors.Is` ou le type avec `errors.As`.
  - key: vf-client
    format: true-false
    question: Une API publique peut renvoyer le message brut d'une erreur SQL au client.
    truth: false
    answer: Elle révélerait des détails internes (schéma, requête) ; on renvoie un message sûr et l'on journalise le détail.
  - key: vf-contexte
    format: true-false
    question: Un bon contexte d'erreur nomme ce que faisait le niveau et les données utiles.
    truth: true
    answer: '`envoi de la facture 2026-0042 à ada@ex.fr : %w`.'
  - key: qcm-pratiques
    format: multiple-choice
    question: "Quelle pratique est recommandée pour remonter une erreur en Go ?"
    choices:
      - {text: "La remonter avec `fmt.Errorf(\"...: %w\", err)`, en ajoutant le contexte de ce niveau", correct: true}
      - {text: "La remonter avec `fmt.Errorf(\"...: %v\", err)`, pour garder la chaîne des causes", correct: false}
      - {text: "La journaliser à chaque niveau par sécurité, puis la remonter telle quelle", correct: false}
      - {text: "Préfixer son message par « Erreur : », pour la repérer dans les logs", correct: false}
    answer: "`%w` garde la cause accessible à `errors.Is` et `errors.As`, et le contexte rend le message chaînable ; on journalise une seule fois, là où l'erreur est traitée. `%v` ne copie que le texte et coupe la chaîne."
  - key: qcm-frontiere
    format: multiple-choice
    question: Que renvoyer au client quand la base de données est injoignable ?
    choices:
      - text: Un 503 ou 500 avec un message générique, l'erreur complète étant journalisée
        correct: true
      - text: 'Le message du pilote : « dial tcp 10.0.0.5:5432: connection refused »'
        correct: false
      - text: Un 200 avec une liste vide
        correct: false
      - text: Rien, fermer la connexion
        correct: false
    answer: Le client n'a pas à connaître l'infrastructure.
  - key: qcm-messages
    format: multiple-choice
    question: "Quel message d'erreur suit les conventions de Go ?"
    choices:
      - {text: "`lecture de la configuration : fichier introuvable`", correct: true}
      - {text: "`Lecture de la configuration : fichier introuvable.`", correct: false}
      - {text: "`Erreur ! Impossible de lire la configuration.`", correct: false}
      - {text: "`ERROR: something went wrong`", correct: false}
    answer: "Minuscule, contexte précis, pas de ponctuation finale : le message s'enchaîne avec les autres. Le deuxième dit la même chose, mais sa majuscule et son point gênent une fois enveloppé."
  - key: qcm-domaine
    format: multiple-choice
    question: Comment le dépôt PostgreSQL d'un service doit-il signaler une violation d'unicité sur l'email ?
    choices:
      - text: Traduire le code 23505 en `ErrEmailDejaUtilise`, une erreur du domaine
        correct: true
      - text: Remonter l'erreur `*pgconn.PgError` pour que le handler teste son code
        correct: false
      - text: Paniquer
        correct: false
      - text: Renvoyer nil et ignorer l'insertion
        correct: false
    answer: Le handler teste une erreur du domaine, indépendante du pilote.
  - key: bug-double-log
    format: bug-fix
    question: |-
      Chaque panne apparaît quatre fois dans les logs. Quelle correction est la bonne ?
      ```go
      if err != nil {
      	log.Printf("erreur lors de la sauvegarde : %v", err)
      	return err
      }
      ```
    choices:
      - {text: "Remonter avec `fmt.Errorf(\"...: %w\", err)` sans journaliser, et ne journaliser qu'au handler", correct: true}
      - {text: "Remplacer `log.Printf` par `log.Fatalf`, pour qu'une panne ne soit écrite qu'une fois", correct: false}
      - {text: "Garder le `log.Printf` et remonter `nil`, pour que les appelants ne la journalisent pas", correct: false}
      - {text: "Dédupliquer les lignes identiques dans l'outil qui collecte les logs", correct: false}
    answer: "```go\nif err != nil {\n\treturn fmt.Errorf(\"sauvegarde de la commande %d : %w\", c.ID, err)\n}\n```\nChaque niveau ajoute son contexte sans journaliser ; seule la frontière (le handler) journalise, une fois."
  - key: bug-fuite-client
    format: bug-fix
    question: |-
      Le client reçoit le message brut de la base. Quelle correction est la bonne ?
      ```go
      if err != nil {
      	http.Error(w, err.Error(), http.StatusInternalServerError)
      	return
      }
      ```
    choices:
      - {text: "Journaliser l'erreur complète, et répondre au client un message générique", correct: true}
      - {text: "Renvoyer `err.Error()` avec le code 400 plutôt que 500", correct: false}
      - {text: "Remplacer `http.Error` par `panic(err)`, que le serveur change en 500", correct: false}
      - {text: "Tronquer `err.Error()` à 50 caractères avant de le renvoyer", correct: false}
    answer: "```go\nif err != nil {\n\tslog.ErrorContext(r.Context(), \"création de commande\", \"err\", err)\n\thttp.Error(w, \"erreur interne\", http.StatusInternalServerError)\n\treturn\n}\n```\nLe détail va dans les logs ; le client reçoit un message générique (avec, idéalement, un identifiant de requête)."
  - key: bug-texte
    format: bug-fix
    question: |-
      La détection d'un doublon casse quand on change la langue des messages de la base. Quelle correction est la bonne ?
      ```go
      if strings.Contains(err.Error(), "duplicate key") {
      	return ErrDejaExistant
      }
      ```
    choices:
      - {text: "Tester le code SQL stable : `errors.As` vers `*pgconn.PgError`, et `Code == \"23505\"`", correct: true}
      - {text: "Chercher aussi la traduction « clé dupliquée » dans `err.Error()`", correct: false}
      - {text: "Comparer `err` à `errors.New(\"duplicate key\")` avec `errors.Is`", correct: false}
      - {text: "Mettre `err.Error()` en minuscules avant de chercher « duplicate key »", correct: false}
    answer: "```go\nvar pgErr *pgconn.PgError\nif errors.As(err, &pgErr) && pgErr.Code == \"23505\" {\n\treturn ErrDejaExistant\n}\n```\nLe code d'erreur SQL est stable ; le texte ne l'est pas."
  - key: bug-contexte
    format: bug-fix
    question: |-
      Un message d'erreur ne dit rien d'utile : « échec : échec : EOF ». Quelle correction des deux niveaux est la bonne ?
      ```go
      // niveau 1
      return fmt.Errorf("échec : %w", err)
      // niveau 2
      return fmt.Errorf("échec : %w", err)
      ```
    choices:
      - {text: "Que chaque niveau dise ce qu'il faisait : « import du catalogue », « lecture de l'en-tête »", correct: true}
      - {text: "Remplacer `%w` par `%v` aux deux niveaux, pour aplatir le message en une seule ligne", correct: false}
      - {text: "Garder « échec » au niveau 1 seulement, et remonter `err` tel quel au niveau 2", correct: false}
      - {text: "Écrire « ÉCHEC » en majuscules aux deux niveaux, pour le rendre visible dans les logs", correct: false}
    answer: |-
      ```go
      // niveau 1 (lecture)
      return fmt.Errorf("lecture de l'en-tête du fichier %s : %w", nom, err)
      // niveau 2 (import)
      return fmt.Errorf("import du catalogue : %w", err)
      ```
      Chaque niveau dit ce qu'il faisait : « import du catalogue : lecture de l'en-tête du fichier x.csv : EOF ».
  - key: scenario-couches
    format: scenario
    question: Comment structures-tu la gestion d'erreurs d'un service HTTP en trois couches ?
    choices:
      - {text: "L'infrastructure traduit, le métier remonte avec contexte, le handler seul choisit le statut et journalise", correct: true}
      - {text: "Chaque couche journalise l'erreur, et le handler renvoie `err.Error()` au client avec un 500", correct: false}
      - {text: "L'infrastructure panique, et un middleware `recover` choisit le statut d'après le message", correct: false}
      - {text: "Le métier renvoie directement des codes HTTP, que le handler recopie dans la réponse", correct: false}
    answer: |-
      L'infrastructure traduit les erreurs techniques qui ont un sens métier (aucune ligne, doublon, délai) en erreurs du
      domaine et enveloppe les autres. Le métier remonte en ajoutant son contexte et déclare ses propres erreurs
      (`ErrStockInsuffisant`, `*ErrValidation`). Le handler est le seul à traiter : un `switch` avec `errors.Is` et
      `errors.As` choisit 400, 404, 409 ou 500, il journalise l'erreur complète avec `slog` et l'identifiant de requête,
      et renvoie au client un corps Problem Details sans détails internes.
  - key: scenario-observabilite
    format: scenario
    question: Comment rendre les erreurs exploitables en production sans pile d'appels ?
    choices:
      - {text: "Un contexte riche à chaque niveau, des logs structurés à la frontière, des métriques et des traces", correct: true}
      - {text: "Une `panic` sur chaque erreur, pour obtenir la pile d'appels dans les logs du serveur", correct: false}
      - {text: "Un `log.Printf` de l'erreur à chaque niveau, pour reconstituer le chemin parcouru", correct: false}
      - {text: "Un appel à `runtime.Stack` dans chaque `fmt.Errorf`, pour coller la pile au message", correct: false}
    answer: |-
      Par un contexte riche à chaque niveau, une journalisation structurée à la frontière (`slog` avec l'erreur, la
      route, l'identifiant de requête et de trace), et des métriques par type d'erreur (compteur des 5xx, des délais
      dépassés). Pour les erreurs inattendues, un outil comme Sentry capture la panique et la pile. La trace distribuée
      (OpenTelemetry) relie l'erreur aux appels des autres services.
  - key: scenario-revue
    format: scenario
    question: Quelle liste de vérification utilises-tu pour relire la gestion d'erreurs d'une PR Go ?
    choices:
      - {text: "Erreurs toutes lues, contexte à chaque remontée, une seule journalisation, tests avec Is et As", correct: true}
      - {text: "Une journalisation à chaque niveau, et un `panic` dès qu'un cas sort de l'ordinaire", correct: false}
      - {text: "Des messages en majuscules avec un point final, et des erreurs comparées par leur texte", correct: false}
      - {text: "Des erreurs ignorées avec `_` quand l'appel échoue rarement, pour alléger le code", correct: false}
    answer: |-
      Toutes les erreurs sont lues (pas d'appel ignoré, pas de `_` sans raison) ; chaque remontée ajoute un contexte
      utile ; aucune erreur n'est journalisée et remontée à la fois ; les cas métier ont des sentinelles ou des types,
      testés avec Is et As, jamais par le texte ; la frontière ne fait pas fuiter de détails ; pas de `panic` pour un cas
      attendu ; et pas de type d'erreur concret renvoyé dans une signature.
