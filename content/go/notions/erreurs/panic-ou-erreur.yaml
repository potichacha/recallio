notion: panic-ou-erreur
lesson: |-
  La règle de décision est simple :

  | Situation | Réponse |
  |---|---|
  | Un échec **attendu** : fichier absent, entrée invalide, réseau en panne, ressource introuvable | renvoyer une **`error`** |
  | Un **bug** : invariant violé, cas impossible, mauvais usage évident d'une API | **`panic`** |
  | Une **initialisation** qui ne peut échouer qu'à cause d'une erreur du programmeur (motif constant, template embarqué) | `panic`, souvent via une fonction **`Must`** |

  La convention **`Must`** : une fonction qui renvoie `(T, error)` a une variante `MustX` qui panique sur l'erreur, pour
  l'usage au niveau du package : `var re = regexp.MustCompile(`^[a-z]+$`)`, `template.Must(...)`. On ne l'utilise
  **jamais** avec des données venues de l'extérieur.

  Une **bibliothèque** ne laisse pas une panique **traverser son API** : si elle utilise panic en interne, elle la
  récupère à sa frontière et renvoie une erreur. Une panique qui sort de l'API d'un package est un défaut de conception
  (sauf mauvais usage documenté, comme `sync.WaitGroup` utilisé de façon incorrecte).

  Côté application, un `main` qui rencontre une erreur fatale au démarrage (configuration invalide) l'affiche et sort avec
  `os.Exit(1)` (souvent via une fonction `run() error`) : c'est plus propre qu'une panique, qui affiche une pile inutile
  à l'utilisateur.

  **Piège classique** : un `Must` appelé sur une entrée utilisateur (`regexp.MustCompile(motif)` avec un motif saisi) ; le
  service tombe à la première saisie invalide.

  **En entretien** : « Erreur pour l'attendu, panic pour les bugs ; Must seulement à l'initialisation avec des constantes ;
  une panique ne traverse pas l'API d'une bibliothèque ; main affiche l'erreur et sort en 1. »
cards:
  - key: convention-must
    format: course
    question: "À quoi sert une fonction comme `regexp.MustCompile`, selon la convention Must ?"
    choices:
      - {text: "À paniquer sur l'erreur, pour initialiser au démarrage une valeur connue", correct: true}
      - {text: "À valider une entrée utilisateur, en renvoyant une erreur détaillée", correct: false}
      - {text: "À réessayer l'opération jusqu'à ce qu'elle finisse par réussir", correct: false}
      - {text: "À ignorer l'erreur, et à renvoyer une valeur zéro utilisable", correct: false}
    answer: Une fonction qui panique en cas d'erreur, pour les initialisations au démarrage (regexp.MustCompile).
  - key: regle
    format: course
    question: Quelle règle sépare panic et erreur ?
    choices:
      - {text: "Un échec attendu est une erreur renvoyée ; un bug ou un invariant violé, une panique", correct: true}
      - {text: "Une erreur grave est une panique ; une erreur bénigne, une valeur `error` renvoyée", correct: false}
      - {text: "Une bibliothèque panique, le programme principal renvoie des erreurs", correct: false}
      - {text: "Une erreur pour le réseau et les fichiers, une panique pour les saisies invalides", correct: false}
    answer: Un échec attendu (entrée, fichier, réseau) est une erreur renvoyée ; un bug ou un invariant violé est une panique.
  - key: main
    format: course
    question: Comment `main` doit-il réagir à une configuration invalide au démarrage ?
    choices:
      - {text: "Afficher un message clair et sortir avec `os.Exit(1)`, souvent via `run() error`", correct: true}
      - {text: "Paniquer avec l'erreur, pour afficher toute la pile d'appels à l'utilisateur", correct: false}
      - {text: "Démarrer avec une configuration par défaut, sans rien signaler", correct: false}
      - {text: "Journaliser l'erreur, puis sortir avec `os.Exit(0)` pour ne pas inquiéter", correct: false}
    answer: Afficher un message clair et sortir avec `os.Exit(1)`, souvent via une fonction `run() error` ; une panique afficherait une pile inutile à l'utilisateur.
  - key: vf-must-entree
    format: true-false
    question: '`regexp.MustCompile` convient pour compiler un motif saisi par un utilisateur.'
    truth: false
    answer: Il panique sur un motif invalide ; on utilise `regexp.Compile` et son erreur.
  - key: vf-bibliotheque
    format: true-false
    question: Une bibliothèque peut laisser une panique interne remonter jusqu'à son appelant pour une entrée invalide.
    truth: false
    answer: 'Une entrée invalide est attendue : la bibliothèque renvoie une erreur.'
  - key: vf-must-init
    format: true-false
    question: '`var re = regexp.MustCompile(`^\d+$`)` au niveau du package est un usage idiomatique.'
    truth: true
    answer: Le motif est une constante du programme ; une erreur serait un bug, révélé dès le démarrage.
  - key: vf-exceptions
    format: true-false
    question: En Go, panic et recover remplacent avantageusement try et catch pour les erreurs métier.
    truth: false
    answer: Les erreurs métier sont des valeurs ; panic est réservé aux bugs.
  - key: qcm-situations
    format: multiple-choice
    question: "Laquelle de ces situations justifie une erreur plutôt qu'une panique ?"
    choices:
      - {text: "Une base de données qui ne répond pas", correct: true}
      - {text: "Un statut absent de l'énumération, reçu par une fonction interne", correct: false}
      - {text: "Un template embarqué dans le binaire qui ne compile pas", correct: false}
      - {text: "Un solde négatif, que le code garantit impossible", correct: false}
    answer: "Une panne extérieure peut arriver dans un programme correct : c'est une erreur, comme un JSON mal formé envoyé par un client. Les trois autres sont des bugs du programme."
  - key: qcm-must
    format: multiple-choice
    question: "Laquelle de ces fonctions Must existe dans la bibliothèque standard ?"
    choices:
      - {text: "`template.Must`", correct: true}
      - {text: "`json.MustMarshal`", correct: false}
      - {text: "`os.MustOpen`", correct: false}
      - {text: "`strconv.MustAtoi`", correct: false}
    answer: "`template.Must`, comme `regexp.MustCompile`, sert à l'initialisation avec des valeurs connues. Les autres n'existent pas : ouvrir un fichier ou convertir une saisie peut échouer normalement."
  - key: qcm-frontiere
    format: multiple-choice
    question: Une bibliothèque de parsing utilise panic en interne pour sortir d'une récursion. Que doit-elle faire ?
    choices:
      - text: Récupérer à sa frontière publique et renvoyer une erreur
        correct: true
      - text: Laisser la panique atteindre l'appelant
        correct: false
      - text: Demander à l'appelant d'ajouter un recover
        correct: false
      - text: Remplacer la récursion par os.Exit
        correct: false
    answer: C'est ce que fait `encoding/json`.
  - key: qcm-main
    format: multiple-choice
    question: Que doit faire un outil en ligne de commande dont le fichier d'entrée est introuvable ?
    choices:
      - {text: "Afficher un message sur la sortie d'erreur et sortir avec le code 1", correct: true}
      - {text: "Paniquer avec l'erreur, pour afficher toute la pile d'appels", correct: false}
      - {text: "Afficher un message sur la sortie standard et sortir avec le code 0", correct: false}
      - {text: "Continuer avec un fichier vide, sans prévenir l'utilisateur", correct: false}
    answer: Le code de sortie non nul signale l'échec aux scripts.
  - key: bug-must-entree
    format: bug-fix
    question: |-
      Le service tombe quand un utilisateur saisit un motif de filtre invalide. Quelle correction est la bonne ?
      ```go
      filtre := regexp.MustCompile(saisie)
      ```
    choices:
      - {text: "`regexp.Compile(saisie)`, et remonter son erreur avec le motif en contexte", correct: true}
      - {text: "Garder `MustCompile`, dans un `recover` qui renvoie un filtre vide", correct: false}
      - {text: "`regexp.MustCompilePOSIX(saisie)`, plus tolérant sur la syntaxe", correct: false}
      - {text: "Vérifier `utf8.ValidString(saisie)` avant d'appeler `MustCompile`", correct: false}
    answer: "```go\nfiltre, err := regexp.Compile(saisie)\nif err != nil {\n\treturn fmt.Errorf(\"filtre %q invalide : %w\", saisie, err)\n}\n```\n`Must` est réservé aux constantes ; une entrée utilisateur passe par la variante qui renvoie une erreur."
  - key: bug-main-panic
    format: bug-fix
    question: |-
      Les utilisateurs voient une pile d'appels illisible quand la configuration manque. Quelle correction est la bonne ?
      ```go
      func main() {
      	cfg, err := charger()
      	if err != nil {
      		panic(err)
      	}
      	...
      }
      ```
    choices:
      - {text: "Un `run() error` appelé par `main`, qui affiche l'erreur sur `os.Stderr` et sort avec 1", correct: true}
      - {text: "Un `recover` dans `main`, qui avale la panique et laisse le programme sortir avec 0", correct: false}
      - {text: "Un `log.Fatal(err)` dans la fonction la plus profonde, au plus près de l'échec", correct: false}
      - {text: "`panic(err.Error())`, qui n'affiche que le message, sans la pile d'appels", correct: false}
    answer: "```go\nfunc main() {\n\tif err := run(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"erreur :\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\tcfg, err := charger()\n\tif err != nil {\n\t\treturn fmt.Errorf(\"chargement de la configuration : %w\", err)\n\t}\n\t...\n}\n```\nUn message clair et le code de sortie 1, sans pile ; et les `defer` de `run` s'exécutent."
  - key: bug-api
    format: bug-fix
    question: |-
      Une bibliothèque de dates panique sur une date mal formée fournie par l'appelant. Quelle correction est la bonne ?
      ```go
      func Analyser(s string) Date {
      	t, err := time.Parse("2006-01-02", s)
      	if err != nil {
      		panic(err)
      	}
      	return Date{t}
      }
      ```
    choices:
      - {text: "Renvoyer `(Date, error)`, avec au besoin une variante `MustAnalyser` pour les constantes", correct: true}
      - {text: "Garder la panique, et documenter que l'appelant doit l'entourer d'un `recover`", correct: false}
      - {text: "Renvoyer `Date{}` sans erreur, la date zéro signalant une saisie invalide", correct: false}
      - {text: "Remplacer `panic(err)` par `log.Fatal(err)`, plus propre pour l'appelant", correct: false}
    answer: "```go\nfunc Analyser(s string) (Date, error) {\n\tt, err := time.Parse(\"2006-01-02\", s)\n\tif err != nil {\n\t\treturn Date{}, fmt.Errorf(\"date %q invalide : %w\", s, err)\n\t}\n\treturn Date{t}, nil\n}\n\n// et, pour les constantes : func MustAnalyser(s string) Date\n```\nL'API renvoie une erreur ; une variante `Must` peut exister pour les dates connues à l'avance."
  - key: bug-invariant
    format: bug-fix
    question: |-
      Une incohérence interne (un solde négatif impossible) est convertie en erreur et passe inaperçue dans les logs. Quelle correction est la bonne ?
      ```go
      if compte.Solde < 0 {
      	return errors.New("solde négatif")
      }
      ```
    choices:
      - {text: "Paniquer avec un message détaillé, récupéré et alerté à la frontière", correct: true}
      - {text: "Remplacer l'erreur par un `log.Println`, puis continuer le traitement", correct: false}
      - {text: "Remettre le solde à zéro, pour que le compte reste cohérent", correct: false}
      - {text: "Envelopper l'erreur avec `%w`, pour lui ajouter du contexte", correct: false}
    answer: "```go\nif compte.Solde < 0 {\n\tpanic(fmt.Sprintf(\"invariant violé : solde négatif %d pour le compte %s\", compte.Solde, compte.ID))\n}\n```\nSi le code garantit qu'un solde ne peut pas être négatif, le constater est un bug : une panique (récupérée et\nalertée à la frontière) le rend visible, au lieu d'une erreur noyée parmi les échecs attendus."
  - key: scenario-frontiere
    format: scenario
    question: Comment expliques-tu la frontière entre panic et erreur à un développeur qui découvre Go ?
    choices:
      - {text: "Une erreur arrive dans un programme correct, et l'appelant décide ; une panique signale un programme incorrect", correct: true}
      - {text: "Une erreur est un problème bénin, à journaliser ; une panique, un problème grave, à remonter à l'appelant", correct: false}
      - {text: "Une panique remplace les exceptions de Java : on la lance, puis on la rattrape avec `recover` où l'on veut", correct: false}
      - {text: "Une erreur sert aux bibliothèques, une panique aux programmes, qui peuvent s'arrêter quand ils le veulent", correct: false}
    answer: |-
      Une erreur décrit quelque chose qui peut arriver dans un programme correct : un fichier absent, une saisie
      invalide, un service en panne. On la renvoie, et l'appelant décide. Une panique décrit un programme incorrect : un
      invariant violé, un cas censé être impossible. On ne la récupère qu'aux frontières pour isoler la panne et
      alerter. Les `Must` font le pont pour l'initialisation : une erreur sur une constante du programme est un bug.
  - key: scenario-initialisation
    format: scenario
    question: Ton service charge au démarrage des templates embarqués avec `embed`. Erreur ou panique s'ils sont invalides ?
    choices:
      - {text: "Une panique au démarrage avec `template.Must` : un template embarqué invalide est un bug du binaire", correct: true}
      - {text: "Une erreur journalisée, puis le service démarre sans templates et répond 500 sur ces pages", correct: false}
      - {text: "Une erreur renvoyée à chaque requête qui utilise le template, analysé à la demande", correct: false}
      - {text: "Une panique à la première requête qui utilise le template, récupérée par le serveur HTTP", correct: false}
    answer: |-
      Une panique au démarrage, via `template.Must(template.ParseFS(fichiers, "*.html"))` dans une variable de package :
      les templates font partie du binaire, une erreur est donc un bug du programme, et il vaut mieux qu'il refuse de
      démarrer (et qu'un test le vérifie en CI). Pour des templates chargés depuis le disque ou fournis par
      l'utilisateur, je renverrais une erreur.
  - key: scenario-revue
    format: scenario
    question: En revue, quels usages de panic acceptes-tu ?
    choices:
      - {text: "Un cas impossible, un invariant violé, un `Must` sur une constante, une panique récupérée dans le package", correct: true}
      - {text: "Les entrées extérieures invalides, pour arrêter tôt une requête mal formée avant tout traitement", correct: false}
      - {text: "Tout échec, du moment qu'un `recover` du handler HTTP le change en réponse 500 pour le client", correct: false}
      - {text: "Les erreurs réseau, qui ne devraient jamais arriver dans un centre de données bien géré", correct: false}
    answer: |-
      Un cas impossible signalé bruyamment (un `default` de switch sur une énumération interne), un invariant violé, un
      `Must` sur une constante à l'initialisation, et une panique interne récupérée avant de sortir du package. Je
      refuse les paniques sur des entrées extérieures, celles qui traversent une API publique, et les `recover`
      utilisés comme des `catch` pour piloter le flux normal.
  - key: must
    format: course
    question: Qu'est-ce que la convention Must ?
    choices:
      - {text: "Une variante `MustX` d'une fonction `X` qui renvoie `(T, error)`, et qui panique sur l'erreur", correct: true}
      - {text: "Une variante `MustX` qui réessaie `X` jusqu'à ce qu'elle réussisse, sans limite", correct: false}
      - {text: "Une règle de linter qui oblige à tester chaque erreur renvoyée par une fonction", correct: false}
      - {text: "Une variante `MustX` qui renvoie la valeur zéro de `T` au lieu de l'erreur", correct: false}
    answer: Une variante `MustX` d'une fonction `X` qui renvoie `(T, error)`, et qui panique sur l'erreur ; réservée à l'initialisation avec des valeurs connues, comme `regexp.MustCompile`.
  - key: scenario-api-publique
    format: scenario
    question: Tu publies une bibliothèque. Comment décides-tu, pour chaque cas d'échec, entre erreur et panique ?
    choices:
      - {text: "Une erreur documentée pour tout ce qui dépend de l'appelant ; une panique pour un mauvais usage évident", correct: true}
      - {text: "Une panique pour tout échec, à l'appelant de la récupérer s'il veut continuer après l'erreur", correct: false}
      - {text: "Une panique pour les entrées invalides, une erreur pour les pannes du réseau et du disque", correct: false}
      - {text: "Une erreur générique sans type ni sentinelle, pour garder l'API la plus petite possible", correct: false}
    answer: |-
      Tout ce qui dépend des données ou de l'environnement de l'appelant (entrées, fichiers, réseau) est une erreur
      documentée, avec des sentinelles ou des types pour les cas à distinguer. Une panique ne sort de l'API que pour un
      mauvais usage évident et documenté (un argument nil interdit, un appel après Close), comme le fait la bibliothèque
      standard. Je propose une variante `Must` seulement si l'usage à l'initialisation avec des constantes est courant.
