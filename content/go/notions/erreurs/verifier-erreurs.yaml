notion: verifier-erreurs
lesson: "Chaque erreur se **teste**, juste après l'appel :\n\n```go\nf, err := os.Open(chemin)\nif err != nil {\n\treturn fmt.Errorf(\"ouverture de %s : %w\", chemin, err)\n}\ndefer f.Close()\n```\n\nCe qu'on peut faire d'une erreur, au choix :\n- la **remonter**, en ajoutant du contexte (`%w`) ;\n- la **traiter** : réessayer, prendre une valeur par défaut, répondre une erreur HTTP ;\n- l'**ignorer explicitement**, quand c'est vraiment sans conséquence, avec `_` et un commentaire qui dit pourquoi.\n\nCe qu'on ne fait jamais : l'ignorer **en silence** (`f.Close()` sans regarder le résultat d'une écriture, `x, _ :=\nf()` par paresse). Les linters `errcheck` et `staticcheck` signalent les erreurs non vérifiées.\n\nLa répétition de `if err != nil` est le prix d'un chemin d'erreur visible. On l'allège en gardant le **chemin heureux à\ngauche** (retour anticipé, pas de `else`), et en regroupant des étapes dans une fonction qui renvoie une seule erreur.\n\nPour signaler « pas trouvé », deux idiomes : une valeur et un booléen (`v, ok := cache.Get(k)`), quand l'absence est\nnormale ; une erreur sentinelle (`ErrNotFound`), quand c'est un échec à remonter.\n\n**Piège classique** : `defer f.Close()` sur un fichier **écrit**. L'erreur de fermeture, qui peut signaler une\nécriture ratée, est perdue.\n\n**En entretien** : « Chaque erreur est testée tout de suite, remontée avec du contexte, traitée ou ignorée\nexplicitement ; jamais en silence ; errcheck en CI. »"
tour:
  - title: Vérifier chaque erreur
    text: |-
      On vérifie chaque erreur, **tout de suite**, avec `if err != nil`. Le chemin heureux reste aligné à gauche, et
      chaque erreur sort tôt de la fonction : c'est le style Go.

      Une erreur qu'on ne peut pas traiter remonte à l'appelant, de préférence avec du **contexte** :
      `fmt.Errorf("âge %q invalide : %w", saisie, err)`. Le verbe `%w` emballe l'erreur d'origine, qu'on retrouve
      ensuite avec `errors.Is` ou `errors.As`.

      Ignorer une erreur avec `_` doit rester une décision consciente, et rare.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func age(saisie string) (int, error) {
          	n, err := strconv.Atoi(saisie)
          	if err != nil {
          		return 0, fmt.Errorf("âge %q invalide : %w", saisie, err)
          	}
          	if n < 0 {
          		return 0, fmt.Errorf("âge %d négatif", n)
          	}
          	return n, nil
          }

          func main() {
          	for _, saisie := range []string{"36", "-1", "trente"} {
          		n, err := age(saisie)
          		if err != nil {
          			fmt.Println("erreur :", err)
          			continue
          		}
          		fmt.Println("âge :", n)
          	}
          }
      output: |-
        âge : 36
        erreur : âge -1 négatif
        erreur : âge "trente" invalide : strconv.Atoi: parsing "trente": invalid syntax
    task:
      instructions: |-
        `age` accepte n'importe quel âge positif. Fais-lui refuser les âges au-dessus de 150, avec l'erreur
        `âge 200 improbable` : le programme doit afficher `erreur : âge 200 improbable`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func age(saisie string) (int, error) {
          	n, err := strconv.Atoi(saisie)
          	if err != nil {
          		return 0, fmt.Errorf("âge %q invalide : %w", saisie, err)
          	}
          	return n, nil
          }

          func main() {
          	n, err := age("200")
          	if err != nil {
          		fmt.Println("erreur :", err)
          		return
          	}
          	fmt.Println("âge :", n)
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strconv"
          )

          func age(saisie string) (int, error) {
          	n, err := strconv.Atoi(saisie)
          	if err != nil {
          		return 0, fmt.Errorf("âge %q invalide : %w", saisie, err)
          	}
          	if n > 150 {
          		return 0, fmt.Errorf("âge %d improbable", n)
          	}
          	return n, nil
          }

          func main() {
          	n, err := age("200")
          	if err != nil {
          		fmt.Println("erreur :", err)
          		return
          	}
          	fmt.Println("âge :", n)
          }
      output: |-
        erreur : âge 200 improbable
cards:
  - key: developpeurs-plaignent-verbosite-if-err-nil
    format: scenario
    question: Les développeurs se plaignent de la verbosité de `if err != nil`. Qu'en penses-tu ?
    choices:
      - {text: "Un compromis assumé, qui rend chaque échec visible ; on l'allège par du contexte utile et des fonctions plus petites", correct: true}
      - {text: "Un défaut que Go corrigera bientôt avec un opérateur `?`, déjà accepté par l'équipe du langage", correct: false}
      - {text: "Une bonne raison d'ignorer avec `_` les erreurs peu probables, pour garder le code lisible", correct: false}
      - {text: "Une bonne raison de remplacer les erreurs par des paniques, rattrapées par un `recover` global", correct: false}
    answer: "La verbosité est réelle, mais c'est un compromis assumé : chaque appel qui peut échouer est visible, et la revue voit tout de suite une erreur ignorée ; l'équipe Go a d'ailleurs renoncé en 2025 à changer la syntaxe. On réduit le bruit avec un contexte utile à chaque remontée, des étapes regroupées dans une fonction qui renvoie une seule erreur, `errors.Join` pour les validations, et une « sticky error » pour une suite d'écritures (comme `bufio.Writer`)."
  - key: renvoyer-trouve-idiomatique
    format: course
    question: "Comment renvoyer « pas trouvé » en Go idiomatique ?"
    choices:
      - {text: "Un second résultat booléen `(valeur, ok)`, ou une erreur sentinelle", correct: true}
      - {text: "Une valeur zéro seule, que l'appelant compare à une valeur vide", correct: false}
      - {text: "Une panique, que l'appelant rattrape avec `recover`", correct: false}
      - {text: "Un code entier `-1`, comme `strings.Index`, quel que soit le type", correct: false}
    answer: "Un second résultat booléen `(valeur, ok)` quand l'absence est normale, ou une erreur sentinelle que l'appelant teste avec `errors.Is`. Une valeur zéro seule se confond avec une vraie valeur."
  - key: trois-choix
    format: course
    question: Que peut-on faire d'une erreur reçue ?
    choices:
      - {text: "La remonter avec contexte, la traiter, ou l'ignorer explicitement avec une justification", correct: true}
      - {text: "La journaliser puis la remonter, à chaque niveau, pour ne rien perdre", correct: false}
      - {text: "La remonter telle quelle, le contexte étant ajouté par la frontière HTTP", correct: false}
      - {text: "L'ignorer en silence quand l'appel échoue rarement en pratique", correct: false}
    answer: La remonter avec du contexte, la traiter (réessayer, valeur par défaut, réponse HTTP), ou l'ignorer explicitement avec une justification ; jamais en silence.
  - key: errcheck
    format: course
    question: Quel outil signale les erreurs non vérifiées ?
    choices:
      - {text: "`errcheck`, inclus dans golangci-lint, et certaines vérifications de staticcheck", correct: true}
      - {text: "Le compilateur, qui refuse un résultat `error` jamais lu", correct: false}
      - {text: "`gofmt`, qui signale les appels dont l'erreur est ignorée", correct: false}
      - {text: "Le détecteur de courses, lancé avec `go test -race`", correct: false}
    answer: '`errcheck` (inclus dans golangci-lint), ainsi que certaines vérifications de staticcheck.'
  - key: vf-ignorer
    format: true-false
    question: Ignorer une erreur avec `_` est acceptable quand c'est justifié et commenté.
    truth: true
    answer: Par exemple l'erreur d'un `Close` sur un fichier ouvert en lecture.
  - key: vf-compilateur
    format: true-false
    question: Le compilateur Go refuse un appel dont on n'utilise pas l'erreur renvoyée.
    truth: false
    answer: Appeler `f()` sans lire ses résultats compile ; ce sont les linters qui le signalent.
  - key: vf-else
    format: true-false
    question: Après `if err != nil { return err }`, la suite du code s'écrit dans un `else`.
    truth: false
    answer: Le chemin heureux reste à gauche, sans `else`.
  - key: vf-ok
    format: true-false
    question: Pour une absence normale (une clé de cache absente), une forme `v, ok` est souvent préférable à une erreur.
    truth: true
    answer: 'L''absence n''est pas un échec : un booléen suffit.'
  - key: qcm-silence
    format: multiple-choice
    question: "Laquelle de ces lignes ignore une erreur en silence ?"
    choices:
      - {text: "`json.Unmarshal(data, &v)` sans lire son résultat", correct: true}
      - {text: "`if err := f(); err != nil { return err }`", correct: false}
      - {text: "`_ = r.Body.Close() // lecture terminée, rien à perdre`", correct: false}
      - {text: "`if _, err := w.Write(b); err != nil { return err }`", correct: false}
    answer: "Le résultat d'erreur n'est pas lu, sans un mot ; `n, _ := strconv.Atoi(s)` sur une saisie ferait de même. Le `_ =` commenté ignore explicitement, avec une raison."
  - key: qcm-traiter
    format: multiple-choice
    question: "Quelle réaction à une entrée invalide est raisonnable dans un handler HTTP ?"
    choices:
      - {text: "Répondre 400, avec un message qui dit ce qui ne va pas", correct: true}
      - {text: "Ignorer l'erreur et répondre 200, puisque la requête est arrivée", correct: false}
      - {text: "Appeler `log.Fatal`, pour que l'erreur ne passe pas inaperçue", correct: false}
      - {text: "Répondre 500 avec `err.Error()`, le détail complet de l'erreur", correct: false}
    answer: "Une entrée invalide est la faute du client : 400. Pour une panne interne, on journalise et on répond 500 avec un message générique ; `log.Fatal` arrêterait le serveur entier."
  - key: qcm-absent
    format: multiple-choice
    question: "Lesquelles de ces façons signalent bien « produit introuvable » depuis un dépôt ?"
    choices:
      - {text: "Une erreur sentinelle `ErrProduitIntrouvable` que l'appelant teste avec `errors.Is`", correct: true}
      - {text: "Une forme `(Produit, bool)` si l'absence est un cas normal pour l'appelant", correct: true}
      - {text: "Une panique, que le handler rattrape pour répondre 404", correct: false}
      - {text: "Un produit vide sans erreur, reconnaissable à son identifiant nul", correct: false}
    answer: "Un produit vide se confondrait avec un vrai produit, et une panique transformerait un cas normal en bug."
  - key: qcm-alleger
    format: multiple-choice
    question: "Laquelle de ces techniques allège la répétition de `if err != nil` sans cacher les erreurs ?"
    choices:
      - {text: "Des retours anticipés, avec le chemin heureux à gauche", correct: true}
      - {text: "Des paniques à la place des erreurs, et un `recover` global", correct: false}
      - {text: "Un `_` pour les erreurs les moins probables", correct: false}
      - {text: "Un helper `check(err)` qui panique sur une erreur", correct: false}
    answer: "Les retours anticipés gardent le chemin heureux lisible ; regrouper des étapes dans une fonction qui renvoie une seule erreur aide aussi. La répétition est le prix d'un chemin d'erreur visible : les paniques et les `_` le cachent."
  - key: trous-retour
    format: fill-in
    question: |-
      Complète le retour avec contexte :
      ```go
      if err != nil {
      	return fmt.Errorf("lecture de %s : ___", chemin, err)
      }
      ```
    blanks:
      - - '%w'
    answer: '`%w` enveloppe l''erreur d''origine.'
  - key: trous-explicite
    format: fill-in
    question: |-
      Complète pour ignorer explicitement l'erreur :
      ```go
      ___ = conn.Close() // la connexion est déjà en erreur, rien à faire de plus
      ```
    blanks:
      - - _
    answer: Le blanc et le commentaire disent que c'est voulu.
  - key: trous-ok
    format: fill-in
    question: |-
      Complète la recherche dans le cache :
      ```go
      if v, ___ := cache.Get(cle); ok {
      	return v, nil
      }
      ```
    blanks:
      - - ok
    answer: Une absence normale se signale par un booléen.
  - key: trous-init
    format: fill-in
    question: |-
      Complète la forme courte du test :
      ```go
      if err := envoyer(m)___ err != nil {
      	return err
      }
      ```
    blanks:
      - - ;
    answer: L'initialisation dans le `if` limite la portée de `err`.
  - key: bug-close-ecriture
    format: bug-fix
    question: |-
      Un export semble réussi, mais le fichier est parfois incomplet. Quelle correction est la bonne ?
      ```go
      f, err := os.Create(chemin)
      if err != nil {
      	return err
      }
      defer f.Close()
      _, err = f.Write(donnees)
      return err
      ```
    choices:
      - {text: "Renvoyer l'erreur de `f.Close()`, qui peut signaler une écriture ratée", correct: true}
      - {text: "Appeler `f.Sync()` dans le `defer`, à la place de `f.Close()`", correct: false}
      - {text: "Remplacer `f.Write` par `fmt.Fprint(f, donnees)`, plus sûr", correct: false}
      - {text: "Ajouter un second `defer f.Close()`, au cas où le premier échoue", correct: false}
    answer: "```go\nf, err := os.Create(chemin)\nif err != nil {\n\treturn err\n}\nif _, err := f.Write(donnees); err != nil {\n\tf.Close()\n\treturn err\n}\nreturn f.Close()\n```\nL'erreur de `Close`, qui peut signaler une écriture ratée, était perdue dans le `defer`."
  - key: bug-unmarshal
    format: bug-fix
    question: |-
      Une requête mal formée crée une commande vide. Quelle correction est la bonne ?
      ```go
      var c Commande
      json.NewDecoder(r.Body).Decode(&c)
      enregistrer(c)
      ```
    choices:
      - {text: "Tester l'erreur de `Decode`, et répondre 400 si elle n'est pas nil", correct: true}
      - {text: "Vérifier après coup que `c` n'est pas égale à `Commande{}`", correct: false}
      - {text: "Remplacer `json.NewDecoder` par `json.Unmarshal`, plus strict", correct: false}
      - {text: "Appeler `enregistrer(c)` sous un `recover`, en cas de commande vide", correct: false}
    answer: "```go\nvar c Commande\nif err := json.NewDecoder(r.Body).Decode(&c); err != nil {\n\thttp.Error(w, \"commande invalide\", http.StatusBadRequest)\n\treturn\n}\nenregistrer(c)\n```\nL'erreur de décodage était ignorée en silence."
  - key: bug-else
    format: bug-fix
    question: |-
      Ce code imbrique ses tests d'erreur. Quelle réécriture est idiomatique ?
      ```go
      cfg, err := charger()
      if err == nil {
      	srv, err := demarrer(cfg)
      	if err == nil {
      		return srv.Attendre()
      	} else {
      		return err
      	}
      } else {
      	return err
      }
      ```
    choices:
      - {text: "Des retours anticipés sur `err != nil`, avec le chemin heureux à gauche", correct: true}
      - {text: "Un seul `if err == nil` qui englobe les deux appels successifs", correct: false}
      - {text: "Un `switch` sur `err`, avec un `case nil` pour le chemin heureux", correct: false}
      - {text: "Un `defer` qui teste `err` une seule fois, en fin de fonction", correct: false}
    answer: "```go\ncfg, err := charger()\nif err != nil {\n\treturn err\n}\nsrv, err := demarrer(cfg)\nif err != nil {\n\treturn err\n}\nreturn srv.Attendre()\n```\nRetours anticipés et chemin heureux à gauche."
  - key: bug-zero
    format: bug-fix
    question: |-
      Une recherche qui ne trouve rien renvoie un client vide, confondu avec un vrai client. Quelle correction est la bonne ?
      ```go
      func (d *Depot) Trouver(id int) Client {
      	c, ok := d.clients[id]
      	if !ok {
      		return Client{}
      	}
      	return c
      }
      ```
    choices:
      - {text: "Renvoyer `(Client, error)`, avec une sentinelle `ErrIntrouvable` quand l'id manque", correct: true}
      - {text: "Renvoyer `Client{ID: -1}`, un identifiant impossible qui signale l'absence", correct: false}
      - {text: "Paniquer quand l'id manque, et laisser l'appelant rattraper la panique", correct: false}
      - {text: "Journaliser « client introuvable », puis renvoyer quand même `Client{}`", correct: false}
    answer: "```go\nvar ErrIntrouvable = errors.New(\"client introuvable\")\n\nfunc (d *Depot) Trouver(id int) (Client, error) {\n\tc, ok := d.clients[id]\n\tif !ok {\n\t\treturn Client{}, ErrIntrouvable\n\t}\n\treturn c, nil\n}\n```\nL'appelant peut maintenant distinguer l'absence (`errors.Is(err, ErrIntrouvable)`)."
  - key: scenario-verbosite
    format: scenario
    question: Un nouveau venu trouve `if err != nil` trop verbeux et propose un helper qui panique. Que lui réponds-tu ?
    choices:
      - {text: "Que son helper change chaque échec attendu en arrêt du programme ; on allège plutôt par des retours anticipés", correct: true}
      - {text: "Que c'est une bonne idée, à condition de poser un `recover` global dans `main` pour tout le service", correct: false}
      - {text: "Que c'est une bonne idée pour les erreurs rares, et qu'on garde `if err != nil` pour les fréquentes", correct: false}
      - {text: "Qu'il vaut mieux ignorer les erreurs avec `_`, ce qui allège le code sans rien arrêter", correct: false}
    answer: |-
      Que ce helper transforme chaque erreur attendue en panique, donc en arrêt du programme, et cache les chemins
      d'échec. La répétition est le prix d'un code où chaque échec est visible et traité au bon endroit, avec son
      contexte. On l'allège par des retours anticipés, des fonctions plus petites qui renvoient une seule erreur, ou un
      type « sticky error » pour une séquence d'écritures (comme `bufio.Writer`). Les helpers `Must` restent réservés à
      l'initialisation, avec des valeurs connues à l'avance.
  - key: scenario-strategie
    format: scenario
    question: Comment décides-tu de remonter ou de traiter une erreur à un niveau donné ?
    choices:
      - {text: "Je la traite là où j'ai l'information pour agir, sinon je la remonte avec le contexte de ce niveau", correct: true}
      - {text: "Je la traite toujours au plus bas niveau, là où elle se produit, pour ne pas la propager", correct: false}
      - {text: "Je la remonte toujours telle quelle, sans contexte, jusqu'à `main` qui décide pour tous", correct: false}
      - {text: "Je la journalise à chaque niveau, puis je la remonte, pour en garder une trace partout", correct: false}
    answer: |-
      Je la traite là où j'ai l'information pour agir : une couche qui sait réessayer, une valeur par défaut connue, ou
      la frontière HTTP qui choisit le code de réponse. Ailleurs, je la remonte en ajoutant ce que ce niveau sait (le
      fichier, l'identifiant). Je ne journalise qu'à l'endroit où je la traite, pour ne pas avoir la même erreur cinq
      fois dans les logs.
  - key: scenario-revue
    format: scenario
    question: En revue, comment repères-tu une erreur mal gérée ?
    choices:
      - {text: "Résultats d'erreur non lus, `_` sans commentaire, double journalisation, `defer Close()` sur une écriture", correct: true}
      - {text: "Les fonctions qui ont plus de trois `if err != nil`, à remplacer par des paniques", correct: false}
      - {text: "Les messages en minuscules, à remplacer par des messages en majuscules avec un point", correct: false}
      - {text: "Les `errors.Is`, à remplacer par des comparaisons `==`, plus rapides à relire", correct: false}
    answer: |-
      Je cherche les appels dont le résultat d'erreur n'est pas lu, les `_` sans commentaire, les erreurs journalisées
      puis remontées (en double), les messages sans contexte (« erreur »), les `panic` dans du code de bibliothèque, et
      les `defer Close()` sur des écritures. En CI, golangci-lint avec `errcheck`, `errorlint` et `wrapcheck` en attrape
      beaucoup automatiquement.
  - key: absent-normal
    format: course
    question: Faut-il renvoyer une erreur quand une clé est absente d'un cache ?
    choices:
      - {text: "Pas forcément : si l'absence est normale, une forme `(valeur, bool)` suffit", correct: true}
      - {text: "Oui, toujours : une absence est un échec, à remonter comme une erreur", correct: false}
      - {text: "Non : on renvoie la valeur zéro seule, sans booléen ni erreur", correct: false}
      - {text: "Oui, une panique : l'appelant aurait dû vérifier la présence avant", correct: false}
    answer: 'Pas forcément : si l''absence est un cas normal, une forme `(valeur, bool)` suffit ; une erreur est réservée à un vrai échec à remonter.'
