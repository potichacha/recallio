notion: versions-mvs
cards:
  - key: minimal-version-selection
    format: course
    question: C'est quoi la Minimal Version Selection ?
    answer: Go choisit, pour chaque module, la plus haute des versions minimales exigées dans le graphe, pas la dernière publiée.
  - key: fichier-verrouillage-separe
    format: course
    question: Pourquoi Go n'a-t-il pas de fichier de verrouillage séparé ?
    answer: MVS rend la sélection déterministe à partir des go.mod ; go.sum garantit l'intégrité.
  - key: publier-v2-module
    format: course
    question: Comment publier une v2 d'un module ?
    answer: En changeant le chemin du module en .../v2 et en taguant v2.x.y.
  - key: pseudo-version
    format: course
    question: C'est quoi une pseudo-version ?
    answer: Une version générée pour un commit sans tag (v0.0.0-date-hash).
  - key: modifier-tag-deja-publie
    format: course
    question: Peut-on modifier un tag déjà publié ?
    answer: Non, l'empreinte est conservée par le proxy et la checksum database ; il faut publier une nouvelle version ou retract.
  - key: definition-mvs
    format: definition
    question: MVS
    answer: Minimal Version Selection, algorithme de choix des versions
