notion: versions-mvs
lesson: |-
  Les modules Go suivent la **gestion sémantique de version** : `vMAJEUR.MINEUR.CORRECTIF`.
  - un **correctif** (v1.4.2) corrige sans changer l'API ;
  - une **mineure** (v1.5.0) ajoute de façon compatible ;
  - une **majeure** (v2.0.0) casse la compatibilité.

  La règle d'**import compatibility** de Go : deux versions avec le même chemin d'import doivent être compatibles. Une
  version majeure **2 ou plus** change donc le **chemin du module** : `module github.com/exemple/lib/v2`, importé avec
  `.../lib/v2`. Les deux majeures peuvent cohabiter dans un même programme.

  Les versions **v0** n'offrent aucune garantie de compatibilité ; la v1 en est une promesse.

  **La sélection de version minimale** (MVS) : chaque module déclare la version **minimale** de chaque dépendance dont il
  a besoin. Go retient, pour chaque dépendance, la **plus grande de ces versions minimales**, jamais une version plus
  récente que ce que quelqu'un a demandé.

  ```
  A requiert C v1.2      B requiert C v1.4      C v1.7 existe
  → le programme qui utilise A et B prend C v1.4
  ```

  Conséquences :
  - le build est **reproductible** sans fichier de verrouillage : le go.mod suffit (go.sum vérifie les contenus) ;
  - une nouvelle version d'une dépendance n'arrive **jamais** toute seule : il faut un `go get` explicite ;
  - c'est simple et prévisible, sans résolution de contraintes complexe.

  Un commit sans tag s'importe avec une **pseudo-version** (`v0.0.0-20261104093000-abcdef123456`). Un tag publié ne doit
  jamais être déplacé (le proxy et la base de sommes l'ont mémorisé) : on publie une nouvelle version, et l'on peut
  **retirer** une version fautive avec la directive `retract`.

  **En entretien** : « SemVer ; /v2 dans le chemin à partir de la v2 ; MVS prend la plus grande des versions minimales
  demandées ; build reproductible sans lockfile ; pseudo-versions pour un commit ; retract plutôt que déplacer un tag. »
cards:
  - key: minimal-version-selection
    format: course
    question: C'est quoi la Minimal Version Selection ?
    answer: Go choisit, pour chaque module, la plus haute des versions minimales exigées dans le graphe, pas la dernière publiée.
  - key: fichier-verrouillage-separe
    format: course
    question: Pourquoi Go n'a-t-il pas de fichier de verrouillage séparé ?
    answer: MVS rend la sélection déterministe à partir des go.mod ; go.sum garantit l'intégrité.
  - key: publier-v2-module
    format: course
    question: Comment publier une v2 d'un module ?
    answer: En changeant le chemin du module en .../v2 et en taguant v2.x.y.
  - key: pseudo-version
    format: course
    question: C'est quoi une pseudo-version ?
    answer: Une version générée pour un commit sans tag (v0.0.0-date-hash).
  - key: modifier-tag-deja-publie
    format: course
    question: Peut-on modifier un tag déjà publié ?
    answer: Non, l'empreinte est conservée par le proxy et la checksum database ; il faut publier une nouvelle version ou retract.
  - key: definition-mvs
    format: definition
    question: MVS
    answer: Minimal Version Selection, algorithme de choix des versions
  - key: vf-mvs
    format: true-false
    question: Avec la MVS, Go choisit la version la plus récente disponible de chaque dépendance.
    truth: false
    answer: Il prend la plus grande des versions minimales demandées, jamais plus.
  - key: vf-v2
    format: true-false
    question: À partir de la v2, le chemin du module doit se terminer par /v2.
    truth: true
    answer: Une majeure différente est un chemin différent.
  - key: vf-cohabiter
    format: true-false
    question: Un même programme peut utiliser à la fois lib et lib/v2.
    truth: true
    answer: Ce sont deux chemins d'import différents.
  - key: vf-tag
    format: true-false
    question: On peut déplacer un tag v1.3.0 déjà publié vers un autre commit pour corriger une erreur.
    truth: false
    answer: Le proxy et la base de sommes l'ont mémorisé ; on publie v1.3.1 et l'on retire v1.3.0.
  - key: qcm-resolution
    format: multiple-choice
    question: A requiert C v1.2, B requiert C v1.5, la dernière version de C est v1.9. Quelle version de C est utilisée ?
    choices:
      - text: v1.5
        correct: true
      - text: v1.2
        correct: false
      - text: v1.9
        correct: false
      - text: Les deux, v1.2 et v1.5
        correct: false
    answer: La plus grande des versions minimales.
  - key: qcm-semver
    format: multiple-choice
    question: Quel numéro pour quel changement ?
    choices:
      - text: 'Corriger un bug sans changer l''API : correctif'
        correct: true
      - text: 'Ajouter une fonction : mineure'
        correct: true
      - text: 'Supprimer une fonction exportée : majeure'
        correct: true
      - text: 'Changer la signature d''une fonction : mineure'
        correct: false
    answer: Changer une signature casse les appelants.
  - key: qcm-avantages
    format: multiple-choice
    question: Quels avantages apporte la MVS ?
    choices:
      - text: Des builds reproductibles sans fichier de verrouillage
        correct: true
      - text: Pas de nouvelle version introduite à l'insu du développeur
        correct: true
      - text: Une résolution simple et prévisible
        correct: true
      - text: Toujours les derniers correctifs de sécurité automatiquement
        correct: false
    answer: Les mises à jour restent explicites (go get, Dependabot).
  - key: qcm-retract
    format: multiple-choice
    question: Tu as publié une v1.4.0 avec un bug grave. Que faire ?
    choices:
      - text: Publier une v1.4.1 corrigée
        correct: true
      - text: Ajouter `retract v1.4.0` dans le go.mod de la nouvelle version
        correct: true
      - text: Supprimer le tag v1.4.0 et le recréer
        correct: false
      - text: Demander à chaque utilisateur de vider son cache
        correct: false
    answer: retract signale aux outils de ne plus choisir cette version.
  - key: scenario-v2
    format: scenario
    question: Ta bibliothèque doit casser son API. Comment publies-tu la v2 ?
    answer: |-
      Je change le chemin dans go.mod en `module github.com/exemple/lib/v2` (sur la branche principale, ou dans un
      sous-dossier v2/), je mets à jour les imports internes, je publie le tag v2.0.0 avec des notes de migration. La v1
      reste disponible et peut recevoir des correctifs ; les utilisateurs migrent à leur rythme, et les deux versions
      peuvent même cohabiter pendant la transition.
  - key: scenario-sans-lock
    format: scenario
    question: Un développeur Node.js s'étonne qu'il n'y ait pas de package-lock.json en Go. Que lui réponds-tu ?
    answer: |-
      Avec la MVS, le go.mod suffit à déterminer exactement les versions : on prend toujours la plus grande des minimales
      déclarées, jamais une version plus récente publiée entre-temps. Le build est donc reproductible sans fichier de
      verrouillage. go.sum, lui, garantit que le contenu téléchargé est identique (sommes de contrôle), comme la partie
      intégrité d'un lockfile.
  - key: scenario-pseudo
    format: scenario
    question: Tu dois utiliser un correctif d'une dépendance qui n'a pas encore de tag. Comment fais-tu ?
    answer: |-
      `go get exemple.com/lib@<commit>` : Go enregistre une pseudo-version (`v1.4.1-0.20261104093000-abcdef123456`) qui
      désigne ce commit précis, de façon reproductible. Je note dans la pull request de revenir à une version taguée dès
      qu'elle sort. Pour une fourche, une directive replace vers mon dépôt, en attendant la fusion en amont.
  - key: scenario-v0
    format: scenario
    question: Quelle différence fais-tu entre dépendre d'une bibliothèque en v0 et en v1 ?
    answer: |-
      Une v0 ne promet aucune compatibilité : chaque mineure peut casser l'API, donc je fige la version, je lis chaque
      changement avant de monter, et j'isole la dépendance derrière une petite interface. Une v1 promet la compatibilité
      jusqu'à la v2 : les montées mineures et correctifs sont normalement sans risque, même si je garde les tests comme
      filet.
  - key: definition-semver
    format: definition
    question: version sémantique (SemVer)
    answer: Numérotation MAJEUR.MINEUR.CORRECTIF qui indique la compatibilité des changements
  - key: definition-pseudo-version
    format: definition
    question: pseudo-version
    answer: Version générée qui désigne un commit précis sans tag, avec sa date et son hash
  - key: definition-retract
    format: definition
    question: retract (go.mod)
    answer: Directive par laquelle l'auteur d'un module signale des versions à ne plus utiliser
