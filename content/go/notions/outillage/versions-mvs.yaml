notion: versions-mvs
lesson: |-
  Les modules Go suivent la **gestion sémantique de version** : `vMAJEUR.MINEUR.CORRECTIF`.
  - un **correctif** (v1.4.2) corrige sans changer l'API ;
  - une **mineure** (v1.5.0) ajoute de façon compatible ;
  - une **majeure** (v2.0.0) casse la compatibilité.

  La règle d'**import compatibility** de Go : deux versions avec le même chemin d'import doivent être compatibles. Une
  version majeure **2 ou plus** change donc le **chemin du module** : `module github.com/exemple/lib/v2`, importé avec
  `.../lib/v2`. Les deux majeures peuvent cohabiter dans un même programme.

  Les versions **v0** n'offrent aucune garantie de compatibilité ; la v1 en est une promesse.

  **La sélection de version minimale** (MVS) : chaque module déclare la version **minimale** de chaque dépendance dont il
  a besoin. Go retient, pour chaque dépendance, la **plus grande de ces versions minimales**, jamais une version plus
  récente que ce que quelqu'un a demandé.

  ```
  A requiert C v1.2      B requiert C v1.4      C v1.7 existe
  → le programme qui utilise A et B prend C v1.4
  ```

  Conséquences :
  - le build est **reproductible** sans fichier de verrouillage : le go.mod suffit (go.sum vérifie les contenus) ;
  - une nouvelle version d'une dépendance n'arrive **jamais** toute seule : il faut un `go get` explicite ;
  - c'est simple et prévisible, sans résolution de contraintes complexe.

  Un commit sans tag s'importe avec une **pseudo-version** (`v0.0.0-20261104093000-abcdef123456`). Un tag publié ne doit
  jamais être déplacé (le proxy et la base de sommes l'ont mémorisé) : on publie une nouvelle version, et l'on peut
  **retirer** une version fautive avec la directive `retract`.

  **En entretien** : « SemVer ; /v2 dans le chemin à partir de la v2 ; MVS prend la plus grande des versions minimales
  demandées ; build reproductible sans lockfile ; pseudo-versions pour un commit ; retract plutôt que déplacer un tag. »
cards:
  - key: minimal-version-selection
    format: course
    question: "Qu'est-ce que la sélection de version minimale (MVS) ?"
    choices:
      - {text: "Pour chaque module, Go prend la plus haute des versions minimales exigées dans le graphe", correct: true}
      - {text: "Pour chaque module, Go prend la dernière version publiée compatible avec les contraintes", correct: false}
      - {text: "Pour chaque module, Go prend la plus basse des versions exigées dans le graphe", correct: false}
      - {text: "Pour chaque module, Go prend la version figée dans un fichier de verrouillage", correct: false}
    answer: "Go choisit, pour chaque module, la plus haute des versions minimales exigées dans le graphe, pas la dernière publiée. Prendre la plus basse casserait le module qui exige une version plus récente."
  - key: fichier-verrouillage-separe
    format: course
    question: "Pourquoi Go n'a-t-il pas de fichier de verrouillage séparé ?"
    choices:
      - {text: "La MVS rend la sélection déterministe à partir des `go.mod`, et `go.sum` garantit l'intégrité", correct: true}
      - {text: "Parce que `go.sum` fige déjà les versions exactes, comme le ferait un `package-lock.json`", correct: false}
      - {text: "Parce que le proxy renvoie toujours la même version d'un module, quelle que soit la demande", correct: false}
      - {text: "Parce que Go prend toujours la dernière version, qu'il n'y a donc pas besoin de figer", correct: false}
    answer: "La MVS rend la sélection déterministe à partir des seuls `go.mod`, et `go.sum` garantit l'intégrité du contenu. `go.sum` ne choisit aucune version : il en vérifie le contenu."
  - key: publier-v2-module
    format: course
    question: "Comment publies-tu la v2 d'un module ?"
    choices:
      - {text: "En changeant le chemin du module en `.../v2`, puis en taguant `v2.x.y`", correct: true}
      - {text: "En taguant simplement `v2.0.0`, sans toucher au chemin du module", correct: false}
      - {text: "En créant un nouveau dépôt nommé `lib-v2`, tagué en `v1.0.0`", correct: false}
      - {text: "En ajoutant `+incompatible` au tag, pour signaler la rupture d'API", correct: false}
    answer: "En changeant le chemin du module en `.../v2` et en taguant `v2.x.y` : v1 et v2 sont deux modules distincts, qui peuvent cohabiter. Sans `/v2`, la commande `go` refuse le tag v2."
  - key: pseudo-version
    format: course
    question: "Qu'est-ce qu'une pseudo-version ?"
    choices:
      - {text: "Une version générée pour un commit sans tag, comme `v0.0.0-date-hash`", correct: true}
      - {text: "Une version de test, publiée avec un suffixe `-beta` ou `-rc`", correct: false}
      - {text: "Une version que l'auteur a retirée avec la directive `retract`", correct: false}
      - {text: "Une version locale, définie par une directive `replace`", correct: false}
    answer: "Une version générée pour un commit sans tag (`v0.0.0-date-hash`) : elle désigne ce commit de façon reproductible. Les suffixes `-rc` ou `-beta` sont de vraies préversions taguées."
  - key: modifier-tag-deja-publie
    format: course
    question: "Peut-on modifier un tag déjà publié ?"
    choices:
      - {text: "Non : le proxy et la base de sommes gardent son empreinte ; on publie une nouvelle version", correct: true}
      - {text: "Oui : il suffit de forcer le tag dans git, et les utilisateurs récupèrent le nouveau code", correct: false}
      - {text: "Oui, à condition de régénérer `go.sum` chez tous les utilisateurs du module", correct: false}
      - {text: "Oui, avec la directive `retract`, qui remplace le contenu de la version publiée", correct: false}
    answer: "Non : l'empreinte est conservée par le proxy et la base de sommes, et un contenu différent provoque une erreur de vérification. On publie une nouvelle version, et on signale l'ancienne avec `retract`."
  - key: definition-mvs
    format: definition
    question: "Que désigne le sigle MVS, dans les modules Go ?"
    choices:
      - {text: "Minimal Version Selection, l'algorithme qui choisit les versions", correct: true}
      - {text: "Module Versioning System, le format des tags de version", correct: false}
      - {text: "Module Vulnerability Scan, l'analyse menée par govulncheck", correct: false}
      - {text: "Module Vendor Sync, la copie des dépendances dans `vendor/`", correct: false}
    answer: "Minimal Version Selection, l'algorithme de choix des versions : la plus haute des versions minimales exigées."
  - key: vf-mvs
    format: true-false
    question: Avec la MVS, Go choisit la version la plus récente disponible de chaque dépendance.
    truth: false
    answer: Il prend la plus grande des versions minimales demandées, jamais plus.
  - key: vf-v2
    format: true-false
    question: À partir de la v2, le chemin du module doit se terminer par /v2.
    truth: true
    answer: Une majeure différente est un chemin différent.
  - key: vf-cohabiter
    format: true-false
    question: Un même programme peut utiliser à la fois lib et lib/v2.
    truth: true
    answer: Ce sont deux chemins d'import différents.
  - key: vf-tag
    format: true-false
    question: On peut déplacer un tag v1.3.0 déjà publié vers un autre commit pour corriger une erreur.
    truth: false
    answer: Le proxy et la base de sommes l'ont mémorisé ; on publie v1.3.1 et l'on retire v1.3.0.
  - key: qcm-resolution
    format: multiple-choice
    question: A requiert C v1.2, B requiert C v1.5, la dernière version de C est v1.9. Quelle version de C est utilisée ?
    choices:
      - text: v1.5
        correct: true
      - text: v1.2
        correct: false
      - text: v1.9
        correct: false
      - text: Les deux, v1.2 et v1.5
        correct: false
    answer: La plus grande des versions minimales.
  - key: qcm-semver
    format: multiple-choice
    question: "Tu supprimes une fonction exportée d'une bibliothèque en v1.3.2. Quelle version publies-tu ?"
    choices:
      - {text: "v2.0.0, avec le chemin `/v2`", correct: true}
      - {text: "v1.4.0", correct: false}
      - {text: "v1.3.3", correct: false}
      - {text: "v1.3.2, en déplaçant le tag", correct: false}
    answer: "Supprimer ou changer une fonction exportée casse les appelants : c'est une majeure, et en Go une v2 change le chemin du module. Ajouter une fonction est une mineure, corriger un bug un correctif."
  - key: qcm-avantages
    format: multiple-choice
    question: "Laquelle de ces promesses la MVS ne tient-elle pas ?"
    choices:
      - {text: "Les derniers correctifs de sécurité, appliqués d'office", correct: true}
      - {text: "Des builds reproductibles sans fichier de verrouillage", correct: false}
      - {text: "Aucune version nouvelle introduite à l'insu du développeur", correct: false}
      - {text: "Une résolution des versions simple et prévisible", correct: false}
    answer: "La MVS ne monte jamais une version d'elle-même : les mises à jour restent explicites (`go get`, Dependabot). En échange, les builds sont reproductibles sans fichier de verrouillage, et la résolution simple et prévisible."
  - key: qcm-retract
    format: multiple-choice
    question: "Tu as publié une v1.4.0 avec un bug grave. Lesquelles de ces actions sont les bonnes ?"
    choices:
      - text: Publier une v1.4.1 corrigée
        correct: true
      - text: Ajouter `retract v1.4.0` dans le go.mod de la nouvelle version
        correct: true
      - text: Supprimer le tag v1.4.0 et le recréer
        correct: false
      - text: Demander à chaque utilisateur de vider son cache
        correct: false
    answer: retract signale aux outils de ne plus choisir cette version.
  - key: scenario-v2
    format: scenario
    question: "Ta bibliothèque doit casser son API. Comment publies-tu la v2 ?"
    choices:
      - {text: "Chemin `github.com/exemple/lib/v2` dans `go.mod`, imports internes mis à jour, tag `v2.0.0` et notes", correct: true}
      - {text: "Un tag `v2.0.0` sur la branche principale, sans changer ni le chemin du module ni les imports", correct: false}
      - {text: "Un tag `v1.5.0` avec l'API cassée, et une note dans le changelog pour prévenir les utilisateurs", correct: false}
      - {text: "Le dernier tag `v1` déplacé sur le nouveau code, pour que tous les utilisateurs migrent d'un coup", correct: false}
    answer: "Le chemin devient `module github.com/exemple/lib/v2` (sur la branche principale ou dans un sous-dossier `v2/`), les imports internes suivent, puis le tag `v2.0.0` avec des notes de migration. La v1 reste disponible et peut recevoir des correctifs ; les deux versions peuvent cohabiter pendant la transition."
  - key: scenario-sans-lock
    format: scenario
    question: "Un développeur Node.js s'étonne qu'il n'y ait pas de package-lock.json en Go. Que lui réponds-tu ?"
    choices:
      - {text: "La MVS tire les versions exactes du `go.mod`, jamais plus récentes ; `go.sum` garantit le contenu", correct: true}
      - {text: "`go.sum` est le lockfile de Go : il fige les versions exactes, comme `package-lock.json`", correct: false}
      - {text: "Go n'a pas besoin de reproductibilité : chaque build prend la dernière version de chaque module", correct: false}
      - {text: "Le proxy fige les versions pour tout le monde, à la date du premier téléchargement du module", correct: false}
    answer: "Avec la MVS, le `go.mod` suffit à déterminer exactement les versions : la plus grande des minimales déclarées, jamais une version publiée entre-temps. Le build est reproductible sans lockfile ; `go.sum` garantit que le contenu téléchargé est identique, comme la partie intégrité d'un lockfile."
  - key: scenario-pseudo
    format: scenario
    question: "Tu dois utiliser un correctif d'une dépendance qui n'a pas encore de tag. Comment fais-tu ?"
    choices:
      - {text: "`go get exemple.com/lib@<commit>`, qui enregistre une pseudo-version de ce commit", correct: true}
      - {text: "J'attends le tag : la commande `go` ne sait dépendre que d'une version taguée", correct: false}
      - {text: "Je pose moi-même un tag `v1.4.1` sur mon clone local de la dépendance", correct: false}
      - {text: "Je copie le fichier corrigé dans `vendor/` à la main, en attendant le tag", correct: false}
    answer: "`go get exemple.com/lib@<commit>` enregistre une pseudo-version (`v1.4.1-0.20261104093000-abcdef123456`) qui désigne ce commit, de façon reproductible. Je note de revenir à une version taguée dès qu'elle sort ; pour une fourche, un `replace` vers mon dépôt en attendant la fusion."
  - key: scenario-v0
    format: scenario
    question: "Quelle différence fais-tu entre dépendre d'une bibliothèque en v0 et en v1 ?"
    choices:
      - {text: "Une v0 ne promet rien : je fige, je lis chaque montée et j'isole ; une v1 promet la compatibilité", correct: true}
      - {text: "Aucune : le chiffre majeur n'a pas de sens en Go, seules les mineures disent la compatibilité", correct: false}
      - {text: "Une v0 est plus stable qu'une v1 : elle n'a encore jamais connu de changement incompatible", correct: false}
      - {text: "Une v1 peut casser l'API à chaque mineure ; une v0 promet la compatibilité jusqu'à sa v1", correct: false}
    answer: "Une v0 ne promet aucune compatibilité : chaque mineure peut casser l'API, donc je fige la version, je lis chaque changement avant de monter et j'isole la dépendance derrière une petite interface. Une v1 promet la compatibilité jusqu'à la v2 : mineures et correctifs sont normalement sans risque, les tests restant le filet."
  - key: definition-semver
    format: definition
    question: "Que désigne la version sémantique (SemVer) ?"
    choices:
      - {text: "Une numérotation MAJEUR.MINEUR.CORRECTIF qui indique la compatibilité des changements", correct: true}
      - {text: "Une numérotation par date de publication, comme `2026.11.17`, sans promesse de compatibilité", correct: false}
      - {text: "Une version générée pour un commit sans tag, avec la date et le hash de ce commit", correct: false}
      - {text: "L'algorithme qui choisit la plus haute des versions minimales exigées dans le graphe", correct: false}
    answer: "Une numérotation MAJEUR.MINEUR.CORRECTIF qui indique la compatibilité des changements. Le commit sans tag, c'est une pseudo-version ; l'algorithme, la MVS."
  - key: definition-pseudo-version
    format: definition
    question: "Que désigne une pseudo-version, dans les modules Go ?"
    choices:
      - {text: "Une version générée qui désigne un commit précis sans tag, avec sa date et son hash", correct: true}
      - {text: "Une version que l'auteur a retirée, et que les outils ne choisissent plus d'eux-mêmes", correct: false}
      - {text: "Une numérotation MAJEUR.MINEUR.CORRECTIF qui indique la compatibilité des changements", correct: false}
      - {text: "Une préversion taguée, suffixée par `-rc.1` ou `-beta`, avant la version définitive", correct: false}
    answer: "Une version générée qui désigne un commit précis sans tag, avec sa date et son hash. Une version retirée, c'est `retract` ; une préversion porte un vrai tag."
  - key: definition-retract
    format: definition
    question: "Que désigne la directive `retract` d'un `go.mod` ?"
    choices:
      - {text: "Elle signale, de la part de l'auteur, des versions du module à ne plus utiliser", correct: true}
      - {text: "Elle supprime une version publiée du proxy et de la base de sommes de contrôle", correct: false}
      - {text: "Elle interdit, dans le module principal, une version précise d'une dépendance", correct: false}
      - {text: "Elle remplace un module par un fork ou par un chemin local sur le disque", correct: false}
    answer: "La directive par laquelle l'auteur d'un module signale des versions à ne plus utiliser ; elles restent téléchargeables. Interdire une version d'une dépendance chez soi, c'est `exclude` ; remplacer un module, `replace`."
