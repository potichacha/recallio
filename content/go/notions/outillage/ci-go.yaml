notion: ci-go
lesson: |-
  Une CI Go solide tient en quelques étapes, rapides grâce aux caches :

  ```yaml
  - uses: actions/setup-go@v6
    with:
      go-version-file: go.mod   # la même version que le module ; cache des modules et du build activé
  - run: go mod tidy && git diff --exit-code go.mod go.sum
  - run: go generate ./... && git diff --exit-code
  - run: go vet ./...
  - uses: golangci/golangci-lint-action@v8
  - run: go test -race -shuffle=on -coverprofile=couverture.out ./...
  - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  - run: go build ./...
  ```

  Chaque étape a son rôle :
  - **tidy** et **generate** vérifiés : le dépôt reflète exactement les dépendances et le code généré ;
  - **vet** et **golangci-lint** : les erreurs probables et le style ;
  - **tests avec `-race`** : les courses de données ; `-shuffle=on` révèle les dépendances entre tests ;
  - **couverture** publiée comme indicateur (pas comme seuil bloquant rigide) ;
  - **govulncheck** : les vulnérabilités atteintes, aussi dans une tâche **planifiée** ;
  - **build** de toutes les cibles nécessaires (`GOOS=windows`...) si le projet est multi-plateforme.

  Les réglages utiles : `GOFLAGS=-mod=readonly` (la CI ne modifie jamais go.mod), `GOTOOLCHAIN=local` (pas de
  téléchargement surprise d'une autre chaîne d'outils), le cache de `go build` et des modules (setup-go le fait), des
  tests d'intégration dans un job séparé (`-tags integration`, Testcontainers).

  Pour publier, **GoReleaser** construit, signe et publie binaires, archives et images à partir d'un tag.

  **En entretien** : « tidy et generate vérifiés, vet, golangci-lint, tests avec -race, couverture, govulncheck, build ;
  caches de modules et de build ; -mod=readonly ; GoReleaser pour publier. »
cards:
  - key: configuration-qualite-mets-place-nouveau-projet
    format: scenario
    question: "Quelle configuration de qualité mets-tu en place sur un nouveau projet Go ?"
    choices:
      - {text: "En CI : formatage vérifié, `go vet`, golangci-lint sur des linters choisis, `go test -race` et govulncheck", correct: true}
      - {text: "En CI : tous les linters de golangci-lint activés d'emblée, et des `//nolint` contre les faux positifs", correct: false}
      - {text: "En CI : `go vet` seul, puisque le compilateur et gofmt couvrent déjà le reste des problèmes courants", correct: false}
      - {text: "En CI : les tests seulement, sans `-race` ni linters, pour garder des pull requests rapides à valider", correct: false}
    answer: "En local, gopls, gofumpt et goimports ; en CI, formatage vérifié, `go vet`, golangci-lint sur un ensemble ciblé (staticcheck, errcheck, errorlint, gosec...), `go test -race -shuffle=on` avec couverture et govulncheck. Tout activer d'emblée produit des faux positifs : l'équipe finit par semer des `//nolint` ou par désactiver le linter."
  - key: etapes-minimales-ci
    format: course
    question: "Quelle suite d'étapes forme la CI minimale d'un projet Go ?"
    choices:
      - {text: "`go mod tidy` vérifié, `go vet`, golangci-lint, tests avec `-race`, govulncheck, build", correct: true}
      - {text: "`go get -u ./...`, `go vet`, golangci-lint, tests avec `-race`, govulncheck, build", correct: false}
      - {text: "`go mod download`, `gofmt -w .`, golangci-lint, tests sans `-race`, build", correct: false}
      - {text: "`go clean -cache`, `go vet`, tests avec `-count=1`, build, sans aucun linter", correct: false}
    answer: "tidy vérifié, vet, golangci-lint, tests avec `-race`, govulncheck, build. `go get -u` en CI changerait les versions sans revue, et `gofmt -w` corrige au lieu de vérifier."
  - key: accelerer-builds-ci
    format: course
    question: "Comment accélères-tu les builds Go en CI ?"
    choices:
      - {text: "En conservant `GOMODCACHE` et `GOCACHE` d'une exécution à l'autre", correct: true}
      - {text: "En lançant `go clean -cache` au début, pour repartir d'un état propre", correct: false}
      - {text: "En lançant `go mod download` dans chaque job, sans cache entre exécutions", correct: false}
      - {text: "En désactivant `-race` et `go vet`, qui pèsent le plus dans la durée", correct: false}
    answer: "Le cache des modules (`GOMODCACHE`) évite de retélécharger, celui de build (`GOCACHE`) de recompiler ce qui n'a pas changé. `go clean -cache` annule exactement ce gain."
  - key: verifier-mod-tidy-change-rien
    format: course
    question: "Pourquoi vérifier en CI que `go mod tidy` ne change rien ?"
    choices:
      - {text: "Pour s'assurer que `go.mod` et `go.sum` commités sont cohérents avec le code", correct: true}
      - {text: "Pour mettre à jour les dépendances vers leur dernière version mineure", correct: false}
      - {text: "Pour supprimer du cache les modules que plus aucun projet n'utilise", correct: false}
      - {text: "Pour vérifier qu'aucune dépendance n'a de vulnérabilité connue", correct: false}
    answer: "`go mod tidy` ajoute les modules importés et retire les inutiles : s'il change quelque chose, le `go.mod` commité ne correspond pas au code. Il ne met rien à jour (c'est `go get -u`) et ne cherche pas de vulnérabilités (c'est govulncheck)."
  - key: verifier-code-genere-jour
    format: course
    question: "Comment vérifies-tu en CI que le code généré est à jour ?"
    choices:
      - {text: "Lancer `go generate ./...`, puis échouer si un fichier suivi a changé", correct: true}
      - {text: "Lancer `go build ./...`, qui relance `go generate` quand une source change", correct: false}
      - {text: "Retirer le code généré du dépôt et laisser `go vet` le recréer au besoin", correct: false}
      - {text: "Comparer la date des fichiers générés à celle de leurs fichiers sources", correct: false}
    answer: "`go build` ne lance jamais `go generate` : la CI le lance elle-même, puis vérifie qu'aucun fichier n'a changé (`git diff --exit-code`). Un diff révèle un code généré oublié."
  - key: sert-goreleaser
    format: course
    question: "À quoi sert GoReleaser ?"
    choices:
      - {text: "À publier un projet depuis un tag : binaires multi-plateformes, archives, checksums, changelog", correct: true}
      - {text: "À choisir les versions des dépendances du module avant chaque nouvelle release du projet", correct: false}
      - {text: "À lancer les tests et les linters du projet sur chaque pull request ouverte dans le dépôt", correct: false}
      - {text: "À déployer le service sur Kubernetes en mettant à jour ses manifestes YAML à chaque tag", correct: false}
    answer: "GoReleaser publie un projet Go : binaires multi-plateformes, archives, sommes de contrôle, changelog, images, paquets, signatures. Il s'ajoute à la fin du pipeline, sans remplacer les tests ni les linters."
  - key: gotoolchain-local-ci
    format: course
    question: "Pourquoi fixer `GOTOOLCHAIN=local` en CI ?"
    choices:
      - {text: "Pour utiliser la version de Go installée, sans en télécharger une autre en silence", correct: true}
      - {text: "Pour compiler avec le cache local des modules, sans passer par le proxy", correct: false}
      - {text: "Pour interdire les dépendances qui ne sont pas dans le dossier `vendor/`", correct: false}
      - {text: "Pour accélérer les tests en sautant la vérification des sommes de `go.sum`", correct: false}
    answer: "Sans lui, une directive `go` ou `toolchain` du `go.mod` plus récente que le Go installé déclenche le téléchargement d'une autre version. Avec `local`, la CI garde la version qu'elle a choisie, et échoue si elle ne suffit pas."
  - key: mod-readonly
    format: course
    question: "Que fait l'option `-mod=readonly` de la commande `go` ?"
    choices:
      - {text: "Elle interdit à la commande `go` de modifier `go.mod` pendant le build", correct: true}
      - {text: "Elle interdit de télécharger des modules, en n'utilisant que `vendor/`", correct: false}
      - {text: "Elle met à jour `go.mod` d'elle-même quand un import n'y figure pas", correct: false}
      - {text: "Elle ignore `go.mod` et résout les imports depuis le `GOPATH`", correct: false}
    answer: "Avec `-mod=readonly`, le comportement par défaut, une incohérence fait échouer le build au lieu de modifier `go.mod` en silence : on corrige avec `go mod tidy` ou `go get`. C'est `-mod=vendor` qui n'utilise que `vendor/`."
  - key: resultats-test-sont-ils-mis-cache
    format: course
    question: "Les résultats de `go test` sont-ils mis en cache ?"
    choices:
      - {text: "Oui, pour les tests réussis dont les entrées n'ont pas changé ; `-count=1` l'évite", correct: true}
      - {text: "Non : `go test` recompile et relance tous les tests du package à chaque appel", correct: false}
      - {text: "Oui, échecs compris, jusqu'au prochain `go clean -testcache` lancé à la main", correct: false}
      - {text: "Oui, mais seulement en CI, quand le cache `GOCACHE` est gardé entre exécutions", correct: false}
    answer: "Oui : un test réussi dont le code, les fichiers lus et les variables d'environnement n'ont pas changé affiche `(cached)`. Les échecs ne sont pas mis en cache ; `-count=1` force la réexécution."
  - key: concois-pipeline-publication-cli-open-source
    format: scenario
    question: "Tu conçois le pipeline de publication d'une CLI Go open source. Que mets-tu en place ?"
    choices:
      - {text: "Par PR : vet, lint, tests `-race` sur plusieurs OS ; sur un tag `v*`, GoReleaser compile, signe et publie", correct: true}
      - {text: "Par PR : vet et tests ; à la release, un développeur compile sur son poste pour chaque OS et dépose les binaires", correct: false}
      - {text: "Par PR : tests sous Linux seulement ; à la release, une image Docker suffit, sans aucun binaire natif", correct: false}
      - {text: "Par commit sur `main` : GoReleaser publie une release sans tag, numérotée d'après la date du build", correct: false}
    answer: "Sur chaque PR : tidy, vet, golangci-lint, tests `-race` sur une matrice de versions de Go et d'OS, govulncheck. Sur un tag `v*` : GoReleaser compile toutes les cibles avec `-trimpath` et la version injectée, produit archives et sommes de contrôle, signe, génère le SBOM et publie la release, le tap Homebrew et l'image multi-architecture."
  - key: vf-race
    format: true-false
    question: Les tests de la CI devraient tourner avec -race.
    truth: true
    answer: C'est là qu'on attrape les courses de données.
  - key: vf-readonly
    format: true-false
    question: '`-mod=readonly` empêche la commande go de modifier go.mod pendant le build.'
    truth: true
    answer: Une dépendance manquante fait échouer au lieu d'être ajoutée en silence.
  - key: vf-cache
    format: true-false
    question: actions/setup-go peut mettre en cache les modules et le cache de build entre deux exécutions.
    truth: true
    answer: C'est activé par défaut dans les versions récentes.
  - key: vf-tidy
    format: true-false
    question: Vérifier que go mod tidy ne change rien est inutile en CI.
    truth: false
    answer: Cela garantit que go.mod et go.sum reflètent exactement le code.
  - key: qcm-etapes
    format: multiple-choice
    question: "Laquelle de ces étapes n'a pas sa place dans une CI Go ?"
    choices:
      - {text: "`go install` de chaque dépendance avant le build", correct: true}
      - {text: "`go vet ./...` puis golangci-lint sur tout le module", correct: false}
      - {text: "`go test -race ./...` sur tous les packages du module", correct: false}
      - {text: "`govulncheck ./...` sur le code et ses dépendances", correct: false}
    answer: "Le build télécharge lui-même les modules du `go.mod` ; `go install` sert à installer des commandes. Vet, lint, `-race` et govulncheck font partie d'une CI complète."
  - key: qcm-vitesse
    format: multiple-choice
    question: "Laquelle de ces mesures accélère la CI d'un projet Go sans rien sacrifier ?"
    choices:
      - {text: "Garder en cache les modules et le cache de build", correct: true}
      - {text: "Retirer `-race` de tous les tests lancés en CI", correct: false}
      - {text: "Lancer `go clean -cache` au début de chaque job", correct: false}
      - {text: "Ne lancer les linters qu'une fois par semaine", correct: false}
    answer: "Les caches évitent de retélécharger et de recompiler ; séparer les tests d'intégration dans un job parallèle aide aussi. Retirer `-race` perd la détection des data races, et vider le cache annule tout le gain."
  - key: qcm-toolchain
    format: multiple-choice
    question: "Le `go.mod` demande `go 1.27` ; la CI a Go 1.26 et fixe `GOTOOLCHAIN=local`. Que se passe-t-il ?"
    choices:
      - {text: "Le build échoue : le Go installé est trop ancien pour le module", correct: true}
      - {text: "La commande `go` télécharge Go 1.27 en silence, puis compile", correct: false}
      - {text: "Go 1.26 compile en ignorant la directive `go` du `go.mod`", correct: false}
      - {text: "Go 1.26 compile, avec un simple avertissement sur la version", correct: false}
    answer: "Avec `GOTOOLCHAIN=local`, la commande `go` refuse de télécharger une autre version : elle échoue en disant que le module demande Go 1.27. Sans ce réglage, elle aurait téléchargé Go 1.27 en silence ; la CI choisit ainsi sa version explicitement."
  - key: qcm-publication
    format: multiple-choice
    question: "Dans un pipeline, à quel moment GoReleaser intervient-il ?"
    choices:
      - {text: "À la fin, sur un tag : il compile chaque cible et publie la release", correct: true}
      - {text: "Au début, pour choisir les versions des dépendances du module", correct: false}
      - {text: "À la place des tests, qu'il lance lui-même avant de compiler", correct: false}
      - {text: "Sur chaque pull request, pour publier une release en préversion", correct: false}
    answer: "GoReleaser s'ajoute à la fin du pipeline : déclenché par un tag `v*`, il compile pour toutes les cibles, produit archives et sommes de contrôle, publie la release et les images. Les tests restent des étapes à part, avant lui."
  - key: scenario-pipeline
    format: scenario
    question: "Quelle CI mets-tu sur un service Go d'équipe ?"
    choices:
      - {text: "Par PR : tidy et code généré vérifiés, vet, lint, tests `-race` avec couverture, govulncheck, image", correct: true}
      - {text: "Par PR : tests unitaires seulement ; lint, govulncheck et image une fois par semaine, sur `main`", correct: false}
      - {text: "Par PR : tous les tests, intégration comprise, dans un seul job séquentiel, sans aucun cache", correct: false}
      - {text: "Par PR : l'image d'abord, puis les tests lancés contre l'environnement de production déployé", correct: false}
    answer: "Sur chaque PR : setup-go avec la version du `go.mod` et les caches, tidy et code généré vérifiés, vet, golangci-lint, `go test -race -shuffle=on` avec couverture, govulncheck, build de l'image ; les tests d'intégration (Testcontainers) dans un job séparé. Sur `main`, l'image publiée avec la version injectée, et govulncheck relancé chaque nuit."
  - key: scenario-lente
    format: scenario
    question: "La CI d'un gros monorepo Go prend 25 minutes. Par quoi commences-tu pour la raccourcir ?"
    choices:
      - {text: "Vérifier les caches de modules, de build et de golangci-lint, puis paralléliser les jobs", correct: true}
      - {text: "Retirer `-race` et la moitié des linters, qui pèsent le plus dans la durée du pipeline", correct: false}
      - {text: "Lancer `go clean -cache` au début, pour éviter des résultats faussés par un vieux cache", correct: false}
      - {text: "Fusionner tous les jobs en un seul, pour ne compiler le code qu'une fois par pipeline", correct: false}
    answer: "L'absence de cache explique souvent l'essentiel. Ensuite : jobs séparés pour lint, tests unitaires et intégration, tests découpés par packages, tests lents en parallèle ou derrière `-short` pour les PR, et seulement les packages touchés quand l'outillage le permet."
