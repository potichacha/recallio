notion: linters
lesson: |-
  Au-delà de `go vet`, deux outils sont la norme :

  **staticcheck** (staticcheck.dev) : un analyseur très précis, avec des familles de vérifications :
  - **SA** : des bugs (une comparaison toujours vraie, un `time.Sleep(1)`, une valeur ignorée de `append`) ;
  - **S** : des simplifications ;
  - **ST** : le style (noms, commentaires de documentation) ;
  - **QF** : des corrections rapides pour l'éditeur.

  **golangci-lint** : un **agrégateur** qui lance des dizaines de linters en parallèle avec une seule configuration
  (`.golangci.yml`) et un cache :

  ```yaml
  version: "2"
  linters:
    enable:
      - errcheck     # erreurs ignorées
      - staticcheck
      - gosec        # problèmes de sécurité
      - bodyclose    # corps de réponse HTTP non fermés
      - revive       # style
      - misspell
  ```

  Les linters les plus utiles : **errcheck** (une erreur renvoyée mais ignorée), **gosec** (SQL concaténé, `math/rand`
  pour un secret, permissions de fichiers), **bodyclose**, **contextcheck**, **nilaway** (déréférencements de nil
  possibles).

  Les bonnes pratiques :
  - une configuration **versionnée**, la même en local, dans l'éditeur (gopls) et en CI ;
  - sur une base existante, n'échouer que sur le **nouveau code** (`--new-from-rev`), puis réduire la dette ;
  - justifier chaque exception par un commentaire `//nolint:errcheck // raison`, jamais un `//nolint` global ;
  - préférer quelques linters utiles à tout activer : le bruit fait ignorer les vrais problèmes.

  `golint` est abandonné ; `revive` le remplace.

  **En entretien** : « staticcheck pour sa précision, golangci-lint pour tout regrouper ; errcheck, gosec, bodyclose ;
  une config versionnée ; sur l'existant, seulement le nouveau code ; des nolint justifiés. »
cards:
  - key: sert-gosec
    format: course
    question: À quoi sert gosec ?
    answer: Analyse statique de sécurité du code Go.
  - key: staticcheck
    format: course
    question: C'est quoi staticcheck ?
    answer: L'analyseur statique de référence de la communauté (bugs, simplifications, code mort, dépréciations).
  - key: golangci-lint
    format: course
    question: C'est quoi golangci-lint ?
    answer: Un agrégateur qui lance de nombreux linters en parallèle avec une configuration commune.
  - key: detecte-errcheck
    format: course
    question: Que détecte errcheck ?
    answer: Les erreurs retournées mais non vérifiées.
  - key: detecte-bodyclose
    format: course
    question: Que détecte bodyclose ?
    answer: Les corps de réponse HTTP non fermés.
  - key: detecte-nilaway
    format: course
    question: Que détecte nilaway ?
    answer: Les déréférencements de nil possibles, par analyse interprocédurale.
  - key: gopls
    format: course
    question: C'est quoi gopls ?
    answer: Le serveur de langage officiel de Go pour les éditeurs.
  - key: golint-encore-utilise
    format: course
    question: golint est-il encore utilisé ?
    answer: Non, il est archivé ; revive l'a remplacé.
  - key: introduire-linter-grande-base-existante
    format: course
    question: Comment introduire un linter sur une grande base existante ?
    answer: Le rendre bloquant seulement sur le nouveau code (new-from-rev) et corriger l'existant progressivement.
  - key: terme-gopls
    format: course
    question: Que désigne « gopls » ?
    answer: Serveur de langage officiel
  - key: terme-golangci-lint
    format: course
    question: Que désigne « golangci-lint » ?
    answer: Agrégateur de linters
  - key: vf-agregateur
    format: true-false
    question: golangci-lint est un agrégateur qui lance de nombreux linters avec une seule configuration.
    truth: true
    answer: Dont staticcheck, errcheck et gosec.
  - key: vf-golint
    format: true-false
    question: golint est l'outil de style recommandé aujourd'hui.
    truth: false
    answer: Il est abandonné ; revive ou les vérifications ST de staticcheck le remplacent.
  - key: vf-errcheck
    format: true-false
    question: errcheck signale les erreurs renvoyées par une fonction mais ignorées par l'appelant.
    truth: true
    answer: Par exemple un f.Close() dont l'erreur est perdue.
  - key: vf-tout-activer
    format: true-false
    question: Activer tous les linters disponibles est la meilleure configuration.
    truth: false
    answer: Le bruit et les faux positifs font ignorer les vrais problèmes.
  - key: qcm-linters
    format: multiple-choice
    question: Quel linter pour quel problème ?
    choices:
      - text: 'Une erreur ignorée : errcheck'
        correct: true
      - text: 'Une requête SQL concaténée : gosec'
        correct: true
      - text: 'Un resp.Body jamais fermé : bodyclose'
        correct: true
      - text: 'Une faute d''orthographe dans un commentaire : gosec'
        correct: false
    answer: Les fautes, c'est misspell.
  - key: qcm-existant
    format: multiple-choice
    question: Comment introduire un linter sur une grande base de code existante ?
    choices:
      - text: N'échouer que sur le nouveau code (--new-from-rev)
        correct: true
      - text: Corriger la dette existante progressivement, package par package
        correct: true
      - text: Ajouter un //nolint en tête de chaque fichier
        correct: false
      - text: Bloquer toutes les pull requests jusqu'à la correction de tout
        correct: false
    answer: On empêche d'aggraver, puis on améliore.
  - key: qcm-nolint
    format: multiple-choice
    question: Comment désactiver un signalement à un endroit précis ?
    choices:
      - text: '`//nolint:errcheck // l''erreur de Close est sans importance pour un fichier lu`'
        correct: true
      - text: Une exclusion ciblée dans .golangci.yml, avec sa raison
        correct: true
      - text: '`//nolint` sans nom ni raison'
        correct: false
      - text: Désactiver le linter pour tout le projet
        correct: false
    answer: Une exception doit être précise et justifiée.
  - key: qcm-staticcheck
    format: multiple-choice
    question: Que couvrent les familles de vérifications de staticcheck ?
    choices:
      - text: 'SA : des bugs probables'
        correct: true
      - text: 'S : des simplifications'
        correct: true
      - text: 'ST : le style'
        correct: true
      - text: 'PERF : les benchmarks'
        correct: false
    answer: QF regroupe les corrections rapides.
  - key: scenario-config
    format: scenario
    question: Quelle configuration de linters mets-tu sur un nouveau projet Go ?
    answer: |-
      golangci-lint avec un fichier .golangci.yml versionné : les linters par défaut (errcheck, govet, staticcheck,
      unused, ineffassign), plus gosec, bodyclose, revive, misspell et contextcheck, et gofmt ou gofumpt pour le format. La
      même version de golangci-lint en local (directive tool ou version figée) et en CI, où une erreur bloque la fusion.
      gopls affiche les mêmes signalements dans l'éditeur.
  - key: scenario-debat
    format: scenario
    question: Un collègue trouve les linters trop bruyants et veut les désactiver. Que proposes-tu ?
    answer: |-
      De regarder ensemble les signalements : désactiver ceux qui n'apportent rien au projet (règles de style
      discutables), garder ceux qui trouvent des bugs (errcheck, staticcheck SA, gosec, bodyclose). Les exceptions
      justifiées passent par un nolint ciblé et commenté. L'objectif est un signalement que l'on lit et corrige, pas un
      rapport ignoré.
  - key: scenario-securite
    format: scenario
    question: Comment intègres-tu l'analyse de sécurité du code Go dans la CI ?
    answer: |-
      gosec via golangci-lint pour les motifs dangereux (SQL concaténé, aléa non cryptographique, TLS sans vérification,
      chemins de fichiers fournis par l'utilisateur), govulncheck pour les vulnérabilités connues réellement atteintes
      dans les dépendances, et la CI qui échoue sur les deux. Les faux positifs de gosec sont traités par des nolint
      justifiés, relus en revue.
  - key: scenario-editeur
    format: scenario
    question: Comment fais-tu pour que les développeurs voient les problèmes avant la CI ?
    answer: |-
      gopls dans l'éditeur affiche les diagnostics de vet et de staticcheck à la frappe, et propose les corrections
      rapides. Un crochet pre-commit ou une commande `make lint` lance golangci-lint avec la même configuration que la
      CI. Le tout avec des versions figées, pour que local et CI disent la même chose.
