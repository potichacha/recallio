notion: linters
lesson: |-
  Au-delà de `go vet`, deux outils sont la norme :

  **staticcheck** (staticcheck.dev) : un analyseur très précis, avec des familles de vérifications :
  - **SA** : des bugs (une comparaison toujours vraie, un `time.Sleep(1)`, une valeur ignorée de `append`) ;
  - **S** : des simplifications ;
  - **ST** : le style (noms, commentaires de documentation) ;
  - **QF** : des corrections rapides pour l'éditeur.

  **golangci-lint** : un **agrégateur** qui lance des dizaines de linters en parallèle avec une seule configuration
  (`.golangci.yml`) et un cache :

  ```yaml
  version: "2"
  linters:
    enable:
      - errcheck     # erreurs ignorées
      - staticcheck
      - gosec        # problèmes de sécurité
      - bodyclose    # corps de réponse HTTP non fermés
      - revive       # style
      - misspell
  ```

  Les linters les plus utiles : **errcheck** (une erreur renvoyée mais ignorée), **gosec** (SQL concaténé, `math/rand`
  pour un secret, permissions de fichiers), **bodyclose**, **contextcheck**, **nilaway** (déréférencements de nil
  possibles).

  Les bonnes pratiques :
  - une configuration **versionnée**, la même en local, dans l'éditeur (gopls) et en CI ;
  - sur une base existante, n'échouer que sur le **nouveau code** (`--new-from-rev`), puis réduire la dette ;
  - justifier chaque exception par un commentaire `//nolint:errcheck // raison`, jamais un `//nolint` global ;
  - préférer quelques linters utiles à tout activer : le bruit fait ignorer les vrais problèmes.

  `golint` est abandonné ; `revive` le remplace.

  **En entretien** : « staticcheck pour sa précision, golangci-lint pour tout regrouper ; errcheck, gosec, bodyclose ;
  une config versionnée ; sur l'existant, seulement le nouveau code ; des nolint justifiés. »
cards:
  - key: sert-gosec
    format: course
    question: "À quoi sert gosec ?"
    choices:
      - {text: "À l'analyse statique de sécurité du code : SQL concaténé, aléa faible, TLS non vérifié", correct: true}
      - {text: "À chercher dans les dépendances les vulnérabilités connues et atteintes par le code", correct: false}
      - {text: "À chiffrer les secrets trouvés dans le code avant chaque commit du dépôt", correct: false}
      - {text: "À attaquer le service déployé en simulant des requêtes malveillantes", correct: false}
    answer: "gosec analyse le code Go à la recherche de motifs dangereux : SQL concaténé, aléa non cryptographique, TLS sans vérification, chemins fournis par l'utilisateur. Les vulnérabilités connues des dépendances, c'est govulncheck."
  - key: staticcheck
    format: course
    question: "Qu'est-ce que staticcheck ?"
    choices:
      - {text: "L'analyseur statique de référence : bugs, simplifications, code mort, dépréciations", correct: true}
      - {text: "Le formateur strict qui ajoute des règles de mise en forme à celles de gofmt", correct: false}
      - {text: "L'agrégateur qui lance de nombreux linters en parallèle, avec une configuration commune", correct: false}
      - {text: "Le serveur de langage officiel, qui affiche les diagnostics dans l'éditeur", correct: false}
    answer: "L'analyseur statique de référence de la communauté : bugs, simplifications, code mort, dépréciations. Le formateur strict, c'est gofumpt ; l'agrégateur, golangci-lint ; le serveur de langage, gopls."
  - key: golangci-lint
    format: course
    question: "Qu'est-ce que golangci-lint ?"
    choices:
      - {text: "Un agrégateur qui lance de nombreux linters en parallèle, avec une configuration commune", correct: true}
      - {text: "Le linter officiel de Go, livré avec la chaîne d'outils et lancé par `go vet`", correct: false}
      - {text: "Un service en ligne qui relit chaque pull request et commente le code", correct: false}
      - {text: "L'ancien linter de style de Go, archivé et remplacé depuis par revive", correct: false}
    answer: "Un agrégateur qui lance de nombreux linters (staticcheck, errcheck, gosec...) en parallèle, avec une configuration commune. L'ancien linter archivé, c'est golint."
  - key: detecte-errcheck
    format: course
    question: "Que détecte le linter errcheck ?"
    choices:
      - {text: "Les erreurs retournées mais jamais vérifiées", correct: true}
      - {text: "Les erreurs comparées avec `==` au lieu de `errors.Is`", correct: false}
      - {text: "Les messages d'erreur qui commencent par une majuscule", correct: false}
      - {text: "Les erreurs enveloppées avec `%v` au lieu de `%w`", correct: false}
    answer: "Les erreurs retournées mais non vérifiées. Comparer avec `==` ou envelopper avec `%v`, c'est le domaine d'errorlint."
  - key: detecte-bodyclose
    format: course
    question: "Que détecte le linter bodyclose ?"
    choices:
      - {text: "Les corps de réponse HTTP jamais fermés", correct: true}
      - {text: "Les fichiers ouverts avec `os.Open` jamais fermés", correct: false}
      - {text: "Les requêtes HTTP envoyées sans contexte", correct: false}
      - {text: "Les `sql.Rows` jamais fermés après une requête", correct: false}
    answer: "Un `resp.Body` jamais fermé, qui empêche de réutiliser la connexion. Les requêtes sans contexte, c'est noctx ; les `sql.Rows` non fermés, sqlclosecheck."
  - key: detecte-nilaway
    format: course
    question: "Que détecte l'outil nilaway ?"
    choices:
      - {text: "Les déréférencements de `nil` possibles, par une analyse entre fonctions", correct: true}
      - {text: "Les variables déclarées et jamais utilisées dans une fonction", correct: false}
      - {text: "Les erreurs comparées à `nil` au lieu d'être passées à `errors.Is`", correct: false}
      - {text: "Les goroutines qui ne se terminent jamais, par une analyse du code", correct: false}
    answer: "Les déréférencements de `nil` possibles, par une analyse interprocédurale : il suit les valeurs d'une fonction à l'autre."
  - key: gopls
    format: course
    question: "Qu'est-ce que gopls ?"
    choices:
      - {text: "Le serveur de langage officiel de Go, pour les éditeurs", correct: true}
      - {text: "Le formateur officiel, appelé à chaque enregistrement", correct: false}
      - {text: "Le débogueur de Go, qui pose des points d'arrêt", correct: false}
      - {text: "Le gestionnaire des versions de Go installées", correct: false}
    answer: "Le serveur de langage officiel de Go : complétion, navigation, diagnostics de vet et staticcheck dans l'éditeur. Le débogueur, c'est Delve."
  - key: golint-encore-utilise
    format: course
    question: "golint est-il encore utilisé ?"
    choices:
      - {text: "Non : il est archivé, et revive l'a remplacé", correct: true}
      - {text: "Oui : c'est le linter officiel, lancé par `go vet`", correct: false}
      - {text: "Oui, mais seulement à travers golangci-lint", correct: false}
      - {text: "Non : il a été fusionné dans gofmt", correct: false}
    answer: "Non, il est archivé ; revive l'a remplacé, avec des règles configurables."
  - key: introduire-linter-grande-base-existante
    format: course
    question: "Comment introduis-tu un linter sur une grande base de code existante ?"
    choices:
      - {text: "Bloquant sur le nouveau code (`new-from-rev`), l'existant corrigé peu à peu", correct: true}
      - {text: "Avec un `//nolint` en tête de chaque fichier existant, puis activé partout", correct: false}
      - {text: "En bloquant toutes les pull requests jusqu'à ce que tout soit corrigé", correct: false}
      - {text: "En simple avertissement, sans jamais faire échouer la CI sur ses signalements", correct: false}
    answer: "On le rend bloquant seulement sur le nouveau code (`new-from-rev`) et on corrige l'existant progressivement : on empêche d'aggraver, puis on améliore."
  - key: terme-gopls
    format: course
    question: "Dans l'outillage Go, que désigne « gopls » ?"
    choices:
      - {text: "Le serveur de langage officiel", correct: true}
      - {text: "Le formateur officiel du code", correct: false}
      - {text: "L'agrégateur de linters", correct: false}
      - {text: "Le détecteur de vulnérabilités", correct: false}
    answer: "Le serveur de langage officiel. Le formateur, c'est gofmt ; l'agrégateur, golangci-lint ; le détecteur de vulnérabilités, govulncheck."
  - key: terme-golangci-lint
    format: course
    question: "Dans l'outillage Go, que désigne « golangci-lint » ?"
    choices:
      - {text: "Un agrégateur de linters", correct: true}
      - {text: "Le serveur de langage officiel", correct: false}
      - {text: "L'analyseur lancé par `go test`", correct: false}
      - {text: "Le détecteur de vulnérabilités", correct: false}
    answer: "Un agrégateur de linters. Le serveur de langage, c'est gopls ; l'analyseur lancé par `go test`, `go vet`."
  - key: vf-agregateur
    format: true-false
    question: golangci-lint est un agrégateur qui lance de nombreux linters avec une seule configuration.
    truth: true
    answer: Dont staticcheck, errcheck et gosec.
  - key: vf-golint
    format: true-false
    question: golint est l'outil de style recommandé aujourd'hui.
    truth: false
    answer: Il est abandonné ; revive ou les vérifications ST de staticcheck le remplacent.
  - key: vf-errcheck
    format: true-false
    question: errcheck signale les erreurs renvoyées par une fonction mais ignorées par l'appelant.
    truth: true
    answer: Par exemple un f.Close() dont l'erreur est perdue.
  - key: vf-tout-activer
    format: true-false
    question: Activer tous les linters disponibles est la meilleure configuration.
    truth: false
    answer: Le bruit et les faux positifs font ignorer les vrais problèmes.
  - key: qcm-linters
    format: multiple-choice
    question: "Quel linter signale une requête SQL construite par concaténation ?"
    choices:
      - {text: "gosec", correct: true}
      - {text: "errcheck", correct: false}
      - {text: "bodyclose", correct: false}
      - {text: "misspell", correct: false}
    answer: "gosec repère le SQL concaténé. errcheck signale les erreurs ignorées, bodyclose les corps de réponse non fermés, misspell les fautes d'orthographe."
  - key: qcm-existant
    format: multiple-choice
    question: "Tu actives errcheck sur une vieille base : 600 signalements. Que fais-tu ?"
    choices:
      - {text: "N'échouer que sur le nouveau code (`--new-from-rev`), puis corriger l'existant peu à peu", correct: true}
      - {text: "Ajouter un `//nolint` en tête de chaque fichier concerné", correct: false}
      - {text: "Bloquer toutes les PR jusqu'à ce que les 600 soient corrigés", correct: false}
      - {text: "Désactiver errcheck : sur une vieille base, il ne sert plus à rien", correct: false}
    answer: "On empêche d'aggraver, puis on améliore : les nouveaux signalements bloquent, l'existant se corrige package par package. Des `//nolint` en masse cachent la dette, et tout bloquer paralyse l'équipe."
  - key: qcm-nolint
    format: multiple-choice
    question: "Comment désactives-tu un signalement de linter à un endroit précis ?"
    choices:
      - {text: "`//nolint:errcheck // l'erreur de Close est sans importance ici`", correct: true}
      - {text: "`//nolint` seul, sans nom de linter ni raison", correct: false}
      - {text: "En désactivant errcheck pour tout le projet dans `.golangci.yml`", correct: false}
      - {text: "En affectant l'erreur à `_` pour que le linter l'ignore, sans commentaire", correct: false}
    answer: "Une exception doit être précise et justifiée : le nom du linter et la raison, sur la ligne. Une exclusion ciblée dans `.golangci.yml`, avec sa raison, convient aussi ; un `//nolint` nu cache tout et n'explique rien."
  - key: qcm-staticcheck
    format: multiple-choice
    question: "Que regroupe la famille `SA` des vérifications de staticcheck ?"
    choices:
      - {text: "Des bugs probables", correct: true}
      - {text: "Des simplifications du code", correct: false}
      - {text: "Des règles de style", correct: false}
      - {text: "Des corrections rapides", correct: false}
    answer: "`SA` regroupe les bugs probables ; `S` les simplifications, `ST` le style, `QF` les corrections rapides."
  - key: scenario-config
    format: scenario
    question: "Quelle configuration de linters mets-tu sur un nouveau projet Go ?"
    choices:
      - {text: "golangci-lint avec un `.golangci.yml` versionné : linters par défaut, plus gosec, bodyclose, revive", correct: true}
      - {text: "Tous les linters de golangci-lint, avec `enable-all`, pour ne rien laisser passer dès le départ", correct: false}
      - {text: "`go vet` seul, puisque gopls affiche déjà le reste des problèmes dans l'éditeur de chacun", correct: false}
      - {text: "Chaque développeur choisit ses linters dans son éditeur, sans configuration ni contrôle en CI", correct: false}
    answer: "golangci-lint avec un `.golangci.yml` versionné : les linters par défaut (errcheck, govet, staticcheck, unused, ineffassign), plus gosec, bodyclose, revive, misspell et contextcheck, et gofmt ou gofumpt. La même version en local et en CI, où une erreur bloque la fusion ; gopls montre les mêmes signalements dans l'éditeur."
  - key: scenario-debat
    format: scenario
    question: "Un collègue trouve les linters trop bruyants et veut les désactiver. Que proposes-tu ?"
    choices:
      - {text: "Trier ensemble : couper les règles qui n'apportent rien, garder celles qui trouvent des bugs", correct: true}
      - {text: "Tout désactiver : les linters ralentissent l'équipe sans trouver de vrais problèmes", correct: false}
      - {text: "Tout garder tel quel : chaque signalement doit être corrigé, même le plus discutable", correct: false}
      - {text: "Passer les linters en avertissement, pour que la CI ne bloque plus jamais dessus", correct: false}
    answer: "Regarder ensemble les signalements : désactiver les règles de style discutables, garder celles qui trouvent des bugs (errcheck, staticcheck SA, gosec, bodyclose), et passer les exceptions justifiées par un `nolint` ciblé et commenté. Le but est un signalement qu'on lit et qu'on corrige, pas un rapport ignoré."
  - key: scenario-securite
    format: scenario
    question: "Comment intègres-tu l'analyse de sécurité du code Go dans la CI ?"
    choices:
      - {text: "gosec via golangci-lint pour les motifs dangereux, govulncheck pour les dépendances, CI bloquante", correct: true}
      - {text: "govulncheck seul : il cherche aussi dans le code du projet les motifs dangereux comme le SQL concaténé", correct: false}
      - {text: "gosec seul : il vérifie aussi les vulnérabilités connues des dépendances du module", correct: false}
      - {text: "Un audit de sécurité manuel une fois par an, sans aucun outil automatique dans la CI", correct: false}
    answer: "gosec via golangci-lint pour les motifs dangereux (SQL concaténé, aléa non cryptographique, TLS sans vérification, chemins fournis par l'utilisateur), govulncheck pour les vulnérabilités connues réellement atteintes, et la CI qui échoue sur les deux. Les faux positifs de gosec passent par des `nolint` justifiés, relus en revue."
  - key: scenario-editeur
    format: scenario
    question: "Comment fais-tu pour que les développeurs voient les problèmes avant la CI ?"
    choices:
      - {text: "gopls à la frappe, et `make lint` ou un pre-commit avec la configuration et la version de la CI", correct: true}
      - {text: "Rien en local : la CI est la seule source de vérité, chacun lit ses rapports après le push", correct: false}
      - {text: "Une configuration de linters propre à chaque poste, plus stricte que celle de la CI", correct: false}
      - {text: "Le `go vet` lancé par `go test` suffit : il exécute déjà tous les linters du projet", correct: false}
    answer: "gopls affiche à la frappe les diagnostics de vet et de staticcheck, avec des corrections rapides. Un crochet pre-commit ou `make lint` lance golangci-lint avec la configuration de la CI ; les versions figées font dire la même chose au local et à la CI."
