notion: linters
cards:
  - key: sert-gosec
    format: course
    question: À quoi sert gosec ?
    answer: Analyse statique de sécurité du code Go.
  - key: staticcheck
    format: course
    question: C'est quoi staticcheck ?
    answer: L'analyseur statique de référence de la communauté (bugs, simplifications, code mort, dépréciations).
  - key: golangci-lint
    format: course
    question: C'est quoi golangci-lint ?
    answer: Un agrégateur qui lance de nombreux linters en parallèle avec une configuration commune.
  - key: detecte-errcheck
    format: course
    question: Que détecte errcheck ?
    answer: Les erreurs retournées mais non vérifiées.
  - key: detecte-bodyclose
    format: course
    question: Que détecte bodyclose ?
    answer: Les corps de réponse HTTP non fermés.
  - key: detecte-nilaway
    format: course
    question: Que détecte nilaway ?
    answer: Les déréférencements de nil possibles, par analyse interprocédurale.
  - key: gopls
    format: course
    question: C'est quoi gopls ?
    answer: Le serveur de langage officiel de Go pour les éditeurs.
  - key: golint-encore-utilise
    format: course
    question: golint est-il encore utilisé ?
    answer: Non, il est archivé ; revive l'a remplacé.
  - key: introduire-linter-grande-base-existante
    format: course
    question: Comment introduire un linter sur une grande base existante ?
    answer: Le rendre bloquant seulement sur le nouveau code (new-from-rev) et corriger l'existant progressivement.
  - key: terme-gopls
    format: course
    question: Que désigne « gopls » ?
    answer: Serveur de langage officiel
  - key: terme-golangci-lint
    format: course
    question: Que désigne « golangci-lint » ?
    answer: Agrégateur de linters
