notion: go-kubernetes
lesson: |-
  Un service Go s'intègre bien à Kubernetes, à condition de régler quelques points :

  **Les sondes** :
  - **readiness** (disponibilité) : le pod peut-il recevoir du trafic ? Elle peut vérifier les dépendances
    indispensables (base joignable) et passe à faux pendant l'arrêt ;
  - **liveness** (vivacité) : le processus est-il bloqué ? Elle doit rester **simple** (répondre 200) : si elle vérifie la
    base, une panne de base fait **redémarrer** tous les pods en boucle, ce qui aggrave la situation ;
  - **startup** : laisse le temps à un démarrage lent avant que la liveness ne s'applique.

  **L'arrêt gracieux** : à SIGTERM, faire échouer la readiness, attendre quelques secondes (retrait des points
  d'accès), `srv.Shutdown` avec un délai inférieur à `terminationGracePeriodSeconds`, puis fermer les dépendances.

  **Les ressources** :
  - mémoire : une **limite** est conseillée, et **`GOMEMLIMIT`** autour de 90 % de cette limite, pour que le GC
    accélère avant l'OOMKill (avec l'API descendante : `resourceFieldRef: limits.memory`) ;
  - CPU : depuis **Go 1.25**, GOMAXPROCS suit la limite CPU du conteneur ; beaucoup d'équipes ne fixent qu'une
    **demande** CPU pour éviter le bridage (*throttling*).

  **L'écosystème** : Kubernetes est lui-même écrit en Go. **client-go** est le client officiel ; les **opérateurs**
  (contrôleurs qui gèrent des ressources personnalisées) s'écrivent avec **controller-runtime** et **Kubebuilder**,
  autour d'une **boucle de réconciliation** : lire l'état voulu, comparer à l'état réel, agir, recommencer.

  **En entretien** : « Readiness avec les dépendances, liveness simple ; arrêt gracieux sur SIGTERM ; GOMEMLIMIT sous la
  limite mémoire ; GOMAXPROCS suit le CPU depuis Go 1.25 ; client-go et controller-runtime pour les opérateurs. »
cards:
  - key: liveness-vs-readiness
    format: course
    question: "Quelle différence entre la sonde liveness et la sonde readiness ?"
    choices:
      - {text: "Liveness : le processus est vivant, sans dépendance ; readiness : il est prêt à recevoir du trafic", correct: true}
      - {text: "Liveness : il est prêt à recevoir du trafic ; readiness : le processus est vivant, sans dépendance", correct: false}
      - {text: "Liveness : toutes ses dépendances répondent ; readiness : son démarrage est entièrement terminé", correct: false}
      - {text: "Aucune : ce sont deux noms de la même sonde, l'un pour une sonde HTTP, l'autre pour une sonde TCP", correct: false}
    answer: "Une liveness en échec fait redémarrer le pod ; une readiness en échec le retire du trafic sans le redémarrer. C'est pourquoi les dépendances se vérifient dans la readiness."
  - key: liveness-doit-verifier-base
    format: course
    question: "Pourquoi une sonde liveness ne doit-elle pas vérifier la base de données ?"
    choices:
      - {text: "Une panne de base redémarrerait tous les pods en cascade, sans rien résoudre", correct: true}
      - {text: "Parce que Kubernetes interdit les appels réseau dans une sonde liveness", correct: false}
      - {text: "Parce qu'un ping de la base est trop lent pour le délai d'une sonde", correct: false}
      - {text: "Parce que la base surveille déjà la santé des pods qui s'y connectent", correct: false}
    answer: "Une panne de base ferait échouer la liveness de tous les pods, qui redémarreraient en cascade sans rien résoudre. La base se vérifie dans la readiness, qui retire le pod du trafic sans le redémarrer."
  - key: regler-gomemlimit-kubernetes
    format: course
    question: "Comment règles-tu `GOMEMLIMIT` dans Kubernetes ?"
    choices:
      - {text: "À environ 90 % de la limite mémoire du conteneur, via la Downward API", correct: true}
      - {text: "À la limite mémoire exacte du conteneur, pour en utiliser chaque octet", correct: false}
      - {text: "Au double de la limite mémoire, puisque le GC libère la moitié du tas", correct: false}
      - {text: "Je ne le règle pas : Go le lit seul dans le cgroup depuis Go 1.25", correct: false}
    answer: "À environ 90 % de la limite, via la Downward API ou une bibliothèque comme automemlimit : le GC accélère avant l'OOMKill, avec une marge pour la mémoire que le runtime ne gère pas. Go 1.25 règle `GOMAXPROCS` d'après le cgroup, pas `GOMEMLIMIT`."
  - key: client
    format: course
    question: "Qu'est-ce que client-go ?"
    choices:
      - {text: "La bibliothèque Go officielle pour parler à l'API Kubernetes", correct: true}
      - {text: "Le binaire `kubectl`, réécrit en Go pour les scripts d'administration", correct: false}
      - {text: "L'outil qui génère le squelette d'un opérateur et ses CRD", correct: false}
      - {text: "Le cache local de ressources alimenté par un watch de l'API", correct: false}
    answer: "La bibliothèque Go officielle pour parler à l'API Kubernetes : clients typés, informers, files de travail. Le squelette d'un opérateur, c'est Kubebuilder ; le cache alimenté par un watch, un informer."
  - key: informer
    format: course
    question: "Qu'est-ce qu'un informer, dans client-go ?"
    choices:
      - {text: "Un cache local de ressources alimenté par un watch, qui notifie les changements", correct: true}
      - {text: "Un webhook qui valide les ressources avant leur écriture dans etcd", correct: false}
      - {text: "Une sonde qui signale à Kubernetes que le pod est prêt à recevoir du trafic", correct: false}
      - {text: "Un client qui interroge l'API à intervalle fixe, sans aucun cache local", correct: false}
    answer: "Un cache local de ressources Kubernetes alimenté par un watch, avec des notifications d'événements : le contrôleur lit le cache au lieu d'interroger l'API à chaque fois."
  - key: boucle-reconciliation
    format: course
    question: "Qu'est-ce qu'une boucle de réconciliation ?"
    choices:
      - {text: "Comparer l'état désiré à l'état réel et agir pour les rapprocher, de façon idempotente", correct: true}
      - {text: "Rejouer dans l'ordre chaque événement reçu, une seule fois, pour reconstruire l'état", correct: false}
      - {text: "Redémarrer le pod tant que sa sonde liveness échoue, jusqu'à ce qu'elle réponde", correct: false}
      - {text: "Recopier régulièrement l'état réel du cluster dans la spécification des ressources", correct: false}
    answer: "Comparer l'état désiré et l'état réel et agir pour les rapprocher, de façon idempotente : relancée deux fois, elle fait la même chose. Elle ne dépend pas de l'événement qui l'a déclenchée."
  - key: sert-finalizer
    format: course
    question: "À quoi sert un finalizer Kubernetes ?"
    choices:
      - {text: "À faire un nettoyage, de ressources externes par exemple, avant la suppression d'un objet", correct: true}
      - {text: "À supprimer d'office les objets enfants quand leur objet propriétaire disparaît", correct: false}
      - {text: "À exécuter du code Go à l'arrêt du pod, juste après la réception de SIGTERM", correct: false}
      - {text: "À valider un objet avant son écriture, et refuser une spécification invalide", correct: false}
    answer: "À exécuter un nettoyage (ressources externes) avant la suppression effective d'un objet : l'objet reste en suppression tant que son finalizer n'est pas retiré. Les objets enfants, eux, suivent leurs références de propriétaire."
  - key: kubebuilder-vs-controller-runtime
    format: course
    question: "Quelle différence entre Kubebuilder et controller-runtime ?"
    choices:
      - {text: "controller-runtime est la bibliothèque ; Kubebuilder génère le projet, les CRD et le code au-dessus", correct: true}
      - {text: "Kubebuilder est la bibliothèque ; controller-runtime génère le projet, les CRD et le code au-dessus", correct: false}
      - {text: "Deux bibliothèques concurrentes, l'une de Google, l'autre de Red Hat, sans aucun lien entre elles", correct: false}
      - {text: "controller-runtime tourne dans le cluster ; Kubebuilder est le même code, lancé hors du cluster", correct: false}
    answer: "controller-runtime est la bibliothèque de contrôleurs ; Kubebuilder est l'outil qui génère le projet, les CRD et le code au-dessus d'elle."
  - key: tester-operateur
    format: course
    question: "Comment testes-tu un opérateur Kubernetes ?"
    choices:
      - {text: "Avec envtest, qui démarre un vrai API server et un etcd locaux", correct: true}
      - {text: "Avec `httptest`, en simulant chaque réponse de l'API à la main", correct: false}
      - {text: "Seulement sur le cluster de production, seul fidèle au réel", correct: false}
      - {text: "Avec `go vet`, qui vérifie la logique de la réconciliation", correct: false}
    answer: "Avec envtest, qui démarre un vrai API server et etcd locaux, sans nœuds : les CRD, la validation et les watchs se comportent comme en vrai. Un client factice suffit pour des tests unitaires rapides."
  - key: deployer-aws-lambda
    format: course
    question: "Comment déploies-tu du Go sur AWS Lambda ?"
    choices:
      - {text: "Un binaire nommé `bootstrap` sur le runtime `provided.al2023`, avec aws-lambda-go", correct: true}
      - {text: "Le code source sur le runtime `go1.x`, compilé par AWS à chaque démarrage à froid", correct: false}
      - {text: "Une image JVM qui embarque le binaire Go, sur le runtime Java géré par AWS", correct: false}
      - {text: "Une bibliothèque `.so` chargée par le runtime Node.js, qui appelle le code Go", correct: false}
    answer: "Un binaire nommé `bootstrap` sur le runtime `provided.al2023`, avec aws-lambda-go. L'ancien runtime `go1.x` est retiré : Go passe par un runtime personnalisé, et AWS ne compile rien."
  - key: terme-client
    format: course
    question: "Dans l'écosystème Kubernetes, que désigne le nom « client-go » ?"
    choices:
      - {text: "La bibliothèque officielle pour l'API Kubernetes", correct: true}
      - {text: "La bibliothèque de contrôleurs, base de Kubebuilder", correct: false}
      - {text: "L'outil qui génère le squelette d'un opérateur", correct: false}
      - {text: "L'API server et l'etcd locaux lancés pour les tests", correct: false}
    answer: "La bibliothèque officielle pour l'API Kubernetes. La bibliothèque de contrôleurs, c'est controller-runtime ; le générateur, Kubebuilder ; l'API server de test, envtest."
  - key: terme-controller-runtime
    format: course
    question: "Dans l'écosystème Kubernetes, que désigne le nom « controller-runtime » ?"
    choices:
      - {text: "La bibliothèque de contrôleurs Kubernetes, base de Kubebuilder", correct: true}
      - {text: "La bibliothèque officielle de bas niveau pour l'API Kubernetes", correct: false}
      - {text: "Le runtime de conteneurs qui lance les pods sur chaque nœud", correct: false}
      - {text: "L'outil qui génère le squelette d'un opérateur et ses CRD", correct: false}
    answer: "La bibliothèque de contrôleurs Kubernetes, sur laquelle Kubebuilder génère son code. La bibliothèque de bas niveau, c'est client-go ; le runtime de conteneurs, containerd par exemple."
  - key: vf-liveness
    format: true-false
    question: La sonde liveness devrait vérifier que la base de données répond.
    truth: false
    answer: Une panne de base ferait redémarrer tous les pods en boucle ; la readiness s'en charge.
  - key: vf-readiness-arret
    format: true-false
    question: Pendant l'arrêt gracieux, la sonde readiness doit passer à faux.
    truth: true
    answer: Pour que le pod soit retiré des points d'accès.
  - key: vf-gomemlimit
    format: true-false
    question: GOMEMLIMIT peut être fixé à partir de la limite mémoire du pod avec l'API descendante.
    truth: true
    answer: resourceFieldRef sur limits.memory, avec un divisor ou un calcul au démarrage pour garder une marge.
  - key: vf-go-k8s
    format: true-false
    question: Kubernetes est écrit en Go.
    truth: true
    answer: Comme Docker, etcd, Prometheus et Terraform.
  - key: qcm-sondes
    format: multiple-choice
    question: "Que doit vérifier la sonde readiness d'un service Go ?"
    choices:
      - {text: "Les dépendances indispensables pour servir du trafic", correct: true}
      - {text: "Seulement que le processus répond, sans dépendance", correct: false}
      - {text: "Que tous les services appelés répondent, même optionnels", correct: false}
      - {text: "Que le démarrage est terminé, une seule fois au lancement", correct: false}
    answer: "La readiness vérifie ce sans quoi le pod ne peut pas servir, comme la base : en échec, il sort du trafic sans redémarrer. La liveness vérifie seulement que le processus répond, la startup que le démarrage est fini ; un service optionnel en panne ne doit pas retirer le pod."
  - key: qcm-ressources
    format: multiple-choice
    question: "Depuis Go 1.25, comment `GOMAXPROCS` est-il réglé dans un pod qui a une limite CPU ?"
    choices:
      - {text: "Le runtime le règle d'après la limite CPU du cgroup", correct: true}
      - {text: "Il vaut le nombre de cœurs du nœud, comme avant", correct: false}
      - {text: "Il vaut 1 tant qu'on ne le fixe pas à la main", correct: false}
      - {text: "Il vaut la demande CPU du pod, lue dans l'API", correct: false}
    answer: "Depuis Go 1.25, `GOMAXPROCS` suit la limite CPU du cgroup, et se met à jour si elle change. Avant, il valait le nombre de cœurs du nœud, d'où du bridage ; automaxprocs corrigeait cela."
  - key: qcm-arret
    format: multiple-choice
    question: "Ton service Go reçoit SIGTERM dans Kubernetes. Que fait-il ?"
    choices:
      - {text: "Il fait échouer sa readiness, attend quelques secondes, puis appelle `Shutdown`", correct: true}
      - {text: "Il quitte aussitôt avec `os.Exit(0)`, puisque le pod va être supprimé", correct: false}
      - {text: "Il ignore le signal et continue de servir jusqu'au SIGKILL", correct: false}
      - {text: "Il appelle `Shutdown` avec un délai plus long que le délai de grâce", correct: false}
    answer: "La readiness en échec retire le pod des endpoints ; quelques secondes plus tard, `Shutdown` finit les requêtes en cours, avec un délai inférieur au délai de grâce (30 s par défaut). `os.Exit` couperait les requêtes en cours."
  - key: qcm-operateur
    format: multiple-choice
    question: "Qu'est-ce qu'un opérateur Kubernetes ?"
    choices:
      - {text: "Un contrôleur qui gère une ressource personnalisée (CRD) par réconciliation", correct: true}
      - {text: "Un administrateur humain chargé d'exploiter le cluster au quotidien", correct: false}
      - {text: "Un plugin de `kubectl` qui ajoute des sous-commandes à l'outil", correct: false}
      - {text: "Un webhook qui valide les ressources avant leur écriture dans etcd", correct: false}
    answer: "Un contrôleur qui gère une ressource personnalisée (CRD) par une boucle de réconciliation, qui rapproche l'état réel de l'état voulu. controller-runtime et Kubebuilder en fournissent le squelette."
  - key: scenario-sondes
    format: scenario
    question: "Comment implémentes-tu les sondes d'un service Go qui dépend de PostgreSQL ?"
    choices:
      - {text: "`/livez` répond 200 sans rien vérifier ; `/readyz` fait un `PingContext` court et échoue dès l'arrêt", correct: true}
      - {text: "`/livez` et `/readyz` font tous deux un `PingContext` sur la base, pour détecter toute panne", correct: false}
      - {text: "`/livez` fait un `PingContext` sur la base ; `/readyz` répond 200 dès que le serveur écoute", correct: false}
      - {text: "Une seule route `/health`, qui vérifie la base et sert de liveness comme de readiness", correct: false}
    answer: "`/livez` répond 200 sans rien vérifier : si le processus répond, il vit. `/readyz` vérifie `db.PingContext` avec un délai court, et un drapeau atomique passé à faux au début de l'arrêt. Une sonde startup si le démarrage est long ; les deux routes passent avant l'authentification et ne sont pas journalisées."
  - key: scenario-oom
    format: scenario
    question: "Ton service est régulièrement OOMKilled sous charge. Que vérifies-tu d'abord côté Go ?"
    choices:
      - {text: "Que `GOMEMLIMIT` est réglé un peu sous la limite du pod, puis le tas vivant et les fuites de goroutines", correct: true}
      - {text: "Que `GOGC=off` est bien posé, pour que le GC cesse de consommer de la mémoire pendant la charge", correct: false}
      - {text: "Que `GOMAXPROCS` est assez haut pour que le GC libère la mémoire plus vite, sur tous les cœurs", correct: false}
      - {text: "Que le code appelle `runtime.GC()` assez souvent, à chaque requête par exemple, pour libérer le tas", correct: false}
    answer: "Sans `GOMEMLIMIT`, le tas peut doubler entre deux cycles du GC (`GOGC=100`) et dépasser la limite du pod. Ensuite, le tas vivant (profil heap, métriques runtime) : s'il approche la limite, on réduit la mémoire (caches bornés, flux) ou on augmente la limite ; et les fuites de goroutines."
  - key: scenario-throttling
    format: scenario
    question: "Ton service a une latence en dents de scie et des métriques de throttling CPU. Que fais-tu ?"
    choices:
      - {text: "Passer à Go 1.25 ou plus (ou automaxprocs) pour que `GOMAXPROCS` suive la limite CPU, et revoir la limite", correct: true}
      - {text: "Fixer `GOMAXPROCS` au double des cœurs du nœud, pour paralléliser davantage le travail du service", correct: false}
      - {text: "Désactiver le GC avec `GOGC=off`, puisque ses pauses expliquent à elles seules les dents de scie", correct: false}
      - {text: "Ajouter des `runtime.Gosched()` dans les boucles chaudes, pour céder la main plus souvent", correct: false}
    answer: "Avant Go 1.25, `GOMAXPROCS` valait le nombre de cœurs du nœud : trop de threads consommaient le quota, puis étaient bridés. Go 1.25 ou plus (ou automaxprocs), `GOMAXPROCS` journalisé au démarrage, et la limite CPU revue : souvent, une demande sans limite évite le bridage, au prix d'une isolation moindre."
  - key: scenario-operateur
    format: scenario
    question: "Comment abordes-tu l'écriture d'un opérateur Kubernetes en Go ?"
    choices:
      - {text: "Kubebuilder sur controller-runtime, un `Reconcile` idempotent, des finalizers, et envtest pour tester", correct: true}
      - {text: "client-go seul, avec un traitement dédié à chaque type d'événement reçu, appliqué une seule fois", correct: false}
      - {text: "Un script qui lance `kubectl apply` en boucle, toutes les minutes, sur les manifestes voulus", correct: false}
      - {text: "Un `Reconcile` qui crée les objets enfants à chaque appel, sans lire leur état actuel avant", correct: false}
    answer: "Kubebuilder génère le squelette (CRD, contrôleur, webhooks) sur controller-runtime. `Reconcile` est idempotent : lire la ressource, calculer l'état voulu, créer ou mettre à jour les enfants (avec références de propriétaire), mettre à jour le statut, redemander une réconciliation au besoin. Les finalizers nettoient, envtest teste contre un vrai API server."
