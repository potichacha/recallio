notion: directive-tool
lesson: "Depuis **Go 1.24**, le go.mod peut suivre les **outils** du projet (générateurs, linters) avec la directive **`tool`** :\n\n```\ngo get -tool golang.org/x/tools/cmd/stringer@v0.37.0\ngo get -tool github.com/sqlc-dev/sqlc/cmd/sqlc\n```\n\n```\ntool (\n\tgithub.com/sqlc-dev/sqlc/cmd/sqlc\n\tgolang.org/x/tools/cmd/stringer\n)\n```\n\nOn les lance avec **`go tool`** :\n\n```\ngo tool stringer -type=Statut\ngo tool sqlc generate\n```\n\nCe que ça change :\n- la **version** de chaque outil est fixée dans go.mod et vérifiée par go.sum, comme une dépendance : toute l'équipe\n  et la CI utilisent exactement la même ;\n- plus besoin du fichier `tools.go` avec des imports `_` et une contrainte `//go:build tools`, l'astuce utilisée\n  avant ;\n- plus besoin d'installer l'outil globalement avec `go install` ;\n- `go get -tool outil@none` le retire, `go get tool` met à jour tous les outils.\n\nLa contrepartie : les dépendances des outils rejoignent le **graphe** du module (sans être compilées dans le binaire\nde l'application), ce qui peut faire monter des versions partagées. Pour un outil lourd aux nombreuses dépendances, un\n**module séparé** (`tools/go.mod`) avec `go tool -modfile=tools/go.mod` reste possible.\n\nAvec `go:generate`, cela donne des générations reproductibles : `//go:generate go tool stringer -type=Statut`.\n\n**En entretien** : « go get -tool ajoute un outil au go.mod, go tool le lance ; version fixée et vérifiée pour toute\nl'équipe ; remplace l'astuce tools.go ; attention aux dépendances partagées. »"
cards:
  - key: apporte-directive-tool-1-24
    format: course
    question: "Qu'apporte la directive `tool` du `go.mod` (Go 1.24) ?"
    choices:
      - {text: "Déclarer les outils du projet dans `go.mod` et les lancer avec `go tool`, sans `tools.go`", correct: true}
      - {text: "Installer les outils du projet dans `$GOPATH/bin` à chaque `go build`, sans commande en plus", correct: false}
      - {text: "Lancer les outils déclarés avant chaque compilation, comme le ferait `go generate`", correct: false}
      - {text: "Compiler les outils dans le binaire de l'application, pour les livrer avec elle", correct: false}
    answer: "La directive `tool` déclare les outils dans `go.mod`, à une version fixée pour toute l'équipe, et `go tool nom` les lance. Elle remplace l'astuce du fichier `tools.go` ; elle ne lance rien d'elle-même au build."
  - key: avant
    format: course
    question: "Comment suivait-on la version des outils avant la directive `tool` ?"
    choices:
      - {text: "Avec un fichier `tools.go` marqué `//go:build tools`, qui importait les outils avec `_`", correct: true}
      - {text: "Avec un fichier `tools.txt` à la racine, lu par `go install` pour fixer les versions", correct: false}
      - {text: "Avec une section `[tools]` du `go.mod`, lue par `go install` sans fichier Go en plus", correct: false}
      - {text: "Avec un `go.work` réservé aux outils, à côté du `go.mod` principal du projet", correct: false}
    answer: "Un fichier `tools.go`, marqué `//go:build tools`, importait les outils avec `_` pour qu'ils apparaissent dans `go.mod` ; on les lançait ensuite avec `go install` ou `go run outil`, à la version du `go.mod`."
  - key: lancer
    format: course
    question: "Comment lance-t-on un outil déclaré avec la directive `tool` ?"
    choices:
      - {text: "Avec `go tool nom`, comme `go tool stringer`, qui le compile à la version du `go.mod`", correct: true}
      - {text: "Avec `go run nom`, qui va chercher la dernière version de l'outil sur le proxy", correct: false}
      - {text: "Avec `go install nom`, puis le binaire installé dans `$GOPATH/bin`, sans version fixée", correct: false}
      - {text: "Avec `go generate nom`, qui exécute l'outil déclaré à la place des directives", correct: false}
    answer: "`go tool nom` (le dernier élément du chemin, par exemple `go tool stringer`) compile l'outil à la version du `go.mod` et met le binaire en cache."
  - key: dependances
    format: course
    question: "Quel inconvénient a la directive `tool` pour un outil aux nombreuses dépendances ?"
    choices:
      - {text: "Ses dépendances entrent dans le graphe du module et peuvent faire monter des versions partagées", correct: true}
      - {text: "Ses dépendances sont compilées dans le binaire de l'application, qui grossit d'autant", correct: false}
      - {text: "L'outil est recompilé à chaque `go tool`, ce qui le rend lent à chaque lancement", correct: false}
      - {text: "Ses dépendances échappent à `go.sum`, et ne sont donc pas vérifiées au téléchargement", correct: false}
    answer: "Ses dépendances entrent dans le graphe du module, et la sélection de version minimale peut faire monter des versions partagées avec l'application. Un module séparé pour les outils (`go tool -modfile`) évite ce mélange ; le binaire de l'application, lui, ne change pas."
  - key: vf-version
    format: true-false
    question: La directive tool fixe la version de l'outil dans go.mod, vérifiée par go.sum.
    truth: true
    answer: Toute l'équipe utilise la même version.
  - key: vf-binaire
    format: true-false
    question: Les outils déclarés par tool sont compilés dans le binaire de l'application.
    truth: false
    answer: Ils sont seulement dans le graphe de dépendances du module.
  - key: vf-version-go
    format: true-false
    question: La directive tool existe depuis Go 1.21.
    truth: false
    answer: Depuis Go 1.24.
  - key: vf-install
    format: true-false
    question: Avec la directive tool, il n'est plus nécessaire d'installer l'outil globalement.
    truth: true
    answer: go tool le compile et le met en cache.
  - key: qcm-commandes
    format: multiple-choice
    question: "Laquelle de ces commandes n'est pas valide ?"
    choices:
      - {text: "`go install -tool stringer`", correct: true}
      - {text: "`go get -tool golang.org/x/tools/cmd/stringer`", correct: false}
      - {text: "`go tool stringer -type=Statut`", correct: false}
      - {text: "`go get -tool golang.org/x/tools/cmd/stringer@none`", correct: false}
    answer: "`go get -tool` ajoute l'outil (et `@none` le retire), `go tool stringer` le lance. `go install` n'a pas d'option `-tool` ; `go install tool` installe tous les outils du module."
  - key: qcm-avantages
    format: multiple-choice
    question: "Quel avantage apporte la directive `tool` ?"
    choices:
      - {text: "La même version d'outil pour l'équipe et la CI", correct: true}
      - {text: "Des outils plus rapides à l'exécution", correct: false}
      - {text: "Des outils compilés dans le binaire de l'application", correct: false}
      - {text: "Des outils lancés sans compilation ni téléchargement", correct: false}
    answer: "La version de l'outil est fixée dans `go.mod` : l'équipe, la CI et les `go:generate` utilisent la même, sans l'astuce `tools.go`. La vitesse de l'outil, elle, ne change pas."
  - key: qcm-generate
    format: multiple-choice
    question: Quelle directive go:generate utilise l'outil suivi par le module ?
    choices:
      - text: '`//go:generate go tool stringer -type=Statut`'
        correct: true
      - text: '`//go:generate stringer -type=Statut`, qui suppose un stringer installé'
        correct: false
      - text: '`//go:tool stringer`'
        correct: false
      - text: '`//go:generate go install stringer`'
        correct: false
    answer: La seconde dépend de ce qui est installé sur chaque poste.
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour ajouter l'outil au module :
      ```
      go get ___ github.com/sqlc-dev/sqlc/cmd/sqlc
      ```
    blanks:
      - - -tool
    answer: go get -tool.
  - key: trous-run
    format: fill-in
    question: |-
      Complète pour lancer sqlc :
      ```
      go ___ sqlc generate
      ```
    blanks:
      - - tool
    answer: go tool sqlc.
  - key: trous-directive
    format: fill-in
    question: |-
      Complète le go.mod :
      ```
      ___ golang.org/x/tools/cmd/stringer
      ```
    blanks:
      - - tool
    answer: La directive tool.
  - key: trous-none
    format: fill-in
    question: |-
      Complète pour retirer l'outil :
      ```
      go get -tool golang.org/x/tools/cmd/stringer@___
      ```
    blanks:
      - - none
    answer: '@none.'
  - key: qcm-module-separe
    format: multiple-choice
    question: Un outil apporte des dizaines de dépendances qui font monter des versions partagées avec l'application. Que faire ?
    choices:
      - {text: "Déclarer l'outil dans un module séparé et le lancer avec `go tool -modfile=tools/go.mod`", correct: true}
      - {text: "Le garder dans le `go.mod` principal et accepter les montées de version qu'il impose", correct: false}
      - {text: "Copier son code source dans le projet, pour ne plus dépendre de son module", correct: false}
      - {text: "Le déclarer seulement dans `go.sum`, qui ne fait pas monter les versions du graphe", correct: false}
    answer: Le module séparé isole son graphe de dépendances.
