notion: replace-vendor-workspaces
lesson: "Trois mécanismes changent d'où viennent les dépendances :\n\n**`replace`** dans go.mod remplace un module par un autre chemin ou une autre version :\n\n```\nreplace github.com/exemple/lib => ../lib              // un dossier local\nreplace github.com/exemple/lib => github.com/moi/lib v1.4.1-correctif // une fourche\n```\n\n- il ne s'applique **qu'au module principal** : les replace des dépendances sont ignorés ;\n- un replace vers un dossier local ne doit pas être publié dans une bibliothèque (les utilisateurs ne l'ont pas).\n\n**`vendor/`** : `go mod vendor` copie toutes les dépendances dans le dépôt. Si le dossier existe (et `go 1.14` ou plus),\nle build l'utilise automatiquement (`-mod=vendor`). Utile pour une CI sans accès réseau, un audit du code exact, ou\ndes exigences réglementaires ; au prix d'un dépôt plus lourd et de diffs volumineux.\n\n**Les espaces de travail** (`go.work`, Go 1.18) : développer **plusieurs modules à la fois** sans replace.\n\n```\ngo work init ./service ./lib\ngo work use ./autre-module\n```\n\n```\ngo 1.27\n\nuse (\n\t./service\n\t./lib\n)\n```\n\nLe service utilise alors la version **locale** de lib. go.work est un réglage **local** de développement : on ne le\nversionne en général pas (ou l'on désactive avec `GOWORK=off` en CI), pour que chaque module reste buildable seul.\n\n**En entretien** : « replace pour une fourche ou un dossier local, seulement dans le module principal ; vendor pour\nun build hors ligne ou un audit ; go.work pour développer plusieurs modules ensemble, sans le versionner. »"
cards:
  - key: workspace
    format: course
    question: C'est quoi un workspace Go ?
    answer: Un fichier go.work qui permet de développer plusieurs modules locaux ensemble (Go 1.18).
  - key: replace
    format: course
    question: Que fait replace ?
    answer: Remplace un module par un chemin local ou un fork ; seulement dans le module principal.
  - key: sert-work
    format: course
    question: À quoi sert go work ?
    answer: Développer plusieurs modules locaux ensemble sans replace.
  - key: terme-workspace-work
    format: course
    question: Que désigne « workspace (go.work) » ?
    answer: Développement de plusieurs modules locaux ensemble
  - key: vf-replace-dep
    format: true-false
    question: Les directives replace d'une dépendance s'appliquent aussi au programme qui l'importe.
    truth: false
    answer: Seules celles du module principal comptent.
  - key: vf-vendor-auto
    format: true-false
    question: Si un dossier vendor existe, go build l'utilise par défaut.
    truth: true
    answer: Depuis Go 1.14, avec une directive go suffisante.
  - key: vf-gowork
    format: true-false
    question: Le fichier go.work doit en général être versionné avec le projet.
    truth: false
    answer: C'est un réglage local de développement.
  - key: vf-replace-local
    format: true-false
    question: Un replace vers un dossier local (../lib) peut rester dans une bibliothèque publiée sans gêner ses utilisateurs.
    truth: true
    answer: 'Il est ignoré chez eux, mais il trompe : on le retire avant de publier pour que le module se construise seul.'
  - key: qcm-usages
    format: multiple-choice
    question: Quel mécanisme pour quel besoin ?
    choices:
      - text: 'Utiliser une fourche corrigée d''une dépendance : replace'
        correct: true
      - text: 'Construire sans accès réseau : vendor'
        correct: true
      - text: 'Modifier en même temps un service et sa bibliothèque locale : go.work'
        correct: true
      - text: 'Choisir la version minimale d''une dépendance : vendor'
        correct: false
    answer: Les versions viennent de require.
  - key: qcm-vendor
    format: multiple-choice
    question: Quels inconvénients a le dossier vendor ?
    choices:
      - text: Un dépôt plus lourd
        correct: true
      - text: Des diffs volumineux à chaque mise à jour de dépendance
        correct: true
      - text: Il empêche la compilation croisée
        correct: false
      - text: Il désactive go.sum
        correct: false
    answer: Les sommes restent vérifiées via vendor/modules.txt et go.mod.
  - key: qcm-work
    format: multiple-choice
    question: Quelles commandes concernent les espaces de travail ?
    choices:
      - text: '`go work init ./a ./b`'
        correct: true
      - text: '`go work use ./c`'
        correct: true
      - text: '`GOWORK=off go build`'
        correct: true
      - text: '`go mod work`'
        correct: false
    answer: GOWORK=off ignore le go.work.
  - key: qcm-ci
    format: multiple-choice
    question: Un go.work traîne dans le dépôt et la CI construit avec des versions locales. Que faire ?
    choices:
      - text: Le retirer du dépôt et l'ajouter au .gitignore
        correct: true
      - text: Construire en CI avec GOWORK=off
        correct: true
      - text: Le garder, il ne change rien
        correct: false
      - text: Supprimer go.mod
        correct: false
    answer: Chaque module doit se construire seul avec ses versions déclarées.
  - key: trous-replace
    format: fill-in
    question: |-
      Complétez pour utiliser une copie locale :
      ```
      ___ github.com/exemple/lib => ../lib
      ```
    blanks:
      - - replace
    answer: replace.
  - key: trous-vendor
    format: fill-in
    question: |-
      Complétez pour copier les dépendances dans le dépôt :
      ```
      go mod ___
      ```
    blanks:
      - - vendor
    answer: go mod vendor.
  - key: trous-work-init
    format: fill-in
    question: |-
      Complétez pour créer un espace de travail :
      ```
      go work ___ ./service ./lib
      ```
    blanks:
      - - init
    answer: go work init.
  - key: trous-use
    format: fill-in
    question: "Complétez le go.work :\n```\ngo 1.27\n\n___ (\n\t./service\n\t./lib\n)\n```"
    blanks:
      - - use
    answer: use.
  - key: scenario-fourche
    format: scenario
    question: Une dépendance a un bug bloquant, corrigé dans une pull request pas encore fusionnée. Comment avances-tu ?
    answer: |-
      Je fais une fourche avec le correctif et j'ajoute `replace github.com/auteur/lib => github.com/moi/lib <pseudo-version>`
      dans le go.mod du service, avec un commentaire et un ticket pour le retirer. Dès que l'auteur publie une version
      corrigée, je retire le replace et je monte la version normalement. Pour une bibliothèque que je publie, je ne peux
      pas compter sur replace : je contourne le bug dans mon code.
  - key: scenario-monorepo
    format: scenario
    question: Ton monorepo contient plusieurs modules Go qui dépendent les uns des autres. Comment travailles-tu ?
    answer: |-
      En local, un go.work avec tous les modules, pour modifier une bibliothèque et ses utilisateurs ensemble ; il n'est
      pas versionné. En CI, chaque module est construit et testé seul (GOWORK=off) avec les versions de son go.mod. Si
      les modules sont toujours livrés ensemble, je me demande s'ils doivent vraiment être séparés : un seul module avec
      plusieurs packages est souvent plus simple.
  - key: scenario-vendor
    format: scenario
    question: Ton client exige que tout le code livré soit dans le dépôt, sans téléchargement au build. Que fais-tu ?
    answer: |-
      `go mod vendor` et le dossier vendor versionné : le build utilise ce code, hors ligne. La CI vérifie que vendor est à
      jour (`go mod vendor` puis `git diff --exit-code`). Les mises à jour de dépendances se font comme d'habitude, suivies
      d'un nouveau vendoring dans la même pull request. Le code tiers devient aussi auditable directement.
  - key: scenario-local
    format: scenario
    question: Replace ou go.work pour tester localement une modification d'une bibliothèque ?
    answer: |-
      go.work : il ne modifie pas le go.mod du service, ne risque pas d'être commité par erreur (s'il est ignoré par git),
      et regroupe plusieurs modules. Le replace local est l'ancienne méthode : il marche, mais doit être retiré avant de
      pousser. J'utilise replace surtout pour une fourche durable, versionnée et commentée.
