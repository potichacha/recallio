notion: replace-vendor-workspaces
lesson: "Trois mécanismes changent d'où viennent les dépendances :\n\n**`replace`** dans go.mod remplace un module par un autre chemin ou une autre version :\n\n```\nreplace github.com/exemple/lib => ../lib              // un dossier local\nreplace github.com/exemple/lib => github.com/moi/lib v1.4.1-correctif // une fourche\n```\n\n- il ne s'applique **qu'au module principal** : les replace des dépendances sont ignorés ;\n- un replace vers un dossier local ne doit pas être publié dans une bibliothèque (les utilisateurs ne l'ont pas).\n\n**`vendor/`** : `go mod vendor` copie toutes les dépendances dans le dépôt. Si le dossier existe (et `go 1.14` ou plus),\nle build l'utilise automatiquement (`-mod=vendor`). Utile pour une CI sans accès réseau, un audit du code exact, ou\ndes exigences réglementaires ; au prix d'un dépôt plus lourd et de diffs volumineux.\n\n**Les espaces de travail** (`go.work`, Go 1.18) : développer **plusieurs modules à la fois** sans replace.\n\n```\ngo work init ./service ./lib\ngo work use ./autre-module\n```\n\n```\ngo 1.27\n\nuse (\n\t./service\n\t./lib\n)\n```\n\nLe service utilise alors la version **locale** de lib. go.work est un réglage **local** de développement : on ne le\nversionne en général pas (ou l'on désactive avec `GOWORK=off` en CI), pour que chaque module reste buildable seul.\n\n**En entretien** : « replace pour une fourche ou un dossier local, seulement dans le module principal ; vendor pour\nun build hors ligne ou un audit ; go.work pour développer plusieurs modules ensemble, sans le versionner. »"
cards:
  - key: workspace
    format: course
    question: "Qu'est-ce qu'un espace de travail (workspace) Go ?"
    choices:
      - {text: "Un fichier `go.work` qui fait développer ensemble plusieurs modules locaux", correct: true}
      - {text: "Le dossier `GOPATH` où se rangent toutes les sources, comme avant les modules", correct: false}
      - {text: "Un module qui contient plusieurs packages, décrits dans un même `go.mod`", correct: false}
      - {text: "Un dossier `vendor/` qui regroupe le code de toutes les dépendances", correct: false}
    answer: "Un fichier `go.work` (Go 1.18) qui permet de développer plusieurs modules locaux ensemble, sans toucher à leurs `go.mod`."
  - key: replace
    format: course
    question: "Que fait la directive `replace` d'un `go.mod` ?"
    choices:
      - {text: "Elle remplace un module par un chemin local ou un fork, dans le module principal seulement", correct: true}
      - {text: "Elle remplace un module partout, y compris chez les utilisateurs de ma bibliothèque", correct: false}
      - {text: "Elle signale aux utilisateurs une version à ne plus utiliser, au profit d'une autre", correct: false}
      - {text: "Elle remplace la version minimale d'une dépendance par sa dernière version publiée", correct: false}
    answer: "Elle remplace un module par un chemin local ou un fork, et seulement quand le module est le module principal : les `replace` des dépendances sont ignorés. Signaler une version à éviter, c'est `retract`."
  - key: sert-work
    format: course
    question: "À quoi sert la commande `go work` ?"
    choices:
      - {text: "À développer plusieurs modules locaux ensemble, sans `replace`", correct: true}
      - {text: "À copier les dépendances dans `vendor/`, pour compiler hors ligne", correct: false}
      - {text: "À lancer en parallèle les tests de tous les modules d'un dépôt", correct: false}
      - {text: "À publier plusieurs modules d'un coup, sous le même tag", correct: false}
    answer: "À créer et gérer un `go.work`, pour développer plusieurs modules locaux ensemble sans `replace`. Copier les dépendances, c'est `go mod vendor`."
  - key: terme-workspace-work
    format: course
    question: "Dans l'outillage Go, que désigne un espace de travail (`go.work`) ?"
    choices:
      - {text: "Le développement de plusieurs modules locaux ensemble", correct: true}
      - {text: "Le remplacement d'un module par un fork, dans `go.mod`", correct: false}
      - {text: "La copie des dépendances dans le dépôt, pour compiler hors ligne", correct: false}
      - {text: "L'unité de versionnement, décrite par un fichier `go.mod`", correct: false}
    answer: "Le développement de plusieurs modules locaux ensemble. Le remplacement par un fork, c'est `replace` ; la copie des dépendances, `vendor/` ; l'unité de versionnement, le module."
  - key: vf-replace-dep
    format: true-false
    question: Les directives replace d'une dépendance s'appliquent aussi au programme qui l'importe.
    truth: false
    answer: Seules celles du module principal comptent.
  - key: vf-vendor-auto
    format: true-false
    question: Si un dossier vendor existe, go build l'utilise par défaut.
    truth: true
    answer: Depuis Go 1.14, avec une directive go suffisante.
  - key: vf-gowork
    format: true-false
    question: Le fichier go.work doit en général être versionné avec le projet.
    truth: false
    answer: C'est un réglage local de développement.
  - key: vf-replace-local
    format: true-false
    question: Un replace vers un dossier local (../lib) peut rester dans une bibliothèque publiée sans gêner ses utilisateurs.
    truth: true
    answer: 'Il est ignoré chez eux, mais il trompe : on le retire avant de publier pour que le module se construise seul.'
  - key: qcm-usages
    format: multiple-choice
    question: "Tu dois construire un service sans accès réseau au moment du build. Quel mécanisme choisis-tu ?"
    choices:
      - {text: "`go mod vendor`, avec le dossier `vendor/` versionné", correct: true}
      - {text: "Une directive `replace` vers un fork de chaque dépendance", correct: false}
      - {text: "Un `go.work` qui liste toutes les dépendances du service", correct: false}
      - {text: "Un `require` sans version pour chaque dépendance", correct: false}
    answer: "`vendor/` contient le code des dépendances, et le build s'en sert sans réseau. `replace` sert à une fourche corrigée, `go.work` à modifier ensemble un service et sa bibliothèque locale ; les versions viennent de `require`."
  - key: qcm-vendor
    format: multiple-choice
    question: "Lesquels de ces inconvénients a le dossier `vendor/` ?"
    choices:
      - text: Un dépôt plus lourd
        correct: true
      - text: Des diffs volumineux à chaque mise à jour de dépendance
        correct: true
      - text: Il empêche la compilation croisée
        correct: false
      - text: Il désactive go.sum
        correct: false
    answer: Les sommes restent vérifiées via vendor/modules.txt et go.mod.
  - key: qcm-work
    format: multiple-choice
    question: "Laquelle de ces commandes n'existe pas ?"
    choices:
      - {text: "`go mod work`", correct: true}
      - {text: "`go work init ./a ./b`", correct: false}
      - {text: "`go work use ./c`", correct: false}
      - {text: "`GOWORK=off go build`", correct: false}
    answer: "`go work init` crée le `go.work`, `go work use` y ajoute un module, `GOWORK=off` l'ignore. `go mod work` n'existe pas."
  - key: qcm-ci
    format: multiple-choice
    question: "Un `go.work` traîne dans le dépôt, et la CI construit avec des versions locales. Que fais-tu ?"
    choices:
      - {text: "Le retirer du dépôt, l'ignorer dans git, et construire en CI avec `GOWORK=off`", correct: true}
      - {text: "Le garder : un `go.work` ne change rien au build de la CI", correct: false}
      - {text: "Supprimer les `go.mod` des modules, inutiles avec un `go.work`", correct: false}
      - {text: "Ajouter un `replace` par module dans le `go.work` versionné", correct: false}
    answer: "Chaque module doit se construire seul, avec les versions de son `go.mod` : le `go.work` reste local (`.gitignore`), et `GOWORK=off` garantit que la CI l'ignore."
  - key: trous-replace
    format: fill-in
    question: |-
      Complète pour utiliser une copie locale :
      ```
      ___ github.com/exemple/lib => ../lib
      ```
    blanks:
      - - replace
    answer: replace.
  - key: trous-vendor
    format: fill-in
    question: |-
      Complète pour copier les dépendances dans le dépôt :
      ```
      go mod ___
      ```
    blanks:
      - - vendor
    answer: go mod vendor.
  - key: trous-work-init
    format: fill-in
    question: |-
      Complète pour créer un espace de travail :
      ```
      go work ___ ./service ./lib
      ```
    blanks:
      - - init
    answer: go work init.
  - key: trous-use
    format: fill-in
    question: |-
      Complète le go.work :
      ```
      go 1.27

      ___ (
      	./service
      	./lib
      )
      ```
    blanks:
      - - use
    answer: use.
  - key: scenario-fourche
    format: scenario
    question: "Une dépendance a un bug bloquant, corrigé dans une pull request pas encore fusionnée. Comment avances-tu ?"
    choices:
      - {text: "Un `replace` vers ma fourche corrigée, commenté, avec un ticket pour le retirer à la version publiée", correct: true}
      - {text: "Je recopie le code de la dépendance dans mon dépôt et je le corrige, sans plus suivre l'amont", correct: false}
      - {text: "J'attends la fusion de la pull request en amont, sans rien livrer d'ici là", correct: false}
      - {text: "Je corrige le code de la dépendance directement dans le cache de modules de chaque machine", correct: false}
    answer: "Une fourche avec le correctif et `replace github.com/auteur/lib => github.com/moi/lib <pseudo-version>` dans le `go.mod` du service, commenté, avec un ticket pour le retirer dès la version corrigée publiée. Pour une bibliothèque que je publie, `replace` ne vaut pas chez mes utilisateurs : je contourne le bug dans mon code."
  - key: scenario-monorepo
    format: scenario
    question: "Ton monorepo contient plusieurs modules Go qui dépendent les uns des autres. Comment travailles-tu ?"
    choices:
      - {text: "Un `go.work` local non versionné, et en CI chaque module construit seul avec `GOWORK=off`", correct: true}
      - {text: "Un `go.work` versionné, que la CI utilise aussi pour construire tous les modules ensemble", correct: false}
      - {text: "Des `replace` vers les chemins locaux dans chaque `go.mod`, commités et publiés tels quels", correct: false}
      - {text: "Un `go.mod` à la racine qui `require` tous les autres, pour que tout se résolve en local", correct: false}
    answer: "En local, un `go.work` avec tous les modules, non versionné ; en CI, chaque module construit et testé seul (`GOWORK=off`) avec les versions de son `go.mod`. Si les modules sont toujours livrés ensemble, un seul module à plusieurs packages est souvent plus simple."
  - key: scenario-vendor
    format: scenario
    question: "Ton client exige que tout le code livré soit dans le dépôt, sans téléchargement au build. Que fais-tu ?"
    choices:
      - {text: "`go mod vendor` et `vendor/` versionné, vérifié à jour en CI par un nouveau vendoring et un diff", correct: true}
      - {text: "Un `replace` vers une copie locale de chaque dépendance, rangée dans un dossier `third_party/`", correct: false}
      - {text: "Un `go.work` qui référence les dépendances clonées à côté du dépôt du service", correct: false}
      - {text: "Le cache de modules de la CI copié dans le dépôt, pour que `go build` le retrouve", correct: false}
    answer: "`go mod vendor` et le dossier `vendor/` versionné : le build utilise ce code, hors ligne. La CI vérifie qu'il est à jour (`go mod vendor` puis `git diff --exit-code`) ; chaque mise à jour de dépendance est suivie d'un nouveau vendoring dans la même PR, et le code tiers devient auditable."
  - key: scenario-local
    format: scenario
    question: "`replace` ou `go.work` : lequel prends-tu pour tester localement une modification d'une bibliothèque ?"
    choices:
      - {text: "`go.work`, ignoré par git : le `go.mod` du service ne change pas", correct: true}
      - {text: "`replace` vers le chemin local, commité pour que la CI teste la même chose", correct: false}
      - {text: "`replace` vers le chemin local, sans risque puisque la CI l'ignore", correct: false}
      - {text: "Ni l'un ni l'autre : je publie un tag de la bibliothèque à chaque essai", correct: false}
    answer: "`go.work` ne modifie pas le `go.mod` du service, ne risque pas d'être commité s'il est ignoré par git, et regroupe plusieurs modules. Le `replace` local marche, mais doit être retiré avant de pousser ; on le garde pour une fourche durable, versionnée et commentée."
