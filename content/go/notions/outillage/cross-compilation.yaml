notion: cross-compilation
lesson: |-
  Go compile pour **n'importe quelle plateforme** depuis n'importe quelle machine, sans chaîne d'outils supplémentaire :
  il suffit de deux variables d'environnement.

  ```
  GOOS=linux   GOARCH=amd64 go build -o dist/app-linux-amd64 ./cmd/app
  GOOS=linux   GOARCH=arm64 go build -o dist/app-linux-arm64 ./cmd/app   # Graviton, Raspberry Pi
  GOOS=darwin  GOARCH=arm64 go build -o dist/app-macos ./cmd/app         # Mac Apple Silicon
  GOOS=windows GOARCH=amd64 go build -o dist/app.exe ./cmd/app
  go tool dist list                                                     # toutes les cibles
  ```

  La condition : **`CGO_ENABLED=0`**. Sans cgo, le binaire est en **Go pur**, **statique** (pas de dépendance à la libc
  du système) et se compile croisé sans compilateur C. Avec cgo, il faut un compilateur C pour la cible (zig cc,
  conteneurs dédiés) ; c'est pourquoi on préfère des bibliothèques en Go pur (modernc.org/sqlite plutôt que
  mattn/go-sqlite3).

  Ce qui change avec CGO_ENABLED=0 : le résolveur DNS et la recherche des utilisateurs passent par les implémentations
  Go (`netgo`, `osusergo`), en général sans différence visible.

  Pour une **image Docker multi-architecture**, on fait compiler le binaire par l'étape de build pour la plateforme
  cible (`--platform`, `TARGETOS`, `TARGETARCH` avec buildx), sans émulation, ce qui est rapide.

  **GOAMD64** (`v1` à `v4`) ou **GOARM64** autorisent des instructions plus récentes au prix de la compatibilité avec de
  vieux processeurs.

  **En entretien** : « GOOS et GOARCH suffisent ; CGO_ENABLED=0 pour un binaire statique et une compilation croisée
  sans compilateur C ; go tool dist list ; buildx avec TARGETOS et TARGETARCH pour les images multi-architectures. »
cards:
  - key: compiler-autre-plateforme
    format: course
    question: "Comment compiles-tu un programme Go pour une autre plateforme ?"
    choices:
      - {text: "En fixant `GOOS` et `GOARCH`, par exemple `GOOS=linux GOARCH=arm64 go build`", correct: true}
      - {text: "En installant Go sur une machine de la cible, seule capable de produire son binaire", correct: false}
      - {text: "En passant `-target=linux/arm64` à `go build`, comme on le fait avec clang", correct: false}
      - {text: "En compilant avec `CGO_ENABLED=1` et le compilateur C de la plateforme visée", correct: false}
    answer: "`GOOS` et `GOARCH` suffisent : le compilateur Go produit toutes les cibles depuis n'importe quelle machine, sans compilateur C. `go build` n'a pas d'option `-target`."
  - key: cgo-enabled-0
    format: course
    question: "Pourquoi compiler avec `CGO_ENABLED=0` ?"
    choices:
      - {text: "Pour un binaire statique, sans dépendance à la libc, et une compilation croisée simple", correct: true}
      - {text: "Pour désactiver le ramasse-miettes et obtenir un binaire plus rapide au démarrage", correct: false}
      - {text: "Pour interdire les appels système, et rendre le binaire plus sûr dans un conteneur", correct: false}
      - {text: "Pour compiler plus vite, en sautant l'étape d'édition des liens du binaire final", correct: false}
    answer: "Sans cgo, le binaire est statique, sans dépendance à la libc : il tourne sur `scratch` ou distroless, et la compilation croisée n'a besoin d'aucun compilateur C."
  - key: terme-cgo-enabled
    format: course
    question: "Que désigne la variable `CGO_ENABLED` ?"
    choices:
      - {text: "La variable qui active ou désactive cgo ; à 0, le binaire est statique", correct: true}
      - {text: "La variable qui choisit le système cible de la compilation, comme `linux`", correct: false}
      - {text: "La variable qui active la détection des data races pendant les tests", correct: false}
      - {text: "La variable qui autorise le téléchargement d'une autre version de Go", correct: false}
    answer: "Elle active ou désactive cgo, l'appel de code C ; à 0, le binaire est statique. Le système cible, c'est `GOOS` ; le téléchargement d'une autre version, `GOTOOLCHAIN`."
  - key: terme-goos-goarch
    format: course
    question: "Que désignent les variables `GOOS` et `GOARCH` ?"
    choices:
      - {text: "Le système et l'architecture cibles de la compilation", correct: true}
      - {text: "Le système et l'architecture de la machine qui compile", correct: false}
      - {text: "Le dossier d'installation de Go et celui du cache de build", correct: false}
      - {text: "Les versions minimales de Go et du système exigées par le module", correct: false}
    answer: "Le système (`linux`, `darwin`, `windows`) et l'architecture (`amd64`, `arm64`) cibles. Ceux de la machine qui compile sont `GOHOSTOS` et `GOHOSTARCH`."
  - key: vf-variables
    format: true-false
    question: Pour compiler un binaire Linux depuis un Mac, il suffit de fixer GOOS=linux et GOARCH.
    truth: true
    answer: Pour du Go pur, sans chaîne d'outils supplémentaire.
  - key: vf-cgo
    format: true-false
    question: La compilation croisée avec cgo activé fonctionne sans compilateur C pour la cible.
    truth: false
    answer: cgo demande un compilateur C pour la plateforme cible.
  - key: vf-statique
    format: true-false
    question: Avec CGO_ENABLED=0, le binaire ne dépend pas de la libc du système.
    truth: true
    answer: Il tourne dans une image scratch.
  - key: vf-liste
    format: true-false
    question: '`go tool dist list` affiche les plateformes cibles prises en charge.'
    truth: true
    answer: Sous la forme GOOS/GOARCH.
  - key: qcm-cibles
    format: multiple-choice
    question: "Laquelle de ces combinaisons n'est pas une cible valide ?"
    choices:
      - {text: "`GOOS=ubuntu GOARCH=x64`", correct: true}
      - {text: "`GOOS=linux GOARCH=arm64`", correct: false}
      - {text: "`GOOS=darwin GOARCH=arm64`", correct: false}
      - {text: "`GOOS=windows GOARCH=amd64`", correct: false}
    answer: "`GOOS` désigne le système (`linux`, pas une distribution), `GOARCH` l'architecture (`amd64`, pas `x64`). `go tool dist list` liste les cibles."
  - key: qcm-cgo0
    format: multiple-choice
    question: "Lesquels de ces effets a `CGO_ENABLED=0` ?"
    choices:
      - text: Un binaire statique, sans dépendance à la libc
        correct: true
      - text: Une compilation croisée sans compilateur C
        correct: true
      - text: Le résolveur DNS en Go pur
        correct: true
      - text: L'interdiction des goroutines
        correct: false
    answer: Les paquets qui exigent cgo ne compilent plus.
  - key: qcm-sqlite
    format: multiple-choice
    question: Ton outil utilise SQLite et doit être compilé pour cinq plateformes. Quelle bibliothèque choisir ?
    choices:
      - text: Une implémentation en Go pur, comme modernc.org/sqlite
        correct: true
      - text: mattn/go-sqlite3, qui demande cgo et un compilateur C par cible
        correct: false
      - text: N'importe laquelle, cela ne change rien
        correct: false
      - text: Aucune, SQLite n'existe pas en Go
        correct: false
    answer: Le Go pur garde la compilation croisée triviale.
  - key: qcm-docker
    format: multiple-choice
    question: "Comment construis-tu vite une image Docker Go pour amd64 et arm64 ?"
    choices:
      - {text: "Une étape de build `FROM --platform=$BUILDPLATFORM` qui compile avec `GOOS=$TARGETOS GOARCH=$TARGETARCH`", correct: true}
      - {text: "Une étape de build par architecture, compilée sous émulation QEMU avec `docker buildx`", correct: false}
      - {text: "Une seule image amd64, que Docker traduit lui-même au démarrage sur les machines arm64", correct: false}
      - {text: "Un `go build` lancé au démarrage du conteneur, sur la machine qui exécute l'image", correct: false}
    answer: "La compilation croisée de Go évite l'émulation, très lente : l'étape de build tourne sur l'architecture de la machine (`$BUILDPLATFORM`) et produit le binaire de la cible. Seule l'image finale est propre à chaque architecture."
  - key: trous-goos
    format: fill-in
    question: |-
      Complète pour Windows :
      ```
      ___=windows GOARCH=amd64 go build -o app.exe ./cmd/app
      ```
    blanks:
      - - GOOS
    answer: GOOS.
  - key: trous-goarch
    format: fill-in
    question: |-
      Complète pour un serveur ARM :
      ```
      GOOS=linux GOARCH=___ go build ./cmd/app
      ```
    blanks:
      - - arm64
    answer: arm64.
  - key: trous-cgo
    format: fill-in
    question: |-
      Complète pour un binaire statique :
      ```
      ___=0 go build ./cmd/app
      ```
    blanks:
      - - CGO_ENABLED
    answer: CGO_ENABLED.
  - key: trous-liste
    format: fill-in
    question: |-
      Complète pour lister les cibles :
      ```
      go tool dist ___
      ```
    blanks:
      - - list
    answer: go tool dist list.
  - key: scenario-cli
    format: scenario
    question: "Comment publies-tu une CLI Go pour Linux, macOS et Windows ?"
    choices:
      - {text: "Une compilation croisée par cible (`CGO_ENABLED=0`, `GOOS`, `GOARCH`), automatisée par GoReleaser sur un tag", correct: true}
      - {text: "Un runner de CI par système, puisque Go ne compile que pour la machine qui lance le build", correct: false}
      - {text: "Une image Docker seulement, que chaque utilisateur lance à la place d'un binaire natif", correct: false}
      - {text: "Le code source seul, en demandant à chaque utilisateur d'installer Go pour le compiler", correct: false}
    answer: "Une compilation par cible avec `CGO_ENABLED=0`, `GOOS` et `GOARCH`, la version injectée par `-ldflags`, des archives et des sommes de contrôle. GoReleaser automatise tout cela depuis un tag et publie la release, Homebrew ou Scoop et les images : nul besoin de machines macOS ou Windows pour compiler."
  - key: scenario-graviton
    format: scenario
    question: "Ton équipe veut passer ses services sur des instances ARM moins chères. Qu'est-ce que cela implique pour du Go ?"
    choices:
      - {text: "Peu de chose : recompiler avec `GOARCH=arm64`, des images multi-architectures, et vérifier cgo et la charge", correct: true}
      - {text: "Une réécriture partielle : le runtime arm64 n'a ni les mêmes goroutines ni le même ramasse-miettes", correct: false}
      - {text: "Rien du tout : le même binaire amd64 tourne tel quel sur les instances ARM, sans recompiler", correct: false}
      - {text: "Des machines ARM dans la CI, car Go ne sait pas compiler pour arm64 depuis une machine amd64", correct: false}
    answer: "Le code Go pur se compile pour arm64 en changeant `GOARCH`, et les images deviennent multi-architectures avec buildx. Il reste à vérifier les dépendances cgo et les binaires tiers des images, à lancer tests et test de charge sur ARM (les performances relatives changent), puis à basculer progressivement."
  - key: scenario-cgo-necessaire
    format: scenario
    question: "Ton service doit utiliser une bibliothèque C. Comment gères-tu la compilation ?"
    choices:
      - {text: "Compiler dans une image qui a le compilateur et la bibliothèque de chaque cible, cgo isolé dans un package", correct: true}
      - {text: "Garder `CGO_ENABLED=0` : Go charge alors la bibliothèque C dynamiquement à son premier appel", correct: false}
      - {text: "Recopier le code C dans des fichiers `.go`, que le compilateur Go sait traduire à la compilation", correct: false}
      - {text: "Compiler sous Linux pour toutes les cibles avec `GOOS` et `GOARCH`, exactement comme du Go pur", correct: false}
    answer: "Avec cgo, il faut un compilateur C pour chaque cible : une image Docker qui le contient avec la bibliothèque (ou zig cc), en liant statiquement si possible. Le code cgo reste isolé dans un package, derrière une contrainte de build et une implémentation de repli si possible, pour que le reste se teste en Go pur."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi Go est apprécié pour les outils distribués. Que réponds-tu ?"
    choices:
      - {text: "Un seul binaire statique, sans VM ni dépendance, qui démarre vite et se compile pour toute plateforme", correct: true}
      - {text: "Sa machine virtuelle, installée partout, qui exécute le même bytecode sur tous les systèmes", correct: false}
      - {text: "Son interpréteur léger, qui lance le code source sans étape de compilation sur chaque poste", correct: false}
      - {text: "Sa bibliothèque d'interface graphique native, la même sous Linux, macOS et Windows", correct: false}
    answer: "Un binaire statique, sans machine virtuelle ni dépendance à installer, qui démarre en quelques millisecondes, et une compilation croisée pour toutes les plateformes en changeant deux variables. C'est ce qui a fait le succès de Docker, kubectl, Terraform ou gh."
