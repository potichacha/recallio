notion: cross-compilation
lesson: |-
  Go compile pour **n'importe quelle plateforme** depuis n'importe quelle machine, sans chaîne d'outils supplémentaire :
  il suffit de deux variables d'environnement.

  ```
  GOOS=linux   GOARCH=amd64 go build -o dist/app-linux-amd64 ./cmd/app
  GOOS=linux   GOARCH=arm64 go build -o dist/app-linux-arm64 ./cmd/app   # Graviton, Raspberry Pi
  GOOS=darwin  GOARCH=arm64 go build -o dist/app-macos ./cmd/app         # Mac Apple Silicon
  GOOS=windows GOARCH=amd64 go build -o dist/app.exe ./cmd/app
  go tool dist list                                                     # toutes les cibles
  ```

  La condition : **`CGO_ENABLED=0`**. Sans cgo, le binaire est en **Go pur**, **statique** (pas de dépendance à la libc
  du système) et se compile croisé sans compilateur C. Avec cgo, il faut un compilateur C pour la cible (zig cc,
  conteneurs dédiés) ; c'est pourquoi on préfère des bibliothèques en Go pur (modernc.org/sqlite plutôt que
  mattn/go-sqlite3).

  Ce qui change avec CGO_ENABLED=0 : le résolveur DNS et la recherche des utilisateurs passent par les implémentations
  Go (`netgo`, `osusergo`), en général sans différence visible.

  Pour une **image Docker multi-architecture**, on fait compiler le binaire par l'étape de build pour la plateforme
  cible (`--platform`, `TARGETOS`, `TARGETARCH` avec buildx), sans émulation, ce qui est rapide.

  **GOAMD64** (`v1` à `v4`) ou **GOARM64** autorisent des instructions plus récentes au prix de la compatibilité avec de
  vieux processeurs.

  **En entretien** : « GOOS et GOARCH suffisent ; CGO_ENABLED=0 pour un binaire statique et une compilation croisée
  sans compilateur C ; go tool dist list ; buildx avec TARGETOS et TARGETARCH pour les images multi-architectures. »
cards:
  - key: compiler-autre-plateforme
    format: course
    question: Comment compiler pour une autre plateforme ?
    answer: GOOS et GOARCH, par exemple GOOS=linux GOARCH=arm64 go build.
  - key: cgo-enabled-0
    format: course
    question: Pourquoi CGO_ENABLED=0 ?
    answer: Pour un binaire statique sans dépendance à la libc, et une compilation croisée simple.
  - key: terme-cgo-enabled
    format: course
    question: Que désigne « CGO_ENABLED » ?
    answer: Variable qui active ou désactive cgo ; 0 pour un binaire statique
  - key: terme-goos-goarch
    format: course
    question: Que désigne « GOOS / GOARCH » ?
    answer: Système et architecture cibles de la compilation
  - key: vf-variables
    format: true-false
    question: Pour compiler un binaire Linux depuis un Mac, il suffit de fixer GOOS=linux et GOARCH.
    truth: true
    answer: Pour du Go pur, sans chaîne d'outils supplémentaire.
  - key: vf-cgo
    format: true-false
    question: La compilation croisée avec cgo activé fonctionne sans compilateur C pour la cible.
    truth: false
    answer: cgo demande un compilateur C pour la plateforme cible.
  - key: vf-statique
    format: true-false
    question: Avec CGO_ENABLED=0, le binaire ne dépend pas de la libc du système.
    truth: true
    answer: Il tourne dans une image scratch.
  - key: vf-liste
    format: true-false
    question: '`go tool dist list` affiche les plateformes cibles prises en charge.'
    truth: true
    answer: Sous la forme GOOS/GOARCH.
  - key: qcm-cibles
    format: multiple-choice
    question: Quelles combinaisons sont valides ?
    choices:
      - text: '`GOOS=linux GOARCH=arm64`'
        correct: true
      - text: '`GOOS=darwin GOARCH=arm64`'
        correct: true
      - text: '`GOOS=windows GOARCH=amd64`'
        correct: true
      - text: '`GOOS=ubuntu GOARCH=x64`'
        correct: false
    answer: GOOS désigne le système (linux), GOARCH l'architecture (amd64, arm64).
  - key: qcm-cgo0
    format: multiple-choice
    question: Que change CGO_ENABLED=0 ?
    choices:
      - text: Un binaire statique, sans dépendance à la libc
        correct: true
      - text: Une compilation croisée sans compilateur C
        correct: true
      - text: Le résolveur DNS en Go pur
        correct: true
      - text: L'interdiction des goroutines
        correct: false
    answer: Les paquets qui exigent cgo ne compilent plus.
  - key: qcm-sqlite
    format: multiple-choice
    question: Ton outil utilise SQLite et doit être compilé pour cinq plateformes. Quelle bibliothèque choisir ?
    choices:
      - text: Une implémentation en Go pur, comme modernc.org/sqlite
        correct: true
      - text: mattn/go-sqlite3, qui demande cgo et un compilateur C par cible
        correct: false
      - text: N'importe laquelle, cela ne change rien
        correct: false
      - text: Aucune, SQLite n'existe pas en Go
        correct: false
    answer: Le Go pur garde la compilation croisée triviale.
  - key: qcm-docker
    format: multiple-choice
    question: Comment construire une image Docker pour amd64 et arm64 rapidement ?
    choices:
      - text: Compiler dans l'étape de build avec GOOS=$TARGETOS GOARCH=$TARGETARCH
        correct: true
      - text: Utiliser `FROM --platform=$BUILDPLATFORM` pour l'étape de build, sans émulation
        correct: true
      - text: Compiler sous émulation QEMU pour chaque architecture
        correct: false
      - text: Distribuer seulement l'image amd64
        correct: false
    answer: La compilation croisée de Go évite l'émulation, très lente.
  - key: trous-goos
    format: fill-in
    question: |-
      Complétez pour Windows :
      ```
      ___=windows GOARCH=amd64 go build -o app.exe ./cmd/app
      ```
    blanks:
      - - GOOS
    answer: GOOS.
  - key: trous-goarch
    format: fill-in
    question: |-
      Complétez pour un serveur ARM :
      ```
      GOOS=linux GOARCH=___ go build ./cmd/app
      ```
    blanks:
      - - arm64
    answer: arm64.
  - key: trous-cgo
    format: fill-in
    question: |-
      Complétez pour un binaire statique :
      ```
      ___=0 go build ./cmd/app
      ```
    blanks:
      - - CGO_ENABLED
    answer: CGO_ENABLED.
  - key: trous-liste
    format: fill-in
    question: |-
      Complétez pour lister les cibles :
      ```
      go tool dist ___
      ```
    blanks:
      - - list
    answer: go tool dist list.
  - key: scenario-cli
    format: scenario
    question: Comment publies-tu une CLI Go pour Linux, macOS et Windows ?
    answer: |-
      Une compilation par cible avec CGO_ENABLED=0, GOOS et GOARCH (linux et darwin en amd64 et arm64, windows en amd64),
      la version injectée par -ldflags, des archives et des sommes de contrôle. GoReleaser automatise tout cela depuis un
      tag, dans la CI, et publie la release, les paquets Homebrew ou Scoop et les images Docker. Pas besoin de machines
      macOS ou Windows pour compiler.
  - key: scenario-graviton
    format: scenario
    question: Ton équipe veut passer ses services sur des instances ARM moins chères. Qu'est-ce que cela implique pour du Go ?
    answer: |-
      Peu de chose : le code Go pur se compile pour arm64 en changeant GOARCH, et les images Docker deviennent
      multi-architectures avec buildx. Je vérifie les dépendances cgo éventuelles et les binaires tiers dans les images,
      je lance les tests et un test de charge sur ARM (les performances relatives peuvent changer), puis je bascule
      progressivement.
  - key: scenario-cgo-necessaire
    format: scenario
    question: Ton service doit utiliser une bibliothèque C. Comment gères-tu la compilation ?
    answer: |-
      Je compile dans une image Docker qui contient le compilateur et la bibliothèque pour chaque cible (ou avec zig cc
      comme compilateur croisé), en liant si possible statiquement. Je garde le code cgo dans un package isolé, avec une
      contrainte de build et une implémentation de repli si c'est envisageable, pour que le reste se teste en Go pur.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi Go est apprécié pour les outils distribués.
    answer: |-
      Un seul binaire statique, sans machine virtuelle ni dépendances à installer, qui démarre en quelques millisecondes ;
      et une compilation croisée pour toutes les plateformes en changeant deux variables, depuis n'importe quelle machine.
      C'est ce qui a fait le succès de Docker, kubectl, Terraform ou gh.
