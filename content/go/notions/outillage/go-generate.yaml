notion: go-generate
lesson: "**`go generate`** lance des commandes écrites dans des commentaires **`//go:generate`** du code source, pour produire\ndu code (ou d'autres fichiers) avant la compilation :\n\n```go\n//go:generate go tool stringer -type=Statut\ntype Statut int\n\nconst (\n\tEnAttente Statut = iota\n\tPayee\n\tExpediee\n)\n```\n\n```\ngo generate ./...   # lance toutes les directives, dans le dossier de chaque fichier\n```\n\nLes points clés :\n- `go generate` ne s'exécute **jamais** automatiquement : ni `go build` ni `go test` ne le lancent ; on le lance à la\n  main ou en CI ;\n- le code généré est **versionné** dans le dépôt, pour que `go build` et `go get` fonctionnent sans les outils ;\n- un fichier généré commence par le commentaire **`// Code generated ... DO NOT EDIT.`**, que les outils reconnaissent\n  (les linters l'ignorent, les revues le replient) ;\n- la CI vérifie que le code généré est **à jour** : `go generate ./...` puis `git diff --exit-code` ;\n- les outils sont épinglés avec la directive **tool** (`go tool stringer`) pour que tout le monde génère la même chose.\n\nLes générateurs courants : `stringer` (méthode String des énumérations), `sqlc` (accès SQL typé), `protoc` ou `buf`\n(Protobuf, gRPC), `mockgen` ou `mockery` (mocks), `oapi-codegen` (OpenAPI), `go-enum`.\n\nLa génération remplace en Go une partie de ce que d'autres langages font par réflexion ou annotations : le code\nproduit est visible, relu et rapide.\n\n**En entretien** : « Des directives //go:generate lancées par go generate, jamais automatiquement ; le code généré est\nversionné, marqué DO NOT EDIT, et vérifié à jour en CI ; stringer, sqlc, protoc. »"
cards:
  - key: sert-generate
    format: course
    question: "À quoi sert la commande `go generate` ?"
    choices:
      - {text: "À lancer les commandes de génération déclarées par des directives `//go:generate`", correct: true}
      - {text: "À compiler le package en régénérant d'abord tout le code qui a changé", correct: false}
      - {text: "À écrire automatiquement les tests unitaires des fonctions exportées", correct: false}
      - {text: "À produire le fichier `go.sum` à partir des imports réels du module", correct: false}
    answer: "Elle exécute les commandes écrites dans les directives `//go:generate` des fichiers, et rien d'autre : ni compilation, ni tests."
  - key: pas-auto
    format: course
    question: "`go build` lance-t-il `go generate` ?"
    choices:
      - {text: "Non : `go generate` ne se lance jamais seul, ni au build ni aux tests", correct: true}
      - {text: "Oui, à chaque build, pour tous les fichiers qui portent une directive", correct: false}
      - {text: "Oui, mais seulement quand un fichier source a changé depuis le dernier build", correct: false}
      - {text: "Non au build, mais `go test` le lance avant de compiler les tests", correct: false}
    answer: "Non : `go generate` ne s'exécute jamais automatiquement, ni au build ni aux tests. On le lance à la main, et la CI vérifie que le résultat versionné est à jour."
  - key: entete
    format: course
    question: "Comment les outils reconnaissent-ils un fichier généré ?"
    choices:
      - {text: "À la ligne `// Code generated <outil>; DO NOT EDIT.` avant la clause `package`", correct: true}
      - {text: "À son nom, qui doit finir par `_generated.go` pour être reconnu par les outils", correct: false}
      - {text: "À une directive `//go:generated` placée en tête du fichier, avant les imports", correct: false}
      - {text: "À son dossier, `gen/` ou `generated/`, que les linters ignorent d'office", correct: false}
    answer: "À la ligne `// Code generated <outil>; DO NOT EDIT.` (l'expression `^// Code generated .* DO NOT EDIT\\.$`) avant la clause `package` : les linters l'ignorent et les outils de revue le replient. Ni le nom ni le dossier ne comptent."
  - key: versionner
    format: course
    question: "Pourquoi versionner le code généré dans le dépôt ?"
    choices:
      - {text: "Pour que `go build` marche chez tous les utilisateurs sans installer les générateurs", correct: true}
      - {text: "Parce que `go build` refuse de compiler un fichier généré qui n'est pas commité", correct: false}
      - {text: "Pour que `go generate` compare et ne régénère que les fichiers qui ont changé", correct: false}
      - {text: "Parce que `go.sum` enregistre la somme de chaque fichier généré du module", correct: false}
    answer: "Pour que `go build` et `go get` fonctionnent chez tous les utilisateurs du module sans installer les générateurs, et pour voir dans les revues ce que change une régénération."
  - key: vf-auto
    format: true-false
    question: go test lance les directives go:generate avant les tests.
    truth: false
    answer: Il faut lancer go generate soi-même.
  - key: vf-dossier
    format: true-false
    question: Une directive go:generate s'exécute dans le dossier du fichier qui la contient.
    truth: true
    answer: Les chemins relatifs partent de ce dossier.
  - key: vf-editer
    format: true-false
    question: On peut modifier un fichier généré à la main, les modifications seront conservées.
    truth: false
    answer: La prochaine génération les écrasera ; on modifie la source.
  - key: vf-reflexion
    format: true-false
    question: En Go, la génération de code remplace souvent la réflexion ou les annotations d'autres langages.
    truth: true
    answer: Le code produit est explicite et rapide.
  - key: qcm-generateurs
    format: multiple-choice
    question: "Quel générateur produit la méthode `String` d'une énumération ?"
    choices:
      - {text: "`stringer`", correct: true}
      - {text: "`sqlc`", correct: false}
      - {text: "`buf`", correct: false}
      - {text: "`oapi-codegen`", correct: false}
    answer: "`stringer -type=Statut` écrit la méthode `String` d'après les constantes. sqlc génère un accès SQL typé, buf (ou protoc) le code Protobuf et gRPC, oapi-codegen le code d'une spécification OpenAPI."
  - key: qcm-ci
    format: multiple-choice
    question: "La CI régénère le code, lance `git diff --exit-code` et échoue sur des diffs que personne n'a causés. Quelle est la cause la plus probable ?"
    choices:
      - {text: "Des versions de générateurs différentes entre la CI et les postes", correct: true}
      - {text: "`go generate`, qui ne lance pas les directives dans le même ordre", correct: false}
      - {text: "`git diff`, qui compare aussi les fichiers ignorés par le dépôt", correct: false}
      - {text: "Le cache de build de la CI, qui garde un ancien code généré", correct: false}
    answer: "Deux versions d'un même générateur produisent souvent un code un peu différent. On les épingle (directive `tool`) pour que la CI et l'équipe génèrent exactement le même code."
  - key: qcm-bonnes-pratiques
    format: multiple-choice
    question: "Un bug se trouve dans un fichier marqué `DO NOT EDIT`. Que fais-tu ?"
    choices:
      - {text: "Je corrige la source ou le générateur, puis je régénère", correct: true}
      - {text: "Je corrige le fichier généré à la main, puis je le commite", correct: false}
      - {text: "Je retire l'en-tête `DO NOT EDIT`, puis je corrige le fichier", correct: false}
      - {text: "Je corrige le fichier et j'ajoute un `//nolint` pour le garder", correct: false}
    answer: "Une correction à la main disparaît à la prochaine régénération. On corrige la source (schéma, `.proto`, constantes) ou le générateur, on régénère, et on garde le code versionné avec son en-tête, généré par des outils épinglés."
  - key: qcm-stringer
    format: multiple-choice
    question: Que produit `stringer -type=Statut` ?
    choices:
      - text: Une méthode String() qui renvoie le nom de chaque constante
        correct: true
      - text: Une fonction de conversion depuis une chaîne
        correct: false
      - text: Des tests unitaires
        correct: false
      - text: Un fichier JSON
        correct: false
    answer: Par exemple Payee.String() renvoie "Payee".
  - key: trous-directive
    format: fill-in
    question: |-
      Complète la directive :
      ```go
      //go:___ go tool stringer -type=Statut
      ```
    blanks:
      - - generate
    answer: //go:generate.
  - key: trous-commande
    format: fill-in
    question: |-
      Complète pour lancer toutes les générations :
      ```
      go ___ ./...
      ```
    blanks:
      - - generate
    answer: go generate.
  - key: trous-entete
    format: fill-in
    question: |-
      Complète l'en-tête d'un fichier généré :
      ```go
      // Code generated by stringer; DO NOT ___.
      ```
    blanks:
      - - EDIT
    answer: DO NOT EDIT.
  - key: trous-diff
    format: fill-in
    question: |-
      Complète la vérification de la CI :
      ```
      go generate ./... && git diff ___
      ```
    blanks:
      - - --exit-code
    answer: "--exit-code fait échouer si un fichier a changé."
  - key: scenario-enum
    format: scenario
    question: "Comment gères-tu une énumération de statuts en Go, avec un affichage lisible ?"
    choices:
      - {text: "`type Statut int` et des constantes `iota`, avec `stringer` lancé par `go:generate` pour `String`", correct: true}
      - {text: "Un `enum Statut { ... }`, que Go compile avec une méthode `String` déjà fournie pour chaque valeur", correct: false}
      - {text: "Des constantes `string` sans type nommé, comparées partout avec `strings.EqualFold` au besoin", correct: false}
      - {text: "Des constantes `iota` sans type, affichées avec `%d` puisque Go n'offre rien de plus lisible", correct: false}
    answer: "Un type `type Statut int` avec des constantes `iota`, et `//go:generate go tool stringer -type=Statut` pour la méthode `String`. Si les statuts passent en JSON ou en base, `MarshalText` et `UnmarshalText` les échangent par nom. Go n'a pas de mot-clé `enum`."
  - key: scenario-api
    format: scenario
    question: "Ton équipe maintient une spécification OpenAPI. Comment génères-tu le code Go ?"
    choices:
      - {text: "oapi-codegen, épinglé par la directive `tool` et lancé par `go:generate`, code versionné et vérifié en CI", correct: true}
      - {text: "Les types écrits à la main d'après la spécification, relus en revue à chaque changement de l'API", correct: false}
      - {text: "oapi-codegen lancé une fois sur un poste, puis le code généré retouché à la main au fil des besoins", correct: false}
      - {text: "La spécification lue au démarrage du serveur, qui crée ses routes et ses types par réflexion", correct: false}
    answer: "oapi-codegen (ou ogen), déclaré par la directive `tool` et lancé par une directive `go:generate` près de la spécification, produit les types et une interface serveur à implémenter. Le code est versionné, la CI régénère et vérifie le diff : l'implémentation suit la spécification."
  - key: scenario-limites
    format: scenario
    question: "Quelles sont les limites de la génération de code ?"
    choices:
      - {text: "Une étape de plus à vérifier en CI, de gros diffs, des outils à épingler, un code parfois dur à déboguer", correct: true}
      - {text: "Un binaire plus lent, car le code généré passe par la réflexion à chaque appel pendant l'exécution", correct: false}
      - {text: "Aucune vraie limite : on peut générer tout code répétitif, même quand il ne fait que quelques lignes", correct: false}
      - {text: "Un code que le compilateur ne vérifie pas, puisqu'il ne vient d'aucun fichier source du module", correct: false}
    answer: "Une étape de plus à ne pas oublier (d'où la vérification en CI), des diffs volumineux, des outils à installer et à épingler, un code parfois peu lisible au débogage. On s'en sert quand elle supprime beaucoup de code répétitif ou garantit une cohérence (SQL, Protobuf, OpenAPI), pas pour quelques lignes."
  - key: scenario-generiques
    format: scenario
    question: "Depuis les génériques, faut-il encore générer du code ?"
    choices:
      - {text: "Moins : les génériques remplacent le code par type, mais SQL, `.proto` ou OpenAPI se génèrent encore", correct: true}
      - {text: "Non : les génériques remplacent toute génération de code, sources externes comprises", correct: false}
      - {text: "Autant qu'avant : les génériques sont trop lents, on génère toujours une version par type", correct: false}
      - {text: "Plus qu'avant : `go generate` sert désormais à instancier chaque fonction générique", correct: false}
    answer: "Moins qu'avant : les génériques remplacent la génération de conteneurs ou de fonctions par type (listes, `Map`, `Filter`). La génération reste utile quand le code dépend d'une source externe (schéma SQL, `.proto`, OpenAPI) ou demanderait de la réflexion (`String` des énumérations, sérialisation rapide)."
