notion: go-generate
lesson: "**`go generate`** lance des commandes écrites dans des commentaires **`//go:generate`** du code source, pour produire\ndu code (ou d'autres fichiers) avant la compilation :\n\n```go\n//go:generate go tool stringer -type=Statut\ntype Statut int\n\nconst (\n\tEnAttente Statut = iota\n\tPayee\n\tExpediee\n)\n```\n\n```\ngo generate ./...   # lance toutes les directives, dans le dossier de chaque fichier\n```\n\nLes points clés :\n- `go generate` ne s'exécute **jamais** automatiquement : ni `go build` ni `go test` ne le lancent ; on le lance à la\n  main ou en CI ;\n- le code généré est **versionné** dans le dépôt, pour que `go build` et `go get` fonctionnent sans les outils ;\n- un fichier généré commence par le commentaire **`// Code generated ... DO NOT EDIT.`**, que les outils reconnaissent\n  (les linters l'ignorent, les revues le replient) ;\n- la CI vérifie que le code généré est **à jour** : `go generate ./...` puis `git diff --exit-code` ;\n- les outils sont épinglés avec la directive **tool** (`go tool stringer`) pour que tout le monde génère la même chose.\n\nLes générateurs courants : `stringer` (méthode String des énumérations), `sqlc` (accès SQL typé), `protoc` ou `buf`\n(Protobuf, gRPC), `mockgen` ou `mockery` (mocks), `oapi-codegen` (OpenAPI), `go-enum`.\n\nLa génération remplace en Go une partie de ce que d'autres langages font par réflexion ou annotations : le code\nproduit est visible, relu et rapide.\n\n**En entretien** : « Des directives //go:generate lancées par go generate, jamais automatiquement ; le code généré est\nversionné, marqué DO NOT EDIT, et vérifié à jour en CI ; stringer, sqlc, protoc. »"
cards:
  - key: sert-generate
    format: course
    question: À quoi sert go generate ?
    answer: À exécuter les commandes de génération déclarées par des directives //go:generate.
  - key: pas-auto
    format: course
    question: go build lance-t-il go generate ?
    answer: 'Non : go generate ne s''exécute jamais automatiquement, ni au build ni aux tests ; on le lance à la main, et la CI vérifie que le résultat versionné est à jour.'
  - key: entete
    format: course
    question: Comment les outils reconnaissent-ils un fichier généré ?
    answer: 'À la ligne `// Code generated <outil>; DO NOT EDIT.` (correspondant à l''expression ^// Code generated .* DO NOT EDIT\.$) avant la clause package : les linters l''ignorent et les revues le replient.'
  - key: versionner
    format: course
    question: Pourquoi versionner le code généré ?
    answer: Pour que `go build` et `go get` fonctionnent chez tous les utilisateurs du module sans installer les générateurs, et pour voir dans les revues ce que change une régénération.
  - key: vf-auto
    format: true-false
    question: go test lance les directives go:generate avant les tests.
    truth: false
    answer: Il faut lancer go generate soi-même.
  - key: vf-dossier
    format: true-false
    question: Une directive go:generate s'exécute dans le dossier du fichier qui la contient.
    truth: true
    answer: Les chemins relatifs partent de ce dossier.
  - key: vf-editer
    format: true-false
    question: On peut modifier un fichier généré à la main, les modifications seront conservées.
    truth: false
    answer: La prochaine génération les écrasera ; on modifie la source.
  - key: vf-reflexion
    format: true-false
    question: En Go, la génération de code remplace souvent la réflexion ou les annotations d'autres langages.
    truth: true
    answer: Le code produit est explicite et rapide.
  - key: qcm-generateurs
    format: multiple-choice
    question: Quel générateur pour quel besoin ?
    choices:
      - text: 'Méthode String d''une énumération : stringer'
        correct: true
      - text: 'Code d''accès SQL typé : sqlc'
        correct: true
      - text: 'Code Protobuf et gRPC : protoc ou buf'
        correct: true
      - text: 'Formater le code : go generate'
        correct: false
    answer: Le formatage est l'affaire de gofmt.
  - key: qcm-ci
    format: multiple-choice
    question: Comment vérifier en CI que le code généré est à jour ?
    choices:
      - text: Lancer go generate ./... puis git diff --exit-code
        correct: true
      - text: Utiliser les mêmes versions de générateurs (directive tool)
        correct: true
      - text: Supprimer le code généré avant chaque build
        correct: false
      - text: Rien, go build régénère tout
        correct: false
    answer: Des versions différentes produiraient des diffs parasites.
  - key: qcm-bonnes-pratiques
    format: multiple-choice
    question: Quelles pratiques sont recommandées ?
    choices:
      - text: Versionner le code généré
        correct: true
      - text: Épingler les versions des générateurs
        correct: true
      - text: Garder l'en-tête DO NOT EDIT
        correct: true
      - text: Modifier le code généré pour corriger un bug
        correct: false
    answer: On corrige la source ou le générateur.
  - key: qcm-stringer
    format: multiple-choice
    question: Que produit `stringer -type=Statut` ?
    choices:
      - text: Une méthode String() qui renvoie le nom de chaque constante
        correct: true
      - text: Une fonction de conversion depuis une chaîne
        correct: false
      - text: Des tests unitaires
        correct: false
      - text: Un fichier JSON
        correct: false
    answer: Par exemple Payee.String() renvoie "Payee".
  - key: trous-directive
    format: fill-in
    question: |-
      Complétez la directive :
      ```go
      //go:___ go tool stringer -type=Statut
      ```
    blanks:
      - - generate
    answer: //go:generate.
  - key: trous-commande
    format: fill-in
    question: |-
      Complétez pour lancer toutes les générations :
      ```
      go ___ ./...
      ```
    blanks:
      - - generate
    answer: go generate.
  - key: trous-entete
    format: fill-in
    question: |-
      Complétez l'en-tête d'un fichier généré :
      ```go
      // Code generated by stringer; DO NOT ___.
      ```
    blanks:
      - - EDIT
    answer: DO NOT EDIT.
  - key: trous-diff
    format: fill-in
    question: |-
      Complétez la vérification de la CI :
      ```
      go generate ./... && git diff ___
      ```
    blanks:
      - - --exit-code
    answer: "--exit-code fait échouer si un fichier a changé."
  - key: scenario-enum
    format: scenario
    question: Comment gères-tu une énumération de statuts en Go, avec un affichage lisible ?
    answer: |-
      Un type `type Statut int` avec des constantes iota, et `//go:generate go tool stringer -type=Statut` pour la méthode
      String. Si les statuts passent en JSON ou en base, j'ajoute MarshalText et UnmarshalText (ou un générateur comme
      go-enum) pour les échanger par nom plutôt que par nombre. Le code généré est versionné et vérifié à jour en CI.
  - key: scenario-api
    format: scenario
    question: Ton équipe maintient une spécification OpenAPI. Comment génères-tu le code Go ?
    answer: |-
      Avec oapi-codegen (ou ogen), déclaré par la directive tool et lancé par une directive go:generate à côté du fichier
      de spécification : il produit les types et une interface serveur à implémenter. Le code généré est versionné ; la CI
      régénère et vérifie le diff, ce qui garantit que l'implémentation suit la spécification.
  - key: scenario-limites
    format: scenario
    question: Quelles sont les limites de la génération de code ?
    answer: |-
      Un étape de plus à ne pas oublier (d'où la vérification en CI), des diffs volumineux qui encombrent les revues, des
      outils à installer et à épingler, et un code parfois peu lisible quand il faut déboguer. Je l'utilise quand elle
      supprime beaucoup de code répétitif ou garantit une cohérence (SQL, Protobuf, OpenAPI), pas pour quelques lignes.
  - key: scenario-generiques
    format: scenario
    question: Depuis les génériques, faut-il encore générer du code ?
    answer: |-
      Moins qu'avant : les génériques remplacent la génération de conteneurs ou de fonctions par type (listes, Map,
      Filter). La génération reste utile quand le code dépend d'une source externe (schéma SQL, .proto, OpenAPI), ou
      pour du code qui demanderait de la réflexion (String des énumérations, sérialisation rapide).
