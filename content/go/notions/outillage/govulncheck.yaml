notion: govulncheck
lesson: |-
  **`govulncheck`** (`golang.org/x/vuln/cmd/govulncheck`) cherche les **vulnérabilités connues** dans un projet, à partir
  de la base de vulnérabilités Go (`vuln.go.dev`), qui couvre les modules et la **bibliothèque standard**.

  ```
  go install golang.org/x/vuln/cmd/govulncheck@latest
  govulncheck ./...               # analyse du code source
  govulncheck -mode=binary ./app  # analyse d'un binaire déjà compilé
  ```

  Sa particularité : il fait une **analyse d'atteignabilité**. Il ne se contente pas de dire « ce module a une
  vulnérabilité » : il vérifie si le code **appelle réellement** la fonction vulnérable, en suivant le graphe d'appels.
  - les vulnérabilités **atteintes** sont signalées avec la pile d'appels qui y mène : à corriger en priorité ;
  - celles présentes dans les dépendances mais **non atteintes** sont mentionnées à part : moins urgentes.

  C'est ce qui réduit le **bruit** par rapport aux scanners de dépendances qui signalent tout ce qui est dans le graphe.

  Les remèdes :
  - monter la dépendance à la version corrigée indiquée (`go get module@version`, puis `go mod tidy`) ;
  - pour la bibliothèque standard, monter la **version de Go** (un correctif mineur, par exemple 1.27.3) : la chaîne
    d'outils fait partie de la surface d'attaque.

  En CI, govulncheck échoue s'il trouve une vulnérabilité atteinte ; une tâche planifiée le relance régulièrement, car de
  nouvelles vulnérabilités sont publiées sans que le code change.

  **En entretien** : « Base de vulnérabilités Go, stdlib comprise ; analyse d'atteignabilité : seules les fonctions
  vulnérables vraiment appelées comptent ; mode source ou binaire ; en CI et en tâche planifiée. »
cards:
  - key: particulier-govulncheck
    format: course
    question: "Qu'a de particulier govulncheck parmi les scanners de vulnérabilités ?"
    choices:
      - {text: "Il ne met en avant que les vulnérabilités dont le code est réellement appelé", correct: true}
      - {text: "Il corrige lui-même le code vulnérable et ouvre la pull request de correction", correct: false}
      - {text: "Il signale toute vulnérabilité d'un module du `go.mod`, utilisé ou non", correct: false}
      - {text: "Il surveille le binaire en cours d'exécution pour bloquer les attaques en direct", correct: false}
    answer: "Il ne signale en priorité que les vulnérabilités dont le code est réellement appelé par le programme ; les autres sont listées à part. Il ne corrige rien lui-même."
  - key: dependance-transitive-vulnerabilite-mais
    format: scenario
    question: "Une dépendance transitive a une vulnérabilité, mais la bibliothèque qui l'utilise n'a pas encore publié de correctif. Que fais-tu ?"
    choices:
      - {text: "J'exige moi-même la version corrigée de la dépendance transitive : `go get vuln/module@v1.2.4`", correct: true}
      - {text: "J'attends le correctif de la bibliothèque intermédiaire : je ne peux rien changer sous elle", correct: false}
      - {text: "Je supprime la ligne de la dépendance dans `go.sum`, pour forcer un nouveau téléchargement", correct: false}
      - {text: "Je recopie la bibliothèque intermédiaire dans le projet pour corriger son `go.mod` à la main", correct: false}
    answer: "Avec la MVS, exiger dans mon `go.mod` une version minimale corrigée (`go get vuln/module@v1.2.4`) suffit : Go prend le maximum des minimums, et tout le graphe l'utilise, tant qu'elle reste de la même version majeure. govulncheck et les tests le confirment ; je retire l'exigence quand la bibliothèque intermédiaire publie sa mise à jour."
  - key: terme-govulncheck
    format: course
    question: "Dans l'outillage Go, que désigne govulncheck ?"
    choices:
      - {text: "Le détecteur officiel des vulnérabilités atteignables", correct: true}
      - {text: "L'analyseur statique intégré des erreurs probables", correct: false}
      - {text: "Le bot qui ouvre les pull requests de mise à jour", correct: false}
      - {text: "Le journal public des empreintes des modules", correct: false}
    answer: "Le détecteur officiel de vulnérabilités atteignables. L'analyseur des erreurs probables, c'est `go vet` ; le bot de mises à jour, Dependabot ou Renovate ; le journal des empreintes, sum.golang.org."
  - key: atteignabilite
    format: course
    question: "Pourquoi govulncheck signale-t-il moins de faux positifs qu'un scanner de dépendances classique ?"
    choices:
      - {text: "Il suit le graphe d'appels et met en avant les fonctions vulnérables réellement appelées", correct: true}
      - {text: "Il ignore les dépendances indirectes, qu'un attaquant ne peut jamais exploiter", correct: false}
      - {text: "Il ne consulte que les vulnérabilités critiques, et écarte celles de gravité moyenne", correct: false}
      - {text: "Il ne lit que `go.sum`, plus exact que `go.mod` sur les versions vraiment utilisées", correct: false}
    answer: "Il analyse le graphe d'appels et ne met en avant que les vulnérabilités dont la fonction vulnérable est réellement appelée ; les autres sont listées à part, comme moins urgentes. Une dépendance indirecte atteinte reste exploitable."
  - key: stdlib
    format: course
    question: "Comment corriges-tu une vulnérabilité signalée dans la bibliothèque standard ?"
    choices:
      - {text: "En montant la version de Go qui compile, souvent un correctif comme 1.27.3, puis en redéployant", correct: true}
      - {text: "Avec `go get std@latest`, qui met la bibliothèque standard à jour dans le `go.mod` du module", correct: false}
      - {text: "En recopiant le package corrigé dans `vendor/`, à la place de celui de la bibliothèque standard", correct: false}
      - {text: "En attendant la prochaine version majeure de Go, la seule à corriger la bibliothèque standard", correct: false}
    answer: "La bibliothèque standard vient avec la chaîne de compilation : on monte la version de Go, souvent un correctif mineur (1.27.2 vers 1.27.3), puis on recompile et on redéploie. Aucun `go get` ne la corrige."
  - key: vf-stdlib
    format: true-false
    question: govulncheck vérifie aussi les vulnérabilités de la bibliothèque standard.
    truth: true
    answer: La version de Go fait partie de l'analyse.
  - key: vf-binaire
    format: true-false
    question: govulncheck peut analyser un binaire déjà compilé.
    truth: true
    answer: Avec -mode=binary.
  - key: vf-une-fois
    format: true-false
    question: Si govulncheck ne trouve rien aujourd'hui, inutile de le relancer tant que le code ne change pas.
    truth: false
    answer: De nouvelles vulnérabilités sont publiées en permanence ; on le relance régulièrement.
  - key: vf-tout
    format: true-false
    question: govulncheck met au même niveau toutes les vulnérabilités présentes dans le graphe de dépendances.
    truth: false
    answer: Il distingue celles réellement atteintes par le code.
  - key: qcm-remedes
    format: multiple-choice
    question: "govulncheck signale une vulnérabilité atteinte dans `golang.org/x/net`, une dépendance indirecte. Que fais-tu ?"
    choices:
      - {text: "Monter vers la version corrigée avec `go get`, puis tests et redéploiement", correct: true}
      - {text: "Rien : une dépendance indirecte ne peut pas être exploitée", correct: false}
      - {text: "Supprimer sa ligne de `go.sum`, pour forcer un nouveau téléchargement", correct: false}
      - {text: "Attendre que le module qui l'importe publie lui-même une mise à jour", correct: false}
    answer: "Une dépendance indirecte atteinte est tout aussi exploitable : `go get golang.org/x/net@<version corrigée>`, `go mod tidy`, les tests, puis le redéploiement. La MVS fait profiter tout le graphe de la version corrigée."
  - key: qcm-ci
    format: multiple-choice
    question: "Où lances-tu govulncheck pour repérer une vulnérabilité publiée après la fusion d'une PR ?"
    choices:
      - {text: "Dans une tâche planifiée quotidienne sur la branche principale", correct: true}
      - {text: "À chaque pull request seulement, juste avant sa fusion", correct: false}
      - {text: "Une fois par an, au moment de l'audit de sécurité", correct: false}
      - {text: "Sur le poste du développeur, avant chacun de ses commits", correct: false}
    answer: "Une analyse à la PR ne voit que les vulnérabilités déjà connues ; une tâche planifiée détecte celles publiées ensuite. On garde aussi l'analyse des PR, qui échoue sur une vulnérabilité atteinte, et le mode `binary` sur les binaires déployés."
  - key: qcm-base
    format: multiple-choice
    question: D'où govulncheck tire-t-il ses informations ?
    choices:
      - text: De la base de vulnérabilités Go, vuln.go.dev
        correct: true
      - text: Des commentaires du code
        correct: false
      - text: De go.sum uniquement
        correct: false
      - text: D'une analyse dynamique en production
        correct: false
    answer: Une base relue par l'équipe sécurité de Go, avec les fonctions concernées.
  - key: qcm-difference
    format: multiple-choice
    question: "Lesquels de ces apports govulncheck a-t-il par rapport à Dependabot ?"
    choices:
      - text: La connaissance des fonctions vulnérables réellement appelées
        correct: true
      - text: La prise en compte de la version de Go
        correct: true
      - text: L'ouverture automatique des pull requests de mise à jour
        correct: false
      - text: La correction automatique du code
        correct: false
    answer: 'Les deux se complètent : Dependabot propose, govulncheck priorise.'
  - key: scenario-alerte
    format: scenario
    question: "Le scanner de l'entreprise signale 40 vulnérabilités dans tes dépendances. Comment priorises-tu ?"
    choices:
      - {text: "govulncheck d'abord : je corrige celles dont la fonction est appelée, puis le reste au fil des mises à jour", correct: true}
      - {text: "Je corrige les 40 dans l'ordre du score CVSS, sans regarder si notre code les atteint vraiment", correct: false}
      - {text: "Je monte toutes les dépendances à `@latest` en une seule PR, majeures comprises, et je ferme l'alerte", correct: false}
      - {text: "Je les ignore : un scanner générique ne comprend pas Go et ne produit que des faux positifs", correct: false}
    answer: "govulncheck distingue les vulnérabilités dont la fonction est réellement appelée, avec la pile d'appels, de celles seulement présentes. Je corrige d'abord les premières (montée de version, ou contournement s'il n'existe pas de version corrigée), puis les autres par des mises à jour régulières, et je documente le raisonnement pour l'équipe sécurité."
  - key: scenario-go
    format: scenario
    question: "Une vulnérabilité est publiée dans `net/http`. Que fais-tu pour tes services ?"
    choices:
      - {text: "govulncheck dit qui l'atteint ; je monte Go en CI, dans les images et la `toolchain`, puis je redéploie", correct: true}
      - {text: "Un `go get net/http@latest` dans chaque service, puis le redéploiement des services exposés", correct: false}
      - {text: "J'attends que les dépendances publient un correctif, puisque `net/http` vient de l'une d'elles", correct: false}
      - {text: "Je redémarre les services sans recompiler : le correctif s'applique au Go installé sur le nœud", correct: false}
    answer: "govulncheck (source ou binaire) dit quels services l'atteignent. Je monte la version de Go dans la CI et les images de build vers le correctif, je recompile et redéploie d'abord les services exposés. La directive `toolchain` et l'image de base du Dockerfile doivent suivre ; `net/http` est compilé dans le binaire, aucun `go get` ne le corrige."
  - key: scenario-binaire
    format: scenario
    question: "Pourquoi analyser aussi les binaires déployés avec govulncheck ?"
    choices:
      - {text: "Le binaire en production a pu être compilé il y a des semaines, avec un autre Go et d'autres dépendances", correct: true}
      - {text: "Parce que govulncheck ne sait pas analyser le code source, seulement des binaires déjà compilés", correct: false}
      - {text: "Parce qu'un binaire compilé avec `-trimpath` cache ses dépendances à l'analyse du code source", correct: false}
      - {text: "Parce que seul le binaire contient le code des dépendances indirectes, absent du code source", correct: false}
    answer: "Le binaire en production peut dater de plusieurs semaines, avec une version de Go et des dépendances différentes de la branche principale. `govulncheck -mode=binary` sur l'artefact déployé dit ce qui tourne vraiment, et déclenche une recompilation si une vulnérabilité est publiée entre-temps."
