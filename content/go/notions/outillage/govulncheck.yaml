notion: govulncheck
lesson: |-
  **`govulncheck`** (`golang.org/x/vuln/cmd/govulncheck`) cherche les **vulnérabilités connues** dans un projet, à partir
  de la base de vulnérabilités Go (`vuln.go.dev`), qui couvre les modules et la **bibliothèque standard**.

  ```
  go install golang.org/x/vuln/cmd/govulncheck@latest
  govulncheck ./...               # analyse du code source
  govulncheck -mode=binary ./app  # analyse d'un binaire déjà compilé
  ```

  Sa particularité : il fait une **analyse d'atteignabilité**. Il ne se contente pas de dire « ce module a une
  vulnérabilité » : il vérifie si le code **appelle réellement** la fonction vulnérable, en suivant le graphe d'appels.
  - les vulnérabilités **atteintes** sont signalées avec la pile d'appels qui y mène : à corriger en priorité ;
  - celles présentes dans les dépendances mais **non atteintes** sont mentionnées à part : moins urgentes.

  C'est ce qui réduit le **bruit** par rapport aux scanners de dépendances qui signalent tout ce qui est dans le graphe.

  Les remèdes :
  - monter la dépendance à la version corrigée indiquée (`go get module@version`, puis `go mod tidy`) ;
  - pour la bibliothèque standard, monter la **version de Go** (un correctif mineur, par exemple 1.27.3) : la chaîne
    d'outils fait partie de la surface d'attaque.

  En CI, govulncheck échoue s'il trouve une vulnérabilité atteinte ; une tâche planifiée le relance régulièrement, car de
  nouvelles vulnérabilités sont publiées sans que le code change.

  **En entretien** : « Base de vulnérabilités Go, stdlib comprise ; analyse d'atteignabilité : seules les fonctions
  vulnérables vraiment appelées comptent ; mode source ou binaire ; en CI et en tâche planifiée. »
cards:
  - key: particulier-govulncheck
    format: course
    question: Qu'a de particulier govulncheck ?
    answer: Il ne signale que les vulnérabilités dont le code est réellement appelé par le programme.
  - key: dependance-transitive-vulnerabilite-mais
    format: scenario
    question: Une dépendance transitive a une vulnérabilité, mais la bibliothèque qui l'utilise n'a pas encore publié de correctif.
    answer: |-
      Avec MVS, je peux exiger directement une version minimale corrigée de la dépendance transitive dans mon go.mod : `go get vuln/module@v1.2.4`. Comme Go prend le maximum des minimums, c'est cette version qui sera utilisée par tout le graphe, à condition qu'elle reste compatible (même version majeure).
      Je vérifierais avec `govulncheck` que le code vulnérable est effectivement atteint et que la correction le résout, je lancerais les tests, puis je retirerais l'exigence explicite quand la bibliothèque intermédiaire aura publié sa mise à jour.
  - key: terme-govulncheck
    format: course
    question: Que désigne « govulncheck » ?
    answer: Détecteur officiel de vulnérabilités atteignables
  - key: atteignabilite
    format: course
    question: Pourquoi govulncheck signale-t-il moins de faux positifs qu'un scanner de dépendances classique ?
    answer: Il analyse le graphe d'appels et ne met en avant que les vulnérabilités dont la fonction vulnérable est réellement appelée par le code ; les autres sont listées à part, comme moins urgentes.
  - key: stdlib
    format: course
    question: Comment corriger une vulnérabilité signalée dans la bibliothèque standard ?
    answer: En montant la version de Go utilisée pour compiler, souvent un correctif mineur (1.27.2 vers 1.27.3), puis en recompilant et en redéployant ; aucun go get ne la corrige.
  - key: vf-stdlib
    format: true-false
    question: govulncheck vérifie aussi les vulnérabilités de la bibliothèque standard.
    truth: true
    answer: La version de Go fait partie de l'analyse.
  - key: vf-binaire
    format: true-false
    question: govulncheck peut analyser un binaire déjà compilé.
    truth: true
    answer: Avec -mode=binary.
  - key: vf-une-fois
    format: true-false
    question: Si govulncheck ne trouve rien aujourd'hui, inutile de le relancer tant que le code ne change pas.
    truth: false
    answer: De nouvelles vulnérabilités sont publiées en permanence ; on le relance régulièrement.
  - key: vf-tout
    format: true-false
    question: govulncheck met au même niveau toutes les vulnérabilités présentes dans le graphe de dépendances.
    truth: false
    answer: Il distingue celles réellement atteintes par le code.
  - key: qcm-remedes
    format: multiple-choice
    question: govulncheck signale une vulnérabilité atteinte dans golang.org/x/net. Que faire ?
    choices:
      - text: Monter vers la version corrigée indiquée avec go get
        correct: true
      - text: Lancer go mod tidy, les tests, puis redéployer
        correct: true
      - text: Ignorer, c'est une dépendance indirecte
        correct: false
      - text: Supprimer la ligne de go.sum
        correct: false
    answer: Une dépendance indirecte atteinte est tout aussi exploitable.
  - key: qcm-ci
    format: multiple-choice
    question: Comment intégrer govulncheck ?
    choices:
      - text: À chaque pull request, en faisant échouer la CI sur une vulnérabilité atteinte
        correct: true
      - text: Dans une tâche planifiée quotidienne sur la branche principale
        correct: true
      - text: Sur les binaires déployés, en mode binary
        correct: true
      - text: Une fois par an
        correct: false
    answer: La tâche planifiée détecte les vulnérabilités publiées après la fusion.
  - key: qcm-base
    format: multiple-choice
    question: D'où govulncheck tire-t-il ses informations ?
    choices:
      - text: De la base de vulnérabilités Go, vuln.go.dev
        correct: true
      - text: Des commentaires du code
        correct: false
      - text: De go.sum uniquement
        correct: false
      - text: D'une analyse dynamique en production
        correct: false
    answer: Une base relue par l'équipe sécurité de Go, avec les fonctions concernées.
  - key: qcm-difference
    format: multiple-choice
    question: Qu'apporte govulncheck par rapport à Dependabot ?
    choices:
      - text: La connaissance des fonctions vulnérables réellement appelées
        correct: true
      - text: La prise en compte de la version de Go
        correct: true
      - text: L'ouverture automatique des pull requests de mise à jour
        correct: false
      - text: La correction automatique du code
        correct: false
    answer: 'Les deux se complètent : Dependabot propose, govulncheck priorise.'
  - key: scenario-alerte
    format: scenario
    question: Le scanner de l'entreprise signale 40 vulnérabilités dans tes dépendances. Comment priorises-tu ?
    answer: |-
      Je lance govulncheck : il distingue les vulnérabilités dont la fonction est réellement appelée par notre code, avec
      la pile d'appels, de celles qui sont seulement présentes. Je corrige d'abord les premières (montée de version, ou
      contournement si aucune version corrigée n'existe), puis je traite les autres par des mises à jour régulières. Je
      documente le raisonnement pour l'équipe sécurité.
  - key: scenario-go
    format: scenario
    question: Une vulnérabilité est publiée dans net/http. Que fais-tu pour tes services ?
    answer: |-
      Je vérifie avec govulncheck (source ou binaire) quels services l'atteignent, puis je monte la version de Go dans la
      CI et les images de build vers le correctif publié, je recompile et redéploie en priorité les services exposés. La
      directive toolchain du go.mod et l'image de base du Dockerfile doivent suivre, pour que le correctif soit vraiment
      pris en compte partout.
  - key: scenario-binaire
    format: scenario
    question: Pourquoi analyser aussi les binaires déployés ?
    answer: |-
      Le binaire en production peut avoir été compilé il y a des semaines, avec une version de Go et des dépendances
      différentes de la branche principale, voire par une autre équipe. `govulncheck -mode=binary` sur l'artefact déployé
      (ou dans le registre d'images) dit ce qui tourne vraiment, et déclenche une recompilation si une vulnérabilité est
      publiée entre-temps.
