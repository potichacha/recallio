notion: go-vet
lesson: |-
  **`go vet`** est l'analyseur statique fourni avec Go : il cherche des **erreurs probables** que le compilateur
  accepte. Ses analyses sont conçues pour avoir **très peu de faux positifs** : on le lance sur tout le code, et
  l'on corrige ce qu'il signale.

  ```
  go vet ./...
  ```

  Ce qu'il détecte, entre autres :
  - **printf** : un verbe qui ne correspond pas à l'argument (`%d` avec une chaîne), un argument manquant ;
  - **copylocks** : un mutex ou un WaitGroup copié (récepteur valeur, range) ;
  - **lostcancel** : la fonction `cancel` d'un `context.WithCancel` jamais appelée ;
  - **structtag** : un tag de struct mal formé (`json:nom` sans guillemets) ;
  - **unreachable** : du code jamais atteint ;
  - **httpresponse** : un `resp.Body` utilisé avant de vérifier l'erreur ;
  - **unusedresult** : le résultat ignoré de fonctions comme `fmt.Sprintf` ;
  - **tests** : des signatures de tests ou d'exemples erronées ;
  - **waitgroup** (Go 1.25) : un `wg.Add(1)` placé dans la goroutine au lieu d'avant ;
  - **errorsas** : un second argument de `errors.As` qui n'est pas un pointeur.

  `go test` lance automatiquement un **sous-ensemble** de ces analyses (les plus sûres, comme printf) avant les tests ;
  `go vet ./...` complet a sa place en CI. Pour aller plus loin, **staticcheck** et **golangci-lint**.

  **En entretien** : « L'analyseur standard, presque sans faux positifs : printf, copylocks, lostcancel, structtag,
  waitgroup ; go test en lance une partie ; go vet ./... en CI. »
tour:
  - title: go vet
    text: |-
      `go vet` repère ce que le compilateur accepte mais qui est presque toujours un bug : un verbe de `Printf` qui ne
      correspond pas à son argument, un argument qui manque, la copie d'un `sync.Mutex`, du code inatteignable…

      `go test` lance automatiquement une partie de ces vérifications. Ce programme compile et s'exécute, mais `go vet`
      signalerait ses deux lignes `Printf` : regarde ce que `fmt` affiche quand un verbe ne va pas.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	age := "trente-six"
          	fmt.Printf("âge : %d ans\n", age)
          	fmt.Printf("%s et %s\n", "un")
          }
      output: |-
        âge : %!d(string=trente-six) ans
        un et %!s(MISSING)
cards:
  - key: vet
    format: course
    question: "Que fait la commande `go vet` ?"
    choices:
      - {text: "Elle détecte des erreurs probables qui compilent, comme un `Printf` mal formé", correct: true}
      - {text: "Elle reformate le code selon le style officiel, comme le ferait gofmt", correct: false}
      - {text: "Elle mesure la couverture des tests et signale les fonctions non testées", correct: false}
      - {text: "Elle cherche les dépendances du module qui ont des vulnérabilités connues", correct: false}
    answer: "Elle détecte des erreurs probables qui compilent : `Printf` mal formé, copie de mutex, code inatteignable... Le formatage, c'est gofmt ; les vulnérabilités, govulncheck."
  - key: verifie-vet
    format: course
    question: "Que vérifie `go vet`, au-delà du compilateur ?"
    choices:
      - {text: "Des erreurs probables qui compilent : `Printf` incohérent, verrou copié, `cancel` oublié", correct: true}
      - {text: "Les erreurs de syntaxe et de type, avant même la compilation du package", correct: false}
      - {text: "Le style du code : noms, commentaires des exports, longueur des fonctions", correct: false}
      - {text: "Les performances : allocations inutiles, boucles lentes, requêtes coûteuses", correct: false}
    answer: "Des erreurs probables qui compilent : `Printf` incohérent, copie de verrous, `cancel` oublié, tags mal formés, etc. Le style relève de linters comme revive, les performances du profilage."
  - key: test-lance-vet
    format: course
    question: "`go test` lance-t-il `go vet` ?"
    choices:
      - {text: "Oui, un sous-ensemble d'analyses rapides et fiables, avant les tests", correct: true}
      - {text: "Non : `go vet` ne se lance qu'à la main ou en CI, jamais par `go test`", correct: false}
      - {text: "Oui, toutes les analyses de `go vet`, y compris les plus lentes", correct: false}
      - {text: "Seulement en CI, quand la variable `CI` est définie dans l'environnement", correct: false}
    answer: "Oui : `go test` lance un sous-ensemble d'analyses rapides et fiables (dont `printf`), et un signalement fait échouer le test. `-vet=off` les désactive."
  - key: terme-vet
    format: course
    question: "Que désigne « vet » dans l'outillage Go ?"
    choices:
      - {text: "L'analyseur statique intégré, lancé par `go vet`", correct: true}
      - {text: "Le formateur officiel du code, lancé par `gofmt`", correct: false}
      - {text: "Le détecteur de data races, activé par `-race`", correct: false}
      - {text: "Le méta-linter qui réunit des dizaines d'analyseurs", correct: false}
    answer: "L'analyseur statique intégré (`go vet`). Le méta-linter qui réunit des dizaines d'analyseurs, c'est golangci-lint."
  - key: vf-faux-positifs
    format: true-false
    question: go vet est conçu pour avoir très peu de faux positifs.
    truth: true
    answer: Ce qu'il signale est presque toujours un vrai problème.
  - key: vf-test
    format: true-false
    question: go test lance toutes les analyses de go vet.
    truth: false
    answer: Seulement un sous-ensemble ; go vet ./... reste utile en CI.
  - key: vf-compile
    format: true-false
    question: Un code qui compile ne peut pas être signalé par go vet.
    truth: false
    answer: vet cherche justement des erreurs que le compilateur accepte.
  - key: vf-waitgroup
    format: true-false
    question: Depuis Go 1.25, vet signale un wg.Add(1) placé à l'intérieur de la goroutine.
    truth: true
    answer: L'analyse waitgroup ; wg.Go évite ce piège.
  - key: qcm-detecte
    format: multiple-choice
    question: Lesquels de ces problèmes go vet détecte-t-il ?
    choices:
      - text: '`fmt.Printf("%d", nom)` avec nom une string'
        correct: true
      - text: Une struct contenant un sync.Mutex passée par valeur
        correct: true
      - text: Un cancel de context.WithTimeout jamais appelé
        correct: true
      - text: Une requête SQL lente
        correct: false
    answer: Les performances ne sont pas son domaine.
  - key: qcm-structtag
    format: multiple-choice
    question: "Lequel de ces tags de struct `go vet` signale-t-il ?"
    choices:
      - {text: "`json:nom`", correct: true}
      - {text: "`json:\"nom,omitempty\"`", correct: false}
      - {text: "`db:\"nom\"`", correct: false}
      - {text: "`json:\"-\"`", correct: false}
    answer: "La valeur d'un tag se met entre guillemets : `json:nom` est mal formé. vet signale aussi deux champs au même nom JSON ; les tags bien formés de n'importe quel outil sont acceptés."
  - key: qcm-ci
    format: multiple-choice
    question: "Comment utilises-tu `go vet` dans un projet ?"
    choices:
      - {text: "`go vet ./...` en CI, qui échoue au moindre signalement", correct: true}
      - {text: "Je l'ignore : si le code compile, il n'y a rien à voir", correct: false}
      - {text: "Je le lance seulement avant une version majeure", correct: false}
      - {text: "En CI, mais ses signalements restent de simples avertissements", correct: false}
    answer: "Ses signalements sont presque toujours de vrais bugs : la CI échoue dessus. On le complète par staticcheck ou golangci-lint."
  - key: qcm-errorsas
    format: multiple-choice
    question: Que signale l'analyse errorsas ?
    choices:
      - {text: "Un second argument de errors.As qui n'est pas un pointeur vers un type d'erreur", correct: true}
      - {text: "Un `errors.Is` utilisé à la place d'une simple comparaison avec `==`", correct: false}
      - {text: "Une erreur renvoyée par une fonction et jamais vérifiée par l'appelant", correct: false}
      - {text: "Un message d'erreur qui commence par une majuscule ou finit par un point", correct: false}
    answer: errors.As(err, ErrX) au lieu de errors.As(err, &cible) panique à l'exécution.
  - key: bug-printf
    format: bug-fix
    question: |-
      `go vet` signale « Printf format %d has arg nom of wrong type string ». Quelle correction est la bonne ?
      ```go
      log.Printf("utilisateur %d connecté", nom)
      ```
    choices:
      - {text: "`log.Printf(\"utilisateur %s connecté\", nom)`", correct: true}
      - {text: "`log.Printf(\"utilisateur %d connecté\", &nom)`", correct: false}
      - {text: "`log.Printf(\"utilisateur %d connecté\", len(nom))`", correct: false}
      - {text: "`log.Println(\"utilisateur %d connecté\", nom)`", correct: false}
    answer: |-
      ```go
      log.Printf("utilisateur %s connecté", nom)
      ```
      Le verbe doit correspondre au type de l'argument ; %v convient aussi pour tout type.
  - key: bug-structtag
    format: bug-fix
    question: |-
      Le champ est encodé « Email » au lieu de « email », et `go vet` signale « struct field tag not compatible with reflect.StructTag.Get ». Quelle correction est la bonne ?
      ```go
      type Client struct {
      	Email string `json:email`
      }
      ```
    choices:
      - {text: "Mettre la valeur du tag entre guillemets : `json:\"email\"`", correct: true}
      - {text: "Renommer le champ `email`, en minuscule, pour l'encoder ainsi", correct: false}
      - {text: "Écrire la valeur entre apostrophes : `json:'email'`", correct: false}
      - {text: "Écrire le tag entre guillemets doubles : \"json:email\"", correct: false}
    answer: "```go\ntype Client struct {\n\tEmail string `json:\"email\"`\n}\n```\nLa valeur d'un tag se met entre guillemets."
  - key: bug-lostcancel
    format: bug-fix
    question: |-
      `go vet` signale « the cancel function is not used on all paths (possible context leak) ». Quelle correction est la bonne ?
      ```go
      ctx, cancel := context.WithTimeout(ctx, time.Second)
      if cle == "" {
      	return ErrCle
      }
      defer cancel()
      ```
    choices:
      - {text: "Placer `defer cancel()` juste après `context.WithTimeout`", correct: true}
      - {text: "Remplacer `cancel` par `_` : le délai annule le contexte tout seul", correct: false}
      - {text: "Déplacer `defer cancel()` après le dernier `return` de la fonction", correct: false}
      - {text: "Passer à `context.WithDeadline`, qui n'a pas de `cancel` à appeler", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(ctx, time.Second)\ndefer cancel()\nif cle == \"\" {\n\treturn ErrCle\n}\n```\nLe retour anticipé sautait le defer ; on le place juste après la création du contexte."
  - key: bug-waitgroup
    format: bug-fix
    question: |-
      `go vet` (Go 1.25) signale ce code, et `wg.Wait()` rend parfois la main trop tôt. Quelle correction est la bonne ?
      ```go
      for _, t := range taches {
      	go func() {
      		wg.Add(1)
      		defer wg.Done()
      		traiter(t)
      	}()
      }
      wg.Wait()
      ```
    choices:
      - {text: "Lancer chaque tâche par `wg.Go(func() { traiter(t) })`, qui fait le `Add` avant", correct: true}
      - {text: "Copier `t := t` en tête de boucle, pour que chaque goroutine ait sa propre tâche", correct: false}
      - {text: "Remplacer `defer wg.Done()` par un `wg.Done()` appelé juste après `traiter(t)`", correct: false}
      - {text: "Ajouter un court `time.Sleep` avant `wg.Wait()`, le temps que les `Add` passent", correct: false}
    answer: "```go\nfor _, t := range taches {\n\twg.Go(func() {\n\t\ttraiter(t)\n\t})\n}\nwg.Wait()\n```\nLe Add pouvait s'exécuter après Wait ; wg.Go fait le Add avant de lancer la goroutine."
