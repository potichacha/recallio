notion: ldflags-version
cards:
  - key: connaitre-version-binaire
    format: course
    question: Comment connaître la version d'un binaire Go ?
    answer: debug.ReadBuildInfo (module, commit VCS) ou une variable injectée par -ldflags -X.
  - key: injecter-version-binaire
    format: course
    question: Comment injecter une version dans le binaire ?
    answer: -ldflags "-X main.version=..." sur une variable string.
  - key: font-ldflags-w
    format: course
    question: Que font -ldflags "-s -w" ?
    answer: Retirent la table des symboles et les informations de débogage pour réduire la taille.
  - key: sert-trimpath
    format: course
    question: À quoi sert -trimpath ?
    answer: Supprimer les chemins locaux du binaire, pour des builds reproductibles.
  - key: injecter-version-binaire-2
    format: course
    question: Comment injecter la version dans le binaire ?
    answer: -ldflags "-X main.version=..." ou lire debug.ReadBuildInfo.
  - key: contient-debug-readbuildinfo
    format: course
    question: Que contient debug.ReadBuildInfo ?
    answer: Le module, les dépendances et versions, et les informations VCS (commit, date).
