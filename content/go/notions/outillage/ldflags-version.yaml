notion: ldflags-version
lesson: "Un binaire doit pouvoir dire **quelle version** il est, pour le support et le débogage. Deux sources :\n\n**`debug.ReadBuildInfo()`** : Go enregistre automatiquement dans le binaire le chemin du module, la version (si\ninstallé par `go install module@v1.2.3`), les dépendances et leurs versions, et les informations du système de\nversions : commit, date, état modifié.\n\n```go\nif info, ok := debug.ReadBuildInfo(); ok {\n\tfor _, s := range info.Settings {\n\t\tif s.Key == \"vcs.revision\" {\n\t\t\tcommit = s.Value\n\t\t}\n\t}\n\tfmt.Println(info.Main.Version) // depuis Go 1.24, aussi pour un go build dans un dépôt git\n}\n```\n\n```\ngo version -m ./app   # lit ces informations dans n'importe quel binaire Go\n```\n\n**`-ldflags \"-X ...\"`** : on fixe la valeur d'une **variable de type string** du package au moment du build :\n\n```go\npackage main\n\nvar version = \"dev\" // remplacée au build\n```\n\n```\ngo build -ldflags \"-X main.version=1.4.2 -X main.commit=$(git rev-parse --short HEAD)\" ./cmd/app\n```\n\n- `-X` ne fonctionne que sur une variable de package de type **string**, non initialisée par une expression\n  calculée ;\n- le chemin complet est requis pour un autre package : `-X github.com/exemple/app/internal/build.Version=1.4.2`.\n\nD'autres options utiles : **`-ldflags \"-s -w\"`** retire la table des symboles et les informations de débogage (binaire\nplus petit, mais traces moins riches pour les débogueurs), **`-trimpath`** retire les chemins locaux de la machine de\nbuild (builds reproductibles, pas de nom d'utilisateur dans le binaire).\n\nOn expose la version dans une option `--version`, un endpoint `/version` ou une métrique `build_info`.\n\n**En entretien** : « debug.ReadBuildInfo et go version -m pour le module, les dépendances et le commit ; -ldflags -X\npour une variable string ; -s -w et -trimpath pour des binaires plus petits et reproductibles. »"
cards:
  - key: connaitre-version-binaire
    format: course
    question: "Comment un binaire Go peut-il connaître sa propre version ?"
    choices:
      - {text: "Avec `debug.ReadBuildInfo` (module, commit) ou une variable injectée par `-ldflags -X`", correct: true}
      - {text: "Avec `runtime.Version()`, qui renvoie la version du module qui a été compilé", correct: false}
      - {text: "Avec `os.Getenv(\"GOVERSION\")`, une variable fixée par `go build` au lancement", correct: false}
      - {text: "Avec un fichier `VERSION` que `go build` copie à côté du binaire, lu au démarrage", correct: false}
    answer: "`debug.ReadBuildInfo` donne le module et le commit VCS, et une variable `string` peut être injectée par `-ldflags -X`. `runtime.Version()` donne la version de Go, pas celle du programme."
  - key: injecter-version-binaire
    format: course
    question: "Comment injectes-tu une version dans le binaire au moment du build ?"
    choices:
      - {text: "`-ldflags \"-X main.version=...\"` sur une variable `string` du package", correct: true}
      - {text: "`-ldflags \"-X main.version=...\"` sur une constante `const version`", correct: false}
      - {text: "`-tags version=...`, lu ensuite par une contrainte de build", correct: false}
      - {text: "`go build -version=...`, lu par `runtime.Version()` à l'exécution", correct: false}
    answer: "`-ldflags \"-X main.version=...\"` fixe une variable `string` au build. `-X` ne marche pas sur une constante, déjà figée par le compilateur."
  - key: font-ldflags-w
    format: course
    question: "Que font les options `-ldflags \"-s -w\"` ?"
    choices:
      - {text: "Elles retirent la table des symboles et les informations de débogage, pour réduire la taille", correct: true}
      - {text: "Elles activent un mode sécurisé qui chiffre les chaînes de caractères du binaire", correct: false}
      - {text: "Elles retirent du binaire les chemins locaux, pour des builds reproductibles", correct: false}
      - {text: "Elles produisent un binaire statique, sans aucune dépendance à la libc", correct: false}
    answer: "Elles retirent la table des symboles (`-s`) et les informations de débogage DWARF (`-w`) pour réduire la taille. Les chemins locaux, c'est `-trimpath` ; le binaire statique, `CGO_ENABLED=0`."
  - key: sert-trimpath
    format: course
    question: "À quoi sert l'option `-trimpath` de `go build` ?"
    choices:
      - {text: "À supprimer les chemins locaux du binaire, pour des builds reproductibles", correct: true}
      - {text: "À retirer la table des symboles du binaire, pour réduire sa taille", correct: false}
      - {text: "À raccourcir les chemins d'import trop longs dans les messages d'erreur", correct: false}
      - {text: "À exclure du build les fichiers de test et les dossiers `testdata`", correct: false}
    answer: "À supprimer les chemins locaux (`/home/alice/...`) du binaire : deux machines produisent le même binaire, et rien ne fuit de l'environnement de build."
  - key: injecter-version-binaire-2
    format: course
    question: "Quelles sont les deux façons courantes de donner sa version à un binaire Go ?"
    choices:
      - {text: "Une variable fixée par `-ldflags -X`, ou les informations de `debug.ReadBuildInfo`", correct: true}
      - {text: "Une constante fixée par `-tags`, ou la version renvoyée par `runtime.Version()`", correct: false}
      - {text: "Une variable d'environnement `GOVERSION`, ou un fichier `VERSION` à côté du binaire", correct: false}
      - {text: "Un commentaire `//go:version`, ou une option `-version` passée à `go build`", correct: false}
    answer: "`-ldflags \"-X main.version=...\"` sur une variable, ou la lecture de `debug.ReadBuildInfo`, que `go build` remplit avec le module et le commit."
  - key: contient-debug-readbuildinfo
    format: course
    question: "Que contient `debug.ReadBuildInfo` ?"
    choices:
      - {text: "Le module, ses dépendances et leurs versions, et les informations VCS (commit, date)", correct: true}
      - {text: "Les variables d'environnement et les options passées au programme à son lancement", correct: false}
      - {text: "Les statistiques du ramasse-miettes et l'état de la mémoire du programme en cours", correct: false}
      - {text: "La version du système d'exploitation et le modèle du processeur de la machine", correct: false}
    answer: "Le module principal, les dépendances et leurs versions, les réglages du build et les informations VCS (commit, date, modifications locales), ajoutés par `go build`."
  - key: vf-x-string
    format: true-false
    question: '`-ldflags -X` peut fixer la valeur d''une constante entière.'
    truth: false
    answer: Seulement une variable de package de type string.
  - key: vf-vcs
    format: true-false
    question: Un binaire compilé dans un dépôt git contient le commit, lisible avec debug.ReadBuildInfo.
    truth: true
    answer: Dans les réglages vcs.revision, vcs.time et vcs.modified.
  - key: vf-version-m
    format: true-false
    question: '`go version -m binaire` affiche les dépendances et leurs versions incluses dans un binaire Go.'
    truth: true
    answer: Pratique pour auditer un binaire déployé.
  - key: vf-trimpath
    format: true-false
    question: '`-trimpath` retire du binaire les chemins de fichiers de la machine de build.'
    truth: true
    answer: Pour des builds reproductibles et sans information locale.
  - key: qcm-sources
    format: multiple-choice
    question: "Lesquelles de ces façons donnent sa version à un binaire de façon fiable ?"
    choices:
      - text: Une variable string fixée par -ldflags -X
        correct: true
      - text: debug.ReadBuildInfo, qui lit les informations ajoutées par go build
        correct: true
      - text: Un fichier VERSION lu à l'exécution à côté du binaire
        correct: false
      - text: os.Getenv("GOVERSION")
        correct: false
    answer: Un fichier externe peut manquer ou être désynchronisé.
  - key: qcm-ldflags
    format: multiple-choice
    question: "Que fait l'option `-ldflags \"-X main.version=1.2.3\"` ?"
    choices:
      - {text: "Elle fixe la variable `string` `main.version` au build", correct: true}
      - {text: "Elle fixe la constante `main.version` au build", correct: false}
      - {text: "Elle exporte `version` dans l'environnement du binaire", correct: false}
      - {text: "Elle ajoute `1.2.3` au nom du binaire produit", correct: false}
    answer: "`-X` fixe la valeur d'une variable `string` du package, pas d'une constante. `-s -w` réduit la taille ; `-trimpath`, option de `go build`, retire les chemins locaux."
  - key: qcm-chemin
    format: multiple-choice
    question: La variable Version est dans le package github.com/exemple/app/internal/build. Quel -X écrire ?
    choices:
      - {text: "`-X github.com/exemple/app/internal/build.Version=1.4.2`", correct: true}
      - {text: "`-X github.com/exemple/app/build.Version=1.4.2`", correct: false}
      - {text: "`-X app/internal/build.Version=1.4.2`", correct: false}
      - {text: "`-X internal/build.Version=1.4.2`", correct: false}
    answer: Le chemin d'import complet est requis.
  - key: qcm-exposer
    format: multiple-choice
    question: "Où exposes-tu la version d'un service pour qu'un tableau de bord suive les déploiements ?"
    choices:
      - {text: "Dans une métrique `build_info`, avec la version en étiquette", correct: true}
      - {text: "Dans le nom du binaire, comme `app-1.4.2`", correct: false}
      - {text: "Dans un commentaire en tête du fichier `main.go`", correct: false}
      - {text: "Dans le message de chaque erreur renvoyée aux clients", correct: false}
    answer: "Une métrique `build_info` (valeur 1, version en étiquette) se suit dans le temps et montre les déploiements. On l'expose aussi dans `/version` ou `/healthz` et au journal de démarrage : savoir quelle version tourne accélère tous les diagnostics."
  - key: trous-x
    format: fill-in
    question: |-
      Complète pour injecter la version :
      ```
      go build -ldflags "___ main.version=1.4.2" ./cmd/app
      ```
    blanks:
      - - -X
    answer: "-X."
  - key: trous-readbuildinfo
    format: fill-in
    question: |-
      Complète :
      ```go
      info, ok := debug.___()
      ```
    blanks:
      - - ReadBuildInfo
    answer: debug.ReadBuildInfo.
  - key: trous-revision
    format: fill-in
    question: |-
      Complète la clé qui contient le commit :
      ```go
      if s.Key == "vcs.___" {
      	commit = s.Value
      }
      ```
    blanks:
      - - revision
    answer: vcs.revision.
  - key: trous-version-m
    format: fill-in
    question: |-
      Complète pour lire les informations d'un binaire :
      ```
      go version ___ ./app
      ```
    blanks:
      - - -m
    answer: go version -m.
