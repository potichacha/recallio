notion: ldflags-version
lesson: "Un binaire doit pouvoir dire **quelle version** il est, pour le support et le débogage. Deux sources :\n\n**`debug.ReadBuildInfo()`** : Go enregistre automatiquement dans le binaire le chemin du module, la version (si\ninstallé par `go install module@v1.2.3`), les dépendances et leurs versions, et les informations du système de\nversions : commit, date, état modifié.\n\n```go\nif info, ok := debug.ReadBuildInfo(); ok {\n\tfor _, s := range info.Settings {\n\t\tif s.Key == \"vcs.revision\" {\n\t\t\tcommit = s.Value\n\t\t}\n\t}\n\tfmt.Println(info.Main.Version) // depuis Go 1.24, aussi pour un go build dans un dépôt git\n}\n```\n\n```\ngo version -m ./app   # lit ces informations dans n'importe quel binaire Go\n```\n\n**`-ldflags \"-X ...\"`** : on fixe la valeur d'une **variable de type string** du package au moment du build :\n\n```go\npackage main\n\nvar version = \"dev\" // remplacée au build\n```\n\n```\ngo build -ldflags \"-X main.version=1.4.2 -X main.commit=$(git rev-parse --short HEAD)\" ./cmd/app\n```\n\n- `-X` ne fonctionne que sur une variable de package de type **string**, non initialisée par une expression\n  calculée ;\n- le chemin complet est requis pour un autre package : `-X github.com/exemple/app/internal/build.Version=1.4.2`.\n\nD'autres options utiles : **`-ldflags \"-s -w\"`** retire la table des symboles et les informations de débogage (binaire\nplus petit, mais traces moins riches pour les débogueurs), **`-trimpath`** retire les chemins locaux de la machine de\nbuild (builds reproductibles, pas de nom d'utilisateur dans le binaire).\n\nOn expose la version dans une option `--version`, un endpoint `/version` ou une métrique `build_info`.\n\n**En entretien** : « debug.ReadBuildInfo et go version -m pour le module, les dépendances et le commit ; -ldflags -X\npour une variable string ; -s -w et -trimpath pour des binaires plus petits et reproductibles. »"
cards:
  - key: connaitre-version-binaire
    format: course
    question: Comment connaître la version d'un binaire Go ?
    answer: debug.ReadBuildInfo (module, commit VCS) ou une variable injectée par -ldflags -X.
  - key: injecter-version-binaire
    format: course
    question: Comment injecter une version dans le binaire ?
    answer: "-ldflags \"-X main.version=...\" sur une variable string."
  - key: font-ldflags-w
    format: course
    question: Que font -ldflags "-s -w" ?
    answer: Retirent la table des symboles et les informations de débogage pour réduire la taille.
  - key: sert-trimpath
    format: course
    question: À quoi sert -trimpath ?
    answer: Supprimer les chemins locaux du binaire, pour des builds reproductibles.
  - key: injecter-version-binaire-2
    format: course
    question: Comment injecter la version dans le binaire ?
    answer: "-ldflags \"-X main.version=...\" ou lire debug.ReadBuildInfo."
  - key: contient-debug-readbuildinfo
    format: course
    question: Que contient debug.ReadBuildInfo ?
    answer: Le module, les dépendances et versions, et les informations VCS (commit, date).
  - key: vf-x-string
    format: true-false
    question: '`-ldflags -X` peut fixer la valeur d''une constante entière.'
    truth: false
    answer: Seulement une variable de package de type string.
  - key: vf-vcs
    format: true-false
    question: Un binaire compilé dans un dépôt git contient le commit, lisible avec debug.ReadBuildInfo.
    truth: true
    answer: Dans les réglages vcs.revision, vcs.time et vcs.modified.
  - key: vf-version-m
    format: true-false
    question: '`go version -m binaire` affiche les dépendances et leurs versions incluses dans un binaire Go.'
    truth: true
    answer: Pratique pour auditer un binaire déployé.
  - key: vf-trimpath
    format: true-false
    question: '`-trimpath` retire du binaire les chemins de fichiers de la machine de build.'
    truth: true
    answer: Pour des builds reproductibles et sans information locale.
  - key: qcm-sources
    format: multiple-choice
    question: Comment un binaire peut-il connaître sa version ?
    choices:
      - text: Une variable string fixée par -ldflags -X
        correct: true
      - text: debug.ReadBuildInfo, qui lit les informations ajoutées par go build
        correct: true
      - text: Un fichier VERSION lu à l'exécution à côté du binaire
        correct: false
      - text: os.Getenv("GOVERSION")
        correct: false
    answer: Un fichier externe peut manquer ou être désynchronisé.
  - key: qcm-ldflags
    format: multiple-choice
    question: Que font ces options ?
    choices:
      - text: '`-s -w` réduit la taille en retirant symboles et informations de débogage'
        correct: true
      - text: '`-X main.version=1.2.3` fixe une variable string'
        correct: true
      - text: '`-trimpath` chiffre le binaire'
        correct: false
      - text: '`-s` active le mode sécurisé'
        correct: false
    answer: "-trimpath retire les chemins locaux."
  - key: qcm-chemin
    format: multiple-choice
    question: La variable Version est dans le package github.com/exemple/app/internal/build. Quel -X écrire ?
    choices:
      - text: '`-X github.com/exemple/app/internal/build.Version=1.4.2`'
        correct: true
      - text: '`-X build.Version=1.4.2`'
        correct: false
      - text: '`-X Version=1.4.2`'
        correct: false
      - text: '`-X internal/build.Version=1.4.2`'
        correct: false
    answer: Le chemin d'import complet est requis.
  - key: qcm-exposer
    format: multiple-choice
    question: Où exposer la version d'un service ?
    choices:
      - text: Un endpoint /version ou dans /healthz
        correct: true
      - text: Une métrique build_info avec la version en étiquette
        correct: true
      - text: Le journal de démarrage
        correct: true
      - text: Nulle part, ce n'est pas utile
        correct: false
    answer: Savoir quelle version tourne accélère tous les diagnostics.
  - key: trous-x
    format: fill-in
    question: |-
      Complétez pour injecter la version :
      ```
      go build -ldflags "___ main.version=1.4.2" ./cmd/app
      ```
    blanks:
      - - -X
    answer: "-X."
  - key: trous-readbuildinfo
    format: fill-in
    question: |-
      Complétez :
      ```go
      info, ok := debug.___()
      ```
    blanks:
      - - ReadBuildInfo
    answer: debug.ReadBuildInfo.
  - key: trous-revision
    format: fill-in
    question: "Complétez la clé qui contient le commit :\n```go\nif s.Key == \"vcs.___\" {\n\tcommit = s.Value\n}\n```"
    blanks:
      - - revision
    answer: vcs.revision.
  - key: trous-version-m
    format: fill-in
    question: |-
      Complétez pour lire les informations d'un binaire :
      ```
      go version ___ ./app
      ```
    blanks:
      - - -m
    answer: go version -m.
