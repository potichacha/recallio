notion: go-sum-proxy
lesson: |-
  **`go.sum`** contient les **sommes de contrôle** (hash) du contenu de chaque version de dépendance : à chaque
  téléchargement, Go vérifie que le code est **identique** à celui enregistré. Une dépendance modifiée après coup
  (tag déplacé, dépôt compromis) est détectée.

  ```
  github.com/jackc/pgx/v5 v5.7.6 h1:rWQc5FwZSPX58r1OQmkuaNicxdmExaEz5A2DO2hUuTk=
  github.com/jackc/pgx/v5 v5.7.6/go.mod h1:3ZW5RYDQaE7kZ6tu5xHrRlCvO66uC5n/kN1kHZ8mbkg=
  ```

  Le **proxy de modules** (`GOPROXY`, par défaut `https://proxy.golang.org,direct`) sert les modules publics depuis un
  cache : téléchargements rapides et **disponibles** même si le dépôt d'origine disparaît (une version servie une fois
  reste servie).

  La **base de sommes de contrôle** (`GOSUMDB`, par défaut `sum.golang.org`) est un journal public et infalsifiable des
  sommes de toutes les versions publiques : la **première** fois qu'on télécharge une version, sa somme est comparée à
  celle du journal, ce qui empêche qu'un proxy ou un dépôt serve un contenu différent à certains utilisateurs.

  Pour les modules **privés** :
  - **`GOPRIVATE=gitlab.entreprise.fr/*`** : ni proxy public ni base de sommes publique pour ces chemins ;
  - ou un proxy d'entreprise (Athens, Artifactory, GoProxy) dans GOPROXY.

  Commandes utiles : `go mod download` (préremplir le cache, par exemple dans une image Docker), `go mod verify`
  (vérifier le cache local contre go.sum).

  **En entretien** : « go.sum vérifie le contenu exact de chaque dépendance ; le proxy met en cache et garantit la
  disponibilité ; sum.golang.org est le journal public des sommes ; GOPRIVATE pour le code interne. »
cards:
  - key: garantit-sum
    format: course
    question: "Que garantit le fichier `go.sum` ?"
    choices:
      - {text: "Que le contenu des modules téléchargés correspond aux empreintes enregistrées", correct: true}
      - {text: "Que les modules téléchargés n'ont aucune vulnérabilité connue à ce jour", correct: false}
      - {text: "Que les dépendances sont à leur dernière version publiée sur le proxy", correct: false}
      - {text: "Que chaque dépendance est signée par la clé privée de son auteur", correct: false}
    answer: "Que le contenu des modules téléchargés correspond aux empreintes enregistrées : un module modifié après coup est refusé. Les vulnérabilités, c'est govulncheck."
  - key: sert-sum-golang-org
    format: course
    question: "À quoi sert sum.golang.org ?"
    choices:
      - {text: "C'est un journal public des empreintes de modules : tous reçoivent le même code", correct: true}
      - {text: "C'est le proxy qui sert et garde en cache le code des modules publics", correct: false}
      - {text: "C'est la base de vulnérabilités que consulte `govulncheck` à chaque appel", correct: false}
      - {text: "C'est le registre où chaque auteur doit déclarer ses modules avant de publier", correct: false}
    answer: "C'est un journal public transparent des empreintes de modules, qui garantit que tout le monde reçoit le même code pour une version. Le proxy, c'est proxy.golang.org ; les vulnérabilités, vuln.go.dev."
  - key: sert-sum
    format: course
    question: "Faut-il versionner `go.sum`, et pourquoi ?"
    choices:
      - {text: "Oui : il vérifie l'intégrité des modules téléchargés par leurs empreintes, chez tous", correct: true}
      - {text: "Non : c'est un cache local, régénéré à chaque build comme le cache `GOCACHE`", correct: false}
      - {text: "Non : c'est un lockfile qui fige les versions, et `go.mod` suffit à les retrouver", correct: false}
      - {text: "Oui, mais seulement pour une application, jamais pour une bibliothèque publiée", correct: false}
    answer: "Oui : `go.sum` liste les empreintes des modules, et chaque téléchargement est vérifié contre elles. Ce n'est pas un lockfile : les versions viennent de `go.mod`."
  - key: sert-goproxy
    format: course
    question: "À quoi sert `GOPROXY` ?"
    choices:
      - {text: "À télécharger les modules via un proxy, `proxy.golang.org` par défaut, qui les garde immuables", correct: true}
      - {text: "À désigner le serveur HTTP par lequel le programme compilé sort sur internet", correct: false}
      - {text: "À désigner les modules privés, à télécharger sans passer par les services publics", correct: false}
      - {text: "À désigner la base publique des sommes de contrôle, consultée à chaque téléchargement", correct: false}
    answer: "À télécharger les modules via un proxy (`proxy.golang.org` par défaut) qui les met en cache de façon immuable. Les modules privés, c'est `GOPRIVATE` ; la base des sommes, `GOSUMDB`."
  - key: sert-goprivate
    format: course
    question: "À quoi sert `GOPRIVATE` ?"
    choices:
      - {text: "À télécharger certains modules directement, sans proxy public ni base de sommes", correct: true}
      - {text: "À chiffrer le code source des modules privés dans le cache local du poste", correct: false}
      - {text: "À empêcher l'import des packages internes d'un module depuis l'extérieur", correct: false}
      - {text: "À marquer les dépendances que `go mod tidy` ne doit jamais retirer du module", correct: false}
    answer: "À télécharger certains chemins directement, sans proxy public ni base de sommes publique : les noms et le code internes ne fuient pas vers ces services. Ce sont les dossiers `internal/` qui limitent les imports."
  - key: terme-goprivate-goproxy
    format: course
    question: "Que désignent respectivement `GOPRIVATE` et `GOPROXY` ?"
    choices:
      - {text: "Les modules privés, et le proxy de téléchargement des modules", correct: true}
      - {text: "Le proxy de téléchargement des modules, et les modules privés", correct: false}
      - {text: "Les modules privés, et la base publique des sommes de contrôle", correct: false}
      - {text: "Les packages `internal/`, et le proxy HTTP du programme compilé", correct: false}
    answer: "`GOPRIVATE` liste les chemins des modules privés, téléchargés sans services publics ; `GOPROXY` désigne le proxy d'où viennent les modules. La base des sommes, c'est `GOSUMDB`."
  - key: vf-gosum
    format: true-false
    question: go.sum permet de détecter qu'une version de dépendance a été modifiée après sa publication.
    truth: true
    answer: Le hash du contenu ne correspondrait plus.
  - key: vf-proxy-defaut
    format: true-false
    question: Par défaut, Go télécharge les modules publics via proxy.golang.org.
    truth: true
    answer: Puis directement depuis le dépôt (direct) si le proxy ne les a pas.
  - key: vf-private
    format: true-false
    question: Sans GOPRIVATE, le nom d'un module privé peut être envoyé au proxy et à la base de sommes publics.
    truth: true
    answer: D'où GOPRIVATE pour les chemins internes.
  - key: vf-lock
    format: true-false
    question: go.sum sert surtout à choisir les versions des dépendances.
    truth: false
    answer: C'est go.mod (avec la MVS) qui choisit ; go.sum vérifie le contenu.
  - key: qcm-roles
    format: multiple-choice
    question: "Laquelle de ces associations est fausse ?"
    choices:
      - {text: "`GOPRIVATE` : chiffrer le code source des modules privés", correct: true}
      - {text: "`go.sum` : vérifier le contenu des dépendances téléchargées", correct: false}
      - {text: "`GOPROXY` : choisir d'où télécharger les modules", correct: false}
      - {text: "`GOSUMDB` : le journal public des sommes de contrôle", correct: false}
    answer: "`GOPRIVATE` ne chiffre rien : il fait télécharger certains chemins directement, sans proxy public ni base de sommes publique. Les trois autres associations sont justes."
  - key: qcm-proxy
    format: multiple-choice
    question: "Lesquels de ces avantages apporte le proxy de modules ?"
    choices:
      - text: Des téléchargements rapides depuis un cache
        correct: true
      - text: Une version reste disponible même si son dépôt est supprimé
        correct: true
      - text: L'analyse des vulnérabilités du code
        correct: false
      - text: La compilation à distance
        correct: false
    answer: Pour les vulnérabilités, govulncheck.
  - key: qcm-prives
    format: multiple-choice
    question: "Comment utilises-tu les modules privés de l'entreprise ?"
    choices:
      - {text: "`GOPRIVATE=gitlab.entreprise.fr/*`, et git authentifié par jeton ou SSH", correct: true}
      - {text: "`GOFLAGS=-mod=mod`, pour que `go` accepte les modules non vérifiés", correct: false}
      - {text: "Supprimer `go.sum`, qui bloque les modules absents de la base publique", correct: false}
      - {text: "Copier à la main le code des modules dans le dossier du projet", correct: false}
    answer: "`GOPRIVATE` fait télécharger ces chemins directement par git, sans proxy public ni base de sommes publique ; git doit savoir s'authentifier. Un proxy d'entreprise déclaré dans `GOPROXY` est l'autre solution."
  - key: qcm-commandes
    format: multiple-choice
    question: "Que fait la commande `go mod verify` ?"
    choices:
      - {text: "Elle vérifie le cache local des modules contre les sommes", correct: true}
      - {text: "Elle vérifie que le code du module compile sans erreur", correct: false}
      - {text: "Elle met `go.sum` à jour avec les sommes des nouvelles versions", correct: false}
      - {text: "Elle vérifie qu'aucune dépendance n'a de vulnérabilité connue", correct: false}
    answer: "`go mod verify` vérifie que les modules du cache n'ont pas été modifiés depuis leur téléchargement. `go mod download`, lui, remplit le cache, souvent dans une couche Docker à part."
  - key: scenario-conflit
    format: scenario
    question: "Le build échoue avec « verifying module: checksum mismatch ». Que se passe-t-il, et que fais-tu ?"
    choices:
      - {text: "Le contenu reçu diffère de la somme attendue : j'enquête, et je passe à une version propre", correct: true}
      - {text: "`go.sum` est corrompu : je supprime la ligne fautive, puis je relance `go mod tidy`", correct: false}
      - {text: "Le cache de build est périmé : je lance `go clean -cache`, puis je relance le build", correct: false}
      - {text: "La base de sommes est en retard : je pose `GONOSUMDB=*` pour toute l'équipe en attendant", correct: false}
    answer: "Le contenu téléchargé ne correspond pas à la somme attendue : tag déplacé par l'auteur, dépôt altéré ou proxy qui sert autre chose. Supprimer la ligne de `go.sum` forcerait un code peut-être malveillant : on enquête et on passe à une version propre ou épinglée par commit ; pour un module interne, on publie une nouvelle version au lieu de réécrire le tag."
  - key: scenario-entreprise
    format: scenario
    question: "Comment configures-tu l'accès aux modules dans une entreprise qui a des dépôts privés et une CI isolée ?"
    choices:
      - {text: "Un proxy d'entreprise dans `GOPROXY`, qui cache les publics et sert les privés, et `GOPRIVATE` pour l'interne", correct: true}
      - {text: "`GOPROXY=direct` partout, pour que la CI et les postes clonent chaque dépendance depuis son dépôt", correct: false}
      - {text: "`GOPRIVATE=*` pour tous les modules, publics compris, pour ne jamais passer par un service public", correct: false}
      - {text: "`GONOSUMDB=*` et `GOPROXY=off` partout, les modules recopiés à la main dans le cache de chacun", correct: false}
    answer: "Un proxy d'entreprise (Artifactory, Athens) dans `GOPROXY`, qui met en cache les modules publics et sert les privés, avec `GOPRIVATE` ou `GONOSUMDB` pour les chemins internes. La CI n'accède qu'à ce proxy, avec un jeton en lecture seule ; les postes ont la même configuration, et les sommes publiques restent vérifiées pour les modules publics."
  - key: scenario-supply-chain
    format: scenario
    question: "Quelles protections Go offre-t-il contre les attaques de la chaîne d'approvisionnement ?"
    choices:
      - {text: "`go.sum` et sum.golang.org (le même code pour tous), la MVS sans montée implicite, le proxy immuable", correct: true}
      - {text: "Une signature obligatoire de chaque module par la clé de son auteur, vérifiée au téléchargement", correct: false}
      - {text: "Une analyse du code de chaque module par le proxy, qui refuse tout module jugé malveillant", correct: false}
      - {text: "Aucune : la commande `go` reclone chaque dépendance depuis son dépôt git à chaque build", correct: false}
    answer: "`go.sum` et sum.golang.org garantissent que tout le monde reçoit le même code pour une version, et qu'il ne change pas ; la MVS n'introduit jamais de version sans action explicite ; le proxy empêche qu'une version disparaisse ou soit remplacée. Reste à choisir ses dépendances, à lire leurs mises à jour et à lancer govulncheck."
  - key: scenario-docker
    format: scenario
    question: "Comment accélères-tu le téléchargement des modules dans un build Docker ?"
    choices:
      - {text: "Copier d'abord `go.mod` et `go.sum`, puis `go mod download` dans sa propre couche, avant le code", correct: true}
      - {text: "Copier tout le code d'abord, puis lancer `go mod download` juste avant le `go build`", correct: false}
      - {text: "Lancer `go mod tidy` dans le Dockerfile, pour ne télécharger que les modules utiles", correct: false}
      - {text: "Passer `GOFLAGS=-mod=mod`, pour que `go build` télécharge les modules en parallèle", correct: false}
    answer: "Tant que `go.mod` et `go.sum` ne changent pas, Docker réutilise la couche du `go mod download`. Copier tout le code d'abord invalide cette couche à chaque modification. Avec BuildKit, `--mount=type=cache` sur les caches de modules et de build évite même de retélécharger."
