notion: go-sum-proxy
lesson: |-
  **`go.sum`** contient les **sommes de contrôle** (hash) du contenu de chaque version de dépendance : à chaque
  téléchargement, Go vérifie que le code est **identique** à celui enregistré. Une dépendance modifiée après coup
  (tag déplacé, dépôt compromis) est détectée.

  ```
  github.com/jackc/pgx/v5 v5.7.6 h1:rWQc5FwZSPX58r1OQmkuaNicxdmExaEz5A2DO2hUuTk=
  github.com/jackc/pgx/v5 v5.7.6/go.mod h1:3ZW5RYDQaE7kZ6tu5xHrRlCvO66uC5n/kN1kHZ8mbkg=
  ```

  Le **proxy de modules** (`GOPROXY`, par défaut `https://proxy.golang.org,direct`) sert les modules publics depuis un
  cache : téléchargements rapides et **disponibles** même si le dépôt d'origine disparaît (une version servie une fois
  reste servie).

  La **base de sommes de contrôle** (`GOSUMDB`, par défaut `sum.golang.org`) est un journal public et infalsifiable des
  sommes de toutes les versions publiques : la **première** fois qu'on télécharge une version, sa somme est comparée à
  celle du journal, ce qui empêche qu'un proxy ou un dépôt serve un contenu différent à certains utilisateurs.

  Pour les modules **privés** :
  - **`GOPRIVATE=gitlab.entreprise.fr/*`** : ni proxy public ni base de sommes publique pour ces chemins ;
  - ou un proxy d'entreprise (Athens, Artifactory, GoProxy) dans GOPROXY.

  Commandes utiles : `go mod download` (préremplir le cache, par exemple dans une image Docker), `go mod verify`
  (vérifier le cache local contre go.sum).

  **En entretien** : « go.sum vérifie le contenu exact de chaque dépendance ; le proxy met en cache et garantit la
  disponibilité ; sum.golang.org est le journal public des sommes ; GOPRIVATE pour le code interne. »
cards:
  - key: garantit-sum
    format: course
    question: Que garantit go.sum ?
    answer: Que le contenu des modules téléchargés correspond aux empreintes enregistrées.
  - key: sert-sum-golang-org
    format: course
    question: À quoi sert sum.golang.org ?
    answer: C'est un journal public transparent des empreintes de modules, qui garantit que tous reçoivent le même code.
  - key: sert-sum
    format: course
    question: À quoi sert go.sum ?
    answer: À vérifier l'intégrité des modules téléchargés par leurs empreintes ; il se versionne.
  - key: sert-goproxy
    format: course
    question: À quoi sert GOPROXY ?
    answer: À télécharger les modules via un proxy (proxy.golang.org par défaut) qui les met en cache de façon immuable.
  - key: sert-goprivate
    format: course
    question: À quoi sert GOPRIVATE ?
    answer: À télécharger certains modules directement, sans proxy public ni checksum database.
  - key: terme-goprivate-goproxy
    format: course
    question: Que désigne « GOPRIVATE / GOPROXY » ?
    answer: Modules privés / proxy de téléchargement des modules
  - key: vf-gosum
    format: true-false
    question: go.sum permet de détecter qu'une version de dépendance a été modifiée après sa publication.
    truth: true
    answer: Le hash du contenu ne correspondrait plus.
  - key: vf-proxy-defaut
    format: true-false
    question: Par défaut, Go télécharge les modules publics via proxy.golang.org.
    truth: true
    answer: Puis directement depuis le dépôt (direct) si le proxy ne les a pas.
  - key: vf-private
    format: true-false
    question: Sans GOPRIVATE, le nom d'un module privé peut être envoyé au proxy et à la base de sommes publics.
    truth: true
    answer: D'où GOPRIVATE pour les chemins internes.
  - key: vf-lock
    format: true-false
    question: go.sum sert surtout à choisir les versions des dépendances.
    truth: false
    answer: C'est go.mod (avec la MVS) qui choisit ; go.sum vérifie le contenu.
  - key: qcm-roles
    format: multiple-choice
    question: Quel est le rôle de chaque élément ?
    choices:
      - text: 'go.sum : vérifier le contenu des dépendances'
        correct: true
      - text: 'GOPROXY : d''où télécharger les modules'
        correct: true
      - text: 'GOSUMDB : le journal public des sommes de contrôle'
        correct: true
      - text: 'GOPRIVATE : chiffrer le code source'
        correct: false
    answer: GOPRIVATE évite les services publics pour certains chemins.
  - key: qcm-proxy
    format: multiple-choice
    question: Quels avantages apporte le proxy de modules ?
    choices:
      - text: Des téléchargements rapides depuis un cache
        correct: true
      - text: Une version reste disponible même si son dépôt est supprimé
        correct: true
      - text: L'analyse des vulnérabilités du code
        correct: false
      - text: La compilation à distance
        correct: false
    answer: Pour les vulnérabilités, govulncheck.
  - key: qcm-prives
    format: multiple-choice
    question: Comment utiliser des modules privés de l'entreprise ?
    choices:
      - text: '`GOPRIVATE=gitlab.entreprise.fr/*`'
        correct: true
      - text: Un proxy d'entreprise déclaré dans GOPROXY
        correct: true
      - text: Désactiver go.sum
        correct: false
      - text: Copier le code à la main dans le projet
        correct: false
    answer: Il faut aussi que git sache s'authentifier (jeton, SSH).
  - key: qcm-commandes
    format: multiple-choice
    question: À quoi servent ces commandes ?
    choices:
      - text: '`go mod download` : remplir le cache de modules'
        correct: true
      - text: '`go mod verify` : vérifier le cache local contre les sommes'
        correct: true
      - text: '`go mod download` : mettre à jour go.mod vers les dernières versions'
        correct: false
      - text: '`go mod verify` : vérifier que le code compile'
        correct: false
    answer: download sert souvent dans une étape Docker en cache.
  - key: scenario-conflit
    format: scenario
    question: 'Le build échoue avec « verifying module: checksum mismatch ». Que se passe-t-il, et que fais-tu ?'
    answer: |-
      Le contenu téléchargé ne correspond pas à la somme attendue : le tag a été déplacé par l'auteur, le dépôt a été
      altéré, ou un proxy sert autre chose. Je ne supprime pas la ligne de go.sum pour forcer : j'enquête (comparer les
      sources, demander à l'auteur), et je passe à une version propre ou épinglée par commit. Si c'est une erreur dans un
      module interne, on publie une nouvelle version plutôt que de réécrire le tag.
  - key: scenario-entreprise
    format: scenario
    question: Comment configures-tu l'accès aux modules dans une entreprise qui a des dépôts privés et une CI isolée ?
    answer: |-
      Un proxy d'entreprise (Artifactory, Athens) dans GOPROXY, qui met en cache les modules publics et sert les privés,
      avec GOPRIVATE ou GONOSUMDB pour les chemins internes. La CI n'accède qu'à ce proxy, avec un jeton en lecture seule.
      Les développeurs ont la même configuration (`go env -w`), et les sommes publiques restent vérifiées pour les
      modules publics.
  - key: scenario-supply-chain
    format: scenario
    question: Quelles protections Go offre-t-il contre les attaques de la chaîne d'approvisionnement ?
    answer: |-
      go.sum et sum.golang.org garantissent que tout le monde reçoit le même code pour une version, et qu'il ne change
      pas ; la MVS n'introduit jamais de version sans action explicite ; le proxy empêche qu'une version disparaisse ou
      soit remplacée. Il reste à choisir ses dépendances avec soin, à lire leurs mises à jour, et à lancer govulncheck.
  - key: scenario-docker
    format: scenario
    question: Comment accélères-tu le téléchargement des modules dans un build Docker ?
    answer: |-
      Je copie d'abord go.mod et go.sum, puis je lance `go mod download` dans sa propre couche : tant que ces fichiers ne
      changent pas, Docker réutilise la couche en cache. Avec BuildKit, un montage de cache (`--mount=type=cache` sur le
      cache de modules et le cache de build) évite même de retélécharger après un changement de dépendance.
