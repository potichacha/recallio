notion: build-tags
lesson: |-
  Une **contrainte de build** décide si un fichier est compilé, selon la plateforme ou des étiquettes choisies. Elle
  s'écrit en **première ligne** du fichier (avant `package`, suivie d'une ligne vide) :

  ```go
  //go:build linux && (amd64 || arm64)

  package systeme
  ```

  ```go
  //go:build integration

  package depot_test // compilé seulement avec : go test -tags integration ./...
  ```

  - les opérateurs sont `&&`, `||`, `!` et les parenthèses ;
  - les étiquettes connues : le système (`linux`, `windows`, `darwin`), l'architecture (`amd64`, `arm64`), `cgo`, la
    version (`go1.24` est vraie pour Go 1.24 et après), et toute étiquette passée avec **`-tags`** ;
  - l'ancienne syntaxe `// +build` est obsolète (`go fix` la retire).

  **Les suffixes de nom de fichier** sont une contrainte implicite :
  - `fichier_linux.go`, `fichier_windows.go` : seulement sur ce système ;
  - `fichier_windows_amd64.go` : ce système et cette architecture ;
  - `fichier_test.go` : seulement pour les tests.

  Usages courants :
  - du code propre à un système (appels système, chemins) avec une implémentation par plateforme et la même API ;
  - séparer les **tests d'intégration** des tests unitaires ;
  - des fonctionnalités optionnelles (un pilote, un mode de débogage) ;
  - `//go:build ignore` pour un fichier qui ne doit pas être compilé (un script lancé avec `go run`).

  **Piège** : un fichier exclu sur une plateforme n'est **pas vérifié** sur celle-ci : on compile pour toutes les
  cibles en CI (`GOOS=windows go build ./...`).

  **En entretien** : « //go:build en première ligne avec && || ! ; les suffixes _linux.go et _windows_amd64.go ; -tags
  pour des étiquettes à soi, comme integration ; compiler toutes les cibles en CI. »
cards:
  - key: ecrire-contrainte-build
    format: course
    question: Comment écrire une contrainte de build ?
    answer: '`//go:build linux && amd64` en tête de fichier, ou un suffixe _linux.go.'
  - key: place
    format: course
    question: Où se place la ligne //go:build dans un fichier ?
    answer: Tout en haut, avant la clause package (seuls des commentaires et lignes vides peuvent la précéder), suivie d'une ligne vide ; ailleurs, elle est ignorée.
  - key: suffixes
    format: course
    question: Comment limiter un fichier à Windows sans écrire de contrainte ?
    answer: 'En le nommant avec le suffixe _windows.go (ou _windows_amd64.go pour une architecture) : le nom du fichier est une contrainte implicite.'
  - key: ignore
    format: course
    question: À quoi sert `//go:build ignore` ?
    answer: À exclure un fichier de toute compilation du package, par exemple un petit programme de génération lancé à part avec `go run gen.go`.
  - key: vf-tags
    format: true-false
    question: Un fichier marqué `//go:build integration` n'est compilé qu'avec `-tags integration`.
    truth: true
    answer: L'étiquette doit être demandée explicitement.
  - key: vf-plus-build
    format: true-false
    question: La syntaxe `// +build` est la forme recommandée aujourd'hui.
    truth: false
    answer: Elle est obsolète depuis Go 1.17 ; on écrit //go:build.
  - key: vf-version
    format: true-false
    question: L'étiquette go1.24 est vraie quand on compile avec Go 1.24 ou une version plus récente.
    truth: true
    answer: Pratique pour du code qui dépend d'une nouveauté.
  - key: vf-verifie
    format: true-false
    question: Un fichier exclu pour la plateforme courante est quand même vérifié par le compilateur.
    truth: false
    answer: Il n'est pas compilé, donc ses erreurs passent inaperçues.
  - key: qcm-expressions
    format: multiple-choice
    question: Quelles contraintes sont valides ?
    choices:
      - text: '`//go:build linux && amd64`'
        correct: true
      - text: '`//go:build !windows`'
        correct: true
      - text: '`//go:build (darwin || linux) && cgo`'
        correct: true
      - text: '`//go:build linux and amd64`'
        correct: false
    answer: Les opérateurs sont &&, || et !.
  - key: qcm-fichiers
    format: multiple-choice
    question: Quels noms de fichiers portent une contrainte implicite ?
    choices:
      - text: '`signal_windows.go`'
        correct: true
      - text: '`cpu_linux_arm64.go`'
        correct: true
      - text: '`service_test.go`'
        correct: true
      - text: '`linux_signal.go`'
        correct: false
    answer: Le suffixe doit être à la fin du nom.
  - key: qcm-usages
    format: multiple-choice
    question: Quels usages des contraintes de build sont courants ?
    choices:
      - text: Une implémentation par système d'exploitation derrière la même fonction
        correct: true
      - text: Séparer les tests d'intégration
        correct: true
      - text: Activer un pilote optionnel
        correct: true
      - text: Choisir une valeur de configuration à l'exécution
        correct: false
    answer: Les contraintes agissent à la compilation, pas à l'exécution.
  - key: qcm-ci
    format: multiple-choice
    question: Comment s'assurer que le code propre à Windows compile, quand la CI tourne sous Linux ?
    choices:
      - text: '`GOOS=windows go build ./...` dans la CI'
        correct: true
      - text: '`GOOS=windows go vet ./...`'
        correct: true
      - text: Rien, Go vérifie toutes les plateformes à chaque build
        correct: false
      - text: Renommer les fichiers sans suffixe
        correct: false
    answer: Chaque build ne voit que les fichiers de sa cible.
  - key: trous-directive
    format: fill-in
    question: |-
      Complétez la contrainte :
      ```go
      //go:___ linux

      package systeme
      ```
    blanks:
      - - build
    answer: //go:build.
  - key: trous-et
    format: fill-in
    question: |-
      Complétez pour Linux sur arm64 :
      ```go
      //go:build linux ___ arm64
      ```
    blanks:
      - - '&&'
    answer: '&&.'
  - key: trous-tags
    format: fill-in
    question: |-
      Complétez pour lancer les tests d'intégration :
      ```
      go test ___ integration ./...
      ```
    blanks:
      - - -tags
    answer: "-tags."
  - key: trous-suffixe
    format: fill-in
    question: 'Complétez le nom du fichier propre à macOS : terminal___.go'
    blanks:
      - - _darwin
    answer: _darwin.
