notion: build-tags
lesson: |-
  Une **contrainte de build** décide si un fichier est compilé, selon la plateforme ou des étiquettes choisies. Elle
  s'écrit en **première ligne** du fichier (avant `package`, suivie d'une ligne vide) :

  ```go
  //go:build linux && (amd64 || arm64)

  package systeme
  ```

  ```go
  //go:build integration

  package depot_test // compilé seulement avec : go test -tags integration ./...
  ```

  - les opérateurs sont `&&`, `||`, `!` et les parenthèses ;
  - les étiquettes connues : le système (`linux`, `windows`, `darwin`), l'architecture (`amd64`, `arm64`), `cgo`, la
    version (`go1.24` est vraie pour Go 1.24 et après), et toute étiquette passée avec **`-tags`** ;
  - l'ancienne syntaxe `// +build` est obsolète (`go fix` la retire).

  **Les suffixes de nom de fichier** sont une contrainte implicite :
  - `fichier_linux.go`, `fichier_windows.go` : seulement sur ce système ;
  - `fichier_windows_amd64.go` : ce système et cette architecture ;
  - `fichier_test.go` : seulement pour les tests.

  Usages courants :
  - du code propre à un système (appels système, chemins) avec une implémentation par plateforme et la même API ;
  - séparer les **tests d'intégration** des tests unitaires ;
  - des fonctionnalités optionnelles (un pilote, un mode de débogage) ;
  - `//go:build ignore` pour un fichier qui ne doit pas être compilé (un script lancé avec `go run`).

  **Piège** : un fichier exclu sur une plateforme n'est **pas vérifié** sur celle-ci : on compile pour toutes les
  cibles en CI (`GOOS=windows go build ./...`).

  **En entretien** : « //go:build en première ligne avec && || ! ; les suffixes _linux.go et _windows_amd64.go ; -tags
  pour des étiquettes à soi, comme integration ; compiler toutes les cibles en CI. »
cards:
  - key: ecrire-contrainte-build
    format: course
    question: "Comment écris-tu une contrainte de build qui limite un fichier à Linux sur amd64 ?"
    choices:
      - {text: "`//go:build linux && amd64` en tête de fichier, avant la clause `package`", correct: true}
      - {text: "`//go:build linux and amd64` en tête de fichier, avant la clause `package`", correct: false}
      - {text: "`//go:build linux && amd64` juste avant la fonction propre à cette cible", correct: false}
      - {text: "Un test `runtime.GOOS == \"linux\"` autour du code, résolu à la compilation", correct: false}
    answer: "`//go:build linux && amd64` en tête de fichier (ou un suffixe `_linux_amd64.go`) : les opérateurs sont `&&`, `||` et `!`, et la contrainte vaut pour le fichier entier. `runtime.GOOS` se teste à l'exécution, pas à la compilation."
  - key: place
    format: course
    question: "Où se place la ligne `//go:build` dans un fichier ?"
    choices:
      - {text: "Tout en haut, avant la clause `package`, suivie d'une ligne vide", correct: true}
      - {text: "Juste après la clause `package`, avant le bloc des imports", correct: false}
      - {text: "N'importe où dans le fichier, tant qu'elle reste un commentaire", correct: false}
      - {text: "Juste avant la déclaration de la fonction qu'elle doit limiter", correct: false}
    answer: "Tout en haut, avant la clause `package` (seuls des commentaires et des lignes vides peuvent la précéder), suivie d'une ligne vide. Ailleurs, elle est ignorée sans message."
  - key: suffixes
    format: course
    question: "Comment limites-tu un fichier à Windows sans écrire de ligne `//go:build` ?"
    choices:
      - {text: "En le nommant avec le suffixe `_windows.go`, comme `signal_windows.go`", correct: true}
      - {text: "En le nommant avec le préfixe `windows_`, comme `windows_signal.go`", correct: false}
      - {text: "En le rangeant dans un sous-dossier `windows/` à côté du package", correct: false}
      - {text: "En le déclarant dans un package nommé `windows`, à côté des autres", correct: false}
    answer: "Le suffixe `_windows.go` (ou `_windows_amd64.go` pour une architecture) est une contrainte implicite. Un préfixe ne compte pas, et un sous-dossier est un autre package."
  - key: ignore
    format: course
    question: "À quoi sert la ligne `//go:build ignore` ?"
    choices:
      - {text: "À exclure le fichier de toute compilation du package, comme un `gen.go` lancé à part", correct: true}
      - {text: "À faire ignorer le fichier par `go vet` et les linters, mais pas par le build", correct: false}
      - {text: "À ignorer les erreurs de compilation de ce fichier pendant le build du package", correct: false}
      - {text: "À exclure le fichier de la couverture mesurée par `go test -cover`, rien de plus", correct: false}
    answer: "`ignore` est un tag que personne ne définit : le fichier n'est jamais compilé avec le package. On s'en sert pour un petit programme de génération lancé à part avec `go run gen.go`."
  - key: vf-tags
    format: true-false
    question: Un fichier marqué `//go:build integration` n'est compilé qu'avec `-tags integration`.
    truth: true
    answer: L'étiquette doit être demandée explicitement.
  - key: vf-plus-build
    format: true-false
    question: La syntaxe `// +build` est la forme recommandée aujourd'hui.
    truth: false
    answer: Elle est obsolète depuis Go 1.17 ; on écrit //go:build.
  - key: vf-version
    format: true-false
    question: L'étiquette go1.24 est vraie quand on compile avec Go 1.24 ou une version plus récente.
    truth: true
    answer: Pratique pour du code qui dépend d'une nouveauté.
  - key: vf-verifie
    format: true-false
    question: Un fichier exclu pour la plateforme courante est quand même vérifié par le compilateur.
    truth: false
    answer: Il n'est pas compilé, donc ses erreurs passent inaperçues.
  - key: qcm-expressions
    format: multiple-choice
    question: "Laquelle de ces lignes `//go:build` est invalide ?"
    choices:
      - {text: "`//go:build linux and amd64`", correct: true}
      - {text: "`//go:build linux && amd64`", correct: false}
      - {text: "`//go:build !windows`", correct: false}
      - {text: "`//go:build (darwin || linux) && cgo`", correct: false}
    answer: "Les opérateurs sont `&&`, `||` et `!` : `and` n'existe pas. Les trois autres sont valides, parenthèses comprises."
  - key: qcm-fichiers
    format: multiple-choice
    question: "Lequel de ces noms de fichiers ne porte aucune contrainte implicite ?"
    choices:
      - {text: "`linux_signal.go`", correct: true}
      - {text: "`signal_windows.go`", correct: false}
      - {text: "`cpu_linux_arm64.go`", correct: false}
      - {text: "`service_test.go`", correct: false}
    answer: "Le suffixe doit être à la fin du nom : `linux_signal.go` est compilé partout. `_windows.go` et `_linux_arm64.go` limitent à leur cible, `_test.go` aux tests."
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces besoins une contrainte de build ne peut-elle pas servir ?"
    choices:
      - {text: "Choisir une valeur de configuration au démarrage du programme", correct: true}
      - {text: "Fournir une implémentation par système derrière la même fonction", correct: false}
      - {text: "Séparer les tests d'intégration derrière un tag `integration`", correct: false}
      - {text: "Activer un pilote optionnel seulement quand on passe son tag", correct: false}
    answer: "Les contraintes agissent à la compilation : un fichier entre ou non dans le binaire. Une configuration choisie à l'exécution passe par un flag ou une variable d'environnement."
  - key: qcm-ci
    format: multiple-choice
    question: "La CI tourne sous Linux. Comment t'assures-tu que le code propre à Windows compile ?"
    choices:
      - {text: "Un job qui lance `GOOS=windows go build ./...`", correct: true}
      - {text: "Rien : `go build` vérifie toutes les plateformes à chaque build", correct: false}
      - {text: "Un job qui lance `CGO_ENABLED=0 go build ./...` sous Linux", correct: false}
      - {text: "Renommer les fichiers `_windows.go` pour qu'ils compilent partout", correct: false}
    answer: "Chaque build ne voit que les fichiers de sa cible : sous Linux, les fichiers `_windows.go` ne sont jamais compilés. `GOOS=windows go build ./...` (ou `go vet`) les vérifie sans machine Windows."
  - key: trous-directive
    format: fill-in
    question: |-
      Complète la contrainte :
      ```go
      //go:___ linux

      package systeme
      ```
    blanks:
      - - build
    answer: //go:build.
  - key: trous-et
    format: fill-in
    question: |-
      Complète pour Linux sur arm64 :
      ```go
      //go:build linux ___ arm64
      ```
    blanks:
      - - '&&'
    answer: '&&.'
  - key: trous-tags
    format: fill-in
    question: |-
      Complète pour lancer les tests d'intégration :
      ```
      go test ___ integration ./...
      ```
    blanks:
      - - -tags
    answer: "-tags."
  - key: trous-suffixe
    format: fill-in
    question: "Complète le nom du fichier propre à macOS : terminal___.go"
    blanks:
      - - _darwin
    answer: _darwin.
