notion: outils-cli
lesson: "Go est très utilisé pour les outils en ligne de commande : un binaire unique, rapide à démarrer, facile à distribuer.\n\n**Les arguments** : `os.Args` (le nom du programme puis les arguments), ou le package **`flag`** :\n\n```go\nfunc main() {\n\tif err := run(os.Args[1:], os.Stdout, os.Stderr); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"erreur :\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run(args []string, sortie, erreurs io.Writer) error {\n\tfs := flag.NewFlagSet(\"compter\", flag.ContinueOnError)\n\tfs.SetOutput(erreurs)\n\tmots := fs.Bool(\"mots\", false, \"compter les mots plutôt que les lignes\")\n\tif err := fs.Parse(args); err != nil {\n\t\treturn err\n\t}\n\tfor _, fichier := range fs.Args() { // les arguments restants\n\t\t// ...\n\t}\n\treturn nil\n}\n```\n\nLes conventions :\n- les **résultats** sur la sortie standard, les **messages d'erreur** et de diagnostic sur la **sortie d'erreur** : le\n  résultat reste exploitable dans un tuyau (`outil | jq`) ;\n- le **code de sortie** : 0 en cas de succès, non nul en cas d'échec (2 souvent pour une mauvaise utilisation) ;\n- **`os.Exit` n'exécute pas les `defer`** (ni `log.Fatal`, qui l'appelle) : on l'appelle seulement dans `main`, après\n  `run` ;\n- **Ctrl+C** : `signal.NotifyContext(ctx, os.Interrupt)` et un contexte passé partout, pour s'arrêter proprement ;\n- une fonction `run(args, stdout, stderr)` rend l'outil **testable** sans lancer de processus.\n\nPour des outils à **sous-commandes** (`outil serveur demarrer --port 8080`), **cobra** (utilisé par kubectl, Hugo,\ngh) gère sous-commandes, aide et complétion ; **urfave/cli** et **kong** sont des alternatives. Pour des interfaces en\nterminal, **Bubble Tea**.\n\n**En entretien** : « flag ou cobra pour les sous-commandes ; résultats sur stdout, erreurs sur stderr ; code de\nsortie non nul en échec ; os.Exit seulement dans main car il saute les defer ; une fonction run testable ;\nNotifyContext pour Ctrl+C. »"
cards:
  - key: os-exit-execute-defer
    format: course
    question: "`os.Exit` exécute-t-il les fonctions différées par `defer` ?"
    choices:
      - {text: "Non : le programme s'arrête aussitôt, sans exécuter les `defer`", correct: true}
      - {text: "Oui : tous les `defer` de la goroutine courante passent avant", correct: false}
      - {text: "Oui, mais seulement ceux de la fonction qui appelle `os.Exit`", correct: false}
      - {text: "Avec un code nul seulement : `os.Exit(0)` les exécute, pas `os.Exit(1)`", correct: false}
    answer: "Non : `os.Exit` termine le programme immédiatement, sans exécuter les `defer`, quel que soit le code. C'est ce qui le distingue d'un `return` depuis `main`."
  - key: log-fatal
    format: course
    question: "Que fait `log.Fatal` ?"
    choices:
      - {text: "Il journalise le message puis appelle `os.Exit(1)`, sans exécuter les `defer`", correct: true}
      - {text: "Il journalise le message puis déclenche une panic, que l'appelant peut récupérer", correct: false}
      - {text: "Il journalise le message au niveau le plus grave, sans arrêter le programme", correct: false}
      - {text: "Il journalise le message, exécute les `defer`, puis quitte avec le code 1", correct: false}
    answer: "Il journalise puis appelle `os.Exit(1)`, sans exécuter les `defer`. La panic récupérable, c'est `log.Panic`."
  - key: populaire-cli
    format: course
    question: "Pourquoi Go est-il populaire pour écrire des CLI ?"
    choices:
      - {text: "Un binaire unique sans dépendance, un démarrage instantané, une compilation croisée simple", correct: true}
      - {text: "Un interpréteur installé partout, qui lance les scripts sans étape de compilation", correct: false}
      - {text: "Une machine virtuelle qui optimise le code à chaud, après quelques exécutions", correct: false}
      - {text: "Une bibliothèque standard d'interfaces graphiques, la même sur tous les systèmes", correct: false}
    answer: "Un binaire unique sans dépendance, un démarrage instantané et une compilation croisée simple : l'outil s'installe en copiant un fichier."
  - key: flag-vs-cobra
    format: course
    question: "Quelle différence entre le package `flag` et cobra ?"
    choices:
      - {text: "`flag` gère des options simples ; cobra, des sous-commandes avec aide et complétion", correct: true}
      - {text: "cobra gère des options simples ; `flag`, des sous-commandes avec aide et complétion", correct: false}
      - {text: "`flag` lit les variables d'environnement ; cobra, les options de la ligne de commande", correct: false}
      - {text: "Aucune : cobra n'est qu'un autre nom du package `flag` de la bibliothèque standard", correct: false}
    answer: "`flag`, dans la bibliothèque standard, gère des options simples ; cobra est un framework de commandes et de sous-commandes, avec aide et complétion."
  - key: ecrire-erreurs-cli
    format: course
    question: "Où une CLI écrit-elle ses erreurs ?"
    choices:
      - {text: "Sur stderr, avec un code de sortie non nul", correct: true}
      - {text: "Sur stdout, avec un code de sortie non nul", correct: false}
      - {text: "Sur stderr, avec un code de sortie à 0", correct: false}
      - {text: "Dans un fichier de log, sans rien afficher", correct: false}
    answer: "Sur stderr, avec un code de sortie non nul. Sur stdout, elles se mêleraient aux résultats passés dans un tuyau ; avec le code 0, un script ne verrait pas l'échec."
  - key: os-exit-execute-defer-2
    format: course
    question: "Puisque `os.Exit` saute les `defer`, comment structures-tu le `main` d'un outil ?"
    choices:
      - {text: "Une fonction `run()` qui renvoie une erreur ; `main` appelle `os.Exit` à la fin, seul", correct: true}
      - {text: "Un `os.Exit(1)` dans chaque fonction qui rencontre une erreur, au plus près du problème", correct: false}
      - {text: "Un `log.Fatal(err)` en fin de `main`, qui exécute les `defer` avant de quitter", correct: false}
      - {text: "Un nettoyage écrit à la main avant chaque `os.Exit`, à la place des `defer`", correct: false}
    answer: "Toute la logique passe dans `run()`, qui renvoie une erreur : ses `defer` s'exécutent à son retour. `main` seul convertit l'erreur en code de sortie avec `os.Exit`. `log.Fatal` appelle `os.Exit` et saute donc aussi les `defer`."
  - key: gerer-ctrl-proprement
    format: course
    question: "Comment une CLI gère-t-elle Ctrl+C proprement ?"
    choices:
      - {text: "Avec `signal.NotifyContext`, et le contexte propagé à tout le travail en cours", correct: true}
      - {text: "Avec `recover` dans `main`, qui intercepte le signal comme une panic", correct: false}
      - {text: "Avec `os.Exit(130)` dans un `defer`, appelé à la réception du signal", correct: false}
      - {text: "Rien à faire : Go annule de lui-même les contextes en cours au Ctrl+C", correct: false}
    answer: "`signal.NotifyContext` donne un contexte annulé au Ctrl+C ; propagé au travail en cours, il l'arrête proprement (transactions annulées, fichiers fermés). Un signal n'est pas une panic."
  - key: bubble-tea
    format: course
    question: "Qu'est-ce que Bubble Tea ?"
    choices:
      - {text: "Une bibliothèque d'interfaces terminal interactives, selon l'architecture Elm", correct: true}
      - {text: "Un framework de sous-commandes, avec aide et complétion automatiques", correct: false}
      - {text: "Un outil qui construit des images de conteneurs sans Dockerfile", correct: false}
      - {text: "Une bibliothèque de configuration, qui lit fichiers et variables d'environnement", correct: false}
    answer: "Une bibliothèque pour créer des interfaces terminal interactives selon l'architecture Elm (modèle, mise à jour, vue). Les sous-commandes, c'est cobra."
  - key: tester-cli
    format: course
    question: "Comment testes-tu une CLI ?"
    choices:
      - {text: "En appelant `run()` avec des flux injectés, des fichiers golden ou testscript", correct: true}
      - {text: "En lançant le binaire à la main et en comparant la sortie à l'œil", correct: false}
      - {text: "En remplaçant `os.Stdout` par un fichier dans chaque fonction testée", correct: false}
      - {text: "On ne peut pas : `os.Exit` interrompt les tests à la première erreur", correct: false}
    answer: "On appelle `run()` avec des flux injectés et on compare à des fichiers golden, ou on utilise testscript. `os.Exit` ne gêne pas : seul `main` l'appelle."
  - key: ecris-squelette-cli-testable
    format: scenario
    question: "Quel squelette donnes-tu à une CLI pour qu'elle soit testable ?"
    choices:
      - {text: "Un `main` qui branche signaux et flux réels, et un `run(ctx, args, in, out, errOut) error` qui fait tout", correct: true}
      - {text: "Un `main` qui fait tout, lit `os.Args` et écrit sur `os.Stdout`, testé en lançant le binaire compilé", correct: false}
      - {text: "Un `run()` qui lit `os.Args` et appelle `os.Exit` à chaque erreur, et un `main` qui l'appelle", correct: false}
      - {text: "Un `init()` qui lit les options dans des variables globales, et un `main` qui s'en sert ensuite", correct: false}
    answer: |-
      ```go
      func main() {
          ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt)
          defer stop()
          if err := run(ctx, os.Args[1:], os.Stdin, os.Stdout, os.Stderr); err != nil {
              fmt.Fprintln(os.Stderr, "erreur:", err)
              stop()
              os.Exit(1)
          }
      }

      func run(ctx context.Context, args []string, in io.Reader, out, errOut io.Writer) error {
          fs := flag.NewFlagSet("outil", flag.ContinueOnError)
          fs.SetOutput(errOut)
          format := fs.String("format", "text", "format de sortie (text|json)")
          if err := fs.Parse(args); err != nil {
              return err
          }
          // ... logique, en écrivant dans out
          _ = format
          return nil
      }
      ```
      "Toute la logique est dans `run`, qui reçoit ses entrées et sorties : en test, je passe un `strings.Reader` et des `bytes.Buffer` et je vérifie la sortie et l'erreur. `main` ne fait que brancher le vrai monde et convertir l'erreur en code de sortie, après avoir exécuté les defer."
  - key: vf-defer
    format: true-false
    question: os.Exit exécute les defer en attente avant de quitter.
    truth: false
    answer: Il quitte immédiatement ; d'où os.Exit seulement dans main, après run.
  - key: vf-stderr
    format: true-false
    question: Les messages d'erreur d'un outil en ligne de commande vont sur la sortie d'erreur.
    truth: true
    answer: La sortie standard reste réservée aux résultats.
  - key: vf-code
    format: true-false
    question: Un outil qui échoue devrait quitter avec le code 0 et afficher l'erreur.
    truth: false
    answer: Un code non nul permet aux scripts de détecter l'échec.
  - key: vf-log-fatal
    format: true-false
    question: '`log.Fatal` appelle os.Exit(1) après avoir écrit le message.'
    truth: true
    answer: Les defer ne sont donc pas exécutés.
  - key: qcm-conventions
    format: multiple-choice
    question: "Laquelle de ces habitudes est une erreur dans un outil en ligne de commande ?"
    choices:
      - {text: "Afficher les erreurs sur stdout, pour qu'on les voie bien", correct: true}
      - {text: "Écrire les résultats sur stdout et les erreurs sur stderr", correct: false}
      - {text: "Renvoyer un code de sortie non nul en cas d'échec", correct: false}
      - {text: "Gérer Ctrl+C pour s'arrêter proprement", correct: false}
    answer: "Mélanger les erreurs aux résultats casse les tuyaux (`outil | jq`) : résultats sur stdout, erreurs sur stderr, code de sortie non nul en cas d'échec, et Ctrl+C géré pour s'arrêter proprement."
  - key: qcm-outils
    format: multiple-choice
    question: "Quel outil choisis-tu pour une CLI à sous-commandes, avec aide et complétion ?"
    choices:
      - {text: "cobra", correct: true}
      - {text: "Le package `flag` seul", correct: false}
      - {text: "Bubble Tea", correct: false}
      - {text: "`os.Getenv`", correct: false}
    answer: "cobra gère les sous-commandes, l'aide et la complétion. Le package `flag` suffit pour quelques options simples, Bubble Tea sert aux interfaces interactives, et les variables d'environnement complètent les options sans les remplacer."
  - key: qcm-testable
    format: multiple-choice
    question: "Qu'est-ce qui rend un outil en ligne de commande testable ?"
    choices:
      - {text: "Une fonction `run` qui reçoit ses arguments et des `io.Writer`", correct: true}
      - {text: "Un `os.Exit` dans chaque fonction qui rencontre une erreur", correct: false}
      - {text: "Des lectures de `os.Args` là où chaque option sert", correct: false}
      - {text: "Des écritures directes sur `os.Stdout` dans chaque fonction", correct: false}
    answer: "Le test appelle `run` avec des arguments et des `bytes.Buffer`, puis vérifie la sortie et l'erreur. `os.Exit` arrêterait le test, et `os.Args` ou `os.Stdout` le lieraient au vrai processus."
  - key: qcm-flag
    format: multiple-choice
    question: "Lequel de ces besoins le package `flag` ne couvre-t-il pas à lui seul ?"
    choices:
      - {text: "Des sous-commandes imbriquées avec complétion", correct: true}
      - {text: "Des options typées : `String`, `Int`, `Bool`, `Duration`", correct: false}
      - {text: "Les arguments restants, avec `fs.Args()`", correct: false}
      - {text: "Un message d'aide automatique avec `-h`", correct: false}
    answer: "`flag` fournit des options typées, les arguments restants et l'aide `-h`. Pour des sous-commandes, on prend cobra, ou un `FlagSet` par sous-commande."
  - key: trous-stderr
    format: fill-in
    question: |-
      Complète pour écrire l'erreur :
      ```go
      fmt.Fprintln(os.___, "erreur :", err)
      ```
    blanks:
      - - Stderr
    answer: os.Stderr.
  - key: trous-exit
    format: fill-in
    question: |-
      Complète main :
      ```go
      func main() {
      	if err := run(os.Args[1:]); err != nil {
      		fmt.Fprintln(os.Stderr, err)
      		os.___(1)
      	}
      }
      ```
    blanks:
      - - Exit
    answer: os.Exit(1).
  - key: trous-flag
    format: fill-in
    question: |-
      Complète l'option :
      ```go
      port := flag.___("port", 8080, "port d'écoute")
      flag.Parse()
      ```
    blanks:
      - - Int
    answer: flag.Int.
  - key: trous-signal
    format: fill-in
    question: |-
      Complète pour gérer Ctrl+C :
      ```go
      ctx, stop := signal.NotifyContext(context.Background(), os.___)
      defer stop()
      ```
    blanks:
      - - Interrupt
    answer: os.Interrupt.
  - key: bug-exit-defer
    format: bug-fix
    question: |-
      Le fichier temporaire n'est jamais supprimé quand l'outil échoue. Quelle correction est la bonne ?
      ```go
      func main() {
      	tmp, _ := os.CreateTemp("", "export")
      	defer os.Remove(tmp.Name())
      	if err := exporter(tmp); err != nil {
      		log.Fatal(err)
      	}
      }
      ```
    choices:
      - {text: "Mettre le travail dans une fonction `run` qui renvoie l'erreur ; seul `main` quitte", correct: true}
      - {text: "Remplacer `defer os.Remove` par `defer tmp.Close()`, qui supprime le fichier", correct: false}
      - {text: "Appeler `runtime.GC()` avant `log.Fatal`, pour laisser passer les `defer`", correct: false}
      - {text: "Créer le fichier dans un `init()`, dont les `defer` survivent à `log.Fatal`", correct: false}
    answer: "```go\nfunc main() {\n\tif err := run(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"erreur :\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\ttmp, err := os.CreateTemp(\"\", \"export\")\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer os.Remove(tmp.Name())\n\treturn exporter(tmp)\n}\n```\nlog.Fatal appelle os.Exit, qui saute les defer ; le travail passe dans run, et main seul quitte."
  - key: bug-stdout
    format: bug-fix
    question: |-
      `outil liste | jq .` échoue avec « parse error » quand un fichier est illisible. Quelle correction est la bonne ?
      ```go
      if err != nil {
      	fmt.Println("attention :", err)
      	continue
      }
      ```
    choices:
      - {text: "Écrire l'avertissement sur stderr : `fmt.Fprintln(os.Stderr, \"attention :\", err)`", correct: true}
      - {text: "Encoder l'avertissement en JSON, pour que `jq` le lise avec le reste de la sortie", correct: false}
      - {text: "Remplacer `continue` par `return`, pour arrêter au premier fichier illisible", correct: false}
      - {text: "Remplacer `fmt.Println` par `fmt.Print`, sans le retour à la ligne qui gêne `jq`", correct: false}
    answer: "```go\nif err != nil {\n\tfmt.Fprintln(os.Stderr, \"attention :\", err)\n\tcontinue\n}\n```\nLes avertissements se mélangeaient au JSON sur la sortie standard ; ils vont sur la sortie d'erreur."
  - key: bug-code-zero
    format: bug-fix
    question: |-
      Le script de déploiement continue alors que l'outil de migration a échoué. Quelle correction est la bonne ?
      ```go
      func main() {
      	if err := migrer(); err != nil {
      		fmt.Fprintln(os.Stderr, err)
      	}
      }
      ```
    choices:
      - {text: "Ajouter `os.Exit(1)` après l'affichage de l'erreur", correct: true}
      - {text: "Écrire l'erreur sur stdout plutôt que sur stderr", correct: false}
      - {text: "Ajouter un `return` après l'affichage de l'erreur", correct: false}
      - {text: "Remplacer `fmt.Fprintln` par `fmt.Errorf`, qui signale l'échec", correct: false}
    answer: "```go\nfunc main() {\n\tif err := migrer(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n}\n```\nSans code de sortie non nul, le script ne voyait pas l'échec."
  - key: bug-ctrl-c
    format: bug-fix
    question: |-
      Un Ctrl+C pendant l'import laisse la base dans un état intermédiaire, sans annuler la transaction. Quelle correction est la bonne ?
      ```go
      func main() {
      	if err := importer(context.Background(), fichier); err != nil {
      		fmt.Fprintln(os.Stderr, err)
      		os.Exit(1)
      	}
      }
      ```
    choices:
      - {text: "Passer à `importer` le contexte de `signal.NotifyContext`, annulé par SIGINT et SIGTERM", correct: true}
      - {text: "Ajouter un `defer tx.Rollback()` dans `main`, exécuté quand le processus est tué", correct: false}
      - {text: "Remplacer `context.Background()` par `context.TODO()`, que Ctrl+C annule", correct: false}
      - {text: "Ajouter un `recover()` dans `main`, qui intercepte le Ctrl+C comme une panic", correct: false}
    answer: "```go\nfunc main() {\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tif err := importer(ctx, fichier); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n}\n```\nCtrl+C annule désormais le contexte : la transaction est annulée et l'outil s'arrête proprement, au lieu d'être tué."
  - key: scenario-conception
    format: scenario
    question: "Comment structures-tu une CLI Go avec plusieurs sous-commandes ?"
    choices:
      - {text: "cobra pour les sous-commandes, chacune appelant une fonction métier qui prend un contexte et des `io.Writer`", correct: true}
      - {text: "Un `switch os.Args[1]` dans `main`, avec la logique métier écrite directement dans chaque branche", correct: false}
      - {text: "cobra jusque dans la logique métier, qui reçoit les `*cobra.Command` pour y lire ses options", correct: false}
      - {text: "Un binaire par sous-commande, chacun avec son propre `main` et sa propre lecture des options", correct: false}
    answer: "cobra pour les sous-commandes, l'aide et la complétion, une commande par fichier. Chaque commande lit ses options puis appelle une fonction métier qui prend un contexte et des `io.Writer` : rien de cobra dans la logique. `main` exécute la commande racine et transforme l'erreur en code de sortie ; la configuration combine options, variables d'environnement et fichier, dans cet ordre."
  - key: scenario-test
    format: scenario
    question: "Comment testes-tu une CLI de bout en bout ?"
    choices:
      - {text: "Surtout des appels à `run` avec des `bytes.Buffer`, et quelques cas sur le binaire ou avec testscript", correct: true}
      - {text: "Uniquement le binaire compilé, lancé par un script shell dont on compare la sortie à l'œil", correct: false}
      - {text: "Uniquement des tests des fonctions internes, sans jamais tester les options ni la sortie", correct: false}
      - {text: "Des tests qui remplacent `os.Stdout` et `os.Args` globaux, lancés avec `t.Parallel()`", correct: false}
    answer: "La plupart des tests appellent `run(args, stdout, stderr)` avec des `bytes.Buffer`, en tests de table. Pour quelques cas de bout en bout, on compile le binaire dans le test (ou on utilise testscript) et on vérifie code de sortie, sorties et fichiers produits. Remplacer des globales en parallèle ferait se mélanger les tests."
  - key: scenario-distribution
    format: scenario
    question: "Comment distribues-tu ta CLI aux utilisateurs ?"
    choices:
      - {text: "GoReleaser à chaque tag : binaires par plateforme, archives, sommes, Homebrew et Scoop", correct: true}
      - {text: "Le code source seul, en demandant à chacun d'installer Go puis de compiler l'outil", correct: false}
      - {text: "Un binaire Linux amd64 compilé sur un poste de développeur, joint à une page du wiki", correct: false}
      - {text: "Une image Docker seulement, que chaque utilisateur lance avec `docker run` à chaque appel", correct: false}
    answer: "GoReleaser à chaque tag : binaires pour Linux, macOS et Windows (amd64 et arm64), archives, sommes de contrôle et signatures, une formule Homebrew et un paquet Scoop, éventuellement une image. `go install module@latest` reste possible pour les développeurs Go ; la version est injectée et affichée par `outil version`."
