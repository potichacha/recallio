notion: outils-cli
lesson: "Go est très utilisé pour les outils en ligne de commande : un binaire unique, rapide à démarrer, facile à distribuer.\n\n**Les arguments** : `os.Args` (le nom du programme puis les arguments), ou le package **`flag`** :\n\n```go\nfunc main() {\n\tif err := run(os.Args[1:], os.Stdout, os.Stderr); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"erreur :\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run(args []string, sortie, erreurs io.Writer) error {\n\tfs := flag.NewFlagSet(\"compter\", flag.ContinueOnError)\n\tfs.SetOutput(erreurs)\n\tmots := fs.Bool(\"mots\", false, \"compter les mots plutôt que les lignes\")\n\tif err := fs.Parse(args); err != nil {\n\t\treturn err\n\t}\n\tfor _, fichier := range fs.Args() { // les arguments restants\n\t\t// ...\n\t}\n\treturn nil\n}\n```\n\nLes conventions :\n- les **résultats** sur la sortie standard, les **messages d'erreur** et de diagnostic sur la **sortie d'erreur** : le\n  résultat reste exploitable dans un tuyau (`outil | jq`) ;\n- le **code de sortie** : 0 en cas de succès, non nul en cas d'échec (2 souvent pour une mauvaise utilisation) ;\n- **`os.Exit` n'exécute pas les `defer`** (ni `log.Fatal`, qui l'appelle) : on l'appelle seulement dans `main`, après\n  `run` ;\n- **Ctrl+C** : `signal.NotifyContext(ctx, os.Interrupt)` et un contexte passé partout, pour s'arrêter proprement ;\n- une fonction `run(args, stdout, stderr)` rend l'outil **testable** sans lancer de processus.\n\nPour des outils à **sous-commandes** (`outil serveur demarrer --port 8080`), **cobra** (utilisé par kubectl, Hugo,\ngh) gère sous-commandes, aide et complétion ; **urfave/cli** et **kong** sont des alternatives. Pour des interfaces en\nterminal, **Bubble Tea**.\n\n**En entretien** : « flag ou cobra pour les sous-commandes ; résultats sur stdout, erreurs sur stderr ; code de\nsortie non nul en échec ; os.Exit seulement dans main car il saute les defer ; une fonction run testable ;\nNotifyContext pour Ctrl+C. »"
cards:
  - key: os-exit-execute-defer
    format: course
    question: os.Exit exécute-t-il les defer ?
    answer: Non.
  - key: log-fatal
    format: course
    question: Que fait log.Fatal ?
    answer: Il logge puis appelle os.Exit(1), sans exécuter les defer.
  - key: populaire-cli
    format: course
    question: Pourquoi Go est-il populaire pour les CLI ?
    answer: Binaire unique sans dépendance, démarrage instantané, compilation croisée simple.
  - key: flag-vs-cobra
    format: course
    question: flag vs cobra ?
    answer: Drapeaux simples de la bibliothèque standard vs framework de commandes et sous-commandes avec aide et complétion.
  - key: ecrire-erreurs-cli
    format: course
    question: Où écrire les erreurs d'une CLI ?
    answer: Sur stderr, avec un code de sortie non nul.
  - key: os-exit-execute-defer-2
    format: course
    question: os.Exit exécute-t-il les defer ?
    answer: Non ; d'où le pattern run() qui retourne une erreur et un main qui appelle os.Exit à la fin.
  - key: gerer-ctrl-proprement
    format: course
    question: Comment gérer Ctrl+C proprement ?
    answer: signal.NotifyContext et propagation du contexte.
  - key: bubble-tea
    format: course
    question: C'est quoi Bubble Tea ?
    answer: Une bibliothèque pour créer des interfaces terminal interactives selon l'architecture Elm.
  - key: tester-cli
    format: course
    question: Comment tester une CLI ?
    answer: Appeler run() avec des flux injectés, comparer à des golden files, ou utiliser testscript.
  - key: ecris-squelette-cli-testable
    format: scenario
    question: Écris le squelette d'une CLI testable.
    answer: |-
      ```go
      func main() {
          ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt)
          defer stop()
          if err := run(ctx, os.Args[1:], os.Stdin, os.Stdout, os.Stderr); err != nil {
              fmt.Fprintln(os.Stderr, "erreur:", err)
              stop()
              os.Exit(1)
          }
      }

      func run(ctx context.Context, args []string, in io.Reader, out, errOut io.Writer) error {
          fs := flag.NewFlagSet("outil", flag.ContinueOnError)
          fs.SetOutput(errOut)
          format := fs.String("format", "text", "format de sortie (text|json)")
          if err := fs.Parse(args); err != nil {
              return err
          }
          // ... logique, en écrivant dans out
          _ = format
          return nil
      }
      ```
      "Toute la logique est dans `run`, qui reçoit ses entrées et sorties : en test, je passe un `strings.Reader` et des `bytes.Buffer` et je vérifie la sortie et l'erreur. `main` ne fait que brancher le vrai monde et convertir l'erreur en code de sortie, après avoir exécuté les defer."
  - key: vf-defer
    format: true-false
    question: os.Exit exécute les defer en attente avant de quitter.
    truth: false
    answer: Il quitte immédiatement ; d'où os.Exit seulement dans main, après run.
  - key: vf-stderr
    format: true-false
    question: Les messages d'erreur d'un outil en ligne de commande vont sur la sortie d'erreur.
    truth: true
    answer: La sortie standard reste réservée aux résultats.
  - key: vf-code
    format: true-false
    question: Un outil qui échoue devrait quitter avec le code 0 et afficher l'erreur.
    truth: false
    answer: Un code non nul permet aux scripts de détecter l'échec.
  - key: vf-log-fatal
    format: true-false
    question: '`log.Fatal` appelle os.Exit(1) après avoir écrit le message.'
    truth: true
    answer: Les defer ne sont donc pas exécutés.
  - key: qcm-conventions
    format: multiple-choice
    question: Quelles conventions suivre dans un outil en ligne de commande ?
    choices:
      - text: Les résultats sur stdout, les erreurs sur stderr
        correct: true
      - text: Un code de sortie non nul en cas d'échec
        correct: true
      - text: Gérer Ctrl+C pour s'arrêter proprement
        correct: true
      - text: Afficher les erreurs sur stdout pour qu'on les voie
        correct: false
    answer: Mélanger les erreurs aux résultats casse les tuyaux.
  - key: qcm-outils
    format: multiple-choice
    question: Quel outil pour quel besoin ?
    choices:
      - text: 'Quelques options simples : le package flag'
        correct: true
      - text: 'Des sous-commandes avec aide et complétion : cobra'
        correct: true
      - text: 'Une interface interactive dans le terminal : Bubble Tea'
        correct: true
      - text: 'Des sous-commandes : os.Getenv'
        correct: false
    answer: Les variables d'environnement complètent les options, sans les remplacer.
  - key: qcm-testable
    format: multiple-choice
    question: Comment rendre un outil testable ?
    choices:
      - text: Une fonction run(args, stdout, stderr) appelée par main
        correct: true
      - text: Des io.Writer injectés au lieu d'écrire directement sur os.Stdout
        correct: true
      - text: Appeler os.Exit dans chaque fonction en erreur
        correct: false
      - text: Lire os.Args partout dans le code
        correct: false
    answer: Le test appelle run avec des arguments et des bytes.Buffer.
  - key: qcm-flag
    format: multiple-choice
    question: Que fournit le package flag ?
    choices:
      - text: Des options typées (String, Int, Bool, Duration)
        correct: true
      - text: Les arguments restants avec fs.Args()
        correct: true
      - text: Un message d'aide automatique avec -h
        correct: true
      - text: Des sous-commandes imbriquées avec complétion
        correct: false
    answer: Pour cela, cobra ou un FlagSet par sous-commande.
  - key: trous-stderr
    format: fill-in
    question: |-
      Complétez pour écrire l'erreur :
      ```go
      fmt.Fprintln(os.___, "erreur :", err)
      ```
    blanks:
      - - Stderr
    answer: os.Stderr.
  - key: trous-exit
    format: fill-in
    question: "Complétez main :\n```go\nfunc main() {\n\tif err := run(os.Args[1:]); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.___(1)\n\t}\n}\n```"
    blanks:
      - - Exit
    answer: os.Exit(1).
  - key: trous-flag
    format: fill-in
    question: |-
      Complétez l'option :
      ```go
      port := flag.___("port", 8080, "port d'écoute")
      flag.Parse()
      ```
    blanks:
      - - Int
    answer: flag.Int.
  - key: trous-signal
    format: fill-in
    question: |-
      Complétez pour gérer Ctrl+C :
      ```go
      ctx, stop := signal.NotifyContext(context.Background(), os.___)
      defer stop()
      ```
    blanks:
      - - Interrupt
    answer: os.Interrupt.
  - key: bug-exit-defer
    format: bug-fix
    question: "Le fichier temporaire n'est jamais supprimé quand l'outil échoue :\n```go\nfunc main() {\n\ttmp, _ := os.CreateTemp(\"\", \"export\")\n\tdefer os.Remove(tmp.Name())\n\tif err := exporter(tmp); err != nil {\n\t\tlog.Fatal(err)\n\t}\n}\n```"
    answer: "```go\nfunc main() {\n\tif err := run(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"erreur :\", err)\n\t\tos.Exit(1)\n\t}\n}\n\nfunc run() error {\n\ttmp, err := os.CreateTemp(\"\", \"export\")\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer os.Remove(tmp.Name())\n\treturn exporter(tmp)\n}\n```\nlog.Fatal appelle os.Exit, qui saute les defer ; le travail passe dans run, et main seul quitte."
  - key: bug-stdout
    format: bug-fix
    question: "`outil liste | jq .` échoue avec « parse error » quand un fichier est illisible :\n```go\nif err != nil {\n\tfmt.Println(\"attention :\", err)\n\tcontinue\n}\n```"
    answer: "```go\nif err != nil {\n\tfmt.Fprintln(os.Stderr, \"attention :\", err)\n\tcontinue\n}\n```\nLes avertissements se mélangeaient au JSON sur la sortie standard ; ils vont sur la sortie d'erreur."
  - key: bug-code-zero
    format: bug-fix
    question: "Le script de déploiement continue alors que l'outil de migration a échoué :\n```go\nfunc main() {\n\tif err := migrer(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t}\n}\n```"
    answer: "```go\nfunc main() {\n\tif err := migrer(); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n}\n```\nSans code de sortie non nul, le script ne voyait pas l'échec."
  - key: bug-ctrl-c
    format: bug-fix
    question: "Un Ctrl+C pendant l'import laisse la base dans un état intermédiaire, sans annuler la transaction :\n```go\nfunc main() {\n\tif err := importer(context.Background(), fichier); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n}\n```"
    answer: "```go\nfunc main() {\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tif err := importer(ctx, fichier); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n}\n```\nCtrl+C annule désormais le contexte : la transaction est annulée et l'outil s'arrête proprement, au lieu d'être tué."
  - key: scenario-conception
    format: scenario
    question: Comment structures-tu une CLI Go avec plusieurs sous-commandes ?
    answer: |-
      cobra pour les sous-commandes, l'aide et la complétion, avec une commande par fichier dans `cmd/` ou `internal/cli`.
      Chaque commande lit ses options, puis appelle une fonction métier qui prend un contexte et des io.Writer : rien de
      cobra dans la logique. main se réduit à exécuter la commande racine et à transformer l'erreur en code de sortie.
      La configuration combine options, variables d'environnement et fichier, dans cet ordre de priorité.
  - key: scenario-test
    format: scenario
    question: Comment testes-tu une CLI de bout en bout ?
    answer: |-
      La plupart des tests appellent directement `run(args, stdout, stderr)` avec des bytes.Buffer et vérifient la sortie
      et l'erreur, en tests de table. Pour quelques cas de bout en bout, je compile le binaire dans le test (ou utilise
      testscript, de rogpeppe/go-internal) et je vérifie le code de sortie, les sorties et les fichiers produits.
  - key: scenario-distribution
    format: scenario
    question: Comment distribues-tu ta CLI aux utilisateurs ?
    answer: |-
      GoReleaser à chaque tag : binaires pour Linux, macOS et Windows (amd64 et arm64), archives, sommes de contrôle et
      signatures, une formule Homebrew et un paquet Scoop, éventuellement une image Docker. `go install module@latest`
      reste possible pour les développeurs Go. La version est injectée au build et affichée par `outil version`.
