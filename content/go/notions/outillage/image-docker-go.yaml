notion: image-docker-go
cards:
  - key: image-scratch-certificats
    format: course
    question: Pourquoi une image scratch n'a-t-elle pas de certificats CA ?
    answer: Elle est vide ; il faut copier le fichier de certificats ou utiliser distroless.
  - key: images-peuvent-elles-etre-si-petites
    format: course
    question: Pourquoi les images Go peuvent-elles être si petites ?
    answer: Le binaire statique contient tout, runtime compris ; il tourne dans scratch ou distroless.
  - key: role-joue-cgo-enabled-0-conteneurs
    format: course
    question: Quel rôle joue CGO_ENABLED=0 pour les conteneurs ?
    answer: Il produit un binaire statique sans dépendance à la libc, exécutable dans scratch.
  - key: manque-image-scratch
    format: course
    question: Que manque-t-il dans une image scratch ?
    answer: Certificats CA, données de fuseaux horaires, utilisateurs, shell.
  - key: embarquer-fuseaux-horaires-binaire
    format: course
    question: Comment embarquer les fuseaux horaires dans le binaire ?
    answer: '`import _ "time/tzdata"`.'
  - key: scratch-vs-distroless-static
    format: course
    question: scratch vs distroless/static ?
    answer: Image vide vs image minimale avec certificats, tzdata et utilisateur nonroot.
  - key: ko
    format: course
    question: C'est quoi ko ?
    answer: Un outil qui construit et publie des images de services Go sans Dockerfile.
  - key: copier-mod-sum-avant-sources-dockerfile
    format: course
    question: Pourquoi copier go.mod et go.sum avant les sources dans le Dockerfile ?
    answer: Pour mettre en cache la couche de téléchargement des dépendances.
  - key: deboguer-conteneur-sans-shell
    format: course
    question: Comment déboguer un conteneur sans shell ?
    answer: kubectl debug avec un conteneur éphémère.
  - key: conteneurise-service-production
    format: scenario
    question: Conteneurise un service Go pour la production.
    answer: |-
      Un Dockerfile multi-stage : une étape de build avec l'image `golang` officielle, `go mod download` en couche séparée avec cache BuildKit, compilation `CGO_ENABLED=0` avec `-trimpath` et `-ldflags "-s -w"` et la version injectée par `-X`. Une étape finale `distroless/static:nonroot` qui contient seulement le binaire, déjà dotée des certificats et de tzdata, exécutée en non-root, système de fichiers en lecture seule côté Kubernetes.
      Image multi-architecture via buildx ou ko, scannée et signée en CI. Côté runtime : Go 1.25+ pour GOMAXPROCS, GOMEMLIMIT réglé sur la limite mémoire, arrêt propre sur SIGTERM avec passage de la readiness à faux avant le `Shutdown`.
  - key: terme-distroless
    format: course
    question: Que désigne « distroless » ?
    answer: Image de conteneur minimale sans shell
  - key: terme-ko
    format: course
    question: Que désigne « ko » ?
    answer: Outil de construction d'images de services Go sans Dockerfile
