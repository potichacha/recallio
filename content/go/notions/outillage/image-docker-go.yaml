notion: image-docker-go
lesson: |-
  Un binaire Go statique tient dans une image **minuscule**. Le Dockerfile type, en **plusieurs étapes** :

  ```dockerfile
  FROM golang:1.27 AS build
  WORKDIR /src
  COPY go.mod go.sum ./
  RUN go mod download                      # couche mise en cache tant que les dépendances ne changent pas
  COPY . .
  RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /app ./cmd/app

  FROM gcr.io/distroless/static-debian12:nonroot
  COPY --from=build /app /app
  USER nonroot:nonroot
  ENTRYPOINT ["/app"]
  ```

  Les choix :
  - l'étape de **build** contient toute la chaîne d'outils ; l'image **finale** ne contient que le binaire : quelques Mo,
    une surface d'attaque minimale ;
  - **`scratch`** : rien du tout, ni certificats, ni fuseaux horaires, ni utilisateur. Il faut copier les certificats
    CA (`/etc/ssl/certs/ca-certificates.crt`) pour appeler des API en HTTPS, et embarquer les fuseaux avec
    `import _ "time/tzdata"` ;
  - **`distroless/static`** : presque aussi petit, avec les certificats, les fuseaux, un utilisateur `nonroot` et
    `/etc/passwd` : le choix par défaut le plus simple ;
  - **`alpine`** si l'on a besoin d'un shell ; attention, sa libc (musl) gêne les binaires cgo ;
  - copier **go.mod et go.sum d'abord** pour profiter du cache des couches, ou utiliser les montages de cache BuildKit
    (`--mount=type=cache,target=/root/.cache/go-build`) ;
  - exécuter en **non-root**, et le binaire comme `ENTRYPOINT` sous forme de liste (exec), pour qu'il reçoive bien
    **SIGTERM**.

  Sans shell dans l'image, on débogue avec `kubectl debug` (conteneur éphémère) ou une variante `:debug` de distroless.
  **ko** construit même l'image directement depuis le code Go, sans Dockerfile.

  **En entretien** : « Build multi-étapes, CGO_ENABLED=0, image finale distroless/static ou scratch ; certificats et
  fuseaux pour scratch ; go.mod copié d'abord pour le cache ; non-root ; ENTRYPOINT en forme exec. »
cards:
  - key: image-scratch-certificats
    format: course
    question: "Pourquoi une image `scratch` n'a-t-elle pas de certificats CA ?"
    choices:
      - {text: "Elle est vide : il faut copier le fichier de certificats, ou prendre distroless", correct: true}
      - {text: "Go les embarque dans chaque binaire : l'image n'en a donc pas besoin", correct: false}
      - {text: "Docker les retire de toute image finale, pour des raisons de sécurité", correct: false}
      - {text: "Ils restent dans l'image `golang` de build, montée au démarrage du conteneur", correct: false}
    answer: "`scratch` est vide : il faut copier le fichier de certificats depuis l'étape de build, ou utiliser distroless/static qui les fournit. Go lit les certificats du système, il ne les embarque pas."
  - key: images-peuvent-elles-etre-si-petites
    format: course
    question: "Pourquoi les images Go peuvent-elles être si petites ?"
    choices:
      - {text: "Le binaire statique contient tout, runtime compris ; il tourne dans `scratch` ou distroless", correct: true}
      - {text: "Le runtime Go est installé une fois sur le nœud, et partagé par toutes les images", correct: false}
      - {text: "Docker compresse les binaires Go bien mieux que ceux des autres langages", correct: false}
      - {text: "Le compilateur retire du binaire tout le code du ramasse-miettes, inutile en conteneur", correct: false}
    answer: "Le binaire statique contient tout, runtime compris : ni machine virtuelle ni interpréteur à installer. Il tourne dans `scratch` ou distroless, qui pèsent quelques mégaoctets."
  - key: role-joue-cgo-enabled-0-conteneurs
    format: course
    question: "Quel rôle joue `CGO_ENABLED=0` pour les conteneurs ?"
    choices:
      - {text: "Il produit un binaire statique, sans dépendance à la libc, exécutable dans `scratch`", correct: true}
      - {text: "Il réduit l'image en retirant du binaire les symboles et les informations de débogage", correct: false}
      - {text: "Il fait tourner le binaire en utilisateur non root dans le conteneur", correct: false}
      - {text: "Il désactive les appels réseau sortants du binaire dans le conteneur", correct: false}
    answer: "Il produit un binaire statique, sans dépendance à la libc, exécutable dans `scratch`. Retirer symboles et informations de débogage, c'est `-ldflags \"-s -w\"`."
  - key: manque-image-scratch
    format: course
    question: "Que manque-t-il dans une image `scratch` ?"
    choices:
      - {text: "Les certificats CA, les fuseaux horaires, les utilisateurs et le shell", correct: true}
      - {text: "Le runtime Go, à copier à côté du binaire depuis l'étape de build", correct: false}
      - {text: "Seulement le shell : le reste est fourni par le noyau de l'hôte", correct: false}
      - {text: "Rien : elle contient le minimum d'une distribution Linux", correct: false}
    answer: "Certificats CA, données des fuseaux horaires, utilisateurs, shell : `scratch` est vide. Le runtime, lui, est dans le binaire."
  - key: embarquer-fuseaux-horaires-binaire
    format: course
    question: "Comment embarques-tu la base des fuseaux horaires dans le binaire ?"
    choices:
      - {text: "`import _ \"time/tzdata\"` dans le programme", correct: true}
      - {text: "`time.LoadLocation(\"Local\")` au démarrage", correct: false}
      - {text: "`go build -tags zoneinfo` pour compiler", correct: false}
      - {text: "`//go:embed /usr/share/zoneinfo` dans `main`", correct: false}
    answer: "`import _ \"time/tzdata\"` (ou `-tags timetzdata`) embarque la base dans le binaire, pour environ 450 Ko. `go:embed` n'accepte pas de chemin absolu."
  - key: scratch-vs-distroless-static
    format: course
    question: "Quelle différence entre `scratch` et `distroless/static` ?"
    choices:
      - {text: "`scratch` est vide ; distroless/static ajoute certificats, tzdata et un utilisateur nonroot", correct: true}
      - {text: "distroless/static est vide ; `scratch` ajoute certificats, tzdata et un utilisateur nonroot", correct: false}
      - {text: "`scratch` contient un shell minimal pour déboguer ; distroless/static n'en a aucun", correct: false}
      - {text: "Aucune : distroless/static n'est qu'un autre nom, plus récent, de l'image `scratch`", correct: false}
    answer: "`scratch` est une image vide ; distroless/static est une image minimale avec certificats, tzdata et un utilisateur nonroot, toujours sans shell."
  - key: ko
    format: course
    question: "Qu'est-ce que ko ?"
    choices:
      - {text: "Un outil qui construit et publie des images de services Go sans Dockerfile", correct: true}
      - {text: "Une image de base minimale sans shell, maintenue par Google", correct: false}
      - {text: "Un outil qui déploie des manifestes Kubernetes à partir de modèles", correct: false}
      - {text: "Un linter qui vérifie les Dockerfile des services écrits en Go", correct: false}
    answer: "Un outil qui construit et publie des images de services Go sans Dockerfile. L'image minimale sans shell, c'est distroless."
  - key: copier-mod-sum-avant-sources-dockerfile
    format: course
    question: "Pourquoi copier `go.mod` et `go.sum` avant les sources dans le Dockerfile ?"
    choices:
      - {text: "Pour garder en cache la couche du téléchargement des dépendances", correct: true}
      - {text: "Parce que `go build` doit lire `go.mod` avant tout autre fichier", correct: false}
      - {text: "Pour que `go mod tidy` corrige `go.mod` avant la compilation", correct: false}
      - {text: "Parce que Docker refuse de copier `go.sum` en même temps que le code", correct: false}
    answer: "La couche du `go mod download` ne dépend alors que de ces deux fichiers : modifier un `.go` ne la reconstruit pas, et les dépendances ne sont pas retéléchargées."
  - key: deboguer-conteneur-sans-shell
    format: course
    question: "Comment débogues-tu un conteneur qui n'a pas de shell ?"
    choices:
      - {text: "Avec `kubectl debug`, qui attache un conteneur éphémère outillé", correct: true}
      - {text: "Avec `kubectl exec`, qui apporte son propre shell dans le conteneur", correct: false}
      - {text: "En installant un shell avec `apt` dans le conteneur en cours", correct: false}
      - {text: "Impossible : il faut reconstruire l'image avec alpine pour déboguer", correct: false}
    answer: "`kubectl debug` avec un conteneur éphémère, qui partage l'espace de processus du pod. `kubectl exec` ne fait que lancer une commande déjà présente dans l'image."
  - key: conteneurise-service-production
    format: scenario
    question: "Tu conteneurises un service Go pour la production. Quelle image construis-tu ?"
    choices:
      - {text: "Multi-stage : build sur `golang` avec `CGO_ENABLED=0` et `-trimpath`, puis distroless/static:nonroot", correct: true}
      - {text: "Une seule étape `golang:1.27` qui compile puis lance le binaire, pour garder les outils sous la main", correct: false}
      - {text: "Multi-stage : build sur `golang` avec cgo actif, puis `scratch` avec le binaire et rien d'autre", correct: false}
      - {text: "Une image alpine où `go run ./cmd/app` compile et lance le service à chaque démarrage", correct: false}
    answer: "Un Dockerfile multi-stage : build sur `golang`, `go mod download` en couche séparée avec cache BuildKit, `CGO_ENABLED=0`, `-trimpath`, `-ldflags \"-s -w\"` et la version injectée. L'étape finale `distroless/static:nonroot` ne contient que le binaire, avec certificats et tzdata, en non-root ; image multi-architecture, scannée et signée en CI. Avec cgo actif, le binaire chercherait une libc absente de `scratch`."
  - key: terme-distroless
    format: course
    question: "Dans le monde des conteneurs, que désigne « distroless » ?"
    choices:
      - {text: "Une image de conteneur minimale, sans shell ni gestionnaire de paquets", correct: true}
      - {text: "Une image vide, sans aucun fichier, où l'on copie seulement le binaire", correct: false}
      - {text: "Une distribution Linux légère, avec un shell et le gestionnaire `apk`", correct: false}
      - {text: "Un outil qui construit des images de services Go sans Dockerfile", correct: false}
    answer: "Une image de conteneur minimale sans shell. L'image vide, c'est `scratch` ; la distribution légère avec `apk`, alpine ; l'outil sans Dockerfile, ko."
  - key: terme-ko
    format: course
    question: "Dans l'outillage Go, que désigne « ko » ?"
    choices:
      - {text: "Un outil qui construit les images de services Go sans Dockerfile", correct: true}
      - {text: "Une image de conteneur minimale, sans shell, maintenue par Google", correct: false}
      - {text: "Un outil qui compile et publie un binaire pour chaque plateforme", correct: false}
      - {text: "Un outil qui attache un conteneur éphémère à un pod pour déboguer", correct: false}
    answer: "Un outil de construction d'images de services Go sans Dockerfile. Les binaires par plateforme, c'est GoReleaser ; le conteneur éphémère, `kubectl debug`."
  - key: vf-taille
    format: true-false
    question: L'image finale d'un service Go peut ne contenir que le binaire.
    truth: true
    answer: Avec scratch ou distroless/static, quelques Mo.
  - key: vf-scratch-certs
    format: true-false
    question: Une image scratch contient les certificats racines nécessaires aux appels HTTPS.
    truth: false
    answer: Il faut les copier, ou utiliser distroless/static.
  - key: vf-cache
    format: true-false
    question: Copier go.mod et go.sum avant les sources permet de garder en cache le téléchargement des dépendances.
    truth: true
    answer: La couche n'est reconstruite que si ces fichiers changent.
  - key: vf-shell-form
    format: true-false
    question: '`ENTRYPOINT /app` (forme shell) transmet SIGTERM au binaire aussi bien que `ENTRYPOINT ["/app"]`.'
    truth: false
    answer: La forme shell lance un shell qui ne transmet pas toujours le signal ; on utilise la forme exec.
  - key: qcm-bases
    format: multiple-choice
    question: "Quelle image de base choisis-tu par défaut pour l'image finale d'un service Go ?"
    choices:
      - {text: "`distroless/static:nonroot`", correct: true}
      - {text: "`golang:1.27`", correct: false}
      - {text: "`ubuntu:24.04`", correct: false}
      - {text: "`alpine:3.22`", correct: false}
    answer: "distroless/static apporte certificats, tzdata et un utilisateur nonroot, sans shell ni gestionnaire de paquets. `scratch` est plus petit mais demande d'ajouter certificats et fuseaux ; alpine et ubuntu ajoutent un shell, donc une surface d'attaque ; `golang` contient toute la chaîne d'outils, inutile en production."
  - key: qcm-scratch
    format: multiple-choice
    question: "De quoi un binaire Go statique n'a-t-il pas besoin dans une image `scratch` ?"
    choices:
      - {text: "Du runtime Go, déjà compilé dans le binaire", correct: true}
      - {text: "Des certificats CA, pour vérifier les serveurs HTTPS", correct: false}
      - {text: "De la base des fuseaux, pour `time.LoadLocation`", correct: false}
      - {text: "D'un dossier `/tmp`, pour `os.CreateTemp`", correct: false}
    answer: "Le runtime (ramasse-miettes, ordonnanceur) est compilé dans le binaire. En revanche, `scratch` n'a ni certificats CA, ni base des fuseaux, ni `/tmp`, ni utilisateurs : on les copie, ou on prend distroless/static."
  - key: qcm-securite
    format: multiple-choice
    question: "Laquelle de ces pratiques affaiblit la sécurité de l'image ?"
    choices:
      - {text: "Copier les sources dans l'image finale pour déboguer", correct: true}
      - {text: "Exécuter le service en utilisateur non root", correct: false}
      - {text: "Une image finale sans shell ni gestionnaire de paquets", correct: false}
      - {text: "Scanner l'image en CI avant de la publier", correct: false}
    answer: "Moins il y a de choses dans l'image, moins il y a à exploiter : les sources n'ont rien à y faire. Non-root, image minimale et scan en CI la renforcent."
  - key: qcm-debug
    format: multiple-choice
    question: "Lesquelles de ces façons permettent de déboguer un conteneur distroless sans shell ?"
    choices:
      - text: '`kubectl debug` avec un conteneur éphémère'
        correct: true
      - text: La variante :debug de l'image distroless, qui contient busybox
        correct: true
      - text: Installer un shell avec apt dans le conteneur en cours
        correct: false
      - text: Ce n'est pas possible
        correct: false
    answer: L'image finale n'a pas de gestionnaire de paquets.
  - key: bug-tls
    format: bug-fix
    question: |-
      Le service plante à chaque appel HTTPS avec « x509: certificate signed by unknown authority ». Quelle correction est la bonne ?
      ```dockerfile
      FROM scratch
      COPY --from=build /app /app
      ENTRYPOINT ["/app"]
      ```
    choices:
      - {text: "Partir de `distroless/static`, qui contient les certificats racines", correct: true}
      - {text: "Compiler avec `CGO_ENABLED=0`, pour que Go embarque les certificats", correct: false}
      - {text: "Passer `InsecureSkipVerify: true` dans la configuration TLS du client", correct: false}
      - {text: "Ajouter `import _ \"time/tzdata\"`, qui fournit aussi les certificats", correct: false}
    answer: |-
      ```dockerfile
      FROM gcr.io/distroless/static-debian12:nonroot
      COPY --from=build /app /app
      ENTRYPOINT ["/app"]
      ```
      scratch ne contient pas les certificats racines ; distroless/static les fournit (ou l'on copie
      /etc/ssl/certs/ca-certificates.crt depuis l'étape de build).
  - key: bug-cgo
    format: bug-fix
    question: |-
      Le conteneur démarre avec « exec /app: no such file or directory », alors que le fichier existe. Quelle correction est la bonne ?
      ```dockerfile
      FROM golang:1.27 AS build
      RUN go build -o /app ./cmd/app

      FROM scratch
      COPY --from=build /app /app
      ```
    choices:
      - {text: "Compiler avec `CGO_ENABLED=0`, pour un binaire statique sans libc", correct: true}
      - {text: "Compiler avec `-ldflags \"-s -w\"`, pour un binaire plus léger", correct: false}
      - {text: "Ajouter `RUN chmod +x /app` dans l'étape finale `scratch`", correct: false}
      - {text: "Copier le binaire dans `/usr/local/bin/app` plutôt qu'à la racine", correct: false}
    answer: |-
      ```dockerfile
      FROM golang:1.27 AS build
      RUN CGO_ENABLED=0 go build -o /app ./cmd/app

      FROM scratch
      COPY --from=build /app /app
      ```
      Avec cgo actif par défaut, le binaire était lié dynamiquement à la libc absente de scratch ; CGO_ENABLED=0 donne un
      binaire statique.
  - key: bug-cache
    format: bug-fix
    question: |-
      Chaque modification d'un fichier .go retélécharge toutes les dépendances. Quelle correction est la bonne ?
      ```dockerfile
      COPY . .
      RUN go mod download
      RUN go build -o /app ./cmd/app
      ```
    choices:
      - {text: "Copier `go.mod` et `go.sum`, lancer `go mod download`, puis copier le reste", correct: true}
      - {text: "Lancer `go mod download` après `go build`, pour ne prendre que les manquants", correct: false}
      - {text: "Remplacer `go mod download` par `go mod tidy`, qui garde les modules en cache", correct: false}
      - {text: "Ajouter `--no-cache` au `docker build`, pour repartir d'une base propre", correct: false}
    answer: |-
      ```dockerfile
      COPY go.mod go.sum ./
      RUN go mod download
      COPY . .
      RUN go build -o /app ./cmd/app
      ```
      Les dépendances sont téléchargées dans une couche qui ne dépend que de go.mod et go.sum.
  - key: bug-fuseaux
    format: bug-fix
    question: Dans le conteneur scratch, `time.LoadLocation("Europe/Paris")` échoue avec « unknown time zone ». Que proposes-tu ?
    choices:
      - {text: "`import _ \"time/tzdata\"`, qui embarque la base des fuseaux dans le binaire", correct: true}
      - {text: "`CGO_ENABLED=0`, pour que Go lise les fuseaux sans passer par la libc", correct: false}
      - {text: "`time.FixedZone(\"Europe/Paris\", 3600)`, équivalent au fuseau de Paris", correct: false}
      - {text: "`TZ=Europe/Paris` dans l'environnement du conteneur, sans rien d'autre", correct: false}
    answer: |-
      ```go
      import _ "time/tzdata" // embarque la base des fuseaux dans le binaire (environ 450 Ko)
      ```
      scratch ne contient pas /usr/share/zoneinfo ; on embarque la base dans le binaire (ou `-tags timetzdata`), ou l'on
      utilise distroless/static qui la fournit.
  - key: scenario-dockerfile
    format: scenario
    question: "Quelles sont les grandes lignes du Dockerfile de production d'un service Go ?"
    choices:
      - {text: "Build sur `golang` figé : modules, puis sources, `CGO_ENABLED=0` ; final distroless nonroot", correct: true}
      - {text: "Build sur `golang:latest` : sources d'abord, puis modules et `go build` ; final `golang`, en root", correct: false}
      - {text: "Une seule étape `alpine` : Go installé par `apk`, sources copiées, `go run` en `ENTRYPOINT`", correct: false}
      - {text: "Build sur `golang` figé, cgo actif ; final `scratch` avec le binaire seul, sans certificats", correct: false}
    answer: "Une étape de build sur `golang` à version figée : `go.mod` et `go.sum`, `go mod download`, puis les sources, `CGO_ENABLED=0 go build -trimpath -ldflags=\"-s -w -X ...version=...\"`, avec des caches BuildKit. Une étape finale distroless/static:nonroot qui copie le binaire, `USER nonroot`, `ENTRYPOINT [\"/app\"]`. Puis un scan en CI et des images multi-architectures avec buildx."
  - key: scenario-ko
    format: scenario
    question: "Qu'apporte ko par rapport à un Dockerfile ?"
    choices:
      - {text: "Il compile le binaire et l'empile sur une image minimale, sans Dockerfile ni démon, en multi-arch", correct: true}
      - {text: "Il exécute le Dockerfile plus vite, en répartissant ses étapes sur plusieurs machines de build", correct: false}
      - {text: "Il ajoute à l'image des paquets système et des scripts, sans écrire la moindre ligne de Dockerfile", correct: false}
      - {text: "Il remplace Kubernetes pour déployer des services Go, en lançant les binaires sur les nœuds", correct: false}
    answer: "ko compile le binaire Go et l'empile directement sur une image de base minimale, sans Dockerfile ni démon Docker, en multi-architecture et avec une SBOM : rapide et reproductible pour des services en Go pur. On garde un Dockerfile quand l'image doit contenir autre chose que le binaire."
  - key: scenario-alpine
    format: scenario
    question: "Un collègue veut alpine pour l'image finale « pour pouvoir déboguer ». Que lui réponds-tu ?"
    choices:
      - {text: "Non : shell et paquets élargissent la surface d'attaque ; `kubectl debug` ou `:debug` suffisent", correct: true}
      - {text: "Oui : un shell en production est indispensable pour diagnostiquer un incident en direct", correct: false}
      - {text: "Oui, en ajoutant `apk add curl bash`, pour avoir de vrais outils de diagnostic sur place", correct: false}
      - {text: "Non : prends plutôt `golang:1.27`, qui a un shell et toute la chaîne d'outils pour déboguer", correct: false}
    answer: "alpine apporte un shell et un gestionnaire de paquets, donc une surface d'attaque et des vulnérabilités à suivre, et sa libc musl pose problème avec cgo. Pour déboguer, `kubectl debug` avec un conteneur éphémère ou la variante `:debug` de distroless suffisent, sans alourdir l'image de production."
