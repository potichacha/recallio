notion: go-mod
lesson: "Un **module** est un ensemble de packages versionnés ensemble, décrit par le fichier **`go.mod`** à sa racine :\n\n```\nmodule github.com/exemple/boutique   // le chemin du module : préfixe des imports de ses packages\n\ngo 1.27                               // la version du langage du module\n\nrequire (\n\tgithub.com/jackc/pgx/v5 v5.7.6\n\tgolang.org/x/sync v0.17.0\n\tgolang.org/x/text v0.29.0 // indirect : dépendance d'une dépendance\n)\n```\n\nLes commandes du quotidien :\n- **`go mod init github.com/exemple/boutique`** crée le go.mod ;\n- **`go get github.com/jackc/pgx/v5@v5.7.6`** ajoute ou change une dépendance (`@latest`, `@v1.2.3`, `@none` pour\n  la retirer) ;\n- **`go mod tidy`** aligne le go.mod sur les imports réels : il ajoute ce qui manque, retire ce qui ne sert plus, et\n  met à jour go.sum ;\n- **`go install outil@version`** installe un binaire, sans toucher au go.mod du projet ;\n- `go list -m all` liste toutes les dépendances, `go mod why -m x` explique pourquoi l'une est là.\n\nLe go.mod peut aussi contenir `toolchain` (la chaîne d'outils à utiliser), `replace`, `exclude`, `retract` (versions\nretirées par l'auteur), `tool` (Go 1.24) et `godebug`.\n\nOn **versionne** go.mod et go.sum. La directive `go` est une version **minimale** : elle active les changements de\nlangage de cette version (la variable de boucle par tour en 1.22) et peut déclencher le téléchargement d'une chaîne\nd'outils plus récente.\n\n**En entretien** : « go.mod : module, go, require ; go mod init, go get pour une dépendance, go mod tidy pour\nnettoyer, go install pour un binaire ; go.mod et go.sum versionnés. »"
tour:
  - title: Les modules
    text: |-
      Un projet Go est un **module** : un dossier racine avec un fichier `go.mod`, créé par `go mod init
      github.com/moi/projet`. Il donne le **chemin du module**, préfixe des chemins d'import de ses packages, la version
      de Go visée, et les dépendances :

      ```
      module github.com/moi/projet

      go 1.27

      require github.com/google/uuid v1.6.0
      ```

      `go get` ajoute une dépendance, et `go mod tidy` ajoute celles qui manquent et retire les inutiles ; `go.sum`
      garde leurs empreintes, pour des builds reproductibles. Ces deux fichiers se commitent.

      Le bac à sable du Tour crée lui-même un module sans dépendance, appelé `programme` : `debug.ReadBuildInfo` montre
      ce que le binaire sait de son module.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"runtime/debug"
          )

          func main() {
          	info, ok := debug.ReadBuildInfo()
          	if !ok {
          		fmt.Println("pas d'informations de build")
          		return
          	}
          	fmt.Println("module :", info.Main.Path)
          	fmt.Println("dépendances :", len(info.Deps))
          }
      output: |-
        module : programme
        dépendances : 0
cards:
  - key: contient-mod
    format: course
    question: "Que contient le fichier `go.mod` ?"
    choices:
      - {text: "Le chemin du module, la version de Go, les dépendances requises et des directives comme `replace`", correct: true}
      - {text: "Les sommes de contrôle de chaque dépendance, vérifiées à chaque téléchargement d'un module", correct: false}
      - {text: "La liste des fichiers du module et leur ordre de compilation, package par package", correct: false}
      - {text: "Le code source des dépendances, recopié pour pouvoir compiler le module sans réseau", correct: false}
    answer: "Le chemin du module, la version de Go, les dépendances requises et d'éventuelles directives `replace`, `exclude`, `retract`, `tool`, `toolchain`. Les sommes sont dans `go.sum`, le code recopié dans `vendor/`."
  - key: mod-tidy
    format: course
    question: "Que fait `go mod tidy` ?"
    choices:
      - {text: "Il ajoute les dépendances manquantes, retire les inutiles et met à jour `go.sum`", correct: true}
      - {text: "Il met toutes les dépendances à leur dernière version mineure ou corrective", correct: false}
      - {text: "Il reformate `go.mod` et trie ses lignes, sans rien ajouter ni retirer", correct: false}
      - {text: "Il vide le cache des modules que plus aucun projet du poste n'utilise", correct: false}
    answer: "Il aligne `go.mod` sur les imports : ajoute les dépendances manquantes, supprime les inutiles et met à jour `go.sum`. Il ne monte aucune version : c'est `go get -u`."
  - key: get-vs-install
    format: course
    question: "Quelle différence entre `go get` et `go install` ?"
    choices:
      - {text: "`go get` modifie les dépendances du module ; `go install` compile et installe un exécutable", correct: true}
      - {text: "`go install` modifie les dépendances du module ; `go get` compile et installe un exécutable", correct: false}
      - {text: "`go get` télécharge un module sans l'ajouter au `go.mod`, quand `go install` l'y ajoute", correct: false}
      - {text: "Aucune depuis Go 1.17 : `go install` n'est plus qu'un alias historique de `go get`", correct: false}
    answer: "`go get` modifie les dépendances du module (`go.mod`) ; `go install` compile et installe un exécutable, sans toucher au `go.mod`."
  - key: definition-module
    format: definition
    question: "Que désigne un module, en Go ?"
    choices:
      - {text: "L'unité de versionnement, décrite par un fichier `go.mod`", correct: true}
      - {text: "Un dossier de fichiers `.go` compilés ensemble, sous un même `package`", correct: false}
      - {text: "Un fichier `.go` seul, l'unité de compilation du langage", correct: false}
      - {text: "Un ensemble de modules développés ensemble, décrit par `go.work`", correct: false}
    answer: "Un module est l'unité de versionnement : des packages publiés ensemble, décrits par `go.mod`. Un package est un dossier compilé ensemble ; un espace de travail (`go.work`) réunit plusieurs modules."
  - key: install-vs-get
    format: course
    question: "Pourquoi utiliser `go install` plutôt que `go get` pour installer un outil en ligne de commande ?"
    choices:
      - {text: "Depuis Go 1.17, `go install outil@version` installe le binaire sans toucher au `go.mod`", correct: true}
      - {text: "Parce que `go get` installe l'outil pour tout le poste, et `go install` pour le projet", correct: false}
      - {text: "Parce que `go install` vérifie la somme de l'outil, ce que `go get` ne fait jamais", correct: false}
      - {text: "Parce que `go get` installe l'outil dans `vendor/` plutôt que dans `$GOPATH/bin`", correct: false}
    answer: "Depuis Go 1.17, `go get` ne sert qu'à gérer les dépendances du module ; `go install outil@version` compile et installe le binaire sans modifier le `go.mod` du projet."
  - key: vf-tidy
    format: true-false
    question: '`go mod tidy` retire du go.mod les dépendances qui ne sont plus importées.'
    truth: true
    answer: Et ajoute celles qui manquent.
  - key: vf-indirect
    format: true-false
    question: Le commentaire `// indirect` signale une dépendance qui n'est importée directement par aucun package du module.
    truth: true
    answer: C'est une dépendance d'une dépendance.
  - key: vf-go-directive
    format: true-false
    question: La directive `go 1.27` du go.mod n'a aucun effet sur la sémantique du langage.
    truth: false
    answer: Elle active les changements de langage de cette version.
  - key: vf-versionner
    format: true-false
    question: go.sum ne doit pas être versionné.
    truth: false
    answer: go.mod et go.sum se versionnent tous les deux.
  - key: qcm-commandes
    format: multiple-choice
    question: "Quelle commande passe une dépendance du module en v1.4.0 ?"
    choices:
      - {text: "`go get exemple.com/lib@v1.4.0`", correct: true}
      - {text: "`go install exemple.com/lib@v1.4.0`", correct: false}
      - {text: "`go mod download exemple.com/lib@v1.4.0`", correct: false}
      - {text: "`go mod tidy exemple.com/lib@v1.4.0`", correct: false}
    answer: "`go get` change les versions des dépendances du module. `go install` installe un exécutable sans toucher au `go.mod`, `go mod download` remplit seulement le cache, et `go mod tidy` ne prend pas de version."
  - key: qcm-contenu
    format: multiple-choice
    question: "Laquelle de ces directives n'existe pas dans un `go.mod` ?"
    choices:
      - {text: "`dependencies`", correct: true}
      - {text: "`require`", correct: false}
      - {text: "`retract`", correct: false}
      - {text: "`godebug`", correct: false}
    answer: "Un `go.mod` connaît notamment `module`, `go`, `require`, `replace`, `exclude`, `retract`, `toolchain`, `tool` et `godebug` : les dépendances se déclarent avec `require`, `dependencies` n'existe pas."
  - key: qcm-retirer
    format: multiple-choice
    question: "Lesquelles de ces façons retirent une dépendance qui n'est plus utilisée ?"
    choices:
      - text: Supprimer les imports puis lancer `go mod tidy`
        correct: true
      - text: '`go get exemple.com/lib@none`'
        correct: true
      - text: Supprimer seulement la ligne de go.sum
        correct: false
      - text: Supprimer le dossier vendor
        correct: false
    answer: go.sum suit go.mod.
  - key: qcm-why
    format: multiple-choice
    question: "Quelle commande montre pourquoi une dépendance est présente dans le module ?"
    choices:
      - {text: "`go mod why -m exemple.com/lib`", correct: true}
      - {text: "`go list -m -u exemple.com/lib`", correct: false}
      - {text: "`go vet exemple.com/lib`", correct: false}
      - {text: "`go doc exemple.com/lib`", correct: false}
    answer: "`go mod why -m` montre une chaîne d'imports qui y mène ; `go mod graph` donne le graphe complet. `go list -m -u` dit seulement si une mise à jour existe."
  - key: trous-init
    format: fill-in
    question: |-
      Complète pour créer le module :
      ```
      go mod ___ github.com/exemple/boutique
      ```
    blanks:
      - - init
    answer: go mod init.
  - key: trous-tidy
    format: fill-in
    question: |-
      Complète pour aligner go.mod sur les imports :
      ```
      go mod ___
      ```
    blanks:
      - - tidy
    answer: go mod tidy.
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour passer à la dernière version :
      ```
      go get github.com/jackc/pgx/v5@___
      ```
    blanks:
      - - latest
    answer: '@latest.'
  - key: trous-require
    format: fill-in
    question: |-
      Complète la directive :
      ```
      ___ golang.org/x/sync v0.17.0
      ```
    blanks:
      - - require
    answer: require.
  - key: scenario-nouveau
    format: scenario
    question: "Tu démarres un nouveau service Go. Comment initialises-tu le module et ses dépendances ?"
    choices:
      - {text: "`go mod init` avec le chemin du dépôt, puis `go mod tidy` d'après les imports ; `go.mod` et `go.sum` commités", correct: true}
      - {text: "`go mod init app`, puis un `go get` de chaque dépendance à `@latest`, et `go.sum` ignoré par git", correct: false}
      - {text: "Un `GOPATH` par service, les dépendances copiées à la main dans `src/`, sans aucun `go.mod`", correct: false}
      - {text: "`go mod init` avec le chemin du dépôt, puis un `go.mod` écrit à la main, sans `go.sum` versionné", correct: false}
    answer: "`go mod init` avec le chemin du dépôt (`github.com/entreprise/service`), la directive `go` à la version de la CI, puis `go mod tidy` ajoute les dépendances importées. `go.mod` et `go.sum` sont versionnés, la CI vérifie que tidy ne change rien, et Dependabot ou Renovate proposent les mises à jour."
  - key: scenario-mise-a-jour
    format: scenario
    question: "Comment mets-tu à jour les dépendances d'un service ?"
    choices:
      - {text: "`go list -m -u all`, `go get -u ./...` puis `go mod tidy`, tests et govulncheck, une PR par lot", correct: true}
      - {text: "`go get -u ./...` puis un commit direct sur `main`, sans relancer les tests, chaque semaine", correct: false}
      - {text: "Supprimer `go.sum` et relancer `go mod tidy`, qui reprend alors les dernières versions", correct: false}
      - {text: "Ajouter `/v2` au chemin de chaque dépendance, pour passer à sa toute dernière version", correct: false}
    answer: "`go list -m -u all` montre les mises à jour ; `go get -u ./...` monte les mineures et les correctifs, puis `go mod tidy`. On lit les notes de version importantes, on lance tests, `-race` et govulncheck, une PR par lot cohérent ; les majeures (nouveau chemin `/v2`) se traitent une par une."
  - key: scenario-tidy-ci
    format: scenario
    question: "Un collègue demande pourquoi la CI échoue quand `go mod tidy` modifie `go.mod`. Que lui réponds-tu ?"
    choices:
      - {text: "Que `go.mod` doit refléter le code : ni dépendance oubliée, qui ne marche que grâce à son cache, ni morte", correct: true}
      - {text: "Que `go mod tidy` met les dépendances à jour, et que la CI exige toujours leurs dernières versions", correct: false}
      - {text: "Que la CI ne sait pas télécharger de modules, et doit tout trouver déjà déclaré dans son `go.sum`", correct: false}
      - {text: "Que c'est une règle de style, comme gofmt, sans effet sur le build chez les autres développeurs", correct: false}
    answer: "`go.mod` et `go.sum` doivent refléter exactement le code : pas de dépendance oubliée (le build marcherait chez lui grâce au cache, pas ailleurs), ni de dépendance morte qui alourdit l'audit. La CI lance `go mod tidy` puis `git diff --exit-code go.mod go.sum`."
  - key: scenario-chemin
    format: scenario
    question: "Quel chemin de module choisis-tu pour un projet interne de l'entreprise ?"
    choices:
      - {text: "Le chemin du dépôt qui l'héberge, comme `gitlab.entreprise.fr/equipe/service`, avec `GOPRIVATE`", correct: true}
      - {text: "Un nom court comme `service`, puisque le module ne sera jamais publié hors de l'entreprise", correct: false}
      - {text: "Un chemin sous `golang.org/x/`, l'espace réservé aux modules internes des entreprises", correct: false}
      - {text: "Le nom du package principal, `main`, comme pour tout binaire développé en interne", correct: false}
    answer: "Le chemin du dépôt (`gitlab.entreprise.fr/equipe/service`), pour que `go get` sache où le trouver et que les imports soient uniques ; `GOPRIVATE` réglé sur ce domaine évite le proxy et la base de sommes publics. Un chemin fictif marche pour un binaire jamais importé, mais gêne dès qu'un autre projet veut l'importer."
  - key: definition-require
    format: definition
    question: "Que désigne la directive `require` d'un `go.mod` ?"
    choices:
      - {text: "Elle déclare une dépendance du module et sa version minimale", correct: true}
      - {text: "Elle déclare la version exacte d'une dépendance, verrouillée", correct: false}
      - {text: "Elle remplace une dépendance par un autre module ou un dossier", correct: false}
      - {text: "Elle déclare la version minimale de Go exigée par le module", correct: false}
    answer: "`require` donne une version minimale : la sélection de version minimale peut retenir une version plus haute demandée ailleurs dans le graphe. `replace` substitue un module, la directive `go` fixe la version du langage."
  - key: definition-tidy
    format: definition
    question: "Parmi les commandes `go mod`, que désigne `go mod tidy` ?"
    choices:
      - {text: "La commande qui aligne `go.mod` et `go.sum` sur les imports réels du module", correct: true}
      - {text: "La commande qui vérifie le cache local des modules contre les sommes de `go.sum`", correct: false}
      - {text: "La commande qui copie toutes les dépendances dans le dossier `vendor/` du module", correct: false}
      - {text: "La commande qui remplit le cache de modules, sans rien compiler ni rien modifier", correct: false}
    answer: "`go mod tidy` aligne `go.mod` et `go.sum` sur les imports réels. Vérifier le cache, c'est `go mod verify` ; copier dans `vendor/`, `go mod vendor` ; remplir le cache, `go mod download`."
  - key: definition-chemin-module
    format: definition
    question: "Que désigne le chemin d'un module ?"
    choices:
      - {text: "L'identifiant du module, préfixe des chemins d'import de ses packages", correct: true}
      - {text: "Le dossier du disque où le module est rangé, dans le cache de modules", correct: false}
      - {text: "Le nom du package principal du module, donné par sa clause `package`", correct: false}
      - {text: "L'adresse du proxy d'où le module est téléchargé, réglée par `GOPROXY`", correct: false}
    answer: "L'identifiant du module, déclaré par la directive `module` et souvent l'adresse de son dépôt : il préfixe les chemins d'import de tous ses packages."
