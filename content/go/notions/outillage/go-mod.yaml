notion: go-mod
lesson: "Un **module** est un ensemble de packages versionnés ensemble, décrit par le fichier **`go.mod`** à sa racine :\n\n```\nmodule github.com/exemple/boutique   // le chemin du module : préfixe des imports de ses packages\n\ngo 1.27                               // la version du langage du module\n\nrequire (\n\tgithub.com/jackc/pgx/v5 v5.7.6\n\tgolang.org/x/sync v0.17.0\n\tgolang.org/x/text v0.29.0 // indirect : dépendance d'une dépendance\n)\n```\n\nLes commandes du quotidien :\n- **`go mod init github.com/exemple/boutique`** crée le go.mod ;\n- **`go get github.com/jackc/pgx/v5@v5.7.6`** ajoute ou change une dépendance (`@latest`, `@v1.2.3`, `@none` pour\n  la retirer) ;\n- **`go mod tidy`** aligne le go.mod sur les imports réels : il ajoute ce qui manque, retire ce qui ne sert plus, et\n  met à jour go.sum ;\n- **`go install outil@version`** installe un binaire, sans toucher au go.mod du projet ;\n- `go list -m all` liste toutes les dépendances, `go mod why -m x` explique pourquoi l'une est là.\n\nLe go.mod peut aussi contenir `toolchain` (la chaîne d'outils à utiliser), `replace`, `exclude`, `retract` (versions\nretirées par l'auteur), `tool` (Go 1.24) et `godebug`.\n\nOn **versionne** go.mod et go.sum. La directive `go` est une version **minimale** : elle active les changements de\nlangage de cette version (la variable de boucle par tour en 1.22) et peut déclencher le téléchargement d'une chaîne\nd'outils plus récente.\n\n**En entretien** : « go.mod : module, go, require ; go mod init, go get pour une dépendance, go mod tidy pour\nnettoyer, go install pour un binaire ; go.mod et go.sum versionnés. »"
tour:
  - title: Les modules
    text: |-
      Un projet Go est un **module** : un dossier racine avec un fichier `go.mod`, créé par `go mod init
      github.com/moi/projet`. Il donne le **chemin du module**, préfixe des chemins d'import de ses packages, la version
      de Go visée, et les dépendances :

      ```
      module github.com/moi/projet

      go 1.27

      require github.com/google/uuid v1.6.0
      ```

      `go get` ajoute une dépendance, et `go mod tidy` ajoute celles qui manquent et retire les inutiles ; `go.sum`
      garde leurs empreintes, pour des builds reproductibles. Ces deux fichiers se commitent.

      Le bac à sable du Tour crée lui-même un module sans dépendance, appelé `programme` : `debug.ReadBuildInfo` montre
      ce que le binaire sait de son module.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"runtime/debug"
          )

          func main() {
          	info, ok := debug.ReadBuildInfo()
          	if !ok {
          		fmt.Println("pas d'informations de build")
          		return
          	}
          	fmt.Println("module :", info.Main.Path)
          	fmt.Println("dépendances :", len(info.Deps))
          }
      output: |-
        module : programme
        dépendances : 0
cards:
  - key: contient-mod
    format: course
    question: Que contient go.mod ?
    answer: Le chemin du module, la version de Go, les dépendances requises et d'éventuelles directives replace, exclude, retract, tool, toolchain.
  - key: mod-tidy
    format: course
    question: Que fait go mod tidy ?
    answer: Ajoute les dépendances manquantes, supprime les inutiles et met à jour go.sum.
  - key: get-vs-install
    format: course
    question: go get vs go install ?
    answer: go get modifie les dépendances du module ; go install compile et installe un outil.
  - key: definition-module
    format: definition
    question: module
    answer: Unité de versionnement décrite par go.mod
  - key: install-vs-get
    format: course
    question: Pourquoi utiliser go install plutôt que go get pour installer un outil en ligne de commande ?
    answer: Depuis Go 1.17, go get ne sert qu'à gérer les dépendances du module ; `go install outil@version` compile et installe le binaire sans modifier le go.mod du projet.
  - key: vf-tidy
    format: true-false
    question: '`go mod tidy` retire du go.mod les dépendances qui ne sont plus importées.'
    truth: true
    answer: Et ajoute celles qui manquent.
  - key: vf-indirect
    format: true-false
    question: Le commentaire `// indirect` signale une dépendance qui n'est importée directement par aucun package du module.
    truth: true
    answer: C'est une dépendance d'une dépendance.
  - key: vf-go-directive
    format: true-false
    question: La directive `go 1.27` du go.mod n'a aucun effet sur la sémantique du langage.
    truth: false
    answer: Elle active les changements de langage de cette version.
  - key: vf-versionner
    format: true-false
    question: go.sum ne doit pas être versionné.
    truth: false
    answer: go.mod et go.sum se versionnent tous les deux.
  - key: qcm-commandes
    format: multiple-choice
    question: Quelle commande pour quel besoin ?
    choices:
      - text: 'Créer un module : `go mod init chemin`'
        correct: true
      - text: 'Passer une dépendance en v1.4.0 : `go get exemple.com/lib@v1.4.0`'
        correct: true
      - text: 'Retirer les dépendances inutiles : `go mod tidy`'
        correct: true
      - text: 'Installer golangci-lint dans le go.mod du projet : `go install`'
        correct: false
    answer: go install ne touche pas au go.mod ; la directive tool sert à suivre un outil dans le module.
  - key: qcm-contenu
    format: multiple-choice
    question: Quelles directives peut contenir un go.mod ?
    choices:
      - text: module, go, require
        correct: true
      - text: replace, exclude, retract
        correct: true
      - text: toolchain, tool, godebug
        correct: true
      - text: dependencies
        correct: false
    answer: dependencies n'existe pas.
  - key: qcm-retirer
    format: multiple-choice
    question: Comment retirer une dépendance qui n'est plus utilisée ?
    choices:
      - text: Supprimer les imports puis lancer `go mod tidy`
        correct: true
      - text: '`go get exemple.com/lib@none`'
        correct: true
      - text: Supprimer seulement la ligne de go.sum
        correct: false
      - text: Supprimer le dossier vendor
        correct: false
    answer: go.sum suit go.mod.
  - key: qcm-why
    format: multiple-choice
    question: Comment savoir pourquoi une dépendance est présente ?
    choices:
      - text: '`go mod why -m exemple.com/lib`'
        correct: true
      - text: '`go mod graph` pour le graphe complet'
        correct: true
      - text: '`go vet`'
        correct: false
      - text: '`go doc exemple.com/lib`'
        correct: false
    answer: why montre une chaîne d'imports qui y mène.
  - key: trous-init
    format: fill-in
    question: |-
      Complétez pour créer le module :
      ```
      go mod ___ github.com/exemple/boutique
      ```
    blanks:
      - - init
    answer: go mod init.
  - key: trous-tidy
    format: fill-in
    question: |-
      Complétez pour aligner go.mod sur les imports :
      ```
      go mod ___
      ```
    blanks:
      - - tidy
    answer: go mod tidy.
  - key: trous-get
    format: fill-in
    question: |-
      Complétez pour passer à la dernière version :
      ```
      go get github.com/jackc/pgx/v5@___
      ```
    blanks:
      - - latest
    answer: '@latest.'
  - key: trous-require
    format: fill-in
    question: |-
      Complétez la directive :
      ```
      ___ golang.org/x/sync v0.17.0
      ```
    blanks:
      - - require
    answer: require.
  - key: scenario-nouveau
    format: scenario
    question: Tu démarres un nouveau service Go. Comment initialises-tu le module et ses dépendances ?
    answer: |-
      `go mod init` avec le chemin du dépôt (github.com/entreprise/service), la directive go à la version utilisée en CI,
      puis j'écris le code et je laisse `go mod tidy` ajouter les dépendances importées. go.mod et go.sum sont versionnés,
      la CI vérifie que tidy ne change rien, et Dependabot ou Renovate proposent les mises à jour.
  - key: scenario-mise-a-jour
    format: scenario
    question: Comment mets-tu à jour les dépendances d'un service ?
    answer: |-
      `go list -m -u all` montre les mises à jour disponibles ; `go get -u ./...` met à jour les mineures et correctifs,
      puis `go mod tidy`. Je lis les notes de version des dépendances importantes, je lance tests, `-race` et govulncheck,
      et je fais une pull request par lot cohérent. Les mises à jour majeures (nouveau chemin /v2) se traitent une par une.
  - key: scenario-tidy-ci
    format: scenario
    question: Pourquoi vérifier en CI que go mod tidy ne change rien ?
    answer: |-
      Pour que go.mod et go.sum reflètent exactement le code : pas de dépendance oubliée (le build marcherait chez moi
      grâce au cache mais pas ailleurs), ni de dépendance morte qui alourdit l'audit. La CI lance `go mod tidy` puis
      `git diff --exit-code go.mod go.sum`, et échoue si un fichier change.
  - key: scenario-chemin
    format: scenario
    question: Quel chemin de module choisir pour un projet interne de l'entreprise ?
    answer: |-
      Le chemin du dépôt où il est hébergé (gitlab.entreprise.fr/equipe/service), pour que `go get` sache où le trouver et
      que les imports soient uniques. Avec GOPRIVATE réglé sur ce domaine, les outils passent directement par le dépôt
      privé, sans proxy public ni base de sommes publique. Un chemin fictif marche pour un binaire jamais importé, mais
      gêne dès qu'un autre projet veut l'importer.
  - key: definition-require
    format: definition
    question: require (go.mod)
    answer: Directive qui déclare une dépendance du module et sa version minimale
  - key: definition-tidy
    format: definition
    question: go mod tidy
    answer: Commande qui aligne go.mod et go.sum sur les imports réels du module
  - key: definition-chemin-module
    format: definition
    question: chemin de module
    answer: Identifiant du module, préfixe des chemins d'import de ses packages
