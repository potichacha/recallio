notion: gogc-gomemlimit
lesson: |-
  Deux réglages pilotent le ramasse-miettes.

  **`GOGC`** (défaut **100**) : le tas peut grossir de `GOGC` % au-dessus du tas **vivant** avant le prochain cycle. Avec
  100 Mo vivants et `GOGC=100`, le cycle suivant démarre vers 200 Mo.
  - plus haut (200, 400) : cycles plus rares, moins de CPU pour le GC, mais plus de mémoire ;
  - plus bas (50) : moins de mémoire, plus de CPU ;
  - `GOGC=off` : désactive le déclenchement par GOGC.

  **`GOMEMLIMIT`** (Go 1.19) : une **limite souple** sur la mémoire totale gérée par le runtime (`GOMEMLIMIT=900MiB`).
  Quand on s'en approche, le GC tourne plus souvent pour rester dessous, quel que soit GOGC.

  ```
  # conteneur de 1 Gio : garder de la marge pour la mémoire hors runtime (cgo, piles du système, mmap)
  GOMEMLIMIT=900MiB
  ```

  Les combinaisons courantes :
  - **GOMEMLIMIT seul** (GOGC à 100) : comportement normal, mais le GC accélère avant de dépasser la mémoire du
    conteneur, ce qui évite des OOMKilled ;
  - **`GOGC=off` + GOMEMLIMIT** : aucun cycle tant que la limite est loin, beaucoup de mémoire utilisée, très peu de CPU
    pour le GC. Efficace, mais risqué si le tas vivant approche la limite ;
  - **les pièges** : une limite trop proche du tas **vivant** fait tourner le GC en continu (*death spiral*) ; le
    runtime plafonne alors le GC à environ 50 % du CPU, et le programme finit par dépasser la limite. Ce n'est **pas**
    une limite dure.

  Ils se règlent aussi dans le code (`debug.SetGCPercent`, `debug.SetMemoryLimit`), par exemple à partir de la mémoire
  du conteneur lue au démarrage.

  **En entretien** : « GOGC fixe la croissance du tas entre deux cycles (CPU contre mémoire) ; GOMEMLIMIT est une limite
  souple qui accélère le GC près du plafond ; en conteneur, GOMEMLIMIT un peu sous la limite mémoire. »
cards:
  - key: regle-gogc
    format: course
    question: Que règle GOGC ?
    choices:
      - {text: "La croissance du tas, en %, qui déclenche un cycle ; 100 par défaut", correct: true}
      - {text: "La taille maximale du tas, en Mo, au-delà de laquelle tout s'arrête", correct: false}
      - {text: "La part des cœurs consacrée au GC ; 100 % des cœurs par défaut", correct: false}
      - {text: "La durée maximale d'une pause, en microsecondes ; 100 par défaut", correct: false}
    answer: "La croissance du tas, en pourcentage du tas vivant, qui déclenche un cycle : avec 100, un cycle part quand le tas a doublé depuis le dernier marquage."
  - key: regle-gomemlimit
    format: course
    question: Que règle GOMEMLIMIT ?
    choices:
      - {text: "Une limite souple de la mémoire du runtime : le GC accélère à son approche", correct: true}
      - {text: "Une limite stricte : le programme s'arrête dès qu'il la dépasse", correct: false}
      - {text: "La taille du tas réservée au démarrage, comme `-Xms` en Java", correct: false}
      - {text: "La croissance du tas, en %, qui déclenche un nouveau cycle du GC", correct: false}
    answer: "Une limite souple de la mémoire totale gérée par le runtime (Go 1.19) : le GC se déclenche plus souvent à son approche. La croissance en %, c'est GOGC."
  - key: valeur-gomemlimit-conteneur
    format: course
    question: "Quelle valeur donner à GOMEMLIMIT dans un conteneur ?"
    choices:
      - {text: "Environ 90 % de la limite mémoire du conteneur", correct: true}
      - {text: "Exactement la limite mémoire du conteneur", correct: false}
      - {text: "Le double de la limite, pour absorber les pics", correct: false}
      - {text: "La taille du tas vivant mesurée au démarrage", correct: false}
    answer: "Environ 90 % de la limite mémoire du conteneur : la marge couvre la mémoire hors runtime (piles des threads, cgo, fichiers projetés). À la limite exacte, le conteneur serait tué avant que le GC réagisse."
  - key: service-kubernetes-pics-latence-oomkilled
    format: scenario
    question: "Ton service Go dans Kubernetes a des pics de latence et des OOMKilled occasionnels. Quels réglages vérifies-tu d'abord ?"
    choices:
      - {text: "GOMAXPROCS, mal calculé avant Go 1.25, et GOMEMLIMIT, à 90 % de la limite du pod", correct: true}
      - {text: "GOGC à 25, pour des cycles plus fréquents, et davantage de réplicas du pod", correct: false}
      - {text: "Un appel à `runtime.GC()` après chaque requête, et une limite CPU plus basse", correct: false}
      - {text: "GOMAXPROCS au double des cœurs du nœud, et GOMEMLIMIT au-dessus de la limite", correct: false}
    answer: "Avant Go 1.25, GOMAXPROCS vaut le nombre de cœurs du nœud, pas la limite du pod : le conteneur est bridé et la latence explose (Go 1.25+ ou automaxprocs). Sans GOMEMLIMIT, le tas peut doubler entre deux cycles et dépasser la limite : je le fixe à environ 90 % de celle-ci, puis je mesure (gctrace, profil d'allocations)."
  - key: terme-gogc
    format: course
    question: "Que signifie `GOGC=100`, sa valeur par défaut ?"
    choices:
      - {text: "Un cycle part quand le tas a grossi de 100 % depuis le dernier marquage", correct: true}
      - {text: "Le GC peut utiliser jusqu'à 100 % du CPU pendant chacun de ses cycles", correct: false}
      - {text: "Le tas est limité à 100 Mo, au-delà desquels un cycle est forcé", correct: false}
      - {text: "Un cycle du GC se déclenche toutes les 100 millisecondes", correct: false}
    answer: "GOGC fixe la croissance du tas qui déclenche un cycle : à 100, un cycle part quand le tas a doublé par rapport au tas vivant du cycle précédent."
  - key: terme-gomemlimit
    format: course
    question: "Pourquoi dit-on que GOMEMLIMIT est une limite « souple » ?"
    choices:
      - {text: "Le runtime peut la dépasser : il accélère le GC, sans tuer le programme", correct: true}
      - {text: "Elle ne compte que le tas, sans les piles des goroutines ni le runtime", correct: false}
      - {text: "Elle s'ajuste seule à la limite du conteneur, sans réglage manuel", correct: false}
      - {text: "Elle ne s'applique qu'après deux minutes d'exécution du programme", correct: false}
    answer: "GOMEMLIMIT (Go 1.19) est une cible : à son approche, le GC tourne plus souvent, mais le runtime la dépasse plutôt que de s'arrêter ou de passer tout son temps à collecter. Elle couvre toute la mémoire gérée par le runtime, piles comprises."
  - key: vf-defaut
    format: true-false
    question: La valeur par défaut de GOGC est 100.
    truth: true
    answer: Le tas peut doubler par rapport au tas vivant avant le prochain cycle.
  - key: vf-dure
    format: true-false
    question: 'GOMEMLIMIT est une limite dure : le programme ne peut jamais la dépasser.'
    truth: false
    answer: C'est une limite souple ; si le tas vivant la dépasse, le programme la dépasse aussi.
  - key: vf-off
    format: true-false
    question: Avec GOGC=off et sans GOMEMLIMIT, le tas peut grossir sans que le GC ne se déclenche de lui-même.
    truth: true
    answer: C'est dangereux pour un service ; on combine off avec une limite.
  - key: vf-total
    format: true-false
    question: GOMEMLIMIT compte toute la mémoire du processus, y compris celle allouée par du code C.
    truth: false
    answer: Elle compte la mémoire gérée par le runtime Go ; d'où la marge à laisser.
  - key: qcm-gogc
    format: multiple-choice
    question: "Quel est le prix à payer quand on passe GOGC de 100 à 400 ?"
    choices:
      - {text: "Un tas qui peut grossir jusqu'à cinq fois le tas vivant", correct: true}
      - {text: "Des pauses plus longues à chaque cycle du GC", correct: false}
      - {text: "Plus de CPU consacré au marquage à chaque cycle", correct: false}
      - {text: "Des cycles de GC plus fréquents qu'avec 100", correct: false}
    answer: "Avec GOGC=400, le tas peut monter à cinq fois le tas vivant avant le cycle suivant : moins de cycles et moins de CPU pour le GC, au prix de la mémoire. Les pauses restent courtes."
  - key: qcm-conteneur
    format: multiple-choice
    question: Un conteneur a une limite mémoire de 2 Gio. Quelle valeur de GOMEMLIMIT ?
    choices:
      - {text: "Environ 1800MiB, pour laisser de la marge à la mémoire hors runtime", correct: true}
      - {text: "4GiB, le double de la limite, pour que le GC ne tourne presque jamais", correct: false}
      - {text: "Exactement 2GiB, la limite du conteneur, pour utiliser toute la mémoire", correct: false}
      - {text: "100MiB, très bas, pour forcer le GC à garder un tas toujours minimal", correct: false}
    answer: "Une marge de 5 à 10 % couvre les piles des threads, cgo et les fichiers projetés en mémoire. Au-dessus de la limite, le conteneur serait tué ; très bas, le GC tournerait sans arrêt."
  - key: qcm-spirale
    format: multiple-choice
    question: Que se passe-t-il quand le tas vivant approche GOMEMLIMIT ?
    choices:
      - {text: "Le GC tourne de plus en plus souvent, jusqu'à la moitié du CPU environ", correct: true}
      - {text: "Le programme s'arrête aussitôt avec une erreur de mémoire insuffisante", correct: false}
      - {text: "Le GC libère des objets encore utilisés pour rester sous la limite", correct: false}
      - {text: "Le runtime ignore la limite et ne change rien au rythme du GC", correct: false}
    answer: "Le GC tourne de plus en plus souvent ; le runtime plafonne son temps à environ la moitié du CPU, pour éviter le blocage total, au prix d'un dépassement de la limite."
  - key: qcm-code
    format: multiple-choice
    question: "Comment changer GOGC depuis le programme, en cours d'exécution ?"
    choices:
      - {text: "`debug.SetGCPercent(200)`", correct: true}
      - {text: "`runtime.GOGC = 200`", correct: false}
      - {text: "`os.Setenv(\"GOGC\", \"200\")`", correct: false}
      - {text: "`runtime.GC(200)`", correct: false}
    answer: "`debug.SetGCPercent` agit à chaud, comme `debug.SetMemoryLimit` pour GOMEMLIMIT. La variable d'environnement n'est lue qu'au démarrage : `os.Setenv` en cours de route ne change rien."
  - key: bug-oom
    format: bug-fix
    question: Ton service est régulièrement tué par Kubernetes (OOMKilled) lors des pics, alors que son tas vivant reste à 600 Mo pour une limite de 1 Gio. Que proposes-tu ?
    choices:
      - {text: "Fixer GOMEMLIMIT à environ 900MiB, sous la limite du conteneur", correct: true}
      - {text: "Fixer GOMEMLIMIT à 1GiB, exactement la limite du conteneur", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque requête pour vider le tas", correct: false}
      - {text: "Augmenter GOGC à 400, pour moins de cycles pendant les pics", correct: false}
    answer: |-
      ```yaml
      env:
        - name: GOMEMLIMIT
          value: "900MiB"
      ```
      Avec GOGC=100, le tas peut monter au double du tas vivant (1,2 Go) avant le cycle suivant ; GOMEMLIMIT fait
      accélérer le GC à l'approche de la limite du conteneur, avec une marge pour la mémoire hors runtime.
  - key: bug-spirale
    format: bug-fix
    question: Après avoir mis GOMEMLIMIT=500MiB sur un service dont le tas vivant fait 480 Mo, le CPU passe à 100 % et la latence explose. Que fais-tu ?
    choices:
      - {text: "Une limite nettement au-dessus du tas vivant : plus de mémoire, ou un tas réduit", correct: true}
      - {text: "Baisser GOMEMLIMIT à 400MiB, pour forcer le GC à libérer davantage", correct: false}
      - {text: "Mettre GOGC=off, pour que le GC arrête de tourner en continu", correct: false}
      - {text: "Augmenter GOMAXPROCS, pour donner plus de threads au marquage", correct: false}
    answer: |-
      ```yaml
      resources:
        limits:
          memory: 1Gi
      env:
        - name: GOMEMLIMIT
          value: "900MiB"
      ```
      La limite était presque égale au tas vivant : le GC tournait sans arrêt pour rien libérer. Il faut une limite
      nettement au-dessus du tas vivant (plus de mémoire pour le conteneur, ou un tas vivant réduit).
  - key: bug-off-seul
    format: bug-fix
    question: |-
      Pour économiser du CPU, un collègue a mis dans le déploiement :
      ```yaml
      env:
        - name: GOGC
          value: "off"
      ```
      Le service grossit jusqu'à être tué. Que proposes-tu ?
    choices:
      - {text: "Garder GOGC=off, mais ajouter un GOMEMLIMIT sous la mémoire du conteneur", correct: true}
      - {text: "Garder GOGC=off et appeler `runtime.GC()` à la fin de chaque requête", correct: false}
      - {text: "Remplacer `off` par `0`, qui désactive aussi le GC, mais sans fuite", correct: false}
      - {text: "Garder GOGC=off et augmenter la limite mémoire du conteneur", correct: false}
    answer: |-
      ```yaml
      env:
        - name: GOGC
          value: "off"
        - name: GOMEMLIMIT
          value: "1800MiB"
      ```
      Sans limite, GOGC=off ne déclenche plus aucun cycle ; avec GOMEMLIMIT sous la mémoire du conteneur, le GC ne tourne que lorsque c'est nécessaire. `GOGC=0`, à l'inverse, ferait tourner le GC sans arrêt.
  - key: bug-gc-force
    format: bug-fix
    question: |-
      Le service appelle `runtime.GC()` à la fin de chaque requête « pour libérer la mémoire », et le débit est mauvais. Quelle correction est la bonne ?
      ```go
      defer runtime.GC()
      ```
    choices:
      - {text: "Supprimer l'appel ; au besoin, poser un plafond avec `debug.SetMemoryLimit`", correct: true}
      - {text: "Lancer l'appel dans une goroutine : `go runtime.GC()`, pour ne pas attendre", correct: false}
      - {text: "Appeler `debug.FreeOSMemory()` à la place, plus léger qu'un cycle complet", correct: false}
      - {text: "Ne l'appeler qu'une requête sur deux, pour diviser son coût par deux", correct: false}
    answer: |-
      ```go
      // supprimer l'appel ; si la mémoire doit rester sous un plafond :
      debug.SetMemoryLimit(900 << 20)
      ```
      Chaque appel lance un cycle complet et bloque l'appelant jusqu'à sa fin. Le GC se déclenche tout seul ; GOMEMLIMIT donne un plafond sans forcer de cycles inutiles. `debug.FreeOSMemory` force aussi un cycle, en plus coûteux.
  - key: scenario-choisir
    format: scenario
    question: Comment règles-tu GOGC et GOMEMLIMIT pour un service en conteneur ?
    choices:
      - {text: "GOMEMLIMIT à environ 90 % du conteneur, GOGC à 100, puis GOGC plus haut si le GC pèse", correct: true}
      - {text: "GOGC à 10 pour garder un tas minimal, et pas de GOMEMLIMIT, inutile en conteneur", correct: false}
      - {text: "GOMEMLIMIT égal à la limite du conteneur, et GOGC=off d'emblée sur tous les services", correct: false}
      - {text: "Aucun réglage : depuis Go 1.25, le runtime lit seul la limite mémoire du cgroup", correct: false}
    answer: "GOMEMLIMIT à environ 90 % de la limite mémoire, GOGC laissé à 100 : protection contre les OOM sans changer le reste. Si le GC pèse en CPU et que le tas vivant est loin de la limite, j'augmente GOGC, voire GOGC=off avec la limite. Go 1.25 lit la limite CPU du cgroup, pas la limite mémoire."
  - key: scenario-batch
    format: scenario
    question: Un traitement par lots court alloue beaucoup et le GC prend 40 % du temps. Que tentes-tu ?
    choices:
      - {text: "`GOGC=off` avec un GOMEMLIMIT confortable, moins d'allocations, puis mesurer", correct: true}
      - {text: "`GOGC=10`, pour que chaque cycle ait moins de travail et finisse plus vite", correct: false}
      - {text: "Un `runtime.GC()` après chaque lot, pour garder le tas petit et rapide", correct: false}
      - {text: "`GOMAXPROCS=1`, pour que le GC ne dispute plus les cœurs au traitement", correct: false}
    answer: "Pour un traitement court sur une machine qui a de la mémoire, `GOGC=off` avec un GOMEMLIMIT confortable (ou un GOGC très élevé) supprime presque tous les cycles : plus de mémoire, mais un traitement plus rapide. En parallèle, je réduis les allocations coûteuses, et je mesure le temps total et la mémoire maximale."
  - key: scenario-observer
    format: scenario
    question: Quelles métriques suis-tu pour savoir si le GC est bien réglé ?
    choices:
      - {text: "La part de CPU du GC, le tas vivant et sa cible, la fréquence des cycles, et les p99", correct: true}
      - {text: "Le seul nombre de goroutines, qui reflète directement la pression sur la mémoire", correct: false}
      - {text: "La seule durée des pauses stop-the-world, le seul vrai coût du GC de Go", correct: false}
      - {text: "La sortie de `go vet`, qui signale les réglages du GC mal choisis dans le code", correct: false}
    answer: "La part du CPU passée dans le GC (`/cpu/classes/gc/total:cpu-seconds` dans `runtime/metrics`), le tas vivant et sa cible, la fréquence des cycles, et les p99 de l'application, où le mark assist se voit. Je compare aussi la mémoire du processus à la limite du conteneur."
