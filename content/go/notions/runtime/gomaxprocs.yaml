notion: gomaxprocs
lesson: |-
  **`GOMAXPROCS`** fixe le nombre de **P** de l'ordonnanceur, donc le nombre de goroutines qui exécutent du code Go en
  même temps. Il se règle par la variable d'environnement `GOMAXPROCS` ou par `runtime.GOMAXPROCS(n)` ;
  `runtime.GOMAXPROCS(0)` lit la valeur sans la changer.

  Par défaut, il vaut le nombre de processeurs **visibles**. Avant Go 1.25, en conteneur, c'était un problème : un
  conteneur limité à 2 CPU par son quota cgroup sur une machine de 64 cœurs prenait GOMAXPROCS=64. Le runtime lançait
  64 threads actifs qui consommaient le quota en quelques millisecondes, puis le noyau **bridait** le conteneur
  (*throttling*) : latence en dents de scie. On ajoutait la bibliothèque `go.uber.org/automaxprocs`.

  **Depuis Go 1.25** :
  - sous Linux, la valeur par défaut tient compte de la **limite de CPU du cgroup** (arrondie à l'entier supérieur) ;
  - le runtime **réévalue** périodiquement cette valeur si la limite ou le nombre de CPU change ;
  - ces comportements ne s'appliquent pas si `GOMAXPROCS` est fixé à la main, et se désactivent avec
    `GODEBUG=containermaxprocs=0` et `updatemaxprocs=0`.

  ```go
  fmt.Println(runtime.NumCPU(), runtime.GOMAXPROCS(0))
  ```

  Ce que GOMAXPROCS **ne** limite **pas** : le nombre de goroutines, ni le nombre de threads (ceux bloqués dans des
  appels système ou du code C ne comptent pas).

  **En entretien** : « Le nombre de P, donc le parallélisme du code Go ; par défaut le nombre de CPU, et depuis Go 1.25
  la limite CPU du cgroup, réévaluée en cours de route ; avant, automaxprocs. »
cards:
  - key: controle-gomaxprocs
    format: course
    question: Que contrôle GOMAXPROCS ?
    choices:
      - {text: "Le nombre de goroutines qui exécutent du code Go en même temps (les P)", correct: true}
      - {text: "Le nombre maximal de goroutines que le programme peut créer", correct: false}
      - {text: "Le nombre maximal de threads du système que le runtime peut créer", correct: false}
      - {text: "Le nombre de processus du système lancés pour le programme", correct: false}
    answer: "Le nombre de goroutines qui exécutent du code Go simultanément, c'est-à-dire le nombre de P. Ni le nombre de goroutines, ni celui des threads bloqués en appel système ne sont limités."
  - key: change-1-25-gomaxprocs
    format: course
    question: Qu'a changé Go 1.25 pour GOMAXPROCS ?
    choices:
      - {text: "Il tient compte de la limite CPU du cgroup, et s'ajuste en cours de route", correct: true}
      - {text: "Il vaut désormais 1 par défaut, à augmenter selon les besoins du service", correct: false}
      - {text: "Il tient compte de la demande CPU (request) du pod Kubernetes", correct: false}
      - {text: "Il ne peut plus être changé par la variable d'environnement", correct: false}
    answer: "Il tient compte de la limite CPU du cgroup (conteneurs) et s'ajuste dynamiquement si elle change. C'est la limite qui compte, pas la demande (request)."
  - key: gomaxprocs-pose-probleme-conteneur-avant-1
    format: course
    question: Pourquoi GOMAXPROCS pose-t-il problème en conteneur avant Go 1.25 ?
    choices:
      - {text: "Il vaut le nombre de cœurs du nœud, d'où un bridage du CPU du conteneur", correct: true}
      - {text: "Il vaut 1, et le service n'utilise qu'un seul cœur du conteneur", correct: false}
      - {text: "Il vaut la limite CPU arrondie à l'inférieur, souvent 0", correct: false}
      - {text: "Il est ignoré en conteneur, qui fixe seul le nombre de threads", correct: false}
    answer: "Il vaut le nombre de cœurs du nœud, pas la limite du conteneur : le runtime lance trop de travail en parallèle, le quota de CPU s'épuise et le noyau bride le conteneur (throttling)."
  - key: terme-gomaxprocs
    format: course
    question: "Que représente la valeur de GOMAXPROCS dans le modèle G-M-P ?"
    choices:
      - {text: "Le nombre de P, les processeurs logiques", correct: true}
      - {text: "Le nombre de M, les threads du système", correct: false}
      - {text: "Le nombre de G, les goroutines lancées", correct: false}
      - {text: "Le nombre de cœurs physiques de la machine", correct: false}
    answer: "Le nombre de P : au plus GOMAXPROCS goroutines exécutent du code Go en même temps. Depuis Go 1.25, sa valeur par défaut tient compte de la limite CPU du conteneur."
  - key: vf-lire
    format: true-false
    question: '`runtime.GOMAXPROCS(0)` renvoie la valeur actuelle sans la modifier.'
    truth: true
    answer: Toute valeur inférieure à 1 ne change rien.
  - key: vf-goroutines
    format: true-false
    question: GOMAXPROCS limite le nombre de goroutines qu'un programme peut créer.
    truth: false
    answer: Il limite celles qui s'exécutent en même temps.
  - key: vf-cgroup
    format: true-false
    question: Depuis Go 1.25, sous Linux, la valeur par défaut de GOMAXPROCS tient compte de la limite de CPU du conteneur.
    truth: true
    answer: Et elle est réévaluée si la limite change.
  - key: vf-manuel
    format: true-false
    question: Si la variable d'environnement GOMAXPROCS est fixée, Go 1.25 la remplace quand même par la limite du cgroup.
    truth: false
    answer: Une valeur fixée à la main est respectée telle quelle.
  - key: qcm-throttling
    format: multiple-choice
    question: "Avant Go 1.25, que valait GOMAXPROCS pour un service limité à 2 CPU sur une machine de 64 cœurs ?"
    choices:
      - {text: "64, le nombre de cœurs de la machine", correct: true}
      - {text: "2, la limite CPU du conteneur", correct: false}
      - {text: "1, faute de pouvoir lire le cgroup", correct: false}
      - {text: "128, deux threads par cœur", correct: false}
    answer: "64 : le runtime lançait 64 P, le quota de 2 CPU s'épuisait très vite, puis le conteneur était bridé, d'où des pics de latence ; automaxprocs corrigeait cela."
  - key: qcm-regler
    format: multiple-choice
    question: "Comment régler GOMAXPROCS depuis le code du programme ?"
    choices:
      - {text: "`runtime.GOMAXPROCS(n)`", correct: true}
      - {text: "`debug.SetMaxProcs(n)`", correct: false}
      - {text: "Une directive `//go:maxprocs`", correct: false}
      - {text: "Un drapeau `go build -maxprocs`", correct: false}
    answer: "`runtime.GOMAXPROCS(n)` dans le programme, ou la variable d'environnement GOMAXPROCS au démarrage. Depuis Go 1.25, `runtime.SetDefaultGOMAXPROCS()` revient au calcul par défaut."
  - key: qcm-calcul
    format: multiple-choice
    question: Quelle valeur de GOMAXPROCS choisir pour un service de calcul intensif ?
    choices:
      - text: Le nombre de CPU réellement disponibles pour le processus
        correct: true
      - text: Bien plus que le nombre de CPU, pour aller plus vite
        correct: false
      - text: 1, pour éviter la concurrence
        correct: false
      - text: Le nombre de goroutines
        correct: false
    answer: Au-delà, les threads se disputent les mêmes cœurs.
  - key: qcm-ne-limite-pas
    format: multiple-choice
    question: Que ne limite pas GOMAXPROCS ?
    choices:
      - {text: "Le nombre de goroutines du programme", correct: true}
      - {text: "Le nombre de P", correct: false}
      - {text: "Le nombre de goroutines qui exécutent du code Go au même instant", correct: false}
      - {text: "Le parallélisme du code Go du programme", correct: false}
    answer: "Il fixe exactement le nombre de P, donc de goroutines qui exécutent du code Go à un instant. Le nombre de goroutines, comme celui des threads bloqués en appel système, n'est pas limité."
  - key: scenario-conteneur
    format: scenario
    question: Ton service Go dans Kubernetes a une latence en dents de scie, et les métriques montrent du CPU throttling. Que vérifies-tu ?
    choices:
      - {text: "La version de Go et la valeur effective de GOMAXPROCS, journalisée au démarrage", correct: true}
      - {text: "Le nombre de goroutines, qui doit rester sous GOMAXPROCS pour éviter le bridage", correct: false}
      - {text: "La valeur de GOGC, dont le marquage consomme tout le quota CPU du conteneur", correct: false}
      - {text: "La taille des piles des goroutines, qui gonfle le CPU consommé à chaque appel", correct: false}
    answer: "La version de Go et la valeur effective de GOMAXPROCS (`runtime.GOMAXPROCS(0)` journalisée au démarrage). Avant Go 1.25, elle valait le nombre de cœurs du nœud : je passe en 1.25, j'ajoute automaxprocs, ou je fixe GOMAXPROCS à la limite CPU. Je vérifie aussi qu'une limite CPU a un sens ici."
  - key: scenario-request-limit
    format: scenario
    question: Ton pod n'a qu'une demande CPU (request), sans limite. Que vaut GOMAXPROCS avec Go 1.25 ?
    choices:
      - {text: "Le nombre de CPU du nœud : le calcul suit la limite du cgroup, pas la demande", correct: true}
      - {text: "La demande CPU du pod, arrondie à l'entier supérieur par le runtime de Go", correct: false}
      - {text: "1 : faute de limite CPU à lire dans le cgroup, le runtime reste prudent", correct: false}
      - {text: "La moitié des CPU du nœud, pour laisser de la place aux autres pods", correct: false}
    answer: "Le calcul de Go 1.25 se base sur la limite CPU du cgroup, pas sur la demande : sans limite, GOMAXPROCS vaut le nombre de CPU du nœud. C'est souvent voulu ; pour aligner le parallélisme sur la demande, on fixe GOMAXPROCS à la main, par exemple depuis l'API descendante de Kubernetes."
  - key: scenario-mesurer
    format: scenario
    question: Faut-il augmenter GOMAXPROCS pour un service qui fait surtout des appels réseau ?
    choices:
      - {text: "Non : une goroutine en attente réseau est garée par le netpoller, sans occuper de P", correct: true}
      - {text: "Oui : chaque appel réseau en cours bloque un P jusqu'à l'arrivée de la réponse", correct: false}
      - {text: "Oui : il faut au moins un P par connexion ouverte, pour éviter les attentes", correct: false}
      - {text: "Non : GOMAXPROCS n'a d'effet que sur les programmes qui n'utilisent pas le réseau", correct: false}
    answer: "Non : les goroutines en attente réseau sont garées par le netpoller et n'occupent pas de P. Plus d'appels simultanés passent par plus de goroutines, pas par plus de P ; je regarde d'abord où part le temps avec une trace et un profil CPU."
  - key: scenario-benchmark
    format: scenario
    question: Comment mesures-tu l'effet de GOMAXPROCS sur ton code ?
    choices:
      - {text: "`go test -bench . -cpu=1,2,4,8`, qui relance chaque benchmark avec ces valeurs", correct: true}
      - {text: "`go test -bench . -count=8`, qui lance le benchmark sur 8 cœurs à la fois", correct: false}
      - {text: "`go test -bench . -parallel=8`, qui fixe GOMAXPROCS pour les benchmarks", correct: false}
      - {text: "`GOMAXPROCS=8 go build`, qui grave cette valeur dans le binaire compilé", correct: false}
    answer: "`-cpu=1,2,4,8` relance chaque benchmark avec ces valeurs de GOMAXPROCS : on voit si le code passe à l'échelle (avec `b.RunParallel`) ou bute sur un verrou, ce qu'explique le profil de contention (`-mutexprofile`). `-count` répète, `-parallel` règle `t.Parallel`."
