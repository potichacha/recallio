notion: pile-tas
lesson: "Une variable vit soit sur la **pile** de la goroutine, soit sur le **tas** :\n- la **pile** est libérée d'un coup au retour de la fonction : allouer y coûte presque rien, et le ramasse-miettes\n  n'a rien à faire ;\n- le **tas** survit à la fonction, mais chaque allocation coûte, et le **ramasse-miettes** doit ensuite la retrouver\n  et la libérer.\n\nEn Go, **on ne choisit pas** : `new`, `&T{}` ou `make` ne disent rien de l'emplacement. C'est le compilateur qui\ndécide, par l'**analyse d'échappement** (*escape analysis*) : si une variable peut être utilisée **après** le retour\nde la fonction, elle **s'échappe** vers le tas.\n\n```go\nfunc nouveau() *Point {\n\tp := Point{1, 2}\n\treturn &p // p s'échappe : elle survit à la fonction (c'est permis et sûr en Go)\n}\n\nfunc somme() int {\n\tp := &Point{1, 2} // ne s'échappe pas : reste sur la pile malgré le &\n\treturn p.X + p.Y\n}\n```\n\nCe qui fait souvent échapper une variable :\n- renvoyer son adresse, ou la stocker dans une variable globale ou un objet du tas ;\n- la capturer dans une closure qui survit à la fonction ;\n- la convertir en **interface** quand le compilateur ne peut pas suivre (par exemple `fmt.Println(x)`) ;\n- une taille **inconnue à la compilation** (`make([]byte, n)` avec un `n` variable) ou trop grande.\n\nPour voir les décisions : `go build -gcflags=-m` (« moved to heap: p », « does not escape »). Pour mesurer :\n`go test -bench . -benchmem` (colonne allocs/op).\n\nOn n'optimise ces allocations que sur un **chemin chaud** mesuré ; le reste du temps, on écrit le code le plus clair.\n\n**En entretien** : « Le compilateur choisit pile ou tas par l'analyse d'échappement ; renvoyer &x est sûr ; -gcflags=-m\npour voir ; moins d'allocations, c'est moins de travail pour le GC. »"
cards:
  - key: retourner-adresse-variable-locale
    format: course
    question: "Que fait le compilateur Go quand une fonction renvoie `&x`, `x` étant une de ses variables locales ?"
    choices:
      - {text: "Il place `x` sur le tas, et le pointeur reste valide après le retour", correct: true}
      - {text: "Il refuse de compiler : le pointeur serait invalide, comme en C", correct: false}
      - {text: "Il garde `x` sur la pile, et le pointeur devient invalide au retour", correct: false}
      - {text: "Il recopie `x` à chaque déréférencement du pointeur renvoyé", correct: false}
    answer: "L'analyse d'échappement voit que `x` survit au retour et la place sur le tas : le pointeur reste valide. Contrairement au C, renvoyer l'adresse d'une variable locale est sûr en Go."
  - key: escape-analysis
    format: course
    question: "Qu'est-ce que l'escape analysis de Go ?"
    choices:
      - {text: "L'analyse du compilateur qui décide si une variable va sur la pile ou le tas", correct: true}
      - {text: "L'analyse du GC qui repère, à l'exécution, les objets devenus inaccessibles", correct: false}
      - {text: "L'analyse de `go vet` qui signale les pointeurs renvoyés par une fonction", correct: false}
      - {text: "L'analyse du JIT qui supprime des allocations pendant l'exécution", correct: false}
    answer: "L'analyse du compilateur qui décide, à la compilation, si une variable va sur la pile ou sur le tas. Go n'a pas de JIT : tout est décidé avant l'exécution."
  - key: voir-decisions-echappement
    format: course
    question: "Comment voir les décisions d'échappement du compilateur ?"
    choices:
      - {text: "`go build -gcflags=-m`", correct: true}
      - {text: "`go vet -escape`", correct: false}
      - {text: "`go test -benchmem`", correct: false}
      - {text: "`GODEBUG=gctrace=1`", correct: false}
    answer: "`go build -gcflags=-m` affiche les décisions (« escapes to heap », « moved to heap »). `-benchmem` compte les allocations sans dire pourquoi, et `go vet` n'a pas d'analyse d'échappement."
  - key: definition-escape-analysis
    format: definition
    question: "Que désigne l'« escape analysis » ?"
    choices:
      - {text: "La décision, à la compilation, de placer une variable sur la pile ou le tas", correct: true}
      - {text: "Le marquage, à l'exécution, des objets encore accessibles depuis les racines", correct: false}
      - {text: "La copie de la pile d'une goroutine dans une pile deux fois plus grande", correct: false}
      - {text: "Le passage au netpoller d'une goroutine bloquée sur le réseau", correct: false}
    answer: "La décision du compilateur entre pile et tas, selon que la variable peut servir après le retour de sa fonction."
  - key: pourquoi
    format: course
    question: Pourquoi une allocation sur la pile est-elle moins coûteuse qu'une allocation sur le tas ?
    choices:
      - {text: "Elle est libérée d'un coup au retour, sans aucun travail pour le GC", correct: true}
      - {text: "La pile tient dans un cache du processeur réservé aux goroutines", correct: false}
      - {text: "Le tas est partagé, et chaque allocation y prend un verrou global", correct: false}
      - {text: "La pile est allouée par le noyau, plus rapide que le runtime", correct: false}
    answer: "Elle est libérée d'un coup au retour de la fonction, sans travail pour le ramasse-miettes ; une allocation sur le tas demande l'allocateur, puis un marquage et un balayage par le GC."
  - key: vf-new
    format: true-false
    question: '`new(T)` alloue toujours sur le tas.'
    truth: false
    answer: Si la valeur ne s'échappe pas, elle reste sur la pile.
  - key: vf-adresse
    format: true-false
    question: En Go, renvoyer l'adresse d'une variable locale est sûr.
    truth: true
    answer: Le compilateur la place sur le tas.
  - key: vf-interface
    format: true-false
    question: Passer une valeur à `fmt.Println` peut la faire échapper vers le tas.
    truth: true
    answer: La conversion en interface et l'usage par fmt empêchent souvent le compilateur de prouver qu'elle reste locale.
  - key: vf-choisir
    format: true-false
    question: Le développeur choisit explicitement si une variable va sur la pile ou sur le tas.
    truth: false
    answer: C'est le compilateur qui décide.
  - key: qcm-echappe
    format: multiple-choice
    question: Lesquelles de ces situations font en général échapper une variable ?
    choices:
      - text: Renvoyer son adresse
        correct: true
      - text: La stocker dans une variable globale
        correct: true
      - text: La capturer dans une closure renvoyée par la fonction
        correct: true
      - text: L'additionner à une autre variable locale
        correct: false
    answer: Tout ce qui la rend accessible après le retour.
  - key: qcm-voir
    format: multiple-choice
    question: "Lesquels de ces outils observent les allocations et l'échappement ?"
    choices:
      - text: '`go build -gcflags=-m`'
        correct: true
      - text: '`go test -bench . -benchmem`'
        correct: true
      - text: Un profil d'allocations pprof
        correct: true
      - text: '`go vet -escape`'
        correct: false
    answer: vet n'a pas d'analyse d'échappement.
  - key: qcm-reduire
    format: multiple-choice
    question: "Laquelle de ces actions réduit les allocations sur un chemin chaud ?"
    choices:
      - {text: "Préallouer les slices avec la bonne capacité", correct: true}
      - {text: "Remplacer toutes les valeurs par des pointeurs", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque requête", correct: false}
      - {text: "Convertir les `[]byte` en `string` avant de comparer", correct: false}
    answer: "Préallouer évite les réallocations successives d'`append` ; réutiliser des tampons (`sync.Pool`) aide aussi. Des pointeurs partout feraient plutôt échapper davantage, et `runtime.GC()` n'enlève aucune allocation."
  - key: qcm-taille
    format: multiple-choice
    question: Pourquoi `make([]byte, n)` avec un n connu seulement à l'exécution s'alloue-t-il souvent sur le tas ?
    choices:
      - text: Le compilateur ne connaît pas la taille à réserver sur la pile
        correct: true
      - text: Les slices vont toujours sur le tas
        correct: false
      - text: make alloue toujours sur le tas
        correct: false
      - text: Les octets ne peuvent pas être sur la pile
        correct: false
    answer: Avec une petite taille constante, le tableau peut rester sur la pile.
  - key: code-adresse
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func nouveau() *int {
      	x := 41
      	return &x
      }

      p := nouveau()
      *p++
      fmt.Println(*p)
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`41`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Une panic : `x` n'existe plus", correct: false}
    answer: "`42` : la variable survit au retour, le compilateur l'a placée sur le tas, et `*p++` l'incrémente."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nouveau() *int {\n\tx := 41\n\treturn &x\n}\n\nfunc main() {\n\tp := nouveau()\n\t*p++\n\tfmt.Println(*p)\n}\n"
      output: '42'
  - key: code-distincts
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func nouveau() *int {
      	x := 0
      	return &x
      }

      a, b := nouveau(), nouveau()
      *a = 1
      fmt.Println(a == b, *a, *b)
      ```
    choices:
      - {text: "`false 1 0`", correct: true}
      - {text: "`true 1 1`", correct: false}
      - {text: "`false 1 1`", correct: false}
      - {text: "`true 1 0`", correct: false}
    answer: "`false 1 0` : chaque appel crée sa propre variable, à une adresse différente ; modifier l'une ne touche pas l'autre."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nouveau() *int {\n\tx := 0\n\treturn &x\n}\n\nfunc main() {\n\ta, b := nouveau(), nouveau()\n\t*a = 1\n\tfmt.Println(a == b, *a, *b)\n}\n"
      output: false 1 0
  - key: code-closure
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func compteur() func() int {
      	n := 0
      	return func() int {
      		n++
      		return n
      	}
      }

      c := compteur()
      c()
      c()
      fmt.Println(c(), compteur()())
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`3 4`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`3 1` : la closure garde sa variable `n`, qui s'échappe vers le tas ; un nouveau compteur a sa propre variable et repart de zéro."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc compteur() func() int {\n\tn := 0\n\treturn func() int {\n\t\tn++\n\t\treturn n\n\t}\n}\n\nfunc main() {\n\tc := compteur()\n\tc()\n\tc()\n\tfmt.Println(c(), compteur()())\n}\n"
      output: 3 1
  - key: code-boucle
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var adresses []*int
      for i := range 3 {
      	adresses = append(adresses, &i)
      }
      for _, p := range adresses {
      	fmt.Print(*p, " ")
      }
      fmt.Println()
      ```
    choices:
      - {text: "`0 1 2`", correct: true}
      - {text: "`3 3 3`", correct: false}
      - {text: "`2 2 2`", correct: false}
      - {text: "`0 0 0`", correct: false}
    answer: "`0 1 2` : depuis Go 1.22, chaque tour a sa propre variable `i`, qui s'échappe vers le tas. Avec la variable partagée d'avant Go 1.22, une boucle classique aurait affiché `3 3 3`."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar adresses []*int\n\tfor i := range 3 {\n\t\tadresses = append(adresses, &i)\n\t}\n\tfor _, p := range adresses {\n\t\tfmt.Print(*p, \" \")\n\t}\n\tfmt.Println()\n}\n"
      output: 0 1 2
  - key: scenario-optimiser
    format: scenario
    question: Le GC consomme 30 % du CPU de ton service. Comment réduis-tu les allocations ?
    choices:
      - {text: "Un profil d'allocations, `-gcflags=-m`, puis préallouer et réutiliser, vérifié par `-benchmem`", correct: true}
      - {text: "Passer toutes les structs par pointeur, pour qu'aucune ne soit plus jamais copiée", correct: false}
      - {text: "Appeler `runtime.GC()` toutes les secondes, pour que chaque cycle coûte moins cher", correct: false}
      - {text: "Baisser GOGC à 20, pour que le tas reste petit et que le GC ait moins de travail", correct: false}
    answer: "Un profil d'allocations (`pprof -alloc_space`, `-alloc_objects`) trouve les fonctions qui allouent le plus, `-gcflags=-m` dit pourquoi. Remèdes : préallouer, éviter les conversions string/[]byte répétées, réutiliser des tampons, éviter fmt sur le chemin chaud ; chaque changement se vérifie avec `-benchmem`."
  - key: scenario-pointeurs
    format: scenario
    question: Un collègue passe toutes les structs par pointeur « pour éviter les copies ». Qu'en penses-tu ?
    choices:
      - {text: "Une petite struct se copie à bas prix, et un pointeur peut la faire échapper", correct: true}
      - {text: "Bonne pratique : un pointeur évite toute copie et ne coûte jamais rien de plus", correct: false}
      - {text: "Bonne pratique : une struct passée par valeur va toujours sur le tas", correct: false}
      - {text: "Mauvaise pratique : un pointeur vers une struct empêche le GC de la libérer", correct: false}
    answer: "Pour une petite struct, la copie est très bon marché et garde les données sur la pile, alors qu'un pointeur peut faire échapper la valeur vers le tas et donner du travail au GC. Je choisis selon le sens (modifier l'original, un verrou, une grande struct), et les benchmarks tranchent sur un chemin chaud."
  - key: scenario-java
    format: scenario
    question: "Quelle comparaison entre Go et Java, du point de vue de la pile et du tas, est juste ?"
    choices:
      - {text: "En Go, les structs sont des valeurs, et ce qui ne s'échappe pas va sur la pile", correct: true}
      - {text: "En Go comme en Java, tout objet créé va sur le tas ; seuls les entiers restent sur la pile", correct: false}
      - {text: "En Go, tout va sur la pile, et le GC ne s'occupe que des goroutines terminées", correct: false}
      - {text: "En Java, un `Point[]` est un bloc contigu ; en Go, un `[]Point` est un tableau de pointeurs", correct: false}
    answer: "En Java, les objets vont sur le tas (le JIT en remplace certains par des scalaires). En Go, les structs sont des valeurs : un `[]Point` est un bloc contigu, et le compilateur place sur la pile tout ce qui ne s'échappe pas. D'où moins d'allocations, ce qui compense un GC plus simple."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce que veut dire « moved to heap » dans la sortie de `-gcflags=-m`. Que réponds-tu ?"
    choices:
      - {text: "La variable n'a pas pu être prouvée locale : elle est allouée sur le tas", correct: true}
      - {text: "La variable a été déplacée sur le tas par le GC, pendant l'exécution", correct: false}
      - {text: "La variable dépasse la pile d'une goroutine, fixée à 2 Ko", correct: false}
      - {text: "La variable est globale, et rangée dans le segment de données", correct: false}
    answer: "Que l'analyse d'échappement n'a pas pu prouver que la variable reste locale : elle est allouée sur le tas, ce qui coûte une allocation et du travail pour le GC. Je cherche la raison (adresse renvoyée, closure, interface, taille inconnue) et ne corrige que si un profil montre que cela pèse."
  - key: definition-pile
    format: definition
    question: "Que désigne la « pile » (stack) d'une goroutine ?"
    choices:
      - {text: "Sa mémoire propre, libérée au retour des fonctions, sans le GC", correct: true}
      - {text: "La mémoire partagée dont les objets survivent aux fonctions", correct: false}
      - {text: "La file des goroutines prêtes à s'exécuter sur un P", correct: false}
      - {text: "La zone des variables globales, fixée à la compilation", correct: false}
    answer: "La mémoire propre à une goroutine, libérée au retour des fonctions, sans intervention du GC. La mémoire partagée qui survit aux fonctions, c'est le tas."
  - key: definition-tas
    format: definition
    question: "Que désigne le « tas » (heap) ?"
    choices:
      - {text: "La mémoire partagée dont les objets survivent aux fonctions, libérés par le GC", correct: true}
      - {text: "La mémoire propre à une goroutine, libérée au retour de chaque fonction", correct: false}
      - {text: "La zone des variables globales, fixée à la compilation et jamais libérée", correct: false}
      - {text: "La réserve de threads inactifs que le runtime garde pour les réutiliser", correct: false}
    answer: "La mémoire partagée dont les objets survivent aux fonctions qui les ont créés ; le ramasse-miettes les libère."
  - key: definition-echappement
    format: definition
    question: "Que désigne l'« échappement » (escape) d'une variable ?"
    choices:
      - {text: "Le fait qu'elle puisse servir après le retour de sa fonction, d'où le tas", correct: true}
      - {text: "Le fait qu'elle soit copiée dans une pile plus grande quand la pile déborde", correct: false}
      - {text: "Le fait qu'elle soit libérée par le GC avant la fin de sa fonction", correct: false}
      - {text: "Le fait qu'elle soit lue par une autre goroutine sans synchronisation", correct: false}
    answer: "Le fait qu'une variable puisse être utilisée après le retour de sa fonction, ce qui l'envoie sur le tas. La lecture sans synchronisation, c'est une data race."
