notion: pile-tas
cards:
  - key: retourner-adresse-variable-locale
    format: course
    question: Peut-on retourner l'adresse d'une variable locale ?
    answer: Oui, le compilateur la place dans le heap si elle s'échappe.
  - key: escape-analysis
    format: course
    question: C'est quoi l'escape analysis ?
    answer: L'analyse du compilateur qui décide si une variable va sur la pile ou dans le heap.
  - key: voir-decisions-echappement
    format: course
    question: Comment voir les décisions d'échappement ?
    answer: '`go build -gcflags=-m`.'
  - key: definition-escape-analysis
    format: definition
    question: escape analysis
    answer: Décision du compilateur entre pile et heap
