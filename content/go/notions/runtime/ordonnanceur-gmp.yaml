notion: ordonnanceur-gmp
cards:
  - key: contient-runtime
    format: course
    question: Que contient le runtime Go ?
    answer: Le scheduler de goroutines, l'allocateur, le GC, la gestion des piles, le netpoller et les profils.
  - key: modele-g-m-p
    format: course
    question: C'est quoi le modèle G-M-P ?
    answer: Goroutines (G) exécutées par des threads (M) qui détiennent un processeur logique (P) avec une file locale ; GOMAXPROCS P au total.
  - key: work-stealing
    format: course
    question: C'est quoi le work stealing ?
    answer: Un P inactif vole la moitié de la file d'un autre P.
  - key: definition-g-m-p
    format: definition
    question: G-M-P
    answer: 'Modèle du scheduler : goroutine, thread OS, processeur logique'
