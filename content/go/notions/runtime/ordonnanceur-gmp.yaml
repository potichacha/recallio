notion: ordonnanceur-gmp
lesson: |-
  Le **runtime** de Go, compilé dans chaque binaire, contient un **ordonnanceur** qui répartit les goroutines sur les
  threads du système. Il repose sur trois entités :
  - **G** (goroutine) : une fonction en cours, avec sa pile et son état ;
  - **M** (*machine*) : un thread du système d'exploitation, qui exécute du code ;
  - **P** (*processor*) : un contexte d'exécution, avec une **file locale** de goroutines prêtes. Il y a exactement
    **`GOMAXPROCS`** P.

  Pour exécuter du code Go, un M doit **tenir un P**. Au plus `GOMAXPROCS` goroutines tournent donc vraiment en même
  temps, quel que soit le nombre de goroutines ou de threads.

  ```
   P0 [G3 G7 G9]     P1 [G2]       file globale [G12 G15]
    |                 |
    M0 → exécute G1   M1 → exécute G4        M2 (bloqué dans un appel système, sans P)
  ```

  Les mécanismes principaux :
  - chaque P prend ses goroutines dans **sa file locale** (sans verrou), et regarde de temps en temps la **file
    globale** ;
  - un P à vide **vole** la moitié de la file d'un autre P (*work stealing*) : la charge s'équilibre toute seule ;
  - quand un M se bloque dans un **appel système**, son P est confié à un autre M, pour que les autres goroutines
    continuent ;
  - les entrées-sorties **réseau** ne bloquent pas de thread : le **netpoller** (epoll, kqueue, IOCP) réveille les
    goroutines quand leurs sockets sont prêtes.

  Résultat : créer une goroutine coûte quelques centaines de nanosecondes et quelques Ko, et l'on peut en avoir des
  centaines de milliers sur une poignée de threads.

  **En entretien** : « G les goroutines, M les threads, P les processeurs logiques (GOMAXPROCS) avec leurs files ; un M
  doit tenir un P ; vol de travail entre P ; netpoller pour le réseau ; P passé à un autre M pendant un appel système. »
cards:
  - key: contient-runtime
    format: course
    question: Que contient le runtime Go ?
    choices:
      - {text: "L'ordonnanceur, l'allocateur, le GC, les piles, le netpoller et les profils", correct: true}
      - {text: "Une machine virtuelle qui interprète le bytecode Go, avec un compilateur JIT", correct: false}
      - {text: "Le GC seulement : les goroutines sont ordonnancées par le système", correct: false}
      - {text: "Toute la bibliothèque standard, chargée dynamiquement au démarrage", correct: false}
    answer: "L'ordonnanceur de goroutines, l'allocateur, le GC, la gestion des piles, le netpoller et les profils, compilés dans chaque binaire. Il n'y a ni machine virtuelle ni JIT : le code est compilé en natif."
  - key: modele-g-m-p
    format: course
    question: "Qu'est-ce que le modèle G-M-P de l'ordonnanceur ?"
    choices:
      - {text: "Des goroutines (G) exécutées par des threads (M) qui tiennent un processeur logique (P)", correct: true}
      - {text: "Des goroutines (G) regroupées en modules (M), puis en processus (P) du système", correct: false}
      - {text: "Un thread (M) par goroutine (G), le P étant le processus qui les contient tous", correct: false}
      - {text: "Des goroutines (G) placées dans la mémoire (M) d'un processeur physique (P)", correct: false}
    answer: "Des goroutines (G) exécutées par des threads (M) qui détiennent un processeur logique (P) avec une file locale ; il y a GOMAXPROCS P au total."
  - key: work-stealing
    format: course
    question: "Qu'est-ce que le work stealing de l'ordonnanceur Go ?"
    choices:
      - {text: "Un P inactif vole la moitié de la file d'un autre P", correct: true}
      - {text: "Une goroutine prend le thread d'une autre bloquée", correct: false}
      - {text: "Le GC reprend du CPU aux goroutines qui allouent", correct: false}
      - {text: "Le noyau retire un cœur à un processus trop gourmand", correct: false}
    answer: "Un P dont la file est vide vole la moitié de la file d'un autre P : le travail se répartit sans file centrale. Le temps pris aux goroutines qui allouent, c'est le mark assist."
  - key: definition-g-m-p
    format: definition
    question: "Que désigne « G-M-P » ?"
    choices:
      - {text: "Le modèle de l'ordonnanceur : goroutine, thread du système, processeur logique", correct: true}
      - {text: "Le marquage du GC : objets gris, marqués, puis purgés à la fin du cycle", correct: false}
      - {text: "Les trois zones de la mémoire : globales, mémoire de pile, processus", correct: false}
      - {text: "Les états d'une goroutine : garée, en marche, puis préemptée", correct: false}
    answer: "Le modèle de l'ordonnanceur : G pour goroutine, M pour thread du système (machine), P pour processeur logique."
  - key: m-tient-p
    format: course
    question: Pourquoi au plus GOMAXPROCS goroutines exécutent-elles du code Go en même temps ?
    choices:
      - {text: "Un thread doit tenir un P pour exécuter du code Go, et il y a GOMAXPROCS P", correct: true}
      - {text: "Le runtime ne crée jamais plus de GOMAXPROCS threads du système", correct: false}
      - {text: "Chaque goroutine est attachée à un cœur précis dès sa création", correct: false}
      - {text: "Le noyau limite chaque processus à GOMAXPROCS threads actifs", correct: false}
    answer: "Parce qu'un thread (M) doit tenir un P pour exécuter du code Go, et qu'il y a exactement GOMAXPROCS P ; les autres threads sont bloqués dans des appels système ou inactifs."
  - key: vf-p
    format: true-false
    question: Il y a autant de P que la valeur de GOMAXPROCS.
    truth: true
    answer: Chaque P a sa file locale de goroutines prêtes.
  - key: vf-un-thread
    format: true-false
    question: Chaque goroutine a son propre thread du système.
    truth: false
    answer: Les goroutines sont multiplexées sur un petit nombre de threads (modèle M:N).
  - key: vf-vol
    format: true-false
    question: Un P qui n'a plus de goroutine à exécuter peut en prendre dans la file d'un autre P.
    truth: true
    answer: C'est le work stealing.
  - key: vf-reseau
    format: true-false
    question: Une goroutine qui attend une réponse réseau bloque un thread du système pendant toute l'attente.
    truth: false
    answer: Elle est garée, et le netpoller la réveille quand la socket est prête.
  - key: qcm-roles
    format: multiple-choice
    question: "Dans le modèle G-M-P, que représente P ?"
    choices:
      - {text: "Un processeur logique, avec sa file de goroutines", correct: true}
      - {text: "Un processus du système d'exploitation", correct: false}
      - {text: "Un cœur physique du processeur", correct: false}
      - {text: "Un thread du système d'exploitation", correct: false}
    answer: "P signifie processor, au sens de processeur logique : un contexte d'exécution avec sa file locale. G est la goroutine, M le thread du système."
  - key: qcm-syscall
    format: multiple-choice
    question: "Que devient le P d'une goroutine qui entre dans un appel système bloquant (lecture d'un fichier) ?"
    choices:
      - {text: "Il est confié à un autre thread, qui exécute d'autres goroutines", correct: true}
      - {text: "Il reste bloqué avec le thread jusqu'à la fin de l'appel", correct: false}
      - {text: "Il est détruit, et GOMAXPROCS baisse d'autant", correct: false}
      - {text: "Il attend, comme toutes les goroutines du programme", correct: false}
    answer: "Le thread reste bloqué dans l'appel, mais le P lui est retiré et confié à un autre thread. C'est pourquoi un programme Go peut avoir plus de threads que GOMAXPROCS."
  - key: qcm-files
    format: multiple-choice
    question: "Dans lesquelles de ces files l'ordonnanceur cherche-t-il la prochaine goroutine à exécuter sur un P ?"
    choices:
      - text: Dans la file locale du P
        correct: true
      - text: Dans la file globale, de temps en temps
        correct: true
      - text: Dans les files des autres P, par vol de travail
        correct: true
      - text: Dans la file du système d'exploitation
        correct: false
    answer: Le système ne voit que les threads, pas les goroutines.
  - key: qcm-cout
    format: multiple-choice
    question: Pourquoi les goroutines sont-elles bon marché ?
    choices:
      - {text: "Une petite pile qui grandit, et des changements faits sans le noyau", correct: true}
      - {text: "Elles n'ont pas de pile : leurs variables vont toutes sur le tas", correct: false}
      - {text: "Elles s'exécutent toutes sur un seul thread, sans changement de contexte", correct: false}
      - {text: "Le noyau les crée par lots, plus vite que des threads un par un", correct: false}
    answer: "Une petite pile qui grandit à la demande, et des changements de goroutine faits par le runtime, sans passer par le noyau. Un thread du système a une pile de l'ordre du Mo et coûte un appel noyau à chaque changement."
  - key: scenario-expliquer
    format: scenario
    question: "En entretien, on te demande comment Go exécute 100 000 goroutines sur une machine à 8 cœurs. Que réponds-tu ?"
    choices:
      - {text: "8 P avec leurs files, quelques threads ; les bloquées sont garées, 8 tournent à la fois", correct: true}
      - {text: "100 000 threads du système, que le noyau répartit à tour de rôle sur les 8 cœurs", correct: false}
      - {text: "8 threads, chacun exécutant ses 12 500 goroutines jusqu'au bout, l'une après l'autre", correct: false}
      - {text: "Une seule boucle d'événements, comme Node.js, qui exécute les goroutines tour à tour", correct: false}
    answer: "Le runtime crée 8 P (GOMAXPROCS), chacun avec une file de goroutines prêtes, et quelques threads qui les tiennent. Les goroutines bloquées sont garées et ne coûtent que leur pile ; les P à vide volent du travail, le netpoller réveille les goroutines réseau, et seules 8 goroutines tournent à un instant donné."
  - key: scenario-threads
    format: scenario
    question: Ton service a GOMAXPROCS=4 mais le système montre 60 threads. Est-ce normal ?
    choices:
      - {text: "Oui : GOMAXPROCS borne les threads qui exécutent du Go, pas les bloqués ni les inactifs", correct: true}
      - {text: "Non : le runtime ne dépasse jamais GOMAXPROCS threads, c'est forcément une fuite", correct: false}
      - {text: "Non : c'est le signe d'une fuite de goroutines, chacune ayant son propre thread", correct: false}
      - {text: "Oui : le runtime crée 15 threads par P, réservés au marquage du ramasse-miettes", correct: false}
    answer: "Oui, dans une certaine mesure : GOMAXPROCS limite les threads qui exécutent du code Go, pas le nombre total. Des threads restent bloqués en appel système ou en code C, d'autres sont gardés inactifs pour être réutilisés. Si leur nombre grimpe sans cesse, je cherche des appels bloquants en masse avec un profil `threadcreate` et une trace."
  - key: scenario-trace
    format: scenario
    question: Comment observes-tu le comportement de l'ordonnanceur dans un programme ?
    choices:
      - {text: "Avec `go tool trace` sur une trace capturée, ou `GODEBUG=schedtrace=1000`", correct: true}
      - {text: "Avec `go build -gcflags=-m`, qui montre sur quel P chaque goroutine tournera", correct: false}
      - {text: "Avec un profil CPU seul, qui montre chaque P et ses goroutines dans le temps", correct: false}
      - {text: "Avec `go vet -sched`, qui analyse l'ordonnancement dès la compilation", correct: false}
    answer: "Avec `go tool trace` sur une trace capturée (`runtime/trace`, `-trace` dans les tests, `/debug/pprof/trace`) : chaque P, ses goroutines, les blocages, les appels système et le GC. `GODEBUG=schedtrace=1000` donne un aperçu chaque seconde, et le flight recorder (Go 1.25) garde les dernières secondes."
  - key: scenario-java
    format: scenario
    question: "Quelle comparaison entre les goroutines et les threads virtuels de Java 21 est juste ?"
    choices:
      - {text: "Deux fils légers sur peu de threads porteurs ; Go le fait depuis le début, préemption comprise", correct: true}
      - {text: "Les threads virtuels sont des threads du système, les goroutines des fils du runtime", correct: false}
      - {text: "Les goroutines ont une pile fixe, les threads virtuels une pile qui grandit à la demande", correct: false}
      - {text: "Les goroutines sont purement coopératives, les threads virtuels préemptés par le noyau", correct: false}
    answer: "Les deux sont des fils légers multiplexés sur quelques threads porteurs, avec des piles qui grandissent et des entrées-sorties qui garent le fil. Go le fait depuis le début, avec une préemption asynchrone ; en Java, un bloc `synchronized` pouvait épingler le thread porteur (amélioré en Java 24)."
  - key: definition-work-stealing
    format: definition
    question: "Que désigne le « work stealing » ?"
    choices:
      - {text: "Le vol de goroutines prêtes dans la file d'un autre P, par un P inoccupé", correct: true}
      - {text: "La reprise du P d'un thread bloqué en appel système par un autre thread", correct: false}
      - {text: "La part de marquage imposée aux goroutines qui allouent pendant un cycle", correct: false}
      - {text: "L'interruption par signal d'une goroutine qui tourne depuis trop longtemps", correct: false}
    answer: "Le vol de goroutines prêtes dans la file d'un autre P par un P inoccupé. La reprise du P d'un thread bloqué est un autre mécanisme, celui des appels système."
  - key: definition-netpoller
    format: definition
    question: "Que désigne le « netpoller » ?"
    choices:
      - {text: "Le composant qui surveille les sockets (epoll, kqueue, IOCP) et réveille les goroutines", correct: true}
      - {text: "Le thread de fond qui repère les goroutines à préempter, toutes les 10 ms environ", correct: false}
      - {text: "Le pool de connexions HTTP réutilisées par le client du package `net/http`", correct: false}
      - {text: "Le profil pprof qui compte les goroutines bloquées en attente du réseau", correct: false}
    answer: "Le composant du runtime qui surveille les sockets (epoll, kqueue, IOCP) et réveille les goroutines quand elles sont prêtes. Le thread qui repère les goroutines à préempter, c'est sysmon."
  - key: definition-p
    format: definition
    question: "Que désigne « P » (processor) dans l'ordonnanceur ?"
    choices:
      - {text: "Un contexte d'exécution avec sa file de goroutines ; il y en a GOMAXPROCS", correct: true}
      - {text: "Un processus du système, qui contient les threads du programme", correct: false}
      - {text: "Un cœur physique du processeur, réservé au programme Go", correct: false}
      - {text: "Un thread du système qui exécute le code des goroutines", correct: false}
    answer: "Un contexte d'exécution de l'ordonnanceur, avec une file de goroutines ; il y en a GOMAXPROCS. Le thread qui l'exécute, c'est M."
