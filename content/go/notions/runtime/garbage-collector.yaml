notion: garbage-collector
cards:
  - key: fonctionne-gc
    format: course
    question: Comment fonctionne le GC de Go ?
    answer: Mark and sweep tricolore, concurrent, non générationnel, non compactant, avec barrière d'écriture.
  - key: gc-provoque-longues-pauses
    format: course
    question: Le GC de Go provoque-t-il de longues pauses ?
    answer: Non, les pauses stop-the-world sont très courtes ; le coût principal est le CPU de marquage et le mark assist.
  - key: mark-assist
    format: course
    question: C'est quoi le mark assist ?
    answer: Une goroutine qui alloue pendant un cycle aide au marquage, ce qui la ralentit.
  - key: green-tea
    format: course
    question: C'est quoi Green Tea ?
    answer: Le nouvel algorithme de marquage par pages, par défaut depuis Go 1.26, qui réduit le surcoût du GC.
  - key: gc-generationnel
    format: course
    question: Pourquoi le GC de Go n'est-il pas générationnel ?
    answer: L'escape analysis place beaucoup d'objets courts sur la pile, et le GC concurrent garde des pauses faibles sans la complexité générationnelle.
  - key: observer-gc
    format: course
    question: Comment observer le GC ?
    answer: GODEBUG=gctrace=1, runtime/metrics, profils pprof, go tool trace.
  - key: setfinalizer-vs-addcleanup
    format: course
    question: SetFinalizer vs AddCleanup ?
    answer: AddCleanup (Go 1.24) remplace SetFinalizer avec moins de pièges.
  - key: sert-package-weak
    format: course
    question: À quoi sert le package weak ?
    answer: À créer des pointeurs faibles qui n'empêchent pas la collecte (Go 1.24).
  - key: gc
    format: course
    question: Go a-t-il un GC ?
    answer: Oui, concurrent et à faible latence.
  - key: definition-gc
    format: definition
    question: GC
    answer: Garbage collector concurrent, tricolore, non générationnel
  - key: definition-green-tea
    format: definition
    question: Green Tea
    answer: Algorithme de marquage du GC, par défaut depuis Go 1.26
  - key: definition-mark-assist
    format: definition
    question: mark assist
    answer: Contribution au marquage imposée aux goroutines qui allouent
