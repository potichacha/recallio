notion: garbage-collector
lesson: |-
  Le **ramasse-miettes** (GC) de Go libère la mémoire du tas que plus rien ne référence. Ses choix de conception
  privilégient des **pauses très courtes** plutôt que le débit maximal :

  - **concurrent** : le marquage tourne **en même temps** que le programme, sur environ 25 % des P ; seules deux
    pauses brèves (*stop-the-world*), en général bien en dessous de la milliseconde, encadrent chaque cycle ;
  - **marquage tricolore** : les objets sont blancs (non vus), gris (vus, à explorer) ou noirs (vus et explorés) ; à
    la fin, les blancs sont inaccessibles et libérés. Une **barrière d'écriture** active pendant le marquage
    empêche le programme de cacher un objet au GC ;
  - **non générationnel** et **non compactant** : il ne déplace pas les objets et ne distingue pas les jeunes des
    vieux. L'analyse d'échappement garde déjà beaucoup d'objets éphémères sur la pile, et l'allocateur par classes de
    taille limite la fragmentation.

  Le **mark assist** : si une goroutine alloue plus vite que le GC ne marque, elle doit **aider** au marquage avant de
  pouvoir allouer. C'est ce qui ralentit les requêtes quand le GC est sous pression.

  Un cycle démarre quand le tas atteint une **cible** fixée par `GOGC` (par défaut, le double du tas vivant après le
  cycle précédent) ou par `GOMEMLIMIT`.

  Pour l'observer : `GODEBUG=gctrace=1` (une ligne par cycle), `runtime/metrics`, le profil d'allocations, et `go tool
  trace` qui montre les cycles et les assists. Le nouveau GC **Green Tea**, qui parcourt la mémoire par pages pour
  mieux utiliser les caches du processeur, est apparu en expérimentation dans Go 1.25.

  **En entretien** : « Concurrent, tricolore avec barrière d'écriture, sans génération ni compactage ; pauses
  sub-milliseconde ; le mark assist fait payer les goroutines qui allouent trop ; on le règle par GOGC et GOMEMLIMIT. »
cards:
  - key: fonctionne-gc
    format: course
    question: Comment fonctionne le GC de Go ?
    choices:
      - {text: "Marquage-balayage tricolore, concurrent, non générationnel et non compactant", correct: true}
      - {text: "Générationnel et compactant, avec une jeune génération copiée, comme G1", correct: false}
      - {text: "Par comptage de références, chaque objet étant libéré dès son dernier usage", correct: false}
      - {text: "Stop-the-world complet : tout s'arrête pendant le marquage puis le balayage", correct: false}
    answer: "Un mark and sweep tricolore, concurrent, non générationnel et non compactant, avec une barrière d'écriture. Il marque pendant que le programme tourne, avec seulement de courtes pauses."
  - key: gc-provoque-longues-pauses
    format: course
    question: Le GC de Go provoque-t-il de longues pauses ?
    choices:
      - {text: "Non : les pauses sont très courtes, le coût est surtout le CPU du marquage", correct: true}
      - {text: "Oui : il arrête tout le programme le temps de marquer l'ensemble du tas", correct: false}
      - {text: "Oui : ses pauses grandissent avec le tas, faute de jeune génération", correct: false}
      - {text: "Non : il ne fait jamais aucune pause, ni au début ni à la fin du cycle", correct: false}
    answer: "Non, les pauses stop-the-world sont très courtes ; le coût principal est le CPU consacré au marquage, et le mark assist qui ralentit les goroutines qui allouent."
  - key: mark-assist
    format: course
    question: "Qu'est-ce que le mark assist du GC de Go ?"
    choices:
      - {text: "Une goroutine qui alloue pendant un cycle aide au marquage, et ralentit", correct: true}
      - {text: "Un thread dédié du runtime, qui marque le tas en arrière-plan", correct: false}
      - {text: "Une option de compilation qui marque les objets dès leur allocation", correct: false}
      - {text: "L'aide du noyau, qui signale au GC les pages mémoire inutilisées", correct: false}
    answer: "Une goroutine qui alloue pendant un cycle doit aider au marquage, au prorata de ce qu'elle alloue : elle ralentit, et la latence s'en ressent. Cela empêche le programme d'allouer plus vite que le GC ne marque."
  - key: green-tea
    format: course
    question: "Qu'est-ce que Green Tea, dans le runtime Go ?"
    choices:
      - {text: "L'algorithme de marquage par pages du GC, par défaut depuis Go 1.26", correct: true}
      - {text: "Le nouvel ordonnanceur de goroutines, par défaut depuis Go 1.26", correct: false}
      - {text: "Un GC générationnel optionnel, activé par une variable `GOEXPERIMENT`", correct: false}
      - {text: "Le nouvel allocateur des piles de goroutines, introduit en Go 1.25", correct: false}
    answer: "Le nouvel algorithme de marquage du GC, qui parcourt la mémoire par pages plutôt qu'objet par objet ; il est le défaut depuis Go 1.26 et réduit le surcoût du GC. Le GC reste non générationnel."
  - key: gc-generationnel
    format: course
    question: Pourquoi le GC de Go n'est-il pas générationnel ?
    choices:
      - {text: "L'analyse d'échappement garde déjà beaucoup d'objets courts sur la pile", correct: true}
      - {text: "Un GC générationnel est impossible dans un langage qui a des pointeurs", correct: false}
      - {text: "Il l'est depuis Go 1.26, Green Tea ayant ajouté une jeune génération", correct: false}
      - {text: "Les objets Go vivent tous longtemps : une jeune génération resterait vide", correct: false}
    answer: "L'escape analysis place beaucoup d'objets courts sur la pile, et le GC concurrent garde des pauses faibles sans la complexité générationnelle. Green Tea change le marquage, pas ce principe."
  - key: observer-gc
    format: course
    question: "Comment observer le GC d'un programme Go ?"
    choices:
      - {text: "`GODEBUG=gctrace=1`, `runtime/metrics`, les profils pprof et `go tool trace`", correct: true}
      - {text: "`go vet -gc`, qui signale à la compilation les allocations coûteuses", correct: false}
      - {text: "`-verbose:gc` et `jstat`, les options de suivi de la JVM", correct: false}
      - {text: "Les seuls journaux du noyau, le runtime Go n'exposant rien du GC", correct: false}
    answer: "`GODEBUG=gctrace=1` affiche une ligne par cycle ; `runtime/metrics`, les profils pprof et `go tool trace` donnent le détail. `-verbose:gc` et `jstat` sont ceux de la JVM."
  - key: setfinalizer-vs-addcleanup
    format: course
    question: "Que préférer entre `runtime.SetFinalizer` et `runtime.AddCleanup` ?"
    choices:
      - {text: "`AddCleanup` (Go 1.24), qui remplace `SetFinalizer` avec moins de pièges", correct: true}
      - {text: "`SetFinalizer`, dont `AddCleanup` n'est qu'un alias déjà déprécié", correct: false}
      - {text: "Aucun : Go ne sait pas exécuter de code à la collecte d'un objet", correct: false}
      - {text: "`SetFinalizer`, seul garanti de s'exécuter avant la fin du programme", correct: false}
    answer: "`runtime.AddCleanup` (Go 1.24) : plusieurs nettoyages par objet, pas de résurrection de l'objet, pas de fuite sur les cycles. Aucun des deux n'est garanti de s'exécuter : ce sont des filets de sécurité, pas un `Close`."
  - key: sert-package-weak
    format: course
    question: "À quoi sert le package `weak` (Go 1.24) ?"
    choices:
      - {text: "À créer des pointeurs faibles, qui n'empêchent pas la collecte", correct: true}
      - {text: "À créer des maps dont les valeurs expirent après un délai", correct: false}
      - {text: "À baisser la priorité d'une goroutine pour l'ordonnanceur", correct: false}
      - {text: "À désactiver la barrière d'écriture sur certains pointeurs", correct: false}
    answer: "À créer des pointeurs faibles (`weak.Pointer[T]`) qui n'empêchent pas la collecte de l'objet pointé : utile pour un cache ou une table d'internement qui ne doit pas retenir ses objets."
  - key: gc
    format: course
    question: "Go a-t-il un ramasse-miettes ?"
    choices:
      - {text: "Oui, concurrent et à faible latence", correct: true}
      - {text: "Non : la mémoire se libère avec `free`", correct: false}
      - {text: "Non : il compte les références, comme Swift", correct: false}
      - {text: "Oui, mais il faut l'appeler avec `runtime.GC()`", correct: false}
    answer: "Oui : un GC concurrent et à faible latence, qui se déclenche seul. `runtime.GC()` force un cycle, ce qu'on ne fait presque jamais."
  - key: definition-gc
    format: definition
    question: "Que désigne le « GC » du runtime Go ?"
    choices:
      - {text: "Le ramasse-miettes concurrent, tricolore et non générationnel", correct: true}
      - {text: "L'ordonnanceur qui répartit les goroutines sur les threads", correct: false}
      - {text: "L'analyse qui place les variables sur la pile ou sur le tas", correct: false}
      - {text: "Le comptage de références qui libère un objet au dernier usage", correct: false}
    answer: "Le garbage collector : concurrent, à marquage tricolore, non générationnel. Le placement pile ou tas, c'est l'analyse d'échappement du compilateur."
  - key: definition-green-tea
    format: definition
    question: "Que désigne le terme « Green Tea » ?"
    choices:
      - {text: "L'algorithme de marquage du GC, par pages, par défaut depuis Go 1.26", correct: true}
      - {text: "Le mark assist imposé aux goroutines qui allouent pendant un cycle", correct: false}
      - {text: "Le marquage tricolore qui classe les objets en blancs, gris et noirs", correct: false}
      - {text: "La limite mémoire souple du runtime, réglée par `GOMEMLIMIT`", correct: false}
    answer: "L'algorithme de marquage du GC, qui travaille par pages mémoire ; il est le défaut depuis Go 1.26."
  - key: definition-mark-assist
    format: definition
    question: "Que désigne le « mark assist » ?"
    choices:
      - {text: "La part de marquage imposée aux goroutines qui allouent pendant un cycle", correct: true}
      - {text: "Le thread de fond qui balaie les pages libérées après le marquage", correct: false}
      - {text: "La barrière d'écriture qui signale au GC les pointeurs modifiés", correct: false}
      - {text: "Le vol de goroutines prêtes dans la file d'un autre P inoccupé", correct: false}
    answer: "La contribution au marquage imposée aux goroutines qui allouent pendant un cycle : elles ralentissent, ce qui se voit sur les latences."
  - key: vf-concurrent
    format: true-false
    question: Le GC de Go marque les objets pendant que le programme continue de tourner.
    truth: true
    answer: Seules deux courtes pauses encadrent le cycle.
  - key: vf-compacte
    format: true-false
    question: Le GC de Go déplace les objets pour compacter le tas.
    truth: false
    answer: Il ne déplace pas les objets ; les pointeurs restent stables.
  - key: vf-generationnel
    format: true-false
    question: Le GC de Go est générationnel, comme celui de la JVM.
    truth: false
    answer: Il ne distingue pas les jeunes objets des vieux.
  - key: vf-assist
    format: true-false
    question: Une goroutine qui alloue beaucoup pendant un cycle peut être obligée d'aider au marquage.
    truth: true
    answer: C'est le mark assist, qui ajoute de la latence à cette goroutine.
  - key: qcm-caracteristiques
    format: multiple-choice
    question: "Lesquelles de ces caractéristiques décrivent le GC de Go ?"
    choices:
      - text: Concurrent
        correct: true
      - text: Marquage tricolore avec barrière d'écriture
        correct: true
      - text: Non compactant
        correct: true
      - text: Comptage de références
        correct: false
    answer: Le comptage de références ne libère pas les cycles ; Go utilise un traçage.
  - key: qcm-declencheur
    format: multiple-choice
    question: "Lesquels de ces événements déclenchent un cycle du GC ?"
    choices:
      - text: Le tas atteint la cible fixée par GOGC
        correct: true
      - text: Le tas approche la limite de GOMEMLIMIT
        correct: true
      - text: Un appel explicite à runtime.GC()
        correct: true
      - text: Chaque appel de fonction
        correct: false
    answer: Un cycle forcé tourne aussi au moins toutes les deux minutes.
  - key: qcm-observer
    format: multiple-choice
    question: "Quel réglage affiche une ligne par cycle du GC, avec les tailles du tas et les durées ?"
    choices:
      - {text: "`GODEBUG=gctrace=1`", correct: true}
      - {text: "`go build -gcflags=-m`", correct: false}
      - {text: "`go vet`", correct: false}
      - {text: "`GOMAXPROCS=1`", correct: false}
    answer: "`gctrace=1` affiche une ligne par cycle, avec les tailles et les durées ; `runtime/metrics` et `go tool trace` observent aussi le GC. `-gcflags=-m` montre l'échappement, pas les cycles."
  - key: qcm-reduire
    format: multiple-choice
    question: "Laquelle de ces actions augmente le travail du GC au lieu de le réduire ?"
    choices:
      - {text: "Appeler `runtime.GC()` à chaque requête", correct: true}
      - {text: "Allouer moins sur les chemins chauds", correct: false}
      - {text: "Réduire les pointeurs des grosses structures vivantes", correct: false}
      - {text: "Augmenter GOGC si la mémoire le permet", correct: false}
    answer: "Forcer un cycle à chaque requête multiplie le travail et bloque l'appelant. Allouer moins, réduire les pointeurs à parcourir et augmenter GOGC le réduisent."
  - key: scenario-latence
    format: scenario
    question: Les latences p99 de ton service montent pendant les pics, et la trace montre beaucoup de mark assist. Que fais-tu ?
    choices:
      - {text: "Réduire les allocations, puis donner de la marge au GC : GOGC plus haut ou GOMEMLIMIT", correct: true}
      - {text: "Appeler `runtime.GC()` toutes les secondes, pour faire des cycles plus petits", correct: false}
      - {text: "Baisser GOGC à 25, pour que chaque cycle ait moins de tas à marquer", correct: false}
      - {text: "Augmenter GOMAXPROCS au-delà des cœurs, pour plus de threads de marquage", correct: false}
    answer: "Le mark assist signifie que les goroutines allouent plus vite que le GC ne marque. Je réduis d'abord les allocations (profil, préallocation, tampons réutilisés), puis j'espace les cycles avec un GOGC plus élevé ou un GOMEMLIMIT proche de la mémoire disponible, et je vérifie avec gctrace et les p99."
  - key: scenario-java
    format: scenario
    question: "Quelle comparaison entre le GC de Go et ceux de la JVM est juste ?"
    choices:
      - {text: "Go : un seul GC concurrent, non compactant, deux réglages ; JVM : plusieurs GC générationnels", correct: true}
      - {text: "Go : plusieurs GC au choix, comme la JVM, mais tous générationnels et compactants", correct: false}
      - {text: "Go : un GC par comptage de références ; JVM : des GC par traçage, comme G1 ou ZGC", correct: false}
      - {text: "Go : aucun réglage possible ; JVM : des dizaines d'options pour chaque collecteur", correct: false}
    answer: "La JVM propose plusieurs GC générationnels et compactants (G1, ZGC, Shenandoah, Parallel), très réglables. Go a un seul GC, concurrent et non compactant, avec deux réglages (GOGC, GOMEMLIMIT) ; il fait moins de travail grâce aux valeurs et à l'analyse d'échappement."
  - key: scenario-gros-tas
    format: scenario
    question: Ton service garde un cache de 20 Go de petits objets avec des pointeurs, et le GC coûte cher. Que proposes-tu ?
    choices:
      - {text: "Réduire les pointeurs : grands slices de valeurs, clés entières, ou un cache sérialisé", correct: true}
      - {text: "Passer les entrées par pointeur, pour ne plus copier les petits objets du cache", correct: false}
      - {text: "Appeler `runtime.GC()` plus souvent, pour marquer moins d'objets à chaque fois", correct: false}
      - {text: "Baisser GOGC, pour que les 20 Go du tas vivant soient marqués plus souvent", correct: false}
    answer: "Le marquage parcourt tous les pointeurs du tas vivant : des millions de petits objets reliés coûtent cher à chaque cycle. Je réduis les pointeurs (grands slices de valeurs sans pointeur, clés entières, cache qui sérialise dans des tampons comme bigcache), et GOMEMLIMIT avec GOGC espacent les cycles."
  - key: scenario-finaliseurs
    format: scenario
    question: Peut-on compter sur le GC pour fermer des fichiers ou des connexions ?
    choices:
      - {text: "Non : on ferme explicitement, avec `defer f.Close()` ; `AddCleanup` n'est qu'un filet", correct: true}
      - {text: "Oui : `runtime.AddCleanup` garantit la fermeture dès que l'objet est inaccessible", correct: false}
      - {text: "Oui : le GC passe au moins toutes les deux minutes, la fermeture arrive donc vite", correct: false}
      - {text: "Non, sauf avec `SetFinalizer`, garanti de s'exécuter avant la fin du programme", correct: false}
    answer: "Non : on ne sait pas quand un objet sera ramassé, ni même s'il le sera avant la fin du programme. Les ressources se libèrent explicitement (`defer f.Close()`) ; `runtime.AddCleanup` sert seulement de filet de sécurité, par exemple pour journaliser une ressource oubliée."
  - key: definition-tricolore
    format: definition
    question: "Que désigne le « marquage tricolore » ?"
    choices:
      - {text: "Le classement des objets en blancs, gris et noirs, pour trouver les accessibles", correct: true}
      - {text: "Le classement des objets en trois générations, de la plus jeune à la plus vieille", correct: false}
      - {text: "Le découpage de la mémoire en trois zones : pile, tas et données statiques", correct: false}
      - {text: "Le marquage en trois passes successives, chacune arrêtant tout le programme", correct: false}
    answer: "L'algorithme qui classe les objets en blancs (non vus), gris (vus, à explorer) et noirs (explorés) pour trouver ceux qui restent accessibles ; les blancs restants sont libérés."
