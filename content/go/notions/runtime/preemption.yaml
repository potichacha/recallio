notion: preemption
cards:
  - key: passe-quand-goroutine-appel-systeme-bloquant
    format: course
    question: Que se passe-t-il quand une goroutine fait un appel système bloquant ?
    answer: Son thread libère le P, qu'un autre thread reprend pour exécuter les autres goroutines.
  - key: gere-i-o-reseau-sans-bloquer
    format: course
    question: Comment Go gère-t-il les I/O réseau sans bloquer de threads ?
    answer: Le netpoller (epoll/kqueue/IOCP) gare la goroutine et la réveille quand la socket est prête.
  - key: depuis-quand-preemption-asynchrone
    format: course
    question: Depuis quand la préemption est-elle asynchrone ?
    answer: Go 1.14.
  - key: eviter-cgo
    format: course
    question: Pourquoi éviter cgo ?
    answer: Appels coûteux, compilation croisée compliquée, binaire non statique, outillage dégradé.
  - key: terme-cgo
    format: course
    question: Que désigne « cgo » ?
    answer: Mécanisme d'appel de code C depuis Go
  - key: terme-netpoller
    format: course
    question: Que désigne « netpoller » ?
    answer: Composant du runtime qui gère les I/O réseau non bloquantes
