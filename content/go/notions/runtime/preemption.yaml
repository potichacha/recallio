notion: preemption
lesson: |-
  Une goroutine ne garde pas un P indéfiniment : l'ordonnanceur la **préempte** pour laisser tourner les autres.

  **Préemption coopérative** (depuis toujours) : une goroutine cède sa place aux points de contrôle insérés par le
  compilateur, en pratique à l'**entrée des fonctions**, et quand elle bloque (channel, verrou, réseau, `Gosched`).

  **Préemption asynchrone** (depuis **Go 1.14**) : le moniteur du runtime (`sysmon`) repère une goroutine qui tourne
  depuis plus de **10 ms** et lui envoie un **signal** (`SIGURG` sous Unix) qui l'interrompt n'importe où. Avant 1.14,
  une boucle serrée sans appel de fonction pouvait bloquer un P, et même empêcher le GC de démarrer :

  ```go
  for { i++ } // avant Go 1.14 : jamais préemptée ; depuis : préemptée au bout de 10 ms environ
  ```

  **Appels système** : une goroutine qui entre dans un appel système bloquant garde son thread ; si l'appel dure,
  `sysmon` détache son **P** et le donne à un autre thread. Les entrées-sorties **réseau** passent par le
  **netpoller** et ne bloquent pas de thread du tout ; les **fichiers** ordinaires, eux, bloquent un thread.

  **cgo** : un appel vers du C se comporte comme un appel système long (le thread est pris) et coûte bien plus qu'un
  appel Go ; du code C ne peut pas être préempté par le runtime.

  `runtime.Gosched()` cède volontairement la place ; il est rarement utile dans du code normal.

  **En entretien** : « Coopérative aux appels de fonction, asynchrone par signal depuis Go 1.14 après 10 ms ; un appel
  système long cède son P ; le réseau passe par le netpoller ; cgo bloque un thread. »
cards:
  - key: passe-quand-goroutine-appel-systeme-bloquant
    format: course
    question: Que se passe-t-il quand une goroutine fait un appel système bloquant ?
    choices:
      - {text: "Son thread libère le P, qu'un autre thread reprend pour les autres goroutines", correct: true}
      - {text: "Toutes les goroutines du programme attendent la fin de l'appel système", correct: false}
      - {text: "Le runtime interrompt l'appel et le relance plus tard, sans bloquer", correct: false}
      - {text: "La goroutine est détruite, et une autre relance l'appel système", correct: false}
    answer: "Son thread reste bloqué dans l'appel, mais libère le P, qu'un autre thread reprend pour exécuter les autres goroutines."
  - key: gere-i-o-reseau-sans-bloquer
    format: course
    question: "Comment Go gère-t-il les entrées-sorties réseau sans bloquer de threads ?"
    choices:
      - {text: "Le netpoller (epoll, kqueue, IOCP) gare la goroutine et la réveille à temps", correct: true}
      - {text: "Chaque connexion a son thread dédié, que le noyau endort pendant l'attente", correct: false}
      - {text: "Le code doit passer par des callbacks, comme en Node.js, pour ne pas bloquer", correct: false}
      - {text: "Les lectures tournent en attente active, sur un thread réservé au réseau", correct: false}
    answer: "Le netpoller (epoll, kqueue, IOCP) gare la goroutine et la réveille quand la socket est prête. Le code reste écrit en style bloquant, sans callback."
  - key: depuis-quand-preemption-asynchrone
    format: course
    question: "Depuis quelle version la préemption des goroutines est-elle asynchrone ?"
    choices:
      - {text: "Go 1.14, par un signal envoyé au thread", correct: true}
      - {text: "Go 1.5, avec le GC concurrent", correct: false}
      - {text: "Go 1.18, avec les generics", correct: false}
      - {text: "Go 1.0 : depuis toujours", correct: false}
    answer: "Go 1.14 : le runtime interrompt une goroutine n'importe où par un signal. Avant, la préemption n'avait lieu qu'aux appels de fonction."
  - key: eviter-cgo
    format: course
    question: "Pourquoi éviter cgo quand c'est possible ?"
    choices:
      - {text: "Appels coûteux, compilation croisée compliquée, binaire non statique", correct: true}
      - {text: "cgo désactive le ramasse-miettes pendant toute l'exécution", correct: false}
      - {text: "cgo interdit de lancer des goroutines dans le programme", correct: false}
      - {text: "cgo n'existe que sous Linux, ni sous Windows ni sous macOS", correct: false}
    answer: "Appels coûteux, compilation croisée compliquée, binaire non statique, outillage (profils, traces) dégradé. Le GC et les goroutines, eux, continuent de fonctionner."
  - key: terme-cgo
    format: course
    question: "Que désigne « cgo » ?"
    choices:
      - {text: "Le mécanisme qui permet d'appeler du code C depuis Go", correct: true}
      - {text: "Un compilateur alternatif de Go, construit sur GCC", correct: false}
      - {text: "L'ancien compilateur Go, écrit en C, avant Go 1.5", correct: false}
      - {text: "La compilation de Go vers du code C portable", correct: false}
    answer: "Le mécanisme d'appel de code C depuis Go (`import \"C\"`). Le compilateur basé sur GCC, c'est gccgo."
  - key: terme-netpoller
    format: course
    question: "Quel rôle joue le netpoller dans le runtime Go ?"
    choices:
      - {text: "Il gère les entrées-sorties réseau non bloquantes et réveille les goroutines", correct: true}
      - {text: "Il repère les goroutines qui tournent trop longtemps, pour les préempter", correct: false}
      - {text: "Il répartit les connexions entrantes entre plusieurs processus du système", correct: false}
      - {text: "Il garde un pool de connexions ouvertes pour le client HTTP standard", correct: false}
    answer: "Le composant du runtime qui gère les entrées-sorties réseau non bloquantes : il gare les goroutines en attente et les réveille quand leur socket est prête. La préemption, c'est le rôle de sysmon."
  - key: vf-1-14
    format: true-false
    question: Depuis Go 1.14, une boucle serrée sans appel de fonction peut être préemptée.
    truth: true
    answer: Par un signal envoyé par le runtime.
  - key: vf-fichiers
    format: true-false
    question: La lecture d'un fichier ordinaire passe par le netpoller et ne bloque pas de thread.
    truth: false
    answer: Les fichiers bloquent un thread ; seul le réseau (et quelques descripteurs) passe par le netpoller.
  - key: vf-cgo
    format: true-false
    question: Le runtime peut préempter du code C appelé par cgo.
    truth: false
    answer: Le thread est pris par le code C jusqu'à son retour.
  - key: vf-gosched
    format: true-false
    question: '`runtime.Gosched()` cède le processeur à d''autres goroutines prêtes.'
    truth: true
    answer: La goroutine reste prête et reprendra plus tard.
  - key: qcm-points
    format: multiple-choice
    question: "Dans lesquels de ces cas une goroutine cède-t-elle sa place, même sans préemption asynchrone ?"
    choices:
      - text: Quand elle bloque sur un channel ou un verrou
        correct: true
      - text: À l'entrée d'une fonction, quand le runtime le demande
        correct: true
      - text: Quand elle attend le réseau
        correct: true
      - text: À chaque instruction d'addition
        correct: false
    answer: Les points de contrôle sont surtout à l'entrée des fonctions.
  - key: qcm-signal
    format: multiple-choice
    question: "Comment le runtime interrompt-il, sous Unix, une goroutine qui tourne depuis trop longtemps ?"
    choices:
      - {text: "sysmon la repère après 10 ms environ et envoie SIGURG à son thread", correct: true}
      - {text: "Le noyau tue la goroutine après 10 ms de calcul continu", correct: false}
      - {text: "Le compilateur insère un `sleep` dans chaque boucle", correct: false}
      - {text: "Le GC l'arrête à son prochain cycle, puis la relance", correct: false}
    answer: "sysmon repère une goroutine qui tourne depuis environ 10 ms, et le runtime envoie un signal SIGURG à son thread pour l'interrompre. SIGURG a été choisi car il est rarement utilisé par les programmes."
  - key: qcm-syscall
    format: multiple-choice
    question: Que fait le runtime quand un appel système bloquant dure ?
    choices:
      - {text: "Il détache le P du thread bloqué et le confie à un autre thread", correct: true}
      - {text: "Il interrompt l'appel système et le relance plus tard", correct: false}
      - {text: "Il arrête toutes les goroutines jusqu'à la fin de l'appel", correct: false}
      - {text: "Il attend : le P reste lié au thread jusqu'au retour", correct: false}
    answer: "Il détache le P du thread bloqué et le confie à un autre thread, créé si besoin : les autres goroutines continuent donc de tourner."
  - key: qcm-cgo
    format: multiple-choice
    question: Pourquoi limiter les appels cgo dans un chemin chaud ?
    choices:
      - {text: "Chaque appel coûte bien plus qu'un appel de fonction Go", correct: true}
      - {text: "cgo désactive le ramasse-miettes pendant l'appel", correct: false}
      - {text: "cgo interdit les goroutines dans tout le programme", correct: false}
      - {text: "Chaque appel recompile la fonction C appelée", correct: false}
    answer: "Un appel cgo change de pile et de mode, et garde son thread pendant tout l'appel : il coûte bien plus qu'un appel Go. cgo complique aussi la compilation croisée et les binaires statiques."
  - key: scenario-avant-114
    format: scenario
    question: Pourquoi un programme avec une boucle de calcul serrée pouvait-il se figer avant Go 1.14 ?
    choices:
      - {text: "La préemption était coopérative : une boucle sans appel ne cédait jamais, et le GC l'attendait", correct: true}
      - {text: "Le GC était générationnel, et sa jeune génération bloquait les boucles de calcul serrées", correct: false}
      - {text: "Le noyau suspendait le processus entier dès qu'un thread dépassait son quota de CPU", correct: false}
      - {text: "Les boucles serrées faisaient déborder la pile, que le runtime recopiait sans fin", correct: false}
    answer: "La préemption était seulement coopérative, aux appels de fonction : une boucle sans appel ne cédait jamais son P. Et le GC, qui doit brièvement arrêter toutes les goroutines, attendait cette boucle : tout se figeait. Depuis Go 1.14, un signal l'interrompt n'importe où."
  - key: scenario-threads
    format: scenario
    question: Ton service lit des milliers de fichiers en parallèle et crée des centaines de threads. Pourquoi, et que fais-tu ?
    choices:
      - {text: "Chaque lecture bloque un thread ; je borne les lectures simultanées par un sémaphore", correct: true}
      - {text: "Le netpoller crée un thread par fichier ouvert ; je lis les fichiers par le réseau", correct: false}
      - {text: "GOMAXPROCS est trop haut ; je le baisse à 1 pour limiter le nombre de threads", correct: false}
      - {text: "C'est une fuite de goroutines ; j'appelle `runtime.GC()` pour libérer les threads", correct: false}
    answer: "Les lectures de fichiers sont des appels système bloquants : chaque goroutine bloquée garde son thread, et le runtime en crée d'autres pour faire tourner les P. Je borne les lectures simultanées (pool de workers ou sémaphore, quelques dizaines), ce qui suffit à saturer le disque ; à 10 000 threads (`debug.SetMaxThreads`), le programme planterait."
  - key: scenario-latence
    format: scenario
    question: Une goroutine de calcul long dégrade-t-elle la latence des autres requêtes ?
    choices:
      - {text: "Peu, préemptée toutes les 10 ms depuis Go 1.14 ; mais plusieurs calculs peuvent prendre tous les P", correct: true}
      - {text: "Beaucoup : elle garde son P jusqu'à la fin du calcul, sans jamais le céder aux autres", correct: false}
      - {text: "Pas du tout : le runtime lui réserve un cœur dédié, en dehors de GOMAXPROCS", correct: false}
      - {text: "Pas du tout : les requêtes HTTP disposent de P réservés par le netpoller", correct: false}
    answer: "Peu, depuis Go 1.14 : elle est préemptée environ toutes les 10 ms et les autres goroutines reprennent leur tour. Mais si plusieurs calculs longs occupent tous les P, les requêtes attendent : je borne alors les calculs concurrents (un pool plus petit que GOMAXPROCS)."
  - key: scenario-cgo
    format: scenario
    question: Quand accepterais-tu d'utiliser cgo dans un service ?
    choices:
      - {text: "Quand une bibliothèque C n'a pas d'équivalent Go raisonnable, avec des appels regroupés", correct: true}
      - {text: "Dès qu'une fonction C est plus rapide, même pour de petits appels très fréquents", correct: false}
      - {text: "Jamais : cgo est déprécié depuis Go 1.20 et sera bientôt retiré du langage", correct: false}
      - {text: "Pour paralléliser du calcul, cgo permettant de dépasser la limite de GOMAXPROCS", correct: false}
    answer: "Quand une bibliothèque C n'a pas d'équivalent Go raisonnable (un codec, un SDK matériel). Je regroupe alors les appels pour en faire peu et de gros, je borne les appels simultanés, et j'accepte une compilation croisée plus compliquée ; sinon je préfère du Go pur (modernc.org/sqlite, par exemple)."
