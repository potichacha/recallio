notion: piles-goroutines
cards:
  - key: taille-initiale-pile-goroutine
    format: course
    question: Taille initiale de la pile d'une goroutine ?
    answer: Environ 2 Ko, extensible dynamiquement.
  - key: grandit-pile-goroutine
    format: course
    question: Comment grandit la pile d'une goroutine ?
    answer: Le runtime alloue une pile deux fois plus grande et copie l'ancienne.
  - key: explique-avoir-100-000-goroutines-mais
    format: scenario
    question: Explique pourquoi on peut avoir 100 000 goroutines mais pas 100 000 threads.
    answer: |-
      Un thread de l'OS réserve une pile de l'ordre du mégaoctet, demande au noyau de le créer et de le détruire, et son changement de contexte passe par le noyau. Une goroutine démarre avec une pile de 2 Ko qui grandit à la demande, et elle est ordonnancée en espace utilisateur par le runtime Go, qui la fait tourner sur un petit nombre de threads (GOMAXPROCS, plus ceux bloqués en appel système).
      Surtout, une goroutine qui attend le réseau ne consomme aucun thread : le netpoller la gare et la réveille quand les données arrivent. 100 000 connexions inactives, c'est 100 000 petites piles en mémoire, pas 100 000 threads. Les virtual threads de Java 21 reprennent exactement cette idée.
  - key: recursion-profonde-risquee
    format: course
    question: Une récursion profonde est-elle risquée en Go ?
    answer: Moins qu'en Java (piles extensibles jusqu'à 1 Go), mais un stack overflow est fatal et non récupérable.
