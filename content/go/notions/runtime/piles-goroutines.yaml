notion: piles-goroutines
lesson: "Chaque goroutine a sa **propre pile**, mais bien plus petite que celle d'un thread du système :\n- elle démarre à **quelques Ko** (2 Ko historiquement ; depuis Go 1.19, le runtime ajuste la taille initiale d'après\n  la moyenne observée) ;\n- elle **grandit à la demande** : le compilateur ajoute au début de chaque fonction un test qui vérifie la place\n  restante ; s'il n'y en a pas assez, le runtime alloue une pile **deux fois plus grande** et y **copie** l'ancienne\n  (les pointeurs vers la pile sont mis à jour) ;\n- elle peut **rétrécir** lors du GC si elle n'utilise plus qu'une petite partie de sa taille ;\n- sa taille maximale est de **1 Go** sur 64 bits (`debug.SetMaxStack`) : une récursion infinie se termine par\n  « goroutine stack exceeds 1000000000-byte limit », une **erreur fatale** que `recover` ne rattrape pas.\n\nÀ comparer avec un thread du système, dont la pile est réservée d'avance (souvent 1 à 8 Mo) : on peut lancer des\n**centaines de milliers** de goroutines, pas autant de threads.\n\n```go\nfunc profondeur(n int) int {\n\tif n == 0 {\n\t\treturn 0\n\t}\n\treturn 1 + profondeur(n-1)\n}\n// profondeur(1_000_000) fonctionne : la pile grandit à quelques dizaines de Mo\n```\n\nLe revers : une goroutine **bloquée** pour toujours garde sa pile (et ce qu'elle référence). Les fuites de goroutines\nsont donc des fuites de mémoire.\n\n**En entretien** : « Quelques Ko au départ, une pile contiguë qui double et se copie à la demande, qui peut rétrécir,\nplafonnée à 1 Go ; d'où des centaines de milliers de goroutines possibles. »"
cards:
  - key: taille-initiale-pile-goroutine
    format: course
    question: "Quelle est la taille initiale de la pile d'une goroutine ?"
    choices:
      - {text: "Environ 2 Ko, extensible à la demande", correct: true}
      - {text: "1 Mo, réservé d'avance comme un thread", correct: false}
      - {text: "64 Ko, fixe pendant toute sa durée de vie", correct: false}
      - {text: "Aucune : une goroutine n'a pas de pile", correct: false}
    answer: "Environ 2 Ko, extensible dynamiquement jusqu'à 1 Go. Un thread du système réserve de l'ordre du Mo d'avance."
  - key: grandit-pile-goroutine
    format: course
    question: Comment grandit la pile d'une goroutine ?
    choices:
      - {text: "Le runtime alloue une pile deux fois plus grande et y copie l'ancienne", correct: true}
      - {text: "Le runtime chaîne un nouveau segment à l'ancien, sans rien copier", correct: false}
      - {text: "Le système d'exploitation agrandit la pile à la demande, page par page", correct: false}
      - {text: "Elle ne grandit pas : une goroutine qui manque de pile panique", correct: false}
    answer: "Le runtime alloue une pile deux fois plus grande et copie l'ancienne, en mettant à jour les pointeurs vers la pile. Les piles segmentées ont été abandonnées en Go 1.4."
  - key: explique-avoir-100-000-goroutines-mais
    format: scenario
    question: "Pourquoi peut-on avoir 100 000 goroutines, mais pas 100 000 threads ?"
    choices:
      - {text: "Petite pile extensible, ordonnancement sans le noyau, et le netpoller gare l'attente réseau", correct: true}
      - {text: "Les goroutines partagent toutes une seule pile, réutilisée à tour de rôle par le runtime", correct: false}
      - {text: "Le runtime n'en garde qu'une en mémoire, les autres étant écrites sur le disque", correct: false}
      - {text: "Les goroutines sont des threads du noyau, mais créés avec une pile plus petite", correct: false}
    answer: "Un thread réserve une pile de l'ordre du Mo et passe par le noyau pour être créé et changé ; une goroutine démarre avec 2 Ko qui grandissent, et le runtime l'ordonnance en espace utilisateur sur peu de threads. Une goroutine qui attend le réseau ne consomme aucun thread : le netpoller la gare."
  - key: recursion-profonde-risquee
    format: course
    question: Une récursion profonde est-elle risquée en Go ?
    choices:
      - {text: "Moins qu'en Java, la pile pouvant monter à 1 Go, mais un débordement est fatal", correct: true}
      - {text: "Non : la pile grandit sans limite, tant que la machine a de la mémoire", correct: false}
      - {text: "Oui, plus qu'en Java : la pile d'une goroutine est fixe, à 2 Ko", correct: false}
      - {text: "Non : un débordement de pile est une panic, rattrapable avec `recover`", correct: false}
    answer: "Moins qu'en Java (piles extensibles jusqu'à 1 Go), mais un dépassement de pile est une erreur fatale, que `recover` ne rattrape pas."
  - key: depassement
    format: course
    question: Que se passe-t-il quand une récursion infinie dépasse la taille maximale de la pile ?
    choices:
      - {text: "Une erreur fatale « stack exceeds 1000000000-byte limit », que `recover` ignore", correct: true}
      - {text: "Une panic `stack overflow`, que `recover` peut rattraper dans un `defer`", correct: false}
      - {text: "Le runtime déplace la pile sur le tas, et la récursion continue sans fin", correct: false}
      - {text: "Le runtime tue la goroutine fautive, et les autres continuent de tourner", correct: false}
    answer: "Le runtime arrête tout le programme avec « goroutine stack exceeds 1000000000-byte limit » : c'est une erreur fatale que `recover` ne peut pas rattraper."
  - key: vf-copie
    format: true-false
    question: Quand une pile de goroutine grandit, le runtime alloue une pile plus grande et y copie l'ancienne.
    truth: true
    answer: Les piles sont contiguës, d'où la copie.
  - key: vf-taille
    format: true-false
    question: Une goroutine réserve 8 Mo de pile dès sa création, comme un thread.
    truth: false
    answer: Elle démarre à quelques Ko.
  - key: vf-retrecir
    format: true-false
    question: La pile d'une goroutine peut rétrécir.
    truth: true
    answer: Pendant le GC, si elle n'en utilise plus qu'une petite partie.
  - key: vf-recover
    format: true-false
    question: Un recover attrape un dépassement de pile.
    truth: false
    answer: C'est une erreur fatale, pas une panique.
  - key: qcm-croissance
    format: multiple-choice
    question: "Qu'est-ce qui déclenche la croissance de la pile d'une goroutine ?"
    choices:
      - {text: "Un test, au début de chaque fonction, de la place restante", correct: true}
      - {text: "Une faute de page, que le noyau signale au runtime", correct: false}
      - {text: "Le GC, qui mesure les piles à chacun de ses cycles", correct: false}
      - {text: "Un signal que sysmon envoie toutes les 10 ms", correct: false}
    answer: "Le compilateur insère, au début de chaque fonction, un test de la place restante ; s'il en manque, le runtime alloue une pile deux fois plus grande et y copie l'ancienne. Les piles segmentées ont été abandonnées en Go 1.4."
  - key: qcm-consequences
    format: multiple-choice
    question: "Quelle conséquence ont ces piles petites et extensibles ?"
    choices:
      - {text: "On peut lancer des centaines de milliers de goroutines", correct: true}
      - {text: "Une goroutine bloquée pour toujours ne coûte plus rien", correct: false}
      - {text: "Une récursion n'a plus aucune limite de profondeur", correct: false}
      - {text: "Les goroutines n'ont plus besoin du ramasse-miettes", correct: false}
    answer: "Quelques Ko par goroutine permettent d'en lancer des centaines de milliers, et une récursion peut aller jusqu'à 1 Go de pile, pas au-delà. Une goroutine bloquée garde sa pile et tout ce qu'elle référence."
  - key: qcm-maximum
    format: multiple-choice
    question: Comment modifier la taille maximale de la pile d'une goroutine ?
    choices:
      - text: '`debug.SetMaxStack`'
        correct: true
      - text: '`ulimit -s`'
        correct: false
      - text: '`GOMAXPROCS`'
        correct: false
      - text: '`go build -stack`'
        correct: false
    answer: ulimit concerne les piles des threads du système, pas celles des goroutines.
  - key: qcm-fuite
    format: multiple-choice
    question: Pourquoi une fuite de goroutines est-elle aussi une fuite de mémoire ?
    choices:
      - {text: "Chaque goroutine bloquée garde sa pile et tout ce qu'elle référence", correct: true}
      - {text: "Le GC libère les goroutines bloquées, mais jamais leurs channels", correct: false}
      - {text: "Ce n'en est pas une : une goroutine bloquée ne retient rien", correct: false}
      - {text: "Chaque goroutine bloquée réserve 1 Mo de pile, comme un thread", correct: false}
    answer: "Le GC ne ramasse jamais une goroutine, même bloquée pour toujours : sa pile reste, et tout ce que sa pile référence reste en vie."
  - key: scenario-recursion
    format: scenario
    question: Ton parcours récursif d'un arbre très profond (données utilisateur) fait planter le service. Que fais-tu ?
    choices:
      - {text: "Un parcours itératif à pile explicite, ou une profondeur maximale avec une erreur", correct: true}
      - {text: "Un `recover` dans un `defer`, pour rattraper le débordement de la pile", correct: false}
      - {text: "`debug.SetMaxStack` au maximum, pour que la pile ne déborde plus jamais", correct: false}
      - {text: "Lancer le parcours dans une nouvelle goroutine, qui a une pile neuve", correct: false}
    answer: "Un arbre fourni par l'utilisateur peut être arbitrairement profond : la récursion peut atteindre la limite de pile et provoquer une erreur fatale, que `recover` ne rattrape pas. Je réécris le parcours en itératif avec une pile explicite (un slice), ou je limite la profondeur et renvoie une erreur au-delà, comme les décodeurs JSON."
  - key: scenario-memoire
    format: scenario
    question: Le nombre de goroutines de ton service monte de 1 000 par heure. Quel impact, et comment le confirmes-tu ?
    choices:
      - {text: "La mémoire monte avec elles ; je suis `go_goroutines` et un profil `goroutine`", correct: true}
      - {text: "Aucun impact : une goroutine bloquée ne retient rien, le GC la libère", correct: false}
      - {text: "Le CPU monte, car chaque goroutine bloquée est réveillée à chaque cycle", correct: false}
      - {text: "La mémoire monte ; j'augmente GOMEMLIMIT pour que le GC les ramasse", correct: false}
    answer: "Chaque goroutine bloquée garde sa pile et ce qu'elle référence : la mémoire monte jusqu'à l'OOM. Je suis `go_goroutines`, puis un profil `goroutine` (`/debug/pprof/goroutine?debug=1`) montre où elles bloquent ; je corrige la cause (contexte, délai, channel bufferisé) et j'ajoute goleak aux tests."
  - key: scenario-java
    format: scenario
    question: "Quelle comparaison entre les piles des goroutines et celles des threads Java, plateforme et virtuels, est juste ?"
    choices:
      - {text: "Plateforme : pile native réservée d'avance ; virtuels et goroutines : piles qui grandissent", correct: true}
      - {text: "Plateforme, virtuels et goroutines : tous une pile native de 1 Mo, réglée par `-Xss`", correct: false}
      - {text: "Goroutines : une pile fixe de 2 Ko ; threads virtuels : une pile qui grandit sur le tas", correct: false}
      - {text: "Plateforme et virtuels : une pile sur le tas ; goroutines : une pile native du système", correct: false}
    answer: "Un thread plateforme a une pile native réservée d'avance (environ 1 Mo, `-Xss`), ce qui limite leur nombre. Les threads virtuels stockent leur pile sur le tas et la font grandir à la demande, comme les goroutines, qui démarrent à quelques Ko et se copient en doublant."
