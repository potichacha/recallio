notion: trace-execution
cards:
  - key: profil-cpu-vs-trace-execution
    format: course
    question: Profil CPU vs trace d'exécution ?
    answer: Où le CPU est consommé vs chronologie des goroutines, du scheduler et du GC pour comprendre une latence.
  - key: flight-recorder
    format: course
    question: C'est quoi le flight recorder ?
    answer: Un enregistrement continu en mémoire des dernières secondes de trace, exportable à la demande (Go 1.25).
  - key: profil-latence-elevee-avec-cpu-bas
    format: course
    question: Quel profil pour une latence élevée avec un CPU bas ?
    answer: block, mutex et la trace d'exécution.
