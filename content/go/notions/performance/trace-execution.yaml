notion: trace-execution
lesson: |-
  Le **traceur d'exécution** enregistre ce qui se passe dans le runtime, événement par événement : quand chaque
  goroutine est créée, s'exécute, se bloque (channel, verrou, réseau, appel système) et se réveille, sur quel P, et
  quand le GC tourne.

  Là où un profil CPU dit **où** le processeur passe son temps, la trace dit **quand** et **pourquoi** une goroutine
  n'avançait pas : parfait pour une **latence** élevée avec un CPU bas.

  ```
  go test -trace=trace.out ./...
  curl -o trace.out "http://localhost:6060/debug/pprof/trace?seconds=5"
  go tool trace trace.out
  ```

  ```go
  // dans le code
  f, _ := os.Create("trace.out")
  trace.Start(f)
  defer trace.Stop()
  ```

  On peut annoter la trace avec des **tâches** et des **régions** (`trace.NewTask`, `trace.WithRegion`) pour retrouver
  une requête précise.

  Le **flight recorder** (`trace.FlightRecorder`, Go 1.25) garde en mémoire les **dernières secondes** de trace en
  continu, et l'on écrit ce tampon seulement quand un événement intéressant survient (une requête trop lente, une
  erreur) : on capture ce qui s'est passé **juste avant** l'incident, sans tracer en permanence sur disque.

  ```go
  fr := trace.NewFlightRecorder(trace.FlightRecorderConfig{MinAge: 5 * time.Second})
  fr.Start()
  // ... quand une requête dépasse 1 s :
  fr.WriteTo(fichier)
  ```

  Une trace coûte quelques pourcents de CPU et devient vite volumineuse : quelques secondes suffisent.

  **En entretien** : « La trace montre les goroutines dans le temps, leurs blocages et le GC : l'outil des problèmes de
  latence ; go tool trace pour la lire ; le flight recorder de Go 1.25 pour capturer les secondes avant un incident. »
cards:
  - key: profil-cpu-vs-trace-execution
    format: course
    question: "Quelle différence entre un profil CPU et une trace d'exécution ?"
    choices:
      - {text: "Le profil dit où part le CPU ; la trace donne la chronologie des goroutines et du GC", correct: true}
      - {text: "Le profil suit chaque goroutine dans le temps ; la trace agrège les coûts par fonction", correct: false}
      - {text: "Aucune : une trace n'est qu'un profil CPU plus long, de plusieurs minutes", correct: false}
      - {text: "Le profil mesure la mémoire ; la trace mesure le CPU, fonction par fonction", correct: false}
    answer: "Le profil CPU dit où le CPU est consommé, en agrégé ; la trace donne la chronologie des goroutines, de l'ordonnanceur et du GC, pour comprendre une latence."
  - key: flight-recorder
    format: course
    question: "Qu'est-ce que le flight recorder de Go (Go 1.25) ?"
    choices:
      - {text: "Un enregistrement continu des dernières secondes de trace, exportable à la demande", correct: true}
      - {text: "Un journal de toutes les requêtes HTTP du service, écrit en continu sur le disque", correct: false}
      - {text: "Un profil CPU permanent, envoyé toutes les minutes à un serveur central", correct: false}
      - {text: "Un enregistreur des panics, qui garde la pile des goroutines fautives", correct: false}
    answer: "Un enregistrement continu en mémoire des dernières secondes de trace d'exécution, que l'on écrit dans un fichier à la demande, par exemple juste après une requête anormalement lente."
  - key: profil-latence-elevee-avec-cpu-bas
    format: course
    question: "Quels outils choisir pour une latence élevée avec un CPU bas ?"
    choices:
      - {text: "Les profils `block` et `mutex`, et la trace d'exécution", correct: true}
      - {text: "Le profil CPU, qui montre les fonctions les plus lentes", correct: false}
      - {text: "Le profil heap en `inuse_space`, qui montre le vivant", correct: false}
      - {text: "`go build -gcflags=-m`, qui montre les échappements", correct: false}
    answer: "Les profils `block` et `mutex`, et la trace d'exécution : un CPU bas avec une latence haute signifie que le programme attend, ce qu'un profil CPU ne montre pas."
  - key: annoter
    format: course
    question: Comment retrouver une requête précise dans une trace d'exécution ?
    choices:
      - {text: "En l'annotant avec `trace.NewTask` et des régions `trace.WithRegion`", correct: true}
      - {text: "En cherchant son URL, que la trace du runtime enregistre d'office", correct: false}
      - {text: "En ajoutant un `log.Printf` au début, que la trace reprend", correct: false}
      - {text: "En nommant la goroutine de la requête avec `runtime.SetName`", correct: false}
    answer: "En l'annotant avec `trace.NewTask(ctx, \"commande\")` et des régions (`trace.WithRegion`) : `go tool trace` regroupe alors les événements par tâche et donne leurs durées. Les goroutines n'ont pas de nom en Go."
  - key: vf-quand
    format: true-false
    question: La trace d'exécution montre quand une goroutine attendait un verrou ou un channel.
    truth: true
    answer: C'est son principal intérêt par rapport au profil CPU.
  - key: vf-flight
    format: true-false
    question: Le flight recorder écrit en continu toute la trace sur le disque.
    truth: false
    answer: Il garde les dernières secondes en mémoire, écrites seulement quand on le demande.
  - key: vf-duree
    format: true-false
    question: Quelques secondes de trace suffisent en général à comprendre un problème.
    truth: true
    answer: Une trace longue devient énorme et difficile à lire.
  - key: vf-1-25
    format: true-false
    question: Le flight recorder fait partie de runtime/trace depuis Go 1.25.
    truth: true
    answer: Avant, il existait dans golang.org/x/exp/trace.
  - key: qcm-contenu
    format: multiple-choice
    question: "Lesquels de ces éléments une trace d'exécution montre-t-elle ?"
    choices:
      - text: Les goroutines exécutées sur chaque P au fil du temps
        correct: true
      - text: Les blocages sur channels, verrous et réseau
        correct: true
      - text: Les cycles du GC
        correct: true
      - text: Les requêtes SQL envoyées, avec leur texte
        correct: false
    answer: Le texte des requêtes n'est pas dans la trace du runtime.
  - key: qcm-choix
    format: multiple-choice
    question: "Quelle association entre un symptôme et son outil est juste ?"
    choices:
      - {text: "Latence élevée avec un CPU bas : la trace", correct: true}
      - {text: "Mémoire qui monte : le profil CPU", correct: false}
      - {text: "Fuite de goroutines : une trace de quelques millisecondes", correct: false}
      - {text: "CPU saturé : le profil heap en `inuse_space`", correct: false}
    answer: "Une latence avec un CPU bas vient d'une attente, que la trace montre ; le CPU saturé relève du profil CPU, la mémoire du profil heap, les fuites du profil goroutine."
  - key: qcm-obtenir
    format: multiple-choice
    question: "Comment capturer une trace d'exécution pendant les tests d'un package ?"
    choices:
      - {text: "`go test -trace=trace.out`", correct: true}
      - {text: "`go build -trace`", correct: false}
      - {text: "`go test -cpuprofile=trace.out`", correct: false}
      - {text: "`go tool trace -record`", correct: false}
    answer: "`go test -trace=trace.out` capture une trace des tests ; en service, `/debug/pprof/trace?seconds=5` ou `trace.Start` et `trace.Stop`. Elle se lit avec `go tool trace` ; `-cpuprofile` produit un profil, pas une trace."
  - key: qcm-flight
    format: multiple-choice
    question: Dans quel cas le flight recorder est-il utile ?
    choices:
      - {text: "Comprendre pourquoi une requête rare a mis 3 secondes", correct: true}
      - {text: "Remplacer les métriques du service", correct: false}
      - {text: "Profiler la mémoire du tas", correct: false}
      - {text: "Mesurer le débit moyen d'un endpoint", correct: false}
    answer: "On écrit le tampon quand on détecte l'événement (une requête trop lente, une erreur intermittente), et l'on voit les secondes qui l'ont précédé."
  - key: scenario-latence
    format: scenario
    question: La latence p99 de ton service est élevée alors que le CPU est à 20 %. Comment utilises-tu la trace ?
    choices:
      - {text: "Quelques secondes de trace sous charge, puis où attendent les requêtes lentes", correct: true}
      - {text: "Une trace d'une heure, pour être sûr de capter tous les cas lents", correct: false}
      - {text: "Une trace au démarrage du service, quand la charge est encore faible", correct: false}
      - {text: "Une trace du benchmark local, plus simple à lire que la production", correct: false}
    answer: "Je capture quelques secondes de trace pendant la charge, annotées par tâche si possible, et j'ouvre `go tool trace`. Pour les requêtes lentes, je regarde le temps bloqué sur un verrou, sur le réseau, en attente d'un P, ou pris par le GC et le mark assist ; les vues de synthèse orientent vers le correctif."
  - key: scenario-flight
    format: scenario
    question: Comment mettrais-tu en place le flight recorder dans un service ?
    choices:
      - {text: "Démarré en continu ; un middleware écrit le tampon quand une requête dépasse un seuil", correct: true}
      - {text: "Démarré à la main par un admin, quand un utilisateur signale une lenteur", correct: false}
      - {text: "Une trace complète écrite sur le disque en continu, pour tout garder", correct: false}
      - {text: "Le tampon écrit à la fin de chaque requête, pour ne rien manquer", correct: false}
    answer: "Au démarrage, un `trace.NewFlightRecorder` avec quelques secondes de rétention, démarré en continu. Un middleware mesure chaque requête ; au-delà d'un seuil (1 s), il écrit le tampon dans un fichier, une fois par période au plus. Les fichiers s'ouvrent ensuite avec `go tool trace`."
  - key: scenario-gc
    format: scenario
    question: Comment vois-tu dans une trace que le GC ralentit tes requêtes ?
    choices:
      - {text: "Les requêtes lentes coïncident avec les cycles du GC et beaucoup de mark assist", correct: true}
      - {text: "Le GC apparaît en tête de la liste des fonctions les plus coûteuses de la trace", correct: false}
      - {text: "Les goroutines des requêtes sont toutes en attente réseau pendant les cycles", correct: false}
      - {text: "La trace affiche un avertissement « GC slow » sur chaque requête concernée", correct: false}
    answer: "La trace montre les cycles du GC sur une ligne dédiée, et les goroutines en mark assist quand elles doivent aider au marquage avant d'allouer. Si les requêtes lentes coïncident avec des cycles et beaucoup d'assists, la pression d'allocation est en cause : je réduis les allocations ou je donne plus de marge (GOGC, GOMEMLIMIT)."
  - key: scenario-vs-pprof
    format: scenario
    question: "En entretien, on te demande quand préférer une trace à un profil pprof. Que réponds-tu ?"
    choices:
      - {text: "La trace pour la latence et la concurrence, pprof pour le débit et le CPU", correct: true}
      - {text: "La trace pour le CPU, pprof pour la mémoire : chacun a son domaine", correct: false}
      - {text: "Toujours la trace : elle contient tout ce que donne pprof, en mieux", correct: false}
      - {text: "Toujours pprof : la trace est réservée au débogage du runtime de Go", correct: false}
    answer: "pprof agrège par échantillonnage : il dit quelles fonctions coûtent le plus, en moyenne. La trace garde l'ordre des événements : ce qui est arrivé à une goroutine, quand elle attendait et pourquoi. pprof pour le débit ou le CPU, la trace pour la latence, la concurrence ou l'ordonnancement."
