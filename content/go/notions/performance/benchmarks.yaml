notion: benchmarks
lesson: "Un **benchmark** est une fonction `BenchmarkXxx(b *testing.B)` dans un fichier `_test.go`. Depuis **Go 1.24**, on\nécrit la boucle mesurée avec **`b.Loop()`** :\n\n```go\nfunc BenchmarkEncoder(b *testing.B) {\n\tcommande := nouvelleCommande() // préparation : hors mesure\n\tfor b.Loop() {\n\t\tencoder(commande) // mesuré, répété autant que nécessaire\n\t}\n}\n```\n\n```\ngo test -bench=Encoder -benchmem ./commande\nBenchmarkEncoder-8   1234567   950 ns/op   320 B/op   4 allocs/op\n```\n\nLa ligne donne le nombre d'itérations, le **temps par opération**, et avec **`-benchmem`** (ou `b.ReportAllocs()`)\nles **octets** et le **nombre d'allocations** par opération. Le suffixe `-8` est la valeur de GOMAXPROCS.\n\nCe que `b.Loop()` apporte par rapport à l'ancien `for i := 0; i < b.N; i++` :\n- la préparation **avant** la boucle n'est pas mesurée, sans `b.ResetTimer()` ;\n- le compilateur ne peut plus **supprimer** un appel dont le résultat est ignoré ;\n- la fonction de benchmark n'est exécutée **qu'une fois**, ce qui évite de refaire une préparation coûteuse.\n\nLes bonnes pratiques :\n- `-run='^$'` pour ne pas lancer les tests en même temps, `-count=10` pour répéter et comparer avec **benchstat** ;\n- des **entrées réalistes** (tailles, données), éventuellement en sous-benchmarks (`b.Run(\"1Ko\", ...)`) ;\n- `b.RunParallel` pour mesurer un code appelé par plusieurs goroutines ;\n- une machine **au calme** (pas de navigateur qui compile en fond, mode économie d'énergie désactivé).\n\n**En entretien** : « BenchmarkXxx avec for b.Loop() ; -benchmem pour les allocations ; -count et benchstat pour\ncomparer ; des entrées réalistes et une machine au calme. »"
cards:
  - key: ecrire-benchmark
    format: course
    question: Comment écrire un benchmark ?
    answer: Une fonction BenchmarkXxx(b *testing.B) avec une boucle `for b.Loop()` (ou b.N), lancée par `go test -bench`.
  - key: apporte-b-loop
    format: course
    question: Qu'apporte b.Loop() ?
    answer: Gestion automatique de la chauffe et du chronométrage, et protection contre l'élimination du code mesuré (Go 1.24).
  - key: signifie-benchmem
    format: course
    question: Que signifie -benchmem ?
    answer: Afficher les octets et le nombre d'allocations par opération.
  - key: lecture
    format: course
    question: Que signifient les colonnes ns/op, B/op et allocs/op ?
    answer: Le temps moyen par opération, les octets alloués par opération, et le nombre d'allocations par opération ; les deux dernières apparaissent avec -benchmem ou b.ReportAllocs().
  - key: vf-loop
    format: true-false
    question: Avec b.Loop(), la préparation placée avant la boucle n'est pas comptée dans la mesure.
    truth: true
    answer: Plus besoin de b.ResetTimer.
  - key: vf-tests
    format: true-false
    question: '`go test -bench=.` lance aussi les tests du package.'
    truth: true
    answer: On ajoute -run='^$' pour ne lancer que les benchmarks.
  - key: vf-elimination
    format: true-false
    question: Avec l'ancienne boucle `for i := 0; i < b.N; i++`, le compilateur pouvait supprimer un appel dont le résultat était ignoré.
    truth: true
    answer: On le stockait dans une variable globale ; b.Loop règle ce problème.
  - key: vf-suffixe
    format: true-false
    question: Dans « BenchmarkEncoder-8 », le 8 est le nombre d'itérations.
    truth: false
    answer: C'est la valeur de GOMAXPROCS pendant le benchmark.
  - key: qcm-options
    format: multiple-choice
    question: Quelles options de go test servent aux benchmarks ?
    choices:
      - text: '`-bench=Regex`'
        correct: true
      - text: '`-benchmem`'
        correct: true
      - text: '`-count=10`'
        correct: true
      - text: '`-benchloop`'
        correct: false
    answer: '`-benchtime` règle aussi la durée (`-benchtime=3s`) ou le nombre d''itérations (`-benchtime=1000x`).'
  - key: qcm-pratiques
    format: multiple-choice
    question: Quelles pratiques rendent un benchmark fiable ?
    choices:
      - text: Des entrées représentatives de la production
        correct: true
      - text: Plusieurs exécutions comparées avec benchstat
        correct: true
      - text: Une machine sans autre charge
        correct: true
      - text: Une seule exécution, la plus rapide
        correct: false
    answer: Une seule mesure ne dit rien de la variance.
  - key: qcm-parallel
    format: multiple-choice
    question: À quoi sert `b.RunParallel` ?
    choices:
      - text: Mesurer un code appelé en même temps par plusieurs goroutines
        correct: true
      - text: Révéler la contention d'un verrou
        correct: true
      - text: Lancer les benchmarks de plusieurs packages en même temps
        correct: false
      - text: Accélérer un benchmark séquentiel
        correct: false
    answer: Il répartit les itérations sur GOMAXPROCS goroutines.
  - key: qcm-sous
    format: multiple-choice
    question: Comment mesurer une fonction pour plusieurs tailles d'entrée ?
    choices:
      - text: Des sous-benchmarks avec b.Run, un par taille
        correct: true
      - text: Une table de cas parcourue avec b.Run
        correct: true
      - text: Un benchmark par taille, copié-collé
        correct: false
      - text: Une taille aléatoire à chaque itération
        correct: false
    answer: Une taille aléatoire mélangerait les mesures.
  - key: trous-loop
    format: fill-in
    question: "Complétez la boucle du benchmark :\n```go\nfunc BenchmarkTrier(b *testing.B) {\n\tdonnees := genererDonnees(10_000)\n\tfor b.___() {\n\t\ttrier(slices.Clone(donnees))\n\t}\n}\n```"
    blanks:
      - - Loop
    answer: b.Loop() depuis Go 1.24.
  - key: trous-allocs
    format: fill-in
    question: "Complétez pour afficher les allocations sans option en ligne de commande :\n```go\nfunc BenchmarkEncoder(b *testing.B) {\n\tb.___()\n\tfor b.Loop() {\n\t\tencoder(c)\n\t}\n}\n```"
    blanks:
      - - ReportAllocs
    answer: ReportAllocs équivaut à -benchmem pour ce benchmark.
  - key: trous-signature
    format: fill-in
    question: |-
      Complétez la signature :
      ```go
      func BenchmarkParser(b *testing.___) {
      ```
    blanks:
      - - B
    answer: testing.B.
  - key: trous-sous
    format: fill-in
    question: "Complétez le sous-benchmark :\n```go\nfor _, n := range []int{10, 1000, 100_000} {\n\tb.___(strconv.Itoa(n), func(b *testing.B) {\n\t\td := generer(n)\n\t\tfor b.Loop() {\n\t\t\ttraiter(d)\n\t\t}\n\t})\n}\n```"
    blanks:
      - - Run
    answer: b.Run crée un sous-benchmark nommé.
  - key: bug-preparation
    format: bug-fix
    question: "Le benchmark mesure surtout la lecture du fichier de test :\n```go\nfunc BenchmarkParser(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tdonnees, _ := os.ReadFile(\"testdata/gros.json\")\n\t\tparser(donnees)\n\t}\n}\n```"
    answer: "```go\nfunc BenchmarkParser(b *testing.B) {\n\tdonnees, err := os.ReadFile(\"testdata/gros.json\")\n\tif err != nil {\n\t\tb.Fatal(err)\n\t}\n\tfor b.Loop() {\n\t\tparser(donnees)\n\t}\n}\n```\nLa préparation sort de la boucle ; avec b.Loop, elle n'est pas mesurée."
  - key: bug-elimination
    format: bug-fix
    question: "Le benchmark affiche 0,3 ns/op pour une fonction qui fait un vrai calcul :\n```go\nfunc BenchmarkHash(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\thash(\"bonjour\")\n\t}\n}\n```"
    answer: "```go\nfunc BenchmarkHash(b *testing.B) {\n\tfor b.Loop() {\n\t\thash(\"bonjour\")\n\t}\n}\n```\nLe compilateur avait supprimé l'appel, dont le résultat n'était pas utilisé ; b.Loop empêche cette élimination."
  - key: bug-etat
    format: bug-fix
    question: "Le benchmark du tri devient anormalement rapide :\n```go\ndonnees := genererDonnees(10_000)\nfor b.Loop() {\n\tslices.Sort(donnees)\n}\n```"
    answer: "```go\ndonnees := genererDonnees(10_000)\nfor b.Loop() {\n\tcopie := slices.Clone(donnees)\n\tslices.Sort(copie)\n}\n```\nDès le deuxième tour, on triait des données déjà triées. Chaque itération travaille sur une copie (dont le coût,\nmesuré aussi, peut être évalué à part)."
  - key: bug-une-mesure
    format: bug-fix
    question: |-
      Un collègue conclut à un gain de 3 % à partir de ces deux commandes :
      ```
      go test -bench=Encoder > avant.txt
      go test -bench=Encoder > apres.txt
      ```
    answer: |-
      ```
      go test -run='^$' -bench=Encoder -count=10 > avant.txt
      go test -run='^$' -bench=Encoder -count=10 > apres.txt
      benchstat avant.txt apres.txt
      ```
      Une seule mesure ne dit rien du bruit ; dix exécutions et benchstat disent si la différence est significative.
  - key: scenario-demarche
    format: scenario
    question: Comment démontres-tu qu'une optimisation apporte un gain ?
    answer: |-
      J'écris d'abord un benchmark réaliste de la fonction concernée (entrées issues de la production), je le lance dix
      fois avant le changement (`-count=10 -benchmem`), puis dix fois après, et je compare avec benchstat, qui donne la
      variation et sa significativité. Je vérifie ensuite que le gain se retrouve en production (profil, latences), car
      une fonction peut gagner 30 % sans que le service ne gagne rien.
  - key: scenario-micro
    format: scenario
    question: Quelles sont les limites des micro-benchmarks ?
    answer: |-
      Ils mesurent du code isolé, avec des caches chauds, des données petites ou toujours les mêmes, et sans le GC des
      autres requêtes : le résultat peut différer beaucoup en production. Ils sont utiles pour comparer deux versions
      d'une même fonction, pas pour prédire la performance d'un service. Je les complète par des profils de production et
      des tests de charge.
  - key: scenario-ci
    format: scenario
    question: Faut-il lancer les benchmarks dans la CI ?
    answer: |-
      Les machines de CI partagées sont bruyantes : des mesures absolues y varient de 10 % ou plus. Je lance les benchmarks
      en CI surtout pour vérifier qu'ils compilent et tournent (`-benchtime=1x`), et pour les chemins critiques j'utilise
      une machine dédiée avec plusieurs exécutions et benchstat, en alertant seulement sur des régressions nettes.
  - key: scenario-parallele
    format: scenario
    question: Comment mesures-tu la performance d'un cache appelé par toutes les requêtes ?
    answer: |-
      Avec `b.RunParallel` : chaque goroutine du benchmark appelle le cache dans sa boucle `pb.Next()`, avec un mélange de
      lectures et d'écritures proche de la production. Je lance avec `-cpu=1,4,8` pour voir si le débit passe à
      l'échelle, et j'ajoute `-mutexprofile` pour voir la contention. Un benchmark séquentiel cacherait le problème
      principal, le verrou.
