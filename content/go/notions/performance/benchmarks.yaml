notion: benchmarks
lesson: "Un **benchmark** est une fonction `BenchmarkXxx(b *testing.B)` dans un fichier `_test.go`. Depuis **Go 1.24**, on\nécrit la boucle mesurée avec **`b.Loop()`** :\n\n```go\nfunc BenchmarkEncoder(b *testing.B) {\n\tcommande := nouvelleCommande() // préparation : hors mesure\n\tfor b.Loop() {\n\t\tencoder(commande) // mesuré, répété autant que nécessaire\n\t}\n}\n```\n\n```\ngo test -bench=Encoder -benchmem ./commande\nBenchmarkEncoder-8   1234567   950 ns/op   320 B/op   4 allocs/op\n```\n\nLa ligne donne le nombre d'itérations, le **temps par opération**, et avec **`-benchmem`** (ou `b.ReportAllocs()`)\nles **octets** et le **nombre d'allocations** par opération. Le suffixe `-8` est la valeur de GOMAXPROCS.\n\nCe que `b.Loop()` apporte par rapport à l'ancien `for i := 0; i < b.N; i++` :\n- la préparation **avant** la boucle n'est pas mesurée, sans `b.ResetTimer()` ;\n- le compilateur ne peut plus **supprimer** un appel dont le résultat est ignoré ;\n- la fonction de benchmark n'est exécutée **qu'une fois**, ce qui évite de refaire une préparation coûteuse.\n\nLes bonnes pratiques :\n- `-run='^$'` pour ne pas lancer les tests en même temps, `-count=10` pour répéter et comparer avec **benchstat** ;\n- des **entrées réalistes** (tailles, données), éventuellement en sous-benchmarks (`b.Run(\"1Ko\", ...)`) ;\n- `b.RunParallel` pour mesurer un code appelé par plusieurs goroutines ;\n- une machine **au calme** (pas de navigateur qui compile en fond, mode économie d'énergie désactivé).\n\n**En entretien** : « BenchmarkXxx avec for b.Loop() ; -benchmem pour les allocations ; -count et benchstat pour\ncomparer ; des entrées réalistes et une machine au calme. »"
cards:
  - key: ecrire-benchmark
    format: course
    question: "Comment écrire un benchmark en Go ?"
    choices:
      - {text: "Une fonction `BenchmarkXxx(b *testing.B)` avec `for b.Loop()`, lancée par `go test -bench`", correct: true}
      - {text: "Une fonction `TestXxx(t *testing.T)` qui mesure sa durée avec `time.Since`", correct: false}
      - {text: "Une fonction annotée `//go:benchmark`, lancée par `go run -bench`", correct: false}
      - {text: "Une fonction `BenchXxx(b *testing.B)`, lancée par la commande `go bench`", correct: false}
    answer: "Une fonction `BenchmarkXxx(b *testing.B)` dans un fichier `_test.go`, avec une boucle `for b.Loop()` (ou `b.N`), lancée par `go test -bench`."
  - key: apporte-b-loop
    format: course
    question: "Qu'apporte `b.Loop()` (Go 1.24) par rapport à la boucle sur `b.N` ?"
    choices:
      - {text: "Un chronométrage géré seul, et un code mesuré protégé contre son élimination", correct: true}
      - {text: "L'exécution du benchmark en parallèle sur toutes les goroutines disponibles", correct: false}
      - {text: "Un nombre fixe de 1000 itérations, plus reproductible que `b.N`", correct: false}
      - {text: "La mesure des allocations, sans avoir besoin de l'option `-benchmem`", correct: false}
    answer: "La chauffe et le chronométrage sont gérés automatiquement (la préparation avant la boucle n'est pas mesurée), et le compilateur ne peut plus éliminer le code mesuré dont le résultat n'est pas utilisé."
  - key: signifie-benchmem
    format: course
    question: "Que fait l'option `-benchmem` de `go test` ?"
    choices:
      - {text: "Elle affiche les octets et le nombre d'allocations par opération", correct: true}
      - {text: "Elle limite la mémoire disponible pendant les benchmarks", correct: false}
      - {text: "Elle écrit un profil mémoire dans un fichier `mem.out`", correct: false}
      - {text: "Elle répète chaque benchmark jusqu'à stabiliser la mémoire", correct: false}
    answer: "Elle ajoute les colonnes B/op et allocs/op : les octets et le nombre d'allocations par opération. Le profil mémoire, c'est `-memprofile`."
  - key: lecture
    format: course
    question: Que signifient les colonnes ns/op, B/op et allocs/op ?
    choices:
      - {text: "Temps moyen, octets alloués et nombre d'allocations, par opération", correct: true}
      - {text: "Temps total, octets en mémoire et allocations vivantes, pour tout le benchmark", correct: false}
      - {text: "Temps par itération, octets copiés et appels au GC, par opération", correct: false}
      - {text: "Temps du GC, octets libérés et objets ramassés, par opération", correct: false}
    answer: "Le temps moyen par opération, les octets alloués par opération et le nombre d'allocations par opération ; les deux dernières apparaissent avec `-benchmem` ou `b.ReportAllocs()`."
  - key: vf-loop
    format: true-false
    question: Avec b.Loop(), la préparation placée avant la boucle n'est pas comptée dans la mesure.
    truth: true
    answer: Plus besoin de b.ResetTimer.
  - key: vf-tests
    format: true-false
    question: '`go test -bench=.` lance aussi les tests du package.'
    truth: true
    answer: On ajoute -run='^$' pour ne lancer que les benchmarks.
  - key: vf-elimination
    format: true-false
    question: Avec l'ancienne boucle `for i := 0; i < b.N; i++`, le compilateur pouvait supprimer un appel dont le résultat était ignoré.
    truth: true
    answer: On le stockait dans une variable globale ; b.Loop règle ce problème.
  - key: vf-suffixe
    format: true-false
    question: Dans « BenchmarkEncoder-8 », le 8 est le nombre d'itérations.
    truth: false
    answer: C'est la valeur de GOMAXPROCS pendant le benchmark.
  - key: qcm-options
    format: multiple-choice
    question: "Lesquelles de ces options de `go test` servent aux benchmarks ?"
    choices:
      - text: '`-bench=Regex`'
        correct: true
      - text: '`-benchmem`'
        correct: true
      - text: '`-count=10`'
        correct: true
      - text: '`-benchloop`'
        correct: false
    answer: '`-benchtime` règle aussi la durée (`-benchtime=3s`) ou le nombre d''itérations (`-benchtime=1000x`).'
  - key: qcm-pratiques
    format: multiple-choice
    question: "Laquelle de ces pratiques rend un benchmark trompeur ?"
    choices:
      - {text: "Garder une seule exécution, la plus rapide", correct: true}
      - {text: "Des entrées représentatives de la production", correct: false}
      - {text: "Plusieurs exécutions comparées avec benchstat", correct: false}
      - {text: "Une machine sans autre charge pendant la mesure", correct: false}
    answer: "Une seule mesure ne dit rien de la variance, et la plus rapide est la moins représentative. Des entrées réalistes, plusieurs exécutions comparées avec benchstat et une machine au calme rendent la mesure fiable."
  - key: qcm-parallel
    format: multiple-choice
    question: À quoi sert `b.RunParallel` ?
    choices:
      - {text: "Mesurer un code appelé en même temps par plusieurs goroutines", correct: true}
      - {text: "Lancer en même temps les benchmarks de plusieurs packages", correct: false}
      - {text: "Accélérer un benchmark séquentiel en le découpant en morceaux", correct: false}
      - {text: "Répéter le benchmark pour plusieurs valeurs de l'option `-cpu`", correct: false}
    answer: "Il répartit les itérations sur GOMAXPROCS goroutines : on mesure le code sous accès concurrent, ce qui révèle aussi la contention d'un verrou."
  - key: qcm-sous
    format: multiple-choice
    question: Comment mesurer une fonction pour plusieurs tailles d'entrée ?
    choices:
      - {text: "Des sous-benchmarks avec `b.Run`, un par taille", correct: true}
      - {text: "Un benchmark par taille, copié-collé", correct: false}
      - {text: "Une taille aléatoire tirée à chaque itération", correct: false}
      - {text: "Une seule taille, la plus grande, qui couvre les autres", correct: false}
    answer: "`b.Run` crée un sous-benchmark nommé par taille, souvent depuis une table de cas. Une taille aléatoire mélangerait les mesures, et le copier-coller se maintient mal."
  - key: trous-loop
    format: fill-in
    question: |-
      Complète la boucle du benchmark :
      ```go
      func BenchmarkTrier(b *testing.B) {
      	donnees := genererDonnees(10_000)
      	for b.___() {
      		trier(slices.Clone(donnees))
      	}
      }
      ```
    blanks:
      - - Loop
    answer: b.Loop() depuis Go 1.24.
  - key: trous-allocs
    format: fill-in
    question: |-
      Complète pour afficher les allocations sans option en ligne de commande :
      ```go
      func BenchmarkEncoder(b *testing.B) {
      	b.___()
      	for b.Loop() {
      		encoder(c)
      	}
      }
      ```
    blanks:
      - - ReportAllocs
    answer: ReportAllocs équivaut à -benchmem pour ce benchmark.
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature :
      ```go
      func BenchmarkParser(b *testing.___) {
      ```
    blanks:
      - - B
    answer: testing.B.
  - key: trous-sous
    format: fill-in
    question: |-
      Complète le sous-benchmark :
      ```go
      for _, n := range []int{10, 1000, 100_000} {
      	b.___(strconv.Itoa(n), func(b *testing.B) {
      		d := generer(n)
      		for b.Loop() {
      			traiter(d)
      		}
      	})
      }
      ```
    blanks:
      - - Run
    answer: b.Run crée un sous-benchmark nommé.
  - key: bug-preparation
    format: bug-fix
    question: |-
      Le benchmark mesure surtout la lecture du fichier de test. Quelle correction est la bonne ?
      ```go
      func BenchmarkParser(b *testing.B) {
      	for i := 0; i < b.N; i++ {
      		donnees, _ := os.ReadFile("testdata/gros.json")
      		parser(donnees)
      	}
      }
      ```
    choices:
      - {text: "Lire le fichier avant la boucle, puis mesurer `parser` seul avec `b.Loop()`", correct: true}
      - {text: "Appeler `b.ResetTimer()` à chaque tour, juste après la lecture du fichier", correct: false}
      - {text: "Lire un fichier plus petit, pour que la lecture pèse moins dans la mesure", correct: false}
      - {text: "Lancer le benchmark avec `-benchtime=10s`, pour amortir la lecture", correct: false}
    answer: "```go\nfunc BenchmarkParser(b *testing.B) {\n\tdonnees, err := os.ReadFile(\"testdata/gros.json\")\n\tif err != nil {\n\t\tb.Fatal(err)\n\t}\n\tfor b.Loop() {\n\t\tparser(donnees)\n\t}\n}\n```\nLa préparation sort de la boucle ; avec b.Loop, elle n'est pas mesurée."
  - key: bug-elimination
    format: bug-fix
    question: |-
      Le benchmark affiche 0,3 ns/op pour une fonction qui fait un vrai calcul. Quelle correction est la bonne ?
      ```go
      func BenchmarkHash(b *testing.B) {
      	for i := 0; i < b.N; i++ {
      		hash("bonjour")
      	}
      }
      ```
    choices:
      - {text: "Passer à `for b.Loop()`, qui empêche le compilateur d'éliminer l'appel", correct: true}
      - {text: "Augmenter `-benchtime`, pour que la mesure dure assez longtemps", correct: false}
      - {text: "Ajouter `b.ReportAllocs()`, pour forcer la mesure de l'appel", correct: false}
      - {text: "Appeler `runtime.GC()` avant la boucle, pour partir d'un tas propre", correct: false}
    answer: "```go\nfunc BenchmarkHash(b *testing.B) {\n\tfor b.Loop() {\n\t\thash(\"bonjour\")\n\t}\n}\n```\nLe compilateur avait supprimé l'appel, dont le résultat n'était pas utilisé ; b.Loop empêche cette élimination."
  - key: bug-etat
    format: bug-fix
    question: |-
      Le benchmark du tri devient anormalement rapide. Quelle correction est la bonne ?
      ```go
      donnees := genererDonnees(10_000)
      for b.Loop() {
      	slices.Sort(donnees)
      }
      ```
    choices:
      - {text: "Trier à chaque tour une copie, faite avec `slices.Clone(donnees)`", correct: true}
      - {text: "Revenir à `for i := 0; i < b.N; i++`, qui repart de données neuves", correct: false}
      - {text: "Utiliser `sort.Ints` plutôt que `slices.Sort`, qui garde un état", correct: false}
      - {text: "Appeler `b.ResetTimer()` au début de chaque tour de la boucle", correct: false}
    answer: "```go\ndonnees := genererDonnees(10_000)\nfor b.Loop() {\n\tcopie := slices.Clone(donnees)\n\tslices.Sort(copie)\n}\n```\nDès le deuxième tour, on triait des données déjà triées. Chaque itération travaille sur une copie (dont le coût,\nmesuré aussi, peut être évalué à part)."
  - key: bug-une-mesure
    format: bug-fix
    question: |-
      Un collègue conclut à un gain de 3 % à partir de ces deux commandes. Que lui proposes-tu ?
      ```
      go test -bench=Encoder > avant.txt
      go test -bench=Encoder > apres.txt
      ```
    choices:
      - {text: "Dix exécutions par version (`-count=10`), comparées avec benchstat", correct: true}
      - {text: "Garder la plus rapide de deux exécutions pour chaque version", correct: false}
      - {text: "Une seule exécution par version, mais avec `-benchtime=60s`", correct: false}
      - {text: "Comparer à la main les moyennes des deux fichiers de résultats", correct: false}
    answer: |-
      ```
      go test -run='^$' -bench=Encoder -count=10 > avant.txt
      go test -run='^$' -bench=Encoder -count=10 > apres.txt
      benchstat avant.txt apres.txt
      ```
      Une seule mesure ne dit rien du bruit ; dix exécutions et benchstat disent si la différence est significative.
  - key: scenario-demarche
    format: scenario
    question: Comment démontres-tu qu'une optimisation apporte un gain ?
    choices:
      - {text: "Un benchmark réaliste, dix exécutions avant et après, benchstat, puis la production", correct: true}
      - {text: "Une exécution avant et une après : si le temps baisse, le gain est démontré", correct: false}
      - {text: "Un profil CPU après le changement : si la fonction n'est plus en tête, c'est gagné", correct: false}
      - {text: "Le ressenti des utilisateurs après le déploiement, la seule mesure qui compte", correct: false}
    answer: "Un benchmark réaliste (entrées issues de la production), lancé dix fois avant et dix fois après (`-count=10 -benchmem`), comparé avec benchstat, qui donne la variation et sa significativité. Puis je vérifie le gain en production : une fonction peut gagner 30 % sans que le service ne gagne rien."
  - key: scenario-micro
    format: scenario
    question: Quelles sont les limites des micro-benchmarks ?
    choices:
      - {text: "Code isolé, caches chauds, petites données : ils comparent, sans prédire la production", correct: true}
      - {text: "Aucune : un micro-benchmark bien écrit prédit fidèlement la performance du service", correct: false}
      - {text: "Ils ne mesurent que le temps d'exécution, jamais les allocations de la fonction", correct: false}
      - {text: "Ils ne fonctionnent que sur des fonctions sans paramètre ni valeur de retour", correct: false}
    answer: "Ils mesurent du code isolé, avec des caches chauds, des données petites ou toujours les mêmes, sans le GC des autres requêtes. Utiles pour comparer deux versions d'une fonction, pas pour prédire la performance d'un service : je les complète par des profils de production et des tests de charge."
  - key: scenario-ci
    format: scenario
    question: Faut-il lancer les benchmarks dans la CI ?
    choices:
      - {text: "Pour vérifier qu'ils tournent (`-benchtime=1x`) ; les mesures fines, sur une machine dédiée", correct: true}
      - {text: "Oui, et faire échouer la pull request dès que le temps augmente de plus de 2 %", correct: false}
      - {text: "Non : les benchmarks ne s'exécutent qu'en local, la CI ne sait pas les lancer", correct: false}
      - {text: "Oui, une seule fois par pull request, comparée au résultat du dernier merge", correct: false}
    answer: "Les machines de CI partagées sont bruyantes : les mesures absolues y varient de 10 % ou plus. En CI, je vérifie surtout que les benchmarks compilent et tournent (`-benchtime=1x`) ; pour les chemins critiques, une machine dédiée, plusieurs exécutions et benchstat, avec une alerte sur les seules régressions nettes."
  - key: scenario-parallele
    format: scenario
    question: Comment mesures-tu la performance d'un cache appelé par toutes les requêtes ?
    choices:
      - {text: "Avec `b.RunParallel`, un mélange réaliste, `-cpu=1,4,8` et `-mutexprofile`", correct: true}
      - {text: "Avec un benchmark séquentiel, plus simple à lire et plus reproductible", correct: false}
      - {text: "Avec `-count=100`, qui simule cent requêtes qui arrivent en même temps", correct: false}
      - {text: "Avec un `time.Since` autour de chaque appel au cache, en production", correct: false}
    answer: "Avec `b.RunParallel` : chaque goroutine appelle le cache dans sa boucle `pb.Next()`, avec un mélange de lectures et d'écritures proche de la production. `-cpu=1,4,8` montre si le débit passe à l'échelle, et `-mutexprofile` la contention ; un benchmark séquentiel cacherait le verrou."
