notion: reduire-allocations
lesson: |-
  Chaque allocation sur le tas coûte deux fois : à l'allocation, puis au **ramasse-miettes** qui doit la retrouver.
  Sur un chemin chaud, réduire les allocations est souvent l'optimisation la plus rentable. Les techniques
  principales :

  **Préallouer** quand on connaît la taille :

  ```go
  ids := make([]string, 0, len(commandes)) // une allocation au lieu d'une dizaine
  index := make(map[string]Commande, len(commandes))
  ```

  **Réutiliser** un tampon plutôt que d'en créer un à chaque appel :

  ```go
  buf = buf[:0]                    // garde la capacité
  buf = strconv.AppendInt(buf, n, 10)
  ```

  **Construire les chaînes** avec `strings.Builder` (avec `Grow` si la taille est connue) plutôt qu'avec `+=` dans une
  boucle, et **éviter `fmt`** sur le chemin chaud : `strconv.Itoa` au lieu de `fmt.Sprintf("%d", n)`.

  **Éviter les conversions** répétées entre `string` et `[]byte`, qui copient (le compilateur en évite certaines, comme
  `m[string(b)]` pour une recherche dans une map).

  **Préférer les valeurs** : un `[]Point` est un seul bloc, un `[]*Point` une allocation par élément et des pointeurs à
  suivre pour le GC.

  **sync.Pool** pour des objets temporaires coûteux, en dernier recours.

  Toujours **mesurer** : `-benchmem` avant et après, un profil `alloc_space` pour trouver les points chauds, et
  `-gcflags=-m` pour comprendre pourquoi une valeur s'échappe.

  **En entretien** : « Préallouer, réutiliser, Builder et strconv plutôt que fmt, éviter les conversions string/[]byte,
  des valeurs plutôt que des pointeurs ; mesurer avec -benchmem et le profil d'allocations. »
cards:
  - key: reduire-allocations
    format: course
    question: "Comment réduire les allocations d'un chemin chaud ?"
    choices:
      - {text: "Préallouer, réutiliser les tampons, `strings.Builder`, `strconv` plutôt que `fmt`", correct: true}
      - {text: "Passer toutes les valeurs par pointeur, pour qu'aucune ne soit plus copiée", correct: false}
      - {text: "Remplacer les structs par des interfaces, plus légères à manipuler", correct: false}
      - {text: "Appeler `runtime.GC()` souvent, pour libérer les allocations au fil de l'eau", correct: false}
    answer: "Préallouer, réutiliser les tampons, `strings.Builder`, `strconv` plutôt que `fmt`, éviter les échappements. Des pointeurs ou des interfaces partout feraient plutôt allouer davantage."
  - key: fmt-sprintf-couteux
    format: course
    question: "Pourquoi `fmt.Sprintf` alloue-t-il plus qu'une concaténation avec `strconv` ?"
    choices:
      - {text: "Il passe par la réflexion et convertit ses arguments en interfaces", correct: true}
      - {text: "Il écrit d'abord sur la sortie standard, puis relit le texte écrit", correct: false}
      - {text: "Il lance une goroutine par appel pour formater ses arguments", correct: false}
      - {text: "Il copie la chaîne de format dans un fichier temporaire", correct: false}
    answer: "Il passe par la réflexion et convertit les arguments en interfaces, ce qui alloue, et il analyse la chaîne de format à chaque appel."
  - key: reduire-contention-map-partagee
    format: course
    question: Comment réduire la contention sur une map partagée ?
    choices:
      - {text: "La partitionner en shards, chacun avec son verrou, ou raccourcir la section critique", correct: true}
      - {text: "Remplacer le `sync.Mutex` par un `sync.RWMutex`, même pour les écritures", correct: false}
      - {text: "Supprimer le verrou, les maps de Go étant sûres entre goroutines", correct: false}
      - {text: "Augmenter GOMAXPROCS, pour que plus de goroutines tiennent le verrou", correct: false}
    answer: "La partitionner en plusieurs shards, chacun avec son verrou, ou réduire la section critique. Une map Go n'est pas sûre entre goroutines sans verrou."
  - key: voir-decisions-inlining
    format: course
    question: "Comment voir les décisions d'inlining du compilateur ?"
    choices:
      - {text: "`go build -gcflags=-m`", correct: true}
      - {text: "`go vet -inline`", correct: false}
      - {text: "`go test -benchmem`", correct: false}
      - {text: "`GODEBUG=inline=1`", correct: false}
    answer: "`go build -gcflags=-m` affiche les fonctions inlinées (« can inline », « inlining call to ») en plus des décisions d'échappement ; `-m=2` donne les raisons."
  - key: slice-structs-slice-pointeurs
    format: course
    question: "Pour une collection de petites structs, faut-il préférer `[]T` ou `[]*T` ?"
    choices:
      - {text: "`[]T` : meilleure localité et moins de travail pour le GC, sauf éléments gros ou partagés", correct: true}
      - {text: "`[]*T` : copier un pointeur coûte toujours moins cher que copier une struct", correct: false}
      - {text: "`[]*T` : le GC ne parcourt jamais les pointeurs rangés dans une slice", correct: false}
      - {text: "Aucune différence : le compilateur transforme l'une en l'autre", correct: false}
    answer: "Une slice de structs, pour la localité mémoire et moins de travail pour le GC (un seul bloc, sans pointeurs à suivre), sauf si les éléments sont gros ou partagés."
  - key: endpoint-json-tres-sollicite-consomme-trop
    format: scenario
    question: "Un endpoint JSON très sollicité consomme trop de CPU. Comment l'optimises-tu ?"
    choices:
      - {text: "Profil d'abord ; puis `json.Encoder` sur le `ResponseWriter`, réponse allégée, tampons réutilisés", correct: true}
      - {text: "Réécrire d'emblée l'encodage à la main, sans réflexion, avant toute mesure", correct: false}
      - {text: "Passer tout de suite à Protobuf pour tous les clients, internes comme externes", correct: false}
      - {text: "Ajouter des réplicas jusqu'à ce que le CPU de chaque instance redescende", correct: false}
    answer: "D'abord un profil CPU, pour vérifier que l'encodage est le vrai coût. Puis, par ordre d'effort : encoder directement dans le `ResponseWriter` avec un `json.Encoder`, alléger la réponse, réutiliser les tampons ; en dernier recours, un encodeur généré ou Protobuf pour les clients internes. Chaque étape validée par benchstat, puis en production."
  - key: vf-builder
    format: true-false
    question: Concaténer des chaînes avec += dans une boucle peut allouer une nouvelle chaîne à chaque tour.
    truth: true
    answer: Les chaînes sont immuables ; strings.Builder évite ces copies.
  - key: vf-conversion
    format: true-false
    question: '`[]byte(s)` partage toujours la mémoire de la chaîne s, sans copie.'
    truth: false
    answer: Il copie en général, car la chaîne est immuable ; le compilateur évite la copie dans quelques cas.
  - key: vf-map-taille
    format: true-false
    question: '`make(map[K]V, n)` réserve la place pour environ n éléments.'
    truth: true
    answer: Ce qui évite les agrandissements successifs.
  - key: vf-pointeurs
    format: true-false
    question: Un `[]*Point` de 1 000 éléments demande en général plus d'allocations qu'un `[]Point`.
    truth: true
    answer: Une par élément, plus le tableau de pointeurs.
  - key: qcm-techniques
    format: multiple-choice
    question: "Lesquelles de ces techniques réduisent les allocations ?"
    choices:
      - text: '`make([]T, 0, n)` quand n est connu'
        correct: true
      - text: '`strconv.Itoa` au lieu de `fmt.Sprintf("%d", n)`'
        correct: true
      - text: '`buf = buf[:0]` pour réutiliser un tampon'
        correct: true
      - text: Remplacer les structs par des interfaces
        correct: false
    answer: La conversion vers une interface fait souvent allouer.
  - key: qcm-mesurer
    format: multiple-choice
    question: "Quel outil montre quelles fonctions allouent le plus, en cumulé ?"
    choices:
      - {text: "Un profil heap en `alloc_space`", correct: true}
      - {text: "Un profil heap en `inuse_space`", correct: false}
      - {text: "Un profil CPU", correct: false}
      - {text: "`go vet`", correct: false}
    answer: "Le profil heap en `alloc_space` (ou `alloc_objects`) cumule les allocations par fonction ; `-benchmem` les compte dans un benchmark, `-gcflags=-m` explique les échappements. `inuse_space` ne montre que le vivant, et `go vet` ne mesure rien."
  - key: qcm-fmt
    format: multiple-choice
    question: Pourquoi fmt.Sprintf est-il coûteux sur un chemin chaud ?
    choices:
      - {text: "Ses arguments passent par des interfaces, ce qui les fait souvent allouer", correct: true}
      - {text: "Il fait un appel système à chaque formatage de chaîne", correct: false}
      - {text: "Il prend un verrou global, partagé avec `fmt.Println`", correct: false}
      - {text: "Il compile sa chaîne de format en expression régulière", correct: false}
    answer: "Ses arguments passent par des interfaces (souvent sur le tas), et il analyse la chaîne de format à chaque appel ; `strconv` et `strings.Builder` évitent ces deux coûts."
  - key: qcm-quand
    format: multiple-choice
    question: Quand faut-il optimiser les allocations ?
    choices:
      - {text: "Sur un chemin chaud identifié par un profil", correct: true}
      - {text: "Partout, dès l'écriture du code", correct: false}
      - {text: "Jamais : le GC s'en charge", correct: false}
      - {text: "Seulement juste avant une mise en production", correct: false}
    answer: "Sur un chemin chaud montré par un profil, ou quand le GC prend une part importante du CPU. Ailleurs, la lisibilité passe avant."
  - key: code-prealloc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ids := make([]int, 0, 100)
      for i := range 100 {
      	ids = append(ids, i)
      }
      fmt.Println(len(ids), cap(ids))
      ```
    choices:
      - {text: "`100 100`", correct: true}
      - {text: "`100 128`", correct: false}
      - {text: "`100 200`", correct: false}
      - {text: "`0 100`", correct: false}
    answer: "`100 100` : la capacité suffisait, `append` n'a jamais réalloué, donc la capacité n'a pas grandi."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tids := make([]int, 0, 100)\n\tfor i := range 100 {\n\t\tids = append(ids, i)\n\t}\n\tfmt.Println(len(ids), cap(ids))\n}\n"
      output: 100 100
  - key: code-builder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var b strings.Builder
      b.Grow(16)
      for range 3 {
      	b.WriteString("go")
      }
      b.WriteByte('!')
      fmt.Println(b.String(), b.Len())
      ```
    choices:
      - {text: "`gogogo! 7`", correct: true}
      - {text: "`gogogo! 16`", correct: false}
      - {text: "`gogogo! 4`", correct: false}
      - {text: "`go! 3`", correct: false}
    answer: "`gogogo! 7` : `Len` donne les octets écrits, 7 ; `Grow(16)` réserve de la capacité sans changer la longueur."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar b strings.Builder\n\tb.Grow(16)\n\tfor range 3 {\n\t\tb.WriteString(\"go\")\n\t}\n\tb.WriteByte('!')\n\tfmt.Println(b.String(), b.Len())\n}\n"
      output: gogogo! 7
  - key: code-reutiliser
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      buf := make([]int, 0, 8)
      buf = append(buf, 1, 2, 3)
      avant := cap(buf)
      buf = buf[:0]
      buf = append(buf, 9)
      fmt.Println(len(buf), buf[0], cap(buf) == avant)
      ```
    choices:
      - {text: "`1 9 true`", correct: true}
      - {text: "`1 9 false`", correct: false}
      - {text: "`4 1 true`", correct: false}
      - {text: "`1 1 true`", correct: false}
    answer: "`1 9 true` : `buf[:0]` vide la slice mais garde son tableau et sa capacité ; `append` réécrit au début."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tbuf := make([]int, 0, 8)\n\tbuf = append(buf, 1, 2, 3)\n\tavant := cap(buf)\n\tbuf = buf[:0]\n\tbuf = append(buf, 9)\n\tfmt.Println(len(buf), buf[0], cap(buf) == avant)\n}\n"
      output: 1 9 true
  - key: code-append-int
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      buf := make([]byte, 0, 32)
      for _, n := range []int64{7, 42, -3} {
      	buf = strconv.AppendInt(buf, n, 10)
      	buf = append(buf, ';')
      }
      fmt.Println(string(buf), cap(buf))
      ```
    choices:
      - {text: "`7;42;-3; 32`", correct: true}
      - {text: "`7;42;-3; 64`", correct: false}
      - {text: "`7;42;-3; 8`", correct: false}
      - {text: "`7 42 -3 32`", correct: false}
    answer: "`7;42;-3; 32` : les nombres sont écrits dans le même tampon, sans chaîne intermédiaire, et les 8 octets tiennent dans la capacité de 32."
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tbuf := make([]byte, 0, 32)\n\tfor _, n := range []int64{7, 42, -3} {\n\t\tbuf = strconv.AppendInt(buf, n, 10)\n\t\tbuf = append(buf, ';')\n\t}\n\tfmt.Println(string(buf), cap(buf))\n}\n"
      output: 7;42;-3; 32
  - key: bug-concat
    format: bug-fix
    question: |-
      La génération d'un CSV de 100 000 lignes prend plusieurs secondes. Quelle correction est la bonne ?
      ```go
      var csv string
      for _, l := range lignes {
      	csv += l.Nom + ";" + strconv.Itoa(l.Age) + "\n"
      }
      ```
    choices:
      - {text: "Écrire dans un `strings.Builder`, avec `Grow`, au lieu de `+=`", correct: true}
      - {text: "Construire chaque ligne avec `fmt.Sprintf`, puis garder le `+=`", correct: false}
      - {text: "Remplacer `strconv.Itoa` par `fmt.Sprint`, plus adapté au texte", correct: false}
      - {text: "Lancer une goroutine par ligne, pour concaténer en parallèle", correct: false}
    answer: "```go\nvar b strings.Builder\nb.Grow(len(lignes) * 32)\nfor _, l := range lignes {\n\tb.WriteString(l.Nom)\n\tb.WriteByte(';')\n\tb.WriteString(strconv.Itoa(l.Age))\n\tb.WriteByte('\\n')\n}\ncsv := b.String()\n```\nChaque += recopiait toute la chaîne déjà construite : un coût quadratique. Le Builder écrit dans un seul tampon.\n(Pour un vrai fichier, `encoding/csv` sur un `bufio.Writer` serait encore mieux.)"
  - key: bug-append
    format: bug-fix
    question: |-
      Le profil montre de nombreuses réallocations dans cette conversion. Quelle correction est la bonne ?
      ```go
      var dtos []CommandeDTO
      for _, c := range commandes {
      	dtos = append(dtos, versDTO(c))
      }
      ```
    choices:
      - {text: "Préallouer avec `make([]CommandeDTO, 0, len(commandes))`", correct: true}
      - {text: "Préallouer avec `make([]CommandeDTO, len(commandes))`, puis `append`", correct: false}
      - {text: "Remplacer `append` par `copy`, qui n'alloue jamais rien", correct: false}
      - {text: "Déclarer `dtos` en `[]*CommandeDTO`, pour copier moins", correct: false}
    answer: |-
      ```go
      dtos := make([]CommandeDTO, 0, len(commandes))
      for _, c := range commandes {
      	dtos = append(dtos, versDTO(c))
      }
      ```
      La taille finale est connue : une seule allocation au lieu d'une série d'agrandissements. Avec une longueur de `len(commandes)` au lieu d'une capacité, `append` ajouterait après autant de valeurs zéro.
  - key: bug-sprintf
    format: bug-fix
    question: |-
      La clé de cache est construite à chaque requête et apparaît en haut du profil d'allocations. Quelle correction est la bonne ?
      ```go
      cle := fmt.Sprintf("%s:%d", utilisateur, page)
      ```
    choices:
      - {text: "`utilisateur + \":\" + strconv.Itoa(page)`, sans format à analyser", correct: true}
      - {text: "`fmt.Sprint(utilisateur, \":\", page)`, qui n'analyse aucun format", correct: false}
      - {text: "`fmt.Sprintf(\"%v:%v\", utilisateur, page)`, plus général que `%s`", correct: false}
      - {text: "`strings.Join([]string{utilisateur, fmt.Sprint(page)}, \":\")`", correct: false}
    answer: |-
      ```go
      cle := utilisateur + ":" + strconv.Itoa(page)
      ```
      La concaténation d'un petit nombre de morceaux et strconv évitent l'analyse du format et le passage par des
      interfaces. (Une struct comparable comme clé de map éviterait même la chaîne.)
  - key: bug-conversion
    format: bug-fix
    question: |-
      Le parseur convertit chaque ligne en string pour la tester, et alloue énormément. Quelle correction est la bonne ?
      ```go
      for sc.Scan() {
      	ligne := string(sc.Bytes())
      	if strings.HasPrefix(ligne, "#") {
      		continue
      	}
      	traiter(sc.Bytes())
      }
      ```
    choices:
      - {text: "Tester les octets avec `bytes.HasPrefix`, sans conversion", correct: true}
      - {text: "Utiliser `sc.Text()`, qui renvoie la ligne sans la copier", correct: false}
      - {text: "Agrandir le tampon du scanner avec `sc.Buffer`", correct: false}
      - {text: "Convertir avec `strings.Clone(string(...))`, plus sûr", correct: false}
    answer: |-
      ```go
      for sc.Scan() {
      	ligne := sc.Bytes()
      	if bytes.HasPrefix(ligne, []byte("#")) {
      		continue
      	}
      	traiter(ligne)
      }
      ```
      Le package `bytes` offre les mêmes fonctions que `strings` : plus besoin de copier chaque ligne dans une string. `sc.Text()` alloue, lui aussi, une string par ligne.
  - key: scenario-json
    format: scenario
    question: Ton endpoint qui renvoie du JSON alloue beaucoup. Quelles pistes explores-tu ?
    choices:
      - {text: "Mesurer, puis `json.NewEncoder(w)`, des structs plutôt que des `map[string]any`, et préallouer", correct: true}
      - {text: "Passer les réponses en `map[string]any`, plus souples et plus rapides à encoder", correct: false}
      - {text: "Encoder dans une string avec `json.Marshal`, puis la convertir en `[]byte` pour l'écrire", correct: false}
      - {text: "Désactiver le GC le temps de l'encodage de chaque réponse, puis le réactiver", correct: false}
    answer: "Je mesure d'abord (`-benchmem`, profil `alloc_space`). Pistes : encoder directement dans le `ResponseWriter` avec `json.NewEncoder(w)`, réutiliser des tampons, préférer des structs aux `map[string]any`, préallouer les slices de la réponse ; une bibliothèque plus rapide seulement après mesure."
  - key: scenario-equilibre
    format: scenario
    question: Comment arbitres-tu entre lisibilité et réduction des allocations ?
    choices:
      - {text: "Code clair et bonnes habitudes gratuites ; l'astuce seulement là où un profil la justifie", correct: true}
      - {text: "La performance d'abord : chaque fonction doit allouer le moins possible, partout", correct: false}
      - {text: "La lisibilité toujours : le GC de Go rend le coût des allocations négligeable", correct: false}
      - {text: "Optimiser à la revue de code, selon l'intuition du relecteur le plus expérimenté", correct: false}
    answer: "J'écris le code le plus clair, avec les habitudes qui ne coûtent rien (préallouer quand la taille est connue, `strings.Builder` dans les boucles). J'optimise davantage seulement là où un profil montre un coût, en isolant l'astuce dans une fonction commentée et couverte par un benchmark."
  - key: scenario-gc
    format: scenario
    question: Pourquoi réduire les allocations fait-il gagner plus que le temps de l'allocation elle-même ?
    choices:
      - {text: "Moins d'allocations, c'est moins de cycles du GC, moins de marquage et moins de mark assist", correct: true}
      - {text: "Chaque allocation fait un appel système, bien plus coûteux que l'allocation elle-même", correct: false}
      - {text: "Chaque allocation prend un verrou global, qui bloque toutes les autres goroutines", correct: false}
      - {text: "Chaque allocation déclenche un cycle complet du GC, avec une pause du programme", correct: false}
    answer: "Chaque octet alloué rapproche le tas de la cible du GC : moins d'allocations, c'est moins de cycles, moins de CPU de marquage et moins de mark assist qui ralentit les requêtes, plus une meilleure localité. Sur un service chargé, cela réduit nettement la latence p99, pas seulement la moyenne."
