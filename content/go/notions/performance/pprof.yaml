notion: pprof
lesson: |-
  **pprof** mesure où un programme passe son temps et alloue sa mémoire, à partir d'**échantillons**. Les profils
  principaux :

  | Profil | Ce qu'il montre |
  |---|---|
  | **CPU** | où le processeur passe son temps (échantillon toutes les 10 ms) |
  | **heap** | la mémoire : `inuse_space` (vivante maintenant) ou `alloc_space` (allouée depuis le début) |
  | **goroutine** | les piles de toutes les goroutines, pour trouver des fuites ou des blocages |
  | **block**, **mutex** | où les goroutines attendent (channels, verrous) ; à activer |

  Pour les obtenir :

  ```go
  import _ "net/http/pprof" // enregistre /debug/pprof/ sur http.DefaultServeMux

  go http.ListenAndServe("localhost:6060", nil) // jamais exposé publiquement
  ```

  ```
  go tool pprof -http=:8080 http://localhost:6060/debug/pprof/profile?seconds=30
  go test -bench=. -cpuprofile=cpu.out -memprofile=mem.out
  ```

  Dans l'interface, la vue **flame graph** et la commande **`top`** montrent les fonctions les plus coûteuses : `flat`
  (dans la fonction elle-même) et `cum` (avec ce qu'elle appelle). `list Fonction` affiche le coût ligne par ligne.

  Les pièges : un profil CPU ne montre **pas** le temps passé à **attendre** (réseau, verrous) ; pour une latence élevée
  avec un CPU bas, il faut les profils block et mutex ou une **trace**. Et pprof donne accès à l'intérieur du
  programme : son port reste interne (ou protégé).

  **En entretien** : « CPU, heap, goroutine, block, mutex ; net/http/pprof sur un port interne ; flat contre cum ; le
  profil CPU ne voit pas l'attente. »
cards:
  - key: profils-fournit-pprof
    format: course
    question: Quels profils fournit pprof ?
    choices:
      - {text: "cpu, heap, allocs, goroutine, block, mutex, threadcreate, et goroutineleak en Go 1.27", correct: true}
      - {text: "cpu et heap seulement ; les blocages se lisent dans les journaux du runtime", correct: false}
      - {text: "cpu, heap et gc, ce dernier détaillant chaque pause du ramasse-miettes", correct: false}
      - {text: "Un seul profil global, que l'on filtre ensuite par type dans l'interface web", correct: false}
    answer: "cpu, heap, allocs, goroutine, block, mutex, threadcreate, et goroutineleak en Go 1.27. Les cycles du GC se voient dans `gctrace` et la trace d'exécution, pas dans un profil dédié."
  - key: inuse-space-vs-alloc-space
    format: course
    question: "Quelle différence entre `inuse_space` et `alloc_space` dans un profil heap ?"
    choices:
      - {text: "La mémoire vivante maintenant, contre tout ce qui a été alloué depuis le démarrage", correct: true}
      - {text: "La mémoire du tas, contre la mémoire des piles des goroutines", correct: false}
      - {text: "La mémoire allouée par le code Go, contre celle allouée par cgo", correct: false}
      - {text: "La mémoire réservée au système, contre celle qui lui a été rendue", correct: false}
    answer: "`inuse_space` montre la mémoire vivante au moment du profil ; `alloc_space` cumule tout ce qui a été alloué depuis le démarrage, même libéré depuis."
  - key: exposer-pprof-service
    format: course
    question: "Comment exposer pprof dans un service ?"
    choices:
      - {text: "Importer `net/http/pprof`, sur un port d'administration non public", correct: true}
      - {text: "Lancer le service avec `go run -pprof`, sur le port de l'API", correct: false}
      - {text: "Ajouter `GODEBUG=pprof=1` dans l'environnement au démarrage", correct: false}
      - {text: "Rien : `/debug/pprof` est exposé d'office par tout serveur HTTP", correct: false}
    answer: "Importer `net/http/pprof` (qui enregistre ses routes `/debug/pprof/`), sur un port d'administration non public. Sans cet import, rien n'est exposé."
  - key: exposer-pprof-publiquement
    format: course
    question: "Pourquoi ne pas exposer pprof publiquement ?"
    choices:
      - {text: "Il révèle le code et l'état interne, et peut servir à charger le service", correct: true}
      - {text: "Il désactive le GC tant qu'un client reste connecté à `/debug/pprof`", correct: false}
      - {text: "Il ralentit chaque requête, même quand personne ne demande de profil", correct: false}
      - {text: "Il ne fonctionne pas en HTTPS, et ses données circulent donc en clair", correct: false}
    answer: "Il révèle le code et l'état interne, et un profil CPU ou une trace demandés en boucle peuvent charger le service. Tant que personne ne demande de profil, il ne coûte presque rien."
  - key: service-latence-p99-elevee-alors-cpu
    format: scenario
    question: "Le service a une latence p99 élevée alors que le CPU est à 20 %. Que cherches-tu d'abord ?"
    choices:
      - {text: "Ce qu'il attend : profils `block`, `mutex` et `goroutine`, puis une trace", correct: true}
      - {text: "Ce qui calcule : un profil CPU, pour trouver la fonction la plus coûteuse", correct: false}
      - {text: "Ce qui alloue : un profil heap en `inuse_space`, pour trouver une fuite", correct: false}
      - {text: "Rien : à 20 % de CPU, le service n'a pas de problème de performance", correct: false}
    answer: "CPU bas et latence haute : le programme attend. Les profils `block` et `mutex` montrent les attentes sur verrous et channels, le profil `goroutine` où elles s'accumulent (pool de connexions épuisé, appel sans délai), la trace si le GC ou l'ordonnanceur y sont pour quelque chose."
  - key: parle-moi-probleme-performance-as-resolu
    format: scenario
    question: "En entretien, on te demande de raconter un problème de performance que tu as résolu. Comment construis-tu ta réponse ?"
    choices:
      - {text: "Situation, tâche, action (mesure, profil, hypothèse, correction vérifiée), résultat mesuré", correct: true}
      - {text: "La liste des optimisations que je connais, sans m'attarder sur un cas précis", correct: false}
      - {text: "Le code de la correction, ligne par ligne, sans revenir sur le contexte", correct: false}
      - {text: "Le seul résultat, en pourcentage, sans détailler la démarche qui y a mené", correct: false}
    answer: "Avec la méthode STAR : la situation (le service, le symptôme mesuré), la tâche, l'action (métriques, profil ou trace, hypothèse, benchmark comparé avec benchstat, correction), puis le résultat mesuré en production et ce que j'en ai retenu."
  - key: terme-pprof
    format: course
    question: "Que désigne « pprof » ?"
    choices:
      - {text: "L'outil et le format des profils de Go : CPU, heap, goroutines, blocages", correct: true}
      - {text: "Le préprocesseur de Go, qui traite les directives `//go:` avant compilation", correct: false}
      - {text: "Le format des traces d'exécution, lues par la commande `go tool trace`", correct: false}
      - {text: "Le serveur de métriques Prometheus intégré au runtime de Go", correct: false}
    answer: "L'outil (`go tool pprof`) et le format des profils : CPU, heap, goroutines, blocages. Les traces d'exécution ont leur propre format et leur outil, `go tool trace`."
  - key: vf-attente
    format: true-false
    question: Un profil CPU montre le temps qu'une requête passe à attendre une réponse réseau.
    truth: false
    answer: Il ne voit que le temps passé sur le processeur ; l'attente se voit dans une trace ou les profils block.
  - key: vf-import
    format: true-false
    question: Importer `_ "net/http/pprof"` enregistre les routes /debug/pprof sur http.DefaultServeMux.
    truth: true
    answer: D'où l'intérêt de les servir sur un port interne séparé.
  - key: vf-block
    format: true-false
    question: Les profils block et mutex sont actifs par défaut.
    truth: false
    answer: On les active avec runtime.SetBlockProfileRate et runtime.SetMutexProfileFraction.
  - key: vf-flat
    format: true-false
    question: Dans pprof, « cum » inclut le temps passé dans les fonctions appelées.
    truth: true
    answer: « flat » ne compte que la fonction elle-même.
  - key: qcm-fuite
    format: multiple-choice
    question: Quel profil pour trouver une fuite de goroutines ?
    choices:
      - text: Le profil goroutine
        correct: true
      - text: Le profil CPU
        correct: false
      - text: Le profil heap en alloc_space
        correct: false
      - text: Le profil mutex
        correct: false
    answer: Il regroupe les goroutines par pile, avec leur nombre.
  - key: qcm-memoire
    format: multiple-choice
    question: "Quelle vue du profil heap choisir pour une mémoire qui monte sans redescendre ?"
    choices:
      - {text: "`inuse_space`", correct: true}
      - {text: "`alloc_space`", correct: false}
      - {text: "`alloc_objects`", correct: false}
      - {text: "Le profil CPU", correct: false}
    answer: "`inuse_space` montre ce qui est vivant maintenant, donc ce qui s'accumule. `alloc_space` cumule tout ce qui a été alloué, même libéré : c'est la vue pour réduire la pression sur le GC."
  - key: qcm-securite
    format: multiple-choice
    question: Comment exposer pprof sans risque en production ?
    choices:
      - {text: "Sur un port séparé, accessible seulement en interne", correct: true}
      - {text: "Sur le port public de l'API, sans protection", correct: false}
      - {text: "Sur le port public, derrière une URL difficile à deviner", correct: false}
      - {text: "Nulle part : on le désactive toujours en production", correct: false}
    answer: "Sur un port séparé, accessible en interne (ou derrière une authentification) : les profils révèlent le code et des données, et un profil CPU coûte des ressources. Une URL secrète n'est pas une protection."
  - key: qcm-obtenir
    format: multiple-choice
    question: "Lesquelles de ces façons permettent d'obtenir un profil CPU ?"
    choices:
      - text: '`go test -cpuprofile=cpu.out`'
        correct: true
      - text: '`/debug/pprof/profile?seconds=30` avec net/http/pprof'
        correct: true
      - text: '`pprof.StartCPUProfile(f)` dans le code'
        correct: true
      - text: '`go build -cpuprofile`'
        correct: false
    answer: Le profil se lit ensuite avec `go tool pprof`.
  - key: scenario-cpu
    format: scenario
    question: Le CPU de ton service est à 90 %. Comment trouves-tu la cause ?
    choices:
      - {text: "Un profil CPU de 30 s sur une instance chargée, lu avec `go tool pprof -http`", correct: true}
      - {text: "Une trace d'exécution de plusieurs minutes, qui liste les fonctions coûteuses", correct: false}
      - {text: "Un profil heap en `inuse_space`, qui montre les fonctions qui calculent", correct: false}
      - {text: "Des `time.Since` ajoutés partout, puis journalisés à chaque requête", correct: false}
    answer: "Un profil CPU de 30 secondes sur une instance chargée (`/debug/pprof/profile?seconds=30`), ouvert avec `go tool pprof -http` : le flame graph montre les piles les plus larges, `top` et `list` la fonction en cause. Si le GC est en haut (`mallocgc`, `gcBgMarkWorker`), je passe au profil heap en `alloc_space`."
  - key: scenario-memoire
    format: scenario
    question: La mémoire de ton service monte sans redescendre. Comment cherches-tu ?
    choices:
      - {text: "Deux profils heap `inuse_space` à quelques heures d'écart, comparés avec `-base`", correct: true}
      - {text: "Un profil CPU, qui montre les fonctions qui retiennent la mémoire", correct: false}
      - {text: "Un seul profil heap en `alloc_space`, qui cumule tout depuis le démarrage", correct: false}
      - {text: "Un `runtime.GC()` forcé chaque minute, pour voir si la mémoire redescend", correct: false}
    answer: "Deux profils heap en `inuse_space` à quelques heures d'écart, comparés avec `go tool pprof -base ancien.pb.gz nouveau.pb.gz` : la différence montre ce qui s'accumule (souvent un cache sans éviction). Je vérifie aussi le nombre de goroutines, car des goroutines bloquées retiennent leur mémoire."
