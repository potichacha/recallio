notion: pgo
lesson: |-
  L'**optimisation guidée par le profil** (*Profile-Guided Optimization*, **PGO**, stable depuis **Go 1.21**) donne au
  compilateur un **profil CPU** de production, pour qu'il optimise davantage les chemins vraiment chauds.

  ```
  # 1. récupérer un profil CPU représentatif de la production
  curl -o cpu.pprof "http://service:6060/debug/pprof/profile?seconds=30"

  # 2. le placer dans le dossier du package main, sous ce nom
  mv cpu.pprof cmd/serveur/default.pgo

  # 3. compiler comme d'habitude : -pgo=auto (le défaut) prend default.pgo
  go build ./cmd/serveur
  ```

  Ce que le compilateur en fait :
  - il **inline** davantage les fonctions appelées souvent ;
  - il **dévirtualise** les appels d'interface les plus fréquents (un test de type rapide vers l'implémentation la plus
    courante) ;
  - d'autres optimisations s'y ajoutent au fil des versions.

  Les gains typiques sont de **2 à 14 %** de CPU, sans changer le code. Le binaire grossit un peu, et la compilation
  est plus lente.

  Les bonnes pratiques :
  - un profil **représentatif** de la production (pas d'un benchmark isolé), fusionné depuis plusieurs instances
    (`go tool pprof -proto a.pprof b.pprof > default.pgo`) ;
  - **versionner** `default.pgo` et le **rafraîchir** de temps en temps ; un profil un peu ancien reste utile (le
    compilateur tolère le code qui a changé) ;
  - mesurer le gain, comme toute optimisation.

  **En entretien** : « Un profil CPU de production nommé default.pgo dans le package main ; inlining et dévirtualisation
  des chemins chauds ; 2 à 14 % de CPU en moins sans toucher au code. »
cards:
  - key: pgo
    format: course
    question: "Qu'est-ce que le PGO en Go ?"
    choices:
      - {text: "L'optimisation guidée par un profil CPU de production, placé en `default.pgo`", correct: true}
      - {text: "Un ramasse-miettes optimisé, activé pour les programmes très parallèles", correct: false}
      - {text: "Un mode du compilateur qui désactive les vérifications de bornes", correct: false}
      - {text: "Un profileur qui optimise le code pendant l'exécution, comme un JIT", correct: false}
    answer: "L'optimisation guidée par un profil CPU de production (`default.pgo`), pour mieux inliner et dévirtualiser les chemins chauds. Tout se passe à la compilation : Go n'a pas de JIT."
  - key: terme-pgo
    format: course
    question: "Que veut dire le sigle PGO ?"
    choices:
      - {text: "Profile-Guided Optimization : une optimisation guidée par un profil", correct: true}
      - {text: "Parallel Garbage Optimization : un GC optimisé pour plusieurs cœurs", correct: false}
      - {text: "Package Graph Optimization : l'élagage des packages non utilisés", correct: false}
      - {text: "Pointer-Guided Optimization : l'analyse d'échappement des pointeurs", correct: false}
    answer: "Profile-Guided Optimization : le compilateur se sert d'un profil CPU (`default.pgo`) pour optimiser les chemins chauds."
  - key: optimisations
    format: course
    question: Quelles optimisations le compilateur fait-il grâce au PGO ?
    choices:
      - {text: "Plus d'inlining des fonctions chaudes, et la dévirtualisation des appels fréquents", correct: true}
      - {text: "La compilation à la volée des fonctions chaudes, comme le JIT de la JVM", correct: false}
      - {text: "Un GC réglé selon le profil, avec un GOGC calculé pour chaque service", correct: false}
      - {text: "La suppression des allocations repérées par le profil heap de production", correct: false}
    answer: "Il inline davantage les fonctions chaudes et dévirtualise les appels d'interface les plus fréquents (un test de type rapide vers l'implémentation la plus courante), entre autres. Le profil est un profil CPU, pas heap."
  - key: default
    format: course
    question: Où placer le profil pour que go build l'utilise automatiquement ?
    choices:
      - {text: "Dans le dossier du package main, sous le nom `default.pgo`", correct: true}
      - {text: "À la racine du module, sous le nom `profile.pprof`", correct: false}
      - {text: "Dans `$GOPATH/pgo/`, partagé par tous les projets", correct: false}
      - {text: "N'importe où, tant que `go.mod` déclare son chemin", correct: false}
    answer: "Dans le dossier du package main, sous le nom `default.pgo` : l'option `-pgo=auto`, active par défaut, le prend en compte."
  - key: vf-121
    format: true-false
    question: Le PGO est disponible de façon stable depuis Go 1.21.
    truth: true
    answer: Il était en aperçu dans Go 1.20.
  - key: vf-ancien
    format: true-false
    question: Un profil devient inutilisable dès que le code change.
    truth: false
    answer: Le compilateur tolère les changements ; on rafraîchit le profil de temps en temps.
  - key: vf-benchmark
    format: true-false
    question: Le meilleur profil pour le PGO vient d'un micro-benchmark isolé.
    truth: false
    answer: Il doit représenter la charge réelle de production.
  - key: vf-code
    format: true-false
    question: Le PGO demande de modifier le code source.
    truth: false
    answer: Il suffit d'ajouter le profil au build.
  - key: qcm-etapes
    format: multiple-choice
    question: "Une fois le profil placé en `default.pgo` dans le dossier du package main, comment compiler avec le PGO ?"
    choices:
      - {text: "Avec un `go build` normal", correct: true}
      - {text: "Avec `go build -pgo=on`, obligatoire", correct: false}
      - {text: "Avec des annotations `//go:pgo` dans le code", correct: false}
      - {text: "Avec la commande `go tool pgo build`", correct: false}
    answer: "`-pgo=auto` est actif par défaut : un `go build` normal trouve `default.pgo`. Il suffit de récupérer un profil CPU de production et de le placer là ; aucune annotation n'existe."
  - key: qcm-gains
    format: multiple-choice
    question: "Quel gain attendre du PGO ?"
    choices:
      - {text: "Quelques pourcents de CPU en moins sur les chemins chauds", correct: true}
      - {text: "Une mémoire utilisée divisée par deux, grâce au profil", correct: false}
      - {text: "Des pauses du GC divisées par dix sur tout le service", correct: false}
      - {text: "Un binaire deux fois plus petit, débarrassé du code froid", correct: false}
    answer: "Typiquement 2 à 14 % de CPU en moins, au prix d'un binaire un peu plus gros et d'une compilation un peu plus lente."
  - key: qcm-profil
    format: multiple-choice
    question: "Quel profil donner au PGO ?"
    choices:
      - {text: "Un profil CPU de production, capturé sous une charge représentative", correct: true}
      - {text: "Un profil heap de production, capturé au pic de la mémoire", correct: false}
      - {text: "Un profil de goroutines, capturé au démarrage du service", correct: false}
      - {text: "Un profil CPU de benchmark, capturé sur le poste du développeur", correct: false}
    answer: "Le PGO utilise un profil CPU, de préférence fusionné depuis plusieurs instances de production pendant une charge représentative. Un profil de benchmark reflète mal les chemins chauds réels."
  - key: qcm-desactiver
    format: multiple-choice
    question: Comment compiler sans le PGO alors qu'un default.pgo est présent ?
    choices:
      - {text: "`go build -pgo=off`", correct: true}
      - {text: "`GOGC=off go build`", correct: false}
      - {text: "`go build -gcflags=-N`", correct: false}
      - {text: "`go build -ldflags=-s`", correct: false}
    answer: "`-pgo=off` désactive le PGO, comme supprimer `default.pgo` ; `-pgo=fichier.pprof` choisit un autre profil. `-gcflags=-N` coupe toutes les optimisations, pas seulement le PGO."
  - key: scenario-mise-en-place
    format: scenario
    question: Comment mets-tu en place le PGO sur un service en production ?
    choices:
      - {text: "Des profils CPU de plusieurs instances, fusionnés en `default.pgo`, versionnés et rafraîchis", correct: true}
      - {text: "Un profil CPU de benchmark local, régénéré à chaque build de la CI", correct: false}
      - {text: "Un profil heap de production, placé dans le dossier de chaque package", correct: false}
      - {text: "Un drapeau `-pgo` en production, qui optimise le binaire pendant qu'il tourne", correct: false}
    answer: "Je collecte des profils CPU de 30 secondes sur plusieurs instances en charge typique, je les fusionne (`go tool pprof -proto`) et je versionne le résultat en `cmd/serveur/default.pgo`. Je compare le CPU par requête avant et après, et un job planifié rafraîchit le profil chaque mois par une pull request."
  - key: scenario-pertinence
    format: scenario
    question: Le PGO vaut-il le coup pour tous les programmes ?
    choices:
      - {text: "Non : surtout pour des services longs et gourmands en CPU, pas pour un outil limité par les I/O", correct: true}
      - {text: "Oui : quelques pourcents gagnés valent toujours le coût de collecte du profil", correct: false}
      - {text: "Non : seulement pour les outils en ligne de commande, qui démarrent souvent", correct: false}
      - {text: "Oui, mais seulement pour les programmes qui allouent beaucoup de mémoire", correct: false}
    answer: "Il vaut le coup pour des services qui tournent longtemps et consomment beaucoup de CPU, où quelques pourcents se traduisent en machines économisées. Pour un outil lancé rarement, ou un service limité par les entrées-sorties, le gain est négligeable face au coût de collecte et de mise à jour du profil."
  - key: scenario-devirtualisation
    format: scenario
    question: "Que fait la dévirtualisation guidée par le profil ?"
    choices:
      - {text: "Elle ajoute un test de type vers l'implémentation la plus fréquente, appelée en direct", correct: true}
      - {text: "Elle remplace toutes les interfaces du programme par leur type concret le plus courant", correct: false}
      - {text: "Elle supprime les appels d'interface jamais vus dans le profil de production", correct: false}
      - {text: "Elle convertit les méthodes d'interface en fonctions génériques à la compilation", correct: false}
    answer: "Un appel d'interface passe normalement par une table de méthodes, sans inlining possible. Si le profil montre que `r.Read(...)` vise presque toujours `*os.File`, le compilateur génère « si `r` est un `*os.File`, appel direct, éventuellement inliné ; sinon, appel normal » : le cas courant accélère, le comportement ne change pas."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce qu'est le PGO en Go et comment tu l'utiliserais. Que réponds-tu ?"
    choices:
      - {text: "Une compilation guidée par un profil CPU de production, en `default.pgo`, pour quelques %", correct: true}
      - {text: "Un GC guidé par un profil mémoire, qui divise la consommation de mémoire par deux", correct: false}
      - {text: "Un JIT qui recompile les fonctions chaudes pendant l'exécution du service", correct: false}
      - {text: "Une option de `go test` qui choisit les benchmarks à lancer selon le profil", correct: false}
    answer: "C'est la compilation guidée par un profil CPU de production : le compilateur optimise davantage les chemins chauds (inlining, dévirtualisation). Je collecte un profil représentatif, je le nomme `default.pgo` dans le package main, le build normal l'utilise ; j'en attends quelques pourcents de CPU, que je mesure."
