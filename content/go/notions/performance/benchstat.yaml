notion: benchstat
lesson: |-
  **`benchstat`** (`golang.org/x/perf/cmd/benchstat`) compare des résultats de benchmarks **statistiquement**. Une seule
  mesure ne suffit pas : d'une exécution à l'autre, un benchmark varie de quelques pourcents (fréquence du processeur,
  autres processus, GC). benchstat dit si une différence est **réelle** ou du **bruit**.

  ```
  go install golang.org/x/perf/cmd/benchstat@latest

  go test -run='^$' -bench=Encoder -benchmem -count=10 > avant.txt
  # ... modification ...
  go test -run='^$' -bench=Encoder -benchmem -count=10 > apres.txt

  benchstat avant.txt apres.txt
  ```

  ```
           │  avant.txt  │              apres.txt              │
           │   sec/op    │   sec/op     vs base                │
  Encoder    950.0n ± 2%   712.0n ± 1%  -25.05% (p=0.000 n=10)
  ```

  À lire :
  - la **médiane** et son **intervalle** (± 2 %) : une variation importante signale une mesure instable ;
  - la **différence** en pourcentage ;
  - la **valeur p** : en dessous de 0,05, la différence est jugée significative ; sinon benchstat affiche **`~`**
    (« pas de différence démontrée ») ;
  - `n=10` : le nombre de mesures retenues.

  Les conseils : au moins **10** exécutions (`-count=10`), une machine au calme, et alterner les versions si l'on
  soupçonne une dérive (la machine qui chauffe).

  **En entretien** : « benchstat compare deux séries de benchmarks : médiane, intervalle, différence et valeur p ; ~
  signifie pas de différence prouvée ; au moins dix mesures. »
cards:
  - key: sert-benchstat
    format: course
    question: À quoi sert benchstat ?
    choices:
      - {text: "À comparer statistiquement plusieurs exécutions de benchmarks", correct: true}
      - {text: "À lancer les benchmarks sur plusieurs machines à la fois", correct: false}
      - {text: "À afficher un profil CPU sous forme de flame graph", correct: false}
      - {text: "À générer des benchmarks à partir des tests unitaires", correct: false}
    answer: "À comparer statistiquement les résultats de plusieurs exécutions de benchmarks : médianes, intervalles, variation et significativité. Le flame graph, c'est `go tool pprof`."
  - key: tilde
    format: course
    question: Que signifie « ~ » dans la sortie de benchstat ?
    choices:
      - {text: "Une différence non significative : ni gain ni perte démontrés", correct: true}
      - {text: "Une différence approximative, à arrondir au pourcent près", correct: false}
      - {text: "Un gain faible mais réel, inférieur à 5 %", correct: false}
      - {text: "Une mesure manquante dans l'une des deux séries", correct: false}
    answer: "Que la différence entre les deux séries n'est pas statistiquement significative (valeur p trop élevée) : on ne peut conclure ni à un gain ni à une perte."
  - key: count
    format: course
    question: Pourquoi lancer les benchmarks avec -count=10 avant d'utiliser benchstat ?
    choices:
      - {text: "Pour estimer la variance et la significativité, qui demandent plusieurs mesures", correct: true}
      - {text: "Pour que benchstat garde la meilleure des dix mesures de chaque version", correct: false}
      - {text: "Pour chauffer le processeur, benchstat ignorant les neuf premières mesures", correct: false}
      - {text: "Pour diviser le bruit par dix, benchstat additionnant toutes les mesures", correct: false}
    answer: "benchstat a besoin de plusieurs mesures par version pour estimer la variance et calculer la significativité ; avec trop peu de mesures, il ne peut rien conclure."
  - key: intervalle
    format: course
    question: Que signale un intervalle de ± 15 % sur une médiane dans benchstat ?
    choices:
      - {text: "Une mesure instable, à corriger avant toute comparaison", correct: true}
      - {text: "Un gain de 15 % entre l'ancienne et la nouvelle version", correct: false}
      - {text: "Une mesure fiable, l'intervalle couvrant tous les cas", correct: false}
      - {text: "Un benchmark trop court, rallongé de 15 % par benchstat", correct: false}
    answer: "Une mesure très instable : la machine n'était pas au calme, ou le benchmark dépend de facteurs variables (réseau, disque, état partagé). Il faut corriger la mesure avant de comparer."
  - key: vf-p
    format: true-false
    question: Avec benchstat, une valeur p inférieure à 0,05 indique en général une différence significative.
    truth: true
    answer: C'est le seuil par défaut.
  - key: vf-une
    format: true-false
    question: Une exécution de chaque version suffit à benchstat.
    truth: false
    answer: Il faut plusieurs mesures, au moins 10 conseillées.
  - key: vf-stdlib
    format: true-false
    question: benchstat est fourni avec la commande go.
    truth: false
    answer: Il s'installe depuis golang.org/x/perf/cmd/benchstat.
  - key: vf-allocs
    format: true-false
    question: benchstat compare aussi les colonnes B/op et allocs/op si elles sont présentes.
    truth: true
    answer: Un tableau par unité.
  - key: qcm-sortie
    format: multiple-choice
    question: "Lesquels de ces éléments benchstat donne-t-il pour chaque benchmark ?"
    choices:
      - text: La médiane de chaque série et son intervalle
        correct: true
      - text: La différence en pourcentage
        correct: true
      - text: La valeur p et le nombre de mesures
        correct: true
      - text: Le profil CPU
        correct: false
    answer: Pour le profil, c'est pprof.
  - key: qcm-fiabilite
    format: multiple-choice
    question: "Laquelle de ces pratiques rend une comparaison avec benchstat plus fiable ?"
    choices:
      - {text: "Alterner les exécutions des deux versions", correct: true}
      - {text: "Garder seulement la mesure la plus rapide", correct: false}
      - {text: "Mesurer pendant une compilation en cours", correct: false}
      - {text: "Réduire `-count` à 1 pour aller plus vite", correct: false}
    answer: "Alterner les exécutions répartit les variations de la machine entre les deux versions ; plus de mesures (`-count`) et une machine au calme aident aussi. Garder le minimum cache la variance."
  - key: qcm-conclure
    format: multiple-choice
    question: benchstat affiche « -1.20% (p=0.420 n=10) ». Que conclure ?
    choices:
      - text: Pas de différence démontrée
        correct: true
      - text: Un gain de 1,2 % certain
        correct: false
      - text: Une perte de 42 %
        correct: false
      - text: Que le benchmark a planté
        correct: false
    answer: Une valeur p de 0,42 ne permet pas de conclure ; benchstat afficherait d'ailleurs « ~ ».
  - key: scenario-pr
    format: scenario
    question: Comment présentes-tu un gain de performance dans une pull request ?
    choices:
      - {text: "La sortie de benchstat, dix exécutions par version, avec temps et allocations", correct: true}
      - {text: "Le meilleur temps obtenu après le changement, en pourcentage du précédent", correct: false}
      - {text: "Une capture du profil CPU après le changement, sans point de comparaison", correct: false}
      - {text: "Une phrase qui annonce le gain : la relecture du code suffit à le vérifier", correct: false}
    answer: "La sortie de benchstat entre l'ancienne et la nouvelle version (dix exécutions chacune, mêmes conditions), avec le temps et les allocations, les limites du changement, et le benchmark laissé dans le dépôt. Un gain sans benchstat n'est qu'une impression."
  - key: scenario-bruit
    format: scenario
    question: Tes résultats benchstat varient de ± 10 % d'une série à l'autre. Que fais-tu ?
    choices:
      - {text: "Stabiliser la machine et le benchmark, puis augmenter `-count` et `-benchtime`", correct: true}
      - {text: "Garder la série la plus favorable, puisque le bruit va dans les deux sens", correct: false}
      - {text: "Réduire `-count` à 3, pour finir les séries avant que la machine ne chauffe", correct: false}
      - {text: "Ignorer le bruit : la médiane calculée par benchstat le supprime toujours", correct: false}
    answer: "Je stabilise la machine (autres applications fermées, portable branché, turbo désactivé si possible, `-cpu` fixé) et je vérifie que le benchmark ne dépend ni du disque ni du réseau, ni d'un état gardé entre itérations. Puis j'augmente `-count` et `-benchtime`, sur une machine dédiée pour les mesures importantes."
  - key: scenario-plusieurs
    format: scenario
    question: Comment compares-tu trois implémentations d'une même fonction ?
    choices:
      - {text: "Trois fichiers passés à benchstat, ou des sous-benchmarks avec `-col /impl`", correct: true}
      - {text: "Trois comparaisons deux à deux, en gardant chaque fois la plus rapide", correct: false}
      - {text: "Un seul benchmark qui appelle les trois versions dans la même boucle", correct: false}
      - {text: "Trois exécutions de chacune, et les temps moyens comparés à la main", correct: false}
    answer: "Soit trois fichiers passés à benchstat (`benchstat a.txt b.txt c.txt`), comparés à la base ; soit des sous-benchmarks nommés (`impl=a`, `impl=b`) et `-col /impl` pour en faire des colonnes, ce qui garantit des conditions identiques."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi une seule exécution de benchmark ne suffit pas. Que réponds-tu ?"
    choices:
      - {text: "La mesure varie : il faut plusieurs mesures et un test statistique", correct: true}
      - {text: "La première exécution compile le code, il faut donc la jeter", correct: false}
      - {text: "Une seule suffit, à condition que `-benchtime` soit assez long", correct: false}
      - {text: "Le GC ne tourne pas pendant la première exécution du benchmark", correct: false}
    answer: "La mesure varie (fréquence du processeur, autres processus, cycles du GC, caches) : une différence de 3 % peut être du bruit. Il faut plusieurs mesures par version et un test statistique, ce que fait benchstat (médiane, intervalle, valeur p)."
  - key: qcm-installer
    format: multiple-choice
    question: Comment obtenir benchstat ?
    choices:
      - text: '`go install golang.org/x/perf/cmd/benchstat@latest`'
        correct: true
      - text: '`go tool benchstat`, fourni avec Go'
        correct: false
      - text: '`go test -benchstat`'
        correct: false
      - text: Il est inclus dans pprof
        correct: false
    answer: Il fait partie du module golang.org/x/perf. Depuis Go 1.24, on peut aussi le déclarer comme outil du module avec `go get -tool`.
