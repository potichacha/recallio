notion: benchstat
lesson: |-
  **`benchstat`** (`golang.org/x/perf/cmd/benchstat`) compare des résultats de benchmarks **statistiquement**. Une seule
  mesure ne suffit pas : d'une exécution à l'autre, un benchmark varie de quelques pourcents (fréquence du processeur,
  autres processus, GC). benchstat dit si une différence est **réelle** ou du **bruit**.

  ```
  go install golang.org/x/perf/cmd/benchstat@latest

  go test -run='^$' -bench=Encoder -benchmem -count=10 > avant.txt
  # ... modification ...
  go test -run='^$' -bench=Encoder -benchmem -count=10 > apres.txt

  benchstat avant.txt apres.txt
  ```

  ```
           │  avant.txt  │              apres.txt              │
           │   sec/op    │   sec/op     vs base                │
  Encoder    950.0n ± 2%   712.0n ± 1%  -25.05% (p=0.000 n=10)
  ```

  À lire :
  - la **médiane** et son **intervalle** (± 2 %) : une variation importante signale une mesure instable ;
  - la **différence** en pourcentage ;
  - la **valeur p** : en dessous de 0,05, la différence est jugée significative ; sinon benchstat affiche **`~`**
    (« pas de différence démontrée ») ;
  - `n=10` : le nombre de mesures retenues.

  Les conseils : au moins **10** exécutions (`-count=10`), une machine au calme, et alterner les versions si l'on
  soupçonne une dérive (la machine qui chauffe).

  **En entretien** : « benchstat compare deux séries de benchmarks : médiane, intervalle, différence et valeur p ; ~
  signifie pas de différence prouvée ; au moins dix mesures. »
cards:
  - key: sert-benchstat
    format: course
    question: À quoi sert benchstat ?
    answer: Comparer statistiquement les résultats de plusieurs exécutions de benchmarks.
  - key: tilde
    format: course
    question: Que signifie « ~ » dans la sortie de benchstat ?
    answer: 'Que la différence entre les deux séries n''est pas statistiquement significative (valeur p trop élevée) : on ne peut pas conclure à un gain ni à une perte.'
  - key: count
    format: course
    question: Pourquoi lancer les benchmarks avec -count=10 avant d'utiliser benchstat ?
    answer: benchstat a besoin de plusieurs mesures par version pour estimer la variance et calculer la significativité ; avec trop peu de mesures, il ne peut rien conclure.
  - key: intervalle
    format: course
    question: Que signale un intervalle de ± 15 % sur une médiane dans benchstat ?
    answer: 'Une mesure très instable : la machine n''était pas au calme, ou le benchmark dépend de facteurs variables (réseau, disque, état partagé). Il faut corriger la mesure avant de comparer.'
  - key: vf-p
    format: true-false
    question: Avec benchstat, une valeur p inférieure à 0,05 indique en général une différence significative.
    truth: true
    answer: C'est le seuil par défaut.
  - key: vf-une
    format: true-false
    question: Une exécution de chaque version suffit à benchstat.
    truth: false
    answer: Il faut plusieurs mesures, au moins 10 conseillées.
  - key: vf-stdlib
    format: true-false
    question: benchstat est fourni avec la commande go.
    truth: false
    answer: Il s'installe depuis golang.org/x/perf/cmd/benchstat.
  - key: vf-allocs
    format: true-false
    question: benchstat compare aussi les colonnes B/op et allocs/op si elles sont présentes.
    truth: true
    answer: Un tableau par unité.
  - key: qcm-sortie
    format: multiple-choice
    question: Que donne benchstat pour chaque benchmark ?
    choices:
      - text: La médiane de chaque série et son intervalle
        correct: true
      - text: La différence en pourcentage
        correct: true
      - text: La valeur p et le nombre de mesures
        correct: true
      - text: Le profil CPU
        correct: false
    answer: Pour le profil, c'est pprof.
  - key: qcm-fiabilite
    format: multiple-choice
    question: Comment rendre une comparaison plus fiable ?
    choices:
      - text: Plus de mesures (-count)
        correct: true
      - text: Une machine sans autre charge
        correct: true
      - text: Alterner les exécutions des deux versions
        correct: true
      - text: Garder seulement la mesure la plus rapide
        correct: false
    answer: Garder le minimum cache la variance.
  - key: qcm-conclure
    format: multiple-choice
    question: benchstat affiche « -1.20% (p=0.420 n=10) ». Que conclure ?
    choices:
      - text: Pas de différence démontrée
        correct: true
      - text: Un gain de 1,2 % certain
        correct: false
      - text: Une perte de 42 %
        correct: false
      - text: Que le benchmark a planté
        correct: false
    answer: Une valeur p de 0,42 ne permet pas de conclure ; benchstat afficherait d'ailleurs « ~ ».
  - key: scenario-pr
    format: scenario
    question: Comment présentes-tu un gain de performance dans une pull request ?
    answer: |-
      Je joins la sortie de benchstat entre l'ancienne et la nouvelle version (dix exécutions chacune, mêmes conditions),
      avec le temps et les allocations. J'explique le changement et ses limites (cas où il est plus lent), et je laisse le
      benchmark dans le dépôt pour que la régression soit vérifiable plus tard. Un gain sans benchstat n'est qu'une
      impression.
  - key: scenario-bruit
    format: scenario
    question: Tes résultats benchstat varient de ± 10 % d'une série à l'autre. Que fais-tu ?
    answer: |-
      Je stabilise la machine : fermer les autres applications, brancher le portable, désactiver le turbo ou le mode
      économie si possible, fixer `-cpu`. Je vérifie que le benchmark ne dépend pas du disque ou du réseau, et qu'il ne
      garde pas d'état entre les itérations. Puis j'augmente `-count` et `-benchtime`. Sur une machine partagée, je
      préfère une machine dédiée pour les mesures importantes.
  - key: scenario-plusieurs
    format: scenario
    question: Comment compares-tu trois implémentations d'une même fonction ?
    answer: |-
      Soit trois fichiers de résultats passés à benchstat (`benchstat a.txt b.txt c.txt`), qui compare chacun à la base ;
      soit un seul benchmark avec des sous-benchmarks nommés (`impl=a`, `impl=b`) et l'option `-col /impl` de benchstat
      pour en faire des colonnes. La seconde forme garantit que toutes les versions tournent dans les mêmes conditions.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi une seule exécution de benchmark ne suffit pas.
    answer: |-
      Parce que la mesure varie : fréquence du processeur, autres processus, cycles du GC, caches. Une différence de 3 %
      peut être du bruit. Il faut plusieurs mesures par version et un test statistique, ce que fait benchstat (médiane,
      intervalle, valeur p) ; sans cela on risque de garder une « optimisation » qui ne gagne rien et complique le code.
  - key: qcm-installer
    format: multiple-choice
    question: Comment obtenir benchstat ?
    choices:
      - text: '`go install golang.org/x/perf/cmd/benchstat@latest`'
        correct: true
      - text: '`go tool benchstat`, fourni avec Go'
        correct: false
      - text: '`go test -benchstat`'
        correct: false
      - text: Il est inclus dans pprof
        correct: false
    answer: Il fait partie du module golang.org/x/perf. Depuis Go 1.24, on peut aussi le déclarer comme outil du module avec `go get -tool`.
