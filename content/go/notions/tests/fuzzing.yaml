notion: fuzzing
lesson: "Le **fuzzing** (Go 1.18) génère automatiquement des entrées pour trouver celles qui font **paniquer** ou échouer le\ncode. On écrit une fonction **`FuzzXxx(f *testing.F)`** :\n\n```go\nfunc FuzzParserDuree(f *testing.F) {\n\tf.Add(\"1h30m\")        // le corpus de départ (seeds)\n\tf.Add(\"0s\")\n\tf.Add(\"-5m\")\n\tf.Fuzz(func(t *testing.T, s string) {\n\t\td, err := ParserDuree(s)\n\t\tif err != nil {\n\t\t\treturn // une erreur est acceptable ; une panique, non\n\t\t}\n\t\t// une propriété qui doit toujours être vraie : l'aller-retour\n\t\td2, err := ParserDuree(d.String())\n\t\tif err != nil || d2 != d {\n\t\t\tt.Errorf(\"aller-retour de %q : %v -> %q -> %v (%v)\", s, d, d.String(), d2, err)\n\t\t}\n\t})\n}\n```\n\n```\ngo test -run=FuzzParserDuree ./...                 # rejoue seulement le corpus : un test normal\ngo test -fuzz=FuzzParserDuree -fuzztime=60s ./duree # génère des entrées pendant 60 s\n```\n\nCe qu'il faut savoir :\n- sans `-fuzz`, la fonction s'exécute comme un **test ordinaire** sur le corpus de départ et les cas enregistrés ;\n- quand une entrée fait échouer le test, elle est **enregistrée** dans `testdata/fuzz/FuzzXxx/` : on la versionne, et\n  elle devient un **test de non-régression** ;\n- les arguments acceptés sont des types simples : `string`, `[]byte`, entiers, flottants, `bool`, `rune`, `byte` ;\n- le fuzzing est **guidé par la couverture** : il fait muter les entrées qui découvrent de nouveaux chemins ;\n- on ne peut fuzzer qu'**une** cible à la fois, et c'est long : on le lance à la demande ou dans une tâche planifiée,\n  pas à chaque pull request.\n\nLes bonnes cibles : parseurs, décodeurs, fonctions qui reçoivent des données externes, et toute fonction avec une\n**propriété** vérifiable (aller-retour encoder/décoder, invariant, comparaison avec une implémentation de référence).\n\n**En entretien** : « FuzzXxx(f *testing.F), f.Add pour le corpus, f.Fuzz avec la propriété ; -fuzz pour générer ;\nles entrées fautives vont dans testdata/fuzz et deviennent des tests ; idéal pour les parseurs. »"
cards:
  - key: fuzzing
    format: course
    question: C'est quoi le fuzzing en Go ?
    answer: Des tests FuzzXxx qui génèrent des entrées guidées par la couverture ; les échecs sont enregistrés dans testdata.
  - key: terme-fuzzing
    format: course
    question: Que désigne « fuzzing » ?
    answer: Tests à entrées générées, guidés par la couverture (Go 1.18)
  - key: sans-fuzz
    format: course
    question: Que fait une fonction FuzzXxx lancée par go test sans l'option -fuzz ?
    answer: Elle s'exécute comme un test ordinaire, sur le corpus de départ (f.Add) et sur les entrées enregistrées dans testdata/fuzz ; elle ne génère pas de nouvelles entrées.
  - key: proprietes
    format: course
    question: Que vérifier dans une cible de fuzzing, puisqu'on ne connaît pas le résultat attendu ?
    answer: 'Des propriétés toujours vraies : pas de panique, un aller-retour (décoder ce qu''on a encodé redonne l''original), un invariant (le résultat est trié, de la bonne longueur), ou l''accord avec une implémentation de référence.'
  - key: vf-corpus
    format: true-false
    question: Une entrée qui fait échouer le fuzzing est enregistrée dans testdata/fuzz.
    truth: true
    answer: On la versionne pour en faire un test de non-régression.
  - key: vf-types
    format: true-false
    question: Une cible de fuzzing peut recevoir n'importe quelle struct en argument.
    truth: false
    answer: Seulement des types simples (string, []byte, nombres, bool, rune, byte).
  - key: vf-version
    format: true-false
    question: Le fuzzing est intégré à go test depuis Go 1.18.
    truth: true
    answer: Avec les génériques.
  - key: vf-ci
    format: true-false
    question: Il est recommandé de lancer `-fuzz` pendant de longues minutes à chaque pull request.
    truth: false
    answer: Le corpus se rejoue à chaque test ; le fuzzing long se lance à la demande ou dans une tâche planifiée.
  - key: qcm-cibles
    format: multiple-choice
    question: Quelles fonctions sont de bonnes cibles de fuzzing ?
    choices:
      - text: Un parseur de fichier de configuration
        correct: true
      - text: Un décodeur de format binaire reçu du réseau
        correct: true
      - text: Une fonction d'encodage et de décodage dont on vérifie l'aller-retour
        correct: true
      - text: Une fonction qui envoie un e-mail
        correct: false
    answer: Les fonctions avec des effets externes se prêtent mal au fuzzing.
  - key: qcm-api
    format: multiple-choice
    question: Quels éléments composent un test de fuzzing ?
    choices:
      - text: '`func FuzzXxx(f *testing.F)`'
        correct: true
      - text: '`f.Add(...)` pour le corpus de départ'
        correct: true
      - text: '`f.Fuzz(func(t *testing.T, ...) {...})` avec la vérification'
        correct: true
      - text: '`f.Seed(time.Now())`'
        correct: false
    answer: Le générateur est géré par go test.
  - key: qcm-trouve
    format: multiple-choice
    question: Le fuzzing trouve une entrée qui fait paniquer le parseur. Que faire ?
    choices:
      - text: Corriger le parseur pour renvoyer une erreur
        correct: true
      - text: Versionner l'entrée enregistrée dans testdata/fuzz
        correct: true
      - text: Supprimer le fichier de testdata pour que le test passe
        correct: false
      - text: Ajouter un recover dans la cible de fuzzing
        correct: false
    answer: L'entrée devient un test de non-régression.
  - key: qcm-guide
    format: multiple-choice
    question: Comment le fuzzer de Go choisit-il les entrées ?
    choices:
      - text: Il fait muter les entrées du corpus
        correct: true
      - text: Il garde celles qui découvrent de nouveaux chemins dans le code
        correct: true
      - text: Il lit les commentaires du code
        correct: false
      - text: Il essaie toutes les chaînes possibles dans l'ordre
        correct: false
    answer: C'est un fuzzing guidé par la couverture.
  - key: trous-signature
    format: fill-in
    question: |-
      Complétez :
      ```go
      func FuzzDecoder(f *testing.___) {
      ```
    blanks:
      - - F
    answer: testing.F.
  - key: trous-add
    format: fill-in
    question: |-
      Complétez le corpus de départ :
      ```go
      f.___("2026-11-04")
      f.___("")
      ```
    blanks:
      - - Add
      - - Add
    answer: f.Add.
  - key: trous-fuzz
    format: fill-in
    question: "Complétez :\n```go\nf.___(func(t *testing.T, s string) {\n\tParser(s) // ne doit jamais paniquer\n})\n```"
    blanks:
      - - Fuzz
    answer: f.Fuzz.
  - key: trous-commande
    format: fill-in
    question: |-
      Complétez pour fuzzer pendant 30 secondes :
      ```
      go test ___=FuzzDecoder -fuzztime=30s ./format
      ```
    blanks:
      - - -fuzz
    answer: "-fuzz."
  - key: scenario-parseur
    format: scenario
    question: Comment mettrais-tu en place le fuzzing d'un parseur de fichiers fournis par les utilisateurs ?
    answer: |-
      Une cible `FuzzParser` avec quelques fichiers réels en corpus de départ (f.Add ou testdata/fuzz), qui vérifie
      qu'aucune entrée ne fait paniquer ni boucler, et qu'un fichier accepté, réécrit puis relu, donne le même résultat.
      Je lance `-fuzz` quelques minutes en local, puis chaque nuit dans une tâche planifiée ; chaque entrée fautive est
      corrigée et versionnée. Le corpus rejoué à chaque `go test` protège contre les régressions.
  - key: scenario-reference
    format: scenario
    question: Tu as optimisé une fonction de tri très utilisée. Comment le fuzzing peut-il t'aider ?
    answer: |-
      Avec une comparaison différentielle : la cible reçoit des octets qu'elle convertit en slice, la trie avec la nouvelle
      fonction et avec `slices.Sort` (la référence), et vérifie que les résultats sont égaux. Le fuzzer cherche alors des
      entrées où les deux divergent : doublons, tailles particulières, valeurs extrêmes. C'est très efficace pour valider
      une optimisation.
  - key: scenario-securite
    format: scenario
    question: Pourquoi le fuzzing est-il utile pour la sécurité d'un service ?
    answer: |-
      Les données qui viennent de l'extérieur (requêtes, fichiers, messages) peuvent être construites par un attaquant ;
      une panique, une boucle infinie ou une allocation énorme sur une entrée piégée est un déni de service. Le fuzzing
      trouve ces entrées avant lui, sur les parseurs et décodeurs exposés. La bibliothèque standard et de nombreux
      projets sont fuzzés en continu (OSS-Fuzz) pour cette raison.
  - key: scenario-limites
    format: scenario
    question: Quelles sont les limites du fuzzing natif de Go ?
    answer: |-
      Une seule cible à la fois, des arguments de types simples seulement (on construit les structures à partir des
      octets), un temps d'exécution long pour aller loin, et une efficacité qui dépend d'une propriété bien choisie : sans
      elle, il ne trouve que des paniques. Il complète les tests pilotés par une table, il ne les remplace pas.
