notion: fuzzing
lesson: "Le **fuzzing** (Go 1.18) génère automatiquement des entrées pour trouver celles qui font **paniquer** ou échouer le\ncode. On écrit une fonction **`FuzzXxx(f *testing.F)`** :\n\n```go\nfunc FuzzParserDuree(f *testing.F) {\n\tf.Add(\"1h30m\")        // le corpus de départ (seeds)\n\tf.Add(\"0s\")\n\tf.Add(\"-5m\")\n\tf.Fuzz(func(t *testing.T, s string) {\n\t\td, err := ParserDuree(s)\n\t\tif err != nil {\n\t\t\treturn // une erreur est acceptable ; une panique, non\n\t\t}\n\t\t// une propriété qui doit toujours être vraie : l'aller-retour\n\t\td2, err := ParserDuree(d.String())\n\t\tif err != nil || d2 != d {\n\t\t\tt.Errorf(\"aller-retour de %q : %v -> %q -> %v (%v)\", s, d, d.String(), d2, err)\n\t\t}\n\t})\n}\n```\n\n```\ngo test -run=FuzzParserDuree ./...                 # rejoue seulement le corpus : un test normal\ngo test -fuzz=FuzzParserDuree -fuzztime=60s ./duree # génère des entrées pendant 60 s\n```\n\nCe qu'il faut savoir :\n- sans `-fuzz`, la fonction s'exécute comme un **test ordinaire** sur le corpus de départ et les cas enregistrés ;\n- quand une entrée fait échouer le test, elle est **enregistrée** dans `testdata/fuzz/FuzzXxx/` : on la versionne, et\n  elle devient un **test de non-régression** ;\n- les arguments acceptés sont des types simples : `string`, `[]byte`, entiers, flottants, `bool`, `rune`, `byte` ;\n- le fuzzing est **guidé par la couverture** : il fait muter les entrées qui découvrent de nouveaux chemins ;\n- on ne peut fuzzer qu'**une** cible à la fois, et c'est long : on le lance à la demande ou dans une tâche planifiée,\n  pas à chaque pull request.\n\nLes bonnes cibles : parseurs, décodeurs, fonctions qui reçoivent des données externes, et toute fonction avec une\n**propriété** vérifiable (aller-retour encoder/décoder, invariant, comparaison avec une implémentation de référence).\n\n**En entretien** : « FuzzXxx(f *testing.F), f.Add pour le corpus, f.Fuzz avec la propriété ; -fuzz pour générer ;\nles entrées fautives vont dans testdata/fuzz et deviennent des tests ; idéal pour les parseurs. »"
cards:
  - key: fuzzing
    format: course
    question: "Qu'est-ce que le fuzzing en Go ?"
    choices:
      - {text: "Des tests `FuzzXxx` aux entrées générées et guidées par la couverture ; les échecs vont dans `testdata`", correct: true}
      - {text: "Des tests `TestXxx` relancés dans un ordre aléatoire, pour faire sortir les tests instables", correct: false}
      - {text: "Des benchmarks `BenchmarkXxx` qui mesurent le temps d'exécution sur des entrées aléatoires", correct: false}
      - {text: "Des tests qui modifient le code, une condition inversée, pour voir si les tests échouent", correct: false}
    answer: "Des tests `FuzzXxx` qui génèrent des entrées guidées par la couverture ; les entrées fautives sont enregistrées dans `testdata/fuzz`. L'ordre aléatoire, c'est `-shuffle` ; modifier le code, les tests de mutation."
  - key: terme-fuzzing
    format: course
    question: "Dans les tests Go, que désigne le terme « fuzzing » ?"
    choices:
      - {text: "Des tests à entrées générées, guidés par la couverture", correct: true}
      - {text: "Des tests qui modifient le code pour juger les assertions", correct: false}
      - {text: "Des tests comparés à un fichier de sortie de référence", correct: false}
      - {text: "Des tests lancés dans un ordre aléatoire avec `-shuffle`", correct: false}
    answer: "Des tests à entrées générées, guidés par la couverture (Go 1.18). Modifier le code, ce sont les tests de mutation ; la sortie de référence, un fichier golden."
  - key: sans-fuzz
    format: course
    question: "Que fait une fonction `FuzzXxx` lancée par `go test` sans l'option `-fuzz` ?"
    choices:
      - {text: "Elle tourne comme un test ordinaire, sur le corpus de départ et les entrées de `testdata/fuzz`", correct: true}
      - {text: "Elle est ignorée : sans `-fuzz`, `go test` ne lance aucune cible de fuzzing", correct: false}
      - {text: "Elle génère de nouvelles entrées pendant dix secondes, puis s'arrête d'elle-même", correct: false}
      - {text: "Elle échoue, car une cible de fuzzing ne peut tourner qu'avec l'option `-fuzz`", correct: false}
    answer: "Elle s'exécute comme un test ordinaire, sur le corpus de départ (`f.Add`) et sur les entrées enregistrées dans `testdata/fuzz` ; elle ne génère pas de nouvelles entrées."
  - key: proprietes
    format: course
    question: "Que vérifier dans une cible de fuzzing, puisqu'on ne connaît pas le résultat attendu ?"
    choices:
      - {text: "Des propriétés toujours vraies : pas de panic, un aller-retour, un invariant, l'accord avec une référence", correct: true}
      - {text: "Le résultat exact de chaque entrée générée, écrit à l'avance dans une table de cas", correct: false}
      - {text: "Seulement que la fonction répond en moins d'une seconde, quelle que soit l'entrée reçue", correct: false}
      - {text: "Rien : le fuzzer compare lui-même chaque résultat à celui de la version précédente du code", correct: false}
    answer: "Des propriétés toujours vraies : pas de panic, un aller-retour (décoder ce qu'on a encodé redonne l'original), un invariant (le résultat est trié, de la bonne longueur), ou l'accord avec une implémentation de référence."
  - key: vf-corpus
    format: true-false
    question: Une entrée qui fait échouer le fuzzing est enregistrée dans testdata/fuzz.
    truth: true
    answer: On la versionne pour en faire un test de non-régression.
  - key: vf-types
    format: true-false
    question: Une cible de fuzzing peut recevoir n'importe quelle struct en argument.
    truth: false
    answer: Seulement des types simples (string, []byte, nombres, bool, rune, byte).
  - key: vf-version
    format: true-false
    question: Le fuzzing est intégré à go test depuis Go 1.18.
    truth: true
    answer: Avec les génériques.
  - key: vf-ci
    format: true-false
    question: Il est recommandé de lancer `-fuzz` pendant de longues minutes à chaque pull request.
    truth: false
    answer: Le corpus se rejoue à chaque test ; le fuzzing long se lance à la demande ou dans une tâche planifiée.
  - key: qcm-cibles
    format: multiple-choice
    question: "Lesquelles de ces fonctions sont de bonnes cibles de fuzzing ?"
    choices:
      - text: Un parseur de fichier de configuration
        correct: true
      - text: Un décodeur de format binaire reçu du réseau
        correct: true
      - text: Une fonction d'encodage et de décodage dont on vérifie l'aller-retour
        correct: true
      - text: Une fonction qui envoie un e-mail
        correct: false
    answer: Les fonctions avec des effets externes se prêtent mal au fuzzing.
  - key: qcm-api
    format: multiple-choice
    question: "Laquelle de ces lignes n'appartient pas à l'API de fuzzing de Go ?"
    choices:
      - {text: "`f.Seed(time.Now())`", correct: true}
      - {text: "`func FuzzXxx(f *testing.F)`", correct: false}
      - {text: "`f.Add(...)`", correct: false}
      - {text: "`f.Fuzz(func(t *testing.T, ...) {...})`", correct: false}
    answer: "Une cible s'écrit `func FuzzXxx(f *testing.F)`, son corpus de départ avec `f.Add`, sa vérification dans `f.Fuzz`. Le générateur est géré par `go test` : il n'y a pas de graine à fixer."
  - key: qcm-trouve
    format: multiple-choice
    question: "Le fuzzing trouve une entrée qui fait paniquer le parseur. Que fais-tu ?"
    choices:
      - {text: "Je corrige le parseur pour qu'il renvoie une erreur, et je versionne l'entrée de `testdata/fuzz`", correct: true}
      - {text: "Je supprime le fichier de `testdata/fuzz`, pour que le test repasse", correct: false}
      - {text: "J'ajoute un `recover` dans la cible de fuzzing, qui absorbe la panic", correct: false}
      - {text: "Je relance le fuzzing jusqu'à ce qu'il ne retrouve plus cette entrée", correct: false}
    answer: "L'entrée versionnée devient un test de non-régression, rejoué à chaque `go test`. Un `recover` dans la cible cacherait le bug au lieu de le corriger."
  - key: qcm-guide
    format: multiple-choice
    question: "Comment le fuzzer de Go choisit-il ses entrées ?"
    choices:
      - {text: "Il fait muter le corpus et garde les entrées qui ouvrent de nouveaux chemins", correct: true}
      - {text: "Il essaie toutes les chaînes possibles, de la plus courte à la plus longue", correct: false}
      - {text: "Il lit les commentaires du code pour deviner les cas intéressants", correct: false}
      - {text: "Il tire des octets au hasard, sans tenir compte du code exécuté", correct: false}
    answer: "C'est un fuzzing guidé par la couverture : les mutations qui découvrent de nouveaux chemins rejoignent le corpus et servent de base aux suivantes."
  - key: trous-signature
    format: fill-in
    question: |-
      Complète :
      ```go
      func FuzzDecoder(f *testing.___) {
      ```
    blanks:
      - - F
    answer: testing.F.
  - key: trous-add
    format: fill-in
    question: |-
      Complète le corpus de départ :
      ```go
      f.___("2026-11-04")
      f.___("")
      ```
    blanks:
      - - Add
      - - Add
    answer: f.Add.
  - key: trous-fuzz
    format: fill-in
    question: |-
      Complète :
      ```go
      f.___(func(t *testing.T, s string) {
      	Parser(s) // ne doit jamais paniquer
      })
      ```
    blanks:
      - - Fuzz
    answer: f.Fuzz.
  - key: trous-commande
    format: fill-in
    question: |-
      Complète pour fuzzer pendant 30 secondes :
      ```
      go test ___=FuzzDecoder -fuzztime=30s ./format
      ```
    blanks:
      - - -fuzz
    answer: "-fuzz."
  - key: scenario-parseur
    format: scenario
    question: "Comment mettrais-tu en place le fuzzing d'un parseur de fichiers fournis par les utilisateurs ?"
    choices:
      - {text: "Une cible `FuzzParser` avec des fichiers réels en corpus, qui vérifie l'absence de panic et l'aller-retour", correct: true}
      - {text: "Une table de 200 fichiers piégés écrits à la main, sans cible de fuzzing ni corpus versionné", correct: false}
      - {text: "Une cible lancée une fois avec `-fuzz` pendant une heure, puis supprimée une fois les bugs trouvés", correct: false}
      - {text: "Une cible qui appelle le parseur sous `recover`, pour qu'aucune entrée ne fasse échouer le test", correct: false}
    answer: "Une cible `FuzzParser` avec quelques fichiers réels en corpus de départ, qui vérifie qu'aucune entrée ne fait paniquer ni boucler, et qu'un fichier accepté, réécrit puis relu, donne le même résultat. `-fuzz` quelques minutes en local, puis chaque nuit ; chaque entrée fautive est corrigée et versionnée, et le corpus rejoué à chaque `go test` protège des régressions."
  - key: scenario-reference
    format: scenario
    question: "Tu as optimisé une fonction de tri très utilisée. Comment le fuzzing peut-il t'aider ?"
    choices:
      - {text: "Par une comparaison différentielle : la cible trie avec la nouvelle fonction et `slices.Sort`, et compare", correct: true}
      - {text: "Par une cible qui vérifie seulement que la nouvelle fonction ne panique sur aucune entrée", correct: false}
      - {text: "Par un benchmark lancé avec `-fuzz`, qui compare la vitesse des deux tris sur des entrées aléatoires", correct: false}
      - {text: "Il ne peut pas : seule une table de cas écrite à la main donne le résultat attendu d'un tri", correct: false}
    answer: "La cible convertit les octets reçus en slice, la trie avec la nouvelle fonction et avec `slices.Sort` (la référence), et vérifie que les résultats sont égaux. Le fuzzer cherche des entrées où les deux divergent : doublons, tailles particulières, valeurs extrêmes."
  - key: scenario-securite
    format: scenario
    question: "Pourquoi le fuzzing est-il utile pour la sécurité d'un service ?"
    choices:
      - {text: "Un attaquant construit ses entrées : le fuzzing trouve avant lui les panics et boucles qui font un déni de service", correct: true}
      - {text: "Il détecte les vulnérabilités connues des dépendances du service, comme le ferait govulncheck", correct: false}
      - {text: "Il chiffre les entrées reçues par le service, pour qu'un attaquant ne puisse pas les lire", correct: false}
      - {text: "Il remplace la validation des entrées, que le fuzzer fait à la place du code du service", correct: false}
    answer: "Les données externes (requêtes, fichiers, messages) peuvent être construites par un attaquant ; une panic, une boucle infinie ou une allocation énorme sur une entrée piégée est un déni de service. Le fuzzing trouve ces entrées avant lui ; la bibliothèque standard et de nombreux projets sont fuzzés en continu (OSS-Fuzz)."
  - key: scenario-limites
    format: scenario
    question: "Quelles sont les limites du fuzzing natif de Go ?"
    choices:
      - {text: "Une cible à la fois, des arguments de types simples, un temps long, et une propriété à bien choisir", correct: true}
      - {text: "Il ne sait générer que des chaînes de caractères, ni octets, ni nombres, ni booléens", correct: false}
      - {text: "Il ne tourne que sous Linux, et demande un compilateur C pour instrumenter le code", correct: false}
      - {text: "Il remplace les tests de table, mais demande une bibliothèque externe pour démarrer", correct: false}
    answer: "Une seule cible à la fois, des arguments de types simples (on construit les structures à partir des octets), un temps long pour aller loin, et une efficacité qui dépend d'une propriété bien choisie : sans elle, il ne trouve que des panics. Il complète les tests de table, il ne les remplace pas."
