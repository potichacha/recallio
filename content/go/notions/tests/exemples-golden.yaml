notion: exemples-golden
lesson: "**Les fonctions Example** servent à la fois de **documentation** et de **test** :\n\n```go\nfunc ExampleArrondir() {\n\tfmt.Println(Arrondir(2.346, 2))\n\tfmt.Println(Arrondir(-1.5, 0))\n\t// Output:\n\t// 2.35\n\t// -2\n}\n```\n\n- elles sont **affichées** dans la documentation (pkg.go.dev, `go doc`), attachées à la fonction ou au type nommé\n  (`ExampleArrondir`, `ExamplePanier_Total` pour une méthode, `Example` pour le package) ;\n- `go test` les **exécute** et compare la sortie standard au commentaire **`// Output:`** ;\n  `// Unordered output:` ignore l'ordre des lignes ;\n- **sans** commentaire Output, l'exemple est seulement **compilé**, pas exécuté.\n\n**Les fichiers golden** stockent la sortie attendue d'un test quand elle est longue (HTML, JSON, rapport) :\n\n```go\nvar mettreAJour = flag.Bool(\"update\", false, \"réécrire les fichiers golden\")\n\nfunc TestRapport(t *testing.T) {\n\tgot := GenererRapport(donneesDeTest)\n\tchemin := filepath.Join(\"testdata\", \"rapport.golden\")\n\tif *mettreAJour {\n\t\tos.WriteFile(chemin, got, 0o644)\n\t}\n\twant, err := os.ReadFile(chemin)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !bytes.Equal(got, want) {\n\t\tt.Errorf(\"rapport différent du fichier golden ; relancer avec -update si le changement est voulu\")\n\t}\n}\n```\n\n`go test -update` régénère les fichiers, et la **revue du diff** de la pull request montre exactement ce qui a changé.\nLe dossier **`testdata/`** est ignoré par la chaîne d'outils (pas de package compilé), c'est le bon endroit pour ces\nfichiers.\n\n**En entretien** : « Example avec // Output: : documentation vérifiée par go test ; sans Output, seulement compilé ;\ngolden files dans testdata avec un drapeau -update, relus dans le diff. »"
cards:
  - key: fonction-example
    format: course
    question: "Qu'est-ce qu'une fonction `Example` en Go ?"
    choices:
      - {text: "Une fonction `ExampleXxx` d'un fichier de test, montrée dans la doc et vérifiée par son `Output`", correct: true}
      - {text: "Une fonction de démonstration d'un `package main`, lancée par `go run` pour illustrer l'API", correct: false}
      - {text: "Un test qui génère des entrées au hasard, guidé par la couverture du code testé", correct: false}
      - {text: "Un fichier de sortie de référence, comparé au résultat d'un test et régénéré à la demande", correct: false}
    answer: "Une fonction `ExampleXxx` dans un fichier de test, affichée dans la documentation et vérifiée par `go test` grâce à son commentaire `// Output:`. Les entrées générées, c'est le fuzzing ; la sortie de référence, un fichier golden."
  - key: golden-file
    format: course
    question: "Qu'est-ce qu'un fichier golden ?"
    choices:
      - {text: "Un fichier de sortie de référence, comparé au résultat du test, régénéré à la demande", correct: true}
      - {text: "Un fichier de corpus d'entrées, rejoué par les tests de fuzzing à chaque `go test`", correct: false}
      - {text: "Un profil de couverture fusionné, gardé comme référence pour en suivre la tendance", correct: false}
      - {text: "Un fichier de configuration des tests, lu par `go test` avant toute exécution", correct: false}
    answer: "Un fichier de sortie de référence (souvent dans `testdata/`), comparé au résultat du test et régénéré à la demande, par exemple avec un drapeau `-update`."
  - key: exemples-sont-ils-executes
    format: course
    question: "`go test` exécute-t-il les fonctions `Example` ?"
    choices:
      - {text: "Oui, celles qui ont un commentaire `// Output:`, dont il vérifie la sortie", correct: true}
      - {text: "Non : elles ne servent qu'à la documentation et ne sont jamais compilées", correct: false}
      - {text: "Oui, toutes, mais leur sortie n'est jamais comparée à quoi que ce soit", correct: false}
      - {text: "Seulement avec l'option `-run Example`, sinon elles sont ignorées", correct: false}
    answer: "Oui : `go test` exécute les exemples qui ont un commentaire `// Output:` et compare leur sortie. Sans ce commentaire, ils sont compilés mais pas exécutés."
  - key: sans-output
    format: course
    question: "Que se passe-t-il pour une fonction `Example` sans commentaire `// Output:` ?"
    choices:
      - {text: "Elle est compilée et montrée dans la doc, mais pas exécutée : rien n'est vérifié", correct: true}
      - {text: "Elle est exécutée, et le test échoue puisqu'aucune sortie n'est attendue", correct: false}
      - {text: "Elle est exécutée, et sa sortie est comparée à une chaîne vide", correct: false}
      - {text: "Elle n'est même pas compilée, et peut donc contenir du code invalide", correct: false}
    answer: "Elle est compilée (et affichée dans la documentation) mais pas exécutée par `go test` : rien n'est vérifié. Pour comparer à une sortie vide, on écrit `// Output:` sans rien derrière."
  - key: vf-doc
    format: true-false
    question: Les fonctions Example apparaissent dans la documentation du package.
    truth: true
    answer: Sur pkg.go.dev et avec go doc.
  - key: vf-unordered
    format: true-false
    question: '`// Unordered output:` compare la sortie sans tenir compte de l''ordre des lignes.'
    truth: true
    answer: Utile pour un parcours de map.
  - key: vf-testdata
    format: true-false
    question: Le dossier testdata est compilé comme un package par go build.
    truth: false
    answer: Il est ignoré par la chaîne d'outils.
  - key: vf-update
    format: true-false
    question: Le drapeau -update des tests golden est fourni par la bibliothèque standard.
    truth: false
    answer: 'C''est une convention : chaque projet le déclare avec le package flag.'
  - key: qcm-noms
    format: multiple-choice
    question: "À quoi s'attache l'exemple `ExamplePanier_Total` dans la documentation ?"
    choices:
      - {text: "À la méthode `Total` du type `Panier`", correct: true}
      - {text: "À la fonction `PanierTotal` du package", correct: false}
      - {text: "Au type `Panier_Total` du package", correct: false}
      - {text: "Au package, sous le titre « Panier Total »", correct: false}
    answer: "`ExampleT_M` s'attache à la méthode `M` du type `T`, `ExampleF` à la fonction `F`, et `Example` seul au package. Le nom doit commencer par `Example`, avec une majuscule."
  - key: qcm-golden
    format: multiple-choice
    question: "Dans lesquels de ces cas un fichier golden est-il utile ?"
    choices:
      - text: Pour une sortie longue, comme un HTML ou un rapport généré
        correct: true
      - text: Pour voir chaque changement de sortie dans le diff de la pull request
        correct: true
      - text: Pour un résultat entier simple
        correct: false
      - text: Pour une sortie qui contient l'heure actuelle
        correct: false
    answer: Une sortie non déterministe doit d'abord être stabilisée (heure injectée).
  - key: qcm-exemple-vs-test
    format: multiple-choice
    question: "Qu'apporte une fonction `Example` par rapport à un test classique ?"
    choices:
      - {text: "Une documentation de l'usage typique, dont on sait qu'elle compile et marche", correct: true}
      - {text: "Une vérification exhaustive des cas limites de chaque fonction", correct: false}
      - {text: "Une mesure de performance, comme le ferait un benchmark", correct: false}
      - {text: "Un test lancé en parallèle des autres, donc plus rapide", correct: false}
    answer: "Un exemple montre aux utilisateurs l'usage typique de l'API, et `go test` vérifie qu'il compile et affiche ce qui est annoncé. Les cas limites restent l'affaire des tests de table."
  - key: qcm-update
    format: multiple-choice
    question: "Après une modification volontaire de la sortie, comment mets-tu à jour les fichiers golden ?"
    choices:
      - {text: "`go test -run TestRapport -update`, puis je relis le diff avant de commiter", correct: true}
      - {text: "Je supprime le test, qui ne correspond plus à la nouvelle sortie", correct: false}
      - {text: "Je modifie le test pour qu'il ignore les différences de sortie", correct: false}
      - {text: "Je recopie à la main la sortie du terminal dans chaque fichier", correct: false}
    answer: "Un drapeau `-update`, déclaré par le test, régénère les fichiers ; le diff montre précisément ce qui a changé, et se relit avant le commit."
  - key: trous-output
    format: fill-in
    question: |-
      Complète l'exemple :
      ```go
      func ExampleSaluer() {
      	fmt.Println(Saluer("Ada"))
      	// ___:
      	// Bonjour Ada
      }
      ```
    blanks:
      - - Output
    answer: // Output:.
  - key: trous-nom
    format: fill-in
    question: |-
      Complète le nom pour documenter la méthode Total du type Panier :
      ```go
      func Example___() {
      ```
    blanks:
      - - Panier_Total
    answer: ExamplePanier_Total.
  - key: trous-testdata
    format: fill-in
    question: |-
      Complète le dossier conventionnel des fichiers de test :
      ```go
      chemin := filepath.Join("___", "rapport.golden")
      ```
    blanks:
      - - testdata
    answer: testdata.
  - key: trous-flag
    format: fill-in
    question: |-
      Complète la déclaration du drapeau :
      ```go
      var mettreAJour = ___.Bool("update", false, "réécrire les fichiers golden")
      ```
    blanks:
      - - flag
    answer: Le package flag.
