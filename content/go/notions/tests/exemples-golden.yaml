notion: exemples-golden
lesson: "**Les fonctions Example** servent à la fois de **documentation** et de **test** :\n\n```go\nfunc ExampleArrondir() {\n\tfmt.Println(Arrondir(2.346, 2))\n\tfmt.Println(Arrondir(-1.5, 0))\n\t// Output:\n\t// 2.35\n\t// -2\n}\n```\n\n- elles sont **affichées** dans la documentation (pkg.go.dev, `go doc`), attachées à la fonction ou au type nommé\n  (`ExampleArrondir`, `ExamplePanier_Total` pour une méthode, `Example` pour le package) ;\n- `go test` les **exécute** et compare la sortie standard au commentaire **`// Output:`** ;\n  `// Unordered output:` ignore l'ordre des lignes ;\n- **sans** commentaire Output, l'exemple est seulement **compilé**, pas exécuté.\n\n**Les fichiers golden** stockent la sortie attendue d'un test quand elle est longue (HTML, JSON, rapport) :\n\n```go\nvar mettreAJour = flag.Bool(\"update\", false, \"réécrire les fichiers golden\")\n\nfunc TestRapport(t *testing.T) {\n\tgot := GenererRapport(donneesDeTest)\n\tchemin := filepath.Join(\"testdata\", \"rapport.golden\")\n\tif *mettreAJour {\n\t\tos.WriteFile(chemin, got, 0o644)\n\t}\n\twant, err := os.ReadFile(chemin)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif !bytes.Equal(got, want) {\n\t\tt.Errorf(\"rapport différent du fichier golden ; relancer avec -update si le changement est voulu\")\n\t}\n}\n```\n\n`go test -update` régénère les fichiers, et la **revue du diff** de la pull request montre exactement ce qui a changé.\nLe dossier **`testdata/`** est ignoré par la chaîne d'outils (pas de package compilé), c'est le bon endroit pour ces\nfichiers.\n\n**En entretien** : « Example avec // Output: : documentation vérifiée par go test ; sans Output, seulement compilé ;\ngolden files dans testdata avec un drapeau -update, relus dans le diff. »"
cards:
  - key: fonction-example
    format: course
    question: C'est quoi une fonction Example ?
    answer: Une fonction ExampleXxx dans un fichier de test, affichée dans la documentation et vérifiée par go test via son commentaire Output.
  - key: golden-file
    format: course
    question: C'est quoi un golden file ?
    answer: Un fichier de sortie de référence comparé au résultat du test, régénéré à la demande.
  - key: exemples-sont-ils-executes
    format: course
    question: Les exemples sont-ils exécutés ?
    answer: Oui, go test vérifie leur sortie via le commentaire Output.
  - key: sans-output
    format: course
    question: 'Que se passe-t-il pour une fonction Example sans commentaire // Output: ?'
    answer: Elle est compilée (et affichée dans la documentation) mais pas exécutée par go test, donc rien n'est vérifié.
  - key: vf-doc
    format: true-false
    question: Les fonctions Example apparaissent dans la documentation du package.
    truth: true
    answer: Sur pkg.go.dev et avec go doc.
  - key: vf-unordered
    format: true-false
    question: '`// Unordered output:` compare la sortie sans tenir compte de l''ordre des lignes.'
    truth: true
    answer: Utile pour un parcours de map.
  - key: vf-testdata
    format: true-false
    question: Le dossier testdata est compilé comme un package par go build.
    truth: false
    answer: Il est ignoré par la chaîne d'outils.
  - key: vf-update
    format: true-false
    question: Le drapeau -update des tests golden est fourni par la bibliothèque standard.
    truth: false
    answer: 'C''est une convention : chaque projet le déclare avec le package flag.'
  - key: qcm-noms
    format: multiple-choice
    question: À quoi s'attache chaque exemple dans la documentation ?
    choices:
      - text: '`ExampleArrondir` : à la fonction Arrondir'
        correct: true
      - text: '`ExamplePanier_Total` : à la méthode Total du type Panier'
        correct: true
      - text: '`Example` : au package'
        correct: true
      - text: '`exampleArrondir` : à la fonction Arrondir'
        correct: false
    answer: Le nom doit commencer par Example.
  - key: qcm-golden
    format: multiple-choice
    question: Quand utiliser un fichier golden ?
    choices:
      - text: Pour une sortie longue, comme un HTML ou un rapport généré
        correct: true
      - text: Pour voir chaque changement de sortie dans le diff de la pull request
        correct: true
      - text: Pour un résultat entier simple
        correct: false
      - text: Pour une sortie qui contient l'heure actuelle
        correct: false
    answer: Une sortie non déterministe doit d'abord être stabilisée (heure injectée).
  - key: qcm-exemple-vs-test
    format: multiple-choice
    question: Que permet un Example par rapport à un test classique ?
    choices:
      - text: Une documentation dont on sait qu'elle compile et fonctionne
        correct: true
      - text: Montrer l'usage typique de l'API aux utilisateurs
        correct: true
      - text: Tester les cas limites de façon exhaustive
        correct: false
      - text: Tester sans package testing
        correct: false
    answer: Les cas limites restent l'affaire des tests de table.
  - key: qcm-update
    format: multiple-choice
    question: Après une modification volontaire de la sortie, comment mettre à jour les fichiers golden ?
    choices:
      - text: '`go test -run TestRapport -update`'
        correct: true
      - text: Relire le diff des fichiers régénérés avant de les commiter
        correct: true
      - text: Supprimer le test
        correct: false
      - text: Modifier le test pour qu'il ignore les différences
        correct: false
    answer: Le diff montre précisément ce qui a changé.
  - key: trous-output
    format: fill-in
    question: "Complétez l'exemple :\n```go\nfunc ExampleSaluer() {\n\tfmt.Println(Saluer(\"Ada\"))\n\t// ___:\n\t// Bonjour Ada\n}\n```"
    blanks:
      - - Output
    answer: // Output:.
  - key: trous-nom
    format: fill-in
    question: |-
      Complétez le nom pour documenter la méthode Total du type Panier :
      ```go
      func Example___() {
      ```
    blanks:
      - - Panier_Total
    answer: ExamplePanier_Total.
  - key: trous-testdata
    format: fill-in
    question: |-
      Complétez le dossier conventionnel des fichiers de test :
      ```go
      chemin := filepath.Join("___", "rapport.golden")
      ```
    blanks:
      - - testdata
    answer: testdata.
  - key: trous-flag
    format: fill-in
    question: |-
      Complétez la déclaration du drapeau :
      ```go
      var mettreAJour = ___.Bool("update", false, "réécrire les fichiers golden")
      ```
    blanks:
      - - flag
    answer: Le package flag.
