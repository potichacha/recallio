notion: exemples-golden
cards:
  - key: fonction-example
    format: course
    question: C'est quoi une fonction Example ?
    answer: Une fonction ExampleXxx dans un fichier de test, affichée dans la documentation et vérifiée par go test via son commentaire Output.
  - key: golden-file
    format: course
    question: C'est quoi un golden file ?
    answer: Un fichier de sortie de référence comparé au résultat du test, régénéré à la demande.
  - key: exemples-sont-ils-executes
    format: course
    question: Les exemples sont-ils exécutés ?
    answer: Oui, go test vérifie leur sortie via le commentaire Output.
