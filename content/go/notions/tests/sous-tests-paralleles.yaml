notion: sous-tests-paralleles
lesson: "**`t.Run(nom, f)`** crée un **sous-test** : il a son propre `t`, son nom (`TestX/cas`), et ses échecs sont rapportés\nà part. On peut le lancer seul avec `-run 'TestX/cas'`.\n\n**`t.Parallel()`** déclare qu'un test peut tourner **en même temps** que les autres tests parallèles :\n\n```go\nfunc TestConvertir(t *testing.T) {\n\tt.Parallel()\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tt.Parallel() // les cas tournent en parallèle entre eux\n\t\t\tif got := Convertir(tt.entree); got != tt.attendu {\n\t\t\t\tt.Errorf(\"Convertir(%q) = %q, attendu %q\", tt.entree, got, tt.attendu)\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\nComment ça marche :\n- un test qui appelle `t.Parallel()` est **suspendu** jusqu'à ce que les tests non parallèles de son niveau aient fini,\n  puis il reprend en même temps que les autres ;\n- le nombre de tests parallèles simultanés est limité par **`-parallel`** (par défaut GOMAXPROCS) ;\n- le test parent ne se termine qu'après la fin de **tous** ses sous-tests ; ses fonctions `t.Cleanup` s'exécutent\n  ensuite, contrairement à un `defer` du parent qui s'exécuterait **avant** les sous-tests parallèles ;\n- les **packages** différents sont déjà testés en parallèle par `go test ./...` (option `-p`).\n\nLes règles :\n- un test parallèle ne doit pas partager d'**état modifiable** avec un autre (variables globales, même fichier, même\n  table en base) ;\n- **`t.Setenv`** et **`t.Chdir`** sont interdits dans un test parallèle (ils modifient le processus) ;\n- le parallélisme accélère les tests lents (entrées-sorties) et révèle les courses avec `-race`.\n\n**En entretien** : « t.Run pour des sous-tests nommés ; t.Parallel les suspend puis les lance ensemble, limité par\n-parallel ; pas d'état partagé ; t.Cleanup plutôt que defer dans le parent ; pas de Setenv en parallèle. »"
cards:
  - key: sert-run
    format: course
    question: "À quoi sert `t.Run` ?"
    choices:
      - {text: "À créer des sous-tests nommés, que l'on peut lancer seuls avec `-run`", correct: true}
      - {text: "À lancer le test dans un processus séparé, isolé des autres tests", correct: false}
      - {text: "À relancer un test qui a échoué, jusqu'à trois fois de suite", correct: false}
      - {text: "À exécuter le test en parallèle des autres, sans `t.Parallel`", correct: false}
    answer: "À créer des sous-tests nommés, exécutables individuellement avec `-run`. Ils tournent dans le même binaire, et ne sont parallèles que s'ils appellent `t.Parallel()`."
  - key: parallel
    format: course
    question: "Que fait `t.Parallel()` ?"
    choices:
      - {text: "Il fait tourner le test en parallèle des autres tests marqués parallèles", correct: true}
      - {text: "Il lance chaque assertion du test dans sa propre goroutine", correct: false}
      - {text: "Il fait tourner le test en parallèle de tous les tests, parallèles ou non", correct: false}
      - {text: "Il répartit le test sur plusieurs machines de la CI en même temps", correct: false}
    answer: "Il exécute le test ou le sous-test en parallèle des autres tests parallèles : le test est suspendu, puis reprend avec eux une fois les tests séquentiels terminés."
  - key: cleanup-vs-defer
    format: course
    question: "Pourquoi utiliser `t.Cleanup` plutôt que `defer` dans un test dont les sous-tests sont parallèles ?"
    choices:
      - {text: "Le `defer` du parent passe avant les sous-tests parallèles ; `t.Cleanup` attend leur fin", correct: true}
      - {text: "`defer` est interdit dans une fonction de test, qui doit passer par `t.Cleanup`", correct: false}
      - {text: "`t.Cleanup` s'exécute même si le test panique, ce que `defer` ne fait jamais", correct: false}
      - {text: "`t.Cleanup` libère les ressources plus tôt, dès la fin de la fonction du parent", correct: false}
    answer: "Le `defer` du parent s'exécute dès que sa fonction rend la main, avant que les sous-tests parallèles (suspendus) aient tourné ; `t.Cleanup` s'exécute après la fin de tous les sous-tests. Un `defer` s'exécute aussi en cas de panic."
  - key: limite
    format: course
    question: "Qu'est-ce qui limite le nombre de tests parallèles d'un package ?"
    choices:
      - {text: "L'option `-parallel`, qui vaut `GOMAXPROCS` par défaut", correct: true}
      - {text: "L'option `-p`, qui vaut le nombre de cœurs de la machine", correct: false}
      - {text: "Rien : tous les tests parallèles démarrent en même temps", correct: false}
      - {text: "L'option `-count`, qui fixe le nombre de tests simultanés", correct: false}
    answer: "L'option `-parallel` de `go test`, qui vaut `GOMAXPROCS` par défaut ; `-p` règle, lui, le nombre de packages testés en même temps."
  - key: vf-suspendu
    format: true-false
    question: Un test qui appelle t.Parallel() est suspendu jusqu'à la fin des tests non parallèles de son niveau.
    truth: true
    answer: Puis il reprend avec les autres tests parallèles.
  - key: vf-setenv
    format: true-false
    question: t.Setenv peut être utilisé dans un test parallèle.
    truth: false
    answer: Il modifie l'environnement du processus ; il panique dans un test parallèle.
  - key: vf-packages
    format: true-false
    question: '`go test ./...` peut tester plusieurs packages en même temps, même sans t.Parallel.'
    truth: true
    answer: Chaque package est un binaire séparé ; -p règle leur nombre.
  - key: vf-parent
    format: true-false
    question: Un test parent se termine avant ses sous-tests parallèles.
    truth: false
    answer: Il attend la fin de tous ses sous-tests.
  - key: qcm-parallel
    format: multiple-choice
    question: "Lequel de ces tests peut appeler `t.Parallel` sans risque ?"
    choices:
      - {text: "Un test qui crée ses données dans son propre `t.TempDir()`", correct: true}
      - {text: "Un test qui modifie une variable globale de configuration", correct: false}
      - {text: "Un test qui appelle `t.Setenv` pour régler sa configuration", correct: false}
      - {text: "Un test qui change de dossier courant avec `os.Chdir`", correct: false}
    answer: "Le parallélisme demande des tests indépendants : fonctions pures, ou données propres à chaque test. Une variable globale, l'environnement ou le dossier courant sont partagés par tout le processus (et `t.Setenv` refuse `t.Parallel`)."
  - key: qcm-run
    format: multiple-choice
    question: "Lequel de ces apports `t.Run` n'offre-t-il pas ?"
    choices:
      - {text: "Un nouveau processus pour chaque sous-test", correct: true}
      - {text: "Un nom propre pour chaque cas dans la sortie", correct: false}
      - {text: "La possibilité de lancer un cas seul avec `-run`", correct: false}
      - {text: "Un `t` propre, dont les échecs sont rapportés à part", correct: false}
    answer: "Les sous-tests partagent le binaire de test. `t.Run` donne un nom à chaque cas, la possibilité de le lancer seul avec `-run`, et un `t` propre dont les échecs sont rapportés à part."
  - key: qcm-ordre
    format: multiple-choice
    question: "Dans un test parent, un `defer` ferme une base partagée par des sous-tests parallèles. Que se passe-t-il ?"
    choices:
      - {text: "La base est fermée avant que les sous-tests parallèles s'exécutent", correct: true}
      - {text: "La base est fermée après les sous-tests, comme on l'attend", correct: false}
      - {text: "Le compilateur refuse un `defer` à côté d'un `t.Run`", correct: false}
      - {text: "`go test` attend les sous-tests avant tout `defer` du parent", correct: false}
    answer: "Les sous-tests parallèles sont suspendus jusqu'au retour de la fonction du parent : le `defer` passe avant eux. `t.Cleanup` s'exécute, lui, après la fin de tous les sous-tests."
  - key: qcm-benefices
    format: multiple-choice
    question: "Quel bénéfice tires-tu de `t.Parallel` ?"
    choices:
      - {text: "Des tests d'entrées-sorties plus rapides", correct: true}
      - {text: "Des tests plus faciles à déboguer", correct: false}
      - {text: "Moins de mémoire utilisée par les tests", correct: false}
      - {text: "Des tests qui tournent dans un ordre fixe", correct: false}
    answer: "Les tests qui attendent des entrées-sorties se chevauchent, et `-race` peut révéler des courses entre eux. Le débogage devient plus difficile : `-parallel=1` au besoin."
  - key: trous-parallel
    format: fill-in
    question: |-
      Complète pour lancer les cas en parallèle :
      ```go
      t.Run(tt.nom, func(t *testing.T) {
      	t.___()
      	// ...
      })
      ```
    blanks:
      - - Parallel
    answer: t.Parallel.
  - key: trous-cleanup
    format: fill-in
    question: |-
      Complète pour fermer la base après tous les sous-tests :
      ```go
      db := ouvrirBaseDeTest(t)
      t.___(func() { db.Close() })
      ```
    blanks:
      - - Cleanup
    answer: t.Cleanup.
  - key: trous-run-option
    format: fill-in
    question: |-
      Complète pour ne lancer que le cas « vide » du test TestParser :
      ```
      go test ___ 'TestParser/vide' ./...
      ```
    blanks:
      - - -run
    answer: "-run."
  - key: trous-parallel-option
    format: fill-in
    question: |-
      Complète pour limiter à 4 tests parallèles :
      ```
      go test ___=4 ./...
      ```
    blanks:
      - - -parallel
    answer: "-parallel."
  - key: bug-defer
    format: bug-fix
    question: |-
      Les sous-tests échouent avec « sql: database is closed ». Quelle correction est la bonne ?
      ```go
      func TestDepot(t *testing.T) {
      	db := ouvrirBase(t)
      	defer db.Close()
      	for _, tt := range tests {
      		t.Run(tt.nom, func(t *testing.T) {
      			t.Parallel()
      			verifier(t, db, tt)
      		})
      	}
      }
      ```
    choices:
      - {text: "Remplacer `defer db.Close()` par `t.Cleanup(func() { db.Close() })`", correct: true}
      - {text: "Déplacer `defer db.Close()` juste après la boucle des sous-tests", correct: false}
      - {text: "Appeler `t.Parallel()` dans le parent aussi, avant d'ouvrir la base", correct: false}
      - {text: "Ajouter un `time.Sleep` à la fin du parent, le temps des sous-tests", correct: false}
    answer: "```go\nfunc TestDepot(t *testing.T) {\n\tdb := ouvrirBase(t)\n\tt.Cleanup(func() { db.Close() })\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tt.Parallel()\n\t\t\tverifier(t, db, tt)\n\t\t})\n\t}\n}\n```\nLe defer s'exécutait au retour du parent, avant les sous-tests parallèles ; t.Cleanup attend leur fin."
  - key: bug-global
    format: bug-fix
    question: |-
      Les tests échouent au hasard depuis l'ajout de `t.Parallel()`. Quelle correction est la bonne ?
      ```go
      func TestFormaterEnFrancais(t *testing.T) {
      	t.Parallel()
      	LangueParDefaut = "fr"
      	// ...
      }

      func TestFormaterEnAnglais(t *testing.T) {
      	t.Parallel()
      	LangueParDefaut = "en"
      	// ...
      }
      ```
    choices:
      - {text: "Passer la langue en paramètre, `NouveauFormateur(\"fr\")`, au lieu d'une globale", correct: true}
      - {text: "Protéger l'affectation de `LangueParDefaut` par un `sync.Mutex`", correct: false}
      - {text: "Remettre `LangueParDefaut` à sa valeur d'origine avec un `defer`", correct: false}
      - {text: "Lancer les tests avec `-shuffle=off`, pour fixer leur ordre", correct: false}
    answer: "```go\nfunc TestFormaterEnFrancais(t *testing.T) {\n\tt.Parallel()\n\tf := NouveauFormateur(\"fr\")\n\t// ...\n}\n```\nLes deux tests modifiaient la même variable globale en même temps ; on passe la langue en paramètre (une meilleure\nconception, en plus d'un test indépendant)."
  - key: bug-setenv
    format: bug-fix
    question: |-
      Le test panique avec « test using t.Setenv or t.Chdir can not use t.Parallel ». Quelle correction est la bonne ?
      ```go
      func TestChargerConfig(t *testing.T) {
      	t.Parallel()
      	t.Setenv("APP_PORT", "9090")
      	cfg := Charger()
      	// ...
      }
      ```
    choices:
      - {text: "Injecter la source des variables (comme `os.Getenv`), ou retirer `t.Parallel`", correct: true}
      - {text: "Remplacer `t.Setenv` par `os.Setenv`, qui accepte les tests parallèles", correct: false}
      - {text: "Appeler `t.Setenv` avant `t.Parallel()`, pour qu'il passe en premier", correct: false}
      - {text: "Protéger `t.Setenv` par un `sync.Mutex` partagé entre les tests", correct: false}
    answer: "```go\nfunc TestChargerConfig(t *testing.T) {\n\tcfg := ChargerDepuis(func(cle string) string {\n\t\treturn map[string]string{\"APP_PORT\": \"9090\"}[cle]\n\t})\n\t// ...\n}\n```\nt.Setenv modifie tout le processus ; on retire t.Parallel, ou mieux, on injecte la source des variables (comme\nos.Getenv) pour que le test reste parallèle."
  - key: bug-meme-fichier
    format: bug-fix
    question: |-
      Deux tests parallèles écrivent et relisent le même fichier, et échouent de temps en temps. Quelle correction est la bonne ?
      ```go
      chemin := "/tmp/rapport.csv"
      Exporter(chemin, donnees)
      ```
    choices:
      - {text: "`chemin := filepath.Join(t.TempDir(), \"rapport.csv\")`", correct: true}
      - {text: "`chemin := \"./rapport.csv\"`, dans le dossier du package", correct: false}
      - {text: "`chemin := filepath.Join(os.TempDir(), \"rapport.csv\")`", correct: false}
      - {text: "Un `os.Remove(chemin)` au début de chaque test", correct: false}
    answer: |-
      ```go
      chemin := filepath.Join(t.TempDir(), "rapport.csv")
      Exporter(chemin, donnees)
      ```
      t.TempDir donne à chaque test un dossier qui lui est propre, supprimé à la fin.
