notion: sous-tests-paralleles
cards:
  - key: sert-run
    format: course
    question: À quoi sert t.Run ?
    answer: Créer des sous-tests nommés, exécutables individuellement avec -run.
  - key: parallel
    format: course
    question: Que fait t.Parallel() ?
    answer: Exécuter le test ou sous-test en parallèle des autres tests parallèles.
