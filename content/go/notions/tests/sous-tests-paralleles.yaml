notion: sous-tests-paralleles
lesson: "**`t.Run(nom, f)`** crée un **sous-test** : il a son propre `t`, son nom (`TestX/cas`), et ses échecs sont rapportés\nà part. On peut le lancer seul avec `-run 'TestX/cas'`.\n\n**`t.Parallel()`** déclare qu'un test peut tourner **en même temps** que les autres tests parallèles :\n\n```go\nfunc TestConvertir(t *testing.T) {\n\tt.Parallel()\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tt.Parallel() // les cas tournent en parallèle entre eux\n\t\t\tif got := Convertir(tt.entree); got != tt.attendu {\n\t\t\t\tt.Errorf(\"Convertir(%q) = %q, attendu %q\", tt.entree, got, tt.attendu)\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\nComment ça marche :\n- un test qui appelle `t.Parallel()` est **suspendu** jusqu'à ce que les tests non parallèles de son niveau aient fini,\n  puis il reprend en même temps que les autres ;\n- le nombre de tests parallèles simultanés est limité par **`-parallel`** (par défaut GOMAXPROCS) ;\n- le test parent ne se termine qu'après la fin de **tous** ses sous-tests ; ses fonctions `t.Cleanup` s'exécutent\n  ensuite, contrairement à un `defer` du parent qui s'exécuterait **avant** les sous-tests parallèles ;\n- les **packages** différents sont déjà testés en parallèle par `go test ./...` (option `-p`).\n\nLes règles :\n- un test parallèle ne doit pas partager d'**état modifiable** avec un autre (variables globales, même fichier, même\n  table en base) ;\n- **`t.Setenv`** et **`t.Chdir`** sont interdits dans un test parallèle (ils modifient le processus) ;\n- le parallélisme accélère les tests lents (entrées-sorties) et révèle les courses avec `-race`.\n\n**En entretien** : « t.Run pour des sous-tests nommés ; t.Parallel les suspend puis les lance ensemble, limité par\n-parallel ; pas d'état partagé ; t.Cleanup plutôt que defer dans le parent ; pas de Setenv en parallèle. »"
cards:
  - key: sert-run
    format: course
    question: À quoi sert t.Run ?
    answer: Créer des sous-tests nommés, exécutables individuellement avec -run.
  - key: parallel
    format: course
    question: Que fait t.Parallel() ?
    answer: Exécuter le test ou sous-test en parallèle des autres tests parallèles.
  - key: cleanup-vs-defer
    format: course
    question: Pourquoi utiliser t.Cleanup plutôt que defer dans un test dont les sous-tests sont parallèles ?
    answer: Le defer du parent s'exécute dès que sa fonction rend la main, avant que les sous-tests parallèles (suspendus) aient tourné ; t.Cleanup s'exécute après la fin de tous les sous-tests.
  - key: limite
    format: course
    question: Qu'est-ce qui limite le nombre de tests parallèles d'un package ?
    answer: L'option `-parallel` de go test, qui vaut GOMAXPROCS par défaut ; `-p` règle, lui, le nombre de packages testés en même temps.
  - key: vf-suspendu
    format: true-false
    question: Un test qui appelle t.Parallel() est suspendu jusqu'à la fin des tests non parallèles de son niveau.
    truth: true
    answer: Puis il reprend avec les autres tests parallèles.
  - key: vf-setenv
    format: true-false
    question: t.Setenv peut être utilisé dans un test parallèle.
    truth: false
    answer: Il modifie l'environnement du processus ; il panique dans un test parallèle.
  - key: vf-packages
    format: true-false
    question: '`go test ./...` peut tester plusieurs packages en même temps, même sans t.Parallel.'
    truth: true
    answer: Chaque package est un binaire séparé ; -p règle leur nombre.
  - key: vf-parent
    format: true-false
    question: Un test parent se termine avant ses sous-tests parallèles.
    truth: false
    answer: Il attend la fin de tous ses sous-tests.
  - key: qcm-parallel
    format: multiple-choice
    question: Quels tests peuvent appeler t.Parallel sans risque ?
    choices:
      - text: Des tests de fonctions pures
        correct: true
      - text: Des tests qui créent chacun leurs propres données (dossier temporaire, schéma dédié)
        correct: true
      - text: Des tests qui modifient une variable globale de configuration
        correct: false
      - text: Des tests qui appellent t.Setenv
        correct: false
    answer: Le parallélisme demande des tests indépendants.
  - key: qcm-run
    format: multiple-choice
    question: Qu'apporte t.Run ?
    choices:
      - text: Un nom propre pour chaque cas dans la sortie
        correct: true
      - text: La possibilité de lancer un cas seul avec -run
        correct: true
      - text: Un t propre, dont les échecs sont rapportés à part
        correct: true
      - text: Un nouveau processus par sous-test
        correct: false
    answer: Les sous-tests partagent le binaire de test.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans un test parent, un defer ferme une base partagée par des sous-tests parallèles. Que se passe-t-il ?
    choices:
      - text: La base est fermée avant que les sous-tests parallèles s'exécutent
        correct: true
      - text: Il faut utiliser t.Cleanup à la place
        correct: true
      - text: La base est fermée après les sous-tests
        correct: false
      - text: Le compilateur refuse
        correct: false
    answer: Les sous-tests parallèles sont suspendus jusqu'au retour de la fonction du parent.
  - key: qcm-benefices
    format: multiple-choice
    question: Quels bénéfices tirer de t.Parallel ?
    choices:
      - text: Des tests d'entrées-sorties plus rapides
        correct: true
      - text: Des courses de données révélées par -race
        correct: true
      - text: Des tests plus faciles à déboguer
        correct: false
      - text: Moins de mémoire utilisée
        correct: false
    answer: Le débogage peut devenir plus difficile, d'où -parallel=1 si besoin.
  - key: trous-parallel
    format: fill-in
    question: "Complétez pour lancer les cas en parallèle :\n```go\nt.Run(tt.nom, func(t *testing.T) {\n\tt.___()\n\t// ...\n})\n```"
    blanks:
      - - Parallel
    answer: t.Parallel.
  - key: trous-cleanup
    format: fill-in
    question: |-
      Complétez pour fermer la base après tous les sous-tests :
      ```go
      db := ouvrirBaseDeTest(t)
      t.___(func() { db.Close() })
      ```
    blanks:
      - - Cleanup
    answer: t.Cleanup.
  - key: trous-run-option
    format: fill-in
    question: |-
      Complétez pour ne lancer que le cas « vide » du test TestParser :
      ```
      go test ___ 'TestParser/vide' ./...
      ```
    blanks:
      - - -run
    answer: "-run."
  - key: trous-parallel-option
    format: fill-in
    question: |-
      Complétez pour limiter à 4 tests parallèles :
      ```
      go test ___=4 ./...
      ```
    blanks:
      - - -parallel
    answer: "-parallel."
  - key: bug-defer
    format: bug-fix
    question: "Les sous-tests échouent avec « sql: database is closed » :\n```go\nfunc TestDepot(t *testing.T) {\n\tdb := ouvrirBase(t)\n\tdefer db.Close()\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tt.Parallel()\n\t\t\tverifier(t, db, tt)\n\t\t})\n\t}\n}\n```"
    answer: "```go\nfunc TestDepot(t *testing.T) {\n\tdb := ouvrirBase(t)\n\tt.Cleanup(func() { db.Close() })\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tt.Parallel()\n\t\t\tverifier(t, db, tt)\n\t\t})\n\t}\n}\n```\nLe defer s'exécutait au retour du parent, avant les sous-tests parallèles ; t.Cleanup attend leur fin."
  - key: bug-global
    format: bug-fix
    question: "Les tests échouent au hasard depuis l'ajout de t.Parallel() :\n```go\nfunc TestFormaterEnFrancais(t *testing.T) {\n\tt.Parallel()\n\tLangueParDefaut = \"fr\"\n\t// ...\n}\n\nfunc TestFormaterEnAnglais(t *testing.T) {\n\tt.Parallel()\n\tLangueParDefaut = \"en\"\n\t// ...\n}\n```"
    answer: "```go\nfunc TestFormaterEnFrancais(t *testing.T) {\n\tt.Parallel()\n\tf := NouveauFormateur(\"fr\")\n\t// ...\n}\n```\nLes deux tests modifiaient la même variable globale en même temps ; on passe la langue en paramètre (une meilleure\nconception, en plus d'un test indépendant)."
  - key: bug-setenv
    format: bug-fix
    question: "Le test panique avec « test using t.Setenv or t.Chdir can not use t.Parallel » :\n```go\nfunc TestChargerConfig(t *testing.T) {\n\tt.Parallel()\n\tt.Setenv(\"APP_PORT\", \"9090\")\n\tcfg := Charger()\n\t// ...\n}\n```"
    answer: "```go\nfunc TestChargerConfig(t *testing.T) {\n\tcfg := ChargerDepuis(func(cle string) string {\n\t\treturn map[string]string{\"APP_PORT\": \"9090\"}[cle]\n\t})\n\t// ...\n}\n```\nt.Setenv modifie tout le processus ; on retire t.Parallel, ou mieux, on injecte la source des variables (comme\nos.Getenv) pour que le test reste parallèle."
  - key: bug-meme-fichier
    format: bug-fix
    question: |-
      Deux tests parallèles écrivent et relisent le même fichier, et échouent de temps en temps :
      ```go
      chemin := "/tmp/rapport.csv"
      Exporter(chemin, donnees)
      ```
    answer: |-
      ```go
      chemin := filepath.Join(t.TempDir(), "rapport.csv")
      Exporter(chemin, donnees)
      ```
      t.TempDir donne à chaque test un dossier qui lui est propre, supprimé à la fin.
