notion: doublures-interfaces
lesson: "Pour tester un code qui dépend d'une base, d'une API ou de l'heure, on remplace la dépendance par une **doublure** :\nun faux, contrôlé par le test. En Go, cela passe par une **interface**, définie **là où elle est utilisée**, avec\nseulement les méthodes nécessaires :\n\n```go\n// dans le package commande : ce dont le service a besoin\ntype Paiements interface {\n\tDebiter(ctx context.Context, client string, montant int64) (string, error)\n}\n\ntype Service struct {\n\tpaiements Paiements\n\thorloge   func() time.Time\n}\n\n// dans le test\ntype fauxPaiements struct {\n\terr    error\n\tappels []int64\n}\n\nfunc (f *fauxPaiements) Debiter(ctx context.Context, client string, montant int64) (string, error) {\n\tf.appels = append(f.appels, montant)\n\treturn \"tx-1\", f.err\n}\n\nfunc TestCommanderEchoueSiLePaiementEchoue(t *testing.T) {\n\tpaiements := &fauxPaiements{err: ErrCarteRefusee}\n\ts := Service{paiements: paiements, horloge: func() time.Time { return dateFixe }}\n\tif err := s.Commander(t.Context(), panier); !errors.Is(err, ErrCarteRefusee) {\n\t\tt.Errorf(\"err = %v, attendu ErrCarteRefusee\", err)\n\t}\n}\n```\n\nLes sortes de doublures :\n- un **bouchon** (*stub*) renvoie des réponses préparées ;\n- un **espion** (*spy*) enregistre les appels pour les vérifier ;\n- un **faux** (*fake*) est une implémentation simplifiée qui fonctionne vraiment (un dépôt en mémoire) ;\n- un **mock** généré (`gomock`, `mockery`) vérifie les appels attendus ; pratique pour de grosses interfaces, mais\n  souvent fragile.\n\nEn Go, on préfère les **petites interfaces** et les **faux écrits à la main** : quelques lignes, lisibles, sans\nframework. Les interfaces implicites permettent de doubler un type d'un autre package sans le modifier.\n\nOn ne double que ce qu'on ne contrôle pas ou qui est lent ; pour la base de données, un vrai PostgreSQL\n(Testcontainers) dans les tests d'intégration vaut mieux qu'un mock du SQL.\n\n**En entretien** : « Une petite interface déclarée chez l'utilisateur ; un faux écrit à la main ; injecter aussi\nl'heure ; mocks générés avec modération ; une vraie base pour tester le SQL. »"
cards:
  - key: service-appelle-api-paiement-externe-rendre
    format: scenario
    question: "Tes tests unitaires ne doivent jamais appeler l'API de paiement externe dont dépend ton service. Comment t'y prends-tu ?"
    choices:
      - {text: "Une petite interface déclarée dans le package métier, injectée par le constructeur, et un faux en test", correct: true}
      - {text: "Une interface de toutes les méthodes du client, déclarée dans le package du client, comme en Java", correct: false}
      - {text: "Le vrai client injecté partout, et les tests qui appellent l'environnement de recette de l'API", correct: false}
      - {text: "Une variable globale du package qui pointe sur le client, et que chaque test remplace", correct: false}
    answer: |-
      Dans le package métier qui en a besoin, je déclare une petite interface qui décrit uniquement ce que j'utilise :
      ```go
      type Paiements interface {
          Debiter(ctx context.Context, compte string, montant int64) (string, error)
      }
      ```
      Le service reçoit cette interface par son constructeur. L'adaptateur réel (le client HTTP de l'API) vit dans un package d'infrastructure et la satisfait implicitement. En test, j'injecte une fausse implémentation écrite à la main, une simple struct avec des champs pour les réponses et les appels enregistrés, ou un mock généré si les interactions sont complexes.
      C'est l'inverse du réflexe Java : je ne crée pas une interface dans le package du client pour 'exposer' l'API, c'est le consommateur qui la définit, à sa mesure.
  - key: faux-manuel-mock-genere
    format: course
    question: "Faux écrit à la main ou mock généré : lequel choisis-tu ?"
    choices:
      - {text: "Un faux à la main pour une petite interface ; un mock généré pour des interactions complexes", correct: true}
      - {text: "Un mock généré dans tous les cas : un faux écrit à la main coûte toujours plus à maintenir", correct: false}
      - {text: "Un faux à la main dans tous les cas : les mocks générés n'ont pas leur place en Go", correct: false}
      - {text: "Un mock généré pour une petite interface ; un faux à la main pour une grosse interface imposée", correct: false}
    answer: "Un faux manuel pour les petites interfaces ; un mock généré (mockgen, mockery) quand les interactions sont complexes ou l'interface grosse et imposée."
  - key: ou
    format: course
    question: "Où déclares-tu l'interface d'une dépendance à doubler ?"
    choices:
      - {text: "Dans le package qui l'utilise, avec seulement les méthodes dont il a besoin", correct: true}
      - {text: "Dans le package de la dépendance, avec toutes ses méthodes exportées", correct: false}
      - {text: "Dans un package `interfaces` commun, partagé par tout le projet", correct: false}
      - {text: "Dans le fichier de test seulement, pour ne pas toucher au code", correct: false}
    answer: "Dans le package qui l'utilise, avec seulement les méthodes dont il a besoin ; le type réel la satisfait implicitement, sans connaître l'interface. Déclarée dans le test seul, le code ne pourrait pas recevoir le faux."
  - key: sortes
    format: course
    question: "Quelle différence entre un bouchon, un espion et un faux ?"
    choices:
      - {text: "Le bouchon renvoie des réponses préparées, l'espion enregistre les appels, le faux fonctionne vraiment", correct: true}
      - {text: "Le bouchon enregistre les appels, l'espion fonctionne vraiment, le faux renvoie des réponses préparées", correct: false}
      - {text: "Le faux renvoie des réponses préparées, le bouchon enregistre les appels, l'espion fonctionne vraiment", correct: false}
      - {text: "Aucune : ce sont trois noms de la même doublure, celle que génère mockgen pour une interface", correct: false}
    answer: "Le bouchon renvoie des réponses préparées, l'espion enregistre les appels pour qu'on les vérifie, le faux est une implémentation simplifiée qui fonctionne vraiment (un dépôt en mémoire)."
  - key: heure
    format: course
    question: "Comment testes-tu un code qui dépend de l'heure actuelle ?"
    choices:
      - {text: "En injectant l'heure (une `func() time.Time` ou une petite interface) au lieu d'appeler `time.Now()`", correct: true}
      - {text: "En changeant l'horloge du système dans le test, puis en la remettant à l'heure à la fin", correct: false}
      - {text: "En lançant le test seulement le jour et à l'heure qui conviennent, dans une CI planifiée", correct: false}
      - {text: "En redéfinissant `time.Now` dans le fichier de test, comme Go le permet pour tout package", correct: false}
    answer: "En injectant l'heure (une fonction `func() time.Time` ou une petite interface `Horloge`) au lieu d'appeler `time.Now()` directement ; le test fournit une date fixe ou qu'il fait avancer. Go ne permet pas de redéfinir une fonction d'un autre package."
  - key: vf-implicite
    format: true-false
    question: Pour doubler un type d'un autre package, il faut modifier ce type pour qu'il déclare implémenter l'interface.
    truth: false
    answer: Les interfaces sont satisfaites implicitement.
  - key: vf-petite
    format: true-false
    question: Une petite interface est plus facile à doubler qu'une grosse.
    truth: true
    answer: Un faux d'une méthode tient en quelques lignes.
  - key: vf-sql
    format: true-false
    question: Simuler le pilote SQL est le meilleur moyen de vérifier que les requêtes fonctionnent.
    truth: false
    answer: Seule une vraie base vérifie la syntaxe, les contraintes et les résultats.
  - key: vf-mocks
    format: true-false
    question: Les mocks générés qui vérifient chaque appel attendu rendent souvent les tests fragiles.
    truth: true
    answer: Ils cassent à chaque changement d'implémentation, même sans changement de comportement.
  - key: qcm-doubler
    format: multiple-choice
    question: "Lesquelles de ces dépendances doubles-tu dans un test unitaire ?"
    choices:
      - text: Une API de paiement externe
        correct: true
      - text: L'heure actuelle
        correct: true
      - text: Un service d'envoi d'e-mails
        correct: true
      - text: La fonction strings.ToUpper
        correct: false
    answer: On double ce qui est externe, lent ou non déterministe.
  - key: qcm-faux
    format: multiple-choice
    question: "Quelle qualité attends-tu d'un faux écrit à la main ?"
    choices:
      - {text: "Quelques lignes lisibles, avec des champs pour régler ses réponses", correct: true}
      - {text: "Une copie de toute la logique du vrai service, pour être fidèle", correct: false}
      - {text: "Des appels réseau vers un service de recette, pour être réaliste", correct: false}
      - {text: "Un état global partagé par tous les tests, pour aller plus vite", correct: false}
    answer: "Un bon faux tient en quelques lignes : des champs règlent ses réponses et enregistrent les appels. Il ne doit pas devenir un second système à maintenir, ni partager d'état entre tests."
  - key: qcm-interface
    format: multiple-choice
    question: "Le service n'utilise que la méthode `Envoyer` d'un client SMTP de 30 méthodes. Que fais-tu pour le tester ?"
    choices:
      - {text: "Une interface `Expediteur` d'une méthode dans le service, et un faux dans le test", correct: true}
      - {text: "Un mock généré des 30 méthodes du client SMTP, réglé dans chaque test", correct: false}
      - {text: "Le vrai serveur SMTP, appelé par les tests unitaires du service", correct: false}
      - {text: "Un type qui hérite du client SMTP et surcharge `Envoyer` dans le test", correct: false}
    answer: "L'interface décrit le besoin, pas le fournisseur : une méthode suffit, et le vrai client la satisfait implicitement. Go n'a pas d'héritage pour surcharger une méthode."
  - key: qcm-integration
    format: multiple-choice
    question: "Comment testes-tu le dépôt SQL lui-même ?"
    choices:
      - {text: "Contre une vraie base lancée par Testcontainers, migrations appliquées", correct: true}
      - {text: "Avec un faux dépôt en mémoire, plus rapide et sans dépendance", correct: false}
      - {text: "Avec un mock de `*sql.DB` qui attend chaque requête au caractère près", correct: false}
      - {text: "Sans test : le SQL d'un dépôt est trop simple pour casser", correct: false}
    answer: "Seule une vraie base vérifie le SQL, les types et les contraintes : Testcontainers la lance, les migrations la préparent. Le faux en mémoire sert à tester les services qui utilisent le dépôt."
  - key: bug-time-now
    format: bug-fix
    question: |-
      Le test de la remise du vendredi n'échoue que le vendredi. Quelle correction est la bonne ?
      ```go
      func (s *Service) Remise(montant int64) int64 {
      	if time.Now().Weekday() == time.Friday {
      		return montant / 10
      	}
      	return 0
      }
      ```
    choices:
      - {text: "Injecter l'heure dans le service (`maintenant func() time.Time`), fixée par le test", correct: true}
      - {text: "Passer `time.Now()` en UTC, pour que le jour ne dépende plus du fuseau", correct: false}
      - {text: "Appeler `t.Skip()` le vendredi, puisque le test dépend du jour", correct: false}
      - {text: "Remplacer `Weekday()` par `YearDay() % 7`, plus stable d'un jour à l'autre", correct: false}
    answer: "```go\ntype Service struct {\n\tmaintenant func() time.Time\n}\n\nfunc (s *Service) Remise(montant int64) int64 {\n\tif s.maintenant().Weekday() == time.Friday {\n\t\treturn montant / 10\n\t}\n\treturn 0\n}\n\n// dans le test\nvendredi := time.Date(2026, 11, 6, 12, 0, 0, 0, time.UTC)\ns := Service{maintenant: func() time.Time { return vendredi }}\n```\nL'heure injectée rend le test déterministe, quel que soit le jour où il tourne."
  - key: bug-type-concret
    format: bug-fix
    question: |-
      Le service est impossible à tester sans appeler la vraie API de paiement. Quelle correction est la bonne ?
      ```go
      type Service struct {
      	stripe *stripe.Client
      }
      ```
    choices:
      - {text: "Faire dépendre le service d'une petite interface `Paiements`, implémentée par un adaptateur Stripe", correct: true}
      - {text: "Garder `*stripe.Client` et faire pointer les tests vers l'environnement de recette de Stripe", correct: false}
      - {text: "Remplacer le pointeur par une valeur `stripe.Client`, que les tests peuvent copier et modifier", correct: false}
      - {text: "Déclarer, dans le package de Stripe, une interface qui reprend toutes les méthodes du client", correct: false}
    answer: "```go\ntype Paiements interface {\n\tDebiter(ctx context.Context, client string, montant int64) (string, error)\n}\n\ntype Service struct {\n\tpaiements Paiements\n}\n```\nLe service dépend d'une petite interface ; en production, un adaptateur l'implémente avec le client Stripe, dans le\ntest un faux."
  - key: bug-mock-fragile
    format: bug-fix
    question: |-
      Chaque refactorisation casse des dizaines de tests, sans changement de comportement. Quelle correction est la bonne ?
      ```go
      mockDepot.EXPECT().Trouver(gomock.Any(), "42").Return(c, nil).Times(1)
      mockDepot.EXPECT().Sauver(gomock.Any(), gomock.Any()).Return(nil).Times(1)
      mockDepot.EXPECT().Trouver(gomock.Any(), "42").Return(c, nil).Times(1)
      ```
    choices:
      - {text: "Un faux dépôt en mémoire, et vérifier le résultat plutôt que la suite des appels", correct: true}
      - {text: "Ajouter `.AnyTimes()` à chaque attente, pour qu'aucun appel ne fasse échouer le test", correct: false}
      - {text: "Régénérer les mocks avec mockgen après chaque refactorisation du service", correct: false}
      - {text: "Entourer les attentes de `gomock.InOrder`, pour figer l'ordre exact des appels", correct: false}
    answer: "```go\ndepot := nouveauDepotEnMemoire()\ndepot.Ajouter(Commande{ID: \"42\", Statut: EnAttente})\ns := Service{depot: depot}\n\nif err := s.Payer(t.Context(), \"42\"); err != nil {\n\tt.Fatal(err)\n}\nif c, _ := depot.Trouver(t.Context(), \"42\"); c.Statut != Payee {\n\tt.Errorf(\"statut = %v, attendu Payee\", c.Statut)\n}\n```\nLes mocks figeaient la suite exacte des appels ; un faux en mémoire permet de vérifier le résultat (le\ncomportement), pas la façon de l'obtenir."
  - key: bug-faux-global
    format: bug-fix
    question: |-
      Les tests se perturbent entre eux depuis qu'ils utilisent un faux partagé. Quelle correction est la bonne ?
      ```go
      var faux = &fauxPaiements{}

      func TestA(t *testing.T) { faux.err = ErrCarteRefusee; /* ... */ }
      func TestB(t *testing.T) { /* suppose faux.err == nil */ }
      ```
    choices:
      - {text: "Créer un faux neuf dans chaque test, avec ses propres réponses", correct: true}
      - {text: "Remettre `faux.err = nil` à la dernière ligne de `TestA`", correct: false}
      - {text: "Protéger le faux partagé par un `sync.Mutex`", correct: false}
      - {text: "Lancer les tests avec `-p 1`, un package à la fois", correct: false}
    answer: "```go\nfunc TestA(t *testing.T) {\n\tfaux := &fauxPaiements{err: ErrCarteRefusee}\n\ts := Service{paiements: faux}\n\t// ...\n}\n```\nChaque test crée son propre faux : aucun état ne fuit d'un test à l'autre."
  - key: scenario-strategie
    format: scenario
    question: "Comment répartis-tu tests unitaires avec doublures et tests d'intégration dans un service Go ?"
    choices:
      - {text: "Domaine et services en unitaire avec des faux, adaptateurs en intégration réelle, un peu de bout en bout", correct: true}
      - {text: "Tout en unitaire avec des mocks générés, adaptateurs SQL et clients HTTP compris", correct: false}
      - {text: "Tout en bout en bout contre une vraie base, sans aucun test unitaire ni doublure", correct: false}
      - {text: "De l'unitaire pour les adaptateurs seulement, le domaine étant vérifié en recette", correct: false}
    answer: "Le domaine et les services se testent unitairement, avec des faux écrits à la main pour les dépôts, les API et l'heure : rapides et nombreux. Les adaptateurs (dépôts SQL, clients HTTP) se testent contre de vrais systèmes (Testcontainers, `httptest.NewServer`). Quelques tests de bout en bout sur les handlers vérifient le câblage."
  - key: scenario-mock-ou-faux
    format: scenario
    question: "Quand utiliserais-tu un mock généré plutôt qu'un faux écrit à la main ?"
    choices:
      - {text: "Pour une grosse interface imposée, comme un SDK, ou quand le test porte justement sur les appels", correct: true}
      - {text: "Pour les dépôts et services internes, puisqu'un mock généré résiste mieux aux refactorisations", correct: false}
      - {text: "Jamais : un mock généré est toujours plus fragile qu'un faux, quelle que soit l'interface", correct: false}
      - {text: "Pour une interface d'une seule méthode, trop simple pour mériter un faux écrit à la main", correct: false}
    answer: "Quand l'interface est grosse et imposée (un SDK), ou quand le test porte sur les appels (un message envoyé exactement une fois), en restreignant les attentes au strict nécessaire. Pour les dépôts et services internes, un faux en mémoire est plus lisible et résiste aux refactorisations."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande comment les interfaces implicites aident à tester en Go. Que réponds-tu ?"
    choices:
      - {text: "Le consommateur déclare une petite interface que le type réel satisfait sans le savoir ; le test passe un faux", correct: true}
      - {text: "Le fournisseur déclare une interface de toutes ses méthodes, et un framework d'injection branche les mocks", correct: false}
      - {text: "Elles permettent de redéfinir dans les tests une méthode d'un type existant, sans toucher à son code", correct: false}
      - {text: "Chaque type déclare `implements` pour ses interfaces, ce qui permet ensuite de générer les mocks", correct: false}
    answer: "Le code qui utilise une dépendance déclare une interface avec les seules méthodes dont il a besoin ; le type réel la satisfait sans le savoir, même s'il vient d'une bibliothèque, et le test fournit un faux de quelques lignes. Ni interfaces préventives partout, ni framework d'injection : l'interface naît là où un test ou un second fournisseur la rend utile."
