notion: doublures-interfaces
lesson: "Pour tester un code qui dépend d'une base, d'une API ou de l'heure, on remplace la dépendance par une **doublure** :\nun faux, contrôlé par le test. En Go, cela passe par une **interface**, définie **là où elle est utilisée**, avec\nseulement les méthodes nécessaires :\n\n```go\n// dans le package commande : ce dont le service a besoin\ntype Paiements interface {\n\tDebiter(ctx context.Context, client string, montant int64) (string, error)\n}\n\ntype Service struct {\n\tpaiements Paiements\n\thorloge   func() time.Time\n}\n\n// dans le test\ntype fauxPaiements struct {\n\terr    error\n\tappels []int64\n}\n\nfunc (f *fauxPaiements) Debiter(ctx context.Context, client string, montant int64) (string, error) {\n\tf.appels = append(f.appels, montant)\n\treturn \"tx-1\", f.err\n}\n\nfunc TestCommanderEchoueSiLePaiementEchoue(t *testing.T) {\n\tpaiements := &fauxPaiements{err: ErrCarteRefusee}\n\ts := Service{paiements: paiements, horloge: func() time.Time { return dateFixe }}\n\tif err := s.Commander(t.Context(), panier); !errors.Is(err, ErrCarteRefusee) {\n\t\tt.Errorf(\"err = %v, attendu ErrCarteRefusee\", err)\n\t}\n}\n```\n\nLes sortes de doublures :\n- un **bouchon** (*stub*) renvoie des réponses préparées ;\n- un **espion** (*spy*) enregistre les appels pour les vérifier ;\n- un **faux** (*fake*) est une implémentation simplifiée qui fonctionne vraiment (un dépôt en mémoire) ;\n- un **mock** généré (`gomock`, `mockery`) vérifie les appels attendus ; pratique pour de grosses interfaces, mais\n  souvent fragile.\n\nEn Go, on préfère les **petites interfaces** et les **faux écrits à la main** : quelques lignes, lisibles, sans\nframework. Les interfaces implicites permettent de doubler un type d'un autre package sans le modifier.\n\nOn ne double que ce qu'on ne contrôle pas ou qui est lent ; pour la base de données, un vrai PostgreSQL\n(Testcontainers) dans les tests d'intégration vaut mieux qu'un mock du SQL.\n\n**En entretien** : « Une petite interface déclarée chez l'utilisateur ; un faux écrit à la main ; injecter aussi\nl'heure ; mocks générés avec modération ; une vraie base pour tester le SQL. »"
cards:
  - key: service-appelle-api-paiement-externe-rendre
    format: scenario
    question: Ton service appelle une API de paiement externe. Comment le rendre testable ?
    answer: |-
      Dans le package métier qui en a besoin, je déclare une petite interface qui décrit uniquement ce que j'utilise :
      ```go
      type Paiements interface {
          Debiter(ctx context.Context, compte string, montant int64) (string, error)
      }
      ```
      Le service reçoit cette interface par son constructeur. L'adaptateur réel (le client HTTP de l'API) vit dans un package d'infrastructure et la satisfait implicitement. En test, j'injecte une fausse implémentation écrite à la main, une simple struct avec des champs pour les réponses et les appels enregistrés, ou un mock généré si les interactions sont complexes.
      C'est l'inverse du réflexe Java : je ne crée pas une interface dans le package du client pour 'exposer' l'API, c'est le consommateur qui la définit, à sa mesure.
  - key: faux-manuel-mock-genere
    format: course
    question: Faux manuel ou mock généré ?
    answer: Faux manuel pour de petites interfaces ; mock généré (mockgen, mockery) pour des interactions complexes.
  - key: ou
    format: course
    question: Où déclarer l'interface d'une dépendance à doubler ?
    answer: Dans le package qui l'utilise, avec seulement les méthodes dont il a besoin ; le type réel la satisfait implicitement, sans connaître l'interface.
  - key: sortes
    format: course
    question: Quelle différence entre un bouchon, un espion et un faux ?
    answer: Le bouchon renvoie des réponses préparées, l'espion enregistre les appels pour qu'on les vérifie, le faux est une implémentation simplifiée qui fonctionne vraiment (un dépôt en mémoire).
  - key: heure
    format: course
    question: Comment tester un code qui dépend de l'heure actuelle ?
    answer: En injectant l'heure (une fonction `func() time.Time` ou une petite interface Horloge) au lieu d'appeler time.Now() directement ; le test fournit une date fixe ou qu'il fait avancer.
  - key: vf-implicite
    format: true-false
    question: Pour doubler un type d'un autre package, il faut modifier ce type pour qu'il déclare implémenter l'interface.
    truth: false
    answer: Les interfaces sont satisfaites implicitement.
  - key: vf-petite
    format: true-false
    question: Une petite interface est plus facile à doubler qu'une grosse.
    truth: true
    answer: Un faux d'une méthode tient en quelques lignes.
  - key: vf-sql
    format: true-false
    question: Simuler le pilote SQL est le meilleur moyen de vérifier que les requêtes fonctionnent.
    truth: false
    answer: Seule une vraie base vérifie la syntaxe, les contraintes et les résultats.
  - key: vf-mocks
    format: true-false
    question: Les mocks générés qui vérifient chaque appel attendu rendent souvent les tests fragiles.
    truth: true
    answer: Ils cassent à chaque changement d'implémentation, même sans changement de comportement.
  - key: qcm-doubler
    format: multiple-choice
    question: Quelles dépendances doubler dans un test unitaire ?
    choices:
      - text: Une API de paiement externe
        correct: true
      - text: L'heure actuelle
        correct: true
      - text: Un service d'envoi d'e-mails
        correct: true
      - text: La fonction strings.ToUpper
        correct: false
    answer: On double ce qui est externe, lent ou non déterministe.
  - key: qcm-faux
    format: multiple-choice
    question: Quelles qualités a un bon faux écrit à la main ?
    choices:
      - text: Quelques lignes, faciles à lire
        correct: true
      - text: Des champs pour régler ses réponses et enregistrer les appels
        correct: true
      - text: Une copie de toute la logique du vrai service
        correct: false
      - text: Des dépendances réseau
        correct: false
    answer: Il ne doit pas devenir un second système à maintenir.
  - key: qcm-interface
    format: multiple-choice
    question: Le service n'utilise que la méthode Envoyer d'un client SMTP de 30 méthodes. Que faire ?
    choices:
      - text: Déclarer dans le service une interface Expediteur avec la seule méthode Envoyer
        correct: true
      - text: Écrire un faux de cette interface d'une méthode dans le test
        correct: true
      - text: Générer un mock des 30 méthodes
        correct: false
      - text: Utiliser le vrai serveur SMTP dans les tests unitaires
        correct: false
    answer: L'interface décrit le besoin, pas le fournisseur.
  - key: qcm-integration
    format: multiple-choice
    question: Comment tester le dépôt SQL lui-même ?
    choices:
      - text: Contre une vraie base lancée par Testcontainers
        correct: true
      - text: Avec les migrations appliquées avant les tests
        correct: true
      - text: Avec un faux dépôt en mémoire
        correct: false
      - text: Sans test, le SQL est simple
        correct: false
    answer: Le faux en mémoire sert à tester les services qui utilisent le dépôt.
  - key: bug-time-now
    format: bug-fix
    question: "Le test de la remise du vendredi n'échoue que le vendredi :\n```go\nfunc (s *Service) Remise(montant int64) int64 {\n\tif time.Now().Weekday() == time.Friday {\n\t\treturn montant / 10\n\t}\n\treturn 0\n}\n```"
    answer: "```go\ntype Service struct {\n\tmaintenant func() time.Time\n}\n\nfunc (s *Service) Remise(montant int64) int64 {\n\tif s.maintenant().Weekday() == time.Friday {\n\t\treturn montant / 10\n\t}\n\treturn 0\n}\n\n// dans le test\nvendredi := time.Date(2026, 11, 6, 12, 0, 0, 0, time.UTC)\ns := Service{maintenant: func() time.Time { return vendredi }}\n```\nL'heure injectée rend le test déterministe, quel que soit le jour où il tourne."
  - key: bug-type-concret
    format: bug-fix
    question: "Le service est impossible à tester sans appeler la vraie API de paiement :\n```go\ntype Service struct {\n\tstripe *stripe.Client\n}\n```"
    answer: "```go\ntype Paiements interface {\n\tDebiter(ctx context.Context, client string, montant int64) (string, error)\n}\n\ntype Service struct {\n\tpaiements Paiements\n}\n```\nLe service dépend d'une petite interface ; en production, un adaptateur l'implémente avec le client Stripe, dans le\ntest un faux."
  - key: bug-mock-fragile
    format: bug-fix
    question: |-
      Chaque refactorisation casse des dizaines de tests, sans changement de comportement :
      ```go
      mockDepot.EXPECT().Trouver(gomock.Any(), "42").Return(c, nil).Times(1)
      mockDepot.EXPECT().Sauver(gomock.Any(), gomock.Any()).Return(nil).Times(1)
      mockDepot.EXPECT().Trouver(gomock.Any(), "42").Return(c, nil).Times(1)
      ```
    answer: "```go\ndepot := nouveauDepotEnMemoire()\ndepot.Ajouter(Commande{ID: \"42\", Statut: EnAttente})\ns := Service{depot: depot}\n\nif err := s.Payer(t.Context(), \"42\"); err != nil {\n\tt.Fatal(err)\n}\nif c, _ := depot.Trouver(t.Context(), \"42\"); c.Statut != Payee {\n\tt.Errorf(\"statut = %v, attendu Payee\", c.Statut)\n}\n```\nLes mocks figeaient la suite exacte des appels ; un faux en mémoire permet de vérifier le résultat (le\ncomportement), pas la façon de l'obtenir."
  - key: bug-faux-global
    format: bug-fix
    question: |-
      Les tests se perturbent entre eux depuis qu'ils utilisent un faux partagé :
      ```go
      var faux = &fauxPaiements{}

      func TestA(t *testing.T) { faux.err = ErrCarteRefusee; /* ... */ }
      func TestB(t *testing.T) { /* suppose faux.err == nil */ }
      ```
    answer: "```go\nfunc TestA(t *testing.T) {\n\tfaux := &fauxPaiements{err: ErrCarteRefusee}\n\ts := Service{paiements: faux}\n\t// ...\n}\n```\nChaque test crée son propre faux : aucun état ne fuit d'un test à l'autre."
  - key: scenario-strategie
    format: scenario
    question: Comment répartis-tu tests unitaires avec doublures et tests d'intégration dans un service Go ?
    answer: |-
      Le domaine et les services se testent unitairement, avec des faux écrits à la main pour les dépôts, les API et
      l'heure : rapides et nombreux. Les adaptateurs (dépôts SQL, clients HTTP) se testent en intégration contre de vrais
      systèmes : Testcontainers pour la base, httptest.NewServer pour une API. Enfin, quelques tests de bout en bout sur
      les handlers HTTP avec tout branché, pour vérifier le câblage.
  - key: scenario-mock-ou-faux
    format: scenario
    question: Quand utiliserais-tu un mock généré plutôt qu'un faux écrit à la main ?
    answer: |-
      Quand l'interface est grosse et imposée (un SDK), ou quand le test porte justement sur les appels (vérifier qu'un
      message est envoyé exactement une fois). Je restreins alors les attentes au strict nécessaire (pas d'ordre, pas de
      Times sur chaque appel). Pour les dépôts et les services internes, un faux en mémoire est plus lisible et résiste
      aux refactorisations.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande comment les interfaces implicites aident à tester en Go.
    answer: |-
      Le code qui utilise une dépendance déclare une interface avec les seules méthodes dont il a besoin ; le type réel la
      satisfait sans le savoir, même s'il vient d'une bibliothèque. Le test fournit un faux de quelques lignes. On n'a pas
      besoin d'interfaces préventives partout, ni de frameworks d'injection : on introduit l'interface là où un test ou un
      second fournisseur la rend utile.
