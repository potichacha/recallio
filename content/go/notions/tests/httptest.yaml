notion: httptest
lesson: "Le package **`net/http/httptest`** teste le code HTTP sans réseau externe, dans les deux sens.\n\n**Tester un handler** : un `ResponseRecorder` remplace le `ResponseWriter`.\n\n```go\nfunc TestLireCommande(t *testing.T) {\n\ts := NouveauServeur(fauxDepot{commandes: map[string]Commande{\"42\": {ID: \"42\"}}})\n\treq := httptest.NewRequest(http.MethodGet, \"/commandes/42\", nil)\n\trec := httptest.NewRecorder()\n\n\ts.Routes().ServeHTTP(rec, req) // passer par le routeur : les motifs {id} sont remplis\n\n\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf(\"statut = %d, attendu 200 ; corps : %s\", rec.Code, rec.Body)\n\t}\n\tvar c CommandeReponse\n\tif err := json.NewDecoder(rec.Body).Decode(&c); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n```\n\n**Tester un client** : `httptest.NewServer` démarre un vrai serveur sur un port local, avec un handler qui joue le\nrôle du partenaire.\n\n```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tif r.URL.Path != \"/produits/42\" {\n\t\tt.Errorf(\"chemin = %s\", r.URL.Path)\n\t}\n\tw.WriteHeader(http.StatusServiceUnavailable)\n}))\nt.Cleanup(srv.Close)\n\nc := NouveauClient(srv.URL, srv.Client())\n_, err := c.Produit(t.Context(), \"42\")\n```\n\nCe qu'il faut savoir :\n- `httptest.NewRequest` ne renvoie pas d'erreur (il panique sur une entrée invalide) : parfait dans un test ;\n- pour les variables de chemin, on passe par le **routeur** ; on peut aussi appeler `req.SetPathValue(\"id\", \"42\")`\n  pour tester le handler seul ;\n- `rec.Result()` donne une `*http.Response` avec les en-têtes envoyés ;\n- `httptest.NewTLSServer` et `srv.Client()` testent le TLS ;\n- le handler du faux serveur s'exécute dans une autre goroutine : `t.Errorf` y est permis, `t.Fatal` non.\n\n**En entretien** : « NewRecorder et NewRequest pour un handler, en passant par le routeur ; NewServer pour un client,\navec srv.URL ; t.Cleanup(srv.Close) ; pas de t.Fatal dans le handler du faux serveur. »"
cards:
  - key: tester-handler-sans-demarrer-serveur
    format: course
    question: "Comment testes-tu un handler sans démarrer de serveur ?"
    choices:
      - {text: "Avec `httptest.NewRequest` et `httptest.NewRecorder`, en appelant `ServeHTTP`", correct: true}
      - {text: "Avec `httptest.NewServer`, qui ouvre un port local pour le handler", correct: false}
      - {text: "Avec `http.ListenAndServe`, lancé dans une goroutine du test", correct: false}
      - {text: "Avec `http.Get` vers l'URL du service déployé en recette", correct: false}
    answer: "`httptest.NewRequest` construit la requête, `httptest.NewRecorder` enregistre la réponse, et l'on appelle `ServeHTTP` directement. `NewServer`, lui, démarre un vrai serveur local."
  - key: tester-handler-http
    format: course
    question: "Quels outils de `httptest` servent à tester un handler HTTP ?"
    choices:
      - {text: "`httptest.NewRequest` pour la requête, `httptest.NewRecorder` pour la réponse", correct: true}
      - {text: "`httptest.NewServer` pour la requête, `httptest.NewRecorder` pour la réponse", correct: false}
      - {text: "`http.NewRequest` pour la requête, `os.Stdout` pour lire la réponse", correct: false}
      - {text: "`httptest.NewTLSServer` pour la requête, `srv.Client()` pour la réponse", correct: false}
    answer: "`httptest.NewRequest` et `httptest.NewRecorder`. `NewServer` et `NewTLSServer` servent à tester un client."
  - key: tester-client-http
    format: course
    question: "Comment testes-tu un client HTTP ?"
    choices:
      - {text: "Avec `httptest.NewServer`, qui simule le serveur distant", correct: true}
      - {text: "Avec `httptest.NewRecorder`, qui enregistre les requêtes envoyées", correct: false}
      - {text: "Avec l'API de production, seule fidèle au vrai comportement", correct: false}
      - {text: "Avec un mock de `http.Client` généré par mockgen", correct: false}
    answer: "`httptest.NewServer` simule le serveur distant : le client reçoit `srv.URL`. `http.Client` est une struct, pas une interface : on ne le mocke pas."
  - key: setpathvalue
    format: course
    question: "Comment testes-tu un handler qui lit `r.PathValue(\"id\")` sans passer par le routeur ?"
    choices:
      - {text: "En appelant `req.SetPathValue(\"id\", \"42\")` sur la requête de `httptest.NewRequest`", correct: true}
      - {text: "En mettant `?id=42` dans l'URL de la requête, que `PathValue` lit aussi", correct: false}
      - {text: "Rien à faire : `httptest.NewRequest` remplit `PathValue` d'après l'URL", correct: false}
      - {text: "En ajoutant un en-tête `id: 42`, que `PathValue` lit en dernier recours", correct: false}
    answer: "En appelant `req.SetPathValue(\"id\", \"42\")` sur la requête créée par `httptest.NewRequest` ; sinon `PathValue` renvoie une chaîne vide. Passer par le routeur teste en plus le motif."
  - key: vf-reseau
    format: true-false
    question: Un test avec httptest.NewRecorder ouvre une connexion réseau.
    truth: false
    answer: Le handler est appelé directement, en mémoire.
  - key: vf-newserver
    format: true-false
    question: httptest.NewServer démarre un vrai serveur HTTP sur un port local.
    truth: true
    answer: Son adresse est dans srv.URL.
  - key: vf-fatal
    format: true-false
    question: On peut appeler t.Fatal dans le handler d'un httptest.NewServer.
    truth: false
    answer: Le handler tourne dans une autre goroutine ; on utilise t.Errorf.
  - key: vf-close
    format: true-false
    question: Il faut fermer un serveur de test avec srv.Close, par exemple via t.Cleanup.
    truth: true
    answer: Sinon il reste ouvert jusqu'à la fin du binaire de test.
  - key: qcm-outils
    format: multiple-choice
    question: "Quel outil choisis-tu pour tester un client HTTP qui parle en TLS ?"
    choices:
      - {text: "`httptest.NewTLSServer` et `srv.Client()`", correct: true}
      - {text: "`httptest.NewRecorder` et `NewRequest`", correct: false}
      - {text: "`httptest.NewServer` et `http.DefaultClient`", correct: false}
      - {text: "L'API de production, appelée en HTTPS", correct: false}
    answer: "`NewTLSServer` démarre un serveur HTTPS de test, et `srv.Client()` renvoie un client qui fait confiance à son certificat. `NewRecorder` sert à tester un handler, et aucun test ne doit dépendre d'un service réel."
  - key: qcm-cas-client
    format: multiple-choice
    question: "Avec un faux serveur, comment vérifies-tu que le client respecte son délai ?"
    choices:
      - {text: "Un handler qui attend plus longtemps que le délai du client", correct: true}
      - {text: "Un handler qui répond 503 tout de suite", correct: false}
      - {text: "Un handler qui renvoie un corps JSON invalide", correct: false}
      - {text: "Un handler qui répond 200 avec un corps valide", correct: false}
    answer: "Le faux serveur provoque chaque cas à volonté : un handler qui attend plus que le délai vérifie que le client abandonne. On teste aussi la réponse 200 valide, les statuts 500 ou 503 et le JSON invalide."
  - key: qcm-result
    format: multiple-choice
    question: Que donne `rec.Result()` ?
    choices:
      - {text: "Une *http.Response avec le statut, les en-têtes envoyés et le corps", correct: true}
      - {text: "Une erreur si le handler a échoué, ou `nil` s'il a répondu 200", correct: false}
      - {text: "Le nombre de requêtes reçues par le recorder pendant le test", correct: false}
      - {text: "La `*http.Request` d'origine, complétée par les en-têtes ajoutés", correct: false}
    answer: Ses en-têtes sont ceux figés au moment de l'envoi du statut.
  - key: qcm-routeur
    format: multiple-choice
    question: "Pourquoi appeler `s.Routes().ServeHTTP(rec, req)` plutôt que le handler directement ?"
    choices:
      - {text: "Le routeur remplit les variables de chemin, et l'on teste aussi motif, méthode et middlewares", correct: true}
      - {text: "C'est obligatoire pour que le recorder enregistre bien la réponse du handler", correct: false}
      - {text: "Pour ouvrir un vrai port réseau, plus fidèle qu'un simple recorder", correct: false}
      - {text: "Pour que le handler s'exécute dans sa propre goroutine, comme en production", correct: false}
    answer: "Le routeur remplit `PathValue` et vérifie au passage le motif, la méthode et les middlewares. Appeler le handler seul reste possible avec `SetPathValue`."
  - key: trous-recorder
    format: fill-in
    question: |-
      Complète :
      ```go
      req := httptest.___(http.MethodGet, "/sante", nil)
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, req)
      ```
    blanks:
      - - NewRequest
    answer: httptest.NewRequest.
  - key: trous-code
    format: fill-in
    question: |-
      Complète la vérification du statut :
      ```go
      if rec.___ != http.StatusCreated {
      	t.Errorf("statut = %d, attendu 201", rec.Code)
      }
      ```
    blanks:
      - - Code
    answer: rec.Code.
  - key: trous-url
    format: fill-in
    question: |-
      Complète pour pointer le client vers le faux serveur :
      ```go
      srv := httptest.NewServer(h)
      t.Cleanup(srv.Close)
      c := NouveauClient(srv.___)
      ```
    blanks:
      - - URL
    answer: srv.URL.
  - key: trous-newserver
    format: fill-in
    question: |-
      Complète :
      ```go
      srv := httptest.___(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	w.WriteHeader(http.StatusInternalServerError)
      }))
      ```
    blanks:
      - - NewServer
    answer: httptest.NewServer.
  - key: bug-pathvalue
    format: bug-fix
    question: |-
      Le test reçoit toujours 404, alors que la commande existe dans le faux dépôt. Quelle correction est la bonne ?
      ```go
      req := httptest.NewRequest(http.MethodGet, "/commandes/42", nil)
      rec := httptest.NewRecorder()
      s.lireCommande(rec, req) // lit r.PathValue("id")
      ```
    choices:
      - {text: "Passer par le routeur : `s.Routes().ServeHTTP(rec, req)`", correct: true}
      - {text: "Remplacer `httptest.NewRequest` par `http.NewRequest`", correct: false}
      - {text: "Préfixer l'URL de la requête par `http://localhost`", correct: false}
      - {text: "Créer le recorder avant la requête, pour qu'il voie le chemin", correct: false}
    answer: |-
      ```go
      req := httptest.NewRequest(http.MethodGet, "/commandes/42", nil)
      rec := httptest.NewRecorder()
      s.Routes().ServeHTTP(rec, req)
      ```
      Appelé directement, le handler ne voyait pas de variable de chemin (PathValue renvoyait "") ; le routeur la remplit
      (ou `req.SetPathValue("id", "42")`).
  - key: bug-fatal-handler
    format: bug-fix
    question: |-
      `go vet` signale l'appel à `t.Fatal` dans le faux serveur. Quelle correction est la bonne ?
      ```go
      srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	if r.Header.Get("Authorization") == "" {
      		t.Fatal("en-tête Authorization absent")
      	}
      }))
      ```
    choices:
      - {text: "`t.Error`, puis répondre 401 et `return` : `t.Fatal` n'a pas sa place hors de la goroutine du test", correct: true}
      - {text: "`panic(\"en-tête absent\")`, que le paquet `testing` transforme en échec propre du test", correct: false}
      - {text: "`log.Fatal`, qui arrête le serveur de test sans toucher au déroulement du test", correct: false}
      - {text: "`t.Fatal` placé dans un `defer`, exécuté seulement après la fin du handler", correct: false}
    answer: "```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tif r.Header.Get(\"Authorization\") == \"\" {\n\t\tt.Error(\"en-tête Authorization absent\")\n\t\tw.WriteHeader(http.StatusUnauthorized)\n\t\treturn\n\t}\n}))\n```\nLe handler s'exécute dans une goroutine du serveur ; t.Error y est permis, t.Fatal non."
  - key: bug-close
    format: bug-fix
    question: |-
      Après des centaines de tests, le binaire de test garde des centaines de serveurs ouverts. Quelle correction est la bonne ?
      ```go
      srv := httptest.NewServer(h)
      c := NouveauClient(srv.URL)
      ```
    choices:
      - {text: "Ajouter `t.Cleanup(srv.Close)` juste après la création du serveur", correct: true}
      - {text: "Appeler `srv.Close()` au début du test suivant", correct: false}
      - {text: "Fermer le client, ce qui ferme aussi son serveur", correct: false}
      - {text: "Lancer les tests avec `-p 1`, un serveur à la fois", correct: false}
    answer: |-
      ```go
      srv := httptest.NewServer(h)
      t.Cleanup(srv.Close)
      c := NouveauClient(srv.URL)
      ```
      Chaque serveur de test doit être fermé à la fin de son test.
  - key: bug-reseau-reel
    format: bug-fix
    question: |-
      Le test du client météo échoue chaque fois que l'API publique est indisponible. Quelle correction est la bonne ?
      ```go
      c := NouveauClient("https://api.meteo.exemple")
      temp, err := c.Temperature(t.Context(), "Paris")
      ```
    choices:
      - {text: "Un faux serveur `httptest.NewServer` qui renvoie une réponse préparée", correct: true}
      - {text: "Relancer le test trois fois avant de le déclarer en échec", correct: false}
      - {text: "Sauter le test avec `t.Skip` quand l'API ne répond pas", correct: false}
      - {text: "Allonger le délai du client à une minute, le temps que l'API réponde", correct: false}
    answer: "```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tfmt.Fprint(w, `{\"ville\":\"Paris\",\"temperature\":12.5}`)\n}))\nt.Cleanup(srv.Close)\nc := NouveauClient(srv.URL)\ntemp, err := c.Temperature(t.Context(), \"Paris\")\n```\nLe test ne dépend plus d'un service externe : un faux serveur renvoie une réponse préparée."
