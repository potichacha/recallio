notion: httptest
lesson: "Le package **`net/http/httptest`** teste le code HTTP sans réseau externe, dans les deux sens.\n\n**Tester un handler** : un `ResponseRecorder` remplace le `ResponseWriter`.\n\n```go\nfunc TestLireCommande(t *testing.T) {\n\ts := NouveauServeur(fauxDepot{commandes: map[string]Commande{\"42\": {ID: \"42\"}}})\n\treq := httptest.NewRequest(http.MethodGet, \"/commandes/42\", nil)\n\trec := httptest.NewRecorder()\n\n\ts.Routes().ServeHTTP(rec, req) // passer par le routeur : les motifs {id} sont remplis\n\n\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf(\"statut = %d, attendu 200 ; corps : %s\", rec.Code, rec.Body)\n\t}\n\tvar c CommandeReponse\n\tif err := json.NewDecoder(rec.Body).Decode(&c); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n```\n\n**Tester un client** : `httptest.NewServer` démarre un vrai serveur sur un port local, avec un handler qui joue le\nrôle du partenaire.\n\n```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tif r.URL.Path != \"/produits/42\" {\n\t\tt.Errorf(\"chemin = %s\", r.URL.Path)\n\t}\n\tw.WriteHeader(http.StatusServiceUnavailable)\n}))\nt.Cleanup(srv.Close)\n\nc := NouveauClient(srv.URL, srv.Client())\n_, err := c.Produit(t.Context(), \"42\")\n```\n\nCe qu'il faut savoir :\n- `httptest.NewRequest` ne renvoie pas d'erreur (il panique sur une entrée invalide) : parfait dans un test ;\n- pour les variables de chemin, on passe par le **routeur** ; on peut aussi appeler `req.SetPathValue(\"id\", \"42\")`\n  pour tester le handler seul ;\n- `rec.Result()` donne une `*http.Response` avec les en-têtes envoyés ;\n- `httptest.NewTLSServer` et `srv.Client()` testent le TLS ;\n- le handler du faux serveur s'exécute dans une autre goroutine : `t.Errorf` y est permis, `t.Fatal` non.\n\n**En entretien** : « NewRecorder et NewRequest pour un handler, en passant par le routeur ; NewServer pour un client,\navec srv.URL ; t.Cleanup(srv.Close) ; pas de t.Fatal dans le handler du faux serveur. »"
cards:
  - key: tester-handler-sans-demarrer-serveur
    format: course
    question: Comment tester un handler sans démarrer de serveur ?
    answer: httptest.NewRecorder et httptest.NewRequest.
  - key: tester-handler-http
    format: course
    question: Comment tester un handler HTTP ?
    answer: httptest.NewRequest et httptest.NewRecorder.
  - key: tester-client-http
    format: course
    question: Comment tester un client HTTP ?
    answer: httptest.NewServer qui simule le serveur distant.
  - key: setpathvalue
    format: course
    question: Comment tester un handler qui lit `r.PathValue("id")` sans passer par le routeur ?
    answer: En appelant `req.SetPathValue("id", "42")` sur la requête créée par httptest.NewRequest ; sinon PathValue renvoie une chaîne vide. Passer par le routeur teste en plus le motif.
  - key: vf-reseau
    format: true-false
    question: Un test avec httptest.NewRecorder ouvre une connexion réseau.
    truth: false
    answer: Le handler est appelé directement, en mémoire.
  - key: vf-newserver
    format: true-false
    question: httptest.NewServer démarre un vrai serveur HTTP sur un port local.
    truth: true
    answer: Son adresse est dans srv.URL.
  - key: vf-fatal
    format: true-false
    question: On peut appeler t.Fatal dans le handler d'un httptest.NewServer.
    truth: false
    answer: Le handler tourne dans une autre goroutine ; on utilise t.Errorf.
  - key: vf-close
    format: true-false
    question: Il faut fermer un serveur de test avec srv.Close, par exemple via t.Cleanup.
    truth: true
    answer: Sinon il reste ouvert jusqu'à la fin du binaire de test.
  - key: qcm-outils
    format: multiple-choice
    question: Quel outil pour quel test ?
    choices:
      - text: 'Tester un handler : httptest.NewRecorder et NewRequest'
        correct: true
      - text: 'Tester un client HTTP : httptest.NewServer'
        correct: true
      - text: 'Tester un client en TLS : httptest.NewTLSServer et srv.Client()'
        correct: true
      - text: 'Tester un handler : appeler l''API de production'
        correct: false
    answer: Aucun test ne doit dépendre d'un service externe réel.
  - key: qcm-cas-client
    format: multiple-choice
    question: Quels cas tester pour un client HTTP avec un faux serveur ?
    choices:
      - text: Une réponse 200 avec un corps valide
        correct: true
      - text: Un statut 500 ou 503
        correct: true
      - text: Un corps JSON invalide
        correct: true
      - text: Une réponse lente, pour vérifier le délai
        correct: true
    answer: Le faux serveur permet de provoquer chaque cas à volonté.
  - key: qcm-result
    format: multiple-choice
    question: Que donne `rec.Result()` ?
    choices:
      - text: Une *http.Response avec le statut, les en-têtes envoyés et le corps
        correct: true
      - text: Une erreur si le handler a échoué
        correct: false
      - text: Le nombre de requêtes reçues
        correct: false
      - text: La requête d'origine
        correct: false
    answer: Ses en-têtes sont ceux figés au moment de l'envoi du statut.
  - key: qcm-routeur
    format: multiple-choice
    question: Pourquoi appeler `s.Routes().ServeHTTP(rec, req)` plutôt que le handler directement ?
    choices:
      - text: Le routeur remplit les variables de chemin
        correct: true
      - text: On teste aussi le motif, la méthode et les middlewares
        correct: true
      - text: C'est obligatoire pour que le recorder fonctionne
        correct: false
      - text: Pour ouvrir un port réseau
        correct: false
    answer: Appeler le handler seul est possible avec SetPathValue.
  - key: trous-recorder
    format: fill-in
    question: |-
      Complétez :
      ```go
      req := httptest.___(http.MethodGet, "/sante", nil)
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, req)
      ```
    blanks:
      - - NewRequest
    answer: httptest.NewRequest.
  - key: trous-code
    format: fill-in
    question: "Complétez la vérification du statut :\n```go\nif rec.___ != http.StatusCreated {\n\tt.Errorf(\"statut = %d, attendu 201\", rec.Code)\n}\n```"
    blanks:
      - - Code
    answer: rec.Code.
  - key: trous-url
    format: fill-in
    question: |-
      Complétez pour pointer le client vers le faux serveur :
      ```go
      srv := httptest.NewServer(h)
      t.Cleanup(srv.Close)
      c := NouveauClient(srv.___)
      ```
    blanks:
      - - URL
    answer: srv.URL.
  - key: trous-newserver
    format: fill-in
    question: "Complétez :\n```go\nsrv := httptest.___(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tw.WriteHeader(http.StatusInternalServerError)\n}))\n```"
    blanks:
      - - NewServer
    answer: httptest.NewServer.
  - key: bug-pathvalue
    format: bug-fix
    question: |-
      Le test reçoit toujours 404, alors que la commande existe dans le faux dépôt :
      ```go
      req := httptest.NewRequest(http.MethodGet, "/commandes/42", nil)
      rec := httptest.NewRecorder()
      s.lireCommande(rec, req) // lit r.PathValue("id")
      ```
    answer: |-
      ```go
      req := httptest.NewRequest(http.MethodGet, "/commandes/42", nil)
      rec := httptest.NewRecorder()
      s.Routes().ServeHTTP(rec, req)
      ```
      Appelé directement, le handler ne voyait pas de variable de chemin (PathValue renvoyait "") ; le routeur la remplit
      (ou `req.SetPathValue("id", "42")`).
  - key: bug-fatal-handler
    format: bug-fix
    question: "`go vet` signale l'appel à t.Fatal dans le faux serveur :\n```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tif r.Header.Get(\"Authorization\") == \"\" {\n\t\tt.Fatal(\"en-tête Authorization absent\")\n\t}\n}))\n```"
    answer: "```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tif r.Header.Get(\"Authorization\") == \"\" {\n\t\tt.Error(\"en-tête Authorization absent\")\n\t\tw.WriteHeader(http.StatusUnauthorized)\n\t\treturn\n\t}\n}))\n```\nLe handler s'exécute dans une goroutine du serveur ; t.Error y est permis, t.Fatal non."
  - key: bug-close
    format: bug-fix
    question: |-
      Après des centaines de tests, le binaire de test garde des centaines de serveurs ouverts :
      ```go
      srv := httptest.NewServer(h)
      c := NouveauClient(srv.URL)
      ```
    answer: |-
      ```go
      srv := httptest.NewServer(h)
      t.Cleanup(srv.Close)
      c := NouveauClient(srv.URL)
      ```
      Chaque serveur de test doit être fermé à la fin de son test.
  - key: bug-reseau-reel
    format: bug-fix
    question: |-
      Le test du client météo échoue chaque fois que l'API publique est indisponible :
      ```go
      c := NouveauClient("https://api.meteo.exemple")
      temp, err := c.Temperature(t.Context(), "Paris")
      ```
    answer: "```go\nsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tfmt.Fprint(w, `{\"ville\":\"Paris\",\"temperature\":12.5}`)\n}))\nt.Cleanup(srv.Close)\nc := NouveauClient(srv.URL)\ntemp, err := c.Temperature(t.Context(), \"Paris\")\n```\nLe test ne dépend plus d'un service externe : un faux serveur renvoie une réponse préparée."
