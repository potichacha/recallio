notion: httptest
cards:
  - key: tester-handler-sans-demarrer-serveur
    format: course
    question: Comment tester un handler sans démarrer de serveur ?
    answer: httptest.NewRecorder et httptest.NewRequest.
  - key: tester-handler-http
    format: course
    question: Comment tester un handler HTTP ?
    answer: httptest.NewRequest et httptest.NewRecorder.
  - key: tester-client-http
    format: course
    question: Comment tester un client HTTP ?
    answer: httptest.NewServer qui simule le serveur distant.
