notion: synctest
lesson: "Le package **`testing/synctest`** (stable depuis **Go 1.25**) teste le code **concurrent** et **temporel** sans attendre\nde vraies durées et sans tests instables.\n\n```go\nfunc TestCacheExpire(t *testing.T) {\n\tsynctest.Test(t, func(t *testing.T) {\n\t\tc := NouveauCache(time.Minute)\n\t\tc.Mettre(\"cle\", \"valeur\")\n\n\t\ttime.Sleep(59 * time.Second) // instantané : horloge virtuelle\n\t\tif _, ok := c.Lire(\"cle\"); !ok {\n\t\t\tt.Error(\"expirée trop tôt\")\n\t\t}\n\t\ttime.Sleep(2 * time.Second)\n\t\tsynctest.Wait() // attendre que les goroutines du cache aient réagi\n\t\tif _, ok := c.Lire(\"cle\"); ok {\n\t\t\tt.Error(\"pas expirée après une minute\")\n\t\t}\n\t})\n}\n```\n\nLe principe : `synctest.Test` exécute la fonction dans une **bulle** :\n- les goroutines lancées dans la bulle en font partie ;\n- le temps (`time.Now`, `time.Sleep`, timers, tickers, `context.WithTimeout`) est **virtuel** : il démarre à minuit\n  UTC le 1er janvier 2000, et n'avance **que lorsque toutes** les goroutines de la bulle sont **durablement\n  bloquées** (sommeil, channel, `sync.WaitGroup`, `sync.Cond`) ; il saute alors directement au prochain événement ;\n- **`synctest.Wait()`** attend que toutes les autres goroutines de la bulle soient durablement bloquées : on vérifie\n  ensuite un état stable, sans `time.Sleep` de précaution ;\n- à la fin, la bulle attend que ses goroutines se terminent : une goroutine qui reste bloquée fait échouer le test\n  (détection de fuites).\n\nLes limites : une goroutine bloquée sur une **entrée-sortie réelle** (réseau, fichier) ou un mutex n'est pas\n« durablement bloquée » ; dans la bulle, on utilise des **faux en mémoire** (`net.Pipe`). Les channels créés hors de\nla bulle ne doivent pas y être utilisés.\n\n**En entretien** : « Une bulle avec une horloge virtuelle qui saute quand tout est bloqué ; synctest.Wait pour\nattendre un état stable ; des tests de délais instantanés et déterministes ; pas d'entrées-sorties réelles dans la\nbulle. »"
cards:
  - key: sert-testing-synctest
    format: course
    question: "À quoi sert le package `testing/synctest` ?"
    choices:
      - {text: "À tester du code concurrent et temporel avec une horloge virtuelle, vite et de façon déterministe", correct: true}
      - {text: "À synchroniser l'horloge des tests sur un serveur NTP, pour avoir des dates exactes en CI", correct: false}
      - {text: "À lancer chaque test dans sa propre goroutine, avec un délai maximal d'exécution", correct: false}
      - {text: "À détecter les courses de données entre goroutines, comme le fait l'option `-race`", correct: false}
    answer: "À tester du code concurrent et temporel avec une horloge virtuelle, rapidement et de façon déterministe (Go 1.25). Les courses de données restent l'affaire de `-race`."
  - key: testes-fonction-reessaie-appel-3-fois
    format: scenario
    question: "Comment testes-tu une fonction qui réessaie un appel 3 fois avec un délai d'une seconde ?"
    choices:
      - {text: "Dans une bulle synctest, avec un faux qui échoue deux fois : les attentes sont virtuelles et instantanées", correct: true}
      - {text: "Avec le vrai délai : le test attend trois secondes, le temps de laisser passer les tentatives", correct: false}
      - {text: "En appelant le vrai service, coupé à la main pendant le test, pour provoquer les échecs", correct: false}
      - {text: "En réduisant le délai à une milliseconde, avec un `time.Sleep` de précaution à la fin", correct: false}
    answer: |-
      Sans précaution, le test durerait 3 secondes et serait sensible à la charge de la machine. Deux approches. **testing/synctest** : j'exécute le test dans une bulle, le `time.After` du retry utilise l'horloge virtuelle, donc les trois attentes sont instantanées, et je vérifie le nombre d'appels et la durée virtuelle écoulée.
      Ou j'injecte le délai (et éventuellement une fonction d'attente) en paramètre, que je règle à zéro en test. Dans les deux cas, la dépendance appelée est un faux qui échoue deux fois puis réussit, et je teste aussi l'annulation par le contexte pendant une attente.
  - key: terme-synctest
    format: course
    question: "Dans les tests Go, que désigne « synctest » ?"
    choices:
      - {text: "Des tests de concurrence avec une horloge virtuelle", correct: true}
      - {text: "Des tests à entrées générées, guidés par la couverture", correct: false}
      - {text: "Des tests lancés dans un ordre aléatoire avec `-shuffle`", correct: false}
      - {text: "Des tests de handlers HTTP sans démarrer de serveur", correct: false}
    answer: "Des tests de concurrence avec une horloge virtuelle (Go 1.25). Les entrées générées, c'est le fuzzing ; les handlers sans serveur, `httptest`."
  - key: wait
    format: course
    question: "À quoi sert `synctest.Wait()` ?"
    choices:
      - {text: "À attendre que les autres goroutines de la bulle soient durablement bloquées", correct: true}
      - {text: "À attendre que toutes les goroutines de la bulle soient terminées", correct: false}
      - {text: "À avancer l'horloge virtuelle d'une durée passée en argument", correct: false}
      - {text: "À attendre la fin du test parent avant de lancer les sous-tests", correct: false}
    answer: "Il attend que toutes les autres goroutines de la bulle soient durablement bloquées : le test vérifie ensuite un état stable, au lieu d'ajouter des `time.Sleep` de précaution."
  - key: horloge
    format: course
    question: "Quand le temps virtuel avance-t-il dans une bulle synctest ?"
    choices:
      - {text: "Quand toutes les goroutines de la bulle sont durablement bloquées : il saute au prochain réveil", correct: true}
      - {text: "En continu, au même rythme que l'horloge réelle, mais compté à part pour la bulle", correct: false}
      - {text: "Seulement quand le test appelle `synctest.Wait()`, d'une seconde à chaque appel", correct: false}
      - {text: "À chaque appel de `time.Now()`, d'une milliseconde, pour garder un ordre strict", correct: false}
    answer: "Seulement quand toutes les goroutines de la bulle sont durablement bloquées ; il saute alors directement au prochain réveil (timer, `Sleep`, échéance de contexte)."
  - key: vf-instantane
    format: true-false
    question: Dans une bulle synctest, un time.Sleep(time.Hour) s'exécute presque instantanément.
    truth: true
    answer: Le temps est virtuel.
  - key: vf-reseau
    format: true-false
    question: Une goroutine qui attend une réponse d'un vrai serveur réseau est considérée comme durablement bloquée par synctest.
    truth: false
    answer: Les entrées-sorties réelles ne le sont pas ; on utilise des faux en mémoire comme net.Pipe.
  - key: vf-125
    format: true-false
    question: testing/synctest est stable depuis Go 1.25.
    truth: true
    answer: Il était expérimental en Go 1.24 (GOEXPERIMENT=synctest).
  - key: vf-fuite
    format: true-false
    question: Une goroutine de la bulle qui reste bloquée à la fin fait échouer le test.
    truth: true
    answer: synctest détecte ainsi les fuites de goroutines.
  - key: qcm-usages
    format: multiple-choice
    question: "Lequel de ces tests synctest ne rend-il pas simple ?"
    choices:
      - {text: "Un appel à une vraie API sur internet", correct: true}
      - {text: "Un cache qui expire après une heure", correct: false}
      - {text: "Une fonction qui réessaie avec un délai croissant", correct: false}
      - {text: "Un ticker qui rafraîchit toutes les 5 minutes", correct: false}
    answer: "Le réseau réel sort du modèle : une goroutine bloquée sur une vraie entrée-sortie n'est pas durablement bloquée, et le temps n'avance pas. Expirations, retries et tickers se testent en temps virtuel, instantanément."
  - key: qcm-bloque
    format: multiple-choice
    question: "Lesquels de ces blocages sont « durables » pour synctest ?"
    choices:
      - text: Un time.Sleep
        correct: true
      - text: Une réception sur un channel créé dans la bulle
        correct: true
      - text: Un wg.Wait() sur un WaitGroup de la bulle
        correct: true
      - text: Une attente sur un sync.Mutex
        correct: false
    answer: Un mutex n'est pas considéré comme durablement bloquant.
  - key: qcm-avantages
    format: multiple-choice
    question: "Qu'apporte synctest par rapport à des `time.Sleep` dans les tests ?"
    choices:
      - {text: "Des tests instantanés et déterministes, quelle que soit la charge de la machine", correct: true}
      - {text: "La possibilité d'appeler de vrais services pendant le test", correct: false}
      - {text: "Des tests qui n'ont plus besoin de lancer de goroutines", correct: false}
      - {text: "Des durées réelles mesurées avec plus de précision", correct: false}
    answer: "Le temps virtuel n'attend pas les vraies durées et supprime l'aléa : un test ne dépend plus de la vitesse de la machine."
  - key: qcm-api
    format: multiple-choice
    question: Comment démarre-t-on une bulle depuis Go 1.25 ?
    choices:
      - text: '`synctest.Test(t, func(t *testing.T) { ... })`'
        correct: true
      - text: '`synctest.Run(func() { ... })`, l''ancienne API expérimentale de Go 1.24'
        correct: false
      - text: '`t.Synctest()`'
        correct: false
      - text: '`go test -synctest`'
        correct: false
    answer: synctest.Run était l'API expérimentale, remplacée par Test.
  - key: scenario-retry
    format: scenario
    question: "Comment testes-tu une fonction qui réessaie un appel avec des délais de 1 s, 2 s puis 4 s ?"
    choices:
      - {text: "Dans `synctest.Test`, un faux qui échoue deux fois, et je vérifie les écarts de 1 s puis 2 s", correct: true}
      - {text: "Un test qui dure vraiment 7 secondes, avec une marge de tolérance sur chaque écart mesuré", correct: false}
      - {text: "Des délais mis à zéro en test, sans vérifier ni les écarts ni le nombre d'appels", correct: false}
      - {text: "Le vrai service, coupé puis rétabli à la main pendant que le test tourne", correct: false}
    answer: "Dans `synctest.Test`, un faux qui échoue deux fois puis réussit note `time.Now()` à chaque appel. Le temps est virtuel : le test est instantané, et l'on vérifie exactement les écarts (1 s, puis 2 s) et le nombre d'appels. Un second cas vérifie l'abandon après le nombre maximal de tentatives, ou à l'échéance du contexte."
  - key: scenario-flaky
    format: scenario
    question: "Un test qui utilise des `time.Sleep` échoue une fois sur cent en CI. Comment le stabilises-tu ?"
    choices:
      - {text: "Je le mets dans une bulle synctest : `Sleep` virtuels, et `synctest.Wait` à la place des attentes", correct: true}
      - {text: "J'allonge chaque `time.Sleep` pour laisser plus de marge aux goroutines sur une machine chargée", correct: false}
      - {text: "Je le relance automatiquement en CI, jusqu'à trois fois, avant de le déclarer en échec", correct: false}
      - {text: "Je le marque `t.Skip` en CI, et je ne le lance plus que sur les postes des développeurs", correct: false}
    answer: "Les `Sleep` supposent que les goroutines auront fini dans le délai, ce qui n'est pas garanti sur une machine chargée. Dans une bulle synctest, ils deviennent virtuels, et `synctest.Wait` attend vraiment que tout soit bloqué. Les vraies entrées-sorties sont d'abord remplacées par des faux en mémoire."
  - key: scenario-limites
    format: scenario
    question: "Quelles sont les limites de synctest ?"
    choices:
      - {text: "Les vraies entrées-sorties et les mutex ne bloquent pas durablement : il faut des faux en mémoire", correct: true}
      - {text: "Il n'accepte qu'un seul `time.Sleep` par test, sans timers ni contextes à échéance", correct: false}
      - {text: "Il ne sait pas créer de goroutines dans la bulle, seulement tester du code séquentiel", correct: false}
      - {text: "Il impose une horloge maison qui remplace le package `time`, à importer partout", correct: false}
    answer: "Les goroutines bloquées sur des entrées-sorties réelles (réseau, fichiers, appels système) ou sur un mutex ne sont pas durablement bloquées : le temps n'avance pas et `Wait` peut attendre. Il faut des faux en mémoire (`net.Pipe`, un faux dépôt), des channels et timers créés dans la bulle, et le package `time` standard plutôt qu'une horloge maison."
