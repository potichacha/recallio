notion: tests-table
lesson: "Le **test piloté par une table** (*table-driven test*) est le motif le plus courant en Go : une **liste de cas**, et\nune **boucle** qui exécute chacun dans un sous-test.\n\n```go\nfunc TestArrondir(t *testing.T) {\n\ttests := []struct {\n\t\tnom       string\n\t\tvaleur    float64\n\t\tdecimales int\n\t\tattendu   float64\n\t}{\n\t\t{\"entier\", 2, 0, 2},\n\t\t{\"vers le haut\", 2.346, 2, 2.35},\n\t\t{\"vers le bas\", 2.344, 2, 2.34},\n\t\t{\"négatif\", -1.5, 0, -2},\n\t}\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tif got := Arrondir(tt.valeur, tt.decimales); got != tt.attendu {\n\t\t\t\tt.Errorf(\"Arrondir(%v, %d) = %v, attendu %v\", tt.valeur, tt.decimales, got, tt.attendu)\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\nLes avantages :\n- **ajouter un cas** = ajouter une ligne ;\n- chaque cas a un **nom**, visible dans la sortie (`TestArrondir/négatif`) et lançable seul\n  (`go test -run 'TestArrondir/négatif'`) ;\n- un cas qui échoue n'arrête pas les autres ;\n- les cas limites sont visibles d'un coup d'œil : vide, zéro, négatif, maximum, Unicode, erreur.\n\nLes bonnes pratiques :\n- un champ **`nom`** explicite, plutôt qu'un numéro ;\n- un champ pour l'**erreur attendue** (`wantErr bool` ou `wantErr error` comparé avec `errors.Is`) ;\n- une table **par comportement** : si les cas demandent des préparations très différentes, plusieurs tests sont plus\n  clairs qu'une table avec des champs `if` ;\n- une **map** de cas (`map[string]struct{...}`) fait varier l'ordre d'exécution, ce qui révèle les dépendances\n  cachées entre cas.\n\nDepuis Go 1.22, la variable de boucle `tt` est propre à chaque tour : la copie `tt := tt` avant `t.Parallel()` n'est\nplus nécessaire.\n\n**En entretien** : « Une slice de cas nommés et une boucle avec t.Run ; ajouter un cas, c'est une ligne ; les cas\nlimites visibles ; un champ d'erreur attendue ; pas de table fourre-tout. »"
tour:
  - title: Les tests pilotés par une table
    text: |-
      Plutôt qu'un test par cas, on écrit une **table** : une slice de structs avec les entrées et le résultat attendu,
      puis une boucle qui vérifie chaque ligne. Ajouter un cas, c'est ajouter une ligne.

      Dans un vrai test, on nomme chaque ligne et on la lance avec `t.Run(c.nom, …)` : chaque cas devient un sous-test,
      qu'on relance seul avec `go test -run`. Ce programme fait la même boucle dans `main`.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"strings"
          )

          func Initiales(nom string) string {
          	var b strings.Builder
          	for _, mot := range strings.Fields(nom) {
          		b.WriteString(strings.ToUpper(mot[:1]))
          	}
          	return b.String()
          }

          func main() {
          	cas := []struct {
          		nom, entree, attendu string
          	}{
          		{"deux mots", "ada lovelace", "AL"},
          		{"un mot", "linus", "L"},
          		{"des espaces", "  grace   hopper ", "GH"},
          		{"vide", "", ""},
          	}
          	for _, c := range cas {
          		if got := Initiales(c.entree); got != c.attendu {
          			fmt.Printf("%s : ÉCHEC, %q au lieu de %q\n", c.nom, got, c.attendu)
          		} else {
          			fmt.Printf("%s : ok\n", c.nom)
          		}
          	}
          }
      output: |-
        deux mots : ok
        un mot : ok
        des espaces : ok
        vide : ok
cards:
  - key: test-table-driven
    format: course
    question: "Qu'est-ce qu'un test piloté par une table (table-driven) ?"
    choices:
      - {text: "Une slice de cas (entrées, résultats attendus) parcourue en boucle, avec un sous-test par cas", correct: true}
      - {text: "Un test qui lit ses cas dans une table de la base de données de test avant de s'exécuter", correct: false}
      - {text: "Un test généré par un outil à partir d'un tableau de la spécification fonctionnelle", correct: false}
      - {text: "Un test qui génère ses entrées au hasard, guidé par la couverture du code testé", correct: false}
    answer: "Une slice de cas (entrées, sorties attendues) parcourue dans une boucle, avec un sous-test par cas. Les entrées générées au hasard, c'est le fuzzing."
  - key: avantages
    format: course
    question: "Quels avantages a un test piloté par une table ?"
    choices:
      - {text: "Un cas = une ligne, chaque cas nommé et lançable seul, et un échec n'arrête pas les autres", correct: true}
      - {text: "Il s'exécute plus vite, car Go compile la table en une seule fonction optimisée", correct: false}
      - {text: "Il dispense des cas limites, puisque la boucle parcourt toutes les entrées possibles", correct: false}
      - {text: "Il dispense de messages d'échec, la ligne de la table suffisant à retrouver le cas", correct: false}
    answer: "Ajouter un cas ne demande qu'une ligne, chaque cas est nommé et lançable seul, un échec n'arrête pas les autres, et l'ensemble des cas limites se lit d'un coup d'œil."
  - key: erreur
    format: course
    question: "Comment testes-tu les cas d'erreur dans une table ?"
    choices:
      - {text: "Avec un champ `wantErr error`, comparé par `errors.Is(err, tt.wantErr)`", correct: true}
      - {text: "Avec un `recover` dans la boucle, qui attrape chaque erreur renvoyée", correct: false}
      - {text: "Avec une table séparée, puisqu'un cas d'erreur ne peut pas avoir de nom", correct: false}
      - {text: "Avec `err.Error() == tt.message`, la seule comparaison vraiment fiable", correct: false}
    answer: "Avec un champ d'erreur attendue, `wantErr error`, comparé avec `errors.Is(err, tt.wantErr)`, ou un simple `wantErr bool` ; les cas de succès vérifient en plus le résultat. Comparer le texte casse à la moindre reformulation du message."
  - key: limites
    format: course
    question: "Quand une table de tests devient-elle une mauvaise idée ?"
    choices:
      - {text: "Quand les cas demandent des préparations ou des vérifications très différentes", correct: true}
      - {text: "Dès qu'elle dépasse dix cas, au-delà desquels une table devient illisible", correct: false}
      - {text: "Quand les cas doivent tourner en parallèle, ce qu'une table ne permet pas", correct: false}
      - {text: "Quand les cas testent des erreurs, qu'une table ne sait pas représenter", correct: false}
    answer: "Quand les cas demandent des préparations ou des vérifications très différentes : la table se remplit de champs optionnels et de `if` dans la boucle, et plusieurs tests distincts sont plus lisibles."
  - key: vf-nom
    format: true-false
    question: Un sous-test d'une table peut être lancé seul avec `-run 'TestArrondir/négatif'`.
    truth: true
    answer: Le nom du sous-test suit la barre oblique.
  - key: vf-echec
    format: true-false
    question: Dans une table, un cas qui appelle t.Errorf empêche l'exécution des cas suivants.
    truth: false
    answer: Chaque cas est un sous-test, et Errorf ne s'arrête même pas.
  - key: vf-copie
    format: true-false
    question: Depuis Go 1.22, la copie `tt := tt` avant t.Parallel() est inutile.
    truth: true
    answer: Chaque tour de boucle a sa propre variable.
  - key: vf-map
    format: true-false
    question: Écrire les cas dans une map fait varier leur ordre d'exécution.
    truth: true
    answer: Ce qui révèle les cas qui dépendent les uns des autres.
  - key: qcm-champs
    format: multiple-choice
    question: "Lequel de ces champs est inutile dans une struct de cas ?"
    choices:
      - {text: "Un numéro de ligne écrit à la main", correct: true}
      - {text: "Un nom explicite pour le cas", correct: false}
      - {text: "Les entrées et le résultat attendu", correct: false}
      - {text: "L'erreur attendue, s'il y en a une", correct: false}
    answer: "Le nom suffit à retrouver le cas (`-run` et la sortie l'affichent) ; un numéro écrit à la main se désynchronise. Nom, entrées, résultat et erreur attendus font une bonne struct de cas."
  - key: qcm-cas
    format: multiple-choice
    question: "Lesquels de ces cas ajoutes-tu à la table d'une fonction qui découpe un nom complet en prénom et nom ?"
    choices:
      - text: Une chaîne vide
        correct: true
      - text: Un seul mot
        correct: true
      - text: Des noms composés et des caractères accentués
        correct: true
      - text: Seulement « Ada Lovelace »
        correct: false
    answer: Les cas limites trouvent les bugs.
  - key: qcm-run
    format: multiple-choice
    question: "Que fait `t.Run(tt.nom, func(t *testing.T) {...})` dans la boucle ?"
    choices:
      - {text: "Il crée un sous-test nommé pour le cas, lançable seul", correct: true}
      - {text: "Il exécute le cas dans un nouveau processus", correct: false}
      - {text: "Il ignore les échecs du cas, sans les rapporter", correct: false}
      - {text: "Il exécute tous les cas de la table en parallèle", correct: false}
    answer: "Chaque cas devient un sous-test nommé, avec son propre `t`, lançable seul avec `-run`. Il ne tourne en parallèle que s'il appelle `t.Parallel()`."
  - key: qcm-lecture
    format: multiple-choice
    question: "Une table contient 40 champs, presque tous vides selon les cas, et une boucle pleine de `if`. Que fais-tu ?"
    choices:
      - {text: "Je la découpe en plusieurs tests, un par comportement", correct: true}
      - {text: "J'ajoute des champs pour couvrir les nouveaux cas", correct: false}
      - {text: "Je retire les noms des cas pour gagner de la place", correct: false}
      - {text: "Je regroupe tout dans un seul cas qui teste tout", correct: false}
    answer: "Une table doit rester simple à lire : un test par comportement, et les préparations communes extraites dans des fonctions d'aide."
  - key: trous-run
    format: fill-in
    question: |-
      Complète :
      ```go
      for _, tt := range tests {
      	t.___(tt.nom, func(t *testing.T) {
      		// ...
      	})
      }
      ```
    blanks:
      - - Run
    answer: t.Run.
  - key: trous-struct
    format: fill-in
    question: |-
      Complète la déclaration de la table :
      ```go
      tests := []___ {
      	nom     string
      	entree  string
      	attendu int
      }{
      	{"vide", "", 0},
      }
      ```
    blanks:
      - - struct
    answer: Une slice de structs anonymes.
  - key: trous-errors-is
    format: fill-in
    question: |-
      Complète la vérification de l'erreur attendue :
      ```go
      if !errors.___(err, tt.wantErr) {
      	t.Errorf("err = %v, attendu %v", err, tt.wantErr)
      }
      ```
    blanks:
      - - Is
    answer: errors.Is.
  - key: trous-range
    format: fill-in
    question: |-
      Complète la boucle :
      ```go
      for _, tt := ___ tests {
      ```
    blanks:
      - - range
    answer: range.
  - key: bug-pas-de-run
    format: bug-fix
    question: |-
      Quand un cas échoue, impossible de savoir lequel. Quelle correction est la bonne ?
      ```go
      for _, tt := range tests {
      	if got := Valider(tt.entree); got != tt.attendu {
      		t.Errorf("faux")
      	}
      }
      ```
    choices:
      - {text: "Un `t.Run(tt.nom, ...)` par cas, et un message qui donne l'entrée", correct: true}
      - {text: "Remplacer `t.Errorf` par `t.Fatalf`, pour s'arrêter sur le cas", correct: false}
      - {text: "Ajouter `t.Parallel()` dans la boucle, pour isoler les cas", correct: false}
      - {text: "Lancer `go test -v`, qui affiche le cas en échec", correct: false}
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tif got := Valider(tt.entree); got != tt.attendu {\n\t\t\tt.Errorf(\"Valider(%q) = %v, attendu %v\", tt.entree, got, tt.attendu)\n\t\t}\n\t})\n}\n```\nChaque cas devient un sous-test nommé, avec un message qui donne l'entrée."
  - key: bug-fatal
    format: bug-fix
    question: |-
      Le premier cas en échec masque tous les autres. Quelle correction est la bonne ?
      ```go
      for _, tt := range tests {
      	if got := Convertir(tt.entree); got != tt.attendu {
      		t.Fatalf("Convertir(%q) = %q, attendu %q", tt.entree, got, tt.attendu)
      	}
      }
      ```
    choices:
      - {text: "Un sous-test par cas avec `t.Run`, et `t.Errorf` à la place de `t.Fatalf`", correct: true}
      - {text: "Garder `t.Fatalf`, mais trier les cas du plus simple au plus difficile", correct: false}
      - {text: "Remplacer `t.Fatalf` par `panic`, que `go test` rapporte pour chaque cas", correct: false}
      - {text: "Passer `-failfast=false` à `go test`, pour continuer après l'échec", correct: false}
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tif got := Convertir(tt.entree); got != tt.attendu {\n\t\t\tt.Errorf(\"Convertir(%q) = %q, attendu %q\", tt.entree, got, tt.attendu)\n\t\t}\n\t})\n}\n```\nFatalf arrêtait tout le test au premier échec ; avec des sous-tests et Errorf, tous les cas sont exécutés."
  - key: bug-erreur
    format: bug-fix
    question: |-
      Le cas « montant négatif » passe alors que la fonction renvoie la mauvaise erreur. Quelle correction est la bonne ?
      ```go
      {nom: "montant négatif", montant: -5, wantErr: true},
      // ...
      if (err != nil) != tt.wantErr {
      	t.Errorf("err = %v", err)
      }
      ```
    choices:
      - {text: "Un `wantErr error` comparé avec `errors.Is(err, tt.wantErr)`", correct: true}
      - {text: "Garder le booléen, et afficher `err` avec `%#v` dans le message", correct: false}
      - {text: "Remplacer `!=` par `==` dans la condition de l'échec", correct: false}
      - {text: "Ajouter `t.Parallel()`, pour isoler le cas d'erreur des autres", correct: false}
    answer: "```go\n{nom: \"montant négatif\", montant: -5, wantErr: ErrMontantInvalide},\n// ...\nif !errors.Is(err, tt.wantErr) {\n\tt.Errorf(\"Payer(%d) err = %v, attendu %v\", tt.montant, err, tt.wantErr)\n}\n```\nUn booléen vérifiait seulement qu'il y avait une erreur ; comparer avec errors.Is vérifie que c'est la bonne."
  - key: bug-etat-partage
    format: bug-fix
    question: |-
      Les cas réussissent seuls mais échouent ensemble. Quelle correction est la bonne ?
      ```go
      panier := NouveauPanier()
      for _, tt := range tests {
      	t.Run(tt.nom, func(t *testing.T) {
      		panier.Ajouter(tt.article)
      		if got := panier.Total(); got != tt.total {
      			t.Errorf("Total() = %d, attendu %d", got, tt.total)
      		}
      	})
      }
      ```
    choices:
      - {text: "Créer le panier dans chaque sous-test, pour que chaque cas soit indépendant", correct: true}
      - {text: "Ajouter `t.Parallel()` dans chaque sous-test, pour les isoler", correct: false}
      - {text: "Trier les cas pour que leurs totaux s'enchaînent dans l'ordre", correct: false}
      - {text: "Lancer les tests avec `-shuffle=off`, pour fixer leur ordre", correct: false}
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tpanier := NouveauPanier()\n\t\tpanier.Ajouter(tt.article)\n\t\tif got := panier.Total(); got != tt.total {\n\t\t\tt.Errorf(\"Total() = %d, attendu %d\", got, tt.total)\n\t\t}\n\t})\n}\n```\nLe panier était partagé entre les cas ; chaque cas crée le sien et devient indépendant."
  - key: scenario-conception
    format: scenario
    question: "Comment conçois-tu la table de tests d'une fonction de validation d'adresse e-mail ?"
    choices:
      - {text: "Des cas `nom`, `entree`, `valide` : nominaux puis limites (vide, sans @, deux @, espaces, accents)", correct: true}
      - {text: "Un seul cas nominal, `ada@exemple.fr`, et une table qui grandira au fil des bugs trouvés", correct: false}
      - {text: "Toutes les adresses de la base de production copiées dans la table, sans nom pour les cas", correct: false}
      - {text: "Des cas sans nom, numérotés à la main, et un `t.Fatalf` au premier cas en échec", correct: false}
    answer: "Une slice de cas avec `nom`, `entree` et `valide bool` (ou l'erreur attendue) : les cas nominaux, puis les limites (chaîne vide, sans @, deux @, domaine sans point, espaces, majuscules, accents, très longue adresse). Chaque bug trouvé ajoute une ligne ; le message d'échec affiche l'entrée avec `%q` pour voir les espaces."
  - key: scenario-revue
    format: scenario
    question: "En revue, quels défauts cherches-tu dans des tests pilotés par une table ?"
    choices:
      - {text: "Cas mal nommés, état partagé, `t.Fatal` superflu, erreur vérifiée par un booléen, cas limites absents", correct: true}
      - {text: "Des tables trop longues : au-delà de dix cas, une table doit être découpée en plusieurs tests", correct: false}
      - {text: "L'absence d'un mock généré pour chaque dépendance appelée par la fonction testée", correct: false}
      - {text: "L'usage de `t.Run`, qui ralentit l'exécution sans rien apporter à la lecture des échecs", correct: false}
    answer: "Des cas sans nom ou mal nommés, un état partagé entre les cas, `t.Fatal` là où `Errorf` suffit, une erreur attendue vérifiée par un simple booléen, des messages sans l'entrée, une table qui mélange plusieurs comportements avec des `if`, et l'absence des cas limites (vide, zéro, erreur)."
  - key: scenario-donnees
    format: scenario
    question: "Ta table compte 200 cas issus de la production. Comment l'organises-tu ?"
    choices:
      - {text: "Les cas dans un fichier de `testdata/` (JSON ou txtar), lu au début du test et parcouru avec `t.Run`", correct: true}
      - {text: "Les 200 cas écrits en dur dans le fichier de test, dans une seule slice de structs", correct: false}
      - {text: "Un test par cas, soit 200 fonctions `TestXxx` générées par un script", correct: false}
      - {text: "Les cas relus à chaque exécution depuis la base de production, pour rester à jour", correct: false}
    answer: "Les cas passent dans un fichier de `testdata/` (JSON ou txtar), lu au début du test et parcouru avec `t.Run` : le code reste court, et les cas s'ajoutent sans toucher au Go. Pour des sorties volumineuses, des fichiers golden avec un drapeau `-update`."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi les tests pilotés par une table sont si répandus en Go. Que réponds-tu ?"
    choices:
      - {text: "Sans framework ni annotations, une slice de structs et une boucle couvrent beaucoup de cas sans répétition", correct: true}
      - {text: "Le compilateur optimise les tables de tests, qui tournent bien plus vite que des tests séparés", correct: false}
      - {text: "`go test` exige une table pour lancer plusieurs cas, faute de quoi il n'en exécute qu'un seul", correct: false}
      - {text: "Elles dispensent des cas limites, puisque la boucle parcourt toutes les entrées possibles", correct: false}
    answer: "Le langage n'a ni framework de tests riche ni annotations : une slice de structs et une boucle couvrent beaucoup de cas sans répéter le code. Avec `t.Run`, chaque cas devient un sous-test nommé, lançable seul et parallélisable ; la bibliothèque standard elle-même est testée ainsi."
