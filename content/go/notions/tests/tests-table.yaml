notion: tests-table
lesson: "Le **test piloté par une table** (*table-driven test*) est le motif le plus courant en Go : une **liste de cas**, et\nune **boucle** qui exécute chacun dans un sous-test.\n\n```go\nfunc TestArrondir(t *testing.T) {\n\ttests := []struct {\n\t\tnom       string\n\t\tvaleur    float64\n\t\tdecimales int\n\t\tattendu   float64\n\t}{\n\t\t{\"entier\", 2, 0, 2},\n\t\t{\"vers le haut\", 2.346, 2, 2.35},\n\t\t{\"vers le bas\", 2.344, 2, 2.34},\n\t\t{\"négatif\", -1.5, 0, -2},\n\t}\n\tfor _, tt := range tests {\n\t\tt.Run(tt.nom, func(t *testing.T) {\n\t\t\tif got := Arrondir(tt.valeur, tt.decimales); got != tt.attendu {\n\t\t\t\tt.Errorf(\"Arrondir(%v, %d) = %v, attendu %v\", tt.valeur, tt.decimales, got, tt.attendu)\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\nLes avantages :\n- **ajouter un cas** = ajouter une ligne ;\n- chaque cas a un **nom**, visible dans la sortie (`TestArrondir/négatif`) et lançable seul\n  (`go test -run 'TestArrondir/négatif'`) ;\n- un cas qui échoue n'arrête pas les autres ;\n- les cas limites sont visibles d'un coup d'œil : vide, zéro, négatif, maximum, Unicode, erreur.\n\nLes bonnes pratiques :\n- un champ **`nom`** explicite, plutôt qu'un numéro ;\n- un champ pour l'**erreur attendue** (`wantErr bool` ou `wantErr error` comparé avec `errors.Is`) ;\n- une table **par comportement** : si les cas demandent des préparations très différentes, plusieurs tests sont plus\n  clairs qu'une table avec des champs `if` ;\n- une **map** de cas (`map[string]struct{...}`) fait varier l'ordre d'exécution, ce qui révèle les dépendances\n  cachées entre cas.\n\nDepuis Go 1.22, la variable de boucle `tt` est propre à chaque tour : la copie `tt := tt` avant `t.Parallel()` n'est\nplus nécessaire.\n\n**En entretien** : « Une slice de cas nommés et une boucle avec t.Run ; ajouter un cas, c'est une ligne ; les cas\nlimites visibles ; un champ d'erreur attendue ; pas de table fourre-tout. »"
cards:
  - key: test-table-driven
    format: course
    question: C'est quoi un test table-driven ?
    answer: Un slice de cas (entrées, sorties attendues) parcouru dans une boucle, avec un sous-test par cas.
  - key: avantages
    format: course
    question: Quels avantages a un test piloté par une table ?
    answer: Ajouter un cas ne demande qu'une ligne, chaque cas est nommé et lançable seul, un échec n'arrête pas les autres, et l'ensemble des cas limites est lisible d'un coup d'œil.
  - key: erreur
    format: course
    question: Comment tester les cas d'erreur dans une table ?
    answer: Avec un champ d'erreur attendue, par exemple `wantErr error`, comparé avec `errors.Is(err, tt.wantErr)`, ou un simple `wantErr bool` ; les cas de succès vérifient en plus le résultat.
  - key: limites
    format: course
    question: Quand une table de tests devient-elle une mauvaise idée ?
    answer: 'Quand les cas demandent des préparations ou des vérifications très différentes : la table se remplit de champs optionnels et de if dans la boucle ; plusieurs tests distincts sont alors plus lisibles.'
  - key: vf-nom
    format: true-false
    question: Un sous-test d'une table peut être lancé seul avec `-run 'TestArrondir/négatif'`.
    truth: true
    answer: Le nom du sous-test suit la barre oblique.
  - key: vf-echec
    format: true-false
    question: Dans une table, un cas qui appelle t.Errorf empêche l'exécution des cas suivants.
    truth: false
    answer: Chaque cas est un sous-test, et Errorf ne s'arrête même pas.
  - key: vf-copie
    format: true-false
    question: Depuis Go 1.22, la copie `tt := tt` avant t.Parallel() est inutile.
    truth: true
    answer: Chaque tour de boucle a sa propre variable.
  - key: vf-map
    format: true-false
    question: Écrire les cas dans une map fait varier leur ordre d'exécution.
    truth: true
    answer: Ce qui révèle les cas qui dépendent les uns des autres.
  - key: qcm-champs
    format: multiple-choice
    question: Quels champs sont utiles dans une struct de cas ?
    choices:
      - text: Un nom explicite
        correct: true
      - text: Les entrées et le résultat attendu
        correct: true
      - text: L'erreur attendue
        correct: true
      - text: Un numéro de ligne écrit à la main
        correct: false
    answer: Le nom suffit à retrouver le cas.
  - key: qcm-cas
    format: multiple-choice
    question: Quels cas ajouter à la table d'une fonction qui découpe un nom complet en prénom et nom ?
    choices:
      - text: Une chaîne vide
        correct: true
      - text: Un seul mot
        correct: true
      - text: Des noms composés et des caractères accentués
        correct: true
      - text: Seulement « Ada Lovelace »
        correct: false
    answer: Les cas limites trouvent les bugs.
  - key: qcm-run
    format: multiple-choice
    question: Que fait `t.Run(tt.nom, func(t *testing.T) {...})` dans la boucle ?
    choices:
      - text: Il crée un sous-test nommé pour le cas
        correct: true
      - text: Il permet de lancer ce cas seul
        correct: true
      - text: Il exécute le cas dans un nouveau processus
        correct: false
      - text: Il ignore les échecs
        correct: false
    answer: Le sous-test a son propre t.
  - key: qcm-lecture
    format: multiple-choice
    question: Une table contient 40 champs dont la plupart sont vides selon les cas, et une boucle pleine de if. Que faire ?
    choices:
      - text: La découper en plusieurs tests, un par comportement
        correct: true
      - text: Extraire les préparations communes dans des fonctions d'aide
        correct: true
      - text: Ajouter des champs pour couvrir les nouveaux cas
        correct: false
      - text: Supprimer les noms des cas pour gagner de la place
        correct: false
    answer: Une table doit rester simple à lire.
  - key: trous-run
    format: fill-in
    question: "Complétez :\n```go\nfor _, tt := range tests {\n\tt.___(tt.nom, func(t *testing.T) {\n\t\t// ...\n\t})\n}\n```"
    blanks:
      - - Run
    answer: t.Run.
  - key: trous-struct
    format: fill-in
    question: "Complétez la déclaration de la table :\n```go\ntests := []___ {\n\tnom     string\n\tentree  string\n\tattendu int\n}{\n\t{\"vide\", \"\", 0},\n}\n```"
    blanks:
      - - struct
    answer: Une slice de structs anonymes.
  - key: trous-errors-is
    format: fill-in
    question: "Complétez la vérification de l'erreur attendue :\n```go\nif !errors.___(err, tt.wantErr) {\n\tt.Errorf(\"err = %v, attendu %v\", err, tt.wantErr)\n}\n```"
    blanks:
      - - Is
    answer: errors.Is.
  - key: trous-range
    format: fill-in
    question: |-
      Complétez la boucle :
      ```go
      for _, tt := ___ tests {
      ```
    blanks:
      - - range
    answer: range.
  - key: bug-pas-de-run
    format: bug-fix
    question: "Quand un cas échoue, impossible de savoir lequel :\n```go\nfor _, tt := range tests {\n\tif got := Valider(tt.entree); got != tt.attendu {\n\t\tt.Errorf(\"faux\")\n\t}\n}\n```"
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tif got := Valider(tt.entree); got != tt.attendu {\n\t\t\tt.Errorf(\"Valider(%q) = %v, attendu %v\", tt.entree, got, tt.attendu)\n\t\t}\n\t})\n}\n```\nChaque cas devient un sous-test nommé, avec un message qui donne l'entrée."
  - key: bug-fatal
    format: bug-fix
    question: "Le premier cas en échec masque tous les autres :\n```go\nfor _, tt := range tests {\n\tif got := Convertir(tt.entree); got != tt.attendu {\n\t\tt.Fatalf(\"Convertir(%q) = %q, attendu %q\", tt.entree, got, tt.attendu)\n\t}\n}\n```"
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tif got := Convertir(tt.entree); got != tt.attendu {\n\t\t\tt.Errorf(\"Convertir(%q) = %q, attendu %q\", tt.entree, got, tt.attendu)\n\t\t}\n\t})\n}\n```\nFatalf arrêtait tout le test au premier échec ; avec des sous-tests et Errorf, tous les cas sont exécutés."
  - key: bug-erreur
    format: bug-fix
    question: "Le cas « montant négatif » passe alors que la fonction renvoie la mauvaise erreur :\n```go\n{nom: \"montant négatif\", montant: -5, wantErr: true},\n// ...\nif (err != nil) != tt.wantErr {\n\tt.Errorf(\"err = %v\", err)\n}\n```"
    answer: "```go\n{nom: \"montant négatif\", montant: -5, wantErr: ErrMontantInvalide},\n// ...\nif !errors.Is(err, tt.wantErr) {\n\tt.Errorf(\"Payer(%d) err = %v, attendu %v\", tt.montant, err, tt.wantErr)\n}\n```\nUn booléen vérifiait seulement qu'il y avait une erreur ; comparer avec errors.Is vérifie que c'est la bonne."
  - key: bug-etat-partage
    format: bug-fix
    question: "Les cas réussissent seuls mais échouent ensemble :\n```go\npanier := NouveauPanier()\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tpanier.Ajouter(tt.article)\n\t\tif got := panier.Total(); got != tt.total {\n\t\t\tt.Errorf(\"Total() = %d, attendu %d\", got, tt.total)\n\t\t}\n\t})\n}\n```"
    answer: "```go\nfor _, tt := range tests {\n\tt.Run(tt.nom, func(t *testing.T) {\n\t\tpanier := NouveauPanier()\n\t\tpanier.Ajouter(tt.article)\n\t\tif got := panier.Total(); got != tt.total {\n\t\t\tt.Errorf(\"Total() = %d, attendu %d\", got, tt.total)\n\t\t}\n\t})\n}\n```\nLe panier était partagé entre les cas ; chaque cas crée le sien et devient indépendant."
  - key: scenario-conception
    format: scenario
    question: Comment conçois-tu la table de tests d'une fonction de validation d'adresse e-mail ?
    answer: |-
      Une slice de cas avec `nom`, `entree` et `valide bool` (ou l'erreur attendue). Je commence par les cas nominaux,
      puis les limites : chaîne vide, sans @, deux @, domaine sans point, espaces, majuscules, caractères accentués, très
      longue adresse. Chaque bug trouvé ensuite ajoute une ligne. Le message d'échec affiche l'entrée avec %q pour voir
      les espaces.
  - key: scenario-revue
    format: scenario
    question: En revue, quels défauts cherches-tu dans des tests pilotés par une table ?
    answer: |-
      Des cas sans nom ou mal nommés, un état partagé entre les cas, t.Fatal là où Errorf suffit, une erreur attendue
      vérifiée par un simple booléen, des messages sans l'entrée, une table qui mélange plusieurs comportements avec des
      if dans la boucle, et l'absence des cas limites (vide, zéro, erreur).
  - key: scenario-donnees
    format: scenario
    question: Ta table compte 200 cas issus de la production. Comment l'organises-tu ?
    answer: |-
      Je déplace les cas dans un fichier de `testdata/` (JSON ou un format texte simple, comme txtar), lu au début du test
      et parcouru avec t.Run. Le code du test reste court, les cas se relisent et s'ajoutent sans toucher au Go. Pour des
      sorties volumineuses, des fichiers golden comparés au résultat, avec un drapeau `-update` pour les régénérer.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi les tests pilotés par une table sont si répandus en Go.
    answer: |-
      Le langage n'a pas de framework de tests riche ni d'annotations : une slice de structs et une boucle sont le moyen le
      plus simple de couvrir beaucoup de cas sans répéter le code. Avec t.Run, chaque cas devient un sous-test nommé,
      lançable seul, et parallélisable. La bibliothèque standard elle-même est testée ainsi.
