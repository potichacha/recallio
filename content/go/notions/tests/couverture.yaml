notion: couverture
cards:
  - key: mesurer-couverture
    format: course
    question: Comment mesurer la couverture ?
    answer: -cover ou -coverprofile puis go tool cover -html.
  - key: couverture-85-mais-regressions-passent-quand
    format: scenario
    question: Ta couverture est de 85 % mais des régressions passent quand même. Que fais-tu ?
    answer: |-
      La couverture mesure ce qui est exécuté, pas ce qui est vérifié. Je regarderais d'abord les régressions échappées : sont-elles dans l'intégration (requêtes SQL, sérialisation), la concurrence, ou des cas limites ? Chaque catégorie appelle un type de test différent : tests d'intégration avec testcontainers pour le SQL, `-race` et synctest pour la concurrence, **fuzzing** pour les entrées malformées, et des tests table-driven enrichis des cas limites (vide, nil, bornes, unicode).
      Je pourrais aussi lancer un outil de test de mutation sur les packages critiques pour repérer les assertions manquantes. Et chaque bug corrigé reçoit d'abord un test qui le reproduit.
