notion: couverture
lesson: |-
  La **couverture** mesure quelles instructions du code ont été exécutées par les tests :

  ```
  go test -cover ./...                         # un pourcentage par package
  go test -coverprofile=couverture.out ./...   # le détail
  go tool cover -html=couverture.out           # le code coloré : vert exécuté, rouge jamais
  go tool cover -func=couverture.out           # un pourcentage par fonction
  ```

  Les options utiles :
  - **`-coverpkg=./...`** compte aussi le code d'autres packages exécuté par les tests (utile pour des tests
    d'intégration placés à part) ;
  - **`-covermode`** : `set` (exécuté ou non, le défaut), `count` (combien de fois), `atomic` (comme count, sûr entre
    goroutines ; le défaut avec `-race`) ;
  - depuis Go 1.20, **`go build -cover`** produit un binaire instrumenté : en le lançant avec `GOCOVERDIR=dossier`, on
    mesure la couverture de tests de bout en bout ou d'intégration, puis `go tool covdata` fusionne les résultats.

  Ce que la couverture **ne dit pas** : qu'un comportement est **vérifié**. Une ligne exécutée par un test qui n'affirme
  rien est « couverte ». Une couverture élevée peut donc cacher des tests faibles, et une couverture de 100 % n'est pas
  un objectif en soi.

  Le bon usage :
  - lire le **rapport HTML** pour trouver les **branches oubliées** (gestion d'erreur, cas limites) ;
  - suivre la **tendance** en CI (une baisse brutale signale du code ajouté sans test), sans seuil rigide qui pousse à
    écrire des tests inutiles ;
  - viser les zones à risque (logique métier, calculs, parseurs) plutôt que le code de câblage.

  **En entretien** : « -cover, -coverprofile, go tool cover -html pour voir les branches non testées ; -coverpkg et
  build -cover pour l'intégration ; la couverture dit ce qui est exécuté, pas ce qui est vérifié : un indicateur, pas
  un objectif. »
cards:
  - key: mesurer-couverture
    format: course
    question: "Comment mesures-tu la couverture des tests en Go ?"
    choices:
      - {text: "Avec `go test -cover` ou `-coverprofile`, puis `go tool cover -html`", correct: true}
      - {text: "Avec `go vet -cover`, qui compte les lignes appelées par les tests", correct: false}
      - {text: "Avec un outil externe seulement : `go test` ne mesure rien de tel", correct: false}
      - {text: "Avec `go build -race`, qui trace les lignes exécutées au lancement", correct: false}
    answer: "`go test -cover` donne un pourcentage, `-coverprofile` écrit un profil que `go tool cover -html` affiche. `go vet` ne mesure pas la couverture."
  - key: couverture-85-mais-regressions-passent-quand
    format: scenario
    question: "Ta couverture est de 85 % mais des régressions passent quand même. Que fais-tu ?"
    choices:
      - {text: "Classer les régressions échappées et ajouter le test qui manque : intégration, `-race`, fuzzing, cas limites", correct: true}
      - {text: "Monter le seuil de couverture à 100 %, pour qu'aucune ligne n'échappe plus jamais aux tests", correct: false}
      - {text: "Ajouter des tests sur les getters et le code trivial, pour faire monter la couverture encore", correct: false}
      - {text: "Remplacer les tests automatiques par une recette manuelle avant chaque mise en production", correct: false}
    answer: "La couverture mesure ce qui est exécuté, pas ce qui est vérifié. Selon où les régressions échappent : tests d'intégration (Testcontainers) pour le SQL, `-race` et synctest pour la concurrence, fuzzing pour les entrées malformées, cas limites dans les tests de table ; des tests de mutation sur le code critique, et un test par bug corrigé."
  - key: html
    format: course
    question: "Comment vois-tu les lignes non couvertes par les tests ?"
    choices:
      - {text: "Avec `go test -coverprofile=c.out ./...` puis `go tool cover -html=c.out`", correct: true}
      - {text: "Avec `go test -cover ./...`, qui liste chaque ligne jamais exécutée", correct: false}
      - {text: "Avec `go tool cover -func=c.out`, qui colore le code source ligne par ligne", correct: false}
      - {text: "Avec `go test -v ./...`, qui affiche les lignes jamais exécutées", correct: false}
    answer: "`go tool cover -html` affiche le code coloré : vert pour exécuté, rouge pour jamais exécuté. `-func` donne un pourcentage par fonction, `-cover` un total par package."
  - key: coverpkg
    format: course
    question: "À quoi sert l'option `-coverpkg` de `go test` ?"
    choices:
      - {text: "À compter la couverture de packages exécutés par les tests d'un autre package", correct: true}
      - {text: "À ne mesurer que le package testé, sans compter ses dépendances", correct: false}
      - {text: "À fusionner les profils de couverture de plusieurs exécutions", correct: false}
      - {text: "À exclure de la mesure les packages générés et les fichiers de test", correct: false}
    answer: "À compter la couverture des packages indiqués (par exemple `./...`) même quand ils sont exécutés par les tests d'un autre package, comme des tests d'intégration placés à part. Par défaut, seul le package testé est compté."
  - key: limite
    format: course
    question: "Pourquoi une couverture de 100 % ne garantit-elle pas l'absence de bugs ?"
    choices:
      - {text: "Elle dit quelles lignes ont été exécutées, pas si leur résultat a été vérifié", correct: true}
      - {text: "Elle ne compte que les fonctions exportées, pas le code interne du package", correct: false}
      - {text: "Elle ignore les branches `else`, que Go ne compte jamais dans la mesure", correct: false}
      - {text: "Elle n'est mesurée que sur un échantillon des tests, choisi au hasard", correct: false}
    answer: "Elle dit quelles lignes ont été exécutées, pas si leur résultat a été vérifié : un test sans assertion couvre du code, et des cas limites (valeurs, combinaisons) restent non testés."
  - key: vf-assertions
    format: true-false
    question: Une ligne couverte est forcément vérifiée par une assertion.
    truth: false
    answer: Elle a seulement été exécutée.
  - key: vf-build
    format: true-false
    question: Depuis Go 1.20, on peut mesurer la couverture d'un binaire lancé hors de go test.
    truth: true
    answer: Avec go build -cover et la variable GOCOVERDIR.
  - key: vf-atomic
    format: true-false
    question: Avec -race, le mode de couverture par défaut est atomic.
    truth: true
    answer: Le compteur doit être sûr entre goroutines.
  - key: vf-objectif
    format: true-false
    question: Un seuil de couverture obligatoire de 100 % améliore toujours la qualité des tests.
    truth: false
    answer: Il pousse à écrire des tests sans valeur pour du code trivial.
  - key: qcm-commandes
    format: multiple-choice
    question: "Quelle commande affiche la couverture fonction par fonction, à partir d'un profil ?"
    choices:
      - {text: "`go tool cover -func=c.out`", correct: true}
      - {text: "`go tool cover -html=c.out`", correct: false}
      - {text: "`go test -cover ./...`", correct: false}
      - {text: "`go vet -cover`", correct: false}
    answer: "`-func` liste chaque fonction et son pourcentage. `-html` colore le code, `go test -cover` donne un total par package, et `go vet` ne mesure pas la couverture."
  - key: qcm-usage
    format: multiple-choice
    question: "Lesquelles de ces façons d'utiliser la couverture sont à bon escient ?"
    choices:
      - text: Chercher les branches d'erreur jamais testées dans le rapport HTML
        correct: true
      - text: Suivre sa tendance en CI
        correct: true
      - text: Viser en priorité la logique métier
        correct: true
      - text: Écrire des tests sans assertion pour atteindre le seuil
        correct: false
    answer: C'est un indicateur pour guider l'effort.
  - key: qcm-modes
    format: multiple-choice
    question: "Que mesure le mode de couverture `atomic` ?"
    choices:
      - {text: "Combien de fois chaque instruction s'exécute, de façon sûre entre goroutines", correct: true}
      - {text: "Si chaque instruction a été exécutée au moins une fois, sans compter", correct: false}
      - {text: "Combien de fois chaque instruction s'exécute, sans synchronisation", correct: false}
      - {text: "Si chaque branche de chaque `if` a été prise, dans les deux sens", correct: false}
    answer: "`atomic` compte comme `count`, avec des opérations atomiques : c'est le mode par défaut avec `-race`. `set` dit seulement si l'instruction a tourné ; Go n'a pas de mode par branche, sa couverture est par instruction."
  - key: qcm-integration
    format: multiple-choice
    question: "Comment mesures-tu la couverture des tests de bout en bout d'un service ?"
    choices:
      - {text: "Binaire compilé avec `go build -cover`, lancé avec `GOCOVERDIR`, puis `go tool covdata`", correct: true}
      - {text: "C'est impossible : seule la commande `go test` sait mesurer la couverture", correct: false}
      - {text: "`go test -run E2E ./...` sans option, qui la mesure pour tous les packages", correct: false}
      - {text: "`go run -race` sur le service, qui trace les lignes exécutées par les requêtes", correct: false}
    answer: "Depuis Go 1.20, `go build -cover` produit un binaire instrumenté ; lancé avec `GOCOVERDIR`, il écrit ses données, que `go tool covdata` fusionne et convertit en profil."
  - key: scenario-seuil
    format: scenario
    question: "Ton équipe veut imposer 90 % de couverture en CI. Que proposes-tu ?"
    choices:
      - {text: "Suivre la couverture par package et sa tendance, alerter sur une baisse, lire le rapport en revue", correct: true}
      - {text: "Imposer 90 % sur chaque package, et refuser toute PR qui passe en dessous, sans exception", correct: false}
      - {text: "Imposer 100 % : un seuil plus haut évite tout débat sur ce qui mérite d'être testé", correct: false}
      - {text: "Ne plus mesurer la couverture, puisqu'elle ne dit rien de la qualité des tests", correct: false}
    answer: "Un seuil rigide pousse à tester le code trivial et à écrire des tests sans assertion. Mieux vaut suivre la couverture par package et sa tendance, alerter sur une baisse dans une PR, et regarder le rapport HTML en revue ; des tests de mutation sur la logique critique mesurent mieux la qualité des tests."
  - key: scenario-rapport
    format: scenario
    question: "Le rapport de couverture montre en rouge tous les `if err != nil` d'un dépôt. Que fais-tu ?"
    choices:
      - {text: "J'ajoute des tests qui provoquent ces erreurs : faux qui échoue, base arrêtée, serveur qui répond 500", correct: true}
      - {text: "Je les exclus du rapport : les chemins d'erreur ne se produisent presque jamais en production", correct: false}
      - {text: "Je remplace ces `if err != nil` par des `panic`, que le rapport ne compte plus comme du code", correct: false}
      - {text: "J'ajoute des tests sans assertion qui passent par ces branches, pour les faire passer au vert", correct: false}
    answer: "Ce sont les chemins d'erreur, souvent ceux qui cassent en production. Des tests les provoquent : un faux qui renvoie une erreur pour les services, une base arrêtée ou une contrainte violée pour le dépôt, un serveur de test qui répond 500 pour un client ; on vérifie que l'erreur est bien enveloppée et traduite."
  - key: scenario-mutation
    format: scenario
    question: "Comment vérifies-tu que les tests détectent vraiment les bugs, au-delà de la couverture ?"
    choices:
      - {text: "Par des tests de mutation : l'outil modifie le code, et une mutation qui survit montre un manque", correct: true}
      - {text: "En montant la couverture à 100 %, ce qui garantit que chaque comportement est vérifié", correct: false}
      - {text: "En lançant les tests avec `-count=10`, pour qu'un bug finisse toujours par se montrer", correct: false}
      - {text: "En comptant les assertions, avec un minimum exigé dans chaque fichier de test", correct: false}
    answer: "Un outil de mutation (go-mutesting, gremlins) inverse une condition ou change un `+` en `-`, puis relance les tests : une mutation qui survit montre un comportement non vérifié. En revue, casser volontairement le code dit la même chose ; et chaque bug corrigé reçoit un test qui le reproduit."
