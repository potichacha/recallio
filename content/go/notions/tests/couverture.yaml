notion: couverture
lesson: |-
  La **couverture** mesure quelles instructions du code ont été exécutées par les tests :

  ```
  go test -cover ./...                         # un pourcentage par package
  go test -coverprofile=couverture.out ./...   # le détail
  go tool cover -html=couverture.out           # le code coloré : vert exécuté, rouge jamais
  go tool cover -func=couverture.out           # un pourcentage par fonction
  ```

  Les options utiles :
  - **`-coverpkg=./...`** compte aussi le code d'autres packages exécuté par les tests (utile pour des tests
    d'intégration placés à part) ;
  - **`-covermode`** : `set` (exécuté ou non, le défaut), `count` (combien de fois), `atomic` (comme count, sûr entre
    goroutines ; le défaut avec `-race`) ;
  - depuis Go 1.20, **`go build -cover`** produit un binaire instrumenté : en le lançant avec `GOCOVERDIR=dossier`, on
    mesure la couverture de tests de bout en bout ou d'intégration, puis `go tool covdata` fusionne les résultats.

  Ce que la couverture **ne dit pas** : qu'un comportement est **vérifié**. Une ligne exécutée par un test qui n'affirme
  rien est « couverte ». Une couverture élevée peut donc cacher des tests faibles, et une couverture de 100 % n'est pas
  un objectif en soi.

  Le bon usage :
  - lire le **rapport HTML** pour trouver les **branches oubliées** (gestion d'erreur, cas limites) ;
  - suivre la **tendance** en CI (une baisse brutale signale du code ajouté sans test), sans seuil rigide qui pousse à
    écrire des tests inutiles ;
  - viser les zones à risque (logique métier, calculs, parseurs) plutôt que le code de câblage.

  **En entretien** : « -cover, -coverprofile, go tool cover -html pour voir les branches non testées ; -coverpkg et
  build -cover pour l'intégration ; la couverture dit ce qui est exécuté, pas ce qui est vérifié : un indicateur, pas
  un objectif. »
cards:
  - key: mesurer-couverture
    format: course
    question: Comment mesurer la couverture ?
    answer: "-cover ou -coverprofile puis go tool cover -html."
  - key: couverture-85-mais-regressions-passent-quand
    format: scenario
    question: Ta couverture est de 85 % mais des régressions passent quand même. Que fais-tu ?
    answer: |-
      La couverture mesure ce qui est exécuté, pas ce qui est vérifié. Je regarderais d'abord les régressions échappées : sont-elles dans l'intégration (requêtes SQL, sérialisation), la concurrence, ou des cas limites ? Chaque catégorie appelle un type de test différent : tests d'intégration avec testcontainers pour le SQL, `-race` et synctest pour la concurrence, **fuzzing** pour les entrées malformées, et des tests table-driven enrichis des cas limites (vide, nil, bornes, unicode).
      Je pourrais aussi lancer un outil de test de mutation sur les packages critiques pour repérer les assertions manquantes. Et chaque bug corrigé reçoit d'abord un test qui le reproduit.
  - key: html
    format: course
    question: Comment voir les lignes non couvertes par les tests ?
    answer: 'Avec `go test -coverprofile=c.out ./...` puis `go tool cover -html=c.out`, qui affiche le code coloré : vert pour exécuté, rouge pour jamais exécuté.'
  - key: coverpkg
    format: course
    question: À quoi sert -coverpkg ?
    answer: À compter la couverture des packages indiqués (par exemple ./...) même quand ils sont exécutés par les tests d'un autre package, comme des tests d'intégration placés à part.
  - key: limite
    format: course
    question: Pourquoi une couverture de 100 % ne garantit-elle pas l'absence de bugs ?
    answer: Elle dit quelles lignes ont été exécutées, pas si leur résultat a été vérifié ; un test sans assertion couvre du code, et des cas limites (valeurs, combinaisons) restent non testés.
  - key: vf-assertions
    format: true-false
    question: Une ligne couverte est forcément vérifiée par une assertion.
    truth: false
    answer: Elle a seulement été exécutée.
  - key: vf-build
    format: true-false
    question: Depuis Go 1.20, on peut mesurer la couverture d'un binaire lancé hors de go test.
    truth: true
    answer: Avec go build -cover et la variable GOCOVERDIR.
  - key: vf-atomic
    format: true-false
    question: Avec -race, le mode de couverture par défaut est atomic.
    truth: true
    answer: Le compteur doit être sûr entre goroutines.
  - key: vf-objectif
    format: true-false
    question: Un seuil de couverture obligatoire de 100 % améliore toujours la qualité des tests.
    truth: false
    answer: Il pousse à écrire des tests sans valeur pour du code trivial.
  - key: qcm-commandes
    format: multiple-choice
    question: Quelles commandes concernent la couverture ?
    choices:
      - text: '`go test -cover ./...`'
        correct: true
      - text: '`go test -coverprofile=c.out ./...`'
        correct: true
      - text: '`go tool cover -func=c.out`'
        correct: true
      - text: '`go vet -cover`'
        correct: false
    answer: vet ne mesure pas la couverture.
  - key: qcm-usage
    format: multiple-choice
    question: Comment utiliser la couverture à bon escient ?
    choices:
      - text: Chercher les branches d'erreur jamais testées dans le rapport HTML
        correct: true
      - text: Suivre sa tendance en CI
        correct: true
      - text: Viser en priorité la logique métier
        correct: true
      - text: Écrire des tests sans assertion pour atteindre le seuil
        correct: false
    answer: C'est un indicateur pour guider l'effort.
  - key: qcm-modes
    format: multiple-choice
    question: Que mesure chaque mode de couverture ?
    choices:
      - text: '`set` : chaque instruction a-t-elle été exécutée'
        correct: true
      - text: '`count` : combien de fois'
        correct: true
      - text: '`atomic` : combien de fois, de façon sûre entre goroutines'
        correct: true
      - text: '`branch` : chaque branche de chaque if'
        correct: false
    answer: Go n'a pas de mode branch ; la couverture est par instruction.
  - key: qcm-integration
    format: multiple-choice
    question: Comment mesurer la couverture des tests de bout en bout d'un service ?
    choices:
      - text: Compiler avec `go build -cover`
        correct: true
      - text: Lancer le binaire avec GOCOVERDIR, puis fusionner avec go tool covdata
        correct: true
      - text: Ce n'est pas possible
        correct: false
      - text: Utiliser go test -run E2E sans option
        correct: false
    answer: Disponible depuis Go 1.20.
  - key: scenario-seuil
    format: scenario
    question: Ton équipe veut imposer 90 % de couverture en CI. Que proposes-tu ?
    answer: |-
      Un seuil rigide pousse à tester le code trivial et à écrire des tests sans assertion. Je propose plutôt de suivre la
      couverture par package et sa tendance, d'alerter sur une baisse dans une pull request, et de regarder le rapport
      HTML en revue pour les branches importantes non testées. Pour mesurer la qualité des tests, des tests de mutation
      sur la logique critique en disent plus.
  - key: scenario-rapport
    format: scenario
    question: Le rapport de couverture montre en rouge tous les `if err != nil` d'un dépôt. Que fais-tu ?
    answer: |-
      Ce sont les chemins d'erreur, souvent ceux qui cassent en production. J'ajoute des tests qui les provoquent : un
      faux qui renvoie une erreur pour les services, une base arrêtée ou une contrainte violée pour le dépôt, un serveur
      de test qui répond 500 pour un client. Je vérifie à chaque fois que l'erreur est bien enveloppée et traduite.
  - key: scenario-mutation
    format: scenario
    question: Comment vérifier que les tests détectent vraiment les bugs, au-delà de la couverture ?
    answer: |-
      Avec des tests de mutation (par exemple go-mutesting ou gremlins) : l'outil modifie le code (inverse une
      condition, change un + en -) et relance les tests ; une mutation qui survit montre un comportement non vérifié. Plus
      simplement, en revue, je casse volontairement le code et je regarde si un test échoue. Et chaque bug corrigé
      reçoit un test qui le reproduit.
