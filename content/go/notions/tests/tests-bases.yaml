notion: tests-bases
lesson: "Les tests font partie de la chaîne d'outils : pas de bibliothèque à ajouter. Un test est une fonction\n**`TestXxx(t *testing.T)`** dans un fichier **`xxx_test.go`**, à côté du code :\n\n```go\n// panier_test.go\npackage panier\n\nimport \"testing\"\n\nfunc TestTotalAdditionneLesLignes(t *testing.T) {\n\tp := Panier{Lignes: []Ligne{{Prix: 300, Quantite: 2}, {Prix: 150, Quantite: 1}}}\n\tif got, want := p.Total(), 750; got != want {\n\t\tt.Errorf(\"Total() = %d, attendu %d\", got, want)\n\t}\n}\n```\n\n```\ngo test ./...                 # tous les packages\ngo test -run Total -v ./panier\ngo test -race -count=1 ./...  # avec le détecteur de courses, sans le cache\n```\n\nSignaler un échec :\n- **`t.Errorf`** (ou `t.Error`) marque le test en échec et **continue** : on voit tous les problèmes d'un coup ;\n- **`t.Fatalf`** (ou `t.Fatal`) marque en échec et **arrête** le test : quand la suite n'a plus de sens (une erreur\n  de préparation, un résultat nil qu'on va déréférencer) ;\n- `t.Fatal` ne doit être appelé que depuis la **goroutine du test**, pas depuis une goroutine qu'il a lancée ;\n- `t.Log` écrit un message, affiché si le test échoue ou avec `-v` ;\n- `t.Skip` saute un test (une dépendance absente).\n\nLe message suit la convention « **obtenu, attendu** » : `Total() = 700, attendu 750`, avec les entrées utiles.\nPas de bibliothèque d'assertions standard : un `if` et `t.Errorf` suffisent ; `go-cmp` (`cmp.Diff`) aide à comparer\ndes structures.\n\n`package panier` teste l'intérieur du package ; `package panier_test` (test **boîte noire**) ne voit que l'API\nexportée. `go test` met les résultats en **cache** tant que rien ne change ; `-count=1` force l'exécution.\n\n**En entretien** : « Fichier _test.go, TestXxx(t *testing.T) ; Errorf continue, Fatalf arrête ; message obtenu et\nattendu ; go test -race ; package _test pour l'API publique. »"
tour:
  - title: Tester son code
    text: |-
      Les tests Go vivent à côté du code, dans des fichiers `_test.go`. Une fonction de test s'appelle `TestXxx` et
      reçoit un `*testing.T` : `t.Errorf` signale un échec et continue, `t.Fatalf` le signale et arrête le test.
      `go test ./...` les lance tous :

      ```go
      func TestAbs(t *testing.T) {
          if got := Abs(-3); got != 3 {
              t.Errorf("Abs(-3) = %d, attendu 3", got)
          }
      }
      ```

      Le bac à sable du Tour n'exécute que `main` : ce programme fait donc lui-même la vérification du test.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return -n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      output: |-
        ok : Abs(-3) = 3
    task:
      instructions: |-
        La fonction `Abs` a un bug, et la vérification le montre. Corrige-la : le programme doit afficher
        `ok : Abs(-3) = 3`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return -n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      output: |-
        ok : Abs(-3) = 3
cards:
  - key: nomme-fichier-fonction-test
    format: course
    question: "Comment nomme-t-on un fichier et une fonction de test ?"
    choices:
      - {text: "Un fichier `*_test.go`, une fonction `TestXxx(t *testing.T)`", correct: true}
      - {text: "Un fichier `test_*.go`, une fonction `TestXxx(t *testing.T)`", correct: false}
      - {text: "Un fichier `*_test.go`, une fonction `testXxx(t *testing.T)`", correct: false}
      - {text: "Un fichier `*Test.go`, une méthode annotée `@Test`", correct: false}
    answer: "Un fichier `*_test.go`, une fonction `TestXxx(t *testing.T)` dont le nom continue par une majuscule. Go n'a pas d'annotations."
  - key: error-vs-fatal
    format: course
    question: "Quelle différence entre `t.Error` et `t.Fatal` ?"
    choices:
      - {text: "`t.Error` signale et continue ; `t.Fatal` signale et arrête le test courant", correct: true}
      - {text: "`t.Fatal` signale et continue ; `t.Error` signale et arrête le test courant", correct: false}
      - {text: "`t.Error` signale et continue ; `t.Fatal` arrête tous les tests du package", correct: false}
      - {text: "`t.Fatal` fait paniquer le programme ; `t.Error` écrit seulement un journal", correct: false}
    answer: "`t.Error` signale l'échec et continue ; `t.Fatal` le signale et arrête le test courant, les autres tests continuant."
  - key: appeler-fatal-depuis-autre-goroutine
    format: course
    question: "Peut-on appeler `t.Fatal` depuis une autre goroutine que celle du test ?"
    choices:
      - {text: "Non : seulement depuis la goroutine du test", correct: true}
      - {text: "Oui : `t.Fatal` arrête alors toutes les goroutines", correct: false}
      - {text: "Oui, à condition de protéger `t` par un mutex", correct: false}
      - {text: "Oui, mais seulement dans un sous-test parallèle", correct: false}
    answer: "Non, uniquement depuis la goroutine du test : `t.Fatal` appelle `runtime.Goexit`, qui n'arrêterait que l'autre goroutine. `t.Error`, lui, y est permis."
  - key: package-foo-vs-package-foo-test
    format: course
    question: "Quelle différence entre un fichier de test en `package foo` et en `package foo_test` ?"
    choices:
      - {text: "`package foo` accède aux internes ; `package foo_test` ne teste que l'API exportée", correct: true}
      - {text: "`package foo_test` accède aux internes ; `package foo` ne teste que l'API exportée", correct: false}
      - {text: "`package foo_test` ne compile qu'avec `-tags test`, `package foo` toujours", correct: false}
      - {text: "Aucune : `foo_test` n'est qu'un autre nom accepté pour le même package", correct: false}
    answer: "`package foo` donne accès aux internes ; `package foo_test` est un package distinct qui ne voit que l'API exportée, comme un utilisateur."
  - key: desactiver-cache-tests
    format: course
    question: "Comment désactives-tu le cache des résultats de tests ?"
    choices:
      - {text: "Avec `-count=1`", correct: true}
      - {text: "Avec `-cache=off`", correct: false}
      - {text: "Avec `-run=all`", correct: false}
      - {text: "Avec `-v`", correct: false}
    answer: "`-count=1` force la réexécution ; `go clean -testcache` vide le cache entièrement."
  - key: bibliotheque-assertions-standard
    format: course
    question: "Go a-t-il une bibliothèque d'assertions standard ?"
    choices:
      - {text: "Non : on compare avec `if` et `t.Errorf` ; testify ou go-cmp sont courants", correct: true}
      - {text: "Oui : le package `testing/assert`, livré avec la bibliothèque standard", correct: false}
      - {text: "Oui : les méthodes `t.AssertEqual` et `t.AssertNil` de `*testing.T`", correct: false}
      - {text: "Non, et les bibliothèques d'assertions tierces sont interdites en Go", correct: false}
    answer: "Non ; on compare avec un `if` et `t.Errorf`, et testify ou go-cmp sont courants."
  - key: vf-continue
    format: true-false
    question: Après un `t.Errorf`, le test continue de s'exécuter.
    truth: true
    answer: Il est marqué en échec, mais la suite s'exécute.
  - key: vf-fatal-goroutine
    format: true-false
    question: On peut appeler t.Fatal depuis une goroutine lancée par le test.
    truth: false
    answer: t.Fatal arrête la goroutine qui l'appelle ; on l'appelle depuis la goroutine du test (t.Error est permis ailleurs).
  - key: vf-cache
    format: true-false
    question: go test peut réutiliser un résultat en cache sans relancer le test.
    truth: true
    answer: Tant que le code et les entrées ne changent pas ; -count=1 force l'exécution.
  - key: vf-assertions
    format: true-false
    question: La bibliothèque standard fournit une fonction assert.Equal.
    truth: false
    answer: On écrit un if et t.Errorf, ou l'on prend une bibliothèque comme testify ou go-cmp.
  - key: qcm-convention
    format: multiple-choice
    question: Lesquels respectent les conventions de go test ?
    choices:
      - text: Un fichier `commande_test.go`
        correct: true
      - text: Une fonction `func TestCreerCommande(t *testing.T)`
        correct: true
      - text: Une fonction `func testCreer(t *testing.T)`
        correct: false
      - text: Un fichier `test_commande.go`
        correct: false
    answer: Le nom doit commencer par Test suivi d'une majuscule, dans un fichier _test.go.
  - key: qcm-fatal
    format: multiple-choice
    question: "Quand utilises-tu `t.Fatalf` plutôt que `t.Errorf` ?"
    choices:
      - {text: "Quand continuer n'a plus de sens, comme un résultat `nil` à déréférencer", correct: true}
      - {text: "Pour chaque champ comparé d'une struct, l'un après l'autre", correct: false}
      - {text: "Jamais : `t.Errorf` convient à tous les cas", correct: false}
      - {text: "Pour tout écart, afin de finir le test plus vite", correct: false}
    answer: "`t.Errorf` accumule les écarts ; `t.Fatalf` arrête le test quand la suite n'a plus de sens : préparation ratée, résultat `nil` qu'on déréférencerait."
  - key: qcm-commandes
    format: multiple-choice
    question: "Que fait l'option `-count=1` de `go test` ?"
    choices:
      - {text: "Elle lance chaque test une fois, sans le cache", correct: true}
      - {text: "Elle ne lance qu'un seul test du package", correct: false}
      - {text: "Elle arrête au premier test en échec", correct: false}
      - {text: "Elle limite à un les tests parallèles", correct: false}
    answer: "`-count=1` exécute chaque test une fois en contournant le cache. `-run` choisit les tests, `-failfast` arrête au premier échec, `-parallel=1` sérialise les tests parallèles."
  - key: qcm-message
    format: multiple-choice
    question: Quel message d'échec est le plus utile ?
    choices:
      - text: '`Total() = 700, attendu 750`'
        correct: true
      - text: '`erreur`'
        correct: false
      - text: '`test échoué`'
        correct: false
      - text: '`750 != 700`'
        correct: false
    answer: Il dit quoi a été appelé, ce qui a été obtenu et ce qui était attendu.
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature :
      ```go
      func TestParser(t *testing.___) {
      ```
    blanks:
      - - T
    answer: testing.T.
  - key: trous-errorf
    format: fill-in
    question: |-
      Complète :
      ```go
      if got != want {
      	t.___("Somme(2, 3) = %d, attendu %d", got, want)
      }
      ```
    blanks:
      - - Errorf
    answer: Errorf signale et continue.
  - key: trous-fatal
    format: fill-in
    question: |-
      Complète pour arrêter si la préparation échoue :
      ```go
      f, err := os.Open("testdata/commandes.json")
      if err != nil {
      	t.___(err)
      }
      ```
    blanks:
      - - Fatal
    answer: t.Fatal arrête le test.
  - key: trous-fichier
    format: fill-in
    question: "Complète le nom du fichier de test de facture.go : facture___.go"
    blanks:
      - - _test
    answer: facture_test.go.
  - key: bug-goroutine
    format: bug-fix
    question: |-
      `go vet` signale « call to (*T).Fatal from a non-test goroutine ». Quelle correction est la bonne ?
      ```go
      go func() {
      	if err := serveur.Demarrer(); err != nil {
      		t.Fatal(err)
      	}
      }()
      ```
    choices:
      - {text: "Renvoyer l'erreur par un channel, et appeler `t.Fatal` dans la goroutine du test", correct: true}
      - {text: "Remplacer `t.Fatal(err)` par `panic(err)`, qui arrête aussi le test", correct: false}
      - {text: "Remplacer `t.Fatal(err)` par `log.Fatal(err)`, permis dans une goroutine", correct: false}
      - {text: "Protéger l'appel à `t.Fatal` par un `sync.Mutex`", correct: false}
    answer: "```go\nerreurs := make(chan error, 1)\ngo func() { erreurs <- serveur.Demarrer() }()\n// ...\nif err := <-erreurs; err != nil {\n\tt.Fatal(err)\n}\n```\nt.Fatal doit être appelé depuis la goroutine du test ; l'erreur lui est renvoyée par un channel."
  - key: bug-nil
    format: bug-fix
    question: |-
      Le test panique au lieu d'échouer proprement quand la lecture renvoie une erreur. Quelle correction est la bonne ?
      ```go
      c, err := depot.Trouver(ctx, "42")
      if err != nil {
      	t.Errorf("Trouver : %v", err)
      }
      if c.Nom != "Ada" {
      	t.Errorf("Nom = %q, attendu Ada", c.Nom)
      }
      ```
    choices:
      - {text: "Remplacer le premier `t.Errorf` par `t.Fatalf`, qui arrête le test", correct: true}
      - {text: "Remplacer le second `t.Errorf` par `t.Fatalf`", correct: false}
      - {text: "Ajouter un `recover` en tête du test", correct: false}
      - {text: "Écrire `(*c).Nom` à la place de `c.Nom`", correct: false}
    answer: "```go\nc, err := depot.Trouver(ctx, \"42\")\nif err != nil {\n\tt.Fatalf(\"Trouver : %v\", err)\n}\nif c.Nom != \"Ada\" {\n\tt.Errorf(\"Nom = %q, attendu Ada\", c.Nom)\n}\n```\nc est nil en cas d'erreur : le test doit s'arrêter avec Fatalf avant de le déréférencer."
  - key: bug-message
    format: bug-fix
    question: |-
      Quand ce test échoue en CI, personne ne comprend pourquoi. Quelle correction est la bonne ?
      ```go
      if Arrondir(2.675, 2) != 2.68 {
      	t.Error("faux")
      }
      ```
    choices:
      - {text: "Un message avec l'appel, l'obtenu et l'attendu, via `t.Errorf`", correct: true}
      - {text: "`t.Fatal(\"faux\")`, qui arrête le test au premier échec", correct: false}
      - {text: "Un `t.Log(\"faux\")` avant `t.Error`, pour laisser une trace", correct: false}
      - {text: "`go test -v` en CI, qui détaille chaque comparaison", correct: false}
    answer: "```go\nif got := Arrondir(2.675, 2); got != 2.68 {\n\tt.Errorf(\"Arrondir(2.675, 2) = %v, attendu 2.68\", got)\n}\n```\nLe message dit ce qui a été appelé, ce qui a été obtenu et ce qui était attendu."
  - key: bug-pas-de-verif
    format: bug-fix
    question: |-
      Ce test passe toujours, même quand la fonction est cassée. Quelle correction est la bonne ?
      ```go
      func TestValider(t *testing.T) {
      	err := Valider(Commande{Quantite: -1})
      	t.Log(err)
      }
      ```
    choices:
      - {text: "Vérifier que l'erreur n'est pas `nil`, et appeler `t.Error` sinon", correct: true}
      - {text: "Remplacer `t.Log(err)` par `fmt.Println(err)`, plus visible", correct: false}
      - {text: "Lancer le test avec `-v`, pour lire l'erreur dans la sortie", correct: false}
      - {text: "Remplacer `t.Log(err)` par `t.Logf(\"%v\", err)`", correct: false}
    answer: "```go\nfunc TestValiderRefuseUneQuantiteNegative(t *testing.T) {\n\tif err := Valider(Commande{Quantite: -1}); err == nil {\n\t\tt.Error(\"Valider(quantité -1) = nil, attendu une erreur\")\n\t}\n}\n```\nt.Log n'échoue jamais ; il faut vérifier le résultat et signaler l'écart (et nommer le test d'après le comportement)."
