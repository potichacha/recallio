notion: tests-bases
lesson: "Les tests font partie de la chaîne d'outils : pas de bibliothèque à ajouter. Un test est une fonction\n**`TestXxx(t *testing.T)`** dans un fichier **`xxx_test.go`**, à côté du code :\n\n```go\n// panier_test.go\npackage panier\n\nimport \"testing\"\n\nfunc TestTotalAdditionneLesLignes(t *testing.T) {\n\tp := Panier{Lignes: []Ligne{{Prix: 300, Quantite: 2}, {Prix: 150, Quantite: 1}}}\n\tif got, want := p.Total(), 750; got != want {\n\t\tt.Errorf(\"Total() = %d, attendu %d\", got, want)\n\t}\n}\n```\n\n```\ngo test ./...                 # tous les packages\ngo test -run Total -v ./panier\ngo test -race -count=1 ./...  # avec le détecteur de courses, sans le cache\n```\n\nSignaler un échec :\n- **`t.Errorf`** (ou `t.Error`) marque le test en échec et **continue** : on voit tous les problèmes d'un coup ;\n- **`t.Fatalf`** (ou `t.Fatal`) marque en échec et **arrête** le test : quand la suite n'a plus de sens (une erreur\n  de préparation, un résultat nil qu'on va déréférencer) ;\n- `t.Fatal` ne doit être appelé que depuis la **goroutine du test**, pas depuis une goroutine qu'il a lancée ;\n- `t.Log` écrit un message, affiché si le test échoue ou avec `-v` ;\n- `t.Skip` saute un test (une dépendance absente).\n\nLe message suit la convention « **obtenu, attendu** » : `Total() = 700, attendu 750`, avec les entrées utiles.\nPas de bibliothèque d'assertions standard : un `if` et `t.Errorf` suffisent ; `go-cmp` (`cmp.Diff`) aide à comparer\ndes structures.\n\n`package panier` teste l'intérieur du package ; `package panier_test` (test **boîte noire**) ne voit que l'API\nexportée. `go test` met les résultats en **cache** tant que rien ne change ; `-count=1` force l'exécution.\n\n**En entretien** : « Fichier _test.go, TestXxx(t *testing.T) ; Errorf continue, Fatalf arrête ; message obtenu et\nattendu ; go test -race ; package _test pour l'API publique. »"
tour:
  - title: Tester son code
    text: |-
      Les tests Go vivent à côté du code, dans des fichiers `_test.go`. Une fonction de test s'appelle `TestXxx` et
      reçoit un `*testing.T` : `t.Errorf` signale un échec et continue, `t.Fatalf` le signale et arrête le test.
      `go test ./...` les lance tous :

      ```go
      func TestAbs(t *testing.T) {
          if got := Abs(-3); got != 3 {
              t.Errorf("Abs(-3) = %d, attendu 3", got)
          }
      }
      ```

      Le bac à sable du Tour n'exécute que `main` : ce programme fait donc lui-même la vérification du test.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return -n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      output: |-
        ok : Abs(-3) = 3
    task:
      instructions: |-
        La fonction `Abs` a un bug, et la vérification le montre. Corrige-la : le programme doit afficher
        `ok : Abs(-3) = 3`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func Abs(n int) int {
          	if n < 0 {
          		return -n
          	}
          	return n
          }

          func main() {
          	if got := Abs(-3); got != 3 {
          		fmt.Printf("ÉCHEC : Abs(-3) = %d, attendu 3\n", got)
          	} else {
          		fmt.Println("ok : Abs(-3) = 3")
          	}
          }
      output: |-
        ok : Abs(-3) = 3
cards:
  - key: nomme-fichier-fonction-test
    format: course
    question: Comment nomme-t-on un fichier et une fonction de test ?
    answer: Fichier *_test.go, fonction TestXxx(t *testing.T).
  - key: error-vs-fatal
    format: course
    question: t.Error vs t.Fatal ?
    answer: Signaler et continuer vs signaler et arrêter le test courant.
  - key: appeler-fatal-depuis-autre-goroutine
    format: course
    question: Peut-on appeler t.Fatal depuis une autre goroutine ?
    answer: Non, uniquement depuis la goroutine du test.
  - key: package-foo-vs-package-foo-test
    format: course
    question: package foo vs package foo_test ?
    answer: Accès aux internes vs test de l'API exportée uniquement.
  - key: desactiver-cache-tests
    format: course
    question: Comment désactiver le cache des tests ?
    answer: "-count=1."
  - key: bibliotheque-assertions-standard
    format: course
    question: Go a-t-il une bibliothèque d'assertions standard ?
    answer: Non ; testify ou go-cmp sont courants.
  - key: vf-continue
    format: true-false
    question: Après un `t.Errorf`, le test continue de s'exécuter.
    truth: true
    answer: Il est marqué en échec, mais la suite s'exécute.
  - key: vf-fatal-goroutine
    format: true-false
    question: On peut appeler t.Fatal depuis une goroutine lancée par le test.
    truth: false
    answer: t.Fatal arrête la goroutine qui l'appelle ; on l'appelle depuis la goroutine du test (t.Error est permis ailleurs).
  - key: vf-cache
    format: true-false
    question: go test peut réutiliser un résultat en cache sans relancer le test.
    truth: true
    answer: Tant que le code et les entrées ne changent pas ; -count=1 force l'exécution.
  - key: vf-assertions
    format: true-false
    question: La bibliothèque standard fournit une fonction assert.Equal.
    truth: false
    answer: On écrit un if et t.Errorf, ou l'on prend une bibliothèque comme testify ou go-cmp.
  - key: qcm-convention
    format: multiple-choice
    question: Lesquels respectent les conventions de go test ?
    choices:
      - text: Un fichier `commande_test.go`
        correct: true
      - text: Une fonction `func TestCreerCommande(t *testing.T)`
        correct: true
      - text: Une fonction `func testCreer(t *testing.T)`
        correct: false
      - text: Un fichier `test_commande.go`
        correct: false
    answer: Le nom doit commencer par Test suivi d'une majuscule, dans un fichier _test.go.
  - key: qcm-fatal
    format: multiple-choice
    question: Quand utiliser t.Fatalf plutôt que t.Errorf ?
    choices:
      - text: Quand la préparation du test échoue
        correct: true
      - text: Quand la suite du test déréférencerait un résultat nil
        correct: true
      - text: Pour chaque champ comparé d'une struct
        correct: false
      - text: Jamais
        correct: false
    answer: Errorf pour accumuler les écarts, Fatalf quand continuer n'a plus de sens.
  - key: qcm-commandes
    format: multiple-choice
    question: Que fait chaque option de go test ?
    choices:
      - text: '`-run Regex` ne lance que les tests dont le nom correspond'
        correct: true
      - text: '`-v` affiche chaque test et ses journaux'
        correct: true
      - text: '`-race` active le détecteur de courses'
        correct: true
      - text: '`-count=1` lance un seul test'
        correct: false
    answer: "-count=1 exécute une fois sans cache."
  - key: qcm-message
    format: multiple-choice
    question: Quel message d'échec est le plus utile ?
    choices:
      - text: '`Total() = 700, attendu 750`'
        correct: true
      - text: '`erreur`'
        correct: false
      - text: '`test échoué`'
        correct: false
      - text: '`750 != 700`'
        correct: false
    answer: Il dit quoi a été appelé, ce qui a été obtenu et ce qui était attendu.
  - key: trous-signature
    format: fill-in
    question: |-
      Complétez la signature :
      ```go
      func TestParser(t *testing.___) {
      ```
    blanks:
      - - T
    answer: testing.T.
  - key: trous-errorf
    format: fill-in
    question: "Complétez :\n```go\nif got != want {\n\tt.___(\"Somme(2, 3) = %d, attendu %d\", got, want)\n}\n```"
    blanks:
      - - Errorf
    answer: Errorf signale et continue.
  - key: trous-fatal
    format: fill-in
    question: "Complétez pour arrêter si la préparation échoue :\n```go\nf, err := os.Open(\"testdata/commandes.json\")\nif err != nil {\n\tt.___(err)\n}\n```"
    blanks:
      - - Fatal
    answer: t.Fatal arrête le test.
  - key: trous-fichier
    format: fill-in
    question: 'Complétez le nom du fichier de test de facture.go : facture___.go'
    blanks:
      - - _test
    answer: facture_test.go.
  - key: bug-goroutine
    format: bug-fix
    question: "`go vet` signale « call to (*T).Fatal from a non-test goroutine » :\n```go\ngo func() {\n\tif err := serveur.Demarrer(); err != nil {\n\t\tt.Fatal(err)\n\t}\n}()\n```"
    answer: "```go\nerreurs := make(chan error, 1)\ngo func() { erreurs <- serveur.Demarrer() }()\n// ...\nif err := <-erreurs; err != nil {\n\tt.Fatal(err)\n}\n```\nt.Fatal doit être appelé depuis la goroutine du test ; l'erreur lui est renvoyée par un channel."
  - key: bug-nil
    format: bug-fix
    question: "Le test panique au lieu d'échouer proprement quand la lecture renvoie une erreur :\n```go\nc, err := depot.Trouver(ctx, \"42\")\nif err != nil {\n\tt.Errorf(\"Trouver : %v\", err)\n}\nif c.Nom != \"Ada\" {\n\tt.Errorf(\"Nom = %q, attendu Ada\", c.Nom)\n}\n```"
    answer: "```go\nc, err := depot.Trouver(ctx, \"42\")\nif err != nil {\n\tt.Fatalf(\"Trouver : %v\", err)\n}\nif c.Nom != \"Ada\" {\n\tt.Errorf(\"Nom = %q, attendu Ada\", c.Nom)\n}\n```\nc est nil en cas d'erreur : le test doit s'arrêter avec Fatalf avant de le déréférencer."
  - key: bug-message
    format: bug-fix
    question: "Quand ce test échoue en CI, personne ne comprend pourquoi :\n```go\nif Arrondir(2.675, 2) != 2.68 {\n\tt.Error(\"faux\")\n}\n```"
    answer: "```go\nif got := Arrondir(2.675, 2); got != 2.68 {\n\tt.Errorf(\"Arrondir(2.675, 2) = %v, attendu 2.68\", got)\n}\n```\nLe message dit ce qui a été appelé, ce qui a été obtenu et ce qui était attendu."
  - key: bug-pas-de-verif
    format: bug-fix
    question: "Ce test passe toujours, même quand la fonction est cassée :\n```go\nfunc TestValider(t *testing.T) {\n\terr := Valider(Commande{Quantite: -1})\n\tt.Log(err)\n}\n```"
    answer: "```go\nfunc TestValiderRefuseUneQuantiteNegative(t *testing.T) {\n\tif err := Valider(Commande{Quantite: -1}); err == nil {\n\t\tt.Error(\"Valider(quantité -1) = nil, attendu une erreur\")\n\t}\n}\n```\nt.Log n'échoue jamais ; il faut vérifier le résultat et signaler l'écart (et nommer le test d'après le comportement)."
