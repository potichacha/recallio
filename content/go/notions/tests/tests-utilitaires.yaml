notion: tests-utilitaires
lesson: "Le type `testing.T` offre plusieurs outils pour écrire des tests propres :\n\n| Outil | Rôle |\n|---|---|\n| `t.Helper()` | dans une fonction d'aide, fait pointer les messages d'échec vers la ligne de l'**appelant** |\n| `t.Cleanup(f)` | enregistre un nettoyage, exécuté à la fin du test (et après ses sous-tests), dans l'ordre inverse |\n| `t.TempDir()` | un dossier temporaire propre au test, supprimé à la fin |\n| `t.Setenv(k, v)` | change une variable d'environnement le temps du test (interdit en parallèle) |\n| `t.Context()` (Go 1.24) | un contexte annulé à la fin du test |\n| `t.Chdir(d)` (Go 1.24) | change de dossier courant le temps du test |\n\n```go\nfunc nouvelleBase(t *testing.T) *sql.DB {\n\tt.Helper()\n\tdb, err := sql.Open(\"pgx\", dsnDeTest)\n\tif err != nil {\n\t\tt.Fatalf(\"ouverture de la base : %v\", err) // l'échec est rapporté à la ligne qui a appelé nouvelleBase\n\t}\n\tt.Cleanup(func() { db.Close() })\n\treturn db\n}\n```\n\n**`TestMain(m *testing.M)`** prend la main sur tout le binaire de test d'un package : préparer une ressource\npartagée (démarrer un conteneur), lancer `m.Run()`, puis nettoyer. Depuis Go 1.15, il peut simplement rendre la main :\nle code de sortie de `m.Run()` est utilisé. On le réserve aux préparations vraiment communes et coûteuses.\n\nAutres outils :\n- **`testing.Short()`** et `go test -short` pour sauter les tests lents ;\n- des **étiquettes de construction** (`//go:build integration`) pour séparer les tests d'intégration ;\n- **`-shuffle=on`** mélange l'ordre des tests, ce qui révèle les dépendances cachées ;\n- **`testing.TB`**, l'interface commune à `*testing.T` et `*testing.B`, pour les fonctions d'aide partagées.\n\n**En entretien** : « t.Helper dans les fonctions d'aide ; t.Cleanup plutôt que defer ; t.TempDir, t.Setenv,\nt.Context ; TestMain pour une préparation commune ; -short et les étiquettes de construction pour séparer les tests\nlents. »"
cards:
  - key: sert-helper
    format: course
    question: "À quoi sert `t.Helper()` ?"
    choices:
      - {text: "À faire pointer les messages d'échec vers l'appelant de la fonction d'aide", correct: true}
      - {text: "À marquer une fonction d'aide pour qu'elle ne soit compilée qu'en test", correct: false}
      - {text: "À exécuter la fonction d'aide dans sa propre goroutine, en parallèle", correct: false}
      - {text: "À ignorer les échecs signalés depuis l'intérieur de la fonction d'aide", correct: false}
    answer: "À faire pointer les messages d'erreur vers la ligne qui appelle la fonction utilitaire, et non vers la fonction elle-même."
  - key: separer-tests-integration
    format: course
    question: "Comment sépares-tu les tests d'intégration des tests unitaires ?"
    choices:
      - {text: "Par une contrainte `//go:build integration`, ou par `testing.Short()`", correct: true}
      - {text: "Par des fichiers sans le suffixe `_test.go`, ignorés par `go test`", correct: false}
      - {text: "Par une annotation `@Integration` sur chaque fonction de test", correct: false}
      - {text: "Par un package `integration`, que `go test ./...` ne parcourt pas", correct: false}
    answer: "Par une contrainte de build (`//go:build integration`, lancée avec `-tags integration`) ou par `testing.Short()` et `t.Skip`, que `-short` active."
  - key: testcontainers
    format: course
    question: "Qu'est-ce que testcontainers-go ?"
    choices:
      - {text: "Une bibliothèque qui démarre de vraies dépendances en conteneurs depuis les tests", correct: true}
      - {text: "Un outil qui lance chaque test Go dans son propre conteneur, isolé des autres", correct: false}
      - {text: "Une bibliothèque de faux en mémoire qui imitent PostgreSQL ou Kafka", correct: false}
      - {text: "Un service en ligne qui exécute les tests d'intégration à la place de la CI", correct: false}
    answer: "Une bibliothèque qui démarre des dépendances réelles (PostgreSQL, Kafka...) en conteneurs depuis les tests, et les arrête à la fin."
  - key: sert-testmain
    format: course
    question: "À quoi sert `TestMain` ?"
    choices:
      - {text: "À faire une préparation et un nettoyage globaux autour de tous les tests du package", correct: true}
      - {text: "À servir de point d'entrée à un test unique, comme `main` pour un programme", correct: false}
      - {text: "À préparer les données d'un seul test, avant chacune de ses exécutions", correct: false}
      - {text: "À lancer les tests de tous les packages du module dans le bon ordre", correct: false}
    answer: "À exécuter une initialisation et un nettoyage globaux autour de tous les tests du package, avant et après `m.Run()`."
  - key: sert-shuffle
    format: course
    question: "À quoi sert l'option `-shuffle=on` de `go test` ?"
    choices:
      - {text: "À lancer les tests dans un ordre aléatoire, pour révéler leurs dépendances cachées", correct: true}
      - {text: "À répartir les tests au hasard entre plusieurs machines de la CI", correct: false}
      - {text: "À générer des entrées aléatoires pour chaque test, comme le fuzzing", correct: false}
      - {text: "À détecter les courses de données entre les tests parallèles", correct: false}
    answer: "À exécuter les tests dans un ordre aléatoire, pour révéler les dépendances cachées entre eux ; la graine est affichée pour rejouer le même ordre."
  - key: vf-helper
    format: true-false
    question: Sans t.Helper(), un échec dans une fonction d'aide est rapporté à la ligne de la fonction d'aide.
    truth: true
    answer: t.Helper fait remonter vers la ligne de l'appelant.
  - key: vf-cleanup-ordre
    format: true-false
    question: Les fonctions enregistrées par t.Cleanup s'exécutent dans l'ordre inverse de leur enregistrement.
    truth: true
    answer: Comme les defer.
  - key: vf-tempdir
    format: true-false
    question: Le dossier renvoyé par t.TempDir doit être supprimé par le test lui-même.
    truth: false
    answer: Il est supprimé automatiquement à la fin du test.
  - key: vf-testmain-exit
    format: true-false
    question: Depuis Go 1.15, TestMain peut se terminer sans appeler os.Exit.
    truth: true
    answer: Le code de m.Run() est alors utilisé.
  - key: qcm-outils
    format: multiple-choice
    question: "Quel outil donne à un test un contexte annulé à sa fin ?"
    choices:
      - {text: "`t.Context()`", correct: true}
      - {text: "`context.Background()`", correct: false}
      - {text: "`t.Cleanup`", correct: false}
      - {text: "`t.Deadline()`", correct: false}
    answer: "`t.Context()` (Go 1.24) est annulé juste avant les fonctions de `t.Cleanup`. `t.TempDir` donne un dossier propre au test, `t.Cleanup` ferme une ressource à la fin ; pour sauter un test lent, `testing.Short()` et `t.Skip`."
  - key: qcm-integration
    format: multiple-choice
    question: "Lesquelles de ces façons séparent les tests d'intégration des tests unitaires ?"
    choices:
      - text: Une étiquette `//go:build integration` et `go test -tags integration`
        correct: true
      - text: '`if testing.Short() { t.Skip(...) }` et `go test -short` pour les sauter'
        correct: true
      - text: Les mettre dans des fichiers sans _test.go
        correct: false
      - text: Les commenter avant chaque commit
        correct: false
    answer: Les deux approches sont courantes.
  - key: qcm-testmain
    format: multiple-choice
    question: "Quand utilises-tu `TestMain` ?"
    choices:
      - {text: "Pour démarrer une base en conteneur une fois, pour tous les tests du package", correct: true}
      - {text: "Pour préparer les données d'un seul test, juste avant lui", correct: false}
      - {text: "Pour remplacer `t.Run` dans les tests pilotés par une table", correct: false}
      - {text: "Pour lancer les tests du package dans un ordre précis", correct: false}
    answer: "`TestMain` prépare un état global coûteux une seule fois, puis appelle `m.Run()`. Une préparation propre à un test reste dans ce test."
  - key: qcm-shuffle
    format: multiple-choice
    question: "Que révèle `go test -shuffle=on` ?"
    choices:
      - {text: "Des tests qui dépendent de l'ordre, ou d'un état laissé par un autre", correct: true}
      - {text: "Les courses de données entre les goroutines des tests", correct: false}
      - {text: "Les fuites de mémoire laissées par les tests", correct: false}
      - {text: "Les tests trop lents, classés par durée", correct: false}
    answer: "Un ordre aléatoire fait échouer les tests qui dépendaient de l'état laissé par un précédent. Les courses de données se voient avec `-race`."
  - key: trous-helper
    format: fill-in
    question: |-
      Complète la fonction d'aide :
      ```go
      func lireFixture(t *testing.T, nom string) []byte {
      	t.___()
      	b, err := os.ReadFile(filepath.Join("testdata", nom))
      	if err != nil {
      		t.Fatal(err)
      	}
      	return b
      }
      ```
    blanks:
      - - Helper
    answer: t.Helper.
  - key: trous-tempdir
    format: fill-in
    question: |-
      Complète :
      ```go
      dossier := t.___()
      chemin := filepath.Join(dossier, "export.csv")
      ```
    blanks:
      - - TempDir
    answer: t.TempDir.
  - key: trous-testmain
    format: fill-in
    question: |-
      Complète :
      ```go
      func TestMain(m *testing.___) {
      	arreter := demarrerBase()
      	code := m.Run()
      	arreter()
      	os.Exit(code)
      }
      ```
    blanks:
      - - M
    answer: testing.M.
  - key: trous-short
    format: fill-in
    question: |-
      Complète pour sauter un test lent avec -short :
      ```go
      if testing.___() {
      	t.Skip("test lent")
      }
      ```
    blanks:
      - - Short
    answer: testing.Short().
  - key: bug-helper
    format: bug-fix
    question: |-
      Tous les échecs pointent vers la même ligne de la fonction d'aide, impossible de savoir quel test a échoué. Quelle correction est la bonne ?
      ```go
      func verifierStatut(t *testing.T, rec *httptest.ResponseRecorder, attendu int) {
      	if rec.Code != attendu {
      		t.Errorf("statut = %d, attendu %d", rec.Code, attendu)
      	}
      }
      ```
    choices:
      - {text: "Appeler `t.Helper()` en tête de la fonction d'aide", correct: true}
      - {text: "Remplacer `t.Errorf` par `t.Fatalf` dans la fonction", correct: false}
      - {text: "Appeler `t.Log` avant `t.Errorf`, pour tracer l'appelant", correct: false}
      - {text: "Passer la ligne de l'appel en paramètre et l'afficher", correct: false}
    answer: "```go\nfunc verifierStatut(t *testing.T, rec *httptest.ResponseRecorder, attendu int) {\n\tt.Helper()\n\tif rec.Code != attendu {\n\t\tt.Errorf(\"statut = %d, attendu %d\", rec.Code, attendu)\n\t}\n}\n```\nt.Helper fait rapporter l'échec à la ligne qui a appelé la fonction d'aide."
  - key: bug-tmp
    format: bug-fix
    question: |-
      Les tests laissent des fichiers dans /tmp et échouent en parallèle. Quelle correction est la bonne ?
      ```go
      dossier, _ := os.MkdirTemp("", "test")
      exporter(dossier)
      ```
    choices:
      - {text: "`dossier := t.TempDir()`, propre au test et supprimé à la fin", correct: true}
      - {text: "`dossier := \"/tmp/test\"`, un chemin fixe et prévisible", correct: false}
      - {text: "`dossier := os.TempDir()`, le dossier temporaire du système", correct: false}
      - {text: "`os.MkdirTemp(\".\", \"test\")`, dans le dossier du package", correct: false}
    answer: |-
      ```go
      dossier := t.TempDir()
      exporter(dossier)
      ```
      t.TempDir crée un dossier unique par test et le supprime à la fin, même en cas d'échec.
  - key: bug-env
    format: bug-fix
    question: |-
      Après ce test, les suivants héritent de la mauvaise configuration. Quelle correction est la bonne ?
      ```go
      os.Setenv("APP_MODE", "test")
      cfg := Charger()
      ```
    choices:
      - {text: "`t.Setenv(\"APP_MODE\", \"test\")`, restauré à la fin du test", correct: true}
      - {text: "`os.Setenv` dans un `init()` du fichier de test", correct: false}
      - {text: "`os.Unsetenv(\"APP_MODE\")` au début du test suivant", correct: false}
      - {text: "`os.Setenv` suivi d'un appel à `t.Parallel()`", correct: false}
    answer: |-
      ```go
      t.Setenv("APP_MODE", "test")
      cfg := Charger()
      ```
      t.Setenv restaure l'ancienne valeur à la fin du test ; os.Setenv la laissait pour tous les tests suivants.
  - key: bug-context
    format: bug-fix
    question: |-
      Le serveur démarré par le test continue de tourner après lui. Quelle correction est la bonne ?
      ```go
      go serveur.Run(context.Background())
      ```
    choices:
      - {text: "`go serveur.Run(t.Context())`, annulé à la fin du test", correct: true}
      - {text: "`go serveur.Run(context.TODO())`, propre aux tests", correct: false}
      - {text: "`serveur.Run(context.Background())`, sans le `go`", correct: false}
      - {text: "Un `runtime.Goexit()` en fin de test, qui arrête le serveur", correct: false}
    answer: |-
      ```go
      go serveur.Run(t.Context())
      ```
      t.Context (Go 1.24) est annulé à la fin du test : le serveur reçoit l'arrêt, au lieu de survivre aux tests suivants.
