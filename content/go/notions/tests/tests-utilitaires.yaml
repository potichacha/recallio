notion: tests-utilitaires
lesson: "Le type `testing.T` offre plusieurs outils pour écrire des tests propres :\n\n| Outil | Rôle |\n|---|---|\n| `t.Helper()` | dans une fonction d'aide, fait pointer les messages d'échec vers la ligne de l'**appelant** |\n| `t.Cleanup(f)` | enregistre un nettoyage, exécuté à la fin du test (et après ses sous-tests), dans l'ordre inverse |\n| `t.TempDir()` | un dossier temporaire propre au test, supprimé à la fin |\n| `t.Setenv(k, v)` | change une variable d'environnement le temps du test (interdit en parallèle) |\n| `t.Context()` (Go 1.24) | un contexte annulé à la fin du test |\n| `t.Chdir(d)` (Go 1.24) | change de dossier courant le temps du test |\n\n```go\nfunc nouvelleBase(t *testing.T) *sql.DB {\n\tt.Helper()\n\tdb, err := sql.Open(\"pgx\", dsnDeTest)\n\tif err != nil {\n\t\tt.Fatalf(\"ouverture de la base : %v\", err) // l'échec est rapporté à la ligne qui a appelé nouvelleBase\n\t}\n\tt.Cleanup(func() { db.Close() })\n\treturn db\n}\n```\n\n**`TestMain(m *testing.M)`** prend la main sur tout le binaire de test d'un package : préparer une ressource\npartagée (démarrer un conteneur), lancer `m.Run()`, puis nettoyer. Depuis Go 1.15, il peut simplement rendre la main :\nle code de sortie de `m.Run()` est utilisé. On le réserve aux préparations vraiment communes et coûteuses.\n\nAutres outils :\n- **`testing.Short()`** et `go test -short` pour sauter les tests lents ;\n- des **étiquettes de construction** (`//go:build integration`) pour séparer les tests d'intégration ;\n- **`-shuffle=on`** mélange l'ordre des tests, ce qui révèle les dépendances cachées ;\n- **`testing.TB`**, l'interface commune à `*testing.T` et `*testing.B`, pour les fonctions d'aide partagées.\n\n**En entretien** : « t.Helper dans les fonctions d'aide ; t.Cleanup plutôt que defer ; t.TempDir, t.Setenv,\nt.Context ; TestMain pour une préparation commune ; -short et les étiquettes de construction pour séparer les tests\nlents. »"
cards:
  - key: sert-helper
    format: course
    question: À quoi sert t.Helper() ?
    answer: À faire pointer les messages d'erreur vers l'appelant de la fonction utilitaire.
  - key: separer-tests-integration
    format: course
    question: Comment séparer les tests d'intégration ?
    answer: Build tags (//go:build integration) ou testing.Short().
  - key: testcontainers
    format: course
    question: C'est quoi testcontainers-go ?
    answer: Une bibliothèque qui démarre des dépendances réelles en conteneurs depuis les tests.
  - key: sert-testmain
    format: course
    question: À quoi sert TestMain ?
    answer: Exécuter une initialisation et un nettoyage globaux autour de tous les tests du package.
  - key: sert-shuffle
    format: course
    question: À quoi sert -shuffle=on ?
    answer: Exécuter les tests dans un ordre aléatoire pour révéler les dépendances cachées entre eux.
  - key: vf-helper
    format: true-false
    question: Sans t.Helper(), un échec dans une fonction d'aide est rapporté à la ligne de la fonction d'aide.
    truth: true
    answer: t.Helper fait remonter vers la ligne de l'appelant.
  - key: vf-cleanup-ordre
    format: true-false
    question: Les fonctions enregistrées par t.Cleanup s'exécutent dans l'ordre inverse de leur enregistrement.
    truth: true
    answer: Comme les defer.
  - key: vf-tempdir
    format: true-false
    question: Le dossier renvoyé par t.TempDir doit être supprimé par le test lui-même.
    truth: false
    answer: Il est supprimé automatiquement à la fin du test.
  - key: vf-testmain-exit
    format: true-false
    question: Depuis Go 1.15, TestMain peut se terminer sans appeler os.Exit.
    truth: true
    answer: Le code de m.Run() est alors utilisé.
  - key: qcm-outils
    format: multiple-choice
    question: Quel outil pour quel besoin ?
    choices:
      - text: 'Un dossier de travail propre au test : t.TempDir'
        correct: true
      - text: 'Fermer une ressource à la fin du test et de ses sous-tests : t.Cleanup'
        correct: true
      - text: 'Un contexte annulé à la fin du test : t.Context'
        correct: true
      - text: 'Sauter un test lent : t.Parallel'
        correct: false
    answer: Pour sauter un test lent, testing.Short() et t.Skip.
  - key: qcm-integration
    format: multiple-choice
    question: Comment séparer les tests d'intégration des tests unitaires ?
    choices:
      - text: Une étiquette `//go:build integration` et `go test -tags integration`
        correct: true
      - text: '`if testing.Short() { t.Skip(...) }` et `go test -short` pour les sauter'
        correct: true
      - text: Les mettre dans des fichiers sans _test.go
        correct: false
      - text: Les commenter avant chaque commit
        correct: false
    answer: Les deux approches sont courantes.
  - key: qcm-testmain
    format: multiple-choice
    question: Quand utiliser TestMain ?
    choices:
      - text: Démarrer une base dans un conteneur pour tous les tests du package
        correct: true
      - text: Préparer un état global coûteux, une fois
        correct: true
      - text: Préparer les données d'un seul test
        correct: false
      - text: Remplacer t.Run
        correct: false
    answer: Une préparation propre à un test reste dans le test.
  - key: qcm-shuffle
    format: multiple-choice
    question: Que révèle `go test -shuffle=on` ?
    choices:
      - text: Des tests qui dépendent de l'ordre d'exécution
        correct: true
      - text: Un état partagé laissé par un test précédent
        correct: true
      - text: Les courses de données
        correct: false
      - text: Les fuites de mémoire
        correct: false
    answer: Les courses se voient avec -race.
  - key: trous-helper
    format: fill-in
    question: "Complétez la fonction d'aide :\n```go\nfunc lireFixture(t *testing.T, nom string) []byte {\n\tt.___()\n\tb, err := os.ReadFile(filepath.Join(\"testdata\", nom))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn b\n}\n```"
    blanks:
      - - Helper
    answer: t.Helper.
  - key: trous-tempdir
    format: fill-in
    question: |-
      Complétez :
      ```go
      dossier := t.___()
      chemin := filepath.Join(dossier, "export.csv")
      ```
    blanks:
      - - TempDir
    answer: t.TempDir.
  - key: trous-testmain
    format: fill-in
    question: "Complétez :\n```go\nfunc TestMain(m *testing.___) {\n\tarreter := demarrerBase()\n\tcode := m.Run()\n\tarreter()\n\tos.Exit(code)\n}\n```"
    blanks:
      - - M
    answer: testing.M.
  - key: trous-short
    format: fill-in
    question: "Complétez pour sauter un test lent avec -short :\n```go\nif testing.___() {\n\tt.Skip(\"test lent\")\n}\n```"
    blanks:
      - - Short
    answer: testing.Short().
  - key: bug-helper
    format: bug-fix
    question: "Tous les échecs pointent vers la même ligne de la fonction d'aide, impossible de savoir quel test a échoué :\n```go\nfunc verifierStatut(t *testing.T, rec *httptest.ResponseRecorder, attendu int) {\n\tif rec.Code != attendu {\n\t\tt.Errorf(\"statut = %d, attendu %d\", rec.Code, attendu)\n\t}\n}\n```"
    answer: "```go\nfunc verifierStatut(t *testing.T, rec *httptest.ResponseRecorder, attendu int) {\n\tt.Helper()\n\tif rec.Code != attendu {\n\t\tt.Errorf(\"statut = %d, attendu %d\", rec.Code, attendu)\n\t}\n}\n```\nt.Helper fait rapporter l'échec à la ligne qui a appelé la fonction d'aide."
  - key: bug-tmp
    format: bug-fix
    question: |-
      Les tests laissent des fichiers dans /tmp et échouent en parallèle :
      ```go
      dossier, _ := os.MkdirTemp("", "test")
      exporter(dossier)
      ```
    answer: |-
      ```go
      dossier := t.TempDir()
      exporter(dossier)
      ```
      t.TempDir crée un dossier unique par test et le supprime à la fin, même en cas d'échec.
  - key: bug-env
    format: bug-fix
    question: |-
      Après ce test, les suivants héritent de la mauvaise configuration :
      ```go
      os.Setenv("APP_MODE", "test")
      cfg := Charger()
      ```
    answer: |-
      ```go
      t.Setenv("APP_MODE", "test")
      cfg := Charger()
      ```
      t.Setenv restaure l'ancienne valeur à la fin du test ; os.Setenv la laissait pour tous les tests suivants.
  - key: bug-context
    format: bug-fix
    question: |-
      Le serveur démarré par le test continue de tourner après lui :
      ```go
      go serveur.Run(context.Background())
      ```
    answer: |-
      ```go
      go serveur.Run(t.Context())
      ```
      t.Context (Go 1.24) est annulé à la fin du test : le serveur reçoit l'arrêt, au lieu de survivre aux tests suivants.
