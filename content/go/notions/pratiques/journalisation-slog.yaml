notion: journalisation-slog
lesson: |-
  **`log/slog`** (Go 1.21) apporte la **journalisation structurée** à la bibliothèque standard : chaque message a un
  **niveau** et des **attributs** clé-valeur, faciles à filtrer et à interroger.

  ```go
  log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: slog.LevelInfo}))

  log.Info("commande créée", "commande", c.ID, "montant", c.Total, "duree", time.Since(debut))
  // {"time":"...","level":"INFO","msg":"commande créée","commande":"c-42","montant":1990,"duree":"12ms"}

  log.Error("paiement refusé", "err", err, "client", c.Client)
  ```

  Les éléments :
  - les **niveaux** : `Debug`, `Info`, `Warn`, `Error` ; le niveau minimal se règle dans les options, ou à chaud avec un
    **`slog.LevelVar`** ;
  - les **gestionnaires** : `JSONHandler` pour la production (lu par les outils), `TextHandler` pour le développement ;
  - **`log.With("service", "commandes")`** crée un logger qui ajoute des attributs à chaque message (identifiant de
    requête, utilisateur) ;
  - les **variantes Context** (`InfoContext(ctx, ...)`) permettent à un gestionnaire de lire la trace ou l'identifiant de
    requête dans le contexte ;
  - **`slog.Group`** regroupe des attributs ; les attributs typés (`slog.Int`, `slog.String`) évitent des allocations ;
  - un type implémente **`LogValue()`** (interface `LogValuer`) pour contrôler son affichage, par exemple **masquer** un
    secret.

  Les bonnes pratiques :
  - un **message fixe** et des **attributs** variables (`"commande créée"`, pas `fmt.Sprintf("commande %s créée", id)`) ;
  - **jamais de données sensibles** (mots de passe, jetons, données personnelles inutiles) ;
  - le logger **injecté** dans les composants, plutôt que `slog.Default()` partout ;
  - journaliser une erreur **une seule fois**, là où elle est traitée, pas à chaque niveau qui la remonte.

  **En entretien** : « slog : niveaux, attributs clé-valeur, JSONHandler en production ; With pour le contexte commun ;
  InfoContext pour la trace ; LevelVar pour changer le niveau ; LogValuer pour masquer ; message fixe, attributs
  variables ; une erreur journalisée une fois. »
cards:
  - key: apporte-log-slog
    format: course
    question: Qu'apporte log/slog ?
    answer: Des logs structurés (clé-valeur, JSON) dans la bibliothèque standard, avec niveaux et handlers (Go 1.21).
  - key: texthandler-vs-jsonhandler
    format: course
    question: TextHandler vs JSONHandler ?
    answer: Lisible pour le développement vs structuré pour l'ingestion en production.
  - key: changer-niveau-log-chaud
    format: course
    question: Comment changer le niveau de log à chaud ?
    answer: Avec un slog.LevelVar passé aux options du handler.
  - key: masquer-donnee-sensible-slog
    format: course
    question: Comment masquer une donnée sensible dans slog ?
    answer: En implémentant slog.LogValuer sur son type.
  - key: apporte-slog-newmultihandler
    format: course
    question: Qu'apporte slog.NewMultiHandler ?
    answer: L'envoi des logs vers plusieurs handlers à la fois (Go 1.26).
  - key: bibliotheques-logs-avant-slog
    format: course
    question: Quelles bibliothèques de logs avant slog ?
    answer: zap, zerolog, logrus.
  - key: terme-slog
    format: course
    question: Que désigne « slog » ?
    answer: Logs structurés de la bibliothèque standard (Go 1.21)
  - key: vf-121
    format: true-false
    question: log/slog fait partie de la bibliothèque standard depuis Go 1.21.
    truth: true
    answer: Il remplace pour beaucoup zap ou zerolog.
  - key: vf-message
    format: true-false
    question: Il vaut mieux construire le message avec fmt.Sprintf pour y inclure les identifiants.
    truth: false
    answer: Un message fixe et des attributs restent filtrables et agrégeables.
  - key: vf-levelvar
    format: true-false
    question: Un slog.LevelVar permet de changer le niveau de journalisation pendant l'exécution.
    truth: true
    answer: Son Set est sûr entre goroutines.
  - key: vf-une-fois
    format: true-false
    question: Une erreur doit être journalisée à chaque fonction qui la remonte.
    truth: false
    answer: Une seule fois, là où elle est traitée, sinon les journaux se répètent.
  - key: qcm-api
    format: multiple-choice
    question: Quels éléments font partie de log/slog ?
    choices:
      - text: '`slog.NewJSONHandler` et `slog.NewTextHandler`'
        correct: true
      - text: '`logger.With("cle", valeur)`'
        correct: true
      - text: '`slog.LevelVar`'
        correct: true
      - text: '`slog.Printf`'
        correct: false
    answer: 'slog n''a pas de Printf : les attributs remplacent le formatage.'
  - key: qcm-sensible
    format: multiple-choice
    question: Comment éviter qu'un secret apparaisse dans les journaux ?
    choices:
      - text: Un type Secret dont la méthode LogValue renvoie « [masqué] »
        correct: true
      - text: Ne journaliser que des champs choisis, pas des structs entières
        correct: true
      - text: Le journaliser au niveau Debug
        correct: false
      - text: Le chiffrer avec base64
        correct: false
    answer: base64 n'est pas un chiffrement.
  - key: qcm-contexte
    format: multiple-choice
    question: Comment ajouter l'identifiant de requête à tous les journaux d'une requête ?
    choices:
      - text: Un logger dérivé avec With, passé aux couches qui servent la requête
        correct: true
      - text: Un gestionnaire qui lit l'identifiant dans le contexte, avec les méthodes InfoContext
        correct: true
      - text: Une variable globale modifiée à chaque requête
        correct: false
      - text: Ajouter l'identifiant à la main dans chaque message texte
        correct: false
    answer: La globale serait partagée entre requêtes concurrentes.
  - key: qcm-handlers
    format: multiple-choice
    question: Quel gestionnaire pour quel usage ?
    choices:
      - text: JSONHandler en production, lu par les outils de collecte
        correct: true
      - text: TextHandler en développement, lisible dans le terminal
        correct: true
      - text: JSONHandler seulement pour les erreurs
        correct: false
      - text: TextHandler obligatoire en conteneur
        correct: false
    answer: Le choix se fait souvent selon la configuration.
  - key: trous-new
    format: fill-in
    question: |-
      Complétez un logger JSON :
      ```go
      log := slog.New(slog.___(os.Stdout, nil))
      ```
    blanks:
      - - NewJSONHandler
    answer: slog.NewJSONHandler.
  - key: trous-with
    format: fill-in
    question: |-
      Complétez pour ajouter un attribut à tous les messages :
      ```go
      log = log.___("service", "commandes")
      ```
    blanks:
      - - With
    answer: With.
  - key: trous-context
    format: fill-in
    question: |-
      Complétez pour journaliser avec le contexte :
      ```go
      log.___(ctx, "paiement accepté", "commande", id)
      ```
    blanks:
      - - InfoContext
    answer: InfoContext.
  - key: trous-logvalue
    format: fill-in
    question: "Complétez pour masquer un secret :\n```go\nfunc (s Secret) ___() slog.Value {\n\treturn slog.StringValue(\"[masqué]\")\n}\n```"
    blanks:
      - - LogValue
    answer: LogValue, de l'interface slog.LogValuer.
  - key: bug-sprintf
    format: bug-fix
    question: |-
      Impossible de compter les erreurs par client dans l'outil de journaux :
      ```go
      log.Error(fmt.Sprintf("échec du paiement du client %s : %v", client, err))
      ```
    answer: |-
      ```go
      log.Error("échec du paiement", "client", client, "err", err)
      ```
      Un message fixe et des attributs permettent de filtrer et d'agréger par client.
  - key: bug-double
    format: bug-fix
    question: "La même erreur apparaît trois fois dans les journaux :\n```go\nfunc (d *Depot) Trouver(...) (Commande, error) {\n\tif err != nil {\n\t\tlog.Error(\"lecture\", \"err\", err)\n\t\treturn Commande{}, err\n\t}\n}\nfunc (s *Service) Payer(...) error {\n\tif err != nil {\n\t\tlog.Error(\"paiement\", \"err\", err)\n\t\treturn err\n\t}\n}\n// et encore dans le handler\n```"
    answer: "```go\nfunc (d *Depot) Trouver(ctx context.Context, id string) (Commande, error) {\n\tif err != nil {\n\t\treturn Commande{}, fmt.Errorf(\"lecture de la commande %s : %w\", id, err)\n\t}\n}\n// ... remontée avec contexte jusqu'au handler, qui journalise une seule fois\ns.log.ErrorContext(ctx, \"paiement impossible\", \"err\", err)\n```\nOn enveloppe l'erreur avec son contexte en remontant, et on la journalise une seule fois là où elle est traitée."
  - key: bug-secret
    format: bug-fix
    question: |-
      Le jeton d'accès des clients apparaît dans les journaux :
      ```go
      log.Info("requête reçue", "entetes", r.Header)
      ```
    answer: "```go\nlog.InfoContext(r.Context(), \"requête reçue\",\n\t\"methode\", r.Method,\n\t\"chemin\", r.URL.Path,\n\t\"agent\", r.UserAgent())\n```\nLes en-têtes contiennent Authorization et les cookies ; on ne journalise que des champs choisis et sans secret."
  - key: bug-niveau
    format: bug-fix
    question: |-
      Pour enquêter sur un incident, il faut redéployer avec le niveau Debug, ce qui fait disparaître le problème :
      ```go
      log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: slog.LevelInfo}))
      ```
    answer: |-
      ```go
      var niveau slog.LevelVar // Info par défaut
      log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: &niveau}))

      // un endpoint d'administration interne, ou un signal
      niveau.Set(slog.LevelDebug)
      ```
      Un LevelVar change le niveau à chaud, sans redéploiement.
  - key: scenario-mise-en-place
    format: scenario
    question: Comment mets-tu en place la journalisation d'un nouveau service Go ?
    answer: |-
      Un logger slog créé dans main : JSONHandler en production, TextHandler en local selon la configuration, avec un
      LevelVar réglable. Il est injecté dans les composants ; un middleware ajoute l'identifiant de requête (et la trace)
      via le contexte, lus par un gestionnaire enveloppant. Messages fixes, attributs variables, secrets masqués par des
      types LogValuer, erreurs journalisées une fois. Les journaux partent sur stdout, collectés par la plateforme.
  - key: scenario-volume
    format: scenario
    question: Les journaux de ton service coûtent cher en stockage. Que fais-tu ?
    answer: |-
      Je mesure d'abord quels messages dominent. Puis : ne pas journaliser chaque requête réussie en Info (les métriques
      et les traces s'en chargent), garder Debug désactivé par défaut, échantillonner les messages très fréquents (un
      gestionnaire qui n'en garde qu'une partie), supprimer les attributs volumineux (corps entiers), et ajuster la durée de
      rétention par niveau.
  - key: scenario-migration
    format: scenario
    question: Ton service utilise zap. Faut-il migrer vers slog ?
    answer: |-
      Pas dans l'urgence : zap reste performant et maintenu. slog a l'avantage d'être standard, donc compris par toutes les
      bibliothèques, sans dépendance. Une migration progressive est possible : un gestionnaire slog qui écrit via zap
      (zapslog), puis remplacer les appels au fil des modifications. Pour un nouveau service, je pars directement sur slog.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande ce qu'est la journalisation structurée et pourquoi l'utiliser.
    answer: |-
      Chaque événement est un enregistrement avec un message fixe et des champs typés (commande, client, durée, erreur),
      en général en JSON, au lieu d'une phrase libre. Les outils (Loki, Elasticsearch, Datadog) peuvent alors filtrer,
      compter et corréler par champ, par exemple toutes les erreurs d'un client ou d'une trace. En Go, log/slog le fournit
      en standard depuis 1.21.
