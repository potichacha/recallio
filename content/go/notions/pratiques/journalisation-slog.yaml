notion: journalisation-slog
lesson: |-
  **`log/slog`** (Go 1.21) apporte la **journalisation structurée** à la bibliothèque standard : chaque message a un
  **niveau** et des **attributs** clé-valeur, faciles à filtrer et à interroger.

  ```go
  log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: slog.LevelInfo}))

  log.Info("commande créée", "commande", c.ID, "montant", c.Total, "duree", time.Since(debut))
  // {"time":"...","level":"INFO","msg":"commande créée","commande":"c-42","montant":1990,"duree":"12ms"}

  log.Error("paiement refusé", "err", err, "client", c.Client)
  ```

  Les éléments :
  - les **niveaux** : `Debug`, `Info`, `Warn`, `Error` ; le niveau minimal se règle dans les options, ou à chaud avec un
    **`slog.LevelVar`** ;
  - les **gestionnaires** : `JSONHandler` pour la production (lu par les outils), `TextHandler` pour le développement ;
  - **`log.With("service", "commandes")`** crée un logger qui ajoute des attributs à chaque message (identifiant de
    requête, utilisateur) ;
  - les **variantes Context** (`InfoContext(ctx, ...)`) permettent à un gestionnaire de lire la trace ou l'identifiant de
    requête dans le contexte ;
  - **`slog.Group`** regroupe des attributs ; les attributs typés (`slog.Int`, `slog.String`) évitent des allocations ;
  - un type implémente **`LogValue()`** (interface `LogValuer`) pour contrôler son affichage, par exemple **masquer** un
    secret.

  Les bonnes pratiques :
  - un **message fixe** et des **attributs** variables (`"commande créée"`, pas `fmt.Sprintf("commande %s créée", id)`) ;
  - **jamais de données sensibles** (mots de passe, jetons, données personnelles inutiles) ;
  - le logger **injecté** dans les composants, plutôt que `slog.Default()` partout ;
  - journaliser une erreur **une seule fois**, là où elle est traitée, pas à chaque niveau qui la remonte.

  **En entretien** : « slog : niveaux, attributs clé-valeur, JSONHandler en production ; With pour le contexte commun ;
  InfoContext pour la trace ; LevelVar pour changer le niveau ; LogValuer pour masquer ; message fixe, attributs
  variables ; une erreur journalisée une fois. »
cards:
  - key: apporte-log-slog
    format: course
    question: "Qu'apporte le package `log/slog` ?"
    choices:
      - {text: "Des journaux structurés (clé-valeur, JSON) dans la bibliothèque standard, avec niveaux et handlers", correct: true}
      - {text: "Un journal plus rapide que `log`, qui écrit en binaire pour économiser la place sur disque", correct: false}
      - {text: "Une interface commune à zap et logrus, qu'il faut toujours installer à côté de lui", correct: false}
      - {text: "Un `Printf` avec des niveaux, comme `slog.Infof`, sans autre changement par rapport à `log`", correct: false}
    answer: "Depuis Go 1.21, `log/slog` apporte des journaux structurés (un message fixe et des attributs clé-valeur, en texte ou en JSON), avec des niveaux et des handlers. Il n'a pas de `Printf` : les attributs remplacent le formatage."
  - key: texthandler-vs-jsonhandler
    format: course
    question: "Quelle différence y a-t-il entre `slog.TextHandler` et `slog.JSONHandler` ?"
    choices:
      - {text: "Le texte `cle=valeur` se lit dans un terminal, le JSON s'ingère en production", correct: true}
      - {text: "Le texte ne garde que le message, le JSON garde aussi les attributs", correct: false}
      - {text: "Le JSON est réservé aux erreurs, le texte sert à tous les autres niveaux", correct: false}
      - {text: "Le texte écrit sur la sortie standard, le JSON seulement dans un fichier", correct: false}
    answer: "Les deux écrivent les mêmes attributs : `TextHandler` en `cle=valeur`, lisible en développement, `JSONHandler` en JSON, lu par les outils de collecte en production. On choisit souvent par la configuration."
  - key: changer-niveau-log-chaud
    format: course
    question: "Comment changer à chaud le niveau d'un logger slog ?"
    choices:
      - {text: "Avec un `slog.LevelVar` passé aux options du handler, puis sa méthode `Set`", correct: true}
      - {text: "En recréant le logger avec un autre niveau, puis en le réinjectant partout", correct: false}
      - {text: "Avec `slog.SetLevel`, qui change d'un coup le niveau de tous les loggers", correct: false}
      - {text: "En redémarrant le service avec une autre valeur de variable d'environnement", correct: false}
    answer: "Un `slog.LevelVar` passé dans `HandlerOptions.Level` se modifie avec `Set`, de façon sûre entre goroutines, sans redéploiement. `slog.SetLevel` n'existe pas."
  - key: masquer-donnee-sensible-slog
    format: course
    question: "Comment masquer une donnée sensible dans les journaux slog ?"
    choices:
      - {text: "En implémentant `slog.LogValuer` sur son type, avec une méthode `LogValue`", correct: true}
      - {text: "En la journalisant seulement au niveau Debug, désactivé en production", correct: false}
      - {text: "En l'encodant en base64 avant de la passer comme attribut", correct: false}
      - {text: "Avec l'option `Redact: true` des `HandlerOptions` du handler", correct: false}
    answer: "Un type qui implémente `slog.LogValuer` choisit sa représentation : `LogValue` renvoie par exemple « [masqué] » (`ReplaceAttr` peut aussi filtrer par clé). `HandlerOptions` n'a pas d'option `Redact`, et base64 n'est pas un chiffrement."
  - key: apporte-slog-newmultihandler
    format: course
    question: "Qu'apporte `slog.NewMultiHandler` ?"
    choices:
      - {text: "L'envoi de chaque enregistrement à plusieurs handlers à la fois (Go 1.26)", correct: true}
      - {text: "La répartition des enregistrements entre plusieurs goroutines d'écriture", correct: false}
      - {text: "Un handler qui choisit seul le texte ou le JSON, selon le terminal", correct: false}
      - {text: "Un logger par niveau, chacun avec sa propre sortie et son format", correct: false}
    answer: "Depuis Go 1.26, il diffuse chaque enregistrement à plusieurs handlers, par exemple du JSON sur la sortie standard et du texte dans un fichier. Avant, il fallait l'écrire soi-même ou prendre une bibliothèque."
  - key: bibliotheques-logs-avant-slog
    format: course
    question: "Quelles bibliothèques de journalisation structurée utilisait-on en Go avant slog ?"
    choices:
      - {text: "zap, zerolog et logrus", correct: true}
      - {text: "log4j, logback et SLF4J", correct: false}
      - {text: "log/syslog, expvar et pprof", correct: false}
      - {text: "fmt, log et testing", correct: false}
    answer: "zap (d'Uber), zerolog et logrus, qu'on retrouve encore souvent ; zap et zerolog misent sur la performance. log4j, logback et SLF4J sont des bibliothèques Java."
  - key: terme-slog
    format: course
    question: "Que désigne « slog » en Go ?"
    choices:
      - {text: "Le package de journalisation structurée de la bibliothèque standard (Go 1.21)", correct: true}
      - {text: "Un journal lent mais sûr, qui synchronise chaque écriture sur le disque", correct: false}
      - {text: "Une bibliothèque tierce de journaux structurés, popularisée par Uber", correct: false}
      - {text: "Le journal système d'Unix, auquel on écrit avec `log/syslog`", correct: false}
    answer: "`log/slog`, la journalisation structurée de la bibliothèque standard depuis Go 1.21. zap est la bibliothèque d'Uber, et `log/syslog` écrit vers le journal système."
  - key: vf-121
    format: true-false
    question: log/slog fait partie de la bibliothèque standard depuis Go 1.21.
    truth: true
    answer: Il remplace pour beaucoup zap ou zerolog.
  - key: vf-message
    format: true-false
    question: Il vaut mieux construire le message avec fmt.Sprintf pour y inclure les identifiants.
    truth: false
    answer: Un message fixe et des attributs restent filtrables et agrégeables.
  - key: vf-levelvar
    format: true-false
    question: Un slog.LevelVar permet de changer le niveau de journalisation pendant l'exécution.
    truth: true
    answer: Son Set est sûr entre goroutines.
  - key: vf-une-fois
    format: true-false
    question: Une erreur doit être journalisée à chaque fonction qui la remonte.
    truth: false
    answer: Une seule fois, là où elle est traitée, sinon les journaux se répètent.
  - key: qcm-api
    format: multiple-choice
    question: "Lequel de ces éléments n'existe pas dans `log/slog` ?"
    choices:
      - {text: "`slog.Printf`", correct: true}
      - {text: "`slog.NewJSONHandler` et `slog.NewTextHandler`", correct: false}
      - {text: "`logger.With(\"cle\", valeur)`", correct: false}
      - {text: "`slog.LevelVar`", correct: false}
    answer: "slog n'a pas de `Printf` : les attributs remplacent le formatage. `NewJSONHandler`, `NewTextHandler`, `logger.With` et `LevelVar` en font partie."
  - key: qcm-sensible
    format: multiple-choice
    question: "Comment éviter qu'un secret apparaisse dans les journaux ?"
    choices:
      - {text: "Un type `Secret` dont la méthode `LogValue` renvoie « [masqué] »", correct: true}
      - {text: "Le journaliser seulement au niveau Debug, coupé en production", correct: false}
      - {text: "L'encoder en base64 avant de le passer au journal", correct: false}
      - {text: "Le placer en dernier attribut, que les outils tronquent", correct: false}
    answer: "`LogValue` masque le secret partout où il est journalisé ; on peut aussi ne journaliser que des champs choisis, jamais des structs entières. Debug finit par être activé, et base64 n'est pas un chiffrement."
  - key: qcm-contexte
    format: multiple-choice
    question: "Lesquelles de ces façons d'ajouter l'identifiant de requête à tous les journaux d'une requête sont bonnes ?"
    choices:
      - text: Un logger dérivé avec With, passé aux couches qui servent la requête
        correct: true
      - text: Un gestionnaire qui lit l'identifiant dans le contexte, avec les méthodes InfoContext
        correct: true
      - text: Une variable globale modifiée à chaque requête
        correct: false
      - text: Ajouter l'identifiant à la main dans chaque message texte
        correct: false
    answer: "Un logger dérivé avec `With`, ou un handler qui lit l'identifiant dans le contexte via `InfoContext`, marquent chaque message. Une globale serait partagée entre requêtes concurrentes, et l'ajout à la main s'oublie."
  - key: qcm-handlers
    format: multiple-choice
    question: "Quel handler slog choisir en production, quand un outil de collecte lit les journaux ?"
    choices:
      - {text: "`JSONHandler`, dont chaque champ est lu par l'outil", correct: true}
      - {text: "`TextHandler`, obligatoire dans un conteneur", correct: false}
      - {text: "`JSONHandler`, mais seulement pour les erreurs", correct: false}
      - {text: "Le logger par défaut de `log`, sans attributs", correct: false}
    answer: "En production, `JSONHandler` : les outils de collecte lisent chaque champ. `TextHandler` sert en développement, lisible dans le terminal ; le choix se fait souvent par la configuration."
  - key: trous-new
    format: fill-in
    question: |-
      Complète un logger JSON :
      ```go
      log := slog.New(slog.___(os.Stdout, nil))
      ```
    blanks:
      - - NewJSONHandler
    answer: slog.NewJSONHandler.
  - key: trous-with
    format: fill-in
    question: |-
      Complète pour ajouter un attribut à tous les messages :
      ```go
      log = log.___("service", "commandes")
      ```
    blanks:
      - - With
    answer: With.
  - key: trous-context
    format: fill-in
    question: |-
      Complète pour journaliser avec le contexte :
      ```go
      log.___(ctx, "paiement accepté", "commande", id)
      ```
    blanks:
      - - InfoContext
    answer: InfoContext.
  - key: trous-logvalue
    format: fill-in
    question: |-
      Complète pour masquer un secret :
      ```go
      func (s Secret) ___() slog.Value {
      	return slog.StringValue("[masqué]")
      }
      ```
    blanks:
      - - LogValue
    answer: LogValue, de l'interface slog.LogValuer.
  - key: bug-sprintf
    format: bug-fix
    question: |-
      Impossible de compter les erreurs par client dans l'outil de journaux. Quelle correction est la bonne ?
      ```go
      log.Error(fmt.Sprintf("échec du paiement du client %s : %v", client, err))
      ```
    choices:
      - {text: "`log.Error(\"échec du paiement\", \"client\", client, \"err\", err)`", correct: true}
      - {text: "`log.Error(fmt.Sprintf(\"client=%s err=%v\", client, err))`", correct: false}
      - {text: "`log.Error(\"échec du paiement du client \" + client, \"err\", err)`", correct: false}
      - {text: "`log.Info(fmt.Sprintf(\"échec du paiement de %s : %v\", client, err))`", correct: false}
    answer: |-
      ```go
      log.Error("échec du paiement", "client", client, "err", err)
      ```
      Un message fixe et des attributs permettent de filtrer et d'agréger par client. Un client glissé dans le texte du message, même au format `cle=valeur`, en fait une chaîne différente à chaque fois.
  - key: bug-double
    format: bug-fix
    question: |-
      La même erreur apparaît trois fois dans les journaux. Quelle correction est la bonne ?
      ```go
      func (d *Depot) Trouver(...) (Commande, error) {
      	if err != nil {
      		log.Error("lecture", "err", err)
      		return Commande{}, err
      	}
      }
      func (s *Service) Payer(...) error {
      	if err != nil {
      		log.Error("paiement", "err", err)
      		return err
      	}
      }
      // et encore dans le handler
      ```
    choices:
      - {text: "L'envelopper avec `%w` en remontant, et la journaliser une fois, là où elle est traitée", correct: true}
      - {text: "La journaliser à chaque couche, mais en Debug partout sauf dans le handler HTTP", correct: false}
      - {text: "La journaliser seulement dans le dépôt, au plus près de sa cause, puis la renvoyer", correct: false}
      - {text: "Garder le code, et dédoublonner les messages identiques dans l'outil de collecte", correct: false}
    answer: |-
      ```go
      func (d *Depot) Trouver(ctx context.Context, id string) (Commande, error) {
      	if err != nil {
      		return Commande{}, fmt.Errorf("lecture de la commande %s : %w", id, err)
      	}
      }
      // ... remontée avec contexte jusqu'au handler, qui journalise une seule fois
      s.log.ErrorContext(ctx, "paiement impossible", "err", err)
      ```
      On enveloppe l'erreur avec son contexte en remontant, et on la journalise une seule fois, là où elle est traitée. Le dépôt ne sait pas si l'erreur est grave pour l'appelant : il la renvoie.
  - key: bug-secret
    format: bug-fix
    question: |-
      Le jeton d'accès des clients apparaît dans les journaux. Quelle correction est la bonne ?
      ```go
      log.Info("requête reçue", "entetes", r.Header)
      ```
    choices:
      - {text: "Journaliser des champs choisis (méthode, chemin, agent), sans les en-têtes", correct: true}
      - {text: "Journaliser `r.Header` au niveau Debug, désactivé en production", correct: false}
      - {text: "Supprimer l'en-tête `Authorization`, puis journaliser les autres", correct: false}
      - {text: "Journaliser la requête `r` entière, que slog sait déjà masquer", correct: false}
    answer: |-
      ```go
      log.InfoContext(r.Context(), "requête reçue",
      	"methode", r.Method,
      	"chemin", r.URL.Path,
      	"agent", r.UserAgent())
      ```
      Les en-têtes contiennent `Authorization` et les cookies : on ne journalise que des champs choisis, sans secret. Retirer un seul en-tête laisse passer les autres, et Debug finit toujours par être activé.
  - key: bug-niveau
    format: bug-fix
    question: |-
      Pour enquêter sur un incident, il faut redéployer avec le niveau Debug, ce qui fait disparaître le problème. Quelle correction est la bonne ?
      ```go
      log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: slog.LevelInfo}))
      ```
    choices:
      - {text: "Un `slog.LevelVar` dans les options du handler, réglable à chaud", correct: true}
      - {text: "Journaliser en Debug en permanence, en production aussi", correct: false}
      - {text: "Un second logger en Debug, utilisé seulement pendant les incidents", correct: false}
      - {text: "Lire le niveau dans une variable d'environnement au démarrage", correct: false}
    answer: |-
      ```go
      var niveau slog.LevelVar // Info par défaut
      log := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: &niveau}))

      // un endpoint d'administration interne, ou un signal
      niveau.Set(slog.LevelDebug)
      ```
      Un `LevelVar` change le niveau à chaud, par un endpoint interne ou un signal, sans redéploiement. Lire le niveau au démarrage demande toujours un redémarrage, et Debug en permanence coûte cher.
  - key: scenario-mise-en-place
    format: scenario
    question: Comment mets-tu en place la journalisation d'un nouveau service Go ?
    choices:
      - {text: "Un logger slog créé dans `main` (JSON en production, `LevelVar`), injecté, avec l'identifiant de requête", correct: true}
      - {text: "Le logger par défaut de `log`, appelé directement dans chaque package, sans configuration", correct: false}
      - {text: "Un fichier de journal par composant, écrit sur le disque du conteneur et tourné chaque jour", correct: false}
      - {text: "Un singleton `journal.Instance()` en texte, partagé par tout le code et réglé dans `init`", correct: false}
    answer: "Un logger slog créé dans `main` (JSON en production, texte en local, un `LevelVar` réglable), injecté dans les composants ; un middleware ajoute l'identifiant de requête et la trace par le contexte. Messages fixes, attributs variables, secrets masqués par des `LogValuer`, erreurs journalisées une fois, et tout sur la sortie standard, collecté par la plateforme."
  - key: scenario-volume
    format: scenario
    question: Les journaux de ton service coûtent cher en stockage. Que fais-tu ?
    choices:
      - {text: "Mesurer ce qui domine, ne plus journaliser chaque succès, échantillonner, alléger les attributs", correct: true}
      - {text: "Passer tous les journaux en Debug, puis désactiver Debug en production pour tout couper", correct: false}
      - {text: "Encoder les journaux en base64 avant de les envoyer à l'outil, pour qu'ils prennent moins", correct: false}
      - {text: "Supprimer les journaux d'erreur, souvent les plus volumineux, et garder tous les autres", correct: false}
    answer: "Je mesure d'abord quels messages dominent. Puis : ne plus journaliser chaque requête réussie en Info (les métriques et les traces s'en chargent), garder Debug désactivé, échantillonner les messages très fréquents, retirer les attributs volumineux (corps entiers) et ajuster la rétention par niveau."
  - key: scenario-migration
    format: scenario
    question: Ton service utilise zap. Faut-il migrer vers slog ?
    choices:
      - {text: "Pas dans l'urgence : zap reste bon ; on migre au fil de l'eau, et on part sur slog pour le neuf", correct: true}
      - {text: "Oui, tout de suite : zap n'est plus maintenu depuis l'arrivée de slog dans la bibliothèque", correct: false}
      - {text: "Non, jamais : slog est trop lent pour un service en production, comparé à zap", correct: false}
      - {text: "Oui, en une seule PR qui remplace tous les appels, pour ne jamais mélanger les deux", correct: false}
    answer: "Pas dans l'urgence : zap reste performant et maintenu. slog a l'avantage d'être standard, donc compris par toutes les bibliothèques, sans dépendance ; on migre progressivement (un handler slog qui écrit via zap, zapslog, puis les appels au fil des modifications), et un nouveau service part directement sur slog."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce qu'est la journalisation structurée et pourquoi l'utiliser. Que réponds-tu ?"
    choices:
      - {text: "Un message fixe et des champs typés, souvent en JSON, que les outils filtrent et agrègent", correct: true}
      - {text: "Des journaux rangés dans des dossiers par date, pour les retrouver plus vite", correct: false}
      - {text: "Des journaux écrits en phrases complètes et bien tournées, pour être lus", correct: false}
      - {text: "Des journaux écrits dans une base SQL plutôt que dans des fichiers texte", correct: false}
    answer: "Chaque événement est un enregistrement avec un message fixe et des champs typés (commande, client, durée, erreur), en général en JSON, au lieu d'une phrase libre. Les outils (Loki, Elasticsearch, Datadog) peuvent alors filtrer, compter et corréler par champ ; en Go, `log/slog` le fournit depuis 1.21."
