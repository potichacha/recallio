notion: configuration
lesson: "Un service lit sa configuration au **démarrage**, la **valide**, puis la passe à ses composants. Les sources usuelles,\npar priorité croissante : **valeurs par défaut** < **fichier** < **variables d'environnement** < **options de la ligne\nde commande**.\n\n```go\ntype Config struct {\n\tAdresse   string\n\tBaseURL   string\n\tDelaiAPI  time.Duration\n\tNiveauLog slog.Level\n}\n\nfunc Charger(getenv func(string) string) (Config, error) {\n\tcfg := Config{Adresse: \":8080\", DelaiAPI: 5 * time.Second} // défauts\n\tif v := getenv(\"APP_ADRESSE\"); v != \"\" {\n\t\tcfg.Adresse = v\n\t}\n\tcfg.BaseURL = getenv(\"DATABASE_URL\")\n\tif v := getenv(\"APP_DELAI_API\"); v != \"\" {\n\t\td, err := time.ParseDuration(v)\n\t\tif err != nil {\n\t\t\treturn Config{}, fmt.Errorf(\"APP_DELAI_API %q : %w\", v, err)\n\t\t}\n\t\tcfg.DelaiAPI = d\n\t}\n\treturn cfg, cfg.valider()\n}\n\nfunc (c Config) valider() error {\n\tvar errs []error\n\tif c.BaseURL == \"\" {\n\t\terrs = append(errs, errors.New(\"DATABASE_URL est obligatoire\"))\n\t}\n\treturn errors.Join(errs...)\n}\n```\n\nLes principes :\n- **échouer au démarrage** avec un message clair si la configuration est invalide ou incomplète, plutôt qu'à la\n  première requête ;\n- une **struct typée** passée aux composants, jamais `os.Getenv` dispersé dans le code ;\n- injecter la source (`getenv`) pour **tester** sans toucher à l'environnement du processus ;\n- `os.LookupEnv` distingue une variable **absente** d'une variable **vide** ;\n- les **secrets** viennent de l'environnement ou d'un gestionnaire de secrets, jamais du dépôt, et ne sont **jamais\n  journalisés** ;\n- les durées avec `time.ParseDuration` (`5s`, `2m`) plutôt que des nombres sans unité.\n\nDes bibliothèques aident (envconfig, koanf, viper), mais une fonction de chargement écrite à la main reste souvent la\nplus claire.\n\n**En entretien** : « Défauts, fichier, environnement, options, par priorité croissante ; une struct typée validée au\ndémarrage ; échouer tôt ; source injectable pour les tests ; secrets jamais dans le dépôt ni les journaux. »"
cards:
  - key: os-getenv-vs-os-lookupenv
    format: course
    question: "Quelle différence y a-t-il entre `os.Getenv` et `os.LookupEnv` ?"
    choices:
      - {text: "`LookupEnv` distingue une variable absente d'une variable vide, par un booléen", correct: true}
      - {text: "`LookupEnv` lit aussi le fichier `.env` du répertoire courant, `Getenv` non", correct: false}
      - {text: "`Getenv` panique si la variable est absente, `LookupEnv` renvoie une chaîne vide", correct: false}
      - {text: "`LookupEnv` garde la valeur en cache, `Getenv` relit l'environnement à chaque appel", correct: false}
    answer: "`os.LookupEnv` renvoie la valeur et un booléen qui dit si la variable existe ; `os.Getenv` renvoie une chaîne vide dans les deux cas. Aucune des deux ne lit de fichier `.env` ni ne panique."
  - key: doit-echouer-configuration-invalide
    format: course
    question: "Quand une configuration invalide doit-elle faire échouer le service ?"
    choices:
      - {text: "Au démarrage, quand on valide la struct de configuration", correct: true}
      - {text: "À la première requête qui utilise la valeur fautive", correct: false}
      - {text: "Jamais : on journalise un avertissement et on prend le défaut", correct: false}
      - {text: "Au déploiement suivant, quand la CI relit la configuration", correct: false}
    answer: "Au démarrage : on charge et on valide la struct de configuration, et le service refuse de démarrer avec un message clair. Échouer à la première requête cache l'erreur jusqu'en production."
  - key: doit-echouer-configuration-invalide-2
    format: course
    question: "Le service démarre avec une `DATABASE_URL` vide. Que doit-il faire ?"
    choices:
      - {text: "Refuser de démarrer, avec un message qui nomme la variable", correct: true}
      - {text: "Démarrer, et échouer à la première requête qui touche la base", correct: false}
      - {text: "Démarrer sur une base SQLite locale, en guise de secours", correct: false}
      - {text: "Démarrer, puis relire la variable toutes les minutes", correct: false}
    answer: "Échouer au démarrage, avec un message clair : le déploiement voit aussitôt l'échec, et l'ancienne version reste en place. Un secours silencieux ou un échec différé cachent l'erreur."
  - key: ordre-priorite-configuration
    format: course
    question: "Du plus fort au plus faible, dans quel ordre de priorité combine-t-on les sources de configuration ?"
    choices:
      - {text: "Drapeaux, variables d'environnement, fichier, valeurs par défaut", correct: true}
      - {text: "Valeurs par défaut, fichier, variables d'environnement, drapeaux", correct: false}
      - {text: "Fichier, drapeaux, variables d'environnement, valeurs par défaut", correct: false}
      - {text: "Variables d'environnement, fichier, drapeaux, valeurs par défaut", correct: false}
    answer: "Du plus précis au plus général : un drapeau passé à la main l'emporte sur l'environnement, qui l'emporte sur le fichier, qui l'emporte sur les défauts. L'ordre inverse est celui du chargement, chaque source écrasant la précédente."
  - key: vf-demarrage
    format: true-false
    question: Une configuration invalide doit faire échouer le service au démarrage, avec un message clair.
    truth: true
    answer: Plutôt qu'une erreur surprise à la première requête.
  - key: vf-lookupenv
    format: true-false
    question: '`os.Getenv` permet de distinguer une variable absente d''une variable vide.'
    truth: false
    answer: Il renvoie "" dans les deux cas ; os.LookupEnv renvoie aussi un booléen.
  - key: vf-secrets
    format: true-false
    question: On peut versionner un fichier de configuration contenant le mot de passe de production s'il est dans un dépôt privé.
    truth: false
    answer: Les secrets viennent de l'environnement ou d'un gestionnaire de secrets.
  - key: vf-priorite
    format: true-false
    question: Une option de ligne de commande l'emporte en général sur une variable d'environnement.
    truth: true
    answer: 'Ordre usuel : défauts, fichier, environnement, options.'
  - key: qcm-pratiques
    format: multiple-choice
    question: "Laquelle de ces pratiques est à éviter pour la configuration ?"
    choices:
      - {text: "Des appels à `os.Getenv` dans chaque handler, au moment du besoin", correct: true}
      - {text: "Une struct typée, chargée et validée au démarrage", correct: false}
      - {text: "Des valeurs par défaut sensées pour le développement local", correct: false}
      - {text: "Des durées au format de `time.ParseDuration`, comme `30s`", correct: false}
    answer: "Une configuration dispersée dans les handlers est impossible à valider et à tester d'un coup. Une struct typée, validée au démarrage, avec des défauts sensés et des durées explicites, est la bonne pratique."
  - key: qcm-tests
    format: multiple-choice
    question: "Comment tester le chargement de la configuration dans des tests parallèles ?"
    choices:
      - {text: "Injecter une fonction `getenv` alimentée par une map", correct: true}
      - {text: "`t.Setenv` dans chaque test, avec `t.Parallel()`", correct: false}
      - {text: "`os.Setenv`, sans restaurer la valeur à la fin du test", correct: false}
      - {text: "Lire le fichier de configuration de la production", correct: false}
    answer: "`Charger(getenv func(string) string)` reçoit une fausse source dans chaque test, sans toucher au processus. `t.Setenv` convient à un test non parallèle, mais panique avec `t.Parallel()` ; `os.Setenv` sans restauration fuit d'un test à l'autre."
  - key: qcm-secrets
    format: multiple-choice
    question: "Comment fournir les secrets d'un service ?"
    choices:
      - {text: "Par l'environnement ou un gestionnaire de secrets, sans jamais les journaliser", correct: true}
      - {text: "En les embarquant dans le binaire avec `//go:embed`, au moment du build", correct: false}
      - {text: "En options de la ligne de commande, passées au lancement du processus", correct: false}
      - {text: "Dans le `config.yaml` versionné avec le code, à côté des autres réglages", correct: false}
    answer: "Par l'environnement ou un gestionnaire de secrets (Vault, Secret Kubernetes), et jamais dans les journaux. Un secret embarqué se lit dans le binaire, une option de ligne de commande dans `ps`, un fichier versionné dans l'historique Git."
  - key: qcm-validation
    format: multiple-choice
    question: "Un service reçoit un délai de lecture de 30 s et un délai total de 10 s, deux valeurs valides chacune. Que doit faire sa validation ?"
    choices:
      - {text: "Refuser cette combinaison incohérente, avec les autres erreurs", correct: true}
      - {text: "L'accepter : chaque valeur est au bon format", correct: false}
      - {text: "Prendre le plus grand des deux délais pour les deux", correct: false}
      - {text: "La laisser aux composants, qui verront le problème", correct: false}
    answer: "La validation vérifie la présence des valeurs obligatoires, leurs formats et leur cohérence : ici, le délai de lecture dépasse le délai total. `errors.Join` permet de signaler toutes les erreurs d'un coup."
  - key: bug-disperse
    format: bug-fix
    question: |-
      Le service démarre sans `DATABASE_URL` et n'échoue qu'à la première requête. Quelle correction est la bonne ?
      ```go
      func (s *Serveur) lister(w http.ResponseWriter, r *http.Request) {
      	db, err := sql.Open("pgx", os.Getenv("DATABASE_URL"))
      	// ...
      }
      ```
    choices:
      - {text: "Charger et valider la configuration une fois dans `run`, puis la passer aux composants", correct: true}
      - {text: "Appeler `sql.Open` dans un `init()` du package, avec la valeur de `os.Getenv`", correct: false}
      - {text: "Renvoyer une erreur 500 depuis le handler quand la variable est vide", correct: false}
      - {text: "Mettre dans le code une `DATABASE_URL` par défaut, qui pointe vers `localhost`", correct: false}
    answer: |-
      ```go
      func run() error {
      	cfg, err := config.Charger(os.Getenv)
      	if err != nil {
      		return fmt.Errorf("configuration : %w", err) // échec immédiat et explicite
      	}
      	db, err := sql.Open("pgx", cfg.BaseURL)
      	// ...
      }
      ```
      La configuration est chargée et validée une fois au démarrage, puis passée aux composants : le service refuse de démarrer, avec un message clair. Une 500 ou un défaut vers `localhost` cachent l'erreur jusqu'en production.
  - key: bug-unite
    format: bug-fix
    question: |-
      Le délai configuré à « 30 » vaut 30 nanosecondes. Quelle correction est la bonne ?
      ```go
      n, _ := strconv.Atoi(os.Getenv("APP_DELAI"))
      delai := time.Duration(n)
      ```
    choices:
      - {text: "Lire une durée avec son unité par `time.ParseDuration` (`30s`), et renvoyer son erreur", correct: true}
      - {text: "Garder `Atoi` et multiplier par `time.Second`, en ignorant toujours son erreur", correct: false}
      - {text: "Remplacer `Atoi` par `strconv.ParseInt` en base 10, plus sûr pour les grands nombres", correct: false}
      - {text: "Écrire `time.Duration(n * 1000)`, puisque les délais s'expriment en millisecondes", correct: false}
    answer: |-
      ```go
      delai, err := time.ParseDuration(os.Getenv("APP_DELAI")) // "30s", "2m"
      if err != nil {
      	return Config{}, fmt.Errorf("APP_DELAI %q : %w", os.Getenv("APP_DELAI"), err)
      }
      ```
      Une durée avec son unité est explicite et validée, et l'erreur de conversion n'est plus ignorée. Multiplier par `time.Second` fige une unité invisible dans la configuration ; `time.Duration` compte en nanosecondes, pas en millisecondes.
  - key: bug-log-secret
    format: bug-fix
    question: |-
      Le mot de passe de la base apparaît dans les journaux au démarrage. Quelle correction est la bonne ?
      ```go
      log.Info("configuration chargée", "config", cfg)
      ```
    choices:
      - {text: "Un type `Secret` qui se masque dans slog (`LogValue`) et dans fmt (`String`)", correct: true}
      - {text: "Passer le niveau du journal à `Warn`, pour que ce message ne s'écrive plus", correct: false}
      - {text: "Encoder le mot de passe en base64 avant de journaliser la configuration", correct: false}
      - {text: "Journaliser `&cfg` au lieu de `cfg`, pour n'afficher que son adresse", correct: false}
    answer: |-
      ```go
      type Secret string

      func (Secret) LogValue() slog.Value { return slog.StringValue("[masqué]") }
      func (Secret) String() string      { return "[masqué]" }

      type Config struct {
      	Adresse    string
      	MotDePasse Secret
      }
      ```
      Un type dédié aux secrets se masque dans slog (`LogValuer`) et dans fmt (`Stringer`) ; on peut aussi ne journaliser que des champs choisis. base64 n'est pas un chiffrement, et un pointeur vers une struct s'affiche avec tous ses champs.
  - key: bug-vide
    format: bug-fix
    question: |-
      Mettre `APP_CACHE=""` pour désactiver le cache ne marche pas : le défaut « true » reste appliqué. Quelle correction est la bonne ?
      ```go
      if v := os.Getenv("APP_CACHE"); v != "" {
      	cfg.Cache, _ = strconv.ParseBool(v)
      }
      ```
    choices:
      - {text: "`os.LookupEnv`, puis `ParseBool`, dont l'erreur est signalée même pour une valeur vide", correct: true}
      - {text: "Garder `os.Getenv` et écrire `cfg.Cache = v == \"true\"`, sans tester le vide", correct: false}
      - {text: "Mettre le défaut du cache à `false`, pour qu'une valeur vide le désactive", correct: false}
      - {text: "Remplacer `ParseBool` par `Atoi`, et désactiver le cache quand la valeur vaut 0", correct: false}
    answer: |-
      ```go
      if v, ok := os.LookupEnv("APP_CACHE"); ok {
      	b, err := strconv.ParseBool(v)
      	if err != nil {
      		return Config{}, fmt.Errorf("APP_CACHE %q : attendu true ou false", v)
      	}
      	cfg.Cache = b
      }
      ```
      `LookupEnv` distingue la variable absente de la variable fournie ; une valeur invalide, vide comprise, est signalée au lieu d'être ignorée. Changer le défaut, ou comparer à la seule chaîne true, désactiverait le cache même quand la variable est absente.
  - key: scenario-conception
    format: scenario
    question: Comment conçois-tu la configuration d'un service déployé dans Kubernetes ?
    choices:
      - {text: "Une struct typée, chargée de l'environnement (ConfigMap, Secret) et validée au démarrage", correct: true}
      - {text: "Un fichier YAML embarqué dans l'image, avec une image Docker construite par environnement", correct: false}
      - {text: "Des `os.Getenv` là où chaque valeur sert, pour garder la configuration près de son usage", correct: false}
      - {text: "Une table de configuration en base, relue par chaque handler à chaque requête reçue", correct: false}
    answer: "Une struct typée chargée au démarrage depuis l'environnement (ConfigMap pour les réglages, Secret pour les secrets), avec des défauts adaptés au développement local et une validation complète par `errors.Join`, qui fait échouer le démarrage. Les secrets ont un type masqué dans les journaux, et la configuration effective, sans secret, est journalisée au démarrage."
  - key: scenario-chaud
    format: scenario
    question: Faut-il recharger la configuration à chaud ?
    choices:
      - {text: "Rarement : on redémarre le pod, et seuls quelques réglages changent à chaud, de façon atomique", correct: true}
      - {text: "Toujours : un service doit relire sa configuration dès que le fichier change, sans redémarrer", correct: false}
      - {text: "Oui, en modifiant directement les champs de la struct partagée, depuis un endpoint d'administration", correct: false}
      - {text: "Jamais, pas même le niveau de journal : tout changement passe par un nouveau déploiement", correct: false}
    answer: "Rarement : redémarrer le pod avec la nouvelle configuration est plus simple et plus sûr. Les quelques réglages qui doivent changer sans redémarrage (niveau de journal, drapeaux) passent par un `atomic.Pointer` ou un `slog.LevelVar`, avec validation ; modifier une struct partagée sans synchronisation crée une course de données."
  - key: scenario-bibliotheque
    format: scenario
    question: 'Viper, koanf ou une fonction écrite à la main : comment choisis-tu ?'
    choices:
      - {text: "Une fonction `Charger` à la main pour quelques variables ; koanf ou viper pour plusieurs sources", correct: true}
      - {text: "Viper, toujours : c'est le standard de fait, quel que soit le nombre de variables à lire", correct: false}
      - {text: "Une fonction à la main, toujours : une dépendance de configuration n'est jamais justifiée", correct: false}
      - {text: "koanf ou viper dès la première variable, pour profiter d'emblée du rechargement à chaud", correct: false}
    answer: "Pour une douzaine de variables d'environnement, une fonction `Charger` écrite à la main (ou envconfig, qui remplit une struct par ses tags) est la plus lisible et ne tire aucune dépendance. koanf ou viper deviennent intéressants avec plusieurs sources et formats (YAML, profils, rechargement), au prix d'une API plus large ; viper est répandu mais lourd, koanf plus léger."
  - key: scenario-douze-facteurs
    format: scenario
    question: Que dit l'application « douze facteurs » sur la configuration, et comment l'appliques-tu en Go ?
    choices:
      - {text: "Séparer la configuration du code : l'environnement la fournit, et la même image va partout", correct: true}
      - {text: "Écrire une constante par environnement dans le code, choisie au build par un build tag", correct: false}
      - {text: "Construire une image Docker par environnement, avec sa configuration embarquée dedans", correct: false}
      - {text: "Garder la configuration dans un fichier versionné à côté du code, lu au démarrage", correct: false}
    answer: "La configuration qui varie entre environnements (adresses, identifiants, réglages) est séparée du code et fournie par l'environnement. En Go : aucune valeur d'environnement dans le binaire, une struct chargée depuis les variables d'environnement au démarrage, et la même image promue de la préproduction à la production."
