notion: go-face-java
lesson: |-
  Comparer Go à Java est une question d'entretien fréquente, surtout pour un développeur Java. Les différences
  principales :

  | Sujet | Java | Go |
  |---|---|---|
  | modèle objet | classes, héritage, interfaces déclarées (`implements`) | structs, méthodes, composition par incorporation, interfaces **implicites** |
  | erreurs | exceptions (vérifiées ou non) | **valeurs** `error` renvoyées et testées, `panic` pour l'exceptionnel |
  | concurrence | threads (et threads virtuels depuis Java 21), `synchronized`, `java.util.concurrent` | **goroutines** et **channels** intégrés au langage, `sync` |
  | génériques | depuis Java 5, par effacement de type | depuis Go 1.18, contraintes par interfaces |
  | exécution | JVM, JIT, démarrage plus lent, mémoire plus élevée | binaire **natif** statique, démarrage en millisecondes |
  | mémoire | GC générationnels réglables (G1, ZGC) | un GC concurrent à faible latence, deux réglages (GOGC, GOMEMLIMIT) |
  | écosystème | Spring, Jakarta EE, Maven/Gradle, très riche | bibliothèque standard très complète, outillage intégré (fmt, test, vet, modules) |
  | style | frameworks, annotations, injection par conteneur | code explicite, peu de magie, câblage dans main |

  Ce que Go fait mieux : la **simplicité** du langage (peu de concepts), la **compilation rapide**, le **déploiement**
  (un binaire, des images de quelques Mo), la **concurrence** accessible, la **lisibilité** homogène (gofmt).

  Ce que Java fait mieux : l'**écosystème** d'entreprise (Spring, ORM, intégrations), la **maturité** des outils
  (profilage, débogage, IDE), le **JIT** qui peut dépasser Go sur des calculs longs, et un langage plus **expressif**
  (enums riches, types scellés, records, streams).

  **En entretien** : nuancer plutôt que militer. Go convient aux services réseau, aux outils, au cloud natif et aux
  équipes qui veulent un code uniforme ; Java aux grands systèmes d'entreprise et aux équipes qui s'appuient sur son
  écosystème. Un développeur Java apprend Go en quelques semaines, mais doit désapprendre l'héritage, les exceptions et
  les frameworks.
cards:
  - key: choisirais-plutot-java-nouveau-service
    format: scenario
    question: "Pour quel genre de nouveau service choisirais-tu Go plutôt que Java ?"
    choices:
      - {text: "Un service réseau, un proxy ou une CLI à forte concurrence, qui doit démarrer vite", correct: true}
      - {text: "Une application métier complexe, déjà intégrée à l'écosystème Spring", correct: false}
      - {text: "Un traitement long et intensif, où le JIT de Go optimise mieux que celui de Java", correct: false}
      - {text: "Tout nouveau service, puisque Go surpasse Java sur tous les critères", correct: false}
    answer: "Go a des atouts nets pour un service réseau, un proxy, un outil d'infrastructure ou une CLI : binaire statique, démarrage en millisecondes, faible empreinte mémoire, concurrence simple. Java garde l'avantage pour une application métier complexe intégrée à Spring, et ses traitements longs profitent du JIT, que Go n'a pas ; l'équipe compte aussi."
  - key: entreprise-envisage-reecrire-monolithe-java-avis
    format: scenario
    question: "Ton entreprise veut réécrire son monolithe Java en Go pour réduire la mémoire et le temps de démarrage en conteneur. Qu'en penses-tu ?"
    choices:
      - {text: "Java a des réponses moins coûteuses (AOT, natif, threads virtuels) ; Go, pour de nouveaux services", correct: true}
      - {text: "Bonne idée : Go démarre plus vite, donc réécrire tout le monolithe sera vite rentabilisé", correct: false}
      - {text: "Bonne idée, à condition de tout réécrire d'un coup, pour ne pas maintenir deux langages", correct: false}
      - {text: "Mauvaise idée : en conteneur, un service Go consomme plus de mémoire qu'un service Java", correct: false}
    answer: "Java a aujourd'hui des réponses (AOT, images natives, threads virtuels) bien moins coûteuses qu'une réécriture, et si le problème est la complexité du code, changer de langage ne la résout pas. Go devient pertinent pour de nouveaux services aux besoins précis : on en extrait un ou deux et on mesure, plutôt qu'une réécriture complète, l'un des projets les plus risqués qui soient."
  - key: vf-implements
    format: true-false
    question: En Go, un type doit déclarer explicitement les interfaces qu'il implémente, comme avec implements en Java.
    truth: false
    answer: Les interfaces sont satisfaites implicitement.
  - key: vf-exceptions
    format: true-false
    question: Go a un mécanisme d'exceptions vérifiées comme Java.
    truth: false
    answer: Les erreurs sont des valeurs ; panic est réservé à l'exceptionnel.
  - key: vf-demarrage
    format: true-false
    question: Un service Go démarre en général bien plus vite qu'un service Java sur la JVM.
    truth: true
    answer: 'Pas de JVM ni de JIT à chauffer : un binaire natif.'
  - key: vf-heritage
    format: true-false
    question: L'incorporation de struct en Go est un héritage au sens de Java.
    truth: false
    answer: 'C''est une composition : pas de polymorphisme par sous-classe, pas de surcharge de méthodes appelées par le parent.'
  - key: qcm-correspondances
    format: multiple-choice
    question: "Laquelle de ces correspondances entre Java et Go est fausse ?"
    choices:
      - {text: "Les annotations Spring correspondent aux build tags", correct: true}
      - {text: "Les exceptions correspondent aux valeurs `error` renvoyées", correct: false}
      - {text: "Les threads virtuels de Java 21 ressemblent aux goroutines", correct: false}
      - {text: "L'héritage de classes correspond à la composition par incorporation", correct: false}
    answer: "Go n'a pas d'annotations au sens de Java : le câblage est du code, et les build tags choisissent seulement les fichiers compilés. Les autres correspondances tiennent."
  - key: qcm-avantages-go
    format: multiple-choice
    question: "Lequel de ces avantages Go n'a-t-il pas, en général, sur Java ?"
    choices:
      - {text: "Un écosystème d'entreprise plus riche", correct: true}
      - {text: "Un binaire natif et des images Docker minuscules", correct: false}
      - {text: "Une compilation très rapide", correct: false}
      - {text: "Un langage avec peu de concepts, lu de la même façon par tous", correct: false}
    answer: "L'écosystème d'entreprise (Spring, Hibernate, intégrations) reste un point fort de Java. Le binaire natif, la compilation rapide et le petit langage sont de vrais avantages de Go."
  - key: qcm-avantages-java
    format: multiple-choice
    question: "Lesquels de ces avantages Java a-t-il, en général, sur Go ?"
    choices:
      - text: Un écosystème de frameworks d'entreprise très mature
        correct: true
      - text: Un JIT qui optimise les calculs longs à l'exécution
        correct: true
      - text: Un langage plus expressif (enums riches, types scellés, streams)
        correct: true
      - text: Un démarrage plus rapide
        correct: false
    answer: Le démarrage est un avantage de Go (sauf images natives GraalVM).
  - key: qcm-desapprendre
    format: multiple-choice
    question: "Laquelle de ces habitudes un développeur Java qui passe à Go doit-il garder ?"
    choices:
      - {text: "L'écriture de tests", correct: true}
      - {text: "Les hiérarchies de classes et l'héritage", correct: false}
      - {text: "Le contrôle du flot par exceptions", correct: false}
      - {text: "Les interfaces déclarées d'avance chez le fournisseur", correct: false}
    answer: "Les tests restent centraux, avec le package `testing`. Il faut désapprendre l'héritage (composition), les exceptions (valeurs `error`) et les interfaces déclarées d'avance : en Go, c'est le consommateur qui déclare la petite interface dont il a besoin."
  - key: scenario-reecriture
    format: scenario
    question: "Ton entreprise envisage de réécrire un monolithe Java en Go. Comment conseilles-tu de s'y prendre ?"
    choices:
      - {text: "Mesurer le problème, puis extraire en Go les services qui y gagnent, pas à pas (étrangleur)", correct: true}
      - {text: "Tout réécrire en Go d'un coup sur une branche, puis basculer la production en un week-end", correct: false}
      - {text: "Traduire le code Java en Go automatiquement, classe par classe, puis corriger ce qui casse", correct: false}
      - {text: "Geler les évolutions du monolithe pendant un an, le temps de tout réécrire en Go", correct: false}
    answer: "Une réécriture complète est risquée et coûteuse, quel que soit le langage. Je mesure d'abord le problème (coût d'infrastructure, démarrage, recrutement), puis j'écris en Go les nouveaux services ou ceux qui en tirent un vrai bénéfice, en les extrayant progressivement du monolithe (motif « étrangleur ») ; le reste peut rester en Java tant qu'il fonctionne."
  - key: scenario-erreurs
    format: scenario
    question: Comment expliques-tu à un développeur Java la gestion des erreurs en Go ?
    choices:
      - {text: "Une `error` en dernier résultat, testée aussitôt, enveloppée par `%w` et inspectée par `errors.Is`", correct: true}
      - {text: "`panic` joue le rôle de `throw` et `recover` celui de `catch`, pour toutes les erreurs", correct: false}
      - {text: "Les erreurs sont des exceptions vérifiées, que le compilateur oblige à déclarer", correct: false}
      - {text: "Une `error` renvoyée, qu'on peut ignorer sans risque : le runtime la journalise", correct: false}
    answer: "Une fonction qui peut échouer renvoie une `error` en dernier résultat, que l'appelant teste aussitôt : le chemin d'erreur est visible, sans saut caché vers un `catch`. On l'enveloppe avec du contexte (`fmt.Errorf(\"...: %w\", err)`) et on l'inspecte avec `errors.Is` et `errors.As` ; `panic` reste pour les erreurs de programmation."
  - key: scenario-concurrence
    format: scenario
    question: "Comment compares-tu la concurrence en Go et en Java moderne ?"
    choices:
      - {text: "Go l'a intégrée dès le départ (goroutines, channels) ; Java 21 rattrape avec les threads virtuels", correct: true}
      - {text: "Go n'a que des threads système, alors que Java a des threads légers depuis ses débuts", correct: false}
      - {text: "Java 21 a repris les channels de Go, mais il n'a toujours pas de threads légers", correct: false}
      - {text: "Les goroutines sont des coroutines sans parallélisme, contrairement aux threads Java", correct: false}
    answer: "Go a intégré dès le départ des goroutines légères, ordonnancées par le runtime, et des channels ; toute sa bibliothèque bloque sans gâcher de thread. Java 21 rattrape avec les threads virtuels et la concurrence structurée, en gardant `java.util.concurrent`, très riche : Go reste plus simple et homogène, Java offre plus d'outils prêts à l'emploi."
  - key: scenario-choix
    format: scenario
    question: "Dans quel cas garderais-tu Java plutôt que Go pour un nouveau service ?"
    choices:
      - {text: "Si l'équipe y est experte, si le domaine s'appuie sur Spring ou partage du code Java existant", correct: true}
      - {text: "Si le service doit démarrer en quelques millisecondes, pour l'autoscaling ou le serverless", correct: false}
      - {text: "Si l'on veut des images Docker minuscules, une exploitation simple et peu de dépendances", correct: false}
      - {text: "Si le service a beaucoup de concurrence, que Java gère plus simplement que Go", correct: false}
    answer: "Je garderais Java si l'équipe y est experte, si le domaine s'appuie sur l'écosystème Spring ou des intégrations d'entreprise, ou si le service doit partager beaucoup de code Java. Go l'emporte quand comptent le démarrage rapide, la faible empreinte mémoire, des images légères et un code uniforme."
  - key: objet
    format: course
    question: Comment Go remplace-t-il l'héritage de classes de Java ?
    choices:
      - {text: "Par la composition (incorporation de types) et des interfaces implicites", correct: true}
      - {text: "Par des classes abstraites, déclarées avec le mot-clé `abstract`", correct: false}
      - {text: "Par l'incorporation, qui redéfinit les méthodes et donne accès à `super`", correct: false}
      - {text: "Par les génériques, qui remplacent les hiérarchies de classes", correct: false}
    answer: "Par la composition : une struct incorpore d'autres types pour réutiliser leurs champs et méthodes, et le polymorphisme passe par des interfaces implicites. L'incorporation n'est pas de l'héritage : il n'y a ni `super` ni appel virtuel vers le type englobant."
  - key: generiques
    format: course
    question: "Quelle différence y a-t-il entre les génériques de Java et ceux de Go ?"
    choices:
      - {text: "Java efface les types et emballe les primitifs ; Go contraint par des interfaces, sans emballage", correct: true}
      - {text: "Go efface les types à la compilation, comme Java, mais il accepte les types de base", correct: false}
      - {text: "Java vérifie les types génériques à l'exécution, Go seulement par ses tests", correct: false}
      - {text: "Go n'accepte que des interfaces comme arguments de type, jamais un `int`", correct: false}
    answer: "Java efface les types à la compilation (pas de génériques sur les primitifs sans emballage) ; Go, depuis 1.18, contraint les paramètres par des interfaces (comme `~int | ~float64`) et compile des versions adaptées, sans emballage des types de base."
  - key: deploiement
    format: course
    question: Qu'est-ce qui change au déploiement entre un service Java et un service Go ?
    choices:
      - {text: "Java demande une JVM, un réglage mémoire et une chauffe du JIT ; Go, un binaire statique", correct: true}
      - {text: "Go demande un runtime à installer à part, comme la JVM, mais en plus léger", correct: false}
      - {text: "Java produit un binaire natif par défaut ; Go, un bytecode portable entre systèmes", correct: false}
      - {text: "Rien : les deux livrent une image de même taille, qui démarre aussi vite", correct: false}
    answer: "Java a besoin d'une JVM, d'un réglage de la mémoire et d'un temps de chauffe du JIT ; Go produit un binaire statique de quelques Mo, runtime compris, qui démarre en millisecondes dans une image minimale."
  - key: outillage
    format: course
    question: Quel outillage fourni par Go remplace ce qu'on trouve dans Maven ou Gradle et leurs plugins ?
    choices:
      - {text: "La commande `go` elle-même : modules, build, tests, formatage, analyse, documentation", correct: true}
      - {text: "Un fichier `build.go`, qui décrit les étapes du build comme un `pom.xml`", correct: false}
      - {text: "Bazel, obligatoire dès qu'un projet Go compte plus d'un package", correct: false}
      - {text: "`make`, l'outil de build officiel, avec un `Makefile` dans chaque package", correct: false}
    answer: "La commande `go` elle-même : modules et dépendances (`go mod`), build, tests et benchmarks (`go test`), formatage (`gofmt`), analyse (`go vet`), documentation (`go doc`), profilage (`pprof`), sans fichier de build à écrire."
