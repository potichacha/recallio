notion: go-face-java
lesson: |-
  Comparer Go à Java est une question d'entretien fréquente, surtout pour un développeur Java. Les différences
  principales :

  | Sujet | Java | Go |
  |---|---|---|
  | modèle objet | classes, héritage, interfaces déclarées (`implements`) | structs, méthodes, composition par incorporation, interfaces **implicites** |
  | erreurs | exceptions (vérifiées ou non) | **valeurs** `error` renvoyées et testées, `panic` pour l'exceptionnel |
  | concurrence | threads (et threads virtuels depuis Java 21), `synchronized`, `java.util.concurrent` | **goroutines** et **channels** intégrés au langage, `sync` |
  | génériques | depuis Java 5, par effacement de type | depuis Go 1.18, contraintes par interfaces |
  | exécution | JVM, JIT, démarrage plus lent, mémoire plus élevée | binaire **natif** statique, démarrage en millisecondes |
  | mémoire | GC générationnels réglables (G1, ZGC) | un GC concurrent à faible latence, deux réglages (GOGC, GOMEMLIMIT) |
  | écosystème | Spring, Jakarta EE, Maven/Gradle, très riche | bibliothèque standard très complète, outillage intégré (fmt, test, vet, modules) |
  | style | frameworks, annotations, injection par conteneur | code explicite, peu de magie, câblage dans main |

  Ce que Go fait mieux : la **simplicité** du langage (peu de concepts), la **compilation rapide**, le **déploiement**
  (un binaire, des images de quelques Mo), la **concurrence** accessible, la **lisibilité** homogène (gofmt).

  Ce que Java fait mieux : l'**écosystème** d'entreprise (Spring, ORM, intégrations), la **maturité** des outils
  (profilage, débogage, IDE), le **JIT** qui peut dépasser Go sur des calculs longs, et un langage plus **expressif**
  (enums riches, types scellés, records, streams).

  **En entretien** : nuancer plutôt que militer. Go convient aux services réseau, aux outils, au cloud natif et aux
  équipes qui veulent un code uniforme ; Java aux grands systèmes d'entreprise et aux équipes qui s'appuient sur son
  écosystème. Un développeur Java apprend Go en quelques semaines, mais doit désapprendre l'héritage, les exceptions et
  les frameworks.
cards:
  - key: choisirais-plutot-java-nouveau-service
    format: scenario
    question: Pourquoi choisirais-tu Go plutôt que Java pour un nouveau service ?
    answer: |-
      Go a des atouts nets pour certains services : un **binaire statique** sans runtime à installer, un démarrage en millisecondes et une empreinte mémoire faible (intéressant en conteneurs et pour l'autoscaling), une **concurrence** très simple à écrire avec les goroutines, une compilation rapide et un langage petit qu'une équipe maîtrise vite.
      Java garde l'avantage sur un écosystème d'entreprise plus riche (Spring, Hibernate, intégration), des performances de pointe sur des traitements longs grâce au JIT, et un modèle objet plus adapté à un domaine métier très riche.
      Je choisirais Go pour un service réseau, un proxy, un outil d'infrastructure, une CLI ou un microservice à forte concurrence ; je resterais en Java pour une application métier complexe déjà intégrée à l'écosystème Spring. Et je tiendrais compte de l'équipe : la meilleure techno est celle que l'équipe saura maintenir.
  - key: entreprise-envisage-reecrire-monolithe-java-avis
    format: scenario
    question: Ton entreprise envisage de réécrire un monolithe Java en Go. Ton avis ?
    answer: |-
      Je demanderais d'abord quel problème on veut résoudre. Si ce sont la mémoire et le démarrage en conteneur, Java a aujourd'hui des réponses (AOT, natif, virtual threads) bien moins coûteuses qu'une réécriture. Si c'est la complexité du code, une réécriture dans un autre langage ne résout rien : c'est l'architecture qu'il faut revoir.
      Go devient pertinent pour de **nouveaux** services aux besoins précis (proxy, passerelle, traitement réseau à forte concurrence, outils d'infrastructure, CLI) ou si l'équipe a déjà la compétence. Je proposerais d'extraire progressivement un ou deux services bien délimités en Go et de mesurer, plutôt qu'une réécriture complète, qui est l'un des projets les plus risqués qui soient.
  - key: vf-implements
    format: true-false
    question: En Go, un type doit déclarer explicitement les interfaces qu'il implémente, comme avec implements en Java.
    truth: false
    answer: Les interfaces sont satisfaites implicitement.
  - key: vf-exceptions
    format: true-false
    question: Go a un mécanisme d'exceptions vérifiées comme Java.
    truth: false
    answer: Les erreurs sont des valeurs ; panic est réservé à l'exceptionnel.
  - key: vf-demarrage
    format: true-false
    question: Un service Go démarre en général bien plus vite qu'un service Java sur la JVM.
    truth: true
    answer: 'Pas de JVM ni de JIT à chauffer : un binaire natif.'
  - key: vf-heritage
    format: true-false
    question: L'incorporation de struct en Go est un héritage au sens de Java.
    truth: false
    answer: 'C''est une composition : pas de polymorphisme par sous-classe, pas de surcharge de méthodes appelées par le parent.'
  - key: qcm-correspondances
    format: multiple-choice
    question: Quelles correspondances entre Java et Go sont justes ?
    choices:
      - text: Les exceptions correspondent aux valeurs error renvoyées
        correct: true
      - text: Les threads virtuels de Java 21 ressemblent aux goroutines
        correct: true
      - text: L'héritage de classes correspond à la composition par incorporation
        correct: true
      - text: Les annotations Spring correspondent aux build tags
        correct: false
    answer: Go n'a pas d'annotations au sens de Java ; le câblage est du code.
  - key: qcm-avantages-go
    format: multiple-choice
    question: Quels avantages Go a-t-il en général sur Java ?
    choices:
      - text: Un binaire natif et des images Docker minuscules
        correct: true
      - text: Une compilation très rapide
        correct: true
      - text: Un langage avec peu de concepts, lu de la même façon par tous
        correct: true
      - text: Un écosystème d'entreprise plus riche
        correct: false
    answer: L'écosystème d'entreprise reste un point fort de Java.
  - key: qcm-avantages-java
    format: multiple-choice
    question: Quels avantages Java a-t-il en général sur Go ?
    choices:
      - text: Un écosystème de frameworks d'entreprise très mature
        correct: true
      - text: Un JIT qui optimise les calculs longs à l'exécution
        correct: true
      - text: Un langage plus expressif (enums riches, types scellés, streams)
        correct: true
      - text: Un démarrage plus rapide
        correct: false
    answer: Le démarrage est un avantage de Go (sauf images natives GraalVM).
  - key: qcm-desapprendre
    format: multiple-choice
    question: Que doit désapprendre un développeur Java qui passe à Go ?
    choices:
      - text: Les hiérarchies de classes et l'héritage
        correct: true
      - text: Le contrôle par exceptions
        correct: true
      - text: Les interfaces déclarées d'avance chez le fournisseur
        correct: true
      - text: L'écriture de tests
        correct: false
    answer: Les tests restent centraux, avec le package testing.
  - key: scenario-reecriture
    format: scenario
    question: Ton entreprise envisage de réécrire un monolithe Java en Go. Que conseilles-tu ?
    answer: |-
      Une réécriture complète est risquée et coûteuse, quel que soit le langage. Je proposerais d'abord de mesurer le
      problème à résoudre (coût d'infrastructure, temps de démarrage, difficulté à recruter), puis d'écrire en Go les
      nouveaux services ou ceux qui en tirent un vrai bénéfice (passerelles, services réseau à fort trafic, outils), en
      extrayant progressivement du monolithe (motif « étrangleur »). Le reste peut rester en Java tant qu'il fonctionne.
  - key: scenario-erreurs
    format: scenario
    question: Comment expliques-tu à un développeur Java la gestion des erreurs en Go ?
    answer: |-
      Une fonction qui peut échouer renvoie une valeur error en dernier résultat, que l'appelant teste aussitôt : le chemin
      d'erreur est visible dans le code, sans saut caché vers un catch lointain. On enveloppe l'erreur avec du contexte
      (`fmt.Errorf("...: %w", err)`) et on l'inspecte avec errors.Is et errors.As, l'équivalent des types d'exceptions.
      panic existe, mais pour les erreurs de programmation, pas pour le contrôle normal.
  - key: scenario-concurrence
    format: scenario
    question: Compare la concurrence en Go et en Java moderne.
    answer: |-
      Go a intégré dès le départ des goroutines légères, ordonnancées par le runtime, et des channels pour communiquer ;
      toute la bibliothèque est écrite pour bloquer sans gâcher de thread. Java 21 rattrape avec les threads virtuels et la
      concurrence structurée, en gardant java.util.concurrent, très riche (CompletableFuture, files concurrentes). Go reste
      plus simple et homogène ; Java offre plus d'outils prêts à l'emploi et un écosystème qui s'adapte progressivement.
  - key: scenario-choix
    format: scenario
    question: Pourquoi choisirais-tu Go plutôt que Java pour un nouveau service ?
    answer: |-
      Pour un service réseau ou cloud natif où comptent le démarrage rapide (autoscaling, serverless), la faible empreinte
      mémoire, des images légères et une exploitation simple ; pour une équipe qui veut un code uniforme et peu de
      dépendances. Je garderais Java si l'équipe y est experte, si le domaine s'appuie sur l'écosystème Spring ou des
      intégrations d'entreprise, ou si le service doit partager beaucoup de code Java existant.
  - key: objet
    format: course
    question: Comment Go remplace-t-il l'héritage de classes de Java ?
    answer: 'Par la composition : une struct incorpore d''autres types pour réutiliser leurs champs et méthodes, et le polymorphisme passe par des interfaces implicites, sans hiérarchie de classes.'
  - key: generiques
    format: course
    question: Quelle différence entre les génériques de Java et ceux de Go ?
    answer: Java efface les types à la compilation (pas de génériques sur les primitifs sans emballage) ; Go, depuis 1.18, contraint les paramètres par des interfaces (comme ~int | ~float64) et compile des versions adaptées, sans emballage des types de base.
  - key: deploiement
    format: course
    question: Qu'est-ce qui change au déploiement entre un service Java et un service Go ?
    answer: Java a besoin d'une JVM, d'un réglage de la mémoire et d'un temps de chauffe du JIT ; Go produit un binaire statique de quelques Mo, qui démarre en millisecondes dans une image minimale.
  - key: outillage
    format: course
    question: Quel outillage fourni par Go remplace ce qu'on trouve dans Maven ou Gradle et leurs plugins ?
    answer: 'La commande go elle-même : modules et dépendances (go mod), build, tests et benchmarks (go test), formatage (gofmt), analyse (go vet), documentation (go doc), profilage (pprof), sans fichier de build à écrire.'
