notion: organisation-projet
cards:
  - key: compilateur-refuse-cycle-import-order-customer
    format: scenario
    question: Le compilateur refuse un cycle d'import entre `order` et `customer`.
    answer: |-
      C'est souvent le signe qu'une dépendance est déclarée au mauvais endroit. Si `order` a seulement besoin de lire quelques informations client, je déclarerais dans `order` une petite interface (`ClientLookup`) implémentée par `customer`, et c'est le `main` qui branche les deux : `order` ne dépend plus de `customer`.
      Si les deux partagent un concept (un type `Address`), je l'extrairais dans un petit package commun nommé selon ce concept. Et si les deux packages sont si imbriqués qu'on n'arrive pas à les séparer, c'est peut-être qu'ils forment un seul module métier qui devrait être un seul package.
  - key: existe-structure-projet-officielle
    format: course
    question: Existe-t-il une structure de projet officielle en Go ?
    answer: Non, mais un guide officiel (Organizing a Go module) recommande de commencer simple ; project-layout n'est pas un standard officiel.
  - key: sert-cmd
    format: course
    question: À quoi sert cmd/ ?
    answer: À contenir un répertoire par binaire, avec un main mince.
  - key: toujours-dossier-pkg
    format: course
    question: Faut-il toujours un dossier pkg/ ?
    answer: Non, seulement pour du code destiné à être importé par d'autres modules.
  - key: organisation-couche-domaine
    format: course
    question: Organisation par couche ou par domaine ?
    answer: Par domaine (order, billing) plutôt que models/controllers, qui couplent tout.
  - key: pattern-run
    format: course
    question: C'est quoi le pattern run ?
    answer: Un main minimal qui appelle run(ctx, dépendances) et gère le code de sortie, ce qui rend le programme testable.
  - key: eviter-log-fatal-main
    format: course
    question: Pourquoi éviter log.Fatal dans main ?
    answer: Il appelle os.Exit et empêche l'exécution des defer (fermetures, flush).
