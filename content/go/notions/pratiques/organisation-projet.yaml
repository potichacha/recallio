notion: organisation-projet
lesson: |-
  Il n'existe **pas** de structure de projet officielle ; quelques conventions sont largement partagées :

  ```
  boutique/
  ├── go.mod
  ├── cmd/
  │   ├── api/main.go          # un dossier par binaire, main court
  │   └── migrer/main.go
  ├── internal/                # le code privé du module
  │   ├── commande/            # par domaine : modèle, service, dépôt
  │   ├── paiement/
  │   └── plateforme/          # transverse : base, journal, config
  ├── migrations/
  └── README.md
  ```

  Les principes :
  - **`cmd/<nom>/`** pour chaque binaire, avec un `main.go` court qui assemble et lance (souvent `func run() error`,
    appelé par main qui gère le code de sortie) ;
  - **`internal/`** pour tout ce qui ne doit pas être importé hors du module : le compilateur l'interdit ;
  - organiser **par domaine** (`commande`, `paiement`), pas par couche technique (`models`, `controllers`,
    `services`) : un package regroupe ce qui change ensemble ;
  - **pas de `pkg/` par réflexe** : il n'apporte rien sauf à séparer explicitement le code public d'un gros dépôt ;
  - commencer **simple** : un petit outil tient dans un seul package `main` ; on découpe quand le besoin apparaît ;
  - pas de **cycle** d'import : s'il apparaît, c'est souvent qu'un concept doit sortir dans un package commun, ou qu'une
    interface doit être définie chez l'utilisateur.

  Le dépôt « golang-standards/project-layout » n'est **pas** un standard officiel, et l'équipe Go le rappelle ; la page
  officielle « Organizing a Go module » (go.dev) donne des recommandations plus simples.

  **En entretien** : « Pas de structure officielle ; cmd/ par binaire, internal/ pour le privé, des packages par
  domaine ; pas de pkg/ par réflexe ; commencer simple ; casser les cycles en déplaçant un concept ou une interface. »
cards:
  - key: compilateur-refuse-cycle-import-order-customer
    format: scenario
    question: Le compilateur refuse un cycle d'import entre `order` et `customer`.
    answer: |-
      C'est souvent le signe qu'une dépendance est déclarée au mauvais endroit. Si `order` a seulement besoin de lire quelques informations client, je déclarerais dans `order` une petite interface (`ClientLookup`) implémentée par `customer`, et c'est le `main` qui branche les deux : `order` ne dépend plus de `customer`.
      Si les deux partagent un concept (un type `Address`), je l'extrairais dans un petit package commun nommé selon ce concept. Et si les deux packages sont si imbriqués qu'on n'arrive pas à les séparer, c'est peut-être qu'ils forment un seul module métier qui devrait être un seul package.
  - key: existe-structure-projet-officielle
    format: course
    question: Existe-t-il une structure de projet officielle en Go ?
    answer: Non, mais un guide officiel (Organizing a Go module) recommande de commencer simple ; project-layout n'est pas un standard officiel.
  - key: sert-cmd
    format: course
    question: À quoi sert cmd/ ?
    answer: À contenir un répertoire par binaire, avec un main mince.
  - key: toujours-dossier-pkg
    format: course
    question: Faut-il toujours un dossier pkg/ ?
    answer: Non, seulement pour du code destiné à être importé par d'autres modules.
  - key: organisation-couche-domaine
    format: course
    question: Organisation par couche ou par domaine ?
    answer: Par domaine (order, billing) plutôt que models/controllers, qui couplent tout.
  - key: pattern-run
    format: course
    question: C'est quoi le pattern run ?
    answer: Un main minimal qui appelle run(ctx, dépendances) et gère le code de sortie, ce qui rend le programme testable.
  - key: eviter-log-fatal-main
    format: course
    question: Pourquoi éviter log.Fatal dans main ?
    answer: Il appelle os.Exit et empêche l'exécution des defer (fermetures, flush).
  - key: vf-officiel
    format: true-false
    question: Le dépôt golang-standards/project-layout est la structure officielle des projets Go.
    truth: false
    answer: Ce n'est pas un standard officiel ; go.dev propose « Organizing a Go module ».
  - key: vf-cmd
    format: true-false
    question: Le dossier cmd/ contient un sous-dossier par binaire, avec un package main.
    truth: true
    answer: Par exemple cmd/api et cmd/migrer.
  - key: vf-couches
    format: true-false
    question: Organiser par couches techniques (models, controllers, services) est la pratique recommandée en Go.
    truth: false
    answer: On organise plutôt par domaine.
  - key: vf-pkg
    format: true-false
    question: Un projet Go doit toujours avoir un dossier pkg/.
    truth: false
    answer: Il n'apporte rien par défaut.
  - key: qcm-structure
    format: multiple-choice
    question: Quels éléments d'organisation sont recommandés ?
    choices:
      - text: cmd/ avec un dossier par binaire
        correct: true
      - text: internal/ pour le code privé du module
        correct: true
      - text: Des packages par domaine métier
        correct: true
      - text: Un package models avec toutes les structs du projet
        correct: false
    answer: Un package models fourre-tout crée des dépendances partout.
  - key: qcm-cycle
    format: multiple-choice
    question: Les packages commande et client s'importent mutuellement. Que faire ?
    choices:
      - text: Définir dans commande une petite interface de ce dont il a besoin chez client
        correct: true
      - text: Déplacer le concept partagé dans un troisième package
        correct: true
      - text: Fusionner les deux packages s'ils changent toujours ensemble
        correct: true
      - text: Utiliser un import avec un alias pour contourner le cycle
        correct: false
    answer: Un alias ne supprime pas le cycle, que le compilateur refuse.
  - key: qcm-main
    format: multiple-choice
    question: Que doit faire le main d'un service ?
    choices:
      - text: Lire la configuration et assembler les dépendances
        correct: true
      - text: Appeler run() et transformer son erreur en code de sortie
        correct: true
      - text: Contenir la logique métier
        correct: false
      - text: Définir les handlers HTTP
        correct: false
    answer: main reste court ; le reste se teste dans des packages.
  - key: qcm-debut
    format: multiple-choice
    question: Comment organiser un petit outil de 300 lignes ?
    choices:
      - text: Un seul package main, éventuellement en plusieurs fichiers
        correct: true
      - text: Découper quand un vrai besoin apparaît
        correct: true
      - text: Une arborescence complète cmd/internal/pkg dès le départ
        correct: false
      - text: Un package par fichier
        correct: false
    answer: La structure suit la taille du projet.
  - key: scenario-service
    format: scenario
    question: Quelle structure proposes-tu pour un nouveau service web Go de taille moyenne ?
    answer: |-
      `cmd/api/main.go` court (configuration, assemblage, run), `internal/` avec un package par domaine (`commande`,
      `client`, `paiement`), chacun avec son modèle, son service et son dépôt, un package `internal/http` (ou
      `internal/api`) pour les handlers et le routeur, `internal/plateforme` pour la base, le journal et la configuration,
      `migrations/` à la racine. Pas de pkg/. La structure évolue avec le projet.
  - key: scenario-couches
    format: scenario
    question: Un projet repris est organisé en packages models, controllers, services et repositories. Quels problèmes cela pose-t-il ?
    answer: |-
      Chaque fonctionnalité est éparpillée dans quatre packages, qui dépendent tous les uns des autres : un changement
      touche partout, les cycles d'import menacent, et tout est exporté pour traverser les couches. Je migrerais
      progressivement vers des packages par domaine, en commençant par le plus autonome, chacun contenant ses couches et
      n'exportant que son API.
  - key: scenario-monorepo
    format: scenario
    question: Comment organises-tu un dépôt qui contient une API, un worker et un outil d'administration ?
    answer: |-
      Un seul module, avec `cmd/api`, `cmd/worker` et `cmd/admin`, qui partagent les packages de `internal/` (domaines,
      accès aux données, plateforme). Chaque binaire a son main court et son Dockerfile ou sa cible de build. Je ne crée
      des modules séparés que si les cycles de livraison ou les équipes divergent vraiment.
