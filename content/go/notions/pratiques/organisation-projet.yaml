notion: organisation-projet
lesson: |-
  Il n'existe **pas** de structure de projet officielle ; quelques conventions sont largement partagées :

  ```
  boutique/
  ├── go.mod
  ├── cmd/
  │   ├── api/main.go          # un dossier par binaire, main court
  │   └── migrer/main.go
  ├── internal/                # le code privé du module
  │   ├── commande/            # par domaine : modèle, service, dépôt
  │   ├── paiement/
  │   └── plateforme/          # transverse : base, journal, config
  ├── migrations/
  └── README.md
  ```

  Les principes :
  - **`cmd/<nom>/`** pour chaque binaire, avec un `main.go` court qui assemble et lance (souvent `func run() error`,
    appelé par main qui gère le code de sortie) ;
  - **`internal/`** pour tout ce qui ne doit pas être importé hors du module : le compilateur l'interdit ;
  - organiser **par domaine** (`commande`, `paiement`), pas par couche technique (`models`, `controllers`,
    `services`) : un package regroupe ce qui change ensemble ;
  - **pas de `pkg/` par réflexe** : il n'apporte rien sauf à séparer explicitement le code public d'un gros dépôt ;
  - commencer **simple** : un petit outil tient dans un seul package `main` ; on découpe quand le besoin apparaît ;
  - pas de **cycle** d'import : s'il apparaît, c'est souvent qu'un concept doit sortir dans un package commun, ou qu'une
    interface doit être définie chez l'utilisateur.

  Le dépôt « golang-standards/project-layout » n'est **pas** un standard officiel, et l'équipe Go le rappelle ; la page
  officielle « Organizing a Go module » (go.dev) donne des recommandations plus simples.

  **En entretien** : « Pas de structure officielle ; cmd/ par binaire, internal/ pour le privé, des packages par
  domaine ; pas de pkg/ par réflexe ; commencer simple ; casser les cycles en déplaçant un concept ou une interface. »
cards:
  - key: compilateur-refuse-cycle-import-order-customer
    format: scenario
    question: "Le compilateur refuse un cycle d'import entre `order` et `customer`. Que fais-tu ?"
    choices:
      - {text: "Je déclare dans `order` une petite interface implémentée par `customer`, et `main` les branche", correct: true}
      - {text: "J'importe `customer` sous un alias dans `order`, pour que le compilateur ne voie plus le cycle", correct: false}
      - {text: "Je déplace tout le code des deux packages dans `main`, où les cycles ne comptent pas", correct: false}
      - {text: "J'utilise un import `_` dans l'un des deux packages, qui casse le cycle à l'initialisation", correct: false}
    answer: "Le cycle signale une dépendance mal placée. Si `order` n'a besoin que de lire quelques informations client, il déclare une petite interface (`ClientLookup`) implémentée par `customer`, et `main` branche les deux ; un concept partagé (`Address`) va dans un petit package à lui, et deux packages inséparables n'en font peut-être qu'un. Un alias ne supprime pas le cycle."
  - key: existe-structure-projet-officielle
    format: course
    question: Existe-t-il une structure de projet officielle en Go ?
    choices:
      - {text: "Non : le guide officiel « Organizing a Go module » conseille de commencer simple", correct: true}
      - {text: "Oui : golang-standards/project-layout, imposé par l'équipe de Go", correct: false}
      - {text: "Oui : `go mod init` crée l'arborescence `cmd/`, `pkg/` et `internal/`", correct: false}
      - {text: "Non, et aucun guide n'en parle : chaque équipe invente la sienne", correct: false}
    answer: "Non : le guide officiel « Organizing a Go module » recommande de commencer simple et de découper selon le besoin. golang-standards/project-layout n'est pas un standard officiel, et `go mod init` ne crée que le `go.mod`."
  - key: sert-cmd
    format: course
    question: "À quoi sert le répertoire `cmd/` d'un module ?"
    choices:
      - {text: "À contenir un répertoire par binaire, chacun avec un `main` mince", correct: true}
      - {text: "À ranger les scripts shell de build et de déploiement du projet", correct: false}
      - {text: "À contenir le code partagé entre plusieurs modules du dépôt", correct: false}
      - {text: "À déclarer les sous-commandes d'une CLI, que lit `go run`", correct: false}
    answer: "Un répertoire par binaire (`cmd/api`, `cmd/worker`), chacun avec un `main` mince qui assemble et lance ; le code réutilisable vit ailleurs, souvent dans `internal/`."
  - key: toujours-dossier-pkg
    format: course
    question: "Faut-il toujours un dossier `pkg/` ?"
    choices:
      - {text: "Non, seulement pour du code destiné à être importé par d'autres modules", correct: true}
      - {text: "Oui : `go build` ne compile que les packages placés sous `pkg/`", correct: false}
      - {text: "Oui : c'est le seul endroit d'où un package peut être importé", correct: false}
      - {text: "Non : le dossier `pkg/` est interdit depuis l'arrivée des modules", correct: false}
    answer: "Non : c'est une convention, utile seulement pour signaler du code destiné à d'autres modules, et beaucoup de projets s'en passent. Pour le code privé, `internal/` est protégé par le compilateur."
  - key: organisation-couche-domaine
    format: course
    question: "Faut-il organiser les packages par couche ou par domaine ?"
    choices:
      - {text: "Par domaine (`commande`, `facturation`), plutôt que `models` et `controllers`, qui couplent tout", correct: true}
      - {text: "Par couche (`models`, `controllers`, `services`), comme le veut la convention de Go", correct: false}
      - {text: "Par sorte de déclaration : un package pour les structs, un pour les interfaces", correct: false}
      - {text: "Un seul package pour tout le projet, que le compilateur traite plus vite", correct: false}
    answer: "Par domaine (`commande`, `facturation`) : chaque package regroupe une fonctionnalité et n'exporte que son API. Des packages par couche éparpillent chaque fonctionnalité et dépendent tous les uns des autres."
  - key: pattern-run
    format: course
    question: "Qu'est-ce que le motif `run` pour le `main` d'un programme ?"
    choices:
      - {text: "Un `main` minimal qui appelle `run(ctx, ...)` et transforme son erreur en code de sortie", correct: true}
      - {text: "Une goroutine lancée par `main`, qui tourne jusqu'à l'arrêt du programme", correct: false}
      - {text: "La commande `go run`, qui compile et lance le programme en une seule étape", correct: false}
      - {text: "Une fonction `init` qui démarre le service avant même l'appel à `main`", correct: false}
    answer: "`main` appelle `run(ctx, args, stdout, getenv)`, qui renvoie une erreur, et la transforme en code de sortie. `run` se teste comme une fonction ordinaire, et ses `defer` s'exécutent bien."
  - key: eviter-log-fatal-main
    format: course
    question: "Pourquoi éviter `log.Fatal` dans `main` ?"
    choices:
      - {text: "Il appelle `os.Exit`, et les `defer` (fermetures, vidage des tampons) ne s'exécutent pas", correct: true}
      - {text: "Il panique, et toute la trace de la pile s'affiche dans les journaux du service", correct: false}
      - {text: "Il écrit sur la sortie standard au lieu de la sortie d'erreur du processus", correct: false}
      - {text: "Il est déprécié depuis l'arrivée de `log/slog` dans la bibliothèque standard", correct: false}
    answer: "`log.Fatal` journalise puis appelle `os.Exit(1)` : les `defer` sont sautés (fermeture de la base, vidage des tampons). On renvoie plutôt l'erreur depuis `run`, et `main` choisit le code de sortie."
  - key: vf-officiel
    format: true-false
    question: Le dépôt golang-standards/project-layout est la structure officielle des projets Go.
    truth: false
    answer: Ce n'est pas un standard officiel ; go.dev propose « Organizing a Go module ».
  - key: vf-cmd
    format: true-false
    question: Le dossier cmd/ contient un sous-dossier par binaire, avec un package main.
    truth: true
    answer: Par exemple cmd/api et cmd/migrer.
  - key: vf-couches
    format: true-false
    question: Organiser par couches techniques (models, controllers, services) est la pratique recommandée en Go.
    truth: false
    answer: On organise plutôt par domaine.
  - key: vf-pkg
    format: true-false
    question: Un projet Go doit toujours avoir un dossier pkg/.
    truth: false
    answer: Il n'apporte rien par défaut.
  - key: qcm-structure
    format: multiple-choice
    question: "Lequel de ces éléments d'organisation est déconseillé ?"
    choices:
      - {text: "Un package `models` avec toutes les structs du projet", correct: true}
      - {text: "`cmd/` avec un dossier par binaire", correct: false}
      - {text: "`internal/` pour le code privé du module", correct: false}
      - {text: "Des packages par domaine métier", correct: false}
    answer: "Un package `models` fourre-tout crée des dépendances partout. `cmd/` avec un dossier par binaire, `internal/` pour le code privé et des packages par domaine sont recommandés."
  - key: qcm-cycle
    format: multiple-choice
    question: "Les packages commande et client s'importent mutuellement. Laquelle de ces solutions ne marche pas ?"
    choices:
      - {text: "Un import avec un alias, pour contourner le cycle", correct: true}
      - {text: "Définir dans commande une petite interface de ce dont il a besoin chez client", correct: false}
      - {text: "Déplacer le concept partagé dans un troisième package", correct: false}
      - {text: "Fusionner les deux packages s'ils changent toujours ensemble", correct: false}
    answer: "Un alias change le nom local, pas le graphe : le compilateur refuse toujours le cycle. Une interface déclarée chez l'utilisateur, un troisième package pour le concept partagé, ou la fusion, le suppriment."
  - key: qcm-main
    format: multiple-choice
    question: "Que doit faire le `main` d'un service ?"
    choices:
      - {text: "Lire la configuration, assembler, appeler `run` et choisir le code de sortie", correct: true}
      - {text: "Contenir la logique métier du service, pour la garder visible", correct: false}
      - {text: "Définir les handlers HTTP et leurs routes, un par un", correct: false}
      - {text: "Déclarer les interfaces dont tous les packages ont besoin", correct: false}
    answer: "`main` reste court : configuration, assemblage, appel de `run` et code de sortie. La logique métier et les handlers vivent dans des packages, où ils se testent."
  - key: qcm-debut
    format: multiple-choice
    question: "Comment organiser un petit outil de 300 lignes ?"
    choices:
      - {text: "Un seul package `main`, en plusieurs fichiers si besoin", correct: true}
      - {text: "Une arborescence `cmd/`, `internal/` et `pkg/` dès le départ", correct: false}
      - {text: "Un package par fichier, pour bien séparer le code", correct: false}
      - {text: "Un module Go par fonctionnalité, publié à part", correct: false}
    answer: "La structure suit la taille du projet : un package `main`, éventuellement en plusieurs fichiers, et l'on découpe quand un vrai besoin apparaît."
  - key: scenario-service
    format: scenario
    question: Quelle structure proposes-tu pour un nouveau service web Go de taille moyenne ?
    choices:
      - {text: "`cmd/api/main.go` court, `internal/` par domaine, un package HTTP et un de plateforme, pas de `pkg/`", correct: true}
      - {text: "`models/`, `controllers/`, `services/` et `repositories/` à la racine, comme une application MVC", correct: false}
      - {text: "Un seul package `main` de plusieurs milliers de lignes, découpé en fichiers par ordre alphabétique", correct: false}
      - {text: "Un module Go par domaine, chacun versionné et publié séparément, dès le premier jour", correct: false}
    answer: "`cmd/api/main.go` court (configuration, assemblage, `run`), `internal/` avec un package par domaine (`commande`, `client`, `paiement`), chacun avec son modèle, son service et son dépôt, `internal/http` pour les handlers et le routeur, `internal/plateforme` pour la base, le journal et la configuration, `migrations/` à la racine. Pas de `pkg/`, et la structure évolue avec le projet."
  - key: scenario-couches
    format: scenario
    question: Un projet repris est organisé en packages models, controllers, services et repositories. Quels problèmes cela pose-t-il ?
    choices:
      - {text: "Chaque fonctionnalité est éparpillée, tout s'exporte et les cycles menacent : il faut migrer par domaine", correct: true}
      - {text: "Aucun : c'est exactement l'organisation recommandée par le guide officiel de Go", correct: false}
      - {text: "Seulement des noms trop longs : il suffit de les renommer `m`, `c`, `s` et `r`", correct: false}
      - {text: "Un problème de vitesse : le runtime charge ces quatre packages à chaque requête", correct: false}
    answer: "Chaque fonctionnalité est éparpillée dans quatre packages qui dépendent tous les uns des autres : un changement touche partout, les cycles d'import menacent, et tout est exporté pour traverser les couches. Je migrerais progressivement vers des packages par domaine, en commençant par le plus autonome."
  - key: scenario-monorepo
    format: scenario
    question: Comment organises-tu un dépôt qui contient une API, un worker et un outil d'administration ?
    choices:
      - {text: "Un seul module, avec `cmd/api`, `cmd/worker` et `cmd/admin`, qui partagent `internal/`", correct: true}
      - {text: "Trois dépôts Git séparés, qui recopient le code commun de l'un à l'autre", correct: false}
      - {text: "Un même package `main`, compilé trois fois avec des build tags différents", correct: false}
      - {text: "Trois modules dans le même dépôt dès le départ, chacun avec son `go.mod`", correct: false}
    answer: "Un seul module, avec `cmd/api`, `cmd/worker` et `cmd/admin`, qui partagent les packages de `internal/` (domaines, accès aux données, plateforme) ; chaque binaire a son `main` court et sa cible de build. Des modules séparés seulement si les cycles de livraison ou les équipes divergent vraiment."
