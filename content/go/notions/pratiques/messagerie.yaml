notion: messagerie
lesson: "Les **files de messages** découplent les services : le producteur publie un événement, un ou plusieurs consommateurs\nle traitent quand ils peuvent. En Go, les plus courants :\n\n- **Kafka** : un journal partitionné et persistant, très haut débit. Clients Go : **franz-go** (pur Go, complet),\n  **segmentio/kafka-go**, **confluent-kafka-go** (performant mais basé sur librdkafka en C, donc cgo) ;\n- **NATS** et **JetStream** : léger et rapide, écrit en Go ; JetStream ajoute la persistance et les acquittements ;\n- **RabbitMQ**, les files des clouds (SQS, Pub/Sub) ;\n- **Watermill** : une abstraction commune au-dessus de ces systèmes.\n\nUn consommateur Kafka robuste :\n\n```go\nfor {\n\tfetches := client.PollFetches(ctx)\n\tif ctx.Err() != nil {\n\t\treturn nil // arrêt demandé\n\t}\n\tfor _, rec := range fetches.Records() {\n\t\tif err := traiter(ctx, rec); err != nil {\n\t\t\tenvoyerEnQuarantaine(ctx, rec, err) // file des messages en échec\n\t\t}\n\t}\n\tif err := client.CommitUncommittedOffsets(ctx); err != nil { // acquitter après traitement\n\t\tlog.ErrorContext(ctx, \"commit des positions\", \"err\", err)\n\t}\n}\n```\n\nLes principes :\n- la livraison est en général **au moins une fois** : un message peut arriver **deux fois** (après un redémarrage, un\n  rééquilibrage) ; le consommateur doit être **idempotent** (clé de déduplication, mise à jour conditionnelle) ;\n- **acquitter après** le traitement, jamais avant, sinon un crash perd le message ;\n- l'**ordre** n'est garanti que dans une **partition** (Kafka) : on choisit la clé de partition (l'identifiant de\n  commande) pour garder l'ordre des événements d'une même entité ;\n- un message qui échoue toujours va dans une **file de quarantaine** (*dead letter*) au lieu de bloquer les autres ;\n- pour publier un événement de façon fiable avec une écriture en base, le motif **outbox** ;\n- l'**arrêt gracieux** : arrêter de lire, finir le message en cours, acquitter, puis fermer.\n\n**En entretien** : « Kafka avec franz-go, NATS ; au moins une fois, donc consommateurs idempotents ; acquitter après\ntraitement ; ordre par partition ; file de quarantaine ; outbox pour publier de façon fiable. »"
cards:
  - key: clients-kafka
    format: course
    question: "Quels clients Kafka utilise-t-on en Go ?"
    choices:
      - {text: "franz-go, confluent-kafka-go, segmentio/kafka-go et IBM/sarama", correct: true}
      - {text: "Le package standard `net/kafka`, et aucun autre", correct: false}
      - {text: "Le client Java officiel, appelé depuis Go par cgo", correct: false}
      - {text: "`database/sql`, avec un pilote pour Kafka", correct: false}
    answer: "franz-go (Go pur, très complet), confluent-kafka-go (sur librdkafka, par cgo), segmentio/kafka-go et IBM/sarama. La bibliothèque standard n'a pas de client Kafka."
  - key: eviter-confluent-kafka-certains-projets
    format: course
    question: "Pourquoi éviter confluent-kafka-go dans certains projets ?"
    choices:
      - {text: "Il dépend de cgo (librdkafka), ce qui complique les builds statiques et la compilation croisée", correct: true}
      - {text: "Il n'est plus maintenu depuis l'arrivée de franz-go, et garde des failles connues", correct: false}
      - {text: "Il ne gère ni les groupes de consommateurs, ni la validation des positions (offsets)", correct: false}
      - {text: "Il ne fonctionne qu'avec la version cloud de Kafka, vendue par l'entreprise Confluent", correct: false}
    answer: "Il enveloppe librdkafka, en C, par cgo : les builds statiques, la compilation croisée et les images minimales se compliquent. Il reste maintenu et complet ; franz-go est l'alternative en Go pur."
  - key: nats-jetstream
    format: course
    question: "Qu'est-ce que NATS JetStream ?"
    choices:
      - {text: "La couche de persistance de NATS : flux durables, rejeu, consommateurs avec acquittement", correct: true}
      - {text: "Un client Kafka en Go pur, écrit par l'équipe de NATS pour remplacer sarama", correct: false}
      - {text: "Le protocole de requêtes-réponses de NATS, qui ne garde aucun message", correct: false}
      - {text: "Un moteur de traitement de flux, l'équivalent de Kafka Streams pour Kafka", correct: false}
    answer: "La couche de persistance de NATS : des flux durables, le rejeu des messages et des consommateurs avec acquittement. Sans elle, NATS Core livre au plus une fois, sans stockage."
  - key: sert-watermill
    format: course
    question: "À quoi sert la bibliothèque Watermill ?"
    choices:
      - {text: "À unifier plusieurs brokers derrière une même API en Go, avec des middlewares", correct: true}
      - {text: "À superviser les goroutines d'un consommateur, et à les redémarrer en cas de panic", correct: false}
      - {text: "À générer le code Go des messages à partir de schémas Avro ou Protobuf", correct: false}
      - {text: "À remplacer Kafka par un broker écrit en Go pur, plus simple à exploiter", correct: false}
    answer: "Watermill offre une même API (publisher, subscriber, router) au-dessus de Kafka, NATS, RabbitMQ ou d'une base SQL, avec des middlewares (réessais, quarantaine, corrélation). Ce n'est pas un broker."
  - key: implementer-outbox
    format: course
    question: "Comment implémenter le motif outbox en Go ?"
    choices:
      - {text: "Écrire l'événement en base dans la transaction métier, puis un relais le publie et le marque", correct: true}
      - {text: "Publier l'événement juste après le commit, et réessayer en mémoire si la publication échoue", correct: false}
      - {text: "Publier l'événement avant d'écrire en base, pour être sûr de ne jamais le perdre", correct: false}
      - {text: "Publier dans une goroutine lancée pendant la transaction, sans attendre son résultat", correct: false}
    answer: "L'événement est écrit en base dans la même transaction que l'effet métier ; un relais lit les événements non publiés, les publie, puis les marque, avec `FOR UPDATE SKIP LOCKED` quand plusieurs instances tournent. Publier après le commit perd l'événement si le service tombe entre les deux."
  - key: concois-consommateur-kafka-robuste
    format: scenario
    question: "Quels choix fais-tu pour un consommateur Kafka robuste en Go ?"
    choices:
      - {text: "Commit après un traitement idempotent, un worker par partition, réessais puis DLQ, arrêt propre", correct: true}
      - {text: "Commit dès la réception, puis traitement en goroutine, pour ne jamais bloquer la partition", correct: false}
      - {text: "Auto-commit périodique, et un seul consommateur pour tout le topic, pour garder l'ordre", correct: false}
      - {text: "Commit après traitement, et réessais à l'infini sur un message en échec, pour ne rien perdre", correct: false}
    answer: "franz-go dans un groupe coopératif, offsets validés après un traitement idempotent (identifiant de l'événement inséré sous contrainte d'unicité, dans la transaction métier) ; un worker par partition, ou un pool routé par clé, pour garder l'ordre par clé. Quelques réessais avec backoff, puis un topic de retry ou une DLQ pour ne pas bloquer la partition ; arrêt propre sur SIGTERM, et des métriques de lag, d'erreurs et de durée."
  - key: vf-au-moins-une-fois
    format: true-false
    question: Avec une livraison « au moins une fois », un consommateur peut recevoir le même message deux fois.
    truth: true
    answer: D'où des consommateurs idempotents.
  - key: vf-acquitter-avant
    format: true-false
    question: Acquitter un message avant de le traiter est plus sûr.
    truth: false
    answer: Un crash pendant le traitement perdrait le message.
  - key: vf-ordre
    format: true-false
    question: Kafka garantit l'ordre des messages sur l'ensemble d'un topic.
    truth: false
    answer: Seulement au sein d'une partition ; la clé de partition décide.
  - key: vf-confluent
    format: true-false
    question: confluent-kafka-go repose sur une bibliothèque C et demande cgo.
    truth: true
    answer: Ce qui complique la compilation croisée et les images scratch.
  - key: qcm-principes
    format: multiple-choice
    question: "Laquelle de ces pratiques ne rend pas un consommateur robuste ?"
    choices:
      - {text: "Acquitter le message dès sa réception, avant le traitement", correct: true}
      - {text: "Un traitement idempotent", correct: false}
      - {text: "Une file de quarantaine pour les messages qui échouent toujours", correct: false}
      - {text: "Des réessais avec backoff pour les erreurs temporaires", correct: false}
    answer: "Acquitter avant de traiter perd le message si le service tombe pendant le traitement : on acquitte après. Idempotence, réessais avec backoff et quarantaine, pour qu'un message empoisonné ne bloque pas la file, rendent le consommateur robuste."
  - key: qcm-ordre
    format: multiple-choice
    question: "Lesquelles de ces mesures gardent l'ordre des événements d'une même commande dans Kafka ?"
    choices:
      - text: Utiliser l'identifiant de la commande comme clé de partition
        correct: true
      - text: Traiter une partition par un seul consommateur à la fois
        correct: true
      - text: Utiliser une clé aléatoire
        correct: false
      - text: Créer un topic par commande
        correct: false
    answer: "Une même clé va toujours dans la même partition, et une partition n'est lue que par un consommateur du groupe à la fois : l'ordre par commande est gardé. Une clé aléatoire disperse les événements, et un topic par commande ne passe pas à l'échelle."
  - key: qcm-clients
    format: multiple-choice
    question: "Lequel de ces outils ne sert pas à la messagerie en Go ?"
    choices:
      - {text: "`database/sql`, pour lire un topic Kafka", correct: true}
      - {text: "franz-go, pour Kafka, en Go pur", correct: false}
      - {text: "nats.go, pour NATS et JetStream", correct: false}
      - {text: "Watermill, une abstraction au-dessus de plusieurs systèmes", correct: false}
    answer: "Kafka n'est pas une base SQL : `database/sql` ne sert pas à le lire. franz-go, nats.go et Watermill sont les outils courants."
  - key: qcm-outbox
    format: multiple-choice
    question: "Pourquoi utiliser le motif outbox ?"
    choices:
      - {text: "Pour publier un événement si et seulement si l'écriture en base a été validée", correct: true}
      - {text: "Pour garantir qu'un événement n'est jamais publié deux fois", correct: false}
      - {text: "Pour se passer de base de données dans le service", correct: false}
      - {text: "Pour publier plus vite, sans attendre la fin de la transaction", correct: false}
    answer: "L'outbox lie la publication au commit : l'événement part si et seulement si l'écriture a été validée, même si le broker est indisponible un moment. Le relais peut republier : les consommateurs restent idempotents."
  - key: scenario-consommateur
    format: scenario
    question: "Comment ton consommateur Kafka traite-t-il un message, de sa réception à la validation de sa position ?"
    choices:
      - {text: "Décoder, traiter de façon idempotente avec un délai, réessayer ou mettre en quarantaine, puis valider", correct: true}
      - {text: "Valider la position, puis décoder et traiter, en ignorant les erreurs pour ne pas bloquer", correct: false}
      - {text: "Décoder et traiter, puis valider si tout a réussi, et sinon arrêter de consommer la partition", correct: false}
      - {text: "Décoder, traiter dans une nouvelle goroutine par message, et valider sans l'attendre", correct: false}
    answer: "Pour chaque message : décoder, traiter de façon idempotente (table des messages déjà traités, ou mise à jour conditionnelle) avec un délai ; quelques réessais avec backoff pour un échec temporaire, la quarantaine avec sa cause pour un échec définitif. Les positions sont validées après traitement, l'arrêt sur SIGTERM finit le lot en cours, et des métriques suivent le lag, les erreurs et la durée."
  - key: scenario-choix
    format: scenario
    question: "Kafka ou NATS, lequel choisis-tu pour un nouveau système d'événements ?"
    choices:
      - {text: "Kafka pour un journal durable, rejouable, à haut débit ; NATS pour une messagerie légère", correct: true}
      - {text: "NATS, toujours : Kafka est devenu inutile depuis l'arrivée de JetStream", correct: false}
      - {text: "Kafka, toujours : NATS ne sait ni garder ni rejouer le moindre message", correct: false}
      - {text: "Celui dont le client Go est le plus récent, puisque c'est lui qu'on utilisera", correct: false}
    answer: "Kafka pour un journal d'événements durable à haut débit, relu par plusieurs consommateurs et rejouable, au prix d'une exploitation plus lourde ; NATS (avec JetStream pour la persistance) pour une messagerie légère entre services et des requêtes-réponses. Le choix dépend de la rétention, du rejeu et de l'équipe qui l'exploitera."
  - key: scenario-doublons
    format: scenario
    question: Ton consommateur crée parfois deux factures pour la même commande. Comment le corriges-tu ?
    choices:
      - {text: "Rendre l'écriture idempotente : unicité sur la commande, ou table des messages traités", correct: true}
      - {text: "Passer Kafka en « exactement une fois », pour ne plus jamais recevoir de doublon", correct: false}
      - {text: "Valider la position avant le traitement, pour que le message ne revienne plus", correct: false}
      - {text: "Garder en mémoire les identifiants déjà vus, dans une map du consommateur", correct: false}
    answer: "Le message a été livré deux fois (au moins une fois), et le traitement n'était pas idempotent. Une contrainte d'unicité sur la commande (`INSERT ... ON CONFLICT DO NOTHING`), ou une table des messages traités dans la même transaction, rend le second passage sans effet. Valider avant ferait perdre des messages, et une map en mémoire ne survit ni au redémarrage ni au rééquilibrage."
