notion: commentaires-doc
lesson: |-
  En Go, la documentation **est** le commentaire placé juste au-dessus d'une déclaration exportée. `go doc` et
  pkg.go.dev l'affichent.

  ```go
  // Package facture calcule et émet les factures des commandes.
  package facture

  // ErrMontantNegatif est renvoyée quand une ligne a un montant négatif.
  var ErrMontantNegatif = errors.New("montant négatif")

  // Total renvoie le montant toutes taxes comprises de la facture, en centimes.
  // Il renvoie ErrMontantNegatif si une ligne a un montant négatif.
  func (f *Facture) Total() (int64, error) {
  ```

  Les conventions :
  - le commentaire commence par le **nom** de l'identifiant (`// Total renvoie...`), sous forme d'une phrase complète ;
  - le **commentaire de package** commence par `// Package facture ...`, une seule fois (souvent dans `doc.go` pour un
    long texte) ;
  - on documente ce qui n'est pas évident : le **comportement**, les **erreurs** renvoyées, les **unités**, la
    **concurrence** (« sûr entre goroutines »), les cas limites ; pas la paraphrase du nom ;
  - les **dépréciations** : un paragraphe `// Deprecated: utiliser X.`, que les outils signalent ;
  - depuis Go 1.19, une syntaxe légère : des paragraphes, des listes (`  - élément`), des blocs de code indentés, des
    liens vers d'autres identifiants (`[Facture.Total]`, `[io.Reader]`) et des titres (`# Titre`) ;
  - les **exemples** (fonctions `ExampleXxx`) complètent la documentation et sont vérifiés par go test.

  ```
  go doc facture.Total
  go doc -all ./facture
  ```

  Les commentaires de code ordinaires (`//` dans les fonctions) expliquent le **pourquoi**, pas le quoi.

  **En entretien** : « Un commentaire au-dessus de chaque identifiant exporté, qui commence par son nom ; un commentaire
  de package ; documenter erreurs, unités et concurrence ; Deprecated: ; liens entre crochets ; go doc. »
tour:
  - title: Les commentaires de documentation
    text: |-
      Un commentaire placé juste avant une déclaration exportée la **documente**. Il commence par le nom de ce qu'il
      décrit, et forme des phrases complètes ; `// Package geometrie …` documente un package.

      `go doc` et le site pkg.go.dev affichent ces commentaires : `go doc strings.Cut` montre la documentation de `Cut`.
      Un exemple exécutable, `func ExampleAire()` dans un fichier de test, y apparaît aussi.
    example:
      files:
        main.go: |-
          // Le programme montre des commentaires de documentation.
          package main

          import "fmt"

          // Rayon est la distance du centre au bord d'un cercle, en mètres.
          type Rayon float64

          // Aire renvoie l'aire du disque de rayon r.
          func Aire(r Rayon) float64 {
          	return 3.14159 * float64(r) * float64(r)
          }

          func main() {
          	fmt.Printf("%.2f\n", Aire(2))
          }
      output: |-
        12.57
cards:
  - key: documenter-identifiant-exporte
    format: course
    question: "Comment documenter un identifiant exporté en Go ?"
    choices:
      - {text: "Par un commentaire juste au-dessus, qui commence par son nom", correct: true}
      - {text: "Par un commentaire `/** ... */` avec des balises `@param`", correct: false}
      - {text: "Par un commentaire en fin de ligne, à droite de la déclaration", correct: false}
      - {text: "Dans un fichier `README.md` du package, une section par nom", correct: false}
    answer: "Un commentaire placé juste au-dessus de la déclaration, sans ligne vide, qui commence par le nom (« Total renvoie... »). Go n'a pas de balises `@param` : le texte se lit comme de la prose."
  - key: package
    format: course
    question: Comment écrit-on le commentaire de documentation d'un package ?
    choices:
      - {text: "Juste avant la clause `package`, dans un seul fichier, en commençant par « Package nom »", correct: true}
      - {text: "Dans chaque fichier du package, avant la clause `package`, répété à l'identique", correct: false}
      - {text: "Dans un fichier `package-info.go`, avec une annotation sur la clause `package`", correct: false}
      - {text: "Dans le `go.mod`, sous la directive `module`, en commentaire de ligne", correct: false}
    answer: "Juste avant la clause `package`, dans un seul fichier du package (souvent `doc.go`), en commençant par « Package nom » suivi de ce que fait le package. `package-info` est une habitude de Java."
  - key: deprecated
    format: course
    question: Comment marquer une fonction comme dépréciée ?
    choices:
      - {text: "Par un paragraphe de sa documentation qui commence par « Deprecated: », suivi de la remplaçante", correct: true}
      - {text: "Par une annotation `@Deprecated` au-dessus de la fonction, comme en Java", correct: false}
      - {text: "Par une directive `//go:deprecated` sur la ligne qui précède la fonction", correct: false}
      - {text: "En renommant la fonction avec un préfixe `Old`, que les linters reconnaissent", correct: false}
    answer: "Un paragraphe du commentaire de documentation commençant par « Deprecated: », suivi de ce qu'il faut utiliser à la place ; les éditeurs et staticcheck signalent alors ses usages. Go n'a ni annotation ni directive `//go:deprecated`."
  - key: liens
    format: course
    question: Comment faire un lien vers un autre identifiant dans un commentaire de documentation ?
    choices:
      - {text: "En l'écrivant entre crochets, comme `[Facture.Total]` ou `[io.Reader]`", correct: true}
      - {text: "Avec une balise `{@link Facture#Total}`, comme en Javadoc", correct: false}
      - {text: "Avec un lien Markdown, comme `[Total](Facture.Total)`", correct: false}
      - {text: "En le préfixant d'un `@`, comme `@Facture.Total`", correct: false}
    answer: "Entre crochets, `[Facture.Total]` ou `[io.Reader]` (Go 1.19) : `go doc` et pkg.go.dev en font des liens. `{@link}` est de la Javadoc."
  - key: vf-nom
    format: true-false
    question: Par convention, le commentaire de documentation commence par le nom de l'identifiant documenté.
    truth: true
    answer: Par exemple « Total renvoie... ».
  - key: vf-non-exportes
    format: true-false
    question: Seuls les identifiants non exportés ont besoin d'un commentaire de documentation.
    truth: false
    answer: Ce sont surtout les identifiants exportés, l'API publique.
  - key: vf-ligne-vide
    format: true-false
    question: Un commentaire séparé de la déclaration par une ligne vide est quand même pris comme documentation.
    truth: false
    answer: Il doit être juste au-dessus, sans ligne vide.
  - key: vf-exemples
    format: true-false
    question: Les fonctions Example apparaissent dans la documentation générée.
    truth: true
    answer: Et sont vérifiées par go test si elles ont un commentaire Output.
  - key: qcm-contenu
    format: multiple-choice
    question: "Que ne faut-il pas écrire dans la documentation d'une fonction exportée ?"
    choices:
      - {text: "Son nom répété en d'autres mots, comme « Envoyer envoie »", correct: true}
      - {text: "Son comportement et ses cas limites", correct: false}
      - {text: "Les erreurs qu'elle renvoie, et dans quels cas", correct: false}
      - {text: "Si on peut l'appeler depuis plusieurs goroutines", correct: false}
    answer: "Une paraphrase du nom n'apprend rien. La documentation dit le comportement et les cas limites, les erreurs renvoyées et la sûreté entre goroutines."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Que ne permet pas la syntaxe des commentaires de documentation depuis Go 1.19 ?"
    choices:
      - {text: "Du HTML, interprété par `go doc` et pkg.go.dev", correct: true}
      - {text: "Des liens entre crochets vers d'autres identifiants", correct: false}
      - {text: "Des listes et des blocs de code indentés", correct: false}
      - {text: "Des titres qui commencent par `#`", correct: false}
    answer: "Le HTML n'est pas interprété : il s'affiche tel quel. Depuis Go 1.19, on a des liens entre crochets, des listes, des blocs de code indentés et des titres avec `#`."
  - key: qcm-outils
    format: multiple-choice
    question: "Lequel de ces moyens ne permet pas de consulter la documentation d'un package ?"
    choices:
      - {text: "`go vet -doc ./facture`", correct: true}
      - {text: "`go doc facture.Total`", correct: false}
      - {text: "`go doc -all ./facture`", correct: false}
      - {text: "pkg.go.dev, pour un module public", correct: false}
    answer: "`go vet` analyse le code et n'a pas d'option `-doc`. `go doc` affiche un identifiant ou, avec `-all`, tout le package ; pkg.go.dev publie la documentation des modules publics, et gopls l'affiche au survol."
  - key: qcm-commentaires-code
    format: multiple-choice
    question: "Lequel de ces commentaires de code est utile ?"
    choices:
      - {text: "`// Le partenaire renvoie parfois 200 avec un corps vide : on le traite comme une absence.`", correct: true}
      - {text: "`// incrémente i de 1 à chaque tour de la boucle, jusqu'à la fin de la slice`", correct: false}
      - {text: "`// boucle sur toutes les commandes de la liste et appelle traiter pour chacune`", correct: false}
      - {text: "`// TODO : à revoir plus tard, quand on aura le temps de faire mieux`", correct: false}
    answer: "Un commentaire utile explique le pourquoi, que le code ne dit pas. Paraphraser le code ou laisser un TODO sans explication n'apprend rien au lecteur."
  - key: bug-nom
    format: bug-fix
    question: |-
      Le linter signale « comment on exported function Total should be of the form "Total ..." ». Quelle correction est la bonne ?
      ```go
      // Cette fonction calcule le total.
      func (f *Facture) Total() int64 {
      ```
    choices:
      - {text: "Commencer par le nom : `// Total renvoie le montant TTC de la facture, en centimes.`", correct: true}
      - {text: "Écrire plutôt `// Cette méthode calcule le total de la facture, en centimes.`", correct: false}
      - {text: "Passer en Javadoc : `/** Calcule le total. @return le total en centimes */`", correct: false}
      - {text: "Désactiver cette règle du linter : seul le sens du commentaire compte", correct: false}
    answer: |-
      ```go
      // Total renvoie le montant toutes taxes comprises de la facture, en centimes.
      func (f *Facture) Total() int64 {
      ```
      Le commentaire commence par le nom de l'identifiant, et précise ce qui n'est pas évident (TTC, centimes). Une autre tournure, ou le style Javadoc, garde le défaut.
  - key: bug-deprecated
    format: bug-fix
    question: |-
      Les utilisateurs continuent d'appeler l'ancienne fonction, sans être avertis. Quelle correction est la bonne ?
      ```go
      // AncienCalcul ne doit plus être utilisée.
      func AncienCalcul(m int64) int64 { return Calculer(m, TauxParDefaut) }
      ```
    choices:
      - {text: "Un paragraphe `// Deprecated: utiliser [Calculer], qui prend le taux en paramètre.`", correct: true}
      - {text: "Une annotation `// @Deprecated` sur la ligne juste au-dessus de la fonction", correct: false}
      - {text: "Un `log.Println` dans la fonction, qui avertit à chaque appel en production", correct: false}
      - {text: "Renommer la fonction en `AncienCalculObsolete`, pour que le nom avertisse", correct: false}
    answer: |-
      ```go
      // AncienCalcul calcule le montant avec le taux par défaut.
      //
      // Deprecated: utiliser [Calculer], qui prend le taux en paramètre.
      func AncienCalcul(m int64) int64 { return Calculer(m, TauxParDefaut) }
      ```
      Le paragraphe « Deprecated: », séparé du reste par une ligne vide, est reconnu par les éditeurs et les linters, qui signalent les usages. Un journal à l'exécution avertit trop tard, et un renommage casse les appelants.
  - key: bug-paraphrase
    format: bug-fix
    question: |-
      Que reproches-tu à cette documentation ?
      ```go
      // Envoyer envoie.
      func (c *Client) Envoyer(ctx context.Context, m Message) error
      ```
    choices:
      - {text: "Elle paraphrase le nom, sans dire le comportement, les erreurs ni la sûreté entre goroutines", correct: true}
      - {text: "Elle devrait commencer par « La méthode Envoyer », et non par le nom seul", correct: false}
      - {text: "Elle devrait décrire chaque paramètre et le résultat avec des balises `@param`", correct: false}
      - {text: "Rien : une méthode au nom aussi clair n'a pas besoin d'autre documentation", correct: false}
    answer: |-
      ```go
      // Envoyer transmet m au service de messagerie et attend son accusé de réception.
      // Il renvoie ErrQuota si le quota du compte est atteint ; les autres erreurs sont
      // temporaires et peuvent être réessayées. Envoyer est sûr entre goroutines.
      func (c *Client) Envoyer(ctx context.Context, m Message) error
      ```
      La paraphrase n'apprenait rien ; la documentation dit le comportement, les erreurs et la concurrence. Elle commence bien par le nom, et Go n'a pas de balises `@param`.
  - key: bug-ligne-vide
    format: bug-fix
    question: |-
      `go doc` n'affiche aucune documentation pour cette fonction. Pourquoi ?
      ```go
      // Arrondir arrondit au centime le plus proche.

      func Arrondir(m float64) int64 {
      ```
    choices:
      - {text: "La ligne vide détache le commentaire de la déclaration", correct: true}
      - {text: "Un commentaire de documentation s'écrit `/* ... */`, pas `//`", correct: false}
      - {text: "La fonction doit être documentée dans le fichier `doc.go`", correct: false}
      - {text: "Le commentaire doit tenir sur deux lignes au moins", correct: false}
    answer: |-
      ```go
      // Arrondir arrondit au centime le plus proche.
      func Arrondir(m float64) int64 {
      ```
      Le commentaire doit précéder la déclaration sans ligne vide : séparé par une ligne vide, il n'est rattaché à rien. `//` et `/* */` conviennent tous les deux.
