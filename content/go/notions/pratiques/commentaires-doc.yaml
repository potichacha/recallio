notion: commentaires-doc
lesson: |-
  En Go, la documentation **est** le commentaire placé juste au-dessus d'une déclaration exportée. `go doc` et
  pkg.go.dev l'affichent.

  ```go
  // Package facture calcule et émet les factures des commandes.
  package facture

  // ErrMontantNegatif est renvoyée quand une ligne a un montant négatif.
  var ErrMontantNegatif = errors.New("montant négatif")

  // Total renvoie le montant toutes taxes comprises de la facture, en centimes.
  // Il renvoie ErrMontantNegatif si une ligne a un montant négatif.
  func (f *Facture) Total() (int64, error) {
  ```

  Les conventions :
  - le commentaire commence par le **nom** de l'identifiant (`// Total renvoie...`), sous forme d'une phrase complète ;
  - le **commentaire de package** commence par `// Package facture ...`, une seule fois (souvent dans `doc.go` pour un
    long texte) ;
  - on documente ce qui n'est pas évident : le **comportement**, les **erreurs** renvoyées, les **unités**, la
    **concurrence** (« sûr entre goroutines »), les cas limites ; pas la paraphrase du nom ;
  - les **dépréciations** : un paragraphe `// Deprecated: utiliser X.`, que les outils signalent ;
  - depuis Go 1.19, une syntaxe légère : des paragraphes, des listes (`  - élément`), des blocs de code indentés, des
    liens vers d'autres identifiants (`[Facture.Total]`, `[io.Reader]`) et des titres (`# Titre`) ;
  - les **exemples** (fonctions `ExampleXxx`) complètent la documentation et sont vérifiés par go test.

  ```
  go doc facture.Total
  go doc -all ./facture
  ```

  Les commentaires de code ordinaires (`//` dans les fonctions) expliquent le **pourquoi**, pas le quoi.

  **En entretien** : « Un commentaire au-dessus de chaque identifiant exporté, qui commence par son nom ; un commentaire
  de package ; documenter erreurs, unités et concurrence ; Deprecated: ; liens entre crochets ; go doc. »
cards:
  - key: documenter-identifiant-exporte
    format: course
    question: Comment documenter un identifiant exporté ?
    answer: Un commentaire juste au-dessus qui commence par son nom.
  - key: package
    format: course
    question: Comment écrit-on le commentaire de documentation d'un package ?
    answer: Juste avant la clause package, dans un seul fichier du package (souvent doc.go), en commençant par « Package nom » suivi d'une phrase qui dit ce que fait le package.
  - key: deprecated
    format: course
    question: Comment marquer une fonction comme dépréciée ?
    answer: 'Avec un paragraphe du commentaire de documentation qui commence par « Deprecated: », suivi de ce qu''il faut utiliser à la place ; les éditeurs et staticcheck signalent alors ses usages.'
  - key: liens
    format: course
    question: Comment faire un lien vers un autre identifiant dans un commentaire de documentation ?
    answer: En l'écrivant entre crochets, par exemple [Facture.Total] ou [io.Reader] (Go 1.19) ; go doc et pkg.go.dev en font des liens.
  - key: vf-nom
    format: true-false
    question: Par convention, le commentaire de documentation commence par le nom de l'identifiant documenté.
    truth: true
    answer: Par exemple « Total renvoie... ».
  - key: vf-non-exportes
    format: true-false
    question: Seuls les identifiants non exportés ont besoin d'un commentaire de documentation.
    truth: false
    answer: Ce sont surtout les identifiants exportés, l'API publique.
  - key: vf-ligne-vide
    format: true-false
    question: Un commentaire séparé de la déclaration par une ligne vide est quand même pris comme documentation.
    truth: false
    answer: Il doit être juste au-dessus, sans ligne vide.
  - key: vf-exemples
    format: true-false
    question: Les fonctions Example apparaissent dans la documentation générée.
    truth: true
    answer: Et sont vérifiées par go test si elles ont un commentaire Output.
  - key: qcm-contenu
    format: multiple-choice
    question: Que documenter pour une fonction exportée ?
    choices:
      - text: Son comportement et ses cas limites
        correct: true
      - text: Les erreurs qu'elle renvoie
        correct: true
      - text: Si elle est sûre entre goroutines
        correct: true
      - text: La répétition de son nom en d'autres mots
        correct: false
    answer: Une paraphrase n'apprend rien.
  - key: qcm-syntaxe
    format: multiple-choice
    question: Que permet la syntaxe des commentaires de documentation depuis Go 1.19 ?
    choices:
      - text: Des liens entre crochets vers d'autres identifiants
        correct: true
      - text: Des listes et des blocs de code indentés
        correct: true
      - text: 'Des titres avec #'
        correct: true
      - text: Du HTML arbitraire
        correct: false
    answer: Le HTML n'est pas interprété.
  - key: qcm-outils
    format: multiple-choice
    question: Comment consulter la documentation d'un package ?
    choices:
      - text: '`go doc facture.Total`'
        correct: true
      - text: '`go doc -all ./facture`'
        correct: true
      - text: pkg.go.dev pour un module public
        correct: true
      - text: '`go vet -doc`'
        correct: false
    answer: gopls l'affiche aussi au survol dans l'éditeur.
  - key: qcm-commentaires-code
    format: multiple-choice
    question: Quel commentaire de code est utile ?
    choices:
      - text: '`// Le partenaire renvoie parfois 200 avec un corps vide : on le traite comme une absence.`'
        correct: true
      - text: '`// incrémente i`'
        correct: false
      - text: '`// boucle sur les commandes`'
        correct: false
      - text: '`// TODO`, sans explication'
        correct: false
    answer: Un commentaire explique le pourquoi que le code ne dit pas.
  - key: bug-nom
    format: bug-fix
    question: |-
      Le linter signale « comment on exported function Total should be of the form "Total ..." » :
      ```go
      // Cette fonction calcule le total.
      func (f *Facture) Total() int64 {
      ```
    answer: |-
      ```go
      // Total renvoie le montant toutes taxes comprises de la facture, en centimes.
      func (f *Facture) Total() int64 {
      ```
      Le commentaire commence par le nom et précise ce qui n'est pas évident (TTC, centimes).
  - key: bug-deprecated
    format: bug-fix
    question: |-
      Les utilisateurs continuent d'appeler l'ancienne fonction, sans être avertis :
      ```go
      // AncienCalcul ne doit plus être utilisée.
      func AncienCalcul(m int64) int64 { return Calculer(m, TauxParDefaut) }
      ```
    answer: |-
      ```go
      // AncienCalcul calcule le montant avec le taux par défaut.
      //
      // Deprecated: utiliser [Calculer], qui prend le taux en paramètre.
      func AncienCalcul(m int64) int64 { return Calculer(m, TauxParDefaut) }
      ```
      Le paragraphe « Deprecated: » est reconnu par les éditeurs et les linters, qui signalent les usages.
  - key: bug-paraphrase
    format: bug-fix
    question: |-
      Que reproches-tu à cette documentation ?
      ```go
      // Envoyer envoie.
      func (c *Client) Envoyer(ctx context.Context, m Message) error
      ```
    answer: |-
      ```go
      // Envoyer transmet m au service de messagerie et attend son accusé de réception.
      // Il renvoie ErrQuota si le quota du compte est atteint ; les autres erreurs sont
      // temporaires et peuvent être réessayées. Envoyer est sûr entre goroutines.
      func (c *Client) Envoyer(ctx context.Context, m Message) error
      ```
      La paraphrase n'apprenait rien ; la documentation dit le comportement, les erreurs et la concurrence.
  - key: bug-ligne-vide
    format: bug-fix
    question: |-
      go doc n'affiche aucune documentation pour la fonction :
      ```go
      // Arrondir arrondit au centime le plus proche.

      func Arrondir(m float64) int64 {
      ```
    answer: |-
      ```go
      // Arrondir arrondit au centime le plus proche.
      func Arrondir(m float64) int64 {
      ```
      Le commentaire doit précéder la déclaration sans ligne vide.
