notion: securite-go
lesson: |-
  Go est sûr en mémoire (pas de dépassement de tampon hors `unsafe` et cgo), mais les failles applicatives restent
  possibles. Les réflexes :

  | Risque | Réponse en Go |
  |---|---|
  | jetons, mots de passe temporaires prévisibles | **`crypto/rand`** (`rand.Text()` en Go 1.24), jamais `math/rand` |
  | injection SQL | requêtes **paramétrées** |
  | XSS dans les pages HTML | **`html/template`**, qui échappe selon le contexte, jamais `text/template` pour du HTML |
  | injection de commande | `exec.Command("prog", arg1, arg2)` sans shell, jamais `sh -c` avec une entrée |
  | traversée de chemins | **`os.Root`** (Go 1.24), `filepath.IsLocal` |
  | mots de passe stockés | **bcrypt** ou **argon2id** (`golang.org/x/crypto`), jamais un simple hash |
  | comparaison de secrets | **`subtle.ConstantTimeCompare`** ou `hmac.Equal` |
  | TLS désactivé | jamais `InsecureSkipVerify: true` en production |
  | CSRF | `http.CrossOriginProtection` (Go 1.25) |
  | entrées trop grosses | `http.MaxBytesReader`, délais du serveur |

  ```go
  jeton := rand.Text() // crypto/rand, Go 1.24 : 26 caractères base32, 128 bits d'aléa

  hash, err := bcrypt.GenerateFromPassword([]byte(motDePasse), bcrypt.DefaultCost)
  err = bcrypt.CompareHashAndPassword(hash, []byte(saisie))
  ```

  Pour le chiffrement, on reste sur les primitives de haut niveau : **AES-GCM** (`cipher.NewGCM`) ou
  `chacha20poly1305`, avec un nonce **unique** par message. La bibliothèque standard inclut un module cryptographique
  validé **FIPS 140-3** (Go 1.24) et des échanges de clés **post-quantiques** (ML-KEM) activés par défaut en TLS.

  Et toujours : les secrets hors du dépôt et des journaux, les dépendances surveillées (govulncheck), gosec en CI.

  **En entretien** : « crypto/rand pour tout secret ; requêtes paramétrées ; html/template ; exec sans shell ; os.Root ;
  bcrypt ou argon2id ; comparaison en temps constant ; jamais InsecureSkipVerify ; govulncheck et gosec. »
cards:
  - key: math-rand-vs-crypto-rand
    format: course
    question: "Quelle différence y a-t-il entre `math/rand` et `crypto/rand` ?"
    choices:
      - {text: "`math/rand` donne un aléa statistique, pas fait pour les secrets ; `crypto/rand` est sûr en cryptographie", correct: true}
      - {text: "`crypto/rand` est plus rapide, et `math/rand` plus sûr, puisqu'on choisit sa graine", correct: false}
      - {text: "Aucune depuis `math/rand/v2` : les deux conviennent pour générer des secrets", correct: false}
      - {text: "`math/rand` donne des entiers, `crypto/rand` seulement des chaînes de caractères", correct: false}
    answer: "`math/rand` (v2 comprise) fournit un aléa statistique, rapide mais pas conçu pour les secrets ; `crypto/rand` lit une source cryptographiquement sûre, pour les jetons et les clés."
  - key: text-template-vs-html-template
    format: course
    question: "Quelle différence y a-t-il entre `text/template` et `html/template` ?"
    choices:
      - {text: "`html/template` échappe selon le contexte HTML, contre le XSS ; `text/template` n'échappe rien", correct: true}
      - {text: "`text/template` échappe tout, et `html/template` seulement les balises `<script>`", correct: false}
      - {text: "`html/template` est plus rapide, car il précompile le HTML à la construction", correct: false}
      - {text: "Aucune : `html/template` n'est qu'un alias de `text/template`, gardé pour l'usage", correct: false}
    answer: "`html/template` échappe automatiquement selon le contexte (texte, attribut, URL, script), contre le XSS ; `text/template` n'échappe rien et ne sert pas à produire du HTML."
  - key: memoire
    format: course
    question: "Go est-il sûr en mémoire ?"
    choices:
      - {text: "Oui, hors `unsafe` et cgo : bornes vérifiées, GC, pas de dépassement de tampon exploitable", correct: true}
      - {text: "Non : comme en C, un accès hors des bornes lit la mémoire voisine sans erreur", correct: false}
      - {text: "Oui, totalement : même `unsafe` et cgo sont vérifiés par le runtime", correct: false}
      - {text: "Non : sans ramasse-miettes, les pointeurs pendants y sont fréquents", correct: false}
    answer: "Oui, hors `unsafe` et cgo : les bornes sont vérifiées (un accès hors bornes panique), le GC évite les pointeurs pendants, et il n'y a pas de dépassement de tampon exploitable. Les courses de données restent possibles : `-race` les cherche."
  - key: exec-command-vulnerable-injection
    format: course
    question: "`exec.Command` est-il vulnérable à l'injection de commandes ?"
    choices:
      - {text: "Non, si les arguments sont passés séparément sans shell ; oui avec `sh -c` et une concaténation", correct: true}
      - {text: "Oui, toujours : chaque argument passe par le shell du système avant l'exécution", correct: false}
      - {text: "Non, jamais : Go échappe lui-même les arguments, même passés à `sh -c`", correct: false}
      - {text: "Oui, sauf avec `exec.CommandContext`, qui échappe les arguments à la place", correct: false}
    answer: "`exec.Command` lance le programme directement, sans shell : chaque argument est passé tel quel. Avec `sh -c` et une chaîne concaténée, le shell interprète `;`, `|` ou `$(...)` : l'injection redevient possible."
  - key: proteger-path-traversal
    format: course
    question: "Comment se protéger d'une traversée de chemin (path traversal) en Go ?"
    choices:
      - {text: "Avec `os.Root` (Go 1.24) ou `filepath.IsLocal`, plutôt qu'un simple `filepath.Clean`", correct: true}
      - {text: "Avec `filepath.Clean`, qui retire tous les `..` du chemin demandé", correct: false}
      - {text: "En refusant seulement les chemins qui commencent par `/`", correct: false}
      - {text: "En remplaçant chaque `..` du chemin par une chaîne vide", correct: false}
    answer: "`os.Root` (Go 1.24) confine les accès à un répertoire, et `filepath.IsLocal` refuse les chemins qui en sortent. `Clean` garde les `..` de tête, et un remplacement naïf se contourne (`....//`)."
  - key: math-rand-crypto-rand-jeton
    format: course
    question: "Pour générer un jeton de session, faut-il `math/rand` ou `crypto/rand` ?"
    choices:
      - {text: "`crypto/rand`, toujours", correct: true}
      - {text: "`math/rand/v2`, assez sûr depuis Go 1.22", correct: false}
      - {text: "`math/rand`, avec une graine tirée de l'heure", correct: false}
      - {text: "L'un ou l'autre, si le jeton fait 32 octets", correct: false}
    answer: "`crypto/rand`, toujours : un jeton de sécurité doit être imprévisible (`rand.Text()` depuis Go 1.24). Une graine tirée de l'heure se devine, et la longueur ne compense pas une source prévisible."
  - key: hacher-mot-passe
    format: course
    question: "Comment hacher un mot de passe en Go ?"
    choices:
      - {text: "Avec bcrypt ou argon2id (`golang.org/x/crypto`), jamais SHA-256 seul", correct: true}
      - {text: "Avec `sha256.Sum256`, rapide et sans collision connue", correct: false}
      - {text: "Avec AES-GCM, pour pouvoir le déchiffrer en cas d'oubli", correct: false}
      - {text: "En base64, suffisant tant que la base est protégée", correct: false}
    answer: "bcrypt ou argon2id, lents et salés, rendent l'attaque par force brute coûteuse. SHA-256 est trop rapide, un mot de passe chiffré peut être déchiffré, et base64 n'est qu'un encodage."
  - key: comparer-deux-secrets
    format: course
    question: "Comment comparer deux secrets en Go ?"
    choices:
      - {text: "En temps constant, avec `hmac.Equal` ou `subtle.ConstantTimeCompare`", correct: true}
      - {text: "Avec `==` sur les chaînes, que le compilateur optimise", correct: false}
      - {text: "Avec `bytes.Equal`, qui compare bien tous les octets", correct: false}
      - {text: "Avec `strings.EqualFold`, insensible à la casse", correct: false}
    answer: "En temps constant : `hmac.Equal` ou `subtle.ConstantTimeCompare`. `==` et `bytes.Equal` s'arrêtent au premier octet différent, et leur durée révèle combien d'octets sont justes."
  - key: mode-chiffrement-aes
    format: course
    question: "Quel mode utiliser pour chiffrer avec AES ?"
    choices:
      - {text: "GCM, un chiffrement authentifié, avec un nonce unique par message", correct: true}
      - {text: "ECB, le plus simple, sans nonce ni vecteur à gérer", correct: false}
      - {text: "CBC, avec un vecteur d'initialisation fixe pour tous les messages", correct: false}
      - {text: "GCM, avec un même nonce fixe, réutilisé pour tous les messages", correct: false}
    answer: "GCM chiffre et authentifie, à condition d'un nonce unique par message : un nonce réutilisé détruit la confidentialité et l'authenticité. ECB laisse voir les motifs, et un vecteur fixe en CBC fuit aussi."
  - key: permet-module-fips-140-3
    format: course
    question: "Que permet le module FIPS 140-3 de Go ?"
    choices:
      - {text: "Une cryptographie certifiable native (Go 1.24), activée par `GODEBUG=fips140` et `GOFIPS140`", correct: true}
      - {text: "Le chiffrement automatique de tout le trafic HTTP du programme, sans configuration", correct: false}
      - {text: "L'usage de BoringSSL par cgo, seule façon d'obtenir une certification en Go", correct: false}
      - {text: "La signature des binaires Go, exigée par les administrations américaines", correct: false}
    answer: "Depuis Go 1.24, la bibliothèque standard embarque un module cryptographique certifiable FIPS 140-3, en Go pur, activé par `GODEBUG=fips140` et `GOFIPS140`. Avant, il fallait la variante BoringCrypto, par cgo."
  - key: cryptographie-post-quantique
    format: course
    question: "Quelle cryptographie post-quantique la bibliothèque standard de Go fournit-elle ?"
    choices:
      - {text: "`crypto/mlkem` (1.24), des échanges TLS hybrides par défaut, `crypto/mldsa` (1.27), `crypto/hpke` (1.26)", correct: true}
      - {text: "Aucune : il faut passer par une bibliothèque C, appelée par cgo, comme liboqs", correct: false}
      - {text: "Seulement RSA à 8192 bits, considéré comme assez long pour résister", correct: false}
      - {text: "Un package `crypto/quantum`, ajouté en Go 1.21 pour TLS et SSH", correct: false}
    answer: "`crypto/mlkem` (Go 1.24) pour l'échange de clés, utilisé par défaut dans des échanges TLS hybrides, `crypto/hpke` (1.26) et `crypto/mldsa` (1.27) pour les signatures. Allonger une clé RSA ne la rend pas résistante à un ordinateur quantique."
  - key: jamais-utiliser-insecureskipverify
    format: course
    question: "Pourquoi ne jamais utiliser `InsecureSkipVerify` en production ?"
    choices:
      - {text: "Il désactive la vérification du certificat, et ouvre la porte à l'homme du milieu", correct: true}
      - {text: "Il désactive le chiffrement, et le trafic passe en clair sur le réseau", correct: false}
      - {text: "Il ralentit chaque connexion TLS d'une vérification supplémentaire", correct: false}
      - {text: "Il est déprécié depuis Go 1.20, et le code ne compile plus avec lui", correct: false}
    answer: "Le trafic reste chiffré, mais avec n'importe qui : sans vérification du certificat, un attaquant au milieu présente le sien. Pour un certificat interne, on ajoute son autorité aux `RootCAs`."
  - key: valider-jwt-correctement
    format: course
    question: "Comment valider correctement un JWT ?"
    choices:
      - {text: "Fixer l'algorithme attendu, vérifier la signature, puis `exp`, `iss` et `aud`", correct: true}
      - {text: "Décoder la charge utile en base64 et lire `sub`, sans vérifier la signature", correct: false}
      - {text: "Accepter l'algorithme annoncé dans l'en-tête du jeton, `none` compris", correct: false}
      - {text: "Vérifier la signature seulement : l'expiration est un champ facultatif", correct: false}
    answer: "Fixer l'algorithme attendu, vérifier la signature, puis l'expiration (`exp`), l'émetteur (`iss`) et l'audience (`aud`). Faire confiance à l'en-tête `alg` ouvre l'attaque `none` ou la confusion des clés."
  - key: apporte-http-crossoriginprotection
    format: course
    question: "Qu'apporte `http.CrossOriginProtection` ?"
    choices:
      - {text: "Une protection CSRF fondée sur les en-têtes `Sec-Fetch-Site` et `Origin` (Go 1.25)", correct: true}
      - {text: "Une configuration CORS, qui autorise d'autres origines à appeler l'API", correct: false}
      - {text: "Un filtre contre le XSS, appliqué aux réponses HTML du serveur", correct: false}
      - {text: "Une limite de débit par origine, contre les attaques par déni de service", correct: false}
    answer: "Depuis Go 1.25, ce middleware refuse les requêtes non sûres (POST, PUT...) venues d'une autre origine, d'après `Sec-Fetch-Site` et `Origin`, sans jeton CSRF. Ce n'est pas du CORS, qui autorise au contraire des origines."
  - key: implemente-verification-signature-webhook
    format: scenario
    question: "Tu vérifies la signature HMAC-SHA256 d'un webhook entrant. Sur quoi calcules-tu le HMAC, et comment le compares-tu à la signature reçue ?"
    choices:
      - {text: "Sur le corps brut, borné et lu avant tout décodage, comparé par `hmac.Equal`", correct: true}
      - {text: "Sur le JSON décodé puis réencodé, comparé par `==` entre chaînes hexadécimales", correct: false}
      - {text: "Sur le corps brut, comparé par `bytes.Equal`, plus simple à lire et aussi sûr", correct: false}
      - {text: "Sur les seuls en-têtes de la requête, comparés par `strings.EqualFold`", correct: false}
    answer: |-
      ```go
      func verifierSignature(secret []byte, corps []byte, signatureHex string) bool {
          mac := hmac.New(sha256.New, secret)
          mac.Write(corps)
          attendu := mac.Sum(nil)
          recu, err := hex.DecodeString(signatureHex)
          if err != nil {
              return false
          }
          return hmac.Equal(attendu, recu)      // comparaison en temps constant
      }
      ```
      La signature porte sur les octets exacts : on lit le corps brut, borné par `http.MaxBytesReader`, avant tout décodage ; réencoder le JSON changerait les octets. `hmac.Equal` compare en temps constant ; s'y ajoutent un horodatage signé contre le rejeu et un traitement idempotent.
  - key: terme-fips-140-3
    format: course
    question: "Que désigne « FIPS 140-3 » ?"
    choices:
      - {text: "Une norme américaine pour les modules cryptographiques, que Go suit nativement depuis 1.24", correct: true}
      - {text: "Un algorithme de chiffrement post-quantique, ajouté à la bibliothèque standard en Go 1.24", correct: false}
      - {text: "Une norme européenne de protection des données personnelles, proche du RGPD", correct: false}
      - {text: "La version 3 du protocole TLS, numérotée 140 dans les documents de l'IETF", correct: false}
    answer: "Une norme américaine (NIST) de validation des modules cryptographiques ; Go embarque un module natif depuis 1.24. Ce n'est ni un algorithme ni une version de TLS."
  - key: vf-math-rand
    format: true-false
    question: math/rand convient pour générer des jetons de réinitialisation de mot de passe.
    truth: false
    answer: Il est prévisible ; il faut crypto/rand.
  - key: vf-html-template
    format: true-false
    question: html/template échappe les données selon leur contexte (HTML, attribut, JavaScript, URL).
    truth: true
    answer: C'est sa protection contre le XSS.
  - key: vf-exec
    format: true-false
    question: '`exec.Command("convert", fichier)` passe fichier comme un seul argument, sans interprétation par un shell.'
    truth: true
    answer: Le danger vient de `sh -c` avec une entrée de l'utilisateur.
  - key: vf-sha256
    format: true-false
    question: Un SHA-256 du mot de passe suffit pour le stocker de façon sûre.
    truth: false
    answer: Il est trop rapide à attaquer ; on utilise bcrypt ou argon2id, avec sel et coût réglable.
  - key: qcm-reponses
    format: multiple-choice
    question: "Laquelle de ces réponses à un risque est mauvaise ?"
    choices:
      - {text: "Mot de passe : base64 avant stockage", correct: true}
      - {text: "Jeton de session : `crypto/rand`", correct: false}
      - {text: "Page HTML avec des données d'utilisateurs : `html/template`", correct: false}
      - {text: "Fichier demandé par son nom : `os.Root`", correct: false}
    answer: "base64 n'est qu'un encodage, réversible par tous : un mot de passe se hache avec bcrypt ou argon2id. Les trois autres réponses sont les bonnes."
  - key: qcm-comparer
    format: multiple-choice
    question: "Lesquelles de ces comparaisons conviennent pour vérifier la signature d'un webhook ?"
    choices:
      - text: '`hmac.Equal(recue, attendue)`'
        correct: true
      - text: '`subtle.ConstantTimeCompare(recue, attendue) == 1`'
        correct: true
      - text: '`string(recue) == string(attendue)`'
        correct: false
      - text: '`bytes.Equal(recue, attendue)`'
        correct: false
    answer: Une comparaison qui s'arrête au premier octet différent laisse fuir l'information par le temps.
  - key: qcm-tls
    format: multiple-choice
    question: "Un appel HTTPS échoue sur un certificat signé par l'autorité interne de l'entreprise. Que fais-tu ?"
    choices:
      - {text: "Ajouter l'autorité interne aux `RootCAs` du `tls.Config`", correct: true}
      - {text: "`InsecureSkipVerify: true`, en production aussi", correct: false}
      - {text: "Passer l'appel en HTTP, sur le réseau interne", correct: false}
      - {text: "Réessayer l'appel jusqu'à ce que la vérification passe", correct: false}
    answer: "On fait confiance à l'autorité interne en l'ajoutant aux `RootCAs` (ou l'on corrige le certificat du serveur). Désactiver la vérification ou passer en HTTP ouvre la porte à l'interception."
  - key: qcm-chiffrement
    format: multiple-choice
    question: "Lesquelles de ces pratiques sont correctes pour chiffrer des données ?"
    choices:
      - text: AES-GCM avec un nonce unique par message
        correct: true
      - text: chacha20poly1305 de golang.org/x/crypto
        correct: true
      - text: AES en mode ECB
        correct: false
      - text: Réutiliser le même nonce pour tous les messages
        correct: false
    answer: Un nonce réutilisé avec GCM détruit la confidentialité et l'authenticité.
  - key: bug-math-rand
    format: bug-fix
    question: |-
      Un audit signale des jetons d'invitation prévisibles. Quelle correction est la bonne ?
      ```go
      b := make([]byte, 16)
      for i := range b {
      	b[i] = byte(mrand.IntN(256)) // math/rand/v2
      }
      jeton := hex.EncodeToString(b)
      ```
    choices:
      - {text: "`rand.Text()` de `crypto/rand` (Go 1.24)", correct: true}
      - {text: "32 octets au lieu de 16, toujours avec `math/rand/v2`", correct: false}
      - {text: "Une graine `time.Now().UnixNano()` pour `math/rand`", correct: false}
      - {text: "Un encodage base64 au lieu de l'hexadécimal", correct: false}
    answer: |-
      ```go
      jeton := rand.Text() // crypto/rand, Go 1.24
      ```
      Un jeton de sécurité doit venir de `crypto/rand` ; `rand.Text` en produit un de 128 bits, prêt à l'emploi. Allonger le jeton ou changer son encodage ne rend pas la source imprévisible.
  - key: bug-text-template
    format: bug-fix
    question: |-
      Un commentaire qui contient `<script>` s'exécute dans le navigateur des visiteurs. Quelle correction est la bonne ?
      ```go
      import "text/template"

      tmpl := template.Must(template.New("page").Parse(`<p>{{.Commentaire}}</p>`))
      ```
    choices:
      - {text: "Importer `html/template` au lieu de `text/template`, sans autre changement", correct: true}
      - {text: "Retirer les balises `<script>` du commentaire avec `strings.ReplaceAll`", correct: false}
      - {text: "Entourer `{{.Commentaire}}` d'une balise `<pre>` dans le modèle", correct: false}
      - {text: "Refuser tout commentaire qui ne contient pas que des lettres", correct: false}
    answer: |-
      ```go
      import "html/template"

      tmpl := template.Must(template.New("page").Parse(`<p>{{.Commentaire}}</p>`))
      ```
      `text/template` n'échappe rien ; `html/template` échappe selon le contexte HTML. Retirer `<script>` à la main se contourne (`<img onerror=...>`), et `<pre>` n'échappe rien.
  - key: bug-shell
    format: bug-fix
    question: |-
      Un nom de fichier comme `a.png; rm -rf /` exécute une commande. Quelle correction est la bonne ?
      ```go
      exec.Command("sh", "-c", "convert "+nom+" vignette.png").Run()
      ```
    choices:
      - {text: "Appeler `convert` sans shell, le nom en argument séparé, après `--`", correct: true}
      - {text: "Entourer `nom` de guillemets simples dans la chaîne passée à `sh -c`", correct: false}
      - {text: "Retirer les `;` du nom avec `strings.ReplaceAll` avant l'appel", correct: false}
      - {text: "Remplacer `sh` par `bash`, qui sépare mieux les arguments", correct: false}
    answer: |-
      ```go
      exec.CommandContext(ctx, "convert", "--", nom, "vignette.png").Run()
      ```
      Sans shell, le nom est un argument et n'est jamais interprété ; « -- » empêche aussi qu'il soit pris pour une option. Des guillemets ou un filtre sur `;` se contournent (une apostrophe dans le nom, `$(...)`, `|`).
  - key: bug-comparaison
    format: bug-fix
    question: |-
      Cette vérification de la clé d'API est vulnérable à une attaque temporelle. Quelle correction est la bonne ?
      ```go
      if r.Header.Get("X-Api-Key") != cleAttendue {
      	http.Error(w, "interdit", http.StatusUnauthorized)
      	return
      }
      ```
    choices:
      - {text: "`subtle.ConstantTimeCompare` sur les deux clés, en `[]byte`", correct: true}
      - {text: "`bytes.Equal` sur les deux clés, plus rapide que `!=`", correct: false}
      - {text: "`strings.Compare(recue, cleAttendue) != 0`", correct: false}
      - {text: "Un `time.Sleep` aléatoire avant de répondre « interdit »", correct: false}
    answer: |-
      ```go
      recue := r.Header.Get("X-Api-Key")
      if subtle.ConstantTimeCompare([]byte(recue), []byte(cleAttendue)) != 1 {
      	http.Error(w, "interdit", http.StatusUnauthorized)
      	return
      }
      ```
      La comparaison en temps constant ne révèle pas, par sa durée, combien de caractères sont justes. `bytes.Equal` et `strings.Compare` s'arrêtent au premier écart, et un délai aléatoire se moyenne sur de nombreux essais.
  - key: scenario-revue
    format: scenario
    question: En revue de sécurité d'un service Go, que vérifies-tu en priorité ?
    choices:
      - {text: "Entrées bornées, SQL paramétré, `html/template`, pas de shell, `crypto/rand`, TLS vérifié, govulncheck", correct: true}
      - {text: "Surtout le style et le formatage, que `gofmt` ne couvre pas entièrement à lui seul", correct: false}
      - {text: "Les performances d'abord, puisqu'un service lent est une faille de déni de service", correct: false}
      - {text: "Rien de particulier : Go étant sûr en mémoire, un service Go est sûr par construction", correct: false}
    answer: "Les entrées (tailles bornées, délais du serveur, validation), les requêtes SQL paramétrées, `html/template` pour le HTML, aucune commande via un shell, `os.Root` pour les chemins, `crypto/rand` pour les secrets, bcrypt ou argon2id, les comparaisons en temps constant, TLS vérifié, les secrets hors du dépôt et des journaux, l'autorisation par ressource, et govulncheck et gosec dans la CI. La sûreté mémoire n'empêche aucune de ces failles."
  - key: scenario-mots-de-passe
    format: scenario
    question: Comment stockes-tu et vérifies-tu les mots de passe des utilisateurs ?
    choices:
      - {text: "bcrypt ou argon2id, `CompareHashAndPassword`, tentatives limitées et message d'erreur neutre", correct: true}
      - {text: "SHA-256 salé, comparé avec `==`, et un message qui dit si l'identifiant existe", correct: false}
      - {text: "Chiffrés en AES-GCM, pour pouvoir les renvoyer à l'utilisateur qui les oublie", correct: false}
      - {text: "En clair, dans une table protégée par les droits d'accès de la base de données", correct: false}
    answer: "Avec bcrypt (`bcrypt.GenerateFromPassword`, coût d'au moins 10) ou argon2id, qui salent et restent lents pour un attaquant ; `bcrypt.CompareHashAndPassword` compare en temps constant. Je limite les tentatives, je ne dis pas si c'est l'identifiant ou le mot de passe qui est faux, et je recalcule le hash avec un coût plus élevé à la connexion suivante quand je l'augmente."
  - key: scenario-webhook
    format: scenario
    question: Comment vérifies-tu la signature d'un webhook entrant signé en HMAC-SHA256 ?
    choices:
      - {text: "Corps brut borné, HMAC du corps (et de l'horodatage), `hmac.Equal`, refus des messages trop anciens", correct: true}
      - {text: "Décoder le JSON, recalculer le HMAC sur la struct, et traiter le contenu pendant la vérification", correct: false}
      - {text: "Comparer la signature reçue à celle du message précédent, qui doit toujours être identique", correct: false}
      - {text: "Vérifier seulement l'adresse IP de l'émetteur, plus fiable qu'une signature calculée", correct: false}
    answer: "Je lis le corps brut (borné par `MaxBytesReader`) avant tout décodage, je calcule `hmac.New(sha256.New, secret)` sur ce corps (et l'horodatage si le fournisseur le signe), puis je compare avec la signature reçue par `hmac.Equal`, en temps constant. Je refuse les horodatages trop anciens, contre le rejeu, et je ne traite le contenu qu'après la vérification."
