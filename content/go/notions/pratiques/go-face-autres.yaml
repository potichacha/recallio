notion: go-face-autres
cards:
  - key: exceptions
    format: course
    question: Go a-t-il des exceptions ?
    answer: Non, des valeurs d'erreur et, pour les bugs, panic/recover.
  - key: vs-rust-phrase
    format: course
    question: Go vs Rust en une phrase ?
    answer: Go privilégie la simplicité avec un GC ; Rust la sûreté mémoire sans GC et le contrôle fin, au prix de la complexité.
  - key: gil-comme-python
    format: course
    question: Go a-t-il un GIL comme Python ?
    answer: Non, les goroutines s'exécutent en parallèle sur tous les cœurs.
  - key: types-somme
    format: course
    question: Go a-t-il des types somme ?
    answer: Non ; on les simule avec des interfaces fermées (méthode non exportée) et un type switch.
