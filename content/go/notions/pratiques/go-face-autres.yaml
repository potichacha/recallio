notion: go-face-autres
lesson: |-
  Savoir **quand choisir Go** (et quand ne pas le faire) face aux autres langages courants :

  **Go face à Rust** : Rust garantit la sûreté mémoire **sans ramasse-miettes** (propriété et emprunts vérifiés à la
  compilation), offre des abstractions à coût nul et des performances proches du C, mais demande un apprentissage long
  et compile lentement. Go est plus simple et plus rapide à écrire, avec un GC à faible latence. Rust pour les systèmes,
  l'embarqué, les moteurs à très hautes performances ou sans pauses du tout ; Go pour les services réseau et les outils.

  **Go face à Python** : Python est imbattable pour le prototypage, la science des données et l'apprentissage
  automatique, avec un écosystème immense ; mais il est interprété, plus lent pour le calcul pur, et sa concurrence
  est historiquement limitée par le **GIL** (en cours d'assouplissement). Go est typé statiquement, compilé, bien plus
  rapide et parallèle. Python pour les données et les scripts, Go pour les services à fort trafic et les outils
  distribués.

  **Go face à Node.js** : Node excelle pour les entrées-sorties grâce à sa boucle d'événements, et partage JavaScript ou
  TypeScript avec le frontend ; mais il n'a qu'un thread de calcul par processus, et le code asynchrone (promesses,
  async/await) se propage partout. Go écrit du code **bloquant** simple, que le runtime rend concurrent, et utilise tous
  les cœurs.

  Ce qui manque à Go par rapport à ces langages : des **types somme** (énumérations avec données) et le filtrage par
  motifs, la gestion d'erreurs concise de Rust (`?`), et des écosystèmes spécialisés (données en Python, frontend en
  JavaScript).

  **En entretien** : répondre par les **critères** (performance, latence, sûreté, vitesse de développement, écosystème,
  compétences de l'équipe) plutôt que par goût. Go se distingue par son équilibre : assez rapide, simple, concurrent, et
  facile à déployer.
cards:
  - key: exceptions
    format: course
    question: Go a-t-il des exceptions ?
    answer: Non, des valeurs d'erreur et, pour les bugs, panic/recover.
  - key: vs-rust-phrase
    format: course
    question: Go vs Rust en une phrase ?
    answer: Go privilégie la simplicité avec un GC ; Rust la sûreté mémoire sans GC et le contrôle fin, au prix de la complexité.
  - key: gil-comme-python
    format: course
    question: Go a-t-il un GIL comme Python ?
    answer: Non, les goroutines s'exécutent en parallèle sur tous les cœurs.
  - key: types-somme
    format: course
    question: Go a-t-il des types somme ?
    answer: Non ; on les simule avec des interfaces fermées (méthode non exportée) et un type switch.
  - key: vf-rust-gc
    format: true-false
    question: Rust garantit la sûreté mémoire sans ramasse-miettes.
    truth: true
    answer: Par son système de propriété et d'emprunts vérifié à la compilation.
  - key: vf-node
    format: true-false
    question: Un processus Node.js exécute le JavaScript sur un seul thread principal.
    truth: true
    answer: Les worker threads existent, mais le modèle reste la boucle d'événements.
  - key: vf-types-somme
    format: true-false
    question: Go a des types somme avec filtrage par motifs, comme les enums de Rust.
    truth: false
    answer: On les simule avec des interfaces et des switch sur le type.
  - key: vf-python
    format: true-false
    question: Pour un calcul intensif en pur code, Go est en général bien plus rapide que Python.
    truth: true
    answer: Go est compilé ; Python s'appuie sur des bibliothèques en C pour être rapide.
  - key: qcm-choix
    format: multiple-choice
    question: Quel langage est le plus naturel pour chaque besoin ?
    choices:
      - text: 'Un pilote embarqué sans allocation dynamique : Rust'
        correct: true
      - text: 'Un modèle d''apprentissage automatique : Python'
        correct: true
      - text: 'Un service réseau à fort trafic, maintenu par une équipe variée : Go'
        correct: true
      - text: 'Un script de cinq lignes sur une machine sans compilateur : Rust'
        correct: false
    answer: Le choix dépend des contraintes, pas du goût.
  - key: qcm-go-forces
    format: multiple-choice
    question: Quelles forces de Go reviennent dans les comparaisons ?
    choices:
      - text: Une concurrence simple qui utilise tous les cœurs
        correct: true
      - text: Un apprentissage rapide et un code uniforme
        correct: true
      - text: Un déploiement par binaire statique
        correct: true
      - text: L'absence totale de pauses du GC
        correct: false
    answer: Les pauses sont très courtes, mais existent ; Rust n'en a pas.
  - key: qcm-manques
    format: multiple-choice
    question: Que reproche-t-on souvent à Go face à Rust ou TypeScript ?
    choices:
      - text: L'absence de types somme et de filtrage par motifs
        correct: true
      - text: Une gestion d'erreurs verbeuse (if err != nil)
        correct: true
      - text: Des énumérations limitées (constantes iota)
        correct: true
      - text: L'absence de compilation
        correct: false
    answer: Ces choix servent la simplicité, au prix de l'expressivité.
  - key: qcm-node
    format: multiple-choice
    question: Quelles différences entre Go et Node.js pour un service web ?
    choices:
      - text: Go utilise tous les cœurs d'un processus, Node un thread de JavaScript par processus
        correct: true
      - text: En Go, le code bloquant est concurrent ; en Node, il faut des promesses et async/await
        correct: true
      - text: Node partage le langage avec le frontend
        correct: true
      - text: Node est compilé en binaire natif par défaut
        correct: false
    answer: Node exécute du JavaScript avec un JIT (V8).
  - key: scenario-rust
    format: scenario
    question: Ton équipe hésite entre Go et Rust pour un nouveau service. Comment tranches-tu ?
    answer: |-
      Je pars des contraintes : si le service doit tenir des latences très strictes sans aucune pause, s'exécuter sur des
      ressources très limitées ou manipuler la mémoire finement, Rust se justifie. Pour un service réseau classique, Go
      donne des performances suffisantes, se développe plus vite et se recrute plus facilement. Je pèse aussi l'expérience
      de l'équipe et l'écosystème des bibliothèques nécessaires, et je peux prototyper le chemin critique dans les deux.
  - key: scenario-python
    format: scenario
    question: Un service de traitement écrit en Python ne tient plus la charge. Faut-il le réécrire en Go ?
    answer: |-
      D'abord mesurer : si le temps part dans des calculs en pur Python ou dans la gestion de nombreuses connexions, Go
      apportera beaucoup (compilé, parallèle). S'il part dans des bibliothèques numériques en C (NumPy) ou dans la base de
      données, la réécriture changera peu. Une option intermédiaire : réécrire en Go seulement la partie chaude (le
      service d'ingestion) et garder Python pour la logique de données.
  - key: scenario-node
    format: scenario
    question: Pourquoi des équipes passent-elles de Node.js à Go pour certains services ?
    answer: |-
      Pour utiliser tous les cœurs sans gérer un groupe de processus, réduire la mémoire et la latence sous forte charge,
      remplacer un code asynchrone complexe par du code séquentiel simple que le runtime rend concurrent, et livrer un
      binaire sans node_modules. Elles gardent souvent Node ou TypeScript pour le backend du frontend (BFF) et le rendu
      côté serveur, où partager le langage avec le frontend compte.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande dans quels cas tu ne choisirais pas Go.
    answer: |-
      Pour l'apprentissage automatique et l'analyse de données (l'écosystème Python est sans égal), pour du code système
      ou embarqué sans GC (Rust ou C), pour une interface web (TypeScript), pour une application mobile native, ou quand
      l'équipe et le code existant sont dans un autre écosystème qui répond déjà au besoin. Go brille pour les services,
      les outils et l'infrastructure cloud.
