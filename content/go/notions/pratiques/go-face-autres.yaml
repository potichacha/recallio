notion: go-face-autres
lesson: |-
  Savoir **quand choisir Go** (et quand ne pas le faire) face aux autres langages courants :

  **Go face à Rust** : Rust garantit la sûreté mémoire **sans ramasse-miettes** (propriété et emprunts vérifiés à la
  compilation), offre des abstractions à coût nul et des performances proches du C, mais demande un apprentissage long
  et compile lentement. Go est plus simple et plus rapide à écrire, avec un GC à faible latence. Rust pour les systèmes,
  l'embarqué, les moteurs à très hautes performances ou sans pauses du tout ; Go pour les services réseau et les outils.

  **Go face à Python** : Python est imbattable pour le prototypage, la science des données et l'apprentissage
  automatique, avec un écosystème immense ; mais il est interprété, plus lent pour le calcul pur, et sa concurrence
  est historiquement limitée par le **GIL** (en cours d'assouplissement). Go est typé statiquement, compilé, bien plus
  rapide et parallèle. Python pour les données et les scripts, Go pour les services à fort trafic et les outils
  distribués.

  **Go face à Node.js** : Node excelle pour les entrées-sorties grâce à sa boucle d'événements, et partage JavaScript ou
  TypeScript avec le frontend ; mais il n'a qu'un thread de calcul par processus, et le code asynchrone (promesses,
  async/await) se propage partout. Go écrit du code **bloquant** simple, que le runtime rend concurrent, et utilise tous
  les cœurs.

  Ce qui manque à Go par rapport à ces langages : des **types somme** (énumérations avec données) et le filtrage par
  motifs, la gestion d'erreurs concise de Rust (`?`), et des écosystèmes spécialisés (données en Python, frontend en
  JavaScript).

  **En entretien** : répondre par les **critères** (performance, latence, sûreté, vitesse de développement, écosystème,
  compétences de l'équipe) plutôt que par goût. Go se distingue par son équilibre : assez rapide, simple, concurrent, et
  facile à déployer.
cards:
  - key: exceptions
    format: course
    question: Go a-t-il des exceptions ?
    choices:
      - {text: "Non : des valeurs `error` renvoyées et, pour les bugs, `panic` et `recover`", correct: true}
      - {text: "Oui : `panic` et `recover` sont ses `throw` et `catch`, pour toute erreur", correct: false}
      - {text: "Oui, depuis Go 1.13 : `errors.Is` et `errors.As` servent de blocs `catch`", correct: false}
      - {text: "Non, et aucune erreur ne peut interrompre un programme Go en cours d'exécution", correct: false}
    answer: "Non : une fonction qui peut échouer renvoie une `error` que l'appelant teste. `panic` et `recover` existent pour les erreurs de programmation, pas pour le contrôle normal du flot."
  - key: vs-rust-phrase
    format: course
    question: "Comment résumer Go face à Rust, en une phrase ?"
    choices:
      - {text: "Go mise sur la simplicité avec un GC ; Rust sur la sûreté mémoire sans GC et le contrôle fin", correct: true}
      - {text: "Go est sûr en mémoire sans GC ; Rust a un GC, mais un langage plus simple à apprendre", correct: false}
      - {text: "Go et Rust ont tous deux un GC, mais Rust compile plus vite et produit des binaires plus petits", correct: false}
      - {text: "Go vise l'embarqué sans allocation ; Rust, les services web à forte concurrence", correct: false}
    answer: "Go privilégie la simplicité avec un ramasse-miettes ; Rust la sûreté mémoire sans GC et le contrôle fin, au prix de la complexité (possession, durées de vie)."
  - key: gil-comme-python
    format: course
    question: "Go a-t-il un verrou global de l'interpréteur (GIL), comme CPython ?"
    choices:
      - {text: "Non : les goroutines s'exécutent en parallèle sur tous les cœurs", correct: true}
      - {text: "Oui : une seule goroutine exécute du code Go à un instant donné", correct: false}
      - {text: "Oui, mais seulement pour les goroutines qui allouent de la mémoire", correct: false}
      - {text: "Non, mais `GOMAXPROCS` vaut 1 par défaut, ce qui revient au même", correct: false}
    answer: "Non : le runtime répartit les goroutines sur `GOMAXPROCS` threads, par défaut un par cœur disponible. Les accès partagés se protègent donc vraiment, avec des mutex ou des channels."
  - key: types-somme
    format: course
    question: Go a-t-il des types somme ?
    choices:
      - {text: "Non : on les simule par une interface fermée (méthode non exportée) et un `switch` de type", correct: true}
      - {text: "Oui : les unions `int | string` des génériques déclarent des types somme pour les variables", correct: false}
      - {text: "Oui : les constantes `iota` portent des données, comme les `enum` de Rust ou de Swift", correct: false}
      - {text: "Non, et un `switch` de type ne peut pas distinguer les types concrets d'une interface", correct: false}
    answer: "Non : on les simule par une interface fermée (une méthode non exportée) et un `switch` sur le type, sans vérification d'exhaustivité. Une union `int | string` n'existe que comme contrainte de généricité, pas comme type de variable."
  - key: vf-rust-gc
    format: true-false
    question: Rust garantit la sûreté mémoire sans ramasse-miettes.
    truth: true
    answer: Par son système de propriété et d'emprunts vérifié à la compilation.
  - key: vf-node
    format: true-false
    question: Un processus Node.js exécute le JavaScript sur un seul thread principal.
    truth: true
    answer: Les worker threads existent, mais le modèle reste la boucle d'événements.
  - key: vf-types-somme
    format: true-false
    question: Go a des types somme avec filtrage par motifs, comme les enums de Rust.
    truth: false
    answer: On les simule avec des interfaces et des switch sur le type.
  - key: vf-python
    format: true-false
    question: Pour un calcul intensif en pur code, Go est en général bien plus rapide que Python.
    truth: true
    answer: Go est compilé ; Python s'appuie sur des bibliothèques en C pour être rapide.
  - key: qcm-choix
    format: multiple-choice
    question: "Laquelle de ces associations entre un besoin et un langage est la moins naturelle ?"
    choices:
      - {text: "Un script de cinq lignes, sur une machine sans compilateur : Rust", correct: true}
      - {text: "Un pilote embarqué sans allocation dynamique : Rust", correct: false}
      - {text: "Un modèle d'apprentissage automatique : Python", correct: false}
      - {text: "Un service réseau à fort trafic, maintenu par une équipe variée : Go", correct: false}
    answer: "Sur une machine sans compilateur, un script Python ou shell s'impose ; Rust demande une compilation. Les autres associations suivent les contraintes : pas d'allocation dynamique, écosystème de données, concurrence et équipe variée."
  - key: qcm-go-forces
    format: multiple-choice
    question: "Laquelle de ces forces attribue-t-on à tort à Go ?"
    choices:
      - {text: "L'absence totale de pauses du GC", correct: true}
      - {text: "Une concurrence simple qui utilise tous les cœurs", correct: false}
      - {text: "Un apprentissage rapide et un code uniforme", correct: false}
      - {text: "Un déploiement par binaire statique", correct: false}
    answer: "Le GC de Go a des pauses très courtes, mais il en a ; Rust n'en a pas. La concurrence simple sur tous les cœurs, l'apprentissage rapide, le code uniforme et le binaire statique sont de vraies forces."
  - key: qcm-manques
    format: multiple-choice
    question: "Lequel de ces reproches faits à Go, face à Rust ou TypeScript, est infondé ?"
    choices:
      - {text: "L'absence de compilation, qui laisse passer les erreurs de type", correct: true}
      - {text: "L'absence de types somme et de filtrage par motifs", correct: false}
      - {text: "Une gestion d'erreurs verbeuse (`if err != nil`)", correct: false}
      - {text: "Des énumérations limitées (constantes `iota`)", correct: false}
    answer: "Go est compilé et typé statiquement. Les autres reproches sont fondés : pas de types somme ni de filtrage par motifs, des `if err != nil` verbeux, des énumérations réduites à des constantes `iota` ; ces choix servent la simplicité."
  - key: qcm-node
    format: multiple-choice
    question: "Laquelle de ces différences entre Go et Node.js, pour un service web, est fausse ?"
    choices:
      - {text: "Node est compilé en binaire natif par défaut", correct: true}
      - {text: "Go utilise tous les cœurs d'un processus, Node un seul thread de JavaScript par processus", correct: false}
      - {text: "En Go, le code bloquant est concurrent ; en Node, il faut des promesses et async/await", correct: false}
      - {text: "Node partage le langage avec le frontend", correct: false}
    answer: "Node exécute du JavaScript avec un JIT (V8), sans binaire natif. Le reste est juste : Go utilise tous les cœurs d'un processus, son code bloquant est concurrent sans `async`, et Node partage le langage du frontend."
  - key: scenario-rust
    format: scenario
    question: Ton équipe hésite entre Go et Rust pour un nouveau service. Comment tranches-tu ?
    choices:
      - {text: "Selon les contraintes : Rust pour une latence sans pause ou des ressources minimes, Go sinon", correct: true}
      - {text: "Rust, toujours : il est plus rapide que Go dans tous les cas, donc plus sûr pour l'avenir", correct: false}
      - {text: "Go, toujours : la facilité de recrutement l'emporte sur toutes les contraintes techniques", correct: false}
      - {text: "Selon la popularité du moment, mesurée par les classements annuels des langages", correct: false}
    answer: "Je pars des contraintes : des latences très strictes sans aucune pause, des ressources très limitées ou une gestion fine de la mémoire justifient Rust. Pour un service réseau classique, Go suffit en performances, se développe plus vite et se recrute plus facilement ; je pèse aussi l'expérience de l'équipe et l'écosystème, et je peux prototyper le chemin critique dans les deux."
  - key: scenario-python
    format: scenario
    question: Un service de traitement écrit en Python ne tient plus la charge. Faut-il le réécrire en Go ?
    choices:
      - {text: "D'abord mesurer où part le temps : Go aide si c'est du Python pur ou des connexions", correct: true}
      - {text: "Oui, toujours : Go est compilé, donc plus rapide que Python sur tous les traitements", correct: false}
      - {text: "Non, jamais : il suffit d'ajouter des processus Python jusqu'à tenir la charge", correct: false}
      - {text: "Oui, et d'un coup : une réécriture partielle laisserait deux langages à maintenir", correct: false}
    answer: "D'abord mesurer : si le temps part dans des calculs en pur Python ou dans la gestion de nombreuses connexions, Go apportera beaucoup. S'il part dans des bibliothèques numériques en C (NumPy) ou dans la base de données, la réécriture changera peu ; on peut aussi ne réécrire en Go que la partie chaude."
  - key: scenario-node
    format: scenario
    question: Pourquoi des équipes passent-elles de Node.js à Go pour certains services ?
    choices:
      - {text: "Tous les cœurs sans groupe de processus, moins de mémoire, du code séquentiel, un binaire", correct: true}
      - {text: "Parce que Node ne sait pas servir de requêtes HTTP concurrentes, contrairement à Go", correct: false}
      - {text: "Parce que Go partage son langage avec le frontend, ce qui simplifie l'équipe", correct: false}
      - {text: "Parce que Node n'a aucun typage, et que TypeScript ne tourne pas côté serveur", correct: false}
    answer: "Pour utiliser tous les cœurs sans gérer un groupe de processus, réduire la mémoire et la latence sous forte charge, remplacer un code asynchrone complexe par du code séquentiel que le runtime rend concurrent, et livrer un binaire sans `node_modules`. Node garde l'avantage pour le BFF et le rendu côté serveur, où partager le langage du frontend compte."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande dans quels cas tu ne choisirais pas Go. Que réponds-tu ?"
    choices:
      - {text: "Apprentissage automatique, embarqué sans GC, interface web, mobile natif, ou un existant ailleurs", correct: true}
      - {text: "Les services réseau à fort trafic, où les pauses du GC de Go sont rédhibitoires", correct: false}
      - {text: "Les outils en ligne de commande, que ses binaires rendent lourds à distribuer", correct: false}
      - {text: "Aucun : Go convient aussi bien à l'embarqué qu'au navigateur et au mobile", correct: false}
    answer: "Pour l'apprentissage automatique et l'analyse de données (l'écosystème Python), du code système ou embarqué sans GC (Rust ou C), une interface web (TypeScript), une application mobile native, ou quand l'existant répond déjà au besoin dans un autre écosystème. Go brille au contraire pour les services, les outils en ligne de commande et l'infrastructure cloud."
