notion: proverbes-go
lesson: |-
  Les **proverbes de Go** (Rob Pike, 2015) résument la philosophie du langage. Les plus cités :

  | Proverbe | Ce qu'il veut dire |
  |---|---|
  | *Don't communicate by sharing memory, share memory by communicating.* | faire circuler les données par channels plutôt que les partager sous verrou |
  | *Concurrency is not parallelism.* | structurer en tâches indépendantes n'est pas exécuter en même temps |
  | *The bigger the interface, the weaker the abstraction.* | des interfaces petites, d'une ou deux méthodes |
  | *Make the zero value useful.* | une variable déclarée doit fonctionner sans initialisation |
  | *interface{} says nothing.* | `any` ne dit rien du type : à éviter quand un type précis existe |
  | *A little copying is better than a little dependency.* | recopier dix lignes plutôt qu'importer une bibliothèque |
  | *Clear is better than clever.* | le code lisible avant le code astucieux |
  | *Errors are values.* | une erreur se manipule comme n'importe quelle valeur |
  | *Don't just check errors, handle them gracefully.* | ajouter du contexte, décider, pas seulement remonter |
  | *Reflection is never clear.* | la réflexion en dernier recours |
  | *Don't panic.* | les paniques pour les erreurs de programmation, pas pour le contrôle normal |
  | *Gofmt's style is no one's favorite, yet gofmt is everyone's favorite.* | un format unique supprime les débats |

  Au quotidien, cela donne un style reconnaissable :
  - le **chemin heureux aligné à gauche** : on traite l'erreur et l'on sort tôt, sans `else` imbriqués ;
  - peu d'abstractions, introduites quand un **besoin réel** apparaît ;
  - des dépendances choisies avec soin ;
  - les guides de référence : *Effective Go*, les *Go Code Review Comments*, le *Google Go Style Guide*.

  **En entretien** : savoir citer et **illustrer** trois ou quatre proverbes par un exemple de code (petite interface,
  valeur zéro, erreurs comme valeurs, clarté plutôt qu'astuce) montre qu'on a compris l'esprit du langage.
cards:
  - key: trouver-conventions-style
    format: course
    question: Où trouver les conventions de style Go ?
    answer: Effective Go, Go Code Review Comments, le Google Go Style Guide, et gofmt.
  - key: signifie-little-copying-is-better-than
    format: course
    question: Que signifie "a little copying is better than a little dependency" ?
    answer: Dupliquer quelques lignes plutôt qu'ajouter une dépendance pour un besoin minime.
  - key: aligner-chemin-heureux-gauche
    format: course
    question: Pourquoi aligner le chemin heureux à gauche ?
    answer: Traiter les erreurs tôt et retourner rend le flux principal lisible sans imbrication.
  - key: limiter-reflexion
    format: course
    question: Pourquoi limiter la réflexion ?
    answer: Lente, non vérifiée à la compilation et peu lisible ; generics et génération de code la remplacent souvent.
  - key: citez-anti-patterns
    format: course
    question: Citez des anti-patterns Go.
    answer: Interfaces prématurées, utils, panic comme contrôle de flux, goroutines sans fin, état global, interface{} partout.
  - key: contient-bon-rendu-test-technique
    format: course
    question: Que contient un bon rendu de test technique Go ?
    answer: Code formaté et linté, tests avec -race, README avec lancement, choix, hypothèses et limites.
  - key: vf-copier
    format: true-false
    question: « A little copying is better than a little dependency » invite à recopier quelques lignes plutôt qu'ajouter une dépendance.
    truth: true
    answer: Une dépendance coûte en sécurité, en mises à jour et en compilation.
  - key: vf-concurrence
    format: true-false
    question: Selon les proverbes, concurrence et parallélisme sont la même chose.
    truth: false
    answer: La concurrence structure le programme ; le parallélisme exécute en même temps.
  - key: vf-interface
    format: true-false
    question: « The bigger the interface, the weaker the abstraction » encourage les interfaces d'une ou deux méthodes.
    truth: true
    answer: Comme io.Reader ou fmt.Stringer.
  - key: vf-panic
    format: true-false
    question: « Don't panic » signifie qu'on ne doit jamais appeler panic.
    truth: false
    answer: On la réserve aux erreurs de programmation ou aux états impossibles, pas au contrôle normal.
  - key: qcm-illustrations
    format: multiple-choice
    question: Quelles illustrations correspondent au bon proverbe ?
    choices:
      - text: 'sync.Mutex utilisable sans initialisation : make the zero value useful'
        correct: true
      - text: 'io.Reader et sa seule méthode : the bigger the interface, the weaker the abstraction'
        correct: true
      - text: 'errors.Join et les erreurs enveloppées : errors are values'
        correct: true
      - text: 'Une fonction remplie de réflexion : clear is better than clever'
        correct: false
    answer: La réflexion va à l'encontre de « reflection is never clear ».
  - key: qcm-style
    format: multiple-choice
    question: Quelles pratiques découlent de cette philosophie ?
    choices:
      - text: Traiter l'erreur et sortir tôt, chemin heureux à gauche
        correct: true
      - text: Introduire une interface quand un besoin réel apparaît
        correct: true
      - text: gofmt sur tout le code
        correct: true
      - text: Une hiérarchie de types abstraits prévue dès le départ
        correct: false
    answer: Go préfère le concret et l'abstraction tardive.
  - key: qcm-any
    format: multiple-choice
    question: Que veut dire « interface{} says nothing » ?
    choices:
      - text: 'Un paramètre any ne dit rien de ce qu''il attend : le compilateur ne vérifie plus rien'
        correct: true
      - text: Il faut préférer un type précis ou un générique contraint
        correct: true
      - text: interface{} est interdit depuis Go 1.18
        correct: false
      - text: any est plus rapide qu'un type précis
        correct: false
    answer: any est un alias de interface{}, toujours permis.
  - key: qcm-guides
    format: multiple-choice
    question: Où trouver les conventions de style de référence ?
    choices:
      - text: Effective Go
        correct: true
      - text: Go Code Review Comments
        correct: true
      - text: Le Google Go Style Guide
        correct: true
      - text: La spécification du langage, pour le style
        correct: false
    answer: La spécification définit le langage, pas le style.
  - key: scenario-clair
    format: scenario
    question: Illustre « Clear is better than clever » par un exemple concret.
    answer: |-
      Une fonction qui calcule une remise en une ligne d'opérateurs imbriqués et de manipulations de bits est « astucieuse »,
      mais personne ne la relit sans erreur. Je préfère quelques if nommés (`if client.Fidele() { ... }`), une
      variable intermédiaire au nom parlant, et un test de table qui montre les cas. Le compilateur optimise aussi bien,
      et le prochain lecteur comprend du premier coup.
  - key: scenario-dependance
    format: scenario
    question: Un collègue veut ajouter une bibliothèque de 20 dépendances pour une fonction de 15 lignes. Que lui réponds-tu ?
    answer: |-
      « A little copying is better than a little dependency » : chaque dépendance ajoute du code à auditer, des
      vulnérabilités possibles, des mises à jour et un temps de compilation. Pour 15 lignes stables, je recopie (avec la
      licence et un test), ou je les réécris. J'ajoute une dépendance quand elle apporte beaucoup (un pilote, un protocole)
      et qu'elle est bien maintenue.
  - key: scenario-erreurs
    format: scenario
    question: Explique « Errors are values » avec un exemple.
    answer: |-
      Une erreur est une valeur ordinaire qu'on peut stocker, comparer, envelopper et programmer. Par exemple, un
      `bufio.Scanner` ou un écrivain qui garde la première erreur (sticky error) : on enchaîne les écritures sans tester
      chacune, puis on vérifie une seule fois `w.Err()`. Ou `errors.Join` pour collecter toutes les erreurs de validation
      avant de les renvoyer ensemble.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande ce qui distingue le style Go de celui de Java.
    answer: |-
      Go privilégie le code explicite et simple : pas d'exceptions mais des erreurs valeurs traitées sur place, des
      interfaces petites et implicites définies chez l'utilisateur, la composition au lieu de l'héritage, peu de magie
      (pas d'annotations ni d'injection par réflexion), un format unique imposé par gofmt. Le résultat est un code plus
      verbeux par endroits, mais lisible par n'importe quel développeur Go sans connaître un framework.
