notion: proverbes-go
lesson: |-
  Les **proverbes de Go** (Rob Pike, 2015) résument la philosophie du langage. Les plus cités :

  | Proverbe | Ce qu'il veut dire |
  |---|---|
  | *Don't communicate by sharing memory, share memory by communicating.* | faire circuler les données par channels plutôt que les partager sous verrou |
  | *Concurrency is not parallelism.* | structurer en tâches indépendantes n'est pas exécuter en même temps |
  | *The bigger the interface, the weaker the abstraction.* | des interfaces petites, d'une ou deux méthodes |
  | *Make the zero value useful.* | une variable déclarée doit fonctionner sans initialisation |
  | *interface{} says nothing.* | `any` ne dit rien du type : à éviter quand un type précis existe |
  | *A little copying is better than a little dependency.* | recopier dix lignes plutôt qu'importer une bibliothèque |
  | *Clear is better than clever.* | le code lisible avant le code astucieux |
  | *Errors are values.* | une erreur se manipule comme n'importe quelle valeur |
  | *Don't just check errors, handle them gracefully.* | ajouter du contexte, décider, pas seulement remonter |
  | *Reflection is never clear.* | la réflexion en dernier recours |
  | *Don't panic.* | les paniques pour les erreurs de programmation, pas pour le contrôle normal |
  | *Gofmt's style is no one's favorite, yet gofmt is everyone's favorite.* | un format unique supprime les débats |

  Au quotidien, cela donne un style reconnaissable :
  - le **chemin heureux aligné à gauche** : on traite l'erreur et l'on sort tôt, sans `else` imbriqués ;
  - peu d'abstractions, introduites quand un **besoin réel** apparaît ;
  - des dépendances choisies avec soin ;
  - les guides de référence : *Effective Go*, les *Go Code Review Comments*, le *Google Go Style Guide*.

  **En entretien** : savoir citer et **illustrer** trois ou quatre proverbes par un exemple de code (petite interface,
  valeur zéro, erreurs comme valeurs, clarté plutôt qu'astuce) montre qu'on a compris l'esprit du langage.
cards:
  - key: trouver-conventions-style
    format: course
    question: "Où trouver les conventions de style de Go ?"
    choices:
      - {text: "Effective Go, Go Code Review Comments, le Google Go Style Guide, et `gofmt`", correct: true}
      - {text: "Dans la spécification du langage, qui fixe aussi le style du code", correct: false}
      - {text: "Dans un fichier `.editorconfig` fourni avec chaque installation de Go", correct: false}
      - {text: "Dans les règles de golint, l'outil de style officiel et obligatoire", correct: false}
    answer: "Effective Go, Go Code Review Comments et le Google Go Style Guide, plus `gofmt` pour le format. La spécification définit le langage, pas le style."
  - key: signifie-little-copying-is-better-than
    format: course
    question: "Que signifie le proverbe « a little copying is better than a little dependency » ?"
    choices:
      - {text: "Mieux vaut recopier quelques lignes qu'ajouter une dépendance pour un besoin minime", correct: true}
      - {text: "Mieux vaut passer les structs par valeur que par pointeur, même grandes", correct: false}
      - {text: "Mieux vaut copier une slice avant de la modifier, pour éviter les surprises", correct: false}
      - {text: "Mieux vaut vendoriser toutes ses dépendances dans le dépôt du projet", correct: false}
    answer: "Dupliquer quelques lignes plutôt qu'ajouter une dépendance (et ses propres dépendances, ses failles, ses mises à jour) pour un besoin minime."
  - key: aligner-chemin-heureux-gauche
    format: course
    question: "Pourquoi aligner le chemin heureux à gauche ?"
    choices:
      - {text: "Traiter les erreurs tôt et sortir laisse le flux principal lisible, sans imbrication", correct: true}
      - {text: "Parce que `gofmt` refuse un `else` placé après un `return`", correct: false}
      - {text: "Parce que le compilateur optimise mieux les fonctions sans `else`", correct: false}
      - {text: "Pour traiter toutes les erreurs à la fin de la fonction, en un seul bloc", correct: false}
    answer: "Traiter les erreurs tôt et retourner rend le flux principal lisible sans imbrication : on lit le cas normal en descendant la marge gauche. C'est un choix de lisibilité, que ni `gofmt` ni le compilateur n'imposent."
  - key: limiter-reflexion
    format: course
    question: "Pourquoi limiter la réflexion en Go ?"
    choices:
      - {text: "Elle est lente, échappe aux vérifications du compilateur et se lit mal", correct: true}
      - {text: "Elle est interdite hors des packages de la bibliothèque standard", correct: false}
      - {text: "Elle ne fonctionne plus avec les génériques depuis Go 1.18", correct: false}
      - {text: "Elle empêche le ramasse-miettes de libérer les valeurs inspectées", correct: false}
    answer: "Elle est lente, non vérifiée à la compilation et peu lisible ; les génériques et la génération de code la remplacent souvent. Elle reste utile pour l'encodage (`encoding/json`) ou les outils."
  - key: citez-anti-patterns
    format: course
    question: "Quels anti-motifs reproche-t-on souvent au code Go ?"
    choices:
      - {text: "Interfaces prématurées, package `utils`, `panic` comme contrôle de flux, état global, `any` partout", correct: true}
      - {text: "Petites interfaces, retours d'erreur explicites, composition et valeurs zéro utilisables", correct: false}
      - {text: "Tests de table, `gofmt`, le contexte en premier paramètre et des erreurs enveloppées", correct: false}
      - {text: "Goroutines bornées, channels fermés par l'émetteur et `defer` pour les fermetures", correct: false}
    answer: "Les interfaces prématurées, les packages `utils`, `panic` comme contrôle de flux, les goroutines sans fin, l'état global et `interface{}` partout. Les autres listes sont de bonnes pratiques."
  - key: contient-bon-rendu-test-technique
    format: course
    question: "Que contient un bon rendu de test technique en Go ?"
    choices:
      - {text: "Du code formaté et linté, des tests passés avec `-race`, un README : lancement, choix, limites", correct: true}
      - {text: "Le plus de fonctionnalités possible, même sans tests, pour impressionner le recruteur", correct: false}
      - {text: "Une architecture hexagonale complète, quelle que soit la taille de l'exercice demandé", correct: false}
      - {text: "Du code sans commentaire ni README : un bon code se suffit toujours à lui-même", correct: false}
    answer: "Du code formaté et linté, des tests lancés avec `-race`, et un README qui dit comment lancer, les choix faits, les hypothèses et les limites. La structure reste proportionnée à l'exercice."
  - key: vf-copier
    format: true-false
    question: « A little copying is better than a little dependency » invite à recopier quelques lignes plutôt qu'ajouter une dépendance.
    truth: true
    answer: Une dépendance coûte en sécurité, en mises à jour et en compilation.
  - key: vf-concurrence
    format: true-false
    question: Selon les proverbes, concurrence et parallélisme sont la même chose.
    truth: false
    answer: La concurrence structure le programme ; le parallélisme exécute en même temps.
  - key: vf-interface
    format: true-false
    question: « The bigger the interface, the weaker the abstraction » encourage les interfaces d'une ou deux méthodes.
    truth: true
    answer: Comme io.Reader ou fmt.Stringer.
  - key: vf-panic
    format: true-false
    question: « Don't panic » signifie qu'on ne doit jamais appeler panic.
    truth: false
    answer: On la réserve aux erreurs de programmation ou aux états impossibles, pas au contrôle normal.
  - key: qcm-illustrations
    format: multiple-choice
    question: "Laquelle de ces illustrations correspond mal à son proverbe ?"
    choices:
      - {text: "Une fonction remplie de réflexion : clear is better than clever", correct: true}
      - {text: "`sync.Mutex` utilisable sans initialisation : make the zero value useful", correct: false}
      - {text: "`io.Reader` et sa seule méthode : the bigger the interface, the weaker the abstraction", correct: false}
      - {text: "`errors.Join` et les erreurs enveloppées : errors are values", correct: false}
    answer: "Une fonction remplie de réflexion va à l'encontre de « clear is better than clever » et de « reflection is never clear » : c'est un contre-exemple. Les trois autres illustrent bien leur proverbe."
  - key: qcm-style
    format: multiple-choice
    question: "Laquelle de ces pratiques va contre la philosophie de Go ?"
    choices:
      - {text: "Une hiérarchie de types abstraits prévue dès le départ", correct: true}
      - {text: "Traiter l'erreur et sortir tôt, chemin heureux à gauche", correct: false}
      - {text: "Introduire une interface quand un besoin réel apparaît", correct: false}
      - {text: "Passer `gofmt` sur tout le code", correct: false}
    answer: "Go préfère le concret et l'abstraction tardive : une hiérarchie prévue d'avance fige des abstractions avant le besoin. Sortir tôt, attendre un vrai besoin pour une interface et `gofmt` partout en découlent."
  - key: qcm-any
    format: multiple-choice
    question: "Que veut dire le proverbe « interface{} says nothing » ?"
    choices:
      - {text: "Un paramètre `any` ne dit rien de ce qu'il attend, et le compilateur ne vérifie plus rien", correct: true}
      - {text: "`interface{}` est interdit depuis Go 1.18, au profit du mot `any`", correct: false}
      - {text: "`any` est plus rapide qu'un type précis, car il évite les conversions", correct: false}
      - {text: "Une interface vide ne peut contenir aucune valeur, seulement `nil`", correct: false}
    answer: "Un paramètre `any` ne dit rien de ce qu'il attend : le compilateur ne vérifie plus rien, et les erreurs arrivent à l'exécution. On préfère un type précis ou un générique contraint ; `any` est un simple alias d'`interface{}`, toujours permis."
  - key: qcm-guides
    format: multiple-choice
    question: "Laquelle de ces sources ne fixe pas les conventions de style de Go ?"
    choices:
      - {text: "La spécification du langage", correct: true}
      - {text: "Effective Go", correct: false}
      - {text: "Go Code Review Comments", correct: false}
      - {text: "Le Google Go Style Guide", correct: false}
    answer: "La spécification définit le langage, pas le style. Effective Go, Go Code Review Comments et le Google Go Style Guide sont les références de style."
  - key: scenario-clair
    format: scenario
    question: "Une fonction calcule une remise en une ligne d'opérateurs imbriqués et de manipulations de bits. Que proposes-tu, au nom de « Clear is better than clever » ?"
    choices:
      - {text: "Quelques `if` nommés, une variable intermédiaire au nom parlant, et un test de table", correct: true}
      - {text: "Garder la ligne, plus rapide, et ajouter un commentaire qui la paraphrase", correct: false}
      - {text: "La réécrire avec la réflexion, pour qu'elle traite tous les types de remise", correct: false}
      - {text: "La déplacer dans un package `utils`, où personne n'aura à la relire", correct: false}
    answer: "Quelques `if` nommés (`if client.Fidele() { ... }`), une variable intermédiaire au nom parlant, et un test de table qui montre les cas. Le compilateur optimise aussi bien, et le prochain lecteur comprend du premier coup."
  - key: scenario-dependance
    format: scenario
    question: Un collègue veut ajouter une bibliothèque de 20 dépendances pour une fonction de 15 lignes. Que lui réponds-tu ?
    choices:
      - {text: "Recopier ou réécrire ces 15 lignes, avec un test, plutôt que d'ajouter 20 dépendances", correct: true}
      - {text: "Accepter : une bibliothèque populaire est forcément mieux testée que notre code", correct: false}
      - {text: "Accepter, mais vendoriser les 20 dépendances pour ne plus avoir à y penser", correct: false}
      - {text: "Refuser par principe toute dépendance externe au projet, quelle qu'elle soit", correct: false}
    answer: "« A little copying is better than a little dependency » : chaque dépendance ajoute du code à auditer, des vulnérabilités, des mises à jour et du temps de compilation. Pour 15 lignes stables, je recopie (avec la licence et un test) ou je réécris ; une dépendance se justifie quand elle apporte beaucoup et qu'elle est bien maintenue."
  - key: scenario-erreurs
    format: scenario
    question: "Comment illustres-tu « Errors are values » par un exemple ?"
    choices:
      - {text: "Un écrivain qui garde la première erreur : on enchaîne les écritures, puis on teste `Err()` une fois", correct: true}
      - {text: "Une erreur se lève avec `panic`, puis se rattrape avec `recover` chez l'appelant", correct: false}
      - {text: "Une erreur est un code entier, comparé à des constantes, comme en C", correct: false}
      - {text: "Une erreur se teste toujours juste après chaque appel, et d'aucune autre manière", correct: false}
    answer: "Une erreur est une valeur ordinaire qu'on peut stocker, comparer, envelopper et programmer : un `bufio.Scanner` ou un écrivain qui garde la première erreur permet d'enchaîner les opérations et de vérifier une seule fois `Err()`. Ou `errors.Join`, pour collecter toutes les erreurs de validation."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce qui distingue le style Go de celui de Java. Que réponds-tu ?"
    choices:
      - {text: "Du code explicite : erreurs valeurs, petites interfaces implicites, composition, `gofmt`, peu de magie", correct: true}
      - {text: "Go est orienté objet comme Java, avec des classes, mais une syntaxe plus courte", correct: false}
      - {text: "Go repose sur les annotations et l'injection par réflexion, comme le fait Spring", correct: false}
      - {text: "Go laisse chaque équipe choisir son format de code, là où Java impose le sien", correct: false}
    answer: "Go privilégie le code explicite : des erreurs valeurs traitées sur place, des interfaces petites et implicites définies chez l'utilisateur, la composition au lieu de l'héritage, peu de magie (ni annotations ni injection par réflexion), et un format unique imposé par `gofmt`. Le code est plus verbeux par endroits, mais lisible par tout développeur Go."
