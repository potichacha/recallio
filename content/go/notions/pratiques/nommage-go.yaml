notion: nommage-go
lesson: |-
  En Go, le nommage suit des conventions fortes, que tout relecteur attend :

  - **La casse décide de la visibilité** : `Commande` est exportée, `commande` reste dans le package.
  - **Des noms courts quand la portée est courte** : `i`, `r`, `w`, `ctx`, `err` dans une petite fonction ; des noms plus
    descriptifs pour une portée large (champs, variables de package).
  - **Pas de préfixe Get** : la méthode qui lit le champ `proprietaire` s'appelle `Proprietaire()`, le setter
    `SetProprietaire()`.
  - **Les acronymes gardent leur casse** : `URL`, `HTTPClient`, `userID`, `ServeHTTP`, jamais `Url` ni `UserId`.
  - **Le nom du package fait partie du nom** : on évite le **bégaiement** (`http.Server`, pas `http.HTTPServer` ;
    `commande.Nouvelle`, pas `commande.NouvelleCommande`).
  - **Les packages** : un nom court, en minuscules, sans souligné ni majuscule, au singulier, qui dit ce qu'il fournit
    (`strconv`, `commande`) ; pas de `utils`, `common`, `helpers` fourre-tout.
  - **Les récepteurs** : une ou deux lettres tirées du type (`func (c *Commande)`), toujours les mêmes pour un type ;
    jamais `this` ni `self`.
  - **Les interfaces d'une méthode** prennent le nom de la méthode suivi de `-er` : `Reader`, `Stringer`, `Notifier`.
  - **Les erreurs** : variables `ErrIntrouvable`, types `ErreurValidation` (ou `...Error`), messages en minuscules sans
    point final.

  **En entretien** : « Majuscule pour exporter ; noms courts en portée courte ; pas de Get ; acronymes en
  majuscules ; pas de bégaiement avec le package ; pas de package utils ; récepteurs courts et constants. »
cards:
  - key: getx
    format: course
    question: Pourquoi pas de getX() en Go ?
    answer: 'Convention : un getter s''appelle X(), un setter SetX().'
  - key: begaiement-nommage
    format: course
    question: C'est quoi le bégaiement dans le nommage ?
    answer: Répéter le nom du package dans l'identifiant (user.UserService au lieu de user.Service).
  - key: eviter-package-utils
    format: course
    question: Pourquoi éviter un package utils ?
    answer: Le nom ne dit rien de ce qu'il fournit et il devient un fourre-tout couplé à tout.
  - key: nommer-receveur
    format: course
    question: Comment nommer un receveur ?
    answer: Une ou deux lettres liées au type, cohérentes ; jamais this ou self.
  - key: ecrire-acronymes
    format: course
    question: Comment écrire les acronymes ?
    answer: 'En casse uniforme : userID, ServeHTTP, parseURL.'
  - key: vf-get
    format: true-false
    question: En Go, la méthode qui renvoie le champ nom s'appelle par convention GetNom.
    truth: false
    answer: Elle s'appelle Nom ; le setter s'appelle SetNom.
  - key: vf-acronymes
    format: true-false
    question: '`userID` et `ServeHTTP` respectent les conventions de nommage.'
    truth: true
    answer: Les acronymes gardent une casse uniforme.
  - key: vf-this
    format: true-false
    question: Nommer le récepteur `this` ou `self` est idiomatique en Go.
    truth: false
    answer: On utilise une ou deux lettres tirées du type.
  - key: vf-courts
    format: true-false
    question: Un nom de variable d'une lettre est acceptable dans une boucle de trois lignes.
    truth: true
    answer: La longueur d'un nom suit la taille de sa portée.
  - key: qcm-noms
    format: multiple-choice
    question: Lesquels de ces noms sont idiomatiques ?
    choices:
      - text: '`http.Server`'
        correct: true
      - text: '`ParseURL`'
        correct: true
      - text: '`func (c *Client) Timeout() time.Duration`'
        correct: true
      - text: '`commande.CommandeService`'
        correct: false
    answer: Le dernier bégaie avec le nom du package.
  - key: qcm-packages
    format: multiple-choice
    question: Quels noms de package sont appropriés ?
    choices:
      - text: '`facture`'
        correct: true
      - text: '`strconv`'
        correct: true
      - text: '`utils`'
        correct: false
      - text: '`gestion_commandes`'
        correct: false
    answer: Un nom court, en minuscules, qui dit ce que le package fournit.
  - key: qcm-interfaces
    format: multiple-choice
    question: Quels noms conviennent à des interfaces d'une méthode ?
    choices:
      - text: '`Notifier` pour une méthode Notify'
        correct: true
      - text: '`Reader` pour une méthode Read'
        correct: true
      - text: '`INotifier`'
        correct: false
      - text: '`NotifierInterface`'
        correct: false
    answer: Pas de préfixe I ni de suffixe Interface.
  - key: qcm-erreurs
    format: multiple-choice
    question: Quels nommages d'erreurs sont idiomatiques ?
    choices:
      - text: '`var ErrIntrouvable = errors.New("introuvable")`'
        correct: true
      - text: '`errors.New("connexion refusée")`, en minuscules sans point'
        correct: true
      - text: '`var IntrouvableError = errors.New("Introuvable.")`'
        correct: false
      - text: '`var errorNotFound = ...` exportée'
        correct: false
    answer: Les sentinelles commencent par Err ; les messages sont en minuscules, sans point.
  - key: bug-get
    format: bug-fix
    question: |-
      Que reproches-tu à cette API ?
      ```go
      func (c *Client) GetTimeout() time.Duration { return c.timeout }
      func (c *Client) SetTimeout(d time.Duration) { c.timeout = d }
      ```
    answer: |-
      ```go
      func (c *Client) Timeout() time.Duration { return c.timeout }
      func (c *Client) SetTimeout(d time.Duration) { c.timeout = d }
      ```
      Le préfixe Get n'est pas idiomatique ; l'accesseur porte le nom du champ.
  - key: bug-begaiement
    format: bug-fix
    question: |-
      Les appels se lisent `commande.CommandeNouvelle(commande.CommandeStatutPayee)`. Que proposes-tu ?
      ```go
      package commande

      func CommandeNouvelle(s CommandeStatut) *Commande
      ```
    answer: |-
      ```go
      package commande

      func Nouvelle(s Statut) *Commande
      ```
      Le nom du package fait partie du nom à l'appel : `commande.Nouvelle(commande.Payee)` se lit sans répétition.
  - key: bug-acronymes
    format: bug-fix
    question: "Le linter signale ces noms :\n```go\ntype HttpClient struct {\n\tbaseUrl string\n\tuserId  int\n}\n```"
    answer: "```go\ntype HTTPClient struct {\n\tbaseURL string\n\tuserID  int\n}\n```\nLes acronymes gardent une casse uniforme : HTTP, URL, ID."
  - key: bug-utils
    format: bug-fix
    question: Le package `utils` contient 40 fonctions sans rapport (formatage de dates, calcul de TVA, appels HTTP). Que proposes-tu ?
    answer: |-
      ```go
      // tva.Calculer(montant)    dans le package du domaine facturation
      // dates.FormaterCourt(t)   dans un petit package dédié, si vraiment partagé
      ```
      On range chaque fonction près de son usage, ou dans un package nommé d'après ce qu'il fournit ; un package utils
      devient un fourre-tout que tout le monde importe et que personne ne peut faire évoluer.
