notion: nommage-go
lesson: |-
  En Go, le nommage suit des conventions fortes, que tout relecteur attend :

  - **La casse décide de la visibilité** : `Commande` est exportée, `commande` reste dans le package.
  - **Des noms courts quand la portée est courte** : `i`, `r`, `w`, `ctx`, `err` dans une petite fonction ; des noms plus
    descriptifs pour une portée large (champs, variables de package).
  - **Pas de préfixe Get** : la méthode qui lit le champ `proprietaire` s'appelle `Proprietaire()`, le setter
    `SetProprietaire()`.
  - **Les acronymes gardent leur casse** : `URL`, `HTTPClient`, `userID`, `ServeHTTP`, jamais `Url` ni `UserId`.
  - **Le nom du package fait partie du nom** : on évite le **bégaiement** (`http.Server`, pas `http.HTTPServer` ;
    `commande.Nouvelle`, pas `commande.NouvelleCommande`).
  - **Les packages** : un nom court, en minuscules, sans souligné ni majuscule, au singulier, qui dit ce qu'il fournit
    (`strconv`, `commande`) ; pas de `utils`, `common`, `helpers` fourre-tout.
  - **Les récepteurs** : une ou deux lettres tirées du type (`func (c *Commande)`), toujours les mêmes pour un type ;
    jamais `this` ni `self`.
  - **Les interfaces d'une méthode** prennent le nom de la méthode suivi de `-er` : `Reader`, `Stringer`, `Notifier`.
  - **Les erreurs** : variables `ErrIntrouvable`, types `ErreurValidation` (ou `...Error`), messages en minuscules sans
    point final.

  **En entretien** : « Majuscule pour exporter ; noms courts en portée courte ; pas de Get ; acronymes en
  majuscules ; pas de bégaiement avec le package ; pas de package utils ; récepteurs courts et constants. »
tour:
  - title: Bien nommer en Go
    text: |-
      Le nommage Go a ses habitudes :

      - des noms **courts** quand la portée est courte : `i`, `r` pour un receveur, `err` ; - pas de `Get` devant un
      accesseur : `c.Nom()`, et `SetNom` pour le modificateur ; - des acronymes à la casse uniforme : `URL`, `clientID`,
      `ServeHTTP` ; - le nom du package fait partie de l'appel : `bytes.Buffer`, pas `bytes.BytesBuffer`, et un package
      s'appelle `strconv`, pas `string_conversions` ; - une interface d'une seule méthode prend le nom de la méthode
      suivi de `-er` : `Reader`, `Stringer`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Client struct {
          	nom      string
          	clientID int
          }

          func (c *Client) Nom() string       { return c.nom }
          func (c *Client) SetNom(nom string) { c.nom = nom }
          func (c *Client) ID() int           { return c.clientID }

          func main() {
          	c := &Client{nom: "Ada", clientID: 7}
          	c.SetNom("Ada Lovelace")
          	fmt.Println(c.Nom(), c.ID())
          }
      output: |-
        Ada Lovelace 7
cards:
  - key: getx
    format: course
    question: "Pourquoi n'écrit-on pas d'accesseur `GetX()` en Go ?"
    choices:
      - {text: "Par convention, l'accesseur s'appelle `X()`, et le mutateur `SetX()`", correct: true}
      - {text: "Parce que `Get` est un mot réservé du langage, refusé par le compilateur", correct: false}
      - {text: "Parce que Go interdit les accesseurs : on exporte toujours le champ", correct: false}
      - {text: "Parce que `GetX` serait confondu avec le gestionnaire d'une requête GET", correct: false}
    answer: "C'est une convention (Effective Go) : l'accesseur porte le nom du champ, `Owner()`, et le mutateur s'appelle `SetOwner()`. `Get` n'a rien de réservé, et exporter le champ n'est pas obligatoire."
  - key: begaiement-nommage
    format: course
    question: "Qu'est-ce que le bégaiement dans le nommage ?"
    choices:
      - {text: "Répéter le nom du package dans l'identifiant, comme `user.UserService`", correct: true}
      - {text: "Donner le même nom à une variable et à son type, comme `user User`", correct: false}
      - {text: "Préfixer chaque interface par `I`, comme `IUser` ou `IService`", correct: false}
      - {text: "Utiliser deux noms différents pour la même notion dans un package", correct: false}
    answer: "Répéter le nom du package dans l'identifiant : `user.UserService` au lieu de `user.Service`. À l'appel, le nom du package fait déjà partie du nom."
  - key: eviter-package-utils
    format: course
    question: "Pourquoi éviter un package nommé `utils` ?"
    choices:
      - {text: "Son nom ne dit rien, et il devient un fourre-tout importé par tout le monde", correct: true}
      - {text: "Parce que `utils` est un nom réservé par la bibliothèque standard", correct: false}
      - {text: "Parce qu'un package de plus de dix fonctions ralentit la compilation", correct: false}
      - {text: "Parce que les fonctions d'un tel package ne peuvent pas être exportées", correct: false}
    answer: "Le nom ne dit rien de ce qu'il fournit, et il devient un fourre-tout couplé à tout, que personne ne peut faire évoluer. On range chaque fonction près de son usage."
  - key: nommer-receveur
    format: course
    question: "Quel nom donner au receveur des méthodes d'un type `*Client` ?"
    choices:
      - {text: "`c`, une lettre liée au type, la même dans toutes ses méthodes", correct: true}
      - {text: "`this`, comme en Java, pour qu'on le reconnaisse au premier coup d'œil", correct: false}
      - {text: "`self`, comme en Python, quel que soit le type de la méthode", correct: false}
      - {text: "`client` dans certaines méthodes, `cl` dans d'autres, selon la place", correct: false}
    answer: "Une ou deux lettres liées au type (`c` pour `*Client`), cohérentes sur toutes les méthodes ; jamais `this` ni `self`, qui ne disent rien du type."
  - key: ecrire-acronymes
    format: course
    question: "Comment écrit-on les acronymes dans les identifiants Go ?"
    choices:
      - {text: "En casse uniforme : `userID`, `ServeHTTP`, `parseURL`", correct: true}
      - {text: "Comme des mots ordinaires : `userId`, `ServeHttp`, `parseUrl`", correct: false}
      - {text: "Toujours en majuscules, même en tête : `USERid`, `SERVEhttp`", correct: false}
      - {text: "Séparés par un tiret bas : `user_ID`, `serve_HTTP`, `parse_URL`", correct: false}
    answer: "En casse uniforme : `userID`, `ServeHTTP`, `parseURL` (et `id` en tête d'un identifiant non exporté). Les linters signalent `userId` ou `HttpClient`."
  - key: vf-get
    format: true-false
    question: En Go, la méthode qui renvoie le champ nom s'appelle par convention GetNom.
    truth: false
    answer: Elle s'appelle Nom ; le setter s'appelle SetNom.
  - key: vf-acronymes
    format: true-false
    question: '`userID` et `ServeHTTP` respectent les conventions de nommage.'
    truth: true
    answer: Les acronymes gardent une casse uniforme.
  - key: vf-this
    format: true-false
    question: Nommer le récepteur `this` ou `self` est idiomatique en Go.
    truth: false
    answer: On utilise une ou deux lettres tirées du type.
  - key: vf-courts
    format: true-false
    question: Un nom de variable d'une lettre est acceptable dans une boucle de trois lignes.
    truth: true
    answer: La longueur d'un nom suit la taille de sa portée.
  - key: qcm-noms
    format: multiple-choice
    question: "Lequel de ces noms n'est pas idiomatique ?"
    choices:
      - {text: "`commande.CommandeService`", correct: true}
      - {text: "`http.Server`", correct: false}
      - {text: "`ParseURL`", correct: false}
      - {text: "`func (c *Client) Timeout() time.Duration`", correct: false}
    answer: "`commande.CommandeService` bégaie : à l'appel, `commande.Service` suffit. `http.Server`, `ParseURL` et l'accesseur `Timeout()` sans `Get` sont idiomatiques."
  - key: qcm-packages
    format: multiple-choice
    question: "Lequel de ces noms de package est approprié ?"
    choices:
      - {text: "`facture`", correct: true}
      - {text: "`utils`", correct: false}
      - {text: "`gestion_commandes`", correct: false}
      - {text: "`factureService`", correct: false}
    answer: "Un nom court, en minuscules, sans tiret bas ni majuscule, qui dit ce que le package fournit, comme `facture` ou `strconv`. `utils` ne dit rien."
  - key: qcm-interfaces
    format: multiple-choice
    question: "Lesquels de ces noms conviennent à des interfaces d'une méthode ?"
    choices:
      - text: '`Notifier` pour une méthode Notify'
        correct: true
      - text: '`Reader` pour une méthode Read'
        correct: true
      - text: '`INotifier`'
        correct: false
      - text: '`NotifierInterface`'
        correct: false
    answer: "Le nom de la méthode suivi de -er : `Notifier` pour `Notify`, `Reader` pour `Read`. Pas de préfixe `I` ni de suffixe `Interface`."
  - key: qcm-erreurs
    format: multiple-choice
    question: "Laquelle de ces déclarations d'erreur sentinelle est idiomatique ?"
    choices:
      - {text: "`var ErrIntrouvable = errors.New(\"introuvable\")`", correct: true}
      - {text: "`var IntrouvableError = errors.New(\"Introuvable.\")`", correct: false}
      - {text: "`var ErrIntrouvable = errors.New(\"Introuvable.\")`", correct: false}
      - {text: "`const ErrIntrouvable = \"introuvable\"`", correct: false}
    answer: "Une sentinelle exportée commence par `Err`, et son message est en minuscules, sans point final, car il se retrouve au milieu d'autres messages. Une constante chaîne n'implémente pas `error`."
  - key: bug-get
    format: bug-fix
    question: |-
      Que reproches-tu à cette API ?
      ```go
      func (c *Client) GetTimeout() time.Duration { return c.timeout }
      func (c *Client) SetTimeout(d time.Duration) { c.timeout = d }
      ```
    choices:
      - {text: "Le préfixe `Get` : l'accesseur s'appelle `Timeout()`, et le mutateur garde `SetTimeout`", correct: true}
      - {text: "Le préfixe `Set` : le mutateur devrait s'appeler `Timeout(d)`, comme l'accesseur", correct: false}
      - {text: "Les deux méthodes : il faut exporter le champ `Timeout` et les supprimer", correct: false}
      - {text: "Le receveur : `c` devrait s'appeler `client`, plus explicite pour le lecteur", correct: false}
    answer: |-
      ```go
      func (c *Client) Timeout() time.Duration { return c.timeout }
      func (c *Client) SetTimeout(d time.Duration) { c.timeout = d }
      ```
      Le préfixe `Get` n'est pas idiomatique : l'accesseur porte le nom du champ. `SetTimeout` est bien le nom attendu du mutateur.
  - key: bug-begaiement
    format: bug-fix
    question: |-
      Les appels se lisent `commande.CommandeNouvelle(commande.CommandeStatutPayee)`. Que proposes-tu ?
      ```go
      package commande

      func CommandeNouvelle(s CommandeStatut) *Commande
      ```
    choices:
      - {text: "`func Nouvelle(s Statut) *Commande`, appelée `commande.Nouvelle(commande.Payee)`", correct: true}
      - {text: "`func NouvelleCommande(s StatutCommande) *Commande`, plus explicite", correct: false}
      - {text: "Renommer le package `commandes`, au pluriel, pour lever la répétition", correct: false}
      - {text: "Importer le package sous l'alias `c`, pour raccourcir tous les appels", correct: false}
    answer: |-
      ```go
      package commande

      func Nouvelle(s Statut) *Commande
      ```
      Le nom du package fait partie du nom à l'appel : `commande.Nouvelle(commande.Payee)` se lit sans répétition. Un alias court cache le problème chez un seul appelant.
  - key: bug-acronymes
    format: bug-fix
    question: |-
      Le linter signale ces noms. Quelle correction est la bonne ?
      ```go
      type HttpClient struct {
      	baseUrl string
      	userId  int
      }
      ```
    choices:
      - {text: "`HTTPClient`, `baseURL`, `userID`", correct: true}
      - {text: "`HTTPClient`, `baseUrl`, `userId`", correct: false}
      - {text: "`Httpclient`, `baseurl`, `userid`", correct: false}
      - {text: "`HTTP_Client`, `base_URL`, `user_ID`", correct: false}
    answer: |-
      ```go
      type HTTPClient struct {
      	baseURL string
      	userID  int
      }
      ```
      Les acronymes gardent une casse uniforme dans tout l'identifiant : HTTP, URL, ID.
  - key: bug-utils
    format: bug-fix
    question: Le package `utils` contient 40 fonctions sans rapport (formatage de dates, calcul de TVA, appels HTTP). Que proposes-tu ?
    choices:
      - {text: "Ranger chaque fonction près de son usage, ou dans un package nommé d'après ce qu'il fournit", correct: true}
      - {text: "Renommer `utils` en `common`, un nom plus parlant pour les nouveaux arrivants", correct: false}
      - {text: "Découper `utils` en `utils1`, `utils2` et `utils3`, de tailles à peu près égales", correct: false}
      - {text: "Garder `utils`, mais trier ses 40 fonctions par ordre alphabétique dans le fichier", correct: false}
    answer: |-
      ```go
      // tva.Calculer(montant)    dans le package du domaine facturation
      // dates.FormaterCourt(t)   dans un petit package dédié, si vraiment partagé
      ```
      On range chaque fonction près de son usage (`tva.Calculer` dans le domaine), ou dans un petit package nommé d'après ce qu'il fournit (`dates`). `common` ou `helpers` gardent le même défaut : un fourre-tout que tout le monde importe.
