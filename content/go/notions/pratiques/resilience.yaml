notion: resilience
lesson: "Un service qui dépend d'autres services doit supporter leurs **pannes** et leurs **lenteurs** sans s'effondrer.\n\n**Les délais** d'abord : chaque appel a un délai (contexte), sinon une dépendance lente bloque toutes les\ngoroutines.\n\n**Les réessais** avec **backoff exponentiel et jitter** :\n\n```go\nfunc avecReessais(ctx context.Context, n int, f func(context.Context) error) error {\n\tdelai := 100 * time.Millisecond\n\tvar err error\n\tfor essai := range n {\n\t\tif err = f(ctx); err == nil || !temporaire(err) {\n\t\t\treturn err\n\t\t}\n\t\tif essai == n-1 {\n\t\t\tbreak\n\t\t}\n\t\tattente := delai/2 + rand.N(delai) // jitter : désynchronise les clients\n\t\tselect {\n\t\tcase <-time.After(attente):\n\t\t\tdelai *= 2\n\t\tcase <-ctx.Done():\n\t\t\treturn ctx.Err()\n\t\t}\n\t}\n\treturn err\n}\n```\n\n- seulement les erreurs **temporaires** (délai, 429, 502, 503, connexion refusée), jamais un 400 ;\n- seulement des opérations **idempotentes**, ou rendues idempotentes par une **clé d'idempotence** (le serveur\n  reconnaît une requête déjà traitée) ;\n- un nombre de tentatives **borné**, dans le budget du contexte, et en respectant `Retry-After`.\n\n**Le disjoncteur** (*circuit breaker*, `sony/gobreaker`) : après trop d'échecs, il **ouvre** le circuit et échoue tout\nde suite pendant un temps, au lieu de surcharger une dépendance déjà en difficulté ; puis il laisse passer quelques\nessais (**semi-ouvert**) avant de se refermer.\n\n**Les autres outils** : limiter la **concurrence** vers une dépendance (sémaphore, cloison), une **valeur de repli**\n(un cache, une réponse dégradée), la **limitation de débit** à l'entrée, et des files de messages pour absorber les pics.\n\n**En entretien** : « Délais partout ; réessais bornés avec backoff et jitter, seulement sur des erreurs temporaires et\ndes opérations idempotentes ; clé d'idempotence ; disjoncteur pour ne pas achever une dépendance ; repli et cloisons. »"
cards:
  - key: apporte-temporal
    format: course
    question: "Qu'apporte Temporal à un service Go ?"
    choices:
      - {text: "Des workflows durables écrits en Go, avec reprise après crash, réessais, timers et compensations", correct: true}
      - {text: "Un ordonnanceur de tâches cron, intégré à la bibliothèque standard depuis Go 1.21", correct: false}
      - {text: "Une base de données de séries temporelles, pour stocker les métriques du service", correct: false}
      - {text: "Un disjoncteur pour les appels HTTP sortants, comme le fait sony/gobreaker", correct: false}
    answer: "Des workflows durables écrits en Go : l'état de chaque étape est enregistré, si bien qu'un workflow reprend après un crash, avec des réessais, des timers et des compensations. Ce n'est ni un cron ni une base de métriques."
  - key: bibliotheque-circuit-breaker
    format: course
    question: "Quelle bibliothèque utilise-t-on souvent pour un disjoncteur (circuit breaker) en Go ?"
    choices:
      - {text: "sony/gobreaker", correct: true}
      - {text: "Resilience4j", correct: false}
      - {text: "Hystrix, intégré à `net/http`", correct: false}
      - {text: "`sync.Breaker`, de la bibliothèque standard", correct: false}
    answer: "sony/gobreaker. Resilience4j et Hystrix sont des bibliothèques Java, et la bibliothèque standard n'a pas de disjoncteur."
  - key: jitter
    format: course
    question: Pourquoi ajouter une part aléatoire (jitter) au délai entre deux réessais ?
    choices:
      - {text: "Pour que les clients qui ont échoué ensemble ne réessaient pas tous au même instant", correct: true}
      - {text: "Pour que chaque réessai attende moins longtemps que le précédent", correct: false}
      - {text: "Pour cacher à un attaquant le délai exact entre deux réessais", correct: false}
      - {text: "Pour réessayer plus vite qu'avec un backoff exponentiel seul", correct: false}
    answer: "Sans jitter, tous les clients qui ont échoué au même moment réessaient au même moment, et la dépendance reçoit des vagues synchronisées ; l'aléa étale les réessais."
  - key: idempotence
    format: course
    question: Comment réessayer sans risque une requête de paiement qui n'est pas idempotente par nature ?
    choices:
      - {text: "Une clé d'idempotence générée par le client, envoyée à chaque tentative et retenue par le serveur", correct: true}
      - {text: "Ne jamais réessayer un paiement, quelle que soit l'erreur reçue, même un délai dépassé", correct: false}
      - {text: "Réessayer avec un délai plus long, pour laisser au premier paiement le temps d'échouer", correct: false}
      - {text: "Vérifier le solde du client avant chaque tentative, pour éviter un second débit", correct: false}
    answer: "Le client génère une clé d'idempotence et l'envoie avec chaque tentative : le serveur enregistre la clé avec le résultat et renvoie ce résultat au lieu de payer une seconde fois. Attendre plus longtemps ne dit pas si le premier paiement a eu lieu."
  - key: vf-400
    format: true-false
    question: Il est utile de réessayer une requête qui a reçu 400 Bad Request.
    truth: false
    answer: La même requête échouera de la même façon ; on ne réessaie que les erreurs temporaires.
  - key: vf-disjoncteur
    format: true-false
    question: Un disjoncteur ouvert échoue immédiatement sans appeler la dépendance.
    truth: true
    answer: Il la laisse récupérer et libère vite l'appelant.
  - key: vf-borne
    format: true-false
    question: Des réessais sans limite garantissent qu'une opération finit par réussir.
    truth: false
    answer: Ils aggravent la panne et dépassent l'échéance de l'appelant ; on borne le nombre et la durée.
  - key: vf-retry-after
    format: true-false
    question: Un client devrait respecter l'en-tête Retry-After d'une réponse 429 ou 503.
    truth: true
    answer: Le serveur dit quand revenir.
  - key: qcm-reessayer
    format: multiple-choice
    question: "Laquelle de ces erreurs ne faut-il pas réessayer ?"
    choices:
      - {text: "Un 404 Not Found", correct: true}
      - {text: "Un délai dépassé sur un GET", correct: false}
      - {text: "Un 503 Service Unavailable", correct: false}
      - {text: "Un 429 Too Many Requests, après le délai indiqué", correct: false}
    answer: "Une ressource absente ne réapparaîtra pas en réessayant. Un délai dépassé sur un GET (idempotent), un 503 ou un 429 (après le délai de `Retry-After`) sont des erreurs temporaires."
  - key: qcm-disjoncteur
    format: multiple-choice
    question: "Lequel de ces états n'est pas un état de disjoncteur ?"
    choices:
      - {text: "Bloqué : les appels attendent sans limite", correct: true}
      - {text: "Fermé : les appels passent", correct: false}
      - {text: "Ouvert : les appels échouent aussitôt", correct: false}
      - {text: "Semi-ouvert : quelques appels d'essai passent", correct: false}
    answer: "Un disjoncteur est fermé (les appels passent), ouvert (ils échouent aussitôt) ou semi-ouvert (quelques appels d'essai décident de refermer ou de rouvrir). Faire attendre sans limite est justement ce qu'il évite."
  - key: qcm-outils
    format: multiple-choice
    question: "Lequel de ces mécanismes ne protège pas un service d'une dépendance défaillante ?"
    choices:
      - {text: "Une goroutine sans limite pour chaque appel", correct: true}
      - {text: "Un délai sur chaque appel", correct: false}
      - {text: "Une limite d'appels simultanés vers elle (cloison)", correct: false}
      - {text: "Une valeur de repli, par exemple un cache", correct: false}
    answer: "Sans limite, la panne de la dépendance accumule des goroutines bloquées et épuise le service. Un délai, une cloison et une valeur de repli le protègent."
  - key: qcm-backoff
    format: multiple-choice
    question: "Laquelle de ces caractéristiques est à éviter dans une politique de réessais ?"
    choices:
      - {text: "Un délai fixe de zéro entre les tentatives", correct: true}
      - {text: "Un délai qui augmente à chaque tentative", correct: false}
      - {text: "Une part aléatoire dans le délai", correct: false}
      - {text: "Un nombre maximal de tentatives et le respect du contexte", correct: false}
    answer: "Réessayer immédiatement martèle la dépendance. Une bonne politique a un délai croissant, une part aléatoire, un nombre maximal de tentatives, et respecte le contexte."
  - key: bug-boucle
    format: bug-fix
    question: |-
      Lors d'une panne du partenaire, le service le martèle de milliers de requêtes par seconde. Quelle correction est la bonne ?
      ```go
      for {
      	if err := appeler(ctx); err == nil {
      		break
      	}
      }
      ```
    choices:
      - {text: "Des réessais bornés, avec backoff exponentiel et jitter, qui respectent `ctx`", correct: true}
      - {text: "Un `time.Sleep(time.Second)` fixe dans la boucle, sans autre limite", correct: false}
      - {text: "Lancer chaque nouvel essai dans sa propre goroutine, en parallèle", correct: false}
      - {text: "Réessayer tant que `ctx.Err()` vaut `nil`, toujours sans délai", correct: false}
    answer: |-
      ```go
      err := avecReessais(ctx, 4, appeler) // backoff exponentiel avec jitter, borné, respecte ctx
      if err != nil {
      	return fmt.Errorf("partenaire indisponible : %w", err)
      }
      ```
      La boucle réessayait sans délai ni limite ; les réessais doivent être espacés, bornés et annulables. Un délai fixe sans limite synchronise les clients et ne s'arrête jamais.
  - key: bug-paiement
    format: bug-fix
    question: |-
      Après un délai dépassé suivi d'un réessai, certains clients sont débités deux fois. Quelle correction est la bonne ?
      ```go
      err := avecReessais(ctx, 3, func(ctx context.Context) error {
      	return paiements.Debiter(ctx, client, montant)
      })
      ```
    choices:
      - {text: "Une clé d'idempotence stable (l'identifiant de la commande), envoyée à chaque tentative", correct: true}
      - {text: "Un identifiant aléatoire neuf à chaque tentative, pour tracer chaque essai", correct: false}
      - {text: "Allonger le délai de chaque tentative, pour qu'aucune n'expire plus", correct: false}
      - {text: "Ramener le nombre de tentatives de 3 à 2, pour limiter les doublons", correct: false}
    answer: |-
      ```go
      cle := commande.ID // stable pour toutes les tentatives
      err := avecReessais(ctx, 3, func(ctx context.Context) error {
      	return paiements.Debiter(ctx, client, montant, cle)
      })
      ```
      Le premier débit avait réussi mais la réponse s'était perdue ; avec une clé d'idempotence stable, le fournisseur reconnaît la tentative et ne débite pas deux fois. Une clé neuve à chaque tentative ne reconnaîtrait rien.
  - key: bug-tous-codes
    format: bug-fix
    question: |-
      Ce client réessaie trois fois chaque requête refusée pour données invalides. Quelle correction est la bonne ?
      ```go
      if err != nil {
      	continue // réessayer
      }
      ```
    choices:
      - {text: "Ne réessayer que les erreurs temporaires (délai, 429, 502, 503), renvoyer les autres aussitôt", correct: true}
      - {text: "Réessayer une seule fois au lieu de trois, pour toutes les erreurs sans distinction", correct: false}
      - {text: "Attendre une seconde avant chaque réessai, quelle que soit l'erreur reçue", correct: false}
      - {text: "Ne réessayer que les erreurs 4xx, qui viennent de la requête elle-même", correct: false}
    answer: |-
      ```go
      if err != nil {
      	if !temporaire(err) { // délai, 429, 502, 503, connexion refusée
      		return err
      	}
      	continue
      }
      ```
      Seules les erreurs temporaires méritent un réessai ; une erreur du client, comme des données invalides, échoue tout de suite : la même requête sera refusée de la même façon.
  - key: bug-sans-delai
    format: bug-fix
    question: |-
      Quand le service de recommandations ralentit, toute la page produit devient lente et les goroutines s'accumulent. Quelle correction est la bonne ?
      ```go
      recos, err := recommandations.Pour(ctx, produit)
      if err != nil {
      	return err
      }
      ```
    choices:
      - {text: "Un délai court par `context.WithTimeout`, et la page affichée sans recommandations en cas d'échec", correct: true}
      - {text: "Réessayer l'appel aux recommandations jusqu'à ce qu'il finisse par répondre", correct: false}
      - {text: "Augmenter le nombre de goroutines du serveur HTTP pour absorber l'attente", correct: false}
      - {text: "Faire échouer toute la page dès que les recommandations sont en erreur", correct: false}
    answer: |-
      ```go
      ctxRecos, cancel := context.WithTimeout(ctx, 150*time.Millisecond)
      defer cancel()
      recos, err := recommandations.Pour(ctxRecos, produit)
      if err != nil {
      	log.WarnContext(ctx, "recommandations indisponibles", "err", err)
      	recos = nil // la page s'affiche sans elles
      }
      ```
      Une dépendance accessoire a un délai court et une valeur de repli : sa lenteur ne fait plus tomber la page. Réessayer ou attendre plus longtemps aggraverait l'accumulation.
  - key: scenario-strategie
    format: scenario
    question: Ton service appelle une API de paiement parfois instable. Quelle stratégie de résilience mets-tu en place ?
    choices:
      - {text: "Délai par appel, réessais bornés sur erreurs temporaires, clé d'idempotence, disjoncteur, limite d'appels", correct: true}
      - {text: "Réessayer chaque paiement à l'infini jusqu'au succès, pour ne jamais perdre une seule vente", correct: false}
      - {text: "Aucun délai ni réessai : laisser l'erreur remonter au client, qui recommencera s'il le veut", correct: false}
      - {text: "Un délai de plusieurs minutes par appel, pour laisser à l'API le temps de finir par répondre", correct: false}
    answer: "Un délai par appel inférieur au budget de la requête, deux ou trois réessais avec backoff et jitter sur les seules erreurs temporaires, une clé d'idempotence par commande, un disjoncteur pour échouer vite pendant une panne, et une limite d'appels simultanés. Si le paiement peut attendre, une file de messages découple le client de l'API ; des métriques suivent erreurs, réessais et état du disjoncteur."
  - key: scenario-tempete
    format: scenario
    question: Qu'est-ce qu'une tempête de réessais, et comment l'éviter ?
    choices:
      - {text: "Chaque couche réessaie et les appels se multiplient ; on ne réessaie qu'à un niveau, avec budget et jitter", correct: true}
      - {text: "Une panne réseau de tout le centre de données ; on l'évite en déployant sur plusieurs zones", correct: false}
      - {text: "Un excès de journaux d'erreur pendant un incident ; on l'évite en journalisant moins", correct: false}
      - {text: "Des goroutines bloquées sur des channels pleins ; on l'évite avec des channels bufferisés", correct: false}
    answer: "Quand une dépendance ralentit, chaque couche réessaie : trois réessais à trois niveaux font jusqu'à 27 appels par requête, ce qui l'achève. On ne réessaie qu'à un seul niveau (souvent le plus proche de la dépendance), avec un budget de réessais, du jitter, un disjoncteur et l'échéance propagée par le contexte."
  - key: scenario-idempotence-serveur
    format: scenario
    question: Comment implémentes-tu les clés d'idempotence côté serveur ?
    choices:
      - {text: "Enregistrer la clé et le résultat dans la transaction de l'opération, puis renvoyer ce résultat", correct: true}
      - {text: "Garder les clés en mémoire, dans une map du serveur, pour répondre plus vite", correct: false}
      - {text: "Refuser par une erreur 400 toute requête qui porte une clé déjà vue", correct: false}
      - {text: "Laisser le client vérifier lui-même, avant de réessayer, si l'opération a eu lieu", correct: false}
    answer: "Le client envoie un en-tête `Idempotency-Key`. Dans la même transaction que l'opération, le serveur enregistre la clé (contrainte d'unicité) avec le résultat ; si la clé existe, il renvoie ce résultat sans refaire l'opération, et répond 409 si une requête de même clé est en cours. Les clés expirent (24 h) et sont associées au client ; une map en mémoire ne survivrait pas à un redémarrage ni à plusieurs instances."
  - key: scenario-degrade
    format: scenario
    question: Comment concevoir un mode dégradé pour une page qui agrège cinq services ?
    choices:
      - {text: "Séparer l'essentiel de l'accessoire : appels parallèles avec délai, repli pour l'accessoire", correct: true}
      - {text: "Attendre les cinq services sans délai, et échouer dès que l'un d'eux échoue", correct: false}
      - {text: "Appeler les cinq services l'un après l'autre, pour ne pas les surcharger", correct: false}
      - {text: "Afficher une page d'excuse dès que l'un des cinq services ralentit", correct: false}
    answer: "Je distingue l'essentiel (le produit, le prix) de l'accessoire (avis, recommandations, stock précis). Les appels partent en parallèle, chacun avec son délai ; l'essentiel en échec fait échouer la requête, l'accessoire est remplacé par une valeur de repli (cache récent, section masquée), et des drapeaux de fonctionnalité permettent de couper un appel pendant un incident."
