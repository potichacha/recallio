notion: package-internal
lesson: |-
  Un dossier nommé **`internal`** crée une **frontière vérifiée par le compilateur** : les packages qu'il contient ne
  peuvent être importés que par le code situé dans le dossier **parent** de `internal` (et ses sous-dossiers).

  ```
  github.com/exemple/boutique/
  ├── cmd/api/                       peut importer boutique/internal/...
  ├── internal/
  │   ├── commande/                  importable par tout boutique/...
  │   └── paiement/
  │       └── internal/stripe/       importable seulement par paiement/...
  └── client/                        API publique du module
  ```

  Un autre module qui tente `import "github.com/exemple/boutique/internal/commande"` reçoit une erreur :
  « use of internal package not allowed ».

  Pourquoi c'est précieux :
  - on peut **réorganiser** le code interne librement, sans casser personne : seul ce qui est hors d'internal est une
    API publique à maintenir ;
  - dans un service (qui n'est importé par personne), `internal/` signale clairement « rien ici n'est une API » ;
  - imbriqué, il limite un détail d'implémentation à un seul sous-arbre (le client Stripe réservé au package paiement).

  Les autres frontières de package :
  - la **visibilité** par la casse : seuls les identifiants en majuscule sortent du package ;
  - **pas de cycle d'import** : le compilateur l'interdit, ce qui force un graphe de dépendances clair ;
  - chaque package doit avoir une **responsabilité** nette et exporter le moins possible.

  **En entretien** : « internal/ : importable seulement depuis son parent, vérifié par le compilateur ; liberté de
  refactoriser ; imbriquable ; avec la casse et l'absence de cycles, c'est l'outil d'architecture de Go. »
cards:
  - key: cycles-import-sont-ils-interdits
    format: course
    question: "Qu'est-ce que Go gagne à refuser tout cycle d'import entre packages ?"
    choices:
      - {text: "Pour un graphe de dépendances acyclique, une compilation rapide et un découpage propre", correct: true}
      - {text: "Parce que le ramasse-miettes ne sait pas libérer deux packages qui se référencent", correct: false}
      - {text: "Pour empêcher deux goroutines de se bloquer mutuellement au démarrage du programme", correct: false}
      - {text: "Pour que chaque package tienne dans un seul fichier source, plus facile à relire", correct: false}
    answer: "Pour garantir un graphe de dépendances acyclique, que le compilateur traite vite et en parallèle, et qui oblige à placer les concepts partagés au bon endroit. Les goroutines et le GC n'ont rien à y voir."
  - key: sert-repertoire-internal
    format: course
    question: "À quoi sert un répertoire `internal` dans un module Go ?"
    choices:
      - {text: "Ses packages ne s'importent que depuis l'arborescence de son parent", correct: true}
      - {text: "Ses packages ne sont pas compilés dans le binaire final", correct: false}
      - {text: "Ses packages sont chiffrés, pour protéger le code source", correct: false}
      - {text: "Ses packages ne servent qu'aux tests, jamais en production", correct: false}
    answer: "Le compilateur refuse qu'un package sous `internal/` soit importé hors de l'arborescence de son parent : on peut le modifier sans casser d'utilisateurs extérieurs."
  - key: sert-internal
    format: course
    question: "Qui peut importer le package `boutique/paiement/internal/stripe` ?"
    choices:
      - {text: "Le code sous `boutique/paiement/`, et lui seul", correct: true}
      - {text: "Tout le code du module `boutique`, et lui seul", correct: false}
      - {text: "Le seul package `boutique/paiement`, sans ses sous-packages", correct: false}
      - {text: "N'importe quel module : `internal` n'est qu'une convention", correct: false}
    answer: "Un package sous `internal/` n'est importable que depuis l'arborescence du parent d'`internal` : ici `boutique/paiement` et ses sous-packages. Ce n'est pas une convention, le compilateur l'impose."
  - key: terme-internal
    format: course
    question: "Que désigne un dossier `internal/` dans un chemin d'import ?"
    choices:
      - {text: "Un dossier dont les packages ne sont importables que par l'arborescence de son parent", correct: true}
      - {text: "Un dossier ignoré par `go build`, pour garder les brouillons à côté du code", correct: false}
      - {text: "Un dossier réservé aux packages de la bibliothèque standard de Go", correct: false}
      - {text: "Un dossier dont les packages ne sont visibles que dans les fichiers de test", correct: false}
    answer: "Un répertoire spécial : ses packages ne sont importables que par le code de l'arborescence de son parent, et le compilateur le vérifie."
  - key: vf-compilateur
    format: true-false
    question: La restriction des packages internal est vérifiée par le compilateur.
    truth: true
    answer: L'import est refusé avec « use of internal package not allowed ».
  - key: vf-parent
    format: true-false
    question: Un package dans a/b/internal/c peut être importé depuis a/x.
    truth: false
    answer: Seulement depuis a/b et ses sous-dossiers.
  - key: vf-imbrique
    format: true-false
    question: On peut placer un dossier internal à l'intérieur d'un autre package pour restreindre davantage.
    truth: true
    answer: La règle s'applique à chaque niveau.
  - key: vf-convention
    format: true-false
    question: internal n'est qu'une convention de nommage sans effet.
    truth: false
    answer: C'est une règle du langage appliquée par la chaîne d'outils.
  - key: qcm-import
    format: multiple-choice
    question: "Le module github.com/exemple/boutique contient internal/commande. Lesquels de ces packages peuvent l'importer ?"
    choices:
      - text: github.com/exemple/boutique/cmd/api
        correct: true
      - text: github.com/exemple/boutique/internal/paiement
        correct: true
      - text: github.com/autre/projet
        correct: false
      - text: github.com/exemple/autre-module
        correct: false
    answer: "Seul le code sous github.com/exemple/boutique peut l'importer, comme `cmd/api` ou `internal/paiement`. Un autre module, même du même propriétaire, ne le peut pas."
  - key: qcm-avantages
    format: multiple-choice
    question: "Qu'apporte le dossier `internal` à un module ?"
    choices:
      - {text: "La liberté de refactoriser sans casser d'utilisateurs extérieurs", correct: true}
      - {text: "De meilleures performances, par l'inlining entre packages", correct: false}
      - {text: "Le chiffrement du code des packages qu'il contient", correct: false}
      - {text: "L'exclusion de ses packages de la couverture des tests", correct: false}
    answer: "C'est un outil de conception : l'API publique se réduit à ce qui est hors d'`internal`, et le reste se refactorise librement. Il ne change ni les performances ni la sécurité du code."
  - key: qcm-frontieres
    format: multiple-choice
    question: "Lequel de ces mécanismes n'existe pas en Go pour structurer les frontières entre packages ?"
    choices:
      - {text: "Les mots-clés `public` et `private`", correct: true}
      - {text: "La majuscule qui exporte un identifiant", correct: false}
      - {text: "Le dossier `internal`", correct: false}
      - {text: "L'interdiction des cycles d'import", correct: false}
    answer: "Go n'a pas ces mots-clés : la majuscule initiale exporte un identifiant. Le dossier `internal` et l'interdiction des cycles complètent ces frontières."
  - key: qcm-cycle
    format: multiple-choice
    question: "Pourquoi l'interdiction des cycles d'import est-elle utile ?"
    choices:
      - {text: "Elle force un graphe de dépendances clair, du haut vers le bas", correct: true}
      - {text: "Elle empêche les goroutines de se bloquer mutuellement", correct: false}
      - {text: "Elle évite les fuites de mémoire entre packages", correct: false}
      - {text: "Elle n'a pas d'utilité : c'est une limite technique", correct: false}
    answer: "Elle force un graphe clair et oblige à placer les concepts partagés au bon endroit ; elle permet aussi de compiler les packages vite et en parallèle. Elle n'a rien à voir avec les goroutines ni la mémoire."
  - key: trous-dossier
    format: fill-in
    question: |-
      Complète le chemin pour que le package soit privé au module :
      ```
      github.com/exemple/boutique/___/commande
      ```
    blanks:
      - - internal
    answer: internal.
  - key: trous-exporte
    format: fill-in
    question: |-
      Complète pour que la fonction soit utilisable hors du package :
      ```go
      func ___alculerTotal(c Commande) int64
      ```
    blanks:
      - - C
    answer: Une majuscule exporte l'identifiant.
  - key: trous-erreur
    format: fill-in
    question: |-
      Complète le message du compilateur :
      ```
      use of ___ package github.com/exemple/boutique/internal/commande not allowed
      ```
    blanks:
      - - internal
    answer: use of internal package ... not allowed.
  - key: trous-imbrique
    format: fill-in
    question: |-
      Complète pour réserver le client Stripe au seul package paiement :
      ```
      internal/paiement/___/stripe
      ```
    blanks:
      - - internal
    answer: Un internal imbriqué.
  - key: bug-api-publique
    format: bug-fix
    question: Une autre équipe importe des packages de ton service qui changent à chaque version, et se plaint des ruptures. Que proposes-tu ?
    choices:
      - {text: "Mettre sous `internal/` tout ce qui n'est pas un contrat, et exposer un package `client` stable", correct: true}
      - {text: "Demander à l'autre équipe de figer sa version du module et de ne plus jamais monter", correct: false}
      - {text: "Ne plus rien changer, pour toujours, aux packages exportés que l'équipe importe", correct: false}
      - {text: "Préfixer les packages instables par `beta_`, pour prévenir les autres équipes", correct: false}
    answer: |-
      ```
      boutique/
      ├── client/          # l'API publique, stable et versionnée
      └── internal/        # tout le reste : modifiable librement
          ├── commande/
          └── paiement/
      ```
      On déplace tout ce qui n'est pas un contrat sous `internal/`, que le compilateur protège, et l'on expose seulement un package `client` stable (ou une API réseau). Un préfixe n'empêche aucun import.
  - key: bug-tout-exporte
    format: bug-fix
    question: |-
      Le package exporte tous ses détails, et d'autres packages en dépendent. Quelle correction est la bonne ?
      ```go
      type CacheInterne struct{ Entrees map[string]Entree }
      func CalculerCleHash(s string) string
      func Service() *ServiceImpl
      ```
    choices:
      - {text: "N'exporter que le point d'entrée (`Service`, `New`), et passer le reste en minuscules", correct: true}
      - {text: "Déplacer les détails dans un package `detail`, exporté à part", correct: false}
      - {text: "Ajouter un commentaire « usage interne » sur chaque identifiant", correct: false}
      - {text: "Exporter aussi une interface pour chaque type, pour découpler", correct: false}
    answer: |-
      ```go
      type cacheInterne struct{ entrees map[string]entree }
      func calculerCleHash(s string) string

      // Service est le point d'entrée du package.
      type Service struct{ cache cacheInterne }
      func New() *Service
      ```
      On n'exporte que ce que les autres packages doivent utiliser ; le reste passe en minuscules, et le compilateur protège la frontière. Un commentaire n'empêche aucun import.
  - key: bug-cycle
    format: bug-fix
    question: |-
      Le compilateur refuse « import cycle not allowed » entre commande et client. Quelle correction est la bonne ?
      ```go
      // package commande
      import "boutique/internal/client"
      func (c Commande) Valider() error { return client.VerifierSolvabilite(c.ClientID) }

      // package client
      import "boutique/internal/commande"
      func Historique(id string) []commande.Commande
      ```
    choices:
      - {text: "Une interface `Solvabilite` déclarée dans `commande`, implémentée par `client`, branchée par `main`", correct: true}
      - {text: "Importer `client` sous un alias dans `commande`, pour casser le cycle", correct: false}
      - {text: "Fusionner `commande` et `client` dans un package `util` commun", correct: false}
      - {text: "Appeler `client` par la réflexion, pour se passer de l'import", correct: false}
    answer: |-
      ```go
      // package commande : l'interface est déclarée chez celui qui en a besoin
      type Solvabilite interface {
      	Verifier(ctx context.Context, clientID string) error
      }

      type Service struct{ solvabilite Solvabilite }
      ```
      `commande` ne dépend plus de `client` ; `main` branche l'implémentation de `client` sur l'interface. Un alias ne change rien au graphe des imports.
  - key: bug-internal-racine
    format: bug-fix
    question: |-
      Le package `util` doit rester privé au module, mais d'autres modules l'importent. Il est placé ainsi ; quelle correction est la bonne ?
      ```
      boutique/util/
      ```
    choices:
      - {text: "Le déplacer sous `boutique/internal/util/`", correct: true}
      - {text: "Le déplacer sous `boutique/pkg/util/`", correct: false}
      - {text: "Écrire « Package util est privé » dans sa documentation", correct: false}
      - {text: "Passer toutes ses fonctions en minuscules", correct: false}
    answer: |-
      ```
      boutique/internal/util/
      ```
      Placé sous `internal/`, il n'est plus importable hors du module ; mieux encore, ses fonctions rejoignent les packages qui les utilisent. En minuscules, elles ne serviraient plus à aucun autre package, même du module.
