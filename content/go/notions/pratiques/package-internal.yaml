notion: package-internal
lesson: |-
  Un dossier nommé **`internal`** crée une **frontière vérifiée par le compilateur** : les packages qu'il contient ne
  peuvent être importés que par le code situé dans le dossier **parent** de `internal` (et ses sous-dossiers).

  ```
  github.com/exemple/boutique/
  ├── cmd/api/                       peut importer boutique/internal/...
  ├── internal/
  │   ├── commande/                  importable par tout boutique/...
  │   └── paiement/
  │       └── internal/stripe/       importable seulement par paiement/...
  └── client/                        API publique du module
  ```

  Un autre module qui tente `import "github.com/exemple/boutique/internal/commande"` reçoit une erreur :
  « use of internal package not allowed ».

  Pourquoi c'est précieux :
  - on peut **réorganiser** le code interne librement, sans casser personne : seul ce qui est hors d'internal est une
    API publique à maintenir ;
  - dans un service (qui n'est importé par personne), `internal/` signale clairement « rien ici n'est une API » ;
  - imbriqué, il limite un détail d'implémentation à un seul sous-arbre (le client Stripe réservé au package paiement).

  Les autres frontières de package :
  - la **visibilité** par la casse : seuls les identifiants en majuscule sortent du package ;
  - **pas de cycle d'import** : le compilateur l'interdit, ce qui force un graphe de dépendances clair ;
  - chaque package doit avoir une **responsabilité** nette et exporter le moins possible.

  **En entretien** : « internal/ : importable seulement depuis son parent, vérifié par le compilateur ; liberté de
  refactoriser ; imbriquable ; avec la casse et l'absence de cycles, c'est l'outil d'architecture de Go. »
cards:
  - key: cycles-import-sont-ils-interdits
    format: course
    question: Pourquoi les cycles d'import sont-ils interdits ?
    answer: Pour garantir un graphe de dépendances acyclique, une compilation rapide et un découpage propre.
  - key: sert-repertoire-internal
    format: course
    question: À quoi sert le répertoire internal ?
    answer: Ses packages ne sont importables que depuis l'arborescence parente.
  - key: sert-internal
    format: course
    question: À quoi sert internal/ ?
    answer: À rendre des packages importables uniquement depuis l'arborescence parente du module.
  - key: terme-internal
    format: course
    question: Que désigne « internal/ » ?
    answer: Répertoire dont les packages ne sont importables que par leur parent
  - key: vf-compilateur
    format: true-false
    question: La restriction des packages internal est vérifiée par le compilateur.
    truth: true
    answer: L'import est refusé avec « use of internal package not allowed ».
  - key: vf-parent
    format: true-false
    question: Un package dans a/b/internal/c peut être importé depuis a/x.
    truth: false
    answer: Seulement depuis a/b et ses sous-dossiers.
  - key: vf-imbrique
    format: true-false
    question: On peut placer un dossier internal à l'intérieur d'un autre package pour restreindre davantage.
    truth: true
    answer: La règle s'applique à chaque niveau.
  - key: vf-convention
    format: true-false
    question: internal n'est qu'une convention de nommage sans effet.
    truth: false
    answer: C'est une règle du langage appliquée par la chaîne d'outils.
  - key: qcm-import
    format: multiple-choice
    question: Le module github.com/exemple/boutique contient internal/commande. Qui peut l'importer ?
    choices:
      - text: github.com/exemple/boutique/cmd/api
        correct: true
      - text: github.com/exemple/boutique/internal/paiement
        correct: true
      - text: github.com/autre/projet
        correct: false
      - text: github.com/exemple/autre-module
        correct: false
    answer: Seul le code sous github.com/exemple/boutique.
  - key: qcm-avantages
    format: multiple-choice
    question: Qu'apporte internal ?
    choices:
      - text: La liberté de refactoriser sans casser d'utilisateurs extérieurs
        correct: true
      - text: Une API publique réduite et explicite
        correct: true
      - text: Des performances meilleures
        correct: false
      - text: Le chiffrement du code
        correct: false
    answer: C'est un outil de conception, pas de performance.
  - key: qcm-frontieres
    format: multiple-choice
    question: Quels mécanismes structurent les frontières entre packages ?
    choices:
      - text: La majuscule qui exporte un identifiant
        correct: true
      - text: Le dossier internal
        correct: true
      - text: L'interdiction des cycles d'import
        correct: true
      - text: Les mots-clés public et private
        correct: false
    answer: Go n'a pas ces mots-clés.
  - key: qcm-cycle
    format: multiple-choice
    question: Pourquoi l'interdiction des cycles d'import est-elle utile ?
    choices:
      - text: Elle force un graphe de dépendances clair, du haut vers le bas
        correct: true
      - text: Elle permet une compilation rapide et parallèle des packages
        correct: true
      - text: Elle empêche les goroutines de se bloquer
        correct: false
      - text: Elle n'a aucune utilité, c'est une limite technique
        correct: false
    answer: Elle oblige à placer les concepts partagés au bon endroit.
  - key: trous-dossier
    format: fill-in
    question: |-
      Complétez le chemin pour que le package soit privé au module :
      ```
      github.com/exemple/boutique/___/commande
      ```
    blanks:
      - - internal
    answer: internal.
  - key: trous-exporte
    format: fill-in
    question: |-
      Complétez pour que la fonction soit utilisable hors du package :
      ```go
      func ___alculerTotal(c Commande) int64
      ```
    blanks:
      - - C
    answer: Une majuscule exporte l'identifiant.
  - key: trous-erreur
    format: fill-in
    question: |-
      Complétez le message du compilateur :
      ```
      use of ___ package github.com/exemple/boutique/internal/commande not allowed
      ```
    blanks:
      - - internal
    answer: use of internal package ... not allowed.
  - key: trous-imbrique
    format: fill-in
    question: |-
      Complétez pour réserver le client Stripe au seul package paiement :
      ```
      internal/paiement/___/stripe
      ```
    blanks:
      - - internal
    answer: Un internal imbriqué.
  - key: bug-api-publique
    format: bug-fix
    question: Une autre équipe importe des packages de ton service qui changent à chaque version, et se plaint des ruptures. Que proposes-tu ?
    answer: |-
      ```
      boutique/
      ├── client/          # l'API publique, stable et versionnée
      └── internal/        # tout le reste : modifiable librement
          ├── commande/
          └── paiement/
      ```
      On déplace tout ce qui n'est pas un contrat sous internal/, que le compilateur protège, et l'on expose seulement un
      package client stable (ou une API réseau).
  - key: bug-tout-exporte
    format: bug-fix
    question: |-
      Le package exporte tous ses détails, et d'autres packages en dépendent :
      ```go
      type CacheInterne struct{ Entrees map[string]Entree }
      func CalculerCleHash(s string) string
      func Service() *ServiceImpl
      ```
    answer: |-
      ```go
      type cacheInterne struct{ entrees map[string]entree }
      func calculerCleHash(s string) string

      // Service est le point d'entrée du package.
      type Service struct{ cache cacheInterne }
      func New() *Service
      ```
      On n'exporte que ce que les autres packages doivent utiliser ; le reste passe en minuscules.
  - key: bug-cycle
    format: bug-fix
    question: |-
      Le compilateur refuse « import cycle not allowed » entre commande et client :
      ```go
      // package commande
      import "boutique/internal/client"
      func (c Commande) Valider() error { return client.VerifierSolvabilite(c.ClientID) }

      // package client
      import "boutique/internal/commande"
      func Historique(id string) []commande.Commande
      ```
    answer: "```go\n// package commande : l'interface est déclarée chez celui qui en a besoin\ntype Solvabilite interface {\n\tVerifier(ctx context.Context, clientID string) error\n}\n\ntype Service struct{ solvabilite Solvabilite }\n```\ncommande ne dépend plus de client ; le main branche l'implémentation de client sur l'interface."
  - key: bug-internal-racine
    format: bug-fix
    question: |-
      Le package util doit rester privé au module, mais il est placé ainsi et d'autres modules l'importent :
      ```
      boutique/util/
      ```
    answer: |-
      ```
      boutique/internal/util/
      ```
      Placé sous internal/, il n'est plus importable hors du module ; mieux encore, ses fonctions rejoignent les packages
      qui les utilisent, avec un nom qui dit ce qu'elles font.
