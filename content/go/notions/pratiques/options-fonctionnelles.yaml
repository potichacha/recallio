notion: options-fonctionnelles
lesson: "Go n'a ni paramètres par défaut ni surcharge. Pour un constructeur avec beaucoup de réglages **facultatifs**, le motif\ndes **options fonctionnelles** est courant :\n\n```go\ntype Option func(*Client)\n\nfunc AvecDelai(d time.Duration) Option {\n\treturn func(c *Client) { c.delai = d }\n}\n\nfunc AvecJournal(l *slog.Logger) Option {\n\treturn func(c *Client) { c.log = l }\n}\n\nfunc NewClient(base string, opts ...Option) *Client {\n\tc := &Client{base: base, delai: 5 * time.Second, log: slog.Default()} // les défauts\n\tfor _, opt := range opts {\n\t\topt(c)\n\t}\n\treturn c\n}\n\nc := NewClient(\"https://api.exemple.fr\", AvecDelai(2*time.Second))\n```\n\nLes avantages :\n- un appel **lisible**, qui ne mentionne que ce qui change ;\n- des **défauts** définis à un seul endroit ;\n- ajouter une option ne casse **aucun** appel existant ;\n- une option peut faire plus qu'affecter un champ (valider, combiner plusieurs réglages).\n\nLes variantes :\n- une option qui renvoie une **erreur** (`type Option func(*Client) error`) quand une valeur peut être invalide ;\n- une **interface** `Option` avec une méthode, pour des options partagées entre plusieurs types (gRPC fait ainsi) ;\n- une **struct d'options** (`NewClient(base, ClientOptions{Delai: 2 * time.Second})`) : plus simple, documentée\n  d'un coup d'œil, mais la valeur zéro d'un champ se confond avec « non fourni ».\n\nOn n'en abuse pas : pour deux ou trois paramètres, des arguments ordinaires ou une petite struct sont plus clairs.\n\n**En entretien** : « type Option func(*T), des fonctions AvecX qui renvoient une Option, un constructeur variadique\nqui applique les défauts puis les options ; lisible et extensible ; une struct d'options est une alternative plus\nsimple. »"
cards:
  - key: pattern-functional-options
    format: course
    question: "Qu'est-ce que le motif des options fonctionnelles ?"
    choices:
      - {text: "Des fonctions `Option func(*T)`, passées en variadique au constructeur, pour les réglages facultatifs", correct: true}
      - {text: "Une struct `Options` dont chaque champ est une fonction, appelée au démarrage du programme", correct: false}
      - {text: "Un objet builder avec une méthode par réglage, terminé par un appel à `Build()`", correct: false}
      - {text: "Des paramètres nommés avec une valeur par défaut, comme `New(delai = 5)`", correct: false}
    answer: "Des fonctions `Option func(*T)` passées en paramètre variadique au constructeur, qui fixe ses défauts puis applique chaque option. C'est la réponse de Go à l'absence de paramètres nommés et par défaut, sans builder séparé."
  - key: functional-options-vs-struct-configuration
    format: course
    question: "Quand préférer les options fonctionnelles à une struct de configuration ?"
    choices:
      - {text: "Pour une API publique extensible, avec peu d'options ; la struct quand les champs sont nombreux ou lus d'un fichier", correct: true}
      - {text: "Toujours : une struct de configuration est un anti-motif en Go, que les linters refusent", correct: false}
      - {text: "Quand la configuration est lue d'un fichier YAML, que les options savent décoder", correct: false}
      - {text: "Jamais pour une API publique : chaque option ajoutée casse les appelants existants", correct: false}
    answer: "Les options pour une API publique extensible, avec peu d'options ; une struct quand il y a beaucoup de champs, ou une configuration chargée depuis un fichier. Ajouter une option ne casse aucun appelant."
  - key: concois-client-api-interne-sera-utilise
    format: scenario
    question: Tu conçois le client Go d'une API interne qui sera utilisé par dix équipes. Comment conçois-tu son API ?
    choices:
      - {text: "`New(baseURL, opts ...Option) (*Client, error)`, des défauts sûrs, `ctx` en premier, des erreurs typées", correct: true}
      - {text: "Une interface `Client` exportée et ses mocks générés, que chaque équipe doit utiliser telle quelle", correct: false}
      - {text: "Une struct `Client` aux champs exportés, à remplir sans constructeur ni validation", correct: false}
      - {text: "Un client par équipe, chacun adapté à ses besoins et versionné séparément", correct: false}
    answer: "Un constructeur `New(baseURL string, opts ...Option) (*Client, error)` aux défauts sûrs (délais, réessais limités) et des options (`WithHTTPClient`, `WithRetry`, `WithLogger`) ; des méthodes métier typées avec `ctx` en premier, des erreurs documentées (`ErrNotFound`, `*APIError`), et pas d'interface exportée : chaque équipe déclare la sienne pour ses faux. Le client est sûr entre goroutines, et la surface exportée reste minimale, car chaque identifiant est un engagement pour dix équipes."
  - key: pattern-remplace-souvent-builder
    format: course
    question: "Quel motif remplace souvent le Builder en Go ?"
    choices:
      - {text: "Les options fonctionnelles", correct: true}
      - {text: "Le singleton", correct: false}
      - {text: "L'héritage par incorporation", correct: false}
      - {text: "Les fonctions `init`", correct: false}
    answer: "Les options fonctionnelles (ou une struct d'options) : le constructeur fixe ses défauts et applique les options, sans objet de construction séparé."
  - key: vs-struct
    format: course
    question: 'Options fonctionnelles ou struct d''options : quelle différence ?'
    choices:
      - {text: "Les options ne citent que ce qui change et peuvent valider ; la struct se lit d'un coup, mais 0 vaut « absent »", correct: true}
      - {text: "Les options sont évaluées à la compilation, alors que la struct n'est lue qu'à l'exécution", correct: false}
      - {text: "La struct accepte des défauts non nuls, alors que les options ne posent que des valeurs zéro", correct: false}
      - {text: "Aucune différence de fond : seul le style change, et chaque équipe choisit selon son goût", correct: false}
    answer: "Les options fonctionnelles ne mentionnent que ce qui change, peuvent valider et s'ajoutent sans casser les appels ; la struct d'options est plus simple et se lit d'un coup d'œil, mais sa valeur zéro se confond avec « non fourni »."
  - key: vf-defauts
    format: true-false
    question: Avec les options fonctionnelles, les valeurs par défaut sont fixées dans le constructeur avant d'appliquer les options.
    truth: true
    answer: Les options ne remplacent que ce qu'elles touchent.
  - key: vf-compat
    format: true-false
    question: Ajouter une nouvelle option fonctionnelle oblige à modifier tous les appels existants.
    truth: false
    answer: 'Le paramètre est variadique : les appels existants restent valides.'
  - key: vf-parametres-defaut
    format: true-false
    question: Go permet des valeurs par défaut pour les paramètres de fonction.
    truth: false
    answer: D'où les options fonctionnelles ou les structs d'options.
  - key: vf-abus
    format: true-false
    question: Les options fonctionnelles conviennent aussi à une fonction qui n'a que deux paramètres obligatoires.
    truth: false
    answer: Des arguments ordinaires sont alors plus clairs.
  - key: qcm-elements
    format: multiple-choice
    question: "Lequel de ces éléments ne fait pas partie du motif des options fonctionnelles ?"
    choices:
      - {text: "Une méthode `Build()`, à appeler en dernier", correct: true}
      - {text: "`type Option func(*Client)`", correct: false}
      - {text: "Des fonctions comme `AvecDelai(d) Option`", correct: false}
      - {text: "Un constructeur `NewClient(base string, opts ...Option)`", correct: false}
    answer: "Pas de builder séparé : le constructeur applique les options et renvoie l'objet. Le motif se compose de `type Option func(*Client)`, de fonctions comme `AvecDelai(d) Option` et d'un constructeur variadique."
  - key: qcm-avantages
    format: multiple-choice
    question: "Lequel de ces avantages les options fonctionnelles n'ont-elles pas ?"
    choices:
      - {text: "Une documentation plus courte qu'une struct", correct: true}
      - {text: "Des appels lisibles, qui ne citent que ce qui change", correct: false}
      - {text: "L'ajout d'options sans casser les appelants", correct: false}
      - {text: "Des options capables de valider leur valeur", correct: false}
    answer: "Chaque option est une fonction à documenter : c'est souvent plus long qu'une struct commentée. Elles donnent des appels qui ne citent que ce qui change, des ajouts sans casser les appelants et des options qui valident leur valeur."
  - key: qcm-erreur
    format: multiple-choice
    question: Comment gérer une option dont la valeur peut être invalide (un délai négatif) ?
    choices:
      - {text: "`type Option func(*Client) error`, et NewClient renvoie la première erreur", correct: true}
      - {text: "Ignorer la valeur invalide en silence, et garder la valeur par défaut", correct: false}
      - {text: "Paniquer dans l'option, dès qu'elle reçoit une valeur hors des bornes", correct: false}
      - {text: "Corriger la valeur à zéro sans rien dire, puis finir la construction", correct: false}
    answer: "L'option renvoie une erreur, et le constructeur la remonte : l'appelant sait que sa configuration est refusée. Ignorer ou corriger en silence cache l'erreur, et paniquer empêche l'appelant de réagir."
  - key: qcm-usages
    format: multiple-choice
    question: "Où trouve-t-on ce motif dans l'écosystème Go ?"
    choices:
      - {text: "Dans les options de `grpc.NewServer` et `grpc.NewClient`", correct: true}
      - {text: "Dans les fonctions d'affichage du package `fmt`", correct: false}
      - {text: "Dans les fonctions du package `strings`", correct: false}
      - {text: "Dans les fonctions intégrées `make` et `new`", correct: false}
    answer: "gRPC l'utilise (avec des interfaces `ServerOption` et `DialOption`), comme de nombreux clients et serveurs de bibliothèques. `fmt`, `strings` et les fonctions intégrées n'ont pas de réglages facultatifs."
  - key: trous-type
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      type Option ___(*Serveur)
      ```
    blanks:
      - - func
    answer: Une fonction qui modifie le type.
  - key: trous-variadique
    format: fill-in
    question: |-
      Complète la signature :
      ```go
      func NewServeur(adresse string, opts ___Option) *Serveur
      ```
    blanks:
      - - '...'
    answer: Un paramètre variadique.
  - key: trous-appliquer
    format: fill-in
    question: |-
      Complète l'application des options :
      ```go
      for _, opt := range opts {
      	___(s)
      }
      ```
    blanks:
      - - opt
    answer: Chaque option est appelée sur le serveur.
  - key: trous-option
    format: fill-in
    question: |-
      Complète l'option :
      ```go
      func AvecPort(p int) Option {
      	___ func(s *Serveur) { s.port = p }
      }
      ```
    blanks:
      - - return
    answer: L'option renvoie la fonction.
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le délai passé en option est toujours ignoré. Quelle correction est la bonne ?
      ```go
      func NewClient(opts ...Option) *Client {
      	c := &Client{}
      	for _, opt := range opts {
      		opt(c)
      	}
      	c.delai = 5 * time.Second
      	return c
      }
      ```
    choices:
      - {text: "Fixer les défauts avant d'appliquer les options, dès la création de `c`", correct: true}
      - {text: "Appliquer les options deux fois, avant et après avoir fixé les défauts", correct: false}
      - {text: "Ne fixer le défaut que si `c.delai` vaut encore zéro, en fin de fonction", correct: false}
      - {text: "Passer `c` par valeur aux options, au lieu d'un pointeur", correct: false}
    answer: |-
      ```go
      func NewClient(opts ...Option) *Client {
      	c := &Client{delai: 5 * time.Second}
      	for _, opt := range opts {
      		opt(c)
      	}
      	return c
      }
      ```
      Les défauts écrasaient les options : ils se fixent avant de les appliquer. Tester la valeur zéro après coup marcherait, mais empêcherait de demander explicitement zéro.
  - key: bug-zero
    format: bug-fix
    question: |-
      Avec une struct d'options, impossible de demander zéro réessai : 0 est remplacé par le défaut de 3. Quelle correction est la bonne ?
      ```go
      type Options struct{ Reessais int }

      if o.Reessais == 0 {
      	o.Reessais = 3
      }
      ```
    choices:
      - {text: "Une option `AvecReessais(n)` appliquée sur un défaut de 3, ou un pointeur dans la struct", correct: true}
      - {text: "Prendre -1 comme valeur spéciale qui veut dire « zéro réessai »", correct: false}
      - {text: "Tester `o.Reessais < 0` au lieu de `o.Reessais == 0` pour le défaut", correct: false}
      - {text: "Supprimer le défaut : zéro réessai devient la règle pour tous les appelants", correct: false}
    answer: |-
      ```go
      func AvecReessais(n int) Option {
      	return func(c *Client) { c.reessais = n }
      }

      c := &Client{reessais: 3} // défaut
      for _, opt := range opts {
      	opt(c)
      }
      ```
      La valeur zéro d'une struct se confond avec « non fourni » ; une option explicite (ou un `*int` dans la struct) distingue les deux. Une valeur magique comme -1 se documente mal, et changer le test retire le défaut à qui ne règle rien.
  - key: bug-validation
    format: bug-fix
    question: |-
      Un délai négatif est accepté et provoque des échecs immédiats en production. Quelle correction est la bonne ?
      ```go
      func AvecDelai(d time.Duration) Option {
      	return func(c *Client) { c.delai = d }
      }
      ```
    choices:
      - {text: "`type Option func(*Client) error` : l'option valide, et `NewClient` renvoie l'erreur", correct: true}
      - {text: "Remplacer en silence tout délai négatif par sa valeur absolue", correct: false}
      - {text: "Paniquer dans `AvecDelai` dès que le délai reçu est négatif", correct: false}
      - {text: "Documenter que le délai doit être positif, sans rien vérifier", correct: false}
    answer: |-
      ```go
      type Option func(*Client) error

      func AvecDelai(d time.Duration) Option {
      	return func(c *Client) error {
      		if d <= 0 {
      			return fmt.Errorf("délai %v invalide : il doit être positif", d)
      		}
      		c.delai = d
      		return nil
      	}
      }

      func NewClient(opts ...Option) (*Client, error) {
      	c := &Client{delai: 5 * time.Second}
      	for _, opt := range opts {
      		if err := opt(c); err != nil {
      			return nil, err
      		}
      	}
      	return c, nil
      }
      ```
      L'option valide sa valeur et le constructeur renvoie l'erreur : l'appelant sait que sa configuration est refusée. Corriger en silence ou paniquer lui retire ce choix.
  - key: bug-mutable
    format: bug-fix
    question: |-
      Le client d'un service change de comportement quand un autre service modifie ses options. Quelle correction est la bonne ?
      ```go
      var OptionsParDefaut = []Option{AvecDelai(5 * time.Second)}

      // ailleurs
      OptionsParDefaut = append(OptionsParDefaut, AvecJournal(log))
      c := NewClient(OptionsParDefaut...)
      ```
    choices:
      - {text: "Mettre les défauts dans le constructeur, et ne passer que les options voulues", correct: true}
      - {text: "Protéger `OptionsParDefaut` par un `sync.Mutex` partagé par tous les services", correct: false}
      - {text: "Remplir `OptionsParDefaut` une seule fois, dans une fonction `init` du package", correct: false}
      - {text: "Déclarer `OptionsParDefaut` avec `const`, pour qu'on ne puisse plus la modifier", correct: false}
    answer: |-
      ```go
      func NewClient(opts ...Option) *Client {
      	c := &Client{delai: 5 * time.Second, log: slog.Default()} // défauts dans le constructeur
      	for _, opt := range opts {
      		opt(c)
      	}
      	return c
      }

      c := NewClient(AvecJournal(log))
      ```
      Une variable globale modifiable partageait les réglages entre appelants ; les défauts vivent dans le constructeur. Un mutex sérialiserait les accès sans empêcher un service de changer les réglages des autres, et une slice ne peut pas être `const`.
  - key: scenario-choix
    format: scenario
    question: Comment choisis-tu entre arguments, struct d'options et options fonctionnelles ?
    choices:
      - {text: "Des arguments pour l'obligatoire ; une struct pour beaucoup de réglages internes ; des options pour une API publique", correct: true}
      - {text: "Des options fonctionnelles partout, même pour les paramètres obligatoires du constructeur", correct: false}
      - {text: "Une struct d'options partout : une seule façon de faire, quel que soit le nombre de réglages", correct: false}
      - {text: "Des arguments partout, quitte à avoir quinze paramètres positionnels dans le constructeur", correct: false}
    answer: "Des arguments ordinaires pour quelques paramètres obligatoires. Une struct d'options quand les réglages sont nombreux, que leur valeur zéro convient comme défaut et que l'API est interne ; des options fonctionnelles pour une API publique appelée à évoluer, avec des défauts non nuls ou des validations. Dans tous les cas, les obligatoires restent des paramètres."
  - key: scenario-api-publique
    format: scenario
    question: Tu publies un client Go utilisé par d'autres équipes. Comment le rends-tu extensible sans casser personne ?
    choices:
      - {text: "`New(base, opts ...Option) (*Client, error)` : un réglage de plus, c'est une option de plus", correct: true}
      - {text: "Ajouter un paramètre à `New` à chaque réglage, en publiant chaque fois une version majeure", correct: false}
      - {text: "Exposer une struct aux champs exportés, que les équipes remplissent comme elles l'entendent", correct: false}
      - {text: "Ajouter une fonction `NewV2`, `NewV3`, à chaque réglage, en gardant toutes les anciennes", correct: false}
    answer: "`New(base string, opts ...Option) (*Client, error)` avec des options `WithTimeout`, `WithHTTPClient`, `WithLogger`, `WithRetry`, chacune documentée avec sa valeur par défaut. Ajouter un réglage, c'est une nouvelle option, sans toucher à la signature ; les options valident leurs valeurs, et le constructeur renvoie une erreur explicite."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande d'expliquer les options fonctionnelles. Que réponds-tu ?"
    choices:
      - {text: "Le constructeur prend l'obligatoire puis `opts ...Option`, fixe ses défauts et applique chaque option", correct: true}
      - {text: "Des paramètres par défaut, comme en Python, que Go a ajoutés pour les constructeurs", correct: false}
      - {text: "Un builder dont chaque méthode renvoie le builder, et qu'on termine par `Build()`", correct: false}
      - {text: "Des fonctions de rappel appelées après la construction, pour prévenir l'appelant", correct: false}
    answer: "Go n'a pas de paramètres par défaut : le constructeur prend les paramètres obligatoires puis `opts ...Option`, où `Option` est une fonction qui modifie l'objet ; il fixe les défauts, applique chaque option et renvoie l'objet. Les appels restent lisibles (`NewServeur(addr, AvecTLS(cfg))`), et l'API s'étend sans rupture : c'est l'équivalent Go du builder ou des arguments nommés."
