notion: options-fonctionnelles
cards:
  - key: pattern-functional-options
    format: course
    question: C'est quoi le pattern functional options ?
    answer: Des fonctions `Option func(*T)` passées en variadique au constructeur pour configurer des paramètres optionnels.
  - key: functional-options-vs-struct-configuration
    format: course
    question: Functional options vs struct de configuration ?
    answer: Options pour des API publiques extensibles avec peu d'options ; struct quand il y a beaucoup de champs ou une configuration chargée depuis un fichier.
  - key: concois-client-api-interne-sera-utilise
    format: scenario
    question: Tu conçois le client Go d'une API interne qui sera utilisé par dix équipes. Comment conçois-tu son API ?
    answer: |-
      Un constructeur `New(baseURL string, opts ...Option) (*Client, error)` avec des valeurs par défaut sûres (timeouts, retries limités, un `http.Client` partagé), des options pour personnaliser (`WithHTTPClient`, `WithRetry`, `WithLogger`).
      Des méthodes synchrones, typées et nommées selon le métier (`GetOrder(ctx, id) (*Order, error)`), avec `ctx` en premier, des erreurs sentinelles ou typées documentées (`ErrNotFound`, `*APIError` avec le code), et pas d'interface exportée : les équipes définiront leur propre petite interface pour leurs mocks.
      Le client est sûr en concurrence et le documente. Je publierais des exemples testables, une politique de versioning sémantique stricte, et je garderais la surface exportée minimale, car chaque identifiant exporté est un engagement de compatibilité pour dix équipes.
  - key: pattern-remplace-souvent-builder
    format: course
    question: Quel pattern remplace souvent le Builder en Go ?
    answer: Les functional options.
