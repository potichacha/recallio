notion: options-fonctionnelles
lesson: "Go n'a ni paramètres par défaut ni surcharge. Pour un constructeur avec beaucoup de réglages **facultatifs**, le motif\ndes **options fonctionnelles** est courant :\n\n```go\ntype Option func(*Client)\n\nfunc AvecDelai(d time.Duration) Option {\n\treturn func(c *Client) { c.delai = d }\n}\n\nfunc AvecJournal(l *slog.Logger) Option {\n\treturn func(c *Client) { c.log = l }\n}\n\nfunc NewClient(base string, opts ...Option) *Client {\n\tc := &Client{base: base, delai: 5 * time.Second, log: slog.Default()} // les défauts\n\tfor _, opt := range opts {\n\t\topt(c)\n\t}\n\treturn c\n}\n\nc := NewClient(\"https://api.exemple.fr\", AvecDelai(2*time.Second))\n```\n\nLes avantages :\n- un appel **lisible**, qui ne mentionne que ce qui change ;\n- des **défauts** définis à un seul endroit ;\n- ajouter une option ne casse **aucun** appel existant ;\n- une option peut faire plus qu'affecter un champ (valider, combiner plusieurs réglages).\n\nLes variantes :\n- une option qui renvoie une **erreur** (`type Option func(*Client) error`) quand une valeur peut être invalide ;\n- une **interface** `Option` avec une méthode, pour des options partagées entre plusieurs types (gRPC fait ainsi) ;\n- une **struct d'options** (`NewClient(base, ClientOptions{Delai: 2 * time.Second})`) : plus simple, documentée\n  d'un coup d'œil, mais la valeur zéro d'un champ se confond avec « non fourni ».\n\nOn n'en abuse pas : pour deux ou trois paramètres, des arguments ordinaires ou une petite struct sont plus clairs.\n\n**En entretien** : « type Option func(*T), des fonctions AvecX qui renvoient une Option, un constructeur variadique\nqui applique les défauts puis les options ; lisible et extensible ; une struct d'options est une alternative plus\nsimple. »"
cards:
  - key: pattern-functional-options
    format: course
    question: C'est quoi le pattern functional options ?
    answer: Des fonctions `Option func(*T)` passées en variadique au constructeur pour configurer des paramètres optionnels.
  - key: functional-options-vs-struct-configuration
    format: course
    question: Functional options vs struct de configuration ?
    answer: Options pour des API publiques extensibles avec peu d'options ; struct quand il y a beaucoup de champs ou une configuration chargée depuis un fichier.
  - key: concois-client-api-interne-sera-utilise
    format: scenario
    question: Tu conçois le client Go d'une API interne qui sera utilisé par dix équipes. Comment conçois-tu son API ?
    answer: |-
      Un constructeur `New(baseURL string, opts ...Option) (*Client, error)` avec des valeurs par défaut sûres (timeouts, retries limités, un `http.Client` partagé), des options pour personnaliser (`WithHTTPClient`, `WithRetry`, `WithLogger`).
      Des méthodes synchrones, typées et nommées selon le métier (`GetOrder(ctx, id) (*Order, error)`), avec `ctx` en premier, des erreurs sentinelles ou typées documentées (`ErrNotFound`, `*APIError` avec le code), et pas d'interface exportée : les équipes définiront leur propre petite interface pour leurs mocks.
      Le client est sûr en concurrence et le documente. Je publierais des exemples testables, une politique de versioning sémantique stricte, et je garderais la surface exportée minimale, car chaque identifiant exporté est un engagement de compatibilité pour dix équipes.
  - key: pattern-remplace-souvent-builder
    format: course
    question: Quel pattern remplace souvent le Builder en Go ?
    answer: Les functional options.
  - key: vs-struct
    format: course
    question: 'Options fonctionnelles ou struct d''options : quelle différence ?'
    answer: Les options fonctionnelles ne mentionnent que ce qui change, peuvent valider et s'ajoutent sans casser les appels ; la struct d'options est plus simple et se lit d'un coup d'œil, mais sa valeur zéro se confond avec « non fourni ».
  - key: vf-defauts
    format: true-false
    question: Avec les options fonctionnelles, les valeurs par défaut sont fixées dans le constructeur avant d'appliquer les options.
    truth: true
    answer: Les options ne remplacent que ce qu'elles touchent.
  - key: vf-compat
    format: true-false
    question: Ajouter une nouvelle option fonctionnelle oblige à modifier tous les appels existants.
    truth: false
    answer: 'Le paramètre est variadique : les appels existants restent valides.'
  - key: vf-parametres-defaut
    format: true-false
    question: Go permet des valeurs par défaut pour les paramètres de fonction.
    truth: false
    answer: D'où les options fonctionnelles ou les structs d'options.
  - key: vf-abus
    format: true-false
    question: Les options fonctionnelles conviennent aussi à une fonction qui n'a que deux paramètres obligatoires.
    truth: false
    answer: Des arguments ordinaires sont alors plus clairs.
  - key: qcm-elements
    format: multiple-choice
    question: Quels éléments composent le motif ?
    choices:
      - text: '`type Option func(*Client)`'
        correct: true
      - text: Des fonctions comme `AvecDelai(d) Option`
        correct: true
      - text: Un constructeur `NewClient(base string, opts ...Option)`
        correct: true
      - text: Une méthode Build() obligatoire
        correct: false
    answer: Pas de builder séparé.
  - key: qcm-avantages
    format: multiple-choice
    question: Quels avantages ont les options fonctionnelles ?
    choices:
      - text: Des appels lisibles qui ne citent que ce qui change
        correct: true
      - text: L'ajout d'options sans casser les appelants
        correct: true
      - text: Des options capables de valider leur valeur
        correct: true
      - text: Une documentation plus courte qu'une struct
        correct: false
    answer: Chaque option est une fonction à documenter.
  - key: qcm-erreur
    format: multiple-choice
    question: Comment gérer une option dont la valeur peut être invalide (un délai négatif) ?
    choices:
      - text: '`type Option func(*Client) error`, et NewClient renvoie la première erreur'
        correct: true
      - text: Ignorer la valeur invalide en silence
        correct: false
      - text: Paniquer dans l'option
        correct: false
      - text: Corriger la valeur à zéro sans rien dire
        correct: false
    answer: L'appelant doit savoir que sa configuration est refusée.
  - key: qcm-usages
    format: multiple-choice
    question: Où trouve-t-on ce motif ?
    choices:
      - text: Les options de grpc.NewServer et grpc.NewClient
        correct: true
      - text: De nombreux clients et serveurs de bibliothèques
        correct: true
      - text: Le package fmt
        correct: false
      - text: Les fonctions de strings
        correct: false
    answer: gRPC utilise une interface Option.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez la déclaration :
      ```go
      type Option ___(*Serveur)
      ```
    blanks:
      - - func
    answer: Une fonction qui modifie le type.
  - key: trous-variadique
    format: fill-in
    question: |-
      Complétez la signature :
      ```go
      func NewServeur(adresse string, opts ___Option) *Serveur
      ```
    blanks:
      - - '...'
    answer: Un paramètre variadique.
  - key: trous-appliquer
    format: fill-in
    question: "Complétez l'application des options :\n```go\nfor _, opt := range opts {\n\t___(s)\n}\n```"
    blanks:
      - - opt
    answer: Chaque option est appelée sur le serveur.
  - key: trous-option
    format: fill-in
    question: "Complétez l'option :\n```go\nfunc AvecPort(p int) Option {\n\t___ func(s *Serveur) { s.port = p }\n}\n```"
    blanks:
      - - return
    answer: L'option renvoie la fonction.
  - key: bug-ordre
    format: bug-fix
    question: "Le délai passé en option est toujours ignoré :\n```go\nfunc NewClient(opts ...Option) *Client {\n\tc := &Client{}\n\tfor _, opt := range opts {\n\t\topt(c)\n\t}\n\tc.delai = 5 * time.Second\n\treturn c\n}\n```"
    answer: "```go\nfunc NewClient(opts ...Option) *Client {\n\tc := &Client{delai: 5 * time.Second}\n\tfor _, opt := range opts {\n\t\topt(c)\n\t}\n\treturn c\n}\n```\nLes défauts écrasaient les options ; ils se fixent avant d'appliquer les options."
  - key: bug-zero
    format: bug-fix
    question: "Avec une struct d'options, impossible de demander zéro réessai : la valeur 0 est remplacée par le défaut de 3.\n```go\ntype Options struct{ Reessais int }\n\nif o.Reessais == 0 {\n\to.Reessais = 3\n}\n```"
    answer: "```go\nfunc AvecReessais(n int) Option {\n\treturn func(c *Client) { c.reessais = n }\n}\n\nc := &Client{reessais: 3} // défaut\nfor _, opt := range opts {\n\topt(c)\n}\n```\nLa valeur zéro d'une struct se confond avec « non fourni » ; une option explicite (ou un pointeur dans la struct)\ndistingue les deux."
  - key: bug-validation
    format: bug-fix
    question: "Un délai négatif est accepté et provoque des échecs immédiats en production :\n```go\nfunc AvecDelai(d time.Duration) Option {\n\treturn func(c *Client) { c.delai = d }\n}\n```"
    answer: "```go\ntype Option func(*Client) error\n\nfunc AvecDelai(d time.Duration) Option {\n\treturn func(c *Client) error {\n\t\tif d <= 0 {\n\t\t\treturn fmt.Errorf(\"délai %v invalide : il doit être positif\", d)\n\t\t}\n\t\tc.delai = d\n\t\treturn nil\n\t}\n}\n\nfunc NewClient(opts ...Option) (*Client, error) {\n\tc := &Client{delai: 5 * time.Second}\n\tfor _, opt := range opts {\n\t\tif err := opt(c); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n\treturn c, nil\n}\n```\nL'option valide sa valeur et le constructeur renvoie l'erreur."
  - key: bug-mutable
    format: bug-fix
    question: |-
      Le client d'un service change de comportement quand un autre service modifie ses options :
      ```go
      var OptionsParDefaut = []Option{AvecDelai(5 * time.Second)}

      // ailleurs
      OptionsParDefaut = append(OptionsParDefaut, AvecJournal(log))
      c := NewClient(OptionsParDefaut...)
      ```
    answer: "```go\nfunc NewClient(opts ...Option) *Client {\n\tc := &Client{delai: 5 * time.Second, log: slog.Default()} // défauts dans le constructeur\n\tfor _, opt := range opts {\n\t\topt(c)\n\t}\n\treturn c\n}\n\nc := NewClient(AvecJournal(log))\n```\nUne variable globale modifiable partageait les réglages entre appelants ; les défauts vivent dans le constructeur."
  - key: scenario-choix
    format: scenario
    question: Comment choisis-tu entre arguments, struct d'options et options fonctionnelles ?
    answer: |-
      Des arguments ordinaires pour quelques paramètres obligatoires. Une struct d'options quand les réglages sont
      nombreux, que leur valeur zéro convient comme « par défaut » et que l'API est interne. Des options fonctionnelles
      pour une API publique appelée à évoluer, avec des défauts non nuls, des validations, ou des options partagées. Dans
      tous les cas, les obligatoires restent des paramètres.
  - key: scenario-api-publique
    format: scenario
    question: Tu publies un client Go utilisé par d'autres équipes. Comment le rends-tu extensible sans casser personne ?
    answer: |-
      `New(base string, opts ...Option) (*Client, error)` avec des options `WithTimeout`, `WithHTTPClient`, `WithLogger`,
      `WithRetry`, chacune documentée avec sa valeur par défaut. Ajouter un réglage plus tard, c'est une nouvelle option,
      sans toucher à la signature. Les options valident leurs valeurs et le constructeur renvoie une erreur explicite.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande d'expliquer les options fonctionnelles.
    answer: |-
      Go n'a pas de paramètres par défaut : le constructeur prend les paramètres obligatoires puis `opts ...Option`, où
      Option est une fonction qui modifie l'objet. Il fixe les défauts, applique chaque option, puis renvoie l'objet.
      Les appels restent lisibles (`NewServeur(addr, AvecTLS(cfg))`) et l'API s'étend sans rupture. C'est l'équivalent Go
      du builder ou des arguments nommés d'autres langages.
