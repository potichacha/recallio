notion: motifs-conception-go
cards:
  - key: implementer-singleton
    format: course
    question: Comment implémenter un Singleton en Go ?
    answer: Une variable de package initialisée par sync.Once ou sync.OnceValue ; mieux vaut souvent injecter une instance.
  - key: pattern-illustre-http-handlerfunc
    format: course
    question: Quel pattern illustre http.HandlerFunc ?
    answer: 'Adapter : il adapte une fonction à l''interface http.Handler.'
  - key: ecrit-strategy
    format: course
    question: Comment s'écrit une Strategy en Go ?
    answer: Un type fonction ou une interface d'une méthode, passés en paramètre.
  - key: pattern-illustre-sort-interface
    format: course
    question: Quel pattern illustre sort.Interface ?
    answer: 'Template method : l''algorithme est fixe, les étapes Len/Less/Swap sont fournies.'
  - key: pattern-illustrent-bufio-newreader-gzip
    format: course
    question: Quel pattern illustrent bufio.NewReader et gzip.NewReader ?
    answer: Decorator autour d'un io.Reader.
  - key: pattern-fonctions-etat
    format: course
    question: C'est quoi le pattern des fonctions d'état ?
    answer: Chaque état est une fonction qui renvoie la fonction de l'état suivant.
  - key: sticky-error-pattern
    format: course
    question: C'est quoi le sticky error pattern ?
    answer: Mémoriser la première erreur et ignorer les opérations suivantes, pour vérifier l'erreur une seule fois à la fin.
  - key: ecris-decorateur-ajoute-retries-importe-client
    format: scenario
    question: Écris un décorateur qui ajoute des retries à n'importe quel client qui implémente une interface `Fetcher`.
    answer: |-
      ```go
      type Fetcher interface {
          Fetch(ctx context.Context, id string) ([]byte, error)
      }

      type retryFetcher struct {
          next       Fetcher
          tentatives int
          attente    time.Duration
      }

      func WithRetry(next Fetcher, n int, attente time.Duration) Fetcher {
          return &retryFetcher{next: next, tentatives: n, attente: attente}
      }

      func (r *retryFetcher) Fetch(ctx context.Context, id string) ([]byte, error) {
          var err error
          for i := range r.tentatives {
              var b []byte
              if b, err = r.next.Fetch(ctx, id); err == nil {
                  return b, nil
              }
              select {
              case <-time.After(r.attente << i):   // backoff exponentiel
              case <-ctx.Done():
                  return nil, ctx.Err()
              }
          }
          return nil, fmt.Errorf("après %d tentatives: %w", r.tentatives, err)
      }
      ```
      "Le décorateur implémente la même interface, donc il se compose avec d'autres (cache, métriques) sans que l'appelant le sache. Il respecte le contexte pendant l'attente. En production j'ajouterais du *jitter* et je ne réessaierais que les erreurs temporaires, pas un 404."
