notion: motifs-conception-go
lesson: "Les motifs de conception classiques existent en Go, mais sous une forme plus **légère**, grâce aux fonctions de\npremière classe, aux interfaces implicites et à la composition :\n\n**Stratégie** : une interface (ou simplement une **fonction**) passée en paramètre.\n\n```go\ntype Tarification func(c Commande) int64\n\nfunc Facturer(c Commande, tarif Tarification) Facture { ... }\n```\n\n**Décorateur** : un type qui enveloppe une interface et ajoute un comportement ; c'est le principe des middlewares\nHTTP et de `bufio.NewReader(gzip.NewReader(f))`.\n\n```go\ntype depotJournalise struct {\n\tsuivant Depot\n\tlog     *slog.Logger\n}\n\nfunc (d depotJournalise) Trouver(ctx context.Context, id string) (Commande, error) {\n\tc, err := d.suivant.Trouver(ctx, id)\n\td.log.DebugContext(ctx, \"trouver\", \"id\", id, \"err\", err)\n\treturn c, err\n}\n```\n\n**Adaptateur** : un type qui fait correspondre une API à une interface attendue (`http.HandlerFunc` adapte une\nfonction en Handler).\n\n**Observateur** : une liste de fonctions de rappel, ou des **channels** auxquels on envoie les événements.\n\n**Singleton** : `sync.OnceValue` pour une initialisation paresseuse unique ; mais une dépendance **injectée** est\npresque toujours préférable à un singleton global.\n\n**Fabrique** : une fonction `New...` qui renvoie une interface selon un paramètre.\n\n**Builder** : remplacé le plus souvent par les **options fonctionnelles** ou une struct d'options.\n\n**Template method** : sans héritage, on passe les étapes variables en fonctions ou en interface (comme\n`sort.Interface`).\n\n**En entretien** : « Stratégie par une fonction ou une interface, décorateur par enveloppement (middlewares),\nadaptateur (HandlerFunc), observateur par rappels ou channels ; singleton avec OnceValue, mais l'injection vaut mieux ;\nbuilder remplacé par les options fonctionnelles. »"
cards:
  - key: implementer-singleton
    format: course
    question: "Comment implémenter un Singleton en Go ?"
    choices:
      - {text: "Une variable de package initialisée par `sync.Once` ou `sync.OnceValue`, ou mieux, injectée", correct: true}
      - {text: "Un constructeur privé et une méthode statique `getInstance()`, comme en Java", correct: false}
      - {text: "Un test `if instance == nil` dans une fonction d'accès, sans verrou ni `Once`", correct: false}
      - {text: "Une constante de type struct, que Go ne crée qu'une seule fois en mémoire", correct: false}
    answer: "Une variable de package initialisée par `sync.Once` ou `sync.OnceValue`, sûre entre goroutines ; mieux vaut souvent créer l'instance dans `main` et l'injecter. Un `if instance == nil` sans synchronisation est une course de données."
  - key: pattern-illustre-http-handlerfunc
    format: course
    question: "Quel motif de conception illustre `http.HandlerFunc` ?"
    choices:
      - {text: "Adaptateur : il adapte une fonction à l'interface `http.Handler`", correct: true}
      - {text: "Décorateur : il ajoute un comportement autour d'un handler", correct: false}
      - {text: "Fabrique : il crée des handlers à partir d'une configuration", correct: false}
      - {text: "Singleton : il garantit un seul handler par route", correct: false}
    answer: "Adaptateur : le type fonction `HandlerFunc` a une méthode `ServeHTTP` qui l'appelle, ce qui fait d'une simple fonction un `http.Handler`. Un middleware qui enveloppe un handler, lui, est un décorateur."
  - key: ecrit-strategy
    format: course
    question: "Comment écrit-on une stratégie (Strategy) en Go ?"
    choices:
      - {text: "Un type fonction ou une interface d'une méthode, passés en paramètre", correct: true}
      - {text: "Une classe abstraite, et une sous-classe par variante, comme en Java", correct: false}
      - {text: "Un `switch` sur une chaîne qui nomme la variante, dans la fonction", correct: false}
      - {text: "Une struct qui incorpore toutes les variantes, choisies par un champ", correct: false}
    answer: "Un type fonction (comme `func(Commande) int64`) ou une interface d'une méthode, passés en paramètre ou en champ. Go n'a pas de classes abstraites, et un `switch` sur un nom fige les variantes dans la fonction."
  - key: pattern-illustre-sort-interface
    format: course
    question: "Quel motif de conception illustre `sort.Interface` ?"
    choices:
      - {text: "Template method : l'algorithme est fixe, `Len`, `Less` et `Swap` en fournissent les étapes", correct: true}
      - {text: "Itérateur : `Len`, `Less` et `Swap` parcourent la collection, élément par élément", correct: false}
      - {text: "Observateur : le tri prévient la collection à chaque échange de deux éléments", correct: false}
      - {text: "Fabrique : `sort.Sort` crée une nouvelle collection triée, à partir de l'ancienne", correct: false}
    answer: "Template method (ou stratégie) : `sort.Sort` fixe l'algorithme, et la collection en fournit les étapes `Len`, `Less` et `Swap`. `sort.Sort` trie en place, sans créer de nouvelle collection."
  - key: pattern-illustrent-bufio-newreader-gzip
    format: course
    question: "Quel motif de conception illustrent `bufio.NewReader` et `gzip.NewReader` ?"
    choices:
      - {text: "Décorateur : chacun enveloppe un `io.Reader` et en renvoie un autre", correct: true}
      - {text: "Adaptateur : chacun convertit un fichier en `io.Reader`", correct: false}
      - {text: "Fabrique abstraite : chacun choisit une implémentation de lecture", correct: false}
      - {text: "Proxy : chacun contrôle l'accès au fichier par un verrou", correct: false}
    answer: "Décorateur : chacun enveloppe un `io.Reader` et ajoute un comportement (un tampon, la décompression) en exposant la même interface, d'où `bufio.NewReader(gzip.NewReader(f))`."
  - key: pattern-fonctions-etat
    format: course
    question: "Qu'est-ce que le motif des fonctions d'état ?"
    choices:
      - {text: "Chaque état est une fonction qui renvoie la fonction de l'état suivant", correct: true}
      - {text: "Chaque état est une constante `iota`, testée par un grand `switch`", correct: false}
      - {text: "Chaque état est une goroutine, qui passe la main par un channel", correct: false}
      - {text: "Chaque état est une struct, qui hérite d'une struct d'état de base", correct: false}
    answer: "Chaque état est une fonction (`type etat func(*lexer) etat`) qui fait son travail et renvoie la fonction de l'état suivant, ou `nil` à la fin. Rob Pike l'a présenté avec le lexer de `text/template`."
  - key: sticky-error-pattern
    format: course
    question: "Qu'est-ce que le motif de l'erreur collante (sticky error) ?"
    choices:
      - {text: "Mémoriser la première erreur, ignorer les opérations suivantes et la vérifier une fois à la fin", correct: true}
      - {text: "Réessayer une opération tant qu'elle échoue, jusqu'à ce que l'erreur finisse par disparaître", correct: false}
      - {text: "Paniquer à la première erreur, et la récupérer avec `recover` à la fin du traitement", correct: false}
      - {text: "Journaliser chaque erreur au moment où elle survient, puis continuer sans la renvoyer", correct: false}
    answer: "On mémorise la première erreur dans le type, les opérations suivantes ne font plus rien, et on vérifie l'erreur une seule fois à la fin : c'est ce que font `bufio.Writer` ou `bufio.Scanner` avec `Err()`."
  - key: ecris-decorateur-ajoute-retries-importe-client
    format: scenario
    question: "Tu ajoutes des réessais à tout client qui implémente une interface `Fetcher`, par un décorateur. Comment le construis-tu ?"
    choices:
      - {text: "Un type qui implémente `Fetcher`, contient le client réel et l'appelle en boucle, en respectant `ctx`", correct: true}
      - {text: "Un type qui incorpore le client réel et redéfinit `Fetch`, en appelant `super.Fetch` à chaque essai", correct: false}
      - {text: "Une modification de chaque client, qui ajoute sa propre boucle de réessais dans sa méthode `Fetch`", correct: false}
      - {text: "Une goroutine par appel, qui relance `Fetch` jusqu'au succès sans regarder le contexte", correct: false}
    answer: |-
      ```go
      type Fetcher interface {
          Fetch(ctx context.Context, id string) ([]byte, error)
      }

      type retryFetcher struct {
          next       Fetcher
          tentatives int
          attente    time.Duration
      }

      func WithRetry(next Fetcher, n int, attente time.Duration) Fetcher {
          return &retryFetcher{next: next, tentatives: n, attente: attente}
      }

      func (r *retryFetcher) Fetch(ctx context.Context, id string) ([]byte, error) {
          var err error
          for i := range r.tentatives {
              var b []byte
              if b, err = r.next.Fetch(ctx, id); err == nil {
                  return b, nil
              }
              select {
              case <-time.After(r.attente << i):   // backoff exponentiel
              case <-ctx.Done():
                  return nil, ctx.Err()
              }
          }
          return nil, fmt.Errorf("après %d tentatives: %w", r.tentatives, err)
      }
      ```
      Le décorateur implémente la même interface, donc il se compose avec d'autres (cache, métriques) sans que l'appelant le sache, et il respecte le contexte pendant l'attente. En production, j'ajouterais du jitter et je ne réessaierais que les erreurs temporaires, pas un 404.
  - key: vf-decorateur
    format: true-false
    question: Un middleware HTTP est un exemple du motif décorateur.
    truth: true
    answer: Il enveloppe un Handler et ajoute un comportement.
  - key: vf-strategie
    format: true-false
    question: En Go, une simple fonction passée en paramètre peut jouer le rôle d'une stratégie.
    truth: true
    answer: Les fonctions sont des valeurs de première classe.
  - key: vf-singleton
    format: true-false
    question: Un singleton global est la meilleure façon de partager une connexion à la base dans un service Go.
    truth: false
    answer: On l'injecte depuis main ; un singleton cache la dépendance.
  - key: vf-template
    format: true-false
    question: Le motif template method s'écrit en Go par héritage d'une classe abstraite.
    truth: false
    answer: Go n'a pas d'héritage ; on passe les étapes variables en fonctions ou en interface.
  - key: qcm-exemples
    format: multiple-choice
    question: "Laquelle de ces associations entre la bibliothèque standard et un motif est fausse ?"
    choices:
      - {text: "`fmt.Println` : singleton", correct: true}
      - {text: "`http.HandlerFunc` : adaptateur", correct: false}
      - {text: "`bufio.NewReader(gzip.NewReader(f))` : décorateur", correct: false}
      - {text: "`sort.Interface` : stratégie (ou template method)", correct: false}
    answer: "`fmt.Println` n'illustre aucun motif particulier. `http.HandlerFunc` est un adaptateur, `bufio.NewReader(gzip.NewReader(f))` un décorateur, `sort.Interface` une stratégie ou un template method."
  - key: qcm-builder
    format: multiple-choice
    question: "Lesquels de ces outils remplacent le plus souvent le builder en Go ?"
    choices:
      - {text: "Les options fonctionnelles", correct: true}
      - {text: "Une struct d'options", correct: true}
      - {text: "Un constructeur avec quinze paramètres", correct: false}
      - {text: "Des surcharges du constructeur, une par combinaison", correct: false}
    answer: "Les options fonctionnelles et la struct d'options évitent une classe de construction séparée. Go n'a pas de surcharge, et quinze paramètres positionnels sont illisibles."
  - key: qcm-observateur
    format: multiple-choice
    question: "Laquelle de ces façons d'implémenter un observateur en Go est à éviter ?"
    choices:
      - {text: "Des variables globales que chaque abonné relit en boucle", correct: true}
      - {text: "Une liste de fonctions de rappel appelées à chaque événement", correct: false}
      - {text: "Un channel par abonné, alimenté par l'émetteur", correct: false}
      - {text: "Une interface avec une méthode `Notifier` pour chaque abonné", correct: false}
    answer: "Relire une globale en boucle gaspille le processeur et crée des courses de données. Des fonctions de rappel, un channel par abonné (attention aux abonnés lents, qui bloquent l'émetteur) ou une interface `Notifier` conviennent."
  - key: qcm-singleton
    format: multiple-choice
    question: "Si un singleton est vraiment nécessaire, comment l'écrire de façon sûre entre goroutines ?"
    choices:
      - {text: "`var instance = sync.OnceValue(func() *Client { return nouveauClient() })`", correct: true}
      - {text: "Un test `if instance == nil` sans synchronisation", correct: false}
      - {text: "Une fonction `init` qui ouvre une connexion réseau", correct: false}
      - {text: "Un `sync.Mutex` autour de la seule écriture de `instance`", correct: false}
    answer: "`sync.OnceValue` initialise une seule fois, sûrement ; une variable de package initialisée directement convient aussi si l'initialisation ne peut pas échouer. Un test `nil` non synchronisé est une course, même avec un verrou autour de la seule écriture."
  - key: bug-heritage
    format: bug-fix
    question: |-
      Un collègue venu de Java simule une classe abstraite, mais `ExportCSV.Entete` n'est jamais appelée par `Exporter`. Quelle correction est la bonne ?
      ```go
      type ExportBase struct{}
      func (e ExportBase) Exporter() { e.Entete(); e.Lignes(); e.Pied() }
      func (e ExportBase) Entete() {}

      type ExportCSV struct{ ExportBase }
      func (e ExportCSV) Entete() { fmt.Println("nom;prix") } // jamais appelée par Exporter
      ```
    choices:
      - {text: "Une interface `Format` pour les étapes, et une fonction `Exporter` qui l'appelle", correct: true}
      - {text: "Déclarer `Entete` sur `*ExportBase` plutôt que sur `ExportBase`, pour la rendre virtuelle", correct: false}
      - {text: "Incorporer `*ExportBase` par pointeur, pour que l'appel suive la redéfinition", correct: false}
      - {text: "Redéfinir aussi `Exporter` dans `ExportCSV`, en recopiant son corps", correct: false}
    answer: |-
      ```go
      type Format interface {
      	Entete(w io.Writer)
      	Ligne(w io.Writer, p Produit)
      	Pied(w io.Writer)
      }

      func Exporter(w io.Writer, f Format, produits []Produit) {
      	f.Entete(w)
      	for _, p := range produits {
      		f.Ligne(w, p)
      	}
      	f.Pied(w)
      }
      ```
      L'incorporation n'est pas un héritage : `ExportBase` appelait ses propres méthodes, sans liaison dynamique, avec ou sans pointeur. Les étapes variables passent par une interface.
  - key: bug-singleton
    format: bug-fix
    question: |-
      Le détecteur de courses signale ce singleton. Quelle correction est la bonne ?
      ```go
      var instance *Client

      func Instance() *Client {
      	if instance == nil {
      		instance = nouveauClient()
      	}
      	return instance
      }
      ```
    choices:
      - {text: "`var Instance = sync.OnceValue(func() *Client { return nouveauClient() })`", correct: true}
      - {text: "Un `atomic.Pointer[Client]`, lu puis écrit, sans autre synchronisation", correct: false}
      - {text: "Un `time.Sleep` avant le test `nil`, pour laisser finir l'autre goroutine", correct: false}
      - {text: "Lancer les tests sans `-race`, puisque l'initialisation n'a lieu qu'une fois", correct: false}
    answer: |-
      ```go
      var Instance = sync.OnceValue(func() *Client {
      	return nouveauClient()
      })
      ```
      `OnceValue` initialise une seule fois, de façon sûre entre goroutines ; mieux encore, on injecte le client. Un pointeur atomique supprime la course mais peut créer deux clients, entre la lecture et l'écriture.
  - key: bug-strategie-interface
    format: bug-fix
    question: |-
      Que proposes-tu pour simplifier ce code ?
      ```go
      type CalculateurRemise interface{ Calculer(c Commande) int64 }
      type RemiseNoel struct{}
      func (RemiseNoel) Calculer(c Commande) int64 { return c.Total / 10 }
      type RemiseAucune struct{}
      func (RemiseAucune) Calculer(c Commande) int64 { return 0 }
      ```
    choices:
      - {text: "Un type fonction `Remise func(c Commande) int64`, et une fonction par variante", correct: true}
      - {text: "Une struct de base `RemiseBase`, incorporée par chaque variante de remise", correct: false}
      - {text: "Un `switch` sur un champ `type string`, dans une seule fonction `Calculer`", correct: false}
      - {text: "Une interface générique `Calculateur[T]`, commune à toutes les stratégies", correct: false}
    answer: |-
      ```go
      type Remise func(c Commande) int64

      func RemiseNoel(c Commande) int64   { return c.Total / 10 }
      func RemiseAucune(c Commande) int64 { return 0 }
      ```
      Pour une stratégie d'une seule méthode sans état, un type fonction suffit, sans struct vide par variante. Un `switch` sur une chaîne figerait les variantes dans une seule fonction.
  - key: bug-observateur
    format: bug-fix
    question: |-
      Un abonné lent bloque la publication de tous les événements. Quelle correction est la bonne ?
      ```go
      for _, ch := range abonnes {
      	ch <- evenement
      }
      ```
    choices:
      - {text: "Des channels bufferisés et un envoi non bloquant (`select` avec `default`), la perte mesurée", correct: true}
      - {text: "Envoyer à chaque abonné dans une nouvelle goroutine, sans limite ni attente", correct: false}
      - {text: "Fermer le channel de chaque abonné après chaque envoi, puis le recréer aussitôt", correct: false}
      - {text: "Remplacer les channels par une slice d'événements partagée, lue sans verrou", correct: false}
    answer: |-
      ```go
      for _, ch := range abonnes {
      	select {
      	case ch <- evenement:
      	default:
      		evenementsPerdus.Add(1) // abonné trop lent : on ne bloque pas les autres
      	}
      }
      ```
      Avec des channels bufferisés et un envoi non bloquant, un abonné lent ne retient plus l'émetteur ; la perte est mesurée, ou l'abonné est déconnecté. Une goroutine par envoi empilerait des goroutines bloquées et perdrait l'ordre.
  - key: scenario-retry
    format: scenario
    question: Comment ajouterais-tu des réessais à un client sans modifier son code ?
    choices:
      - {text: "Un décorateur : un type qui implémente la même interface, enveloppe le client et réessaie", correct: true}
      - {text: "Copier le code du client dans mon dépôt, et y ajouter la boucle de réessais", correct: false}
      - {text: "Incorporer le client dans une struct, et redéfinir `Envoyer` en appelant `super`", correct: false}
      - {text: "Réessayer dans chaque appelant, autour de chacun de ses appels au client", correct: false}
    answer: "Avec un décorateur : un type qui implémente la même interface que le client (`Envoyer(ctx, m) error`), contient le client réel et l'appelle dans une boucle de réessais, avec un délai croissant et le respect du contexte. `main` construit `nouveauAvecReessais(clientReel, 3)` et le passe au service ; pour HTTP, on peut aussi décorer le `http.RoundTripper`."
  - key: scenario-gof
    format: scenario
    question: "En entretien, on te demande si les motifs du Gang of Four s'appliquent en Go. Que réponds-tu ?"
    choices:
      - {text: "Leurs idées oui, leurs formes rarement : fonctions, interfaces implicites et composition les simplifient", correct: true}
      - {text: "Oui, tels quels : on reproduit leurs diagrammes de classes avec des structs et l'incorporation", correct: false}
      - {text: "Non : Go n'étant pas un langage à objets, aucun de ces motifs n'y a le moindre sens", correct: false}
      - {text: "Seulement le Singleton, que la bibliothèque standard utilise dans presque tous ses packages", correct: false}
    answer: "Leurs idées oui, leurs formes rarement : en Go, une fonction remplace une stratégie ou une commande, les interfaces implicites rendent l'adaptateur trivial, la composition remplace l'héritage, les options fonctionnelles le builder. Je cite des exemples de la bibliothèque standard (`HandlerFunc`, `io.Reader` décorés, `sort.Interface`) plutôt que des diagrammes de classes."
  - key: scenario-plugin
    format: scenario
    question: Comment rendrais-tu extensible un système d'export (CSV, JSON, PDF) ?
    choices:
      - {text: "Une interface `Exporteur`, un type par format, et un registre `map[string]Exporteur` rempli dans `main`", correct: true}
      - {text: "Le package `plugin` de Go, pour charger chaque format comme une bibliothèque `.so` à l'exécution", correct: false}
      - {text: "Un `switch` sur le nom du format dans une seule fonction, à compléter à chaque nouveau format", correct: false}
      - {text: "Une struct `ExporteurBase` incorporée par chaque format, qui en redéfinit les méthodes", correct: false}
    answer: "Une interface `Exporteur` avec `Exporter(w io.Writer, donnees []Ligne) error`, une implémentation par format, et un registre `map[string]Exporteur` rempli dans `main`, choisi par le nom du format demandé : ajouter un format, c'est ajouter un type et une ligne. Le package `plugin` de Go est rarement une bonne idée."
