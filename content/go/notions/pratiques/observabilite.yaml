notion: observabilite
lesson: "Un service en production doit dire **comment il va**. Trois signaux complémentaires :\n- les **journaux** : ce qui s'est passé, événement par événement (slog) ;\n- les **métriques** : des nombres agrégés dans le temps (débit, erreurs, latence, mémoire) ;\n- les **traces** : le chemin d'une requête à travers les services, avec la durée de chaque étape.\n\n**Les métriques avec Prometheus** (`github.com/prometheus/client_golang`) :\n\n```go\nvar requetes = promauto.NewCounterVec(prometheus.CounterOpts{\n\tName: \"http_requetes_total\",\n\tHelp: \"Requêtes HTTP traitées.\",\n}, []string{\"route\", \"code\"})\n\nvar duree = promauto.NewHistogramVec(prometheus.HistogramOpts{\n\tName:    \"http_duree_secondes\",\n\tBuckets: prometheus.DefBuckets,\n}, []string{\"route\"})\n\nmux.Handle(\"GET /metrics\", promhttp.Handler())\n```\n\n- **Counter** : ne fait qu'augmenter (requêtes, erreurs) ; **Gauge** : monte et descend (connexions ouvertes) ;\n  **Histogram** : une distribution (latences), d'où l'on calcule des percentiles agrégeables entre instances ;\n- les **étiquettes** doivent avoir une **faible cardinalité** : la route (`/commandes/{id}`), jamais l'identifiant\n  ou l'utilisateur, qui créeraient des millions de séries ;\n- le client expose aussi les métriques du **runtime** Go (goroutines, GC, mémoire).\n\n**Les traces avec OpenTelemetry** : `otelhttp.NewHandler(mux, \"api\")` côté serveur, un transport `otelhttp` côté\nclient, et le **contexte** propagé partout ; chaque appel crée un **span**, relié aux autres par l'en-tête `traceparent`\n(W3C). Les spans s'exportent vers un collecteur (Jaeger, Tempo, un fournisseur).\n\nLes méthodes de choix des métriques : **RED** pour les services (Rate, Errors, Duration), **USE** pour les ressources\n(Utilization, Saturation, Errors).\n\n**En entretien** : « Journaux, métriques, traces ; Prometheus : Counter, Gauge, Histogram, étiquettes à faible\ncardinalité ; OpenTelemetry pour les traces, propagées par le contexte et traceparent ; RED pour les services. »"
cards:
  - key: types-metriques-prometheus
    format: course
    question: "Quels sont les types de métriques de Prometheus ?"
    choices:
      - {text: "Counter, Gauge, Histogram et Summary", correct: true}
      - {text: "Counter, Timer, Meter et Histogram", correct: false}
      - {text: "Gauge, Trace, Log et Span", correct: false}
      - {text: "Int, Float, Duration et Percentile", correct: false}
    answer: "Counter (qui ne fait que croître), Gauge (qui monte et descend), Histogram (des seaux) et Summary (des quantiles calculés par l'instance). Timer et Meter viennent de Dropwizard ou de Micrometer."
  - key: histogram-vs-summary
    format: course
    question: "Quelle différence y a-t-il entre un Histogram et un Summary dans Prometheus ?"
    choices:
      - {text: "L'Histogram a des seaux agrégeables entre instances ; le Summary, des quantiles qui ne s'agrègent pas", correct: true}
      - {text: "Le Summary a des seaux agrégeables entre instances ; l'Histogram, des quantiles qui ne s'agrègent pas", correct: false}
      - {text: "L'Histogram compte les requêtes reçues, le Summary mesure leur durée totale cumulée", correct: false}
      - {text: "Aucune : Summary est l'ancien nom d'Histogram, gardé pour la compatibilité", correct: false}
    answer: "Un Histogram expose des seaux, agrégeables entre instances : les percentiles se calculent côté serveur (`histogram_quantile`). Un Summary calcule ses quantiles dans l'instance, et des quantiles ne se moyennent pas entre instances."
  - key: eviter-label-user-id
    format: course
    question: "Pourquoi éviter une étiquette `user_id` sur une métrique Prometheus ?"
    choices:
      - {text: "Elle crée une série temporelle par utilisateur : la cardinalité explose", correct: true}
      - {text: "Prometheus refuse les étiquettes dont le nom se termine par `_id`", correct: false}
      - {text: "Prometheus chiffre les identifiants, qui deviennent illisibles", correct: false}
      - {text: "Une étiquette ne peut contenir qu'un nombre de moins de dix chiffres", correct: false}
    answer: "Chaque valeur d'étiquette crée une série : une par utilisateur, et le serveur sature. Les identifiants vont dans les traces ou les journaux."
  - key: metriques-runtime-expose
    format: course
    question: "Quelles métriques le runtime Go expose-t-il ?"
    choices:
      - {text: "Goroutines, durées du GC, mémoire, threads et descripteurs ouverts", correct: true}
      - {text: "Le nombre de requêtes HTTP par route, et leur durée", correct: false}
      - {text: "Le taux d'erreurs métier, par type d'erreur renvoyée", correct: false}
      - {text: "Aucune : il faut tout instrumenter soi-même, à la main", correct: false}
    answer: "Le nombre de goroutines, les durées du GC, les statistiques mémoire, les threads et les descripteurs (par les collecteurs Go et process du client Prometheus, ou `runtime/metrics`). Les requêtes par route et les erreurs métier s'instrumentent soi-même."
  - key: propage-trace-services
    format: course
    question: "Comment une trace se propage-t-elle d'un service à l'autre ?"
    choices:
      - {text: "Par l'en-tête W3C `traceparent`, porté par le contexte et injecté par les clients instrumentés", correct: true}
      - {text: "Par une variable globale partagée entre les services, mise à jour à chaque appel", correct: false}
      - {text: "Par la base de données, où chaque service écrit l'identifiant de la trace en cours", correct: false}
      - {text: "Par l'adresse IP de l'appelant, que le collecteur relie aux spans du service appelé", correct: false}
    answer: "Le contexte porte le span courant ; le client instrumenté (par `otelhttp.NewTransport`) injecte l'en-tête W3C `traceparent`, que le serveur appelé extrait pour rattacher ses spans à la même trace."
  - key: instrumenter-serveur-http-avec-opentelemetry
    format: course
    question: "Comment instrumenter un serveur HTTP Go avec OpenTelemetry ?"
    choices:
      - {text: "Envelopper le handler avec `otelhttp.NewHandler`, et le client avec `otelhttp.NewTransport`", correct: true}
      - {text: "Ajouter des annotations `@WithSpan` sur chaque handler, lues au démarrage du service", correct: false}
      - {text: "Compiler avec une option `-otel`, qui instrumente seule chaque fonction du binaire", correct: false}
      - {text: "Lancer l'agent Java d'OpenTelemetry à côté du binaire, qui l'instrumente de l'extérieur", correct: false}
    answer: "On enveloppe le handler avec `otelhttp.NewHandler` (et le client avec `otelhttp.NewTransport`) : chaque requête devient un span, propagé par le contexte. Go n'a ni annotations ni option de compilation pour cela, et l'agent Java ne vaut que pour la JVM."
  - key: red-vs-use
    format: course
    question: "Quelle différence y a-t-il entre les méthodes RED et USE ?"
    choices:
      - {text: "RED (débit, erreurs, durée) pour les services ; USE (utilisation, saturation, erreurs) pour les ressources", correct: true}
      - {text: "USE (utilisation, saturation, erreurs) pour les services ; RED (débit, erreurs, durée) pour les ressources", correct: false}
      - {text: "RED pour les journaux d'erreurs du service ; USE pour les traces de ses utilisateurs", correct: false}
      - {text: "RED pour les métriques métier du service ; USE pour les statistiques de ses utilisateurs", correct: false}
    answer: "RED (Rate, Errors, Duration) décrit un service vu de ses clients ; USE (Utilization, Saturation, Errors) décrit une ressource : processeur, disque, pool de connexions."
  - key: instrumentes-nouveau-service-avant-mise
    format: scenario
    question: Comment instrumentes-tu un nouveau service Go avant sa mise en production ?
    choices:
      - {text: "Journaux slog JSON avec `trace_id`, métriques RED par route, traces OpenTelemetry, `/healthz` et pprof", correct: true}
      - {text: "Des `fmt.Println` dans chaque handler, que la plateforme collecte sur la sortie standard", correct: false}
      - {text: "Une métrique par utilisateur et par URL complète, pour pouvoir tout retrouver ensuite", correct: false}
      - {text: "Des alertes sur le processeur et la mémoire seulement ; le reste viendra après les incidents", correct: false}
    answer: "Journaux slog en JSON, avec `request_id` et `trace_id` par un middleware ; histogramme de latence et compteur de requêtes par route, méthode et statut (étiquettes à faible cardinalité), métriques du pool SQL et du runtime sur `/metrics` ; traces OpenTelemetry (`otelhttp`, base, Kafka) exportées en OTLP. Puis `/healthz` et `/readyz`, pprof sur un port interne, et des alertes sur les SLO plutôt que sur le processeur."
  - key: vf-cardinalite
    format: true-false
    question: Ajouter l'identifiant de l'utilisateur comme étiquette d'une métrique Prometheus est une bonne pratique.
    truth: false
    answer: 'Chaque valeur crée une série : la cardinalité explose ; l''utilisateur va dans les journaux ou les traces.'
  - key: vf-counter
    format: true-false
    question: Un Counter Prometheus peut diminuer.
    truth: false
    answer: Il ne fait qu'augmenter (sauf remise à zéro au redémarrage) ; pour monter et descendre, une Gauge.
  - key: vf-contexte
    format: true-false
    question: Pour qu'une trace suive une requête, le contexte doit être propagé à tous les appels.
    truth: true
    answer: Le span courant voyage dans le contexte.
  - key: vf-runtime
    format: true-false
    question: Le client Prometheus pour Go peut exposer les métriques du runtime (goroutines, GC, mémoire).
    truth: true
    answer: Le collecteur Go est enregistré par défaut.
  - key: qcm-types
    format: multiple-choice
    question: "Laquelle de ces associations entre un besoin et un type de métrique est fausse ?"
    choices:
      - {text: "La latence de chaque requête individuelle : Gauge", correct: true}
      - {text: "Le nombre de requêtes traitées : Counter", correct: false}
      - {text: "Les connexions actuellement ouvertes : Gauge", correct: false}
      - {text: "La distribution des latences : Histogram", correct: false}
    answer: "Une requête individuelle se suit dans une trace ; une Gauge n'en garderait que la dernière valeur. Counter pour le nombre de requêtes, Gauge pour les connexions ouvertes, Histogram pour la distribution des latences."
  - key: qcm-red
    format: multiple-choice
    question: "Laquelle de ces mesures relève de la méthode USE, et non de RED ?"
    choices:
      - {text: "La saturation du pool de connexions", correct: true}
      - {text: "Le débit de requêtes (Rate)", correct: false}
      - {text: "Les erreurs renvoyées aux clients (Errors)", correct: false}
      - {text: "La durée des requêtes (Duration)", correct: false}
    answer: "RED mesure un service : débit, erreurs, durée. La saturation relève de USE, qui s'applique aux ressources (processeur, disque, pool)."
  - key: qcm-traces
    format: multiple-choice
    question: "Laquelle de ces pratiques casse les traces OpenTelemetry d'un service HTTP ?"
    choices:
      - {text: "Créer un nouveau `context.Background()` dans chaque fonction", correct: true}
      - {text: "Envelopper le routeur avec `otelhttp.NewHandler`", correct: false}
      - {text: "Utiliser un transport `otelhttp` pour les appels sortants", correct: false}
      - {text: "Passer `r.Context()` à tous les appels", correct: false}
    answer: "Un nouveau `context.Background()` perd le span courant : la trace se coupe. Envelopper le routeur, instrumenter le transport sortant et passer `r.Context()` partout la gardent entière."
  - key: qcm-signaux
    format: multiple-choice
    question: "Laquelle de ces associations entre une question et un signal est mal choisie ?"
    choices:
      - {text: "Quelle est la latence p99 de la semaine ? Les journaux bruts", correct: true}
      - {text: "Le taux d'erreurs a-t-il augmenté ? Les métriques", correct: false}
      - {text: "Pourquoi cette requête précise a-t-elle mis 3 s ? Les traces", correct: false}
      - {text: "Quel message d'erreur exact a renvoyé la base ? Les journaux", correct: false}
    answer: "Les percentiles se calculent sur des histogrammes, pas en relisant des journaux bruts. Les métriques répondent aux tendances, les traces à une requête précise, les journaux au détail d'un événement."
  - key: scenario-nouveau
    format: scenario
    question: "Ton nouveau service part en production. Quelles métriques exposes-tu, et sur quoi poses-tu les alertes ?"
    choices:
      - {text: "Les métriques RED par route et celles du runtime ; des alertes sur les erreurs et la latence p99", correct: true}
      - {text: "Les métriques du runtime seulement ; une alerte sur chaque cause possible, comme le CPU à 80 %", correct: false}
      - {text: "Une métrique par requête, avec son identifiant ; une alerte à chaque requête en erreur", correct: false}
      - {text: "Aucune métrique au départ ; des alertes ajoutées une à une après chaque incident", correct: false}
    answer: "Les métriques RED par route (Counter par code, Histogram de durée) et celles du runtime sur `/metrics`, avec celles du pool SQL et des files ; des traces OpenTelemetry et des journaux slog liés par l'identifiant de trace. Les alertes portent sur les symptômes (taux d'erreurs, latence p99), pas sur chaque cause."
  - key: scenario-cardinalite
    format: scenario
    question: Le serveur Prometheus sature depuis l'ajout d'une métrique. Que vérifies-tu ?
    choices:
      - {text: "Les étiquettes de la nouvelle métrique : un identifiant ou une URL brute crée une série par valeur", correct: true}
      - {text: "La version de Prometheus : les anciennes ne savent pas gérer plus de cent métriques", correct: false}
      - {text: "L'intervalle de collecte : l'allonger suffit à soulager le serveur, sans rien changer d'autre", correct: false}
      - {text: "Le type de la métrique : un Counter coûte bien plus cher qu'une Gauge au serveur", correct: false}
    answer: "Les étiquettes de la nouvelle métrique : une étiquette à forte cardinalité (identifiant, URL brute avec ses paramètres, adresse IP) crée une série par valeur. Je remplace l'URL par le motif de route, je retire les identifiants (ils vont dans les traces ou les journaux) et je compte les séries par métrique ; les histogrammes multiplient aussi les séries par leurs seaux."
  - key: scenario-lenteur
    format: scenario
    question: Les utilisateurs se plaignent de lenteurs ponctuelles. Comment l'observabilité t'aide-t-elle à trouver la cause ?
    choices:
      - {text: "Les métriques situent quand et où la p99 monte, les traces l'étape lente, les journaux l'erreur", correct: true}
      - {text: "Les journaux d'abord, lus ligne à ligne sur la journée, jusqu'à trouver la requête lente", correct: false}
      - {text: "La latence moyenne du service, qui suffit à repérer les lenteurs ponctuelles", correct: false}
      - {text: "Un profil CPU d'abord, puisque les lenteurs viennent toujours du code Go lui-même", correct: false}
    answer: "Les métriques montrent quand et sur quelles routes la latence p99 monte, et si elle coïncide avec une hausse du débit, du GC ou de l'attente du pool SQL. Les traces des requêtes lentes de cette période montrent l'étape qui dure, leurs journaux les erreurs ; si rien n'apparaît, un profil ou une trace d'exécution Go prend le relais. Une moyenne noie les lenteurs ponctuelles."
