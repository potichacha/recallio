notion: architecture-hexagonale
cards:
  - key: applique-architecture-hexagonale
    format: course
    question: Comment s'applique l'architecture hexagonale en Go ?
    answer: Le package métier définit les interfaces de ses dépendances ; les adaptateurs les implémentent ; main assemble.
  - key: frameworks-comme-spring
    format: course
    question: Go a-t-il des frameworks comme Spring ?
    answer: Peu ; on assemble des bibliothèques, avec quelques kits (go-kit, Kratos, Encore).
  - key: presente-architecture-choisirais-service
    format: scenario
    question: Présente l'architecture que tu choisirais pour un service de commandes en Go.
    answer: |-
      Un module avec `cmd/orders/main.go` et des packages `internal/` par responsabilité. Le cœur est `internal/order` : les types `Order`, `Line`, les règles (calcul du total, transitions de statut), un `Service` qui orchestre les cas d'usage, et les interfaces dont il a besoin (`Repository`, `Payments`, `EventPublisher`). Les adaptateurs vivent à côté : `internal/postgres` (avec sqlc pour les requêtes), `internal/httpapi` (handlers, DTO, validation, middlewares), `internal/kafka` (publication via un outbox).
      `main` lit la configuration depuis l'environnement, construit les adaptateurs, les injecte dans le service, démarre le serveur HTTP et le relais d'outbox, et gère l'arrêt propre sur SIGTERM.
      Les tests du package `order` utilisent des faux écrits à la main, ceux de `postgres` une vraie base dans testcontainers. Si le service reste petit, je fusionnerais certains packages : la structure doit suivre la complexité, pas la précéder.
