notion: architecture-hexagonale
lesson: "L'**architecture hexagonale** (ports et adaptateurs) place le **domaine** au centre, indépendant de la technique ; les\n**adaptateurs** (HTTP, base, messagerie) sont à la périphérie et dépendent du domaine, jamais l'inverse.\n\nEn Go, elle s'exprime naturellement :\n\n```\ninternal/\n├── commande/                  # le domaine et ses cas d'usage\n│   ├── commande.go            # le modèle : Commande, règles métier, erreurs\n│   ├── service.go             # les cas d'usage : Passer, Annuler\n│   └── ports.go               # les interfaces dont le service a besoin (Depot, Paiements)\n├── postgres/                  # adaptateur : implémente commande.Depot avec SQL\n├── stripe/                    # adaptateur : implémente commande.Paiements\n└── httpapi/                   # adaptateur entrant : handlers qui appellent commande.Service\n```\n\n```go\n// dans commande/ports.go : un port de sortie, défini par le domaine\ntype Depot interface {\n\tTrouver(ctx context.Context, id string) (Commande, error)\n\tSauver(ctx context.Context, c Commande) error\n}\n```\n\nCe qui rend Go adapté :\n- les **interfaces implicites** : l'adaptateur postgres satisfait `commande.Depot` sans l'importer pour le déclarer ;\n- les interfaces se définissent **chez l'utilisateur** (le domaine), petites ;\n- **pas de cycle d'import** possible : le compilateur fait respecter le sens des dépendances ;\n- **internal/** empêche d'utiliser les adaptateurs depuis l'extérieur.\n\nLes mises en garde :\n- ne pas multiplier les couches et les interfaces **sans besoin** : pour un CRUD simple, un handler qui appelle un\n  dépôt suffit ;\n- pas de « DTO » ni de mapping à chaque frontière si les types sont identiques ; on sépare quand les modèles divergent\n  vraiment (API publique, schéma de base) ;\n- les **transactions** traversent souvent plusieurs ports : il faut un mécanisme (unité de travail, fonction\n  `dansTransaction`) prévu dès le départ.\n\n**En entretien** : « Domaine au centre avec ses ports (interfaces) ; adaptateurs à la périphérie qui les implémentent ;\ninterfaces implicites et absence de cycles qui font respecter le sens ; sans sur-ingénierie pour un CRUD. »"
cards:
  - key: applique-architecture-hexagonale
    format: course
    question: Comment s'applique l'architecture hexagonale en Go ?
    choices:
      - {text: "Le package métier déclare les interfaces de ses dépendances, les adaptateurs les implémentent, `main` assemble", correct: true}
      - {text: "Les adaptateurs déclarent leurs interfaces, et le package métier les importe pour s'en servir directement", correct: false}
      - {text: "Un framework d'injection lit des annotations et câble les couches au démarrage, comme le fait Spring", correct: false}
      - {text: "Chaque couche vit dans son propre module Go, publié et versionné séparément des autres couches", correct: false}
    answer: "Le package métier définit les interfaces dont il a besoin ; les adaptateurs (PostgreSQL, HTTP) les implémentent implicitement et dépendent du domaine ; `main` assemble le tout. Si le domaine importait les adaptateurs, la dépendance irait dans le mauvais sens."
  - key: frameworks-comme-spring
    format: course
    question: Go a-t-il des frameworks comme Spring ?
    choices:
      - {text: "Peu : on assemble des bibliothèques, avec quelques kits comme go-kit, Kratos ou Encore", correct: true}
      - {text: "Oui : Gin est l'équivalent de Spring, injection de dépendances et ORM compris", correct: false}
      - {text: "Oui : la bibliothèque standard fournit un conteneur d'injection, `net/di`", correct: false}
      - {text: "Non, et il est impossible d'en écrire un, faute de réflexion dans le langage", correct: false}
    answer: "Peu : la culture Go préfère assembler des bibliothèques (`net/http`, un routeur, `database/sql`) et câbler à la main dans `main`. Gin n'est qu'un routeur HTTP ; et Go a bien la réflexion, mais l'usage la réserve aux cas qui l'exigent."
  - key: presente-architecture-choisirais-service
    format: scenario
    question: "Quelle architecture choisis-tu pour un service de commandes en Go ?"
    choices:
      - {text: "`cmd/orders/main.go`, un cœur `internal/order` qui déclare ses interfaces, et des adaptateurs à côté", correct: true}
      - {text: "Des packages `controllers`, `services`, `repositories` et `models`, comme dans une application Spring", correct: false}
      - {text: "Un seul package `main` de quelques milliers de lignes, plus simple à lire qu'une arborescence", correct: false}
      - {text: "Un microservice par entité (commande, ligne, paiement), chacun avec son propre dépôt Git", correct: false}
    answer: "Un module avec `cmd/orders/main.go` et des packages `internal/` par responsabilité : le cœur `internal/order` (types, règles, `Service`, et les interfaces `Repository`, `Payments`, `EventPublisher`), puis les adaptateurs `internal/postgres`, `internal/httpapi`, `internal/kafka`. `main` lit la configuration, assemble et gère l'arrêt propre. Des packages par couche technique dispersent chaque fonctionnalité ; et la structure suit la complexité, elle ne la précède pas."
  - key: ports
    format: course
    question: Où déclarer les ports (interfaces) dans une architecture hexagonale en Go ?
    choices:
      - {text: "Dans le package du domaine qui en a besoin, comme `commande.Depot`", correct: true}
      - {text: "Dans le package de l'adaptateur qui les implémente, comme `postgres.Depot`", correct: false}
      - {text: "Dans un package `interfaces` commun, importé par toutes les couches", correct: false}
      - {text: "Nulle part : l'adaptateur concret est passé tel quel au domaine", correct: false}
    answer: "Dans le package du domaine qui les utilise (`commande.Depot`, `commande.Paiements`) : les adaptateurs les implémentent implicitement et dépendent du domaine, jamais l'inverse. Un package `interfaces` commun recrée un couplage central sans rien apporter."
  - key: surconception
    format: course
    question: Quand l'architecture hexagonale est-elle de la sur-ingénierie ?
    choices:
      - {text: "Pour un service CRUD sans règles métier, où chaque couche recopierait des champs", correct: true}
      - {text: "Dès qu'un service a deux entrées, comme une API HTTP et un consommateur Kafka", correct: false}
      - {text: "Pour un domaine riche en règles, qu'on veut tester sans base ni réseau", correct: false}
      - {text: "Toujours en Go : les interfaces implicites y rendent les ports inutiles", correct: false}
    answer: "Pour un CRUD sans règles, un handler qui appelle un dépôt est plus simple que quatre couches qui recopient les mêmes champs. Elle paie au contraire quand le domaine a de vraies règles, plusieurs entrées ou des dépendances à remplacer."
  - key: vf-dependances
    format: true-false
    question: Dans une architecture hexagonale, le domaine importe les packages des adaptateurs.
    truth: false
    answer: Ce sont les adaptateurs qui dépendent du domaine.
  - key: vf-implicites
    format: true-false
    question: Les interfaces implicites de Go facilitent l'architecture hexagonale.
    truth: true
    answer: Un adaptateur satisfait un port sans le déclarer.
  - key: vf-cycles
    format: true-false
    question: L'interdiction des cycles d'import aide à faire respecter le sens des dépendances.
    truth: true
    answer: Un adaptateur importé par le domaine créerait vite un cycle.
  - key: vf-dto
    format: true-false
    question: Il faut toujours un type distinct et un mapping à chaque frontière entre couches.
    truth: false
    answer: On sépare les modèles quand ils divergent vraiment, pas par principe.
  - key: qcm-roles
    format: multiple-choice
    question: "Dans une architecture hexagonale, qu'est-ce qu'un port ?"
    choices:
      - {text: "Une interface déclarée par le domaine, pour une dépendance dont il a besoin", correct: true}
      - {text: "L'implémentation technique d'une dépendance, comme le dépôt PostgreSQL", correct: false}
      - {text: "Le numéro de port réseau sur lequel le service écoute ses requêtes", correct: false}
      - {text: "Le package `main`, qui relie les adaptateurs au domaine au démarrage", correct: false}
    answer: "Un port est une interface déclarée par le domaine ; un adaptateur l'implémente techniquement (SQL, HTTP), et `main` les assemble. Le vocabulaire vient d'Alistair Cockburn."
  - key: qcm-entrants
    format: multiple-choice
    question: "Lequel de ces éléments n'est pas un adaptateur entrant (qui appelle le domaine) ?"
    choices:
      - {text: "Le dépôt PostgreSQL", correct: true}
      - {text: "Les handlers HTTP", correct: false}
      - {text: "Un consommateur de messages Kafka", correct: false}
      - {text: "Une commande en ligne de commande", correct: false}
    answer: "Le dépôt est un adaptateur sortant : c'est le domaine qui l'appelle, par un port. Les handlers HTTP, un consommateur Kafka ou une commande en ligne de commande appellent le domaine : ils sont entrants."
  - key: qcm-transactions
    format: multiple-choice
    question: "Lesquelles de ces solutions gèrent correctement une transaction qui couvre deux ports (commandes et stock) ?"
    choices:
      - {text: "Une unité de travail, ou une fonction `dansTransaction` fournie par l'adaptateur de persistance", correct: true}
      - {text: "Des dépôts construits sur la même transaction (une interface `Executeur`)", correct: true}
      - {text: "Une transaction ouverte dans chaque dépôt séparément", correct: false}
      - {text: "Un `sync.Mutex` global, verrouillé autour des deux appels de dépôt", correct: false}
    answer: "Une unité de travail, ou des dépôts construits sur la même transaction, rendent les deux écritures atomiques. Deux transactions séparées ne le garantissent pas, et un mutex protège de la concurrence, pas d'un échec entre les deux écritures."
  - key: qcm-avantages
    format: multiple-choice
    question: "Laquelle de ces promesses l'architecture hexagonale ne tient-elle pas ?"
    choices:
      - {text: "Moins de code, dans tous les cas", correct: true}
      - {text: "Un domaine testable sans base ni réseau", correct: false}
      - {text: "Des adaptateurs remplaçables (une autre base, une autre API)", correct: false}
      - {text: "Plusieurs entrées vers les mêmes cas d'usage", correct: false}
    answer: "Elle ajoute du code (ports, adaptateurs, assemblage) ; ce coût doit se justifier par un domaine testable sans base ni réseau, des adaptateurs remplaçables et plusieurs entrées vers les mêmes cas d'usage."
  - key: scenario-service
    format: scenario
    question: "Un service de commandes a des règles métier, une API HTTP et publie des événements Kafka. Comment le découpes-tu ?"
    choices:
      - {text: "Un package `commande` (modèle, règles, cas d'usage, ports) et des adaptateurs `postgres`, `kafka`, `httpapi`", correct: true}
      - {text: "Un package par couche technique (`handlers`, `services`, `repositories`), partagé par tous les domaines", correct: false}
      - {text: "Le SQL et la publication Kafka dans les handlers HTTP, pour garder chaque cas d'usage au même endroit", correct: false}
      - {text: "Un package `commande` qui importe directement `postgres` et `kafka`, sans interface entre eux", correct: false}
    answer: "Un package `commande` avec le modèle, les règles, les erreurs et les cas d'usage, qui déclare ses ports (`Depot`, `Paiements`, `Evenements`) ; des adaptateurs `postgres` (dépôt et outbox), `stripe`, `kafka`, et en entrée `httpapi` et un consommateur Kafka ; `main` assemble. Le domaine se teste avec des faux, les adaptateurs en intégration."
  - key: scenario-crud
    format: scenario
    question: "Un collègue veut une architecture hexagonale complète pour un petit service de gestion de paramètres. Que lui réponds-tu ?"
    choices:
      - {text: "Des handlers qui appellent un dépôt suffisent ; on extraira un service si des règles apparaissent", correct: true}
      - {text: "D'accord : toutes les couches dès le départ, pour ne jamais avoir à restructurer le service", correct: false}
      - {text: "Pas d'architecture du tout : un seul fichier `main.go`, avec le SQL écrit dans les handlers", correct: false}
      - {text: "D'accord, avec un framework d'injection de dépendances pour câbler toutes les couches", correct: false}
    answer: "Pour un CRUD sans règles, quatre couches qui recopient les mêmes champs ajoutent du code sans valeur. Des handlers qui appellent un dépôt, dans un package par domaine, avec une interface seulement si un test en a besoin : la structure grandit avec le besoin."
  - key: scenario-migration
    format: scenario
    question: Comment fais-tu évoluer un service où la logique métier est mélangée aux handlers HTTP et au SQL ?
    choices:
      - {text: "Cas d'usage par cas d'usage : extraire la logique, la tester avec des faux, alléger le handler", correct: true}
      - {text: "Tout réécrire d'un coup dans la nouvelle architecture, sur une branche à part, puis basculer", correct: false}
      - {text: "Ajouter des interfaces sur tous les types existants, avant de toucher à la logique elle-même", correct: false}
      - {text: "Ne rien changer tant qu'il marche : déplacer du code sans nouvelle fonction n'apporte rien", correct: false}
    answer: "Progressivement, cas d'usage par cas d'usage : j'extrais la logique dans le domaine, qui reçoit ses dépendances par de petites interfaces, je la teste avec des faux, puis le handler ne fait plus que décoder, appeler et répondre ; le SQL rejoint un dépôt. Chaque étape est une petite pull request sans changement de comportement, vérifiée par les tests existants."
