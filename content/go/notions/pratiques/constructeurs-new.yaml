notion: constructeurs-new
lesson: "Go n'a pas de constructeurs : on écrit des fonctions **`New`** quand c'est utile, et l'on cherche d'abord à rendre la\n**valeur zéro utilisable**.\n\n**La valeur zéro utile** : `var mu sync.Mutex`, `var b bytes.Buffer`, `var sb strings.Builder` fonctionnent sans\ninitialisation. On conçoit ses types pareil quand c'est possible :\n\n```go\ntype Compteur struct {\n\tmu sync.Mutex\n\tn  map[string]int\n}\n\nfunc (c *Compteur) Ajouter(cle string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tif c.n == nil {\n\t\tc.n = make(map[string]int) // initialisation paresseuse\n\t}\n\tc.n[cle]++\n}\n```\n\n**Une fonction New** quand le type a des **invariants**, des **dépendances obligatoires** ou des **valeurs par\ndéfaut** :\n\n```go\nfunc NewClient(base string, http *http.Client) (*Client, error) {\n\tu, err := url.Parse(base)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"URL de base invalide : %w\", err)\n\t}\n\treturn &Client{base: u, http: http, delai: 5 * time.Second}, nil\n}\n```\n\nLes conventions :\n- `NewX` dans un package qui en contient plusieurs, ou simplement **`New`** quand le type porte le nom du package\n  (`list.New()`, `errors.New`) ;\n- renvoyer un **pointeur** pour un type avec un état, un mutex ou une identité ; une valeur pour un petit type immuable ;\n- renvoyer une **erreur** si la construction peut échouer, plutôt que paniquer ; `MustX` pour les cas où l'échec est\n  une erreur de programmation (`regexp.MustCompile`) ;\n- les **dépendances** obligatoires en paramètres, les **options** facultatives par une struct ou des options\n  fonctionnelles ;\n- pas de travail lourd ni de goroutine cachée dans un constructeur sans le dire.\n\n**En entretien** : « Valeur zéro utilisable d'abord ; New quand il y a des invariants, des dépendances ou des\ndéfauts ; renvoyer une erreur plutôt que paniquer ; Must pour les erreurs de programmation. »"
cards:
  - key: valeur-zero
    format: course
    question: Que signifie « rendre la valeur zéro utile » ?
    answer: Concevoir un type pour qu'une variable déclarée sans initialisation fonctionne directement, comme sync.Mutex, bytes.Buffer ou strings.Builder ; au besoin par une initialisation paresseuse dans les méthodes.
  - key: quand-new
    format: course
    question: Quand écrire une fonction New pour un type ?
    answer: Quand le type a des invariants à vérifier, des dépendances obligatoires, des valeurs par défaut non nulles, ou une ressource à initialiser (map, goroutine, connexion).
  - key: must
    format: course
    question: À quoi servent les fonctions préfixées par Must, comme regexp.MustCompile ?
    answer: Elles paniquent au lieu de renvoyer une erreur ; on les réserve aux valeurs écrites dans le code (une expression régulière constante), où l'échec est une erreur de programmation détectée au démarrage.
  - key: pointeur
    format: course
    question: Une fonction New doit-elle renvoyer un pointeur ou une valeur ?
    answer: Un pointeur pour un type avec un état modifiable, un verrou ou une identité (un client, un serveur) ; une valeur pour un petit type immuable (une date, une somme d'argent).
  - key: vf-constructeurs
    format: true-false
    question: Go a des constructeurs appelés automatiquement à la création d'une struct.
    truth: false
    answer: Il n'y en a pas ; on écrit des fonctions New par convention.
  - key: vf-zero
    format: true-false
    question: '`var b bytes.Buffer` est prêt à l''emploi sans appel à une fonction New.'
    truth: true
    answer: Sa valeur zéro est un tampon vide.
  - key: vf-erreur
    format: true-false
    question: Une fonction New qui reçoit une configuration invalide devrait paniquer.
    truth: false
    answer: Elle renvoie une erreur ; Must est réservé aux erreurs de programmation.
  - key: vf-nom
    format: true-false
    question: Dans le package list, le constructeur s'appelle list.New plutôt que list.NewList.
    truth: true
    answer: Le nom du package suffit.
  - key: qcm-new
    format: multiple-choice
    question: Quand une fonction New est-elle justifiée ?
    choices:
      - text: Le type a une map à initialiser et une dépendance obligatoire
        correct: true
      - text: Des valeurs par défaut non nulles (un délai de 5 s)
        correct: true
      - text: Un invariant à vérifier (une URL valide)
        correct: true
      - text: Une struct de trois champs sans contrainte
        correct: false
    answer: Un littéral de struct suffit alors.
  - key: qcm-retour
    format: multiple-choice
    question: Quelles signatures de constructeur sont idiomatiques ?
    choices:
      - text: '`func NewClient(base string, h *http.Client) (*Client, error)`'
        correct: true
      - text: '`func New() *List`'
        correct: true
      - text: '`func NewClient() Client` qui panique si la configuration manque'
        correct: false
      - text: '`func (c *Client) Init()` à appeler après chaque déclaration'
        correct: false
    answer: Un Init obligatoire laisse des valeurs à moitié construites.
  - key: qcm-zero
    format: multiple-choice
    question: Quels types de la bibliothèque standard ont une valeur zéro utilisable ?
    choices:
      - text: '`sync.Mutex`'
        correct: true
      - text: '`strings.Builder`'
        correct: true
      - text: '`sync.WaitGroup`'
        correct: true
      - text: '`map[string]int`, pour y écrire'
        correct: false
    answer: Écrire dans une map nil panique.
  - key: qcm-dependances
    format: multiple-choice
    question: Comment passer les dépendances et les options à un constructeur ?
    choices:
      - text: Les dépendances obligatoires en paramètres
        correct: true
      - text: Les réglages facultatifs par une struct d'options ou des options fonctionnelles
        correct: true
      - text: Tout par variables globales
        correct: false
      - text: Tout dans le contexte
        correct: false
    answer: La signature dit ce qui est obligatoire.
  - key: trous-new
    format: fill-in
    question: "Complétez le constructeur :\n```go\nfunc ___Depot(db *sql.DB) *Depot {\n\treturn &Depot{db: db}\n}\n```"
    blanks:
      - - New
    answer: NewDepot.
  - key: trous-erreur
    format: fill-in
    question: |-
      Complétez la signature d'un constructeur qui peut échouer :
      ```go
      func NewClient(base string) (*Client, ___)
      ```
    blanks:
      - - error
    answer: error.
  - key: trous-must
    format: fill-in
    question: |-
      Complétez pour une expression constante :
      ```go
      var reCode = regexp.___(`^[A-Z]{3}$`)
      ```
    blanks:
      - - MustCompile
    answer: MustCompile.
  - key: trous-paresseux
    format: fill-in
    question: "Complétez l'initialisation paresseuse :\n```go\nif c.n == ___ {\n\tc.n = make(map[string]int)\n}\n```"
    blanks:
      - - nil
    answer: nil.
  - key: bug-map-nil
    format: bug-fix
    question: "`var r Registre; r.Ajouter(\"a\")` panique avec « assignment to entry in nil map » :\n```go\ntype Registre struct {\n\telements map[string]bool\n}\n\nfunc (r *Registre) Ajouter(cle string) { r.elements[cle] = true }\n```"
    answer: "```go\nfunc (r *Registre) Ajouter(cle string) {\n\tif r.elements == nil {\n\t\tr.elements = make(map[string]bool)\n\t}\n\tr.elements[cle] = true\n}\n```\nL'initialisation paresseuse rend la valeur zéro utilisable (ou l'on fournit un New qui crée la map)."
  - key: bug-panique
    format: bug-fix
    question: "Une URL mal configurée fait planter tout le service au démarrage, sans message clair :\n```go\nfunc NewClient(base string) *Client {\n\tu, err := url.Parse(base)\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\treturn &Client{base: u}\n}\n```"
    answer: "```go\nfunc NewClient(base string) (*Client, error) {\n\tu, err := url.Parse(base)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"URL de base du client %q : %w\", base, err)\n\t}\n\treturn &Client{base: u}, nil\n}\n```\nUne configuration invalide est une erreur attendue : on la renvoie avec son contexte, et main décide."
  - key: bug-init
    format: bug-fix
    question: |-
      Des services oublient d'appeler Init et plantent plus tard :
      ```go
      s := &Service{}
      s.Init(db, logger)
      ```
    answer: "```go\nfunc NewService(db *sql.DB, log *slog.Logger) *Service {\n\treturn &Service{db: db, log: log}\n}\n\ns := NewService(db, logger)\n```\nUne méthode Init séparée laisse exister des valeurs à moitié construites ; un constructeur qui prend les dépendances\nobligatoires l'empêche."
  - key: bug-goroutine
    format: bug-fix
    question: "Les tests laissent des goroutines qui tournent après eux :\n```go\nfunc NewCache() *Cache {\n\tc := &Cache{items: map[string]entree{}}\n\tgo c.nettoyerEnBoucle()\n\treturn c\n}\n```"
    answer: "```go\nfunc NewCache(ctx context.Context) *Cache {\n\tc := &Cache{items: map[string]entree{}}\n\tgo c.nettoyerEnBoucle(ctx) // s'arrête quand ctx est annulé\n\treturn c\n}\n```\nUne goroutine lancée par un constructeur doit pouvoir être arrêtée : un contexte (ou une méthode Close) le permet,\net la documentation le dit."
  - key: scenario-conception
    format: scenario
    question: Comment conçois-tu la construction d'un client d'API partagé par plusieurs équipes ?
    answer: |-
      `NewClient(base string, opts ...Option) (*Client, error)` : l'URL obligatoire en paramètre et validée, les réglages
      facultatifs (délai, client HTTP, journal) en options fonctionnelles avec des défauts sensés, une erreur claire si
      la configuration est invalide. Le client renvoyé est sûr entre goroutines et ne lance rien en arrière-plan sans
      méthode Close. La documentation montre un exemple (une fonction Example).
  - key: scenario-zero
    format: scenario
    question: Pourquoi la bibliothèque standard tient-elle à des valeurs zéro utilisables ?
    answer: |-
      Parce que toute variable Go est initialisée à sa valeur zéro : si cette valeur fonctionne, aucune construction
      n'est oubliée, les champs d'une struct qui contiennent ces types marchent directement, et le code reste court
      (`var mu sync.Mutex` à côté des données). C'est un choix de conception à reproduire dans ses propres types quand
      il n'y a pas de dépendance obligatoire.
  - key: scenario-java
    format: scenario
    question: Comment expliques-tu les constructeurs Go à un développeur Java ?
    answer: |-
      Il n'y a ni constructeur ni surcharge : un type est une struct, et sa valeur zéro est utilisable. Quand il faut
      valider ou fournir des dépendances, on écrit une fonction ordinaire, `NewX`, qui renvoie souvent `(*X, error)` au
      lieu de lever une exception. Pour les paramètres facultatifs, à la place des surcharges ou d'un builder, des options
      fonctionnelles ou une struct d'options.
  - key: scenario-revue
    format: scenario
    question: En revue, quels défauts cherches-tu dans une fonction de construction ?
    answer: |-
      Une panique au lieu d'une erreur pour une entrée invalide, des dépendances obligatoires cachées (variables globales,
      méthode Init à appeler après), une goroutine lancée sans moyen de l'arrêter, du travail lourd ou des appels réseau
      cachés, un type qui renvoie une valeur alors qu'il contient un mutex, et un New inutile pour une struct qui
      fonctionnerait à zéro.
