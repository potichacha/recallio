notion: constructeurs-new
lesson: "Go n'a pas de constructeurs : on écrit des fonctions **`New`** quand c'est utile, et l'on cherche d'abord à rendre la\n**valeur zéro utilisable**.\n\n**La valeur zéro utile** : `var mu sync.Mutex`, `var b bytes.Buffer`, `var sb strings.Builder` fonctionnent sans\ninitialisation. On conçoit ses types pareil quand c'est possible :\n\n```go\ntype Compteur struct {\n\tmu sync.Mutex\n\tn  map[string]int\n}\n\nfunc (c *Compteur) Ajouter(cle string) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tif c.n == nil {\n\t\tc.n = make(map[string]int) // initialisation paresseuse\n\t}\n\tc.n[cle]++\n}\n```\n\n**Une fonction New** quand le type a des **invariants**, des **dépendances obligatoires** ou des **valeurs par\ndéfaut** :\n\n```go\nfunc NewClient(base string, http *http.Client) (*Client, error) {\n\tu, err := url.Parse(base)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"URL de base invalide : %w\", err)\n\t}\n\treturn &Client{base: u, http: http, delai: 5 * time.Second}, nil\n}\n```\n\nLes conventions :\n- `NewX` dans un package qui en contient plusieurs, ou simplement **`New`** quand le type porte le nom du package\n  (`list.New()`, `errors.New`) ;\n- renvoyer un **pointeur** pour un type avec un état, un mutex ou une identité ; une valeur pour un petit type immuable ;\n- renvoyer une **erreur** si la construction peut échouer, plutôt que paniquer ; `MustX` pour les cas où l'échec est\n  une erreur de programmation (`regexp.MustCompile`) ;\n- les **dépendances** obligatoires en paramètres, les **options** facultatives par une struct ou des options\n  fonctionnelles ;\n- pas de travail lourd ni de goroutine cachée dans un constructeur sans le dire.\n\n**En entretien** : « Valeur zéro utilisable d'abord ; New quand il y a des invariants, des dépendances ou des\ndéfauts ; renvoyer une erreur plutôt que paniquer ; Must pour les erreurs de programmation. »"
cards:
  - key: valeur-zero
    format: course
    question: "Que signifie « rendre la valeur zéro utile » pour un type ?"
    choices:
      - {text: "Qu'une variable déclarée sans initialisation marche telle quelle, comme `sync.Mutex`", correct: true}
      - {text: "Que le type fournisse une constante `Zero`, à utiliser à la place de `nil`", correct: false}
      - {text: "Que chaque champ reçoive une valeur par défaut non nulle, déclarée dans la struct", correct: false}
      - {text: "Qu'une fonction `New` soit obligatoire, pour ne jamais manipuler de valeur zéro", correct: false}
    answer: "Concevoir le type pour que `var x T` marche tout de suite, comme `sync.Mutex`, `bytes.Buffer` ou `strings.Builder` ; au besoin par une initialisation paresseuse dans les méthodes. Go n'a pas de valeur par défaut déclarée sur un champ."
  - key: quand-new
    format: course
    question: "Quand écrire une fonction `New` pour un type ?"
    choices:
      - {text: "Quand il a des invariants, des dépendances obligatoires, des défauts non nuls ou une ressource à créer", correct: true}
      - {text: "Toujours : en Go, chaque type exporté doit avoir son constructeur `New` pour être utilisable", correct: false}
      - {text: "Jamais : un littéral de struct suffit toujours, et `New` est une habitude venue de Java", correct: false}
      - {text: "Seulement quand le type est manipulé par pointeur, puisque `New` renvoie toujours un pointeur", correct: false}
    answer: "Quand le type a des invariants à vérifier, des dépendances obligatoires, des valeurs par défaut non nulles ou une ressource à initialiser (map, goroutine, connexion). Sinon un littéral de struct, ou la valeur zéro, suffit."
  - key: must
    format: course
    question: "À quoi servent les fonctions préfixées par `Must`, comme `regexp.MustCompile` ?"
    choices:
      - {text: "À paniquer au lieu de renvoyer une erreur, pour des valeurs écrites dans le code", correct: true}
      - {text: "À garantir qu'aucune erreur n'est possible, par une vérification à la compilation", correct: false}
      - {text: "À réessayer l'opération jusqu'à ce qu'elle réussisse, puis renvoyer le résultat", correct: false}
      - {text: "À renvoyer une erreur que le compilateur oblige l'appelant à vérifier", correct: false}
    answer: "Elles paniquent au lieu de renvoyer une erreur : on les réserve aux valeurs écrites dans le code (une expression régulière constante), où un échec est une erreur de programmation vue dès le démarrage. Rien n'est vérifié à la compilation."
  - key: pointeur
    format: course
    question: "Une fonction `New` doit-elle renvoyer un pointeur ou une valeur ?"
    choices:
      - {text: "Un pointeur pour un état modifiable, un verrou ou une identité ; une valeur pour un petit type immuable", correct: true}
      - {text: "Toujours un pointeur : renvoyer une valeur copie toute la struct à chaque appel, ce qui coûte cher", correct: false}
      - {text: "Toujours une valeur : un pointeur fait allouer l'objet sur le tas, ce qui ralentit le programme", correct: false}
      - {text: "Un pointeur seulement si la struct dépasse 64 octets, une valeur pour tout ce qui est plus petit", correct: false}
    answer: "Un pointeur pour un type avec un état modifiable, un verrou ou une identité (un client, un serveur) ; une valeur pour un petit type immuable (une date, une somme d'argent). Une struct qui contient un mutex ne doit pas être copiée."
  - key: vf-constructeurs
    format: true-false
    question: Go a des constructeurs appelés automatiquement à la création d'une struct.
    truth: false
    answer: Il n'y en a pas ; on écrit des fonctions New par convention.
  - key: vf-zero
    format: true-false
    question: '`var b bytes.Buffer` est prêt à l''emploi sans appel à une fonction New.'
    truth: true
    answer: Sa valeur zéro est un tampon vide.
  - key: vf-erreur
    format: true-false
    question: Une fonction New qui reçoit une configuration invalide devrait paniquer.
    truth: false
    answer: Elle renvoie une erreur ; Must est réservé aux erreurs de programmation.
  - key: vf-nom
    format: true-false
    question: Dans le package list, le constructeur s'appelle list.New plutôt que list.NewList.
    truth: true
    answer: Le nom du package suffit.
  - key: qcm-new
    format: multiple-choice
    question: "Dans lequel de ces cas une fonction `New` est-elle superflue ?"
    choices:
      - {text: "Une struct de trois champs, sans contrainte ni défaut", correct: true}
      - {text: "Le type a une map à initialiser et une dépendance obligatoire", correct: false}
      - {text: "Des valeurs par défaut non nulles, comme un délai de 5 s", correct: false}
      - {text: "Un invariant à vérifier, comme une URL valide", correct: false}
    answer: "Sans contrainte, un littéral de struct suffit. `New` se justifie pour une map à initialiser, une dépendance obligatoire, des défauts non nuls ou un invariant à vérifier."
  - key: qcm-retour
    format: multiple-choice
    question: "Laquelle de ces signatures est idiomatique pour construire un client dont la configuration peut être invalide ?"
    choices:
      - {text: "`func NewClient(base string, h *http.Client) (*Client, error)`", correct: true}
      - {text: "`func NewClient() Client`, qui panique si la configuration manque", correct: false}
      - {text: "`func (c *Client) Init()`, à appeler après chaque déclaration", correct: false}
      - {text: "`func NewClient(base string) (error, *Client)`", correct: false}
    answer: "Les dépendances en paramètres et l'erreur en dernier résultat. Paniquer empêche l'appelant de réagir, et un `Init` obligatoire laisse exister des valeurs à moitié construites ; `func New() *List` reste idiomatique quand rien ne peut échouer."
  - key: qcm-zero
    format: multiple-choice
    question: "Lequel de ces types n'a pas de valeur zéro utilisable telle quelle ?"
    choices:
      - {text: "`map[string]int`, pour y écrire", correct: true}
      - {text: "`sync.Mutex`", correct: false}
      - {text: "`strings.Builder`", correct: false}
      - {text: "`sync.WaitGroup`", correct: false}
    answer: "Écrire dans une map `nil` panique : il faut `make`. `sync.Mutex`, `strings.Builder` et `sync.WaitGroup` marchent dès leur déclaration."
  - key: qcm-dependances
    format: multiple-choice
    question: "Comment passer à un constructeur ses dépendances obligatoires et ses réglages facultatifs ?"
    choices:
      - {text: "Les dépendances en paramètres, les réglages par une struct d'options ou des options fonctionnelles", correct: true}
      - {text: "Tout par des variables globales du package, lues par `New` au moment de construire", correct: false}
      - {text: "Tout dans le `context.Context`, lu avec `ctx.Value` au moment de construire", correct: false}
      - {text: "Tout en paramètres, avec une surcharge de `New` pour chaque combinaison de réglages", correct: false}
    answer: "La signature dit ce qui est obligatoire ; le facultatif passe par une struct d'options ou des options fonctionnelles. Go n'a pas de surcharge, et le contexte ne sert pas à passer des dépendances."
  - key: trous-new
    format: fill-in
    question: |-
      Complète le constructeur :
      ```go
      func ___Depot(db *sql.DB) *Depot {
      	return &Depot{db: db}
      }
      ```
    blanks:
      - - New
    answer: NewDepot.
  - key: trous-erreur
    format: fill-in
    question: |-
      Complète la signature d'un constructeur qui peut échouer :
      ```go
      func NewClient(base string) (*Client, ___)
      ```
    blanks:
      - - error
    answer: error.
  - key: trous-must
    format: fill-in
    question: |-
      Complète pour une expression constante :
      ```go
      var reCode = regexp.___(`^[A-Z]{3}$`)
      ```
    blanks:
      - - MustCompile
    answer: MustCompile.
  - key: trous-paresseux
    format: fill-in
    question: |-
      Complète l'initialisation paresseuse :
      ```go
      if c.n == ___ {
      	c.n = make(map[string]int)
      }
      ```
    blanks:
      - - nil
    answer: nil.
  - key: bug-map-nil
    format: bug-fix
    question: |-
      `var r Registre; r.Ajouter("a")` panique avec « assignment to entry in nil map ». Quelle correction est la bonne ?
      ```go
      type Registre struct {
      	elements map[string]bool
      }

      func (r *Registre) Ajouter(cle string) { r.elements[cle] = true }
      ```
    choices:
      - {text: "Créer la map à la première écriture, si `r.elements == nil`", correct: true}
      - {text: "Remplacer la map par une slice, qui accepte `append` sur `nil`", correct: false}
      - {text: "Déclarer `var r *Registre`, pour que Go alloue la map", correct: false}
      - {text: "Ajouter un `recover` dans `Ajouter`, qui ignore la panic", correct: false}
    answer: |-
      ```go
      func (r *Registre) Ajouter(cle string) {
      	if r.elements == nil {
      		r.elements = make(map[string]bool)
      	}
      	r.elements[cle] = true
      }
      ```
      L'initialisation paresseuse rend la valeur zéro utilisable (ou l'on fournit un `New` qui crée la map). Un pointeur `nil` n'alloue rien, et un `recover` cacherait la perte de l'élément.
  - key: bug-panique
    format: bug-fix
    question: |-
      Une URL mal configurée fait planter tout le service au démarrage, sans message clair. Quelle correction est la bonne ?
      ```go
      func NewClient(base string) *Client {
      	u, err := url.Parse(base)
      	if err != nil {
      		panic(err)
      	}
      	return &Client{base: u}
      }
      ```
    choices:
      - {text: "Renvoyer `(*Client, error)`, avec une erreur qui cite l'URL fautive", correct: true}
      - {text: "Remplacer `panic(err)` par `log.Fatal(err)`, au message plus lisible", correct: false}
      - {text: "Ignorer l'erreur et garder l'URL brute, vérifiée à chaque requête", correct: false}
      - {text: "Garder la panic, et l'attraper avec un `recover` dans `main`", correct: false}
    answer: |-
      ```go
      func NewClient(base string) (*Client, error) {
      	u, err := url.Parse(base)
      	if err != nil {
      		return nil, fmt.Errorf("URL de base du client %q : %w", base, err)
      	}
      	return &Client{base: u}, nil
      }
      ```
      Une configuration invalide est une erreur attendue : on la renvoie avec son contexte, et `main` décide. `log.Fatal` dans une bibliothèque arrête le programme à la place de l'appelant, tout comme la panic.
  - key: bug-init
    format: bug-fix
    question: |-
      Des services oublient d'appeler `Init` et plantent plus tard. Quelle correction est la bonne ?
      ```go
      s := &Service{}
      s.Init(db, logger)
      ```
    choices:
      - {text: "Un constructeur `NewService(db, log)` qui prend les dépendances obligatoires", correct: true}
      - {text: "Appeler `Init` au début de chaque méthode, au cas où il aurait été oublié", correct: false}
      - {text: "Un champ `initialise bool`, vérifié par chaque méthode, qui panique sinon", correct: false}
      - {text: "Documenter `Init` en gras, pour que plus personne n'oublie de l'appeler", correct: false}
    answer: |-
      ```go
      func NewService(db *sql.DB, log *slog.Logger) *Service {
      	return &Service{db: db, log: log}
      }

      s := NewService(db, logger)
      ```
      Une méthode `Init` séparée laisse exister des valeurs à moitié construites ; un constructeur qui prend les dépendances obligatoires l'empêche. Vérifier dans chaque méthode ne fait que déplacer la panic.
  - key: bug-goroutine
    format: bug-fix
    question: |-
      Les tests laissent des goroutines qui tournent après eux. Quelle correction est la bonne ?
      ```go
      func NewCache() *Cache {
      	c := &Cache{items: map[string]entree{}}
      	go c.nettoyerEnBoucle()
      	return c
      }
      ```
    choices:
      - {text: "Passer un `context.Context` (ou une méthode `Close`) qui arrête la goroutine", correct: true}
      - {text: "Lancer la goroutine dans un `init()` du package, une seule fois pour tous", correct: false}
      - {text: "Appeler `runtime.Goexit()` à la fin de chaque test, pour tout arrêter", correct: false}
      - {text: "Ajouter `defer wg.Wait()` dans `NewCache`, juste avant le `return`", correct: false}
    answer: |-
      ```go
      func NewCache(ctx context.Context) *Cache {
      	c := &Cache{items: map[string]entree{}}
      	go c.nettoyerEnBoucle(ctx) // s'arrête quand ctx est annulé
      	return c
      }
      ```
      Une goroutine lancée par un constructeur doit pouvoir être arrêtée : un contexte, ou une méthode `Close`, le permet, et la documentation le dit. Attendre dans `NewCache` bloquerait pour toujours.
  - key: scenario-conception
    format: scenario
    question: Comment conçois-tu la construction d'un client d'API partagé par plusieurs équipes ?
    choices:
      - {text: "`NewClient(base string, opts ...Option) (*Client, error)`, l'URL validée et des défauts sensés", correct: true}
      - {text: "Un `Client` à remplir en littéral, sans validation, chaque équipe réglant ses champs exportés", correct: false}
      - {text: "Une variable globale `DefaultClient`, configurée au démarrage par des variables d'environnement", correct: false}
      - {text: "Un `NewClient` à dix paramètres positionnels, un par réglage, tous obligatoires et documentés", correct: false}
    answer: "`NewClient(base string, opts ...Option) (*Client, error)` : l'URL obligatoire en paramètre et validée, les réglages facultatifs (délai, client HTTP, journal) en options fonctionnelles aux défauts sensés, une erreur claire si la configuration est invalide. Le client est sûr entre goroutines, ne lance rien en arrière-plan sans méthode `Close`, et sa documentation montre un exemple."
  - key: scenario-zero
    format: scenario
    question: Pourquoi la bibliothèque standard tient-elle à des valeurs zéro utilisables ?
    choices:
      - {text: "Toute variable Go part de sa valeur zéro : si elle marche, aucune construction n'est oubliée", correct: true}
      - {text: "Pour économiser la mémoire : une valeur zéro n'occupe aucun octet tant qu'on ne s'en sert pas", correct: false}
      - {text: "Parce que Go interdit d'écrire des constructeurs, qui seraient sinon plus clairs que la valeur zéro", correct: false}
      - {text: "Pour la vitesse : le compilateur saute l'allocation des types dont la valeur zéro est utile", correct: false}
    answer: "Toute variable Go est initialisée à sa valeur zéro : si cette valeur fonctionne, aucune construction n'est oubliée, les champs d'une struct qui contiennent ces types marchent directement, et le code reste court (`var mu sync.Mutex` à côté des données). C'est un choix à reproduire dans ses propres types quand il n'y a pas de dépendance obligatoire."
  - key: scenario-java
    format: scenario
    question: Comment expliques-tu les constructeurs Go à un développeur Java ?
    choices:
      - {text: "Ni constructeur ni surcharge : la valeur zéro, ou une fonction `NewX` qui renvoie `(*X, error)`", correct: true}
      - {text: "Une méthode `New` attachée au type, que `new(X)` appelle automatiquement à la création", correct: false}
      - {text: "Comme en Java : un constructeur par combinaison de paramètres, tous nommés `New`", correct: false}
      - {text: "Une méthode `Init` à appeler après `new(X)`, qui lève une panic en cas d'erreur", correct: false}
    answer: "Il n'y a ni constructeur ni surcharge : un type est une struct, et sa valeur zéro est utilisable. Pour valider ou fournir des dépendances, une fonction ordinaire `NewX`, qui renvoie souvent `(*X, error)` au lieu de lever une exception ; pour les paramètres facultatifs, des options fonctionnelles ou une struct d'options plutôt qu'un builder."
  - key: scenario-revue
    format: scenario
    question: En revue, quels défauts cherches-tu dans une fonction de construction ?
    choices:
      - {text: "Une panic sur entrée invalide, des dépendances cachées, une goroutine sans arrêt, du travail lourd", correct: true}
      - {text: "L'absence de `New` sur un type exporté, même pour une struct qui marche à sa valeur zéro", correct: false}
      - {text: "Un retour `(*T, error)` : une fonction de construction ne devrait jamais pouvoir échouer", correct: false}
      - {text: "Des paramètres obligatoires : tout réglage devrait passer par des options facultatives", correct: false}
    answer: "Une panique au lieu d'une erreur pour une entrée invalide, des dépendances obligatoires cachées (variables globales, `Init` à appeler après), une goroutine lancée sans moyen de l'arrêter, du travail lourd ou des appels réseau cachés, une valeur renvoyée alors que le type contient un mutex, et un `New` inutile pour une struct qui fonctionnerait à zéro."
