notion: injection-dependances
lesson: "En Go, l'**injection de dépendances** se fait **à la main**, sans framework : chaque composant reçoit ses dépendances\n**en paramètres** de son constructeur, et le **`main`** assemble tout (*composition root*).\n\n```go\n// un service dépend d'interfaces petites, déclarées chez lui\ntype Service struct {\n\tdepot      Depot\n\tpaiements  Paiements\n\thorloge    func() time.Time\n\tlog        *slog.Logger\n}\n\nfunc NewService(d Depot, p Paiements, h func() time.Time, l *slog.Logger) *Service {\n\treturn &Service{depot: d, paiements: p, horloge: h, log: l}\n}\n\n// main : le seul endroit qui connaît les implémentations concrètes\nfunc run(ctx context.Context) error {\n\tcfg, err := config.Charger()\n\tif err != nil {\n\t\treturn err\n\t}\n\tdb, err := sql.Open(\"pgx\", cfg.BaseURL)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer db.Close()\n\tlog := slog.New(slog.NewJSONHandler(os.Stdout, nil))\n\tservice := commande.NewService(postgres.NewDepot(db), stripe.NewClient(cfg.CleStripe), time.Now, log)\n\tsrv := api.NewServeur(service, log)\n\treturn srv.Demarrer(ctx)\n}\n```\n\nPourquoi à la main :\n- le câblage est du **code ordinaire** : lisible, vérifié par le compilateur, navigable dans l'éditeur ;\n- pas de **réflexion** ni de conteneur magique ;\n- les tests construisent le service avec des **faux**, sans configuration.\n\nLes pièges à éviter : les **variables globales** et `init()` qui créent des dépendances cachées, les singletons\naccessibles partout, et les constructeurs qui créent eux-mêmes leurs dépendances (`NewService()` qui ouvre la base).\n\nQuand le graphe devient très gros, **wire** (génération de code) ou **fx** (réflexion à l'exécution) automatisent le\ncâblage, mais beaucoup d'équipes s'en passent.\n\n**En entretien** : « Des dépendances en paramètres du constructeur, des interfaces petites chez l'utilisateur ; le\nmain comme composition root ; pas de globales ; wire ou fx seulement si le câblage devient vraiment lourd. »"
cards:
  - key: applique-dip
    format: course
    question: "Comment s'applique le principe d'inversion des dépendances (DIP) en Go ?"
    choices:
      - {text: "Le consommateur déclare l'interface, et la dépendance arrive par le constructeur, sans framework", correct: true}
      - {text: "Le fournisseur déclare une interface pour chacun de ses types, que les consommateurs importent", correct: false}
      - {text: "Un conteneur d'injection instancie les dépendances par réflexion, à partir d'annotations", correct: false}
      - {text: "Les dépendances sont créées dans `init()`, puis lues dans des variables de package", correct: false}
    answer: "Le consommateur déclare la petite interface dont il a besoin et reçoit l'implémentation par son constructeur ; `main` assemble. Pas de framework : les interfaces implicites suffisent, et déclarer l'interface chez le fournisseur est une habitude de Java."
  - key: injection-dependances
    format: course
    question: "Comment fait-on de l'injection de dépendances en Go ?"
    choices:
      - {text: "À la main dans `main` (composition root), ou avec Wire (génération) ou Fx (exécution)", correct: true}
      - {text: "Avec des annotations `@Inject`, que le compilateur Go lit sans autre bibliothèque", correct: false}
      - {text: "Avec le package standard `inject`, qui câble les dépendances d'après leur type", correct: false}
      - {text: "En rangeant chaque dépendance dans le `context.Context`, lue par `ctx.Value`", correct: false}
    answer: "Le plus souvent à la main, dans `main` (le composition root) ; Wire génère ce code à la compilation, Fx câble à l'exécution par réflexion. Go n'a ni annotations ni package d'injection standard, et le contexte n'est pas fait pour les dépendances."
  - key: composition-root
    format: course
    question: "Qu'est-ce que le composition root ?"
    choices:
      - {text: "L'endroit unique, souvent `main`, où toutes les dépendances sont construites et injectées", correct: true}
      - {text: "Le package racine du module, qui doit contenir toutes les interfaces du programme", correct: false}
      - {text: "La première dépendance construite, dont les autres dérivent par incorporation", correct: false}
      - {text: "Le répertoire racine du dépôt, où vit le `go.mod` qui déclare les dépendances", correct: false}
    answer: "L'endroit unique (en général `main`, ou une fonction `run`) où toutes les dépendances sont construites puis injectées. Le reste du code les reçoit, sans jamais les créer."
  - key: globales
    format: course
    question: Pourquoi éviter les variables globales pour les dépendances (base, journal, clients) ?
    choices:
      - {text: "Elles cachent les dépendances, gênent les faux, fragilisent l'initialisation et sérialisent les tests", correct: true}
      - {text: "Elles sont plus lentes, car chaque accès passe par un verrou caché du runtime de Go", correct: false}
      - {text: "Elles ne compilent pas si elles ne sont pas initialisées dans une fonction `init`", correct: false}
      - {text: "Elles sont copiées dans chaque goroutine, ce qui multiplie les connexions ouvertes", correct: false}
    answer: "Elles cachent les dépendances des fonctions, empêchent de tester avec des faux sans modifier un état partagé, rendent l'ordre d'initialisation fragile et interdisent les tests parallèles. Elles ne sont ni plus lentes ni copiées."
  - key: vf-framework
    format: true-false
    question: En Go, un framework d'injection de dépendances est indispensable dans un projet de taille moyenne.
    truth: false
    answer: Le câblage à la main dans main suffit le plus souvent.
  - key: vf-main
    format: true-false
    question: Le main est l'endroit où l'on assemble les implémentations concrètes.
    truth: true
    answer: C'est la composition root.
  - key: vf-wire
    format: true-false
    question: wire génère le code de câblage à la compilation, sans réflexion à l'exécution.
    truth: true
    answer: fx, lui, câble par réflexion au démarrage.
  - key: vf-creer
    format: true-false
    question: Un service qui ouvre lui-même sa connexion à la base dans son constructeur est facile à tester.
    truth: false
    answer: Il faut lui passer la dépendance pour pouvoir la remplacer.
  - key: qcm-pratiques
    format: multiple-choice
    question: "Laquelle de ces pratiques ne relève pas de l'injection de dépendances à la main ?"
    choices:
      - {text: "Créer les dépendances dans des fonctions `init`", correct: true}
      - {text: "Passer les dépendances au constructeur", correct: false}
      - {text: "Dépendre de petites interfaces déclarées chez l'utilisateur", correct: false}
      - {text: "Assembler les composants dans `main`", correct: false}
    answer: "`init` cache les dépendances et s'exécute dans un ordre implicite. L'injection à la main passe les dépendances au constructeur, dépend de petites interfaces déclarées chez l'utilisateur et assemble tout dans `main`."
  - key: qcm-heure
    format: multiple-choice
    question: "Lesquelles de ces façons d'injecter l'heure dans un service sont bonnes ?"
    choices:
      - text: Un champ `horloge func() time.Time`, time.Now en production
        correct: true
      - text: Une petite interface Horloge avec une méthode Now
        correct: true
      - text: Appeler time.Now() partout
        correct: false
      - text: Une variable globale modifiée par les tests
        correct: false
    answer: "Un champ `func() time.Time` ou une petite interface rendent l'heure fixe dans les tests. Appeler `time.Now()` partout la rend intestable, et une globale empêche les tests parallèles."
  - key: qcm-outils
    format: multiple-choice
    question: "Que fait l'outil wire, de Google ?"
    choices:
      - {text: "Il génère le code de câblage à partir de fournisseurs déclarés", correct: true}
      - {text: "Il câble les composants par réflexion à l'exécution, et gère leur cycle de vie", correct: false}
      - {text: "Il est indispensable pour utiliser des interfaces dans un service", correct: false}
      - {text: "Il génère des faux pour les tests, à partir des interfaces", correct: false}
    answer: "wire génère, à la compilation, le code de câblage qu'on écrirait à la main. C'est fx qui câble à l'exécution et gère le cycle de vie ; et aucun des deux n'est nécessaire pour utiliser des interfaces."
  - key: qcm-tests
    format: multiple-choice
    question: "Qu'apporte l'injection de dépendances aux tests ?"
    choices:
      - {text: "Des services construits avec des faux, sans base ni réseau, testables en parallèle", correct: true}
      - {text: "La suppression des tests d'intégration, devenus inutiles avec les faux", correct: false}
      - {text: "Des tests sans assertions, puisque les faux vérifient tout eux-mêmes", correct: false}
      - {text: "Des faux générés automatiquement par le compilateur, sans code à écrire", correct: false}
    answer: "Chaque test construit son service avec des faux, sans base ni réseau ni état global : les tests sont indépendants et parallélisables. Les adaptateurs réels restent testés en intégration."
  - key: bug-global
    format: bug-fix
    question: |-
      Les tests de ce service dépendent d'une vraie base et ne peuvent pas tourner en parallèle. Quelle correction est la bonne ?
      ```go
      var DB *sql.DB

      func init() {
      	DB, _ = sql.Open("pgx", os.Getenv("DATABASE_URL"))
      }

      func TrouverCommande(id string) (Commande, error) {
      	return lire(DB, id)
      }
      ```
    choices:
      - {text: "Un `Depot` qui reçoit sa connexion par `NewDepot(db)`, appelé dans `main`", correct: true}
      - {text: "Réaffecter `DB` au début de chaque test, vers une base de test", correct: false}
      - {text: "Protéger `DB` par un `sync.Mutex`, pour autoriser les tests parallèles", correct: false}
      - {text: "Déplacer le `sql.Open` de `init` au début de `TrouverCommande`", correct: false}
    answer: |-
      ```go
      type Depot struct{ db *sql.DB }

      func NewDepot(db *sql.DB) *Depot { return &Depot{db: db} }

      func (d *Depot) Trouver(ctx context.Context, id string) (Commande, error) {
      	return lire(ctx, d.db, id)
      }
      ```
      La connexion est passée au constructeur par `main` ; les services qui utilisent le dépôt dépendent d'une interface et se testent avec un faux. Remplacer la globale dans chaque test empêche toujours le parallélisme.
  - key: bug-constructeur
    format: bug-fix
    question: |-
      Impossible de tester ce service sans appeler l'API de paiement. Quelle correction est la bonne ?
      ```go
      func NewService() *Service {
      	return &Service{paiements: stripe.NewClient(os.Getenv("STRIPE_KEY"))}
      }
      ```
    choices:
      - {text: "Déclarer une interface `Paiements` et la recevoir dans `NewService(p Paiements)`", correct: true}
      - {text: "Lire `STRIPE_KEY` d'une variable de test, pour viser le bac à sable de Stripe", correct: false}
      - {text: "Remplacer `stripe.NewClient` par une variable globale que les tests modifient", correct: false}
      - {text: "Ajouter un paramètre `modeTest bool` à `NewService`, qui saute les paiements", correct: false}
    answer: |-
      ```go
      type Paiements interface {
      	Debiter(ctx context.Context, client string, montant int64) (string, error)
      }

      func NewService(p Paiements) *Service {
      	return &Service{paiements: p}
      }

      // main : commande.NewService(stripe.NewClient(cfg.CleStripe))
      ```
      Le service reçoit sa dépendance au lieu de la créer, et ne lit plus la configuration lui-même. Un drapeau de test ou une globale mêlent le code de test à la production.
  - key: bug-singleton
    format: bug-fix
    question: |-
      Le journal est configuré par un singleton global, et les tests ne peuvent pas vérifier ce qui est écrit. Quelle correction est la bonne ?
      ```go
      func (s *Service) Payer(ctx context.Context, id string) error {
      	journal.Instance().Info("paiement", "id", id)
      	// ...
      }
      ```
    choices:
      - {text: "Injecter un `*slog.Logger` dans `Service`, comme ses autres dépendances", correct: true}
      - {text: "Rediriger `os.Stdout` dans chaque test, pour capturer la sortie du singleton", correct: false}
      - {text: "Ajouter `journal.Reinitialiser()`, à appeler au début de chaque test", correct: false}
      - {text: "Supprimer les journaux du service, puisqu'on ne sait pas les tester", correct: false}
    answer: |-
      ```go
      type Service struct {
      	log *slog.Logger
      }

      func (s *Service) Payer(ctx context.Context, id string) error {
      	s.log.InfoContext(ctx, "paiement", "id", id)
      	// ...
      }
      ```
      Le journal est injecté comme les autres dépendances ; un test peut lui passer un logger qui écrit dans un tampon. Rediriger une sortie globale empêche les tests parallèles.
  - key: bug-contexte
    format: bug-fix
    question: |-
      Le service récupère sa base dans le contexte de la requête :
      ```go
      db := ctx.Value(cleDB{}).(*sql.DB)
      ```
      Que proposes-tu ?
    choices:
      - {text: "Passer la base au constructeur du service, `NewService(db)`", correct: true}
      - {text: "Garder le contexte, mais tester l'assertion de type avec `, ok`", correct: false}
      - {text: "Ranger la base dans une variable globale, plus simple que le contexte", correct: false}
      - {text: "Prendre une chaîne comme clé du contexte, plus lisible que `cleDB{}`", correct: false}
    answer: |-
      ```go
      type Service struct{ db *sql.DB }

      func NewService(db *sql.DB) *Service { return &Service{db: db} }
      ```
      Une dépendance passe par le constructeur, pas par le contexte : elle devient visible, vérifiée par le compilateur et facile à remplacer dans les tests. Le contexte porte des données de requête : délai, annulation, identifiant de trace.
  - key: scenario-assemblage
    format: scenario
    question: Comment organises-tu l'assemblage d'un service qui a une base, un cache, deux clients d'API et un serveur HTTP ?
    choices:
      - {text: "Une fonction `run(ctx) error` appelée par `main`, qui construit tout de haut en bas, avec ses `defer`", correct: true}
      - {text: "Des fonctions `init` dans chaque package, qui créent leurs dépendances au chargement du programme", correct: false}
      - {text: "Un conteneur d'injection par réflexion, qui trouve chaque dépendance d'après son type", correct: false}
      - {text: "Chaque service crée lui-même ses clients et sa connexion, à partir de l'environnement", correct: false}
    answer: "Une fonction `run(ctx) error` appelée par `main` : configuration chargée et validée, journal, base et cache ouverts (avec leurs fermetures en `defer`), puis clients, dépôts, services, et enfin le serveur HTTP qui reçoit les services. Chaque étape renvoie une erreur claire ; si le fichier devient long, je le découpe en fonctions par couche, pas en framework."
  - key: scenario-wire
    format: scenario
    question: Quand envisagerais-tu wire ou fx plutôt que le câblage à la main ?
    choices:
      - {text: "Quand des dizaines de composants s'assemblent de plusieurs façons et que le câblage devient fragile", correct: true}
      - {text: "Dès le premier service, pour ne jamais avoir à écrire le câblage à la main par la suite", correct: false}
      - {text: "Dès qu'un service utilise des interfaces, que Go ne sait pas câbler sans un outil dédié", correct: false}
      - {text: "Jamais : wire et fx sont dépréciés, au profit d'un câblage dans les fonctions `init`", correct: false}
    answer: "Quand le graphe compte des dizaines de composants assemblés de plusieurs façons (plusieurs binaires, variantes de tests) et que le câblage devient une source d'erreurs. wire garde l'avantage du code généré, lisible et vérifié ; fx gère aussi le cycle de vie, au prix de la réflexion. Pour un service typique, le câblage à la main reste plus simple."
  - key: scenario-java
    format: scenario
    question: Comment expliques-tu l'absence de Spring à un développeur Java qui arrive en Go ?
    choices:
      - {text: "Go préfère l'explicite : des constructeurs appelés dans `main`, et des interfaces implicites", correct: true}
      - {text: "Go a son équivalent de Spring dans la bibliothèque standard, mais sans annotations", correct: false}
      - {text: "Go interdit l'injection de dépendances, une notion propre aux langages à classes", correct: false}
      - {text: "Go remplace les beans par des variables globales, initialisées dans `init`", correct: false}
    answer: "Go préfère l'explicite : au lieu d'annotations et d'un conteneur qui instancie les beans par réflexion, on écrit les constructeurs et on les appelle dans `main`, avec des interfaces implicites déclarées chez l'utilisateur. On perd un peu de concision, mais on gagne un démarrage instantané, des erreurs de câblage vues à la compilation et un code qu'on suit sans connaître de framework."
  - key: scenario-tests
    format: scenario
    question: Comment l'injection de dépendances simplifie-t-elle tes tests ?
    choices:
      - {text: "Chaque test construit le composant avec ses faux (dépôt, horloge, logger), sans état global", correct: true}
      - {text: "Les tests n'ont plus besoin de faux : le conteneur leur injecte les vraies dépendances", correct: false}
      - {text: "Les tests partagent une configuration globale, préparée une seule fois pour tous", correct: false}
      - {text: "Elle permet de supprimer les tests d'intégration, couverts par les tests unitaires", correct: false}
    answer: "Chaque test construit le composant avec exactement ce qu'il faut : un faux dépôt en mémoire, un faux client de paiement qui échoue sur demande, une horloge fixe, un logger vers un tampon. Sans configuration globale, les tests sont indépendants et tournent en parallèle ; les vraies implémentations sont testées à part, en intégration."
