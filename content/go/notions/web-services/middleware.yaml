notion: middleware
lesson: "Un **middleware** est une fonction qui prend un `http.Handler` et renvoie un autre `http.Handler` qui fait quelque\nchose **avant** et/ou **après** l'appel au suivant : journalisation, authentification, récupération des paniques,\nlimitation de débit, en-têtes de sécurité, CORS.\n\n```go\nfunc journaliser(log *slog.Logger) func(http.Handler) http.Handler {\n\treturn func(next http.Handler) http.Handler {\n\t\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\t\tdebut := time.Now()\n\t\t\tnext.ServeHTTP(w, r)                    // le handler suivant\n\t\t\tlog.Info(\"requête\", \"methode\", r.Method, \"chemin\", r.URL.Path, \"duree\", time.Since(debut))\n\t\t})\n\t}\n}\n\nvar h http.Handler = mux\nh = authentifier(h)\nh = journaliser(logger)(h)\nh = recuperer(h) // le dernier appliqué est le premier exécuté\n```\n\nLes points clés :\n- un middleware **arrête** la chaîne en écrivant une réponse sans appeler `next` (401 d'une authentification) ;\n- pour transmettre une information au handler (l'utilisateur authentifié), il passe une requête enrichie :\n  `next.ServeHTTP(w, r.WithContext(ctx))` ;\n- pour connaître le **statut** écrit par le handler, on enveloppe le `ResponseWriter` dans un type qui intercepte\n  `WriteHeader`, en gardant `Unwrap()` pour que `http.ResponseController` trouve les interfaces d'origine (Flush) ;\n- l'**ordre** compte : la récupération des paniques à l'extérieur, la journalisation avant l'authentification pour\n  voir aussi les refus ;\n- `http.StripPrefix`, `http.TimeoutHandler` et `http.MaxBytesHandler` sont des middlewares de la bibliothèque\n  standard.\n\n**En entretien** : « func(http.Handler) http.Handler ; avant et après next.ServeHTTP ; arrêter en n'appelant pas\nnext ; r.WithContext pour transmettre ; envelopper le ResponseWriter pour le statut ; l'ordre compte. »"
cards:
  - key: ecrit-middleware-http
    format: course
    question: "Comment s'écrit un middleware HTTP en Go ?"
    choices:
      - {text: "Une fonction qui prend un `http.Handler` et renvoie un `http.Handler` enrichi", correct: true}
      - {text: "Un type qui hérite de `http.Handler` et redéfinit `ServeHTTP`", correct: false}
      - {text: "Une annotation placée au-dessus du handler, lue au démarrage", correct: false}
      - {text: "Une méthode `Before` et une méthode `After`, appelées par le mux", correct: false}
    answer: "Un middleware est une fonction `func(next http.Handler) http.Handler` qui renvoie un handler : il fait son travail avant et après `next.ServeHTTP(w, r)`. C'est le motif du décorateur ; Go n'a ni héritage ni annotations."
  - key: arreter
    format: course
    question: Comment un middleware empêche-t-il la requête d'atteindre le handler ?
    choices:
      - {text: "Il écrit lui-même la réponse, par exemple 401, et rend la main sans appeler `next`", correct: true}
      - {text: "Il appelle `next.ServeHTTP` avec une requête nil, que le handler ignore", correct: false}
      - {text: "Il lève une panique, que le serveur traduit en 401 pour le client", correct: false}
      - {text: "Il annule le contexte de la requête, ce qui saute le handler suivant", correct: false}
    answer: Il écrit lui-même une réponse (par exemple 401) et rend la main sans appeler next.ServeHTTP.
  - key: statut
    format: course
    question: Comment un middleware connaît-il le statut renvoyé par le handler ?
    choices:
      - {text: "En passant au handler un `ResponseWriter` enveloppé, dont `WriteHeader` enregistre le code", correct: true}
      - {text: "En lisant `w.Status()`, qu'expose tout `http.ResponseWriter` après l'écriture", correct: false}
      - {text: "En lisant `r.Response.StatusCode`, rempli par le serveur après l'appel à `next`", correct: false}
      - {text: "En comparant la taille du corps écrit avant et après l'appel à `next`", correct: false}
    answer: En passant au handler un ResponseWriter enveloppé, dont la méthode WriteHeader enregistre le code avant de l'appeler sur l'original (200 si Write est appelé sans WriteHeader).
  - key: ordre
    format: course
    question: Dans quel ordre s'exécutent des middlewares appliqués par `h = c(b(a(mux)))` ?
    choices:
      - {text: "c, puis b, puis a, puis le mux ; au retour, dans l'ordre inverse", correct: true}
      - {text: "a, puis b, puis c, puis le mux ; au retour, dans le même ordre", correct: false}
      - {text: "Le mux d'abord, puis a, b et c, une fois la réponse écrite", correct: false}
      - {text: "Dans un ordre quelconque, choisi par le runtime à chaque requête", correct: false}
    answer: c d'abord, puis b, puis a, puis le mux ; au retour, dans l'ordre inverse. Le dernier appliqué est le plus extérieur.
  - key: vf-signature
    format: true-false
    question: Un middleware idiomatique a la signature `func(http.Handler) http.Handler`.
    truth: true
    answer: Ce qui permet de les composer.
  - key: vf-next
    format: true-false
    question: Un middleware doit toujours appeler next.ServeHTTP.
    truth: false
    answer: Il peut arrêter la chaîne, par exemple pour refuser une requête.
  - key: vf-contexte
    format: true-false
    question: Pour transmettre l'utilisateur authentifié, un middleware peut appeler `next.ServeHTTP(w, r.WithContext(ctx))`.
    truth: true
    answer: Le handler le lit dans r.Context().
  - key: vf-panique
    format: true-false
    question: Une panique dans un handler arrête tout le serveur net/http.
    truth: false
    answer: net/http la récupère et ferme la connexion, mais un middleware de récupération permet de répondre 500 et de journaliser.
  - key: qcm-usages
    format: multiple-choice
    question: "Laquelle de ces tâches n'a pas sa place dans un middleware HTTP ?"
    choices:
      - {text: "Calculer le prix d'une commande", correct: true}
      - {text: "Journaliser chaque requête avec sa durée", correct: false}
      - {text: "Vérifier un jeton d'authentification", correct: false}
      - {text: "Ajouter des en-têtes de sécurité à toutes les réponses", correct: false}
    answer: "Un middleware porte ce qui est commun à toutes les requêtes : journaux, authentification, en-têtes de sécurité. La logique métier, comme le prix d'une commande, reste dans les handlers et les services."
  - key: qcm-ordre
    format: multiple-choice
    question: Quel ordre choisir, de l'extérieur vers l'intérieur ?
    choices:
      - text: Récupération des paniques, journalisation, authentification, handler
        correct: true
      - text: Authentification, récupération des paniques, journalisation, handler
        correct: false
      - text: Handler, authentification, journalisation
        correct: false
      - text: L'ordre n'a pas d'importance
        correct: false
    answer: La récupération doit englober tout ; la journalisation doit voir les refus d'authentification.
  - key: qcm-stdlib
    format: multiple-choice
    question: Lesquels sont des middlewares fournis par net/http ?
    choices:
      - text: '`http.StripPrefix`'
        correct: true
      - text: '`http.TimeoutHandler`'
        correct: true
      - text: '`http.MaxBytesHandler`'
        correct: true
      - text: '`http.AuthHandler`'
        correct: false
    answer: L'authentification est à écrire (ou à prendre dans une bibliothèque).
  - key: qcm-wrapper
    format: multiple-choice
    question: Pourquoi ajouter une méthode Unwrap au ResponseWriter enveloppé ?
    choices:
      - {text: "Pour que http.ResponseController retrouve le ResponseWriter d'origine et ses capacités (Flush, Hijack)", correct: true}
      - {text: "Pour que `errors.Is` et `errors.As` fonctionnent sur les erreurs écrites dans la réponse", correct: false}
      - {text: "Pour accélérer les écritures, en contournant le tampon du `ResponseWriter` enveloppé", correct: false}
      - {text: "Parce qu'elle est obligatoire pour compiler un type qui intègre un `http.ResponseWriter`", correct: false}
    answer: Sans elle, le streaming peut cesser de fonctionner derrière le middleware.
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature :
      ```go
      func enTetesSecurite(next http.Handler) http.___ {
      ```
    blanks:
      - - Handler
    answer: Un middleware renvoie un http.Handler.
  - key: trous-next
    format: fill-in
    question: |-
      Complète l'appel au suivant :
      ```go
      return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	w.Header().Set("X-Content-Type-Options", "nosniff")
      	next.___(w, r)
      })
      ```
    blanks:
      - - ServeHTTP
    answer: next.ServeHTTP.
  - key: trous-withcontext
    format: fill-in
    question: |-
      Complète pour transmettre l'utilisateur :
      ```go
      ctx := AvecUtilisateur(r.Context(), u)
      next.ServeHTTP(w, r.___(ctx))
      ```
    blanks:
      - - WithContext
    answer: r.WithContext renvoie une copie de la requête.
  - key: trous-handlerfunc
    format: fill-in
    question: |-
      Complète la conversion :
      ```go
      return http.___(func(w http.ResponseWriter, r *http.Request) {
      	// ...
      })
      ```
    blanks:
      - - HandlerFunc
    answer: http.HandlerFunc.
  - key: bug-return
    format: bug-fix
    question: |-
      Les requêtes sans jeton reçoivent un 401 suivi des données protégées. Quelle correction est la bonne ?
      ```go
      func authentifier(next http.Handler) http.Handler {
      	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      		if r.Header.Get("Authorization") == "" {
      			http.Error(w, "non authentifié", http.StatusUnauthorized)
      		}
      		next.ServeHTTP(w, r)
      	})
      }
      ```
    choices:
      - {text: "Ajouter `return` juste après `http.Error`", correct: true}
      - {text: "Appeler `next.ServeHTTP` avant de tester le jeton", correct: false}
      - {text: "Remplacer `http.Error` par `w.WriteHeader(401)`", correct: false}
      - {text: "Appliquer le middleware au handler final plutôt qu'au mux", correct: false}
    answer: "```go\nfunc authentifier(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tif r.Header.Get(\"Authorization\") == \"\" {\n\t\t\thttp.Error(w, \"non authentifié\", http.StatusUnauthorized)\n\t\t\treturn\n\t\t}\n\t\tnext.ServeHTTP(w, r)\n\t})\n}\n```\nSans return, la chaîne continuait vers le handler protégé."
  - key: bug-statut
    format: bug-fix
    question: |-
      Ce middleware de journalisation panique, car le `ResponseWriter` n'a pas de méthode `Status`. Quelle correction est la bonne ?
      ```go
      next.ServeHTTP(w, r)
      log.Info("requête", "statut", w.(interface{ Status() int }).Status())
      ```
    choices:
      - {text: "Envelopper `w` dans un type dont `WriteHeader` enregistre le code, 200 par défaut", correct: true}
      - {text: "Lire le statut dans `r.Response.StatusCode` après l'appel à `next.ServeHTTP`", correct: false}
      - {text: "Appeler `w.WriteHeader(0)` avant `next`, pour initialiser le statut à lire", correct: false}
      - {text: "Lire l'en-tête `Status` de `w.Header()` après l'appel à `next.ServeHTTP`", correct: false}
    answer: |-
      ```go
      type ecrivain struct {
      	http.ResponseWriter
      	statut int
      }

      func (e *ecrivain) WriteHeader(code int) {
      	e.statut = code
      	e.ResponseWriter.WriteHeader(code)
      }

      func (e *ecrivain) Unwrap() http.ResponseWriter { return e.ResponseWriter }

      // dans le middleware
      e := &ecrivain{ResponseWriter: w, statut: http.StatusOK}
      next.ServeHTTP(e, r)
      log.Info("requête", "statut", e.statut)
      ```
      `http.ResponseWriter` n'expose pas le statut, et l'assertion de type échouait. On l'enveloppe dans un type qui enregistre le code écrit (200 par défaut), avec `Unwrap` pour garder ses capacités.
  - key: bug-recover
    format: bug-fix
    question: |-
      Une panique dans un handler coupe la connexion sans réponse ni trace exploitable. Que proposes-tu ?
      ```go
      srv := &http.Server{Handler: mux}
      ```
    choices:
      - {text: "Un middleware à l'extérieur de la chaîne, qui récupère la panique, la journalise et répond 500", correct: true}
      - {text: "Un `recover` dans `main`, autour de l'appel à `srv.ListenAndServe()`", correct: false}
      - {text: "Rien : `net/http` journalise déjà la pile et répond lui-même 500 au client", correct: false}
      - {text: "Un `defer` dans chaque handler, qui relance la panique avec plus de contexte", correct: false}
    answer: "```go\nfunc recuperer(log *slog.Logger, next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tdefer func() {\n\t\t\tif v := recover(); v != nil {\n\t\t\t\tif v == http.ErrAbortHandler {\n\t\t\t\t\tpanic(v) // abandon volontaire : laisser net/http le traiter\n\t\t\t\t}\n\t\t\t\tlog.Error(\"panique\", \"valeur\", v, \"pile\", string(debug.Stack()))\n\t\t\t\thttp.Error(w, \"erreur interne\", http.StatusInternalServerError)\n\t\t\t}\n\t\t}()\n\t\tnext.ServeHTTP(w, r)\n\t})\n}\n\nsrv := &http.Server{Handler: recuperer(logger, mux)}\n```\nUn middleware à l'extérieur de la chaîne récupère la panique, la journalise avec sa pile, et répond 500."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Les tentatives d'accès refusées n'apparaissent pas dans les journaux :
      ```go
      h := journaliser(authentifier(mux))
      ```
      L'authentification s'exécute pourtant après la journalisation. Que vérifies-tu, et que corriges-tu ?
    choices:
      - {text: "La journalisation doit se faire dans le middleware, après `next.ServeHTTP`, pour voir les 401", correct: true}
      - {text: "Inverser l'ordre, `authentifier(journaliser(mux))`, pour journaliser après l'authentification", correct: false}
      - {text: "Journaliser dans chaque handler final, où toutes les requêtes finissent par arriver", correct: false}
      - {text: "Remplacer le mux par `http.DefaultServeMux`, qui journalise lui-même les refus", correct: false}
    answer: "```go\nfunc journaliser(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\te := &ecrivain{ResponseWriter: w, statut: http.StatusOK}\n\t\tnext.ServeHTTP(e, r)\n\t\tlog.Info(\"requête\", \"chemin\", r.URL.Path, \"statut\", e.statut) // après next : voit aussi les 401\n\t})\n}\n```\nL'ordre était bon, mais la journalisation n'avait lieu que dans le handler final. Elle doit se faire dans le\nmiddleware, après next.ServeHTTP, pour voir aussi les requêtes arrêtées par l'authentification."
  - key: scenario-chaine
    format: scenario
    question: Quels middlewares mets-tu sur une API publique, et dans quel ordre ?
    choices:
      - {text: "Récupération, identifiant et trace, journaux, sécurité, débit, taille, authentification, puis routeur", correct: true}
      - {text: "Authentification d'abord, puis récupération des paniques, puis journaux, puis le routeur", correct: false}
      - {text: "Le routeur d'abord, puis tous les middlewares, appliqués à la main dans chaque handler", correct: false}
      - {text: "Journaux d'abord, puis authentification, et la récupération des paniques en dernier", correct: false}
    answer: "De l'extérieur vers l'intérieur : récupération des paniques, identifiant de requête et trace, journalisation et métriques, en-têtes de sécurité et CORS, limitation de débit, limite de taille, authentification, puis le routeur. La récupération englobe tout, la journalisation voit les refus, et la limitation de débit passe avant l'authentification, plus coûteuse."
  - key: scenario-tester
    format: scenario
    question: Comment testes-tu un middleware d'authentification ?
    choices:
      - {text: "Avec un faux handler qui note s'il est appelé, et `httptest.NewRequest` et `NewRecorder`", correct: true}
      - {text: "En démarrant toute l'API avec sa base, puis en l'appelant avec curl", correct: false}
      - {text: "En appelant directement la fonction de vérification du jeton, sans le middleware", correct: false}
      - {text: "En vérifiant à la main que les 401 apparaissent dans les journaux de production", correct: false}
    answer: "J'applique le middleware à un faux handler qui note s'il a été appelé et ce qu'il lit dans le contexte, puis j'envoie des requêtes avec `httptest.NewRequest` et `httptest.NewRecorder` : sans jeton (401, handler non appelé), jeton invalide, jeton valide. Le tout en tests de table, sans réseau."
  - key: scenario-chi
    format: scenario
    question: Faut-il un routeur tiers comme chi pour gérer les middlewares ?
    choices:
      - {text: "Pas forcément : `func(http.Handler) http.Handler` se compose bien avec le `ServeMux` standard", correct: true}
      - {text: "Oui : le `ServeMux` standard n'accepte aucun middleware sans routeur tiers", correct: false}
      - {text: "Oui : chi est obligatoire dès qu'on utilise les motifs de Go 1.22", correct: false}
      - {text: "Non, et chi est de toute façon incompatible avec les handlers de `net/http`", correct: false}
    answer: "Des fonctions `func(http.Handler) http.Handler` se composent très bien avec le `ServeMux`, au besoin avec un petit utilitaire `chaine(h, m1, m2...)`. chi, compatible `net/http`, devient pratique avec beaucoup de groupes de routes aux middlewares différents."
  - key: scenario-timeout
    format: scenario
    question: Comment imposes-tu un délai maximal à chaque requête de ton API ?
    choices:
      - {text: "Un middleware qui dérive un contexte `WithTimeout` de `r.Context()`, et `http.TimeoutHandler`", correct: true}
      - {text: "Un `WriteTimeout` court sur le serveur, qui arrête aussi les handlers en cours", correct: false}
      - {text: "Un `time.Sleep` dans chaque handler, pour plafonner la durée des requêtes", correct: false}
      - {text: "Un compteur global de requêtes, qui refuse les nouvelles au-delà de 100", correct: false}
    answer: "Un middleware dérive un contexte `WithTimeout` de `r.Context()` et le passe avec `r.WithContext` : base et services s'interrompent. `http.TimeoutHandler` renvoie en plus un 503 au-delà du délai, et le `WriteTimeout` du serveur, réglé au-dessus, sert de filet."
