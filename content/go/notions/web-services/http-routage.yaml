notion: http-routage
lesson: "Depuis **Go 1.22**, le `ServeMux` de la bibliothèque standard comprend les **méthodes** et les **variables de\nchemin**, ce qui suffit à la plupart des API REST :\n\n```go\nmux := http.NewServeMux()\nmux.HandleFunc(\"GET /commandes\", lister)\nmux.HandleFunc(\"POST /commandes\", creer)\nmux.HandleFunc(\"GET /commandes/{id}\", lire)\nmux.HandleFunc(\"DELETE /commandes/{id}\", supprimer)\nmux.HandleFunc(\"GET /fichiers/{chemin...}\", servirFichier) // tout le reste du chemin\nmux.HandleFunc(\"GET /{$}\", accueil)                         // exactement \"/\"\n\nfunc lire(w http.ResponseWriter, r *http.Request) {\n\tid := r.PathValue(\"id\")\n\t// ...\n}\n```\n\nLes règles :\n- une méthode dans le motif restreint la route ; **`GET`** accepte aussi **`HEAD`** ;\n- une requête dont le chemin correspond mais pas la méthode reçoit **405 Method Not Allowed**, avec un en-tête\n  `Allow` ;\n- un motif qui finit par **`/`** correspond à tout ce qui commence par ce préfixe ; `{$}` limite au chemin exact ;\n- quand deux motifs correspondent, le **plus spécifique** gagne (`/commandes/nouvelle` avant `/commandes/{id}`) ; deux\n  motifs aussi spécifiques l'un que l'autre qui se chevauchent font **paniquer** l'enregistrement ;\n- un motif peut commencer par un **hôte** (`api.exemple.fr/`).\n\nOn évite **`http.DefaultServeMux`** (utilisé par `http.HandleFunc` et `ListenAndServe(addr, nil)`) : n'importe quel\npackage importé peut y ajouter des routes (`net/http/pprof` le fait).\n\nDes routeurs tiers (chi, gorilla/mux) restent utiles pour des groupes de routes avec leurs middlewares, mais ne sont\nplus nécessaires pour des variables de chemin.\n\n**En entretien** : « Go 1.22 : \"GET /commandes/{id}\" et r.PathValue ; 405 automatique ; le motif le plus spécifique\ngagne ; un mux à soi plutôt que DefaultServeMux. »"
tour:
  - title: Le routage
    text: |-
      `http.ServeMux` aiguille les requêtes vers des handlers selon leur chemin. Depuis Go 1.22, un motif fixe la
      **méthode** et nomme des **segments** : `"GET /livres/{id}"`. Le handler lit le segment avec `r.PathValue("id")`.

      Une requête qui ne correspond à aucun motif reçoit une 404, et une bonne adresse avec la mauvaise méthode une 405.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"net/http"
          	"net/http/httptest"
          	"strings"
          )

          func main() {
          	mux := http.NewServeMux()
          	mux.HandleFunc("GET /livres/{id}", func(w http.ResponseWriter, r *http.Request) {
          		fmt.Fprintf(w, "livre %s", r.PathValue("id"))
          	})

          	requetes := []struct{ methode, chemin string }{
          		{"GET", "/livres/42"},
          		{"DELETE", "/livres/42"},
          		{"GET", "/auteurs"},
          	}
          	for _, req := range requetes {
          		rec := httptest.NewRecorder()
          		mux.ServeHTTP(rec, httptest.NewRequest(req.methode, req.chemin, nil))
          		fmt.Println(req.methode, req.chemin, "→", rec.Code, strings.TrimSpace(rec.Body.String()))
          	}
          }
      output: |-
        GET /livres/42 → 200 livre 42
        DELETE /livres/42 → 405 Method Not Allowed
        GET /auteurs → 404 404 page not found
cards:
  - key: apporte-1-22-routage-http
    format: course
    question: "Qu'a apporté Go 1.22 au routage HTTP de la bibliothèque standard ?"
    choices:
      - {text: "Des motifs avec méthode et jokers dans le `ServeMux`, comme `GET /users/{id}`", correct: true}
      - {text: "Un nouveau paquet `net/http/router`, qui remplace le `ServeMux`", correct: false}
      - {text: "Des expressions régulières dans les motifs, comme `/users/[0-9]+`", correct: false}
      - {text: "La syntaxe `/users/:id` des autres routeurs, reprise telle quelle", correct: false}
    answer: "Le `ServeMux` accepte une méthode et des jokers : `GET /users/{id}`, `{chemin...}` pour la fin du chemin, `{$}` pour la fin exacte. Pas d'expressions régulières, ni de syntaxe `:id`."
  - key: apporte-1-22-servemux
    format: course
    question: "Dans un handler enregistré sur `GET /users/{id}`, comment lit-on la valeur de `id` ?"
    choices:
      - {text: "`r.PathValue(\"id\")`", correct: true}
      - {text: "`r.URL.Query().Get(\"id\")`", correct: false}
      - {text: "`r.FormValue(\"id\")`", correct: false}
      - {text: "`mux.Vars(r)[\"id\"]`", correct: false}
    answer: "`r.PathValue(\"id\")` renvoie la valeur du joker du motif (Go 1.22). `URL.Query` lit la chaîne de requête, et `mux.Vars` appartient à gorilla/mux."
  - key: eviter-http-defaultservemux
    format: course
    question: "Pourquoi éviter `http.DefaultServeMux` ?"
    choices:
      - {text: "C'est un global où n'importe quel paquet importé peut ajouter des routes", correct: true}
      - {text: "Il ne gère pas les requêtes concurrentes, servies une par une", correct: false}
      - {text: "Il ne comprend pas les motifs avec méthode de Go 1.22", correct: false}
      - {text: "Il est plus lent qu'un `ServeMux` créé avec `NewServeMux`", correct: false}
    answer: "`http.DefaultServeMux` est une variable globale : tout paquet importé peut y enregistrer des routes, comme `net/http/pprof` et ses pages de diagnostic. Un `http.NewServeMux()` à soi ne contient que ses routes."
  - key: chi-vs-gin-vs-fiber
    format: course
    question: "Quelle différence y a-t-il entre chi, Gin et Fiber ?"
    choices:
      - {text: "chi reste compatible `net/http` ; Gin a son propre contexte ; Fiber repose sur fasthttp", correct: true}
      - {text: "chi repose sur fasthttp ; Gin reste compatible `net/http` ; Fiber a son propre contexte", correct: false}
      - {text: "Aucune : ce sont trois noms du même routeur, repris par des équipes différentes", correct: false}
      - {text: "chi est réservé à gRPC ; Gin aux API REST ; Fiber aux sites web statiques", correct: false}
    answer: chi reste compatible net/http ; Gin a son propre contexte ; Fiber repose sur fasthttp, incompatible avec net/http.
  - key: vf-pathvalue
    format: true-false
    question: Depuis Go 1.22, `r.PathValue("id")` lit la variable `{id}` du motif.
    truth: true
    answer: Pour le motif qui a sélectionné la requête.
  - key: vf-405
    format: true-false
    question: Avec le ServeMux de Go 1.22, un POST sur une route déclarée seulement en GET reçoit 404.
    truth: false
    answer: Il reçoit 405 Method Not Allowed, avec un en-tête Allow.
  - key: vf-head
    format: true-false
    question: Une route déclarée en « GET » répond aussi aux requêtes HEAD.
    truth: true
    answer: Le corps n'est pas envoyé.
  - key: vf-specifique
    format: true-false
    question: Quand « /commandes/nouvelle » et « /commandes/{id} » correspondent, le ServeMux choisit le premier enregistré.
    truth: false
    answer: Il choisit le plus spécifique, quel que soit l'ordre d'enregistrement.
  - key: qcm-motifs
    format: multiple-choice
    question: Lesquels de ces motifs sont valides pour le ServeMux de Go 1.22 ?
    choices:
      - text: '`"GET /commandes/{id}"`'
        correct: true
      - text: '`"GET /fichiers/{chemin...}"`'
        correct: true
      - text: '`"GET /{$}"`'
        correct: true
      - text: '`"GET /commandes/:id"`'
        correct: false
    answer: La syntaxe :id est celle d'autres routeurs ; elle serait prise littéralement.
  - key: qcm-default
    format: multiple-choice
    question: "Quel risque fait courir l'usage de `http.DefaultServeMux` dans une API publique ?"
    choices:
      - {text: "Exposer par accident les routes de `net/http/pprof`, qui s'y enregistre", correct: true}
      - {text: "Servir les requêtes une par une, faute de concurrence", correct: false}
      - {text: "Perdre les motifs avec méthode, qu'il ne comprend pas", correct: false}
      - {text: "Ralentir l'API, car il est plus lent qu'un mux à soi", correct: false}
    answer: "N'importe quel paquet importé peut y enregistrer des routes : `net/http/pprof` y ajoute ses pages de diagnostic, un risque de sécurité sur une API publique. Il gère la concurrence et les motifs comme tout `ServeMux`."
  - key: qcm-prefixe
    format: multiple-choice
    question: À quoi correspond le motif « /static/ » ?
    choices:
      - text: À tous les chemins qui commencent par /static/
        correct: true
      - text: Seulement au chemin exact /static/
        correct: false
      - text: À /static sans barre finale uniquement
        correct: false
      - text: À rien, il faut une variable
        correct: false
    answer: Une barre finale fait du motif un préfixe ; {$} l'empêcherait.
  - key: qcm-conflit
    format: multiple-choice
    question: Que se passe-t-il si l'on enregistre « GET /a/{x} » puis « GET /{y}/b » ?
    choices:
      - {text: "Le second enregistrement panique, car /a/b correspond aux deux sans que l'un soit plus spécifique", correct: true}
      - {text: "Le premier gagne toujours : `/a/b` va à `GET /a/{x}`, enregistré avant l'autre", correct: false}
      - {text: "Le second remplace le premier, et `/a/b` comme `/a/c` vont à `GET /{y}/b`", correct: false}
      - {text: "Les deux handlers sont appelés l'un après l'autre pour `/a/b`, dans l'ordre d'ajout", correct: false}
    answer: Le conflit est détecté au démarrage plutôt qu'en production.
  - key: trous-methode
    format: fill-in
    question: |-
      Complète pour la création :
      ```go
      mux.HandleFunc("___ /commandes", creer)
      ```
    blanks:
      - - POST
    answer: POST.
  - key: trous-variable
    format: fill-in
    question: |-
      Complète le motif :
      ```go
      mux.HandleFunc("GET /clients/___", lireClient)
      ```
    blanks:
      - - '{id}'
    answer: Une variable entre accolades.
  - key: trous-pathvalue
    format: fill-in
    question: |-
      Complète dans le handler :
      ```go
      id := r.___("id")
      ```
    blanks:
      - - PathValue
    answer: r.PathValue.
  - key: trous-mux
    format: fill-in
    question: |-
      Complète pour créer un routeur à soi :
      ```go
      mux := http.___()
      ```
    blanks:
      - - NewServeMux
    answer: http.NewServeMux.
  - key: bug-methode
    format: bug-fix
    question: |-
      Une requête GET sur /commandes/42 supprime la commande. Quelle correction est la bonne ?
      ```go
      mux.HandleFunc("/commandes/{id}", supprimer)
      ```
    choices:
      - {text: "Préciser la méthode de chaque route : `GET` pour lire, `DELETE` pour supprimer", correct: true}
      - {text: "Tester `r.Method` dans `supprimer`, et ignorer les GET sans rien répondre", correct: false}
      - {text: "Remplacer `{id}` par `{id...}` dans le motif de la route", correct: false}
      - {text: "Enregistrer la route sur `/commandes/{id}/`, avec une barre finale", correct: false}
    answer: |-
      ```go
      mux.HandleFunc("GET /commandes/{id}", lire)
      mux.HandleFunc("DELETE /commandes/{id}", supprimer)
      ```
      Sans méthode, le motif acceptait toutes les méthodes ; on précise la méthode de chaque route.
  - key: bug-accueil
    format: bug-fix
    question: |-
      Toutes les URL inconnues affichent la page d'accueil au lieu d'une 404. Quelle correction est la bonne ?
      ```go
      mux.HandleFunc("GET /", accueil)
      ```
    choices:
      - {text: "Le motif `GET /{$}`, qui ne correspond qu'au chemin exact « / »", correct: true}
      - {text: "Le motif `GET /*`, qui limite la route à la racine", correct: false}
      - {text: "Le motif `GET`, sans chemin, réservé à l'accueil", correct: false}
      - {text: "Le motif `GET /index`, et une redirection depuis « / »", correct: false}
    answer: |-
      ```go
      mux.HandleFunc("GET /{$}", accueil)
      ```
      « / » est un préfixe qui correspond à tout ; {$} limite au chemin exact, et le reste reçoit 404.
  - key: bug-default
    format: bug-fix
    question: |-
      Un audit découvre que /debug/pprof est accessible sur l'API publique. Quelle correction est la bonne ?
      ```go
      import _ "net/http/pprof"

      func main() {
      	http.HandleFunc("GET /commandes", lister)
      	http.ListenAndServe(":8080", nil)
      }
      ```
    choices:
      - {text: "Un `ServeMux` à soi pour l'API, et pprof sur un port interne", correct: true}
      - {text: "Passer l'API en HTTPS, ce qui protège les routes de diagnostic", correct: false}
      - {text: "Ajouter `http.StripPrefix(\"/debug\", ...)` devant l'API", correct: false}
      - {text: "Enregistrer `GET /debug/` avant les autres routes de l'API", correct: false}
    answer: "```go\nimport _ \"net/http/pprof\"\n\nfunc main() {\n\tapi := http.NewServeMux()\n\tapi.HandleFunc(\"GET /commandes\", lister)\n\tgo http.ListenAndServe(\"localhost:6060\", nil) // pprof, interne seulement\n\tsrv := &http.Server{Addr: \":8080\", Handler: api, ReadHeaderTimeout: 5 * time.Second}\n\tlog.Fatal(srv.ListenAndServe())\n}\n```\nL'API utilisait le DefaultServeMux, où pprof enregistre ses routes ; un mux à soi les sépare."
  - key: bug-decoupage
    format: bug-fix
    question: |-
      Ce handler, écrit avant Go 1.22, vérifie la méthode et découpe le chemin à la main. Quelle réécriture est la bonne ?
      ```go
      mux.HandleFunc("/commandes/", func(w http.ResponseWriter, r *http.Request) {
      	if r.Method != http.MethodGet {
      		http.Error(w, "méthode", http.StatusMethodNotAllowed)
      		return
      	}
      	id := strings.TrimPrefix(r.URL.Path, "/commandes/")
      	lire(w, r, id)
      })
      ```
    choices:
      - {text: "`GET /commandes/{id}` et `r.PathValue(\"id\")`, la méthode vérifiée par le mux", correct: true}
      - {text: "`/commandes/:id` et `r.URL.Query().Get(\"id\")`, comme dans Gin", correct: false}
      - {text: "`GET /commandes/` et `strings.Split(r.URL.Path, \"/\")[2]`", correct: false}
      - {text: "`GET /commandes/{id...}`, qui vérifie aussi le type de l'identifiant", correct: false}
    answer: "```go\nmux.HandleFunc(\"GET /commandes/{id}\", func(w http.ResponseWriter, r *http.Request) {\n\tlire(w, r, r.PathValue(\"id\"))\n})\n```\nLe ServeMux de Go 1.22 vérifie la méthode (405 automatique) et extrait la variable de chemin."
