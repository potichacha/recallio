notion: http-routage
cards:
  - key: apporte-1-22-routage-http
    format: course
    question: Qu'a apporté Go 1.22 au routage HTTP ?
    answer: Des motifs avec méthode et jokers dans ServeMux (`GET /users/{id}`).
  - key: apporte-1-22-servemux
    format: course
    question: Qu'apporte Go 1.22 au ServeMux ?
    answer: Des motifs avec méthode et jokers (`GET /users/{id}`), récupérés par r.PathValue.
  - key: eviter-http-defaultservemux
    format: course
    question: Pourquoi éviter http.DefaultServeMux ?
    answer: C'est un global auquel n'importe quel package importé peut ajouter des routes.
  - key: chi-vs-gin-vs-fiber
    format: course
    question: chi vs Gin vs Fiber ?
    answer: chi reste compatible net/http ; Gin a son propre contexte ; Fiber repose sur fasthttp, incompatible avec net/http.
