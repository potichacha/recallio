notion: client-http
cards:
  - key: corps-reponse-http
    format: course
    question: Que faut-il faire du corps d'une réponse HTTP ?
    answer: Le lire (ou le vider) et le fermer pour que la connexion soit réutilisée.
  - key: utiliser-http-get-production
    format: course
    question: Pourquoi ne pas utiliser http.Get en production ?
    answer: Il utilise DefaultClient, sans timeout.
  - key: fermer-lire-corps-reponse
    format: course
    question: Pourquoi fermer et lire le corps de la réponse ?
    answer: Pour libérer et réutiliser la connexion.
  - key: client-do-renvoie-erreur-500
    format: course
    question: client.Do renvoie-t-il une erreur sur un 500 ?
    answer: Non, il faut vérifier StatusCode.
  - key: service-appelle-api-externe-quand-devient
    format: scenario
    question: Le service appelle une API externe et, quand elle devient lente, tout le service ralentit.
    answer: |-
      Sans timeout, chaque appel lent garde une goroutine et une connexion, et la file grossit jusqu'à épuiser les ressources. Je mettrais un **client dédié** avec un timeout global et des timeouts de connexion et de handshake, et je passerais le **contexte** de la requête entrante, éventuellement réduit à un budget précis.
      Ensuite des protections : un **circuit breaker** pour arrêter d'appeler une dépendance en échec et renvoyer vite une erreur ou une valeur dégradée, une **limite de concurrence** vers cette dépendance (sémaphore), un cache si les données le permettent. Et des métriques de latence par dépendance pour voir le problème avant les utilisateurs.
