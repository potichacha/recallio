notion: client-http
lesson: "Pour appeler une API depuis Go, on utilise un **`http.Client`** configuré, et non `http.Get` :\n\n```go\nvar client = &http.Client{Timeout: 10 * time.Second} // un seul, partagé\n\nfunc (c *Catalogue) Produit(ctx context.Context, id string) (Produit, error) {\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, c.base+\"/produits/\"+url.PathEscape(id), nil)\n\tif err != nil {\n\t\treturn Produit{}, err\n\t}\n\treq.Header.Set(\"Accept\", \"application/json\")\n\n\tresp, err := c.http.Do(req)\n\tif err != nil {\n\t\treturn Produit{}, fmt.Errorf(\"appel du catalogue : %w\", err) // réseau, délai, annulation\n\t}\n\tdefer resp.Body.Close() // toujours\n\n\tif resp.StatusCode != http.StatusOK { // un 404 ou un 500 n'est pas une erreur de Do\n\t\tio.Copy(io.Discard, io.LimitReader(resp.Body, 4096))\n\t\treturn Produit{}, fmt.Errorf(\"catalogue : statut %d\", resp.StatusCode)\n\t}\n\tvar p Produit\n\tif err := json.NewDecoder(resp.Body).Decode(&p); err != nil {\n\t\treturn Produit{}, fmt.Errorf(\"réponse du catalogue : %w\", err)\n\t}\n\treturn p, nil\n}\n```\n\nLes règles :\n- **toujours fermer** `resp.Body` (quand `err == nil`), sinon la connexion fuit ; le **lire jusqu'au bout** permet de\n  réutiliser la connexion ;\n- `client.Do` ne renvoie une erreur que pour un problème de **transport** : un statut 4xx ou 5xx arrive avec\n  `err == nil`, il faut **tester `resp.StatusCode`** ;\n- le **contexte** de la requête (`NewRequestWithContext`) porte l'annulation et l'échéance de l'appelant ;\n  `Client.Timeout` borne en plus tout l'échange, lecture du corps comprise ;\n- `http.Get` et `http.DefaultClient` n'ont **aucun délai** ;\n- échapper les morceaux d'URL (`url.PathEscape`, `url.Values` pour la query).\n\n**En entretien** : « Un client avec Timeout, NewRequestWithContext, defer resp.Body.Close(), tester StatusCode, lire\nle corps pour réutiliser la connexion ; http.Get n'a pas de délai. »"
tour:
  - title: Le client HTTP
    text: |-
      `http.Get` envoie une requête, mais en production on crée son propre `http.Client` avec un **délai** : le client
      par défaut n'en a aucun, et attendrait indéfiniment un serveur muet.

      Le corps de la réponse est un flux à **fermer** : `defer resp.Body.Close()`, sans quoi la connexion n'est pas
      réutilisée. On vérifie aussi `resp.StatusCode` : pour le client, une réponse 404 n'est pas une erreur.

      Ici, `httptest.NewServer` démarre un vrai petit serveur, sur la machine elle-même, le temps du programme.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"io"
          	"net/http"
          	"net/http/httptest"
          	"time"
          )

          func main() {
          	serveur := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          		fmt.Fprint(w, "pong")
          	}))
          	defer serveur.Close()

          	client := &http.Client{Timeout: 2 * time.Second}
          	resp, err := client.Get(serveur.URL + "/ping")
          	if err != nil {
          		fmt.Println("erreur :", err)
          		return
          	}
          	defer resp.Body.Close()
          	corps, err := io.ReadAll(resp.Body)
          	fmt.Println(resp.StatusCode, string(corps), err)
          }
      output: |-
        200 pong <nil>
cards:
  - key: corps-reponse-http
    format: course
    question: "Que faut-il faire du corps d'une réponse HTTP reçue par un client ?"
    choices:
      - {text: "Le lire (ou le vider) puis le fermer, pour que la connexion soit réutilisée", correct: true}
      - {text: "Rien : il se ferme seul quand la réponse n'est plus référencée", correct: false}
      - {text: "Le fermer seulement si le statut est une erreur, 4xx ou 5xx", correct: false}
      - {text: "Le lire seulement : `Close` est réservé au côté serveur", correct: false}
    answer: "On le lit jusqu'au bout (ou on le vide avec `io.Copy(io.Discard, resp.Body)`) puis on le ferme : la connexion revient au pool. Sinon, chaque appel garde une connexion et un descripteur ouverts."
  - key: utiliser-http-get-production
    format: course
    question: "Pourquoi ne pas utiliser `http.Get` en production ?"
    choices:
      - {text: "Il passe par `http.DefaultClient`, qui n'a aucun délai", correct: true}
      - {text: "Il ouvre une nouvelle connexion TCP à chaque appel", correct: false}
      - {text: "Il ne suit pas les redirections, contrairement à `Do`", correct: false}
      - {text: "Il n'est pas sûr en concurrence entre goroutines", correct: false}
    answer: "`http.Get` utilise `http.DefaultClient`, sans `Timeout` : un serveur qui ne répond pas bloque l'appel indéfiniment. On crée un `http.Client` avec un délai, et l'on passe un contexte avec `NewRequestWithContext`."
  - key: fermer-lire-corps-reponse
    format: course
    question: "Pourquoi lire jusqu'au bout, puis fermer, le corps d'une réponse ?"
    choices:
      - {text: "Pour rendre la connexion au pool, qui peut alors la réutiliser", correct: true}
      - {text: "Pour que le serveur sache que la réponse a bien été reçue", correct: false}
      - {text: "Pour vider le cache HTTP du client, sinon il grossit sans fin", correct: false}
      - {text: "Pour déclencher le décodage JSON, qui n'a lieu qu'à la fermeture", correct: false}
    answer: "Une connexion n'est rendue au pool que si le corps a été lu jusqu'au bout puis fermé ; sinon elle est jetée, ou reste ouverte et fuit. Le serveur, lui, n'en sait rien."
  - key: client-do-renvoie-erreur-500
    format: course
    question: "`client.Do` renvoie-t-il une erreur quand le serveur répond 500 ?"
    choices:
      - {text: "Non : il faut vérifier `resp.StatusCode`", correct: true}
      - {text: "Oui : toute réponse 4xx ou 5xx est une erreur", correct: false}
      - {text: "Oui, mais seulement pour les réponses 5xx", correct: false}
      - {text: "Non, sauf si le client a un `Timeout`", correct: false}
    answer: "Non : une réponse HTTP, quel que soit son statut, est un succès pour `Do`. Il ne renvoie d'erreur que si la requête n'a pas abouti (connexion, TLS, délai) ; le statut se teste à la main."
  - key: service-appelle-api-externe-quand-devient
    format: scenario
    question: "Le service appelle une API externe et, quand elle devient lente, tout le service ralentit. Que fais-tu ?"
    choices:
      - {text: "Un client dédié avec des délais, le contexte de la requête, un disjoncteur et une limite de concurrence", correct: true}
      - {text: "Plus d'instances du service, pour absorber les appels lents vers l'API externe", correct: false}
      - {text: "Des réessais immédiats et illimités, jusqu'à ce que l'API externe réponde vite", correct: false}
      - {text: "`http.DefaultClient` partagé par tout le service, pour réutiliser ses connexions", correct: false}
    answer: "Sans délai, chaque appel lent garde une goroutine et une connexion, et la file grossit. Un client dédié avec ses délais, le contexte de la requête entrante, un disjoncteur (circuit breaker) qui renvoie vite une erreur ou une valeur dégradée, une limite de concurrence vers la dépendance, et des métriques de latence par dépendance."
  - key: vf-500
    format: true-false
    question: '`client.Do` renvoie une erreur quand le serveur répond 500.'
    truth: false
    answer: Il renvoie la réponse avec err == nil ; il faut tester StatusCode.
  - key: vf-close
    format: true-false
    question: Il faut fermer resp.Body même si l'on ne lit pas le corps.
    truth: true
    answer: Sinon la connexion reste occupée et fuit.
  - key: vf-get
    format: true-false
    question: '`http.Get` applique un délai par défaut de 30 secondes.'
    truth: false
    answer: Le client par défaut n'a aucun délai.
  - key: vf-timeout-corps
    format: true-false
    question: '`Client.Timeout` couvre aussi la lecture du corps de la réponse.'
    truth: true
    answer: Il borne tout l'échange, de la connexion à la fin du corps.
  - key: qcm-erreurs
    format: multiple-choice
    question: "Dans lequel de ces cas `client.Do` renvoie-t-il une erreur ?"
    choices:
      - {text: "Quand le délai du client ou le contexte expire", correct: true}
      - {text: "Quand le serveur répond 404", correct: false}
      - {text: "Quand le serveur répond 503", correct: false}
      - {text: "Quand le corps contient du JSON invalide", correct: false}
    answer: "`Do` renvoie une erreur quand la requête n'aboutit pas : connexion refusée, DNS, TLS, délai ou contexte expiré. Le statut et le contenu du corps sont à vérifier par l'appelant."
  - key: qcm-corps
    format: multiple-choice
    question: "Lesquelles de ces pratiques faut-il suivre avec le corps d'une réponse ?"
    choices:
      - text: '`defer resp.Body.Close()` juste après avoir vérifié l''erreur de Do'
        correct: true
      - text: Le lire jusqu'au bout, même si l'on n'en a pas besoin, pour réutiliser la connexion
        correct: true
      - text: Le fermer seulement si le statut est 200
        correct: false
      - text: Le laisser au GC
        correct: false
    answer: Le corps se ferme dans tous les cas où Do a réussi.
  - key: qcm-url
    format: multiple-choice
    question: "Lesquelles de ces expressions construisent sans risque l'URL `.../recherche?q=<terme>`, avec un terme saisi par l'utilisateur ?"
    choices:
      - text: '`url.Values{"q": {terme}}.Encode()`'
        correct: true
      - text: '`"?q=" + url.QueryEscape(terme)`'
        correct: true
      - text: '`"?q=" + terme`'
        correct: false
      - text: '`fmt.Sprintf("?q=%s", terme)`'
        correct: false
    answer: 'Sans échappement, un « & » ou un « # » dans le terme casserait la requête.'
  - key: qcm-contexte
    format: multiple-choice
    question: "Pourquoi utiliser `http.NewRequestWithContext` ?"
    choices:
      - {text: "Pour que l'appel s'arrête quand l'appelant est annulé ou que son échéance passe", correct: true}
      - {text: "Pour réutiliser les connexions, ce que `http.NewRequest` ne permet pas", correct: false}
      - {text: "Pour ajouter un en-tête `Authorization` tiré du contexte", correct: false}
      - {text: "Pour que la requête soit réessayée automatiquement en cas d'échec", correct: false}
    answer: "Le contexte porte l'annulation et l'échéance : l'appel sortant s'arrête quand la requête entrante est annulée ou que son budget expire. La réutilisation des connexions dépend du `Transport`, pas du contexte."
  - key: trous-request
    format: fill-in
    question: |-
      Complète :
      ```go
      req, err := http.___(ctx, http.MethodGet, u, nil)
      ```
    blanks:
      - - NewRequestWithContext
    answer: http.NewRequestWithContext.
  - key: trous-close
    format: fill-in
    question: |-
      Complète :
      ```go
      resp, err := client.Do(req)
      if err != nil {
      	return err
      }
      defer resp.___.Close()
      ```
    blanks:
      - - Body
    answer: resp.Body.Close().
  - key: trous-statut
    format: fill-in
    question: |-
      Complète le test du statut :
      ```go
      if resp.___ != http.StatusOK {
      	return fmt.Errorf("statut %d", resp.StatusCode)
      }
      ```
    blanks:
      - - StatusCode
    answer: resp.StatusCode.
  - key: trous-timeout
    format: fill-in
    question: |-
      Complète un client avec délai :
      ```go
      var client = &http.Client{___: 10 * time.Second}
      ```
    blanks:
      - - Timeout
    answer: Timeout.
  - key: bug-statut
    format: bug-fix
    question: |-
      Quand le service de paiement répond 503, le code décode la réponse comme un succès et considère le paiement comme accepté. Quelle correction est la bonne ?
      ```go
      resp, err := client.Do(req)
      if err != nil {
      	return err
      }
      defer resp.Body.Close()
      return json.NewDecoder(resp.Body).Decode(&resultat)
      ```
    choices:
      - {text: "Tester `resp.StatusCode` avant de décoder, et renvoyer une erreur hors 200", correct: true}
      - {text: "Rien : `client.Do` renvoie déjà une erreur pour un 503", correct: false}
      - {text: "Ajouter `DisallowUnknownFields` au décodeur de la réponse", correct: false}
      - {text: "Réessayer le décodage tant que `resultat` reste vide", correct: false}
    answer: "```go\nresp, err := client.Do(req)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\nif resp.StatusCode != http.StatusOK {\n\textrait, _ := io.ReadAll(io.LimitReader(resp.Body, 1024))\n\treturn fmt.Errorf(\"paiement : statut %d : %s\", resp.StatusCode, extrait)\n}\nreturn json.NewDecoder(resp.Body).Decode(&resultat)\n```\nDo ne renvoie pas d'erreur pour un 503 ; on teste le statut avant de décoder."
  - key: bug-fuite
    format: bug-fix
    question: |-
      Après quelques heures, le service ne peut plus ouvrir de connexion (« too many open files »). Quelle correction est la bonne ?
      ```go
      resp, err := client.Get(u)
      if err != nil {
      	return false
      }
      return resp.StatusCode == http.StatusOK
      ```
    choices:
      - {text: "Fermer le corps avec `defer resp.Body.Close()`, et le vider avec `io.Copy(io.Discard, ...)`", correct: true}
      - {text: "Créer un nouveau `http.Client` à chaque appel, pour repartir de zéro", correct: false}
      - {text: "Relever la limite de descripteurs du système avec `ulimit -n`", correct: false}
      - {text: "Tester `resp.StatusCode` avant de lire le corps, qui se ferme alors seul", correct: false}
    answer: "```go\nresp, err := client.Get(u)\nif err != nil {\n\treturn false\n}\ndefer resp.Body.Close()\nio.Copy(io.Discard, resp.Body)\nreturn resp.StatusCode == http.StatusOK\n```\nLe corps n'était jamais fermé : chaque appel gardait une connexion ouverte. Le lire jusqu'au bout permet aussi de\nréutiliser la connexion."
  - key: bug-sans-delai
    format: bug-fix
    question: |-
      Quand le partenaire ne répond plus, toutes les goroutines du service restent bloquées. Quelle correction est la bonne ?
      ```go
      resp, err := http.Get(urlPartenaire)
      ```
    choices:
      - {text: "Un `http.Client` avec `Timeout`, et une requête créée avec `NewRequestWithContext`", correct: true}
      - {text: "Lancer `http.Get` dans une goroutine, pour ne plus bloquer l'appelant", correct: false}
      - {text: "Remplacer `http.Get` par `http.Head`, plus léger pour le partenaire", correct: false}
      - {text: "Réessayer `http.Get` en boucle jusqu'à ce que le partenaire réponde", correct: false}
    answer: "```go\nvar client = &http.Client{Timeout: 5 * time.Second}\n\nreq, err := http.NewRequestWithContext(ctx, http.MethodGet, urlPartenaire, nil)\nif err != nil {\n\treturn err\n}\nresp, err := client.Do(req)\n```\nhttp.Get n'a ni délai ni contexte ; un client avec Timeout et une requête avec contexte bornent l'appel."
  - key: bug-close-nil
    format: bug-fix
    question: |-
      Le service panique quand le partenaire est injoignable. Quelle correction est la bonne ?
      ```go
      resp, err := client.Do(req)
      defer resp.Body.Close()
      if err != nil {
      	return err
      }
      ```
    choices:
      - {text: "Placer `defer resp.Body.Close()` après la vérification de l'erreur", correct: true}
      - {text: "Remplacer `defer resp.Body.Close()` par `defer resp.Close()`", correct: false}
      - {text: "Ajouter un `recover` dans la fonction, pour ignorer la panique", correct: false}
      - {text: "Tester `resp.StatusCode` juste avant le `defer`", correct: false}
    answer: "```go\nresp, err := client.Do(req)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\n```\nEn cas d'erreur, resp est nil ; le defer se place après la vérification."
  - key: scenario-client-api
    format: scenario
    question: Comment écris-tu un client Go pour une API REST partenaire ?
    choices:
      - {text: "Un type `Client` avec URL de base, `*http.Client` injecté et méthodes typées qui prennent un contexte", correct: true}
      - {text: "Des fonctions qui appellent `http.Get` et renvoient le corps brut, à décoder par l'appelant", correct: false}
      - {text: "Un client créé à chaque appel, avec une URL construite en concaténant la saisie", correct: false}
      - {text: "Une fonction générique qui renvoie une `map[string]any`, pour s'adapter à tout changement", correct: false}
    answer: "Un type `Client` avec l'URL de base, un `*http.Client` injecté (délai, transport configuré) et une méthode typée par opération, qui prend un contexte : `NewRequestWithContext`, en-têtes, vérification du statut, décodage dans des types dédiés, erreurs enveloppées (dont une erreur typée pour les statuts). Les tests passent par `httptest.NewServer`."
  - key: scenario-reessais
    format: scenario
    question: Comment ajoutes-tu des réessais à un client HTTP ?
    choices:
      - {text: "Seulement les erreurs temporaires et les requêtes idempotentes, avec un délai exponentiel et du jitter", correct: true}
      - {text: "Toutes les erreurs, y compris les 400, avec un délai fixe d'une seconde entre deux essais", correct: false}
      - {text: "Un réessai immédiat et illimité, tant que le contexte de l'appelant n'est pas annulé", correct: false}
      - {text: "Tous les POST d'abord, car ce sont eux qui échouent le plus souvent sur le réseau", correct: false}
    answer: "Seulement pour les erreurs temporaires (délai, connexion refusée, 429, 502, 503, 504) et les requêtes idempotentes (GET, ou POST avec clé d'idempotence) : délai exponentiel avec jitter, `Retry-After` respecté, nombre maximal de tentatives et contexte de l'appelant. Le corps doit pouvoir être relu (`req.GetBody`)."
  - key: scenario-tester
    format: scenario
    question: Comment testes-tu un client HTTP sans appeler le vrai partenaire ?
    choices:
      - {text: "Avec `httptest.NewServer` et un handler qui vérifie la requête et renvoie des réponses préparées", correct: true}
      - {text: "En appelant l'environnement de recette du partenaire à chaque exécution des tests", correct: false}
      - {text: "En remplaçant `http.DefaultClient` par une variable globale modifiée dans les tests", correct: false}
      - {text: "Sans test : on vérifie le client à la main avec curl avant chaque livraison", correct: false}
    answer: "`httptest.NewServer` démarre un vrai serveur local dont le handler vérifie la requête (méthode, chemin, en-têtes) et renvoie des réponses préparées : succès, 404, 500, JSON invalide, réponse lente pour le délai. Le client est construit avec l'URL de ce serveur, sans réseau externe."
