notion: grpc-streaming
lesson: "En plus des appels **unaires** (une requête, une réponse), gRPC propose trois sortes de **flux**, grâce à HTTP/2 :\n\n```protobuf\nservice Suivi {\n  rpc Positions(SuiviRequete) returns (stream Position);       // flux serveur\n  rpc Envoyer(stream Mesure) returns (Resume);                  // flux client\n  rpc Discussion(stream Message) returns (stream Message);      // bidirectionnel\n}\n```\n\n**Flux serveur** : le serveur envoie plusieurs messages, puis rend la main :\n\n```go\nfunc (s *serveur) Positions(req *suiviv1.SuiviRequete, flux suiviv1.Suivi_PositionsServer) error {\n\tfor {\n\t\tselect {\n\t\tcase p := <-s.positions(req.GetColisId()):\n\t\t\tif err := flux.Send(p); err != nil {\n\t\t\t\treturn err // le client est parti\n\t\t\t}\n\t\tcase <-flux.Context().Done():\n\t\t\treturn flux.Context().Err()\n\t\t}\n\t}\n}\n```\n\nCôté client, on lit avec **`Recv()`** jusqu'à **`io.EOF`** :\n\n```go\nflux, err := client.Positions(ctx, &suiviv1.SuiviRequete{ColisId: id})\nfor {\n\tp, err := flux.Recv()\n\tif errors.Is(err, io.EOF) {\n\t\tbreak // le serveur a terminé\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n\tafficher(p)\n}\n```\n\n**Flux client** : le client appelle `Send` plusieurs fois, puis `CloseAndRecv()` pour obtenir la réponse.\n**Bidirectionnel** : les deux côtés envoient et reçoivent indépendamment, souvent dans deux goroutines ; le client\nsignale la fin de ses envois par `CloseSend()`.\n\nLes règles :\n- un flux a le **contexte** de l'appel : annuler le contexte côté client ferme le flux ;\n- `Send` et `Recv` ne doivent pas être appelés par **plusieurs goroutines à la fois** sur le même côté (une goroutine\n  pour envoyer, une pour recevoir, c'est permis) ;\n- un flux très long doit prévoir la **reconnexion** et la reprise (un curseur ou un numéro de séquence) ;\n- un client qui ne lit pas assez vite ralentit le serveur (contrôle de flux de HTTP/2).\n\n**En entretien** : « Unaire, flux serveur, flux client, bidirectionnel ; Send, Recv jusqu'à io.EOF, CloseSend ; le\ncontexte ferme le flux ; une goroutine par sens au plus. »"
cards:
  - key: quatre-types-appel-grpc
    format: course
    question: "Quels sont les quatre types d'appel gRPC ?"
    choices:
      - {text: "Unaire, flux serveur, flux client et bidirectionnel", correct: true}
      - {text: "Unaire, asynchrone, par lots et bidirectionnel", correct: false}
      - {text: "GET, POST, PUT et DELETE, comme en REST", correct: false}
      - {text: "Unaire, flux serveur, diffusion et abonnement", correct: false}
    answer: "Unaire (une requête, une réponse), flux serveur (une requête, plusieurs réponses), flux client (plusieurs requêtes, une réponse) et bidirectionnel (deux flux indépendants)."
  - key: eof
    format: course
    question: Comment un client sait-il qu'un flux serveur est terminé ?
    choices:
      - {text: "`Recv` renvoie `io.EOF` quand le serveur a rendu la main sans erreur", correct: true}
      - {text: "`Recv` renvoie un message nil, sans erreur, à la fin du flux", correct: false}
      - {text: "Le serveur envoie un message vide convenu, qui marque la fin", correct: false}
      - {text: "`Recv` renvoie `codes.OK` comme erreur à la fin du flux", correct: false}
    answer: Recv renvoie io.EOF quand le serveur a rendu la main sans erreur ; toute autre erreur est un échec, avec un code gRPC.
  - key: closesend
    format: course
    question: "À quoi sert `CloseSend` dans un flux bidirectionnel ?"
    choices:
      - {text: "Le client annonce qu'il n'enverra plus rien ; le serveur voit `io.EOF` mais peut encore répondre", correct: true}
      - {text: "Le client ferme tout le flux, dans les deux sens, et annule l'appel en cours", correct: false}
      - {text: "Le client ferme la connexion HTTP/2, et tous ses autres appels avec elle", correct: false}
      - {text: "Le client attend que le serveur ait tout reçu avant de pouvoir envoyer la suite", correct: false}
    answer: Le client signale qu'il n'enverra plus de message ; le serveur voit io.EOF sur son Recv, tout en pouvant continuer d'envoyer ses réponses.
  - key: concurrence
    format: course
    question: "Peut-on appeler `Send` depuis plusieurs goroutines sur le même flux ?"
    choices:
      - {text: "Non, pas en même temps : une goroutine dédiée à l'envoi, ou un mutex", correct: true}
      - {text: "Oui : `Send` est sûr entre goroutines, comme une `ClientConn`", correct: false}
      - {text: "Oui, à condition que les messages envoyés soient de même type", correct: false}
      - {text: "Non, et l'on ne peut pas non plus recevoir dans une autre goroutine", correct: false}
    answer: 'Non, pas en même temps : Send n''est pas sûr entre goroutines (Recv non plus). On réserve une goroutine à l''envoi, ou l''on protège par un mutex ; une goroutine qui envoie et une autre qui reçoit, c''est permis.'
  - key: vf-quatre
    format: true-false
    question: 'gRPC propose quatre sortes d''appels : unaire, flux serveur, flux client et bidirectionnel.'
    truth: true
    answer: Déclarées avec le mot-clé stream dans le .proto.
  - key: vf-annulation
    format: true-false
    question: Annuler le contexte côté client ferme le flux et le serveur voit son contexte annulé.
    truth: true
    answer: Le serveur doit surveiller flux.Context().
  - key: vf-closeandrecv
    format: true-false
    question: Dans un flux client, on obtient la réponse unique du serveur avec CloseAndRecv.
    truth: true
    answer: Après avoir envoyé tous les messages.
  - key: vf-ordre
    format: true-false
    question: Les messages d'un même flux peuvent arriver dans le désordre.
    truth: false
    answer: Ils arrivent dans l'ordre d'envoi, sur un même flux HTTP/2.
  - key: qcm-usages
    format: multiple-choice
    question: "Quel type d'appel gRPC est le plus naturel pour suivre en direct les positions d'un colis ?"
    choices:
      - {text: "Un flux serveur", correct: true}
      - {text: "Un flux client", correct: false}
      - {text: "Un appel unaire", correct: false}
      - {text: "Un flux client suivi d'un appel unaire", correct: false}
    answer: "Le client fait une demande, puis le serveur pousse les positions : un flux serveur. Un flux client sert à téléverser des mesures avant un résumé, un flux bidirectionnel à une discussion ; lire un produit reste unaire."
  - key: qcm-serveur
    format: multiple-choice
    question: "Que doit surveiller un serveur qui envoie un flux sans fin ?"
    choices:
      - {text: "`flux.Context().Done()` et l'erreur de `Send`, pour rendre la main quand le client part", correct: true}
      - {text: "Rien : gRPC arrête la méthode de lui-même quand le client se déconnecte", correct: false}
      - {text: "Le nombre de messages envoyés, pour s'arrêter après une limite fixe", correct: false}
      - {text: "Sa mémoire, pour envoyer depuis plusieurs goroutines quand elle baisse", correct: false}
    answer: "Quand le client part, le contexte du flux est annulé et `Send` renvoie une erreur : le serveur doit les surveiller et rendre la main, sinon la goroutine du flux fuit."
  - key: qcm-reprise
    format: multiple-choice
    question: Comment reprendre un flux de notifications coupé par une coupure réseau ?
    choices:
      - {text: "Numéroter les messages, et redemander la suite après le dernier numéro reçu", correct: true}
      - {text: "Rien : gRPC rejoue automatiquement les messages manqués", correct: false}
      - {text: "Recommencer le flux depuis le début, sans rien signaler", correct: false}
      - {text: "Augmenter la taille maximale des messages gRPC", correct: false}
    answer: "La reprise se conçoit dans le protocole de l'application : chaque message porte un numéro de séquence, et le client se reconnecte en demandant la suite. gRPC ne rejoue rien."
  - key: qcm-lent
    format: multiple-choice
    question: Que se passe-t-il quand un client lit un flux serveur trop lentement ?
    choices:
      - {text: "Le contrôle de flux HTTP/2 finit par bloquer les `Send` du serveur", correct: true}
      - {text: "Les messages en trop sont perdus silencieusement par gRPC", correct: false}
      - {text: "Le serveur accélère pour vider sa file plus vite", correct: false}
      - {text: "gRPC ferme le flux avec `ResourceExhausted` au premier retard", correct: false}
    answer: "Quand les tampons du contrôle de flux sont pleins, `Send` bloque et retient la goroutine du serveur : il faut prévoir un délai ou abandonner les clients trop lents."
  - key: scenario-choix
    format: scenario
    question: 'Flux gRPC, WebSocket ou appels répétés : comment choisis-tu pour pousser des mises à jour à un client ?'
    choices:
      - {text: "Un flux serveur gRPC entre services ; SSE ou WebSocket vers un navigateur ; le polling si c'est rare", correct: true}
      - {text: "WebSocket partout, y compris entre services, car c'est le seul transport bidirectionnel", correct: false}
      - {text: "Le polling chaque seconde dans tous les cas, plus simple que n'importe quel flux", correct: false}
      - {text: "Un flux gRPC natif vers le navigateur, qui le gère sans passerelle grâce à HTTP/2", correct: false}
    answer: "Entre services, un flux serveur gRPC est naturel : typé, avec contexte, délais et contrôle de flux. Vers un navigateur, gRPC demande gRPC-Web ou Connect ; les Server-Sent Events suffisent souvent, WebSocket pour un vrai dialogue, le polling pour des mises à jour rares. Dans tous les cas, on prévoit reconnexion et reprise."
  - key: scenario-bidirectionnel
    format: scenario
    question: Comment structures-tu un client de flux bidirectionnel en Go ?
    choices:
      - {text: "Une goroutine qui envoie puis `CloseSend`, la principale qui lit avec `Recv`, sous un même contexte", correct: true}
      - {text: "Une seule goroutine qui alterne `Send` et `Recv`, un message chacun à son tour", correct: false}
      - {text: "Plusieurs goroutines qui appellent `Send` en même temps, pour envoyer plus vite", correct: false}
      - {text: "Deux flux séparés, l'un pour envoyer et l'autre pour recevoir les réponses", correct: false}
    answer: "Une goroutine envoie les messages d'un channel avec `Send`, puis appelle `CloseSend` ; la goroutine principale lit avec `Recv` jusqu'à `io.EOF`. Elles partagent le contexte de l'appel (`errgroup.WithContext` convient), et `Send` comme `Recv` n'ont chacun qu'une goroutine."
  - key: scenario-longs
    format: scenario
    question: Quels problèmes posent les flux gRPC qui restent ouverts des heures, et comment les gères-tu ?
    choices:
      - {text: "Keepalives, reconnexion avec délai croissant et reprise, limite du nombre de flux, `GracefulStop`", correct: true}
      - {text: "Rien de particulier : HTTP/2 garde ses connexions ouvertes pour toujours, sans intervention", correct: false}
      - {text: "Un nouveau flux toutes les secondes, pour qu'aucune coupure ne dure plus longtemps", correct: false}
      - {text: "Des messages plus gros, envoyés moins souvent, pour réduire le nombre de coupures", correct: false}
    answer: "Les répartiteurs et pare-feu coupent les connexions inactives : des keepalives gRPC les gardent vivantes. Après une coupure ou un déploiement, le client se reconnecte avec un délai croissant et reprend après le dernier numéro reçu. Côté serveur, on limite le nombre de flux, on surveille les clients lents, et `GracefulStop` termine les flux proprement."
  - key: scenario-test
    format: scenario
    question: Comment testes-tu un service avec un flux serveur ?
    choices:
      - {text: "Avec bufconn : lire les messages attendus avec `Recv`, puis vérifier `io.EOF`", correct: true}
      - {text: "En lançant le service en production et en observant ses journaux", correct: false}
      - {text: "En appelant `Send` du serveur directement, sans client ni connexion", correct: false}
      - {text: "Avec un `time.Sleep` entre chaque `Recv`, pour laisser le serveur avancer", correct: false}
    answer: "Avec bufconn, le vrai serveur tourne en mémoire et un client de test lit les messages attendus avec `Recv`, puis vérifie `io.EOF`. Un second test annule le contexte au milieu et vérifie que le serveur s'arrête ; les sources de données sont des faux contrôlés par le test."
