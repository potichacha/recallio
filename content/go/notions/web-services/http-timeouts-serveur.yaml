notion: http-timeouts-serveur
cards:
  - key: serveur-defaut-timeouts
    format: course
    question: Le serveur par défaut a-t-il des timeouts ?
    answer: Non ; il faut configurer ReadHeaderTimeout, ReadTimeout, WriteTimeout, IdleTimeout.
  - key: attaque-slowloris
    format: course
    question: C'est quoi une attaque Slowloris ?
    answer: Ouvrir beaucoup de connexions et envoyer les en-têtes très lentement pour épuiser le serveur.
