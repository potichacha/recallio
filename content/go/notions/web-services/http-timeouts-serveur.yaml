notion: http-timeouts-serveur
lesson: "Un `http.Server` créé sans réglage n'a **aucun délai** : un client qui ouvre une connexion et envoie ses en-têtes un\noctet par minute (attaque **Slowloris**) garde une goroutine et un descripteur pour toujours. En production, on fixe\ntoujours les délais :\n\n```go\nsrv := &http.Server{\n\tAddr:              \":8080\",\n\tHandler:           h,\n\tReadHeaderTimeout: 5 * time.Second,   // lire les en-têtes\n\tReadTimeout:       30 * time.Second,  // lire toute la requête, corps compris\n\tWriteTimeout:      30 * time.Second,  // écrire la réponse\n\tIdleTimeout:       120 * time.Second, // garder une connexion keep-alive inactive\n\tMaxHeaderBytes:    1 << 20,\n}\n```\n\nCe que mesure chaque délai :\n- **`ReadHeaderTimeout`** : de l'acceptation de la connexion à la fin des en-têtes ; le plus important contre\n  Slowloris ;\n- **`ReadTimeout`** : jusqu'à la fin du **corps** ; trop court, il coupe les téléversements ;\n- **`WriteTimeout`** : jusqu'à la fin de l'écriture de la réponse, donc il borne aussi le **temps du handler** ;\n  trop court, il coupe les réponses longues (exports, streaming) ;\n- **`IdleTimeout`** : la durée d'inactivité entre deux requêtes d'une connexion keep-alive (s'il vaut zéro, c'est\n  `ReadTimeout` qui s'applique).\n\nQuand un délai est dépassé, la connexion est **coupée** : le client ne reçoit pas de réponse propre. Pour une limite\nmétier (« une requête ne dure pas plus de 10 s »), on ajoute un **contexte** avec délai dans un middleware, ou\n`http.TimeoutHandler` qui répond 503.\n\nPour une route particulière (un téléversement, un flux d'événements), **`http.ResponseController`** (Go 1.20) change\nles échéances de la requête en cours : `rc.SetWriteDeadline(time.Time{})` lève le délai d'écriture.\n\n**En entretien** : « Aucun délai par défaut, d'où Slowloris ; ReadHeaderTimeout surtout, plus Read, Write et Idle ;\nWriteTimeout coupe la connexion, un contexte ou TimeoutHandler donne une réponse propre ; ResponseController pour les\nexceptions par route. »"
cards:
  - key: serveur-defaut-timeouts
    format: course
    question: "Le serveur créé par `http.ListenAndServe` a-t-il des délais ?"
    choices:
      - {text: "Non : il faut configurer `ReadHeaderTimeout`, `ReadTimeout`, `WriteTimeout` et `IdleTimeout`", correct: true}
      - {text: "Oui : 30 secondes pour la lecture et pour l'écriture, comme la plupart des serveurs", correct: false}
      - {text: "Oui : `ReadHeaderTimeout` vaut 5 secondes, et les autres délais sont illimités", correct: false}
      - {text: "Non, et un `http.Server` ne permet pas d'en fixer : il faut un proxy devant", correct: false}
    answer: "Aucun : `http.ListenAndServe` crée un serveur sans délai, vulnérable aux clients lents. On crée un `http.Server` avec `ReadHeaderTimeout`, `ReadTimeout`, `WriteTimeout` et `IdleTimeout`."
  - key: attaque-slowloris
    format: course
    question: "En quoi consiste une attaque Slowloris contre un serveur HTTP ?"
    choices:
      - {text: "Ouvrir beaucoup de connexions et envoyer les en-têtes très lentement", correct: true}
      - {text: "Envoyer des millions de requêtes par seconde depuis de nombreuses machines", correct: false}
      - {text: "Injecter du code dans les en-têtes HTTP pour prendre la main sur le serveur", correct: false}
      - {text: "Envoyer des corps de requête énormes pour saturer la mémoire du serveur", correct: false}
    answer: "Chaque connexion garde des ressources tant qu'elle n'expire pas : en envoyant les en-têtes octet par octet, un seul attaquant épuise le serveur. `ReadHeaderTimeout` coupe ces connexions."
  - key: write
    format: course
    question: Que se passe-t-il quand un handler dépasse le WriteTimeout du serveur ?
    choices:
      - {text: "Les écritures suivantes échouent et la connexion est coupée, sans réponse HTTP", correct: true}
      - {text: "Le serveur répond 503 au client, puis arrête le handler", correct: false}
      - {text: "Le serveur annule le contexte du handler, qui s'arrête aussitôt", correct: false}
      - {text: "Rien : ce délai ne s'applique qu'à la lecture de la requête", correct: false}
    answer: 'Les écritures suivantes échouent et la connexion est coupée : le client voit une erreur réseau, pas une réponse HTTP. Le handler, lui, continue jusqu''au bout s''il ne surveille pas son contexte.'
  - key: responsecontroller
    format: course
    question: Comment allonger le délai d'écriture pour une seule route, par exemple un export de 5 minutes ?
    choices:
      - {text: "Avec `http.NewResponseController(w).SetWriteDeadline(...)`, pour la requête en cours", correct: true}
      - {text: "En modifiant `srv.WriteTimeout` depuis le handler, le temps de l'export", correct: false}
      - {text: "Avec un `context.WithTimeout` de 10 minutes passé au handler", correct: false}
      - {text: "Avec `http.TimeoutHandler`, qui allonge le délai de la route", correct: false}
    answer: Avec `http.NewResponseController(w).SetWriteDeadline(time.Now().Add(10*time.Minute))` (Go 1.20), qui change l'échéance de la requête en cours sans toucher aux autres.
  - key: vf-defaut
    format: true-false
    question: Un http.Server sans réglage coupe les connexions inactives au bout de deux minutes.
    truth: false
    answer: Il n'a aucun délai par défaut.
  - key: vf-readheader
    format: true-false
    question: ReadHeaderTimeout est le délai le plus important contre une attaque Slowloris.
    truth: true
    answer: L'attaque envoie les en-têtes au compte-gouttes.
  - key: vf-idle
    format: true-false
    question: Si IdleTimeout vaut zéro, c'est ReadTimeout qui s'applique aux connexions inactives.
    truth: true
    answer: Et s'il vaut zéro aussi, aucune limite.
  - key: vf-handler
    format: true-false
    question: Quand le WriteTimeout expire, le handler en cours est arrêté de force.
    truth: false
    answer: Il continue ; seules ses écritures échouent. Un contexte avec délai permet de l'arrêter.
  - key: qcm-delais
    format: multiple-choice
    question: "Quel délai protège le serveur contre les connexions qui envoient leurs en-têtes très lentement ?"
    choices:
      - {text: "`ReadHeaderTimeout`", correct: true}
      - {text: "`WriteTimeout`", correct: false}
      - {text: "`IdleTimeout`", correct: false}
      - {text: "Aucun : les valeurs par défaut suffisent", correct: false}
    answer: "`ReadHeaderTimeout` borne la lecture des en-têtes. Un serveur de production fixe aussi `ReadTimeout`, `WriteTimeout` et `IdleTimeout` : les valeurs par défaut sont « aucune limite »."
  - key: qcm-propre
    format: multiple-choice
    question: Comment renvoyer une réponse propre quand une requête dure trop longtemps ?
    choices:
      - {text: "`http.TimeoutHandler`, qui répond 503 après le délai", correct: true}
      - {text: "Un `WriteTimeout` plus court sur le serveur", correct: false}
      - {text: "Un `ReadHeaderTimeout` plus court sur le serveur", correct: false}
      - {text: "Un `IdleTimeout` plus court sur le serveur", correct: false}
    answer: "Le `WriteTimeout` coupe la connexion sans réponse. `http.TimeoutHandler` répond 503 après le délai ; un contexte à délai, posé par un middleware et surveillé par le handler, donne aussi une réponse propre."
  - key: qcm-televersement
    format: multiple-choice
    question: "Des téléversements de gros fichiers échouent au bout de 30 secondes. Quelle est la piste la plus probable ?"
    choices:
      - {text: "Un `ReadTimeout` trop court pour ces routes", correct: true}
      - {text: "Un `ReadHeaderTimeout` trop long", correct: false}
      - {text: "Un `MaxHeaderBytes` trop petit", correct: false}
      - {text: "Un `IdleTimeout` trop court", correct: false}
    answer: "`ReadTimeout` couvre la lecture de toute la requête, corps compris : on l'allonge pour ces routes avec `http.ResponseController` (`SetReadDeadline`), sans relâcher le reste de l'API."
  - key: qcm-slowloris
    format: multiple-choice
    question: Qu'est-ce qu'une attaque Slowloris ?
    choices:
      - {text: "Ouvrir beaucoup de connexions et envoyer les en-têtes très lentement pour épuiser le serveur", correct: true}
      - {text: "Envoyer des millions de requêtes par seconde, depuis des milliers de machines infectées", correct: false}
      - {text: "Injecter du SQL dans les en-têtes HTTP, que le serveur recopie ensuite dans ses requêtes", correct: false}
      - {text: "Usurper le certificat TLS du serveur, pour intercepter les connexions de ses clients", correct: false}
    answer: Chaque connexion garde des ressources tant qu'elle n'expire pas.
  - key: trous-readheader
    format: fill-in
    question: |-
      Complète pour borner la lecture des en-têtes :
      ```go
      srv := &http.Server{
      	Addr:              ":8080",
      	Handler:           h,
      	___: 5 * time.Second,
      }
      ```
    blanks:
      - - ReadHeaderTimeout
    answer: ReadHeaderTimeout.
  - key: trous-idle
    format: fill-in
    question: |-
      Complète pour fermer les connexions keep-alive inactives après deux minutes :
      ```go
      ___: 2 * time.Minute,
      ```
    blanks:
      - - IdleTimeout
    answer: IdleTimeout.
  - key: trous-controller
    format: fill-in
    question: |-
      Complète pour lever le délai d'écriture d'un flux d'événements :
      ```go
      rc := http.___(w)
      rc.SetWriteDeadline(time.Time{})
      ```
    blanks:
      - - NewResponseController
    answer: http.NewResponseController.
  - key: trous-timeouthandler
    format: fill-in
    question: |-
      Complète pour répondre 503 après 10 secondes :
      ```go
      h := http.___(mux, 10*time.Second, "délai dépassé")
      ```
    blanks:
      - - TimeoutHandler
    answer: http.TimeoutHandler.
  - key: bug-aucun
    format: bug-fix
    question: |-
      Sous une attaque, le serveur accumule des dizaines de milliers de connexions qui n'envoient rien. Quelle correction est la bonne ?
      ```go
      log.Fatal(http.ListenAndServe(":8080", h))
      ```
    choices:
      - {text: "Un `http.Server` avec `ReadHeaderTimeout`, `ReadTimeout`, `WriteTimeout` et `IdleTimeout`", correct: true}
      - {text: "Un `http.TimeoutHandler` autour de `h`, qui coupe aussi les clients lents", correct: false}
      - {text: "Un middleware qui refuse les requêtes sans en-tête `User-Agent`", correct: false}
      - {text: "Un `GOMAXPROCS` plus élevé, pour servir plus de connexions à la fois", correct: false}
    answer: "```go\nsrv := &http.Server{\n\tAddr:              \":8080\",\n\tHandler:           h,\n\tReadHeaderTimeout: 5 * time.Second,\n\tReadTimeout:       30 * time.Second,\n\tWriteTimeout:      30 * time.Second,\n\tIdleTimeout:       120 * time.Second,\n}\nlog.Fatal(srv.ListenAndServe())\n```\nhttp.ListenAndServe n'a aucun délai ; un http.Server configuré coupe les clients lents."
  - key: bug-export
    format: bug-fix
    question: |-
      L'export CSV d'un gros client s'interrompt au bout de 30 secondes, avec un fichier tronqué. Quelle correction est la bonne ?
      ```go
      func exporter(w http.ResponseWriter, r *http.Request) {
      	w.Header().Set("Content-Type", "text/csv")
      	ecrireCSV(r.Context(), w)
      }
      ```
    choices:
      - {text: "Allonger l'échéance d'écriture de cette route avec `http.NewResponseController`", correct: true}
      - {text: "Passer le `WriteTimeout` global du serveur à une heure, pour toutes les routes", correct: false}
      - {text: "Écrire le CSV dans une goroutine, détachée de la requête HTTP en cours", correct: false}
      - {text: "Appeler `Flush` après chaque ligne écrite, ce qui repousse le délai d'écriture", correct: false}
    answer: "```go\nfunc exporter(w http.ResponseWriter, r *http.Request) {\n\trc := http.NewResponseController(w)\n\tif err := rc.SetWriteDeadline(time.Now().Add(10 * time.Minute)); err != nil {\n\t\thttp.Error(w, \"export indisponible\", http.StatusInternalServerError)\n\t\treturn\n\t}\n\tw.Header().Set(\"Content-Type\", \"text/csv\")\n\tecrireCSV(r.Context(), w)\n}\n```\nLe WriteTimeout global (30 s) coupait la connexion ; on l'allonge pour cette seule route."
  - key: bug-handler-continue
    format: bug-fix
    question: |-
      Après un dépassement du WriteTimeout, les requêtes lentes continuent de charger la base pendant des minutes. Quelle correction est la bonne ?
      ```go
      func rapport(w http.ResponseWriter, r *http.Request) {
      	lignes := depot.RapportComplet(context.Background())
      	json.NewEncoder(w).Encode(lignes)
      }
      ```
    choices:
      - {text: "Un contexte dérivé de `r.Context()`, un peu plus court que le WriteTimeout", correct: true}
      - {text: "Un `WriteTimeout` plus court, qui arrête aussi le handler en cours", correct: false}
      - {text: "Un `context.Background()` avec un délai d'une heure", correct: false}
      - {text: "Un `recover` dans le handler, pour l'arrêter proprement", correct: false}
    answer: "```go\nfunc rapport(w http.ResponseWriter, r *http.Request) {\n\tctx, cancel := context.WithTimeout(r.Context(), 25*time.Second)\n\tdefer cancel()\n\tlignes, err := depot.RapportComplet(ctx)\n\tif err != nil {\n\t\thttp.Error(w, \"rapport indisponible\", http.StatusServiceUnavailable)\n\t\treturn\n\t}\n\tjson.NewEncoder(w).Encode(lignes)\n}\n```\nLe WriteTimeout coupe la connexion mais n'arrête pas le handler ; un contexte dérivé de la requête, un peu plus\ncourt que le WriteTimeout, arrête la requête SQL et permet une réponse propre."
  - key: bug-idle
    format: bug-fix
    question: |-
      Le nombre de connexions ouvertes ne redescend jamais après un pic, alors que le trafic est retombé. Quelle correction est la bonne ?
      ```go
      srv := &http.Server{
      	Addr:              ":8080",
      	Handler:           h,
      	ReadHeaderTimeout: 5 * time.Second,
      }
      ```
    choices:
      - {text: "Ajouter un `IdleTimeout`, qui ferme les connexions keep-alive inactives", correct: true}
      - {text: "Ajouter un `WriteTimeout`, qui ferme les connexions après chaque réponse", correct: false}
      - {text: "Baisser `ReadHeaderTimeout` à une seconde, pour toutes les requêtes", correct: false}
      - {text: "Ajouter `MaxHeaderBytes`, qui limite le nombre de connexions ouvertes", correct: false}
    answer: "```go\nsrv := &http.Server{\n\tAddr:              \":8080\",\n\tHandler:           h,\n\tReadHeaderTimeout: 5 * time.Second,\n\tIdleTimeout:       120 * time.Second,\n}\n```\nSans IdleTimeout (ni ReadTimeout), les connexions keep-alive inactives restaient ouvertes pour toujours."
  - key: scenario-valeurs
    format: scenario
    question: Comment choisis-tu les délais du serveur HTTP de ton API ?
    choices:
      - {text: "`ReadHeaderTimeout` court, lecture et écriture d'après le p99 mesuré, `IdleTimeout` au-dessus du répartiteur", correct: true}
      - {text: "Les mêmes 5 secondes partout, y compris pour les exports et les téléversements les plus longs", correct: false}
      - {text: "Aucun délai côté serveur, puisque le répartiteur de charge applique déjà les siens", correct: false}
      - {text: "Des délais d'une heure partout, pour ne jamais couper une seule requête légitime", correct: false}
    answer: "`ReadHeaderTimeout` court (5 s) dans tous les cas ; `ReadTimeout` et `WriteTimeout` d'après les requêtes normales les plus longues (p99) avec une marge, par exemple 30 s ; `IdleTimeout` vers 60 à 120 s, plus long que celui du répartiteur. Les routes exceptionnelles passent par `ResponseController`, et un délai par requête donne des réponses propres."
  - key: scenario-lb
    format: scenario
    question: Ton répartiteur de charge renvoie des 502 de temps en temps sur des connexions keep-alive. Que vérifies-tu ?
    choices:
      - {text: "Que le délai d'inactivité du répartiteur est plus court que l'`IdleTimeout` du serveur", correct: true}
      - {text: "Que le `WriteTimeout` du serveur est plus long que le délai d'inactivité du répartiteur", correct: false}
      - {text: "Que HTTP/2 est bien activé sur le serveur Go, car le répartiteur l'exige toujours", correct: false}
      - {text: "Que `MaxHeaderBytes` est assez grand pour les en-têtes ajoutés par le répartiteur", correct: false}
    answer: "Si le serveur Go ferme une connexion inactive pendant que le répartiteur la croit ouverte et y envoie une requête, celle-ci échoue en 502. Le délai d'inactivité du répartiteur doit être plus court que l'`IdleTimeout` du serveur ; l'arrêt gracieux doit aussi lui laisser le temps de retirer l'instance."
  - key: scenario-sse
    format: scenario
    question: Comment sers-tu un flux Server-Sent Events qui reste ouvert des heures, avec un WriteTimeout global de 30 s ?
    choices:
      - {text: "`SetWriteDeadline(time.Time{})` dans ce handler, `Flush` après chaque événement, et un battement", correct: true}
      - {text: "Passer le `WriteTimeout` global à zéro, pour toutes les routes de l'API", correct: false}
      - {text: "Rouvrir la connexion toutes les 30 secondes côté client, sans rien changer d'autre", correct: false}
      - {text: "Envoyer tous les événements d'un coup à la fin, pour tenir sous les 30 secondes", correct: false}
    answer: "Dans le handler du flux, `http.NewResponseController(w)` : `SetWriteDeadline(time.Time{})` lève le délai, puis chaque événement est suivi de `rc.Flush()`. La boucle surveille `r.Context().Done()`, et un commentaire périodique empêche les intermédiaires de couper la connexion ; le reste de l'API garde ses délais courts."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi `http.ListenAndServe(\":8080\", mux)` n'est pas prêt pour la production. Que réponds-tu ?"
    choices:
      - {text: "Il n'a aucun délai, et sans référence au serveur, pas d'arrêt gracieux possible", correct: true}
      - {text: "Il ne sert qu'une requête à la fois, faute de lancer des goroutines", correct: false}
      - {text: "Il n'accepte pas de `ServeMux` à soi, seulement le mux par défaut", correct: false}
      - {text: "Il n'écoute qu'en HTTPS, ce qui exige des certificats même en local", correct: false}
    answer: "Il crée un serveur sans aucun délai, vulnérable à Slowloris, aux clients lents et aux connexions inactives jamais fermées ; faute de référence au serveur, pas de `Shutdown` non plus. En production, un `http.Server` avec ses quatre délais, arrêté par `Shutdown` à SIGTERM."
