notion: grpc-erreurs-intercepteurs
lesson: "**Les erreurs** : un serveur gRPC renvoie une erreur construite avec un **code** standard, que le client lit :\n\n```go\nreturn nil, status.Error(codes.NotFound, \"commande introuvable\")\nreturn nil, status.Errorf(codes.InvalidArgument, \"quantité %d invalide\", q)\n\n// côté client\nif status.Code(err) == codes.NotFound { ... }\nst, ok := status.FromError(err) // code, message et détails\n```\n\nLes codes les plus utiles : `InvalidArgument`, `NotFound`, `AlreadyExists`, `PermissionDenied`, `Unauthenticated`,\n`FailedPrecondition`, `ResourceExhausted` (quota), `DeadlineExceeded`, `Canceled`, `Unavailable` (temporaire :\n**réessayable**), `Internal`, `Unimplemented`. Une erreur Go ordinaire renvoyée par un handler devient\n**`Unknown`** : on traduit toujours les erreurs métier en codes, à un seul endroit.\n\n**Les délais** : le contexte du client porte l'échéance, transmise au serveur ; un appel trop long échoue en\n`DeadlineExceeded`, et le serveur voit son contexte annulé.\n\n**Les intercepteurs** sont les middlewares de gRPC, côté serveur ou client :\n\n```go\nfunc journaliser(log *slog.Logger) grpc.UnaryServerInterceptor {\n\treturn func(ctx context.Context, req any, info *grpc.UnaryServerInfo, handler grpc.UnaryHandler) (any, error) {\n\t\tdebut := time.Now()\n\t\tresp, err := handler(ctx, req)\n\t\tlog.Info(\"appel\", \"methode\", info.FullMethod, \"code\", status.Code(err), \"duree\", time.Since(debut))\n\t\treturn resp, err\n\t}\n}\n\nsrv := grpc.NewServer(grpc.ChainUnaryInterceptor(recuperer, journaliser(log), authentifier))\n```\n\nIls servent à l'authentification, la journalisation, les métriques et les traces (OpenTelemetry), la récupération des\npaniques, la validation. Les flux ont leurs propres intercepteurs (`StreamServerInterceptor`).\n\nLes **métadonnées** (`google.golang.org/grpc/metadata`) sont les en-têtes de gRPC : `metadata.AppendToOutgoingContext`\ncôté client, `metadata.FromIncomingContext` côté serveur, par exemple pour un jeton.\n\n**En entretien** : « status.Error avec un code ; une erreur ordinaire devient Unknown ; Unavailable est réessayable ;\nles délais passent par le contexte ; les intercepteurs sont les middlewares, chaînés avec ChainUnaryInterceptor ;\nles métadonnées portent les en-têtes. »"
cards:
  - key: fixer-timeout-appel-grpc
    format: course
    question: "Comment fixer un délai sur un appel gRPC ?"
    choices:
      - {text: "Par une échéance dans le contexte, transmise au serveur", correct: true}
      - {text: "Par l'option `grpc.Timeout` du serveur, pour tous les appels", correct: false}
      - {text: "Par un `time.Sleep` dans un `select` autour de l'appel", correct: false}
      - {text: "Par un champ `timeout` ajouté à chaque message de requête", correct: false}
    answer: "On passe un contexte à échéance (`context.WithTimeout`) à la méthode du client ; gRPC la transmet dans l'en-tête `grpc-timeout`, et le serveur reçoit un contexte qui expire au même moment."
  - key: renvoyer-erreur-grpc
    format: course
    question: "Comment renvoyer une erreur gRPC avec un code précis ?"
    choices:
      - {text: "Avec `status.Error(codes.X, message)`, lue côté client par `status.Code`", correct: true}
      - {text: "Avec `errors.New`, dont gRPC devine le code d'après le message", correct: false}
      - {text: "Avec `fmt.Errorf(\"%w\", codes.X)`, qui enveloppe le code", correct: false}
      - {text: "En renvoyant une réponse vide et un en-tête HTTP de statut", correct: false}
    answer: "`status.Error(codes.NotFound, \"...\")` (ou `status.Errorf`) porte un code et un message ; le client le lit avec `status.Code(err)`. Une erreur ordinaire arrive en `codes.Unknown`."
  - key: code-erreur-temporaire-reessayable
    format: course
    question: "Quel code gRPC signale une erreur temporaire, qu'on peut réessayer ?"
    choices:
      - {text: "`codes.Unavailable`", correct: true}
      - {text: "`codes.Internal`", correct: false}
      - {text: "`codes.InvalidArgument`", correct: false}
      - {text: "`codes.NotFound`", correct: false}
    answer: "`Unavailable` dit que le service est momentanément indisponible : un réessai avec un délai croissant a des chances de réussir. `Internal`, `InvalidArgument` ou `NotFound` ne se corrigent pas en réessayant."
  - key: intercepteur
    format: course
    question: "Qu'est-ce qu'un intercepteur gRPC ?"
    choices:
      - {text: "Un middleware gRPC, unaire ou de flux, côté serveur ou côté client", correct: true}
      - {text: "Un proxy réseau placé devant le serveur, qui lit les messages", correct: false}
      - {text: "Un générateur de code qui ajoute des méthodes au service", correct: false}
      - {text: "Un outil qui capture le trafic gRPC pour le déboguer", correct: false}
    answer: "Un intercepteur enveloppe chaque appel, comme un middleware HTTP : authentification, traces, métriques, récupération des paniques. Il en existe des unaires et des flux, côté serveur et côté client."
  - key: servent-metadonnees
    format: course
    question: "À quoi servent les métadonnées gRPC ?"
    choices:
      - {text: "À transmettre des informations comme des en-têtes HTTP : jeton, trace, identifiant", correct: true}
      - {text: "À décrire les messages et les services, comme le fait le fichier `.proto`", correct: false}
      - {text: "À stocker l'état du serveur entre deux appels d'un même client", correct: false}
      - {text: "À compresser les messages Protobuf avant leur envoi sur le réseau", correct: false}
    answer: "Les métadonnées sont des paires clé-valeur envoyées avec l'appel, comme des en-têtes HTTP : jeton d'authentification, contexte de trace, identifiant de requête. On les lit côté serveur avec `metadata.FromIncomingContext`."
  - key: taille-maximale-message-recu-defaut
    format: course
    question: "Quelle est, par défaut, la taille maximale d'un message reçu par un serveur gRPC-Go ?"
    choices:
      - {text: "4 Mo", correct: true}
      - {text: "64 Ko", correct: false}
      - {text: "1 Go", correct: false}
      - {text: "Aucune limite", correct: false}
    answer: "4 Mo par défaut ; au-delà, l'appel échoue avec `ResourceExhausted`. `grpc.MaxRecvMsgSize` la relève, mais un gros volume passe mieux par un flux de morceaux."
  - key: vf-unknown
    format: true-false
    question: Un handler gRPC qui renvoie `errors.New("introuvable")` produit le code NotFound côté client.
    truth: false
    answer: Une erreur ordinaire devient Unknown ; il faut status.Error(codes.NotFound, ...).
  - key: vf-unavailable
    format: true-false
    question: Le code Unavailable signale en général une erreur temporaire qu'on peut réessayer.
    truth: true
    answer: Avec un délai croissant et pour des appels idempotents.
  - key: vf-chain
    format: true-false
    question: '`grpc.ChainUnaryInterceptor` permet d''enchaîner plusieurs intercepteurs unaires.'
    truth: true
    answer: Ils s'exécutent dans l'ordre donné.
  - key: vf-flux
    format: true-false
    question: Un intercepteur unaire s'applique aussi aux méthodes de flux.
    truth: false
    answer: Les flux ont leurs propres intercepteurs (StreamServerInterceptor).
  - key: qcm-codes
    format: multiple-choice
    question: "Un jeton d'authentification est absent ou invalide. Quel code gRPC renvoies-tu ?"
    choices:
      - {text: "`codes.Unauthenticated`", correct: true}
      - {text: "`codes.PermissionDenied`", correct: false}
      - {text: "`codes.InvalidArgument`", correct: false}
      - {text: "`codes.NotFound`", correct: false}
    answer: "`Unauthenticated` dit que l'identité manque ou est invalide ; `PermissionDenied`, que l'appelant est identifié mais n'a pas le droit. Un champ manquant donne `InvalidArgument`, un quota épuisé `ResourceExhausted`."
  - key: qcm-intercepteurs
    format: multiple-choice
    question: "Laquelle de ces tâches n'a pas sa place dans un intercepteur gRPC ?"
    choices:
      - {text: "Le calcul métier de la méthode", correct: true}
      - {text: "L'authentification de chaque appel", correct: false}
      - {text: "Les métriques et les traces", correct: false}
      - {text: "La récupération des paniques", correct: false}
    answer: "Les intercepteurs portent ce qui est commun à tous les appels : authentification, métriques, traces, récupération des paniques. Le métier reste dans l'implémentation du service."
  - key: qcm-metadonnees
    format: multiple-choice
    question: "Lesquelles de ces lignes servent à transmettre un jeton d'authentification dans un appel gRPC ?"
    choices:
      - text: '`metadata.AppendToOutgoingContext(ctx, "authorization", "Bearer "+jeton)` côté client'
        correct: true
      - text: '`metadata.FromIncomingContext(ctx)` côté serveur, dans un intercepteur'
        correct: true
      - text: Un champ jeton dans chaque message de requête
        correct: false
      - text: Une variable globale partagée
        correct: false
    answer: Les identifiants par appel (PerRPCCredentials) automatisent l'envoi côté client.
  - key: qcm-lire-code
    format: multiple-choice
    question: Comment le client lit-il le code d'une erreur gRPC ?
    choices:
      - {text: "`status.Code(err)`", correct: true}
      - {text: "`err.Error() == \"NotFound\"`", correct: false}
      - {text: "`errors.Is(err, codes.NotFound)`", correct: false}
      - {text: "`err.(codes.Code)`", correct: false}
    answer: "`status.Code(err)` (ou `status.FromError(err)` puis `Code()`) extrait le code. `codes.NotFound` n'est pas une erreur, et le texte de l'erreur contient aussi le message."
  - key: bug-unknown
    format: bug-fix
    question: |-
      Les clients reçoivent « Unknown » pour un produit inexistant et réessaient en boucle. Quelle correction est la bonne ?
      ```go
      func (s *serveur) LireProduit(ctx context.Context, req *pb.LireProduitRequete) (*pb.Produit, error) {
      	p, err := s.depot.Trouver(ctx, req.GetId())
      	if err != nil {
      		return nil, err
      	}
      	return versProto(p), nil
      }
      ```
    choices:
      - {text: "Traduire `ErrIntrouvable` en `codes.NotFound`, et les autres erreurs en `codes.Internal`", correct: true}
      - {text: "Renvoyer `nil, nil` pour un produit inexistant, que le client saura interpréter", correct: false}
      - {text: "Envelopper l'erreur avec `fmt.Errorf(\"lecture : %w\", err)` pour garder son type", correct: false}
      - {text: "Renvoyer `codes.Unavailable` pour toutes les erreurs du dépôt, sans distinction", correct: false}
    answer: "```go\nfunc (s *serveur) LireProduit(ctx context.Context, req *pb.LireProduitRequete) (*pb.Produit, error) {\n\tp, err := s.depot.Trouver(ctx, req.GetId())\n\tswitch {\n\tcase errors.Is(err, ErrIntrouvable):\n\t\treturn nil, status.Error(codes.NotFound, \"produit introuvable\")\n\tcase err != nil:\n\t\ts.log.ErrorContext(ctx, \"lecture du produit\", \"err\", err)\n\t\treturn nil, status.Error(codes.Internal, \"erreur interne\")\n\t}\n\treturn versProto(p), nil\n}\n```\nUne erreur ordinaire devenait Unknown ; on la traduit en code précis, sans exposer le détail interne."
  - key: bug-sans-delai
    format: bug-fix
    question: |-
      Quand le service de stock ralentit, toutes les requêtes s'empilent. Quelle correction est la bonne ?
      ```go
      stock, err := s.stock.Disponible(context.Background(), &pb.StockRequete{ProduitId: id})
      ```
    choices:
      - {text: "Un contexte dérivé de la requête, avec un délai court, passé à l'appel", correct: true}
      - {text: "Un `context.Background()` neuf à chaque appel, pour ne pas en hériter", correct: false}
      - {text: "Une nouvelle `ClientConn` vers le stock pour chaque requête entrante", correct: false}
      - {text: "Une goroutine par appel au stock, dont on n'attend pas le résultat", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(ctx, 300*time.Millisecond)\ndefer cancel()\nstock, err := s.stock.Disponible(ctx, &pb.StockRequete{ProduitId: id})\nif status.Code(err) == codes.DeadlineExceeded {\n\treturn nil, status.Error(codes.Unavailable, \"stock indisponible\")\n}\n```\nL'appel n'avait ni délai ni annulation ; un contexte dérivé de la requête, avec un délai court, le borne, et le\nserveur de stock voit la même échéance."
  - key: bug-reessai
    format: bug-fix
    question: |-
      Le client réessaie aussi les erreurs InvalidArgument, et multiplie la charge pour rien. Quelle correction est la bonne ?
      ```go
      for essai := 0; essai < 5; essai++ {
      	resp, err = client.Creer(ctx, req)
      	if err == nil {
      		break
      	}
      	time.Sleep(time.Second)
      }
      ```
    choices:
      - {text: "Ne réessayer que `codes.Unavailable`, avec un délai croissant et le contexte", correct: true}
      - {text: "Passer à dix essais, avec une pause de cinq secondes entre chacun", correct: false}
      - {text: "Réessayer toutes les erreurs, mais sans `time.Sleep` entre les essais", correct: false}
      - {text: "Réessayer seulement `codes.InvalidArgument`, l'erreur la plus courante", correct: false}
    answer: "```go\ndelai := 100 * time.Millisecond\nfor essai := 0; essai < 5; essai++ {\n\tresp, err = client.Creer(ctx, req)\n\tif status.Code(err) != codes.Unavailable {\n\t\tbreak // succès, ou erreur qu'un réessai ne corrigera pas\n\t}\n\tselect {\n\tcase <-time.After(delai):\n\t\tdelai *= 2\n\tcase <-ctx.Done():\n\t\treturn nil, ctx.Err()\n\t}\n}\n```\nOn ne réessaie que les erreurs temporaires, avec un délai croissant et en respectant le contexte. (La politique de\nréessai de la configuration de service gRPC peut le faire automatiquement.)"
  - key: bug-panique
    format: bug-fix
    question: Une panique dans une méthode gRPC fait tomber tout le serveur. Que proposes-tu ?
    choices:
      - {text: "Un intercepteur placé en premier, qui récupère la panique et renvoie `codes.Internal`", correct: true}
      - {text: "Rien : comme `net/http`, gRPC récupère déjà les paniques de chaque appel", correct: false}
      - {text: "Un `recover` dans `main`, autour de l'appel à `srv.Serve`", correct: false}
      - {text: "Laisser l'orchestrateur redémarrer le serveur, sans rien changer au code", correct: false}
    answer: "```go\nfunc recuperer(ctx context.Context, req any, info *grpc.UnaryServerInfo, handler grpc.UnaryHandler) (resp any, err error) {\n\tdefer func() {\n\t\tif v := recover(); v != nil {\n\t\t\tslog.ErrorContext(ctx, \"panique\", \"methode\", info.FullMethod, \"valeur\", v, \"pile\", string(debug.Stack()))\n\t\t\terr = status.Error(codes.Internal, \"erreur interne\")\n\t\t}\n\t}()\n\treturn handler(ctx, req)\n}\n\nsrv := grpc.NewServer(grpc.ChainUnaryInterceptor(recuperer, journaliser, authentifier))\n```\nContrairement à net/http, gRPC ne récupère pas les paniques : un intercepteur placé en premier les convertit en\nInternal."
  - key: scenario-erreurs
    format: scenario
    question: Comment organises-tu la traduction des erreurs dans un service gRPC ?
    choices:
      - {text: "Une fonction `versStatus(err)` avec `errors.Is` et `errors.As`, et `Internal` pour le reste", correct: true}
      - {text: "Renvoyer les erreurs du métier telles quelles, que gRPC traduit seul en codes", correct: false}
      - {text: "Mettre le message de l'erreur dans un champ de chaque réponse, sans code", correct: false}
      - {text: "Utiliser `codes.Unknown` pour tout, en laissant le client décider du sens", correct: false}
    answer: "Le métier renvoie des erreurs sentinelles ou typées ; `versStatus(err)` les traduit (NotFound, InvalidArgument avec des détails `errdetails.BadRequest`, FailedPrecondition...), et tout le reste devient Internal après journalisation. Côté client, on ne réessaie que Unavailable, et parfois DeadlineExceeded pour un appel idempotent."
  - key: scenario-intercepteurs
    format: scenario
    question: Quels intercepteurs mets-tu sur un serveur gRPC de production, et dans quel ordre ?
    choices:
      - {text: "Récupération des paniques d'abord, puis traces et métriques, journaux, authentification, débit, validation", correct: true}
      - {text: "Authentification d'abord, puis le reste, et la récupération des paniques en tout dernier", correct: false}
      - {text: "Un seul intercepteur qui fait tout, dans l'ordre que chaque méthode préfère", correct: false}
      - {text: "Validation des requêtes d'abord, avant même de savoir qui appelle le service", correct: false}
    answer: "La récupération des paniques en premier, pour couvrir tous les autres ; puis traces et métriques (OpenTelemetry), journalisation, authentification (jeton lu dans les métadonnées), limitation de débit et validation. Les mêmes en version flux ; côté client, la politique de réessai va dans la configuration du service."
  - key: scenario-deadline-propagation
    format: scenario
    question: Le service A appelle B, qui appelle C. Comment les délais se propagent-ils en gRPC ?
    choices:
      - {text: "gRPC transmet l'échéance de A à B, et B la passe à C : quand A abandonne, toute la chaîne s'arrête", correct: true}
      - {text: "Chaque service fixe son propre délai, sans rapport avec celui de l'appelant qui l'a précédé", correct: false}
      - {text: "B reçoit un délai doublé, pour avoir le temps d'appeler C avant l'expiration", correct: false}
      - {text: "Les délais ne se propagent pas en gRPC : il faut les recopier dans chaque message", correct: false}
    answer: "A appelle B avec une échéance ; gRPC la transmet (en-tête `grpc-timeout`), et B reçoit un contexte qui expire au même moment. Si B passe ce contexte à C, l'échéance suit la chaîne ; B peut la raccourcir, jamais l'allonger."
  - key: scenario-quota
    format: scenario
    question: Ton serveur gRPC doit limiter chaque client à 100 appels par seconde. Comment fais-tu ?
    choices:
      - {text: "Un intercepteur qui identifie le client et consulte son `rate.Limiter`, puis `ResourceExhausted`", correct: true}
      - {text: "Un `time.Sleep` de 10 ms dans chaque méthode, pour plafonner le débit de tous", correct: false}
      - {text: "Un `MaxConcurrentStreams` à 100 sur le serveur, valable pour tous les clients", correct: false}
      - {text: "Un compteur global sans identification, remis à zéro à chaque seconde", correct: false}
    answer: "Un intercepteur identifie le client (jeton ou certificat, dans les métadonnées) et consulte son `rate.Limiter` dans une map protégée ; au-delà, `codes.ResourceExhausted`, que le client sait ne pas réessayer aussitôt. Avec plusieurs instances, le compteur passe par Redis ou par la passerelle."
