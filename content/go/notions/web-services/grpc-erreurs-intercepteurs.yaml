notion: grpc-erreurs-intercepteurs
cards:
  - key: fixer-timeout-appel-grpc
    format: course
    question: Comment fixer un timeout sur un appel gRPC ?
    answer: Par une deadline dans le contexte, propagée au serveur.
  - key: renvoyer-erreur-grpc
    format: course
    question: Comment renvoyer une erreur gRPC ?
    answer: status.Error(codes.X, message), lue côté client par status.Code.
  - key: code-erreur-temporaire-reessayable
    format: course
    question: Quel code pour une erreur temporaire réessayable ?
    answer: Unavailable.
  - key: intercepteur
    format: course
    question: C'est quoi un intercepteur ?
    answer: Un middleware gRPC (unaire ou streaming, serveur ou client).
  - key: servent-metadonnees
    format: course
    question: À quoi servent les métadonnées ?
    answer: À transmettre des informations comme les en-têtes HTTP (auth, trace, request ID).
  - key: taille-maximale-message-recu-defaut
    format: course
    question: Quelle est la taille maximale de message reçu par défaut ?
    answer: 4 Mo.
