notion: http-handlers
cards:
  - key: interface-implemente-handler-http
    format: course
    question: Quelle interface implémente un handler HTTP ?
    answer: http.Handler, avec ServeHTTP(ResponseWriter, *Request).
  - key: interface-implemente-handler
    format: course
    question: Quelle interface implémente un handler ?
    answer: http.Handler, avec ServeHTTP(ResponseWriter, *Request).
  - key: handlers-executent-ils-parallele
    format: course
    question: Les handlers s'exécutent-ils en parallèle ?
    answer: 'Oui, une goroutine par requête : ils doivent être sûrs en concurrence.'
  - key: streaming-reponse
    format: course
    question: Comment faire du streaming de réponse ?
    answer: Écrire puis Flush, via http.ResponseController ou l'interface http.Flusher.
  - key: http-2-supporte-nativement
    format: course
    question: HTTP/2 est-il supporté nativement ?
    answer: Oui, négocié automatiquement en TLS ; h2c via Protocols (Go 1.24).
  - key: http-3-bibliotheque-standard
    format: course
    question: HTTP/3 est-il dans la bibliothèque standard ?
    answer: Non, on utilise quic-go.
