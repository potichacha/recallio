notion: http-handlers
lesson: "Le package **`net/http`** suffit pour écrire un serveur web de production. Tout repose sur une interface :\n\n```go\ntype Handler interface {\n\tServeHTTP(w http.ResponseWriter, r *http.Request)\n}\n```\n\nLe plus souvent, on écrit une simple fonction, convertie en Handler par **`http.HandlerFunc`** :\n\n```go\nfunc bonjour(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Set(\"Content-Type\", \"text/plain; charset=utf-8\")\n\tw.WriteHeader(http.StatusOK)          // facultatif : 200 par défaut au premier Write\n\tfmt.Fprintf(w, \"Bonjour %s\\n\", r.URL.Query().Get(\"nom\"))\n}\n\nfunc main() {\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /bonjour\", bonjour)\n\tsrv := &http.Server{Addr: \":8080\", Handler: mux, ReadHeaderTimeout: 5 * time.Second}\n\tlog.Fatal(srv.ListenAndServe())\n}\n```\n\nL'**ordre** d'écriture de la réponse compte :\n1. les **en-têtes** (`w.Header().Set(...)`) ;\n2. le **statut** (`w.WriteHeader(code)`) ;\n3. le **corps** (`w.Write`, `fmt.Fprint`, `json.NewEncoder(w).Encode`).\n\nAprès le premier `Write`, le statut (200 par défaut) et les en-têtes sont **envoyés** : un `WriteHeader` ou un\n`Header().Set` ultérieur est ignoré (avec un avertissement « superfluous WriteHeader call »).\n\nCe qu'il faut savoir :\n- chaque requête est servie dans **sa propre goroutine** : les handlers s'exécutent en parallèle, et tout état\n  partagé doit être protégé ;\n- `http.Error(w, msg, code)` écrit une réponse d'erreur en texte ;\n- un handler qui renvoie une erreur doit **`return`** juste après l'avoir écrite ;\n- **`net/http/httptest`** teste un handler sans réseau : `httptest.NewRecorder()` et `httptest.NewRequest`.\n- HTTP/2 est pris en charge automatiquement en TLS.\n\n**En entretien** : « Handler et HandlerFunc ; en-têtes, statut, puis corps ; une goroutine par requête ; return après\nhttp.Error ; httptest pour tester. »"
tour:
  - title: Un serveur HTTP
    text: |-
      Un serveur HTTP tient en quelques lignes. Un **handler** est une valeur qui a une méthode
      `ServeHTTP(w http.ResponseWriter, r *http.Request)` ; `http.HandlerFunc` transforme une simple fonction en
      handler, et `http.ListenAndServe(":8080", handler)` écoute le réseau.

      Le bac à sable du Tour n'a pas de réseau : on appelle donc le handler directement, avec le package `httptest`,
      comme dans un test. `httptest.NewRecorder()` joue le rôle du `ResponseWriter`, et garde la réponse.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"net/http"
          	"net/http/httptest"
          )

          func bonjour(w http.ResponseWriter, r *http.Request) {
          	nom := r.URL.Query().Get("nom")
          	if nom == "" {
          		nom = "inconnu"
          	}
          	w.Header().Set("Content-Type", "text/plain; charset=utf-8")
          	fmt.Fprintf(w, "Bonjour, %s !", nom)
          }

          func main() {
          	handler := http.HandlerFunc(bonjour)
          	// Dans un vrai programme : http.ListenAndServe(":8080", handler)
          	rec := httptest.NewRecorder()
          	handler.ServeHTTP(rec, httptest.NewRequest("GET", "/?nom=Ada", nil))
          	fmt.Println(rec.Code, rec.Body.String())
          	fmt.Println(rec.Header().Get("Content-Type"))
          }
      output: |-
        200 Bonjour, Ada !
        text/plain; charset=utf-8
cards:
  - key: interface-implemente-handler-http
    format: course
    question: "Quelle interface un handler HTTP implémente-t-il en Go ?"
    choices:
      - {text: "`http.Handler`, avec `ServeHTTP(http.ResponseWriter, *http.Request)`", correct: true}
      - {text: "`http.Servlet`, avec `Service(http.Request, http.Response)`", correct: false}
      - {text: "`http.HandlerFunc`, avec `Handle(*http.Request) http.Response`", correct: false}
      - {text: "`http.Router`, avec `Route(string, http.Handler)`", correct: false}
    answer: "`http.Handler` n'a qu'une méthode, `ServeHTTP(w, r)`. `http.HandlerFunc` est un type fonction qui l'implémente ; les servlets, c'est Java."
  - key: interface-implemente-handler
    format: course
    question: "Quelle méthode faut-il écrire pour qu'un type soit un `http.Handler` ?"
    choices:
      - {text: "`ServeHTTP(w http.ResponseWriter, r *http.Request)`", correct: true}
      - {text: "`Handle(r *http.Request) (*http.Response, error)`", correct: false}
      - {text: "`ServeHTTP(r *http.Request) http.ResponseWriter`", correct: false}
      - {text: "`HandleFunc(pattern string, f func())`", correct: false}
    answer: "Une seule méthode, `ServeHTTP(w http.ResponseWriter, r *http.Request)`, sans valeur de retour : la réponse s'écrit dans `w`. `HandleFunc` est une méthode du `ServeMux`."
  - key: handlers-executent-ils-parallele
    format: course
    question: "Les handlers HTTP s'exécutent-ils en parallèle ?"
    choices:
      - {text: "Oui, une goroutine par requête : ils doivent être sûrs en concurrence", correct: true}
      - {text: "Non, le serveur traite les requêtes une par une, dans l'ordre", correct: false}
      - {text: "Non, sauf si l'on appelle `runtime.GOMAXPROCS` au démarrage", correct: false}
      - {text: "Oui, mais Go protège seul les variables partagées par un verrou", correct: false}
    answer: "`net/http` sert chaque requête dans sa propre goroutine : un état partagé (map, compteur) doit être protégé par un mutex ou des opérations atomiques."
  - key: streaming-reponse
    format: course
    question: "Comment envoyer une réponse HTTP au fil de l'eau (streaming) ?"
    choices:
      - {text: "Écrire, puis `Flush` via `http.ResponseController` ou `http.Flusher`", correct: true}
      - {text: "Écrire tout le corps, puis appeler `WriteHeader` à la fin", correct: false}
      - {text: "Appeler `w.Write` dans une goroutine lancée par le handler", correct: false}
      - {text: "Fixer l'en-tête `Content-Length` à zéro avant d'écrire", correct: false}
    answer: "Les écritures passent par un tampon ; `Flush` (via `http.NewResponseController(w).Flush()` ou l'interface `http.Flusher`) envoie ce qui est écrit sans attendre la fin du handler."
  - key: http-2-supporte-nativement
    format: course
    question: "HTTP/2 est-il pris en charge nativement par `net/http` ?"
    choices:
      - {text: "Oui, négocié automatiquement en TLS ; h2c via `Protocols` (Go 1.24)", correct: true}
      - {text: "Non, il faut toujours le paquet `golang.org/x/net/http2`", correct: false}
      - {text: "Oui, mais seulement côté client, jamais côté serveur", correct: false}
      - {text: "Oui, mais seulement en clair, sans TLS", correct: false}
    answer: "Oui : client et serveur négocient HTTP/2 automatiquement en TLS (ALPN). Depuis Go 1.24, le champ `Protocols` active aussi HTTP/2 en clair (h2c), sans `x/net/http2`."
  - key: http-3-bibliotheque-standard
    format: course
    question: "HTTP/3 est-il dans la bibliothèque standard de Go ?"
    choices:
      - {text: "Non : on passe par une bibliothèque comme quic-go", correct: true}
      - {text: "Oui, activé par défaut depuis Go 1.21", correct: false}
      - {text: "Oui, avec `http.Server{Protocols: HTTP3}`", correct: false}
      - {text: "Non, et aucun projet Go ne le met en œuvre", correct: false}
    answer: "Non : la bibliothèque standard s'arrête à HTTP/2. Pour HTTP/3, sur QUIC, on utilise une bibliothèque comme quic-go."
  - key: vf-goroutine
    format: true-false
    question: Chaque requête HTTP est servie dans sa propre goroutine.
    truth: true
    answer: Les handlers s'exécutent en parallèle.
  - key: vf-statut-apres
    format: true-false
    question: On peut appeler WriteHeader après avoir écrit le corps pour changer le statut.
    truth: false
    answer: Le premier Write envoie déjà le statut (200 par défaut).
  - key: vf-defaut
    format: true-false
    question: Sans appel à WriteHeader, le statut d'une réponse est 200.
    truth: true
    answer: Il est envoyé au premier Write.
  - key: vf-handlerfunc
    format: true-false
    question: '`http.HandlerFunc` est un type qui permet d''utiliser une fonction ordinaire comme Handler.'
    truth: true
    answer: Sa méthode ServeHTTP appelle la fonction.
  - key: qcm-ordre
    format: multiple-choice
    question: Dans quel ordre écrire une réponse ?
    choices:
      - text: En-têtes, puis statut, puis corps
        correct: true
      - text: Corps, puis statut, puis en-têtes
        correct: false
      - text: Statut, puis corps, puis en-têtes
        correct: false
      - text: L'ordre n'a pas d'importance
        correct: false
    answer: Le statut et les en-têtes partent avant le premier octet du corps.
  - key: qcm-tester
    format: multiple-choice
    question: Comment tester un handler sans démarrer de serveur ?
    choices:
      - {text: "Avec `httptest.NewRecorder()` comme `ResponseWriter`, et `httptest.NewRequest`", correct: true}
      - {text: "Avec `http.Get` sur le serveur de production", correct: false}
      - {text: "Avec `httptest.NewServer`, qui n'ouvre aucun port", correct: false}
      - {text: "Avec `http.ListenAndServe` dans une goroutine du test", correct: false}
    answer: "On appelle `ServeHTTP` avec un `httptest.NewRecorder()`, qui garde statut, en-têtes et corps, et une requête de `httptest.NewRequest`. `httptest.NewServer` démarre un vrai serveur local, utile pour tester un client."
  - key: qcm-partage
    format: multiple-choice
    question: Un handler incrémente un compteur global de visites. Que faut-il ?
    choices:
      - text: Un atomic.Int64 ou un mutex
        correct: true
      - text: Rien, les requêtes sont servies une par une
        correct: false
      - text: Une variable locale au handler
        correct: false
      - text: Un channel non bufferisé par requête
        correct: false
    answer: Les handlers s'exécutent en parallèle.
  - key: qcm-erreur
    format: multiple-choice
    question: Que faire après `http.Error(w, "introuvable", http.StatusNotFound)` dans un handler ?
    choices:
      - text: '`return` immédiatement'
        correct: true
      - text: Continuer et écrire la réponse normale
        correct: false
      - text: Appeler WriteHeader(200)
        correct: false
      - text: Paniquer
        correct: false
    answer: Sinon le corps normal s'ajoute à l'erreur.
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature d'un handler :
      ```go
      func lister(w http.___, r *http.Request) {
      ```
    blanks:
      - - ResponseWriter
    answer: http.ResponseWriter.
  - key: trous-handlefunc
    format: fill-in
    question: |-
      Complète l'enregistrement :
      ```go
      mux := http.NewServeMux()
      mux.___("GET /sante", sante)
      ```
    blanks:
      - - HandleFunc
    answer: HandleFunc prend une fonction.
  - key: trous-writeheader
    format: fill-in
    question: |-
      Complète pour répondre 201 :
      ```go
      w.Header().Set("Location", "/commandes/"+id)
      w.___(http.StatusCreated)
      ```
    blanks:
      - - WriteHeader
    answer: WriteHeader, après les en-têtes.
  - key: trous-recorder
    format: fill-in
    question: |-
      Complète le test :
      ```go
      rec := httptest.___()
      h.ServeHTTP(rec, httptest.NewRequest("GET", "/sante", nil))
      if rec.Code != 200 {
      ```
    blanks:
      - - NewRecorder
    answer: httptest.NewRecorder.
  - key: code-recorder
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	fmt.Fprintf(w, "bonjour %s", r.URL.Query().Get("nom"))
      })
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, httptest.NewRequest("GET", "/?nom=Ada", nil))
      fmt.Println(rec.Code, rec.Body.String())
      ```
    choices:
      - {text: "`200 bonjour Ada`", correct: true}
      - {text: "`0 bonjour Ada`", correct: false}
      - {text: "`200 bonjour nom=Ada`", correct: false}
      - {text: "`404 bonjour Ada`", correct: false}
    answer: '`200 bonjour Ada` : sans WriteHeader, le statut est 200.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n)\n\nfunc main() {\n\th := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tfmt.Fprintf(w, \"bonjour %s\", r.URL.Query().Get(\"nom\"))\n\t})\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/?nom=Ada\", nil))\n\tfmt.Println(rec.Code, rec.Body.String())\n}\n"
      output: 200 bonjour Ada
  - key: code-tard
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	w.Write([]byte("ok"))
      	w.WriteHeader(http.StatusNotFound)
      })
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, httptest.NewRequest("GET", "/", nil))
      fmt.Println(rec.Code)
      ```
    choices:
      - {text: "`200`", correct: true}
      - {text: "`404`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`500`", correct: false}
    answer: '`200` : le premier Write a déjà envoyé le statut ; le WriteHeader suivant est ignoré.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n)\n\nfunc main() {\n\th := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tw.Write([]byte(\"ok\"))\n\t\tw.WriteHeader(http.StatusNotFound)\n\t})\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/\", nil))\n\tfmt.Println(rec.Code)\n}\n"
      output: '200'
  - key: code-entete-tard
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	w.WriteHeader(http.StatusCreated)
      	w.Header().Set("Location", "/commandes/1")
      })
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, httptest.NewRequest("POST", "/commandes", nil))
      res := rec.Result()
      fmt.Printf("%d %q\n", res.StatusCode, res.Header.Get("Location"))
      ```
    choices:
      - {text: "`201 \"\"`", correct: true}
      - {text: "`201 \"/commandes/1\"`", correct: false}
      - {text: "`200 \"/commandes/1\"`", correct: false}
      - {text: "`200 \"\"`", correct: false}
    answer: '`201 ""` : un en-tête ajouté après WriteHeader n''est pas envoyé.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n)\n\nfunc main() {\n\th := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tw.WriteHeader(http.StatusCreated)\n\t\tw.Header().Set(\"Location\", \"/commandes/1\")\n\t})\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, httptest.NewRequest(\"POST\", \"/commandes\", nil))\n\tres := rec.Result()\n\tfmt.Printf(\"%d %q\\n\", res.StatusCode, res.Header.Get(\"Location\"))\n}\n"
      output: 201 ""
  - key: code-error
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      	http.Error(w, "introuvable", http.StatusNotFound)
      })
      rec := httptest.NewRecorder()
      h.ServeHTTP(rec, httptest.NewRequest("GET", "/x", nil))
      fmt.Printf("%d %q %s\n", rec.Code, rec.Body.String(), rec.Header().Get("Content-Type"))
      ```
    choices:
      - {text: "`404 \"introuvable\\n\" text/plain; charset=utf-8`", correct: true}
      - {text: "`404 \"introuvable\" text/plain; charset=utf-8`", correct: false}
      - {text: "`404 \"introuvable\\n\" application/json`", correct: false}
      - {text: "`200 \"introuvable\\n\" text/plain; charset=utf-8`", correct: false}
    answer: '`404 "introuvable\n" text/plain; charset=utf-8` : http.Error ajoute un retour à la ligne et le type texte.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n)\n\nfunc main() {\n\th := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n\t})\n\trec := httptest.NewRecorder()\n\th.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/x\", nil))\n\tfmt.Printf(\"%d %q %s\\n\", rec.Code, rec.Body.String(), rec.Header().Get(\"Content-Type\"))\n}\n"
      output: 404 "introuvable\n" text/plain; charset=utf-8
  - key: bug-return
    format: bug-fix
    question: |-
      Les clients reçoivent un message d'erreur suivi du JSON d'un utilisateur vide. Quelle correction est la bonne ?
      ```go
      u, err := depot.Trouver(r.Context(), id)
      if err != nil {
      	http.Error(w, "introuvable", http.StatusNotFound)
      }
      json.NewEncoder(w).Encode(u)
      ```
    choices:
      - {text: "Ajouter `return` juste après `http.Error`", correct: true}
      - {text: "Appeler `w.WriteHeader(404)` avant `http.Error`", correct: false}
      - {text: "Remplacer `http.Error` par `panic(err)`", correct: false}
      - {text: "Encoder `u` seulement si `u` n'est pas nil", correct: false}
    answer: "```go\nu, err := depot.Trouver(r.Context(), id)\nif err != nil {\n\thttp.Error(w, \"introuvable\", http.StatusNotFound)\n\treturn\n}\njson.NewEncoder(w).Encode(u)\n```\nSans return, le handler continuait après l'erreur."
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le client reçoit du JSON annoncé comme « text/plain », avec un statut 200 au lieu de 201. Quelle correction est la bonne ?
      ```go
      json.NewEncoder(w).Encode(commande)
      w.Header().Set("Content-Type", "application/json")
      w.WriteHeader(http.StatusCreated)
      ```
    choices:
      - {text: "Fixer l'en-tête, puis appeler `WriteHeader`, et encoder le corps en dernier", correct: true}
      - {text: "Appeler `WriteHeader` en premier, puis encoder, puis fixer l'en-tête", correct: false}
      - {text: "Garder l'ordre, mais remplacer `Set` par `Add` pour `Content-Type`", correct: false}
      - {text: "Garder l'ordre, mais appeler `http.NewResponseController(w).Flush()` à la fin", correct: false}
    answer: |-
      ```go
      w.Header().Set("Content-Type", "application/json")
      w.WriteHeader(http.StatusCreated)
      json.NewEncoder(w).Encode(commande)
      ```
      Les en-têtes et le statut partent au premier Write : ils doivent être fixés avant le corps.
  - key: bug-etat
    format: bug-fix
    question: |-
      Le détecteur de courses signale le handler, et le service plante parfois avec « concurrent map writes ». Quelle correction est la bonne ?
      ```go
      var vues = map[string]int{}

      func compter(w http.ResponseWriter, r *http.Request) {
      	vues[r.URL.Path]++
      }
      ```
    choices:
      - {text: "Protéger la map par un `sync.Mutex`, dans un type qui porte cet état", correct: true}
      - {text: "Initialiser la map dans `init()`, avant le démarrage du serveur", correct: false}
      - {text: "Remplacer `map[string]int` par `map[string]*int`", correct: false}
      - {text: "Lancer le serveur avec `GOMAXPROCS=1` pour éviter les courses", correct: false}
    answer: "```go\ntype Compteur struct {\n\tmu   sync.Mutex\n\tvues map[string]int\n}\n\nfunc (c *Compteur) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n\tc.mu.Lock()\n\tc.vues[r.URL.Path]++\n\tc.mu.Unlock()\n}\n```\nLes requêtes sont servies en parallèle : la map partagée est protégée par un mutex (et le handler devient un type\navec son état, au lieu d'une variable globale)."
  - key: bug-listen
    format: bug-fix
    question: |-
      Le serveur accepte des connexions qui n'envoient jamais leurs en-têtes, jusqu'à épuiser les ressources. Quelle correction est la bonne ?
      ```go
      http.ListenAndServe(":8080", mux)
      ```
    choices:
      - {text: "Un `http.Server` avec `ReadHeaderTimeout` et les autres délais", correct: true}
      - {text: "Un `http.TimeoutHandler` autour du mux, sans autre réglage", correct: false}
      - {text: "Un middleware qui vérifie la présence des en-têtes", correct: false}
      - {text: "Un `MaxHeaderBytes` plus petit sur le serveur", correct: false}
    answer: "```go\nsrv := &http.Server{\n\tAddr:              \":8080\",\n\tHandler:           mux,\n\tReadHeaderTimeout: 5 * time.Second,\n\tReadTimeout:       30 * time.Second,\n\tWriteTimeout:      30 * time.Second,\n\tIdleTimeout:       120 * time.Second,\n}\nlog.Fatal(srv.ListenAndServe())\n```\nhttp.ListenAndServe n'a aucun délai ; un http.Server configuré protège contre les clients lents (Slowloris)."
