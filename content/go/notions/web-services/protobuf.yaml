notion: protobuf
cards:
  - key: evoluer-message-protobuf-sans-casse
    format: course
    question: Comment faire évoluer un message Protobuf sans casse ?
    answer: Ajouter des champs avec de nouveaux numéros, ne jamais modifier les existants, réserver les numéros supprimés.
  - key: distinguer-absent-zero-proto3
    format: course
    question: Comment distinguer absent et zéro en proto3 ?
    answer: Avec le mot-clé optional ou des types wrappers.
  - key: sert-buf-breaking
    format: course
    question: À quoi sert buf breaking ?
    answer: À détecter automatiquement les changements incompatibles d'un schéma Protobuf.
  - key: copier-message-protobuf-genere-valeur
    format: course
    question: Peut-on copier un message Protobuf généré par valeur ?
    answer: Non, il contient un état interne ; on manipule des pointeurs.
