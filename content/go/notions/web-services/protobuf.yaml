notion: protobuf
lesson: |-
  **Protocol Buffers** (Protobuf) est un format binaire de sérialisation, décrit par un **schéma** `.proto` à partir
  duquel on **génère** le code Go :

  ```protobuf
  syntax = "proto3";
  package catalogue.v1;
  option go_package = "exemple.fr/gen/catalogue/v1;cataloguev1";

  message Produit {
    string id = 1;
    string nom = 2;
    int64 prix_centimes = 3;
    repeated string tags = 4;
    optional string description = 5; // présence explicite
    reserved 6;                        // ancien champ supprimé : numéro jamais réutilisé
    reserved "ancien_nom";
  }
  ```

  ```
  protoc --go_out=. --go_opt=paths=source_relative catalogue.proto   # ou : buf generate
  ```

  Ce qui compte dans le binaire, ce sont les **numéros** de champ, pas leurs noms. D'où les règles de
  **compatibilité** :
  - on peut **ajouter** un champ avec un nouveau numéro : les anciens lecteurs l'ignorent, les nouveaux voient la
    valeur zéro dans les anciens messages ;
  - on peut **renommer** un champ (le binaire ne change pas, mais le JSON si) ;
  - on ne doit **jamais réutiliser** ni changer le **numéro** ou le **type** d'un champ : on **réserve** les numéros
    supprimés ;
  - les numéros 1 à 15 tiennent sur un octet : on les garde pour les champs fréquents.

  En **proto3**, un champ scalaire absent vaut sa **valeur zéro** : on ne distingue pas « absent » de « 0 », sauf avec
  **`optional`** (qui génère un pointeur et une méthode `HasXxx`) ou les types enveloppes (`google.protobuf.Int64Value`).

  En Go, les messages générés contiennent un état interne : on les manipule par **pointeur** (`*Produit`), on ne les copie
  pas par valeur (go vet le signale), et l'on utilise `proto.Equal` et `proto.Clone`. **`buf`** (lint, `buf breaking`)
  vérifie en CI qu'un changement de schéma reste compatible.

  **En entretien** : « Schéma .proto, code généré, binaire compact identifié par les numéros de champ ; ajouter oui,
  réutiliser un numéro jamais (reserved) ; optional pour la présence ; buf breaking en CI. »
cards:
  - key: evoluer-message-protobuf-sans-casse
    format: course
    question: "Comment faire évoluer un message Protobuf sans casser ses clients ?"
    choices:
      - {text: "Ajouter des champs avec de nouveaux numéros, et réserver les numéros supprimés", correct: true}
      - {text: "Renuméroter les champs dans l'ordre, après chaque suppression", correct: false}
      - {text: "Changer le type d'un champ, tant que son nom reste le même", correct: false}
      - {text: "Réutiliser le numéro d'un champ supprimé pour un nouveau champ", correct: false}
    answer: "Seul le numéro identifie un champ dans l'encodage : on ajoute des champs avec de nouveaux numéros, on ne modifie jamais les existants, et l'on réserve (`reserved`) les numéros et noms supprimés."
  - key: distinguer-absent-zero-proto3
    format: course
    question: "Comment distinguer, en proto3, un champ absent d'un champ à zéro ?"
    choices:
      - {text: "Avec le mot-clé `optional`, ou un type enveloppe", correct: true}
      - {text: "En testant si le champ vaut sa valeur zéro", correct: false}
      - {text: "Avec `required`, qui rend le champ obligatoire", correct: false}
      - {text: "C'est impossible en proto3", correct: false}
    answer: "Sans `optional`, absent et zéro s'encodent pareil. `optional` garde la présence du champ (un pointeur dans le code Go généré), et un type enveloppe comme `google.protobuf.Int64Value` peut être nil. `required` n'existe plus en proto3."
  - key: sert-buf-breaking
    format: course
    question: "À quoi sert `buf breaking` ?"
    choices:
      - {text: "À détecter les changements incompatibles d'un schéma Protobuf", correct: true}
      - {text: "À générer le code Go à partir des fichiers `.proto`", correct: false}
      - {text: "À vérifier le style et les conventions de nommage", correct: false}
      - {text: "À casser volontairement la compatibilité d'une version", correct: false}
    answer: "`buf breaking` compare le schéma à une référence (la branche principale, une version) et signale les changements incompatibles : numéro modifié, type changé, champ supprimé sans réserve. `buf generate` génère le code, `buf lint` vérifie le style."
  - key: copier-message-protobuf-genere-valeur
    format: course
    question: "Peut-on copier par valeur un message Protobuf généré ?"
    choices:
      - {text: "Non : il contient un état interne ; on manipule des pointeurs, et `proto.Clone` pour copier", correct: true}
      - {text: "Oui : c'est une struct ordinaire, sans état caché, qu'on copie comme une autre", correct: false}
      - {text: "Oui, mais seulement pour les messages sans champ répété ni sous-message", correct: false}
      - {text: "Non : le compilateur le refuse, par une erreur de type à chaque affectation", correct: false}
    answer: "Un message généré contient un état interne, marqué pour que `go vet` signale toute copie : on le manipule par pointeur, et l'on copie avec `proto.Clone`."
  - key: vf-numeros
    format: true-false
    question: Dans le format binaire Protobuf, les champs sont identifiés par leur numéro, pas par leur nom.
    truth: true
    answer: C'est pourquoi renommer est sans risque pour le binaire.
  - key: vf-reutiliser
    format: true-false
    question: Après avoir supprimé un champ, on peut réutiliser son numéro pour un nouveau champ.
    truth: false
    answer: D'anciens messages ou clients seraient mal interprétés ; on réserve le numéro.
  - key: vf-ajouter
    format: true-false
    question: Ajouter un champ avec un nouveau numéro reste compatible avec les anciens clients.
    truth: true
    answer: Ils ignorent le champ inconnu.
  - key: vf-copie
    format: true-false
    question: On peut copier un message Protobuf généré par valeur sans risque.
    truth: false
    answer: Il contient un état interne ; on utilise des pointeurs et proto.Clone.
  - key: qcm-compatible
    format: multiple-choice
    question: "Lesquels de ces changements de schéma restent compatibles ?"
    choices:
      - text: Ajouter un champ avec un nouveau numéro
        correct: true
      - text: Supprimer un champ en réservant son numéro
        correct: true
      - text: Changer le type d'un champ de string à int64
        correct: false
      - text: Changer le numéro d'un champ existant
        correct: false
    answer: buf breaking détecte les changements incompatibles.
  - key: qcm-presence
    format: multiple-choice
    question: En proto3, comment savoir si un champ entier a été envoyé à 0 ou absent ?
    choices:
      - {text: "Le déclarer `optional`", correct: true}
      - {text: "Tester si le champ vaut 0", correct: false}
      - {text: "Le déclarer `required`", correct: false}
      - {text: "C'est impossible en proto3", correct: false}
    answer: "Sans `optional`, absent et zéro sont identiques. `optional` (ou un type enveloppe comme `google.protobuf.Int64Value`) garde la présence du champ."
  - key: qcm-avantages
    format: multiple-choice
    question: "Lequel de ces points n'est pas un avantage de Protobuf sur JSON ?"
    choices:
      - {text: "Des messages lisibles directement par un humain", correct: true}
      - {text: "Des messages plus compacts et plus rapides à encoder", correct: false}
      - {text: "Un schéma qui génère du code typé pour plusieurs langages", correct: false}
      - {text: "Des règles d'évolution claires", correct: false}
    answer: "L'encodage binaire n'est pas lisible : on passe par `protojson` ou des outils comme grpcurl. Compacité, code typé généré et règles d'évolution sont ses vrais avantages."
  - key: qcm-outils
    format: multiple-choice
    question: "Quel outil génère le code Go des messages Protobuf ?"
    choices:
      - {text: "`protoc-gen-go`", correct: true}
      - {text: "`buf breaking`", correct: false}
      - {text: "`buf lint`", correct: false}
      - {text: "`go vet`", correct: false}
    answer: "`protoc-gen-go` génère les fichiers `.pb.go`, lancé par `protoc` ou `buf generate`. `buf breaking` détecte les changements incompatibles, `buf lint` vérifie les conventions, `go vet` analyse le code Go."
  - key: scenario-evolution
    format: scenario
    question: Tu dois renommer un champ et en supprimer un autre dans un message utilisé par dix services. Comment procèdes-tu ?
    choices:
      - {text: "Renommer avec prudence ; pour supprimer, `deprecated`, attendre, puis réserver numéro et nom", correct: true}
      - {text: "Supprimer le champ tout de suite, et réutiliser son numéro pour le prochain champ", correct: false}
      - {text: "Renuméroter tous les champs après la suppression, pour garder une suite continue", correct: false}
      - {text: "Créer un nouveau message à chaque changement, et migrer les dix services le même jour", correct: false}
    answer: "Le renommage ne change pas le binaire (seul le numéro compte), mais il change le JSON et le code des clients. Pour la suppression, on marque d'abord le champ `deprecated`, on attend que plus aucun service ne le lise, puis on le supprime en réservant son numéro et son nom ; `buf breaking` vérifie chaque étape en CI."
  - key: scenario-json-ou-proto
    format: scenario
    question: "JSON ou Protobuf pour les échanges entre tes microservices ? Que choisis-tu ?"
    choices:
      - {text: "Protobuf quand volume, latence et contrats multi-langages comptent ; JSON pour les API publiques", correct: true}
      - {text: "JSON partout, car Protobuf ne fonctionne qu'entre services écrits dans le même langage", correct: false}
      - {text: "Protobuf partout, y compris pour les API publiques appelées par des navigateurs", correct: false}
      - {text: "Celui que chaque équipe préfère, sans contrat écrit, pour aller plus vite", correct: false}
    answer: "Protobuf (souvent avec gRPC) quand le volume ou la latence comptent, que plusieurs langages partagent les contrats et qu'on veut des règles d'évolution vérifiées ; JSON pour les API publiques, le débogage facile et les clients web. Dans les deux cas, le contrat est écrit et versionné : OpenAPI ou `.proto`."
  - key: scenario-organisation
    format: scenario
    question: Comment organises-tu les fichiers .proto dans une entreprise avec plusieurs équipes ?
    choices:
      - {text: "Un dépôt de schémas partagés, des paquets versionnés (`catalogue.v1`), `buf lint` et `buf breaking` en CI", correct: true}
      - {text: "Chaque service garde sa propre copie des `.proto`, modifiée librement sans relecture", correct: false}
      - {text: "Un seul fichier `.proto` géant pour toute l'entreprise, sans aucun numéro de version", correct: false}
      - {text: "Des schémas déduits du code Go de chaque service, sans aucun fichier `.proto` écrit", correct: false}
    answer: "Un dépôt (ou dossier) de schémas partagés, avec des paquets versionnés (`catalogue.v1`) relus en pull request ; `buf lint` et `buf breaking` en CI, le code généré par `buf generate`. Une version incompatible devient un nouveau paquet (`v2`), servi en parallèle pendant la migration."
  - key: scenario-numeros
    format: scenario
    question: Pourquoi les numéros de champ 1 à 15 sont-ils précieux ?
    choices:
      - {text: "Leur étiquette tient sur un octet, au-delà sur deux ou plus : à réserver aux champs fréquents", correct: true}
      - {text: "Ce sont les seuls numéros acceptés dans un message de moins de seize champs", correct: false}
      - {text: "Ils sont réservés aux champs obligatoires, que `protoc` vérifie à la compilation", correct: false}
      - {text: "Ils sont encodés en clair, alors que les autres numéros sont compressés à part", correct: false}
    answer: |-
      Dans l'encodage, chaque champ est précédé d'une étiquette qui combine son numéro et son type ; pour les numéros 1 à
      15, elle tient sur un octet, au-delà sur deux ou plus. Sur des messages envoyés des millions de fois, garder 1 à 15
      pour les champs les plus fréquents réduit la taille. Comme un numéro ne change jamais, il faut y penser dès la
      création du message.
  - key: definition-proto
    format: definition
    question: "Que désigne un fichier `.proto` ?"
    choices:
      - {text: "Le schéma qui décrit les messages et les services Protobuf, dont on génère le code", correct: true}
      - {text: "Le code Go généré à partir du schéma, à ne jamais modifier à la main", correct: false}
      - {text: "Un message Protobuf encodé en binaire, stocké sur le disque", correct: false}
      - {text: "La configuration de `buf`, qui liste les greffons à lancer", correct: false}
    answer: "Un fichier `.proto` décrit les messages et les services ; `protoc` ou `buf` en génèrent le code (`.pb.go`). La configuration de buf, c'est `buf.yaml` et `buf.gen.yaml`."
  - key: definition-numero
    format: definition
    question: "Que désigne le numéro d'un champ Protobuf ?"
    choices:
      - {text: "L'identifiant définitif du champ dans l'encodage binaire, jamais réutilisé", correct: true}
      - {text: "La position du champ dans la struct Go générée, modifiable à volonté", correct: false}
      - {text: "Le nombre maximal de valeurs que le champ peut contenir", correct: false}
      - {text: "La version du schéma dans laquelle le champ a été ajouté", correct: false}
    answer: "Dans l'encodage binaire, un champ est identifié par son numéro, pas par son nom : le numéro est définitif, et celui d'un champ supprimé ne doit jamais resservir."
  - key: definition-reserved
    format: definition
    question: "Que fait la déclaration `reserved` dans un message Protobuf ?"
    choices:
      - {text: "Elle interdit de réutiliser le numéro ou le nom d'un champ supprimé", correct: true}
      - {text: "Elle réserve de la place dans le message pour des champs futurs", correct: false}
      - {text: "Elle marque un champ comme obligatoire à l'envoi", correct: false}
      - {text: "Elle rend un champ invisible dans le JSON généré", correct: false}
    answer: "`reserved 3, 7;` ou `reserved \"ancien_nom\";` empêche qu'un futur champ reprenne un numéro ou un nom supprimé : d'anciens clients liraient sinon ses données avec le mauvais sens."
  - key: definition-buf
    format: definition
    question: "Que désigne `buf` dans l'écosystème Protobuf ?"
    choices:
      - {text: "Un outil qui génère le code, vérifie le style et détecte les changements incompatibles", correct: true}
      - {text: "Le paquet Go qui encode et décode les messages Protobuf à l'exécution", correct: false}
      - {text: "Un tampon mémoire réutilisé par gRPC pour sérialiser les messages", correct: false}
      - {text: "Un proxy qui traduit les appels REST/JSON en appels gRPC", correct: false}
    answer: "buf remplace et complète `protoc` : `buf generate` pour le code, `buf lint` pour les conventions, `buf breaking` pour la compatibilité. L'encodage à l'exécution, c'est `google.golang.org/protobuf/proto`."
