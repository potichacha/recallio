notion: arret-gracieux
cards:
  - key: arreter-proprement-sigterm
    format: course
    question: Comment arrêter proprement sur SIGTERM ?
    answer: signal.NotifyContext, puis Shutdown du serveur avec un nouveau contexte à délai.
  - key: ordre-arret-propre
    format: course
    question: Quel ordre pour l'arrêt propre ?
    answer: Arrêter d'accepter du trafic, terminer les requêtes en cours, arrêter les workers, fermer les ressources dans l'ordre inverse de leur création.
  - key: arreter-proprement-serveur-http
    format: course
    question: Comment arrêter proprement un serveur HTTP ?
    answer: srv.Shutdown(ctx), qui attend la fin des requêtes en cours ; ignorer http.ErrServerClosed.
