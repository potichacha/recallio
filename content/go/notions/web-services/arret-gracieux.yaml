notion: arret-gracieux
lesson: "À chaque déploiement, l'orchestrateur envoie **SIGTERM** au processus, puis le tue (SIGKILL) après un délai (30 s par\ndéfaut dans Kubernetes). L'**arrêt gracieux** consiste à finir proprement le travail en cours pendant ce délai :\n\n```go\nfunc main() {\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\n\tsrv := &http.Server{Addr: \":8080\", Handler: h, ReadHeaderTimeout: 5 * time.Second}\n\terreurs := make(chan error, 1)\n\tgo func() { erreurs <- srv.ListenAndServe() }()\n\n\tselect {\n\tcase err := <-erreurs:\n\t\tlog.Fatal(err) // le serveur n'a pas pu démarrer\n\tcase <-ctx.Done(): // signal reçu\n\t}\n\n\tarret, annuler := context.WithTimeout(context.Background(), 20*time.Second)\n\tdefer annuler()\n\tif err := srv.Shutdown(arret); err != nil {\n\t\tlog.Printf(\"arrêt incomplet : %v\", err)\n\t}\n\t// puis fermer la base, vider les files, etc.\n}\n```\n\nCe que fait **`Shutdown(ctx)`** :\n1. il ferme les **écouteurs** : plus de nouvelle connexion ;\n2. il ferme les connexions **inactives** ;\n3. il **attend** que les requêtes en cours finissent, ou que `ctx` expire (il renvoie alors l'erreur du contexte).\n\nLes pièges :\n- `ListenAndServe` renvoie **`http.ErrServerClosed`** dès l'appel à Shutdown : ce n'est pas une erreur, et `main` ne\n  doit **pas** se terminer avant la fin de Shutdown ;\n- Shutdown n'attend **pas** les connexions détournées (WebSocket) ni les goroutines lancées par les handlers :\n  `RegisterOnShutdown` et un WaitGroup s'en chargent ;\n- le délai de Shutdown doit être **inférieur** à celui de l'orchestrateur ;\n- l'ordre : arrêter de recevoir (serveur, consommateurs), finir le travail en cours, **puis** fermer les dépendances\n  (base, connexions sortantes).\n\nDans Kubernetes, on fait aussi échouer la sonde de **disponibilité** (readiness) et l'on attend quelques secondes avant\nShutdown, le temps que l'instance soit retirée du répartiteur de charge.\n\n**En entretien** : « signal.NotifyContext pour SIGTERM ; Shutdown avec un délai : plus de nouvelles connexions, attente\ndes requêtes en cours ; ErrServerClosed n'est pas une erreur ; fermer les dépendances en dernier. »"
cards:
  - key: arreter-proprement-sigterm
    format: course
    question: "Comment arrêter proprement un service Go sur SIGTERM ?"
    choices:
      - {text: "`signal.NotifyContext`, puis `srv.Shutdown` avec un nouveau contexte à délai", correct: true}
      - {text: "`signal.NotifyContext`, puis `os.Exit(0)` dès que le contexte est annulé", correct: false}
      - {text: "Rien à faire : Go termine les requêtes en cours avant de quitter", correct: false}
      - {text: "`srv.Close()` dans un `defer` de `main`, qui attend les requêtes en cours", correct: false}
    answer: "`signal.NotifyContext` donne un contexte annulé par le signal ; on appelle alors `srv.Shutdown` avec un nouveau contexte à délai, car celui du signal est déjà annulé. Par défaut, Go quitte aussitôt sur SIGTERM, et `Close` coupe les connexions sans attendre."
  - key: ordre-arret-propre
    format: course
    question: "Dans quel ordre se fait un arrêt propre ?"
    choices:
      - {text: "Refuser le trafic, finir les requêtes, arrêter les workers, fermer les ressources", correct: true}
      - {text: "Fermer les ressources, arrêter les workers, puis refuser le nouveau trafic", correct: false}
      - {text: "Arrêter les workers, fermer la base, puis laisser finir les requêtes en cours", correct: false}
      - {text: "Tout fermer en même temps, pour que l'arrêt soit le plus court possible", correct: false}
    answer: "On arrête d'accepter du trafic, on termine les requêtes en cours, on arrête les workers, puis l'on ferme les ressources dans l'ordre inverse de leur création : les requêtes en cours ont encore besoin de la base."
  - key: arreter-proprement-serveur-http
    format: course
    question: "Comment arrêter proprement un `http.Server` ?"
    choices:
      - {text: "`srv.Shutdown(ctx)`, qui attend la fin des requêtes en cours", correct: true}
      - {text: "`srv.Close()`, qui attend la fin des requêtes en cours", correct: false}
      - {text: "`os.Exit(0)`, après avoir fermé l'écouteur réseau", correct: false}
      - {text: "Annuler le contexte passé à `ListenAndServe`", correct: false}
    answer: "`srv.Shutdown(ctx)` ferme les écouteurs, puis attend que les connexions actives redeviennent inactives, dans la limite du contexte. `Close` coupe tout aussitôt ; `ListenAndServe` renvoie alors `http.ErrServerClosed`, à ignorer."
  - key: errserverclosed
    format: course
    question: Pourquoi ne faut-il pas traiter `http.ErrServerClosed` comme une erreur ?
    choices:
      - {text: "`ListenAndServe` le renvoie normalement après `Shutdown` ou `Close` : c'est un arrêt demandé", correct: true}
      - {text: "Il signale une erreur réseau passagère, que le serveur corrige seul en réessayant", correct: false}
      - {text: "Il n'est jamais renvoyé par `ListenAndServe`, seulement par `Shutdown`", correct: false}
      - {text: "Il signale que le port est déjà pris, ce qu'on peut ignorer en développement", correct: false}
    answer: ListenAndServe le renvoie normalement dès qu'on appelle Shutdown ou Close ; c'est le signe d'un arrêt demandé, pas d'une panne.
  - key: vf-attend
    format: true-false
    question: '`srv.Shutdown(ctx)` attend que les requêtes en cours se terminent.'
    truth: true
    answer: Ou que le contexte expire.
  - key: vf-websocket
    format: true-false
    question: Shutdown attend aussi la fin des connexions WebSocket détournées.
    truth: false
    answer: Il ne suit pas les connexions détournées (Hijack) ; RegisterOnShutdown permet de les prévenir.
  - key: vf-nouvelles
    format: true-false
    question: Pendant Shutdown, le serveur accepte encore de nouvelles connexions.
    truth: false
    answer: Il ferme d'abord les écouteurs.
  - key: vf-sigkill
    format: true-false
    question: Un programme peut intercepter SIGKILL pour s'arrêter proprement.
    truth: false
    answer: SIGKILL ne s'intercepte pas ; on agit sur SIGTERM, avant le délai de grâce.
  - key: qcm-etapes
    format: multiple-choice
    question: Que fait Server.Shutdown, dans l'ordre ?
    choices:
      - text: Fermer les écouteurs, puis les connexions inactives, puis attendre les requêtes en cours
        correct: true
      - text: Couper immédiatement toutes les connexions
        correct: false
      - text: Attendre que tous les clients se déconnectent d'eux-mêmes, sans limite
        correct: false
      - text: Envoyer SIGKILL au processus
        correct: false
    answer: srv.Close, lui, coupe tout immédiatement.
  - key: qcm-ordre
    format: multiple-choice
    question: "Lors de l'arrêt d'un service, que fait-on en dernier ?"
    choices:
      - {text: "Fermer la base et les connexions sortantes", correct: true}
      - {text: "Arrêter de recevoir du travail (serveur HTTP, consommateurs)", correct: false}
      - {text: "Attendre la fin du travail en cours", correct: false}
      - {text: "Faire échouer la sonde readiness", correct: false}
    answer: "On arrête d'abord de recevoir du travail, on attend la fin du travail en cours, et l'on ferme la base en dernier : les requêtes en cours en ont encore besoin."
  - key: qcm-signaux
    format: multiple-choice
    question: "Lesquels de ces signaux faut-il écouter pour l'arrêt gracieux ?"
    choices:
      - text: SIGTERM, envoyé par les orchestrateurs
        correct: true
      - text: os.Interrupt (Ctrl+C) en développement
        correct: true
      - text: SIGKILL
        correct: false
      - text: SIGSEGV
        correct: false
    answer: signal.NotifyContext en reçoit plusieurs.
  - key: qcm-kubernetes
    format: multiple-choice
    question: Pourquoi attendre quelques secondes avant Shutdown dans Kubernetes ?
    choices:
      - {text: "Le temps que l'instance soit retirée des points d'accès du Service", correct: true}
      - {text: "Pour laisser le ramasse-miettes libérer la mémoire avant l'arrêt", correct: false}
      - {text: "Parce que Kubernetes l'exige avant d'envoyer SIGKILL", correct: false}
      - {text: "Pour finir les requêtes en cours avant que `Shutdown` ne les coupe", correct: false}
    answer: "Sans cette pause, le répartiteur envoie encore des requêtes à un serveur qui refuse déjà les connexions. Les requêtes en cours, elles, sont attendues par `Shutdown` lui-même."
  - key: trous-notify
    format: fill-in
    question: |-
      Complète pour un contexte annulé par SIGTERM :
      ```go
      ctx, stop := signal.___(context.Background(), os.Interrupt, syscall.SIGTERM)
      defer stop()
      ```
    blanks:
      - - NotifyContext
    answer: signal.NotifyContext.
  - key: trous-shutdown
    format: fill-in
    question: |-
      Complète l'arrêt :
      ```go
      ctx, cancel := context.WithTimeout(context.Background(), 20*time.Second)
      defer cancel()
      if err := srv.___(ctx); err != nil {
      	log.Printf("arrêt incomplet : %v", err)
      }
      ```
    blanks:
      - - Shutdown
    answer: srv.Shutdown.
  - key: trous-errserverclosed
    format: fill-in
    question: |-
      Complète pour ignorer l'arrêt normal :
      ```go
      if err := srv.ListenAndServe(); err != nil && !errors.Is(err, http.___) {
      	log.Fatal(err)
      }
      ```
    blanks:
      - - ErrServerClosed
    answer: http.ErrServerClosed.
  - key: trous-onshutdown
    format: fill-in
    question: |-
      Complète pour prévenir les connexions WebSocket :
      ```go
      srv.___(func() { hub.FermerTout() })
      ```
    blanks:
      - - RegisterOnShutdown
    answer: RegisterOnShutdown.
  - key: bug-main-sort
    format: bug-fix
    question: |-
      Les requêtes en cours sont coupées au déploiement malgré l'appel à `Shutdown`. Pourquoi ?
      ```go
      go func() {
      	<-ctx.Done()
      	srv.Shutdown(context.Background())
      }()
      if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {
      	log.Fatal(err)
      }
      ```
    choices:
      - {text: "`ListenAndServe` rend la main dès le début de `Shutdown`, et `main` se termine aussitôt", correct: true}
      - {text: "`Shutdown` avec `context.Background()` coupe les requêtes en cours sans attendre", correct: false}
      - {text: "`err != http.ErrServerClosed` fait quitter `main` par `log.Fatal` pendant l'arrêt", correct: false}
      - {text: "La goroutine qui appelle `Shutdown` n'est jamais planifiée par le runtime", correct: false}
    answer: "```go\nfini := make(chan struct{})\ngo func() {\n\tdefer close(fini)\n\t<-ctx.Done()\n\tarret, cancel := context.WithTimeout(context.Background(), 20*time.Second)\n\tdefer cancel()\n\tsrv.Shutdown(arret)\n}()\nif err := srv.ListenAndServe(); err != nil && !errors.Is(err, http.ErrServerClosed) {\n\tlog.Fatal(err)\n}\n<-fini // attendre la fin de Shutdown avant de quitter\n```\nListenAndServe rend la main dès le début de Shutdown, et main se terminait aussitôt ; on attend la fin de l'arrêt,\nborné par un délai."
  - key: bug-fatal
    format: bug-fix
    question: |-
      Chaque arrêt du service est signalé comme un crash dans la supervision. Quelle correction est la bonne ?
      ```go
      log.Fatal(srv.ListenAndServe())
      ```
    choices:
      - {text: "Ignorer `http.ErrServerClosed`, et n'appeler `log.Fatal` que sur une autre erreur", correct: true}
      - {text: "Remplacer `log.Fatal` par `panic`, que la supervision interprète mieux", correct: false}
      - {text: "Remplacer `log.Fatal` par `log.Print`, quelle que soit l'erreur renvoyée", correct: false}
      - {text: "Appeler `os.Exit(0)` juste avant `ListenAndServe`, pour quitter proprement", correct: false}
    answer: "```go\nif err := srv.ListenAndServe(); err != nil && !errors.Is(err, http.ErrServerClosed) {\n\tlog.Fatal(err)\n}\n```\nErrServerClosed est le retour normal après Shutdown ; seul un autre retour est une erreur."
  - key: bug-base-avant
    format: bug-fix
    question: |-
      Pendant l'arrêt, les dernières requêtes échouent avec « sql: database is closed ». Quelle correction est la bonne ?
      ```go
      <-ctx.Done()
      db.Close()
      srv.Shutdown(arret)
      ```
    choices:
      - {text: "Appeler `srv.Shutdown` d'abord, puis fermer la base", correct: true}
      - {text: "Fermer la base dans une goroutine, en parallèle", correct: false}
      - {text: "Appeler `db.SetMaxOpenConns(0)` avant `Shutdown`", correct: false}
      - {text: "Attendre une seconde après `db.Close()`, puis `Shutdown`", correct: false}
    answer: "```go\n<-ctx.Done()\nif err := srv.Shutdown(arret); err != nil {\n\tlog.Printf(\"arrêt incomplet : %v\", err)\n}\ndb.Close()\n```\nLa base doit rester ouverte jusqu'à la fin des requêtes en cours ; on la ferme après Shutdown."
  - key: bug-sans-delai
    format: bug-fix
    question: |-
      Un déploiement reste bloqué jusqu'au SIGKILL, à cause d'une requête qui ne finit jamais. Quelle correction est la bonne ?
      ```go
      srv.Shutdown(context.Background())
      ```
    choices:
      - {text: "Un contexte à délai pour `Shutdown`, sous le délai de grâce, puis `srv.Close()`", correct: true}
      - {text: "Appeler `srv.Close()` seul, sans jamais passer par `Shutdown`", correct: false}
      - {text: "Appeler `Shutdown` deux fois de suite avec `context.Background()`", correct: false}
      - {text: "Ignorer SIGTERM, pour laisser la requête finir à son rythme", correct: false}
    answer: "```go\narret, cancel := context.WithTimeout(context.Background(), 20*time.Second)\ndefer cancel()\nif err := srv.Shutdown(arret); err != nil {\n\tlog.Printf(\"arrêt forcé : %v\", err)\n\tsrv.Close()\n}\n```\nSans délai, Shutdown attend indéfiniment ; on le borne sous le délai de grâce de l'orchestrateur, puis on ferme de\nforce."
  - key: scenario-kubernetes
    format: scenario
    question: "Quel est l'arrêt idéal d'un service Go dans Kubernetes ?"
    choices:
      - {text: "Readiness en échec, une courte pause, `Shutdown` à délai, puis fermeture des dépendances", correct: true}
      - {text: "`os.Exit(0)` dès SIGTERM, Kubernetes relançant ailleurs les requêtes perdues", correct: false}
      - {text: "`Shutdown` sans délai, en laissant Kubernetes envoyer SIGKILL s'il le faut", correct: false}
      - {text: "Fermer d'abord la base, puis attendre que Kubernetes coupe le trafic du pod", correct: false}
    answer: "À SIGTERM, le service fait échouer sa sonde readiness et attend quelques secondes d'être retiré des points d'accès, puis appelle `srv.Shutdown` avec un délai inférieur au `terminationGracePeriodSeconds` (20 s pour 30 s). Les consommateurs finissent leur message, puis le service ferme la base et vide journaux et métriques."
  - key: scenario-workers
    format: scenario
    question: Ton service a aussi des goroutines de fond (consommateur Kafka, tâches planifiées). Comment les arrêtes-tu proprement ?
    choices:
      - {text: "Le contexte annulé par le signal, un `WaitGroup` ou un errgroup, puis les dépendances fermées", correct: true}
      - {text: "Un `os.Exit` dans chaque goroutine, dès la réception du signal d'arrêt", correct: false}
      - {text: "Rien : les goroutines de fond finissent proprement leur tâche à la fin de `main`", correct: false}
      - {text: "Un `time.Sleep` de 30 secondes dans `main`, le temps qu'elles finissent", correct: false}
    answer: "Elles reçoivent le contexte annulé par le signal et s'arrêtent après leur tâche en cours ; un `WaitGroup` (ou un errgroup) les attend, avec le même délai global que le serveur HTTP. Ensuite seulement, on ferme les dépendances partagées ; les messages non traités ne sont pas acquittés, pour être relivrés."
  - key: scenario-tester
    format: scenario
    question: Comment testes-tu l'arrêt gracieux de ton serveur ?
    choices:
      - {text: "Une requête bloquée dans un handler, `Shutdown` pendant qu'elle tourne, puis vérifier qu'elle réussit", correct: true}
      - {text: "Envoyer SIGKILL au processus de test, puis vérifier qu'il redémarre bien", correct: false}
      - {text: "Vérifier seulement que `Shutdown` renvoie `nil` sur un serveur sans requête", correct: false}
      - {text: "Aucun test : l'arrêt gracieux se vérifie à la main, en production", correct: false}
    answer: "Un test démarre le serveur sur un port libre, avec un handler qui bloque jusqu'à un signal du test ; il lance une requête, appelle `Shutdown` pendant qu'elle tourne, puis débloque le handler : la requête doit réussir et `Shutdown` rendre la main sans erreur. Un second cas vérifie qu'un handler trop long fait renvoyer l'erreur de délai."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande ce qui se passe si un service ne gère pas SIGTERM. Que réponds-tu ?"
    choices:
      - {text: "Go quitte aussitôt : les requêtes en cours sont coupées à chaque déploiement", correct: true}
      - {text: "Go ignore SIGTERM, et l'orchestrateur doit envoyer SIGKILL pour l'arrêter", correct: false}
      - {text: "Go appelle `Shutdown` de lui-même sur tous les serveurs HTTP ouverts", correct: false}
      - {text: "Go attend la fin de toutes les goroutines, puis quitte proprement", correct: false}
    answer: "Par défaut, Go quitte immédiatement sur SIGTERM : les requêtes en cours sont coupées, des transactions restent à moitié faites, des messages sont traités deux fois. Avec `signal.NotifyContext` et `Shutdown`, les requêtes finissent et les déploiements deviennent invisibles."
