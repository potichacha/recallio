notion: api-json
lesson: "Un handler d'API JSON robuste suit toujours les mêmes étapes :\n\n```go\nfunc (s *Serveur) creerCommande(w http.ResponseWriter, r *http.Request) {\n\t// 1. borner et décoder\n\tvar entree CreerCommandeRequete\n\tdec := json.NewDecoder(http.MaxBytesReader(w, r.Body, 1<<20))\n\tdec.DisallowUnknownFields()\n\tif err := dec.Decode(&entree); err != nil {\n\t\trepondreErreur(w, http.StatusBadRequest, \"corps invalide\")\n\t\treturn\n\t}\n\t// 2. valider\n\tif err := entree.Valider(); err != nil {\n\t\trepondreErreur(w, http.StatusUnprocessableEntity, err.Error())\n\t\treturn\n\t}\n\t// 3. appeler le métier avec le contexte de la requête\n\tc, err := s.commandes.Creer(r.Context(), entree.versCommande())\n\tif errors.Is(err, ErrStockInsuffisant) {\n\t\trepondreErreur(w, http.StatusConflict, \"stock insuffisant\")\n\t\treturn\n\t}\n\tif err != nil {\n\t\ts.log.Error(\"création de commande\", \"err\", err)\n\t\trepondreErreur(w, http.StatusInternalServerError, \"erreur interne\") // ne pas exposer err\n\t\treturn\n\t}\n\t// 4. répondre\n\tw.Header().Set(\"Location\", \"/commandes/\"+c.ID)\n\trepondreJSON(w, http.StatusCreated, versReponse(c))\n}\n```\n\nLes codes à connaître : **200** OK, **201** Created (avec `Location`), **204** No Content, **400** requête mal formée,\n**401** non authentifié, **403** interdit, **404** introuvable, **409** conflit, **422** données invalides, **429** trop\nde requêtes, **500** erreur interne, **503** indisponible.\n\nLes principes :\n- des **types dédiés** pour les entrées et les sorties (DTO), distincts des entités ;\n- les **erreurs métier** (sentinelles, types) traduites en codes HTTP à un seul endroit ;\n- un format d'erreur **constant**, par exemple RFC 9457 (Problem Details, `application/problem+json`) ;\n- les **détails internes** (messages SQL, piles) journalisés, jamais renvoyés au client ;\n- un petit utilitaire `repondreJSON(w, code, v)` qui fixe `Content-Type`, le statut, puis encode.\n\n**En entretien** : « Borner, décoder, valider, appeler le métier avec r.Context(), traduire les erreurs en codes,\nrépondre en JSON ; des DTO ; un format d'erreur constant ; ne jamais exposer les erreurs internes. »"
cards:
  - key: ordre-ecrire-tetes-statut-corps
    format: course
    question: "Dans quel ordre écrire les en-têtes, le statut et le corps d'une réponse HTTP ?"
    choices:
      - {text: "Les en-têtes, puis `WriteHeader`, puis `Write`", correct: true}
      - {text: "`WriteHeader`, puis les en-têtes, puis `Write`", correct: false}
      - {text: "`Write`, puis les en-têtes, puis `WriteHeader`", correct: false}
      - {text: "Dans n'importe quel ordre : tout part à la fin", correct: false}
    answer: "Les en-têtes fixés après `WriteHeader` sont ignorés, et le premier `Write` envoie un 200 implicite. L'ordre est donc `w.Header().Set(...)`, `w.WriteHeader(code)`, puis le corps."
  - key: limiter-taille-corps-requete
    format: course
    question: "Comment limiter la taille du corps d'une requête HTTP ?"
    choices:
      - {text: "Avec `http.MaxBytesReader(w, r.Body, n)`", correct: true}
      - {text: "Avec le champ `MaxBodySize` de `http.Server`", correct: false}
      - {text: "Avec `r.ContentLength = n` au début du handler", correct: false}
      - {text: "Avec `io.ReadAll`, qui s'arrête à 1 Mo par défaut", correct: false}
    answer: "`http.MaxBytesReader` fait échouer la lecture au-delà de `n` octets, avec une `*http.MaxBytesError`. `http.Server` n'a pas de limite de corps : `MaxHeaderBytes` ne borne que les en-têtes."
  - key: format-standard-erreurs-api
    format: course
    question: "Quel format standard existe pour les erreurs d'une API HTTP ?"
    choices:
      - {text: "Problem Details, la RFC 9457 (`application/problem+json`)", correct: true}
      - {text: "Le format JSON-RPC 2.0, avec ses codes -32600 et suivants", correct: false}
      - {text: "Le message `google.rpc.Status` de gRPC, imposé aux API REST", correct: false}
      - {text: "Un texte brut, qui reprend le message de l'erreur Go", correct: false}
    answer: "Problem Details (RFC 9457, qui remplace la RFC 7807) : un corps `application/problem+json` avec `type`, `title`, `status`, `detail`, et des champs propres à l'API."
  - key: ecris-handler-creation-utilisateur-robuste
    format: scenario
    question: "Tu écris un handler de création d'utilisateur. Que doit-il faire pour être robuste ?"
    choices:
      - {text: "Borner le corps, refuser les champs inconnus, valider, traduire les erreurs, répondre 201 et `Location`", correct: true}
      - {text: "Décoder dans l'entité, l'enregistrer, et renvoyer 500 avec le détail de toute erreur rencontrée", correct: false}
      - {text: "Décoder avec `json.Unmarshal` après un `io.ReadAll` sans limite, puis répondre 200 avec l'entité", correct: false}
      - {text: "Vérifier l'email par un SELECT avant l'insertion, sans contrainte en base, puis répondre 200", correct: false}
    answer: "Taille du corps bornée (`http.MaxBytesReader`), champs inconnus rejetés, validation avant tout appel, erreurs métier traduites en codes précis (409 pour un email déjà pris), détails techniques dans les journaux seulement, 201 et `Location` pour la création, contexte de la requête propagé. L'unicité de l'email reste garantie par une contrainte en base."
  - key: decoder-dto-plutot-entite
    format: course
    question: "Pourquoi décoder le corps d'une requête dans un DTO plutôt que dans l'entité ?"
    choices:
      - {text: "Pour qu'un client ne puisse pas fixer des champs sensibles (mass assignment)", correct: true}
      - {text: "Parce que `encoding/json` ne sait pas décoder une entité qui a des méthodes", correct: false}
      - {text: "Pour que le décodage soit plus rapide, un DTO ayant moins de champs", correct: false}
      - {text: "Parce qu'une entité ne peut pas porter de tags `json` sur ses champs", correct: false}
    answer: "Décoder dans l'entité laisse le client fixer n'importe quel champ exporté, comme un rôle ou un solde (mass assignment). Un DTO limite les champs acceptés, et l'entité se construit à partir de lui."
  - key: bibliotheque-graphql
    format: course
    question: "Quelle bibliothèque GraphQL est la plus utilisée en Go ?"
    choices:
      - {text: "gqlgen, qui génère le code à partir du schéma", correct: true}
      - {text: "`net/graphql`, de la bibliothèque standard", correct: false}
      - {text: "sqlc, qui génère le schéma GraphQL depuis le SQL", correct: false}
      - {text: "grpc-gateway, qui traduit GraphQL en gRPC", correct: false}
    answer: "gqlgen part du schéma GraphQL et génère des types et des resolvers typés, sans réflexion. La bibliothèque standard n'a pas de GraphQL ; sqlc génère du Go depuis du SQL, grpc-gateway expose du gRPC en REST."
  - key: vf-422
    format: true-false
    question: Un corps JSON bien formé mais avec un email invalide se signale plutôt par 422 que par 500.
    truth: true
    answer: C'est une erreur du client ; 500 est réservé aux erreurs du serveur.
  - key: vf-exposer
    format: true-false
    question: Renvoyer le message d'erreur SQL au client aide à déboguer et ne pose pas de problème.
    truth: false
    answer: Il révèle le schéma et la technologie ; on le journalise et l'on renvoie un message générique.
  - key: vf-location
    format: true-false
    question: Une réponse 201 Created porte en général un en-tête Location vers la ressource créée.
    truth: true
    answer: Par exemple /commandes/42.
  - key: vf-204
    format: true-false
    question: Une réponse 204 No Content peut contenir un corps JSON.
    truth: false
    answer: 204 signifie justement l'absence de corps.
  - key: qcm-codes
    format: multiple-choice
    question: "Un client envoie un JSON mal formé. Quel code HTTP renvoies-tu ?"
    choices:
      - {text: "400 Bad Request", correct: true}
      - {text: "500 Internal Server Error", correct: false}
      - {text: "404 Not Found", correct: false}
      - {text: "409 Conflict", correct: false}
    answer: "Un JSON mal formé est une erreur du client : 400. 404 sert pour une ressource inexistante, 409 pour un conflit d'état (une commande déjà payée), 401 pour un jeton absent ; 500 signale une panne du serveur."
  - key: qcm-401-403
    format: multiple-choice
    question: "Un utilisateur connecté demande une ressource à laquelle il n'a pas droit. Quel code renvoies-tu ?"
    choices:
      - {text: "403 Forbidden", correct: true}
      - {text: "401 Unauthorized", correct: false}
      - {text: "400 Bad Request", correct: false}
      - {text: "500 Internal Server Error", correct: false}
    answer: "401 dit que l'identité est absente ou invalide ; 403, que l'utilisateur est identifié mais n'a pas le droit. Pour ne pas révéler l'existence d'une ressource, on peut aussi répondre 404."
  - key: qcm-traduire
    format: multiple-choice
    question: "Lesquelles de ces pratiques conviennent pour traduire les erreurs métier en codes HTTP ?"
    choices:
      - text: Avec errors.Is et errors.As dans une fonction unique de traduction
        correct: true
      - text: Avec des erreurs sentinelles ou des types d'erreur exportés par le métier
        correct: true
      - text: En comparant les messages d'erreur
        correct: false
      - text: En renvoyant toujours 500
        correct: false
    answer: Les messages changent ; les sentinelles et les types sont des contrats.
  - key: qcm-format
    format: multiple-choice
    question: Quel format d'erreur choisir pour une API ?
    choices:
      - {text: "Un format constant, comme Problem Details, avec un code d'erreur stable", correct: true}
      - {text: "Un texte libre, rédigé différemment selon les handlers", correct: false}
      - {text: "La pile d'appels Go, pour aider le client à déboguer", correct: false}
      - {text: "Le message de l'erreur Go, renvoyé tel quel au client", correct: false}
    answer: "Les clients s'appuient sur la structure, pas sur le texte : un format constant (Problem Details, RFC 9457) et un code d'erreur stable qu'ils peuvent tester. La pile d'appels et les messages internes restent dans les journaux."
  - key: trous-maxbytes
    format: fill-in
    question: |-
      Complète pour borner le corps à 1 Mo :
      ```go
      dec := json.NewDecoder(http.___(w, r.Body, 1<<20))
      ```
    blanks:
      - - MaxBytesReader
    answer: http.MaxBytesReader.
  - key: trous-created
    format: fill-in
    question: |-
      Complète le statut de création :
      ```go
      w.WriteHeader(http.Status___)
      ```
    blanks:
      - - Created
    answer: http.StatusCreated, 201.
  - key: trous-content-type
    format: fill-in
    question: |-
      Complète l'en-tête d'une réponse JSON :
      ```go
      w.Header().Set("Content-Type", "application/___")
      ```
    blanks:
      - - json
    answer: application/json.
  - key: trous-encode
    format: fill-in
    question: |-
      Complète l'écriture du corps :
      ```go
      json.NewEncoder(w).___(reponse)
      ```
    blanks:
      - - Encode
    answer: Encode écrit directement dans le ResponseWriter.
  - key: bug-500
    format: bug-fix
    question: |-
      Toutes les erreurs remontent en 500, y compris « commande introuvable ». Quelle correction est la bonne ?
      ```go
      c, err := s.commandes.Lire(r.Context(), id)
      if err != nil {
      	http.Error(w, err.Error(), http.StatusInternalServerError)
      	return
      }
      ```
    choices:
      - {text: "Tester `errors.Is(err, ErrIntrouvable)` pour répondre 404, et cacher le message des autres erreurs", correct: true}
      - {text: "Répondre 404 pour toute erreur, puisqu'une commande illisible est forcément introuvable", correct: false}
      - {text: "Comparer `err.Error()` au texte « commande introuvable » pour décider de répondre 404", correct: false}
      - {text: "Garder 500, mais ajouter la pile d'appels au corps de la réponse pour aider le client", correct: false}
    answer: "```go\nc, err := s.commandes.Lire(r.Context(), id)\nswitch {\ncase errors.Is(err, ErrIntrouvable):\n\trepondreErreur(w, http.StatusNotFound, \"commande introuvable\")\n\treturn\ncase err != nil:\n\ts.log.Error(\"lecture de commande\", \"id\", id, \"err\", err)\n\trepondreErreur(w, http.StatusInternalServerError, \"erreur interne\")\n\treturn\n}\n```\nOn distingue les erreurs métier attendues, et l'on ne renvoie plus le message interne au client."
  - key: bug-entite
    format: bug-fix
    question: |-
      Un client devient administrateur en ajoutant `"role": "admin"` au corps de son inscription. Quelle correction est la bonne ?
      ```go
      var u Utilisateur // l'entité, avec son champ Role
      json.NewDecoder(r.Body).Decode(&u)
      s.depot.Creer(r.Context(), u)
      ```
    choices:
      - {text: "Décoder dans un DTO sans champ `Role`, et fixer le rôle côté serveur", correct: true}
      - {text: "Décoder dans l'entité avec `DisallowUnknownFields`, qui refuse `role`", correct: false}
      - {text: "Passer le corps par `http.MaxBytesReader`, qui filtre les champs en trop", correct: false}
      - {text: "Renommer le champ `Role` dans le JSON avec un tag, pour le cacher", correct: false}
    answer: "```go\ntype InscriptionRequete struct {\n\tEmail string `json:\"email\"`\n\tNom   string `json:\"nom\"`\n}\n\nvar entree InscriptionRequete\ndec := json.NewDecoder(http.MaxBytesReader(w, r.Body, 1<<20))\ndec.DisallowUnknownFields()\nif err := dec.Decode(&entree); err != nil {\n\trepondreErreur(w, http.StatusBadRequest, \"corps invalide\")\n\treturn\n}\nu := Utilisateur{Email: entree.Email, Nom: entree.Nom, Role: RoleClient}\n```\nDécoder dans l'entité laissait le client choisir n'importe quel champ (mass assignment) ; un DTO limite les champs\nacceptés."
  - key: bug-content-type
    format: bug-fix
    question: |-
      Le client reçoit du JSON annoncé « text/plain ». Quelle correction est la bonne ?
      ```go
      func repondreJSON(w http.ResponseWriter, code int, v any) {
      	w.WriteHeader(code)
      	w.Header().Set("Content-Type", "application/json")
      	json.NewEncoder(w).Encode(v)
      }
      ```
    choices:
      - {text: "Fixer `Content-Type` avant d'appeler `WriteHeader`", correct: true}
      - {text: "Fixer `Content-Type` après l'appel à `Encode`", correct: false}
      - {text: "Remplacer `Set` par `Add` pour l'en-tête `Content-Type`", correct: false}
      - {text: "Appeler `WriteHeader` deux fois, avant et après l'en-tête", correct: false}
    answer: "```go\nfunc repondreJSON(w http.ResponseWriter, code int, v any) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(code)\n\tjson.NewEncoder(w).Encode(v)\n}\n```\nLes en-têtes doivent être fixés avant WriteHeader."
  - key: bug-validation
    format: bug-fix
    question: |-
      Des commandes avec une quantité négative arrivent en base. Quelle correction est la bonne ?
      ```go
      var entree CommandeRequete
      if err := dec.Decode(&entree); err != nil {
      	repondreErreur(w, http.StatusBadRequest, "corps invalide")
      	return
      }
      s.commandes.Creer(r.Context(), entree.versCommande())
      ```
    choices:
      - {text: "Valider la requête après le décodage, et répondre 422 avec toutes les erreurs", correct: true}
      - {text: "Ajouter `DisallowUnknownFields`, qui refuse aussi les valeurs négatives", correct: false}
      - {text: "Laisser la base refuser la ligne, puis répondre 500 au client", correct: false}
      - {text: "Ajouter le tag `json:\",omitempty\"` sur le champ `Quantite`", correct: false}
    answer: "```go\nfunc (c CommandeRequete) Valider() error {\n\tvar errs []error\n\tif c.Quantite <= 0 {\n\t\terrs = append(errs, errors.New(\"quantite doit être positive\"))\n\t}\n\tif c.ProduitID == \"\" {\n\t\terrs = append(errs, errors.New(\"produit_id est obligatoire\"))\n\t}\n\treturn errors.Join(errs...)\n}\n\nif err := entree.Valider(); err != nil {\n\trepondreErreur(w, http.StatusUnprocessableEntity, err.Error())\n\treturn\n}\n```\nUn JSON bien formé n'est pas forcément valide : on valide explicitement, et l'on renvoie 422 avec toutes les\nerreurs."
  - key: scenario-structure
    format: scenario
    question: Comment structures-tu une API REST en Go sans framework ?
    choices:
      - {text: "Un `Serveur` qui porte ses dépendances, une méthode `routes()` et des handlers courts", correct: true}
      - {text: "Des handlers globaux qui ouvrent eux-mêmes la base et appellent le SQL directement", correct: false}
      - {text: "Un seul handler géant, avec un `switch` sur `r.URL.Path` et sur la méthode HTTP", correct: false}
      - {text: "Des variables globales pour les services, initialisées dans `init()` au démarrage", correct: false}
    answer: "Un type `Serveur` porte ses dépendances (services, logger) ; sa méthode `routes()` construit le `ServeMux` (motifs de Go 1.22) et applique les middlewares. Chaque handler décode, valide, appelle le service, traduit l'erreur et répond ; le métier ne connaît pas HTTP, et les handlers se testent avec `httptest`."
  - key: scenario-erreurs
    format: scenario
    question: Comment organises-tu la traduction des erreurs métier en réponses HTTP ?
    choices:
      - {text: "Une seule fonction qui traduit les erreurs avec `errors.Is` et `errors.As` en Problem Details", correct: true}
      - {text: "Chaque handler compare le message de l'erreur à une liste de textes connus", correct: false}
      - {text: "Le métier renvoie directement des codes HTTP, que les handlers recopient", correct: false}
      - {text: "Toutes les erreurs deviennent des 500, avec leur message complet pour le client", correct: false}
    answer: "Le métier expose des erreurs sentinelles (`ErrIntrouvable`) ou des types (`*ErreurValidation`) ; une seule fonction `ecrireErreur(w, err)` les traduit en code et en Problem Details, et journalise les erreurs inattendues avant de répondre 500 sans détail. Le métier ne connaît pas HTTP."
  - key: scenario-pagination
    format: scenario
    question: Comment gères-tu la pagination d'une liste dans ton API ?
    choices:
      - {text: "Une taille de page bornée côté serveur, et une pagination par curseur (`?apres=<id>`)", correct: true}
      - {text: "La taille de page choisie par le client, sans limite, pour lui laisser le choix", correct: false}
      - {text: "Toute la liste d'un coup, que le client découpe lui-même en pages", correct: false}
      - {text: "Un `OFFSET` toujours, stable même quand des éléments sont ajoutés", correct: false}
    answer: "Une taille de page bornée côté serveur (20 par défaut, 100 au plus, quoi que demande le client) et une pagination par curseur (`WHERE id > $1 ORDER BY id LIMIT $2`), stable quand des éléments sont ajoutés. L'offset ralentit et saute des éléments quand les données changent."
