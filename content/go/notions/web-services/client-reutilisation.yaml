notion: client-reutilisation
cards:
  - key: seul-http-client-partage
    format: course
    question: Pourquoi un seul http.Client partagé ?
    answer: Pour réutiliser son pool de connexions ; en créer un par requête casse la réutilisation.
  - key: partager-seul-http-client
    format: course
    question: Pourquoi partager un seul http.Client ?
    answer: Il est sûr en concurrence et porte le pool de connexions.
  - key: vaut-maxidleconnsperhost-defaut
    format: course
    question: Que vaut MaxIdleConnsPerHost par défaut ?
    answer: 2, souvent trop bas pour des appels intensifs vers un même hôte.
