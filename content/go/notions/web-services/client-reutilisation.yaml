notion: client-reutilisation
lesson: "Un `http.Client` s'appuie sur un **`http.Transport`**, qui garde un **pool de connexions** (TCP et TLS) par hôte et\nles réutilise d'une requête à l'autre (keep-alive). Ouvrir une connexion TLS coûte plusieurs allers-retours réseau :\nla réutiliser est essentiel.\n\n```go\ntransport := &http.Transport{\n\tMaxIdleConns:        100,             // connexions inactives gardées au total\n\tMaxIdleConnsPerHost: 20,              // par hôte : 2 par défaut, souvent trop peu\n\tMaxConnsPerHost:     50,              // plafond de connexions par hôte (0 = illimité)\n\tIdleConnTimeout:     90 * time.Second,\n\tTLSHandshakeTimeout: 5 * time.Second,\n}\nclient := &http.Client{Transport: transport, Timeout: 10 * time.Second}\n```\n\nLes règles :\n- **un seul client** (et donc un seul transport) **partagé** pour tout le programme, ou un par service appelé : il\n  est sûr entre goroutines ;\n- créer un `http.Client` ou un `Transport` **par requête** empêche toute réutilisation : chaque appel refait une\n  connexion TLS, et les anciennes s'accumulent ;\n- une connexion n'est réutilisable que si le **corps** de la réponse a été **lu jusqu'au bout et fermé** ;\n- `MaxIdleConnsPerHost` vaut **2** par défaut (`http.DefaultMaxIdleConnsPerHost`) : un service qui appelle beaucoup le\n  même hôte en parallèle ouvre et ferme sans cesse des connexions ; on l'augmente ;\n- on part de `http.DefaultTransport.(*http.Transport).Clone()` pour garder les bons réglages par défaut (proxy,\n  délais de connexion, HTTP/2).\n\n**En entretien** : « Un client et un transport partagés ; le transport garde un pool de connexions par hôte ; lire et\nfermer le corps pour réutiliser ; MaxIdleConnsPerHost à 2 par défaut, à augmenter ; ne jamais créer un client par\nrequête. »"
cards:
  - key: seul-http-client-partage
    format: course
    question: "Pourquoi utiliser un seul `http.Client` partagé, plutôt qu'un par requête ?"
    choices:
      - {text: "Pour réutiliser le pool de connexions de son transport", correct: true}
      - {text: "Parce qu'un programme ne peut créer qu'un seul `http.Client`", correct: false}
      - {text: "Pour que toutes les requêtes partagent les mêmes cookies", correct: false}
      - {text: "Parce qu'un `http.Client` met une seconde à s'initialiser", correct: false}
    answer: "Le pool de connexions vit dans le `Transport` du client : en créer un par requête casse la réutilisation, et chaque appel repaie connexion TCP et négociation TLS."
  - key: partager-seul-http-client
    format: course
    question: "Peut-on partager un même `http.Client` entre goroutines ?"
    choices:
      - {text: "Oui : il est sûr en concurrence et porte le pool de connexions", correct: true}
      - {text: "Non : il faut un client par goroutine, ou un mutex autour de lui", correct: false}
      - {text: "Oui, mais seulement si son `Timeout` vaut zéro", correct: false}
      - {text: "Non : son pool de connexions n'est pas sûr en concurrence", correct: false}
    answer: "Oui : `http.Client` et `http.Transport` sont faits pour être partagés entre goroutines ; c'est même ainsi que les connexions se réutilisent."
  - key: vaut-maxidleconnsperhost-defaut
    format: course
    question: "Que vaut `MaxIdleConnsPerHost` par défaut ?"
    choices:
      - {text: "2, souvent trop bas pour des appels intensifs vers un même hôte", correct: true}
      - {text: "100, comme `MaxIdleConns` dans le transport par défaut", correct: false}
      - {text: "Aucune limite : les connexions inactives sont toutes gardées", correct: false}
      - {text: "Le nombre de cœurs de la machine, donné par `runtime.NumCPU`", correct: false}
    answer: "`http.DefaultMaxIdleConnsPerHost` vaut 2 : au-delà de deux appels simultanés vers un même hôte, les connexions en trop sont fermées après usage, puis rouvertes. `MaxIdleConns`, tous hôtes confondus, vaut 100 dans le transport par défaut."
  - key: clone
    format: course
    question: Pourquoi partir de `http.DefaultTransport.(*http.Transport).Clone()` pour configurer un transport ?
    choices:
      - {text: "Il garde les réglages par défaut utiles (proxy, délais, HTTP/2) qu'un `&http.Transport{}` vide n'a pas", correct: true}
      - {text: "Il est obligatoire : un `&http.Transport{}` créé à la main ne compile pas sans lui", correct: false}
      - {text: "Il partage le pool de connexions du transport par défaut avec tout le programme", correct: false}
      - {text: "Il désactive HTTP/2, souvent source de problèmes avec les proxys d'entreprise", correct: false}
    answer: Il garde les réglages par défaut utiles (proxy depuis l'environnement, délais de connexion et de TLS, HTTP/2, IdleConnTimeout) qu'un `&http.Transport{}` vide n'a pas ; on ne change ensuite que ce qu'il faut.
  - key: vf-partage
    format: true-false
    question: Un http.Client peut être partagé par toutes les goroutines du programme.
    truth: true
    answer: Il est sûr entre goroutines, et c'est l'usage recommandé.
  - key: vf-par-requete
    format: true-false
    question: Créer un nouveau http.Client avec son Transport à chaque requête ne coûte rien.
    truth: false
    answer: Chaque appel refait la connexion TCP et TLS, et les connexions inactives s'accumulent.
  - key: vf-defaut
    format: true-false
    question: Par défaut, le transport garde au plus 2 connexions inactives par hôte.
    truth: true
    answer: DefaultMaxIdleConnsPerHost vaut 2.
  - key: vf-corps
    format: true-false
    question: Une connexion peut être réutilisée même si le corps de la réponse précédente n'a pas été lu ni fermé.
    truth: false
    answer: Il faut lire le corps jusqu'au bout et le fermer.
  - key: qcm-regles
    format: multiple-choice
    question: "Laquelle de ces pratiques empêche la réutilisation des connexions HTTP ?"
    choices:
      - {text: "Un nouveau `Transport` par requête", correct: true}
      - {text: "Un client partagé, créé une fois", correct: false}
      - {text: "Lire puis fermer le corps de chaque réponse", correct: false}
      - {text: "Un `MaxIdleConnsPerHost` adapté au parallélisme", correct: false}
    answer: "Le pool vit dans le `Transport` : un transport neuf par requête repart sans connexion. Un client partagé, des corps lus et fermés et un `MaxIdleConnsPerHost` adapté permettent au contraire la réutilisation."
  - key: qcm-symptomes
    format: multiple-choice
    question: "Lesquels de ces symptômes trahissent une mauvaise réutilisation des connexions ?"
    choices:
      - text: Des milliers de sockets en TIME_WAIT
        correct: true
      - text: Une latence plus élevée à cause des négociations TLS répétées
        correct: true
      - text: Des erreurs « too many open files »
        correct: true
      - text: Une baisse de la consommation mémoire
        correct: false
    answer: Chaque nouvelle connexion coûte du temps et des ressources.
  - key: qcm-reglages
    format: multiple-choice
    question: "Laquelle de ces descriptions des champs de `http.Transport` est fausse ?"
    choices:
      - {text: "`MaxIdleConns` : le nombre maximal de requêtes simultanées", correct: true}
      - {text: "`MaxIdleConnsPerHost` : les connexions inactives gardées par hôte", correct: false}
      - {text: "`MaxConnsPerHost` : le plafond total de connexions par hôte", correct: false}
      - {text: "`IdleConnTimeout` : la durée de vie d'une connexion inactive", correct: false}
    answer: "`MaxIdleConns` compte les connexions inactives gardées, tous hôtes confondus ; il ne limite pas les requêtes. Les trois autres descriptions sont justes."
  - key: qcm-plusieurs
    format: multiple-choice
    question: "Ton service appelle trois partenaires aux exigences différentes. Lesquelles de ces organisations conviennent ?"
    choices:
      - text: Un client par partenaire, chacun créé une fois avec ses délais et son transport
        correct: true
      - text: Un seul client partagé, si les réglages conviennent aux trois
        correct: true
      - text: Un client par requête
        correct: false
      - text: Un client par goroutine
        correct: false
    answer: L'important est de les créer une fois et de les réutiliser.
  - key: bug-par-requete
    format: bug-fix
    question: |-
      Le profil montre que la moitié du CPU part en négociations TLS. Quelle correction est la bonne ?
      ```go
      func (c *Catalogue) Produit(ctx context.Context, id string) (Produit, error) {
      	client := &http.Client{Transport: &http.Transport{}, Timeout: 5 * time.Second}
      	// ...
      }
      ```
    choices:
      - {text: "Créer le client une fois, avec un transport cloné, et le partager", correct: true}
      - {text: "Garder un client par appel, mais avec un `Timeout` de 30 secondes", correct: false}
      - {text: "Désactiver TLS entre les services, pour supprimer la négociation", correct: false}
      - {text: "Ajouter `DisableKeepAlives: true` au transport créé à chaque appel", correct: false}
    answer: "```go\ntype Catalogue struct {\n\thttp *http.Client // créé une fois, partagé\n\tbase string\n}\n\nfunc NouveauCatalogue(base string) *Catalogue {\n\tt := http.DefaultTransport.(*http.Transport).Clone()\n\tt.MaxIdleConnsPerHost = 20\n\treturn &Catalogue{http: &http.Client{Transport: t, Timeout: 5 * time.Second}, base: base}\n}\n```\nUn transport par appel empêchait toute réutilisation ; un client partagé garde ses connexions."
  - key: bug-idle
    format: bug-fix
    question: |-
      Avec 50 goroutines qui appellent la même API, le nombre de connexions TCP ouvertes et fermées par seconde est énorme. Quelle correction est la bonne ?
      ```go
      var client = &http.Client{Timeout: 5 * time.Second}
      ```
    choices:
      - {text: "Un transport cloné, avec `MaxIdleConnsPerHost` à 50", correct: true}
      - {text: "Un `Timeout` plus court, pour libérer les connexions", correct: false}
      - {text: "Un `http.Client` par goroutine, chacun avec sa connexion", correct: false}
      - {text: "Un `MaxConnsPerHost` à 2, pour limiter les ouvertures", correct: false}
    answer: |-
      ```go
      t := http.DefaultTransport.(*http.Transport).Clone()
      t.MaxIdleConnsPerHost = 50
      var client = &http.Client{Transport: t, Timeout: 5 * time.Second}
      ```
      Par défaut, seules 2 connexions inactives sont gardées par hôte : les 48 autres étaient fermées après chaque
      requête, puis rouvertes.
  - key: bug-corps
    format: bug-fix
    question: |-
      Les connexions ne sont pas réutilisées après une réponse en erreur, alors que le client est partagé. Quelle correction est la bonne ?
      ```go
      resp, err := client.Do(req)
      if err != nil {
      	return err
      }
      defer resp.Body.Close()
      if resp.StatusCode != http.StatusOK {
      	return fmt.Errorf("statut %d", resp.StatusCode)
      }
      ```
    choices:
      - {text: "Vider le corps, en le bornant, avec `io.Copy(io.Discard, ...)` avant de le fermer", correct: true}
      - {text: "Fermer le corps avant de tester le statut, sans le lire", correct: false}
      - {text: "Retirer le `defer resp.Body.Close()`, qui ferme la connexion", correct: false}
      - {text: "Créer un nouveau client pour chaque réponse en erreur", correct: false}
    answer: "```go\nresp, err := client.Do(req)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\nif resp.StatusCode != http.StatusOK {\n\tio.Copy(io.Discard, io.LimitReader(resp.Body, 64<<10))\n\treturn fmt.Errorf(\"statut %d\", resp.StatusCode)\n}\n```\nUn corps fermé sans être lu oblige à fermer la connexion ; on le lit jusqu'au bout (borné) avant de le fermer."
  - key: bug-transport-vide
    format: bug-fix
    question: |-
      Depuis le changement de configuration, le client ignore le proxy de l'entreprise et n'utilise plus HTTP/2. Quelle correction est la bonne ?
      ```go
      client := &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 20}}
      ```
    choices:
      - {text: "Cloner `http.DefaultTransport`, et ne changer que `MaxIdleConnsPerHost`", correct: true}
      - {text: "Ajouter `ForceAttemptHTTP2: true` au transport vide", correct: false}
      - {text: "Modifier le `Transport` global de `http.DefaultClient`", correct: false}
      - {text: "Fixer la variable `HTTPS_PROXY` dans le code avec `os.Setenv`", correct: false}
    answer: |-
      ```go
      t := http.DefaultTransport.(*http.Transport).Clone()
      t.MaxIdleConnsPerHost = 20
      client := &http.Client{Transport: t, Timeout: 10 * time.Second}
      ```
      Un Transport vide perd les réglages par défaut (proxy, délais, HTTP/2) ; on clone le transport par défaut et l'on
      change seulement ce qu'il faut.
  - key: scenario-diagnostic
    format: scenario
    question: Comment vérifies-tu que ton client réutilise bien ses connexions ?
    choices:
      - {text: "Avec `httptrace` : le rappel `GotConn` dit si chaque connexion est réutilisée", correct: true}
      - {text: "Avec `pprof`, dont le profil CPU compte les connexions ouvertes", correct: false}
      - {text: "Avec `GODEBUG=gctrace=1`, qui trace les connexions ramassées", correct: false}
      - {text: "En comptant les goroutines du service avec `runtime.NumGoroutine`", correct: false}
    answer: "Un `httptrace.ClientTrace` dont le rappel `GotConn` indique `Reused` pour chaque requête. En production, on compare le nombre de requêtes à celui des connexions ouvertes (métriques, sockets en TIME_WAIT) ; si la réutilisation est faible, on cherche un client par requête, un corps non lu ou un `MaxIdleConnsPerHost` trop bas."
  - key: scenario-reglage
    format: scenario
    question: Comment règles-tu le Transport d'un service qui appelle intensivement une seule API interne ?
    choices:
      - {text: "Transport cloné, `MaxIdleConnsPerHost` proche du parallélisme, `IdleConnTimeout` sous celui du serveur", correct: true}
      - {text: "Un `&http.Transport{}` vide, dont les valeurs zéro signifient « sans limite » partout", correct: false}
      - {text: "`DisableKeepAlives: true`, pour ne garder aucune connexion entre deux appels", correct: false}
      - {text: "Un transport par goroutine, pour que chacune garde sa propre connexion ouverte", correct: false}
    answer: "Je clone le transport par défaut, je fixe `MaxIdleConnsPerHost` vers le nombre d'appels simultanés (50 par exemple), éventuellement `MaxConnsPerHost` pour protéger l'API, un `IdleConnTimeout` inférieur à celui du serveur, et des délais de connexion et de TLS courts ; je vérifie la réutilisation avec `httptrace`."
  - key: scenario-dns
    format: scenario
    question: Avec des connexions réutilisées longtemps, ton client continue d'appeler d'anciennes instances après un changement de DNS. Que fais-tu ?
    choices:
      - {text: "Un `IdleConnTimeout` raisonnable, ou `CloseIdleConnections` après un changement", correct: true}
      - {text: "Désactiver complètement le cache DNS du système d'exploitation", correct: false}
      - {text: "Créer un client par requête, pour toujours résoudre le nom de nouveau", correct: false}
      - {text: "Redémarrer le service à chaque changement d'adresse des instances", correct: false}
    answer: "Les connexions gardées pointent vers les anciennes adresses. Un `IdleConnTimeout` raisonnable les renouvelle ; pour des connexions toujours actives, le serveur peut les fermer périodiquement (`Connection: close` après un certain âge), ou le client appeler `CloseIdleConnections`. Un répartiteur devant le service évite de dépendre du DNS."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi il ne faut pas créer un `http.Client` par requête. Que réponds-tu ?"
    choices:
      - {text: "Chaque nouveau transport repart de zéro : connexion TCP et négociation TLS à chaque appel", correct: true}
      - {text: "Un `http.Client` n'est pas sûr en concurrence, d'où un client par goroutine", correct: false}
      - {text: "Go limite à 100 le nombre de clients HTTP créés par un même programme", correct: false}
      - {text: "Un client créé dans une fonction est ramassé avant la fin de sa requête", correct: false}
    answer: "Le client s'appuie sur un `Transport` qui garde un pool de connexions par hôte. Un nouveau transport à chaque requête repart de zéro (connexion TCP, négociation TLS), et les anciennes connexions restent ouvertes un moment. Un client partagé, sûr entre goroutines, réutilise ses connexions."
