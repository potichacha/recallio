notion: client-reutilisation
lesson: "Un `http.Client` s'appuie sur un **`http.Transport`**, qui garde un **pool de connexions** (TCP et TLS) par hôte et\nles réutilise d'une requête à l'autre (keep-alive). Ouvrir une connexion TLS coûte plusieurs allers-retours réseau :\nla réutiliser est essentiel.\n\n```go\ntransport := &http.Transport{\n\tMaxIdleConns:        100,             // connexions inactives gardées au total\n\tMaxIdleConnsPerHost: 20,              // par hôte : 2 par défaut, souvent trop peu\n\tMaxConnsPerHost:     50,              // plafond de connexions par hôte (0 = illimité)\n\tIdleConnTimeout:     90 * time.Second,\n\tTLSHandshakeTimeout: 5 * time.Second,\n}\nclient := &http.Client{Transport: transport, Timeout: 10 * time.Second}\n```\n\nLes règles :\n- **un seul client** (et donc un seul transport) **partagé** pour tout le programme, ou un par service appelé : il\n  est sûr entre goroutines ;\n- créer un `http.Client` ou un `Transport` **par requête** empêche toute réutilisation : chaque appel refait une\n  connexion TLS, et les anciennes s'accumulent ;\n- une connexion n'est réutilisable que si le **corps** de la réponse a été **lu jusqu'au bout et fermé** ;\n- `MaxIdleConnsPerHost` vaut **2** par défaut (`http.DefaultMaxIdleConnsPerHost`) : un service qui appelle beaucoup le\n  même hôte en parallèle ouvre et ferme sans cesse des connexions ; on l'augmente ;\n- on part de `http.DefaultTransport.(*http.Transport).Clone()` pour garder les bons réglages par défaut (proxy,\n  délais de connexion, HTTP/2).\n\n**En entretien** : « Un client et un transport partagés ; le transport garde un pool de connexions par hôte ; lire et\nfermer le corps pour réutiliser ; MaxIdleConnsPerHost à 2 par défaut, à augmenter ; ne jamais créer un client par\nrequête. »"
cards:
  - key: seul-http-client-partage
    format: course
    question: Pourquoi un seul http.Client partagé ?
    answer: Pour réutiliser son pool de connexions ; en créer un par requête casse la réutilisation.
  - key: partager-seul-http-client
    format: course
    question: Pourquoi partager un seul http.Client ?
    answer: Il est sûr en concurrence et porte le pool de connexions.
  - key: vaut-maxidleconnsperhost-defaut
    format: course
    question: Que vaut MaxIdleConnsPerHost par défaut ?
    answer: 2, souvent trop bas pour des appels intensifs vers un même hôte.
  - key: clone
    format: course
    question: Pourquoi partir de `http.DefaultTransport.(*http.Transport).Clone()` pour configurer un transport ?
    answer: Il garde les réglages par défaut utiles (proxy depuis l'environnement, délais de connexion et de TLS, HTTP/2, IdleConnTimeout) qu'un `&http.Transport{}` vide n'a pas ; on ne change ensuite que ce qu'il faut.
  - key: vf-partage
    format: true-false
    question: Un http.Client peut être partagé par toutes les goroutines du programme.
    truth: true
    answer: Il est sûr entre goroutines, et c'est l'usage recommandé.
  - key: vf-par-requete
    format: true-false
    question: Créer un nouveau http.Client avec son Transport à chaque requête ne coûte rien.
    truth: false
    answer: Chaque appel refait la connexion TCP et TLS, et les connexions inactives s'accumulent.
  - key: vf-defaut
    format: true-false
    question: Par défaut, le transport garde au plus 2 connexions inactives par hôte.
    truth: true
    answer: DefaultMaxIdleConnsPerHost vaut 2.
  - key: vf-corps
    format: true-false
    question: Une connexion peut être réutilisée même si le corps de la réponse précédente n'a pas été lu ni fermé.
    truth: false
    answer: Il faut lire le corps jusqu'au bout et le fermer.
  - key: qcm-regles
    format: multiple-choice
    question: Quelles pratiques permettent de réutiliser les connexions ?
    choices:
      - text: Un client partagé, créé une fois
        correct: true
      - text: Lire puis fermer le corps de chaque réponse
        correct: true
      - text: Un MaxIdleConnsPerHost adapté au parallélisme vers l'hôte
        correct: true
      - text: Un nouveau Transport par requête
        correct: false
    answer: Le pool vit dans le Transport.
  - key: qcm-symptomes
    format: multiple-choice
    question: Quels symptômes trahissent une mauvaise réutilisation des connexions ?
    choices:
      - text: Des milliers de sockets en TIME_WAIT
        correct: true
      - text: Une latence plus élevée à cause des négociations TLS répétées
        correct: true
      - text: Des erreurs « too many open files »
        correct: true
      - text: Une baisse de la consommation mémoire
        correct: false
    answer: Chaque nouvelle connexion coûte du temps et des ressources.
  - key: qcm-reglages
    format: multiple-choice
    question: Que règle chaque champ du Transport ?
    choices:
      - text: 'MaxIdleConnsPerHost : les connexions inactives gardées par hôte'
        correct: true
      - text: 'MaxConnsPerHost : le plafond total de connexions par hôte'
        correct: true
      - text: 'IdleConnTimeout : la durée de vie d''une connexion inactive'
        correct: true
      - text: 'MaxIdleConns : le nombre maximal de requêtes simultanées'
        correct: false
    answer: MaxIdleConns compte les connexions inactives, tous hôtes confondus.
  - key: qcm-plusieurs
    format: multiple-choice
    question: Ton service appelle trois partenaires aux exigences différentes. Combien de clients ?
    choices:
      - text: Un client par partenaire, chacun créé une fois avec ses délais et son transport
        correct: true
      - text: Un seul client partagé, si les réglages conviennent aux trois
        correct: true
      - text: Un client par requête
        correct: false
      - text: Un client par goroutine
        correct: false
    answer: L'important est de les créer une fois et de les réutiliser.
  - key: bug-par-requete
    format: bug-fix
    question: "Le profil montre que la moitié du CPU part en négociations TLS :\n```go\nfunc (c *Catalogue) Produit(ctx context.Context, id string) (Produit, error) {\n\tclient := &http.Client{Transport: &http.Transport{}, Timeout: 5 * time.Second}\n\t// ...\n}\n```"
    answer: "```go\ntype Catalogue struct {\n\thttp *http.Client // créé une fois, partagé\n\tbase string\n}\n\nfunc NouveauCatalogue(base string) *Catalogue {\n\tt := http.DefaultTransport.(*http.Transport).Clone()\n\tt.MaxIdleConnsPerHost = 20\n\treturn &Catalogue{http: &http.Client{Transport: t, Timeout: 5 * time.Second}, base: base}\n}\n```\nUn transport par appel empêchait toute réutilisation ; un client partagé garde ses connexions."
  - key: bug-idle
    format: bug-fix
    question: |-
      Avec 50 goroutines qui appellent la même API, le nombre de connexions TCP ouvertes et fermées par seconde est énorme :
      ```go
      var client = &http.Client{Timeout: 5 * time.Second}
      ```
    answer: |-
      ```go
      t := http.DefaultTransport.(*http.Transport).Clone()
      t.MaxIdleConnsPerHost = 50
      var client = &http.Client{Transport: t, Timeout: 5 * time.Second}
      ```
      Par défaut, seules 2 connexions inactives sont gardées par hôte : les 48 autres étaient fermées après chaque
      requête, puis rouvertes.
  - key: bug-corps
    format: bug-fix
    question: "Les connexions ne sont jamais réutilisées, alors que le client est partagé :\n```go\nresp, err := client.Do(req)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\nif resp.StatusCode != http.StatusOK {\n\treturn fmt.Errorf(\"statut %d\", resp.StatusCode)\n}\n```"
    answer: "```go\nresp, err := client.Do(req)\nif err != nil {\n\treturn err\n}\ndefer resp.Body.Close()\nif resp.StatusCode != http.StatusOK {\n\tio.Copy(io.Discard, io.LimitReader(resp.Body, 64<<10))\n\treturn fmt.Errorf(\"statut %d\", resp.StatusCode)\n}\n```\nUn corps fermé sans être lu oblige à fermer la connexion ; on le lit jusqu'au bout (borné) avant de le fermer."
  - key: bug-transport-vide
    format: bug-fix
    question: |-
      Depuis le changement de configuration, le client ignore le proxy de l'entreprise et n'utilise plus HTTP/2 :
      ```go
      client := &http.Client{Transport: &http.Transport{MaxIdleConnsPerHost: 20}}
      ```
    answer: |-
      ```go
      t := http.DefaultTransport.(*http.Transport).Clone()
      t.MaxIdleConnsPerHost = 20
      client := &http.Client{Transport: t, Timeout: 10 * time.Second}
      ```
      Un Transport vide perd les réglages par défaut (proxy, délais, HTTP/2) ; on clone le transport par défaut et l'on
      change seulement ce qu'il faut.
  - key: scenario-diagnostic
    format: scenario
    question: Comment vérifies-tu que ton client réutilise bien ses connexions ?
    answer: |-
      Avec `net/http/httptrace` : un `ClientTrace` dont le rappel `GotConn` indique `Reused` pour chaque requête. En
      production, je compare le nombre de requêtes au nombre de connexions ouvertes (métriques, `ss -s`, sockets en
      TIME_WAIT). Si la réutilisation est faible, je cherche un client créé par requête, un corps non lu ou un
      MaxIdleConnsPerHost trop bas.
  - key: scenario-reglage
    format: scenario
    question: Comment règles-tu le Transport d'un service qui appelle intensivement une seule API interne ?
    answer: |-
      Je clone le transport par défaut, je fixe MaxIdleConnsPerHost à peu près au nombre d'appels simultanés vers cet
      hôte (par exemple 50), éventuellement MaxConnsPerHost pour ne pas saturer l'API, un IdleConnTimeout inférieur à
      celui du serveur appelé, et des délais de connexion et de TLS courts. Je vérifie avec httptrace et les métriques que
      les connexions sont réutilisées.
  - key: scenario-dns
    format: scenario
    question: Avec des connexions réutilisées longtemps, ton client continue d'appeler d'anciennes instances après un changement de DNS. Que fais-tu ?
    answer: |-
      Les connexions gardées pointent vers les anciennes adresses. Un IdleConnTimeout raisonnable les renouvelle
      quand elles sont inactives ; pour des connexions toujours actives, le serveur peut les fermer périodiquement
      (en-tête Connection: close après un certain âge), ou le client appeler `CloseIdleConnections` après un changement.
      Pour l'équilibrage interne, un répartiteur de charge devant le service évite de dépendre du DNS côté client.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande pourquoi il ne faut pas créer un http.Client par requête.
    answer: |-
      Le client s'appuie sur un Transport qui garde un pool de connexions par hôte. Un nouveau client avec un nouveau
      transport à chaque requête repart de zéro : connexion TCP, négociation TLS, démarrage lent, soit plusieurs
      allers-retours réseau, et les anciennes connexions restent ouvertes un moment. Un client partagé, sûr entre
      goroutines, réutilise ses connexions et divise la latence et le CPU.
