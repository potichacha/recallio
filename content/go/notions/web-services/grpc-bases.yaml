notion: grpc-bases
lesson: "**gRPC** est un cadre d'appels de procédure à distance : on décrit un **service** dans le `.proto`, on génère le code\nclient et serveur, et l'on appelle des méthodes distantes comme des fonctions. Il s'appuie sur **HTTP/2** et\nProtobuf.\n\n```protobuf\nservice Catalogue {\n  rpc LireProduit(LireProduitRequete) returns (Produit);\n}\n```\n\nCôté serveur, on implémente l'interface générée, en **incorporant** `UnimplementedCatalogueServer` (compatibilité\nquand de nouvelles méthodes sont ajoutées au service) :\n\n```go\ntype serveurCatalogue struct {\n\tcataloguev1.UnimplementedCatalogueServer\n\tdepot Depot\n}\n\nfunc (s *serveurCatalogue) LireProduit(ctx context.Context, req *cataloguev1.LireProduitRequete) (*cataloguev1.Produit, error) {\n\tp, err := s.depot.Trouver(ctx, req.GetId())\n\tif errors.Is(err, ErrIntrouvable) {\n\t\treturn nil, status.Error(codes.NotFound, \"produit introuvable\")\n\t}\n\tif err != nil {\n\t\treturn nil, status.Error(codes.Internal, \"erreur interne\")\n\t}\n\treturn versProto(p), nil\n}\n\nsrv := grpc.NewServer()\ncataloguev1.RegisterCatalogueServer(srv, &serveurCatalogue{depot: d})\nsrv.Serve(ecouteur)\n```\n\nCôté client :\n\n```go\nconn, err := grpc.NewClient(\"dns:///catalogue:50051\",\n\tgrpc.WithTransportCredentials(credentials.NewTLS(cfgTLS)))\ndefer conn.Close()\nclient := cataloguev1.NewCatalogueClient(conn) // partagé, sûr entre goroutines\nctx, cancel := context.WithTimeout(ctx, time.Second)\ndefer cancel()\np, err := client.LireProduit(ctx, &cataloguev1.LireProduitRequete{Id: \"42\"})\n```\n\nCe qu'il faut savoir :\n- **une connexion** (`*grpc.ClientConn`) se crée **une fois** et se partage : elle multiplexe les appels sur HTTP/2 ;\n- `grpc.NewClient` remplace `grpc.Dial` (déprécié) et ne se connecte qu'au premier appel ;\n- HTTP/2 garde une connexion longue : derrière un Service Kubernetes classique, tout le trafic d'un client va vers\n  **un seul pod** ; il faut un équilibrage côté client (`round_robin` avec un service headless) ou un maillage ;\n- les getters générés (`req.GetId()`) gèrent un message nil sans paniquer.\n\n**En entretien** : « Service décrit en .proto, code généré ; serveur avec Unimplemented incorporé ; une ClientConn\npartagée, NewClient ; délai par appel via le contexte ; HTTP/2, donc attention à l'équilibrage. »"
cards:
  - key: repose-grpc
    format: course
    question: Sur quoi repose gRPC ?
    choices:
      - {text: "Sur Protocol Buffers pour la sérialisation, et HTTP/2 pour le transport", correct: true}
      - {text: "Sur JSON pour la sérialisation, et HTTP/1.1 pour le transport", correct: false}
      - {text: "Sur Protocol Buffers pour la sérialisation, et UDP pour le transport", correct: false}
      - {text: "Sur XML pour la sérialisation, et WebSocket pour le transport", correct: false}
    answer: "gRPC sérialise ses messages en Protocol Buffers, binaires et typés, et les transporte sur HTTP/2, qui multiplexe les appels et permet les flux dans les deux sens."
  - key: generer-code-depuis-proto
    format: course
    question: "Comment générer le code Go à partir d'un fichier `.proto` ?"
    choices:
      - {text: "Avec `protoc`, `protoc-gen-go` et `protoc-gen-go-grpc`, ou `buf generate`", correct: true}
      - {text: "Avec `go generate` seul, qui lit les `.proto` sans autre outil", correct: false}
      - {text: "Avec `go build`, qui compile les `.proto` comme des fichiers Go", correct: false}
      - {text: "Avec `gofmt -proto`, qui convertit le schéma en structs Go", correct: false}
    answer: "`protoc` avec les greffons `protoc-gen-go` (messages) et `protoc-gen-go-grpc` (services), ou `buf generate`, qui les pilote. `go generate` peut lancer ces commandes, mais ne sait pas lire un `.proto` seul."
  - key: sert-unimplementedxxxserver
    format: course
    question: "À quoi sert l'intégration de `UnimplementedXxxServer` dans l'implémentation d'un service gRPC ?"
    choices:
      - {text: "À rester compatible quand de nouvelles méthodes sont ajoutées au service", correct: true}
      - {text: "À marquer le service comme en cours de développement dans la réflexion", correct: false}
      - {text: "À renvoyer `codes.NotFound` pour toutes les méthodes qu'on n'a pas écrites", correct: false}
      - {text: "À désactiver le service tant qu'il n'est pas entièrement implémenté", correct: false}
    answer: "En intégrant `UnimplementedXxxServer`, l'implémentation satisfait toujours l'interface générée, même quand le `.proto` gagne une méthode : celle-ci répond `codes.Unimplemented` au lieu de casser la compilation."
  - key: grpc-dial-grpc-newclient
    format: course
    question: "Pour créer un client gRPC, faut-il utiliser `grpc.Dial` ou `grpc.NewClient` ?"
    choices:
      - {text: "`grpc.NewClient` ; `grpc.Dial` est déprécié", correct: true}
      - {text: "`grpc.Dial` ; `grpc.NewClient` est expérimental", correct: false}
      - {text: "`grpc.Dial`, seul à accepter des options TLS", correct: false}
      - {text: "Indifféremment : deux noms du même appel", correct: false}
    answer: "`grpc.NewClient` remplace `grpc.Dial`, déprécié. Il ne se connecte pas tout de suite : la connexion s'établit au premier appel, et le résolveur par défaut est `dns`."
  - key: creer-connexion-appel
    format: course
    question: "Faut-il créer une connexion gRPC par appel ?"
    choices:
      - {text: "Non : une connexion gRPC est multiplexée et se partage", correct: true}
      - {text: "Oui : une connexion ne porte qu'un appel à la fois", correct: false}
      - {text: "Oui, pour que chaque appel ait son propre délai", correct: false}
      - {text: "Non, mais il en faut une par goroutine appelante", correct: false}
    answer: "Une `ClientConn` multiplexe de nombreux appels simultanés sur HTTP/2 et est sûre en concurrence : on la crée au démarrage et on la partage. Le délai se fixe par appel, dans le contexte."
  - key: trafic-grpc-concentre-pod-derriere-service
    format: course
    question: Pourquoi le trafic gRPC se concentre-t-il sur un pod derrière un Service Kubernetes ?
    choices:
      - {text: "L'équilibrage se fait par connexion, et la connexion HTTP/2 est longue et multiplexée", correct: true}
      - {text: "gRPC n'accepte qu'un seul serveur à la fois, choisi au démarrage du client", correct: false}
      - {text: "Kubernetes désactive HTTP/2 entre les pods, et gRPC se rabat sur un seul", correct: false}
      - {text: "Le Service envoie toujours le trafic gRPC vers le pod le plus ancien", correct: false}
    answer: "Le Service répartit des connexions, pas des requêtes ; une connexion HTTP/2 dure longtemps et porte tous les appels, donc tout part vers le même pod. Remèdes : équilibrage côté client (service headless et `round_robin`) ou un maillage de services."
  - key: connect
    format: course
    question: "Pourquoi choisir Connect (connectrpc.com) pour un nouveau service appelé depuis un navigateur ?"
    choices:
      - {text: "Il sert le même service en gRPC, gRPC-Web et JSON, sur des handlers `net/http`", correct: true}
      - {text: "Il remplace HTTP/2 par WebSocket, seul transport que les navigateurs acceptent", correct: false}
      - {text: "Il génère automatiquement une interface web d'administration du service", correct: false}
      - {text: "Il chiffre les messages Protobuf, ce que gRPC ne sait pas faire seul", correct: false}
    answer: "Connect (de Buf) sert un même service en gRPC, gRPC-Web et JSON sur HTTP/1.1 ou HTTP/2, avec des handlers `net/http` ordinaires : un navigateur peut l'appeler avec `fetch`."
  - key: sert-grpc-gateway
    format: course
    question: À quoi sert grpc-gateway ?
    choices:
      - {text: "À exposer une API REST/JSON générée devant un service gRPC", correct: true}
      - {text: "À répartir les appels gRPC entre plusieurs serveurs", correct: false}
      - {text: "À générer des clients gRPC pour le navigateur", correct: false}
      - {text: "À authentifier les appels gRPC entrants par des JWT", correct: false}
    answer: "grpc-gateway génère, à partir d'annotations HTTP dans le `.proto`, un proxy qui traduit des appels REST/JSON en appels gRPC. Il ne répartit pas la charge et ne sert pas de client navigateur."
  - key: passer-communications-internes-rest-grpc
    format: scenario
    question: Faut-il passer les communications internes de REST à gRPC ?
    choices:
      - {text: "Ça dépend : gRPC vaut le coup si les contrats dérivent entre équipes ou si la latence compte", correct: true}
      - {text: "Oui, toujours : gRPC est plus rapide et n'a aucun inconvénient face à REST", correct: false}
      - {text: "Non, jamais : gRPC ne fonctionne pas dans Kubernetes sans maillage de services", correct: false}
      - {text: "Oui, mais seulement pour les appels du navigateur, que gRPC simplifie beaucoup", correct: false}
    answer: "gRPC apporte un contrat strict généré, de meilleures performances, le streaming et la propagation des échéances ; en échange, un outillage de génération, un débogage moins direct (`grpcurl`), un équilibrage à revoir dans Kubernetes et gRPC-Web ou Connect pour le navigateur. Pour quelques appels peu fréquents, REST avec OpenAPI suffit."
  - key: definition-connect
    format: definition
    question: "Que désigne « Connect », de Buf ?"
    choices:
      - {text: "Un protocole et des bibliothèques compatibles gRPC, construits sur `net/http`", correct: true}
      - {text: "Un proxy qui traduit des appels REST/JSON en appels gRPC", correct: false}
      - {text: "Le registre de schémas `.proto` hébergé par Buf", correct: false}
      - {text: "La méthode de `grpc.ClientConn` qui ouvre la connexion", correct: false}
    answer: "Connect est un protocole et une famille de bibliothèques de Buf, compatibles gRPC et gRPC-Web, construits sur `net/http`. Le proxy REST vers gRPC, c'est grpc-gateway."
  - key: definition-grpc
    format: definition
    question: "Que désigne « gRPC » ?"
    choices:
      - {text: "Un cadre d'appels de procédure à distance sur HTTP/2 et Protobuf", correct: true}
      - {text: "Un format de sérialisation binaire, décrit dans des fichiers `.proto`", correct: false}
      - {text: "Une API REST décrite par OpenAPI, avec des clients générés", correct: false}
      - {text: "Un courtier de messages asynchrones, à la manière de Kafka", correct: false}
    answer: "gRPC est un cadre de RPC : on appelle une méthode d'un service distant comme une fonction, avec des messages Protobuf transportés sur HTTP/2. Protobuf seul n'est que le format de sérialisation."
  - key: vf-http2
    format: true-false
    question: gRPC repose sur HTTP/2.
    truth: true
    answer: Ce qui permet le multiplexage et les flux.
  - key: vf-conn-par-appel
    format: true-false
    question: Il faut créer une ClientConn par appel gRPC.
    truth: false
    answer: On la crée une fois et on la partage ; elle multiplexe les appels.
  - key: vf-newclient
    format: true-false
    question: '`grpc.NewClient` établit la connexion immédiatement et échoue si le serveur est injoignable.'
    truth: false
    answer: Il se connecte paresseusement, au premier appel ; c'est l'appel qui échoue alors.
  - key: vf-unimplemented
    format: true-false
    question: Incorporer UnimplementedXxxServer permet au serveur de compiler quand une méthode est ajoutée au service.
    truth: true
    answer: La nouvelle méthode renvoie Unimplemented en attendant son implémentation.
  - key: qcm-etapes
    format: multiple-choice
    question: "Laquelle de ces étapes est inutile pour exposer un service gRPC en Go ?"
    choices:
      - {text: "Écrire à la main la sérialisation des messages", correct: true}
      - {text: "Décrire le service et ses messages dans un `.proto`", correct: false}
      - {text: "Générer le code avec `protoc-gen-go` et `protoc-gen-go-grpc` (ou buf)", correct: false}
      - {text: "Implémenter l'interface générée et l'enregistrer sur un `grpc.Server`", correct: false}
    answer: "La sérialisation est générée à partir du `.proto`. Il reste à décrire le service, générer le code, implémenter l'interface et l'enregistrer sur un `grpc.Server`."
  - key: qcm-equilibrage
    format: multiple-choice
    question: "Le trafic gRPC d'un client se concentre sur un seul pod derrière un Service Kubernetes. Quel remède choisis-tu ?"
    choices:
      - {text: "Un service headless et l'équilibrage `round_robin` côté client", correct: true}
      - {text: "Plus de réplicas du pod, que le Service répartira mieux", correct: false}
      - {text: "Une nouvelle connexion gRPC par appel, pour changer de pod", correct: false}
      - {text: "Passer le Service en `type: LoadBalancer`", correct: false}
    answer: "Le Service équilibre les connexions, et HTTP/2 garde la sienne longtemps : avec un service headless, le client voit toutes les adresses et répartit ses appels en `round_robin`. Un maillage de services fait de même ; une connexion par appel perdrait le multiplexage."
  - key: qcm-delai
    format: multiple-choice
    question: "Lesquelles de ces affirmations sur le délai d'un appel gRPC sont justes ?"
    choices:
      - text: Passer un contexte avec WithTimeout à la méthode du client
        correct: true
      - text: Le délai est transmis au serveur, qui reçoit un contexte avec la même échéance
        correct: true
      - text: Avec une option grpc.Timeout sur le serveur uniquement
        correct: false
      - text: Il n'y a pas de délai en gRPC
        correct: false
    answer: L'échéance voyage dans l'en-tête grpc-timeout.
  - key: qcm-vs-rest
    format: multiple-choice
    question: "Lequel de ces points n'est pas un avantage de gRPC sur REST/JSON entre services internes ?"
    choices:
      - {text: "Un débogage plus simple avec curl", correct: true}
      - {text: "Un contrat typé et du code client généré", correct: false}
      - {text: "Des messages binaires compacts et des connexions multiplexées", correct: false}
      - {text: "Les flux dans les deux sens", correct: false}
    answer: "Au contraire : déboguer gRPC demande `grpcurl` et la réflexion du serveur. Contrat typé, messages compacts, multiplexage et flux bidirectionnels sont ses vrais avantages."
  - key: scenario-client
    format: scenario
    question: Comment intègres-tu un client gRPC dans ton service ?
    choices:
      - {text: "Une `ClientConn` créée au démarrage, avec TLS, `round_robin` et intercepteurs, puis partagée", correct: true}
      - {text: "Un `grpc.NewClient` par appel, fermé dès que la réponse est reçue", correct: false}
      - {text: "Une `ClientConn` sans TLS ni délai, pour simplifier le code du service", correct: false}
      - {text: "Un appel REST à la place, gRPC n'ayant pas de client officiel en Go", correct: false}
    answer: "Au démarrage, `grpc.NewClient` avec l'adresse (`dns:///catalogue:50051`), les identifiants TLS, l'équilibrage `round_robin` et des intercepteurs (traces, métriques, réessais) ; la connexion est fermée à l'arrêt. Le client généré est injecté derrière une petite interface, et chaque appel prend le contexte de la requête et un délai propre."
  - key: scenario-tester
    format: scenario
    question: Comment testes-tu un serveur gRPC sans ouvrir de port réseau ?
    choices:
      - {text: "Avec `bufconn`, un écouteur en mémoire sur lequel tourne le vrai `grpc.Server`", correct: true}
      - {text: "En appelant les méthodes de l'implémentation, ce qui teste aussi les intercepteurs", correct: false}
      - {text: "En lançant le serveur sur le port 50051, partagé par tous les tests", correct: false}
      - {text: "Avec `httptest.NewServer`, qui comprend gRPC sans configuration", correct: false}
    answer: "`google.golang.org/grpc/test/bufconn` fournit un écouteur en mémoire : on y démarre le vrai `grpc.Server`, et l'on crée un client avec un dialer qui l'utilise. On vérifie les réponses et les codes d'erreur (`status.Code(err)`), délais compris, sans réseau."
  - key: scenario-exposer-rest
    format: scenario
    question: Ton service est en gRPC, mais un client web doit l'appeler en JSON. Quelles options ?
    choices:
      - {text: "Connect pour un nouveau service, grpc-gateway si l'existant l'utilise déjà", correct: true}
      - {text: "Réécrire tout le service en REST, gRPC ne pouvant pas servir de JSON", correct: false}
      - {text: "Demander au client web d'ouvrir une connexion HTTP/2 brute vers le serveur", correct: false}
      - {text: "Encoder les messages Protobuf en base64 dans des requêtes GET", correct: false}
    answer: "grpc-gateway génère un proxy REST/JSON à partir d'annotations HTTP dans le `.proto` ; Connect sert un même service en gRPC, gRPC-Web et JSON, appelable avec `fetch` ; un handler écrit à la main convient pour une ou deux routes."
  - key: definition-clientconn
    format: definition
    question: "Que désigne une `ClientConn` en gRPC ?"
    choices:
      - {text: "La connexion client, partagée entre les appels qu'elle multiplexe sur HTTP/2", correct: true}
      - {text: "Une connexion ouverte pour un seul appel, et fermée à sa réponse", correct: false}
      - {text: "Le côté serveur d'un flux, qui reçoit les messages du client", correct: false}
      - {text: "Le pool de connexions à la base dont dispose un serveur gRPC", correct: false}
    answer: "Une `*grpc.ClientConn`, créée par `grpc.NewClient`, représente la connexion vers un service ; sûre en concurrence, elle multiplexe tous les appels sur HTTP/2 et se partage dans le programme."
  - key: definition-unaire
    format: definition
    question: "Que désigne un appel unaire en gRPC ?"
    choices:
      - {text: "Un appel avec une requête et une réponse, comme un appel de fonction", correct: true}
      - {text: "Un appel sans réponse, dont le client n'attend rien en retour", correct: false}
      - {text: "Un appel qui envoie un flux de requêtes et reçoit une seule réponse", correct: false}
      - {text: "Un appel réservé à un seul client à la fois sur le serveur", correct: false}
    answer: "Un appel unaire envoie une requête et reçoit une réponse, comme un appel de fonction. Les flux (serveur, client ou bidirectionnels) échangent plusieurs messages."
