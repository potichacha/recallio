notion: grpc-bases
cards:
  - key: repose-grpc
    format: course
    question: Sur quoi repose gRPC ?
    answer: Sur Protocol Buffers pour la sérialisation et HTTP/2 pour le transport.
  - key: generer-code-depuis-proto
    format: course
    question: Comment générer le code Go depuis un .proto ?
    answer: protoc avec protoc-gen-go et protoc-gen-go-grpc, ou buf generate.
  - key: sert-unimplementedxxxserver
    format: course
    question: À quoi sert UnimplementedXxxServer ?
    answer: À rester compatible quand de nouvelles méthodes sont ajoutées au service.
  - key: grpc-dial-grpc-newclient
    format: course
    question: grpc.Dial ou grpc.NewClient ?
    answer: grpc.NewClient ; Dial est déprécié.
  - key: creer-connexion-appel
    format: course
    question: Faut-il créer une connexion par appel ?
    answer: Non, une connexion gRPC est multiplexée et doit être partagée.
  - key: trafic-grpc-concentre-pod-derriere-service
    format: course
    question: Pourquoi le trafic gRPC se concentre-t-il sur un pod derrière un Service Kubernetes ?
    answer: L'équilibrage se fait par connexion, et la connexion HTTP/2 est longue et multiplexée.
  - key: connect
    format: course
    question: C'est quoi Connect ?
    answer: Une implémentation compatible gRPC, gRPC-Web et HTTP/JSON simple, construite sur net/http.
  - key: sert-grpc-gateway
    format: course
    question: À quoi sert grpc-gateway ?
    answer: Exposer une API REST/JSON générée devant un service gRPC.
  - key: passer-communications-internes-rest-grpc
    format: scenario
    question: Faut-il passer les communications internes de REST à gRPC ?
    answer: |-
      Ça dépend de la douleur actuelle. gRPC apporte un **contrat strict** généré pour tous les langages, de meilleures performances (binaire, HTTP/2 multiplexé), le streaming et la propagation des deadlines. En contrepartie : un outillage de génération à maintenir, un débogage moins direct (pas de `curl`, il faut `grpcurl` et la reflection), un équilibrage de charge à revoir en Kubernetes, et des clients navigateur qui ont besoin de gRPC-Web ou de Connect.
      Si les problèmes sont des contrats d'API qui dérivent entre équipes ou des latences inter-services, gRPC (ou Connect, qui garde une compatibilité HTTP simple) est un bon choix. Pour quelques appels peu fréquents, REST avec OpenAPI et génération de clients suffit.
  - key: definition-connect
    format: definition
    question: Connect
    answer: Protocole et bibliothèques compatibles gRPC sur net/http (Buf)
  - key: definition-grpc
    format: definition
    question: gRPC
    answer: RPC sur HTTP/2 et Protobuf
