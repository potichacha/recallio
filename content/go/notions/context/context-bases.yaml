notion: context-bases
lesson: "Un **`context.Context`** accompagne une opération (une requête HTTP, un job) à travers tous les appels qu'elle\ndéclenche. Il transporte trois choses :\n- un signal d'**annulation** : le client s'est déconnecté, l'opération n'a plus de raison de continuer ;\n- une **échéance** (*deadline*) : l'opération doit avoir fini avant telle heure ;\n- quelques **valeurs** propres à la requête (identifiant de trace, utilisateur authentifié).\n\n```go\ntype Context interface {\n\tDeadline() (deadline time.Time, ok bool)\n\tDone() <-chan struct{} // fermé quand le contexte est annulé ou expiré\n\tErr() error            // nil, context.Canceled ou context.DeadlineExceeded\n\tValue(key any) any\n}\n```\n\nLes contextes forment un **arbre** : on dérive un enfant d'un parent (`WithCancel`, `WithTimeout`, `WithValue`...).\nAnnuler un parent annule **tous ses descendants** ; annuler un enfant ne touche pas le parent.\n\nLes racines :\n- **`context.Background()`** : au sommet du programme (`main`, initialisation, tests) ;\n- **`context.TODO()`** : identique, mais signale « je n'ai pas encore le bon contexte ici » (code en cours de\n  migration).\n\nDans un serveur HTTP, `r.Context()` est déjà le contexte de la requête, annulé quand le client se déconnecte ou que\nle handler rend la main. On le passe à **tout ce qui bloque** : requêtes SQL (`QueryContext`), appels HTTP\n(`http.NewRequestWithContext`), attentes sur des channels.\n\nUn contexte est **immuable** et **sûr entre goroutines** : on peut passer le même à plusieurs goroutines.\n\n**En entretien** : « Annulation, échéance et valeurs de requête, propagées en arbre ; Background à la racine, TODO\nprovisoire ; on le passe à tout appel bloquant. »"
cards:
  - key: sert-context-context
    format: course
    question: "À quoi sert `context.Context` en Go ?"
    choices:
      - {text: "À propager l'annulation, l'échéance et des valeurs de requête à travers les appels", correct: true}
      - {text: "À stocker l'état global de l'application, accessible depuis toutes les goroutines", correct: false}
      - {text: "À rattacher des données à la goroutine courante, comme un `ThreadLocal` en Java", correct: false}
      - {text: "À passer les dépendances d'un service, comme la base ou le logger, sans constructeur", correct: false}
    answer: "À propager l'annulation, l'échéance et des valeurs de portée requête le long des appels, en premier paramètre. Rien n'est attaché à la goroutine : contrairement à un `ThreadLocal`, le contexte voyage explicitement."
  - key: background-vs-todo
    format: course
    question: "Quelle différence entre `context.Background()` et `context.TODO()` ?"
    choices:
      - {text: "Background est la racine normale ; TODO marque un contexte pas encore relié", correct: true}
      - {text: "Background ne s'annule jamais ; TODO s'annule à la fin du programme", correct: false}
      - {text: "Background sert en production ; TODO est réservé aux tests unitaires", correct: false}
      - {text: "Background est partagé par tout le programme ; TODO en crée un neuf", correct: false}
    answer: "Les deux sont des contextes vides, jamais annulés. Background est la racine normale (main, tests) ; TODO marque un endroit où le bon contexte n'est pas encore connu, pour le retrouver lors d'une migration."
  - key: definition-context
    format: definition
    question: "Que désigne le package `context` en Go ?"
    choices:
      - {text: "Le package qui propage l'annulation, l'échéance et des valeurs de requête", correct: true}
      - {text: "Le package qui fournit un stockage propre à chaque goroutine, comme `ThreadLocal`", correct: false}
      - {text: "Le package qui gère les variables d'environnement et la configuration", correct: false}
      - {text: "Le package qui planifie les goroutines et règle `GOMAXPROCS`", correct: false}
    answer: "Le package qui propage l'annulation, l'échéance et des valeurs de requête à travers les appels. Go n'a pas de stockage par goroutine : le contexte se passe en paramètre. Les goroutines, c'est `runtime`."
  - key: arbre
    format: course
    question: Que se passe-t-il pour les contextes enfants quand on annule un parent ?
    choices:
      - {text: "Ils sont tous annulés, récursivement, jusqu'aux descendants les plus lointains", correct: true}
      - {text: "Rien : chaque enfant doit être annulé par sa propre fonction cancel", correct: false}
      - {text: "Seuls les enfants directs sont annulés, pas leurs propres enfants", correct: false}
      - {text: "Ils sont annulés à la fin de leur propre délai, s'ils en ont un, pas avant", correct: false}
    answer: Ils sont tous annulés, récursivement ; à l'inverse, annuler un enfant ne touche ni le parent ni ses frères.
  - key: r-context
    format: course
    question: D'où vient le contexte d'une requête dans un serveur net/http, et quand est-il annulé ?
    choices:
      - {text: "De `r.Context()` : annulé si le client part ou quand `ServeHTTP` rend la main", correct: true}
      - {text: "De `context.Background()`, que le handler crée lui-même à chaque requête", correct: false}
      - {text: "De `r.Context()` : annulé seulement à l'arrêt du serveur par `Shutdown`", correct: false}
      - {text: "De `r.Context()`, jamais annulé : le handler doit fixer son propre délai", correct: false}
    answer: De `r.Context()` ; il est annulé quand le client ferme la connexion, quand la requête HTTP/2 est annulée, ou quand ServeHTTP rend la main.
  - key: vf-immuable
    format: true-false
    question: 'Un context.Context est immuable : WithTimeout renvoie un nouveau contexte au lieu de modifier le parent.'
    truth: true
    answer: On dérive des enfants, on ne modifie jamais un contexte.
  - key: vf-goroutines
    format: true-false
    question: On peut passer le même contexte à plusieurs goroutines.
    truth: true
    answer: Il est sûr entre goroutines.
  - key: vf-todo
    format: true-false
    question: '`context.TODO()` se comporte différemment de `context.Background()` à l''exécution.'
    truth: false
    answer: Ils sont identiques ; TODO sert seulement à signaler un contexte à remplacer.
  - key: vf-enfant-parent
    format: true-false
    question: Annuler un contexte enfant annule aussi son parent.
    truth: false
    answer: L'annulation descend l'arbre, elle ne remonte pas.
  - key: qcm-transporte
    format: multiple-choice
    question: "Lesquelles de ces informations un `context.Context` transporte-t-il ?"
    choices:
      - text: Un signal d'annulation
        correct: true
      - text: Une échéance
        correct: true
      - text: Des valeurs propres à la requête
        correct: true
      - text: Les paramètres métier de la fonction
        correct: false
    answer: "Un signal d'annulation, une échéance et des valeurs propres à la requête. Les paramètres métier restent des arguments explicites."
  - key: qcm-racine
    format: multiple-choice
    question: "Où `context.Background()` a-t-il sa place ?"
    choices:
      - {text: "Dans `main`, pour la racine du programme", correct: true}
      - {text: "Dans un handler HTTP, à la place de `r.Context()`", correct: false}
      - {text: "Dans une fonction de bibliothèque qui reçoit déjà un ctx", correct: false}
      - {text: "Dans un service, pour ignorer un délai jugé trop court", correct: false}
    answer: "Dans `main`, et dans un test (où `t.Context()` existe aussi depuis Go 1.24) : c'est une racine. Ailleurs, remplacer le contexte reçu perdrait l'annulation et l'échéance de l'appelant."
  - key: qcm-err
    format: multiple-choice
    question: "Que renvoie `ctx.Err()` une fois le délai d'un `WithTimeout` expiré ?"
    choices:
      - {text: "`context.DeadlineExceeded`", correct: true}
      - {text: "`context.Canceled`", correct: false}
      - {text: "`nil`, tant que `cancel()` n'a pas été appelé", correct: false}
      - {text: "`os.ErrDeadlineExceeded`", correct: false}
    answer: "`context.DeadlineExceeded`, qui se reconnaît avec `errors.Is`. `context.Canceled` vient d'un appel à `cancel()` ; `os.ErrDeadlineExceeded` est l'erreur des échéances d'entrée-sortie (`SetDeadline`), pas celle du contexte."
  - key: qcm-passer
    format: multiple-choice
    question: "Laquelle de ces opérations d'un handler doit recevoir son contexte ?"
    choices:
      - {text: "Une requête SQL, avec `db.QueryContext`", correct: true}
      - {text: "Une mise en majuscules, avec `strings.ToUpper`", correct: false}
      - {text: "Un formatage de message, avec `fmt.Sprintf`", correct: false}
      - {text: "Un tri en mémoire, avec `slices.Sort`", correct: false}
    answer: "Le contexte va aux opérations qui peuvent bloquer ou durer : une requête SQL (`db.QueryContext`), un appel HTTP sortant (`http.NewRequestWithContext`). Un calcul en mémoire, rapide, n'en a pas besoin."
  - key: trous-background
    format: fill-in
    question: |-
      Complète la racine de main :
      ```go
      func main() {
      	ctx := context.___()
      	if err := run(ctx); err != nil {
      		log.Fatal(err)
      	}
      }
      ```
    blanks:
      - - Background
    answer: Background est la racine.
  - key: trous-requete
    format: fill-in
    question: |-
      Complète pour récupérer le contexte de la requête :
      ```go
      func handler(w http.ResponseWriter, r *http.Request) {
      	ctx := r.___()
      	produits, err := depot.Lister(ctx)
      	// ...
      }
      ```
    blanks:
      - - Context
    answer: r.Context() est annulé quand le client part.
  - key: trous-done
    format: fill-in
    question: |-
      Complète pour attendre l'annulation :
      ```go
      select {
      case <-ctx.___():
      	return ctx.Err()
      case r := <-resultats:
      	return r
      }
      ```
    blanks:
      - - Done
    answer: Done renvoie un channel fermé à l'annulation.
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature idiomatique :
      ```go
      func (d *Depot) Trouver(___ context.Context, id string) (Produit, error)
      ```
    blanks:
      - - ctx
    answer: Le contexte est le premier paramètre, nommé ctx.
  - key: scenario-propagation
    format: scenario
    question: Un client HTTP abandonne une requête lente. Comment t'assures-tu que le serveur arrête vraiment le travail ?
    choices:
      - {text: "Passer `r.Context()` à chaque appel bloquant : `QueryContext`, requêtes sortantes, `select` sur `Done`", correct: true}
      - {text: "Rien de plus : le serveur arrête de lui-même le handler quand le client se déconnecte", correct: false}
      - {text: "Vérifier `r.Context().Err()` une seule fois, au début du handler, avant de travailler", correct: false}
      - {text: "Lancer le travail dans une goroutine, et l'abandonner dès que la connexion se ferme", correct: false}
    answer: |-
      Le contexte `r.Context()` est annulé à la déconnexion ; il faut qu'il descende jusqu'à chaque appel bloquant :
      `QueryContext` pour la base, `NewRequestWithContext` pour les appels sortants, `select` avec `ctx.Done()` dans
      les attentes et les boucles longues. Je vérifie par un test qui annule le contexte et observe que la requête SQL
      est interrompue et qu'aucune goroutine ne reste (goleak).
  - key: scenario-migration
    format: scenario
    question: Tu ajoutes la gestion du contexte dans une vieille base de code qui n'en a pas. Comment procèdes-tu ?
    choices:
      - {text: "Du haut vers le bas : `ctx` en premier paramètre, couche par couche, `context.TODO()` en attendant", correct: true}
      - {text: "Un `context.Background()` créé dans chaque fonction qui en a besoin, sans toucher aux signatures", correct: false}
      - {text: "Le contexte de chaque requête rangé dans une variable globale, lue par les couches basses", correct: false}
      - {text: "Du bas vers le haut : un contexte dans chaque struct de dépôt, initialisé au démarrage", correct: false}
    answer: |-
      Du haut vers le bas : les points d'entrée (handlers, consommateurs de messages) ont déjà un contexte ; j'ajoute
      `ctx context.Context` en premier paramètre des fonctions qu'ils appellent, couche par couche, et je mets
      `context.TODO()` là où la chaîne n'est pas encore reliée, pour les retrouver facilement. Je finis par les appels
      bloquants (`QueryContext`, requêtes HTTP), qui donnent tout l'intérêt de la migration.
  - key: scenario-vs-java
    format: scenario
    question: Comment expliques-tu le contexte Go à un développeur Java ?
    choices:
      - {text: "L'équivalent explicite de l'interruption, du délai d'un `Future` et des données d'un `ThreadLocal`", correct: true}
      - {text: "Un `ThreadLocal` attaché à la goroutine, que chaque fonction lit sans le recevoir en paramètre", correct: false}
      - {text: "Un équivalent de `Thread.stop()` : il arrête de force la goroutine qui l'a reçu, à l'annulation", correct: false}
      - {text: "Un objet de configuration global, comme l'`ApplicationContext` de Spring, partagé par tous", correct: false}
    answer: |-
      C'est l'équivalent explicite de ce que Java fait souvent implicitement : l'interruption d'un thread, un délai sur un
      Future, et les données de requête d'un ThreadLocal ou d'un MDC. En Go, rien n'est attaché à la goroutine : on passe
      le contexte en paramètre, ce qui rend visible quelles fonctions peuvent bloquer et être annulées.
  - key: scenario-goroutine-fond
    format: scenario
    question: Un handler lance une goroutine qui envoie un e-mail après la réponse. Quel contexte lui donnes-tu ?
    choices:
      - {text: "`context.WithoutCancel(r.Context())` avec un délai propre, ou mieux une file de tâches", correct: true}
      - {text: "`r.Context()` tel quel, pour garder la trace et l'utilisateur de la requête", correct: false}
      - {text: "`context.Background()` sans délai, pour que l'envoi ne soit jamais interrompu", correct: false}
      - {text: "Aucun contexte : une goroutine lancée après la réponse n'en a pas besoin", correct: false}
    answer: |-
      Pas `r.Context()` tel quel : il est annulé dès que le handler rend la main, et l'envoi échouerait. Je prends
      `context.WithoutCancel(r.Context())` (Go 1.21), qui garde les valeurs (trace, utilisateur) sans l'annulation, avec
      un délai propre (`WithTimeout`). Mieux encore, pour un travail important : une file de tâches durable plutôt
      qu'une goroutine perdue si le service redémarre.
  - key: definition-background
    format: definition
    question: "Qu'est-ce que `context.Background()` ?"
    choices:
      - {text: "Un contexte racine vide, jamais annulé, sans échéance ni valeur", correct: true}
      - {text: "Un contexte annulé à l'arrêt du programme, par un signal du système", correct: false}
      - {text: "Le contexte de la goroutine courante, hérité de celle qui l'a lancée", correct: false}
      - {text: "Un contexte qui exécute ses tâches en arrière-plan, dans une goroutine", correct: false}
    answer: "Un contexte racine vide : jamais annulé, sans échéance ni valeur. On en dérive les autres ; un contexte annulé à l'arrêt du programme, c'est `signal.NotifyContext`."
  - key: definition-deadline
    format: definition
    question: "Qu'est-ce que l'échéance (deadline) d'un contexte ?"
    choices:
      - {text: "L'instant après lequel le contexte est annulé avec `DeadlineExceeded`", correct: true}
      - {text: "La durée maximale d'une requête, remise à zéro à chaque appel aval", correct: false}
      - {text: "L'instant où le contexte est libéré par le ramasse-miettes", correct: false}
      - {text: "Le délai qu'un appelant accorde à `cancel()` pour finir son travail", correct: false}
    answer: "L'instant après lequel le contexte est annulé automatiquement, avec `context.DeadlineExceeded`. Elle ne se remet pas à zéro : un enfant ne peut pas dépasser celle de son parent."
  - key: definition-annulation
    format: definition
    question: "Qu'est-ce que l'annulation d'un contexte ?"
    choices:
      - {text: "Un signal propagé aux descendants par la fermeture de leur channel `Done`", correct: true}
      - {text: "L'arrêt immédiat, par le runtime, des goroutines qui utilisent ce contexte", correct: false}
      - {text: "Une panic envoyée à toutes les goroutines qui ont reçu ce contexte", correct: false}
      - {text: "Un message envoyé sur le channel `Done` au parent et à tous ses enfants", correct: false}
    answer: "Un signal, propagé aux contextes descendants par la fermeture de leur channel `Done`. Il n'arrête rien de force : chaque fonction le surveille et rend la main d'elle-même."
