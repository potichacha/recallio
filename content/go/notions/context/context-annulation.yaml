notion: context-annulation
cards:
  - key: renvoie-done
    format: course
    question: Que renvoie Done() ?
    answer: Un channel fermé quand le contexte est annulé ou expiré.
  - key: valeurs-possibles-err
    format: course
    question: Valeurs possibles de Err() ?
    answer: nil, context.Canceled ou context.DeadlineExceeded.
  - key: annuler-enfant-annule-parent
    format: course
    question: Annuler un enfant annule-t-il le parent ?
    answer: Non, seulement l'inverse.
