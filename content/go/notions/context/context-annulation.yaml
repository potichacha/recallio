notion: context-annulation
lesson: "**`context.WithCancel(parent)`** renvoie un contexte enfant et une fonction **`cancel`**. Appeler `cancel()` ferme le\nchannel `ctx.Done()` de l'enfant et de tous ses descendants ; `ctx.Err()` vaut alors **`context.Canceled`**.\n\n```go\nctx, cancel := context.WithCancel(ctx)\ndefer cancel() // toujours : libère les ressources du contexte\n\ngo producteur(ctx, sortie)\n// ... quand on n'a plus besoin du producteur :\ncancel()\n```\n\nUne fonction **réagit** à l'annulation de trois façons :\n- en **passant** le contexte aux appels qui le gèrent (`QueryContext`, requêtes HTTP) ;\n- dans un **select**, avec un cas `<-ctx.Done()` à côté de chaque envoi ou réception qui peut bloquer ;\n- dans une **boucle de calcul**, en testant `ctx.Err()` de temps en temps.\n\n```go\nfunc producteur(ctx context.Context, sortie chan<- int) error {\n\tfor i := 0; ; i++ {\n\t\tselect {\n\t\tcase sortie <- i:\n\t\tcase <-ctx.Done():\n\t\t\treturn ctx.Err() // context.Canceled\n\t\t}\n\t}\n}\n```\n\nCe qu'il faut savoir :\n- `cancel` est **idempotent** et sûr entre goroutines : l'appeler plusieurs fois ne fait rien de plus ;\n- l'annulation est **coopérative** : elle ne tue rien, elle demande. Une fonction qui ignore `ctx` continue ;\n- `ctx.Done()` d'un `Background` vaut `nil` : un select sur lui n'est jamais choisi, ce qui est le comportement\n  voulu.\n\n**En entretien** : « WithCancel renvoie ctx et cancel ; defer cancel ; on réagit par select sur Done, ou ctx.Err dans\nles boucles ; l'annulation est coopérative et descend l'arbre. »"
cards:
  - key: renvoie-done
    format: course
    question: "Que renvoie la méthode `Done()` d'un contexte ?"
    choices:
      - {text: "Un channel fermé quand le contexte est annulé ou que son délai expire", correct: true}
      - {text: "Un booléen qui vaut true une fois le contexte annulé ou expiré", correct: false}
      - {text: "L'erreur d'annulation, ou nil tant que le contexte est encore actif", correct: false}
      - {text: "Un channel qui reçoit une valeur à chaque appel de la fonction cancel", correct: false}
    answer: "Un channel (`<-chan struct{}`) fermé à l'annulation ou à l'expiration : une fermeture est vue par tous les récepteurs, d'où `case <-ctx.Done():`. L'erreur, elle, se lit avec `Err()`."
  - key: valeurs-possibles-err
    format: course
    question: "Quelles valeurs la méthode `Err()` d'un contexte peut-elle renvoyer ?"
    choices:
      - {text: "`nil`, `context.Canceled` ou `context.DeadlineExceeded`", correct: true}
      - {text: "`nil`, ou l'erreur que l'appelant a passée à la fonction cancel", correct: false}
      - {text: "`context.Canceled` seulement, que le contexte soit annulé ou expiré", correct: false}
      - {text: "`true` si le contexte est annulé, `false` tant qu'il est actif", correct: false}
    answer: "`nil` tant que le contexte est actif, puis `context.Canceled` (annulé) ou `context.DeadlineExceeded` (expiré). La raison précise passée à une annulation se lit avec `context.Cause`, pas avec `Err()`."
  - key: annuler-enfant-annule-parent
    format: course
    question: "Annuler un contexte enfant annule-t-il aussi son parent ?"
    choices:
      - {text: "Non : l'annulation descend du parent vers les enfants, jamais l'inverse", correct: true}
      - {text: "Oui : l'annulation remonte jusqu'au contexte racine, puis redescend", correct: false}
      - {text: "Oui, mais seulement si le parent a lui-même été créé par `WithCancel`", correct: false}
      - {text: "Non, et annuler le parent n'annule pas non plus ses enfants", correct: false}
    answer: "Non : l'annulation se propage du parent vers ses descendants, jamais vers le haut. Un enfant annulé ne touche ni son parent ni ses frères."
  - key: cooperative
    format: course
    question: L'annulation d'un contexte arrête-t-elle de force les goroutines qui l'utilisent ?
    choices:
      - {text: "Non : elle ferme `Done`, et chaque fonction doit le surveiller et rendre la main", correct: true}
      - {text: "Oui : le runtime arrête toutes les goroutines qui ont reçu ce contexte", correct: false}
      - {text: "Oui, mais seulement les goroutines bloquées sur un envoi ou une réception", correct: false}
      - {text: "Non : elle provoque une panic dans chaque goroutine, qu'il faut rattraper", correct: false}
    answer: "Non, elle est coopérative : elle ferme `Done`, et chaque fonction doit le surveiller (`select`, `ctx.Err()`, appels qui prennent `ctx`) et rendre la main d'elle-même. Go n'a aucun moyen d'arrêter une goroutine de l'extérieur."
  - key: vf-idempotent
    format: true-false
    question: Appeler `cancel()` deux fois provoque une panique.
    truth: false
    answer: cancel est idempotent.
  - key: vf-err
    format: true-false
    question: Après `cancel()`, `ctx.Err()` renvoie `context.Canceled`.
    truth: true
    answer: Et Done est fermé.
  - key: vf-defer
    format: true-false
    question: Si l'on annule explicitement plus tard, le `defer cancel()` est inutile.
    truth: false
    answer: Le defer couvre aussi les retours anticipés et les erreurs ; sans lui, le contexte reste attaché à son parent.
  - key: vf-ignore
    format: true-false
    question: Une fonction qui reçoit ctx mais ne le consulte jamais s'arrête quand même à l'annulation.
    truth: false
    answer: L'annulation ne fait que fermer un channel.
  - key: qcm-reagir
    format: multiple-choice
    question: "Lesquelles de ces techniques rendent une fonction sensible à l'annulation de son contexte ?"
    choices:
      - text: Un cas `<-ctx.Done()` dans chaque select bloquant
        correct: true
      - text: Un test de `ctx.Err()` régulier dans une longue boucle de calcul
        correct: true
      - text: Le passage de ctx aux appels qui l'acceptent
        correct: true
      - text: Un recover qui attrape l'annulation
        correct: false
    answer: "Un cas `<-ctx.Done()` dans les `select` bloquants, un test régulier de `ctx.Err()` dans les longues boucles, et `ctx` passé aux appels qui l'acceptent. L'annulation n'est pas une panic : un `recover` n'a rien à attraper."
  - key: qcm-done-background
    format: multiple-choice
    question: Que renvoie `context.Background().Done()` ?
    choices:
      - text: nil, donc un select sur lui n'est jamais choisi
        correct: true
      - text: Un channel déjà fermé
        correct: false
      - text: Une panique
        correct: false
      - text: Un channel fermé au bout d'une minute
        correct: false
    answer: Background n'est jamais annulé.
  - key: qcm-enfants
    format: multiple-choice
    question: '`a, cancelA := context.WithCancel(bg)`, puis `b, cancelB := context.WithCancel(a)`. Que se passe-t-il après `cancelA()` ?'
    choices:
      - text: a et b sont annulés
        correct: true
      - text: Seul a est annulé
        correct: false
      - text: Seul b est annulé
        correct: false
      - text: Rien tant que cancelB n'est pas appelé
        correct: false
    answer: L'annulation descend vers les enfants.
  - key: qcm-premier
    format: multiple-choice
    question: "Trois goroutines cherchent le même résultat ; tu veux arrêter les deux autres dès le premier trouvé. Quelle solution est la bonne ?"
    choices:
      - {text: "Un contexte `WithCancel` partagé, annulé à la réception du premier résultat", correct: true}
      - {text: "Fermer le channel de résultats dès la réception du premier résultat", correct: false}
      - {text: "Appeler `os.Exit` dès la réception du premier résultat, pour tout arrêter", correct: false}
      - {text: "Appeler `runtime.Goexit()` depuis main, pour arrêter les autres goroutines", correct: false}
    answer: "Un contexte partagé, annulé au premier résultat, que les goroutines surveillent ; un channel de résultats bufferisé de taille 3 évite que les perdantes restent bloquées sur leur envoi. Fermer le channel ferait paniquer les autres émetteurs, et `runtime.Goexit` n'arrête que la goroutine qui l'appelle."
  - key: trous-withcancel
    format: fill-in
    question: |-
      Complète la création d'un contexte annulable :
      ```go
      ctx, cancel := context.___(parent)
      ___ cancel()
      ```
    blanks:
      - - WithCancel
      - - defer
    answer: WithCancel puis defer cancel.
  - key: trous-select
    format: fill-in
    question: |-
      Complète l'envoi annulable :
      ```go
      select {
      case sortie <- v:
      case <-ctx.Done():
      	return ctx.___()
      }
      ```
    blanks:
      - - Err
    answer: On renvoie l'erreur du contexte.
  - key: trous-boucle
    format: fill-in
    question: |-
      Complète le test d'annulation dans une boucle de calcul :
      ```go
      for i, ligne := range lignes {
      	if i%1000 == 0 {
      		if err := ctx.Err(); err ___ nil {
      			return err
      		}
      	}
      	traiter(ligne)
      }
      ```
    blanks:
      - - '!='
    answer: Err est non nil une fois le contexte annulé.
  - key: trous-canceled
    format: fill-in
    question: |-
      Complète pour reconnaître une annulation :
      ```go
      if errors.Is(err, context.___) {
      	return // le client est parti
      }
      ```
    blanks:
      - - Canceled
    answer: context.Canceled.
  - key: code-err
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancel(context.Background())
      fmt.Println(ctx.Err())
      cancel()
      <-ctx.Done()
      fmt.Println(ctx.Err())
      ```
    choices:
      - text: |-
          ```
          <nil>
          context canceled
          ```
        correct: true
      - text: |-
          ```
          <nil>
          context deadline exceeded
          ```
        correct: false
      - text: |-
          ```
          <nil>
          <nil>
          ```
        correct: false
      - text: |-
          ```
          context canceled
          context canceled
          ```
        correct: false
    answer: "`<nil>` tant que le contexte est actif, puis `context canceled` après `cancel()`. `context deadline exceeded` serait l'erreur d'un délai expiré, pas d'une annulation."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tfmt.Println(ctx.Err())\n\tcancel()\n\t<-ctx.Done()\n\tfmt.Println(ctx.Err())\n}\n"
      output: |-
        <nil>
        context canceled
  - key: code-enfant
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      parent, annulerParent := context.WithCancel(context.Background())
      enfant, annulerEnfant := context.WithCancel(parent)
      defer annulerParent()
      annulerEnfant()
      fmt.Println(parent.Err(), enfant.Err())
      ```
    choices:
      - {text: "`<nil> context canceled`", correct: true}
      - {text: "`context canceled context canceled`", correct: false}
      - {text: "`<nil> <nil>`", correct: false}
      - {text: "`context canceled <nil>`", correct: false}
    answer: "`<nil> context canceled` : annuler l'enfant ne touche pas le parent ; l'annulation ne descend que du parent vers ses enfants."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tparent, annulerParent := context.WithCancel(context.Background())\n\tenfant, annulerEnfant := context.WithCancel(parent)\n\tdefer annulerParent()\n\tannulerEnfant()\n\tfmt.Println(parent.Err(), enfant.Err())\n}\n"
      output: <nil> context canceled
  - key: code-parent
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      parent, annulerParent := context.WithCancel(context.Background())
      enfant, annulerEnfant := context.WithCancel(parent)
      defer annulerEnfant()
      annulerParent()
      <-enfant.Done()
      fmt.Println(errors.Is(enfant.Err(), context.Canceled))
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "Une erreur fatale : all goroutines are asleep - deadlock!", correct: false}
    answer: "`true` : l'annulation du parent descend vers l'enfant, dont `Done` se ferme et dont `Err()` vaut `context.Canceled`."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tparent, annulerParent := context.WithCancel(context.Background())\n\tenfant, annulerEnfant := context.WithCancel(parent)\n\tdefer annulerEnfant()\n\tannulerParent()\n\t<-enfant.Done()\n\tfmt.Println(errors.Is(enfant.Err(), context.Canceled))\n}\n"
      output: 'true'
  - key: code-producteur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancel(context.Background())
      sortie := make(chan int)
      fini := make(chan error)
      go func() {
      	for i := 0; ; i++ {
      		select {
      		case sortie <- i:
      		case <-ctx.Done():
      			fini <- ctx.Err()
      			return
      		}
      	}
      }()
      fmt.Println(<-sortie, <-sortie)
      cancel()
      fmt.Println(<-fini)
      ```
    choices:
      - text: |-
          ```
          0 1
          context canceled
          ```
        correct: true
      - text: |-
          ```
          0 1
          <nil>
          ```
        correct: false
      - text: |-
          ```
          1 2
          context canceled
          ```
        correct: false
      - {text: "`0 1`, puis une erreur fatale : all goroutines are asleep - deadlock!", correct: false}
    answer: "`0 1`, puis `context canceled` : le producteur envoie 0 et 1, puis son `select` voit `ctx.Done()` fermé et renvoie `ctx.Err()`. Sans ce cas, il resterait bloqué sur son envoi."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tsortie := make(chan int)\n\tfini := make(chan error)\n\tgo func() {\n\t\tfor i := 0; ; i++ {\n\t\t\tselect {\n\t\t\tcase sortie <- i:\n\t\t\tcase <-ctx.Done():\n\t\t\t\tfini <- ctx.Err()\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}()\n\tfmt.Println(<-sortie, <-sortie)\n\tcancel()\n\tfmt.Println(<-fini)\n}\n"
      output: |-
        0 1
        context canceled
  - key: bug-pas-de-cancel
    format: bug-fix
    question: |-
      `go vet` signale « the cancel function returned by context.WithCancel should be called, not discarded ». Quelle correction est la bonne ?
      ```go
      func lancer(ctx context.Context) error {
      	sousCtx, _ := context.WithCancel(ctx)
      	go surveiller(sousCtx)
      	return traiter(sousCtx)
      }
      ```
    choices:
      - {text: "Garder `cancel` et l'appeler en `defer cancel()` juste après la création", correct: true}
      - {text: "Remplacer `WithCancel` par `context.Background()`, qui n'a rien à annuler", correct: false}
      - {text: "Appeler `cancel()` aussitôt après la création, avant de lancer `surveiller`", correct: false}
      - {text: "Ignorer l'avertissement : le ramasse-miettes libère le contexte tout seul", correct: false}
    answer: |-
      ```go
      sousCtx, cancel := context.WithCancel(ctx)
      defer cancel()
      go surveiller(sousCtx)
      return traiter(sousCtx)
      ```
      Sans `cancel`, la goroutine `surveiller` ne s'arrête qu'avec le parent, et le contexte reste attaché à lui : c'est une fuite. Appeler `cancel()` aussitôt annulerait le travail avant même qu'il commence.
  - key: bug-envoi
    format: bug-fix
    question: |-
      Après l'annulation, cette goroutine reste bloquée sur son envoi. Quelle correction est la bonne ?
      ```go
      for _, l := range lignes {
      	if ctx.Err() != nil {
      		return ctx.Err()
      	}
      	sortie <- l
      }
      ```
    choices:
      - {text: "Faire l'envoi dans un `select`, avec un second cas sur `<-ctx.Done()`", correct: true}
      - {text: "Tester `ctx.Err()` une seconde fois, juste après l'envoi sur `sortie`", correct: false}
      - {text: "Fermer `sortie` à l'annulation, pour débloquer l'envoi en attente", correct: false}
      - {text: "Remplacer `sortie` par un channel bufferisé de taille 1, sans rien d'autre", correct: false}
    answer: "```go\nfor _, l := range lignes {\n\tselect {\n\tcase sortie <- l:\n\tcase <-ctx.Done():\n\t\treturn ctx.Err()\n\t}\n}\n```\nLe test avant l'envoi ne protège pas l'envoi lui-même ; le select surveille les deux."
  - key: bug-boucle-calcul
    format: bug-fix
    question: |-
      Cet export d'un million de lignes continue de tourner longtemps après que le client a annulé. Quelle correction est la bonne ?
      ```go
      func exporter(ctx context.Context, lignes []Ligne, w io.Writer) error {
      	for _, l := range lignes {
      		ecrireCSV(w, l)
      	}
      	return nil
      }
      ```
    choices:
      - {text: "Tester `ctx.Err()` toutes les 1 000 lignes, et renvoyer l'erreur s'il est annulé", correct: true}
      - {text: "Lancer la boucle dans une goroutine, que l'annulation arrêtera d'elle-même", correct: false}
      - {text: "Placer un `select` sur `ctx.Done()` avant le `for`, une fois pour toute la boucle", correct: false}
      - {text: "Appeler `runtime.Gosched()` à chaque ligne, pour laisser l'annulation agir", correct: false}
    answer: "```go\nfunc exporter(ctx context.Context, lignes []Ligne, w io.Writer) error {\n\tfor i, l := range lignes {\n\t\tif i%1000 == 0 {\n\t\t\tif err := ctx.Err(); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\t}\n\t\tecrireCSV(w, l)\n\t}\n\treturn nil\n}\n```\nLa boucle ne consultait jamais le contexte ; un test régulier de `ctx.Err()` la rend annulable sans coût notable."
  - key: bug-erreur-loggee
    format: bug-fix
    question: |-
      Les journaux se remplissent d'erreurs « context canceled » à chaque client qui ferme son onglet. Quelle correction est la bonne ?
      ```go
      if err := service.Charger(r.Context()); err != nil {
      	log.Printf("ERREUR chargement : %v", err)
      	http.Error(w, "erreur", 500)
      }
      ```
    choices:
      - {text: "Reconnaître `context.Canceled` avec `errors.Is` et rendre la main sans journaliser", correct: true}
      - {text: "Remplacer `r.Context()` par `context.Background()`, que le client ne peut annuler", correct: false}
      - {text: "Comparer `err.Error()` au texte \"context canceled\" et ignorer seulement celui-là", correct: false}
      - {text: "Passer le message au niveau debug, pour toutes les erreurs que renvoie `Charger`", correct: false}
    answer: "```go\nif err := service.Charger(r.Context()); err != nil {\n\tif errors.Is(err, context.Canceled) {\n\t\treturn // le client est parti : rien à signaler ni à répondre\n\t}\n\tlog.Printf(\"ERREUR chargement : %v\", err)\n\thttp.Error(w, \"erreur\", 500)\n}\n```\nUne annulation par le client est normale ; on la distingue avec errors.Is pour ne garder que les vraies erreurs."
