notion: context-causes
lesson: |-
  Depuis Go 1.20 et 1.21, le package `context` sait dire **pourquoi** un contexte a été annulé, exécuter du code **à
  l'annulation**, et **détacher** un contexte de l'annulation de son parent.

  **Les causes** :

  ```go
  ctx, cancel := context.WithCancelCause(parent)
  cancel(ErrQuotaDepasse)        // annuler avec une cause
  ctx.Err()                      // context.Canceled, comme toujours
  context.Cause(ctx)             // ErrQuotaDepasse

  ctx, cancel := context.WithTimeoutCause(parent, 2*time.Second, ErrServiceLent)
  // à l'échéance : Err() == DeadlineExceeded, Cause(ctx) == ErrServiceLent
  ```

  `Err()` garde ses deux valeurs habituelles (pour la compatibilité) ; **`context.Cause`** donne la raison précise. Sans
  cause fournie, `Cause` renvoie la même chose que `Err()`.

  **`context.AfterFunc(ctx, f)`** (Go 1.21) exécute `f` dans sa propre goroutine quand `ctx` est annulé, et renvoie
  une fonction `stop` pour désinscrire `f` (elle renvoie `true` si elle a empêché l'exécution). Utile pour relier
  l'annulation à une API qui ne connaît pas les contextes (fermer une connexion, réveiller une sync.Cond).

  **`context.WithoutCancel(ctx)`** (Go 1.21) renvoie un contexte qui garde les **valeurs** du parent mais **pas** son
  annulation ni son échéance : pour un travail qui doit finir même si la requête est terminée (audit, nettoyage).
  On lui redonne en général un délai propre.

  **En entretien** : « WithCancelCause et Cause pour savoir pourquoi ; AfterFunc pour réagir à l'annulation sans
  goroutine à écrire ; WithoutCancel pour garder les valeurs sans l'annulation. »
cards:
  - key: apporte-withcancelcause
    format: course
    question: "Qu'apporte `context.WithCancelCause` par rapport à `WithCancel` ?"
    choices:
      - {text: "Une cause d'annulation précise, que `context.Cause` permet de relire", correct: true}
      - {text: "Une valeur de `ctx.Err()` remplacée par l'erreur passée à `cancel`", correct: false}
      - {text: "Un nouvel essai automatique de l'opération quand le contexte est annulé", correct: false}
      - {text: "Une annulation qui remonte aussi jusqu'au parent, avec la même cause", correct: false}
    answer: "Sa fonction `cancel` prend une erreur, la cause, que `context.Cause(ctx)` relit (Go 1.20). `ctx.Err()` reste `context.Canceled` : la cause ne la remplace pas."
  - key: sert-withoutcancel
    format: course
    question: "À quoi sert `context.WithoutCancel` ?"
    choices:
      - {text: "À garder les valeurs du parent sans hériter de son annulation ni de son échéance", correct: true}
      - {text: "À créer un contexte qu'on ne peut annuler qu'avec sa propre fonction `cancel`", correct: false}
      - {text: "À empêcher les enfants d'annuler leur parent, qui reste actif jusqu'au bout", correct: false}
      - {text: "À ignorer l'annulation du parent tout en gardant son échéance d'origine", correct: false}
    answer: "À garder les valeurs du parent (trace, utilisateur) sans hériter de son annulation (Go 1.21). L'échéance disparaît aussi : il faut lui redonner un délai propre."
  - key: sert-afterfunc
    format: course
    question: "À quoi sert `context.AfterFunc` ?"
    choices:
      - {text: "À exécuter une fonction, dans sa propre goroutine, quand le contexte est annulé", correct: true}
      - {text: "À exécuter une fonction après un délai fixe, comme le fait `time.AfterFunc`", correct: false}
      - {text: "À exécuter une fonction juste avant l'annulation, pour pouvoir la retarder", correct: false}
      - {text: "À annuler le contexte une fois que la fonction donnée a fini son travail", correct: false}
    answer: "À appeler une fonction, dans sa propre goroutine, quand le contexte est annulé (Go 1.21) ; la fonction `stop` renvoyée la désinscrit. Le délai fixe, c'est `time.AfterFunc`."
  - key: dois-ecrire-log-audit-apres-chaque
    format: scenario
    question: "Tu dois écrire un log d'audit après chaque requête, même si le client se déconnecte. Quel contexte utilises-tu ?"
    choices:
      - {text: "`context.WithoutCancel(r.Context())`, avec un délai propre ; une file si l'audit est critique", correct: true}
      - {text: "`r.Context()` directement, puisqu'il porte déjà la trace et l'utilisateur de la requête", correct: false}
      - {text: "`context.Background()`, sans délai, pour que l'écriture ne soit jamais interrompue", correct: false}
      - {text: "`r.Context()` dans une goroutine lancée en `defer` à la fin du handler, sans délai", correct: false}
    answer: |-
      Si j'utilise `r.Context()` directement, l'écriture sera annulée quand le client part. J'utiliserais `context.WithoutCancel(r.Context())` : on garde les valeurs utiles (identifiant de requête, utilisateur, trace) sans hériter de l'annulation, avec un timeout propre pour que l'écriture ne bloque pas indéfiniment.
      Si l'audit est critique, je ne le ferais pas en ligne mais via une file (ou l'outbox en base dans la même transaction), pour qu'il survive aussi à un crash du processus.
  - key: cause-sans
    format: course
    question: Que renvoie `context.Cause(ctx)` pour un contexte annulé sans cause particulière ?
    choices:
      - {text: "La même valeur que `ctx.Err()`, et `nil` tant qu'il n'est pas annulé", correct: true}
      - {text: "Toujours `nil`, puisqu'aucune cause n'a été donnée à l'annulation", correct: false}
      - {text: "Une erreur générique « unknown cause », distincte de `ctx.Err()`", correct: false}
      - {text: "Une panic : `Cause` n'accepte que les contextes de `WithCancelCause`", correct: false}
    answer: La même valeur que `ctx.Err()` (context.Canceled ou context.DeadlineExceeded), et nil tant que le contexte n'est pas annulé.
  - key: vf-err-inchange
    format: true-false
    question: Avec WithCancelCause, `ctx.Err()` renvoie la cause passée à cancel.
    truth: false
    answer: Err renvoie toujours context.Canceled ; la cause s'obtient avec context.Cause.
  - key: vf-afterfunc-goroutine
    format: true-false
    question: La fonction passée à context.AfterFunc s'exécute dans sa propre goroutine.
    truth: true
    answer: Elle ne bloque donc pas celui qui annule.
  - key: vf-without-valeurs
    format: true-false
    question: Un contexte obtenu par WithoutCancel garde les valeurs de son parent.
    truth: true
    answer: Il perd seulement l'annulation et l'échéance.
  - key: vf-without-delai
    format: true-false
    question: Un contexte obtenu par WithoutCancel garde l'échéance de son parent.
    truth: false
    answer: Deadline renvoie ok == false ; on ajoute souvent un délai propre.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Laquelle de ces fonctions du package `context` est apparue en Go 1.21 ?"
    choices:
      - {text: "`context.AfterFunc`", correct: true}
      - {text: "`context.WithCancelCause`", correct: false}
      - {text: "`context.WithValue`", correct: false}
      - {text: "`context.WithDeadline`", correct: false}
    answer: "`AfterFunc`, comme `WithoutCancel`, `WithDeadlineCause` et `WithTimeoutCause`. `WithCancelCause` et `Cause` datent de Go 1.20 ; `WithValue` et `WithDeadline` existent depuis Go 1.7."
  - key: qcm-afterfunc
    format: multiple-choice
    question: "À quoi sert la fonction `stop` renvoyée par `context.AfterFunc` ?"
    choices:
      - {text: "À désinscrire la fonction si le contexte n'est pas encore annulé", correct: true}
      - {text: "À annuler le contexte, ce qui lance aussitôt la fonction", correct: false}
      - {text: "À attendre la fin de la fonction, si elle a déjà démarré", correct: false}
      - {text: "À relancer la fonction une seconde fois, après l'annulation", correct: false}
    answer: "À désinscrire la fonction tant que le contexte n'est pas annulé : `stop()` renvoie true s'il a empêché l'exécution. Il n'annule pas le contexte et n'attend pas une fonction déjà lancée."
  - key: qcm-without
    format: multiple-choice
    question: "Dans quel cas `context.WithoutCancel` convient-il ?"
    choices:
      - {text: "Écrire un journal d'audit après la réponse, même si le client est parti", correct: true}
      - {text: "Contourner un délai trop court fixé par l'appelant pour un appel normal", correct: false}
      - {text: "Lancer toute goroutine d'un handler, sans lui donner de délai propre", correct: false}
      - {text: "Arrêter les tâches de fond dès qu'un signal d'arrêt est reçu", correct: false}
    answer: "Pour un travail qui doit survivre à l'annulation de la requête : un audit, la libération d'une ressource distante. Il faut une raison précise, et un délai propre pour ne pas tourner sans fin."
  - key: qcm-cause
    format: multiple-choice
    question: "Pourquoi annuler un contexte avec une cause ?"
    choices:
      - {text: "Pour distinguer dans les journaux « quota dépassé » de « client parti »", correct: true}
      - {text: "Pour changer la valeur de `ctx.Err()` en l'erreur passée à `cancel`", correct: false}
      - {text: "Pour que l'opération interrompue soit réessayée automatiquement", correct: false}
      - {text: "Pour annuler aussi le contexte parent, avec la même raison", correct: false}
    answer: "Pour savoir pourquoi une opération s'est arrêtée, dans les journaux ou dans une erreur métier, grâce à `context.Cause`. `Err()` reste `Canceled` ou `DeadlineExceeded`."
  - key: code-cause
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancelCause(context.Background())
      cancel(errors.New("quota dépassé"))
      fmt.Println(ctx.Err())
      fmt.Println(context.Cause(ctx))
      ```
    choices:
      - text: |-
          ```
          context canceled
          quota dépassé
          ```
        correct: true
      - text: |-
          ```
          quota dépassé
          quota dépassé
          ```
        correct: false
      - text: |-
          ```
          context canceled
          context canceled
          ```
        correct: false
      - text: |-
          ```
          quota dépassé
          context canceled
          ```
        correct: false
    answer: "`context canceled`, puis `quota dépassé` : `Err()` ne change pas, `context.Cause` donne la raison passée à `cancel`."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancelCause(context.Background())\n\tcancel(errors.New(\"quota dépassé\"))\n\tfmt.Println(ctx.Err())\n\tfmt.Println(context.Cause(ctx))\n}\n"
      output: |-
        context canceled
        quota dépassé
  - key: code-timeout-cause
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      lent := errors.New("service de prix trop lent")
      ctx, cancel := context.WithTimeoutCause(context.Background(), time.Millisecond, lent)
      defer cancel()
      <-ctx.Done()
      fmt.Println(errors.Is(ctx.Err(), context.DeadlineExceeded))
      fmt.Println(context.Cause(ctx))
      ```
    choices:
      - text: |-
          ```
          true
          service de prix trop lent
          ```
        correct: true
      - text: |-
          ```
          false
          service de prix trop lent
          ```
        correct: false
      - text: |-
          ```
          true
          context deadline exceeded
          ```
        correct: false
      - text: |-
          ```
          false
          context deadline exceeded
          ```
        correct: false
    answer: "`true`, puis `service de prix trop lent` : `Err()` reste `context.DeadlineExceeded` à l'expiration, et `Cause` renvoie l'erreur donnée à `WithTimeoutCause`."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tlent := errors.New(\"service de prix trop lent\")\n\tctx, cancel := context.WithTimeoutCause(context.Background(), time.Millisecond, lent)\n\tdefer cancel()\n\t<-ctx.Done()\n\tfmt.Println(errors.Is(ctx.Err(), context.DeadlineExceeded))\n\tfmt.Println(context.Cause(ctx))\n}\n"
      output: |-
        true
        service de prix trop lent
  - key: code-afterfunc
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ctx, cancel := context.WithCancel(context.Background())
      fait := make(chan struct{})
      stop := context.AfterFunc(ctx, func() {
      	fmt.Println("rappel")
      	close(fait)
      })
      cancel()
      <-fait
      fmt.Println(stop())
      ```
    choices:
      - text: |-
          ```
          rappel
          false
          ```
        correct: true
      - text: |-
          ```
          rappel
          true
          ```
        correct: false
      - {text: "`false`", correct: false}
      - {text: "`true`", correct: false}
    answer: "`rappel`, puis `false` : la fonction s'est déjà exécutée, `stop` ne l'empêche plus. Il ne renvoie true que s'il a empêché l'exécution."
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tctx, cancel := context.WithCancel(context.Background())\n\tfait := make(chan struct{})\n\tstop := context.AfterFunc(ctx, func() {\n\t\tfmt.Println(\"rappel\")\n\t\tclose(fait)\n\t})\n\tcancel()\n\t<-fait\n\tfmt.Println(stop())\n}\n"
      output: |-
        rappel
        false
  - key: code-without
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type cleTrace struct{}

      parent, cancel := context.WithCancel(context.Background())
      parent = context.WithValue(parent, cleTrace{}, "trace-42")
      detache := context.WithoutCancel(parent)
      cancel()
      fmt.Println(parent.Err(), detache.Err(), detache.Value(cleTrace{}))
      ```
    choices:
      - {text: "`context canceled <nil> trace-42`", correct: true}
      - {text: "`context canceled context canceled trace-42`", correct: false}
      - {text: "`context canceled <nil> <nil>`", correct: false}
      - {text: "`<nil> <nil> trace-42`", correct: false}
    answer: '`context canceled <nil> trace-42` : le contexte détaché garde la valeur mais pas l''annulation.'
    check:
      code: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n)\n\ntype cleTrace struct{}\n\nfunc main() {\n\tparent, cancel := context.WithCancel(context.Background())\n\tparent = context.WithValue(parent, cleTrace{}, \"trace-42\")\n\tdetache := context.WithoutCancel(parent)\n\tcancel()\n\tfmt.Println(parent.Err(), detache.Err(), detache.Value(cleTrace{}))\n}\n"
      output: context canceled <nil> trace-42
  - key: bug-cause-err
    format: bug-fix
    question: |-
      Le journal affiche toujours « context canceled » au lieu de la vraie raison. Quelle correction est la bonne ?
      ```go
      ctx, cancel := context.WithCancelCause(ctx)
      // ... ailleurs : cancel(ErrStockEpuise)
      if err := traiter(ctx); err != nil {
      	log.Printf("arrêt : %v", ctx.Err())
      }
      ```
    choices:
      - {text: "Journaliser `context.Cause(ctx)` au lieu de `ctx.Err()`", correct: true}
      - {text: "Journaliser `err.Error()`, le texte de l'erreur de `traiter`", correct: false}
      - {text: "Remplacer `WithCancelCause` par `WithCancel`, plus simple", correct: false}
      - {text: "Comparer `ctx.Err()` à `ErrStockEpuise` avec `errors.Is`", correct: false}
    answer: "```go\nif err := traiter(ctx); err != nil {\n\tlog.Printf(\"arrêt : %v\", context.Cause(ctx))\n}\n```\nErr reste context.Canceled ; la cause passée à cancel se lit avec context.Cause."
  - key: bug-audit
    format: bug-fix
    question: |-
      Les journaux d'audit manquent pour les clients qui ferment leur page trop vite. Quelle correction est la bonne ?
      ```go
      defer func() {
      	go audit.Ecrire(r.Context(), evenement)
      }()
      ```
    choices:
      - {text: "Écrire avec `context.WithoutCancel(r.Context())`, borné par un `WithTimeout`", correct: true}
      - {text: "Écrire avec `context.Background()`, sans délai, pour ne plus dépendre du client", correct: false}
      - {text: "Retirer le `go` : écrire en synchrone dans le `defer`, toujours avec `r.Context()`", correct: false}
      - {text: "Envelopper `r.Context()` dans un `WithTimeout` de 5 secondes avant l'écriture", correct: false}
    answer: "```go\ndefer func() {\n\tctx, cancel := context.WithTimeout(context.WithoutCancel(r.Context()), 5*time.Second)\n\tgo func() {\n\t\tdefer cancel()\n\t\taudit.Ecrire(ctx, evenement)\n\t}()\n}()\n```\nLe contexte de la requête était annulé avant l'écriture ; WithoutCancel garde les valeurs (trace) sans\nl'annulation, et un délai propre borne l'écriture."
  - key: bug-goroutine-surveillance
    format: bug-fix
    question: |-
      Une goroutine par connexion attend l'annulation pour fermer la connexion, et reste bloquée quand la connexion se termine normalement. Quelle correction est la bonne ?
      ```go
      go func() {
      	<-ctx.Done()
      	conn.Close()
      }()
      return lire(conn)
      ```
    choices:
      - {text: "`context.AfterFunc(ctx, ...)` pour fermer, et `defer stop()` pour le désinscrire", correct: true}
      - {text: "Ajouter `defer conn.Close()` dans la goroutine, avant l'attente sur `Done`", correct: false}
      - {text: "Remplacer `<-ctx.Done()` par une boucle qui teste `ctx.Err()` sans arrêt", correct: false}
      - {text: "Appeler `runtime.Goexit()` à la fin de `lire`, pour arrêter la goroutine", correct: false}
    answer: |-
      ```go
      stop := context.AfterFunc(ctx, func() { conn.Close() })
      defer stop()
      return lire(conn)
      ```
      AfterFunc relie l'annulation à la fermeture, et `stop` désinscrit le rappel quand la lecture finit normalement :
      plus de goroutine en attente.
  - key: bug-without-sans-delai
    format: bug-fix
    question: |-
      Des goroutines de nettoyage s'accumulent quand le service distant ne répond plus. Quelle correction est la bonne ?
      ```go
      go nettoyer(context.WithoutCancel(ctx), id)
      ```
    choices:
      - {text: "Borner le contexte détaché par un `WithTimeout`, annulé en `defer` dans la goroutine", correct: true}
      - {text: "Passer `ctx` tel quel au lieu de `WithoutCancel`, pour hériter de son annulation", correct: false}
      - {text: "Limiter le nombre de goroutines de nettoyage avec un sémaphore de taille 10", correct: false}
      - {text: "Relancer `nettoyer` dans une nouvelle goroutine quand la précédente tarde trop", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(context.WithoutCancel(ctx), 10*time.Second)\ngo func() {\n\tdefer cancel()\n\tnettoyer(ctx, id)\n}()\n```\nWithoutCancel supprime aussi l'échéance : sans délai propre, un appel bloqué ne finit jamais."
  - key: scenario-causes
    format: scenario
    question: Comment utiliserais-tu les causes d'annulation dans un service ?
    choices:
      - {text: "Annuler avec une erreur précise (`cancel(ErrArret)`, `WithTimeoutCause`) et journaliser `context.Cause(ctx)`", correct: true}
      - {text: "Annuler avec une erreur précise, puis la relire dans `ctx.Err()` pour journaliser la raison de l'arrêt", correct: false}
      - {text: "Comparer le texte de `ctx.Err()` aux messages connus, pour deviner la raison de chaque arrêt", correct: false}
      - {text: "Ranger la raison de l'arrêt dans une valeur du contexte, avec `WithValue`, juste avant `cancel`", correct: false}
    answer: |-
      Là où plusieurs raisons peuvent arrêter une opération : un errgroup maison qui annule avec l'erreur de la tâche
      fautive, un arrêt du service (`cancel(ErrArret)`), un délai par appel (`WithTimeoutCause(ctx, d,
      ErrPrixTropLent)`). Les journaux et les métriques utilisent `context.Cause(ctx)` pour distinguer « client parti »,
      « délai du partenaire » et « arrêt », ce que `Err()` seul confond.
  - key: scenario-afterfunc
    format: scenario
    question: Une bibliothèque bloquante ne connaît pas les contextes. Comment la rends-tu annulable ?
    choices:
      - {text: "Relier l'annulation à son moyen d'interrompre (fermer, `SetDeadline`) avec `context.AfterFunc`", correct: true}
      - {text: "L'appeler dans une goroutine et l'abandonner quand le contexte est annulé, sans l'interrompre", correct: false}
      - {text: "Tester `ctx.Err()` avant l'appel, puisque l'appel lui-même ne peut pas être interrompu", correct: false}
      - {text: "Envelopper l'appel dans un `recover`, pour rattraper la panic que provoque l'annulation", correct: false}
    answer: |-
      Si elle offre un moyen d'interrompre l'opération (fermer la connexion, positionner une échéance avec
      `SetDeadline`, appeler une méthode Cancel), je relie l'annulation du contexte à ce moyen avec
      `context.AfterFunc(ctx, ...)`, et j'appelle `stop()` en defer quand l'opération finit normalement. Je convertis
      ensuite l'erreur obtenue en `ctx.Err()` (ou `context.Cause(ctx)`) pour que l'appelant reconnaisse l'annulation.
  - key: scenario-shutdown
    format: scenario
    question: Pendant l'arrêt du service, les requêtes en cours doivent finir mais les nouvelles tâches de fond doivent s'arrêter. Comment combines-tu ces outils ?
    choices:
      - {text: "`signal.NotifyContext` pour le fond, `srv.Shutdown` pour les requêtes, `WithoutCancel` borné", correct: true}
      - {text: "Un seul contexte racine annulé au signal, qui arrête tout de suite requêtes et tâches de fond", correct: false}
      - {text: "`context.Background()` partout, et un `os.Exit` après un délai fixe pour arrêter le reste", correct: false}
      - {text: "Annuler chaque `r.Context()` au signal, et laisser les tâches de fond finir sans aucune limite", correct: false}
    answer: |-
      Le contexte racine vient de `signal.NotifyContext` ; les tâches de fond l'utilisent et s'arrêtent dès le signal.
      Les requêtes en cours ont leur propre contexte, que `srv.Shutdown` laisse vivre jusqu'à leur fin ou jusqu'au délai
      d'arrêt. Le nettoyage qui doit survivre à une requête annulée part d'un `WithoutCancel` borné par un délai, et
      `WithCancelCause(ErrArret)` sur les tâches de fond permet de journaliser « arrêt du service » plutôt qu'une
      annulation anonyme.
