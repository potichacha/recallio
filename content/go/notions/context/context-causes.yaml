notion: context-causes
cards:
  - key: apporte-withcancelcause
    format: course
    question: Qu'apporte WithCancelCause ?
    answer: Une cause d'annulation précise, récupérable par context.Cause (Go 1.20).
  - key: sert-withoutcancel
    format: course
    question: À quoi sert WithoutCancel ?
    answer: Garder les valeurs du parent sans hériter de son annulation (Go 1.21).
  - key: sert-afterfunc
    format: course
    question: À quoi sert AfterFunc ?
    answer: Exécuter une fonction à l'annulation du contexte (Go 1.21).
  - key: dois-ecrire-log-audit-apres-chaque
    format: scenario
    question: Tu dois écrire un log d'audit après chaque requête, même si le client se déconnecte.
    answer: |-
      Si j'utilise `r.Context()` directement, l'écriture sera annulée quand le client part. J'utiliserais `context.WithoutCancel(r.Context())` : on garde les valeurs utiles (identifiant de requête, utilisateur, trace) sans hériter de l'annulation, avec un timeout propre pour que l'écriture ne bloque pas indéfiniment.
      Si l'audit est critique, je ne le ferais pas en ligne mais via une file (ou l'outbox en base dans la même transaction), pour qu'il survive aussi à un crash du processus.
