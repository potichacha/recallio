notion: context-valeurs
cards:
  - key: type-utiliser-comme-cle-valeur
    format: course
    question: Quel type utiliser comme clé de valeur ?
    answer: Un type non exporté propre au package, jamais une string.
  - key: mettre-valeurs-contexte
    format: course
    question: Que mettre dans les valeurs de contexte ?
    answer: 'Des données de portée requête : request ID, identité, tracing ; jamais des dépendances ni des paramètres.'
