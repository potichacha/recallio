notion: context-valeurs
lesson: "**`context.WithValue(parent, cle, valeur)`** attache une valeur à un contexte ; `ctx.Value(cle)` la retrouve en\nremontant les parents.\n\n```go\ntype cleUtilisateur struct{} // un type non exporté : aucune collision possible\n\nfunc AvecUtilisateur(ctx context.Context, u Utilisateur) context.Context {\n\treturn context.WithValue(ctx, cleUtilisateur{}, u)\n}\n\nfunc UtilisateurDe(ctx context.Context) (Utilisateur, bool) {\n\tu, ok := ctx.Value(cleUtilisateur{}).(Utilisateur)\n\treturn u, ok\n}\n```\n\n**Ce qu'on y met** : des données **propres à la requête** qui traversent les couches sans être des paramètres\nmétier, et dont la plupart des fonctions n'ont pas besoin : identifiant de trace ou de requête, utilisateur\nauthentifié, informations pour les journaux.\n\n**Ce qu'on n'y met pas** :\n- des **paramètres** de la fonction (un identifiant de commande, une option) : ils deviennent invisibles dans la\n  signature ;\n- des **dépendances** (connexion à la base, logger configuré, client HTTP) : elles se passent au constructeur ;\n- des valeurs **mutables** partagées.\n\nLes règles techniques :\n- la clé est d'un **type non exporté** propre au package (`struct{}` ou `type cle int`), jamais une `string` : deux\n  packages qui utiliseraient `\"user\"` se marcheraient dessus (go vet le signale) ;\n- on expose des **fonctions d'accès typées** (`AvecUtilisateur`, `UtilisateurDe`) plutôt que la clé ;\n- la recherche **remonte la chaîne** des parents : elle est linéaire, et convient à quelques valeurs, pas à des\n  dizaines.\n\n**En entretien** : « Seulement des données de requête qui traversent les API : trace, utilisateur ; jamais des\nparamètres ni des dépendances ; une clé de type non exporté et des accesseurs typés. »"
cards:
  - key: type-utiliser-comme-cle-valeur
    format: course
    question: "Quel type utiliser comme clé d'une valeur de contexte ?"
    choices:
      - {text: "Un type non exporté propre au package, comme `type cleTrace struct{}`", correct: true}
      - {text: "Une `string` descriptive, comme `\"trace-id\"`, partagée entre packages", correct: false}
      - {text: "Un entier constant, comme `42`, choisi pour ne gêner personne", correct: false}
      - {text: "Un `int` tiré au hasard au démarrage, pour éviter les collisions", correct: false}
    answer: "Un type non exporté propre au package (souvent `struct{}`) : aucune clé d'un autre package ne peut lui être égale. Une `string` ou un `int` peut entrer en collision avec la clé d'un autre package."
  - key: mettre-valeurs-contexte
    format: course
    question: "Que mettre dans les valeurs d'un contexte ?"
    choices:
      - {text: "Des données de portée requête : identifiant, utilisateur, trace", correct: true}
      - {text: "Les dépendances du service : base de données, logger, clients", correct: false}
      - {text: "Les paramètres métier de la fonction, pour raccourcir sa signature", correct: false}
      - {text: "La configuration de l'application, lue une fois au démarrage", correct: false}
    answer: "Des données de portée requête : identifiant de requête, identité, trace. Jamais des dépendances (elles vont au constructeur) ni des paramètres (ils vont dans la signature)."
  - key: cle-string
    format: course
    question: "Pourquoi ne pas utiliser une `string` comme clé de `context.WithValue` ?"
    choices:
      - {text: "Deux packages qui choisissent la même chaîne écrasent mutuellement leurs valeurs", correct: true}
      - {text: "`WithValue` refuse une clé `string` à la compilation : il faut un type à soi", correct: false}
      - {text: "Une clé `string` est copiée à chaque recherche, ce qui ralentit beaucoup `Value`", correct: false}
      - {text: "Les clés `string` sont sensibles à la casse, et on se trompe facilement en les tapant", correct: false}
    answer: Deux packages qui choisiraient la même chaîne (`"user"`) écraseraient mutuellement leurs valeurs ; une clé d'un type non exporté est unique au package.
  - key: accesseurs
    format: course
    question: Comment exposer une valeur de contexte aux autres packages ?
    choices:
      - {text: "Par des fonctions typées, `AvecUtilisateur` et `UtilisateurDe`, la clé restant non exportée", correct: true}
      - {text: "En exportant la clé, pour que chaque package appelle lui-même `ctx.Value` et l'assertion", correct: false}
      - {text: "Par une variable globale qui garde la dernière valeur mise dans le contexte par le middleware", correct: false}
      - {text: "En rangeant la valeur sous une clé `string` connue, documentée pour tous les packages", correct: false}
    answer: 'Par des fonctions typées (`AvecUtilisateur(ctx, u)` et `UtilisateurDe(ctx) (Utilisateur, bool)`), en gardant la clé non exportée : l''assertion de type est à un seul endroit.'
  - key: vf-remonte
    format: true-false
    question: '`ctx.Value(k)` cherche la clé dans le contexte puis dans ses parents.'
    truth: true
    answer: Une valeur ajoutée par un parent est visible des enfants.
  - key: vf-dependances
    format: true-false
    question: Le contexte est un bon endroit pour passer la connexion à la base de données.
    truth: false
    answer: Une dépendance se passe au constructeur ; dans le contexte, elle devient invisible et non vérifiée.
  - key: vf-absente
    format: true-false
    question: '`ctx.Value(k)` renvoie nil quand la clé est absente.'
    truth: true
    answer: D'où l'assertion avec `, ok` dans les accesseurs.
  - key: vf-enfant
    format: true-false
    question: Une valeur ajoutée à un contexte enfant est visible depuis le parent.
    truth: false
    answer: La recherche remonte vers les parents, jamais vers les enfants.
  - key: qcm-oui
    format: multiple-choice
    question: "Lesquelles de ces données ont leur place dans les valeurs du contexte ?"
    choices:
      - text: L'identifiant de trace de la requête
        correct: true
      - text: L'utilisateur authentifié par le middleware
        correct: true
      - text: L'identifiant de la commande à afficher
        correct: false
      - text: Le pool de connexions SQL
        correct: false
    answer: Un paramètre métier va dans la signature, une dépendance dans le constructeur.
  - key: qcm-cle
    format: multiple-choice
    question: "Quelle clé convient pour `context.WithValue` ?"
    choices:
      - {text: "`type cleTrace struct{}`, un type non exporté", correct: true}
      - {text: "`const cleTrace = \"trace-id\"`, une constante non exportée", correct: false}
      - {text: "`\"trace-id\"`, une chaîne littérale", correct: false}
      - {text: "`42`, un entier littéral", correct: false}
    answer: "Une valeur d'un type non exporté (`cleTrace{}`, ou `type cle int` avec des constantes) ne peut égaler aucune clé d'un autre package. Une constante non typée prend le type `string` : elle peut entrer en collision comme un littéral."
  - key: qcm-defauts
    format: multiple-choice
    question: "Quel défaut a le passage de paramètres métier par le contexte ?"
    choices:
      - {text: "Le compilateur ne vérifie plus ni le type ni la présence de la valeur", correct: true}
      - {text: "Le contexte n'est plus sûr en concurrence dès qu'il porte une valeur", correct: false}
      - {text: "Les valeurs sont perdues à la première fonction qui reçoit le contexte", correct: false}
      - {text: "Les valeurs empêchent l'annulation de se propager aux contextes enfants", correct: false}
    answer: "Le compilateur ne vérifie plus ni le type ni la présence de la valeur : le code compile, puis échoue à l'exécution si elle manque. Et les dépendances de la fonction disparaissent de sa signature."
  - key: qcm-accesseur
    format: multiple-choice
    question: Quelle écriture d'accesseur est correcte ?
    choices:
      - text: '`u, ok := ctx.Value(cleUtilisateur{}).(Utilisateur); return u, ok`'
        correct: true
      - text: '`return ctx.Value(cleUtilisateur{}).(Utilisateur)`, qui panique si la valeur manque'
        correct: false
      - text: '`return ctx.Value("utilisateur")`'
        correct: false
      - text: '`ctx.Utilisateur`'
        correct: false
    answer: La forme `, ok` évite la panique.
  - key: trous-withvalue
    format: fill-in
    question: |-
      Complète pour ajouter l'identifiant de trace au contexte :
      ```go
      ctx = context.___(ctx, cleTrace{}, idTrace)
      ```
    blanks:
      - - WithValue
    answer: WithValue renvoie un contexte enfant qui porte la valeur.
  - key: trous-value
    format: fill-in
    question: |-
      Complète l'accesseur :
      ```go
      func TraceDe(ctx context.Context) string {
      	id, _ := ctx.___(cleTrace{}).(string)
      	return id
      }
      ```
    blanks:
      - - Value
    answer: Value cherche la clé.
  - key: trous-cle
    format: fill-in
    question: |-
      Complète une clé sans collision possible :
      ```go
      type cleTrace ___{}
      ```
    blanks:
      - - struct
    answer: Une struct vide d'un type non exporté.
  - key: trous-ok
    format: fill-in
    question: |-
      Complète pour ne pas paniquer si la valeur manque :
      ```go
      u, ___ := ctx.Value(cleUtilisateur{}).(Utilisateur)
      ```
    blanks:
      - - ok
    answer: L'assertion à deux résultats.
  - key: bug-string
    format: bug-fix
    question: |-
      staticcheck signale « should not use built-in type string as key for value » (SA1029). Quelle correction est la bonne ?
      ```go
      ctx = context.WithValue(ctx, "utilisateur", u)
      ```
    choices:
      - {text: "Déclarer `type cleUtilisateur struct{}` et prendre `cleUtilisateur{}` comme clé", correct: true}
      - {text: "Garder une chaîne, préfixée par le nom du package : `\"monpkg.utilisateur\"`", correct: false}
      - {text: "Convertir la clé avec `any(\"utilisateur\")`, pour qu'elle ne soit plus une `string`", correct: false}
      - {text: "Remplacer `WithValue` par une variable globale `utilisateurCourant`", correct: false}
    answer: |-
      ```go
      type cleUtilisateur struct{}

      ctx = context.WithValue(ctx, cleUtilisateur{}, u)
      ```
      Une clé string peut entrer en collision avec celle d'un autre package ; un type non exporté est unique.
  - key: bug-parametre
    format: bug-fix
    question: |-
      Ce service lit l'identifiant de la commande dans le contexte. Quelle correction est la bonne ?
      ```go
      func (s *Service) Facturer(ctx context.Context) error {
      	id := ctx.Value(cleCommande{}).(string)
      	return s.depot.Facturer(ctx, id)
      }
      ```
    choices:
      - {text: "Passer `idCommande` en paramètre explicite de `Facturer`, après `ctx`", correct: true}
      - {text: "Garder la valeur, mais la lire avec `, ok` pour ne plus paniquer si elle manque", correct: false}
      - {text: "Exporter la clé `cleCommande`, pour que les appelants la remplissent bien", correct: false}
      - {text: "Ranger l'identifiant dans un champ du `Service`, rempli avant chaque appel", correct: false}
    answer: "```go\nfunc (s *Service) Facturer(ctx context.Context, idCommande string) error {\n\treturn s.depot.Facturer(ctx, idCommande)\n}\n```\nL'identifiant est un paramètre métier : caché dans le contexte, il disparaît de la signature, n'est plus vérifié\npar le compilateur, et l'assertion panique s'il manque."
  - key: bug-dependance
    format: bug-fix
    question: |-
      Les tests doivent remplir le contexte d'une base, d'un logger et d'un client pour appeler chaque fonction. Quelle correction est la bonne ?
      ```go
      func Traiter(ctx context.Context) error {
      	db := ctx.Value(cleDB{}).(*sql.DB)
      	log := ctx.Value(cleLog{}).(*slog.Logger)
      	// ...
      }
      ```
    choices:
      - {text: "Passer la base et le logger au constructeur d'un `Service`, gardés dans ses champs", correct: true}
      - {text: "Fournir aux tests un contexte tout prêt, rempli une fois par une fonction d'aide", correct: false}
      - {text: "Lire les dépendances avec `, ok`, et créer une valeur par défaut si elles manquent", correct: false}
      - {text: "Ranger la base et le logger dans des variables globales du package", correct: false}
    answer: "```go\ntype Service struct {\n\tdb  *sql.DB\n\tlog *slog.Logger\n}\n\nfunc NouveauService(db *sql.DB, log *slog.Logger) *Service {\n\treturn &Service{db: db, log: log}\n}\n\nfunc (s *Service) Traiter(ctx context.Context) error { ... }\n```\nLes dépendances se passent au constructeur ; le contexte ne porte que des données de requête."
  - key: bug-panique
    format: bug-fix
    question: |-
      Une route appelée sans le middleware d'authentification fait paniquer le service. Quelle correction est la bonne ?
      ```go
      u := r.Context().Value(cleUtilisateur{}).(Utilisateur)
      ```
    choices:
      - {text: "Lire la valeur avec `, ok` (par l'accesseur) et répondre 401 si elle manque", correct: true}
      - {text: "Entourer la lecture d'un `recover`, pour que le service ne s'arrête pas", correct: false}
      - {text: "Remplacer l'assertion par une conversion `Utilisateur(...)`, qui ne panique pas", correct: false}
      - {text: "Mettre un `Utilisateur` vide dans le contexte de `main`, comme valeur par défaut", correct: false}
    answer: "```go\nu, ok := UtilisateurDe(r.Context())\nif !ok {\n\thttp.Error(w, \"non authentifié\", http.StatusUnauthorized)\n\treturn\n}\n```\nL'assertion simple panique si la valeur manque ; l'accesseur avec `, ok` permet de répondre proprement."
  - key: scenario-trace
    format: scenario
    question: Comment fais-tu apparaître l'identifiant de trace de chaque requête dans tous ses journaux ?
    choices:
      - {text: "Un middleware met l'identifiant dans le contexte ; un `slog.Handler` le lit pour chaque ligne", correct: true}
      - {text: "Une variable globale mise à jour par le middleware, lue par chaque appel au logger", correct: false}
      - {text: "Un paramètre `idTrace string` ajouté à toutes les fonctions, jusqu'aux plus profondes", correct: false}
      - {text: "Une map indexée par l'identifiant de goroutine, remplie par le middleware, lue par le logger", correct: false}
    answer: |-
      Un middleware lit l'en-tête de trace (ou en génère un), le met dans le contexte avec une clé non exportée et un
      accesseur, puis toutes les couches journalisent avec `slog.InfoContext(ctx, ...)` ; un `slog.Handler`
      personnalisé lit l'identifiant dans le contexte et l'ajoute à chaque ligne. Avec OpenTelemetry, c'est le span du
      contexte qui porte ces identifiants, et les appels sortants les propagent.
  - key: scenario-revue
    format: scenario
    question: En revue, tu trouves un contexte qui transporte une dizaine de valeurs. Que dis-tu ?
    choices:
      - {text: "Garder trace, utilisateur et locale ; rendre les paramètres en arguments, les dépendances au constructeur", correct: true}
      - {text: "Rien à redire : le contexte est fait pour porter toutes les données utiles à la requête", correct: false}
      - {text: "Regrouper les dix valeurs dans une seule struct, rangée sous une seule clé du contexte", correct: false}
      - {text: "Remplacer les clés `string` par des constantes nommées, et garder toutes les valeurs", correct: false}
    answer: |-
      Je trie : les données de requête transverses (trace, utilisateur, locale) peuvent rester ; les paramètres métier
      redeviennent des arguments, les dépendances passent au constructeur. Je rappelle que la recherche dans le contexte
      est linéaire le long de la chaîne et que rien n'est vérifié à la compilation. Je propose des accesseurs typés
      pour ce qui reste.
  - key: scenario-utilisateur
    format: scenario
    question: Comment transmets-tu l'utilisateur authentifié du middleware aux handlers ?
    choices:
      - {text: "`r.WithContext(AvecUtilisateur(...))` dans le middleware, `UtilisateurDe` avec `ok` dans les handlers", correct: true}
      - {text: "Une variable globale `utilisateurCourant`, remplie par le middleware à chaque requête", correct: false}
      - {text: "Un en-tête HTTP ajouté par le middleware, relu puis décodé par chaque handler", correct: false}
      - {text: "`context.WithValue(ctx, \"user\", u)` dans le middleware, sans vérifier le `ok` ensuite", correct: false}
    answer: |-
      Le middleware valide le jeton, construit un `Utilisateur` immuable et appelle `next.ServeHTTP(w,
      r.WithContext(AvecUtilisateur(r.Context(), u)))`. Les handlers récupèrent `UtilisateurDe(r.Context())`, en
      vérifiant le `ok`. Les couches métier, elles, reçoivent l'utilisateur (ou son identifiant) en paramètre explicite
      quand une décision en dépend.
  - key: scenario-java
    format: scenario
    question: "Quelle différence fais-tu entre les valeurs de contexte Go et les `ThreadLocal` de Java ?"
    choices:
      - {text: "Le contexte est explicite, passé en paramètre et immuable ; un `ThreadLocal` est implicite, lié au thread", correct: true}
      - {text: "Aucune : le contexte est un `ThreadLocal` attaché à la goroutine qui l'a créé", correct: false}
      - {text: "Le contexte est global au programme ; un `ThreadLocal` est propre à chaque requête", correct: false}
      - {text: "Le contexte est mutable et partagé ; un `ThreadLocal` est immuable et copié par thread", correct: false}
    answer: |-
      Les deux portent des données de requête sans les passer partout, mais le contexte est explicite : il voyage en
      paramètre, survit aux changements de goroutine, et chaque enfant est immuable. Un ThreadLocal est implicite,
      attaché au thread, et doit être nettoyé (pools de threads, threads virtuels). En Go, il n'existe pas de stockage
      par goroutine : c'est voulu.
