notion: context-delais
lesson: "Deux fonctions dérivent un contexte qui **expire tout seul** :\n- **`context.WithTimeout(parent, d)`** : expire au bout de la durée `d` ;\n- **`context.WithDeadline(parent, t)`** : expire à l'instant `t`.\n\n`WithTimeout(p, d)` équivaut à `WithDeadline(p, time.Now().Add(d))`. À l'échéance, `Done()` se ferme et `Err()` vaut\n**`context.DeadlineExceeded`**.\n\n```go\nfunc (c *Client) Profil(ctx context.Context, id string) (Profil, error) {\n\tctx, cancel := context.WithTimeout(ctx, 2*time.Second)\n\tdefer cancel() // toujours, même si le délai expire de lui-même\n\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, c.base+\"/profils/\"+id, nil)\n\tif err != nil {\n\t\treturn Profil{}, err\n\t}\n\tresp, err := c.http.Do(req) // interrompu à l'échéance\n\t// ...\n}\n```\n\nLes règles :\n- **toujours `defer cancel()`** : sinon le minuteur et le contexte restent en mémoire jusqu'à l'échéance (go vet le\n  signale) ;\n- l'échéance d'un enfant ne peut pas **dépasser** celle du parent : `WithTimeout(ctx, 10*time.Second)` sous un\n  parent qui expire dans 1 seconde expire dans 1 seconde ;\n- un délai se place **au plus près** de l'appel qu'il borne, et l'appelant garde son propre budget global ;\n- `ctx.Deadline()` dit combien de temps il reste, pour renoncer tôt à un travail qui ne tiendra pas.\n\n**En entretien** : « WithTimeout pour une durée, WithDeadline pour un instant ; defer cancel toujours ;\nDeadlineExceeded à l'échéance ; un enfant ne peut pas aller au-delà de son parent. »"
cards:
  - key: toujours-appeler-cancel
    format: course
    question: "Pourquoi faut-il toujours appeler la fonction `cancel` d'un contexte ?"
    choices:
      - {text: "Pour libérer tout de suite ses ressources et le détacher de son parent", correct: true}
      - {text: "Pour que le contexte commence à compter son délai à partir de là", correct: false}
      - {text: "Pour transmettre le résultat de l'opération aux contextes enfants", correct: false}
      - {text: "Pour rien : elle ne sert que si l'on veut annuler avant le délai", correct: false}
    answer: "Pour libérer tout de suite le contexte (et son minuteur) et le détacher de son parent ; sinon il vit jusqu'à l'annulation du parent ou jusqu'à son délai. `go vet` signale l'oubli (lostcancel)."
  - key: withtimeout-vs-withdeadline
    format: course
    question: "Quelle différence entre `context.WithTimeout` et `context.WithDeadline` ?"
    choices:
      - {text: "Une durée relative contre un instant absolu, avec le même mécanisme", correct: true}
      - {text: "Un délai qui annule le contexte contre un délai qui ne fait qu'avertir", correct: false}
      - {text: "Un délai pour les appels HTTP contre un délai pour les requêtes SQL", correct: false}
      - {text: "Un délai remis à zéro à chaque appel contre un délai fixé une fois", correct: false}
    answer: "`WithTimeout(ctx, d)` vaut `WithDeadline(ctx, time.Now().Add(d))` : une durée relative contre un instant absolu, même mécanisme, même annulation avec `DeadlineExceeded`."
  - key: delai-propage-appels-avals
    format: course
    question: "Comment le délai d'un contexte se propage-t-il aux appels avals ?"
    choices:
      - {text: "Un contexte dérivé ne peut pas dépasser l'échéance de son parent", correct: true}
      - {text: "Chaque appel aval repart avec un délai complet, remis à zéro", correct: false}
      - {text: "Il ne se propage pas : chaque appel aval doit fixer le sien", correct: false}
      - {text: "Le plus long des délais de la chaîne l'emporte sur les autres", correct: false}
    answer: "Un contexte dérivé hérite de l'échéance de son parent et ne peut pas la dépasser : chaque appel aval n'a que le temps qui reste. Un délai plus court, lui, s'applique."
  - key: endpoint-trois-appels-sequentiels-autres
    format: scenario
    question: "Un endpoint fait trois appels séquentiels à d'autres services et met parfois 30 secondes à échouer. Que corriges-tu ?"
    choices:
      - {text: "Un budget de temps global, dérivé en entrée du handler et passé à chacun des trois appels", correct: true}
      - {text: "Un délai de 10 secondes par appel, chacun dérivé de `context.Background()`", correct: false}
      - {text: "Un nouvel essai automatique de chaque appel, jusqu'à trois fois, sans délai", correct: false}
      - {text: "Un délai plus long sur le serveur HTTP, pour que l'endpoint ait le temps de finir", correct: false}
    answer: |-
      Il manque un **budget de temps**. Je dériverais en entrée de handler un contexte avec un timeout global aligné sur ce que le client accepte (par exemple 3 s), et je le passerais à chaque appel. Chaque appel hérite de l'échéance restante, donc le troisième ne peut pas démarrer avec un délai plus long que ce qui reste.
      Je vérifierais que chaque client utilise vraiment le contexte (`NewRequestWithContext`, clients gRPC) et que le client HTTP a aussi ses propres timeouts de connexion. Enfin, si les appels sont indépendants, je les lancerais en parallèle avec `errgroup` pour diviser la latence.
  - key: depasser
    format: course
    question: Que se passe-t-il si l'on dérive un contexte de 10 secondes d'un parent qui expire dans 1 seconde ?
    choices:
      - {text: "L'enfant expire dans 1 seconde, en même temps que son parent", correct: true}
      - {text: "L'enfant expire dans 10 secondes : son délai remplace celui du parent", correct: false}
      - {text: "L'enfant expire dans 11 secondes : les deux délais s'additionnent", correct: false}
      - {text: "`WithTimeout` panique : un enfant ne peut pas demander plus que son parent", correct: false}
    answer: 'L''enfant expire dans 1 seconde, avec le parent : un contexte ne peut pas prolonger l''échéance de son parent.'
  - key: vf-equivalence
    format: true-false
    question: '`WithTimeout(ctx, d)` équivaut à `WithDeadline(ctx, time.Now().Add(d))`.'
    truth: true
    answer: C'est ainsi qu'il est implémenté.
  - key: vf-expire
    format: true-false
    question: Un contexte WithTimeout qui a expiré n'a plus besoin que l'on appelle cancel.
    truth: false
    answer: On appelle toujours cancel (en defer) ; c'est la seule façon sûre de libérer le contexte dans tous les cas.
  - key: vf-err
    format: true-false
    question: À l'échéance, `ctx.Err()` vaut `context.DeadlineExceeded`.
    truth: true
    answer: Et `errors.Is(err, context.DeadlineExceeded)` le reconnaît dans une erreur enveloppée.
  - key: vf-prolonger
    format: true-false
    question: On peut prolonger l'échéance d'un contexte existant.
    truth: false
    answer: Un contexte est immuable ; un enfant ne va jamais au-delà du parent.
  - key: qcm-choisir
    format: multiple-choice
    question: "Quand préférer `WithDeadline` à `WithTimeout` ?"
    choices:
      - {text: "Quand on a un instant précis, par exemple une échéance reçue d'un autre service", correct: true}
      - {text: "Quand on veut un délai de 2 secondes à partir de maintenant", correct: false}
      - {text: "Jamais : `WithTimeout` est plus précis, car il ne dépend pas de l'horloge", correct: false}
      - {text: "Quand l'échéance doit survivre à l'annulation du contexte parent", correct: false}
    answer: "Quand on part d'un instant : une échéance reçue d'un autre service, ou plusieurs appels qui doivent finir avant la même heure. Pour une durée relative, `WithTimeout` est plus lisible ; les deux ont le même mécanisme."
  - key: qcm-deadline
    format: multiple-choice
    question: "À quoi sert `ctx.Deadline()` ?"
    choices:
      - {text: "À savoir s'il existe une échéance, et laquelle", correct: true}
      - {text: "À prolonger l'échéance quand le travail prend du retard", correct: false}
      - {text: "À annuler le contexte une fois l'échéance atteinte", correct: false}
      - {text: "À attendre que l'échéance arrive, comme un `time.Sleep`", correct: false}
    answer: "Elle renvoie l'échéance et un booléen qui dit s'il y en a une ; on s'en sert par exemple pour renoncer tôt à un travail qui ne tiendra pas dans le temps restant. Elle ne prolonge ni n'annule rien."
  - key: qcm-ou
    format: multiple-choice
    question: "Où placer le délai d'un appel à un service externe ?"
    choices:
      - {text: "Dans le client de ce service, dérivé du contexte reçu", correct: true}
      - {text: "Dans le client, dérivé de `context.Background()`, pour ne pas dépendre de l'appelant", correct: false}
      - {text: "Dans `main`, un seul délai global pour tout le programme", correct: false}
      - {text: "Nulle part : le service finira bien par répondre", correct: false}
    answer: "Au plus près de l'appel, dans le client du service, et dérivé du contexte reçu pour garder l'annulation et le budget de l'appelant. Partir de `Background` les perdrait."
  - key: qcm-erreurs
    format: multiple-choice
    question: "Comment reconnaître un délai de contexte dépassé dans l'erreur d'un client HTTP ?"
    choices:
      - {text: "`errors.Is(err, context.DeadlineExceeded)`", correct: true}
      - {text: "`err == context.DeadlineExceeded`", correct: false}
      - {text: "`err == context.Canceled`", correct: false}
      - {text: "`strings.Contains(err.Error(), \"timeout\")`", correct: false}
    answer: "`errors.Is` traverse l'enveloppe : le client renvoie une `*url.Error` qui contient `context.DeadlineExceeded`, que `==` ne voit pas. Une erreur dont `Timeout()` renvoie true le signale aussi ; comparer des chaînes est fragile."
  - key: trous-timeout
    format: fill-in
    question: |-
      Complète pour borner l'appel à 3 secondes :
      ```go
      ctx, cancel := context.___(ctx, 3*time.Second)
      defer ___()
      ```
    blanks:
      - - WithTimeout
      - - cancel
    answer: WithTimeout puis defer cancel.
  - key: trous-deadline
    format: fill-in
    question: |-
      Complète pour finir avant minuit :
      ```go
      ctx, cancel := context.___(ctx, minuit)
      defer cancel()
      ```
    blanks:
      - - WithDeadline
    answer: WithDeadline prend un instant.
  - key: trous-erreur
    format: fill-in
    question: |-
      Complète pour reconnaître le délai dépassé :
      ```go
      if errors.Is(err, context.___) {
      	return ErrServiceLent
      }
      ```
    blanks:
      - - DeadlineExceeded
    answer: DeadlineExceeded.
  - key: trous-reste
    format: fill-in
    question: |-
      Complète pour lire l'échéance :
      ```go
      if fin, ok := ctx.___(); ok && time.Until(fin) < 100*time.Millisecond {
      	return ErrPasLeTemps
      }
      ```
    blanks:
      - - Deadline
    answer: Deadline renvoie l'échéance et un booléen.
  - key: bug-cancel-oublie
    format: bug-fix
    question: |-
      Sous charge, la mémoire monte et le profil montre des milliers de minuteurs actifs. Quelle correction est la bonne ?
      ```go
      func (c *Client) Lire(ctx context.Context, id string) (Item, error) {
      	ctx, _ = context.WithTimeout(ctx, 30*time.Second)
      	return c.appeler(ctx, id)
      }
      ```
    choices:
      - {text: "Garder `cancel` et l'appeler en `defer`, pour libérer le contexte à la fin de l'appel", correct: true}
      - {text: "Raccourcir le délai à 1 seconde, pour que les minuteurs expirent plus vite", correct: false}
      - {text: "Appeler `runtime.GC()` après chaque appel, pour ramasser les minuteurs expirés", correct: false}
      - {text: "Remplacer `WithTimeout` par `time.AfterFunc`, plus léger qu'un contexte", correct: false}
    answer: "```go\nfunc (c *Client) Lire(ctx context.Context, id string) (Item, error) {\n\tctx, cancel := context.WithTimeout(ctx, 30*time.Second)\n\tdefer cancel()\n\treturn c.appeler(ctx, id)\n}\n```\nSans cancel, chaque contexte et son minuteur vivaient 30 secondes après la fin de l'appel."
  - key: bug-background
    format: bug-fix
    question: |-
      Les appels au service de prix continuent après la déconnexion du client. Quelle correction est la bonne ?
      ```go
      func (s *Service) Prix(ctx context.Context, id string) (int, error) {
      	ctx, cancel := context.WithTimeout(context.Background(), 2*time.Second)
      	defer cancel()
      	return s.client.Prix(ctx, id)
      }
      ```
    choices:
      - {text: "Dériver le délai du `ctx` reçu au lieu de `context.Background()`", correct: true}
      - {text: "Raccourcir le délai à 500 ms, pour finir avant le départ du client", correct: false}
      - {text: "Appeler `cancel()` juste avant `s.client.Prix`, au lieu de le différer", correct: false}
      - {text: "Remplacer `WithTimeout` par `WithDeadline`, avec `time.Now().Add(2 * time.Second)`", correct: false}
    answer: "```go\nfunc (s *Service) Prix(ctx context.Context, id string) (int, error) {\n\tctx, cancel := context.WithTimeout(ctx, 2*time.Second)\n\tdefer cancel()\n\treturn s.client.Prix(ctx, id)\n}\n```\nDérivé de Background, le délai perdait l'annulation et l'échéance de l'appelant ; on dérive du contexte reçu."
  - key: bug-boucle
    format: bug-fix
    question: |-
      Sur une liste de 100 000 identifiants, la mémoire monte pendant tout le traitement. Quelle correction est la bonne ?
      ```go
      for _, id := range ids {
      	ctx, cancel := context.WithTimeout(ctx, time.Second)
      	defer cancel()
      	traiter(ctx, id)
      }
      ```
    choices:
      - {text: "Mettre le corps du tour dans une fonction, dont le `defer cancel()` s'exécute à chaque tour", correct: true}
      - {text: "Écrire `defer func() { cancel() }()`, pour que l'appel se fasse à la fin de chaque tour", correct: false}
      - {text: "Déclarer `ctx` et `cancel` avant la boucle, pour n'en garder qu'un seul exemplaire", correct: false}
      - {text: "Appeler `runtime.GC()` à la fin de chaque tour, pour ramasser les contextes expirés", correct: false}
    answer: |-
      ```go
      for _, id := range ids {
      	if err := traiterUn(ctx, id); err != nil {
      		return err
      	}
      }

      func traiterUn(ctx context.Context, id string) error {
      	ctx, cancel := context.WithTimeout(ctx, time.Second)
      	defer cancel()
      	return traiter(ctx, id)
      }
      ```
      Les `defer` d'une boucle ne s'exécutent qu'à la fin de la fonction : chaque contexte reste retenu jusque-là. Une fonction par tour libère chaque contexte aussitôt.
  - key: bug-sans-delai
    format: bug-fix
    question: |-
      Le service se fige quand un partenaire ne répond plus. Quelle correction est la bonne ?
      ```go
      resp, err := http.Get(urlPartenaire)
      ```
    choices:
      - {text: "Une requête créée par `http.NewRequestWithContext`, avec un contexte borné par `WithTimeout`", correct: true}
      - {text: "Un `time.Sleep` avant chaque `http.Get`, pour laisser au partenaire le temps de répondre", correct: false}
      - {text: "Un nouvel essai de `http.Get` en boucle, jusqu'à ce que le partenaire finisse par répondre", correct: false}
      - {text: "Un `http.Get` lancé dans une goroutine, dont on ignore le résultat s'il tarde trop", correct: false}
    answer: "```go\nctx, cancel := context.WithTimeout(ctx, 3*time.Second)\ndefer cancel()\nreq, err := http.NewRequestWithContext(ctx, http.MethodGet, urlPartenaire, nil)\nif err != nil {\n\treturn err\n}\nresp, err := client.Do(req)\n```\n`http.Get` utilise le client par défaut, sans délai et sans contexte : une requête peut attendre pour toujours."
  - key: scenario-budget
    format: scenario
    question: Ton endpoint doit répondre en 500 ms et appelle trois services. Comment répartis-tu les délais ?
    choices:
      - {text: "Un contexte global de 500 ms, puis un délai plus court par appel, dérivé de ce contexte", correct: true}
      - {text: "Un délai de 500 ms par appel, chacun dérivé de `context.Background()`, en séquence", correct: false}
      - {text: "Un délai de 166 ms par appel, sans contexte global, et des appels toujours séquentiels", correct: false}
      - {text: "Aucun délai côté serveur : c'est au client de couper la requête au-delà de 500 ms", correct: false}
    answer: |-
      Un contexte global de 500 ms dérivé de la requête (ou fixé par un middleware), puis pour chaque appel un délai
      propre, plus court, dérivé de ce contexte : l'enfant ne peut de toute façon pas dépasser le budget restant. Les
      appels indépendants partent en parallèle (errgroup) ; un appel accessoire a un délai plus court et une valeur de
      repli. Je mesure les latences p99 de chaque service pour régler ces délais.
  - key: scenario-propager
    format: scenario
    question: Comment faire respecter l'échéance d'une requête par les services que tu appelles ?
    choices:
      - {text: "gRPC transmet l'échéance tout seul ; en HTTP, j'envoie le temps restant dans un en-tête", correct: true}
      - {text: "HTTP et gRPC transmettent tous deux l'échéance du contexte, sans rien faire de plus", correct: false}
      - {text: "Je passe le contexte en paramètre JSON, dans le corps de chaque requête sortante", correct: false}
      - {text: "C'est impossible : chaque service fixe ses délais seul, sans tenir compte de l'appelant", correct: false}
    answer: |-
      Avec gRPC, l'échéance du contexte est transmise automatiquement (en-tête `grpc-timeout`) et le serveur reçoit un
      contexte qui expire au même moment. En HTTP, rien n'est standard : on peut envoyer le temps restant dans un
      en-tête, que le serveur appelé convertit en `WithTimeout`. Dans tous les cas, chaque service garde aussi son propre
      délai maximal.
  - key: scenario-test
    format: scenario
    question: Comment testes-tu qu'une fonction respecte bien son délai ?
    choices:
      - {text: "Un faux service bloqué sur `<-ctx.Done()`, un délai court, et `errors.Is(err, context.DeadlineExceeded)`", correct: true}
      - {text: "Un vrai appel au service distant, en mesurant le temps de réponse sur plusieurs essais", correct: false}
      - {text: "Un `time.Sleep` du délai complet dans le test, puis une vérification que la fonction a fini", correct: false}
      - {text: "Une simple relecture du code : un délai ne se teste pas, puisqu'il dépend de la machine", correct: false}
    answer: |-
      Je lui passe un faux service qui bloque jusqu'à l'annulation de son contexte (`<-ctx.Done()`), puis je vérifie
      qu'elle renvoie `context.DeadlineExceeded` (avec `errors.Is`) et qu'elle a rendu la main vite. Pour ne pas attendre
      de vrais délais, le délai est un paramètre réglé très court dans le test, ou j'utilise `testing/synctest`
      (Go 1.25), dont l'horloge virtuelle avance instantanément.
