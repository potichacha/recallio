notion: context-conventions
lesson: "Les conventions autour du contexte sont suivies par toute la bibliothèque standard et par les linters :\n\n1. **Premier paramètre, nommé `ctx`** : `func (s *Service) Trouver(ctx context.Context, id string) (Produit, error)`.\n2. **Jamais dans une struct** : on le passe à chaque appel. Une struct qui garde un contexte mélange la durée de vie\n   de l'objet et celle d'une requête (exception admise : une struct qui représente elle-même une opération, comme\n   `http.Request`).\n3. **Jamais nil** : si l'on n'a pas de contexte, `context.TODO()` (ou `Background()` à la racine). Beaucoup de\n   fonctions paniquent sur un contexte nil.\n4. **On transmet celui qu'on a reçu** (ou un enfant), on n'en recrée pas un avec `Background()` au milieu du code :\n   cela couperait l'annulation et l'échéance de l'appelant.\n5. **Une fonction qui reçoit `ctx` le respecte** : elle le passe à ses appels bloquants et renvoie `ctx.Err()` si\n   elle s'arrête à cause de lui.\n6. **`cancel` appelé par celui qui a créé le contexte**, en `defer`.\n\n```go\n// bien\nfunc (c *Client) Envoyer(ctx context.Context, m Message) error\n\n// mal\ntype Client struct {\n\tctx context.Context // durée de vie confuse\n}\nfunc (c *Client) Envoyer(m Message, ctx context.Context) error // pas en premier\n```\n\nDans un serveur HTTP : `r.Context()` ; dans un test : `t.Context()` (Go 1.24), annulé à la fin du test.\n\n**En entretien** : « ctx en premier paramètre, jamais dans une struct, jamais nil, on propage celui qu'on reçoit, et\ncelui qui crée appelle cancel. »"
cards:
  - key: stocker-contexte-struct
    format: course
    question: "Peut-on ranger un contexte dans un champ de struct ?"
    choices:
      - {text: "C'est déconseillé : on le passe en premier paramètre de chaque appel", correct: true}
      - {text: "Oui, c'est la convention : on le donne une fois au constructeur", correct: false}
      - {text: "Non : le compilateur refuse un champ de type `context.Context`", correct: false}
      - {text: "Oui, à condition de protéger le champ par un `sync.Mutex`", correct: false}
    answer: "C'est permis mais déconseillé : la durée de vie de l'objet se mêle à celle de la requête. On passe le contexte en premier paramètre de chaque appel ; `http.Request` est l'exception historique."
  - key: passer-contexte-nil
    format: course
    question: "Peut-on passer un contexte `nil` à une fonction ?"
    choices:
      - {text: "Non : en attendant le bon contexte, on passe `context.TODO()`", correct: true}
      - {text: "Oui : la fonction le remplace alors par `context.Background()`", correct: false}
      - {text: "Oui, dans un test, où aucune annulation n'est nécessaire", correct: false}
      - {text: "Oui, s'il ne sert qu'à transporter des valeurs facultatives", correct: false}
    answer: "Non : une fonction qui appelle `ctx.Done()` ou `ctx.Err()` paniquerait. Si le bon contexte n'est pas encore connu, on passe `context.TODO()` ; dans un test, `t.Context()`."
  - key: contexte-thread-safe
    format: course
    question: "Un contexte peut-il être utilisé par plusieurs goroutines à la fois ?"
    choices:
      - {text: "Oui : il est immuable, et ses méthodes sont sûres en concurrence", correct: true}
      - {text: "Non : chaque goroutine doit recevoir sa propre copie du contexte", correct: false}
      - {text: "Oui, mais seulement si on le protège par un `sync.Mutex`", correct: false}
      - {text: "Non : seule la goroutine qui l'a créé peut appeler `Done()`", correct: false}
    answer: "Oui : un contexte est immuable (on en dérive de nouveaux) et ses méthodes peuvent être appelées par plusieurs goroutines en même temps. C'est ce qui permet d'annuler tout un groupe de goroutines d'un coup."
  - key: contexte-utiliser-handler-http
    format: course
    question: "Quel contexte un handler HTTP doit-il utiliser ?"
    choices:
      - {text: "`r.Context()`, annulé quand le client se déconnecte", correct: true}
      - {text: "`context.Background()`, créé au début du handler", correct: false}
      - {text: "Le contexte de `main`, gardé dans une variable globale", correct: false}
      - {text: "`context.TODO()`, puisque la requête n'en porte aucun", correct: false}
    answer: "`r.Context()`, annulé quand le client se déconnecte ou quand le handler rend la main. Partir de `Background` perdrait cette annulation."
  - key: vf-premier
    format: true-false
    question: Par convention, le contexte est le premier paramètre d'une fonction.
    truth: true
    answer: Et il se nomme ctx.
  - key: vf-nil
    format: true-false
    question: On peut passer nil à une fonction qui attend un contexte si l'on n'en a pas.
    truth: false
    answer: On passe context.TODO() ; nil fait paniquer beaucoup de fonctions.
  - key: vf-t-context
    format: true-false
    question: Depuis Go 1.24, `t.Context()` fournit dans un test un contexte annulé à la fin du test.
    truth: true
    answer: Juste avant les fonctions de nettoyage enregistrées par t.Cleanup.
  - key: vf-recreer
    format: true-false
    question: Une fonction de bas niveau peut remplacer le contexte reçu par context.Background() pour être sûre de finir.
    truth: false
    answer: Elle couperait l'annulation et l'échéance de l'appelant ; WithoutCancel existe pour les rares cas voulus.
  - key: qcm-signatures
    format: multiple-choice
    question: "Lesquelles de ces signatures respectent les conventions du contexte ?"
    choices:
      - text: '`func Trouver(ctx context.Context, id string) (Produit, error)`'
        correct: true
      - text: '`func (s *Service) Lister(ctx context.Context, filtre Filtre) ([]Produit, error)`'
        correct: true
      - text: '`func Trouver(id string, ctx context.Context) (Produit, error)`'
        correct: false
      - text: '`func Trouver(c context.Context, ctx2 context.Context, id string)`'
        correct: false
    answer: "Un seul contexte, en premier paramètre, nommé `ctx`."
  - key: qcm-struct
    format: multiple-choice
    question: "Pourquoi ne pas ranger un contexte dans une struct ?"
    choices:
      - {text: "La durée de vie de l'objet et celle de la requête se mélangent", correct: true}
      - {text: "Le compilateur refuse un champ de type `context.Context`", correct: false}
      - {text: "Le contexte devient mutable, et donc dangereux en concurrence", correct: false}
      - {text: "Le ramasse-miettes ne libère jamais un contexte rangé dans une struct", correct: false}
    answer: "Un objet vit plus longtemps qu'une requête : il garderait un contexte déjà annulé, et ses appelants ne pourraient plus donner un contexte par appel. Le compilateur le permet, la documentation le déconseille."
  - key: qcm-test
    format: multiple-choice
    question: "Quel contexte est fait pour un test, depuis Go 1.24 ?"
    choices:
      - {text: "`t.Context()`, annulé juste avant la fin du test", correct: true}
      - {text: "`context.TODO()`, réservé aux tests unitaires", correct: false}
      - {text: "`nil`, puisqu'un test n'a rien à annuler", correct: false}
      - {text: "`r.Context()`, celui d'une fausse requête HTTP", correct: false}
    answer: "`t.Context()` (Go 1.24), annulé juste avant les fonctions de `t.Cleanup` : il permet aussi de vérifier que les goroutines s'arrêtent avec le test. `context.Background()` reste possible ; `TODO` marque un contexte pas encore relié, et `nil` est interdit."
  - key: qcm-cancel
    format: multiple-choice
    question: Qui doit appeler la fonction cancel d'un contexte ?
    choices:
      - text: La fonction qui a créé le contexte, en defer
        correct: true
      - text: N'importe quelle fonction appelée qui reçoit le contexte
        correct: false
      - text: Le ramasse-miettes
        correct: false
      - text: Personne si le contexte a un délai
        correct: false
    answer: Celui qui crée gère la durée de vie.
  - key: bug-struct
    format: bug-fix
    question: |-
      Après la première requête, toutes les suivantes échouent avec « context canceled ». Quelle correction est la bonne ?
      ```go
      type Depot struct {
      	db  *sql.DB
      	ctx context.Context
      }

      func (d *Depot) Trouver(id string) (Produit, error) {
      	return d.lire(d.ctx, id)
      }
      ```
    choices:
      - {text: "Retirer le champ `ctx` et passer le contexte en paramètre de `Trouver`", correct: true}
      - {text: "Remplacer `d.ctx` par `context.Background()` dans le constructeur du dépôt", correct: false}
      - {text: "Protéger `d.ctx` par un `sync.Mutex`, partagé par toutes les requêtes", correct: false}
      - {text: "Tester `d.ctx.Err()` et ignorer l'erreur quand elle vaut `context.Canceled`", correct: false}
    answer: "```go\ntype Depot struct {\n\tdb *sql.DB\n}\n\nfunc (d *Depot) Trouver(ctx context.Context, id string) (Produit, error) {\n\treturn d.lire(ctx, id)\n}\n```\nLe dépôt gardait le contexte d'une requête terminée ; chaque appel reçoit désormais le sien."
  - key: bug-nil
    format: bug-fix
    question: |-
      Ce test panique dans `QueryContext`. Quelle correction est la bonne ?
      ```go
      produits, err := depot.Lister(nil, filtre)
      ```
    choices:
      - {text: "Passer `t.Context()`, ou `context.Background()`, au lieu de `nil`", correct: true}
      - {text: "Entourer l'appel d'un `recover`, pour que le test continue malgré tout", correct: false}
      - {text: "Passer `context.Context(nil)` : un nil converti au type de l'interface", correct: false}
      - {text: "Appeler `t.Parallel()`, pour que le test reçoive son propre contexte", correct: false}
    answer: |-
      ```go
      produits, err := depot.Lister(t.Context(), filtre)
      ```
      Un contexte n'est jamais nil ; dans un test, `t.Context()` (ou `context.Background()`).
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le linter signale « context.Context should be the first parameter of a function ». Quelle correction est la bonne ?
      ```go
      func Exporter(format string, w io.Writer, ctx context.Context) error
      ```
    choices:
      - {text: "`func Exporter(ctx context.Context, format string, w io.Writer) error`", correct: true}
      - {text: "`func Exporter(format string, ctx context.Context, w io.Writer) error`", correct: false}
      - {text: "`func Exporter(w io.Writer, format string, ctx context.Context) error`", correct: false}
      - {text: "`func Exporter(format string, w io.Writer) error`, avec `ctx` en variable globale", correct: false}
    answer: |-
      ```go
      func Exporter(ctx context.Context, format string, w io.Writer) error
      ```
      Le contexte vient en premier, nommé ctx.
  - key: bug-ignore
    format: bug-fix
    question: |-
      Cette fonction reçoit un contexte mais n'arrête jamais l'appel quand il est annulé. Quelle correction est la bonne ?
      ```go
      func (c *Client) Telecharger(ctx context.Context, url string) ([]byte, error) {
      	resp, err := http.Get(url)
      	if err != nil {
      		return nil, err
      	}
      	defer resp.Body.Close()
      	return io.ReadAll(resp.Body)
      }
      ```
    choices:
      - {text: "Créer la requête avec `http.NewRequestWithContext(ctx, ...)`, puis l'envoyer par `Do`", correct: true}
      - {text: "Tester `ctx.Err()` avant `http.Get`, et renvoyer l'erreur s'il est déjà annulé", correct: false}
      - {text: "Lancer `http.Get` dans une goroutine, et rendre la main dès que `ctx.Done()` se ferme", correct: false}
      - {text: "Ajouter `defer ctx.Done()` au début de la fonction, pour lier l'appel au contexte", correct: false}
    answer: "```go\nfunc (c *Client) Telecharger(ctx context.Context, url string) ([]byte, error) {\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tresp, err := c.http.Do(req)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer resp.Body.Close()\n\treturn io.ReadAll(resp.Body)\n}\n```\nRecevoir ctx engage à le respecter : on le passe à la requête, qui s'interrompt à l'annulation."
  - key: scenario-revue
    format: scenario
    question: "En revue de code, quelles règles fais-tu respecter sur l'usage du contexte ?"
    choices:
      - {text: "`ctx` en premier, jamais dans une struct ni nil, passé aux appels bloquants, `defer cancel()`", correct: true}
      - {text: "Un contexte rangé dans chaque struct de service, créé une fois au démarrage avec `Background`", correct: false}
      - {text: "`context.Background()` au début de chaque fonction, pour ne pas dépendre de l'appelant", correct: false}
      - {text: "Toutes les données de la fonction passées par `WithValue`, pour des signatures plus courtes", correct: false}
    answer: |-
      ctx en premier paramètre ; pas de contexte dans une struct ; jamais nil ni Background au milieu du code ; chaque
      appel bloquant reçoit ctx (`QueryContext`, `NewRequestWithContext`, select sur Done) ; chaque WithCancel ou
      WithTimeout suivi de `defer cancel()` ; les erreurs `context.Canceled` traitées comme normales ; et WithValue
      réservé aux données de requête.
  - key: scenario-struct-exception
    format: scenario
    question: "`http.Request` contient un contexte. N'est-ce pas contraire à la convention ?"
    choices:
      - {text: "C'est l'exception admise : une `Request` est elle-même une opération, de même durée de vie", correct: true}
      - {text: "Oui : c'est une erreur de conception, que le langage corrigera en retirant ce champ", correct: false}
      - {text: "Non : la convention ne vise que les fonctions, jamais les types de la bibliothèque standard", correct: false}
      - {text: "Non : un contexte peut aller dans toute struct, la convention ne concerne que `nil`", correct: false}
    answer: |-
      C'est l'exception admise : une Request représente elle-même une opération, dont la durée de vie est celle du
      contexte. Il a été ajouté après coup (Go 1.7) pour ne pas casser l'API, avec `WithContext` pour en dériver une
      copie. Pour un objet qui vit plus longtemps qu'une opération (un client, un dépôt, un service), on passe le contexte
      à chaque appel.
  - key: scenario-bibliotheque
    format: scenario
    question: Tu écris une bibliothèque cliente pour une API. Comment gères-tu le contexte dans son API publique ?
    choices:
      - {text: "`ctx` en premier paramètre de chaque méthode réseau, aucun contexte gardé dans le client", correct: true}
      - {text: "Un contexte donné une fois au constructeur du client, réutilisé par toutes ses méthodes", correct: false}
      - {text: "`context.Background()` dans chaque méthode, pour que l'appelant ne puisse rien annuler", correct: false}
      - {text: "Des méthodes sans contexte, et un délai global fixé par une variable d'environnement", correct: false}
    answer: |-
      Chaque méthode qui fait un appel réseau prend `ctx context.Context` en premier paramètre et le passe à la requête ;
      le client ne garde aucun contexte. Il a son propre délai par défaut (sur le `http.Client`), que le contexte de
      l'appelant peut raccourcir. Les erreurs d'annulation sont renvoyées enveloppées, reconnaissables par `errors.Is`,
      et aucune goroutine ne survit à l'appel.
  - key: scenario-arret-service
    format: scenario
    question: Comment organises-tu les contextes d'un service, de main jusqu'aux requêtes ?
    choices:
      - {text: "`signal.NotifyContext` dans main pour le fond, `r.Context()` par requête, `srv.Shutdown` avec délai", correct: true}
      - {text: "Un `context.Background()` par composant, et un `os.Exit` dès la réception du signal d'arrêt", correct: false}
      - {text: "Le contexte de main rangé dans une globale, que chaque requête relit pour savoir s'il faut s'arrêter", correct: false}
      - {text: "Un contexte unique créé dans main et passé tel quel à chaque requête, sans délai ni dérivation", correct: false}
    answer: |-
      Dans main, `signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)` donne un contexte annulé à
      l'arrêt, passé aux composants de fond (consommateurs, tâches planifiées). Le serveur HTTP crée un contexte par
      requête (`r.Context()`), transmis à chaque couche et borné par des délais. À l'arrêt, `srv.Shutdown(ctx)` avec un
      délai laisse finir les requêtes en cours.
