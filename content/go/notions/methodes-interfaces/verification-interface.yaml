notion: verification-interface
lesson: |-
  En Go, rien n'oblige à déclarer qu'un type implémente une interface. Pour **forcer la vérification à la compilation**,
  dans le package du type, on écrit :

  ```go
  var _ io.Writer = (*Journal)(nil)   // *Journal doit implémenter io.Writer
  var _ http.Handler = (*Routeur)(nil)
  var _ fmt.Stringer = Statut(0)      // pour un type valeur
  ```

  - La variable s'appelle `_` : elle n'existe pas, rien n'est alloué à l'exécution.
  - `(*Journal)(nil)` est un pointeur nil typé : il suffit au compilateur pour vérifier l'ensemble de méthodes.
  - Si une méthode manque ou change de signature, la **compilation du package échoue**, avec un message qui nomme la
    méthode.

  Quand l'écrire : pour un type qui **doit** implémenter une interface sans qu'aucun code du package ne l'utilise comme
  tel (un handler, un plugin, une implémentation d'un port de domaine), ou pour documenter l'intention. Inutile si le
  package affecte déjà le type à l'interface quelque part.

  **Piège classique** : un refactoring renomme `ServeHTTP` en `ServeHttp` ; sans cette ligne, l'erreur n'apparaît que
  dans un autre package, voire à l'exécution via une assertion.

  **En entretien** : « var _ I = (*T)(nil) : une vérification gratuite à la compilation, qui documente qu'un type doit
  implémenter une interface. »
cards:
  - key: verifier-compilation-type-implemente-interface
    format: course
    question: Comment vérifier à la compilation qu'un type implémente une interface ?
    choices:
      - {text: "`var _ Interface = (*Type)(nil)`", correct: true}
      - {text: "`type Type implements Interface`", correct: false}
      - {text: "`assert.Implements(Interface, Type)`", correct: false}
      - {text: "`//go:implements Interface`", correct: false}
    answer: "Avec `var _ Interface = (*Type)(nil)` : la compilation échoue si une méthode manque. Go n'a pas de mot-clé `implements`, et une assertion de bibliothèque de test ne vérifie qu'à l'exécution."
  - key: verifier-statiquement-type-implemente-interface
    format: course
    question: "Dans `var _ I = (*T)(nil)`, à quoi sert le `_` ?"
    choices:
      - {text: "À ne garder aucune variable : seule compte la vérification de types", correct: true}
      - {text: "À désigner n'importe quelle interface que `*T` implémente", correct: false}
      - {text: "À ignorer l'erreur de compilation si `*T` n'implémente pas `I`", correct: false}
      - {text: "À exporter la vérification vers les packages qui importent `T`", correct: false}
    answer: "La variable blanche n'est jamais conservée : la ligne ne sert qu'à faire vérifier par le compilateur que `*T` est affectable à `I`."
  - key: syntaxe
    format: course
    question: Comment vérifier à la compilation que `*Depot` implémente `Stockage` ?
    choices:
      - {text: "`var _ Stockage = (*Depot)(nil)`, dans le package de `Depot`", correct: true}
      - {text: "`var _ *Depot = Stockage(nil)`, dans le package de `Depot`", correct: false}
      - {text: "`var _ = (*Depot).(Stockage)`, dans le package de `Stockage`", correct: false}
      - {text: "`var _ Stockage = Depot{}`, dans le package de `Stockage`", correct: false}
    answer: 'Avec `var _ Stockage = (*Depot)(nil)` dans le package de `Depot` : la compilation échoue si une méthode manque.'
  - key: cout
    format: course
    question: La ligne `var _ io.Writer = (*Journal)(nil)` coûte-t-elle quelque chose à l'exécution ?
    choices:
      - {text: "Non : la variable blanche n'est pas conservée, c'est une pure vérification", correct: true}
      - {text: "Oui : un `Journal` est alloué au démarrage du programme", correct: false}
      - {text: "Oui : la vérification est refaite à chaque appel de `Write`", correct: false}
      - {text: "Oui : elle garde un pointeur nil vivant pour le GC", correct: false}
    answer: 'Non : la variable blanche n''est pas conservée, c''est une pure vérification de types.'
  - key: vf-allocation
    format: true-false
    question: '`var _ Stockage = (*Depot)(nil)` alloue un Depot au démarrage.'
    truth: false
    answer: Le pointeur nil ne crée rien ; seule la vérification de types a lieu.
  - key: vf-erreur
    format: true-false
    question: Si `*Depot` perd une méthode de `Stockage`, cette ligne provoque une erreur de compilation.
    truth: true
    answer: Le message nomme la méthode manquante ou à la mauvaise signature.
  - key: vf-valeur
    format: true-false
    question: Pour un type à receveurs valeur, on peut écrire `var _ fmt.Stringer = Statut(0)`.
    truth: true
    answer: Une valeur suffit quand les méthodes sont sur le type valeur.
  - key: vf-obligatoire
    format: true-false
    question: Cette ligne est obligatoire pour qu'un type implémente une interface.
    truth: false
    answer: L'implémentation reste implicite ; la ligne ne fait que vérifier et documenter.
  - key: qcm-formes
    format: multiple-choice
    question: "Laquelle de ces lignes vérifie qu'un type implémente une interface ?"
    choices:
      - {text: "`var _ http.Handler = (*Routeur)(nil)`", correct: true}
      - {text: "`type Routeur implements http.Handler`", correct: false}
      - {text: "`assert(Routeur, http.Handler)`", correct: false}
      - {text: "`var _ = http.Handler.(*Routeur)`", correct: false}
    answer: "Une affectation à une variable blanche fait vérifier la correspondance par le compilateur ; `var _ io.Reader = &Fichier{}` marche aussi, mais alloue une valeur inutilement. Go n'a ni `implements` ni `assert`."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans lequel de ces cas une ligne `var _ I = (*T)(nil)` est-elle utile ?"
    choices:
      - {text: "Un handler enregistré ailleurs, que son package n'utilise jamais comme `http.Handler`", correct: true}
      - {text: "Un type que son package affecte déjà à l'interface dans son propre code", correct: false}
      - {text: "Un type sans aucune méthode, qui ne peut donc rien implémenter", correct: false}
      - {text: "Un type local à une fonction de test, qui n'est jamais exporté", correct: false}
    answer: "Quand rien d'autre dans le package ne déclencherait la vérification : un handler enregistré ailleurs, ou l'adaptateur d'un port du domaine dans l'infrastructure."
  - key: qcm-nil
    format: multiple-choice
    question: Pourquoi écrire `(*Journal)(nil)` plutôt que `&Journal{}` ?
    choices:
      - {text: "Pour ne rien allouer, un pointeur nil typé suffisant à la vérification", correct: true}
      - {text: "Parce que `&Journal{}` ne compile pas dans une déclaration de variable", correct: false}
      - {text: "Pour que le journal reste nil à l'exécution, et soit créé plus tard", correct: false}
      - {text: "Pour désactiver la vérification quand le type n'a pas encore de méthodes", correct: false}
    answer: Les deux vérifient ; la forme nil évite toute construction.
  - key: qcm-message
    format: multiple-choice
    question: Que dit le compilateur si `*Journal` n'a plus de méthode `Write` ?
    choices:
      - {text: "« *Journal does not implement io.Writer (missing method Write) »", correct: true}
      - {text: "Rien : l'erreur n'apparaît qu'à l'exécution, au premier appel de `Write`", correct: false}
      - {text: "« declared and not used: _ », pour une variable jamais utilisée", correct: false}
      - {text: "« cannot convert nil to type *Journal », pour le pointeur nil", correct: false}
    answer: Le message nomme précisément la méthode.
  - key: trous-blanc
    format: fill-in
    question: |-
      Complète la vérification :
      ```go
      var ___ http.Handler = (*Routeur)(nil)
      ```
    blanks:
      - - _
    answer: Une variable blanche, jamais conservée.
  - key: trous-nil
    format: fill-in
    question: |-
      Complète le pointeur nil typé :
      ```go
      var _ io.Writer = (*Journal)(___)
      ```
    blanks:
      - - nil
    answer: Le pointeur nil suffit au compilateur.
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour vérifier l'implémentation par le pointeur :
      ```go
      var _ Stockage = (___Depot)(nil)
      ```
    blanks:
      - - '*'
    answer: Si les méthodes ont des receveurs pointeurs, c'est `*Depot` qui implémente.
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour un type à receveur valeur :
      ```go
      var _ fmt.Stringer = Statut(___)
      ```
    blanks:
      - - '0'
    answer: Une valeur quelconque du type suffit.
  - key: bug-renommage
    format: bug-fix
    question: 'Après un renommage en `ServeHttp`, le serveur répond 404 sur la route : le type n''implémente plus `http.Handler`, mais rien ne l''a signalé à la compilation. Que faut-il ajouter ?'
    choices:
      - {text: "`var _ http.Handler = (*Routeur)(nil)`, à côté du type", correct: true}
      - {text: "Un test qui appelle directement `ServeHttp` sur le routeur", correct: false}
      - {text: "Un commentaire `// implements http.Handler` sur le type", correct: false}
      - {text: "Un `recover()` dans le routeur, qui répond 500 au lieu de 404", correct: false}
    answer: |-
      ```go
      var _ http.Handler = (*Routeur)(nil)
      ```
      Avec cette ligne, le renommage aurait cassé la compilation du package, avec un message clair sur `ServeHTTP`.
  - key: bug-mauvais-receveur
    format: bug-fix
    question: |-
      Cette vérification échoue à la compilation, alors que la méthode existe. Quelle correction est la bonne ?
      ```go
      func (d *Depot) Lire(id string) (Doc, error) { ... }

      var _ Stockage = Depot{}
      ```
    choices:
      - {text: "`var _ Stockage = (*Depot)(nil)` : c'est le pointeur qui implémente", correct: true}
      - {text: "`var _ Stockage = Depot(nil)`, une valeur `Depot` nil", correct: false}
      - {text: "`var _ *Stockage = Depot{}`, un pointeur vers l'interface", correct: false}
      - {text: "`var _ Stockage = &Depot{}.Lire`, la méthode seule", correct: false}
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La méthode a un receveur pointeur : c'est `*Depot`, pas `Depot`, qui implémente l'interface.
  - key: bug-allocation
    format: bug-fix
    question: |-
      En revue, cette vérification construit un objet complet, et paniquerait au démarrage. Quelle simplification est la bonne ?
      ```go
      var _ Stockage = NouveauDepot(sql.OpenDB(nil))
      ```
    choices:
      - {text: "`var _ Stockage = (*Depot)(nil)`, sans rien construire", correct: true}
      - {text: "Déplacer la ligne dans une fonction `init()`, exécutée plus tôt", correct: false}
      - {text: "`var _ Stockage = NouveauDepot(nil)`, sans ouvrir de base", correct: false}
      - {text: "Supprimer la ligne : la vérification n'a lieu qu'à l'exécution", correct: false}
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La vérification n'a besoin que du type : la construction s'exécuterait au démarrage du programme, pour rien (et
      ici paniquerait).
  - key: bug-mauvais-package
    format: bug-fix
    question: La vérification `var _ domaine.Stockage = (*infra.Depot)(nil)` est placée dans le package `domaine`. Pourquoi est-ce une mauvaise idée ?
    choices:
      - {text: "Le domaine importerait l'infrastructure, à l'inverse des dépendances voulues", correct: true}
      - {text: "Une vérification placée hors du package du type est ignorée par le compilateur", correct: false}
      - {text: "Le domaine ne peut pas mentionner le type pointeur d'un autre package", correct: false}
      - {text: "La vérification s'exécuterait à chaque appel d'une méthode du dépôt", correct: false}
    answer: |-
      ```go
      // dans le package infra, à côté de Depot
      var _ domaine.Stockage = (*Depot)(nil)
      ```
      Placée dans `domaine`, elle obligerait le domaine à importer l'infrastructure, à l'inverse des dépendances voulues
      (et créerait un cycle si `infra` importe déjà `domaine`). La vérification se met dans le package de
      l'implémentation.
