notion: verification-interface
lesson: |-
  En Go, rien n'oblige à déclarer qu'un type implémente une interface. Pour **forcer la vérification à la compilation**,
  dans le package du type, on écrit :

  ```go
  var _ io.Writer = (*Journal)(nil)   // *Journal doit implémenter io.Writer
  var _ http.Handler = (*Routeur)(nil)
  var _ fmt.Stringer = Statut(0)      // pour un type valeur
  ```

  - La variable s'appelle `_` : elle n'existe pas, rien n'est alloué à l'exécution.
  - `(*Journal)(nil)` est un pointeur nil typé : il suffit au compilateur pour vérifier l'ensemble de méthodes.
  - Si une méthode manque ou change de signature, la **compilation du package échoue**, avec un message qui nomme la
    méthode.

  Quand l'écrire : pour un type qui **doit** implémenter une interface sans qu'aucun code du package ne l'utilise comme
  tel (un handler, un plugin, une implémentation d'un port de domaine), ou pour documenter l'intention. Inutile si le
  package affecte déjà le type à l'interface quelque part.

  **Piège classique** : un refactoring renomme `ServeHTTP` en `ServeHttp` ; sans cette ligne, l'erreur n'apparaît que
  dans un autre package, voire à l'exécution via une assertion.

  **En entretien** : « var _ I = (*T)(nil) : une vérification gratuite à la compilation, qui documente qu'un type doit
  implémenter une interface. »
cards:
  - key: verifier-compilation-type-implemente-interface
    format: course
    question: Comment vérifier à la compilation qu'un type implémente une interface ?
    answer: '`var _ Interface = (*Type)(nil)`.'
  - key: verifier-statiquement-type-implemente-interface
    format: course
    question: Comment vérifier statiquement qu'un type implémente une interface ?
    answer: '`var _ I = (*T)(nil)`.'
  - key: syntaxe
    format: course
    question: Comment vérifier à la compilation que `*Depot` implémente `Stockage` ?
    answer: 'Avec `var _ Stockage = (*Depot)(nil)` dans le package de `Depot` : la compilation échoue si une méthode manque.'
  - key: cout
    format: course
    question: La ligne `var _ io.Writer = (*Journal)(nil)` coûte-t-elle quelque chose à l'exécution ?
    answer: 'Non : la variable blanche n''est pas conservée, c''est une pure vérification de types.'
  - key: vf-allocation
    format: true-false
    question: '`var _ Stockage = (*Depot)(nil)` alloue un Depot au démarrage.'
    truth: false
    answer: Le pointeur nil ne crée rien ; seule la vérification de types a lieu.
  - key: vf-erreur
    format: true-false
    question: Si `*Depot` perd une méthode de `Stockage`, cette ligne provoque une erreur de compilation.
    truth: true
    answer: Le message nomme la méthode manquante ou à la mauvaise signature.
  - key: vf-valeur
    format: true-false
    question: Pour un type à receveurs valeur, on peut écrire `var _ fmt.Stringer = Statut(0)`.
    truth: true
    answer: Une valeur suffit quand les méthodes sont sur le type valeur.
  - key: vf-obligatoire
    format: true-false
    question: Cette ligne est obligatoire pour qu'un type implémente une interface.
    truth: false
    answer: L'implémentation reste implicite ; la ligne ne fait que vérifier et documenter.
  - key: qcm-formes
    format: multiple-choice
    question: Quelles lignes vérifient qu'un type implémente une interface ?
    choices:
      - text: '`var _ http.Handler = (*Routeur)(nil)`'
        correct: true
      - text: '`var _ io.Reader = &Fichier{}`'
        correct: true
      - text: '`type Routeur implements http.Handler`'
        correct: false
      - text: '`assert(Routeur, http.Handler)`'
        correct: false
    answer: Les deux premières font la vérification ; la seconde alloue une valeur inutilement.
  - key: qcm-quand
    format: multiple-choice
    question: Quand cette vérification est-elle utile ?
    choices:
      - text: Un handler enregistré ailleurs, que le package n'utilise jamais comme http.Handler
        correct: true
      - text: L'implémentation d'un port du domaine dans le package d'infrastructure
        correct: true
      - text: Un type que le package affecte déjà à l'interface dans son code
        correct: false
      - text: Un type sans aucune méthode
        correct: false
    answer: Quand rien d'autre dans le package ne déclencherait la vérification.
  - key: qcm-nil
    format: multiple-choice
    question: Pourquoi écrire `(*Journal)(nil)` plutôt que `&Journal{}` ?
    choices:
      - text: Pour ne rien allouer, un pointeur nil typé suffisant à la vérification
        correct: true
      - text: Parce que `&Journal{}` ne compile pas
        correct: false
      - text: Pour que le journal soit nil à l'exécution
        correct: false
      - text: Pour désactiver la vérification
        correct: false
    answer: Les deux vérifient ; la forme nil évite toute construction.
  - key: qcm-message
    format: multiple-choice
    question: Que dit le compilateur si `*Journal` n'a plus de méthode `Write` ?
    choices:
      - text: « *Journal does not implement io.Writer (missing method Write) »
        correct: true
      - text: Rien, l'erreur n'apparaît qu'à l'exécution
        correct: false
      - text: « unused variable _ »
        correct: false
      - text: « invalid nil »
        correct: false
    answer: Le message nomme précisément la méthode.
  - key: trous-blanc
    format: fill-in
    question: |-
      Complétez la vérification :
      ```go
      var ___ http.Handler = (*Routeur)(nil)
      ```
    blanks:
      - - _
    answer: Une variable blanche, jamais conservée.
  - key: trous-nil
    format: fill-in
    question: |-
      Complétez le pointeur nil typé :
      ```go
      var _ io.Writer = (*Journal)(___)
      ```
    blanks:
      - - nil
    answer: Le pointeur nil suffit au compilateur.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez pour vérifier l'implémentation par le pointeur :
      ```go
      var _ Stockage = (___Depot)(nil)
      ```
    blanks:
      - - '*'
    answer: Si les méthodes ont des receveurs pointeurs, c'est `*Depot` qui implémente.
  - key: trous-valeur
    format: fill-in
    question: |-
      Complétez pour un type à receveur valeur :
      ```go
      var _ fmt.Stringer = Statut(___)
      ```
    blanks:
      - - '0'
    answer: Une valeur quelconque du type suffit.
  - key: bug-renommage
    format: bug-fix
    question: 'Après un renommage en `ServeHttp`, le serveur répond 404 sur la route : le type n''implémente plus `http.Handler`, mais rien ne l''a signalé à la compilation. Que faut-il ajouter ?'
    answer: |-
      ```go
      var _ http.Handler = (*Routeur)(nil)
      ```
      Avec cette ligne, le renommage aurait cassé la compilation du package, avec un message clair sur `ServeHTTP`.
  - key: bug-mauvais-receveur
    format: bug-fix
    question: |-
      Cette vérification échoue alors que la méthode existe :
      ```go
      func (d *Depot) Lire(id string) (Doc, error) { ... }

      var _ Stockage = Depot{}
      ```
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La méthode a un receveur pointeur : c'est `*Depot`, pas `Depot`, qui implémente l'interface.
  - key: bug-allocation
    format: bug-fix
    question: |-
      En revue, simplifiez cette vérification qui construit un objet complet :
      ```go
      var _ Stockage = NouveauDepot(sql.OpenDB(nil))
      ```
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La vérification n'a besoin que du type : la construction s'exécuterait au démarrage du programme, pour rien (et
      ici paniquerait).
  - key: bug-mauvais-package
    format: bug-fix
    question: La vérification `var _ domaine.Stockage = (*infra.Depot)(nil)` est placée dans le package `domaine`. Pourquoi est-ce une mauvaise idée ?
    answer: |-
      ```go
      // dans le package infra, à côté de Depot
      var _ domaine.Stockage = (*Depot)(nil)
      ```
      Placée dans `domaine`, elle obligerait le domaine à importer l'infrastructure, à l'inverse des dépendances voulues
      (et créerait un cycle si `infra` importe déjà `domaine`). La vérification se met dans le package de
      l'implémentation.
