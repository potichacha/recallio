notion: composition-vs-heritage
lesson: |-
  Go n'a **pas d'héritage** : pas de classes, pas de sous-typage par extension, pas de `super`. La réutilisation passe par
  la **composition** :

  - **des champs** : une struct contient d'autres structs, nommées ou embarquées ;
  - **des interfaces** pour le polymorphisme : tout type qui a les méthodes convient ;
  - **des fonctions** qui prennent des interfaces, partagées entre types.

  L'**embarquement** ressemble à l'héritage mais n'en est pas : une méthode promue s'exécute avec l'**embarqué comme
  receveur**. Si elle appelle une autre méthode, c'est celle de l'embarqué, **jamais** une « redéfinition » de la struct
  englobante (il n'y a pas de liaison dynamique de `this`).

  ```go
  type Base struct{}
  func (Base) Nom() string        { return "base" }
  func (b Base) Presenter() string { return "je suis " + b.Nom() }

  type Derivee struct{ Base }
  func (Derivee) Nom() string { return "dérivée" }

  Derivee{}.Presenter() // "je suis base" : pas de méthode virtuelle
  ```

  Et une `Derivee` n'est **pas** une `Base` : on ne peut pas la passer à une fonction qui attend une `Base` (seulement
  `d.Base`). Le polymorphisme passe par les interfaces.

  Pour un comportement personnalisable (le « template method » des langages à objets), on injecte une **interface ou une
  fonction** au lieu de compter sur une redéfinition.

  **Piège classique** : reproduire une hiérarchie de classes avec des embarquements en cascade, puis s'étonner que la
  méthode « redéfinie » ne soit pas appelée par la méthode de base.

  **En entretien** : « Pas d'héritage : composition de champs, interfaces pour le polymorphisme ; l'embarquement promeut
  mais ne crée ni sous-type ni méthode virtuelle. »
cards:
  - key: embedding-heritage
    format: course
    question: "L'embarquement d'une struct (embedding) est-il de l'héritage ? Pourquoi ?"
    choices:
      - {text: "Non : les méthodes sont promues, mais leur receveur reste le type embarqué, sans polymorphisme", correct: true}
      - {text: "Oui : le type qui embarque hérite des méthodes et peut les redéfinir comme des méthodes virtuelles", correct: false}
      - {text: "Oui, mais un héritage simple : Go interdit d'embarquer plus d'un type dans une même struct", correct: false}
      - {text: "Non : l'embarquement recopie le code des méthodes dans le nouveau type, au moment de la compilation", correct: false}
    answer: "Non : les méthodes sont promues, mais leur receveur reste le type embarqué, et une méthode de l'embarqué n'appelle jamais une « redéfinition » du type englobant. C'est de la composition avec un raccourci d'accès."
  - key: reutilises-comportement-plusieurs-types-sans
    format: scenario
    question: "Comment réutilises-tu du comportement entre plusieurs types, sans héritage ?"
    choices:
      - {text: "Composition qui délègue, embarquement si tout doit être exposé, fonctions sur une interface, décorateurs", correct: true}
      - {text: "Une struct de base embarquée sur plusieurs niveaux, qui joue le rôle d'une classe abstraite commune", correct: false}
      - {text: "Du code généré qui recopie les méthodes communes dans chacun des types qui en ont besoin", correct: false}
      - {text: "Une interface vide `any` partout, et des assertions de type au début de chaque méthode", correct: false}
    answer: "Composition explicite qui délègue, embarquement quand on veut vraiment exposer toutes les méthodes du composant, fonctions (souvent génériques) qui travaillent sur une interface, et décorateurs. Recréer une hiérarchie de « classes de base » par embarquements successifs est difficile à lire, et l'absence de polymorphisme surprend."
  - key: heritage
    format: course
    question: "Go a-t-il de l'héritage ? Par quoi le remplace-t-il ?"
    choices:
      - {text: "Non : par la composition (embarquement) et des interfaces implicites", correct: true}
      - {text: "Oui : une struct hérite d'une autre en l'embarquant, comme avec `extends`", correct: false}
      - {text: "Non : il le remplace par des classes abstraites et des traits", correct: false}
      - {text: "Oui, mais seulement entre interfaces, jamais entre structs", correct: false}
    answer: "Non : Go compose par embarquement et découple par des interfaces implicites. L'embarquement promeut les méthodes, mais ce n'est pas un `extends` : il n'y a ni sous-type ni méthode virtuelle."
  - key: pas-sous-type
    format: course
    question: Une struct `Derivee` qui embarque `Base` peut-elle être passée à une fonction qui attend une `Base` ?
    choices:
      - {text: "Non : on passe `d.Base`, ou la fonction accepte une interface commune", correct: true}
      - {text: "Oui : `Derivee` est un sous-type de `Base` grâce à l'embarquement", correct: false}
      - {text: "Oui, à condition de la convertir d'abord avec `Base(d)`", correct: false}
      - {text: "Oui, à condition de la passer par pointeur, avec `&d`", correct: false}
    answer: "Non : ce n'est pas un sous-type ; on passe `d.Base`, ou la fonction accepte une interface que les deux implémentent. La conversion `Base(d)` ne compile pas non plus : les deux types n'ont pas la même structure."
  - key: template
    format: course
    question: Comment rendre personnalisable une étape d'un algorithme partagé, sans héritage ?
    choices:
      - {text: "En injectant une interface ou une fonction pour cette étape", correct: true}
      - {text: "En redéfinissant la méthode de l'étape dans un type qui embarque l'algorithme", correct: false}
      - {text: "En déclarant la méthode de l'étape `abstract` dans le type de base", correct: false}
      - {text: "En passant le nom de l'étape en chaîne, appelée par réflexion", correct: false}
    answer: "En injectant une interface ou une fonction pour cette étape : l'algorithme l'appelle au lieu de compter sur une méthode redéfinie. Redéfinir la méthode dans un type qui embarque ne marche pas : le code embarqué appelle toujours sa propre version."
  - key: vf-heritage
    format: true-false
    question: Go propose l'héritage de classes.
    truth: false
    answer: Ni classes ni héritage ; des structs, la composition et les interfaces.
  - key: vf-virtuelle
    format: true-false
    question: Une méthode promue qui appelle une autre méthode utilise la version redéfinie par la struct englobante.
    truth: false
    answer: 'Elle utilise celle de l''embarqué : il n''y a pas de méthodes virtuelles.'
  - key: vf-polymorphisme
    format: true-false
    question: En Go, le polymorphisme passe par les interfaces.
    truth: true
    answer: Toute valeur qui a les méthodes de l'interface peut être utilisée.
  - key: vf-super
    format: true-false
    question: On accède à la méthode de l'embarqué masquée avec `super.M()`.
    truth: false
    answer: 'Avec le nom du champ embarqué : `d.Base.M()`.'
  - key: qcm-reutiliser
    format: multiple-choice
    question: "Laquelle de ces façons de réutiliser du comportement n'existe pas en Go ?"
    choices:
      - {text: "Faire hériter les types d'une classe abstraite commune", correct: true}
      - {text: "Écrire une fonction qui accepte une interface commune", correct: false}
      - {text: "Embarquer un type qui porte le comportement voulu", correct: false}
      - {text: "Envelopper un type dans un décorateur qui délègue", correct: false}
    answer: "Go n'a ni classe abstraite ni `extends` : la composition (embarquement, délégation, décorateurs) et les interfaces remplacent l'héritage."
  - key: qcm-resultat
    format: multiple-choice
    question: Avec `Base.Presenter` qui appelle `b.Nom()` et `Derivee` qui redéfinit `Nom`, que renvoie `Derivee{}.Presenter()` ?
    choices:
      - text: Le résultat de `Base.Nom`
        correct: true
      - text: Le résultat de `Derivee.Nom`
        correct: false
      - text: Une erreur de compilation
        correct: false
      - text: Une panique
        correct: false
    answer: Le receveur de la méthode promue est la `Base` embarquée.
  - key: qcm-alternatives
    format: multiple-choice
    question: "Lesquelles de ces alternatives à une méthode « à redéfinir » sont idiomatiques en Go ?"
    choices:
      - text: Un champ de type fonction fourni à la construction
        correct: true
      - text: Une interface injectée pour l'étape variable
        correct: true
      - text: Une méthode abstraite
        correct: false
      - text: Une annotation @Override
        correct: false
    answer: L'étape variable devient une dépendance explicite.
  - key: qcm-relation
    format: multiple-choice
    question: Que signifie l'embarquement d'un type `Base` dans `Derivee` ?
    choices:
      - {text: "Derivee « a une » Base, dont les champs et méthodes sont promus", correct: true}
      - {text: "Derivee « est une » Base, utilisable partout où Base est attendue", correct: false}
      - {text: "Derivee hérite des constructeurs de Base, et peut les redéfinir", correct: false}
      - {text: "Base peut appeler les méthodes que Derivee a redéfinies, comme en Java", correct: false}
    answer: C'est une composition, avec un raccourci d'accès.
  - key: bug-template
    format: bug-fix
    question: |-
      La méthode « redéfinie » n'est jamais appelée : `ExportCSV{}.Generer()` renvoie `"données"`, sans en-tête. Quelle correction est la bonne ?
      ```go
      type Export struct{}
      func (e Export) Entete() string { return "" }
      func (e Export) Generer() string { return e.Entete() + "données" }

      type ExportCSV struct{ Export }
      func (ExportCSV) Entete() string { return "id;nom\n" }

      ExportCSV{}.Generer() // "données", sans en-tête
      ```
    choices:
      - {text: "Faire de l'en-tête une interface `Format`, passée à une fonction `Generer(f Format)`", correct: true}
      - {text: "Embarquer un pointeur dans `ExportCSV`, `struct{ *Export }`, pour activer la redéfinition", correct: false}
      - {text: "Redéfinir aussi `Generer` dans `ExportCSV`, en y appelant `e.Export.Generer()`", correct: false}
      - {text: "Passer `Entete` de `Export` en receveur pointeur, `func (e *Export) Entete()`", correct: false}
    answer: |-
      ```go
      type Format interface{ Entete() string }

      func Generer(f Format) string { return f.Entete() + "données" }

      type CSV struct{}
      func (CSV) Entete() string { return "id;nom\n" }

      Generer(CSV{})
      ```
      L'embarquement n'a pas de méthodes virtuelles : on injecte l'étape variable par une interface.
  - key: bug-sous-type
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use admin (variable of type Admin) as Utilisateur value ». Quelle correction est la bonne ?
      ```go
      type Utilisateur struct{ Nom string }
      type Admin struct {
      	Utilisateur
      	Droits []string
      }

      func saluer(u Utilisateur) string { return "bonjour " + u.Nom }
      saluer(admin)
      ```
    choices:
      - {text: "Passer le champ embarqué, `saluer(admin.Utilisateur)`", correct: true}
      - {text: "Convertir d'abord, avec `saluer(Utilisateur(admin))`", correct: false}
      - {text: "Passer un pointeur, avec `saluer(&admin)`", correct: false}
      - {text: "Asserter le type, avec `saluer(admin.(Utilisateur))`", correct: false}
    answer: |-
      ```go
      saluer(admin.Utilisateur)

      // ou, pour accepter plusieurs types :
      type nomme interface{ NomAffiche() string }
      ```
      `Admin` n'est pas un `Utilisateur` : on passe le champ embarqué, ou la fonction accepte une interface.
  - key: bug-cascade
    format: bug-fix
    question: Une équipe a reproduit une hiérarchie Java en Go (`Vehicule` embarqué dans `Voiture`, embarquée dans `VoitureElectrique`), et les comportements surprennent. Que proposes-tu ?
    choices:
      - {text: "Repartir des comportements qui varient : petites interfaces, structs composées, fonctions sur l'interface", correct: true}
      - {text: "Ajouter un champ `type` à `Vehicule` et un `switch` dans chaque méthode, pour imiter les méthodes virtuelles", correct: false}
      - {text: "Remplacer chaque embarquement par un pointeur embarqué, pour que les redéfinitions soient prises en compte", correct: false}
      - {text: "Garder la hiérarchie, mais la documenter, pour que chacun sache quelles méthodes sont promues et d'où", correct: false}
    answer: |-
      Repartir des besoins : quels comportements varient ? Je les exprime par de petites interfaces (`Rechargeable`,
      `Roulant`) et je compose les structs avec les données dont elles ont besoin. Les fonctions qui traitent « tout
      véhicule » acceptent l'interface utile. Les cascades d'embarquement disparaissent, et plus personne n'attend de
      méthode virtuelle qui n'existe pas.
  - key: bug-super
    format: bug-fix
    question: |-
      Ce code ne compile pas ; `Chien` embarque `Animal`. Quelle correction est la bonne ?
      ```go
      func (c Chien) Decrire() string {
      	return super.Decrire() + " qui aboie"
      }
      ```
    choices:
      - {text: "`c.Animal.Decrire()`, l'appel par le nom du champ embarqué", correct: true}
      - {text: "`c.Decrire()`, l'appel de la méthode promue de l'embarqué", correct: false}
      - {text: "`Animal.Decrire()`, l'appel par le seul nom du type embarqué", correct: false}
      - {text: "`this.Animal.Decrire()`, l'appel par le receveur implicite", correct: false}
    answer: |-
      ```go
      func (c Chien) Decrire() string {
      	return c.Animal.Decrire() + " qui aboie"
      }
      ```
      Go n'a pas de `super` : on appelle la méthode de l'embarqué par le nom du champ. `c.Decrire()` rappellerait la méthode de `Chien` elle-même, sans fin.
  - key: scenario-hierarchie
    format: scenario
    question: Tu dois modéliser des formes géométriques qui partagent un calcul de périmètre affiché. Comment fais-tu sans héritage ?
    choices:
      - {text: "Une interface `Forme` (aire, périmètre) que chaque forme implémente, et une fonction `Resume(f Forme)`", correct: true}
      - {text: "Une struct `FormeBase` embarquée, dont la méthode `Resume` appelle un `Aire` redéfini par chaque forme", correct: false}
      - {text: "Une seule struct `Forme` avec un champ `Type`, et un `switch` dans chaque méthode de calcul", correct: false}
      - {text: "Une interface `Forme` vide, et des assertions de type dans la fonction qui calcule le périmètre", correct: false}
    answer: |-
      Une interface `Forme { Aire() float64; Perimetre() float64 }` que chaque forme (Carre, Cercle) implémente. Le code
      partagé est une fonction : `func Resume(f Forme) string { return fmt.Sprintf("aire %.2f, périmètre %.2f",
      f.Aire(), f.Perimetre()) }`. Si des formes partagent des données (une position, une couleur), je les mets dans une
      petite struct `Style` embarquée. Pas de classe de base abstraite.
  - key: scenario-java
    format: scenario
    question: Un développeur Java te demande où sont les classes abstraites en Go. Que lui réponds-tu ?
    choices:
      - {text: "Il n'y en a pas : contrat en interface, code commun en fonction ou struct embarquée, étapes injectées", correct: true}
      - {text: "Une struct embarquée en tient lieu : ses méthodes peuvent être redéfinies, puis appelées par la base", correct: false}
      - {text: "Une interface avec des méthodes par défaut, comme depuis Java 8, joue exactement ce rôle en Go", correct: false}
      - {text: "Une struct dont les méthodes paniquent tant que le type dérivé ne les a pas toutes redéfinies", correct: false}
    answer: |-
      Qu'il n'y en a pas, et qu'on n'en a pas besoin : la partie « contrat » devient une interface, implémentée
      implicitement ; la partie « code commun » devient soit une fonction qui accepte cette interface, soit une struct
      embarquée qui porte des données et des méthodes utilitaires ; et les étapes à redéfinir deviennent des
      dépendances injectées (interface ou fonction). On obtient un couplage plus faible qu'avec une hiérarchie.
  - key: scenario-reutiliser
    format: scenario
    question: Plusieurs types de ton domaine ont besoin d'un horodatage de création et de modification. Comment partages-tu ce comportement ?
    choices:
      - {text: "Une petite struct `Horodatage` avec une méthode `Toucher`, embarquée dans chaque type", correct: true}
      - {text: "Un type de base `Entite`, dont tous les types du domaine héritent avec `extends`", correct: false}
      - {text: "Les champs `CreeLe` et `ModifieLe` recopiés, et la logique dupliquée dans chaque type", correct: false}
      - {text: "Une map globale de l'identifiant vers ses dates, mise à jour à part par chaque service", correct: false}
    answer: |-
      Une petite struct `Horodatage { CreeLe, ModifieLe time.Time }` avec une méthode `Toucher(t time.Time)`, embarquée
      dans chaque type. Les champs et la méthode sont promus, les types restent indépendants, et une fonction qui doit
      mettre à jour « n'importe quel horodaté » accepte une interface `interface{ Toucher(time.Time) }`. C'est de la
      composition, sans relation « est un ».
