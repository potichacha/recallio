notion: composition-vs-heritage
lesson: |-
  Go n'a **pas d'héritage** : pas de classes, pas de sous-typage par extension, pas de `super`. La réutilisation passe par
  la **composition** :

  - **des champs** : une struct contient d'autres structs, nommées ou embarquées ;
  - **des interfaces** pour le polymorphisme : tout type qui a les méthodes convient ;
  - **des fonctions** qui prennent des interfaces, partagées entre types.

  L'**embarquement** ressemble à l'héritage mais n'en est pas : une méthode promue s'exécute avec l'**embarqué comme
  receveur**. Si elle appelle une autre méthode, c'est celle de l'embarqué, **jamais** une « redéfinition » de la struct
  englobante (il n'y a pas de liaison dynamique de `this`).

  ```go
  type Base struct{}
  func (Base) Nom() string        { return "base" }
  func (b Base) Presenter() string { return "je suis " + b.Nom() }

  type Derivee struct{ Base }
  func (Derivee) Nom() string { return "dérivée" }

  Derivee{}.Presenter() // "je suis base" : pas de méthode virtuelle
  ```

  Et une `Derivee` n'est **pas** une `Base` : on ne peut pas la passer à une fonction qui attend une `Base` (seulement
  `d.Base`). Le polymorphisme passe par les interfaces.

  Pour un comportement personnalisable (le « template method » des langages à objets), on injecte une **interface ou une
  fonction** au lieu de compter sur une redéfinition.

  **Piège classique** : reproduire une hiérarchie de classes avec des embarquements en cascade, puis s'étonner que la
  méthode « redéfinie » ne soit pas appelée par la méthode de base.

  **En entretien** : « Pas d'héritage : composition de champs, interfaces pour le polymorphisme ; l'embarquement promeut
  mais ne crée ni sous-type ni méthode virtuelle. »
cards:
  - key: embedding-heritage
    format: course
    question: L'embedding est-il de l'héritage ?
    answer: 'Non : les méthodes sont promues mais il n''y a pas de polymorphisme, le receveur reste le type embarqué.'
  - key: reutilises-comportement-plusieurs-types-sans
    format: scenario
    question: Comment tu réutilises du comportement entre plusieurs types sans héritage ?
    answer: |-
      Plusieurs outils selon le besoin. La **composition explicite** : le type contient un champ du type réutilisé et délègue. L'**embedding** quand je veux réellement exposer toutes les méthodes du composant. Des **fonctions** libres, souvent génériques, qui travaillent sur une interface ou une contrainte plutôt que des méthodes dupliquées. Et le **pattern décorateur** : une struct qui implémente la même interface en enveloppant une autre implémentation (un `Notifier` qui ajoute des retries autour d'un autre `Notifier`).
      Ce que je m'interdis, c'est de recréer une hiérarchie de 'classes de base' avec de l'embedding sur plusieurs niveaux : c'est difficile à lire et l'absence de polymorphisme surprend.
  - key: heritage
    format: course
    question: Go a-t-il de l'héritage ?
    answer: Non, de la composition par embedding et des interfaces implicites.
  - key: pas-sous-type
    format: course
    question: Une struct `Derivee` qui embarque `Base` peut-elle être passée à une fonction qui attend une `Base` ?
    answer: 'Non : ce n''est pas un sous-type ; on passe `d.Base`, ou la fonction accepte une interface que les deux implémentent.'
  - key: template
    format: course
    question: Comment rendre personnalisable une étape d'un algorithme partagé, sans héritage ?
    answer: 'En injectant une interface ou une fonction pour cette étape : l''algorithme l''appelle au lieu de compter sur une méthode redéfinie.'
  - key: vf-heritage
    format: true-false
    question: Go propose l'héritage de classes.
    truth: false
    answer: Ni classes ni héritage ; des structs, la composition et les interfaces.
  - key: vf-virtuelle
    format: true-false
    question: Une méthode promue qui appelle une autre méthode utilise la version redéfinie par la struct englobante.
    truth: false
    answer: 'Elle utilise celle de l''embarqué : il n''y a pas de méthodes virtuelles.'
  - key: vf-polymorphisme
    format: true-false
    question: En Go, le polymorphisme passe par les interfaces.
    truth: true
    answer: Toute valeur qui a les méthodes de l'interface peut être utilisée.
  - key: vf-super
    format: true-false
    question: On accède à la méthode de l'embarqué masquée avec `super.M()`.
    truth: false
    answer: 'Avec le nom du champ embarqué : `d.Base.M()`.'
  - key: qcm-reutiliser
    format: multiple-choice
    question: Comment réutiliser du comportement entre plusieurs types en Go ?
    choices:
      - text: Une fonction qui accepte une interface commune
        correct: true
      - text: Embarquer un type qui porte le comportement
        correct: true
      - text: Faire hériter les types d'une classe abstraite
        correct: false
      - text: Utiliser le mot-clé extends
        correct: false
    answer: Composition et interfaces remplacent l'héritage.
  - key: qcm-resultat
    format: multiple-choice
    question: Avec `Base.Presenter` qui appelle `b.Nom()` et `Derivee` qui redéfinit `Nom`, que renvoie `Derivee{}.Presenter()` ?
    choices:
      - text: Le résultat de `Base.Nom`
        correct: true
      - text: Le résultat de `Derivee.Nom`
        correct: false
      - text: Une erreur de compilation
        correct: false
      - text: Une panique
        correct: false
    answer: Le receveur de la méthode promue est la `Base` embarquée.
  - key: qcm-alternatives
    format: multiple-choice
    question: Quelles alternatives à une méthode « à redéfinir » sont idiomatiques ?
    choices:
      - text: Un champ de type fonction fourni à la construction
        correct: true
      - text: Une interface injectée pour l'étape variable
        correct: true
      - text: Une méthode abstraite
        correct: false
      - text: Une annotation @Override
        correct: false
    answer: L'étape variable devient une dépendance explicite.
  - key: qcm-relation
    format: multiple-choice
    question: Que signifie l'embarquement d'un type `Base` dans `Derivee` ?
    choices:
      - text: Derivee « a une » Base, dont les champs et méthodes sont promus
        correct: true
      - text: Derivee « est une » Base
        correct: false
      - text: Derivee hérite des constructeurs de Base
        correct: false
      - text: Base peut appeler les méthodes de Derivee
        correct: false
    answer: C'est une composition, avec un raccourci d'accès.
  - key: bug-template
    format: bug-fix
    question: |-
      La méthode « redéfinie » n'est jamais appelée :
      ```go
      type Export struct{}
      func (e Export) Entete() string { return "" }
      func (e Export) Generer() string { return e.Entete() + "données" }

      type ExportCSV struct{ Export }
      func (ExportCSV) Entete() string { return "id;nom\n" }

      ExportCSV{}.Generer() // "données", sans en-tête
      ```
    answer: |-
      ```go
      type Format interface{ Entete() string }

      func Generer(f Format) string { return f.Entete() + "données" }

      type CSV struct{}
      func (CSV) Entete() string { return "id;nom\n" }

      Generer(CSV{})
      ```
      L'embarquement n'a pas de méthodes virtuelles : on injecte l'étape variable par une interface.
  - key: bug-sous-type
    format: bug-fix
    question: "Le compilateur signale « cannot use admin (variable of type Admin) as Utilisateur value » :\n```go\ntype Utilisateur struct{ Nom string }\ntype Admin struct {\n\tUtilisateur\n\tDroits []string\n}\n\nfunc saluer(u Utilisateur) string { return \"bonjour \" + u.Nom }\nsaluer(admin)\n```"
    answer: |-
      ```go
      saluer(admin.Utilisateur)

      // ou, pour accepter plusieurs types :
      type nomme interface{ NomAffiche() string }
      ```
      `Admin` n'est pas un `Utilisateur` : on passe le champ embarqué, ou la fonction accepte une interface.
  - key: bug-cascade
    format: bug-fix
    question: Une équipe a reproduit une hiérarchie Java en Go (`Vehicule` embarqué dans `Voiture`, embarquée dans `VoitureElectrique`), et les comportements surprennent. Que proposes-tu ?
    answer: |-
      Repartir des besoins : quels comportements varient ? Je les exprime par de petites interfaces (`Rechargeable`,
      `Roulant`) et je compose les structs avec les données dont elles ont besoin. Les fonctions qui traitent « tout
      véhicule » acceptent l'interface utile. Les cascades d'embarquement disparaissent, et plus personne n'attend de
      méthode virtuelle qui n'existe pas.
  - key: bug-super
    format: bug-fix
    question: "Ce code ne compile pas :\n```go\nfunc (c Chien) Decrire() string {\n\treturn super.Decrire() + \" qui aboie\"\n}\n```"
    answer: "```go\nfunc (c Chien) Decrire() string {\n\treturn c.Animal.Decrire() + \" qui aboie\"\n}\n```\nGo n'a pas de `super` : on appelle la méthode de l'embarqué par le nom du champ."
  - key: scenario-hierarchie
    format: scenario
    question: Tu dois modéliser des formes géométriques qui partagent un calcul de périmètre affiché. Comment fais-tu sans héritage ?
    answer: |-
      Une interface `Forme { Aire() float64; Perimetre() float64 }` que chaque forme (Carre, Cercle) implémente. Le code
      partagé est une fonction : `func Resume(f Forme) string { return fmt.Sprintf("aire %.2f, périmètre %.2f",
      f.Aire(), f.Perimetre()) }`. Si des formes partagent des données (une position, une couleur), je les mets dans une
      petite struct `Style` embarquée. Pas de classe de base abstraite.
  - key: scenario-java
    format: scenario
    question: Un développeur Java te demande où sont les classes abstraites en Go. Que lui réponds-tu ?
    answer: |-
      Qu'il n'y en a pas, et qu'on n'en a pas besoin : la partie « contrat » devient une interface, implémentée
      implicitement ; la partie « code commun » devient soit une fonction qui accepte cette interface, soit une struct
      embarquée qui porte des données et des méthodes utilitaires ; et les étapes à redéfinir deviennent des
      dépendances injectées (interface ou fonction). On obtient un couplage plus faible qu'avec une hiérarchie.
  - key: scenario-reutiliser
    format: scenario
    question: Plusieurs types de ton domaine ont besoin d'un horodatage de création et de modification. Comment partages-tu ce comportement ?
    answer: |-
      Une petite struct `Horodatage { CreeLe, ModifieLe time.Time }` avec une méthode `Toucher(t time.Time)`, embarquée
      dans chaque type. Les champs et la méthode sont promus, les types restent indépendants, et une fonction qui doit
      mettre à jour « n'importe quel horodaté » accepte une interface `interface{ Toucher(time.Time) }`. C'est de la
      composition, sans relation « est un ».
