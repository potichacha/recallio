notion: ensemble-methodes
lesson: |-
  L'**ensemble de méthodes** (method set) d'un type est la liste des méthodes qu'on peut appeler **à travers une
  interface**. Il décide quels types implémentent quelles interfaces :

  | Type | Ensemble de méthodes |
  |---|---|
  | `T` (valeur) | les méthodes à receveur **`T`** |
  | `*T` (pointeur) | les méthodes à receveur **`T` et `*T`** |

  ```go
  type Compteur struct{ n int }
  func (c Compteur) Valeur() int { return c.n }
  func (c *Compteur) Incrementer()  { c.n++ }

  type Incrementeur interface{ Incrementer() }

  var _ Incrementeur = &Compteur{} // OK : *Compteur a Incrementer
  var _ Incrementeur = Compteur{}  // erreur : Compteur (valeur) n'a pas Incrementer
  ```

  Pourquoi cette asymétrie ? Une interface peut contenir une **copie** de la valeur, qui n'est **pas adressable** : Go
  ne pourrait pas lui appliquer une méthode qui modifie l'original. Avec un pointeur, il a toujours l'adresse.

  Pour un **appel direct** sur une variable, la règle est plus souple (Go prend l'adresse tout seul) : c'est
  uniquement à travers une interface, ou sur une valeur non adressable, que la différence apparaît.

  **Piège classique** : « `Compteur` does not implement `Incrementeur` (method Incrementer has pointer receiver) ». On
  passe `&c` au lieu de `c`.

  **En entretien** : « T a ses méthodes à receveur valeur, *T a toutes les méthodes ; une valeur dans une interface
  n'est pas adressable, d'où le message method has pointer receiver ; on passe le pointeur. »
cards:
  - key: method-set
    format: course
    question: Quel est le method set de T et de *T ?
    answer: 'T : méthodes à receveur valeur ; *T : méthodes à receveur valeur et pointeur.'
  - key: valeur-satisfait-interface-dont-methode-receveur
    format: course
    question: Pourquoi une valeur T ne satisfait-elle pas une interface dont une méthode a un receveur *T ?
    answer: Une valeur dans une interface n'est pas adressable, Go ne peut pas prendre son adresse.
  - key: deposer-5-fonctionne-valeur
    format: course
    question: Pourquoi `c.Deposer(5)` fonctionne-t-il sur une valeur ?
    answer: Go prend automatiquement l'adresse d'une variable adressable.
  - key: appeler-methode-receveur-pointeur-element-map
    format: course
    question: Peut-on appeler une méthode à receveur pointeur sur un élément de map ?
    answer: Non, un élément de map n'est pas adressable.
  - key: terme-method-set
    format: course
    question: Que désigne « method set » ?
    answer: Ensemble des méthodes d'un type, détermine l'implémentation des interfaces
  - key: pourquoi
    format: course
    question: Pourquoi une valeur `T` n'a-t-elle pas les méthodes à receveur `*T` dans son ensemble de méthodes ?
    answer: 'Une interface peut contenir une copie non adressable de la valeur : Go ne pourrait pas en prendre l''adresse pour appeler une méthode qui doit modifier l''original.'
  - key: vf-pointeur-tout
    format: true-false
    question: L'ensemble de méthodes de `*T` contient les méthodes à receveur `T` et `*T`.
    truth: true
    answer: Un pointeur peut toujours se déréférencer pour appeler une méthode valeur.
  - key: vf-valeur-tout
    format: true-false
    question: L'ensemble de méthodes de `T` contient aussi les méthodes à receveur `*T`.
    truth: false
    answer: Seulement les méthodes à receveur valeur.
  - key: vf-appel-direct
    format: true-false
    question: Sur une variable `c` de type `T`, on peut appeler directement une méthode à receveur `*T`.
    truth: true
    answer: Go prend l'adresse de la variable ; c'est à travers une interface que la règle de l'ensemble s'applique.
  - key: vf-embedding
    format: true-false
    question: Une struct qui embarque `*Base` obtient aussi les méthodes à receveur `*Base` dans l'ensemble de méthodes de sa valeur.
    truth: true
    answer: Avec un champ pointeur embarqué, toutes les méthodes de Base sont promues, même pour la valeur de la struct.
  - key: qcm-implemente
    format: multiple-choice
    question: Avec `func (f *Fichier) Write(p []byte) (int, error)`, qu'est-ce qui implémente `io.Writer` ?
    choices:
      - text: '`*Fichier`'
        correct: true
      - text: '`&Fichier{}`'
        correct: true
      - text: '`Fichier{}`'
        correct: false
      - text: '`Fichier` et `*Fichier` tous les deux'
        correct: false
    answer: Seul le pointeur a la méthode `Write` dans son ensemble.
  - key: qcm-valeur
    format: multiple-choice
    question: Avec `func (p Point) String() string`, qu'est-ce qui implémente `fmt.Stringer` ?
    choices:
      - text: '`Point`'
        correct: true
      - text: '`*Point`'
        correct: true
      - text: Seulement `Point`
        correct: false
      - text: Ni l'un ni l'autre
        correct: false
    answer: Une méthode valeur appartient aux deux ensembles.
  - key: qcm-message
    format: multiple-choice
    question: Que signifie « X does not implement Y (method M has pointer receiver) » ?
    choices:
      - text: On a passé une valeur alors que M est déclarée sur le pointeur
        correct: true
      - text: Il faut passer `&x` (ou déclarer M sur la valeur si elle ne modifie rien)
        correct: true
      - text: La méthode M n'existe pas
        correct: false
      - text: L'interface Y est mal déclarée
        correct: false
    answer: Le correctif habituel est de passer un pointeur.
  - key: qcm-map
    format: multiple-choice
    question: Pourquoi ne peut-on pas appeler une méthode `*T` sur `m[k]` avec `m map[string]T` ?
    choices:
      - text: L'élément de map n'est pas adressable
        correct: true
      - text: La map peut déplacer ses éléments
        correct: true
      - text: Les maps interdisent les méthodes
        correct: false
      - text: Il faut un verrou
        correct: false
    answer: 'C''est la même raison que pour les interfaces : pas d''adresse disponible.'
  - key: code-interface-pointeur
    format: code-output
    question: |-
      ```go
      type Compteur struct{ n int }

      func (c *Compteur) Incrementer() { c.n++ }

      type Incrementeur interface{ Incrementer() }

      var i Incrementeur = &Compteur{}
      i.Incrementer()
      i.Incrementer()
      fmt.Println(i.(*Compteur).n)
      ```
    answer: '`2` : le pointeur implémente l''interface et les appels modifient le même compteur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ n int }\n\n\nfunc (c *Compteur) Incrementer() { c.n++ }\n\n\ntype Incrementeur interface{ Incrementer() }\n\nfunc main() {\n\tvar i Incrementeur = &Compteur{}\n\ti.Incrementer()\n\ti.Incrementer()\n\tfmt.Println(i.(*Compteur).n)\n}\n"
      output: '2'
  - key: code-interface-valeur
    format: code-output
    question: |-
      ```go
      type Compteur struct{ n int }

      func (c *Compteur) Incrementer() { c.n++ }

      type Incrementeur interface{ Incrementer() }

      var i Incrementeur = Compteur{}
      i.Incrementer()
      ```
    answer: 'Rien : le code ne compile pas, « Compteur does not implement Incrementeur (method Incrementer has pointer receiver) ».'
    check:
      code: "package main\n\ntype Compteur struct{ n int }\n\n\nfunc (c *Compteur) Incrementer() { c.n++ }\n\n\ntype Incrementeur interface{ Incrementer() }\n\nfunc main() {\n\tvar i Incrementeur = Compteur{}\n\ti.Incrementer()\n}\n"
      compiles: false
  - key: code-stringer
    format: code-output
    question: |-
      ```go
      type Point struct{ X, Y int }

      func (p Point) String() string { return fmt.Sprintf("(%d, %d)", p.X, p.Y) }

      p := Point{1, 2}
      fmt.Println(p, &p)
      ```
    answer: '`(1, 2) (1, 2)` : la méthode valeur sert au pointeur comme à la valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\n\nfunc (p Point) String() string { return fmt.Sprintf(\"(%d, %d)\", p.X, p.Y) }\n\nfunc main() {\n\tp := Point{1, 2}\n\tfmt.Println(p, &p)\n}\n"
      output: (1, 2) (1, 2)
  - key: code-stringer-pointeur
    format: code-output
    question: |-
      ```go
      type Point struct{ X, Y int }

      func (p *Point) String() string { return fmt.Sprintf("(%d, %d)", p.X, p.Y) }

      p := Point{1, 2}
      fmt.Println(p, &p)
      ```
    answer: '`{1 2} (1, 2)` : avec un receveur pointeur, seule `&p` implémente `fmt.Stringer`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\n\nfunc (p *Point) String() string { return fmt.Sprintf(\"(%d, %d)\", p.X, p.Y) }\n\nfunc main() {\n\tp := Point{1, 2}\n\tfmt.Println(p, &p)\n}\n"
      output: '{1 2} (1, 2)'
  - key: bug-implemente
    format: bug-fix
    question: |-
      Le compilateur signale « Journal does not implement io.Writer (method Write has pointer receiver) » :
      ```go
      var j Journal
      fmt.Fprintln(j, "démarrage")
      ```
    answer: |-
      ```go
      var j Journal
      fmt.Fprintln(&j, "démarrage")
      ```
      `Write` est déclarée sur `*Journal` : on passe un pointeur, ce qui permet aussi aux écritures d'accumuler dans le
      même journal.
  - key: bug-stringer
    format: bug-fix
    question: |-
      `fmt.Println(commande)` affiche les champs bruts au lieu du résumé prévu :
      ```go
      func (c *Commande) String() string { return "commande " + c.ID }

      fmt.Println(commande) // commande est une valeur Commande
      ```
    answer: |-
      ```go
      func (c Commande) String() string { return "commande " + c.ID }
      ```
      Avec un receveur pointeur, la valeur n'implémentait pas `fmt.Stringer`. Une méthode qui ne modifie rien peut avoir
      un receveur valeur (ou l'on affiche `&commande`).
  - key: bug-slice-interfaces
    format: bug-fix
    question: "Le compilateur signale que `Tache` n'implémente pas `Executable` :\n```go\nfunc (t *Tache) Executer() error { ... }\n\nvar travaux []Executable\nfor _, t := range taches { // taches []Tache\n\ttravaux = append(travaux, t)\n}\n```"
    answer: "```go\nfor i := range taches {\n\ttravaux = append(travaux, &taches[i])\n}\n```\nIl faut des pointeurs ; et `&t` sur la variable de range désignerait une copie, d'où `&taches[i]`."
  - key: bug-verification
    format: bug-fix
    question: Comment être averti à la compilation, dans le package du type, que `*Depot` implémente bien `Stockage` ?
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La ligne échoue à la compilation si l'ensemble de méthodes de `*Depot` ne couvre plus l'interface, avant même
      qu'un appelant ne l'utilise.
