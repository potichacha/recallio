notion: ensemble-methodes
lesson: |-
  L'**ensemble de méthodes** (method set) d'un type est la liste des méthodes qu'on peut appeler **à travers une
  interface**. Il décide quels types implémentent quelles interfaces :

  | Type | Ensemble de méthodes |
  |---|---|
  | `T` (valeur) | les méthodes à receveur **`T`** |
  | `*T` (pointeur) | les méthodes à receveur **`T` et `*T`** |

  ```go
  type Compteur struct{ n int }
  func (c Compteur) Valeur() int { return c.n }
  func (c *Compteur) Incrementer()  { c.n++ }

  type Incrementeur interface{ Incrementer() }

  var _ Incrementeur = &Compteur{} // OK : *Compteur a Incrementer
  var _ Incrementeur = Compteur{}  // erreur : Compteur (valeur) n'a pas Incrementer
  ```

  Pourquoi cette asymétrie ? Une interface peut contenir une **copie** de la valeur, qui n'est **pas adressable** : Go
  ne pourrait pas lui appliquer une méthode qui modifie l'original. Avec un pointeur, il a toujours l'adresse.

  Pour un **appel direct** sur une variable, la règle est plus souple (Go prend l'adresse tout seul) : c'est
  uniquement à travers une interface, ou sur une valeur non adressable, que la différence apparaît.

  **Piège classique** : « `Compteur` does not implement `Incrementeur` (method Incrementer has pointer receiver) ». On
  passe `&c` au lieu de `c`.

  **En entretien** : « T a ses méthodes à receveur valeur, *T a toutes les méthodes ; une valeur dans une interface
  n'est pas adressable, d'où le message method has pointer receiver ; on passe le pointeur. »
cards:
  - key: method-set
    format: course
    question: "Que contient l'ensemble de méthodes (method set) de `T`, et celui de `*T` ?"
    choices:
      - {text: "`T` : les méthodes à receveur valeur ; `*T` : celles à receveur valeur et pointeur", correct: true}
      - {text: "`T` et `*T` : toutes les méthodes du type, quel que soit leur receveur", correct: false}
      - {text: "`T` : celles à receveur valeur et pointeur ; `*T` : celles à receveur pointeur", correct: false}
      - {text: "`T` : celles à receveur valeur ; `*T` : seulement celles à receveur pointeur", correct: false}
    answer: "`T` : les méthodes à receveur valeur ; `*T` : les méthodes à receveur valeur et pointeur. C'est ce qui décide des interfaces que chacun implémente."
  - key: valeur-satisfait-interface-dont-methode-receveur
    format: course
    question: Pourquoi une valeur T ne satisfait-elle pas une interface dont une méthode a un receveur *T ?
    choices:
      - {text: "Une valeur rangée dans une interface n'est pas adressable : Go ne peut pas en prendre l'adresse", correct: true}
      - {text: "Le compilateur ne sait jamais passer d'une valeur à un pointeur, même pour une variable", correct: false}
      - {text: "Une méthode à receveur pointeur n'est visible que dans le package qui la déclare", correct: false}
      - {text: "Une interface ne peut contenir que des pointeurs, jamais de valeurs de type struct", correct: false}
    answer: "Une valeur dans une interface n'est pas adressable, Go ne peut pas prendre son adresse. Sur une variable, en revanche, `v.M()` marche : Go écrit `(&v).M()` à ta place."
  - key: deposer-5-fonctionne-valeur
    format: course
    question: "`Deposer` a un receveur `*Compte`, et `c` est une variable de type `Compte`. Pourquoi `c.Deposer(5)` compile-t-il ?"
    choices:
      - {text: "Go prend automatiquement l'adresse de la variable : `(&c).Deposer(5)`", correct: true}
      - {text: "Go copie `c` dans un pointeur temporaire, que la méthode est seule à modifier", correct: false}
      - {text: "Toute méthode d'un type est appelable sur sa valeur comme sur son pointeur", correct: false}
      - {text: "Le compilateur transforme le receveur pointeur en receveur valeur", correct: false}
    answer: "`c` est une variable, donc adressable : Go réécrit l'appel en `(&c).Deposer(5)`, et c'est bien `c` qui est modifié. Ce raccourci ne vaut pas pour une valeur non adressable, comme un élément de map."
  - key: appeler-methode-receveur-pointeur-element-map
    format: course
    question: "Peut-on appeler une méthode à receveur pointeur sur un élément de map, comme `m[k].Incrementer()` ? Pourquoi ?"
    choices:
      - {text: "Non : un élément de map n'est pas adressable", correct: true}
      - {text: "Oui : Go prend l'adresse de l'élément, comme pour une variable", correct: false}
      - {text: "Oui, mais la modification est perdue à la sortie de la méthode", correct: false}
      - {text: "Non : une map ne peut pas contenir de types qui ont des méthodes", correct: false}
    answer: "Non : un élément de map n'est pas adressable (la map peut déplacer ses éléments), et le compilateur refuse l'appel. On stocke des pointeurs, `map[string]*T`, ou l'on relit, modifie et réécrit l'élément."
  - key: terme-method-set
    format: course
    question: "Que désigne l'ensemble de méthodes (« method set ») d'un type ?"
    choices:
      - {text: "Les méthodes appelables sur ce type, qui décident des interfaces qu'il implémente", correct: true}
      - {text: "Les seules méthodes exportées du type, visibles depuis les autres packages", correct: false}
      - {text: "Les méthodes déclarées dans le même fichier source que le type", correct: false}
      - {text: "Les interfaces que le type déclare implémenter avec `implements`", correct: false}
    answer: "L'ensemble des méthodes d'un type : il détermine les interfaces que le type implémente. Celui de `T` ne contient que les méthodes à receveur valeur ; celui de `*T`, toutes."
  - key: pourquoi
    format: course
    question: Pourquoi une valeur `T` n'a-t-elle pas les méthodes à receveur `*T` dans son ensemble de méthodes ?
    choices:
      - {text: "Une interface peut en contenir une copie non adressable, dont Go ne peut pas prendre l'adresse", correct: true}
      - {text: "Une méthode à receveur pointeur pourrait être appelée sur `nil`, ce que `T` interdit", correct: false}
      - {text: "Les méthodes à receveur pointeur sont réservées au package qui déclare le type `T`", correct: false}
      - {text: "Le compilateur ne garde dans un ensemble de méthodes que celles sans effet de bord", correct: false}
    answer: 'Une interface peut contenir une copie non adressable de la valeur : Go ne pourrait pas en prendre l''adresse pour appeler une méthode qui doit modifier l''original.'
  - key: vf-pointeur-tout
    format: true-false
    question: L'ensemble de méthodes de `*T` contient les méthodes à receveur `T` et `*T`.
    truth: true
    answer: Un pointeur peut toujours se déréférencer pour appeler une méthode valeur.
  - key: vf-valeur-tout
    format: true-false
    question: L'ensemble de méthodes de `T` contient aussi les méthodes à receveur `*T`.
    truth: false
    answer: Seulement les méthodes à receveur valeur.
  - key: vf-appel-direct
    format: true-false
    question: Sur une variable `c` de type `T`, on peut appeler directement une méthode à receveur `*T`.
    truth: true
    answer: Go prend l'adresse de la variable ; c'est à travers une interface que la règle de l'ensemble s'applique.
  - key: vf-embedding
    format: true-false
    question: Une struct qui embarque `*Base` obtient aussi les méthodes à receveur `*Base` dans l'ensemble de méthodes de sa valeur.
    truth: true
    answer: Avec un champ pointeur embarqué, toutes les méthodes de Base sont promues, même pour la valeur de la struct.
  - key: qcm-implemente
    format: multiple-choice
    question: "Avec `func (f *Fichier) Write(p []byte) (int, error)`, laquelle de ces déclarations compile ?"
    choices:
      - {text: "`var w io.Writer = &Fichier{}`", correct: true}
      - {text: "`var w io.Writer = Fichier{}`", correct: false}
      - {text: "`var w io.Writer = *&Fichier{}`", correct: false}
      - {text: "`var w io.Writer = Fichier(nil)`", correct: false}
    answer: "Seul le pointeur a `Write` dans son ensemble de méthodes : `&Fichier{}` implémente `io.Writer`, pas une valeur `Fichier`, même obtenue par `*&Fichier{}`."
  - key: qcm-valeur
    format: multiple-choice
    question: "Avec `func (p Point) String() string`, qu'est-ce qui implémente `fmt.Stringer` ?"
    choices:
      - {text: "`Point` et `*Point`, tous les deux", correct: true}
      - {text: "Seulement `Point`", correct: false}
      - {text: "Seulement `*Point`", correct: false}
      - {text: "Ni l'un ni l'autre", correct: false}
    answer: "Une méthode à receveur valeur appartient aux deux ensembles de méthodes, celui de `Point` et celui de `*Point`."
  - key: qcm-message
    format: multiple-choice
    question: "Que signifie l'erreur « X does not implement Y (method M has pointer receiver) » ?"
    choices:
      - {text: "On a passé une valeur `X`, alors que `M` est déclarée sur `*X`", correct: true}
      - {text: "La méthode `M` n'existe pas du tout sur le type `X`", correct: false}
      - {text: "L'interface `Y` déclare `M` avec un paramètre pointeur", correct: false}
      - {text: "La méthode `M` de `X` n'est pas exportée hors du package", correct: false}
    answer: "On a passé une valeur alors que `M` est déclarée sur le pointeur : on passe `&x`, ou l'on déclare `M` sur la valeur si elle ne modifie rien."
  - key: qcm-map
    format: multiple-choice
    question: "Avec `m map[string]T`, pourquoi ne peut-on pas appeler une méthode à receveur `*T` sur `m[k]` ?"
    choices:
      - {text: "L'élément n'est pas adressable : la map peut le déplacer", correct: true}
      - {text: "Les maps interdisent les méthodes sur leurs éléments", correct: false}
      - {text: "Il faut d'abord verrouiller la map avec un mutex", correct: false}
      - {text: "Une clé `string` ne peut pas porter de méthode", correct: false}
    answer: "C'est la même raison que pour les interfaces : pas d'adresse stable disponible, car la map déplace ses éléments en grandissant."
  - key: code-interface-pointeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compteur struct{ n int }

      func (c *Compteur) Incrementer() { c.n++ }

      type Incrementeur interface{ Incrementer() }

      var i Incrementeur = &Compteur{}
      i.Incrementer()
      i.Incrementer()
      fmt.Println(i.(*Compteur).n)
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas : `Compteur` n'implémente pas `Incrementeur`", correct: false}
    answer: '`2` : le pointeur implémente l''interface et les appels modifient le même compteur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ n int }\n\n\nfunc (c *Compteur) Incrementer() { c.n++ }\n\n\ntype Incrementeur interface{ Incrementer() }\n\nfunc main() {\n\tvar i Incrementeur = &Compteur{}\n\ti.Incrementer()\n\ti.Incrementer()\n\tfmt.Println(i.(*Compteur).n)\n}\n"
      output: '2'
  - key: code-interface-valeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compteur struct{ n int }

      func (c *Compteur) Incrementer() { c.n++ }

      type Incrementeur interface{ Incrementer() }

      var i Incrementeur = Compteur{}
      i.Incrementer()
      ```
    choices:
      - {text: "Ça ne compile pas : `Incrementer` a un receveur pointeur", correct: true}
      - {text: "Rien : l'appel modifie une copie du compteur", correct: false}
      - {text: "Rien : l'appel modifie le compteur, sans l'afficher", correct: false}
      - {text: "Une panic : la valeur n'est pas adressable", correct: false}
    answer: "Ça ne compile pas : « Compteur does not implement Incrementeur (method Incrementer has pointer receiver) ». Une valeur rangée dans une interface n'est pas adressable : seul `&Compteur{}` conviendrait."
    check:
      code: "package main\n\ntype Compteur struct{ n int }\n\n\nfunc (c *Compteur) Incrementer() { c.n++ }\n\n\ntype Incrementeur interface{ Incrementer() }\n\nfunc main() {\n\tvar i Incrementeur = Compteur{}\n\ti.Incrementer()\n}\n"
      compiles: false
  - key: code-stringer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Point struct{ X, Y int }

      func (p Point) String() string { return fmt.Sprintf("(%d, %d)", p.X, p.Y) }

      p := Point{1, 2}
      fmt.Println(p, &p)
      ```
    choices:
      - {text: "`(1, 2) (1, 2)`", correct: true}
      - {text: "`{1 2} (1, 2)`", correct: false}
      - {text: "`(1, 2) &{1 2}`", correct: false}
      - {text: "`{1 2} {1 2}`", correct: false}
    answer: '`(1, 2) (1, 2)` : la méthode valeur sert au pointeur comme à la valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\n\nfunc (p Point) String() string { return fmt.Sprintf(\"(%d, %d)\", p.X, p.Y) }\n\nfunc main() {\n\tp := Point{1, 2}\n\tfmt.Println(p, &p)\n}\n"
      output: (1, 2) (1, 2)
  - key: code-stringer-pointeur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Point struct{ X, Y int }

      func (p *Point) String() string { return fmt.Sprintf("(%d, %d)", p.X, p.Y) }

      p := Point{1, 2}
      fmt.Println(p, &p)
      ```
    choices:
      - {text: "`{1 2} (1, 2)`", correct: true}
      - {text: "`(1, 2) (1, 2)`", correct: false}
      - {text: "`{1 2} &{1 2}`", correct: false}
      - {text: "`(1, 2) {1 2}`", correct: false}
    answer: '`{1 2} (1, 2)` : avec un receveur pointeur, seule `&p` implémente `fmt.Stringer`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\n\nfunc (p *Point) String() string { return fmt.Sprintf(\"(%d, %d)\", p.X, p.Y) }\n\nfunc main() {\n\tp := Point{1, 2}\n\tfmt.Println(p, &p)\n}\n"
      output: '{1 2} (1, 2)'
  - key: bug-implemente
    format: bug-fix
    question: |-
      Le compilateur signale « Journal does not implement io.Writer (method Write has pointer receiver) ». Quelle correction est la bonne ?
      ```go
      var j Journal
      fmt.Fprintln(j, "démarrage")
      ```
    choices:
      - {text: "Passer un pointeur : `fmt.Fprintln(&j, \"démarrage\")`", correct: true}
      - {text: "Convertir : `fmt.Fprintln(io.Writer(j), \"démarrage\")`", correct: false}
      - {text: "Asserter : `fmt.Fprintln(j.(io.Writer), \"démarrage\")`", correct: false}
      - {text: "Déclarer `var j *Journal`, sans l'initialiser", correct: false}
    answer: |-
      ```go
      var j Journal
      fmt.Fprintln(&j, "démarrage")
      ```
      `Write` est déclarée sur `*Journal` : on passe un pointeur, ce qui permet aussi aux écritures d'accumuler dans le
      même journal.
  - key: bug-stringer
    format: bug-fix
    question: |-
      `fmt.Println(commande)` affiche les champs bruts au lieu du résumé prévu. Quelle correction est la bonne ?
      ```go
      func (c *Commande) String() string { return "commande " + c.ID }

      fmt.Println(commande) // commande est une valeur Commande
      ```
    choices:
      - {text: "Déclarer `String` sur la valeur : `func (c Commande) String() string`", correct: true}
      - {text: "Déréférencer la commande à l'affichage : `fmt.Println(*commande)`", correct: false}
      - {text: "Renommer la méthode `ToString`, le nom que cherche le package `fmt`", correct: false}
      - {text: "Remplacer `Println` par `fmt.Printf(\"%v\\n\", commande)`", correct: false}
    answer: |-
      ```go
      func (c Commande) String() string { return "commande " + c.ID }
      ```
      Avec un receveur pointeur, la valeur n'implémentait pas `fmt.Stringer`. Une méthode qui ne modifie rien peut avoir
      un receveur valeur (ou l'on affiche `&commande`).
  - key: bug-slice-interfaces
    format: bug-fix
    question: |-
      Le compilateur signale que `Tache` n'implémente pas `Executable`. Quelle correction est la bonne ?
      ```go
      func (t *Tache) Executer() error { ... }

      var travaux []Executable
      for _, t := range taches { // taches []Tache
      	travaux = append(travaux, t)
      }
      ```
    choices:
      - {text: "Ajouter des pointeurs vers les éléments : `append(travaux, &taches[i])`", correct: true}
      - {text: "Ajouter l'adresse de la variable de boucle : `append(travaux, &t)`", correct: false}
      - {text: "Convertir chaque tâche : `append(travaux, Executable(t))`", correct: false}
      - {text: "Convertir le slice entier : `travaux = []Executable(taches)`", correct: false}
    answer: "```go\nfor i := range taches {\n\ttravaux = append(travaux, &taches[i])\n}\n```\nIl faut des pointeurs ; et `&t` sur la variable de range désignerait une copie, d'où `&taches[i]`."
  - key: bug-verification
    format: bug-fix
    question: Comment être averti à la compilation, dans le package du type, que `*Depot` implémente bien `Stockage` ?
    choices:
      - {text: "`var _ Stockage = (*Depot)(nil)`", correct: true}
      - {text: "`func (*Depot) implements() Stockage { return nil }`", correct: false}
      - {text: "`type Depot struct{ Stockage }`", correct: false}
      - {text: "`//go:generate implements Depot Stockage`", correct: false}
    answer: |-
      ```go
      var _ Stockage = (*Depot)(nil)
      ```
      La ligne échoue à la compilation si l'ensemble de méthodes de `*Depot` ne couvre plus l'interface, avant même
      qu'un appelant ne l'utilise.
