notion: interface-nil
lesson: "Une valeur d'interface est un couple **(type, valeur)**. Elle n'est **nil** que si **les deux** sont absents.\n\n```go\nvar p *MonErreur = nil\nvar err error = p      // type = *MonErreur, valeur = nil\nfmt.Println(p == nil)  // true\nfmt.Println(err == nil) // FALSE : l'interface contient un type\n```\n\nLe cas typique : une fonction qui renvoie un **pointeur d'erreur concret** typé nil dans une interface `error` :\n\n```go\nfunc valider(c Client) error {\n\tvar e *ErrValidation\n\tif c.Nom == \"\" {\n\t\te = &ErrValidation{Champ: \"nom\"}\n\t}\n\treturn e // même quand e est nil, l'erreur renvoyée n'est PAS nil\n}\n```\n\nL'appelant voit `err != nil` et traite une erreur fantôme (et `err.Error()` peut paniquer si la méthode déréférence le\nreceveur).\n\nLes règles pour l'éviter :\n- **renvoyer `nil` explicitement** dans le chemin sans erreur (`return nil`), jamais une variable de type concret ;\n- déclarer les variables d'erreur avec le type **`error`**, pas `*MonErreur` ;\n- même logique pour toute interface (`io.Reader`, `http.Handler`) remplie par un pointeur typé nil.\n\n`go vet` ne détecte pas tous les cas ; les linters `nilnil` ou `nilaway` aident.\n\n**Piège classique** : un « constructeur » qui renvoie `(MonInterface, error)` avec un `*Impl` nil en cas d'erreur ;\nl'appelant qui teste l'interface contre nil se trompe.\n\n**En entretien** : « Une interface est nil seulement si son type et sa valeur le sont ; un pointeur typé nil dans une\ninterface donne une interface non nil ; on renvoie nil explicitement et l'on déclare les erreurs avec le type error. »"
cards:
  - key: quand-interface-vaut-nil
    format: course
    question: "Quand une valeur d'interface est-elle égale à `nil` ?"
    choices:
      - {text: "Seulement quand son type et sa valeur sont tous deux nil", correct: true}
      - {text: "Dès que la valeur qu'elle contient est un pointeur nil", correct: false}
      - {text: "Quand sa méthode `Error()` ou `String()` renvoie `\"<nil>\"`", correct: false}
      - {text: "Quand elle contient la valeur zéro de son type, comme `0`", correct: false}
    answer: "Seulement quand son type et sa valeur sont tous deux nil. Un pointeur nil typé rangé dedans lui donne un type : elle n'est plus nil."
  - key: err-nil-etre-vrai-avec-pointeur
    format: course
    question: "Pourquoi `err != nil` peut-il être vrai alors que l'erreur contient un pointeur nil ?"
    choices:
      - {text: "L'interface porte un type dynamique, `*MonErreur`, même si la valeur est nil", correct: true}
      - {text: "Le pointeur nil est converti en une erreur vide, `errors.New(\"\")`", correct: false}
      - {text: "La comparaison `!=` compare les messages d'erreur, pas les valeurs", correct: false}
      - {text: "Un pointeur nil n'est plus égal à `nil` une fois sorti de sa fonction", correct: false}
    answer: "L'interface porte un type dynamique non nil (`*MonErreur`) : elle n'est nil que si son type et sa valeur le sont tous les deux."
  - key: eviter-piege
    format: course
    question: "Comment éviter qu'une fonction qui renvoie `error` renvoie une erreur non nil contenant un pointeur nil ?"
    choices:
      - {text: "Renvoyer le littéral `nil` dans le chemin sans erreur", correct: true}
      - {text: "Renvoyer la variable `*MonErreur`, initialisée à nil", correct: false}
      - {text: "Tester `reflect.ValueOf(err).IsNil()` chez l'appelant", correct: false}
      - {text: "Déclarer la fonction avec le type de retour `*MonErreur`", correct: false}
    answer: "On renvoie explicitement `nil`, et l'on déclare les variables d'erreur avec le type `error`. Tester par réflexion chez chaque appelant masquerait le problème au lieu de le corriger."
  - key: code-var-iface-interface-fmt-println
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var iface interface{}
      fmt.Println(iface == nil)
      var pp *P
      iface = pp
      fmt.Println(iface == nil)
      ```
    choices:
      - text: |-
          ```
          true
          false
          ```
        correct: true
      - text: |-
          ```
          true
          true
          ```
        correct: false
      - text: |-
          ```
          false
          false
          ```
        correct: false
      - text: |-
          ```
          false
          true
          ```
        correct: false
    answer: "`true`, puis `false` : l'interface vide est nil, mais une fois le `*P` nil rangé dedans, elle porte le type `*P` et n'est plus nil."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tvar iface interface{}\n\tfmt.Println(iface == nil)\n\tvar pp *P\n\tiface = pp\n\tfmt.Println(iface == nil)\n}\n"
      output: |-
        true
        false
  - key: deux-mots
    format: course
    question: De quoi une valeur d'interface est-elle faite ?
    choices:
      - {text: "D'un type dynamique et d'une valeur ; nil seulement si les deux sont absents", correct: true}
      - {text: "D'un pointeur vers la valeur seule ; nil dès que ce pointeur est nil", correct: false}
      - {text: "D'une copie de la valeur seule, le type n'étant connu qu'à la compilation", correct: false}
      - {text: "D'une table des méthodes seule ; nil quand le type n'a aucune méthode", correct: false}
    answer: D'un type dynamique et d'une valeur ; elle vaut nil seulement si les deux sont absents.
  - key: vf-pointeur-nil
    format: true-false
    question: Une interface qui contient un pointeur nil de type `*T` est égale à nil.
    truth: false
    answer: 'Elle contient le type `*T` : elle n''est pas nil.'
  - key: vf-return-nil
    format: true-false
    question: Écrire `return nil` dans une fonction qui renvoie `error` produit une erreur nil.
    truth: true
    answer: Le littéral nil converti en interface n'a ni type ni valeur.
  - key: vf-variable-typee
    format: true-false
    question: Renvoyer `var e *MonErreur` (jamais affectée) depuis une fonction `error` renvoie une erreur nil.
    truth: false
    answer: 'L''interface reçoit le type `*MonErreur` : elle n''est pas nil.'
  - key: vf-methode
    format: true-false
    question: Appeler `err.Error()` sur une interface qui contient un `*MonErreur` nil panique forcément.
    truth: false
    answer: L'appel a lieu ; seule une méthode qui lit un champ à travers le receveur nil panique.
  - key: qcm-nil
    format: multiple-choice
    question: Lesquelles de ces valeurs d'interface valent nil ?
    choices:
      - text: '`var err error`'
        correct: true
      - text: '`var r io.Reader = nil`'
        correct: true
      - text: '`var e *MonErreur; var err error = e`'
        correct: false
      - text: '`var w io.Writer = (*bytes.Buffer)(nil)`'
        correct: false
    answer: Les deux dernières contiennent un type.
  - key: qcm-corriger
    format: multiple-choice
    question: "Laquelle de ces pratiques évite de renvoyer par erreur une `error` non nil ?"
    choices:
      - {text: "Écrire `return nil` dans le chemin sans erreur", correct: true}
      - {text: "Renvoyer toujours un `*MonErreur`, même nil", correct: false}
      - {text: "Tester `reflect.ValueOf(err).IsNil()` partout", correct: false}
      - {text: "Déclarer la fonction avec un retour `*MonErreur`", correct: false}
    answer: "Le littéral `nil` donne une interface vraiment nil ; déclarer la variable d'erreur avec le type `error` marche aussi. La réflexion masquerait le problème au lieu de le corriger."
  - key: qcm-symptome
    format: multiple-choice
    question: "Quel symptôme trahit une erreur « nil typée » ?"
    choices:
      - {text: "`err != nil` est vrai alors qu'aucune erreur n'a eu lieu", correct: true}
      - {text: "Une erreur de compilation sur le `return err`", correct: false}
      - {text: "Une panic dès l'appel de la fonction fautive", correct: false}
      - {text: "Le programme refuse de démarrer au lancement", correct: false}
    answer: "`err != nil` est vrai sans erreur réelle, et `fmt.Println(err)` affiche souvent `<nil>`, signe d'un pointeur nil dans l'interface. Le code compile sans rien signaler."
  - key: qcm-autres
    format: multiple-choice
    question: Ce piège existe-t-il pour d'autres interfaces que `error` ?
    choices:
      - text: Oui, pour toute interface remplie par un pointeur typé nil
        correct: true
      - text: Non, seulement pour error
        correct: false
      - text: Seulement pour les interfaces de la bibliothèque standard
        correct: false
      - text: Seulement avec les generics
        correct: false
    answer: Un `http.Handler` ou un `io.Reader` fabriqué depuis un pointeur nil a le même défaut.
  - key: code-pointeur-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type MonErreur struct{}

      func (*MonErreur) Error() string { return "boum" }

      var p *MonErreur
      var err error = p
      fmt.Println(p == nil, err == nil, err)
      ```
    choices:
      - {text: "`true false boum`", correct: true}
      - {text: "`true true <nil>`", correct: false}
      - {text: "`true false <nil>`", correct: false}
      - {text: "`false false boum`", correct: false}
    answer: '`true false boum` : l''interface contient le type `*MonErreur`, elle n''est pas nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype MonErreur struct{}\n\n\nfunc (*MonErreur) Error() string { return \"boum\" }\n\nfunc main() {\n\tvar p *MonErreur\n\tvar err error = p\n\tfmt.Println(p == nil, err == nil, err)\n}\n"
      output: true false boum
  - key: code-fonction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide" }

      func valider(nom string) error {
      	var e *ErrValidation
      	if nom == "" {
      		e = &ErrValidation{"nom"}
      	}
      	return e
      }

      fmt.Println(valider("Ada") == nil)
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Une panic : nil pointer dereference", correct: false}
      - {text: "Ça ne compile pas : `e` n'est pas une `error`", correct: false}
    answer: '`false` : même sans erreur, la fonction renvoie une interface qui contient un pointeur typé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide\" }\n\n\nfunc valider(nom string) error {\n\tvar e *ErrValidation\n\tif nom == \"\" {\n\t\te = &ErrValidation{\"nom\"}\n\t}\n\treturn e\n}\n\nfunc main() {\n\tfmt.Println(valider(\"Ada\") == nil)\n}\n"
      output: 'false'
  - key: code-correction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type ErrValidation struct{ Champ string }

      func (e *ErrValidation) Error() string { return "invalide : " + e.Champ }

      func valider(nom string) error {
      	if nom == "" {
      		return &ErrValidation{"nom"}
      	}
      	return nil
      }

      fmt.Println(valider("Ada") == nil, valider(""))
      ```
    choices:
      - {text: "`true invalide : nom`", correct: true}
      - {text: "`false invalide : nom`", correct: false}
      - {text: "`true <nil>`", correct: false}
      - {text: "`true invalide : `", correct: false}
    answer: '`true invalide : nom` : avec `return nil` explicite, l''erreur est vraiment nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype ErrValidation struct{ Champ string }\n\n\nfunc (e *ErrValidation) Error() string { return \"invalide : \" + e.Champ }\n\n\nfunc valider(nom string) error {\n\tif nom == \"\" {\n\t\treturn &ErrValidation{\"nom\"}\n\t}\n\treturn nil\n}\n\nfunc main() {\n\tfmt.Println(valider(\"Ada\") == nil, valider(\"\"))\n}\n"
      output: 'true invalide : nom'
  - key: bug-valider
    format: bug-fix
    question: |-
      Toutes les commandes sont refusées, même valides. Quelle correction est la bonne ?
      ```go
      func valider(c Commande) error {
      	var err *ErrValidation
      	if c.Total < 0 {
      		err = &ErrValidation{"total"}
      	}
      	return err
      }
      ```
    choices:
      - {text: "Renvoyer `&ErrValidation{...}` en cas d'erreur, et le littéral `nil` sinon", correct: true}
      - {text: "Initialiser `err` à `&ErrValidation{}` au lieu de le laisser à nil", correct: false}
      - {text: "Changer le type de retour de la fonction en `*ErrValidation`", correct: false}
      - {text: "Comparer chez l'appelant avec `err.Error() != \"\"`", correct: false}
    answer: "```go\nfunc valider(c Commande) error {\n\tif c.Total < 0 {\n\t\treturn &ErrValidation{\"total\"}\n\t}\n\treturn nil\n}\n```\nRenvoyer un `*ErrValidation` nil donnait une `error` non nil ; on renvoie nil explicitement."
  - key: bug-variable
    format: bug-fix
    question: |-
      Une fonction qui agrège les erreurs renvoie toujours une erreur, même quand tout est valide. Quelle correction est la bonne ?
      ```go
      var premiere *ErrChamp
      for _, c := range champs {
      	if e := verifier(c); e != nil && premiere == nil {
      		premiere = e
      	}
      }
      return premiere
      ```
    choices:
      - {text: "Déclarer la variable avec le type `error` : `var premiere error`", correct: true}
      - {text: "Initialiser la variable avec `premiere := &ErrChamp{}`", correct: false}
      - {text: "Renvoyer `*premiere` plutôt que le pointeur `premiere`", correct: false}
      - {text: "Remplacer `return premiere` par `return error(premiere)`", correct: false}
    answer: "```go\nvar premiere error\nfor _, c := range champs {\n\tif e := verifier(c); e != nil && premiere == nil {\n\t\tpremiere = e\n\t}\n}\nreturn premiere\n```\nDéclarée avec le type `error`, la variable reste vraiment nil quand aucune erreur n'a eu lieu."
  - key: bug-constructeur
    format: bug-fix
    question: |-
      L'appelant croit avoir un stockage valide alors que la création a échoué. Quelle correction est la bonne ?
      ```go
      func NouveauStockage(dsn string) (Stockage, error) {
      	var s *pgStockage
      	db, err := sql.Open("pgx", dsn)
      	if err == nil {
      		s = &pgStockage{db: db}
      	}
      	return s, err
      }

      st, _ := NouveauStockage(dsn)
      if st != nil { st.Lire(...) } // panique
      ```
    choices:
      - {text: "En cas d'erreur, `return nil, err` ; sinon `return &pgStockage{db: db}, nil`", correct: true}
      - {text: "Initialiser `s := &pgStockage{}` dès le début, pour ne jamais renvoyer nil", correct: false}
      - {text: "Remplacer `return s, err` par `return Stockage(s), err`, plus explicite", correct: false}
      - {text: "Faire paniquer `NouveauStockage` dès que `sql.Open` renvoie une erreur", correct: false}
    answer: "```go\nfunc NouveauStockage(dsn string) (Stockage, error) {\n\tdb, err := sql.Open(\"pgx\", dsn)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn &pgStockage{db: db}, nil\n}\n```\nLe `*pgStockage` nil placé dans l'interface la rendait non nil ; en cas d'erreur, on renvoie un nil explicite."
  - key: bug-handler
    format: bug-fix
    question: |-
      Le routeur croit qu'un handler est enregistré alors qu'il vaut nil. Quelle correction est la bonne ?
      ```go
      var h *MonHandler // pas encore initialisé
      mux.Handle("/x", h)
      ```
    choices:
      - {text: "Construire le handler avant de l'enregistrer : `h := &MonHandler{...}`", correct: true}
      - {text: "Passer la valeur `*h` au routeur, au lieu du pointeur `h`", correct: false}
      - {text: "Convertir explicitement : `mux.Handle(\"/x\", http.Handler(h))`", correct: false}
      - {text: "Enregistrer `&h`, l'adresse de la variable, au lieu de `h`", correct: false}
    answer: |-
      ```go
      h := &MonHandler{ /* dépendances */ }
      mux.Handle("/x", h)
      ```
      Un `*MonHandler` nil converti en `http.Handler` n'est pas nil : le serveur l'appellera et paniquera à la première
      requête. On ne passe que des valeurs construites.
  - key: scenario-expliquer
    format: scenario
    question: "Ton collègue ne comprend pas pourquoi `err != nil` est vrai alors que la fonction n'a rencontré aucune erreur. Que lui expliques-tu ?"
    choices:
      - {text: "La fonction renvoie un pointeur concret nil : l'interface reçoit son type, elle n'est donc pas nil", correct: true}
      - {text: "La fonction a bien échoué, mais avec un message d'erreur vide, d'où l'affichage `<nil>`", correct: false}
      - {text: "Le compilateur initialise toute `error` à une erreur vide, tant qu'on ne lui affecte pas `nil`", correct: false}
      - {text: "L'erreur vient d'un appel précédent, restée dans la variable `err` partagée par le package", correct: false}
    answer: "Une interface contient un type et une valeur. La fonction renvoie sans doute une variable `*MonErreur` restée nil : convertie en `error`, l'interface reçoit ce type et n'est donc pas nil (`fmt.Printf(\"%T\", err)` le montre). La correction : `return nil` explicite, et des variables d'erreur de type `error`."
  - key: scenario-revue
    format: scenario
    question: "Quelle règle de revue proposes-tu à ton équipe pour éviter le piège de l'erreur « nil typée » ?"
    choices:
      - {text: "Une fonction qui renvoie une interface renvoie une valeur construite ou le littéral `nil`, jamais une variable concrète", correct: true}
      - {text: "Chaque appelant compare ses erreurs avec `reflect.ValueOf(err).IsNil()`, en plus du test `err != nil`", correct: false}
      - {text: "Les fonctions renvoient toujours leur type d'erreur concret, `*MonErreur`, plutôt que l'interface `error`", correct: false}
      - {text: "Les erreurs sont créées en début de fonction, puis renvoyées à la fin dans tous les cas, même sans échec", correct: false}
    answer: |-
      Une fonction qui renvoie une interface ne renvoie jamais une variable de type concret qui peut être nil : elle
      renvoie soit une valeur construite, soit le littéral `nil`. Les variables d'erreur sont de type `error`. J'ajoute
      un linter (nilaway, ou staticcheck pour certains cas) en CI, et des tests qui vérifient `err == nil` dans le cas
      nominal, pas seulement les cas d'erreur.
  - key: scenario-diagnostic
    format: scenario
    question: Comment confirmerais-tu rapidement qu'une erreur inattendue est un pointeur nil typé ?
    choices:
      - {text: "`fmt.Printf(\"%T %v\\n\", err, err)` : un type pointeur concret, avec une valeur `<nil>`", correct: true}
      - {text: "`fmt.Println(err == nil)` : il affiche `true` si c'est un pointeur nil typé", correct: false}
      - {text: "`errors.Is(err, nil)` : il compare la valeur contenue, et non le type", correct: false}
      - {text: "`err.Error()` : il renvoie toujours une chaîne vide pour un pointeur nil", correct: false}
    answer: |-
      J'affiche `fmt.Printf("%T %v\n", err, err)` : un type concret pointeur (`*pkg.MonErreur`) avec une valeur `<nil>`
      (ou un message issu d'un receveur nil) signe le problème. Dans un débogueur, l'interface montre un type renseigné
      et un pointeur de données nul. Je remonte ensuite à la fonction qui renvoie la variable typée.
  - key: scenario-api
    format: scenario
    question: Pourquoi la convention Go dit-elle de renvoyer le type `error` plutôt qu'un type d'erreur concret ?
    choices:
      - {text: "Un type concret en retour crée le piège du nil typé, et fige le type d'erreur dans l'API", correct: true}
      - {text: "Un type concret en retour ne peut pas valoir `nil`, ce qui oblige à toujours créer une erreur", correct: false}
      - {text: "Le compilateur refuse qu'une fonction exportée renvoie un type d'erreur non exporté", correct: false}
      - {text: "Le type `error` est plus rapide : il évite une allocation à chaque retour d'erreur", correct: false}
    answer: |-
      Parce qu'un type concret en retour (`func f() *MonErreur`) incite l'appelant à l'affecter à une `error`, ce qui
      crée le piège du pointeur nil typé ; et il fige le type d'erreur dans l'API. Renvoyer `error` laisse libre de
      changer d'implémentation ; l'appelant inspecte avec `errors.As` s'il a besoin du type concret.
