notion: interface-nil
cards:
  - key: quand-interface-vaut-nil
    format: course
    question: Quand une interface vaut-elle nil ?
    answer: Seulement quand son type et sa valeur sont tous deux nil.
  - key: err-nil-etre-vrai-avec-pointeur
    format: course
    question: Pourquoi `err != nil` peut-il être vrai avec un pointeur nil dedans ?
    answer: L'interface porte un type dynamique non nil.
  - key: eviter-piege
    format: course
    question: Comment éviter ce piège ?
    answer: Retourner explicitement nil dans les fonctions qui renvoient une interface.
  - key: code-var-iface-interface-fmt-println
    format: code-output
    question: |-
      ```go
      var iface interface{}
      fmt.Println(iface == nil)
      var pp *P
      iface = pp
      fmt.Println(iface == nil)
      ```
    answer: '`true` puis `false`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype P struct{ X int }\n\nfunc main() {\n\tvar iface interface{}\n\tfmt.Println(iface == nil)\n\tvar pp *P\n\tiface = pp\n\tfmt.Println(iface == nil)\n}\n"
      output: |-
        true
        false
