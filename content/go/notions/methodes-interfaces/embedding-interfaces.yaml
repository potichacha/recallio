notion: embedding-interfaces
lesson: "Les interfaces se **composent** en s'embarquant les unes dans les autres :\n\n```go\ntype Reader interface { Read(p []byte) (int, error) }\ntype Writer interface { Write(p []byte) (int, error) }\ntype Closer interface { Close() error }\n\ntype ReadWriter interface {\n\tReader\n\tWriter\n}\ntype ReadWriteCloser interface {\n\tReader\n\tWriter\n\tCloser\n}\n```\n\nUn type implémente `ReadWriter` s'il a toutes les méthodes des interfaces embarquées.\n\nOn peut aussi **embarquer une interface dans une struct** : la struct obtient toutes les méthodes de l'interface, qui\ndélèguent à la valeur contenue. C'est la technique du **décorateur** : on ne redéfinit que les méthodes à modifier.\n\n```go\ntype compteurEcritures struct {\n\tio.Writer        // délègue tout à la valeur embarquée\n\tn int\n}\n\nfunc (c *compteurEcritures) Write(p []byte) (int, error) {\n\tc.n += len(p)\n\treturn c.Writer.Write(p) // on enveloppe Write seulement\n}\n```\n\nC'est aussi un outil de **test** : une struct qui embarque une grosse interface et ne redéfinit que la méthode utile\ncompile, mais **panique** si l'on appelle une méthode non redéfinie (l'interface embarquée vaut nil).\n\n**Piège classique** : oublier d'initialiser l'interface embarquée dans un décorateur ; tout appel délégué panique.\n\n**En entretien** : « Les interfaces se composent par embarquement (io.ReadWriter) ; une interface embarquée dans une\nstruct délègue ses méthodes, ce qui permet d'écrire un décorateur en ne redéfinissant que l'essentiel. »"
cards:
  - key: interfaces-composent-io-readwritecloser
    format: course
    question: "Quelles interfaces `io.ReadWriteCloser` embarque-t-elle ?"
    choices:
      - {text: "`io.Reader`, `io.Writer` et `io.Closer`", correct: true}
      - {text: "`io.Reader`, `io.Writer` et `io.Seeker`", correct: false}
      - {text: "`io.Reader` et `io.Closer`, sans `io.Writer`", correct: false}
      - {text: "`io.ReadWriter` et `io.Flusher`", correct: false}
    answer: "`io.Reader`, `io.Writer` et `io.Closer` : un type qui a `Read`, `Write` et `Close` la satisfait, sans rien déclarer."
  - key: decorateur
    format: course
    question: Comment écrire un décorateur qui ne modifie qu'une méthode d'une interface ?
    choices:
      - {text: "En embarquant l'interface dans une struct, et en ne redéfinissant que cette méthode", correct: true}
      - {text: "En embarquant le type concret par valeur, puis en redéfinissant toutes ses méthodes", correct: false}
      - {text: "En héritant de l'interface avec `extends`, puis en surchargeant la méthode visée", correct: false}
      - {text: "En remplaçant la méthode du type d'origine par réflexion, au démarrage du programme", correct: false}
    answer: En embarquant l'interface dans une struct, qui délègue toutes les méthodes, et en redéfinissant seulement celle à modifier.
  - key: test-partiel
    format: course
    question: Quel est le risque d'une doublure de test qui embarque une grande interface sans tout redéfinir ?
    choices:
      - {text: "Elle compile, mais une méthode non redéfinie panique à l'appel : l'interface vaut nil", correct: true}
      - {text: "Elle ne compile pas tant que toutes les méthodes ne sont pas redéfinies", correct: false}
      - {text: "Les méthodes non redéfinies renvoient en silence leurs valeurs zéro", correct: false}
      - {text: "Les méthodes non redéfinies appellent la vraie implémentation de production", correct: false}
    answer: Elle compile, mais tout appel à une méthode non redéfinie panique, puisque l'interface embarquée vaut nil.
  - key: vf-composition
    format: true-false
    question: '`io.ReadWriter` est composée de `io.Reader` et `io.Writer`.'
    truth: true
    answer: Par embarquement d'interfaces.
  - key: vf-struct-interface
    format: true-false
    question: Une struct qui embarque une interface obtient toutes ses méthodes dans son ensemble de méthodes.
    truth: true
    answer: Les appels sont délégués à la valeur contenue dans le champ.
  - key: vf-nil
    format: true-false
    question: Appeler une méthode promue d'une interface embarquée laissée à nil renvoie une erreur sans paniquer.
    truth: false
    answer: L'appel sur une interface nil panique.
  - key: vf-doublons
    format: true-false
    question: Depuis Go 1.14, deux interfaces embarquées peuvent déclarer la même méthode avec la même signature.
    truth: true
    answer: Les méthodes identiques sont fusionnées ; une signature différente reste une erreur.
  - key: qcm-implemente
    format: multiple-choice
    question: Que doit avoir un type pour implémenter `io.ReadWriteCloser` ?
    choices:
      - text: '`Read`, `Write` et `Close` avec les bonnes signatures'
        correct: true
      - text: Une déclaration `implements io.ReadWriteCloser`
        correct: false
      - text: Seulement `Read` et `Close`
        correct: false
      - text: Embarquer `io.ReadWriteCloser`
        correct: false
    answer: Embarquer l'interface donnerait les méthodes, mais délégueraient à une valeur à fournir.
  - key: qcm-decorateur
    format: multiple-choice
    question: "Que fait `type tracer struct{ http.RoundTripper }`, dont la méthode `RoundTrip` journalise la requête puis appelle `t.RoundTripper.RoundTrip(r)` ?"
    choices:
      - {text: "Il enveloppe un transport HTTP : il journalise chaque requête, puis délègue au transport embarqué", correct: true}
      - {text: "Il remplace le client HTTP entier, qui n'envoie plus ses requêtes par aucun transport", correct: false}
      - {text: "Il ne compile pas : on ne peut pas embarquer une interface dans une struct", correct: false}
      - {text: "Il rappelle sa propre méthode `RoundTrip` en boucle, jusqu'au débordement de pile", correct: false}
    answer: "C'est le patron des middlewares côté client : le décorateur enveloppe un transport, ajoute son comportement et délègue la vraie requête au `RoundTripper` embarqué."
  - key: qcm-nil
    format: multiple-choice
    question: Avec `type compteur struct{ io.Writer }` et `c := compteur{}`, que fait `c.Write(nil)` ?
    choices:
      - text: Il panique, l'interface embarquée vaut nil
        correct: true
      - text: Il ne fait rien et renvoie 0, nil
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il écrit sur la sortie standard
        correct: false
    answer: Il faut fournir le writer à la construction.
  - key: code-composition
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Lecteur interface{ Lire() string }
      type Ecrivain interface{ Ecrire(string) }
      type LecteurEcrivain interface {
      	Lecteur
      	Ecrivain
      }

      type Memoire struct{ s string }

      func (m *Memoire) Lire() string     { return m.s }
      func (m *Memoire) Ecrire(s string) { m.s += s }

      var le LecteurEcrivain = &Memoire{}
      le.Ecrire("go")
      le.Ecrire("!")
      fmt.Println(le.Lire())
      ```
    choices:
      - {text: "`go!`", correct: true}
      - {text: "`!`", correct: false}
      - {text: "`go`", correct: false}
      - {text: "Ça ne compile pas : `*Memoire` n'implémente pas `LecteurEcrivain`", correct: false}
    answer: '`go!` : `*Memoire` implémente l''interface composée.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Lecteur interface{ Lire() string }\n\ntype Ecrivain interface{ Ecrire(string) }\n\ntype LecteurEcrivain interface {\n\tLecteur\n\tEcrivain\n}\n\n\ntype Memoire struct{ s string }\n\n\nfunc (m *Memoire) Lire() string     { return m.s }\n\nfunc (m *Memoire) Ecrire(s string) { m.s += s }\n\nfunc main() {\n\tvar le LecteurEcrivain = &Memoire{}\n\tle.Ecrire(\"go\")\n\tle.Ecrire(\"!\")\n\tfmt.Println(le.Lire())\n}\n"
      output: go!
  - key: code-decorateur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type compteur struct {
      	io.Writer
      	n int
      }

      func (c *compteur) Write(p []byte) (int, error) {
      	c.n += len(p)
      	return c.Writer.Write(p)
      }

      var b strings.Builder
      c := &compteur{Writer: &b}
      fmt.Fprint(c, "bonjour")
      fmt.Println(b.String(), c.n)
      ```
    choices:
      - {text: "`bonjour 7`", correct: true}
      - {text: "`bonjour 0`", correct: false}
      - {text: "`bonjour 1`", correct: false}
      - {text: "Ça ne compile pas : `compteur` a deux méthodes `Write`", correct: false}
    answer: '`bonjour 7` : le décorateur compte les octets et délègue l''écriture.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\ntype compteur struct {\n\tio.Writer\n\tn int\n}\n\n\nfunc (c *compteur) Write(p []byte) (int, error) {\n\tc.n += len(p)\n\treturn c.Writer.Write(p)\n}\n\nfunc main() {\n\tvar b strings.Builder\n\tc := &compteur{Writer: &b}\n\tfmt.Fprint(c, \"bonjour\")\n\tfmt.Println(b.String(), c.n)\n}\n"
      output: bonjour 7
  - key: code-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Stockage interface {
      	Lire(string) string
      	Ecrire(string, string)
      }

      type fauxStockage struct{ Stockage }

      func (fauxStockage) Lire(cle string) string { return "valeur de " + cle }

      var s Stockage = fauxStockage{}
      fmt.Println(s.Lire("a"))
      s.Ecrire("a", "b")
      ```
    choices:
      - {text: "`valeur de a`, puis une panic : nil pointer dereference", correct: true}
      - {text: "`valeur de a`, puis rien : `Ecrire` n'a pas de code", correct: false}
      - {text: "Une panic dès la création de `fauxStockage{}`", correct: false}
      - {text: "Ça ne compile pas : `fauxStockage` n'a pas de méthode `Ecrire`", correct: false}
    answer: '`valeur de a`, puis une panique : `Ecrire` n''est pas redéfinie et délègue à une interface nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Stockage interface {\n\tLire(string) string\n\tEcrire(string, string)\n}\n\n\ntype fauxStockage struct{ Stockage }\n\n\nfunc (fauxStockage) Lire(cle string) string { return \"valeur de \" + cle }\n\nfunc main() {\n\tvar s Stockage = fauxStockage{}\n\tfmt.Println(s.Lire(\"a\"))\n\ts.Ecrire(\"a\", \"b\")\n}\n"
      output: valeur de a
      panics: nil pointer dereference
  - key: code-closer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      rc := io.NopCloser(strings.NewReader("abc"))
      b, _ := io.ReadAll(rc)
      fmt.Println(string(b), rc.Close())
      ```
    choices:
      - {text: "`abc <nil>`", correct: true}
      - {text: "`abc`", correct: false}
      - {text: "`abc nil`", correct: false}
      - {text: "`abc false`", correct: false}
    answer: '`abc <nil>` : `io.NopCloser` ajoute un `Close` sans effet pour former un `io.ReadCloser`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\trc := io.NopCloser(strings.NewReader(\"abc\"))\n\tb, _ := io.ReadAll(rc)\n\tfmt.Println(string(b), rc.Close())\n}\n"
      output: abc <nil>
  - key: bug-decorateur-nil
    format: bug-fix
    question: |-
      Le client HTTP instrumenté panique à la première requête. Quelle correction est la bonne ?
      ```go
      type journalise struct{ http.RoundTripper }

      func (j journalise) RoundTrip(r *http.Request) (*http.Response, error) {
      	log.Println(r.URL)
      	return j.RoundTripper.RoundTrip(r)
      }

      client := &http.Client{Transport: journalise{}}
      ```
    choices:
      - {text: "Construire `journalise{RoundTripper: http.DefaultTransport}`", correct: true}
      - {text: "Passer `&journalise{}`, un pointeur, au client HTTP", correct: false}
      - {text: "Appeler `j.RoundTrip(r)` au lieu de passer par le champ", correct: false}
      - {text: "Renvoyer `nil, nil` quand `j.RoundTripper` vaut nil", correct: false}
    answer: |-
      ```go
      client := &http.Client{Transport: journalise{RoundTripper: http.DefaultTransport}}
      ```
      L'interface embarquée valait nil : le décorateur doit recevoir le transport qu'il enveloppe.
  - key: bug-signature
    format: bug-fix
    question: |-
      Le compilateur signale « duplicate method Close ». Quelle correction est la bonne ?
      ```go
      type Ressource interface {
      	io.Closer
      	Close(force bool) error
      }
      ```
    choices:
      - {text: "Renommer la seconde méthode, par exemple `Fermer(force bool) error`", correct: true}
      - {text: "Embarquer `*io.Closer`, un pointeur, au lieu de `io.Closer`", correct: false}
      - {text: "Déclarer `Close(force bool)` avant `io.Closer`, pour qu'elle l'emporte", correct: false}
      - {text: "Donner une valeur par défaut au paramètre, `Close(force bool = false)`", correct: false}
    answer: "```go\ntype Ressource interface {\n\tio.Closer\n\tFermer(force bool) error\n}\n```\nDeux méthodes de même nom avec des signatures différentes ne peuvent pas coexister dans une interface."
  - key: bug-doublure
    format: bug-fix
    question: |-
      Un test passe, puis panique quand le code testé appelle une nouvelle méthode du dépôt. Quelle correction est la bonne ?
      ```go
      type fauxDepot struct{ Depot } // Depot : interface de 10 méthodes
      func (fauxDepot) Trouver(id string) (Client, error) { ... }
      ```
    choices:
      - {text: "Faire accepter au code une petite interface `trouveur`, et ne doubler qu'elle", correct: true}
      - {text: "Ajouter un `recover()` dans chaque test qui utilise `fauxDepot`", correct: false}
      - {text: "Embarquer `*Depot`, un pointeur vers l'interface, dans la doublure", correct: false}
      - {text: "Remplir le champ embarqué avec la vraie implémentation de production", correct: false}
    answer: "```go\n// le code testé déclare et accepte seulement ce qu'il utilise\ntype trouveur interface {\n\tTrouver(id string) (Client, error)\n}\n\ntype fauxTrouveur struct{}\n\nfunc (fauxTrouveur) Trouver(id string) (Client, error) { ... }\n```\nL'embarquement masquait l'absence des autres méthodes jusqu'à l'exécution ; une petite interface côté consommateur\nrend la doublure complète et le compilateur vigilant."
  - key: bug-closer
    format: bug-fix
    question: "Une fonction attend un `io.ReadCloser`, mais tu n'as qu'un `strings.Reader`. Ton collègue propose d'écrire tout un type. Quelle solution plus simple est la bonne ?"
    choices:
      - {text: "`io.NopCloser(strings.NewReader(contenu))`", correct: true}
      - {text: "`io.ReadCloser(strings.NewReader(contenu))`", correct: false}
      - {text: "`strings.NewReader(contenu).(io.ReadCloser)`", correct: false}
      - {text: "`io.MultiReader(strings.NewReader(contenu))`", correct: false}
    answer: |-
      ```go
      corps := io.NopCloser(strings.NewReader(contenu))
      ```
      `io.NopCloser` embarque le reader et ajoute un `Close` sans effet : c'est la bibliothèque standard qui applique la
      composition pour nous.
  - key: implementer-composee
    format: course
    question: Que faut-il pour qu'un type implémente une interface composée comme `io.ReadWriter` ?
    choices:
      - {text: "Avoir toutes les méthodes des interfaces embarquées, ici `Read` et `Write`", correct: true}
      - {text: "Déclarer qu'il implémente `io.Reader` et `io.Writer` avec `implements`", correct: false}
      - {text: "Avoir au moins l'une des deux méthodes, `Read` ou bien `Write`", correct: false}
      - {text: "Avoir une seule méthode `ReadWrite`, qui lit et écrit à la fois", correct: false}
    answer: "Avoir toutes les méthodes de toutes les interfaces embarquées, ici `Read` et `Write`. Il n'y a pas de mot-clé `implements` : la correspondance est implicite."
  - key: qcm-struct-interface
    format: multiple-choice
    question: "Quel est l'intérêt d'embarquer `io.Writer` dans une struct ?"
    choices:
      - {text: "Déléguer `Write` à la valeur contenue, ou l'envelopper", correct: true}
      - {text: "Hériter des champs exportés du writer concret contenu", correct: false}
      - {text: "Rendre la struct comparable avec `==` en toute sécurité", correct: false}
      - {text: "Garantir que le writer embarqué n'est jamais `nil`", correct: false}
    answer: "Les méthodes de l'interface sont promues : la struct délègue `Write` sans écrire de méthode, ou le redéfinit pour ajouter un comportement autour. Seules les méthodes de l'interface sont promues, pas les champs du type concret, et l'interface embarquée peut valoir nil."
