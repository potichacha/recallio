notion: embedding-interfaces
lesson: "Les interfaces se **composent** en s'embarquant les unes dans les autres :\n\n```go\ntype Reader interface { Read(p []byte) (int, error) }\ntype Writer interface { Write(p []byte) (int, error) }\ntype Closer interface { Close() error }\n\ntype ReadWriter interface {\n\tReader\n\tWriter\n}\ntype ReadWriteCloser interface {\n\tReader\n\tWriter\n\tCloser\n}\n```\n\nUn type implémente `ReadWriter` s'il a toutes les méthodes des interfaces embarquées.\n\nOn peut aussi **embarquer une interface dans une struct** : la struct obtient toutes les méthodes de l'interface, qui\ndélèguent à la valeur contenue. C'est la technique du **décorateur** : on ne redéfinit que les méthodes à modifier.\n\n```go\ntype compteurEcritures struct {\n\tio.Writer        // délègue tout à la valeur embarquée\n\tn int\n}\n\nfunc (c *compteurEcritures) Write(p []byte) (int, error) {\n\tc.n += len(p)\n\treturn c.Writer.Write(p) // on enveloppe Write seulement\n}\n```\n\nC'est aussi un outil de **test** : une struct qui embarque une grosse interface et ne redéfinit que la méthode utile\ncompile, mais **panique** si l'on appelle une méthode non redéfinie (l'interface embarquée vaut nil).\n\n**Piège classique** : oublier d'initialiser l'interface embarquée dans un décorateur ; tout appel délégué panique.\n\n**En entretien** : « Les interfaces se composent par embarquement (io.ReadWriter) ; une interface embarquée dans une\nstruct délègue ses méthodes, ce qui permet d'écrire un décorateur en ne redéfinissant que l'essentiel. »"
cards:
  - key: interfaces-composent-io-readwritecloser
    format: course
    question: Quelles interfaces composent io.ReadWriteCloser ?
    answer: io.Reader, io.Writer, io.Closer.
  - key: decorateur
    format: course
    question: Comment écrire un décorateur qui ne modifie qu'une méthode d'une interface ?
    answer: En embarquant l'interface dans une struct, qui délègue toutes les méthodes, et en redéfinissant seulement celle à modifier.
  - key: test-partiel
    format: course
    question: Quel est le risque d'une doublure de test qui embarque une grande interface sans tout redéfinir ?
    answer: Elle compile, mais tout appel à une méthode non redéfinie panique, puisque l'interface embarquée vaut nil.
  - key: vf-composition
    format: true-false
    question: '`io.ReadWriter` est composée de `io.Reader` et `io.Writer`.'
    truth: true
    answer: Par embarquement d'interfaces.
  - key: vf-struct-interface
    format: true-false
    question: Une struct qui embarque une interface obtient toutes ses méthodes dans son ensemble de méthodes.
    truth: true
    answer: Les appels sont délégués à la valeur contenue dans le champ.
  - key: vf-nil
    format: true-false
    question: Appeler une méthode promue d'une interface embarquée laissée à nil renvoie une erreur sans paniquer.
    truth: false
    answer: L'appel sur une interface nil panique.
  - key: vf-doublons
    format: true-false
    question: Depuis Go 1.14, deux interfaces embarquées peuvent déclarer la même méthode avec la même signature.
    truth: true
    answer: Les méthodes identiques sont fusionnées ; une signature différente reste une erreur.
  - key: qcm-implemente
    format: multiple-choice
    question: Que doit avoir un type pour implémenter `io.ReadWriteCloser` ?
    choices:
      - text: '`Read`, `Write` et `Close` avec les bonnes signatures'
        correct: true
      - text: Une déclaration `implements io.ReadWriteCloser`
        correct: false
      - text: Seulement `Read` et `Close`
        correct: false
      - text: Embarquer `io.ReadWriteCloser`
        correct: false
    answer: Embarquer l'interface donnerait les méthodes, mais délégueraient à une valeur à fournir.
  - key: qcm-decorateur
    format: multiple-choice
    question: Que fait `type tracer struct{ http.RoundTripper }` avec une méthode `RoundTrip` redéfinie ?
    choices:
      - text: Il enveloppe un transport HTTP pour, par exemple, journaliser chaque requête
        correct: true
      - text: Il délègue la vraie requête au RoundTripper embarqué
        correct: true
      - text: Il remplace le client HTTP entier
        correct: false
      - text: Il ne compile pas
        correct: false
    answer: C'est le patron des middlewares côté client.
  - key: qcm-nil
    format: multiple-choice
    question: Avec `type compteur struct{ io.Writer }` et `c := compteur{}`, que fait `c.Write(nil)` ?
    choices:
      - text: Il panique, l'interface embarquée vaut nil
        correct: true
      - text: Il ne fait rien et renvoie 0, nil
        correct: false
      - text: Il ne compile pas
        correct: false
      - text: Il écrit sur la sortie standard
        correct: false
    answer: Il faut fournir le writer à la construction.
  - key: code-composition
    format: code-output
    question: "```go\ntype Lecteur interface{ Lire() string }\ntype Ecrivain interface{ Ecrire(string) }\ntype LecteurEcrivain interface {\n\tLecteur\n\tEcrivain\n}\n\ntype Memoire struct{ s string }\n\nfunc (m *Memoire) Lire() string     { return m.s }\nfunc (m *Memoire) Ecrire(s string) { m.s += s }\n\nvar le LecteurEcrivain = &Memoire{}\nle.Ecrire(\"go\")\nle.Ecrire(\"!\")\nfmt.Println(le.Lire())\n```"
    answer: '`go!` : `*Memoire` implémente l''interface composée.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Lecteur interface{ Lire() string }\n\ntype Ecrivain interface{ Ecrire(string) }\n\ntype LecteurEcrivain interface {\n\tLecteur\n\tEcrivain\n}\n\n\ntype Memoire struct{ s string }\n\n\nfunc (m *Memoire) Lire() string     { return m.s }\n\nfunc (m *Memoire) Ecrire(s string) { m.s += s }\n\nfunc main() {\n\tvar le LecteurEcrivain = &Memoire{}\n\tle.Ecrire(\"go\")\n\tle.Ecrire(\"!\")\n\tfmt.Println(le.Lire())\n}\n"
      output: go!
  - key: code-decorateur
    format: code-output
    question: "```go\ntype compteur struct {\n\tio.Writer\n\tn int\n}\n\nfunc (c *compteur) Write(p []byte) (int, error) {\n\tc.n += len(p)\n\treturn c.Writer.Write(p)\n}\n\nvar b strings.Builder\nc := &compteur{Writer: &b}\nfmt.Fprint(c, \"bonjour\")\nfmt.Println(b.String(), c.n)\n```"
    answer: '`bonjour 7` : le décorateur compte les octets et délègue l''écriture.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\ntype compteur struct {\n\tio.Writer\n\tn int\n}\n\n\nfunc (c *compteur) Write(p []byte) (int, error) {\n\tc.n += len(p)\n\treturn c.Writer.Write(p)\n}\n\nfunc main() {\n\tvar b strings.Builder\n\tc := &compteur{Writer: &b}\n\tfmt.Fprint(c, \"bonjour\")\n\tfmt.Println(b.String(), c.n)\n}\n"
      output: bonjour 7
  - key: code-nil
    format: code-output
    question: "```go\ntype Stockage interface {\n\tLire(string) string\n\tEcrire(string, string)\n}\n\ntype fauxStockage struct{ Stockage }\n\nfunc (fauxStockage) Lire(cle string) string { return \"valeur de \" + cle }\n\nvar s Stockage = fauxStockage{}\nfmt.Println(s.Lire(\"a\"))\ns.Ecrire(\"a\", \"b\")\n```"
    answer: '`valeur de a`, puis une panique : `Ecrire` n''est pas redéfinie et délègue à une interface nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Stockage interface {\n\tLire(string) string\n\tEcrire(string, string)\n}\n\n\ntype fauxStockage struct{ Stockage }\n\n\nfunc (fauxStockage) Lire(cle string) string { return \"valeur de \" + cle }\n\nfunc main() {\n\tvar s Stockage = fauxStockage{}\n\tfmt.Println(s.Lire(\"a\"))\n\ts.Ecrire(\"a\", \"b\")\n}\n"
      output: valeur de a
      panics: nil pointer dereference
  - key: code-closer
    format: code-output
    question: |-
      ```go
      rc := io.NopCloser(strings.NewReader("abc"))
      b, _ := io.ReadAll(rc)
      fmt.Println(string(b), rc.Close())
      ```
    answer: '`abc <nil>` : `io.NopCloser` ajoute un `Close` sans effet pour former un `io.ReadCloser`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\trc := io.NopCloser(strings.NewReader(\"abc\"))\n\tb, _ := io.ReadAll(rc)\n\tfmt.Println(string(b), rc.Close())\n}\n"
      output: abc <nil>
  - key: bug-decorateur-nil
    format: bug-fix
    question: "Le client HTTP instrumenté panique à la première requête :\n```go\ntype journalise struct{ http.RoundTripper }\n\nfunc (j journalise) RoundTrip(r *http.Request) (*http.Response, error) {\n\tlog.Println(r.URL)\n\treturn j.RoundTripper.RoundTrip(r)\n}\n\nclient := &http.Client{Transport: journalise{}}\n```"
    answer: |-
      ```go
      client := &http.Client{Transport: journalise{RoundTripper: http.DefaultTransport}}
      ```
      L'interface embarquée valait nil : le décorateur doit recevoir le transport qu'il enveloppe.
  - key: bug-signature
    format: bug-fix
    question: "Le compilateur signale « duplicate method Close » :\n```go\ntype Ressource interface {\n\tio.Closer\n\tClose(force bool) error\n}\n```"
    answer: "```go\ntype Ressource interface {\n\tio.Closer\n\tFermer(force bool) error\n}\n```\nDeux méthodes de même nom avec des signatures différentes ne peuvent pas coexister dans une interface."
  - key: bug-doublure
    format: bug-fix
    question: |-
      Un test passe, puis panique quand le code appelle une nouvelle méthode du dépôt :
      ```go
      type fauxDepot struct{ Depot } // Depot : interface de 10 méthodes
      func (fauxDepot) Trouver(id string) (Client, error) { ... }
      ```
    answer: "```go\n// le code testé déclare et accepte seulement ce qu'il utilise\ntype trouveur interface {\n\tTrouver(id string) (Client, error)\n}\n\ntype fauxTrouveur struct{}\n\nfunc (fauxTrouveur) Trouver(id string) (Client, error) { ... }\n```\nL'embarquement masquait l'absence des autres méthodes jusqu'à l'exécution ; une petite interface côté consommateur\nrend la doublure complète et le compilateur vigilant."
  - key: bug-closer
    format: bug-fix
    question: Une fonction attend un `io.ReadCloser`, mais on n'a qu'un `strings.Reader`. Un collègue propose d'écrire tout un type. Plus simple ?
    answer: |-
      ```go
      corps := io.NopCloser(strings.NewReader(contenu))
      ```
      `io.NopCloser` embarque le reader et ajoute un `Close` sans effet : c'est la bibliothèque standard qui applique la
      composition pour nous.
  - key: implementer-composee
    format: course
    question: Que faut-il pour qu'un type implémente une interface composée comme `io.ReadWriter` ?
    answer: Avoir toutes les méthodes de toutes les interfaces embarquées, ici `Read` et `Write`.
  - key: qcm-struct-interface
    format: multiple-choice
    question: Que permet d'embarquer `io.Writer` dans une struct ?
    choices:
      - text: Déléguer `Write` à la valeur contenue sans écrire de méthode
        correct: true
      - text: Redéfinir seulement `Write` pour ajouter un comportement autour
        correct: true
      - text: Rendre la struct comparable
        correct: false
      - text: Hériter des champs du writer concret
        correct: false
    answer: Seules les méthodes de l'interface sont promues, pas les champs du type concret.
