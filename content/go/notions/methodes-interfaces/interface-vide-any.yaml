notion: interface-vide-any
lesson: |-
  L'**interface vide** `interface{}` n'a aucune méthode : **toutes** les valeurs l'implémentent. Depuis Go 1.18, `any`
  est son **alias**, qu'on écrit de préférence.

  ```go
  var x any = 42
  x = "texte"
  x = []int{1, 2}

  func Afficher(valeurs ...any) { ... }   // comme fmt.Println
  var donnees map[string]any              // du JSON de forme inconnue
  ```

  `any` sert quand le type n'est **vraiment pas connu** : `fmt.Println`, le décodage d'un JSON libre, un conteneur
  générique avant les generics. Mais on **perd le typage** : pour utiliser la valeur, il faut une **assertion de type**
  ou un **type switch**, et une erreur de type ne se voit qu'à l'exécution.

  Aujourd'hui, la plupart des usages de `any` « pour être générique » se remplacent par des **generics**
  (`func Max[T cmp.Ordered](a, b T) T`), qui gardent le typage.

  À savoir :
  - JSON décodé dans un `any` donne `map[string]any`, `[]any`, `string`, `float64` (tous les nombres), `bool` ou `nil` ;
  - comparer deux `any` avec `==` **panique** si leurs valeurs dynamiques ne sont pas comparables (deux slices) ;
  - un `[]string` n'est **pas** un `[]any` : il faut convertir élément par élément.

  **Piège classique** : un nombre JSON décodé dans `map[string]any` et testé avec `.(int)`. C'est un `float64`, et
  l'assertion échoue.

  **En entretien** : « any, alias d'interface{}, accepte tout mais fait perdre le typage ; on le réserve aux cas vraiment
  dynamiques (fmt, JSON libre) et l'on préfère les generics pour du code générique. »
cards:
  - key: represente-any
    format: course
    question: Que représente `any` ?
    answer: Un alias de interface{}, satisfait par tous les types (Go 1.18).
  - key: terme-any
    format: course
    question: Que désigne « any » ?
    answer: Alias de `interface{}`, satisfait par tous les types (Go 1.18)
  - key: alias
    format: course
    question: Quelle différence entre `any` et `interface{}` ?
    answer: 'Aucune : `any` est un alias introduit en Go 1.18, plus lisible.'
  - key: json-nombres
    format: course
    question: En quel type un nombre JSON est-il décodé dans un `any` ?
    answer: En `float64`, quel que soit le nombre ; avec `json.Decoder.UseNumber`, en `json.Number`.
  - key: vf-alias
    format: true-false
    question: '`any` est un alias de `interface{}`.'
    truth: true
    answer: Les deux s'écrivent indifféremment depuis Go 1.18.
  - key: vf-slice
    format: true-false
    question: Un `[]string` peut être passé là où un `[]any` est attendu.
    truth: false
    answer: Ce sont deux types différents ; il faut construire le `[]any`.
  - key: vf-comparaison
    format: true-false
    question: Comparer deux `any` contenant des slices avec `==` panique.
    truth: true
    answer: Les slices ne sont pas comparables ; l'erreur n'apparaît qu'à l'exécution.
  - key: vf-generics
    format: true-false
    question: Les generics remplacent beaucoup d'usages de `any` en gardant le typage.
    truth: true
    answer: Une fonction générique est vérifiée à la compilation pour chaque type.
  - key: qcm-usages
    format: multiple-choice
    question: Dans quels cas `any` est-il justifié ?
    choices:
      - text: Une fonction de journalisation qui accepte des valeurs de tous types
        correct: true
      - text: Décoder un JSON dont la forme est inconnue
        correct: true
      - text: Une fonction `Max` sur des nombres
        correct: false
      - text: Le type d'un champ `Prix` d'une commande
        correct: false
    answer: Pour `Max`, des generics ; pour `Prix`, un vrai type.
  - key: qcm-json
    format: multiple-choice
    question: Après `json.Unmarshal([]byte(`{"n":3}`), &m)` avec `m map[string]any`, quel est le type de `m["n"]` ?
    choices:
      - text: '`float64`'
        correct: true
      - text: '`int`'
        correct: false
      - text: '`json.Number`'
        correct: false
      - text: '`string`'
        correct: false
    answer: Tous les nombres JSON deviennent des float64 par défaut.
  - key: qcm-utiliser
    format: multiple-choice
    question: Comment utiliser la valeur contenue dans un `any` ?
    choices:
      - text: Une assertion de type `v.(string)`
        correct: true
      - text: Un type switch
        correct: true
      - text: Appeler directement ses méthodes
        correct: false
      - text: Une conversion `string(v)`
        correct: false
    answer: '`any` n''a aucune méthode ; il faut récupérer le type concret.'
  - key: qcm-perte
    format: multiple-choice
    question: Que perd-on en utilisant `any` ?
    choices:
      - text: La vérification des types à la compilation
        correct: true
      - text: L'autocomplétion et la lisibilité des signatures
        correct: true
      - text: La possibilité de stocker des structs
        correct: false
      - text: Le garbage collector
        correct: false
    answer: Les erreurs de type deviennent des paniques ou des échecs à l'exécution.
  - key: code-json
    format: code-output
    question: |-
      ```go
      var m map[string]any
      json.Unmarshal([]byte(`{"n":3,"t":["a"],"ok":true}`), &m)
      fmt.Printf("%T %T %T\n", m["n"], m["t"], m["ok"])
      ```
    answer: '`float64 []interface {} bool` : les types que produit encoding/json dans un any.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]any\n\tjson.Unmarshal([]byte(`{\"n\":3,\"t\":[\"a\"],\"ok\":true}`), &m)\n\tfmt.Printf(\"%T %T %T\\n\", m[\"n\"], m[\"t\"], m[\"ok\"])\n}\n"
      output: float64 []interface {} bool
  - key: code-tout
    format: code-output
    question: "```go\nvaleurs := []any{1, \"deux\", 3.0, nil, []int{4}}\nfor _, v := range valeurs {\n\tfmt.Printf(\"%T \", v)\n}\nfmt.Println()\n```"
    answer: '`int string float64 <nil> []int` : un `[]any` mélange tous les types.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvaleurs := []any{1, \"deux\", 3.0, nil, []int{4}}\n\tfor _, v := range valeurs {\n\t\tfmt.Printf(\"%T \", v)\n\t}\n\tfmt.Println()\n}\n"
      output: int string float64 <nil> []int
  - key: code-comparaison-panique
    format: code-output
    question: |-
      ```go
      var a, b any = 1, 1
      fmt.Println(a == b)
      a, b = []int{1}, []int{1}
      fmt.Println(a == b)
      ```
    answer: '`true`, puis une panique : comparer des slices dans des interfaces.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a, b any = 1, 1\n\tfmt.Println(a == b)\n\ta, b = []int{1}, []int{1}\n\tfmt.Println(a == b)\n}\n"
      output: 'true'
      panics: comparing uncomparable type []int
  - key: code-assertion-int
    format: code-output
    question: |-
      ```go
      var m map[string]any
      json.Unmarshal([]byte(`{"age":36}`), &m)
      _, ok := m["age"].(int)
      f, ok2 := m["age"].(float64)
      fmt.Println(ok, ok2, f)
      ```
    answer: '`false true 36` : le nombre est un float64, pas un int.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]any\n\tjson.Unmarshal([]byte(`{\"age\":36}`), &m)\n\t_, ok := m[\"age\"].(int)\n\tf, ok2 := m[\"age\"].(float64)\n\tfmt.Println(ok, ok2, f)\n}\n"
      output: false true 36
  - key: bug-float
    format: bug-fix
    question: |-
      L'âge lu d'un JSON libre vaut toujours 0 :
      ```go
      age, _ := donnees["age"].(int)
      ```
    answer: "```go\nf, ok := donnees[\"age\"].(float64)\nif !ok {\n\treturn errors.New(\"age manquant ou invalide\")\n}\nage := int(f)\n```\nLes nombres JSON sont décodés en float64. Mieux : décoder dans une struct typée (`Age int`)."
  - key: bug-generique
    format: bug-fix
    question: |-
      Rendez cette fonction sûre au typage :
      ```go
      func Premier(xs []any) any { return xs[0] }

      nom := Premier(noms).(string) // noms a dû être converti en []any
      ```
    answer: |-
      ```go
      func Premier[T any](xs []T) T { return xs[0] }

      nom := Premier(noms)
      ```
      Avec un paramètre de type, plus de conversion en `[]any` ni d'assertion : le type est vérifié à la compilation.
  - key: bug-slice-any
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use ids (variable of type []int) as []any value » :
      ```go
      db.Query("SELECT * FROM t WHERE id IN (?, ?, ?)", ids...)
      ```
    answer: "```go\nargs := make([]any, len(ids))\nfor i, id := range ids {\n\targs[i] = id\n}\ndb.Query(\"SELECT * FROM t WHERE id IN (?, ?, ?)\", args...)\n```\nUn `[]int` n'est pas un `[]any` : on construit le slice d'arguments."
  - key: bug-struct
    format: bug-fix
    question: |-
      Le code de traitement des commandes est truffé d'assertions qui paniquent parfois :
      ```go
      var cmd map[string]any
      json.Unmarshal(corps, &cmd)
      total := cmd["total"].(float64) * cmd["quantite"].(float64)
      ```
    answer: "```go\ntype Commande struct {\n\tTotal    float64 `json:\"total\"`\n\tQuantite int     `json:\"quantite\"`\n}\n\nvar cmd Commande\nif err := json.Unmarshal(corps, &cmd); err != nil {\n\treturn err\n}\ntotal := cmd.Total * float64(cmd.Quantite)\n```\nQuand la forme du JSON est connue, une struct typée remplace les assertions et signale les erreurs proprement."
