notion: interface-vide-any
lesson: |-
  L'**interface vide** `interface{}` n'a aucune méthode : **toutes** les valeurs l'implémentent. Depuis Go 1.18, `any`
  est son **alias**, qu'on écrit de préférence.

  ```go
  var x any = 42
  x = "texte"
  x = []int{1, 2}

  func Afficher(valeurs ...any) { ... }   // comme fmt.Println
  var donnees map[string]any              // du JSON de forme inconnue
  ```

  `any` sert quand le type n'est **vraiment pas connu** : `fmt.Println`, le décodage d'un JSON libre, un conteneur
  générique avant les generics. Mais on **perd le typage** : pour utiliser la valeur, il faut une **assertion de type**
  ou un **type switch**, et une erreur de type ne se voit qu'à l'exécution.

  Aujourd'hui, la plupart des usages de `any` « pour être générique » se remplacent par des **generics**
  (`func Max[T cmp.Ordered](a, b T) T`), qui gardent le typage.

  À savoir :
  - JSON décodé dans un `any` donne `map[string]any`, `[]any`, `string`, `float64` (tous les nombres), `bool` ou `nil` ;
  - comparer deux `any` avec `==` **panique** si leurs valeurs dynamiques ne sont pas comparables (deux slices) ;
  - un `[]string` n'est **pas** un `[]any` : il faut convertir élément par élément.

  **Piège classique** : un nombre JSON décodé dans `map[string]any` et testé avec `.(int)`. C'est un `float64`, et
  l'assertion échoue.

  **En entretien** : « any, alias d'interface{}, accepte tout mais fait perdre le typage ; on le réserve aux cas vraiment
  dynamiques (fmt, JSON libre) et l'on préfère les generics pour du code générique. »
tour:
  - title: "L'interface vide : any"
    text: |-
      L'interface vide, `interface{}`, n'exige aucune méthode : **toute** valeur la satisfait. Depuis Go 1.18, `any` est
      son autre nom.

      Une variable `any` peut tout contenir, mais on ne peut presque rien en faire sans retrouver son type concret :
      c'est le rôle de l'assertion de type et du switch de type (pages suivantes). `fmt.Println` prend des `any` : c'est
      pourquoi il affiche tout.

      On l'évite dans ses propres fonctions quand un type précis ou un générique conviennent.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	var v any
          	fmt.Println(v == nil)
          	v = 42
          	fmt.Printf("%v %T\n", v, v)
          	v = "texte"
          	fmt.Printf("%v %T\n", v, v)

          	valeurs := []any{1, "deux", 3.5, true}
          	fmt.Println(len(valeurs), valeurs)
          }
      output: |-
        true
        42 int
        texte string
        4 [1 deux 3.5 true]
cards:
  - key: represente-any
    format: course
    question: "Que représente le type `any` en Go ?"
    choices:
      - {text: "Un alias d'`interface{}`, satisfait par tous les types (Go 1.18)", correct: true}
      - {text: "Un type générique qui prend le type de sa première affectation", correct: false}
      - {text: "Un pointeur sans type, comme `void*` en C, à convertir soi-même", correct: false}
      - {text: "La super-classe de tous les types, comme `Object` en Java", correct: false}
    answer: "Un alias d'`interface{}`, introduit en Go 1.18 : l'interface sans méthode, que tous les types satisfont. Ce n'est ni un `Object` dont on hérite, ni un pointeur brut."
  - key: terme-any
    format: course
    question: "Quels types satisfont l'interface `any` ?"
    choices:
      - {text: "Tous les types, puisqu'elle n'exige aucune méthode", correct: true}
      - {text: "Seulement les types qui déclarent au moins une méthode", correct: false}
      - {text: "Seulement les pointeurs, les slices et les maps", correct: false}
      - {text: "Seulement les types comparables avec `==`", correct: false}
    answer: "Tous : `any`, alias d'`interface{}`, n'exige aucune méthode. Les types comparables avec `==`, c'est la contrainte `comparable`, pas `any`."
  - key: alias
    format: course
    question: "Quelle différence y a-t-il entre `any` et `interface{}` ?"
    choices:
      - {text: "Aucune : `any` est un alias plus lisible, apparu en Go 1.18", correct: true}
      - {text: "`any` ne sert que de contrainte dans un type générique", correct: false}
      - {text: "`any` vérifie le type à la compilation, `interface{}` à l'exécution", correct: false}
      - {text: "`interface{}` accepte `nil`, alors que `any` le refuse", correct: false}
    answer: "Aucune : `any` est un alias introduit en Go 1.18, plus lisible. Il sert aussi bien de type que de contrainte générique."
  - key: json-nombres
    format: course
    question: En quel type un nombre JSON est-il décodé dans un `any` ?
    choices:
      - {text: "En `float64`, quel que soit le nombre (sauf avec `UseNumber`)", correct: true}
      - {text: "En `int` pour un entier, en `float64` pour un décimal", correct: false}
      - {text: "En `int64` pour un entier, en `float64` pour un décimal", correct: false}
      - {text: "En `string`, à convertir soi-même avec `strconv`", correct: false}
    answer: En `float64`, quel que soit le nombre ; avec `json.Decoder.UseNumber`, en `json.Number`.
  - key: vf-alias
    format: true-false
    question: '`any` est un alias de `interface{}`.'
    truth: true
    answer: Les deux s'écrivent indifféremment depuis Go 1.18.
  - key: vf-slice
    format: true-false
    question: Un `[]string` peut être passé là où un `[]any` est attendu.
    truth: false
    answer: Ce sont deux types différents ; il faut construire le `[]any`.
  - key: vf-comparaison
    format: true-false
    question: Comparer deux `any` contenant des slices avec `==` panique.
    truth: true
    answer: Les slices ne sont pas comparables ; l'erreur n'apparaît qu'à l'exécution.
  - key: vf-generics
    format: true-false
    question: Les generics remplacent beaucoup d'usages de `any` en gardant le typage.
    truth: true
    answer: Une fonction générique est vérifiée à la compilation pour chaque type.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lequel de ces cas `any` est-il justifié ?"
    choices:
      - {text: "Décoder un JSON dont la forme est inconnue à l'avance", correct: true}
      - {text: "Une fonction `Max` qui compare des nombres de tous types", correct: false}
      - {text: "Le type du champ `Prix` d'une commande en ligne", correct: false}
      - {text: "Le paramètre d'une fonction qui additionne des entiers", correct: false}
    answer: "Une donnée dont on ne connaît pas la forme (un JSON libre, ou une journalisation qui accepte tout) justifie `any`. Pour `Max`, des génériques ; pour `Prix`, un vrai type."
  - key: qcm-json
    format: multiple-choice
    question: Après `json.Unmarshal([]byte(`{"n":3}`), &m)` avec `m map[string]any`, quel est le type de `m["n"]` ?
    choices:
      - text: '`float64`'
        correct: true
      - text: '`int`'
        correct: false
      - text: '`json.Number`'
        correct: false
      - text: '`string`'
        correct: false
    answer: Tous les nombres JSON deviennent des float64 par défaut.
  - key: qcm-utiliser
    format: multiple-choice
    question: "Laquelle de ces façons d'utiliser la valeur contenue dans un `any` compile ?"
    choices:
      - {text: "Une assertion de type, `v.(string)`", correct: true}
      - {text: "Un appel direct de méthode, `v.String()`", correct: false}
      - {text: "Une conversion explicite, `string(v)`", correct: false}
      - {text: "Une opération directe, comme `v + 1`", correct: false}
    answer: "`any` n'a aucune méthode : il faut récupérer le type concret, par une assertion ou un type switch. Une conversion `string(v)` ne compile pas."
  - key: qcm-perte
    format: multiple-choice
    question: "Que perd-on surtout en utilisant `any` à la place d'un vrai type ?"
    choices:
      - {text: "La vérification des types à la compilation", correct: true}
      - {text: "La possibilité d'y ranger des structs", correct: false}
      - {text: "Le passage par le ramasse-miettes", correct: false}
      - {text: "La possibilité de le comparer à `nil`", correct: false}
    answer: "Les erreurs de type deviennent des paniques ou des échecs à l'exécution, et les signatures disent moins ce qu'elles attendent."
  - key: code-json
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]any
      json.Unmarshal([]byte(`{"n":3,"t":["a"],"ok":true}`), &m)
      fmt.Printf("%T %T %T\n", m["n"], m["t"], m["ok"])
      ```
    choices:
      - {text: "`float64 []interface {} bool`", correct: true}
      - {text: "`int []interface {} bool`", correct: false}
      - {text: "`float64 []string bool`", correct: false}
      - {text: "`int []string bool`", correct: false}
    answer: '`float64 []interface {} bool` : les types que produit encoding/json dans un any.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]any\n\tjson.Unmarshal([]byte(`{\"n\":3,\"t\":[\"a\"],\"ok\":true}`), &m)\n\tfmt.Printf(\"%T %T %T\\n\", m[\"n\"], m[\"t\"], m[\"ok\"])\n}\n"
      output: float64 []interface {} bool
  - key: code-tout
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      valeurs := []any{1, "deux", 3.0, nil, []int{4}}
      for _, v := range valeurs {
      	fmt.Printf("%T ", v)
      }
      fmt.Println()
      ```
    choices:
      - {text: "`int string float64 <nil> []int`", correct: true}
      - {text: "`int string float64 nil []int`", correct: false}
      - {text: "`int string int <nil> []int`", correct: false}
      - {text: "`any any any any any`", correct: false}
    answer: '`int string float64 <nil> []int` : un `[]any` mélange tous les types.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvaleurs := []any{1, \"deux\", 3.0, nil, []int{4}}\n\tfor _, v := range valeurs {\n\t\tfmt.Printf(\"%T \", v)\n\t}\n\tfmt.Println()\n}\n"
      output: int string float64 <nil> []int
  - key: code-comparaison-panique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a, b any = 1, 1
      fmt.Println(a == b)
      a, b = []int{1}, []int{1}
      fmt.Println(a == b)
      ```
    choices:
      - {text: "`true`, puis une panic : comparing uncomparable type []int", correct: true}
      - {text: "`true`, puis `false` : deux slices distinctes", correct: false}
      - {text: "`true`, puis `true` : les contenus sont égaux", correct: false}
      - {text: "Ça ne compile pas : on ne compare pas des slices", correct: false}
    answer: "`true`, puis une panique : comparer deux interfaces qui contiennent des slices compile, mais échoue à l'exécution, les slices n'étant pas comparables."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar a, b any = 1, 1\n\tfmt.Println(a == b)\n\ta, b = []int{1}, []int{1}\n\tfmt.Println(a == b)\n}\n"
      output: 'true'
      panics: comparing uncomparable type []int
  - key: code-assertion-int
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var m map[string]any
      json.Unmarshal([]byte(`{"age":36}`), &m)
      _, ok := m["age"].(int)
      f, ok2 := m["age"].(float64)
      fmt.Println(ok, ok2, f)
      ```
    choices:
      - {text: "`false true 36`", correct: true}
      - {text: "`true false 0`", correct: false}
      - {text: "`true true 36`", correct: false}
      - {text: "`false true 36.0`", correct: false}
    answer: '`false true 36` : le nombre est un float64, pas un int.'
    check:
      code: "package main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]any\n\tjson.Unmarshal([]byte(`{\"age\":36}`), &m)\n\t_, ok := m[\"age\"].(int)\n\tf, ok2 := m[\"age\"].(float64)\n\tfmt.Println(ok, ok2, f)\n}\n"
      output: false true 36
  - key: bug-float
    format: bug-fix
    question: |-
      L'âge lu d'un JSON libre vaut toujours 0. Quelle correction est la bonne ?
      ```go
      age, _ := donnees["age"].(int)
      ```
    choices:
      - {text: "Asserter vers `float64`, le type des nombres JSON, puis convertir en `int`", correct: true}
      - {text: "Asserter vers `int64`, le type des entiers JSON sur 64 bits", correct: false}
      - {text: "Convertir directement, avec `age := int(donnees[\"age\"])`", correct: false}
      - {text: "Asserter vers `json.Number`, sans rien changer au décodage", correct: false}
    answer: "```go\nf, ok := donnees[\"age\"].(float64)\nif !ok {\n\treturn errors.New(\"age manquant ou invalide\")\n}\nage := int(f)\n```\nLes nombres JSON sont décodés en float64. Mieux : décoder dans une struct typée (`Age int`)."
  - key: bug-generique
    format: bug-fix
    question: |-
      Cette fonction perd le typage : il faut convertir en `[]any`, puis asserter le résultat. Quelle correction est la bonne ?
      ```go
      func Premier(xs []any) any { return xs[0] }

      nom := Premier(noms).(string) // noms a dû être converti en []any
      ```
    choices:
      - {text: "Un paramètre de type : `func Premier[T any](xs []T) T`", correct: true}
      - {text: "Un paramètre `[]interface{}`, plus explicite que `[]any`", correct: false}
      - {text: "Un retour `string`, avec l'assertion dans la fonction", correct: false}
      - {text: "Un type switch dans la fonction, sur chaque type possible", correct: false}
    answer: |-
      ```go
      func Premier[T any](xs []T) T { return xs[0] }

      nom := Premier(noms)
      ```
      Avec un paramètre de type, plus de conversion en `[]any` ni d'assertion : le type est vérifié à la compilation.
  - key: bug-slice-any
    format: bug-fix
    question: |-
      Le compilateur signale « cannot use ids (variable of type []int) as []any value ». Quelle correction est la bonne ?
      ```go
      db.Query("SELECT * FROM t WHERE id IN (?, ?, ?)", ids...)
      ```
    choices:
      - {text: "Copier les `ids` un par un dans un `[]any`, puis passer `args...`", correct: true}
      - {text: "Convertir le slice entier au passage, avec `[]any(ids)...`", correct: false}
      - {text: "Passer le slice sans les points de suspension : `ids`", correct: false}
      - {text: "Asserter le slice au passage, avec `ids.([]any)...`", correct: false}
    answer: "```go\nargs := make([]any, len(ids))\nfor i, id := range ids {\n\targs[i] = id\n}\ndb.Query(\"SELECT * FROM t WHERE id IN (?, ?, ?)\", args...)\n```\nUn `[]int` n'est pas un `[]any` : on construit le slice d'arguments."
  - key: bug-struct
    format: bug-fix
    question: |-
      Le code de traitement des commandes est truffé d'assertions qui paniquent parfois. Quelle correction est la bonne ?
      ```go
      var cmd map[string]any
      json.Unmarshal(corps, &cmd)
      total := cmd["total"].(float64) * cmd["quantite"].(float64)
      ```
    choices:
      - {text: "Décoder dans une struct `Commande` typée, avec ses tags `json`", correct: true}
      - {text: "Passer toutes les assertions à la forme `v, ok`, en ignorant `ok`", correct: false}
      - {text: "Ajouter un `recover()` autour du calcul du total de la commande", correct: false}
      - {text: "Décoder dans un `map[string]float64` plutôt qu'un `map[string]any`", correct: false}
    answer: "```go\ntype Commande struct {\n\tTotal    float64 `json:\"total\"`\n\tQuantite int     `json:\"quantite\"`\n}\n\nvar cmd Commande\nif err := json.Unmarshal(corps, &cmd); err != nil {\n\treturn err\n}\ntotal := cmd.Total * float64(cmd.Quantite)\n```\nQuand la forme du JSON est connue, une struct typée remplace les assertions et signale les erreurs proprement."
