notion: petites-interfaces
lesson: |-
  Go préfère les **petites interfaces**, souvent d'**une seule méthode** : « plus l'interface est grande, plus
  l'abstraction est faible » (proverbe Go).

  Les plus importantes de la bibliothèque standard :

  | Interface | Méthode | Exemples d'implémentations |
  |---|---|---|
  | `io.Reader` | `Read(p []byte) (n int, err error)` | fichiers, connexions, `strings.Reader`, corps HTTP |
  | `io.Writer` | `Write(p []byte) (n int, err error)` | fichiers, `bytes.Buffer`, `http.ResponseWriter`, hash |
  | `io.Closer` | `Close() error` | fichiers, connexions |
  | `fmt.Stringer` | `String() string` | tout type à afficher |
  | `error` | `Error() string` | toutes les erreurs |
  | `sort.Interface` | `Len`, `Less`, `Swap` | collections triables |
  | `http.Handler` | `ServeHTTP(w, r)` | tout handler HTTP |

  Elles se **composent** : `io.ReadWriter`, `io.ReadCloser`. Une fonction qui accepte un `io.Reader` lit indifféremment
  un fichier, une chaîne, une archive, une requête réseau, et se teste avec `strings.NewReader("...")`.

  Le **nommage** : une interface d'une méthode prend le nom de la méthode suivi de `-er` (`Reader`, `Writer`,
  `Stringer`, `Notifieur`).

  **Piège classique** : une interface `Repository` de quinze méthodes que chaque consommateur n'utilise qu'à moitié. Les
  tests doivent tout doubler, et ajouter une méthode casse toutes les implémentations.

  **En entretien** : « Des interfaces d'une ou deux méthodes, nommées en -er, composables ; io.Reader et io.Writer
  permettent de brancher fichiers, réseau et tests sans changer le code. »
cards:
  - key: interfaces-petites
    format: course
    question: Pourquoi des interfaces petites ?
    answer: Plus faciles à implémenter, composer et mocker ; une grosse interface est une abstraction faible.
  - key: nommer-interface-methode
    format: course
    question: Comment nommer une interface d'une méthode ?
    answer: 'Avec le suffixe -er : Reader, Writer, Notifier.'
  - key: nommage
    format: course
    question: Comment nomme-t-on une interface d'une seule méthode ?
    answer: 'Avec le nom de la méthode suivi de « -er » : `Read` → `Reader`, `Write` → `Writer`, `String` → `Stringer`.'
  - key: tester
    format: course
    question: Comment tester une fonction qui lit un `io.Reader` sans créer de fichier ?
    answer: En lui passant `strings.NewReader("contenu")` ou un `bytes.Buffer`.
  - key: vf-proverbe
    format: true-false
    question: Selon un proverbe Go, plus une interface est grande, plus l'abstraction est faible.
    truth: true
    answer: « The bigger the interface, the weaker the abstraction. »
  - key: vf-composition
    format: true-false
    question: '`io.ReadCloser` est composée de `io.Reader` et `io.Closer`.'
    truth: true
    answer: Les interfaces s'embarquent les unes dans les autres.
  - key: vf-response-writer
    format: true-false
    question: '`http.ResponseWriter` implémente `io.Writer`.'
    truth: true
    answer: On peut donc écrire une réponse avec `fmt.Fprintf(w, ...)` ou `io.Copy(w, src)`.
  - key: vf-grande
    format: true-false
    question: Une interface de quinze méthodes facilite l'écriture des doublures de test.
    truth: false
    answer: Chaque doublure doit implémenter les quinze ; de petites interfaces côté consommateur sont plus simples.
  - key: qcm-implementations
    format: multiple-choice
    question: Quels types implémentent `io.Writer` ?
    choices:
      - text: '`*os.File`'
        correct: true
      - text: '`*bytes.Buffer`'
        correct: true
      - text: '`string`'
        correct: false
      - text: '`[]byte`'
        correct: false
    answer: Une chaîne et un slice n'ont pas de méthode Write.
  - key: qcm-signature
    format: multiple-choice
    question: Quelle est la signature de la méthode de `io.Reader` ?
    choices:
      - text: '`Read(p []byte) (n int, err error)`'
        correct: true
      - text: '`Read() ([]byte, error)`'
        correct: false
      - text: '`Read(n int) []byte`'
        correct: false
      - text: '`Read(p []byte) error`'
        correct: false
    answer: L'appelant fournit le tampon ; Read y écrit et dit combien d'octets.
  - key: qcm-avantage
    format: multiple-choice
    question: Pourquoi écrire `func Compter(r io.Reader) (int, error)` plutôt que `func Compter(chemin string)` ?
    choices:
      - text: La fonction marche sur un fichier, une requête HTTP, une chaîne ou une archive
        correct: true
      - text: Elle se teste sans fichier, avec `strings.NewReader`
        correct: true
      - text: Elle est forcément plus rapide
        correct: false
      - text: Elle gère les erreurs à la place de l'appelant
        correct: false
    answer: La fonction ne dépend plus de l'origine des données.
  - key: qcm-noms
    format: multiple-choice
    question: Quel nom donner à une interface `Notifier(msg string) error` ?
    choices:
      - text: '`Notifieur`'
        correct: true
      - text: '`INotification`'
        correct: false
      - text: '`NotificationInterface`'
        correct: false
      - text: '`AbstractNotifier`'
        correct: false
    answer: Ni préfixe `I` ni suffixe `Interface` en Go.
  - key: trous-reader
    format: fill-in
    question: |-
      Complétez pour accepter toute source de données :
      ```go
      func Compter(r io.___) (int, error) { ... }
      ```
    blanks:
      - - Reader
    answer: '`io.Reader` couvre fichiers, réseau et chaînes.'
  - key: trous-test
    format: fill-in
    question: |-
      Complétez le test sans fichier :
      ```go
      n, err := Compter(strings.___("a\nb\n"))
      ```
    blanks:
      - - NewReader
    answer: '`strings.NewReader` est un `io.Reader` sur une chaîne.'
  - key: trous-stringer
    format: fill-in
    question: "Complétez l'interface de `fmt` pour l'affichage :\n```go\ntype Stringer interface {\n\t___() string\n}\n```"
    blanks:
      - - String
    answer: '`fmt` appelle `String()` quand elle existe.'
  - key: trous-fprintf
    format: fill-in
    question: |-
      Complétez pour écrire dans n'importe quel `io.Writer` :
      ```go
      fmt.___(w, "total : %d\n", total)
      ```
    blanks:
      - - Fprintf
    answer: Les fonctions `Fprint*` écrivent dans un `io.Writer`.
  - key: code-reader
    format: code-output
    question: "```go\nfunc compterLignes(r io.Reader) int {\n\ts := bufio.NewScanner(r)\n\tn := 0\n\tfor s.Scan() {\n\t\tn++\n\t}\n\treturn n\n}\n\nfmt.Println(compterLignes(strings.NewReader(\"a\\nb\\nc\\n\")))\n```"
    answer: '`3` : la fonction lit une chaîne comme elle lirait un fichier.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc compterLignes(r io.Reader) int {\n\ts := bufio.NewScanner(r)\n\tn := 0\n\tfor s.Scan() {\n\t\tn++\n\t}\n\treturn n\n}\n\nfunc main() {\n\tfmt.Println(compterLignes(strings.NewReader(\"a\\nb\\nc\\n\")))\n}\n"
      output: '3'
  - key: code-writer
    format: code-output
    question: "```go\nfunc rapport(w io.Writer, n int) {\n\tfmt.Fprintf(w, \"total=%d\", n)\n}\n\nvar b strings.Builder\nrapport(&b, 42)\nfmt.Println(b.String(), b.Len())\n```"
    answer: '`total=42 8` : un `strings.Builder` sert de destination, comme un fichier ou une réponse HTTP.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc rapport(w io.Writer, n int) {\n\tfmt.Fprintf(w, \"total=%d\", n)\n}\n\nfunc main() {\n\tvar b strings.Builder\n\trapport(&b, 42)\n\tfmt.Println(b.String(), b.Len())\n}\n"
      output: total=42 8
  - key: code-stringer
    format: code-output
    question: "```go\ntype Statut int\n\nfunc (s Statut) String() string {\n\treturn [...]string{\"brouillon\", \"publié\"}[s]\n}\n\nfmt.Println(Statut(1), []Statut{0, 1})\n```"
    answer: '`publié [brouillon publié]` : `fmt` utilise `String()`, même dans un slice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Statut int\n\n\nfunc (s Statut) String() string {\n\treturn [...]string{\"brouillon\", \"publié\"}[s]\n}\n\nfunc main() {\n\tfmt.Println(Statut(1), []Statut{0, 1})\n}\n"
      output: publié [brouillon publié]
  - key: code-multi
    format: code-output
    question: |-
      ```go
      var a, b strings.Builder
      w := io.MultiWriter(&a, &b)
      fmt.Fprint(w, "copie")
      fmt.Println(a.String(), b.String())
      ```
    answer: '`copie copie` : `io.MultiWriter` compose des writers comme un seul.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar a, b strings.Builder\n\tw := io.MultiWriter(&a, &b)\n\tfmt.Fprint(w, \"copie\")\n\tfmt.Println(a.String(), b.String())\n}\n"
      output: copie copie
  - key: scenario-conception
    format: scenario
    question: Tu écris une fonction qui exporte des commandes en CSV. Quelle signature choisis-tu, et pourquoi ?
    answer: |-
      `func ExporterCSV(w io.Writer, commandes []Commande) error`. Avec un `io.Writer`, l'appelant choisit la
      destination : un fichier, la réponse HTTP pour un téléchargement, un `gzip.Writer` pour compresser, un
      `bytes.Buffer` dans les tests. La fonction ne s'occupe que du format. J'utilise `encoding/csv` sur ce writer et je
      renvoie l'erreur d'écriture (`w.Error()` après `Flush`).
  - key: scenario-grosse-interface
    format: scenario
    question: Ton équipe a une interface `ClientRepository` de quatorze méthodes, et chaque test doit en implémenter un faux complet. Que proposes-tu ?
    answer: |-
      De découper par usage : chaque consommateur déclare une petite interface avec les deux ou trois méthodes qu'il
      appelle (`type lecteurClients interface{ Trouver(id) (Client, error) }`). Le repository concret reste un seul type
      qui les satisfait toutes implicitement. Les faux de test deviennent minuscules, et l'ajout d'une méthode au
      repository ne casse plus aucune doublure.
  - key: scenario-composer
    format: scenario
    question: Comment compter les octets écrits dans une réponse HTTP sans modifier les handlers ?
    answer: |-
      Avec un middleware qui enveloppe le `http.ResponseWriter` dans un petit type qui l'embarque et redéfinit `Write`
      pour additionner les octets avant de déléguer. Les handlers écrivent dans un `io.Writer` comme d'habitude ; la
      composition par petites interfaces permet d'intercaler ce comportement. On pense à exposer aussi `Flush` si le
      writer d'origine le supporte.
  - key: scenario-lire-tout
    format: scenario
    question: Pourquoi une fonction qui traite un gros fichier devrait-elle accepter un `io.Reader` plutôt qu'un `[]byte` ?
    answer: |-
      Pour traiter les données au fil de l'eau, sans tout charger en mémoire : un fichier de 10 Go se lit par morceaux
      avec un `bufio.Scanner` ou `io.Copy`. Un `[]byte` impose de tout lire d'abord (`io.ReadAll`), ce qui consomme autant
      de mémoire que le fichier. Le Reader permet aussi de brancher une décompression, un déchiffrement ou un comptage
      de progression en chaînant des readers.
