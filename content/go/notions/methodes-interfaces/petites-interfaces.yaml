notion: petites-interfaces
lesson: |-
  Go préfère les **petites interfaces**, souvent d'**une seule méthode** : « plus l'interface est grande, plus
  l'abstraction est faible » (proverbe Go).

  Les plus importantes de la bibliothèque standard :

  | Interface | Méthode | Exemples d'implémentations |
  |---|---|---|
  | `io.Reader` | `Read(p []byte) (n int, err error)` | fichiers, connexions, `strings.Reader`, corps HTTP |
  | `io.Writer` | `Write(p []byte) (n int, err error)` | fichiers, `bytes.Buffer`, `http.ResponseWriter`, hash |
  | `io.Closer` | `Close() error` | fichiers, connexions |
  | `fmt.Stringer` | `String() string` | tout type à afficher |
  | `error` | `Error() string` | toutes les erreurs |
  | `sort.Interface` | `Len`, `Less`, `Swap` | collections triables |
  | `http.Handler` | `ServeHTTP(w, r)` | tout handler HTTP |

  Elles se **composent** : `io.ReadWriter`, `io.ReadCloser`. Une fonction qui accepte un `io.Reader` lit indifféremment
  un fichier, une chaîne, une archive, une requête réseau, et se teste avec `strings.NewReader("...")`.

  Le **nommage** : une interface d'une méthode prend le nom de la méthode suivi de `-er` (`Reader`, `Writer`,
  `Stringer`, `Notifieur`).

  **Piège classique** : une interface `Repository` de quinze méthodes que chaque consommateur n'utilise qu'à moitié. Les
  tests doivent tout doubler, et ajouter une méthode casse toutes les implémentations.

  **En entretien** : « Des interfaces d'une ou deux méthodes, nommées en -er, composables ; io.Reader et io.Writer
  permettent de brancher fichiers, réseau et tests sans changer le code. »
tour:
  - title: Les petites interfaces
    text: |-
      La bibliothèque standard repose sur des interfaces d'**une seule méthode** :

      - `fmt.Stringer`, avec `String() string`, que `fmt` appelle pour afficher une valeur ;
      - `io.Reader`, avec `Read(p []byte) (n int, err error)` : une source d'octets ;
      - `io.Writer`, avec `Write(p []byte) (n int, err error)` : une destination.

      Une petite interface est facile à satisfaire, et se combine : `io.ReadWriter` réunit les deux dernières. Un
      proverbe Go le dit : *plus l'interface est grande, plus l'abstraction est faible*.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"io"
          	"os"
          	"strings"
          )

          type Temperature float64

          func (t Temperature) String() string {
          	return fmt.Sprintf("%.1f °C", float64(t))
          }

          func main() {
          	fmt.Println(Temperature(21.456))

          	var source io.Reader = strings.NewReader("copié d'un io.Reader vers un io.Writer\n")
          	var destination io.Writer = os.Stdout
          	io.Copy(destination, source)
          }
      output: |-
        21.5 °C
        copié d'un io.Reader vers un io.Writer
    task:
      instructions: |-
        Donne à `Point` une méthode `String` pour que `fmt.Println` l'affiche sous la forme `(1, 2)`.
      starter:
        main.go: |-
          package main

          import "fmt"

          type Point struct{ X, Y int }

          func main() {
          	fmt.Println(Point{1, 2})
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          type Point struct{ X, Y int }

          func (p Point) String() string {
          	return fmt.Sprintf("(%d, %d)", p.X, p.Y)
          }

          func main() {
          	fmt.Println(Point{1, 2})
          }
      output: |-
        (1, 2)
cards:
  - key: interfaces-petites
    format: course
    question: "Pourquoi préférer de petites interfaces en Go ?"
    choices:
      - {text: "Plus faciles à implémenter, à composer et à doubler ; une grosse interface abstrait mal", correct: true}
      - {text: "Le compilateur limite une interface à trois méthodes au plus", correct: false}
      - {text: "Un appel sur une petite interface est toujours inliné, donc gratuit", correct: false}
      - {text: "Une petite interface s'implémente par héritage, une grosse non", correct: false}
    answer: "Plus faciles à implémenter, composer et mocker ; une grosse interface est une abstraction faible. Le compilateur n'impose aucune taille : c'est une règle de conception."
  - key: nommer-interface-methode
    format: course
    question: "Une interface n'a qu'une méthode, `Notify`. Comment la nommer selon la convention Go ?"
    choices:
      - {text: "`Notifier`, le nom de la méthode suivi de « -er »", correct: true}
      - {text: "`INotify`, avec le préfixe `I` des interfaces", correct: false}
      - {text: "`NotifyInterface`, avec le suffixe `Interface`", correct: false}
      - {text: "`Notifiable`, avec le suffixe « -able » de Java", correct: false}
    answer: "Avec le suffixe « -er » : `Reader`, `Writer`, `Notifier`. Ni préfixe `I` ni suffixe `Interface`, des habitudes d'autres langages."
  - key: nommage
    format: course
    question: Comment nomme-t-on une interface d'une seule méthode ?
    choices:
      - {text: "Le nom de la méthode suivi de « -er » : `Read` donne `Reader`", correct: true}
      - {text: "Le nom du type qui l'implémente, suivi de `Interface`", correct: false}
      - {text: "Le préfixe `I` suivi du nom de la méthode : `IRead`", correct: false}
      - {text: "Le nom de la méthode suivi de « -able » : `Readable`", correct: false}
    answer: 'Avec le nom de la méthode suivi de « -er » : `Read` → `Reader`, `Write` → `Writer`, `String` → `Stringer`.'
  - key: tester
    format: course
    question: Comment tester une fonction qui lit un `io.Reader` sans créer de fichier ?
    choices:
      - {text: "En lui passant `strings.NewReader(\"contenu\")` ou un `bytes.Buffer`", correct: true}
      - {text: "En lui passant directement une `string`, qui est déjà un `io.Reader`", correct: false}
      - {text: "En lui passant `io.Reader(donnees)`, un `[]byte` converti", correct: false}
      - {text: "En lui passant `os.Stdin`, que le framework de test remplit", correct: false}
    answer: "En lui passant `strings.NewReader(\"contenu\")` ou un `bytes.Buffer`. Une `string` ou un `[]byte` n'ont pas de méthode `Read` : ce ne sont pas des `io.Reader`."
  - key: vf-proverbe
    format: true-false
    question: Selon un proverbe Go, plus une interface est grande, plus l'abstraction est faible.
    truth: true
    answer: « The bigger the interface, the weaker the abstraction. »
  - key: vf-composition
    format: true-false
    question: '`io.ReadCloser` est composée de `io.Reader` et `io.Closer`.'
    truth: true
    answer: Les interfaces s'embarquent les unes dans les autres.
  - key: vf-response-writer
    format: true-false
    question: '`http.ResponseWriter` implémente `io.Writer`.'
    truth: true
    answer: On peut donc écrire une réponse avec `fmt.Fprintf(w, ...)` ou `io.Copy(w, src)`.
  - key: vf-grande
    format: true-false
    question: Une interface de quinze méthodes facilite l'écriture des doublures de test.
    truth: false
    answer: Chaque doublure doit implémenter les quinze ; de petites interfaces côté consommateur sont plus simples.
  - key: qcm-implementations
    format: multiple-choice
    question: "Lequel de ces types implémente `io.Writer` ?"
    choices:
      - {text: "`*bytes.Buffer`", correct: true}
      - {text: "`string`", correct: false}
      - {text: "`[]byte`", correct: false}
      - {text: "`bytes.Buffer`", correct: false}
    answer: "`*bytes.Buffer` a une méthode `Write`, comme `*os.File`. Une chaîne et un slice n'en ont pas ; et `Write` étant déclarée sur le pointeur, une valeur `bytes.Buffer` ne suffit pas."
  - key: qcm-signature
    format: multiple-choice
    question: Quelle est la signature de la méthode de `io.Reader` ?
    choices:
      - text: '`Read(p []byte) (n int, err error)`'
        correct: true
      - text: '`Read() ([]byte, error)`'
        correct: false
      - text: '`Read(n int) []byte`'
        correct: false
      - text: '`Read(p []byte) error`'
        correct: false
    answer: L'appelant fournit le tampon ; Read y écrit et dit combien d'octets.
  - key: qcm-avantage
    format: multiple-choice
    question: "Quel est le principal intérêt d'écrire `func Compter(r io.Reader) (int, error)` plutôt que `func Compter(chemin string)` ?"
    choices:
      - {text: "La fonction marche sur toute source : fichier, requête HTTP, chaîne, archive", correct: true}
      - {text: "La fonction est forcément plus rapide qu'en ouvrant le fichier elle-même", correct: false}
      - {text: "La fonction gère les erreurs de lecture à la place de son appelant", correct: false}
      - {text: "La fonction peut modifier le contenu de la source qu'elle lit", correct: false}
    answer: "Elle ne dépend plus de l'origine des données : elle lit un fichier, une requête ou une archive, et se teste sans fichier avec `strings.NewReader`."
  - key: qcm-noms
    format: multiple-choice
    question: Quel nom donner à une interface `Notifier(msg string) error` ?
    choices:
      - text: '`Notifieur`'
        correct: true
      - text: '`INotification`'
        correct: false
      - text: '`NotificationInterface`'
        correct: false
      - text: '`AbstractNotifier`'
        correct: false
    answer: Ni préfixe `I` ni suffixe `Interface` en Go.
  - key: trous-reader
    format: fill-in
    question: |-
      Complète pour accepter toute source de données :
      ```go
      func Compter(r io.___) (int, error) { ... }
      ```
    blanks:
      - - Reader
    answer: '`io.Reader` couvre fichiers, réseau et chaînes.'
  - key: trous-test
    format: fill-in
    question: |-
      Complète le test sans fichier :
      ```go
      n, err := Compter(strings.___("a\nb\n"))
      ```
    blanks:
      - - NewReader
    answer: '`strings.NewReader` est un `io.Reader` sur une chaîne.'
  - key: trous-stringer
    format: fill-in
    question: |-
      Complète l'interface de `fmt` pour l'affichage :
      ```go
      type Stringer interface {
      	___() string
      }
      ```
    blanks:
      - - String
    answer: '`fmt` appelle `String()` quand elle existe.'
  - key: trous-fprintf
    format: fill-in
    question: |-
      Complète pour écrire dans n'importe quel `io.Writer` :
      ```go
      fmt.___(w, "total : %d\n", total)
      ```
    blanks:
      - - Fprintf
    answer: Les fonctions `Fprint*` écrivent dans un `io.Writer`.
  - key: code-reader
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func compterLignes(r io.Reader) int {
      	s := bufio.NewScanner(r)
      	n := 0
      	for s.Scan() {
      		n++
      	}
      	return n
      }

      fmt.Println(compterLignes(strings.NewReader("a\nb\nc\n")))
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`0`", correct: false}
    answer: '`3` : la fonction lit une chaîne comme elle lirait un fichier.'
    check:
      code: "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc compterLignes(r io.Reader) int {\n\ts := bufio.NewScanner(r)\n\tn := 0\n\tfor s.Scan() {\n\t\tn++\n\t}\n\treturn n\n}\n\nfunc main() {\n\tfmt.Println(compterLignes(strings.NewReader(\"a\\nb\\nc\\n\")))\n}\n"
      output: '3'
  - key: code-writer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func rapport(w io.Writer, n int) {
      	fmt.Fprintf(w, "total=%d", n)
      }

      var b strings.Builder
      rapport(&b, 42)
      fmt.Println(b.String(), b.Len())
      ```
    choices:
      - {text: "`total=42 8`", correct: true}
      - {text: "`total=42 0`", correct: false}
      - {text: "`total=42 2`", correct: false}
      - {text: "Ça ne compile pas : `&b` n'est pas un `io.Writer`", correct: false}
    answer: '`total=42 8` : un `strings.Builder` sert de destination, comme un fichier ou une réponse HTTP.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc rapport(w io.Writer, n int) {\n\tfmt.Fprintf(w, \"total=%d\", n)\n}\n\nfunc main() {\n\tvar b strings.Builder\n\trapport(&b, 42)\n\tfmt.Println(b.String(), b.Len())\n}\n"
      output: total=42 8
  - key: code-stringer
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Statut int

      func (s Statut) String() string {
      	return [...]string{"brouillon", "publié"}[s]
      }

      fmt.Println(Statut(1), []Statut{0, 1})
      ```
    choices:
      - {text: "`publié [brouillon publié]`", correct: true}
      - {text: "`1 [0 1]`", correct: false}
      - {text: "`publié [0 1]`", correct: false}
      - {text: "`1 [brouillon publié]`", correct: false}
    answer: '`publié [brouillon publié]` : `fmt` utilise `String()`, même dans un slice.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Statut int\n\n\nfunc (s Statut) String() string {\n\treturn [...]string{\"brouillon\", \"publié\"}[s]\n}\n\nfunc main() {\n\tfmt.Println(Statut(1), []Statut{0, 1})\n}\n"
      output: publié [brouillon publié]
  - key: code-multi
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var a, b strings.Builder
      w := io.MultiWriter(&a, &b)
      fmt.Fprint(w, "copie")
      fmt.Println(a.String(), b.String())
      ```
    choices:
      - {text: "`copie copie`", correct: true}
      - {text: "`copie`", correct: false}
      - {text: "`copiecopie`", correct: false}
      - {text: "Ça ne compile pas : `&a` n'est pas un `io.Writer`", correct: false}
    answer: '`copie copie` : `io.MultiWriter` compose des writers comme un seul.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar a, b strings.Builder\n\tw := io.MultiWriter(&a, &b)\n\tfmt.Fprint(w, \"copie\")\n\tfmt.Println(a.String(), b.String())\n}\n"
      output: copie copie
  - key: scenario-conception
    format: scenario
    question: Tu écris une fonction qui exporte des commandes en CSV. Quelle signature choisis-tu, et pourquoi ?
    choices:
      - {text: "`func ExporterCSV(w io.Writer, commandes []Commande) error` : l'appelant choisit la destination", correct: true}
      - {text: "`func ExporterCSV(chemin string, commandes []Commande) error` : la fonction crée le fichier", correct: false}
      - {text: "`func ExporterCSV(commandes []Commande) string` : l'appelant écrit la chaîne où il veut", correct: false}
      - {text: "`func ExporterCSV(f *os.File, commandes []Commande) error` : un fichier ouvert par l'appelant", correct: false}
    answer: |-
      `func ExporterCSV(w io.Writer, commandes []Commande) error`. Avec un `io.Writer`, l'appelant choisit la
      destination : un fichier, la réponse HTTP pour un téléchargement, un `gzip.Writer` pour compresser, un
      `bytes.Buffer` dans les tests. La fonction ne s'occupe que du format. J'utilise `encoding/csv` sur ce writer et je
      renvoie l'erreur d'écriture (`w.Error()` après `Flush`).
  - key: scenario-grosse-interface
    format: scenario
    question: Ton équipe a une interface `ClientRepository` de quatorze méthodes, et chaque test doit en implémenter un faux complet. Que proposes-tu ?
    choices:
      - {text: "Chaque consommateur déclare la petite interface des deux ou trois méthodes qu'il appelle", correct: true}
      - {text: "Générer les faux complets avec un outil de mock, pour ne plus les écrire à la main", correct: false}
      - {text: "Écrire un seul faux complet, partagé par tous les tests du projet, une fois pour toutes", correct: false}
      - {text: "Supprimer l'interface et tester chaque consommateur contre une vraie base de données", correct: false}
    answer: |-
      De découper par usage : chaque consommateur déclare une petite interface avec les deux ou trois méthodes qu'il
      appelle (`type lecteurClients interface{ Trouver(id) (Client, error) }`). Le repository concret reste un seul type
      qui les satisfait toutes implicitement. Les faux de test deviennent minuscules, et l'ajout d'une méthode au
      repository ne casse plus aucune doublure.
  - key: scenario-composer
    format: scenario
    question: Comment compter les octets écrits dans une réponse HTTP sans modifier les handlers ?
    choices:
      - {text: "Un middleware enveloppe le `ResponseWriter` dans un type qui l'embarque et redéfinit `Write`", correct: true}
      - {text: "Un middleware lit `r.ContentLength` une fois le handler terminé, et le journalise", correct: false}
      - {text: "Un compteur global, incrémenté par chaque handler juste avant de répondre", correct: false}
      - {text: "L'option `CountBytes` du `http.Server`, qui mesure la taille de chaque réponse", correct: false}
    answer: |-
      Avec un middleware qui enveloppe le `http.ResponseWriter` dans un petit type qui l'embarque et redéfinit `Write`
      pour additionner les octets avant de déléguer. Les handlers écrivent dans un `io.Writer` comme d'habitude ; la
      composition par petites interfaces permet d'intercaler ce comportement. On pense à exposer aussi `Flush` si le
      writer d'origine le supporte.
  - key: scenario-lire-tout
    format: scenario
    question: Pourquoi une fonction qui traite un gros fichier devrait-elle accepter un `io.Reader` plutôt qu'un `[]byte` ?
    choices:
      - {text: "Pour traiter les données au fil de l'eau, sans charger tout le fichier en mémoire", correct: true}
      - {text: "Parce qu'un `[]byte` est limité à 4 Go par la taille maximale des slices", correct: false}
      - {text: "Parce qu'un `io.Reader` lit le fichier plus vite que `os.ReadFile`", correct: false}
      - {text: "Parce qu'un `[]byte` passé à une fonction est recopié en entier", correct: false}
    answer: |-
      Pour traiter les données au fil de l'eau, sans tout charger en mémoire : un fichier de 10 Go se lit par morceaux
      avec un `bufio.Scanner` ou `io.Copy`. Un `[]byte` impose de tout lire d'abord (`io.ReadAll`), ce qui consomme autant
      de mémoire que le fichier. Le Reader permet aussi de brancher une décompression, un déchiffrement ou un comptage
      de progression en chaînant des readers.
