notion: pointeurs-bases
lesson: |-
  Un **pointeur** contient l'adresse d'une valeur. `&x` prend l'adresse de `x`, `*p` lit ou écrit la valeur pointée.

  ```go
  x := 10
  p := &x      // p est un *int
  *p = 20      // x vaut maintenant 20
  fmt.Println(x, *p, p != nil)

  var q *int   // valeur zéro : nil
  fmt.Println(*q) // panic: invalid memory address or nil pointer dereference
  ```

  - Le type d'un pointeur vers `T` est `*T`. Sa valeur zéro est **nil**.
  - **Pas d'arithmétique de pointeurs** : `p++` ne compile pas (sauf avec `unsafe`). C'est ce qui rend Go sûr en mémoire.
  - On peut **renvoyer l'adresse d'une variable locale** : le compilateur la place sur le tas si elle survit à la
    fonction (analyse d'échappement). Pas de pointeur « pendant » comme en C.
  - Pour une struct, l'accès aux champs se fait directement : `p.Nom` (Go déréférence tout seul).
  - Deux pointeurs se comparent par **adresse**.

  Pourquoi un pointeur : permettre à une fonction de **modifier** la valeur de l'appelant, éviter de copier une **grosse**
  struct, ou représenter une valeur **optionnelle** (`*int` nil pour « absent »).

  **Piège classique** : déréférencer un pointeur sans vérifier qu'il n'est pas nil, souvent un champ de struct jamais
  initialisé ou le résultat d'une recherche qui n'a rien trouvé.

  **En entretien** : « & pour l'adresse, * pour la valeur ; nil par défaut ; pas d'arithmétique ; on peut renvoyer
  l'adresse d'une locale grâce à l'analyse d'échappement. »
cards:
  - key: arithmetique-pointeurs
    format: course
    question: Go a-t-il de l'arithmétique de pointeurs ?
    answer: Non, sauf via le package unsafe.
  - key: passe-dereferencant-pointeur-nil
    format: course
    question: Que se passe-t-il en déréférençant un pointeur nil ?
    answer: Un panic à l'exécution.
  - key: adresse-locale
    format: course
    question: Peut-on renvoyer l'adresse d'une variable locale en Go ?
    answer: 'Oui : l''analyse d''échappement place la variable sur le tas si elle survit à la fonction ; le pointeur reste valide.'
  - key: optionnel
    format: course
    question: Pourquoi utiliser un `*int` plutôt qu'un `int` dans une struct ?
    answer: Pour distinguer « absent » (nil) de « zéro », ou pour que plusieurs parties du code partagent et modifient la même valeur.
  - key: vf-arithmetique
    format: true-false
    question: '`p++` sur un pointeur avance à l''élément suivant, comme en C.'
    truth: false
    answer: Go n'a pas d'arithmétique de pointeurs (hors `unsafe`).
  - key: vf-nil
    format: true-false
    question: La valeur zéro d'un pointeur est nil.
    truth: true
    answer: Le déréférencer panique.
  - key: vf-locale
    format: true-false
    question: Renvoyer `&x` d'une variable locale `x` crée un pointeur invalide après le retour.
    truth: false
    answer: Le compilateur alloue `x` sur le tas quand son adresse s'échappe.
  - key: vf-comparaison
    format: true-false
    question: Deux pointeurs vers deux variables distinctes de même valeur sont égaux avec `==`.
    truth: false
    answer: Les pointeurs se comparent par adresse.
  - key: qcm-operateurs
    format: multiple-choice
    question: Avec `x := 5` et `p := &x`, qu'est-ce qui est vrai ?
    choices:
      - text: '`*p` vaut 5'
        correct: true
      - text: '`*p = 7` change `x` en 7'
        correct: true
      - text: '`p` vaut 5'
        correct: false
      - text: '`&p` est l''adresse de x'
        correct: false
    answer: '`&p` est l''adresse du pointeur lui-même.'
  - key: qcm-pourquoi
    format: multiple-choice
    question: Pourquoi passer un pointeur à une fonction ?
    choices:
      - text: Pour qu'elle modifie la valeur de l'appelant
        correct: true
      - text: Pour éviter de copier une grosse struct
        correct: true
      - text: Pour que la fonction s'exécute plus vite dans tous les cas
        correct: false
      - text: Parce que Go passe tout par référence
        correct: false
    answer: Go passe tout par valeur ; un pointeur partage la valeur pointée.
  - key: qcm-panique
    format: multiple-choice
    question: Lesquelles paniquent si `p` est un `*Client` nil ?
    choices:
      - text: '`p.Nom`'
        correct: true
      - text: '`*p`'
        correct: true
      - text: '`p == nil`'
        correct: false
      - text: '`fmt.Println(p)`'
        correct: false
    answer: Comparer ou afficher un pointeur nil est sans danger ; lire à travers lui panique.
  - key: qcm-type
    format: multiple-choice
    question: Quel est le type de `&Client{}` ?
    choices:
      - text: '`*Client`'
        correct: true
      - text: '`&Client`'
        correct: false
      - text: '`Client`'
        correct: false
      - text: '`ref Client`'
        correct: false
    answer: Un pointeur vers `T` a le type `*T`.
  - key: trous-adresse
    format: fill-in
    question: |-
      Complétez pour que la fonction modifie `total` :
      ```go
      ajouter(___total, 5)
      ```
    blanks:
      - - '&'
    answer: On passe l'adresse de la variable.
  - key: trous-dereference
    format: fill-in
    question: "Complétez le corps de la fonction :\n```go\nfunc ajouter(n *int, v int) {\n\t___n += v\n}\n```"
    blanks:
      - - '*'
    answer: '`*n` désigne l''entier pointé.'
  - key: trous-type
    format: fill-in
    question: "Complétez le type d'un âge optionnel :\n```go\ntype Profil struct {\n\tAge ___int\n}\n```"
    blanks:
      - - '*'
    answer: Un pointeur nil représente « non renseigné ».
  - key: trous-nil
    format: fill-in
    question: "Complétez la vérification :\n```go\nif p.Age ___ nil {\n\tfmt.Println(*p.Age)\n}\n```"
    blanks:
      - - '!='
    answer: On déréférence seulement un pointeur non nil.
  - key: code-modifier
    format: code-output
    question: |-
      ```go
      x := 10
      p := &x
      *p = 20
      q := p
      *q++
      fmt.Println(x, *p, p == q)
      ```
    answer: '`21 21 true` : `p` et `q` pointent sur `x`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 10\n\tp := &x\n\t*p = 20\n\tq := p\n\t*q++\n\tfmt.Println(x, *p, p == q)\n}\n"
      output: 21 21 true
  - key: code-locale
    format: code-output
    question: "```go\nfunc nouveau(v int) *int {\n\tx := v\n\treturn &x\n}\n\na, b := nouveau(1), nouveau(1)\nfmt.Println(*a, a == b)\n```"
    answer: '`1 false` : chaque appel crée sa propre variable, valide après le retour.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nouveau(v int) *int {\n\tx := v\n\treturn &x\n}\n\nfunc main() {\n\ta, b := nouveau(1), nouveau(1)\n\tfmt.Println(*a, a == b)\n}\n"
      output: 1 false
  - key: code-nil
    format: code-output
    question: |-
      ```go
      var p *int
      fmt.Println(p == nil, p)
      fmt.Println(*p)
      ```
    answer: '`true <nil>`, puis une panique : déréférencer un pointeur nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar p *int\n\tfmt.Println(p == nil, p)\n\tfmt.Println(*p)\n}\n"
      output: true <nil>
      panics: nil pointer dereference
  - key: code-fonction
    format: code-output
    question: |-
      ```go
      func doubler(n *int) { *n *= 2 }

      v := 4
      doubler(&v)
      doubler(&v)
      fmt.Println(v)
      ```
    answer: '`16` : la fonction modifie la variable de l''appelant à travers son adresse.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc doubler(n *int) { *n *= 2 }\n\nfunc main() {\n\tv := 4\n\tdoubler(&v)\n\tdoubler(&v)\n\tfmt.Println(v)\n}\n"
      output: '16'
  - key: bug-nil
    format: bug-fix
    question: |-
      Le service panique quand un client n'a pas d'adresse :
      ```go
      fmt.Println(client.Adresse.Ville) // Adresse est un *Adresse
      ```
    answer: "```go\nif client.Adresse != nil {\n\tfmt.Println(client.Adresse.Ville)\n}\n```\nUn champ pointeur peut être nil : on le vérifie avant de lire à travers lui."
  - key: bug-copie
    format: bug-fix
    question: |-
      La remise n'est jamais appliquée :
      ```go
      func appliquerRemise(total int, pct int) { total -= total * pct / 100 }

      appliquerRemise(montant, 10)
      ```
    answer: |-
      ```go
      func appliquerRemise(total *int, pct int) { *total -= *total * pct / 100 }

      appliquerRemise(&montant, 10)
      // ou plus simple : montant = avecRemise(montant, 10)
      ```
      La fonction modifiait sa copie ; un pointeur (ou une valeur de retour) transmet le résultat.
  - key: bug-recherche
    format: bug-fix
    question: |-
      Ce code panique quand le produit est introuvable :
      ```go
      p := trouver(catalogue, ref) // renvoie *Produit, nil si absent
      fmt.Println(p.Prix)
      ```
    answer: "```go\np := trouver(catalogue, ref)\nif p == nil {\n\treturn fmt.Errorf(\"produit %s introuvable\", ref)\n}\nfmt.Println(p.Prix)\n```\nUne fonction qui renvoie nil pour « absent » oblige l'appelant à le tester ; renvoyer `(*Produit, bool)` ou une\nerreur rend ce contrat plus visible."
  - key: bug-pointeur-boucle
    format: bug-fix
    question: "Après la boucle, le pointeur « meilleur » désigne un article qui ne fait pas partie du slice :\n```go\nvar meilleur *Article\nfor _, a := range articles {\n\tif meilleur == nil || a.Note > meilleur.Note {\n\t\tmeilleur = &a\n\t}\n}\n```"
    answer: "```go\nfor i := range articles {\n\tif meilleur == nil || articles[i].Note > meilleur.Note {\n\t\tmeilleur = &articles[i]\n\t}\n}\n```\n`&a` est l'adresse de la copie de l'itération ; `&articles[i]` désigne l'élément du slice."
