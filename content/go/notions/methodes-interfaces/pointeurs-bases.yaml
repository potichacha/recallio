notion: pointeurs-bases
lesson: |-
  Un **pointeur** contient l'adresse d'une valeur. `&x` prend l'adresse de `x`, `*p` lit ou écrit la valeur pointée.

  ```go
  x := 10
  p := &x      // p est un *int
  *p = 20      // x vaut maintenant 20
  fmt.Println(x, *p, p != nil)

  var q *int   // valeur zéro : nil
  fmt.Println(*q) // panic: invalid memory address or nil pointer dereference
  ```

  - Le type d'un pointeur vers `T` est `*T`. Sa valeur zéro est **nil**.
  - **Pas d'arithmétique de pointeurs** : `p++` ne compile pas (sauf avec `unsafe`). C'est ce qui rend Go sûr en mémoire.
  - On peut **renvoyer l'adresse d'une variable locale** : le compilateur la place sur le tas si elle survit à la
    fonction (analyse d'échappement). Pas de pointeur « pendant » comme en C.
  - Pour une struct, l'accès aux champs se fait directement : `p.Nom` (Go déréférence tout seul).
  - Deux pointeurs se comparent par **adresse**.

  Pourquoi un pointeur : permettre à une fonction de **modifier** la valeur de l'appelant, éviter de copier une **grosse**
  struct, ou représenter une valeur **optionnelle** (`*int` nil pour « absent »).

  **Piège classique** : déréférencer un pointeur sans vérifier qu'il n'est pas nil, souvent un champ de struct jamais
  initialisé ou le résultat d'une recherche qui n'a rien trouvé.

  **En entretien** : « & pour l'adresse, * pour la valeur ; nil par défaut ; pas d'arithmétique ; on peut renvoyer
  l'adresse d'une locale grâce à l'analyse d'échappement. »
tour:
  - title: Les pointeurs
    text: |-
      Un **pointeur** contient l'adresse d'une variable. `&x` donne l'adresse de `x`, de type `*int` si `x` est un
      `int` ; `*p` lit ou écrit la variable pointée.

      Comme les arguments sont passés par valeur, une fonction qui doit modifier une variable de l'appelant reçoit un
      pointeur. Go n'a pas d'arithmétique de pointeurs, et le ramasse-miettes libère la mémoire : une fonction peut
      renvoyer l'adresse d'une de ses variables sans risque.

      Sur un pointeur de struct, `pt.X` suffit : Go déréférence tout seul. La valeur zéro d'un pointeur est `nil`, et
      déréférencer un pointeur `nil` provoque une panic.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func double(n *int) {
          	*n *= 2
          }

          type Point struct{ X, Y int }

          func main() {
          	x := 21
          	p := &x
          	double(p)
          	fmt.Println(x, *p, p != nil)

          	pt := &Point{1, 2}
          	pt.X = 10
          	fmt.Println(*pt)

          	var vide *Point
          	fmt.Println(vide == nil)
          }
      output: |-
        42 42 true
        {10 2}
        true
    task:
      instructions: |-
        Écris le corps de `echange`, qui échange les valeurs de deux variables par leurs pointeurs : le programme doit
        afficher `2 1`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func echange(a, b *int) {
          }

          func main() {
          	x, y := 1, 2
          	echange(&x, &y)
          	fmt.Println(x, y)
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func echange(a, b *int) {
          	*a, *b = *b, *a
          }

          func main() {
          	x, y := 1, 2
          	echange(&x, &y)
          	fmt.Println(x, y)
          }
      output: |-
        2 1
cards:
  - key: arithmetique-pointeurs
    format: course
    question: Go a-t-il de l'arithmétique de pointeurs ?
    choices:
      - {text: "Non, sauf à passer par le package `unsafe`", correct: true}
      - {text: "Oui, comme en C : `p + 1` désigne l'élément suivant", correct: false}
      - {text: "Oui, mais seulement sur des pointeurs vers des tableaux", correct: false}
      - {text: "Non, et même `unsafe` ne permet pas de calculer une adresse", correct: false}
    answer: "Non, sauf via le package `unsafe` : `p + 1` ne compile pas. C'est un choix de sûreté."
  - key: passe-dereferencant-pointeur-nil
    format: course
    question: Que se passe-t-il en déréférençant un pointeur nil ?
    choices:
      - {text: "Une panic à l'exécution : nil pointer dereference", correct: true}
      - {text: "On lit la valeur zéro du type pointé", correct: false}
      - {text: "Une erreur à la compilation du programme", correct: false}
      - {text: "Un comportement indéfini, comme en C", correct: false}
    answer: "Une panique à l'exécution (invalid memory address or nil pointer dereference). Le compilateur ne la détecte pas, et ce n'est pas un comportement indéfini comme en C : le programme s'arrête."
  - key: adresse-locale
    format: course
    question: Peut-on renvoyer l'adresse d'une variable locale en Go ?
    choices:
      - {text: "Oui : la variable échappe sur le tas, et le pointeur reste valide", correct: true}
      - {text: "Non : la variable est détruite au retour, et le pointeur pend", correct: false}
      - {text: "Oui, mais seulement si la variable a été créée avec `new`", correct: false}
      - {text: "Non : le compilateur refuse de renvoyer `&x` pour une locale", correct: false}
    answer: 'Oui : l''analyse d''échappement place la variable sur le tas si elle survit à la fonction ; le pointeur reste valide.'
  - key: optionnel
    format: course
    question: Pourquoi utiliser un `*int` plutôt qu'un `int` dans une struct ?
    choices:
      - {text: "Pour distinguer « absent » (nil) de zéro, ou partager une même valeur", correct: true}
      - {text: "Pour économiser de la mémoire, un pointeur étant plus petit qu'un `int`", correct: false}
      - {text: "Pour que le champ démarre à 0 plutôt qu'à une valeur aléatoire", correct: false}
      - {text: "Pour rendre le champ immuable une fois la struct construite", correct: false}
    answer: Pour distinguer « absent » (nil) de « zéro », ou pour que plusieurs parties du code partagent et modifient la même valeur.
  - key: vf-arithmetique
    format: true-false
    question: '`p++` sur un pointeur avance à l''élément suivant, comme en C.'
    truth: false
    answer: Go n'a pas d'arithmétique de pointeurs (hors `unsafe`).
  - key: vf-nil
    format: true-false
    question: La valeur zéro d'un pointeur est nil.
    truth: true
    answer: Le déréférencer panique.
  - key: vf-locale
    format: true-false
    question: Renvoyer `&x` d'une variable locale `x` crée un pointeur invalide après le retour.
    truth: false
    answer: Le compilateur alloue `x` sur le tas quand son adresse s'échappe.
  - key: vf-comparaison
    format: true-false
    question: Deux pointeurs vers deux variables distinctes de même valeur sont égaux avec `==`.
    truth: false
    answer: Les pointeurs se comparent par adresse.
  - key: qcm-operateurs
    format: multiple-choice
    question: "Avec `x := 5` et `p := &x`, laquelle de ces affirmations est vraie ?"
    choices:
      - {text: "`*p = 7` change `x` en 7", correct: true}
      - {text: "`p` vaut 5", correct: false}
      - {text: "`&p` est l'adresse de `x`", correct: false}
      - {text: "`*p = 7` change `p`, mais pas `x`", correct: false}
    answer: "`*p` désigne `x` : y écrire change `x` (et `*p` vaut 5 avant). `p` contient l'adresse de `x`, et `&p` est l'adresse du pointeur lui-même."
  - key: qcm-pourquoi
    format: multiple-choice
    question: "Quelle est la raison la plus courante de passer un pointeur à une fonction ?"
    choices:
      - {text: "Pour qu'elle modifie la valeur de l'appelant", correct: true}
      - {text: "Pour qu'elle s'exécute plus vite dans tous les cas", correct: false}
      - {text: "Parce que Go passe tout par référence par défaut", correct: false}
      - {text: "Pour l'empêcher de modifier la valeur reçue", correct: false}
    answer: "Go passe tout par valeur : un pointeur permet à la fonction de modifier la valeur de l'appelant (ou d'éviter la copie d'une grosse struct). Ce n'est pas toujours plus rapide."
  - key: qcm-panique
    format: multiple-choice
    question: Lesquelles paniquent si `p` est un `*Client` nil ?
    choices:
      - text: '`p.Nom`'
        correct: true
      - text: '`*p`'
        correct: true
      - text: '`p == nil`'
        correct: false
      - text: '`fmt.Println(p)`'
        correct: false
    answer: Comparer ou afficher un pointeur nil est sans danger ; lire à travers lui panique.
  - key: qcm-type
    format: multiple-choice
    question: Quel est le type de `&Client{}` ?
    choices:
      - text: '`*Client`'
        correct: true
      - text: '`&Client`'
        correct: false
      - text: '`Client`'
        correct: false
      - text: '`ref Client`'
        correct: false
    answer: Un pointeur vers `T` a le type `*T`.
  - key: trous-adresse
    format: fill-in
    question: |-
      Complète pour que la fonction modifie `total` :
      ```go
      ajouter(___total, 5)
      ```
    blanks:
      - - '&'
    answer: On passe l'adresse de la variable.
  - key: trous-dereference
    format: fill-in
    question: |-
      Complète le corps de la fonction :
      ```go
      func ajouter(n *int, v int) {
      	___n += v
      }
      ```
    blanks:
      - - '*'
    answer: '`*n` désigne l''entier pointé.'
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type d'un âge optionnel :
      ```go
      type Profil struct {
      	Age ___int
      }
      ```
    blanks:
      - - '*'
    answer: Un pointeur nil représente « non renseigné ».
  - key: trous-nil
    format: fill-in
    question: |-
      Complète la vérification :
      ```go
      if p.Age ___ nil {
      	fmt.Println(*p.Age)
      }
      ```
    blanks:
      - - '!='
    answer: On déréférence seulement un pointeur non nil.
  - key: code-modifier
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      x := 10
      p := &x
      *p = 20
      q := p
      *q++
      fmt.Println(x, *p, p == q)
      ```
    choices:
      - {text: "`21 21 true`", correct: true}
      - {text: "`10 21 true`", correct: false}
      - {text: "`20 21 true`", correct: false}
      - {text: "`21 21 false`", correct: false}
    answer: '`21 21 true` : `p` et `q` pointent sur `x`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tx := 10\n\tp := &x\n\t*p = 20\n\tq := p\n\t*q++\n\tfmt.Println(x, *p, p == q)\n}\n"
      output: 21 21 true
  - key: code-locale
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func nouveau(v int) *int {
      	x := v
      	return &x
      }

      a, b := nouveau(1), nouveau(1)
      fmt.Println(*a, a == b)
      ```
    choices:
      - {text: "`1 false`", correct: true}
      - {text: "`1 true`", correct: false}
      - {text: "Une panic : `x` n'existe plus après le retour", correct: false}
      - {text: "Ça ne compile pas : `&x` d'une variable locale", correct: false}
    answer: '`1 false` : chaque appel crée sa propre variable, valide après le retour.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc nouveau(v int) *int {\n\tx := v\n\treturn &x\n}\n\nfunc main() {\n\ta, b := nouveau(1), nouveau(1)\n\tfmt.Println(*a, a == b)\n}\n"
      output: 1 false
  - key: code-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var p *int
      fmt.Println(p == nil, p)
      fmt.Println(*p)
      ```
    choices:
      - {text: "`true <nil>`, puis une panic : nil pointer dereference", correct: true}
      - {text: "`true <nil>`, puis `0`", correct: false}
      - {text: "`true 0`, puis `0`", correct: false}
      - {text: "Ça ne compile pas : `p` n'est pas initialisé", correct: false}
    answer: '`true <nil>`, puis une panique : déréférencer un pointeur nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar p *int\n\tfmt.Println(p == nil, p)\n\tfmt.Println(*p)\n}\n"
      output: true <nil>
      panics: nil pointer dereference
  - key: code-fonction
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func doubler(n *int) { *n *= 2 }

      v := 4
      doubler(&v)
      doubler(&v)
      fmt.Println(v)
      ```
    choices:
      - {text: "`16`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`8`", correct: false}
      - {text: "`12`", correct: false}
    answer: '`16` : la fonction modifie la variable de l''appelant à travers son adresse.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc doubler(n *int) { *n *= 2 }\n\nfunc main() {\n\tv := 4\n\tdoubler(&v)\n\tdoubler(&v)\n\tfmt.Println(v)\n}\n"
      output: '16'
  - key: bug-nil
    format: bug-fix
    question: |-
      Le service panique quand un client n'a pas d'adresse. Quelle correction est la bonne ?
      ```go
      fmt.Println(client.Adresse.Ville) // Adresse est un *Adresse
      ```
    choices:
      - {text: "Tester `client.Adresse != nil` avant de lire `Ville`", correct: true}
      - {text: "Lire `(*client.Adresse).Ville`, un déréférencement explicite", correct: false}
      - {text: "Lire `client.Adresse.Ville` dans un `defer`, en fin de fonction", correct: false}
      - {text: "Remplacer `client.Adresse.Ville` par `&client.Adresse.Ville`", correct: false}
    answer: "```go\nif client.Adresse != nil {\n\tfmt.Println(client.Adresse.Ville)\n}\n```\nUn champ pointeur peut être nil : on le vérifie avant de lire à travers lui."
  - key: bug-copie
    format: bug-fix
    question: |-
      La remise n'est jamais appliquée. Quelle correction est la bonne ?
      ```go
      func appliquerRemise(total int, pct int) { total -= total * pct / 100 }

      appliquerRemise(montant, 10)
      ```
    choices:
      - {text: "Renvoyer le total remisé, `montant = avecRemise(montant, 10)`, ou passer `&montant`", correct: true}
      - {text: "Déclarer `total` en variable globale, modifiée par la fonction", correct: false}
      - {text: "Écrire `total = total - total*pct/100` au lieu de `-=`", correct: false}
      - {text: "Passer `montant` par référence avec `ref montant`, comme en C#", correct: false}
    answer: |-
      ```go
      func appliquerRemise(total *int, pct int) { *total -= *total * pct / 100 }

      appliquerRemise(&montant, 10)
      // ou plus simple : montant = avecRemise(montant, 10)
      ```
      La fonction modifiait sa copie ; un pointeur (ou une valeur de retour) transmet le résultat.
  - key: bug-recherche
    format: bug-fix
    question: |-
      Ce code panique quand le produit est introuvable. Quelle correction est la bonne ?
      ```go
      p := trouver(catalogue, ref) // renvoie *Produit, nil si absent
      fmt.Println(p.Prix)
      ```
    choices:
      - {text: "Tester `p == nil` et renvoyer une erreur avant de lire `p.Prix`", correct: true}
      - {text: "Lire `(*p).Prix`, qui renvoie 0 quand `p` vaut nil", correct: false}
      - {text: "Entourer la lecture de `p.Prix` d'un `recover()`", correct: false}
      - {text: "Faire renvoyer un `Produit{}` vide à `trouver`, sans rien signaler", correct: false}
    answer: "```go\np := trouver(catalogue, ref)\nif p == nil {\n\treturn fmt.Errorf(\"produit %s introuvable\", ref)\n}\nfmt.Println(p.Prix)\n```\nUne fonction qui renvoie nil pour « absent » oblige l'appelant à le tester ; renvoyer `(*Produit, bool)` ou une\nerreur rend ce contrat plus visible."
  - key: bug-pointeur-boucle
    format: bug-fix
    question: |-
      Après la boucle, le pointeur `meilleur` désigne un article qui ne fait pas partie du slice. Quelle correction est la bonne ?
      ```go
      var meilleur *Article
      for _, a := range articles {
      	if meilleur == nil || a.Note > meilleur.Note {
      		meilleur = &a
      	}
      }
      ```
    choices:
      - {text: "Itérer sur les indices et prendre `&articles[i]`", correct: true}
      - {text: "Passer à Go 1.22, où `&a` désigne l'élément du slice", correct: false}
      - {text: "Copier `a` dans une variable locale, puis prendre son adresse", correct: false}
      - {text: "Prendre `&a` avant la condition, plutôt qu'après", correct: false}
    answer: |-
      ```go
      for i := range articles {
      	if meilleur == nil || articles[i].Note > meilleur.Note {
      		meilleur = &articles[i]
      	}
      }
      ```
      `&a` est l'adresse de la copie de l'itération ; `&articles[i]` désigne l'élément du slice. Depuis Go 1.22, `a` est une nouvelle variable à chaque tour, mais c'est toujours une copie.
