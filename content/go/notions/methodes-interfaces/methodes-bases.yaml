notion: methodes-bases
cards:
  - key: definir-methode-type-autre-package
    format: course
    question: Peut-on définir une méthode sur un type d'un autre package ?
    answer: Non ; il faut définir un type nommé local basé dessus.
  - key: appeler-methode-pointeur-nil
    format: course
    question: Peut-on appeler une méthode sur un pointeur nil ?
    answer: Oui pour une méthode à receveur pointeur, qui peut tester `c == nil`.
