notion: methodes-bases
lesson: |-
  Une **méthode** est une fonction attachée à un type, par un **receveur** déclaré avant son nom :

  ```go
  type Rectangle struct{ L, H float64 }

  func (r Rectangle) Aire() float64 { return r.L * r.H }

  type Celsius float64

  func (c Celsius) Fahrenheit() float64 { return float64(c)*9/5 + 32 }

  r := Rectangle{3, 4}
  r.Aire()         // 12
  Celsius(100).Fahrenheit() // 212
  ```

  - On peut déclarer des méthodes sur **tout type nommé défini dans le même package** : struct, mais aussi
    `type Celsius float64` ou `type Liste []string`.
  - **Pas de méthode sur un type d'un autre package** (ni sur `int` ou `string` directement) : on déclare un type à soi.
  - Le receveur porte un nom **court** (une ou deux lettres : `r`, `c`), le même pour toutes les méthodes du type ; pas
    de `this` ni de `self`.
  - Les méthodes ne se déclarent **pas dans la struct** : elles peuvent être dans n'importe quel fichier du package.
  - Pas de surcharge : deux méthodes du même type ont des noms différents.
  - Une méthode à receveur pointeur peut être appelée sur un **pointeur nil** : à elle de gérer ce cas.

  **Piège classique** : vouloir ajouter une méthode `Inverser` à `string`. Le compilateur refuse (« cannot define new
  methods on non-local type string ») ; on écrit une fonction, ou l'on définit `type MonTexte string`.

  **En entretien** : « Une fonction avec un receveur, sur tout type nommé du package ; pas sur les types d'un autre
  package ; un nom de receveur court et constant, pas de this. »
tour:
  - title: Les méthodes
    text: |-
      Go n'a pas de classes, mais on déclare des **méthodes** sur n'importe quel type nommé de son package : une struct,
      mais aussi un nombre ou une slice. Une méthode est une fonction avec un **receveur**, écrit entre `func` et son
      nom : `func (r Rectangle) Aire() float64`.

      On l'appelle avec un point : `r.Aire()`. Le receveur porte un nom court, souvent la première lettre du type,
      jamais `this` ni `self`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Rectangle struct {
          	Largeur, Hauteur float64
          }

          func (r Rectangle) Aire() float64 {
          	return r.Largeur * r.Hauteur
          }

          type Celsius float64

          func (c Celsius) Fahrenheit() float64 {
          	return float64(c)*9/5 + 32
          }

          func main() {
          	r := Rectangle{Largeur: 3, Hauteur: 4}
          	fmt.Println(r.Aire())
          	fmt.Println(Celsius(100).Fahrenheit())
          }
      output: |-
        12
        212
    task:
      instructions: |-
        Ajoute une méthode `Perimetre` à `Rectangle`, et affiche-la au lieu de l'aire : le programme doit afficher `14`.
      starter:
        main.go: |-
          package main

          import "fmt"

          type Rectangle struct {
          	Largeur, Hauteur float64
          }

          func (r Rectangle) Aire() float64 {
          	return r.Largeur * r.Hauteur
          }

          func main() {
          	r := Rectangle{Largeur: 3, Hauteur: 4}
          	fmt.Println(r.Aire())
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          type Rectangle struct {
          	Largeur, Hauteur float64
          }

          func (r Rectangle) Aire() float64 {
          	return r.Largeur * r.Hauteur
          }

          func (r Rectangle) Perimetre() float64 {
          	return 2 * (r.Largeur + r.Hauteur)
          }

          func main() {
          	r := Rectangle{Largeur: 3, Hauteur: 4}
          	fmt.Println(r.Perimetre())
          }
      output: |-
        14
cards:
  - key: definir-methode-type-autre-package
    format: course
    question: Peut-on définir une méthode sur un type d'un autre package ?
    choices:
      - {text: "Non : on déclare un type nommé local, basé dessus, qui reçoit la méthode", correct: true}
      - {text: "Oui : il suffit d'importer le package du type, comme une extension Kotlin", correct: false}
      - {text: "Oui, à condition que le type et la méthode soient tous deux exportés", correct: false}
      - {text: "Non, sauf pour les types de la bibliothèque standard, comme `time.Time`", correct: false}
    answer: "Non ; il faut définir un type nommé local basé dessus. Go n'a pas de méthodes d'extension."
  - key: appeler-methode-pointeur-nil
    format: course
    question: Peut-on appeler une méthode sur un pointeur nil ?
    choices:
      - {text: "Oui, avec un receveur pointeur : la méthode peut tester `c == nil`", correct: true}
      - {text: "Non : l'appel panique toujours, avant même d'entrer dans la méthode", correct: false}
      - {text: "Oui, mais seulement pour une méthode à receveur valeur", correct: false}
      - {text: "Non : le compilateur refuse tout appel sur un pointeur nil", correct: false}
    answer: "Oui pour une méthode à receveur pointeur, qui peut tester `c == nil`. Avec un receveur valeur, Go doit déréférencer le pointeur pour copier la valeur : là, l'appel panique."
  - key: types-possibles
    format: course
    question: Sur quels types peut-on déclarer une méthode ?
    choices:
      - {text: "Sur tout type nommé du même package : une struct, mais aussi un `float64`, un slice ou une map nommés", correct: true}
      - {text: "Seulement sur les structs déclarées dans le même package que la méthode", correct: false}
      - {text: "Sur n'importe quel type, `string` ou `int` compris, depuis n'importe quel package", correct: false}
      - {text: "Seulement sur les pointeurs vers des structs, jamais sur des valeurs", correct: false}
    answer: 'Sur tout type nommé défini dans le même package : une struct, mais aussi un type défini sur float64, un slice ou une map.'
  - key: nom-receveur
    format: course
    question: Comment nommer le receveur d'une méthode ?
    choices:
      - {text: "Un nom court, souvent l'initiale du type, le même dans toutes ses méthodes", correct: true}
      - {text: "`this`, comme en Java, pour que le code reste familier à tous", correct: false}
      - {text: "`self`, comme en Python, pour bien distinguer le receveur", correct: false}
      - {text: "Le nom du type en minuscules, et un nom différent à chaque méthode", correct: false}
    answer: Par un nom court, souvent l'initiale du type (`c` pour `Client`), le même pour toutes les méthodes ; jamais `this` ou `self`.
  - key: vf-dans-struct
    format: true-false
    question: Les méthodes se déclarent à l'intérieur des accolades de la struct.
    truth: false
    answer: Elles se déclarent à part, avec un receveur, n'importe où dans le package.
  - key: vf-type-non-struct
    format: true-false
    question: On peut déclarer une méthode sur `type Liste []string`.
    truth: true
    answer: Tout type nommé du package peut avoir des méthodes.
  - key: vf-autre-package
    format: true-false
    question: On peut ajouter une méthode à `time.Duration` depuis son propre package.
    truth: false
    answer: On ne peut définir des méthodes que sur ses propres types ; on déclare `type MaDuree time.Duration` ou l'on écrit une fonction.
  - key: vf-nil-receveur
    format: true-false
    question: Appeler une méthode à receveur pointeur sur un pointeur nil panique toujours.
    truth: false
    answer: L'appel a lieu ; ce n'est que si la méthode lit un champ à travers le receveur nil qu'elle panique.
  - key: qcm-valides
    format: multiple-choice
    question: "Dans le package qui déclare `type Celsius float64`, laquelle de ces déclarations de méthode ne compile pas ?"
    choices:
      - {text: "`func (f float64) Arrondi() float64`", correct: true}
      - {text: "`func (c Celsius) String() string`", correct: false}
      - {text: "`func (c *Celsius) Augmenter(d float64)`", correct: false}
      - {text: "`func (c Celsius) Fahrenheit() float64`", correct: false}
    answer: "On ne déclare de méthode que sur un type nommé du package, pas sur `float64`. Sur `Celsius`, les receveurs valeur et pointeur sont permis."
  - key: qcm-surcharge
    format: multiple-choice
    question: Un type peut-il avoir deux méthodes `Aire()` et `Aire(unite string)` ?
    choices:
      - text: Non, pas de surcharge en Go
        correct: true
      - text: Oui, si les signatures diffèrent
        correct: false
      - text: Oui, si l'une a un receveur pointeur
        correct: false
      - text: Oui, dans deux fichiers différents
        correct: false
    answer: Un nom de méthode est unique par type.
  - key: qcm-appel
    format: multiple-choice
    question: "`Fahrenheit` est une méthode de `type Celsius float64`. Laquelle de ces façons de l'appeler sur la valeur 100 compile ?"
    choices:
      - {text: "`Celsius(100).Fahrenheit()`", correct: true}
      - {text: "`100.Fahrenheit()`", correct: false}
      - {text: "`Fahrenheit(100)`", correct: false}
      - {text: "`float64(100).Fahrenheit()`", correct: false}
    answer: "La constante 100 n'a pas le type `Celsius` tant qu'on ne la convertit pas ; `var c Celsius = 100; c.Fahrenheit()` marche aussi."
  - key: qcm-string
    format: multiple-choice
    question: "Laquelle de ces façons d'« ajouter une méthode » au type `string` compile ?"
    choices:
      - {text: "Déclarer `type Texte string` et lui donner la méthode", correct: true}
      - {text: "Déclarer `func (s string) Inverser() string`", correct: false}
      - {text: "Annoter la fonction avec `@Extension(string)`", correct: false}
      - {text: "Déclarer `func string.Inverser() string`", correct: false}
    answer: "Go n'a pas de méthodes d'extension : on déclare un type nommé local, ou l'on écrit simplement une fonction qui prend une `string`."
  - key: trous-receveur
    format: fill-in
    question: |-
      Complète la méthode :
      ```go
      func (___ Rectangle) Aire() float64 { return r.L * r.H }
      ```
    blanks:
      - - r
    answer: Le receveur, nommé court, précède le nom de la méthode.
  - key: trous-type-local
    format: fill-in
    question: |-
      Complète pour pouvoir donner des méthodes à une liste de chaînes :
      ```go
      ___ Etiquettes []string

      func (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }
      ```
    blanks:
      - - type
    answer: On déclare un type nommé local.
  - key: trous-appel
    format: fill-in
    question: |-
      Complète l'appel :
      ```go
      r := Rectangle{3, 4}
      fmt.Println(r___Aire())
      ```
    blanks:
      - - .
    answer: On appelle une méthode avec un point.
  - key: trous-stringer
    format: fill-in
    question: |-
      Complète pour que `fmt` affiche une température lisible :
      ```go
      func (c Celsius) ___() string { return fmt.Sprintf("%.1f°C", float64(c)) }
      ```
    blanks:
      - - String
    answer: '`String() string` implémente `fmt.Stringer`.'
  - key: code-methodes
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Rectangle struct{ L, H float64 }

      func (r Rectangle) Aire() float64      { return r.L * r.H }
      func (r Rectangle) Perimetre() float64 { return 2 * (r.L + r.H) }

      r := Rectangle{3, 4}
      fmt.Println(r.Aire(), r.Perimetre())
      ```
    choices:
      - {text: "`12 14`", correct: true}
      - {text: "`12 7`", correct: false}
      - {text: "`7 14`", correct: false}
      - {text: "`12.0 14.0`", correct: false}
    answer: "`12 14` : chaque méthode lit les champs de son receveur, `3 × 4` et `2 × (3 + 4)`. `Println` affiche un `float64` entier sans décimale."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Rectangle struct{ L, H float64 }\n\n\nfunc (r Rectangle) Aire() float64      { return r.L * r.H }\n\nfunc (r Rectangle) Perimetre() float64 { return 2 * (r.L + r.H) }\n\nfunc main() {\n\tr := Rectangle{3, 4}\n\tfmt.Println(r.Aire(), r.Perimetre())\n}\n"
      output: 12 14
  - key: code-type-slice
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Etiquettes []string

      func (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }

      e := Etiquettes{"go", "web"}
      fmt.Println(e.Contient("go"), e.Contient("java"), len(e))
      ```
    choices:
      - {text: "`true false 2`", correct: true}
      - {text: "`true false 0`", correct: false}
      - {text: "`false false 2`", correct: false}
      - {text: "Ça ne compile pas : `len` ne marche pas sur `Etiquettes`", correct: false}
    answer: '`true false 2` : un type slice nommé garde ses opérations et reçoit des méthodes.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype Etiquettes []string\n\n\nfunc (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }\n\nfunc main() {\n\te := Etiquettes{\"go\", \"web\"}\n\tfmt.Println(e.Contient(\"go\"), e.Contient(\"java\"), len(e))\n}\n"
      output: true false 2
  - key: code-nil-receveur
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Noeud struct {
      	Valeur  int
      	Suivant *Noeud
      }

      func (n *Noeud) Somme() int {
      	if n == nil {
      		return 0
      	}
      	return n.Valeur + n.Suivant.Somme()
      }

      liste := &Noeud{1, &Noeud{2, &Noeud{3, nil}}}
      var vide *Noeud
      fmt.Println(liste.Somme(), vide.Somme())
      ```
    choices:
      - {text: "`6 0`", correct: true}
      - {text: "`3 0`", correct: false}
      - {text: "`1 0`", correct: false}
      - {text: "`6`, puis une panic : nil pointer dereference", correct: false}
    answer: '`6 0` : une méthode à receveur pointeur peut gérer elle-même le receveur nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Noeud struct {\n\tValeur  int\n\tSuivant *Noeud\n}\n\n\nfunc (n *Noeud) Somme() int {\n\tif n == nil {\n\t\treturn 0\n\t}\n\treturn n.Valeur + n.Suivant.Somme()\n}\n\nfunc main() {\n\tliste := &Noeud{1, &Noeud{2, &Noeud{3, nil}}}\n\tvar vide *Noeud\n\tfmt.Println(liste.Somme(), vide.Somme())\n}\n"
      output: 6 0
  - key: code-string-methode
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func (s string) Inverser() string { return s }

      fmt.Println("go".Inverser())
      ```
    choices:
      - {text: "Ça ne compile pas : pas de méthode sur `string`", correct: true}
      - {text: "`go`", correct: false}
      - {text: "`og`", correct: false}
      - {text: "Une panic : `string` n'a pas de méthode `Inverser`", correct: false}
    answer: "Ça ne compile pas : on ne déclare de méthode que sur un type nommé du package, et `string` est un type prédéclaré."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc (s string) Inverser() string { return s }\n\nfunc main() {\n\tfmt.Println(\"go\".Inverser())\n}\n"
      compiles: false
