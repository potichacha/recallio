notion: methodes-bases
lesson: |-
  Une **méthode** est une fonction attachée à un type, par un **receveur** déclaré avant son nom :

  ```go
  type Rectangle struct{ L, H float64 }

  func (r Rectangle) Aire() float64 { return r.L * r.H }

  type Celsius float64

  func (c Celsius) Fahrenheit() float64 { return float64(c)*9/5 + 32 }

  r := Rectangle{3, 4}
  r.Aire()         // 12
  Celsius(100).Fahrenheit() // 212
  ```

  - On peut déclarer des méthodes sur **tout type nommé défini dans le même package** : struct, mais aussi
    `type Celsius float64` ou `type Liste []string`.
  - **Pas de méthode sur un type d'un autre package** (ni sur `int` ou `string` directement) : on déclare un type à soi.
  - Le receveur porte un nom **court** (une ou deux lettres : `r`, `c`), le même pour toutes les méthodes du type ; pas
    de `this` ni de `self`.
  - Les méthodes ne se déclarent **pas dans la struct** : elles peuvent être dans n'importe quel fichier du package.
  - Pas de surcharge : deux méthodes du même type ont des noms différents.
  - Une méthode à receveur pointeur peut être appelée sur un **pointeur nil** : à elle de gérer ce cas.

  **Piège classique** : vouloir ajouter une méthode `Inverser` à `string`. Le compilateur refuse (« cannot define new
  methods on non-local type string ») ; on écrit une fonction, ou l'on définit `type MonTexte string`.

  **En entretien** : « Une fonction avec un receveur, sur tout type nommé du package ; pas sur les types d'un autre
  package ; un nom de receveur court et constant, pas de this. »
cards:
  - key: definir-methode-type-autre-package
    format: course
    question: Peut-on définir une méthode sur un type d'un autre package ?
    answer: Non ; il faut définir un type nommé local basé dessus.
  - key: appeler-methode-pointeur-nil
    format: course
    question: Peut-on appeler une méthode sur un pointeur nil ?
    answer: Oui pour une méthode à receveur pointeur, qui peut tester `c == nil`.
  - key: types-possibles
    format: course
    question: Sur quels types peut-on déclarer une méthode ?
    answer: 'Sur tout type nommé défini dans le même package : une struct, mais aussi un type défini sur float64, un slice ou une map.'
  - key: nom-receveur
    format: course
    question: Comment nommer le receveur d'une méthode ?
    answer: Par un nom court, souvent l'initiale du type (`c` pour `Client`), le même pour toutes les méthodes ; jamais `this` ou `self`.
  - key: vf-dans-struct
    format: true-false
    question: Les méthodes se déclarent à l'intérieur des accolades de la struct.
    truth: false
    answer: Elles se déclarent à part, avec un receveur, n'importe où dans le package.
  - key: vf-type-non-struct
    format: true-false
    question: On peut déclarer une méthode sur `type Liste []string`.
    truth: true
    answer: Tout type nommé du package peut avoir des méthodes.
  - key: vf-autre-package
    format: true-false
    question: On peut ajouter une méthode à `time.Duration` depuis son propre package.
    truth: false
    answer: On ne peut définir des méthodes que sur ses propres types ; on déclare `type MaDuree time.Duration` ou l'on écrit une fonction.
  - key: vf-nil-receveur
    format: true-false
    question: Appeler une méthode à receveur pointeur sur un pointeur nil panique toujours.
    truth: false
    answer: L'appel a lieu ; ce n'est que si la méthode lit un champ à travers le receveur nil qu'elle panique.
  - key: qcm-valides
    format: multiple-choice
    question: Quelles déclarations de méthode sont valides dans le package qui déclare `type Celsius float64` ?
    choices:
      - text: '`func (c Celsius) String() string`'
        correct: true
      - text: '`func (c *Celsius) Augmenter(d float64)`'
        correct: true
      - text: '`func (f float64) Arrondi() float64`'
        correct: false
      - text: '`func Celsius.String() string`'
        correct: false
    answer: Le receveur est un type du package, entre parenthèses avant le nom.
  - key: qcm-surcharge
    format: multiple-choice
    question: Un type peut-il avoir deux méthodes `Aire()` et `Aire(unite string)` ?
    choices:
      - text: Non, pas de surcharge en Go
        correct: true
      - text: Oui, si les signatures diffèrent
        correct: false
      - text: Oui, si l'une a un receveur pointeur
        correct: false
      - text: Oui, dans deux fichiers différents
        correct: false
    answer: Un nom de méthode est unique par type.
  - key: qcm-appel
    format: multiple-choice
    question: Comment appeler la méthode `Fahrenheit` de `type Celsius float64` sur la valeur 100 ?
    choices:
      - text: '`Celsius(100).Fahrenheit()`'
        correct: true
      - text: '`var c Celsius = 100; c.Fahrenheit()`'
        correct: true
      - text: '`100.Fahrenheit()`'
        correct: false
      - text: '`Fahrenheit(100)`'
        correct: false
    answer: La constante 100 n'a pas le type `Celsius` tant qu'on ne la convertit pas.
  - key: qcm-string
    format: multiple-choice
    question: Comment « ajouter une méthode » au type `string` ?
    choices:
      - text: Déclarer `type Texte string` et lui donner la méthode
        correct: true
      - text: Écrire une fonction qui prend une string
        correct: true
      - text: '`func (s string) Inverser() string`'
        correct: false
      - text: Utiliser une annotation d'extension
        correct: false
    answer: Go n'a pas de méthodes d'extension.
  - key: trous-receveur
    format: fill-in
    question: |-
      Complétez la méthode :
      ```go
      func (___ Rectangle) Aire() float64 { return r.L * r.H }
      ```
    blanks:
      - - r
    answer: Le receveur, nommé court, précède le nom de la méthode.
  - key: trous-type-local
    format: fill-in
    question: |-
      Complétez pour pouvoir donner des méthodes à une liste de chaînes :
      ```go
      ___ Etiquettes []string

      func (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }
      ```
    blanks:
      - - type
    answer: On déclare un type nommé local.
  - key: trous-appel
    format: fill-in
    question: |-
      Complétez l'appel :
      ```go
      r := Rectangle{3, 4}
      fmt.Println(r___Aire())
      ```
    blanks:
      - - .
    answer: On appelle une méthode avec un point.
  - key: trous-stringer
    format: fill-in
    question: |-
      Complétez pour que `fmt` affiche une température lisible :
      ```go
      func (c Celsius) ___() string { return fmt.Sprintf("%.1f°C", float64(c)) }
      ```
    blanks:
      - - String
    answer: '`String() string` implémente `fmt.Stringer`.'
  - key: code-methodes
    format: code-output
    question: |-
      ```go
      type Rectangle struct{ L, H float64 }

      func (r Rectangle) Aire() float64      { return r.L * r.H }
      func (r Rectangle) Perimetre() float64 { return 2 * (r.L + r.H) }

      r := Rectangle{3, 4}
      fmt.Println(r.Aire(), r.Perimetre())
      ```
    answer: '`12 14`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Rectangle struct{ L, H float64 }\n\n\nfunc (r Rectangle) Aire() float64      { return r.L * r.H }\n\nfunc (r Rectangle) Perimetre() float64 { return 2 * (r.L + r.H) }\n\nfunc main() {\n\tr := Rectangle{3, 4}\n\tfmt.Println(r.Aire(), r.Perimetre())\n}\n"
      output: 12 14
  - key: code-type-slice
    format: code-output
    question: |-
      ```go
      type Etiquettes []string

      func (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }

      e := Etiquettes{"go", "web"}
      fmt.Println(e.Contient("go"), e.Contient("java"), len(e))
      ```
    answer: '`true false 2` : un type slice nommé garde ses opérations et reçoit des méthodes.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype Etiquettes []string\n\n\nfunc (e Etiquettes) Contient(t string) bool { return slices.Contains(e, t) }\n\nfunc main() {\n\te := Etiquettes{\"go\", \"web\"}\n\tfmt.Println(e.Contient(\"go\"), e.Contient(\"java\"), len(e))\n}\n"
      output: true false 2
  - key: code-nil-receveur
    format: code-output
    question: "```go\ntype Noeud struct {\n\tValeur  int\n\tSuivant *Noeud\n}\n\nfunc (n *Noeud) Somme() int {\n\tif n == nil {\n\t\treturn 0\n\t}\n\treturn n.Valeur + n.Suivant.Somme()\n}\n\nliste := &Noeud{1, &Noeud{2, &Noeud{3, nil}}}\nvar vide *Noeud\nfmt.Println(liste.Somme(), vide.Somme())\n```"
    answer: '`6 0` : une méthode à receveur pointeur peut gérer elle-même le receveur nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Noeud struct {\n\tValeur  int\n\tSuivant *Noeud\n}\n\n\nfunc (n *Noeud) Somme() int {\n\tif n == nil {\n\t\treturn 0\n\t}\n\treturn n.Valeur + n.Suivant.Somme()\n}\n\nfunc main() {\n\tliste := &Noeud{1, &Noeud{2, &Noeud{3, nil}}}\n\tvar vide *Noeud\n\tfmt.Println(liste.Somme(), vide.Somme())\n}\n"
      output: 6 0
  - key: code-string-methode
    format: code-output
    question: |-
      ```go
      func (s string) Inverser() string { return s }

      fmt.Println("go".Inverser())
      ```
    answer: 'Rien : le code ne compile pas, on ne peut pas déclarer de méthode sur `string`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc (s string) Inverser() string { return s }\n\nfunc main() {\n\tfmt.Println(\"go\".Inverser())\n}\n"
      compiles: false
