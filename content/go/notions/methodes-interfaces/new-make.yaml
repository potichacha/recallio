notion: new-make
lesson: |-
  Deux fonctions natives allouent, avec des rôles différents :

  | | `new(T)` | `make(T, ...)` |
  |---|---|---|
  | Types | n'importe quel type | **slices, maps, channels** seulement |
  | Renvoie | un **pointeur** `*T` vers une valeur **zéro** | une valeur `T` **initialisée** et prête à l'emploi |
  | Exemple | `p := new(int)` → `*int` vers 0 | `make([]int, 0, 10)`, `make(map[string]int)`, `make(chan int, 5)` |

  ```go
  p := new(Compteur)        // équivaut à &Compteur{}
  s := make([]int, 3, 10)   // len 3, cap 10
  m := make(map[string]int) // map vide utilisable (une map nil paniquerait à l'écriture)
  ch := make(chan int)      // channel non bufferisé
  ```

  `new(T)` et `&T{}` sont équivalents pour une struct ; on préfère `&T{...}`, qui permet d'initialiser les champs.
  `new(map[string]int)` renvoie un **pointeur vers une map nil**, rarement ce qu'on veut.

  Depuis **Go 1.26**, `new` accepte aussi une **expression** : `new(42)` renvoie un `*int` vers 42, ce qui simplifie les
  champs optionnels (`Profil{Age: new(36)}` au lieu d'une variable temporaire).

  **Piège classique** : `make([]int, n)` quand on voulait une capacité ; on obtient n zéros, et `append` ajoute après eux.

  **En entretien** : « new alloue une valeur zéro et renvoie un pointeur ; make initialise un slice, une map ou un channel
  et renvoie la valeur ; &T{} est plus courant que new ; new(expr) depuis Go 1.26. »
tour:
  - title: new et make
    text: |-
      Deux fonctions natives allouent :

      - `new(T)` alloue une variable de type `T` à sa valeur zéro et renvoie son **adresse**, un `*T`. On s'en sert
      peu : `&T{}` fait la même chose pour une struct ; - `make` crée une **slice**, une **map** ou un **channel** prêts
      à l'emploi, et renvoie la valeur elle-même, pas un pointeur.

      `make([]int, 3, 10)` donne une slice de longueur 3 et de capacité 10. Une map ou un channel doivent passer par
      `make` (ou un littéral) avant de servir.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	p := new(int)
          	*p = 7
          	fmt.Println(*p)

          	s := make([]int, 3, 10)
          	fmt.Println(s, len(s), cap(s))

          	m := make(map[string]int)
          	m["go"] = 1
          	fmt.Println(m)
          }
      output: |-
        7
        [0 0 0] 3 10
        map[go:1]
cards:
  - key: new
    format: course
    question: Que fait `new(T)` ?
    answer: Alloue une variable de type T initialisée à sa valeur zéro et renvoie son adresse.
  - key: apporte-1-26-new
    format: course
    question: Qu'apporte Go 1.26 à new ?
    answer: 'new accepte une expression : `new(f())` crée une variable initialisée avec cette valeur.'
  - key: new-vs
    format: course
    question: '`new(T)` vs `&T{}` ?'
    answer: Équivalents pour une struct ; &T{} permet d'initialiser des champs.
  - key: make-types
    format: course
    question: Pour quels types utilise-t-on `make` ?
    answer: Uniquement les slices, les maps et les channels, qui ont besoin d'une structure interne initialisée.
  - key: vf-make-struct
    format: true-false
    question: '`make(Client)` crée une struct Client.'
    truth: false
    answer: '`make` ne s''applique qu''aux slices, maps et channels ; on écrit `Client{}` ou `&Client{}`.'
  - key: vf-new-pointeur
    format: true-false
    question: '`new(T)` renvoie un pointeur vers une valeur zéro de T.'
    truth: true
    answer: Son type est `*T`.
  - key: vf-new-map
    format: true-false
    question: '`m := new(map[string]int)` donne une map prête à l''écriture.'
    truth: false
    answer: Il donne un pointeur vers une map nil ; il faut `make(map[string]int)`.
  - key: vf-new-expr
    format: true-false
    question: Depuis Go 1.26, `new(5)` renvoie un pointeur vers un int qui vaut 5.
    truth: true
    answer: '`new` accepte une expression, pratique pour les champs optionnels.'
  - key: qcm-valides
    format: multiple-choice
    question: Quelles expressions sont valides ?
    choices:
      - text: '`make(chan string, 10)`'
        correct: true
      - text: '`new(sync.Mutex)`'
        correct: true
      - text: '`make(*int)`'
        correct: false
      - text: '`make(struct{})`'
        correct: false
    answer: '`make` refuse les pointeurs et les structs.'
  - key: qcm-renvoie
    format: multiple-choice
    question: Que renvoie `make([]int, 2)` ?
    choices:
      - text: 'Un `[]int` de longueur 2 : `[0 0]`'
        correct: true
      - text: Un `*[]int`
        correct: false
      - text: Un slice vide de capacité 2
        correct: false
      - text: Un tableau `[2]int`
        correct: false
    answer: '`make` renvoie la valeur, pas un pointeur.'
  - key: qcm-equivalents
    format: multiple-choice
    question: Lesquels sont équivalents à `new(Compteur)` ?
    choices:
      - text: '`&Compteur{}`'
        correct: true
      - text: '`var c Compteur` puis `&c`'
        correct: true
      - text: '`make(Compteur)`'
        correct: false
      - text: '`Compteur{}`'
        correct: false
    answer: '`Compteur{}` est une valeur, pas un pointeur.'
  - key: qcm-choisir
    format: multiple-choice
    question: Quelle écriture préférer pour une struct initialisée ?
    choices:
      - text: '`&Client{Nom: "Ada"}`'
        correct: true
      - text: '`c := new(Client); c.Nom = "Ada"`'
        correct: false
      - text: '`make(Client, "Ada")`'
        correct: false
      - text: '`new(Client{Nom: "Ada"})` avant Go 1.26'
        correct: false
    answer: Le littéral composite initialise les champs en une expression.
  - key: trous-map
    format: fill-in
    question: |-
      Complétez la création d'une map utilisable :
      ```go
      index := ___(map[string][]int)
      ```
    blanks:
      - - make
    answer: '`make` initialise la table.'
  - key: trous-channel
    format: fill-in
    question: |-
      Complétez la création d'un channel de capacité 100 :
      ```go
      jobs := make(chan Job, ___)
      ```
    blanks:
      - - '100'
    answer: Le second argument est la taille du tampon.
  - key: trous-new
    format: fill-in
    question: |-
      Complétez pour obtenir un pointeur vers un entier à zéro :
      ```go
      compteur := ___(int)
      ```
    blanks:
      - - new
    answer: '`new(int)` renvoie un `*int` vers 0.'
  - key: trous-capacite
    format: fill-in
    question: |-
      Complétez pour un slice vide prêt à recevoir 50 éléments :
      ```go
      noms := make([]string, ___, 50)
      ```
    blanks:
      - - '0'
    answer: Longueur 0, capacité 50.
  - key: code-new
    format: code-output
    question: |-
      ```go
      p := new(int)
      *p += 3
      s := make([]int, 2, 5)
      fmt.Println(*p, s, len(s), cap(s))
      ```
    answer: '`3 [0 0] 2 5` : `new` donne un pointeur vers zéro, `make` un slice initialisé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tp := new(int)\n\t*p += 3\n\ts := make([]int, 2, 5)\n\tfmt.Println(*p, s, len(s), cap(s))\n}\n"
      output: 3 [0 0] 2 5
  - key: code-new-map
    format: code-output
    question: |-
      ```go
      m := new(map[string]int)
      fmt.Println(*m == nil)
      (*m)["a"] = 1
      ```
    answer: '`true`, puis une panique : `new` a créé un pointeur vers une map nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := new(map[string]int)\n\tfmt.Println(*m == nil)\n\t(*m)[\"a\"] = 1\n}\n"
      output: 'true'
      panics: assignment to entry in nil map
  - key: code-new-expr
    format: code-output
    question: |-
      ```go
      type Profil struct{ Age *int }

      p := Profil{Age: new(36)}
      *p.Age++
      fmt.Println(*p.Age)
      ```
    answer: '`37` : depuis Go 1.26, `new` accepte une expression.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Profil struct{ Age *int }\n\nfunc main() {\n\tp := Profil{Age: new(36)}\n\t*p.Age++\n\tfmt.Println(*p.Age)\n}\n"
      output: '37'
  - key: code-make-chan
    format: code-output
    question: |-
      ```go
      ch := make(chan int, 2)
      ch <- 1
      ch <- 2
      fmt.Println(len(ch), cap(ch))
      ```
    answer: '`2 2` : `make` crée un channel avec un tampon de 2.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(len(ch), cap(ch))\n}\n"
      output: 2 2
  - key: bug-make-struct
    format: bug-fix
    question: |-
      Le compilateur signale « invalid argument: cannot make Config; type must be slice, map, or channel » :
      ```go
      cfg := make(Config)
      ```
    answer: |-
      ```go
      cfg := &Config{}
      // ou : cfg := Config{} pour une valeur
      ```
      `make` est réservé aux slices, maps et channels.
  - key: bug-new-map
    format: bug-fix
    question: |-
      Le cache panique à la première écriture :
      ```go
      cache := new(map[string]string)
      (*cache)["cle"] = "valeur"
      ```
    answer: |-
      ```go
      cache := make(map[string]string)
      cache["cle"] = "valeur"
      ```
      `new` donnait un pointeur vers une map nil ; `make` crée la table. Un pointeur vers une map est rarement utile.
  - key: bug-temporaire
    format: bug-fix
    question: |-
      En revue d'un module Go 1.26, simplifiez :
      ```go
      age := 36
      actif := true
      p := Profil{Age: &age, Actif: &actif}
      ```
    answer: |-
      ```go
      p := Profil{Age: new(36), Actif: new(true)}
      ```
      Depuis Go 1.26, `new` accepte une expression : plus besoin de variables temporaires pour les champs optionnels.
  - key: bug-make-len
    format: bug-fix
    question: "Le slice des résultats commence par des valeurs vides :\n```go\nres := make([]Resultat, len(taches))\nfor _, t := range taches {\n\tres = append(res, executer(t))\n}\n```"
    answer: "```go\nres := make([]Resultat, 0, len(taches))\nfor _, t := range taches {\n\tres = append(res, executer(t))\n}\n// ou garder make([]Resultat, len(taches)) et écrire res[i] = executer(t)\n```\nLa longueur donnée à `make` créait des éléments à zéro avant ceux d'`append`."
