notion: new-make
lesson: |-
  Deux fonctions natives allouent, avec des rôles différents :

  | | `new(T)` | `make(T, ...)` |
  |---|---|---|
  | Types | n'importe quel type | **slices, maps, channels** seulement |
  | Renvoie | un **pointeur** `*T` vers une valeur **zéro** | une valeur `T` **initialisée** et prête à l'emploi |
  | Exemple | `p := new(int)` → `*int` vers 0 | `make([]int, 0, 10)`, `make(map[string]int)`, `make(chan int, 5)` |

  ```go
  p := new(Compteur)        // équivaut à &Compteur{}
  s := make([]int, 3, 10)   // len 3, cap 10
  m := make(map[string]int) // map vide utilisable (une map nil paniquerait à l'écriture)
  ch := make(chan int)      // channel non bufferisé
  ```

  `new(T)` et `&T{}` sont équivalents pour une struct ; on préfère `&T{...}`, qui permet d'initialiser les champs.
  `new(map[string]int)` renvoie un **pointeur vers une map nil**, rarement ce qu'on veut.

  Depuis **Go 1.26**, `new` accepte aussi une **expression** : `new(42)` renvoie un `*int` vers 42, ce qui simplifie les
  champs optionnels (`Profil{Age: new(36)}` au lieu d'une variable temporaire).

  **Piège classique** : `make([]int, n)` quand on voulait une capacité ; on obtient n zéros, et `append` ajoute après eux.

  **En entretien** : « new alloue une valeur zéro et renvoie un pointeur ; make initialise un slice, une map ou un channel
  et renvoie la valeur ; &T{} est plus courant que new ; new(expr) depuis Go 1.26. »
tour:
  - title: new et make
    text: |-
      Deux fonctions natives allouent :

      - `new(T)` alloue une variable de type `T` à sa valeur zéro et renvoie son **adresse**, un `*T`. On s'en sert
      peu : `&T{}` fait la même chose pour une struct ; - `make` crée une **slice**, une **map** ou un **channel** prêts
      à l'emploi, et renvoie la valeur elle-même, pas un pointeur.

      `make([]int, 3, 10)` donne une slice de longueur 3 et de capacité 10. Une map ou un channel doivent passer par
      `make` (ou un littéral) avant de servir.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	p := new(int)
          	*p = 7
          	fmt.Println(*p)

          	s := make([]int, 3, 10)
          	fmt.Println(s, len(s), cap(s))

          	m := make(map[string]int)
          	m["go"] = 1
          	fmt.Println(m)
          }
      output: |-
        7
        [0 0 0] 3 10
        map[go:1]
cards:
  - key: new
    format: course
    question: Que fait `new(T)` ?
    choices:
      - {text: "Il alloue une variable `T` à sa valeur zéro, et renvoie son adresse, un `*T`", correct: true}
      - {text: "Il appelle le constructeur de `T`, comme le `new` de Java", correct: false}
      - {text: "Il alloue un `T` initialisé, comme `make`, et renvoie sa valeur", correct: false}
      - {text: "Il réserve de la mémoire non initialisée, comme `malloc` en C", correct: false}
    answer: "Il alloue une variable de type T initialisée à sa valeur zéro et renvoie son adresse. Aucun constructeur n'est appelé : la valeur zéro doit être utilisable."
  - key: apporte-1-26-new
    format: course
    question: "Qu'apporte Go 1.26 à la fonction `new` ?"
    choices:
      - {text: "`new` accepte une expression : `new(f())` crée une variable qui vaut ce résultat", correct: true}
      - {text: "`new` accepte des arguments de constructeur, comme `new(T, a, b)`", correct: false}
      - {text: "`new` crée aussi des maps et des channels prêts, comme `make`", correct: false}
      - {text: "`new` renvoie une valeur au lieu d'un pointeur, pour éviter le tas", correct: false}
    answer: 'new accepte une expression : `new(f())` crée une variable initialisée avec cette valeur.'
  - key: new-vs
    format: course
    question: "Quelle différence y a-t-il entre `new(T)` et `&T{}` pour une struct ?"
    choices:
      - {text: "Aucune sur le résultat ; `&T{}` permet en plus d'initialiser des champs", correct: true}
      - {text: "`new(T)` alloue sur le tas, `&T{}` toujours sur la pile", correct: false}
      - {text: "`new(T)` renvoie une valeur, `&T{}` renvoie un pointeur", correct: false}
      - {text: "`&T{}` appelle un constructeur, `new(T)` ne l'appelle pas", correct: false}
    answer: "Équivalents pour une struct ; `&T{}` permet d'initialiser des champs. L'endroit de l'allocation (pile ou tas) dépend de l'analyse d'échappement, pas de la syntaxe."
  - key: make-types
    format: course
    question: Pour quels types utilise-t-on `make` ?
    choices:
      - {text: "Les slices, les maps et les channels, seulement", correct: true}
      - {text: "Tous les types : `make` est un synonyme de `new`", correct: false}
      - {text: "Les structs, les slices et les maps", correct: false}
      - {text: "Les pointeurs, les maps et les channels", correct: false}
    answer: Uniquement les slices, les maps et les channels, qui ont besoin d'une structure interne initialisée.
  - key: vf-make-struct
    format: true-false
    question: '`make(Client)` crée une struct Client.'
    truth: false
    answer: '`make` ne s''applique qu''aux slices, maps et channels ; on écrit `Client{}` ou `&Client{}`.'
  - key: vf-new-pointeur
    format: true-false
    question: '`new(T)` renvoie un pointeur vers une valeur zéro de T.'
    truth: true
    answer: Son type est `*T`.
  - key: vf-new-map
    format: true-false
    question: '`m := new(map[string]int)` donne une map prête à l''écriture.'
    truth: false
    answer: Il donne un pointeur vers une map nil ; il faut `make(map[string]int)`.
  - key: vf-new-expr
    format: true-false
    question: Depuis Go 1.26, `new(5)` renvoie un pointeur vers un int qui vaut 5.
    truth: true
    answer: '`new` accepte une expression, pratique pour les champs optionnels.'
  - key: qcm-valides
    format: multiple-choice
    question: "Laquelle de ces expressions est valide ?"
    choices:
      - {text: "`make(chan string, 10)`", correct: true}
      - {text: "`make(*int)`", correct: false}
      - {text: "`make(struct{})`", correct: false}
      - {text: "`make(sync.Mutex)`", correct: false}
    answer: "`make` ne crée que des slices, des maps et des channels ; il refuse les pointeurs et les structs, pour lesquels on écrit `new(T)` ou `&T{}`."
  - key: qcm-renvoie
    format: multiple-choice
    question: Que renvoie `make([]int, 2)` ?
    choices:
      - text: 'Un `[]int` de longueur 2 : `[0 0]`'
        correct: true
      - text: Un `*[]int`
        correct: false
      - text: Un slice vide de capacité 2
        correct: false
      - text: Un tableau `[2]int`
        correct: false
    answer: '`make` renvoie la valeur, pas un pointeur.'
  - key: qcm-equivalents
    format: multiple-choice
    question: Lesquels sont équivalents à `new(Compteur)` ?
    choices:
      - text: '`&Compteur{}`'
        correct: true
      - text: '`var c Compteur` puis `&c`'
        correct: true
      - text: '`make(Compteur)`'
        correct: false
      - text: '`Compteur{}`'
        correct: false
    answer: '`Compteur{}` est une valeur, pas un pointeur.'
  - key: qcm-choisir
    format: multiple-choice
    question: Quelle écriture préférer pour une struct initialisée ?
    choices:
      - text: '`&Client{Nom: "Ada"}`'
        correct: true
      - text: '`c := new(Client); c.Nom = "Ada"`'
        correct: false
      - text: '`make(Client, "Ada")`'
        correct: false
      - text: '`new(Client{Nom: "Ada"})` avant Go 1.26'
        correct: false
    answer: Le littéral composite initialise les champs en une expression.
  - key: trous-map
    format: fill-in
    question: |-
      Complète la création d'une map utilisable :
      ```go
      index := ___(map[string][]int)
      ```
    blanks:
      - - make
    answer: '`make` initialise la table.'
  - key: trous-channel
    format: fill-in
    question: |-
      Complète la création d'un channel de capacité 100 :
      ```go
      jobs := make(chan Job, ___)
      ```
    blanks:
      - - '100'
    answer: Le second argument est la taille du tampon.
  - key: trous-new
    format: fill-in
    question: |-
      Complète pour obtenir un pointeur vers un entier à zéro :
      ```go
      compteur := ___(int)
      ```
    blanks:
      - - new
    answer: '`new(int)` renvoie un `*int` vers 0.'
  - key: trous-capacite
    format: fill-in
    question: |-
      Complète pour un slice vide prêt à recevoir 50 éléments :
      ```go
      noms := make([]string, ___, 50)
      ```
    blanks:
      - - '0'
    answer: Longueur 0, capacité 50.
  - key: code-new
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      p := new(int)
      *p += 3
      s := make([]int, 2, 5)
      fmt.Println(*p, s, len(s), cap(s))
      ```
    choices:
      - {text: "`3 [0 0] 2 5`", correct: true}
      - {text: "`3 [0 0 0 0 0] 2 5`", correct: false}
      - {text: "`3 [] 0 5`", correct: false}
      - {text: "`3 [0 0] 5 5`", correct: false}
    answer: '`3 [0 0] 2 5` : `new` donne un pointeur vers zéro, `make` un slice initialisé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tp := new(int)\n\t*p += 3\n\ts := make([]int, 2, 5)\n\tfmt.Println(*p, s, len(s), cap(s))\n}\n"
      output: 3 [0 0] 2 5
  - key: code-new-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      m := new(map[string]int)
      fmt.Println(*m == nil)
      (*m)["a"] = 1
      ```
    choices:
      - {text: "`true`, puis une panic : assignment to entry in nil map", correct: true}
      - {text: "`false`, puis rien : `new` a créé la map", correct: false}
      - {text: "`true`, puis rien : l'écriture crée la map", correct: false}
      - {text: "Ça ne compile pas : `new` refuse les maps", correct: false}
    answer: '`true`, puis une panique : `new` a créé un pointeur vers une map nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tm := new(map[string]int)\n\tfmt.Println(*m == nil)\n\t(*m)[\"a\"] = 1\n}\n"
      output: 'true'
      panics: assignment to entry in nil map
  - key: code-new-expr
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Profil struct{ Age *int }

      p := Profil{Age: new(36)}
      *p.Age++
      fmt.Println(*p.Age)
      ```
    choices:
      - {text: "`37`", correct: true}
      - {text: "`36`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas : `new` attend un type", correct: false}
    answer: '`37` : depuis Go 1.26, `new` accepte une expression.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Profil struct{ Age *int }\n\nfunc main() {\n\tp := Profil{Age: new(36)}\n\t*p.Age++\n\tfmt.Println(*p.Age)\n}\n"
      output: '37'
  - key: code-make-chan
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      ch := make(chan int, 2)
      ch <- 1
      ch <- 2
      fmt.Println(len(ch), cap(ch))
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`0 2`", correct: false}
      - {text: "`2 0`", correct: false}
      - {text: "Un interblocage : le second envoi bloque", correct: false}
    answer: '`2 2` : `make` crée un channel avec un tampon de 2.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tch := make(chan int, 2)\n\tch <- 1\n\tch <- 2\n\tfmt.Println(len(ch), cap(ch))\n}\n"
      output: 2 2
  - key: bug-make-struct
    format: bug-fix
    question: |-
      Le compilateur signale « invalid argument: cannot make Config; type must be slice, map, or channel ». Quelle correction est la bonne ?
      ```go
      cfg := make(Config)
      ```
    choices:
      - {text: "`cfg := &Config{}`, ou `Config{}` pour une valeur", correct: true}
      - {text: "`cfg := make(*Config)`, un pointeur vers la struct", correct: false}
      - {text: "`cfg := make(Config, 1)`, avec une taille explicite", correct: false}
      - {text: "`cfg := make([]Config)`, un slice d'une seule config", correct: false}
    answer: |-
      ```go
      cfg := &Config{}
      // ou : cfg := Config{} pour une valeur
      ```
      `make` est réservé aux slices, maps et channels.
  - key: bug-new-map
    format: bug-fix
    question: |-
      Le cache panique à la première écriture. Quelle correction est la bonne ?
      ```go
      cache := new(map[string]string)
      (*cache)["cle"] = "valeur"
      ```
    choices:
      - {text: "`cache := make(map[string]string)`, qui crée la table", correct: true}
      - {text: "`var cache map[string]string`, déclarée sans pointeur", correct: false}
      - {text: "`cache := new(map[string]string, 10)`, avec une capacité", correct: false}
      - {text: "Écrire `cache[\"cle\"]`, sans déréférencer le pointeur", correct: false}
    answer: |-
      ```go
      cache := make(map[string]string)
      cache["cle"] = "valeur"
      ```
      `new` donnait un pointeur vers une map nil ; `make` crée la table. Un pointeur vers une map est rarement utile.
  - key: bug-temporaire
    format: bug-fix
    question: |-
      En revue d'un module Go 1.26, ce code crée des variables temporaires pour remplir des champs pointeurs. Quelle simplification est la bonne ?
      ```go
      age := 36
      actif := true
      p := Profil{Age: &age, Actif: &actif}
      ```
    choices:
      - {text: "`p := Profil{Age: new(36), Actif: new(true)}`", correct: true}
      - {text: "`p := Profil{Age: &36, Actif: &true}`", correct: false}
      - {text: "`p := Profil{Age: *36, Actif: *true}`", correct: false}
      - {text: "`p := Profil{Age: new(int, 36), Actif: new(bool, true)}`", correct: false}
    answer: |-
      ```go
      p := Profil{Age: new(36), Actif: new(true)}
      ```
      Depuis Go 1.26, `new` accepte une expression : plus besoin de variables temporaires pour les champs optionnels.
  - key: bug-make-len
    format: bug-fix
    question: |-
      Le slice des résultats commence par des valeurs vides. Quelle correction est la bonne ?
      ```go
      res := make([]Resultat, len(taches))
      for _, t := range taches {
      	res = append(res, executer(t))
      }
      ```
    choices:
      - {text: "`make([]Resultat, 0, len(taches))` : longueur 0, capacité réservée", correct: true}
      - {text: "`make([]Resultat, len(taches), 0)` : capacité 0, longueur réservée", correct: false}
      - {text: "`make([]Resultat, len(taches)+1)` : une case de plus pour `append`", correct: false}
      - {text: "`make([]Resultat, len(taches))`, puis `res = res[1:]` après la boucle", correct: false}
    answer: "```go\nres := make([]Resultat, 0, len(taches))\nfor _, t := range taches {\n\tres = append(res, executer(t))\n}\n// ou garder make([]Resultat, len(taches)) et écrire res[i] = executer(t)\n```\nLa longueur donnée à `make` créait des éléments à zéro avant ceux d'`append`."
