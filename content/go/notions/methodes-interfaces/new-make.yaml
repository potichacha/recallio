notion: new-make
cards:
  - key: new
    format: course
    question: Que fait `new(T)` ?
    answer: Alloue une variable de type T initialisée à sa valeur zéro et renvoie son adresse.
  - key: apporte-1-26-new
    format: course
    question: Qu'apporte Go 1.26 à new ?
    answer: 'new accepte une expression : `new(f())` crée une variable initialisée avec cette valeur.'
  - key: new-vs
    format: course
    question: '`new(T)` vs `&T{}` ?'
    answer: Équivalents pour une struct ; &T{} permet d'initialiser des champs.
