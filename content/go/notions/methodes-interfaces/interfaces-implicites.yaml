notion: interfaces-implicites
lesson: "Une **interface** décrit un comportement : un ensemble de méthodes. Un type l'**implémente implicitement** dès qu'il a\nces méthodes, **sans déclaration** `implements`.\n\n```go\ntype Forme interface {\n\tAire() float64\n}\n\ntype Carre struct{ Cote float64 }\nfunc (c Carre) Aire() float64 { return c.Cote * c.Cote }\n\ntype Cercle struct{ R float64 }\nfunc (c Cercle) Aire() float64 { return math.Pi * c.R * c.R }\n\nfunc Total(formes []Forme) float64 {\n\tt := 0.0\n\tfor _, f := range formes {\n\t\tt += f.Aire() // appel dynamique selon le type concret\n\t}\n\treturn t\n}\n```\n\nConséquences de ce typage « structurel » :\n- un type peut implémenter une interface **définie après lui**, dans un autre package, sans le savoir ;\n- on définit l'interface **là où on l'utilise** (côté consommateur), avec seulement les méthodes nécessaires ;\n- les **doublures de test** s'écrivent sans framework : un petit type qui a les bonnes méthodes suffit ;\n- le compilateur vérifie la correspondance à l'affectation (`var f Forme = Carre{2}`).\n\nUne variable d'interface contient un **type concret** et une **valeur** ; sa valeur zéro est `nil`. Appeler une\nméthode sur une interface nil panique.\n\n**Piège classique** : une méthode presque juste (`Aire() int` au lieu de `Aire() float64`, ou un nom différent) ; le\ntype n'implémente pas l'interface, et l'erreur n'apparaît qu'à l'endroit où on l'affecte.\n\n**En entretien** : « Une interface est un ensemble de méthodes, satisfait implicitement ; on la définit côté\nconsommateur, petite ; ça découple les packages et rend les doublures de test triviales. »"
cards:
  - key: type-implemente-interface
    format: course
    question: Comment un type implémente-t-il une interface en Go ?
    answer: Implicitement, en possédant toutes ses méthodes, sans mot-clé implements.
  - key: avantages-interfaces-implicites
    format: course
    question: Avantages des interfaces implicites ?
    answer: Découplage, interfaces définies après coup ou par le consommateur, mocks simples.
  - key: consommateur
    format: course
    question: Pourquoi définir une interface du côté du code qui l'utilise ?
    answer: 'Parce que l''implémentation n''a pas besoin de la connaître : le consommateur déclare exactement les méthodes dont il a besoin, et tout type compatible convient, y compris une doublure de test.'
  - key: nil
    format: course
    question: Que se passe-t-il quand on appelle une méthode sur une variable d'interface nil ?
    answer: 'Une panique (nil pointer dereference) : il n''y a pas de type concret à qui envoyer l''appel.'
  - key: vf-implements
    format: true-false
    question: En Go, un type doit déclarer les interfaces qu'il implémente.
    truth: false
    answer: Il les implémente implicitement, en ayant leurs méthodes.
  - key: vf-autre-package
    format: true-false
    question: Un type peut implémenter une interface déclarée dans un package qu'il n'importe pas.
    truth: true
    answer: Seules les méthodes comptent ; c'est ce qui permet de découpler les packages.
  - key: vf-signature
    format: true-false
    question: Une méthode `Aire() int` satisfait une interface qui demande `Aire() float64`.
    truth: false
    answer: La signature doit correspondre exactement.
  - key: vf-plusieurs
    format: true-false
    question: Un même type peut implémenter plusieurs interfaces.
    truth: true
    answer: Par exemple `io.Reader`, `io.Writer` et `fmt.Stringer` à la fois.
  - key: qcm-implemente
    format: multiple-choice
    question: Lesquels implémentent `type Forme interface{ Aire() float64 }` ?
    choices:
      - text: '`type Carre struct{...}` avec `func (c Carre) Aire() float64`'
        correct: true
      - text: '`type Disque float64` avec `func (d Disque) Aire() float64`'
        correct: true
      - text: Un type avec `func (t T) Aire() int`
        correct: false
      - text: Un type avec `func (t T) aire() float64`, dans un autre package
        correct: false
    answer: La signature et le nom (exporté si l'interface vient d'ailleurs) doivent correspondre.
  - key: qcm-avantages
    format: multiple-choice
    question: Quels avantages apportent les interfaces implicites ?
    choices:
      - text: Des doublures de test écrites à la main, sans framework
        correct: true
      - text: Des packages qui ne dépendent pas les uns des autres
        correct: true
      - text: Des appels plus rapides qu'un appel direct
        correct: false
      - text: L'héritage multiple
        correct: false
    answer: Un appel par interface est indirect, donc un peu plus coûteux qu'un appel direct.
  - key: qcm-valeur-zero
    format: multiple-choice
    question: Que vaut `var f Forme` ?
    choices:
      - text: nil
        correct: true
      - text: Un Carre de côté 0
        correct: false
      - text: Une interface vide qui accepte tous les appels
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Une interface sans type concret vaut nil.
  - key: qcm-affectation
    format: multiple-choice
    question: Où le compilateur vérifie-t-il qu'un type implémente une interface ?
    choices:
      - text: À chaque affectation ou passage d'une valeur là où l'interface est attendue
        correct: true
      - text: Sur une ligne `var _ Forme = Carre{}` écrite pour forcer la vérification
        correct: true
      - text: À la déclaration du type
        correct: false
      - text: Seulement à l'exécution
        correct: false
    answer: La correspondance est vérifiée là où l'on convertit vers l'interface.
  - key: trous-interface
    format: fill-in
    question: "Complétez la déclaration :\n```go\ntype Forme ___ {\n\tAire() float64\n}\n```"
    blanks:
      - - interface
    answer: Une interface liste des signatures de méthodes.
  - key: trous-implementer
    format: fill-in
    question: |-
      Complétez pour que `Carre` implémente `Forme` :
      ```go
      func (c Carre) ___() float64 { return c.Cote * c.Cote }
      ```
    blanks:
      - - Aire
    answer: Il suffit d'avoir la méthode, avec la bonne signature.
  - key: trous-slice
    format: fill-in
    question: |-
      Complétez pour mélanger des formes de types différents :
      ```go
      formes := []___{Carre{2}, Cercle{1}}
      ```
    blanks:
      - - Forme
    answer: Un slice d'interfaces contient des valeurs de types concrets variés.
  - key: trous-doublure
    format: fill-in
    question: |-
      Complétez la doublure de test qui implémente `Horloge interface{ Maintenant() time.Time }` :
      ```go
      type horlogeFixe struct{ t time.Time }

      func (h horlogeFixe) ___() time.Time { return h.t }
      ```
    blanks:
      - - Maintenant
    answer: Aucun framework de mock n'est nécessaire.
  - key: code-polymorphisme
    format: code-output
    question: "```go\ntype Forme interface{ Aire() float64 }\n\ntype Carre struct{ C float64 }\ntype Rect struct{ L, H float64 }\n\nfunc (c Carre) Aire() float64 { return c.C * c.C }\nfunc (r Rect) Aire() float64  { return r.L * r.H }\n\ntotal := 0.0\nfor _, f := range []Forme{Carre{2}, Rect{2, 3}} {\n\ttotal += f.Aire()\n}\nfmt.Println(total)\n```"
    answer: '`10` : chaque appel va à la méthode du type concret.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\n\ntype Carre struct{ C float64 }\n\ntype Rect struct{ L, H float64 }\n\n\nfunc (c Carre) Aire() float64 { return c.C * c.C }\n\nfunc (r Rect) Aire() float64  { return r.L * r.H }\n\nfunc main() {\n\ttotal := 0.0\n\tfor _, f := range []Forme{Carre{2}, Rect{2, 3}} {\n\t\ttotal += f.Aire()\n\t}\n\tfmt.Println(total)\n}\n"
      output: '10'
  - key: code-type-dynamique
    format: code-output
    question: |-
      ```go
      type Forme interface{ Aire() float64 }
      type Carre struct{ C float64 }

      func (c Carre) Aire() float64 { return c.C * c.C }

      var f Forme
      fmt.Println(f == nil)
      f = Carre{3}
      fmt.Printf("%T %v\n", f, f.Aire())
      ```
    answer: '`true` puis `main.Carre 9` : l''interface prend le type concret de la valeur affectée.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\ntype Carre struct{ C float64 }\n\n\nfunc (c Carre) Aire() float64 { return c.C * c.C }\n\nfunc main() {\n\tvar f Forme\n\tfmt.Println(f == nil)\n\tf = Carre{3}\n\tfmt.Printf(\"%T %v\\n\", f, f.Aire())\n}\n"
      output: |-
        true
        main.Carre 9
  - key: code-signature
    format: code-output
    question: |-
      ```go
      type Forme interface{ Aire() float64 }
      type Carre struct{ C int }

      func (c Carre) Aire() int { return c.C * c.C }

      var f Forme = Carre{2}
      fmt.Println(f.Aire())
      ```
    answer: 'Rien : le code ne compile pas, `Aire() int` n''a pas la signature `Aire() float64`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\ntype Carre struct{ C int }\n\n\nfunc (c Carre) Aire() int { return c.C * c.C }\n\nfunc main() {\n\tvar f Forme = Carre{2}\n\tfmt.Println(f.Aire())\n}\n"
      compiles: false
  - key: code-nil-appel
    format: code-output
    question: |-
      ```go
      type Forme interface{ Aire() float64 }

      var f Forme
      fmt.Println("avant")
      fmt.Println(f.Aire())
      ```
    answer: '`avant`, puis une panique : appeler une méthode sur une interface nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\nfunc main() {\n\tvar f Forme\n\tfmt.Println(\"avant\")\n\tfmt.Println(f.Aire())\n}\n"
      output: avant
      panics: nil pointer dereference
  - key: bug-signature
    format: bug-fix
    question: |-
      Le compilateur signale « Fichier does not implement io.Writer (wrong type for method Write) » :
      ```go
      func (f *Fichier) Write(p []byte) error { ... }
      ```
    answer: |-
      ```go
      func (f *Fichier) Write(p []byte) (n int, err error) { ... }
      ```
      `io.Writer` demande exactement `Write([]byte) (int, error)`.
  - key: bug-interface-producteur
    format: bug-fix
    question: "Le package `stockage` déclare une grosse interface que personne n'utilise en entier, et chaque test doit la doubler en entier :\n```go\npackage stockage\n\ntype Depot interface {\n\tLire(id string) (Doc, error)\n\tEcrire(Doc) error\n\tSupprimer(id string) error\n\tLister() ([]Doc, error)\n\tMigrer() error\n}\n```"
    answer: "```go\n// stockage exporte son type concret\ntype PostgresDepot struct{ ... }\n\n// le package qui l'utilise déclare seulement ce dont il a besoin\npackage rapport\n\ntype lecteur interface {\n\tLister() ([]stockage.Doc, error)\n}\n```\nL'interface se définit côté consommateur, avec les seules méthodes utilisées : les doublures de test deviennent\nminuscules."
  - key: bug-nil
    format: bug-fix
    question: |-
      Le service panique au démarrage quand la notification n'est pas configurée :
      ```go
      type Service struct{ notif Notifieur }

      func (s *Service) Valider(c Commande) { s.notif.Envoyer(c) }
      ```
    answer: "```go\ntype aucuneNotif struct{}\n\nfunc (aucuneNotif) Envoyer(Commande) {}\n\nfunc NouveauService(n Notifieur) *Service {\n\tif n == nil {\n\t\tn = aucuneNotif{}\n\t}\n\treturn &Service{notif: n}\n}\n```\nUn champ interface nil panique à l'appel ; une implémentation « qui ne fait rien » par défaut évite les tests de\nnil partout."
  - key: bug-nom
    format: bug-fix
    question: |-
      Le type n'implémente pas `fmt.Stringer`, et `Println` affiche la struct brute :
      ```go
      func (c Commande) ToString() string { return "commande " + c.ID }
      ```
    answer: |-
      ```go
      func (c Commande) String() string { return "commande " + c.ID }
      ```
      L'interface implicite repose sur le nom exact : `fmt.Stringer` demande `String() string`.
