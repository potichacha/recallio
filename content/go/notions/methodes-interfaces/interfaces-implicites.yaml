notion: interfaces-implicites
cards:
  - key: type-implemente-interface
    format: course
    question: Comment un type implémente-t-il une interface en Go ?
    answer: Implicitement, en possédant toutes ses méthodes, sans mot-clé implements.
  - key: avantages-interfaces-implicites
    format: course
    question: Avantages des interfaces implicites ?
    answer: Découplage, interfaces définies après coup ou par le consommateur, mocks simples.
