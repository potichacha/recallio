notion: interfaces-implicites
lesson: "Une **interface** décrit un comportement : un ensemble de méthodes. Un type l'**implémente implicitement** dès qu'il a\nces méthodes, **sans déclaration** `implements`.\n\n```go\ntype Forme interface {\n\tAire() float64\n}\n\ntype Carre struct{ Cote float64 }\nfunc (c Carre) Aire() float64 { return c.Cote * c.Cote }\n\ntype Cercle struct{ R float64 }\nfunc (c Cercle) Aire() float64 { return math.Pi * c.R * c.R }\n\nfunc Total(formes []Forme) float64 {\n\tt := 0.0\n\tfor _, f := range formes {\n\t\tt += f.Aire() // appel dynamique selon le type concret\n\t}\n\treturn t\n}\n```\n\nConséquences de ce typage « structurel » :\n- un type peut implémenter une interface **définie après lui**, dans un autre package, sans le savoir ;\n- on définit l'interface **là où on l'utilise** (côté consommateur), avec seulement les méthodes nécessaires ;\n- les **doublures de test** s'écrivent sans framework : un petit type qui a les bonnes méthodes suffit ;\n- le compilateur vérifie la correspondance à l'affectation (`var f Forme = Carre{2}`).\n\nUne variable d'interface contient un **type concret** et une **valeur** ; sa valeur zéro est `nil`. Appeler une\nméthode sur une interface nil panique.\n\n**Piège classique** : une méthode presque juste (`Aire() int` au lieu de `Aire() float64`, ou un nom différent) ; le\ntype n'implémente pas l'interface, et l'erreur n'apparaît qu'à l'endroit où on l'affecte.\n\n**En entretien** : « Une interface est un ensemble de méthodes, satisfait implicitement ; on la définit côté\nconsommateur, petite ; ça découple les packages et rend les doublures de test triviales. »"
tour:
  - title: Les interfaces
    text: |-
      Une **interface** liste des méthodes : `type Forme interface { Aire() float64 }`. Un type la **satisfait** dès
      qu'il a ces méthodes, sans le déclarer : il n'y a pas de `implements`. On peut donc définir une interface après
      coup, même pour des types qu'on n'a pas écrits.

      Une variable de type interface contient n'importe quelle valeur qui la satisfait, et un appel de méthode va à la
      bonne implémentation. Les interfaces Go sont petites : une ou deux méthodes.
    example:
      files:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          type Forme interface {
          	Aire() float64
          }

          type Carre struct{ Cote float64 }

          type Cercle struct{ Rayon float64 }

          func (c Carre) Aire() float64  { return c.Cote * c.Cote }
          func (c Cercle) Aire() float64 { return math.Pi * c.Rayon * c.Rayon }

          func total(formes []Forme) float64 {
          	somme := 0.0
          	for _, f := range formes {
          		somme += f.Aire()
          	}
          	return somme
          }

          func main() {
          	formes := []Forme{Carre{2}, Cercle{1}}
          	fmt.Printf("%.2f\n", total(formes))
          }
      output: |-
        7.14
    task:
      instructions: |-
        Ajoute un type `Rectangle` (une largeur, une hauteur) qui satisfait `Forme`, et mets `Rectangle{2, 3}` dans la
        liste : le programme doit afficher `13.14`.
      starter:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          type Forme interface {
          	Aire() float64
          }

          type Carre struct{ Cote float64 }

          type Cercle struct{ Rayon float64 }

          func (c Carre) Aire() float64  { return c.Cote * c.Cote }
          func (c Cercle) Aire() float64 { return math.Pi * c.Rayon * c.Rayon }

          func main() {
          	formes := []Forme{Carre{2}, Cercle{1}}
          	somme := 0.0
          	for _, f := range formes {
          		somme += f.Aire()
          	}
          	fmt.Printf("%.2f\n", somme)
          }
      solution:
        main.go: |-
          package main

          import (
          	"fmt"
          	"math"
          )

          type Forme interface {
          	Aire() float64
          }

          type Carre struct{ Cote float64 }

          type Cercle struct{ Rayon float64 }

          type Rectangle struct{ Largeur, Hauteur float64 }

          func (c Carre) Aire() float64     { return c.Cote * c.Cote }
          func (c Cercle) Aire() float64    { return math.Pi * c.Rayon * c.Rayon }
          func (r Rectangle) Aire() float64 { return r.Largeur * r.Hauteur }

          func main() {
          	formes := []Forme{Carre{2}, Cercle{1}, Rectangle{2, 3}}
          	somme := 0.0
          	for _, f := range formes {
          		somme += f.Aire()
          	}
          	fmt.Printf("%.2f\n", somme)
          }
      output: |-
        13.14
cards:
  - key: type-implemente-interface
    format: course
    question: Comment un type implémente-t-il une interface en Go ?
    choices:
      - {text: "Implicitement, en ayant toutes ses méthodes, sans mot-clé `implements`", correct: true}
      - {text: "Explicitement, en déclarant `implements` après le nom du type", correct: false}
      - {text: "En embarquant l'interface dans sa struct, puis en la remplissant", correct: false}
      - {text: "En s'enregistrant auprès de l'interface dans une fonction `init`", correct: false}
    answer: "Implicitement, en possédant toutes ses méthodes, sans mot-clé `implements`. La correspondance est vérifiée là où une valeur est convertie vers l'interface."
  - key: avantages-interfaces-implicites
    format: course
    question: "Quel est le principal avantage des interfaces implicites ?"
    choices:
      - {text: "Le découplage : le consommateur déclare l'interface après coup, sans toucher au type", correct: true}
      - {text: "La vitesse : un appel par interface est plus rapide qu'un appel direct", correct: false}
      - {text: "L'héritage multiple : un type hérite des méthodes de plusieurs interfaces", correct: false}
      - {text: "La sûreté : le compilateur vérifie chaque type dès sa déclaration", correct: false}
    answer: "Le découplage : une interface peut être définie après coup, par le consommateur, et des doublures de test s'écrivent à la main. Un appel par interface est indirect, donc un peu plus coûteux qu'un appel direct, pas plus rapide."
  - key: consommateur
    format: course
    question: Pourquoi définir une interface du côté du code qui l'utilise ?
    choices:
      - {text: "Le consommateur déclare juste ce qu'il appelle, et tout type compatible convient", correct: true}
      - {text: "Le compilateur ne cherche une interface que dans le package qui l'appelle", correct: false}
      - {text: "Le fournisseur doit importer l'interface pour pouvoir l'implémenter", correct: false}
      - {text: "Une interface déclarée ailleurs ne peut pas être doublée dans un test", correct: false}
    answer: 'Parce que l''implémentation n''a pas besoin de la connaître : le consommateur déclare exactement les méthodes dont il a besoin, et tout type compatible convient, y compris une doublure de test.'
  - key: nil
    format: course
    question: Que se passe-t-il quand on appelle une méthode sur une variable d'interface nil ?
    choices:
      - {text: "Une panic : aucun type concret ne peut recevoir l'appel", correct: true}
      - {text: "Rien : l'appel est ignoré, et renvoie les valeurs zéro", correct: false}
      - {text: "Une erreur de compilation : la variable n'est pas initialisée", correct: false}
      - {text: "La méthode est appelée avec un receveur nil, qu'elle peut tester", correct: false}
    answer: "Une panique (nil pointer dereference) : il n'y a pas de type concret à qui envoyer l'appel. Un pointeur nil rangé dans une interface, lui, a un type : sa méthode est appelée avec un receveur nil."
  - key: vf-implements
    format: true-false
    question: En Go, un type doit déclarer les interfaces qu'il implémente.
    truth: false
    answer: Il les implémente implicitement, en ayant leurs méthodes.
  - key: vf-autre-package
    format: true-false
    question: Un type peut implémenter une interface déclarée dans un package qu'il n'importe pas.
    truth: true
    answer: Seules les méthodes comptent ; c'est ce qui permet de découpler les packages.
  - key: vf-signature
    format: true-false
    question: Une méthode `Aire() int` satisfait une interface qui demande `Aire() float64`.
    truth: false
    answer: La signature doit correspondre exactement.
  - key: vf-plusieurs
    format: true-false
    question: Un même type peut implémenter plusieurs interfaces.
    truth: true
    answer: Par exemple `io.Reader`, `io.Writer` et `fmt.Stringer` à la fois.
  - key: qcm-implemente
    format: multiple-choice
    question: Lesquels implémentent `type Forme interface{ Aire() float64 }` ?
    choices:
      - text: '`type Carre struct{...}` avec `func (c Carre) Aire() float64`'
        correct: true
      - text: '`type Disque float64` avec `func (d Disque) Aire() float64`'
        correct: true
      - text: Un type avec `func (t T) Aire() int`
        correct: false
      - text: Un type avec `func (t T) aire() float64`, dans un autre package
        correct: false
    answer: La signature et le nom (exporté si l'interface vient d'ailleurs) doivent correspondre.
  - key: qcm-avantages
    format: multiple-choice
    question: "Lequel de ces avantages apportent les interfaces implicites ?"
    choices:
      - {text: "Des doublures de test écrites à la main, sans framework", correct: true}
      - {text: "Des appels plus rapides qu'un appel de méthode direct", correct: false}
      - {text: "L'héritage multiple entre les structs d'un même package", correct: false}
      - {text: "Une vérification de chaque type dès sa déclaration", correct: false}
    answer: "Une interface déclarée chez le consommateur se double en quelques lignes, et les packages ne dépendent pas les uns des autres. Un appel par interface est indirect, donc un peu plus coûteux qu'un appel direct."
  - key: qcm-valeur-zero
    format: multiple-choice
    question: Que vaut `var f Forme` ?
    choices:
      - text: nil
        correct: true
      - text: Un Carre de côté 0
        correct: false
      - text: Une interface vide qui accepte tous les appels
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: Une interface sans type concret vaut nil.
  - key: qcm-affectation
    format: multiple-choice
    question: Où le compilateur vérifie-t-il qu'un type implémente une interface ?
    choices:
      - {text: "Là où une valeur est affectée ou passée comme cette interface", correct: true}
      - {text: "À la déclaration du type, contre toutes les interfaces connues", correct: false}
      - {text: "Seulement à l'exécution, au premier appel d'une de ses méthodes", correct: false}
      - {text: "Pendant l'édition de liens, une fois tous les packages compilés", correct: false}
    answer: "La correspondance est vérifiée là où l'on convertit vers l'interface ; une ligne `var _ Forme = Carre{}` force cette vérification dans le package du type."
  - key: trous-interface
    format: fill-in
    question: |-
      Complète la déclaration :
      ```go
      type Forme ___ {
      	Aire() float64
      }
      ```
    blanks:
      - - interface
    answer: Une interface liste des signatures de méthodes.
  - key: trous-implementer
    format: fill-in
    question: |-
      Complète pour que `Carre` implémente `Forme` :
      ```go
      func (c Carre) ___() float64 { return c.Cote * c.Cote }
      ```
    blanks:
      - - Aire
    answer: Il suffit d'avoir la méthode, avec la bonne signature.
  - key: trous-slice
    format: fill-in
    question: |-
      Complète pour mélanger des formes de types différents :
      ```go
      formes := []___{Carre{2}, Cercle{1}}
      ```
    blanks:
      - - Forme
    answer: Un slice d'interfaces contient des valeurs de types concrets variés.
  - key: trous-doublure
    format: fill-in
    question: |-
      Complète la doublure de test qui implémente `Horloge interface{ Maintenant() time.Time }` :
      ```go
      type horlogeFixe struct{ t time.Time }

      func (h horlogeFixe) ___() time.Time { return h.t }
      ```
    blanks:
      - - Maintenant
    answer: Aucun framework de mock n'est nécessaire.
  - key: code-polymorphisme
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Forme interface{ Aire() float64 }

      type Carre struct{ C float64 }
      type Rect struct{ L, H float64 }

      func (c Carre) Aire() float64 { return c.C * c.C }
      func (r Rect) Aire() float64  { return r.L * r.H }

      total := 0.0
      for _, f := range []Forme{Carre{2}, Rect{2, 3}} {
      	total += f.Aire()
      }
      fmt.Println(total)
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`10.0`", correct: false}
    answer: '`10` : chaque appel va à la méthode du type concret.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\n\ntype Carre struct{ C float64 }\n\ntype Rect struct{ L, H float64 }\n\n\nfunc (c Carre) Aire() float64 { return c.C * c.C }\n\nfunc (r Rect) Aire() float64  { return r.L * r.H }\n\nfunc main() {\n\ttotal := 0.0\n\tfor _, f := range []Forme{Carre{2}, Rect{2, 3}} {\n\t\ttotal += f.Aire()\n\t}\n\tfmt.Println(total)\n}\n"
      output: '10'
  - key: code-type-dynamique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Forme interface{ Aire() float64 }
      type Carre struct{ C float64 }

      func (c Carre) Aire() float64 { return c.C * c.C }

      var f Forme
      fmt.Println(f == nil)
      f = Carre{3}
      fmt.Printf("%T %v\n", f, f.Aire())
      ```
    choices:
      - text: |-
          ```
          true
          main.Carre 9
          ```
        correct: true
      - text: |-
          ```
          true
          Carre 9
          ```
        correct: false
      - text: |-
          ```
          false
          main.Carre 9
          ```
        correct: false
      - text: |-
          ```
          true
          main.Forme 9
          ```
        correct: false
    answer: '`true` puis `main.Carre 9` : l''interface prend le type concret de la valeur affectée.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\ntype Carre struct{ C float64 }\n\n\nfunc (c Carre) Aire() float64 { return c.C * c.C }\n\nfunc main() {\n\tvar f Forme\n\tfmt.Println(f == nil)\n\tf = Carre{3}\n\tfmt.Printf(\"%T %v\\n\", f, f.Aire())\n}\n"
      output: |-
        true
        main.Carre 9
  - key: code-signature
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Forme interface{ Aire() float64 }
      type Carre struct{ C int }

      func (c Carre) Aire() int { return c.C * c.C }

      var f Forme = Carre{2}
      fmt.Println(f.Aire())
      ```
    choices:
      - {text: "Ça ne compile pas : `Aire() int` n'a pas la bonne signature", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`4.0`, le résultat converti en `float64`", correct: false}
      - {text: "Une panic : la conversion de `int` en `float64` échoue", correct: false}
    answer: "Ça ne compile pas : `Aire() int` n'a pas la signature `Aire() float64`, donc `Carre` n'implémente pas `Forme`. Go ne convertit jamais un type de retour."
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\ntype Carre struct{ C int }\n\n\nfunc (c Carre) Aire() int { return c.C * c.C }\n\nfunc main() {\n\tvar f Forme = Carre{2}\n\tfmt.Println(f.Aire())\n}\n"
      compiles: false
  - key: code-nil-appel
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Forme interface{ Aire() float64 }

      var f Forme
      fmt.Println("avant")
      fmt.Println(f.Aire())
      ```
    choices:
      - {text: "`avant`, puis une panic : nil pointer dereference", correct: true}
      - {text: "`avant`, puis `0`", correct: false}
      - {text: "Une panic, avant même d'afficher `avant`", correct: false}
      - {text: "Ça ne compile pas : `f` n'est pas initialisée", correct: false}
    answer: '`avant`, puis une panique : appeler une méthode sur une interface nil.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Forme interface{ Aire() float64 }\n\nfunc main() {\n\tvar f Forme\n\tfmt.Println(\"avant\")\n\tfmt.Println(f.Aire())\n}\n"
      output: avant
      panics: nil pointer dereference
  - key: bug-signature
    format: bug-fix
    question: |-
      Le compilateur signale « Fichier does not implement io.Writer (wrong type for method Write) ». Quelle correction est la bonne ?
      ```go
      func (f *Fichier) Write(p []byte) error { ... }
      ```
    choices:
      - {text: "Renvoyer `(n int, err error)`, la signature exacte de `io.Writer`", correct: true}
      - {text: "Passer le receveur en valeur : `func (f Fichier) Write(...)`", correct: false}
      - {text: "Renommer la méthode `WriteBytes`, pour éviter le conflit", correct: false}
      - {text: "Prendre une `string` au lieu d'un `[]byte` en paramètre", correct: false}
    answer: |-
      ```go
      func (f *Fichier) Write(p []byte) (n int, err error) { ... }
      ```
      `io.Writer` demande exactement `Write([]byte) (int, error)`.
  - key: bug-interface-producteur
    format: bug-fix
    question: |-
      Le package `stockage` déclare une grosse interface que personne n'utilise en entier, et chaque test doit la doubler en entier. Quelle correction est la bonne ?
      ```go
      package stockage

      type Depot interface {
      	Lire(id string) (Doc, error)
      	Ecrire(Doc) error
      	Supprimer(id string) error
      	Lister() ([]Doc, error)
      	Migrer() error
      }
      ```
    choices:
      - {text: "`stockage` exporte son type concret ; chaque consommateur déclare la petite interface qu'il utilise", correct: true}
      - {text: "Générer une doublure complète de `Depot` avec un outil de mock, partagée par tous les tests", correct: false}
      - {text: "Déplacer `Depot` dans un package `interfaces` commun, importé par le code et par les tests", correct: false}
      - {text: "Embarquer `Depot` dans chaque doublure de test, pour ne redéfinir que les méthodes utilisées", correct: false}
    answer: "```go\n// stockage exporte son type concret\ntype PostgresDepot struct{ ... }\n\n// le package qui l'utilise déclare seulement ce dont il a besoin\npackage rapport\n\ntype lecteur interface {\n\tLister() ([]stockage.Doc, error)\n}\n```\nL'interface se définit côté consommateur, avec les seules méthodes utilisées : les doublures de test deviennent\nminuscules."
  - key: bug-nil
    format: bug-fix
    question: |-
      Le service panique à la validation d'une commande quand la notification n'est pas configurée. Quelle correction est la bonne ?
      ```go
      type Service struct{ notif Notifieur }

      func (s *Service) Valider(c Commande) { s.notif.Envoyer(c) }
      ```
    choices:
      - {text: "Une implémentation `aucuneNotif` qui ne fait rien, mise par défaut à la construction", correct: true}
      - {text: "Un `recover()` dans `Valider`, qui ignore la panic quand la notification manque", correct: false}
      - {text: "Un receveur valeur pour `Valider`, pour que `s.notif` ne soit jamais nil", correct: false}
      - {text: "Un champ `notif *Notifieur`, pointeur vers l'interface, testé à chaque appel", correct: false}
    answer: "```go\ntype aucuneNotif struct{}\n\nfunc (aucuneNotif) Envoyer(Commande) {}\n\nfunc NouveauService(n Notifieur) *Service {\n\tif n == nil {\n\t\tn = aucuneNotif{}\n\t}\n\treturn &Service{notif: n}\n}\n```\nUn champ interface nil panique à l'appel ; une implémentation « qui ne fait rien » par défaut évite les tests de\nnil partout."
  - key: bug-nom
    format: bug-fix
    question: |-
      Le type n'implémente pas `fmt.Stringer`, et `Println` affiche la struct brute. Quelle correction est la bonne ?
      ```go
      func (c Commande) ToString() string { return "commande " + c.ID }
      ```
    choices:
      - {text: "Renommer la méthode `String`, le nom exact que demande `fmt.Stringer`", correct: true}
      - {text: "Passer le receveur en pointeur : `func (c *Commande) ToString()`", correct: false}
      - {text: "Embarquer `fmt.Stringer` dans la struct `Commande` pour l'implémenter", correct: false}
      - {text: "Ajouter le commentaire `// implements fmt.Stringer` au-dessus de la méthode", correct: false}
    answer: |-
      ```go
      func (c Commande) String() string { return "commande " + c.ID }
      ```
      L'interface implicite repose sur le nom exact : `fmt.Stringer` demande `String() string`.
