notion: accepter-interfaces
lesson: "Un principe de conception Go : **« accepter des interfaces, renvoyer des structs »**.\n\n**Accepter des interfaces** : une fonction prend en paramètre le comportement minimal dont elle a besoin.\n\n```go\n// dans le package qui consomme\ntype Expediteur interface {\n\tEnvoyer(ctx context.Context, m Message) error\n}\n\nfunc Relancer(ctx context.Context, e Expediteur, clients []Client) error { ... }\n```\n\nL'appelant passe ce qu'il veut (un client SMTP, une file de messages, une doublure de test).\n\n**Renvoyer des structs** : un constructeur renvoie le **type concret** (`*SMTPClient`), avec toutes ses méthodes et ses\nchamps exportés ; c'est l'appelant qui décide à quelle interface l'affecter. Renvoyer une interface cache des méthodes,\nfige l'API et empêche d'ajouter des méthodes sans casser les implémentations.\n\n**L'interface se définit chez le consommateur**, pas chez le fournisseur. Le package `smtp` exporte un type concret ;\nle package `relance` déclare l'interface `Expediteur`. Pas de package `interfaces` central, pas d'interface\n« préventive » pour chaque struct.\n\nExceptions : renvoyer une interface est justifié quand plusieurs implémentations sont choisies à l'exécution\n(`crypto.Hash.New()` renvoie un `hash.Hash`), ou pour cacher un type non exporté (`errors.New` renvoie `error`).\n\n**Piège classique** : un développeur Java qui crée une interface `IClientService` et une struct `ClientServiceImpl`\npour chaque service, sans second implémenteur ni consommateur qui en ait besoin.\n\n**En entretien** : « Accepter des interfaces petites, déclarées côté consommateur ; renvoyer des types concrets ; pas\nd'interface sans besoin réel. »"
cards:
  - key: collegue-venant-java-cree-interface-chaque
    format: scenario
    question: Un collègue venant de Java crée une interface pour chaque struct et des getters partout. Qu'en dis-tu ?
    choices:
      - {text: "Interfaces déclarées chez le consommateur quand un besoin réel apparaît ; champs exportés ou accesseur `Nom()`, pas `GetNom()`", correct: true}
      - {text: "C'est la bonne pratique : chaque struct doit exposer son interface pour pouvoir être doublée dans les tests", correct: false}
      - {text: "Garder les interfaces, mais les placer dans le package du fournisseur, juste à côté de chaque struct", correct: false}
      - {text: "Garder les getters, mais les nommer `GetNom()` pour suivre la convention de la bibliothèque standard", correct: false}
    answer: "Ce n'est pas idiomatique : en Go, les interfaces sont implicites et se déclarent chez celui qui les utilise, quand un test ou une seconde implémentation le demande. Un champ sans invariant s'exporte ; un accesseur s'appelle `Nom()`, jamais `GetNom()`."
  - key: signifie-accept-interfaces-return-structs
    format: course
    question: "Que conseille la maxime Go « accept interfaces, return structs » pour les paramètres et les valeurs de retour ?"
    choices:
      - {text: "Prendre en paramètre l'interface minimale utile, et renvoyer un type concret", correct: true}
      - {text: "Prendre en paramètre un type concret, et renvoyer une interface qui cache l'implémentation", correct: false}
      - {text: "Prendre et renvoyer des interfaces partout, pour découpler chaque appel", correct: false}
      - {text: "Prendre et renvoyer des structs partout, les interfaces étant réservées aux tests", correct: false}
    answer: "On accepte l'interface minimale dont la fonction a besoin, et on renvoie le type concret : l'appelant garde accès à toutes ses méthodes et choisit lui-même l'interface. Renvoyer une interface cache des méthodes sans raison."
  - key: definir-interface
    format: course
    question: "Le package `rapport` utilise le type `*Disque` du package `stockage`. Où déclarer l'interface qui permet de doubler `*Disque` dans les tests de `rapport` ?"
    choices:
      - {text: "Dans `rapport`, le consommateur, avec les seules méthodes qu'il appelle", correct: true}
      - {text: "Dans `stockage`, le fournisseur, juste à côté du type `*Disque`", correct: false}
      - {text: "Dans un package `interfaces` commun, importé par les deux", correct: false}
      - {text: "Nulle part : Go ne permet pas de doubler un type concret", correct: false}
    answer: "Du côté du consommateur, là où elle est utilisée : `rapport` déclare l'interface dont il a besoin, et `*Disque` la satisfait implicitement. La déclarer chez le fournisseur est un réflexe Java, inutile en Go."
  - key: signifie-accept-interfaces-return-structs-2
    format: course
    question: "Un constructeur lit un flux pour construire un analyseur. Quelle signature suit « accept interfaces, return structs » ?"
    choices:
      - {text: "`func NouvelAnalyseur(r io.Reader) *Analyseur`", correct: true}
      - {text: "`func NouvelAnalyseur(f *os.File) *Analyseur`", correct: false}
      - {text: "`func NouvelAnalyseur(r io.Reader) AnalyseurInterface`", correct: false}
      - {text: "`func NouvelAnalyseur(f *os.File) AnalyseurInterface`", correct: false}
    answer: "On accepte l'interface minimale (`io.Reader`) et on renvoie le type concret (`*Analyseur`). Un `*os.File` en paramètre interdit un buffer ou un test ; une interface en retour cache les méthodes du type."
  - key: quand-retourner-interface-depuis-factory
    format: course
    question: "Dans quel cas une fonction de fabrique a-t-elle raison de renvoyer une interface ?"
    choices:
      - {text: "Quand elle choisit l'implémentation à l'exécution, ou doit cacher le type", correct: true}
      - {text: "Toujours, pour que les appelants puissent écrire leurs tests", correct: false}
      - {text: "Quand le type concret n'a qu'une implémentation, mais beaucoup de méthodes", correct: false}
      - {text: "Jamais : une fabrique Go renvoie toujours un pointeur vers une struct", correct: false}
    answer: "Quand l'implémentation est choisie à l'exécution ou doit rester cachée. Les tests ne l'imposent pas : c'est le consommateur qui accepte une interface."
  - key: principe
    format: course
    question: "Selon « accepter des interfaces, renvoyer des structs », qui choisit l'interface par laquelle un type concret est utilisé ?"
    choices:
      - {text: "L'appelant : il reçoit le type concret et déclare l'interface minimale qui lui sert", correct: true}
      - {text: "Le fournisseur : il exporte une interface à côté de chacun de ses types concrets", correct: false}
      - {text: "Le compilateur : il déduit à chaque appel la plus petite interface possible", correct: false}
      - {text: "Personne : en Go, une fonction ne prend jamais d'interface en paramètre", correct: false}
    answer: "Les fonctions prennent le comportement minimal dont elles ont besoin (une interface), et les constructeurs renvoient le type concret, laissant l'appelant choisir l'interface."
  - key: ou-definir
    format: course
    question: "Où définir une interface en Go ?"
    choices:
      - {text: "Dans le package qui l'utilise, avec les seules méthodes qu'il appelle", correct: true}
      - {text: "Dans le package qui l'implémente, avec toutes les méthodes du type", correct: false}
      - {text: "Dans un package dédié aux interfaces, partagé par tout le projet", correct: false}
      - {text: "Dans le fichier du type concret, juste avant sa déclaration", correct: false}
    answer: "Dans le package qui l'utilise (le consommateur), avec les seules méthodes qu'il appelle ; le fournisseur exporte son type concret. Comme l'implémentation est implicite, rien n'oblige à la déclarer à côté du type."
  - key: retour-interface
    format: course
    question: Quand renvoyer une interface depuis un constructeur est-il justifié ?
    choices:
      - {text: "Pour choisir l'implémentation à l'exécution, ou cacher un type non exporté", correct: true}
      - {text: "Pour permettre aux utilisateurs du package de doubler le type dans leurs tests", correct: false}
      - {text: "Pour que le constructeur puisse renvoyer `nil` en cas d'erreur", correct: false}
      - {text: "Pour éviter de copier une grosse struct à chaque retour de fonction", correct: false}
    answer: "Quand l'implémentation est choisie à l'exécution parmi plusieurs, ou pour cacher un type non exporté (comme `errors.New` qui renvoie `error`). Les tests n'en ont pas besoin : le consommateur déclare sa propre interface."
  - key: java
    format: course
    question: Pourquoi le couple `IClientService` / `ClientServiceImpl` est-il peu idiomatique en Go ?
    choices:
      - {text: "L'interface n'a qu'une implémentation, et aucun consommateur qui en ait besoin", correct: true}
      - {text: "Go interdit le préfixe `I` dans le nom d'une interface exportée", correct: false}
      - {text: "Une struct ne peut pas implémenter une interface de son propre package", correct: false}
      - {text: "Le suffixe `Impl` empêche la satisfaction implicite de l'interface", correct: false}
    answer: "Une interface sans consommateur qui en ait besoin ni seconde implémentation n'apporte rien ; en Go, le consommateur déclare l'interface quand il en a besoin. Rien ne l'interdit pour autant : c'est du code inutile, pas une erreur de compilation."
  - key: vf-fournisseur
    format: true-false
    question: En Go, c'est le package qui implémente qui doit déclarer l'interface.
    truth: false
    answer: C'est plutôt le package qui consomme ; grâce aux interfaces implicites, l'implémentation n'a pas à la connaître.
  - key: vf-concret
    format: true-false
    question: Un constructeur qui renvoie un type concret reste facile à doubler dans les tests du consommateur.
    truth: true
    answer: Le consommateur accepte une interface ; le test lui passe une doublure, le code de production le type concret.
  - key: vf-package-interfaces
    format: true-false
    question: Regrouper toutes les interfaces du projet dans un package `interfaces` est une bonne pratique Go.
    truth: false
    answer: Chaque interface vit chez son consommateur ; un package central crée des dépendances inutiles.
  - key: vf-ajout
    format: true-false
    question: Ajouter une méthode à une interface exportée peut casser les implémentations des utilisateurs.
    truth: true
    answer: C'est une raison de garder les interfaces petites et de renvoyer des types concrets.
  - key: qcm-signatures
    format: multiple-choice
    question: "Une fonction écrit des commandes et n'appelle que `Write`. Quelle signature suit « accept interfaces, return structs » ?"
    choices:
      - {text: "`func Exporter(w io.Writer, cmds []Commande) error`", correct: true}
      - {text: "`func Exporter(f *os.File, cmds []Commande) error`", correct: false}
      - {text: "`func Exporter(w io.ReadWriteCloser, cmds []Commande) error`", correct: false}
      - {text: "`func Exporter(w *bytes.Buffer, cmds []Commande) error`", correct: false}
    answer: "`io.Writer` est le comportement minimal : un fichier, un buffer ou une réponse HTTP conviennent. De même, un constructeur renvoie `*Client`, pas une `ClientInterface` à implémentation unique."
  - key: qcm-ou
    format: multiple-choice
    question: Le package `relance` a besoin d'envoyer des messages via le package `smtp`. Où vit l'interface `Expediteur` ?
    choices:
      - text: Dans `relance`
        correct: true
      - text: Dans `smtp`
        correct: false
      - text: Dans un package `interfaces` partagé
        correct: false
      - text: Nulle part, Go n'a pas besoin d'interface
        correct: false
    answer: Le consommateur déclare ce dont il a besoin ; `smtp` n'a même pas à le savoir.
  - key: qcm-exceptions
    format: multiple-choice
    question: "Dans lequel de ces cas renvoyer une interface est-il raisonnable ?"
    choices:
      - {text: "Une fabrique qui choisit l'implémentation selon la configuration", correct: true}
      - {text: "Un constructeur qui n'a qu'une implémentation, pour « faire propre »", correct: false}
      - {text: "Un constructeur dont on veut pouvoir doubler le résultat dans les tests", correct: false}
      - {text: "Un constructeur dont la struct est trop grosse pour être copiée", correct: false}
    answer: "Une fabrique qui choisit l'implémentation à l'exécution renvoie l'interface commune, comme `sha256.New()` renvoie un `hash.Hash`. Les tests n'imposent pas de renvoyer une interface : c'est le consommateur qui en accepte une."
  - key: qcm-benefices
    format: multiple-choice
    question: "Lesquels de ces bénéfices apporte une petite interface déclarée chez le consommateur ?"
    choices:
      - text: Des doublures de test de quelques lignes
        correct: true
      - text: Un fournisseur qui peut évoluer sans casser ses consommateurs
        correct: true
      - text: Des appels plus rapides
        correct: false
      - text: Le droit d'utiliser l'héritage
        correct: false
    answer: Le découplage est le vrai bénéfice.
  - key: bug-interface-inutile
    format: bug-fix
    question: |-
      En revue, ce code déclare une interface qui n'a qu'une implémentation et aucun consommateur qui la double. Quelle simplification est la bonne ?
      ```go
      type IFacturation interface {
      	Facturer(c Commande) (Facture, error)
      }

      type FacturationImpl struct{ db *sql.DB }

      func NewFacturation(db *sql.DB) IFacturation { return &FacturationImpl{db} }
      ```
    choices:
      - {text: "Supprimer l'interface : le constructeur renvoie `*Facturation`, et le consommateur déclare l'interface s'il en a besoin", correct: true}
      - {text: "Garder l'interface, renommée `Facturation`, et rendre le type `facturation` non exporté pour cacher l'implémentation", correct: false}
      - {text: "Garder l'interface et ajouter une seconde implémentation factice, pour justifier son existence dans les tests", correct: false}
      - {text: "Déplacer l'interface dans un package `interfaces` commun, importé par le fournisseur et par ses consommateurs", correct: false}
    answer: |-
      ```go
      type Facturation struct{ db *sql.DB }

      func NouvelleFacturation(db *sql.DB) *Facturation { return &Facturation{db} }

      // le consommateur qui a besoin d'abstraction déclare :
      // type facturateur interface { Facturer(Commande) (Facture, error) }
      ```
      Une seule implémentation, pas de consommateur qui en ait besoin : le type concret suffit ; l'interface viendra chez
      celui qui veut le doubler.
  - key: bug-parametre-concret
    format: bug-fix
    question: |-
      Cette fonction est impossible à tester sans base de données. Quelle correction est la bonne ?
      ```go
      func Rapport(depot *PostgresDepot, mois time.Month) (string, error) {
      	ventes, err := depot.VentesDuMois(mois)
      	...
      }
      ```
    choices:
      - {text: "Accepter une petite interface `sourceVentes`, avec la seule méthode `VentesDuMois`", correct: true}
      - {text: "Accepter `any`, puis faire une assertion vers `*PostgresDepot` dans la fonction", correct: false}
      - {text: "Lancer une vraie base PostgreSQL dans chaque test unitaire de `Rapport`", correct: false}
      - {text: "Exporter une interface `DepotInterface` avec toutes les méthodes du dépôt", correct: false}
    answer: "```go\ntype sourceVentes interface {\n\tVentesDuMois(time.Month) ([]Vente, error)\n}\n\nfunc Rapport(src sourceVentes, mois time.Month) (string, error) { ... }\n```\nEn acceptant une petite interface, la fonction se teste avec une doublure de quelques lignes."
  - key: bug-retour-interface
    format: bug-fix
    question: Un package exporte `func Nouveau() Client` où `Client` est une interface de douze méthodes, avec une seule implémentation. Les utilisateurs ne peuvent pas accéder à un réglage du type concret. Que proposes-tu ?
    choices:
      - {text: "Exporter le type concret `Client` et renvoyer `*Client` ; chacun déclare la petite interface qui lui sert", correct: true}
      - {text: "Ajouter à l'interface `Client` une treizième méthode, qui donne enfin accès au réglage demandé", correct: false}
      - {text: "Documenter l'assertion `c.(*client)`, pour que les utilisateurs récupèrent eux-mêmes le type concret", correct: false}
      - {text: "Découper `Client` en douze interfaces d'une méthode, toutes renvoyées ensemble par `Nouveau`", correct: false}
    answer: |-
      ```go
      type Client struct { ... } // le type concret, exporté

      func Nouveau(opts ...Option) *Client { ... }
      ```
      Renvoyer le type concret donne accès à toutes ses méthodes et laisse chaque utilisateur déclarer la petite
      interface dont il a besoin. Le package peut ajouter des méthodes sans casser personne.
  - key: bug-gros-parametre
    format: bug-fix
    question: |-
      Une fonction qui ne fait qu'écrire prend un `*os.File` : impossible de l'utiliser avec un buffer ou dans un test. Quelle correction est la bonne ?
      ```go
      func EcrireEntete(f *os.File, titre string) error {
      	_, err := fmt.Fprintf(f, "# %s\n", titre)
      	return err
      }
      ```
    choices:
      - {text: "Accepter un `io.Writer`, puisque seule l'écriture sert", correct: true}
      - {text: "Accepter un `*bufio.Writer`, plus rapide qu'un fichier", correct: false}
      - {text: "Accepter un `io.ReadWriteCloser`, pour couvrir tous les usages", correct: false}
      - {text: "Accepter `any`, et tester le type avec un type switch", correct: false}
    answer: "```go\nfunc EcrireEntete(w io.Writer, titre string) error {\n\t_, err := fmt.Fprintf(w, \"# %s\\n\", titre)\n\treturn err\n}\n```\nElle n'utilise que `Write` : accepter un `io.Writer` la rend utilisable avec un buffer, une réponse HTTP ou un test."
  - key: scenario-paiement
    format: scenario
    question: Ton service appelle une API de paiement externe. Comment le rends-tu testable ?
    choices:
      - {text: "Le service déclare une petite interface `passerelle`, reçue à la construction ; en test, une doublure", correct: true}
      - {text: "Le service crée lui-même le client HTTP réel, et les tests appellent le bac à sable du prestataire", correct: false}
      - {text: "Le prestataire exporte une interface de toutes ses méthodes, que le service importe et simule", correct: false}
      - {text: "Le service garde le client HTTP dans une variable globale, que chaque test remplace à son tour", correct: false}
    answer: |-
      Le service déclare une petite interface pour ce qu'il utilise (`type passerelle interface{ Debiter(ctx, montant,
      carte) (Transaction, error) }`) et la reçoit à la construction. Le client HTTP réel la satisfait implicitement. En
      test, je passe une doublure qui renvoie des réponses choisies, y compris les erreurs et les délais. Le client HTTP
      lui-même se teste séparément contre un `httptest.Server`.
  - key: scenario-java
    format: scenario
    question: Un collègue venant de Java crée une interface pour chaque struct, « au cas où ». Comment le convaincs-tu de changer ?
    choices:
      - {text: "Une interface s'ajoute plus tard chez le consommateur sans toucher au code : attendre ne coûte rien", correct: true}
      - {text: "Le compilateur Go refuse une interface qui n'a qu'une seule implémentation dans le module", correct: false}
      - {text: "Les appels par interface sont trop lents en Go pour être utilisés en dehors des tests", correct: false}
      - {text: "En Go, une struct ne peut satisfaire qu'une seule interface à la fois, il faut donc choisir", correct: false}
    answer: |-
      En Go, les interfaces implicites permettent de les ajouter plus tard, chez le consommateur, sans toucher au code
      existant : il n'y a pas de coût à attendre d'en avoir besoin. Les interfaces préventives ajoutent du code, cachent
      les méthodes du type concret et figent l'API. Je propose de supprimer celles qui n'ont qu'une implémentation et
      aucun consommateur qui les double, et de déclarer les autres là où on les utilise.
  - key: scenario-hexagonal
    format: scenario
    question: Dans une architecture hexagonale en Go, où places-tu l'interface du dépôt des commandes ?
    choices:
      - {text: "Dans le cœur (domaine ou application), qui la consomme ; l'adaptateur PostgreSQL l'implémente", correct: true}
      - {text: "Dans l'adaptateur PostgreSQL, qui l'implémente, et le domaine importe ce package", correct: false}
      - {text: "Dans un package `interfaces` à la racine du module, partagé par toutes les couches", correct: false}
      - {text: "Nulle part : le domaine appelle directement le type `*PgDepot`, c'est plus simple", correct: false}
    answer: |-
      Dans le cœur (le domaine ou la couche application), qui la consomme : c'est le port, défini selon les besoins du
      métier (`type DepotCommandes interface{ Trouver(...); Sauver(...) }`). L'adaptateur PostgreSQL, dans
      l'infrastructure, l'implémente implicitement et vérifie la correspondance avec `var _ app.DepotCommandes =
      (*PgDepot)(nil)`. Le domaine ne dépend ainsi d'aucune technologie.
