notion: accepter-interfaces
lesson: "Un principe de conception Go : **« accepter des interfaces, renvoyer des structs »**.\n\n**Accepter des interfaces** : une fonction prend en paramètre le comportement minimal dont elle a besoin.\n\n```go\n// dans le package qui consomme\ntype Expediteur interface {\n\tEnvoyer(ctx context.Context, m Message) error\n}\n\nfunc Relancer(ctx context.Context, e Expediteur, clients []Client) error { ... }\n```\n\nL'appelant passe ce qu'il veut (un client SMTP, une file de messages, une doublure de test).\n\n**Renvoyer des structs** : un constructeur renvoie le **type concret** (`*SMTPClient`), avec toutes ses méthodes et ses\nchamps exportés ; c'est l'appelant qui décide à quelle interface l'affecter. Renvoyer une interface cache des méthodes,\nfige l'API et empêche d'ajouter des méthodes sans casser les implémentations.\n\n**L'interface se définit chez le consommateur**, pas chez le fournisseur. Le package `smtp` exporte un type concret ;\nle package `relance` déclare l'interface `Expediteur`. Pas de package `interfaces` central, pas d'interface\n« préventive » pour chaque struct.\n\nExceptions : renvoyer une interface est justifié quand plusieurs implémentations sont choisies à l'exécution\n(`crypto.Hash.New()` renvoie un `hash.Hash`), ou pour cacher un type non exporté (`errors.New` renvoie `error`).\n\n**Piège classique** : un développeur Java qui crée une interface `IClientService` et une struct `ClientServiceImpl`\npour chaque service, sans second implémenteur ni consommateur qui en ait besoin.\n\n**En entretien** : « Accepter des interfaces petites, déclarées côté consommateur ; renvoyer des types concrets ; pas\nd'interface sans besoin réel. »"
cards:
  - key: collegue-venant-java-cree-interface-chaque
    format: scenario
    question: Un collègue venant de Java crée une interface pour chaque struct et des getters partout. Qu'en dis-tu ?
    answer: |-
      C'est un réflexe compréhensible, mais ce n'est pas idiomatique en Go. En Go, les interfaces sont **implicites** et se déclarent du côté de **celui qui les utilise**, quand on en a besoin (pour un test ou plusieurs implémentations réelles), et elles sont petites. Une interface créée par avance pour chaque struct ajoute une indirection sans valeur.
      Pour les getters, si un champ n'a pas d'invariant à protéger, on l'exporte simplement ; si on a besoin d'un accesseur, il s'appelle `Nom()` et non `GetNom()`. Je lui recommanderais *Effective Go* et les *Go Code Review Comments*, et j'en discuterais en revue de code sur des cas concrets plutôt que par principe.
  - key: signifie-accept-interfaces-return-structs
    format: course
    question: Que signifie "accept interfaces, return structs" ?
    answer: Accepter l'interface minimale en paramètre, renvoyer un type concret.
  - key: definir-interface
    format: course
    question: Où définir une interface ?
    answer: Du côté du consommateur, là où elle est utilisée.
  - key: signifie-accept-interfaces-return-structs-2
    format: course
    question: Que signifie "accept interfaces, return structs" ?
    answer: Accepter des interfaces minimales, renvoyer des types concrets.
  - key: quand-retourner-interface-depuis-factory
    format: course
    question: Quand retourner une interface depuis une factory ?
    answer: Quand l'implémentation est choisie à l'exécution ou doit rester cachée.
  - key: principe
    format: course
    question: Que signifie « accepter des interfaces, renvoyer des structs » ?
    answer: Les fonctions prennent le comportement minimal dont elles ont besoin (une interface), et les constructeurs renvoient le type concret, laissant l'appelant choisir l'interface.
  - key: ou-definir
    format: course
    question: Où définir une interface en Go ?
    answer: Dans le package qui l'utilise (le consommateur), avec les seules méthodes qu'il appelle ; le fournisseur exporte son type concret.
  - key: retour-interface
    format: course
    question: Quand renvoyer une interface depuis un constructeur est-il justifié ?
    answer: Quand l'implémentation est choisie à l'exécution parmi plusieurs, ou pour cacher un type non exporté (comme `errors.New` qui renvoie `error`).
  - key: java
    format: course
    question: Pourquoi le couple `IClientService` / `ClientServiceImpl` est-il peu idiomatique en Go ?
    answer: Une interface sans consommateur qui en ait besoin ni seconde implémentation n'apporte rien ; en Go, le consommateur déclare l'interface quand il en a besoin.
  - key: vf-fournisseur
    format: true-false
    question: En Go, c'est le package qui implémente qui doit déclarer l'interface.
    truth: false
    answer: C'est plutôt le package qui consomme ; grâce aux interfaces implicites, l'implémentation n'a pas à la connaître.
  - key: vf-concret
    format: true-false
    question: Un constructeur qui renvoie un type concret reste facile à doubler dans les tests du consommateur.
    truth: true
    answer: Le consommateur accepte une interface ; le test lui passe une doublure, le code de production le type concret.
  - key: vf-package-interfaces
    format: true-false
    question: Regrouper toutes les interfaces du projet dans un package `interfaces` est une bonne pratique Go.
    truth: false
    answer: Chaque interface vit chez son consommateur ; un package central crée des dépendances inutiles.
  - key: vf-ajout
    format: true-false
    question: Ajouter une méthode à une interface exportée peut casser les implémentations des utilisateurs.
    truth: true
    answer: C'est une raison de garder les interfaces petites et de renvoyer des types concrets.
  - key: qcm-signatures
    format: multiple-choice
    question: Quelles signatures suivent le principe ?
    choices:
      - text: '`func Exporter(w io.Writer, cmds []Commande) error`'
        correct: true
      - text: '`func NouveauClient(url string) *Client`'
        correct: true
      - text: '`func NouveauClient(url string) ClientInterface` avec une seule implémentation'
        correct: false
      - text: '`func Exporter(f *os.File, cmds []Commande) error` quand seul Write sert'
        correct: false
    answer: On accepte le comportement minimal et l'on renvoie le concret.
  - key: qcm-ou
    format: multiple-choice
    question: Le package `relance` a besoin d'envoyer des messages via le package `smtp`. Où vit l'interface `Expediteur` ?
    choices:
      - text: Dans `relance`
        correct: true
      - text: Dans `smtp`
        correct: false
      - text: Dans un package `interfaces` partagé
        correct: false
      - text: Nulle part, Go n'a pas besoin d'interface
        correct: false
    answer: Le consommateur déclare ce dont il a besoin ; `smtp` n'a même pas à le savoir.
  - key: qcm-exceptions
    format: multiple-choice
    question: Dans quels cas renvoyer une interface est-il raisonnable ?
    choices:
      - text: '`hash` : `sha256.New()` renvoie un `hash.Hash`'
        correct: true
      - text: Une fabrique qui choisit l'implémentation selon la configuration
        correct: true
      - text: Un constructeur qui n'a qu'une implémentation, pour « faire propre »
        correct: false
      - text: Pour pouvoir écrire des tests
        correct: false
    answer: 'Les tests n''imposent pas de renvoyer une interface : le consommateur accepte une interface.'
  - key: qcm-benefices
    format: multiple-choice
    question: Que gagne-t-on à déclarer de petites interfaces chez le consommateur ?
    choices:
      - text: Des doublures de test de quelques lignes
        correct: true
      - text: Un fournisseur qui peut évoluer sans casser ses consommateurs
        correct: true
      - text: Des appels plus rapides
        correct: false
      - text: Le droit d'utiliser l'héritage
        correct: false
    answer: Le découplage est le vrai bénéfice.
  - key: bug-interface-inutile
    format: bug-fix
    question: "En revue, simplifiez :\n```go\ntype IFacturation interface {\n\tFacturer(c Commande) (Facture, error)\n}\n\ntype FacturationImpl struct{ db *sql.DB }\n\nfunc NewFacturation(db *sql.DB) IFacturation { return &FacturationImpl{db} }\n```"
    answer: |-
      ```go
      type Facturation struct{ db *sql.DB }

      func NouvelleFacturation(db *sql.DB) *Facturation { return &Facturation{db} }

      // le consommateur qui a besoin d'abstraction déclare :
      // type facturateur interface { Facturer(Commande) (Facture, error) }
      ```
      Une seule implémentation, pas de consommateur qui en ait besoin : le type concret suffit ; l'interface viendra chez
      celui qui veut le doubler.
  - key: bug-parametre-concret
    format: bug-fix
    question: "Cette fonction est impossible à tester sans base de données :\n```go\nfunc Rapport(depot *PostgresDepot, mois time.Month) (string, error) {\n\tventes, err := depot.VentesDuMois(mois)\n\t...\n}\n```"
    answer: "```go\ntype sourceVentes interface {\n\tVentesDuMois(time.Month) ([]Vente, error)\n}\n\nfunc Rapport(src sourceVentes, mois time.Month) (string, error) { ... }\n```\nEn acceptant une petite interface, la fonction se teste avec une doublure de quelques lignes."
  - key: bug-retour-interface
    format: bug-fix
    question: Un package exporte `func Nouveau() Client` où `Client` est une interface de douze méthodes, avec une seule implémentation. Les utilisateurs ne peuvent pas accéder à un réglage du type concret. Que proposes-tu ?
    answer: |-
      ```go
      type Client struct { ... } // le type concret, exporté

      func Nouveau(opts ...Option) *Client { ... }
      ```
      Renvoyer le type concret donne accès à toutes ses méthodes et laisse chaque utilisateur déclarer la petite
      interface dont il a besoin. Le package peut ajouter des méthodes sans casser personne.
  - key: bug-gros-parametre
    format: bug-fix
    question: "Une fonction qui ne fait qu'écrire prend un `*os.File` :\n```go\nfunc EcrireEntete(f *os.File, titre string) error {\n\t_, err := fmt.Fprintf(f, \"# %s\\n\", titre)\n\treturn err\n}\n```"
    answer: "```go\nfunc EcrireEntete(w io.Writer, titre string) error {\n\t_, err := fmt.Fprintf(w, \"# %s\\n\", titre)\n\treturn err\n}\n```\nElle n'utilise que `Write` : accepter un `io.Writer` la rend utilisable avec un buffer, une réponse HTTP ou un test."
  - key: scenario-paiement
    format: scenario
    question: Ton service appelle une API de paiement externe. Comment le rends-tu testable ?
    answer: |-
      Le service déclare une petite interface pour ce qu'il utilise (`type passerelle interface{ Debiter(ctx, montant,
      carte) (Transaction, error) }`) et la reçoit à la construction. Le client HTTP réel la satisfait implicitement. En
      test, je passe une doublure qui renvoie des réponses choisies, y compris les erreurs et les délais. Le client HTTP
      lui-même se teste séparément contre un `httptest.Server`.
  - key: scenario-java
    format: scenario
    question: Un collègue venant de Java crée une interface pour chaque struct, « au cas où ». Comment le convaincs-tu de changer ?
    answer: |-
      En Go, les interfaces implicites permettent de les ajouter plus tard, chez le consommateur, sans toucher au code
      existant : il n'y a pas de coût à attendre d'en avoir besoin. Les interfaces préventives ajoutent du code, cachent
      les méthodes du type concret et figent l'API. Je propose de supprimer celles qui n'ont qu'une implémentation et
      aucun consommateur qui les double, et de déclarer les autres là où on les utilise.
  - key: scenario-hexagonal
    format: scenario
    question: Dans une architecture hexagonale en Go, où places-tu l'interface du dépôt des commandes ?
    answer: |-
      Dans le cœur (le domaine ou la couche application), qui la consomme : c'est le port, défini selon les besoins du
      métier (`type DepotCommandes interface{ Trouver(...); Sauver(...) }`). L'adaptateur PostgreSQL, dans
      l'infrastructure, l'implémente implicitement et vérifie la correspondance avec `var _ app.DepotCommandes =
      (*PgDepot)(nil)`. Le domaine ne dépend ainsi d'aucune technologie.
