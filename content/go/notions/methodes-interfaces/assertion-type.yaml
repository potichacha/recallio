notion: assertion-type
lesson: |-
  Une **assertion de type** récupère le type concret contenu dans une interface :

  ```go
  var v any = "bonjour"

  s := v.(string)        // "bonjour" ; si v n'est pas une string : PANIQUE
  s, ok := v.(string)    // forme sûre : ok vaut false si ce n'est pas une string
  n, ok := v.(int)       // 0, false

  var w io.Writer = os.Stdout
  f, ok := w.(*os.File)  // vers un type concret
  rw, ok := w.(io.ReadWriter) // ou vers une autre interface
  ```

  - La forme à **une** valeur panique si le type ne correspond pas ; la forme **`v, ok`** ne panique jamais.
  - On peut asserter vers un **type concret** (`*os.File`) ou vers une **autre interface** (`io.ReadWriter`) : on teste
    alors si la valeur a des méthodes en plus.
  - C'est le mécanisme des **interfaces optionnelles** : `io.Copy` vérifie si la source implémente `io.WriterTo` pour
    aller plus vite, `http.ResponseWriter` peut être un `http.Flusher`.
  - Sur une interface **nil**, l'assertion échoue (`ok` faux, ou panique sans `ok`).

  Pour plusieurs types possibles, un **type switch** est plus lisible qu'une suite d'assertions.

  **Piège classique** : écrire `v.(string)` sans `ok` sur une donnée qui vient de l'extérieur (JSON, contexte, cache) ;
  la première valeur inattendue fait paniquer le service.

  **En entretien** : « v.(T) récupère le type concret, et panique si ce n'est pas le bon ; la forme v, ok ne panique
  pas ; on peut asserter vers une interface pour détecter des capacités optionnelles. »
tour:
  - title: L'assertion de type
    text: |-
      `v.(T)` récupère la valeur de type `T` que contient l'interface `v`. Si `v` ne contient pas un `T`, l'assertion
      provoque une **panic**.

      La forme à deux valeurs ne panique jamais : `n, ok := v.(int)` donne `ok` à `false` et la valeur zéro si le type
      ne correspond pas. On l'utilise dès que le type n'est pas certain.

      `T` peut aussi être une interface : `v.(fmt.Stringer)` demande si la valeur a une méthode `String`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func main() {
          	var v any = "Go"
          	s := v.(string)
          	fmt.Println(s, len(s))

          	n, ok := v.(int)
          	fmt.Println(n, ok)

          	if texte, ok := v.(string); ok {
          		fmt.Println("une chaîne :", texte)
          	}
          }
      output: |-
        Go 2
        0 false
        une chaîne : Go
cards:
  - key: passe-si-type-assertion-echoue
    format: course
    question: "Que se passe-t-il quand une assertion de type `x.(T)` échoue ?"
    choices:
      - {text: "Une panic avec `x.(T)` ; `ok` vaut `false` avec `v, ok := x.(T)`", correct: true}
      - {text: "Elle renvoie toujours la valeur zéro de `T`, sans signaler d'erreur", correct: false}
      - {text: "Elle renvoie une `error` en second résultat, qu'il faut tester", correct: false}
      - {text: "Elle convertit la valeur vers `T` quand c'est possible, sinon panique", correct: false}
    answer: "La forme simple panique ; la forme à deux valeurs donne `ok` à `false` et la valeur zéro de `T`. Une assertion ne convertit jamais : elle vérifie le type contenu."
  - key: interface-optionnelle
    format: course
    question: "Qu'appelle-t-on une interface optionnelle en Go ?"
    choices:
      - {text: "Une capacité testée à l'exécution par assertion, comme `io.WriterTo` dans `io.Copy`", correct: true}
      - {text: "Une interface dont un type peut n'implémenter qu'une partie des méthodes", correct: false}
      - {text: "Un paramètre de type interface qui peut valoir `nil` sans provoquer de panic", correct: false}
      - {text: "Une interface marquée `optional`, que le compilateur ne vérifie pas", correct: false}
    answer: "Une capacité supplémentaire testée à l'exécution : `io.Copy` vérifie si la source est un `io.WriterTo` pour aller plus vite. Un type qui satisfait une interface en a toujours toutes les méthodes : il n'y a pas de méthode facultative."
  - key: terme-type-assertion-type-switch
    format: course
    question: "À quoi servent l'assertion de type et le type switch ?"
    choices:
      - {text: "À récupérer le type concret de la valeur contenue dans une interface", correct: true}
      - {text: "À convertir une valeur d'un type numérique vers un autre type", correct: false}
      - {text: "À vérifier à la compilation qu'un type implémente une interface", correct: false}
      - {text: "À déclarer un nouveau type nommé à partir d'un type existant", correct: false}
    answer: "Ils récupèrent, à l'exécution, le type concret contenu dans une interface. Ce ne sont pas des conversions (`float64(n)`), et la vérification à la compilation s'écrit `var _ I = T{}`."
  - key: forme-sure
    format: course
    question: Comment faire une assertion de type sans risque de panique ?
    choices:
      - {text: "`v, ok := x.(T)` : `ok` vaut `false` si le type ne correspond pas", correct: true}
      - {text: "`v := x.(T)` dans un bloc `try`, qui attrape l'erreur", correct: false}
      - {text: "`v, err := x.(T)` : `err` décrit le type réellement trouvé", correct: false}
      - {text: "`v := T(x)` : la conversion échoue sans paniquer", correct: false}
    answer: "Avec la forme à deux valeurs, `v, ok := x.(T)` : `ok` vaut false et `v` la valeur zéro de T si le type ne correspond pas. Go n'a pas de `try`, et l'assertion ne renvoie jamais d'`error`."
  - key: vers-interface
    format: course
    question: À quoi sert une assertion vers une interface, comme `w.(io.StringWriter)` ?
    choices:
      - {text: "À tester si la valeur a aussi d'autres méthodes, pour une capacité optionnelle", correct: true}
      - {text: "À convertir la valeur en `string` avant de l'écrire dans `w`", correct: false}
      - {text: "À vérifier à la compilation que `w` implémente `io.StringWriter`", correct: false}
      - {text: "À copier la valeur de `w` dans une nouvelle interface, détachée de `w`", correct: false}
    answer: À tester si la valeur a aussi d'autres méthodes, pour utiliser une capacité optionnelle (écrire une chaîne sans conversion, vider un tampon...).
  - key: vf-panique
    format: true-false
    question: '`s := v.(string)` panique si `v` contient un int.'
    truth: true
    answer: '« interface conversion: interface {} is int, not string ».'
  - key: vf-ok
    format: true-false
    question: La forme `s, ok := v.(string)` peut paniquer.
    truth: false
    answer: Elle ne panique jamais ; `ok` dit si l'assertion a réussi.
  - key: vf-nil
    format: true-false
    question: Une assertion `v.(T)` sur une interface nil réussit et donne la valeur zéro.
    truth: false
    answer: 'Elle échoue : panique sans `ok`, `ok == false` avec.'
  - key: vf-type-concret
    format: true-false
    question: On ne peut pas faire une assertion sur une variable de type concret (non interface).
    truth: true
    answer: '« invalid operation: x (variable of type int) is not an interface ».'
  - key: qcm-resultats
    format: multiple-choice
    question: "Avec `var v any = 42`, laquelle de ces affirmations est juste ?"
    choices:
      - {text: "`s, ok := v.(string)` donne `\"\"` et `false`", correct: true}
      - {text: "`s := v.(string)` donne `\"\"`", correct: false}
      - {text: "`f := v.(float64)` donne `42.0`", correct: false}
      - {text: "`n, ok := v.(int64)` donne `42` et `true`", correct: false}
    answer: "La forme à deux valeurs ne panique pas : elle donne la valeur zéro et `false`. Sans `ok`, une assertion ratée panique, et il n'y a pas de conversion implicite : `42` est un `int`, ni un `float64` ni un `int64`."
  - key: qcm-optionnelle
    format: multiple-choice
    question: Comment un handler HTTP peut-il envoyer une réponse au fil de l'eau si le serveur le permet ?
    choices:
      - {text: "`if f, ok := w.(http.Flusher); ok { f.Flush() }`", correct: true}
      - {text: "`w.Flush()` directement, la méthode est toujours là", correct: false}
      - {text: "`http.Flusher(w).Flush()`, une conversion explicite", correct: false}
      - {text: "Impossible : un handler Go n'envoie qu'à la fin", correct: false}
    answer: '`http.ResponseWriter` n''a pas `Flush` ; on teste la capacité optionnelle (ou l''on passe par `http.NewResponseController`).'
  - key: qcm-plusieurs
    format: multiple-choice
    question: "Dans quel cas un type switch est-il préférable à une assertion `v, ok := x.(T)` ?"
    choices:
      - {text: "Quand la valeur peut être de plusieurs types, à traiter chacun à sa façon", correct: true}
      - {text: "Quand on ne teste qu'un seul type, pour éviter la variable `ok`", correct: false}
      - {text: "Jamais : une suite d'assertions est toujours plus rapide et plus claire", correct: false}
      - {text: "Quand on veut convertir la valeur vers un type numérique plus large", correct: false}
    answer: "Plusieurs types à traiter différemment, avec un `default` lisible : c'est le cas du type switch. Pour un seul type, `v, ok := x.(T)` suffit."
  - key: qcm-valides
    format: multiple-choice
    question: "Avec `var w io.Writer = os.Stdout`, laquelle de ces assertions ne compile pas ?"
    choices:
      - {text: "`os.Stdout.(io.Writer)`", correct: true}
      - {text: "`w.(*os.File)`", correct: false}
      - {text: "`w.(io.ReadWriter)`", correct: false}
      - {text: "`w.(fmt.Stringer)`", correct: false}
    answer: "`os.Stdout` est un `*os.File`, pas une interface : on n'asserte que sur une valeur d'interface. Vers un type concret qui a `Write`, ou vers n'importe quelle interface, l'assertion compile ; `w.(int)` serait refusée, `int` n'ayant pas de `Write`."
  - key: trous-ok
    format: fill-in
    question: |-
      Complète l'assertion sûre :
      ```go
      if s, ___ := v.(string); ok {
      	fmt.Println(strings.ToUpper(s))
      }
      ```
    blanks:
      - - ok
    answer: La forme à deux valeurs.
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour récupérer le `*os.File` derrière un `io.Writer` :
      ```go
      f, ok := w.(___)
      ```
    blanks:
      - - '*os.File'
    answer: L'assertion vers un type concret.
  - key: trous-interface
    format: fill-in
    question: |-
      Complète pour tester si la source sait s'écrire elle-même :
      ```go
      if wt, ok := src.(io.___); ok {
      	return wt.WriteTo(dst)
      }
      ```
    blanks:
      - - WriterTo
    answer: C'est ce que fait `io.Copy` pour éviter un tampon intermédiaire.
  - key: trous-syntaxe
    format: fill-in
    question: |-
      Complète la syntaxe :
      ```go
      n := valeur___int)
      ```
    blanks:
      - - .(
    answer: L'assertion s'écrit `x.(T)`.
  - key: code-assertions
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var v any = 42
      n, ok := v.(int)
      s, ok2 := v.(string)
      fmt.Printf("%d %t %q %t\n", n, ok, s, ok2)
      ```
    choices:
      - {text: "`42 true \"\" false`", correct: true}
      - {text: "`42 true <nil> false`", correct: false}
      - {text: "`42 true \"42\" false`", correct: false}
      - {text: "`42 true \"\" true`", correct: false}
    answer: '`42 true "" false` : l''assertion ratée donne la valeur zéro et false.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any = 42\n\tn, ok := v.(int)\n\ts, ok2 := v.(string)\n\tfmt.Printf(\"%d %t %q %t\\n\", n, ok, s, ok2)\n}\n"
      output: 42 true "" false
  - key: code-panique
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var v any = 42
      s := v.(string)
      fmt.Println(s)
      ```
    choices:
      - {text: "Une panic : interface conversion, `interface {} is int, not string`", correct: true}
      - {text: "`42`, converti en chaîne par l'assertion", correct: false}
      - {text: "Une ligne vide : l'assertion ratée donne `\"\"`", correct: false}
      - {text: "Ça ne compile pas : `42` n'est pas une `string`", correct: false}
    answer: "Une panique : « interface conversion: interface {} is int, not string ». Sans `ok`, une assertion ratée ne donne pas la valeur zéro ; et elle compile, car `v` est une interface."
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any = 42\n\ts := v.(string)\n\tfmt.Println(s)\n}\n"
      panics: interface conversion
  - key: code-capacite
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var w io.Writer = &strings.Builder{}
      _, estStringWriter := w.(io.StringWriter)
      _, estReader := w.(io.Reader)
      fmt.Println(estStringWriter, estReader)
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: '`true false` : un `*strings.Builder` sait écrire une chaîne, mais pas se lire.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar w io.Writer = &strings.Builder{}\n\t_, estStringWriter := w.(io.StringWriter)\n\t_, estReader := w.(io.Reader)\n\tfmt.Println(estStringWriter, estReader)\n}\n"
      output: true false
  - key: code-nil
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var v any
      s, ok := v.(string)
      fmt.Printf("%q %t\n", s, ok)
      ```
    choices:
      - {text: "`\"\" false`", correct: true}
      - {text: "`<nil> false`", correct: false}
      - {text: "`\"\" true`", correct: false}
      - {text: "Une panic : l'interface vaut `nil`", correct: false}
    answer: '`"" false` : une interface nil ne contient aucun type.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any\n\ts, ok := v.(string)\n\tfmt.Printf(\"%q %t\\n\", s, ok)\n}\n"
      output: '"" false'
  - key: bug-panique
    format: bug-fix
    question: |-
      Le service panique quand une valeur inattendue arrive dans le cache. Quelle correction est la bonne ?
      ```go
      profil := cache.Get(cle).(*Profil)
      ```
    choices:
      - {text: "`profil, ok := cache.Get(cle).(*Profil)`, puis une erreur si `!ok`", correct: true}
      - {text: "`profil := (*Profil)(cache.Get(cle))`, une conversion explicite", correct: false}
      - {text: "Un `recover()` dans la fonction, qui ignore la panic et continue", correct: false}
      - {text: "`profil := cache.Get(cle).(Profil)`, sans le pointeur", correct: false}
    answer: "```go\nprofil, ok := cache.Get(cle).(*Profil)\nif !ok {\n\treturn nil, ErrCacheCorrompu\n}\n```\nLa forme `v, ok` transforme une valeur inattendue en erreur traitable plutôt qu'en panique."
  - key: bug-contexte
    format: bug-fix
    question: |-
      Une requête sans identifiant de corrélation fait paniquer le middleware. Quelle correction est la bonne ?
      ```go
      id := ctx.Value(cleIDRequete).(string)
      ```
    choices:
      - {text: "`id, ok := ctx.Value(cleIDRequete).(string)`, et `\"inconnu\"` si `!ok`", correct: true}
      - {text: "`id := ctx.Value(cleIDRequete).(*string)`, un pointeur qui peut être nil", correct: false}
      - {text: "`id := string(ctx.Value(cleIDRequete))`, une conversion qui ne panique pas", correct: false}
      - {text: "Tester `ctx.Err() != nil` avant de lire la valeur du contexte", correct: false}
    answer: "```go\nid, ok := ctx.Value(cleIDRequete).(string)\nif !ok {\n\tid = \"inconnu\"\n}\n```\n`ctx.Value` renvoie nil quand la clé est absente, et l'assertion sans `ok` panique."
  - key: bug-chaine-assertions
    format: bug-fix
    question: |-
      Cette suite d'assertions marche, mais elle est lourde à lire. Quelle simplification est la bonne ?
      ```go
      if s, ok := v.(string); ok {
      	return s
      } else if n, ok := v.(int); ok {
      	return strconv.Itoa(n)
      } else if b, ok := v.(bool); ok {
      	return strconv.FormatBool(b)
      }
      return "?"
      ```
    choices:
      - {text: "Un type switch, `switch x := v.(type)`, avec un `default` qui renvoie `\"?\"`", correct: true}
      - {text: "Un `switch v { case string: ... }`, qui compare directement le type", correct: false}
      - {text: "Une seule assertion vers `any`, suivie d'une conversion `string(x)`", correct: false}
      - {text: "Un `reflect.TypeOf(v).Kind()` comparé dans une chaîne de `if`", correct: false}
    answer: "```go\nswitch x := v.(type) {\ncase string:\n\treturn x\ncase int:\n\treturn strconv.Itoa(x)\ncase bool:\n\treturn strconv.FormatBool(x)\ndefault:\n\treturn \"?\"\n}\n```\nUn type switch lit mieux plusieurs cas de types."
  - key: bug-flush
    format: bug-fix
    question: |-
      Le compilateur signale « w.Flush undefined (type http.ResponseWriter has no field or method Flush) ». Quelle correction est la bonne ?
      ```go
      fmt.Fprintf(w, "data: %s\n\n", evenement)
      w.Flush()
      ```
    choices:
      - {text: "Tester la capacité : `if f, ok := w.(http.Flusher); ok { f.Flush() }`", correct: true}
      - {text: "Convertir : `http.Flusher(w).Flush()`, une conversion vers l'interface", correct: false}
      - {text: "Supprimer `w.Flush()` : la réponse part de toute façon au fil de l'eau", correct: false}
      - {text: "Envelopper `w` dans un `bufio.NewWriter(w)` et appeler son `Flush()`", correct: false}
    answer: "```go\nfmt.Fprintf(w, \"data: %s\\n\\n\", evenement)\nif f, ok := w.(http.Flusher); ok {\n\tf.Flush()\n}\n// ou : http.NewResponseController(w).Flush()\n```\n`Flush` est une capacité optionnelle : on la teste par une assertion vers `http.Flusher`."
