notion: assertion-type
lesson: |-
  Une **assertion de type** récupère le type concret contenu dans une interface :

  ```go
  var v any = "bonjour"

  s := v.(string)        // "bonjour" ; si v n'est pas une string : PANIQUE
  s, ok := v.(string)    // forme sûre : ok vaut false si ce n'est pas une string
  n, ok := v.(int)       // 0, false

  var w io.Writer = os.Stdout
  f, ok := w.(*os.File)  // vers un type concret
  rw, ok := w.(io.ReadWriter) // ou vers une autre interface
  ```

  - La forme à **une** valeur panique si le type ne correspond pas ; la forme **`v, ok`** ne panique jamais.
  - On peut asserter vers un **type concret** (`*os.File`) ou vers une **autre interface** (`io.ReadWriter`) : on teste
    alors si la valeur a des méthodes en plus.
  - C'est le mécanisme des **interfaces optionnelles** : `io.Copy` vérifie si la source implémente `io.WriterTo` pour
    aller plus vite, `http.ResponseWriter` peut être un `http.Flusher`.
  - Sur une interface **nil**, l'assertion échoue (`ok` faux, ou panique sans `ok`).

  Pour plusieurs types possibles, un **type switch** est plus lisible qu'une suite d'assertions.

  **Piège classique** : écrire `v.(string)` sans `ok` sur une donnée qui vient de l'extérieur (JSON, contexte, cache) ;
  la première valeur inattendue fait paniquer le service.

  **En entretien** : « v.(T) récupère le type concret, et panique si ce n'est pas le bon ; la forme v, ok ne panique
  pas ; on peut asserter vers une interface pour détecter des capacités optionnelles. »
cards:
  - key: passe-si-type-assertion-echoue
    format: course
    question: Que se passe-t-il si une type assertion échoue ?
    answer: Panic avec la forme simple ; ok = false avec la forme `v, ok := x.(T)`.
  - key: interface-optionnelle
    format: course
    question: C'est quoi une interface optionnelle ?
    answer: Une capacité testée à l'exécution par type assertion, comme io.WriterTo dans io.Copy.
  - key: terme-type-assertion-type-switch
    format: course
    question: Que désigne « type assertion / type switch » ?
    answer: Récupérer le type concret d'une interface
  - key: forme-sure
    format: course
    question: Comment faire une assertion de type sans risque de panique ?
    answer: 'Avec la forme à deux valeurs, `v, ok := x.(T)` : `ok` vaut false et `v` la valeur zéro de T si le type ne correspond pas.'
  - key: vers-interface
    format: course
    question: À quoi sert une assertion vers une interface, comme `w.(io.StringWriter)` ?
    answer: À tester si la valeur a aussi d'autres méthodes, pour utiliser une capacité optionnelle (écrire une chaîne sans conversion, vider un tampon...).
  - key: vf-panique
    format: true-false
    question: '`s := v.(string)` panique si `v` contient un int.'
    truth: true
    answer: '« interface conversion: interface {} is int, not string ».'
  - key: vf-ok
    format: true-false
    question: La forme `s, ok := v.(string)` peut paniquer.
    truth: false
    answer: Elle ne panique jamais ; `ok` dit si l'assertion a réussi.
  - key: vf-nil
    format: true-false
    question: Une assertion `v.(T)` sur une interface nil réussit et donne la valeur zéro.
    truth: false
    answer: 'Elle échoue : panique sans `ok`, `ok == false` avec.'
  - key: vf-type-concret
    format: true-false
    question: On ne peut pas faire une assertion sur une variable de type concret (non interface).
    truth: true
    answer: '« invalid operation: x (variable of type int) is not an interface ».'
  - key: qcm-resultats
    format: multiple-choice
    question: Avec `var v any = 42`, que donnent ces assertions ?
    choices:
      - text: '`n, ok := v.(int)` donne 42, true'
        correct: true
      - text: '`s, ok := v.(string)` donne "", false'
        correct: true
      - text: '`s := v.(string)` donne ""'
        correct: false
      - text: '`f := v.(float64)` donne 42.0'
        correct: false
    answer: Sans `ok`, une assertion ratée panique ; il n'y a pas de conversion implicite.
  - key: qcm-optionnelle
    format: multiple-choice
    question: Comment un handler HTTP peut-il envoyer une réponse au fil de l'eau si le serveur le permet ?
    choices:
      - text: '`if f, ok := w.(http.Flusher); ok { f.Flush() }`'
        correct: true
      - text: '`w.Flush()` directement'
        correct: false
      - text: '`http.Flusher(w).Flush()`'
        correct: false
      - text: Ce n'est pas possible en Go
        correct: false
    answer: '`http.ResponseWriter` n''a pas `Flush` ; on teste la capacité optionnelle (ou l''on passe par `http.NewResponseController`).'
  - key: qcm-plusieurs
    format: multiple-choice
    question: Quand préférer un type switch à des assertions ?
    choices:
      - text: Quand la valeur peut être de plusieurs types à traiter différemment
        correct: true
      - text: Quand on veut un cas par défaut lisible
        correct: true
      - text: Quand on ne teste qu'un seul type
        correct: false
      - text: Jamais, les assertions sont plus rapides
        correct: false
    answer: Pour un seul type, `v, ok := x.(T)` suffit.
  - key: qcm-valides
    format: multiple-choice
    question: Avec `var w io.Writer = os.Stdout`, quelles assertions compilent ?
    choices:
      - text: '`w.(*os.File)`'
        correct: true
      - text: '`w.(io.ReadWriter)`'
        correct: true
      - text: '`w.(int)`'
        correct: false
      - text: '`os.Stdout.(io.Writer)`'
        correct: false
    answer: '`int` n''a pas de méthode Write (assertion impossible), et `os.Stdout` n''est pas une interface.'
  - key: trous-ok
    format: fill-in
    question: "Complétez l'assertion sûre :\n```go\nif s, ___ := v.(string); ok {\n\tfmt.Println(strings.ToUpper(s))\n}\n```"
    blanks:
      - - ok
    answer: La forme à deux valeurs.
  - key: trous-type
    format: fill-in
    question: |-
      Complétez pour récupérer le `*os.File` derrière un `io.Writer` :
      ```go
      f, ok := w.(___)
      ```
    blanks:
      - - '*os.File'
    answer: L'assertion vers un type concret.
  - key: trous-interface
    format: fill-in
    question: "Complétez pour tester si la source sait s'écrire elle-même :\n```go\nif wt, ok := src.(io.___); ok {\n\treturn wt.WriteTo(dst)\n}\n```"
    blanks:
      - - WriterTo
    answer: C'est ce que fait `io.Copy` pour éviter un tampon intermédiaire.
  - key: trous-syntaxe
    format: fill-in
    question: |-
      Complétez la syntaxe :
      ```go
      n := valeur___int)
      ```
    blanks:
      - - .(
    answer: L'assertion s'écrit `x.(T)`.
  - key: code-assertions
    format: code-output
    question: |-
      ```go
      var v any = 42
      n, ok := v.(int)
      s, ok2 := v.(string)
      fmt.Printf("%d %t %q %t\n", n, ok, s, ok2)
      ```
    answer: '`42 true "" false` : l''assertion ratée donne la valeur zéro et false.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any = 42\n\tn, ok := v.(int)\n\ts, ok2 := v.(string)\n\tfmt.Printf(\"%d %t %q %t\\n\", n, ok, s, ok2)\n}\n"
      output: 42 true "" false
  - key: code-panique
    format: code-output
    question: |-
      ```go
      var v any = 42
      s := v.(string)
      fmt.Println(s)
      ```
    answer: 'Une panique : « interface conversion: interface {} is int, not string ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any = 42\n\ts := v.(string)\n\tfmt.Println(s)\n}\n"
      panics: interface conversion
  - key: code-capacite
    format: code-output
    question: |-
      ```go
      var w io.Writer = &strings.Builder{}
      _, estStringWriter := w.(io.StringWriter)
      _, estReader := w.(io.Reader)
      fmt.Println(estStringWriter, estReader)
      ```
    answer: '`true false` : un `*strings.Builder` sait écrire une chaîne, mais pas se lire.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\nfunc main() {\n\tvar w io.Writer = &strings.Builder{}\n\t_, estStringWriter := w.(io.StringWriter)\n\t_, estReader := w.(io.Reader)\n\tfmt.Println(estStringWriter, estReader)\n}\n"
      output: true false
  - key: code-nil
    format: code-output
    question: |-
      ```go
      var v any
      s, ok := v.(string)
      fmt.Printf("%q %t\n", s, ok)
      ```
    answer: '`"" false` : une interface nil ne contient aucun type.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar v any\n\ts, ok := v.(string)\n\tfmt.Printf(\"%q %t\\n\", s, ok)\n}\n"
      output: '"" false'
  - key: bug-panique
    format: bug-fix
    question: |-
      Le service panique quand un client met une valeur inattendue dans le cache :
      ```go
      profil := cache.Get(cle).(*Profil)
      ```
    answer: "```go\nprofil, ok := cache.Get(cle).(*Profil)\nif !ok {\n\treturn nil, ErrCacheCorrompu\n}\n```\nLa forme `v, ok` transforme une valeur inattendue en erreur traitable plutôt qu'en panique."
  - key: bug-contexte
    format: bug-fix
    question: |-
      Une requête sans identifiant de corrélation fait paniquer le middleware :
      ```go
      id := ctx.Value(cleIDRequete).(string)
      ```
    answer: "```go\nid, ok := ctx.Value(cleIDRequete).(string)\nif !ok {\n\tid = \"inconnu\"\n}\n```\n`ctx.Value` renvoie nil quand la clé est absente, et l'assertion sans `ok` panique."
  - key: bug-chaine-assertions
    format: bug-fix
    question: "Simplifiez cette suite d'assertions :\n```go\nif s, ok := v.(string); ok {\n\treturn s\n} else if n, ok := v.(int); ok {\n\treturn strconv.Itoa(n)\n} else if b, ok := v.(bool); ok {\n\treturn strconv.FormatBool(b)\n}\nreturn \"?\"\n```"
    answer: "```go\nswitch x := v.(type) {\ncase string:\n\treturn x\ncase int:\n\treturn strconv.Itoa(x)\ncase bool:\n\treturn strconv.FormatBool(x)\ndefault:\n\treturn \"?\"\n}\n```\nUn type switch lit mieux plusieurs cas de types."
  - key: bug-flush
    format: bug-fix
    question: |-
      Le compilateur signale « w.Flush undefined (type http.ResponseWriter has no field or method Flush) » :
      ```go
      fmt.Fprintf(w, "data: %s\n\n", evenement)
      w.Flush()
      ```
    answer: "```go\nfmt.Fprintf(w, \"data: %s\\n\\n\", evenement)\nif f, ok := w.(http.Flusher); ok {\n\tf.Flush()\n}\n// ou : http.NewResponseController(w).Flush()\n```\n`Flush` est une capacité optionnelle : on la teste par une assertion vers `http.Flusher`."
