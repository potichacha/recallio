notion: unsafe
lesson: |-
  Le package **`unsafe`** contourne le système de types : il permet de manipuler des adresses et de réinterpréter la
  mémoire. Son nom est un avertissement : le code qui l'utilise peut **corrompre la mémoire**, n'est **pas couvert** par
  la promesse de compatibilité Go 1, et peut casser d'une version à l'autre ou d'une plateforme à l'autre.

  Ce qu'il offre :
  - `unsafe.Pointer` : un pointeur générique, convertible depuis et vers n'importe quel `*T` et `uintptr` ;
  - `unsafe.Sizeof`, `Alignof`, `Offsetof` : la disposition mémoire d'un type (sans danger, évalués à la compilation) ;
  - `unsafe.String`, `unsafe.StringData`, `unsafe.Slice`, `unsafe.SliceData` (Go 1.20) : construire une chaîne ou un
    slice à partir d'un pointeur, sans copie.

  Usages légitimes, rares : l'interopérabilité avec du code C (cgo) ou le système, des bibliothèques de sérialisation
  ou de calcul très optimisées, la conversion `[]byte` vers `string` sans copie dans un chemin critique mesuré. La
  bibliothèque standard l'utilise en interne (`reflect`, `sync/atomic`, `runtime`).

  Les règles de `unsafe.Pointer` sont précises (des motifs autorisés, documentés) : par exemple, un `uintptr` n'est
  **pas** un pointeur pour le GC, et la valeur qu'il désigne peut être déplacée ou ramassée.

  Dans du code applicatif, la bonne réponse est presque toujours : **ne pas l'utiliser**. `go vet` vérifie certains
  usages incorrects.

  **Piège classique** : convertir un `[]byte` en `string` avec `unsafe` pour gagner une copie, puis modifier le tampon.
  La chaîne, censée être immuable, change, et le comportement devient imprévisible.

  **En entretien** : « Contourner le typage pour l'interopérabilité ou une optimisation mesurée ; hors de la promesse de
  compatibilité ; un uintptr n'est pas suivi par le GC ; en code applicatif, on s'en passe. »
cards:
  - key: risques
    format: course
    question: Pourquoi le package `unsafe` est-il dangereux ?
    choices:
      - {text: "Il contourne le système de types : une erreur corrompt la mémoire, sans garantie de compatibilité", correct: true}
      - {text: "Il désactive le ramasse-miettes pour tout le programme, dès qu'on l'importe", correct: false}
      - {text: "Il empêche de compiler le programme pour Windows et pour macOS", correct: false}
      - {text: "Il lance chaque fonction qui l'utilise dans un thread système séparé", correct: false}
    answer: 'Il contourne le système de types : une erreur corrompt la mémoire, et son code n''est pas couvert par la compatibilité Go 1 ni portable entre plateformes.'
  - key: sizeof
    format: course
    question: '`unsafe.Sizeof` est-il dangereux à utiliser ?'
    choices:
      - {text: "Non : il est évalué à la compilation et ne fait que mesurer", correct: true}
      - {text: "Oui : il lit la mémoire de la valeur, qui peut avoir été libérée", correct: false}
      - {text: "Oui : il fige la disposition de la struct pour tout le programme", correct: false}
      - {text: "Non, mais il alloue une copie de la valeur pour la mesurer", correct: false}
    answer: 'Non : il est évalué à la compilation et ne fait que mesurer ; ce sont les conversions de `unsafe.Pointer` qui sont risquées.'
  - key: uintptr
    format: course
    question: Pourquoi ne faut-il pas garder une adresse dans un `uintptr` ?
    choices:
      - {text: "C'est un simple entier : le GC ne le suit pas, la valeur peut être déplacée ou libérée", correct: true}
      - {text: "Un `uintptr` fait 32 bits, trop peu pour une adresse sur 64 bits", correct: false}
      - {text: "Le compilateur refuse de convertir un `unsafe.Pointer` en `uintptr`", correct: false}
      - {text: "Un `uintptr` empêche le GC de libérer la valeur, et crée une fuite", correct: false}
    answer: 'Un `uintptr` est un simple entier : le GC ne le suit pas, et la valeur qu''il désignait peut être déplacée ou libérée.'
  - key: legitimes
    format: course
    question: "Lequel de ces usages de `unsafe` est légitime ?"
    choices:
      - {text: "Appeler du C ou le système, ou optimiser un chemin critique mesuré", correct: true}
      - {text: "Lire les champs privés d'une struct d'un autre package", correct: false}
      - {text: "Éviter des copies partout, par principe, sans mesurer", correct: false}
      - {text: "Contourner une erreur de typage signalée par le compilateur", correct: false}
    answer: "L'interopérabilité avec C ou le système, des bibliothèques bas niveau très optimisées, et des conversions sans copie dans un chemin critique mesuré. Lire des champs privés rend le code dépendant de détails qui changent."
  - key: vf-compatibilite
    format: true-false
    question: Le code qui utilise `unsafe` est couvert par la promesse de compatibilité Go 1.
    truth: false
    answer: Il peut casser d'une version à l'autre.
  - key: vf-stdlib
    format: true-false
    question: La bibliothèque standard utilise `unsafe` en interne.
    truth: true
    answer: Dans `reflect`, `sync/atomic`, `runtime`, `strings.Builder`...
  - key: vf-gc
    format: true-false
    question: Le garbage collector suit les adresses stockées dans un `uintptr`.
    truth: false
    answer: Seuls les vrais pointeurs (et `unsafe.Pointer`) sont suivis.
  - key: vf-applicatif
    format: true-false
    question: Utiliser `unsafe` est recommandé pour accélérer le code applicatif courant.
    truth: false
    answer: Le gain est rarement réel et le risque élevé ; on mesure d'abord, et on garde ces optimisations isolées et testées.
  - key: qcm-fonctions
    format: multiple-choice
    question: "Lequel de ces outils le package `unsafe` fournit-il ?"
    choices:
      - {text: "`unsafe.Pointer`, convertible en n'importe quel pointeur", correct: true}
      - {text: "Un allocateur manuel, avec `Malloc` et `Free`", correct: false}
      - {text: "Une fonction qui désactive le ramasse-miettes", correct: false}
      - {text: "Une arithmétique sur les références de slices", correct: false}
    answer: "`unsafe.Pointer`, ainsi que `Sizeof`, `Alignof` et `Offsetof`. Ni allocation manuelle, ni contrôle du GC."
  - key: qcm-chaine
    format: multiple-choice
    question: "Quel risque prend-on à créer une `string` sans copie à partir d'un `[]byte` avec `unsafe.String` ?"
    choices:
      - {text: "Si le tampon est modifié ensuite, la chaîne censée immuable change", correct: true}
      - {text: "Aucun : c'est exactement équivalent à la conversion `string(b)`", correct: false}
      - {text: "Aucun, mais la conversion ne compile qu'avec cgo activé", correct: false}
      - {text: "La chaîne est copiée deux fois au lieu d'une seule", correct: false}
    answer: "La chaîne partage le tampon : s'il est modifié ou réutilisé par un pool, la chaîne censée être immuable change. `string(b)` copie justement pour garantir l'immuabilité."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans lequel de ces cas envisager `unsafe` ?"
    choices:
      - {text: "Appeler une API système ou C qui attend un pointeur brut", correct: true}
      - {text: "Accéder aux champs privés d'un autre package", correct: false}
      - {text: "Éviter d'écrire des tests sur un code délicat", correct: false}
      - {text: "Accélérer un code sans l'avoir mesuré d'abord", correct: false}
    answer: "Une API système ou C, ou une optimisation mesurée dans une bibliothèque bas niveau. Lire des champs privés par `unsafe` rend le code dépendant de détails qui changent."
  - key: qcm-vet
    format: multiple-choice
    question: Quel outil signale certains mauvais usages de `unsafe.Pointer` ?
    choices:
      - text: '`go vet` (l''analyseur unsafeptr)'
        correct: true
      - text: '`gofmt`'
        correct: false
      - text: '`go mod tidy`'
        correct: false
      - text: Aucun
        correct: false
    answer: Il détecte des conversions `uintptr` vers `unsafe.Pointer` qui ne suivent pas les motifs autorisés.
  - key: scenario-optimisation
    format: scenario
    question: Un collègue propose `unsafe` pour éviter la copie `string(b)` dans un parseur. Que demandes-tu avant d'accepter ?
    choices:
      - {text: "Un benchmark qui montre que la copie compte, et la preuve que le tampon n'est jamais réutilisé", correct: true}
      - {text: "Rien : éviter une copie est toujours un gain, quel que soit le code concerné", correct: false}
      - {text: "Seulement que le code compile sans le moindre avertissement de `go vet`", correct: false}
      - {text: "Qu'on désactive le GC pendant le parsing, pour protéger le tampon partagé", correct: false}
    answer: |-
      Un benchmark qui montre que cette copie compte vraiment dans le temps total, et une analyse de la durée de vie du
      tampon : si `b` est réutilisé ou modifié après la conversion, la chaîne change et tout casse. Je vérifie aussi si
      le compilateur n'évite pas déjà la copie (clés de map, comparaisons) et si l'API peut travailler directement sur
      `[]byte`. Si on le garde, c'est isolé dans une fonction documentée, testée, et vérifiée avec `-race`.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande si Go est sûr en mémoire. Que réponds-tu ?
    choices:
      - {text: "Oui pour le code ordinaire ; les data races, `unsafe` et cgo sortent de ces garanties", correct: true}
      - {text: "Oui, totalement : aucune construction du langage ne peut corrompre la mémoire", correct: false}
      - {text: "Non : sans destructeurs, la mémoire fuit dès qu'on oublie de la libérer", correct: false}
      - {text: "Non : Go a l'arithmétique de pointeurs du C, avec les mêmes risques", correct: false}
    answer: |-
      Oui, pour le code ordinaire : pas d'arithmétique de pointeurs, des indices vérifiés à l'exécution, un GC qui évite
      les pointeurs pendants. Deux réserves : les data races peuvent corrompre la mémoire (d'où le détecteur `-race`), et
      `unsafe` comme cgo sortent de ces garanties. Dans du code applicatif sans unsafe ni cgo, les erreurs mémoire
      classiques du C n'existent pas.
  - key: scenario-revue
    format: scenario
    question: En revue, tu trouves du code qui lit le champ privé d'une struct d'une bibliothèque tierce avec `unsafe.Pointer` et un décalage fixe. Que dis-tu ?
    choices:
      - {text: "C'est très fragile : chercher une API publique ou contribuer, sinon figer la version et tester", correct: true}
      - {text: "C'est acceptable, puisque le code compile et que les tests passent aujourd'hui", correct: false}
      - {text: "Il suffit de remplacer le décalage fixe par `unsafe.Offsetof` du champ privé", correct: false}
      - {text: "C'est la seule façon de faire, Go n'ayant aucune réflexion sur les champs", correct: false}
    answer: |-
      Que c'est très fragile : le moindre changement de la bibliothèque (ordre ou taille des champs) fait lire n'importe
      quoi, sans erreur de compilation. Je cherche une API publique, je propose une contribution à la bibliothèque pour
      exposer ce dont on a besoin, ou une alternative. Si c'est vraiment inévitable, on fige la version de la dépendance
      et l'on ajoute un test qui échoue si la disposition change.
  - key: scenario-cgo
    format: scenario
    question: Pourquoi `unsafe` apparaît-il souvent avec cgo ?
    choices:
      - {text: "Le C manipule des pointeurs bruts : passer un tampon Go demande `unsafe.Pointer(&b[0])`", correct: true}
      - {text: "cgo exige que tout le package soit compilé avec un drapeau `-unsafe`", correct: false}
      - {text: "Le GC est désactivé avec cgo, et `unsafe` gère la mémoire à sa place", correct: false}
      - {text: "`unsafe` traduit automatiquement les types Go en types C, et l'inverse", correct: false}
    answer: |-
      Parce que le code C manipule des pointeurs bruts : passer un tampon Go à une fonction C demande un
      `unsafe.Pointer(&b[0])`, et lire une chaîne C passe par des conversions. cgo impose des règles (ne pas garder de
      pointeur Go côté C après l'appel, par exemple). C'est une des raisons pour lesquelles on évite cgo quand une
      bibliothèque pure Go existe : on garde les garanties de sûreté et la compilation croisée simple.
