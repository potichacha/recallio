notion: unsafe
lesson: |-
  Le package **`unsafe`** contourne le système de types : il permet de manipuler des adresses et de réinterpréter la
  mémoire. Son nom est un avertissement : le code qui l'utilise peut **corrompre la mémoire**, n'est **pas couvert** par
  la promesse de compatibilité Go 1, et peut casser d'une version à l'autre ou d'une plateforme à l'autre.

  Ce qu'il offre :
  - `unsafe.Pointer` : un pointeur générique, convertible depuis et vers n'importe quel `*T` et `uintptr` ;
  - `unsafe.Sizeof`, `Alignof`, `Offsetof` : la disposition mémoire d'un type (sans danger, évalués à la compilation) ;
  - `unsafe.String`, `unsafe.StringData`, `unsafe.Slice`, `unsafe.SliceData` (Go 1.20) : construire une chaîne ou un
    slice à partir d'un pointeur, sans copie.

  Usages légitimes, rares : l'interopérabilité avec du code C (cgo) ou le système, des bibliothèques de sérialisation
  ou de calcul très optimisées, la conversion `[]byte` vers `string` sans copie dans un chemin critique mesuré. La
  bibliothèque standard l'utilise en interne (`reflect`, `sync/atomic`, `runtime`).

  Les règles de `unsafe.Pointer` sont précises (des motifs autorisés, documentés) : par exemple, un `uintptr` n'est
  **pas** un pointeur pour le GC, et la valeur qu'il désigne peut être déplacée ou ramassée.

  Dans du code applicatif, la bonne réponse est presque toujours : **ne pas l'utiliser**. `go vet` vérifie certains
  usages incorrects.

  **Piège classique** : convertir un `[]byte` en `string` avec `unsafe` pour gagner une copie, puis modifier le tampon.
  La chaîne, censée être immuable, change, et le comportement devient imprévisible.

  **En entretien** : « Contourner le typage pour l'interopérabilité ou une optimisation mesurée ; hors de la promesse de
  compatibilité ; un uintptr n'est pas suivi par le GC ; en code applicatif, on s'en passe. »
cards:
  - key: risques
    format: course
    question: Pourquoi le package `unsafe` est-il dangereux ?
    answer: 'Il contourne le système de types : une erreur corrompt la mémoire, et son code n''est pas couvert par la compatibilité Go 1 ni portable entre plateformes.'
  - key: sizeof
    format: course
    question: '`unsafe.Sizeof` est-il dangereux à utiliser ?'
    answer: 'Non : il est évalué à la compilation et ne fait que mesurer ; ce sont les conversions de `unsafe.Pointer` qui sont risquées.'
  - key: uintptr
    format: course
    question: Pourquoi ne faut-il pas garder une adresse dans un `uintptr` ?
    answer: 'Un `uintptr` est un simple entier : le GC ne le suit pas, et la valeur qu''il désignait peut être déplacée ou libérée.'
  - key: legitimes
    format: course
    question: Citez des usages légitimes de `unsafe`.
    answer: L'interopérabilité avec C ou le système, des bibliothèques bas niveau très optimisées, et des conversions sans copie dans un chemin critique mesuré.
  - key: vf-compatibilite
    format: true-false
    question: Le code qui utilise `unsafe` est couvert par la promesse de compatibilité Go 1.
    truth: false
    answer: Il peut casser d'une version à l'autre.
  - key: vf-stdlib
    format: true-false
    question: La bibliothèque standard utilise `unsafe` en interne.
    truth: true
    answer: Dans `reflect`, `sync/atomic`, `runtime`, `strings.Builder`...
  - key: vf-gc
    format: true-false
    question: Le garbage collector suit les adresses stockées dans un `uintptr`.
    truth: false
    answer: Seuls les vrais pointeurs (et `unsafe.Pointer`) sont suivis.
  - key: vf-applicatif
    format: true-false
    question: Utiliser `unsafe` est recommandé pour accélérer le code applicatif courant.
    truth: false
    answer: Le gain est rarement réel et le risque élevé ; on mesure d'abord, et on garde ces optimisations isolées et testées.
  - key: qcm-fonctions
    format: multiple-choice
    question: Que fournit le package `unsafe` ?
    choices:
      - text: '`unsafe.Pointer`, convertible en n''importe quel pointeur'
        correct: true
      - text: '`Sizeof`, `Alignof` et `Offsetof`'
        correct: true
      - text: Un allocateur manuel avec free
        correct: false
      - text: La désactivation du garbage collector
        correct: false
    answer: Ni allocation manuelle, ni contrôle du GC.
  - key: qcm-chaine
    format: multiple-choice
    question: Quel risque à créer une `string` sans copie à partir d'un `[]byte` avec `unsafe.String` ?
    choices:
      - text: Si le tampon est ensuite modifié, la chaîne censée être immuable change
        correct: true
      - text: La chaîne peut désigner une mémoire réutilisée par un pool
        correct: true
      - text: Aucun, c'est équivalent à `string(b)`
        correct: false
      - text: La conversion ne compile pas
        correct: false
    answer: '`string(b)` copie justement pour garantir l''immuabilité.'
  - key: qcm-quand
    format: multiple-choice
    question: Quand envisager `unsafe` ?
    choices:
      - text: Pour appeler une API système ou C qui attend un pointeur brut
        correct: true
      - text: Pour une optimisation mesurée dans une bibliothèque bas niveau
        correct: true
      - text: Pour accéder aux champs privés d'un autre package
        correct: false
      - text: Pour éviter d'écrire des tests
        correct: false
    answer: Lire des champs privés par unsafe rend le code dépendant de détails qui changent.
  - key: qcm-vet
    format: multiple-choice
    question: Quel outil signale certains mauvais usages de `unsafe.Pointer` ?
    choices:
      - text: '`go vet` (l''analyseur unsafeptr)'
        correct: true
      - text: '`gofmt`'
        correct: false
      - text: '`go mod tidy`'
        correct: false
      - text: Aucun
        correct: false
    answer: Il détecte des conversions `uintptr` vers `unsafe.Pointer` qui ne suivent pas les motifs autorisés.
  - key: scenario-optimisation
    format: scenario
    question: Un collègue propose `unsafe` pour éviter la copie `string(b)` dans un parseur. Que demandes-tu avant d'accepter ?
    answer: |-
      Un benchmark qui montre que cette copie compte vraiment dans le temps total, et une analyse de la durée de vie du
      tampon : si `b` est réutilisé ou modifié après la conversion, la chaîne change et tout casse. Je vérifie aussi si
      le compilateur n'évite pas déjà la copie (clés de map, comparaisons) et si l'API peut travailler directement sur
      `[]byte`. Si on le garde, c'est isolé dans une fonction documentée, testée, et vérifiée avec `-race`.
  - key: scenario-entretien
    format: scenario
    question: En entretien, on te demande si Go est sûr en mémoire. Que réponds-tu ?
    answer: |-
      Oui, pour le code ordinaire : pas d'arithmétique de pointeurs, des indices vérifiés à l'exécution, un GC qui évite
      les pointeurs pendants. Deux réserves : les data races peuvent corrompre la mémoire (d'où le détecteur `-race`), et
      `unsafe` comme cgo sortent de ces garanties. Dans du code applicatif sans unsafe ni cgo, les erreurs mémoire
      classiques du C n'existent pas.
  - key: scenario-revue
    format: scenario
    question: En revue, tu trouves du code qui lit le champ privé d'une struct d'une bibliothèque tierce avec `unsafe.Pointer` et un décalage fixe. Que dis-tu ?
    answer: |-
      Que c'est très fragile : le moindre changement de la bibliothèque (ordre ou taille des champs) fait lire n'importe
      quoi, sans erreur de compilation. Je cherche une API publique, je propose une contribution à la bibliothèque pour
      exposer ce dont on a besoin, ou une alternative. Si c'est vraiment inévitable, on fige la version de la dépendance
      et l'on ajoute un test qui échoue si la disposition change.
  - key: scenario-cgo
    format: scenario
    question: Pourquoi `unsafe` apparaît-il souvent avec cgo ?
    answer: |-
      Parce que le code C manipule des pointeurs bruts : passer un tampon Go à une fonction C demande un
      `unsafe.Pointer(&b[0])`, et lire une chaîne C passe par des conversions. cgo impose des règles (ne pas garder de
      pointeur Go côté C après l'appel, par exemple). C'est une des raisons pour lesquelles on évite cgo quand une
      bibliothèque pure Go existe : on garde les garanties de sûreté et la compilation croisée simple.
