notion: interfaces-internes
cards:
  - key: representee-valeur-interface
    format: course
    question: Comment est représentée une valeur d'interface ?
    answer: Une paire (type dynamique, valeur dynamique), deux mots en mémoire.
  - key: comparer-deux-interfaces-paniquer
    format: course
    question: Comparer deux interfaces peut-il paniquer ?
    answer: Oui si le type dynamique n'est pas comparable (slice, map).
  - key: dispatch-interface-cout
    format: course
    question: Le dispatch par interface a-t-il un coût ?
    answer: Un appel indirect qui empêche souvent l'inlining ; négligeable hors boucles critiques.
