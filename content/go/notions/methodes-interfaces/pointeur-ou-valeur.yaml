notion: pointeur-ou-valeur
cards:
  - key: pointeur-toujours-plus-rapide-valeur
    format: course
    question: Un pointeur est-il toujours plus rapide qu'une valeur ?
    answer: 'Non : il peut forcer une allocation dans le heap et charger le GC ; pour une petite struct, la valeur est souvent meilleure.'
  - key: concois-type-money-montant-devise-valeur
    format: scenario
    question: Tu conçois un type `Money` (montant + devise). Valeur ou pointeur ?
    answer: |-
      Valeur. C'est une petite struct, conceptuellement **immuable**, comparable avec `==`, sans identité propre : deux montants de 10 EUR sont interchangeables. Les méthodes `Add`, `Sub` renvoient un nouveau `Money` plutôt que de modifier le receveur, ce qui supprime toute question de partage et de concurrence.
      Pour le montant lui-même, un `int64` en centimes (ou une bibliothèque décimale) et jamais un `float64`. Un pointeur ne se justifierait que pour représenter un montant optionnel, et encore, un booléen explicite est souvent plus lisible.
