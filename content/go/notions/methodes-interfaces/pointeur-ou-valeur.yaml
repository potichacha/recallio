notion: pointeur-ou-valeur
lesson: |-
  Faut-il passer (ou stocker) une valeur ou un pointeur ? Quelques critères :

  **Prendre un pointeur quand :**
  - la fonction ou la méthode doit **modifier** la valeur de l'appelant ;
  - la struct est **grosse** (plusieurs centaines d'octets) et copiée souvent ;
  - le type contient quelque chose qui **ne doit pas être copié** (un `sync.Mutex`, un `strings.Builder`) ;
  - **nil** a un sens (« absent », « pas encore chargé »).

  **Prendre une valeur quand :**
  - le type est **petit et immuable** de fait : `time.Time`, un `Point`, un `Montant`, une clé ;
  - on veut qu'une fonction ne puisse **pas** modifier l'original ;
  - la valeur sert de **clé de map** ou se compare avec `==`.

  Un pointeur n'est **pas automatiquement plus rapide** : un pointeur partagé fait souvent **échapper** la valeur sur le
  tas (une allocation, du travail pour le GC), alors qu'une petite struct copiée reste sur la pile et dans le cache du
  processeur. On mesure avant d'optimiser.

  Les types de référence (slices, maps, channels, fonctions, interfaces) se passent **par valeur** : leur en-tête est
  petit, et il partage déjà les données. Un `*[]T` ou un `*map[K]V` est presque toujours inutile.

  **Piège classique** : un pointeur vers une valeur qu'on croit protégée. Toute partie du code qui détient le pointeur
  peut la modifier, et une goroutine aussi.

  **En entretien** : « Pointeur pour modifier, pour les grosses structs, pour ce qui ne se copie pas et quand nil a un
  sens ; valeur pour les petits types immuables ; un pointeur n'est pas forcément plus rapide à cause du tas. »
cards:
  - key: pointeur-toujours-plus-rapide-valeur
    format: course
    question: Un pointeur est-il toujours plus rapide qu'une valeur ?
    choices:
      - {text: "Non : il peut faire allouer sur le tas et charger le GC ; une petite struct copiée va souvent plus vite", correct: true}
      - {text: "Oui : un pointeur fait 8 octets, il est donc toujours moins cher à passer qu'une struct", correct: false}
      - {text: "Oui, sauf pour les types de base comme `int` ou `bool`, déjà petits", correct: false}
      - {text: "Non : Go copie de toute façon la valeur pointée à chaque appel de fonction", correct: false}
    answer: 'Non : il peut forcer une allocation dans le heap et charger le GC ; pour une petite struct, la valeur est souvent meilleure.'
  - key: concois-type-money-montant-devise-valeur
    format: scenario
    question: Tu conçois un type `Money` (montant + devise). Valeur ou pointeur ?
    choices:
      - {text: "Valeur : petite struct immuable, comparable, sans identité ; `Add` renvoie un nouveau `Money`", correct: true}
      - {text: "Pointeur : on évite de copier le montant et la devise à chaque appel de méthode", correct: false}
      - {text: "Pointeur : `nil` représente un montant nul, plus clair qu'un montant à zéro", correct: false}
      - {text: "Valeur, avec un montant en `float64` pour gérer simplement les centimes", correct: false}
    answer: "Une valeur : c'est une petite struct immuable, comparable avec `==`, sans identité propre ; `Add` et `Sub` renvoient un nouveau `Money`, ce qui supprime toute question de partage. Le montant se garde en `int64` de centimes, jamais en `float64`."
  - key: references
    format: course
    question: Faut-il passer un `*[]int` ou un `*map[string]int` à une fonction qui modifie leurs éléments ?
    choices:
      - {text: "Non : slice et map partagent déjà leurs données, sauf s'il faut remplacer le slice", correct: true}
      - {text: "Oui : sans pointeur, la fonction modifie une copie des éléments", correct: false}
      - {text: "Oui pour la map, non pour le slice", correct: false}
      - {text: "Oui pour le slice, non pour la map", correct: false}
    answer: 'Non : le slice et la map partagent déjà leurs données ; un pointeur ne sert que si la fonction doit remplacer le slice lui-même (append qui change sa longueur).'
  - key: mutex
    format: course
    question: Pourquoi un type qui contient un `sync.Mutex` doit-il circuler par pointeur ?
    choices:
      - {text: "Copier le mutex crée un second verrou indépendant, qui ne protège plus rien", correct: true}
      - {text: "Un `sync.Mutex` ne peut pas être copié : la copie ne compile pas", correct: false}
      - {text: "Un mutex passé par valeur est automatiquement déverrouillé", correct: false}
      - {text: "Le mutex doit être alloué sur le tas pour que le GC le surveille", correct: false}
    answer: Copier le mutex créerait un second verrou indépendant ; `go vet` (copylocks) signale ces copies.
  - key: petits-types
    format: course
    question: Pourquoi `time.Time` se passe-t-il par valeur ?
    choices:
      - {text: "C'est un petit type immuable : ses méthodes renvoient de nouvelles valeurs", correct: true}
      - {text: "Parce qu'il ne contient qu'un entier, que Go ne sait pas pointer", correct: false}
      - {text: "Parce qu'un `*time.Time` ne peut pas être comparé avec `Before`", correct: false}
      - {text: "Parce que ses méthodes modifient l'instant en place, sur une copie", correct: false}
    answer: 'C''est un petit type qui se comporte comme une valeur immuable : ses méthodes renvoient de nouvelles valeurs, et le copier évite tout partage involontaire.'
  - key: vf-rapide
    format: true-false
    question: Passer un pointeur est toujours plus rapide que passer une valeur.
    truth: false
    answer: Un pointeur peut faire allouer la valeur sur le tas ; une petite struct copiée sur la pile est souvent plus rapide.
  - key: vf-modifier
    format: true-false
    question: Passer une struct par valeur garantit que la fonction ne modifie pas l'original.
    truth: true
    answer: Pour les champs simples ; ses champs slices, maps ou pointeurs restent partagés.
  - key: vf-cle
    format: true-false
    question: Une struct passée par pointeur peut servir de clé de map par son contenu.
    truth: false
    answer: Une clé pointeur se compare par adresse ; pour une clé par contenu, on utilise la valeur.
  - key: vf-nil-sens
    format: true-false
    question: Un pointeur permet de représenter une valeur absente par nil.
    truth: true
    answer: C'est l'un des bons usages d'un pointeur.
  - key: qcm-pointeur
    format: multiple-choice
    question: "Dans lequel de ces cas un pointeur est-il le bon choix ?"
    choices:
      - {text: "Une struct qui contient un `sync.Mutex`", correct: true}
      - {text: "Un type `Point{X, Y int}` utilisé comme clé de map", correct: false}
      - {text: "Un `[]string` que la fonction parcourt seulement", correct: false}
      - {text: "Un `time.Time` passé à une fonction de formatage", correct: false}
    answer: "Un mutex ne doit pas être copié : la struct circule par pointeur, comme celle dont une méthode modifie l'état. Le `Point`, le slice et le `time.Time` se passent par valeur."
  - key: qcm-valeur
    format: multiple-choice
    question: "Lequel de ces types se passe naturellement par valeur ?"
    choices:
      - {text: "Un montant `Money{Centimes int64; Devise string}`", correct: true}
      - {text: "Une struct de 4 Ko modifiée par la fonction", correct: false}
      - {text: "Une struct qui contient un `sync.Mutex`", correct: false}
      - {text: "Un `Serveur` qui garde ses connexions ouvertes", correct: false}
    answer: "Un petit type immuable comme `Money` (ou `time.Time`) se passe par valeur. Une grosse struct modifiée, un mutex ou une ressource partagée demandent un pointeur."
  - key: qcm-echappement
    format: multiple-choice
    question: "Lesquelles de ces raisons expliquent qu'un pointeur puisse coûter plus cher qu'une copie ?"
    choices:
      - {text: "La valeur pointée peut être allouée sur le tas, puis ramassée par le GC", correct: true}
      - {text: "L'accès indirect peut être moins favorable au cache du processeur", correct: true}
      - {text: "Un pointeur occupe autant de place en mémoire que la valeur pointée", correct: false}
      - {text: "Go recopie la valeur pointée à chaque appel, en plus du pointeur", correct: false}
    answer: Un pointeur fait 8 octets ; le coût vient de l'allocation et de l'indirection.
  - key: code-valeur-protege
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Point struct{ X, Y int }

      func deplacer(p Point) Point {
      	p.X++
      	return p
      }

      a := Point{1, 1}
      b := deplacer(a)
      fmt.Println(a, b)
      ```
    choices:
      - {text: "`{1 1} {2 1}`", correct: true}
      - {text: "`{2 1} {2 1}`", correct: false}
      - {text: "`{1 1} {1 1}`", correct: false}
      - {text: "`{2 1} {1 1}`", correct: false}
    answer: '`{1 1} {2 1}` : la valeur d''origine est protégée, le résultat est renvoyé.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Point struct{ X, Y int }\n\n\nfunc deplacer(p Point) Point {\n\tp.X++\n\treturn p\n}\n\nfunc main() {\n\ta := Point{1, 1}\n\tb := deplacer(a)\n\tfmt.Println(a, b)\n}\n"
      output: '{1 1} {2 1}'
  - key: code-pointeur-partage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compteur struct{ N int }

      c := &Compteur{}
      d := c
      d.N = 5
      fmt.Println(c.N)
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`&{5}`", correct: false}
      - {text: "Ça ne compile pas : `d.N` sur un pointeur", correct: false}
    answer: '`5` : `c` et `d` pointent sur la même struct.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ N int }\n\nfunc main() {\n\tc := &Compteur{}\n\td := c\n\td.N = 5\n\tfmt.Println(c.N)\n}\n"
      output: '5'
  - key: code-champ-slice
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Liste struct{ Elements []int }

      func vider(l Liste) { l.Elements[0] = 0 }

      l := Liste{Elements: []int{9, 9}}
      vider(l)
      fmt.Println(l.Elements)
      ```
    choices:
      - {text: "`[0 9]`", correct: true}
      - {text: "`[9 9]`", correct: false}
      - {text: "`[0 0]`", correct: false}
      - {text: "`[]`", correct: false}
    answer: '`[0 9]` : la struct est copiée, mais son slice partage le même tableau.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Liste struct{ Elements []int }\n\n\nfunc vider(l Liste) { l.Elements[0] = 0 }\n\nfunc main() {\n\tl := Liste{Elements: []int{9, 9}}\n\tvider(l)\n\tfmt.Println(l.Elements)\n}\n"
      output: '[0 9]'
  - key: bug-mutex-copie
    format: bug-fix
    question: |-
      Le compteur protégé perd des incréments sous charge, et go vet signale « passes lock by value ». Quelle correction est la bonne ?
      ```go
      type Stats struct {
      	mu sync.Mutex
      	n  int
      }

      func (s Stats) Incrementer() {
      	s.mu.Lock()
      	s.n++
      	s.mu.Unlock()
      }
      ```
    choices:
      - {text: "Un receveur pointeur : `func (s *Stats) Incrementer()`", correct: true}
      - {text: "Un `sync.RWMutex` à la place du `sync.Mutex`", correct: false}
      - {text: "Un `defer s.mu.Unlock()` juste après le `Lock`", correct: false}
      - {text: "Un champ `mu *sync.Mutex`, sans toucher au receveur", correct: false}
    answer: "```go\nfunc (s *Stats) Incrementer() {\n\ts.mu.Lock()\n\ts.n++\n\ts.mu.Unlock()\n}\n```\nAvec un receveur valeur, chaque appel verrouillait et incrémentait une copie."
  - key: bug-pointeur-slice
    format: bug-fix
    question: |-
      En revue, cette fonction prend un pointeur vers un slice pour en modifier les éléments. Quelle simplification est la bonne ?
      ```go
      func normaliser(noms *[]string) {
      	for i := range *noms {
      		(*noms)[i] = strings.TrimSpace((*noms)[i])
      	}
      }
      ```
    choices:
      - {text: "Prendre `noms []string` et écrire `noms[i]` : le slice partage déjà son tableau", correct: true}
      - {text: "Prendre `noms []string` et renvoyer une copie modifiée avec `slices.Clone`", correct: false}
      - {text: "Garder `*[]string`, mais itérer avec `for _, n := range *noms`", correct: false}
      - {text: "Prendre un tableau `noms [100]string`, pour se passer de tout pointeur", correct: false}
    answer: "```go\nfunc normaliser(noms []string) {\n\tfor i := range noms {\n\t\tnoms[i] = strings.TrimSpace(noms[i])\n\t}\n}\n```\nModifier les éléments ne demande pas de pointeur : le slice partage déjà son tableau."
  - key: bug-partage-goroutine
    format: bug-fix
    question: |-
      Une goroutine modifie la configuration pendant qu'une autre la lit. Quelle correction est la bonne ?
      ```go
      cfg := &Config{Delai: time.Second}
      go recharger(cfg) // modifie cfg.Delai
      go servir(cfg)    // lit cfg.Delai
      ```
    choices:
      - {text: "Un `atomic.Pointer[Config]` : on remplace la configuration entière, sans la modifier", correct: true}
      - {text: "Passer une copie, `*cfg`, à `recharger` comme à `servir`", correct: false}
      - {text: "Marquer `Delai` volatil avec un commentaire `//go:volatile`", correct: false}
      - {text: "Lancer `servir` après `recharger`, séparés par un `time.Sleep`", correct: false}
    answer: |-
      ```go
      var cfg atomic.Pointer[Config]
      cfg.Store(&Config{Delai: time.Second})

      // recharger : construit une nouvelle Config puis cfg.Store(nouvelle)
      // servir : c := cfg.Load() puis lit c.Delai
      ```
      Un pointeur partagé et modifié en place crée une data race ; on remplace la configuration entière de façon
      atomique, et chaque lecteur garde une version immuable.
  - key: bug-grosse-copie
    format: bug-fix
    question: |-
      Le profileur montre beaucoup de `runtime.memmove` dans une boucle qui appelle cette fonction. Quelle correction est la bonne ?
      ```go
      func score(d Document) int { ... } // Document fait 8 Ko (un tableau de 1000 int64)
      ```
    choices:
      - {text: "Passer un pointeur : `func score(d *Document) int`", correct: true}
      - {text: "Passer un slice : `func score(d []Document) int`", correct: false}
      - {text: "Rendre `Document` immuable, pour que Go cesse de la copier", correct: false}
      - {text: "En faire une méthode à receveur valeur de `Document`", correct: false}
    answer: |-
      ```go
      func score(d *Document) int { ... }
      ```
      Chaque appel copiait 8 Ko ; un pointeur évite la copie d'une grosse struct (si la fonction ne la modifie pas, on le
      documente).
  - key: scenario-money
    format: scenario
    question: Tu conçois un type `Montant` (centimes et devise) utilisé partout dans l'application. Valeur ou pointeur, et pourquoi ?
    choices:
      - {text: "Valeur : petit, immuable, comparable avec `==`, jamais nil ni modifié dans le dos d'un autre", correct: true}
      - {text: "Pointeur : il est utilisé partout, et le copier à chaque appel coûterait trop cher", correct: false}
      - {text: "Pointeur : `nil` représente un montant absent, sans champ supplémentaire", correct: false}
      - {text: "Valeur, mais avec des méthodes qui modifient le montant en place, sans copie", correct: false}
    answer: |-
      Une valeur. Le type est petit (un int64 et une chaîne courte), il représente une valeur métier immuable : ses
      méthodes renvoient un nouveau montant (`m.Ajouter(n) Montant`) au lieu de modifier l'original. Il se compare avec
      `==`, sert de clé si besoin, et aucun appelant ne peut le modifier dans le dos d'un autre. Pas de nil possible non
      plus, ce qui supprime une classe d'erreurs ; un montant absent se modélise explicitement si nécessaire.
  - key: scenario-api-repo
    format: scenario
    question: Un repository renvoie-t-il des `Client` ou des `*Client` ?
    choices:
      - {text: "Plutôt des valeurs `Client` : l'appelant a sa copie, et une erreur dit « non trouvé »", correct: true}
      - {text: "Toujours des `*Client`, pour pouvoir renvoyer nil quand le client n'existe pas", correct: false}
      - {text: "Toujours des `*Client`, car une struct ne peut pas être renvoyée par valeur", correct: false}
      - {text: "Des `Client` ou des `*Client` selon la méthode, sans règle commune au package", correct: false}
    answer: |-
      Plutôt des valeurs `Client` quand la struct est de taille raisonnable : l'appelant reçoit sa copie et ne peut pas
      modifier un objet partagé (par un cache, par exemple). Des pointeurs se justifient pour de gros objets, ou quand
      nil sert à dire « non trouvé » ; je préfère alors renvoyer une erreur `ErrNotFound` explicite. L'important est
      d'être cohérent dans le package et de ne pas mélanger les deux sans raison.
  - key: scenario-mesurer
    format: scenario
    question: Un collègue passe toutes les structs par pointeur « pour la performance ». Comment en discutes-tu ?
    choices:
      - {text: "Mesurer (benchmark, `-gcflags=-m`) : les pointeurs font souvent allouer, et changent la sémantique", correct: true}
      - {text: "Approuver : un pointeur évite toujours une copie, c'est donc toujours plus rapide", correct: false}
      - {text: "Imposer l'inverse : tout passer par valeur, les pointeurs étant réservés à `unsafe`", correct: false}
      - {text: "Approuver, en ajoutant un test de nil devant chaque accès à un champ", correct: false}
    answer: |-
      Je propose de mesurer : un benchmark avec `-benchmem` et l'analyse d'échappement (`go build -gcflags=-m`) montrent
      souvent que les pointeurs font allouer sur le tas, alors que de petites structs copiées restent sur la pile.
      Au-delà de la performance, le pointeur change la sémantique : partage, mutations à distance, nil possible. Je garde
      les pointeurs là où ils ont une raison (mutation, taille, non-copiable) et des valeurs ailleurs.
  - key: scenario-optionnel
    format: scenario
    question: Dans une API de mise à jour partielle (PATCH), comment distinguer un champ absent d'un champ mis à zéro ?
    choices:
      - {text: "Des champs pointeurs dans le DTO : nil pour « non fourni », pointeur vers 0 pour « zéro »", correct: true}
      - {text: "Des champs valeur : la valeur zéro y signifie toujours « non fourni »", correct: false}
      - {text: "Des champs `any`, testés par assertion de type sur leur contenu", correct: false}
      - {text: "Une valeur sentinelle comme `-1`, réservée au cas « non fourni »", correct: false}
    answer: |-
      Avec des champs pointeurs dans le DTO : `Nom *string`, `Age *int`. Un pointeur nil signifie « non fourni, ne pas
      toucher » ; un pointeur vers "" ou 0 signifie « mettre à vide ». Pour pouvoir aussi distinguer « mettre à null »,
      certaines équipes utilisent un type option dédié. On applique ensuite seulement les champs non nil à l'entité.
  - key: qcm-references
    format: multiple-choice
    question: "Lequel de ces paramètres une fonction peut-elle modifier sans recevoir de pointeur ?"
    choices:
      - {text: "Une map, pour y ajouter des entrées", correct: true}
      - {text: "Une struct, pour changer un de ses champs", correct: false}
      - {text: "Un `int`, pour l'incrémenter", correct: false}
      - {text: "Un tableau `[3]int`, pour changer un élément", correct: false}
    answer: "Une map (comme un slice, pour ses éléments) partage ses données : la fonction les modifie sans pointeur. Une struct, un `int` ou un tableau sont copiés : il leur faut un pointeur."
  - key: code-pointeur-nil-sens
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Requete struct{ Limite *int }

      func limite(r Requete) int {
      	if r.Limite == nil {
      		return 20
      	}
      	return *r.Limite
      }

      zero := 0
      fmt.Println(limite(Requete{}), limite(Requete{Limite: &zero}))
      ```
    choices:
      - {text: "`20 0`", correct: true}
      - {text: "`20 20`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "Une panic : nil pointer dereference", correct: false}
    answer: '`20 0` : le pointeur nil signifie « non fourni », un pointeur vers 0 « zéro demandé ».'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Requete struct{ Limite *int }\n\n\nfunc limite(r Requete) int {\n\tif r.Limite == nil {\n\t\treturn 20\n\t}\n\treturn *r.Limite\n}\n\nfunc main() {\n\tzero := 0\n\tfmt.Println(limite(Requete{}), limite(Requete{Limite: &zero}))\n}\n"
      output: 20 0
