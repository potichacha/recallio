notion: embedding-structs
lesson: "L'**embarquement** (embedding) : un champ **sans nom**, juste un type, dont les champs et les méthodes sont\n**promus** au niveau de la struct englobante.\n\n```go\ntype Horodatage struct {\n\tCreeLe, ModifieLe time.Time\n}\n\nfunc (h *Horodatage) Toucher(t time.Time) { h.ModifieLe = t }\n\ntype Article struct {\n\tHorodatage        // embarqué : le champ s'appelle Horodatage\n\tTitre string\n}\n\na := Article{Titre: \"Go\"}\na.Toucher(time.Now())     // méthode promue\nfmt.Println(a.ModifieLe)  // champ promu\nfmt.Println(a.Horodatage.CreeLe) // accès explicite toujours possible\n```\n\n- Le champ embarqué porte le **nom de son type** (`a.Horodatage`).\n- Les méthodes promues **comptent pour les interfaces** : si `Horodatage` implémente une interface, `Article` aussi\n  (selon les règles d'ensemble de méthodes).\n- Une méthode ou un champ de même nom dans la struct englobante **masque** celui de l'embarqué.\n- On peut embarquer un **pointeur** (`*Horodatage`) ; attention, il vaut nil par défaut.\n- Le receveur d'une méthode promue reste l'**embarqué**, pas la struct englobante : ce n'est pas de l'héritage.\n\n**Piège classique** : embarquer un `sync.Mutex` dans une struct **exportée**. Les méthodes `Lock` et `Unlock`\ndeviennent publiques, et n'importe quel appelant peut verrouiller l'objet. On garde un champ nommé non exporté\n(`mu sync.Mutex`).\n\n**En entretien** : « Un champ sans nom dont champs et méthodes sont promus, ce qui compte pour les interfaces ; un nom\nlocal masque l'embarqué ; ce n'est pas de l'héritage, le receveur reste l'embarqué. »"
tour:
  - title: L'embarquement
    text: |-
      Go n'a pas d'héritage : il a la **composition**. Une struct peut **embarquer** un autre type en le nommant sans
      nom de champ : `type Employe struct { Personne; Poste string }`.

      Les champs et les méthodes du type embarqué sont **promus** : `e.Nom` et `e.Presente()` marchent directement. Ce
      n'est pas un héritage : un `Employe` n'est pas une `Personne`, et une fonction qui attend une `Personne` ne prend
      pas un `Employe`. Mais `Employe` satisfait les interfaces que satisfait `Personne`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Personne struct {
          	Nom string
          }

          func (p Personne) Presente() string {
          	return "Je suis " + p.Nom
          }

          type Employe struct {
          	Personne
          	Poste string
          }

          func main() {
          	e := Employe{Personne: Personne{Nom: "Ada"}, Poste: "ingénieure"}
          	fmt.Println(e.Nom, "-", e.Poste)
          	fmt.Println(e.Presente())
          	fmt.Println(e.Personne.Nom)
          }
      output: |-
        Ada - ingénieure
        Je suis Ada
        Ada
cards:
  - key: sont-methodes-promues
    format: course
    question: "En Go, qu'appelle-t-on une méthode promue ?"
    choices:
      - {text: "Une méthode d'un type embarqué, appelable directement sur la struct englobante", correct: true}
      - {text: "Une méthode redéfinie par la struct englobante, qui remplace celle de l'embarqué", correct: false}
      - {text: "Une méthode exportée, visible depuis les autres packages grâce à sa majuscule", correct: false}
      - {text: "Une méthode à receveur valeur, appelable aussi sur un pointeur vers le type", correct: false}
    answer: "Les méthodes du type embarqué, accessibles directement sur le type englobant : `a.Toucher()` au lieu de `a.Horodatage.Toucher()`. Leur receveur reste l'embarqué."
  - key: eviter-embarquer-sync-mutex-struct-exportee
    format: course
    question: "Pourquoi éviter d'embarquer un `sync.Mutex` dans une struct exportée ?"
    choices:
      - {text: "`Lock` et `Unlock` deviennent des méthodes publiques de la struct", correct: true}
      - {text: "L'embarquement d'un mutex ne compile pas dans une struct exportée", correct: false}
      - {text: "Le mutex embarqué est copié à chaque appel d'une méthode de la struct", correct: false}
      - {text: "Un mutex embarqué ne protège plus que les champs non exportés", correct: false}
    answer: "`Lock` et `Unlock` deviennent publics : n'importe quel appelant peut verrouiller l'objet. On préfère un champ nommé non exporté, `mu sync.Mutex`."
  - key: code-type-base-struct-func-base
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Base struct{}
      func (Base) Nom() string      { return "base" }
      func (b Base) Salut() string  { return "je suis " + b.Nom() }
      type Derive struct{ Base }
      func (Derive) Nom() string    { return "derive" }

      fmt.Println(Derive{}.Salut())
      ```
    choices:
      - {text: "`je suis base`", correct: true}
      - {text: "`je suis derive`", correct: false}
      - {text: "`base`", correct: false}
      - {text: "Ça ne compile pas : `Nom` est déclarée deux fois", correct: false}
    answer: '`je suis base` : l''embedding n''est pas de l''héritage ; `Salut` est appelée sur le `Base` embarqué, qui appelle `Base.Nom`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Base struct{}\n\nfunc (Base) Nom() string     { return \"base\" }\nfunc (b Base) Salut() string { return \"je suis \" + b.Nom() }\n\ntype Derive struct{ Base }\n\nfunc (Derive) Nom() string { return \"derive\" }\n\nfunc main() {\n\tfmt.Println(Derive{}.Salut())\n}\n"
      output: je suis base
  - key: terme-embedding
    format: course
    question: "Que désigne l'« embedding » (l'embarquement) en Go ?"
    choices:
      - {text: "Une composition par champ anonyme, dont les champs et méthodes sont promus", correct: true}
      - {text: "Un héritage de struct, où le type englobant devient un sous-type de l'embarqué", correct: false}
      - {text: "L'inclusion de fichiers dans le binaire, avec la directive `//go:embed`", correct: false}
      - {text: "La déclaration d'un type à l'intérieur d'une fonction, invisible ailleurs", correct: false}
    answer: "Une composition par champ anonyme : les champs et méthodes de l'embarqué sont promus, sans relation de sous-type. Rien à voir avec `//go:embed`, qui inclut des fichiers dans le binaire."
  - key: nom-champ
    format: course
    question: "Quel nom porte un champ embarqué, comme `*Horodatage` ou `bytes.Buffer` ?"
    choices:
      - {text: "Le nom de son type, sans package ni étoile : `Horodatage`, `Buffer`", correct: true}
      - {text: "Le nom complet de son type : `*Horodatage`, `bytes.Buffer`", correct: false}
      - {text: "Aucun : on n'y accède que par ses champs et méthodes promus", correct: false}
      - {text: "`Embedded`, le même nom pour tous les champs embarqués", correct: false}
    answer: 'Le nom de son type, sans le package : `a.Horodatage` pour un champ `Horodatage` ou `*Horodatage`, `b.Buffer` pour `bytes.Buffer`.'
  - key: vf-interfaces
    format: true-false
    question: Les méthodes promues d'un champ embarqué permettent à la struct englobante d'implémenter une interface.
    truth: true
    answer: Elles font partie de l'ensemble de méthodes de la struct.
  - key: vf-masquage
    format: true-false
    question: Une méthode de la struct englobante qui a le même nom qu'une méthode de l'embarqué provoque une erreur de compilation.
    truth: false
    answer: Elle masque simplement la méthode embarquée, toujours accessible par `s.Embarque.M()`.
  - key: vf-pointeur-nil
    format: true-false
    question: Un pointeur embarqué non initialisé fait paniquer l'appel de ses méthodes promues qui lisent des champs.
    truth: true
    answer: Il vaut nil ; il faut l'initialiser à la construction.
  - key: vf-ambiguite
    format: true-false
    question: Si deux types embarqués ont une méthode de même nom, l'appel de cette méthode sur la struct est ambigu et ne compile pas.
    truth: true
    answer: « ambiguous selector » ; on appelle alors explicitement `s.A.M()` ou `s.B.M()`.
  - key: qcm-acces
    format: multiple-choice
    question: "Avec `type Article struct { Horodatage; Titre string }` et `a` un `Article`, lequel de ces accès ne compile pas ?"
    choices:
      - {text: "`a.super.ModifieLe`", correct: true}
      - {text: "`a.ModifieLe`", correct: false}
      - {text: "`a.Horodatage.ModifieLe`", correct: false}
      - {text: "`a.Titre`", correct: false}
    answer: "Go n'a pas de `super` : le champ est promu (`a.ModifieLe`), et l'accès explicite par le nom du type embarqué reste permis (`a.Horodatage.ModifieLe`)."
  - key: qcm-mutex
    format: multiple-choice
    question: "Quel risque prend-on en embarquant un `sync.Mutex` dans une struct exportée ?"
    choices:
      - {text: "N'importe quel appelant peut verrouiller l'objet et créer un interblocage", correct: true}
      - {text: "L'embarquement d'un mutex ne compile pas dans une struct exportée", correct: false}
      - {text: "Le mutex est copié à chaque appel d'une méthode promue de la struct", correct: false}
      - {text: "Le mutex embarqué ne protège plus que les champs exportés de la struct", correct: false}
    answer: "`Lock` et `Unlock` deviennent des méthodes publiques : un appelant peut verrouiller l'objet et créer un interblocage. On préfère un champ nommé non exporté, `mu sync.Mutex`."
  - key: qcm-litteral
    format: multiple-choice
    question: Comment initialiser le champ embarqué dans un littéral `Article` ?
    choices:
      - text: '`Article{Horodatage: Horodatage{CreeLe: t}, Titre: "Go"}`'
        correct: true
      - text: '`Article{CreeLe: t, Titre: "Go"}`'
        correct: false
      - text: '`Article{super: Horodatage{}, Titre: "Go"}`'
        correct: false
      - text: '`Article{Titre: "Go"}.Horodatage(t)`'
        correct: false
    answer: Un champ promu ne s'initialise pas directement dans le littéral ; on passe par le nom du type.
  - key: qcm-promotion
    format: multiple-choice
    question: "Avec `type Article struct{ Horodatage }`, qu'est-ce qui n'est pas promu au niveau d'`Article` ?"
    choices:
      - {text: "Les fonctions qui prennent un `Horodatage`", correct: true}
      - {text: "Les champs exportés de `Horodatage`, comme `CreeLe`", correct: false}
      - {text: "Les champs non exportés de `Horodatage`, comme `version`", correct: false}
      - {text: "Les méthodes déclarées sur `Horodatage`", correct: false}
    answer: "Les champs (exportés ou non, avec la visibilité habituelle) et les méthodes de l'embarqué sont promus. Une fonction libre n'appartient à aucun type : elle n'est jamais promue."
  - key: trous-embarquer
    format: fill-in
    question: |-
      Complète pour embarquer `Horodatage` :
      ```go
      type Article struct {
      	___
      	Titre string
      }
      ```
    blanks:
      - - Horodatage
        - '*Horodatage'
    answer: Un champ sans nom, seulement le type.
  - key: trous-acces
    format: fill-in
    question: |-
      Complète l'accès explicite au champ embarqué :
      ```go
      a.___.CreeLe = time.Now()
      ```
    blanks:
      - - Horodatage
    answer: Le champ embarqué porte le nom de son type.
  - key: trous-litteral
    format: fill-in
    question: |-
      Complète le littéral :
      ```go
      a := Article{___: Horodatage{CreeLe: t}, Titre: "Go"}
      ```
    blanks:
      - - Horodatage
    answer: On initialise l'embarqué par le nom de son type.
  - key: trous-mutex
    format: fill-in
    question: |-
      Complète pour garder le verrou privé plutôt que de l'embarquer :
      ```go
      type Cache struct {
      	___ sync.Mutex
      	entrees map[string]string
      }
      ```
    blanks:
      - - mu
    answer: Un champ nommé non exporté ne promeut pas `Lock` et `Unlock`.
  - key: code-promotion
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Horodatage struct{ Version int }

      func (h *Horodatage) Incrementer() { h.Version++ }

      type Article struct {
      	Horodatage
      	Titre string
      }

      a := Article{Titre: "Go"}
      a.Incrementer()
      a.Incrementer()
      fmt.Println(a.Version, a.Horodatage.Version)
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`0 0`", correct: false}
      - {text: "`2 0`", correct: false}
      - {text: "`0 2`", correct: false}
    answer: '`2 2` : la méthode et le champ sont promus, et désignent ceux de l''embarqué.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Horodatage struct{ Version int }\n\n\nfunc (h *Horodatage) Incrementer() { h.Version++ }\n\n\ntype Article struct {\n\tHorodatage\n\tTitre string\n}\n\nfunc main() {\n\ta := Article{Titre: \"Go\"}\n\ta.Incrementer()\n\ta.Incrementer()\n\tfmt.Println(a.Version, a.Horodatage.Version)\n}\n"
      output: 2 2
  - key: code-masquage
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Animal struct{}

      func (Animal) Cri() string { return "..." }

      type Chien struct{ Animal }

      func (Chien) Cri() string { return "wouf" }

      c := Chien{}
      fmt.Println(c.Cri(), c.Animal.Cri())
      ```
    choices:
      - {text: "`wouf ...`", correct: true}
      - {text: "`... ...`", correct: false}
      - {text: "`wouf wouf`", correct: false}
      - {text: "Ça ne compile pas : `Cri` est déclarée deux fois", correct: false}
    answer: '`wouf ...` : la méthode de `Chien` masque celle d''`Animal`, toujours accessible explicitement.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Animal struct{}\n\n\nfunc (Animal) Cri() string { return \"...\" }\n\n\ntype Chien struct{ Animal }\n\n\nfunc (Chien) Cri() string { return \"wouf\" }\n\nfunc main() {\n\tc := Chien{}\n\tfmt.Println(c.Cri(), c.Animal.Cri())\n}\n"
      output: wouf ...
  - key: code-interface
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Journal struct{ strings.Builder }

      var w io.Writer = &Journal{}
      fmt.Fprint(w, "ok")
      fmt.Println(w.(*Journal).String())
      ```
    choices:
      - {text: "`ok`", correct: true}
      - {text: "`{ok}`", correct: false}
      - {text: "Ça ne compile pas : `*Journal` n'a pas de méthode `Write`", correct: false}
      - {text: "Une panic : l'assertion vers `*Journal` échoue", correct: false}
    answer: '`ok` : les méthodes promues de `strings.Builder` font de `*Journal` un `io.Writer`.'
    check:
      code: "package main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n)\n\ntype Journal struct{ strings.Builder }\n\nfunc main() {\n\tvar w io.Writer = &Journal{}\n\tfmt.Fprint(w, \"ok\")\n\tfmt.Println(w.(*Journal).String())\n}\n"
      output: ok
  - key: bug-mutex-public
    format: bug-fix
    question: |-
      Un appelant a verrouillé le cache depuis l'extérieur et bloqué le service. Quelle correction est la bonne ?
      ```go
      type Cache struct {
      	sync.Mutex
      	Entrees map[string]string
      }
      ```
    choices:
      - {text: "Un champ nommé non exporté, `mu sync.Mutex`, et des entrées non exportées", correct: true}
      - {text: "Embarquer `*sync.Mutex`, un pointeur, plutôt que la valeur du mutex", correct: false}
      - {text: "Embarquer un `sync.RWMutex`, qui ne bloque pas les lecteurs du cache", correct: false}
      - {text: "Documenter que `Lock` est réservée à l'usage interne du package", correct: false}
    answer: "```go\ntype Cache struct {\n\tmu      sync.Mutex\n\tentrees map[string]string\n}\n```\nEmbarqué, le mutex exposait `Lock` et `Unlock` dans l'API publique ; un champ privé le réserve au package."
  - key: bug-pointeur-nil
    format: bug-fix
    question: |-
      Le service panique au premier appel de `s.Println`. Quelle correction est la bonne ?
      ```go
      type Service struct {
      	*log.Logger
      }

      s := Service{}
      s.Println("démarrage")
      ```
    choices:
      - {text: "Initialiser l'embarqué : `Service{Logger: log.New(os.Stderr, \"service \", log.LstdFlags)}`", correct: true}
      - {text: "Appeler `s.Logger.Println` au lieu de la méthode promue `s.Println`", correct: false}
      - {text: "Construire un pointeur, `&Service{}`, au lieu d'une valeur `Service{}`", correct: false}
      - {text: "Remplacer l'embarqué par un champ nommé, `logger *log.Logger`, sans rien d'autre", correct: false}
    answer: |-
      ```go
      s := Service{Logger: log.New(os.Stderr, "service ", log.LstdFlags)}
      s.Println("démarrage")
      ```
      Le pointeur embarqué valait nil ; on l'initialise à la construction (ou l'on embarque une valeur).
  - key: bug-ambigu
    format: bug-fix
    question: |-
      Le compilateur signale « ambiguous selector f.Close ». Quelle correction est la bonne ?
      ```go
      type Fichiers struct {
      	*os.File
      	*gzip.Writer
      }

      f.Close()
      ```
    choices:
      - {text: "Définir `Close` sur `Fichiers`, qui ferme le `gzip.Writer` puis le fichier", correct: true}
      - {text: "Changer l'ordre des embarqués, pour que `*os.File` passe en premier", correct: false}
      - {text: "Embarquer `gzip.Writer` par valeur, pour qu'il devienne prioritaire", correct: false}
      - {text: "Appeler `f.Close()` deux fois, une fois pour chaque type embarqué", correct: false}
    answer: "```go\nfunc (f Fichiers) Close() error {\n\tif err := f.Writer.Close(); err != nil {\n\t\treturn err\n\t}\n\treturn f.File.Close()\n}\n```\nDeux embarqués ont `Close` : on définit la méthode sur la struct, ce qui lève l'ambiguïté et fixe l'ordre."
  - key: bug-litteral
    format: bug-fix
    question: |-
      Le compilateur signale « unknown field CreeLe in struct literal ». Quelle correction est la bonne ?
      ```go
      a := Article{CreeLe: time.Now(), Titre: "Go"}
      ```
    choices:
      - {text: "`Article{Horodatage: Horodatage{CreeLe: time.Now()}, Titre: \"Go\"}`", correct: true}
      - {text: "`Article{Horodatage.CreeLe: time.Now(), Titre: \"Go\"}`", correct: false}
      - {text: "`Article{super: Horodatage{CreeLe: time.Now()}, Titre: \"Go\"}`", correct: false}
      - {text: "`Article{&Horodatage{CreeLe: time.Now()}, Titre: \"Go\"}`", correct: false}
    answer: |-
      ```go
      a := Article{Horodatage: Horodatage{CreeLe: time.Now()}, Titre: "Go"}
      ```
      Un champ promu se lit et s'écrit directement, mais ne s'initialise dans un littéral qu'à travers l'embarqué.
