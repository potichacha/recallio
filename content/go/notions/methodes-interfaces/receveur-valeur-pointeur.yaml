notion: receveur-valeur-pointeur
lesson: |-
  Le receveur d'une méthode est une **valeur** ou un **pointeur** :

  ```go
  type Compte struct{ solde int }

  func (c Compte) Solde() int        { return c.solde }   // receveur valeur : travaille sur une copie
  func (c *Compte) Deposer(n int)    { c.solde += n }     // receveur pointeur : modifie l'original
  ```

  **Receveur pointeur** quand :
  - la méthode **modifie** le receveur ;
  - le type contient un **mutex** ou ne doit pas être copié ;
  - la struct est **grosse** ;
  - par **cohérence** : si une méthode du type a un receveur pointeur, on les met toutes en pointeur.

  **Receveur valeur** pour les petits types immuables (`time.Time`, `Celsius`, un `Point`), les types de base nommés,
  les maps et slices nommés qui ne changent pas d'en-tête.

  Go convertit à l'appel : `c.Deposer(5)` sur une **variable** `c` (adressable) devient `(&c).Deposer(5)` ; et un
  pointeur appelle une méthode valeur en se déréférençant. Ce sucre ne s'applique **pas** aux valeurs non adressables :
  un élément de map (`m[k].Deposer(1)` ne compile pas), le résultat d'une fonction, une constante.

  L'autre conséquence touche les interfaces : si `Deposer` a un receveur pointeur, seul `*Compte` (pas `Compte`)
  implémente une interface qui la demande (voir l'ensemble de méthodes).

  **Piège classique** : un receveur valeur sur une méthode qui modifie le type ; le changement s'applique à une copie
  et disparaît, sans erreur.

  **En entretien** : « Pointeur pour modifier, pour les mutex et les grosses structs, et par cohérence ; valeur pour les
  petits types immuables ; Go prend l'adresse tout seul sur une variable, pas sur un élément de map. »
tour:
  - title: Receveur valeur ou pointeur
    text: |-
      Un receveur **valeur** reçoit une copie : la méthode ne peut pas modifier l'original. Un receveur **pointeur**,
      `func (c *Compteur) Incremente()`, travaille sur l'original.

      On choisit un receveur pointeur quand la méthode modifie le receveur, ou quand la struct est lourde à copier. Et
      on reste cohérent : si une méthode d'un type a un receveur pointeur, toutes l'ont, en général.

      Go prend l'adresse tout seul : sur une variable `c`, `c.Incremente()` appelle `(&c).Incremente()`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Compteur struct {
          	n int
          }

          func (c Compteur) IncrementeCopie() {
          	c.n++
          }

          func (c *Compteur) Incremente() {
          	c.n++
          }

          func main() {
          	var c Compteur
          	c.IncrementeCopie()
          	fmt.Println(c.n)
          	c.Incremente()
          	c.Incremente()
          	fmt.Println(c.n)
          }
      output: |-
        0
        2
cards:
  - key: receveur-valeur-vs-pointeur
    format: course
    question: "Quelle différence y a-t-il entre un receveur valeur et un receveur pointeur ?"
    choices:
      - {text: "Le receveur valeur travaille sur une copie ; le pointeur, sur l'original", correct: true}
      - {text: "Le receveur valeur est plus lent, car Go le convertit en pointeur", correct: false}
      - {text: "Le receveur pointeur ne s'appelle que sur une variable de type pointeur", correct: false}
      - {text: "Aucune : Go choisit le passage le plus rapide selon la taille du type", correct: false}
    answer: "Un receveur valeur reçoit une copie : il ne modifie pas l'original. Un receveur pointeur accède à l'original, sans copie. Sur une variable, Go prend l'adresse tout seul pour appeler une méthode pointeur."
  - key: quand-choisir-receveur-pointeur
    format: course
    question: Quand choisir un receveur pointeur ?
    choices:
      - {text: "Pour modifier le receveur, pour une grosse struct ou un type non copiable, ou par cohérence", correct: true}
      - {text: "Pour toute méthode exportée, afin que les autres packages puissent l'appeler", correct: false}
      - {text: "Pour les petits types comme `Celsius`, afin d'éviter la moindre copie", correct: false}
      - {text: "Pour toute méthode qui renvoie une valeur, afin d'éviter de la recopier", correct: false}
    answer: Pour modifier le receveur, pour une grosse struct, pour un type non copiable (mutex), ou par cohérence si une autre méthode l'est.
  - key: melanger-receveurs-valeur-pointeur-meme-type
    format: course
    question: Faut-il mélanger receveurs valeur et pointeur sur un même type ?
    choices:
      - {text: "À éviter : on garde la même sorte de receveur pour toutes les méthodes", correct: true}
      - {text: "Oui : valeur pour les lectures, pointeur pour les écritures, toujours", correct: false}
      - {text: "Impossible : le compilateur refuse les deux sortes sur un même type", correct: false}
      - {text: "Oui : c'est ce qui permet à la valeur d'implémenter toutes les interfaces", correct: false}
    answer: "À éviter ; on garde la même sorte pour toutes les méthodes. Le mélange compile, mais les ensembles de méthodes de `T` et de `*T` diffèrent, ce qui surprend."
  - key: code-type-compte-struct-int-func
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compte struct{ s int }
      func (c Compte) DeposerV(n int)  { c.s += n }
      func (c *Compte) DeposerP(n int) { c.s += n }

      cc := Compte{}
      cc.DeposerV(10); fmt.Println(cc.s)
      cc.DeposerP(10); fmt.Println(cc.s)
      ```
    choices:
      - text: |-
          ```
          0
          10
          ```
        correct: true
      - text: |-
          ```
          10
          20
          ```
        correct: false
      - text: |-
          ```
          10
          10
          ```
        correct: false
      - text: |-
          ```
          0
          0
          ```
        correct: false
    answer: '`0` puis `10` : le receveur valeur modifie une copie ; le receveur pointeur modifie l''original (Go prend automatiquement `&cc`).'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compte struct{ s int }\n\nfunc (c Compte) DeposerV(n int)  { c.s += n }\nfunc (c *Compte) DeposerP(n int) { c.s += n }\n\nfunc main() {\n\tcc := Compte{}\n\tcc.DeposerV(10)\n\tfmt.Println(cc.s)\n\tcc.DeposerP(10)\n\tfmt.Println(cc.s)\n}\n"
      output: |-
        0
        10
  - key: terme-receveur
    format: course
    question: "En Go, que désigne le « receveur » d'une méthode ?"
    choices:
      - {text: "Le paramètre spécial, valeur ou pointeur, sur lequel la méthode est appelée", correct: true}
      - {text: "La variable qui reçoit la valeur renvoyée par la méthode", correct: false}
      - {text: "Le channel par lequel une goroutine reçoit ses messages", correct: false}
      - {text: "L'interface que la méthode permet d'implémenter", correct: false}
    answer: "Le paramètre spécial écrit avant le nom de la méthode, `func (c *Compte) Deposer(...)` : la valeur ou le pointeur sur lequel la méthode est appelée."
  - key: sucre
    format: course
    question: Pourquoi `c.Deposer(5)` compile-t-il sur une variable `c` de type `Compte` alors que `Deposer` a un receveur `*Compte` ?
    choices:
      - {text: "`c` est adressable : Go réécrit l'appel en `(&c).Deposer(5)`", correct: true}
      - {text: "Go convertit `Deposer` en méthode à receveur valeur", correct: false}
      - {text: "Go copie `c` dans un nouveau `*Compte` alloué sur le tas", correct: false}
      - {text: "Toute méthode s'appelle sur la valeur comme sur le pointeur", correct: false}
    answer: 'Parce que `c` est adressable : Go réécrit l''appel en `(&c).Deposer(5)`.'
  - key: map-element
    format: course
    question: Pourquoi `m["a"].Deposer(5)` ne compile-t-il pas avec `map[string]Compte` ?
    choices:
      - {text: "Un élément de map n'est pas adressable : Go ne peut pas prendre son adresse", correct: true}
      - {text: "Une map ne peut pas contenir de types qui ont des méthodes", correct: false}
      - {text: "La clé `\"a\"` n'existe pas encore dans la map au moment de l'appel", correct: false}
      - {text: "Il faut verrouiller la map avant d'appeler une méthode sur un élément", correct: false}
    answer: 'Un élément de map n''est pas adressable : Go ne peut pas en prendre l''adresse pour le receveur pointeur ; on stocke des `*Compte`, ou l''on relit, modifie et réécrit.'
  - key: vf-copie
    format: true-false
    question: Une méthode à receveur valeur peut modifier durablement le champ d'une struct.
    truth: false
    answer: Elle modifie une copie, qui disparaît à la fin de l'appel.
  - key: vf-coherence
    format: true-false
    question: Il est recommandé de garder le même type de receveur pour toutes les méthodes d'un type.
    truth: true
    answer: Mélanger brouille l'ensemble de méthodes et la sémantique de copie.
  - key: vf-pointeur-vers-valeur
    format: true-false
    question: Un pointeur `*T` peut appeler une méthode à receveur valeur `T`.
    truth: true
    answer: Go le déréférence automatiquement.
  - key: vf-mutex
    format: true-false
    question: Un type qui contient un `sync.Mutex` peut avoir des méthodes à receveur valeur sans risque.
    truth: false
    answer: Chaque appel copierait le mutex ; `go vet` le signale.
  - key: qcm-pointeur
    format: multiple-choice
    question: "Laquelle de ces méthodes doit avoir un receveur pointeur ?"
    choices:
      - {text: "`Deposer`, qui modifie le solde du compte", correct: true}
      - {text: "`Celsius.Fahrenheit()`, qui renvoie une conversion", correct: false}
      - {text: "`Point.Distance(q Point)`, qui calcule une distance", correct: false}
      - {text: "`Money.Add(m Money)`, qui renvoie un nouveau montant", correct: false}
    answer: "`Deposer` modifie l'état : il lui faut un pointeur, comme à toutes les méthodes d'un type qui contient un mutex. Les autres ne modifient rien sur de petits types."
  - key: qcm-appels
    format: multiple-choice
    question: "Avec `func (c *Compte) Deposer(n int)`, lesquels de ces appels compilent ?"
    choices:
      - text: '`var c Compte; c.Deposer(1)`'
        correct: true
      - text: '`p := &Compte{}; p.Deposer(1)`'
        correct: true
      - text: '`Compte{}.Deposer(1)`'
        correct: false
      - text: '`m["a"].Deposer(1)` avec `m map[string]Compte`'
        correct: false
    answer: Un littéral et un élément de map ne sont pas adressables.
  - key: qcm-valeur
    format: multiple-choice
    question: "Lequel de ces types garde naturellement des receveurs valeur ?"
    choices:
      - {text: "`type Celsius float64`", correct: true}
      - {text: "Un `Serveur` avec un mutex et des connexions", correct: false}
      - {text: "Un `Cache` qui s'enrichit à chaque appel", correct: false}
      - {text: "Un `Panier` dont `Ajouter` modifie la liste", correct: false}
    answer: "Les types petits ou immuables, comme `Celsius` ou `time.Time`, gardent des receveurs valeur ; ceux qui portent un état modifiable prennent un pointeur."
  - key: qcm-copie
    format: multiple-choice
    question: Que vaut `c.solde` après `func (c Compte) Deposer(n int) { c.solde += n }` puis `c.Deposer(10)` ?
    choices:
      - text: 'Inchangé : la méthode a modifié une copie'
        correct: true
      - text: Augmenté de 10
        correct: false
      - text: Le code ne compile pas
        correct: false
      - text: Une panique
        correct: false
    answer: Bug silencieux classique ; le receveur doit être un pointeur.
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complète pour que la méthode modifie le compte :
      ```go
      func (c ___Compte) Retirer(n int) { c.solde -= n }
      ```
    blanks:
      - - '*'
    answer: Un receveur pointeur modifie l'original.
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète une méthode qui calcule sans modifier :
      ```go
      func (p ___) Distance(q Point) float64 {
      	return math.Hypot(q.X-p.X, q.Y-p.Y)
      }
      ```
    blanks:
      - - Point
    answer: Un receveur valeur convient à un petit type immuable.
  - key: trous-map-pointeurs
    format: fill-in
    question: |-
      Complète pour pouvoir appeler `m["a"].Deposer(5)` :
      ```go
      m := map[string]___Compte{"a": {}}
      ```
    blanks:
      - - '*'
    answer: Avec des pointeurs dans la map, le receveur pointeur est disponible.
  - key: trous-appel-explicite
    format: fill-in
    question: |-
      Complète la forme explicite de `c.Deposer(5)` :
      ```go
      (___c).Deposer(5)
      ```
    blanks:
      - - '&'
    answer: "C'est ce que Go écrit pour toi sur une variable adressable."
  - key: code-mixte
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compteur struct{ n int }

      func (c Compteur) IncrementerV() { c.n++ }
      func (c *Compteur) IncrementerP() { c.n++ }

      c := Compteur{}
      c.IncrementerV()
      c.IncrementerP()
      c.IncrementerP()
      fmt.Println(c.n)
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
