    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ n int }\n\n\nfunc (c Compteur) IncrementerV() { c.n++ }\n\nfunc (c *Compteur) IncrementerP() { c.n++ }\n\nfunc main() {\n\tc := Compteur{}\n\tc.IncrementerV()\n\tc.IncrementerP()\n\tc.IncrementerP()\n\tfmt.Println(c.n)\n}\n"
      output: '2'
  - key: code-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compte struct{ solde int }

      func (c *Compte) Deposer(n int) { c.solde += n }

      m := map[string]Compte{"a": {}}
      m["a"].Deposer(5)
      ```
    choices:
      - {text: "Ça ne compile pas : `m[\"a\"]` n'est pas adressable", correct: true}
      - {text: "Rien : la méthode modifie une copie du compte", correct: false}
      - {text: "Rien : le solde vaut 5, mais n'est pas affiché", correct: false}
      - {text: "Une panic : la clé `\"a\"` n'est pas adressable", correct: false}
    answer: "Ça ne compile pas : un élément de map n'est pas adressable, et Go ne peut pas en prendre l'adresse pour le receveur pointeur."
    check:
      code: "package main\n\ntype Compte struct{ solde int }\n\n\nfunc (c *Compte) Deposer(n int) { c.solde += n }\n\nfunc main() {\n\tm := map[string]Compte{\"a\": {}}\n\tm[\"a\"].Deposer(5)\n}\n"
      compiles: false
  - key: code-pointeurs-map
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Compte struct{ solde int }

      func (c *Compte) Deposer(n int) { c.solde += n }

      m := map[string]*Compte{"a": {}}
      m["a"].Deposer(5)
      m["a"].Deposer(7)
      fmt.Println(m["a"].solde)
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "`5`", correct: false}
    answer: '`12` : avec une map de pointeurs, chaque appel modifie le même compte.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compte struct{ solde int }\n\n\nfunc (c *Compte) Deposer(n int) { c.solde += n }\n\nfunc main() {\n\tm := map[string]*Compte{\"a\": {}}\n\tm[\"a\"].Deposer(5)\n\tm[\"a\"].Deposer(7)\n\tfmt.Println(m[\"a\"].solde)\n}\n"
      output: '12'
  - key: bug-receveur-valeur
    format: bug-fix
    question: |-
      Le panier reste toujours vide. Quelle correction est la bonne ?
      ```go
      func (p Panier) Ajouter(ref string) {
      	p.refs = append(p.refs, ref)
      }
      ```
    choices:
      - {text: "Un receveur pointeur : `func (p *Panier) Ajouter(ref string)`", correct: true}
      - {text: "Initialiser `p.refs` avec `make([]string, 0, 10)` avant l'`append`", correct: false}
      - {text: "Remplacer l'`append` par `p.refs[len(p.refs)] = ref`", correct: false}
      - {text: "Renvoyer `p.refs` à la fin de la méthode, sans rien d'autre", correct: false}
    answer: "```go\nfunc (p *Panier) Ajouter(ref string) {\n\tp.refs = append(p.refs, ref)\n}\n```\nAvec un receveur valeur, `append` modifiait la copie du panier."
  - key: bug-melange
    format: bug-fix
    question: |-
      Le type mélange les deux formes, et seul `*Service` satisfait l'interface `Demarreur`. Quelle correction est la bonne ?
      ```go
      func (s Service) Nom() string { return s.nom }
      func (s *Service) Demarrer() error { ... }
      func (s Service) Etat() string { return s.etat }
      ```
    choices:
      - {text: "Passer toutes les méthodes en receveur pointeur, `*Service`", correct: true}
      - {text: "Passer `Demarrer` en receveur valeur, comme les deux autres", correct: false}
      - {text: "Déclarer une interface pour `Service`, une autre pour `*Service`", correct: false}
      - {text: "Embarquer `*Service` dans `Service`, pour unifier les deux formes", correct: false}
    answer: |-
      ```go
      func (s *Service) Nom() string     { return s.nom }
      func (s *Service) Demarrer() error { ... }
      func (s *Service) Etat() string    { return s.etat }
      ```
      Dès qu'une méthode modifie l'état, on passe toutes les méthodes en pointeur : la copie et l'ensemble de méthodes
      deviennent cohérents.
  - key: bug-map
    format: bug-fix
    question: |-
      Le compilateur signale « cannot call pointer method Deposer on Compte ». Quelle correction est la bonne ?
      ```go
      comptes := map[string]Compte{}
      comptes[id].Deposer(montant)
      ```
    choices:
      - {text: "Une map de pointeurs, `map[string]*Compte`, ou relire, modifier, réécrire", correct: true}
      - {text: "Prendre l'adresse de l'élément : `(&comptes[id]).Deposer(montant)`", correct: false}
      - {text: "Passer `Deposer` en receveur valeur, sans rien changer d'autre", correct: false}
      - {text: "Créer la map avec `make(map[string]Compte)` plutôt qu'avec `{}`", correct: false}
    answer: |-
      ```go
      comptes := map[string]*Compte{}
      comptes[id].Deposer(montant) // après avoir vérifié que comptes[id] existe

      // ou, avec une map de valeurs :
      c := comptes[id]
      c.Deposer(montant)
      comptes[id] = c
      ```
      Un élément de map n'est pas adressable : map de pointeurs, ou relecture et réécriture.
  - key: bug-copie-boucle
    format: bug-fix
    question: |-
      Les comptes ne sont jamais crédités des intérêts. Quelle correction est la bonne ?
      ```go
      for _, c := range comptes { // comptes []Compte
      	c.Crediter(interets(c))
      }
      ```
    choices:
      - {text: "Itérer sur les indices et appeler `comptes[i].Crediter(...)`", correct: true}
      - {text: "Prendre l'adresse de la copie : `(&c).Crediter(interets(c))`", correct: false}
      - {text: "Passer à Go 1.22, où `c` désigne l'élément du slice", correct: false}
      - {text: "Passer `Crediter` en receveur valeur, plus simple à appeler", correct: false}
    answer: |-
      ```go
      for i := range comptes {
      	comptes[i].Crediter(interets(comptes[i]))
      }
      ```
      `c` est une copie de l'élément : la méthode à receveur pointeur modifiait la copie. Même depuis Go 1.22, la variable de boucle reste une copie.
  - key: scenario-choix
    format: scenario
    question: Comment choisis-tu le type de receveur pour un nouveau type ?
    choices:
      - {text: "Pointeur partout si une méthode modifie l'état, s'il y a un mutex ou si le type est gros ; sinon valeur partout", correct: true}
      - {text: "Valeur pour les méthodes qui lisent, pointeur pour celles qui écrivent, choisi méthode par méthode", correct: false}
      - {text: "Pointeur partout, toujours : c'est plus rapide, et cela évite de se poser la question", correct: false}
      - {text: "Valeur partout, toujours : le compilateur supprime de lui-même les copies inutiles", correct: false}
    answer: |-
      Je me demande si une méthode doit modifier l'état, si le type contient un mutex ou une ressource, ou s'il est
      gros : si oui, receveur pointeur pour toutes les méthodes. S'il s'agit d'une petite valeur immuable (une
      coordonnée, un montant, une durée), receveur valeur partout, et les « modifications » renvoient une nouvelle
      valeur. Je ne mélange pas, et je pense à l'interface : avec des receveurs pointeurs, c'est `*T` qui l'implémente.
  - key: scenario-revue
    format: scenario
    question: En revue, une méthode `Reinitialiser` à receveur valeur ne fait rien, et aucun test ne l'a vu. Que proposes-tu ?
    choices:
      - {text: "Passer le receveur en pointeur, tester l'état après l'appel, et activer un linter en CI", correct: true}
      - {text: "Supprimer la méthode, puisqu'aucun test ne la couvre et que personne ne l'a vu", correct: false}
      - {text: "Ajouter un commentaire qui signale que la méthode ne marche que sur un pointeur", correct: false}
      - {text: "Appeler la méthode deux fois de suite, pour que la seconde agisse sur l'original", correct: false}
    answer: |-
      Corriger le receveur en pointeur, ajouter le test qui vérifie l'état après l'appel, et vérifier les autres méthodes
      du type pour la cohérence. Un linter (`revive` avec la règle `modifies-value-receiver`, ou staticcheck) signale
      les receveurs valeur qui sont modifiés : je propose de l'activer en CI pour que ce bug ne revienne pas.
  - key: scenario-immuable
    format: scenario
    question: Pourquoi `time.Time` a-t-il des méthodes à receveur valeur comme `Add`, qui renvoient un nouveau `Time` ?
    choices:
      - {text: "Un instant est une valeur : `t.Add(d)` renvoie un nouvel instant, et personne ne modifie `t`", correct: true}
      - {text: "Parce que `time.Time` contient un mutex, qui interdit les receveurs pointeurs", correct: false}
      - {text: "Parce qu'une méthode à receveur pointeur ne peut pas renvoyer de valeur", correct: false}
      - {text: "Parce que `time.Time` est un alias d'`int64`, qui ne peut pas être pointé", correct: false}
    answer: |-
      Parce qu'un instant est une valeur : le copier ne pose aucun problème, et l'on veut qu'aucune fonction ne puisse
      modifier un `time.Time` qu'on lui passe. `t.Add(d)` renvoie un nouvel instant au lieu de modifier `t`. Ce style
      immuable rend le code plus sûr, y compris entre goroutines, au prix de petites copies sans importance.
  - key: scenario-interface
    format: scenario
    question: Ton type `Fichier` implémente `io.Writer` avec un receveur pointeur, et passer une valeur `Fichier` ne compile pas. Pourquoi, et que fais-tu ?
    choices:
      - {text: "`Write` est sur `*Fichier` : seul le pointeur implémente `io.Writer`, je passe `&f`", correct: true}
      - {text: "`io.Writer` exige un receveur valeur : je passe `Write` en receveur valeur", correct: false}
      - {text: "Une valeur `Fichier` n'est pas adressable : je la convertis avec `io.Writer(f)`", correct: false}
      - {text: "Le compilateur se trompe : j'ajoute `var _ io.Writer = Fichier{}` pour le forcer", correct: false}
    answer: |-
      L'ensemble de méthodes de `Fichier` (valeur) ne contient que les méthodes à receveur valeur ; `Write` étant sur
      `*Fichier`, seul le pointeur implémente `io.Writer`. On passe `&f` (ou l'on crée le fichier avec un constructeur
      qui renvoie un `*Fichier`). Ce n'est pas une limite à contourner : le pointeur est justement nécessaire pour que
      les écritures modifient le même fichier.
