notion: receveur-valeur-pointeur
cards:
  - key: receveur-valeur-vs-pointeur
    format: course
    question: Receveur valeur vs pointeur ?
    answer: Copie (pas de modification de l'original) vs accès à l'original (modification possible, pas de copie).
  - key: quand-choisir-receveur-pointeur
    format: course
    question: Quand choisir un receveur pointeur ?
    answer: Pour modifier le receveur, pour une grosse struct, pour un type non copiable (mutex), ou par cohérence si une autre méthode l'est.
  - key: melanger-receveurs-valeur-pointeur-meme-type
    format: course
    question: Faut-il mélanger receveurs valeur et pointeur sur un même type ?
    answer: À éviter ; on garde la même sorte pour toutes les méthodes.
  - key: code-type-compte-struct-int-func
    format: code-output
    question: |-
      ```go
      type Compte struct{ s int }
      func (c Compte) DeposerV(n int)  { c.s += n }
      func (c *Compte) DeposerP(n int) { c.s += n }

      cc := Compte{}
      cc.DeposerV(10); fmt.Println(cc.s)
      cc.DeposerP(10); fmt.Println(cc.s)
      ```
    answer: '`0` puis `10` : le receveur valeur modifie une copie ; le receveur pointeur modifie l''original (Go prend automatiquement `&cc`).'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compte struct{ s int }\n\nfunc (c Compte) DeposerV(n int)  { c.s += n }\nfunc (c *Compte) DeposerP(n int) { c.s += n }\n\nfunc main() {\n\tcc := Compte{}\n\tcc.DeposerV(10)\n\tfmt.Println(cc.s)\n\tcc.DeposerP(10)\n\tfmt.Println(cc.s)\n}\n"
      output: |-
        0
        10
  - key: terme-receveur
    format: course
    question: Que désigne « receveur » ?
    answer: Paramètre spécial d'une méthode (valeur ou pointeur)
