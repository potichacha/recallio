notion: receveur-valeur-pointeur
lesson: |-
  Le receveur d'une méthode est une **valeur** ou un **pointeur** :

  ```go
  type Compte struct{ solde int }

  func (c Compte) Solde() int        { return c.solde }   // receveur valeur : travaille sur une copie
  func (c *Compte) Deposer(n int)    { c.solde += n }     // receveur pointeur : modifie l'original
  ```

  **Receveur pointeur** quand :
  - la méthode **modifie** le receveur ;
  - le type contient un **mutex** ou ne doit pas être copié ;
  - la struct est **grosse** ;
  - par **cohérence** : si une méthode du type a un receveur pointeur, on les met toutes en pointeur.

  **Receveur valeur** pour les petits types immuables (`time.Time`, `Celsius`, un `Point`), les types de base nommés,
  les maps et slices nommés qui ne changent pas d'en-tête.

  Go convertit à l'appel : `c.Deposer(5)` sur une **variable** `c` (adressable) devient `(&c).Deposer(5)` ; et un
  pointeur appelle une méthode valeur en se déréférençant. Ce sucre ne s'applique **pas** aux valeurs non adressables :
  un élément de map (`m[k].Deposer(1)` ne compile pas), le résultat d'une fonction, une constante.

  L'autre conséquence touche les interfaces : si `Deposer` a un receveur pointeur, seul `*Compte` (pas `Compte`)
  implémente une interface qui la demande (voir l'ensemble de méthodes).

  **Piège classique** : un receveur valeur sur une méthode qui modifie le type ; le changement s'applique à une copie
  et disparaît, sans erreur.

  **En entretien** : « Pointeur pour modifier, pour les mutex et les grosses structs, et par cohérence ; valeur pour les
  petits types immuables ; Go prend l'adresse tout seul sur une variable, pas sur un élément de map. »
tour:
  - title: Receveur valeur ou pointeur
    text: |-
      Un receveur **valeur** reçoit une copie : la méthode ne peut pas modifier l'original. Un receveur **pointeur**,
      `func (c *Compteur) Incremente()`, travaille sur l'original.

      On choisit un receveur pointeur quand la méthode modifie le receveur, ou quand la struct est lourde à copier. Et
      on reste cohérent : si une méthode d'un type a un receveur pointeur, toutes l'ont, en général.

      Go prend l'adresse tout seul : sur une variable `c`, `c.Incremente()` appelle `(&c).Incremente()`.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          type Compteur struct {
          	n int
          }

          func (c Compteur) IncrementeCopie() {
          	c.n++
          }

          func (c *Compteur) Incremente() {
          	c.n++
          }

          func main() {
          	var c Compteur
          	c.IncrementeCopie()
          	fmt.Println(c.n)
          	c.Incremente()
          	c.Incremente()
          	fmt.Println(c.n)
          }
      output: |-
        0
        2
cards:
  - key: receveur-valeur-vs-pointeur
    format: course
    question: Receveur valeur vs pointeur ?
    answer: Copie (pas de modification de l'original) vs accès à l'original (modification possible, pas de copie).
  - key: quand-choisir-receveur-pointeur
    format: course
    question: Quand choisir un receveur pointeur ?
    answer: Pour modifier le receveur, pour une grosse struct, pour un type non copiable (mutex), ou par cohérence si une autre méthode l'est.
  - key: melanger-receveurs-valeur-pointeur-meme-type
    format: course
    question: Faut-il mélanger receveurs valeur et pointeur sur un même type ?
    answer: À éviter ; on garde la même sorte pour toutes les méthodes.
  - key: code-type-compte-struct-int-func
    format: code-output
    question: |-
      ```go
      type Compte struct{ s int }
      func (c Compte) DeposerV(n int)  { c.s += n }
      func (c *Compte) DeposerP(n int) { c.s += n }

      cc := Compte{}
      cc.DeposerV(10); fmt.Println(cc.s)
      cc.DeposerP(10); fmt.Println(cc.s)
      ```
    answer: '`0` puis `10` : le receveur valeur modifie une copie ; le receveur pointeur modifie l''original (Go prend automatiquement `&cc`).'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compte struct{ s int }\n\nfunc (c Compte) DeposerV(n int)  { c.s += n }\nfunc (c *Compte) DeposerP(n int) { c.s += n }\n\nfunc main() {\n\tcc := Compte{}\n\tcc.DeposerV(10)\n\tfmt.Println(cc.s)\n\tcc.DeposerP(10)\n\tfmt.Println(cc.s)\n}\n"
      output: |-
        0
        10
  - key: terme-receveur
    format: course
    question: Que désigne « receveur » ?
    answer: Paramètre spécial d'une méthode (valeur ou pointeur)
  - key: sucre
    format: course
    question: Pourquoi `c.Deposer(5)` compile-t-il sur une variable `c` de type `Compte` alors que `Deposer` a un receveur `*Compte` ?
    answer: 'Parce que `c` est adressable : Go réécrit l''appel en `(&c).Deposer(5)`.'
  - key: map-element
    format: course
    question: Pourquoi `m["a"].Deposer(5)` ne compile-t-il pas avec `map[string]Compte` ?
    answer: 'Un élément de map n''est pas adressable : Go ne peut pas en prendre l''adresse pour le receveur pointeur ; on stocke des `*Compte`, ou l''on relit, modifie et réécrit.'
  - key: vf-copie
    format: true-false
    question: Une méthode à receveur valeur peut modifier durablement le champ d'une struct.
    truth: false
    answer: Elle modifie une copie, qui disparaît à la fin de l'appel.
  - key: vf-coherence
    format: true-false
    question: Il est recommandé de garder le même type de receveur pour toutes les méthodes d'un type.
    truth: true
    answer: Mélanger brouille l'ensemble de méthodes et la sémantique de copie.
  - key: vf-pointeur-vers-valeur
    format: true-false
    question: Un pointeur `*T` peut appeler une méthode à receveur valeur `T`.
    truth: true
    answer: Go le déréférence automatiquement.
  - key: vf-mutex
    format: true-false
    question: Un type qui contient un `sync.Mutex` peut avoir des méthodes à receveur valeur sans risque.
    truth: false
    answer: Chaque appel copierait le mutex ; `go vet` le signale.
  - key: qcm-pointeur
    format: multiple-choice
    question: Quelles méthodes doivent avoir un receveur pointeur ?
    choices:
      - text: '`Deposer` qui modifie le solde'
        correct: true
      - text: Toutes les méthodes d'un type qui contient un sync.Mutex
        correct: true
      - text: '`Celsius.Fahrenheit()` qui renvoie une conversion'
        correct: false
      - text: '`Point.Distance(q Point)` qui calcule une distance'
        correct: false
    answer: Les deux dernières ne modifient rien sur de petits types.
  - key: qcm-appels
    format: multiple-choice
    question: Avec `func (c *Compte) Deposer(n int)`, quels appels compilent ?
    choices:
      - text: '`var c Compte; c.Deposer(1)`'
        correct: true
      - text: '`p := &Compte{}; p.Deposer(1)`'
        correct: true
      - text: '`Compte{}.Deposer(1)`'
        correct: false
      - text: '`m["a"].Deposer(1)` avec `m map[string]Compte`'
        correct: false
    answer: Un littéral et un élément de map ne sont pas adressables.
  - key: qcm-valeur
    format: multiple-choice
    question: Quels types gardent naturellement des receveurs valeur ?
    choices:
      - text: '`time.Time`'
        correct: true
      - text: '`type Celsius float64`'
        correct: true
      - text: Un type `Serveur` avec un mutex et des connexions
        correct: false
      - text: Un `Cache` qui s'enrichit à chaque appel
        correct: false
    answer: Les types immuables ou petits ; ceux qui portent un état modifiable prennent un pointeur.
  - key: qcm-copie
    format: multiple-choice
    question: Que vaut `c.solde` après `func (c Compte) Deposer(n int) { c.solde += n }` puis `c.Deposer(10)` ?
    choices:
      - text: 'Inchangé : la méthode a modifié une copie'
        correct: true
      - text: Augmenté de 10
        correct: false
      - text: Le code ne compile pas
        correct: false
      - text: Une panique
        correct: false
    answer: Bug silencieux classique ; le receveur doit être un pointeur.
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complétez pour que la méthode modifie le compte :
      ```go
      func (c ___Compte) Retirer(n int) { c.solde -= n }
      ```
    blanks:
      - - '*'
    answer: Un receveur pointeur modifie l'original.
  - key: trous-valeur
    format: fill-in
    question: "Complétez une méthode qui calcule sans modifier :\n```go\nfunc (p ___) Distance(q Point) float64 {\n\treturn math.Hypot(q.X-p.X, q.Y-p.Y)\n}\n```"
    blanks:
      - - Point
    answer: Un receveur valeur convient à un petit type immuable.
  - key: trous-map-pointeurs
    format: fill-in
    question: |-
      Complétez pour pouvoir appeler `m["a"].Deposer(5)` :
      ```go
      m := map[string]___Compte{"a": {}}
      ```
    blanks:
      - - '*'
    answer: Avec des pointeurs dans la map, le receveur pointeur est disponible.
  - key: trous-appel-explicite
    format: fill-in
    question: |-
      Complétez la forme explicite de `c.Deposer(5)` :
      ```go
      (___c).Deposer(5)
      ```
    blanks:
      - - '&'
    answer: C'est ce que Go écrit pour vous sur une variable adressable.
  - key: code-mixte
    format: code-output
    question: |-
      ```go
      type Compteur struct{ n int }

      func (c Compteur) IncrementerV() { c.n++ }
      func (c *Compteur) IncrementerP() { c.n++ }

      c := Compteur{}
      c.IncrementerV()
      c.IncrementerP()
      c.IncrementerP()
      fmt.Println(c.n)
      ```
    answer: '`2` : seuls les appels à receveur pointeur modifient `c`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ n int }\n\n\nfunc (c Compteur) IncrementerV() { c.n++ }\n\nfunc (c *Compteur) IncrementerP() { c.n++ }\n\nfunc main() {\n\tc := Compteur{}\n\tc.IncrementerV()\n\tc.IncrementerP()\n\tc.IncrementerP()\n\tfmt.Println(c.n)\n}\n"
      output: '2'
  - key: code-map
    format: code-output
    question: |-
      ```go
      type Compte struct{ solde int }

      func (c *Compte) Deposer(n int) { c.solde += n }

      m := map[string]Compte{"a": {}}
      m["a"].Deposer(5)
      ```
    answer: 'Rien : le code ne compile pas, un élément de map n''est pas adressable.'
    check:
      code: "package main\n\ntype Compte struct{ solde int }\n\n\nfunc (c *Compte) Deposer(n int) { c.solde += n }\n\nfunc main() {\n\tm := map[string]Compte{\"a\": {}}\n\tm[\"a\"].Deposer(5)\n}\n"
      compiles: false
  - key: code-pointeurs-map
    format: code-output
    question: |-
      ```go
      type Compte struct{ solde int }

      func (c *Compte) Deposer(n int) { c.solde += n }

      m := map[string]*Compte{"a": {}}
      m["a"].Deposer(5)
      m["a"].Deposer(7)
      fmt.Println(m["a"].solde)
      ```
    answer: '`12` : avec une map de pointeurs, chaque appel modifie le même compte.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compte struct{ solde int }\n\n\nfunc (c *Compte) Deposer(n int) { c.solde += n }\n\nfunc main() {\n\tm := map[string]*Compte{\"a\": {}}\n\tm[\"a\"].Deposer(5)\n\tm[\"a\"].Deposer(7)\n\tfmt.Println(m[\"a\"].solde)\n}\n"
      output: '12'
  - key: bug-receveur-valeur
    format: bug-fix
    question: "Le panier reste toujours vide :\n```go\nfunc (p Panier) Ajouter(ref string) {\n\tp.refs = append(p.refs, ref)\n}\n```"
    answer: "```go\nfunc (p *Panier) Ajouter(ref string) {\n\tp.refs = append(p.refs, ref)\n}\n```\nAvec un receveur valeur, `append` modifiait la copie du panier."
  - key: bug-melange
    format: bug-fix
    question: |-
      Le type mélange les deux formes, et seul `*Service` satisfait l'interface `Demarreur` :
      ```go
      func (s Service) Nom() string { return s.nom }
      func (s *Service) Demarrer() error { ... }
      func (s Service) Etat() string { return s.etat }
      ```
    answer: |-
      ```go
      func (s *Service) Nom() string     { return s.nom }
      func (s *Service) Demarrer() error { ... }
      func (s *Service) Etat() string    { return s.etat }
      ```
      Dès qu'une méthode modifie l'état, on passe toutes les méthodes en pointeur : la copie et l'ensemble de méthodes
      deviennent cohérents.
  - key: bug-map
    format: bug-fix
    question: |-
      Le compilateur signale « cannot call pointer method Deposer on Compte » :
      ```go
      comptes := map[string]Compte{}
      comptes[id].Deposer(montant)
      ```
    answer: |-
      ```go
      comptes := map[string]*Compte{}
      comptes[id].Deposer(montant) // après avoir vérifié que comptes[id] existe

      // ou, avec une map de valeurs :
      c := comptes[id]
      c.Deposer(montant)
      comptes[id] = c
      ```
      Un élément de map n'est pas adressable : map de pointeurs, ou relecture et réécriture.
  - key: bug-copie-boucle
    format: bug-fix
    question: "Les comptes ne sont jamais crédités des intérêts :\n```go\nfor _, c := range comptes { // comptes []Compte\n\tc.Crediter(interets(c))\n}\n```"
    answer: "```go\nfor i := range comptes {\n\tcomptes[i].Crediter(interets(comptes[i]))\n}\n```\n`c` est une copie de l'élément : la méthode à receveur pointeur modifiait la copie."
  - key: scenario-choix
    format: scenario
    question: Comment choisis-tu le type de receveur pour un nouveau type ?
    answer: |-
      Je me demande si une méthode doit modifier l'état, si le type contient un mutex ou une ressource, ou s'il est
      gros : si oui, receveur pointeur pour toutes les méthodes. S'il s'agit d'une petite valeur immuable (une
      coordonnée, un montant, une durée), receveur valeur partout, et les « modifications » renvoient une nouvelle
      valeur. Je ne mélange pas, et je pense à l'interface : avec des receveurs pointeurs, c'est `*T` qui l'implémente.
  - key: scenario-revue
    format: scenario
    question: En revue, une méthode `Reinitialiser` à receveur valeur ne fait rien, et aucun test ne l'a vu. Que proposes-tu ?
    answer: |-
      Corriger le receveur en pointeur, ajouter le test qui vérifie l'état après l'appel, et vérifier les autres méthodes
      du type pour la cohérence. Un linter (`revive` avec la règle `modifies-value-receiver`, ou staticcheck) signale
      les receveurs valeur qui sont modifiés : je propose de l'activer en CI pour que ce bug ne revienne pas.
  - key: scenario-immuable
    format: scenario
    question: Pourquoi `time.Time` a-t-il des méthodes à receveur valeur comme `Add`, qui renvoient un nouveau `Time` ?
    answer: |-
      Parce qu'un instant est une valeur : le copier ne pose aucun problème, et l'on veut qu'aucune fonction ne puisse
      modifier un `time.Time` qu'on lui passe. `t.Add(d)` renvoie un nouvel instant au lieu de modifier `t`. Ce style
      immuable rend le code plus sûr, y compris entre goroutines, au prix de petites copies sans importance.
  - key: scenario-interface
    format: scenario
    question: Ton type `Fichier` implémente `io.Writer` avec un receveur pointeur, et passer une valeur `Fichier` ne compile pas. Pourquoi, et que fais-tu ?
    answer: |-
      L'ensemble de méthodes de `Fichier` (valeur) ne contient que les méthodes à receveur valeur ; `Write` étant sur
      `*Fichier`, seul le pointeur implémente `io.Writer`. On passe `&f` (ou l'on crée le fichier avec un constructeur
      qui renvoie un `*Fichier`). Ce n'est pas une limite à contourner : le pointeur est justement nécessaire pour que
      les écritures modifient le même fichier.
