notion: type-switch
lesson: "Le **switch de type** teste le type dynamique d'une interface, cas par cas :\n\n```go\nfunc decrire(v any) string {\n\tswitch x := v.(type) {\n\tcase nil:\n\t\treturn \"rien\"\n\tcase int:\n\t\treturn \"entier \" + strconv.Itoa(x)   // x est un int\n\tcase string:\n\t\treturn \"texte \" + x                   // x est une string\n\tcase error:\n\t\treturn \"erreur \" + x.Error()          // x est une error (interface)\n\tcase []int, []string:\n\t\treturn fmt.Sprintf(\"slice %v\", x)     // plusieurs types : x reste un any\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre %T\", x)\n\t}\n}\n```\n\n- Dans chaque `case` à **un seul type**, la variable `x` a **ce type**. Dans un `case` à **plusieurs types**, ou dans\n  `default`, `x` garde le **type de l'interface**.\n- `case nil` traite l'interface nil.\n- Un `case` peut être une **interface** : il correspond à toute valeur qui l'implémente. L'**ordre** compte : le\n  premier cas qui correspond l'emporte.\n- `fallthrough` est interdit dans un switch de type.\n\nUsages : traiter des valeurs hétérogènes (un AST, des messages, du JSON libre), distinguer des types d'erreurs (même\nsi `errors.As` est préférable pour les erreurs enveloppées).\n\n**Piège classique** : mettre `case error:` avant `case *MonErreur:`. Le cas interface attrape tout, et le cas précis\nn'est jamais atteint.\n\n**En entretien** : « switch x := v.(type) ; x a le type du case s'il n'y en a qu'un ; case nil pour l'interface nil ;\nl'ordre compte quand des cas sont des interfaces. »"
cards:
  - key: type-assertion-vs-type-switch
    format: course
    question: Type assertion vs type switch ?
    answer: Vérifier un seul type (`v.(T)`) vs brancher sur plusieurs types.
  - key: code-var-x-interface-3-switch
    format: code-output
    question: |-
      ```go
      var x interface{} = 3
      switch y := x.(type) {
      case int, int64:
          fmt.Printf("%T\n", y)
      }
      ```
    answer: '`int` : avec plusieurs types dans un `case`, `y` a le type de `x` (interface), mais `%T` affiche le type dynamique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar x interface{} = 3\n\tswitch y := x.(type) {\n\tcase int, int64:\n\t    fmt.Printf(\"%T\\n\", y)\n\t}\n}\n"
      output: int
  - key: type-variable
    format: course
    question: Quel est le type de `x` dans `case int, int64:` d'un `switch x := v.(type)` ?
    answer: 'Le type de l''interface d''origine (par exemple `any`) : avec plusieurs types dans le cas, Go ne peut pas en choisir un.'
  - key: ordre
    format: course
    question: Pourquoi l'ordre des cas compte-t-il dans un switch de type ?
    answer: Le premier cas qui correspond l'emporte ; un cas interface (comme `error`) placé avant un type concret qui l'implémente le masque.
  - key: vf-fallthrough
    format: true-false
    question: '`fallthrough` est permis dans un switch de type.'
    truth: false
    answer: Il est interdit, puisque la variable change de type d'un cas à l'autre.
  - key: vf-nil
    format: true-false
    question: Un switch de type peut avoir un `case nil`.
    truth: true
    answer: Il traite l'interface qui ne contient aucune valeur.
  - key: vf-interface-case
    format: true-false
    question: '`case fmt.Stringer:` correspond à toute valeur qui a une méthode `String() string`.'
    truth: true
    answer: Un cas peut être une interface.
  - key: vf-concret
    format: true-false
    question: On peut faire un switch de type sur une variable de type `int`.
    truth: false
    answer: Le switch de type s'applique à une valeur d'interface.
  - key: qcm-variable
    format: multiple-choice
    question: 'Dans `switch x := v.(type) { case string: ... }`, quel est le type de `x` dans ce cas ?'
    choices:
      - text: '`string`'
        correct: true
      - text: '`any`'
        correct: false
      - text: '`interface{ string }`'
        correct: false
      - text: '`reflect.Type`'
        correct: false
    answer: Avec un seul type, la variable a ce type et s'utilise directement.
  - key: qcm-ordre
    format: multiple-choice
    question: Avec `case error:` puis `case *ErrValidation:`, que se passe-t-il pour une `*ErrValidation` ?
    choices:
      - text: Elle tombe dans `case error`, le second cas n'est jamais atteint
        correct: true
      - text: Elle tombe dans `case *ErrValidation`, le plus précis
        correct: false
      - text: Les deux cas s'exécutent
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: On met les types les plus précis en premier.
  - key: qcm-default
    format: multiple-choice
    question: Quel est le type de la variable dans le cas `default` ?
    choices:
      - text: Le type de l'interface testée
        correct: true
      - text: '`any` toujours'
        correct: false
      - text: Le type du dernier cas
        correct: false
      - text: Aucun, la variable n'existe pas
        correct: false
    answer: Comme dans un cas à plusieurs types.
  - key: qcm-usages
    format: multiple-choice
    question: Dans quels cas un switch de type est-il approprié ?
    choices:
      - text: Évaluer les nœuds d'un arbre syntaxique de types différents
        correct: true
      - text: Traiter les valeurs d'un JSON décodé dans un any
        correct: true
      - text: Remplacer toutes les méthodes d'interface
        correct: false
      - text: Tester une erreur enveloppée profondément
        correct: false
    answer: Pour une erreur enveloppée, `errors.As` parcourt la chaîne.
  - key: trous-syntaxe
    format: fill-in
    question: "Complétez le switch de type :\n```go\nswitch x := v.___ {\ncase int:\n\treturn x * 2\n}\n```"
    blanks:
      - - (type)
    answer: '`v.(type)` ne s''écrit que dans un switch.'
  - key: trous-nil
    format: fill-in
    question: "Complétez le cas de l'interface vide :\n```go\ncase ___:\n\treturn \"aucune valeur\"\n```"
    blanks:
      - - nil
    answer: '`case nil` traite l''interface nil.'
  - key: trous-plusieurs
    format: fill-in
    question: "Complétez pour traiter deux types entiers ensemble :\n```go\ncase int___ int64:\n\treturn \"entier\"\n```"
    blanks:
      - - ','
    answer: Plusieurs types séparés par des virgules ; la variable garde alors le type de l'interface.
  - key: trous-default
    format: fill-in
    question: "Complétez le cas restant :\n```go\n___:\n\treturn fmt.Sprintf(\"type inattendu %T\", x)\n```"
    blanks:
      - - default
    answer: '`default` traite tous les autres types.'
  - key: code-decrire
    format: code-output
    question: "```go\nfunc decrire(v any) string {\n\tswitch x := v.(type) {\n\tcase nil:\n\t\treturn \"rien\"\n\tcase int:\n\t\treturn fmt.Sprint(\"int:\", x+1)\n\tcase string:\n\t\treturn \"string:\" + x\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre:%T\", x)\n\t}\n}\n\nfmt.Println(decrire(41), decrire(\"go\"), decrire(nil), decrire(2.5))\n```"
    answer: '`int:42 string:go rien autre:float64`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc decrire(v any) string {\n\tswitch x := v.(type) {\n\tcase nil:\n\t\treturn \"rien\"\n\tcase int:\n\t\treturn fmt.Sprint(\"int:\", x+1)\n\tcase string:\n\t\treturn \"string:\" + x\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre:%T\", x)\n\t}\n}\n\nfunc main() {\n\tfmt.Println(decrire(41), decrire(\"go\"), decrire(nil), decrire(2.5))\n}\n"
      output: int:42 string:go rien autre:float64
  - key: code-ordre
    format: code-output
    question: "```go\ntype ErrValidation struct{}\n\nfunc (*ErrValidation) Error() string { return \"validation\" }\n\nvar err error = &ErrValidation{}\nswitch err.(type) {\ncase error:\n\tfmt.Println(\"error\")\ncase *ErrValidation:\n\tfmt.Println(\"validation\")\n}\n```"
    answer: '`error` : le cas interface, placé en premier, attrape la valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype ErrValidation struct{}\n\n\nfunc (*ErrValidation) Error() string { return \"validation\" }\n\nfunc main() {\n\tvar err error = &ErrValidation{}\n\tswitch err.(type) {\n\tcase error:\n\t\tfmt.Println(\"error\")\n\tcase *ErrValidation:\n\t\tfmt.Println(\"validation\")\n\t}\n}\n"
      output: error
  - key: code-interface-case
    format: code-output
    question: "```go\ntype Celsius float64\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.0f°C\", float64(c)) }\n\nfor _, v := range []any{Celsius(20), 5, \"x\"} {\n\tswitch x := v.(type) {\n\tcase fmt.Stringer:\n\t\tfmt.Print(x.String(), \" \")\n\tdefault:\n\t\tfmt.Print(\"brut \")\n\t}\n}\nfmt.Println()\n```"
    answer: '`20°C brut brut` : le cas interface correspond à tout type qui a `String()`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.0f°C\", float64(c)) }\n\nfunc main() {\n\tfor _, v := range []any{Celsius(20), 5, \"x\"} {\n\t\tswitch x := v.(type) {\n\t\tcase fmt.Stringer:\n\t\t\tfmt.Print(x.String(), \" \")\n\t\tdefault:\n\t\t\tfmt.Print(\"brut \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: 20°C brut brut
  - key: bug-ordre
    format: bug-fix
    question: "Les erreurs de validation ne reçoivent jamais le code 400 :\n```go\nswitch e := err.(type) {\ncase error:\n\thttp.Error(w, \"erreur interne\", 500)\ncase *ErrValidation:\n\thttp.Error(w, e.Message, 400)\n}\n```"
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, ev.Message, http.StatusBadRequest)\n\treturn\n}\nhttp.Error(w, \"erreur interne\", http.StatusInternalServerError)\n```\nLe cas `error` attrapait tout ; et pour une erreur peut-être enveloppée, `errors.As` est le bon outil."
  - key: bug-plusieurs
    format: bug-fix
    question: "Le compilateur signale « invalid operation: x * 2 (mismatched types any and untyped int) » :\n```go\nswitch x := v.(type) {\ncase int, int64:\n\treturn x * 2\n}\n```"
    answer: "```go\nswitch x := v.(type) {\ncase int:\n\treturn int64(x) * 2\ncase int64:\n\treturn x * 2\n}\n```\nAvec plusieurs types dans un cas, `x` garde le type `any` ; on sépare les cas."
  - key: bug-fallthrough
    format: bug-fix
    question: "Le compilateur signale « cannot fallthrough in type switch » :\n```go\nswitch v.(type) {\ncase int:\n\tfallthrough\ncase int64:\n\treturn \"entier\"\n}\n```"
    answer: "```go\nswitch v.(type) {\ncase int, int64:\n\treturn \"entier\"\n}\n```\n`fallthrough` est interdit dans un switch de type : on regroupe les types dans un même cas."
  - key: bug-nil
    format: bug-fix
    question: "Une valeur nil s'affiche comme « type inattendu <nil> » :\n```go\nswitch x := v.(type) {\ncase string:\n\treturn x\ndefault:\n\treturn fmt.Sprintf(\"type inattendu %T\", x)\n}\n```"
    answer: "```go\nswitch x := v.(type) {\ncase nil:\n\treturn \"\"\ncase string:\n\treturn x\ndefault:\n\treturn fmt.Sprintf(\"type inattendu %T\", x)\n}\n```\n`case nil` traite explicitement l'interface vide."
  - key: interfaces-cas
    format: course
    question: Un cas d'un switch de type peut-il être une interface ?
    answer: 'Oui : `case fmt.Stringer:` correspond à toute valeur dont le type a la méthode `String() string`.'
