notion: type-switch
cards:
  - key: type-assertion-vs-type-switch
    format: course
    question: Type assertion vs type switch ?
    answer: Vérifier un seul type (`v.(T)`) vs brancher sur plusieurs types.
  - key: code-var-x-interface-3-switch
    format: code-output
    question: |-
      ```go
      var x interface{} = 3
      switch y := x.(type) {
      case int, int64:
          fmt.Printf("%T\n", y)
      }
      ```
    answer: '`int` : avec plusieurs types dans un `case`, `y` a le type de `x` (interface), mais `%T` affiche le type dynamique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar x interface{} = 3\n\tswitch y := x.(type) {\n\tcase int, int64:\n\t    fmt.Printf(\"%T\\n\", y)\n\t}\n}\n"
      output: int
