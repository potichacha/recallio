notion: type-switch
lesson: "Le **switch de type** teste le type dynamique d'une interface, cas par cas :\n\n```go\nfunc decrire(v any) string {\n\tswitch x := v.(type) {\n\tcase nil:\n\t\treturn \"rien\"\n\tcase int:\n\t\treturn \"entier \" + strconv.Itoa(x)   // x est un int\n\tcase string:\n\t\treturn \"texte \" + x                   // x est une string\n\tcase error:\n\t\treturn \"erreur \" + x.Error()          // x est une error (interface)\n\tcase []int, []string:\n\t\treturn fmt.Sprintf(\"slice %v\", x)     // plusieurs types : x reste un any\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre %T\", x)\n\t}\n}\n```\n\n- Dans chaque `case` à **un seul type**, la variable `x` a **ce type**. Dans un `case` à **plusieurs types**, ou dans\n  `default`, `x` garde le **type de l'interface**.\n- `case nil` traite l'interface nil.\n- Un `case` peut être une **interface** : il correspond à toute valeur qui l'implémente. L'**ordre** compte : le\n  premier cas qui correspond l'emporte.\n- `fallthrough` est interdit dans un switch de type.\n\nUsages : traiter des valeurs hétérogènes (un AST, des messages, du JSON libre), distinguer des types d'erreurs (même\nsi `errors.As` est préférable pour les erreurs enveloppées).\n\n**Piège classique** : mettre `case error:` avant `case *MonErreur:`. Le cas interface attrape tout, et le cas précis\nn'est jamais atteint.\n\n**En entretien** : « switch x := v.(type) ; x a le type du case s'il n'y en a qu'un ; case nil pour l'interface nil ;\nl'ordre compte quand des cas sont des interfaces. »"
tour:
  - title: Le switch de type
    text: |-
      Un **switch de type** teste plusieurs types d'un coup : `switch x := v.(type)`. Dans chaque `case`, `x` a le type
      du cas ; dans `default`, ou dans un cas qui liste plusieurs types, il garde le type de l'interface.

      C'est la façon idiomatique de traiter différemment des valeurs de types variés, par exemple dans un décodeur ou un
      interpréteur.
    example:
      files:
        main.go: |-
          package main

          import "fmt"

          func decrit(v any) string {
          	switch x := v.(type) {
          	case int:
          		return fmt.Sprintf("entier, son double : %d", x*2)
          	case string:
          		return fmt.Sprintf("chaîne de %d octets", len(x))
          	case nil:
          		return "rien"
          	default:
          		return fmt.Sprintf("autre : %T", x)
          	}
          }

          func main() {
          	for _, v := range []any{21, "Go", nil, 2.5} {
          		fmt.Println(decrit(v))
          	}
          }
      output: |-
        entier, son double : 42
        chaîne de 2 octets
        rien
        autre : float64
    task:
      instructions: |-
        Ajoute un cas pour les booléens : le programme doit afficher `booléen : true`.
      starter:
        main.go: |-
          package main

          import "fmt"

          func decrit(v any) string {
          	switch x := v.(type) {
          	case int:
          		return fmt.Sprintf("entier, son double : %d", x*2)
          	default:
          		return fmt.Sprintf("autre : %T", x)
          	}
          }

          func main() {
          	fmt.Println(decrit(true))
          }
      solution:
        main.go: |-
          package main

          import "fmt"

          func decrit(v any) string {
          	switch x := v.(type) {
          	case int:
          		return fmt.Sprintf("entier, son double : %d", x*2)
          	case bool:
          		return fmt.Sprintf("booléen : %t", x)
          	default:
          		return fmt.Sprintf("autre : %T", x)
          	}
          }

          func main() {
          	fmt.Println(decrit(true))
          }
      output: |-
        booléen : true
cards:
  - key: type-assertion-vs-type-switch
    format: course
    question: "Quelle différence y a-t-il entre une assertion de type et un type switch ?"
    choices:
      - {text: "L'assertion `v.(T)` vérifie un seul type ; le switch branche sur plusieurs", correct: true}
      - {text: "L'assertion convertit la valeur ; le switch vérifie seulement son type", correct: false}
      - {text: "L'assertion se vérifie à la compilation ; le switch, à l'exécution", correct: false}
      - {text: "L'assertion marche sur toute valeur ; le switch, sur les interfaces", correct: false}
    answer: "`v.(T)` vérifie un seul type ; `switch x := v.(type)` branche sur plusieurs, avec un `default`. Les deux se vérifient à l'exécution, sur une interface, et ne convertissent rien."
  - key: code-var-x-interface-3-switch
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      var x interface{} = 3
      switch y := x.(type) {
      case int, int64:
          fmt.Printf("%T\n", y)
      }
      ```
    choices:
      - {text: "`int`", correct: true}
      - {text: "`interface {}`", correct: false}
      - {text: "`int64`", correct: false}
      - {text: "Rien : aucun cas ne correspond", correct: false}
    answer: '`int` : avec plusieurs types dans un `case`, `y` a le type de `x` (interface), mais `%T` affiche le type dynamique.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc main() {\n\tvar x interface{} = 3\n\tswitch y := x.(type) {\n\tcase int, int64:\n\t    fmt.Printf(\"%T\\n\", y)\n\t}\n}\n"
      output: int
  - key: type-variable
    format: course
    question: Quel est le type de `x` dans `case int, int64:` d'un `switch x := v.(type)` ?
    choices:
      - {text: "Le type de l'interface d'origine, par exemple `any`", correct: true}
      - {text: "`int`, le premier type de la liste du cas", correct: false}
      - {text: "`int64`, le plus large des deux types du cas", correct: false}
      - {text: "Le type dynamique de `v`, `int` ou `int64` selon la valeur", correct: false}
    answer: 'Le type de l''interface d''origine (par exemple `any`) : avec plusieurs types dans le cas, Go ne peut pas en choisir un.'
  - key: ordre
    format: course
    question: Pourquoi l'ordre des cas compte-t-il dans un switch de type ?
    choices:
      - {text: "Le premier cas qui correspond l'emporte : un cas `error` placé avant `*ErrValidation` le masque", correct: true}
      - {text: "Go teste tous les cas et choisit le type le plus précis ; l'ordre ne sert qu'à la lisibilité", correct: false}
      - {text: "Le dernier cas qui correspond l'emporte, comme une suite d'affectations successives", correct: false}
      - {text: "Le compilateur trie les cas, et l'ordre écrit ne compte que pour la place du `default`", correct: false}
    answer: Le premier cas qui correspond l'emporte ; un cas interface (comme `error`) placé avant un type concret qui l'implémente le masque.
  - key: vf-fallthrough
    format: true-false
    question: '`fallthrough` est permis dans un switch de type.'
    truth: false
    answer: Il est interdit, puisque la variable change de type d'un cas à l'autre.
  - key: vf-nil
    format: true-false
    question: Un switch de type peut avoir un `case nil`.
    truth: true
    answer: Il traite l'interface qui ne contient aucune valeur.
  - key: vf-interface-case
    format: true-false
    question: '`case fmt.Stringer:` correspond à toute valeur qui a une méthode `String() string`.'
    truth: true
    answer: Un cas peut être une interface.
  - key: vf-concret
    format: true-false
    question: On peut faire un switch de type sur une variable de type `int`.
    truth: false
    answer: Le switch de type s'applique à une valeur d'interface.
  - key: qcm-variable
    format: multiple-choice
    question: 'Dans `switch x := v.(type) { case string: ... }`, quel est le type de `x` dans ce cas ?'
    choices:
      - text: '`string`'
        correct: true
      - text: '`any`'
        correct: false
      - text: '`interface{ string }`'
        correct: false
      - text: '`reflect.Type`'
        correct: false
    answer: Avec un seul type, la variable a ce type et s'utilise directement.
  - key: qcm-ordre
    format: multiple-choice
    question: Avec `case error:` puis `case *ErrValidation:`, que se passe-t-il pour une `*ErrValidation` ?
    choices:
      - text: Elle tombe dans `case error`, le second cas n'est jamais atteint
        correct: true
      - text: Elle tombe dans `case *ErrValidation`, le plus précis
        correct: false
      - text: Les deux cas s'exécutent
        correct: false
      - text: Le code ne compile pas
        correct: false
    answer: On met les types les plus précis en premier.
  - key: qcm-default
    format: multiple-choice
    question: Quel est le type de la variable dans le cas `default` ?
    choices:
      - text: Le type de l'interface testée
        correct: true
      - text: '`any` toujours'
        correct: false
      - text: Le type du dernier cas
        correct: false
      - text: Aucun, la variable n'existe pas
        correct: false
    answer: Comme dans un cas à plusieurs types.
  - key: qcm-usages
    format: multiple-choice
    question: "Dans lequel de ces cas un switch de type est-il approprié ?"
    choices:
      - {text: "Évaluer les nœuds d'un arbre syntaxique de types différents", correct: true}
      - {text: "Tester une erreur enveloppée profondément dans une chaîne", correct: false}
      - {text: "Remplacer toutes les méthodes d'une interface du package", correct: false}
      - {text: "Comparer deux valeurs du même type concret entre elles", correct: false}
    answer: "Des valeurs de types différents à traiter chacune à sa façon (les nœuds d'un arbre, un JSON décodé dans un `any`) : c'est le cas du switch de type. Pour une erreur enveloppée, `errors.As` parcourt la chaîne."
  - key: trous-syntaxe
    format: fill-in
    question: |-
      Complète le switch de type :
      ```go
      switch x := v.___ {
      case int:
      	return x * 2
      }
      ```
    blanks:
      - - (type)
    answer: '`v.(type)` ne s''écrit que dans un switch.'
  - key: trous-nil
    format: fill-in
    question: |-
      Complète le cas de l'interface vide :
      ```go
      case ___:
      	return "aucune valeur"
      ```
    blanks:
      - - nil
    answer: '`case nil` traite l''interface nil.'
  - key: trous-plusieurs
    format: fill-in
    question: |-
      Complète pour traiter deux types entiers ensemble :
      ```go
      case int___ int64:
      	return "entier"
      ```
    blanks:
      - - ','
    answer: Plusieurs types séparés par des virgules ; la variable garde alors le type de l'interface.
  - key: trous-default
    format: fill-in
    question: |-
      Complète le cas restant :
      ```go
      ___:
      	return fmt.Sprintf("type inattendu %T", x)
      ```
    blanks:
      - - default
    answer: '`default` traite tous les autres types.'
  - key: code-decrire
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      func decrire(v any) string {
      	switch x := v.(type) {
      	case nil:
      		return "rien"
      	case int:
      		return fmt.Sprint("int:", x+1)
      	case string:
      		return "string:" + x
      	default:
      		return fmt.Sprintf("autre:%T", x)
      	}
      }

      fmt.Println(decrire(41), decrire("go"), decrire(nil), decrire(2.5))
      ```
    choices:
      - {text: "`int:42 string:go rien autre:float64`", correct: true}
      - {text: "`int: 42 string:go rien autre:float64`", correct: false}
      - {text: "`int:42 string:go <nil> autre:float64`", correct: false}
      - {text: "`int:42 string:go rien autre:float32`", correct: false}
    answer: '`int:42 string:go rien autre:float64`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\nfunc decrire(v any) string {\n\tswitch x := v.(type) {\n\tcase nil:\n\t\treturn \"rien\"\n\tcase int:\n\t\treturn fmt.Sprint(\"int:\", x+1)\n\tcase string:\n\t\treturn \"string:\" + x\n\tdefault:\n\t\treturn fmt.Sprintf(\"autre:%T\", x)\n\t}\n}\n\nfunc main() {\n\tfmt.Println(decrire(41), decrire(\"go\"), decrire(nil), decrire(2.5))\n}\n"
      output: int:42 string:go rien autre:float64
  - key: code-ordre
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type ErrValidation struct{}

      func (*ErrValidation) Error() string { return "validation" }

      var err error = &ErrValidation{}
      switch err.(type) {
      case error:
      	fmt.Println("error")
      case *ErrValidation:
      	fmt.Println("validation")
      }
      ```
    choices:
      - {text: "`error`", correct: true}
      - {text: "`validation`", correct: false}
      - text: |-
          ```
          error
          validation
          ```
        correct: false
      - {text: "Ça ne compile pas : deux cas se recouvrent", correct: false}
    answer: '`error` : le cas interface, placé en premier, attrape la valeur.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype ErrValidation struct{}\n\n\nfunc (*ErrValidation) Error() string { return \"validation\" }\n\nfunc main() {\n\tvar err error = &ErrValidation{}\n\tswitch err.(type) {\n\tcase error:\n\t\tfmt.Println(\"error\")\n\tcase *ErrValidation:\n\t\tfmt.Println(\"validation\")\n\t}\n}\n"
      output: error
  - key: code-interface-case
    format: code-output
    question: |-
      Qu'affiche ce code ?
      ```go
      type Celsius float64

      func (c Celsius) String() string { return fmt.Sprintf("%.0f°C", float64(c)) }

      for _, v := range []any{Celsius(20), 5, "x"} {
      	switch x := v.(type) {
      	case fmt.Stringer:
      		fmt.Print(x.String(), " ")
      	default:
      		fmt.Print("brut ")
      	}
      }
      fmt.Println()
      ```
    choices:
      - {text: "`20°C brut brut`", correct: true}
      - {text: "`brut brut brut`", correct: false}
      - {text: "`20°C 5 x`", correct: false}
      - {text: "`20 brut brut`", correct: false}
    answer: '`20°C brut brut` : le cas interface correspond à tout type qui a `String()`.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.0f°C\", float64(c)) }\n\nfunc main() {\n\tfor _, v := range []any{Celsius(20), 5, \"x\"} {\n\t\tswitch x := v.(type) {\n\t\tcase fmt.Stringer:\n\t\t\tfmt.Print(x.String(), \" \")\n\t\tdefault:\n\t\t\tfmt.Print(\"brut \")\n\t\t}\n\t}\n\tfmt.Println()\n}\n"
      output: 20°C brut brut
  - key: bug-ordre
    format: bug-fix
    question: |-
      Les erreurs de validation ne reçoivent jamais le code 400. Quelle correction est la bonne ?
      ```go
      switch e := err.(type) {
      case error:
      	http.Error(w, "erreur interne", 500)
      case *ErrValidation:
      	http.Error(w, e.Message, 400)
      }
      ```
    choices:
      - {text: "Tester d'abord `errors.As(err, &ev)` pour le 400, puis répondre 500", correct: true}
      - {text: "Ajouter `fallthrough` à la fin du cas `error`, vers le cas suivant", correct: false}
      - {text: "Ajouter `break` à la fin du cas `error`, pour passer au cas suivant", correct: false}
      - {text: "Comparer `err == &ErrValidation{}` dans un `if`, avant le switch", correct: false}
    answer: "```go\nvar ev *ErrValidation\nif errors.As(err, &ev) {\n\thttp.Error(w, ev.Message, http.StatusBadRequest)\n\treturn\n}\nhttp.Error(w, \"erreur interne\", http.StatusInternalServerError)\n```\nLe cas `error` attrapait tout ; et pour une erreur peut-être enveloppée, `errors.As` est le bon outil."
  - key: bug-plusieurs
    format: bug-fix
    question: |-
      Le compilateur signale « invalid operation: x * 2 (mismatched types any and untyped int) ». Quelle correction est la bonne ?
      ```go
      switch x := v.(type) {
      case int, int64:
      	return x * 2
      }
      ```
    choices:
      - {text: "Séparer les cas, `case int:` puis `case int64:`, chacun avec son type", correct: true}
      - {text: "Convertir dans le cas commun, avec `return int64(x) * 2`", correct: false}
      - {text: "Ajouter `fallthrough` entre `case int` et `case int64`", correct: false}
      - {text: "Écrire `x.(int) * 2` dans le cas commun, sans autre test", correct: false}
    answer: "```go\nswitch x := v.(type) {\ncase int:\n\treturn int64(x) * 2\ncase int64:\n\treturn x * 2\n}\n```\nAvec plusieurs types dans un cas, `x` garde le type `any` ; on sépare les cas."
  - key: bug-fallthrough
    format: bug-fix
    question: |-
      Le compilateur signale « cannot fallthrough in type switch ». Quelle correction est la bonne ?
      ```go
      switch v.(type) {
      case int:
      	fallthrough
      case int64:
      	return "entier"
      }
      ```
    choices:
      - {text: "Regrouper les types dans un même cas : `case int, int64:`", correct: true}
      - {text: "Remplacer `fallthrough` par `continue`, qui passe au cas suivant", correct: false}
      - {text: "Remplacer `fallthrough` par un `goto` vers le cas suivant", correct: false}
      - {text: "Déplacer `case int64` avant `case int`, et garder `fallthrough`", correct: false}
    answer: "```go\nswitch v.(type) {\ncase int, int64:\n\treturn \"entier\"\n}\n```\n`fallthrough` est interdit dans un switch de type : on regroupe les types dans un même cas."
  - key: bug-nil
    format: bug-fix
    question: |-
      Une valeur nil s'affiche comme « type inattendu <nil> ». Quelle correction est la bonne ?
      ```go
      switch x := v.(type) {
      case string:
      	return x
      default:
      	return fmt.Sprintf("type inattendu %T", x)
      }
      ```
    choices:
      - {text: "Ajouter un `case nil:` qui traite l'interface vide", correct: true}
      - {text: "Ajouter un `case any:` juste avant le `default`", correct: false}
      - {text: "Ajouter un `case *string:` pour les chaînes nil", correct: false}
      - {text: "Remplacer `%T` par `%v` dans le message du `default`", correct: false}
    answer: "```go\nswitch x := v.(type) {\ncase nil:\n\treturn \"\"\ncase string:\n\treturn x\ndefault:\n\treturn fmt.Sprintf(\"type inattendu %T\", x)\n}\n```\n`case nil` traite explicitement l'interface vide."
  - key: interfaces-cas
    format: course
    question: Un cas d'un switch de type peut-il être une interface ?
    choices:
      - {text: "Oui : `case fmt.Stringer:` correspond à toute valeur qui a `String() string`", correct: true}
      - {text: "Non : un cas de switch de type n'accepte que des types concrets", correct: false}
      - {text: "Oui, mais seulement l'interface vide, sous la forme `case any:`", correct: false}
      - {text: "Non, sauf pour `error`, qui est un type prédéclaré du langage", correct: false}
    answer: 'Oui : `case fmt.Stringer:` correspond à toute valeur dont le type a la méthode `String() string`.'
