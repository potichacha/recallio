notion: valeurs-methodes
lesson: |-
  Une méthode peut s'utiliser comme une **valeur de fonction**, de deux façons.

  **Valeur de méthode** (`x.M`) : une fonction **liée** à un receveur précis.

  ```go
  c := &Compteur{}
  inc := c.Incrementer  // func(), liée à c
  inc(); inc()          // c.n vaut 2

  http.HandleFunc("/sante", serveur.Sante) // une méthode passée comme handler
  defer f.Close()                          // f.Close est évalué tout de suite
  ```

  Le receveur est **évalué au moment** où l'on écrit `x.M` : avec un receveur valeur, c'est une **copie** figée à cet
  instant ; avec un receveur pointeur, c'est le pointeur.

  **Expression de méthode** (`T.M` ou `(*T).M`) : une fonction **non liée**, dont le receveur devient le **premier
  paramètre**.

  ```go
  aire := Rectangle.Aire          // func(Rectangle) float64
  aire(Rectangle{2, 3})            // 6
  inc2 := (*Compteur).Incrementer  // func(*Compteur)
  inc2(c)
  ```

  Usages : passer une méthode comme callback (`slices.SortFunc(xs, Personne.Comparer)`), enregistrer des handlers,
  construire des tables de dispatch.

  **Piège classique** : une valeur de méthode à receveur valeur prise **avant** une modification ; elle travaille sur la
  copie d'origine et ignore la modification.

  **En entretien** : « x.M donne une fonction liée à x, évaluée tout de suite ; T.M donne une fonction dont le receveur
  est le premier paramètre ; utile pour les callbacks et les handlers. »
cards:
  - key: valeur-methode-vs-expression-methode
    format: course
    question: Valeur de méthode vs expression de méthode ?
    answer: '`x.M` lie le receveur ; `T.M` ou `(*T).M` est une fonction qui prend le receveur en premier paramètre.'
  - key: liee
    format: course
    question: Qu'est-ce qu'une valeur de méthode ?
    answer: 'L''expression `x.M` sans appel : une fonction liée au receveur `x`, qu''on appelle plus tard sans le repréciser.'
  - key: expression
    format: course
    question: Quel est le type de l'expression de méthode `Rectangle.Aire` ?
    answer: '`func(Rectangle) float64` : le receveur devient le premier paramètre.'
  - key: evaluation
    format: course
    question: Quand le receveur d'une valeur de méthode est-il évalué ?
    answer: Au moment où l'on écrit `x.M` ; avec un receveur valeur, c'est une copie figée à cet instant.
  - key: callback
    format: course
    question: Comment passer une méthode comme callback à `http.HandleFunc` ?
    answer: 'Par une valeur de méthode : `http.HandleFunc("/sante", srv.Sante)`, liée au serveur `srv`.'
  - key: vf-liee
    format: true-false
    question: '`f := c.Incrementer` puis `f()` incrémente le compteur `c` (receveur pointeur).'
    truth: true
    answer: La valeur de méthode est liée au pointeur c.
  - key: vf-copie
    format: true-false
    question: Une valeur de méthode à receveur valeur voit les modifications faites au receveur après sa création.
    truth: false
    answer: Elle garde une copie prise à sa création.
  - key: vf-premier-parametre
    format: true-false
    question: Avec l'expression de méthode `T.M`, le receveur se passe en premier argument.
    truth: true
    answer: '`Rectangle.Aire(r)` équivaut à `r.Aire()`.'
  - key: vf-pointeur-expression
    format: true-false
    question: '`Compteur.Incrementer` est valide si `Incrementer` a un receveur `*Compteur`.'
    truth: false
    answer: 'Il faut `(*Compteur).Incrementer` : la méthode n''est pas dans l''ensemble de `Compteur`.'
  - key: qcm-types
    format: multiple-choice
    question: Avec `func (r Rectangle) Aire() float64` et `r := Rectangle{2, 3}`, quels types sont corrects ?
    choices:
      - text: '`r.Aire` est un `func() float64`'
        correct: true
      - text: '`Rectangle.Aire` est un `func(Rectangle) float64`'
        correct: true
      - text: '`r.Aire` est un `float64`'
        correct: false
      - text: '`Rectangle.Aire` est un `func() float64`'
        correct: false
    answer: Sans parenthèses d'appel, on obtient une fonction.
  - key: qcm-usages
    format: multiple-choice
    question: Où les valeurs de méthode sont-elles pratiques ?
    choices:
      - text: Enregistrer `srv.Sante` comme handler HTTP
        correct: true
      - text: Passer une méthode de comparaison à `slices.SortFunc`
        correct: true
      - text: Remplacer les interfaces
        correct: false
      - text: Déclarer des méthodes sur des types d'autres packages
        correct: false
    answer: Ce sont des fonctions ordinaires, utilisables partout où l'on attend une fonction.
  - key: qcm-defer
    format: multiple-choice
    question: Dans `defer f.Close()`, quand `f` est-il évalué ?
    choices:
      - text: À la ligne du defer
        correct: true
      - text: À la sortie de la fonction
        correct: false
      - text: Jamais
        correct: false
      - text: À chaque appel de Close
        correct: false
    answer: 'Le receveur fait partie des valeurs évaluées tout de suite : un `f` réaffecté ensuite ne change rien.'
  - key: qcm-sortfunc
    format: multiple-choice
    question: Avec `func (a Personne) Comparer(b Personne) int`, comment trier `gens []Personne` ?
    choices:
      - text: '`slices.SortFunc(gens, Personne.Comparer)`'
        correct: true
      - text: '`slices.SortFunc(gens, func(a, b Personne) int { return a.Comparer(b) })`'
        correct: true
      - text: '`slices.SortFunc(gens, Comparer)`'
        correct: false
      - text: '`gens.Sort(Comparer)`'
        correct: false
    answer: L'expression de méthode a exactement la signature `func(a, b Personne) int`.
  - key: code-liee
    format: code-output
    question: |-
      ```go
      type Compteur struct{ n int }

      func (c *Compteur) Incrementer() { c.n++ }

      c := &Compteur{}
      inc := c.Incrementer
      inc()
      inc()
      fmt.Println(c.n)
      ```
    answer: '`2` : la valeur de méthode est liée au pointeur c.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Compteur struct{ n int }\n\n\nfunc (c *Compteur) Incrementer() { c.n++ }\n\nfunc main() {\n\tc := &Compteur{}\n\tinc := c.Incrementer\n\tinc()\n\tinc()\n\tfmt.Println(c.n)\n}\n"
      output: '2'
  - key: code-copie
    format: code-output
    question: |-
      ```go
      type Salut struct{ Nom string }

      func (s Salut) Dire() string { return "bonjour " + s.Nom }

      s := Salut{"Ada"}
      dire := s.Dire
      s.Nom = "Bob"
      fmt.Println(dire(), s.Dire())
      ```
    answer: '`bonjour Ada bonjour Bob` : la valeur de méthode a copié le receveur à sa création.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Salut struct{ Nom string }\n\n\nfunc (s Salut) Dire() string { return \"bonjour \" + s.Nom }\n\nfunc main() {\n\ts := Salut{\"Ada\"}\n\tdire := s.Dire\n\ts.Nom = \"Bob\"\n\tfmt.Println(dire(), s.Dire())\n}\n"
      output: bonjour Ada bonjour Bob
  - key: code-expression
    format: code-output
    question: |-
      ```go
      type Rectangle struct{ L, H float64 }

      func (r Rectangle) Aire() float64 { return r.L * r.H }

      aire := Rectangle.Aire
      fmt.Println(aire(Rectangle{2, 3}), aire(Rectangle{4, 5}))
      ```
    answer: '`6 20` : le receveur est passé en premier argument.'
    check:
      code: "package main\n\nimport \"fmt\"\n\ntype Rectangle struct{ L, H float64 }\n\n\nfunc (r Rectangle) Aire() float64 { return r.L * r.H }\n\nfunc main() {\n\taire := Rectangle.Aire\n\tfmt.Println(aire(Rectangle{2, 3}), aire(Rectangle{4, 5}))\n}\n"
      output: 6 20
  - key: code-sortfunc
    format: code-output
    question: "```go\ntype Personne struct {\n\tNom string\n\tAge int\n}\n\nfunc (a Personne) Comparer(b Personne) int { return cmp.Compare(a.Age, b.Age) }\n\ngens := []Personne{{\"Bob\", 40}, {\"Ada\", 36}}\nslices.SortFunc(gens, Personne.Comparer)\nfmt.Println(gens[0].Nom)\n```"
    answer: '`Ada` : l''expression de méthode sert directement de fonction de comparaison.'
    check:
      code: "package main\n\nimport (\n\t\"cmp\"\n\t\"fmt\"\n\t\"slices\"\n)\n\ntype Personne struct {\n\tNom string\n\tAge int\n}\n\n\nfunc (a Personne) Comparer(b Personne) int { return cmp.Compare(a.Age, b.Age) }\n\nfunc main() {\n\tgens := []Personne{{\"Bob\", 40}, {\"Ada\", 36}}\n\tslices.SortFunc(gens, Personne.Comparer)\n\tfmt.Println(gens[0].Nom)\n}\n"
      output: Ada
