notion: outils-sql
lesson: |-
  `database/sql` suffit, mais demande d'écrire beaucoup de code de `Scan`. L'écosystème propose plusieurs niveaux
  d'abstraction :

  | Outil | Principe | Quand |
  |---|---|---|
  | **pgx** (natif) | pilote PostgreSQL avec sa propre API : types riches, `COPY`, batch, notifications | PostgreSQL seulement, besoin de performance ou de fonctions propres |
  | **sqlc** | on écrit les requêtes SQL, il **génère** le code Go typé (structs et fonctions) | SQL maîtrisé, sûreté de type vérifiée à la génération |
  | **sqlx** | extensions de database/sql : `Get`, `Select`, `StructScan` | réduire le code de Scan sans changer d'approche |
  | **squirrel** | constructeur de requêtes | requêtes dynamiques (filtres optionnels) |
  | **GORM**, **ent** | ORM : modèles Go, requêtes générées, relations, migrations | CRUD rapide, équipe à l'aise avec les ORM |
  | **golang-migrate**, **goose**, **Atlas** | migrations du schéma | dans tous les cas |

  La tendance en Go est de **garder le SQL visible** : sqlc et pgx sont très répandus, car on sait exactement quelle
  requête s'exécute, et les erreurs de schéma apparaissent à la génération plutôt qu'en production.

  Les pièges des ORM : requêtes **N+1** (charger une liste, puis une requête par élément), requêtes générées
  inefficaces, comportements implicites (valeurs zéro ignorées dans les mises à jour avec GORM), et une couche
  supplémentaire à apprendre.

  Avec pgx, les erreurs PostgreSQL se lisent avec `errors.As(err, &pgErr)` et `pgErr.Code` (`23505` pour une violation
  d'unicité), et l'import massif passe par `CopyFrom`, bien plus rapide que des INSERT.

  **En entretien** : « database/sql pour la base commune ; pgx pour PostgreSQL ; sqlc pour du code typé généré depuis
  le SQL ; sqlx pour moins de Scan ; un ORM avec prudence (N+1) ; un outil de migrations dans tous les cas. »
cards:
  - key: pgx-natif-vs-database-sql
    format: course
    question: "Qu'apporte pgx, utilisé en mode natif, par rapport à `database/sql` ?"
    choices:
      - {text: "De meilleures performances et les fonctions de PostgreSQL : COPY, Batch, types propres", correct: true}
      - {text: "La compatibilité avec tous les moteurs SQL, grâce à une interface générique commune", correct: false}
      - {text: "Un ORM complet, qui génère les requêtes à partir des structs Go à l'exécution", correct: false}
      - {text: "La protection contre l'injection SQL, que `database/sql` n'offre pas du tout", correct: false}
    answer: "pgx natif est plus rapide et expose ce que PostgreSQL sait faire (COPY, Batch, types comme les tableaux ou JSONB). `database/sql` est l'interface générique, commune à tous les moteurs ; les deux protègent pareillement par leurs paramètres."
  - key: sqlc
    format: course
    question: "Qu'est-ce que sqlc ?"
    choices:
      - {text: "Un générateur de code Go typé, à partir de requêtes SQL écrites à la main", correct: true}
      - {text: "Un ORM qui génère le SQL à partir des structs Go, au moment de l'exécution", correct: false}
      - {text: "Un pilote PostgreSQL natif, plus rapide que les pilotes de `database/sql`", correct: false}
      - {text: "Un outil de migrations, qui applique des fichiers SQL versionnés au démarrage", correct: false}
    answer: "Un générateur : on écrit les requêtes en SQL, sqlc les vérifie contre le schéma et génère des fonctions Go typées pour les appeler. Rien n'est caché ni calculé à l'exécution, contrairement à un ORM."
  - key: avantages-inconvenients-gorm
    format: course
    question: "Quels sont les avantages et les inconvénients de GORM ?"
    choices:
      - {text: "Productif pour le CRUD et les associations, mais réflexion, requêtes implicites et N+1", correct: true}
      - {text: "Plus rapide que `database/sql`, mais limité à PostgreSQL et à MySQL", correct: false}
      - {text: "Typé à la compilation comme sqlc, mais sans prise en charge des transactions", correct: false}
      - {text: "Sans réflexion ni magie, mais il oblige à écrire tout le SQL à la main", correct: false}
    answer: "GORM fait gagner du temps sur le CRUD et les associations ; en échange, la réflexion, les requêtes implicites et les N+1 rendent ses performances moins prévisibles."
  - key: detecter-violation-unicite-postgresql
    format: course
    question: "Comment détecter, en Go, une violation d'unicité renvoyée par PostgreSQL ?"
    choices:
      - {text: "`errors.As` vers `*pgconn.PgError`, puis tester le code `23505`", correct: true}
      - {text: "`errors.Is(err, sql.ErrNoRows)`, renvoyé quand l'INSERT est refusé", correct: false}
      - {text: "Chercher le mot « duplicate » dans le texte de l'erreur renvoyée", correct: false}
      - {text: "Un `SELECT` avant chaque INSERT, pour vérifier que la clé est libre", correct: false}
    answer: "On extrait l'erreur du serveur avec `errors.As(err, &pgErr)`, puis l'on teste `pgErr.Code == \"23505\"` (unique_violation). Le message dépend de la langue du serveur, et un SELECT préalable laisse une course entre deux requêtes."
  - key: eviter-1
    format: course
    question: "Qu'est-ce qui évite un problème N+1 en Go ?"
    choices:
      - {text: "Une jointure, ou une seconde requête par lot avec `WHERE id = ANY($1)`", correct: true}
      - {text: "Une requête par élément, lancée dans des goroutines en parallèle", correct: false}
      - {text: "Un `MaxOpenConns` plus grand, pour que les N requêtes passent ensemble", correct: false}
      - {text: "Un cache par ligne, rempli à la première requête de chaque élément", correct: false}
    answer: "Une jointure, ou un chargement par lot (`WHERE id = ANY($1)`) : deux requêtes au lieu de N+1. Paralléliser les N requêtes ne fait que charger la base plus vite."
  - key: outils-migrations
    format: course
    question: "Quels outils servent aux migrations de schéma en Go ?"
    choices:
      - {text: "golang-migrate, goose ou Atlas", correct: true}
      - {text: "sqlc, sqlx ou squirrel", correct: false}
      - {text: "pgx, lib/pq ou go-sql-driver", correct: false}
      - {text: "gosec, staticcheck ou golangci-lint", correct: false}
    answer: "golang-migrate, goose et Atlas appliquent des migrations versionnées. sqlc génère du code, sqlx et squirrel aident à écrire les requêtes, pgx et lib/pq sont des pilotes."
  - key: importer-millions-lignes-rapidement-postgresql
    format: course
    question: "Comment importer rapidement des millions de lignes dans PostgreSQL depuis Go ?"
    choices:
      - {text: "Avec COPY (`CopyFrom` de pgx), ou des insertions par lots", correct: true}
      - {text: "Avec un `INSERT` par ligne, chacun dans sa propre transaction", correct: false}
      - {text: "Avec un `INSERT` par ligne, lancé dans une goroutine par ligne", correct: false}
      - {text: "Avec un ORM, qui regroupe seul les insertions en tâche de fond", correct: false}
    answer: "COPY (`CopyFrom` de pgx) envoie les lignes en flux, sans une requête par ligne ; à défaut, des insertions par lots. Un INSERT par ligne, même en parallèle, paie un aller-retour et un commit chacun."
  - key: terme-sqlc
    format: course
    question: "Que génère sqlc, et à partir de quoi ?"
    choices:
      - {text: "Du code Go typé, à partir de requêtes SQL et du schéma", correct: true}
      - {text: "Des requêtes SQL, à partir des structs Go annotées", correct: false}
      - {text: "Des migrations SQL, à partir de deux versions du schéma", correct: false}
      - {text: "Des faux pour les tests, à partir des interfaces de dépôt", correct: false}
    answer: "sqlc lit le schéma et les requêtes SQL écrites à la main, et génère des fonctions Go typées pour les appeler. Générer le SQL depuis des structs, c'est le travail d'un ORM."
  - key: vf-sqlc
    format: true-false
    question: sqlc génère du code Go typé à partir de requêtes SQL écrites par le développeur.
    truth: true
    answer: Il lit aussi le schéma pour vérifier les requêtes.
  - key: vf-orm-n1
    format: true-false
    question: Un ORM met à l'abri des requêtes N+1.
    truth: false
    answer: Charger les relations élément par élément est au contraire un piège classique des ORM.
  - key: vf-pgx
    format: true-false
    question: pgx peut s'utiliser comme pilote de database/sql ou avec sa propre API.
    truth: true
    answer: Via pgx/v5/stdlib ou pgxpool.
  - key: vf-copy
    format: true-false
    question: Pour importer des millions de lignes dans PostgreSQL, CopyFrom de pgx est bien plus rapide qu'une boucle d'INSERT.
    truth: true
    answer: COPY envoie les lignes en flux, sans un aller-retour par ligne.
  - key: qcm-outils
    format: multiple-choice
    question: "Ton équipe veut moins de code de `Scan`, sans changer d'approche ni générer de code. Quel outil choisis-tu ?"
    choices:
      - {text: "sqlx, qui scanne directement dans des structs", correct: true}
      - {text: "sqlc, qui génère le code à partir des requêtes", correct: false}
      - {text: "GORM, qui génère les requêtes depuis les structs", correct: false}
      - {text: "goose, qui applique les migrations du schéma", correct: false}
    answer: "sqlx étend `database/sql` : `Get` et `Select` remplissent des structs d'après leurs tags `db`. sqlc génère du code (un changement d'approche), GORM est un ORM, goose gère les migrations."
  - key: qcm-unicite
    format: multiple-choice
    question: Comment détecter une violation d'unicité avec pgx ?
    choices:
      - {text: "`var pgErr *pgconn.PgError; errors.As(err, &pgErr) && pgErr.Code == \"23505\"`", correct: true}
      - {text: "`strings.Contains(err.Error(), \"duplicate key\")`, sur le message renvoyé par le serveur", correct: false}
      - {text: "`errors.Is(err, sql.ErrNoRows)`, que le pilote renvoie quand l'INSERT est refusé", correct: false}
      - {text: "Un `SELECT` sur la clé avant chaque INSERT, pour vérifier qu'elle est encore libre", correct: false}
    answer: Le SELECT préalable laisse une course entre deux requêtes ; la contrainte et son code sont fiables.
  - key: qcm-n1
    format: multiple-choice
    question: Comment éviter un N+1 en chargeant des commandes et leurs lignes ?
    choices:
      - {text: "Une seconde requête qui charge toutes les lignes avec `WHERE commande_id = ANY($1)`", correct: true}
      - {text: "Une requête par commande, lancée dans une boucle après la liste des commandes", correct: false}
      - {text: "Une requête par commande, lancée dans une goroutine par commande pour aller vite", correct: false}
      - {text: "Un cache par ligne, rempli au premier chargement de chaque commande", correct: false}
    answer: "Deux requêtes au lieu de N+1 : les commandes, puis toutes leurs lignes d'un coup (ou une jointure ; `Preload` fait de même dans GORM). Paralléliser les N requêtes ne réduit pas leur nombre."
  - key: qcm-orm
    format: multiple-choice
    question: "Lesquels de ces inconvénients un ORM comme GORM peut-il avoir ?"
    choices:
      - text: Des requêtes générées moins efficaces ou difficiles à prévoir
        correct: true
      - text: Des comportements implicites, comme les valeurs zéro ignorées dans un Updates avec une struct
        correct: true
      - text: L'impossibilité d'utiliser PostgreSQL
        correct: false
      - text: L'obligation d'écrire tout le SQL à la main
        correct: false
    answer: Pour modifier une colonne à zéro, il faut une map ou Select.
  - key: scenario-choix
    format: scenario
    question: Quel outil d'accès aux données choisirais-tu pour un nouveau service Go sur PostgreSQL ?
    choices:
      - {text: "pgx (pgxpool) comme pilote et sqlc pour le code des requêtes, migrations avec goose", correct: true}
      - {text: "GORM pour tout, pour ne jamais écrire de SQL, même pour les requêtes critiques", correct: false}
      - {text: "`database/sql` avec des requêtes construites par `fmt.Sprintf`, les plus souples", correct: false}
      - {text: "Un ORM maison basé sur la réflexion, adapté exactement au domaine du service", correct: false}
    answer: "pgx comme pilote (pgxpool) et sqlc pour générer le code : le SQL reste lisible et relu, les types sont vérifiés à la génération, sans réflexion à l'exécution. Un constructeur (squirrel) pour les rares requêtes dynamiques, goose ou Atlas pour les migrations ; un ORM seulement pour du CRUD que l'équipe maîtrise."
  - key: scenario-gorm
    format: scenario
    question: "Ton équipe utilise GORM et un endpoint est devenu lent. Que regardes-tu en premier ?"
    choices:
      - {text: "Le SQL réellement exécuté, dans le journal de GORM ou les traces : souvent un N+1", correct: true}
      - {text: "Le nombre de goroutines du service, qui ralentit sans doute les appels à GORM", correct: false}
      - {text: "La version de Go, car GORM est bien plus lent sur les anciennes versions", correct: false}
      - {text: "La taille des structs, qu'il faut réduire pour accélérer la réflexion de GORM", correct: false}
    answer: "J'active le journal des requêtes (ou les traces OpenTelemetry) pour voir le SQL exécuté : souvent un N+1 sur une relation (Preload ou jointure), un SELECT * qui charge des colonnes lourdes, ou un index manquant (EXPLAIN ANALYZE). Pour une requête critique, du SQL écrit à la main avec Raw."
  - key: scenario-import
    format: scenario
    question: Comment importes-tu un fichier CSV de 5 millions de lignes dans PostgreSQL depuis Go ?
    choices:
      - {text: "`CopyFrom` de pgx, alimenté en flux par `encoding/csv`, dans une table de travail", correct: true}
      - {text: "Lire tout le fichier en mémoire, puis un `INSERT` par ligne dans une transaction", correct: false}
      - {text: "Un `INSERT` par ligne, chacun dans sa goroutine, pour paralléliser l'import", correct: false}
      - {text: "`Create` de GORM sur une slice de 5 millions de structs, en un seul appel", correct: false}
    answer: "`CopyFrom` de pgx, alimenté par un `CopyFromSource` qui lit le CSV en flux : rien n'est chargé en entier en mémoire, et le débit atteint des centaines de milliers de lignes par seconde. On importe dans une table de travail, on valide, puis on fusionne par `INSERT ... ON CONFLICT` dans une transaction."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande pourquoi beaucoup d'équipes Go évitent les ORM. Que réponds-tu ?"
    choices:
      - {text: "La culture Go préfère l'explicite : voir la requête exécutée et maîtriser ses performances", correct: true}
      - {text: "Go n'a pas de réflexion à l'exécution, ce qui rend impossible d'écrire un ORM complet", correct: false}
      - {text: "Les ORM Go ne gèrent pas PostgreSQL, le moteur le plus utilisé par les équipes Go", correct: false}
      - {text: "Le compilateur Go interdit de mapper automatiquement des tables vers des structs", correct: false}
    answer: "La culture Go préfère l'explicite : voir la requête qui s'exécute, maîtriser ses performances, éviter la réflexion et la magie. sqlc donne le confort du code généré et typé sans cacher le SQL ; les ORM gardent leur place pour du CRUD, mais leurs pièges (N+1, valeurs zéro) coûtent cher."
