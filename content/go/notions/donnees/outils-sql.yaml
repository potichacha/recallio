notion: outils-sql
cards:
  - key: pgx-natif-vs-database-sql
    format: course
    question: pgx natif vs database/sql ?
    answer: pgx natif est plus performant et expose les fonctionnalités PostgreSQL (COPY, Batch, types) ; database/sql est générique.
  - key: sqlc
    format: course
    question: C'est quoi sqlc ?
    answer: Un générateur de code Go typé à partir de requêtes SQL écrites à la main.
  - key: avantages-inconvenients-gorm
    format: course
    question: Avantages et inconvénients de GORM ?
    answer: Productivité et associations vs réflexion, requêtes implicites, N+1 et performances moins prévisibles.
  - key: detecter-violation-unicite-postgresql
    format: course
    question: Comment détecter une violation d'unicité en PostgreSQL ?
    answer: errors.As vers *pgconn.PgError et code 23505.
  - key: eviter-1
    format: course
    question: Comment éviter un N+1 en Go ?
    answer: Jointure, ou chargement par lot avec `WHERE id = ANY($1)`.
  - key: outils-migrations
    format: course
    question: Quels outils pour les migrations ?
    answer: golang-migrate, goose, Atlas.
  - key: importer-millions-lignes-rapidement-postgresql
    format: course
    question: Comment importer des millions de lignes rapidement en PostgreSQL ?
    answer: COPY (pgx CopyFrom) ou insertions par lots.
  - key: terme-sqlc
    format: course
    question: Que désigne « sqlc » ?
    answer: Générateur de code Go typé depuis du SQL
