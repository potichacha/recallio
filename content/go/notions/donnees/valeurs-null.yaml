notion: valeurs-null
lesson: "Un **`NULL`** SQL ne rentre pas dans un `string` ou un `int64` Go : `Scan` d'un NULL dans un `string` échoue avec\n« converting NULL to string is unsupported ». Trois façons de le recevoir :\n\n```go\n// 1. les types sql.NullXxx\nvar tel sql.NullString\nrow.Scan(&tel)\nif tel.Valid {\n\tfmt.Println(tel.String)\n}\n\n// 2. le type générique sql.Null[T] (Go 1.22)\nvar naissance sql.Null[time.Time]\nrow.Scan(&naissance) // naissance.V, naissance.Valid\n\n// 3. un pointeur\nvar surnom *string\nrow.Scan(&surnom) // nil si NULL\n```\n\nPour **écrire** un NULL, on passe `sql.NullString{Valid: false}`, un `sql.Null[T]` invalide, ou un pointeur `nil`.\n\nChoisir :\n- les **pointeurs** sont simples et se combinent bien avec JSON (`null`), mais demandent de tester `nil` partout ;\n- `sql.Null[T]` est explicite et générique, à garder dans la couche de persistance ;\n- **`COALESCE(colonne, '')`** dans la requête convient quand la valeur vide et NULL veulent dire la même chose pour\n  le métier ;\n- le mieux reste souvent un schéma avec **`NOT NULL`** et une valeur par défaut, quand l'absence n'a pas de sens.\n\nOn convertit ces types à la frontière : le **domaine** ne manipule pas de `sql.NullString`, mais des valeurs\n(éventuellement des pointeurs ou des types optionnels à soi).\n\n**En entretien** : « Scan d'un NULL dans un string échoue ; sql.NullString, sql.Null[T] depuis Go 1.22, ou un\npointeur ; COALESCE quand NULL équivaut à vide ; NOT NULL quand c'est possible ; convertir à la frontière. »"
cards:
  - key: gerer-colonne-null
    format: course
    question: Comment gérer une colonne NULL ?
    answer: sql.NullString et équivalents, sql.Null[T] (Go 1.22), un pointeur, ou COALESCE.
  - key: null-generique
    format: course
    question: Qu'apporte sql.Null[T] (Go 1.22) ?
    answer: Un type générique avec les champs V et Valid, qui fonctionne pour n'importe quel type (time.Time, un type à soi), au lieu des seuls NullString, NullInt64, NullTime...
  - key: coalesce
    format: course
    question: Quand utiliser COALESCE plutôt qu'un type nullable en Go ?
    answer: 'Quand NULL et la valeur par défaut (chaîne vide, 0) ont le même sens pour le métier : `SELECT COALESCE(telephone, '''')` permet de scanner dans un simple string.'
  - key: frontiere
    format: course
    question: Pourquoi convertir les sql.NullString à la frontière de la couche de persistance ?
    answer: 'Pour que le domaine ne dépende pas de database/sql : il reçoit des valeurs, ou des pointeurs et des types optionnels à lui, et la conversion se fait une fois dans le dépôt.'
  - key: vf-scan-string
    format: true-false
    question: Scanner un NULL dans une variable string donne une chaîne vide.
    truth: false
    answer: Scan renvoie une erreur ; il faut un type nullable ou COALESCE.
  - key: vf-pointeur
    format: true-false
    question: Un pointeur `*string` peut recevoir un NULL avec Scan.
    truth: true
    answer: Il vaut alors nil.
  - key: vf-valid
    format: true-false
    question: Pour sql.NullString, Valid vaut true quand la colonne contient une valeur.
    truth: true
    answer: Et false pour NULL.
  - key: vf-ecrire
    format: true-false
    question: Passer un pointeur nil en paramètre d'une requête écrit NULL dans la colonne.
    truth: true
    answer: Les pilotes convertissent nil en NULL.
  - key: qcm-recevoir
    format: multiple-choice
    question: Comment recevoir une colonne nullable ?
    choices:
      - text: '`sql.NullString` ou `sql.NullInt64`'
        correct: true
      - text: '`sql.Null[time.Time]`'
        correct: true
      - text: Un pointeur `*string`
        correct: true
      - text: Un `string` simple
        correct: false
    answer: Le string simple échoue sur un NULL.
  - key: qcm-schema
    format: multiple-choice
    question: Quand préférer NOT NULL dans le schéma ?
    choices:
      - text: Quand l'absence de valeur n'a pas de sens métier
        correct: true
      - text: Quand une valeur par défaut convient
        correct: true
      - text: Toujours, même pour une date de résiliation qui n'existe pas encore
        correct: false
      - text: Jamais, NULL est plus souple
        correct: false
    answer: Une date de résiliation absente est un vrai NULL.
  - key: qcm-json
    format: multiple-choice
    question: Comment un sql.NullString s'encode-t-il en JSON par défaut ?
    choices:
      - text: 'Comme un objet {"String": "...", "Valid": true}'
        correct: true
      - text: Comme une chaîne ou null
        correct: false
      - text: Il fait échouer json.Marshal
        correct: false
      - text: Comme une chaîne vide
        correct: false
    answer: D'où l'intérêt de convertir vers un pointeur ou un type dédié avant l'encodage.
  - key: qcm-ecrire
    format: multiple-choice
    question: Comment écrire NULL dans une colonne ?
    choices:
      - text: Passer `sql.NullString{}` (Valid à false)
        correct: true
      - text: Passer un pointeur nil
        correct: true
      - text: Passer la chaîne "NULL"
        correct: false
      - text: Passer une chaîne vide
        correct: false
    answer: La chaîne "NULL" serait enregistrée telle quelle.
  - key: trous-nullstring
    format: fill-in
    question: "Complétez :\n```go\nvar tel sql.NullString\nif err := row.Scan(&tel); err != nil {\n\treturn err\n}\nif tel.___ {\n\tc.Telephone = tel.String\n}\n```"
    blanks:
      - - Valid
    answer: Valid indique une valeur présente.
  - key: trous-generique
    format: fill-in
    question: |-
      Complétez le type générique :
      ```go
      var resiliation sql.___[time.Time]
      ```
    blanks:
      - - 'Null'
    answer: sql.Null[T].
  - key: trous-champ-v
    format: fill-in
    question: "Complétez pour lire la valeur :\n```go\nif resiliation.Valid {\n\tc.Resiliation = &resiliation.___\n}\n```"
    blanks:
      - - V
    answer: Le champ V de sql.Null[T].
  - key: trous-coalesce
    format: fill-in
    question: |-
      Complétez pour recevoir une chaîne vide au lieu de NULL :
      ```sql
      SELECT nom, ___(telephone, '') FROM clients WHERE id = $1
      ```
    blanks:
      - - COALESCE
    answer: COALESCE.
  - key: bug-scan
    format: bug-fix
    question: |-
      La liste des clients échoue avec « converting NULL to string is unsupported » :
      ```go
      var c Client
      rows.Scan(&c.ID, &c.Nom, &c.Telephone) // Telephone string, colonne nullable
      ```
    answer: "```go\nvar c Client\nvar tel sql.NullString\nif err := rows.Scan(&c.ID, &c.Nom, &tel); err != nil {\n\treturn nil, err\n}\nif tel.Valid {\n\tc.Telephone = &tel.String\n}\n```\nLa colonne nullable passe par un sql.NullString, converti ensuite vers le type du domaine (ici un pointeur)."
  - key: bug-json
    format: bug-fix
    question: "L'API renvoie `\"telephone\": {\"String\": \"\", \"Valid\": false}` :\n```go\ntype ClientReponse struct {\n\tNom       string         `json:\"nom\"`\n\tTelephone sql.NullString `json:\"telephone\"`\n}\n```"
    answer: "```go\ntype ClientReponse struct {\n\tNom       string  `json:\"nom\"`\n\tTelephone *string `json:\"telephone\"` // null ou une chaîne\n}\n```\nLe type de persistance fuyait dans l'API ; un pointeur s'encode en null ou en chaîne."
  - key: bug-vide
    format: bug-fix
    question: |-
      Après la mise à jour du profil, les téléphones effacés contiennent "" au lieu de NULL, et les rapports les comptent comme renseignés :
      ```go
      db.ExecContext(ctx, "UPDATE clients SET telephone = $1 WHERE id = $2", p.Telephone, id) // Telephone string
      ```
    answer: |-
      ```go
      tel := sql.Null[string]{V: p.Telephone, Valid: p.Telephone != ""}
      db.ExecContext(ctx, "UPDATE clients SET telephone = $1 WHERE id = $2", tel, id)
      ```
      Une chaîne vide n'est pas NULL ; on écrit explicitement NULL quand la valeur est absente.
  - key: bug-valid-ignore
    format: bug-fix
    question: |-
      Les clients sans date de naissance apparaissent nés le 1er janvier de l'an 1 :
      ```go
      var naissance sql.NullTime
      row.Scan(&naissance)
      c.Naissance = naissance.Time
      ```
    answer: "```go\nvar naissance sql.NullTime\nif err := row.Scan(&naissance); err != nil {\n\treturn err\n}\nif naissance.Valid {\n\tc.Naissance = &naissance.Time\n}\n```\nSans tester Valid, NULL devenait la valeur zéro de time.Time ; on garde l'absence (un pointeur nil)."
