notion: valeurs-null
lesson: "Un **`NULL`** SQL ne rentre pas dans un `string` ou un `int64` Go : `Scan` d'un NULL dans un `string` échoue avec\n« converting NULL to string is unsupported ». Trois façons de le recevoir :\n\n```go\n// 1. les types sql.NullXxx\nvar tel sql.NullString\nrow.Scan(&tel)\nif tel.Valid {\n\tfmt.Println(tel.String)\n}\n\n// 2. le type générique sql.Null[T] (Go 1.22)\nvar naissance sql.Null[time.Time]\nrow.Scan(&naissance) // naissance.V, naissance.Valid\n\n// 3. un pointeur\nvar surnom *string\nrow.Scan(&surnom) // nil si NULL\n```\n\nPour **écrire** un NULL, on passe `sql.NullString{Valid: false}`, un `sql.Null[T]` invalide, ou un pointeur `nil`.\n\nChoisir :\n- les **pointeurs** sont simples et se combinent bien avec JSON (`null`), mais demandent de tester `nil` partout ;\n- `sql.Null[T]` est explicite et générique, à garder dans la couche de persistance ;\n- **`COALESCE(colonne, '')`** dans la requête convient quand la valeur vide et NULL veulent dire la même chose pour\n  le métier ;\n- le mieux reste souvent un schéma avec **`NOT NULL`** et une valeur par défaut, quand l'absence n'a pas de sens.\n\nOn convertit ces types à la frontière : le **domaine** ne manipule pas de `sql.NullString`, mais des valeurs\n(éventuellement des pointeurs ou des types optionnels à soi).\n\n**En entretien** : « Scan d'un NULL dans un string échoue ; sql.NullString, sql.Null[T] depuis Go 1.22, ou un\npointeur ; COALESCE quand NULL équivaut à vide ; NOT NULL quand c'est possible ; convertir à la frontière. »"
cards:
  - key: gerer-colonne-null
    format: course
    question: "Comment recevoir en Go une colonne qui peut valoir NULL ?"
    choices:
      - {text: "Avec `sql.NullString` (ou `sql.Null[T]`), un pointeur, ou `COALESCE` dans la requête", correct: true}
      - {text: "Avec un `string` simple, que `Scan` laisse vide quand la colonne vaut NULL", correct: false}
      - {text: "Avec `any`, le seul type que `Scan` accepte pour une colonne nullable", correct: false}
      - {text: "Avec un `string` et un `recover`, car `Scan` panique sur un NULL", correct: false}
    answer: "`sql.NullString` et ses équivalents, `sql.Null[T]` depuis Go 1.22, un pointeur, ou `COALESCE` côté SQL. Un `string` simple fait échouer `Scan` : « converting NULL to string is unsupported »."
  - key: null-generique
    format: course
    question: "Qu'apporte `sql.Null[T]`, ajouté en Go 1.22 ?"
    choices:
      - {text: "Un seul type générique, avec `V` et `Valid`, pour n'importe quel type de colonne", correct: true}
      - {text: "Une valeur nil automatique pour tout type, sans champ `Valid` à tester", correct: false}
      - {text: "Un pointeur générique, qui remplace `*T` dans les structs du domaine", correct: false}
      - {text: "La conversion de NULL en valeur zéro, sans erreur au moment du `Scan`", correct: false}
    answer: Un type générique avec les champs V et Valid, qui fonctionne pour n'importe quel type (time.Time, un type à soi), au lieu des seuls NullString, NullInt64, NullTime...
  - key: coalesce
    format: course
    question: Quand utiliser COALESCE plutôt qu'un type nullable en Go ?
    choices:
      - {text: "Quand NULL et la valeur par défaut (chaîne vide, 0) ont le même sens pour le métier", correct: true}
      - {text: "Toujours : `COALESCE` est plus rapide que n'importe quel type nullable côté Go", correct: false}
      - {text: "Quand il faut distinguer une valeur absente d'une valeur vide dans la réponse", correct: false}
      - {text: "Jamais : `COALESCE` ne s'applique qu'aux colonnes numériques", correct: false}
    answer: "Quand NULL et la valeur par défaut ont le même sens : `SELECT COALESCE(telephone, '')` permet de scanner dans un simple `string`. S'il faut distinguer l'absence du vide, il faut un type nullable."
  - key: frontiere
    format: course
    question: Pourquoi convertir les sql.NullString à la frontière de la couche de persistance ?
    choices:
      - {text: "Pour que le domaine ne dépende pas de `database/sql` : la conversion se fait une fois, dans le dépôt", correct: true}
      - {text: "Parce que `sql.NullString` ne peut pas être exporté hors du paquet qui a fait le `Scan`", correct: false}
      - {text: "Parce que `sql.NullString` n'est pas sûr en concurrence une fois sorti du dépôt", correct: false}
      - {text: "Parce qu'un `sql.NullString` garde sa connexion empruntée tant qu'il reste en mémoire", correct: false}
    answer: 'Pour que le domaine ne dépende pas de database/sql : il reçoit des valeurs, ou des pointeurs et des types optionnels à lui, et la conversion se fait une fois dans le dépôt.'
  - key: vf-scan-string
    format: true-false
    question: Scanner un NULL dans une variable string donne une chaîne vide.
    truth: false
    answer: Scan renvoie une erreur ; il faut un type nullable ou COALESCE.
  - key: vf-pointeur
    format: true-false
    question: Un pointeur `*string` peut recevoir un NULL avec Scan.
    truth: true
    answer: Il vaut alors nil.
  - key: vf-valid
    format: true-false
    question: Pour sql.NullString, Valid vaut true quand la colonne contient une valeur.
    truth: true
    answer: Et false pour NULL.
  - key: vf-ecrire
    format: true-false
    question: Passer un pointeur nil en paramètre d'une requête écrit NULL dans la colonne.
    truth: true
    answer: Les pilotes convertissent nil en NULL.
  - key: qcm-recevoir
    format: multiple-choice
    question: "Lequel de ces types fait échouer `Scan` sur une colonne nullable qui vaut NULL ?"
    choices:
      - {text: "Un `string` simple", correct: true}
      - {text: "`sql.NullString`", correct: false}
      - {text: "`sql.Null[time.Time]`", correct: false}
      - {text: "Un pointeur `*string`", correct: false}
    answer: "Un `string` simple ne peut pas représenter NULL : `Scan` échoue (« converting NULL to string is unsupported »). Les types `sql.Null...` et les pointeurs, eux, reçoivent l'absence."
  - key: qcm-schema
    format: multiple-choice
    question: "Dans lesquels de ces cas faut-il préférer NOT NULL dans le schéma ?"
    choices:
      - text: Quand l'absence de valeur n'a pas de sens métier
        correct: true
      - text: Quand une valeur par défaut convient
        correct: true
      - text: Toujours, même pour une date de résiliation qui n'existe pas encore
        correct: false
      - text: Jamais, NULL est plus souple
        correct: false
    answer: Une date de résiliation absente est un vrai NULL.
  - key: qcm-json
    format: multiple-choice
    question: Comment un sql.NullString s'encode-t-il en JSON par défaut ?
    choices:
      - text: 'Comme un objet {"String": "...", "Valid": true}'
        correct: true
      - text: Comme une chaîne ou null
        correct: false
      - text: Il fait échouer json.Marshal
        correct: false
      - text: Comme une chaîne vide
        correct: false
    answer: D'où l'intérêt de convertir vers un pointeur ou un type dédié avant l'encodage.
  - key: qcm-ecrire
    format: multiple-choice
    question: "Quelle valeur, passée en paramètre, écrit NULL dans une colonne `telephone` de type texte ?"
    choices:
      - {text: "`sql.NullString{}`, dont `Valid` vaut `false`", correct: true}
      - {text: "La chaîne `\"NULL\"`, que le pilote reconnaît", correct: false}
      - {text: "Une chaîne vide `\"\"`, valeur zéro d'un `string`", correct: false}
      - {text: "`sql.NullString{Valid: true}`, sans aucune valeur", correct: false}
    answer: "Un `sql.NullString` dont `Valid` vaut `false` (comme un pointeur nil) s'écrit NULL. La chaîne `\"NULL\"` serait enregistrée telle quelle, et une chaîne vide n'est pas NULL."
  - key: trous-nullstring
    format: fill-in
    question: |-
      Complète :
      ```go
      var tel sql.NullString
      if err := row.Scan(&tel); err != nil {
      	return err
      }
      if tel.___ {
      	c.Telephone = tel.String
      }
      ```
    blanks:
      - - Valid
    answer: Valid indique une valeur présente.
  - key: trous-generique
    format: fill-in
    question: |-
      Complète le type générique :
      ```go
      var resiliation sql.___[time.Time]
      ```
    blanks:
      - - 'Null'
    answer: sql.Null[T].
  - key: trous-champ-v
    format: fill-in
    question: |-
      Complète pour lire la valeur :
      ```go
      if resiliation.Valid {
      	c.Resiliation = &resiliation.___
      }
      ```
    blanks:
      - - V
    answer: Le champ V de sql.Null[T].
  - key: trous-coalesce
    format: fill-in
    question: |-
      Complète pour recevoir une chaîne vide au lieu de NULL :
      ```sql
      SELECT nom, ___(telephone, '') FROM clients WHERE id = $1
      ```
    blanks:
      - - COALESCE
    answer: COALESCE.
  - key: bug-scan
    format: bug-fix
    question: |-
      La liste des clients échoue avec « converting NULL to string is unsupported ». Quelle correction est la bonne ?
      ```go
      var c Client
      rows.Scan(&c.ID, &c.Nom, &c.Telephone) // Telephone string, colonne nullable
      ```
    choices:
      - {text: "Scanner dans un `sql.NullString`, puis le convertir vers le type du domaine", correct: true}
      - {text: "Ignorer l'erreur de `Scan` : `Telephone` reste vide pour les NULL", correct: false}
      - {text: "Initialiser `c.Telephone` à une chaîne vide avant d'appeler `Scan`", correct: false}
      - {text: "Passer `&c.Telephone` en `*any`, puis le convertir en `string`", correct: false}
    answer: "```go\nvar c Client\nvar tel sql.NullString\nif err := rows.Scan(&c.ID, &c.Nom, &tel); err != nil {\n\treturn nil, err\n}\nif tel.Valid {\n\tc.Telephone = &tel.String\n}\n```\nLa colonne nullable passe par un sql.NullString, converti ensuite vers le type du domaine (ici un pointeur)."
  - key: bug-json
    format: bug-fix
    question: |-
      L'API renvoie `"telephone": {"String": "", "Valid": false}` pour un client sans téléphone. Quelle correction est la bonne ?
      ```go
      type ClientReponse struct {
      	Nom       string         `json:"nom"`
      	Telephone sql.NullString `json:"telephone"`
      }
      ```
    choices:
      - {text: "Un champ `*string` dans le type de réponse, encodé en `null` ou en chaîne", correct: true}
      - {text: "Le tag `json:\"telephone,omitempty\"` sur le champ `sql.NullString`", correct: false}
      - {text: "Un champ `string`, rempli avec `tel.String` même quand `Valid` est faux", correct: false}
      - {text: "Une méthode `MarshalJSON` ajoutée à `sql.NullString`, dans le paquet de l'API", correct: false}
    answer: "```go\ntype ClientReponse struct {\n\tNom       string  `json:\"nom\"`\n\tTelephone *string `json:\"telephone\"` // null ou une chaîne\n}\n```\nLe type de persistance fuyait dans l'API ; un pointeur s'encode en null ou en chaîne."
  - key: bug-vide
    format: bug-fix
    question: |-
      Après la mise à jour du profil, les téléphones effacés contiennent une chaîne vide au lieu de NULL, et les rapports les comptent comme renseignés. Quelle correction est la bonne ?
      ```go
      db.ExecContext(ctx, "UPDATE clients SET telephone = $1 WHERE id = $2", p.Telephone, id) // Telephone string
      ```
    choices:
      - {text: "Passer un `sql.Null[string]` dont `Valid` est faux quand le téléphone est vide", correct: true}
      - {text: "Passer la chaîne `NULL` en paramètre quand le téléphone est vide", correct: false}
      - {text: "Ajouter `DEFAULT NULL` à la colonne, qui s'applique aux chaînes vides", correct: false}
      - {text: "Passer `p.Telephone` par `%q`, pour que le pilote reconnaisse le vide", correct: false}
    answer: |-
      ```go
      tel := sql.Null[string]{V: p.Telephone, Valid: p.Telephone != ""}
      db.ExecContext(ctx, "UPDATE clients SET telephone = $1 WHERE id = $2", tel, id)
      ```
      Une chaîne vide n'est pas NULL ; on écrit explicitement NULL quand la valeur est absente.
  - key: bug-valid-ignore
    format: bug-fix
    question: |-
      Les clients sans date de naissance apparaissent nés le 1er janvier de l'an 1. Quelle correction est la bonne ?
      ```go
      var naissance sql.NullTime
      row.Scan(&naissance)
      c.Naissance = naissance.Time
      ```
    choices:
      - {text: "Tester `naissance.Valid` et garder l'absence, par exemple avec un pointeur nil", correct: true}
      - {text: "Comparer `naissance.Time` à `time.Now()`, pour écarter les dates trop anciennes", correct: false}
      - {text: "Remplacer `sql.NullTime` par `time.Time`, que `Scan` laisse à nil sur un NULL", correct: false}
      - {text: "Formater la date avec `time.DateOnly`, qui affiche vide pour une date zéro", correct: false}
    answer: "```go\nvar naissance sql.NullTime\nif err := row.Scan(&naissance); err != nil {\n\treturn err\n}\nif naissance.Valid {\n\tc.Naissance = &naissance.Time\n}\n```\nSans tester Valid, NULL devenait la valeur zéro de time.Time ; on garde l'absence (un pointeur nil)."
