notion: pool-connexions
cards:
  - key: valeur-defaut-maxopenconns
    format: course
    question: Quelle est la valeur par défaut de MaxOpenConns ?
    answer: Illimitée ; il faut la borner.
  - key: sert-setconnmaxlifetime
    format: course
    question: À quoi sert SetConnMaxLifetime ?
    answer: À renouveler les connexions périodiquement (bascules, proxies, équilibrage).
  - key: apres-pic-trafic-toutes-requetes-base
    format: scenario
    question: Après un pic de trafic, toutes les requêtes en base attendent sans fin.
    answer: |-
      Symptôme typique d'un **pool épuisé**. Je regarderais `db.Stats()` (ou la métrique correspondante) : si `InUse` est au maximum et `WaitCount` explose, des connexions ne sont pas rendues. Les causes : un `rows.Close()` manquant sur un chemin d'erreur, une transaction jamais commitée ni annulée, ou un traitement long (appel HTTP) effectué pendant qu'on itère sur des `Rows` ou dans une transaction.
      Les requêtes "attendent sans fin" aussi parce qu'il n'y a pas de contexte avec délai : avec `QueryContext` et un timeout, elles échoueraient vite au lieu de s'empiler. Je corrigerais les fuites, j'ajouterais `defer rows.Close()` systématique, et des timeouts sur chaque requête. L'analyseur `sqlclosecheck` (golangci-lint) détecte les `Rows` non fermés.
