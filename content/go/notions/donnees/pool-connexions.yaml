notion: pool-connexions
lesson: |-
  Un `*sql.DB` gère un **pool** : il ouvre des connexions à la demande, garde les inactives pour les réutiliser, et en
  ferme selon ses réglages.

  ```go
  db.SetMaxOpenConns(25)                  // connexions ouvertes au plus (0 = illimité, le défaut)
  db.SetMaxIdleConns(25)                  // connexions inactives gardées (2 par défaut)
  db.SetConnMaxLifetime(30 * time.Minute) // durée de vie maximale d'une connexion
  db.SetConnMaxIdleTime(5 * time.Minute)  // fermer une connexion inactive depuis 5 minutes
  ```

  Pourquoi les régler :
  - **`MaxOpenConns`** illimité par défaut : sous un pic, le service peut ouvrir des centaines de connexions et dépasser
    la limite de la base (`max_connections` de PostgreSQL), pour tous les services qui la partagent. On le borne :
    au-delà, les requêtes **attendent** une connexion libre (d'où l'importance des contextes avec délai) ;
  - **`MaxIdleConns`** à 2 par défaut : avec 25 connexions actives, 23 sont fermées puis rouvertes en permanence ; on
    l'aligne sur MaxOpenConns ;
  - **`ConnMaxLifetime`** renouvelle les connexions, pour suivre un basculement de base, un répartiteur ou une rotation
    des identifiants ;
  - **`ConnMaxIdleTime`** libère les connexions après un pic.

  Le dimensionnement se raisonne **globalement** : nombre d'instances × MaxOpenConns doit rester sous la limite de la
  base (en gardant de la marge pour les migrations et l'administration), ou passer par un **PgBouncer**.

  **`db.Stats()`** donne l'état du pool : connexions ouvertes, en usage, inactives, et surtout **`WaitCount`** et
  **`WaitDuration`** (combien de requêtes ont attendu une connexion, et combien de temps). On les exporte en métriques.

  **En entretien** : « Un pool ; MaxOpenConns illimité par défaut, à borner ; MaxIdleConns à 2 par défaut, à aligner ;
  ConnMaxLifetime pour renouveler ; instances × MaxOpenConns sous la limite de la base ; Stats pour surveiller
  l'attente. »
cards:
  - key: valeur-defaut-maxopenconns
    format: course
    question: "Quelle est la valeur par défaut de `MaxOpenConns` dans `database/sql` ?"
    choices:
      - {text: "0, c'est-à-dire illimitée : il faut la borner", correct: true}
      - {text: "10, comme le pool de la plupart des pilotes", correct: false}
      - {text: "Le nombre de cœurs, donné par `runtime.NumCPU()`", correct: false}
      - {text: "2, la même valeur que `MaxIdleConns` par défaut", correct: false}
    answer: "0, soit aucune limite : sous un pic, le pool ouvre autant de connexions que de requêtes simultanées, jusqu'à saturer la base. On la borne avec `SetMaxOpenConns`. C'est `MaxIdleConns` qui vaut 2 par défaut."
  - key: sert-setconnmaxlifetime
    format: course
    question: "À quoi sert `SetConnMaxLifetime` ?"
    choices:
      - {text: "À renouveler périodiquement les connexions, pour suivre bascules et répartiteurs", correct: true}
      - {text: "À borner la durée maximale de chaque requête SQL envoyée à la base", correct: false}
      - {text: "À fermer les connexions restées inactives au-delà de cette durée", correct: false}
      - {text: "À limiter le temps d'attente d'une connexion libre dans le pool", correct: false}
    answer: "Une connexion plus vieille que cette durée est fermée puis remplacée : les connexions suivent une bascule vers une nouvelle base primaire ou se répartissent entre les instances. La durée d'une requête se borne par son contexte, l'inactivité par `SetConnMaxIdleTime`."
  - key: apres-pic-trafic-toutes-requetes-base
    format: scenario
    question: "Après un pic de trafic, toutes les requêtes en base attendent sans fin. Que soupçonnes-tu ?"
    choices:
      - {text: "Un pool épuisé par des connexions jamais rendues : `rows` non fermées ou transactions ouvertes", correct: true}
      - {text: "Une base trop lente : il faut doubler sa mémoire avant même de regarder le code", correct: false}
      - {text: "Un `MaxOpenConns` trop bas : il suffit de le multiplier par dix pour absorber le pic", correct: false}
      - {text: "Un ramasse-miettes saturé par le pic, qui bloque les goroutines du pilote", correct: false}
    answer: "Un pool épuisé : `db.Stats()` montre `InUse` au maximum et `WaitCount` qui explose. Les causes : un `rows.Close()` manquant, une transaction jamais validée ni annulée, un appel lent pendant un parcours. Avec un contexte à délai, les requêtes échoueraient vite au lieu de s'empiler ; `sqlclosecheck` détecte les `Rows` non fermés."
  - key: idle-defaut
    format: course
    question: "Pourquoi aligner `MaxIdleConns` sur `MaxOpenConns` ?"
    choices:
      - {text: "Par défaut, seules 2 connexions inactives sont gardées : les autres sont fermées puis rouvertes sans cesse", correct: true}
      - {text: "Par défaut, les connexions inactives ne sont jamais fermées, et la base finit par refuser les nouvelles", correct: false}
      - {text: "Sinon, `MaxOpenConns` est ignoré tant que `MaxIdleConns` garde sa valeur par défaut", correct: false}
      - {text: "Sinon, les connexions inactives sont gardées sans limite, et la mémoire du service grossit", correct: false}
    answer: "Par défaut, `database/sql` ne garde que 2 connexions inactives : sous une charge régulière de 25 requêtes simultanées, les autres sont fermées après usage puis rouvertes, ce qui coûte du temps et charge la base."
  - key: stats
    format: course
    question: "Quelles statistiques du pool faut-il surveiller en priorité ?"
    choices:
      - {text: "`WaitCount` et `WaitDuration` de `db.Stats()` : les attentes d'une connexion libre", correct: true}
      - {text: "`runtime.NumGoroutine()`, qui compte les connexions ouvertes par le pool", correct: false}
      - {text: "`MaxOpenConns`, relu à chaque requête pour savoir s'il a été dépassé", correct: false}
      - {text: "Le nombre de requêtes par seconde, seule mesure fiable de la saturation", correct: false}
    answer: "Celles de `db.Stats()` : `OpenConnections`, `InUse`, `Idle`, et surtout `WaitCount` et `WaitDuration`, qui disent combien de requêtes ont attendu une connexion et combien de temps."
  - key: vf-defaut
    format: true-false
    question: Par défaut, un sql.DB n'impose aucune limite au nombre de connexions ouvertes.
    truth: true
    answer: MaxOpenConns vaut 0, soit illimité.
  - key: vf-attente
    format: true-false
    question: Quand MaxOpenConns est atteint, une nouvelle requête échoue immédiatement.
    truth: false
    answer: Elle attend qu'une connexion se libère, jusqu'à l'expiration de son contexte.
  - key: vf-lifetime
    format: true-false
    question: SetConnMaxLifetime ferme les connexions au bout d'une durée, même si elles servent régulièrement.
    truth: true
    answer: Elles sont fermées quand elles reviennent au pool après cette durée.
  - key: vf-instances
    format: true-false
    question: Avec 10 instances réglées à MaxOpenConns(50), la base peut recevoir jusqu'à 500 connexions de ce service.
    truth: true
    answer: Le dimensionnement se fait sur l'ensemble des instances.
  - key: qcm-reglages
    format: multiple-choice
    question: "Laquelle de ces descriptions des réglages du pool est fausse ?"
    choices:
      - {text: "`SetConnMaxLifetime` : la durée maximale d'une requête", correct: true}
      - {text: "`SetMaxOpenConns` : le plafond de connexions ouvertes", correct: false}
      - {text: "`SetMaxIdleConns` : le nombre de connexions inactives gardées", correct: false}
      - {text: "`SetConnMaxIdleTime` : la fermeture des connexions inactives depuis trop longtemps", correct: false}
    answer: "`SetConnMaxLifetime` borne l'âge d'une connexion, pas la durée d'une requête, qui se borne par son contexte. Les trois autres descriptions sont justes."
  - key: qcm-dimensionner
    format: multiple-choice
    question: La base accepte 200 connexions et le service tourne sur 6 instances. Quel MaxOpenConns ?
    choices:
      - {text: "Environ 25, pour rester sous 200 avec de la marge", correct: true}
      - {text: "100, pour absorber les pics de chaque instance", correct: false}
      - {text: "200, la limite de la base, sur chaque instance", correct: false}
      - {text: "0, illimité : le pool s'adapte seul à la charge", correct: false}
    answer: 6 × 25 = 150, ce qui laisse de la place pour les migrations et l'administration.
  - key: qcm-symptomes
    format: multiple-choice
    question: "Lesquels de ces symptômes montrent un pool trop petit ?"
    choices:
      - text: Un WaitCount qui augmente vite
        correct: true
      - text: Une latence élevée alors que la base est peu chargée
        correct: true
      - text: Des erreurs « too many clients » côté base
        correct: false
      - text: Une mémoire du service qui baisse
        correct: false
    answer: « too many clients » signale au contraire trop de connexions.
  - key: qcm-lifetime
    format: multiple-choice
    question: "Pourquoi fixer `ConnMaxLifetime` devant une base qui peut basculer vers une réplique ?"
    choices:
      - {text: "Pour que les connexions suivent un basculement vers la nouvelle base primaire", correct: true}
      - {text: "Pour accélérer chaque requête, servie par une connexion toujours neuve", correct: false}
      - {text: "Pour borner la durée des requêtes lancées sur l'ancienne base primaire", correct: false}
      - {text: "Pour éviter l'injection SQL, en renouvelant les requêtes préparées", correct: false}
    answer: "Une connexion très ancienne reste attachée au serveur d'origine : en la renouvelant, le pool suit la bascule (et se répartit entre les instances derrière un répartiteur). Une requête se borne par son contexte."
  - key: bug-illimite
    format: bug-fix
    question: |-
      Lors d'un pic, le service ouvre 800 connexions et la base refuse tous les autres services. Quelle correction est la bonne ?
      ```go
      db, err := sql.Open("pgx", dsn)
      ```
    choices:
      - {text: "Borner le pool avec `SetMaxOpenConns(25)`, et régler `MaxIdleConns` et les durées", correct: true}
      - {text: "Appeler `db.Close()` après chaque requête, pour rendre la connexion à la base", correct: false}
      - {text: "Ouvrir un `sql.DB` par requête, pour que chacune n'ait qu'une seule connexion", correct: false}
      - {text: "Relever la limite de connexions de la base à 1 000, pour absorber les pics", correct: false}
    answer: "```go\ndb, err := sql.Open(\"pgx\", dsn)\nif err != nil {\n\treturn err\n}\ndb.SetMaxOpenConns(25)\ndb.SetMaxIdleConns(25)\ndb.SetConnMaxLifetime(30 * time.Minute)\ndb.SetConnMaxIdleTime(5 * time.Minute)\n```\nSans plafond, le pool ouvrait autant de connexions que de requêtes simultanées ; au-delà de 25, les requêtes\nattendent désormais une connexion libre."
  - key: bug-idle
    format: bug-fix
    question: |-
      Les métriques de la base montrent des centaines d'ouvertures de connexion par seconde, pour un trafic stable. Quelle correction est la bonne ?
      ```go
      db.SetMaxOpenConns(40)
      ```
    choices:
      - {text: "Ajouter `db.SetMaxIdleConns(40)`, pour garder les connexions inactives", correct: true}
      - {text: "Baisser `SetMaxOpenConns` à 2, pour limiter le nombre d'ouvertures", correct: false}
      - {text: "Ajouter `db.SetConnMaxLifetime(time.Second)`, pour les recycler", correct: false}
      - {text: "Appeler `db.PingContext` avant chaque requête, pour tenir la connexion", correct: false}
    answer: |-
      ```go
      db.SetMaxOpenConns(40)
      db.SetMaxIdleConns(40)
      ```
      Avec MaxIdleConns à 2 par défaut, 38 connexions étaient fermées après chaque requête, puis rouvertes.
  - key: bug-attente-sans-fin
    format: bug-fix
    question: |-
      Quand la base ralentit, les requêtes HTTP attendent indéfiniment une connexion du pool. Quelle correction est la bonne ?
      ```go
      rows, err := s.db.QueryContext(context.Background(), q)
      ```
    choices:
      - {text: "Un contexte dérivé de `r.Context()` avec un délai, passé à `QueryContext`", correct: true}
      - {text: "Remplacer `QueryContext` par `Query`, qui n'attend pas de connexion libre", correct: false}
      - {text: "Retirer toute limite à `SetMaxOpenConns`, pour ne jamais attendre", correct: false}
      - {text: "Ajouter `defer rows.Close()`, qui borne l'attente d'une connexion libre", correct: false}
    answer: |-
      ```go
      ctx, cancel := context.WithTimeout(r.Context(), 2*time.Second)
      defer cancel()
      rows, err := s.db.QueryContext(ctx, q)
      ```
      L'attente d'une connexion libre respecte le contexte : avec un délai, la requête échoue vite au lieu de s'empiler.
  - key: bug-fuite-tx
    format: bug-fix
    question: |-
      Le pool se vide peu à peu, et `db.Stats()` montre des connexions « InUse » qui ne reviennent jamais. Quelle correction est la bonne ?
      ```go
      tx, err := db.BeginTx(ctx, nil)
      if err != nil {
      	return err
      }
      if err := debiter(ctx, tx, compte, montant); err != nil {
      	return err
      }
      return tx.Commit()
      ```
    choices:
      - {text: "Ajouter `defer tx.Rollback()` juste après la vérification de l'erreur de `BeginTx`", correct: true}
      - {text: "Remplacer `return tx.Commit()` par `defer tx.Commit()` juste après `BeginTx`", correct: false}
      - {text: "Appeler `db.SetConnMaxIdleTime`, pour récupérer les connexions oubliées", correct: false}
      - {text: "Passer `context.Background()` à `BeginTx`, au lieu du contexte de la requête", correct: false}
    answer: "```go\ntx, err := db.BeginTx(ctx, nil)\nif err != nil {\n\treturn err\n}\ndefer tx.Rollback() // sans effet après un Commit réussi\nif err := debiter(ctx, tx, compte, montant); err != nil {\n\treturn err\n}\nreturn tx.Commit()\n```\nEn cas d'erreur, la transaction n'était ni validée ni annulée : sa connexion restait prise."
  - key: scenario-dimensionnement
    format: scenario
    question: Comment dimensionnes-tu le pool de connexions d'un service ?
    choices:
      - {text: "(limite de la base − marge) / nombre d'instances au maximum, puis surveiller `WaitCount`", correct: true}
      - {text: "La limite de la base sur chaque instance, pour ne jamais faire attendre une requête", correct: false}
      - {text: "Une connexion par goroutine du service, pour que chacune ait la sienne", correct: false}
      - {text: "Illimité, la valeur par défaut, puisque la base refusera de toute façon l'excès", correct: false}
    answer: "Je pars de la limite de la base et du nombre d'instances au maximum de l'autoscaling, avec une marge : MaxOpenConns = (limite − marge) / instances, et MaxIdleConns à la même valeur. Puis je surveille `WaitCount` et `WaitDuration` ; au-delà, un PgBouncer mutualise les connexions."
  - key: scenario-pgbouncer
    format: scenario
    question: Quand mettrais-tu un PgBouncer devant PostgreSQL ?
    choices:
      - {text: "Quand le total des connexions voulues par toutes les instances dépasse ce que la base supporte", correct: true}
      - {text: "Dès qu'un service a besoin de plus de 10 connexions, la limite fixée par `database/sql`", correct: false}
      - {text: "Pour chiffrer les connexions, ce que PostgreSQL ne sait pas faire seul", correct: false}
      - {text: "Pour garder en cache le résultat des requêtes de lecture les plus fréquentes", correct: false}
    answer: "Quand le nombre total de connexions (instances, services, serverless) dépasse ce que la base supporte : chaque connexion PostgreSQL est un processus coûteux. En mode transaction, PgBouncer partage quelques connexions réelles, mais ne garde pas l'état de session (requêtes préparées nommées, SET)."
  - key: scenario-metriques
    format: scenario
    question: Comment surveilles-tu le pool en production ?
    choices:
      - {text: "J'exporte `db.Stats()` en métriques, avec des alertes sur l'attente d'une connexion", correct: true}
      - {text: "Je lis les journaux du service à la recherche de requêtes lentes, sans métrique", correct: false}
      - {text: "Je compte les goroutines du service, qui reflètent les connexions ouvertes", correct: false}
      - {text: "Je surveille seulement le processeur de la base, signe direct d'un pool saturé", correct: false}
    answer: "J'exporte `db.Stats()` en métriques (connexions ouvertes, en usage, inactives, `WaitCount`, `WaitDuration`), avec des alertes sur l'attente et sur un pool constamment plein. Un pool plein avec une base peu chargée signale souvent des connexions retenues."
