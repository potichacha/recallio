notion: transactions-sql
lesson: "Une **transaction** regroupe plusieurs requêtes qui réussissent ou échouent **ensemble**. En Go :\n\n```go\nfunc (d *Depot) Virer(ctx context.Context, de, vers string, montant int64) (err error) {\n\ttx, err := d.db.BeginTx(ctx, nil)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer tx.Rollback() // annule si l'on sort avant Commit ; sans effet (ErrTxDone) après\n\n\tif _, err := tx.ExecContext(ctx,\n\t\t\"UPDATE comptes SET solde = solde - $1 WHERE id = $2 AND solde >= $1\", montant, de); err != nil {\n\t\treturn err\n\t}\n\tif _, err := tx.ExecContext(ctx,\n\t\t\"UPDATE comptes SET solde = solde + $1 WHERE id = $2\", montant, vers); err != nil {\n\t\treturn err\n\t}\n\treturn tx.Commit()\n}\n```\n\nLes règles :\n- **`defer tx.Rollback()`** juste après `BeginTx` : toute sortie anticipée (erreur, panique) annule la transaction et\n  rend la connexion ; après un `Commit` réussi, il ne fait rien ;\n- une transaction est **attachée à une connexion** : toutes ses requêtes passent par **`tx`**, jamais par `db` (qui\n  prendrait une autre connexion, hors transaction) ;\n- le **contexte** de `BeginTx` couvre toute la transaction : s'il est annulé, la transaction est annulée ;\n- **`sql.TxOptions`** fixe le niveau d'isolation (`sql.LevelSerializable`) et le mode lecture seule ;\n- une transaction doit être **courte** : pas d'appel réseau ni d'attente d'un utilisateur à l'intérieur, car elle\n  garde des verrous et une connexion ;\n- en isolation sérialisable, une transaction peut échouer pour un **conflit** (erreur de sérialisation) : on la\n  **rejoue** entièrement.\n\nPour que plusieurs dépôts travaillent dans la même transaction, on leur passe un type commun aux deux, une petite\ninterface (`ExecContext`, `QueryContext`, `QueryRowContext`) que `*sql.DB` et `*sql.Tx` satisfont.\n\n**En entretien** : « BeginTx, defer Rollback, Commit ; tout passe par tx ; une transaction courte, sans appel réseau ;\nTxOptions pour l'isolation ; rejouer les conflits de sérialisation. »"
cards:
  - key: idiome-garantir-rollback-transaction
    format: course
    question: "Quel idiome garantit le rollback d'une transaction en cas d'erreur ?"
    choices:
      - {text: "`defer tx.Rollback()` juste après `BeginTx`, sans effet après un `Commit` réussi", correct: true}
      - {text: "`defer tx.Commit()` juste après `BeginTx`, qui annule si une erreur survient", correct: false}
      - {text: "Un `tx.Rollback()` dans le dernier `if err != nil` de la fonction", correct: false}
      - {text: "Rien : la transaction est annulée seule quand la fonction se termine", correct: false}
    answer: "`defer tx.Rollback()` juste après la vérification de `BeginTx` couvre toutes les sorties ; après un `Commit` réussi, il ne fait rien (il renvoie `sql.ErrTxDone`). Un Commit différé validerait même en cas d'erreur."
  - key: appel-reseau-transaction
    format: course
    question: "Pourquoi ne pas faire d'appel réseau lent dans une transaction ?"
    choices:
      - {text: "La transaction garde une connexion et ses verrous pendant tout l'appel", correct: true}
      - {text: "Le pilote annule la transaction dès qu'un autre appel réseau commence", correct: false}
      - {text: "L'appel réseau est annulé si la transaction est validée avant sa fin", correct: false}
      - {text: "Go interdit tout appel réseau tant qu'une transaction est ouverte", correct: false}
    answer: "Pendant l'appel, la transaction monopolise une connexion du pool et garde ses verrous : les autres transactions attendent. On fait l'appel avant ou après, ou l'on passe par un motif outbox."
  - key: passer-transaction-plusieurs-repositories
    format: course
    question: "Comment faire passer une même transaction dans plusieurs dépôts ?"
    choices:
      - {text: "Une interface commune à `*sql.DB` et `*sql.Tx`, ou une unité de travail", correct: true}
      - {text: "Une variable globale `*sql.Tx`, que chaque dépôt lit au besoin", correct: false}
      - {text: "Un `BeginTx` dans chaque dépôt, que le pilote fusionne en une seule", correct: false}
      - {text: "La transaction rangée dans le contexte, que le pilote retrouve seul", correct: false}
    answer: "Les dépôts dépendent d'une interface commune à `*sql.DB` et `*sql.Tx` (ou d'une unité de travail) : l'appelant ouvre la transaction et la leur passe. Deux `BeginTx` font deux transactions distinctes."
  - key: interface
    format: course
    question: Comment écrire une fonction qui marche aussi bien avec un *sql.DB qu'avec un *sql.Tx ?
    choices:
      - {text: "La faire dépendre d'une petite interface avec `ExecContext`, `QueryContext` et `QueryRowContext`", correct: true}
      - {text: "Lui passer un `any`, puis un `switch` sur le type pour appeler la bonne méthode", correct: false}
      - {text: "Écrire deux versions de la fonction, l'une pour `*sql.DB`, l'autre pour `*sql.Tx`", correct: false}
      - {text: "Lui passer un `*sql.Conn`, dont `*sql.DB` et `*sql.Tx` sont des sous-types", correct: false}
    answer: "En la faisant dépendre d'une petite interface avec `ExecContext`, `QueryContext` et `QueryRowContext`, que les deux types satisfont implicitement ; l'appelant choisit d'exécuter dans une transaction ou non. Go n'a pas de sous-types : c'est l'interface qui les réunit."
  - key: vf-rollback-apres
    format: true-false
    question: Un `defer tx.Rollback()` annule une transaction déjà validée par Commit.
    truth: false
    answer: Après Commit, Rollback ne fait rien (il renvoie sql.ErrTxDone).
  - key: vf-db-dans-tx
    format: true-false
    question: Pendant une transaction, une requête faite avec db au lieu de tx s'exécute dans la transaction.
    truth: false
    answer: Elle prend une autre connexion du pool, hors transaction.
  - key: vf-contexte
    format: true-false
    question: Si le contexte passé à BeginTx est annulé, la transaction est annulée.
    truth: true
    answer: Le pilote la rollback, et Commit échouera.
  - key: vf-reseau
    format: true-false
    question: On peut sans risque appeler un service externe lent au milieu d'une transaction.
    truth: false
    answer: La transaction garde verrous et connexion pendant tout l'appel.
  - key: qcm-idiome
    format: multiple-choice
    question: "Quel enchaînement est le bon pour une transaction ?"
    choices:
      - {text: "`BeginTx`, vérifier l'erreur, `defer tx.Rollback()`, les requêtes avec `tx`, puis `return tx.Commit()`", correct: true}
      - {text: "`BeginTx`, `defer tx.Commit()`, puis les requêtes avec `tx`, et un `Rollback` en cas d'erreur", correct: false}
      - {text: "`BeginTx`, les requêtes avec `tx`, puis `tx.Rollback()` seulement dans le dernier `if err != nil`", correct: false}
      - {text: "`BeginTx`, les requêtes avec `db`, puis `return tx.Commit()` pour tout valider ensemble", correct: false}
    answer: "Le `defer tx.Rollback()` couvre toutes les sorties en erreur et ne fait rien après un Commit réussi ; toutes les requêtes passent par `tx`. Un Commit différé validerait même en cas d'erreur."
  - key: qcm-options
    format: multiple-choice
    question: "Lesquelles de ces possibilités `sql.TxOptions` offre-t-il ?"
    choices:
      - text: Choisir le niveau d'isolation, par exemple sql.LevelSerializable
        correct: true
      - text: Ouvrir une transaction en lecture seule
        correct: true
      - text: Fixer le délai de la transaction
        correct: false
      - text: Choisir la base de données
        correct: false
    answer: Le délai passe par le contexte.
  - key: qcm-courte
    format: multiple-choice
    question: Pourquoi garder les transactions courtes ?
    choices:
      - {text: "Elles gardent des verrous et une connexion du pool tant qu'elles durent", correct: true}
      - {text: "Le pilote annule toute transaction ouverte depuis plus d'une seconde", correct: false}
      - {text: "Go limite à dix le nombre de requêtes d'une même transaction", correct: false}
      - {text: "Une transaction longue est validée seule, à la fin de son contexte", correct: false}
    answer: "Une transaction longue garde ses verrous, qui bloquent les autres transactions, et occupe une connexion du pool : contention et pool vidé. Ni le pilote ni Go ne lui imposent de limite."
  - key: qcm-serialisation
    format: multiple-choice
    question: Une transaction sérialisable échoue avec une erreur de sérialisation. Que faire ?
    choices:
      - {text: "Rejouer toute la transaction depuis le début, un nombre limité de fois", correct: true}
      - {text: "Rejouer seulement la dernière requête, celle qui a échoué", correct: false}
      - {text: "Passer la transaction en lecture seule, puis la relancer", correct: false}
      - {text: "Ignorer l'erreur : la base a déjà validé ce qui pouvait l'être", correct: false}
    answer: "L'état lu au début a pu changer : toute la transaction est à refaire, avec un nombre limité de tentatives. Rejouer la dernière requête garderait des lectures périmées."
  - key: trous-begin
    format: fill-in
    question: |-
      Complète :
      ```go
      tx, err := db.___(ctx, nil)
      if err != nil {
      	return err
      }
      defer tx.___()
      ```
    blanks:
      - - BeginTx
      - - Rollback
    answer: BeginTx puis defer Rollback.
  - key: trous-commit
    format: fill-in
    question: |-
      Complète la fin :
      ```go
      if _, err := tx.ExecContext(ctx, q2, id); err != nil {
      	return err
      }
      return tx.___()
      ```
    blanks:
      - - Commit
    answer: Commit valide la transaction.
  - key: trous-isolation
    format: fill-in
    question: |-
      Complète pour une transaction sérialisable :
      ```go
      tx, err := db.BeginTx(ctx, &sql.TxOptions{Isolation: sql.___})
      ```
    blanks:
      - - LevelSerializable
    answer: sql.LevelSerializable.
  - key: trous-tx
    format: fill-in
    question: |-
      Complète pour exécuter dans la transaction :
      ```go
      _, err = ___.ExecContext(ctx, "INSERT INTO lignes ...", id)
      ```
    blanks:
      - - tx
    answer: Toutes les requêtes passent par tx.
  - key: bug-rollback
    format: bug-fix
    question: |-
      Après une erreur de stock, la connexion reste bloquée et des verrous persistent. Quelle correction est la bonne ?
      ```go
      tx, _ := db.BeginTx(ctx, nil)
      if err := reserver(ctx, tx, produit); err != nil {
      	return err
      }
      if err := facturer(ctx, tx, commande); err != nil {
      	tx.Rollback()
      	return err
      }
      return tx.Commit()
      ```
    choices:
      - {text: "Vérifier l'erreur de `BeginTx`, puis `defer tx.Rollback()` juste après", correct: true}
      - {text: "Retirer le `tx.Rollback()` du second `if` : `return err` annule déjà", correct: false}
      - {text: "Remplacer `return tx.Commit()` par `defer tx.Commit()` en début de fonction", correct: false}
      - {text: "Passer `context.Background()` à `BeginTx`, pour ne plus dépendre de la requête", correct: false}
    answer: "```go\ntx, err := db.BeginTx(ctx, nil)\nif err != nil {\n\treturn err\n}\ndefer tx.Rollback()\nif err := reserver(ctx, tx, produit); err != nil {\n\treturn err\n}\nif err := facturer(ctx, tx, commande); err != nil {\n\treturn err\n}\nreturn tx.Commit()\n```\nLe premier retour en erreur oubliait le Rollback ; le defer couvre toutes les sorties (et l'erreur de BeginTx\nn'était pas vérifiée)."
  - key: bug-db
    format: bug-fix
    question: |-
      Une commande est parfois enregistrée sans ses lignes après une erreur. Pourquoi ?
      ```go
      tx, err := db.BeginTx(ctx, nil)
      if err != nil {
      	return err
      }
      defer tx.Rollback()
      if _, err := db.ExecContext(ctx, "INSERT INTO commandes ...", c.ID); err != nil {
      	return err
      }
      if _, err := tx.ExecContext(ctx, "INSERT INTO lignes ...", c.ID); err != nil {
      	return err
      }
      return tx.Commit()
      ```
    choices:
      - {text: "Le premier `INSERT` passe par `db`, hors transaction : le Rollback ne l'annule pas", correct: true}
      - {text: "`defer tx.Rollback()` annule aussi le `Commit`, et les lignes sont perdues", correct: false}
      - {text: "Le second `INSERT` passe par `tx`, qui n'est validé qu'à la fin de la fonction", correct: false}
      - {text: "`BeginTx` sans options ouvre une transaction en lecture seule, qui refuse les lignes", correct: false}
    answer: "```go\nif _, err := tx.ExecContext(ctx, \"INSERT INTO commandes ...\", c.ID); err != nil {\n\treturn err\n}\nif _, err := tx.ExecContext(ctx, \"INSERT INTO lignes ...\", c.ID); err != nil {\n\treturn err\n}\nreturn tx.Commit()\n```\nLe premier INSERT passait par db, hors transaction : il restait validé même après le Rollback."
  - key: bug-appel-reseau
    format: bug-fix
    question: |-
      Les virements se bloquent mutuellement quand la banque partenaire est lente. Quelle correction est la bonne ?
      ```go
      tx, _ := db.BeginTx(ctx, nil)
      defer tx.Rollback()
      debiter(ctx, tx, compte, montant)
      if err := banque.Valider(ctx, virement); err != nil { // 2 à 10 secondes
      	return err
      }
      crediter(ctx, tx, dest, montant)
      return tx.Commit()
      ```
    choices:
      - {text: "Valider auprès de la banque avant d'ouvrir la transaction, puis débiter et créditer", correct: true}
      - {text: "Passer la transaction au niveau `sql.LevelSerializable`, pour éviter les blocages", correct: false}
      - {text: "Lancer `banque.Valider` dans une goroutine, sans attendre sa réponse", correct: false}
      - {text: "Augmenter `SetMaxOpenConns`, pour que chaque virement ait sa connexion", correct: false}
    answer: "```go\nif err := banque.Valider(ctx, virement); err != nil { // hors transaction, avant\n\treturn err\n}\ntx, err := db.BeginTx(ctx, nil)\nif err != nil {\n\treturn err\n}\ndefer tx.Rollback()\nif err := debiter(ctx, tx, compte, montant); err != nil {\n\treturn err\n}\nif err := crediter(ctx, tx, dest, montant); err != nil {\n\treturn err\n}\nreturn tx.Commit()\n```\nL'appel lent gardait les verrous du compte pendant des secondes ; on le sort de la transaction (et l'on traite les\nerreurs de debiter et crediter, ignorées jusque-là). Si l'appel doit suivre l'écriture, un motif outbox convient."
  - key: bug-commit-ignore
    format: bug-fix
    question: |-
      Des commandes sont annoncées comme créées alors qu'elles n'existent pas en base. Quelle correction est la bonne ?
      ```go
      tx.Commit()
      return nil
      ```
    choices:
      - {text: "Vérifier l'erreur de `tx.Commit()` et la remonter à l'appelant", correct: true}
      - {text: "Appeler `tx.Commit()` deux fois, pour s'assurer qu'il passe", correct: false}
      - {text: "Remplacer `tx.Commit()` par `defer tx.Commit()` en début de fonction", correct: false}
      - {text: "Ajouter `defer tx.Rollback()` après le `Commit`, pour tout annuler", correct: false}
    answer: "```go\nif err := tx.Commit(); err != nil {\n\treturn fmt.Errorf(\"validation de la commande : %w\", err)\n}\nreturn nil\n```\nCommit peut échouer (conflit, contexte annulé, connexion perdue) : son erreur doit être remontée."
  - key: scenario-plusieurs-depots
    format: scenario
    question: Une création de commande doit écrire dans les dépôts commandes et stock en une seule transaction. Comment l'organises-tu ?
    choices:
      - {text: "Des dépôts sur une interface `Executeur`, construits avec le `*sql.Tx` qu'ouvre le service", correct: true}
      - {text: "Chaque dépôt ouvre sa propre transaction, et le service les valide l'une après l'autre", correct: false}
      - {text: "Le dépôt commandes appelle lui-même le dépôt stock, qui ouvre et valide la transaction", correct: false}
      - {text: "Deux transactions séparées, validées ensemble à la fin grâce à un `sync.WaitGroup`", correct: false}
    answer: "Les dépôts dépendent d'une interface `Executeur` (`ExecContext`, `QueryContext`, `QueryRowContext`). Le service ouvre la transaction, construit les dépôts avec le `*sql.Tx`, les appelle puis valide ; une fonction `dansTransaction(ctx, db, func(tx Executeur) error)` peut gérer BeginTx, Rollback et Commit. Deux transactions séparées ne sont jamais atomiques ensemble."
  - key: scenario-isolation
    format: scenario
    question: Deux réservations simultanées prennent la dernière place d'un vol. Comment l'éviter ?
    choices:
      - {text: "Un `UPDATE ... SET places = places - 1 WHERE id = $1 AND places > 0`, puis vérifier `RowsAffected`", correct: true}
      - {text: "Un `SELECT places` pour vérifier qu'il en reste, puis un `UPDATE`, dans une transaction par défaut", correct: false}
      - {text: "Un `sync.Mutex` dans le service, autour de la lecture et de l'écriture des places", correct: false}
      - {text: "Une vérification dans le navigateur, qui grise le bouton quand il ne reste plus de place", correct: false}
    answer: "L'UPDATE conditionnel est atomique : une seule des deux réservations touche une ligne, l'autre voit `RowsAffected` à 0. Un SELECT puis un UPDATE, au niveau d'isolation par défaut, laisse une course ; un mutex ne protège qu'une instance. Une contrainte `CHECK (places >= 0)` sert de filet ; `SELECT ... FOR UPDATE` ou une transaction sérialisable marchent aussi."
  - key: scenario-outbox
    format: scenario
    question: Après avoir enregistré une commande, il faut publier un événement dans Kafka. Comment garantir qu'aucun des deux ne manque ?
    choices:
      - {text: "Le motif outbox : l'événement inséré dans une table, dans la transaction de la commande", correct: true}
      - {text: "Publier dans Kafka avant le `Commit`, et annuler la transaction si Kafka échoue", correct: false}
      - {text: "Publier dans Kafka après le `Commit`, dans une goroutine qui réessaie sans fin", correct: false}
      - {text: "Une transaction distribuée englobant PostgreSQL et Kafka, validée en deux phases", correct: false}
    answer: "Le motif outbox : l'événement est inséré dans une table `outbox`, dans la même transaction que la commande ; une tâche séparée la lit, publie dans Kafka et marque les envois. Publier avant le Commit peut annoncer une commande jamais validée ; après, une panne perd l'événement. Les consommateurs doivent être idempotents."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande d'écrire un virement entre deux comptes en Go. Quelle approche décris-tu ?"
    choices:
      - {text: "`BeginTx`, `defer Rollback`, débit conditionnel vérifié par `RowsAffected`, crédit, puis `Commit` vérifié", correct: true}
      - {text: "Un `SELECT` des deux soldes, le calcul en Go, puis deux `UPDATE` lancés hors transaction", correct: false}
      - {text: "Deux transactions, l'une pour le débit, l'autre pour le crédit, validées l'une après l'autre", correct: false}
      - {text: "`BeginTx`, le débit et le crédit, puis `defer tx.Commit()` pour valider quoi qu'il arrive", correct: false}
    answer: "BeginTx avec le contexte, `defer tx.Rollback()`, un débit conditionnel (`UPDATE ... SET solde = solde - $1 WHERE id = $2 AND solde >= $1`) dont `RowsAffected` à 0 signale des fonds insuffisants, un crédit, et un Commit dont on vérifie l'erreur. On verrouille les comptes dans un ordre fixe contre les interblocages, et une clé d'idempotence évite un double virement."
