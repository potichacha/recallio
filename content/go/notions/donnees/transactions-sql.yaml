notion: transactions-sql
cards:
  - key: idiome-garantir-rollback-transaction
    format: course
    question: Quel idiome pour garantir le rollback d'une transaction ?
    answer: defer tx.Rollback() juste après BeginTx (sans effet après Commit), ou rollback conditionnel sur erreur.
  - key: appel-reseau-transaction
    format: course
    question: Pourquoi ne pas faire d'appel réseau dans une transaction ?
    answer: Elle monopolise une connexion et des verrous pendant tout ce temps.
  - key: passer-transaction-plusieurs-repositories
    format: course
    question: Comment faire passer une transaction dans plusieurs repositories ?
    answer: Une interface commune à *sql.DB et *sql.Tx, ou un objet unit of work.
