notion: database-sql-bases
cards:
  - key: db-query-vs-db-querycontext
    format: course
    question: db.Query vs db.QueryContext ?
    answer: La seconde est annulable par le contexte.
  - key: sql-db
    format: course
    question: Qu'est-ce qu'un *sql.DB ?
    answer: Un pool de connexions sûr en concurrence, à créer une fois et partager.
  - key: sql-open-connecte-base
    format: course
    question: sql.Open se connecte-t-il à la base ?
    answer: Non, il valide les arguments ; Ping teste la connexion.
  - key: passe-si-oublie-rows-close
    format: course
    question: Que se passe-t-il si on oublie rows.Close() ?
    answer: La connexion reste empruntée, et le pool finit par s'épuiser.
  - key: verifier-rows-err
    format: course
    question: Pourquoi vérifier rows.Err() ?
    answer: Pour détecter une erreur survenue pendant l'itération, que Next masque en renvoyant false.
  - key: renvoie-queryrow-sans-resultat
    format: course
    question: Que renvoie QueryRow sans résultat ?
    answer: sql.ErrNoRows au moment du Scan.
  - key: utiliser-methodes-context
    format: course
    question: Pourquoi utiliser les méthodes Context ?
    answer: Pour annuler les requêtes sur timeout ou déconnexion du client.
