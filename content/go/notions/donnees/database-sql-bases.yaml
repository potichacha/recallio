notion: database-sql-bases
lesson: "Le package **`database/sql`** fournit une interface commune aux bases de données ; un **pilote** (driver) l'implémente\npour chaque base (`github.com/jackc/pgx/v5/stdlib` pour PostgreSQL, `modernc.org/sqlite`...).\n\n```go\ndb, err := sql.Open(\"pgx\", os.Getenv(\"DATABASE_URL\")) // ne se connecte pas encore\nif err != nil {\n\treturn err\n}\ndefer db.Close()\nif err := db.PingContext(ctx); err != nil { // vérifie vraiment la connexion\n\treturn err\n}\n```\n\nUn **`*sql.DB`** n'est pas une connexion mais un **pool** de connexions, sûr entre goroutines : on l'ouvre **une fois**\nau démarrage et on le partage.\n\nLes trois façons d'interroger :\n\n```go\n// une ligne\nvar nom string\nerr := db.QueryRowContext(ctx, \"SELECT nom FROM clients WHERE id = $1\", id).Scan(&nom)\nif errors.Is(err, sql.ErrNoRows) { /* introuvable */ }\n\n// plusieurs lignes\nrows, err := db.QueryContext(ctx, \"SELECT id, nom FROM clients WHERE ville = $1\", ville)\nif err != nil {\n\treturn nil, err\n}\ndefer rows.Close()                // rend la connexion au pool\nfor rows.Next() {\n\tvar c Client\n\tif err := rows.Scan(&c.ID, &c.Nom); err != nil {\n\t\treturn nil, err\n\t}\n\tclients = append(clients, c)\n}\nif err := rows.Err(); err != nil { // une erreur pendant le parcours\n\treturn nil, err\n}\n\n// sans résultat\nres, err := db.ExecContext(ctx, \"UPDATE clients SET nom = $1 WHERE id = $2\", nom, id)\nn, _ := res.RowsAffected()\n```\n\nLes règles :\n- toujours les variantes **`...Context`**, pour que l'annulation de la requête arrête la requête SQL ;\n- **`defer rows.Close()`** juste après l'erreur, et **`rows.Err()`** après la boucle ;\n- `QueryRow` sans résultat renvoie **`sql.ErrNoRows`** au moment du `Scan` ;\n- des paramètres (`$1`, ou `?` selon le pilote), jamais de concaténation ;\n- le nombre et l'ordre des destinations de `Scan` doivent correspondre aux colonnes.\n\n**En entretien** : « sql.DB est un pool partagé ; QueryRowContext, QueryContext, ExecContext ; defer rows.Close et\nrows.Err ; sql.ErrNoRows ; paramètres plutôt que concaténation. »"
cards:
  - key: db-query-vs-db-querycontext
    format: course
    question: "Quelle différence y a-t-il entre `db.Query` et `db.QueryContext` ?"
    choices:
      - {text: "`QueryContext` reçoit un contexte, qui peut annuler la requête ou lui fixer un délai", correct: true}
      - {text: "`QueryContext` renvoie une seule ligne, alors que `Query` renvoie un ensemble de lignes", correct: false}
      - {text: "`QueryContext` exécute la requête dans une transaction ouverte pour l'occasion", correct: false}
      - {text: "`QueryContext` garde la requête préparée en cache pour les appels suivants", correct: false}
    answer: "`QueryContext` prend un `context.Context` : la requête s'arrête quand le contexte est annulé ou que son délai expire. `Query` revient à `QueryContext(context.Background(), ...)`, donc sans annulation possible."
  - key: sql-db
    format: course
    question: "Qu'est-ce qu'un `*sql.DB` ?"
    choices:
      - {text: "Un pool de connexions sûr en concurrence, à ouvrir une fois et à partager", correct: true}
      - {text: "Une connexion unique à la base, à ouvrir et à fermer pour chaque requête", correct: false}
      - {text: "Une connexion par goroutine, qu'il faut protéger par un `sync.Mutex`", correct: false}
      - {text: "Une transaction ouverte sur la base, validée à l'appel de `Close`", correct: false}
    answer: "Un pool de connexions, sûr en concurrence : on l'ouvre une fois au démarrage et on le partage. L'ouvrir pour chaque requête recrée un pool à chaque fois et épuise les connexions de la base."
  - key: sql-open-connecte-base
    format: course
    question: "`sql.Open` se connecte-t-il à la base ?"
    choices:
      - {text: "Non : il valide ses arguments et prépare le pool ; `PingContext` teste la connexion", correct: true}
      - {text: "Oui : il ouvre une première connexion et échoue si la base ne répond pas", correct: false}
      - {text: "Oui : il ouvre toutes les connexions du pool dès l'appel, jusqu'au maximum", correct: false}
      - {text: "Non : il faut appeler `db.Connect()` avant de lancer la première requête", correct: false}
    answer: "Non : `sql.Open` valide ses arguments et prépare le pool, sans forcément se connecter. Pour savoir au démarrage si la base répond, on appelle `db.PingContext`."
  - key: passe-si-oublie-rows-close
    format: course
    question: "Que se passe-t-il si on oublie `rows.Close()` après un `QueryContext` ?"
    choices:
      - {text: "La connexion reste empruntée, et le pool finit par s'épuiser", correct: true}
      - {text: "Rien : le ramasse-miettes ferme les lignes à la fin de la fonction", correct: false}
      - {text: "La requête est annulée, et ses lignes déjà lues sont perdues", correct: false}
      - {text: "Une transaction implicite reste ouverte et garde ses verrous", correct: false}
    answer: "Tant que les `rows` ne sont pas fermées, leur connexion reste empruntée : sur un retour anticipé, elle n'est jamais rendue et le pool s'épuise. Le ramasse-miettes ne la rend pas à temps ; `defer rows.Close()` règle la question."
  - key: verifier-rows-err
    format: course
    question: "Pourquoi vérifier `rows.Err()` après une boucle `for rows.Next()` ?"
    choices:
      - {text: "Pour détecter une erreur survenue pendant le parcours, que `Next` cache en renvoyant `false`", correct: true}
      - {text: "Pour savoir si la requête n'a renvoyé aucune ligne, ce que `Next` ne dit pas", correct: false}
      - {text: "Pour fermer les lignes et rendre la connexion au pool à la fin de la boucle", correct: false}
      - {text: "Pour récupérer l'erreur du dernier `Scan`, que la boucle ne remonte pas", correct: false}
    answer: "`Next` renvoie `false` en fin de résultats comme en cas d'erreur (connexion coupée, contexte annulé) : seul `rows.Err()` les distingue. Sans lui, un résultat tronqué passe pour complet."
  - key: renvoie-queryrow-sans-resultat
    format: course
    question: "Que renvoie `QueryRowContext` quand la requête ne trouve aucune ligne ?"
    choices:
      - {text: "L'erreur `sql.ErrNoRows`, au moment du `Scan`", correct: true}
      - {text: "L'erreur `sql.ErrNoRows`, dès l'appel de `QueryRowContext`", correct: false}
      - {text: "Un `*sql.Row` nil, qui panique au moment du `Scan`", correct: false}
      - {text: "Aucune erreur : les variables gardent leur valeur zéro", correct: false}
    answer: "`QueryRowContext` ne renvoie pas d'erreur lui-même : l'erreur, dont `sql.ErrNoRows`, est différée jusqu'au `Scan`. On la teste avec `errors.Is(err, sql.ErrNoRows)`."
  - key: utiliser-methodes-context
    format: course
    question: "Pourquoi utiliser les méthodes `...Context` de `database/sql`, comme `ExecContext` ?"
    choices:
      - {text: "Pour annuler la requête SQL sur un délai dépassé ou quand le client se déconnecte", correct: true}
      - {text: "Pour exécuter chaque requête dans une transaction propre à son contexte", correct: false}
      - {text: "Pour passer les paramètres de la requête par le contexte, à l'abri de l'injection", correct: false}
      - {text: "Pour garder le résultat de la requête en cache pendant la vie du contexte", correct: false}
    answer: "Le contexte porte l'annulation et l'échéance : quand le client HTTP part ou que le délai expire, le pilote annule la requête SQL. Sans lui, une requête lente continue de tourner pour personne."
  - key: vf-pool
    format: true-false
    question: Un *sql.DB représente une seule connexion à la base.
    truth: false
    answer: C'est un pool de connexions, sûr entre goroutines.
  - key: vf-open
    format: true-false
    question: '`sql.Open` vérifie que la base est joignable.'
    truth: false
    answer: Il ne se connecte pas ; PingContext le vérifie.
  - key: vf-errnorows
    format: true-false
    question: '`QueryRowContext(...).Scan(...)` renvoie sql.ErrNoRows si aucune ligne ne correspond.'
    truth: true
    answer: L'erreur arrive au Scan.
  - key: vf-rows-close
    format: true-false
    question: Oublier rows.Close() peut épuiser le pool de connexions.
    truth: true
    answer: La connexion reste occupée tant que les lignes ne sont pas fermées ou entièrement lues.
  - key: qcm-methodes
    format: multiple-choice
    question: "Pour un INSERT qui ne renvoie aucune ligne, quelle méthode de `*sql.DB` appelles-tu ?"
    choices:
      - {text: "`ExecContext`, qui renvoie le nombre de lignes touchées", correct: true}
      - {text: "`QueryContext`, qui renvoie des `*sql.Rows` à parcourir", correct: false}
      - {text: "`QueryRowContext`, qui renvoie une seule `*sql.Row`", correct: false}
      - {text: "`BeginTx`, obligatoire avant toute écriture en base", correct: false}
    answer: "`ExecContext` exécute une requête sans résultat et renvoie un `sql.Result` (lignes touchées et, selon le pilote, dernier identifiant). `QueryRowContext` sert à lire une ligne, `QueryContext` plusieurs."
  - key: qcm-boucle
    format: multiple-choice
    question: "Lequel de ces gestes est une erreur autour d'un parcours de `rows`, dans une fonction de dépôt ?"
    choices:
      - {text: "Appeler `db.Close()` à la fin de la fonction", correct: true}
      - {text: "`defer rows.Close()` après avoir vérifié l'erreur de `QueryContext`", correct: false}
      - {text: "Vérifier `rows.Err()` après la boucle `for rows.Next()`", correct: false}
      - {text: "Vérifier l'erreur de chaque `Scan`", correct: false}
    answer: "Le pool `*sql.DB` reste ouvert toute la vie du programme : le fermer dans un dépôt casse toutes les requêtes suivantes. Les trois autres gestes sont, eux, indispensables."
  - key: qcm-partage
    format: multiple-choice
    question: "Lesquelles de ces pratiques sont justes pour gérer le `*sql.DB` d'un service ?"
    choices:
      - text: L'ouvrir une fois au démarrage et le passer aux dépôts
        correct: true
      - text: Le fermer à l'arrêt du service
        correct: true
      - text: L'ouvrir et le fermer à chaque requête HTTP
        correct: false
      - text: En créer un par goroutine
        correct: false
    answer: Rouvrir le pool à chaque requête supprime toute réutilisation des connexions.
  - key: qcm-context
    format: multiple-choice
    question: "Pourquoi utiliser `QueryContext` plutôt que `Query` dans un handler HTTP ?"
    choices:
      - {text: "La requête SQL s'arrête quand le contexte de la requête HTTP est annulé", correct: true}
      - {text: "Elle est plus rapide, car le pilote réutilise la requête déjà préparée", correct: false}
      - {text: "Elle évite l'injection SQL, car le contexte échappe chaque paramètre", correct: false}
      - {text: "Elle ouvre une transaction, annulée si le handler renvoie une erreur", correct: false}
    answer: "Le contexte de la requête HTTP est annulé quand le client part ou que l'échéance expire, et le pilote arrête alors la requête SQL. Ni vitesse ni sécurité : ce sont les paramètres qui évitent l'injection."
  - key: trous-queryrow
    format: fill-in
    question: |-
      Complète :
      ```go
      err := db.___(ctx, "SELECT email FROM clients WHERE id = $1", id).Scan(&email)
      ```
    blanks:
      - - QueryRowContext
    answer: QueryRowContext pour une ligne.
  - key: trous-errnorows
    format: fill-in
    question: |-
      Complète pour un client introuvable :
      ```go
      if errors.Is(err, sql.___) {
      	return Client{}, ErrIntrouvable
      }
      ```
    blanks:
      - - ErrNoRows
    answer: sql.ErrNoRows.
  - key: trous-close
    format: fill-in
    question: |-
      Complète :
      ```go
      rows, err := db.QueryContext(ctx, q, ville)
      if err != nil {
      	return nil, err
      }
      ___ rows.Close()
      ```
    blanks:
      - - defer
    answer: defer rows.Close().
  - key: trous-err
    format: fill-in
    question: |-
      Complète après la boucle :
      ```go
      for rows.Next() {
      	// ...
      }
      if err := rows.___(); err != nil {
      	return nil, err
      }
      ```
    blanks:
      - - Err
    answer: rows.Err().
  - key: bug-close
    format: bug-fix
    question: |-
      Sous charge, toutes les requêtes finissent par attendre une connexion libre. Quelle correction est la bonne ?
      ```go
      rows, err := db.QueryContext(ctx, "SELECT id FROM commandes WHERE client = $1", c)
      if err != nil {
      	return nil, err
      }
      for rows.Next() {
      	var id string
      	if err := rows.Scan(&id); err != nil {
      		return nil, err
      	}
      	ids = append(ids, id)
      }
      return ids, nil
      ```
    choices:
      - {text: "Ajouter `defer rows.Close()` après la vérification de l'erreur, et renvoyer `rows.Err()`", correct: true}
      - {text: "Augmenter `SetMaxOpenConns`, pour que le pool ait assez de connexions sous charge", correct: false}
      - {text: "Appeler `rows.Close()` juste après la boucle, avant le `return ids, nil` final", correct: false}
      - {text: "Remplacer `QueryContext` par `QueryRowContext`, qui ne garde pas la connexion", correct: false}
    answer: "```go\nrows, err := db.QueryContext(ctx, \"SELECT id FROM commandes WHERE client = $1\", c)\nif err != nil {\n\treturn nil, err\n}\ndefer rows.Close()\nfor rows.Next() {\n\tvar id string\n\tif err := rows.Scan(&id); err != nil {\n\t\treturn nil, err\n\t}\n\tids = append(ids, id)\n}\nreturn ids, rows.Err()\n```\nUn retour en erreur au milieu du parcours laissait la connexion occupée ; defer rows.Close() la rend dans tous les\ncas, et rows.Err() signale une erreur de parcours."
  - key: bug-errnorows
    format: bug-fix
    question: |-
      L'API renvoie 500 pour un client inexistant. Quelle correction est la bonne ?
      ```go
      err := db.QueryRowContext(ctx, q, id).Scan(&c.Nom, &c.Email)
      if err != nil {
      	return Client{}, fmt.Errorf("lecture du client : %w", err)
      }
      ```
    choices:
      - {text: "Tester `errors.Is(err, sql.ErrNoRows)` et renvoyer une erreur métier, traduite en 404", correct: true}
      - {text: "Tester `err == nil`, puis vérifier que `c.Nom` n'est pas vide pour repérer l'absence", correct: false}
      - {text: "Remplacer `QueryRowContext` par `QueryContext` et compter les lignes renvoyées", correct: false}
      - {text: "Comparer le message de l'erreur à « no rows in result set », puis renvoyer 404", correct: false}
    answer: "```go\nerr := db.QueryRowContext(ctx, q, id).Scan(&c.Nom, &c.Email)\nif errors.Is(err, sql.ErrNoRows) {\n\treturn Client{}, ErrIntrouvable\n}\nif err != nil {\n\treturn Client{}, fmt.Errorf(\"lecture du client %s : %w\", id, err)\n}\n```\nsql.ErrNoRows est un cas normal, traduit en erreur métier (puis en 404), distinct d'une vraie panne."
  - key: bug-open-par-requete
    format: bug-fix
    question: |-
      La base refuse des connexions (« too many clients ») alors que le trafic est modeste. Quelle correction est la bonne ?
      ```go
      func (s *Serveur) lister(w http.ResponseWriter, r *http.Request) {
      	db, _ := sql.Open("pgx", s.dsn)
      	defer db.Close()
      	// ...
      }
      ```
    choices:
      - {text: "Ouvrir un seul `*sql.DB` au démarrage et le partager dans `Serveur`", correct: true}
      - {text: "Garder `sql.Open` à chaque requête, mais limiter le pool à une connexion", correct: false}
      - {text: "Retirer le `defer db.Close()`, qui ferme les connexions trop tôt", correct: false}
      - {text: "Relever la limite de connexions de la base, trop basse pour ce service", correct: false}
    answer: "```go\ntype Serveur struct {\n\tdb *sql.DB // ouvert une fois dans main, partagé\n}\n\nfunc (s *Serveur) lister(w http.ResponseWriter, r *http.Request) {\n\trows, err := s.db.QueryContext(r.Context(), \"SELECT ...\")\n\t// ...\n}\n```\nChaque requête créait un pool et une nouvelle connexion ; un seul sql.DB partagé réutilise ses connexions."
  - key: bug-sans-context
    format: bug-fix
    question: |-
      Une requête de rapport continue de tourner en base des minutes après que l'utilisateur a fermé la page. Quelle correction est la bonne ?
      ```go
      rows, err := s.db.Query("SELECT ... FROM ventes WHERE annee = $1", annee)
      ```
    choices:
      - {text: "`QueryContext` avec `r.Context()`, annulé quand le client part", correct: true}
      - {text: "`QueryContext` avec `context.Background()`, plus sûr qu'aucun", correct: false}
      - {text: "Ajouter `defer rows.Close()`, qui arrête la requête en base", correct: false}
      - {text: "Lancer la requête dans une goroutine, abandonnée si le client part", correct: false}
    answer: |-
      ```go
      rows, err := s.db.QueryContext(r.Context(), "SELECT ... FROM ventes WHERE annee = $1", annee)
      ```
      Avec le contexte de la requête, le pilote annule la requête SQL quand le client part.
  - key: scenario-depot
    format: scenario
    question: Comment structures-tu l'accès à la base dans un service Go ?
    choices:
      - {text: "Un dépôt qui reçoit le `*sql.DB`, garde le SQL et renvoie des types et des erreurs du domaine", correct: true}
      - {text: "Des appels à `database/sql` directement dans les handlers, au plus près de la requête HTTP", correct: false}
      - {text: "Une variable globale `*sql.DB`, que chaque fonction métier utilise pour ses propres requêtes", correct: false}
      - {text: "Un ORM qui génère tout le SQL, pour que personne dans l'équipe n'ait à écrire de requête", correct: false}
    answer: "Un type `DepotCommandes` reçoit le `*sql.DB` à sa construction et expose des méthodes métier (`Trouver(ctx, id)`) qui renvoient des types du domaine et des erreurs comme `ErrIntrouvable`. Les services dépendent d'une interface étroite, testable avec un faux ; le dépôt se teste contre une vraie base."
  - key: scenario-tests
    format: scenario
    question: Comment testes-tu le code d'accès à la base ?
    choices:
      - {text: "Contre une vraie base du même moteur (Testcontainers), migrations appliquées au démarrage", correct: true}
      - {text: "Avec sqlmock partout, qui vérifie le texte de chaque requête sans aucune base réelle", correct: false}
      - {text: "Contre SQLite en mémoire, plus rapide, même si la production tourne sur PostgreSQL", correct: false}
      - {text: "Sans test automatisé : on vérifie les requêtes à la main dans un client SQL", correct: false}
    answer: "Contre une vraie base du même moteur, lancée par Testcontainers, avec les migrations appliquées ; chaque test travaille dans une transaction annulée ou sur ses propres données. sqlmock vérifie le texte des requêtes, pas leur comportement : à garder pour les erreurs difficiles à provoquer."
  - key: scenario-migrations
    format: scenario
    question: Comment gères-tu les migrations du schéma d'un service Go ?
    choices:
      - {text: "Des fichiers SQL versionnés, appliqués par goose ou golang-migrate, compatibles avec le code d'avant", correct: true}
      - {text: "Un `CREATE TABLE IF NOT EXISTS` exécuté par le service à chaque démarrage, sans aucune version", correct: false}
      - {text: "Des modifications faites à la main en production par l'administrateur, notées dans un wiki", correct: false}
      - {text: "Le schéma déduit des structs Go par l'ORM, recréé automatiquement à chaque déploiement", correct: false}
    answer: "Des fichiers SQL versionnés (souvent embarqués avec `//go:embed`), appliqués par golang-migrate, goose ou Atlas. Chaque migration reste compatible avec la version précédente du code (ajouter avant de supprimer), pour que les deux tournent ensemble pendant le déploiement."
  - key: scenario-entretien
    format: scenario
    question: "En entretien, on te demande les erreurs les plus courantes avec `database/sql`. Que réponds-tu ?"
    choices:
      - {text: "Oublier `rows.Close()` ou `rows.Err()`, ouvrir un `sql.DB` par requête, concaténer le SQL", correct: true}
      - {text: "Oublier `db.Close()` après chaque requête, et réutiliser le même `sql.DB` partout", correct: false}
      - {text: "Utiliser des paramètres `$1`, plus lents que des requêtes concaténées à la main", correct: false}
      - {text: "Appeler `QueryContext`, qui annule trop souvent des requêtes encore utiles", correct: false}
    answer: "Oublier `rows.Close()` (connexions épuisées) ou `rows.Err()`, ouvrir un `sql.DB` par requête, traiter `sql.ErrNoRows` comme une panne, oublier le contexte ou le Rollback, concaténer le SQL (injection). Fermer le pool après chaque requête est justement une erreur, pas un remède."
