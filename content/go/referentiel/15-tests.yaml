# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: tests
title: Tests
position: 150
chapters:
  - id: tests
    title: Tester en Go
    notions:
      - {id: tests-bases, title: "Le package testing : fichiers _test.go, TestXxx, t.Error et t.Fatal", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix, exercise], complete: true}
      - {id: tests-table, title: "Les tests pilotés par une table", level: beginner, priority: 1, requires: [tests-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
      - {id: sous-tests-paralleles, title: "Les sous-tests (t.Run) et t.Parallel", level: intermediate, priority: 2, requires: [tests-table], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: doublures-interfaces, title: "Doubler une dépendance par une interface", level: intermediate, priority: 2, requires: [tests-bases, accepter-interfaces], formats: [course, true-false, multiple-choice, bug-fix, scenario], complete: true}
      - {id: httptest, title: "Tester un handler ou un client avec httptest", level: intermediate, priority: 2, requires: [tests-bases, http-handlers], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: couverture, title: "La couverture de code : -cover et -coverprofile", level: intermediate, priority: 2, requires: [tests-bases], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: fuzzing, title: "Le fuzzing natif (Go 1.18)", level: expert, priority: 3, requires: [tests-bases], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: tests-utilitaires, title: "t.Helper, t.Cleanup, t.TempDir, t.Context et TestMain", level: intermediate, priority: 2, requires: [tests-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: synctest, title: "Tester du code concurrent avec testing/synctest (Go 1.25)", level: expert, priority: 4, requires: [sous-tests-paralleles], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: exemples-golden, title: "Les fonctions Example et les fichiers golden", level: intermediate, priority: 3, requires: [tests-bases], formats: [course, true-false, multiple-choice, fill-in], complete: true}
