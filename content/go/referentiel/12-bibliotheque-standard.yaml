# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: bibliotheque-standard
title: Bibliothèque standard
position: 120
chapters:
  - id: entrees-sorties
    title: Entrées et sorties
    notions:
      - {id: io-reader-writer, title: "io.Reader et io.Writer : composer des flux", level: beginner, priority: 1, requires: [petites-interfaces], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario]}
      - {id: bufio, title: "bufio : lire ligne par ligne avec un Scanner, écrire avec un tampon", level: beginner, priority: 2, requires: [io-reader-writer], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fichiers-os, title: "Lire et écrire des fichiers : os, os.ReadFile, fermer avec defer", level: beginner, priority: 1, requires: [io-reader-writer, defer], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: embed, title: "Embarquer des fichiers dans le binaire avec //go:embed", level: intermediate, priority: 3, requires: [fichiers-os], formats: [course, true-false, multiple-choice, fill-in]}
  - id: textes-donnees
    title: Textes et données
    notions:
      - {id: fmt-verbes, title: "fmt : Printf et ses verbes (%v, %+v, %#v, %T, %q)", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output]}
      - {id: strings-paquet, title: "Le package strings : Split, Fields, Contains, Cut, ToUpper", level: beginner, priority: 1, requires: [chaines-octets], formats: [course, true-false, multiple-choice, fill-in, code-output, exercise]}
      - {id: encoding-json, title: "encoding/json : Marshal, Unmarshal, tags, omitempty", level: beginner, priority: 1, requires: [structs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: regexp, title: "Les expressions régulières (regexp, RE2)", level: intermediate, priority: 3, requires: [strings-paquet], formats: [course, true-false, multiple-choice, fill-in, code-output]}
  - id: temps
    title: Le temps
    notions:
      - {id: time-durees, title: "time.Time, time.Duration et le formatage par la date de référence", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: timers-tickers, title: "Timers et tickers", level: intermediate, priority: 2, requires: [time-durees, select-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
  - id: tri-collections
    title: Trier et chercher
    notions:
      - {id: slices-maps-paquets, title: "Les paquets slices et maps : Sort, Contains, Index, BinarySearch", level: beginner, priority: 1, requires: [slices-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, exercise]}
      - {id: sort-paquet, title: "Le package sort et sort.Interface, tri stable", level: intermediate, priority: 2, requires: [slices-maps-paquets], formats: [course, true-false, multiple-choice, fill-in, code-output]}
      - {id: container, title: "container/heap et container/list", level: expert, priority: 3, requires: [sort-paquet], formats: [course, true-false, multiple-choice, fill-in, code-output, scenario]}
