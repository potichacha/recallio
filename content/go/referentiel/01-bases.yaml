# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: bases
title: Bases du langage
position: 10
chapters:
  - id: premiers-pas
    title: Premiers pas
    notions:
      - {id: go-presentation, title: "Ce qu'est Go : origines, objectifs, compilation native, garbage collector", level: beginner, priority: 1, formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: hello-world, title: "Le premier programme : package main, func main, fmt.Println", level: beginner, priority: 1, requires: [go-presentation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: commande-go, title: "La commande go : run, build, install, env, doc", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: packages-imports, title: "Packages et imports : un dossier, un package, chemins d'import", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
      - {id: visibilite-casse, title: "La visibilité par la casse : exporté ou non, encapsulation au niveau du package", level: beginner, priority: 1, requires: [packages-imports], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: gofmt-style, title: "gofmt et le style imposé : accolades, point-virgule automatique, tabulations", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, bug-fix], complete: true}
      - {id: compatibilite-go1, title: "La promesse de compatibilité Go 1, la directive go et GODEBUG", level: intermediate, priority: 3, requires: [go-presentation], formats: [course, true-false, multiple-choice, scenario], complete: true}
  - id: variables-types
    title: Variables, types et constantes
    notions:
      - {id: declaration-variables, title: "Déclarer une variable : var, :=, déclarations multiples", level: beginner, priority: 1, requires: [hello-world], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: valeur-zero, title: "La valeur zéro de chaque type, et la rendre utile", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario], complete: true}
      - {id: types-base, title: "Les types de base : entiers, flottants, bool, string, byte, rune", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, definition], complete: true}
      - {id: conversions-numeriques, title: "Pas de conversion implicite : convertir entre types numériques", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: debordement-flottants, title: "Débordement des entiers et précision des flottants", level: intermediate, priority: 2, requires: [types-base], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: constantes-iota, title: "Constantes typées et non typées, iota et les énumérations", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: types-nommes-alias, title: "Types nommés (type Celsius float64) et alias (type Octet = byte)", level: intermediate, priority: 2, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: shadowing, title: "Le masquage (shadowing) par := dans un bloc interne", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: identifiant-blanc, title: "L'identifiant blanc _ : ignorer une valeur, vérifier une interface", level: beginner, priority: 2, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, bug-fix], complete: true}
  - id: controle-flux
    title: Contrôle de flux
    notions:
      - {id: if-init, title: "if, else et l'instruction d'initialisation (if err := f(); err != nil)", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: boucle-for, title: "L'unique boucle for : classique, condition, infinie, range sur un entier", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: range, title: "range sur un tableau, une slice, une chaîne, une map, un channel", level: beginner, priority: 1, requires: [boucle-for], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: variable-boucle-go122, title: "La variable de boucle par itération depuis Go 1.22", level: intermediate, priority: 1, requires: [boucle-for], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: switch, title: "switch sans fall-through, switch sans condition, fallthrough", level: beginner, priority: 1, requires: [if-init], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: labels-break-continue, title: "Labels, break et continue sur une boucle externe, goto", level: intermediate, priority: 3, requires: [boucle-for], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
  - id: fonctions
    title: Fonctions
    notions:
      - {id: fonctions-bases, title: "Fonctions : paramètres, retours multiples, passage par valeur", level: beginner, priority: 1, requires: [declaration-variables], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: retours-nommes, title: "Les retours nommés et le return nu", level: intermediate, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: fonctions-variadiques, title: "Fonctions variadiques et l'étalement (f(xs...))", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: fonctions-valeurs, title: "Les fonctions comme valeurs, types de fonction et fonctions anonymes", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output], complete: true}
      - {id: closures, title: "Les closures et la capture de variables", level: intermediate, priority: 1, requires: [fonctions-valeurs], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: defer, title: "defer : ordre LIFO, évaluation des arguments, modification des retours nommés", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario], complete: true}
      - {id: init-initialisation, title: "L'ordre d'initialisation d'un programme et les fonctions init", level: intermediate, priority: 2, requires: [packages-imports], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: pas-de-surcharge, title: "Ni surcharge, ni paramètres par défaut, ni exceptions : les choix de Go", level: beginner, priority: 2, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, scenario], complete: true}
