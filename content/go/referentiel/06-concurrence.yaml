# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: concurrence
title: Concurrence
position: 60
chapters:
  - id: goroutines
    title: Goroutines
    notions:
      - {id: goroutines-bases, title: "Lancer une goroutine avec go ; concurrence n'est pas parallélisme", level: beginner, priority: 1, requires: [fonctions-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, definition]}
      - {id: attendre-goroutines, title: "Attendre la fin des goroutines : sync.WaitGroup (et wg.Go en Go 1.25)", level: beginner, priority: 1, requires: [goroutines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: fuites-goroutines, title: "Les fuites de goroutines : les détecter, les éviter", level: intermediate, priority: 1, requires: [goroutines-bases, channels-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: panic-goroutine, title: "Une panic dans une goroutine arrête tout le programme", level: intermediate, priority: 2, requires: [goroutines-bases, panic], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
  - id: channels
    title: Channels
    notions:
      - {id: channels-bases, title: "Les channels : envoyer, recevoir, synchroniser", level: beginner, priority: 1, requires: [goroutines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, definition]}
      - {id: channels-bufferises, title: "Channels avec ou sans tampon", level: beginner, priority: 1, requires: [channels-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: fermer-channel, title: "Fermer un channel : qui ferme, recevoir sur un channel fermé, la forme v, ok", level: intermediate, priority: 1, requires: [channels-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: range-channel, title: "range sur un channel jusqu'à sa fermeture", level: intermediate, priority: 1, requires: [fermer-channel], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: channels-direction, title: "Les channels orientés : chan<- et <-chan", level: intermediate, priority: 2, requires: [channels-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: channels-nil, title: "Le channel nil : bloque à jamais, utile dans un select", level: expert, priority: 2, requires: [channels-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: deadlocks, title: "Les interblocages : « all goroutines are asleep »", level: beginner, priority: 1, requires: [channels-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
  - id: select
    title: select
    notions:
      - {id: select-bases, title: "select : attendre plusieurs channels", level: intermediate, priority: 1, requires: [channels-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: select-timeout, title: "Délais avec select et time.After", level: intermediate, priority: 1, requires: [select-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: select-default, title: "select avec default : opération non bloquante", level: intermediate, priority: 2, requires: [select-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
  - id: motifs-concurrence
    title: Motifs de concurrence
    notions:
      - {id: worker-pool, title: "Le pool de workers", level: intermediate, priority: 1, requires: [attendre-goroutines, range-channel], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario, exercise]}
      - {id: pipeline, title: "Les pipelines par étapes reliées par des channels", level: intermediate, priority: 2, requires: [range-channel], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: fan-in-fan-out, title: "Fan-out et fan-in", level: intermediate, priority: 2, requires: [pipeline], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: errgroup, title: "errgroup : des goroutines qui renvoient des erreurs, annulées ensemble", level: intermediate, priority: 2, requires: [attendre-goroutines], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: semaphore, title: "Limiter la concurrence : un channel comme sémaphore", level: intermediate, priority: 2, requires: [channels-bufferises], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: limitation-debit, title: "Limiter le débit : time.Ticker et golang.org/x/time/rate", level: expert, priority: 3, requires: [select-timeout], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
