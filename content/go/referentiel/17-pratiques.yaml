# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: pratiques
title: Go idiomatique et conception
position: 170
chapters:
  - id: idiomatique
    title: Go idiomatique
    notions:
      - {id: nommage-go, title: "Le nommage en Go : noms courts, pas de Get, acronymes, noms de packages", level: beginner, priority: 1, requires: [visibilite-casse], formats: [course, true-false, multiple-choice, bug-fix]}
      - {id: constructeurs-new, title: "Les fonctions New et la valeur zéro utilisable", level: intermediate, priority: 2, requires: [valeur-zero, structs-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: options-fonctionnelles, title: "Les options fonctionnelles", level: intermediate, priority: 2, requires: [constructeurs-new, closures], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: proverbes-go, title: "Les proverbes de Go et la simplicité", level: intermediate, priority: 2, requires: [go-presentation], formats: [course, true-false, multiple-choice, scenario]}
      - {id: commentaires-doc, title: "Commentaires de documentation et go doc", level: beginner, priority: 2, requires: [packages-imports], formats: [course, true-false, multiple-choice, bug-fix]}
  - id: conception
    title: Conception et architecture
    notions:
      - {id: organisation-projet, title: "Organiser un projet : cmd/, internal/, pas de pkg/ par réflexe", level: intermediate, priority: 2, requires: [packages-imports], formats: [course, true-false, multiple-choice, scenario]}
      - {id: package-internal, title: "Le dossier internal et les frontières de packages", level: intermediate, priority: 2, requires: [organisation-projet], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: injection-dependances, title: "L'injection de dépendances à la main en Go", level: intermediate, priority: 2, requires: [accepter-interfaces], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: motifs-conception-go, title: "Les motifs de conception en Go : stratégie, décorateur, observateur, singleton", level: intermediate, priority: 3, requires: [composition-vs-heritage], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: architecture-hexagonale, title: "Une architecture en couches ou hexagonale en Go", level: expert, priority: 3, requires: [injection-dependances], formats: [course, true-false, multiple-choice, scenario]}
  - id: production
    title: En production
    notions:
      - {id: configuration, title: "La configuration : variables d'environnement, fichiers, flags", level: intermediate, priority: 2, requires: [fichiers-os], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: journalisation-slog, title: "La journalisation structurée avec log/slog", level: intermediate, priority: 2, requires: [fmt-verbes], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: observabilite, title: "Métriques et traces : Prometheus et OpenTelemetry", level: expert, priority: 3, requires: [journalisation-slog], formats: [course, true-false, multiple-choice, scenario]}
      - {id: securite-go, title: "La sécurité en Go : crypto/rand, html/template, secrets, entrées", level: intermediate, priority: 2, requires: [injection-sql], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: resilience, title: "La résilience : retries avec backoff, disjoncteur, idempotence", level: expert, priority: 3, requires: [context-delais], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: messagerie, title: "Consommer et produire des messages (Kafka, NATS) en Go", level: expert, priority: 4, requires: [resilience], formats: [course, true-false, multiple-choice, scenario]}
  - id: comparaison
    title: Go face aux autres langages
    notions:
      - {id: go-face-java, title: "Go face à Java : modèle objet, erreurs, concurrence, déploiement", level: intermediate, priority: 2, requires: [go-presentation], formats: [course, true-false, multiple-choice, scenario]}
      - {id: go-face-autres, title: "Go face à Rust, Python et Node.js : quand choisir Go", level: intermediate, priority: 3, requires: [go-presentation], formats: [course, true-false, multiple-choice, scenario]}
