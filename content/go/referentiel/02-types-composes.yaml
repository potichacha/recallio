# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: types-composes
title: Types composés
position: 20
chapters:
  - id: tableaux-slices
    title: Tableaux et slices
    notions:
      - {id: tableaux, title: "Les tableaux : taille dans le type, valeurs copiées", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: slices-bases, title: "Les slices : créer, indexer, découper, len et cap", level: beginner, priority: 1, requires: [tableaux], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: slice-interne, title: "Le descripteur de slice (pointeur, longueur, capacité) et la croissance d'append", level: intermediate, priority: 1, requires: [slices-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario, definition], complete: true}
      - {id: append-partage, title: "append et le partage du tableau sous-jacent : les pièges d'alias", level: intermediate, priority: 1, requires: [slice-interne], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario], complete: true}
      - {id: copy-clone, title: "copy, slices.Clone et copier pour isoler", level: intermediate, priority: 2, requires: [append-partage], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: slice-nil-vide, title: "Slice nil et slice vide : différences et JSON", level: intermediate, priority: 2, requires: [slices-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: expression-slice-complete, title: "L'expression de slice complète s[a:b:c] et la limite de capacité", level: expert, priority: 3, requires: [append-partage], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: slices-multidimensionnelles, title: "Slices à plusieurs dimensions", level: intermediate, priority: 3, requires: [slices-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
  - id: maps
    title: Maps
    notions:
      - {id: maps-bases, title: "Les maps : créer, lire, écrire, supprimer, la forme v, ok", level: beginner, priority: 1, requires: [slices-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario], complete: true}
      - {id: maps-ordre-iteration, title: "L'ordre d'itération aléatoire d'une map", level: beginner, priority: 1, requires: [maps-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: maps-nil, title: "La map nil : lecture possible, écriture qui panique", level: beginner, priority: 1, requires: [maps-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: maps-cles, title: "Les types de clés permis : comparables, structs comme clés", level: intermediate, priority: 2, requires: [maps-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: ensembles, title: "Un ensemble en Go : map[T]struct{} ou map[T]bool", level: beginner, priority: 2, requires: [maps-bases], formats: [course, true-false, multiple-choice, fill-in, code-output], complete: true}
      - {id: maps-internes, title: "L'implémentation des maps : tables de hachage, Swiss Tables (Go 1.24)", level: expert, priority: 3, requires: [maps-bases], formats: [course, true-false, multiple-choice, scenario], complete: true}
  - id: chaines
    title: Chaînes, octets et runes
    notions:
      - {id: chaines-octets, title: "Une chaîne est une suite d'octets immuable ; len compte les octets", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: runes-utf8, title: "Runes, UTF-8 et parcourir une chaîne par caractère", level: beginner, priority: 1, requires: [chaines-octets], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise], complete: true}
      - {id: strings-builder, title: "Construire une chaîne efficacement : strings.Builder, bytes.Buffer", level: beginner, priority: 1, requires: [chaines-octets], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: conversions-chaines, title: "Conversions string, []byte, []rune et strconv", level: beginner, priority: 1, requires: [chaines-octets], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
  - id: structs
    title: Structs
    notions:
      - {id: structs-bases, title: "Les structs : déclarer, initialiser, accéder aux champs", level: beginner, priority: 1, requires: [types-base], formats: [course, true-false, multiple-choice, fill-in, code-output, exercise], complete: true}
      - {id: structs-comparaison, title: "Comparer et copier des structs", level: intermediate, priority: 2, requires: [structs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix], complete: true}
      - {id: tags-struct, title: "Les tags de struct (json, db) et leur lecture par réflexion", level: intermediate, priority: 2, requires: [structs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix], complete: true}
      - {id: structs-anonymes-vide, title: "Structs anonymes et struct vide struct{}", level: intermediate, priority: 3, requires: [structs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output], complete: true}
      - {id: alignement-memoire, title: "Alignement et taille mémoire d'une struct", level: expert, priority: 4, requires: [structs-bases], formats: [course, true-false, multiple-choice, code-output], complete: true}
