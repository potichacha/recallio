# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: outillage
title: Modules et outillage
position: 160
chapters:
  - id: modules
    title: Modules et dépendances
    notions:
      - {id: go-mod, title: "go.mod : module, go, require ; go mod init et go mod tidy", level: beginner, priority: 1, requires: [packages-imports], formats: [course, true-false, multiple-choice, fill-in, scenario, definition], complete: true}
      - {id: versions-mvs, title: "Versions sémantiques, module v2+ et la sélection de version minimale", level: intermediate, priority: 2, requires: [go-mod], formats: [course, true-false, multiple-choice, scenario, definition], complete: true}
      - {id: go-sum-proxy, title: "go.sum, le proxy de modules et la base de sommes de contrôle", level: intermediate, priority: 2, requires: [go-mod], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: replace-vendor-workspaces, title: "replace, vendor et les espaces de travail go.work", level: expert, priority: 3, requires: [go-mod], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: directive-tool, title: "La directive tool de go.mod (Go 1.24)", level: intermediate, priority: 3, requires: [go-mod], formats: [course, true-false, multiple-choice, fill-in], complete: true}
  - id: outils
    title: Outils du quotidien
    notions:
      - {id: go-vet, title: "go vet et ce qu'il détecte", level: beginner, priority: 2, requires: [commande-go], formats: [course, true-false, multiple-choice, bug-fix], complete: true}
      - {id: linters, title: "staticcheck et golangci-lint", level: intermediate, priority: 2, requires: [go-vet], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: build-tags, title: "Les contraintes de build (//go:build) et les fichiers par plateforme", level: intermediate, priority: 3, requires: [commande-go], formats: [course, true-false, multiple-choice, fill-in], complete: true}
      - {id: cross-compilation, title: "La compilation croisée : GOOS, GOARCH, CGO_ENABLED", level: intermediate, priority: 2, requires: [commande-go], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: ldflags-version, title: "Injecter la version au build : -ldflags et debug.ReadBuildInfo", level: intermediate, priority: 3, requires: [cross-compilation], formats: [course, true-false, multiple-choice, fill-in], complete: true}
      - {id: go-generate, title: "go generate et le code généré", level: intermediate, priority: 3, requires: [commande-go], formats: [course, true-false, multiple-choice, fill-in, scenario], complete: true}
      - {id: govulncheck, title: "govulncheck : les vulnérabilités réellement atteintes", level: intermediate, priority: 2, requires: [go-mod], formats: [course, true-false, multiple-choice, scenario], complete: true}
  - id: livraison
    title: Construire et livrer
    notions:
      - {id: image-docker-go, title: "Une image Docker pour Go : build multi-étapes, scratch ou distroless", level: intermediate, priority: 2, requires: [cross-compilation], formats: [course, true-false, multiple-choice, bug-fix, scenario], complete: true}
      - {id: go-kubernetes, title: "Go dans Kubernetes : sondes, arrêt gracieux, ressources", level: intermediate, priority: 3, requires: [image-docker-go, arret-gracieux], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: ci-go, title: "La CI d'un projet Go : vet, lint, race, couverture, govulncheck", level: intermediate, priority: 3, requires: [linters], formats: [course, true-false, multiple-choice, scenario], complete: true}
      - {id: outils-cli, title: "Écrire un outil en ligne de commande : flag, os.Args, codes de sortie, cobra", level: intermediate, priority: 2, requires: [commande-go], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario], complete: true}
