# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: generics
title: Generics
position: 50
chapters:
  - id: generics
    title: Paramètres de type
    notions:
      - {id: generics-presentation, title: "Les generics en Go (1.18) : pourquoi et quand s'en servir", level: intermediate, priority: 1, requires: [interfaces-implicites], formats: [course, true-false, multiple-choice, scenario]}
      - {id: fonctions-generiques, title: "Les fonctions génériques et l'inférence des arguments de type", level: intermediate, priority: 1, requires: [generics-presentation], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise, scenario]}
      - {id: types-generiques, title: "Les types génériques (Pile[T], Liste[T]) et leurs méthodes", level: intermediate, priority: 1, requires: [fonctions-generiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: contraintes, title: "Les contraintes : any, comparable, unions et ~T", level: intermediate, priority: 1, requires: [fonctions-generiques], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: cmp-ordered, title: "cmp.Ordered, cmp.Compare et les paquets slices et maps génériques", level: intermediate, priority: 2, requires: [contraintes], formats: [course, true-false, multiple-choice, fill-in, code-output]}
      - {id: generics-limites, title: "Les limites : pas de paramètre de type sur une méthode, pas de spécialisation", level: expert, priority: 2, requires: [types-generiques], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: generics-ou-interfaces, title: "Generics ou interfaces : choisir", level: expert, priority: 2, requires: [generics-limites], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: generics-implementation, title: "L'implémentation des generics : GC shape stenciling et dictionnaires", level: expert, priority: 4, requires: [generics-limites], formats: [course, true-false, multiple-choice, scenario]}
