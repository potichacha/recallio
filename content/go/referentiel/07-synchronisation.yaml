# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: synchronisation
title: Synchronisation et modèle mémoire
position: 70
chapters:
  - id: sync
    title: Le package sync
    notions:
      - {id: mutex, title: "sync.Mutex : protéger un état partagé", level: beginner, priority: 1, requires: [goroutines-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario, exercise]}
      - {id: rwmutex, title: "sync.RWMutex : plusieurs lecteurs, un seul écrivain", level: intermediate, priority: 2, requires: [mutex], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: once, title: "sync.Once, OnceFunc et OnceValue", level: intermediate, priority: 2, requires: [mutex], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: sync-pool, title: "sync.Pool : réutiliser des objets temporaires", level: expert, priority: 3, requires: [mutex], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: sync-map, title: "sync.Map et ses cas d'usage", level: expert, priority: 3, requires: [mutex], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: cond, title: "sync.Cond", level: expert, priority: 4, requires: [mutex], formats: [course, true-false, multiple-choice, scenario]}
      - {id: copie-mutex, title: "Ne jamais copier un mutex : go vet copylocks", level: intermediate, priority: 2, requires: [mutex], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
  - id: atomiques-memoire
    title: Atomiques et modèle mémoire
    notions:
      - {id: data-races, title: "Les data races et le détecteur -race", level: beginner, priority: 1, requires: [mutex], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario, definition]}
      - {id: channels-ou-mutex, title: "Channels ou mutex : « partager la mémoire en communiquant »", level: intermediate, priority: 1, requires: [mutex, channels-bases], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: atomic, title: "sync/atomic : atomic.Int64, atomic.Value, compare-and-swap", level: intermediate, priority: 2, requires: [data-races], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: modele-memoire, title: "Le modèle mémoire de Go : la relation happens-before", level: expert, priority: 3, requires: [data-races], formats: [course, true-false, multiple-choice, bug-fix, scenario, definition]}
