# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: web-services
title: HTTP et services
position: 130
chapters:
  - id: http-serveur
    title: Serveurs HTTP
    notions:
      - {id: http-handlers, title: "net/http : Handler, HandlerFunc et ListenAndServe", level: beginner, priority: 1, requires: [interfaces-implicites], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: http-routage, title: "Le routage du ServeMux : méthodes et motifs (Go 1.22)", level: beginner, priority: 1, requires: [http-handlers], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: middleware, title: "Les middlewares : envelopper un handler", level: intermediate, priority: 1, requires: [http-handlers, closures], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: api-json, title: "Une API REST en JSON : décoder, valider, répondre avec le bon code", level: intermediate, priority: 1, requires: [http-handlers, encoding-json], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: http-timeouts-serveur, title: "Les délais d'un serveur : ReadTimeout, WriteTimeout, IdleTimeout", level: intermediate, priority: 1, requires: [http-handlers], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: arret-gracieux, title: "L'arrêt gracieux : signaux et Server.Shutdown", level: intermediate, priority: 1, requires: [http-handlers, context-delais], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
  - id: http-client
    title: Clients HTTP
    notions:
      - {id: client-http, title: "http.Client : requêtes, délais, toujours fermer le corps", level: beginner, priority: 1, requires: [http-handlers], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: client-reutilisation, title: "Réutiliser les connexions : un seul client, le Transport", level: intermediate, priority: 2, requires: [client-http], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
  - id: grpc
    title: gRPC et Protocol Buffers
    notions:
      - {id: protobuf, title: "Protocol Buffers : messages, champs numérotés, compatibilité", level: intermediate, priority: 2, requires: [structs-bases], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: grpc-bases, title: "gRPC : services, appels unaires, code généré", level: intermediate, priority: 2, requires: [protobuf], formats: [course, true-false, multiple-choice, scenario, definition]}
      - {id: grpc-streaming, title: "Les flux gRPC : serveur, client, bidirectionnel", level: expert, priority: 3, requires: [grpc-bases], formats: [course, true-false, multiple-choice, scenario]}
      - {id: grpc-erreurs-intercepteurs, title: "Les codes d'erreur gRPC, les délais et les intercepteurs", level: expert, priority: 3, requires: [grpc-bases], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
