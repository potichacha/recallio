# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: erreurs
title: Gestion des erreurs
position: 40
chapters:
  - id: erreurs-valeurs
    title: Les erreurs sont des valeurs
    notions:
      - {id: error-interface, title: "L'interface error, errors.New et la convention du dernier retour", level: beginner, priority: 1, requires: [interfaces-implicites], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: verifier-erreurs, title: "Vérifier chaque erreur : if err != nil, et ne jamais l'ignorer en silence", level: beginner, priority: 1, requires: [error-interface], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: erreurs-sentinelles, title: "Les erreurs sentinelles (io.EOF, sql.ErrNoRows)", level: beginner, priority: 1, requires: [error-interface], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: types-erreur, title: "Les types d'erreur personnalisés", level: intermediate, priority: 1, requires: [error-interface], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: wrapping, title: "Envelopper une erreur avec %w et ajouter du contexte", level: intermediate, priority: 1, requires: [erreurs-sentinelles], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: errors-is-as, title: "errors.Is et errors.As sur une chaîne d'erreurs", level: intermediate, priority: 1, requires: [wrapping, types-erreur], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: errors-join, title: "Plusieurs erreurs à la fois : errors.Join", level: intermediate, priority: 3, requires: [errors-is-as], formats: [course, true-false, multiple-choice, code-output]}
      - {id: erreur-nil-typee, title: "Renvoyer un pointeur d'erreur nil : une erreur non nil", level: intermediate, priority: 2, requires: [types-erreur, interface-nil], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: erreurs-bonnes-pratiques, title: "Traiter une erreur une seule fois, au bon niveau, avec le bon contexte", level: intermediate, priority: 2, requires: [wrapping], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
  - id: panic-recover
    title: panic et recover
    notions:
      - {id: panic, title: "panic : quand le programme ne peut pas continuer", level: beginner, priority: 1, requires: [defer], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: recover, title: "recover dans une fonction différée", level: intermediate, priority: 1, requires: [panic], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: panic-ou-erreur, title: "panic ou erreur : la frontière, et ne pas laisser une panic traverser une API", level: intermediate, priority: 1, requires: [recover, verifier-erreurs], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
