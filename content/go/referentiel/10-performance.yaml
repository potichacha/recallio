# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: performance
title: Performance et profilage
position: 100
chapters:
  - id: performance
    title: Mesurer et optimiser
    notions:
      - {id: benchmarks, title: "Les benchmarks : testing.B, b.Loop (Go 1.24), -benchmem", level: intermediate, priority: 2, requires: [tests-bases], formats: [course, true-false, multiple-choice, fill-in, bug-fix, scenario]}
      - {id: pprof, title: "Profiler avec pprof : CPU, mémoire, goroutines, net/http/pprof", level: intermediate, priority: 2, requires: [benchmarks], formats: [course, true-false, multiple-choice, scenario]}
      - {id: reduire-allocations, title: "Réduire les allocations : préallouer, réutiliser, éviter les conversions", level: intermediate, priority: 2, requires: [pile-tas], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: trace-execution, title: "Le traceur d'exécution (go tool trace) et le flight recorder", level: expert, priority: 3, requires: [pprof], formats: [course, true-false, multiple-choice, scenario]}
      - {id: benchstat, title: "Comparer des benchmarks avec benchstat", level: expert, priority: 3, requires: [benchmarks], formats: [course, true-false, multiple-choice, scenario]}
      - {id: pgo, title: "L'optimisation guidée par le profil (PGO)", level: expert, priority: 4, requires: [pprof], formats: [course, true-false, multiple-choice, scenario]}
