# Référentiel Go (ADR 0025, 0026) : l'inventaire de toutes les notions, à remplir de contenu.
# Champs d'une notion : id (définitif), title, level (beginner | intermediate | expert),
# priority (1 essentiel, 2 courant, 3 avancé, 4 rare), requires (prérequis), formats (facultatif :
# les formats qui conviennent, quand tous ne conviennent pas).
domain: methodes-interfaces
title: Pointeurs, méthodes et interfaces
position: 30
chapters:
  - id: pointeurs
    title: Pointeurs
    notions:
      - {id: pointeurs-bases, title: "Les pointeurs : &, *, pas d'arithmétique, pointeur nil", level: beginner, priority: 1, requires: [structs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: new-make, title: "new et make : ce que chacun alloue et renvoie", level: beginner, priority: 1, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: pointeur-ou-valeur, title: "Passer une valeur ou un pointeur : coût, mutabilité, nil", level: intermediate, priority: 1, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: unsafe, title: "Le package unsafe et ses usages légitimes", level: expert, priority: 4, requires: [pointeurs-bases], formats: [course, true-false, multiple-choice, scenario]}
  - id: methodes
    title: Méthodes
    notions:
      - {id: methodes-bases, title: "Déclarer une méthode sur un type nommé", level: beginner, priority: 1, requires: [structs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, exercise]}
      - {id: receveur-valeur-pointeur, title: "Receveur valeur ou receveur pointeur : choisir, et rester cohérent", level: beginner, priority: 1, requires: [methodes-bases, pointeurs-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, scenario]}
      - {id: ensemble-methodes, title: "L'ensemble de méthodes d'un type et d'un pointeur", level: intermediate, priority: 2, requires: [receveur-valeur-pointeur], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: valeurs-methodes, title: "Valeurs et expressions de méthode (obj.M, T.M)", level: expert, priority: 3, requires: [methodes-bases, fonctions-valeurs], formats: [course, true-false, multiple-choice, code-output]}
  - id: interfaces
    title: Interfaces
    notions:
      - {id: interfaces-implicites, title: "Les interfaces satisfaites implicitement, sans implements", level: beginner, priority: 1, requires: [methodes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix, exercise]}
      - {id: interface-vide-any, title: "L'interface vide et any", level: beginner, priority: 1, requires: [interfaces-implicites], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: assertion-type, title: "L'assertion de type v.(T) et sa forme v, ok", level: beginner, priority: 1, requires: [interface-vide-any], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: type-switch, title: "Le switch de type", level: beginner, priority: 1, requires: [assertion-type], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: interface-nil, title: "Le piège de l'interface non nil qui contient un pointeur nil", level: intermediate, priority: 1, requires: [interfaces-implicites, pointeurs-bases], formats: [course, true-false, multiple-choice, code-output, bug-fix, scenario]}
      - {id: petites-interfaces, title: "Les petites interfaces : io.Reader, io.Writer, fmt.Stringer", level: beginner, priority: 1, requires: [interfaces-implicites], formats: [course, true-false, multiple-choice, fill-in, code-output, scenario]}
      - {id: verification-interface, title: "Vérifier à la compilation qu'un type implémente une interface", level: intermediate, priority: 2, requires: [interfaces-implicites, identifiant-blanc], formats: [course, true-false, multiple-choice, fill-in, bug-fix]}
      - {id: accepter-interfaces, title: "Accepter des interfaces, renvoyer des structs ; définir l'interface côté consommateur", level: intermediate, priority: 2, requires: [petites-interfaces], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
      - {id: interfaces-internes, title: "La représentation d'une interface : type et valeur (iface, eface)", level: expert, priority: 3, requires: [interface-nil], formats: [course, true-false, multiple-choice, code-output, scenario]}
  - id: composition
    title: Composition
    notions:
      - {id: embedding-structs, title: "L'embarquement de structs et la promotion des champs et méthodes", level: beginner, priority: 1, requires: [methodes-bases], formats: [course, true-false, multiple-choice, fill-in, code-output, bug-fix]}
      - {id: embedding-interfaces, title: "Composer des interfaces (io.ReadWriter) et embarquer une interface dans une struct", level: intermediate, priority: 2, requires: [embedding-structs, interfaces-implicites], formats: [course, true-false, multiple-choice, code-output, bug-fix]}
      - {id: composition-vs-heritage, title: "Composition plutôt qu'héritage : ce que l'embarquement n'est pas", level: intermediate, priority: 2, requires: [embedding-structs], formats: [course, true-false, multiple-choice, bug-fix, scenario]}
