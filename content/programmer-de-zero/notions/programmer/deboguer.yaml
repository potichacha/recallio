notion: deboguer
lesson: |-
  Un **bug** : le programme s'exécute, mais ne fait pas ce qu'on voulait. Pour le trouver, on **observe** : on affiche
  les variables à chaque étape, et on compare avec ce qu'on attendait. On peut aussi dérouler le programme à la main,
  ligne par ligne.
tour:
  - title: Trouver un bug
    text: |-
      Parfois, le programme s'exécute, mais ne fait pas ce que tu voulais : c'est un **bug**. Pour le trouver, on
      **observe** : on ajoute des affichages pour voir ce que contiennent les variables à chaque étape, et on compare
      avec ce qu'on attendait. On peut aussi dérouler le programme à la main, ligne par ligne.

      Ce programme devait additionner les nombres de 1 à 5, mais il affiche 10 au lieu de 15. Les affichages ajoutés
      dans la boucle montrent le problème : la boucle s'arrête un tour trop tôt.
    example:
      files:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i < 5; i++) {
                  somme += i;
                  IO.println("i = " + i + ", somme = " + somme);
              }
              IO.println("somme : " + somme);
          }
      output: |-
        i = 1, somme = 1
        i = 2, somme = 3
        i = 3, somme = 6
        i = 4, somme = 10
        somme : 10
    task:
      instructions: |-
        Corrige le bug, et retire l'affichage de la boucle : le programme doit afficher `somme : 15`.
      starter:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i < 5; i++) {
                  somme += i;
                  IO.println("i = " + i + ", somme = " + somme);
              }
              IO.println("somme : " + somme);
          }
      solution:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i <= 5; i++) {
                  somme += i;
              }
              IO.println("somme : " + somme);
          }
      output: |-
        somme : 15
cards:
  - key: cours
    format: course
    question: "Qu'est-ce qu'un bug ?"
    choices:
      - {text: "Un programme qu'on n'a pas encore exécuté", correct: false}
      - {text: "Un ordinateur en panne", correct: false}
      - {text: "Un programme qui s'exécute, mais ne fait pas ce qu'on voulait", correct: true}
      - {text: "Un virus qui abîme l'ordinateur", correct: false}
    answer: "Un programme qui s'exécute, mais ne fait pas ce qu'on voulait."
  - key: vrai-faux-1
    format: true-false
    question: "Afficher les variables à chaque étape aide à trouver un bug."
    truth: true
    answer: "Oui : on compare ce qu'on voit avec ce qu'on attendait."
  - key: vrai-faux-2
    format: true-false
    question: "Un bug empêche toujours le programme de s'exécuter."
    truth: false
    answer: "Non : c'est une erreur de compilation qui l'empêche. Un bug, lui, s'exécute… mal."
  - key: qcm-1
    format: multiple-choice
    question: "La boucle `for (int i = 1; i < 5; i++)` devait aller jusqu'à 5. Quelle est l'erreur ?"
    choices:
      - {text: "Il faut `i <= 5`", correct: true}
      - {text: "Il faut `i = 5`", correct: false}
      - {text: "Il faut enlever `i++`", correct: false}
    answer: "`i < 5` s'arrête à 4."
  - key: qcm-2
    format: multiple-choice
    question: "Que fait-on une fois le bug corrigé ?"
    choices:
      - {text: "On retire les affichages ajoutés pour le trouver", correct: true}
      - {text: "On garde ces affichages, au cas où il reviendrait", correct: false}
      - {text: "On ajoute d'autres affichages, par précaution", correct: false}
    answer: "Les affichages de recherche ont fait leur travail."
