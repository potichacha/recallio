notion: parcourir
lesson: |-
  `for (String fruit : fruits) { … }` se lit « pour chaque `fruit` de `fruits` » : à chaque tour, `fruit` contient
  l'élément suivant de la liste, du premier au dernier.
tour:
  - title: Parcourir une liste
    text: |-
      Pour faire quelque chose avec **chaque** élément d'une liste, on la **parcourt** avec une boucle :
      `for (String fruit : fruits)` se lit « pour chaque `fruit` de `fruits` ». À chaque tour, `fruit` contient
      l'élément suivant.

      C'est la façon la plus simple de traiter une liste en entier, quelle que soit sa taille.
    example:
      files:
        Main.java: |-
          void main() {
              List<String> fruits = List.of("pomme", "banane", "cerise");
              for (String fruit : fruits) {
                  IO.println("J'aime la " + fruit);
              }

              List<Integer> notes = List.of(12, 15, 9, 18);
              int total = 0;
              for (int note : notes) {
                  total += note;
              }
              IO.println("total des notes : " + total);
          }
      output: |-
        J'aime la pomme
        J'aime la banane
        J'aime la cerise
        total des notes : 54
    task:
      instructions: |-
        Affiche chaque prénom de la liste en majuscules, avec `prenom.toUpperCase()`, un par ligne.
      starter:
        Main.java: |-
          void main() {
              List<String> prenoms = List.of("léa", "sam", "noa");
              IO.println(prenoms);
          }
      solution:
        Main.java: |-
          void main() {
              List<String> prenoms = List.of("léa", "sam", "noa");
              for (String prenom : prenoms) {
                  IO.println(prenom.toUpperCase());
              }
          }
      output: |-
        LÉA
        SAM
        NOA
cards:
  - key: cours
    format: course
    question: "Comment lire `for (String fruit : fruits)` ?"
    choices:
      - {text: "« Pour chaque `fruit` de `fruits` »", correct: true}
      - {text: "« Copie `fruits` dans `fruit` »", correct: false}
      - {text: "« Si `fruit` est dans `fruits` »", correct: false}
      - {text: "« Tant que `fruit` vaut `fruits` »", correct: false}
    answer: "« Pour chaque `fruit` de `fruits` » : un tour par élément de la liste."
  - key: vrai-faux-1
    format: true-false
    question: "La boucle `for (String fruit : fruits)` traite les éléments du premier au dernier."
    truth: true
    answer: "Oui : dans l'ordre de la liste."
  - key: vrai-faux-2
    format: true-false
    question: "Pour parcourir une liste, il faut connaître sa taille à l'avance."
    truth: false
    answer: "Non : la boucle s'adapte à la taille de la liste."
  - key: qcm-1
    format: multiple-choice
    question: "Combien de lignes affiche `for (String f : List.of(\"a\", \"b\", \"c\")) { IO.println(f); }` ?"
    choices:
      - {text: "3", correct: true}
      - {text: "1", correct: false}
      - {text: "0", correct: false}
    answer: "Un tour, donc une ligne, par élément."
  - key: qcm-2
    format: multiple-choice
    question: "Que contient `total` après `int total = 0; for (int n : List.of(2, 3, 5)) { total += n; }` ?"
    choices:
      - {text: "10", correct: true}
      - {text: "5", correct: false}
      - {text: "3", correct: false}
    answer: "2 + 3 + 5 = 10."
