notion: erreurs
lesson: |-
  Avant d'exécuter un programme Java, le **compilateur** le relit. S'il ne comprend pas une ligne, il refuse, et dit
  **où** et **pourquoi**.

  Les erreurs fréquentes au début : un point-virgule oublié, un guillemet ou une parenthèse non refermés, une majuscule
  à la place d'une minuscule (`io` au lieu de `IO`). On lit le message, on corrige, on recommence.
tour:
  - title: Les erreurs t'aident
    text: |-
      Tout le monde fait des erreurs en programmant, tout le temps. Avant d'exécuter ton programme, le **compilateur**
      le relit : s'il ne comprend pas une ligne, il refuse, et te dit **où** et **pourquoi**. Ce n'est pas un reproche :
      c'est une aide.

      Les erreurs les plus courantes au début :

      - un point-virgule oublié à la fin d'une instruction ;
      - un guillemet ou une parenthèse qui ne sont pas refermés ;
      - une minuscule à la place d'une majuscule : `io.println` n'est pas `IO.println`.

      Essaie : supprime le point-virgule de la première ligne, exécute, et lis le message. Remets-le, puis exécute de
      nouveau.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("Une erreur n'est pas grave.");
              IO.println("On la lit, puis on la corrige.");
          }
      output: |-
        Une erreur n'est pas grave.
        On la lit, puis on la corrige.
cards:
  - key: cours
    format: course
    question: "Que fait le compilateur quand une ligne est mal écrite ?"
    answer: "Il refuse d'exécuter le programme, et dit **où** est l'erreur et **pourquoi**."
  - key: vrai-faux-1
    format: true-false
    question: "Un message d'erreur du compilateur indique la ligne qui pose problème."
    truth: true
    answer: "Oui : il donne le fichier et la ligne, et une explication."
  - key: vrai-faux-2
    format: true-false
    question: "`io.println(\"Bonjour\");` fonctionne aussi bien que `IO.println(\"Bonjour\");`."
    truth: false
    answer: "Non : Java distingue les majuscules des minuscules, et `io` n'existe pas."
  - key: qcm-1
    format: multiple-choice
    question: "Quelle erreur est la plus fréquente au début ?"
    choices:
      - {text: "Oublier un point-virgule à la fin d'une instruction", correct: true}
      - {text: "Écrire trop de commentaires", correct: false}
      - {text: "Utiliser des nombres", correct: false}
    answer: "Le compilateur le signale tout de suite : il suffit de l'ajouter."
  - key: qcm-2
    format: multiple-choice
    question: "Que faire devant un message d'erreur ?"
    choices:
      - {text: "Le lire, corriger la ligne indiquée, et exécuter de nouveau", correct: true}
      - {text: "Effacer tout le programme", correct: false}
      - {text: "L'ignorer et recommencer à l'identique", correct: false}
    answer: "Le message est une aide : il dit quoi corriger."
