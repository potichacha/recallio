notion: si-sinon
lesson: |-
  `if (condition) { … }` exécute le bloc **seulement si** la condition est vraie ; `else { … }` donne quoi faire sinon.
  `else if` enchaîne d'autres cas.

  L'ordinateur teste les conditions de haut en bas, exécute le **premier** bloc dont la condition est vraie, et saute
  les autres.
tour:
  - title: Si… sinon
    text: |-
      `if` (« si ») exécute des instructions **seulement si** une condition est vraie. La condition s'écrit entre
      parenthèses, et les instructions entre accolades. `else` (« sinon ») dit ce qu'il faut faire dans le cas
      contraire.

      On enchaîne plusieurs cas avec `else if` : l'ordinateur teste les conditions de haut en bas, exécute le
      **premier** bloc dont la condition est vraie, et saute les autres.

      Essaie : change la valeur de `temperature`, et regarde quel message s'affiche.
    example:
      files:
        Main.java: |-
          void main() {
              int temperature = 28;
              if (temperature > 25) {
                  IO.println("Il fait chaud : prends une casquette.");
              } else if (temperature < 10) {
                  IO.println("Il fait froid : prends un manteau.");
              } else {
                  IO.println("Il fait doux.");
              }
          }
      output: |-
        Il fait chaud : prends une casquette.
    task:
      instructions: |-
        Affiche `pair` si `nombre` est pair, et `impair` sinon. Un nombre est pair quand le reste de sa division par 2
        vaut 0 : `nombre % 2 == 0`. Avec 7, le programme doit afficher `impair`.
      starter:
        Main.java: |-
          void main() {
              int nombre = 7;
              IO.println(nombre);
          }
      solution:
        Main.java: |-
          void main() {
              int nombre = 7;
              if (nombre % 2 == 0) {
                  IO.println("pair");
              } else {
                  IO.println("impair");
              }
          }
      output: |-
        impair
cards:
  - key: cours
    format: course
    question: "À quoi sert `if` ?"
    answer: "À exécuter des instructions **seulement si** une condition est vraie."
  - key: vrai-faux-1
    format: true-false
    question: "Dans un `if … else if … else`, plusieurs blocs peuvent s'exécuter."
    truth: false
    answer: "Non : seul le premier bloc dont la condition est vraie s'exécute."
  - key: vrai-faux-2
    format: true-false
    question: "Le bloc `else` s'exécute quand aucune condition précédente n'est vraie."
    truth: true
    answer: "Oui : c'est le cas « sinon »."
  - key: qcm-1
    format: multiple-choice
    question: "Avec `int temperature = 30;`, qu'affiche `if (temperature > 25) { IO.println(\"chaud\"); } else { IO.println(\"doux\"); }` ?"
    choices:
      - {text: "chaud", correct: true}
      - {text: "doux", correct: false}
      - {text: "chaud, puis doux", correct: false}
    answer: "30 est plus grand que 25 : seul le premier bloc s'exécute."
  - key: qcm-2
    format: multiple-choice
    question: "Comment savoir si un nombre `n` est pair ?"
    choices:
      - {text: "`n % 2 == 0`", correct: true}
      - {text: "`n / 2 == 0`", correct: false}
      - {text: "`n == 2`", correct: false}
    answer: "Un nombre pair a un reste nul dans la division par 2."
