notion: pour
lesson: |-
  `for (int i = 1; i <= 5; i++) { … }` répète un bloc un nombre de fois connu. Elle réunit le départ (`int i = 1`), la
  condition pour continuer (`i <= 5`) et ce qui change à chaque tour (`i++`).

  `i` est le **compteur** : il vaut 1 au premier tour, 2 au deuxième, et ainsi de suite.
tour:
  - title: "Compter : for"
    text: |-
      Quand on sait combien de fois répéter, la boucle `for` (« pour ») est plus pratique. Elle réunit sur une ligne
      trois choses : le départ (`int i = 1`), la condition pour continuer (`i <= 5`), et ce qui change à chaque tour
      (`i++`, ajouter 1).

      `i` est le **compteur** : il vaut 1 au premier tour, 2 au deuxième, et la boucle s'arrête quand `i <= 5` devient
      faux.
    example:
      files:
        Main.java: |-
          void main() {
              for (int i = 1; i <= 5; i++) {
                  IO.println("tour numéro " + i);
              }
              for (int i = 1; i <= 3; i++) {
                  IO.println("7 x " + i + " = " + (7 * i));
              }
          }
      output: |-
        tour numéro 1
        tour numéro 2
        tour numéro 3
        tour numéro 4
        tour numéro 5
        7 x 1 = 7
        7 x 2 = 14
        7 x 3 = 21
    task:
      instructions: |-
        Affiche la table de multiplication de 9, de `9 x 1 = 9` à `9 x 10 = 90`, une ligne par calcul.
      starter:
        Main.java: |-
          void main() {
              for (int i = 1; i <= 3; i++) {
                  IO.println("7 x " + i + " = " + (7 * i));
              }
          }
      solution:
        Main.java: |-
          void main() {
              for (int i = 1; i <= 10; i++) {
                  IO.println("9 x " + i + " = " + (9 * i));
              }
          }
      output: |-
        9 x 1 = 9
        9 x 2 = 18
        9 x 3 = 27
        9 x 4 = 36
        9 x 5 = 45
        9 x 6 = 54
        9 x 7 = 63
        9 x 8 = 72
        9 x 9 = 81
        9 x 10 = 90
cards:
  - key: cours
    format: course
    question: "Combien de tours fait `for (int i = 1; i <= 5; i++)` ?"
    answer: "5 tours, avec `i` de 1 à 5."
  - key: vrai-faux-1
    format: true-false
    question: "Dans une boucle `for`, `i++` s'exécute à la fin de chaque tour."
    truth: true
    answer: "Oui : c'est ce qui fait avancer le compteur."
  - key: vrai-faux-2
    format: true-false
    question: "La boucle `for (int i = 1; i <= 3; i++)` commence avec `i` égal à 0."
    truth: false
    answer: "Non : elle commence avec la valeur donnée au départ, ici 1."
  - key: qcm-1
    format: multiple-choice
    question: "Quelle valeur prend `i` au troisième tour de `for (int i = 1; i <= 5; i++)` ?"
    choices:
      - {text: "3", correct: true}
      - {text: "2", correct: false}
      - {text: "4", correct: false}
    answer: "1 au premier tour, 2 au deuxième, 3 au troisième."
  - key: qcm-2
    format: multiple-choice
    question: "Quand préférer `for` à `while` ?"
    choices:
      - {text: "Quand on sait combien de fois répéter", correct: true}
      - {text: "Jamais", correct: false}
      - {text: "Quand on ne veut rien répéter", correct: false}
    answer: "`for` réunit sur une ligne le départ, la condition et l'avancée du compteur."
