notion: comparer
lesson: |-
  `<`, `>`, `<=`, `>=`, `==` (égal, avec **deux** signes) et `!=` (différent) comparent deux nombres. Le résultat est un
  `boolean` : `true` ou `false`.

  Deux textes se comparent avec `.equals(…)` : `prenom.equals("Léa")`, et non avec `==`.
tour:
  - title: Vrai ou faux
    text: |-
      On peut **comparer** deux valeurs : `<` (plus petit que), `>` (plus grand que), `<=` et `>=` (ou égal), `==` (égal
      à, avec **deux** signes égal) et `!=` (différent de). Une comparaison donne un résultat de type `boolean` : `true`
      (vrai) ou `false` (faux).

      `age >= 18` vaut `true` si `age` contient 18 ou plus. On peut afficher ce résultat, ou le ranger dans une
      variable.

      Pour comparer deux textes, on n'utilise pas `==`, mais `.equals(…)`.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 15;
              IO.println(age >= 18);
              IO.println(age < 18);
              IO.println(age == 15);
              boolean majeur = age >= 18;
              IO.println("majeur : " + majeur);
              String prenom = "Léa";
              IO.println(prenom.equals("Léa"));
          }
      output: |-
        false
        true
        true
        majeur : false
        true
cards:
  - key: cours
    format: course
    question: "Que donne une comparaison comme `age >= 18` ?"
    answer: "Un `boolean` : `true` si elle est vraie, `false` sinon."
  - key: vrai-faux-1
    format: true-false
    question: "On teste l'égalité de deux nombres avec un seul signe `=`."
    truth: false
    answer: "Non : il en faut deux, `==`. Un seul `=` range une valeur."
  - key: vrai-faux-2
    format: true-false
    question: "Deux textes se comparent avec `.equals(…)`."
    truth: true
    answer: "Oui : `prenom.equals(\"Léa\")`."
  - key: qcm-1
    format: multiple-choice
    question: "Après `int age = 15;`, que vaut `age < 18` ?"
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`15`", correct: false}
    answer: "15 est plus petit que 18 : la comparaison est vraie."
  - key: qcm-2
    format: multiple-choice
    question: "Quel opérateur veut dire « différent de » ?"
    choices:
      - {text: "`!=`", correct: true}
      - {text: "`<>`", correct: false}
      - {text: "`=/=`", correct: false}
    answer: "`!=` se lit « n'est pas égal à »."
