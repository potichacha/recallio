notion: parametres
lesson: |-
  Les **paramètres** d'une fonction sont des informations qu'elle reçoit à chaque appel, déclarées entre ses parenthèses
  avec leur type : `void saluer(String prenom)`.

  On donne la valeur à l'appel : `saluer("Léa");`. Plusieurs paramètres se séparent par des virgules.
tour:
  - title: Les paramètres
    text: |-
      Une fonction peut recevoir des informations : ses **paramètres**, déclarés entre ses parenthèses avec leur type,
      comme des variables. `void saluer(String prenom)` attend un texte, qu'on lui donne à l'appel : `saluer("Léa");`.

      Dans la fonction, `prenom` contient la valeur donnée. Une même fonction fait ainsi le même travail sur des valeurs
      différentes. Plusieurs paramètres se séparent par des virgules.
    example:
      files:
        Main.java: |-
          void saluer(String prenom) {
              IO.println("Bonjour, " + prenom + " !");
          }

          void afficherRectangle(int largeur, int hauteur) {
              IO.println("rectangle de " + largeur + " sur " + hauteur);
          }

          void main() {
              saluer("Léa");
              saluer("Sam");
              afficherRectangle(4, 2);
          }
      output: |-
        Bonjour, Léa !
        Bonjour, Sam !
        rectangle de 4 sur 2
    task:
      instructions: |-
        Ajoute à `saluer` un second paramètre, `int age`, pour que `saluer("Léa", 12);` affiche
        `Bonjour, Léa ! Tu as 12 ans.`
      starter:
        Main.java: |-
          void saluer(String prenom) {
              IO.println("Bonjour, " + prenom + " !");
          }

          void main() {
              saluer("Léa");
          }
      solution:
        Main.java: |-
          void saluer(String prenom, int age) {
              IO.println("Bonjour, " + prenom + " ! Tu as " + age + " ans.");
          }

          void main() {
              saluer("Léa", 12);
          }
      output: |-
        Bonjour, Léa ! Tu as 12 ans.
cards:
  - key: cours
    format: course
    question: "Qu'est-ce qu'un paramètre ?"
    choices:
      - {text: "Le résultat que la fonction renvoie", correct: false}
      - {text: "Un réglage de Java, choisi une fois pour toutes", correct: false}
      - {text: "Le nom de la fonction", correct: false}
      - {text: "Une information que la fonction reçoit à chaque appel", correct: true}
    answer: "Une information que la fonction reçoit à chaque appel. Le résultat qu'elle renvoie passe par `return`."
  - key: vrai-faux-1
    format: true-false
    question: "`void saluer(String prenom)` attend un texte à chaque appel."
    truth: true
    answer: "Oui : on l'appelle avec `saluer(\"Léa\");`."
  - key: vrai-faux-2
    format: true-false
    question: "Une fonction ne peut avoir qu'un seul paramètre."
    truth: false
    answer: "Non : on en met autant qu'il faut, séparés par des virgules."
  - key: qcm-1
    format: multiple-choice
    question: "Avec `void saluer(String prenom) { IO.println(\"Bonjour, \" + prenom); }`, qu'affiche `saluer(\"Sam\");` ?"
    choices:
      - {text: "Bonjour, Sam", correct: true}
      - {text: "Bonjour, prenom", correct: false}
      - {text: "Sam", correct: false}
    answer: "Dans la fonction, `prenom` contient la valeur donnée à l'appel."
  - key: qcm-2
    format: multiple-choice
    question: "Comment appeler `afficherRectangle(int largeur, int hauteur)` ?"
    choices:
      - {text: "`afficherRectangle(4, 2);`", correct: true}
      - {text: "`afficherRectangle(4 2);`", correct: false}
      - {text: "`afficherRectangle;`", correct: false}
    answer: "Les valeurs se séparent par une virgule, dans l'ordre des paramètres."
