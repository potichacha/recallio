notion: listes
lesson: |-
  Une **liste** range plusieurs valeurs sous un seul nom : `List.of(12, 15, 9)`. Les positions commencent à **0** :
  `notes.get(0)` est la première valeur, et `notes.size()` le nombre de valeurs.

  Pour une liste qu'on remplit au fur et à mesure : `new ArrayList<>()`, puis `add(…)`.
tour:
  - title: Les listes
    text: |-
      Une **liste** range plusieurs valeurs sous un seul nom : `List.of(12, 15, 9)`. Chaque valeur a une **position**,
      qui commence à **0** : `notes.get(0)` donne la première, `notes.get(1)` la deuxième, et `notes.size()` le nombre
      de valeurs.

      `List.of` crée une liste qui ne change plus. Pour une liste qu'on remplit au fur et à mesure, on écrit
      `new ArrayList<>()`, et `add` ajoute à la fin. Entre les chevrons, on indique le type des éléments :
      `List<String>`, ou `List<Integer>` pour des entiers.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> notes = List.of(12, 15, 9);
              IO.println(notes);
              IO.println("première note : " + notes.get(0));
              IO.println("nombre de notes : " + notes.size());

              List<String> courses = new ArrayList<>();
              courses.add("pain");
              courses.add("lait");
              IO.println(courses);
          }
      output: |-
        [12, 15, 9]
        première note : 12
        nombre de notes : 3
        [pain, lait]
    task:
      instructions: |-
        Ajoute `"pommes"` à la liste des courses : le programme doit afficher `[pain, lait, pommes]`.
      starter:
        Main.java: |-
          void main() {
              List<String> courses = new ArrayList<>();
              courses.add("pain");
              courses.add("lait");
              IO.println(courses);
          }
      solution:
        Main.java: |-
          void main() {
              List<String> courses = new ArrayList<>();
              courses.add("pain");
              courses.add("lait");
              courses.add("pommes");
              IO.println(courses);
          }
      output: |-
        [pain, lait, pommes]
cards:
  - key: cours
    format: course
    question: "À quelle position se trouve le premier élément d'une liste ?"
    answer: "À la position **0**."
  - key: vrai-faux-1
    format: true-false
    question: "`notes.size()` donne le nombre d'éléments de la liste."
    truth: true
    answer: "Oui : pour `List.of(12, 15, 9)`, il vaut 3."
  - key: vrai-faux-2
    format: true-false
    question: "On peut ajouter un élément à une liste créée par `List.of(…)`."
    truth: false
    answer: "Non : elle ne change plus. Pour ajouter, on crée une `new ArrayList<>()`."
  - key: qcm-1
    format: multiple-choice
    question: "Que vaut `List.of(12, 15, 9).get(1)` ?"
    choices:
      - {text: "15", correct: true}
      - {text: "12", correct: false}
      - {text: "9", correct: false}
    answer: "La position 1 est la deuxième, car on compte à partir de 0."
  - key: qcm-2
    format: multiple-choice
    question: "Comment ajouter `\"lait\"` à la liste `courses` (une `ArrayList`) ?"
    choices:
      - {text: "`courses.add(\"lait\");`", correct: true}
      - {text: "`courses + \"lait\";`", correct: false}
      - {text: "`courses.get(\"lait\");`", correct: false}
    answer: "`add` ajoute à la fin de la liste."
