notion: et-ou-non
lesson: |-
  - `a && b` (« et ») est vrai si les **deux** sont vrais ;
  - `a || b` (« ou ») est vrai si **au moins un** des deux est vrai ;
  - `!a` (« non ») inverse : vrai devient faux, et faux devient vrai.
tour:
  - title: Et, ou, non
    text: |-
      On combine des conditions avec :

      - `&&` (« et ») : vrai si les **deux** conditions sont vraies ;
      - `||` (« ou ») : vrai si **au moins une** des deux est vraie ;
      - `!` (« non ») : inverse une condition, et le vrai devient faux.

      Pour monter dans un manège, il faut ici avoir 12 ans **et** mesurer 1,40 m ; on a une réduction si l'on est
      étudiant **ou** si l'on a plus de 65 ans.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 13;
              double taille = 1.45;
              boolean etudiant = false;

              if (age >= 12 && taille >= 1.40) {
                  IO.println("Tu peux monter dans le manège.");
              }
              if (etudiant || age > 65) {
                  IO.println("Tu as une réduction.");
              } else {
                  IO.println("Plein tarif.");
              }
              IO.println("pas étudiant : " + !etudiant);
          }
      output: |-
        Tu peux monter dans le manège.
        Plein tarif.
        pas étudiant : true
    task:
      instructions: |-
        Le manège est fermé le week-end. Ne laisse monter que si ce n'est **pas** le week-end, avec `!`, et sinon
        affiche `Le manège est fermé.` : avec `weekEnd` à `true`, c'est ce que le programme doit afficher.
      starter:
        Main.java: |-
          void main() {
              int age = 13;
              boolean weekEnd = true;
              if (age >= 12) {
                  IO.println("Tu peux monter dans le manège.");
              }
          }
      solution:
        Main.java: |-
          void main() {
              int age = 13;
              boolean weekEnd = true;
              if (age >= 12 && !weekEnd) {
                  IO.println("Tu peux monter dans le manège.");
              } else {
                  IO.println("Le manège est fermé.");
              }
          }
      output: |-
        Le manège est fermé.
cards:
  - key: cours
    format: course
    question: "Quand `a && b` est-il vrai ?"
    choices:
      - {text: "Quand au moins l'un des deux est vrai", correct: false}
      - {text: "Quand un seul des deux est vrai", correct: false}
      - {text: "Quand `a` et `b` sont faux tous les deux", correct: false}
      - {text: "Quand `a` et `b` sont vrais tous les deux", correct: true}
    answer: "Quand `a` **et** `b` sont vrais tous les deux. « Au moins l'un des deux », c'est `a || b`."
  - key: vrai-faux-1
    format: true-false
    question: "`a || b` est vrai si au moins une des deux conditions est vraie."
    truth: true
    answer: "Oui : `||` veut dire « ou »."
  - key: vrai-faux-2
    format: true-false
    question: "`!true` vaut `true`."
    truth: false
    answer: "Non : `!` inverse, donc `!true` vaut `false`."
  - key: qcm-1
    format: multiple-choice
    question: "Avec `age = 10` et `taille = 1.45`, que vaut `age >= 12 && taille >= 1.40` ?"
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`1.45`", correct: false}
    answer: "La première condition est fausse : avec « et », tout est faux."
  - key: qcm-2
    format: multiple-choice
    question: "Quelle condition dit « étudiant ou plus de 65 ans » ?"
    choices:
      - {text: "`etudiant || age > 65`", correct: true}
      - {text: "`etudiant && age > 65`", correct: false}
      - {text: "`!etudiant && age > 65`", correct: false}
    answer: "« Ou » s'écrit `||`."
