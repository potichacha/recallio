notion: variables
lesson: |-
  Une **variable** est une boîte qui a un **nom** et contient une **valeur** : `int age = 12;` crée la boîte `age`, qui
  contient 12. Ensuite, écrire `age` utilise sa valeur.

  Un nom de variable commence par une minuscule, sans espace ni accent, et colle les mots avec des majuscules :
  `prixDuBillet`. Un bon nom dit ce que contient la boîte.
tour:
  - title: Les variables
    text: |-
      Une **variable** est une boîte qui porte un **nom** et contient une **valeur**. On la crée en écrivant le type de
      valeur, le nom, le signe `=` et la valeur : `int age = 12;` crée une boîte nommée `age`, qui contient le nombre
      12.

      Ensuite, partout où l'on écrit `age`, l'ordinateur utilise la valeur de la boîte. Une variable évite de répéter
      une valeur, et donne un **sens** à un nombre : `prixDuBillet` se lit mieux que `8`.

      Un nom de variable commence par une minuscule, sans espace ni accent, et colle les mots avec des majuscules.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 12;
              String prenom = "Léa";
              IO.println(prenom + " a " + age + " ans");
              IO.println("Dans 10 ans, " + prenom + " aura " + (age + 10) + " ans");
          }
      output: |-
        Léa a 12 ans
        Dans 10 ans, Léa aura 22 ans
    task:
      instructions: |-
        Crée une variable `ville` qui contient `"Lyon"`, et utilise-la pour afficher `Léa habite à Lyon`.
      starter:
        Main.java: |-
          void main() {
              String prenom = "Léa";
              IO.println(prenom + " habite à ...");
          }
      solution:
        Main.java: |-
          void main() {
              String prenom = "Léa";
              String ville = "Lyon";
              IO.println(prenom + " habite à " + ville);
          }
      output: |-
        Léa habite à Lyon
cards:
  - key: cours
    format: course
    question: "Qu'est-ce qu'une variable ?"
    answer: "Une boîte qui a un **nom** et contient une **valeur**."
  - key: vrai-faux-1
    format: true-false
    question: "`int age = 12;` crée une variable nommée `age` qui contient 12."
    truth: true
    answer: "Oui : le type, le nom, `=`, puis la valeur."
  - key: vrai-faux-2
    format: true-false
    question: "`prix du billet` est un nom de variable valable."
    truth: false
    answer: "Non : un nom n'a pas d'espace. On écrit `prixDuBillet`."
  - key: qcm-1
    format: multiple-choice
    question: "Après `int age = 12;`, qu'affiche `IO.println(age + 1)` ?"
    choices:
      - {text: "13", correct: true}
      - {text: "age + 1", correct: false}
      - {text: "121", correct: false}
    answer: "`age` est remplacé par sa valeur, 12, puis le calcul est fait."
  - key: qcm-2
    format: multiple-choice
    question: "Quel nom de variable suit l'habitude de Java ?"
    choices:
      - {text: "`nombreDeJoueurs`", correct: true}
      - {text: "`NombreDeJoueurs`", correct: false}
      - {text: "`nombre_de_joueurs`", correct: false}
    answer: "Une minuscule au début, et une majuscule à chaque nouveau mot."
