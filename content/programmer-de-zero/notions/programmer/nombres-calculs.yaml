notion: nombres-calculs
lesson: |-
  `+`, `-`, `*` et `/` additionnent, soustraient, multiplient et divisent. Les **parenthèses** fixent l'ordre :
  `(2 + 3) * 4` vaut 20, et `2 + 3 * 4` vaut 14.

  Entre deux entiers, `/` donne un entier : `7 / 2` vaut `3`, et `7 % 2` (le reste) vaut `1`. Pour un résultat à
  virgule, on écrit un nombre à virgule, avec un **point** : `7.0 / 2` vaut `3.5`.
tour:
  - title: Les nombres et les calculs
    text: |-
      L'ordinateur calcule très bien : `+` additionne, `-` soustrait, `*` multiplie et `/` divise. Les **parenthèses**
      fixent l'ordre des calculs, comme en mathématiques : `(2 + 3) * 4` vaut 20, alors que `2 + 3 * 4` vaut 14.

      Attention à la division : entre deux nombres **entiers**, `7 / 2` donne `3`, sans virgule, et le reste de la
      division s'obtient avec `%`. Pour un résultat à virgule, on écrit un nombre à virgule : `7.0 / 2` donne `3.5`. En
      Java, la virgule des nombres s'écrit avec un **point**.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println(2 + 3 * 4);
              IO.println((2 + 3) * 4);
              IO.println(7 / 2);
              IO.println(7 % 2);
              IO.println(7.0 / 2);
          }
      output: |-
        14
        20
        3
        1
        3.5
    task:
      instructions: |-
        Une pizza coûte 12 euros, et une boisson 2.5 euros. Fais calculer le prix de trois pizzas et d'une boisson : le
        programme doit afficher `38.5`.
      starter:
        Main.java: |-
          void main() {
              IO.println(12);
          }
      solution:
        Main.java: |-
          void main() {
              IO.println(3 * 12 + 2.5);
          }
      output: |-
        38.5
cards:
  - key: cours
    format: course
    question: "Combien vaut `2 + 3 * 4` en Java ?"
    choices:
      - {text: "`14`", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`24`", correct: false}
      - {text: "`9`", correct: false}
    answer: "`14` : la multiplication passe avant l'addition, comme en mathématiques. On calcule `3 * 4 = 12`, puis `2 + 12`."
  - key: vrai-faux-1
    format: true-false
    question: "`7 / 2` vaut `3.5` en Java."
    truth: false
    answer: "Non : entre deux entiers, la division donne un entier, `3`. `7.0 / 2` donnerait `3.5`."
  - key: vrai-faux-2
    format: true-false
    question: "Les parenthèses changent l'ordre des calculs."
    truth: true
    answer: "Oui : `(2 + 3) * 4` vaut 20."
  - key: qcm-1
    format: multiple-choice
    question: "Que vaut `7 % 2` ?"
    choices:
      - {text: "1", correct: true}
      - {text: "3,5", correct: false}
      - {text: "14", correct: false}
    answer: "`%` donne le reste de la division entière : 7 = 2 × 3 + 1."
  - key: qcm-2
    format: multiple-choice
    question: "Comment s'écrit le nombre trois et demi en Java ?"
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`3,5`", correct: false}
      - {text: "`3 1/2`", correct: false}
    answer: "La virgule des nombres s'écrit avec un point."
