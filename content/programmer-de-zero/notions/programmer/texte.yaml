notion: texte
lesson: |-
  Un texte est une **chaîne de caractères**, écrite entre guillemets. `+` **assemble** deux chaînes : `"Bon" + "jour"`
  donne `"Bonjour"`.

  `"2" + "3"` donne `"23"`, pas 5 : ce sont deux textes. Les espaces font partie du texte, et se mettent dans les
  guillemets.
tour:
  - title: Le texte
    text: |-
      Un morceau de texte s'appelle une **chaîne de caractères** (*string* en anglais), et s'écrit entre guillemets. Les
      guillemets ne font pas partie du texte : ils disent seulement où il commence et où il finit.

      `+` **assemble** deux chaînes : `"Bon" + "jour"` donne `Bonjour`. Attention : `"2" + "3"` donne `23`, et non 5,
      car ce sont deux textes. Les espaces comptent : il faut les mettre dans les guillemets.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("Bon" + "jour");
              IO.println("2" + "3");
              IO.println(2 + 3);
              IO.println("Ada" + " " + "Lovelace");
          }
      output: |-
        Bonjour
        23
        5
        Ada Lovelace
    task:
      instructions: |-
        Assemble les deux morceaux de texte avec `+`, pour afficher `Je m'appelle Grace`. N'oublie pas l'espace.
      starter:
        Main.java: |-
          void main() {
              IO.println("Je m'appelle");
              IO.println("Grace");
          }
      solution:
        Main.java: |-
          void main() {
              IO.println("Je m'appelle" + " " + "Grace");
          }
      output: |-
        Je m'appelle Grace
cards:
  - key: cours
    format: course
    question: "Comment s'appelle un morceau de texte en programmation ?"
    choices:
      - {text: "Une chaîne de caractères (*string*)", correct: true}
      - {text: "Une ligne de commentaire (*comment*)", correct: false}
      - {text: "Un nombre entier (`int`)", correct: false}
      - {text: "Une valeur vraie ou fausse (`boolean`)", correct: false}
    answer: "Une **chaîne de caractères** (*string* en anglais), écrite entre guillemets."
  - key: vrai-faux-1
    format: true-false
    question: "`\"2\" + \"3\"` donne `\"23\"`."
    truth: true
    answer: "Oui : ce sont deux textes, que `+` assemble."
  - key: vrai-faux-2
    format: true-false
    question: "Les guillemets font partie du texte affiché."
    truth: false
    answer: "Non : ils disent seulement où le texte commence et où il finit."
  - key: qcm-1
    format: multiple-choice
    question: "Qu'affiche `IO.println(\"Bon\" + \"jour\")` ?"
    choices:
      - {text: "Bonjour", correct: true}
      - {text: "Bon jour", correct: false}
      - {text: "\"Bon\" + \"jour\"", correct: false}
    answer: "`+` colle les deux textes, sans ajouter d'espace."
  - key: qcm-2
    format: multiple-choice
    question: "Que faut-il pour afficher `Ada Lovelace` à partir de `\"Ada\"` et `\"Lovelace\"` ?"
    choices:
      - {text: "`\"Ada\" + \" \" + \"Lovelace\"`", correct: true}
      - {text: "`\"Ada\" + \"Lovelace\"`", correct: false}
      - {text: "`\"Ada\" - \"Lovelace\"`", correct: false}
    answer: "L'espace est un caractère comme un autre : il faut l'ajouter entre guillemets."
