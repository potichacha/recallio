notion: tant-que
lesson: |-
  Une **boucle** répète des instructions. `while (condition) { … }` répète son bloc **tant que** la condition est vraie,
  en la testant avant chaque tour.

  Quelque chose dans le bloc doit finir par rendre la condition fausse ; sinon, la boucle ne s'arrête jamais.
tour:
  - title: "Répéter : while"
    text: |-
      Pour **répéter** des instructions, on écrit une **boucle**. `while` (« tant que ») répète son bloc **tant que** sa
      condition est vraie : l'ordinateur teste la condition, exécute le bloc, teste de nouveau, et ainsi de suite.

      Quelque chose, dans le bloc, doit finir par rendre la condition fausse ; sinon, la boucle ne s'arrête jamais. Ici,
      `compte--` retire 1 à `compte` à chaque tour, jusqu'à 0.
    example:
      files:
        Main.java: |-
          void main() {
              int compte = 3;
              while (compte > 0) {
                  IO.println(compte + "...");
                  compte--;
              }
              IO.println("Décollage !");
          }
      output: |-
        3...
        2...
        1...
        Décollage !
    task:
      instructions: |-
        Fais partir le compte à rebours de 5 au lieu de 3.
      starter:
        Main.java: |-
          void main() {
              int compte = 3;
              while (compte > 0) {
                  IO.println(compte + "...");
                  compte--;
              }
              IO.println("Décollage !");
          }
      solution:
        Main.java: |-
          void main() {
              int compte = 5;
              while (compte > 0) {
                  IO.println(compte + "...");
                  compte--;
              }
              IO.println("Décollage !");
          }
      output: |-
        5...
        4...
        3...
        2...
        1...
        Décollage !
cards:
  - key: cours
    format: course
    question: "Que fait `while (condition) { … }` ?"
    answer: "Il répète son bloc **tant que** la condition est vraie."
  - key: vrai-faux-1
    format: true-false
    question: "Une boucle `while` dont la condition reste toujours vraie ne s'arrête jamais."
    truth: true
    answer: "Oui : quelque chose dans le bloc doit finir par rendre la condition fausse."
  - key: vrai-faux-2
    format: true-false
    question: "La condition d'un `while` n'est testée qu'une seule fois, au début."
    truth: false
    answer: "Non : elle est testée avant chaque tour."
  - key: qcm-1
    format: multiple-choice
    question: "Combien de fois `compte` s'affiche-t-il avec `int compte = 3; while (compte > 0) { IO.println(compte); compte--; }` ?"
    choices:
      - {text: "3 fois", correct: true}
      - {text: "2 fois", correct: false}
      - {text: "Indéfiniment", correct: false}
    answer: "3, 2, puis 1 ; à 0, la condition devient fausse."
  - key: qcm-2
    format: multiple-choice
    question: "Comment s'appelle une suite d'instructions qui se répète ?"
    choices:
      - {text: "Une boucle", correct: true}
      - {text: "Une variable", correct: false}
      - {text: "Une condition", correct: false}
    answer: "`while` et `for` sont des boucles."
