notion: programme
lesson: |-
  Un **programme** est une suite d'**instructions** que l'ordinateur exécute une par une, **dans l'ordre**, sans rien
  deviner. On l'écrit dans un **langage de programmation**, ici Java.

  En Java 25, un petit programme tient dans `void main() { … }` : ses instructions s'écrivent entre les accolades, et le
  programme commence par la première.
tour:
  - title: Un programme, c'est quoi ?
    text: |-
      Bienvenue ! Ce Tour est fait pour toi si tu n'as **jamais programmé**.

      Un **programme** est une liste d'**instructions** que l'ordinateur exécute une par une, **dans l'ordre**, sans
      jamais deviner ce que tu voulais dire. Ces instructions s'écrivent dans un **langage de programmation** : ici,
      Java.

      Voici un programme complet. Ses deux instructions sont entre les accolades de `void main()` : c'est là que le
      programme commence. Clique sur **Exécuter** : l'ordinateur les suit de haut en bas, et affiche deux lignes.

      Essaie : échange les deux lignes, puis exécute de nouveau. L'affichage suit l'ordre exact du programme.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("Bonjour !");
              IO.println("Je suis ton premier programme.");
          }
      output: |-
        Bonjour !
        Je suis ton premier programme.
    task:
      instructions: |-
        Ajoute une troisième instruction, après les deux autres, qui affiche `Au revoir !`.
      starter:
        Main.java: |-
          void main() {
              IO.println("Bonjour !");
              IO.println("Je suis ton premier programme.");
          }
      solution:
        Main.java: |-
          void main() {
              IO.println("Bonjour !");
              IO.println("Je suis ton premier programme.");
              IO.println("Au revoir !");
          }
      output: |-
        Bonjour !
        Je suis ton premier programme.
        Au revoir !
cards:
  - key: cours
    format: course
    question: "Qu'est-ce qu'un programme ?"
    choices:
      - {text: "Des instructions que l'ordinateur exécute toutes en même temps", correct: false}
      - {text: "Des instructions que l'ordinateur exécute une par une, dans l'ordre", correct: true}
      - {text: "Un texte en français que l'ordinateur comprend", correct: false}
      - {text: "Un appareil qu'on branche à l'ordinateur", correct: false}
    answer: "Une suite d'**instructions** que l'ordinateur exécute une par une, dans l'ordre."
  - key: vrai-faux-1
    format: true-false
    question: "L'ordinateur exécute les instructions d'un programme dans l'ordre où elles sont écrites."
    truth: true
    answer: "Oui : de haut en bas, une par une."
  - key: vrai-faux-2
    format: true-false
    question: "L'ordinateur devine ce que tu voulais dire quand une instruction est mal écrite."
    truth: false
    answer: "Non : il suit exactement ce qui est écrit, et refuse ce qu'il ne comprend pas."
  - key: qcm-1
    format: multiple-choice
    question: "Par quoi commence un programme Java 25 écrit en fichier compact ?"
    choices:
      - {text: "Par la fonction `void main()`", correct: true}
      - {text: "Par la dernière ligne du fichier", correct: false}
      - {text: "Par un ordre choisi au hasard", correct: false}
    answer: "Le programme commence par la première instruction de `void main()`."
  - key: qcm-2
    format: multiple-choice
    question: "Dans quel langage sont écrits les programmes de ce Tour ?"
    choices:
      - {text: "Java", correct: true}
      - {text: "Python", correct: false}
      - {text: "Go", correct: false}
    answer: "Java 25, dont les fichiers source compacts sont faits pour débuter."
