notion: regrouper
lesson: |-
  Un **record** crée un type qui regroupe plusieurs informations : `record Livre(String titre, int pages) {}`. On en
  fabrique un avec `new Livre("Momo", 304)`, et on lit chaque information avec son nom : `livre.titre()`.
tour:
  - title: Regrouper des informations
    text: |-
      Pour décrire une chose qui a plusieurs informations (un livre a un titre et un nombre de pages), on crée son
      propre type, avec un **record** : `record Livre(String titre, int pages) {}`.

      On fabrique ensuite un livre avec `new Livre("Le Petit Prince", 96)`, et on lit chaque information avec son nom
      suivi de parenthèses : `livre.titre()`. Une liste de livres se manipule comme une liste de nombres.
    example:
      files:
        Main.java: |-
          record Livre(String titre, int pages) {}

          void main() {
              Livre livre = new Livre("Le Petit Prince", 96);
              IO.println(livre.titre() + " : " + livre.pages() + " pages");

              List<Livre> etagere = List.of(livre, new Livre("Matilda", 240), new Livre("Momo", 304));
              int totalPages = 0;
              for (Livre l : etagere) {
                  totalPages += l.pages();
              }
              IO.println("pages à lire : " + totalPages);
          }
      output: |-
        Le Petit Prince : 96 pages
        pages à lire : 640
    task:
      instructions: |-
        Ajoute au record une troisième information, `String auteur`, et fais afficher
        `Le Petit Prince, de Saint-Exupéry`.
      starter:
        Main.java: |-
          record Livre(String titre, int pages) {}

          void main() {
              Livre livre = new Livre("Le Petit Prince", 96);
              IO.println(livre.titre());
          }
      solution:
        Main.java: |-
          record Livre(String titre, int pages, String auteur) {}

          void main() {
              Livre livre = new Livre("Le Petit Prince", 96, "Saint-Exupéry");
              IO.println(livre.titre() + ", de " + livre.auteur());
          }
      output: |-
        Le Petit Prince, de Saint-Exupéry
cards:
  - key: cours
    format: course
    question: "À quoi sert un `record` ?"
    answer: "À créer un type qui regroupe plusieurs informations, comme le titre et les pages d'un livre."
  - key: vrai-faux-1
    format: true-false
    question: "Après `record Livre(String titre, int pages) {}`, `livre.titre()` donne le titre."
    truth: true
    answer: "Oui : chaque information se lit avec son nom suivi de parenthèses."
  - key: vrai-faux-2
    format: true-false
    question: "On fabrique un livre en écrivant seulement `Livre(\"Momo\", 304)`."
    truth: false
    answer: "Non : il faut `new` : `new Livre(\"Momo\", 304)`."
  - key: qcm-1
    format: multiple-choice
    question: "Que vaut `new Livre(\"Momo\", 304).pages()` ?"
    choices:
      - {text: "304", correct: true}
      - {text: "Momo", correct: false}
      - {text: "1", correct: false}
    answer: "C'est la seconde information donnée à la création."
  - key: qcm-2
    format: multiple-choice
    question: "Peut-on mettre des records dans une liste ?"
    choices:
      - {text: "Oui, comme des nombres ou du texte", correct: true}
      - {text: "Non, jamais", correct: false}
      - {text: "Seulement un seul", correct: false}
    answer: "`List<Livre>` est une liste de livres."
