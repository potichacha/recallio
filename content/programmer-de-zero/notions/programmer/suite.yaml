notion: suite
lesson: |-
  Afficher, calculer, ranger dans des variables, décider avec `if`, répéter avec des boucles, découper en fonctions,
  ranger dans des listes : c'est le socle de **tous** les langages. Les mots changent d'un langage à l'autre, les idées
  restent.

  Pour continuer, le Tour de Java reprend ces bases et va beaucoup plus loin.
tour:
  - title: Et maintenant ?
    text: |-
      Tu sais maintenant afficher, calculer, ranger des valeurs dans des variables, décider avec `if`, répéter avec des
      boucles, découper en fonctions et ranger des données dans des listes. C'est le socle de **tous** les langages de
      programmation : les mots changent, les idées restent.

      Pour continuer, le **Tour de Java** reprend ces bases plus vite, et va beaucoup plus loin : les classes et les
      objets, les erreurs, les collections, les fichiers. Les cartes de chaque notion t'aideront à retenir ce que tu as
      appris, grâce à la révision espacée.

      Ce dernier programme réunit presque tout ce que tu as vu.
    example:
      files:
        Main.java: |-
          record Eleve(String prenom, List<Integer> notes) {}

          double moyenne(List<Integer> notes) {
              double total = 0;
              for (int note : notes) {
                  total += note;
              }
              return total / notes.size();
          }

          void main() {
              List<Eleve> classe = List.of(
                      new Eleve("Léa", List.of(14, 16, 12)),
                      new Eleve("Sam", List.of(9, 11, 10)));
              for (Eleve eleve : classe) {
                  double m = moyenne(eleve.notes());
                  String mention;
                  if (m >= 12) {
                      mention = "bien";
                  } else {
                      mention = "à encourager";
                  }
                  IO.println(eleve.prenom() + " : " + m + " (" + mention + ")");
              }
          }
      output: |-
        Léa : 14.0 (bien)
        Sam : 10.0 (à encourager)
cards:
  - key: cours
    format: course
    question: "Quelles sont les bases de la programmation vues dans ce Tour ?"
    answer: "Afficher, calculer, les variables, `if`, les boucles, les fonctions et les listes."
  - key: vrai-faux-1
    format: true-false
    question: "Les idées de ce Tour se retrouvent dans d'autres langages de programmation."
    truth: true
    answer: "Oui : les mots changent d'un langage à l'autre, les idées restent."
  - key: vrai-faux-2
    format: true-false
    question: "Une fois ce Tour fini, il n'y a plus rien à apprendre en Java."
    truth: false
    answer: "Non : le Tour de Java va bien plus loin, avec les classes, les erreurs, les collections, les fichiers."
  - key: qcm-1
    format: multiple-choice
    question: "Quel Tour suivre ensuite pour continuer en Java ?"
    choices:
      - {text: "Le Tour de Java", correct: true}
      - {text: "Aucun", correct: false}
      - {text: "Le même, en boucle", correct: false}
    answer: "Il reprend ces bases plus vite, puis va beaucoup plus loin."
  - key: qcm-2
    format: multiple-choice
    question: "À quoi servent les cartes de révision de chaque notion ?"
    choices:
      - {text: "À retenir sur la durée, grâce à la révision espacée", correct: true}
      - {text: "À rien", correct: false}
      - {text: "À remplacer le Tour", correct: false}
    answer: "Elles reviennent au bon moment, avant qu'on oublie."
