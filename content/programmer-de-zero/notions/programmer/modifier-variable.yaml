notion: modifier-variable
lesson: |-
  `score = 15;` (sans le type devant) remplace la valeur d'une variable qui existe déjà. On peut partir de l'ancienne
  valeur : `score = score + 5;`.

  Raccourcis : `score += 5;` ajoute 5, et `score++;` ajoute 1. Le `=` de Java ne veut pas dire « égal », mais « range
  dans ».
tour:
  - title: Changer une variable
    text: |-
      Le contenu d'une variable peut **changer** : `score = 15;`, sans `int` devant, remplace l'ancienne valeur. On peut
      même calculer la nouvelle valeur à partir de l'ancienne : `score = score + 5;` prend la valeur actuelle, ajoute 5,
      et range le résultat dans la même boîte.

      C'est si courant qu'il existe des raccourcis : `score += 5;` fait la même chose, et `score++;` ajoute 1.

      Attention : le `=` de Java n'est pas le « égal » des mathématiques. Il veut dire « range dans ».
    example:
      files:
        Main.java: |-
          void main() {
              int score = 10;
              IO.println("score : " + score);
              score = score + 5;
              IO.println("score : " + score);
              score += 20;
              score++;
              IO.println("score : " + score);
          }
      output: |-
        score : 10
        score : 15
        score : 36
    task:
      instructions: |-
        Avant le dernier affichage, double le score avec `score = score * 2;` : la dernière ligne affichée doit devenir
        `score : 72`.
      starter:
        Main.java: |-
          void main() {
              int score = 10;
              IO.println("score : " + score);
              score = score + 5;
              IO.println("score : " + score);
              score += 20;
              score++;
              IO.println("score : " + score);
          }
      solution:
        Main.java: |-
          void main() {
              int score = 10;
              IO.println("score : " + score);
              score = score + 5;
              IO.println("score : " + score);
              score += 20;
              score++;
              score = score * 2;
              IO.println("score : " + score);
          }
      output: |-
        score : 10
        score : 15
        score : 72
cards:
  - key: cours
    format: course
    question: "Que fait `score = score + 5;` ?"
    choices:
      - {text: "Il ajoute 5 à la valeur de `score`", correct: true}
      - {text: "Il vérifie que `score` vaut `score + 5`", correct: false}
      - {text: "Rien : la ligne est refusée, car fausse en mathématiques", correct: false}
      - {text: "Il crée une deuxième variable `score`", correct: false}
    answer: "Il prend la valeur actuelle de `score`, ajoute 5, et range le résultat dans `score`. Le `=` ne compare pas : il range une valeur."
  - key: vrai-faux-1
    format: true-false
    question: "`score++;` ajoute 1 à `score`."
    truth: true
    answer: "Oui : c'est un raccourci de `score = score + 1;`."
  - key: vrai-faux-2
    format: true-false
    question: "En Java, `=` veut dire « est égal à », comme en mathématiques."
    truth: false
    answer: "Non : il veut dire « range dans ». L'égalité se teste avec `==`."
  - key: qcm-1
    format: multiple-choice
    question: "Après `int vies = 3; vies = vies - 1;`, que vaut `vies` ?"
    choices:
      - {text: "2", correct: true}
      - {text: "3", correct: false}
      - {text: "-1", correct: false}
    answer: "On part de 3, on retire 1, et on range 2 dans `vies`."
  - key: qcm-2
    format: multiple-choice
    question: "Quel raccourci écrit `total = total + 10;` ?"
    choices:
      - {text: "`total += 10;`", correct: true}
      - {text: "`total =+ 10;`", correct: false}
      - {text: "`total ++ 10;`", correct: false}
    answer: "`+=` ajoute à la valeur actuelle."
