notion: renvoyer
lesson: |-
  Une fonction peut calculer une valeur et la **renvoyer** avec `return` : on écrit le type du résultat à la place de
  `void`, comme `int carre(int n) { return n * n; }`.

  L'appel `carre(4)` est remplacé par son résultat, 16, qu'on peut afficher ou ranger dans une variable.
tour:
  - title: Renvoyer un résultat
    text: |-
      Une fonction peut **calculer** une valeur et la rendre à qui l'a appelée, avec `return`. On écrit alors le type du
      résultat à la place de `void` : `int carre(int n)` renvoie un entier.

      L'appel `carre(4)` est remplacé par son résultat, 16 : on peut l'afficher, le ranger dans une variable, ou
      l'utiliser dans un calcul. `return` termine la fonction aussitôt.
    example:
      files:
        Main.java: |-
          int carre(int n) {
              return n * n;
          }

          double prixAvecTaxe(double prix) {
              return prix * 1.2;
          }

          void main() {
              IO.println(carre(4));
              int resultat = carre(3) + carre(4);
              IO.println(resultat);
              IO.println(prixAvecTaxe(10));
          }
      output: |-
        16
        25
        12.0
    task:
      instructions: |-
        Écris une fonction `double moyenne(double a, double b)`, qui renvoie la moyenne de deux notes, et affiche
        `moyenne(12, 17)` : le programme doit afficher `14.5`.
      starter:
        Main.java: |-
          void main() {
              IO.println(12 + 17);
          }
      solution:
        Main.java: |-
          double moyenne(double a, double b) {
              return (a + b) / 2;
          }

          void main() {
              IO.println(moyenne(12, 17));
          }
      output: |-
        14.5
cards:
  - key: cours
    format: course
    question: "À quoi sert `return` ?"
    choices:
      - {text: "À afficher un résultat à l'écran", correct: false}
      - {text: "À recommencer la fonction depuis le début", correct: false}
      - {text: "À revenir à la ligne précédente", correct: false}
      - {text: "À renvoyer un résultat à qui a appelé la fonction", correct: true}
    answer: "À **renvoyer** un résultat à qui a appelé la fonction. Il n'affiche rien : pour afficher, c'est `IO.println`."
  - key: vrai-faux-1
    format: true-false
    question: "Une fonction qui renvoie un `int` s'écrit avec `int` à la place de `void`."
    truth: true
    answer: "Oui : `int carre(int n) { return n * n; }`."
  - key: vrai-faux-2
    format: true-false
    question: "Les instructions écrites après un `return` s'exécutent quand même."
    truth: false
    answer: "Non : `return` termine la fonction aussitôt."
  - key: qcm-1
    format: multiple-choice
    question: "Avec `int carre(int n) { return n * n; }`, que vaut `carre(3) + carre(4)` ?"
    choices:
      - {text: "25", correct: true}
      - {text: "7", correct: false}
      - {text: "49", correct: false}
    answer: "9 + 16 = 25."
  - key: qcm-2
    format: multiple-choice
    question: "Que veut dire `void` devant une fonction ?"
    choices:
      - {text: "Qu'elle ne renvoie rien", correct: true}
      - {text: "Qu'elle est vide", correct: false}
      - {text: "Qu'elle renvoie zéro", correct: false}
    answer: "Une fonction `void` fait quelque chose, mais ne rend pas de valeur."
