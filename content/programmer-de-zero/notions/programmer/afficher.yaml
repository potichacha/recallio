notion: afficher
lesson: |-
  `IO.println(…)` affiche ce qu'on lui donne, puis passe à la ligne ; `IO.print(…)` affiche sans passer à la ligne.

  - Le texte s'écrit entre **guillemets** : `"Bonjour"`.
  - Un nombre s'écrit sans guillemets, et l'ordinateur calcule : `IO.println(2 + 3)` affiche `5`.
  - Chaque instruction se termine par un **point-virgule**.
tour:
  - title: Afficher du texte et des nombres
    text: |-
      `IO.println(…)` **affiche** ce qu'on lui donne entre les parenthèses, puis passe à la ligne. Un texte s'écrit
      entre **guillemets**. Un nombre s'écrit sans guillemets, et l'ordinateur peut calculer avec : `IO.println(2 + 3)`
      affiche `5`.

      `IO.print(…)`, sans `ln`, affiche sans passer à la ligne. Et le signe `+` entre un texte et un nombre les
      **colle** l'un à l'autre.

      Chaque instruction se termine par un **point-virgule** : c'est la ponctuation de Java.
    example:
      files:
        Main.java: |-
          void main() {
              IO.println("J'apprends à programmer");
              IO.println(2 + 3);
              IO.println("2 + 3 = " + (2 + 3));
              IO.print("Sur une ");
              IO.println("même ligne");
          }
      output: |-
        J'apprends à programmer
        5
        2 + 3 = 5
        Sur une même ligne
    task:
      instructions: |-
        Fais afficher `10 x 7 = 70`, en laissant l'ordinateur calculer `10 * 7` : en Java, `*` multiplie.
      starter:
        Main.java: |-
          void main() {
              IO.println("10 x 7 = ");
          }
      solution:
        Main.java: |-
          void main() {
              IO.println("10 x 7 = " + (10 * 7));
          }
      output: |-
        10 x 7 = 70
cards:
  - key: cours
    format: course
    question: "Que fait `IO.println(\"Salut\")` ?"
    answer: "Il affiche `Salut`, puis passe à la ligne."
  - key: vrai-faux-1
    format: true-false
    question: "`IO.print` passe à la ligne après avoir affiché."
    truth: false
    answer: "Non : c'est `IO.println` qui passe à la ligne ; `IO.print` reste sur la même ligne."
  - key: vrai-faux-2
    format: true-false
    question: "En Java, chaque instruction se termine par un point-virgule."
    truth: true
    answer: "Oui : le point-virgule est la ponctuation de Java."
  - key: qcm-1
    format: multiple-choice
    question: "Qu'affiche `IO.println(2 + 3)` ?"
    choices:
      - {text: "5", correct: true}
      - {text: "2 + 3", correct: false}
      - {text: "23", correct: false}
    answer: "Sans guillemets, `2 + 3` est un calcul : l'ordinateur affiche son résultat."
  - key: qcm-2
    format: multiple-choice
    question: "Comment écrit-on un texte à afficher ?"
    choices:
      - {text: "Entre guillemets : `\"Bonjour\"`", correct: true}
      - {text: "Sans rien autour : `Bonjour`", correct: false}
      - {text: "Entre parenthèses seulement : `(Bonjour)`", correct: false}
    answer: "Les guillemets disent où le texte commence et où il finit."
