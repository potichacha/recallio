notion: chercher
lesson: |-
  Une boucle et un `if` répondent aux questions sur une liste :

  - **compter** les éléments qui vérifient une condition ;
  - trouver le **plus grand** : on garde le meilleur vu jusqu'ici, et on le remplace dès qu'on trouve mieux ;
  - savoir si une valeur est présente : `liste.contains(valeur)`.
tour:
  - title: Chercher dans une liste
    text: |-
      En combinant une boucle et un `if`, on répond aux questions courantes sur une liste :

      - **compter** les éléments qui vérifient une condition ;
      - trouver le **plus grand** : on garde le meilleur vu jusqu'ici, et on le remplace dès qu'on trouve mieux ;
      - savoir si une valeur y est, avec `liste.contains(valeur)`.
    example:
      files:
        Main.java: |-
          void main() {
              List<Integer> notes = List.of(12, 15, 9, 18, 7);
              int auMoinsDix = 0;
              int meilleure = notes.get(0);
              for (int note : notes) {
                  if (note >= 10) {
                      auMoinsDix++;
                  }
                  if (note > meilleure) {
                      meilleure = note;
                  }
              }
              IO.println("notes d'au moins 10 : " + auMoinsDix);
              IO.println("meilleure note : " + meilleure);
              IO.println("y a-t-il un 9 ? " + notes.contains(9));
          }
      output: |-
        notes d'au moins 10 : 3
        meilleure note : 18
        y a-t-il un 9 ? true
    task:
      instructions: |-
        Sur le même modèle, trouve la **plus petite** note : le programme doit afficher `plus petite note : 7`.
      starter:
        Main.java: |-
          void main() {
              List<Integer> notes = List.of(12, 15, 9, 18, 7);
              IO.println("plus petite note : ?");
          }
      solution:
        Main.java: |-
          void main() {
              List<Integer> notes = List.of(12, 15, 9, 18, 7);
              int plusPetite = notes.get(0);
              for (int note : notes) {
                  if (note < plusPetite) {
                      plusPetite = note;
                  }
              }
              IO.println("plus petite note : " + plusPetite);
          }
      output: |-
        plus petite note : 7
cards:
  - key: cours
    format: course
    question: "Comment trouver le plus grand élément d'une liste ?"
    answer: "On garde le plus grand vu jusqu'ici, et on le remplace dès qu'on en trouve un plus grand."
  - key: vrai-faux-1
    format: true-false
    question: "`liste.contains(9)` dit si la valeur 9 est dans la liste."
    truth: true
    answer: "Oui : il renvoie `true` ou `false`."
  - key: vrai-faux-2
    format: true-false
    question: "Pour compter les notes d'au moins 10, il faut deux listes."
    truth: false
    answer: "Non : une variable qu'on augmente dans la boucle suffit."
  - key: qcm-1
    format: multiple-choice
    question: "Dans `List.of(12, 15, 9, 18, 7)`, combien de notes valent au moins 10 ?"
    choices:
      - {text: "3", correct: true}
      - {text: "5", correct: false}
      - {text: "2", correct: false}
    answer: "12, 15 et 18."
  - key: qcm-2
    format: multiple-choice
    question: "Avec quelle valeur commence-t-on la recherche du plus grand ?"
    choices:
      - {text: "Le premier élément de la liste", correct: true}
      - {text: "Toujours 100", correct: false}
      - {text: "Le dernier mot du programme", correct: false}
    answer: "Partir du premier élément garantit une valeur de la liste."
