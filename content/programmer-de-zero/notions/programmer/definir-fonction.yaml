notion: definir-fonction
lesson: |-
  Une **fonction** est un morceau de programme qui a un **nom** : `void direBonjour() { … }`. On l'**appelle** en
  écrivant son nom et des parenthèses : `direBonjour();`, autant de fois qu'on veut.

  `void main()` est une fonction : celle par laquelle le programme commence.
tour:
  - title: Les fonctions
    text: |-
      Une **fonction** est un morceau de programme qui porte un **nom**. On l'écrit une fois, et on l'**appelle** autant
      de fois qu'on veut, en écrivant son nom suivi de parenthèses : `direBonjour();`.

      `void main()` est d'ailleurs une fonction : celle par laquelle le programme commence. Les autres s'écrivent à côté
      d'elle, avec la même forme.

      Les fonctions évitent de répéter du code, et donnent un nom à ce qu'il fait.
    example:
      files:
        Main.java: |-
          void direBonjour() {
              IO.println("Bonjour !");
              IO.println("Bienvenue dans le programme.");
          }

          void main() {
              direBonjour();
              IO.println("...");
              direBonjour();
          }
      output: |-
        Bonjour !
        Bienvenue dans le programme.
        ...
        Bonjour !
        Bienvenue dans le programme.
    task:
      instructions: |-
        Écris une fonction `tracerLigne()` qui affiche `----------`, et appelle-la avant et après la ligne qui affiche
        `Titre`.
      starter:
        Main.java: |-
          void main() {
              IO.println("Titre");
          }
      solution:
        Main.java: |-
          void tracerLigne() {
              IO.println("----------");
          }

          void main() {
              tracerLigne();
              IO.println("Titre");
              tracerLigne();
          }
      output: |-
        ----------
        Titre
        ----------
cards:
  - key: cours
    format: course
    question: "Comment appelle-t-on une fonction nommée `direBonjour` ?"
    choices:
      - {text: "`call direBonjour();`", correct: false}
      - {text: "`direBonjour;`", correct: false}
      - {text: "`direBonjour();`", correct: true}
      - {text: "`void direBonjour()`", correct: false}
    answer: "`direBonjour();`, avec les parenthèses. `void direBonjour() { … }` **définit** la fonction ; on l'appelle ensuite par son nom suivi de `()`."
  - key: vrai-faux-1
    format: true-false
    question: "Une fonction s'écrit une fois et peut s'appeler plusieurs fois."
    truth: true
    answer: "Oui : c'est ce qui évite de répéter du code."
  - key: vrai-faux-2
    format: true-false
    question: "`void main()` n'est pas une fonction."
    truth: false
    answer: "Si : c'est la fonction par laquelle le programme commence."
  - key: qcm-1
    format: multiple-choice
    question: "Que fait un programme qui appelle deux fois `direBonjour()`, si elle affiche `Bonjour !` ?"
    choices:
      - {text: "Il affiche `Bonjour !` deux fois", correct: true}
      - {text: "Il l'affiche une seule fois", correct: false}
      - {text: "Il n'affiche rien", correct: false}
    answer: "Chaque appel exécute toutes les instructions de la fonction."
  - key: qcm-2
    format: multiple-choice
    question: "À quoi sert de donner un nom à un morceau de programme ?"
    choices:
      - {text: "À le réutiliser et à dire ce qu'il fait", correct: true}
      - {text: "À le rendre plus lent", correct: false}
      - {text: "À rien", correct: false}
    answer: "Un bon nom de fonction se lit comme une phrase : `tracerLigne()`."
