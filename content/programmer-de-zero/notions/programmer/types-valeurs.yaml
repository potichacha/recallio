notion: types-valeurs
lesson: |-
  Chaque variable a un **type**, qui ne change jamais :

  - `int` : un nombre entier (`42`) ;
  - `double` : un nombre à virgule (`3.5`) ;
  - `boolean` : vrai ou faux (`true`, `false`) ;
  - `String` : du texte (`"Bonjour"`), avec une majuscule.

  Mettre du texte dans une variable `int` est refusé dès la relecture.
tour:
  - title: Les types de valeurs
    text: |-
      Chaque variable a un **type**, qui dit quelle sorte de valeur elle peut contenir :

      - `int` : un nombre entier, comme `42` ;
      - `double` : un nombre à virgule, comme `1.52` ;
      - `boolean` : vrai ou faux, `true` ou `false` ;
      - `String` : du texte, avec une majuscule.

      Le type d'une variable ne change jamais : une variable `int` ne peut pas recevoir de texte, et le compilateur le
      refuse dès la relecture. Essaie : ajoute la ligne `age = "douze";` à la fin du programme.
    example:
      files:
        Main.java: |-
          void main() {
              int age = 12;
              double taille = 1.52;
              boolean aimeLesMaths = true;
              String prenom = "Léa";
              IO.println(prenom + " : " + age + " ans, " + taille + " m");
              IO.println("aime les maths : " + aimeLesMaths);
          }
      output: |-
        Léa : 12 ans, 1.52 m
        aime les maths : true
cards:
  - key: cours
    format: course
    question: "Quel type choisir pour un nombre à virgule ?"
    choices:
      - {text: "`String`", correct: false}
      - {text: "`int`", correct: false}
      - {text: "`double`", correct: true}
      - {text: "`boolean`", correct: false}
    answer: "`double`, comme pour `1.52` mètre. Un `int` est un nombre entier : il n'a pas de virgule."
  - key: vrai-faux-1
    format: true-false
    question: "Une variable de type `int` peut recevoir du texte."
    truth: false
    answer: "Non : son type ne change jamais, et le compilateur refuse."
  - key: vrai-faux-2
    format: true-false
    question: "Une variable `boolean` vaut `true` ou `false`."
    truth: true
    answer: "Oui : vrai ou faux, rien d'autre."
  - key: qcm-1
    format: multiple-choice
    question: "Quel type pour la variable `prenom` qui contient `\"Léa\"` ?"
    choices:
      - {text: "`String`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`boolean`", correct: false}
    answer: "Du texte se range dans une `String`, avec une majuscule."
  - key: qcm-2
    format: multiple-choice
    question: "Quel type pour un nombre de joueurs ?"
    choices:
      - {text: "`int`", correct: true}
      - {text: "`String`", correct: false}
      - {text: "`boolean`", correct: false}
    answer: "Un nombre entier se range dans un `int`."
