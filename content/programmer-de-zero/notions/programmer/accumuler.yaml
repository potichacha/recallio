notion: accumuler
lesson: |-
  Pour **additionner** dans une boucle, on crée une variable avant la boucle (`int somme = 0;`), et chaque tour y ajoute
  quelque chose. À la fin, elle contient le total.

  Pour **compter**, même idée : une variable à 0, et `compteur++` à chaque fois qu'on trouve ce qu'on cherche.
tour:
  - title: Additionner dans une boucle
    text: |-
      Une boucle sert souvent à **accumuler** : on crée une variable avant la boucle, `int somme = 0;`, et chaque tour y
      ajoute quelque chose. À la fin, la variable contient le total.

      Même idée pour **compter** : une variable à 0, et `++` à chaque fois qu'on rencontre ce qu'on cherche. C'est l'un
      des motifs les plus utilisés en programmation.
    example:
      files:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i <= 10; i++) {
                  somme = somme + i;
              }
              IO.println("1 + 2 + ... + 10 = " + somme);

              int multiplesDeTrois = 0;
              for (int i = 1; i <= 20; i++) {
                  if (i % 3 == 0) {
                      multiplesDeTrois++;
                  }
              }
              IO.println("multiples de 3 jusqu'à 20 : " + multiplesDeTrois);
          }
      output: |-
        1 + 2 + ... + 10 = 55
        multiples de 3 jusqu'à 20 : 6
    task:
      instructions: |-
        Additionne seulement les nombres **pairs** de 1 à 10 : le programme doit afficher `somme des pairs : 30`.
      starter:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i <= 10; i++) {
                  somme = somme + i;
              }
              IO.println("somme des pairs : " + somme);
          }
      solution:
        Main.java: |-
          void main() {
              int somme = 0;
              for (int i = 1; i <= 10; i++) {
                  if (i % 2 == 0) {
                      somme = somme + i;
                  }
              }
              IO.println("somme des pairs : " + somme);
          }
      output: |-
        somme des pairs : 30
cards:
  - key: cours
    format: course
    question: "Où crée-t-on la variable qui accumule un total ?"
    answer: "**Avant** la boucle, avec `int somme = 0;`."
  - key: vrai-faux-1
    format: true-false
    question: "Pour compter, on ajoute 1 à une variable à chaque élément qu'on trouve."
    truth: true
    answer: "Oui : `compteur++` dans la boucle."
  - key: vrai-faux-2
    format: true-false
    question: "On peut créer `int somme = 0;` à l'intérieur de la boucle pour additionner tous les tours."
    truth: false
    answer: "Non : elle serait remise à 0 à chaque tour. Elle se crée avant la boucle."
  - key: qcm-1
    format: multiple-choice
    question: "Que vaut `somme` après `int somme = 0; for (int i = 1; i <= 4; i++) { somme += i; }` ?"
    choices:
      - {text: "10", correct: true}
      - {text: "4", correct: false}
      - {text: "0", correct: false}
    answer: "1 + 2 + 3 + 4 = 10."
  - key: qcm-2
    format: multiple-choice
    question: "Combien de multiples de 3 y a-t-il de 1 à 10 ?"
    choices:
      - {text: "3 : 3, 6 et 9", correct: true}
      - {text: "10", correct: false}
      - {text: "1", correct: false}
    answer: "Une boucle et un `if (i % 3 == 0)` les compterait."
