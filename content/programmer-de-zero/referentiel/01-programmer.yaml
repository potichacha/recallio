# Référentiel de « Programmer de zéro » (ADR 0039) : apprendre à programmer sans rien en savoir, en Java 25.
# Champs d'une notion : id (définitif), title, level, priority, requires (prérequis), formats.
domain: programmer
title: Apprendre à programmer
position: 10
chapters:
  - id: premiers-pas
    title: Premiers pas
    notions:
      - {id: programme, title: "Ce qu'est un programme : des instructions exécutées dans l'ordre", level: beginner, priority: 1, formats: [course, true-false, multiple-choice]}
      - {id: afficher, title: "Afficher du texte et des nombres", level: beginner, priority: 1, requires: [programme], formats: [course, true-false, multiple-choice]}
      - {id: erreurs, title: "Lire les erreurs : le compilateur aide à corriger", level: beginner, priority: 1, requires: [afficher], formats: [course, true-false, multiple-choice]}
  - id: valeurs
    title: Valeurs et variables
    notions:
      - {id: nombres-calculs, title: "Les nombres et les calculs", level: beginner, priority: 1, requires: [afficher], formats: [course, true-false, multiple-choice]}
      - {id: texte, title: "Le texte : les chaînes de caractères", level: beginner, priority: 1, requires: [afficher], formats: [course, true-false, multiple-choice]}
      - {id: variables, title: "Les variables : donner un nom à une valeur", level: beginner, priority: 1, requires: [nombres-calculs], formats: [course, true-false, multiple-choice]}
      - {id: modifier-variable, title: "Changer la valeur d'une variable", level: beginner, priority: 1, requires: [variables], formats: [course, true-false, multiple-choice]}
      - {id: types-valeurs, title: "Les types : int, double, boolean, String", level: beginner, priority: 1, requires: [variables], formats: [course, true-false, multiple-choice]}
  - id: decisions
    title: Prendre des décisions
    notions:
      - {id: comparer, title: "Comparer deux valeurs : vrai ou faux", level: beginner, priority: 1, requires: [types-valeurs], formats: [course, true-false, multiple-choice]}
      - {id: si-sinon, title: "if et else : choisir quoi faire", level: beginner, priority: 1, requires: [comparer], formats: [course, true-false, multiple-choice]}
      - {id: et-ou-non, title: "Combiner des conditions : et, ou, non", level: beginner, priority: 1, requires: [si-sinon], formats: [course, true-false, multiple-choice]}
  - id: repetitions
    title: Répéter
    notions:
      - {id: tant-que, title: "Répéter tant qu'une condition est vraie : while", level: beginner, priority: 1, requires: [si-sinon], formats: [course, true-false, multiple-choice]}
      - {id: pour, title: "Compter avec la boucle for", level: beginner, priority: 1, requires: [tant-que], formats: [course, true-false, multiple-choice]}
      - {id: accumuler, title: "Additionner et compter dans une boucle", level: beginner, priority: 1, requires: [pour], formats: [course, true-false, multiple-choice]}
  - id: fonctions
    title: Découper en fonctions
    notions:
      - {id: definir-fonction, title: "Définir et appeler une fonction", level: beginner, priority: 1, requires: [afficher], formats: [course, true-false, multiple-choice]}
      - {id: parametres, title: "Les paramètres : donner des informations à une fonction", level: beginner, priority: 1, requires: [definir-fonction], formats: [course, true-false, multiple-choice]}
      - {id: renvoyer, title: "Renvoyer un résultat avec return", level: beginner, priority: 1, requires: [parametres], formats: [course, true-false, multiple-choice]}
  - id: listes
    title: Ranger des données
    notions:
      - {id: listes, title: "Les listes : plusieurs valeurs sous un seul nom", level: beginner, priority: 1, requires: [pour], formats: [course, true-false, multiple-choice]}
      - {id: parcourir, title: "Parcourir une liste élément par élément", level: beginner, priority: 1, requires: [listes], formats: [course, true-false, multiple-choice]}
      - {id: chercher, title: "Chercher dans une liste : trouver, compter, le plus grand", level: beginner, priority: 1, requires: [parcourir, si-sinon], formats: [course, true-false, multiple-choice]}
  - id: plus-loin
    title: Aller plus loin
    notions:
      - {id: regrouper, title: "Regrouper des informations dans un record", level: beginner, priority: 1, requires: [variables], formats: [course, true-false, multiple-choice]}
      - {id: deboguer, title: "Trouver et corriger un bug", level: beginner, priority: 1, requires: [si-sinon], formats: [course, true-false, multiple-choice]}
      - {id: suite, title: "Et maintenant ? Continuer avec le Tour de Java", level: beginner, priority: 1, requires: [listes], formats: [course, true-false, multiple-choice]}
