notion: fonctions-bases
lesson: |-
  Une **fonction** donne un nom à un calcul, pour l'écrire une fois et l'**appeler** autant de fois qu'il faut.

  ```cpp
  int carre(int n) {      // type de retour, nom, paramètres
      return n * n;       // la valeur renvoyée
  }

  int main() {
      int resultat = carre(4);   // l'appel : 4 est l'argument
  }
  ```

  - Le **type de retour** s'écrit avant le nom. Une fonction qui ne renvoie rien a le type **`void`**.
  - Les **paramètres** sont des variables locales de la fonction, initialisées par les **arguments** de l'appel.
  - **`return`** renvoie une valeur et **quitte** la fonction aussitôt.
  - Une fonction doit être **déclarée avant** la ligne qui l'appelle.
  - Le compilateur vérifie chaque appel : le nombre d'arguments, et leur type (avec les conversions implicites
    habituelles : `carre(3.9)` appelle `carre(3)`).

  **Le passage par valeur.** Par défaut, un argument est **copié** dans le paramètre. La fonction travaille sur sa
  copie : modifier le paramètre **ne change pas** la variable de l'appelant.

  ```cpp
  void doubler(int n) { n *= 2; }

  int x = 5;
  doubler(x);     // x vaut toujours 5
  ```

  Pour récupérer un résultat, on le **renvoie** (`x = doubler(x);`), ou on passe par référence.

  **Pièges classiques.**

  - Oublier le `return` d'une fonction qui renvoie une valeur : le code compile, et c'est un comportement indéfini.
    GCC le signale par un avertissement (`-Wreturn-type`), et le programme plante le plus souvent.
  - Ignorer la valeur renvoyée : `carre(4);` calcule, puis jette le résultat.

  **En entretien** : « Par défaut, C++ passe les arguments par valeur : la fonction reçoit une copie. Une fonction
  courte, avec un nom précis, se teste seule et se relit sans commentaire. »
tour:
  - title: Les fonctions
    text: |-
      Une fonction a un type de retour, un nom et des paramètres. `return` renvoie le résultat. Si elle ne renvoie
      rien, son type de retour est `void`.

      Elle doit être écrite avant le code qui l'appelle.

      Un argument est **copié** dans le paramètre : la fonction ne peut pas modifier la variable de l'appelant. Ici,
      `doubler` renvoie donc son résultat.

      Essaie : remplace `x = doubler(x);` par `doubler(x);`, puis exécute. `x` ne change plus.
    example:
      files:
        main.cpp: |-
          #include <print>

          int carre(int n) {
              return n * n;
          }

          int doubler(int n) {
              n *= 2;
              return n;
          }

          void afficher(int valeur) {
              std::println("valeur : {}", valeur);
          }

          int main() {
              afficher(carre(4));

              int x = 5;
              x = doubler(x);
              afficher(x);
          }
      output: |-
        valeur : 16
        valeur : 10
    task:
      instructions: |-
        Écris la fonction `cube`, qui renvoie son paramètre multiplié trois fois par lui-même, pour que le programme
        affiche `27`.
      starter:
        main.cpp: |-
          #include <print>

          int cube(int n) {
              return n;
          }

          int main() {
              std::println("{}", cube(3));
          }
      solution:
        main.cpp: |-
          #include <print>

          int cube(int n) {
              return n * n * n;
          }

          int main() {
              std::println("{}", cube(3));
          }
      output: "27"
cards:
  - key: passage-par-valeur
    format: course
    question: Que reçoit une fonction quand on lui passe une variable par valeur ?
    choices:
      - {text: "Une copie de la valeur : la variable de l'appelant est hors d'atteinte", correct: true}
      - {text: "La variable elle-même : toute modification se voit chez l'appelant", correct: false}
      - {text: "L'adresse de la variable, que la fonction peut suivre", correct: false}
      - {text: "Le nom de la variable, que la fonction peut réutiliser", correct: false}
    answer: "Par défaut, l'argument est copié dans le paramètre. La fonction modifie sa copie, détruite à son retour."
  - key: parametre-ou-argument
    format: course
    question: "Dans `int carre(int n)` et l'appel `carre(4)`, qui est le paramètre et qui est l'argument ?"
    choices:
      - {text: "`n` est le paramètre, `4` est l'argument", correct: true}
      - {text: "`4` est le paramètre, `n` est l'argument", correct: false}
      - {text: "`carre` est le paramètre, `n` est l'argument", correct: false}
      - {text: "Ce sont deux noms pour la même chose", correct: false}
    answer: "Le paramètre est la variable déclarée par la fonction ; l'argument est la valeur fournie par l'appel, qui l'initialise."
  - key: role-de-return
    format: course
    question: Que fait `return` dans une fonction ?
    choices:
      - {text: "Il renvoie une valeur à l'appelant et quitte la fonction aussitôt", correct: true}
      - {text: "Il renvoie une valeur à l'appelant, puis la fonction continue", correct: false}
      - {text: "Il affiche une valeur, puis quitte la fonction", correct: false}
      - {text: "Il relance la fonction depuis sa première ligne", correct: false}
    answer: "`return` met fin à la fonction : les lignes qui le suivent ne s'exécutent pas. La valeur renvoyée remplace l'appel dans l'expression de l'appelant."
  - key: type-void
    format: course
    question: "Que signifie `void` comme type de retour ?"
    choices:
      - {text: "La fonction ne renvoie aucune valeur", correct: true}
      - {text: "La fonction renvoie zéro par défaut", correct: false}
      - {text: "La fonction ne prend aucun paramètre", correct: false}
      - {text: "La fonction peut renvoyer n'importe quel type", correct: false}
    answer: "Une fonction `void` agit (elle affiche, elle modifie) sans rien renvoyer. Son appel ne peut pas servir de valeur."
  - key: vf-modifier-parametre
    format: true-false
    question: Modifier un paramètre passé par valeur modifie la variable de l'appelant.
    truth: false
    answer: Le paramètre est une copie, propre à la fonction.
  - key: vf-declaree-avant
    format: true-false
    question: Une fonction doit être déclarée avant la ligne qui l'appelle.
    truth: true
    answer: "Le compilateur lit le fichier de haut en bas : un nom inconnu au moment de l'appel est une erreur."
  - key: vf-return-oublie
    format: true-false
    question: "Une fonction déclarée `int` qui n'a pas de `return` est refusée par le compilateur."
    truth: false
    answer: "Le code compile. Atteindre la fin d'une telle fonction sans `return` est un comportement indéfini, que GCC signale par un avertissement."
  - key: vf-return-void
    format: true-false
    question: "Une fonction `void` peut contenir `return;`, sans valeur."
    truth: true
    answer: "`return;` quitte la fonction avant sa fin, par exemple quand il n'y a rien à faire."
  - key: qcm-signature
    format: multiple-choice
    question: "Quelle ligne commence une fonction `aire`, qui prend deux entiers et renvoie un entier ?"
    choices:
      - {text: "`int aire(int largeur, int hauteur) {`", correct: true}
      - {text: "`aire(int largeur, int hauteur) int {`", correct: false}
      - {text: "`int aire(int largeur, hauteur) {`", correct: false}
      - {text: "`function aire(largeur, hauteur) {`", correct: false}
    answer: "Le type de retour d'abord, puis le nom, puis chaque paramètre avec son propre type."
  - key: qcm-resultat-ignore
    format: multiple-choice
    question: "Que fait la ligne `carre(4);`, où `carre` renvoie un `int` ?"
    choices:
      - {text: "Elle appelle la fonction, puis jette la valeur renvoyée", correct: true}
      - {text: "Elle range 16 dans une variable nommée `carre`", correct: false}
      - {text: "Elle affiche 16 sur la sortie standard", correct: false}
      - {text: "Elle provoque une erreur de compilation", correct: false}
    answer: "L'appel a bien lieu, mais son résultat n'est rangé nulle part. Il faut l'utiliser : `int r = carre(4);`."
  - key: qcm-conversion-argument
    format: multiple-choice
    question: "Avec `int moitie(int n)`, que se passe-t-il à l'appel `moitie(7.9)` ?"
    choices:
      - {text: "7.9 est converti en 7, comme pour une initialisation", correct: true}
      - {text: "Le code ne compile pas : le type ne correspond pas", correct: false}
      - {text: "7.9 est arrondi à 8 avant l'appel", correct: false}
      - {text: "Le paramètre `n` devient un `double` pour cet appel", correct: false}
    answer: "L'argument initialise le paramètre, avec les conversions implicites habituelles : la partie décimale est coupée."
  - key: qcm-nombre-d-arguments
    format: multiple-choice
    question: "Avec `int aire(int largeur, int hauteur)`, que se passe-t-il à l'appel `aire(3)` ?"
    choices:
      - {text: "Le code ne compile pas : il manque un argument", correct: true}
      - {text: "`hauteur` vaut zéro pendant cet appel", correct: false}
      - {text: "`hauteur` reprend la valeur de `largeur`", correct: false}
      - {text: "`hauteur` a une valeur indéterminée", correct: false}
    answer: "Le compilateur vérifie le nombre d'arguments : « too few arguments to function ». Seul un argument par défaut permettrait d'en omettre un."
  - key: trous-type-de-retour
    format: fill-in
    question: |-
      Complète avec le type de retour de la fonction :
      ```cpp
      ___ carre(int n) {
          return n * n;
      }
      ```
    blanks:
      - [int, auto, long]
    answer: "`int carre(int n)` : la fonction renvoie un entier."
  - key: trous-return
    format: fill-in
    question: |-
      Complète pour que la fonction renvoie la somme :
      ```cpp
      int ajouter(int a, int b) {
          ___ a + b;
      }
      ```
    blanks:
      - [return]
    answer: "`return a + b;` renvoie la valeur à l'appelant."
  - key: trous-void
    format: fill-in
    question: |-
      Complète avec le type de retour d'une fonction qui ne renvoie rien :
      ```cpp
      ___ saluer(int fois) {
          for (int i = 0; i < fois; ++i) {
              std::println("Bonjour");
          }
      }
      ```
    blanks:
      - [void]
    answer: "`void` : la fonction agit, sans renvoyer de valeur."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète pour appeler la fonction avec l'argument 4 :
      ```cpp
      int carre(int n) {
          return n * n;
      }

      int main() {
          int resultat = ___(4);
      }
      ```
    blanks:
      - [carre]
    answer: "`carre(4)` : le nom de la fonction, puis les arguments entre parenthèses."
  - key: code-appels
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int carre(int n) {
          return n * n;
      }

      int main() {
          std::println("{}", carre(4) + carre(3));
      }
      ```
    choices:
      - {text: "`25`", correct: true}
      - {text: "`49`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "`14`", correct: false}
    answer: "`25` : chaque appel est remplacé par sa valeur, 16 et 9."
    check:
      output: "25"
  - key: code-par-valeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void doubler(int n) {
          n *= 2;
      }

      int main() {
          int x = 5;
          doubler(x);
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5` : `n` est une copie de `x`. La fonction double sa copie, qui disparaît à son retour."
    check:
      output: "5"
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int ajouter(int a, int b) {
          std::println("calcul");
          return a + b;
      }

      int main() {
          int resultat = ajouter(2, 3);
          std::println("{}", resultat);
      }
      ```
    choices:
      - text: |-
          ```
          calcul
          5
          ```
        correct: true
      - text: |-
          ```
          5
          calcul
          ```
        correct: false
      - {text: "`5`", correct: false}
      - {text: "`calcul`", correct: false}
    answer: |-
      ```
      calcul
      5
      ```
      L'appel exécute tout le corps de la fonction, affichage compris, avant de renvoyer 5 à `main`.
    check:
      output: |-
        calcul
        5
  - key: code-conversion
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int moitie(int n) {
          return n / 2;
      }

      int main() {
          std::println("{}", moitie(7.9));
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`3.95`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : 7.9 est converti en 7 pour initialiser `n`, puis `7 / 2` est une division entière."
    check:
      output: "3"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      Ce programme affiche `100` au lieu de `90`, le prix remisé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int remiser(int prix) {
          prix -= 10;
          return prix;
      }

      int main() {
          int prix = 100;
          remiser(prix);
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Écrire `prix = remiser(prix);`", correct: true}
      - {text: "Écrire `remiser(prix) = prix;`", correct: false}
      - {text: "Écrire `return prix - 10;` dans la fonction", correct: false}
      - {text: "Renommer le paramètre de la fonction", correct: false}
    answer: |-
      ```cpp
      prix = remiser(prix);
      ```
      La fonction modifie sa copie et renvoie le résultat, que `main` jetait. Il faut ranger la valeur renvoyée.
  - key: bug-return-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5`, et plante (« Illegal instruction »). Pourquoi ?
      ```cpp
      #include <print>

      int ajouter(int a, int b) {
          int somme = a + b;
      }

      int main() {
          std::println("{}", ajouter(2, 3));
      }
      ```
    choices:
      - {text: "La fonction ne renvoie pas `somme` : il manque `return`", correct: true}
      - {text: "`somme` doit être déclarée hors de la fonction", correct: false}
      - {text: "`a` et `b` ne sont pas initialisés dans la fonction", correct: false}
      - {text: "`std::println` ne sait pas afficher le résultat d'un appel", correct: false}
    answer: |-
      ```cpp
      int ajouter(int a, int b) {
          return a + b;
      }
      ```
      Une fonction `int` qui finit sans `return` a un comportement indéfini. Le code compile, avec un simple
      avertissement (`-Wreturn-type`), et GCC fait planter le programme à cet endroit.
  - key: bug-argument-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « too few arguments to function 'int aire(int, int)' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }

      int main() {
          std::println("{}", aire(3));
      }
      ```
    choices:
      - {text: "Passer les deux arguments : `aire(3, 4)`", correct: true}
      - {text: "Passer un tableau : `aire({3})`", correct: false}
      - {text: "Écrire l'appel sans parenthèses : `aire 3`", correct: false}
      - {text: "Déclarer `aire` après la fonction `main`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", aire(3, 4));
      ```
      Un appel fournit un argument par paramètre.
  - key: bug-void-utilise
    format: bug-fix
    question: |-
      Le compilateur répond « void value not ignored as it ought to be ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void carre(int n) {
          std::println("{}", n * n);
      }

      int main() {
          int resultat = carre(4);
          std::println("{}", resultat + 1);
      }
      ```
    choices:
      - {text: "Faire renvoyer `n * n` par `carre`, avec le type de retour `int`", correct: true}
      - {text: "Déclarer `resultat` avec le type `void`, comme la fonction", correct: false}
      - {text: "Déclarer `resultat` avec `auto`, pour laisser déduire son type", correct: false}
      - {text: "Appeler `carre(4)` une première fois, sans ranger sa valeur", correct: false}
    answer: |-
      ```cpp
      int carre(int n) {
          return n * n;
      }
      ```
      Une fonction `void` ne renvoie rien : son appel ne peut pas initialiser une variable. Afficher un résultat n'est
      pas le renvoyer.
