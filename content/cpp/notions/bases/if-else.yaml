notion: if-else
lesson: |-
  **`if`** exécute un bloc quand une condition est vraie ; **`else`** donne le bloc à exécuter sinon.

  ```cpp
  if (note >= 16) {
      std::println("Très bien");
  } else if (note >= 12) {
      std::println("Bien");
  } else {
      std::println("Passable");
  }
  ```

  - Les conditions d'une chaîne `else if` sont testées **dans l'ordre**, et **seul le premier** bloc dont la condition
    est vraie s'exécute. L'ordre compte : on teste le cas le plus restrictif d'abord.
  - La condition est convertie en `bool` : un nombre non nul est vrai, zéro est faux.
  - **Sans accolades, le `if` ne commande qu'une instruction**, quelle que soit l'indentation. On met donc toujours
    des accolades.

  **L'initialisation dans la condition (C++17).** Un `if` peut déclarer une variable avant sa condition, séparée par
  un point-virgule :

  ```cpp
  if (int reste = n % 3; reste == 0) {
      std::println("multiple de 3");
  } else {
      std::println("reste {}", reste);
  }
  // reste n'existe plus ici
  ```

  La variable est visible dans le `if` et dans ses `else`, puis disparaît : sa portée est la plus petite possible.

  **Pièges classiques.**

  - Un **point-virgule** après la condition : `if (x > 0);` commande une instruction vide, et le bloc qui suit
    s'exécute toujours.
  - `=` au lieu de `==` dans la condition.
  - Un `else` se rattache au `if` **le plus proche**, pas à celui avec lequel il est aligné.

  **En entretien** : « Depuis C++17, je déclare dans le `if` la variable qui ne sert qu'à lui : `if (auto it =
  m.find(cle); it != m.end())`. Elle ne fuit pas dans le reste de la fonction. »
tour:
  - title: if et else
    text: |-
      `if` exécute un bloc si sa condition est vraie. `else if` propose une autre condition, `else` prend tout le
      reste. Seul le premier bloc dont la condition est vraie s'exécute.

      Mets toujours des accolades : sans elles, le `if` ne commande que l'instruction qui le suit.

      Depuis C++17, un `if` peut déclarer une variable juste pour lui : `if (int reste = n % 2; reste == 0)`.

      Essaie : remplace `15` par `8`, puis par `18`.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int note = 15;

              if (note >= 16) {
                  std::println("Très bien");
              } else if (note >= 12) {
                  std::println("Bien");
              } else {
                  std::println("Passable");
              }

              if (int reste = note % 2; reste == 0) {
                  std::println("note paire");
              } else {
                  std::println("note impaire, reste {}", reste);
              }
          }
      output: |-
        Bien
        note impaire, reste 1
    task:
      instructions: |-
        Le programme affiche `positif` ou `négatif`, et se trompe pour zéro. Ajoute un cas pour que `n = 0` affiche
        `nul`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int n = 0;

              if (n > 0) {
                  std::println("positif");
              } else {
                  std::println("négatif");
              }
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int n = 0;

              if (n > 0) {
                  std::println("positif");
              } else if (n < 0) {
                  std::println("négatif");
              } else {
                  std::println("nul");
              }
          }
      output: "nul"
cards:
  - key: chaine-else-if
    format: course
    question: "Dans une chaîne `if` / `else if` / `else`, combien de blocs s'exécutent ?"
    choices:
      - {text: "Un seul : le premier dont la condition est vraie, ou le `else`", correct: true}
      - {text: "Tous ceux dont la condition est vraie, dans l'ordre", correct: false}
      - {text: "Le dernier dont la condition est vraie, et lui seul", correct: false}
      - {text: "Le premier dont la condition est vraie, puis le `else`", correct: false}
    answer: "Les conditions sont testées dans l'ordre, et la chaîne s'arrête au premier bloc exécuté. Les suivantes ne sont même pas évaluées."
  - key: if-avec-initialisation
    format: course
    question: "Jusqu'où est visible la variable déclarée dans `if (int reste = n % 3; reste == 0)` ?"
    choices:
      - {text: "Dans le `if` et ses `else`, pas après", correct: true}
      - {text: "Dans le bloc du `if` seulement, pas dans le `else`", correct: false}
      - {text: "Jusqu'à la fin de la fonction qui contient le `if`", correct: false}
      - {text: "Dans la condition seulement, pas dans les blocs", correct: false}
    answer: "La variable vit pendant toute l'instruction `if`, branches `else` comprises, puis disparaît. C'est l'intérêt de cette écriture, arrivée avec C++17."
  - key: sans-accolades
    format: course
    question: Que commande un `if` écrit sans accolades ?
    choices:
      - {text: "La seule instruction qui le suit", correct: true}
      - {text: "Toutes les instructions indentées sous lui", correct: false}
      - {text: "Toutes les instructions jusqu'à la ligne vide", correct: false}
      - {text: "Rien : sans accolades, le `if` ne compile pas", correct: false}
    answer: "Une instruction, et une seule. L'indentation ne compte pas en C++ : une seconde ligne indentée s'exécute toujours. D'où l'habitude des accolades."
  - key: condition-entiere
    format: course
    question: "Que fait `if (n)` quand `n` est un `int` ?"
    choices:
      - {text: "Il exécute son bloc si `n` est différent de zéro", correct: true}
      - {text: "Il exécute son bloc si `n` est strictement positif", correct: false}
      - {text: "Il exécute son bloc si `n` vaut exactement 1", correct: false}
      - {text: "Rien : une condition doit être de type `bool`", correct: false}
    answer: "La condition est convertie en `bool` : zéro donne `false`, tout autre nombre `true`, négatifs compris. `if (n != 0)` dit la même chose plus clairement."
  - key: vf-else-obligatoire
    format: true-false
    question: Un `if` doit toujours être suivi d'un `else`.
    truth: false
    answer: Le `else` est facultatif. Sans lui, rien ne se passe quand la condition est fausse.
  - key: vf-init-cpp17
    format: true-false
    question: "Déclarer une variable dans un `if`, avant la condition, est possible depuis C++17."
    truth: true
    answer: "`if (init; condition)` date de C++17. `switch` accepte la même écriture."
  - key: vf-point-virgule
    format: true-false
    question: "Dans `if (x > 0); { ... }`, le bloc entre accolades ne s'exécute que si `x` est positif."
    truth: false
    answer: Le point-virgule termine le `if`, qui commande une instruction vide. Le bloc qui suit s'exécute toujours.
  - key: vf-else-le-plus-proche
    format: true-false
    question: Sans accolades, un `else` se rattache au `if` le plus proche qui n'a pas encore de `else`.
    truth: true
    answer: C'est la règle du langage, quelle que soit l'indentation. Des accolades lèvent toute ambiguïté.
  - key: qcm-ordre-des-conditions
    format: multiple-choice
    question: "Une chaîne teste `note >= 10` puis, en `else if`, `note >= 16`. Qu'affiche-t-elle pour 18 ?"
    choices:
      - {text: "Le bloc de `note >= 10`, le premier vrai", correct: true}
      - {text: "Le bloc de `note >= 16`, le plus précis", correct: false}
      - {text: "Les deux blocs, l'un après l'autre", correct: false}
      - {text: "Aucun bloc : les conditions se contredisent", correct: false}
    answer: "18 vérifie déjà `note >= 10` : la chaîne s'arrête là. Le second bloc n'est jamais atteint : il faut tester le cas le plus restrictif d'abord."
  - key: qcm-syntaxe-init
    format: multiple-choice
    question: Quelle écriture déclare `reste` dans le `if`, puis le teste ?
    choices:
      - {text: "`if (int reste = n % 2; reste == 0)`", correct: true}
      - {text: "`if (int reste = n % 2, reste == 0)`", correct: false}
      - {text: "`if (int reste = n % 2 && reste == 0)`", correct: false}
      - {text: "`if (int reste = n % 2: reste == 0)`", correct: false}
    answer: "L'initialisation et la condition sont séparées par un point-virgule, comme dans un `for`."
  - key: qcm-deux-instructions
    format: multiple-choice
    question: "Un `if` sans accolades est suivi de deux lignes indentées. Laquelle dépend de la condition ?"
    choices:
      - {text: "La première seulement", correct: true}
      - {text: "Les deux lignes", correct: false}
      - {text: "La seconde seulement", correct: false}
      - {text: "Aucune des deux", correct: false}
    answer: "Le `if` ne commande que l'instruction qui le suit. La seconde ligne s'exécute dans tous les cas, malgré son indentation."
  - key: qcm-avertissement-affectation
    format: multiple-choice
    question: "Que fait GCC, avec `-Wall`, devant `if (x = 5)` ?"
    choices:
      - {text: "Il avertit, et suggère des parenthèses autour de l'affectation", correct: true}
      - {text: "Il refuse de compiler : une affectation n'est pas une condition", correct: false}
      - {text: "Il remplace de lui-même `=` par `==`", correct: false}
      - {text: "Rien : le code est valide, donc aucun message", correct: false}
    answer: "Le code est valide, donc il compile, mais `-Wall` le signale (`-Wparentheses`). Sans `-Wall`, rien n'apparaît."
  - key: trous-if
    format: fill-in
    question: |-
      Complète pour n'afficher le message que si `age` vaut au moins 18 :
      ```cpp
      ___ (age >= 18) {
          std::println("Majeur");
      }
      ```
    blanks:
      - [if]
    answer: "`if (condition) { ... }` exécute le bloc quand la condition est vraie."
  - key: trous-else
    format: fill-in
    question: |-
      Complète pour afficher `Mineur` dans le cas contraire :
      ```cpp
      if (age >= 18) {
          std::println("Majeur");
      } ___ {
          std::println("Mineur");
      }
      ```
    blanks:
      - [else]
    answer: "`else` introduit le bloc exécuté quand la condition est fausse."
  - key: trous-else-if
    format: fill-in
    question: |-
      Complète pour tester une seconde condition :
      ```cpp
      if (note >= 16) {
          std::println("Très bien");
      } else ___ (note >= 12) {
          std::println("Bien");
      }
      ```
    blanks:
      - [if]
    answer: "`else if` enchaîne une nouvelle condition, testée seulement si la première est fausse."
  - key: trous-separateur-init
    format: fill-in
    question: |-
      Complète avec le séparateur entre l'initialisation et la condition :
      ```cpp
      if (int reste = n % 2___ reste == 0) {
          std::println("pair");
      }
      ```
    blanks:
      - [";"]
    answer: "Un point-virgule sépare l'initialisation de la condition."
  - key: code-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 20;
          if (x > 5) {
              std::println("plus de 5");
          } else if (x > 10) {
              std::println("plus de 10");
          } else {
              std::println("petit");
          }
      }
      ```
    choices:
      - {text: "`plus de 5`", correct: true}
      - {text: "`plus de 10`", correct: false}
      - text: |-
          ```
          plus de 5
          plus de 10
          ```
        correct: false
      - {text: "`petit`", correct: false}
    answer: "`plus de 5` : la première condition est vraie, la chaîne s'arrête là. `x > 10` est vraie aussi, mais n'est jamais testée."
    check:
      output: "plus de 5"
  - key: code-sans-accolades
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 0;
          if (x > 0)
              std::println("positif");
              std::println("fin");
      }
      ```
    choices:
      - {text: "`fin`", correct: true}
      - {text: "Rien", correct: false}
      - text: |-
          ```
          positif
          fin
          ```
        correct: false
      - {text: "`positif`", correct: false}
    answer: "`fin` : sans accolades, le `if` ne commande que la première instruction. La seconde s'exécute toujours, malgré son indentation."
    check:
      output: "fin"
  - key: code-init
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          if (int reste = 17 % 5; reste > 2) {
              std::println("grand {}", reste);
          } else {
              std::println("petit {}", reste);
          }
      }
      ```
    choices:
      - {text: "`petit 2`", correct: true}
      - {text: "`grand 2`", correct: false}
      - {text: "`grand 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`petit 2` : `reste` vaut 2, qui n'est pas supérieur à 2. La variable déclarée dans le `if` est visible aussi dans le `else`."
    check:
      output: "petit 2"
  - key: code-point-virgule
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 3;
          if (x > 100); {
              std::println("grand");
          }
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          grand
          fin
          ```
        correct: true
      - {text: "`fin`", correct: false}
      - {text: "`grand`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      grand
      fin
      ```
      Le point-virgule après la condition termine le `if`. Le bloc entre accolades n'en dépend plus : il s'exécute
      toujours.
    check:
      output: |-
        grand
        fin
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce programme affiche `Stock épuisé` alors qu'il reste 12 articles. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int stock = 12;
          if (stock == 0); {
              std::println("Stock épuisé");
          }
      }
      ```
    choices:
      - {text: "Retirer le point-virgule après la condition", correct: true}
      - {text: "Remplacer `==` par un seul `=`", correct: false}
      - {text: "Retirer les accolades du bloc", correct: false}
      - {text: "Ajouter un `else` vide après le bloc", correct: false}
    answer: |-
      ```cpp
      if (stock == 0) {
      ```
      Le point-virgule est une instruction vide : c'est elle que le `if` commande. Le bloc qui suit s'exécute toujours.
  - key: bug-accolades-manquantes
    format: bug-fix
    question: |-
      Ce programme applique la remise à un client qui n'y a pas droit : il affiche `90`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int prix = 100;
          bool fidele = false;
          if (fidele)
              std::println("Merci de votre fidélité");
              prix -= 10;
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Sans accolades, seul l'affichage dépend du `if`", correct: true}
      - {text: "`fidele` vaut `false`, qui est converti en `true`", correct: false}
      - {text: "`prix -= 10` s'exécute avant le test du `if`", correct: false}
      - {text: "Un `if` sans `else` exécute toujours son bloc", correct: false}
    answer: |-
      ```cpp
      if (fidele) {
          std::println("Merci de votre fidélité");
          prix -= 10;
      }
      ```
      Le `if` ne commande qu'une instruction. `prix -= 10;` est indentée, mais hors du `if` : il faut des accolades.
  - key: bug-ordre-des-tests
    format: bug-fix
    question: |-
      Ce programme affiche `Admis` pour 18, au lieu de `Mention très bien`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int note = 18;
          if (note >= 10) {
              std::println("Admis");
          } else if (note >= 16) {
              std::println("Mention très bien");
          } else {
              std::println("Recalé");
          }
      }
      ```
    choices:
      - {text: "Tester `note >= 16` en premier, puis `note >= 10`", correct: true}
      - {text: "Remplacer le `else if` par un second `else`", correct: false}
      - {text: "Remplacer `note >= 16` par `note > 16`", correct: false}
      - {text: "Déplacer le `else` final en tête de la chaîne", correct: false}
    answer: |-
      ```cpp
      if (note >= 16) {
          std::println("Mention très bien");
      } else if (note >= 10) {
          std::println("Admis");
      }
      ```
      18 vérifie déjà `note >= 10` : la chaîne s'arrête au premier bloc. On teste la condition la plus restrictive
      d'abord.
  - key: bug-variable-du-if
    format: bug-fix
    question: |-
      Ce code ne compile pas : `reste` est inconnue à la dernière ligne. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int n = 17;
          if (int reste = n % 5; reste == 0) {
              std::println("multiple de 5");
          }
          std::println("reste : {}", reste);
      }
      ```
    choices:
      - {text: "Une variable déclarée dans le `if` disparaît à la fin du `if`", correct: true}
      - {text: "Une variable ne peut pas être déclarée dans une condition", correct: false}
      - {text: "`reste` vaut 2, et le bloc du `if` ne s'est pas exécuté", correct: false}
      - {text: "`std::println` ne peut pas suivre directement un `if`", correct: false}
    answer: |-
      ```cpp
      int reste = n % 5;
      if (reste == 0) {
      ```
      La portée de `reste` est l'instruction `if`. Pour s'en servir après, on la déclare avant.
