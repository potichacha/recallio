notion: auto
lesson: |-
  Avec **`auto`**, le compilateur **déduit le type** d'une variable de sa valeur de départ :

  ```cpp
  auto age = 43;        // int
  auto prix = 9.99;     // double
  auto lettre = 'A';    // char
  auto actif = true;    // bool
  ```

  - `auto` **exige une valeur de départ** : `auto x;` ne compile pas, il n'y a rien à déduire.
  - Le type est déduit **une fois**, à la compilation, et ne change plus. `auto` n'est pas un type dynamique : après
    `auto n = 5;`, `n = 2.9;` range 2 dans un `int`.
  - Le type vient du **littéral** : `5` est un `int`, `5.0` un `double`, `5.0f` un `float`, `5u` un `unsigned int`.
  - `auto` copie la valeur et **laisse tomber `const`** : après `const int limite = 10; auto copie = limite;`, `copie`
    est un `int` modifiable. Pour une constante, on écrit `const auto`.
  - **`auto texte = "Ada";` n'est pas une `std::string`** : c'est un `const char*`, un pointeur vers les caractères.

  **Quand l'utiliser.** Quand le type est évident à la lecture, ou long et sans intérêt (un itérateur, le résultat
  d'une fonction de la bibliothèque). On l'évite quand il cache une information utile : `auto total = 0;` fait de
  `total` un `int`, même si l'on comptait y ajouter des nombres à virgule.

  **En entretien** : « `auto` n'enlève rien au typage statique : le type est déduit à la compilation. Il évite de
  répéter des types longs, et il interdit d'oublier d'initialiser. »
tour:
  - title: "auto : laisser le compilateur déduire le type"
    text: |-
      `auto` demande au compilateur de trouver le type lui-même, d'après la valeur de départ : `auto age = 43;` déclare
      un `int`, `auto prix = 9.99;` un `double`.

      Le type reste fixé : `auto` n'est pas un type « qui change ». Ici, `moitie` est un `int`, parce que `7 / 2` en
      est un.

      Essaie : remplace `7 / 2` par `7 / 2.0`, puis exécute. Le type déduit devient `double`.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              auto age = 43;
              auto prix = 9.99;
              auto moitie = 7 / 2;

              std::println("{} {} {}", age, prix, moitie);
          }
      output: "43 9.99 3"
cards:
  - key: role-de-auto
    format: course
    question: "Que fait le mot-clé `auto` dans `auto age = 43;` ?"
    choices:
      - {text: "Il demande au compilateur de déduire le type de la valeur de départ", correct: true}
      - {text: "Il crée une variable dont le type change à chaque affectation", correct: false}
      - {text: "Il crée une variable détruite d'elle-même à la fin du programme", correct: false}
      - {text: "Il demande au compilateur de choisir la valeur de départ", correct: false}
    answer: "Le compilateur déduit le type de l'expression à droite du `=` : ici, `int`. Le type est fixé à la compilation, comme si on l'avait écrit."
  - key: auto-exige-une-valeur
    format: course
    question: "Pourquoi `auto x;` ne compile-t-il pas ?"
    choices:
      - {text: "Sans valeur de départ, le compilateur n'a rien dont déduire le type", correct: true}
      - {text: "`auto` ne s'emploie que pour les variables globales", correct: false}
      - {text: "`x` est un nom trop court pour une variable `auto`", correct: false}
      - {text: "`auto` doit être suivi d'un type, comme `auto int x;`", correct: false}
    answer: "Le type vient de la valeur de départ : sans elle, pas de type. C'est un avantage : une variable `auto` est toujours initialisée."
  - key: auto-et-const
    format: course
    question: "Après `const int limite = 10; auto copie = limite;`, quel est le type de `copie` ?"
    choices:
      - {text: "`int` : `auto` copie la valeur et laisse tomber `const`", correct: true}
      - {text: "`const int` : `auto` reprend le type exact de `limite`", correct: false}
      - {text: "`const auto` : le type reste à déduire plus tard", correct: false}
      - {text: "`long` : `auto` choisit le plus grand type entier", correct: false}
    answer: "`copie` est un `int` modifiable. `auto` déduit le type de la valeur, sans son `const`. Pour une copie constante : `const auto copie = limite;`."
  - key: auto-et-chaine
    format: course
    question: "Quel est le type de `nom` après `auto nom = \"Ada\";` ?"
    choices:
      - {text: "`const char*`, un pointeur vers les caractères", correct: true}
      - {text: "`std::string`, la chaîne de la bibliothèque standard", correct: false}
      - {text: "`char`, le type d'un caractère", correct: false}
      - {text: "`auto`, qui est un type à part entière", correct: false}
    answer: |-
      Un littéral entre guillemets n'est pas une `std::string` : `auto` en déduit `const char*`. Pour une
      `std::string`, on écrit le type : `std::string nom = "Ada";`.
  - key: vf-type-dynamique
    format: true-false
    question: Une variable `auto` peut changer de type pendant l'exécution.
    truth: false
    answer: Le type est déduit une fois, à la compilation. `auto` ne change rien au typage statique.
  - key: vf-auto-initialisee
    format: true-false
    question: Une variable déclarée avec `auto` a forcément une valeur de départ.
    truth: true
    answer: "Sans valeur de départ, il n'y a pas de type à déduire : le code ne compile pas."
  - key: vf-auto-cout
    format: true-false
    question: Utiliser `auto` ralentit le programme à l'exécution.
    truth: false
    answer: La déduction se fait à la compilation. Le code produit est le même qu'avec le type écrit en toutes lettres.
  - key: vf-auto-5-point-0
    format: true-false
    question: "`auto x = 5.0;` déclare un `float`."
    truth: false
    answer: "Un littéral avec un point est un `double`. Pour un `float`, il faut le suffixe : `5.0f`."
  - key: qcm-type-deduit-division
    format: multiple-choice
    question: "Quel type le compilateur déduit-il pour `auto moitie = 7 / 2;` ?"
    choices:
      - {text: "`int`", correct: true}
      - {text: "`double`", correct: false}
      - {text: "`float`", correct: false}
      - {text: "`char`", correct: false}
    answer: "`int` : la division de deux `int` donne un `int`, 3. `auto` déduit le type de l'expression, pas celui qu'on espérait."
  - key: qcm-type-deduit-char
    format: multiple-choice
    question: "Quel type le compilateur déduit-il pour `auto c = 'A';` ?"
    choices:
      - {text: "`char`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`std::string`", correct: false}
      - {text: "`const char*`", correct: false}
    answer: "`char` : les apostrophes font un caractère. Ce sont les guillemets, `\"A\"`, qui donneraient un `const char*`."
  - key: qcm-quand-eviter
    format: multiple-choice
    question: Dans quel cas vaut-il mieux écrire le type plutôt que `auto` ?
    choices:
      - {text: "Quand `auto` déduirait un autre type que celui qu'on veut", correct: true}
      - {text: "Quand le type est long et sans intérêt pour le lecteur", correct: false}
      - {text: "Quand le type est écrit juste à droite du `=`", correct: false}
      - {text: "Quand la variable reçoit sa valeur à la déclaration", correct: false}
    answer: |-
      `auto total = 0;` déduit `int`, même si l'on voulait y accumuler des nombres à virgule : là, on écrit `double`.
      `auto` est au contraire bienvenu quand le type est long, ou déjà visible sur la ligne.
  - key: qcm-auto-constante
    format: multiple-choice
    question: Comment déclarer une constante dont le type est déduit ?
    choices:
      - {text: "`const auto limite = 10;`", correct: true}
      - {text: "`auto const = 10;`", correct: false}
      - {text: "`auto limite = const 10;`", correct: false}
      - {text: "`constauto limite = 10;`", correct: false}
    answer: "`const auto` : `auto` déduit `int`, et `const` interdit de modifier la variable."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que le compilateur déduise le type :
      ```cpp
      ___ prix = 9.99;
      ```
    blanks:
      - [auto]
    answer: "`auto` laisse le compilateur déduire `double` du littéral `9.99`."
  - key: trous-type-pi
    format: fill-in
    question: |-
      Complète le commentaire avec le type déduit :
      ```cpp
      auto pi = 3.14159;   // pi est de type ___
      ```
    blanks:
      - [double]
    answer: "Un littéral avec un point est un `double`."
  - key: trous-type-entier
    format: fill-in
    question: |-
      Complète le commentaire avec le type déduit :
      ```cpp
      auto total = 0;   // total est de type ___
      ```
    blanks:
      - [int]
    answer: "`0`, sans point, est un `int` : `total` aussi."
  - key: trous-const-auto
    format: fill-in
    question: |-
      Complète pour que `limite` soit une constante dont le type est déduit :
      ```cpp
      ___ auto limite = 100;
      ```
    blanks:
      - [const, constexpr]
    answer: "`const auto` : le type est déduit, et la variable ne peut plus être modifiée."
  - key: code-auto-division
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto a = 7 / 2;
          auto b = 7 / 2.0;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3.5 3.5`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`4 3.5`", correct: false}
    answer: "`3 3.5` : `7 / 2` est une division entière, `a` est un `int`. Dans `7 / 2.0`, un opérande est un `double` : `b` aussi."
    check:
      output: "3 3.5"
  - key: code-auto-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto n = 5;
          n = 2.9;
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`2.9`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2` : `n` est un `int`, déduit de `5`, et le reste. L'affectation convertit 2.9 en coupant la partie décimale."
    check:
      output: "2"
  - key: code-auto-const
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int limite = 10;
          auto copie = limite;
          copie = 20;
          std::println("{} {}", limite, copie);
      }
      ```
    choices:
      - {text: "`10 20`", correct: true}
      - {text: "`20 20`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10 20` : `auto` laisse tomber `const`. `copie` est un `int` ordinaire, une copie qu'on peut modifier sans toucher `limite`."
    check:
      output: "10 20"
  - key: code-auto-total
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto total = 0;
          total = total + 0.5;
          total = total + 0.5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0.5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `0` : `total` est un `int`. Chaque somme vaut 0.5, et l'affectation la ramène à 0 en coupant la décimale. Avec
      `auto total = 0.0;`, le programme afficherait 1.
    check:
      output: "0"
  - key: bug-auto-sans-valeur
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto age;
          age = 43;
          std::println("{}", age);
      }
      ```
    choices:
      - {text: "Écrire `auto age = 43;`", correct: true}
      - {text: "Écrire `auto int age;`", correct: false}
      - {text: "Écrire `auto age();`", correct: false}
      - {text: "Écrire `age = auto 43;`", correct: false}
    answer: |-
      ```cpp
      auto age = 43;
      ```
      `auto` déduit le type de la valeur de départ : elle doit être sur la ligne de la déclaration.
  - key: bug-auto-chaine
    format: bug-fix
    question: |-
      Le compilateur refuse `nom.size()`. Pourquoi ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          auto nom = "Ada";
          std::println("{}", nom.size());
      }
      ```
    choices:
      - {text: "`nom` est un `const char*`, pas une `std::string`", correct: true}
      - {text: "`size` s'écrit sans parenthèses pour une chaîne", correct: false}
      - {text: "`auto` ne peut pas déduire le type d'un texte", correct: false}
      - {text: "`std::println` ne sait pas afficher une taille", correct: false}
    answer: |-
      ```cpp
      std::string nom = "Ada";
      ```
      Un littéral entre guillemets est un tableau de caractères : `auto` en fait un `const char*`, qui n'a pas de
      fonction `size`. Inclure `<string>` ne change pas le type déduit.
  - key: bug-auto-deux-types
    format: bug-fix
    question: |-
      Le compilateur répond « inconsistent deduction for 'auto' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto largeur = 3, hauteur = 4.5;
          std::println("{}", largeur * hauteur);
      }
      ```
    choices:
      - {text: "Déclarer chaque variable sur sa propre ligne", correct: true}
      - {text: "Remplacer la virgule par un point-virgule seul", correct: false}
      - {text: "Écrire `4,5` avec une virgule décimale", correct: false}
      - {text: "Inverser l'ordre des deux variables", correct: false}
    answer: |-
      ```cpp
      auto largeur = 3;
      auto hauteur = 4.5;
      ```
      Dans une même déclaration, `auto` doit déduire un seul type : ici `int` pour l'une et `double` pour l'autre.
  - key: bug-auto-somme
    format: bug-fix
    question: |-
      Ce programme affiche `0` au lieu de `1.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto somme = 0;
          somme = somme + 0.75;
          somme = somme + 0.75;
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Écrire `auto somme = 0.0;`", correct: true}
      - {text: "Écrire `auto somme{};`", correct: false}
      - {text: "Écrire `const auto somme = 0;`", correct: false}
      - {text: "Écrire `auto somme = '0';`", correct: false}
    answer: |-
      ```cpp
      auto somme = 0.0;
      ```
      `0` est un `int` : `somme` aussi, et chaque affectation coupe la décimale. `0.0` est un `double`. Écrire
      `double somme = 0;` dirait la même chose plus clairement.
