notion: sizeof
lesson: |-
  `sizeof` donne la **taille en octets** d'un type ou d'une expression. C'est un opérateur, évalué **à la
  compilation** : il ne coûte rien à l'exécution, et son opérande n'est jamais exécuté.

  ```cpp
  sizeof(int)        // la taille d'un type : parenthèses obligatoires
  sizeof(x)          // la taille du type de x
  sizeof x           // permis pour une expression, sans parenthèses
  ```

  Le résultat est un **`std::size_t`**, un entier non signé.

  **Ce que le standard garantit.**

  - `sizeof(char)` vaut **toujours 1** : l'octet est l'unité de `sizeof`.
  - `sizeof(char) <= sizeof(short) <= sizeof(int) <= sizeof(long) <= sizeof(long long)`.
  - Le reste dépend de la plateforme.

  **Les tailles habituelles** (Linux 64 bits, comme le bac à sable) :

  | Type | Taille |
  |---|---|
  | `char`, `bool` | 1 |
  | `short` | 2 |
  | `int`, `float` | 4 |
  | `long`, `long long`, `double`, un pointeur | 8 |

  Sous Windows 64 bits, `long` fait 4 octets. Quand la taille compte, on prend les types de `<cstdint>` :
  `std::int32_t`, `std::int64_t`.

  **Les tableaux.** `sizeof` d'un tableau donne sa taille **totale** en octets. Le nombre d'éléments s'en déduit,
  mais `std::size` le donne directement :

  ```cpp
  int notes[5] = {};
  sizeof(notes)                       // 20
  sizeof(notes) / sizeof(notes[0])    // 5
  std::size(notes)                    // 5
  ```

  **Le piège du pointeur.** Un tableau passé à une fonction devient un **pointeur** : `sizeof` y donne alors la
  taille du pointeur, 8, et non celle du tableau.

  ```cpp
  void afficher(int notes[]) {
      sizeof(notes);                  // 8 : notes est un int*
  }
  ```

  De même, `sizeof` d'une chaîne C tenue par un `const char*` donne 8, pas sa longueur.

  **Ce que `sizeof` ne voit pas.** Seulement l'objet lui-même, pas la mémoire qu'il possède ailleurs.
  `sizeof(std::vector<int>)` vaut 24, qu'il contienne zéro ou un million d'éléments ; et `sizeof(std::string)` ne
  dit rien de la longueur du texte. Le nombre d'éléments, c'est `size()`.

  **Les structures.** La taille d'une `struct` peut dépasser la somme de ses membres : le compilateur insère des
  octets de **remplissage** pour aligner chaque membre.

  ```cpp
  struct Mesure {
      char unite;      // 1 octet, puis 3 de remplissage
      int valeur;      // 4 octets
  };                   // sizeof(Mesure) vaut 8
  ```

  **L'opérande n'est pas évalué.** `sizeof(i++)` n'incrémente pas `i` : seul le type de l'expression est examiné.

  **En entretien** : « `sizeof` donne une taille en octets, à la compilation, en `std::size_t`. `sizeof(char)`
  vaut 1 ; le reste dépend de la plateforme. Sur un tableau passé en paramètre, il donne la taille d'un pointeur.
  Et il ne dit rien de la taille d'un vecteur : pour ça, `size()`. »
tour:
  - title: La taille d'un type
    text: |-
      `sizeof` donne la taille d'un type, ou d'une variable, en **octets**. Le compilateur la calcule : rien ne
      s'exécute.

      `sizeof(char)` vaut toujours 1. Les autres tailles dépendent de la machine ; ici, un `int` occupe 4 octets,
      un `double` 8.

      Essaie : ajoute `long long` à l'affichage, puis exécute. Sa taille est celle d'un `double`.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int note = 15;
              std::println("char : {}", sizeof(char));
              std::println("int : {}", sizeof(note));
              std::println("double : {}", sizeof(double));
          }
      output: |-
        char : 1
        int : 4
        double : 8
cards:
  - key: definition
    format: course
    question: "Que renvoie `sizeof(int)` ?"
    choices:
      - {text: "La taille d'un `int` en octets, calculée à la compilation", correct: true}
      - {text: "La taille d'un `int` en bits, calculée à l'exécution", correct: false}
      - {text: "La plus grande valeur qu'un `int` peut contenir", correct: false}
      - {text: "Le nombre de variables de type `int` du programme", correct: false}
    answer: "`sizeof` compte en octets, et son résultat est une constante de compilation, de type `std::size_t`."
  - key: char-un
    format: course
    question: "Quelle taille le standard garantit-il, quelle que soit la machine ?"
    choices:
      - {text: "`sizeof(char)` vaut 1", correct: true}
      - {text: "`sizeof(int)` vaut 4", correct: false}
      - {text: "`sizeof(long)` vaut 8", correct: false}
      - {text: "`sizeof(bool)` vaut 1", correct: false}
    answer: "Le `char` est l'unité de mesure de `sizeof`. Les autres tailles sont définies par l'implémentation ; seul leur ordre est garanti."
  - key: tableau-pointeur
    format: course
    question: "Que donne `sizeof(notes)` dans une fonction qui reçoit le paramètre `int notes[]` ?"
    choices:
      - {text: "La taille d'un pointeur : le tableau est devenu un `int*`", correct: true}
      - {text: "La taille totale du tableau passé par l'appelant", correct: false}
      - {text: "Le nombre d'éléments du tableau passé par l'appelant", correct: false}
      - {text: "Zéro : la taille d'un paramètre n'est pas connue", correct: false}
    answer: "Un paramètre écrit `int notes[]` est un `int*`. L'information de taille est perdue : on passe la taille à part, ou mieux, un `std::span` ou un `std::vector`."
  - key: vecteur
    format: course
    question: "Que vaut `sizeof(v)` pour un `std::vector<int> v` d'un million d'éléments ?"
    choices:
      - {text: "La taille de l'objet vecteur lui-même, quelques octets, sans ses éléments", correct: true}
      - {text: "Quatre millions : un million d'entiers de quatre octets", correct: false}
      - {text: "Un million : le nombre d'éléments du vecteur", correct: false}
      - {text: "Une valeur calculée à l'exécution, selon la capacité", correct: false}
    answer: "Le vecteur tient trois pointeurs, soit 24 octets ; ses éléments sont sur le tas. `sizeof` ne voit que l'objet. Le nombre d'éléments est `v.size()`."
  - key: vf-octets
    format: true-false
    question: "`sizeof` donne une taille en bits."
    truth: false
    answer: "En octets. Un `int` de 32 bits a un `sizeof` de 4."
  - key: vf-compilation
    format: true-false
    question: "`sizeof` est évalué à la compilation."
    truth: true
    answer: "Son résultat est une constante : on peut s'en servir comme taille d'un `std::array` ou dans un `static_assert`."
  - key: vf-evalue
    format: true-false
    question: "`sizeof(i++)` incrémente la variable `i`."
    truth: false
    answer: "L'opérande de `sizeof` n'est pas évalué : seul son type compte."
  - key: vf-struct
    format: true-false
    question: "La taille d'une `struct` est toujours la somme des tailles de ses membres."
    truth: false
    answer: "Le compilateur peut insérer des octets de remplissage pour aligner les membres. Une `struct` d'un `char` et d'un `int` occupe 8 octets, pas 5."
  - key: qcm-type-resultat
    format: multiple-choice
    question: "Quel est le type du résultat de `sizeof` ?"
    choices:
      - {text: "`std::size_t`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`double`", correct: false}
      - {text: "`char`", correct: false}
    answer: "Un entier non signé, assez grand pour la taille de n'importe quel objet."
  - key: qcm-nombre-elements
    format: multiple-choice
    question: "Quelle expression donne le nombre d'éléments du tableau `int notes[5]` ?"
    choices:
      - {text: "`std::size(notes)`", correct: true}
      - {text: "`sizeof(notes)`", correct: false}
      - {text: "`sizeof(notes[0])`", correct: false}
      - {text: "`notes.size()`", correct: false}
    answer: "`std::size(notes)` vaut 5. `sizeof(notes)` vaut 20, la taille en octets ; et un tableau brut n'a pas de fonction membre."
  - key: qcm-taille-fixe
    format: multiple-choice
    question: "Tu as besoin d'un entier de 32 bits exactement, sur toutes les plateformes. Quel type choisis-tu ?"
    choices:
      - {text: "`std::int32_t`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`long`", correct: false}
      - {text: "`short`", correct: false}
    answer: "Les types de `<cstdint>` ont une taille fixée. `int` fait presque toujours 4 octets, mais rien ne le garantit ; `long` en fait 4 ou 8 selon le système."
  - key: qcm-pointeur
    format: multiple-choice
    question: "Sur une machine 64 bits, que vaut `sizeof(p)` pour `const char* p = \"bonjour\";` ?"
    choices:
      - {text: "8 : la taille du pointeur", correct: true}
      - {text: "7 : le nombre de lettres", correct: false}
      - {text: "8 : les sept lettres et le caractère nul", correct: false}
      - {text: "1 : la taille d'un `char`", correct: false}
    answer: "`p` est un pointeur : sa taille ne dépend pas de ce qu'il désigne. La longueur du texte se compte avec `std::strlen`."
  - key: trous-sizeof
    format: fill-in
    question: |-
      Complète pour afficher la taille d'un `double` en octets :
      ```cpp
      std::println("{}", ___(double));
      ```
    blanks:
      - [sizeof]
    answer: "`sizeof(double)` vaut 8 sur les plateformes courantes."
  - key: trous-division
    format: fill-in
    question: |-
      Complète pour calculer le nombre d'éléments du tableau :
      ```cpp
      int notes[5] = {};
      std::size_t nombre = sizeof(notes) / sizeof(___);
      ```
    blanks:
      - ["notes[0]", int]
    answer: "La taille totale divisée par celle d'un élément. `std::size(notes)` fait la même chose, sans erreur possible."
  - key: trous-size
    format: fill-in
    question: |-
      Complète pour obtenir le nombre d'éléments du vecteur, et non la taille de l'objet :
      ```cpp
      std::vector<int> v{1, 2, 3};
      std::println("{}", v.___());
      ```
    blanks:
      - [size]
    answer: "`v.size()` vaut 3. `sizeof(v)` vaudrait 24, quel que soit le contenu."
  - key: trous-un
    format: fill-in
    question: |-
      Complète avec la valeur que le standard garantit :
      ```cpp
      static_assert(sizeof(char) == ___);
      ```
    blanks:
      - ["1"]
    answer: "`sizeof(char)` vaut toujours 1."
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <iterator>
      #include <print>

      int main() {
          int notes[5] = {};
          std::println("{} {} {}", sizeof(notes), sizeof(notes[0]), std::size(notes));
      }
      ```
    choices:
      - {text: "`20 4 5`", correct: true}
      - {text: "`5 4 5`", correct: false}
      - {text: "`20 4 20`", correct: false}
      - {text: "`8 4 5`", correct: false}
    answer: "`20 4 5` : avec des `int` de quatre octets, comme sur les plateformes courantes, cinq éléments en font vingt. `std::size` donne le nombre d'éléments."
    check:
      output: "20 4 5"
  - key: code-parametre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      std::size_t taille(const char* texte) {
          return sizeof(texte);
      }

      int main() {
          const char mot[] = "abc";
          std::println("{} {}", sizeof(mot), taille(mot) == sizeof(const char*));
      }
      ```
    choices:
      - {text: "`4 true`", correct: true}
      - {text: "`3 true`", correct: false}
      - {text: "`4 false`", correct: false}
      - {text: "`3 false`", correct: false}
    answer: "`4 true` : dans `main`, `mot` est un tableau de quatre `char`, caractère nul compris. Passé à la fonction, il devient un pointeur : `sizeof` donne la taille d'un pointeur."
    check:
      output: "4 true"
  - key: code-non-evalue
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int i = 5;
          const std::size_t taille = sizeof(i++);
          std::println("{} {}", i, taille == sizeof(int));
      }
      ```
    choices:
      - {text: "`5 true`", correct: true}
      - {text: "`6 true`", correct: false}
      - {text: "`5 false`", correct: false}
      - {text: "`6 false`", correct: false}
    answer: "`5 true` : l'opérande de `sizeof` n'est pas évalué. `i` n'est pas incrémenté ; seul le type de l'expression, `int`, est examiné."
    check:
      output: "5 true"
  - key: code-vector
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> petit{1};
          const std::vector<int> grand(1000);
          std::println("{} {} {}", sizeof(petit) == sizeof(grand), petit.size(), grand.size());
      }
      ```
    choices:
      - {text: "`true 1 1000`", correct: true}
      - {text: "`false 1 1000`", correct: false}
      - {text: "`true 4 4000`", correct: false}
      - {text: "`false 4 4000`", correct: false}
    answer: "`true 1 1000` : `sizeof` mesure l'objet vecteur, de taille fixe ; les éléments sont sur le tas. `size()` donne leur nombre."
    check:
      output: "true 1 1000"
  - key: bug-tableau-parametre
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5`, le nombre de notes. Il affiche `2`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      std::size_t nombre(int notes[]) {
          return sizeof(notes) / sizeof(notes[0]);
      }

      int main() {
          int notes[5] = {12, 15, 9, 18, 11};
          std::println("{}", nombre(notes));
      }
      ```
    choices:
      - {text: "Recevoir un `std::span<int>`, et renvoyer `notes.size()`", correct: true}
      - {text: "Recevoir un `int* notes`, sans rien changer d'autre", correct: false}
      - {text: "Renvoyer `sizeof(notes)`, sans la division", correct: false}
      - {text: "Renvoyer `sizeof(notes) * sizeof(notes[0])`", correct: false}
    answer: |-
      ```cpp
      std::size_t nombre(std::span<int> notes) {
          return notes.size();
      }
      ```
      Dans la fonction, `notes` est un `int*` : `sizeof` donne 8, divisé par 4. `std::span` (C++20) transporte le
      pointeur et la taille ; un `std::vector` ou un `std::array` connaissent aussi la leur.
  - key: bug-sizeof-vector
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, le nombre de prix. Il affiche `24`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> prix{5, 8, 13};
          std::println("{}", sizeof(prix));
      }
      ```
    choices:
      - {text: "Afficher `prix.size()`", correct: true}
      - {text: "Afficher `sizeof(prix) / sizeof(int)`", correct: false}
      - {text: "Afficher `sizeof(prix[0])`", correct: false}
      - {text: "Afficher `sizeof prix`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", prix.size());
      ```
      `sizeof` mesure l'objet vecteur : trois pointeurs, 24 octets, quel que soit son contenu. Le nombre d'éléments
      est `size()`.
  - key: bug-sizeof-chaine
    format: bug-fix
    question: |-
      Ce programme devrait afficher `7`, la longueur du mot. Il affiche `8`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char* mot = "bonjour";
          std::println("{}", sizeof(mot));
      }
      ```
    choices:
      - {text: "Déclarer `std::string_view mot`, et afficher `mot.size()`", correct: true}
      - {text: "Afficher `sizeof(*mot)`, la taille de ce que désigne le pointeur", correct: false}
      - {text: "Afficher `sizeof(mot) - 1`, pour retirer le caractère nul", correct: false}
      - {text: "Déclarer `const char mot = \"bonjour\";`, sans l'étoile", correct: false}
    answer: |-
      ```cpp
      const std::string_view mot = "bonjour";
      std::println("{}", mot.size());
      ```
      `sizeof(mot)` est la taille du pointeur : 8, par coïncidence proche de 7. Une `std::string_view` ou une
      `std::string` connaissent leur longueur ; pour une chaîne C, c'est `std::strlen`.
  - key: bug-taille-supposee
    format: bug-fix
    question: |-
      Ce code suppose que `long` occupe 8 octets : c'est vrai sous Linux, faux sous Windows, où le fichier lu est
      alors mal décodé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          long identifiant = 0;
          std::println("{}", sizeof(identifiant) == 8);
      }
      ```
    choices:
      - {text: "Déclarer `std::int64_t identifiant`, avec `#include <cstdint>`", correct: true}
      - {text: "Déclarer `unsigned long identifiant`, de la même taille", correct: false}
      - {text: "Déclarer `int identifiant`, qui fait 8 octets partout", correct: false}
      - {text: "Déclarer `long identifiant[2]`, pour être sûr d'avoir la place", correct: false}
    answer: |-
      ```cpp
      std::int64_t identifiant = 0;
      ```
      La taille de `long` est définie par l'implémentation : 8 octets sous Linux 64 bits, 4 sous Windows. Quand un
      format impose une taille, on prend un type de `<cstdint>`.
