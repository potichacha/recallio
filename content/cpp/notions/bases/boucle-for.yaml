notion: boucle-for
lesson: |-
  **`for`** réunit sur une ligne les trois éléments d'une boucle qui compte :

  ```cpp
  for (int i = 0; i < 5; ++i) {
      std::println("{}", i);
  }
  ```

  | Partie | Rôle | Quand |
  |---|---|---|
  | `int i = 0` | l'**initialisation** | une fois, avant la boucle |
  | `i < 5` | la **condition** | avant chaque tour ; fausse, la boucle s'arrête |
  | `++i` | le **pas** | après chaque tour |

  C'est un `while` rangé : `int i = 0; while (i < 5) { ...; ++i; }`.

  - La variable déclarée dans l'initialisation **n'existe que dans la boucle**.
  - **La convention** : partir de 0 et tester avec `<`. `for (int i = 0; i < n; ++i)` fait exactement `n` tours, pour
    `i` de 0 à `n - 1`.
  - Le pas est libre : `i += 2` pour avancer de deux en deux, `--i` pour compter à rebours (avec une condition `>` ou
    `>=`).
  - Les trois parties sont facultatives. `for (;;)` est une boucle sans fin.

  **Pièges classiques.**

  - **L'erreur d'une unité** (*off-by-one*) : `<=` au lieu de `<` fait un tour de trop.
  - **Un point-virgule** après la parenthèse : la boucle tourne à vide, et le bloc ne s'exécute qu'une fois.
  - **Un pas qui ne modifie rien** : `i + 2` calcule sans ranger. Il faut `i += 2`.
  - **Compter à rebours avec un type non signé** : `i >= 0` est toujours vrai.

  **En entretien** : « Je pars de 0 et je teste avec `<` : la boucle fait `n` tours, et `i` sert directement
  d'indice. »
tour:
  - title: La boucle for
    text: |-
      `for` est la boucle qui compte. Entre ses parenthèses : une initialisation, une condition, un pas, séparés par
      des points-virgules.

      `for (int i = 0; i < 5; ++i)` fait cinq tours, avec `i` de 0 à 4. La variable `i` n'existe que dans la boucle.

      Ici, on additionne les entiers de 1 à 10.

      Essaie : remplace `++i` par `i += 2`, puis exécute. La boucle n'additionne plus que les nombres impairs.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int somme = 0;

              for (int i = 1; i <= 10; ++i) {
                  somme += i;
              }

              std::println("1 + 2 + ... + 10 = {}", somme);
          }
      output: "1 + 2 + ... + 10 = 55"
    task:
      instructions: |-
        Fais afficher la table de 7, de `7 x 1 = 7` à `7 x 5 = 35`, une ligne par multiplication.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              std::println("7 x {} = {}", 1, 7 * 1);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              for (int i = 1; i <= 5; ++i) {
                  std::println("7 x {} = {}", i, 7 * i);
              }
          }
      output: |-
        7 x 1 = 7
        7 x 2 = 14
        7 x 3 = 21
        7 x 4 = 28
        7 x 5 = 35
cards:
  - key: trois-parties
    format: course
    question: "Dans `for (int i = 0; i < 5; ++i)`, à quel moment `++i` s'exécute-t-il ?"
    choices:
      - {text: "Après chaque tour, avant le test de la condition", correct: true}
      - {text: "Avant chaque tour, avant le test de la condition", correct: false}
      - {text: "Une seule fois, avant le premier tour", correct: false}
      - {text: "Une seule fois, après le dernier tour", correct: false}
    answer: "Le pas s'exécute à la fin de chaque tour. La condition est ensuite testée, avant le tour suivant."
  - key: equivalent-while
    format: course
    question: "Par quoi peut-on remplacer `for (int i = 0; i < 5; ++i) { ... }` ?"
    choices:
      - {text: "Par un `while (i < 5)` précédé de `int i = 0;`, avec `++i;` en fin de bloc", correct: true}
      - {text: "Par un `while (i < 5)` précédé de `int i = 0;`, avec `++i;` en début de bloc", correct: false}
      - {text: "Par un `do`-`while`, qui teste la condition au même moment", correct: false}
      - {text: "Par rien : un `for` fait ce qu'aucune autre boucle ne fait", correct: false}
    answer: "Un `for` est un `while` dont l'initialisation, la condition et le pas sont réunis. Le pas s'exécute en fin de tour."
  - key: convention-zero
    format: course
    question: "Combien de tours fait `for (int i = 0; i < n; ++i)` ?"
    choices:
      - {text: "`n` tours, pour `i` de 0 à `n - 1`", correct: true}
      - {text: "`n + 1` tours, pour `i` de 0 à `n`", correct: false}
      - {text: "`n - 1` tours, pour `i` de 1 à `n - 1`", correct: false}
      - {text: "`n` tours, pour `i` de 1 à `n`", correct: false}
    answer: "Partir de 0 et tester avec `<` donne exactement `n` tours. `i` va de 0 à `n - 1` : ce sont les indices d'un tableau de `n` éléments."
  - key: portee-du-compteur
    format: course
    question: "Où la variable `i` de `for (int i = 0; i < 5; ++i)` est-elle visible ?"
    choices:
      - {text: "Dans la boucle seulement", correct: true}
      - {text: "Dans la boucle, et jusqu'à la fin de la fonction", correct: false}
      - {text: "Dans tout le fichier, comme une variable globale", correct: false}
      - {text: "Dans le premier tour de boucle seulement", correct: false}
    answer: "Déclarée dans l'en-tête du `for`, elle disparaît à la fin de la boucle. Deux boucles qui se suivent peuvent donc utiliser chacune leur `i`."
  - key: vf-initialisation-une-fois
    format: true-false
    question: La partie initialisation d'un `for` s'exécute à chaque tour.
    truth: false
    answer: Elle s'exécute une seule fois, avant le premier test de la condition.
  - key: vf-for-vide
    format: true-false
    question: "`for (;;)` compile, et boucle sans fin."
    truth: true
    answer: Les trois parties sont facultatives. Sans condition, la boucle ne s'arrête que par `break` ou `return`.
  - key: vf-inferieur-ou-egal
    format: true-false
    question: "`for (int i = 0; i <= 5; ++i)` fait cinq tours."
    truth: false
    answer: "Elle en fait six : pour `i` de 0 à 5 inclus. C'est l'erreur d'une unité classique."
  - key: vf-zero-tour
    format: true-false
    question: Une boucle `for` peut ne faire aucun tour.
    truth: true
    answer: La condition est testée avant le premier tour, comme pour un `while`.
  - key: qcm-dix-tours
    format: multiple-choice
    question: Quelle boucle fait exactement dix tours ?
    choices:
      - {text: "`for (int i = 0; i < 10; ++i)`", correct: true}
      - {text: "`for (int i = 0; i <= 10; ++i)`", correct: false}
      - {text: "`for (int i = 1; i < 10; ++i)`", correct: false}
      - {text: "`for (int i = 10; i < 0; --i)`", correct: false}
    answer: "De 0 à 9 : dix valeurs. `<= 10` en fait onze, partir de 1 avec `< 10` en fait neuf, et la dernière ne fait aucun tour."
  - key: qcm-rebours
    format: multiple-choice
    question: Quelle boucle affiche 3, 2, 1 ?
    choices:
      - {text: "`for (int i = 3; i > 0; --i)`", correct: true}
      - {text: "`for (int i = 3; i < 0; --i)`", correct: false}
      - {text: "`for (int i = 3; i > 0; ++i)`", correct: false}
      - {text: "`for (int i = 0; i < 3; --i)`", correct: false}
    answer: "On part de 3, on continue tant que `i > 0`, et on décrémente. Avec `i < 0`, la condition est fausse d'emblée."
  - key: qcm-pas-de-deux
    format: multiple-choice
    question: Quel pas fait avancer `i` de deux en deux ?
    choices:
      - {text: "`i += 2`", correct: true}
      - {text: "`i + 2`", correct: false}
      - {text: "`i++2`", correct: false}
      - {text: "`2++i`", correct: false}
    answer: "`i += 2` modifie `i`. `i + 2` calcule une valeur sans la ranger : `i` ne change pas, et la boucle ne s'arrête jamais."
  - key: qcm-separateur
    format: multiple-choice
    question: Quel caractère sépare les trois parties de l'en-tête d'un `for` ?
    choices:
      - {text: "Le point-virgule", correct: true}
      - {text: "La virgule", correct: false}
      - {text: "Les deux-points", correct: false}
      - {text: "L'espace", correct: false}
    answer: "Deux points-virgules : `for (initialisation; condition; pas)`. Les deux-points servent à la boucle sur un intervalle, `for (int x : valeurs)`."
  - key: trous-for
    format: fill-in
    question: |-
      Complète avec le mot-clé de la boucle qui compte :
      ```cpp
      ___ (int i = 0; i < 5; ++i) {
          std::println("{}", i);
      }
      ```
    blanks:
      - [for]
    answer: "`for (initialisation; condition; pas) { ... }`."
  - key: trous-condition
    format: fill-in
    question: |-
      Complète pour que la boucle fasse exactement cinq tours :
      ```cpp
      for (int i = 0; i ___ 5; ++i) {
          std::println("{}", i);
      }
      ```
    blanks:
      - ["<", "!="]
    answer: "`i < 5` : la boucle tourne pour `i` de 0 à 4."
  - key: trous-pas
    format: fill-in
    question: |-
      Complète pour passer au nombre suivant à chaque tour :
      ```cpp
      for (int i = 0; i < 5; ___i) {
          std::println("{}", i);
      }
      ```
    blanks:
      - ["++"]
    answer: "`++i` ajoute 1 à `i` après chaque tour."
  - key: trous-rebours
    format: fill-in
    question: |-
      Complète pour compter à rebours de 10 à 1 :
      ```cpp
      for (int i = 10; i > 0; ___i) {
          std::println("{}", i);
      }
      ```
    blanks:
      - ["--"]
    answer: "`--i` retire 1 à `i` après chaque tour."
  - key: code-zero-a-deux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 3; ++i) {
              std::print("{}", i);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`012`", correct: true}
      - {text: "`123`", correct: false}
      - {text: "`0123`", correct: false}
      - {text: "`12`", correct: false}
    answer: "`012` : `i` part de 0, et la boucle s'arrête quand `i` vaut 3, sans l'afficher."
    check:
      output: "012"
  - key: code-somme
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int somme = 0;
          for (int i = 1; i <= 5; ++i) {
              somme += i;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`21`", correct: false}
    answer: "`15` : la boucle additionne 1, 2, 3, 4 et 5. Avec `<=`, la borne 5 est incluse."
    check:
      output: "15"
  - key: code-pas-de-trois
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          for (int i = 10; i > 0; i -= 3) {
              std::println("{}", i);
          }
      }
      ```
    choices:
      - text: |-
          ```
          10
          7
          4
          1
          ```
        correct: true
      - text: |-
          ```
          10
          7
          4
          ```
        correct: false
      - text: |-
          ```
          10
          7
          4
          1
          -2
          ```
        correct: false
      - text: |-
          ```
          7
          4
          1
          ```
        correct: false
    answer: |-
      ```
      10
      7
      4
      1
      ```
      `i` perd 3 à chaque tour. Après 1, il vaut -2 : la condition `i > 0` est fausse, la boucle s'arrête.
    check:
      output: |-
        10
        7
        4
        1
  - key: code-un-tour-de-trop
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int tours = 0;
          for (int i = 0; i <= 5; ++i) {
              ++tours;
          }
          std::println("{}", tours);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`7`", correct: false}
    answer: "`6` : de 0 à 5 inclus, il y a six valeurs. Pour cinq tours, la condition serait `i < 5`."
    check:
      output: "6"
  - key: bug-un-de-moins
    format: bug-fix
    question: |-
      Ce programme devrait afficher les nombres de 1 à 5, et affiche ceux de 0 à 4. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 5; ++i) {
              std::println("{}", i);
          }
      }
      ```
    choices:
      - {text: "Écrire `for (int i = 1; i <= 5; ++i)`", correct: true}
      - {text: "Écrire `for (int i = 1; i < 5; ++i)`", correct: false}
      - {text: "Écrire `for (int i = 0; i <= 5; ++i)`", correct: false}
      - {text: "Écrire `for (int i = 0; i < 6; ++i)`", correct: false}
    answer: |-
      ```cpp
      for (int i = 1; i <= 5; ++i) {
      ```
      Les deux bornes changent : on part de 1, et on inclut 5. Afficher `i + 1` dans la boucle d'origine marcherait
      aussi.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Bonjour` trois fois, et ne l'affiche qu'une fois. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 3; ++i); {
              std::println("Bonjour");
          }
      }
      ```
    choices:
      - {text: "Le point-virgule après la parenthèse est le corps de la boucle", correct: true}
      - {text: "La variable `i` n'est pas utilisée dans le bloc", correct: false}
      - {text: "`++i` doit s'écrire `i++` dans un `for`", correct: false}
      - {text: "`i < 3` devient faux dès le premier tour", correct: false}
    answer: |-
      ```cpp
      for (int i = 0; i < 3; ++i) {
      ```
      La boucle fait ses trois tours sur une instruction vide. Le bloc entre accolades vient après, et s'exécute une
      seule fois.
  - key: bug-rebours
    format: bug-fix
    question: |-
      Ce compte à rebours n'affiche rien. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 5; i < 0; --i) {
              std::println("{}", i);
          }
      }
      ```
    choices:
      - {text: "Écrire la condition `i > 0`", correct: true}
      - {text: "Écrire le pas `++i`", correct: false}
      - {text: "Écrire l'initialisation `int i = 0`", correct: false}
      - {text: "Écrire la condition `i == 0`", correct: false}
    answer: |-
      ```cpp
      for (int i = 5; i > 0; --i) {
      ```
      La condition dit quand **continuer** : `5 < 0` est faux d'emblée, la boucle ne fait aucun tour. En descendant,
      on continue tant que `i > 0`.
  - key: bug-pas-sans-effet
    format: bug-fix
    question: |-
      Ce programme devrait afficher 0, 2, 4, 6, 8, et affiche `0` sans fin. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 10; i + 2) {
              std::println("{}", i);
          }
      }
      ```
    choices:
      - {text: "`i + 2` calcule une valeur sans modifier `i`", correct: true}
      - {text: "Un pas de 2 n'est pas permis dans un `for`", correct: false}
      - {text: "`i < 10` doit s'écrire `i <= 10` pour un pas pair", correct: false}
      - {text: "`i` est remise à zéro au début de chaque tour", correct: false}
    answer: |-
      ```cpp
      for (int i = 0; i < 10; i += 2) {
      ```
      Le pas doit modifier le compteur. `i + 2` calcule 2 et le jette ; `i += 2` range le résultat dans `i`.
