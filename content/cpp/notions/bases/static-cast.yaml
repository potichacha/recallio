notion: static-cast
lesson: |-
  **`static_cast<Type>(valeur)`** convertit **explicitement** une valeur vers un autre type :

  ```cpp
  int a = 7;
  int b = 2;
  double quotient = static_cast<double>(a) / b;   // 3.5
  int entier = static_cast<int>(9.99);            // 9
  ```

  - Il **ne modifie pas** la variable : il produit une nouvelle valeur, du type demandé.
  - Il fait les mêmes conversions que les conversions implicites, mais **visiblement** : le lecteur sait qu'elle est
    voulue, et le compilateur n'avertit plus.
  - Vers un entier, il **tronque** : `static_cast<int>(9.99)` vaut 9. Pour arrondir, on appelle `std::round` d'abord.
  - Il est **vérifié à la compilation** : une conversion sans rapport (`static_cast<int>("42")`) ne compile pas.
    Convertir un texte en nombre se fait avec `std::stoi`.

  **Où placer le cast.** Il doit agir **avant** l'opération qu'il corrige :

  ```cpp
  static_cast<double>(a) / b    // 3.5 : a devient double, puis division à virgule
  static_cast<double>(a / b)    // 3.0 : division entière d'abord, trop tard
  ```

  **Face au cast du C.** `(double)a` et `double(a)` compilent aussi. On les évite : le cast du C essaie plusieurs
  conversions, dont de dangereuses, sans dire laquelle il applique, et il ne se retrouve pas par une recherche dans
  le code. `static_cast` ne fait que les conversions sûres, et se repère d'un coup d'œil.

  **En entretien** : « J'utilise `static_cast` plutôt que le cast du C : il n'accepte que les conversions qui ont un
  sens, il est vérifié à la compilation, et il se cherche facilement dans le code. »
tour:
  - title: Convertir avec static_cast
    text: |-
      Pour convertir une valeur volontairement, on écrit `static_cast<Type>(valeur)`. La conversion devient visible,
      au lieu d'être laissée au compilateur.

      Le cas le plus courant : obtenir une division à virgule entre deux entiers. Le cast doit porter sur un opérande,
      avant la division.

      Essaie : déplace la parenthèse pour écrire `static_cast<double>(points / matchs)`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int points = 7;
              int matchs = 2;

              double moyenne = static_cast<double>(points) / matchs;
              int arrondi_bas = static_cast<int>(moyenne);

              std::println("{} {}", moyenne, arrondi_bas);
          }
      output: "3.5 3"
    task:
      instructions: |-
        Le programme affiche `33.0 %`, parce que la division est entière. Fais-lui afficher `33.3 %` avec un
        `static_cast`, sans changer le type des deux variables.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int reussis = 100;
              int total = 3;
              std::println("{:.1f} %", static_cast<double>(reussis / total));
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int reussis = 100;
              int total = 3;
              std::println("{:.1f} %", static_cast<double>(reussis) / total);
          }
      output: "33.3 %"
cards:
  - key: role-de-static-cast
    format: course
    question: "À quoi sert `static_cast<double>(n)` ?"
    choices:
      - {text: "À convertir explicitement la valeur de `n` en `double`", correct: true}
      - {text: "À changer pour de bon le type de la variable `n`", correct: false}
      - {text: "À vérifier à l'exécution que `n` est un `double`", correct: false}
      - {text: "À déclarer une constante `n` de type `double`", correct: false}
    answer: "Il produit une nouvelle valeur, de type `double`, à partir de `n`. La variable `n` garde son type et sa valeur."
  - key: pourquoi-pas-cast-c
    format: course
    question: "Pourquoi préférer `static_cast<double>(n)` au cast du C, `(double)n` ?"
    choices:
      - {text: "Il n'accepte que les conversions sûres, et se repère dans le code", correct: true}
      - {text: "Il est plus rapide à l'exécution que le cast du C", correct: false}
      - {text: "Il arrondit au plus proche, alors que le cast du C tronque", correct: false}
      - {text: "Le cast du C ne compile plus depuis C++11", correct: false}
    answer: |-
      Le cast du C essaie plusieurs conversions, dont certaines dangereuses, sans dire laquelle il applique.
      `static_cast` refuse celles qui n'ont pas de sens, et son nom se trouve par une simple recherche. Les deux
      coûtent la même chose à l'exécution.
  - key: ou-placer-le-cast
    format: course
    question: "Avec deux `int`, pourquoi `static_cast<double>(a / b)` ne donne-t-il pas la division à virgule ?"
    choices:
      - {text: "La division entière est faite avant la conversion", correct: true}
      - {text: "Un `static_cast` ne s'applique qu'à une variable seule", correct: false}
      - {text: "Le `static_cast` arrondit le résultat de la division", correct: false}
      - {text: "La conversion en `double` est refusée pour un quotient", correct: false}
    answer: "`a / b` est calculé d'abord, entre entiers. Convertir ensuite arrive trop tard : il faut convertir un opérande, `static_cast<double>(a) / b`."
  - key: cast-tronque
    format: course
    question: "Que vaut `static_cast<int>(9.99)` ?"
    choices:
      - {text: "9 : la partie décimale est coupée", correct: true}
      - {text: "10 : la valeur est arrondie au plus proche", correct: false}
      - {text: "9.99 : un `static_cast` ne perd rien", correct: false}
      - {text: "Rien : cette conversion ne compile pas", correct: false}
    answer: "9. Comme la conversion implicite, `static_cast` tronque vers zéro. Pour arrondir : `static_cast<int>(std::round(9.99))`."
  - key: vf-modifie-la-variable
    format: true-false
    question: "`static_cast<double>(n)` change le type de la variable `n`."
    truth: false
    answer: Le type d'une variable ne change jamais. Le cast produit une nouvelle valeur, à utiliser dans l'expression.
  - key: vf-verifie-a-la-compilation
    format: true-false
    question: Un `static_cast` entre deux types sans rapport est refusé à la compilation.
    truth: true
    answer: "`static_cast<int>(\"42\")` ne compile pas : il n'existe pas de conversion d'un texte vers un entier."
  - key: vf-arrondit
    format: true-false
    question: "`static_cast<int>(2.7)` vaut 3."
    truth: false
    answer: "La conversion tronque : elle vaut 2. `std::round` arrondit."
  - key: vf-cout-execution
    format: true-false
    question: "`static_cast<double>(n)` coûte plus cher à l'exécution que la conversion implicite de `n` en `double`."
    truth: false
    answer: "C'est la même conversion. Seule l'écriture change : elle est visible dans le code."
  - key: qcm-syntaxe
    format: multiple-choice
    question: Quelle écriture convertit `n` en `double` avec `static_cast` ?
    choices:
      - {text: "`static_cast<double>(n)`", correct: true}
      - {text: "`static_cast(double, n)`", correct: false}
      - {text: "`static_cast<n>(double)`", correct: false}
      - {text: "`static_cast[double](n)`", correct: false}
    answer: "Le type visé entre chevrons, la valeur entre parenthèses : `static_cast<double>(n)`."
  - key: qcm-division-a-virgule
    format: multiple-choice
    question: "Avec `int a = 7, b = 2;`, quelle expression vaut 3.5 ?"
    choices:
      - {text: "`static_cast<double>(a) / b`", correct: true}
      - {text: "`static_cast<double>(a / b)`", correct: false}
      - {text: "`static_cast<int>(a) / b`", correct: false}
      - {text: "`a / static_cast<int>(b)`", correct: false}
    answer: "Le cast rend `a` `double` avant la division, qui garde alors la virgule. Placé autour de `a / b`, il convertit le 3 de la division entière."
  - key: qcm-texte-en-nombre
    format: multiple-choice
    question: "Comment convertir le texte `\"42\"` en entier ?"
    choices:
      - {text: "Avec `std::stoi(\"42\")`", correct: true}
      - {text: "Avec `static_cast<int>(\"42\")`", correct: false}
      - {text: "Avec `int n = \"42\";`", correct: false}
      - {text: "Avec `(int)\"42\"`, comme en C", correct: false}
    answer: |-
      `std::stoi` lit le nombre écrit dans la chaîne. Un cast ne lit pas le texte : `static_cast` refuse de compiler,
      et le cast du C convertit l'adresse de la chaîne, ce qui n'a aucun sens.
  - key: qcm-arrondir
    format: multiple-choice
    question: "Comment obtenir 16 à partir de `double note = 15.8;` ?"
    choices:
      - {text: "`static_cast<int>(std::round(note))`", correct: true}
      - {text: "`static_cast<int>(note)`", correct: false}
      - {text: "`static_cast<double>(note)`", correct: false}
      - {text: "`static_cast<round>(note)`", correct: false}
    answer: "`std::round` arrondit au plus proche (16.0), puis le cast convertit en `int`. Sans `std::round`, le cast tronque : 15."
  - key: trous-mot-cle
    format: fill-in
    question: |-
      Complète pour obtenir une division à virgule :
      ```cpp
      int a = 7;
      int b = 2;
      double quotient = ___<double>(a) / b;
      ```
    blanks:
      - [static_cast]
    answer: "`static_cast<double>(a)` convertit `a` avant la division."
  - key: trous-type-vise
    format: fill-in
    question: |-
      Complète pour ne garder que la partie entière du prix :
      ```cpp
      double prix = 9.99;
      int euros = static_cast<___>(prix);
      ```
    blanks:
      - [int]
    answer: "`static_cast<int>(prix)` tronque : 9."
  - key: trous-chevrons
    format: fill-in
    question: |-
      Complète la syntaxe du cast :
      ```cpp
      double moyenne = static_cast___double___(somme) / nombre;
      ```
    blanks:
      - ["<"]
      - [">"]
    answer: "Le type visé s'écrit entre chevrons : `static_cast<double>(somme)`."
  - key: trous-code-caractere
    format: fill-in
    question: |-
      Complète pour afficher le code du caractère A, c'est-à-dire 65 :
      ```cpp
      std::println("{}", static_cast<int>(___));
      ```
    blanks:
      - ["'A'"]
    answer: "`static_cast<int>('A')` donne le code du caractère : 65."
  - key: code-cast-avant
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 7;
          int b = 2;
          std::println("{}", static_cast<double>(a) / b);
      }
      ```
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`3.0`", correct: false}
    answer: "`3.5` : `a` est converti en `double` avant la division, qui se fait donc à virgule."
    check:
      output: "3.5"
  - key: code-cast-apres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 7;
          int b = 2;
          std::println("{}", static_cast<double>(a / b) + 0.5);
      }
      ```
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`4.5`", correct: false}
    answer: "`3.5` : `a / b` est une division entière, qui vaut 3. Le cast en fait 3.0, trop tard pour retrouver la décimale ; puis on ajoute 0.5."
    check:
      output: "3.5"
  - key: code-cast-ne-modifie-pas
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          double prix = 9.99;
          int euros = static_cast<int>(prix);
          std::println("{} {}", euros, prix);
      }
      ```
    choices:
      - {text: "`9 9.99`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`10 9.99`", correct: false}
      - {text: "`10 10`", correct: false}
    answer: "`9 9.99` : le cast tronque à 9, sans arrondir, et ne touche pas à `prix`."
    check:
      output: "9 9.99"
  - key: code-cast-char
    format: code-output
    question: |-
      Le code du caractère `A` est 65.
      ```cpp
      #include <print>

      int main() {
          char lettre = static_cast<char>('A' + 2);
          std::println("{} {}", lettre, static_cast<int>(lettre));
      }
      ```
    choices:
      - {text: "`C 67`", correct: true}
      - {text: "`67 67`", correct: false}
      - {text: "`C C`", correct: false}
      - {text: "`A2 67`", correct: false}
    answer: "`C 67` : `'A' + 2` est l'entier 67. Converti en `char`, c'est le caractère `C` ; reconverti en `int`, c'est de nouveau 67."
    check:
      output: "C 67"
  - key: bug-cast-trop-tard
    format: bug-fix
    question: |-
      Ce programme affiche `2` au lieu de `2.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int buts = 5;
          int matchs = 2;
          double moyenne = static_cast<double>(buts / matchs);
          std::println("{}", moyenne);
      }
      ```
    choices:
      - {text: "Écrire `static_cast<double>(buts) / matchs`", correct: true}
      - {text: "Écrire `static_cast<int>(buts / matchs)`", correct: false}
      - {text: "Écrire `static_cast<double>(matchs / buts)`", correct: false}
      - {text: "Écrire `static_cast<double>((buts / matchs))`", correct: false}
    answer: |-
      ```cpp
      double moyenne = static_cast<double>(buts) / matchs;
      ```
      `buts / matchs` est calculé entre entiers, avant le cast. Il faut convertir un opérande, pas le résultat.
  - key: bug-cast-sans-effet
    format: bug-fix
    question: |-
      Ce programme affiche toujours `2` au lieu de `2.5`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int buts = 5;
          int matchs = 2;
          static_cast<double>(buts);
          std::println("{}", buts / matchs);
      }
      ```
    choices:
      - {text: "Le cast ne modifie pas `buts` : sa valeur convertie est jetée", correct: true}
      - {text: "Le cast doit porter sur `matchs`, jamais sur `buts`", correct: false}
      - {text: "Le cast n'agit qu'après un second appel sur la même variable", correct: false}
      - {text: "Le cast a converti `buts` en `double`, que `std::println` arrondit", correct: false}
    answer: |-
      ```cpp
      std::println("{}", static_cast<double>(buts) / matchs);
      ```
      Un cast produit une valeur, à utiliser sur place. Écrit seul sur une ligne, il ne change rien : `buts` reste un
      `int`.
  - key: bug-cast-texte
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          int annee = static_cast<int>("1983");
          std::println("{}", annee + 1);
      }
      ```
    choices:
      - {text: "Écrire `std::stoi(\"1983\")`", correct: true}
      - {text: "Écrire `static_cast<double>(\"1983\")`", correct: false}
      - {text: "Écrire `static_cast<int>('1983')`", correct: false}
      - {text: "Écrire `static_cast<char>(\"1983\")`", correct: false}
    answer: |-
      ```cpp
      int annee = std::stoi("1983");
      ```
      Un cast ne lit pas le contenu d'un texte. `std::stoi`, dans `<string>`, analyse la chaîne et renvoie l'entier.
  - key: bug-note-arrondie
    format: bug-fix
    question: |-
      Ce programme affiche `15` au lieu de `16`, la note arrondie. Quelle correction est la bonne ?
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          double note = 15.8;
          int arrondie = static_cast<int>(note);
          std::println("{}", arrondie);
      }
      ```
    choices:
      - {text: "Écrire `static_cast<int>(std::round(note))`", correct: true}
      - {text: "Écrire `static_cast<double>(note)`", correct: false}
      - {text: "Écrire `static_cast<int>(note / 1)`", correct: false}
      - {text: "Écrire `static_cast<int>(note) + 0.5`", correct: false}
    answer: |-
      ```cpp
      int arrondie = static_cast<int>(std::round(note));
      ```
      Vers un entier, le cast coupe la partie décimale. `std::round`, dans `<cmath>`, arrondit d'abord au plus proche.
