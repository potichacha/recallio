notion: declaration-variables
lesson: |-
  Une **variable** a un **type**, un **nom** et une **valeur**. En C++, le type s'écrit avant le nom, et il ne change
  plus :

  ```cpp
  int age = 43;      // initialisation avec =
  int annee(1983);   // avec des parenthèses
  int mois{10};      // avec des accolades (C++11)
  ```

  Les trois écritures créent un `int` et lui donnent sa première valeur : c'est l'**initialisation**. Changer la valeur
  ensuite est une **affectation** : `age = 44;`, sans répéter le type.

  - Une variable se **déclare avant** d'être utilisée.
  - Un nom est fait de lettres, de chiffres et de `_`, ne commence pas par un chiffre, et distingue les majuscules :
    `total` et `Total` sont deux variables.
  - Dans un même bloc, un nom ne se déclare qu'**une fois**.
  - On peut déclarer plusieurs variables d'un même type sur une ligne : `int largeur = 3, hauteur = 4;`. Une
    déclaration par ligne se lit mieux.
  - Une affectation **copie** la valeur : après `int b = a;`, modifier `a` ne change pas `b`.

  **Piège classique** : `int compteur();` ne crée pas une variable initialisée à zéro. Le compilateur y lit la
  déclaration d'une **fonction** nommée `compteur`, qui renvoie un `int`. Pour une variable à zéro : `int compteur{};`
  ou `int compteur = 0;`.

  **En entretien** : « C++ est typé statiquement : le type d'une variable est fixé à sa déclaration, et vérifié à la
  compilation. J'initialise toujours une variable là où je la déclare. »
tour:
  - title: Les variables
    text: |-
      Une variable se déclare avec son type, puis son nom. Le type est fixé une fois pour toutes : un `int` reste un
      `int`.

      Tu peux lui donner sa première valeur avec `=`, avec des parenthèses ou avec des accolades. Ensuite, `=` la
      remplace, sans répéter le type.

      Essaie : ajoute la ligne `age = "vieux";` avant le dernier affichage, puis exécute. Le compilateur refuse de
      ranger un texte dans un `int`.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int age = 43;
              int annee(1983);
              int mois{10};
              std::println("{} ans, depuis {}/{}", age, mois, annee);

              age = age + 1;
              std::println("L'an prochain : {} ans", age);
          }
      output: |-
        43 ans, depuis 10/1983
        L'an prochain : 44 ans
    task:
      instructions: |-
        Déclare une variable `hauteur` qui vaut 4, puis fais afficher `Aire : 12` en calculant `largeur * hauteur`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int largeur = 3;
              std::println("Aire : {}", largeur);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int largeur = 3;
              int hauteur = 4;
              std::println("Aire : {}", largeur * hauteur);
          }
      output: "Aire : 12"
cards:
  - key: trois-ecritures
    format: course
    question: Quelles sont les trois écritures qui initialisent un `int` à 5 ?
    choices:
      - {text: "`int x = 5;`, `int x(5);` et `int x{5};`", correct: true}
      - {text: "`int x = 5;`, `int x[5];` et `int x{5};`", correct: false}
      - {text: "`int x = 5;`, `int x(5);` et `int x<5>;`", correct: false}
      - {text: "`int x := 5;`, `int x(5);` et `int x{5};`", correct: false}
    answer: |-
      Avec `=`, avec des parenthèses ou avec des accolades. `int x[5];` déclare un tableau de cinq entiers, et `:=`
      n'existe pas en C++.
  - key: initialisation-ou-affectation
    format: course
    question: Quelle différence entre une initialisation et une affectation ?
    choices:
      - {text: "L'initialisation donne sa première valeur à la variable, l'affectation la remplace ensuite", correct: true}
      - {text: "L'initialisation se fait à la compilation, l'affectation pendant l'exécution", correct: false}
      - {text: "L'initialisation vaut pour les nombres, l'affectation pour les textes", correct: false}
      - {text: "Aucune : ce sont deux mots pour la même opération", correct: false}
    answer: |-
      `int age = 43;` est une initialisation : la variable naît avec sa valeur. `age = 44;` est une affectation : elle
      remplace la valeur d'une variable qui existe déjà. La différence compte pour les constantes et les références, qui
      ne s'affectent pas.
  - key: typage-statique
    format: course
    question: Peut-on changer le type d'une variable après sa déclaration ?
    choices:
      - {text: "Non : le type est fixé à la déclaration, et vérifié à la compilation", correct: true}
      - {text: "Oui : le type suit la dernière valeur qu'on lui affecte", correct: false}
      - {text: "Oui, mais seulement d'un type entier vers un type à virgule", correct: false}
      - {text: "Oui, en la déclarant une seconde fois dans le même bloc", correct: false}
    answer: |-
      C++ est **typé statiquement** : une variable garde le type de sa déclaration. Lui affecter une valeur d'un autre
      type la convertit, si c'est possible, ou ne compile pas.
  - key: declaration-avec-parentheses-vides
    format: course
    question: "Que déclare `int compteur();` ?"
    choices:
      - {text: "Une fonction `compteur`, sans paramètre, qui renvoie un `int`", correct: true}
      - {text: "Une variable `compteur` de type `int`, initialisée à zéro", correct: false}
      - {text: "Une variable `compteur` de type `int`, sans valeur définie", correct: false}
      - {text: "Un tableau `compteur` d'entiers, vide pour l'instant", correct: false}
    answer: |-
      Une **fonction**. Des parenthèses vides après un nom déclarent une fonction sans paramètre. Pour une variable à
      zéro, on écrit `int compteur{};` ou `int compteur = 0;`.
  - key: vf-declarer-avant
    format: true-false
    question: Une variable doit être déclarée avant la ligne qui l'utilise.
    truth: true
    answer: Le compilateur lit le fichier de haut en bas. Un nom utilisé avant sa déclaration lui est inconnu.
  - key: vf-majuscules
    format: true-false
    question: "`total` et `Total` désignent la même variable."
    truth: false
    answer: C++ distingue les majuscules des minuscules. Ce sont deux noms différents.
  - key: vf-nom-chiffre
    format: true-false
    question: Le nom d'une variable peut commencer par un chiffre.
    truth: false
    answer: "Un nom commence par une lettre ou par `_`. `note2` est permis, `2notes` ne l'est pas."
  - key: vf-copie
    format: true-false
    question: "Après `int b = a;`, modifier `a` modifie aussi `b`."
    truth: false
    answer: "`b` reçoit une copie de la valeur de `a`. Les deux variables vivent ensuite chacune de son côté."
  - key: qcm-nom-valide
    format: multiple-choice
    question: Lequel de ces noms de variable est valide ?
    choices:
      - {text: "`prix_total`", correct: true}
      - {text: "`prix-total`", correct: false}
      - {text: "`2prix`", correct: false}
      - {text: "`int`", correct: false}
    answer: |-
      `prix_total`. Le tiret est l'opérateur de soustraction, un nom ne commence pas par un chiffre, et `int` est un
      mot-clé réservé.
  - key: qcm-variable-a-zero
    format: multiple-choice
    question: Quelle ligne déclare une variable `int` qui vaut zéro ?
    choices:
      - {text: "`int compteur{};`", correct: true}
      - {text: "`int compteur();`", correct: false}
      - {text: "`int compteur;` dans une fonction", correct: false}
      - {text: "`compteur = 0;` sans rien avant", correct: false}
    answer: |-
      `int compteur{};` : des accolades vides donnent zéro. `int compteur();` déclare une fonction, `int compteur;` dans
      une fonction laisse une valeur indéterminée, et une affectation ne déclare rien.
  - key: qcm-redeclaration
    format: multiple-choice
    question: "Un bloc contient `int total = 1;`. Tu veux que `total` vaille 2. Qu'écris-tu ensuite ?"
    choices:
      - {text: "`total = 2;`", correct: true}
      - {text: "`int total = 2;`", correct: false}
      - {text: "`total == 2;`", correct: false}
      - {text: "`int total(2);`", correct: false}
    answer: |-
      `total = 2;` : une affectation, sans le type. Répéter `int` déclarerait une seconde variable du même nom dans le
      même bloc, ce que le compilateur refuse. `==` compare, il ne modifie rien.
  - key: qcm-plusieurs-variables
    format: multiple-choice
    question: "Que déclare `int largeur = 3, hauteur = 4;` ?"
    choices:
      - {text: "Deux variables `int`, qui valent 3 et 4", correct: true}
      - {text: "Une variable `int` qui contient deux valeurs", correct: false}
      - {text: "Une variable `int` et une variable sans type", correct: false}
      - {text: "Rien : la virgule est une erreur de syntaxe", correct: false}
    answer: |-
      Deux variables du même type. La virgule sépare les déclarations ; le type écrit en tête vaut pour les deux.
  - key: trous-type-entier
    format: fill-in
    question: |-
      Complète pour déclarer un entier :
      ```cpp
      ___ age = 43;
      std::println("{} ans", age);
      ```
    blanks:
      - [int, auto, long, short, unsigned]
    answer: "`int` est le type entier courant."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour initialiser `mois` à 10 avec des accolades :
      ```cpp
      int mois___;
      ```
    blanks:
      - ["{10}"]
    answer: "`int mois{10};` : la valeur s'écrit entre les accolades, sans `=`."
  - key: trous-virgule
    format: fill-in
    question: |-
      Complète pour déclarer deux variables sur la même ligne :
      ```cpp
      int largeur = 3___ hauteur = 4;
      ```
    blanks:
      - [","]
    answer: Une virgule sépare les variables d'une même déclaration.
  - key: trous-affectation
    format: fill-in
    question: |-
      Complète pour ajouter 5 à la variable `total` :
      ```cpp
      int total = 10;
      ___ = total + 5;
      ```
    blanks:
      - [total]
    answer: "`total = total + 5;` calcule la somme, puis la range dans `total`. On ne répète pas le type."
  - key: code-trois-ecritures
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b(2);
          int c{3};
          std::println("{} {} {}", a, b, c);
      }
      ```
    choices:
      - {text: "`1 2 3`", correct: true}
      - {text: "`1 0 0`", correct: false}
      - {text: "`1 2 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 2 3` : les trois écritures initialisent un `int`."
    check:
      output: "1 2 3"
  - key: code-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          x = x + 2;
          x = x * 2;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`14`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "`9`", correct: false}
    answer: "`14` : `x` vaut 5, puis 7, puis 14. Chaque affectation part de la valeur courante."
    check:
      output: "14"
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = a;
          a = 10;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`10 1`", correct: true}
      - {text: "`10 10`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`1 10`", correct: false}
    answer: "`10 1` : `b` a reçu une copie de la valeur de `a`. Modifier `a` ensuite ne la touche pas."
    check:
      output: "10 1"
  - key: code-echange-rate
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1, b = 2;
          a = b;
          b = a;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`2 1`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: |-
      `2 2` : après `a = b;`, l'ancienne valeur de `a` est perdue, et `b = a;` recopie 2. Pour échanger deux
      variables, il faut une troisième variable, ou `std::swap`.
    check:
      output: "2 2"
  - key: bug-utilisee-avant
    format: bug-fix
    question: |-
      Le compilateur répond « 'prix' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          std::println("{}", prix);
          int prix = 20;
      }
      ```
    choices:
      - {text: "Déclarer `prix` avant la ligne qui l'affiche", correct: true}
      - {text: "Écrire `std::prix` dans l'affichage", correct: false}
      - {text: "Remplacer `int` par `double`", correct: false}
      - {text: "Ajouter `#include <prix>`", correct: false}
    answer: |-
      ```cpp
      int prix = 20;
      std::println("{}", prix);
      ```
      Une variable n'existe qu'à partir de sa déclaration.
  - key: bug-fonction-au-lieu-de-variable
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int compteur();
          compteur = compteur + 1;
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "`int compteur();` déclare une fonction, pas une variable", correct: true}
      - {text: "Une variable ne peut pas apparaître des deux côtés du `=`", correct: false}
      - {text: "`compteur` est un mot-clé réservé du langage", correct: false}
      - {text: "`std::println` ne sait pas afficher un `int` seul", correct: false}
    answer: |-
      ```cpp
      int compteur{};
      ```
      Des parenthèses vides déclarent une fonction sans paramètre. Des accolades vides déclarent une variable qui
      vaut zéro.
  - key: bug-redeclaration
    format: bug-fix
    question: |-
      Le compilateur répond « redeclaration of 'int total' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 10;
          int total = total + 5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Retirer `int` de la deuxième ligne", correct: true}
      - {text: "Retirer `int` de la première ligne", correct: false}
      - {text: "Remplacer le deuxième `=` par `==`", correct: false}
      - {text: "Écrire les deux déclarations sur une ligne", correct: false}
    answer: |-
      ```cpp
      int total = 10;
      total = total + 5;
      ```
      Le type ne s'écrit qu'à la déclaration. Le répéter déclare une seconde variable du même nom, dans le même bloc.
  - key: bug-texte-dans-int
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int age = "43";
          std::println("{}", age + 1);
      }
      ```
    choices:
      - {text: "Écrire `43` sans guillemets", correct: true}
      - {text: "Écrire `'43'` entre apostrophes", correct: false}
      - {text: "Écrire `{\"43\"}` entre accolades", correct: false}
      - {text: "Retirer le `+ 1` de l'affichage", correct: false}
    answer: |-
      ```cpp
      int age = 43;
      ```
      `"43"` est un texte, pas un nombre : C++ ne convertit pas l'un en l'autre de lui-même.
