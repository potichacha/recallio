    question: |-
      Complète pour arrêter la boucle dès que `i` vaut 3 :
      ```cpp
      for (int i = 0; i < 10; ++i) {
          if (i == 3) {
              ___;
          }
          std::println("{}", i);
      }
      ```
    blanks:
      - [break]
    answer: "`break;` sort de la boucle : elle affiche 0, 1 et 2."
  - key: trous-continue
    format: fill-in
    question: |-
      Complète pour ne pas afficher les nombres pairs :
      ```cpp
      for (int i = 0; i < 10; ++i) {
          if (i % 2 == 0) {
              ___;
          }
          std::println("{}", i);
      }
      ```
    blanks:
      - [continue]
    answer: "`continue;` passe au tour suivant, sans exécuter l'affichage."
  - key: trous-while-true
    format: fill-in
    question: |-
      Complète pour écrire une boucle sans fin, dont on sort par `break` :
      ```cpp
      while (___) {
          ++n;
          if (n % 7 == 0) {
              break;
          }
      }
      ```
    blanks:
      - ["true", "1"]
    answer: "`while (true)` boucle jusqu'au `break`."
  - key: trous-drapeau
    format: fill-in
    question: |-
      Complète pour que la boucle extérieure s'arrête aussi quand `trouve` est vrai :
      ```cpp
      for (int i = 0; i < 3; ++i) {
          for (int j = 0; j < 3; ++j) {
              if (i * j == 2) {
                  trouve = true;
                  break;
              }
          }
          if (trouve) {
              ___;
          }
      }
      ```
    blanks:
      - [break]
    answer: "Le premier `break` ne sort que de la boucle intérieure. Le booléen transmet l'information à la boucle extérieure, qui fait son propre `break`."
  - key: code-break
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 10; ++i) {
              if (i == 3) {
                  break;
              }
              std::print("{}", i);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`012`", correct: true}
      - {text: "`0123`", correct: false}
      - {text: "`012456789`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`012` : quand `i` vaut 3, `break` sort de la boucle avant l'affichage. Les tours suivants n'ont pas lieu."
    check:
      output: "012"
  - key: code-continue
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 6; ++i) {
              if (i % 2 == 0) {
                  continue;
              }
              std::print("{}", i);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`135`", correct: true}
      - {text: "`024`", correct: false}
      - {text: "`012345`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`135` : pour un `i` pair, `continue` saute l'affichage et passe au tour suivant. La boucle, elle, va jusqu'au bout."
    check:
      output: "135"
  - key: code-imbriquees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int tours = 0;
          for (int i = 0; i < 3; ++i) {
              for (int j = 0; j < 3; ++j) {
                  if (j == 1) {
                      break;
                  }
                  ++tours;
              }
          }
          std::println("{}", tours);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`3` : `break` ne sort que de la boucle intérieure, après un seul tour compté. La boucle extérieure la relance trois fois."
    check:
      output: "3"
  - key: code-while-true
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 50;
          while (true) {
              ++n;
              if (n % 7 == 0) {
                  break;
              }
          }
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`56`", correct: true}
      - {text: "`49`", correct: false}
      - {text: "`57`", correct: false}
      - {text: "`51`", correct: false}
    answer: "`56` : la boucle incrémente `n` jusqu'au premier multiple de 7 après 50, puis `break` l'arrête."
    check:
      output: "56"
  - key: bug-continue-dans-while
    format: bug-fix
    question: |-
      Ce programme devrait afficher 1, 2, 4, 5, en sautant 3. Il affiche 1 et 2, puis ne se termine pas. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int i = 1;
          while (i <= 5) {
              if (i == 3) {
                  continue;
              }
              std::println("{}", i);
              ++i;
          }
      }
      ```
    choices:
      - {text: "Incrémenter `i` avant le `continue`", correct: true}
      - {text: "Remplacer `continue` par un point-virgule seul", correct: false}
      - {text: "Remplacer `i <= 5` par `i < 5`", correct: false}
      - {text: "Déclarer `i` à l'intérieur de la boucle", correct: false}
    answer: |-
      ```cpp
      if (i == 3) {
          ++i;
          continue;
      }
      ```
      Le `continue` retourne à la condition sans passer par `++i` : `i` reste à 3 pour toujours. Un `for`, dont le pas
      s'exécute même après `continue`, éviterait le piège.
  - key: bug-break-interieur
    format: bug-fix
    question: |-
      Ce programme devrait s'arrêter au premier couple dont le produit vaut 2, et continue de chercher. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 1; i <= 3; ++i) {
              for (int j = 1; j <= 3; ++j) {
                  if (i * j == 2) {
                      std::println("{} x {}", i, j);
                      break;
                  }
              }
          }
      }
      ```
    choices:
      - {text: "`break` ne sort que de la boucle intérieure", correct: true}
      - {text: "`break` ne s'applique pas à l'intérieur d'un `if`", correct: false}
      - {text: "`break` relance la boucle intérieure depuis `j = 1`", correct: false}
      - {text: "`break` doit être écrit avant l'affichage", correct: false}
    answer: |-
      ```cpp
      bool trouve = false;
      for (int i = 1; i <= 3 && !trouve; ++i) {
          for (int j = 1; j <= 3; ++j) {
              if (i * j == 2) {
                  std::println("{} x {}", i, j);
                  trouve = true;
                  break;
              }
          }
      }
      ```
      La boucle extérieure passe à `i = 2`, et trouve un second couple. Un booléen l'arrête ; mettre les boucles dans
      une fonction et faire `return` serait plus lisible encore.
  - key: bug-break-pour-continue
    format: bug-fix
    question: |-
      Ce programme devrait additionner les valeurs positives, soit 7, et affiche `3`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> valeurs{3, -1, 4};
          int somme = 0;
          for (int valeur : valeurs) {
              if (valeur < 0) {
                  break;
              }
              somme += valeur;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Remplacer `break` par `continue`", correct: true}
      - {text: "Remplacer `break` par `return 0`", correct: false}
      - {text: "Remplacer `valeur < 0` par `valeur > 0`", correct: false}
      - {text: "Déplacer `somme += valeur;` après la boucle", correct: false}
    answer: |-
      ```cpp
      if (valeur < 0) {
          continue;
      }
      ```
      `break` arrête la boucle à la première valeur négative : le 4 n'est jamais lu. `continue` saute seulement cette
      valeur.
  - key: bug-break-dans-switch
    format: bug-fix
    question: |-
      Cette boucle devrait s'arrêter à la commande `q`, et lit pourtant toutes les commandes : elle affiche `2`.
      Pourquoi ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string commandes = "aqa";
          int actions = 0;
          for (char commande : commandes) {
              switch (commande) {
                  case 'q':
                      break;
                  default:
                      ++actions;
                      break;
              }
          }
          std::println("{}", actions);
      }
      ```
    choices:
      - {text: "Le `break` du `case 'q'` sort du `switch`, pas de la boucle", correct: true}
      - {text: "Un `switch` ne peut pas porter sur un caractère", correct: false}
      - {text: "Le `default` s'exécute avant le `case 'q'`", correct: false}
      - {text: "Une boucle sur un intervalle ignore `break`", correct: false}
    answer: |-
      ```cpp
      if (commande == 'q') {
          break;
      }
      ++actions;
      ```
      Dans un `switch`, `break` termine le `case`. Pour sortir de la boucle, on teste la commande avec un `if`, hors
      du `switch`.
