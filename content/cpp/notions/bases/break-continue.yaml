notion: break-continue
lesson: |-
  Deux mots-clés changent le cours d'une boucle.

  - **`break`** **sort** de la boucle : l'exécution reprend après elle.
  - **`continue`** **passe au tour suivant** : le reste du bloc est sauté pour ce tour.

  ```cpp
  for (int i = 0; i < 10; ++i) {
      if (i % 2 == 0) {
          continue;      // saute les nombres pairs
      }
      if (i > 6) {
          break;         // s'arrête après 5
      }
      std::print("{}", i);   // affiche 135
  }
  ```

  **Ce que fait `continue` selon la boucle.** Dans un `for`, le **pas** (`++i`) s'exécute quand même, puis la
  condition est testée. Dans un `while`, on retourne directement à la condition : si l'incrémentation est écrite
  après le `continue`, elle est sautée, et la boucle ne s'arrête plus.

  **Les boucles imbriquées.** `break` et `continue` n'agissent que sur la boucle **la plus proche**. Un `break` dans
  la boucle intérieure ne sort pas de la boucle extérieure. Pour sortir des deux :

  - mettre les boucles dans une fonction, et en sortir par `return` (le plus lisible) ;
  - ou un booléen, testé par la boucle extérieure.

  C++ n'a pas de `break` étiqueté, comme celui de Java.

  **Dans un `switch`**, `break` sort du `switch`, pas de la boucle qui le contient.

  **Bien s'en servir.** `break` exprime « j'ai trouvé, inutile de continuer ». `continue` écarte d'emblée les cas
  sans intérêt, au lieu d'imbriquer tout le bloc dans un `if`.

  **En entretien** : « `break` et `continue` ne concernent que la boucle la plus proche. Pour sortir de deux boucles,
  j'extrais une fonction et je fais `return`. »
tour:
  - title: break et continue
    text: |-
      `break` sort de la boucle tout de suite. `continue` abandonne le tour en cours et passe au suivant.

      Ici, la boucle cherche le premier multiple de 7 après 50 : dès qu'elle l'a trouvé, `break` l'arrête. La seconde
      boucle additionne les nombres de 1 à 10 en sautant les multiples de 3.

      Dans des boucles imbriquées, `break` ne sort que de la plus proche.

      Essaie : remplace `continue` par `break` dans la seconde boucle, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int n = 51;
              while (true) {
                  if (n % 7 == 0) {
                      break;
                  }
                  ++n;
              }
              std::println("premier multiple de 7 : {}", n);

              int somme = 0;
              for (int i = 1; i <= 10; ++i) {
                  if (i % 3 == 0) {
                      continue;
                  }
                  somme += i;
              }
              std::println("somme sans les multiples de 3 : {}", somme);
          }
      output: |-
        premier multiple de 7 : 56
        somme sans les multiples de 3 : 37
cards:
  - key: role-de-break
    format: course
    question: Que fait `break` dans une boucle ?
    choices:
      - {text: "Il sort de la boucle : l'exécution reprend après elle", correct: true}
      - {text: "Il passe au tour suivant de la boucle", correct: false}
      - {text: "Il arrête le programme tout entier", correct: false}
      - {text: "Il relance la boucle depuis son premier tour", correct: false}
    answer: "`break` quitte la boucle immédiatement. Le reste du bloc et les tours suivants sont abandonnés."
  - key: role-de-continue
    format: course
    question: Que fait `continue` dans une boucle ?
    choices:
      - {text: "Il saute le reste du bloc et passe au tour suivant", correct: true}
      - {text: "Il sort de la boucle et continue après elle", correct: false}
      - {text: "Il reprend le tour en cours depuis le début du bloc", correct: false}
      - {text: "Il ne fait rien : la boucle continue de toute façon", correct: false}
    answer: "`continue` abandonne le tour en cours, pas la boucle. Malgré son nom, c'est `break` qui fait continuer le programme après la boucle."
  - key: continue-dans-for
    format: course
    question: "Dans `for (int i = 0; i < 5; ++i)`, que se passe-t-il juste après un `continue` ?"
    choices:
      - {text: "`++i` s'exécute, puis la condition est testée", correct: true}
      - {text: "La condition est testée, sans que `++i` s'exécute", correct: false}
      - {text: "`i` est remise à zéro, puis la condition est testée", correct: false}
      - {text: "Le bloc reprend à sa première ligne, avec le même `i`", correct: false}
    answer: "Dans un `for`, le pas fait partie de la boucle, pas du bloc : `continue` ne le saute pas. Dans un `while`, une incrémentation écrite après le `continue` serait, elle, sautée."
  - key: boucles-imbriquees
    format: course
    question: "Dans deux boucles imbriquées, de quoi sort un `break` placé dans la boucle intérieure ?"
    choices:
      - {text: "De la boucle intérieure seulement", correct: true}
      - {text: "Des deux boucles à la fois", correct: false}
      - {text: "De la boucle extérieure seulement", correct: false}
      - {text: "De la fonction qui contient les boucles", correct: false}
    answer: "`break` n'agit que sur la boucle la plus proche. La boucle extérieure passe à son tour suivant, et relance la boucle intérieure."
  - key: vf-break-etiquete
    format: true-false
    question: C++ permet de donner une étiquette à une boucle pour en sortir avec `break etiquette;`.
    truth: false
    answer: Le `break` étiqueté existe en Java, pas en C++. On sort de plusieurs boucles avec `return`, ou avec un booléen.
  - key: vf-continue-sort
    format: true-false
    question: "`continue` fait sortir de la boucle."
    truth: false
    answer: Il fait passer au tour suivant. C'est `break` qui sort de la boucle.
  - key: vf-break-switch
    format: true-false
    question: "Dans un `switch` placé dans une boucle, `break` sort de la boucle."
    truth: false
    answer: Il ne sort que du `switch`. La boucle continue.
  - key: vf-continue-while
    format: true-false
    question: "Dans un `while`, un `continue` placé avant l'incrémentation du compteur peut créer une boucle infinie."
    truth: true
    answer: Le `continue` retourne à la condition sans exécuter l'incrémentation. Le compteur ne change plus.
  - key: qcm-sortir-de-deux-boucles
    format: multiple-choice
    question: Quelle est la façon la plus lisible de sortir de deux boucles imbriquées ?
    choices:
      - {text: "Les mettre dans une fonction, et en sortir par `return`", correct: true}
      - {text: "Écrire `break; break;` dans la boucle intérieure", correct: false}
      - {text: "Écrire `break 2;` dans la boucle intérieure", correct: false}
      - {text: "Écrire `continue;` dans la boucle extérieure", correct: false}
    answer: "`return` quitte la fonction, donc toutes ses boucles. Le second `break` de `break; break;` n'est jamais atteint, et `break 2;` n'existe pas en C++."
  - key: qcm-recherche
    format: multiple-choice
    question: Tu cherches le premier élément négatif d'un tableau. Que fais-tu dès que tu l'as trouvé ?
    choices:
      - {text: "`break` : inutile de parcourir le reste", correct: true}
      - {text: "`continue` : pour passer à l'élément suivant", correct: false}
      - {text: "Rien : la boucle doit aller jusqu'au bout", correct: false}
      - {text: "`default` : pour traiter les autres éléments", correct: false}
    answer: "Une recherche s'arrête à la première réponse : `break`. Continuer ferait perdre du temps, et trouverait le dernier négatif au lieu du premier."
  - key: qcm-filtrer
    format: multiple-choice
    question: Dans une boucle, tu veux ignorer les valeurs nulles et traiter toutes les autres. Quel mot-clé écarte les nulles ?
    choices:
      - {text: "`continue`", correct: true}
      - {text: "`break`", correct: false}
      - {text: "`return`", correct: false}
      - {text: "`else`", correct: false}
    answer: "`if (valeur == 0) { continue; }` passe à la valeur suivante. `break` arrêterait tout à la première valeur nulle."
  - key: qcm-hors-boucle
    format: multiple-choice
    question: "Que se passe-t-il si `continue` est écrit hors de toute boucle ?"
    choices:
      - {text: "Le code ne compile pas", correct: true}
      - {text: "Il est ignoré à l'exécution", correct: false}
      - {text: "Il relance la fonction `main`", correct: false}
      - {text: "Il arrête le programme", correct: false}
    answer: "`continue` n'a de sens que dans une boucle : ailleurs, c'est une erreur de compilation. `break` est permis aussi dans un `switch`."
  - key: trous-break
