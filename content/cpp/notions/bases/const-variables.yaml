notion: const-variables
lesson: |-
  **`const`** déclare une variable qu'on **ne modifie plus** après son initialisation :

  ```cpp
  const int jours_par_semaine = 7;
  jours_par_semaine = 8;   // erreur de compilation
  ```

  - Une constante **doit être initialisée** à sa déclaration : `const int n;` ne compile pas, puisqu'on ne pourrait
    plus lui donner de valeur.
  - Toute tentative de modification (`=`, `++`, `+=`) est une **erreur de compilation**.
  - Sa valeur peut n'être connue qu'**à l'exécution** : `const int age = lire_age();` est permis. `const` promet que
    la variable ne changera plus, pas que sa valeur est connue du compilateur ; pour cela, il y a `constexpr`.
  - `const int` et `int const` veulent dire la même chose.
  - Copier une constante dans une variable ordinaire est permis : la copie, elle, se modifie.

  **Pourquoi s'en servir.**

  - **Le compilateur protège la valeur** : une modification par erreur ne compile pas.
  - **Le lecteur sait** que la valeur ne bougera pas : il n'a pas à suivre la variable dans tout le bloc.
  - **Un nom remplace un nombre magique** : `prix * taux_tva` se lit mieux que `prix * 0.2`.

  La bonne habitude est de mettre `const` **par défaut**, et de ne l'enlever que pour les variables qui doivent
  vraiment changer.

  **En entretien** : « Je déclare `const` tout ce qui ne change pas : c'est une vérification gratuite du compilateur,
  et une documentation pour le lecteur. »
tour:
  - title: "const : une variable qu'on ne modifie plus"
    text: |-
      Le mot-clé `const` fait d'une variable une constante : elle reçoit sa valeur à la déclaration, et le compilateur
      refuse toute modification ensuite.

      Donner un nom à une valeur fixe rend le calcul lisible, et évite de la changer par erreur.

      Essaie : ajoute la ligne `taux_tva = 10;` avant l'affichage, puis exécute. Le compilateur refuse.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              const int taux_tva = 20;
              int prix = 150;

              int ttc = prix + prix * taux_tva / 100;
              std::println("{} euros TTC", ttc);
          }
      output: "180 euros TTC"
    task:
      instructions: |-
        Remplace le nombre `7` du calcul par une constante `jours_par_semaine`. Le programme doit toujours afficher
        `3 semaines font 21 jours`, mais sans `7` ni `21` écrits dans l'affichage.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int semaines = 3;
              std::println("{} semaines font {} jours", semaines, 7);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              const int jours_par_semaine = 7;
              int semaines = 3;
              std::println("{} semaines font {} jours", semaines, semaines * jours_par_semaine);
          }
      output: "3 semaines font 21 jours"
cards:
  - key: role-de-const
    format: course
    question: "Que garantit `const` devant la déclaration d'une variable ?"
    choices:
      - {text: "Qu'on ne modifiera plus la variable après son initialisation", correct: true}
      - {text: "Que la valeur de la variable est connue à la compilation", correct: false}
      - {text: "Que la variable est partagée par tous les fichiers du projet", correct: false}
      - {text: "Que la variable n'occupe aucune place en mémoire", correct: false}
    answer: |-
      `const` interdit de modifier la variable : toute tentative est une erreur de compilation. Sa valeur peut très
      bien n'être calculée qu'à l'exécution ; c'est `constexpr` qui exige une valeur connue du compilateur.
  - key: const-initialisee
    format: course
    question: "Pourquoi `const int limite;` ne compile-t-il pas ?"
    choices:
      - {text: "Une constante doit recevoir sa valeur à la déclaration", correct: true}
      - {text: "Une constante ne peut pas être de type `int`", correct: false}
      - {text: "Une constante se déclare hors de toute fonction", correct: false}
      - {text: "Une constante s'écrit toujours en majuscules", correct: false}
    answer: "Comme on ne peut plus l'affecter ensuite, une constante sans valeur de départ serait inutilisable : le compilateur la refuse."
  - key: pourquoi-const
    format: course
    question: Quel est l'intérêt de déclarer `const` une variable qui ne change pas ?
    choices:
      - {text: "Le compilateur refuse toute modification faite par erreur", correct: true}
      - {text: "Le programme lit une constante plus vite qu'une variable", correct: false}
      - {text: "La constante est visible depuis les autres fonctions", correct: false}
      - {text: "La constante est conservée d'une exécution à la suivante", correct: false}
    answer: |-
      Une modification accidentelle devient une erreur de compilation, et le lecteur sait d'emblée que la valeur ne
      bouge pas. Ce n'est pas une question de vitesse.
  - key: const-valeur-execution
    format: course
    question: "Une variable `const` peut-elle recevoir une valeur calculée à l'exécution ?"
    choices:
      - {text: "Oui : `const` interdit de la modifier ensuite, rien de plus", correct: true}
      - {text: "Non : sa valeur doit être un littéral écrit dans le code", correct: false}
      - {text: "Non : sa valeur doit être connue avant la compilation", correct: false}
      - {text: "Oui, mais seulement si la variable est globale", correct: false}
    answer: "`const int age = lire_age();` est permis : la valeur est fixée à l'initialisation, à l'exécution, et ne change plus ensuite."
  - key: vf-const-modifiable
    format: true-false
    question: Affecter une nouvelle valeur à une variable `const` est une erreur de compilation.
    truth: true
    answer: Le compilateur refuse toute modification d'une constante, que ce soit avec `=`, `++` ou `+=`.
  - key: vf-const-ordre
    format: true-false
    question: "`const int n = 5;` et `int const n = 5;` déclarent la même chose."
    truth: true
    answer: Pour une variable simple, `const` peut s'écrire avant ou après le type.
  - key: vf-copie-de-const
    format: true-false
    question: "Après `const int a = 2; int b = a;`, on ne peut pas modifier `b`."
    truth: false
    answer: "`b` est une copie, déclarée sans `const` : elle se modifie librement, sans toucher `a`."
  - key: vf-const-sans-valeur
    format: true-false
    question: "Dans une fonction, `const double taux;` compile."
    truth: false
    answer: Une constante doit être initialisée à sa déclaration.
  - key: qcm-declarer-constante
    format: multiple-choice
    question: Quelle ligne déclare une constante entière qui vaut 7 ?
    choices:
      - {text: "`const int jours = 7;`", correct: true}
      - {text: "`int jours = const 7;`", correct: false}
      - {text: "`constant int jours = 7;`", correct: false}
      - {text: "`final int jours = 7;`", correct: false}
    answer: "`const` s'écrit devant (ou juste après) le type. `final` est le mot-clé de Java ; en C++, il sert à autre chose."
  - key: qcm-modification-refusee
    format: multiple-choice
    question: "Avec `const int jours = 7;`, laquelle de ces lignes compile ?"
    choices:
      - {text: "`int total = jours * 2;`", correct: true}
      - {text: "`jours = 8;`", correct: false}
      - {text: "`jours++;`", correct: false}
      - {text: "`jours += 1;`", correct: false}
    answer: "Lire une constante est toujours permis : `jours * 2` ne la modifie pas. Les trois autres lignes tentent de la changer."
  - key: qcm-nombre-magique
    format: multiple-choice
    question: "Qu'appelle-t-on un « nombre magique » dans `double ttc = prix * 1.2;` ?"
    choices:
      - {text: "`1.2`, une valeur écrite en dur, sans nom qui l'explique", correct: true}
      - {text: "`ttc`, une variable calculée à partir d'une autre", correct: false}
      - {text: "`prix`, une valeur que le programme ne connaît pas", correct: false}
      - {text: "`double`, un type dont la précision est limitée", correct: false}
    answer: |-
      Un nombre magique est un littéral dont le sens n'est pas dit. `const double coefficient_tva = 1.2;` lui donne un
      nom, et un seul endroit à changer.
  - key: qcm-const-par-defaut
    format: multiple-choice
    question: Quelle habitude recommande-t-on pour `const` ?
    choices:
      - {text: "Le mettre par défaut, et l'enlever si la variable doit changer", correct: true}
      - {text: "Le réserver aux variables globales du programme", correct: false}
      - {text: "Le réserver aux nombres, jamais aux textes", correct: false}
      - {text: "L'éviter : il ralentit la compilation", correct: false}
    answer: "Une variable est `const` sauf raison contraire : chaque `const` est une chose de moins à surveiller pour le lecteur comme pour le compilateur."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que `jours` ne puisse plus être modifiée :
      ```cpp
      ___ int jours = 7;
      ```
    blanks:
      - [const, constexpr]
    answer: "`const` interdit toute modification après l'initialisation."
  - key: trous-const-apres
    format: fill-in
    question: |-
      Complète avec le même mot-clé, écrit cette fois après le type :
      ```cpp
      double ___ pi = 3.14159;
      ```
    blanks:
      - [const]
    answer: "`double const pi` et `const double pi` déclarent la même constante."
  - key: trous-utiliser-constante
    format: fill-in
    question: |-
      Complète pour que le calcul utilise la constante :
      ```cpp
      const int jours_par_semaine = 7;
      int semaines = 3;
      int jours = semaines * ___;
      ```
    blanks:
      - [jours_par_semaine]
    answer: "La constante se lit comme n'importe quelle variable : `semaines * jours_par_semaine`."
  - key: trous-const-auto
    format: fill-in
    question: |-
      Complète pour déclarer une constante dont le type est déduit :
      ```cpp
      const ___ taux = 0.2;
      ```
    blanks:
      - [auto, double, float]
    answer: "`const auto taux = 0.2;` : `auto` déduit `double`, et `const` fige la valeur."
  - key: code-const-calcul
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int taux_tva = 20;
          int prix = 100;
          std::println("{}", prix + prix * taux_tva / 100);
      }
      ```
    choices:
      - {text: "`120`", correct: true}
      - {text: "`100`", correct: false}
      - {text: "`24`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`120` : une constante se lit comme une variable. `prix * taux_tva / 100` vaut 20, ajouté à 100."
    check:
      output: "120"
  - key: code-const-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int limite = 5;
          limite = 6;
          std::println("{}", limite);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `limite` est `const`, le compilateur refuse l'affectation (« assignment of read-only variable »)."
    check:
      compiles: false
  - key: code-copie-de-const
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int a = 2;
          int b = a;
          b = b + 1;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 3` : `b` est une copie ordinaire, qu'on peut modifier. La constante `a` garde sa valeur."
    check:
      output: "2 3"
  - key: code-const-valeur-figee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 3;
          const int double_de_n = n * 2;
          n = 10;
          std::println("{}", double_de_n);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `6` : la constante est calculée une fois, à son initialisation, quand `n` valait 3. Elle ne suit pas `n` ensuite.
      Et une constante peut être initialisée par une valeur connue seulement à l'exécution.
    check:
      output: "6"
  - key: bug-const-sans-valeur
    format: bug-fix
    question: |-
      Le compilateur répond « uninitialized 'const maximum' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int maximum;
          maximum = 100;
          std::println("{}", maximum);
      }
      ```
    choices:
      - {text: "Écrire `const int maximum = 100;` en une ligne", correct: true}
      - {text: "Écrire `maximum == 100;` sur la deuxième ligne", correct: false}
      - {text: "Déplacer `const int maximum;` hors de `main`", correct: false}
      - {text: "Écrire `const maximum = 100;` sans le type", correct: false}
    answer: |-
      ```cpp
      const int maximum = 100;
      ```
      Une constante reçoit sa valeur à la déclaration : on ne peut pas l'affecter après.
  - key: bug-taux-qui-change
    format: bug-fix
    question: |-
      Ce code ne compile pas. Le taux de remise doit vraiment passer de 10 à 20 pendant le programme. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int remise = 10;
          std::println("{}", remise);
          remise = 20;
          std::println("{}", remise);
      }
      ```
    choices:
      - {text: "Retirer `const` de la déclaration de `remise`", correct: true}
      - {text: "Écrire `const remise = 20;` sur la troisième ligne", correct: false}
      - {text: "Écrire `remise == 20;` sur la troisième ligne", correct: false}
      - {text: "Ajouter `const` devant `remise = 20;`", correct: false}
    answer: |-
      ```cpp
      int remise = 10;
      ```
      `const` dit que la variable ne change plus. Si elle doit changer, ce n'est pas une constante : on retire le
      mot-clé.
  - key: bug-increment-const
    format: bug-fix
    question: |-
      Le compilateur répond « increment of read-only variable 'essais' ». Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          const int essais = 0;
          essais++;
          std::println("{}", essais);
      }
      ```
    choices:
      - {text: "`essais` est `const` : `++` la modifierait", correct: true}
      - {text: "`++` ne s'applique qu'aux nombres à virgule", correct: false}
      - {text: "`essais` vaut zéro, qu'on ne peut pas incrémenter", correct: false}
      - {text: "`++` doit s'écrire avant le nom de la variable", correct: false}
    answer: |-
      ```cpp
      int essais = 0;
      ```
      `essais++` modifie la variable, ce que `const` interdit. Un compteur n'est pas une constante.
  - key: bug-faute-de-frappe
    format: bug-fix
    question: |-
      Ce programme affiche `100` au lieu de `20`, à cause d'une affectation écrite par erreur. Quelle déclaration
      aurait fait refuser cette erreur à la compilation ?
      ```cpp
      #include <print>

      int main() {
          int taux_tva = 20;
          int prix = 100;
          taux_tva = prix;
          std::println("{}", prix * taux_tva / 100);
      }
      ```
    choices:
      - {text: "`const int taux_tva = 20;`", correct: true}
      - {text: "`auto taux_tva = 20;`", correct: false}
      - {text: "`int taux_tva{20};`", correct: false}
      - {text: "`double taux_tva = 20;`", correct: false}
    answer: |-
      ```cpp
      const int taux_tva = 20;
      ```
      Avec `const`, la ligne `taux_tva = prix;` ne compile pas : l'erreur se voit tout de suite, au lieu de fausser le
      calcul.
