notion: cpp-presentation
lesson: |-
  **C++** est un langage **compilé** : le compilateur traduit le code source en **code machine**, propre à un
  processeur et à un système. Le programme s'exécute ensuite seul, sans machine virtuelle ni ramasse-miettes.

  - **Multi-paradigme** : on y écrit du code procédural (des fonctions), orienté objet (des classes), générique (des
    templates) ou fonctionnel (des lambdas), et on les mélange dans un même programme.
  - **Zéro coût d'abstraction** (*zero-overhead principle*) : on ne paie pas pour ce qu'on n'utilise pas, et ce qu'on
    utilise coûte autant que si on l'avait écrit à la main. Un `std::vector` bien utilisé vaut un tableau géré à la main.
  - **Contrôle de la mémoire** : c'est le programme qui décide où vit chaque objet et quand il est détruit. Les
    destructeurs libèrent les ressources à la sortie de la portée (c'est le RAII).
  - **Comportement indéfini** : certaines erreurs (lire hors d'un tableau, déborder un entier signé) ne sont ni
    détectées ni signalées. Le langage ne garantit alors plus rien du programme.

  **Les normes.** Bjarne Stroustrup crée « C with Classes » en 1979 ; le langage prend le nom de C++ en 1983. Il est
  normalisé par l'ISO :

  | Norme | Ce qu'on en retient |
  |---|---|
  | C++98 | la première norme : classes, templates, la STL |
  | C++11 | le « C++ moderne » : `auto`, lambdas, sémantique de déplacement, pointeurs intelligents |
  | C++14, C++17 | des compléments : `std::optional`, `std::variant`, liaisons structurées |
  | C++20 | concepts, ranges, coroutines, modules |
  | C++23 | `std::print`, `std::expected` |

  Depuis 2011, une norme sort **tous les trois ans**. Une norme n'est pas un compilateur : GCC, Clang et MSVC
  l'implémentent chacun, à leur rythme.

  **En entretien** : « C++ est compilé en code natif et laisse le contrôle de la mémoire au développeur, avec des
  abstractions qui ne coûtent rien à l'exécution. On le choisit quand les performances ou la latence comptent : jeux,
  finance, embarqué, moteurs de bases de données. »
tour:
  - title: Bienvenue dans le Tour de C++
    text: |-
      C++ est un langage **compilé** : ton code est traduit en code machine, puis s'exécute seul, sans machine virtuelle.
      Ici, le bouton « Exécuter » fait les deux : il compile avec GCC 14, en C++23, puis lance le programme.

      Un programme commence par la fonction `main`. `std::println` affiche une ligne ; les accolades `{}` de son texte
      sont remplacées par les valeurs qui suivent.

      Essaie : change l'année de naissance, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int naissance = 1983;
              std::println("C++ porte ce nom depuis {}.", naissance);
              std::println("Cela fait {} ans en 2026.", 2026 - naissance);
          }
      output: |-
        C++ porte ce nom depuis 1983.
        Cela fait 43 ans en 2026.
cards:
  - key: langage-compile
    format: course
    question: Que produit un compilateur C++ à partir du code source ?
    choices:
      - {text: "Du code machine, propre à un processeur et à un système", correct: true}
      - {text: "Du bytecode, exécuté ensuite par une machine virtuelle", correct: false}
      - {text: "Un script, relu ligne par ligne à chaque lancement", correct: false}
      - {text: "Du code C, qu'un interpréteur exécute ensuite", correct: false}
    answer: |-
      Du **code machine** natif : l'exécutable tourne sans machine virtuelle ni interpréteur. En contrepartie, il faut
      recompiler pour chaque processeur et chaque système visés.
  - key: zero-cout
    format: course
    question: Que promet le principe du « zéro coût d'abstraction » ?
    choices:
      - {text: "Qu'une abstraction ne coûte pas plus à l'exécution que le code écrit à la main", correct: true}
      - {text: "Qu'un programme C++ ne consomme pas de mémoire tant qu'il ne calcule pas", correct: false}
      - {text: "Que la compilation d'un programme C++ est toujours instantanée", correct: false}
      - {text: "Que les classes et les templates sont retirés du langage en production", correct: false}
    answer: |-
      On ne paie pas pour ce qu'on n'utilise pas, et ce qu'on utilise coûte autant que le code équivalent écrit à la
      main. Le prix se paie ailleurs : à la compilation, plus longue, et dans la complexité du langage.
  - key: paradigmes
    format: course
    question: Pourquoi dit-on que C++ est « multi-paradigme » ?
    choices:
      - {text: "Il compile le même code pour plusieurs processeurs à la fois", correct: false}
      - {text: "Il permet plusieurs styles : procédural, objet, générique, fonctionnel", correct: true}
      - {text: "Il existe plusieurs compilateurs : GCC, Clang et MSVC", correct: false}
      - {text: "Il exécute plusieurs fils d'exécution en parallèle par défaut", correct: false}
    answer: |-
      C++ n'impose pas un style : des fonctions libres, des classes, des templates et des lambdas cohabitent dans un
      même programme. Rien n'oblige, par exemple, à tout ranger dans une classe.
  - key: gestion-memoire
    format: course
    question: Qui libère la mémoire d'un programme C++ ?
    choices:
      - {text: "Un ramasse-miettes, qui passe à intervalles réguliers", correct: false}
      - {text: "Le système d'exploitation, après chaque appel de fonction", correct: false}
      - {text: "Le programme lui-même : ses destructeurs, à la sortie de la portée", correct: true}
      - {text: "Le compilateur, qui supprime les objets inutiles à la compilation", correct: false}
    answer: |-
      Le programme lui-même. C++ n'a pas de ramasse-miettes : un objet est détruit à un moment précis, la fin de sa
      portée, et son destructeur libère ce qu'il possède (RAII). C'est ce qui rend les temps de réponse prévisibles.
  - key: vf-machine-virtuelle
    format: true-false
    question: Un programme C++ compilé a besoin d'une machine virtuelle pour s'exécuter.
    truth: false
    answer: Le compilateur produit du code machine, que le processeur exécute directement.
  - key: vf-ramasse-miettes
    format: true-false
    question: Le langage C++ fournit un ramasse-miettes qui libère la mémoire inutilisée.
    truth: false
    answer: |-
      La mémoire est libérée par le programme, de façon déterministe : destructeurs et pointeurs intelligents s'en
      chargent à la sortie de la portée.
  - key: vf-norme-tous-les-trois-ans
    format: true-false
    question: Depuis C++11, une nouvelle norme du langage sort tous les trois ans.
    truth: true
    answer: "C++11, C++14, C++17, C++20, C++23 : le comité ISO publie une norme tous les trois ans."
  - key: vf-executable-portable
    format: true-false
    question: Un exécutable C++ compilé pour Linux sur x86-64 se lance tel quel sur Windows.
    truth: false
    answer: |-
      Un exécutable est du code machine lié à un système. C'est le **code source** qui est portable : on le recompile
      pour chaque cible.
  - key: qcm-createur
    format: multiple-choice
    question: Qui a créé C++ ?
    choices:
      - {text: "Bjarne Stroustrup", correct: true}
      - {text: "Dennis Ritchie", correct: false}
      - {text: "James Gosling", correct: false}
      - {text: "Linus Torvalds", correct: false}
    answer: |-
      Bjarne Stroustrup, aux Bell Labs, à partir de 1979. Dennis Ritchie a créé le C, James Gosling Java, et Linus
      Torvalds le noyau Linux et Git.
  - key: qcm-norme-moderne
    format: multiple-choice
    question: Quelle norme marque le début du « C++ moderne », avec `auto`, les lambdas et les pointeurs intelligents ?
    choices:
      - {text: "C++98", correct: false}
      - {text: "C++11", correct: true}
      - {text: "C++17", correct: false}
      - {text: "C++20", correct: false}
    answer: |-
      C++11. C++98 est la première norme ; C++17 et C++20 ajoutent respectivement `std::optional` et les liaisons
      structurées, puis les concepts et les ranges.
  - key: qcm-nouveautes-cpp20
    format: multiple-choice
    question: Laquelle de ces nouveautés est arrivée avec C++20 ?
    choices:
      - {text: "Les lambdas", correct: false}
      - {text: "Les templates", correct: false}
      - {text: "Les concepts", correct: true}
      - {text: "`std::print`", correct: false}
    answer: |-
      Les concepts, avec les ranges, les coroutines et les modules. Les templates datent de C++98, les lambdas de C++11,
      et `std::print` de C++23.
  - key: qcm-compilateurs
    format: multiple-choice
    question: Lequel de ces outils n'est pas un compilateur C++ ?
    choices:
      - {text: "GCC", correct: false}
      - {text: "Clang", correct: false}
      - {text: "MSVC", correct: false}
      - {text: "CMake", correct: true}
    answer: |-
      CMake décrit comment construire un projet et lance le compilateur ; il ne compile rien lui-même. GCC (`g++`),
      Clang (`clang++`) et MSVC sont les trois grands compilateurs.
  - key: situation-choisir-cpp
    format: scenario
    question: |-
      Ton équipe doit écrire un moteur qui traite des ordres de bourse en quelques microsecondes, sans pause. Un
      collègue propose C++. Quel argument le justifie le mieux ?
    choices:
      - {text: "Du code natif et pas de ramasse-miettes : des temps de réponse prévisibles", correct: true}
      - {text: "Une syntaxe plus simple que celle des autres langages compilés", correct: false}
      - {text: "Un langage qui détecte toutes les erreurs de mémoire à la compilation", correct: false}
      - {text: "Un exécutable unique, qui tourne sur tous les systèmes sans recompiler", correct: false}
    answer: |-
      C++ compile en code natif et n'a pas de ramasse-miettes : aucune pause ne vient interrompre le traitement, et le
      développeur contrôle chaque allocation. En revanche, la syntaxe n'est pas simple, et les erreurs de mémoire ne
      sont pas toutes détectées : c'est le prix de ce contrôle.
  - key: situation-norme-du-projet
    format: scenario
    question: |-
      Tu rejoins un projet qui compile en C++14. Tu veux utiliser `std::optional`, arrivé avec C++17. Que fais-tu
      d'abord ?
    choices:
      - {text: "Tu l'utilises : un compilateur récent accepte toutes les normes par défaut", correct: false}
      - {text: "Tu vérifies que les compilateurs du projet gèrent C++17, puis tu proposes de changer la norme", correct: true}
      - {text: "Tu inclus `<optional>` : l'en-tête suffit à activer C++17 dans ce fichier", correct: false}
      - {text: "Tu renonces : un projet ne peut pas changer de norme après son démarrage", correct: false}
    answer: |-
      La norme est une option de compilation du projet (`-std=c++17`). On vérifie que tous les compilateurs visés la
      gèrent, puis on la change pour tout le projet : les normes sont presque entièrement rétrocompatibles, et monter
      de version est courant.
  - key: situation-cpp-ou-langage-gere
    format: scenario
    question: |-
      Pour un petit outil interne qui lit un fichier CSV une fois par jour, un collègue veut du C++ « parce que c'est
      plus rapide ». Que lui réponds-tu ?
    choices:
      - {text: "Qu'il a raison : C++ est le bon choix dès qu'un programme lit un fichier", correct: false}
      - {text: "Que C++ ne sait pas lire les fichiers texte sans bibliothèque externe", correct: false}
      - {text: "Que la vitesse ne compte pas ici : un langage plus simple coûtera moins à écrire et à maintenir", correct: true}
      - {text: "Que C++ serait plus lent ici, car il compile le fichier CSV à chaque lancement", correct: false}
    answer: |-
      Les performances de C++ se paient en complexité : gestion de la mémoire, temps de compilation, comportements
      indéfinis. Pour un outil lancé une fois par jour, ce coût n'achète rien. C++ se justifie quand la vitesse, la
      latence ou la mémoire sont de vraies contraintes.
  - key: situation-comportement-indefini
    format: scenario
    question: |-
      Un programme C++ lit une case après la fin d'un tableau. Il fonctionne sur ta machine, et plante en production.
      Comment l'expliques-tu ?
    choices:
      - {text: "C'est un comportement indéfini : le langage ne garantit plus rien, d'une machine à l'autre", correct: true}
      - {text: "C'est une exception non rattrapée : la production affiche moins de messages", correct: false}
      - {text: "C'est un défaut du compilateur de production, qu'il faut mettre à jour", correct: false}
      - {text: "C'est normal : un tableau C++ s'agrandit seul, mais plus lentement en production", correct: false}
    answer: |-
      Lire hors d'un tableau est un **comportement indéfini** : C++ ne vérifie pas les indices et ne lève aucune
      exception. Le programme peut sembler marcher, afficher n'importe quoi ou planter, selon la machine, le
      compilateur et les options. « Ça marche chez moi » ne prouve rien.
  - key: definition-compilateur
    format: definition
    question: Qu'est-ce qu'un compilateur ?
    choices:
      - {text: "Un programme qui traduit le code source en code machine", correct: true}
      - {text: "Un programme qui exécute le code source ligne par ligne", correct: false}
      - {text: "Un programme qui cherche les bugs pendant l'exécution", correct: false}
      - {text: "Un programme qui range le code source dans des dossiers", correct: false}
    answer: |-
      Un compilateur traduit le code source en code machine, avant l'exécution. Celui qui exécute ligne par ligne est un
      interpréteur ; celui qui observe l'exécution est un débogueur.
  - key: definition-comportement-indefini
    format: definition
    question: Que désigne un « comportement indéfini » (*undefined behavior*) ?
    choices:
      - {text: "Une erreur que le compilateur signale, sans produire d'exécutable", correct: false}
      - {text: "Un code pour lequel la norme n'impose rien : tout peut arriver à l'exécution", correct: true}
      - {text: "Un résultat qui varie d'un compilateur à l'autre, mais que chacun documente", correct: false}
      - {text: "Une exception que le programme a oublié de rattraper", correct: false}
    answer: |-
      Un code que la norme laisse sans aucune garantie : lire hors d'un tableau, déborder un entier signé, utiliser un
      objet détruit. Un résultat qui varie mais que le compilateur documente est, lui, « défini par l'implémentation ».
  - key: definition-norme-iso
    format: definition
    question: Que désigne « C++23 » ?
    choices:
      - {text: "La version 23 du compilateur GCC", correct: false}
      - {text: "La norme ISO du langage publiée pour 2023", correct: true}
      - {text: "La 23e bibliothèque ajoutée à la bibliothèque standard", correct: false}
      - {text: "Un dialecte de C++ réservé à Windows", correct: false}
    answer: |-
      La norme ISO du langage et de sa bibliothèque standard, publiée pour 2023. Une norme est un texte ; les
      compilateurs (GCC, Clang, MSVC) l'implémentent ensuite, chacun à son rythme.
  - key: definition-multi-paradigme
    format: definition
    question: Qu'est-ce qu'un langage « multi-paradigme » ?
    choices:
      - {text: "Un langage qui tourne sur plusieurs systèmes d'exploitation", correct: false}
      - {text: "Un langage qui a plusieurs compilateurs concurrents", correct: false}
      - {text: "Un langage qui permet plusieurs styles de programmation", correct: true}
      - {text: "Un langage qui se compile en plusieurs étapes successives", correct: false}
    answer: |-
      Un langage qui permet plusieurs styles de programmation. En C++ : procédural, orienté objet, générique et
      fonctionnel.
