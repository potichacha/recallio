notion: conversions-implicites
lesson: |-
  Quand les types ne concordent pas, C++ **convertit de lui-même**, sans rien dire. C'est pratique, et c'est une
  source de bugs.

  **À l'initialisation et à l'affectation**, la valeur est convertie vers le type de la variable :

  ```cpp
  int n = 3.99;      // 3 : la partie décimale est coupée (pas d'arrondi)
  double d = 7;      // 7.0 : sans perte
  bool b = 42;       // true : tout nombre non nul
  ```

  **Dans un calcul**, les deux opérandes sont ramenés à un type commun :

  - les petits entiers (`char`, `short`, `bool`) sont d'abord **promus** en `int` : `'A' + 1` vaut l'entier 66 ;
  - si l'un des deux est un `double`, l'autre le devient : `7 / 2.0` vaut 3.5 ;
  - si l'un est signé et l'autre **non signé** de même taille, le signé devient **non signé**.

  **Le piège signé / non signé.** Dans `-1 < 1u`, le `-1` est converti en non signé : il devient 4 294 967 295, et
  la comparaison est **fausse**. On tombe dessus en comparant un `int` à une taille (`size()` renvoie un non signé).
  `-Wall -Wextra` le signalent (`-Wsign-compare`), et `std::cmp_less` (C++20) compare correctement.

  **Le piège de la division.** Le type d'un calcul dépend de ses opérandes, pas de la variable qui reçoit le résultat :
  `double moyenne = (a + b) / 2;` fait une division **entière**, puis convertit. Il faut `/ 2.0`.

  **En entretien** : « Les conversions implicites qui perdent de l'information sont le premier piège du langage. Je
  compile avec `-Wall -Wextra`, j'initialise avec des accolades, et je ne mélange pas signés et non signés. »
tour:
  - title: Les conversions implicites
    text: |-
      Quand deux types se rencontrent, C++ convertit sans prévenir. Ranger `3.99` dans un `int` coupe la décimale.
      Diviser deux `int` donne un `int`, même si le résultat part dans un `double`.

      Le piège le plus célèbre : comparer un entier signé à un non signé. Le signé est converti en non signé, et `-1`
      devient un nombre énorme.

      Essaie : remplace `(15 + 16) / 2` par `(15 + 16) / 2.0`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int coupe = 3.99;
              double moyenne = (15 + 16) / 2;
              int negatif = -1;
              unsigned int positif = 1;

              std::println("{} {}", coupe, moyenne);
              std::println("-1 < 1 ? {}", negatif < positif);
          }
      output: |-
        3 15
        -1 < 1 ? false
cards:
  - key: double-vers-int
    format: course
    question: Que fait la conversion d'un `double` en `int` ?
    choices:
      - {text: "Elle coupe la partie décimale, sans arrondir", correct: true}
      - {text: "Elle arrondit à l'entier le plus proche", correct: false}
      - {text: "Elle arrondit toujours à l'entier supérieur", correct: false}
      - {text: "Elle lève une exception s'il y a des décimales", correct: false}
    answer: "Elle tronque vers zéro : 3.99 devient 3, et -3.99 devient -3. Pour arrondir, on appelle `std::round`."
  - key: type-commun
    format: course
    question: "Dans `7 / 2.0`, que devient l'entier `7` avant la division ?"
    choices:
      - {text: "Il est converti en `double` : la division se fait à virgule", correct: true}
      - {text: "Il reste un `int`, et `2.0` est converti en `int`", correct: false}
      - {text: "Il reste un `int` : la division est entière", correct: false}
      - {text: "Il est converti en `char`, le plus petit des types", correct: false}
    answer: "Les deux opérandes sont ramenés au type commun, ici `double`. Le résultat est 3.5."
  - key: signe-contre-non-signe
    format: course
    question: "Pourquoi `-1 < 1u` est-il faux en C++ ?"
    choices:
      - {text: "Le `-1` est converti en non signé, et devient un nombre énorme", correct: true}
      - {text: "Le `1u` est converti en signé, et devient un nombre négatif", correct: false}
      - {text: "L'opérateur `<` compare les tailles des types, pas les valeurs", correct: false}
      - {text: "Le suffixe `u` inverse le sens de la comparaison", correct: false}
    answer: |-
      Face à un non signé de même taille, le signé est converti en non signé. `-1` devient 4 294 967 295, qui n'est
      pas inférieur à 1. `std::cmp_less(-1, 1u)` (C++20) donne la réponse attendue.
  - key: promotion
    format: course
    question: "Qu'appelle-t-on la « promotion » d'un `char` dans un calcul ?"
    choices:
      - {text: "Sa conversion en `int` avant l'opération", correct: true}
      - {text: "Sa conversion en `double` avant l'opération", correct: false}
      - {text: "Son passage en majuscule avant l'opération", correct: false}
      - {text: "Sa conversion en chaîne avant l'opération", correct: false}
    answer: "Les types entiers plus petits qu'un `int` (`char`, `short`, `bool`) sont convertis en `int` avant tout calcul. `'A' + 1` est un `int` : 66."
  - key: vf-arrondi
    format: true-false
    question: "`int n = 3.99;` donne à `n` la valeur 4."
    truth: false
    answer: La conversion coupe la partie décimale, elle n'arrondit pas. `n` vaut 3.
  - key: vf-division-vers-double
    format: true-false
    question: "Après `double d = 7 / 2;`, `d` vaut 3.5."
    truth: false
    answer: "`7 / 2` est calculé entre deux `int` : 3. La conversion en `double` vient après : `d` vaut 3.0."
  - key: vf-nombre-en-bool
    format: true-false
    question: Converti en `bool`, tout nombre différent de zéro donne `true`.
    truth: true
    answer: "Zéro donne `false`, tout le reste donne `true`, y compris les nombres négatifs."
  - key: vf-int-vers-double
    format: true-false
    question: "La conversion d'un `int` de 32 bits en `double` perd de l'information."
    truth: false
    answer: "Un `double` représente exactement tous les entiers de 32 bits. C'est dans l'autre sens que l'on perd."
  - key: qcm-type-du-resultat
    format: multiple-choice
    question: "Quel est le type de l'expression `'A' + 1` ?"
    choices:
      - {text: "`int`", correct: true}
      - {text: "`char`", correct: false}
      - {text: "`double`", correct: false}
      - {text: "`bool`", correct: false}
    answer: "`int` : le `char` est promu en `int` avant l'addition. Le résultat est l'entier 66, pas le caractère `B`."
  - key: qcm-option-avertissement
    format: multiple-choice
    question: Quel avertissement de GCC signale une comparaison entre un signé et un non signé ?
    choices:
      - {text: "`-Wsign-compare`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wunused`", correct: false}
      - {text: "`-Wreturn-type`", correct: false}
    answer: "`-Wsign-compare`, activé en C++ par `-Wall`. `-Wshadow` signale un nom masqué, `-Wunused` un élément inutilisé."
  - key: qcm-moyenne
    format: multiple-choice
    question: "Avec `int a = 15, b = 16;`, quelle expression vaut 15.5 ?"
    choices:
      - {text: "`(a + b) / 2.0`", correct: true}
      - {text: "`(a + b) / 2`", correct: false}
      - {text: "`a + b / 2`", correct: false}
      - {text: "`(a + b) % 2`", correct: false}
    answer: "`2.0` est un `double` : la somme est convertie, et la division garde la virgule. Avec `/ 2`, la division est entière : 15."
  - key: qcm-comparer-surement
    format: multiple-choice
    question: Quelle fonction de C++20 compare correctement un entier signé et un non signé ?
    choices:
      - {text: "`std::cmp_less`", correct: true}
      - {text: "`std::min`", correct: false}
      - {text: "`std::abs`", correct: false}
      - {text: "`std::round`", correct: false}
    answer: "`std::cmp_less(a, b)`, dans `<utility>`, compare les valeurs mathématiques, sans la conversion piège. `std::cmp_equal` et `std::cmp_greater` existent aussi."
  - key: code-signe-non-signe
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = -1;
          unsigned int b = 1;
          std::println("{}", a < b);
      }
      ```
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`-1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`false` : pour la comparaison, `a` est converti en `unsigned int`. `-1` devient 4 294 967 295, qui n'est pas inférieur à 1."
    check:
      output: "false"
  - key: code-division-puis-conversion
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          double d = 7 / 2;
          std::println("{}", d * 2);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`3.5`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`6` : `7 / 2` est une division entière, qui vaut 3. `d` reçoit 3.0, et `d * 2` vaut 6."
    check:
      output: "6"
  - key: code-troncature
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 3.99;
          int y = -3.99;
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "`3 -3`", correct: true}
      - {text: "`4 -4`", correct: false}
      - {text: "`3 -4`", correct: false}
      - {text: "`4 -3`", correct: false}
    answer: "`3 -3` : la conversion coupe la partie décimale, vers zéro. Elle n'arrondit ni vers le haut, ni vers le bas."
    check:
      output: "3 -3"
  - key: code-bool-addition
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          bool a = true;
          bool b = true;
          std::println("{}", a + b);
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2` : chaque `bool` est promu en `int` (1) avant l'addition. Le résultat est un `int`, pas un `bool`."
    check:
      output: "2"
  - key: bug-moyenne
    format: bug-fix
    question: |-
      Ce programme affiche `15` au lieu de `15.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int a = 15;
          int b = 16;
          double moyenne = (a + b) / 2;
          std::println("{}", moyenne);
      }
      ```
    choices:
      - {text: "Diviser par `2.0`", correct: true}
      - {text: "Déclarer `moyenne` avec `auto`", correct: false}
      - {text: "Écrire `{:.1f}` dans l'affichage", correct: false}
      - {text: "Retirer les parenthèses", correct: false}
    answer: |-
      ```cpp
      double moyenne = (a + b) / 2.0;
      ```
      `(a + b) / 2` est calculé entre entiers : 15. Le type de `moyenne` n'y change rien, la décimale est perdue avant
      l'affectation.
  - key: bug-seuil
    format: bug-fix
    question: |-
      Le solde est négatif, et pourtant ce programme n'affiche pas `Alerte`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int solde = -5;
          unsigned int seuil = 10;
          if (solde < seuil) {
              std::println("Alerte");
          }
      }
      ```
    choices:
      - {text: "`solde` est converti en non signé pour la comparaison", correct: true}
      - {text: "`seuil` est converti en nombre négatif pour la comparaison", correct: false}
      - {text: "Un `if` ne compare que des variables de même nom", correct: false}
      - {text: "`std::println` n'affiche rien dans un `if`", correct: false}
    answer: |-
      ```cpp
      int seuil = 10;
      ```
      Face à un `unsigned int`, `-5` devient un nombre énorme, qui n'est pas inférieur à 10. Deux `int`, ou
      `std::cmp_less(solde, seuil)`, comparent les vraies valeurs.
  - key: bug-pourcentage
    format: bug-fix
    question: |-
      Ce programme affiche `0` au lieu de `90`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 200;
          int part = 45 / 100 * total;
          std::println("{}", part);
      }
      ```
    choices:
      - {text: "Écrire `45 * total / 100`", correct: true}
      - {text: "Écrire `45 / (100 * total)`", correct: false}
      - {text: "Écrire `(45 / 100) * total`", correct: false}
      - {text: "Écrire `total * (45 / 100)`", correct: false}
    answer: |-
      ```cpp
      int part = 45 * total / 100;
      ```
      `45 / 100` est une division entière : 0. Multiplier d'abord garde l'information : 9000 / 100 vaut 90.
  - key: bug-taille-moins-un
    format: bug-fix
    question: |-
      Il manque deux places, et pourtant ce programme n'affiche pas `Complet`. Pourquoi ?
      ```cpp
      #include <cstddef>
      #include <print>

      int main() {
          std::size_t places = 3;
          std::size_t inscrits = 5;
          if (places - inscrits < 0) {
              std::println("Complet");
          }
      }
      ```
    choices:
      - {text: "La différence de deux non signés n'est jamais négative", correct: true}
      - {text: "`std::size_t` ne permet pas la soustraction", correct: false}
      - {text: "Le `if` compare `inscrits` à zéro, pas la différence", correct: false}
      - {text: "La valeur 5 ne tient pas dans un `std::size_t`", correct: false}
    answer: |-
      ```cpp
      if (places < inscrits) {
      ```
      `places - inscrits` reboucle vers un nombre énorme, toujours `>= 0`. On compare les deux valeurs directement,
      sans soustraire.
  - key: trous-division
    format: fill-in
    question: |-
      Complète pour que `moitie` vaille 3.5 :
      ```cpp
      double moitie = 7 / ___;
      ```
    blanks:
      - ["2.0", "2.", "2.0f", "2.f"]
    answer: "`2.0` est un `double` : la division garde la virgule."
  - key: trous-valeur-division
    format: fill-in
    question: |-
      Complète le commentaire avec ce que le programme affiche :
      ```cpp
      std::println("{}", 7 / 2);   // affiche ___
      ```
    blanks:
      - ["3"]
    answer: "Entre deux `int`, la division est entière : 3."
  - key: trous-valeur-tronquee
    format: fill-in
    question: |-
      Complète le commentaire avec la valeur de `n` :
      ```cpp
      int n = 9.99;   // n vaut ___
      ```
    blanks:
      - ["9"]
    answer: "La conversion en `int` coupe la partie décimale : 9."
  - key: trous-cmp-less
    format: fill-in
    question: |-
      Complète avec la fonction de C++20 qui compare correctement un signé et un non signé :
      ```cpp
      int solde = -5;
      unsigned int seuil = 10;
      if (std::___(solde, seuil)) {
          std::println("Alerte");
      }
      ```
    blanks:
      - [cmp_less, cmp_less_equal]
    answer: "`std::cmp_less(solde, seuil)` compare les valeurs mathématiques : -5 est bien inférieur à 10."
