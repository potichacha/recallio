notion: increment-affectation
lesson: |-
  **Incrémenter** une variable, c'est lui ajouter 1 : `++`. **Décrémenter**, c'est lui retirer 1 : `--`.

  Chaque opérateur a deux formes, qui modifient la variable de la même façon, mais ne **valent** pas la même chose :

  | Forme | Ce qu'elle fait | Sa valeur |
  |---|---|---|
  | `++x` (préfixe) | ajoute 1 à `x` | la **nouvelle** valeur de `x` |
  | `x++` (suffixe) | ajoute 1 à `x` | l'**ancienne** valeur de `x` |

  ```cpp
  int a = 5;
  int b = a++;   // b vaut 5, a vaut 6
  int c = ++a;   // a vaut 7, c vaut 7
  ```

  Écrite seule sur sa ligne, `x++;` ou `++x;`, la différence ne se voit pas. On prend l'habitude du **préfixe** : avec
  les itérateurs et les objets, le suffixe doit garder une copie de l'ancienne valeur.

  **Les affectations composées** combinent une opération et une affectation : `x += 5` équivaut à `x = x + 5`. Il en
  existe une par opérateur : `+=`, `-=`, `*=`, `/=`, `%=`.

  **Une affectation a une valeur** : celle qui vient d'être rangée. On peut donc les enchaîner, de droite à gauche :
  `a = b = 0;` met `b` à zéro, puis `a`.

  **Pièges classiques.**

  - `total + 5;` calcule une somme et la jette : il manque le `=`.
  - `x =+ 1;` n'est pas `x += 1;` : il affecte `+1` à `x`.
  - Ne modifie pas deux fois la même variable dans une expression : `i++ + i++` est un comportement indéfini.

  **En entretien** : « `++i` renvoie la nouvelle valeur, `i++` l'ancienne. Quand la valeur ne sert pas, j'écris `++i` :
  pour un itérateur, cela évite une copie. »
tour:
  - title: Incrémenter et affecter
    text: |-
      `++compteur` ajoute 1 à une variable, `--compteur` lui retire 1.

      Pour les autres opérations, il y a les affectations composées : `total += 5` veut dire `total = total + 5`, et de
      même `-=`, `*=`, `/=` et `%=`.

      `++x` et `x++` ajoutent 1 tous les deux. La différence est leur valeur : `++x` vaut la nouvelle valeur de `x`,
      `x++` l'ancienne.

      Essaie : remplace `total++` par `++total` dans la déclaration de `avant`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int total = 10;
              total += 5;
              total *= 2;
              std::println("{}", total);

              int avant = total++;
              std::println("{} {}", avant, total);
          }
      output: |-
        30
        30 31
cards:
  - key: prefixe-ou-suffixe
    format: course
    question: "Quelle différence entre `++x` et `x++` ?"
    choices:
      - {text: "`++x` vaut la nouvelle valeur de `x`, `x++` l'ancienne", correct: true}
      - {text: "`++x` vaut l'ancienne valeur de `x`, `x++` la nouvelle", correct: false}
      - {text: "`++x` ajoute 2 à `x`, `x++` lui ajoute 1", correct: false}
      - {text: "`++x` modifie `x`, `x++` ne la modifie pas", correct: false}
    answer: "Les deux ajoutent 1 à `x`. Le préfixe renvoie la valeur après l'incrémentation, le suffixe la valeur d'avant."
  - key: affectation-composee
    format: course
    question: "À quoi équivaut `x *= 3;` ?"
    choices:
      - {text: "`x = x * 3;`", correct: true}
      - {text: "`x = 3;`", correct: false}
      - {text: "`x == x * 3;`", correct: false}
      - {text: "`x = x + 3;`", correct: false}
    answer: "Une affectation composée applique l'opération à la variable, puis y range le résultat : `x = x * 3;`."
  - key: pourquoi-prefixe
    format: course
    question: "Pourquoi recommande-t-on `++i` plutôt que `i++` quand la valeur ne sert pas ?"
    choices:
      - {text: "Le suffixe doit garder une copie de l'ancienne valeur, inutile ici", correct: true}
      - {text: "Le suffixe incrémente la variable une fois sur deux seulement", correct: false}
      - {text: "Le suffixe est retiré de la norme depuis C++20", correct: false}
      - {text: "Le suffixe ne s'applique pas aux variables entières", correct: false}
    answer: |-
      `i++` renvoie l'ancienne valeur : il faut donc en garder une copie. Pour un `int`, le compilateur l'élimine ; pour
      un itérateur ou un objet, la copie peut coûter. `++i` n'en a jamais besoin.
  - key: valeur-d-une-affectation
    format: course
    question: "Que fait `a = b = 0;` ?"
    choices:
      - {text: "Elle met `b` à zéro, puis `a` : une affectation a une valeur", correct: true}
      - {text: "Elle compare `a` à `b`, puis met le résultat à zéro", correct: false}
      - {text: "Elle met `a` à la valeur de `b`, puis `b` à zéro", correct: false}
      - {text: "Rien : enchaîner deux `=` ne compile pas", correct: false}
    answer: "L'affectation se lit de droite à gauche : `b = 0` d'abord, et sa valeur, 0, est rangée dans `a`."
  - key: vf-suffixe-modifie
    format: true-false
    question: "Après `int b = a++;`, la variable `a` a augmenté de 1."
    truth: true
    answer: "`a++` incrémente bien `a`. C'est `b` qui reçoit l'ancienne valeur."
  - key: vf-plus-egal
    format: true-false
    question: "`x += 1;` et `++x;` modifient `x` de la même façon."
    truth: true
    answer: Les deux ajoutent 1 à `x`.
  - key: vf-egal-plus
    format: true-false
    question: "`x =+ 5;` ajoute 5 à `x`."
    truth: false
    answer: "`=+` n'est pas un opérateur : le compilateur lit `x = +5;`, qui remplace la valeur de `x` par 5."
  - key: vf-double-modification
    format: true-false
    question: "Le résultat de `i++ + i++` est défini par la norme."
    truth: false
    answer: Modifier deux fois la même variable dans une expression, sans ordre imposé, est un comportement indéfini.
  - key: qcm-decrementer
    format: multiple-choice
    question: Quelle instruction retire 1 à la variable `vies` ?
    choices:
      - {text: "`--vies;`", correct: true}
      - {text: "`vies - 1;`", correct: false}
      - {text: "`vies =- 1;`", correct: false}
      - {text: "`vies == vies - 1;`", correct: false}
    answer: "`--vies;` décrémente. `vies - 1;` calcule sans rien ranger, `vies =- 1;` affecte -1, et `==` compare."
  - key: qcm-valeur-suffixe
    format: multiple-choice
    question: "Avec `int a = 5;`, que vaut l'expression `a++` ?"
    choices:
      - {text: "5", correct: true}
      - {text: "6", correct: false}
      - {text: "4", correct: false}
      - {text: "1", correct: false}
    answer: "5 : le suffixe renvoie l'ancienne valeur. `a`, elle, vaut 6 après."
  - key: qcm-reste-compose
    format: multiple-choice
    question: "Avec `int n = 17;`, que vaut `n` après `n %= 5;` ?"
    choices:
      - {text: "2", correct: true}
      - {text: "3", correct: false}
      - {text: "12", correct: false}
      - {text: "5", correct: false}
    answer: "`n %= 5` équivaut à `n = n % 5` : le reste de 17 par 5, soit 2."
  - key: qcm-instruction-sans-effet
    format: multiple-choice
    question: "Que fait la ligne `total + 5;` ?"
    choices:
      - {text: "Elle calcule la somme, puis la jette : `total` ne change pas", correct: true}
      - {text: "Elle ajoute 5 à `total`, comme `total += 5;`", correct: false}
      - {text: "Elle déclare une variable nommée `total + 5`", correct: false}
      - {text: "Elle provoque une erreur à l'exécution du programme", correct: false}
    answer: "Une expression seule est permise, mais son résultat est perdu. `-Wall` le signale (« statement has no effect »)."
  - key: trous-incrementer
    format: fill-in
    question: |-
      Complète pour ajouter 1 à `compteur` :
      ```cpp
      int compteur = 0;
      ___compteur;
      ```
    blanks:
      - ["++"]
    answer: "`++compteur;` incrémente la variable."
  - key: trous-plus-egal
    format: fill-in
    question: |-
      Complète pour ajouter 5 à `total` avec une affectation composée :
      ```cpp
      int total = 10;
      total ___ 5;
      ```
    blanks:
      - ["+="]
    answer: "`total += 5;` équivaut à `total = total + 5;`."
  - key: trous-doubler
    format: fill-in
    question: |-
      Complète pour doubler `prix` avec une affectation composée :
      ```cpp
      int prix = 21;
      prix ___ 2;
      ```
    blanks:
      - ["*="]
    answer: "`prix *= 2;` équivaut à `prix = prix * 2;`."
  - key: trous-prefixe
    format: fill-in
    question: |-
      Complète pour que `b` reçoive la valeur de `a` après son incrémentation :
      ```cpp
      int a = 5;
      int b = ___a;   // a vaut 6, b vaut 6
      ```
    blanks:
      - ["++"]
    answer: "Le préfixe `++a` incrémente d'abord, puis vaut la nouvelle valeur."
  - key: code-suffixe
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 5;
          int b = a++;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`6 5`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`5 6`", correct: false}
      - {text: "`5 5`", correct: false}
    answer: "`6 5` : `a++` vaut l'ancienne valeur, 5, que reçoit `b`. `a` est ensuite incrémentée."
    check:
      output: "6 5"
  - key: code-prefixe
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 5;
          int b = ++a;
          int c = a--;
          std::println("{} {} {}", a, b, c);
      }
      ```
    choices:
      - {text: "`5 6 6`", correct: true}
      - {text: "`5 6 5`", correct: false}
      - {text: "`5 5 6`", correct: false}
      - {text: "`6 6 6`", correct: false}
    answer: "`5 6 6` : `++a` porte `a` à 6 et vaut 6. `a--` vaut encore 6, puis ramène `a` à 5."
    check:
      output: "5 6 6"
  - key: code-composees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 10;
          x += 5;
          x *= 2;
          x -= 4;
          x /= 3;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`8`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`26`", correct: false}
      - {text: "`8.67`", correct: false}
    answer: "`8` : 15, puis 30, puis 26, puis 26 / 3. La division est entière : 8."
    check:
      output: "8"
  - key: code-enchainement
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = 2;
          a = b = 7;
          a += b;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`14 7`", correct: true}
      - {text: "`9 7`", correct: false}
      - {text: "`8 7`", correct: false}
      - {text: "`14 14`", correct: false}
    answer: "`14 7` : `a = b = 7;` met les deux à 7, de droite à gauche. Puis `a += b` porte `a` à 14."
    check:
      output: "14 7"
  - key: bug-sans-affectation
    format: bug-fix
    question: |-
      Ce programme affiche `10` au lieu de `15`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 10;
          total + 5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `total += 5;`", correct: true}
      - {text: "Écrire `total ++ 5;`", correct: false}
      - {text: "Écrire `total == total + 5;`", correct: false}
      - {text: "Écrire `int total + 5;`", correct: false}
    answer: |-
      ```cpp
      total += 5;
      ```
      `total + 5;` calcule 15 et le jette. Il faut ranger le résultat : `+=`, ou `total = total + 5;`.
  - key: bug-egal-plus
    format: bug-fix
    question: |-
      Ce programme affiche `1` au lieu de `3`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int visites = 0;
          visites =+ 1;
          visites =+ 1;
          visites =+ 1;
          std::println("{}", visites);
      }
      ```
    choices:
      - {text: "`=+ 1` affecte la valeur `+1` : il faut écrire `+= 1`", correct: true}
      - {text: "`=+` n'ajoute 1 qu'à la première exécution de la ligne", correct: false}
      - {text: "Une variable ne peut être modifiée qu'une fois par bloc", correct: false}
      - {text: "`visites` vaut zéro, qu'on ne peut pas incrémenter", correct: false}
    answer: |-
      ```cpp
      visites += 1;
      ```
      Le compilateur lit `visites = +1;` : chaque ligne remet la variable à 1. L'opérateur s'écrit `+=`, le signe
      d'abord.
  - key: bug-numero-suivant
    format: bug-fix
    question: |-
      Ce programme devrait afficher `suivant : 42`, et affiche `suivant : 41`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int numero = 41;
          int suivant = numero++;
          std::println("suivant : {}", suivant);
      }
      ```
    choices:
      - {text: "Écrire `int suivant = numero + 1;`", correct: true}
      - {text: "Écrire `int suivant = numero--;`", correct: false}
      - {text: "Écrire `int suivant = numero + +;`", correct: false}
      - {text: "Écrire `int suivant == numero++;`", correct: false}
    answer: |-
      ```cpp
      int suivant = numero + 1;
      ```
      `numero++` vaut l'ancienne valeur, 41. `numero + 1` dit ce qu'on veut, sans modifier `numero` au passage ;
      `++numero` donnerait aussi 42, en incrémentant `numero`.
  - key: bug-compose-tronque
    format: bug-fix
    question: |-
      Ce programme affiche `10` au lieu de `10.8`, le prix augmenté de 20 %. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int prix = 9;
          prix *= 1.2;
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Déclarer `prix` avec le type `double`", correct: true}
      - {text: "Écrire `prix =* 1.2;`", correct: false}
      - {text: "Écrire `prix *= 12 / 10;`", correct: false}
      - {text: "Écrire `{:.1f}` dans l'affichage", correct: false}
    answer: |-
      ```cpp
      double prix = 9;
      ```
      Le produit vaut bien 10.8, mais il est rangé dans un `int` : la décimale est coupée. `12 / 10` n'arrangerait
      rien : c'est une division entière, qui vaut 1.
