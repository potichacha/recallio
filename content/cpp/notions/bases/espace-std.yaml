notion: espace-std
lesson: |-
  Toute la bibliothèque standard vit dans l'**espace de noms `std`**. Un espace de noms est un préfixe qui évite les
  collisions : ton `max` et celui de la bibliothèque, `std::max`, portent des noms différents.

  L'opérateur **`::`** (résolution de portée) désigne un nom dans un espace : `std::cout`, `std::string`.

  Trois façons d'utiliser un nom de `std` :

  ```cpp
  std::cout << "Bonjour\n";   // 1. le nom qualifié : toujours sûr

  using std::cout;            // 2. une déclaration using : un seul nom
  cout << "Bonjour\n";

  using namespace std;        // 3. une directive using : tous les noms de std
  cout << "Bonjour\n";
  ```

  **Pourquoi éviter `using namespace std;`.** `std` contient des milliers de noms, souvent courants : `count`, `max`,
  `distance`, `size`, `swap`. Les importer tous expose à des **collisions** avec tes propres noms : au mieux une erreur
  d'ambiguïté, au pire l'appel d'une autre fonction que celle que tu visais. Et le risque grandit à chaque nouvelle
  norme, qui ajoute des noms.

  - **Jamais dans un en-tête** : la directive s'imposerait à tous les fichiers qui l'incluent.
  - Dans un fichier `.cpp`, on préfère les noms qualifiés. Si un nom revient sans cesse, une déclaration
    `using std::cout;`, de préférence dans une fonction, n'importe que lui.

  Un `using` vaut pour la portée où il est écrit : dans une fonction, il s'arrête à la fin de son bloc.

  **En entretien** : « J'écris `std::` partout. `using namespace std;` importe des milliers de noms et crée des
  collisions ; dans un en-tête, il pollue en plus tous les fichiers qui l'incluent. »
tour:
  - title: L'espace de noms std
    text: |-
      La bibliothèque standard range tous ses noms dans l'espace `std` : on écrit `std::println`, `std::max`. Le `::`
      veut dire « dans ».

      Tu peux créer tes propres espaces avec `namespace`. Ici, `outil::max` et `std::max` cohabitent sans se gêner,
      parce que chacun a son préfixe.

      Tu verras parfois `using namespace std;`, qui dispense d'écrire `std::`. On l'évite : il importe des milliers de
      noms, qui peuvent entrer en collision avec les tiens.

      Essaie : dans `main`, remplace `outil::max` par `std::max`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <algorithm>
          #include <print>

          namespace outil {
              // Un « max » maison, qui plafonne à 10.
              int max(int a, int b) {
                  int plus_grand = a > b ? a : b;
                  return plus_grand > 10 ? 10 : plus_grand;
              }
          }

          int main() {
              std::println("std::max   : {}", std::max(7, 42));
              std::println("outil::max : {}", outil::max(7, 42));
          }
      output: |-
        std::max   : 42
        outil::max : 10
cards:
  - key: role-de-std
    format: course
    question: Qu'est-ce que `std` dans `std::cout` ?
    choices:
      - {text: "L'espace de noms qui contient la bibliothèque standard", correct: true}
      - {text: "La classe dont `cout` est une méthode statique", correct: false}
      - {text: "Le fichier d'en-tête où `cout` est déclaré", correct: false}
      - {text: "Un mot-clé qui marque les fonctions d'affichage", correct: false}
    answer: |-
      `std` est l'espace de noms de la bibliothèque standard : `std::cout`, `std::string`, `std::vector`. L'en-tête,
      lui, est `<iostream>`.
  - key: pourquoi-eviter-using-namespace
    format: course
    question: Pourquoi évite-t-on `using namespace std;` ?
    choices:
      - {text: "Il importe tous les noms de `std`, qui peuvent entrer en collision avec les tiens", correct: true}
      - {text: "Il ralentit le programme, qui cherche chaque nom dans `std` à l'exécution", correct: false}
      - {text: "Il est retiré de la norme depuis C++20, et ne compile plus", correct: false}
      - {text: "Il oblige à inclure tous les en-têtes de la bibliothèque standard", correct: false}
    answer: |-
      La directive rend visibles des milliers de noms courants (`count`, `max`, `distance`). Un des tiens peut devenir
      ambigu, ou pire, être remplacé en silence par celui de `std`. Elle ne coûte rien à l'exécution : les noms sont
      résolus à la compilation.
  - key: using-dans-en-tete
    format: course
    question: Pourquoi ne met-on jamais `using namespace std;` dans un fichier d'en-tête ?
    choices:
      - {text: "La directive s'impose à tous les fichiers qui incluent l'en-tête", correct: true}
      - {text: "Un en-tête ne peut contenir que des déclarations de fonctions", correct: false}
      - {text: "Le préprocesseur supprime les directives `using` des en-têtes", correct: false}
      - {text: "La directive n'a d'effet que dans le fichier qui contient `main`", correct: false}
    answer: |-
      `#include` recopie l'en-tête dans chaque fichier qui l'inclut : la directive s'y applique aussi, sans que leur
      auteur l'ait choisie, et il ne peut pas l'annuler.
  - key: declaration-ou-directive
    format: course
    question: Quelle différence entre `using std::cout;` et `using namespace std;` ?
    choices:
      - {text: "Le premier importe un seul nom, le second tous les noms de `std`", correct: true}
      - {text: "Le premier vaut pour tout le programme, le second pour une fonction", correct: false}
      - {text: "Le premier est du C++ moderne, le second est refusé depuis C++11", correct: false}
      - {text: "Aucune : ce sont deux écritures de la même directive", correct: false}
    answer: |-
      `using std::cout;` est une **déclaration** : elle n'importe que `cout`. `using namespace std;` est une
      **directive** : elle rend visibles tous les noms de `std`. Les deux valent pour la portée où elles sont écrites.
  - key: vf-string-dans-std
    format: true-false
    question: "`std::string` et `std::vector` appartiennent au même espace de noms."
    truth: true
    answer: Toute la bibliothèque standard est dans `std`, quel que soit l'en-tête qui déclare le nom.
  - key: vf-using-accelere
    format: true-false
    question: "`using namespace std;` rend le programme plus rapide à l'exécution."
    truth: false
    answer: Les noms sont résolus à la compilation. La directive ne change que la façon de les écrire.
  - key: vf-using-dans-fonction
    format: true-false
    question: Un `using std::cout;` écrit dans une fonction ne vaut que jusqu'à la fin de son bloc.
    truth: true
    answer: Un `using` suit les règles de portée. Écrit dans une fonction, il ne touche pas le reste du fichier.
  - key: vf-include-suffit
    format: true-false
    question: "Après `#include <iostream>`, on peut écrire `cout` sans `std::` ni `using`."
    truth: false
    answer: |-
      L'en-tête déclare `cout` dans l'espace `std`. Il faut le nom qualifié `std::cout`, ou un `using` qui le rend
      visible.
  - key: qcm-operateur-portee
    format: multiple-choice
    question: Quel opérateur désigne un nom dans un espace de noms ?
    choices:
      - {text: "`::`", correct: true}
      - {text: "`.`", correct: false}
      - {text: "`->`", correct: false}
      - {text: "`:`", correct: false}
    answer: |-
      `::` est l'opérateur de résolution de portée : `std::cout`. Le point et la flèche accèdent au membre d'un objet,
      pas à celui d'un espace de noms.
  - key: qcm-importer-un-nom
    format: multiple-choice
    question: Quelle ligne permet d'écrire `cout` sans préfixe, en n'important que ce nom ?
    choices:
      - {text: "`using std::cout;`", correct: true}
      - {text: "`using namespace std;`", correct: false}
      - {text: "`using namespace cout;`", correct: false}
      - {text: "`#include <cout>`", correct: false}
    answer: |-
      `using std::cout;` est une déclaration `using` : elle n'importe que `cout`. `using namespace std;` le permet
      aussi, mais importe tout le reste avec.
  - key: qcm-collision
    format: multiple-choice
    question: "Avec `using namespace std;`, ton code déclare une variable globale `count` et inclut `<algorithm>`, qui déclare `std::count`. Que se passe-t-il quand tu écris `count` ?"
    choices:
      - {text: "Le compilateur signale que le nom est ambigu", correct: true}
      - {text: "Ta variable l'emporte toujours sur celle de `std`", correct: false}
      - {text: "Le nom de `std` l'emporte toujours sur ta variable", correct: false}
      - {text: "Le programme choisit entre les deux à l'exécution", correct: false}
    answer: |-
      Les deux noms sont visibles au même niveau : le compilateur ne tranche pas, et refuse le code (« reference to
      'count' is ambiguous »). Sans la directive, `count` désignerait ta variable, sans hésitation.
  - key: qcm-ou-placer-using
    format: multiple-choice
    question: Si tu tiens à écrire `cout` sans préfixe, où placer le `using` pour limiter son effet ?
    choices:
      - {text: "Dans la fonction qui s'en sert", correct: true}
      - {text: "En haut du fichier d'en-tête", correct: false}
      - {text: "Avant les `#include` du fichier", correct: false}
      - {text: "Dans un fichier inclus partout", correct: false}
    answer: |-
      Dans la fonction : le `using` s'arrête à la fin de son bloc. Dans un en-tête, ou dans un fichier inclus partout,
      il s'imposerait à tout le projet.
  - key: trous-portee
    format: fill-in
    question: |-
      Complète avec l'opérateur qui désigne `cout` dans l'espace `std` :
      ```cpp
      std___cout << "Bonjour\n";
      ```
    blanks:
      - ["::"]
    answer: "`::` est l'opérateur de résolution de portée."
  - key: trous-prefixe
    format: fill-in
    question: |-
      Complète avec l'espace de noms de la bibliothèque standard :
      ```cpp
      #include <string>

      ___::string prenom = "Ada";
      ```
    blanks:
      - [std]
    answer: "`string` est un nom de la bibliothèque standard : il s'écrit `std::string`."
  - key: trous-declaration-using
    format: fill-in
    question: |-
      Complète pour n'importer que `cout` :
      ```cpp
      #include <iostream>

      int main() {
          ___ std::cout;
          cout << "Bonjour\n";
      }
      ```
    blanks:
      - [using]
    answer: "`using std::cout;` rend le seul nom `cout` visible, jusqu'à la fin de `main`."
  - key: trous-directive
    format: fill-in
    question: |-
      Complète la directive qui importe tous les noms de `std` (celle qu'on évite) :
      ```cpp
      using ___ std;
      ```
    blanks:
      - [namespace]
    answer: "`using namespace std;` rend visibles tous les noms de `std`."
  - key: code-deux-espaces
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      namespace outil {
          int taille() { return 3; }
      }

      int taille() { return 7; }

      int main() {
          std::cout << taille() << outil::taille() << "\n";
      }
      ```
    choices:
      - {text: "`73`", correct: true}
      - {text: "`37`", correct: false}
      - {text: "`77`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `73` : `taille()` sans préfixe désigne la fonction hors de tout espace de noms, et `outil::taille()` celle de
      l'espace `outil`. Les deux cohabitent sans conflit.
    check:
      output: "73"
  - key: code-using-local
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      namespace a { int x = 1; }
      namespace b { int x = 2; }

      int main() {
          using a::x;
          std::cout << x << b::x << "\n";
      }
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`11`", correct: false}
      - {text: "`22`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `12` : `using a::x;` fait de `x` le nom de `a::x` dans `main`. Le nom qualifié `b::x` désigne toujours celui de
      `b`.
    check:
      output: "12"
  - key: code-ambiguite
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iostream>

      using namespace std;

      int count = 0;

      int main() {
          count = count + 1;
          cout << count << "\n";
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: |-
      Ça ne compile pas : `<algorithm>` déclare `std::count`, que la directive rend visible à côté de la variable
      `count`. Le compilateur refuse de choisir (« reference to 'count' is ambiguous »). Sans `using namespace std;`,
      le programme afficherait `1`.
    check:
      compiles: false
  - key: code-masquage-local
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iostream>

      int main() {
          using namespace std;
          int max = 5;
          cout << max << "\n";
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: |-
      `5` : une variable locale masque les noms des portées englobantes, y compris ceux qu'une directive `using` rend
      visibles. Ici, `max` désigne la variable, pas `std::max`. Le code compile, mais il se lit mal : c'est une raison
      de plus d'éviter la directive.
    check:
      output: "5"
  - key: bug-cout-sans-prefixe
    format: bug-fix
    question: |-
      Le compilateur répond « 'cout' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <iostream>

      int main() {
          cout << "Bonjour !\n";
      }
      ```
    choices:
      - {text: "Écrire `std::cout`", correct: true}
      - {text: "Inclure aussi `<cout>`", correct: false}
      - {text: "Écrire `iostream::cout`", correct: false}
      - {text: "Déclarer `int cout;`", correct: false}
    answer: |-
      ```cpp
      std::cout << "Bonjour !\n";
      ```
      `cout` est déclaré dans l'espace `std` : sans préfixe ni `using`, le compilateur ne le trouve pas.
  - key: bug-un-seul-deux-points
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```cpp
      #include <iostream>

      int main() {
          std:cout << "Bonjour !\n";
      }
      ```
    choices:
      - {text: "Il faut deux deux-points : `std::cout`", correct: true}
      - {text: "Il faut un point : `std.cout`", correct: false}
      - {text: "Il faut une flèche : `std->cout`", correct: false}
      - {text: "Il faut inclure `<std>` en plus", correct: false}
    answer: |-
      ```cpp
      std::cout << "Bonjour !\n";
      ```
      L'opérateur de résolution de portée est `::`. Avec un seul deux-points, le compilateur lit `std:` comme une
      étiquette, puis cherche un `cout` qu'il ne trouve pas.
  - key: bug-using-incomplet
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction importe seulement `cout` ?
      ```cpp
      #include <iostream>

      using std;

      int main() {
          cout << "Bonjour !\n";
      }
      ```
    choices:
      - {text: "Écrire `using std::cout;`", correct: true}
      - {text: "Écrire `using namespace std;`", correct: false}
      - {text: "Écrire `using cout;`", correct: false}
      - {text: "Écrire `#include <std>`", correct: false}
    answer: |-
      ```cpp
      using std::cout;
      ```
      Une déclaration `using` nomme ce qu'elle importe : `std::cout`. `using namespace std;` compilerait aussi, mais
      importerait tous les noms de `std`.
  - key: bug-fonction-ambigue
    format: bug-fix
    question: |-
      Depuis qu'un fichier inclut cet en-tête, sa variable globale `count` ne compile plus : « reference to 'count' is
      ambiguous ». Quelle correction de l'en-tête est la bonne ?
      ```cpp
      // texte.hpp
      #include <algorithm>
      #include <string>

      using namespace std;

      string majuscules(string texte);
      ```
    choices:
      - {text: "Retirer la directive `using`, et écrire `std::string`", correct: true}
      - {text: "Déplacer la directive `using` avant les `#include`", correct: false}
      - {text: "Remplacer `<algorithm>` par `<iostream>`", correct: false}
      - {text: "Renommer la fonction `majuscules` en `count`", correct: false}
    answer: |-
      ```cpp
      std::string majuscules(std::string texte);
      ```
      Un `using namespace std;` dans un en-tête s'applique à tous les fichiers qui l'incluent : leur `count` se
      retrouve face à `std::count`. Un en-tête écrit toujours les noms qualifiés.
