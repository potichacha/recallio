notion: main-arguments
lesson: |-
  Un programme reçoit les mots tapés après son nom sur la ligne de commande. Pour les lire, `main` prend deux
  paramètres :

  ```cpp
  int main(int argc, char* argv[]) {
      for (int i = 0; i < argc; ++i) {
          std::println("{} : {}", i, argv[i]);
      }
  }
  ```

  Lancé par `./copier source.txt cible.txt`, ce programme affiche :

  ```
  0 : ./copier
  1 : source.txt
  2 : cible.txt
  ```

  - **`argc`** (*argument count*) est le **nombre** d'arguments, **nom du programme compris**. Lancé sans rien, un
    programme a donc `argc == 1`.
  - **`argv`** (*argument vector*) est un tableau de **chaînes C** (`char*`). `argv[0]` est le nom du programme ;
    les vrais arguments vont de `argv[1]` à `argv[argc - 1]`. `argv[argc]` vaut `nullptr`.

  **Toujours vérifier `argc`.** Lire `argv[1]` quand `argc` vaut 1 donne un pointeur nul : s'en servir comme d'une
  chaîne est un comportement indéfini.

  ```cpp
  if (argc < 2) {
      std::println(stderr, "usage : {} <fichier>", argv[0]);
      return 1;
  }
  ```

  **Ce sont des chaînes.** `./somme 2 3` reçoit `"2"` et `"3"`, pas des nombres. On les convertit :
  `std::stoi(argv[1])`, qui lance une exception si le texte n'est pas un nombre, ou `std::from_chars`.

  **Les comparer.** `argv[1] == "--aide"` compare deux **adresses**, pas deux textes : c'est presque toujours faux.
  On passe par `std::string_view` :

  ```cpp
  if (std::string_view{argv[1]} == "--aide") { ... }
  ```

  Le plus simple est de tout convertir d'un coup : `std::vector<std::string_view> arguments(argv + 1, argv + argc);`.

  **La valeur de retour.** `main` renvoie le **code de sortie** du programme : `0` pour un succès, autre chose pour
  un échec. Les scripts et l'intégration continue lisent ce code. Sans `return`, `main` renvoie 0.

  **Les autres écritures.** `int main()` quand on n'a pas besoin des arguments ; `char** argv` est la même chose
  que `char* argv[]`.

  **En entretien** : « `argc` compte les arguments, nom du programme compris ; `argv` est un tableau de chaînes C,
  avec le nom du programme en `argv[0]`. Je vérifie `argc` avant de lire, je convertis les nombres, et je compare
  par `std::string_view`. »
tour:
  - title: Les arguments du programme
    text: |-
      `main` peut recevoir ce qu'on tape après le nom du programme. `argc` en donne le nombre, nom du programme
      compris ; `argv` les contient, sous forme de chaînes.

      Ici, le programme est lancé sans argument : `argc` vaut 1, et il n'y a que `argv[0]`, le nom du programme.
      On vérifie donc toujours `argc` avant de lire `argv[1]`.

      Essaie : remplace `argc < 2` par `argc < 1`, puis exécute. Le programme croit avoir reçu un argument.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main(int argc, char* argv[]) {
              std::println("{} argument", argc);
              if (argc < 2) {
                  std::println("aucun fichier donné");
                  return 0;
              }
              std::println("fichier : {}", argv[1]);
          }
      output: |-
        1 argument
        aucun fichier donné
cards:
  - key: argc
    format: course
    question: "Que contient `argc` ?"
    choices:
      - {text: "Le nombre d'arguments de la ligne de commande, nom du programme compris", correct: true}
      - {text: "Le nombre d'arguments de la ligne de commande, sans le nom du programme", correct: false}
      - {text: "Le nombre de caractères tapés sur la ligne de commande", correct: false}
      - {text: "Le code de sortie du programme précédent", correct: false}
    answer: "Un programme lancé sans argument a `argc == 1` : il y a toujours son propre nom."
  - key: argv-zero
    format: course
    question: "Que contient `argv[0]` ?"
    choices:
      - {text: "Le nom sous lequel le programme a été lancé", correct: true}
      - {text: "Le premier argument donné par l'utilisateur", correct: false}
      - {text: "Le nombre d'arguments, sous forme de texte", correct: false}
      - {text: "Un pointeur nul, qui marque le début du tableau", correct: false}
    answer: "Les arguments de l'utilisateur commencent à `argv[1]`. Le pointeur nul est à la fin : `argv[argc]`."
  - key: type
    format: course
    question: "Sous quelle forme `main` reçoit-il l'argument `42` de `./prog 42` ?"
    choices:
      - {text: "Une chaîne C, `\"42\"`, qu'il faut convertir en nombre", correct: true}
      - {text: "Un `int` qui vaut 42, prêt à l'emploi", correct: false}
      - {text: "Une `std::string` qui contient `42`", correct: false}
      - {text: "Un `double` qui vaut 42.0", correct: false}
    answer: "Tous les arguments sont des `char*`. `std::stoi(argv[1])` ou `std::from_chars` font la conversion."
  - key: retour
    format: course
    question: "Que signifie la valeur renvoyée par `main` ?"
    choices:
      - {text: "Le code de sortie du programme : 0 pour un succès, autre chose pour un échec", correct: true}
      - {text: "Le nombre d'arguments que le programme a lus sur sa ligne de commande", correct: false}
      - {text: "Le nombre de lignes que le programme a affichées avant de se terminer", correct: false}
      - {text: "La quantité de mémoire que le programme a utilisée, en octets", correct: false}
    answer: "Le système le transmet à qui a lancé le programme : un script, un terminal, l'intégration continue."
  - key: vf-sans-argument
    format: true-false
    question: "Lancé sans argument, un programme a `argc` égal à 0."
    truth: false
    answer: "`argc` vaut 1 : le nom du programme compte."
  - key: vf-argv-argc
    format: true-false
    question: "`argv[argc]` est un pointeur nul."
    truth: true
    answer: "Le tableau se termine par `nullptr`. Le dernier argument est `argv[argc - 1]`."
  - key: vf-comparaison
    format: true-false
    question: "`argv[1] == \"--aide\"` compare le texte de l'argument à `--aide`."
    truth: false
    answer: "Il compare deux adresses. Pour comparer les textes : `std::string_view{argv[1]} == \"--aide\"`."
  - key: vf-return
    format: true-false
    question: "Sans instruction `return`, `main` renvoie 0."
    truth: true
    answer: "C'est une exception propre à `main`. Toute autre fonction non `void` doit renvoyer une valeur."
  - key: qcm-signature
    format: multiple-choice
    question: "Quelle signature de `main` donne accès aux arguments ?"
    choices:
      - {text: "`int main(int argc, char* argv[])`", correct: true}
      - {text: "`int main(std::string argv)`", correct: false}
      - {text: "`void main(int argc)`", correct: false}
      - {text: "`int main(char argc, int argv)`", correct: false}
    answer: "Un entier, puis un tableau de chaînes C. `char** argv` s'écrit aussi."
  - key: qcm-convertir
    format: multiple-choice
    question: "Comment convertis-tu `argv[1]` en entier ?"
    choices:
      - {text: "`std::stoi(argv[1])`", correct: true}
      - {text: "`static_cast<int>(argv[1])`", correct: false}
      - {text: "`int(argv[1][0])`", correct: false}
      - {text: "`*argv[1]`", correct: false}
    answer: "`std::stoi` lit le nombre écrit dans la chaîne. Un cast donnerait une adresse ou le code d'un caractère."
  - key: qcm-dernier
    format: multiple-choice
    question: "Quel est l'indice du dernier argument valide dans `argv` ?"
    choices:
      - {text: "`argc - 1`", correct: true}
      - {text: "`argc`", correct: false}
      - {text: "`argc + 1`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Les indices vont de 0 à `argc - 1`. `argv[argc]` est le pointeur nul final."
  - key: qcm-echec
    format: multiple-choice
    question: "Que renvoie `main` pour signaler un échec à qui a lancé le programme ?"
    choices:
      - {text: "Une valeur différente de 0, comme `1`", correct: true}
      - {text: "La valeur `0`, et rien d'autre", correct: false}
      - {text: "La valeur `false`, convertie en entier", correct: false}
      - {text: "Un pointeur nul, à la place d'un entier", correct: false}
    answer: "Par convention, 0 est le succès. `false` vaut 0 : il signalerait une réussite."
  - key: trous-argc
    format: fill-in
    question: |-
      Complète le nom du paramètre qui compte les arguments :
      ```cpp
      int main(int ___, char* argv[]) {
          return 0;
      }
      ```
    blanks:
      - [argc]
    answer: "`argc` : *argument count*."
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour vérifier qu'un argument a été donné avant de lire `argv[1]` :
      ```cpp
      if (argc < ___) {
          return 1;
      }
      std::println("{}", argv[1]);
      ```
    blanks:
      - ["2"]
    answer: "Il faut au moins deux éléments : le nom du programme, et l'argument."
  - key: trous-stoi
    format: fill-in
    question: |-
      Complète pour convertir l'argument en entier :
      ```cpp
      const int nombre = std::___(argv[1]);
      ```
    blanks:
      - [stoi]
    answer: "`std::stoi` convertit une chaîne en `int`."
  - key: trous-string-view
    format: fill-in
    question: |-
      Complète pour comparer le texte de l'argument, et non son adresse :
      ```cpp
      if (std::___{argv[1]} == "--aide") {
          afficher_aide();
      }
      ```
    blanks:
      - [string_view, string]
    answer: "`std::string_view` compare les caractères. Deux `char*` compareraient leurs adresses."
  - key: code-sans-argument
    format: code-output
    question: |-
      Le programme est lancé sans argument.
      ```cpp
      #include <print>

      int main(int argc, char* argv[]) {
          std::println("{} {}", argc, argv[argc] == nullptr);
      }
      ```
    choices:
      - {text: "`1 true`", correct: true}
      - {text: "`0 true`", correct: false}
      - {text: "`1 false`", correct: false}
      - {text: "`0 false`", correct: false}
    answer: "`1 true` : le nom du programme compte pour un. Le tableau se termine par un pointeur nul."
    check:
      output: "1 true"
  - key: code-usage
    format: code-output
    question: |-
      Le programme est lancé sans argument.
      ```cpp
      #include <print>

      int main(int argc, char* argv[]) {
          if (argc != 3) {
              std::println("usage : copier <source> <cible>");
          } else {
              std::println("{} vers {}", argv[1], argv[2]);
          }
      }
      ```
    choices:
      - {text: "`usage : copier <source> <cible>`", correct: true}
      - {text: "`vers`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`usage : copier <source> <cible>` : `argc` vaut 1, pas 3. Le programme explique comment l'appeler, sans toucher à `argv[1]`."
    check:
      output: "usage : copier <source> <cible>"
  - key: code-conversion
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const char* arguments[] = {"somme", "12", "30"};
          const int total = std::stoi(arguments[1]) + std::stoi(arguments[2]);
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`1230`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42` : `std::stoi` convertit chaque chaîne en entier, comme on le fait avec `argv`. Sans conversion, on n'additionnerait pas des nombres."
    check:
      output: "42"
  - key: code-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string_view>

      int main() {
          const char saisie[] = "--aide";
          const char* argument = saisie;
          std::println("{}", std::string_view{argument} == "--aide");
      }
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`--aide`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true` : `std::string_view` compare les caractères. C'est ainsi qu'on compare un élément de `argv` à un texte."
    check:
      output: "true"
  - key: bug-argv-sans-test
    format: bug-fix
    question: |-
      Lancé sans argument, ce programme s'arrête sur une exception `std::logic_error`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main(int argc, char* argv[]) {
          const std::string fichier = argv[1];
          std::println("{}", fichier);
      }
      ```
    choices:
      - {text: "Vérifier `argc >= 2` avant de lire `argv[1]`", correct: true}
      - {text: "Lire `argv[0]` à la place de `argv[1]`", correct: false}
      - {text: "Lire `argv[argc]` à la place de `argv[1]`", correct: false}
      - {text: "Déclarer `fichier` avec `const char*`", correct: false}
    answer: |-
      ```cpp
      if (argc < 2) {
          std::println("usage : {} <fichier>", argv[0]);
          return 1;
      }
      const std::string fichier = argv[1];
      ```
      Sans argument, `argv[1]` est un pointeur nul. En faire une `std::string` est un comportement indéfini, que
      la bibliothèque de GCC signale par une exception.
  - key: bug-comparaison-adresses
    format: bug-fix
    question: |-
      Ce programme devrait afficher `aide`. Il affiche `inconnu`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char saisie[] = "--aide";
          const char* argument = saisie;
          if (argument == "--aide") {
              std::println("aide");
          } else {
              std::println("inconnu");
          }
      }
      ```
    choices:
      - {text: "Comparer `std::string_view{argument} == \"--aide\"`", correct: true}
      - {text: "Comparer `*argument == \"--aide\"`", correct: false}
      - {text: "Comparer `argument = \"--aide\"`", correct: false}
      - {text: "Comparer `&argument == \"--aide\"`", correct: false}
    answer: |-
      ```cpp
      if (std::string_view{argument} == "--aide") {
      ```
      Entre deux `const char*`, `==` compare les adresses : celle du tableau n'est pas celle du littéral.
      `std::string_view` compare les textes.
  - key: bug-addition-de-chaines
    format: bug-fix
    question: |-
      Le compilateur refuse `arguments[1] + arguments[2]` : on ne peut pas additionner deux pointeurs. Le programme
      devrait afficher `5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char* arguments[] = {"somme", "2", "3"};
          std::println("{}", arguments[1] + arguments[2]);
      }
      ```
    choices:
      - {text: "Convertir chaque argument : `std::stoi(arguments[1]) + std::stoi(arguments[2])`", correct: true}
      - {text: "Déréférencer chaque argument : `*arguments[1] + *arguments[2]`", correct: false}
      - {text: "Convertir par un cast : `(int)arguments[1] + (int)arguments[2]`", correct: false}
      - {text: "Additionner les indices : `arguments[1 + 2]`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::stoi(arguments[1]) + std::stoi(arguments[2]));
      ```
      Les arguments sont des chaînes. `*arguments[1]` donnerait le code du caractère `'2'`, soit 50, et non 2.
  - key: bug-boucle-depuis-zero
    format: bug-fix
    question: |-
      Ce programme devrait compter les arguments donnés par l'utilisateur. Lancé sans argument, il affiche `1` au
      lieu de `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main(int argc, char* argv[]) {
          int donnes = 0;
          for (int i = 0; i < argc; ++i) {
              ++donnes;
          }
          std::println("{}", donnes);
      }
      ```
    choices:
      - {text: "Commencer la boucle à `i = 1`", correct: true}
      - {text: "Écrire la condition `i <= argc`", correct: false}
      - {text: "Commencer la boucle à `i = argc`", correct: false}
      - {text: "Écrire la condition `i < argc + 1`", correct: false}
    answer: |-
      ```cpp
      for (int i = 1; i < argc; ++i) {
      ```
      `argv[0]` est le nom du programme. Les arguments de l'utilisateur vont de l'indice 1 à `argc - 1`.
