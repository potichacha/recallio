notion: compiler-executer
lesson: |-
  Un programme C++ se **compile**, puis s'**exécute**. Avec GCC, le compilateur s'appelle `g++` :

  ```bash
  g++ -std=c++23 -Wall -Wextra main.cpp -o bonjour
  ./bonjour
  ```

  - **`-std=c++23`** choisit la norme du langage. Sans cette option, GCC 14 compile en C++17 : `std::print` y serait
    refusé.
  - **`-Wall -Wextra`** activent les avertissements courants : variable inutilisée, comparaison entre signé et non
    signé, `return` oublié... Malgré son nom, `-Wall` ne les active pas tous.
  - **`-o bonjour`** nomme l'exécutable. Sans elle, il s'appelle `a.out`.
  - **`./bonjour`** lance l'exécutable ; le `./` désigne le dossier courant.

  **Erreur ou avertissement.** Une **erreur** arrête la compilation : aucun exécutable n'est produit. Un
  **avertissement** signale un code douteux, mais l'exécutable est produit quand même. `-Werror` transforme les
  avertissements en erreurs : c'est courant en intégration continue.

  **Les étapes.** `g++` enchaîne trois étapes : le **préprocesseur** traite les `#include`, la **compilation** traduit
  chaque fichier source en fichier objet (`.o`), puis l'**édition des liens** assemble les fichiers objets et la
  bibliothèque standard en un exécutable. `-c` s'arrête avant l'édition des liens.

  **D'autres options utiles** : `-O2` optimise le code, `-g` ajoute les informations pour le débogueur.

  **Piège classique** : modifier le code et relancer l'exécutable sans recompiler. C'est l'ancien programme qui
  tourne.

  **En entretien** : « Je compile toujours avec `-Wall -Wextra`, et `-Werror` en intégration continue : un
  avertissement est souvent un bug que le compilateur a vu avant moi. »
tour:
  - title: Compiler, puis exécuter
    text: |-
      Sur ta machine, tu compiles avec `g++`, puis tu lances l'exécutable :

      ```bash
      g++ -std=c++23 -Wall -Wextra main.cpp -o bonjour
      ./bonjour
      ```

      `-std=c++23` choisit la norme, `-Wall -Wextra` activent les avertissements, et `-o` nomme l'exécutable. Ici,
      « Exécuter » fait les deux étapes pour toi, en C++23.

      Le programme ci-dessous affiche la norme avec laquelle il a été compilé : la constante `__cplusplus` vaut
      `202302` en C++23, et `201703` en C++17.

      Essaie : retire le point-virgule d'une ligne, puis exécute. Le compilateur refuse, et te dit où.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              std::println("Norme : {}", __cplusplus);
              std::println("Compilé, puis exécuté.");
          }
      output: |-
        Norme : 202302
        Compilé, puis exécuté.
cards:
  - key: role-de-std
    format: course
    question: À quoi sert l'option `-std=c++23` de `g++` ?
    choices:
      - {text: "À choisir la norme du langage avec laquelle compiler", correct: true}
      - {text: "À activer tous les avertissements du compilateur", correct: false}
      - {text: "À lier le programme à la bibliothèque standard", correct: false}
      - {text: "À optimiser le programme pour la vitesse", correct: false}
    answer: |-
      Elle choisit la norme du langage. Sans elle, GCC 14 compile en C++17 : le code qui utilise des nouveautés de
      C++20 ou de C++23 est refusé.
  - key: role-de-wall
    format: course
    question: Que font les options `-Wall -Wextra` ?
    choices:
      - {text: "Elles transforment chaque avertissement en erreur", correct: false}
      - {text: "Elles activent les avertissements sur le code douteux", correct: true}
      - {text: "Elles corrigent d'elles-mêmes les erreurs courantes", correct: false}
      - {text: "Elles vérifient le programme pendant son exécution", correct: false}
    answer: |-
      Elles activent les avertissements courants : variable inutilisée, comparaison entre signé et non signé, `return`
      oublié. L'exécutable est produit quand même ; c'est `-Werror` qui en fait des erreurs.
  - key: erreur-ou-avertissement
    format: course
    question: Quelle différence entre une erreur et un avertissement du compilateur ?
    choices:
      - {text: "Une erreur empêche de produire l'exécutable, un avertissement non", correct: true}
      - {text: "Une erreur vient du code, un avertissement vient du compilateur", correct: false}
      - {text: "Une erreur apparaît à l'exécution, un avertissement à la compilation", correct: false}
      - {text: "Aucune : ce sont deux mots pour le même message", correct: false}
    answer: |-
      Une erreur arrête la compilation : pas d'exécutable. Un avertissement signale un code valide mais suspect, et
      l'exécutable est produit. Les deux apparaissent à la compilation.
  - key: etapes-de-compilation
    format: course
    question: Dans quel ordre `g++` enchaîne-t-il ses trois étapes ?
    choices:
      - {text: "Préprocesseur, compilation, édition des liens", correct: true}
      - {text: "Compilation, préprocesseur, édition des liens", correct: false}
      - {text: "Édition des liens, compilation, préprocesseur", correct: false}
      - {text: "Préprocesseur, édition des liens, compilation", correct: false}
    answer: |-
      Le préprocesseur traite les `#include`, la compilation traduit chaque fichier source en fichier objet, puis
      l'édition des liens assemble les fichiers objets en un exécutable.
  - key: vf-a-out
    format: true-false
    question: Sous Linux, `g++ main.cpp` sans l'option `-o` produit un exécutable nommé `a.out`.
    truth: true
    answer: "`a.out` est le nom par défaut. `-o bonjour` en choisit un autre."
  - key: vf-avertissement-bloque
    format: true-false
    question: Par défaut, un avertissement empêche `g++` de produire l'exécutable.
    truth: false
    answer: Un avertissement n'arrête pas la compilation. Il faut `-Werror` pour qu'il devienne une erreur.
  - key: vf-wall-tout
    format: true-false
    question: L'option `-Wall` active tous les avertissements de GCC.
    truth: false
    answer: |-
      Malgré son nom, `-Wall` n'active que les avertissements les plus courants. `-Wextra` en ajoute d'autres, et
      certains ne s'activent qu'un par un.
  - key: vf-recompiler
    format: true-false
    question: Après avoir modifié le code source, il faut recompiler pour que l'exécutable change.
    truth: true
    answer: |-
      L'exécutable est le résultat d'une compilation passée. Tant qu'on ne recompile pas, c'est l'ancien programme qui
      tourne.
  - key: qcm-commande-complete
    format: multiple-choice
    question: Quelle commande compile `main.cpp` en C++23 et nomme l'exécutable `bonjour` ?
    choices:
      - {text: "`g++ -std=c++23 main.cpp -o bonjour`", correct: true}
      - {text: "`g++ -std=c++23 bonjour -o main.cpp`", correct: false}
      - {text: "`g++ -c++23 main.cpp bonjour`", correct: false}
      - {text: "`g++ -std=c++23 main.cpp -c bonjour`", correct: false}
    answer: |-
      `-o` est suivi du nom de l'exécutable. Attention à ne pas inverser : `-o main.cpp` écraserait le fichier source.
      `-c` compile sans faire l'édition des liens.
  - key: qcm-lancer
    format: multiple-choice
    question: Sous Linux, comment lances-tu l'exécutable `bonjour` du dossier courant ?
    choices:
      - {text: "`./bonjour`", correct: true}
      - {text: "`g++ bonjour`", correct: false}
      - {text: "`run bonjour`", correct: false}
      - {text: "`bonjour.cpp`", correct: false}
    answer: |-
      `./bonjour` : le `./` désigne le dossier courant, où le shell ne cherche pas les commandes de lui-même. `g++`
      compile, il ne lance rien.
  - key: qcm-werror
    format: multiple-choice
    question: Quelle option transforme les avertissements en erreurs ?
    choices:
      - {text: "`-Werror`", correct: true}
      - {text: "`-Wall`", correct: false}
      - {text: "`-Wextra`", correct: false}
      - {text: "`-O2`", correct: false}
    answer: |-
      `-Werror`. `-Wall` et `-Wextra` activent des avertissements sans bloquer la compilation, et `-O2` demande au
      compilateur d'optimiser le code.
  - key: qcm-edition-des-liens
    format: multiple-choice
    question: Que fait l'édition des liens ?
    choices:
      - {text: "Elle assemble les fichiers objets et les bibliothèques en un exécutable", correct: true}
      - {text: "Elle remplace chaque `#include` par le contenu de son en-tête", correct: false}
      - {text: "Elle traduit un fichier source en fichier objet", correct: false}
      - {text: "Elle vérifie que chaque instruction finit par un point-virgule", correct: false}
    answer: |-
      L'édition des liens réunit les fichiers objets et la bibliothèque standard, et relie chaque appel à la fonction
      qu'il vise. Les `#include` sont l'affaire du préprocesseur ; la traduction en fichier objet, celle de la
      compilation.
  - key: trous-norme
    format: fill-in
    question: |-
      Complète pour compiler avec la norme C++23 :
      ```bash
      g++ -std=___ main.cpp -o bonjour
      ```
    blanks:
      - ["c++23", "c++2b"]
    answer: "`-std=c++23` choisit la norme C++23."
  - key: trous-sortie
    format: fill-in
    question: |-
      Complète pour que l'exécutable s'appelle `bonjour` :
      ```bash
      g++ -std=c++23 main.cpp ___ bonjour
      ```
    blanks:
      - ["-o"]
    answer: "`-o` (pour *output*) est suivi du nom de l'exécutable."
  - key: trous-avertissements
    format: fill-in
    question: |-
      Complète avec l'option qui accompagne `-Wall` pour activer davantage d'avertissements :
      ```bash
      g++ -std=c++23 -Wall ___ main.cpp -o bonjour
      ```
    blanks:
      - ["-Wextra"]
    answer: "`-Wextra` complète `-Wall` : on les utilise ensemble."
  - key: trous-compilateur
    format: fill-in
    question: |-
      Complète avec le nom du compilateur C++ de GCC :
      ```bash
      ___ -std=c++23 -Wall -Wextra main.cpp -o bonjour
      ```
    blanks:
      - ["g++", "g++-14"]
    answer: "`g++` est le compilateur C++ de GCC ; `gcc` est celui du C."
  - key: situation-println-refuse
    format: scenario
    question: |-
      Un collègue compile avec `g++ main.cpp` et obtient « 'println' is not a member of 'std' », alors que son fichier
      inclut bien `<print>`. Quelle est la cause la plus probable ?
    choices:
      - {text: "Il compile sans `-std=c++23` : `std::println` n'existe pas dans la norme par défaut", correct: true}
      - {text: "Il compile sans `-Wall` : les fonctions récentes demandent les avertissements", correct: false}
      - {text: "Il compile sans `-o` : sans nom d'exécutable, la bibliothèque n'est pas liée", correct: false}
      - {text: "Il compile sans `-O2` : `std::println` n'existe que dans le code optimisé", correct: false}
    answer: |-
      `std::println` date de C++23, et GCC 14 compile par défaut en C++17. Il faut `g++ -std=c++23 main.cpp`.
  - key: situation-avertissements-ignores
    format: scenario
    question: |-
      Ton projet compile avec 200 avertissements que plus personne ne lit. Un bug vient d'un `return` oublié, que l'un
      d'eux signalait. Que proposes-tu ?
    choices:
      - {text: "Retirer `-Wall -Wextra` : les avertissements ne servent à rien si on ne les lit pas", correct: false}
      - {text: "Corriger les avertissements, puis ajouter `-Werror` en intégration continue", correct: true}
      - {text: "Ajouter `-O2` : un code optimisé contient moins d'avertissements", correct: false}
      - {text: "Changer de compilateur : un autre affichera moins d'avertissements", correct: false}
    answer: |-
      Un avertissement utile se perd parmi 200 qu'on ignore. On les corrige (ou on désactive, un par un et en le
      justifiant, ceux qui ne s'appliquent pas), puis `-Werror` en intégration continue empêche qu'il en revienne.
  - key: situation-ancien-executable
    format: scenario
    question: |-
      Tu corriges le texte d'un message dans `main.cpp`, tu lances `./bonjour`, et l'ancien message s'affiche. Que
      s'est-il passé ?
    choices:
      - {text: "Tu n'as pas recompilé : l'exécutable date d'avant la correction", correct: true}
      - {text: "Le système garde en cache le dernier affichage du programme", correct: false}
      - {text: "Le compilateur a refusé la correction sans rien dire", correct: false}
      - {text: "Il faut redémarrer le terminal pour recharger le fichier source", correct: false}
    answer: |-
      L'exécutable ne suit pas le code source : il faut relancer `g++` après chaque modification. C'est ce que les
      outils de build (Make, CMake) font pour toi.
  - key: situation-reference-indefinie
    format: scenario
    question: |-
      Ton programme tient en deux fichiers, `main.cpp` et `calcul.cpp`. `g++ main.cpp -o app` échoue avec « undefined
      reference to `additionner(int, int)` ». Que fais-tu ?
    choices:
      - {text: "Tu ajoutes `-Wall` : la fonction sera trouvée avec les avertissements", correct: false}
      - {text: "Tu compiles les deux fichiers : `g++ main.cpp calcul.cpp -o app`", correct: true}
      - {text: "Tu ajoutes `#include \"calcul.cpp\"` dans tous les fichiers du projet", correct: false}
      - {text: "Tu renommes la fonction : son nom entre en conflit avec `main`", correct: false}
    answer: |-
      « undefined reference » vient de l'édition des liens : la fonction est déclarée, mais son code n'est dans aucun
      fichier objet. Il faut compiler aussi `calcul.cpp`, qui la définit.
