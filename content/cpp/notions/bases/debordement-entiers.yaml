notion: debordement-entiers
lesson: |-
  Un entier a une plage finie. Un calcul dont le résultat en sort **déborde** (*overflow*). Ce qui se passe alors
  dépend du signe du type.

  | Type | Au débordement |
  |---|---|
  | **non signé** (`unsigned`, `std::uint32_t`) | **défini** : le résultat reboucle, modulo 2ⁿ |
  | **signé** (`int`, `std::int64_t`) | **comportement indéfini** |

  **Non signé.** `std::uint32_t` va de 0 à 4 294 967 295 : ajouter 1 au maximum donne 0, retirer 1 à 0 donne le
  maximum. C'est garanti, et utile pour les sommes de contrôle ou le hachage.

  **Signé.** La norme ne définit rien. Sur ta machine, `INT_MAX + 1` donnera souvent un nombre négatif, mais le
  compilateur a le droit de **supposer que le débordement n'arrive jamais** et d'optimiser en conséquence : un test
  comme `if (a + b < a)` peut être supprimé, une boucle peut ne plus s'arrêter.

  **Où il se cache.**

  - Le milieu d'un intervalle : `(bas + haut) / 2` déborde pour de grands indices. On écrit `bas + (haut - bas) / 2`,
    ou `std::midpoint(bas, haut)` (C++20).
  - Un produit calculé dans le petit type : `std::int64_t octets = giga * 1024 * 1024 * 1024;` multiplie des `int`
    avant de convertir. Il faut qu'un opérande soit déjà en 64 bits.
  - Les petits types sont **promus en `int`** avant le calcul : la somme de deux `std::uint8_t` ne reboucle qu'au
    moment où on la range dans un `std::uint8_t`.

  **S'en protéger.**

  - Choisir un type assez large (`std::int64_t`).
  - **Tester avant** de calculer : `if (b > std::numeric_limits<int>::max() - a)`, jamais après.
  - Compiler les tests avec **`-fsanitize=undefined`** (UBSan), qui signale le débordement à l'exécution.

  **En entretien** : « Le débordement d'un non signé reboucle, celui d'un signé est un comportement indéfini. Je le
  teste avant le calcul, et je fais tourner les tests avec UBSan. »
cards:
  - key: signe-ou-non-signe
    format: course
    question: Que dit la norme du débordement d'un entier signé, comme un `int` ?
    choices:
      - {text: "C'est un comportement indéfini", correct: true}
      - {text: "Le résultat reboucle vers la plus petite valeur", correct: false}
      - {text: "Le résultat reste bloqué à la plus grande valeur", correct: false}
      - {text: "Une exception `std::overflow_error` est levée", correct: false}
    answer: |-
      Un comportement indéfini. Seuls les non signés rebouclent de façon garantie. Sur une machine courante, un `int`
      qui déborde donne souvent un nombre négatif, mais rien ne l'assure.
  - key: optimisation
    format: course
    question: Pourquoi un test comme `if (a + b < a)` peut-il disparaître du programme compilé, pour deux `int` positifs ?
    choices:
      - {text: "Le compilateur suppose qu'un entier signé ne déborde jamais", correct: true}
      - {text: "Le compilateur supprime tous les tests qui utilisent `<`", correct: false}
      - {text: "Le compilateur calcule `a + b` en 64 bits, sans débordement", correct: false}
      - {text: "Le compilateur remplace le test par une exception", correct: false}
    answer: |-
      Le débordement signé étant indéfini, le compilateur raisonne comme s'il n'arrivait pas : `a + b < a` est alors
      toujours faux pour `b` positif, et le test est supprimé. Il faut tester avant de calculer.
  - key: milieu
    format: course
    question: "Pourquoi écrit-on `bas + (haut - bas) / 2` plutôt que `(bas + haut) / 2` ?"
    choices:
      - {text: "La somme `bas + haut` peut déborder pour de grandes valeurs", correct: true}
      - {text: "La division entière arrondit mal une somme impaire", correct: false}
      - {text: "La première forme est plus rapide à calculer", correct: false}
      - {text: "La seconde forme ne compile pas pour des `int`", correct: false}
    answer: |-
      Pour deux grands entiers positifs, la somme dépasse le maximum du type, alors que leur différence tient
      toujours. C'est le bug resté des années dans les recherches dichotomiques de plusieurs bibliothèques.
      `std::midpoint` (C++20) fait ce calcul sans débordement.
  - key: promotion-avant-calcul
    format: course
    question: "Avec deux `std::uint8_t` qui valent 200 et 100, que vaut l'expression `a + b` ?"
    choices:
      - {text: "300 : les deux sont promus en `int` avant l'addition", correct: true}
      - {text: "44 : la somme reboucle dans un `std::uint8_t`", correct: false}
      - {text: "255 : la somme est plafonnée au maximum du type", correct: false}
      - {text: "Rien de défini : c'est un débordement", correct: false}
    answer: |-
      300. Les types plus petits qu'un `int` sont promus en `int` avant tout calcul. La somme ne reboucle (à 44) que
      si on la range ensuite dans un `std::uint8_t`.
  - key: vf-exception
    format: true-false
    question: Le débordement d'un `int` lève une exception.
    truth: false
    answer: C++ ne vérifie pas les calculs entiers. Le débordement d'un entier signé est un comportement indéfini.
  - key: vf-compilateur-suppose
    format: true-false
    question: Le compilateur a le droit de supposer qu'un calcul sur des entiers signés ne déborde pas.
    truth: true
    answer: Comme le débordement signé est indéfini, l'optimiseur raisonne comme s'il n'existait pas.
  - key: vf-uint32-max-plus-un
    format: true-false
    question: "Ajouter 1 à la plus grande valeur d'un `std::uint32_t` donne 0."
    truth: true
    answer: "L'arithmétique des non signés est modulo 2³² : le résultat reboucle à zéro."
  - key: vf-int-max-plus-un
    format: true-false
    question: La norme garantit qu'ajouter 1 à la plus grande valeur d'un `int` donne la plus petite.
    truth: false
    answer: "C'est ce qu'on observe souvent, mais la norme ne garantit rien : c'est un comportement indéfini."
  - key: qcm-sanitizer
    format: multiple-choice
    question: Quelle option de compilation fait signaler un débordement signé pendant l'exécution ?
    choices:
      - {text: "`-fsanitize=undefined`", correct: true}
      - {text: "`-Wall`", correct: false}
      - {text: "`-O2`", correct: false}
      - {text: "`-std=c++23`", correct: false}
    answer: "`-fsanitize=undefined` active UBSan, qui instrumente le programme et signale les comportements indéfinis quand ils se produisent. `-Wall` ne voit que ce qui est visible à la compilation."
  - key: qcm-midpoint
    format: multiple-choice
    question: Quelle fonction de C++20 calcule le milieu de deux entiers sans débordement ?
    choices:
      - {text: "`std::midpoint`", correct: true}
      - {text: "`std::average`", correct: false}
      - {text: "`std::clamp`", correct: false}
      - {text: "`std::lerp`", correct: false}
    answer: "`std::midpoint(a, b)`, dans `<numeric>`. `std::clamp` borne une valeur, `std::lerp` interpole entre deux flottants, et `std::average` n'existe pas."
  - key: qcm-tester-avant
    format: multiple-choice
    question: "Comment vérifier que `a + b` ne débordera pas, pour deux `int` positifs ?"
    choices:
      - {text: "`b <= std::numeric_limits<int>::max() - a`, avant l'addition", correct: true}
      - {text: "`a + b >= a`, juste après l'addition", correct: false}
      - {text: "`a + b <= std::numeric_limits<int>::max()`", correct: false}
      - {text: "`a + b > 0`, juste après l'addition", correct: false}
    answer: |-
      On teste avant, avec un calcul qui ne peut pas déborder : `max - a`. Les trois autres font d'abord l'addition :
      le comportement indéfini a déjà eu lieu, et le compilateur peut supprimer le test.
  - key: qcm-produit-64-bits
    format: multiple-choice
    question: "Avec `int giga = 4;`, quelle expression calcule 4 × 1024³ sans débordement ?"
    choices:
      - {text: "`static_cast<std::int64_t>(giga) * 1024 * 1024 * 1024`", correct: true}
      - {text: "`static_cast<std::int64_t>(giga * 1024 * 1024 * 1024)`", correct: false}
      - {text: "`giga * 1024 * 1024 * 1024`, rangé dans un `std::int64_t`", correct: false}
      - {text: "`giga * (1024 * 1024 * 1024)`, avec des parenthèses", correct: false}
    answer: |-
      Le premier opérande doit déjà être en 64 bits : toute la multiplication se fait alors en 64 bits. Dans les
      autres cas, le produit est calculé entre `int`, et déborde avant d'être converti.
  - key: code-uint32-reboucle
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <limits>
      #include <print>

      int main() {
          std::uint32_t x = std::numeric_limits<std::uint32_t>::max();
          x += 1;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`4294967296`", correct: false}
      - {text: "`4294967295`", correct: false}
      - {text: "`-1`", correct: false}
    answer: "`0` : un non signé reboucle, modulo 2³². C'est un comportement défini par la norme."
    check:
      output: "0"
  - key: code-int-max-plus-un
    format: code-output
    question: |-
      Que garantit le langage sur ce qu'affiche ce programme ?
      ```cpp
      #include <limits>
      #include <print>

      int main() {
          int x = std::numeric_limits<int>::max();
          x += 1;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "Rien : c'est un comportement indéfini", correct: true}
      - {text: "Qu'il affiche `-2147483648`", correct: false}
      - {text: "Qu'il affiche `2147483647`", correct: false}
      - {text: "Qu'il affiche `0`", correct: false}
    answer: |-
      Rien. Le débordement d'un entier signé est un comportement indéfini. Le programme affiche souvent
      `-2147483648`, mais le compilateur n'y est pas tenu.
    unverifiable: le débordement d'un entier signé est un comportement indéfini
  - key: code-produit-64-bits
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::int32_t cote = 100'000;
          std::int64_t aire = static_cast<std::int64_t>(cote) * cote;
          std::println("{}", aire);
      }
      ```
    choices:
      - {text: "`10000000000`", correct: true}
      - {text: "`1410065408`", correct: false}
      - {text: "`100000`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`10000000000` : le cast rend le premier opérande 64 bits, et le produit se calcule en 64 bits. Sans lui, `cote * cote` déborderait en 32 bits avant d'être converti."
    check:
      output: "10000000000"
  - key: code-promotion-uint8
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::uint8_t a = 200;
          std::uint8_t b = 100;
          std::uint8_t c = a + b;
          std::println("{} {}", a + b, c);
      }
      ```
    choices:
      - {text: "`300 44`", correct: true}
      - {text: "`44 44`", correct: false}
      - {text: "`300 300`", correct: false}
      - {text: "`300 255`", correct: false}
    answer: "`300 44` : `a + b` est calculé en `int`, après promotion, et vaut 300. Rangé dans un `std::uint8_t`, il est réduit modulo 256 : 44."
    check:
      output: "300 44"
  - key: bug-milieu
    format: bug-fix
    question: |-
      Sur des indices proches de deux milliards, ce calcul du milieu donne un nombre négatif. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          int bas = 2'000'000'000;
          int haut = 2'100'000'000;
          int milieu = (bas + haut) / 2;
          std::println("{}", milieu);
      }
      ```
    choices:
      - {text: "Écrire `bas + (haut - bas) / 2`", correct: true}
      - {text: "Écrire `(haut + bas) / 2`", correct: false}
      - {text: "Écrire `bas / 2 + haut`", correct: false}
      - {text: "Écrire `(bas + haut) / 2.0`", correct: false}
    answer: |-
      ```cpp
      int milieu = bas + (haut - bas) / 2;
      ```
      `bas + haut` dépasse le maximum d'un `int`. La différence `haut - bas`, elle, tient toujours. Diviser par `2.0`
      ne change rien : la somme a déjà débordé.
  - key: bug-produit-en-int
    format: bug-fix
    question: |-
      Ce programme devrait afficher `4294967296`, le nombre d'octets de 4 Gio, et affiche autre chose. Pourquoi ?
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          int giga = 4;
          std::int64_t octets = giga * 1024 * 1024 * 1024;
          std::println("{}", octets);
      }
      ```
    choices:
      - {text: "Le produit est calculé entre `int`, et déborde avant d'être converti", correct: true}
      - {text: "Un `std::int64_t` ne peut pas contenir plus de 4 milliards", correct: false}
      - {text: "`std::println` ne sait pas afficher un entier de 64 bits", correct: false}
      - {text: "On ne peut pas enchaîner plus de deux multiplications", correct: false}
    answer: |-
      ```cpp
      std::int64_t octets = static_cast<std::int64_t>(giga) * 1024 * 1024 * 1024;
      ```
      Le type d'un calcul vient de ses opérandes, pas de la variable qui reçoit le résultat. Il faut qu'un opérande
      soit en 64 bits dès le départ.
  - key: bug-test-apres-coup
    format: bug-fix
    question: |-
      Ce test de débordement fonctionne sans optimisation, et ne se déclenche plus avec `-O2`. Quelle correction est la
      bonne ?
      ```cpp
      #include <limits>
      #include <print>

      int main() {
          int a = std::numeric_limits<int>::max();
          int b = 1;
          if (a + b < a) {
              std::println("Débordement");
          }
      }
      ```
    choices:
      - {text: "Tester avant : `b > std::numeric_limits<int>::max() - a`", correct: true}
      - {text: "Tester après, autrement : `a + b <= a`", correct: false}
      - {text: "Tester après, autrement : `(a + b) - b != a`", correct: false}
      - {text: "Tester après, autrement : `a + b < 0`", correct: false}
    answer: |-
      ```cpp
      if (b > std::numeric_limits<int>::max() - a) {
      ```
      `a + b` a déjà débordé quand le test s'exécute : c'est un comportement indéfini, et l'optimiseur a le droit de
      supprimer le test. On vérifie avant, avec une soustraction qui ne déborde pas.
  - key: bug-factorielle
    format: bug-fix
    question: |-
      Ce programme devrait afficher `6227020800`, la factorielle de 13, et affiche un nombre faux. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int resultat = 1;
          for (int i = 2; i <= 13; ++i) {
              resultat *= i;
          }
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Déclarer `resultat` avec le type `std::int64_t`", correct: true}
      - {text: "Déclarer `resultat` avec le type `unsigned int`", correct: false}
      - {text: "Déclarer `i` avec le type `std::int64_t`", correct: false}
      - {text: "Écrire `resultat = resultat * i;` dans la boucle", correct: false}
    answer: |-
      ```cpp
      std::int64_t resultat = 1;
      ```
      La factorielle de 13 dépasse les 2,1 milliards d'un `int` de 32 bits. Un `unsigned int` ne suffit pas non plus
      (4,2 milliards) : il faut 64 bits, qui tiennent jusqu'à la factorielle de 20.
  - key: situation-chronometre
    format: scenario
    question: |-
      Un serveur compte les millisecondes écoulées depuis son démarrage dans un `std::int32_t`. Au bout de 25 jours,
      les durées deviennent négatives. Que proposes-tu ?
    choices:
      - {text: "Passer le compteur en `std::int64_t`", correct: true}
      - {text: "Redémarrer le serveur tous les 24 jours", correct: false}
      - {text: "Compter en microsecondes, plus précises", correct: false}
      - {text: "Passer le compteur en `std::int16_t`", correct: false}
    answer: |-
      2³¹ millisecondes font environ 24,8 jours : le compteur déborde. En 64 bits, il tient des centaines de millions
      d'années. Redémarrer cache le problème ; compter en microsecondes le ferait déborder mille fois plus tôt.
  - key: situation-collegue-java
    format: scenario
    question: |-
      Un collègue qui vient de Java t'assure qu'un `int` qui déborde « reboucle simplement vers les négatifs, comme
      partout ». Que lui réponds-tu ?
    choices:
      - {text: "Qu'en C++ c'est un comportement indéfini, sur lequel l'optimiseur s'appuie", correct: true}
      - {text: "Qu'il a raison : C++ garantit le même rebouclage que Java", correct: false}
      - {text: "Qu'en C++ le débordement d'un `int` lève une exception", correct: false}
      - {text: "Qu'en C++ un `int` ne déborde pas : il s'agrandit seul", correct: false}
    answer: |-
      Java définit le rebouclage des entiers signés ; C++ non. Le code peut reboucler aujourd'hui et se comporter
      autrement après une mise à jour du compilateur ou un changement d'options, parce que l'optimiseur suppose que
      le débordement n'arrive pas.
  - key: situation-detecter-en-ci
    format: scenario
    question: |-
      Ton équipe veut détecter les débordements d'entiers signés avant la production. Que mets-tu en place ?
    choices:
      - {text: "Les tests compilés avec `-fsanitize=undefined`, en intégration continue", correct: true}
      - {text: "La production compilée sans optimisation, pour garder le rebouclage", correct: false}
      - {text: "Un `try` et un `catch` autour de chaque calcul sensible", correct: false}
      - {text: "Tous les `int` du projet remplacés par des `unsigned int`", correct: false}
    answer: |-
      UBSan signale chaque débordement signé à l'exécution, avec le fichier et la ligne : en intégration continue, les
      tests le déclenchent avant la production. Aucune exception n'est levée par un débordement, et passer au non
      signé remplace un bug par un autre.
  - key: situation-non-signe-pour-eviter
    format: scenario
    question: |-
      Pour « éviter le comportement indéfini », un collègue passe en `unsigned int` le solde d'un compte, qui peut
      être débiteur. Qu'en penses-tu ?
    choices:
      - {text: "C'est une erreur : un solde négatif deviendrait un nombre énorme", correct: true}
      - {text: "C'est une bonne idée : le solde ne pourra plus déborder", correct: false}
      - {text: "C'est une bonne idée : un non signé est plus rapide", correct: false}
      - {text: "C'est sans effet : les deux types se comportent pareil", correct: false}
    answer: |-
      Le rebouclage d'un non signé est défini, mais il n'est pas juste pour autant : 3 - 5 donne plus de 4 milliards.
      Une valeur qui peut être négative reste dans un type signé, assez large, et on teste les bornes avant le
      calcul.
