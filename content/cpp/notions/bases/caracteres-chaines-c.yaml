notion: caracteres-chaines-c
lesson: |-
  Un `char` contient **un caractère**, sous la forme d'un petit entier : son **code**. Un littéral de caractère
  s'écrit entre **apostrophes**.

  ```cpp
  char lettre = 'A';       // le code 65
  char chiffre = '7';      // le code 55, pas le nombre 7
  ```

  **Un `char` est un entier.** On peut calculer avec, et le convertir.

  ```cpp
  char suivante = 'A' + 1;                    // 'B'
  int valeur = '7' - '0';                     // 7 : la valeur du chiffre
  int code = static_cast<int>('A');           // 65
  ```

  Dans la table ASCII, les chiffres, les majuscules et les minuscules se suivent : `'0'` à `'9'`, `'A'` à `'Z'`,
  `'a'` à `'z'`.

  **Les séquences d'échappement** écrivent les caractères spéciaux :

  | Séquence | Caractère |
  |---|---|
  | `'\n'` | retour à la ligne |
  | `'\t'` | tabulation |
  | `'\\'` | barre oblique inverse |
  | `'\''`, `'\"'` | apostrophe, guillemet |
  | `'\0'` | le caractère nul, de code 0 |

  **Apostrophes ou guillemets ?** `'a'` est **un caractère** (`char`). `"a"` est une **chaîne** : un tableau de
  deux caractères, `'a'` puis `'\0'`.

  **Les chaînes de style C.** Héritées du C, ce sont des tableaux de `char` **terminés par `'\0'`**. Un littéral
  entre guillemets en est une, de type `const char[]`, que l'on manipule par un `const char*`.

  ```cpp
  const char* salut = "abc";      // quatre caractères en mémoire : 'a', 'b', 'c', '\0'
  ```

  La chaîne ne connaît pas sa longueur : `std::strlen` (de `<cstring>`) la **compte**, en avançant jusqu'au `'\0'`.

  **Leurs pièges.**

  - `==` compare les **adresses**, pas les textes : il faut `std::strcmp`.
  - `+` ne concatène pas deux chaînes C.
  - Sans `'\0'` final, toute fonction lit au-delà du tableau : comportement indéfini.
  - Un tableau trop petit déborde, sans avertissement.

  **En C++, on prend `std::string`.** Elle connaît sa taille, se compare avec `==`, se concatène avec `+`, et gère
  sa mémoire. Un littéral se convertit tout seul : `std::string nom = "Ada";`. Pour passer une `std::string` à une
  fonction du C, `nom.c_str()` rend un `const char*`.

  On ne rencontre plus les chaînes C qu'aux frontières : les arguments de `main`, les bibliothèques du C, et les
  littéraux eux-mêmes.

  **En entretien** : « Un `char` est un petit entier, écrit entre apostrophes ; une chaîne entre guillemets est un
  tableau de `char` terminé par `'\0'`. Les chaînes C se comparent avec `strcmp`, pas `==`, et ne connaissent pas
  leur taille : en C++, j'utilise `std::string`. »
tour:
  - title: Un caractère est un nombre
    text: |-
      Un `char` range un caractère sous la forme de son code : un petit entier. On l'écrit entre apostrophes :
      `'A'`. Entre guillemets, `"A"` est une chaîne, pas un caractère.

      Puisqu'un `char` est un entier, on peut calculer avec : `'A' + 1` donne `'B'`, et `'7' - '0'` donne le
      nombre 7.

      Essaie : remplace `'A'` par `'a'`, puis exécute. Les minuscules ont d'autres codes, mais elles se suivent
      aussi.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              char lettre = 'A';
              char suivante = lettre + 1;
              int code = lettre;
              int valeur = '7' - '0';

              std::println("{} {} {}", lettre, suivante, code);
              std::println("{}", valeur + 1);
          }
      output: |-
        A B 65
        8
    task:
      instructions: |-
        Le programme affiche la lettre `c` en minuscule. Les majuscules sont rangées 32 codes avant les minuscules :
        affiche `C`, en calculant la majuscule à partir de `lettre`, sans écrire `'C'`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              char lettre = 'c';
              char majuscule = lettre;
              std::println("{}", majuscule);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              char lettre = 'c';
              char majuscule = lettre - 'a' + 'A';
              std::println("{}", majuscule);
          }
      output: "C"
cards:
  - key: char-entier
    format: course
    question: "Que contient réellement une variable de type `char` ?"
    choices:
      - {text: "Un petit entier : le code du caractère", correct: true}
      - {text: "Un pointeur vers le dessin du caractère", correct: false}
      - {text: "Une chaîne d'un seul caractère, avec son `'\\0'`", correct: false}
      - {text: "Un booléen qui dit si le caractère est affichable", correct: false}
    answer: "`'A'` est le nombre 65 en ASCII. C'est pourquoi on peut additionner, soustraire et comparer des caractères."
  - key: apostrophes-guillemets
    format: course
    question: "Quelle différence entre `'a'` et `\"a\"` ?"
    choices:
      - {text: "`'a'` est un caractère ; `\"a\"` est une chaîne de deux caractères, `'a'` et `'\\0'`", correct: true}
      - {text: "`'a'` est une chaîne de deux caractères ; `\"a\"` est un caractère seul", correct: false}
      - {text: "Aucune : les apostrophes et les guillemets sont interchangeables en C++", correct: false}
      - {text: "`'a'` est constant ; `\"a\"` peut être modifié à l'exécution", correct: false}
    answer: "Les apostrophes entourent un `char`. Les guillemets entourent un tableau de `char`, auquel le compilateur ajoute un caractère nul final."
  - key: fin-de-chaine
    format: course
    question: "Comment une chaîne de style C marque-t-elle sa fin ?"
    choices:
      - {text: "Par un caractère nul, `'\\0'`, placé après le dernier caractère", correct: true}
      - {text: "Par sa longueur, rangée dans les quatre premiers octets", correct: false}
      - {text: "Par un retour à la ligne, `'\\n'`, placé après le dernier caractère", correct: false}
      - {text: "Par rien : sa longueur est connue du compilateur seulement", correct: false}
    answer: "La chaîne ne connaît pas sa taille : `std::strlen` avance jusqu'au `'\\0'` pour la compter. Sans lui, la lecture continue au-delà du tableau."
  - key: comparer-chaines-c
    format: course
    question: "Que compare `a == b` quand `a` et `b` sont deux `const char*` ?"
    choices:
      - {text: "Leurs adresses, pas les textes qu'ils désignent", correct: true}
      - {text: "Leurs textes, caractère par caractère", correct: false}
      - {text: "Leurs longueurs, comptées jusqu'au `'\\0'`", correct: false}
      - {text: "Leurs premiers caractères seulement", correct: false}
    answer: "Ce sont deux pointeurs : `==` dit s'ils désignent le même endroit. Pour comparer les textes : `std::strcmp(a, b) == 0`, ou mieux, des `std::string`."
  - key: vf-chiffre
    format: true-false
    question: "Le caractère `'7'` et l'entier `7` ont la même valeur."
    truth: false
    answer: "`'7'` vaut 55 en ASCII. La valeur du chiffre s'obtient par `'7' - '0'`."
  - key: vf-taille-litteral
    format: true-false
    question: "Le littéral `\"abc\"` occupe quatre caractères en mémoire."
    truth: true
    answer: "Les trois lettres, puis le caractère nul qui termine la chaîne."
  - key: vf-plus
    format: true-false
    question: "L'opérateur `+` concatène deux littéraux de chaîne : `\"ab\" + \"cd\"` donne `\"abcd\"`."
    truth: false
    answer: "Ce sont deux tableaux de `char` : l'addition ne compile pas. Avec une `std::string` d'un côté, la concaténation fonctionne."
  - key: vf-string
    format: true-false
    question: "Une `std::string` peut être initialisée avec un littéral entre guillemets."
    truth: true
    answer: "`std::string nom = \"Ada\";` copie les caractères du littéral dans la chaîne."
  - key: qcm-retour-ligne
    format: multiple-choice
    question: Quelle séquence d'échappement représente un retour à la ligne ?
    choices:
      - {text: "`'\\n'`", correct: true}
      - {text: "`'\\t'`", correct: false}
      - {text: "`'\\0'`", correct: false}
      - {text: "`'\\r\\n'`", correct: false}
    answer: "`'\\n'`. `'\\t'` est une tabulation, `'\\0'` le caractère nul. Un littéral de caractère n'en contient qu'un."
  - key: qcm-valeur-chiffre
    format: multiple-choice
    question: "`c` est un `char` qui contient un chiffre, de `'0'` à `'9'`. Quelle expression donne sa valeur entière ?"
    choices:
      - {text: "`c - '0'`", correct: true}
      - {text: "`c - 0`", correct: false}
      - {text: "`static_cast<int>(c)`", correct: false}
      - {text: "`c + '0'`", correct: false}
    answer: "Les chiffres se suivent dans la table : soustraire le code de `'0'` donne 0 à 9. La conversion en `int` donnerait le code, 48 à 57."
  - key: qcm-longueur
    format: multiple-choice
    question: "Quelle fonction donne la longueur d'une chaîne de style C ?"
    choices:
      - {text: "`std::strlen`", correct: true}
      - {text: "`std::size`", correct: false}
      - {text: "`std::strcmp`", correct: false}
      - {text: "`sizeof`", correct: false}
    answer: "`std::strlen`, de `<cstring>`, compte les caractères jusqu'au `'\\0'`. `sizeof` sur un pointeur donne la taille du pointeur."
  - key: qcm-c-str
    format: multiple-choice
    question: "Une fonction du C attend un `const char*`. Comment lui passes-tu la `std::string nom` ?"
    choices:
      - {text: "`nom.c_str()`", correct: true}
      - {text: "`&nom`", correct: false}
      - {text: "`*nom`", correct: false}
      - {text: "`nom.size()`", correct: false}
    answer: "`c_str()` renvoie un pointeur vers les caractères, terminés par `'\\0'`. Il reste valable tant que la chaîne n'est pas modifiée."
  - key: trous-apostrophes
    format: fill-in
    question: |-
      Complète avec la valeur du chiffre contenu dans `c` :
      ```cpp
      char c = '7';
      int valeur = c - ___;
      ```
    blanks:
      - ["'0'"]
    answer: "`'7' - '0'` vaut 7 : les chiffres ont des codes consécutifs."
  - key: trous-strlen
    format: fill-in
    question: |-
      Complète pour compter les caractères de la chaîne C :
      ```cpp
      const char* mot = "bonjour";
      std::println("{}", std::___(mot));
      ```
    blanks:
      - [strlen]
    answer: "`std::strlen` compte jusqu'au caractère nul : 7."
  - key: trous-nul
    format: fill-in
    question: |-
      Complète avec le caractère qui termine une chaîne de style C :
      ```cpp
      char mot[4] = {'a', 'b', 'c', '___'};
      ```
    blanks:
      - ["\\0"]
    answer: "Le caractère nul, `'\\0'`, de code 0."
  - key: trous-c-str
    format: fill-in
    question: |-
      Complète pour passer la `std::string` à une fonction qui attend un `const char*` :
      ```cpp
      std::string nom = "Ada";
      std::puts(nom.___());
      ```
    blanks:
      - [c_str]
    answer: "`c_str()` donne accès aux caractères sous la forme d'une chaîne C."
  - key: code-arithmetique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          char c = 'a';
          c += 2;
          int ecart = 'e' - 'a';
          std::println("{} {}", c, ecart);
      }
      ```
    choices:
      - {text: "`c 4`", correct: true}
      - {text: "`a2 4`", correct: false}
      - {text: "`99 4`", correct: false}
      - {text: "`c 5`", correct: false}
    answer: "`c 4` : ajouter 2 au code de `'a'` donne `'c'`. La différence de deux `char` est un entier : quatre lettres séparent `a` de `e`."
    check:
      output: "c 4"
  - key: code-chiffre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          char chiffre = '5';
          int code = chiffre;
          int valeur = chiffre - '0';
          std::println("{} {} {}", chiffre, code, valeur);
      }
      ```
    choices:
      - {text: "`5 53 5`", correct: true}
      - {text: "`5 5 5`", correct: false}
      - {text: "`53 53 5`", correct: false}
      - {text: "`5 53 53`", correct: false}
    answer: "`5 53 5` : un `char` s'affiche comme un caractère. Converti en `int`, il donne son code, 53. Soustraire `'0'` donne la valeur du chiffre."
    check:
      output: "5 53 5"
  - key: code-strlen
    format: code-output
    question: |-
      ```cpp
      #include <cstring>
      #include <print>

      int main() {
          const char mot[] = "abc";
          std::println("{} {}", std::strlen(mot), sizeof(mot));
      }
      ```
    choices:
      - {text: "`3 4`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`3 8`", correct: false}
    answer: "`3 4` : `strlen` compte les lettres. `sizeof` donne la taille du tableau, qui contient aussi le caractère nul final."
    check:
      output: "3 4"
  - key: code-string-compare
    format: code-output
    question: |-
      ```cpp
      #include <cstring>
      #include <print>
      #include <string>

      int main() {
          const std::string a = "chat";
          const std::string b = "chat";
          std::println("{} {}", a == b, std::strcmp(a.c_str(), "chien") == 0);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : deux `std::string` se comparent par leur contenu avec `==`. `strcmp` renvoie 0 pour deux textes égaux ; `chat` et `chien` diffèrent."
    check:
      output: "true false"
  - key: bug-guillemets-char
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'const char*' to 'char' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          char initiale = "A";
          std::println("{}", initiale);
      }
      ```
    choices:
      - {text: "Écrire `char initiale = 'A';`, entre apostrophes", correct: true}
      - {text: "Écrire `char initiale = A;`, sans rien autour", correct: false}
      - {text: "Écrire `char initiale = \"A\"[1];`, avec un indice", correct: false}
      - {text: "Écrire `char initiale = (char)\"A\";`, avec un cast", correct: false}
    answer: |-
      ```cpp
      char initiale = 'A';
      ```
      `"A"` est une chaîne : un tableau de deux caractères. Un caractère seul s'écrit entre apostrophes.
  - key: bug-comparaison-adresses
    format: bug-fix
    question: |-
      Ce programme devrait afficher `identiques`. Il affiche `différents`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char saisie[] = "oui";
          const char* attendu = "oui";
          if (saisie == attendu) {
              std::println("identiques");
          } else {
              std::println("différents");
          }
      }
      ```
    choices:
      - {text: "Comparer deux `std::string`, construites à partir des deux textes", correct: true}
      - {text: "Comparer `*saisie == *attendu`, en déréférençant les deux", correct: false}
      - {text: "Comparer `&saisie == &attendu`, en prenant les deux adresses", correct: false}
      - {text: "Comparer `saisie = attendu`, avec un seul signe égal", correct: false}
    answer: |-
      ```cpp
      if (std::string{saisie} == std::string{attendu}) {
      ```
      `==` compare les adresses des deux tableaux, qui sont différentes. `*saisie == *attendu` ne comparerait que
      le premier caractère. Avec des `std::string`, `==` compare les textes ; en C, c'est `std::strcmp`.
  - key: bug-chiffre-code
    format: bug-fix
    question: |-
      Ce programme devrait afficher `8` : le chiffre lu, plus un. Il affiche `56`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          char chiffre = '7';
          int valeur = chiffre;
          std::println("{}", valeur + 1);
      }
      ```
    choices:
      - {text: "Écrire `int valeur = chiffre - '0';`", correct: true}
      - {text: "Écrire `int valeur = chiffre - 0;`", correct: false}
      - {text: "Écrire `int valeur = static_cast<int>(chiffre);`", correct: false}
      - {text: "Écrire `int valeur = chiffre + '0';`", correct: false}
    answer: |-
      ```cpp
      int valeur = chiffre - '0';
      ```
      Convertir un `char` en `int` donne son code : 55 pour `'7'`. La valeur du chiffre est l'écart avec le code
      de `'0'`.
  - key: bug-concatenation
    format: bug-fix
    question: |-
      Le compilateur répond « invalid operands of types 'const char [8]' and 'const char [4]' to binary
      'operator+' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string message = "Bonjour" + "Ada";
          std::println("{}", message);
      }
      ```
    choices:
      - {text: "Écrire `std::string{\"Bonjour\"} + \"Ada\"`", correct: true}
      - {text: "Écrire `\"Bonjour\" & \"Ada\"`", correct: false}
      - {text: "Écrire `\"Bonjour\" . \"Ada\"`", correct: false}
      - {text: "Écrire `(\"Bonjour\" + \"Ada\")`", correct: false}
    answer: |-
      ```cpp
      std::string message = std::string{"Bonjour"} + "Ada";
      ```
      Deux littéraux sont deux tableaux de `char`, qui ne s'additionnent pas. Dès qu'un des deux côtés est une
      `std::string`, `+` concatène.
