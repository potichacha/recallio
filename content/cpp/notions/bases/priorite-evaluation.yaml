notion: priorite-evaluation
lesson: |-
  Deux règles différentes gouvernent une expression, et on les confond souvent.

  - La **priorité** et l'**associativité** disent comment l'expression est **regroupée** : où se placent les
    parenthèses invisibles.
  - L'**ordre d'évaluation** dit dans quel **ordre** les opérandes sont **calculés**.

  **La priorité.** Du plus prioritaire au moins prioritaire, pour les opérateurs courants :

  | Rang | Opérateurs |
  |---|---|
  | 1 | `a++`, `a--`, `f()`, `a[i]`, `a.b`, `a->b` |
  | 2 | `++a`, `--a`, `!a`, `~a`, `-a`, `*p`, `&a` |
  | 3 | `*`, `/`, `%` |
  | 4 | `+`, `-` |
  | 5 | `<<`, `>>` |
  | 6 | `<`, `<=`, `>`, `>=` |
  | 7 | `==`, `!=` |
  | 8 | `&`, puis `^`, puis `\|` |
  | 9 | `&&`, puis `\|\|` |
  | 10 | `?:`, `=`, `+=`, `-=`... |
  | 11 | `,` |

  Ce qu'il faut en retenir :

  - `*` et `/` avant `+` et `-`, comme en mathématiques : `2 + 3 * 4` vaut 14.
  - Les **comparaisons avant les opérateurs logiques** : `a < b && c < d` se lit comme on le pense.
  - `&&` avant `||` : `a || b && c` se lit `a || (b && c)`.
  - Les opérateurs **bit à bit après les comparaisons** : `x & 1 == 0` se lit `x & (1 == 0)`. C'est un piège.
  - L'**affectation en dernier** : `x = a + b` calcule la somme d'abord.

  **L'associativité** tranche entre opérateurs de même priorité. La plupart se regroupent **de gauche à droite** :
  `10 - 4 - 3` vaut `(10 - 4) - 3`, soit 3. L'affectation se regroupe **de droite à gauche** : `a = b = 5` affecte
  5 à `b`, puis à `a`.

  **Dans le doute, des parenthèses.** Elles ne coûtent rien, et le lecteur n'a pas à connaître le tableau.

  **L'ordre d'évaluation.** La priorité ne dit **pas** quel opérande est calculé en premier. Dans `f() + g() * h()`,
  la multiplication est regroupée d'abord, mais rien n'oblige `g()` à être appelée avant `f()`. Cet ordre est
  **non spécifié** : le compilateur choisit.

  Quelques opérateurs **garantissent** l'ordre, de gauche à droite :

  - `a && b` et `a || b`, avec court-circuit ;
  - `a ? b : c` : la condition d'abord ;
  - `a, b` ;
  - depuis C++17 : `a << b`, `a >> b`, `a = b` (le côté droit d'abord), et `a.b`, `a[b]`.

  Les **arguments d'une fonction**, eux, sont évalués dans un ordre **non spécifié**.

  **Les pièges.**

  ```cpp
  f(i, ++i);          // quel i reçoit f ? L'ordre des arguments n'est pas fixé
  i = i++ + ++i;      // comportement indéfini : deux modifications de i sans ordre
  v[i] = i++;         // défini depuis C++17, mais illisible
  ```

  La règle : **ne pas modifier une variable et la relire dans la même expression**. Une instruction par effet.

  **En entretien** : « La priorité regroupe, elle n'ordonne pas. `f() + g()` peut appeler `g` avant `f`, et l'ordre
  des arguments d'une fonction n'est pas spécifié. Seuls `&&`, `||`, `?:`, la virgule, et quelques opérateurs
  depuis C++17 fixent l'ordre. Je mets des parenthèses, et un seul effet par instruction. »
cards:
  - key: priorite-ou-ordre
    format: course
    question: "Quelle différence entre la priorité des opérateurs et l'ordre d'évaluation ?"
    choices:
      - {text: "La priorité regroupe les opérandes ; l'ordre d'évaluation dit lequel est calculé d'abord", correct: true}
      - {text: "La priorité dit lequel est calculé d'abord ; l'ordre d'évaluation regroupe les opérandes", correct: false}
      - {text: "La priorité vaut pour les entiers ; l'ordre d'évaluation vaut pour les flottants", correct: false}
      - {text: "Aucune : un opérateur prioritaire voit toujours ses opérandes calculés en premier", correct: false}
    answer: "Dans `f() + g() * h()`, la priorité regroupe `g() * h()`. Mais `f()` peut très bien être appelée avant, pendant ou après."
  - key: arguments
    format: course
    question: "Dans quel ordre les arguments de `f(a(), b())` sont-ils évalués ?"
    choices:
      - {text: "Dans un ordre non spécifié : le compilateur choisit", correct: true}
      - {text: "De gauche à droite, toujours", correct: false}
      - {text: "De droite à gauche, toujours", correct: false}
      - {text: "En même temps, dans deux threads", correct: false}
    answer: "Le programme reste valide, mais ne doit pas dépendre de cet ordre. GCC évalue souvent de droite à gauche, d'autres compilateurs de gauche à droite."
  - key: associativite
    format: course
    question: "Comment se regroupe `a = b = 5` ?"
    choices:
      - {text: "De droite à gauche : `a = (b = 5)`", correct: true}
      - {text: "De gauche à droite : `(a = b) = 5`", correct: false}
      - {text: "Pas du tout : deux affectations sur une ligne sont interdites", correct: false}
      - {text: "Selon le compilateur : l'ordre n'est pas spécifié", correct: false}
    answer: "L'affectation est associative à droite. `b` reçoit 5, puis `a` reçoit la valeur de `b`."
  - key: ordre-garanti
    format: course
    question: "Quel opérateur garantit que son opérande de gauche est évalué avant celui de droite ?"
    choices:
      - {text: "`&&`", correct: true}
      - {text: "`+`", correct: false}
      - {text: "`*`", correct: false}
      - {text: "`==`", correct: false}
    answer: "`&&` et `||` évaluent la gauche d'abord, et la droite seulement si c'est nécessaire. Les opérateurs arithmétiques et de comparaison ne fixent aucun ordre."
  - key: vf-multiplication
    format: true-false
    question: "`20 - 2 * 3 + 1` vaut 15."
    truth: true
    answer: "La multiplication d'abord : `20 - 6 + 1`. Puis de gauche à droite : 14, puis 15."
  - key: vf-et-avant-ou
    format: true-false
    question: "`a || b && c` se lit `a || (b && c)`."
    truth: true
    answer: "`&&` est prioritaire sur `||`. Des parenthèses rendent l'intention évidente."
  - key: vf-priorite-ordre
    format: true-false
    question: "Dans `f() + g() * h()`, la priorité garantit que `g()` est appelée avant `f()`."
    truth: false
    answer: "La priorité ne fixe que le regroupement. L'ordre des trois appels n'est pas spécifié."
  - key: vf-soustraction
    format: true-false
    question: "`10 - 4 - 3` vaut 3."
    truth: true
    answer: "La soustraction se regroupe de gauche à droite : `(10 - 4) - 3`."
  - key: qcm-bits
    format: multiple-choice
    question: "Comment le compilateur lit-il `x & 1 == 0` ?"
    choices:
      - {text: "`x & (1 == 0)`", correct: true}
      - {text: "`(x & 1) == 0`", correct: false}
      - {text: "`(x & 1 == 0)`, évalué de droite à gauche", correct: false}
      - {text: "Comme une erreur de syntaxe", correct: false}
    answer: "`==` est prioritaire sur `&`. Le test vaut `x & 0`, toujours faux. On écrit `(x & 1) == 0`."
  - key: qcm-indefini
    format: multiple-choice
    question: "Laquelle de ces instructions a un comportement indéfini ?"
    choices:
      - {text: "`i = i++ + ++i;`", correct: true}
      - {text: "`i = i + 1;`", correct: false}
      - {text: "`j = i++;`", correct: false}
      - {text: "`i += 2;`", correct: false}
    answer: "`i` est modifiée plusieurs fois sans ordre défini entre ces modifications. Les trois autres ne la modifient qu'une fois."
  - key: qcm-comparaison-logique
    format: multiple-choice
    question: "Comment se lit `a < b && c < d` ?"
    choices:
      - {text: "`(a < b) && (c < d)`", correct: true}
      - {text: "`a < (b && c) < d`", correct: false}
      - {text: "`((a < b) && c) < d`", correct: false}
      - {text: "`a < (b && (c < d))`", correct: false}
    answer: "Les comparaisons sont prioritaires sur `&&` : pas besoin de parenthèses ici."
  - key: qcm-regle
    format: multiple-choice
    question: "Quelle habitude évite les surprises d'ordre d'évaluation ?"
    choices:
      - {text: "Ne pas modifier une variable et la relire dans la même expression", correct: true}
      - {text: "Écrire toutes les opérations d'une fonction sur une seule ligne", correct: false}
      - {text: "Remplacer `i++` par `++i` dans les arguments d'une fonction", correct: false}
      - {text: "Compiler avec un niveau d'optimisation plus élevé", correct: false}
    answer: "Un seul effet par instruction : on incrémente sur une ligne, on utilise la valeur sur une autre. Le code ne dépend alors d'aucun ordre."
  - key: code-priorite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {} {}", 2 + 3 * 4, (2 + 3) * 4, 10 - 4 - 3);
      }
      ```
    choices:
      - {text: "`14 20 3`", correct: true}
      - {text: "`20 20 3`", correct: false}
      - {text: "`14 20 9`", correct: false}
      - {text: "`14 14 3`", correct: false}
    answer: "`14 20 3` : la multiplication passe avant l'addition, sauf parenthèses. La soustraction se regroupe de gauche à droite."
    check:
      output: "14 20 3"
  - key: code-logique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const bool a = true;
          const bool b = false;
          const bool c = false;
          std::println("{} {}", a || b && c, (a || b) && c);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : `&&` est prioritaire, donc la première expression se lit `a || (b && c)`. Les parenthèses changent le résultat."
    check:
      output: "true false"
  - key: code-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = 2;
          int c = 3;
          a = b = c + 1;
          std::println("{} {} {}", a, b, c);
      }
      ```
    choices:
      - {text: "`4 4 3`", correct: true}
      - {text: "`2 4 3`", correct: false}
      - {text: "`3 3 3`", correct: false}
      - {text: "`4 2 3`", correct: false}
    answer: "`4 4 3` : l'addition d'abord, puis les affectations de droite à gauche. `b` reçoit 4, puis `a` reçoit `b`."
    check:
      output: "4 4 3"
  - key: code-court-circuit
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int appels = 0;

      bool vrai() {
          ++appels;
          return true;
      }

      bool faux() {
          ++appels;
          return false;
      }

      int main() {
          const bool resultat = faux() && vrai() || vrai();
          std::println("{} {}", resultat, appels);
      }
      ```
    choices:
      - {text: "`true 2`", correct: true}
      - {text: "`true 3`", correct: false}
      - {text: "`false 1`", correct: false}
      - {text: "`false 2`", correct: false}
    answer: "`true 2` : l'expression se lit `(faux() && vrai()) || vrai()`. `faux()` court-circuite le `&&` ; puis le `||` appelle le dernier `vrai()`. Deux appels, dans un ordre garanti."
    check:
      output: "true 2"
  - key: bug-bits-comparaison
    format: bug-fix
    question: |-
      Ce programme devrait afficher `pair` pour 4. Il affiche `impair`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const unsigned n = 4;
          if (n & 1 == 0) {
              std::println("pair");
          } else {
              std::println("impair");
          }
      }
      ```
    choices:
      - {text: "Écrire `(n & 1) == 0`", correct: true}
      - {text: "Écrire `n & (1 == 0)`", correct: false}
      - {text: "Écrire `n && 1 == 0`", correct: false}
      - {text: "Écrire `n & 1 = 0`", correct: false}
    answer: |-
      ```cpp
      if ((n & 1) == 0) {
      ```
      `==` est prioritaire sur `&` : le test valait `n & (1 == 0)`, soit `n & 0`, toujours faux. `n % 2 == 0` dit
      la même chose sans piège.
  - key: bug-moyenne
    format: bug-fix
    question: |-
      Ce programme devrait afficher la moyenne, `15`. Il affiche `20`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int a = 10;
          const int b = 20;
          const int moyenne = a + b / 2;
          std::println("{}", moyenne);
      }
      ```
    choices:
      - {text: "Écrire `(a + b) / 2`", correct: true}
      - {text: "Écrire `a + (b / 2)`", correct: false}
      - {text: "Écrire `a / 2 + b`", correct: false}
      - {text: "Écrire `a + b / 2.0`", correct: false}
    answer: |-
      ```cpp
      const int moyenne = (a + b) / 2;
      ```
      La division est prioritaire : `a + b / 2` vaut `10 + 10`. Les parenthèses forcent l'addition d'abord.
  - key: bug-condition
    format: bug-fix
    question: |-
      La remise est réservée aux moins de 26 ans et aux plus de 60 ans, à condition d'avoir une carte. Ce programme
      affiche pourtant `remise` pour un client de 20 ans sans carte. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int age = 20;
          const bool carte = false;
          if (age < 26 || age > 60 && carte) {
              std::println("remise");
          } else {
              std::println("plein tarif");
          }
      }
      ```
    choices:
      - {text: "Écrire `(age < 26 || age > 60) && carte`", correct: true}
      - {text: "Écrire `age < 26 || (age > 60 && carte)`", correct: false}
      - {text: "Écrire `age < 26 && age > 60 || carte`", correct: false}
      - {text: "Écrire `age < 26 | age > 60 & carte`", correct: false}
    answer: |-
      ```cpp
      if ((age < 26 || age > 60) && carte) {
      ```
      `&&` est prioritaire sur `||` : la carte n'était exigée que des seniors. Les parenthèses l'exigent des deux
      tranches d'âge.
  - key: bug-argument-modifie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1 2`. Avec GCC, il affiche `2 2`, et un avertissement signale une opération
      sur `i` qui peut être indéfinie. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(int avant, int apres) {
          std::println("{} {}", avant, apres);
      }

      int main() {
          int i = 1;
          afficher(i, ++i);
      }
      ```
    choices:
      - {text: "Lire `i` dans une variable, l'incrémenter, puis appeler `afficher(avant, i)`", correct: true}
      - {text: "Écrire `afficher(i, i++)`, avec l'incrémentation après la variable", correct: false}
      - {text: "Écrire `afficher(++i, i)`, en échangeant les deux arguments", correct: false}
      - {text: "Écrire `afficher((i), (++i))`, avec des parenthèses", correct: false}
    answer: |-
      ```cpp
      const int avant = i;
      ++i;
      afficher(avant, i);
      ```
      L'ordre d'évaluation des arguments n'est pas spécifié : ici, `++i` est calculé d'abord. Des parenthèses n'y
      changent rien. Un effet par instruction, et le résultat ne dépend plus du compilateur.
