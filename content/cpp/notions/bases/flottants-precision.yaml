notion: flottants-precision
lesson: |-
  Un `float` ou un `double` représente un nombre à virgule en **binaire**, sur un nombre fini de bits (norme
  IEEE 754). La plupart des nombres décimaux n'y ont **pas de représentation exacte** : ils sont arrondis au plus
  proche.

  | Type | Taille | Chiffres décimaux significatifs |
  |---|---|---|
  | `float` | 32 bits | environ 7 |
  | `double` | 64 bits | environ 15 à 16 |

  `double` est le type par défaut : un littéral comme `0.1` est un `double`.

  **Le piège classique.** `0.1`, `0.2` et `0.3` ne sont pas exacts en binaire, comme 1/3 ne l'est pas en décimal.

  ```cpp
  std::println("{}", 0.1 + 0.2 == 0.3);   // false
  std::println("{}", 0.1 + 0.2);          // 0.30000000000000004
  ```

  En revanche, les entiers (jusqu'à 2⁵³ pour un `double`) et les fractions de puissances de deux (`0.5`, `0.25`,
  `0.125`) sont exacts.

  **Comparer avec une tolérance.** On ne teste pas l'égalité de deux flottants calculés : on teste que leur écart
  est petit.

  ```cpp
  bool proches(double a, double b) {
      return std::abs(a - b) < 1e-9;
  }
  ```

  La tolérance dépend de l'ordre de grandeur des valeurs ; pour de grands nombres, on la prend relative.

  **Les erreurs s'accumulent.** Additionner dix fois `0.1` ne donne pas exactement `1.0`. Une boucle
  `for (double x = 0.0; x != 1.0; x += 0.1)` ne s'arrête jamais : on compte avec un entier.

  **Les valeurs spéciales.**

  | Valeur | Comment l'obtenir | Comportement |
  |---|---|---|
  | `+inf`, `-inf` | `1.0 / 0.0`, un résultat trop grand | plus grand (ou plus petit) que tout nombre |
  | `NaN` (*not a number*) | `0.0 / 0.0`, `std::sqrt(-1.0)` | **différent de tout, y compris de lui-même** |

  La division d'un **flottant** par zéro n'est pas une erreur : elle donne l'infini ou `NaN`. Celle d'un **entier**
  par zéro est un comportement indéfini.

  Comme `NaN != NaN`, on teste avec `std::isnan(x)`, jamais avec `x == NaN`. Toute comparaison avec `NaN` est
  fausse, et une opération qui en reçoit un rend `NaN` : il se propage dans tout le calcul.

  **Les conversions.** `double` vers `int` **tronque** vers zéro (`3.9` devient `3`) ; si la valeur ne tient pas
  dans l'entier, c'est un comportement indéfini. `std::round`, `std::floor`, `std::ceil` arrondissent explicitement.

  **L'argent.** On ne compte pas des euros en `double` : les centimes s'arrondissent mal. On compte en
  **centimes entiers**, ou avec un type décimal.

  **En entretien** : « Les flottants sont des approximations binaires : `0.1 + 0.2 != 0.3`. Je compare avec une
  tolérance, je ne les prends ni comme compteur de boucle ni pour de l'argent, et je teste `NaN` avec
  `std::isnan`, puisqu'il est différent de lui-même. »
cards:
  - key: pourquoi-inexact
    format: course
    question: "Pourquoi `0.1 + 0.2 == 0.3` est-il faux en C++ ?"
    choices:
      - {text: "Ces nombres n'ont pas de représentation binaire exacte : chacun est arrondi", correct: true}
      - {text: "L'opérateur `==` compare les adresses des nombres, pas leurs valeurs", correct: false}
      - {text: "L'addition de deux `double` donne un `float`, moins précis", correct: false}
      - {text: "Le compilateur calcule `0.2 + 0.3` d'abord, par priorité", correct: false}
    answer: "Comme 1/3 en décimal, 0.1 a un développement infini en binaire. Les trois valeurs sont arrondies, et la somme des deux premières ne tombe pas sur l'arrondi de la troisième."
  - key: comparer
    format: course
    question: "Comment compare-t-on deux `double` issus de calculs ?"
    choices:
      - {text: "En testant que la valeur absolue de leur différence est sous une tolérance", correct: true}
      - {text: "En les convertissant en `int`, puis en testant l'égalité", correct: false}
      - {text: "En les convertissant en `float`, puis en testant l'égalité", correct: false}
      - {text: "En testant l'égalité deux fois de suite", correct: false}
    answer: "`std::abs(a - b) < epsilon`. La tolérance se choisit selon l'ordre de grandeur des valeurs."
  - key: nan
    format: course
    question: "Quelle propriété de `NaN` oblige à le tester avec `std::isnan` ?"
    choices:
      - {text: "Il est différent de toute valeur, y compris de lui-même", correct: true}
      - {text: "Il est égal à toute valeur, y compris à zéro", correct: false}
      - {text: "Il arrête le programme dès qu'on le lit", correct: false}
      - {text: "Il se transforme en zéro quand on le compare", correct: false}
    answer: "`x == x` est faux quand `x` vaut `NaN`. Toutes les comparaisons avec lui sont fausses, sauf `!=`."
  - key: division-par-zero
    format: course
    question: "Que donne `1.0 / 0.0` avec des `double` ?"
    choices:
      - {text: "L'infini positif, sans erreur", correct: true}
      - {text: "Un comportement indéfini, comme pour les entiers", correct: false}
      - {text: "Une exception `std::overflow_error`", correct: false}
      - {text: "Zéro", correct: false}
    answer: "La norme IEEE 754 définit la division d'un flottant par zéro : `inf`, ou `NaN` pour `0.0 / 0.0`. C'est la division entière par zéro qui est indéfinie."
  - key: vf-double-defaut
    format: true-false
    question: "Le littéral `0.1` est de type `double`."
    truth: true
    answer: "Sans suffixe, un littéral à virgule est un `double`. `0.1f` est un `float`."
  - key: vf-un-demi
    format: true-false
    question: "`0.5` a une représentation exacte dans un `double`."
    truth: true
    answer: "C'est une puissance de deux : 2⁻¹. Les sommes de puissances de deux, comme 0.75, sont exactes aussi."
  - key: vf-nan-egal
    format: true-false
    question: "Si `x` vaut `NaN`, l'expression `x == x` est vraie."
    truth: false
    answer: "`NaN` n'est égal à rien, pas même à lui-même. C'est d'ailleurs un moyen de le détecter."
  - key: vf-troncature
    format: true-false
    question: "Convertir `3.9` en `int` donne `4`."
    truth: false
    answer: "La conversion tronque vers zéro : `3`. Pour arrondir, on appelle `std::round`."
  - key: qcm-chiffres
    format: multiple-choice
    question: "Combien de chiffres décimaux significatifs un `double` garde-t-il environ ?"
    choices:
      - {text: "15 à 16", correct: true}
      - {text: "7", correct: false}
      - {text: "32", correct: false}
      - {text: "64", correct: false}
    answer: "Un `double` a 53 bits de mantisse, soit 15 à 16 chiffres décimaux. Un `float` en garde environ 7."
  - key: qcm-tester-nan
    format: multiple-choice
    question: "Quelle expression dit correctement si `x` vaut `NaN` ?"
    choices:
      - {text: "`std::isnan(x)`", correct: true}
      - {text: "`x == NAN`", correct: false}
      - {text: "`x == 0.0 / 0.0`", correct: false}
      - {text: "`x < 0.0 || x > 0.0`", correct: false}
    answer: "Toute comparaison d'égalité avec `NaN` est fausse. `std::isnan`, de `<cmath>`, est le test prévu."
  - key: qcm-argent
    format: multiple-choice
    question: "Quel type convient pour additionner des montants en euros sans erreur d'arrondi ?"
    choices:
      - {text: "Un entier, qui compte les centimes", correct: true}
      - {text: "Un `double`, qui compte les euros", correct: false}
      - {text: "Un `float`, qui compte les euros", correct: false}
      - {text: "Un `long double`, qui compte les euros", correct: false}
    answer: "0.10 € n'est exact dans aucun type binaire à virgule, quelle que soit sa taille. En centimes, tout est entier, donc exact."
  - key: qcm-arrondir
    format: multiple-choice
    question: "Quelle fonction arrondit `2.5` à l'entier le plus proche, en s'éloignant de zéro ?"
    choices:
      - {text: "`std::round`", correct: true}
      - {text: "`std::floor`", correct: false}
      - {text: "`std::trunc`", correct: false}
      - {text: "`static_cast<int>`", correct: false}
    answer: "`std::round(2.5)` vaut 3. `std::floor` et `std::trunc` donnent 2, comme la conversion en `int`."
  - key: code-egalite
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          const double somme = 0.1 + 0.7;
          std::println("{} {}", somme == 0.8, std::abs(somme - 0.8) < 1e-9);
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : la somme vaut 0.7999999999999999. L'égalité stricte échoue, la comparaison avec une tolérance réussit."
    check:
      output: "false true"
  - key: code-exacts
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {}", 0.5 + 0.25 == 0.75, 0.1 * 3 == 0.3);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : 0.5, 0.25 et 0.75 sont des sommes de puissances de deux, donc exacts. 0.1 ne l'est pas, et l'erreur se voit après la multiplication."
    check:
      output: "true false"
  - key: code-nan-inf
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <limits>
      #include <print>

      int main() {
          const double nan = std::numeric_limits<double>::quiet_NaN();
          const double inf = std::numeric_limits<double>::infinity();
          std::println("{} {} {}", nan == nan, std::isnan(nan + 1.0), inf > 1e308);
      }
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`false true true` : `NaN` est différent de lui-même, et se propage par l'addition. L'infini dépasse tout nombre fini."
    check:
      output: "false true true"
  - key: code-troncature
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          const double x = 3.9;
          const double y = -3.9;
          std::println("{} {} {}", static_cast<int>(x), static_cast<int>(y), std::round(x));
      }
      ```
    choices:
      - {text: "`3 -3 4`", correct: true}
      - {text: "`4 -4 4`", correct: false}
      - {text: "`3 -4 4`", correct: false}
      - {text: "`3 -3 3`", correct: false}
    answer: "`3 -3 4` : la conversion en `int` tronque vers zéro, pour un négatif aussi. `std::round` arrondit au plus proche."
    check:
      output: "3 -3 4"
  - key: bug-boucle-flottante
    format: bug-fix
    question: |-
      Cette boucle devrait faire dix tours, et s'arrêter quand `x` atteint 1. Elle en fait plus de mille : seul le
      garde-fou l'arrête. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int tours = 0;
          for (double x = 0.0; x != 1.0; x += 0.1) {
              ++tours;
              if (tours > 1000) {
                  break;
              }
          }
          std::println("{}", tours);
      }
      ```
    choices:
      - {text: "Compter avec un entier : `for (int i = 0; i < 10; ++i)`", correct: true}
      - {text: "Déclarer `x` avec le type `float`, plus léger", correct: false}
      - {text: "Écrire la condition `x == 1.0` à la place de `x != 1.0`", correct: false}
      - {text: "Écrire le pas `x += 0.10`, avec un zéro de plus", correct: false}
    answer: |-
      ```cpp
      for (int i = 0; i < 10; ++i) {
          const double x = i * 0.1;
      ```
      Dix additions de 0.1 donnent 0.9999999999999999, pas 1.0 : la condition `!=` reste vraie. Un compteur de
      boucle est un entier ; le flottant s'en déduit.
  - key: bug-egalite
    format: bug-fix
    question: |-
      Ce programme devrait afficher `total atteint`. Il affiche `total manqué`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const double total = 0.1 + 0.2 + 0.3;
          if (total == 0.6) {
              std::println("total atteint");
          } else {
              std::println("total manqué");
          }
      }
      ```
    choices:
      - {text: "Tester `std::abs(total - 0.6) < 1e-9`, avec `#include <cmath>`", correct: true}
      - {text: "Tester `total = 0.6`, avec un seul signe égal", correct: false}
      - {text: "Tester `total == 0.60`, avec un zéro de plus", correct: false}
      - {text: "Tester `(float)total == 0.6`, après conversion", correct: false}
    answer: |-
      ```cpp
      if (std::abs(total - 0.6) < 1e-9) {
      ```
      La somme vaut 0.6000000000000001. Deux flottants calculés se comparent avec une tolérance.
  - key: bug-test-nan
    format: bug-fix
    question: |-
      Ce programme devrait afficher `invalide` pour la racine d'un nombre négatif. Il affiche `valide`. Quelle
      correction est la bonne ?
      ```cpp
      #include <cmath>
      #include <limits>
      #include <print>

      int main() {
          const double racine = std::sqrt(-4.0);
          if (racine == std::numeric_limits<double>::quiet_NaN()) {
              std::println("invalide");
          } else {
              std::println("valide");
          }
      }
      ```
    choices:
      - {text: "Tester `std::isnan(racine)`", correct: true}
      - {text: "Tester `racine == 0.0`", correct: false}
      - {text: "Tester `racine != racine + 1`", correct: false}
      - {text: "Tester `racine < 0.0`", correct: false}
    answer: |-
      ```cpp
      if (std::isnan(racine)) {
      ```
      `std::sqrt(-4.0)` rend `NaN`, et `NaN` n'est égal à rien, pas même à un autre `NaN`. `std::isnan` est le
      test prévu.
  - key: bug-centimes
    format: bug-fix
    question: |-
      Ce programme devrait afficher `30` centimes. Il affiche `29`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const double prix = 0.1 + 0.2;
          const int centimes = static_cast<int>(prix * 100 - 0.5);
          std::println("{}", centimes);
      }
      ```
    choices:
      - {text: "Compter en centimes entiers : `const int centimes = 10 + 20;`", correct: true}
      - {text: "Déclarer `prix` avec le type `float`, sans rien changer d'autre", correct: false}
      - {text: "Retirer le `static_cast<int>`, et laisser la conversion implicite", correct: false}
      - {text: "Écrire `prix * 100.0 - 0.50`, avec des littéraux à virgule", correct: false}
    answer: |-
      ```cpp
      const int centimes = 10 + 20;
      ```
      Les euros en `double` ne sont pas exacts, et la conversion en `int` tronque au lieu d'arrondir. De l'argent
      se compte en centimes, avec des entiers. S'il faut convertir, `std::lround(prix * 100)` arrondit au plus
      proche.
  - key: situation-facture
    format: scenario
    question: |-
      Un logiciel de facturation additionne des milliers de lignes en `double`. Le total diffère parfois d'un
      centime de celui du comptable. Que proposes-tu ?
    choices:
      - {text: "Stocker et additionner les montants en centimes, dans des entiers", correct: true}
      - {text: "Passer tous les montants en `long double`, plus précis", correct: false}
      - {text: "Passer tous les montants en `float`, plus rapides", correct: false}
      - {text: "Additionner les lignes dans l'ordre inverse", correct: false}
    answer: |-
      Aucun type binaire à virgule ne représente exactement 0,10 € : les erreurs s'accumulent ligne après ligne.
      En centimes entiers, chaque addition est exacte. La division (une remise, une taxe) s'arrondit alors à un
      endroit choisi, selon la règle comptable.
  - key: situation-test-fragile
    format: scenario
    question: |-
      Un test vérifie `CHECK(moyenne({0.1, 0.2, 0.3}) == 0.2);`. Il passe sur ta machine, et échoue sur le serveur
      d'intégration, compilé avec d'autres options. Que proposes-tu ?
    choices:
      - {text: "Comparer avec une tolérance : `doctest::Approx(0.2)`", correct: true}
      - {text: "Compiler le serveur avec les mêmes options que ta machine", correct: false}
      - {text: "Supprimer ce test, qui dépend de la machine", correct: false}
      - {text: "Arrondir la moyenne à l'entier le plus proche", correct: false}
    answer: |-
      Le dernier bit d'un calcul flottant peut dépendre de l'ordre des opérations et des optimisations. Un test
      d'égalité stricte est donc fragile ; une comparaison avec tolérance dit ce qu'on veut vraiment vérifier.
  - key: situation-nan-propage
    format: scenario
    question: |-
      Un tableau de bord affiche `nan` pour toutes ses statistiques, alors qu'une seule mesure sur dix mille était
      invalide. Pourquoi, et que fais-tu ?
    choices:
      - {text: "`NaN` se propage dans chaque calcul ; il faut écarter la mesure invalide à l'entrée, avec `std::isnan`", correct: true}
      - {text: "`NaN` remplace les valeurs voisines en mémoire ; il faut ranger les mesures dans une liste", correct: false}
      - {text: "`NaN` vaut zéro, et fausse seulement la moyenne ; il faut diviser par un de moins", correct: false}
      - {text: "`NaN` lance une exception attrapée trop tard ; il faut ajouter un `try` autour du calcul", correct: false}
    answer: |-
      Toute opération qui reçoit `NaN` rend `NaN` : une somme, une moyenne, un écart type. Une seule valeur
      contamine tout. On valide les données à l'entrée, plutôt que de chercher la cause dans le résultat.
  - key: situation-grands-nombres
    format: scenario
    question: |-
      Un compteur de vues est stocké dans un `float`. Au-delà de seize millions, il cesse d'augmenter quand on lui
      ajoute 1. Pourquoi ?
    choices:
      - {text: "Un `float` n'a que 24 bits de précision : au-delà de 2²⁴, `x + 1` s'arrondit à `x`", correct: true}
      - {text: "Un `float` déborde à seize millions, et reste bloqué à sa valeur maximale", correct: false}
      - {text: "Un `float` devient `NaN` au-delà de seize millions", correct: false}
      - {text: "Un `float` ne peut être incrémenté que par un autre `float`", correct: false}
    answer: |-
      Un `float` représente exactement les entiers jusqu'à 16 777 216. Au-delà, l'écart entre deux valeurs
      voisines dépasse 1 : l'addition retombe sur le même nombre. Un compteur est un entier.
