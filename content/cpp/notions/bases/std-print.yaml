notion: std-print
lesson: |-
  Depuis **C++23**, l'en-tête `<print>` fournit deux fonctions d'affichage :

  ```cpp
  #include <print>

  int main() {
      int age = 43;
      std::println("C++ a {} ans", age);   // passe à la ligne
      std::print("sans retour à la ligne");
  }
  ```

  - **`std::println`** affiche puis passe à la ligne ; **`std::print`** ne passe pas à la ligne.
  - Le premier argument est une **chaîne de format** : chaque **`{}`** est remplacé par l'argument suivant, dans
    l'ordre.
  - On peut préciser le format dans les accolades : `{:.2f}` pour deux décimales, `{:>5}` pour aligner à droite sur
    cinq caractères, `{:x}` pour l'hexadécimal. `{0}` et `{1}` désignent un argument par son numéro.
  - Pour afficher une accolade, on la double : `{{` et `}}`.
  - La chaîne de format est **vérifiée à la compilation** : un `{}` sans argument, ou un format qui ne convient pas
    au type, est une erreur de compilation.

  **Face à `std::cout`** :

  | | `std::cout <<` | `std::println` |
  |---|---|---|
  | En-tête | `<iostream>` | `<print>` (C++23) |
  | Mise en forme | des manipulateurs (`std::setprecision`), qui restent actifs | dans les accolades, pour une valeur |
  | Un booléen | `1` ou `0` | `true` ou `false` |
  | Lisibilité | la phrase est coupée par les `<<` | la phrase se lit d'un trait |

  `std::format`, de C++20, utilise la même syntaxe et renvoie une `std::string` au lieu d'afficher.

  **Piège classique** : écrire `%d` comme avec `printf`. `std::println("Total : %d", 42)` compile, et affiche
  `Total : %d` : seules les accolades sont des emplacements.

  **En entretien** : « En C++23, j'affiche avec `std::println` : la chaîne de format est vérifiée à la compilation,
  contrairement à `printf`, et elle se lit mieux qu'une suite de `<<`. »
tour:
  - title: Afficher avec std::println
    text: |-
      C++23 apporte `std::println`, dans l'en-tête `<print>`. Chaque `{}` de son texte est remplacé par l'argument
      suivant ; `std::print` fait de même, sans passer à la ligne.

      Les accolades acceptent un format : `{:.2f}` arrondit à deux décimales.

      Ce Tour affiche avec `std::println`. Tu croiseras aussi `std::cout <<` dans le code plus ancien : les deux
      cohabitent.

      Essaie : retire un argument, puis exécute. Le compilateur refuse : la chaîne de format est vérifiée avant
      l'exécution.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              std::println("{} + {} = {}", 2, 3, 2 + 3);
              std::print("pi vaut environ ");
              std::println("{:.2f}", 3.14159);
          }
      output: |-
        2 + 3 = 5
        pi vaut environ 3.14
    task:
      instructions: |-
        Fais afficher `Ada a 36 ans`, en gardant les deux variables : remplace le texte par une chaîne de format à
        deux emplacements.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              const char* prenom = "Ada";
              int age = 36;
              std::println("... a ... ans");
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              const char* prenom = "Ada";
              int age = 36;
              std::println("{} a {} ans", prenom, age);
          }
      output: |-
        Ada a 36 ans
cards:
  - key: print-ou-println
    format: course
    question: Quelle différence entre `std::print` et `std::println` ?
    choices:
      - {text: "`std::println` passe à la ligne après le texte, `std::print` non", correct: true}
      - {text: "`std::print` passe à la ligne après le texte, `std::println` non", correct: false}
      - {text: "`std::println` écrit dans un fichier, `std::print` à l'écran", correct: false}
      - {text: "`std::print` n'accepte qu'un texte, `std::println` aussi des nombres", correct: false}
    answer: "`std::println` ajoute un retour à la ligne après le texte ; `std::print` n'en ajoute pas."
  - key: role-des-accolades
    format: course
    question: "Que représente `{}` dans `std::println(\"Total : {}\", total)` ?"
    choices:
      - {text: "Un emplacement, remplacé par l'argument suivant", correct: true}
      - {text: "Un bloc de code vide, que le compilateur ignore", correct: false}
      - {text: "Un tableau vide, affiché tel quel", correct: false}
      - {text: "Un retour à la ligne, comme `\\n`", correct: false}
    answer: |-
      C'est un emplacement de la chaîne de format : chaque `{}` est remplacé, dans l'ordre, par l'un des arguments qui
      suivent.
  - key: verification-a-la-compilation
    format: course
    question: "Que se passe-t-il avec `std::println(\"{} et {}\", 1)`, qui a deux emplacements pour un seul argument ?"
    choices:
      - {text: "Le code ne compile pas : la chaîne de format est vérifiée à la compilation", correct: true}
      - {text: "Le programme affiche `1 et {}`, en laissant l'emplacement de trop", correct: false}
      - {text: "Le programme affiche `1 et 1`, en réutilisant le dernier argument", correct: false}
      - {text: "Le programme affiche `1 et 0`, en complétant par zéro", correct: false}
    answer: |-
      Le compilateur vérifie la chaîne de format : un emplacement sans argument est une erreur de compilation. C'est
      l'avantage sur `printf`, où la même faute donne un comportement indéfini à l'exécution.
  - key: avantage-sur-cout
    format: course
    question: Quel avantage a `std::println` sur une suite de `std::cout <<` ?
    choices:
      - {text: "La phrase se lit d'un trait, et le format de chaque valeur est dans ses accolades", correct: true}
      - {text: "Il fonctionne avec toutes les normes du langage, depuis C++98", correct: false}
      - {text: "Il n'a besoin d'aucun en-tête de la bibliothèque standard", correct: false}
      - {text: "Il affiche les nombres plus précisément que `std::cout`", correct: false}
    answer: |-
      La chaîne de format garde la phrase entière, et la mise en forme (`{:.2f}`) ne vaut que pour sa valeur, alors
      qu'un manipulateur de `std::cout` reste actif. En revanche, `std::println` demande C++23 et l'en-tête `<print>`.
  - key: vf-en-tete-print
    format: true-false
    question: "`std::println` est déclaré dans l'en-tête `<print>`."
    truth: true
    answer: "`<print>`, arrivé avec C++23, déclare `std::print` et `std::println`."
  - key: vf-disponible-cpp17
    format: true-false
    question: "`std::println` est disponible en C++17."
    truth: false
    answer: "`std::print` et `std::println` datent de C++23. `std::format`, qui a la même syntaxe, date de C++20."
  - key: vf-pourcent-d
    format: true-false
    question: "Dans `std::println`, `%d` marque l'emplacement d'un entier, comme dans `printf`."
    truth: false
    answer: |-
      Les emplacements de `std::println` sont des accolades. `%d` n'a aucun sens particulier : il est affiché tel
      quel.
  - key: vf-bool-true
    format: true-false
    question: "`std::println(\"{}\", true)` affiche `true`."
    truth: true
    answer: "`std::println` affiche un booléen en toutes lettres, là où `std::cout << true` affiche `1`."
  - key: qcm-deux-decimales
    format: multiple-choice
    question: Quel emplacement affiche un nombre à virgule avec deux décimales ?
    choices:
      - {text: "`{:.2f}`", correct: true}
      - {text: "`{.2f}`", correct: false}
      - {text: "`{%.2f}`", correct: false}
      - {text: "`{2}`", correct: false}
    answer: |-
      Le format suit un deux-points : `{:.2f}`. `{2}` désigne le troisième argument, et `%.2f` est la syntaxe de
      `printf`.
  - key: qcm-accolade-litterale
    format: multiple-choice
    question: Comment afficher une accolade ouvrante avec `std::println` ?
    choices:
      - {text: "En la doublant : `{{`", correct: true}
      - {text: "Avec une barre oblique inverse : `\\{`", correct: false}
      - {text: "Avec un pourcent : `%{`", correct: false}
      - {text: "En l'écrivant seule : `{`", correct: false}
    answer: |-
      On double l'accolade : `{{` affiche `{`, et `}}` affiche `}`. Une accolade seule ouvre un emplacement : la
      chaîne de format serait refusée à la compilation.
  - key: qcm-argument-par-numero
    format: multiple-choice
    question: "Que désigne `{0}` dans une chaîne de format ?"
    choices:
      - {text: "Le premier argument après la chaîne de format", correct: true}
      - {text: "Le nombre zéro, affiché tel quel", correct: false}
      - {text: "Un emplacement vide, qui n'affiche rien", correct: false}
      - {text: "La chaîne de format elle-même", correct: false}
    answer: |-
      Un numéro dans les accolades désigne un argument par sa position, à partir de 0. On peut ainsi répéter ou
      réordonner : `"{1} {0}"`.
  - key: qcm-format-renvoie-chaine
    format: multiple-choice
    question: Quelle fonction utilise la même syntaxe que `std::println`, mais renvoie une `std::string` au lieu d'afficher ?
    choices:
      - {text: "`std::format`", correct: true}
      - {text: "`std::printf`", correct: false}
      - {text: "`std::to_string`", correct: false}
      - {text: "`std::cout`", correct: false}
    answer: |-
      `std::format("{} ans", 43)` renvoie la chaîne `"43 ans"`. `std::to_string` ne convertit qu'un nombre, sans mise
      en forme, et `std::printf` utilise les `%d` du C.
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète pour que `std::println` soit déclaré :
      ```cpp
      #include <___>

      int main() {
          std::println("Bonjour !");
      }
      ```
    blanks:
      - [print]
    answer: "`std::print` et `std::println` sont déclarés dans `<print>`."
  - key: trous-emplacement
    format: fill-in
    question: |-
      Complète pour afficher `Total : 42` :
      ```cpp
      std::println("Total : ___", 42);
      ```
    blanks:
      - ["{}", "{0}", "{:d}"]
    answer: "`{}` est remplacé par l'argument suivant, ici `42`."
  - key: trous-println
    format: fill-in
    question: |-
      Complète pour que chaque texte soit sur sa propre ligne :
      ```cpp
      std::___("Première ligne");
      std::___("Seconde ligne");
      ```
    blanks:
      - [println]
      - [println]
    answer: "`std::println` passe à la ligne après le texte ; avec `std::print`, les deux textes seraient collés."
  - key: trous-decimales
    format: fill-in
    question: |-
      Complète pour afficher `3.14` :
      ```cpp
      std::println("{:___}", 3.14159);
      ```
    blanks:
      - [".2f"]
    answer: "`.2f` demande deux chiffres après la virgule."
  - key: code-print-println
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::print("A");
          std::println("B");
          std::print("C");
      }
      ```
    choices:
      - text: |-
          ```
          AB
          C
          ```
        correct: true
      - text: |-
          ```
          A
          B
          C
          ```
        correct: false
      - text: |-
          ```
          ABC
          ```
        correct: false
      - text: |-
          ```
          A
          BC
          ```
        correct: false
    answer: |-
      ```
      AB
      C
      ```
      `std::print` ne passe pas à la ligne : `A` et `B` sont collés. `std::println` passe à la ligne après `B`.
    check:
      output: |-
        AB
        C
  - key: code-emplacements
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} + {} = {}", 2, 3, 2 + 3);
      }
      ```
    choices:
      - {text: "`2 + 3 = 5`", correct: true}
      - {text: "`{} + {} = {}`", correct: false}
      - {text: "`2 + 3 = 2 + 3`", correct: false}
      - {text: "`2 3 5`", correct: false}
    answer: "`2 + 3 = 5` : chaque `{}` prend l'argument suivant, et le troisième argument, `2 + 3`, est calculé avant l'affichage."
    check:
      output: "2 + 3 = 5"
  - key: code-numeros
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{1} {0} {1}", "a", "b");
      }
      ```
    choices:
      - {text: "`b a b`", correct: true}
      - {text: "`a b a`", correct: false}
      - {text: "`1 0 1`", correct: false}
      - {text: "`a b b`", correct: false}
    answer: "`b a b` : les numéros commencent à 0. `{0}` désigne `\"a\"`, `{1}` désigne `\"b\"`, et un argument peut servir deux fois."
    check:
      output: "b a b"
  - key: code-bool-division
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {}", true, 7 / 2);
      }
      ```
    choices:
      - {text: "`true 3`", correct: true}
      - {text: "`1 3`", correct: false}
      - {text: "`true 3.5`", correct: false}
      - {text: "`1 3.5`", correct: false}
    answer: |-
      `true 3` : `std::println` écrit un booléen en toutes lettres, et `7 / 2` est une division entre entiers, qui
      donne 3.
    check:
      output: "true 3"
  - key: bug-pourcent-d
    format: bug-fix
    question: |-
      Ce programme affiche `Total : %d` au lieu de `Total : 42`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          std::println("Total : %d", 42);
      }
      ```
    choices:
      - {text: "Remplacer `%d` par `{}`", correct: true}
      - {text: "Remplacer `%d` par `%i`", correct: false}
      - {text: "Remplacer `std::println` par `std::print`", correct: false}
      - {text: "Écrire `\"42\"` entre guillemets", correct: false}
    answer: |-
      ```cpp
      std::println("Total : {}", 42);
      ```
      `%d` est la syntaxe de `printf`. Pour `std::println`, c'est un texte ordinaire ; l'argument en trop est ignoré.
  - key: bug-argument-manquant
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int largeur = 3;
          int hauteur = 4;
          std::println("{} x {} = {}", largeur, hauteur);
      }
      ```
    choices:
      - {text: "La chaîne a trois emplacements pour deux arguments", correct: true}
      - {text: "`std::println` ne sait pas afficher deux entiers à la suite", correct: false}
      - {text: "Le caractère `x` est interdit dans une chaîne de format", correct: false}
      - {text: "Les variables doivent être déclarées `const` pour être affichées", correct: false}
    answer: |-
      ```cpp
      std::println("{} x {} = {}", largeur, hauteur, largeur * hauteur);
      ```
      La chaîne de format est vérifiée à la compilation : chaque `{}` doit avoir son argument.
  - key: bug-lignes-collees
    format: bug-fix
    question: |-
      Ce programme affiche `PrêtPartez` sur une seule ligne, au lieu de deux lignes. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          std::print("Prêt");
          std::print("Partez");
      }
      ```
    choices:
      - {text: "Remplacer `std::print` par `std::println`", correct: true}
      - {text: "Ajouter `{}` à la fin de chaque texte", correct: false}
      - {text: "Ajouter `#include <iostream>` en haut du fichier", correct: false}
      - {text: "Réunir les deux textes dans un seul `std::print`", correct: false}
    answer: |-
      ```cpp
      std::println("Prêt");
      std::println("Partez");
      ```
      `std::print` ne passe pas à la ligne. `std::println` le fait ; écrire `"Prêt\n"` aussi.
  - key: bug-accolades-litterales
    format: bug-fix
    question: |-
      Ce code ne compile pas : il devrait afficher `ensemble vide : {}`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          std::println("ensemble vide : {}");
      }
      ```
    choices:
      - {text: "Doubler les accolades : `{{}}`", correct: true}
      - {text: "Les précéder d'une barre oblique inverse", correct: false}
      - {text: "Les entourer d'apostrophes : `'{}'`", correct: false}
      - {text: "Remplacer `std::println` par `std::print`", correct: false}
    answer: |-
      ```cpp
      std::println("ensemble vide : {{}}");
      ```
      `{}` est un emplacement, et il n'a pas d'argument ici : la compilation échoue. `{{` et `}}` affichent des
      accolades.
