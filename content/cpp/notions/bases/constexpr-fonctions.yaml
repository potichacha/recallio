notion: constexpr-fonctions
lesson: |-
  Une fonction `constexpr` **peut** être exécutée **par le compilateur**. Appelée avec des arguments connus à la
  compilation, dans un contexte qui exige une constante, son résultat est calculé avant même que le programme
  n'existe.

  ```cpp
  constexpr int carre(int n) {
      return n * n;
  }

  constexpr int aire = carre(12);          // calculé à la compilation : 144
  std::array<int, carre(3)> grille{};      // une taille de tableau
  static_assert(carre(4) == 16);           // vérifié à la compilation
  ```

  **« Peut », pas « doit ».** La même fonction s'appelle aussi à l'exécution, avec des valeurs quelconques :

  ```cpp
  int saisie = lire();
  int resultat = carre(saisie);            // appel ordinaire, à l'exécution
  ```

  `constexpr` sur une fonction est une **permission**. C'est le **contexte de l'appel** qui décide.

  | Appel | Quand est-il évalué ? |
  |---|---|
  | `constexpr int x = f(3);` | à la compilation, obligatoirement |
  | `static_assert(f(3) == 9);`, `std::array<int, f(3)>` | à la compilation, obligatoirement |
  | `int x = f(3);` | à la compilation ou à l'exécution, au choix du compilateur |
  | `int x = f(saisie);` | à l'exécution |

  Pour **forcer** le calcul à la compilation, on range le résultat dans une variable `constexpr`.

  **Ce qu'une fonction `constexpr` peut contenir.** Presque tout, depuis C++14 puis C++20 : variables locales,
  boucles, `if`, récursion, et même `std::vector` et `std::string`, à condition que leur mémoire soit libérée
  avant la fin du calcul.

  ```cpp
  constexpr int factorielle(int n) {
      int resultat = 1;
      for (int i = 2; i <= n; ++i) {
          resultat *= i;
      }
      return resultat;
  }
  ```

  Ce qu'elle ne peut pas faire **pendant une évaluation à la compilation** : lire une entrée, afficher, appeler
  une fonction qui n'est pas `constexpr`.

  **Les erreurs deviennent des erreurs de compilation.** Un comportement indéfini rencontré pendant une
  évaluation à la compilation (débordement d'entier signé, indice hors bornes, division par zéro) **fait échouer
  la compilation**. C'est un filet de sécurité que l'exécution n'offre pas.

  **`consteval` (C++20).** Une fonction `consteval` **doit** être évaluée à la compilation : l'appeler avec une
  valeur d'exécution est une erreur. On l'appelle *fonction immédiate*.

  ```cpp
  consteval int carre_immediat(int n) { return n * n; }
  ```

  **À quoi ça sert.** Calculer des tables et des constantes une fois pour toutes, valider des valeurs dès la
  compilation, et remplacer les macros et la métaprogrammation par templates, bien moins lisibles.

  **En entretien** : « Une fonction `constexpr` peut être évaluée à la compilation si ses arguments sont des
  constantes et que le contexte l'exige ; sinon c'est une fonction ordinaire. Pour forcer, je range le résultat
  dans une variable `constexpr`, ou j'écris une fonction `consteval`. »
cards:
  - key: definition
    format: course
    question: "Que permet le mot-clé `constexpr` devant une fonction ?"
    choices:
      - {text: "Que le compilateur l'exécute lui-même, quand ses arguments sont des constantes", correct: true}
      - {text: "Qu'elle ne soit jamais exécutée pendant que le programme tourne", correct: false}
      - {text: "Qu'elle renvoie toujours la même valeur, quels que soient ses arguments", correct: false}
      - {text: "Qu'elle modifie des variables déclarées `const`", correct: false}
    answer: "C'est une permission. La fonction reste appelable à l'exécution, avec des valeurs qui ne sont connues qu'à ce moment."
  - key: contexte
    format: course
    question: "Qu'est-ce qui décide si un appel de fonction `constexpr` est évalué à la compilation ?"
    choices:
      - {text: "Le contexte de l'appel : des arguments constants, et un endroit qui exige une constante", correct: true}
      - {text: "Une option du compilateur, activée pour tout le programme, à la ligne de commande", correct: false}
      - {text: "La longueur du corps de la fonction : en dessous de dix lignes, c'est à la compilation", correct: false}
      - {text: "Le nombre de fois où la fonction est appelée dans le programme", correct: false}
    answer: "`constexpr int x = f(3);` impose le calcul à la compilation. `int x = f(saisie);` se fait à l'exécution, avec la même fonction."
  - key: forcer
    format: course
    question: "Comment t'assures-tu qu'un appel de fonction `constexpr` est bien calculé à la compilation ?"
    choices:
      - {text: "En rangeant son résultat dans une variable `constexpr`", correct: true}
      - {text: "En rangeant son résultat dans une variable `const`", correct: false}
      - {text: "En appelant la fonction deux fois de suite", correct: false}
      - {text: "En compilant avec l'option `-O3`", correct: false}
    answer: "L'initialisation d'une variable `constexpr` exige une expression constante : si le calcul ne peut pas se faire à la compilation, le programme ne compile pas."
  - key: consteval
    format: course
    question: "Quelle différence entre une fonction `constexpr` et une fonction `consteval` ?"
    choices:
      - {text: "`constexpr` peut être évaluée à la compilation ; `consteval` doit l'être", correct: true}
      - {text: "`constexpr` doit être évaluée à la compilation ; `consteval` peut l'être", correct: false}
      - {text: "`constexpr` vaut pour les entiers ; `consteval` vaut pour tous les types", correct: false}
      - {text: "Aucune : `consteval` est l'écriture C++20 de `constexpr`", correct: false}
    answer: "Une fonction `consteval`, dite immédiate, n'existe qu'à la compilation : l'appeler avec une valeur d'exécution est une erreur."
  - key: vf-execution
    format: true-false
    question: "Une fonction `constexpr` peut être appelée avec une valeur lue au clavier."
    truth: true
    answer: "L'appel se fait alors à l'exécution, comme pour une fonction ordinaire."
  - key: vf-boucle
    format: true-false
    question: "Une fonction `constexpr` ne peut pas contenir de boucle."
    truth: false
    answer: "C'était vrai en C++11. Depuis C++14, les boucles, les variables locales et les `if` sont permis."
  - key: vf-ub
    format: true-false
    question: "Un débordement d'entier signé, pendant une évaluation à la compilation, est une erreur de compilation."
    truth: true
    answer: "Le compilateur refuse tout comportement indéfini dans une expression constante. À l'exécution, la même faute passerait inaperçue."
  - key: vf-toujours-compilation
    format: true-false
    question: "`int x = carre(5);` garantit que `carre`, fonction `constexpr`, est évaluée à la compilation."
    truth: false
    answer: "`x` n'est pas `constexpr` : le compilateur est libre de calculer à la compilation ou à l'exécution. Seul un contexte constant l'y oblige."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration permet d'écrire `static_assert(cube(2) == 8);` ?"
    choices:
      - {text: "`constexpr int cube(int n) { return n * n * n; }`", correct: true}
      - {text: "`const int cube(int n) { return n * n * n; }`", correct: false}
      - {text: "`static int cube(int n) { return n * n * n; }`", correct: false}
      - {text: "`inline int cube(int n) { return n * n * n; }`", correct: false}
    answer: "`static_assert` exige une expression constante : la fonction doit être `constexpr`. `const` devant le type de retour ne concerne que la valeur renvoyée."
  - key: qcm-interdit
    format: multiple-choice
    question: "Que ne peut pas faire une fonction pendant son évaluation à la compilation ?"
    choices:
      - {text: "Afficher un message avec `std::println`", correct: true}
      - {text: "Déclarer une variable locale", correct: false}
      - {text: "S'appeler elle-même", correct: false}
      - {text: "Exécuter une boucle `for`", correct: false}
    answer: "Il n'y a ni écran ni clavier à la compilation. Les entrées-sorties, et les appels à des fonctions non `constexpr`, n'y sont pas permis."
  - key: qcm-contexte-constant
    format: multiple-choice
    question: "Dans lequel de ces cas `carre(4)` est-il obligatoirement calculé à la compilation ?"
    choices:
      - {text: "`std::array<int, carre(4)> grille{};`", correct: true}
      - {text: "`std::vector<int> grille(carre(4));`", correct: false}
      - {text: "`int taille = carre(4);`", correct: false}
      - {text: "`std::println(\"{}\", carre(4));`", correct: false}
    answer: "La taille d'un `std::array` est un argument de template : elle doit être une constante de compilation."
  - key: qcm-usage
    format: multiple-choice
    question: "Quel est l'intérêt de calculer une table de valeurs avec une fonction `constexpr` ?"
    choices:
      - {text: "La table est déjà dans le programme : aucun calcul au démarrage", correct: true}
      - {text: "La table peut être modifiée pendant l'exécution", correct: false}
      - {text: "La table occupe moins de place que si elle était écrite à la main", correct: false}
      - {text: "La table est recalculée à chaque lecture, donc toujours à jour", correct: false}
    answer: "Le travail est fait une fois, par le compilateur. Le programme n'embarque que le résultat."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que la fonction puisse être évaluée à la compilation :
      ```cpp
      ___ int carre(int n) {
          return n * n;
      }
      ```
    blanks:
      - [constexpr]
    answer: "`constexpr` devant la fonction autorise son évaluation à la compilation."
  - key: trous-forcer
    format: fill-in
    question: |-
      Complète pour imposer le calcul à la compilation :
      ```cpp
      ___ int aire = carre(12);
      ```
    blanks:
      - [constexpr]
    answer: "Une variable `constexpr` doit être initialisée par une expression constante."
  - key: trous-consteval
    format: fill-in
    question: |-
      Complète pour que la fonction ne puisse être appelée qu'à la compilation (C++20) :
      ```cpp
      ___ int identifiant(int n) {
          return n * 31;
      }
      ```
    blanks:
      - [consteval]
    answer: "Une fonction `consteval` est une fonction immédiate : tout appel est évalué à la compilation."
  - key: trous-static-assert
    format: fill-in
    question: |-
      Complète pour vérifier la fonction à la compilation :
      ```cpp
      constexpr int carre(int n) { return n * n; }

      ___(carre(5) == 25);
      ```
    blanks:
      - [static_assert]
    answer: "`static_assert` évalue sa condition à la compilation : c'est un test qui ne coûte rien à l'exécution."
  - key: code-array
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      constexpr int carre(int n) {
          return n * n;
      }

      int main() {
          std::array<int, carre(3)> grille{};
          constexpr int aire = carre(4);
          std::println("{} {}", grille.size(), aire);
      }
      ```
    choices:
      - {text: "`9 16`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`6 8`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9 16` : `carre(3)` est calculé à la compilation, et sert de taille au tableau. `aire` l'est aussi."
    check:
      output: "9 16"
  - key: code-boucle
    format: code-output
    question: |-
      ```cpp
      #include <print>

      constexpr int factorielle(int n) {
          int resultat = 1;
          for (int i = 2; i <= n; ++i) {
              resultat *= i;
          }
          return resultat;
      }

      int main() {
          static_assert(factorielle(5) == 120);
          int n = 4;
          std::println("{} {}", factorielle(5), factorielle(n));
      }
      ```
    choices:
      - {text: "`120 24`", correct: true}
      - {text: "`120 120`", correct: false}
      - {text: "`24 120`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`120 24` : la même fonction sert à la compilation, dans le `static_assert`, et à l'exécution, avec la variable `n`."
    check:
      output: "120 24"
  - key: code-non-constant
    format: code-output
    question: |-
      ```cpp
      #include <print>

      constexpr int carre(int n) {
          return n * n;
      }

      int main() {
          int saisie = 5;
          constexpr int resultat = carre(saisie);
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`25`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : `resultat` est `constexpr`, mais `saisie` n'est pas une constante. Avec `int resultat`, l'appel se ferait à l'exécution et afficherait `25`."
    check:
      compiles: false
  - key: code-ub
    format: code-output
    question: |-
      ```cpp
      #include <print>

      constexpr int diviser(int a, int b) {
          return a / b;
      }

      int main() {
          constexpr int resultat = diviser(10, 0);
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : la division par zéro est un comportement indéfini, que le compilateur refuse dans une expression constante. À l'exécution, la même division aurait planté le programme."
    check:
      compiles: false
  - key: bug-fonction-non-constexpr
    format: bug-fix
    question: |-
      Le compilateur refuse la taille du tableau : « call to non-'constexpr' function 'int cases(int)' ». Quelle
      correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int cases(int cote) {
          return cote * cote;
      }

      int main() {
          std::array<int, cases(3)> grille{};
          std::println("{}", grille.size());
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int cases(int cote)`", correct: true}
      - {text: "Déclarer `const int cases(int cote)`", correct: false}
      - {text: "Déclarer `static int cases(int cote)`", correct: false}
      - {text: "Déclarer `inline int cases(int cote)`", correct: false}
    answer: |-
      ```cpp
      constexpr int cases(int cote) {
          return cote * cote;
      }
      ```
      La taille d'un `std::array` doit être calculée à la compilation : la fonction qui la donne doit être
      `constexpr`.
  - key: bug-argument-execution
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration de `prix` : « the value of 'quantite' is not usable in a constant
      expression ». La quantité n'est connue qu'à l'exécution. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      constexpr int total(int quantite) {
          return quantite * 12;
      }

      int main() {
          int quantite = 3;
          constexpr int prix = total(quantite);
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Déclarer `const int prix = total(quantite);`", correct: true}
      - {text: "Déclarer `constexpr auto prix = total(quantite);`", correct: false}
      - {text: "Déclarer `static constexpr int prix = total(quantite);`", correct: false}
      - {text: "Déclarer `constexpr int prix = total(&quantite);`", correct: false}
    answer: |-
      ```cpp
      const int prix = total(quantite);
      ```
      Une fonction `constexpr` accepte des valeurs d'exécution ; c'est la variable `constexpr` qui exige une
      constante. `const` fige le résultat, calculé à l'exécution.
  - key: bug-affichage
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation de `aire` : la fonction appelle `std::println`, qui n'est pas
      `constexpr`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      constexpr int carre(int n) {
          std::println("calcul de {}", n);
          return n * n;
      }

      int main() {
          constexpr int aire = carre(6);
          std::println("{}", aire);
      }
      ```
    choices:
      - {text: "Retirer l'affichage de la fonction `carre`", correct: true}
      - {text: "Remplacer `std::println` par `std::cout` dans `carre`", correct: false}
      - {text: "Déclarer `carre` avec `consteval` à la place de `constexpr`", correct: false}
      - {text: "Inclure l'en-tête `<constexpr>` en haut du fichier", correct: false}
    answer: |-
      ```cpp
      constexpr int carre(int n) {
          return n * n;
      }
      ```
      Une évaluation à la compilation ne peut pas afficher : il n'y a pas de sortie à ce moment. `consteval`
      rendrait la contrainte plus stricte encore.
  - key: bug-debordement
    format: bug-fix
    question: |-
      Le compilateur refuse cette constante : « overflow in constant expression ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      constexpr int puissance_de_dix(int exposant) {
          int resultat = 1;
          for (int i = 0; i < exposant; ++i) {
              resultat *= 10;
          }
          return resultat;
      }

      int main() {
          constexpr int grand = puissance_de_dix(12);
          std::println("{}", grand);
      }
      ```
    choices:
      - {text: "Calculer et renvoyer un `long long`, et déclarer `constexpr long long grand`", correct: true}
      - {text: "Déclarer `const int grand`, pour que le calcul passe à l'exécution", correct: false}
      - {text: "Retirer `constexpr` de la fonction, sans rien changer d'autre", correct: false}
      - {text: "Déclarer `resultat` avec le type `short`, plus petit", correct: false}
    answer: |-
      ```cpp
      constexpr long long puissance_de_dix(int exposant) {
          long long resultat = 1;
      ```
      Dix puissance douze ne tient pas dans un `int`. À la compilation, ce débordement est une erreur ; à
      l'exécution, il serait un comportement indéfini silencieux. Il faut un type assez grand.
