notion: hello-world
lesson: |-
  Le plus petit programme C++ qui affiche quelque chose :

  ```cpp
  #include <iostream>

  int main() {
      std::cout << "Bonjour !\n";
      return 0;
  }
  ```

  - **`#include <iostream>`** rend disponible la partie de la bibliothèque standard qui gère les entrées et les sorties.
    Sans cette ligne, `std::cout` n'est pas déclaré : le code ne compile pas.
  - **`int main()`** est le point d'entrée : l'exécution commence par elle. Elle renvoie un `int`, le **code de sortie**
    du programme.
  - **`std::cout`** est la sortie standard. L'opérateur **`<<`** y envoie une valeur, et se chaîne :
    `std::cout << "Total : " << 42 << "\n";`.
  - **`"\n"`** passe à la ligne. `std::endl` aussi, mais il vide en plus le tampon de sortie : on préfère `"\n"`.
  - **`return 0;`** annonce au système que tout s'est bien passé ; une autre valeur signale une erreur. Dans `main`, et
    dans `main` seulement, on peut l'omettre : arriver à la fin de `main` revient à `return 0;`.
  - Chaque instruction se termine par un **point-virgule**, et les blocs sont délimités par des **accolades**.

  **Piège classique** : oublier le `#include`, ou écrire `cout` sans `std::`. Dans les deux cas, le compilateur répond
  que le nom n'est pas déclaré.

  **En entretien** : « `main` renvoie un `int`, le code de sortie : 0 pour un succès. C'est la seule fonction non
  `void` où le `return` est facultatif. »
tour:
  - title: Le premier programme
    text: |-
      Un programme C++ commence par `main`, qui renvoie un `int` : le code de sortie, 0 quand tout va bien. On peut
      omettre `return 0;` à la fin de `main`.

      Pour afficher, il faut d'abord inclure la bonne partie de la bibliothèque standard : `#include <iostream>` donne
      `std::cout`, la sortie standard. L'opérateur `<<` y envoie du texte ou des nombres, à la suite, et `"\n"` passe à
      la ligne.

      Essaie : retire un `"\n"`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <iostream>

          int main() {
              std::cout << "Bonjour, C++ !\n";
              std::cout << "2 + 3 = " << 2 + 3 << "\n";
              return 0;
          }
      output: |-
        Bonjour, C++ !
        2 + 3 = 5
    task:
      instructions: |-
        Fais afficher `C++ a 43 ans`, en calculant l'âge avec `2026 - 1983` plutôt qu'en l'écrivant.
      starter:
        main.cpp: |-
          #include <iostream>

          int main() {
              std::cout << "C++ a ... ans\n";
          }
      solution:
        main.cpp: |-
          #include <iostream>

          int main() {
              std::cout << "C++ a " << 2026 - 1983 << " ans\n";
          }
      output: |-
        C++ a 43 ans
cards:
  - key: role-de-main
    format: course
    question: À quoi sert la fonction `main` ?
    choices:
      - {text: "C'est le point d'entrée : l'exécution du programme commence par elle", correct: true}
      - {text: "Elle compile les autres fonctions avant de les lancer", correct: false}
      - {text: "Elle est appelée à la fin, pour libérer la mémoire du programme", correct: false}
      - {text: "Elle déclare les bibliothèques dont le programme a besoin", correct: false}
    answer: "C'est le **point d'entrée** : le système lance le programme en appelant `main`."
  - key: role-de-include
    format: course
    question: À quoi sert la ligne `#include <iostream>` ?
    choices:
      - {text: "À lancer le programme en mode interactif", correct: false}
      - {text: "À rendre disponibles les déclarations des entrées et sorties, dont `std::cout`", correct: true}
      - {text: "À indiquer au compilateur quelle norme du langage utiliser", correct: false}
      - {text: "À télécharger la bibliothèque `iostream` depuis Internet", correct: false}
    answer: |-
      Elle insère dans le fichier les déclarations de l'en-tête `<iostream>` : `std::cout`, `std::cin`, `std::endl`...
      Sans elle, ces noms sont inconnus du compilateur.
  - key: valeur-de-retour
    format: course
    question: Que signifie la valeur que renvoie `main` ?
    choices:
      - {text: "Le nombre de lignes que le programme a affichées", correct: false}
      - {text: "La quantité de mémoire que le programme a utilisée", correct: false}
      - {text: "Le code de sortie : 0 pour un succès, autre chose pour une erreur", correct: true}
      - {text: "Le nombre d'arguments reçus sur la ligne de commande", correct: false}
    answer: |-
      C'est le **code de sortie** du programme, que lit le système ou le script qui l'a lancé : 0 pour un succès, une
      autre valeur pour une erreur.
  - key: role-de-chevrons
    format: course
    question: "Que fait l'opérateur `<<` dans `std::cout << \"Bonjour\"` ?"
    choices:
      - {text: "Il compare `std::cout` au texte", correct: false}
      - {text: "Il envoie le texte vers la sortie standard", correct: true}
      - {text: "Il lit un texte tapé au clavier", correct: false}
      - {text: "Il range le texte dans une variable", correct: false}
    answer: |-
      Il envoie la valeur de droite dans le flux de gauche, ici la sortie standard. Il renvoie le flux : c'est ce qui
      permet de le chaîner, `std::cout << "a" << 1`.
  - key: vf-return-facultatif
    format: true-false
    question: Dans `main`, on peut omettre `return 0;`.
    truth: true
    answer: |-
      Arriver à la fin de `main` sans `return` revient à `return 0;`. C'est une exception propre à `main` : dans une
      autre fonction qui renvoie une valeur, l'oublier est un comportement indéfini.
  - key: vf-void-main
    format: true-false
    question: La norme C++ permet de déclarer `void main()`.
    truth: false
    answer: "`main` renvoie obligatoirement un `int`. Certains compilateurs tolèrent `void main()`, mais ce n'est pas du C++ standard."
  - key: vf-point-virgule
    format: true-false
    question: En C++, le point-virgule à la fin d'une instruction est facultatif.
    truth: false
    answer: Chaque instruction se termine par `;`. Sans lui, le code ne compile pas.
  - key: vf-cout-sans-include
    format: true-false
    question: On peut utiliser `std::cout` sans inclure `<iostream>`.
    truth: false
    answer: |-
      `std::cout` est déclaré dans l'en-tête `<iostream>`. Sans l'inclure, le compilateur ne connaît pas ce nom.
  - key: qcm-signature-main
    format: multiple-choice
    question: Laquelle de ces déclarations de `main` est correcte ?
    choices:
      - {text: "`int main()`", correct: true}
      - {text: "`void main()`", correct: false}
      - {text: "`int Main()`", correct: false}
      - {text: "`main()`", correct: false}
    answer: |-
      `int main()` : le type de retour est `int`, et le nom s'écrit en minuscules. L'autre forme permise reçoit les
      arguments de la ligne de commande : `int main(int argc, char* argv[])`.
  - key: qcm-afficher-une-ligne
    format: multiple-choice
    question: Quelle instruction affiche « Bonjour » puis passe à la ligne ?
    choices:
      - {text: "`std::cout << \"Bonjour\\n\";`", correct: true}
      - {text: "`std::cout >> \"Bonjour\\n\";`", correct: false}
      - {text: "`std::cout(\"Bonjour\\n\");`", correct: false}
      - {text: "`std::cout = \"Bonjour\\n\";`", correct: false}
    answer: |-
      `<<` envoie le texte vers `std::cout`. `>>` est l'opérateur de lecture, celui de `std::cin`, et `std::cout` n'est
      pas une fonction qu'on appelle.
  - key: qcm-en-tete-de-cout
    format: multiple-choice
    question: Quel en-tête faut-il inclure pour utiliser `std::cout` ?
    choices:
      - {text: "`<iostream>`", correct: true}
      - {text: "`<stdio>`", correct: false}
      - {text: "`<cout>`", correct: false}
      - {text: "`<string>`", correct: false}
    answer: |-
      `<iostream>` déclare les flux standard : `std::cout`, `std::cin` et `std::cerr`. `<string>` déclare
      `std::string` ; `<stdio>` et `<cout>` n'existent pas.
  - key: qcm-code-de-sortie-erreur
    format: multiple-choice
    question: Un programme se termine par `return 1;` dans `main`. Qu'en conclut le script qui l'a lancé ?
    choices:
      - {text: "Que le programme a réussi", correct: false}
      - {text: "Que le programme a échoué", correct: true}
      - {text: "Que le programme a affiché une ligne", correct: false}
      - {text: "Que le programme doit être relancé une fois", correct: false}
    answer: |-
      Par convention, 0 signale un succès et toute autre valeur une erreur. C'est ce code que testent un script ou une
      chaîne d'intégration continue pour savoir s'ils continuent.
  - key: trous-include
    format: fill-in
    question: |-
      Complète pour que `std::cout` soit déclaré :
      ```cpp
      #include <___>

      int main() {
          std::cout << "Bonjour !\n";
      }
      ```
    blanks:
      - [iostream]
    answer: "`<iostream>` déclare les flux d'entrée et de sortie standard."
  - key: trous-main
    format: fill-in
    question: |-
      Complète la déclaration du point d'entrée :
      ```cpp
      #include <iostream>

      ___ ___() {
          std::cout << "Bonjour !\n";
      }
      ```
    blanks:
      - [int]
      - [main]
    answer: "`int main()` : `main` renvoie un `int`, le code de sortie."
  - key: trous-operateur
    format: fill-in
    question: |-
      Complète pour afficher `Total : 42` :
      ```cpp
      std::cout ___ "Total : " ___ 42 << "\n";
      ```
    blanks:
      - ["<<"]
      - ["<<"]
    answer: "L'opérateur `<<` envoie chaque valeur vers `std::cout`, l'une après l'autre."
  - key: trous-return
    format: fill-in
    question: |-
      Complète pour que le programme signale un succès au système :
      ```cpp
      int main() {
          std::cout << "Terminé\n";
          ___ 0;
      }
      ```
    blanks:
      - [return]
    answer: "`return 0;` renvoie le code de sortie 0, qui signale un succès."
  - key: code-sans-retour-ligne
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << "A";
          std::cout << "B\n";
          std::cout << "C";
      }
      ```
    choices:
      - text: |-
          ```
          A
          B
          C
          ```
        correct: false
      - text: |-
          ```
          AB
          C
          ```
        correct: true
      - text: |-
          ```
          ABC
          ```
        correct: false
      - text: |-
          ```
          A
          BC
          ```
        correct: false
    answer: |-
      ```
      AB
      C
      ```
      `std::cout` ne passe jamais à la ligne de lui-même : seul le `"\n"` après `B` le fait.
    check:
      output: |-
        AB
        C
  - key: code-chainage-calcul
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << "2 + 3 = " << 2 + 3 << "\n";
      }
      ```
    choices:
      - {text: "`2 + 3 = 5`", correct: true}
      - {text: "`2 + 3 = 23`", correct: false}
      - {text: "`2 + 3 = 2 + 3`", correct: false}
      - {text: "`5 = 5`", correct: false}
    answer: |-
      `2 + 3 = 5` : `+` est prioritaire sur `<<`, la somme est donc calculée avant d'être affichée. Le texte entre
      guillemets, lui, est affiché tel quel.
    check:
      output: "2 + 3 = 5"
  - key: code-nombres-colles
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << 1 << 2 << "\n";
          std::cout << 1 + 2 << "\n";
      }
      ```
    choices:
      - text: |-
          ```
          12
          3
          ```
        correct: true
      - text: |-
          ```
          1 2
          3
          ```
        correct: false
      - text: |-
          ```
          3
          3
          ```
        correct: false
      - text: |-
          ```
          12
          12
          ```
        correct: false
    answer: |-
      ```
      12
      3
      ```
      `<<` écrit les valeurs à la suite, sans espace : `1` puis `2` donnent `12`. Sur la seconde ligne, `1 + 2` est
      calculé avant l'affichage.
    check:
      output: |-
        12
        3
  - key: code-endl
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << "un" << std::endl << "deux" << "\n" << "trois";
      }
      ```
    choices:
      - text: |-
          ```
          un
          deux
          trois
          ```
        correct: true
      - text: |-
          ```
          undeux
          trois
          ```
        correct: false
      - text: |-
          ```
          un
          deuxtrois
          ```
        correct: false
      - text: |-
          ```
          un deux trois
          ```
        correct: false
    answer: |-
      ```
      un
      deux
      trois
      ```
      `std::endl` et `"\n"` passent tous deux à la ligne. `std::endl` vide en plus le tampon de sortie, ce qui ne se
      voit pas ici.
    check:
      output: |-
        un
        deux
        trois
  - key: bug-include-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « 'cout' is not a member of 'std' ». Pourquoi ?
      ```cpp
      int main() {
          std::cout << "Bonjour !\n";
      }
      ```
    choices:
      - {text: "Il manque `#include <iostream>` en haut du fichier", correct: true}
      - {text: "Il manque `return 0;` à la fin de `main`", correct: false}
      - {text: "`std::cout` doit s'écrire `std::Cout`", correct: false}
      - {text: "`main` doit recevoir `argc` et `argv`", correct: false}
    answer: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << "Bonjour !\n";
      }
      ```
      `std::cout` est déclaré dans `<iostream>`. Sans cet en-tête, le compilateur ne connaît pas le nom.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction le fait compiler ?
      ```cpp
      #include <iostream>

      int main() {
          std::cout << "Bonjour !\n"
          return 0;
      }
      ```
    choices:
      - {text: "Ajouter `;` à la fin de la ligne `std::cout`", correct: true}
      - {text: "Retirer la ligne `return 0;`", correct: false}
      - {text: "Remplacer `\"\\n\"` par `std::endl`", correct: false}
      - {text: "Ajouter `;` après l'accolade fermante", correct: false}
    answer: |-
      ```cpp
      std::cout << "Bonjour !\n";
      ```
      Une instruction se termine par un point-virgule. Sans lui, le compilateur lit `return` comme la suite de
      l'expression, et s'arrête là.
  - key: bug-chevrons-inverses
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```cpp
      #include <iostream>

      int main() {
          std::cout >> "Bonjour !\n";
      }
      ```
    choices:
      - {text: "`>>` lit depuis un flux : pour écrire dans `std::cout`, c'est `<<`", correct: true}
      - {text: "Un texte s'écrit entre apostrophes, pas entre guillemets", correct: false}
      - {text: "`std::cout` n'accepte que des nombres, pas du texte", correct: false}
      - {text: "Il manque `#include <string>` pour afficher un texte", correct: false}
    answer: |-
      ```cpp
      std::cout << "Bonjour !\n";
      ```
      Les chevrons pointent dans le sens des données : `<<` vers `std::cout` pour écrire, `>>` depuis `std::cin` pour
      lire.
  - key: bug-main-majuscule
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `main` ». Pourquoi ?
      ```cpp
      #include <iostream>

      int Main() {
          std::cout << "Bonjour !\n";
      }
      ```
    choices:
      - {text: "`Main` n'est pas `main` : C++ distingue les majuscules", correct: true}
      - {text: "`main` doit renvoyer `void`, pas `int`", correct: false}
      - {text: "Il manque `return 0;` à la fin de la fonction", correct: false}
      - {text: "Le fichier doit s'appeler `Main.cpp`", correct: false}
    answer: |-
      ```cpp
      int main() {
      ```
      C++ distingue les majuscules des minuscules : `Main` est une fonction ordinaire. L'éditeur de liens cherche
      `main`, et ne la trouve pas.
