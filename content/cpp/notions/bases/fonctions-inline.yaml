notion: fonctions-inline
lesson: |-
  Le mot-clé `inline` a deux histoires. À l'origine, il **suggérait** au compilateur de remplacer l'appel d'une
  fonction par son corps. Aujourd'hui, ce n'est plus son rôle : il sert à **autoriser plusieurs définitions**
  identiques d'une même fonction, ou d'une même variable.

  **Ce qu'`inline` veut dire aujourd'hui.** Une fonction ordinaire ne peut être **définie** qu'une fois dans tout
  le programme. Si sa définition est dans un en-tête inclus par deux fichiers source, l'éditeur de liens répond
  « multiple definition ». `inline` lève cette interdiction :

  ```cpp
  // outils.hpp
  inline int carre(int n) {
      return n * n;
  }
  ```

  Chaque fichier source qui inclut l'en-tête reçoit sa copie ; l'éditeur de liens **n'en garde qu'une**. La
  condition : toutes les définitions doivent être **identiques**.

  **Ce qui est déjà `inline` sans l'écrire.**

  - une fonction membre **définie dans la classe** ;
  - un **template** de fonction (il suit une règle équivalente) ;
  - une fonction `constexpr`.

  **Les variables `inline` (C++17).** Même règle pour une variable globale ou un membre statique définis dans un
  en-tête :

  ```cpp
  inline int niveau_journal = 2;

  struct Config {
      static inline int instances = 0;
  };
  ```

  **Et l'intégration des appels ?** Remplacer un appel par le corps de la fonction (*inlining*) est une
  **optimisation** que le compilateur décide **seul**, d'après la taille de la fonction et le niveau
  d'optimisation. Il intègre des fonctions sans `inline`, et peut ne pas intégrer une fonction `inline`. Le mot-clé
  n'est, au mieux, qu'un indice parmi d'autres.

  Pour qu'il puisse intégrer un appel, le compilateur doit **voir le corps** de la fonction : c'est pourquoi les
  petites fonctions vont dans les en-têtes, et donc sont `inline`. Les deux sens se rejoignent là.

  **Quand écrire `inline`.**

  - Pour une petite fonction libre **définie dans un en-tête**.
  - Pour une variable globale ou un membre statique définis dans un en-tête.
  - **Pas** « pour aller plus vite » sur une fonction définie dans un `.cpp`.

  **Le prix.** Modifier une fonction d'en-tête fait recompiler tous les fichiers qui l'incluent. Une fonction
  longue ou qui change souvent reste dans un `.cpp`.

  **En entretien** : « Aujourd'hui, `inline` ne veut plus dire "intègre l'appel" : il autorise la définition dans
  plusieurs unités de traduction, donc dans un en-tête. L'intégration des appels est une décision de l'optimiseur.
  Les fonctions membres définies dans la classe et les templates sont implicitement `inline`. »
cards:
  - key: sens-actuel
    format: course
    question: "Que signifie le mot-clé `inline` en C++ moderne ?"
    choices:
      - {text: "La fonction peut être définie à l'identique dans plusieurs unités de traduction", correct: true}
      - {text: "Le compilateur doit remplacer chaque appel par le corps de la fonction", correct: false}
      - {text: "La fonction ne peut être appelée que dans le fichier qui la définit", correct: false}
      - {text: "La fonction est exécutée à la compilation, et non à l'exécution", correct: false}
    answer: "C'est une exception à la règle de la définition unique : l'éditeur de liens ne garde qu'une copie. Voilà pourquoi une fonction `inline` peut vivre dans un en-tête."
  - key: integration
    format: course
    question: "Qui décide de remplacer l'appel d'une fonction par son corps ?"
    choices:
      - {text: "L'optimiseur du compilateur, que la fonction soit marquée `inline` ou non", correct: true}
      - {text: "Le programmeur, en écrivant `inline` devant la fonction", correct: false}
      - {text: "L'éditeur de liens, quand il réunit les fichiers objets", correct: false}
      - {text: "Le préprocesseur, comme pour une macro", correct: false}
    answer: "L'intégration est une optimisation. Le compilateur la fait sur des fonctions sans `inline`, et peut s'en abstenir sur une fonction `inline`."
  - key: implicite
    format: course
    question: "Laquelle de ces fonctions est `inline` sans que le mot-clé soit écrit ?"
    choices:
      - {text: "Une fonction membre définie dans le corps de sa classe", correct: true}
      - {text: "Une fonction libre définie dans un fichier `.cpp`", correct: false}
      - {text: "Une fonction membre définie hors de la classe, dans un `.cpp`", correct: false}
      - {text: "La fonction `main`", correct: false}
    answer: "Définie dans la classe, donc dans l'en-tête, elle est implicitement `inline`. Les fonctions `constexpr` aussi."
  - key: variables
    format: course
    question: "À quoi sert `inline` devant une variable globale, depuis C++17 ?"
    choices:
      - {text: "À la définir dans un en-tête sans erreur « multiple definition »", correct: true}
      - {text: "À la rendre constante dans tous les fichiers, comme avec `const`", correct: false}
      - {text: "À la ranger dans un registre du processeur, pour un accès plus rapide", correct: false}
      - {text: "À la rendre invisible des autres fichiers source du programme", correct: false}
    answer: "Tous les fichiers qui incluent l'en-tête partagent une seule variable. Avant C++17, il fallait `extern` dans l'en-tête et la définition dans un `.cpp`."
  - key: vf-garantie
    format: true-false
    question: "Une fonction marquée `inline` est toujours intégrée à l'endroit de ses appels."
    truth: false
    answer: "Le mot-clé ne garantit rien de tel. L'optimiseur décide."
  - key: vf-identiques
    format: true-false
    question: "Toutes les définitions d'une fonction `inline` doivent être identiques."
    truth: true
    answer: "Sinon le programme est mal formé, sans diagnostic exigé : l'éditeur de liens garde une copie quelconque."
  - key: vf-template
    format: true-false
    question: "Un template de fonction défini dans un en-tête doit être marqué `inline` pour éviter « multiple definition »."
    truth: false
    answer: "Les templates peuvent déjà être définis dans plusieurs unités de traduction. Seule une spécialisation totale en a besoin."
  - key: vf-sans-inline
    format: true-false
    question: "Le compilateur peut intégrer l'appel d'une fonction qui n'est pas marquée `inline`."
    truth: true
    answer: "Dès qu'il voit son corps et que l'optimisation est activée. C'est le cas le plus courant."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Comment définis-tu une petite fonction libre dans un en-tête inclus par plusieurs fichiers ?"
    choices:
      - {text: "`inline int carre(int n) { return n * n; }`", correct: true}
      - {text: "`extern int carre(int n) { return n * n; }`", correct: false}
      - {text: "`int carre(int n) { return n * n; }`", correct: false}
      - {text: "`register int carre(int n) { return n * n; }`", correct: false}
    answer: "Sans `inline`, chaque fichier objet contient une définition, et l'édition de liens échoue."
  - key: qcm-membre-statique
    format: multiple-choice
    question: "Quelle ligne définit un membre statique directement dans la classe ?"
    choices:
      - {text: "`static inline int compteur = 0;`", correct: true}
      - {text: "`static int compteur = 0;`", correct: false}
      - {text: "`inline int compteur = 0;`", correct: false}
      - {text: "`extern static int compteur = 0;`", correct: false}
    answer: "Depuis C++17, `static inline` suffit. Sans `inline`, un membre statique non constant doit être défini à part, dans un `.cpp`."
  - key: qcm-condition
    format: multiple-choice
    question: "De quoi le compilateur a-t-il besoin pour intégrer l'appel d'une fonction ?"
    choices:
      - {text: "De voir le corps de la fonction, à l'endroit de l'appel", correct: true}
      - {text: "Du mot-clé `inline` devant la fonction", correct: false}
      - {text: "D'un fichier objet déjà compilé pour la fonction", correct: false}
      - {text: "D'une fonction sans aucun paramètre", correct: false}
    answer: "Avec la seule déclaration, il ne peut que produire un appel. C'est pourquoi les petites fonctions sont définies dans les en-têtes."
  - key: qcm-prix
    format: multiple-choice
    question: "Quel est l'inconvénient de définir une fonction dans un en-tête ?"
    choices:
      - {text: "La modifier fait recompiler tous les fichiers qui incluent l'en-tête", correct: true}
      - {text: "Elle s'exécute plus lentement que dans un `.cpp`", correct: false}
      - {text: "Elle ne peut plus recevoir de paramètres par référence", correct: false}
      - {text: "Elle n'est plus visible du débogueur", correct: false}
    answer: "Une définition dans un `.cpp` ne fait recompiler que ce fichier. On réserve l'en-tête aux fonctions courtes et stables."
  - key: situation-multiple-definition
    format: scenario
    question: |-
      Tu déplaces une fonction utilitaire d'un `.cpp` dans un en-tête, pour la partager. L'édition de liens échoue :
      « multiple definition of `arrondir(double)' ». Que fais-tu ?
    choices:
      - {text: "Je marque la fonction `inline`", correct: true}
      - {text: "J'ajoute `#pragma once` à l'en-tête", correct: false}
      - {text: "Je marque la fonction `extern`", correct: false}
      - {text: "J'inclus l'en-tête dans un seul fichier source", correct: false}
    answer: |-
      Chaque fichier qui inclut l'en-tête définit la fonction. `inline` autorise ces définitions identiques. Une
      garde d'inclusion n'agit qu'à l'intérieur d'un fichier source.
  - key: situation-optimisation
    format: scenario
    question: |-
      Un collègue ajoute `inline` devant vingt fonctions définies dans des `.cpp`, « pour accélérer le programme ».
      Le profileur ne montre aucune différence. Pourquoi ?
    choices:
      - {text: "L'intégration est décidée par l'optimiseur ; hors des en-têtes, `inline` n'apporte rien", correct: true}
      - {text: "Il fallait écrire `inline` deux fois, dans la déclaration et dans la définition", correct: false}
      - {text: "Le compilateur ignore `inline` quand la fonction a plus d'un paramètre", correct: false}
      - {text: "Le profileur désactive le mot-clé `inline` pendant la mesure", correct: false}
    answer: |-
      Le mot-clé n'ordonne rien. Et les autres fichiers ne voient pas le corps de ces fonctions : ils ne peuvent
      pas intégrer leurs appels. Pour cela, il faut la définition dans l'en-tête, ou l'optimisation à l'édition de
      liens (LTO).
  - key: situation-definitions-differentes
    format: scenario
    question: |-
      Deux en-têtes de deux bibliothèques définissent chacun `inline int limite() { ... }`, avec des corps
      différents. Le programme se lie sans erreur, et se comporte bizarrement. Que s'est-il passé ?
    choices:
      - {text: "L'éditeur de liens a gardé l'une des deux définitions, pour tous les appels", correct: true}
      - {text: "Le compilateur a fusionné les deux corps en une seule fonction", correct: false}
      - {text: "Chaque fichier appelle sa propre version, comme prévu", correct: false}
      - {text: "La fonction `limite` a été supprimée du programme", correct: false}
    answer: |-
      `inline` promet des définitions identiques. La promesse rompue n'est pas détectée : une copie est choisie,
      et la moitié du code appelle la mauvaise. Des espaces de noms évitent cette collision.
  - key: situation-recompilation
    format: scenario
    question: |-
      Une fonction de deux cents lignes, modifiée chaque semaine, est définie `inline` dans un en-tête inclus par
      trois cents fichiers. Chaque modification coûte dix minutes de compilation. Que proposes-tu ?
    choices:
      - {text: "La déclarer dans l'en-tête, et la définir dans un `.cpp`", correct: true}
      - {text: "La marquer `static inline`, pour qu'elle compile plus vite", correct: false}
      - {text: "La transformer en macro du préprocesseur", correct: false}
      - {text: "La recopier dans chacun des trois cents fichiers", correct: false}
    answer: |-
      Une définition dans un `.cpp` ne fait recompiler que ce fichier. Une fonction de cette taille ne serait de
      toute façon pas intégrée à ses appels : l'en-tête ne lui apporte rien.
