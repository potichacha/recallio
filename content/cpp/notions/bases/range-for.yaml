notion: range-for
lesson: |-
  La **boucle sur un intervalle** (*range-based for*, C++11) parcourt **tous les éléments** d'une collection, sans
  indice :

  ```cpp
  std::vector<int> notes{12, 15, 9};

  for (int note : notes) {
      std::println("{}", note);
  }
  ```

  Elle se lit « pour chaque `note` dans `notes` ». Elle fonctionne avec un tableau, un `std::vector`, une
  `std::string` (caractère par caractère), une liste entre accolades, et tous les conteneurs de la bibliothèque.

  **La variable de boucle décide de ce qu'on peut faire.**

  | Écriture | L'élément est... | Usage |
  |---|---|---|
  | `for (int x : v)` | **copié** dans `x` | lire des éléments petits |
  | `for (int& x : v)` | **désigné** par `x` | **modifier** les éléments |
  | `for (const auto& x : v)` | désigné, en lecture seule | lire sans copier : le choix par défaut |

  Avec une copie, modifier `x` **ne change pas** la collection. Pour la modifier, il faut une référence : `&`.

  **Ses limites.** Pas d'indice, pas de parcours partiel ni à l'envers : pour cela, on revient au `for` classique.
  Depuis C++20, on peut déclarer un compteur dans la boucle : `for (int i = 0; auto x : v)`.

  **Piège classique** : confondre l'élément et l'indice. Dans `for (int x : v)`, `x` est la **valeur**, pas sa
  position : écrire `v[x]` est presque toujours une erreur.

  **En entretien** : « Pour tout parcourir, j'écris une boucle sur un intervalle : pas d'indice, donc pas d'erreur
  d'indice. `const auto&` par défaut, `auto&` pour modifier. »
tour:
  - title: Parcourir une collection
    text: |-
      Pour parcourir tous les éléments d'une collection, il y a plus simple qu'un compteur : `for (int note : notes)`
      se lit « pour chaque note dans notes ».

      `std::vector<int>` est un tableau d'entiers ; tu le verras en détail plus loin. Une chaîne se parcourt de la même
      façon, caractère par caractère.

      Par défaut, la variable reçoit une **copie** de l'élément. Pour modifier la collection, ajoute `&` :
      `for (int& note : notes)`.

      Essaie : retire le `&` de la première boucle, puis exécute. Les notes ne changent plus.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> notes{12, 15, 9};

              for (int& note : notes) {
                  note += 1;
              }

              int somme = 0;
              for (int note : notes) {
                  somme += note;
              }

              std::println("somme : {}", somme);
          }
      output: "somme : 39"
    task:
      instructions: |-
        Compte les notes qui valent au moins 10, pour afficher `3 notes au-dessus de la moyenne`.
      starter:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> notes{12, 7, 15, 9, 10};
              int reussies = 0;

              std::println("{} notes au-dessus de la moyenne", reussies);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> notes{12, 7, 15, 9, 10};
              int reussies = 0;

              for (int note : notes) {
                  if (note >= 10) {
                      ++reussies;
                  }
              }

              std::println("{} notes au-dessus de la moyenne", reussies);
          }
      output: "3 notes au-dessus de la moyenne"
cards:
  - key: role-du-range-for
    format: course
    question: "Que fait `for (int note : notes)` ?"
    choices:
      - {text: "Elle exécute son bloc une fois pour chaque élément de `notes`", correct: true}
      - {text: "Elle exécute son bloc tant que `note` est différent de `notes`", correct: false}
      - {text: "Elle exécute son bloc `note` fois, en comptant à partir de zéro", correct: false}
      - {text: "Elle range dans `notes` les valeurs successives de `note`", correct: false}
    answer: "C'est la boucle sur un intervalle : à chaque tour, `note` reçoit l'élément suivant de la collection, du premier au dernier."
  - key: copie-ou-reference
    format: course
    question: "Dans `for (int x : v)`, que se passe-t-il si le bloc modifie `x` ?"
    choices:
      - {text: "Rien dans `v` : `x` est une copie de l'élément", correct: true}
      - {text: "L'élément correspondant de `v` est modifié", correct: false}
      - {text: "Tous les éléments de `v` prennent la valeur de `x`", correct: false}
      - {text: "Le code ne compile pas : `x` est en lecture seule", correct: false}
    answer: "`x` est une copie, renouvelée à chaque tour. Pour agir sur la collection, il faut une référence : `for (int& x : v)`."
  - key: const-auto-ref
    format: course
    question: "Pourquoi écrit-on souvent `for (const auto& x : v)` ?"
    choices:
      - {text: "Pour lire chaque élément sans le copier ni risquer de le modifier", correct: true}
      - {text: "Pour que la boucle parcoure la collection à l'envers", correct: false}
      - {text: "Pour que la boucle s'arrête au premier élément constant", correct: false}
      - {text: "Pour pouvoir modifier chaque élément de la collection", correct: false}
    answer: "La référence évite la copie, qui coûte pour des chaînes ou des objets, et `const` interdit de modifier l'élément par erreur. `auto` laisse le compilateur déduire le type."
  - key: limites
    format: course
    question: Dans quel cas préfère-t-on un `for` classique à une boucle sur un intervalle ?
    choices:
      - {text: "Quand on a besoin de l'indice, ou d'un parcours partiel", correct: true}
      - {text: "Quand la collection contient plus de cent éléments", correct: false}
      - {text: "Quand les éléments sont des entiers", correct: false}
      - {text: "Quand on veut lire tous les éléments dans l'ordre", correct: false}
    answer: "La boucle sur un intervalle parcourt tout, du début à la fin, sans donner la position. Pour un élément sur deux, un parcours à l'envers ou un indice, on compte avec un `for` classique."
  - key: vf-string
    format: true-false
    question: Une boucle sur un intervalle peut parcourir une `std::string`, caractère par caractère.
    truth: true
    answer: "`for (char c : mot)` donne chaque caractère de la chaîne."
  - key: vf-copie-modifie
    format: true-false
    question: "Dans `for (int x : v)`, écrire `x = 0;` met à zéro les éléments de `v`."
    truth: false
    answer: "`x` est une copie. Il faudrait `for (int& x : v)`."
  - key: vf-cpp11
    format: true-false
    question: La boucle sur un intervalle existe depuis C++11.
    truth: true
    answer: Elle est arrivée avec `auto` et les lambdas, dans C++11.
  - key: vf-indice
    format: true-false
    question: "Dans `for (int x : v)`, `x` contient la position de l'élément dans `v`."
    truth: false
    answer: "`x` contient la valeur de l'élément. Cette boucle ne donne pas d'indice."
  - key: qcm-modifier
    format: multiple-choice
    question: Quelle boucle permet de doubler chaque élément de `v` ?
    choices:
      - {text: "`for (int& x : v) { x *= 2; }`", correct: true}
      - {text: "`for (int x : v) { x *= 2; }`", correct: false}
      - {text: "`for (const int& x : v) { x *= 2; }`", correct: false}
      - {text: "`for (const auto x : v) { x *= 2; }`", correct: false}
    answer: "Il faut une référence non constante. Sans `&`, la boucle double des copies ; avec `const`, elle ne compile pas."
  - key: qcm-separateur
    format: multiple-choice
    question: Quel caractère sépare la variable de la collection dans une boucle sur un intervalle ?
    choices:
      - {text: "Les deux-points : `for (int x : v)`", correct: true}
      - {text: "Le point-virgule : `for (int x ; v)`", correct: false}
      - {text: "Le mot-clé `in` : `for (int x in v)`", correct: false}
      - {text: "La flèche : `for (int x -> v)`", correct: false}
    answer: "Les deux-points. `in` est le mot de Python et de JavaScript, pas de C++."
  - key: qcm-liste
    format: multiple-choice
    question: "Que parcourt `for (int x : {3, 1, 2})` ?"
    choices:
      - {text: "Les valeurs 3, 1 et 2, dans cet ordre", correct: true}
      - {text: "Les valeurs 1, 2 et 3, triées", correct: false}
      - {text: "Les entiers de 3 à 2, en descendant", correct: false}
      - {text: "Rien : une liste entre accolades ne se parcourt pas", correct: false}
    answer: "Une liste entre accolades se parcourt telle qu'elle est écrite, sans tri."
  - key: qcm-compteur-cpp20
    format: multiple-choice
    question: Depuis C++20, comment déclarer un compteur dans une boucle sur un intervalle ?
    choices:
      - {text: "`for (int i = 0; auto x : v)`", correct: true}
      - {text: "`for (auto x : v; int i = 0)`", correct: false}
      - {text: "`for (int i, auto x : v)`", correct: false}
      - {text: "`for (auto [i, x] : v)`", correct: false}
    answer: "L'initialisation vient avant, suivie d'un point-virgule, comme dans un `if` de C++17. Le compteur se met à jour dans le bloc : `++i`."
  - key: trous-deux-points
    format: fill-in
    question: |-
      Complète pour parcourir toutes les notes :
      ```cpp
      for (int note ___ notes) {
          std::println("{}", note);
      }
      ```
    blanks:
      - [":"]
    answer: "`for (int note : notes)` : les deux-points séparent la variable de la collection."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour que la boucle modifie les éléments de `notes` :
      ```cpp
      for (int___ note : notes) {
          note += 1;
      }
      ```
    blanks:
      - ["&"]
    answer: "`int&` : `note` désigne l'élément lui-même, au lieu d'en être une copie."
  - key: trous-collection
    format: fill-in
    question: |-
      Complète pour afficher chaque prénom :
      ```cpp
      std::vector<std::string> prenoms{"Ada", "Alan"};

      for (const auto& prenom : ___) {
          std::println("{}", prenom);
      }
      ```
    blanks:
      - [prenoms]
    answer: "La collection parcourue s'écrit après les deux-points : `prenoms`."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour lire chaque élément sans le copier ni pouvoir le modifier :
      ```cpp
      for (___ auto& mot : mots) {
          std::println("{}", mot);
      }
      ```
    blanks:
      - [const]
    answer: "`const auto&` : une référence en lecture seule."
  - key: code-somme
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          int somme = 0;
          for (int note : notes) {
              somme += note;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`36`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "`12`", correct: false}
    answer: "`36` : la boucle passe par chaque note, et les additionne."
    check:
      output: "36"
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (int x : v) {
              x *= 2;
          }
          for (int x : v) {
              std::print("{}", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`123`", correct: true}
      - {text: "`246`", correct: false}
      - {text: "`222`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`123` : dans la première boucle, `x` est une copie de chaque élément. La doubler ne change pas `v`."
    check:
      output: "123"
  - key: code-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (int& x : v) {
              x *= 2;
          }
          for (int x : v) {
              std::print("{}", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`246`", correct: true}
      - {text: "`123`", correct: false}
      - {text: "`222`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`246` : avec `int&`, `x` désigne l'élément lui-même. Chaque élément de `v` est doublé."
    check:
      output: "246"
  - key: code-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string mot = "abc";
          for (char c : mot) {
              std::print("{}-", c);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`a-b-c-fin`", correct: true}
      - {text: "`abc-fin`", correct: false}
      - {text: "`a-b-c fin`", correct: false}
      - {text: "`abc-abc-abc-fin`", correct: false}
    answer: "`a-b-c-fin` : la boucle parcourt la chaîne caractère par caractère, et affiche un tiret après chacun."
    check:
      output: "a-b-c-fin"
  - key: bug-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 0 0`, et affiche `12 15 9`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          for (int note : notes) {
              note = 0;
          }
          std::println("{} {} {}", notes[0], notes[1], notes[2]);
      }
      ```
    choices:
      - {text: "Écrire `for (int& note : notes)`", correct: true}
      - {text: "Écrire `for (const int& note : notes)`", correct: false}
      - {text: "Écrire `for (int note = 0 : notes)`", correct: false}
      - {text: "Écrire `for (int note : &notes)`", correct: false}
    answer: |-
      ```cpp
      for (int& note : notes) {
          note = 0;
      }
      ```
      Sans `&`, `note` est une copie : la mettre à zéro ne touche pas le tableau. Avec `const`, le code ne compilerait
      pas.
  - key: bug-const-modifie
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only reference 'prix' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> tarifs{10, 20};
          for (const auto& prix : tarifs) {
              prix = prix * 2;
          }
          std::println("{} {}", tarifs[0], tarifs[1]);
      }
      ```
    choices:
      - {text: "Retirer `const` : écrire `auto& prix`", correct: true}
      - {text: "Retirer `&` : écrire `const auto prix`", correct: false}
      - {text: "Retirer `auto` : écrire `const& prix`", correct: false}
      - {text: "Retirer les deux : écrire `auto prix`", correct: false}
    answer: |-
      ```cpp
      for (auto& prix : tarifs) {
      ```
      `const` interdit de modifier l'élément. Pour le modifier, il faut une référence non constante ; sans `&`, on
      modifierait une copie.
  - key: bug-valeur-prise-pour-indice
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2 0 1`, les éléments du tableau, et affiche `1 2 0`. Pourquoi ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{2, 0, 1};
          for (int i : v) {
              std::print("{} ", v[i]);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`i` est déjà l'élément : `v[i]` s'en sert comme d'un indice", correct: true}
      - {text: "La boucle parcourt le tableau en commençant par la fin", correct: false}
      - {text: "`std::print` affiche les éléments dans l'ordre croissant", correct: false}
      - {text: "`i` est une copie, et `v[i]` lit la valeur d'origine", correct: false}
    answer: |-
      ```cpp
      for (int valeur : v) {
          std::print("{} ", valeur);
      }
      ```
      Une boucle sur un intervalle donne les valeurs, pas les positions. `v[i]` relit le tableau à l'indice 2, puis 0,
      puis 1 ; avec d'autres valeurs, il sortirait du tableau.
  - key: bug-entier-non-parcourable
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction affiche les nombres de 0 à 4 ?
      ```cpp
      #include <print>

      int main() {
          for (int i : 5) {
              std::println("{}", i);
          }
      }
      ```
    choices:
      - {text: "Écrire `for (int i = 0; i < 5; ++i)`", correct: true}
      - {text: "Écrire `for (int i : 0..5)`", correct: false}
      - {text: "Écrire `for (int i in 5)`", correct: false}
      - {text: "Écrire `for (int i : int{5})`", correct: false}
    answer: |-
      ```cpp
      for (int i = 0; i < 5; ++i) {
      ```
      Une boucle sur un intervalle parcourt une collection, et 5 n'en est pas une. Pour compter, on écrit un `for`
      classique (ou, depuis C++20, `std::views::iota(0, 5)`).
