notion: operateurs-bits
lesson: |-
  Un entier est une suite de **bits**. Les opérateurs **bit à bit** travaillent sur chacun d'eux, là où `&&` et
  `||` travaillent sur des valeurs vraies ou fausses.

  | Opérateur | Nom | Le bit du résultat vaut 1 si... | Exemple (4 bits) |
  |---|---|---|---|
  | `a & b` | ET | les deux bits valent 1 | `0b1100 & 0b1010` = `0b1000` |
  | `a \| b` | OU | l'un au moins vaut 1 | `0b1100 \| 0b1010` = `0b1110` |
  | `a ^ b` | OU exclusif | les deux bits diffèrent | `0b1100 ^ 0b1010` = `0b0110` |
  | `~a` | NON | le bit de `a` vaut 0 | `~0b1100` = `...0011` |
  | `a << n` | décalage à gauche | | `0b0011 << 2` = `0b1100` |
  | `a >> n` | décalage à droite | | `0b1100 >> 2` = `0b0011` |

  **Les décalages.** `a << n` décale les bits de `n` positions vers la gauche : c'est une **multiplication par
  2ⁿ**. `a >> n` décale vers la droite : une **division entière par 2ⁿ**.

  ```cpp
  1 << 3      // 8
  40 >> 2     // 10
  ```

  **Les masques.** Un masque est un entier dont on a choisi les bits à 1. `1u << n` a pour seul bit à 1 le bit de
  rang `n` (le rang 0 est celui des unités).

  | Opération | Écriture |
  |---|---|
  | Mettre le bit `n` à 1 | `x \|= (1u << n);` |
  | Mettre le bit `n` à 0 | `x &= ~(1u << n);` |
  | Inverser le bit `n` | `x ^= (1u << n);` |
  | Tester le bit `n` | `(x & (1u << n)) != 0` |

  **Les drapeaux.** On range ainsi plusieurs options dans un seul entier, une par bit :

  ```cpp
  constexpr unsigned lecture = 1u << 0;     // 1
  constexpr unsigned ecriture = 1u << 1;    // 2
  constexpr unsigned execution = 1u << 2;   // 4

  unsigned droits = lecture | ecriture;     // 3
  if (droits & ecriture) { /* autorisé */ }
  ```

  **Les pièges.**

  - **`&` n'est pas `&&`.** `&` combine des bits, et évalue toujours ses deux côtés ; `&&` combine des conditions,
    avec court-circuit. `4 & 2` vaut 0, alors que `4 && 2` est vrai.
  - **La priorité.** `==` passe **avant** `&` : `x & masque == 0` se lit `x & (masque == 0)`. On met toujours des
    parenthèses autour d'une opération sur les bits.
  - **Les types signés.** Décaler d'un nombre de bits **négatif, ou supérieur ou égal à la taille du type**, est
    un comportement indéfini. On manipule les bits avec des entiers **non signés**.
  - **`~` sur un petit type.** Un `unsigned char` est promu en `int` avant l'opération : `~x` a 32 bits.
  - **`^` n'est pas la puissance** : `2 ^ 3` vaut 1.

  **Les outils de C++20.** L'en-tête `<bit>` fournit `std::popcount` (le nombre de bits à 1),
  `std::has_single_bit` (une puissance de deux ?), `std::countl_zero`. Et `std::bitset<N>` offre un tableau de
  bits avec des indices.

  **En entretien** : « `&`, `|`, `^`, `~` agissent bit par bit ; `<<` et `>>` multiplient et divisent par deux.
  Avec un masque `1u << n`, je mets, j'efface ou je teste un bit. Je travaille en non signé, et je mets des
  parenthèses, car `==` est prioritaire sur `&`. »
cards:
  - key: et-ou
    format: course
    question: "Quelle différence entre `a & b` et `a && b` ?"
    choices:
      - {text: "`&` combine les bits un à un ; `&&` combine deux conditions, avec court-circuit", correct: true}
      - {text: "`&` combine deux conditions, avec court-circuit ; `&&` combine les bits un à un", correct: false}
      - {text: "`&` prend l'adresse de `b` ; `&&` prend l'adresse de l'adresse de `b`", correct: false}
      - {text: "Aucune : `&&` est seulement l'écriture recommandée de `&`", correct: false}
    answer: "`4 & 2` vaut 0 : aucun bit n'est commun. `4 && 2` est vrai : les deux sont non nuls. Et `&` évalue toujours ses deux opérandes."
  - key: decalage
    format: course
    question: "Que fait `x << 3` sur un entier non signé `x` ?"
    choices:
      - {text: "Il décale ses bits de trois positions à gauche : une multiplication par 8", correct: true}
      - {text: "Il décale ses bits de trois positions à droite : une division par 8", correct: false}
      - {text: "Il ajoute 3 à la valeur de `x`", correct: false}
      - {text: "Il affiche `x` trois fois sur la sortie standard", correct: false}
    answer: "Chaque position vers la gauche double la valeur. `x >> 3` divise par 8, en jetant les trois bits de droite."
  - key: masque
    format: course
    question: "Que vaut `1u << n` ?"
    choices:
      - {text: "Un entier dont le seul bit à 1 est celui de rang `n`", correct: true}
      - {text: "Un entier dont les `n` premiers bits sont à 1", correct: false}
      - {text: "Un entier dont tous les bits sont à 1, sauf celui de rang `n`", correct: false}
      - {text: "L'entier `n`, converti en non signé", correct: false}
    answer: "C'est le masque d'un bit : 1, 2, 4, 8... On le combine avec `|` pour mettre le bit, `& ~` pour l'effacer, `&` pour le tester."
  - key: priorite
    format: course
    question: "Comment le compilateur lit-il `x & masque == 0` ?"
    choices:
      - {text: "`x & (masque == 0)` : `==` est prioritaire sur `&`", correct: true}
      - {text: "`(x & masque) == 0` : `&` est prioritaire sur `==`", correct: false}
      - {text: "De gauche à droite, sans priorité entre les deux", correct: false}
      - {text: "Comme une erreur : il exige des parenthèses", correct: false}
    answer: "Les opérateurs bit à bit ont une priorité plus faible que les comparaisons. On écrit toujours `(x & masque) == 0`."
  - key: vf-xor-puissance
    format: true-false
    question: "`2 ^ 3` vaut 8."
    truth: false
    answer: "`^` est le OU exclusif : `0b10 ^ 0b11` vaut `0b01`, soit 1. La puissance se calcule avec `std::pow`, ou un décalage pour les puissances de deux."
  - key: vf-decalage-division
    format: true-false
    question: "Sur un entier non signé, `x >> 1` divise `x` par deux."
    truth: true
    answer: "Le bit de droite est perdu : c'est une division entière."
  - key: vf-decalage-trop-grand
    format: true-false
    question: "Décaler un `int` de 32 bits de 40 positions donne zéro."
    truth: false
    answer: "Décaler d'un nombre de positions supérieur ou égal à la taille du type est un comportement indéfini."
  - key: vf-xor-soi-meme
    format: true-false
    question: "`x ^ x` vaut toujours zéro."
    truth: true
    answer: "Chaque bit est comparé à lui-même : ils ne diffèrent jamais."
  - key: qcm-mettre
    format: multiple-choice
    question: "Quelle instruction met à 1 le bit de rang 3 de `x`, sans toucher aux autres ?"
    choices:
      - {text: "`x |= (1u << 3);`", correct: true}
      - {text: "`x &= (1u << 3);`", correct: false}
      - {text: "`x = (1u << 3);`", correct: false}
      - {text: "`x ^= ~(1u << 3);`", correct: false}
    answer: "Le OU avec le masque force ce bit à 1, et laisse les autres intacts. `&=` effacerait tous les autres bits."
  - key: qcm-effacer
    format: multiple-choice
    question: "Quelle instruction met à 0 le bit de rang 2 de `x`, sans toucher aux autres ?"
    choices:
      - {text: "`x &= ~(1u << 2);`", correct: true}
      - {text: "`x |= ~(1u << 2);`", correct: false}
      - {text: "`x &= (1u << 2);`", correct: false}
      - {text: "`x -= 2;`", correct: false}
    answer: "`~(1u << 2)` a tous ses bits à 1, sauf celui de rang 2. Le ET garde les autres bits, et efface celui-là."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle expression dit si le bit de rang 4 de `x` est à 1 ?"
    choices:
      - {text: "`(x & (1u << 4)) != 0`", correct: true}
      - {text: "`x & 1u << 4 != 0`", correct: false}
      - {text: "`(x | (1u << 4)) != 0`", correct: false}
      - {text: "`x == 4`", correct: false}
    answer: "Le ET isole le bit. Sans parenthèses, `!=` puis `<<` passeraient avant `&`. Avec `|`, le résultat serait toujours non nul."
  - key: qcm-popcount
    format: multiple-choice
    question: "Quelle fonction de C++20 compte les bits à 1 d'un entier non signé ?"
    choices:
      - {text: "`std::popcount`", correct: true}
      - {text: "`std::bit_count`", correct: false}
      - {text: "`std::count`", correct: false}
      - {text: "`std::bits`", correct: false}
    answer: "`std::popcount`, de l'en-tête `<bit>`. `std::popcount(0b1011u)` vaut 3."
  - key: trous-ou
    format: fill-in
    question: |-
      Complète pour ajouter le droit d'écriture, sans retirer les autres :
      ```cpp
      droits ___= ecriture;
      ```
    blanks:
      - ["|"]
    answer: "`|=` met à 1 les bits du masque."
  - key: trous-decalage
    format: fill-in
    question: |-
      Complète pour que `masque` ait son seul bit à 1 au rang 5 :
      ```cpp
      unsigned masque = 1u ___ 5;
      ```
    blanks:
      - ["<<"]
    answer: "`1u << 5` vaut 32 : le bit de rang 5."
  - key: trous-non
    format: fill-in
    question: |-
      Complète pour retirer le droit d'écriture, sans toucher aux autres :
      ```cpp
      droits &= ___ecriture;
      ```
    blanks:
      - ["~"]
    answer: "`~ecriture` a tous ses bits à 1, sauf celui du droit : le ET l'efface."
  - key: trous-et
    format: fill-in
    question: |-
      Complète pour tester si le droit de lecture est présent :
      ```cpp
      if ((droits ___ lecture) != 0) {
          std::println("lecture autorisée");
      }
      ```
    blanks:
      - ["&"]
    answer: "`&` ne garde que les bits communs : le résultat est non nul si le droit est présent."
  - key: code-operations
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          unsigned a = 0b1100;
          unsigned b = 0b1010;
          std::println("{} {} {}", a & b, a | b, a ^ b);
      }
      ```
    choices:
      - {text: "`8 14 6`", correct: true}
      - {text: "`1 1 0`", correct: false}
      - {text: "`8 14 22`", correct: false}
      - {text: "`22 14 6`", correct: false}
    answer: "`8 14 6` : le ET garde le bit commun (`1000`), le OU réunit (`1110`), le OU exclusif garde ceux qui diffèrent (`0110`)."
    check:
      output: "8 14 6"
  - key: code-decalages
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          unsigned x = 5;
          std::println("{} {} {}", x << 2, x >> 1, 1u << 10);
      }
      ```
    choices:
      - {text: "`20 2 1024`", correct: true}
      - {text: "`7 4 11`", correct: false}
      - {text: "`20 2 20`", correct: false}
      - {text: "`10 2 1024`", correct: false}
    answer: "`20 2 1024` : `<< 2` multiplie par 4 ; `>> 1` divise par 2, en entier ; `1u << 10` est 2¹⁰."
    check:
      output: "20 2 1024"
  - key: code-drapeaux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          constexpr unsigned lecture = 1u << 0;
          constexpr unsigned ecriture = 1u << 1;
          constexpr unsigned execution = 1u << 2;

          unsigned droits = lecture | execution;
          droits |= ecriture;
          droits &= ~lecture;
          std::println("{} {}", droits, (droits & lecture) != 0);
      }
      ```
    choices:
      - {text: "`6 false`", correct: true}
      - {text: "`7 true`", correct: false}
      - {text: "`5 false`", correct: false}
      - {text: "`6 true`", correct: false}
    answer: "`6 false` : lecture et exécution donnent 5, l'écriture s'ajoute (7), puis la lecture est retirée (6). Son bit est à 0."
    check:
      output: "6 false"
  - key: code-et-logique
    format: code-output
    question: |-
      ```cpp
      #include <bit>
      #include <print>

      int main() {
          std::println("{} {} {}", 4 & 2, 4 && 2, std::popcount(0b1011u));
      }
      ```
    choices:
      - {text: "`0 true 3`", correct: true}
      - {text: "`6 true 3`", correct: false}
      - {text: "`0 false 3`", correct: false}
      - {text: "`0 true 11`", correct: false}
    answer: "`0 true 3` : 4 (`100`) et 2 (`010`) n'ont aucun bit commun. Comme conditions, les deux sont vrais. `0b1011` a trois bits à 1."
    check:
      output: "0 true 3"
  - key: bug-priorite
    format: bug-fix
    question: |-
      Ce programme devrait afficher `écriture autorisée` : le bit d'écriture est présent. Il affiche `lecture
      seule`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const unsigned ecriture = 2;
          const unsigned droits = 2;
          if (droits & ecriture == 2) {
              std::println("écriture autorisée");
          } else {
              std::println("lecture seule");
          }
      }
      ```
    choices:
      - {text: "Écrire `(droits & ecriture) == 2`", correct: true}
      - {text: "Écrire `droits && ecriture == 2`", correct: false}
      - {text: "Écrire `droits & (ecriture == 2)`", correct: false}
      - {text: "Écrire `droits | ecriture == 2`", correct: false}
    answer: |-
      ```cpp
      if ((droits & ecriture) == 2) {
      ```
      `==` est prioritaire sur `&` : le test se lisait `droits & (ecriture == 2)`, soit `2 & 1`, qui vaut 0. On
      met toujours des parenthèses autour d'une opération sur les bits.
  - key: bug-et-logique
    format: bug-fix
    question: |-
      Ce programme devrait afficher `8`, la valeur des bits communs à `a` et `b`. Il affiche `1`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      int main() {
          unsigned a = 0b1100;
          unsigned b = 0b1010;
          unsigned communs = a && b;
          std::println("{}", communs);
      }
      ```
    choices:
      - {text: "Écrire `a & b`", correct: true}
      - {text: "Écrire `a | b`", correct: false}
      - {text: "Écrire `a and b`", correct: false}
      - {text: "Écrire `a ^ b`", correct: false}
    answer: |-
      ```cpp
      unsigned communs = a & b;
      ```
      `&&` répond « les deux sont-ils non nuls ? » : `true`, converti en 1. Le ET bit à bit s'écrit `&`. Le mot
      `and` est un synonyme de `&&`.
  - key: bug-puissance
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1024`, soit deux puissance dix. Il affiche `8`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          unsigned taille = 2 ^ 10;
          std::println("{}", taille);
      }
      ```
    choices:
      - {text: "Écrire `1u << 10`", correct: true}
      - {text: "Écrire `2 ** 10`", correct: false}
      - {text: "Écrire `2 << 10`", correct: false}
      - {text: "Écrire `10 ^ 2`", correct: false}
    answer: |-
      ```cpp
      unsigned taille = 1u << 10;
      ```
      `^` est le OU exclusif : `0b0010 ^ 0b1010` vaut `0b1000`, soit 8. Une puissance de deux s'obtient par un
      décalage de 1. `2 << 10` vaudrait 2048, et `**` n'existe pas en C++.
  - key: bug-effacer
    format: bug-fix
    question: |-
      Ce programme devrait retirer le droit d'écriture et afficher `5`. Il affiche `2`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          const unsigned ecriture = 1u << 1;
          unsigned droits = 7;
          droits &= ecriture;
          std::println("{}", droits);
      }
      ```
    choices:
      - {text: "Écrire `droits &= ~ecriture;`", correct: true}
      - {text: "Écrire `droits |= ~ecriture;`", correct: false}
      - {text: "Écrire `droits ^= ~ecriture;`", correct: false}
      - {text: "Écrire `droits &= !ecriture;`", correct: false}
    answer: |-
      ```cpp
      droits &= ~ecriture;
      ```
      Le ET avec le masque ne garde que ce bit. Pour l'effacer, on fait le ET avec son complément, `~ecriture`.
      `!ecriture` est un NON logique : il vaut 0, et effacerait tout.
