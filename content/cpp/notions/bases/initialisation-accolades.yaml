notion: initialisation-accolades
lesson: |-
  Depuis C++11, les **accolades** initialisent n'importe quel type : c'est l'**initialisation uniforme**.

  ```cpp
  int age{43};
  double prix{9.99};
  char initiale{'A'};
  int compteur{};      // accolades vides : zéro
  ```

  Elles ont deux avantages sur `=` et sur les parenthèses.

  **1. Elles refusent les conversions qui perdent de l'information** (*narrowing conversions*) :

  ```cpp
  int a = 3.7;   // compile : a vaut 3, la décimale est perdue en silence
  int b{3.7};    // erreur de compilation
  ```

  Sont refusés : un nombre à virgule vers un entier, un entier trop grand pour le type visé (`char c{300};`), un
  nombre négatif vers un type non signé (`unsigned int u{-1};`). Sont acceptés les passages sans perte : `double d{3};`.

  **2. Vides, elles donnent une valeur nulle** : `int n{};` vaut 0, `double d{};` vaut 0.0, `bool b{};` vaut `false`.
  Une variable locale déclarée sans rien (`int n;`) n'a, elle, aucune valeur définie.

  Elles évitent aussi le piège des parenthèses vides : `int n();` déclare une fonction, `int n{};` une variable.

  **En entretien** : « J'initialise avec des accolades : le compilateur refuse alors les conversions qui perdent de
  l'information, au lieu de tronquer en silence. »
tour:
  - title: Initialiser avec des accolades
    text: |-
      Les accolades initialisent une variable comme `=`, avec un garde-fou en plus : elles refusent une valeur qui ne
      tient pas dans le type. `int n{3.7};` ne compile pas, alors que `int n = 3.7;` range 3 sans rien dire.

      Vides, elles donnent zéro : `int compteur{};`.

      Essaie : remplace `int tronque = 3.7;` par `int tronque{3.7};`, puis exécute. Le compilateur refuse.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int age{43};
              int compteur{};
              int tronque = 3.7;

              std::println("{} {} {}", age, compteur, tronque);
          }
      output: "43 0 3"
cards:
  - key: conversion-refusee
    format: course
    question: "Que fait le compilateur devant `int n{3.7};` ?"
    choices:
      - {text: "Il refuse le code : la conversion perdrait la partie décimale", correct: true}
      - {text: "Il compile, et `n` vaut 3 : la décimale est coupée", correct: false}
      - {text: "Il compile, et `n` vaut 4 : la valeur est arrondie", correct: false}
      - {text: "Il compile, et `n` devient un `double` qui vaut 3.7", correct: false}
    answer: |-
      Les accolades refusent une conversion qui perd de l'information : c'est une erreur de compilation. Avec `=`, le
      même code compile, et `n` vaut 3.
  - key: accolades-vides
    format: course
    question: "Que vaut `n` après `int n{};` ?"
    choices:
      - {text: "Zéro", correct: true}
      - {text: "Une valeur indéterminée", correct: false}
      - {text: "Rien : la variable n'existe pas encore", correct: false}
      - {text: "Rien : c'est une fonction qui est déclarée", correct: false}
    answer: |-
      Zéro. Des accolades vides donnent la valeur nulle du type : 0 pour un `int`, 0.0 pour un `double`, `false` pour
      un `bool`. C'est `int n;`, sans accolades, qui laisse une valeur indéterminée.
  - key: narrowing
    format: course
    question: Laquelle de ces conversions les accolades refusent-elles ?
    choices:
      - {text: "Un nombre à virgule vers un entier : `int n{2.5};`", correct: true}
      - {text: "Un entier vers un nombre à virgule : `double d{2};`", correct: false}
      - {text: "Un caractère vers un entier : `int n{'A'};`", correct: false}
      - {text: "Un petit entier vers un `char` : `char c{65};`", correct: false}
    answer: |-
      Les accolades refusent ce qui peut perdre de l'information : ici, la partie décimale. Les trois autres passent,
      car la valeur tient entière dans le type visé.
  - key: pourquoi-uniforme
    format: course
    question: Pourquoi parle-t-on d'initialisation « uniforme » ?
    choices:
      - {text: "La même écriture, avec des accolades, initialise tous les types", correct: true}
      - {text: "Toutes les variables d'un bloc reçoivent la même valeur", correct: false}
      - {text: "Les variables ainsi créées ont toutes la même taille", correct: false}
      - {text: "Le compilateur donne le même type à toutes les variables", correct: false}
    answer: |-
      Les accolades initialisent un `int`, une structure, un tableau ou un `std::vector` avec la même syntaxe. Avant
      C++11, chaque cas avait la sienne.
  - key: vf-egal-tronque
    format: true-false
    question: "`int n = 3.7;` compile, et `n` vaut 3."
    truth: true
    answer: "Avec `=`, la conversion de `double` vers `int` est permise : elle coupe la partie décimale, sans arrondir."
  - key: vf-accolades-double-entier
    format: true-false
    question: "`double d{3};` est refusé par le compilateur."
    truth: false
    answer: "Un `double` représente 3 exactement : rien n'est perdu, les accolades l'acceptent."
  - key: vf-negatif-non-signe
    format: true-false
    question: "`unsigned int u{-1};` est refusé par le compilateur."
    truth: true
    answer: "Un type non signé ne peut pas contenir -1 : la conversion changerait la valeur, les accolades la refusent."
  - key: vf-accolades-depuis-cpp11
    format: true-false
    question: L'initialisation par accolades d'un `int` existe depuis C++98.
    truth: false
    answer: "`int n{5};` date de C++11. Avant, les accolades ne servaient qu'aux tableaux et aux structures simples."
  - key: qcm-refuser-la-troncature
    format: multiple-choice
    question: Quelle écriture fait refuser par le compilateur une valeur à virgule rangée dans un `int` ?
    choices:
      - {text: "`int n{valeur};`", correct: true}
      - {text: "`int n = valeur;`", correct: false}
      - {text: "`int n(valeur);`", correct: false}
      - {text: "`int n; n = valeur;`", correct: false}
    answer: |-
      Seules les accolades refusent la conversion. Avec `=`, des parenthèses ou une affectation, la partie décimale est
      coupée en silence.
  - key: qcm-valeur-nulle-bool
    format: multiple-choice
    question: "Que vaut `pret` après `bool pret{};` ?"
    choices:
      - {text: "`false`", correct: true}
      - {text: "`true`", correct: false}
      - {text: "Une valeur indéterminée", correct: false}
      - {text: "Rien : le code ne compile pas", correct: false}
    answer: "`false` : des accolades vides donnent la valeur nulle du type, et celle d'un `bool` est `false`."
  - key: qcm-char-trop-grand
    format: multiple-choice
    question: "Pourquoi `char c{300};` ne compile-t-il pas ?"
    choices:
      - {text: "300 ne tient pas dans un `char` : la valeur serait changée", correct: true}
      - {text: "Un `char` ne s'initialise qu'avec un caractère entre apostrophes", correct: false}
      - {text: "Les accolades sont réservées aux types `int` et `double`", correct: false}
      - {text: "Un `char` ne peut pas recevoir de nombre pair", correct: false}
    answer: |-
      Un `char` fait un octet : il ne peut pas contenir 300. Les accolades refusent la conversion ; `char c{65};`, lui,
      compile, car 65 tient dans un `char`.
  - key: qcm-parentheses-ou-accolades
    format: multiple-choice
    question: "Quelle différence entre `int n();` et `int n{};` ?"
    choices:
      - {text: "Le premier déclare une fonction, le second une variable à zéro", correct: true}
      - {text: "Le premier déclare une variable à zéro, le second une fonction", correct: false}
      - {text: "Aucune : les deux déclarent une variable à zéro", correct: false}
      - {text: "Aucune : les deux déclarent une variable sans valeur définie", correct: false}
    answer: "`int n();` est la déclaration d'une fonction sans paramètre. Les accolades lèvent l'ambiguïté : `int n{};` est toujours une variable."
  - key: trous-zero
    format: fill-in
    question: |-
      Complète pour que `compteur` vaille zéro, avec des accolades :
      ```cpp
      int compteur___;
      ```
    blanks:
      - ["{}", "{0}"]
    answer: "`int compteur{};` : des accolades vides donnent zéro."
  - key: trous-prix
    format: fill-in
    question: |-
      Complète pour initialiser `prix` à 9.99 avec des accolades :
      ```cpp
      double prix___;
      ```
    blanks:
      - ["{9.99}"]
    answer: "`double prix{9.99};` : la valeur s'écrit entre les accolades, sans `=`."
  - key: trous-initiale
    format: fill-in
    question: |-
      Complète pour que `initiale` contienne la lettre A :
      ```cpp
      int age{43};
      char initiale{___};
      ```
    blanks:
      - ["'A'", "65"]
    answer: "`char initiale{'A'};` : un caractère s'écrit entre apostrophes, même entre accolades."
  - key: trous-valeur-tronquee
    format: fill-in
    question: |-
      Complète le commentaire avec la valeur de `n` :
      ```cpp
      int n = 3.7;   // compile : n vaut ___
      ```
    blanks:
      - ["3"]
    answer: "Avec `=`, la partie décimale est coupée : `n` vaut 3. Avec des accolades, le code ne compilerait pas."
  - key: code-valeurs-nulles
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a{};
          double b{};
          bool c{};
          std::println("{} {} {}", a, b, c);
      }
      ```
    choices:
      - {text: "`0 0 false`", correct: true}
      - {text: "`0 0 0`", correct: false}
      - {text: "`0 0.0 true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `0 0 false` : des accolades vides donnent la valeur nulle de chaque type. `std::println` écrit le `double` nul
      `0`, et le `bool` en toutes lettres.
    check:
      output: "0 0 false"
  - key: code-accolades-refus
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n{3.7};
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`3.7`", correct: false}
    answer: |-
      Ça ne compile pas : ranger 3.7 dans un `int` perdrait la partie décimale, et les accolades refusent cette
      conversion.
    check:
      compiles: false
  - key: code-egal-tronque
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 3.7;
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`3.7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : avec `=`, la conversion est permise. Elle coupe la partie décimale, sans arrondir à 4."
    check:
      output: "3"
  - key: code-char-vers-int
    format: code-output
    question: |-
      Le code du caractère `A` est 65.
      ```cpp
      #include <print>

      int main() {
          int code{'A'};
          char lettre{66};
          std::println("{} {}", code, lettre);
      }
      ```
    choices:
      - {text: "`65 B`", correct: true}
      - {text: "`A 66`", correct: false}
      - {text: "`65 66`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `65 B` : les deux conversions sont sans perte, les accolades les acceptent. `code` est un `int`, affiché comme un
      nombre ; `lettre` est un `char`, affiché comme un caractère.
    check:
      output: "65 B"
  - key: bug-age-a-virgule
    format: bug-fix
    question: |-
      Le compilateur répond « narrowing conversion of '4.35e+1' from 'double' to 'int' ». Quelle correction garde la
      valeur 43.5 ?
      ```cpp
      #include <print>

      int main() {
          int age{43.5};
          std::println("{}", age);
      }
      ```
    choices:
      - {text: "Déclarer `age` avec le type `double`", correct: true}
      - {text: "Remplacer les accolades par `=`", correct: false}
      - {text: "Remplacer les accolades par des parenthèses", correct: false}
      - {text: "Écrire `43,5` avec une virgule", correct: false}
    answer: |-
      ```cpp
      double age{43.5};
      ```
      Les accolades signalent que 43.5 ne tient pas dans un `int`. Passer à `=` ou aux parenthèses ferait taire
      l'erreur, mais `age` vaudrait 43 : le bon type est `double`.
  - key: bug-stock-negatif
    format: bug-fix
    question: |-
      Ce code ne compile pas. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          unsigned int ecart{-1};
          std::println("{}", ecart);
      }
      ```
    choices:
      - {text: "Un type non signé ne contient pas -1 : les accolades refusent la conversion", correct: true}
      - {text: "Le mot-clé `unsigned` ne s'écrit jamais devant `int`", correct: false}
      - {text: "Les accolades n'acceptent pas de signe moins devant un nombre", correct: false}
      - {text: "`std::println` ne sait pas afficher un entier non signé", correct: false}
    answer: |-
      ```cpp
      int ecart{-1};
      ```
      `unsigned int` ne représente que des entiers positifs ou nuls. Avec `=`, le code compilerait, et `ecart` vaudrait
      un nombre énorme : les accolades évitent cette surprise.
  - key: bug-troncature-silencieuse
    format: bug-fix
    question: |-
      Ce programme affiche `2` articles au lieu de signaler une quantité invalide. Quelle écriture aurait fait refuser
      ce code à la compilation ?
      ```cpp
      #include <print>

      int main() {
          int quantite = 2.9;
          std::println("{} articles", quantite);
      }
      ```
    choices:
      - {text: "`int quantite{2.9};`", correct: true}
      - {text: "`int quantite(2.9);`", correct: false}
      - {text: "`int quantite = (2.9);`", correct: false}
      - {text: "`int quantite; quantite = 2.9;`", correct: false}
    answer: |-
      ```cpp
      int quantite{2.9};   // erreur de compilation
      ```
      Seules les accolades refusent une conversion qui perd de l'information. Les trois autres écritures coupent la
      décimale en silence.
  - key: bug-fonction-ou-variable
    format: bug-fix
    question: |-
      Ce code ne compile pas : le compilateur dit que `total` est une fonction. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          double total();
          total = total + 9.99;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `double total{};`", correct: true}
      - {text: "Écrire `double total(void);`", correct: false}
      - {text: "Écrire `double total[];`", correct: false}
      - {text: "Écrire `double() total;`", correct: false}
    answer: |-
      ```cpp
      double total{};
      ```
      Des parenthèses vides déclarent une fonction. Des accolades vides déclarent une variable, qui vaut 0.0.
