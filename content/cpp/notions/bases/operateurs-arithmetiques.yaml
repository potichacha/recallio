notion: operateurs-arithmetiques
lesson: |-
  Les cinq opérateurs arithmétiques : `+`, `-`, `*`, `/` et `%` (le **modulo**, reste de la division entière).

  **La division dépend des types.**

  - Entre deux entiers, `/` est la **division entière** : `17 / 5` vaut 3. Elle **tronque vers zéro** : `-7 / 2` vaut
    -3, pas -4.
  - Dès qu'un opérande est à virgule, la division l'est aussi : `17 / 5.0` vaut 3.4.

  **Le modulo.**

  - `17 % 5` vaut 2 : le reste de la division de 17 par 5.
  - Il ne s'applique qu'aux **entiers** : `5.5 % 2` ne compile pas (pour les flottants, `std::fmod`).
  - Son résultat a le **signe du premier opérande** : `-7 % 2` vaut -1. Pour tester qu'un nombre est impair, on écrit
    donc `n % 2 != 0`, pas `n % 2 == 1`.
  - Les deux vont ensemble : `(a / b) * b + a % b` redonne toujours `a`.

  **La priorité.** `*`, `/` et `%` passent avant `+` et `-`, comme en mathématiques ; à priorité égale, on calcule de
  gauche à droite. `2 + 3 * 4` vaut 14, et `(2 + 3) * 4` vaut 20. Dans le doute, des parenthèses.

  **La division par zéro.** Entre entiers, c'est un **comportement indéfini** : en pratique, le programme plante.
  Entre flottants, le résultat est l'infini (`inf`). On vérifie donc le diviseur avant de diviser.

  **Usages classiques** : `n % 2 == 0` teste la parité, `n % 10` donne le dernier chiffre, `n / 10` le retire, et
  `secondes / 60` avec `secondes % 60` convertit en minutes et secondes.

  **En entretien** : « La division entière tronque vers zéro, et le modulo prend le signe du dividende. Diviser un
  entier par zéro est un comportement indéfini, pas une exception. »
tour:
  - title: Calculer
    text: |-
      Les opérateurs sont ceux des mathématiques : `+`, `-`, `*`, `/`, avec les mêmes priorités. Deux particularités :

      - entre deux entiers, `/` est la division **entière** : `17 / 5` vaut 3 ;
      - `%` donne le **reste** de cette division : `17 % 5` vaut 2.

      Ensemble, ils découpent un nombre : ici, des secondes en minutes et secondes.

      Essaie : remplace `200` par `3725`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int secondes = 200;

              std::println("{} min {} s", secondes / 60, secondes % 60);
              std::println("{}", 2 + 3 * 4);
              std::println("{}", (2 + 3) * 4);
          }
      output: |-
        3 min 20 s
        14
        20
    task:
      instructions: |-
        Ajoute les heures : fais afficher `1 h 2 min 5 s` pour 3725 secondes. Une heure fait 3600 secondes ; les
        minutes sont ce qui reste une fois les heures retirées.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int secondes = 3725;

              std::println("{} min {} s", secondes / 60, secondes % 60);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int secondes = 3725;

              std::println("{} h {} min {} s", secondes / 3600, secondes % 3600 / 60, secondes % 60);
          }
      output: "1 h 2 min 5 s"
cards:
  - key: role-du-modulo
    format: course
    question: "Que calcule l'opérateur `%` ?"
    choices:
      - {text: "Le reste de la division entière", correct: true}
      - {text: "Le pourcentage d'un nombre", correct: false}
      - {text: "Le quotient de la division entière", correct: false}
      - {text: "La puissance d'un nombre", correct: false}
    answer: "`%` est le modulo : `17 % 5` vaut 2, le reste de la division de 17 par 5. Le quotient, 3, est donné par `/`."
  - key: division-tronque-vers-zero
    format: course
    question: "Que vaut `-7 / 2` en C++ ?"
    choices:
      - {text: "-3 : la division entière tronque vers zéro", correct: true}
      - {text: "-4 : la division entière arrondit vers le bas", correct: false}
      - {text: "-3.5 : un opérande négatif donne une division à virgule", correct: false}
      - {text: "3 : la division entière ignore le signe", correct: false}
    answer: "-3. La division entière abandonne la partie décimale : elle tronque vers zéro, pour les nombres négatifs aussi."
  - key: signe-du-modulo
    format: course
    question: "Quel signe a le résultat de `a % b` ?"
    choices:
      - {text: "Celui de `a`, le premier opérande", correct: true}
      - {text: "Celui de `b`, le second opérande", correct: false}
      - {text: "Toujours positif ou nul", correct: false}
      - {text: "Toujours celui du plus grand des deux", correct: false}
    answer: "Le signe du dividende : `-7 % 2` vaut -1, et `7 % -2` vaut 1. C'est pourquoi `n % 2 == 1` rate les nombres impairs négatifs."
  - key: division-par-zero
    format: course
    question: Que se passe-t-il quand un programme divise un entier par zéro ?
    choices:
      - {text: "C'est un comportement indéfini : en pratique, le programme plante", correct: true}
      - {text: "Le résultat vaut zéro, et le programme continue", correct: false}
      - {text: "Une exception `std::division_by_zero` est levée", correct: false}
      - {text: "Le résultat vaut l'infini, comme pour les flottants", correct: false}
    answer: |-
      La norme ne définit rien : c'est un comportement indéfini. Sur les machines courantes, le processeur arrête le
      programme. C++ ne lève aucune exception ; c'est au code de vérifier le diviseur.
  - key: vf-modulo-flottants
    format: true-false
    question: "L'opérateur `%` s'applique à deux `double`."
    truth: false
    answer: "`%` n'accepte que des entiers. Pour des flottants, on appelle `std::fmod`."
  - key: vf-priorite
    format: true-false
    question: "`2 + 3 * 4` vaut 20."
    truth: false
    answer: "`*` passe avant `+` : 3 × 4 font 12, plus 2, soit 14. Il faudrait des parenthèses : `(2 + 3) * 4`."
  - key: vf-division-flottante
    format: true-false
    question: "`17 / 5.0` vaut 3.4."
    truth: true
    answer: "`5.0` est un `double` : `17` est converti, et la division garde la virgule."
  - key: vf-identite-division
    format: true-false
    question: "Pour deux entiers `a` et `b` non nul, `(a / b) * b + a % b` vaut toujours `a`."
    truth: true
    answer: "C'est ce qui lie les deux opérateurs : le quotient fois le diviseur, plus le reste, redonne le dividende."
  - key: qcm-parite
    format: multiple-choice
    question: Quelle expression teste que `n` est pair ?
    choices:
      - {text: "`n % 2 == 0`", correct: true}
      - {text: "`n / 2 == 0`", correct: false}
      - {text: "`n % 2 == 2`", correct: false}
      - {text: "`n * 2 == 0`", correct: false}
    answer: "Un nombre pair a un reste nul dans la division par 2. `n / 2 == 0` n'est vrai que pour -1, 0 et 1."
  - key: qcm-dernier-chiffre
    format: multiple-choice
    question: "Quelle expression donne le dernier chiffre de l'entier positif `n` ?"
    choices:
      - {text: "`n % 10`", correct: true}
      - {text: "`n / 10`", correct: false}
      - {text: "`n - 10`", correct: false}
      - {text: "`n % 2`", correct: false}
    answer: "`n % 10` : le reste de la division par 10. `n / 10`, lui, retire ce dernier chiffre."
  - key: qcm-associativite
    format: multiple-choice
    question: "Que vaut `20 / 4 * 2` ?"
    choices:
      - {text: "10", correct: true}
      - {text: "2", correct: false}
      - {text: "40", correct: false}
      - {text: "2.5", correct: false}
    answer: "`/` et `*` ont la même priorité : on calcule de gauche à droite. 20 / 4 font 5, fois 2, soit 10."
  - key: qcm-reste-flottant
    format: multiple-choice
    question: Quelle fonction donne le reste d'une division entre deux `double` ?
    choices:
      - {text: "`std::fmod`", correct: true}
      - {text: "`std::round`", correct: false}
      - {text: "`std::abs`", correct: false}
      - {text: "`std::pow`", correct: false}
    answer: "`std::fmod(5.5, 2.0)` vaut 1.5. Elle est déclarée dans `<cmath>`."
  - key: trous-modulo
    format: fill-in
    question: |-
      Complète pour obtenir le reste de la division de 17 par 5 :
      ```cpp
      int reste = 17 ___ 5;
      ```
    blanks:
      - ["%"]
    answer: "`17 % 5` vaut 2."
  - key: trous-quotient
    format: fill-in
    question: |-
      Complète pour convertir des secondes en minutes entières :
      ```cpp
      int minutes = secondes ___ 60;
      ```
    blanks:
      - ["/"]
    answer: "`secondes / 60` : la division entière donne le nombre de minutes complètes."
  - key: trous-valeur-division
    format: fill-in
    question: |-
      Complète le commentaire avec ce que le programme affiche :
      ```cpp
      std::println("{}", 17 / 5);   // affiche ___
      ```
    blanks:
      - ["3"]
    answer: "Entre deux entiers, la division est entière : 3."
  - key: trous-parite
    format: fill-in
    question: |-
      Complète pour tester que `n` est pair :
      ```cpp
      bool pair = n % ___ == 0;
      ```
    blanks:
      - ["2"]
    answer: "Un nombre pair est divisible par 2 : son reste est nul."
  - key: code-quotient-reste
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {}", 17 / 5, 17 % 5);
      }
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`3.4 2`", correct: false}
      - {text: "`2 3`", correct: false}
      - {text: "`3 0`", correct: false}
    answer: "`3 2` : 17 divisé par 5 donne 3, et il reste 2."
    check:
      output: "3 2"
  - key: code-negatifs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {}", -7 / 2, -7 % 2);
      }
      ```
    choices:
      - {text: "`-3 -1`", correct: true}
      - {text: "`-4 1`", correct: false}
      - {text: "`-3 1`", correct: false}
      - {text: "`-4 -1`", correct: false}
    answer: "`-3 -1` : la division tronque vers zéro, et le reste prend le signe du premier opérande. On vérifie : -3 × 2 + (-1) = -7."
    check:
      output: "-3 -1"
  - key: code-priorite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{}", 2 + 3 * 4 - 6 / 2);
      }
      ```
    choices:
      - {text: "`11`", correct: true}
      - {text: "`17`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "`4`", correct: false}
    answer: "`11` : la multiplication et la division d'abord (12 et 3), puis 2 + 12 - 3."
    check:
      output: "11"
  - key: code-chiffres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 1234;
          std::println("{} {}", n % 10, n / 10);
      }
      ```
    choices:
      - {text: "`4 123`", correct: true}
      - {text: "`123 4`", correct: false}
      - {text: "`4 123.4`", correct: false}
      - {text: "`1 234`", correct: false}
    answer: "`4 123` : `n % 10` isole le dernier chiffre, et `n / 10` le retire."
    check:
      output: "4 123"
  - key: bug-priorite-moyenne
    format: bug-fix
    question: |-
      Ce programme affiche `20` au lieu de `15`, la moyenne de 10 et de 20. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int a = 10;
          int b = 20;
          std::println("{}", a + b / 2);
      }
      ```
    choices:
      - {text: "Écrire `(a + b) / 2`", correct: true}
      - {text: "Écrire `a + (b / 2)`", correct: false}
      - {text: "Écrire `a / 2 + b`", correct: false}
      - {text: "Écrire `a + b % 2`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", (a + b) / 2);
      ```
      `/` passe avant `+` : sans parenthèses, seul `b` est divisé.
  - key: bug-modulo-double
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          double angle = 370.5;
          std::println("{}", angle % 360.0);
      }
      ```
    choices:
      - {text: "Écrire `std::fmod(angle, 360.0)`", correct: true}
      - {text: "Écrire `angle / 360.0`", correct: false}
      - {text: "Écrire `angle %% 360.0`", correct: false}
      - {text: "Écrire `angle mod 360.0`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::fmod(angle, 360.0));
      ```
      `%` n'existe que pour les entiers. `std::fmod` donne le reste entre flottants : ici 10.5.
  - key: bug-division-par-zero
    format: bug-fix
    question: |-
      Ce programme plante quand aucune note n'a été saisie. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int somme = 0;
          int nombre = 0;
          std::println("Moyenne : {}", somme / nombre);
      }
      ```
    choices:
      - {text: "Tester que `nombre` n'est pas nul avant de diviser", correct: true}
      - {text: "Entourer la division d'un `try` et d'un `catch`", correct: false}
      - {text: "Écrire `nombre / somme`, dans l'autre sens", correct: false}
      - {text: "Déclarer `somme` avec le type `unsigned int`", correct: false}
    answer: |-
      ```cpp
      if (nombre != 0) {
          std::println("Moyenne : {}", somme / nombre);
      }
      ```
      Diviser un entier par zéro est un comportement indéfini, pas une exception : un `catch` ne rattrape rien. On
      vérifie le diviseur avant.
  - key: bug-impair-negatif
    format: bug-fix
    question: |-
      Ce programme devrait afficher `impair` pour -3, et n'affiche rien. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int n = -3;
          if (n % 2 == 1) {
              std::println("impair");
          }
      }
      ```
    choices:
      - {text: "`-3 % 2` vaut -1 : le reste prend le signe de `n`", correct: true}
      - {text: "`-3 % 2` vaut 0 : un nombre négatif est toujours pair", correct: false}
      - {text: "`%` ne s'applique pas à un nombre négatif", correct: false}
      - {text: "`==` passe avant `%` dans la condition", correct: false}
    answer: |-
      ```cpp
      if (n % 2 != 0) {
      ```
      Le reste d'un nombre impair vaut 1 ou -1 selon son signe. Comparer à zéro marche dans les deux cas.
