notion: comparaison-logique
lesson: |-
  **Les comparaisons** donnent un `bool` : `==` (égal), `!=` (différent), `<`, `>`, `<=`, `>=`.

  **Les opérateurs logiques** combinent des `bool` :

  | Opérateur | Sens | Vrai quand |
  |---|---|---|
  | `a && b` | et | les deux sont vrais |
  | `a \|\| b` | ou | au moins un est vrai |
  | `!a` | non | `a` est faux |

  **L'évaluation en court-circuit.** `&&` et `||` évaluent leur opérande de gauche d'abord, et **s'arrêtent dès que le
  résultat est connu** : si `a` est faux, `a && b` est faux sans évaluer `b` ; si `a` est vrai, `a || b` est vrai sans
  évaluer `b`. On s'en sert pour protéger une opération : `nombre != 0 && total / nombre > 10` ne divise jamais par
  zéro.

  **La priorité** : `!` d'abord, puis les comparaisons, puis `&&`, puis `||`. `a || b && c` se lit `a || (b && c)`.

  **Pièges classiques.**

  - **`=` au lieu de `==`** : `if (x = 5)` affecte 5 à `x`, puis teste 5, toujours vrai. `-Wall` le signale.
  - **Les comparaisons ne s'enchaînent pas** : `1 < x < 10` compile, mais calcule `(1 < x) < 10`. Le `bool` vaut 0 ou
    1 : c'est toujours vrai. On écrit `1 < x && x < 10`.
  - **`||` pour une exclusion** : `jour != 6 || jour != 7` est toujours vrai. « Ni l'un ni l'autre » s'écrit avec
    `&&`.
  - **`!` sans parenthèses** : `!age >= 18` nie `age` avant de comparer. On écrit `!(age >= 18)`, ou `age < 18`.

  **En entretien** : « `&&` et `||` court-circuitent : l'opérande de droite n'est évalué que s'il le faut. Je place donc
  la vérification avant l'opération qu'elle protège. »
tour:
  - title: Comparer et combiner
    text: |-
      Une comparaison donne un `bool` : `==` pour l'égalité (deux signes égal), `!=` pour la différence, et `<`, `>`,
      `<=`, `>=`.

      On combine les conditions avec `&&` (et), `||` (ou) et `!` (non). `&&` et `||` s'arrêtent dès que le résultat
      est connu : c'est le court-circuit.

      Attention : `1 < x < 10` ne teste pas un encadrement. Il faut `1 < x && x < 10`.

      Essaie : remplace `25` par `70`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int age = 25;

              bool adulte = age >= 18;
              bool actif = age >= 18 && age < 65;
              bool tarif_reduit = age < 12 || age >= 65;

              std::println("{} {} {}", adulte, actif, !tarif_reduit);
          }
      output: "true true true"
    task:
      instructions: |-
        Une année est bissextile si elle est divisible par 4 mais pas par 100, ou si elle est divisible par 400.
        Complète `bissextile` pour que le programme affiche `false true`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int annee = 1900;
              bool bissextile = annee % 4 == 0;
              std::print("{} ", bissextile);

              annee = 2024;
              bissextile = annee % 4 == 0;
              std::println("{}", bissextile);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int annee = 1900;
              bool bissextile = (annee % 4 == 0 && annee % 100 != 0) || annee % 400 == 0;
              std::print("{} ", bissextile);

              annee = 2024;
              bissextile = (annee % 4 == 0 && annee % 100 != 0) || annee % 400 == 0;
              std::println("{}", bissextile);
          }
      output: "false true"
cards:
  - key: court-circuit
    format: course
    question: "Qu'appelle-t-on l'évaluation en court-circuit de `a && b` ?"
    choices:
      - {text: "Si `a` est faux, `b` n'est pas évalué : le résultat est déjà connu", correct: true}
      - {text: "Si `a` est vrai, `b` n'est pas évalué : le résultat est déjà connu", correct: false}
      - {text: "`a` et `b` sont évalués en même temps, sur deux processeurs", correct: false}
      - {text: "`b` est évalué avant `a`, pour gagner du temps", correct: false}
    answer: "Avec un opérande de gauche faux, `&&` est faux quoi que vaille la droite : elle n'est pas évaluée. Pour `||`, c'est un opérande de gauche vrai qui suffit."
  - key: egal-ou-double-egal
    format: course
    question: "Quelle différence entre `=` et `==` ?"
    choices:
      - {text: "`=` affecte une valeur, `==` compare deux valeurs", correct: true}
      - {text: "`=` compare deux valeurs, `==` affecte une valeur", correct: false}
      - {text: "`=` compare des nombres, `==` compare des textes", correct: false}
      - {text: "Aucune dans une condition : les deux comparent", correct: false}
    answer: "`x = 5` range 5 dans `x` ; `x == 5` demande si `x` vaut 5. Dans un `if`, se tromper compile, et la condition devient l'affectation."
  - key: comparaisons-enchainees
    format: course
    question: "Pourquoi `1 < x < 10` ne teste-t-il pas que `x` est entre 1 et 10 ?"
    choices:
      - {text: "Il compare le booléen `1 < x`, qui vaut 0 ou 1, à 10", correct: true}
      - {text: "Il compare `x` à 10 d'abord, puis le résultat à 1", correct: false}
      - {text: "Il ne compile pas : deux `<` ne se suivent jamais", correct: false}
      - {text: "Il teste que `x` vaut exactement 1 ou exactement 10", correct: false}
    answer: "L'expression se lit `(1 < x) < 10`. Le `bool` devient 0 ou 1, toujours inférieur à 10 : le test est toujours vrai. Il faut `1 < x && x < 10`."
  - key: priorite-logique
    format: course
    question: "Comment se lit `a || b && c` ?"
    choices:
      - {text: "`a || (b && c)` : `&&` passe avant `||`", correct: true}
      - {text: "`(a || b) && c` : on lit de gauche à droite", correct: false}
      - {text: "`(a || b) && c` : `||` passe avant `&&`", correct: false}
      - {text: "Cela dépend du compilateur utilisé", correct: false}
    answer: "`&&` est prioritaire sur `||`, comme la multiplication sur l'addition. Des parenthèses rendent l'intention visible."
  - key: vf-comparaison-bool
    format: true-false
    question: Le résultat d'une comparaison est de type `bool`.
    truth: true
    answer: "`3 < 5` vaut `true`. Converti en entier, il donne 1."
  - key: vf-ou-court-circuit
    format: true-false
    question: "Dans `a || b`, si `a` est vrai, `b` est quand même évalué."
    truth: false
    answer: "Le résultat est déjà vrai : `||` court-circuite, et `b` n'est pas évalué."
  - key: vf-affectation-dans-if
    format: true-false
    question: "`if (x = 5)` compile."
    truth: true
    answer: "L'affectation est une expression, qui vaut 5 : la condition est toujours vraie. `-Wall` le signale."
  - key: vf-non-prioritaire
    format: true-false
    question: "`!a == b` nie la comparaison `a == b`."
    truth: false
    answer: "`!` passe avant `==` : l'expression se lit `(!a) == b`. Pour nier la comparaison : `!(a == b)`, ou `a != b`."
  - key: qcm-encadrement
    format: multiple-choice
    question: Quelle expression teste que `age` est compris entre 18 et 25 inclus ?
    choices:
      - {text: "`age >= 18 && age <= 25`", correct: true}
      - {text: "`18 <= age <= 25`", correct: false}
      - {text: "`age >= 18 || age <= 25`", correct: false}
      - {text: "`age >= 18, age <= 25`", correct: false}
    answer: "Deux comparaisons reliées par `&&`. `18 <= age <= 25` est toujours vrai, et avec `||` n'importe quel âge passe."
  - key: qcm-difference
    format: multiple-choice
    question: Quel opérateur teste que deux valeurs sont différentes ?
    choices:
      - {text: "`!=`", correct: true}
      - {text: "`<>`", correct: false}
      - {text: "`=!`", correct: false}
      - {text: "`!==`", correct: false}
    answer: "`!=`. `<>` vient de SQL et de Pascal, `!==` de JavaScript ; `a =! b` affecte à `a` la négation de `b`."
  - key: qcm-proteger-division
    format: multiple-choice
    question: Quelle condition ne divise jamais par zéro ?
    choices:
      - {text: "`n != 0 && total / n > 10`", correct: true}
      - {text: "`total / n > 10 && n != 0`", correct: false}
      - {text: "`n != 0 || total / n > 10`", correct: false}
      - {text: "`total / n > 10 || n != 0`", correct: false}
    answer: "Avec `&&`, si `n != 0` est faux, la division n'est pas évaluée. Dans l'autre ordre, elle l'est d'abord ; avec `||`, elle l'est justement quand `n` vaut zéro."
  - key: qcm-ni-samedi-ni-dimanche
    format: multiple-choice
    question: "Avec samedi = 6 et dimanche = 7, quelle expression teste que `jour` n'est ni l'un ni l'autre ?"
    choices:
      - {text: "`jour != 6 && jour != 7`", correct: true}
      - {text: "`jour != 6 || jour != 7`", correct: false}
      - {text: "`jour != 6 != 7`", correct: false}
      - {text: "`!jour == 6 && !jour == 7`", correct: false}
    answer: "« Ni l'un ni l'autre » veut dire différent de 6 **et** différent de 7. Avec `||`, la condition est toujours vraie : aucun jour ne vaut 6 et 7 à la fois."
  - key: trous-egalite
    format: fill-in
    question: |-
      Complète pour tester que `age` vaut 18 :
      ```cpp
      bool majorite = age ___ 18;
      ```
    blanks:
      - ["=="]
    answer: "`==` compare. Un seul `=` affecterait 18 à `age`."
  - key: trous-et
    format: fill-in
    question: |-
      Complète pour que `positifs` soit vrai quand `a` et `b` sont tous deux positifs :
      ```cpp
      bool positifs = a > 0 ___ b > 0;
      ```
    blanks:
      - ["&&", "and"]
    answer: "`&&` est le « et » logique : vrai quand les deux conditions le sont."
  - key: trous-non
    format: fill-in
    question: |-
      Complète pour que `ferme` soit le contraire de `ouvert` :
      ```cpp
      bool ferme = ___ouvert;
      ```
    blanks:
      - ["!"]
    answer: "`!` est la négation : `!ouvert` est vrai quand `ouvert` est faux."
  - key: trous-different
    format: fill-in
    question: |-
      Complète pour ne diviser que si `nombre` est différent de zéro :
      ```cpp
      if (nombre ___ 0) {
          std::println("{}", total / nombre);
      }
      ```
    blanks:
      - ["!="]
    answer: "`!=` teste la différence."
  - key: code-et-ou
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          std::println("{} {}", x > 3 && x > 10, x == 5 || x > 100);
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `&&` exige les deux conditions, et `x > 10` est fausse. `||` se contente d'une seule, et `x == 5` est vraie."
    check:
      output: "false true"
  - key: code-enchainement
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 50;
          std::println("{}", 1 < x < 10);
      }
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`50`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true` : `1 < x` vaut `true`, converti en 1, et `1 < 10` est vrai. L'expression ne teste pas un encadrement."
    check:
      output: "true"
  - key: code-court-circuit
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int appels = 0;

      bool verifier() {
          ++appels;
          return true;
      }

      int main() {
          bool a = false && verifier();
          bool b = true || verifier();
          std::println("{} {} {}", a, b, appels);
      }
      ```
    choices:
      - {text: "`false true 0`", correct: true}
      - {text: "`false true 2`", correct: false}
      - {text: "`false true 1`", correct: false}
      - {text: "`true true 2`", correct: false}
    answer: "`false true 0` : dans les deux cas, l'opérande de gauche décide du résultat. `verifier` n'est jamais appelée."
    check:
      output: "false true 0"
  - key: code-affectation-dans-if
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 0;
          if (x = 5) {
              std::println("oui {}", x);
          } else {
              std::println("non {}", x);
          }
      }
      ```
    choices:
      - {text: "`oui 5`", correct: true}
      - {text: "`non 0`", correct: false}
      - {text: "`oui 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`oui 5` : `x = 5` est une affectation. Elle modifie `x`, et vaut 5, non nul : la condition est vraie."
    check:
      output: "oui 5"
  - key: bug-affectation-dans-if
    format: bug-fix
    question: |-
      Ce programme affiche `Majeur depuis peu` pour quelqu'un de 40 ans. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int age = 40;
          if (age = 18) {
              std::println("Majeur depuis peu");
          }
      }
      ```
    choices:
      - {text: "Écrire `age == 18`", correct: true}
      - {text: "Écrire `age := 18`", correct: false}
      - {text: "Écrire `age =! 18`", correct: false}
      - {text: "Écrire `18 = age`", correct: false}
    answer: |-
      ```cpp
      if (age == 18) {
      ```
      `age = 18` affecte 18 à `age` et vaut 18, non nul : la condition est toujours vraie. La comparaison s'écrit avec
      deux signes égal.
  - key: bug-encadrement
    format: bug-fix
    question: |-
      Ce programme affiche `Tarif jeune` pour quelqu'un de 60 ans. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int age = 60;
          if (18 <= age <= 25) {
              std::println("Tarif jeune");
          }
      }
      ```
    choices:
      - {text: "`18 <= age` donne un booléen, 0 ou 1, toujours inférieur à 25", correct: true}
      - {text: "`<=` s'écrit `=<` en C++, et le test est inversé", correct: false}
      - {text: "La condition compare `age` à 18 seulement, et ignore 25", correct: false}
      - {text: "Un `if` n'accepte qu'une seule comparaison à la fois", correct: false}
    answer: |-
      ```cpp
      if (age >= 18 && age <= 25) {
      ```
      Les comparaisons ne s'enchaînent pas : il en faut deux, reliées par `&&`.
  - key: bug-ordre-du-court-circuit
    format: bug-fix
    question: |-
      Ce programme plante quand `nombre` vaut zéro, malgré le test. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 50;
          int nombre = 0;
          if (total / nombre > 10 && nombre != 0) {
              std::println("Moyenne élevée");
          }
      }
      ```
    choices:
      - {text: "Écrire `nombre != 0 && total / nombre > 10`", correct: true}
      - {text: "Écrire `total / nombre > 10 || nombre != 0`", correct: false}
      - {text: "Écrire `total / nombre > 10 & nombre != 0`", correct: false}
      - {text: "Écrire `!(total / nombre > 10) && nombre != 0`", correct: false}
    answer: |-
      ```cpp
      if (nombre != 0 && total / nombre > 10) {
      ```
      `&&` évalue la gauche d'abord : la division doit venir après le test qui la protège. Si `nombre` vaut zéro, la
      droite n'est alors pas évaluée.
  - key: bug-ou-toujours-vrai
    format: bug-fix
    question: |-
      Samedi vaut 6 et dimanche 7. Ce programme affiche `Jour ouvré` un samedi. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int jour = 6;
          if (jour != 6 || jour != 7) {
              std::println("Jour ouvré");
          }
      }
      ```
    choices:
      - {text: "Remplacer `||` par `&&`", correct: true}
      - {text: "Remplacer `!=` par `==`", correct: false}
      - {text: "Remplacer `||` par `|`", correct: false}
      - {text: "Inverser les deux comparaisons", correct: false}
    answer: |-
      ```cpp
      if (jour != 6 && jour != 7) {
      ```
      Un samedi, `jour != 7` est vrai : avec `||`, cela suffit. Aucun jour ne vaut 6 et 7 à la fois, la condition est
      donc toujours vraie. « Ni samedi ni dimanche » s'écrit avec `&&`.
