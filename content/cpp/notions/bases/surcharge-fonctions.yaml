notion: surcharge-fonctions
lesson: |-
  **Surcharger** une fonction, c'est en définir plusieurs **du même nom**, qui diffèrent par leurs **paramètres** :
  leur nombre, ou leurs types.

  ```cpp
  int aire(int cote);                    // un carré
  int aire(int largeur, int hauteur);    // un rectangle

  void afficher(int valeur);
  void afficher(double valeur);
  ```

  À chaque appel, le compilateur choisit la version qui convient aux arguments : c'est la **résolution de
  surcharge**, faite à la compilation.

  **Ce qui distingue deux surcharges** : la liste des paramètres. **Le type de retour ne suffit pas** : `int lire();`
  et `double lire();` ne peuvent pas coexister.

  **Comment le compilateur choisit.** Pour chaque argument, il préfère, dans l'ordre :

  1. une correspondance **exacte** ;
  2. une **promotion** : `char`, `short` ou `bool` vers `int`, `float` vers `double` ;
  3. une **conversion** : `int` vers `double`, `double` vers `int`, `int` vers `long`...

  Si une version est meilleure que toutes les autres, elle est appelée. Si deux versions se valent, l'appel est
  **ambigu** : erreur de compilation.

  **Pièges classiques.**

  - **L'ambiguïté** : avec `f(long)` et `f(double)`, l'appel `f(5)` demande une conversion dans les deux cas. Le
    compilateur refuse de choisir.
  - **Le littéral de chaîne et `bool`** : avec `f(bool)` et `f(const std::string&)`, l'appel `f("abc")` choisit
    **`bool`**. Convertir un pointeur en `bool` est une conversion du langage, préférée à celle qui construit une
    `std::string`.
  - **Le type de l'argument décide**, pas ce qu'on avait en tête : `afficher(7 / 2)` appelle la version `int`.

  **En entretien** : « La surcharge se résout à la compilation, sur les paramètres seulement. Correspondance exacte,
  puis promotion, puis conversion ; à égalité, l'appel est ambigu. »
tour:
  - title: Surcharger une fonction
    text: |-
      Deux fonctions peuvent porter le même nom, si leurs paramètres diffèrent. Le compilateur choisit d'après les
      arguments de l'appel : leur nombre, puis leurs types.

      Ici, `aire` a deux versions, pour un carré et pour un rectangle, et `decrire` une version par type.

      Essaie : appelle `decrire('a')`, puis exécute. Un `char` est promu en `int` : c'est la version « entier » qui
      répond.
    example:
      files:
        main.cpp: |-
          #include <print>

          int aire(int cote) {
              return cote * cote;
          }

          int aire(int largeur, int hauteur) {
              return largeur * hauteur;
          }

          void decrire(int valeur) {
              std::println("entier : {}", valeur);
          }

          void decrire(double valeur) {
              std::println("réel : {}", valeur);
          }

          int main() {
              std::println("{} {}", aire(3), aire(3, 4));
              decrire(42);
              decrire(4.2);
          }
      output: |-
        9 12
        entier : 42
        réel : 4.2
cards:
  - key: definition-surcharge
    format: course
    question: Qu'est-ce que surcharger une fonction ?
    choices:
      - {text: "Définir plusieurs fonctions du même nom, avec des paramètres différents", correct: true}
      - {text: "Redéfinir une fonction de la bibliothèque standard pour la remplacer", correct: false}
      - {text: "Appeler une fonction avec plus d'arguments qu'elle n'en attend", correct: false}
      - {text: "Définir une fonction qui s'appelle elle-même", correct: false}
    answer: "Plusieurs fonctions partagent un nom, et le compilateur choisit laquelle appeler d'après les arguments. Une fonction qui s'appelle elle-même est récursive."
  - key: type-de-retour
    format: course
    question: Deux fonctions du même nom peuvent-elles ne différer que par leur type de retour ?
    choices:
      - {text: "Non : la surcharge se fait sur les paramètres seulement", correct: true}
      - {text: "Oui : le compilateur choisit d'après la variable qui reçoit le résultat", correct: false}
      - {text: "Oui, si l'un des deux types de retour est `void`", correct: false}
      - {text: "Oui, si les deux fonctions sont dans le même fichier", correct: false}
    answer: "Un appel peut ignorer la valeur renvoyée : le compilateur n'aurait aucun moyen de choisir. Deux déclarations qui ne diffèrent que par le type de retour sont une erreur."
  - key: ordre-de-preference
    format: course
    question: Dans quel ordre le compilateur préfère-t-il les versions d'une fonction surchargée ?
    choices:
      - {text: "Correspondance exacte, puis promotion, puis conversion", correct: true}
      - {text: "Conversion, puis promotion, puis correspondance exacte", correct: false}
      - {text: "La première déclarée dans le fichier, puis les suivantes", correct: false}
      - {text: "Celle qui a le moins de paramètres, puis les autres", correct: false}
    answer: "Une version qui prend exactement le type de l'argument l'emporte. À défaut, une promotion (`char` vers `int`, `float` vers `double`) bat une conversion (`int` vers `double`)."
  - key: quand-la-resolution
    format: course
    question: À quel moment la version d'une fonction surchargée est-elle choisie ?
    choices:
      - {text: "À la compilation, d'après le type des arguments", correct: true}
      - {text: "À l'exécution, d'après la valeur des arguments", correct: false}
      - {text: "À l'édition des liens, d'après l'ordre des fichiers", correct: false}
      - {text: "Au premier appel, puis elle ne change plus", correct: false}
    answer: "La résolution de surcharge est faite par le compilateur, sur les types. Elle ne coûte rien à l'exécution, et ne dépend jamais des valeurs."
  - key: vf-nombre-de-parametres
    format: true-false
    question: Deux surcharges peuvent différer seulement par leur nombre de paramètres.
    truth: true
    answer: "`aire(int)` et `aire(int, int)` sont deux fonctions distinctes."
  - key: vf-retour-seul
    format: true-false
    question: "`int lire();` et `double lire();` peuvent coexister dans le même programme."
    truth: false
    answer: Elles ne diffèrent que par leur type de retour, ce qui ne suffit pas à les distinguer.
  - key: vf-char-vers-int
    format: true-false
    question: "Avec `f(int)` et `f(double)`, l'appel `f('a')` choisit la version `int`."
    truth: true
    answer: "`char` vers `int` est une promotion, préférée à la conversion `char` vers `double`."
  - key: vf-ambiguite-execution
    format: true-false
    question: Un appel ambigu entre deux surcharges est détecté à l'exécution.
    truth: false
    answer: "C'est une erreur de compilation : le compilateur refuse de choisir."
  - key: qcm-surcharges-valides
    format: multiple-choice
    question: "Laquelle de ces déclarations peut accompagner `void afficher(int valeur);` ?"
    choices:
      - {text: "`void afficher(double valeur);`", correct: true}
      - {text: "`int afficher(int valeur);`", correct: false}
      - {text: "`void afficher(int nombre);`", correct: false}
      - {text: "`double afficher(int valeur);`", correct: false}
    answer: "Seul le type du paramètre change la signature. Un autre type de retour est une erreur, et un autre nom de paramètre redéclare la même fonction."
  - key: qcm-appel-ambigu
    format: multiple-choice
    question: "Avec `void f(long n);` et `void f(double n);`, que se passe-t-il à l'appel `f(5)` ?"
    choices:
      - {text: "L'appel est ambigu : le code ne compile pas", correct: true}
      - {text: "La version `long` est appelée, car 5 est un entier", correct: false}
      - {text: "La version `double` est appelée, car elle est plus large", correct: false}
      - {text: "La première version déclarée est appelée", correct: false}
    answer: "5 est un `int`. Le passer en `long` ou en `double` est dans les deux cas une conversion : aucune version n'est meilleure. `f(5L)` ou `f(5.0)` lève l'ambiguïté."
  - key: qcm-litteral-de-chaine
    format: multiple-choice
    question: "Avec `void f(bool b);` et `void f(const std::string& s);`, quelle version l'appel `f(\"abc\")` choisit-il ?"
    choices:
      - {text: "La version `bool`", correct: true}
      - {text: "La version `std::string`", correct: false}
      - {text: "Aucune : l'appel est ambigu", correct: false}
      - {text: "Aucune : le littéral n'est ni l'un ni l'autre", correct: false}
    answer: "Le littéral est un tableau de caractères, converti en pointeur puis en `bool` par le langage. Cette conversion standard est préférée à celle qui construit une `std::string`."
  - key: qcm-float-vers-double
    format: multiple-choice
    question: "Avec `void f(int n);` et `void f(double d);`, quelle version l'appel `f(2.5f)` choisit-il ?"
    choices:
      - {text: "La version `double` : `float` y est promu", correct: true}
      - {text: "La version `int` : `float` est plus petit qu'un `double`", correct: false}
      - {text: "Aucune : l'appel est ambigu", correct: false}
      - {text: "Aucune : il n'existe pas de version `float`", correct: false}
    answer: "`float` vers `double` est une promotion, sans perte. Elle bat la conversion `float` vers `int`."
  - key: trous-meme-nom
    format: fill-in
    question: |-
      Complète pour que la seconde fonction surcharge la première :
      ```cpp
      int aire(int cote) {
          return cote * cote;
      }

      int ___(int largeur, int hauteur) {
          return largeur * hauteur;
      }
      ```
    blanks:
      - [aire]
    answer: "Une surcharge porte le même nom, `aire`, avec d'autres paramètres."
  - key: trous-type-du-parametre
    format: fill-in
    question: |-
      Complète pour ajouter une version qui reçoit un nombre à virgule sans le tronquer :
      ```cpp
      void afficher(int valeur);
      void afficher(___ valeur);
      ```
    blanks:
      - [double, float]
    answer: "`void afficher(double valeur);` : l'appel `afficher(3.5)` la choisira."
  - key: trous-version-appelee
    format: fill-in
    question: |-
      Complète le commentaire avec le type du paramètre de la version appelée :
      ```cpp
      void afficher(int valeur);
      void afficher(double valeur);

      afficher(7 / 2);   // appelle la version ___
      ```
    blanks:
      - [int]
    answer: "`7 / 2` est une division entière : un `int`. C'est le type de l'argument qui décide."
  - key: trous-lever-l-ambiguite
    format: fill-in
    question: |-
      Complète pour forcer l'appel de la version `double` :
      ```cpp
      void f(long n);
      void f(double n);

      int valeur = 5;
      f(___<double>(valeur));
      ```
    blanks:
      - [static_cast]
    answer: "`static_cast<double>(valeur)` donne un argument de type `double` : la correspondance est exacte."
  - key: code-int-ou-double
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void afficher(int) {
          std::println("entier");
      }

      void afficher(double) {
          std::println("réel");
      }

      int main() {
          afficher(3);
          afficher(3.0);
      }
      ```
    choices:
      - text: |-
          ```
          entier
          réel
          ```
        correct: true
      - text: |-
          ```
          entier
          entier
          ```
        correct: false
      - text: |-
          ```
          réel
          réel
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      entier
      réel
      ```
      `3` est un `int`, `3.0` un `double` : chaque appel trouve une correspondance exacte.
    check:
      output: |-
        entier
        réel
  - key: code-promotion-char
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void afficher(int) {
          std::println("entier");
      }

      void afficher(double) {
          std::println("réel");
      }

      int main() {
          afficher('a');
          afficher(7 / 2);
      }
      ```
    choices:
      - text: |-
          ```
          entier
          entier
          ```
        correct: true
      - text: |-
          ```
          entier
          réel
          ```
        correct: false
      - text: |-
          ```
          réel
          réel
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      entier
      entier
      ```
      Un `char` est promu en `int`, ce qui bat la conversion en `double`. Et `7 / 2` est une division entière : un
      `int`.
    check:
      output: |-
        entier
        entier
  - key: code-bool-ou-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      void decrire(bool) {
          std::println("booléen");
      }

      void decrire(const std::string&) {
          std::println("chaîne");
      }

      int main() {
          decrire("abc");
      }
      ```
    choices:
      - {text: "`booléen`", correct: true}
      - {text: "`chaîne`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`booléen` : le littéral est un tableau de caractères, pas une `std::string`. Sa conversion en `bool` appartient au langage, et passe avant celle qui construit une `std::string`."
    check:
      output: "booléen"
  - key: code-nombre-de-parametres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int aire(int cote) {
          return cote * cote;
      }

      int aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }

      int main() {
          std::println("{} {}", aire(3), aire(3, 4));
      }
      ```
    choices:
      - {text: "`9 12`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`12 12`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9 12` : le nombre d'arguments suffit à choisir. Un argument appelle la version du carré, deux celle du rectangle."
    check:
      output: "9 12"
  - key: bug-retour-seul
    format: bug-fix
    question: |-
      Le compilateur répond « ambiguating new declaration of 'double moitie(int)' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int moitie(int n) {
          return n / 2;
      }

      double moitie(int n) {
          return n / 2.0;
      }

      int main() {
          std::println("{}", moitie(7));
      }
      ```
    choices:
      - {text: "Donner un autre nom à la seconde fonction", correct: true}
      - {text: "Renommer le paramètre de la seconde fonction", correct: false}
      - {text: "Déclarer la seconde fonction avant la première", correct: false}
      - {text: "Ranger le résultat de l'appel dans un `double`", correct: false}
    answer: |-
      ```cpp
      double moitie_exacte(int n) {
          return n / 2.0;
      }
      ```
      Les deux fonctions ont les mêmes paramètres : le type de retour ne suffit pas à les distinguer. Il faut un autre
      nom, ou un autre type de paramètre.
  - key: bug-appel-ambigu
    format: bug-fix
    question: |-
      Le compilateur répond « call of overloaded 'afficher(int)' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(long valeur) {
          std::println("long : {}", valeur);
      }

      void afficher(double valeur) {
          std::println("double : {}", valeur);
      }

      int main() {
          afficher(5);
      }
      ```
    choices:
      - {text: "Ajouter une version `void afficher(int valeur)`", correct: true}
      - {text: "Supprimer le paramètre des deux versions", correct: false}
      - {text: "Échanger l'ordre des deux versions", correct: false}
      - {text: "Écrire l'appel `afficher(int 5)`", correct: false}
    answer: |-
      ```cpp
      void afficher(int valeur) {
          std::println("int : {}", valeur);
      }
      ```
      5 est un `int`, et les deux versions demandent une conversion. Une version `int` donne une correspondance
      exacte ; `afficher(5L)` ou `afficher(5.0)` choisirait aussi sans ambiguïté.
  - key: bug-litteral-pris-pour-bool
    format: bug-fix
    question: |-
      Ce programme affiche `option : true` au lieu de `nom : Ada`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      void configurer(bool option) {
          std::println("option : {}", option);
      }

      void configurer(const std::string& nom) {
          std::println("nom : {}", nom);
      }

      int main() {
          configurer("Ada");
      }
      ```
    choices:
      - {text: "Écrire l'appel `configurer(std::string(\"Ada\"))`", correct: true}
      - {text: "Écrire l'appel `configurer('Ada')`", correct: false}
      - {text: "Déclarer la version `std::string` en premier", correct: false}
      - {text: "Retirer `const` du paramètre `nom`", correct: false}
    answer: |-
      ```cpp
      configurer(std::string("Ada"));
      ```
      Le littéral `"Ada"` se convertit en `bool` avant de se convertir en `std::string`. Passer une vraie
      `std::string` donne une correspondance exacte ; ajouter une version `const char*` règle le problème pour tous
      les appels.
  - key: bug-type-de-l-argument
    format: bug-fix
    question: |-
      Ce programme affiche `entier : 3` au lieu de `réel : 3.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(int valeur) {
          std::println("entier : {}", valeur);
      }

      void afficher(double valeur) {
          std::println("réel : {}", valeur);
      }

      int main() {
          afficher(7 / 2);
      }
      ```
    choices:
      - {text: "Écrire l'appel `afficher(7 / 2.0)`", correct: true}
      - {text: "Supprimer le corps de la version `int`", correct: false}
      - {text: "Déclarer la version `double` en premier", correct: false}
      - {text: "Écrire l'appel `afficher((7 / 2))`", correct: false}
    answer: |-
      ```cpp
      afficher(7 / 2.0);
      ```
      `7 / 2` est un `int` : la version `int` correspond exactement. Le compilateur choisit d'après le type de
      l'argument, et l'ordre des déclarations ne compte pas.
