notion: declaration-definition
lesson: |-
  C++ distingue deux choses pour une fonction.

  - La **déclaration**, ou **prototype**, annonce qu'elle existe : son type de retour, son nom, ses paramètres. Elle
    finit par un **point-virgule**, sans corps.
  - La **définition** donne son **corps**, entre accolades.

  ```cpp
  int carre(int n);          // déclaration

  int main() {
      std::println("{}", carre(4));   // l'appel compile : carre est déclarée
  }

  int carre(int n) {         // définition
      return n * n;
  }
  ```

  **Pourquoi deux.** Le compilateur lit le fichier de haut en bas : pour compiler un appel, il lui suffit de connaître
  la déclaration. Le code de la fonction peut être plus bas, ou dans un autre fichier ; c'est l'**éditeur de liens**
  qui relie l'appel à la définition.

  **Les règles.**

  - On peut **déclarer** une fonction autant de fois qu'on veut, mais la **définir une seule fois** dans le programme
    (*One Definition Rule*).
  - Les noms des paramètres sont facultatifs dans une déclaration : `int carre(int);`. On les garde : ils documentent.
  - Une définition est aussi une déclaration : une fonction définie avant son premier appel n'a pas besoin de
    prototype.
  - Deux fonctions qui s'appellent l'une l'autre ont besoin d'au moins un prototype.

  **Dans un projet**, les déclarations vont dans un **en-tête** (`.hpp`), les définitions dans un fichier source
  (`.cpp`). Les fichiers qui appellent la fonction incluent l'en-tête.

  **Les deux erreurs à reconnaître.**

  - « **was not declared in this scope** », à la **compilation** : l'appel vient avant toute déclaration.
  - « **undefined reference** », à l'**édition des liens** : la fonction est déclarée, mais définie nulle part, ou
    définie avec d'autres paramètres que ceux du prototype.

  **En entretien** : « La déclaration suffit au compilateur, la définition est nécessaire à l'éditeur de liens. D'où le
  découpage en-tête et source. »
tour:
  - title: Déclarer, puis définir
    text: |-
      Le compilateur lit de haut en bas : une fonction doit être connue avant son appel. Mais il suffit de la
      **déclarer** : son prototype, terminé par un point-virgule. Sa **définition**, avec le corps, peut venir plus
      bas.

      C'est ce qui permet de ranger `main` en haut du fichier, et, dans un projet, de mettre les déclarations dans un
      en-tête et le code dans un autre fichier.

      Essaie : supprime la ligne du prototype, puis exécute. Le compilateur ne connaît plus `carre` au moment de
      l'appel.
    example:
      files:
        main.cpp: |-
          #include <print>

          int carre(int n);

          int main() {
              std::println("{}", carre(4));
          }

          int carre(int n) {
              return n * n;
          }
      output: "16"
cards:
  - key: declaration-ou-definition
    format: course
    question: Quelle différence entre la déclaration et la définition d'une fonction ?
    choices:
      - {text: "La déclaration annonce sa signature, la définition donne son corps", correct: true}
      - {text: "La déclaration donne son corps, la définition annonce sa signature", correct: false}
      - {text: "La déclaration est dans `main`, la définition hors de `main`", correct: false}
      - {text: "Aucune : ce sont deux mots pour la même chose", correct: false}
    answer: "La déclaration (le prototype) dit comment appeler la fonction, et finit par un point-virgule. La définition contient le code, entre accolades."
  - key: pourquoi-un-prototype
    format: course
    question: Pourquoi déclarer une fonction avant de l'appeler, si elle est définie plus bas ?
    choices:
      - {text: "Le compilateur lit de haut en bas, et doit connaître sa signature à l'appel", correct: true}
      - {text: "L'éditeur de liens refuse les fonctions définies après `main`", correct: false}
      - {text: "Une fonction sans prototype s'exécute plus lentement", correct: false}
      - {text: "Le prototype réserve la mémoire dont la fonction a besoin", correct: false}
    answer: "Pour compiler un appel, le compilateur vérifie les arguments et le type de retour : il lui faut la déclaration. Le corps peut être n'importe où ailleurs."
  - key: une-seule-definition
    format: course
    question: Combien de fois une fonction peut-elle être définie dans un programme ?
    choices:
      - {text: "Une seule fois, mais on peut la déclarer plusieurs fois", correct: true}
      - {text: "Une seule fois, et on ne peut la déclarer qu'une fois aussi", correct: false}
      - {text: "Une fois par fichier source qui l'appelle", correct: false}
      - {text: "Autant de fois qu'on veut, si le corps est identique", correct: false}
    answer: "C'est la règle de la définition unique (*One Definition Rule*). Les déclarations, elles, se répètent sans dommage : chaque fichier qui inclut l'en-tête en voit une."
  - key: reference-indefinie
    format: course
    question: Que signifie l'erreur « undefined reference to `carre(int)` » ?
    choices:
      - {text: "La fonction est déclarée, mais l'éditeur de liens ne trouve pas sa définition", correct: true}
      - {text: "La fonction est appelée avant d'être déclarée dans le fichier", correct: false}
      - {text: "La fonction renvoie une référence vers une variable détruite", correct: false}
      - {text: "La fonction est appelée avec un argument du mauvais type", correct: false}
    answer: "L'appel a compilé grâce à la déclaration. C'est à l'édition des liens que le corps manque : définition oubliée, fichier non compilé, ou paramètres différents de ceux du prototype."
  - key: vf-point-virgule
    format: true-false
    question: Une déclaration de fonction se termine par un point-virgule.
    truth: true
    answer: "`int carre(int n);` : le point-virgule remplace le corps."
  - key: vf-noms-des-parametres
    format: true-false
    question: Dans une déclaration, les noms des paramètres sont obligatoires.
    truth: false
    answer: "`int carre(int);` suffit au compilateur. On garde les noms pour le lecteur."
  - key: vf-declarer-deux-fois
    format: true-false
    question: Déclarer deux fois la même fonction dans un fichier est une erreur de compilation.
    truth: false
    answer: Les déclarations identiques se répètent sans erreur. C'est la définition qui doit être unique.
  - key: vf-definition-vaut-declaration
    format: true-false
    question: Une fonction définie avant son premier appel n'a pas besoin de prototype.
    truth: true
    answer: Une définition est aussi une déclaration.
  - key: qcm-prototype
    format: multiple-choice
    question: "Laquelle de ces lignes est le prototype d'une fonction `aire` ?"
    choices:
      - {text: "`int aire(int largeur, int hauteur);`", correct: true}
      - {text: "`int aire(int largeur, int hauteur) { }`", correct: false}
      - {text: "`int aire = largeur * hauteur;`", correct: false}
      - {text: "`aire(3, 4);`", correct: false}
    answer: "Le type de retour, le nom, les paramètres, puis un point-virgule. Avec des accolades, c'est une définition ; `aire(3, 4);` est un appel."
  - key: qcm-en-tete
    format: multiple-choice
    question: Dans un projet, où range-t-on les déclarations des fonctions partagées entre plusieurs fichiers ?
    choices:
      - {text: "Dans un fichier d'en-tête, `.hpp`", correct: true}
      - {text: "Dans le fichier qui contient `main`", correct: false}
      - {text: "Dans chaque fichier `.cpp`, recopiées à la main", correct: false}
      - {text: "Dans le fichier exécutable", correct: false}
    answer: "L'en-tête contient les déclarations ; chaque fichier qui en a besoin l'inclut. Les définitions vont dans un fichier `.cpp`."
  - key: qcm-non-declaree
    format: multiple-choice
    question: À quel moment apparaît l'erreur « 'carre' was not declared in this scope » ?
    choices:
      - {text: "À la compilation", correct: true}
      - {text: "À l'édition des liens", correct: false}
      - {text: "À l'exécution", correct: false}
      - {text: "Au lancement de l'éditeur", correct: false}
    answer: "À la compilation : le compilateur rencontre un nom qu'il ne connaît pas. « undefined reference », elle, vient de l'édition des liens."
  - key: qcm-appels-mutuels
    format: multiple-choice
    question: "Deux fonctions `pair` et `impair` s'appellent l'une l'autre. Que faut-il pour que le fichier compile ?"
    choices:
      - {text: "Le prototype d'au moins l'une des deux, avant la définition de l'autre", correct: true}
      - {text: "Définir les deux fonctions sur la même ligne", correct: false}
      - {text: "Définir les deux fonctions à l'intérieur de `main`", correct: false}
      - {text: "Rien : l'ordre des fonctions n'a pas d'importance", correct: false}
    answer: "La première définie appelle la seconde, qui n'est pas encore connue. Un prototype de la seconde, placé avant, résout le problème."
  - key: trous-point-virgule
    format: fill-in
    question: |-
      Complète pour que cette ligne soit une déclaration :
      ```cpp
      int carre(int n)___
      ```
    blanks:
      - [";"]
    answer: "Une déclaration finit par un point-virgule, sans corps."
  - key: trous-type-prototype
    format: fill-in
    question: |-
      Complète le prototype, d'après la définition :
      ```cpp
      ___ moyenne(int a, int b);

      double moyenne(int a, int b) {
          return (a + b) / 2.0;
      }
      ```
    blanks:
      - [double]
    answer: "Le prototype reprend le type de retour de la définition : `double`."
  - key: trous-parametre-prototype
    format: fill-in
    question: |-
      Complète le prototype, écrit sans noms de paramètres :
      ```cpp
      int aire(int, ___);

      int aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }
      ```
    blanks:
      - [int]
    answer: "Seuls les types comptent dans un prototype : `int aire(int, int);`."
  - key: trous-include
    format: fill-in
    question: |-
      Les déclarations sont dans `calcul.hpp`. Complète pour que `main.cpp` les connaisse :
      ```cpp
      #___ "calcul.hpp"

      int main() {
          std::println("{}", carre(4));
      }
      ```
    blanks:
      - [include]
    answer: "`#include \"calcul.hpp\"` recopie les déclarations de l'en-tête dans le fichier."
  - key: code-prototype
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int doubler(int n);

      int main() {
          std::println("{}", doubler(21));
      }

      int doubler(int n) {
          return n * 2;
      }
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`21`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`42` : le prototype suffit pour compiler l'appel. La définition, plus bas, est reliée à l'édition des liens."
    check:
      output: "42"
  - key: code-sans-prototype
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{}", doubler(21));
      }

      int doubler(int n) {
          return n * 2;
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`42`", correct: false}
      - {text: "`21`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : au moment de l'appel, `doubler` n'a pas encore été déclarée. Le compilateur ne regarde pas plus bas."
    check:
      compiles: false
  - key: code-declarations-repetees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int tripler(int n);
      int tripler(int);
      int tripler(int valeur);

      int main() {
          std::println("{}", tripler(5));
      }

      int tripler(int n) {
          return n * 3;
      }
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`45`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`15` : les trois lignes déclarent la même fonction. Les noms des paramètres n'en font pas partie, et se répéter n'est pas une erreur. Il n'y a qu'une définition."
    check:
      output: "15"
  - key: code-appels-mutuels
    format: code-output
    question: |-
      ```cpp
      #include <print>

      bool est_pair(int n);

      bool est_impair(int n) {
          if (n == 0) {
              return false;
          }
          return est_pair(n - 1);
      }

      bool est_pair(int n) {
          if (n == 0) {
              return true;
          }
          return est_impair(n - 1);
      }

      int main() {
          std::println("{} {}", est_pair(4), est_pair(3));
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false true`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true false` : chaque appel retire 1 et passe la main à l'autre fonction, jusqu'à zéro. Le prototype de `est_pair` permet à `est_impair` de l'appeler avant sa définition."
    check:
      output: "true false"
  - key: bug-appel-avant-declaration
    format: bug-fix
    question: |-
      Le compilateur répond « 'aire' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          std::println("{}", aire(3, 4));
      }

      int aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }
      ```
    choices:
      - {text: "Ajouter `int aire(int largeur, int hauteur);` avant `main`", correct: true}
      - {text: "Ajouter `int aire;` avant `main`", correct: false}
      - {text: "Ajouter `using aire;` avant `main`", correct: false}
      - {text: "Ajouter `#include <aire>` en haut du fichier", correct: false}
    answer: |-
      ```cpp
      int aire(int largeur, int hauteur);
      ```
      Le prototype, placé avant `main`, fait connaître la fonction au compilateur. Déplacer la définition avant `main`
      marche aussi.
  - key: bug-jamais-definie
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `remise(int)` ». Pourquoi ?
      ```cpp
      #include <print>

      int remise(int prix);

      int main() {
          std::println("{}", remise(100));
      }
      ```
    choices:
      - {text: "La fonction est déclarée, mais son corps n'est écrit nulle part", correct: true}
      - {text: "La fonction est appelée avec un argument du mauvais type", correct: false}
      - {text: "La fonction doit être déclarée après `main`, pas avant", correct: false}
      - {text: "Le prototype ne doit pas finir par un point-virgule", correct: false}
    answer: |-
      ```cpp
      int remise(int prix) {
          return prix - 10;
      }
      ```
      Le prototype a suffi au compilateur. L'éditeur de liens, lui, cherche le code de la fonction, et ne le trouve
      pas.
  - key: bug-prototype-sans-point-virgule
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int carre(int n)

      int main() {
          std::println("{}", carre(4));
      }

      int carre(int n) {
          return n * n;
      }
      ```
    choices:
      - {text: "Ajouter un point-virgule à la fin du prototype", correct: true}
      - {text: "Ajouter des accolades vides à la fin du prototype", correct: false}
      - {text: "Retirer le type de retour du prototype", correct: false}
      - {text: "Retirer le paramètre du prototype", correct: false}
    answer: |-
      ```cpp
      int carre(int n);
      ```
      Sans point-virgule, le compilateur lit la suite comme la continuation de la déclaration. Des accolades vides en
      feraient une seconde définition.
  - key: bug-signatures-differentes
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `moyenne(int, int)` ». Pourquoi ?
      ```cpp
      #include <print>

      double moyenne(int a, int b);

      int main() {
          std::println("{}", moyenne(15, 16));
      }

      double moyenne(double a, double b) {
          return (a + b) / 2;
      }
      ```
    choices:
      - {text: "La définition n'a pas les paramètres du prototype : c'est une autre fonction", correct: true}
      - {text: "La définition doit être écrite avant `main`, comme le prototype", correct: false}
      - {text: "Le prototype et la définition ne peuvent pas avoir le même nom", correct: false}
      - {text: "Une fonction qui renvoie un `double` ne peut pas recevoir des entiers", correct: false}
    answer: |-
      ```cpp
      double moyenne(double a, double b);
      ```
      `moyenne(int, int)` et `moyenne(double, double)` sont deux fonctions différentes. L'appel vise la première, qui
      n'est définie nulle part. Le prototype doit reprendre exactement les paramètres de la définition.
