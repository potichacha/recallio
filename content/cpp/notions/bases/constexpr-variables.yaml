notion: constexpr-variables
lesson: |-
  `constexpr` déclare une constante dont la valeur est **connue à la compilation**. C'est plus fort que `const`,
  qui promet seulement que la variable ne sera plus modifiée.

  ```cpp
  constexpr int taille_max = 100;          // calculée par le compilateur
  constexpr double tva = 0.2;
  constexpr int total = taille_max * 2;    // une expression de constantes convient
  ```

  **`const` ou `constexpr` ?**

  ```cpp
  int saisie = lire();
  const int limite = saisie;        // permis : fixée à l'exécution, puis figée
  constexpr int borne = saisie;     // erreur : saisie n'est pas connue à la compilation
  ```

  | | `const` | `constexpr` |
  |---|---|---|
  | Modifiable après l'initialisation | non | non |
  | Valeur connue à la compilation | pas forcément | **toujours** |
  | Utilisable comme taille de tableau, argument de template, `static_assert` | seulement si elle est initialisée par une constante | oui |

  Une variable `constexpr` est aussi `const` : on ne peut pas la modifier.

  **Ce qu'on peut mettre à droite.** Une **expression constante** : des littéraux, d'autres `constexpr`, des
  opérations sur eux, et des appels à des fonctions `constexpr`. Pas une saisie, ni le résultat d'une fonction
  ordinaire.

  **À quoi ça sert.**

  - Là où le langage **exige** une valeur de compilation : la taille d'un `std::array`, un `case` de `switch`, un
    `static_assert`.

    ```cpp
    constexpr std::size_t places = 4;
    std::array<int, places> sieges{};
    static_assert(places > 0);
    ```

  - À **remplacer les macros** : `constexpr int taille_max = 100;` a un type et une portée, ce que
    `#define TAILLE_MAX 100` n'a pas.
  - À garantir qu'un calcul **ne coûte rien à l'exécution** : le résultat est déjà dans le programme.

  **Les types permis.** Les types fondamentaux, les pointeurs, `std::array`, `std::string_view`, et les classes
  dont le constructeur est `constexpr`. Une variable `constexpr std::string` ou `std::vector` n'est pas possible :
  ces types allouent de la mémoire, qui ne peut pas survivre à la compilation.

  **La règle pratique.** Une constante dont la valeur est écrite dans le code : `constexpr`. Une valeur calculée à
  l'exécution, qu'on ne veut plus modifier : `const`.

  **En entretien** : « `const` dit "je ne modifie plus", `constexpr` dit "connu à la compilation". Une `constexpr`
  peut servir de taille de tableau ou d'argument de template, et remplace avantageusement une macro. »
tour:
  - title: Connu à la compilation
    text: |-
      `const` promet qu'une variable ne changera plus. `constexpr` va plus loin : sa valeur est calculée **par le
      compilateur**, avant même que le programme ne démarre.

      On peut donc s'en servir là où le langage exige une valeur connue d'avance, comme la taille d'un
      `std::array`.

      Essaie : remplace `constexpr` par `int` tout court dans la déclaration de `places`, puis exécute. Le
      compilateur refuse la taille du tableau.
    example:
      files:
        main.cpp: |-
          #include <array>
          #include <print>

          int main() {
              constexpr int places = 4;
              constexpr int rangees = 3;
              constexpr int total = places * rangees;

              std::array<int, total> sieges{};
              std::println("{} sièges", sieges.size());
          }
      output: "12 sièges"
cards:
  - key: definition
    format: course
    question: "Que garantit `constexpr` sur une variable ?"
    choices:
      - {text: "Que sa valeur est connue à la compilation, et ne change plus", correct: true}
      - {text: "Que sa valeur est calculée au premier usage, puis gardée", correct: false}
      - {text: "Que sa valeur peut changer, mais seulement dans la même fonction", correct: false}
      - {text: "Que sa valeur est partagée entre tous les fichiers du programme", correct: false}
    answer: "Le compilateur calcule lui-même la valeur. Une variable `constexpr` est aussi `const`."
  - key: const-ou-constexpr
    format: course
    question: "Quelle différence entre `const` et `constexpr` ?"
    choices:
      - {text: "`const` interdit la modification ; `constexpr` exige en plus une valeur connue à la compilation", correct: true}
      - {text: "`const` exige une valeur connue à la compilation ; `constexpr` interdit seulement la modification", correct: false}
      - {text: "`const` vaut pour les entiers ; `constexpr` vaut pour les nombres à virgule", correct: false}
      - {text: "Aucune : `constexpr` est l'ancien nom de `const`, gardé par compatibilité", correct: false}
    answer: "`const int n = lire();` est permis : la valeur vient de l'exécution, puis ne bouge plus. `constexpr int n = lire();` est refusé, sauf si `lire` est une fonction `constexpr`."
  - key: usage
    format: course
    question: "Où le langage exige-t-il une valeur connue à la compilation ?"
    choices:
      - {text: "Pour la taille d'un `std::array`", correct: true}
      - {text: "Pour la taille d'un `std::vector`", correct: false}
      - {text: "Pour l'argument d'un `std::println`", correct: false}
      - {text: "Pour la condition d'un `if`", correct: false}
    answer: "La taille d'un `std::array` fait partie de son type. Les arguments de template, les `case` d'un `switch` et les `static_assert` demandent aussi une expression constante."
  - key: macro
    format: course
    question: "Pourquoi préférer `constexpr int taille_max = 100;` à `#define TAILLE_MAX 100` ?"
    choices:
      - {text: "La constante a un type et une portée ; la macro n'est qu'un remplacement de texte", correct: true}
      - {text: "La constante occupe moins de mémoire que la macro à l'exécution", correct: false}
      - {text: "La macro est calculée à l'exécution, la constante à la compilation", correct: false}
      - {text: "La macro ne peut contenir que des chaînes de caractères", correct: false}
    answer: "Une macro ignore les espaces de noms et les portées, et n'apparaît pas dans le débogueur. Une `constexpr` est une vraie variable, vérifiée par le compilateur."
  - key: vf-modifiable
    format: true-false
    question: "Une variable `constexpr` peut être modifiée après sa déclaration."
    truth: false
    answer: "`constexpr` implique `const`. Toute affectation est refusée."
  - key: vf-saisie
    format: true-false
    question: "Une variable `constexpr` peut être initialisée avec une valeur lue au clavier."
    truth: false
    answer: "La valeur doit être connue du compilateur. Pour une valeur lue à l'exécution, on écrit `const`."
  - key: vf-expression
    format: true-false
    question: "`constexpr int aire = largeur * hauteur;` compile si `largeur` et `hauteur` sont elles-mêmes `constexpr`."
    truth: true
    answer: Une opération sur des constantes de compilation est une expression constante.
  - key: vf-string
    format: true-false
    question: "On peut déclarer une variable `constexpr std::string`."
    truth: false
    answer: "Une `std::string` alloue de la mémoire, qui ne peut pas survivre à la compilation. Pour un texte constant : `constexpr std::string_view`."
  - key: qcm-valide
    format: multiple-choice
    question: "Laquelle de ces déclarations compile, dans une fonction où `n` est un `int` lu au clavier ?"
    choices:
      - {text: "`constexpr int taille = 3 * 4;`", correct: true}
      - {text: "`constexpr int taille = n;`", correct: false}
      - {text: "`constexpr int taille = n * 2;`", correct: false}
      - {text: "`constexpr int taille;`", correct: false}
    answer: "`3 * 4` est une expression constante. `n` n'est connu qu'à l'exécution, et une `constexpr` doit toujours être initialisée."
  - key: qcm-texte
    format: multiple-choice
    question: "Comment déclares-tu un texte constant, connu à la compilation ?"
    choices:
      - {text: "`constexpr std::string_view nom = \"Recallio\";`", correct: true}
      - {text: "`constexpr std::string nom = \"Recallio\";`", correct: false}
      - {text: "`constexpr std::vector<char> nom = \"Recallio\";`", correct: false}
      - {text: "`constexpr auto nom = std::string{\"Recallio\"};`", correct: false}
    answer: "`std::string_view` désigne les caractères du littéral, sans allouer. `std::string` et `std::vector` allouent sur le tas."
  - key: qcm-static-assert
    format: multiple-choice
    question: "Que peut-on écrire dans un `static_assert`, vérifié à la compilation ?"
    choices:
      - {text: "Une condition sur des variables `constexpr`", correct: true}
      - {text: "Une condition sur une valeur lue au clavier", correct: false}
      - {text: "Une condition sur la taille d'un `std::vector`", correct: false}
      - {text: "Une condition sur l'heure courante", correct: false}
    answer: "`static_assert(places > 0);` est évalué par le compilateur : la condition doit être une expression constante."
  - key: qcm-choisir
    format: multiple-choice
    question: "Le nombre de jours d'une semaine est écrit en dur dans le code. Comment le déclares-tu ?"
    choices:
      - {text: "`constexpr int jours_par_semaine = 7;`", correct: true}
      - {text: "`int jours_par_semaine = 7;`", correct: false}
      - {text: "`#define jours_par_semaine = 7;`", correct: false}
      - {text: "`static int jours_par_semaine = 7;`", correct: false}
    answer: "Une valeur fixée dans le code est une constante de compilation : `constexpr` le dit, et la protège de toute modification."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que `places` puisse servir de taille au tableau :
      ```cpp
      ___ int places = 4;
      std::array<int, places> sieges{};
      ```
    blanks:
      - [constexpr, const]
    answer: "`constexpr` garantit une valeur de compilation. `const` convient aussi ici, car la variable est initialisée par un littéral."
  - key: trous-string-view
    format: fill-in
    question: |-
      Complète avec le type qui permet un texte `constexpr` :
      ```cpp
      constexpr std::___ nom = "Recallio";
      ```
    blanks:
      - [string_view]
    answer: "`std::string_view` ne possède pas les caractères : elle peut être `constexpr`."
  - key: trous-static-assert
    format: fill-in
    question: |-
      Complète pour vérifier la condition à la compilation :
      ```cpp
      constexpr int places = 4;
      ___(places > 0);
      ```
    blanks:
      - [static_assert]
    answer: "`static_assert` fait échouer la compilation si la condition est fausse."
  - key: trous-expression
    format: fill-in
    question: |-
      Complète pour que `total` soit, lui aussi, calculé à la compilation :
      ```cpp
      constexpr int prix = 12;
      constexpr int quantite = 3;
      ___ int total = prix * quantite;
      ```
    blanks:
      - [constexpr]
    answer: "Le produit de deux `constexpr` est une expression constante."
  - key: code-array
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          constexpr int lignes = 2;
          constexpr int colonnes = 5;
          std::array<int, lignes * colonnes> grille{};
          std::println("{} {}", grille.size(), grille[0]);
      }
      ```
    choices:
      - {text: "`10 0`", correct: true}
      - {text: "`7 0`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10 0` : `lignes * colonnes` est une expression constante, permise comme taille. Les accolades vides mettent les éléments à zéro."
    check:
      output: "10 0"
  - key: code-modifier
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          constexpr int limite = 10;
          limite = 20;
          std::println("{}", limite);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : une variable `constexpr` est constante. Le compilateur refuse l'affectation (« assignment of read-only variable »)."
    check:
      compiles: false
  - key: code-non-constante
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int saisie = 5;
          constexpr int double_saisie = saisie * 2;
          std::println("{}", double_saisie);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : `saisie` est une variable ordinaire, dont la valeur n'est pas une constante de compilation. Avec `const int saisie = 5;`, le programme afficherait `10`."
    check:
      compiles: false
  - key: code-static-assert
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          constexpr int minutes = 90;
          constexpr int heures = minutes / 60;
          constexpr int reste = minutes % 60;
          static_assert(heures == 1);
          std::println("{}h{}", heures, reste);
      }
      ```
    choices:
      - {text: "`1h30`", correct: true}
      - {text: "`1.5h0`", correct: false}
      - {text: "`2h30`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1h30` : la division entière et le modulo sont calculés à la compilation. Le `static_assert` est vrai, donc sans effet."
    check:
      output: "1h30"
  - key: bug-taille-variable
    format: bug-fix
    question: |-
      Le compilateur refuse la taille du tableau : « the value of 'places' is not usable in a constant expression ».
      Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          int places = 4;
          std::array<int, places> sieges{};
          std::println("{}", sieges.size());
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int places = 4;`", correct: true}
      - {text: "Déclarer `static int places = 4;`", correct: false}
      - {text: "Déclarer `unsigned places = 4;`", correct: false}
      - {text: "Déclarer `auto places = 4;`", correct: false}
    answer: |-
      ```cpp
      constexpr int places = 4;
      ```
      La taille d'un `std::array` doit être connue à la compilation. Une variable ordinaire, même initialisée par
      un littéral, peut changer : elle ne convient pas.
  - key: bug-constexpr-execution
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration de `seuil` : l'appel de `lire_seuil` n'est pas une expression constante.
      La valeur ne doit plus changer ensuite. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int lire_seuil() {
          return 42;
      }

      int main() {
          constexpr int seuil = lire_seuil();
          std::println("{}", seuil);
      }
      ```
    choices:
      - {text: "Déclarer `const int seuil = lire_seuil();`", correct: true}
      - {text: "Déclarer `constexpr auto seuil = lire_seuil();`", correct: false}
      - {text: "Déclarer `constexpr static int seuil = lire_seuil();`", correct: false}
      - {text: "Déclarer `constexpr int seuil = &lire_seuil;`", correct: false}
    answer: |-
      ```cpp
      const int seuil = lire_seuil();
      ```
      `lire_seuil` est une fonction ordinaire : son résultat n'existe qu'à l'exécution. `const` fige la valeur une
      fois lue. L'autre voie est de déclarer la fonction elle-même `constexpr`.
  - key: bug-constexpr-string
    format: bug-fix
    question: |-
      Le compilateur refuse cette constante : une `std::string` aussi longue alloue de la mémoire, ce qui est
      interdit à une variable `constexpr`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          constexpr std::string titre = "Recallio, pour réviser ses entretiens techniques";
          std::println("{}", titre);
      }
      ```
    choices:
      - {text: "Déclarer `constexpr std::string_view titre`, avec `#include <string_view>`", correct: true}
      - {text: "Déclarer `constexpr std::string& titre`, par référence", correct: false}
      - {text: "Déclarer `constexpr std::string* titre`, par pointeur", correct: false}
      - {text: "Déclarer `constexpr std::vector<char> titre`, avec `#include <vector>`", correct: false}
    answer: |-
      ```cpp
      constexpr std::string_view titre = "Recallio, pour réviser ses entretiens techniques";
      ```
      Une vue désigne les caractères du littéral, qui vivent dans le programme : rien n'est alloué. Un `std::vector`
      allouerait aussi.
  - key: bug-non-initialisee
    format: bug-fix
    question: |-
      Le compilateur répond « uninitialized 'const taux' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          constexpr double taux;
          std::println("{}", taux);
      }
      ```
    choices:
      - {text: "Donner sa valeur à la déclaration : `constexpr double taux = 0.2;`", correct: true}
      - {text: "Affecter la valeur à la ligne suivante : `taux = 0.2;`", correct: false}
      - {text: "Déclarer `constexpr double taux();`, avec des parenthèses", correct: false}
      - {text: "Déclarer `constexpr static double taux;`", correct: false}
    answer: |-
      ```cpp
      constexpr double taux = 0.2;
      ```
      Une constante reçoit sa valeur à la déclaration, et nulle part ailleurs : l'affecter ensuite est interdit.
