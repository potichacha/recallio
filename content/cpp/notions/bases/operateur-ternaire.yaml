notion: operateur-ternaire
lesson: |-
  L'opérateur conditionnel `? :` choisit entre **deux valeurs** selon une condition. C'est le seul opérateur à
  trois opérandes : on l'appelle aussi **opérateur ternaire**.

  ```cpp
  condition ? valeur_si_vrai : valeur_si_faux
  ```

  ```cpp
  int age = 20;
  std::string statut = age >= 18 ? "majeur" : "mineur";
  ```

  **Une expression, pas une instruction.** Le `if` **fait** quelque chose ; le ternaire **vaut** quelque chose. On
  peut donc l'écrire là où une valeur est attendue : dans une initialisation, un argument, un `return`.

  ```cpp
  const int maximum = a > b ? a : b;                 // permet d'initialiser une constante
  std::println("{} point{}", n, n > 1 ? "s" : "");
  return x < 0 ? -x : x;
  ```

  C'est son meilleur usage : initialiser une variable **`const`**, ce qu'un `if` suivi de deux affectations ne
  permet pas.

  **Une seule branche est évaluée.** La condition est calculée d'abord ; puis **seulement** l'expression choisie.
  `diviseur != 0 ? total / diviseur : 0` ne divise jamais par zéro.

  **Les deux branches doivent s'accorder sur un type.** Le résultat a **un** type, commun aux deux valeurs :

  ```cpp
  auto x = condition ? 1 : 2.5;          // double : le 1 est converti
  auto y = condition ? 1 : "un";         // erreur : pas de type commun
  ```

  **La priorité.** Le ternaire est **très peu prioritaire** : presque tout passe avant lui, sauf l'affectation.

  ```cpp
  int n = 10 + (vip ? 5 : 0);     // parenthèses nécessaires
  int m = 10 + vip ? 5 : 0;       // se lit (10 + vip) ? 5 : 0, donc 5
  ```

  Dans un `std::println` ou au milieu d'un calcul, on l'entoure de parenthèses.

  **Ne pas en abuser.**

  - Des ternaires **imbriqués** deviennent vite illisibles : au-delà de deux cas, un `if`/`else if` ou un `switch`.
  - Pour **faire** quelque chose (appeler une fonction, afficher), on écrit un `if`.
  - `condition ? true : false` est simplement `condition`.

  **En entretien** : « Le ternaire est une expression : il produit une valeur, là où le `if` est une instruction.
  Je m'en sers pour initialiser une constante ou choisir un argument. Il n'évalue qu'une branche, exige un type
  commun aux deux, et sa faible priorité demande des parenthèses. »
tour:
  - title: Choisir une valeur
    text: |-
      L'opérateur `? :` choisit entre deux valeurs : `condition ? si_vrai : si_faux`.

      À la différence du `if`, c'est une **expression** : il produit une valeur. On peut donc s'en servir pour
      initialiser une variable, même `const`, ou directement dans un affichage.

      Essaie : passe `points` à 1, puis exécute. Le `s` du pluriel disparaît.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const int points = 3;
              const std::string niveau = points >= 10 ? "expert" : "débutant";

              std::println("{} point{}", points, points > 1 ? "s" : "");
              std::println("{}", niveau);
          }
      output: |-
        3 points
        débutant
    task:
      instructions: |-
        Le programme affiche toujours `positif`. Remplace la valeur de `signe` par un opérateur `? :` qui donne
        `"négatif"` quand `nombre` est inférieur à zéro, et `"positif"` sinon.
      starter:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const int nombre = -4;
              const std::string signe = "positif";
              std::println("{}", signe);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const int nombre = -4;
              const std::string signe = nombre < 0 ? "négatif" : "positif";
              std::println("{}", signe);
          }
      output: "négatif"
cards:
  - key: syntaxe
    format: course
    question: "Que vaut l'expression `condition ? a : b` ?"
    choices:
      - {text: "`a` si la condition est vraie, `b` sinon", correct: true}
      - {text: "`b` si la condition est vraie, `a` sinon", correct: false}
      - {text: "`true` si `a` et `b` sont égaux, `false` sinon", correct: false}
      - {text: "La condition elle-même, convertie en entier", correct: false}
    answer: "La valeur avant les deux-points est celle du cas vrai. C'est l'équivalent, en une expression, d'un `if`/`else` qui choisirait une valeur."
  - key: expression
    format: course
    question: "Qu'est-ce qui distingue l'opérateur `? :` d'un `if`/`else` ?"
    choices:
      - {text: "C'est une expression : il produit une valeur, utilisable dans une initialisation", correct: true}
      - {text: "C'est une instruction : il ne peut pas apparaître dans un calcul", correct: false}
      - {text: "Il évalue toujours ses deux branches, alors que le `if` n'en exécute qu'une", correct: false}
      - {text: "Il est plus rapide à l'exécution qu'un `if`/`else`", correct: false}
    answer: "Un `if` ne vaut rien : on ne peut pas écrire `int x = if (...)`. Le ternaire, lui, s'écrit partout où une valeur est attendue."
  - key: une-branche
    format: course
    question: "Combien de ses deux branches l'opérateur `? :` évalue-t-il ?"
    choices:
      - {text: "Une seule : celle que la condition désigne", correct: true}
      - {text: "Les deux, puis il garde la bonne valeur", correct: false}
      - {text: "Aucune tant que le résultat n'est pas affiché", correct: false}
      - {text: "Les deux, dans un ordre non spécifié", correct: false}
    answer: "La condition est évaluée d'abord, puis seulement la branche choisie. `d != 0 ? n / d : 0` ne divise jamais par zéro."
  - key: type-commun
    format: course
    question: "Quel est le type de `condition ? 1 : 2.5` ?"
    choices:
      - {text: "`double` : les deux branches sont ramenées à un type commun", correct: true}
      - {text: "`int` : c'est le type de la première branche", correct: false}
      - {text: "`int` ou `double`, selon la condition, à l'exécution", correct: false}
      - {text: "Aucun : deux types différents ne compilent pas", correct: false}
    answer: "Une expression a un seul type, fixé à la compilation. L'entier est converti en `double`. Sans type commun, comme entre `int` et une chaîne, la compilation échoue."
  - key: vf-const
    format: true-false
    question: "L'opérateur `? :` permet d'initialiser une variable `const` selon une condition."
    truth: true
    answer: "`const int max = a > b ? a : b;`. Avec un `if` et deux affectations, la variable ne pourrait pas être `const`."
  - key: vf-deux-branches
    format: true-false
    question: "L'opérateur `? :` évalue ses deux branches avant de choisir."
    truth: false
    answer: Seule la branche désignée par la condition est évaluée.
  - key: vf-sans-else
    format: true-false
    question: "On peut écrire un opérateur `? :` sans sa partie après les deux-points."
    truth: false
    answer: "Les trois opérandes sont obligatoires : une expression doit avoir une valeur dans les deux cas."
  - key: vf-priorite
    format: true-false
    question: "`10 + vip ? 5 : 0` ajoute 5 ou 0 à 10."
    truth: false
    answer: "L'addition est prioritaire : l'expression se lit `(10 + vip) ? 5 : 0`. Il faut écrire `10 + (vip ? 5 : 0)`."
  - key: qcm-maximum
    format: multiple-choice
    question: "Quelle expression vaut le plus grand de `a` et `b` ?"
    choices:
      - {text: "`a > b ? a : b`", correct: true}
      - {text: "`a > b ? b : a`", correct: false}
      - {text: "`a > b : a ? b`", correct: false}
      - {text: "`a ? b : a > b`", correct: false}
    answer: "Si `a` est plus grand, on prend `a`, sinon `b`. Le point d'interrogation vient d'abord, les deux-points ensuite."
  - key: qcm-simplifier
    format: multiple-choice
    question: "Par quoi remplace-t-on `est_valide ? true : false` ?"
    choices:
      - {text: "`est_valide`", correct: true}
      - {text: "`!est_valide`", correct: false}
      - {text: "`est_valide ? 1 : 0`", correct: false}
      - {text: "`est_valide == false`", correct: false}
    answer: "La condition est déjà un booléen : le ternaire ne fait que le recopier."
  - key: qcm-quand-if
    format: multiple-choice
    question: "Dans quel cas un `if`/`else` convient-il mieux qu'un opérateur `? :` ?"
    choices:
      - {text: "Pour exécuter plusieurs instructions dans chaque cas", correct: true}
      - {text: "Pour initialiser une constante selon une condition", correct: false}
      - {text: "Pour choisir l'argument d'un appel de fonction", correct: false}
      - {text: "Pour choisir la valeur renvoyée par un `return`", correct: false}
    answer: "Le ternaire choisit une valeur. Pour des actions, ou plus de deux cas, le `if` se lit mieux."
  - key: qcm-parentheses
    format: multiple-choice
    question: "Quelle écriture ajoute 5 à 10 quand `vip` est vrai, et 0 sinon ?"
    choices:
      - {text: "`10 + (vip ? 5 : 0)`", correct: true}
      - {text: "`10 + vip ? 5 : 0`", correct: false}
      - {text: "`(10 + vip) ? 5 : 0`", correct: false}
      - {text: "`10 + vip ? (5 : 0)`", correct: false}
    answer: "Le ternaire est très peu prioritaire : sans parenthèses, l'addition se fait avant lui."
  - key: trous-interrogation
    format: fill-in
    question: |-
      Complète l'opérateur conditionnel :
      ```cpp
      const int maximum = a > b ___ a : b;
      ```
    blanks:
      - ["?"]
    answer: "`condition ? si_vrai : si_faux`."
  - key: trous-deux-points
    format: fill-in
    question: |-
      Complète l'opérateur conditionnel :
      ```cpp
      const std::string statut = age >= 18 ? "majeur" ___ "mineur";
      ```
    blanks:
      - [":"]
    answer: "Les deux-points séparent la valeur du cas vrai de celle du cas faux."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour que `absolu` soit la valeur absolue de `x` :
      ```cpp
      const int absolu = x < 0 ? ___ : x;
      ```
    blanks:
      - ["-x"]
    answer: "Quand `x` est négatif, sa valeur absolue est `-x`."
  - key: trous-condition
    format: fill-in
    question: |-
      Complète pour afficher le `s` du pluriel à partir de deux articles :
      ```cpp
      std::println("{} article{}", n, n ___ 1 ? "s" : "");
      ```
    blanks:
      - [">"]
    answer: "`n > 1` : le pluriel commence à deux."
  - key: code-simple
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int a = 7;
          const int b = 12;
          const int maximum = a > b ? a : b;
          const int minimum = a > b ? b : a;
          std::println("{} {}", maximum, minimum);
      }
      ```
    choices:
      - {text: "`12 7`", correct: true}
      - {text: "`7 12`", correct: false}
      - {text: "`12 12`", correct: false}
      - {text: "`7 7`", correct: false}
    answer: "`12 7` : `a > b` est faux, donc chaque ternaire prend sa seconde valeur."
    check:
      output: "12 7"
  - key: code-priorite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const bool vip = false;
          const int a = 10 + (vip ? 5 : 0);
          const int b = 10 + vip ? 5 : 0;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`10 5`", correct: true}
      - {text: "`10 10`", correct: false}
      - {text: "`10 0`", correct: false}
      - {text: "`15 5`", correct: false}
    answer: "`10 5` : avec les parenthèses, on ajoute 0. Sans elles, `10 + vip` vaut 10, non nul donc vrai : le ternaire rend 5."
    check:
      output: "10 5"
  - key: code-une-branche
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int appels = 0;

      int compter(int valeur) {
          ++appels;
          return valeur;
      }

      int main() {
          const int resultat = true ? compter(1) : compter(2);
          std::println("{} {}", resultat, appels);
      }
      ```
    choices:
      - {text: "`1 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "`2 2`", correct: false}
    answer: "`1 1` : seule la branche choisie est évaluée. `compter(2)` n'est jamais appelée."
    check:
      output: "1 1"
  - key: code-imbrique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int note = 12;
          const char* mention = note >= 16 ? "très bien" : note >= 10 ? "admis" : "refusé";
          std::println("{}", mention);
      }
      ```
    choices:
      - {text: "`admis`", correct: true}
      - {text: "`très bien`", correct: false}
      - {text: "`refusé`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`admis` : le ternaire se regroupe de droite à gauche. 12 n'atteint pas 16, donc on passe au second test, qui est vrai. Un `if`/`else if` serait plus lisible."
    check:
      output: "admis"
  - key: bug-priorite-affichage
    format: bug-fix
    question: |-
      Ce programme devrait afficher `15`, le prix de 10 plus 5 de livraison. Il affiche `5`. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      int main() {
          const bool livraison = true;
          const int total = 10 + livraison ? 5 : 0;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `10 + (livraison ? 5 : 0)`", correct: true}
      - {text: "Écrire `(10 + livraison) ? 5 : 0`", correct: false}
      - {text: "Écrire `10 + livraison ? 0 : 5`", correct: false}
      - {text: "Écrire `10 + livraison : 5 ? 0`", correct: false}
    answer: |-
      ```cpp
      const int total = 10 + (livraison ? 5 : 0);
      ```
      L'addition est prioritaire sur le ternaire : `10 + livraison` vaut 11, donc vrai, et le résultat est 5. Les
      parenthèses limitent le ternaire aux frais de livraison.
  - key: bug-types
    format: bug-fix
    question: |-
      Le compilateur refuse cette expression : les deux branches n'ont pas de type commun (« operands to '?:' have
      different types 'int' and 'const char*' »). Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int stock = 0;
          std::println("{}", stock > 0 ? stock : "rupture");
      }
      ```
    choices:
      - {text: "Écrire `stock > 0 ? std::to_string(stock) : \"rupture\"`, avec `#include <string>`", correct: true}
      - {text: "Écrire `stock > 0 ? \"rupture\" : stock`, en échangeant les branches", correct: false}
      - {text: "Écrire `stock > 0 ? (stock) : (\"rupture\")`, avec des parenthèses", correct: false}
      - {text: "Écrire `stock > 0 ? stock : 'rupture'`, entre apostrophes", correct: false}
    answer: |-
      ```cpp
      std::println("{}", stock > 0 ? std::to_string(stock) : "rupture");
      ```
      Une expression n'a qu'un type. En convertissant le nombre en chaîne, les deux branches deviennent des textes.
      Un `if`/`else` avec deux `std::println` conviendrait aussi.
  - key: bug-inverse
    format: bug-fix
    question: |-
      Ce programme devrait afficher `majeur` pour 20 ans. Il affiche `mineur`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int age = 20;
          std::println("{}", age >= 18 ? "mineur" : "majeur");
      }
      ```
    choices:
      - {text: "Écrire `age >= 18 ? \"majeur\" : \"mineur\"`", correct: true}
      - {text: "Écrire `age >= 18 : \"majeur\" ? \"mineur\"`", correct: false}
      - {text: "Écrire `age > 18 ? \"mineur\" : \"majeur\"`", correct: false}
      - {text: "Écrire `age => 18 ? \"mineur\" : \"majeur\"`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", age >= 18 ? "majeur" : "mineur");
      ```
      La valeur placée avant les deux-points est celle du cas vrai. Les deux textes étaient inversés.
  - key: bug-division
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « Floating point exception » : il divise par zéro. Il devrait afficher `0` quand il
      n'y a aucune note. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int somme = 0;
          const int nombre = 0;
          const int moyenne = somme / nombre;
          std::println("{}", moyenne);
      }
      ```
    choices:
      - {text: "Écrire `nombre != 0 ? somme / nombre : 0`", correct: true}
      - {text: "Écrire `somme / nombre ? nombre != 0 : 0`", correct: false}
      - {text: "Écrire `nombre == 0 ? somme / nombre : 0`", correct: false}
      - {text: "Écrire `somme / (nombre ? nombre : 0)`", correct: false}
    answer: |-
      ```cpp
      const int moyenne = nombre != 0 ? somme / nombre : 0;
      ```
      Le ternaire n'évalue que la branche choisie : la division n'a lieu que si `nombre` est non nul.
