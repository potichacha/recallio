notion: goto-labels
lesson: |-
  `goto` saute directement à une **étiquette** (*label*) de la même fonction. Il existe en C++, hérité du C, mais
  le code moderne s'en passe presque toujours.

  ```cpp
  int i = 0;
  debut:
      std::println("{}", i);
      ++i;
      if (i < 3) goto debut;
  ```

  **Pourquoi on l'évite.**

  - Le fil d'exécution ne suit plus la structure du code : pour comprendre une ligne, il faut chercher tous les
    `goto` qui y mènent. C'est le « code spaghetti ».
  - Les boucles, `break`, `continue` et les fonctions expriment les mêmes sauts, avec un nom et une portée.
  - Un `goto` **ne peut pas sauter par-dessus l'initialisation** d'une variable pour entrer dans sa portée : le
    compilateur le refuse (« jump to label crosses initialization »).

  **Ce que C++ offre à la place.**

  | Besoin, en C | En C++ |
  |---|---|
  | `goto nettoyage;` pour libérer une ressource en cas d'erreur | **RAII** : le destructeur libère, sur tous les chemins |
  | Sortir de deux boucles imbriquées | une **fonction** avec `return`, ou un algorithme |
  | Recommencer une étape | une boucle `while` |
  | Sauter une partie du traitement | `if`, `continue`, une fonction |

  Le nettoyage par `goto` est l'usage le plus répandu en C, dans le noyau Linux par exemple. En C++, il n'a plus
  lieu d'être : un `std::unique_ptr`, un `std::vector` ou un `std::lock_guard` libèrent à la sortie de la portée,
  même en cas d'exception.

  **Sortir de boucles imbriquées.** C'est le cas où `goto` est parfois défendu. La solution habituelle est
  d'extraire les boucles dans une fonction :

  ```cpp
  std::optional<Position> chercher(const Grille& grille, int cible) {
      for (int ligne = 0; ligne < grille.lignes(); ++ligne) {
          for (int colonne = 0; colonne < grille.colonnes(); ++colonne) {
              if (grille(ligne, colonne) == cible) {
                  return Position{ligne, colonne};
              }
          }
      }
      return std::nullopt;
  }
  ```

  **Ce que `goto` respecte quand même.** Sortir d'un bloc par `goto` détruit les variables locales de ce bloc,
  comme toute sortie de portée. Il ne peut pas sauter dans une autre fonction.

  **Les étiquettes de `switch`.** `case 1:` et `default:` sont des étiquettes, mais elles appartiennent au
  `switch` : rien à voir avec `goto`.

  **En entretien** : « `goto` existe, mais je ne m'en sers pas : les boucles, les fonctions et RAII couvrent ses
  usages, en gardant un fil d'exécution lisible. Le nettoyage par `goto` du C est remplacé par les destructeurs. »
cards:
  - key: definition
    format: course
    question: "Que fait l'instruction `goto fin;` ?"
    choices:
      - {text: "Elle saute à l'étiquette `fin:` de la même fonction", correct: true}
      - {text: "Elle appelle la fonction `fin`, puis revient", correct: false}
      - {text: "Elle termine le programme avec le code `fin`", correct: false}
      - {text: "Elle sort de la boucle en cours, comme `break`", correct: false}
    answer: "L'exécution reprend à l'instruction qui suit l'étiquette. Le saut reste à l'intérieur de la fonction."
  - key: pourquoi-eviter
    format: course
    question: "Pourquoi évite-t-on `goto` ?"
    choices:
      - {text: "Le fil d'exécution ne suit plus la structure du code, qui devient difficile à lire", correct: true}
      - {text: "Le compilateur le refuse depuis C++11, sauf dans les fichiers d'en-tête", correct: false}
      - {text: "Le saut est beaucoup plus lent qu'une boucle `for` ou `while`", correct: false}
      - {text: "Le saut provoque toujours une fuite de mémoire", correct: false}
    answer: "Rien n'indique, à l'étiquette, d'où l'on peut arriver. Les boucles et les fonctions donnent la même chose avec une structure visible."
  - key: nettoyage
    format: course
    question: "En C, `goto nettoyage;` sert à libérer une ressource en cas d'erreur. Qu'utilise-t-on en C++ ?"
    choices:
      - {text: "RAII : le destructeur d'un objet local libère la ressource sur tous les chemins", correct: true}
      - {text: "Un bloc `finally`, exécuté à la fin de la fonction", correct: false}
      - {text: "Un `goto` vers une étiquette placée dans une autre fonction", correct: false}
      - {text: "Un ramasse-miettes, lancé à la fin de chaque fonction", correct: false}
    answer: "Un `std::unique_ptr` ou un `std::lock_guard` libèrent à toute sortie de portée, exception comprise. C++ n'a ni `finally` ni ramasse-miettes."
  - key: initialisation
    format: course
    question: "Quel saut le compilateur refuse-t-il à `goto` ?"
    choices:
      - {text: "Entrer dans la portée d'une variable en sautant par-dessus son initialisation", correct: true}
      - {text: "Revenir en arrière, vers une étiquette placée plus haut", correct: false}
      - {text: "Sortir d'un bloc `if` vers la fin de la fonction", correct: false}
      - {text: "Sortir de deux boucles imbriquées d'un seul coup", correct: false}
    answer: "La variable serait utilisable sans avoir été initialisée : « jump to label crosses initialization ». Les sauts en arrière et les sorties de bloc sont permis."
  - key: vf-existe
    format: true-false
    question: "`goto` a été retiré du langage C++."
    truth: false
    answer: "Il existe toujours, pour la compatibilité avec le C. On s'en passe par choix."
  - key: vf-autre-fonction
    format: true-false
    question: "`goto` peut sauter vers une étiquette d'une autre fonction."
    truth: false
    answer: "Une étiquette n'est visible que dans sa fonction."
  - key: vf-destructeurs
    format: true-false
    question: "Quand `goto` sort d'un bloc, les variables locales de ce bloc sont détruites."
    truth: true
    answer: "Comme pour toute sortie de portée : les destructeurs sont appelés."
  - key: vf-case
    format: true-false
    question: "Les `case` d'un `switch` sont des étiquettes que l'on atteint avec `goto`."
    truth: false
    answer: "Ce sont des étiquettes propres au `switch`, qui y saute lui-même. `goto case 1;` n'existe pas en C++."
  - key: qcm-deux-boucles
    format: multiple-choice
    question: "Comment sort-on proprement de deux boucles imbriquées dès qu'un élément est trouvé ?"
    choices:
      - {text: "En plaçant les boucles dans une fonction, qui fait `return`", correct: true}
      - {text: "En écrivant `break 2;` dans la boucle intérieure", correct: false}
      - {text: "En écrivant `break; break;` dans la boucle intérieure", correct: false}
      - {text: "En écrivant `continue` dans la boucle extérieure", correct: false}
    answer: "`return` quitte toutes les boucles d'un coup, et la fonction donne un nom à la recherche. `break` ne sort que d'une boucle, et `break 2` n'existe pas."
  - key: qcm-syntaxe-label
    format: multiple-choice
    question: "Comment déclare-t-on une étiquette nommée `fin` ?"
    choices:
      - {text: "`fin:`", correct: true}
      - {text: "`label fin;`", correct: false}
      - {text: "`@fin`", correct: false}
      - {text: "`#fin`", correct: false}
    answer: "Un nom suivi de deux-points, devant une instruction."
  - key: qcm-recommencer
    format: multiple-choice
    question: "Par quoi remplace-t-on un `goto` qui remonte au début d'un traitement pour le recommencer ?"
    choices:
      - {text: "Par une boucle `while`", correct: true}
      - {text: "Par un `switch`", correct: false}
      - {text: "Par un bloc `try`", correct: false}
      - {text: "Par une variable globale", correct: false}
    answer: "Un saut en arrière est une boucle. `while` en donne la condition au premier coup d'œil."
  - key: qcm-message
    format: multiple-choice
    question: "Quel message donne GCC quand un `goto` saute par-dessus `int x = 5;` pour atteindre une étiquette plus bas ?"
    choices:
      - {text: "« jump to label crosses initialization »", correct: true}
      - {text: "« undefined reference to label »", correct: false}
      - {text: "« label used but not defined »", correct: false}
      - {text: "« goto is deprecated »", correct: false}
    answer: "Le saut entrerait dans la portée de `x` sans exécuter son initialisation. C'est une erreur, pas un avertissement."
  - key: situation-nettoyage-c
    format: scenario
    question: |-
      Tu reprends une fonction venue du C : elle ouvre un fichier, alloue deux tampons, et chaque erreur fait
      `goto nettoyage;` vers une suite de `free` et de `fclose` en fin de fonction. Comment la réécris-tu en C++ ?
    choices:
      - {text: "Avec un `std::ifstream` et des `std::vector` : chaque `return` libère tout", correct: true}
      - {text: "Avec un `goto` par ressource, vers trois étiquettes de nettoyage", correct: false}
      - {text: "Avec un `catch (...)` qui appelle `free` et `fclose`", correct: false}
      - {text: "Avec des variables globales, libérées à la fin du programme", correct: false}
    answer: |-
      Chaque ressource confiée à un objet est libérée par son destructeur, quel que soit le chemin de sortie. Les
      étiquettes et le bloc de nettoyage disparaissent, et un `return` au milieu ne peut plus rien oublier.
  - key: situation-boucles
    format: scenario
    question: |-
      En revue de code, tu lis deux boucles imbriquées qui cherchent une valeur dans une grille, avec un
      `goto trouve;` dans la boucle intérieure. Que proposes-tu ?
    choices:
      - {text: "Extraire la recherche dans une fonction qui renvoie la position dans un `std::optional`", correct: true}
      - {text: "Remplacer le `goto` par un `break`, qui sort des deux boucles", correct: false}
      - {text: "Ajouter un second `goto`, pour revenir dans la boucle après le traitement", correct: false}
      - {text: "Remplacer les deux boucles par deux `switch` imbriqués", correct: false}
    answer: |-
      Un `return` sort des deux boucles, et la fonction a un nom qui dit ce qu'elle cherche. `break` ne quitte que
      la boucle intérieure.
  - key: situation-defense
    format: scenario
    question: |-
      Un collègue défend son `goto` : « c'est plus rapide qu'un appel de fonction ». Que lui réponds-tu ?
    choices:
      - {text: "Que le compilateur intègre les petites fonctions : la lisibilité est le seul critère ici", correct: true}
      - {text: "Qu'il a raison : `goto` est toujours l'écriture la plus rapide", correct: false}
      - {text: "Que `goto` est plus lent, car il vide le cache du processeur", correct: false}
      - {text: "Que `goto` est interdit par le standard depuis C++20", correct: false}
    answer: |-
      Une petite fonction est intégrée à l'appelant (*inlining*) : le code machine est le même. Il ne reste que la
      différence de lisibilité, et elle est en faveur de la fonction.
  - key: situation-code-genere
    format: scenario
    question: |-
      Tu ouvres un analyseur syntaxique produit par un générateur de code, rempli de `goto`. Faut-il le réécrire ?
    choices:
      - {text: "Non : ce code n'est pas lu ni modifié à la main, la règle vise le code qu'on maintient", correct: true}
      - {text: "Oui : tout `goto` doit être retiré, quelle que soit l'origine du code", correct: false}
      - {text: "Oui : un fichier qui contient `goto` ne compile pas en C++23", correct: false}
      - {text: "Non : `goto` est la façon recommandée d'écrire un analyseur à la main", correct: false}
    answer: |-
      On évite `goto` parce qu'il rend le code difficile à lire. Un fichier généré se régénère : personne ne le
      relit. La source à soigner est la grammaire donnée au générateur.
