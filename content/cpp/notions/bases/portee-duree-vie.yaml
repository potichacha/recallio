notion: portee-duree-vie
lesson: |-
  La **portée** d'un nom est la partie du code où on peut l'utiliser. Une variable locale est visible **de sa
  déclaration à la fin de son bloc**, c'est-à-dire jusqu'à l'accolade fermante.

  ```cpp
  int main() {
      int a = 1;
      {
          int b = 2;      // visible dans ce bloc seulement
          a = a + b;      // a, déclarée plus haut, est visible ici
      }
      // b n'existe plus ici
  }
  ```

  - Un bloc intérieur **voit** les variables des blocs qui l'entourent ; l'inverse est faux.
  - La variable d'un `for (int i = 0; ...)` n'existe que dans la boucle.
  - Une variable déclarée hors de toute fonction est **globale** : visible dans tout le fichier, et vivante pendant
    tout le programme. On l'évite : n'importe quel code peut la modifier.

  **La durée de vie.** Une variable locale est créée à sa déclaration et **détruite à la fin de son bloc**. C'est
  automatique et déterministe : c'est sur cette règle que repose la libération des ressources en C++ (RAII).

  **Le masquage** (*shadowing*). Un bloc intérieur peut déclarer une variable du **même nom** qu'une variable
  extérieure. La nouvelle **masque** l'ancienne jusqu'à la fin du bloc ; l'ancienne n'est pas modifiée.

  ```cpp
  int total = 0;
  {
      int total = 5;   // une autre variable, qui masque la première
  }
  // total vaut toujours 0
  ```

  C'est presque toujours une erreur : un `int` de trop devant une affectation. `-Wshadow` le signale. `::total`
  désigne la variable globale, même masquée.

  **En entretien** : « Une variable locale vit de sa déclaration à la fin de son bloc. Je déclare chaque variable dans
  la plus petite portée possible : elle ne peut alors être ni lue ni modifiée ailleurs. »
tour:
  - title: La portée d'une variable
    text: |-
      Une variable n'existe que dans son bloc : entre sa déclaration et l'accolade qui ferme le bloc. Après, elle est
      détruite, et son nom n'a plus de sens.

      Un bloc intérieur voit les variables de l'extérieur. S'il en déclare une du même nom, il la **masque** : ce sont
      deux variables différentes.

      Essaie : retire le `int` de `int total = 5;`, puis exécute. Le bloc modifie alors la variable extérieure.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int total = 0;
              {
                  int total = 5;
                  std::println("dans le bloc : {}", total);
              }
              std::println("après le bloc : {}", total);
          }
      output: |-
        dans le bloc : 5
        après le bloc : 0
cards:
  - key: portee-d-un-bloc
    format: course
    question: Jusqu'où une variable locale est-elle visible ?
    choices:
      - {text: "De sa déclaration à la fin du bloc où elle est déclarée", correct: true}
      - {text: "Du début à la fin de la fonction où elle est déclarée", correct: false}
      - {text: "De sa déclaration à la fin du fichier source", correct: false}
      - {text: "De sa déclaration à sa dernière utilisation", correct: false}
    answer: "Sa portée commence à sa déclaration et finit à l'accolade fermante de son bloc. Avant sa déclaration, ou après le bloc, le nom est inconnu."
  - key: fin-de-vie
    format: course
    question: Quand une variable locale est-elle détruite ?
    choices:
      - {text: "À la fin de son bloc, automatiquement", correct: true}
      - {text: "À la fin du programme, avec toutes les autres", correct: false}
      - {text: "Quand le ramasse-miettes constate qu'elle ne sert plus", correct: false}
      - {text: "Quand le développeur appelle `delete` sur elle", correct: false}
    answer: |-
      À l'accolade fermante de son bloc, à un moment précis et sans intervention. C++ n'a pas de ramasse-miettes, et
      `delete` ne concerne que la mémoire allouée avec `new`.
  - key: masquage
    format: course
    question: Que se passe-t-il quand un bloc intérieur déclare une variable du même nom qu'une variable extérieure ?
    choices:
      - {text: "La nouvelle masque l'ancienne jusqu'à la fin du bloc", correct: true}
      - {text: "La nouvelle remplace l'ancienne pour le reste du programme", correct: false}
      - {text: "Le compilateur refuse le code : le nom est déjà pris", correct: false}
      - {text: "Les deux noms désignent la même variable en mémoire", correct: false}
    answer: |-
      Ce sont deux variables distinctes. Dans le bloc, le nom désigne la nouvelle ; à la sortie, il désigne de nouveau
      l'ancienne, intacte. Le compilateur ne refuse que deux déclarations dans le **même** bloc.
  - key: pourquoi-eviter-globales
    format: course
    question: Pourquoi évite-t-on les variables globales ?
    choices:
      - {text: "N'importe quel code peut les modifier : on ne sait plus qui les change", correct: true}
      - {text: "Elles ne sont jamais initialisées, contrairement aux locales", correct: false}
      - {text: "Elles sont détruites à la fin de la première fonction appelée", correct: false}
      - {text: "Elles ralentissent chaque appel de fonction du programme", correct: false}
    answer: |-
      Une variable globale est visible et modifiable partout : comprendre une fonction demande alors de connaître tout
      le programme. Une variable locale n'a que quelques lignes de code qui peuvent la toucher.
  - key: vf-variable-de-boucle
    format: true-false
    question: "La variable `i` d'un `for (int i = 0; i < 3; ++i)` est utilisable après la boucle."
    truth: false
    answer: Déclarée dans l'en-tête du `for`, elle n'existe que dans la boucle.
  - key: vf-bloc-interieur-voit
    format: true-false
    question: Un bloc intérieur peut utiliser une variable déclarée avant lui dans le bloc qui l'entoure.
    truth: true
    answer: La portée d'une variable couvre les blocs imbriqués dans le sien.
  - key: vf-masquage-modifie
    format: true-false
    question: Modifier une variable qui en masque une autre modifie aussi la variable masquée.
    truth: false
    answer: Ce sont deux variables différentes, qui partagent seulement un nom.
  - key: vf-meme-nom-blocs-separes
    format: true-false
    question: Deux blocs qui se suivent peuvent chacun déclarer une variable nommée `resultat`.
    truth: true
    answer: "Chaque variable disparaît à la fin de son bloc : les deux ne coexistent jamais."
  - key: qcm-operateur-global
    format: multiple-choice
    question: "Une variable locale `x` masque une variable globale `x`. Comment désigner la globale ?"
    choices:
      - {text: "`::x`", correct: true}
      - {text: "`global x`", correct: false}
      - {text: "`std::x`", correct: false}
      - {text: "`x::`", correct: false}
    answer: "`::x` : l'opérateur de portée, sans rien devant, désigne la portée globale."
  - key: qcm-avertissement-masquage
    format: multiple-choice
    question: Quelle option de GCC signale une variable qui en masque une autre ?
    choices:
      - {text: "`-Wshadow`", correct: true}
      - {text: "`-Wall`", correct: false}
      - {text: "`-Wscope`", correct: false}
      - {text: "`-Whide`", correct: false}
    answer: "`-Wshadow`. Elle ne fait partie ni de `-Wall` ni de `-Wextra` : il faut la demander."
  - key: qcm-plus-petite-portee
    format: multiple-choice
    question: Où vaut-il mieux déclarer une variable qui ne sert que dans une boucle ?
    choices:
      - {text: "Dans la boucle, là où elle sert", correct: true}
      - {text: "En haut de la fonction, avant la boucle", correct: false}
      - {text: "Hors de toute fonction, en variable globale", correct: false}
      - {text: "Dans un fichier d'en-tête du projet", correct: false}
    answer: "Dans la plus petite portée possible : la variable ne peut alors être lue ni modifiée par erreur ailleurs."
  - key: qcm-duree-de-vie-globale
    format: multiple-choice
    question: Combien de temps vit une variable globale ?
    choices:
      - {text: "Pendant toute l'exécution du programme", correct: true}
      - {text: "Jusqu'à la fin de la fonction `main` seulement", correct: false}
      - {text: "Jusqu'à la fin du bloc qui l'utilise en premier", correct: false}
      - {text: "Le temps d'un appel de la fonction qui la lit", correct: false}
    answer: "Elle est créée avant `main` et détruite après la fin du programme."
  - key: code-masquage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          {
              int x = 2;
              std::println("{}", x);
          }
          std::println("{}", x);
      }
      ```
    choices:
      - text: |-
          ```
          2
          1
          ```
        correct: true
      - text: |-
          ```
          2
          2
          ```
        correct: false
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      2
      1
      ```
      Dans le bloc, `x` désigne la variable intérieure. Elle disparaît à l'accolade fermante, et `x` désigne de nouveau
      la première, qui n'a pas changé.
    check:
      output: |-
        2
        1
  - key: code-modification-exterieure
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          {
              x = 2;
          }
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`12`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2` : sans `int`, `x = 2;` est une affectation. Le bloc voit la variable extérieure, et la modifie."
    check:
      output: "2"
  - key: code-hors-portee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          {
              int y = 5;
          }
          std::println("{}", y);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `y` n'existe que dans son bloc. Après l'accolade fermante, le nom est inconnu."
    check:
      compiles: false
  - key: code-globale-masquee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int x = 10;

      int main() {
          int x = 5;
          std::println("{} {}", x, ::x);
      }
      ```
    choices:
      - {text: "`5 10`", correct: true}
      - {text: "`10 5`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5 10` : la variable locale masque la globale. `::x` désigne la globale malgré le masquage."
    check:
      output: "5 10"
  - key: bug-variable-du-if
    format: bug-fix
    question: |-
      Le compilateur répond « 'remise' was not declared in this scope » à la dernière ligne. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          int prix = 150;
          if (prix > 100) {
              int remise = 10;
          }
          std::println("{}", prix - remise);
      }
      ```
    choices:
      - {text: "Déclarer `int remise = 0;` avant le `if`, et y écrire `remise = 10;`", correct: true}
      - {text: "Déclarer `int remise = 10;` une seconde fois après le `if`", correct: false}
      - {text: "Écrire `::remise` dans l'affichage, pour sortir du bloc", correct: false}
      - {text: "Retirer les accolades du `if`, pour agrandir la portée", correct: false}
    answer: |-
      ```cpp
      int remise = 0;
      if (prix > 100) {
          remise = 10;
      }
      ```
      `remise` était déclarée dans le bloc du `if` : elle disparaissait à son accolade fermante. On la déclare dans le
      bloc où elle sert.
  - key: bug-masquage
    format: bug-fix
    question: |-
      Ce programme affiche `150` au lieu de `140` : la remise n'est pas appliquée. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int prix = 150;
          int remise = 0;
          if (prix > 100) {
              int remise = 10;
          }
          std::println("{}", prix - remise);
      }
      ```
    choices:
      - {text: "Le `int` du bloc déclare une seconde variable, qui masque la première", correct: true}
      - {text: "La condition `prix > 100` est fausse quand `prix` vaut 150", correct: false}
      - {text: "Une variable ne peut pas être modifiée à l'intérieur d'un `if`", correct: false}
      - {text: "La soustraction est calculée avant l'exécution du `if`", correct: false}
    answer: |-
      ```cpp
      if (prix > 100) {
          remise = 10;
      }
      ```
      `int remise = 10;` crée une nouvelle variable, détruite à la fin du bloc. Sans le `int`, c'est une affectation à
      la variable extérieure. `-Wshadow` signale ce genre d'erreur.
  - key: bug-variable-de-boucle
    format: bug-fix
    question: |-
      Ce code ne compile pas : `i` est inconnue à la dernière ligne. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          for (int i = 0; i < 3; ++i) {
              std::print("{} ", i);
          }
          std::println("fin : {}", i);
      }
      ```
    choices:
      - {text: "Déclarer `int i = 0;` avant la boucle, et écrire `for (; i < 3; ++i)`", correct: true}
      - {text: "Écrire `::i` dans le dernier affichage, pour sortir de la boucle", correct: false}
      - {text: "Remplacer `++i` par `i++`, pour que `i` survive à la boucle", correct: false}
      - {text: "Ajouter `int i;` après la boucle, juste avant l'affichage", correct: false}
    answer: |-
      ```cpp
      int i = 0;
      for (; i < 3; ++i) {
      ```
      Une variable déclarée dans l'en-tête du `for` n'existe que dans la boucle. Pour s'en servir après, on la déclare
      avant.
  - key: bug-variable-d-une-autre-fonction
    format: bug-fix
    question: |-
      Ce code ne compile pas : `nom` est inconnue dans `saluer`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void saluer() {
          std::println("Bonjour, {} !", nom);
      }

      int main() {
          const char* nom = "Ada";
          saluer();
      }
      ```
    choices:
      - {text: "Passer `nom` en paramètre : `void saluer(const char* nom)` et `saluer(nom);`", correct: true}
      - {text: "Déplacer la fonction `saluer` après `main` dans le fichier", correct: false}
      - {text: "Écrire `main::nom` dans la fonction `saluer`", correct: false}
      - {text: "Ajouter des accolades autour de l'appel `saluer();`", correct: false}
    answer: |-
      ```cpp
      void saluer(const char* nom) {
          std::println("Bonjour, {} !", nom);
      }
      ```
      Une variable locale n'est visible que dans sa fonction. Pour qu'une autre fonction s'en serve, on la lui passe en
      paramètre.
  - key: trous-variable-visible
    format: fill-in
    question: |-
      Complète avec la seule variable encore visible à cet endroit :
      ```cpp
      int main() {
          int a = 1;
          {
              int b = 2;
          }
          std::println("{}", ___);
      }
      ```
    blanks:
      - [a]
    answer: "`b` a disparu à la fin de son bloc. Seule `a` est encore visible."
  - key: trous-globale
    format: fill-in
    question: |-
      Complète pour afficher la variable globale, et non la locale :
      ```cpp
      int x = 10;

      int main() {
          int x = 5;
          std::println("{}", ___x);
      }
      ```
    blanks:
      - ["::"]
    answer: "`::x` désigne la variable globale, même quand une locale la masque."
  - key: trous-affectation-exterieure
    format: fill-in
    question: |-
      Complète pour que le bloc modifie la variable extérieure, sans en créer une nouvelle :
      ```cpp
      int total = 0;
      {
          ___ = 5;
      }
      std::println("{}", total);   // affiche 5
      ```
    blanks:
      - [total]
    answer: "`total = 5;`, sans `int` : une affectation à la variable extérieure."
  - key: trous-valeur-apres-masquage
    format: fill-in
    question: |-
      Complète le commentaire avec ce que le programme affiche :
      ```cpp
      int n = 1;
      {
          int n = 7;
      }
      std::println("{}", n);   // affiche ___
      ```
    blanks:
      - ["1"]
    answer: "Le `n` du bloc est une autre variable, détruite à la fin du bloc. Le premier `n` vaut toujours 1."
