notion: arguments-defaut
lesson: |-
  Un paramètre peut recevoir une **valeur par défaut** : si l'appelant n'écrit pas l'argument, c'est elle qui est
  utilisée.

  ```cpp
  void saluer(const std::string& nom, int fois = 1) { ... }

  saluer("Ada");        // fois vaut 1
  saluer("Ada", 3);     // fois vaut 3
  ```

  **Règle 1 : à la fin de la liste.** Dès qu'un paramètre a une valeur par défaut, **tous ceux qui le suivent**
  doivent en avoir une.

  ```cpp
  void tracer(int x, int y = 0, int epaisseur = 1);    // permis
  void tracer(int x = 0, int y, int epaisseur);        // erreur
  ```

  **Règle 2 : on omet par la fin.** Les arguments sont associés aux paramètres **de gauche à droite**. On ne peut
  pas sauter un argument pour donner le suivant : `tracer(5, , 3)` n'existe pas.

  ```cpp
  tracer(5);          // y = 0, epaisseur = 1
  tracer(5, 2);       // epaisseur = 1
  tracer(5, 2, 3);
  ```

  On place donc en dernier les paramètres qu'on change le moins souvent.

  **Règle 3 : une seule fois, dans la déclaration.** Quand une fonction est déclarée dans un en-tête et définie
  ailleurs, la valeur par défaut s'écrit dans la **déclaration**, que voit l'appelant. La répéter dans la
  définition est une erreur.

  ```cpp
  // geometrie.hpp
  double aire(double largeur, double hauteur = 1.0);

  // geometrie.cpp
  double aire(double largeur, double hauteur) {       // sans la valeur
      return largeur * hauteur;
  }
  ```

  **Quand la valeur est calculée.** À **chaque appel** qui omet l'argument, et non une fois pour toutes. C'est le
  compilateur qui complète l'appel : `saluer("Ada")` est compilé comme `saluer("Ada", 1)`.

  **Avec la surcharge.** Un argument par défaut remplace souvent deux fonctions surchargées. Mais les mélanger
  crée des **ambiguïtés** :

  ```cpp
  void afficher(int n);
  void afficher(int n, int largeur = 5);

  afficher(3);      // erreur : les deux conviennent
  ```

  **Les pièges.**

  - Un booléen par défaut rend les appels obscurs : `enregistrer(doc, true)`. Une énumération se lit mieux.
  - Dans une **fonction virtuelle**, la valeur par défaut est choisie d'après le type du **pointeur**, pas d'après
    celui de l'objet. On évite d'en changer dans une classe dérivée.
  - Ajouter un paramètre par défaut à une fonction d'une bibliothèque change sa signature : le code qui l'utilise
    doit être recompilé.

  **En entretien** : « Les paramètres par défaut sont les derniers de la liste, et s'omettent par la fin. La
  valeur s'écrit dans la déclaration seulement, et c'est le compilateur qui l'insère à l'appel. Attention à
  l'ambiguïté avec une surcharge. »
tour:
  - title: Une valeur si l'on ne dit rien
    text: |-
      Un paramètre peut avoir une **valeur par défaut**, écrite après `=` dans la liste des paramètres. L'appelant
      peut alors omettre l'argument.

      Les paramètres par défaut sont toujours les **derniers**, et l'on omet les arguments par la fin.

      Essaie : appelle `repeter("ho")`, sans le second argument, puis exécute. Le mot ne s'affiche qu'une fois.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          void repeter(const std::string& mot, int fois = 1) {
              for (int i = 0; i < fois; ++i) {
                  std::print("{} ", mot);
              }
              std::println("!");
          }

          int main() {
              repeter("hip");
              repeter("ho", 3);
          }
      output: |-
        hip !
        ho ho ho !
    task:
      instructions: |-
        La fonction `prix_ttc` exige toujours le taux. Donne au paramètre `taux` la valeur par défaut `20`, puis
        appelle la fonction avec le seul prix `50`, pour afficher `60`.
      starter:
        main.cpp: |-
          #include <print>

          int prix_ttc(int prix, int taux) {
              return prix + prix * taux / 100;
          }

          int main() {
              std::println("{}", prix_ttc(50, 10));
          }
      solution:
        main.cpp: |-
          #include <print>

          int prix_ttc(int prix, int taux = 20) {
              return prix + prix * taux / 100;
          }

          int main() {
              std::println("{}", prix_ttc(50));
          }
      output: "60"
cards:
  - key: definition
    format: course
    question: "À quoi sert une valeur par défaut sur un paramètre ?"
    choices:
      - {text: "À permettre à l'appelant d'omettre l'argument : la valeur par défaut est alors utilisée", correct: true}
      - {text: "À empêcher l'appelant de passer une autre valeur que celle par défaut", correct: false}
      - {text: "À initialiser le paramètre une seule fois, au premier appel de la fonction", correct: false}
      - {text: "À donner une valeur au paramètre quand l'appelant passe zéro", correct: false}
    answer: "`void saluer(std::string nom, int fois = 1);` s'appelle avec un ou deux arguments. L'appelant garde le droit de donner une autre valeur."
  - key: position
    format: course
    question: "Où placer les paramètres qui ont une valeur par défaut ?"
    choices:
      - {text: "À la fin de la liste : après eux, tous les paramètres en ont une", correct: true}
      - {text: "Au début de la liste : avant eux, aucun paramètre n'en a", correct: false}
      - {text: "N'importe où dans la liste, dans l'ordre de son choix", correct: false}
      - {text: "Un sur deux, en alternant avec les paramètres obligatoires", correct: false}
    answer: "Les arguments se lisent de gauche à droite. Un paramètre obligatoire après un paramètre facultatif ne pourrait jamais être atteint sans donner le précédent."
  - key: ou-ecrire
    format: course
    question: "Une fonction est déclarée dans un en-tête et définie dans un `.cpp`. Où écrit-on la valeur par défaut ?"
    choices:
      - {text: "Dans la déclaration seulement", correct: true}
      - {text: "Dans la définition seulement", correct: false}
      - {text: "Dans la déclaration et dans la définition", correct: false}
      - {text: "Dans chaque fichier qui appelle la fonction", correct: false}
    answer: "C'est le compilateur qui complète l'appel : il lui faut la valeur là où il voit la fonction, c'est-à-dire dans l'en-tête. La répéter dans la définition est une erreur."
  - key: ambiguite
    format: course
    question: "Pourquoi `afficher(3)` est-il refusé quand existent `void afficher(int)` et `void afficher(int, int = 5)` ?"
    choices:
      - {text: "Les deux fonctions conviennent à l'appel : le compilateur ne peut pas choisir", correct: true}
      - {text: "Une fonction surchargée ne peut pas avoir de valeur par défaut", correct: false}
      - {text: "La valeur par défaut `5` est différente de l'argument `3`", correct: false}
      - {text: "Deux fonctions ne peuvent pas porter le même nom", correct: false}
    answer: "Avec un seul argument, la seconde fonction est appelable grâce à sa valeur par défaut, comme la première. L'appel est ambigu."
  - key: vf-milieu
    format: true-false
    question: "`void f(int a = 1, int b);` est une déclaration valide."
    truth: false
    answer: "Après un paramètre par défaut, tous les suivants doivent en avoir un."
  - key: vf-sauter
    format: true-false
    question: "On peut omettre l'avant-dernier argument d'un appel tout en donnant le dernier."
    truth: false
    answer: "Les arguments s'omettent par la fin seulement. Il n'y a pas d'arguments nommés en C++."
  - key: vf-chaque-appel
    format: true-false
    question: "L'expression d'une valeur par défaut est évaluée à chaque appel qui omet l'argument."
    truth: true
    answer: "Le compilateur insère l'expression dans l'appel. Si c'est un appel de fonction, il a lieu à chaque fois."
  - key: vf-plusieurs
    format: true-false
    question: "Une fonction peut avoir plusieurs paramètres avec une valeur par défaut."
    truth: true
    answer: "`void tracer(int x, int y = 0, int epaisseur = 1);` s'appelle avec un, deux ou trois arguments."
  - key: qcm-valide
    format: multiple-choice
    question: "Laquelle de ces déclarations compile ?"
    choices:
      - {text: "`void tracer(int x, int y = 0, int z = 0);`", correct: true}
      - {text: "`void tracer(int x = 0, int y, int z);`", correct: false}
      - {text: "`void tracer(int x, int y = 0, int z);`", correct: false}
      - {text: "`void tracer(int x = 0, int y = 0, int z);`", correct: false}
    answer: "Les valeurs par défaut occupent la fin de la liste, sans trou."
  - key: qcm-appel
    format: multiple-choice
    question: "Pour `void tracer(int x, int y = 0, int z = 1);`, que reçoit la fonction à l'appel `tracer(5, 2)` ?"
    choices:
      - {text: "`x = 5`, `y = 2`, `z = 1`", correct: true}
      - {text: "`x = 5`, `y = 0`, `z = 2`", correct: false}
      - {text: "`x = 5`, `y = 2`, `z = 2`", correct: false}
      - {text: "`x = 0`, `y = 5`, `z = 2`", correct: false}
    answer: "Les arguments remplissent les paramètres de gauche à droite. Seul `z`, non fourni, prend sa valeur par défaut."
  - key: qcm-combien
    format: multiple-choice
    question: "De combien de façons peut-on appeler `void f(int a, int b = 2, int c = 3);` ?"
    choices:
      - {text: "Trois : avec un, deux ou trois arguments", correct: true}
      - {text: "Une : avec trois arguments", correct: false}
      - {text: "Deux : avec un ou trois arguments", correct: false}
      - {text: "Quatre : avec zéro, un, deux ou trois arguments", correct: false}
    answer: "`a` est obligatoire. `b` et `c` s'omettent par la fin : `f(1)`, `f(1, 5)`, `f(1, 5, 6)`."
  - key: qcm-lisibilite
    format: multiple-choice
    question: "Pourquoi évite-t-on un paramètre booléen par défaut, comme dans `enregistrer(doc, true)` ?"
    choices:
      - {text: "L'appel ne dit pas ce que signifie `true` : une énumération se lit mieux", correct: true}
      - {text: "Un booléen ne peut pas avoir de valeur par défaut", correct: false}
      - {text: "Un booléen par défaut vaut toujours `false`", correct: false}
      - {text: "Un booléen occupe plus de mémoire qu'une énumération", correct: false}
    answer: "`enregistrer(doc, Ecrasement::autorise)` se comprend sans ouvrir la déclaration. `true` oblige le lecteur à aller voir."
  - key: trous-defaut
    format: fill-in
    question: |-
      Complète pour que `fois` vaille 1 quand l'appelant ne le donne pas :
      ```cpp
      void saluer(const std::string& nom, int fois ___ 1);
      ```
    blanks:
      - ["="]
    answer: "La valeur par défaut s'écrit après `=`, dans la liste des paramètres."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète l'appel le plus court qui passe `3` à `x` et laisse les autres par défaut :
      ```cpp
      void tracer(int x, int y = 0, int epaisseur = 1);

      tracer(___);
      ```
    blanks:
      - ["3"]
    answer: "`tracer(3)` : `y` et `epaisseur` prennent leurs valeurs par défaut."
  - key: trous-definition
    format: fill-in
    question: |-
      La déclaration, dans l'en-tête, est `double aire(double largeur, double hauteur = 1.0);`. Complète la
      définition, dans le fichier source :
      ```cpp
      double aire(double largeur, double ___) {
          return largeur * hauteur;
      }
      ```
    blanks:
      - [hauteur]
    answer: "La valeur par défaut ne se répète pas dans la définition : seulement le nom du paramètre."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour que `prix_ttc(100)` renvoie 120 :
      ```cpp
      int prix_ttc(int prix, int taux = ___) {
          return prix + prix * taux / 100;
      }
      ```
    blanks:
      - ["20"]
    answer: "Avec un taux par défaut de 20, `100 + 100 * 20 / 100` vaut 120."
  - key: code-simple
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int puissance(int base, int exposant = 2) {
          int resultat = 1;
          for (int i = 0; i < exposant; ++i) {
              resultat *= base;
          }
          return resultat;
      }

      int main() {
          std::println("{} {}", puissance(3), puissance(2, 5));
      }
      ```
    choices:
      - {text: "`9 32`", correct: true}
      - {text: "`3 32`", correct: false}
      - {text: "`9 10`", correct: false}
      - {text: "`6 32`", correct: false}
    answer: "`9 32` : sans second argument, l'exposant vaut 2, donc 3². Avec 5, on obtient 2⁵."
    check:
      output: "9 32"
  - key: code-plusieurs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int volume(int largeur, int hauteur = 2, int profondeur = 3) {
          return largeur * hauteur * profondeur;
      }

      int main() {
          std::println("{} {} {}", volume(1), volume(1, 5), volume(1, 5, 10));
      }
      ```
    choices:
      - {text: "`6 15 50`", correct: true}
      - {text: "`6 10 50`", correct: false}
      - {text: "`1 5 50`", correct: false}
      - {text: "`6 15 15`", correct: false}
    answer: "`6 15 50` : `volume(1)` vaut 1 × 2 × 3. Avec deux arguments, seule la profondeur reste par défaut : 1 × 5 × 3."
    check:
      output: "6 15 50"
  - key: code-chaque-appel
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int compteur = 0;

      int suivant() {
          return ++compteur;
      }

      int numero(int n = suivant()) {
          return n;
      }

      int main() {
          const int a = numero();
          const int b = numero(10);
          const int c = numero();
          std::println("{} {} {}", a, b, c);
      }
      ```
    choices:
      - {text: "`1 10 2`", correct: true}
      - {text: "`1 10 1`", correct: false}
      - {text: "`0 10 0`", correct: false}
      - {text: "`1 10 11`", correct: false}
    answer: "`1 10 2` : l'expression par défaut est évaluée à chaque appel qui omet l'argument. `suivant()` est donc appelée deux fois ; l'appel `numero(10)` ne l'appelle pas."
    check:
      output: "1 10 2"
  - key: code-ambigu
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void afficher(int n) {
          std::println("un : {}", n);
      }

      void afficher(int n, int largeur = 5) {
          std::println("deux : {} {}", n, largeur);
      }

      int main() {
          afficher(3);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`un : 3`", correct: false}
      - {text: "`deux : 3 5`", correct: false}
      - {text: "`un : 3`, puis `deux : 3 5`", correct: false}
    answer: "Ça ne compile pas : avec un seul argument, les deux fonctions conviennent. Le compilateur signale un appel ambigu."
    check:
      compiles: false
  - key: bug-ordre-parametres
    format: bug-fix
    question: |-
      Le compilateur répond « default argument missing for parameter 2 ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int prix_ttc(int taux = 20, int prix) {
          return prix + prix * taux / 100;
      }

      int main() {
          std::println("{}", prix_ttc(20, 50));
      }
      ```
    choices:
      - {text: "Placer le paramètre par défaut en dernier : `int prix_ttc(int prix, int taux = 20)`", correct: true}
      - {text: "Donner la valeur par défaut dans l'appel : `prix_ttc(taux = 20, 50)`", correct: false}
      - {text: "Retirer le nom du premier paramètre : `int prix_ttc(int = 20, int prix)`", correct: false}
      - {text: "Écrire la valeur par défaut entre accolades : `int taux{20}`", correct: false}
    answer: |-
      ```cpp
      int prix_ttc(int prix, int taux = 20) {
      ```
      Après un paramètre par défaut, tous les suivants doivent en avoir un. L'appel devient `prix_ttc(50)`, ou
      `prix_ttc(50, 20)`.
  - key: bug-repetee
    format: bug-fix
    question: |-
      Le compilateur répond « default argument given for parameter 2 », puis « previous specification here ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      double aire(double largeur, double hauteur = 1.0);

      double aire(double largeur, double hauteur = 1.0) {
          return largeur * hauteur;
      }

      int main() {
          std::println("{}", aire(4.0));
      }
      ```
    choices:
      - {text: "Retirer `= 1.0` de la définition, et le garder dans la déclaration", correct: true}
      - {text: "Retirer `= 1.0` de la déclaration, et de la définition aussi", correct: false}
      - {text: "Écrire `= 2.0` dans la définition, pour qu'elles diffèrent", correct: false}
      - {text: "Déclarer la fonction une troisième fois, sous la définition", correct: false}
    answer: |-
      ```cpp
      double aire(double largeur, double hauteur) {
          return largeur * hauteur;
      }
      ```
      Une valeur par défaut ne se donne qu'une fois. Elle a sa place dans la déclaration, celle que voient les
      appelants.
  - key: bug-argument-saute
    format: bug-fix
    question: |-
      Ce programme veut garder `y` par défaut et donner l'épaisseur 3. Le compilateur refuse l'appel
      `tracer(5, , 3)`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void tracer(int x, int y = 0, int epaisseur = 1) {
          std::println("{} {} {}", x, y, epaisseur);
      }

      int main() {
          tracer(5, , 3);
      }
      ```
    choices:
      - {text: "Écrire `tracer(5, 0, 3);`, en donnant la valeur de `y`", correct: true}
      - {text: "Écrire `tracer(5, default, 3);`, avec le mot-clé `default`", correct: false}
      - {text: "Écrire `tracer(5, epaisseur = 3);`, en nommant l'argument", correct: false}
      - {text: "Écrire `tracer(5, _, 3);`, avec un tiret bas", correct: false}
    answer: |-
      ```cpp
      tracer(5, 0, 3);
      ```
      On ne saute pas un argument : ils s'omettent par la fin seulement, et C++ n'a pas d'arguments nommés. Il
      faut écrire la valeur de `y`.
  - key: bug-mauvais-argument
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada!` trois fois. Il affiche `Ada` une seule fois, suivi d'un caractère
      invisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      void saluer(const std::string& nom, char ponctuation = '!', int fois = 1) {
          for (int i = 0; i < fois; ++i) {
              std::print("{}{}", nom, ponctuation);
          }
          std::println("");
      }

      int main() {
          saluer("Ada", 3);
      }
      ```
    choices:
      - {text: "Écrire `saluer(\"Ada\", '!', 3);`", correct: true}
      - {text: "Écrire `saluer(\"Ada\", 3, '!');`", correct: false}
      - {text: "Écrire `saluer(3, \"Ada\");`", correct: false}
      - {text: "Écrire `saluer(\"Ada\", \"3\");`", correct: false}
    answer: |-
      ```cpp
      saluer("Ada", '!', 3);
      ```
      Le second argument va au second paramètre : `3` est converti en `char`, un caractère invisible, et `fois`
      reste à 1. Pour atteindre le troisième paramètre, il faut donner le deuxième.
