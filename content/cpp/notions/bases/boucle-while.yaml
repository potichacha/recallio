notion: boucle-while
lesson: |-
  **`while`** répète un bloc **tant qu'**une condition est vraie. La condition est testée **avant** chaque tour : si
  elle est fausse d'emblée, le bloc ne s'exécute pas du tout.

  ```cpp
  int n = 3;
  while (n > 0) {
      std::println("{}", n);
      --n;
  }
  ```

  **`do`-`while`** teste la condition **après** chaque tour : le bloc s'exécute **au moins une fois**. Il se termine par
  un point-virgule.

  ```cpp
  int n = 10;
  do {
      std::println("{}", n);
      ++n;
  } while (n < 5);   // affiche 10 une fois
  ```

  **Quand choisir lequel.**

  - `while` quand on ne sait pas combien de tours il faudra : lire jusqu'à la fin, diviser jusqu'à zéro.
  - `do`-`while` quand il faut agir avant de pouvoir tester : poser une question, puis vérifier la réponse.
  - `for` quand on compte.

  **Pièges classiques.**

  - **La boucle infinie** : rien dans le bloc ne fait évoluer la condition. Vérifie qu'à chaque tour une variable de
    la condition change.
  - **Un point-virgule après la condition** : `while (n > 0);` répète une instruction vide, sans fin.
  - **L'erreur d'une unité** : `<` au lieu de `<=`, et la boucle fait un tour de moins.

  `while (true)` écrit une boucle volontairement sans fin, dont on sort par `break` ou `return`.

  **En entretien** : « `while` teste avant, `do`-`while` après : le second fait toujours au moins un tour. »
tour:
  - title: while et do-while
    text: |-
      `while` répète son bloc tant que la condition est vraie. Elle est testée avant chaque tour : le bloc doit donc
      faire évoluer une variable de la condition, sinon la boucle ne s'arrête jamais.

      `do { ... } while (condition);` teste après le tour : le bloc s'exécute au moins une fois.

      Ici, on double une mise jusqu'à dépasser 100.

      Essaie : remplace `mise < 100` par `mise < 1`, puis exécute. La boucle ne fait aucun tour.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int mise = 1;
              int tours = 0;

              while (mise < 100) {
                  mise *= 2;
                  ++tours;
              }

              std::println("{} après {} tours", mise, tours);
          }
      output: "128 après 7 tours"
    task:
      instructions: |-
        Compte les chiffres de `n` : divise-le par 10 tant qu'il n'est pas nul, en comptant les tours. Le programme
        doit afficher `5 chiffres`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int n = 40321;
              int chiffres = 0;

              std::println("{} chiffres", chiffres);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int n = 40321;
              int chiffres = 0;

              while (n > 0) {
                  n /= 10;
                  ++chiffres;
              }

              std::println("{} chiffres", chiffres);
          }
      output: "5 chiffres"
cards:
  - key: while-teste-avant
    format: course
    question: Quand la condition d'une boucle `while` est-elle testée ?
    choices:
      - {text: "Avant chaque tour, y compris le premier", correct: true}
      - {text: "Après chaque tour, y compris le premier", correct: false}
      - {text: "Une seule fois, avant le premier tour", correct: false}
      - {text: "À chaque instruction du bloc", correct: false}
    answer: "Avant chaque tour. Si elle est fausse dès le départ, le bloc ne s'exécute pas. À l'intérieur du bloc, elle n'est pas surveillée : la boucle finit le tour en cours."
  - key: do-while-au-moins-une-fois
    format: course
    question: "Quelle différence entre `while` et `do`-`while` ?"
    choices:
      - {text: "`do`-`while` teste après le tour : son bloc s'exécute au moins une fois", correct: true}
      - {text: "`do`-`while` teste avant le tour : son bloc peut ne jamais s'exécuter", correct: false}
      - {text: "`do`-`while` s'arrête quand sa condition devient vraie", correct: false}
      - {text: "`do`-`while` ne fait jamais qu'un seul tour", correct: false}
    answer: "`while` teste avant, `do`-`while` après. Les deux continuent tant que la condition est vraie ; seul le premier tour diffère."
  - key: boucle-infinie
    format: course
    question: Qu'est-ce qui fait qu'une boucle `while` ne s'arrête jamais ?
    choices:
      - {text: "Rien dans son bloc ne rend sa condition fausse", correct: true}
      - {text: "Son bloc contient plus d'une instruction", correct: false}
      - {text: "Sa condition compare deux variables entre elles", correct: false}
      - {text: "Sa variable a été déclarée avant la boucle", correct: false}
    answer: "La condition reste vraie pour toujours si aucune de ses variables ne change dans le bloc. C'est la première chose à vérifier quand on écrit un `while`."
  - key: quand-while
    format: course
    question: "Quand choisit-on `while` plutôt que `for` ?"
    choices:
      - {text: "Quand on ne connaît pas d'avance le nombre de tours", correct: true}
      - {text: "Quand la boucle doit faire exactement dix tours", correct: false}
      - {text: "Quand la boucle n'a pas besoin de condition", correct: false}
      - {text: "Quand la boucle doit être plus rapide", correct: false}
    answer: "`while` convient quand la fin dépend de ce qui se passe dans la boucle : lire jusqu'au bout, diviser jusqu'à zéro. `for` réunit le compteur, la condition et le pas quand on compte."
  - key: vf-while-zero-tour
    format: true-false
    question: Une boucle `while` peut ne faire aucun tour.
    truth: true
    answer: Si la condition est fausse au premier test, le bloc est sauté.
  - key: vf-do-while-zero-tour
    format: true-false
    question: Une boucle `do`-`while` peut ne faire aucun tour.
    truth: false
    answer: Le bloc s'exécute une première fois avant que la condition soit testée.
  - key: vf-point-virgule-do-while
    format: true-false
    question: "Une boucle `do`-`while` se termine par un point-virgule après sa condition."
    truth: true
    answer: "`do { ... } while (condition);` : le point-virgule est obligatoire. Après un `while` simple, il serait au contraire un bug."
  - key: vf-while-true
    format: true-false
    question: "`while (true)` est refusé par le compilateur."
    truth: false
    answer: C'est l'écriture d'une boucle volontairement sans fin, dont on sort par `break` ou `return`.
  - key: qcm-point-virgule
    format: multiple-choice
    question: "Que fait `while (n > 0);` quand `n` vaut 3 ?"
    choices:
      - {text: "Elle boucle sans fin sur une instruction vide", correct: true}
      - {text: "Elle exécute trois fois le bloc qui suit", correct: false}
      - {text: "Elle ne fait rien, et le programme continue", correct: false}
      - {text: "Elle provoque une erreur de compilation", correct: false}
    answer: "Le point-virgule est le corps de la boucle : une instruction vide. `n` ne change jamais, la condition reste vraie."
  - key: qcm-nombre-de-tours
    format: multiple-choice
    question: "Combien de tours fait `int i = 0; while (i < 3) { ++i; }` ?"
    choices:
      - {text: "3", correct: true}
      - {text: "2", correct: false}
      - {text: "4", correct: false}
      - {text: "Une infinité", correct: false}
    answer: "Trois : pour `i` valant 0, 1 et 2. Quand `i` atteint 3, la condition est fausse."
  - key: qcm-saisie
    format: multiple-choice
    question: Tu dois poser une question, puis la reposer tant que la réponse est invalide. Quelle boucle convient le mieux ?
    choices:
      - {text: "`do`-`while` : il faut poser la question avant de tester la réponse", correct: true}
      - {text: "`while` : la réponse doit être testée avant la première question", correct: false}
      - {text: "`for` : le nombre de questions est connu d'avance", correct: false}
      - {text: "Aucune : une boucle ne peut pas attendre une saisie", correct: false}
    answer: "La question est posée au moins une fois, et le test vient après : c'est le cas d'usage du `do`-`while`."
  - key: qcm-sortir-de-while-true
    format: multiple-choice
    question: "Comment sort-on d'une boucle `while (true)` ?"
    choices:
      - {text: "Avec `break` ou `return`, dans le bloc", correct: true}
      - {text: "Avec `continue`, dans le bloc", correct: false}
      - {text: "En affectant `false` à `true`", correct: false}
      - {text: "On n'en sort pas : le programme doit être arrêté", correct: false}
    answer: "`break` quitte la boucle, `return` quitte la fonction. `continue` passe au tour suivant : il ne fait pas sortir."
  - key: trous-while
    format: fill-in
    question: |-
      Complète pour répéter le bloc tant que `n` est positif :
      ```cpp
      ___ (n > 0) {
          std::println("{}", n);
          --n;
      }
      ```
    blanks:
      - [while]
    answer: "`while (condition) { ... }` répète tant que la condition est vraie."
  - key: trous-do
    format: fill-in
    question: |-
      Complète pour que le bloc s'exécute au moins une fois :
      ```cpp
      ___ {
          std::println("{}", n);
          --n;
      } while (n > 0);
      ```
    blanks:
      - [do]
    answer: "`do { ... } while (condition);` teste la condition après le tour."
  - key: trous-point-virgule
    format: fill-in
    question: |-
      Complète la fin de la boucle :
      ```cpp
      do {
          n /= 10;
          ++chiffres;
      } while (n > 0)___
      ```
    blanks:
      - [";"]
    answer: "Un `do`-`while` se termine par un point-virgule."
  - key: trous-evolution
    format: fill-in
    question: |-
      Complète pour que la boucle s'arrête après avoir affiché 3, 2, 1 :
      ```cpp
      int n = 3;
      while (n > 0) {
          std::println("{}", n);
          ___n;
      }
      ```
    blanks:
      - ["--"]
    answer: "`--n;` fait décroître `n` : la condition finit par devenir fausse."
  - key: code-compte-a-rebours
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 3;
          while (n > 0) {
              std::print("{}", n);
              --n;
          }
          std::println(" go");
      }
      ```
    choices:
      - {text: "`321 go`", correct: true}
      - {text: "`3210 go`", correct: false}
      - {text: "`210 go`", correct: false}
      - {text: "`32 go`", correct: false}
    answer: "`321 go` : la boucle affiche `n`, puis le décrémente. Quand `n` vaut 0, la condition est fausse : 0 n'est pas affiché."
    check:
      output: "321 go"
  - key: code-do-while
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 10;
          do {
              std::println("{}", n);
              ++n;
          } while (n < 5);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "Rien", correct: false}
      - {text: "`11`", correct: false}
      - text: |-
          ```
          10
          11
          ```
        correct: false
    answer: "`10` : le bloc s'exécute une fois avant le test. `n` vaut alors 11, qui n'est pas inférieur à 5 : la boucle s'arrête."
    check:
      output: "10"
  - key: code-while-jamais
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 10;
          while (n < 5) {
              std::println("{}", n);
              ++n;
          }
          std::println("fin {}", n);
      }
      ```
    choices:
      - {text: "`fin 10`", correct: true}
      - text: |-
          ```
          10
          fin 11
          ```
        correct: false
      - {text: "`fin 5`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`fin 10` : la condition est fausse dès le premier test. Le bloc n'est jamais exécuté, et `n` n'a pas changé."
    check:
      output: "fin 10"
  - key: code-chiffres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 1234;
          int somme = 0;
          while (n > 0) {
              somme += n % 10;
              n /= 10;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`1234`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`10` : à chaque tour, `n % 10` isole le dernier chiffre et `n /= 10` le retire. La boucle additionne 4, 3, 2 et 1."
    check:
      output: "10"
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Ce programme affiche `3` sans fin. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int n = 3;
          while (n > 0) {
              std::println("{}", n);
          }
      }
      ```
    choices:
      - {text: "Ajouter `--n;` dans le bloc", correct: true}
      - {text: "Ajouter `--n;` après la boucle", correct: false}
      - {text: "Remplacer `n > 0` par `n >= 0`", correct: false}
      - {text: "Remplacer `while` par `if`, puis par `else`", correct: false}
    answer: |-
      ```cpp
      while (n > 0) {
          std::println("{}", n);
          --n;
      }
      ```
      Rien ne modifiait `n` : la condition restait vraie. Le bloc doit faire évoluer la variable de la condition.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce programme n'affiche rien et ne se termine pas. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int n = 3;
          while (n > 0); {
              std::println("{}", n);
              --n;
          }
      }
      ```
    choices:
      - {text: "Le point-virgule après la condition est le corps de la boucle", correct: true}
      - {text: "`--n` doit être écrit avant l'affichage, pas après", correct: false}
      - {text: "`n > 0` est faux quand `n` vaut 3", correct: false}
      - {text: "Un `while` ne peut pas contenir deux instructions", correct: false}
    answer: |-
      ```cpp
      while (n > 0) {
      ```
      Avec le point-virgule, la boucle répète une instruction vide : `n` ne change jamais. Le bloc entre accolades
      n'est jamais atteint.
  - key: bug-do-while-point-virgule
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int n = 3;
          do {
              std::println("{}", n);
              --n;
          } while (n > 0)
      }
      ```
    choices:
      - {text: "Ajouter un point-virgule après `while (n > 0)`", correct: true}
      - {text: "Retirer les accolades du bloc `do`", correct: false}
      - {text: "Écrire `while (n > 0)` avant le mot-clé `do`", correct: false}
      - {text: "Remplacer `do` par `loop`", correct: false}
    answer: |-
      ```cpp
      } while (n > 0);
      ```
      Un `do`-`while` est une instruction, qui se termine par un point-virgule.
  - key: bug-une-unite
    format: bug-fix
    question: |-
      Ce programme devrait afficher les nombres de 1 à 5, et s'arrête à 4. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int i = 1;
          while (i < 5) {
              std::println("{}", i);
              ++i;
          }
      }
      ```
    choices:
      - {text: "Écrire `i <= 5`", correct: true}
      - {text: "Écrire `i < 4`", correct: false}
      - {text: "Écrire `i != 5`", correct: false}
      - {text: "Écrire `i > 5`", correct: false}
    answer: |-
      ```cpp
      while (i <= 5) {
      ```
      Avec `<`, la boucle s'arrête dès que `i` vaut 5, sans l'afficher. `<=` inclut la borne.
