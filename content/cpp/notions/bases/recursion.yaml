notion: recursion
lesson: |-
  Une fonction **récursive** est une fonction qui **s'appelle elle-même**. Elle résout un problème en le ramenant
  à une version plus petite du même problème.

  ```cpp
  int factorielle(int n) {
      if (n <= 1) {
          return 1;                        // cas de base : on s'arrête
      }
      return n * factorielle(n - 1);       // cas récursif : un problème plus petit
  }
  ```

  **Les deux ingrédients.**

  - Un **cas de base** : une situation assez simple pour répondre sans nouvel appel.
  - Un **cas récursif**, qui **se rapproche** du cas de base à chaque appel.

  Sans cas de base, ou si l'on ne s'en rapproche pas, la fonction s'appelle sans fin.

  **La pile d'appels.** Chaque appel reçoit son propre **cadre** sur la pile : ses paramètres, ses variables
  locales, l'endroit où revenir. Les appels s'empilent, puis se dépilent dans l'ordre inverse.

  ```
  factorielle(3)
    3 * factorielle(2)
          2 * factorielle(1)
                renvoie 1
          renvoie 2
    renvoie 6
  ```

  Chaque appel a **ses propres variables** : le `n` de `factorielle(3)` n'est pas celui de `factorielle(2)`.

  **Le débordement de pile.** La pile est petite : quelques mégaoctets. Une récursion trop profonde, ou sans fin,
  l'épuise : c'est un **débordement de pile** (*stack overflow*), et le programme s'arrête sur une erreur de
  segmentation. Ce n'est pas une exception qu'on attrape.

  **Récursion ou boucle ?** Tout ce qu'écrit une récursion peut s'écrire avec une boucle, et inversement.

  | | Récursion | Boucle |
  |---|---|---|
  | Lisibilité | naturelle pour les structures imbriquées : arbres, dossiers, expressions | naturelle pour les suites |
  | Mémoire | un cadre de pile par appel | constante |
  | Risque | débordement de pile | aucun |

  On garde la récursion pour les problèmes **récursifs par nature** (parcourir un arbre, diviser pour régner), et
  dont la profondeur reste modeste. Pour additionner mille nombres, une boucle.

  **Le piège du recalcul.** La définition naïve de Fibonacci fait deux appels par niveau :

  ```cpp
  int fibonacci(int n) {
      return n < 2 ? n : fibonacci(n - 1) + fibonacci(n - 2);
  }
  ```

  Elle recalcule sans cesse les mêmes valeurs : le nombre d'appels **double** presque à chaque incrément de `n`.
  `fibonacci(40)` en fait des centaines de millions. Une boucle, ou la mémorisation des résultats, le calcule
  aussitôt.

  **C++ ne garantit pas l'optimisation des appels terminaux.** Un compilateur peut transformer en boucle un appel
  récursif placé en toute fin de fonction, mais rien ne l'y oblige : on ne compte pas dessus.

  **En entretien** : « Une récursion a un cas de base et un cas récursif qui s'en rapproche. Chaque appel occupe
  un cadre de pile : trop profonde, elle déborde. Je la réserve aux structures récursives comme les arbres, et je
  préfère une boucle quand la profondeur peut être grande. »
tour:
  - title: Une fonction qui s'appelle elle-même
    text: |-
      Une fonction **récursive** s'appelle elle-même, sur un problème plus petit. Il lui faut un **cas de base**,
      où elle répond sans se rappeler : sinon, elle ne s'arrête jamais.

      Ici, `somme(3)` appelle `somme(2)`, qui appelle `somme(1)`, qui appelle `somme(0)`. Celle-ci renvoie 0, et
      les additions se font en remontant.

      Essaie : appelle `somme(100)`, puis exécute. Cent appels s'empilent, puis se dépilent.
    example:
      files:
        main.cpp: |-
          #include <print>

          int somme(int n) {
              if (n == 0) {
                  return 0;
              }
              return n + somme(n - 1);
          }

          int main() {
              std::println("{}", somme(3));
          }
      output: "6"
    task:
      instructions: |-
        La fonction `factorielle` renvoie toujours 1. Écris son cas récursif : pour `n` supérieur à 1, elle renvoie
        `n` multiplié par la factorielle de `n - 1`. Le programme doit afficher `120`.
      starter:
        main.cpp: |-
          #include <print>

          int factorielle(int n) {
              if (n <= 1) {
                  return 1;
              }
              return 1;
          }

          int main() {
              std::println("{}", factorielle(5));
          }
      solution:
        main.cpp: |-
          #include <print>

          int factorielle(int n) {
              if (n <= 1) {
                  return 1;
              }
              return n * factorielle(n - 1);
          }

          int main() {
              std::println("{}", factorielle(5));
          }
      output: "120"
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une fonction récursive ?"
    choices:
      - {text: "Une fonction qui s'appelle elle-même, sur un problème plus petit", correct: true}
      - {text: "Une fonction qui contient une boucle `for` ou `while`", correct: false}
      - {text: "Une fonction qui est appelée plusieurs fois par `main`", correct: false}
      - {text: "Une fonction qui renvoie une autre fonction", correct: false}
    answer: "Elle ramène le problème à une version réduite de lui-même, jusqu'à un cas assez simple pour être résolu directement."
  - key: cas-de-base
    format: course
    question: "À quoi sert le cas de base d'une fonction récursive ?"
    choices:
      - {text: "À arrêter la récursion : il répond sans nouvel appel", correct: true}
      - {text: "À lancer la récursion : il fait le premier appel", correct: false}
      - {text: "À accélérer la récursion : il saute un appel sur deux", correct: false}
      - {text: "À vérifier que l'argument est du bon type", correct: false}
    answer: "Sans lui, la fonction s'appelle indéfiniment, jusqu'à épuiser la pile. Et chaque appel récursif doit s'en rapprocher."
  - key: pile
    format: course
    question: "Que se passe-t-il sur la pile à chaque appel récursif ?"
    choices:
      - {text: "Un nouveau cadre y est ajouté, avec ses propres paramètres et variables locales", correct: true}
      - {text: "Le cadre de l'appel précédent est réutilisé, et ses variables écrasées", correct: false}
      - {text: "Rien : les appels récursifs utilisent le tas, pas la pile", correct: false}
      - {text: "Le cadre de l'appel précédent est supprimé avant le nouvel appel", correct: false}
    answer: "Les cadres s'empilent jusqu'au cas de base, puis sont retirés un à un quand les appels reviennent. Chaque appel a ses variables à lui."
  - key: debordement
    format: course
    question: "Que se passe-t-il quand une récursion ne s'arrête jamais ?"
    choices:
      - {text: "La pile s'épuise, et le programme s'arrête sur une erreur de segmentation", correct: true}
      - {text: "Le compilateur refuse le programme, avec une erreur", correct: false}
      - {text: "Une exception `std::bad_alloc` est lancée, qu'on peut attraper", correct: false}
      - {text: "Le programme tourne sans fin, sans consommer de mémoire", correct: false}
    answer: "C'est le débordement de pile. À la différence d'une boucle infinie, chaque appel consomme de la mémoire : le programme finit par planter."
  - key: vf-variables
    format: true-false
    question: "Tous les appels d'une fonction récursive partagent les mêmes variables locales."
    truth: false
    answer: Chaque appel a son propre cadre de pile, donc ses propres paramètres et variables locales.
  - key: vf-boucle
    format: true-false
    question: "Toute fonction récursive peut être réécrite avec une boucle."
    truth: true
    answer: "Au besoin en gérant soi-même une pile. Le choix est une affaire de lisibilité et de profondeur."
  - key: vf-attraper
    format: true-false
    question: "Un débordement de pile peut être attrapé par un bloc `catch`."
    truth: false
    answer: "Ce n'est pas une exception C++ : le système arrête le programme."
  - key: vf-appel-terminal
    format: true-false
    question: "Le standard C++ garantit qu'un appel récursif placé en fin de fonction est transformé en boucle."
    truth: false
    answer: "Certains compilateurs le font en optimisant, mais rien ne l'impose. Une récursion profonde peut donc toujours déborder."
  - key: qcm-factorielle
    format: multiple-choice
    question: "Quel est le cas récursif d'une fonction `factorielle(int n)` ?"
    choices:
      - {text: "`return n * factorielle(n - 1);`", correct: true}
      - {text: "`return n * factorielle(n);`", correct: false}
      - {text: "`return n * factorielle(n + 1);`", correct: false}
      - {text: "`return factorielle(n) - 1;`", correct: false}
    answer: "L'appel porte sur `n - 1` : il se rapproche du cas de base. Avec `n` ou `n + 1`, la récursion ne s'arrêterait jamais."
  - key: qcm-bon-usage
    format: multiple-choice
    question: "Pour quel problème la récursion est-elle le choix le plus naturel ?"
    choices:
      - {text: "Parcourir un dossier et tous ses sous-dossiers", correct: true}
      - {text: "Additionner les éléments d'un vecteur", correct: false}
      - {text: "Afficher les nombres de 1 à 100", correct: false}
      - {text: "Chercher le plus grand élément d'un tableau", correct: false}
    answer: "Un dossier contient des dossiers : la structure est récursive, et la fonction qui la parcourt aussi. Les trois autres sont de simples suites, faites pour une boucle."
  - key: qcm-fibonacci
    format: multiple-choice
    question: "Pourquoi `fibonacci(n - 1) + fibonacci(n - 2)`, écrit tel quel, est-il très lent pour `n = 40` ?"
    choices:
      - {text: "Les mêmes valeurs sont recalculées sans cesse : le nombre d'appels explose", correct: true}
      - {text: "La pile déborde, et le programme recommence depuis le début", correct: false}
      - {text: "L'addition de deux entiers est une opération lente", correct: false}
      - {text: "Chaque appel alloue de la mémoire sur le tas", correct: false}
    answer: "Chaque appel en lance deux : le total croît de façon exponentielle. Une boucle qui garde les deux derniers termes fait quarante additions."
  - key: qcm-profondeur
    format: multiple-choice
    question: "Qu'est-ce qui limite la profondeur d'une récursion ?"
    choices:
      - {text: "La taille de la pile, de quelques mégaoctets", correct: true}
      - {text: "La taille du tas, de plusieurs gigaoctets", correct: false}
      - {text: "Une limite fixe du standard : mille appels", correct: false}
      - {text: "Le nombre de cœurs du processeur", correct: false}
    answer: "Chaque appel y occupe un cadre. Une récursion de quelques dizaines de milliers de niveaux passe ; un million, rarement."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète l'appel récursif :
      ```cpp
      int somme(int n) {
          if (n == 0) {
              return 0;
          }
          return n + ___(n - 1);
      }
      ```
    blanks:
      - [somme]
    answer: "La fonction s'appelle elle-même, sur un argument plus petit."
  - key: trous-cas-de-base
    format: fill-in
    question: |-
      Complète la valeur renvoyée par le cas de base :
      ```cpp
      int factorielle(int n) {
          if (n <= 1) {
              return ___;
          }
          return n * factorielle(n - 1);
      }
      ```
    blanks:
      - ["1"]
    answer: "La factorielle de 0 et de 1 vaut 1. Renvoyer 0 annulerait tout le produit."
  - key: trous-rapprocher
    format: fill-in
    question: |-
      Complète l'argument, pour que la récursion se rapproche du cas de base :
      ```cpp
      void compter(int n) {
          if (n == 0) {
              return;
          }
          std::println("{}", n);
          compter(n ___ 1);
      }
      ```
    blanks:
      - ["-"]
    answer: "`n - 1` : à chaque appel, `n` diminue, jusqu'à atteindre 0."
  - key: trous-condition
    format: fill-in
    question: |-
      Complète la condition du cas de base, pour une puissance d'exposant positif ou nul :
      ```cpp
      int puissance(int base, int exposant) {
          if (exposant ___ 0) {
              return 1;
          }
          return base * puissance(base, exposant - 1);
      }
      ```
    blanks:
      - ["=="]
    answer: "Tout nombre à la puissance 0 vaut 1 : c'est là que la récursion s'arrête."
  - key: code-factorielle
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int factorielle(int n) {
          if (n <= 1) {
              return 1;
          }
          return n * factorielle(n - 1);
      }

      int main() {
          std::println("{} {}", factorielle(4), factorielle(0));
      }
      ```
    choices:
      - {text: "`24 1`", correct: true}
      - {text: "`24 0`", correct: false}
      - {text: "`10 1`", correct: false}
      - {text: "`4 1`", correct: false}
    answer: "`24 1` : 4 × 3 × 2 × 1. Pour 0, le cas de base répond aussitôt 1."
    check:
      output: "24 1"
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void compter(int n) {
          if (n == 0) {
              return;
          }
          std::print("{} ", n);
          compter(n - 1);
          std::print("{} ", n);
      }

      int main() {
          compter(2);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`2 1 1 2 fin`", correct: true}
      - {text: "`2 1 2 1 fin`", correct: false}
      - {text: "`2 1 fin`", correct: false}
      - {text: "`1 2 2 1 fin`", correct: false}
    answer: "`2 1 1 2 fin` : ce qui précède l'appel s'exécute en descendant, ce qui le suit en remontant. Les appels se terminent dans l'ordre inverse."
    check:
      output: "2 1 1 2 fin"
  - key: code-appels
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int appels = 0;

      int fibonacci(int n) {
          ++appels;
          if (n < 2) {
              return n;
          }
          return fibonacci(n - 1) + fibonacci(n - 2);
      }

      int main() {
          const int resultat = fibonacci(5);
          std::println("{} {}", resultat, appels);
      }
      ```
    choices:
      - {text: "`5 15`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`8 15`", correct: false}
      - {text: "`5 6`", correct: false}
    answer: "`5 15` : la suite donne 0, 1, 1, 2, 3, 5. Mais il a fallu quinze appels pour le cinquième terme : les mêmes valeurs sont recalculées plusieurs fois."
    check:
      output: "5 15"
  - key: code-variables
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int profondeur(int n) {
          int niveau = n;
          if (n > 0) {
              profondeur(n - 1);
          }
          return niveau;
      }

      int main() {
          std::println("{}", profondeur(3));
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`3` : chaque appel a sa propre variable `niveau`. Les appels plus profonds ne modifient pas celle du premier."
    check:
      output: "3"
  - key: bug-sans-cas-de-base
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une erreur de segmentation. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int somme(int n) {
          return n + somme(n - 1);
      }

      int main() {
          std::println("{}", somme(3));
      }
      ```
    choices:
      - {text: "Ajouter un cas de base : `if (n == 0) { return 0; }`", correct: true}
      - {text: "Appeler `somme(n + 1)` dans le `return`", correct: false}
      - {text: "Déclarer la fonction `somme` avec `static`", correct: false}
      - {text: "Entourer l'appel de `main` d'un `try` et d'un `catch`", correct: false}
    answer: |-
      ```cpp
      int somme(int n) {
          if (n == 0) {
              return 0;
          }
          return n + somme(n - 1);
      }
      ```
      Sans cas de base, la fonction s'appelle sans fin, et chaque appel occupe la pile jusqu'à l'épuiser. Un
      débordement de pile n'est pas une exception.
  - key: bug-ne-se-rapproche-pas
    format: bug-fix
    question: |-
      Cette fonction a un cas de base, et pourtant le programme s'arrête sur une erreur de segmentation. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int factorielle(int n) {
          if (n <= 1) {
              return 1;
          }
          return n * factorielle(n);
      }

      int main() {
          std::println("{}", factorielle(4));
      }
      ```
    choices:
      - {text: "Appeler `factorielle(n - 1)`", correct: true}
      - {text: "Appeler `factorielle(n + 1)`", correct: false}
      - {text: "Tester `n <= 0` dans le cas de base", correct: false}
      - {text: "Renvoyer `0` dans le cas de base", correct: false}
    answer: |-
      ```cpp
      return n * factorielle(n - 1);
      ```
      L'appel récursif reçoit le même `n` : il ne se rapproche jamais du cas de base. Chaque appel doit porter sur
      un problème plus petit.
  - key: bug-cas-de-base-faux
    format: bug-fix
    question: |-
      Ce programme devrait afficher `24`. Il affiche `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int factorielle(int n) {
          if (n == 0) {
              return 0;
          }
          return n * factorielle(n - 1);
      }

      int main() {
          std::println("{}", factorielle(4));
      }
      ```
    choices:
      - {text: "Renvoyer `1` dans le cas de base", correct: true}
      - {text: "Renvoyer `n` dans le cas de base", correct: false}
      - {text: "Tester `n == 4` dans le cas de base", correct: false}
      - {text: "Écrire `n + factorielle(n - 1)` dans le cas récursif", correct: false}
    answer: |-
      ```cpp
      if (n == 0) {
          return 1;
      }
      ```
      Le résultat du cas de base est multiplié par tous les autres : un zéro annule le produit. La factorielle de 0
      vaut 1.
  - key: bug-retour-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `6`, la somme de 1 à 3. Il affiche `3` : le résultat de l'appel récursif est
      perdu. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int somme(int n) {
          if (n == 0) {
              return 0;
          }
          somme(n - 1);
          return n;
      }

      int main() {
          std::println("{}", somme(3));
      }
      ```
    choices:
      - {text: "Écrire `return n + somme(n - 1);`", correct: true}
      - {text: "Écrire `return somme(n - 1);`", correct: false}
      - {text: "Écrire `somme(n - 1); return n + 1;`", correct: false}
      - {text: "Écrire `return n + n;`", correct: false}
    answer: |-
      ```cpp
      return n + somme(n - 1);
      ```
      L'appel récursif calcule bien la somme des plus petits, mais sa valeur n'est pas utilisée. Il faut la
      combiner avec `n`, et renvoyer le tout.
