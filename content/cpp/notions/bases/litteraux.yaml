notion: litteraux
lesson: |-
  Un **littéral** est une valeur écrite directement dans le code : `42`, `3.14`, `'a'`, `"bonjour"`, `true`. Son
  écriture fixe aussi son **type**.

  **Les bases numériques.** Un entier s'écrit en quatre bases :

  | Écriture | Base | Valeur |
  |---|---|---|
  | `42` | décimale | 42 |
  | `0x2A` | hexadécimale (préfixe `0x`) | 42 |
  | `0b101010` | binaire (préfixe `0b`, C++14) | 42 |
  | `052` | **octale** (préfixe `0`) | 42 |

  Le piège est l'octal : un zéro en tête change la base. `010` vaut **8**, pas 10.

  **Le séparateur de chiffres.** Depuis C++14, l'apostrophe sépare les chiffres, pour la lisibilité seulement :
  `1'000'000`, `0xFF'FF`, `0b1111'0000`. Le compilateur l'ignore.

  **Les suffixes fixent le type.**

  | Littéral | Type |
  |---|---|
  | `42` | `int` |
  | `42u` | `unsigned int` |
  | `42L` | `long` |
  | `42LL` | `long long` |
  | `42uz` | `std::size_t` (C++23) |
  | `3.14` | `double` |
  | `3.14f` | `float` |
  | `3.14L` | `long double` |

  Sans suffixe, un nombre à virgule est un **`double`**, et un entier est un `int` (ou un type plus large s'il ne
  tient pas dans un `int`).

  **Ce que le type change.** `7 / 2` est une division entière : 3. `7 / 2.0` est une division de `double` : 3.5.
  Et `1'000'000 * 1'000'000` déborde, car les deux opérandes sont des `int` : on écrit `1'000'000LL * 1'000'000`.

  **Caractères et chaînes.** `'a'` est un `char` ; `"a"` est une chaîne, un tableau de deux caractères avec son
  zéro terminal. Un littéral de chaîne **brut** `R"(...)"` ne traite pas les barres obliques inverses : commode
  pour un chemin Windows ou une expression régulière.

  **Les notations scientifiques.** `1.5e3` vaut 1500.0, `2e-3` vaut 0.002 : ce sont des `double`.

  **Les suffixes de la bibliothèque.** Avec `using namespace std::literals;`, `"abc"s` est une `std::string`,
  `"abc"sv` une `std::string_view`, et `500ms` une durée.

  **En entretien** : « L'écriture d'un littéral fixe son type : `42` est un `int`, `3.14` un `double`, `3.14f` un
  `float`. Un zéro en tête donne de l'octal. J'utilise l'apostrophe pour séparer les chiffres, et les suffixes pour
  éviter un calcul fait dans un type trop étroit. »
tour:
  - title: Écrire un nombre
    text: |-
      Un nombre s'écrit dans plusieurs bases : décimale, hexadécimale avec `0x`, binaire avec `0b`. L'apostrophe
      sépare les chiffres pour les rendre lisibles, sans rien changer à la valeur.

      Un suffixe fixe le type : `f` pour un `float`, `LL` pour un `long long`. Sans suffixe, un nombre à virgule est
      un `double`.

      Essaie : remplace `0x10` par `010`, puis exécute. Un zéro en tête donne un nombre octal : 8.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              const int million = 1'000'000;
              const int hexa = 0x10;
              const int binaire = 0b1010;
              std::println("{} {} {}", million, hexa, binaire);
              std::println("{} {}", 7 / 2, 7 / 2.0);
          }
      output: |-
        1000000 16 10
        3 3.5
    task:
      instructions: |-
        Le programme multiplie un million par un million dans des `int`, et le résultat déborde. Ajoute le suffixe
        `LL` au premier littéral, pour que le calcul se fasse en `long long`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              const long long produit = 1'000 * 1'000'000;
              const long long attendu = 1'000'000'000'000;
              std::println("{}", produit * 1000 == attendu ? "juste" : "faux");
              std::println("{}", 1'000'000 * 2);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              const long long produit = 1'000'000LL * 1'000'000;
              const long long attendu = 1'000'000'000'000;
              std::println("{}", produit == attendu ? "juste" : "faux");
              std::println("{}", 1'000'000 * 2);
          }
      output: |-
        juste
        2000000
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un littéral ?"
    choices:
      - {text: "Une valeur écrite directement dans le code, comme `42` ou `\"abc\"`", correct: true}
      - {text: "Une variable dont la valeur ne change jamais", correct: false}
      - {text: "Un commentaire que le compilateur recopie dans le programme", correct: false}
      - {text: "Un nom donné à un type par le mot-clé `using`", correct: false}
    answer: "Son écriture donne à la fois sa valeur et son type : `42` est un `int`, `42.0` un `double`."
  - key: octal
    format: course
    question: "Que vaut le littéral `010` ?"
    choices:
      - {text: "8 : un zéro en tête annonce un nombre octal", correct: true}
      - {text: "10 : le zéro en tête est ignoré", correct: false}
      - {text: "2 : c'est un nombre binaire", correct: false}
      - {text: "16 : c'est un nombre hexadécimal", correct: false}
    answer: "En base 8, `10` vaut huit. Le binaire s'écrit avec `0b`, l'hexadécimal avec `0x`."
  - key: suffixes
    format: course
    question: "Quel est le type du littéral `3.14`, écrit sans suffixe ?"
    choices:
      - {text: "`double`", correct: true}
      - {text: "`float`", correct: false}
      - {text: "`long double`", correct: false}
      - {text: "`int`", correct: false}
    answer: "Un nombre à virgule est un `double` par défaut. `3.14f` est un `float`, `3.14L` un `long double`."
  - key: separateur
    format: course
    question: "À quoi sert l'apostrophe dans `1'000'000` ?"
    choices:
      - {text: "À séparer les chiffres pour la lecture, sans changer la valeur", correct: true}
      - {text: "À écrire un caractère, comme dans `'a'`", correct: false}
      - {text: "À multiplier le nombre par mille", correct: false}
      - {text: "À donner au nombre le type `long`", correct: false}
    answer: "Depuis C++14, le compilateur ignore ces apostrophes. Elles se placent où l'on veut, dans toutes les bases."
  - key: vf-float
    format: true-false
    question: "Le littéral `2.5f` est de type `float`."
    truth: true
    answer: "Le suffixe `f` donne un `float`. Sans lui, ce serait un `double`."
  - key: vf-binaire
    format: true-false
    question: "`0b1000` vaut 8."
    truth: true
    answer: "Le préfixe `0b` annonce du binaire : un 1 suivi de trois 0."
  - key: vf-char-chaine
    format: true-false
    question: "`'a'` et `\"a\"` sont deux littéraux du même type."
    truth: false
    answer: "`'a'` est un `char`. `\"a\"` est une chaîne : un tableau de deux caractères, avec le zéro terminal."
  - key: vf-separateur-valeur
    format: true-false
    question: "`1'0'0` et `100` désignent la même valeur."
    truth: true
    answer: "Les apostrophes ne comptent pas. On les place par habitude tous les trois chiffres."
  - key: qcm-hexa
    format: multiple-choice
    question: "Quel littéral vaut 255 ?"
    choices:
      - {text: "`0xFF`", correct: true}
      - {text: "`0b1111`", correct: false}
      - {text: "`0255`", correct: false}
      - {text: "`0x255`", correct: false}
    answer: "En hexadécimal, `FF` vaut 15 × 16 + 15. `0b1111` vaut 15, `0255` est de l'octal (173), `0x255` vaut 597."
  - key: qcm-long-long
    format: multiple-choice
    question: "Quel littéral est de type `long long` ?"
    choices:
      - {text: "`42LL`", correct: true}
      - {text: "`42u`", correct: false}
      - {text: "`42.0`", correct: false}
      - {text: "`42f`", correct: false}
    answer: "`LL` donne un `long long`, `u` un `unsigned`. `42f` ne compile pas : le suffixe `f` exige un nombre à virgule."
  - key: qcm-brut
    format: multiple-choice
    question: "Quel littéral contient le texte `C:\\temp`, sans doubler la barre oblique inverse ?"
    choices:
      - {text: "`R\"(C:\\temp)\"`", correct: true}
      - {text: "`\"C:\\temp\"`", correct: false}
      - {text: "`'C:\\temp'`", correct: false}
      - {text: "`L\"C:\\temp\"`", correct: false}
    answer: "Dans un littéral brut `R\"(...)\"`, la barre oblique inverse est un caractère ordinaire. Dans `\"C:\\temp\"`, `\\t` serait une tabulation."
  - key: qcm-scientifique
    format: multiple-choice
    question: "Que vaut le littéral `1.5e3` ?"
    choices:
      - {text: "1500.0", correct: true}
      - {text: "4.5", correct: false}
      - {text: "1.503", correct: false}
      - {text: "0.0015", correct: false}
    answer: "`e3` multiplie par dix puissance trois. `1.5e-3` vaudrait 0.0015."
  - key: trous-hexa
    format: fill-in
    question: |-
      Complète le préfixe pour écrire 255 en hexadécimal :
      ```cpp
      const int blanc = ___FF;
      ```
    blanks:
      - [0x, 0X]
    answer: "`0x` annonce un nombre hexadécimal."
  - key: trous-float
    format: fill-in
    question: |-
      Complète le suffixe pour que le littéral soit un `float` :
      ```cpp
      const float prix = 9.99___;
      ```
    blanks:
      - [f, F]
    answer: "Le suffixe `f` donne un `float`."
  - key: trous-binaire
    format: fill-in
    question: |-
      Complète le préfixe pour écrire 5 en binaire :
      ```cpp
      const int masque = ___101;
      ```
    blanks:
      - [0b, 0B]
    answer: "`0b` annonce un nombre binaire."
  - key: trous-long-long
    format: fill-in
    question: |-
      Complète le suffixe pour que la multiplication se fasse en `long long` :
      ```cpp
      const long long grand = 3'000'000___ * 1'000;
      ```
    blanks:
      - [LL, ll]
    answer: "Avec `LL`, le premier opérande est un `long long`, et le calcul ne déborde pas."
  - key: code-bases
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {} {}", 0x1F, 0b110, 017);
      }
      ```
    choices:
      - {text: "`31 6 15`", correct: true}
      - {text: "`31 6 17`", correct: false}
      - {text: "`15 6 17`", correct: false}
      - {text: "`31 110 15`", correct: false}
    answer: "`31 6 15` : `0x1F` vaut 16 + 15, `0b110` vaut 4 + 2, et `017` est de l'octal : 8 + 7."
    check:
      output: "31 6 15"
  - key: code-division
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {} {}", 9 / 2, 9 / 2.0, 9.0f / 2);
      }
      ```
    choices:
      - {text: "`4 4.5 4.5`", correct: true}
      - {text: "`4 4.5 4`", correct: false}
      - {text: "`4.5 4.5 4.5`", correct: false}
      - {text: "`4 4 4.5`", correct: false}
    answer: "`4 4.5 4.5` : deux `int` donnent une division entière. Dès qu'un opérande est à virgule, la division l'est aussi."
    check:
      output: "4 4.5 4.5"
  - key: code-separateur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int a = 1'000;
          const int b = 0b1'0000;
          std::println("{}", a + b);
      }
      ```
    choices:
      - {text: "`1016`", correct: true}
      - {text: "`11000`", correct: false}
      - {text: "`1010`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1016` : les apostrophes sont ignorées. `0b10000` vaut 16."
    check:
      output: "1016"
  - key: code-tailles
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{} {} {}", sizeof(1.0f), sizeof(1.0), sizeof('a'));
      }
      ```
    choices:
      - {text: "`4 8 1`", correct: true}
      - {text: "`8 8 1`", correct: false}
      - {text: "`4 8 4`", correct: false}
      - {text: "`4 4 1`", correct: false}
    answer: "`4 8 1` : `1.0f` est un `float` de 4 octets, `1.0` un `double` de 8 octets, et `'a'` un `char` d'un octet."
    check:
      output: "4 8 1"
  - key: bug-octal
    format: bug-fix
    question: |-
      Ce programme devrait afficher `100`, le code postal aligné sur trois chiffres. Il affiche `64`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int code = 0100;
          std::println("{}", code);
      }
      ```
    choices:
      - {text: "Écrire `100`, sans zéro en tête", correct: true}
      - {text: "Écrire `0x100`, avec un `x`", correct: false}
      - {text: "Écrire `0b100`, avec un `b`", correct: false}
      - {text: "Écrire `0100u`, avec un `u`", correct: false}
    answer: |-
      ```cpp
      const int code = 100;
      ```
      Un zéro en tête fait du littéral un nombre octal : `0100` vaut 64. Pour afficher des zéros, on formate :
      `{:04}`.
  - key: bug-division-entiere
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0.5`. Il affiche `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const double moitie = 1 / 2;
          std::println("{}", moitie);
      }
      ```
    choices:
      - {text: "Écrire `1.0 / 2`", correct: true}
      - {text: "Écrire `1 / 2u`", correct: false}
      - {text: "Écrire `1 / 2LL`", correct: false}
      - {text: "Écrire `(1 / 2)`", correct: false}
    answer: |-
      ```cpp
      const double moitie = 1.0 / 2;
      ```
      `1` et `2` sont des `int` : la division est entière et vaut 0, avant d'être convertie en `double`. Il faut
      qu'un des deux littéraux soit à virgule.
  - key: bug-suffixe-f
    format: bug-fix
    question: |-
      Le compilateur refuse le littéral `5f`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const float taille = 5f;
          std::println("{}", taille);
      }
      ```
    choices:
      - {text: "Écrire `5.0f`", correct: true}
      - {text: "Écrire `5ff`", correct: false}
      - {text: "Écrire `5F`", correct: false}
      - {text: "Écrire `0f5`", correct: false}
    answer: |-
      ```cpp
      const float taille = 5.0f;
      ```
      Le suffixe `f` ne s'applique qu'à un nombre à virgule. `5f` est lu comme un entier suivi d'un suffixe inconnu.
  - key: bug-debordement
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3000000000`. GCC avertit d'un débordement (« integer overflow in expression »),
      et le programme affiche `-1294967296`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const long long total = 3'000'000 * 1'000;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `3'000'000LL * 1'000`", correct: true}
      - {text: "Écrire `3000000 * 1000`, sans apostrophes", correct: false}
      - {text: "Écrire `(3'000'000 * 1'000)`", correct: false}
      - {text: "Écrire `3'000'000 * 1'000 + 0`", correct: false}
    answer: |-
      ```cpp
      const long long total = 3'000'000LL * 1'000;
      ```
      Les deux littéraux sont des `int` : la multiplication se fait en `int` et déborde, avant la conversion en
      `long long`. Le suffixe `LL` fait faire le calcul dans le bon type.
