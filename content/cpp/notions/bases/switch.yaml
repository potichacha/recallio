notion: switch
lesson: |-
  **`switch`** choisit un bloc d'après la **valeur** d'une expression :

  ```cpp
  switch (jour) {
      case 6:
      case 7:
          std::println("week-end");
          break;
      case 1:
          std::println("lundi");
          break;
      default:
          std::println("en semaine");
          break;
  }
  ```

  - L'expression est un **entier**, un **`char`** ou une **énumération**. Pas un `double`, pas une `std::string`.
  - Chaque `case` est suivi d'une **constante** connue à la compilation.
  - **`break`** sort du `switch`. **Sans lui, l'exécution continue dans le `case` suivant** : c'est le passage au cas
    suivant (*fallthrough*).
  - **`default`** prend toutes les valeurs sans `case`. Il est facultatif : sans lui, une valeur inconnue ne fait rien.
  - Plusieurs `case` à la suite, sans code entre eux, partagent le même bloc (`case 6: case 7:`).

  **Le passage au cas suivant.** Presque toujours, c'est un `break` oublié. `-Wextra` le signale
  (`-Wimplicit-fallthrough`). Quand il est voulu, on le dit avec l'attribut **`[[fallthrough]];`** (C++17), qui fait
  taire l'avertissement et prévient le lecteur.

  **Déclarer une variable dans un `case`** demande des accolades autour du code du `case` : sans elles, la variable
  serait visible, mais non initialisée, dans les `case` suivants, et le compilateur refuse.

  Comme `if`, `switch` accepte une initialisation depuis C++17 : `switch (int code = lire(); code)`.

  **En entretien** : « Sans `break`, un `case` continue dans le suivant. Si c'est voulu, je l'écris avec
  `[[fallthrough]]`, et je compile avec `-Wextra` pour repérer les oublis. »
tour:
  - title: switch
    text: |-
      `switch` compare une valeur entière (ou un caractère) à une liste de `case`, et saute à celui qui correspond.
      `default` prend le reste.

      Chaque bloc finit par `break`. Sans lui, l'exécution **continue dans le `case` suivant** : c'est le piège du
      `switch`. Deux `case` à la suite partagent en revanche volontiers le même bloc.

      Essaie : retire le `break` du `case 1`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int jour = 1;

              switch (jour) {
                  case 1:
                      std::println("lundi");
                      break;
                  case 6:
                  case 7:
                      std::println("week-end");
                      break;
                  default:
                      std::println("en semaine");
                      break;
              }
          }
      output: "lundi"
cards:
  - key: role-de-break
    format: course
    question: "À quoi sert `break` à la fin d'un `case` ?"
    choices:
      - {text: "À sortir du `switch` : sans lui, l'exécution continue dans le `case` suivant", correct: true}
      - {text: "À arrêter le programme quand la valeur ne correspond à aucun `case`", correct: false}
      - {text: "À revenir au début du `switch` pour tester la valeur suivante", correct: false}
      - {text: "À rien d'utile : chaque `case` s'arrête de lui-même au suivant", correct: false}
    answer: "`break` saute à la fin du `switch`. Un `case` n'est qu'un point d'entrée : sans `break`, le code du `case` suivant s'exécute aussi."
  - key: types-acceptes
    format: course
    question: Sur quel type de valeur un `switch` peut-il porter ?
    choices:
      - {text: "Un entier, un `char` ou une énumération", correct: true}
      - {text: "N'importe quel type, y compris `std::string`", correct: false}
      - {text: "Un nombre, entier ou à virgule", correct: false}
      - {text: "Un `bool` seulement", correct: false}
    answer: "Un type entier (dont `char` et `bool`) ou une énumération. Pour un `double` ou une `std::string`, on écrit une chaîne de `if` / `else if`."
  - key: role-de-default
    format: course
    question: "Quand le bloc `default` d'un `switch` s'exécute-t-il ?"
    choices:
      - {text: "Quand la valeur ne correspond à aucun `case`", correct: true}
      - {text: "Avant le premier `case`, à chaque exécution", correct: false}
      - {text: "Après chaque `case`, pour finir le `switch`", correct: false}
      - {text: "Quand la valeur testée vaut zéro", correct: false}
    answer: "`default` recueille toutes les valeurs sans `case`. Il est facultatif : sans lui, une valeur inconnue ne fait rien."
  - key: role-de-fallthrough
    format: course
    question: "À quoi sert l'attribut `[[fallthrough]];` ?"
    choices:
      - {text: "À dire que le passage au `case` suivant est voulu", correct: true}
      - {text: "À interdire le passage au `case` suivant", correct: false}
      - {text: "À remplacer le `break` à la fin d'un `case`", correct: false}
      - {text: "À sauter directement au bloc `default`", correct: false}
    answer: "Il ne change pas l'exécution : il annonce au compilateur et au lecteur que l'absence de `break` est voulue. L'avertissement `-Wimplicit-fallthrough` se tait."
  - key: vf-default-obligatoire
    format: true-false
    question: Un `switch` doit toujours avoir un bloc `default`.
    truth: false
    answer: "`default` est facultatif. Sans lui, une valeur qui ne correspond à aucun `case` ne fait rien."
  - key: vf-switch-string
    format: true-false
    question: Un `switch` peut porter sur une `std::string`.
    truth: false
    answer: "`switch` n'accepte que les types entiers et les énumérations. Pour des chaînes, on enchaîne des `if`."
  - key: vf-case-variable
    format: true-false
    question: La valeur d'un `case` peut être une variable ordinaire, calculée à l'exécution.
    truth: false
    answer: "Un `case` exige une constante connue à la compilation : un littéral, une constante `constexpr` ou une valeur d'énumération."
  - key: vf-fallthrough-cpp17
    format: true-false
    question: "L'attribut `[[fallthrough]]` existe depuis C++17."
    truth: true
    answer: Il fait partie des attributs standard ajoutés par C++17, avec `[[nodiscard]]` et `[[maybe_unused]]`.
  - key: qcm-sans-break
    format: multiple-choice
    question: "Que se passe-t-il à la fin d'un `case` qui n'a pas de `break` ?"
    choices:
      - {text: "L'exécution continue dans le `case` suivant", correct: true}
      - {text: "L'exécution sort du `switch`", correct: false}
      - {text: "L'exécution reprend au début du `switch`", correct: false}
      - {text: "Le compilateur refuse le code", correct: false}
    answer: "Le code du `case` suivant s'exécute, sans que sa valeur soit testée. C'est le passage au cas suivant."
  - key: qcm-grouper
    format: multiple-choice
    question: Comment faire exécuter le même bloc pour les valeurs 6 et 7 ?
    choices:
      - {text: "`case 6: case 7:` suivis du bloc", correct: true}
      - {text: "`case 6, 7:` suivi du bloc", correct: false}
      - {text: "`case 6 || 7:` suivi du bloc", correct: false}
      - {text: "`case 6..7:` suivi du bloc", correct: false}
    answer: "Deux `case` à la suite, sans code entre eux : l'un comme l'autre mène au même bloc. `6 || 7` vaut `true`, soit 1 : le `case` ne répondrait qu'à la valeur 1."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Quel avertissement de GCC signale un `break` oublié entre deux `case` ?"
    choices:
      - {text: "`-Wimplicit-fallthrough`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wsign-compare`", correct: false}
      - {text: "`-Wunused-variable`", correct: false}
    answer: "`-Wimplicit-fallthrough`, activé par `-Wextra`. L'attribut `[[fallthrough]]` le fait taire quand le passage est voulu."
  - key: qcm-variable-dans-case
    format: multiple-choice
    question: "Comment déclarer une variable initialisée dans un `case` qui n'est pas le dernier ?"
    choices:
      - {text: "En entourant le code du `case` d'accolades", correct: true}
      - {text: "En la déclarant `static` dans le `case`", correct: false}
      - {text: "En ajoutant `break` avant sa déclaration", correct: false}
      - {text: "En la déclarant après le `default`", correct: false}
    answer: "Les accolades limitent la portée de la variable à ce `case`. Sans elles, un `case` suivant pourrait l'atteindre sans passer par son initialisation, et le compilateur refuse."
  - key: trous-switch
    format: fill-in
    question: |-
      Complète avec le mot-clé qui choisit un bloc d'après la valeur de `jour` :
      ```cpp
      ___ (jour) {
          case 1:
              std::println("lundi");
              break;
      }
      ```
    blanks:
      - [switch]
    answer: "`switch (valeur) { ... }` saute au `case` qui correspond."
  - key: trous-case
    format: fill-in
    question: |-
      Complète pour que ce bloc réponde à la valeur 2 :
      ```cpp
      switch (jour) {
          ___ 2:
              std::println("mardi");
              break;
      }
      ```
    blanks:
      - [case]
    answer: "`case 2:` marque le point d'entrée pour la valeur 2."
  - key: trous-break
    format: fill-in
    question: |-
      Complète pour que `lundi` ne soit pas suivi de `mardi` :
      ```cpp
      switch (jour) {
          case 1:
              std::println("lundi");
              ___;
          case 2:
              std::println("mardi");
              break;
      }
      ```
    blanks:
      - [break]
    answer: "`break;` sort du `switch`. Sans lui, le `case 2` s'exécuterait à la suite."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour traiter toutes les autres valeurs :
      ```cpp
      switch (jour) {
          case 1:
              std::println("lundi");
              break;
          ___:
              std::println("autre jour");
              break;
      }
      ```
    blanks:
      - [default]
    answer: "`default:` prend toutes les valeurs qui n'ont pas de `case`."
  - key: code-sans-break
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int jour = 1;
          switch (jour) {
              case 1:
                  std::println("lundi");
              case 2:
                  std::println("mardi");
                  break;
              case 3:
                  std::println("mercredi");
                  break;
          }
      }
      ```
    choices:
      - text: |-
          ```
          lundi
          mardi
          ```
        correct: true
      - {text: "`lundi`", correct: false}
      - text: |-
          ```
          lundi
          mardi
          mercredi
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      lundi
      mardi
      ```
      Le `case 1` n'a pas de `break` : l'exécution continue dans le `case 2`, dont le `break` sort du `switch`.
    check:
      output: |-
        lundi
        mardi
  - key: code-default
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int code = 9;
          switch (code) {
              case 1:
                  std::println("un");
                  break;
              default:
                  std::println("autre");
                  break;
              case 2:
                  std::println("deux");
                  break;
          }
      }
      ```
    choices:
      - {text: "`autre`", correct: true}
      - {text: "`deux`", correct: false}
      - text: |-
          ```
          autre
          deux
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: "`autre` : 9 n'a pas de `case`, c'est `default` qui s'exécute, où qu'il soit placé. Son `break` sort du `switch`."
    check:
      output: "autre"
  - key: code-groupes
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          char lettre = 'e';
          switch (lettre) {
              case 'a':
              case 'e':
              case 'i':
                  std::println("voyelle");
                  break;
              default:
                  std::println("consonne");
                  break;
          }
      }
      ```
    choices:
      - {text: "`voyelle`", correct: true}
      - {text: "`consonne`", correct: false}
      - text: |-
          ```
          voyelle
          consonne
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: "`voyelle` : l'exécution entre au `case 'e'`, traverse le `case 'i'`, qui n'a pas de code propre, et atteint l'affichage."
    check:
      output: "voyelle"
  - key: code-sans-default
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int code = 5;
          switch (code) {
              case 1:
                  std::println("un");
                  break;
              case 2:
                  std::println("deux");
                  break;
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`fin`", correct: true}
      - text: |-
          ```
          deux
          fin
          ```
        correct: false
      - text: |-
          ```
          un
          deux
          fin
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: "`fin` : aucun `case` ne correspond à 5, et il n'y a pas de `default`. Le `switch` ne fait rien, et le programme continue."
    check:
      output: "fin"
  - key: bug-break-oublie
    format: bug-fix
    question: |-
      Pour une commande « en préparation », ce programme affiche deux lignes au lieu d'une. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          int etat = 1;
          switch (etat) {
              case 1:
                  std::println("En préparation");
              case 2:
                  std::println("Expédiée");
                  break;
              default:
                  std::println("Inconnue");
                  break;
          }
      }
      ```
    choices:
      - {text: "Ajouter `break;` à la fin du `case 1`", correct: true}
      - {text: "Ajouter `[[fallthrough]];` à la fin du `case 1`", correct: false}
      - {text: "Retirer le `break;` du `case 2`", correct: false}
      - {text: "Placer le `default` avant le `case 1`", correct: false}
    answer: |-
      ```cpp
      case 1:
          std::println("En préparation");
          break;
      ```
      Sans `break`, l'exécution continue dans le `case 2`. `[[fallthrough]]` ne ferait que déclarer ce passage voulu.
  - key: bug-switch-string
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string commande = "stop";
          switch (commande) {
              case "stop":
                  std::println("Arrêt");
                  break;
              default:
                  std::println("Inconnue");
                  break;
          }
      }
      ```
    choices:
      - {text: "Remplacer le `switch` par `if (commande == \"stop\")` et un `else`", correct: true}
      - {text: "Écrire `case 'stop':` entre apostrophes", correct: false}
      - {text: "Ajouter `#include <switch>` en haut du fichier", correct: false}
      - {text: "Déclarer `commande` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      if (commande == "stop") {
          std::println("Arrêt");
      } else {
          std::println("Inconnue");
      }
      ```
      Un `switch` ne porte que sur un entier, un `char` ou une énumération. Pour des chaînes, on compare avec `==`.
  - key: bug-case-non-constant
    format: bug-fix
    question: |-
      Le compilateur répond « the value of 'seuil' is not usable in a constant expression ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          int seuil = 10;
          int valeur = 10;
          switch (valeur) {
              case seuil:
                  std::println("au seuil");
                  break;
              default:
                  std::println("ailleurs");
                  break;
          }
      }
      ```
    choices:
      - {text: "Déclarer `const int seuil = 10;`", correct: true}
      - {text: "Déclarer `auto seuil = 10;`", correct: false}
      - {text: "Écrire `case (seuil):` entre parenthèses", correct: false}
      - {text: "Écrire `case seuil;` avec un point-virgule", correct: false}
    answer: |-
      ```cpp
      const int seuil = 10;
      ```
      Un `case` exige une constante connue à la compilation. Une constante entière initialisée par un littéral en est
      une ; une variable ordinaire, non.
  - key: bug-variable-dans-case
    format: bug-fix
    question: |-
      Le compilateur répond « jump to case label », puis « crosses initialization of 'int remise' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int formule = 2;
          switch (formule) {
              case 1:
                  int remise = 10;
                  std::println("{}", remise);
                  break;
              case 2:
                  std::println("aucune remise");
                  break;
          }
      }
      ```
    choices:
      - {text: "Entourer d'accolades le code du `case 1`", correct: true}
      - {text: "Retirer le `break;` du `case 1`", correct: false}
      - {text: "Placer le `case 2` avant le `case 1`", correct: false}
      - {text: "Remplacer `int` par `auto` dans le `case 1`", correct: false}
    answer: |-
      ```cpp
      case 1: {
          int remise = 10;
          std::println("{}", remise);
          break;
      }
      ```
      Tout le `switch` est un seul bloc : sans accolades, `remise` serait visible dans le `case 2`, sans y être
      initialisée. Les accolades limitent sa portée au `case 1`.
