notion: types-fondamentaux
lesson: |-
  Les **types fondamentaux** sont ceux que le langage fournit, sans bibliothèque :

  | Type | Ce qu'il contient | Exemple | Taille habituelle |
  |---|---|---|---|
  | `int` | un entier | `int age = 43;` | 4 octets |
  | `double` | un nombre à virgule, en double précision | `double prix = 9.99;` | 8 octets |
  | `char` | un caractère | `char lettre = 'A';` | 1 octet |
  | `bool` | vrai ou faux | `bool actif = true;` | 1 octet |

  - **Les tailles ne sont pas fixées par la norme**, sauf celle de `char` : `sizeof(char)` vaut toujours 1. Un `int`
    fait au moins 16 bits ; il en fait 32 sur les machines courantes.
  - Un **`char`** s'écrit entre **apostrophes** : `'A'`. Les guillemets, `"A"`, font une chaîne de caractères. Un
    `char` est un petit entier, le code du caractère : `'A'` vaut 65.
  - Un **`bool`** vaut `true` ou `false`. Converti en entier, il donne 1 ou 0 ; à l'inverse, tout nombre non nul
    devient `true`.
  - Un littéral avec un point (`2.0`) est un `double` ; sans point (`2`), c'est un `int`. La division de deux `int`
    est entière : `7 / 2` vaut 3.
  - `float` est un nombre à virgule en simple précision, deux fois plus petit et moins précis ; `double` est le choix
    par défaut. `void` est le type « rien » : celui d'une fonction qui ne renvoie pas de valeur.

  **Piège classique** : ranger un nombre à virgule dans un `int`. `int prix = 9.99;` compile, et `prix` vaut 9 : la
  partie décimale est coupée, sans arrondi.

  **En entretien** : « La norme ne fixe que des tailles minimales. Quand j'ai besoin d'une taille exacte, j'utilise
  les types de `<cstdint>`, comme `std::int32_t`. »
tour:
  - title: Les types fondamentaux
    text: |-
      C++ a quatre types de base à connaître d'abord : `int` pour les entiers, `double` pour les nombres à virgule,
      `char` pour un caractère (entre apostrophes) et `bool` pour vrai ou faux.

      Le type décide du calcul : entre deux `int`, la division est entière ; dès qu'un `double` s'en mêle, elle garde
      la virgule.

      Essaie : remplace `7.0` par `7`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int entiere = 7 / 2;
              double exacte = 7.0 / 2;
              char lettre = 'A';
              bool majeur = 43 >= 18;

              std::println("{} {}", entiere, exacte);
              std::println("{} {}", lettre, majeur);
          }
      output: |-
        3 3.5
        A true
cards:
  - key: quatre-types
    format: course
    question: Quel type choisis-tu pour un prix comme 9,99 ?
    choices:
      - {text: "`double`, un nombre à virgule", correct: true}
      - {text: "`int`, un nombre entier", correct: false}
      - {text: "`char`, un caractère", correct: false}
      - {text: "`bool`, vrai ou faux", correct: false}
    answer: |-
      `double` : c'est le type des nombres à virgule. Un `int` couperait la partie décimale. (Pour de l'argent, en
      production, on compte plutôt en centimes dans un entier : un `double` ne représente pas 9,99 exactement.)
  - key: tailles-garanties
    format: course
    question: Que garantit la norme sur la taille d'un `int` ?
    choices:
      - {text: "Au moins 16 bits ; 32 sur les machines courantes", correct: true}
      - {text: "Exactement 32 bits, sur toutes les machines", correct: false}
      - {text: "Exactement 64 bits sur une machine 64 bits", correct: false}
      - {text: "Rien : un `int` peut ne faire qu'un octet", correct: false}
    answer: |-
      La norme ne donne qu'un minimum : 16 bits. Les compilateurs courants lui en donnent 32, y compris sur une
      machine 64 bits. Pour une taille exacte, on utilise `std::int32_t`.
  - key: char-est-un-entier
    format: course
    question: "Que contient vraiment une variable `char` ?"
    choices:
      - {text: "Un petit entier : le code du caractère", correct: true}
      - {text: "Une chaîne d'un seul caractère", correct: false}
      - {text: "Un dessin du caractère, pour l'écran", correct: false}
      - {text: "Une adresse vers le caractère en mémoire", correct: false}
    answer: |-
      Un `char` est un entier sur un octet, qui contient le code du caractère : 65 pour `'A'`. C'est pourquoi on peut
      calculer avec : `'A' + 1` vaut 66.
  - key: division-entiere
    format: course
    question: "Pourquoi `7 / 2` vaut-il 3 en C++ ?"
    choices:
      - {text: "Les deux opérandes sont des `int` : la division est entière", correct: true}
      - {text: "C++ arrondit toujours les divisions à l'entier le plus proche", correct: false}
      - {text: "L'opérateur `/` calcule le reste de la division", correct: false}
      - {text: "Le résultat est 3.5, mais l'affichage coupe les décimales", correct: false}
    answer: |-
      Entre deux entiers, `/` est la division entière : la partie décimale est abandonnée, sans arrondi. Dès qu'un
      opérande est un `double`, comme dans `7.0 / 2`, le résultat est 3.5.
  - key: vf-sizeof-char
    format: true-false
    question: "`sizeof(char)` vaut 1 sur toutes les machines."
    truth: true
    answer: "C'est la seule taille que la norme fixe : `sizeof` compte en `char`."
  - key: vf-int-32-bits
    format: true-false
    question: La norme C++ garantit qu'un `int` fait exactement 32 bits.
    truth: false
    answer: Elle garantit au moins 16 bits. 32 bits est l'usage des compilateurs courants, pas une garantie.
  - key: vf-char-guillemets
    format: true-false
    question: "`\"A\"`, entre guillemets, est une valeur de type `char`."
    truth: false
    answer: "Un `char` s'écrit entre apostrophes : `'A'`. Entre guillemets, `\"A\"` est une chaîne de caractères."
  - key: vf-bool-en-entier
    format: true-false
    question: "Converti en entier, `true` vaut 1."
    truth: true
    answer: "`true` donne 1 et `false` donne 0. Dans l'autre sens, tout nombre non nul devient `true`."
  - key: qcm-type-du-litteral
    format: multiple-choice
    question: "Quel est le type du littéral `2.0` ?"
    choices:
      - {text: "`double`", correct: true}
      - {text: "`float`", correct: false}
      - {text: "`int`", correct: false}
      - {text: "`long`", correct: false}
    answer: "Un littéral avec un point est un `double`. Pour un `float`, il faut le suffixe `f` : `2.0f`."
  - key: qcm-ecrire-un-char
    format: multiple-choice
    question: Comment écris-tu le caractère A pour le ranger dans un `char` ?
    choices:
      - {text: "`'A'`", correct: true}
      - {text: "`\"A\"`", correct: false}
      - {text: "`A`", correct: false}
      - {text: "`{A}`", correct: false}
    answer: "Entre apostrophes : `'A'`. `\"A\"` est une chaîne, et `A` seul serait le nom d'une variable."
  - key: qcm-float-ou-double
    format: multiple-choice
    question: Quel type à virgule utilise-t-on par défaut ?
    choices:
      - {text: "`double`, plus précis", correct: true}
      - {text: "`float`, plus précis", correct: false}
      - {text: "`float`, le seul type standard", correct: false}
      - {text: "`int`, avec une virgule fixe", correct: false}
    answer: |-
      `double`, en double précision : une quinzaine de chiffres significatifs, contre sept environ pour `float`. On
      garde `float` pour les gros volumes de données, où sa taille compte.
  - key: qcm-nombre-en-bool
    format: multiple-choice
    question: "Que vaut `actif` après `bool actif = 42;` ?"
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`42`", correct: false}
      - {text: "Rien : le code ne compile pas", correct: false}
    answer: "`true` : tout nombre non nul se convertit en `true`, et zéro en `false`. Un `bool` ne garde pas le 42."
  - key: trous-double
    format: fill-in
    question: |-
      Complète avec le type des nombres à virgule en double précision :
      ```cpp
      ___ pi = 3.14159;
      ```
    blanks:
      - [double]
    answer: "`double` est le type à virgule par défaut."
  - key: trous-char
    format: fill-in
    question: |-
      Complète avec le type d'un caractère :
      ```cpp
      ___ initiale = 'A';
      ```
    blanks:
      - [char]
    answer: "`char` contient un caractère, écrit entre apostrophes."
  - key: trous-bool
    format: fill-in
    question: |-
      Complète avec le type qui vaut vrai ou faux :
      ```cpp
      ___ majeur = age >= 18;
      ```
    blanks:
      - [bool]
    answer: "Une comparaison donne un `bool` : `true` ou `false`."
  - key: trous-apostrophes
    format: fill-in
    question: |-
      Complète pour ranger la lettre A dans un `char` :
      ```cpp
      char lettre = ___;
      ```
    blanks:
      - ["'A'"]
    answer: "Un caractère s'écrit entre apostrophes : `'A'`."
  - key: code-sizeof-char
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          std::println("{}", sizeof(char));
      }
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`2`", correct: false}
    answer: "`1` : `sizeof` compte en `char`, donc `sizeof(char)` vaut 1 par définition. Un `char` fait 8 bits sur les machines courantes, mais `sizeof` ne compte pas en bits."
    check:
      output: "1"
  - key: code-char-plus-un
    format: code-output
    question: |-
      Le code du caractère `A` est 65.
      ```cpp
      #include <iostream>

      int main() {
          char c = 'A';
          std::cout << c << " " << c + 1 << "\n";
      }
      ```
    choices:
      - {text: "`A 66`", correct: true}
      - {text: "`A B`", correct: false}
      - {text: "`65 66`", correct: false}
      - {text: "`A A1`", correct: false}
    answer: |-
      `A 66` : `c` est un `char`, affiché comme un caractère. Dans `c + 1`, le `char` est converti en `int` avant
      l'addition : le résultat est l'entier 66, affiché comme un nombre.
    check:
      output: "A 66"
  - key: code-bool-cout
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          bool actif = 42;
          bool vide = 0;
          std::cout << actif << vide << "\n";
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`420`", correct: false}
      - {text: "`truefalse`", correct: false}
      - {text: "`11`", correct: false}
    answer: |-
      `10` : 42, non nul, devient `true`, et 0 devient `false`. `std::cout` affiche un `bool` comme 1 ou 0 ;
      `std::println` écrirait `true` et `false`.
    check:
      output: "10"
  - key: code-division
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int entiere = 7 / 2;
          double exacte = 7.0 / 2;
          std::println("{} {}", entiere, exacte);
      }
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3.5 3.5`", correct: false}
      - {text: "`4 3.5`", correct: false}
      - {text: "`3 3`", correct: false}
    answer: |-
      `3 3.5` : `7 / 2` divise deux `int`, le résultat est l'entier 3, sans arrondi. Dans `7.0 / 2`, le `double`
      entraîne une division à virgule.
    check:
      output: "3 3.5"
  - key: bug-char-guillemets
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          char lettre = "A";
          std::println("{}", lettre);
      }
      ```
    choices:
      - {text: "Écrire `'A'` entre apostrophes", correct: true}
      - {text: "Écrire `A` sans rien autour", correct: false}
      - {text: "Remplacer `char` par `bool`", correct: false}
      - {text: "Écrire `\"A\"[1]` pour la lettre", correct: false}
    answer: |-
      ```cpp
      char lettre = 'A';
      ```
      Entre guillemets, `"A"` est une chaîne de caractères, qui ne se range pas dans un `char`.
  - key: bug-prix-tronque
    format: bug-fix
    question: |-
      Ce programme affiche `9` au lieu de `9.99`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int prix = 9.99;
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Déclarer `prix` avec le type `double`", correct: true}
      - {text: "Écrire `9,99` avec une virgule", correct: false}
      - {text: "Écrire `\"{:.2f}\"` dans l'affichage", correct: false}
      - {text: "Déclarer `prix` avec le type `char`", correct: false}
    answer: |-
      ```cpp
      double prix = 9.99;
      ```
      Un `int` ne garde que la partie entière : la conversion coupe `.99` dès l'initialisation. Changer le format
      d'affichage n'y ferait rien, la valeur est déjà perdue.
  - key: bug-bool-texte
    format: bug-fix
    question: |-
      Ce programme affiche `true`, alors que l'auteur voulait `false`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          bool majeur = "false";
          std::println("{}", majeur);
      }
      ```
    choices:
      - {text: "`\"false\"` est une chaîne, et une chaîne se convertit en `true`", correct: true}
      - {text: "`std::println` affiche toujours `true` pour un `bool`", correct: false}
      - {text: "`false` doit s'écrire avec une majuscule : `False`", correct: false}
      - {text: "Un `bool` vaut `true` tant qu'on ne l'a pas affecté", correct: false}
    answer: |-
      ```cpp
      bool majeur = false;
      ```
      `false` est un mot-clé, sans guillemets. `"false"` est une chaîne : elle a une adresse en mémoire, non nulle, que
      la conversion en `bool` transforme en `true`.
  - key: bug-char-nombre
    format: bug-fix
    question: |-
      Ce programme affiche `A` au lieu de `65`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          char points = 65;
          std::println("{}", points);
      }
      ```
    choices:
      - {text: "Déclarer `points` avec le type `int`", correct: true}
      - {text: "Écrire `'65'` entre apostrophes", correct: false}
      - {text: "Écrire `\"65\"` entre guillemets", correct: false}
      - {text: "Déclarer `points` avec le type `bool`", correct: false}
    answer: |-
      ```cpp
      int points = 65;
      ```
      Un `char` s'affiche comme un caractère : 65 est le code de `A`. Pour un nombre, on prend un type entier.
  - key: definition-type-fondamental
    format: definition
    question: Qu'est-ce qu'un « type fondamental » ?
    choices:
      - {text: "Un type fourni par le langage lui-même, comme `int` ou `bool`", correct: true}
      - {text: "Un type défini dans la bibliothèque standard, comme `std::string`", correct: false}
      - {text: "Un type que le développeur définit avec une classe", correct: false}
      - {text: "Un type dont la taille est la même sur toutes les machines", correct: false}
    answer: |-
      Un type intégré au langage : entiers, flottants, `char`, `bool`, `void`. `std::string` est une classe de la
      bibliothèque standard, bâtie avec ces types.
  - key: definition-octet
    format: definition
    question: "Que mesure `sizeof` ?"
    choices:
      - {text: "La taille d'un type ou d'une variable, en octets", correct: true}
      - {text: "La taille d'un type ou d'une variable, en bits", correct: false}
      - {text: "Le nombre de chiffres d'un nombre", correct: false}
      - {text: "La plus grande valeur d'un type", correct: false}
    answer: "`sizeof` donne une taille en octets, plus exactement en `char` : `sizeof(char)` vaut 1."
  - key: definition-bool
    format: definition
    question: Qu'est-ce qu'un booléen ?
    choices:
      - {text: "Une valeur qui ne peut être que vraie ou fausse", correct: true}
      - {text: "Un entier qui ne peut pas être négatif", correct: false}
      - {text: "Un nombre à virgule en simple précision", correct: false}
      - {text: "Un caractère qui vaut `'0'` ou `'1'`", correct: false}
    answer: "Une valeur à deux états, `true` ou `false`. En C++, c'est le type `bool`."
  - key: definition-double
    format: definition
    question: "Que désigne « double » dans le type `double` ?"
    choices:
      - {text: "La double précision : deux fois celle d'un `float`", correct: true}
      - {text: "Deux nombres rangés dans la même variable", correct: false}
      - {text: "Un entier deux fois plus grand qu'un `int`", correct: false}
      - {text: "Un nombre toujours multiplié par deux", correct: false}
    answer: |-
      La **double précision** : un `double` occupe en général 64 bits, contre 32 pour un `float` en simple précision,
      et garde environ deux fois plus de chiffres significatifs.
