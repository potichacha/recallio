notion: nodiscard-attributs
lesson: |-
  Un **attribut** s'écrit entre doubles crochets, `[[...]]`, devant une déclaration. Il ne change pas ce que fait le
  programme : il donne une **information au compilateur**, qui s'en sert pour avertir ou pour optimiser.

  **`[[nodiscard]]` : ne pas ignorer le résultat.**

  ```cpp
  [[nodiscard]] bool enregistrer(const Commande& commande);

  enregistrer(commande);          // avertissement : résultat ignoré
  ```

  Le compilateur avertit quand la valeur de retour n'est pas utilisée. On le met sur les fonctions dont le résultat
  **est** la raison de l'appel : un code d'erreur, une ressource à libérer, le résultat d'un calcul pur. Depuis
  C++20, on peut donner une raison : `[[nodiscard("vérifie le code d'erreur")]]`.

  Il se place aussi sur un **type** : toute fonction qui renvoie ce type est alors concernée.

  ```cpp
  struct [[nodiscard]] Erreur { int code; };
  ```

  Pour ignorer volontairement un résultat, on le dit : `(void)enregistrer(commande);` ou
  `std::ignore = enregistrer(commande);`.

  **`[[maybe_unused]]` : inutilisé, et c'est voulu.** Il fait taire les avertissements `-Wunused` pour une
  variable, un paramètre ou une fonction.

  ```cpp
  void traiter([[maybe_unused]] int niveau) {
      // niveau ne sert que dans certaines configurations
  }
  ```

  **`[[deprecated]]` : ne plus utiliser.** Le compilateur avertit à chaque usage, avec le message donné.

  ```cpp
  [[deprecated("utilise charger_v2")]]
  void charger();
  ```

  C'est la façon de retirer une fonction en douceur : elle marche encore, mais chaque appelant est prévenu.

  **Les autres attributs standard.**

  | Attribut | Sens |
  |---|---|
  | `[[fallthrough]]` | dans un `switch`, le passage au `case` suivant est voulu |
  | `[[noreturn]]` | la fonction ne revient jamais (elle lance, ou termine le programme) |
  | `[[likely]]`, `[[unlikely]]` (C++20) | la branche est probable, ou improbable : un indice pour l'optimiseur |
  | `[[no_unique_address]]` (C++20) | un membre vide peut ne pas occuper de place |

  **Ce sont des avertissements.** Sans `-Werror`, le programme compile quand même. Et un attribut **inconnu** du
  compilateur est ignoré, avec un avertissement au plus : ajouter un attribut ne casse pas la compilation.

  **En entretien** : « Les attributs informent le compilateur sans changer le comportement. `[[nodiscard]]` sur
  les fonctions dont il ne faut pas ignorer le retour, `[[maybe_unused]]` pour un inutilisé voulu,
  `[[deprecated]]` pour retirer une API en douceur, `[[fallthrough]]` dans un `switch`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un attribut, comme `[[nodiscard]]` ?"
    choices:
      - {text: "Une information donnée au compilateur, qui ne change pas ce que fait le programme", correct: true}
      - {text: "Une macro du préprocesseur, remplacée avant la compilation", correct: false}
      - {text: "Un membre caché que le compilateur ajoute à la classe", correct: false}
      - {text: "Un commentaire que le compilateur recopie dans l'exécutable", correct: false}
    answer: "Le compilateur s'en sert pour émettre des avertissements, ou pour optimiser. Le comportement du programme reste le même."
  - key: nodiscard
    format: course
    question: "Que fait `[[nodiscard]]` devant une fonction ?"
    choices:
      - {text: "Le compilateur avertit quand la valeur de retour est ignorée", correct: true}
      - {text: "Le compilateur refuse que la fonction renvoie `void`", correct: false}
      - {text: "La fonction ne peut plus lancer d'exception", correct: false}
      - {text: "La valeur de retour est gardée en mémoire jusqu'à la fin du programme", correct: false}
    answer: "On le met là où ignorer le résultat est presque toujours une faute : un code d'erreur, une ressource, un calcul pur."
  - key: deprecated
    format: course
    question: "À quoi sert `[[deprecated(\"utilise charger_v2\")]]` ?"
    choices:
      - {text: "À faire avertir le compilateur à chaque usage de la fonction, avec ce message", correct: true}
      - {text: "À empêcher la fonction d'être appelée : le code ne compile plus", correct: false}
      - {text: "À rediriger les appels vers `charger_v2`, sans toucher au code", correct: false}
      - {text: "À supprimer la fonction de l'exécutable final", correct: false}
    answer: "La fonction marche toujours. Les appelants sont prévenus qu'elle disparaîtra, et de ce qu'il faut utiliser à la place."
  - key: maybe-unused
    format: course
    question: "Quand écrit-on `[[maybe_unused]]` ?"
    choices:
      - {text: "Devant une variable ou un paramètre volontairement inutilisé, pour faire taire l'avertissement", correct: true}
      - {text: "Devant une variable que le compilateur a le droit de supprimer du programme", correct: false}
      - {text: "Devant une fonction dont la valeur de retour peut être ignorée", correct: false}
      - {text: "Devant une variable qui peut ne pas être initialisée", correct: false}
    answer: "Il neutralise `-Wunused` à cet endroit précis, et dit au lecteur que c'est voulu."
  - key: vf-comportement
    format: true-false
    question: "Ajouter `[[nodiscard]]` à une fonction change la valeur qu'elle renvoie."
    truth: false
    answer: "Un attribut ne modifie pas le comportement. Il fait seulement apparaître un avertissement."
  - key: vf-erreur
    format: true-false
    question: "Sans `-Werror`, ignorer le résultat d'une fonction `[[nodiscard]]` empêche la compilation."
    truth: false
    answer: "C'est un avertissement : le programme compile. Avec `-Werror`, il devient une erreur."
  - key: vf-type
    format: true-false
    question: "`[[nodiscard]]` peut se placer sur un type, comme une `struct`."
    truth: true
    answer: "Toute fonction qui renvoie ce type par valeur est alors concernée."
  - key: vf-fallthrough
    format: true-false
    question: "`[[fallthrough]]` indique qu'un `case` passe volontairement au suivant."
    truth: true
    answer: "Il fait taire `-Wimplicit-fallthrough`, et dit que le `break` n'a pas été oublié."
  - key: qcm-ignorer
    format: multiple-choice
    question: "Comment ignores-tu volontairement le résultat d'une fonction `[[nodiscard]]`, sans avertissement ?"
    choices:
      - {text: "`(void)enregistrer(commande);`", correct: true}
      - {text: "`[[maybe_unused]] enregistrer(commande);`", correct: false}
      - {text: "`enregistrer(commande) = 0;`", correct: false}
      - {text: "`ignore enregistrer(commande);`", correct: false}
    answer: "La conversion en `void` dit que l'on jette la valeur exprès. `std::ignore = ...` convient aussi."
  - key: qcm-noreturn
    format: multiple-choice
    question: "Quel attribut dit qu'une fonction ne revient jamais à son appelant ?"
    choices:
      - {text: "`[[noreturn]]`", correct: true}
      - {text: "`[[nodiscard]]`", correct: false}
      - {text: "`[[fallthrough]]`", correct: false}
      - {text: "`[[deprecated]]`", correct: false}
    answer: "Pour une fonction qui lance toujours, ou qui appelle `std::abort` ou `std::exit`."
  - key: qcm-likely
    format: multiple-choice
    question: "À quoi servent `[[likely]]` et `[[unlikely]]` ?"
    choices:
      - {text: "À dire à l'optimiseur quelle branche est la plus probable", correct: true}
      - {text: "À faire avertir le compilateur quand une branche est vide", correct: false}
      - {text: "À vérifier une condition pendant l'exécution", correct: false}
      - {text: "À interdire l'exécution d'une branche", correct: false}
    answer: "Ce sont des indices, depuis C++20. On ne les pose qu'après mesure : l'optimiseur se trompe rarement."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Quelle écriture est celle d'un attribut standard ?"
    choices:
      - {text: "`[[nodiscard]] int f();`", correct: true}
      - {text: "`@nodiscard int f();`", correct: false}
      - {text: "`#nodiscard int f();`", correct: false}
      - {text: "`<nodiscard> int f();`", correct: false}
    answer: "Des doubles crochets, devant la déclaration."
  - key: trous-nodiscard
    format: fill-in
    question: |-
      Complète pour que le compilateur avertisse si le résultat est ignoré :
      ```cpp
      [[___]] bool enregistrer(int valeur);
      ```
    blanks:
      - [nodiscard]
    answer: "`[[nodiscard]]` protège la valeur de retour."
  - key: trous-maybe-unused
    format: fill-in
    question: |-
      Complète pour dire que le paramètre est volontairement inutilisé :
      ```cpp
      void journaliser([[___]] int niveau) {
      }
      ```
    blanks:
      - [maybe_unused]
    answer: "`[[maybe_unused]]` fait taire `-Wunused-parameter`."
  - key: trous-deprecated
    format: fill-in
    question: |-
      Complète pour prévenir les appelants que la fonction va disparaître :
      ```cpp
      [[___("utilise charger_v2")]]
      void charger();
      ```
    blanks:
      - [deprecated]
    answer: "`[[deprecated]]` fait avertir à chaque usage, avec le message."
  - key: trous-fallthrough
    format: fill-in
    question: |-
      Complète pour dire que le passage au `case` suivant est voulu :
      ```cpp
      switch (niveau) {
      case 2:
          ajouter_bonus();
          [[___]];
      case 1:
          ajouter_base();
          break;
      }
      ```
    blanks:
      - [fallthrough]
    answer: "`[[fallthrough]];` se place là où l'on aurait attendu un `break`."
  - key: code-nodiscard
    format: code-output
    question: |-
      ```cpp
      #include <print>

      [[nodiscard]] int doubler(int n) {
          return n * 2;
      }

      int main() {
          const int a = doubler(4);
          (void)doubler(100);
          std::println("{}", a);
      }
      ```
    choices:
      - {text: "`8`", correct: true}
      - {text: "`200`", correct: false}
      - {text: "`208`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`8` : l'attribut ne change pas le résultat. Le second appel est ignoré exprès, par `(void)`."
    check:
      output: "8"
  - key: code-fallthrough
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int points(int niveau) {
          int total = 0;
          switch (niveau) {
          case 2:
              total += 10;
              [[fallthrough]];
          case 1:
              total += 1;
              break;
          default:
              total = -1;
          }
          return total;
      }

      int main() {
          std::println("{} {} {}", points(2), points(1), points(5));
      }
      ```
    choices:
      - {text: "`11 1 -1`", correct: true}
      - {text: "`10 1 -1`", correct: false}
      - {text: "`11 1 0`", correct: false}
      - {text: "`10 11 -1`", correct: false}
    answer: "`11 1 -1` : sans `break`, le `case 2` continue dans le `case 1`. L'attribut ne fait que le signaler."
    check:
      output: "11 1 -1"
  - key: code-deprecated
    format: code-output
    question: |-
      ```cpp
      #include <print>

      [[deprecated("utilise aire_v2")]]
      int aire(int cote) {
          return cote * cote;
      }

      int main() {
          std::println("{}", aire(3));
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9` : une fonction dépréciée fonctionne toujours. Le compilateur avertit seulement de son usage."
    check:
      output: "9"
  - key: code-maybe-unused
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int somme(int a, [[maybe_unused]] int b) {
          return a + a;
      }

      int main() {
          [[maybe_unused]] const int inutile = 7;
          std::println("{}", somme(2, 50));
      }
      ```
    choices:
      - {text: "`4`", correct: true}
      - {text: "`52`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`4` : `b` est reçu, mais la fonction ne s'en sert pas. L'attribut fait seulement taire l'avertissement."
    check:
      output: "4"
  - key: bug-resultat-ignore
    format: bug-fix
    question: |-
      GCC avertit : « ignoring return value of 'bool retirer(int&, int)', declared with attribute 'nodiscard' ».
      Le programme affiche `10` sans signaler le retrait refusé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      [[nodiscard]] bool retirer(int& solde, int montant) {
          if (montant > solde) {
              return false;
          }
          solde -= montant;
          return true;
      }

      int main() {
          int solde = 10;
          retirer(solde, 50);
          std::println("{}", solde);
      }
      ```
    choices:
      - {text: "Tester le résultat : `if (!retirer(solde, 50)) { ... }`", correct: true}
      - {text: "Retirer l'attribut `[[nodiscard]]` de la fonction", correct: false}
      - {text: "Écrire `(void)retirer(solde, 50);` pour faire taire le message", correct: false}
      - {text: "Déclarer la fonction avec le type de retour `void`", correct: false}
    answer: |-
      ```cpp
      if (!retirer(solde, 50)) {
          std::println("retrait refusé");
      }
      ```
      L'avertissement montre un vrai défaut : l'échec passe inaperçu. Le faire taire ne corrige rien.
  - key: bug-attribut-mal-place
    format: bug-fix
    question: |-
      GCC avertit : « unused variable 'essais' ». L'auteur voulait pourtant le faire taire. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          [[nodiscard]] const int essais = 3;
          std::println("fin");
      }
      ```
    choices:
      - {text: "Écrire `[[maybe_unused]] const int essais = 3;`", correct: true}
      - {text: "Écrire `[[deprecated]] const int essais = 3;`", correct: false}
      - {text: "Écrire `[[fallthrough]] const int essais = 3;`", correct: false}
      - {text: "Écrire `[[noreturn]] const int essais = 3;`", correct: false}
    answer: |-
      ```cpp
      [[maybe_unused]] const int essais = 3;
      ```
      `[[nodiscard]]` concerne une valeur de retour, et n'a pas de sens sur une variable. C'est `[[maybe_unused]]`
      qui dit qu'une variable inutilisée l'est exprès.
  - key: bug-fallthrough-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1` pour le niveau 1. Il affiche `11`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int niveau = 1;
          int total = 0;
          switch (niveau) {
          case 1:
              total += 1;
              [[fallthrough]];
          case 2:
              total += 10;
              break;
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Remplacer `[[fallthrough]];` par `break;`", correct: true}
      - {text: "Remplacer `[[fallthrough]];` par `[[nodiscard]];`", correct: false}
      - {text: "Retirer le `break` du `case 2`", correct: false}
      - {text: "Placer `[[fallthrough]];` avant `total += 1;`", correct: false}
    answer: |-
      ```cpp
      case 1:
          total += 1;
          break;
      ```
      `[[fallthrough]]` n'arrête rien : il dit que l'on continue exprès dans le `case` suivant. Pour s'arrêter, il
      faut un `break`.
  - key: bug-deprecated-toujours-appele
    format: bug-fix
    question: |-
      GCC avertit : « 'int ancienne_taxe(int)' is deprecated: utilise taxe ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int taxe(int prix) {
          return prix / 5;
      }

      [[deprecated("utilise taxe")]]
      int ancienne_taxe(int prix) {
          return taxe(prix);
      }

      int main() {
          std::println("{}", ancienne_taxe(100));
      }
      ```
    choices:
      - {text: "Appeler `taxe(100)` dans `main`", correct: true}
      - {text: "Ajouter `[[deprecated]]` à la fonction `main`", correct: false}
      - {text: "Ajouter `[[maybe_unused]]` devant l'appel", correct: false}
      - {text: "Renommer `ancienne_taxe` en `taxe2`, avec son attribut", correct: false}
    answer: |-
      ```cpp
      std::println("{}", taxe(100));
      ```
      Le message dit quoi faire : passer à la fonction qui remplace l'ancienne. C'est le but de `[[deprecated]]`.
