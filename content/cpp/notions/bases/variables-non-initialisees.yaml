notion: variables-non-initialisees
lesson: |-
  Une variable **locale** d'un type fondamental, déclarée sans valeur, **n'est pas mise à zéro** :

  ```cpp
  int main() {
      int total;                    // valeur indéterminée
      std::println("{}", total);    // comportement indéfini
  }
  ```

  Sa valeur est **indéterminée** : ce qui traînait à cet endroit de la mémoire. La **lire** est un **comportement
  indéfini** : le programme peut afficher 0, un nombre énorme, ou se comporter autrement d'une exécution à l'autre.
  C++ fait ce choix pour ne pas payer une mise à zéro dont on n'aurait pas besoin.

  Ce qui est initialisé sans qu'on le demande :

  - une variable **globale** ou **`static`** d'un type fondamental vaut zéro ;
  - un objet d'une classe qui a un constructeur par défaut, comme `std::string` (une chaîne vide) ou `std::vector` (un
    tableau vide).

  **La règle** : initialiser chaque variable à sa déclaration. `int total{};` vaut zéro, et on déclare une variable au
  moment où l'on connaît sa valeur, pas en haut de la fonction.

  **Les garde-fous** : `-Wall` signale les lectures les plus évidentes (`-Wuninitialized`), mais pas toutes. À
  l'exécution, Valgrind et MemorySanitizer détectent les autres.

  **Piège classique** : « ça marche chez moi ». Sans optimisation, la mémoire contient souvent zéro, et le bug ne se
  montre qu'en production, avec `-O2`.

  **En entretien** : « Contrairement à Java, C++ n'initialise pas les variables locales des types fondamentaux. Les lire
  est un comportement indéfini, donc j'initialise toujours à la déclaration. »
tour:
  - title: Toujours initialiser
    text: |-
      Une variable locale déclarée sans valeur, comme `int total;`, n'est pas mise à zéro : elle contient ce qui
      traînait en mémoire. La lire est un **comportement indéfini** : le langage ne garantit plus rien.

      Prends l'habitude d'initialiser à la déclaration. Des accolades vides suffisent pour partir de zéro.

      Essaie : retire les accolades de `int total{};`, puis exécute plusieurs fois. Le résultat n'est plus garanti,
      même s'il semble parfois juste.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int total{};
              total = total + 5;
              std::println("Total : {}", total);
          }
      output: "Total : 5"
cards:
  - key: valeur-indeterminee
    format: course
    question: "Dans une fonction, que vaut `total` après `int total;` ?"
    choices:
      - {text: "Une valeur indéterminée : ce qui traînait en mémoire", correct: true}
      - {text: "Zéro, comme toute variable sans valeur de départ", correct: false}
      - {text: "La plus petite valeur que peut prendre un `int`", correct: false}
      - {text: "Rien : la variable n'existe qu'à sa première affectation", correct: false}
    answer: |-
      Sa valeur est indéterminée : C++ réserve la place, sans l'effacer. Lire cette valeur est un comportement
      indéfini.
  - key: pourquoi-pas-de-zero
    format: course
    question: Pourquoi C++ ne met-il pas à zéro les variables locales ?
    choices:
      - {text: "Pour ne pas payer une écriture dont le programme n'a peut-être pas besoin", correct: true}
      - {text: "Parce que zéro n'est pas une valeur valide pour tous les types entiers", correct: false}
      - {text: "Parce que le compilateur ne connaît pas la taille d'une variable locale", correct: false}
      - {text: "Pour obliger le développeur à lire la mémoire avant de l'utiliser", correct: false}
    answer: |-
      C'est le principe « on ne paie pas pour ce qu'on n'utilise pas » : si la variable reçoit sa vraie valeur juste
      après, la mise à zéro serait du travail perdu. Le prix est un piège, qu'on évite en initialisant soi-même.
  - key: globale-a-zero
    format: course
    question: "Hors de toute fonction, que vaut `compteur` après `int compteur;` ?"
    choices:
      - {text: "Zéro : une variable globale est mise à zéro", correct: true}
      - {text: "Une valeur indéterminée, comme une variable locale", correct: false}
      - {text: "La valeur qu'avait `compteur` à l'exécution précédente", correct: false}
      - {text: "Rien : une variable globale doit avoir une valeur de départ", correct: false}
    answer: |-
      Zéro. Les variables globales et `static` sont mises à zéro avant le démarrage du programme. Seules les
      variables locales ordinaires des types fondamentaux restent indéterminées.
  - key: lire-est-indefini
    format: course
    question: Que risque un programme qui lit une variable locale non initialisée ?
    choices:
      - {text: "Un comportement indéfini : n'importe quel résultat, d'une exécution à l'autre", correct: true}
      - {text: "Une exception, que le programme peut rattraper pour continuer", correct: false}
      - {text: "Une erreur de compilation, dans tous les cas de figure", correct: false}
      - {text: "Rien : la variable vaut zéro tant qu'elle n'est pas affectée", correct: false}
    answer: |-
      C'est un comportement indéfini : aucune exception, aucune garantie. Le programme peut sembler juste, afficher
      n'importe quoi, ou changer de résultat selon les options de compilation.
  - key: vf-locale-zero
    format: true-false
    question: Dans une fonction, une variable `int` déclarée sans valeur vaut zéro.
    truth: false
    answer: Sa valeur est indéterminée. Seules les variables globales et `static` sont mises à zéro.
  - key: vf-string-vide
    format: true-false
    question: "Une `std::string` locale déclarée sans valeur est une chaîne vide."
    truth: true
    answer: "`std::string` est une classe : son constructeur par défaut crée une chaîne vide. Le piège ne concerne que les types fondamentaux."
  - key: vf-wall-detecte-tout
    format: true-false
    question: L'option `-Wall` signale toutes les lectures de variables non initialisées.
    truth: false
    answer: |-
      Elle signale les cas évidents. Quand l'initialisation dépend d'une condition ou d'un autre fichier, le compilateur
      peut ne rien voir : il faut un outil à l'exécution, comme Valgrind ou MemorySanitizer.
  - key: vf-accolades-vides
    format: true-false
    question: "`int total{};` donne à `total` la valeur zéro."
    truth: true
    answer: Des accolades vides initialisent à la valeur nulle du type.
  - key: qcm-declaration-sure
    format: multiple-choice
    question: Dans une fonction, laquelle de ces déclarations laisse une valeur indéterminée ?
    choices:
      - {text: "`int n;`", correct: true}
      - {text: "`int n{};`", correct: false}
      - {text: "`int n = 0;`", correct: false}
      - {text: "`static int n;`", correct: false}
    answer: "`int n;`. Les accolades vides et `= 0` initialisent à zéro, et une variable `static` est mise à zéro d'office."
  - key: qcm-outil
    format: multiple-choice
    question: Quel outil détecte, à l'exécution, la lecture d'une mémoire non initialisée ?
    choices:
      - {text: "Valgrind", correct: true}
      - {text: "CMake", correct: false}
      - {text: "Git", correct: false}
      - {text: "Doxygen", correct: false}
    answer: |-
      Valgrind (et MemorySanitizer, avec Clang) surveille la mémoire pendant l'exécution. CMake construit le projet,
      Git le versionne, Doxygen génère sa documentation.
  - key: qcm-deux-variables
    format: multiple-choice
    question: "Dans une fonction, que déclare `int largeur, hauteur = 4;` ?"
    choices:
      - {text: "`hauteur` vaut 4, `largeur` n'est pas initialisée", correct: true}
      - {text: "`largeur` et `hauteur` valent 4 toutes les deux", correct: false}
      - {text: "`largeur` vaut 0 et `hauteur` vaut 4", correct: false}
      - {text: "`largeur` vaut 4, `hauteur` n'est pas initialisée", correct: false}
    answer: |-
      Le `= 4` ne vaut que pour `hauteur`. `largeur` est déclarée sans valeur : elle est indéterminée. Une déclaration
      par ligne évite la confusion.
  - key: qcm-ou-declarer
    format: multiple-choice
    question: Où déclarer une variable pour ne jamais la laisser sans valeur ?
    choices:
      - {text: "Là où l'on connaît sa valeur, en l'initialisant aussitôt", correct: true}
      - {text: "En haut de la fonction, avec toutes les autres variables", correct: false}
      - {text: "Hors de toute fonction, pour qu'elle soit mise à zéro", correct: false}
      - {text: "Dans un fichier d'en-tête, inclus par tout le projet", correct: false}
    answer: |-
      On déclare une variable au plus près de son premier usage, avec sa valeur. La regrouper en haut de la fonction,
      comme en C ancien, crée un intervalle où elle n'a pas de valeur ; en faire une globale crée d'autres problèmes.
  - key: code-accolades-vides
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int total{};
          total = total + 5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5` : les accolades vides initialisent `total` à zéro, puis on lui ajoute 5."
    check:
      output: "5"
  - key: code-globale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int compteur;

      int main() {
          compteur = compteur + 1;
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1` : `compteur` est une variable globale, mise à zéro avant le démarrage de `main`."
    check:
      output: "1"
  - key: code-string-vide
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string nom;
          std::println("[{}] {}", nom, nom.size());
      }
      ```
    choices:
      - {text: "`[] 0`", correct: true}
      - {text: "`[ ] 1`", correct: false}
      - {text: "Un texte imprévisible", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      `[] 0` : `std::string` est une classe, et son constructeur par défaut crée une chaîne vide, de taille 0. Le
      piège des valeurs indéterminées ne concerne que les types fondamentaux.
    check:
      output: "[] 0"
  - key: code-locale-non-initialisee
    format: code-output
    question: |-
      Que garantit le langage sur ce qu'affiche ce programme ?
      ```cpp
      #include <print>

      int main() {
          int total;
          total = total + 5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Rien : c'est un comportement indéfini", correct: true}
      - {text: "Qu'il affiche `5`", correct: false}
      - {text: "Qu'il affiche `0`", correct: false}
      - {text: "Qu'il ne compile pas", correct: false}
    answer: |-
      Rien. `total` est lue avant d'avoir reçu une valeur : c'est un comportement indéfini. Le programme compile, et
      affiche souvent 5 sans optimisation, ce qui cache le bug.
    unverifiable: lire une variable non initialisée est un comportement indéfini
  - key: bug-total
    format: bug-fix
    question: |-
      Ce programme affiche tantôt `15`, tantôt un nombre énorme. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total;
          total = total + 15;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `int total{};`", correct: true}
      - {text: "Écrire `int total();`", correct: false}
      - {text: "Écrire `double total;`", correct: false}
      - {text: "Écrire `const int total;`", correct: false}
    answer: |-
      ```cpp
      int total{};
      ```
      `total` est lue avant d'avoir une valeur. Les accolades vides la font partir de zéro ; changer son type n'y
      change rien.
  - key: bug-une-seule-initialisee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `16`, et affiche n'importe quoi. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int largeur, hauteur = 4;
          std::println("{}", largeur * hauteur);
      }
      ```
    choices:
      - {text: "Le `= 4` n'initialise que `hauteur` : `largeur` est indéterminée", correct: true}
      - {text: "La virgule multiplie `largeur` par `hauteur` avant l'affichage", correct: false}
      - {text: "Deux variables ne peuvent pas partager la même déclaration", correct: false}
      - {text: "`largeur` vaut zéro, et le produit dépasse la taille d'un `int`", correct: false}
    answer: |-
      ```cpp
      int largeur = 4;
      int hauteur = 4;
      ```
      Dans une déclaration multiple, chaque variable a sa propre valeur de départ. Une déclaration par ligne rend
      l'oubli visible.
  - key: bug-compteur
    format: bug-fix
    question: |-
      Ce programme compte trois visites, et affiche parfois autre chose que `3`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int visites;
          visites++;
          visites++;
          visites++;
          std::println("{}", visites);
      }
      ```
    choices:
      - {text: "Initialiser `visites` à zéro à sa déclaration", correct: true}
      - {text: "Remplacer `visites++` par `visites + 1`", correct: false}
      - {text: "Déclarer `visites` après les trois incrémentations", correct: false}
      - {text: "Ajouter `visites = 3;` après le dernier affichage", correct: false}
    answer: |-
      ```cpp
      int visites = 0;
      ```
      Un compteur part d'une valeur connue. Sans elle, `visites++` ajoute 1 à une valeur indéterminée.
  - key: bug-drapeau
    format: bug-fix
    question: |-
      Ce programme affiche parfois `Erreur`, alors qu'aucune erreur n'a eu lieu. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          bool erreur;
          if (erreur) {
              std::println("Erreur");
          }
      }
      ```
    choices:
      - {text: "`erreur` n'est pas initialisée : sa valeur est indéterminée", correct: true}
      - {text: "Un `bool` vaut `true` tant qu'on ne lui affecte rien", correct: false}
      - {text: "Le `if` exécute toujours son bloc au premier passage", correct: false}
      - {text: "`std::println` vide son tampon de façon aléatoire", correct: false}
    answer: |-
      ```cpp
      bool erreur = false;
      ```
      Un `bool` local sans valeur de départ n'est ni vrai ni faux : il est indéterminé, et le lire est un comportement
      indéfini.
  - key: situation-marche-chez-moi
    format: scenario
    question: |-
      Un calcul donne le bon résultat sur ton poste, compilé sans optimisation, et un résultat faux en production,
      compilé avec `-O2`. Que soupçonnes-tu d'abord ?
    choices:
      - {text: "Un comportement indéfini, comme une variable non initialisée", correct: true}
      - {text: "Un défaut de l'optimiseur, qu'il faut signaler à GCC", correct: false}
      - {text: "Une différence de norme C++ entre les deux machines", correct: false}
      - {text: "Un processeur de production trop rapide pour le code", correct: false}
    answer: |-
      Un résultat qui change avec le niveau d'optimisation trahit presque toujours un comportement indéfini. Sans
      optimisation, la mémoire non initialisée contient souvent zéro, et le bug reste caché. On le cherche avec
      `-Wall -Wextra`, puis avec Valgrind ou un sanitizer.
  - key: situation-relecture
    format: scenario
    question: |-
      Tu relis une pull request. Une fonction commence par `int somme;`, et la variable reçoit sa valeur vingt lignes
      plus bas. Que demandes-tu ?
    choices:
      - {text: "De déclarer `somme` là où sa valeur est connue, en l'initialisant", correct: true}
      - {text: "De faire de `somme` une variable globale, mise à zéro d'office", correct: false}
      - {text: "De ne rien changer : la variable est affectée avant la fin", correct: false}
      - {text: "De remplacer `int` par `double`, plus sûr sans valeur", correct: false}
    answer: |-
      Une variable déclarée loin de sa première valeur laisse vingt lignes où quelqu'un peut la lire par erreur,
      aujourd'hui ou lors d'une modification future. On la déclare au plus près, avec sa valeur ; à défaut,
      `int somme{};`.
  - key: situation-collegue-java
    format: scenario
    question: |-
      Un collègue qui vient de Java écrit `int compteur;` dans une fonction C++, puis `compteur++`. Il t'assure que
      « les entiers valent zéro par défaut ». Que lui réponds-tu ?
    choices:
      - {text: "Qu'en C++ une variable locale n'est pas initialisée : il faut `int compteur{};`", correct: true}
      - {text: "Qu'il a raison : C++ met à zéro toutes les variables, comme Java", correct: false}
      - {text: "Qu'il a raison, à condition de compiler avec l'option `-Wall`", correct: false}
      - {text: "Qu'en C++ ce code ne compile pas, comme il ne compilerait pas en Java", correct: false}
    answer: |-
      En Java, le compilateur refuse de lire une variable locale non initialisée, et les champs valent zéro. En C++,
      le code compile, et la variable locale contient une valeur indéterminée : il faut l'initialiser soi-même.
  - key: situation-detecter
    format: scenario
    question: |-
      Ton équipe a perdu deux jours sur une variable non initialisée. Que proposes-tu pour que cela ne se reproduise
      pas ?
    choices:
      - {text: "`-Wall -Wextra -Werror` à la compilation, et un sanitizer dans les tests", correct: true}
      - {text: "Compiler sans optimisation en production, pour garder la mémoire à zéro", correct: false}
      - {text: "Déclarer toutes les variables en haut des fonctions, pour les repérer", correct: false}
      - {text: "Remplacer tous les `int` par des `double`, qui sont initialisés", correct: false}
    answer: |-
      Les avertissements du compilateur attrapent les cas évidents dès la compilation, et un sanitizer (ou Valgrind)
      attrape les autres pendant les tests. Compiler sans optimisation ne garantit rien : la mémoire n'est jamais
      promise à zéro.
