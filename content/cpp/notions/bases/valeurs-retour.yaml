notion: valeurs-retour
lesson: |-
  Une fonction **renvoie** une valeur avec `return`. Le type renvoyé s'écrit avant son nom.

  ```cpp
  int signe(int n) {
      if (n < 0) {
          return -1;      // quitte la fonction ici
      }
      if (n == 0) {
          return 0;
      }
      return 1;
  }
  ```

  - `return` **quitte la fonction** aussitôt : ce qui le suit n'est pas exécuté. On s'en sert pour traiter d'abord les
    cas simples (*early return*).
  - **Tous les chemins** d'une fonction non `void` doivent finir par un `return`. Arriver à la fin sans en avoir
    rencontré est un comportement indéfini.
  - La valeur renvoyée est **convertie** vers le type de retour, comme à une initialisation : `return 3.9;` dans une
    fonction `int` renvoie 3.
  - Une fonction **`void`** ne renvoie rien. `return;`, sans valeur, la quitte avant sa fin.

  **Renvoyer plusieurs valeurs.** Une fonction ne renvoie qu'**une** valeur. Pour en renvoyer plusieurs, on les
  réunit dans une **`struct`** :

  ```cpp
  struct Division {
      int quotient;
      int reste;
  };

  Division diviser(int a, int b) {
      return {a / b, a % b};
  }

  auto [quotient, reste] = diviser(17, 5);   // liaisons structurées (C++17)
  ```

  Les champs ont un nom, ce qui se lit mieux qu'un `std::pair` et ses `first` et `second`.

  **Pièges classiques.**

  - `return a, b;` ne renvoie pas deux valeurs : l'opérateur virgule évalue `a`, le jette, et renvoie `b`.
  - **Renvoyer une référence vers une variable locale** : la variable est détruite au retour, la référence ne désigne
    plus rien. On renvoie par valeur.

  **En entretien** : « Je renvoie les résultats par valeur, dans une `struct` s'il y en a plusieurs, plutôt que par des
  paramètres de sortie : l'appel se lit mieux, et le compilateur évite la copie. »
tour:
  - title: Renvoyer une valeur
    text: |-
      `return` renvoie une valeur et quitte la fonction. On peut en écrire plusieurs : le premier atteint l'emporte.

      Une fonction ne renvoie qu'une valeur. Pour en renvoyer deux, on les réunit dans une `struct`, que l'appelant
      peut décomposer d'un coup : `auto [quotient, reste] = diviser(17, 5);`.

      Essaie : remplace `17` par `20`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          struct Division {
              int quotient;
              int reste;
          };

          Division diviser(int a, int b) {
              return {a / b, a % b};
          }

          int signe(int n) {
              if (n < 0) {
                  return -1;
              }
              if (n == 0) {
                  return 0;
              }
              return 1;
          }

          int main() {
              auto [quotient, reste] = diviser(17, 5);
              std::println("{} reste {}", quotient, reste);
              std::println("{} {} {}", signe(-8), signe(0), signe(3));
          }
      output: |-
        3 reste 2
        -1 0 1
cards:
  - key: return-quitte
    format: course
    question: "Que deviennent les instructions écrites après un `return` qui s'exécute ?"
    choices:
      - {text: "Elles ne sont pas exécutées : `return` quitte la fonction", correct: true}
      - {text: "Elles sont exécutées, puis la valeur est renvoyée", correct: false}
      - {text: "Elles sont exécutées au prochain appel de la fonction", correct: false}
      - {text: "Elles provoquent une erreur de compilation", correct: false}
    answer: "`return` met fin à la fonction immédiatement. Le compilateur accepte du code après lui, mais il n'est jamais atteint."
  - key: plusieurs-valeurs
    format: course
    question: Comment une fonction renvoie-t-elle deux résultats à la fois ?
    choices:
      - {text: "En les réunissant dans une `struct`, qu'elle renvoie", correct: true}
      - {text: "En écrivant `return a, b;`, avec une virgule", correct: false}
      - {text: "En écrivant deux `return` à la suite", correct: false}
      - {text: "En déclarant deux types de retour devant son nom", correct: false}
    answer: "Une fonction renvoie une seule valeur : une `struct` (ou un `std::pair`) en contient plusieurs. `return a, b;` ne renvoie que `b`, et le second de deux `return` n'est jamais atteint."
  - key: tous-les-chemins
    format: course
    question: "Que se passe-t-il si une fonction `int` atteint sa fin sans avoir rencontré de `return` ?"
    choices:
      - {text: "C'est un comportement indéfini", correct: true}
      - {text: "Elle renvoie zéro", correct: false}
      - {text: "Elle renvoie la valeur de son dernier calcul", correct: false}
      - {text: "Une exception est levée", correct: false}
    answer: "Rien n'est garanti : la valeur lue par l'appelant est quelconque, et le programme peut planter. Seule `main` renvoie 0 d'office. GCC signale l'oubli par un avertissement (`-Wreturn-type`)."
  - key: reference-vers-locale
    format: course
    question: Pourquoi ne faut-il pas renvoyer une référence vers une variable locale ?
    choices:
      - {text: "La variable est détruite au retour : la référence ne désigne plus rien", correct: true}
      - {text: "La variable est copiée deux fois, ce qui ralentit l'appel", correct: false}
      - {text: "La variable devient globale, et reste en mémoire pour toujours", correct: false}
      - {text: "La variable est renvoyée à zéro, quelle que soit sa valeur", correct: false}
    answer: "Une variable locale meurt à la fin de sa fonction. S'en servir à travers la référence est un comportement indéfini. On renvoie par valeur : le compilateur sait éviter la copie."
  - key: vf-plusieurs-return
    format: true-false
    question: Une fonction peut contenir plusieurs `return`.
    truth: true
    answer: Le premier qui s'exécute quitte la fonction. C'est la base des sorties anticipées.
  - key: vf-virgule
    format: true-false
    question: "`return a, b;` renvoie les deux valeurs `a` et `b`."
    truth: false
    answer: "L'opérateur virgule évalue `a`, le jette, et donne `b` : seule `b` est renvoyée."
  - key: vf-liaisons-structurees
    format: true-false
    question: "`auto [q, r] = diviser(17, 5);` range les deux champs de la structure renvoyée dans `q` et `r`."
    truth: true
    answer: Ce sont les liaisons structurées, arrivées avec C++17.
  - key: vf-conversion-au-retour
    format: true-false
    question: "Dans une fonction `int`, `return 3.9;` renvoie 4."
    truth: false
    answer: "La valeur est convertie vers le type de retour comme à une initialisation : la décimale est coupée, la fonction renvoie 3."
  - key: qcm-return-void
    format: multiple-choice
    question: "Comment quitter une fonction `void` avant sa dernière ligne ?"
    choices:
      - {text: "`return;`", correct: true}
      - {text: "`return 0;`", correct: false}
      - {text: "`break;`", correct: false}
      - {text: "`exit;`", correct: false}
    answer: "`return;`, sans valeur. `return 0;` ne compile pas dans une fonction `void`, et `break` ne sort que d'une boucle ou d'un `switch`."
  - key: qcm-renvoyer-struct
    format: multiple-choice
    question: "Avec `struct Division { int quotient; int reste; };`, quelle ligne renvoie les deux résultats ?"
    choices:
      - {text: "`return {a / b, a % b};`", correct: true}
      - {text: "`return a / b, a % b;`", correct: false}
      - {text: "`return (a / b, a % b);`", correct: false}
      - {text: "`return a / b; return a % b;`", correct: false}
    answer: "Les accolades construisent la `Division` à renvoyer. Avec une virgule seule, parenthèses ou non, seul le reste serait renvoyé."
  - key: qcm-struct-ou-pair
    format: multiple-choice
    question: "Quel avantage a une `struct` sur un `std::pair` pour renvoyer deux valeurs ?"
    choices:
      - {text: "Ses champs ont un nom, plus parlant que `first` et `second`", correct: true}
      - {text: "Elle se copie plus vite qu'un `std::pair`", correct: false}
      - {text: "Elle peut contenir deux types différents, pas un `std::pair`", correct: false}
      - {text: "Elle est la seule à accepter les liaisons structurées", correct: false}
    answer: "`resultat.quotient` se lit mieux que `resultat.first`. Pour le reste, les deux se valent : même coût, types libres, liaisons structurées permises."
  - key: qcm-sortie-anticipee
    format: multiple-choice
    question: "À quoi sert une sortie anticipée, comme `if (diviseur == 0) { return 0; }` en tête de fonction ?"
    choices:
      - {text: "À traiter d'abord le cas particulier, sans imbriquer tout le reste dans un `else`", correct: true}
      - {text: "À faire exécuter la fonction deux fois, une pour chaque valeur du diviseur", correct: false}
      - {text: "À empêcher le compilateur d'optimiser le reste de la fonction", correct: false}
      - {text: "À renvoyer deux valeurs à l'appelant, une pour chaque cas possible", correct: false}
    answer: "Le cas particulier est réglé et quitté en deux lignes. Le reste de la fonction s'écrit sans indentation supplémentaire, en sachant que le diviseur n'est pas nul."
  - key: trous-return
    format: fill-in
    question: |-
      Complète pour renvoyer le plus grand des deux nombres :
      ```cpp
      int maximum(int a, int b) {
          if (a > b) {
              ___ a;
          }
          return b;
      }
      ```
    blanks:
      - [return]
    answer: "`return a;` renvoie `a` et quitte la fonction."
  - key: trous-type-struct
    format: fill-in
    question: |-
      Complète avec le type de retour de la fonction :
      ```cpp
      struct Division {
          int quotient;
          int reste;
      };

      ___ diviser(int a, int b) {
          return {a / b, a % b};
      }
      ```
    blanks:
      - [Division, auto]
    answer: "La fonction renvoie une `Division`, construite par les accolades du `return`."
  - key: trous-liaisons
    format: fill-in
    question: |-
      Complète pour ranger les deux champs renvoyés dans `q` et `r` :
      ```cpp
      auto ___q, r___ = diviser(17, 5);
      ```
    blanks:
      - ["["]
      - ["]"]
    answer: "`auto [q, r] = diviser(17, 5);` : les liaisons structurées s'écrivent entre crochets."
  - key: trous-return-vide
    format: fill-in
    question: |-
      Complète pour ne rien afficher quand `n` est négatif :
      ```cpp
      void afficher(int n) {
          if (n < 0) {
              ___;
          }
          std::println("{}", n);
      }
      ```
    blanks:
      - [return]
    answer: "`return;` quitte une fonction `void` avant sa fin."
  - key: code-sorties-anticipees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int signe(int n) {
          if (n < 0) {
              return -1;
          }
          if (n == 0) {
              return 0;
          }
          return 1;
      }

      int main() {
          std::println("{} {} {}", signe(-5), signe(0), signe(9));
      }
      ```
    choices:
      - {text: "`-1 0 1`", correct: true}
      - {text: "`1 1 1`", correct: false}
      - {text: "`-1 0 9`", correct: false}
      - {text: "`-5 0 9`", correct: false}
    answer: "`-1 0 1` : chaque `return` quitte la fonction. Le dernier n'est atteint que si aucun des deux tests n'a réussi."
    check:
      output: "-1 0 1"
  - key: code-struct
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Division {
          int quotient;
          int reste;
      };

      Division diviser(int a, int b) {
          return {a / b, a % b};
      }

      int main() {
          auto [quotient, reste] = diviser(17, 5);
          std::println("{} {}", quotient, reste);
      }
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`2 3`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 2` : la fonction renvoie une `Division`, dont les champs sont rangés, dans l'ordre, dans `quotient` et `reste`."
    check:
      output: "3 2"
  - key: code-return-void
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void afficher(int n) {
          if (n < 0) {
              return;
          }
          std::println("{}", n);
      }

      int main() {
          afficher(-1);
          afficher(7);
      }
      ```
    choices:
      - {text: "`7`", correct: true}
      - text: |-
          ```
          -1
          7
          ```
        correct: false
      - {text: "`-1`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`7` : pour -1, `return;` quitte la fonction avant l'affichage. Pour 7, le test est faux, et l'affichage a lieu."
    check:
      output: "7"
  - key: code-virgule
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int diviser(int a, int b) {
          return a / b, a % b;
      }

      int main() {
          std::println("{}", diviser(17, 5));
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`3 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2` : l'opérateur virgule calcule `a / b`, le jette, puis donne `a % b`. La fonction ne renvoie que le reste."
    check:
      output: "2"
  - key: bug-chemin-sans-return
    format: bug-fix
    question: |-
      Ce programme devrait afficher `9`, et plante (« Illegal instruction »). Pourquoi ?
      ```cpp
      #include <print>

      int maximum(int a, int b) {
          if (a > b) {
              return a;
          }
      }

      int main() {
          std::println("{}", maximum(4, 9));
      }
      ```
    choices:
      - {text: "Quand `a` n'est pas le plus grand, la fonction finit sans `return`", correct: true}
      - {text: "Un `return` ne peut pas être écrit à l'intérieur d'un `if`", correct: false}
      - {text: "La fonction compare `b` à lui-même quand `a` vaut 4", correct: false}
      - {text: "`a > b` devrait s'écrire `a >= b` pour deux entiers", correct: false}
    answer: |-
      ```cpp
      int maximum(int a, int b) {
          if (a > b) {
              return a;
          }
          return b;
      }
      ```
      Tous les chemins doivent renvoyer une valeur. Ici, le cas `a <= b` arrive à la fin de la fonction : comportement
      indéfini.
  - key: bug-void-renvoie
    format: bug-fix
    question: |-
      Le compilateur répond « return-statement with a value, in function returning 'void' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      void carre(int n) {
          return n * n;
      }

      int main() {
          std::println("{}", carre(4));
      }
      ```
    choices:
      - {text: "Donner à la fonction le type de retour `int`", correct: true}
      - {text: "Écrire `return;` sans valeur", correct: false}
      - {text: "Écrire `return void(n * n);`", correct: false}
      - {text: "Retirer le paramètre de la fonction", correct: false}
    answer: |-
      ```cpp
      int carre(int n) {
          return n * n;
      }
      ```
      Une fonction `void` ne renvoie pas de valeur. `main` en attend une : c'est le type de retour qui est faux.
  - key: bug-virgule
    format: bug-fix
    question: |-
      Cette fonction devrait renvoyer le plus petit et le plus grand de deux nombres, et le programme n'affiche que
      `9`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int bornes(int a, int b) {
          if (a < b) {
              return a, b;
          }
          return b, a;
      }

      int main() {
          std::println("{}", bornes(9, 4));
      }
      ```
    choices:
      - {text: "Renvoyer une `struct` qui contient les deux valeurs", correct: true}
      - {text: "Entourer les deux valeurs de parenthèses", correct: false}
      - {text: "Écrire deux `return` à la suite, un par valeur", correct: false}
      - {text: "Remplacer la virgule par un point-virgule", correct: false}
    answer: |-
      ```cpp
      struct Bornes {
          int minimum;
          int maximum;
      };

      Bornes bornes(int a, int b) {
          if (a < b) {
              return {a, b};
          }
          return {b, a};
      }
      ```
      `return b, a;` ne renvoie que `a`. Une fonction renvoie une seule valeur : pour deux résultats, cette valeur est
      une `struct`.
  - key: bug-reference-locale
    format: bug-fix
    question: |-
      Ce programme compile, puis plante (« Segmentation fault »). Quelle correction est la bonne ?
      ```cpp
      #include <print>

      const int& carre(int n) {
          int resultat = n * n;
          return resultat;
      }

      int main() {
          std::println("{}", carre(4));
      }
      ```
    choices:
      - {text: "Renvoyer par valeur : `int carre(int n)`", correct: true}
      - {text: "Renvoyer une référence non constante : `int& carre(int n)`", correct: false}
      - {text: "Prendre le paramètre par référence : `const int& carre(int& n)`", correct: false}
      - {text: "Déclarer `resultat` avec `auto`", correct: false}
    answer: |-
      ```cpp
      int carre(int n) {
          return n * n;
      }
      ```
      `resultat` est détruite à la fin de la fonction : la référence renvoyée ne désigne plus rien. Par valeur, le
      résultat est copié (ou construit directement chez l'appelant). Avec `int&`, C++23 refuse même de compiler.
