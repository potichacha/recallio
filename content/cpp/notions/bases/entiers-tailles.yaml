notion: entiers-tailles
lesson: |-
  Un entier est **signé** (il peut être négatif) ou **non signé** (`unsigned` : positif ou nul, avec une plage deux
  fois plus haute).

  **Les tailles de `int`, `long` et consorts ne sont pas fixées** : la norme ne donne que des minimums (16 bits pour
  `int`, 32 pour `long`, 64 pour `long long`). Quand la taille compte, on prend les types de **`<cstdint>`** :

  | Type | Bits | Plage |
  |---|---|---|
  | `std::int8_t` / `std::uint8_t` | 8 | -128 à 127 / 0 à 255 |
  | `std::int16_t` / `std::uint16_t` | 16 | -32 768 à 32 767 / 0 à 65 535 |
  | `std::int32_t` / `std::uint32_t` | 32 | environ ±2,1 milliards / 0 à 4,2 milliards |
  | `std::int64_t` / `std::uint64_t` | 64 | environ ±9,2 × 10¹⁸ / 0 à 1,8 × 10¹⁹ |

  - **`std::size_t`** est le type non signé des tailles et des indices : c'est ce que renvoient `sizeof` et la
    fonction `size()` des conteneurs. Il fait 64 bits sur une machine 64 bits.
  - `std::numeric_limits<T>::max()` et `min()`, dans `<limits>`, donnent les bornes d'un type.
  - Un non signé qui dépasse ses bornes **reboucle** (arithmétique modulo 2ⁿ) : `0 - 1` donne la plus grande valeur du
    type. C'est défini par la norme. Pour un entier signé, dépasser est un comportement indéfini.
  - Depuis C++20, les entiers signés sont en **complément à deux**.

  **Piège classique** : soustraire deux non signés. `stock - 5` avec `stock` à 3 ne donne pas -2, mais un nombre
  énorme. Et une boucle `for (std::size_t i = n; i >= 0; --i)` ne s'arrête jamais : un non signé est toujours `>= 0`.

  **En entretien** : « `int` pour les calculs courants, `std::size_t` pour les tailles et les indices, et les types de
  `<cstdint>` quand la taille est imposée : un format de fichier, un protocole réseau. »
tour:
  - title: Les entiers et leurs tailles
    text: |-
      Un `int` ne va pas plus loin que 2 milliards environ sur les machines courantes, et sa taille n'est même pas
      garantie. Quand elle compte, l'en-tête `<cstdint>` donne des types à taille fixe : `std::int32_t`,
      `std::int64_t`, et leurs versions non signées, `std::uint32_t`...

      Un entier **non signé** ne peut pas être négatif. S'il passe sous zéro, il reboucle vers sa plus grande valeur.

      Essaie : remplace `std::uint8_t` par `std::int32_t`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <cstdint>
          #include <print>

          int main() {
              std::int64_t population = 8'200'000'000;
              std::uint8_t niveau = 0;
              niveau = niveau - 1;

              std::println("{} habitants", population);
              std::println("niveau : {}", niveau);
          }
      output: |-
        8200000000 habitants
        niveau : 255
cards:
  - key: signe-ou-non
    format: course
    question: Quelle différence entre un entier signé et un entier non signé ?
    choices:
      - {text: "Le signé peut être négatif, le non signé ne le peut pas", correct: true}
      - {text: "Le signé a une taille fixe, le non signé une taille variable", correct: false}
      - {text: "Le signé est vérifié à la compilation, le non signé à l'exécution", correct: false}
      - {text: "Le signé accepte une virgule, le non signé ne l'accepte pas", correct: false}
    answer: "Un entier signé couvre des valeurs négatives et positives. Un non signé, de même taille, ne couvre que zéro et les positifs, deux fois plus haut."
  - key: pourquoi-cstdint
    format: course
    question: "Pourquoi utiliser `std::int32_t` plutôt que `int` ?"
    choices:
      - {text: "Pour une taille garantie de 32 bits, sur toutes les machines", correct: true}
      - {text: "Pour des calculs plus rapides que ceux d'un `int`", correct: false}
      - {text: "Pour que les débordements lèvent une exception", correct: false}
      - {text: "Pour pouvoir ranger des nombres à virgule", correct: false}
    answer: |-
      La norme ne garantit qu'un minimum de 16 bits pour `int`. `std::int32_t` fait exactement 32 bits : c'est ce
      qu'il faut pour un format de fichier ou un protocole, où la taille est imposée.
  - key: role-de-size-t
    format: course
    question: "À quoi sert le type `std::size_t` ?"
    choices:
      - {text: "À représenter une taille ou un indice : c'est le type que renvoie `sizeof`", correct: true}
      - {text: "À représenter un entier signé de la plus grande taille possible", correct: false}
      - {text: "À représenter la taille d'un fichier, en kilo-octets", correct: false}
      - {text: "À représenter un nombre à virgule de taille variable", correct: false}
    answer: "`std::size_t` est un entier non signé, assez grand pour la taille de n'importe quel objet. `sizeof` et la fonction `size()` des conteneurs le renvoient."
  - key: non-signe-reboucle
    format: course
    question: Que se passe-t-il quand un entier non signé passe sous zéro ?
    choices:
      - {text: "Il reboucle vers la plus grande valeur de son type", correct: true}
      - {text: "Il reste bloqué à zéro, sa plus petite valeur", correct: false}
      - {text: "Il devient négatif, comme un entier signé", correct: false}
      - {text: "Le programme s'arrête sur une exception", correct: false}
    answer: |-
      L'arithmétique des non signés est modulo 2ⁿ : `0 - 1` donne la plus grande valeur, 4 294 967 295 sur 32 bits.
      C'est un comportement défini par la norme, et une source classique de bugs.
  - key: vf-int-taille-fixe
    format: true-false
    question: Un `int` a la même taille sur toutes les machines.
    truth: false
    answer: La norme n'impose qu'un minimum de 16 bits. Les types de `<cstdint>` ont, eux, une taille exacte.
  - key: vf-size-t-non-signe
    format: true-false
    question: "`std::size_t` est un type entier non signé."
    truth: true
    answer: Une taille n'est jamais négative. C'est aussi ce qui rend les soustractions de tailles dangereuses.
  - key: vf-non-signe-negatif
    format: true-false
    question: Une variable `unsigned int` peut contenir la valeur -1.
    truth: false
    answer: "Un non signé ne contient que zéro et des positifs. Lui affecter -1 donne la plus grande valeur du type."
  - key: vf-debordement-non-signe-defini
    format: true-false
    question: Le dépassement d'un entier non signé est un comportement défini par la norme.
    truth: true
    answer: "Le résultat reboucle, modulo 2ⁿ. C'est le dépassement d'un entier **signé** qui est un comportement indéfini."
  - key: qcm-plage-uint8
    format: multiple-choice
    question: "Quelles valeurs peut contenir un `std::uint8_t` ?"
    choices:
      - {text: "De 0 à 255", correct: true}
      - {text: "De -128 à 127", correct: false}
      - {text: "De 0 à 256", correct: false}
      - {text: "De 1 à 255", correct: false}
    answer: "8 bits non signés donnent 256 valeurs, de 0 à 255. De -128 à 127, c'est la plage de `std::int8_t`."
  - key: qcm-minimum-int
    format: multiple-choice
    question: Quelle taille minimale la norme garantit-elle pour un `int` ?
    choices:
      - {text: "16 bits", correct: true}
      - {text: "8 bits", correct: false}
      - {text: "32 bits", correct: false}
      - {text: "64 bits", correct: false}
    answer: "16 bits. Les machines courantes lui en donnent 32, mais ce n'est pas une garantie."
  - key: qcm-grand-nombre
    format: multiple-choice
    question: Quel type choisis-tu pour compter 8 milliards d'habitants ?
    choices:
      - {text: "`std::int64_t`", correct: true}
      - {text: "`std::int32_t`", correct: false}
      - {text: "`std::uint16_t`", correct: false}
      - {text: "`std::int8_t`", correct: false}
    answer: "Un `std::int32_t` s'arrête vers 2,1 milliards (et un `std::uint32_t` vers 4,2). Il faut 64 bits."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::int32_t` et `std::uint64_t` ?"
    choices:
      - {text: "`<cstdint>`", correct: true}
      - {text: "`<limits>`", correct: false}
      - {text: "`<integer>`", correct: false}
      - {text: "`<iostream>`", correct: false}
    answer: "`<cstdint>`. `<limits>` déclare `std::numeric_limits`, qui donne les bornes d'un type ; `<integer>` n'existe pas."
  - key: trous-cstdint
    format: fill-in
    question: |-
      Complète avec l'en-tête des entiers à taille fixe :
      ```cpp
      #include <___>

      std::int32_t compteur = 0;
      ```
    blanks:
      - [cstdint]
    answer: "`<cstdint>` déclare les types à taille fixe."
  - key: trous-64-bits
    format: fill-in
    question: |-
      Complète avec un type signé d'exactement 64 bits :
      ```cpp
      std::___ population = 8'200'000'000;
      ```
    blanks:
      - [int64_t]
    answer: "`std::int64_t` : un entier signé de 64 bits."
  - key: trous-unsigned
    format: fill-in
    question: |-
      Complète avec le mot-clé qui rend l'entier non signé :
      ```cpp
      ___ int stock = 3;
      ```
    blanks:
      - [unsigned]
    answer: "`unsigned int` ne contient que zéro et des positifs."
  - key: trous-size-t
    format: fill-in
    question: |-
      Complète avec le type que renvoie `sizeof` :
      ```cpp
      std::___ taille = sizeof(double);
      ```
    blanks:
      - [size_t]
    answer: "`sizeof` renvoie un `std::size_t`, le type non signé des tailles."
  - key: code-uint8-reboucle
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::uint8_t niveau = 255;
          niveau = niveau + 1;
          std::println("{}", niveau);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`256`", correct: false}
      - {text: "`255`", correct: false}
      - {text: "`-1`", correct: false}
    answer: "`0` : un `std::uint8_t` s'arrête à 255. La somme, 256, ne tient pas : en la rangeant dans `niveau`, elle reboucle à 0."
    check:
      output: "0"
  - key: code-uint32-sous-zero
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::uint32_t stock = 0;
          stock = stock - 1;
          std::println("{}", stock);
      }
      ```
    choices:
      - {text: "`4294967295`", correct: true}
      - {text: "`-1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`2147483647`", correct: false}
    answer: "`4294967295` : un non signé ne descend pas sous zéro. Il reboucle vers sa plus grande valeur, 2³² - 1."
    check:
      output: "4294967295"
  - key: code-sizeof-fixes
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::println("{} {}", sizeof(std::int32_t), sizeof(std::int64_t));
      }
      ```
    choices:
      - {text: "`4 8`", correct: true}
      - {text: "`32 64`", correct: false}
      - {text: "`2 4`", correct: false}
      - {text: "`8 16`", correct: false}
    answer: "`4 8` : `sizeof` compte en octets. 32 bits font 4 octets, 64 bits en font 8."
    check:
      output: "4 8"
  - key: code-limite-int32
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <limits>
      #include <print>

      int main() {
          std::println("{}", std::numeric_limits<std::int32_t>::max());
      }
      ```
    choices:
      - {text: "`2147483647`", correct: true}
      - {text: "`4294967295`", correct: false}
      - {text: "`2147483648`", correct: false}
      - {text: "`32767`", correct: false}
    answer: "`2147483647`, soit 2³¹ - 1 : un bit sert au signe. `4294967295` est la borne du type non signé de même taille."
    check:
      output: "2147483647"
  - key: bug-stock-negatif
    format: bug-fix
    question: |-
      Ce programme affiche `4294967294` au lieu de `-2`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          unsigned int stock = 3;
          unsigned int commande = 5;
          std::println("{}", stock - commande);
      }
      ```
    choices:
      - {text: "Déclarer les deux variables avec le type `int`", correct: true}
      - {text: "Déclarer les deux variables avec le type `unsigned long`", correct: false}
      - {text: "Écrire `commande - stock` dans l'affichage", correct: false}
      - {text: "Ajouter `#include <cstdint>` en haut du fichier", correct: false}
    answer: |-
      ```cpp
      int stock = 3;
      int commande = 5;
      ```
      La différence de deux non signés est non signée : -2 reboucle vers un nombre énorme. Une quantité qui peut
      devenir négative se range dans un type signé.
  - key: bug-age-trop-grand
    format: bug-fix
    question: |-
      Ce programme affiche `44` au lieu de `300`. Pourquoi ?
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::uint8_t points = 300;
          std::println("{}", points);
      }
      ```
    choices:
      - {text: "300 ne tient pas dans 8 bits : la valeur reboucle après 255", correct: true}
      - {text: "`std::println` n'affiche que les deux derniers chiffres d'un entier", correct: false}
      - {text: "`std::uint8_t` est un type à virgule, qui arrondit 300", correct: false}
      - {text: "300 est lu en base 8, et vaut 44 en base 10", correct: false}
    answer: |-
      ```cpp
      std::uint16_t points = 300;
      ```
      Un `std::uint8_t` va de 0 à 255. 300 est réduit modulo 256 : il reste 44. Avec des accolades,
      `std::uint8_t points{300};` n'aurait pas compilé.
  - key: bug-population
    format: bug-fix
    question: |-
      Ce programme affiche un nombre faux au lieu de 8 milliards. Quelle correction est la bonne ?
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          std::int32_t population = 8'000'000'000;
          std::println("{}", population);
      }
      ```
    choices:
      - {text: "Déclarer `population` avec le type `std::int64_t`", correct: true}
      - {text: "Déclarer `population` avec le type `std::uint32_t`", correct: false}
      - {text: "Retirer les apostrophes du nombre", correct: false}
      - {text: "Écrire le nombre entre guillemets", correct: false}
    answer: |-
      ```cpp
      std::int64_t population = 8'000'000'000;
      ```
      Un entier de 32 bits s'arrête vers 2,1 milliards (4,2 s'il est non signé). Les apostrophes ne sont qu'un
      séparateur de chiffres, permis depuis C++14.
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Cette boucle devrait afficher `3 2 1 0` puis s'arrêter. Elle ne s'arrête jamais. Pourquoi ?
      ```cpp
      #include <cstddef>
      #include <print>

      int main() {
          for (std::size_t i = 3; i >= 0; --i) {
              std::print("{} ", i);
          }
      }
      ```
    choices:
      - {text: "`i` est non signé : `i >= 0` est toujours vrai", correct: true}
      - {text: "`--i` s'exécute avant le premier tour de boucle", correct: false}
      - {text: "`std::size_t` ne peut pas contenir la valeur zéro", correct: false}
      - {text: "`std::print` remet `i` à 3 à chaque affichage", correct: false}
    answer: |-
      ```cpp
      for (int i = 3; i >= 0; --i) {
      ```
      Après 0, `--i` reboucle vers la plus grande valeur de `std::size_t`, toujours `>= 0`. Pour compter à rebours
      jusqu'à zéro, on prend un type signé.
  - key: definition-size-t
    format: definition
    question: "Qu'est-ce que `std::size_t` ?"
    choices:
      - {text: "Le type entier non signé des tailles et des indices", correct: true}
      - {text: "Le type entier signé le plus grand du langage", correct: false}
      - {text: "La fonction qui donne la taille d'un tableau", correct: false}
      - {text: "La constante qui vaut la taille d'un `int`", correct: false}
    answer: "Un type entier non signé, assez grand pour la taille de tout objet. `sizeof` et `size()` le renvoient."
  - key: definition-non-signe
    format: definition
    question: Qu'est-ce qu'un entier « non signé » ?
    choices:
      - {text: "Un entier qui ne représente que zéro et des nombres positifs", correct: true}
      - {text: "Un entier dont la taille n'est pas fixée par la norme", correct: false}
      - {text: "Un entier qui n'a pas encore reçu de valeur", correct: false}
      - {text: "Un entier qui n'a pas de nom dans le programme", correct: false}
    answer: "Un entier sans signe : tous ses bits servent à la valeur. Il va de 0 à 2ⁿ - 1."
  - key: definition-int32
    format: definition
    question: "Que désigne `std::int32_t` ?"
    choices:
      - {text: "Un entier signé d'exactement 32 bits", correct: true}
      - {text: "Un entier signé d'au moins 32 bits", correct: false}
      - {text: "Un entier non signé d'exactement 32 bits", correct: false}
      - {text: "Un entier qui contient 32 chiffres au plus", correct: false}
    answer: "Un entier signé d'exactement 32 bits. « Au moins 32 bits », c'est `std::int_least32_t` ; le non signé est `std::uint32_t`."
  - key: definition-complement-a-deux
    format: definition
    question: Que désigne le « complément à deux » ?
    choices:
      - {text: "La façon de coder les entiers négatifs en binaire", correct: true}
      - {text: "La façon d'arrondir un nombre à virgule à l'entier", correct: false}
      - {text: "La moitié de la plus grande valeur d'un entier", correct: false}
      - {text: "La conversion d'un entier en deux `char`", correct: false}
    answer: |-
      La représentation binaire des entiers signés : le bit de poids fort porte un poids négatif. Depuis C++20, la
      norme l'impose. Elle explique qu'un `std::int8_t` aille de -128 à 127, et non de -127 à 127.
