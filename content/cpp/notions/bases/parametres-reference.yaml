notion: parametres-reference
lesson: |-
  Par défaut, un argument est **copié**. Avec un **`&`** après le type, le paramètre devient une **référence** : un
  autre nom pour la variable de l'appelant, sans copie.

  ```cpp
  void doubler(int& n) {
      n *= 2;            // modifie la variable de l'appelant
  }

  int x = 5;
  doubler(x);            // x vaut 10
  ```

  **Les trois façons de passer un argument.**

  | Paramètre | Copie ? | La fonction peut modifier l'original ? | Usage |
  |---|---|---|---|
  | `int n` (par valeur) | oui | non | les petits types : `int`, `double`, `char`, `bool` |
  | `int& n` (par référence) | non | **oui** | quand la fonction doit modifier l'argument |
  | `const std::string& s` (par référence constante) | non | non | lire un objet coûteux à copier |

  **La référence constante** est le choix par défaut pour les chaînes, les `std::vector` et les objets : on évite la
  copie, et `const` garantit à l'appelant que son objet ne sera pas modifié.

  **Ce qu'on peut passer.**

  - À une référence **non constante**, il faut une **variable** modifiable : `doubler(5)` ne compile pas, et une
    variable `const` non plus.
  - Une référence **constante** accepte tout : une variable, une constante, un littéral, le résultat d'un calcul.

  **Le revers** : à l'appel, `doubler(x)` ne montre pas que `x` va changer. On réserve donc les références non
  constantes aux fonctions dont le nom l'annonce (`echanger`, `trier`), et on préfère **renvoyer** un résultat quand
  c'est possible.

  **En entretien** : « Par valeur pour les types simples, par référence constante pour les objets, par référence non
  constante seulement quand la fonction doit modifier l'argument. »
tour:
  - title: Passer par référence
    text: |-
      Un `&` après le type du paramètre change tout : la fonction ne reçoit plus une copie, mais la variable de
      l'appelant elle-même, sous un autre nom. Elle peut donc la modifier.

      Pour un objet coûteux à copier, comme une chaîne, on passe une référence **constante** : `const std::string&`.
      Pas de copie, et pas de modification possible.

      Essaie : retire le `&` de `void doubler(int& n)`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          void doubler(int& n) {
              n *= 2;
          }

          void saluer(const std::string& prenom) {
              std::println("Bonjour, {} !", prenom);
          }

          int main() {
              int x = 5;
              doubler(x);
              std::println("{}", x);

              saluer("Ada");
          }
      output: |-
        10
        Bonjour, Ada !
    task:
      instructions: |-
        Écris le corps de `echanger`, pour qu'elle échange les valeurs de ses deux arguments : le programme doit
        afficher `2 1`.
      starter:
        main.cpp: |-
          #include <print>

          void echanger(int& a, int& b) {
          }

          int main() {
              int x = 1;
              int y = 2;
              echanger(x, y);
              std::println("{} {}", x, y);
          }
      solution:
        main.cpp: |-
          #include <print>

          void echanger(int& a, int& b) {
              int ancien = a;
              a = b;
              b = ancien;
          }

          int main() {
              int x = 1;
              int y = 2;
              echanger(x, y);
              std::println("{} {}", x, y);
          }
      output: "2 1"
cards:
  - key: role-de-la-reference
    format: course
    question: "Que reçoit la fonction `void doubler(int& n)` quand on l'appelle avec `doubler(x)` ?"
    choices:
      - {text: "La variable `x` elle-même, sous le nom `n`", correct: true}
      - {text: "Une copie de `x`, rangée dans `n`", correct: false}
      - {text: "Le double de `x`, rangé dans `n`", correct: false}
      - {text: "Une constante égale à `x`, non modifiable", correct: false}
    answer: "Une référence est un autre nom pour la variable de l'appelant. Tout ce que la fonction fait à `n`, elle le fait à `x`."
  - key: pourquoi-const-ref
    format: course
    question: "Pourquoi passe-t-on une chaîne par `const std::string&` plutôt que par valeur ?"
    choices:
      - {text: "Pour éviter de la copier, sans laisser la fonction la modifier", correct: true}
      - {text: "Pour que la fonction puisse modifier la chaîne de l'appelant", correct: false}
      - {text: "Pour que la chaîne soit détruite à la fin de la fonction", correct: false}
      - {text: "Pour que la chaîne soit convertie en constante à la compilation", correct: false}
    answer: "Copier une chaîne alloue de la mémoire et recopie ses caractères. La référence évite ce travail, et `const` garde la garantie du passage par valeur : l'original ne change pas."
  - key: choisir-le-passage
    format: course
    question: Comment passe-t-on un `int` qu'une fonction ne fait que lire ?
    choices:
      - {text: "Par valeur : la copie d'un `int` ne coûte rien", correct: true}
      - {text: "Par référence constante, comme tous les paramètres", correct: false}
      - {text: "Par référence non constante, pour éviter la copie", correct: false}
      - {text: "Par un pointeur, pour éviter la copie", correct: false}
    answer: "Pour un type simple, la copie est aussi rapide qu'une référence, et plus simple à lire. La référence constante se justifie pour les objets coûteux à copier."
  - key: litteral-et-reference
    format: course
    question: "Pourquoi `doubler(5)` ne compile-t-il pas, avec `void doubler(int& n)` ?"
    choices:
      - {text: "Une référence non constante exige une variable modifiable", correct: true}
      - {text: "Une fonction `void` ne peut pas recevoir de littéral", correct: false}
      - {text: "Le littéral 5 est un `double`, pas un `int`", correct: false}
      - {text: "Une référence ne peut désigner qu'une variable globale", correct: false}
    answer: "La fonction promet de modifier son argument : il lui faut une variable, pas une valeur temporaire. Une référence constante, `const int&`, accepterait le littéral."
  - key: vf-reference-copie
    format: true-false
    question: Passer un argument par référence en fait une copie.
    truth: false
    answer: "C'est justement ce qu'évite la référence : le paramètre désigne l'objet de l'appelant."
  - key: vf-const-ref-litteral
    format: true-false
    question: "Une fonction qui prend un `const std::string&` peut être appelée avec un littéral comme `\"Ada\"`."
    truth: true
    answer: "Une référence constante accepte une valeur temporaire : ici, une chaîne créée à partir du littéral, le temps de l'appel."
  - key: vf-const-ref-modification
    format: true-false
    question: "Une fonction peut modifier un paramètre reçu par `const int&`."
    truth: false
    answer: "`const` l'interdit : toute modification est une erreur de compilation."
  - key: vf-appel-identique
    format: true-false
    question: "À l'appel, `f(x)` s'écrit de la même façon que `f` prenne son paramètre par valeur ou par référence."
    truth: true
    answer: Rien ne distingue les deux à l'appel. C'est pourquoi on réserve les références non constantes aux fonctions dont le nom annonce la modification.
  - key: qcm-modifier-l-argument
    format: multiple-choice
    question: "Quelle signature permet à `remettre_a_zero` de modifier la variable qu'on lui passe ?"
    choices:
      - {text: "`void remettre_a_zero(int& n)`", correct: true}
      - {text: "`void remettre_a_zero(int n)`", correct: false}
      - {text: "`void remettre_a_zero(const int& n)`", correct: false}
      - {text: "`void remettre_a_zero(const int n)`", correct: false}
    answer: "Une référence non constante. Par valeur, la fonction modifierait une copie ; avec `const`, elle ne pourrait rien modifier."
  - key: qcm-lire-un-vecteur
    format: multiple-choice
    question: "Quelle signature convient à une fonction qui calcule la somme d'un grand `std::vector<int>` sans le modifier ?"
    choices:
      - {text: "`int somme(const std::vector<int>& valeurs)`", correct: true}
      - {text: "`int somme(std::vector<int> valeurs)`", correct: false}
      - {text: "`int somme(std::vector<int>& valeurs)`", correct: false}
      - {text: "`int somme(const std::vector<int> valeurs)`", correct: false}
    answer: "La référence constante évite de copier tout le tableau, et dit à l'appelant qu'il ne sera pas modifié. Par valeur, chaque appel le recopie."
  - key: qcm-ou-placer-l-esperluette
    format: multiple-choice
    question: Où s'écrit le `&` qui fait d'un paramètre une référence ?
    choices:
      - {text: "Après le type, dans la déclaration du paramètre", correct: true}
      - {text: "Devant l'argument, dans l'appel de la fonction", correct: false}
      - {text: "Devant le nom de la fonction", correct: false}
      - {text: "Après le nom du paramètre", correct: false}
    answer: "`void doubler(int& n)` : le `&` fait partie du type du paramètre. L'appel reste `doubler(x)`, sans rien ajouter."
  - key: qcm-passer-une-constante
    format: multiple-choice
    question: "Avec `const int limite = 10;`, à laquelle de ces fonctions peut-on passer `limite` ?"
    choices:
      - {text: "`void afficher(const int& n)`", correct: true}
      - {text: "`void doubler(int& n)`", correct: false}
      - {text: "`void incrementer(int& n)`", correct: false}
      - {text: "`void remettre_a_zero(int& n)`", correct: false}
    answer: "Une référence non constante permettrait de modifier `limite` : le compilateur refuse. Une référence constante, ou un passage par valeur, ne la menace pas."
  - key: trous-esperluette
    format: fill-in
    question: |-
      Complète pour que la fonction modifie la variable de l'appelant :
      ```cpp
      void doubler(int___ n) {
          n *= 2;
      }
      ```
    blanks:
      - ["&"]
    answer: "`int& n` : une référence vers la variable passée en argument."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que la fonction lise la chaîne sans la copier ni pouvoir la modifier :
      ```cpp
      void saluer(___ std::string& prenom) {
          std::println("Bonjour, {} !", prenom);
      }
      ```
    blanks:
      - [const]
    answer: "`const std::string&` : une référence constante."
  - key: trous-reference-chaine
    format: fill-in
    question: |-
      Complète pour éviter de copier la chaîne à chaque appel :
      ```cpp
      std::size_t longueur(const std::string___ texte) {
          return texte.size();
      }
      ```
    blanks:
      - ["&"]
    answer: "Le `&` fait du paramètre une référence. Sans lui, la chaîne serait copiée, `const` ou pas."
  - key: trous-argument
    format: fill-in
    question: |-
      Complète l'appel pour que `x` soit doublée :
      ```cpp
      void doubler(int& n) {
          n *= 2;
      }

      int main() {
          int x = 5;
          doubler(___);
      }
      ```
    blanks:
      - [x]
    answer: "`doubler(x);` : on passe la variable, sans `&` à l'appel."
  - key: code-par-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void doubler(int& n) {
          n *= 2;
      }

      int main() {
          int x = 5;
          doubler(x);
          doubler(x);
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`20`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`20` : `n` désigne `x`. Chaque appel double `x` : 10, puis 20."
    check:
      output: "20"
  - key: code-valeur-et-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void par_valeur(int n) {
          n = 0;
      }

      void par_reference(int& n) {
          n = 0;
      }

      int main() {
          int x = 1;
          int y = 1;
          par_valeur(x);
          par_reference(y);
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "`1 0`", correct: true}
      - {text: "`0 0`", correct: false}
      - {text: "`0 1`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`1 0` : la première fonction met à zéro une copie de `x`. La seconde met à zéro `y` lui-même."
    check:
      output: "1 0"
  - key: code-echanger
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void echanger(int& a, int& b) {
          int ancien = a;
          a = b;
          b = ancien;
      }

      int main() {
          int x = 1;
          int y = 2;
          echanger(x, y);
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`2 1` : `a` et `b` désignent `x` et `y`. La variable `ancien` garde la valeur de `a` pendant l'échange."
    check:
      output: "2 1"
  - key: code-const-ref
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      std::size_t longueur(const std::string& texte) {
          return texte.size();
      }

      int main() {
          std::string mot = "bonjour";
          std::println("{} {}", longueur(mot), longueur("C++"));
      }
      ```
    choices:
      - {text: "`7 3`", correct: true}
      - {text: "`7 4`", correct: false}
      - {text: "`8 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7 3` : une référence constante accepte une variable comme un littéral. Pour `\"C++\"`, une chaîne temporaire de trois caractères est créée le temps de l'appel."
    check:
      output: "7 3"
  - key: bug-esperluette-oubliee
    format: bug-fix
    question: |-
      Ce programme affiche `3` au lieu de `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void remettre_a_zero(int compteur) {
          compteur = 0;
      }

      int main() {
          int visites = 3;
          remettre_a_zero(visites);
          std::println("{}", visites);
      }
      ```
    choices:
      - {text: "Écrire le paramètre `int& compteur`", correct: true}
      - {text: "Écrire le paramètre `const int& compteur`", correct: false}
      - {text: "Écrire l'appel `remettre_a_zero(&visites)`", correct: false}
      - {text: "Renommer le paramètre en `visites`", correct: false}
    answer: |-
      ```cpp
      void remettre_a_zero(int& compteur) {
      ```
      Par valeur, la fonction met à zéro une copie. Le `&` s'écrit dans la signature, pas à l'appel.
  - key: bug-litteral
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind non-const lvalue reference of type 'int&' to an rvalue of type 'int' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void doubler(int& n) {
          n *= 2;
      }

      int main() {
          doubler(21);
      }
      ```
    choices:
      - {text: "Ranger 21 dans une variable, et passer cette variable", correct: true}
      - {text: "Écrire `doubler(&21)` dans l'appel", correct: false}
      - {text: "Écrire `doubler(int& 21)` dans l'appel", correct: false}
      - {text: "Écrire `doubler(21.0)` dans l'appel", correct: false}
    answer: |-
      ```cpp
      int x = 21;
      doubler(x);
      ```
      La fonction modifie son argument : il lui faut une variable. Un littéral n'a pas d'emplacement à modifier.
  - key: bug-const-modifiee
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only reference 'prix' ». La fonction doit vraiment appliquer la
      remise au prix de l'appelant. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void remiser(const int& prix) {
          prix -= 10;
      }

      int main() {
          int prix = 100;
          remiser(prix);
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Retirer `const` : écrire `int& prix`", correct: true}
      - {text: "Retirer `&` : écrire `const int prix`", correct: false}
      - {text: "Retirer les deux : écrire `int prix`", correct: false}
      - {text: "Ajouter `const` à la variable de `main`", correct: false}
    answer: |-
      ```cpp
      void remiser(int& prix) {
      ```
      `const` interdit la modification. Sans `&`, le code compilerait, mais modifierait une copie.
  - key: bug-constante-refusee
    format: bug-fix
    question: |-
      Ce code ne compile pas : le compilateur refuse de passer `limite` à `afficher`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(int& valeur) {
          std::println("{}", valeur);
      }

      int main() {
          const int limite = 10;
          afficher(limite);
      }
      ```
    choices:
      - {text: "Écrire le paramètre `const int& valeur`", correct: true}
      - {text: "Écrire l'appel `afficher(&limite)`", correct: false}
      - {text: "Écrire l'appel `afficher(const limite)`", correct: false}
      - {text: "Écrire le paramètre `int&& valeur`", correct: false}
    answer: |-
      ```cpp
      void afficher(const int& valeur) {
      ```
      Une référence non constante permettrait de modifier une constante. La fonction ne fait que lire : son paramètre
      doit le dire, avec `const` (ou être passé par valeur).
