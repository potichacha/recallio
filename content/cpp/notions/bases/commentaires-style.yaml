notion: commentaires-style
lesson: |-
  Un programme est lu bien plus souvent qu'il n'est écrit. Quelques règles de forme, que le compilateur impose ou
  que l'usage recommande, le rendent lisible.

  **Les commentaires.** Le compilateur les ignore : ils sont pour le lecteur.

  ```cpp
  // Un commentaire jusqu'à la fin de la ligne.

  /* Un commentaire
     sur plusieurs lignes. */
  ```

  Un commentaire `/* ... */` **ne s'imbrique pas** : il s'arrête au premier `*/` rencontré. Pour désactiver un
  morceau de code, on préfère donc `//` sur chaque ligne.

  Un bon commentaire dit **pourquoi**, pas **quoi** : le code dit déjà ce qu'il fait.

  ```cpp
  ++i;   // incrémente i                      (inutile)
  ++i;   // saute l'en-tête du fichier        (utile)
  ```

  **Le point-virgule** termine chaque **instruction** : une déclaration, une affectation, un appel, un `return`.
  Il n'y en a pas après l'accolade fermante d'une fonction, d'un `if` ou d'une boucle. Il y en a un après la
  définition d'une **classe**, d'une `struct` ou d'une `enum`.

  Un point-virgule seul est une **instruction vide**. Placé par erreur après un `if` ou un `for`, il en devient le
  corps :

  ```cpp
  if (stock == 0);        // l'instruction vide est le corps du if
  {
      alerter();          // toujours exécuté
  }
  ```

  **Les accolades** délimitent un **bloc**. Sans elles, un `if` ou une boucle ne gouverne qu'**une seule**
  instruction, quelle que soit l'indentation. On les écrit donc toujours, même pour une ligne.

  **Les espaces et les retours à la ligne** ne comptent pas pour le compilateur : l'indentation est une
  convention, que l'on confie à un outil (`clang-format`).

  **Les noms.** Un identifiant est fait de lettres, de chiffres et de `_`, ne commence pas par un chiffre, et
  **distingue les majuscules** : `total` et `Total` sont deux noms. Les mots-clés (`int`, `return`, `class`...) sont
  réservés, comme les noms qui commencent par deux `_`, ou par un `_` suivi d'une majuscule.

  Le langage n'impose aucun style. Les conventions courantes :

  | Convention | Exemple | Usage fréquent |
  |---|---|---|
  | `snake_case` | `prix_total` | variables et fonctions (style de la bibliothèque standard) |
  | `PascalCase` | `CompteBancaire` | types et classes |
  | `camelCase` | `prixTotal` | variables et fonctions, dans d'autres projets |
  | `MAJUSCULES` | `TAILLE_MAX` | macros |

  Ce qui compte : **un seul style par projet**, et des noms qui disent le rôle (`nombre_clients`, pas `n2`).

  **En entretien** : « Un commentaire explique le pourquoi ; `/* */` ne s'imbrique pas. Je mets toujours des
  accolades, car un `if` sans accolades ne gouverne qu'une instruction. Pour le nommage, je suis la convention du
  projet, et je laisse `clang-format` gérer la mise en forme. »
tour:
  - title: Commentaires, accolades, noms
    text: |-
      Le compilateur ignore les **commentaires** : `//` jusqu'à la fin de la ligne, `/* ... */` sur plusieurs lignes.
      Ils servent à expliquer pourquoi le code est écrit ainsi.

      Chaque instruction se termine par un **point-virgule**, et les **accolades** délimitent un bloc. L'indentation,
      elle, ne compte pas pour le compilateur.

      Essaie : supprime les accolades du `if`, puis exécute. Seule la première ligne dépend encore de la
      condition : `à commander` s'affiche alors que le stock n'est pas vide.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              // Le stock restant, en nombre d'articles.
              int stock_restant = 3;

              /* Un commentaire
                 sur deux lignes. */
              if (stock_restant == 0) {
                  std::println("rupture");
                  std::println("à commander");
              }
              std::println("{} en stock", stock_restant);
          }
      output: "3 en stock"
cards:
  - key: deux-formes
    format: course
    question: Quelles sont les deux formes de commentaire en C++ ?
    choices:
      - {text: "`//` jusqu'à la fin de la ligne, et `/* ... */` sur plusieurs lignes", correct: true}
      - {text: "`#` jusqu'à la fin de la ligne, et `<!-- ... -->` sur plusieurs lignes", correct: false}
      - {text: "`--` jusqu'à la fin de la ligne, et `{- ... -}` sur plusieurs lignes", correct: false}
      - {text: "`;` jusqu'à la fin de la ligne, et `\"\"\" ... \"\"\"` sur plusieurs lignes", correct: false}
    answer: "Le compilateur les retire avant d'analyser le code. `#` introduit une directive du préprocesseur, pas un commentaire."
  - key: imbrication
    format: course
    question: "Pourquoi ne peut-on pas placer un commentaire `/* ... */` à l'intérieur d'un autre ?"
    choices:
      - {text: "Le commentaire s'arrête au premier `*/` rencontré : la suite redevient du code", correct: true}
      - {text: "Le compilateur refuse tout fichier qui contient plus d'un commentaire long", correct: false}
      - {text: "Le second commentaire est exécuté comme une instruction du programme", correct: false}
      - {text: "Le préprocesseur efface tout le fichier après le second `/*` rencontré", correct: false}
    answer: "Les commentaires longs ne s'imbriquent pas. Pour désactiver un passage qui en contient déjà un, on met `//` devant chaque ligne."
  - key: sans-accolades
    format: course
    question: "Que gouverne un `if` écrit sans accolades ?"
    choices:
      - {text: "Seulement l'instruction qui le suit, quelle que soit l'indentation", correct: true}
      - {text: "Toutes les instructions indentées sous lui, comme en Python", correct: false}
      - {text: "Toutes les instructions jusqu'à la fin de la fonction", correct: false}
      - {text: "Aucune instruction : la condition est évaluée pour rien", correct: false}
    answer: "L'indentation ne compte pas pour le compilateur. Sans accolades, la deuxième ligne « sous » le `if` s'exécute toujours : on écrit donc toujours les accolades."
  - key: nommage
    format: course
    question: Que dit le langage C++ du style de nommage des variables ?
    choices:
      - {text: "Rien : c'est une convention, à garder la même dans tout le projet", correct: true}
      - {text: "Il impose `snake_case` pour les variables et les fonctions", correct: false}
      - {text: "Il impose `camelCase` pour les variables et `PascalCase` pour les types", correct: false}
      - {text: "Il interdit les majuscules dans les noms de variables", correct: false}
    answer: "Le compilateur accepte tout identifiant valide. La bibliothèque standard écrit en `snake_case` ; beaucoup de projets nomment leurs types en `PascalCase`. L'important est la cohérence."
  - key: vf-casse
    format: true-false
    question: "Le compilateur traite `prixTotal` et `prixtotal` comme deux identifiants différents."
    truth: true
    answer: C++ distingue les majuscules des minuscules.
  - key: vf-indentation
    format: true-false
    question: "L'indentation change le comportement d'un programme C++."
    truth: false
    answer: "Les espaces et les retours à la ligne ne comptent pas. Ce sont les accolades qui délimitent les blocs."
  - key: vf-point-virgule-classe
    format: true-false
    question: "La définition d'une `struct` se termine par un point-virgule, après son accolade fermante."
    truth: true
    answer: "Comme celle d'une classe ou d'une `enum`. Une fonction, un `if` ou une boucle n'en prennent pas."
  - key: vf-chiffre
    format: true-false
    question: "Un nom de variable peut commencer par un chiffre."
    truth: false
    answer: "Un identifiant commence par une lettre ou par `_`. Les chiffres sont permis ensuite : `ligne2`, pas `2ligne`."
  - key: qcm-identifiant
    format: multiple-choice
    question: Lequel de ces noms est un identifiant valide ?
    choices:
      - {text: "`prix_total2`", correct: true}
      - {text: "`2prix_total`", correct: false}
      - {text: "`prix-total`", correct: false}
      - {text: "`return`", correct: false}
    answer: "Lettres, chiffres et `_`, sans chiffre en tête. Le tiret est l'opérateur de soustraction, et `return` est un mot-clé réservé."
  - key: qcm-bon-commentaire
    format: multiple-choice
    question: Lequel de ces commentaires apporte quelque chose au lecteur ?
    choices:
      - {text: "`// la première ligne du fichier est un en-tête : on la saute`", correct: true}
      - {text: "`// ajoute 1 à i`, au-dessus de `++i;`", correct: false}
      - {text: "`// déclare un entier`, au-dessus de `int n = 0;`", correct: false}
      - {text: "`// fin de la fonction`, à côté de l'accolade fermante", correct: false}
    answer: "Un commentaire explique le pourquoi. Répéter ce que dit déjà le code ajoute du bruit, et finit par mentir quand le code change."
  - key: qcm-snake-case
    format: multiple-choice
    question: "Lequel de ces noms suit la convention `snake_case` ?"
    choices:
      - {text: "`nombre_de_clients`", correct: true}
      - {text: "`nombreDeClients`", correct: false}
      - {text: "`NombreDeClients`", correct: false}
      - {text: "`NOMBRE_DE_CLIENTS`", correct: false}
    answer: "Des minuscules séparées par des `_`. Les trois autres sont le `camelCase`, le `PascalCase` et les majuscules réservées aux macros."
  - key: qcm-outil
    format: multiple-choice
    question: Quel outil met en forme le code C++ selon les conventions du projet ?
    choices:
      - {text: "`clang-format`", correct: true}
      - {text: "`g++ -Wall`", correct: false}
      - {text: "`gdb`", correct: false}
      - {text: "`cmake`", correct: false}
    answer: "`clang-format` réécrit l'indentation, les espaces et les retours à la ligne d'après un fichier de configuration. Plus personne n'en discute en revue de code."
  - key: bug-point-virgule-apres-if
    format: bug-fix
    question: |-
      Ce programme devrait n'afficher `rupture` que si le stock est nul. Il l'affiche alors que le stock vaut 3.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int stock = 3;
          if (stock == 0);
          {
              std::println("rupture");
          }
      }
      ```
    choices:
      - {text: "Retirer le point-virgule après `if (stock == 0)`", correct: true}
      - {text: "Retirer les accolades autour du `std::println`", correct: false}
      - {text: "Écrire `stock = 0` dans la condition du `if`", correct: false}
      - {text: "Ajouter un point-virgule après l'accolade fermante du bloc", correct: false}
    answer: |-
      ```cpp
      if (stock == 0) {
          std::println("rupture");
      }
      ```
      Le point-virgule est une instruction vide : c'est elle, le corps du `if`. Le bloc qui suit n'en dépend plus,
      et s'exécute toujours.
  - key: bug-sans-accolades
    format: bug-fix
    question: |-
      Ce programme devrait n'afficher rien quand la note est suffisante. Il affiche `à repasser`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int note = 15;
          if (note < 10)
              std::println("insuffisant");
              std::println("à repasser");
      }
      ```
    choices:
      - {text: "Entourer les deux `std::println` d'accolades", correct: true}
      - {text: "Indenter davantage le second `std::println`", correct: false}
      - {text: "Écrire les deux `std::println` sur la même ligne", correct: false}
      - {text: "Ajouter un point-virgule après `if (note < 10)`", correct: false}
    answer: |-
      ```cpp
      if (note < 10) {
          std::println("insuffisant");
          std::println("à repasser");
      }
      ```
      Sans accolades, le `if` ne gouverne que la première instruction. L'indentation, et même la mise sur une seule
      ligne, n'y changent rien.
  - key: bug-commentaire-imbrique
    format: bug-fix
    question: |-
      Pour désactiver deux lignes, on les a entourées de `/*` et `*/`. Le compilateur refuse le fichier. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          /*
          int remise = 5;   /* en pourcentage */
          std::println("{}", remise);
          */
          std::println("fin");
      }
      ```
    choices:
      - {text: "Désactiver chacune des deux lignes avec `//`, sans commentaire long", correct: true}
      - {text: "Ajouter un second `*/` à la fin du commentaire long", correct: false}
      - {text: "Remplacer le `/*` du début par `/**`", correct: false}
      - {text: "Placer le commentaire long avant `int main()`", correct: false}
    answer: |-
      ```cpp
      // int remise = 5;   /* en pourcentage */
      // std::println("{}", remise);
      std::println("fin");
      ```
      Le commentaire long s'arrête au premier `*/`, celui de « en pourcentage ». Le `std::println` redevient du
      code, où `remise` n'existe pas, et le `*/` final est une faute de syntaxe.
  - key: bug-casse
    format: bug-fix
    question: |-
      Le compilateur répond « 'Total' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 12;
          std::println("{}", Total);
      }
      ```
    choices:
      - {text: "Écrire `total`, avec une minuscule, dans le `std::println`", correct: true}
      - {text: "Écrire `\"Total\"`, entre guillemets, dans le `std::println`", correct: false}
      - {text: "Écrire `std::Total` dans le `std::println`", correct: false}
      - {text: "Écrire `#include <Total>` en haut du fichier", correct: false}
    answer: |-
      ```cpp
      std::println("{}", total);
      ```
      C++ distingue les majuscules : `Total` est un autre nom, que personne n'a déclaré. Le compilateur le suggère
      d'ailleurs : « did you mean 'total'? ».
