notion: concepts
lesson: |-
  Un template accepte **n'importe quel type**, et ne découvre qu'à l'instanciation si ce type convient. L'erreur
  surgit alors au fond de l'implémentation, illisible. Les **concepts** (C++20) permettent de dire, dans la
  signature, **ce qu'un type doit savoir faire**.

  **Un concept est un prédicat sur un type**, évalué à la compilation : il vaut `true` ou `false`.

  ```cpp
  #include <concepts>

  template <std::integral T>
  T moitie(T n) { return n / 2; }

  moitie(10);      // accepté : int est un type entier
  moitie(2.5);     // refusé à l'appel : double ne satisfait pas std::integral
  ```

  **Quatre façons d'écrire la même contrainte.**

  ```cpp
  template <std::integral T> T moitie(T n);                       // à la place de typename
  template <typename T> requires std::integral<T> T moitie(T n);  // clause requires
  template <typename T> T moitie(T n) requires std::integral<T>;  // clause requires finale
  auto moitie(std::integral auto n);                              // template abrégé
  ```

  **Les concepts de la bibliothèque** (en-tête `<concepts>`).

  | Concept | Le type... |
  |---|---|
  | `std::integral`, `std::floating_point` | est un entier, un nombre à virgule |
  | `std::same_as<U>` | est exactement `U` |
  | `std::convertible_to<U>` | se convertit en `U` |
  | `std::equality_comparable` | se compare avec `==` |
  | `std::totally_ordered` | se compare avec `<`, `<=`, `>`, `>=` |
  | `std::copyable`, `std::movable` | se copie, se déplace |
  | `std::invocable<Args...>` | s'appelle avec ces arguments |

  **Écrire son concept.** Avec une **expression `requires`**, qui liste ce qui doit compiler :

  ```cpp
  template <typename T>
  concept Additionnable = requires(T a, T b) {
      { a + b } -> std::convertible_to<T>;     // a + b doit exister, et donner un T
  };

  template <typename T>
  concept Affichable = requires(T valeur) {
      valeur.afficher();                       // cet appel doit être valide
  };
  ```

  Rien n'est exécuté : le compilateur vérifie seulement que les expressions sont **valides** pour ce type.

  **On les combine** avec `&&` et `||` : `requires std::integral<T> || std::floating_point<T>`.

  **Ce qu'on y gagne.**

  - **Des erreurs lisibles**, à l'appel : « constraints not satisfied », suivi de l'exigence qui manque.
  - **Une signature qui documente** : le lecteur voit ce que le type doit fournir.
  - **Le choix de la surcharge** : entre deux templates, le compilateur prend celui dont la contrainte est la plus
    précise. Cela remplace les astuces à base de SFINAE et `std::enable_if`.

  **Ce qu'un concept ne fait pas.** Il vérifie la **syntaxe**, pas le sens : un type peut avoir un `+` qui ne fait
  pas une addition. Et il ne vérifie pas que le corps du template se limite à ce que le concept exige.

  **En entretien** : « Un concept est un prédicat sur un type, vérifié à la compilation. Il contraint un template
  dans sa signature : l'erreur arrive à l'appel, lisible, au lieu du fond de l'instanciation. J'utilise ceux de
  `<concepts>`, comme `std::integral`, ou j'écris les miens avec une expression `requires`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un concept, en C++20 ?"
    choices:
      - {text: "Un prédicat sur un type, évalué à la compilation, qui contraint un template", correct: true}
      - {text: "Une classe de base abstraite, dont un type doit hériter pour être accepté", correct: false}
      - {text: "Une vérification faite à l'exécution, qui lève une exception en cas d'échec", correct: false}
      - {text: "Un commentaire structuré, que le compilateur ignore", correct: false}
    answer: "Il vaut `true` ou `false` pour un type donné. Aucun héritage n'est requis, et rien ne se passe à l'exécution."
  - key: interet
    format: course
    question: "Qu'apporte un concept par rapport à un template sans contrainte ?"
    choices:
      - {text: "L'erreur arrive à l'appel, et nomme l'exigence que le type ne remplit pas", correct: true}
      - {text: "Le template s'exécute plus vite, car les types sont vérifiés d'avance", correct: false}
      - {text: "Le template peut être défini dans un fichier source au lieu de l'en-tête", correct: false}
      - {text: "Le template accepte davantage de types qu'auparavant", correct: false}
    answer: "Sans contrainte, l'erreur surgit dans le corps du template, avec toute la pile d'instanciation. Avec un concept : « constraints not satisfied »."
  - key: requires-expression
    format: course
    question: "Que fait une expression `requires(T a, T b) { a + b; }` ?"
    choices:
      - {text: "Elle vaut `true` si `a + b` est une expression valide pour le type `T`", correct: true}
      - {text: "Elle calcule `a + b` à la compilation, et en renvoie le résultat", correct: false}
      - {text: "Elle calcule `a + b` à l'exécution, et lève une exception s'il déborde", correct: false}
      - {text: "Elle déclare un opérateur `+` pour le type `T`", correct: false}
    answer: "Rien n'est exécuté ni calculé : le compilateur vérifie seulement que l'expression compilerait."
  - key: surcharge
    format: course
    question: "Deux templates conviennent à un appel, l'un contraint par `std::integral`, l'autre sans contrainte. Lequel est choisi pour un `int` ?"
    choices:
      - {text: "Celui qui est contraint : il est plus spécialisé", correct: true}
      - {text: "Celui qui n'est pas contraint : il est plus général", correct: false}
      - {text: "Aucun : l'appel est ambigu", correct: false}
      - {text: "Le premier déclaré dans le fichier", correct: false}
    answer: "Le compilateur préfère la surcharge la plus contrainte. Pour un `double`, seule la version sans contrainte reste candidate."
  - key: vf-execution
    format: true-false
    question: "Un concept est vérifié à l'exécution du programme."
    truth: false
    answer: "Tout se passe à la compilation. Un concept ne produit aucun code."
  - key: vf-heritage
    format: true-false
    question: "Pour satisfaire un concept, un type doit hériter d'une classe particulière."
    truth: false
    answer: "Il suffit qu'il offre les opérations demandées. C'est un typage structurel, sans lien déclaré."
  - key: vf-auto
    format: true-false
    question: "On peut écrire un concept devant `auto` dans un paramètre : `void f(std::integral auto n)`."
    truth: true
    answer: "C'est le template abrégé contraint."
  - key: vf-semantique
    format: true-false
    question: "Un concept garantit que l'opérateur `+` d'un type fait bien une addition."
    truth: false
    answer: "Il vérifie que l'expression est valide, pas ce qu'elle fait. Le sens reste une convention."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::integral` et `std::same_as` ?"
    choices:
      - {text: "`<concepts>`", correct: true}
      - {text: "`<type_traits>`", correct: false}
      - {text: "`<requires>`", correct: false}
      - {text: "`<template>`", correct: false}
    answer: "`<concepts>` déclare les concepts de base de la bibliothèque."
  - key: qcm-ordre
    format: multiple-choice
    question: "Quel concept exige qu'un type se compare avec `<`, `<=`, `>` et `>=` ?"
    choices:
      - {text: "`std::totally_ordered`", correct: true}
      - {text: "`std::equality_comparable`", correct: false}
      - {text: "`std::integral`", correct: false}
      - {text: "`std::copyable`", correct: false}
    answer: "`std::totally_ordered` inclut aussi l'égalité. `std::equality_comparable` ne demande que `==` et `!=`."
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle ligne déclare un concept `Nombre`, satisfait par les entiers et les nombres à virgule ?"
    choices:
      - {text: "`template <typename T> concept Nombre = std::integral<T> || std::floating_point<T>;`", correct: true}
      - {text: "`concept Nombre<T> = std::integral<T> || std::floating_point<T>;`", correct: false}
      - {text: "`template <typename T> requires Nombre = std::integral<T> || std::floating_point<T>;`", correct: false}
      - {text: "`using Nombre = std::integral || std::floating_point;`", correct: false}
    answer: "Un concept est un template : `template <typename T> concept Nom = expression booléenne;`."
  - key: qcm-type-retour
    format: multiple-choice
    question: "Dans une expression `requires`, quelle ligne exige que `a.taille()` existe et donne un type convertible en `std::size_t` ?"
    choices:
      - {text: "`{ a.taille() } -> std::convertible_to<std::size_t>;`", correct: true}
      - {text: "`a.taille() == std::convertible_to<std::size_t>;`", correct: false}
      - {text: "`std::convertible_to<std::size_t> a.taille();`", correct: false}
      - {text: "`a.taille() : std::convertible_to<std::size_t>;`", correct: false}
    answer: "L'expression entre accolades, puis `->` et un concept appliqué à son type."
  - key: trous-concept
    format: fill-in
    question: |-
      Complète pour déclarer un concept :
      ```cpp
      template <typename T>
      ___ Affichable = requires(T valeur) {
          valeur.afficher();
      };
      ```
    blanks:
      - [concept]
    answer: "Le mot-clé `concept`, suivi du nom et d'une expression booléenne."
  - key: trous-requires
    format: fill-in
    question: |-
      Complète la clause qui contraint le template :
      ```cpp
      template <typename T>
          ___ std::integral<T>
      T moitie(T n) {
          return n / 2;
      }
      ```
    blanks:
      - [requires]
    answer: "Une clause `requires` suit la liste des paramètres de template."
  - key: trous-integral
    format: fill-in
    question: |-
      Complète pour n'accepter que des types entiers :
      ```cpp
      template <std::___ T>
      T moitie(T n) {
          return n / 2;
      }
      ```
    blanks:
      - [integral]
    answer: "Le concept remplace `typename` devant le paramètre."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête des concepts de la bibliothèque :
      ```cpp
      #include <___>
      ```
    blanks:
      - [concepts]
    answer: "`<concepts>`."
  - key: code-predicat
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>
      #include <string>

      int main() {
          std::println("{} {} {}", std::integral<int>, std::integral<double>, std::floating_point<double>);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`true false true` : un concept appliqué à un type est une constante booléenne, connue à la compilation."
    check:
      output: "true false true"
  - key: code-surcharge
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>

      const char* nature(std::integral auto) {
          return "entier";
      }

      const char* nature(std::floating_point auto) {
          return "virgule";
      }

      const char* nature(auto) {
          return "autre";
      }

      int main() {
          std::println("{} {} {}", nature(7), nature(2.5), nature("texte"));
      }
      ```
    choices:
      - {text: "`entier virgule autre`", correct: true}
      - {text: "`autre autre autre`", correct: false}
      - {text: "`entier entier autre`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`entier virgule autre` : pour chaque argument, la surcharge dont la contrainte est satisfaite et la plus précise est choisie. Celle sans contrainte sert de repli."
    check:
      output: "entier virgule autre"
  - key: code-concept-maison
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>
      #include <string>

      template <typename T>
      concept Additionnable = requires(T a, T b) {
          { a + b } -> std::convertible_to<T>;
      };

      struct Point {
          int x;
      };

      int main() {
          std::println("{} {} {}", Additionnable<int>, Additionnable<std::string>, Additionnable<Point>);
      }
      ```
    choices:
      - {text: "`true true false`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`true true false` : `int` et `std::string` ont un `+` qui rend leur propre type. `Point` n'a pas d'opérateur `+`."
    check:
      output: "true true false"
  - key: code-refus
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>

      template <std::integral T>
      T moitie(T n) {
          return n / 2;
      }

      int main() {
          std::println("{}", moitie(5.0));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`2.5`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : `double` ne satisfait pas `std::integral`. L'appel est refusé, sans conversion : « constraints not satisfied »."
    check:
      compiles: false
  - key: bug-contrainte-absente
    format: bug-fix
    question: |-
      Cette fonction calcule un reste, et ne devrait accepter que des entiers. Appelée avec `2.5`, elle échoue au
      fond de son corps : « invalid operands of types 'double' and 'int' to binary 'operator%' ». Quelle correction
      rend l'erreur lisible, à l'appel ?
      ```cpp
      #include <print>

      template <typename T>
      bool est_pair(T n) {
          return n % 2 == 0;
      }

      int main() {
          std::println("{}", est_pair(2.5));
      }
      ```
    choices:
      - {text: "Contraindre le template : `template <std::integral T>`", correct: true}
      - {text: "Convertir dans le corps : `return static_cast<int>(n) % 2 == 0;`", correct: false}
      - {text: "Déclarer le paramètre `const T& n`", correct: false}
      - {text: "Déclarer la fonction `constexpr`", correct: false}
    answer: |-
      ```cpp
      template <std::integral T>
      bool est_pair(T n) {
          return n % 2 == 0;
      }
      ```
      Avec le concept, l'appel `est_pair(2.5)` est refusé d'emblée : « constraints not satisfied ». Le cast ferait
      compiler un appel qui n'a pas de sens.
  - key: bug-concept-trop-strict
    format: bug-fix
    question: |-
      Le compilateur refuse `carre(1.5)` : la contrainte n'est pas satisfaite. La fonction devrait accepter les
      entiers et les nombres à virgule. Quelle correction est la bonne ?
      ```cpp
      #include <concepts>
      #include <print>

      template <typename T>
          requires std::integral<T>
      T carre(T x) {
          return x * x;
      }

      int main() {
          std::println("{} {}", carre(3), carre(1.5));
      }
      ```
    choices:
      - {text: "Écrire `requires std::integral<T> || std::floating_point<T>`", correct: true}
      - {text: "Écrire `requires std::integral<T> && std::floating_point<T>`", correct: false}
      - {text: "Écrire `requires std::same_as<T, int>`", correct: false}
      - {text: "Écrire `requires (!std::integral<T>)`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
          requires std::integral<T> || std::floating_point<T>
      ```
      `||` accepte l'un ou l'autre. Avec `&&`, aucun type ne conviendrait : un type n'est pas à la fois entier et à
      virgule.
  - key: bug-mot-cle-oublie
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration de `Affichable` : il manque un mot-clé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      Affichable = requires(T valeur) {
          valeur.afficher();
      };

      struct Ticket {
          void afficher() const { std::println("ticket"); }
      };

      int main() {
          std::println("{}", Affichable<Ticket>);
      }
      ```
    choices:
      - {text: "Écrire `concept Affichable = requires(T valeur) {`", correct: true}
      - {text: "Écrire `class Affichable = requires(T valeur) {`", correct: false}
      - {text: "Écrire `using Affichable = requires(T valeur) {`", correct: false}
      - {text: "Écrire `auto Affichable = requires(T valeur) {`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      concept Affichable = requires(T valeur) {
          valeur.afficher();
      };
      ```
      Un concept se déclare avec le mot-clé `concept`.
  - key: bug-type-retour
    format: bug-fix
    question: |-
      Ce programme devrait afficher `false` : `Capteur::valeur()` renvoie une chaîne, pas un nombre. Il affiche
      `true`. Quelle correction du concept est la bonne ?
      ```cpp
      #include <concepts>
      #include <print>
      #include <string>

      template <typename T>
      concept Mesurable = requires(T objet) {
          objet.valeur();
      };

      struct Capteur {
          std::string valeur() const { return "n/a"; }
      };

      int main() {
          std::println("{}", Mesurable<Capteur>);
      }
      ```
    choices:
      - {text: "Écrire `{ objet.valeur() } -> std::convertible_to<double>;`", correct: true}
      - {text: "Écrire `double objet.valeur();`", correct: false}
      - {text: "Écrire `objet.valeur() == 0.0;`", correct: false}
      - {text: "Écrire `objet.valeur(); objet.valeur();`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      concept Mesurable = requires(T objet) {
          { objet.valeur() } -> std::convertible_to<double>;
      };
      ```
      L'exigence simple ne vérifie que l'existence de l'appel. La forme entre accolades contraint aussi le type du
      résultat.
  - key: situation-erreurs-illisibles
    format: scenario
    question: |-
      Ta bibliothèque offre `trier(conteneur)`. Les utilisateurs qui passent une `std::list` reçoivent deux cents
      lignes d'erreurs venues de `std::sort`. Que proposes-tu ?
    choices:
      - {text: "Contraindre `trier` par `std::ranges::random_access_range` : l'appel est refusé clairement", correct: true}
      - {text: "Ajouter un commentaire qui interdit les listes, au-dessus de la fonction", correct: false}
      - {text: "Vérifier le type à l'exécution, et lever une exception", correct: false}
      - {text: "Remplacer le template par une macro du préprocesseur", correct: false}
    answer: |-
      Le concept place l'exigence dans la signature. Le compilateur répond à l'appel : « constraints not
      satisfied », et nomme le concept non rempli, au lieu de dérouler l'intérieur de `std::sort`.
  - key: situation-enable-if
    format: scenario
    question: |-
      En revue de code, tu lis `template <typename T, typename = std::enable_if_t<std::is_integral_v<T>>>`. Le
      projet compile en C++20. Que proposes-tu ?
    choices:
      - {text: "`template <std::integral T>` : même contrainte, lisible, avec de meilleures erreurs", correct: true}
      - {text: "De garder `enable_if` : les concepts sont plus lents à l'exécution", correct: false}
      - {text: "De retirer la contrainte : un template n'a pas à vérifier ses types", correct: false}
      - {text: "De remplacer le template par une fonction qui prend un `int`", correct: false}
    answer: |-
      `std::enable_if` détourne la SFINAE pour contraindre un template. Les concepts expriment la même chose
      directement, se lisent d'un coup d'œil, et ne coûtent rien à l'exécution.
  - key: situation-deux-surcharges
    format: scenario
    question: |-
      Tu veux une fonction `avancer(it, n)` qui fasse `it += n` pour un itérateur à accès direct, et une boucle de
      `++it` pour les autres. Comment l'écris-tu en C++20 ?
    choices:
      - {text: "Deux surcharges, dont l'une contrainte par `std::random_access_iterator`", correct: true}
      - {text: "Une seule fonction, avec un `dynamic_cast` sur l'itérateur", correct: false}
      - {text: "Une seule fonction, avec un `try` autour de `it += n`", correct: false}
      - {text: "Deux fonctions de noms différents, que l'appelant choisit", correct: false}
    answer: |-
      Le compilateur choisit la surcharge la plus contrainte dont l'exigence est remplie. Le choix se fait à la
      compilation, sans coût, et l'appelant n'écrit qu'un nom.
  - key: situation-documenter
    format: scenario
    question: |-
      Un template `Cache<Cle, Valeur>` exige, dans un long commentaire, que `Cle` soit hachable et comparable avec
      `==`. Personne ne lit le commentaire. Comment rends-tu l'exigence impossible à ignorer ?
    choices:
      - {text: "Par une clause `requires` sur `Cle`, vérifiée par le compilateur", correct: true}
      - {text: "Par un commentaire plus long, en majuscules", correct: false}
      - {text: "Par un `assert` dans le constructeur du cache", correct: false}
      - {text: "Par un test unitaire qui instancie le cache avec `int`", correct: false}
    answer: |-
      Une contrainte est une documentation exécutable : elle figure dans la signature, et un type qui ne la remplit
      pas est refusé à l'instanciation, avec le nom de l'exigence.
