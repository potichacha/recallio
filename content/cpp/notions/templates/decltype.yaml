notion: decltype
lesson: |-
  `decltype(expression)` donne le **type** d'une expression, à la compilation, **sans l'évaluer**. Là où `auto`
  simplifie le type (il retire les références et le `const`), `decltype` le rend **tel quel**.

  **Les deux règles.**

  | Ce qu'on lui passe | Ce qu'il donne |
  |---|---|
  | un **nom** de variable ou de membre, sans parenthèses | son type **déclaré** |
  | une autre expression, de type `T` | `T&` si c'est une lvalue, `T&&` si c'est une xvalue, `T` si c'est une prvalue |

  ```cpp
  int x = 0;
  const int& r = x;

  decltype(x)      // int : le type déclaré de x
  decltype(r)      // const int&
  decltype((x))    // int& : (x) est une expression, et une lvalue
  decltype(x + 1)  // int : une prvalue
  ```

  Les **parenthèses** changent donc le résultat : `decltype(x)` et `decltype((x))` ne sont pas le même type.

  **Rien n'est exécuté.** `decltype(f())` donne le type de retour de `f` sans appeler `f`. `std::declval<T>()`
  fabrique, pour ces contextes, une valeur de type `T` sans avoir à construire d'objet :
  `decltype(std::declval<T>().size())`.

  **Le type de retour différé.** Le type de retour d'un template dépend parfois de ses paramètres, qui ne sont
  visibles qu'**après** leur déclaration. On l'écrit donc après la liste des paramètres :

  ```cpp
  template <typename A, typename B>
  auto ajouter(A a, B b) -> decltype(a + b) {
      return a + b;
  }
  ```

  Depuis C++14, `auto` seul suffit le plus souvent : le type est déduit du `return`. La forme avec `decltype` garde
  un intérêt : l'expression fait partie de la **signature**, donc de SFINAE.

  **`decltype(auto)` (C++14).** Il déduit le type comme `decltype` le ferait de l'expression d'initialisation : les
  **références sont gardées**.

  ```cpp
  int& element(std::vector<int>& v) { return v[0]; }

  auto a = element(v);              // int : une copie
  decltype(auto) b = element(v);    // int& : la référence est gardée
  ```

  C'est l'outil des fonctions qui **transmettent** le résultat d'une autre :

  ```cpp
  template <typename F, typename... Args>
  decltype(auto) appeler(F&& f, Args&&... args) {
      return std::forward<F>(f)(std::forward<Args>(args)...);
  }
  ```

  **Le piège.** Avec `decltype(auto)`, `return (x);` renvoie une **référence** vers `x`. Si `x` est une variable
  locale, la référence est pendante. On n'entoure jamais de parenthèses la valeur renvoyée.

  **En entretien** : « `decltype` donne le type exact d'une expression sans l'évaluer : le type déclaré pour un
  nom, et une référence pour toute autre lvalue, d'où la différence entre `decltype(x)` et `decltype((x))`.
  `decltype(auto)` déduit en gardant les références, pour transmettre un retour tel quel. »
cards:
  - key: role
    format: course
    question: "Que donne `decltype(expression)` ?"
    choices:
      - {text: "Le type de l'expression, à la compilation, sans l'évaluer", correct: true}
      - {text: "La valeur de l'expression, calculée à la compilation", correct: false}
      - {text: "Le nom du type de l'expression, sous forme de chaîne", correct: false}
      - {text: "La taille en octets du type de l'expression", correct: false}
    answer: "`decltype` est une question posée au compilateur. L'expression n'est pas exécutée : `decltype(f())` n'appelle pas `f`."
  - key: parentheses
    format: course
    question: "`x` est déclarée `int x = 0;`. Quelle différence entre `decltype(x)` et `decltype((x))` ?"
    choices:
      - {text: "Le premier est `int`, le type déclaré ; le second est `int&`, car `(x)` est une lvalue", correct: true}
      - {text: "Le premier est `int&`, car `x` est une lvalue ; le second est `int`, le type déclaré", correct: false}
      - {text: "Aucune : les parenthèses ne changent jamais le type d'une expression", correct: false}
      - {text: "Le premier est `int` ; le second ne compile pas", correct: false}
    answer: "Un nom seul donne son type déclaré. Toute autre expression suit la règle des catégories de valeur : une lvalue de type `T` donne `T&`."
  - key: decltype-auto
    format: course
    question: "En quoi `decltype(auto)` diffère-t-il de `auto` ?"
    choices:
      - {text: "Il garde les références et le `const` de l'expression d'initialisation", correct: true}
      - {text: "Il retire les références et le `const` de l'expression d'initialisation", correct: false}
      - {text: "Il déduit le type à l'exécution, au lieu de la compilation", correct: false}
      - {text: "Il n'accepte que les types fondamentaux", correct: false}
    answer: "`auto a = f();` copie même si `f` renvoie une référence. `decltype(auto) b = f();` déclare `b` avec le type exact de `f()`."
  - key: retour-differe
    format: course
    question: "Pourquoi écrit-on `auto f(A a, B b) -> decltype(a + b)` plutôt que le type de retour devant ?"
    choices:
      - {text: "Les paramètres `a` et `b` ne sont visibles qu'après leur déclaration", correct: true}
      - {text: "Le compilateur lit les fonctions de droite à gauche", correct: false}
      - {text: "Un type de retour écrit devant est toujours copié deux fois", correct: false}
      - {text: "La flèche rend la fonction utilisable à la compilation", correct: false}
    answer: "Devant le nom de la fonction, `a` et `b` n'existent pas encore. Le type de retour différé, placé après les paramètres, peut les nommer."
  - key: vf-evalue
    format: true-false
    question: "`decltype(incrementer())` appelle la fonction `incrementer`."
    truth: false
    answer: "L'expression n'est pas évaluée : seul son type est examiné. Aucun effet de bord n'a lieu."
  - key: vf-reference-gardee
    format: true-false
    question: "`decltype(r)`, où `r` est déclarée `const int& r`, est `const int&`."
    truth: true
    answer: "Pour un nom, `decltype` rend le type déclaré, référence et `const` compris. `auto` les aurait retirés."
  - key: vf-prvalue
    format: true-false
    question: "`decltype(x + 1)`, où `x` est un `int`, est `int&`."
    truth: false
    answer: "`x + 1` est une prvalue : `decltype` donne `int`, sans référence."
  - key: vf-return-parentheses
    format: true-false
    question: "Dans une fonction `decltype(auto)`, `return (x);` renvoie une référence vers `x`."
    truth: true
    answer: "`(x)` est une lvalue : le type déduit est `int&`. Si `x` est locale, la référence est pendante."
  - key: qcm-declval
    format: multiple-choice
    question: "À quoi sert `std::declval<T>()` dans un `decltype` ?"
    choices:
      - {text: "À disposer d'une valeur de type `T` sans construire d'objet", correct: true}
      - {text: "À construire un objet `T` par défaut, à l'exécution", correct: false}
      - {text: "À déclarer une variable globale de type `T`", correct: false}
      - {text: "À convertir une valeur en type `T`", correct: false}
    answer: "`decltype(std::declval<T>().size())` donne le type de `size()` même si `T` n'a pas de constructeur par défaut. `std::declval` ne s'utilise que dans un contexte non évalué."
  - key: qcm-type-membre
    format: multiple-choice
    question: "`v` est un `std::vector<int>`. Quel est le type `decltype(v[0])` ?"
    choices:
      - {text: "`int&`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`int*`", correct: false}
      - {text: "`const int`", correct: false}
    answer: "`v[0]` est une expression, et une lvalue : `operator[]` renvoie `int&`. `decltype` garde la référence."
  - key: qcm-transmettre
    format: multiple-choice
    question: "Quel type de retour transmet tel quel ce que renvoie la fonction appelée, référence comprise ?"
    choices:
      - {text: "`decltype(auto)`", correct: true}
      - {text: "`auto`", correct: false}
      - {text: "`const auto`", correct: false}
      - {text: "`auto*`", correct: false}
    answer: "`auto` renverrait toujours une valeur. `decltype(auto)` reprend le type exact de l'expression du `return`."
  - key: qcm-meme-type
    format: multiple-choice
    question: "Quelle ligne déclare `y` avec exactement le même type que la variable `x` ?"
    choices:
      - {text: "`decltype(x) y = x;`", correct: true}
      - {text: "`typeof x y = x;`", correct: false}
      - {text: "`sizeof(x) y = x;`", correct: false}
      - {text: "`typeid(x) y = x;`", correct: false}
    answer: "`decltype(x)` est un type, utilisable partout où un type est attendu. `typeid` renseigne à l'exécution, et ne déclare rien."
  - key: code-regles
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          int x = 0;
          const int& r = x;
          std::println("{} {} {} {}",
                       std::is_same_v<decltype(x), int>,
                       std::is_same_v<decltype((x)), int>,
                       std::is_same_v<decltype(r), const int&>,
                       std::is_same_v<decltype(x + 1), int>);
      }
      ```
    choices:
      - {text: "`true false true true`", correct: true}
      - {text: "`true true true true`", correct: false}
      - {text: "`true false false true`", correct: false}
      - {text: "`true false true false`", correct: false}
    answer: "`true false true true` : `decltype((x))` est `int&`, pas `int`. Le nom `r` rend son type déclaré ; `x + 1` est une prvalue."
    check:
      output: "true false true true"
  - key: code-non-evalue
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int compteur = 0;

      int incrementer() {
          return ++compteur;
      }

      int main() {
          decltype(incrementer()) x = 10;
          std::println("{} {}", compteur, x);
      }
      ```
    choices:
      - {text: "`0 10`", correct: true}
      - {text: "`1 10`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: "`0 10` : `decltype` n'appelle pas `incrementer`. Il en retient le type de retour, `int`, pour déclarer `x`."
    check:
      output: "0 10"
  - key: code-decltype-auto
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int valeur = 5;

      int& reference() {
          return valeur;
      }

      int main() {
          auto a = reference();
          a = 9;
          std::print("{} ", valeur);
          decltype(auto) b = reference();
          b = 7;
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "`5 7`", correct: true}
      - {text: "`9 7`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`9 9`", correct: false}
    answer: "`5 7` : `auto` déduit `int`, donc `a` est une copie. `decltype(auto)` déduit `int&` : `b` désigne `valeur`."
    check:
      output: "5 7"
  - key: code-retour-differe
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename A, typename B>
      auto ajouter(A a, B b) -> decltype(a + b) {
          return a + b;
      }

      int main() {
          std::println("{} {}", std::is_same_v<decltype(ajouter(1, 2.5)), double>, ajouter(1, 2.5));
      }
      ```
    choices:
      - {text: "`true 3.5`", correct: true}
      - {text: "`false 3.5`", correct: false}
      - {text: "`true 3`", correct: false}
      - {text: "`false 3`", correct: false}
    answer: "`true 3.5` : le type de retour est celui de `a + b`, soit `int + double`, donc `double`."
    check:
      output: "true 3.5"
  - key: bug-parametres-invisibles
    format: bug-fix
    question: |-
      Le compilateur répond « 'a' was not declared in this scope » sur la première ligne du template. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      template <typename A, typename B>
      decltype(a * b) multiplier(A a, B b) {
          return a * b;
      }

      int main() {
          std::println("{}", multiplier(2, 1.5));
      }
      ```
    choices:
      - {text: "Écrire `auto multiplier(A a, B b) -> decltype(a * b)`", correct: true}
      - {text: "Écrire `decltype(A * B) multiplier(A a, B b)`", correct: false}
      - {text: "Écrire `typename decltype(a * b) multiplier(A a, B b)`", correct: false}
      - {text: "Écrire `decltype((a * b)) multiplier(A a, B b)`", correct: false}
    answer: |-
      ```cpp
      template <typename A, typename B>
      auto multiplier(A a, B b) -> decltype(a * b) {
          return a * b;
      }
      ```
      Devant le nom de la fonction, les paramètres n'existent pas encore. Le type de retour différé vient après
      eux. `auto` seul, sans flèche, conviendrait aussi depuis C++14.
  - key: bug-auto-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `9` : il modifie le premier élément. Il affiche `1`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto premier = v.front();
          premier = 9;
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Déclarer `decltype(auto) premier = v.front();`", correct: true}
      - {text: "Déclarer `const auto premier = v.front();`", correct: false}
      - {text: "Déclarer `decltype(v) premier = v.front();`", correct: false}
      - {text: "Déclarer `auto premier{v.front()};`", correct: false}
    answer: |-
      ```cpp
      decltype(auto) premier = v.front();
      ```
      `front()` renvoie `int&`, mais `auto` retire la référence : `premier` est une copie. `decltype(auto)` la
      garde ; `auto& premier` conviendrait aussi.
  - key: bug-reference-non-initialisee
    format: bug-fix
    question: |-
      Le compilateur répond « 'y' declared as reference but not initialized ». Le programme devrait afficher `0`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          decltype((x)) y;
          y = 0;
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "Écrire `decltype(x) y;`, sans les parenthèses intérieures", correct: true}
      - {text: "Écrire `decltype(((x))) y;`, avec une paire de plus", correct: false}
      - {text: "Écrire `decltype(&x) y;`, avec l'adresse de `x`", correct: false}
      - {text: "Écrire `decltype(x&) y;`, avec une esperluette", correct: false}
    answer: |-
      ```cpp
      decltype(x) y;
      ```
      `decltype((x))` est `int&` : une référence doit être initialisée. Sans les parenthèses, `decltype(x)` est
      `int`, le type déclaré de `x`.
  - key: bug-retour-parentheses
    format: bug-fix
    question: |-
      Cette fonction devrait renvoyer la valeur `5`. Elle renvoie une référence vers une variable locale, et le
      programme plante. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      decltype(auto) calculer() {
          int resultat = 5;
          return (resultat);
      }

      int main() {
          std::println("{}", calculer());
      }
      ```
    choices:
      - {text: "Écrire `return resultat;`, sans parenthèses", correct: true}
      - {text: "Écrire `return ((resultat));`, avec une paire de plus", correct: false}
      - {text: "Écrire `return &resultat;`, avec l'adresse", correct: false}
      - {text: "Écrire `return std::ref(resultat);`", correct: false}
    answer: |-
      ```cpp
      return resultat;
      ```
      Avec `decltype(auto)`, `(resultat)` est une lvalue : le type de retour devient `int&`, vers une variable
      détruite au retour. Sans parenthèses, le type déduit est `int`. GCC le signale : « reference to local
      variable returned ».
