notion: sfinae
lesson: |-
  **SFINAE** est le sigle de *Substitution Failure Is Not An Error* : « l'échec d'une substitution n'est pas une
  erreur ». C'est la règle qui, avant les concepts de C++20, servait à **contraindre** un template. On la rencontre
  dans tout code d'avant 2020, et dans la bibliothèque standard.

  **La règle.** Quand le compilateur examine un template candidat pour un appel, il **substitue** les arguments
  déduits dans sa **déclaration**. Si cette substitution produit un type ou une expression invalide, le candidat
  est simplement **écarté** de la liste des surcharges ; ce n'est pas une erreur de compilation. Les autres
  candidats restent en lice.

  ```cpp
  template <typename T>
  typename T::value_type premier(const T& c);     // écarté si T n'a pas de value_type

  int premier(int x);                             // toujours candidat
  ```

  **Seul le « contexte immédiat » compte.** L'échec doit se produire dans la **signature** : types des paramètres,
  type de retour, arguments par défaut du template. Une erreur dans le **corps** de la fonction est une vraie
  erreur.

  **`std::enable_if`.** L'outil qui fabrique l'échec à la demande :

  ```cpp
  template <bool Condition, typename T = void>
  struct enable_if {};                             // pas de membre type

  template <typename T>
  struct enable_if<true, T> { using type = T; };   // un membre type
  ```

  `std::enable_if_t<Condition, T>` vaut `T` si la condition est vraie ; sinon, il n'existe pas, et la substitution
  échoue.

  **Les trois endroits où l'écrire.**

  ```cpp
  // 1. dans le type de retour
  template <typename T>
  std::enable_if_t<std::is_integral_v<T>, T> double_de(T x);

  // 2. dans un paramètre de template par défaut
  template <typename T, typename = std::enable_if_t<std::is_integral_v<T>>>
  T double_de(T x);

  // 3. dans un paramètre de template non-type (permet de surcharger)
  template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
  T double_de(T x);
  ```

  La deuxième forme ne permet **pas** de surcharger : deux templates qui ne diffèrent que par la valeur par défaut
  d'un paramètre ont la même signature. On prend alors la troisième.

  **Détecter une capacité : `std::void_t` (C++17).** `std::void_t<Expressions...>` vaut `void` si toutes les
  expressions sont valides. Associé à une spécialisation partielle, il dit si un type possède un membre :

  ```cpp
  template <typename T, typename = void>
  struct a_une_taille : std::false_type {};

  template <typename T>
  struct a_une_taille<T, std::void_t<decltype(std::declval<T>().size())>> : std::true_type {};
  ```

  **Aujourd'hui.** Les **concepts** et `requires` font le même travail, lisiblement, avec de meilleurs messages
  d'erreur, et savent classer deux surcharges contraintes. `if constexpr` remplace souvent la paire de surcharges.
  SFINAE reste à connaître pour lire l'existant.

  **En entretien** : « SFINAE : si substituer les arguments dans la signature d'un template échoue, le candidat est
  écarté sans erreur. Avec `std::enable_if`, on s'en sert pour activer une surcharge selon un trait de type. En
  C++20, j'écris un concept ou une clause `requires` à la place. »
cards:
  - key: sigle
    format: course
    question: "Que signifie SFINAE ?"
    choices:
      - {text: "L'échec d'une substitution n'est pas une erreur : le candidat est écarté", correct: true}
      - {text: "L'échec d'une substitution arrête la compilation sur-le-champ", correct: false}
      - {text: "La substitution des arguments est remise à l'exécution", correct: false}
      - {text: "La spécialisation d'une fonction n'est jamais instanciée", correct: false}
    answer: "*Substitution Failure Is Not An Error*. Un template dont la signature devient invalide pour les arguments déduits sort de la liste des surcharges."
  - key: contexte-immediat
    format: course
    question: "Où l'échec doit-il se produire pour que SFINAE s'applique ?"
    choices:
      - {text: "Dans la signature du template : paramètres, type de retour, arguments par défaut", correct: true}
      - {text: "Dans le corps de la fonction template, à n'importe quelle ligne", correct: false}
      - {text: "Dans le code de l'appelant, autour de l'appel de la fonction", correct: false}
      - {text: "Dans un fichier source différent de celui de l'appel", correct: false}
    answer: "C'est le « contexte immédiat ». Une expression invalide dans le corps est une vraie erreur de compilation."
  - key: enable-if
    format: course
    question: "Que vaut `std::enable_if_t<Condition, T>` ?"
    choices:
      - {text: "`T` si la condition est vraie ; sinon, il n'existe pas, et la substitution échoue", correct: true}
      - {text: "`T` si la condition est vraie ; sinon, `void`, et la fonction ne renvoie rien", correct: false}
      - {text: "`true` si `T` est un type valide ; sinon, `false`, sans échec", correct: false}
      - {text: "`T` dans tous les cas ; la condition n'est vérifiée qu'à l'exécution", correct: false}
    answer: "`std::enable_if<false, T>` n'a pas de membre `type`. Y accéder rend la signature invalide : c'est l'échec recherché."
  - key: remplacant
    format: course
    question: "Par quoi remplace-t-on SFINAE depuis C++20 ?"
    choices:
      - {text: "Par les concepts et les clauses `requires`", correct: true}
      - {text: "Par les macros du préprocesseur", correct: false}
      - {text: "Par l'héritage et les fonctions virtuelles", correct: false}
      - {text: "Par les exceptions et les blocs `try`", correct: false}
    answer: "Une contrainte nommée se lit, donne un message clair, et permet au compilateur de préférer la surcharge la plus contrainte."
  - key: vf-corps
    format: true-false
    question: "Une expression invalide dans le corps d'une fonction template écarte ce candidat sans erreur."
    truth: false
    answer: "SFINAE ne couvre que la signature. Dans le corps, c'est une erreur de compilation ordinaire."
  - key: vf-erreur
    format: true-false
    question: "Si tous les candidats sont écartés par SFINAE, l'appel est une erreur de compilation."
    truth: true
    answer: "Il ne reste plus aucune fonction à appeler : « no matching function for call »."
  - key: vf-defaut-surcharge
    format: true-false
    question: "Deux templates qui ne diffèrent que par l'argument par défaut d'un paramètre de template sont deux surcharges valides."
    truth: false
    answer: "Les arguments par défaut ne font pas partie de la signature : c'est une redéfinition. On met alors le `enable_if` dans un paramètre non-type."
  - key: vf-void-t
    format: true-false
    question: "`std::void_t<...>` vaut `void` quand toutes les expressions qu'on lui passe sont valides."
    truth: true
    answer: "Sinon la substitution échoue. On s'en sert pour détecter un membre, dans une spécialisation partielle."
  - key: qcm-forme-surchargeable
    format: multiple-choice
    question: "Quelle forme de `enable_if` permet d'écrire deux surcharges aux conditions opposées ?"
    choices:
      - {text: "`template <typename T, std::enable_if_t<Condition, int> = 0>`", correct: true}
      - {text: "`template <typename T, typename = std::enable_if_t<Condition>>`", correct: false}
      - {text: "`template <typename T> requires std::enable_if<Condition>`", correct: false}
      - {text: "`template <std::enable_if<Condition> T>`", correct: false}
    answer: "Le `enable_if` est ici le type d'un paramètre non-type : il fait partie de la signature, donc les deux surcharges diffèrent."
  - key: qcm-condition
    format: multiple-choice
    question: "Quelle condition active un template pour les seuls types entiers ?"
    choices:
      - {text: "`std::enable_if_t<std::is_integral_v<T>>`", correct: true}
      - {text: "`std::enable_if_t<std::integral>`", correct: false}
      - {text: "`std::enable_if_t<T == int>`", correct: false}
      - {text: "`std::enable_if_t<sizeof(T)>`", correct: false}
    answer: "`std::enable_if_t` attend un booléen de compilation. `std::is_integral_v<T>` en est un."
  - key: qcm-void-t
    format: multiple-choice
    question: "À quoi sert `std::void_t` dans une spécialisation partielle ?"
    choices:
      - {text: "À détecter qu'une expression est valide pour un type, comme `x.size()`", correct: true}
      - {text: "À transformer la valeur de retour d'une fonction en `void`", correct: false}
      - {text: "À supprimer un paramètre de template inutilisé", correct: false}
      - {text: "À convertir un pointeur en `void*` sans cast", correct: false}
    answer: "Si l'expression est invalide, la spécialisation est écartée et le template primaire, qui vaut `false`, est choisi."
  - key: qcm-equivalent-cpp20
    format: multiple-choice
    question: "Quel équivalent C++20 remplace `template <typename T, typename = std::enable_if_t<std::is_integral_v<T>>>` ?"
    choices:
      - {text: "`template <std::integral T>`", correct: true}
      - {text: "`template <typename T = int>`", correct: false}
      - {text: "`template <int T>`", correct: false}
      - {text: "`template <typename... T>`", correct: false}
    answer: "Le concept `std::integral` dit la même contrainte, à la place de `typename`."
  - key: code-surcharges
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
      const char* sorte(T) { return "entier"; }

      template <typename T, std::enable_if_t<std::is_floating_point_v<T>, int> = 0>
      const char* sorte(T) { return "flottant"; }

      int main() {
          std::println("{} {} {}", sorte(3), sorte(2.5), sorte('a'));
      }
      ```
    choices:
      - {text: "`entier flottant entier`", correct: true}
      - {text: "`entier flottant flottant`", correct: false}
      - {text: "`entier entier entier`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`entier flottant entier` : pour chaque appel, une seule des deux surcharges survit à la substitution. `char` est un type entier."
    check:
      output: "entier flottant entier"
  - key: code-candidat-ecarte
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      typename T::value_type premier(const T& c) {
          return *c.begin();
      }

      int premier(int x) {
          return x * 10;
      }

      int main() {
          std::println("{} {}", premier(std::vector<int>{4, 5}), premier(7));
      }
      ```
    choices:
      - {text: "`4 70`", correct: true}
      - {text: "`4 7`", correct: false}
      - {text: "`40 70`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`4 70` : pour `premier(7)`, le template est écarté, car `int::value_type` n'existe pas. Ce n'est pas une erreur : la fonction ordinaire est appelée."
    check:
      output: "4 70"
  - key: code-void-t
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <type_traits>
      #include <utility>

      template <typename T, typename = void>
      struct a_une_taille : std::false_type {};

      template <typename T>
      struct a_une_taille<T, std::void_t<decltype(std::declval<T>().size())>> : std::true_type {};

      int main() {
          std::println("{} {}", a_une_taille<std::string>::value, a_une_taille<int>::value);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true false` : pour `int`, l'expression `.size()` est invalide ; la spécialisation est écartée, et le primaire répond `false`."
    check:
      output: "true false"
  - key: code-aucun-candidat
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <type_traits>

      template <typename T, std::enable_if_t<std::is_arithmetic_v<T>, int> = 0>
      T double_de(T x) {
          return x * 2;
      }

      int main() {
          std::println("{}", double_de(std::string{"ab"}));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`abab`", correct: false}
      - {text: "`ab`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : le seul candidat est écarté, car `std::string` n'est pas un type arithmétique. Il ne reste aucune fonction : « no matching function for call »."
    check:
      compiles: false
  - key: bug-redefinition
    format: bug-fix
    question: |-
      Le compilateur répond « redefinition of 'template<class T, class> const char* sorte(T)' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T, typename = std::enable_if_t<std::is_integral_v<T>>>
      const char* sorte(T) { return "entier"; }

      template <typename T, typename = std::enable_if_t<std::is_floating_point_v<T>>>
      const char* sorte(T) { return "flottant"; }

      int main() {
          std::println("{}", sorte(2.5));
      }
      ```
    choices:
      - {text: "Placer chaque condition dans un paramètre non-type : `std::enable_if_t<..., int> = 0`", correct: true}
      - {text: "Renommer le paramètre `T` en `U` dans le second des deux templates du fichier", correct: false}
      - {text: "Déclarer les deux fonctions avec le mot-clé `inline`", correct: false}
      - {text: "Inverser l'ordre des deux templates dans le fichier", correct: false}
    answer: |-
      ```cpp
      template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
      const char* sorte(T) { return "entier"; }

      template <typename T, std::enable_if_t<std::is_floating_point_v<T>, int> = 0>
      const char* sorte(T) { return "flottant"; }
      ```
      Un argument par défaut ne fait pas partie de la signature : les deux templates étaient identiques. Avec le
      `enable_if` comme type d'un paramètre, les signatures diffèrent. En C++20 : deux concepts.
  - key: bug-erreur-dans-le-corps
    format: bug-fix
    question: |-
      Ce code espère que le template sera écarté pour `int`. Le compilateur répond pourtant « request for member
      'size' in 'x', which is of non-class type 'const int' ». Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>
      #include <string>

      template <typename T>
      std::size_t taille(const T& x) {
          return x.size();
      }

      std::size_t taille(long) {
          return 1;
      }

      int main() {
          std::println("{} {}", taille(std::string{"abc"}), taille(7));
      }
      ```
    choices:
      - {text: "Faire dépendre le type de retour de l'expression : `auto taille(const T& x) -> decltype(x.size())`", correct: true}
      - {text: "Déclarer la fonction template avec le mot-clé `inline`, sans changer sa signature", correct: false}
      - {text: "Entourer `return x.size();` d'un bloc `try` suivi d'un `catch (...)`", correct: false}
      - {text: "Déclarer la fonction template avec le mot-clé `noexcept`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      auto taille(const T& x) -> decltype(x.size()) {
          return x.size();
      }
      ```
      Pour `taille(7)`, le template convient mieux que `taille(long)` : il est choisi, puis son corps ne compile
      pas. SFINAE n'agit que sur la signature : en y plaçant `x.size()`, le template est écarté pour `int`.
  - key: bug-condition-inversee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `8`. Le compilateur répond « no matching function for call to
      'double_de(int)' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T, std::enable_if_t<!std::is_integral_v<T>, int> = 0>
      T double_de(T x) {
          return x * 2;
      }

      int main() {
          std::println("{}", double_de(4));
      }
      ```
    choices:
      - {text: "Retirer la négation : `std::enable_if_t<std::is_integral_v<T>, int> = 0`", correct: true}
      - {text: "Remplacer `= 0` par `= 1` à la fin du paramètre", correct: false}
      - {text: "Remplacer `int` par `bool` dans le `enable_if_t`", correct: false}
      - {text: "Appeler la fonction avec `double_de<int, 0>(4)`", correct: false}
    answer: |-
      ```cpp
      template <typename T, std::enable_if_t<std::is_integral_v<T>, int> = 0>
      ```
      La condition, niée, écarte justement les entiers. Le seul candidat disparaît, d'où l'erreur.
  - key: bug-type-oublie
    format: bug-fix
    question: |-
      Le programme devrait afficher `6`. Le compilateur refuse l'affichage : la fonction renvoie un
      `std::enable_if<...>`, que `std::println` ne sait pas formater. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      std::enable_if<std::is_integral_v<T>, T> double_de(T x) {
          return x * 2;
      }

      int main() {
          std::println("{}", double_de(3));
      }
      ```
    choices:
      - {text: "Écrire `std::enable_if_t<std::is_integral_v<T>, T>` comme type de retour", correct: true}
      - {text: "Écrire `std::enable_if_v<std::is_integral_v<T>, T>` comme type de retour", correct: false}
      - {text: "Écrire `std::enable_if<std::is_integral_v<T>, T>::value` comme type de retour", correct: false}
      - {text: "Écrire `std::enable_if<T>` comme type de retour", correct: false}
    answer: |-
      ```cpp
      std::enable_if_t<std::is_integral_v<T>, T> double_de(T x) {
      ```
      `std::enable_if<...>` est une structure ; le type voulu est son membre `type`, que donne l'alias
      `std::enable_if_t`. Sans lui, la fonction renverrait la structure elle-même.
  - key: situation-code-ancien
    format: scenario
    question: |-
      Tu reprends une bibliothèque de 2016 pleine de `typename = std::enable_if_t<...>`. Les messages d'erreur de
      ses utilisateurs font trois écrans. Le projet passe à C++20. Que proposes-tu ?
    choices:
      - {text: "Remplacer peu à peu ces contraintes par des concepts et des clauses `requires`", correct: true}
      - {text: "Supprimer les contraintes, pour que les erreurs soient plus courtes", correct: false}
      - {text: "Remplacer les templates par des macros, que le préprocesseur développe", correct: false}
      - {text: "Garder le code tel quel : les concepts sont plus lents à l'exécution", correct: false}
    answer: |-
      Les concepts disent la même contrainte en clair, et le compilateur répond « constraints not satisfied » à
      l'appel. Ils n'ont aucun coût à l'exécution : tout se joue à la compilation. Sans contrainte, l'erreur
      surgirait au fond de l'implémentation.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Pourquoi `premier(7)` compile-t-il, alors qu'un template `premier` renvoie
      `typename T::value_type`, qui n'existe pas pour `int` ? » Que réponds-tu ?
    choices:
      - {text: "Que la substitution échoue dans la signature : ce candidat est écarté, et une autre surcharge est prise", correct: true}
      - {text: "Que le compilateur remplace `int::value_type` par `int`, faute de mieux", correct: false}
      - {text: "Que l'erreur est seulement remise à l'édition de liens", correct: false}
      - {text: "Que les templates ne sont jamais examinés quand l'argument est un `int`", correct: false}
    answer: |-
      C'est SFINAE. L'appel compile s'il reste un autre candidat viable, ici une fonction `premier(int)`. S'il
      n'en restait aucun, ce serait une erreur.
  - key: situation-if-constexpr
    format: scenario
    question: |-
      Une fonction existe en deux versions `enable_if` : l'une pour les types entiers, l'autre pour tous les
      autres. Elles ne diffèrent que par deux lignes. Quelle simplification proposes-tu en C++17 ?
    choices:
      - {text: "Un seul template, avec `if constexpr (std::is_integral_v<T>)` autour des deux lignes", correct: true}
      - {text: "Un seul template, avec un `if` ordinaire sur `std::is_integral_v<T>`", correct: false}
      - {text: "Deux macros, choisies par `#ifdef` selon le type", correct: false}
      - {text: "Deux fonctions virtuelles, redéfinies pour chaque type", correct: false}
    answer: |-
      `if constexpr` choisit la branche à la compilation, et n'instancie pas l'autre. Un `if` ordinaire compilerait
      les deux branches, y compris celle qui n'a pas de sens pour le type.
  - key: situation-surcharges-ambigues
    format: scenario
    question: |-
      Deux surcharges `enable_if` sont activées, l'une pour les types arithmétiques, l'autre pour les types
      entiers. L'appel avec un `int` est ambigu. Pourquoi, et qu'apportent les concepts ?
    choices:
      - {text: "Les deux conditions sont vraies, et rien ne les classe ; un concept plus contraint serait préféré", correct: true}
      - {text: "La seconde surcharge masque la première ; les concepts inversent cet ordre", correct: false}
      - {text: "Un `int` n'est pas un type arithmétique ; les concepts corrigent ce trait", correct: false}
      - {text: "`enable_if` n'accepte qu'une surcharge par fichier ; les concepts lèvent la limite", correct: false}
    answer: |-
      Avec SFINAE, deux candidats viables sont à égalité : il faut écrire des conditions exclusives. Les concepts
      connaissent la subsomption : si l'un implique l'autre, la surcharge la plus contrainte gagne.
