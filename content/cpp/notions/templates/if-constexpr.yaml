notion: if-constexpr
lesson: |-
  **`if constexpr`** (C++17) est un `if` dont la condition est évaluée **à la compilation**. La branche non
  retenue est **écartée** : dans un template, elle n'est même pas instanciée.

  ```cpp
  #include <type_traits>

  template <typename T>
  auto valeur(T x) {
      if constexpr (std::is_pointer_v<T>) {
          return *x;          // n'existe que si T est un pointeur
      } else {
          return x;
      }
  }

  int n = 5;
  valeur(n);       // renvoie n
  valeur(&n);      // renvoie *(&n)
  ```

  **Pourquoi un `if` ordinaire ne suffit pas.** Avec `if (std::is_pointer_v<T>)`, les **deux** branches sont
  compilées pour chaque type. Pour `T = int`, `*x` n'a pas de sens : erreur, même si la branche ne serait jamais
  exécutée. Avec `if constexpr`, la branche écartée n'est pas instanciée : son code peut être **invalide pour ce
  type**.

  **Les règles.**

  - La condition doit être une **constante de compilation** : un trait de type (`std::is_integral_v<T>`), un
    concept (`std::integral<T>`), `sizeof`, une variable `constexpr`. Jamais une valeur connue seulement à
    l'exécution.
  - La branche écartée doit rester **syntaxiquement correcte** : elle est analysée, mais pas instanciée.
  - Hors d'un template, les deux branches sont vérifiées en entier : l'intérêt est alors seulement de garantir
    qu'aucun test n'a lieu à l'exécution.
  - Les branches peuvent **renvoyer des types différents** quand le type de retour est `auto` : une seule subsiste
    par instanciation.

  **Ce qu'il remplace.** Avant C++17, choisir un comportement selon le type demandait plusieurs surcharges, des
  spécialisations, ou `std::enable_if`. `if constexpr` met tout dans une seule fonction, lisible de haut en bas.

  ```cpp
  template <typename T>
  std::string en_texte(const T& x) {
      if constexpr (std::is_arithmetic_v<T>) {
          return std::to_string(x);
      } else if constexpr (std::is_convertible_v<T, std::string>) {
          return x;
      } else {
          return "?";
      }
  }
  ```

  **La récursion sur un pack.** Il arrête proprement un template variadique :

  ```cpp
  template <typename T, typename... Reste>
  void afficher(const T& premier, const Reste&... reste) {
      std::print("{} ", premier);
      if constexpr (sizeof...(reste) > 0) {
          afficher(reste...);      // pas instancié quand le pack est vide
      }
  }
  ```

  **À ne pas confondre.**

  | | Évalué | Sert à |
  |---|---|---|
  | `if` | à l'exécution | une condition sur des valeurs |
  | `if constexpr` | à la compilation | une condition sur des types ou des constantes |
  | `#if` | par le préprocesseur | une condition sur des macros, sans connaître les types |
  | `if consteval` (C++23) | à la compilation | savoir si l'on est dans une évaluation constante |

  **En entretien** : « `if constexpr` choisit une branche à la compilation, et l'autre n'est pas instanciée : elle
  peut donc contenir du code invalide pour ce type. C'est ce qui remplace les surcharges et `enable_if` pour
  adapter un template au type reçu. La condition doit être une constante. »
cards:
  - key: definition
    format: course
    question: "Que fait `if constexpr` ?"
    choices:
      - {text: "Il évalue sa condition à la compilation, et écarte la branche non retenue", correct: true}
      - {text: "Il évalue sa condition à l'exécution, mais plus vite qu'un `if` ordinaire", correct: false}
      - {text: "Il rend constantes les variables déclarées dans ses deux branches", correct: false}
      - {text: "Il fait exécuter ses deux branches, l'une après l'autre", correct: false}
    answer: "Le choix est fait par le compilateur. Dans un template, la branche écartée n'est pas instanciée."
  - key: difference
    format: course
    question: "Dans un template, pourquoi un `if` ordinaire ne remplace-t-il pas `if constexpr` ?"
    choices:
      - {text: "Ses deux branches sont compilées pour chaque type, même celle qui serait invalide", correct: true}
      - {text: "Sa condition ne peut pas mentionner le paramètre de template `T`", correct: false}
      - {text: "Il est interdit à l'intérieur d'un template de fonction", correct: false}
      - {text: "Il ne peut pas avoir de branche `else`", correct: false}
    answer: "`*x` dans une branche ne compile pas pour `T = int`, même si elle n'est jamais exécutée. `if constexpr` ne l'instancie pas."
  - key: condition
    format: course
    question: "Que doit être la condition d'un `if constexpr` ?"
    choices:
      - {text: "Une expression constante, connue à la compilation", correct: true}
      - {text: "Une variable locale, lue à l'exécution", correct: false}
      - {text: "Le résultat d'une saisie de l'utilisateur", correct: false}
      - {text: "Une macro définie par `#define`, et rien d'autre", correct: false}
    answer: "Un trait de type, un concept, `sizeof`, une variable `constexpr`. Une valeur d'exécution est refusée."
  - key: remplace
    format: course
    question: "Quelles techniques d'avant C++17 `if constexpr` remplace-t-il souvent ?"
    choices:
      - {text: "Les surcharges et spécialisations choisies selon le type, et `std::enable_if`", correct: true}
      - {text: "Les boucles `for` et `while` qui parcourent les conteneurs standard", correct: false}
      - {text: "Les blocs `try` et `catch` placés autour d'un appel qui peut lancer", correct: false}
      - {text: "Les fonctions virtuelles et l'héritage entre classes polymorphes", correct: false}
    answer: "Adapter un template au type reçu tient désormais dans une seule fonction, lue de haut en bas."
  - key: vf-execution
    format: true-false
    question: "La condition d'un `if constexpr` peut dépendre d'une valeur saisie à l'exécution."
    truth: false
    answer: "Elle doit être une constante de compilation."
  - key: vf-syntaxe
    format: true-false
    question: "La branche écartée d'un `if constexpr` peut contenir n'importe quel texte, même syntaxiquement faux."
    truth: false
    answer: "Elle est analysée : sa syntaxe doit être correcte. Elle n'est simplement pas instanciée pour ce type."
  - key: vf-retours
    format: true-false
    question: "Avec un type de retour `auto`, les branches d'un `if constexpr` peuvent renvoyer des types différents."
    truth: true
    answer: "Une seule branche subsiste par instanciation : la déduction ne voit qu'un `return`."
  - key: vf-cpp17
    format: true-false
    question: "`if constexpr` existe depuis C++17."
    truth: true
    answer: "C++23 a ajouté `if consteval`, pour un autre usage."
  - key: qcm-trait
    format: multiple-choice
    question: "Quelle condition teste, à la compilation, que `T` est un type entier ?"
    choices:
      - {text: "`if constexpr (std::is_integral_v<T>)`", correct: true}
      - {text: "`if constexpr (T == int)`", correct: false}
      - {text: "`if constexpr (typeid(T) == typeid(int))`", correct: false}
      - {text: "`if constexpr (T.is_integral())`", correct: false}
    answer: "`std::is_integral_v<T>` est une constante booléenne de `<type_traits>`. Le concept `std::integral<T>` convient aussi."
  - key: qcm-pack
    format: multiple-choice
    question: "Dans un template variadique, quelle condition arrête la récursion quand le pack `reste` est vide ?"
    choices:
      - {text: "`if constexpr (sizeof...(reste) > 0)`", correct: true}
      - {text: "`if constexpr (reste.size() > 0)`", correct: false}
      - {text: "`if constexpr (reste != nullptr)`", correct: false}
      - {text: "`if constexpr (sizeof(reste) > 0)`", correct: false}
    answer: "`sizeof...(pack)` donne le nombre d'éléments du pack, à la compilation."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::is_pointer_v` et `std::is_arithmetic_v` ?"
    choices:
      - {text: "`<type_traits>`", correct: true}
      - {text: "`<typeinfo>`", correct: false}
      - {text: "`<concepts>`", correct: false}
      - {text: "`<utility>`", correct: false}
    answer: "`<type_traits>` déclare les traits de type. `<typeinfo>` sert à `typeid`, à l'exécution."
  - key: qcm-preprocesseur
    format: multiple-choice
    question: "Qu'est-ce qui distingue `if constexpr` de `#if` ?"
    choices:
      - {text: "`if constexpr` connaît les types et les templates ; `#if` ne voit que des macros", correct: true}
      - {text: "`if constexpr` est traité par le préprocesseur ; `#if` par le compilateur", correct: false}
      - {text: "`if constexpr` s'exécute à l'exécution ; `#if` à la compilation", correct: false}
      - {text: "Rien : ce sont deux écritures de la même chose", correct: false}
    answer: "Le préprocesseur passe avant toute analyse du C++ : il ignore ce qu'est `T`. `if constexpr` fait partie du langage."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que le choix se fasse à la compilation :
      ```cpp
      template <typename T>
      auto valeur(T x) {
          if ___ (std::is_pointer_v<T>) {
              return *x;
          } else {
              return x;
          }
      }
      ```
    blanks:
      - [constexpr]
    answer: "`if constexpr` : la branche `*x` n'est instanciée que pour un pointeur."
  - key: trous-trait
    format: fill-in
    question: |-
      Complète le trait qui teste si `T` est un pointeur :
      ```cpp
      if constexpr (std::___<T>) {
          return *x;
      }
      ```
    blanks:
      - [is_pointer_v]
    answer: "`std::is_pointer_v<T>` vaut `true` quand `T` est un type pointeur."
  - key: trous-sizeof
    format: fill-in
    question: |-
      Complète pour compter les éléments du pack :
      ```cpp
      if constexpr (___...(reste) > 0) {
          afficher(reste...);
      }
      ```
    blanks:
      - [sizeof]
    answer: "`sizeof...(reste)` est le nombre d'arguments du pack."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête des traits de type :
      ```cpp
      #include <___>
      ```
    blanks:
      - [type_traits]
    answer: "`<type_traits>`."
  - key: code-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      auto valeur(T x) {
          if constexpr (std::is_pointer_v<T>) {
              return *x;
          } else {
              return x;
          }
      }

      int main() {
          int n = 5;
          std::println("{} {}", valeur(n), valeur(&n) + 1);
      }
      ```
    choices:
      - {text: "`5 6`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`6 6`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5 6` : pour un `int`, la fonction renvoie la valeur ; pour un `int*`, elle déréférence. Chaque instanciation ne garde qu'une branche."
    check:
      output: "5 6"
  - key: code-if-ordinaire
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      int valeur(T x) {
          if (std::is_pointer_v<T>) {
              return *x;
          } else {
              return x;
          }
      }

      int main() {
          std::println("{}", valeur(5));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : avec un `if` ordinaire, la branche `*x` est compilée pour `T = int`, où elle n'a pas de sens. Il faut `if constexpr`."
    check:
      compiles: false
  - key: code-nature
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <type_traits>

      template <typename T>
      const char* nature(const T&) {
          if constexpr (std::is_integral_v<T>) {
              return "entier";
          } else if constexpr (std::is_floating_point_v<T>) {
              return "virgule";
          } else {
              return "autre";
          }
      }

      int main() {
          std::println("{} {} {}", nature(3), nature(2.5), nature(std::string{"a"}));
      }
      ```
    choices:
      - {text: "`entier virgule autre`", correct: true}
      - {text: "`entier entier autre`", correct: false}
      - {text: "`autre autre autre`", correct: false}
      - {text: "`entier virgule virgule`", correct: false}
    answer: "`entier virgule autre` : les conditions s'enchaînent comme des `else if`, mais sont toutes résolues à la compilation."
    check:
      output: "entier virgule autre"
  - key: code-pack
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T, typename... Reste>
      int compter(const T&, const Reste&... reste) {
          if constexpr (sizeof...(reste) > 0) {
              return 1 + compter(reste...);
          } else {
              return 1;
          }
      }

      int main() {
          std::println("{} {}", compter(7), compter(1, 2.5, "trois", 'q'));
      }
      ```
    choices:
      - {text: "`1 4`", correct: true}
      - {text: "`0 3`", correct: false}
      - {text: "`1 3`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`1 4` : chaque appel compte son premier argument, puis s'appelle sur le reste. Quand le pack est vide, l'appel récursif n'est pas instancié."
    check:
      output: "1 4"
  - key: bug-if-ordinaire
    format: bug-fix
    question: |-
      Le compilateur répond « invalid type argument of unary '*' (have 'int') », dans l'instanciation pour `int`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      int lire(T x) {
          if (std::is_pointer_v<T>) {
              return *x;
          }
          return x;
      }

      int main() {
          std::println("{}", lire(5));
      }
      ```
    choices:
      - {text: "Écrire `if constexpr (...)`, avec `return x;` dans un `else`", correct: true}
      - {text: "Écrire `if (std::is_pointer_v<T> == true)`", correct: false}
      - {text: "Écrire `return *&x;` dans la première branche", correct: false}
      - {text: "Déclarer la fonction `inline`", correct: false}
    answer: |-
      ```cpp
      if constexpr (std::is_pointer_v<T>) {
          return *x;
      } else {
          return x;
      }
      ```
      Le `if` ordinaire compile `*x` pour tout type. `if constexpr` écarte la branche ; le `return x;` doit être
      dans le `else`, sinon il serait lui aussi instancié pour un pointeur.
  - key: bug-condition-execution
    format: bug-fix
    question: |-
      Le compilateur répond « 'n' is not a constant expression ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      const char* signe(int n) {
          if constexpr (n < 0) {
              return "négatif";
          } else {
              return "positif ou nul";
          }
      }

      int main() {
          std::println("{}", signe(-3));
      }
      ```
    choices:
      - {text: "Écrire un `if` ordinaire : `if (n < 0)`", correct: true}
      - {text: "Déclarer le paramètre `const int n`", correct: false}
      - {text: "Déclarer la fonction `static`", correct: false}
      - {text: "Écrire `if constexpr (const n < 0)`", correct: false}
    answer: |-
      ```cpp
      if (n < 0) {
      ```
      `n` n'est connu qu'à l'exécution. `if constexpr` est réservé aux conditions de compilation : types,
      constantes. `const` sur un paramètre n'en fait pas une constante de compilation.
  - key: bug-else-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « inconsistent deduction for auto return type: 'int' and then 'int*' », pour l'appel
      avec un pointeur. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      auto valeur(T x) {
          if constexpr (std::is_pointer_v<T>) {
              return *x;
          }
          return x;
      }

      int main() {
          int n = 5;
          std::println("{}", valeur(&n));
      }
      ```
    choices:
      - {text: "Placer `return x;` dans une branche `else`", correct: true}
      - {text: "Écrire `return &x;` à la place de `return x;`", correct: false}
      - {text: "Retirer `constexpr` de la condition", correct: false}
      - {text: "Déclarer `x` avec `const T x`", correct: false}
    answer: |-
      ```cpp
      if constexpr (std::is_pointer_v<T>) {
          return *x;
      } else {
          return x;
      }
      ```
      Hors du `else`, `return x;` est instancié dans tous les cas : pour un pointeur, la fonction a deux `return` de
      types différents. Seul ce qui est dans la branche écartée disparaît.
  - key: bug-recursion-pack
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'afficher()' » : la récursion appelle la fonction
      sans argument. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T, typename... Reste>
      void afficher(const T& premier, const Reste&... reste) {
          std::print("{} ", premier);
          afficher(reste...);
      }

      int main() {
          afficher(1, 2, 3);
          std::println("");
      }
      ```
    choices:
      - {text: "Entourer l'appel récursif de `if constexpr (sizeof...(reste) > 0)`", correct: true}
      - {text: "Entourer l'appel récursif de `if (sizeof...(reste) > 0)`", correct: false}
      - {text: "Entourer l'appel récursif de `try` et `catch (...)`", correct: false}
      - {text: "Écrire `afficher(reste);` sans les points de suspension", correct: false}
    answer: |-
      ```cpp
      if constexpr (sizeof...(reste) > 0) {
          afficher(reste...);
      }
      ```
      Quand le pack est vide, `afficher()` ne correspond à aucune fonction. Un `if` ordinaire compilerait quand même
      l'appel ; `if constexpr` ne l'instancie pas.
