notion: perfect-forwarding
lesson: |-
  Une fonction générique qui **transmet** ses arguments à une autre (une fabrique, un `emplace_back`, un
  décorateur) doit les passer **tels qu'elle les a reçus** : une lvalue reste une lvalue, à copier ; une rvalue
  reste une rvalue, à déplacer. C'est le **transfert parfait** (*perfect forwarding*).

  **Le problème.** Dans une fonction, tout paramètre **nommé est une lvalue**, même s'il est de type `T&&`.

  ```cpp
  void traiter(const std::string& s);    // version qui copie
  void traiter(std::string&& s);         // version qui déplace

  template <typename T>
  void relais(T&& arg) {
      traiter(arg);                      // arg a un nom : toujours la version qui copie
  }
  ```

  **La référence universelle.** `T&&` où `T` est **déduit** n'est pas une référence à une rvalue : elle se lie à
  **tout**. On l'appelle référence universelle, ou de transfert (*forwarding reference*).

  | Argument passé | `T` déduit | Type de `arg` |
  |---|---|---|
  | une lvalue de type `X` | `X&` | `X&` |
  | une rvalue de type `X` | `X` | `X&&` |

  C'est l'**effondrement des références** qui donne le résultat : `X& &&` devient `X&` ; seul `X&& &&` reste `X&&`.

  **`std::forward` restitue la catégorie d'origine.**

  ```cpp
  #include <utility>

  template <typename T>
  void relais(T&& arg) {
      traiter(std::forward<T>(arg));     // lvalue si on a reçu une lvalue, rvalue sinon
  }
  ```

  `std::forward<T>(arg)` est un **cast conditionnel** : il rend une rvalue seulement si `T` n'est pas une
  référence, c'est-à-dire si l'appelant avait passé une rvalue.

  **`std::move` ou `std::forward` ?**

  | | `std::move(x)` | `std::forward<T>(x)` |
  |---|---|---|
  | Résultat | **toujours** une rvalue | une rvalue **seulement si** l'argument en était une |
  | S'emploie sur | une référence à une rvalue, `X&&` | une référence universelle, `T&&` |

  Appliquer `std::move` à une référence universelle **volerait** la lvalue de l'appelant.

  **Avec plusieurs arguments.**

  ```cpp
  template <typename T, typename... Args>
  std::unique_ptr<T> fabriquer(Args&&... args) {
      return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
  }
  ```

  C'est ainsi que sont écrits `std::make_unique` et `emplace_back`.

  **Ce qui n'est pas une référence universelle.**

  - `void f(std::string&& s)` : pas de déduction, c'est une référence à une rvalue.
  - `void f(const T&& x)` : le `const` l'en exclut.
  - `void f(std::vector<T>&& v)` : `T` est déduit, mais la forme n'est pas `T&&`.
  - Dans `template <typename T> class C { void f(T&& x); };`, `T` est fixé par la classe, pas déduit à l'appel.

  `auto&&` suit les mêmes règles que `T&&` : `for (auto&& x : conteneur)` accepte tout.

  **Les précautions.** On ne transmet un argument **qu'une fois** : après `std::forward`, il a peut-être été
  déplacé. Et une surcharge à référence universelle est **gourmande** : elle l'emporte souvent sur les autres, y
  compris sur le constructeur de copie.

  **En entretien** : « `T&&` avec `T` déduit est une référence universelle : elle accepte lvalues et rvalues, et
  `T` retient laquelle. Comme un paramètre nommé est toujours une lvalue, `std::forward<T>` lui rend sa catégorie
  d'origine en le transmettant. `std::move` déplace toujours ; `std::forward`, seulement si l'appelant avait passé
  une rvalue. »
cards:
  - key: definition
    format: course
    question: "Qu'appelle-t-on le transfert parfait (perfect forwarding) ?"
    choices:
      - {text: "Transmettre un argument à une autre fonction en gardant sa nature de lvalue ou de rvalue", correct: true}
      - {text: "Transmettre un argument à une autre fonction en le déplaçant dans tous les cas", correct: false}
      - {text: "Transmettre un argument à une autre fonction en le copiant dans tous les cas", correct: false}
      - {text: "Transmettre un argument à un autre thread sans le synchroniser", correct: false}
    answer: "Une lvalue doit rester copiable par la fonction appelée, une rvalue déplaçable : le relais ne doit rien changer."
  - key: reference-universelle
    format: course
    question: "Dans `template <typename T> void f(T&& x)`, à quoi `x` peut-il se lier ?"
    choices:
      - {text: "À une lvalue comme à une rvalue : c'est une référence universelle", correct: true}
      - {text: "Seulement à une rvalue : c'est une référence à une rvalue", correct: false}
      - {text: "Seulement à une lvalue non constante", correct: false}
      - {text: "Seulement à un objet temporaire constant", correct: false}
    answer: "Quand `T` est déduit, `T&&` accepte tout. Pour une lvalue de type `X`, `T` vaut `X&`, et `x` est un `X&`."
  - key: forward
    format: course
    question: "Que fait `std::forward<T>(x)` sur une référence universelle `x` ?"
    choices:
      - {text: "Il rend une rvalue si l'appelant avait passé une rvalue, une lvalue sinon", correct: true}
      - {text: "Il rend toujours une rvalue, comme `std::move`, quel que soit l'appel", correct: false}
      - {text: "Il copie `x`, puis renvoie cette copie sous forme de rvalue", correct: false}
      - {text: "Il transmet `x` à un autre thread, sans le copier ni le déplacer", correct: false}
    answer: "C'est un cast conditionnel, piloté par `T`. Il restitue la catégorie de valeur de l'argument d'origine."
  - key: parametre-nomme
    format: course
    question: "Pourquoi `traiter(arg)` appelle-t-il la version « lvalue » de `traiter`, même si `arg` est de type `T&&` ?"
    choices:
      - {text: "Un paramètre qui a un nom est une lvalue, quel que soit son type", correct: true}
      - {text: "Une référence à une rvalue est convertie en copie à l'appel", correct: false}
      - {text: "Le compilateur préfère toujours la surcharge déclarée en premier", correct: false}
      - {text: "Un template ne peut pas appeler une surcharge à rvalue", correct: false}
    answer: "Le type et la catégorie de valeur sont deux choses. `arg` se nomme, on peut le réutiliser : c'est une lvalue. Il faut `std::forward` pour lui rendre sa nature."
  - key: vf-string-rvalue
    format: true-false
    question: "Dans `void f(std::string&& s)`, `s` est une référence universelle."
    truth: false
    answer: "Aucun type n'est déduit : c'est une référence à une rvalue, qui refuse les lvalues."
  - key: vf-const
    format: true-false
    question: "Dans `template <typename T> void f(const T&& x)`, `x` est une référence universelle."
    truth: false
    answer: "Seule la forme exacte `T&&` l'est. Avec `const`, c'est une référence à une rvalue constante."
  - key: vf-auto
    format: true-false
    question: "`auto&& x = valeur;` suit les mêmes règles de déduction qu'une référence universelle `T&&`."
    truth: true
    answer: "`auto&&` se lie à une lvalue comme à une rvalue. C'est pourquoi `for (auto&& x : v)` accepte tout."
  - key: vf-move
    format: true-false
    question: "Sur une référence universelle, `std::move` et `std::forward` ont le même effet."
    truth: false
    answer: "`std::move` rend toujours une rvalue : il déplacerait la lvalue que l'appelant comptait garder."
  - key: qcm-effondrement
    format: multiple-choice
    question: "Que devient `X& &&` par effondrement des références ?"
    choices:
      - {text: "`X&`", correct: true}
      - {text: "`X&&`", correct: false}
      - {text: "`X`", correct: false}
      - {text: "`const X&`", correct: false}
    answer: "Dès qu'une référence à une lvalue intervient, le résultat est `X&`. Seul `X&& &&` donne `X&&`."
  - key: qcm-deduction
    format: multiple-choice
    question: "`template <typename T> void f(T&& x);` est appelée avec une variable `int n`. Que vaut `T` ?"
    choices:
      - {text: "`int&`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`int&&`", correct: false}
      - {text: "`const int&`", correct: false}
    answer: "Pour une lvalue, `T` est déduit comme une référence : `int&`. Avec `f(5)`, `T` vaudrait `int`."
  - key: qcm-pack
    format: multiple-choice
    question: "Comment transmets-tu parfaitement le pack `Args&&... args` au constructeur de `T` ?"
    choices:
      - {text: "`T(std::forward<Args>(args)...)`", correct: true}
      - {text: "`T(std::forward<Args...>(args))`", correct: false}
      - {text: "`T(std::move(args)...)`", correct: false}
      - {text: "`T(args...)`", correct: false}
    answer: "Les points de suspension suivent l'expression à répéter : un `std::forward` par argument, chacun avec son type."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::forward` ?"
    choices:
      - {text: "`<utility>`", correct: true}
      - {text: "`<memory>`", correct: false}
      - {text: "`<functional>`", correct: false}
      - {text: "`<algorithm>`", correct: false}
    answer: "`<utility>`, comme `std::move`."
  - key: code-sans-forward
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      void traiter(const int&) { std::print("lvalue "); }
      void traiter(int&&) { std::print("rvalue "); }

      template <typename T>
      void relais(T&& arg) {
          traiter(arg);
      }

      int main() {
          int n = 1;
          relais(n);
          relais(2);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`lvalue lvalue fin`", correct: true}
      - {text: "`lvalue rvalue fin`", correct: false}
      - {text: "`rvalue rvalue fin`", correct: false}
      - {text: "`rvalue lvalue fin`", correct: false}
    answer: "`lvalue lvalue fin` : dans `relais`, `arg` a un nom. Sans `std::forward`, il est toujours transmis comme une lvalue."
    check:
      output: "lvalue lvalue fin"
  - key: code-avec-forward
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      void traiter(const int&) { std::print("lvalue "); }
      void traiter(int&&) { std::print("rvalue "); }

      template <typename T>
      void relais(T&& arg) {
          traiter(std::forward<T>(arg));
      }

      int main() {
          int n = 1;
          relais(n);
          relais(2);
          relais(std::move(n));
          std::println("fin");
      }
      ```
    choices:
      - {text: "`lvalue rvalue rvalue fin`", correct: true}
      - {text: "`lvalue lvalue lvalue fin`", correct: false}
      - {text: "`rvalue rvalue rvalue fin`", correct: false}
      - {text: "`lvalue rvalue lvalue fin`", correct: false}
    answer: "`lvalue rvalue rvalue fin` : `std::forward` rend à chaque argument sa catégorie d'origine. `std::move(n)` est une rvalue."
    check:
      output: "lvalue rvalue rvalue fin"
  - key: code-deduction
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      bool est_reference(T&&) {
          return std::is_lvalue_reference_v<T>;
      }

      int main() {
          int n = 1;
          const int c = 2;
          std::println("{} {} {}", est_reference(n), est_reference(3), est_reference(c));
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false false`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`true false true` : pour une lvalue, `T` est déduit comme une référence (`int&`, `const int&`). Pour la rvalue `3`, `T` vaut `int`."
    check:
      output: "true false true"
  - key: code-copies
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      struct Trace {
          Trace() = default;
          Trace(const Trace&) { ++copies; }
          Trace(Trace&&) noexcept { ++deplacements; }
          static inline int copies = 0;
          static inline int deplacements = 0;
      };

      template <typename T>
      void ranger(std::vector<Trace>& v, T&& element) {
          v.push_back(std::forward<T>(element));
      }

      int main() {
          std::vector<Trace> v;
          v.reserve(2);
          Trace t;
          ranger(v, t);
          ranger(v, Trace{});
          std::println("{} {}", Trace::copies, Trace::deplacements);
      }
      ```
    choices:
      - {text: "`1 1`", correct: true}
      - {text: "`2 0`", correct: false}
      - {text: "`0 2`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: "`1 1` : la lvalue `t` est copiée, l'appelant la garde. Le temporaire est déplacé. C'est le transfert parfait."
    check:
      output: "1 1"
  - key: bug-forward-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 1` : le temporaire devrait être déplacé. Il affiche `1 0` : il est copié.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      struct Trace {
          Trace() = default;
          Trace(const Trace&) { ++copies; }
          Trace(Trace&&) noexcept { ++deplacements; }
          static inline int copies = 0;
          static inline int deplacements = 0;
      };

      template <typename T>
      void ranger(std::vector<Trace>& v, T&& element) {
          v.push_back(element);
      }

      int main() {
          std::vector<Trace> v;
          ranger(v, Trace{});
          std::println("{} {}", Trace::copies, Trace::deplacements);
      }
      ```
    choices:
      - {text: "Écrire `v.push_back(std::forward<T>(element));`", correct: true}
      - {text: "Écrire `v.push_back(&element);`", correct: false}
      - {text: "Écrire `v.push_back(static_cast<T>(element));`", correct: false}
      - {text: "Écrire `v.push_back(std::ref(element));`", correct: false}
    answer: |-
      ```cpp
      v.push_back(std::forward<T>(element));
      ```
      `element` a un nom : c'est une lvalue, donc `push_back` copie. `std::forward<T>` lui rend sa nature de rvalue
      quand l'appelant a passé un temporaire.
  - key: bug-move-sur-universelle
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3` : l'appelant garde son vecteur. Il affiche `0` : le vecteur lui a été volé.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      template <typename T>
      void archiver(std::vector<std::vector<int>>& archives, T&& lot) {
          archives.push_back(std::move(lot));
      }

      int main() {
          std::vector<std::vector<int>> archives;
          std::vector<int> lot{1, 2, 3};
          archiver(archives, lot);
          std::println("{}", lot.size());
      }
      ```
    choices:
      - {text: "Écrire `archives.push_back(std::forward<T>(lot));`", correct: true}
      - {text: "Écrire `archives.push_back(std::move(std::move(lot)));`", correct: false}
      - {text: "Écrire `archives.emplace_back(std::move(lot));`", correct: false}
      - {text: "Déclarer le paramètre `const T&& lot`", correct: false}
    answer: |-
      ```cpp
      archives.push_back(std::forward<T>(lot));
      ```
      `std::move` rend toujours une rvalue : la lvalue de l'appelant est déplacée à son insu. `std::forward` ne
      déplace que ce qui était déjà une rvalue.
  - key: bug-pas-universelle
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind rvalue reference of type 'std::string&&' ... to lvalue of type
      'std::string' ». La fonction devrait accepter une variable comme un temporaire. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>
      #include <vector>

      void ajouter(std::vector<std::string>& v, std::string&& texte) {
          v.push_back(std::move(texte));
      }

      int main() {
          std::vector<std::string> v;
          std::string nom = "Ada";
          ajouter(v, nom);
          ajouter(v, "Alan");
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "En faire un template : `template <typename T> ... T&& texte`, avec `std::forward<T>`", correct: true}
      - {text: "Appeler `ajouter(v, &nom);` avec l'adresse de la variable", correct: false}
      - {text: "Déclarer le paramètre `const std::string&& texte`", correct: false}
      - {text: "Déclarer le paramètre `std::string&&& texte`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      void ajouter(std::vector<std::string>& v, T&& texte) {
          v.push_back(std::forward<T>(texte));
      }
      ```
      `std::string&&` n'est pas une référence universelle : rien n'est déduit, elle refuse les lvalues. Avec `T&&`
      déduit, la variable est copiée et le temporaire déplacé. Un paramètre `std::string` par valeur, puis
      `std::move`, serait plus simple encore.
  - key: bug-double-forward
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3 3`. Il affiche `3 0` : le second vecteur est vide. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      template <typename T>
      void dupliquer(std::vector<std::vector<int>>& sortie, T&& lot) {
          sortie.push_back(std::forward<T>(lot));
          sortie.push_back(std::forward<T>(lot));
      }

      int main() {
          std::vector<std::vector<int>> sortie;
          dupliquer(sortie, std::vector<int>{1, 2, 3});
          std::println("{} {}", sortie[0].size(), sortie[1].size());
      }
      ```
    choices:
      - {text: "Copier la première fois : `sortie.push_back(lot);`, et ne transmettre qu'à la dernière", correct: true}
      - {text: "Transmettre trois fois au lieu de deux, pour compenser", correct: false}
      - {text: "Remplacer les deux `std::forward<T>(lot)` par `std::move(lot)`", correct: false}
      - {text: "Appeler `sortie.reserve(2);` avant les deux ajouts", correct: false}
    answer: |-
      ```cpp
      sortie.push_back(lot);
      sortie.push_back(std::forward<T>(lot));
      ```
      Le premier `std::forward` déplace le temporaire : `lot` est vide au second. Un argument ne se transmet qu'une
      fois, à son dernier usage.
  - key: trous-forward
    format: fill-in
    question: |-
      Complète pour transmettre l'argument tel qu'il a été reçu :
      ```cpp
      template <typename T>
      void relais(T&& arg) {
          traiter(std::___<T>(arg));
      }
      ```
    blanks:
      - [forward]
    answer: "`std::forward<T>` restitue la catégorie de valeur d'origine."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour déclarer une référence universelle :
      ```cpp
      template <typename T>
      void relais(T___ arg);
      ```
    blanks:
      - ["&&"]
    answer: "`T&&`, avec `T` déduit : elle se lie aux lvalues comme aux rvalues."
  - key: trous-type
    format: fill-in
    question: |-
      Complète l'argument de template de `std::forward` :
      ```cpp
      template <typename U>
      void relais(U&& valeur) {
          traiter(std::forward<___>(valeur));
      }
      ```
    blanks:
      - [U]
    answer: "On passe le paramètre de template déduit : c'est lui qui a retenu si l'argument était une lvalue."
  - key: trous-pack
    format: fill-in
    question: |-
      Complète pour transmettre chaque argument du pack :
      ```cpp
      template <typename T, typename... Args>
      T construire(Args&&... args) {
          return T(std::forward<Args>(args)___);
      }
      ```
    blanks:
      - ["..."]
    answer: "Les points de suspension développent le pack : un `std::forward` par argument."
  - key: situation-fabrique
    format: scenario
    question: |-
      Tu écris `creer<T>(args...)`, qui construit un objet `T` à partir d'arguments quelconques. Avec des paramètres
      `const Args&...`, les objets temporaires passés sont copiés au lieu d'être déplacés. Que proposes-tu ?
    choices:
      - {text: "Des paramètres `Args&&...`, transmis avec `std::forward<Args>(args)...`", correct: true}
      - {text: "Des paramètres `Args...` par valeur, transmis tels quels", correct: false}
      - {text: "Des paramètres `Args&...`, transmis avec `std::move(args)...`", correct: false}
      - {text: "Des paramètres `const Args&&...`, transmis tels quels", correct: false}
    answer: |-
      Une référence constante fait perdre la nature de rvalue : le constructeur ne peut plus déplacer. Les
      références universelles et `std::forward` gardent chaque argument tel que l'appelant l'a passé. C'est ainsi
      qu'est écrit `std::make_unique`.
  - key: situation-constructeur-gourmand
    format: scenario
    question: |-
      Une classe a le constructeur `template <typename T> Personne(T&& nom)`. Copier une `Personne` non constante,
      `Personne b{a};`, ne compile plus : le template est choisi à la place du constructeur de copie. Pourquoi ?
    choices:
      - {text: "Pour une lvalue non constante, `T&&` correspond exactement ; la copie demande d'ajouter `const`", correct: true}
      - {text: "Un constructeur template supprime toujours le constructeur de copie de la classe", correct: false}
      - {text: "Le compilateur préfère toujours un template à une fonction ordinaire", correct: false}
      - {text: "Une référence universelle ne peut pas se lier à un objet de la classe elle-même", correct: false}
    answer: |-
      Une référence universelle est gourmande : instanciée avec `T = Personne&`, elle est une meilleure
      correspondance que `const Personne&`. On la contraint par un concept, pour l'écarter quand l'argument est une
      `Personne`.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, tu lis `template <typename T> void envoyer(T&& message) { file.push(std::move(message)); }`.
      Les appelants passent parfois une variable qu'ils réutilisent ensuite. Que dis-tu ?
    choices:
      - {text: "Qu'il faut `std::forward<T>` : `std::move` vide la variable de l'appelant", correct: true}
      - {text: "Que c'est correct : `std::move` ne déplace que les objets temporaires", correct: false}
      - {text: "Qu'il faut retirer le `std::move` : le déplacement est automatique", correct: false}
      - {text: "Qu'il faut `std::ref(message)` pour garder la variable de l'appelant", correct: false}
    answer: |-
      Sur une référence universelle, `std::move` déplace sans condition, même une lvalue que l'appelant croit
      garder. `std::forward` ne déplace que ce qui a été passé comme rvalue.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Dans `void f(Widget&& w)`, `w` est-il une lvalue ou une rvalue ? » Que
      réponds-tu ?
    choices:
      - {text: "Une lvalue : il a un nom. Son type est une référence à une rvalue, mais l'expression `w` est une lvalue", correct: true}
      - {text: "Une rvalue : son type est `Widget&&`, donc toute expression qui le nomme est une rvalue", correct: false}
      - {text: "Ni l'une ni l'autre : une référence n'a pas de catégorie de valeur", correct: false}
      - {text: "Cela dépend de l'argument que l'appelant a passé à la fonction", correct: false}
    answer: |-
      Le type d'une variable et la catégorie de l'expression qui la nomme sont distincts. Pour transmettre `w`
      comme une rvalue, il faut écrire `std::move(w)` ; pour une référence universelle, `std::forward<T>(w)`.
