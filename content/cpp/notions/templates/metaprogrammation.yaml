notion: metaprogrammation
lesson: |-
  La **métaprogrammation** consiste à faire faire des calculs **au compilateur** : le résultat est inscrit dans le
  programme, et ne coûte plus rien à l'exécution. C++ offre trois générations d'outils.

  **1. Les templates récursifs (C++98).** Une valeur est calculée par une cascade d'instanciations, arrêtée par
  une spécialisation.

  ```cpp
  template <int N>
  struct Factorielle {
      static constexpr int valeur = N * Factorielle<N - 1>::valeur;
  };

  template <>
  struct Factorielle<0> {
      static constexpr int valeur = 1;
  };

  Factorielle<5>::valeur     // 120, calculé à la compilation
  ```

  Sans la spécialisation pour 0, les instanciations ne s'arrêtent pas : « template instantiation depth exceeds
  maximum ». C'est puissant, mais illisible et lent à compiler.

  **2. `constexpr` (C++11, très élargi depuis).** Une fonction `constexpr` est une fonction ordinaire, que le
  compilateur **peut** évaluer à la compilation si ses arguments sont constants.

  ```cpp
  constexpr int factorielle(int n) {
      return n <= 1 ? 1 : n * factorielle(n - 1);
  }

  constexpr int a = factorielle(5);      // à la compilation
  int b = factorielle(n);                // à l'exécution, si n n'est pas constant
  ```

  Boucles, variables locales, `if`, et depuis C++20 `std::vector` et `std::string` y sont permis. C'est aujourd'hui
  la façon normale de calculer à la compilation.

  **3. `consteval` et `constinit` (C++20).**

  | Mot-clé | Sens |
  |---|---|
  | `constexpr` (fonction) | évaluable à la compilation, **ou** à l'exécution |
  | `consteval` (fonction) | **toujours** évaluée à la compilation : une *fonction immédiate* |
  | `constexpr` (variable) | constante, initialisée à la compilation |
  | `constinit` (variable) | initialisée à la compilation, mais **modifiable** ensuite |

  **Obliger le compilateur à calculer.** Une fonction `constexpr` n'est évaluée à la compilation que si le contexte
  l'exige : l'initialisation d'une variable `constexpr`, un argument de template, la taille d'un tableau, un
  `static_assert`. `std::is_constant_evaluated()` dit, dans la fonction, dans quel cas on se trouve.

  **Vérifier à la compilation.** `static_assert(condition, "message")` arrête la compilation si la condition est
  fausse. Associé aux traits de type et aux fonctions `constexpr`, il transforme une erreur d'exécution en erreur
  de compilation.

  **Choisir du code selon un type.** `if constexpr`, les concepts et les traits remplacent la plupart des anciens
  usages des templates récursifs.

  **Pourquoi s'en servir.** Des tables précalculées, des vérifications sans coût, des erreurs détectées plus tôt.
  **Avec mesure** : tout calcul fait à la compilation allonge celle-ci, et un comportement indéfini rencontré dans
  une évaluation constante est une erreur de compilation.

  **En entretien** : « Aujourd'hui, calculer à la compilation, c'est écrire une fonction `constexpr`, et
  `consteval` quand elle ne doit jamais s'exécuter à l'exécution. Les templates récursifs étaient la technique
  d'avant. Je vérifie avec `static_assert`, et je choisis les branches avec `if constexpr`. »
cards:
  - key: definition
    format: course
    question: "Qu'appelle-t-on métaprogrammation en C++ ?"
    choices:
      - {text: "Faire exécuter des calculs par le compilateur, dont le résultat est inscrit dans le programme", correct: true}
      - {text: "Faire modifier son propre code par le programme, pendant qu'il s'exécute", correct: false}
      - {text: "Faire générer du code C++ par un script, avant la compilation", correct: false}
      - {text: "Faire exécuter le programme par un interpréteur, sans le compiler", correct: false}
    answer: "Le calcul a lieu une fois, à la compilation. À l'exécution, la valeur est déjà là."
  - key: constexpr-ou-consteval
    format: course
    question: "Pour une fonction, qu'est-ce qui distingue `consteval` de `constexpr` ?"
    choices:
      - {text: "`consteval` impose l'évaluation à la compilation ; `constexpr` la permet seulement", correct: true}
      - {text: "`consteval` permet l'évaluation à la compilation ; `constexpr` l'impose toujours", correct: false}
      - {text: "`consteval` renvoie une valeur modifiable ; `constexpr` renvoie une constante", correct: false}
      - {text: "`consteval` vaut pour les variables seulement ; `constexpr` pour les fonctions", correct: false}
    answer: "Une fonction `consteval` est une fonction immédiate : l'appeler avec un argument non constant est une erreur de compilation."
  - key: recursion-template
    format: course
    question: "Qu'est-ce qui arrête la récursion de `Factorielle<N>`, définie par `N * Factorielle<N - 1>::valeur` ?"
    choices:
      - {text: "Une spécialisation totale pour `Factorielle<0>`", correct: true}
      - {text: "Un `if (N == 0)` dans le corps du template", correct: false}
      - {text: "Un `return` placé avant la multiplication", correct: false}
      - {text: "Le compilateur, qui s'arrête de lui-même à zéro", correct: false}
    answer: "Chaque instanciation en demande une autre. La spécialisation fournit le cas de base, sans nouvelle instanciation."
  - key: quand-evalue
    format: course
    question: "Quand une fonction `constexpr` est-elle forcément évaluée à la compilation ?"
    choices:
      - {text: "Quand son résultat sert là où une constante est exigée, comme une variable `constexpr`", correct: true}
      - {text: "À chaque appel, quels que soient ses arguments", correct: false}
      - {text: "Quand le programme est compilé avec l'optimisation `-O2`, et dans ce cas seulement", correct: false}
      - {text: "Quand elle est déclarée dans un fichier d'en-tête", correct: false}
    answer: "Initialiser une variable `constexpr`, donner un argument de template, écrire un `static_assert` : dans ces contextes, le compilateur doit calculer. Ailleurs, il peut laisser l'appel à l'exécution."
  - key: vf-constexpr-execution
    format: true-false
    question: "Une fonction `constexpr` peut être appelée avec des arguments connus seulement à l'exécution."
    truth: true
    answer: "Elle se comporte alors comme une fonction ordinaire. C'est `consteval` qui l'interdit."
  - key: vf-static-assert
    format: true-false
    question: "`static_assert` est vérifié pendant l'exécution du programme."
    truth: false
    answer: "Il est vérifié à la compilation, et ne produit aucun code. Sa condition doit être une expression constante."
  - key: vf-constinit
    format: true-false
    question: "Une variable `constinit` ne peut plus être modifiée après son initialisation."
    truth: false
    answer: "`constinit` garantit une initialisation à la compilation, pas la constance. La variable reste modifiable."
  - key: vf-ub
    format: true-false
    question: "Un comportement indéfini rencontré pendant une évaluation constante est une erreur de compilation."
    truth: true
    answer: "Un débordement d'entier signé ou un accès hors bornes dans un calcul `constexpr` est refusé par le compilateur."
  - key: qcm-fonction-immediate
    format: multiple-choice
    question: "Quel mot-clé garantit qu'une fonction n'est jamais appelée à l'exécution ?"
    choices:
      - {text: "`consteval`", correct: true}
      - {text: "`constexpr`", correct: false}
      - {text: "`constinit`", correct: false}
      - {text: "`inline`", correct: false}
    answer: "Une fonction `consteval` doit produire une constante à chaque appel."
  - key: qcm-contexte
    format: multiple-choice
    question: "Quelle fonction dit, dans une fonction `constexpr`, si elle est évaluée à la compilation ?"
    choices:
      - {text: "`std::is_constant_evaluated()`", correct: true}
      - {text: "`std::is_constexpr()`", correct: false}
      - {text: "`std::at_compile_time()`", correct: false}
      - {text: "`std::is_const_v<T>`", correct: false}
    answer: "`std::is_constant_evaluated()` (C++20). C++23 ajoute la forme `if consteval { ... }`."
  - key: qcm-moderne
    format: multiple-choice
    question: "Comment calcule-t-on aujourd'hui une factorielle à la compilation ?"
    choices:
      - {text: "Par une fonction `constexpr`, avec une boucle ou une récursion", correct: true}
      - {text: "Par une macro récursive du préprocesseur", correct: false}
      - {text: "Par un template récursif, seule technique permise", correct: false}
      - {text: "Par une fonction `virtual`, redéfinie pour chaque valeur", correct: false}
    answer: "Une fonction `constexpr` se lit comme du code ordinaire, et sert aussi à l'exécution. Les templates récursifs appartiennent au passé."
  - key: qcm-verifier
    format: multiple-choice
    question: "Quelle ligne arrête la compilation si un `int` ne fait pas quatre octets ?"
    choices:
      - {text: "`static_assert(sizeof(int) == 4);`", correct: true}
      - {text: "`assert(sizeof(int) == 4);`", correct: false}
      - {text: "`if (sizeof(int) != 4) throw 1;`", correct: false}
      - {text: "`#if sizeof(int) != 4`", correct: false}
    answer: "`static_assert` est évalué par le compilateur. `assert` ne l'est qu'à l'exécution, et le préprocesseur ne connaît pas `sizeof`."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que la fonction soit utilisable à la compilation comme à l'exécution :
      ```cpp
      ___ int carre(int n) {
          return n * n;
      }
      ```
    blanks:
      - [constexpr]
    answer: "`constexpr` : évaluée à la compilation quand le contexte l'exige et que les arguments sont constants."
  - key: trous-consteval
    format: fill-in
    question: |-
      Complète pour que la fonction soit toujours évaluée à la compilation :
      ```cpp
      ___ int cube(int n) {
          return n * n * n;
      }
      ```
    blanks:
      - [consteval]
    answer: "`consteval` fait de la fonction une fonction immédiate."
  - key: trous-static-assert
    format: fill-in
    question: |-
      Complète pour vérifier le calcul à la compilation :
      ```cpp
      constexpr int carre(int n) { return n * n; }

      ___(carre(4) == 16);
      ```
    blanks:
      - [static_assert]
    answer: "`static_assert` arrête la compilation si la condition est fausse."
  - key: trous-specialisation
    format: fill-in
    question: |-
      Complète le cas de base de la récursion :
      ```cpp
      template <int N>
      struct Somme {
          static constexpr int valeur = N + Somme<N - 1>::valeur;
      };

      template <>
      struct Somme<___> {
          static constexpr int valeur = 0;
      };
      ```
    blanks:
      - ["0"]
    answer: "La spécialisation pour 0 arrête la cascade d'instanciations."
  - key: code-template-recursif
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <int N>
      struct Factorielle {
          static constexpr int valeur = N * Factorielle<N - 1>::valeur;
      };

      template <>
      struct Factorielle<0> {
          static constexpr int valeur = 1;
      };

      int main() {
          static_assert(Factorielle<4>::valeur == 24);
          std::println("{}", Factorielle<5>::valeur);
      }
      ```
    choices:
      - {text: "`120`", correct: true}
      - {text: "`24`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`120` : cinq instanciations en cascade, jusqu'à la spécialisation pour 0. Le programme ne fait qu'afficher une constante."
    check:
      output: "120"
  - key: code-constexpr-tableau
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      constexpr int carre(int n) {
          return n * n;
      }

      int main() {
          std::array<int, carre(3)> grille{};
          int cote = 4;
          std::println("{} {}", grille.size(), carre(cote));
      }
      ```
    choices:
      - {text: "`9 16`", correct: true}
      - {text: "`3 16`", correct: false}
      - {text: "`9 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9 16` : `carre(3)` sert de taille de tableau, donc est calculé à la compilation. `carre(cote)` est un appel ordinaire, à l'exécution."
    check:
      output: "9 16"
  - key: code-consteval
    format: code-output
    question: |-
      ```cpp
      #include <print>

      consteval int cube(int n) {
          return n * n * n;
      }

      int main() {
          constexpr int cote = 3;
          std::println("{} {}", cube(2), cube(cote));
      }
      ```
    choices:
      - {text: "`8 27`", correct: true}
      - {text: "`8 9`", correct: false}
      - {text: "`6 9`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`8 27` : les deux arguments sont des constantes, un littéral et une variable `constexpr`. Les deux appels sont résolus à la compilation."
    check:
      output: "8 27"
  - key: code-is-constant-evaluated
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      constexpr int origine() {
          return std::is_constant_evaluated() ? 1 : 2;
      }

      int main() {
          constexpr int a = origine();
          int b = origine();
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`1 2` : l'initialisation d'une variable `constexpr` exige une évaluation à la compilation. Celle d'un `int` local ordinaire, non."
    check:
      output: "1 2"
  - key: bug-cas-de-base
    format: bug-fix
    question: |-
      Le compilateur répond « template instantiation depth exceeds maximum of 900 ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      template <int N>
      struct Somme {
          static constexpr int valeur = N + Somme<N - 1>::valeur;
      };

      int main() {
          std::println("{}", Somme<4>::valeur);
      }
      ```
    choices:
      - {text: "Ajouter la spécialisation `template <> struct Somme<0>`, dont `valeur` vaut 0", correct: true}
      - {text: "Ajouter l'option `-ftemplate-depth=100000` à la commande de compilation", correct: false}
      - {text: "Ajouter `if (N == 0) return 0;` dans le corps de la structure", correct: false}
      - {text: "Ajouter `inline` devant la déclaration de `valeur`", correct: false}
    answer: |-
      ```cpp
      template <>
      struct Somme<0> {
          static constexpr int valeur = 0;
      };
      ```
      Sans cas de base, `Somme<0>` demande `Somme<-1>`, et ainsi de suite sans fin. Augmenter la profondeur permise
      ne ferait que retarder l'erreur.
  - key: bug-consteval-variable
    format: bug-fix
    question: |-
      Le compilateur répond « call to consteval function 'cube(cote)' is not a constant expression ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      consteval int cube(int n) {
          return n * n * n;
      }

      int main() {
          int cote = 3;
          std::println("{}", cube(cote));
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int cote = 3;`", correct: true}
      - {text: "Déclarer `static int cote = 3;`", correct: false}
      - {text: "Déclarer `volatile int cote = 3;`", correct: false}
      - {text: "Déclarer `unsigned cote = 3;`", correct: false}
    answer: |-
      ```cpp
      constexpr int cote = 3;
      ```
      Une fonction `consteval` n'accepte que des arguments constants. Si `cote` doit rester une variable, c'est la
      fonction qu'on déclare `constexpr`.
  - key: bug-static-assert-variable
    format: bug-fix
    question: |-
      Le compilateur répond « non-constant condition for static assertion ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int taille = 8;
          static_assert(taille % 4 == 0);
          std::println("{}", taille);
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int taille = 8;`", correct: true}
      - {text: "Déclarer `static int taille = 8;`", correct: false}
      - {text: "Écrire `static_assert(&taille % 4 == 0);`", correct: false}
      - {text: "Écrire `static_assert(taille % 4 == 0, taille);`", correct: false}
    answer: |-
      ```cpp
      constexpr int taille = 8;
      ```
      `static_assert` est évalué par le compilateur : sa condition ne peut porter que sur des constantes. Pour une
      valeur d'exécution, on prend `assert`, ou un test ordinaire.
  - key: bug-appel-non-constexpr
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation de `resultat` : « 'constexpr int double_base()' called in a constant
      expression », puis « call to non-'constexpr' function 'int base()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int base() {
          return 4;
      }

      constexpr int double_base() {
          return 2 * base();
      }

      int main() {
          constexpr int resultat = double_base();
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int base()`", correct: true}
      - {text: "Déclarer `static int base()`", correct: false}
      - {text: "Déclarer `inline int base()`", correct: false}
      - {text: "Déclarer `const int base()`", correct: false}
    answer: |-
      ```cpp
      constexpr int base() {
          return 4;
      }
      ```
      Une évaluation à la compilation ne peut appeler que des fonctions `constexpr`. Toute la chaîne d'appels doit
      l'être.
