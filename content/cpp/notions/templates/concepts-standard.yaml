notion: concepts-standard
lesson: |-
  On écrit rarement ses concepts de zéro : la bibliothèque standard (C++20) en fournit une cinquantaine, dans
  l'en-tête `<concepts>`, et d'autres dans `<iterator>` et `<ranges>`. Ils servent à contraindre un template en une
  ligne lisible.

  ```cpp
  #include <concepts>

  template <std::integral T>
  T pgcd(T a, T b);

  void afficher(std::floating_point auto x);
  ```

  **Les concepts de types.**

  | Concept | Vrai pour |
  |---|---|
  | `std::integral<T>` | les entiers, `bool` et `char` compris |
  | `std::signed_integral<T>`, `std::unsigned_integral<T>` | les entiers signés, non signés |
  | `std::floating_point<T>` | `float`, `double`, `long double` |
  | `std::same_as<T, U>` | deux types identiques |
  | `std::convertible_to<T, U>` | `T` se convertit implicitement en `U` |
  | `std::derived_from<T, Base>` | `T` dérive publiquement de `Base`, ou est `Base` |

  **Les concepts d'opérations.**

  | Concept | Ce que le type sait faire |
  |---|---|
  | `std::equality_comparable<T>` | `==` et `!=` |
  | `std::totally_ordered<T>` | `<`, `>`, `<=`, `>=`, en plus de l'égalité |
  | `std::default_initializable<T>` | se construire sans argument |
  | `std::copyable<T>`, `std::movable<T>` | se copier, se déplacer |
  | `std::regular<T>` | se comporter comme une valeur : copiable, constructible par défaut, comparable par `==` |
  | `std::invocable<F, Args...>` | être appelé avec ces arguments |
  | `std::predicate<F, Args...>` | être appelé, et rendre un booléen |

  **Les concepts d'intervalles**, dans `<ranges>` : `std::ranges::range<R>` (a un `begin` et un `end`),
  `std::ranges::sized_range<R>` (a une taille), `std::ranges::random_access_range<R>` (accès direct),
  `std::ranges::contiguous_range<R>` (mémoire contiguë). Ceux d'itérateurs, dans `<iterator>` :
  `std::input_iterator`, `std::forward_iterator`, `std::random_access_iterator`.

  **Quatre façons de les écrire.**

  ```cpp
  template <std::integral T> T f(T x);                              // à la place de typename
  template <typename T> requires std::integral<T> T f(T x);         // clause requires
  auto f(std::integral auto x);                                     // template abrégé
  template <typename T> T f(T x) requires std::integral<T>;         // clause finale
  ```

  Dans la première et la troisième forme, le type contraint est passé en **premier argument** du concept, sans
  qu'on l'écrive : `std::convertible_to<int> auto x` signifie `std::convertible_to<decltype(x), int>`.

  **Les combiner.** Avec `&&` et `||` dans une clause `requires` :
  `requires std::integral<T> || std::floating_point<T>`.

  **Ce qu'on y gagne.** Un message d'erreur à l'appel (« constraints not satisfied »), au lieu d'une erreur au fond
  de l'implémentation ; et la surcharge par concept : la fonction la plus contrainte est préférée.

  **En entretien** : « Je contrains mes templates avec les concepts de `<concepts>` : `std::integral`,
  `std::floating_point`, `std::same_as`, `std::convertible_to`, `std::invocable`, et ceux de `<ranges>` pour les
  conteneurs. Ils documentent l'interface, raccourcissent les erreurs et permettent de surcharger. »
cards:
  - key: en-tete
    format: course
    question: "Où trouve-t-on les concepts généraux de la bibliothèque standard, comme `std::integral` ?"
    choices:
      - {text: "Dans l'en-tête `<concepts>`", correct: true}
      - {text: "Dans l'en-tête `<type_traits>`", correct: false}
      - {text: "Dans l'en-tête `<requires>`", correct: false}
      - {text: "Dans l'en-tête `<templates>`", correct: false}
    answer: "`<concepts>` (C++20). `<type_traits>` contient les traits, comme `std::is_integral`, sur lesquels ces concepts s'appuient."
  - key: integral
    format: course
    question: "Quels types satisfont `std::integral` ?"
    choices:
      - {text: "Les types entiers, `bool` et les types caractères compris", correct: true}
      - {text: "Les types entiers signés, sans `bool` ni les caractères", correct: false}
      - {text: "Tous les types arithmétiques, nombres à virgule compris", correct: false}
      - {text: "Tous les types qui se convertissent implicitement en `int`", correct: false}
    answer: "`std::integral<T>` reprend `std::is_integral_v<T>` : `int`, `long`, `char`, `bool`... `double` ne le satisfait pas, bien qu'il se convertisse en `int`."
  - key: premier-argument
    format: course
    question: "Que signifie `std::convertible_to<int> auto x` dans une liste de paramètres ?"
    choices:
      - {text: "Que le type de `x` doit se convertir en `int`", correct: true}
      - {text: "Que `int` doit se convertir dans le type de `x`", correct: false}
      - {text: "Que `x` est converti en `int` avant l'appel", correct: false}
      - {text: "Que `x` est exactement de type `int`", correct: false}
    answer: "Le type contraint est glissé en premier argument du concept : `std::convertible_to<decltype(x), int>`."
  - key: avantage
    format: course
    question: "Quel avantage un concept standard apporte-t-il par rapport à un `typename` sans contrainte ?"
    choices:
      - {text: "Un mauvais type est refusé à l'appel, avec un message qui nomme l'exigence", correct: true}
      - {text: "Le code généré pour le template s'exécute plus vite", correct: false}
      - {text: "Le template peut être défini dans un fichier `.cpp`", correct: false}
      - {text: "Le template accepte des types inconnus à la compilation", correct: false}
    answer: "Sans contrainte, l'erreur surgit dans le corps du template. Avec un concept : « constraints not satisfied », sur la ligne de l'appel."
  - key: vf-double-integral
    format: true-false
    question: "`double` satisfait `std::integral`."
    truth: false
    answer: "`double` satisfait `std::floating_point`. `std::integral` ne retient que les types entiers."
  - key: vf-bool-integral
    format: true-false
    question: "`bool` satisfait `std::integral`."
    truth: true
    answer: "`bool` est un type entier pour le langage. Pour l'exclure, on ajoute `&& !std::same_as<T, bool>`."
  - key: vf-derived-from-soi
    format: true-false
    question: "`std::derived_from<Forme, Forme>` est vrai."
    truth: true
    answer: "Une classe est considérée comme dérivée d'elle-même. L'héritage doit par ailleurs être public."
  - key: vf-same-as-convertible
    format: true-false
    question: "`std::same_as<int, long>` est vrai, puisque `int` se convertit en `long`."
    truth: false
    answer: "`std::same_as` exige le même type exactement. La conversion, c'est `std::convertible_to<int, long>`."
  - key: qcm-flottant
    format: multiple-choice
    question: "Quel concept n'accepte que `float`, `double` et `long double` ?"
    choices:
      - {text: "`std::floating_point`", correct: true}
      - {text: "`std::integral`", correct: false}
      - {text: "`std::regular`", correct: false}
      - {text: "`std::totally_ordered`", correct: false}
    answer: "`std::floating_point<T>` reprend `std::is_floating_point_v<T>`."
  - key: qcm-ordre
    format: multiple-choice
    question: "Quel concept exige que le type se compare avec `<`, `>`, `<=`, `>=` et `==` ?"
    choices:
      - {text: "`std::totally_ordered`", correct: true}
      - {text: "`std::equality_comparable`", correct: false}
      - {text: "`std::copyable`", correct: false}
      - {text: "`std::invocable`", correct: false}
    answer: "`std::totally_ordered` inclut `std::equality_comparable`, et y ajoute les quatre comparaisons d'ordre."
  - key: qcm-appelable
    format: multiple-choice
    question: "Quel concept exige qu'un paramètre `F` puisse être appelé avec un `int` ?"
    choices:
      - {text: "`std::invocable<F, int>`", correct: true}
      - {text: "`std::convertible_to<F, int>`", correct: false}
      - {text: "`std::same_as<F, int>`", correct: false}
      - {text: "`std::derived_from<F, int>`", correct: false}
    answer: "`std::invocable<F, Args...>` : `F` s'appelle avec ces arguments. `std::predicate` exige en plus un résultat booléen."
  - key: qcm-range
    format: multiple-choice
    question: "Quel concept accepte tout ce qui se parcourt de `begin` à `end` ?"
    choices:
      - {text: "`std::ranges::range`", correct: true}
      - {text: "`std::regular`", correct: false}
      - {text: "`std::integral`", correct: false}
      - {text: "`std::movable`", correct: false}
    answer: "`std::ranges::range<R>`, dans `<ranges>` : vecteurs, listes, tableaux, vues. Des concepts plus précis existent : `sized_range`, `random_access_range`."
  - key: trous-integral
    format: fill-in
    question: |-
      Complète pour n'accepter que les types entiers :
      ```cpp
      template <std::___ T>
      T pgcd(T a, T b);
      ```
    blanks:
      - [integral]
    answer: "`std::integral` remplace `typename`, et contraint `T`."
  - key: trous-requires
    format: fill-in
    question: |-
      Complète la clause qui contraint `T` :
      ```cpp
      template <typename T>
          ___ std::floating_point<T>
      T moitie(T x) {
          return x / 2;
      }
      ```
    blanks:
      - [requires]
    answer: "Une clause `requires` suit la liste des paramètres du template."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour écrire un template abrégé contraint :
      ```cpp
      void afficher(std::integral ___ valeur) {
          std::println("{}", valeur);
      }
      ```
    blanks:
      - [auto]
    answer: "`std::integral auto valeur` : un paramètre de template implicite, contraint par le concept."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête qui déclare `std::integral` et `std::same_as` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [concepts]
    answer: "`<concepts>`, depuis C++20."
  - key: code-concepts-types
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>

      int main() {
          std::println("{} {} {} {}",
                       std::integral<int>,
                       std::integral<double>,
                       std::integral<bool>,
                       std::floating_point<float>);
      }
      ```
    choices:
      - {text: "`true false true true`", correct: true}
      - {text: "`true false false true`", correct: false}
      - {text: "`true true true true`", correct: false}
      - {text: "`true false true false`", correct: false}
    answer: "`true false true true` : un concept s'évalue comme un booléen de compilation. `bool` est un type entier ; `double` ne l'est pas."
    check:
      output: "true false true true"
  - key: code-surcharge
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>

      const char* sorte(std::integral auto) { return "entier"; }
      const char* sorte(std::floating_point auto) { return "flottant"; }
      const char* sorte(auto) { return "autre"; }

      int main() {
          std::println("{} {} {} {}", sorte(3), sorte(2.5), sorte('a'), sorte("texte"));
      }
      ```
    choices:
      - {text: "`entier flottant entier autre`", correct: true}
      - {text: "`entier flottant autre autre`", correct: false}
      - {text: "`autre autre autre autre`", correct: false}
      - {text: "`entier entier entier autre`", correct: false}
    answer: "`entier flottant entier autre` : la surcharge contrainte est préférée à celle qui ne l'est pas. `char` est un type entier ; un littéral de chaîne ne satisfait aucun des deux concepts."
    check:
      output: "entier flottant entier autre"
  - key: code-same-convertible
    format: code-output
    question: |-
      ```cpp
      #include <concepts>
      #include <print>

      struct Forme {};
      struct Cercle : Forme {};

      int main() {
          std::println("{} {} {} {}",
                       std::same_as<int, long>,
                       std::convertible_to<int, long>,
                       std::derived_from<Cercle, Forme>,
                       std::derived_from<Forme, Cercle>);
      }
      ```
    choices:
      - {text: "`false true true false`", correct: true}
      - {text: "`true true true false`", correct: false}
      - {text: "`false true true true`", correct: false}
      - {text: "`false false true false`", correct: false}
    answer: "`false true true false` : `int` et `long` sont deux types, convertibles l'un en l'autre. `Cercle` dérive de `Forme`, pas l'inverse."
    check:
      output: "false true true false"
  - key: code-ranges
    format: code-output
    question: |-
      ```cpp
      #include <list>
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          std::println("{} {} {} {}",
                       std::ranges::range<std::vector<int>>,
                       std::ranges::range<int>,
                       std::ranges::random_access_range<std::vector<int>>,
                       std::ranges::random_access_range<std::list<int>>);
      }
      ```
    choices:
      - {text: "`true false true false`", correct: true}
      - {text: "`true false true true`", correct: false}
      - {text: "`true true true false`", correct: false}
      - {text: "`true false false false`", correct: false}
    answer: "`true false true false` : un `int` ne se parcourt pas. Un vecteur offre l'accès direct ; une liste chaînée, non."
    check:
      output: "true false true false"
  - key: bug-contrainte-non-satisfaite
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `double_de(2.5)` : « no matching function », puis « constraints not
      satisfied ». Le programme devrait afficher `5`. Quelle correction est la bonne ?
      ```cpp
      #include <concepts>
      #include <print>

      template <std::integral T>
      T double_de(T x) {
          return x * 2;
      }

      int main() {
          std::println("{}", double_de(2.5));
      }
      ```
    choices:
      - {text: "Élargir la contrainte : `requires std::integral<T> || std::floating_point<T>`", correct: true}
      - {text: "Resserrer la contrainte : `template <std::signed_integral T>`", correct: false}
      - {text: "Remplacer la contrainte par `template <std::same_as<int> T>`", correct: false}
      - {text: "Appeler la fonction avec `double_de<int>(2.5)`, sans changer la contrainte", correct: false}
    answer: |-
      ```cpp
      template <typename T>
          requires std::integral<T> || std::floating_point<T>
      T double_de(T x) {
          return x * 2;
      }
      ```
      `double` ne satisfait pas `std::integral`. La contrainte doit décrire tous les types voulus. Forcer `int`
      compilerait, mais tronquerait 2.5 en 2 : le résultat serait 4.
  - key: bug-same-as-trop-strict
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `afficher(7)`, où 7 est un `int` : la contrainte exige exactement `long`.
      Quelle correction est la bonne ?
      ```cpp
      #include <concepts>
      #include <print>

      void afficher(std::same_as<long> auto valeur) {
          std::println("{}", valeur);
      }

      int main() {
          afficher(7);
      }
      ```
    choices:
      - {text: "Contraindre par `std::convertible_to<long> auto valeur`", correct: true}
      - {text: "Contraindre par `std::derived_from<long> auto valeur`", correct: false}
      - {text: "Contraindre par `std::same_as<long&> auto valeur`", correct: false}
      - {text: "Contraindre par `std::floating_point auto valeur`", correct: false}
    answer: |-
      ```cpp
      void afficher(std::convertible_to<long> auto valeur) {
      ```
      `std::same_as` n'admet aucune conversion. Pour accepter tout ce qui se convertit en `long`, c'est
      `std::convertible_to`.
  - key: bug-include-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « 'std::integral' has not been declared ». Quelle correction est la bonne ?
      ```cpp
      template <std::integral T>
      T suivant(T x) {
          return x + 1;
      }

      int main() {
          return suivant(-1);
      }
      ```
    choices:
      - {text: "Ajouter `#include <concepts>` en haut du fichier", correct: true}
      - {text: "Ajouter `#include <integral>` en haut du fichier", correct: false}
      - {text: "Ajouter `using namespace concepts;` en haut du fichier", correct: false}
      - {text: "Ajouter `typename` devant `std::integral`", correct: false}
    answer: |-
      ```cpp
      #include <concepts>
      ```
      Les concepts standard sont déclarés dans `<concepts>`. Sans l'en-tête, le nom est inconnu.
  - key: bug-ordre-arguments
    format: bug-fix
    question: |-
      Ce programme devrait compiler : un `Cercle` est une `Forme`. Le compilateur refuse l'appel, la contrainte
      n'étant pas satisfaite. Quelle correction est la bonne ?
      ```cpp
      #include <concepts>
      #include <print>

      struct Forme {};
      struct Cercle : Forme {};

      template <typename T>
          requires std::derived_from<Forme, T>
      void dessiner(const T&) {
          std::println("dessin");
      }

      int main() {
          dessiner(Cercle{});
      }
      ```
    choices:
      - {text: "Écrire `requires std::derived_from<T, Forme>`", correct: true}
      - {text: "Écrire `requires std::same_as<T, Forme>`", correct: false}
      - {text: "Écrire `requires std::integral<T>`", correct: false}
      - {text: "Écrire `requires std::derived_from<Forme, Forme>`", correct: false}
    answer: |-
      ```cpp
      requires std::derived_from<T, Forme>
      ```
      Le premier argument est la classe dérivée, le second la base. Écrit à l'envers, le concept demande que
      `Forme` dérive de `Cercle`.
