notion: auto-parametres
lesson: |-
  Depuis **C++20**, on peut écrire **`auto` comme type d'un paramètre** de fonction. La fonction devient alors un
  **template**, sans le mot `template` : on parle de *template abrégé*.

  ```cpp
  auto doubler(auto x) {
      return x + x;
  }

  doubler(3);                  // x est un int
  doubler(2.5);                // x est un double
  doubler(std::string{"ab"});  // x est une std::string
  ```

  C'est exactement équivalent à :

  ```cpp
  template <typename T>
  auto doubler(T x) {
      return x + x;
  }
  ```

  **Chaque `auto` est un paramètre de template distinct.**

  ```cpp
  auto somme(auto a, auto b) { return a + b; }     // deux types indépendants
  somme(1, 2.5);                                   // int et double : accepté
  ```

  Avec `template <typename T> T somme(T a, T b)`, le même appel échouerait : `T` ne peut pas être à la fois `int`
  et `double`. Quand deux paramètres **doivent** avoir le même type, on revient à la syntaxe classique, qui permet
  de nommer `T`.

  **Les qualificatifs s'appliquent normalement.**

  | Écriture | Équivalent |
  |---|---|
  | `auto x` | `T x` : par valeur |
  | `const auto& x` | `const T& x` : lecture sans copie |
  | `auto& x` | `T& x` : modification de l'argument |
  | `auto&& x` | `T&& x` : référence universelle |
  | `auto... xs` | `Ts... xs` : nombre quelconque d'arguments |

  **Avec un concept.** On peut restreindre les types acceptés en plaçant un concept devant `auto` :

  ```cpp
  void afficher(std::integral auto n);     // seulement des types entiers
  ```

  **Ce qui reste vrai, puisque c'est un template.**

  - La définition va dans l'**en-tête**.
  - Une instanciation par type utilisé.
  - Les erreurs liées au type apparaissent à l'appel.
  - On ne peut pas prendre directement l'adresse de la fonction sans préciser le type.

  **Retrouver le type.** Le paramètre n'a pas de nom de type : on écrit `decltype(x)` quand on en a besoin.

  **Les lambdas le faisaient déjà.** Depuis C++14, `[](auto x) { ... }` est une lambda générique. C++20 a étendu
  l'écriture aux fonctions ordinaires.

  **À ne pas confondre.** `auto` en **type de retour** (`auto f()`) demande la déduction du type renvoyé, et ne
  fait pas de la fonction un template. `auto` pour une **variable** déduit son type de l'initialisation.

  **Quand s'en servir.** Pour une petite fonction générique, où le nom du type n'apporte rien. Dès qu'il faut
  nommer le type, relier deux paramètres ou spécialiser, la forme `template <typename T>` est plus claire.

  **En entretien** : « `auto` en paramètre, en C++20, fait de la fonction un template abrégé : chaque `auto` est un
  paramètre de template indépendant. C'est commode pour une fonction courte ; si deux paramètres doivent partager
  leur type, j'écris `template <typename T>`. »
cards:
  - key: definition
    format: course
    question: "Que devient une fonction dont un paramètre est déclaré `auto` (C++20) ?"
    choices:
      - {text: "Un template de fonction, instancié pour chaque type d'argument", correct: true}
      - {text: "Une fonction ordinaire, dont le paramètre change de type à l'exécution", correct: false}
      - {text: "Une fonction qui n'accepte que le type du premier appel compilé", correct: false}
      - {text: "Une macro, développée par le préprocesseur à chaque appel", correct: false}
    answer: "C'est un template abrégé : `void f(auto x)` équivaut à `template <typename T> void f(T x)`."
  - key: independants
    format: course
    question: "Dans `auto somme(auto a, auto b)`, quel lien y a-t-il entre les types de `a` et de `b` ?"
    choices:
      - {text: "Aucun : chaque `auto` est un paramètre de template distinct", correct: true}
      - {text: "Ils sont identiques : un seul paramètre de template pour les deux", correct: false}
      - {text: "Le type de `b` doit être convertible vers celui de `a`", correct: false}
      - {text: "Le type de `a` doit être plus petit que celui de `b`", correct: false}
    answer: "`somme(1, 2.5)` compile. Pour imposer le même type aux deux, on écrit `template <typename T> T somme(T a, T b)`."
  - key: reference
    format: course
    question: "Comment un template abrégé reçoit-il son argument sans le copier ni le modifier ?"
    choices:
      - {text: "Avec `const auto& x`", correct: true}
      - {text: "Avec `auto x`", correct: false}
      - {text: "Avec `auto* x`", correct: false}
      - {text: "Avec `static auto x`", correct: false}
    answer: "`const` et `&` s'ajoutent à `auto` comme à un type ordinaire : `const auto&` équivaut à `const T&`."
  - key: en-tete
    format: course
    question: "Où définit-on une fonction `void afficher(const auto& valeur)` utilisée par plusieurs fichiers ?"
    choices:
      - {text: "Dans l'en-tête : c'est un template", correct: true}
      - {text: "Dans un fichier source, avec sa déclaration dans l'en-tête", correct: false}
      - {text: "Dans chaque fichier source, recopiée", correct: false}
      - {text: "Dans le fichier qui contient `main`", correct: false}
    answer: "Le compilateur doit voir son corps pour l'instancier avec chaque type, comme pour tout template."
  - key: vf-cpp20
    format: true-false
    question: "`auto` comme type de paramètre d'une fonction ordinaire est permis depuis C++20."
    truth: true
    answer: "Les lambdas l'acceptaient depuis C++14 ; C++20 l'a étendu aux fonctions."
  - key: vf-meme-type
    format: true-false
    question: "Dans `void f(auto a, auto b)`, les deux arguments doivent être du même type."
    truth: false
    answer: "Chaque `auto` est indépendant : `f(1, \"texte\")` est accepté."
  - key: vf-retour
    format: true-false
    question: "`auto` en type de retour, comme dans `auto f(int x)`, fait de la fonction un template."
    truth: false
    answer: "Il demande seulement la déduction du type renvoyé. C'est `auto` en paramètre qui crée un template."
  - key: vf-execution
    format: true-false
    question: "Le type d'un paramètre `auto` est choisi à l'exécution."
    truth: false
    answer: "Il est déduit à la compilation, à chaque appel. C++ reste typé statiquement."
  - key: qcm-equivalent
    format: multiple-choice
    question: "À quoi équivaut `void afficher(const auto& x);` ?"
    choices:
      - {text: "`template <typename T> void afficher(const T& x);`", correct: true}
      - {text: "`void afficher(const void& x);`", correct: false}
      - {text: "`template <auto T> void afficher(T x);`", correct: false}
      - {text: "`void afficher(const std::any& x);`", correct: false}
    answer: "Le compilateur invente un paramètre de template pour chaque `auto`."
  - key: qcm-concept
    format: multiple-choice
    question: "Quelle signature n'accepte que des types entiers ?"
    choices:
      - {text: "`void afficher(std::integral auto n);`", correct: true}
      - {text: "`void afficher(auto int n);`", correct: false}
      - {text: "`void afficher(auto<int> n);`", correct: false}
      - {text: "`void afficher(int auto n);`", correct: false}
    answer: "Un concept placé devant `auto` contraint le type déduit. `std::integral` vient de `<concepts>`."
  - key: qcm-type
    format: multiple-choice
    question: "Dans `void f(auto x)`, comment nommes-tu le type de `x` à l'intérieur de la fonction ?"
    choices:
      - {text: "`decltype(x)`", correct: true}
      - {text: "`typeof x`", correct: false}
      - {text: "`auto`", correct: false}
      - {text: "`x::type`", correct: false}
    answer: "Le paramètre de template n'a pas de nom : `decltype(x)` donne le type de la variable."
  - key: qcm-variadique
    format: multiple-choice
    question: "Quelle signature accepte un nombre quelconque d'arguments de types quelconques ?"
    choices:
      - {text: "`void journaliser(auto... valeurs);`", correct: true}
      - {text: "`void journaliser(auto[] valeurs);`", correct: false}
      - {text: "`void journaliser(auto* valeurs);`", correct: false}
      - {text: "`void journaliser(auto valeurs, ...);`", correct: false}
    answer: "`auto...` déclare un pack de paramètres, comme `template <typename... Ts>`."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que la fonction accepte n'importe quel type :
      ```cpp
      auto doubler(___ x) {
          return x + x;
      }
      ```
    blanks:
      - [auto]
    answer: "`auto` en paramètre : la fonction devient un template."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour lire l'argument sans le copier :
      ```cpp
      void afficher(const auto___ valeur) {
          std::println("{}", valeur);
      }
      ```
    blanks:
      - ["&"]
    answer: "`const auto&` : une référence constante vers l'argument."
  - key: trous-concept
    format: fill-in
    question: |-
      Complète pour n'accepter que des types entiers :
      ```cpp
      void compter(std::___ auto n) {
          std::println("{}", n);
      }
      ```
    blanks:
      - [integral]
    answer: "Le concept `std::integral`, placé devant `auto`."
  - key: trous-decltype
    format: fill-in
    question: |-
      Complète pour déclarer une variable du même type que le paramètre :
      ```cpp
      void echanger(auto& a, auto& b) {
          ___(a) temporaire = a;
          a = b;
          b = temporaire;
      }
      ```
    blanks:
      - [decltype]
    answer: "`decltype(a)` est le type déclaré de `a`. Ici, `auto temporaire = a;` conviendrait aussi."
  - key: code-doubler
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      auto doubler(auto x) {
          return x + x;
      }

      int main() {
          std::println("{} {} {}", doubler(4), doubler(1.5), doubler(std::string{"ab"}));
      }
      ```
    choices:
      - {text: "`8 3 abab`", correct: true}
      - {text: "`8 3.0 abab`", correct: false}
      - {text: "`8 2 abab`", correct: false}
      - {text: "`44 1.51.5 abab`", correct: false}
    answer: "`8 3 abab` : trois instanciations. Pour une chaîne, `+` concatène. `std::println` affiche le `double` 3.0 sous la forme `3`."
    check:
      output: "8 3 abab"
  - key: code-types-differents
    format: code-output
    question: |-
      ```cpp
      #include <print>

      auto somme(auto a, auto b) {
          return a + b;
      }

      int main() {
          std::println("{} {}", somme(1, 2), somme(1, 2.5));
      }
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`3 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 3.5` : les deux `auto` sont indépendants. `1 + 2.5` se calcule en `double`."
    check:
      output: "3 3.5"
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <print>

      auto taille(auto x) {
          return sizeof(x);
      }

      int main() {
          std::println("{} {} {}", taille('a'), taille(7), taille(7LL));
      }
      ```
    choices:
      - {text: "`1 4 8`", correct: true}
      - {text: "`4 4 4`", correct: false}
      - {text: "`1 1 1`", correct: false}
      - {text: "`8 8 8`", correct: false}
    answer: "`1 4 8` : chaque appel instancie la fonction avec le type de l'argument : `char`, `int`, `long long`."
    unverifiable: "la taille de int et de long long dépend de la plate-forme ; la carte donne celles du bac à sable, les plus courantes"
  - key: code-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void incrementer(auto& x) {
          ++x;
      }

      void essayer(auto x) {
          ++x;
      }

      int main() {
          int a = 5;
          int b = 5;
          incrementer(a);
          essayer(b);
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`6 5`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`5 6`", correct: false}
    answer: "`6 5` : `auto&` lie une référence à `a`, qui est modifié. `auto` seul reçoit une copie de `b`."
    check:
      output: "6 5"
  - key: bug-meme-type-voulu
    format: bug-fix
    question: |-
      Cette fonction devrait refuser de comparer deux types différents. Elle accepte `plus_grand(3, 2.5)`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      auto plus_grand(auto a, auto b) {
          return a < b ? b : a;
      }

      int main() {
          std::println("{}", plus_grand(3, 2.5));
      }
      ```
    choices:
      - {text: "Écrire `template <typename T> T plus_grand(T a, T b)`", correct: true}
      - {text: "Écrire `auto plus_grand(const auto a, const auto b)`", correct: false}
      - {text: "Écrire `auto plus_grand(auto a, decltype(auto) b)`", correct: false}
      - {text: "Écrire `static auto plus_grand(auto a, auto b)`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      T plus_grand(T a, T b) {
          return a < b ? b : a;
      }
      ```
      Chaque `auto` est un paramètre de template distinct. Pour imposer un seul type, il faut le nommer : avec `T`,
      l'appel mixte est refusé à la compilation.
  - key: bug-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `10`. Il affiche `5` : la fonction modifie une copie. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      void doubler(auto x) {
          x = x + x;
      }

      int main() {
          int n = 5;
          doubler(n);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Recevoir `auto& x`", correct: true}
      - {text: "Recevoir `const auto& x`", correct: false}
      - {text: "Recevoir `auto* x`, sans changer l'appel", correct: false}
      - {text: "Recevoir `static auto x`", correct: false}
    answer: |-
      ```cpp
      void doubler(auto& x) {
      ```
      `auto` seul déduit un paramètre par valeur. Pour modifier l'argument, il faut une référence non constante.
  - key: bug-operation-absente
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator+' (operand types are 'Point' and 'Point') », dans
      l'instanciation de `doubler<Point>`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      auto doubler(auto v) {
          return v + v;
      }

      int main() {
          const Point p = doubler(Point{1, 2});
          std::println("{}", p.x);
      }
      ```
    choices:
      - {text: "Définir `Point operator+(const Point& a, const Point& b)`", correct: true}
      - {text: "Écrire `auto doubler(const auto& v)`", correct: false}
      - {text: "Écrire `Point doubler(auto v)`", correct: false}
      - {text: "Écrire `return v * 2;` dans la fonction", correct: false}
    answer: |-
      ```cpp
      Point operator+(const Point& a, const Point& b) {
          return {a.x + b.x, a.y + b.y};
      }
      ```
      Le template ne vérifie `v + v` qu'à l'instanciation, avec le type réel. `Point` ne sait pas s'additionner : il
      faut lui donner l'opérateur. `v * 2` n'existerait pas davantage.
  - key: bug-auto-membre
    format: bug-fix
    question: |-
      Le compilateur refuse le membre `auto valeur;` : « non-static data member declared with placeholder 'auto' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Boite {
          auto valeur;
      };

      int main() {
          const Boite b{42};
          std::println("{}", b.valeur);
      }
      ```
    choices:
      - {text: "Faire de `Boite` un template : `template <typename T> struct Boite { T valeur; };`", correct: true}
      - {text: "Déclarer le membre avec une référence : `auto& valeur;`", correct: false}
      - {text: "Déclarer le membre avec `decltype(auto) valeur;`", correct: false}
      - {text: "Déclarer le membre avec une constante : `const auto valeur;`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      struct Boite {
          T valeur;
      };
      ```
      `auto` crée un template pour un paramètre de fonction, pas pour un membre de classe. Une classe générique
      s'écrit avec `template` ; la déduction des arguments fait que `Boite b{42};` fonctionne toujours.
