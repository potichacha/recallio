notion: templates-fonctions
lesson: |-
  Un **template de fonction** est un **modèle** de fonction, écrit une fois pour un type laissé en paramètre. Le
  compilateur en fabrique une vraie fonction pour chaque type avec lequel on l'appelle.

  ```cpp
  template <typename T>
  T maximum(T a, T b) {
      return a < b ? b : a;
  }

  maximum(3, 7);                 // T = int
  maximum(2.5, 1.5);             // T = double
  maximum(std::string{"a"}, std::string{"b"});   // T = std::string
  ```

  - `template <typename T>` annonce un **paramètre de type**, nommé `T`. `class` peut remplacer `typename` : c'est la
    même chose.
  - À chaque appel, le compilateur **déduit** `T` du type des arguments, puis **instancie** le template : il génère
    la fonction pour ce type. Tout se passe **à la compilation** ; il n'y a aucun coût à l'exécution.

  **Quand la déduction échoue.** `maximum(1, 2.5)` ne compile pas : le premier argument dit `int`, le second
  `double`, et aucune conversion n'est tentée pendant la déduction. On donne alors le type soi-même :
  `maximum<double>(1, 2.5)`.

  **Ce que le type doit savoir faire.** Le template utilise `<` : il fonctionne avec tout type qui a cet opérateur.
  Avec un type qui ne l'a pas, l'erreur apparaît **à l'instanciation**, c'est-à-dire à l'appel, avec un message qui
  désigne l'intérieur du template.

  **Où l'écrire.** Le compilateur doit voir le **corps** du template pour l'instancier. Sa définition va donc dans
  un **fichier d'en-tête**, pas dans un `.cpp` : sinon, l'éditeur de liens ne trouve pas la fonction.

  Depuis C++20, `auto maximum(auto a, auto b)` écrit un template sans le mot `template`, et les **concepts**
  permettent de dire ce qu'on exige du type.

  **En entretien** : « Un template est instancié à la compilation, pour chaque type utilisé : c'est du polymorphisme
  sans coût à l'exécution. Sa définition doit être visible à l'instanciation, donc dans l'en-tête. »
cards:
  - key: definition-template
    format: course
    question: "Qu'est-ce qu'un template de fonction ?"
    choices:
      - {text: "Un modèle de fonction, dont le compilateur génère une version par type utilisé", correct: true}
      - {text: "Une fonction qui choisit son type à l'exécution, d'après ses arguments", correct: false}
      - {text: "Une fonction virtuelle, que chaque classe dérivée redéfinit", correct: false}
      - {text: "Une fonction dont le corps est écrit dans un fichier à part", correct: false}
    answer: "Le template n'est pas une fonction, mais une recette. À chaque type avec lequel on l'appelle, le compilateur en fabrique une vraie fonction : c'est l'instanciation."
  - key: deduction
    format: course
    question: "Comment le compilateur connaît-il `T` dans l'appel `maximum(3, 7)` ?"
    choices:
      - {text: "Il le déduit du type des arguments : ici, `int`", correct: true}
      - {text: "Il essaie tous les types jusqu'à ce que l'un compile", correct: false}
      - {text: "Il prend le type de la variable qui reçoit le résultat", correct: false}
      - {text: "Il ne le connaît pas : il faut toujours écrire `maximum<int>`", correct: false}
    answer: "C'est la déduction des arguments de template. On n'écrit le type entre chevrons que lorsqu'elle échoue, ou qu'on veut un autre type."
  - key: quand-instancie
    format: course
    question: À quel moment un template de fonction est-il instancié ?
    choices:
      - {text: "À la compilation, pour chaque type avec lequel il est appelé", correct: true}
      - {text: "À l'exécution, au premier appel avec un nouveau type", correct: false}
      - {text: "À l'édition des liens, une fois pour tous les types", correct: false}
      - {text: "Jamais : le même code machine sert à tous les types", correct: false}
    answer: "Le compilateur génère une fonction distincte par type. À l'exécution, c'est une fonction ordinaire : aucun coût, mais un exécutable plus gros."
  - key: definition-dans-l-en-tete
    format: course
    question: Pourquoi la définition d'un template va-t-elle dans un fichier d'en-tête ?
    choices:
      - {text: "Le compilateur doit voir son corps là où il l'instancie", correct: true}
      - {text: "Un template ne peut pas contenir d'instructions, seulement des déclarations", correct: false}
      - {text: "Un fichier `.cpp` ne peut pas contenir le mot-clé `template`", correct: false}
      - {text: "L'en-tête est compilé avant les fichiers `.cpp`", correct: false}
    answer: "Pour générer `maximum<int>`, le compilateur a besoin du code du template dans le fichier qui l'appelle. Défini dans un autre `.cpp`, il est introuvable : « undefined reference »."
  - key: vf-typename-class
    format: true-false
    question: "`template <class T>` et `template <typename T>` déclarent la même chose."
    truth: true
    answer: Les deux mots-clés sont équivalents pour un paramètre de type. `typename` dit mieux ce qu'il en est.
  - key: vf-cout-execution
    format: true-false
    question: Appeler un template de fonction coûte plus cher, à l'exécution, qu'appeler une fonction ordinaire.
    truth: false
    answer: Une instance de template est une fonction ordinaire. Le travail est fait à la compilation.
  - key: vf-deduction-conversion
    format: true-false
    question: "Avec `template <typename T> T maximum(T a, T b)`, l'appel `maximum(1, 2.5)` convertit 1 en `double`."
    truth: false
    answer: "La déduction ne tente aucune conversion : `T` serait `int` et `double` à la fois. Le code ne compile pas."
  - key: vf-erreur-a-l-instanciation
    format: true-false
    question: Une erreur due au type utilisé apparaît quand le template est instancié, pas quand il est défini.
    truth: true
    answer: Tant qu'on ne l'appelle pas avec ce type, le compilateur ne sait pas que l'opération manque.
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Quelle ligne précède la définition d'un template de fonction à un paramètre de type ?"
    choices:
      - {text: "`template <typename T>`", correct: true}
      - {text: "`generic <T>`", correct: false}
      - {text: "`template (typename T)`", correct: false}
      - {text: "`typename <template T>`", correct: false}
    answer: "`template`, puis les paramètres entre chevrons."
  - key: qcm-type-explicite
    format: multiple-choice
    question: "Comment appeler `maximum` avec `T = double` pour les arguments 1 et 2.5 ?"
    choices:
      - {text: "`maximum<double>(1, 2.5)`", correct: true}
      - {text: "`maximum(double)(1, 2.5)`", correct: false}
      - {text: "`maximum[double](1, 2.5)`", correct: false}
      - {text: "`double maximum(1, 2.5)`", correct: false}
    answer: "Le type s'écrit entre chevrons, après le nom. La déduction n'a plus lieu, et 1 est converti en `double`."
  - key: qcm-exigence
    format: multiple-choice
    question: "Que doit savoir faire un type pour servir à `template <typename T> T maximum(T a, T b) { return a < b ? b : a; }` ?"
    choices:
      - {text: "Être comparable avec `<`, et copiable", correct: true}
      - {text: "Dériver d'une classe de base commune", correct: false}
      - {text: "Avoir une fonction membre nommée `maximum`", correct: false}
      - {text: "Être un type fondamental, comme `int` ou `double`", correct: false}
    answer: "Le template n'exige que ce qu'il utilise : ici `<`, et la copie pour les paramètres et le retour. Aucun lien d'héritage n'est nécessaire."
  - key: qcm-auto
    format: multiple-choice
    question: "Depuis C++20, que déclare `auto doubler(auto x) { return x + x; }` ?"
    choices:
      - {text: "Un template de fonction, écrit sans le mot `template`", correct: true}
      - {text: "Une fonction qui n'accepte que des `int`", correct: false}
      - {text: "Une fonction dont le type est décidé à l'exécution", correct: false}
      - {text: "Rien : `auto` n'est pas permis pour un paramètre", correct: false}
    answer: "Un paramètre `auto` fait de la fonction un template abrégé : une instance par type d'argument."
  - key: trous-typename
    format: fill-in
    question: |-
      Complète pour déclarer le paramètre de type `T` :
      ```cpp
      template <___ T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }
      ```
    blanks:
      - [typename, class]
    answer: "`template <typename T>` (ou `class T`)."
  - key: trous-template
    format: fill-in
    question: |-
      Complète avec le mot-clé qui annonce un template :
      ```cpp
      ___ <typename T>
      T doubler(T x) {
          return x + x;
      }
      ```
    blanks:
      - [template]
    answer: "`template <typename T>` précède la fonction."
  - key: trous-type-explicite
    format: fill-in
    question: |-
      Complète pour que les deux arguments soient traités comme des `double` :
      ```cpp
      double resultat = maximum___(1, 2.5);
      ```
    blanks:
      - ["<double>"]
    answer: "`maximum<double>(1, 2.5)` : le type est donné, il n'est plus déduit."
  - key: trous-parametre
    format: fill-in
    question: |-
      Complète le type du premier paramètre :
      ```cpp
      template <typename T>
      T maximum(___ a, T b) {
          return a < b ? b : a;
      }
      ```
    blanks:
      - [T, "const T&"]
    answer: "Le paramètre est du type `T`, celui du template."
  - key: code-plusieurs-types
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }

      int main() {
          std::println("{} {}", maximum(3, 7), maximum(std::string{"pomme"}, std::string{"poire"}));
      }
      ```
    choices:
      - {text: "`7 pomme`", correct: true}
      - {text: "`7 poire`", correct: false}
      - {text: "`3 pomme`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7 pomme` : le même template sert pour `int` et pour `std::string`. Les chaînes se comparent dans l'ordre du dictionnaire : `poire` vient avant `pomme`."
    check:
      output: "7 pomme"
  - key: code-type-explicite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }

      int main() {
          std::println("{} {}", maximum<double>(1, 2.5), maximum<int>(1, 2.5));
      }
      ```
    choices:
      - {text: "`2.5 2`", correct: true}
      - {text: "`2.5 2.5`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2.5 2` : avec `T = double`, 1 devient 1.0. Avec `T = int`, 2.5 est converti en 2 à l'appel, comme pour une fonction ordinaire."
    check:
      output: "2.5 2"
  - key: code-deduction
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      template <typename T>
      T doubler(T x) {
          return x + x;
      }

      int main() {
          std::println("{} {} {}", doubler(3), doubler(1.5), doubler(std::string{"ab"}));
      }
      ```
    choices:
      - {text: "`6 3 abab`", correct: true}
      - {text: "`6 3 ab`", correct: false}
      - {text: "`6 3.0 abab`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6 3 abab` : trois instances du même template. Pour `int` et `double`, `+` additionne ; pour `std::string`, il concatène."
    check:
      output: "6 3 abab"
  - key: code-deux-parametres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T, typename U>
      auto ajouter(T a, U b) {
          return a + b;
      }

      int main() {
          std::println("{} {}", ajouter(1, 2.5), ajouter(1, 2));
      }
      ```
    choices:
      - {text: "`3.5 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`3.5 3.0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3.5 3` : avec deux paramètres de type, chaque argument a le sien. `1 + 2.5` est un `double`, `1 + 2` un `int` : `auto` déduit le type de retour."
    check:
      output: "3.5 3"
  - key: bug-deduction-en-conflit
    format: bug-fix
    question: |-
      Le compilateur répond « deduced conflicting types for parameter 'T' ('int' and 'double') ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }

      int main() {
          std::println("{}", maximum(1, 2.5));
      }
      ```
    choices:
      - {text: "Écrire `maximum<double>(1, 2.5)`", correct: true}
      - {text: "Écrire `maximum(int, double)(1, 2.5)`", correct: false}
      - {text: "Écrire `maximum((1, 2.5))`", correct: false}
      - {text: "Écrire `template maximum(1, 2.5)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", maximum<double>(1, 2.5));
      ```
      Les deux arguments doivent donner le même `T`, et la déduction ne convertit pas. En nommant le type, on la
      court-circuite ; `maximum(1.0, 2.5)` marcherait aussi.
  - key: bug-operateur-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator<' (operand types are 'Point' and 'Point') », à l'intérieur de
      `maximum`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }

      int main() {
          Point p = maximum(Point{1, 2}, Point{3, 4});
          std::println("{}", p.x);
      }
      ```
    choices:
      - {text: "Donner un opérateur de comparaison à `Point`", correct: true}
      - {text: "Écrire `maximum<Point>(...)` dans `main`", correct: false}
      - {text: "Remplacer `typename` par `class` dans le template", correct: false}
      - {text: "Déclarer `Point` après le template", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
          auto operator<=>(const Point&) const = default;
      };
      ```
      Le template utilise `<` : le type doit le fournir. L'erreur apparaît à l'instanciation, dans le corps du
      template. `operator<=>` par défaut (C++20) donne toutes les comparaisons, membre à membre.
  - key: bug-template-non-defini
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `int carre<int>(int)' ». Le corps du
      template est dans un autre fichier `.cpp`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      T carre(T x);

      int main() {
          std::println("{}", carre(4));
      }
      ```
    choices:
      - {text: "Mettre la définition du template dans l'en-tête, visible ici", correct: true}
      - {text: "Ajouter `extern` devant la déclaration du template", correct: false}
      - {text: "Appeler `carre<int>(4)`, avec le type entre chevrons", correct: false}
      - {text: "Déclarer le template avec `class T` au lieu de `typename T`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      T carre(T x) {
          return x * x;
      }
      ```
      Pour instancier `carre<int>`, le compilateur doit voir le corps du template dans le fichier qui l'appelle. Dans
      l'autre `.cpp`, personne ne l'a appelé avec `int` : la fonction n'a jamais été générée.
  - key: bug-type-deduit
    format: bug-fix
    question: |-
      Ce programme affiche `3` au lieu de `3.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      T moitie(T x) {
          return x / 2;
      }

      int main() {
          std::println("{}", moitie(7));
      }
      ```
    choices:
      - {text: "Appeler `moitie(7.0)` : `T` est déduit de l'argument", correct: true}
      - {text: "Appeler `moitie(7) + 0.5` dans l'affichage", correct: false}
      - {text: "Écrire `return x / 2.0;` dans le template", correct: false}
      - {text: "Déclarer le résultat dans une variable `double`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", moitie(7.0));
      ```
      `7` est un `int` : `T` vaut `int`, et la division est entière. Écrire `x / 2.0` ne suffirait pas : le résultat
      serait reconverti en `T`, donc en `int`. `moitie<double>(7)` convient aussi.
