notion: parametres-non-type
lesson: |-
  Un paramètre de template n'est pas forcément un type. Ce peut être une **valeur**, connue à la compilation : on
  parle de **paramètre non-type**.

  ```cpp
  template <typename T, std::size_t N>
  struct Tampon {
      T donnees[N];
      std::size_t taille() const { return N; }
  };

  Tampon<int, 8> petit;
  Tampon<int, 64> grand;
  ```

  C'est ainsi qu'est fait `std::array<T, N>` : la taille fait partie du **type**. `Tampon<int, 8>` et
  `Tampon<int, 64>` sont deux types **différents**, sans rapport entre eux.

  **Ce qu'on peut passer.**

  | Sorte de paramètre | Exemple |
  |---|---|
  | entier, `bool`, `char`, énumération | `template <int N>` |
  | pointeur ou référence vers un objet ou une fonction à durée statique | `template <void (*F)()>` |
  | nombre à virgule (C++20) | `template <double X>` |
  | classe « structurelle » : membres publics, tous utilisables ainsi (C++20) | `template <Point P>` |
  | `auto` : le type de la valeur est déduit (C++17) | `template <auto V>` |

  **L'argument doit être une constante.** Le compilateur fabrique le type : il lui faut la valeur. Un littéral, une
  variable `constexpr`, le résultat d'une fonction `constexpr` conviennent ; une variable ordinaire, non.

  ```cpp
  constexpr int taille = 16;
  Tampon<int, taille> ok;

  int n = 16;
  Tampon<int, n> refuse;      // erreur : n n'est pas une constante
  ```

  **Déduire la taille d'un tableau.** Une fonction template peut recevoir un tableau par référence, et en déduire
  la taille :

  ```cpp
  template <typename T, std::size_t N>
  std::size_t longueur(const T (&)[N]) { return N; }

  int notes[5];
  longueur(notes);            // 5
  ```

  **Valeur par défaut.** Comme un paramètre de type : `template <typename T, std::size_t N = 16>`.

  **Le prix.** Chaque valeur différente produit une **instanciation** différente : du code en plus. Et la valeur
  ne peut pas être choisie à l'exécution : c'est le rôle de `std::vector`, pas de `std::array`.

  **En entretien** : « Un paramètre non-type est une valeur constante passée à un template, comme la taille de
  `std::array`. Elle fait partie du type : deux valeurs donnent deux types distincts. L'argument doit être une
  expression constante. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un paramètre de template non-type ?"
    choices:
      - {text: "Une valeur connue à la compilation, passée au template comme le serait un type", correct: true}
      - {text: "Un paramètre de fonction dont le type n'est pas précisé par l'appelant", correct: false}
      - {text: "Un type qui n'a pas encore été défini au moment où le template est écrit", correct: false}
      - {text: "Une valeur lue à l'exécution, que le template convertit en type", correct: false}
    answer: "`template <std::size_t N>` reçoit une valeur. Le compilateur la connaît à la compilation, et génère le code pour elle."
  - key: fait-partie-du-type
    format: course
    question: "Quel rapport y a-t-il entre `std::array<int, 3>` et `std::array<int, 4>` ?"
    choices:
      - {text: "Ce sont deux types différents : la taille fait partie du type", correct: true}
      - {text: "C'est le même type, avec deux tailles choisies à l'exécution", correct: false}
      - {text: "Le second dérive du premier, auquel il ajoute un élément", correct: false}
      - {text: "Le premier se convertit implicitement vers le second", correct: false}
    answer: "Chaque valeur de l'argument produit une instanciation distincte. On ne peut pas affecter l'un à l'autre."
  - key: argument-constant
    format: course
    question: "Pourquoi l'argument d'un paramètre non-type doit-il être une expression constante ?"
    choices:
      - {text: "Le compilateur fabrique le type à la compilation : il lui faut la valeur", correct: true}
      - {text: "Une variable ordinaire occuperait trop de mémoire dans le type", correct: false}
      - {text: "Le standard interdit toute variable dans une liste d'arguments", correct: false}
      - {text: "L'éditeur de liens ne sait pas relier un type à une variable", correct: false}
    answer: "Un type est une affaire de compilation. Une valeur connue seulement à l'exécution ne peut pas en faire partie."
  - key: auto
    format: course
    question: "Que permet `template <auto V>` (C++17) ?"
    choices:
      - {text: "De recevoir une valeur dont le type est déduit de l'argument", correct: true}
      - {text: "De recevoir un type choisi automatiquement par le compilateur", correct: false}
      - {text: "De recevoir une valeur calculée à l'exécution du programme", correct: false}
      - {text: "De recevoir un nombre quelconque d'arguments de template", correct: false}
    answer: "`Constante<5>` déduit `int`, `Constante<'a'>` déduit `char`. Le paramètre reste une valeur de compilation."
  - key: vf-variable
    format: true-false
    question: "Une variable `int n` ordinaire peut servir d'argument à `template <int N>`."
    truth: false
    answer: "Il faut une expression constante : un littéral, une variable `constexpr`, ou le résultat d'une fonction `constexpr`."
  - key: vf-flottant
    format: true-false
    question: "Depuis C++20, un paramètre non-type peut être un `double`."
    truth: true
    answer: "C++20 a ouvert les paramètres non-type aux nombres à virgule et aux classes structurelles."
  - key: vf-defaut
    format: true-false
    question: "Un paramètre non-type peut avoir une valeur par défaut."
    truth: true
    answer: "Comme un paramètre de type : `template <typename T, std::size_t N = 16>`."
  - key: vf-meme-type
    format: true-false
    question: "`Tampon<int, 8>` et `Tampon<int, 16>` désignent le même type."
    truth: false
    answer: "Deux arguments différents donnent deux instanciations, donc deux types sans rapport."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration donne à un template de classe un paramètre de type et une taille ?"
    choices:
      - {text: "`template <typename T, std::size_t N>`", correct: true}
      - {text: "`template <typename T, typename N>`", correct: false}
      - {text: "`template <typename T>(std::size_t N)`", correct: false}
      - {text: "`template <T, N>`", correct: false}
    answer: "Un paramètre non-type se déclare avec son type, comme un paramètre de fonction."
  - key: qcm-argument-valide
    format: multiple-choice
    question: "Lequel de ces arguments convient à `template <int N> struct Grille;` ?"
    choices:
      - {text: "Une variable `constexpr int cote = 9;`", correct: true}
      - {text: "Une variable `int cote = 9;`", correct: false}
      - {text: "Une valeur lue avec `std::cin`", correct: false}
      - {text: "Le résultat de `v.size()` sur un vecteur", correct: false}
    answer: "Seule la variable `constexpr` est une expression constante. Les trois autres ne sont connues qu'à l'exécution."
  - key: qcm-exemple-standard
    format: multiple-choice
    question: "Quel conteneur standard prend sa taille en paramètre non-type ?"
    choices:
      - {text: "`std::array`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::deque`", correct: false}
      - {text: "`std::list`", correct: false}
    answer: "`std::array<T, N>` : la taille est fixée à la compilation. `std::bitset<N>` fait de même."
  - key: qcm-cout
    format: multiple-choice
    question: "Quel est le coût d'un template instancié avec vingt tailles différentes ?"
    choices:
      - {text: "Vingt instanciations, donc davantage de code généré", correct: true}
      - {text: "Vingt allocations sur le tas, une par taille", correct: false}
      - {text: "Vingt tests de la taille à chaque appel", correct: false}
      - {text: "Aucun : le code est partagé entre les tailles", correct: false}
    answer: "Chaque valeur produit son propre code. C'est le prix d'une taille connue du compilateur."
  - key: trous-size-t
    format: fill-in
    question: |-
      Complète pour que `N` soit une taille, et non un type :
      ```cpp
      template <typename T, std::___ N>
      struct Tampon {
          T donnees[N];
      };
      ```
    blanks:
      - [size_t]
    answer: "Un paramètre non-type se déclare avec son type : ici `std::size_t`."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que `taille` puisse servir d'argument de template :
      ```cpp
      ___ int taille = 16;
      Tampon<int, taille> tampon;
      ```
    blanks:
      - [constexpr]
    answer: "Une variable `constexpr` est une expression constante."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que le type de la valeur soit déduit (C++17) :
      ```cpp
      template <___ V>
      struct Constante {
          static constexpr auto valeur = V;
      };
      ```
    blanks:
      - [auto]
    answer: "`template <auto V>` accepte une valeur de n'importe quel type permis."
  - key: trous-defaut
    format: fill-in
    question: |-
      Complète pour que la taille vaille 16 quand on ne la précise pas :
      ```cpp
      template <typename T, std::size_t N ___ 16>
      struct Tampon {};

      Tampon<int> tampon;
      ```
    blanks:
      - ["="]
    answer: "Une valeur par défaut s'écrit avec `=`, comme pour un paramètre de fonction."
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename T, std::size_t N>
      struct Tampon {
          T donnees[N];
          std::size_t taille() const { return N; }
      };

      int main() {
          Tampon<int, 4> a{};
          Tampon<char, 10> b{};
          std::println("{} {} {}", a.taille(), b.taille(), sizeof(b));
      }
      ```
    choices:
      - {text: "`4 10 10`", correct: true}
      - {text: "`4 10 40`", correct: false}
      - {text: "`4 4 10`", correct: false}
      - {text: "`16 10 10`", correct: false}
    answer: "`4 10 10` : chaque instanciation connaît son `N`. `Tampon<char, 10>` contient dix `char`, soit dix octets."
    check:
      output: "4 10 10"
  - key: code-deduction-tableau
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename T, std::size_t N>
      std::size_t longueur(const T (&)[N]) {
          return N;
      }

      int main() {
          int notes[5] = {};
          std::println("{} {}", longueur(notes), longueur("abc"));
      }
      ```
    choices:
      - {text: "`5 4`", correct: true}
      - {text: "`5 3`", correct: false}
      - {text: "`20 4`", correct: false}
      - {text: "`5 8`", correct: false}
    answer: "`5 4` : `N` est déduit de la taille du tableau. Le littéral `\"abc\"` est un tableau de quatre caractères, zéro final compris."
    check:
      output: "5 4"
  - key: code-types-distincts
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      template <int N>
      struct Marque {};

      int main() {
          constexpr int trois = 3;
          std::println("{} {}",
                       std::is_same_v<Marque<3>, Marque<trois>>,
                       std::is_same_v<Marque<3>, Marque<4>>);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : c'est la valeur qui compte, pas la façon de l'écrire. `Marque<3>` et `Marque<4>` sont deux types."
    check:
      output: "true false"
  - key: code-auto
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <auto V>
      struct Constante {
          static constexpr auto valeur = V;
      };

      int main() {
          std::println("{} {} {}", Constante<7>::valeur, Constante<'x'>::valeur, sizeof(Constante<'x'>::valeur));
      }
      ```
    choices:
      - {text: "`7 x 1`", correct: true}
      - {text: "`7 120 4`", correct: false}
      - {text: "`7 x 4`", correct: false}
      - {text: "`7 120 1`", correct: false}
    answer: "`7 x 1` : avec `auto`, le type suit l'argument. `'x'` reste un `char`, d'un octet, et s'affiche comme un caractère."
    check:
      output: "7 x 1"
  - key: bug-variable-non-constante
    format: bug-fix
    question: |-
      Le compilateur refuse `std::array<int, n>` : « the value of 'n' is not usable in a constant expression ».
      Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          int n = 4;
          std::array<int, n> valeurs{};
          std::println("{}", valeurs.size());
      }
      ```
    choices:
      - {text: "Déclarer `constexpr int n = 4;`", correct: true}
      - {text: "Déclarer `static int n = 4;`", correct: false}
      - {text: "Déclarer `volatile int n = 4;`", correct: false}
      - {text: "Déclarer `long n = 4;`", correct: false}
    answer: |-
      ```cpp
      constexpr int n = 4;
      ```
      La taille d'un `std::array` fait partie de son type : il faut une expression constante. Pour une taille connue
      à l'exécution seulement, on prend un `std::vector`.
  - key: bug-affectation-tailles
    format: bug-fix
    question: |-
      Le compilateur refuse `b = a;` : « no match for 'operator=' ». Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 3> a{1, 2, 3};
          std::array<int, 4> b{};
          b = a;
          std::println("{}", b[0]);
      }
      ```
    choices:
      - {text: "Copier les éléments : `std::copy(a.begin(), a.end(), b.begin());`", correct: true}
      - {text: "Convertir le tableau : `b = static_cast<std::array<int, 4>>(a);`", correct: false}
      - {text: "Déplacer le tableau : `b = std::move(a);`", correct: false}
      - {text: "Affecter par référence : `std::array<int, 4>& b = a;`", correct: false}
    answer: |-
      ```cpp
      std::copy(a.begin(), a.end(), b.begin());
      ```
      `std::array<int, 3>` et `std::array<int, 4>` sont deux types sans rapport : ni affectation, ni conversion.
      On copie les éléments, en veillant à ce que la destination soit assez grande.
  - key: bug-parametre-fonction
    format: bug-fix
    question: |-
      Le compilateur refuse `Tampon<taille>` dans cette fonction : « 'taille' is not a constant expression ».
      Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      template <std::size_t N>
      struct Tampon {
          char donnees[N];
      };

      std::size_t occupe(std::size_t taille) {
          return sizeof(Tampon<taille>);
      }

      int main() {
          std::println("{}", occupe(8));
      }
      ```
    choices:
      - {text: "Faire de la taille un paramètre de template : `template <std::size_t N> std::size_t occupe()`", correct: true}
      - {text: "Déclarer le paramètre constant : `std::size_t occupe(const std::size_t taille)`", correct: false}
      - {text: "Déclarer la fonction `constexpr std::size_t occupe(std::size_t taille)`", correct: false}
      - {text: "Passer le paramètre par référence : `std::size_t occupe(const std::size_t& taille)`", correct: false}
    answer: |-
      ```cpp
      template <std::size_t N>
      std::size_t occupe() {
          return sizeof(Tampon<N>);
      }
      // ...
      std::println("{}", occupe<8>());
      ```
      Un paramètre de fonction n'est jamais une expression constante dans le corps de la fonction, même `const`,
      même dans une fonction `constexpr`. La valeur doit arriver par un paramètre de template.
  - key: bug-taille-nulle-deduite
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `longueur(p)` : il ne peut pas déduire `N`. Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename T, std::size_t N>
      std::size_t longueur(const T (&)[N]) {
          return N;
      }

      int main() {
          int notes[5] = {};
          int* p = notes;
          std::println("{}", longueur(p));
      }
      ```
    choices:
      - {text: "Passer le tableau lui-même : `longueur(notes)`", correct: true}
      - {text: "Passer le pointeur déréférencé : `longueur(*p)`", correct: false}
      - {text: "Passer l'adresse du pointeur : `longueur(&p)`", correct: false}
      - {text: "Préciser le type seul : `longueur<int>(p)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", longueur(notes));
      ```
      Un pointeur a perdu la taille du tableau : il n'y a plus rien à déduire. Seul le tableau, passé par référence,
      porte `N` dans son type.
