notion: templates-classes
lesson: |-
  Un **template de classe** est un modèle de classe, paramétré par un ou plusieurs types. `std::vector`, `std::pair`
  et `std::unique_ptr` en sont.

  ```cpp
  template <typename T>
  class Boite {
  public:
      explicit Boite(T valeur) : valeur_{valeur} {}
      const T& valeur() const { return valeur_; }
  private:
      T valeur_;
  };

  Boite<int> entier{5};
  Boite<std::string> texte{"bonjour"};
  ```

  - On **nomme le type** entre chevrons à l'utilisation : `Boite<int>`.
  - `Boite<int>` et `Boite<std::string>` sont **deux classes distinctes**, sans lien entre elles : on ne peut ni
    affecter l'une à l'autre, ni les ranger dans le même conteneur.
  - Chaque instance n'est générée que pour les types réellement utilisés, et seules les fonctions membres **appelées**
    sont instanciées.

  **La déduction des arguments de classe (CTAD, C++17).** Le compilateur déduit les paramètres à partir des
  arguments du constructeur :

  ```cpp
  Boite b{5};                 // Boite<int>
  std::pair p{1, 2.5};        // std::pair<int, double>
  std::vector v{1, 2, 3};     // std::vector<int>
  ```

  Sans argument dont déduire, il faut écrire le type : `Boite<int> vide;`.

  **Un paramètre peut être une valeur**, connue à la compilation : c'est un paramètre **non-type**.
  `std::array<int, 3>` en a un : sa taille.

  ```cpp
  template <typename T, std::size_t N>
  class Tableau { T elements_[N]; };
  ```

  **Définir une fonction membre hors de la classe** demande de répéter l'en-tête du template, et d'écrire le nom
  complet de la classe :

  ```cpp
  template <typename T>
  const T& Boite<T>::valeur() const { return valeur_; }
  ```

  Comme pour un template de fonction, **tout va dans l'en-tête**.

  **En entretien** : « Un template de classe génère une classe par jeu d'arguments : `Boite<int>` et `Boite<double>`
  sont deux types sans rapport. Depuis C++17, la CTAD déduit les arguments du constructeur. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un template de classe ?"
    choices:
      - {text: "Un modèle de classe, dont le compilateur génère une classe par type utilisé", correct: true}
      - {text: "Une classe de base, dont les autres classes doivent dériver", correct: false}
      - {text: "Une classe dont les membres changent de type à l'exécution", correct: false}
      - {text: "Une classe abstraite, qu'on ne peut pas instancier", correct: false}
    answer: "`Boite<int>` et `Boite<std::string>` sont deux classes, générées à la compilation à partir du même modèle. `std::vector` fonctionne ainsi."
  - key: instances-distinctes
    format: course
    question: "Quel lien y a-t-il entre `Boite<int>` et `Boite<double>` ?"
    choices:
      - {text: "Aucun : ce sont deux classes distinctes", correct: true}
      - {text: "`Boite<double>` dérive de `Boite<int>`", correct: false}
      - {text: "Ce sont deux objets de la même classe `Boite`", correct: false}
      - {text: "L'une se convertit implicitement en l'autre", correct: false}
    answer: "Chaque jeu d'arguments donne un type à part. On ne peut ni les affecter l'une à l'autre, ni les mélanger dans un même vecteur."
  - key: ctad
    format: course
    question: "Que fait la déduction des arguments de classe (CTAD), depuis C++17 ?"
    choices:
      - {text: "Elle déduit les paramètres du template à partir des arguments du constructeur", correct: true}
      - {text: "Elle déduit le type des membres pendant l'exécution du programme", correct: false}
      - {text: "Elle convertit une instance du template en une autre", correct: false}
      - {text: "Elle supprime les instances du template qui ne servent pas", correct: false}
    answer: "`std::pair p{1, 2.5};` déclare un `std::pair<int, double>`, sans écrire les types. Sans argument dont déduire, il faut les nommer."
  - key: parametre-non-type
    format: course
    question: "Dans `std::array<int, 3>`, qu'est-ce que le `3` ?"
    choices:
      - {text: "Un paramètre non-type du template : une valeur connue à la compilation", correct: true}
      - {text: "Un argument passé au constructeur à l'exécution", correct: false}
      - {text: "La valeur de départ de chaque élément", correct: false}
      - {text: "Un second paramètre de type, nommé `3`", correct: false}
    answer: "Un template peut être paramétré par une valeur, pas seulement par un type. Elle fait partie du type : `std::array<int, 3>` et `std::array<int, 4>` sont deux types."
  - key: vf-meme-conteneur
    format: true-false
    question: "Un `std::vector<Boite<int>>` peut contenir une `Boite<double>`."
    truth: false
    answer: Ce sont deux types sans rapport. Le vecteur ne contient que des `Boite<int>`.
  - key: vf-en-tete
    format: true-false
    question: Les fonctions membres d'un template de classe se définissent dans l'en-tête.
    truth: true
    answer: Le compilateur doit voir leur corps pour les instancier, comme pour un template de fonction.
  - key: vf-ctad-vector
    format: true-false
    question: "Depuis C++17, `std::vector v{1, 2, 3};` déclare un `std::vector<int>`."
    truth: true
    answer: Le type des éléments est déduit de la liste entre accolades.
  - key: vf-fonctions-non-appelees
    format: true-false
    question: "Une fonction membre d'un template de classe est instanciée même si elle n'est jamais appelée."
    truth: false
    answer: Seules les fonctions membres réellement utilisées sont générées. Une fonction qui ne compile pas pour un type ne gêne que si on l'appelle.
  - key: qcm-utilisation
    format: multiple-choice
    question: "Comment déclare-t-on une `Boite` qui contient un `double`, sans passer d'argument ?"
    choices:
      - {text: "`Boite<double> b;`", correct: true}
      - {text: "`Boite b<double>;`", correct: false}
      - {text: "`Boite(double) b;`", correct: false}
      - {text: "`template Boite b;`", correct: false}
    answer: "Le type suit le nom du template, entre chevrons."
  - key: qcm-definition-externe
    format: multiple-choice
    question: "Comment commence la définition, hors de la classe, de la fonction membre `valeur` du template `Boite` ?"
    choices:
      - {text: "`template <typename T> const T& Boite<T>::valeur() const {`", correct: true}
      - {text: "`const T& Boite::valeur() const {`", correct: false}
      - {text: "`template const T& Boite<T>::valeur() const {`", correct: false}
      - {text: "`const T& Boite<typename T>::valeur() const {`", correct: false}
    answer: "On répète l'en-tête du template, et le nom de la classe porte son paramètre : `Boite<T>::`."
  - key: qcm-type-deduit
    format: multiple-choice
    question: "Grâce à la déduction des arguments de classe, quel type a `p` dans `std::pair p{7, 0.5};` ?"
    choices:
      - {text: "`std::pair<int, double>`", correct: true}
      - {text: "`std::pair<double, double>`", correct: false}
      - {text: "`std::pair<int, int>`", correct: false}
      - {text: "`std::pair<auto, auto>`", correct: false}
    answer: "Chaque paramètre du template est déduit de l'argument correspondant."
  - key: qcm-exemples
    format: multiple-choice
    question: Lequel de ces types de la bibliothèque standard n'est pas un template de classe ?
    choices:
      - {text: "`std::mutex`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::unique_ptr`", correct: false}
      - {text: "`std::optional`", correct: false}
    answer: "`std::mutex` est une classe ordinaire. Les trois autres s'écrivent avec un type entre chevrons : `std::vector<int>`, `std::unique_ptr<T>`, `std::optional<T>`."
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour que la boîte contienne un entier :
      ```cpp
      Boite<___> boite{5};
      ```
    blanks:
      - [int]
    answer: "`Boite<int>` : le type entre chevrons."
  - key: trous-parametre
    format: fill-in
    question: |-
      Complète avec le nom du paramètre de type utilisé par la classe :
      ```cpp
      template <typename ___>
      class Boite {
      private:
          T valeur_;
      };
      ```
    blanks:
      - [T]
    answer: "Le paramètre s'appelle `T`, comme dans la déclaration du membre."
  - key: trous-nom-complet
    format: fill-in
    question: |-
      Complète le nom de la classe dans la définition hors de la classe :
      ```cpp
      template <typename T>
      const T& Boite<___>::valeur() const {
          return valeur_;
      }
      ```
    blanks:
      - [T]
    answer: "`Boite<T>::valeur` : le nom de la classe porte son paramètre."
  - key: trous-non-type
    format: fill-in
    question: |-
      Complète avec le nom du paramètre non-type utilisé pour la taille :
      ```cpp
      template <typename T, std::size_t ___>
      class Tableau {
      private:
          T elements_[N];
      };
      ```
    blanks:
      - [N]
    answer: "`std::size_t N` : une valeur connue à la compilation, qui fixe la taille du tableau."
  - key: code-deux-instances
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      template <typename T>
      class Boite {
      public:
          explicit Boite(T valeur) : valeur_{valeur} {}
          const T& valeur() const { return valeur_; }

      private:
          T valeur_;
      };

      int main() {
          Boite<int> a{5};
          Boite<std::string> b{"abc"};
          std::println("{} {}", a.valeur() + 1, b.valeur() + "d");
      }
      ```
    choices:
      - {text: "`6 abcd`", correct: true}
      - {text: "`5 abc`", correct: false}
      - {text: "`51 abcd`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6 abcd` : deux classes générées à partir du même modèle. Dans l'une `T` est `int`, dans l'autre `std::string`."
    check:
      output: "6 abcd"
  - key: code-ctad
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T, typename U>
      struct Paire {
          T premier;
          U second;
      };

      int main() {
          Paire p{1, 2.5};
          std::println("{}", p.premier + p.second);
      }
      ```
    choices:
      - {text: "`3.5`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`12.5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3.5` : les deux paramètres sont déduits des valeurs. `p` est une `Paire<int, double>`, et la somme est un `double`."
    check:
      output: "3.5"
  - key: code-pile
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      class Pile {
      public:
          void empiler(T valeur) { elements_.push_back(valeur); }
          T depiler() {
              T dernier = elements_.back();
              elements_.pop_back();
              return dernier;
          }

      private:
          std::vector<T> elements_;
      };

      int main() {
          Pile<int> pile;
          pile.empiler(1);
          pile.empiler(2);
          pile.empiler(3);
          int a = pile.depiler();
          int b = pile.depiler();
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`3 2`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`2 3`", correct: false}
    answer: "`3 2` : la pile rend d'abord le dernier élément empilé. Le template s'appuie sur un `std::vector<T>`, lui-même un template."
    check:
      output: "3 2"
  - key: code-non-type
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename T, std::size_t N>
      class Tableau {
      public:
          std::size_t taille() const { return N; }

      private:
          T elements_[N]{};
      };

      int main() {
          Tableau<int, 3> a;
          Tableau<double, 8> b;
          std::println("{} {}", a.taille(), b.taille());
      }
      ```
    choices:
      - {text: "`3 8`", correct: true}
      - {text: "`4 8`", correct: false}
      - {text: "`12 64`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 8` : `N` est un paramètre non-type, fixé à la compilation pour chaque instance."
    check:
      output: "3 8"
  - key: bug-sans-argument
    format: bug-fix
    question: |-
      Le compilateur répond « class template argument deduction failed ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      class Pile {
      public:
          void empiler(T valeur) { elements_.push_back(valeur); }
          std::size_t taille() const { return elements_.size(); }

      private:
          std::vector<T> elements_;
      };

      int main() {
          Pile pile;
          pile.empiler(4);
          std::println("{}", pile.taille());
      }
      ```
    choices:
      - {text: "Écrire `Pile<int> pile;`", correct: true}
      - {text: "Écrire `Pile<> pile;`", correct: false}
      - {text: "Écrire `Pile pile{};`", correct: false}
      - {text: "Écrire `auto pile = Pile;`", correct: false}
    answer: |-
      ```cpp
      Pile<int> pile;
      ```
      Sans argument de constructeur, le compilateur n'a rien dont déduire `T`. Il faut nommer le type.
  - key: bug-instances-incompatibles
    format: bug-fix
    question: |-
      Ce code ne compile pas : `b = a;` est refusé. Pourquoi ?
      ```cpp
      #include <print>

      template <typename T>
      class Boite {
      public:
          explicit Boite(T valeur) : valeur_{valeur} {}
          const T& valeur() const { return valeur_; }

      private:
          T valeur_;
      };

      int main() {
          Boite<int> a{5};
          Boite<double> b{2.5};
          b = a;
          std::println("{}", b.valeur());
      }
      ```
    choices:
      - {text: "`Boite<int>` et `Boite<double>` sont deux types sans rapport", correct: true}
      - {text: "Un objet d'un template de classe ne peut jamais être affecté", correct: false}
      - {text: "Le constructeur `explicit` interdit toute affectation", correct: false}
      - {text: "`b` devrait être déclaré avant `a`", correct: false}
    answer: |-
      ```cpp
      b = Boite<double>{static_cast<double>(a.valeur())};
      ```
      Chaque instance du template est une classe à part : il n'existe pas d'affectation de l'une à l'autre, même si
      `int` se convertit en `double`. On construit une `Boite<double>` à partir de la valeur.
  - key: bug-definition-externe
    format: bug-fix
    question: |-
      Le compilateur refuse la définition de `valeur`, écrite hors de la classe. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      class Boite {
      public:
          explicit Boite(T valeur) : valeur_{valeur} {}
          const T& valeur() const;

      private:
          T valeur_;
      };

      const T& Boite::valeur() const {
          return valeur_;
      }

      int main() {
          Boite<int> boite{5};
          std::println("{}", boite.valeur());
      }
      ```
    choices:
      - {text: "Écrire `template <typename T>` devant, et `Boite<T>::valeur`", correct: true}
      - {text: "Écrire `const int& Boite::valeur() const`, avec le type utilisé", correct: false}
      - {text: "Écrire `const T& valeur() const`, sans le nom de la classe", correct: false}
      - {text: "Écrire la définition après la fonction `main`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      const T& Boite<T>::valeur() const {
          return valeur_;
      }
      ```
      Hors de la classe, `T` n'est plus connu, et `Boite` seul n'est pas un type. On répète l'en-tête du template, et
      on nomme la classe avec son paramètre.
  - key: bug-membre-non-defini
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `Boite<int>::valeur() const' ». Le corps
      de la fonction est dans un fichier `.cpp`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      class Boite {
      public:
          explicit Boite(T valeur) : valeur_{valeur} {}
          const T& valeur() const;

      private:
          T valeur_;
      };

      int main() {
          Boite<int> boite{5};
          std::println("{}", boite.valeur());
      }
      ```
    choices:
      - {text: "Définir la fonction dans l'en-tête, avec la classe", correct: true}
      - {text: "Déclarer la fonction avec le mot-clé `extern`", correct: false}
      - {text: "Déclarer la fonction avec le mot-clé `virtual`", correct: false}
      - {text: "Créer la boîte avec `Boite<int>* boite = new Boite<int>{5};`", correct: false}
    answer: |-
      ```cpp
      const T& valeur() const { return valeur_; }
      ```
      Le compilateur n'instancie `Boite<int>::valeur` que s'il en voit le corps dans le fichier qui l'appelle. Les
      fonctions membres d'un template vivent dans l'en-tête.
