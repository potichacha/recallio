notion: alias-templates
lesson: |-
  Deux petits outils rendent le code générique plus lisible : l'**alias de template** et la **variable template**.

  **L'alias de template (C++11).** Un `using` peut prendre des paramètres : il donne un nom court à une **famille**
  de types.

  ```cpp
  template <typename T>
  using Table = std::map<std::string, T>;

  Table<int> ages;            // std::map<std::string, int>
  Table<double> prix;         // std::map<std::string, double>
  ```

  `typedef` ne sait pas faire cela : il ne prend pas de paramètres.

  **Un alias n'est pas un nouveau type.** `Table<int>` **est** `std::map<std::string, int>` : les deux noms sont
  interchangeables, et une fonction ne peut pas être surchargée sur l'un et l'autre.

  **Il ne se spécialise pas.** Pour un cas particulier, on spécialise la classe qu'il désigne.

  **Les alias de la bibliothèque : `_t`.** Les traits de type exposent leur résultat dans un membre `type`, qu'il
  fallait écrire `typename std::remove_const<T>::type`. C++14 a ajouté un alias pour chacun :

  ```cpp
  template <typename T>
  using remove_const_t = typename remove_const<T>::type;
  ```

  D'où `std::remove_const_t<T>`, `std::decay_t<T>`, `std::conditional_t<C, A, B>`.

  **La variable template (C++14).** Une variable peut aussi être paramétrée :

  ```cpp
  template <typename T>
  constexpr T pi = T(3.14159265358979323846L);

  pi<float>;      // la constante en float
  pi<double>;     // en double
  ```

  Chaque argument donne une variable **distincte**. Comme une classe, une variable template accepte les
  spécialisations, totales et partielles.

  **Les variables de la bibliothèque : `_v`.** C++17 a fait pour `::value` ce que C++14 avait fait pour
  `::type` :

  ```cpp
  template <typename T>
  inline constexpr bool is_integral_v = is_integral<T>::value;
  ```

  D'où `std::is_integral_v<T>`, `std::is_same_v<A, B>`. Les constantes de `<numbers>` (C++20) sont aussi des
  variables template : `std::numbers::pi_v<float>`, avec `std::numbers::pi` pour `double`.

  **Dans un en-tête.** Une variable template `constexpr` définie dans un en-tête se déclare `inline constexpr`,
  pour n'exister qu'une fois dans le programme.

  **En entretien** : « Un alias de template, c'est un `using` paramétré : un autre nom pour une famille de types,
  sans créer de type nouveau. Une variable template est une variable paramétrée par un type. Ce sont eux qui
  donnent les suffixes `_t` et `_v` de la bibliothèque. »
cards:
  - key: alias
    format: course
    question: "Qu'est-ce qu'un alias de template ?"
    choices:
      - {text: "Un `using` paramétré, qui nomme une famille de types", correct: true}
      - {text: "Une classe dérivée d'un template, qui en fixe un paramètre", correct: false}
      - {text: "Une macro qui remplace un nom de type à la compilation", correct: false}
      - {text: "Une copie d'un template, instanciée une seule fois", correct: false}
    answer: "`template <typename T> using Table = std::map<std::string, T>;` : `Table<int>` s'écrit plus vite, et désigne exactement le même type."
  - key: pas-un-nouveau-type
    format: course
    question: "`Table<int>` est un alias de `std::map<std::string, int>`. Quel rapport ont les deux types ?"
    choices:
      - {text: "C'est le même type, sous deux noms", correct: true}
      - {text: "Ce sont deux types distincts, convertibles l'un en l'autre", correct: false}
      - {text: "Le premier dérive du second", correct: false}
      - {text: "Ce sont deux types distincts, sans rapport", correct: false}
    answer: "Un alias n'ajoute qu'un nom. On ne peut pas surcharger une fonction sur l'alias et sur le type d'origine."
  - key: variable-template
    format: course
    question: "Qu'est-ce qu'une variable template ?"
    choices:
      - {text: "Une variable paramétrée par un type, ou une valeur : `pi<float>`, `pi<double>`", correct: true}
      - {text: "Une variable dont le type change pendant l'exécution du programme", correct: false}
      - {text: "Une variable locale déclarée dans une fonction template", correct: false}
      - {text: "Une variable membre partagée par toutes les instanciations d'une classe", correct: false}
    answer: "Depuis C++14. Chaque argument donne une variable distincte. C'est ainsi que sont faits `std::is_integral_v<T>` et `std::numbers::pi_v<T>`."
  - key: suffixes
    format: course
    question: "Que désignent les suffixes `_t` et `_v` des traits de type ?"
    choices:
      - {text: "`_t` : un alias du membre `type`. `_v` : une variable qui vaut le membre `value`", correct: true}
      - {text: "`_t` : une variable qui vaut le membre `value`. `_v` : un alias du membre `type`", correct: false}
      - {text: "`_t` : la version pour les templates. `_v` : la version pour les variables", correct: false}
      - {text: "`_t` : la version testée. `_v` : la version vérifiée à l'exécution", correct: false}
    answer: "`std::remove_const_t<T>` remplace `typename std::remove_const<T>::type` ; `std::is_integral_v<T>` remplace `std::is_integral<T>::value`."
  - key: vf-typedef
    format: true-false
    question: "`typedef` peut prendre des paramètres de template, comme `using`."
    truth: false
    answer: "Seul `using` le peut. C'est une des raisons de le préférer à `typedef`."
  - key: vf-specialiser-alias
    format: true-false
    question: "Un alias de template peut être spécialisé."
    truth: false
    answer: "Non. On spécialise la classe template que l'alias désigne."
  - key: vf-specialiser-variable
    format: true-false
    question: "Une variable template peut être spécialisée."
    truth: true
    answer: "Totalement ou partiellement, comme une classe template."
  - key: vf-variables-distinctes
    format: true-false
    question: "`compteur<int>` et `compteur<char>` désignent la même variable."
    truth: false
    answer: "Chaque argument instancie sa propre variable, avec sa propre valeur."
  - key: qcm-ecrire-alias
    format: multiple-choice
    question: "Quelle ligne définit `Liste<T>` comme un autre nom de `std::vector<T>` ?"
    choices:
      - {text: "`template <typename T> using Liste = std::vector<T>;`", correct: true}
      - {text: "`template <typename T> typedef std::vector<T> Liste;`", correct: false}
      - {text: "`using Liste<T> = std::vector<T>;`", correct: false}
      - {text: "`template <typename T> class Liste = std::vector<T>;`", correct: false}
    answer: "`template <...>`, puis `using Nom = type;`. Un `typedef` ne peut pas être un template."
  - key: qcm-ecrire-variable
    format: multiple-choice
    question: "Quelle ligne définit une variable template `zero` valant la valeur nulle de `T` ?"
    choices:
      - {text: "`template <typename T> constexpr T zero = T{};`", correct: true}
      - {text: "`template <typename T> using zero = T{};`", correct: false}
      - {text: "`constexpr auto zero<T> = T{};`", correct: false}
      - {text: "`template <typename T> T zero() = T{};`", correct: false}
    answer: "Une déclaration de variable, précédée de `template <...>`. On l'utilise avec `zero<int>`, `zero<double>`."
  - key: qcm-pi
    format: multiple-choice
    question: "Quelle expression donne la constante π en `float`, avec `<numbers>` ?"
    choices:
      - {text: "`std::numbers::pi_v<float>`", correct: true}
      - {text: "`std::numbers::pi<float>`", correct: false}
      - {text: "`std::numbers::pi_t<float>`", correct: false}
      - {text: "`std::pi<float>()`", correct: false}
    answer: "`pi_v` est la variable template ; `std::numbers::pi` est sa version `double`."
  - key: qcm-equivalent
    format: multiple-choice
    question: "Que remplace `std::is_same_v<A, B>` ?"
    choices:
      - {text: "`std::is_same<A, B>::value`", correct: true}
      - {text: "`std::is_same<A, B>::type`", correct: false}
      - {text: "`typename std::is_same<A, B>`", correct: false}
      - {text: "`std::is_same<A, B>()`", correct: false}
    answer: "Une variable template `inline constexpr bool`, qui lit le membre statique `value` du trait."
  - key: trous-using
    format: fill-in
    question: |-
      Complète pour définir un alias de template :
      ```cpp
      template <typename T>
      ___ Table = std::map<std::string, T>;
      ```
    blanks:
      - [using]
    answer: "`using Nom = type;`, précédé de la liste de paramètres."
  - key: trous-t
    format: fill-in
    question: |-
      Complète avec l'alias standard qui remplace `typename std::remove_const<T>::type` :
      ```cpp
      std::remove_const___<T> copie = valeur;
      ```
    blanks:
      - [_t]
    answer: "Le suffixe `_t` désigne l'alias du membre `type`."
  - key: trous-v
    format: fill-in
    question: |-
      Complète avec la variable standard qui remplace `std::is_integral<T>::value` :
      ```cpp
      if (std::is_integral___<T>) {
          std::println("entier");
      }
      ```
    blanks:
      - [_v]
    answer: "Le suffixe `_v` désigne la variable template qui vaut le membre `value`."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que la variable template soit une constante de compilation :
      ```cpp
      template <typename T>
      ___ T pi = T(3.14159265358979323846L);
      ```
    blanks:
      - [constexpr, "inline constexpr"]
    answer: "`constexpr` : la valeur est connue à la compilation, pour chaque `T`."
  - key: code-alias-meme-type
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>
      #include <type_traits>

      template <typename T>
      using Table = std::map<std::string, T>;

      int main() {
          Table<int> ages{{"Ada", 36}};
          std::println("{} {}", std::is_same_v<Table<int>, std::map<std::string, int>>, ages.at("Ada"));
      }
      ```
    choices:
      - {text: "`true 36`", correct: true}
      - {text: "`false 36`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "`false 0`", correct: false}
    answer: "`true 36` : l'alias n'est qu'un autre nom. `Table<int>` est le type `std::map<std::string, int>` lui-même."
    check:
      output: "true 36"
  - key: code-variable-template
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      constexpr T moitie = T(1) / T(2);

      int main() {
          std::println("{} {}", moitie<int>, moitie<double>);
      }
      ```
    choices:
      - {text: "`0 0.5`", correct: true}
      - {text: "`0.5 0.5`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "`1 0.5`", correct: false}
    answer: "`0 0.5` : chaque instanciation fait son calcul dans son type. En `int`, 1 / 2 vaut 0."
    check:
      output: "0 0.5"
  - key: code-variables-distinctes
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      int compteur = 0;

      int main() {
          ++compteur<int>;
          ++compteur<int>;
          ++compteur<char>;
          std::println("{} {} {}", compteur<int>, compteur<char>, compteur<long>);
      }
      ```
    choices:
      - {text: "`2 1 0`", correct: true}
      - {text: "`3 3 3`", correct: false}
      - {text: "`2 1 1`", correct: false}
      - {text: "`1 1 0`", correct: false}
    answer: "`2 1 0` : chaque argument a sa propre variable. `compteur<long>` n'a jamais été modifiée."
    check:
      output: "2 1 0"
  - key: code-specialisation-variable
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      constexpr bool est_pointeur = false;

      template <typename T>
      constexpr bool est_pointeur<T*> = true;

      int main() {
          std::println("{} {} {}", est_pointeur<int>, est_pointeur<int*>, est_pointeur<const char*>);
      }
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`false true false`", correct: false}
      - {text: "`false false false`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`false true true` : la spécialisation partielle `est_pointeur<T*>` vaut pour tous les pointeurs. C'est ainsi qu'on écrirait `std::is_pointer_v`."
    check:
      output: "false true true"
  - key: bug-typedef-template
    format: bug-fix
    question: |-
      Le compilateur répond « template declaration of 'typedef' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      typedef std::vector<T> Liste;

      int main() {
          Liste<int> valeurs{1, 2, 3};
          std::println("{}", valeurs.size());
      }
      ```
    choices:
      - {text: "Écrire `using Liste = std::vector<T>;` sous la ligne `template`", correct: true}
      - {text: "Écrire `typedef std::vector Liste;` sans la ligne `template`", correct: false}
      - {text: "Écrire `typedef std::vector<T> Liste<T>;` sous la ligne `template`", correct: false}
      - {text: "Écrire `#define Liste std::vector<T>` sans la ligne `template`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      using Liste = std::vector<T>;
      ```
      `typedef` ne peut pas être paramétré. C'est `using` qui sait définir un alias de template.
  - key: bug-arguments-oublies
    format: bug-fix
    question: |-
      Le compilateur refuse `Table ages;` : « class template argument deduction failed ». Quelle correction est la
      bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      template <typename T>
      using Table = std::map<std::string, T>;

      int main() {
          Table ages;
          ages["Ada"] = 36;
          std::println("{}", ages.size());
      }
      ```
    choices:
      - {text: "Déclarer `Table<int> ages;`", correct: true}
      - {text: "Déclarer `Table<> ages;`", correct: false}
      - {text: "Déclarer `auto ages = Table;`", correct: false}
      - {text: "Déclarer `Table<std::string> ages;`", correct: false}
    answer: |-
      ```cpp
      Table<int> ages;
      ```
      Sans valeur initiale, rien ne permet de déduire `T`. On le donne : ici la valeur associée est un entier.
  - key: bug-surcharge-sur-alias
    format: bug-fix
    question: |-
      Le compilateur signale une « redefinition » de la fonction `afficher` : les deux versions ont le même
      paramètre. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      using Liste = std::vector<T>;

      void afficher(const std::vector<int>&) {
          std::println("vecteur");
      }

      void afficher(const Liste<int>&) {
          std::println("liste");
      }

      int main() {
          afficher(Liste<int>{});
      }
      ```
    choices:
      - {text: "Ne garder qu'une des deux fonctions : `Liste<int>` est `std::vector<int>`", correct: true}
      - {text: "Déclarer la seconde fonction `inline`, pour autoriser les deux", correct: false}
      - {text: "Remplacer `using` par `typedef` dans la définition de l'alias", correct: false}
      - {text: "Déclarer la seconde fonction `template <>`, pour la spécialiser", correct: false}
    answer: |-
      ```cpp
      void afficher(const std::vector<int>&) {
          std::println("vecteur");
      }
      ```
      Un alias ne crée pas de type : les deux signatures sont identiques. Pour un type vraiment distinct, on
      définit une `struct` qui contient le vecteur.
  - key: bug-variable-sans-argument
    format: bug-fix
    question: |-
      Le compilateur refuse `pi * 2` : `pi` est une variable template, utilisée sans argument. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      constexpr T pi = T(3.14159265358979323846L);

      int main() {
          const double perimetre = pi * 2;
          std::println("{:.2f}", perimetre);
      }
      ```
    choices:
      - {text: "Écrire `pi<double> * 2`", correct: true}
      - {text: "Écrire `pi() * 2`", correct: false}
      - {text: "Écrire `pi::value * 2`", correct: false}
      - {text: "Écrire `typename pi * 2`", correct: false}
    answer: |-
      ```cpp
      const double perimetre = pi<double> * 2;
      ```
      Une variable template n'est pas une variable tant qu'on n'a pas donné ses arguments : il n'y a pas de
      déduction ici.
