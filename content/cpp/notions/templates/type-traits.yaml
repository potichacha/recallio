notion: type-traits
lesson: |-
  L'en-tête `<type_traits>` contient des **traits de type** : de petits templates qui **interrogent** ou
  **transforment** un type, à la compilation. Ils ne coûtent rien à l'exécution.

  **Interroger : un booléen.** Le résultat est dans le membre `value`, ou dans la variable `_v` (C++17).

  ```cpp
  std::is_integral<int>::value        // true
  std::is_integral_v<double>          // false
  ```

  | Trait | Question |
  |---|---|
  | `is_integral_v<T>`, `is_floating_point_v<T>`, `is_arithmetic_v<T>` | quel genre de nombre ? |
  | `is_pointer_v<T>`, `is_reference_v<T>`, `is_array_v<T>` | quelle forme de type ? |
  | `is_const_v<T>` | `T` est-il `const` ? |
  | `is_class_v<T>`, `is_enum_v<T>` | une classe ? une énumération ? |
  | `is_same_v<A, B>` | le même type ? |
  | `is_base_of_v<Base, Derivee>` | `Derivee` dérive-t-elle de `Base` ? |
  | `is_convertible_v<De, Vers>` | une conversion implicite existe-t-elle ? |
  | `is_trivially_copyable_v<T>` | peut-on le copier octet par octet ? |
  | `is_nothrow_move_constructible_v<T>` | son déplacement est-il `noexcept` ? |

  **Transformer : un type.** Le résultat est dans le membre `type`, ou dans l'alias `_t` (C++14).

  | Trait | Résultat |
  |---|---|
  | `remove_const_t<const int>` | `int` |
  | `remove_reference_t<int&>` | `int` |
  | `remove_cvref_t<const int&>` (C++20) | `int` |
  | `add_const_t<int>`, `add_pointer_t<int>` | `const int`, `int*` |
  | `decay_t<const int&>`, `decay_t<int[3]>` | `int`, `int*` : ce que devient un argument passé par valeur |
  | `make_unsigned_t<int>` | `unsigned int` |
  | `underlying_type_t<Couleur>` | le type entier d'une énumération |
  | `conditional_t<Condition, A, B>` | `A` si la condition est vraie, sinon `B` |
  | `common_type_t<int, double>` | `double` |

  **Attention aux références.** `std::is_const_v<const int&>` vaut `false` : une référence n'est jamais `const`
  elle-même. On retire d'abord la référence : `std::is_const_v<std::remove_reference_t<T>>`.

  **Où s'en servir.**

  ```cpp
  static_assert(std::is_trivially_copyable_v<Paquet>, "Paquet doit se copier par memcpy");

  template <typename T>
  void ecrire(const T& valeur) {
      if constexpr (std::is_integral_v<T>) { /* ... */ } else { /* ... */ }
  }
  ```

  Avec `static_assert`, `if constexpr`, `std::enable_if`, ou dans la définition d'un concept :
  `std::integral<T>` n'est rien d'autre que `std::is_integral_v<T>`.

  **Comment c'est fait.** Un trait est un template primaire et des spécialisations. `std::is_pointer` : le primaire
  dérive de `std::false_type`, la spécialisation partielle pour `T*` de `std::true_type`. Certains traits
  (`is_class`, `is_trivially_copyable`) demandent l'aide du compilateur.

  **En entretien** : « Les traits de `<type_traits>` répondent à une question sur un type (`is_integral_v`,
  `is_same_v`) ou en fabriquent un autre (`remove_const_t`, `decay_t`), à la compilation. Je m'en sers avec
  `static_assert` et `if constexpr`, et ils sont la base des concepts. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un trait de type ?"
    choices:
      - {text: "Un template qui interroge ou transforme un type, à la compilation", correct: true}
      - {text: "Une fonction qui donne le nom d'un type, à l'exécution", correct: false}
      - {text: "Une classe de base dont héritent tous les types d'un programme", correct: false}
      - {text: "Un attribut que le compilateur ajoute aux types fondamentaux", correct: false}
    answer: "`std::is_integral_v<T>` répond par un booléen ; `std::remove_const_t<T>` fabrique un type. Tout est résolu par le compilateur."
  - key: value-et-type
    format: course
    question: "Comment lit-on le résultat d'un trait qui interroge, et celui d'un trait qui transforme ?"
    choices:
      - {text: "Le premier dans `value` ou `_v` ; le second dans `type` ou `_t`", correct: true}
      - {text: "Le premier dans `type` ou `_t` ; le second dans `value` ou `_v`", correct: false}
      - {text: "Les deux dans `value`, à convertir ensuite", correct: false}
      - {text: "Les deux en appelant le trait comme une fonction", correct: false}
    answer: "`std::is_pointer_v<T>` est un `bool` ; `std::remove_reference_t<T>` est un type."
  - key: decay
    format: course
    question: "Que fait `std::decay_t<T>` ?"
    choices:
      - {text: "Il donne le type qu'aurait un argument passé par valeur : sans référence ni `const`, tableau devenu pointeur", correct: true}
      - {text: "Il donne le type le plus petit capable de contenir toutes les valeurs de `T`, sans perte", correct: false}
      - {text: "Il donne le type de base dont `T` hérite, ou `T` lui-même s'il n'hérite de rien", correct: false}
      - {text: "Il donne le type `T` privé de tous ses membres, pour en réduire la taille", correct: false}
    answer: "`std::decay_t<const int&>` est `int` ; `std::decay_t<int[3]>` est `int*`. C'est la transformation que subit un argument reçu par valeur."
  - key: reference-const
    format: course
    question: "Pourquoi `std::is_const_v<const int&>` vaut-il `false` ?"
    choices:
      - {text: "Une référence n'est jamais `const` elle-même : c'est le type désigné qui l'est", correct: true}
      - {text: "Le trait `is_const` ne fonctionne qu'avec les classes", correct: false}
      - {text: "Le `const` d'un paramètre de template est toujours ignoré", correct: false}
      - {text: "Le trait `is_const` teste si la valeur est connue à la compilation", correct: false}
    answer: "On retire d'abord la référence : `std::is_const_v<std::remove_reference_t<const int&>>` vaut `true`."
  - key: vf-execution
    format: true-false
    question: "Un trait de type est évalué pendant l'exécution du programme."
    truth: false
    answer: "Il est résolu à la compilation. On peut s'en servir dans un `static_assert` ou un `if constexpr`."
  - key: vf-is-same
    format: true-false
    question: "`std::is_same_v<int, const int>` vaut `true`."
    truth: false
    answer: "`int` et `const int` sont deux types différents. `std::is_same_v<int, std::remove_const_t<const int>>` vaut `true`."
  - key: vf-base-of
    format: true-false
    question: "Dans `std::is_base_of_v<A, B>`, la classe de base est le premier argument."
    truth: true
    answer: "« `A` est-elle une base de `B` ? ». C'est l'ordre inverse du concept `std::derived_from<B, A>`."
  - key: vf-concepts
    format: true-false
    question: "Le concept `std::integral<T>` s'appuie sur le trait `std::is_integral_v<T>`."
    truth: true
    answer: "Beaucoup de concepts standard sont des traits rhabillés."
  - key: qcm-retirer-reference
    format: multiple-choice
    question: "Quel trait transforme `int&` en `int` ?"
    choices:
      - {text: "`std::remove_reference_t`", correct: true}
      - {text: "`std::remove_const_t`", correct: false}
      - {text: "`std::add_pointer_t`", correct: false}
      - {text: "`std::is_reference_v`", correct: false}
    answer: "`std::remove_reference_t<int&>` est `int`. `std::is_reference_v` interroge, sans rien transformer."
  - key: qcm-conditionnel
    format: multiple-choice
    question: "Quel trait choisit entre deux types selon un booléen de compilation ?"
    choices:
      - {text: "`std::conditional_t`", correct: true}
      - {text: "`std::common_type_t`", correct: false}
      - {text: "`std::enable_if_t`", correct: false}
      - {text: "`std::decay_t`", correct: false}
    answer: "`std::conditional_t<Condition, A, B>` vaut `A` ou `B`. `std::enable_if_t` vaut un type ou n'existe pas."
  - key: qcm-memcpy
    format: multiple-choice
    question: "Quel trait dit si un type peut être copié par `std::memcpy` ?"
    choices:
      - {text: "`std::is_trivially_copyable_v`", correct: true}
      - {text: "`std::is_copy_constructible_v`", correct: false}
      - {text: "`std::is_class_v`", correct: false}
      - {text: "`std::is_arithmetic_v`", correct: false}
    answer: "Trivialement copiable : la copie octet par octet donne un objet valide. `is_copy_constructible` dit seulement qu'un constructeur de copie existe."
  - key: qcm-enum
    format: multiple-choice
    question: "Quel trait donne le type entier sur lequel repose une énumération ?"
    choices:
      - {text: "`std::underlying_type_t`", correct: true}
      - {text: "`std::make_unsigned_t`", correct: false}
      - {text: "`std::is_enum_v`", correct: false}
      - {text: "`std::remove_cvref_t`", correct: false}
    answer: "`std::underlying_type_t<Couleur>` : `int` par défaut pour une `enum class`. En C++23, `std::to_underlying(valeur)` fait la conversion."
  - key: trous-v
    format: fill-in
    question: |-
      Complète pour tester à la compilation que `T` est un type entier :
      ```cpp
      static_assert(std::is_integral___<T>, "T doit être un entier");
      ```
    blanks:
      - [_v]
    answer: "`std::is_integral_v<T>` : la variable template qui vaut `::value`."
  - key: trous-remove-const
    format: fill-in
    question: |-
      Complète pour obtenir le type `T` sans son `const` :
      ```cpp
      std::___<T> copie = valeur;
      ```
    blanks:
      - [remove_const_t]
    answer: "`std::remove_const_t<const int>` est `int`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête qui déclare `std::is_same_v` et `std::decay_t` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [type_traits]
    answer: "`<type_traits>`."
  - key: trous-is-same
    format: fill-in
    question: |-
      Complète pour vérifier que les deux types sont identiques :
      ```cpp
      static_assert(std::___<int, std::remove_const_t<const int>>);
      ```
    blanks:
      - [is_same_v]
    answer: "`std::is_same_v<A, B>` vaut `true` quand `A` et `B` sont le même type."
  - key: code-interroger
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          std::println("{} {} {} {}",
                       std::is_integral_v<char>,
                       std::is_floating_point_v<int>,
                       std::is_pointer_v<int*>,
                       std::is_same_v<int, const int>);
      }
      ```
    choices:
      - {text: "`true false true false`", correct: true}
      - {text: "`false false true false`", correct: false}
      - {text: "`true false true true`", correct: false}
      - {text: "`true true true false`", correct: false}
    answer: "`true false true false` : `char` est un type entier ; `int` et `const int` sont deux types distincts."
    check:
      output: "true false true false"
  - key: code-transformer
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          std::println("{} {} {}",
                       std::is_same_v<std::remove_const_t<const int>, int>,
                       std::is_same_v<std::remove_reference_t<const int&>, int>,
                       std::is_same_v<std::decay_t<const int&>, int>);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: "`true false true` : retirer la référence de `const int&` laisse `const int`. `std::decay_t` retire la référence et le `const`."
    check:
      output: "true false true"
  - key: code-const-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          std::println("{} {} {}",
                       std::is_const_v<const int>,
                       std::is_const_v<const int&>,
                       std::is_const_v<std::remove_reference_t<const int&>>);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: "`true false true` : une référence n'est pas `const` elle-même. Il faut la retirer pour interroger le type désigné."
    check:
      output: "true false true"
  - key: code-if-constexpr
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <type_traits>

      template <typename T>
      const char* famille(const T&) {
          if constexpr (std::is_arithmetic_v<T>) {
              return "nombre";
          } else if constexpr (std::is_class_v<T>) {
              return "classe";
          } else {
              return "autre";
          }
      }

      int main() {
          int n = 0;
          std::println("{} {} {}", famille(2.5), famille(std::string{}), famille(&n));
      }
      ```
    choices:
      - {text: "`nombre classe autre`", correct: true}
      - {text: "`nombre classe nombre`", correct: false}
      - {text: "`nombre autre autre`", correct: false}
      - {text: "`classe classe autre`", correct: false}
    answer: "`nombre classe autre` : chaque instanciation ne garde que la branche vraie. `std::string` est une classe ; un pointeur n'est ni un nombre ni une classe."
    check:
      output: "nombre classe autre"
  - key: bug-value-oublie
    format: bug-fix
    question: |-
      Le compilateur refuse la condition du `static_assert` : `std::is_integral<int>` est un type, pas un booléen.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          static_assert(std::is_integral<int>);
          std::println("ok");
      }
      ```
    choices:
      - {text: "Écrire `std::is_integral_v<int>`", correct: true}
      - {text: "Écrire `std::is_integral_t<int>`", correct: false}
      - {text: "Écrire `std::is_integral<int>::type`", correct: false}
      - {text: "Écrire `typename std::is_integral<int>`", correct: false}
    answer: |-
      ```cpp
      static_assert(std::is_integral_v<int>);
      ```
      Le trait est une structure. Son résultat est le membre statique `value`, que donne la variable `_v`.
  - key: bug-typename-type
    format: bug-fix
    question: |-
      Le compilateur répond « need 'typename' before 'std::remove_const<T>::type' because
      'std::remove_const<T>' is a dependent scope ». Quelle correction est la plus simple ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      auto copie_modifiable(const T& valeur) {
          std::remove_const<T>::type copie = valeur;
          ++copie;
          return copie;
      }

      int main() {
          std::println("{}", copie_modifiable<const int>(4));
      }
      ```
    choices:
      - {text: "Écrire `std::remove_const_t<T> copie = valeur;`", correct: true}
      - {text: "Écrire `std::remove_const_v<T> copie = valeur;`", correct: false}
      - {text: "Écrire `std::remove_const<T> copie = valeur;`", correct: false}
      - {text: "Écrire `std::remove_const<T>::value copie = valeur;`", correct: false}
    answer: |-
      ```cpp
      std::remove_const_t<T> copie = valeur;
      ```
      Le membre `type` dépend de `T` : il faudrait écrire `typename` devant. L'alias `_t` le cache.
  - key: bug-const-reference
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : l'argument est constant. Il affiche `false`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      template <typename T>
      bool est_constant(T&&) {
          return std::is_const_v<T>;
      }

      int main() {
          const int limite = 10;
          std::println("{}", est_constant(limite));
      }
      ```
    choices:
      - {text: "Tester `std::is_const_v<std::remove_reference_t<T>>`", correct: true}
      - {text: "Tester `std::is_const_v<std::decay_t<T>>`", correct: false}
      - {text: "Tester `std::is_const_v<std::add_const_t<T>>`", correct: false}
      - {text: "Tester `std::is_const_v<T&>`", correct: false}
    answer: |-
      ```cpp
      return std::is_const_v<std::remove_reference_t<T>>;
      ```
      Pour une variable, `T` est déduit en `const int&`, et une référence n'est jamais `const`. On retire la
      référence d'abord. `std::decay_t` retirerait aussi le `const` : la réponse serait toujours `false`.
  - key: bug-base-of-inverse
    format: bug-fix
    question: |-
      Le `static_assert` échoue, alors que `Cercle` dérive bien de `Forme`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <type_traits>

      struct Forme {};
      struct Cercle : Forme {};

      int main() {
          static_assert(std::is_base_of_v<Cercle, Forme>);
          std::println("ok");
      }
      ```
    choices:
      - {text: "Écrire `std::is_base_of_v<Forme, Cercle>`", correct: true}
      - {text: "Écrire `std::is_same_v<Forme, Cercle>`", correct: false}
      - {text: "Écrire `std::is_class_v<Cercle, Forme>`", correct: false}
      - {text: "Écrire `std::is_base_of_v<Cercle, Cercle*>`", correct: false}
    answer: |-
      ```cpp
      static_assert(std::is_base_of_v<Forme, Cercle>);
      ```
      `std::is_base_of_v<Base, Derivee>` : la base vient en premier. Écrit à l'envers, il demande si `Cercle` est
      une base de `Forme`.
