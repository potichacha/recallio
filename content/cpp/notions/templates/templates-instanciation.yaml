notion: templates-instanciation
lesson: |-
  Un template n'est **pas du code** : c'est un **modèle** à partir duquel le compilateur fabrique du code. Tant que
  personne ne s'en sert, il ne produit rien dans le fichier objet.

  **L'instanciation.** Quand le compilateur rencontre `maximum(3, 7)`, il **génère** une fonction réelle,
  `maximum<int>`, en remplaçant `T` par `int`. Cette génération s'appelle l'**instanciation**. Elle a lieu une
  fois par jeu d'arguments, dans **chaque unité de traduction** qui s'en sert.

  ```cpp
  template <typename T>
  T maximum(T a, T b) { return a < b ? b : a; }

  maximum(3, 7);         // instancie maximum<int>
  maximum(2.5, 1.0);     // instancie maximum<double> : une seconde fonction
  ```

  **Pourquoi un template vit dans l'en-tête.** Pour instancier, le compilateur a besoin du **corps** du template,
  à l'endroit de l'appel. Or il compile chaque `.cpp` séparément.

  ```cpp
  // outils.hpp : seulement la déclaration
  template <typename T> T maximum(T a, T b);

  // outils.cpp : la définition
  template <typename T> T maximum(T a, T b) { return a < b ? b : a; }

  // main.cpp
  maximum(3, 7);         // undefined reference to `int maximum<int>(int, int)'
  ```

  Dans `main.cpp`, le compilateur voit l'appel mais pas le corps : il ne peut rien générer, et note un symbole
  manquant. Dans `outils.cpp`, il voit le corps mais personne ne demande `int` : il ne génère rien non plus.
  L'éditeur de liens ne trouve la fonction nulle part.

  Le remède : **définir le template dans l'en-tête**. Chaque fichier qui l'inclut peut alors l'instancier.

  **Et la règle de la définition unique ?** Plusieurs `.cpp` instancient `maximum<int>` : la fonction existe dans
  plusieurs fichiers objets. C'est permis : les instanciations de template sont traitées comme des fonctions
  `inline`, et l'éditeur de liens n'en garde **qu'une**.

  **Ce que cela coûte.**

  - Le **temps de compilation** : chaque unité de traduction relit et réinstancie le template.
  - La **taille du binaire** : une fonction par type utilisé. C'est le *code bloat*.
  - Les **erreurs tardives** : une faute qui dépend de `T` n'apparaît qu'à l'instanciation, avec un message qui
    remonte toute la chaîne.

  **Seul ce qui est utilisé est instancié.** D'un template de classe, le compilateur ne génère que les fonctions
  membres **appelées**. Une fonction membre que le type ne permet pas ne gêne pas, tant qu'on ne l'appelle pas.

  **L'instanciation explicite.** On peut garder la définition dans un `.cpp`, à condition d'y demander soi-même
  les versions voulues :

  ```cpp
  // outils.cpp
  template int maximum<int>(int, int);    // instanciation explicite
  ```

  Le template ne sert alors que pour ces types. `extern template` dit l'inverse : « ne l'instancie pas ici, elle
  existe ailleurs », pour gagner du temps de compilation.

  **En entretien** : « Un template est instancié à l'endroit où l'on s'en sert, et le compilateur a besoin de son
  corps à ce moment-là : d'où sa place dans l'en-tête. Sinon, c'est une `undefined reference` à l'édition de
  liens. Les instanciations multiples sont fusionnées, comme des fonctions `inline`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce que l'instanciation d'un template ?"
    choices:
      - {text: "La génération, par le compilateur, du code réel pour des arguments de template donnés", correct: true}
      - {text: "La création, à l'exécution, d'un objet d'une classe template avec `new`", correct: false}
      - {text: "La recopie de l'en-tête du template par le préprocesseur", correct: false}
      - {text: "La vérification de la syntaxe du template, avant tout appel", correct: false}
    answer: "`maximum(3, 7)` fait générer `maximum<int>`. Sans utilisation, un template ne produit aucun code."
  - key: en-tete
    format: course
    question: "Pourquoi la définition d'un template se place-t-elle dans l'en-tête ?"
    choices:
      - {text: "Le compilateur a besoin du corps du template là où il l'instancie, dans chaque fichier source", correct: true}
      - {text: "L'éditeur de liens ne sait lire que les fichiers d'en-tête, pas les fichiers objets", correct: false}
      - {text: "Un template ne peut pas contenir d'instruction, seulement des déclarations", correct: false}
      - {text: "Le préprocesseur refuse le mot-clé `template` dans un fichier source", correct: false}
    answer: "Chaque `.cpp` est compilé seul. S'il ne voit que la déclaration, il ne peut pas générer la fonction pour le type demandé."
  - key: erreur
    format: course
    question: "Un template est déclaré dans un en-tête et défini dans un `.cpp`. Que se passe-t-il quand un autre fichier l'appelle ?"
    choices:
      - {text: "L'édition de liens échoue : « undefined reference »", correct: true}
      - {text: "La compilation échoue : « template not declared »", correct: false}
      - {text: "Le programme compile, et plante à l'exécution", correct: false}
      - {text: "Le programme compile et fonctionne normalement", correct: false}
    answer: "Le fichier appelant n'a pas le corps ; le fichier qui a le corps ne sait pas quel type instancier. La fonction n'existe nulle part."
  - key: odr
    format: course
    question: "Trois fichiers source instancient `maximum<int>`. Pourquoi l'éditeur de liens ne signale-t-il pas « multiple definition » ?"
    choices:
      - {text: "Les instanciations sont traitées comme des fonctions `inline` : une seule est gardée", correct: true}
      - {text: "Le compilateur n'instancie le template que dans le premier fichier compilé", correct: false}
      - {text: "Chaque instanciation reçoit un nom différent, propre à son fichier", correct: false}
      - {text: "Les templates ne produisent aucun symbole dans les fichiers objets", correct: false}
    answer: "La règle de la définition unique fait une exception pour les templates et les fonctions `inline` : des définitions identiques sont fusionnées."
  - key: vf-sans-usage
    format: true-false
    question: "Un template de fonction que personne n'appelle ne produit aucun code dans le fichier objet."
    truth: true
    answer: "Sans instanciation, il n'y a pas de fonction à générer."
  - key: vf-une-fonction
    format: true-false
    question: "`maximum(3, 7)` et `maximum(2.5, 1.0)` appellent la même fonction dans le binaire."
    truth: false
    answer: "Ce sont deux instanciations : `maximum<int>` et `maximum<double>`, deux fonctions distinctes."
  - key: vf-membres
    format: true-false
    question: "D'un template de classe, seules les fonctions membres réellement appelées sont instanciées."
    truth: true
    answer: "Une fonction membre que le type ne permet pas ne pose problème que si on l'appelle."
  - key: vf-cpp
    format: true-false
    question: "Un template ne peut jamais être défini dans un fichier `.cpp`."
    truth: false
    answer: "C'est possible avec une instanciation explicite, qui génère dans ce fichier les versions voulues. Le template n'est alors utilisable que pour ces types."
  - key: qcm-explicite
    format: multiple-choice
    question: "Quelle ligne, dans `outils.cpp`, instancie explicitement `maximum` pour `int` ?"
    choices:
      - {text: "`template int maximum<int>(int, int);`", correct: true}
      - {text: "`extern template int maximum<int>(int, int);`", correct: false}
      - {text: "`inline int maximum<int>(int, int);`", correct: false}
      - {text: "`using maximum<int>;`", correct: false}
    answer: "`template` suivi de la signature complète force la génération dans ce fichier. `extern template` demande au contraire de ne pas instancier ici."
  - key: qcm-cout
    format: multiple-choice
    question: "Quel est le coût principal d'un template défini dans un en-tête inclus par cent fichiers ?"
    choices:
      - {text: "Le temps de compilation : chaque fichier relit et réinstancie le template", correct: true}
      - {text: "Le temps d'exécution : chaque appel passe par une table de fonctions", correct: false}
      - {text: "La mémoire à l'exécution : cent copies de chaque objet", correct: false}
      - {text: "Le nombre de threads : un par fichier source", correct: false}
    answer: "À l'exécution, un template ne coûte rien de plus qu'une fonction écrite à la main. C'est la compilation qui paie."
  - key: qcm-moment-erreur
    format: multiple-choice
    question: "Quand le compilateur signale-t-il qu'un type n'a pas l'opérateur `<` dont un template a besoin ?"
    choices:
      - {text: "À l'instanciation du template avec ce type", correct: true}
      - {text: "À la lecture de la définition du template", correct: false}
      - {text: "À l'édition de liens", correct: false}
      - {text: "À l'exécution du programme", correct: false}
    answer: "Tant que `T` est inconnu, le compilateur ne peut pas savoir si `a < b` est valide. Il le vérifie quand il génère le code pour un type précis."
  - key: qcm-extern
    format: multiple-choice
    question: "À quoi sert `extern template class std::vector<Commande>;` dans un en-tête ?"
    choices:
      - {text: "À ne pas réinstancier ce template dans chaque fichier : il l'est ailleurs", correct: true}
      - {text: "À rendre le template visible depuis un autre programme", correct: false}
      - {text: "À interdire l'usage du template avec ce type", correct: false}
      - {text: "À convertir le template en fonction `inline`", correct: false}
    answer: "C'est une déclaration d'instanciation explicite : elle fait gagner du temps de compilation. Un fichier source doit contenir l'instanciation correspondante."
  - key: situation-undefined
    format: scenario
    question: |-
      Un collègue range proprement son template `Pile<T>` : la classe dans `pile.hpp`, le corps des fonctions
      membres dans `pile.cpp`. `main.cpp` utilise `Pile<int>`, et l'édition de liens échoue : « undefined reference
      to `Pile<int>::empiler(int)' ». Que lui proposes-tu ?
    choices:
      - {text: "De définir les fonctions membres dans `pile.hpp`", correct: true}
      - {text: "D'ajouter `pile.hpp` à la commande de compilation", correct: false}
      - {text: "De marquer les fonctions membres `static` dans `pile.cpp`", correct: false}
      - {text: "D'inclure `pile.hpp` deux fois dans `main.cpp`", correct: false}
    answer: |-
      Le découpage en-tête et source, bon pour le code ordinaire, ne convient pas à un template : `main.cpp` doit
      voir le corps des fonctions pour les instancier avec `int`. Tout va dans l'en-tête.
  - key: situation-compilation-lente
    format: scenario
    question: |-
      Un projet met vingt minutes à compiler. Un gros template, défini dans un en-tête inclus partout, est instancié
      avec les trois mêmes types dans des centaines de fichiers. Que proposes-tu ?
    choices:
      - {text: "Des instanciations explicites dans un `.cpp`, déclarées `extern template` dans l'en-tête", correct: true}
      - {text: "Le remplacement du template par une macro du préprocesseur", correct: false}
      - {text: "La suppression des gardes d'inclusion de l'en-tête", correct: false}
      - {text: "La compilation de tous les fichiers avec `-O0`", correct: false}
    answer: |-
      Chaque fichier refait le même travail. `extern template` leur dit de ne pas instancier ; un seul fichier
      source génère les trois versions. Le coût est payé une fois.
  - key: situation-binaire
    format: scenario
    question: |-
      Après l'ajout d'un template instancié avec quarante types différents, l'exécutable a grossi de plusieurs
      mégaoctets. Pourquoi ?
    choices:
      - {text: "Chaque type donne sa propre copie du code du template", correct: true}
      - {text: "Chaque type ajoute une table de fonctions virtuelles", correct: false}
      - {text: "Chaque type ajoute une copie de la bibliothèque standard", correct: false}
      - {text: "Chaque type ajoute des informations de débogage non retirables", correct: false}
    answer: |-
      Une instanciation par jeu d'arguments : quarante types, quarante fonctions. On limite ce *code bloat* en
      sortant du template le code qui ne dépend pas de `T`, dans une fonction ordinaire.
  - key: situation-membre-invalide
    format: scenario
    question: |-
      Une classe `Boite<T>` a une fonction membre `trier()`, qui utilise `<`. Tu crées une `Boite<Image>`, alors que
      `Image` n'a pas d'opérateur `<`, et tout compile. Un collègue s'en étonne. Que lui expliques-tu ?
    choices:
      - {text: "Que `trier()` n'est instanciée que si on l'appelle : sans appel, elle n'est pas vérifiée", correct: true}
      - {text: "Que le compilateur fournit un opérateur `<` par défaut à toutes les classes", correct: false}
      - {text: "Que l'erreur apparaîtra à l'édition de liens, plus tard", correct: false}
      - {text: "Que l'erreur apparaîtra à l'exécution, sous forme d'exception", correct: false}
    answer: |-
      L'instanciation d'un template de classe est paresseuse : seules les fonctions membres utilisées sont
      générées. L'erreur surgira le jour où quelqu'un appellera `trier()` sur une `Boite<Image>`.
  - key: definition-instanciation
    format: definition
    question: "Qu'appelle-t-on une instanciation de template ?"
    choices:
      - {text: "La fonction ou la classe concrète générée pour des arguments donnés", correct: true}
      - {text: "Le fichier d'en-tête qui contient le template", correct: false}
      - {text: "Un objet créé à partir d'une classe template", correct: false}
      - {text: "Le paramètre `T` d'un template", correct: false}
    answer: "`maximum<int>` est une instanciation de `maximum` ; `std::vector<int>` en est une de `std::vector`."
  - key: definition-instanciation-explicite
    format: definition
    question: "Qu'est-ce qu'une instanciation explicite ?"
    choices:
      - {text: "Une demande, écrite dans le code, de générer le template pour un type précis", correct: true}
      - {text: "Un appel où l'on écrit le type entre chevrons : `maximum<int>(3, 7)`", correct: false}
      - {text: "Une version du template réécrite à la main pour un type précis", correct: false}
      - {text: "Une déduction du type à partir des arguments de l'appel", correct: false}
    answer: "`template int maximum<int>(int, int);`. Écrire le type à l'appel est une spécification explicite des arguments ; réécrire le corps est une spécialisation."
  - key: definition-code-bloat
    format: definition
    question: "Qu'appelle-t-on le « code bloat » des templates ?"
    choices:
      - {text: "Le grossissement du binaire, dû à une copie du code par type utilisé", correct: true}
      - {text: "L'allongement des messages d'erreur du compilateur", correct: false}
      - {text: "Le ralentissement du programme à l'exécution", correct: false}
      - {text: "L'accumulation d'en-têtes inclus sans nécessité", correct: false}
    answer: "Chaque instanciation est une fonction à part entière. Beaucoup de types, beaucoup de code machine."
  - key: definition-point-instanciation
    format: definition
    question: "Qu'est-ce que l'unité de traduction a besoin de voir pour instancier un template ?"
    choices:
      - {text: "La définition complète du template, corps compris", correct: true}
      - {text: "Seulement la déclaration du template", correct: false}
      - {text: "Le fichier objet d'un autre fichier source", correct: false}
      - {text: "Le nom du template, sans ses paramètres", correct: false}
    answer: "Le compilateur génère le code sur place : il lui faut le corps. Une déclaration seule ne laisse qu'un symbole à résoudre plus tard."
