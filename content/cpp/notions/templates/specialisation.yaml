notion: specialisation
lesson: |-
  Un template donne **une** définition pour tous les types. La **spécialisation** permet d'en donner une autre pour
  certains arguments : un cas particulier, écrit à la main.

  **La spécialisation totale** fixe **tous** les paramètres. Elle s'écrit avec `template <>`.

  ```cpp
  template <typename T>
  struct Nom {
      static const char* de() { return "inconnu"; }
  };

  template <>
  struct Nom<int> {
      static const char* de() { return "int"; }
  };
  ```

  `Nom<int>::de()` prend la version spécialisée ; tout autre type prend le template d'origine, dit **primaire**.

  **La spécialisation partielle** ne fixe qu'une **partie** des paramètres, ou une **forme** de type. Elle garde
  des paramètres de template.

  ```cpp
  template <typename T>
  struct Nom<T*> {                       // tous les pointeurs
      static const char* de() { return "pointeur"; }
  };

  template <typename T>
  struct Paire<T, T> { /* ... */ };      // les deux types identiques
  ```

  Le compilateur choisit la spécialisation **la plus spécialisée** qui convient. Si deux conviennent sans que
  l'une soit plus précise, l'appel est **ambigu**.

  **Seules les classes** (et les variables template) ont des spécialisations **partielles**. Une **fonction**
  template n'accepte que la spécialisation totale, et on l'évite : les spécialisations de fonction ne participent
  pas à la résolution de surcharge. Pour une fonction, on **surcharge**.

  ```cpp
  template <typename T> void afficher(T valeur);      // général
  void afficher(const char* texte);                   // surcharge, préférée à une spécialisation
  ```

  **Une spécialisation est une classe à part entière.** Elle ne reprend **rien** du primaire : ni membres, ni
  fonctions. Tout ce dont on a besoin doit y être réécrit.

  **Où l'écrire.** Après le template primaire, et **avant** le premier usage qui la déclencherait ; sinon le
  programme est mal formé, sans diagnostic obligatoire. Une spécialisation **totale** d'une fonction est une
  fonction ordinaire : définie dans un en-tête, elle doit être `inline`.

  **À quoi cela sert.** Aux traits de type (`std::is_pointer` est un primaire à `false` et une spécialisation
  partielle pour `T*`), à `std::hash` pour ses propres types, à `std::formatter`, aux optimisations ciblées. C'est
  aussi le défaut de `std::vector<bool>` : une spécialisation qui ne se comporte pas comme les autres vecteurs.

  **En entretien** : « Une spécialisation totale fixe tous les arguments, avec `template <>` ; une partielle en
  fixe une partie ou une forme, comme `T*`, et n'existe que pour les classes. Pour les fonctions, je surcharge.
  Une spécialisation ne reprend rien du template primaire. »
cards:
  - key: totale
    format: course
    question: "Qu'est-ce qu'une spécialisation totale d'un template ?"
    choices:
      - {text: "Une définition à part, écrite pour des arguments tous fixés", correct: true}
      - {text: "Une définition à part, écrite pour une famille de types", correct: false}
      - {text: "Une instanciation que le compilateur génère à la demande", correct: false}
      - {text: "Une classe dérivée du template, qui redéfinit ses fonctions", correct: false}
    answer: "`template <> struct Nom<int> { ... };` : plus aucun paramètre libre. Pour `int`, c'est cette définition qui sert."
  - key: partielle
    format: course
    question: "Que fixe une spécialisation partielle ?"
    choices:
      - {text: "Une partie des paramètres, ou une forme de type comme `T*`", correct: true}
      - {text: "Tous les paramètres du template, sans exception", correct: false}
      - {text: "Seulement le nom des fonctions membres du template", correct: false}
      - {text: "Seulement la valeur par défaut du dernier paramètre", correct: false}
    answer: "Elle garde des paramètres de template : `template <typename T> struct Nom<T*>` vaut pour tous les pointeurs."
  - key: fonctions
    format: course
    question: "Comment traite-t-on un cas particulier pour une fonction template ?"
    choices:
      - {text: "Par une surcharge, plutôt que par une spécialisation", correct: true}
      - {text: "Par une spécialisation partielle de la fonction", correct: false}
      - {text: "Par une macro qui remplace la fonction pour ce type", correct: false}
      - {text: "Par un `if` sur le nom du type dans le corps de la fonction", correct: false}
    answer: "Une fonction n'a pas de spécialisation partielle, et sa spécialisation totale ne participe pas à la résolution de surcharge. Une surcharge ordinaire se comporte comme on l'attend."
  - key: independante
    format: course
    question: "Que reprend une spécialisation du template primaire ?"
    choices:
      - {text: "Rien : c'est une classe à part, dont tous les membres sont à réécrire", correct: true}
      - {text: "Tous ses membres, comme une classe dérivée reprend ceux de sa base", correct: false}
      - {text: "Ses fonctions membres, mais pas ses données membres", correct: false}
      - {text: "Ses données membres, mais pas ses fonctions membres", correct: false}
    answer: "Seul le nom est commun. Une fonction présente dans le primaire et oubliée dans la spécialisation n'existe pas pour ce type."
  - key: vf-partielle-fonction
    format: true-false
    question: "Une fonction template peut être spécialisée partiellement."
    truth: false
    answer: "Seules les classes et les variables template le peuvent. Pour une fonction, on surcharge."
  - key: vf-template-vide
    format: true-false
    question: "Une spécialisation totale s'écrit avec `template <>`."
    truth: true
    answer: "La liste de paramètres est vide, puisqu'ils sont tous fixés."
  - key: vf-herite
    format: true-false
    question: "Une spécialisation hérite des fonctions membres du template primaire."
    truth: false
    answer: "Elle ne reprend rien. Ce n'est pas de l'héritage : c'est une définition de remplacement."
  - key: vf-plus-specialisee
    format: true-false
    question: "Quand plusieurs spécialisations conviennent, le compilateur prend la plus spécialisée."
    truth: true
    answer: "`Nom<T*>` l'emporte sur le primaire pour `int*`. Si aucune n'est plus précise que l'autre, c'est une ambiguïté."
  - key: qcm-syntaxe-totale
    format: multiple-choice
    question: "Quelle ligne commence la spécialisation totale de `template <typename T> struct Nom;` pour `bool` ?"
    choices:
      - {text: "`template <> struct Nom<bool> {`", correct: true}
      - {text: "`template <bool> struct Nom {`", correct: false}
      - {text: "`struct Nom<bool> {`", correct: false}
      - {text: "`template <typename bool> struct Nom {`", correct: false}
    answer: "`template <>`, puis le nom suivi des arguments fixés."
  - key: qcm-syntaxe-partielle
    format: multiple-choice
    question: "Quelle ligne commence une spécialisation partielle de `Nom` pour tous les pointeurs ?"
    choices:
      - {text: "`template <typename T> struct Nom<T*> {`", correct: true}
      - {text: "`template <> struct Nom<T*> {`", correct: false}
      - {text: "`template <typename T*> struct Nom {`", correct: false}
      - {text: "`template <pointer> struct Nom {`", correct: false}
    answer: "Elle garde un paramètre `T`, et décrit la forme `T*` après le nom."
  - key: qcm-exemple
    format: multiple-choice
    question: "Lequel de ces éléments de la bibliothèque est une spécialisation à écrire pour ses propres types ?"
    choices:
      - {text: "`std::hash`", correct: true}
      - {text: "`std::sort`", correct: false}
      - {text: "`std::move`", correct: false}
      - {text: "`std::println`", correct: false}
    answer: "`template <> struct std::hash<Point> { ... };` rend `Point` utilisable comme clé d'une table de hachage. `std::formatter` s'étend de la même façon."
  - key: qcm-ambiguite
    format: multiple-choice
    question: "Un template a les spécialisations `Paire<T, int>` et `Paire<int, T>`. Que se passe-t-il pour `Paire<int, int>` ?"
    choices:
      - {text: "L'instanciation est ambiguë : aucune n'est plus spécialisée", correct: true}
      - {text: "La première spécialisation écrite est choisie", correct: false}
      - {text: "La dernière spécialisation écrite est choisie", correct: false}
      - {text: "Le template primaire est choisi", correct: false}
    answer: "Les deux conviennent, sans que l'une soit plus précise. Il faut une troisième spécialisation, `Paire<int, int>`."
  - key: trous-totale
    format: fill-in
    question: |-
      Complète pour écrire une spécialisation totale :
      ```cpp
      template ___
      struct Nom<int> {
          static const char* de() { return "int"; }
      };
      ```
    blanks:
      - ["<>"]
    answer: "`template <>` : la liste des paramètres est vide."
  - key: trous-pointeur
    format: fill-in
    question: |-
      Complète pour que la spécialisation vaille pour tous les pointeurs :
      ```cpp
      template <typename T>
      struct Nom<T___> {
          static const char* de() { return "pointeur"; }
      };
      ```
    blanks:
      - ["*"]
    answer: "`Nom<T*>` : la forme « pointeur vers un type quelconque »."
  - key: trous-arguments
    format: fill-in
    question: |-
      Complète pour spécialiser le template pour `double` :
      ```cpp
      template <>
      struct Nom<___> {
          static const char* de() { return "double"; }
      };
      ```
    blanks:
      - [double]
    answer: "Les arguments fixés s'écrivent après le nom du template."
  - key: trous-formatter
    format: fill-in
    question: |-
      Complète pour que `std::println` sache afficher un `Point`, par une spécialisation :
      ```cpp
      template <>
      struct std::___<Point> : std::formatter<std::string> {
          auto format(const Point& p, std::format_context& contexte) const;
      };
      ```
    blanks:
      - [formatter]
    answer: "`std::formatter<Point>` : la spécialisation que cherchent `std::format` et `std::println`."
  - key: code-totale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      struct Nom {
          static const char* de() { return "inconnu"; }
      };

      template <>
      struct Nom<int> {
          static const char* de() { return "int"; }
      };

      int main() {
          std::println("{} {}", Nom<int>::de(), Nom<long>::de());
      }
      ```
    choices:
      - {text: "`int inconnu`", correct: true}
      - {text: "`int int`", correct: false}
      - {text: "`inconnu inconnu`", correct: false}
      - {text: "`inconnu int`", correct: false}
    answer: "`int inconnu` : la spécialisation ne vaut que pour `int`, exactement. `long` prend le template primaire."
    check:
      output: "int inconnu"
  - key: code-partielle
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      struct Forme {
          static const char* de() { return "valeur"; }
      };

      template <typename T>
      struct Forme<T*> {
          static const char* de() { return "pointeur"; }
      };

      template <typename T>
      struct Forme<const T*> {
          static const char* de() { return "pointeur const"; }
      };

      int main() {
          std::println("{} | {} | {}", Forme<int>::de(), Forme<int*>::de(), Forme<const int*>::de());
      }
      ```
    choices:
      - {text: "`valeur | pointeur | pointeur const`", correct: true}
      - {text: "`valeur | pointeur | pointeur`", correct: false}
      - {text: "`valeur | valeur | valeur`", correct: false}
      - {text: "`pointeur | pointeur | pointeur const`", correct: false}
    answer: "`valeur | pointeur | pointeur const` : pour `const int*`, les deux spécialisations conviennent, et `const T*` est la plus spécialisée."
    check:
      output: "valeur | pointeur | pointeur const"
  - key: code-surcharge-ou-specialisation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      const char* sorte(T) { return "general"; }

      template <typename T>
      const char* sorte(T*) { return "pointeur"; }

      template <>
      const char* sorte(int*) { return "int*"; }

      int main() {
          int n = 0;
          double d = 0.0;
          std::println("{} {} {}", sorte(n), sorte(&n), sorte(&d));
      }
      ```
    choices:
      - {text: "`general int* pointeur`", correct: true}
      - {text: "`general pointeur pointeur`", correct: false}
      - {text: "`general int* int*`", correct: false}
      - {text: "`general general general`", correct: false}
    answer: "`general int* pointeur` : la surcharge `sorte(T*)` gagne pour les pointeurs. La spécialisation, écrite après elle, la spécialise : elle sert pour `int*` seulement."
    check:
      output: "general int* pointeur"
  - key: code-memes-types
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename A, typename B>
      struct Paire {
          static constexpr int rang = 0;
      };

      template <typename T>
      struct Paire<T, T> {
          static constexpr int rang = 1;
      };

      template <>
      struct Paire<int, int> {
          static constexpr int rang = 2;
      };

      int main() {
          std::println("{} {} {}", Paire<int, char>::rang, Paire<char, char>::rang, Paire<int, int>::rang);
      }
      ```
    choices:
      - {text: "`0 1 2`", correct: true}
      - {text: "`0 1 1`", correct: false}
      - {text: "`0 0 2`", correct: false}
      - {text: "`1 1 2`", correct: false}
    answer: "`0 1 2` : deux types différents prennent le primaire ; deux types identiques la spécialisation partielle ; `int, int` la totale, plus précise encore."
    check:
      output: "0 1 2"
  - key: bug-membre-absent
    format: bug-fix
    question: |-
      Le compilateur répond « 'struct Boite<bool>' has no member named 'vider' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      struct Boite {
          T valeur{};
          void vider() { valeur = T{}; }
      };

      template <>
      struct Boite<bool> {
          bool valeur = false;
      };

      int main() {
          Boite<bool> b;
          b.vider();
          std::println("{}", b.valeur);
      }
      ```
    choices:
      - {text: "Écrire aussi `vider()` dans la spécialisation `Boite<bool>`", correct: true}
      - {text: "Faire dériver `Boite<bool>` de `bool`, pour hériter de `vider()`", correct: false}
      - {text: "Appeler la fonction par `b.Boite::vider();`", correct: false}
      - {text: "Déclarer `vider()` avec `virtual` dans le template primaire", correct: false}
    answer: |-
      ```cpp
      template <>
      struct Boite<bool> {
          bool valeur = false;
          void vider() { valeur = false; }
      };
      ```
      Une spécialisation ne reprend rien du template primaire. Chaque membre dont on a besoin doit y être réécrit.
  - key: bug-partielle-de-fonction
    format: bug-fix
    question: |-
      Le compilateur répond « non-class, non-variable partial specialization 'afficher<T*>' is not allowed ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      void afficher(T) {
          std::println("valeur");
      }

      template <typename T>
      void afficher<T*>(T*) {
          std::println("pointeur");
      }

      int main() {
          int n = 0;
          afficher(&n);
      }
      ```
    choices:
      - {text: "Écrire une surcharge : `template <typename T> void afficher(T*)`", correct: true}
      - {text: "Écrire `template <> void afficher<T*>(T*)`", correct: false}
      - {text: "Écrire `template <typename T*> void afficher(T)`", correct: false}
      - {text: "Écrire `template <typename T> void afficher<T>(T*)`", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      void afficher(T*) {
          std::println("pointeur");
      }
      ```
      Une fonction template ne se spécialise pas partiellement. On écrit un second template du même nom : c'est une
      surcharge, et la plus spécialisée est choisie.
  - key: bug-template-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « an explicit specialization must be preceded by 'template <>' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      struct Nom {
          static const char* de() { return "inconnu"; }
      };

      struct Nom<char> {
          static const char* de() { return "char"; }
      };

      int main() {
          std::println("{}", Nom<char>::de());
      }
      ```
    choices:
      - {text: "Écrire `template <>` avant `struct Nom<char>`", correct: true}
      - {text: "Écrire `template <char>` avant `struct Nom<char>`", correct: false}
      - {text: "Écrire `typename` avant `struct Nom<char>`", correct: false}
      - {text: "Écrire `inline` avant `struct Nom<char>`", correct: false}
    answer: |-
      ```cpp
      template <>
      struct Nom<char> {
      ```
      Une spécialisation totale s'annonce par `template <>`, avec une liste de paramètres vide.
  - key: bug-ambiguite
    format: bug-fix
    question: |-
      Le compilateur répond « ambiguous template instantiation for 'struct Paire<int, int>' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      template <typename A, typename B>
      struct Paire {
          static constexpr int rang = 0;
      };

      template <typename T>
      struct Paire<T, int> {
          static constexpr int rang = 1;
      };

      template <typename T>
      struct Paire<int, T> {
          static constexpr int rang = 2;
      };

      int main() {
          std::println("{}", Paire<int, int>::rang);
      }
      ```
    choices:
      - {text: "Ajouter une spécialisation totale `template <> struct Paire<int, int>`", correct: true}
      - {text: "Inverser l'ordre des deux spécialisations partielles dans le fichier", correct: false}
      - {text: "Écrire `Paire<int, int>::template rang` dans la fonction `main`", correct: false}
      - {text: "Déclarer `rang` avec `inline` dans les deux spécialisations", correct: false}
    answer: |-
      ```cpp
      template <>
      struct Paire<int, int> {
          static constexpr int rang = 3;
      };
      ```
      Les deux spécialisations partielles conviennent à `Paire<int, int>`, et aucune n'est plus précise que l'autre.
      Une spécialisation plus précise que les deux lève l'ambiguïté. L'ordre d'écriture ne compte pas.
