notion: deduction-types
lesson: |-
  Quand on appelle un template sans préciser ses arguments, ou qu'on écrit `auto`, le compilateur **déduit** le
  type. Les règles sont les mêmes pour les deux, et tiennent en trois cas, selon la forme du paramètre.

  **1. Par valeur : `T` ou `auto`.** L'argument est copié : la déduction retire ce qui ne concerne pas la copie.

  - la **référence** est retirée ;
  - le **`const`** de premier niveau est retiré ;
  - un **tableau** devient un pointeur, une **fonction** un pointeur de fonction.

  ```cpp
  const int& r = x;
  auto a = r;            // int
  const char nom[] = "Ada";
  auto p = nom;          // const char*
  ```

  **2. Par référence : `T&` ou `auto&`.** Le type est gardé tel quel, `const` compris ; un tableau reste un
  tableau.

  ```cpp
  const int c = 1;
  auto& b = c;           // const int&
  ```

  **3. Par référence universelle : `T&&` ou `auto&&`.** Le résultat dépend de la **catégorie de valeur** de
  l'argument :

  | Argument | `T` déduit | Type du paramètre |
  |---|---|---|
  | une lvalue de type `X` | `X&` | `X&` |
  | une rvalue de type `X` | `X` | `X&&` |

  C'est la seule situation où `T` est déduit en référence. La **fusion des références** fait le reste : `X& &&`
  devient `X&`.

  **Les cas particuliers.**

  - **`auto` et les accolades.** `auto x = {1, 2, 3};` déduit `std::initializer_list<int>`. `auto x{1};` déduit
    `int`. Un template, lui, ne déduit **rien** d'une liste entre accolades : `f({1, 2, 3})` ne compile pas si le
    paramètre est un simple `T`.
  - **Pas de conversion pendant la déduction.** `std::max(1, 2.5)` échoue : `T` ne peut pas être à la fois `int` et
    `double`. On précise : `std::max<double>(1, 2.5)`.
  - **`decltype(auto)`** applique les règles de `decltype` : rien n'est retiré.

  **Voir le type déduit.** `std::is_same_v<decltype(x), int>` dans un `static_assert`, ou la ruse du template
  déclaré sans définition, `template <typename T> struct Montre;`, dont l'erreur affiche le type.

  **Les conséquences pratiques.**

  - `auto x = f();` **copie**, même si `f` renvoie une référence : pour l'éviter, `auto&` ou `const auto&`.
  - `for (auto x : v)` copie chaque élément.
  - `auto&&` accepte tout, lvalue comme rvalue, sans copie : c'est la forme des boucles génériques.

  **En entretien** : « Par valeur, la déduction retire références et `const`, et un tableau devient un pointeur.
  Par référence, le type est gardé. Avec `T&&`, une lvalue déduit `T` en référence, une rvalue en type simple :
  c'est la base du transfert parfait. Et `auto` avec des accolades donne un `std::initializer_list`. »
cards:
  - key: par-valeur
    format: course
    question: "Que retire la déduction quand le paramètre est pris par valeur (`T` ou `auto`) ?"
    choices:
      - {text: "La référence et le `const` de premier niveau ; un tableau devient un pointeur", correct: true}
      - {text: "Rien : le type de l'argument est gardé tel quel, référence comprise", correct: false}
      - {text: "Seulement le `const` ; la référence est gardée", correct: false}
      - {text: "Seulement la référence ; un tableau reste un tableau", correct: false}
    answer: "L'argument est copié : la copie n'a pas à être constante ni à être une référence. `const int&` donne `int`."
  - key: par-reference
    format: course
    question: "`c` est déclarée `const int c = 1;`. Quel est le type de `b` dans `auto& b = c;` ?"
    choices:
      - {text: "`const int&`", correct: true}
      - {text: "`int&`", correct: false}
      - {text: "`int`", correct: false}
      - {text: "`const int`", correct: false}
    answer: "Par référence, le `const` est gardé : sinon, `b` permettrait de modifier une constante."
  - key: reference-universelle
    format: course
    question: "Dans `template <typename T> void f(T&& x)`, que vaut `T` quand on passe une variable `int n` ?"
    choices:
      - {text: "`int&` : pour une lvalue, `T` est déduit en référence", correct: true}
      - {text: "`int` : la référence est toujours retirée", correct: false}
      - {text: "`int&&` : le paramètre est une référence à une rvalue", correct: false}
      - {text: "`const int&` : une variable est protégée par `const`", correct: false}
    answer: "Le paramètre devient `int& &&`, qui fusionne en `int&`. Pour une rvalue comme `5`, `T` vaut `int`, et le paramètre `int&&`."
  - key: accolades
    format: course
    question: "Que déduit `auto x = {1, 2, 3};` ?"
    choices:
      - {text: "`std::initializer_list<int>`", correct: true}
      - {text: "`std::vector<int>`", correct: false}
      - {text: "`std::array<int, 3>`", correct: false}
      - {text: "`int[3]`", correct: false}
    answer: "C'est une règle propre à `auto`. Un paramètre de template `T`, lui, ne déduit rien d'une liste entre accolades."
  - key: vf-auto-reference
    format: true-false
    question: "`auto x = f();` déclare une référence quand `f` renvoie `int&`."
    truth: false
    answer: "`auto` retire la référence : `x` est un `int`, copié. Pour garder la référence : `auto&` ou `decltype(auto)`."
  - key: vf-tableau
    format: true-false
    question: "Passé par valeur à un template, un tableau `int[5]` est déduit en `int*`."
    truth: true
    answer: "Le tableau se dégrade en pointeur. Passé par référence (`T&`), il reste `int[5]`, taille comprise."
  - key: vf-conversion
    format: true-false
    question: "Pendant la déduction, le compilateur convertit `int` en `double` pour accorder deux arguments du même `T`."
    truth: false
    answer: "Aucune conversion n'a lieu : `std::max(1, 2.5)` échoue. On précise l'argument : `std::max<double>(1, 2.5)`."
  - key: vf-auto-accolade-simple
    format: true-false
    question: "`auto x{1};` déduit `int`."
    truth: true
    answer: "Depuis C++17, l'initialisation directe avec un seul élément déduit le type de cet élément. `auto x = {1};` donne un `std::initializer_list<int>`."
  - key: qcm-const-copie
    format: multiple-choice
    question: "`const int limite = 10;` puis `auto copie = limite;`. Quel est le type de `copie` ?"
    choices:
      - {text: "`int`", correct: true}
      - {text: "`const int`", correct: false}
      - {text: "`const int&`", correct: false}
      - {text: "`int&`", correct: false}
    answer: "Le `const` de premier niveau est retiré : la copie est une variable indépendante, modifiable. Pour une constante : `const auto`."
  - key: qcm-auto-double-esperluette
    format: multiple-choice
    question: "Que déclare `auto&& x = n;`, où `n` est une variable `int` ?"
    choices:
      - {text: "Une référence `int&` vers `n`", correct: true}
      - {text: "Une référence `int&&` vers une copie de `n`", correct: false}
      - {text: "Une copie de `n`, de type `int`", correct: false}
      - {text: "Rien : le code ne compile pas", correct: false}
    answer: "`auto&&` est une référence universelle : avec une lvalue, elle devient `int&`. Avec une rvalue, `int&&`."
  - key: qcm-pointeur-const
    format: multiple-choice
    question: "`const char* texte = \"abc\";` puis `auto p = texte;`. Quel est le type de `p` ?"
    choices:
      - {text: "`const char*`", correct: true}
      - {text: "`char*`", correct: false}
      - {text: "`const char* const`", correct: false}
      - {text: "`char`", correct: false}
    answer: "Seul le `const` de premier niveau, celui du pointeur lui-même, serait retiré. Le `const` de l'objet désigné fait partie du type."
  - key: qcm-liste-template
    format: multiple-choice
    question: "`template <typename T> void f(T x);` est appelée par `f({1, 2, 3})`. Que se passe-t-il ?"
    choices:
      - {text: "L'appel ne compile pas : `T` ne se déduit pas d'une liste entre accolades", correct: true}
      - {text: "`T` est déduit en `std::initializer_list<int>`", correct: false}
      - {text: "`T` est déduit en `std::vector<int>`", correct: false}
      - {text: "`T` est déduit en `int`, et seul le premier élément est passé", correct: false}
    answer: "La règle de `auto` ne vaut pas pour les templates. On déclare le paramètre `std::initializer_list<T>`, ou l'on passe un conteneur."
  - key: code-valeur-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      int main() {
          const int c = 1;
          const int& r = c;
          auto a = c;
          auto b = r;
          auto& d = c;
          std::println("{} {} {}",
                       std::is_same_v<decltype(a), int>,
                       std::is_same_v<decltype(b), const int&>,
                       std::is_same_v<decltype(d), const int&>);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`true false true` : `auto` par valeur retire `const` et référence, donc `a` et `b` sont des `int`. `auto&` garde le `const`."
    check:
      output: "true false true"
  - key: code-reference-universelle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>
      #include <utility>

      template <typename T>
      bool recu_lvalue(T&&) {
          return std::is_lvalue_reference_v<T>;
      }

      int main() {
          int n = 0;
          std::println("{} {} {}", recu_lvalue(n), recu_lvalue(5), recu_lvalue(std::move(n)));
      }
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true false true`", correct: false}
      - {text: "`false false false`", correct: false}
      - {text: "`true true false`", correct: false}
    answer: "`true false false` : pour la variable `n`, `T` vaut `int&`. Pour `5` et pour `std::move(n)`, des rvalues, `T` vaut `int`."
    check:
      output: "true false false"
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename T>
      std::size_t par_valeur(T) {
          return sizeof(T);
      }

      template <typename T>
      std::size_t par_reference(T&) {
          return sizeof(T);
      }

      int main() {
          char tampon[10] = {};
          std::println("{} {}", par_valeur(tampon), par_reference(tampon));
      }
      ```
    choices:
      - {text: "`8 10`", correct: true}
      - {text: "`10 10`", correct: false}
      - {text: "`8 8`", correct: false}
      - {text: "`1 10`", correct: false}
    answer: "`8 10` : par valeur, le tableau devient un `char*`, de 8 octets sur une machine 64 bits. Par référence, `T` reste `char[10]`."
    check:
      output: "8 10"
  - key: code-accolades
    format: code-output
    question: |-
      ```cpp
      #include <initializer_list>
      #include <print>
      #include <type_traits>

      int main() {
          auto a = {1, 2, 3};
          auto b{4};
          std::println("{} {}", a.size(), std::is_same_v<decltype(b), int>);
      }
      ```
    choices:
      - {text: "`3 true`", correct: true}
      - {text: "`3 false`", correct: false}
      - {text: "`1 true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 true` : `auto a = {...}` déduit un `std::initializer_list<int>` de trois éléments. `auto b{4}` déduit `int`."
    check:
      output: "3 true"
  - key: bug-boucle-copie
    format: bug-fix
    question: |-
      Ce programme devrait doubler chaque élément et afficher `2`. Il affiche `1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto element : v) {
              element *= 2;
          }
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Écrire `for (auto& element : v)`", correct: true}
      - {text: "Écrire `for (const auto element : v)`", correct: false}
      - {text: "Écrire `for (auto element{v})`", correct: false}
      - {text: "Écrire `for (int element : v)`", correct: false}
    answer: |-
      ```cpp
      for (auto& element : v) {
      ```
      `auto` déduit `int` : chaque tour travaille sur une copie. Avec `auto&`, `element` désigne l'élément du
      vecteur.
  - key: bug-liste-accolades
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'somme(<brace-enclosed initializer list>)' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      int somme(const T& valeurs) {
          int total = 0;
          for (int v : valeurs) {
              total += v;
          }
          return total;
      }

      int main() {
          std::println("{}", somme({1, 2, 3}));
      }
      ```
    choices:
      - {text: "Passer un conteneur nommé : `somme(std::vector<int>{1, 2, 3})`", correct: true}
      - {text: "Passer la liste entre parenthèses : `somme((1, 2, 3))`", correct: false}
      - {text: "Passer la liste avec `auto` : `somme(auto{1, 2, 3})`", correct: false}
      - {text: "Passer la liste deux fois accolée : `somme({{1, 2, 3}})`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", somme(std::vector<int>{1, 2, 3}));
      ```
      Un paramètre de template ne se déduit pas d'une liste entre accolades : elle n'a pas de type. On passe un
      objet typé, ou l'on déclare le paramètre `std::initializer_list<int>`.
  - key: bug-reference-vers-rvalue
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind non-const lvalue reference of type 'int&' to an rvalue of type
      'int' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int calculer() {
          return 42;
      }

      int main() {
          auto& resultat = calculer();
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Déclarer `auto&& resultat = calculer();`", correct: true}
      - {text: "Déclarer `auto* resultat = calculer();`", correct: false}
      - {text: "Déclarer `auto& resultat = &calculer();`", correct: false}
      - {text: "Déclarer `auto& resultat = *calculer();`", correct: false}
    answer: |-
      ```cpp
      auto&& resultat = calculer();
      ```
      `auto&` déduit `int&`, qui refuse un temporaire. `auto&&` accepte une rvalue comme une lvalue, et prolonge la
      vie du temporaire ; `const auto&` ou `auto` tout court conviennent aussi.
  - key: bug-auto-accolades
    format: bug-fix
    question: |-
      Le compilateur répond « direct-list-initialization of 'auto' requires exactly one element ». Le programme
      devrait afficher `2`. Quelle correction est la bonne ?
      ```cpp
      #include <initializer_list>
      #include <print>

      int main() {
          auto bornes{1, 9};
          std::println("{}", bornes.size());
      }
      ```
    choices:
      - {text: "Écrire `auto bornes = {1, 9};`", correct: true}
      - {text: "Écrire `auto bornes(1, 9);`", correct: false}
      - {text: "Écrire `auto bornes{{1, 9}};`", correct: false}
      - {text: "Écrire `auto& bornes{1, 9};`", correct: false}
    answer: |-
      ```cpp
      auto bornes = {1, 9};
      ```
      `auto x{...}` n'accepte qu'un élément, dont il prend le type. C'est la forme avec `=` qui déduit un
      `std::initializer_list`.
