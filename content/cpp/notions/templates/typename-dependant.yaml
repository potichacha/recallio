notion: typename-dependant
lesson: |-
  Dans un template, certains noms **dépendent** d'un paramètre : `T::valeur`, `Conteneur::iterator`,
  `std::vector<T>::size_type`. Tant que `T` n'est pas connu, le compilateur ne peut pas savoir ce qu'un tel nom
  désigne : un **type**, une **valeur**, ou un **template** ?

  Or il doit analyser le template **avant** toute instanciation. Il applique donc une règle : un nom dépendant est
  supposé désigner une **valeur**, sauf si on lui dit le contraire.

  **`typename` : « ce nom est un type ».**

  ```cpp
  template <typename Conteneur>
  void premier(const Conteneur& c) {
      typename Conteneur::const_iterator it = c.begin();
  }
  ```

  Sans `typename`, `Conteneur::const_iterator it` serait lu comme une valeur suivie d'un nom : une erreur de
  syntaxe.

  **`template` : « ce nom est un template ».** Quand on appelle un **template membre** d'un objet dont le type
  dépend d'un paramètre, le `<` serait pris pour l'opérateur « inférieur à ».

  ```cpp
  template <typename T>
  void lire(T& source) {
      int n = source.template get<int>();
  }
  ```

  **Quand il n'en faut pas.**

  - Le nom ne dépend d'aucun paramètre : `std::vector<int>::iterator` n'a pas besoin de `typename`.
  - Dans la liste des classes de base, et dans la liste d'initialisation des membres.
  - Depuis **C++20**, dans les contextes où seul un type peut apparaître : le type de retour d'une fonction, le
    type d'un membre, un alias `using`, le type d'un paramètre de fonction membre.

  ```cpp
  template <typename T>
  T::value_type premier(const T& c);              // C++20 : typename facultatif ici

  template <typename T>
  using Element = T::value_type;                  // C++20 : idem
  ```

  Dans le **corps** d'une fonction, pour déclarer une variable locale, `typename` reste obligatoire.

  **Le plus simple est souvent de l'éviter.**

  - `auto it = c.begin();` : plus de nom dépendant à écrire.
  - Les alias de la bibliothèque : `std::ranges::range_value_t<C>` au lieu de `typename C::value_type` ;
    `std::remove_const_t<T>` au lieu de `typename std::remove_const<T>::type`.

  **Le membre d'une base dépendante.** Dans une classe dérivée d'une base qui dépend de `T`, un nom hérité n'est
  pas trouvé tout seul : on écrit `this->membre`, ou `Base<T>::membre`.

  **En entretien** : « Un nom qui dépend d'un paramètre de template est lu comme une valeur par défaut. J'écris
  `typename` pour dire que c'est un type, et `template` devant un template membre. C++20 a rendu `typename`
  facultatif là où seul un type est possible ; et `auto` évite souvent la question. »
cards:
  - key: nom-dependant
    format: course
    question: "Qu'est-ce qu'un nom dépendant, dans un template ?"
    choices:
      - {text: "Un nom dont le sens dépend d'un paramètre du template, comme `T::iterator`", correct: true}
      - {text: "Un nom déclaré dans un autre fichier, que l'éditeur de liens doit trouver", correct: false}
      - {text: "Un nom qui masque une variable globale portant le même nom", correct: false}
      - {text: "Un nom de variable dont la valeur change à chaque instanciation", correct: false}
    answer: "Tant que `T` n'est pas connu, le compilateur ne sait pas si `T::iterator` est un type, une variable statique ou une fonction."
  - key: role-typename
    format: course
    question: "À quoi sert `typename` devant `T::iterator` ?"
    choices:
      - {text: "À dire au compilateur que ce nom dépendant désigne un type", correct: true}
      - {text: "À déclarer un nouveau paramètre de template nommé `iterator`", correct: false}
      - {text: "À convertir la valeur `T::iterator` en type", correct: false}
      - {text: "À vérifier à l'exécution que `T` possède un itérateur", correct: false}
    answer: "Sans indication, un nom dépendant est supposé être une valeur. `typename` lève l'ambiguïté avant que `T` ne soit connu."
  - key: role-template
    format: course
    question: "Pourquoi écrit-on `source.template get<int>()` quand le type de `source` dépend de `T` ?"
    choices:
      - {text: "Pour que `<` soit lu comme le début d'une liste d'arguments de template", correct: true}
      - {text: "Pour que `get` soit instancié à l'exécution plutôt qu'à la compilation", correct: false}
      - {text: "Pour que `get` soit cherché dans l'espace de noms global", correct: false}
      - {text: "Pour que `source` soit converti en template de classe", correct: false}
    answer: "Sans `template`, le compilateur lirait `source.get < int`, une comparaison. Le mot-clé annonce un template membre."
  - key: cpp20
    format: course
    question: "Qu'a changé C++20 pour `typename` devant un nom dépendant ?"
    choices:
      - {text: "Il devient facultatif là où seul un type peut apparaître, comme un type de retour", correct: true}
      - {text: "Il devient obligatoire devant tous les noms, dépendants ou non", correct: false}
      - {text: "Il est remplacé par le mot-clé `concept` dans tous les templates", correct: false}
      - {text: "Il devient interdit dans le corps d'une fonction template", correct: false}
    answer: "Type de retour, alias, type d'un membre : le compilateur sait qu'il attend un type. Pour une variable locale dans le corps d'une fonction, `typename` reste nécessaire."
  - key: vf-non-dependant
    format: true-false
    question: "`std::vector<int>::iterator` doit être précédé de `typename` dans un template."
    truth: false
    answer: "Ce nom ne dépend d'aucun paramètre : le compilateur sait déjà que c'est un type."
  - key: vf-valeur-par-defaut
    format: true-false
    question: "Sans `typename`, un nom dépendant est supposé désigner une valeur."
    truth: true
    answer: "C'est la règle d'analyse. D'où l'erreur de syntaxe quand ce nom est en fait un type."
  - key: vf-auto
    format: true-false
    question: "`auto it = c.begin();` évite d'écrire `typename Conteneur::iterator`."
    truth: true
    answer: "Le type est déduit de l'expression : plus de nom dépendant à qualifier."
  - key: vf-classe-de-base
    format: true-false
    question: "Dans la liste des classes de base, `typename` est obligatoire devant un nom dépendant."
    truth: false
    answer: "Il y est interdit : seule une classe peut apparaître à cet endroit. `struct D : T::Base {};` suffit."
  - key: qcm-declaration-locale
    format: multiple-choice
    question: "Dans le corps d'une fonction `template <typename C>`, quelle ligne déclare un itérateur de `C` ?"
    choices:
      - {text: "`typename C::iterator it = c.begin();`", correct: true}
      - {text: "`C::iterator it = c.begin();`", correct: false}
      - {text: "`template C::iterator it = c.begin();`", correct: false}
      - {text: "`class C::iterator it = c.begin();`", correct: false}
    answer: "Dans le corps d'une fonction, `typename` reste obligatoire, même en C++23. `auto it = c.begin();` convient aussi."
  - key: qcm-template-membre
    format: multiple-choice
    question: "`t` est de type `T`, paramètre du template. Comment appelles-tu son template membre `convertir<int>()` ?"
    choices:
      - {text: "`t.template convertir<int>()`", correct: true}
      - {text: "`t.typename convertir<int>()`", correct: false}
      - {text: "`t.convertir<int>()`", correct: false}
      - {text: "`t::template convertir<int>()`", correct: false}
    answer: "`template` suit le point, devant le nom du template membre. Sans lui, `<` est pris pour une comparaison."
  - key: qcm-alias-standard
    format: multiple-choice
    question: "Quelle écriture remplace `typename std::remove_const<T>::type` ?"
    choices:
      - {text: "`std::remove_const_t<T>`", correct: true}
      - {text: "`std::remove_const_v<T>`", correct: false}
      - {text: "`std::remove_const<T>`", correct: false}
      - {text: "`std::remove_const<T>::value`", correct: false}
    answer: "Les alias en `_t` (C++14) cachent le `typename ... ::type`. Les variables en `_v` cachent `::value`."
  - key: qcm-base-dependante
    format: multiple-choice
    question: "Une classe `D<T>` dérive de `Base<T>`, qui a un membre `compteur`. Comment `D<T>` y accède-t-elle ?"
    choices:
      - {text: "Par `this->compteur`", correct: true}
      - {text: "Par `compteur`, sans rien ajouter", correct: false}
      - {text: "Par `typename compteur`", correct: false}
      - {text: "Par `template compteur`", correct: false}
    answer: "Un nom non qualifié n'est pas cherché dans une base dépendante. `this->` le rend dépendant : la recherche est remise à l'instanciation."
  - key: code-typename
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      template <typename Conteneur>
      typename Conteneur::value_type premier(const Conteneur& c) {
          typename Conteneur::const_iterator it = c.begin();
          return *it;
      }

      int main() {
          const std::vector<int> v{7, 8, 9};
          std::println("{}", premier(v));
      }
      ```
    choices:
      - {text: "`7`", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7` : `typename` dit que `value_type` et `const_iterator` sont des types. Pour `std::vector<int>`, ce sont `int` et son itérateur constant."
    check:
      output: "7"
  - key: code-sans-typename
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      template <typename Conteneur>
      int premier(const Conteneur& c) {
          Conteneur::const_iterator it = c.begin();
          return *it;
      }

      int main() {
          const std::vector<int> v{7, 8, 9};
          std::println("{}", premier(v));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : dans le corps d'une fonction, `Conteneur::const_iterator` est lu comme une valeur. GCC répond « need 'typename' before 'Conteneur::const_iterator' »."
    check:
      compiles: false
  - key: code-template-membre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Source {
          template <typename T>
          T lire() const { return T{42}; }
      };

      template <typename S>
      double moitie(const S& source) {
          return source.template lire<double>() / 2;
      }

      int main() {
          std::println("{}", moitie(Source{}));
      }
      ```
    choices:
      - {text: "`21`", correct: true}
      - {text: "`42`", correct: false}
      - {text: "`20`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`21` : `template` annonce que `lire` est un template membre. `lire<double>()` rend 42.0, divisé par 2."
    check:
      output: "21"
  - key: code-base-dependante
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename T>
      struct Base {
          T valeur{5};
      };

      template <typename T>
      struct Derivee : Base<T> {
          T double_valeur() const { return this->valeur * 2; }
      };

      int main() {
          std::println("{}", Derivee<int>{}.double_valeur());
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10` : `this->valeur` remet la recherche du nom à l'instanciation, où `Base<int>` est connue."
    check:
      output: "10"
  - key: bug-typename-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « need 'typename' before 'C::value_type' because 'C' is a dependent scope ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      template <typename C>
      auto somme(const C& conteneur) {
          C::value_type total{};
          for (const auto& x : conteneur) {
              total += x;
          }
          return total;
      }

      int main() {
          std::println("{}", somme(std::vector<int>{1, 2, 3}));
      }
      ```
    choices:
      - {text: "Écrire `typename C::value_type total{};`", correct: true}
      - {text: "Écrire `template C::value_type total{};`", correct: false}
      - {text: "Écrire `C.value_type total{};`", correct: false}
      - {text: "Écrire `C::template value_type total{};`", correct: false}
    answer: |-
      ```cpp
      typename C::value_type total{};
      ```
      `C::value_type` dépend du paramètre `C`. Dans le corps d'une fonction, il faut dire que c'est un type.
  - key: bug-template-manquant
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne du `return` : il lit `<` comme une comparaison. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      struct Source {
          template <typename T>
          T lire() const { return T{7}; }
      };

      template <typename S>
      int valeur(const S& source) {
          return source.lire<int>();
      }

      int main() {
          std::println("{}", valeur(Source{}));
      }
      ```
    choices:
      - {text: "Écrire `source.template lire<int>()`", correct: true}
      - {text: "Écrire `source.typename lire<int>()`", correct: false}
      - {text: "Écrire `source->lire<int>()`", correct: false}
      - {text: "Écrire `source.lire(int)`", correct: false}
    answer: |-
      ```cpp
      return source.template lire<int>();
      ```
      Le type de `source` dépend de `S` : le compilateur ne sait pas que `lire` est un template. Le mot-clé
      `template` le lui dit.
  - key: bug-base-dependante
    format: bug-fix
    question: |-
      Le compilateur répond « 'compteur' was not declared in this scope ». Le membre existe pourtant dans la classe
      de base. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename T>
      struct Base {
          int compteur = 3;
      };

      template <typename T>
      struct Derivee : Base<T> {
          int lire() const { return compteur; }
      };

      int main() {
          std::println("{}", Derivee<int>{}.lire());
      }
      ```
    choices:
      - {text: "Écrire `return this->compteur;`", correct: true}
      - {text: "Écrire `return typename compteur;`", correct: false}
      - {text: "Écrire `return ::compteur;`", correct: false}
      - {text: "Écrire `return template compteur;`", correct: false}
    answer: |-
      ```cpp
      int lire() const { return this->compteur; }
      ```
      `Base<T>` dépend de `T` : un nom non qualifié n'y est pas cherché au moment où le template est analysé.
      `this->compteur`, ou `Base<T>::compteur`, reporte la recherche à l'instanciation.
  - key: bug-typename-en-trop
    format: bug-fix
    question: |-
      Le compilateur refuse `typename` dans cette fonction ordinaire : « expected nested-name-specifier ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int premier(const std::vector<int>& v) {
          typename const_iterator it = v.begin();
          return *it;
      }

      int main() {
          std::println("{}", premier({4, 5}));
      }
      ```
    choices:
      - {text: "Écrire `std::vector<int>::const_iterator it = v.begin();`", correct: true}
      - {text: "Écrire `template const_iterator it = v.begin();`", correct: false}
      - {text: "Écrire `typename v::const_iterator it = v.begin();`", correct: false}
      - {text: "Écrire `const_iterator<int> it = v.begin();`", correct: false}
    answer: |-
      ```cpp
      std::vector<int>::const_iterator it = v.begin();
      ```
      `typename` précède un nom qualifié par `::`. Ici, le type se nomme `std::vector<int>::const_iterator`, et ne
      dépend de rien : `typename` est inutile. `auto it = v.begin();` est plus court encore.
