notion: templates-variadiques
lesson: |-
  Un **template variadique** accepte un **nombre quelconque** d'arguments, de types quelconques. C'est ce qui
  permet d'écrire `std::println("{} {}", a, b)`, `std::make_unique<T>(arguments...)` ou `std::tuple<int, char>`.

  ```cpp
  template <typename... Types>
  void afficher(const Types&... valeurs);
  ```

  **Le vocabulaire.**

  - `typename... Types` déclare un **pack de paramètres de template** : zéro, un ou plusieurs types.
  - `const Types&... valeurs` déclare un **pack de paramètres de fonction**.
  - `sizeof...(valeurs)` donne le **nombre** d'éléments du pack, à la compilation.
  - Un motif suivi de `...` est une **expansion** : le motif est répété pour chaque élément, séparé par des
    virgules. `f(valeurs...)` devient `f(a, b, c)` ; `f(g(valeurs)...)` devient `f(g(a), g(b), g(c))`.

  Les trois points se placent **à gauche** du nom quand on déclare le pack, **à droite** quand on le déploie.

  **Les expressions de repli (C++17).** Elles appliquent un opérateur binaire à tous les éléments du pack. Les
  parenthèses sont obligatoires.

  | Écriture | Devient, pour `a, b, c` |
  |---|---|
  | `(valeurs + ...)` | `a + (b + c)` |
  | `(... + valeurs)` | `(a + b) + c` |
  | `(valeurs + ... + 0)` | `a + (b + (c + 0))` : avec une valeur initiale |
  | `(f(valeurs), ...)` | `f(a), f(b), f(c)` : repli sur la virgule, pour appeler une fonction sur chacun |

  ```cpp
  template <typename... T>
  auto somme(T... valeurs) {
      return (valeurs + ... + 0);
  }

  template <typename... T>
  void afficher(const T&... valeurs) {
      (std::print("{} ", valeurs), ...);
  }
  ```

  Un repli sur un pack **vide** n'est permis que pour `&&` (vaut `true`), `||` (vaut `false`) et la virgule. Pour
  les autres opérateurs, on donne une valeur initiale.

  **Avant C++17 : la récursion.** On traite le premier élément, puis on rappelle le template avec le reste, jusqu'à
  une surcharge sans argument qui arrête la récursion.

  ```cpp
  void afficher() {}

  template <typename Premier, typename... Reste>
  void afficher(const Premier& premier, const Reste&... reste) {
      std::print("{} ", premier);
      afficher(reste...);
  }
  ```

  **Transmettre un pack.** Avec des références universelles et `std::forward`, chaque argument garde sa catégorie
  de valeur : c'est le transfert parfait.

  ```cpp
  template <typename T, typename... Args>
  std::unique_ptr<T> creer(Args&&... args) {
      return std::make_unique<T>(std::forward<Args>(args)...);
  }
  ```

  **En entretien** : « `typename... Types` déclare un pack, `valeurs...` le déploie, `sizeof...` le compte. Depuis
  C++17, une expression de repli comme `(valeurs + ...)` remplace la récursion. Avec `std::forward<Args>(args)...`,
  on transmet le pack tel quel. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un template variadique ?"
    choices:
      - {text: "Un template qui accepte un nombre quelconque d'arguments, de types quelconques", correct: true}
      - {text: "Un template dont les arguments peuvent changer de type à l'exécution", correct: false}
      - {text: "Un template qui n'accepte que des arguments d'un seul et même type", correct: false}
      - {text: "Un template dont le nombre d'arguments est fixé par une macro", correct: false}
    answer: "`template <typename... Types>` déclare un pack : zéro, un ou plusieurs types. `std::tuple` et `std::make_unique` sont écrits ainsi."
  - key: expansion
    format: course
    question: "Que devient `f(g(valeurs)...)` quand le pack contient `a`, `b` et `c` ?"
    choices:
      - {text: "`f(g(a), g(b), g(c))`", correct: true}
      - {text: "`f(g(a, b, c))`", correct: false}
      - {text: "`f(g(a)); f(g(b)); f(g(c));`", correct: false}
      - {text: "`f(g(c), g(b), g(a))`", correct: false}
    answer: "Le motif placé devant `...` est répété pour chaque élément, séparé par des virgules. Avec `g(valeurs...)`, c'est `g` qui recevrait les trois."
  - key: repli
    format: course
    question: "Que fait l'expression de repli `(valeurs + ...)` ?"
    choices:
      - {text: "Elle additionne tous les éléments du pack", correct: true}
      - {text: "Elle ajoute un élément à la fin du pack", correct: false}
      - {text: "Elle compte les éléments du pack", correct: false}
      - {text: "Elle concatène les noms des types du pack", correct: false}
    answer: "Un repli (C++17) applique l'opérateur entre tous les éléments : `a + (b + c)`. Les parenthèses font partie de la syntaxe."
  - key: sizeof-pack
    format: course
    question: "Que donne `sizeof...(valeurs)` ?"
    choices:
      - {text: "Le nombre d'éléments du pack, connu à la compilation", correct: true}
      - {text: "La taille en octets de tous les éléments du pack réunis", correct: false}
      - {text: "La taille en octets du premier élément du pack", correct: false}
      - {text: "Le nombre d'éléments du pack, calculé à l'exécution", correct: false}
    answer: "C'est un opérateur à part, sans rapport avec la taille en mémoire. Il vaut 0 pour un pack vide."
  - key: vf-pack-vide
    format: true-false
    question: "Un pack de paramètres peut être vide."
    truth: true
    answer: "`typename... Types` accepte zéro argument. `sizeof...` vaut alors 0."
  - key: vf-repli-vide
    format: true-false
    question: "`(valeurs + ...)` compile avec un pack vide."
    truth: false
    answer: "Seuls `&&`, `||` et la virgule acceptent un pack vide. Pour `+`, on donne une valeur initiale : `(valeurs + ... + 0)`."
  - key: vf-meme-type
    format: true-false
    question: "Tous les éléments d'un pack doivent avoir le même type."
    truth: false
    answer: "Chaque élément a son propre type : `afficher(1, 'a', 2.5)` déduit `int`, `char` et `double`."
  - key: vf-parentheses
    format: true-false
    question: "Une expression de repli doit être entourée de parenthèses."
    truth: true
    answer: "`(valeurs + ...)` : sans les parenthèses, le code ne compile pas."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration introduit un pack de paramètres de type ?"
    choices:
      - {text: "`template <typename... Types>`", correct: true}
      - {text: "`template <typename Types...>`", correct: false}
      - {text: "`template <typename[] Types>`", correct: false}
      - {text: "`template <...typename Types>`", correct: false}
    answer: "Les trois points suivent `typename`, à gauche du nom du pack."
  - key: qcm-appeler-sur-chacun
    format: multiple-choice
    question: "Quelle expression appelle `traiter` sur chaque élément du pack `valeurs` ?"
    choices:
      - {text: "`(traiter(valeurs), ...);`", correct: true}
      - {text: "`traiter(valeurs...);`", correct: false}
      - {text: "`traiter(...valeurs);`", correct: false}
      - {text: "`(traiter + ... + valeurs);`", correct: false}
    answer: "C'est un repli sur l'opérateur virgule : `traiter(a), traiter(b), traiter(c)`. `traiter(valeurs...)` ferait un seul appel, avec tous les arguments."
  - key: qcm-repli-vide
    format: multiple-choice
    question: "Que vaut `(... && valeurs)` quand le pack est vide ?"
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien : le code ne compile pas", correct: false}
    answer: "Un repli vide sur `&&` vaut `true`, sur `||` il vaut `false`. Ce sont les éléments neutres de ces opérateurs."
  - key: qcm-transfert
    format: multiple-choice
    question: "Quelle expression transmet un pack `args` en gardant la catégorie de valeur de chaque argument ?"
    choices:
      - {text: "`std::forward<Args>(args)...`", correct: true}
      - {text: "`std::forward<Args...>(args)`", correct: false}
      - {text: "`std::move(args)...`", correct: false}
      - {text: "`std::forward(args...)`", correct: false}
    answer: "Le motif `std::forward<Args>(args)` est répété pour chaque élément. `std::move` transformerait tout en rvalue, même les variables de l'appelant."
  - key: trous-pack
    format: fill-in
    question: |-
      Complète pour déclarer un pack de types :
      ```cpp
      template <typename___ Types>
      void afficher(const Types&... valeurs);
      ```
    blanks:
      - ["..."]
    answer: "`typename... Types` : les trois points déclarent le pack."
  - key: trous-sizeof
    format: fill-in
    question: |-
      Complète pour compter les arguments reçus :
      ```cpp
      template <typename... Types>
      std::size_t nombre(const Types&... valeurs) {
          return ___...(valeurs);
      }
      ```
    blanks:
      - [sizeof]
    answer: "`sizeof...(valeurs)` donne le nombre d'éléments du pack."
  - key: trous-repli
    format: fill-in
    question: |-
      Complète pour additionner tous les éléments, avec 0 pour un pack vide :
      ```cpp
      template <typename... Types>
      auto somme(Types... valeurs) {
          return (valeurs + ___ + 0);
      }
      ```
    blanks:
      - ["..."]
    answer: "`(valeurs + ... + 0)` : un repli avec une valeur initiale."
  - key: trous-expansion
    format: fill-in
    question: |-
      Complète pour passer tous les éléments du pack à `std::make_unique` :
      ```cpp
      template <typename T, typename... Args>
      std::unique_ptr<T> creer(Args&&... args) {
          return std::make_unique<T>(std::forward<Args>(args)___);
      }
      ```
    blanks:
      - ["..."]
    answer: "Les trois points, à droite du motif, le déploient pour chaque élément."
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      template <typename... Types>
      std::size_t nombre(const Types&...) {
          return sizeof...(Types);
      }

      int main() {
          std::println("{} {} {}", nombre(), nombre(1, 'a'), nombre(1.5, "x", 2, 3));
      }
      ```
    choices:
      - {text: "`0 2 4`", correct: true}
      - {text: "`0 5 21`", correct: false}
      - {text: "`1 2 4`", correct: false}
      - {text: "`0 2 3`", correct: false}
    answer: "`0 2 4` : `sizeof...` compte les éléments du pack, quels que soient leurs types et leurs tailles."
    check:
      output: "0 2 4"
  - key: code-repli-somme
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename... Types>
      auto somme(Types... valeurs) {
          return (valeurs + ... + 0);
      }

      int main() {
          std::println("{} {} {}", somme(), somme(1, 2, 3), somme(10, 0.5));
      }
      ```
    choices:
      - {text: "`0 6 10.5`", correct: true}
      - {text: "`0 6 10`", correct: false}
      - {text: "`0 123 10.5`", correct: false}
      - {text: "`1 6 10.5`", correct: false}
    answer: "`0 6 10.5` : sur un pack vide, il reste la valeur initiale. `10 + (0.5 + 0)` se calcule en `double`."
    check:
      output: "0 6 10.5"
  - key: code-repli-virgule
    format: code-output
    question: |-
      ```cpp
      #include <print>

      template <typename... Types>
      void afficher(const Types&... valeurs) {
          (std::print("[{}]", valeurs), ...);
          std::println("");
      }

      int main() {
          afficher(1, 'b', "c");
      }
      ```
    choices:
      - {text: "`[1][b][c]`", correct: true}
      - {text: "`[c][b][1]`", correct: false}
      - {text: "`[1, b, c]`", correct: false}
      - {text: "`[1]`", correct: false}
    answer: "`[1][b][c]` : le repli sur la virgule appelle `std::print` pour chaque élément, de gauche à droite."
    check:
      output: "[1][b][c]"
  - key: code-recursion
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int profondeur() {
          return 0;
      }

      template <typename Premier, typename... Reste>
      int profondeur(const Premier&, const Reste&... reste) {
          return 1 + profondeur(reste...);
      }

      template <typename... Types>
      bool tous(Types... valeurs) {
          return (... && valeurs);
      }

      int main() {
          std::println("{} {} {}", profondeur('a', 2, 3.0), tous(true, false), tous());
      }
      ```
    choices:
      - {text: "`3 false true`", correct: true}
      - {text: "`3 false false`", correct: false}
      - {text: "`2 false true`", correct: false}
      - {text: "`3 true true`", correct: false}
    answer: "`3 false true` : la récursion retire un argument à chaque appel, jusqu'à la surcharge sans argument. Un repli vide sur `&&` vaut `true`."
    check:
      output: "3 false true"
  - key: bug-repli-pack-vide
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `somme()` : « fold of empty expansion over operator+ ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      template <typename... Types>
      auto somme(Types... valeurs) {
          return (valeurs + ...);
      }

      int main() {
          std::println("{} {}", somme(1, 2), somme());
      }
      ```
    choices:
      - {text: "Écrire le repli avec une valeur initiale : `(valeurs + ... + 0)`", correct: true}
      - {text: "Écrire le repli dans l'autre sens : `(... + valeurs)`", correct: false}
      - {text: "Écrire le repli sans parenthèses : `valeurs + ...`", correct: false}
      - {text: "Écrire le repli avec `sizeof...` : `(sizeof...(valeurs) + ...)`", correct: false}
    answer: |-
      ```cpp
      return (valeurs + ... + 0);
      ```
      Un repli sur `+` n'a pas de valeur pour un pack vide. La valeur initiale la lui donne. Changer le sens du
      repli ne règle rien.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse cette expression de repli, écrite sans parenthèses. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename... Types>
      auto produit(Types... valeurs) {
          return valeurs * ...;
      }

      int main() {
          std::println("{}", produit(2, 3, 4));
      }
      ```
    choices:
      - {text: "Écrire `return (valeurs * ...);`", correct: true}
      - {text: "Écrire `return valeurs... * ;`", correct: false}
      - {text: "Écrire `return {valeurs * ...};`", correct: false}
      - {text: "Écrire `return valeurs * ...valeurs;`", correct: false}
    answer: |-
      ```cpp
      return (valeurs * ...);
      ```
      Les parenthèses font partie de la syntaxe d'une expression de repli.
  - key: bug-recursion-sans-fin
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'afficher()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      template <typename Premier, typename... Reste>
      void afficher(const Premier& premier, const Reste&... reste) {
          std::print("{} ", premier);
          afficher(reste...);
      }

      int main() {
          afficher(1, 2, 3);
          std::println("");
      }
      ```
    choices:
      - {text: "Déclarer avant le template une surcharge `void afficher() {}`", correct: true}
      - {text: "Appeler `afficher(premier, reste...);` dans le template", correct: false}
      - {text: "Appeler `afficher(reste);` sans les trois points", correct: false}
      - {text: "Déclarer `Reste` sans les trois points : `typename Reste`", correct: false}
    answer: |-
      ```cpp
      void afficher() {}
      ```
      Quand le pack est vide, l'appel récursif devient `afficher()`, que le template n'accepte pas : il lui faut au
      moins un argument. Une surcharge sans paramètre arrête la récursion. En C++17, un repli sur la virgule évite
      toute récursion.
  - key: bug-expansion-oubliee
    format: bug-fix
    question: |-
      Le compilateur répond « parameter packs not expanded with '...' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int somme3(int a, int b, int c) {
          return a + b + c;
      }

      template <typename... Types>
      int appeler(Types... valeurs) {
          return somme3(valeurs);
      }

      int main() {
          std::println("{}", appeler(1, 2, 3));
      }
      ```
    choices:
      - {text: "Écrire `somme3(valeurs...)`", correct: true}
      - {text: "Écrire `somme3(...valeurs)`", correct: false}
      - {text: "Écrire `somme3(Types...)`", correct: false}
      - {text: "Écrire `somme3(sizeof...(valeurs))`", correct: false}
    answer: |-
      ```cpp
      return somme3(valeurs...);
      ```
      Un pack ne s'utilise pas tel quel : il faut le déployer, avec les trois points à droite du motif.
