notion: references-pendantes
lesson: |-
  Une référence ou un pointeur est **pendant** (*dangling*) quand l'objet qu'il désigne **a été détruit**. S'en
  servir est un **comportement indéfini** : le programme peut afficher l'ancienne valeur, n'importe quoi, ou planter.

  Une référence et un pointeur brut **ne possèdent pas** l'objet : rien ne les prévient de sa destruction.

  **Les causes à reconnaître.**

  - **Renvoyer l'adresse d'une variable locale.** Elle est détruite à la fin de la fonction.

    ```cpp
    const std::string& nom() {
        std::string resultat = "Ada";
        return resultat;       // référence vers une variable détruite
    }
    ```

  - **Garder un pointeur vers une variable dont le bloc est fini.**
  - **Garder une référence vers un élément d'un `std::vector`, puis y ajouter un élément.** Si le vecteur n'a plus de
    place, il **réalloue** : ses éléments déménagent, et les références, pointeurs et itérateurs pris avant ne
    désignent plus rien.
  - **Garder une référence vers un temporaire** au-delà de l'instruction, par exemple à travers le retour d'une
    fonction comme `std::min`.

  **Ce qui est sûr.**

  - **Renvoyer par valeur** : le résultat est construit chez l'appelant.
  - Renvoyer une référence vers un objet qui **survit à la fonction** : un paramètre reçu par référence, un membre de
    l'objet, une variable `static`.
  - Reprendre la référence **après** avoir modifié le vecteur, ou garder un **indice** plutôt qu'une référence.

  **Les garde-fous.**

  - GCC avertit quand une fonction renvoie l'adresse d'une locale (`-Wreturn-local-addr`), et `-Wall` signale
    certaines références vers des temporaires (`-Wdangling-reference`).
  - **AddressSanitizer** (`-fsanitize=address`) détecte à l'exécution l'usage d'une mémoire libérée.

  Le pire cas est celui où le programme **semble marcher** : la mémoire n'a pas encore été réutilisée, l'ancienne
  valeur s'y trouve toujours, et le bug attend un autre jour.

  **En entretien** : « Une référence pendante désigne un objet détruit. Je ne renvoie jamais l'adresse d'une locale,
  je me méfie des références vers les éléments d'un vecteur qui grandit, et je fais tourner les tests avec
  AddressSanitizer. »
cards:
  - key: definition-pendante
    format: course
    question: Qu'est-ce qu'une référence pendante ?
    choices:
      - {text: "Une référence vers un objet qui a été détruit", correct: true}
      - {text: "Une référence qui n'a pas été initialisée", correct: false}
      - {text: "Une référence vers un objet constant", correct: false}
      - {text: "Une référence qui a changé de cible", correct: false}
    answer: "Elle désigne un emplacement dont l'objet n'existe plus. S'en servir est un comportement indéfini. Une référence non initialisée ne compile pas, et une référence ne change jamais de cible."
  - key: retour-de-locale
    format: course
    question: Pourquoi ne renvoie-t-on pas une référence vers une variable locale ?
    choices:
      - {text: "La variable est détruite au retour de la fonction", correct: true}
      - {text: "La variable est copiée deux fois, ce qui est lent", correct: false}
      - {text: "La variable devient globale, et ne peut plus être modifiée", correct: false}
      - {text: "La variable garde sa valeur d'un appel à l'autre", correct: false}
    answer: "Une variable locale vit jusqu'à la fin de sa fonction. La référence renvoyée désigne alors de la mémoire libérée. On renvoie par valeur."
  - key: reallocation-du-vecteur
    format: course
    question: "Pourquoi une référence vers `v[0]` peut-elle devenir pendante après `v.push_back(x)` ?"
    choices:
      - {text: "Le vecteur peut réallouer, et déménager tous ses éléments", correct: true}
      - {text: "`push_back` insère le nouvel élément à la position 0", correct: false}
      - {text: "`push_back` détruit le premier élément pour faire de la place", correct: false}
      - {text: "Une référence vers un élément est toujours une copie", correct: false}
    answer: "Quand sa capacité est épuisée, le vecteur alloue un bloc plus grand, y déplace ses éléments et libère l'ancien. Les références, pointeurs et itérateurs pris avant désignent l'ancien bloc."
  - key: semble-marcher
    format: course
    question: Pourquoi un programme qui utilise une référence pendante peut-il sembler fonctionner ?
    choices:
      - {text: "La mémoire libérée contient souvent encore l'ancienne valeur", correct: true}
      - {text: "Le compilateur recrée l'objet détruit quand on s'en sert", correct: false}
      - {text: "Une référence garde une copie de secours de l'objet", correct: false}
      - {text: "Le système interdit de réutiliser une mémoire encore désignée", correct: false}
    answer: "Détruire un objet n'efface pas sa mémoire. Tant qu'elle n'est pas réutilisée, la lecture donne l'ancienne valeur : le bug reste caché, jusqu'au jour où autre chose y est écrit."
  - key: vf-retour-par-valeur
    format: true-false
    question: Renvoyer une variable locale par valeur est sûr.
    truth: true
    answer: Le résultat est copié, ou construit directement chez l'appelant. Aucune référence ne survit à la variable.
  - key: vf-exception
    format: true-false
    question: Utiliser une référence pendante lève une exception.
    truth: false
    answer: C'est un comportement indéfini, sans exception ni message. Seul un outil comme AddressSanitizer le signale.
  - key: vf-static
    format: true-false
    question: Une fonction peut renvoyer sans danger une référence vers une variable locale `static`.
    truth: true
    answer: "Une variable `static` vit jusqu'à la fin du programme : la référence ne pend pas."
  - key: vf-reference-garde-en-vie
    format: true-false
    question: Une référence garde en vie l'objet qu'elle désigne.
    truth: false
    answer: Elle ne le possède pas. Seule exception, une référence constante locale liée directement à un temporaire en prolonge la vie.
  - key: qcm-outil
    format: multiple-choice
    question: "Quelle option de compilation fait détecter, à l'exécution, l'usage d'une mémoire libérée ?"
    choices:
      - {text: "`-fsanitize=address`", correct: true}
      - {text: "`-O2`", correct: false}
      - {text: "`-std=c++23`", correct: false}
      - {text: "`-Wextra`", correct: false}
    answer: "AddressSanitizer instrumente le programme et arrête l'exécution au premier accès à une mémoire libérée, avec la ligne fautive. `-Wextra` ne voit que ce qui est visible à la compilation."
  - key: qcm-retour-sur
    format: multiple-choice
    question: Laquelle de ces fonctions renvoie une référence qui ne pend pas ?
    choices:
      - {text: "Celle qui renvoie un paramètre reçu par référence", correct: true}
      - {text: "Celle qui renvoie une variable locale", correct: false}
      - {text: "Celle qui renvoie un paramètre reçu par valeur", correct: false}
      - {text: "Celle qui renvoie le résultat d'un calcul local", correct: false}
    answer: "Un paramètre reçu par référence désigne un objet de l'appelant, qui survit à la fonction. Un paramètre reçu par valeur est une copie locale, détruite au retour."
  - key: qcm-vecteur
    format: multiple-choice
    question: Comment garder un accès sûr à un élément d'un vecteur auquel on va ajouter des éléments ?
    choices:
      - {text: "Garder son indice, et relire `v[indice]` au besoin", correct: true}
      - {text: "Garder une référence, prise avant les ajouts", correct: false}
      - {text: "Garder un pointeur, pris avant les ajouts", correct: false}
      - {text: "Garder un itérateur, pris avant les ajouts", correct: false}
    answer: "Un indice reste valable après une réallocation. Références, pointeurs et itérateurs désignent l'ancien bloc de mémoire. `reserve` avant les ajouts évite aussi la réallocation."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Quel avertissement de GCC signale une fonction qui renvoie l'adresse d'une variable locale ?"
    choices:
      - {text: "`-Wreturn-local-addr`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wsign-compare`", correct: false}
      - {text: "`-Wunused-variable`", correct: false}
    answer: "`-Wreturn-local-addr`, actif par défaut. Il ne voit que les cas directs : un avertissement absent ne prouve pas qu'il n'y a pas de référence pendante."
  - key: code-retour-par-valeur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      std::string saluer(const std::string& prenom) {
          std::string message = "Bonjour, " + prenom;
          return message;
      }

      int main() {
          std::string resultat = saluer("Ada");
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "`Bonjour, Ada`", correct: true}
      - {text: "`Bonjour, `", correct: false}
      - {text: "Des caractères imprévisibles", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Bonjour, Ada` : la fonction renvoie sa chaîne par valeur. `resultat` possède son texte, qui ne dépend plus de la variable locale détruite."
    check:
      output: "Bonjour, Ada"
  - key: code-pointeur-vers-locale
    format: code-output
    question: |-
      Que garantit le langage sur ce qu'affiche ce programme ?
      ```cpp
      #include <print>

      int* creer() {
          int valeur = 42;
          return &valeur;
      }

      int main() {
          int* p = creer();
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Rien : c'est un comportement indéfini", correct: true}
      - {text: "Qu'il affiche `42`", correct: false}
      - {text: "Qu'il affiche `0`", correct: false}
      - {text: "Qu'il ne compile pas", correct: false}
    answer: |-
      Rien. `valeur` est détruite à la fin de `creer` : `p` est pendant, et le déréférencer est un comportement
      indéfini. Le code compile, avec un avertissement.
    unverifiable: déréférencer un pointeur vers une variable locale détruite est un comportement indéfini
  - key: code-reserve
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          v.reserve(10);
          int& premier = v[0];
          v.push_back(4);
          premier = 99;
          std::println("{} {}", v[0], v.size());
      }
      ```
    choices:
      - {text: "`99 4`", correct: true}
      - {text: "`1 4`", correct: false}
      - {text: "`99 10`", correct: false}
      - {text: "`1 10`", correct: false}
    answer: "`99 4` : `reserve(10)` donne au vecteur la place pour dix éléments. Le `push_back` ne réalloue pas : la référence prise avant reste valable. `reserve` change la capacité, pas la taille."
    check:
      output: "99 4"
  - key: code-static
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int& compteur() {
          static int nombre = 0;
          return nombre;
      }

      int main() {
          compteur() += 5;
          compteur()++;
          std::println("{}", compteur());
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`5`", correct: false}
    answer: "`6` : `nombre` est `static`, elle vit pendant tout le programme. La référence renvoyée désigne toujours la même variable, que chaque appel modifie."
    check:
      output: "6"
  - key: bug-reference-vers-locale
    format: bug-fix
    question: |-
      Ce programme compile, puis plante (« Segmentation fault »). Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      const std::string& titre() {
          std::string resultat = "Le Tour de C++, première édition";
          return resultat;
      }

      int main() {
          std::println("{}", titre());
      }
      ```
    choices:
      - {text: "Renvoyer par valeur : `std::string titre()`", correct: true}
      - {text: "Renvoyer un pointeur : `const std::string* titre()`", correct: false}
      - {text: "Déclarer `resultat` avec `const std::string`", correct: false}
      - {text: "Ranger le résultat dans une `const std::string&`, dans `main`", correct: false}
    answer: |-
      ```cpp
      std::string titre() {
      ```
      `resultat` est détruite à la fin de la fonction : la référence renvoyée pend. Un pointeur vers elle pendrait
      tout autant. Par valeur, la chaîne est remise à l'appelant.
  - key: bug-vecteur-realloue
    format: bug-fix
    question: |-
      Ce programme devrait afficher `99`, et affiche `1`. Pourquoi ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          int& premier = v[0];
          v.push_back(4);
          premier = 99;
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "`push_back` a réalloué le vecteur : `premier` désigne l'ancien bloc", correct: true}
      - {text: "`push_back` a inséré 4 en tête, et décalé les éléments", correct: false}
      - {text: "`premier` est une copie de `v[0]`, pas un alias", correct: false}
      - {text: "`v[0]` est en lecture seule après un `push_back`", correct: false}
    answer: |-
      ```cpp
      v.push_back(4);
      int& premier = v[0];
      premier = 99;
      ```
      Le vecteur n'avait plus de place : il a déménagé ses éléments. L'écriture dans `premier` va dans la mémoire
      libérée, ce qui est un comportement indéfini. On prend la référence après l'ajout.
  - key: bug-pointeur-hors-du-bloc
    format: bug-fix
    question: |-
      Ce programme affiche souvent `5`, mais rien ne le garantit. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* p = nullptr;
          {
              int x = 5;
              p = &x;
          }
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Déclarer `x` dans le bloc extérieur, avant `p`", correct: true}
      - {text: "Déclarer `p` dans le bloc intérieur, après `x`", correct: false}
      - {text: "Initialiser `p` avec `&x` au lieu de `nullptr`", correct: false}
      - {text: "Écrire `std::println(\"{}\", p);` sans étoile", correct: false}
    answer: |-
      ```cpp
      int x = 5;
      int* p = &x;
      std::println("{}", *p);
      ```
      `x` est détruite à l'accolade fermante de son bloc : `p` pend. L'objet pointé doit vivre au moins aussi
      longtemps que le pointeur qui s'en sert.
  - key: bug-reference-vers-temporaire
    format: bug-fix
    question: |-
      Avec `-Wall`, GCC répond « possibly dangling reference to a temporary ». Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>

      int main() {
          int stock = 8;
          const int& plus_petit = std::min(stock, 2 * 5);
          std::println("{}", plus_petit);
      }
      ```
    choices:
      - {text: "Ranger le résultat dans un `int`, qui le copie", correct: true}
      - {text: "Ranger le résultat dans un `int&`, sans `const`", correct: false}
      - {text: "Ranger le résultat dans un `const int*`", correct: false}
      - {text: "Retirer `-Wall` de la ligne de compilation", correct: false}
    answer: |-
      ```cpp
      int plus_petit = std::min(stock, 2 * 5);
      ```
      `std::min` renvoie une référence vers l'un de ses arguments. `2 * 5` est un temporaire, détruit à la fin de
      l'instruction : s'il était le plus petit, la référence pendrait. Une copie écarte le risque.
  - key: situation-semble-marcher
    format: scenario
    question: |-
      Une fonction renvoie une référence vers une variable locale. Les tests passent sur ton poste depuis des mois, et
      le programme plante chez un client. Comment l'expliques-tu ?
    choices:
      - {text: "C'est un comportement indéfini, qui semblait marcher tant que la mémoire n'était pas réutilisée", correct: true}
      - {text: "C'est un défaut du compilateur du client, plus ancien que le tien", correct: false}
      - {text: "C'est une exception non rattrapée, que tes tests ne déclenchent pas", correct: false}
      - {text: "C'est la machine du client qui manque de mémoire vive", correct: false}
    answer: |-
      La mémoire de la variable détruite contient encore sa valeur, jusqu'à ce qu'un autre appel l'écrase. Selon le
      compilateur, les options et le chemin d'exécution, cela arrive ou non. « Les tests passent » ne prouve rien
      face à un comportement indéfini.
  - key: situation-detecter
    format: scenario
    question: |-
      Ton équipe veut attraper les références et pointeurs pendants avant la production. Que mets-tu en place ?
    choices:
      - {text: "Les tests exécutés avec AddressSanitizer, en intégration continue", correct: true}
      - {text: "Un `try` et un `catch` autour de chaque déréférencement", correct: false}
      - {text: "La compilation sans optimisation, en production", correct: false}
      - {text: "Un test `if (reference)` avant chaque usage d'une référence", correct: false}
    answer: |-
      AddressSanitizer arrête le programme au premier accès à une mémoire libérée, avec la pile d'appels. Aucune
      exception n'est levée par un accès pendant, et une référence ne se teste pas : rien ne la distingue d'une
      référence valide.
  - key: situation-accesseur
    format: scenario
    question: |-
      Un accesseur renvoie `const std::string&` vers le nom d'un objet. Un appelant garde cette référence, détruit
      l'objet, puis affiche le nom. Que proposes-tu ?
    choices:
      - {text: "Que l'appelant copie le nom dans une `std::string` s'il doit survivre à l'objet", correct: true}
      - {text: "Que l'accesseur renvoie un pointeur, plus sûr qu'une référence", correct: false}
      - {text: "Que l'objet ne soit jamais détruit, pour protéger ses références", correct: false}
      - {text: "Que l'appelant teste la référence avant de s'en servir", correct: false}
    answer: |-
      Renvoyer une référence vers un membre est courant et efficace, tant que l'appelant ne la garde pas au-delà de
      la vie de l'objet. Celui qui a besoin du nom plus longtemps en fait une copie. Un pointeur pendrait de la même
      façon.
  - key: situation-indices
    format: scenario
    question: |-
      Un programme garde, dans une liste à part, des pointeurs vers certains éléments d'un `std::vector` de joueurs.
      Après l'inscription de nouveaux joueurs, ces pointeurs désignent n'importe quoi. Que proposes-tu ?
    choices:
      - {text: "Garder les indices des joueurs, plutôt que des pointeurs vers eux", correct: true}
      - {text: "Garder des références vers les joueurs, plutôt que des pointeurs", correct: false}
      - {text: "Garder des pointeurs constants, que le vecteur ne peut pas déplacer", correct: false}
      - {text: "Ne plus jamais lire les joueurs après une inscription", correct: false}
    answer: |-
      Chaque inscription peut faire réallouer le vecteur, et déménager tous les joueurs. Un indice reste juste après
      le déménagement ; une référence ou un pointeur, constant ou non, désigne l'ancien emplacement.
