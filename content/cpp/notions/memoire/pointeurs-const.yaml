notion: pointeurs-const
lesson: |-
  Avec un pointeur, `const` peut protéger **deux choses différentes** : la variable pointée, ou le pointeur lui-même.

  ```cpp
  const int* p = &x;         // pointeur vers const : *p est en lecture seule
  int* const q = &x;         // pointeur const : q ne change plus de cible
  const int* const r = &x;   // les deux
  ```

  | Déclaration | Modifier `*p` | Changer la cible de `p` |
  |---|---|---|
  | `int* p` | oui | oui |
  | `const int* p` | **non** | oui |
  | `int* const p` | oui | **non** |
  | `const int* const p` | non | non |

  **La règle de lecture** : `const` s'applique à ce qui est **à sa gauche** ; s'il n'y a rien à gauche, à ce qui est
  à sa droite. On lit la déclaration de droite à gauche : `int* const p` se lit « `p` est un pointeur constant vers
  un `int` ». `const int*` et `int const*` veulent dire la même chose.

  **Ce que `const int*` promet, et ne promet pas.** Il promet qu'on ne modifiera pas la variable **à travers ce
  pointeur**. Il ne dit pas que la variable est constante : si `x` n'est pas `const`, elle peut changer par son nom,
  et `*p` le verra.

  **Les conversions.**

  - `int*` vers `const int*` : **permise**. On ajoute une protection.
  - `const int*` vers `int*` : **refusée**. On retirerait une protection (« discards qualifiers »). L'adresse d'une
    variable `const` ne va donc que dans un pointeur vers const.

  Un pointeur `const` (`int* const`) doit être **initialisé** à sa déclaration, comme toute constante.

  **En pratique** : `const T*` est de loin le plus courant, pour les paramètres qu'une fonction ne fait que lire
  (`const char* texte`). `T* const` est rare : une référence fait le même travail.

  **En entretien** : « Je lis de droite à gauche : `const int*` protège la valeur pointée, `int* const` protège le
  pointeur. On peut ajouter `const`, jamais l'enlever sans `const_cast`. »
cards:
  - key: pointeur-vers-const
    format: course
    question: "Que protège `const` dans `const int* p` ?"
    choices:
      - {text: "La variable pointée : on ne peut pas la modifier à travers `p`", correct: true}
      - {text: "Le pointeur : on ne peut pas le faire pointer ailleurs", correct: false}
      - {text: "Les deux : ni la variable ni le pointeur ne changent", correct: false}
      - {text: "Rien : `const` devant un pointeur est ignoré", correct: false}
    answer: "`const int*` est un pointeur vers un `int` constant : `*p = 3;` est refusé, mais `p = &y;` est permis."
  - key: pointeur-const
    format: course
    question: "Que protège `const` dans `int* const p` ?"
    choices:
      - {text: "Le pointeur : il ne peut plus changer de cible", correct: true}
      - {text: "La variable pointée : elle est en lecture seule", correct: false}
      - {text: "Les deux : ni la variable ni le pointeur ne changent", correct: false}
      - {text: "L'adresse de `p` : on ne peut plus écrire `&p`", correct: false}
    answer: "`const` est à droite de l'étoile : c'est le pointeur qui est constant. `*p = 3;` reste permis, `p = &y;` est refusé."
  - key: regle-de-lecture
    format: course
    question: "Comment sait-on à quoi s'applique un `const` dans une déclaration de pointeur ?"
    choices:
      - {text: "Il s'applique à ce qui est à sa gauche ; sinon, à ce qui est à sa droite", correct: true}
      - {text: "Il s'applique toujours au premier mot de la déclaration", correct: false}
      - {text: "Il s'applique toujours au nom de la variable", correct: false}
      - {text: "Il s'applique à tous les mots de la déclaration", correct: false}
    answer: "Dans `int* const p`, `const` suit l'étoile : le pointeur est constant. Dans `const int* p`, rien ne le précède : il qualifie `int`."
  - key: promesse-limitee
    format: course
    question: "Avec `int x = 1; const int* p = &x;`, la valeur de `*p` peut-elle changer ?"
    choices:
      - {text: "Oui : `x` n'est pas constante, et peut être modifiée par son nom", correct: true}
      - {text: "Non : un pointeur vers const fige la variable pointée", correct: false}
      - {text: "Non : `x` devient constante dès qu'un tel pointeur la désigne", correct: false}
      - {text: "Oui, mais seulement en écrivant `*p = 2;`", correct: false}
    answer: "`const int*` interdit de modifier la variable **à travers ce pointeur**. Elle peut changer par un autre chemin : `x = 5;` est permis, et `*p` vaut alors 5."
  - key: vf-ordre-de-const
    format: true-false
    question: "`const int* p` et `int const* p` déclarent la même chose."
    truth: true
    answer: "Dans les deux, `const` qualifie `int`. C'est sa place par rapport à l'étoile qui compte."
  - key: vf-ajouter-const
    format: true-false
    question: "On peut ranger un `int*` dans un `const int*`."
    truth: true
    answer: "Ajouter une protection est toujours permis. C'est la conversion inverse, qui en retirerait une, que le compilateur refuse."
  - key: vf-adresse-d-une-constante
    format: true-false
    question: "L'adresse d'une variable `const int` peut être rangée dans un `int*`."
    truth: false
    answer: "Le pointeur permettrait de modifier la constante. Son adresse ne va que dans un `const int*`."
  - key: vf-pointeur-const-initialise
    format: true-false
    question: "Un pointeur déclaré `int* const p` doit être initialisé à sa déclaration."
    truth: true
    answer: "Comme toute constante : on ne pourrait plus lui donner de cible ensuite."
  - key: qcm-declaration-pointeur-const
    format: multiple-choice
    question: Quelle déclaration interdit de faire pointer `p` ailleurs, sans protéger la variable pointée ?
    choices:
      - {text: "`int* const p = &x;`", correct: true}
      - {text: "`const int* p = &x;`", correct: false}
      - {text: "`int const* p = &x;`", correct: false}
      - {text: "`const int p = &x;`", correct: false}
    answer: "`const` après l'étoile : le pointeur est constant. Les deux suivantes protègent la variable pointée, et la dernière ne déclare pas un pointeur."
  - key: qcm-ligne-permise
    format: multiple-choice
    question: "Avec `const int* p = &x;`, laquelle de ces lignes compile ?"
    choices:
      - {text: "`p = &y;`", correct: true}
      - {text: "`*p = 5;`", correct: false}
      - {text: "`(*p)++;`", correct: false}
      - {text: "`int* q = p;`", correct: false}
    answer: "Changer la cible est permis. Modifier `*p` ne l'est pas, et ranger `p` dans un `int*` retirerait la protection."
  - key: qcm-parametre
    format: multiple-choice
    question: "Que dit le paramètre de `void afficher(const char* texte)` à l'appelant ?"
    choices:
      - {text: "Que la fonction ne modifiera pas les caractères pointés", correct: true}
      - {text: "Que la fonction ne fera pas pointer `texte` ailleurs", correct: false}
      - {text: "Que le texte passé doit être une constante", correct: false}
      - {text: "Que la fonction copie le texte avant de le lire", correct: false}
    answer: "Un pointeur vers const : les caractères sont en lecture seule pour la fonction. L'appelant peut lui passer un texte modifiable comme un texte constant."
  - key: qcm-les-deux
    format: multiple-choice
    question: Quelle déclaration protège à la fois la variable pointée et le pointeur ?
    choices:
      - {text: "`const int* const p = &x;`", correct: true}
      - {text: "`const const int* p = &x;`", correct: false}
      - {text: "`const int const* p = &x;`", correct: false}
      - {text: "`int* const const p = &x;`", correct: false}
    answer: "Un `const` de chaque côté de l'étoile : celui de gauche pour la valeur, celui de droite pour le pointeur."
  - key: code-lecture-seule-suit
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          const int* p = &x;
          x = 5;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`5` : `const int*` interdit de modifier `x` à travers `p`, pas de la modifier par son nom. `*p` lit la valeur courante."
    check:
      output: "5"
  - key: code-pointeur-const-ecrit
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          int* const p = &x;
          *p = 8;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`8`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`8` : c'est le pointeur qui est constant, pas la variable pointée. Écrire dans `*p` est permis."
    check:
      output: "8"
  - key: code-ecriture-refusee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          const int* p = &x;
          *p = 3;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `*p` est en lecture seule (« assignment of read-only location »), même si `x` elle-même n'est pas constante."
    check:
      compiles: false
  - key: code-changer-de-cible
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = 2;
          const int* p = &a;
          p = &b;
          b = 9;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9` : un pointeur vers const peut changer de cible. Il désigne `b`, dont il lit la valeur au moment de l'affichage."
    check:
      output: "9"
  - key: bug-ecrire-par-pointeur-vers-const
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only location '* p' ». La fonction doit vraiment remettre le
      compteur à zéro. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void remettre_a_zero(const int* p) {
          *p = 0;
      }

      int main() {
          int compteur = 7;
          remettre_a_zero(&compteur);
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "Écrire le paramètre `int* p`", correct: true}
      - {text: "Écrire le paramètre `int* const p`, en plus de `const`", correct: false}
      - {text: "Écrire `p = 0;` dans la fonction", correct: false}
      - {text: "Écrire l'appel `remettre_a_zero(compteur)`", correct: false}
    answer: |-
      ```cpp
      void remettre_a_zero(int* p) {
      ```
      `const int*` promet de ne pas modifier la variable pointée. Une fonction qui la modifie ne doit pas faire cette
      promesse.
  - key: bug-changer-pointeur-const
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only variable 'courant' ». Le pointeur doit passer d'un joueur à
      l'autre. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int ada = 10;
          int alan = 20;
          int* const courant = &ada;
          courant = &alan;
          std::println("{}", *courant);
      }
      ```
    choices:
      - {text: "Retirer `const` : écrire `int* courant`", correct: true}
      - {text: "Déplacer `const` : écrire `const int courant`", correct: false}
      - {text: "Écrire `*courant = &alan;`", correct: false}
      - {text: "Écrire `courant == &alan;`", correct: false}
    answer: |-
      ```cpp
      int* courant = &ada;
      ```
      `int* const` fige la cible du pointeur. S'il doit en changer, ce n'est pas un pointeur constant ; pour protéger
      en plus les scores, on écrirait `const int* courant`.
  - key: bug-retirer-const
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'const int*' to 'int*' ». Le programme ne fait que lire la
      limite. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int limite = 100;
          int* p = &limite;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Écrire `const int* p = &limite;`", correct: true}
      - {text: "Écrire `int* const p = &limite;`", correct: false}
      - {text: "Écrire `int* p = (int*)&limite;`", correct: false}
      - {text: "Écrire `int* p = *limite;`", correct: false}
    answer: |-
      ```cpp
      const int* p = &limite;
      ```
      L'adresse d'une constante ne va que dans un pointeur vers const. Forcer la conversion par un cast compilerait,
      mais écrire ensuite dans `*p` serait un comportement indéfini.
  - key: bug-pointeur-const-sans-valeur
    format: bug-fix
    question: |-
      Le compilateur répond « uninitialized 'const p' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int* const p;
          p = &x;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Écrire `int* const p = &x;` en une ligne", correct: true}
      - {text: "Écrire `const int* const p;` avec deux `const`", correct: false}
      - {text: "Écrire `*p = &x;` sur la ligne suivante", correct: false}
      - {text: "Écrire `int* const p = nullptr;` puis `p = &x;`", correct: false}
    answer: |-
      ```cpp
      int* const p = &x;
      ```
      Un pointeur constant reçoit sa cible à la déclaration : on ne peut plus l'affecter ensuite.
  - key: trous-pointeur-vers-const
    format: fill-in
    question: |-
      Complète pour que `*p` soit en lecture seule :
      ```cpp
      int x = 5;
      ___ int* p = &x;
      ```
    blanks:
      - [const]
    answer: "`const int* p` : un pointeur vers un `int` constant."
  - key: trous-pointeur-const
    format: fill-in
    question: |-
      Complète pour que `p` ne puisse plus changer de cible :
      ```cpp
      int x = 5;
      int* ___ p = &x;
      ```
    blanks:
      - [const]
    answer: "`int* const p` : `const` après l'étoile rend le pointeur constant."
  - key: trous-ligne-permise
    format: fill-in
    question: |-
      Complète avec ce qu'un pointeur vers const permet de modifier :
      ```cpp
      int x = 1;
      int y = 2;
      const int* p = &x;
      ___ = &y;   // permis
      ```
    blanks:
      - [p]
    answer: "`p = &y;` : le pointeur change de cible. C'est `*p` qui est en lecture seule."
  - key: trous-les-deux
    format: fill-in
    question: |-
      Complète pour que ni la variable pointée ni le pointeur ne puissent changer :
      ```cpp
      const int* ___ p = &x;
      ```
    blanks:
      - [const]
    answer: "`const int* const p` : un `const` de chaque côté de l'étoile."
