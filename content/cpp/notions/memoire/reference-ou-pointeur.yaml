notion: reference-ou-pointeur
lesson: |-
  Une référence et un pointeur désignent tous deux un objet qui vit ailleurs. Ils ne promettent pas la même chose.

  | | Référence `T&` | Pointeur `T*` |
  |---|---|---|
  | Peut ne rien désigner | **non** | oui : `nullptr` |
  | Peut changer de cible | **non** | oui |
  | Doit être initialisé | oui | non (mais on le fait) |
  | Syntaxe d'accès | comme l'objet : `r.x` | `*p`, `p->x` |
  | Arithmétique, tableaux | non | oui |

  **La règle.** Une **référence par défaut**. Un **pointeur** quand il faut l'une de ces deux choses :

  - **« rien » est une valeur possible** : un résultat de recherche qui peut échouer, un paramètre facultatif ;
  - **la cible doit changer** : parcourir une liste chaînée, un membre qui désigne tour à tour plusieurs objets.

  **Pour un paramètre.**

  - L'argument est **obligatoire** : référence (`const T&` pour lire, `T&` pour modifier). La fonction n'a rien à
    tester.
  - L'argument est **facultatif** : pointeur, et la fonction teste `nullptr`.

  Une fonction qui prend un pointeur dit à l'appelant « tu peux me passer `nullptr` ». Si ce n'est pas vrai, c'est
  une référence qu'il fallait.

  **Dans les deux cas, ni l'un ni l'autre ne possède l'objet** : ils l'observent. Ils deviennent pendants si l'objet
  est détruit avant eux. Pour **posséder** la mémoire, on prend un pointeur intelligent.

  **Passer de l'un à l'autre.** `&r` donne un pointeur vers l'objet désigné ; `*p` donne l'objet, auquel on peut lier
  une référence. Mais `int& r = *p;` avec `p` nul est un comportement indéfini : on teste le pointeur **avant**.

  **En entretien** : « Référence quand l'objet existe forcément, pointeur quand il peut manquer ou que la cible
  change. Un pointeur brut observe ; la propriété passe par `std::unique_ptr` ou `std::shared_ptr`. »
tour:
  - title: Référence ou pointeur ?
    text: |-
      Les deux désignent un objet sans le copier. La différence : une référence désigne **toujours** un objet, et
      n'en change pas ; un pointeur peut valoir `nullptr`, et changer de cible.

      D'où la règle : une référence quand l'objet existe forcément, un pointeur quand il peut manquer.

      Ici, `doubler` exige un entier : elle prend une référence. `chercher` peut ne rien trouver : elle renvoie un
      pointeur, que l'appelant teste.

      Essaie : cherche `99` au lieu de `20`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <vector>

          void doubler(int& n) {
              n *= 2;
          }

          int* chercher(std::vector<int>& valeurs, int cherchee) {
              for (int& valeur : valeurs) {
                  if (valeur == cherchee) {
                      return &valeur;
                  }
              }
              return nullptr;
          }

          int main() {
              std::vector<int> scores{10, 20, 30};

              int* trouve = chercher(scores, 20);
              if (trouve) {
                  doubler(*trouve);
              }

              std::println("{} {} {}", scores[0], scores[1], scores[2]);
          }
      output: "10 40 30"
cards:
  - key: difference-principale
    format: course
    question: Quelle garantie une référence donne-t-elle, qu'un pointeur ne donne pas ?
    choices:
      - {text: "Elle désigne toujours un objet : elle ne peut pas être nulle", correct: true}
      - {text: "Elle garde l'objet en vie tant qu'elle existe", correct: false}
      - {text: "Elle copie l'objet, pour le protéger des modifications", correct: false}
      - {text: "Elle occupe moins de mémoire qu'un pointeur", correct: false}
    answer: "Une référence est liée à un objet dès sa déclaration, et n'en change pas. Elle ne le possède pas pour autant : si l'objet est détruit, elle devient pendante, comme un pointeur."
  - key: quand-un-pointeur
    format: course
    question: Dans quel cas faut-il un pointeur plutôt qu'une référence ?
    choices:
      - {text: "Quand « aucun objet » est une valeur possible, ou que la cible doit changer", correct: true}
      - {text: "Quand l'objet désigné est un entier ou un nombre à virgule", correct: false}
      - {text: "Quand la fonction ne fait que lire l'objet", correct: false}
      - {text: "Quand l'objet désigné a été déclaré avec `const`", correct: false}
    answer: "Ce sont les deux choses qu'une référence ne sait pas faire : valoir « rien », et désigner un autre objet plus tard."
  - key: parametre-obligatoire
    format: course
    question: "Que dit à l'appelant une fonction dont le paramètre est un pointeur, comme `void traiter(Client* client)` ?"
    choices:
      - {text: "Qu'il peut passer `nullptr` : l'argument est facultatif", correct: true}
      - {text: "Qu'il doit passer un objet alloué avec `new`", correct: false}
      - {text: "Que la fonction détruira l'objet à la fin de l'appel", correct: false}
      - {text: "Que la fonction recevra une copie de l'objet", correct: false}
    answer: "Un pointeur admet la valeur nulle. Si la fonction ne la supporte pas, sa signature ment : une référence, `Client&`, dirait que l'argument est obligatoire."
  - key: propriete
    format: course
    question: Une référence ou un pointeur brut possèdent-ils l'objet qu'ils désignent ?
    choices:
      - {text: "Non : ils l'observent, et deviennent pendants s'il est détruit", correct: true}
      - {text: "Oui : l'objet est détruit quand ils disparaissent", correct: false}
      - {text: "La référence oui, le pointeur non", correct: false}
      - {text: "Le pointeur oui, la référence non", correct: false}
    answer: "Ni l'un ni l'autre ne décide de la vie de l'objet. La propriété se confie à l'objet lui-même (une variable locale) ou à un pointeur intelligent."
  - key: vf-reference-change
    format: true-false
    question: Une référence peut désigner un objet, puis un autre, au fil du programme.
    truth: false
    answer: Elle garde sa cible toute sa vie. C'est un pointeur qu'il faut pour en changer.
  - key: vf-pointeur-nul
    format: true-false
    question: Un pointeur peut valoir `nullptr`, pour dire qu'il ne désigne aucun objet.
    truth: true
    answer: C'est ce qui le rend adapté à un résultat ou à un paramètre facultatifs.
  - key: vf-reference-depuis-pointeur-nul
    format: true-false
    question: "`int& r = *p;` est sûr même si `p` vaut `nullptr`, tant qu'on ne lit pas `r`."
    truth: false
    answer: Déréférencer un pointeur nul est déjà un comportement indéfini. On teste le pointeur avant de créer la référence.
  - key: vf-syntaxe
    format: true-false
    question: "On accède à un membre à travers une référence avec un point, comme avec l'objet lui-même."
    truth: true
    answer: "`r.x`, là où un pointeur demande `p->x`. Une référence s'utilise exactement comme l'objet qu'elle désigne."
  - key: qcm-parametre-obligatoire
    format: multiple-choice
    question: "Une fonction modifie un compte, qui doit toujours exister. Quelle signature choisis-tu ?"
    choices:
      - {text: "`void crediter(Compte& compte, int montant)`", correct: true}
      - {text: "`void crediter(Compte* compte, int montant)`", correct: false}
      - {text: "`void crediter(Compte compte, int montant)`", correct: false}
      - {text: "`void crediter(const Compte& compte, int montant)`", correct: false}
    answer: "Une référence non constante : l'argument est obligatoire, et la fonction le modifie. Un pointeur laisserait croire qu'on peut passer `nullptr` ; par valeur, on créditerait une copie."
  - key: qcm-resultat-facultatif
    format: multiple-choice
    question: "Une fonction cherche un client dans une liste, et peut ne pas le trouver. Que renvoie-t-elle ?"
    choices:
      - {text: "Un pointeur, qui vaut `nullptr` si le client est absent", correct: true}
      - {text: "Une référence, qui est nulle si le client est absent", correct: false}
      - {text: "Une référence vers un client vide, créé dans la fonction", correct: false}
      - {text: "Un `bool`, et le client dans une variable globale", correct: false}
    answer: "Une référence ne peut pas dire « rien », et une référence vers un objet local serait pendante. Le pointeur porte l'absence ; l'appelant le teste."
  - key: qcm-conversion
    format: multiple-choice
    question: "Avec `int* p` non nul, comment obtenir une référence vers l'entier pointé ?"
    choices:
      - {text: "`int& r = *p;`", correct: true}
      - {text: "`int& r = p;`", correct: false}
      - {text: "`int& r = &p;`", correct: false}
      - {text: "`int& r = p->;`", correct: false}
    answer: "`*p` est l'entier pointé, auquel la référence se lie. Dans l'autre sens, `&r` donne un pointeur vers l'objet désigné par `r`."
  - key: qcm-liste-chainee
    format: multiple-choice
    question: "Pour parcourir une liste chaînée nœud après nœud, de quoi a-t-on besoin ?"
    choices:
      - {text: "D'un pointeur, qui passe d'un nœud au suivant", correct: true}
      - {text: "D'une référence, qu'on réaffecte à chaque nœud", correct: false}
      - {text: "D'une copie de chaque nœud, l'un après l'autre", correct: false}
      - {text: "D'une constante, liée au premier nœud", correct: false}
    answer: "La cible change à chaque tour, et la fin de la liste se dit `nullptr` : les deux choses qu'une référence ne sait pas faire. Réaffecter une référence écraserait le premier nœud."
  - key: bug-pointeur-jamais-teste
    format: bug-fix
    question: |-
      Ce programme plante quand on appelle `afficher(nullptr)`, ce que sa signature permet. L'argument devrait être
      obligatoire. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Joueur {
          int score;
      };

      void afficher(const Joueur* joueur) {
          std::println("{}", joueur->score);
      }

      int main() {
          afficher(nullptr);
      }
      ```
    choices:
      - {text: "Prendre une référence : `void afficher(const Joueur& joueur)`", correct: true}
      - {text: "Prendre le pointeur par référence : `const Joueur*& joueur`", correct: false}
      - {text: "Écrire `joueur.score` avec un point dans l'affichage", correct: false}
      - {text: "Déclarer `score` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      void afficher(const Joueur& joueur) {
          std::println("{}", joueur.score);
      }
      ```
      Avec une référence, `afficher(nullptr)` ne compile plus : l'appelant doit fournir un joueur. Si l'argument
      devait rester facultatif, on garderait le pointeur, et on testerait `nullptr`.
  - key: bug-reference-depuis-nul
    format: bug-fix
    question: |-
      Ce programme plante quand aucun score n'est trouvé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int* meilleur_score() {
          return nullptr;
      }

      int main() {
          int& score = *meilleur_score();
          std::println("{}", score);
      }
      ```
    choices:
      - {text: "Garder le pointeur, et le tester avant de le déréférencer", correct: true}
      - {text: "Déclarer `score` avec `const int&` au lieu de `int&`", correct: false}
      - {text: "Écrire `int& score = meilleur_score();` sans étoile", correct: false}
      - {text: "Écrire `int& score = &meilleur_score();` avec une esperluette", correct: false}
    answer: |-
      ```cpp
      int* score = meilleur_score();
      if (score) {
          std::println("{}", *score);
      }
      ```
      Une référence ne peut pas être nulle : la créer à partir d'un pointeur nul est un comportement indéfini. On
      teste le pointeur d'abord.
  - key: bug-parcours-par-reference
    format: bug-fix
    question: |-
      Ce programme devrait avancer d'un nœud sans modifier la liste. Il affiche `2 2` : le premier nœud a été
      écrasé. Pourquoi ?
      ```cpp
      #include <print>

      struct Noeud {
          int valeur;
          Noeud* suivant;
      };

      int main() {
          Noeud second{2, nullptr};
          Noeud premier{1, &second};

          Noeud& courant = premier;
          courant = *courant.suivant;

          std::println("{} {}", premier.valeur, courant.valeur);
      }
      ```
    choices:
      - {text: "Affecter à une référence copie dans l'objet désigné : `premier` reçoit `second`", correct: true}
      - {text: "`*courant.suivant` déréférence `courant`, puis lit `suivant`", correct: false}
      - {text: "Une référence vers une struct copie toujours ses membres", correct: false}
      - {text: "`second` est détruit quand `courant` change de cible", correct: false}
    answer: |-
      ```cpp
      Noeud* courant = &premier;
      courant = courant->suivant;
      ```
      Une référence ne change pas de cible : `courant = ...` écrit dans `premier`. Pour avancer dans une liste, il
      faut un pointeur, qu'on fait pointer sur le nœud suivant.
  - key: bug-adresse-pour-une-reference
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void doubler(int& n) {
          n *= 2;
      }

      int main() {
          int x = 5;
          doubler(&x);
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "Écrire l'appel `doubler(x)`", correct: true}
      - {text: "Écrire l'appel `doubler(*x)`", correct: false}
      - {text: "Écrire l'appel `doubler(&&x)`", correct: false}
      - {text: "Écrire le paramètre `int&& n`", correct: false}
    answer: |-
      ```cpp
      doubler(x);
      ```
      `&x` est un pointeur, que la fonction n'attend pas. Avec un paramètre référence, on passe la variable telle
      quelle : c'est le compilateur qui crée l'alias.
  - key: situation-relecture-api
    format: scenario
    question: |-
      En relecture, tu vois `void envoyer(Message* message)`. La fonction déréférence `message` dès sa première ligne,
      sans test, et l'auteur confirme qu'un message est toujours fourni. Que demandes-tu ?
    choices:
      - {text: "De prendre une référence : `const Message& message`", correct: true}
      - {text: "D'ajouter un commentaire « ne pas passer nullptr »", correct: false}
      - {text: "De passer le message par valeur, pour qu'il ne soit jamais nul", correct: false}
      - {text: "De renommer le paramètre en `message_non_nul`", correct: false}
    answer: |-
      La signature doit dire ce que le commentaire dirait : avec une référence, passer « rien » ne compile pas. Par
      valeur, on copierait le message à chaque appel sans raison.
  - key: situation-parametre-facultatif
    format: scenario
    question: |-
      `exporter(rapport, journal)` écrit des détails dans un journal, mais seulement si l'appelant en fournit un. Quel
      type donnes-tu au paramètre `journal` ?
    choices:
      - {text: "Un pointeur, `Journal*`, testé avant chaque écriture", correct: true}
      - {text: "Une référence, `Journal&`, liée à un journal vide par défaut", correct: false}
      - {text: "Une référence constante, `const Journal&`, qu'on ne peut pas tester", correct: false}
      - {text: "Une copie, `Journal`, que la fonction remplit puis jette", correct: false}
    answer: |-
      « Peut manquer » est exactement ce qu'exprime un pointeur : l'appelant passe `nullptr`, et la fonction teste.
      Une référence oblige à fournir un journal ; une copie n'écrirait rien dans celui de l'appelant.
  - key: situation-membre
    format: scenario
    question: |-
      Une classe `Curseur` désigne la ligne active d'un document, et passe d'une ligne à l'autre pendant sa vie. Par
      quoi désigne-t-elle la ligne ?
    choices:
      - {text: "Par un pointeur : la cible doit pouvoir changer", correct: true}
      - {text: "Par une référence, qu'elle réaffecte à chaque déplacement", correct: false}
      - {text: "Par une copie de la ligne, qu'elle met à jour à chaque déplacement", correct: false}
      - {text: "Par une référence constante, pour ne pas modifier le document", correct: false}
    answer: |-
      Une référence membre est liée pour toute la vie de l'objet : la « réaffecter » écraserait la première ligne. Un
      pointeur change de cible, et peut valoir `nullptr` quand il n'y a pas de ligne active.
  - key: situation-observer-ou-posseder
    format: scenario
    question: |-
      Une fonction reçoit un `Moteur*` pour lire sa température. Un collègue propose d'ajouter `delete moteur;` à la
      fin, « pour ne pas oublier de libérer ». Que lui réponds-tu ?
    choices:
      - {text: "Qu'un pointeur brut observe : la fonction ne possède pas le moteur", correct: true}
      - {text: "Qu'il a raison : qui reçoit un pointeur doit le libérer", correct: false}
      - {text: "Qu'il faut `delete &moteur;`, puisque c'est un pointeur", correct: false}
      - {text: "Qu'il faut libérer le moteur au début de la fonction plutôt qu'à la fin", correct: false}
    answer: |-
      Par convention, un pointeur brut (comme une référence) ne transfère pas la propriété : l'appelant garde son
      objet, et s'en resservira. Détruire le moteur ici le laisserait avec un pointeur pendant. Quand une fonction
      doit prendre possession, son paramètre est un `std::unique_ptr`.
