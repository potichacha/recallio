notion: pointeur-void
lesson: |-
  `void*` est un pointeur **sans type** : il contient une adresse, sans dire ce qui s'y trouve. C'est l'outil
  générique du C, que C++ garde pour s'interfacer avec lui.

  ```cpp
  int n = 42;
  void* p = &n;                          // tout pointeur d'objet se convertit en void*, implicitement
  int* q = static_cast<int*>(p);         // le retour exige un cast explicite
  ```

  **Ce qu'on ne peut pas faire avec un `void*`.**

  - Le **déréférencer** : `*p` ne compile pas, le compilateur ne connaît pas le type.
  - Faire de l'**arithmétique** : `p + 1` ne compile pas en C++ standard, faute de connaître la taille de
    l'élément.

  **Le retour est sous ta responsabilité.** `static_cast<T*>(p)` ne vérifie rien. Si `p` ne désigne pas vraiment
  un `T`, lire le résultat est un comportement indéfini. La seule conversion sûre est de revenir **au type
  d'origine**.

  En C, la conversion de `void*` vers `T*` est implicite (`int* t = malloc(...)`). **En C++, elle ne l'est pas** :
  c'est une des incompatibilités entre les deux langages.

  **Où on le rencontre.**

  - L'allocation brute : `malloc`, `operator new` renvoient un `void*`.
  - Les fonctions de rappel du C, qui transmettent un « contexte » opaque : `void (*rappel)(void* contexte)`.
  - Les fonctions qui manipulent des octets : `std::memcpy(void* destination, const void* source, std::size_t n)`.

  **Les casts entre pointeurs.**

  | Cast | Usage | Vérification |
  |---|---|---|
  | `static_cast` | de et vers `void*` ; entre classe de base et classe dérivée | à la compilation, selon les types |
  | `dynamic_cast` | de la base vers la dérivée, pour une classe polymorphe | à l'exécution |
  | `reinterpret_cast` | entre deux types de pointeurs sans rapport | **aucune** |
  | `const_cast` | ajouter ou retirer `const` | aucune |

  **`reinterpret_cast` et l'aliasing strict.** Voir un objet à travers un pointeur d'un **autre type** est un
  comportement indéfini : `*reinterpret_cast<float*>(&entier)`. Trois exceptions : `char`, `unsigned char` et
  `std::byte` peuvent lire les octets de n'importe quel objet. Pour réinterpréter une valeur, on écrit
  `std::bit_cast`, ou `std::memcpy`.

  **Les remplaçants en C++.**

  | Usage de `void*` en C | En C++ |
  |---|---|
  | Une fonction générique | un template |
  | Une donnée de type quelconque | `std::any`, `std::variant` |
  | Un tampon d'octets | `std::span<std::byte>` |
  | Un contexte de fonction de rappel | une lambda qui capture, `std::function` |

  **En entretien** : « `void*` est une adresse sans type : tout pointeur s'y convertit implicitement, le retour
  demande un `static_cast` que rien ne vérifie. Je ne le garde que pour les interfaces C. `reinterpret_cast`
  entre types sans rapport viole l'aliasing strict, sauf vers des octets. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un `void*` ?"
    choices:
      - {text: "Un pointeur qui contient une adresse, sans dire le type de ce qui s'y trouve", correct: true}
      - {text: "Un pointeur qui ne désigne rien du tout, à la façon de `nullptr`", correct: false}
      - {text: "Un pointeur vers une fonction dont le type de retour est `void`", correct: false}
      - {text: "Un pointeur dont l'objet désigné a déjà été libéré par `delete`", correct: false}
    answer: "Il peut désigner un objet de n'importe quel type. Le compilateur ne sait plus lequel : il faut reconvertir pour s'en servir."
  - key: conversions
    format: course
    question: "Quelles conversions impliquant `void*` sont implicites en C++ ?"
    choices:
      - {text: "De `T*` vers `void*` seulement ; le retour exige un cast", correct: true}
      - {text: "De `void*` vers `T*` seulement ; l'aller exige un cast", correct: false}
      - {text: "Les deux sens, comme en C", correct: false}
      - {text: "Aucune : les deux sens exigent un cast", correct: false}
    answer: "Oublier le type est sans danger ; le retrouver est une affirmation du programmeur, qu'il doit écrire : `static_cast<T*>(p)`."
  - key: interdits
    format: course
    question: "Pourquoi ne peut-on pas écrire `*p` quand `p` est un `void*` ?"
    choices:
      - {text: "Le compilateur ne connaît ni le type ni la taille de l'objet désigné", correct: true}
      - {text: "Un `void*` vaut toujours `nullptr`", correct: false}
      - {text: "Un `void*` désigne toujours une fonction", correct: false}
      - {text: "Le déréférencement d'un pointeur exige le mot-clé `const`", correct: false}
    answer: "Sans type, il ne sait pas combien d'octets lire ni comment les interpréter. Pour la même raison, `p + 1` est refusé."
  - key: aliasing
    format: course
    question: "Par quel type de pointeur peut-on toujours lire les octets d'un objet quelconque ?"
    choices:
      - {text: "`unsigned char*`, `char*` ou `std::byte*`", correct: true}
      - {text: "`int*`, quel que soit l'objet", correct: false}
      - {text: "`float*`, quel que soit l'objet", correct: false}
      - {text: "`bool*`, quel que soit l'objet", correct: false}
    answer: "Ce sont les exceptions à la règle d'aliasing strict. Lire un `int` à travers un `float*` est un comportement indéfini."
  - key: vf-retour-implicite
    format: true-false
    question: "En C++, `int* p = malloc(sizeof(int));` compile sans cast."
    truth: false
    answer: "`malloc` renvoie un `void*`, et la conversion vers `int*` n'est pas implicite en C++, contrairement au C."
  - key: vf-verification
    format: true-false
    question: "`static_cast<int*>(p)` vérifie à l'exécution que le `void*` désigne bien un `int`."
    truth: false
    answer: "Aucune vérification. Si le type est faux, le comportement est indéfini."
  - key: vf-arithmetique
    format: true-false
    question: "L'arithmétique `p + 1` est permise sur un `void*` en C++ standard."
    truth: false
    answer: "Le compilateur ne connaît pas la taille de l'élément. GCC l'accepte comme extension, signalée par `-Wpedantic`."
  - key: vf-aller
    format: true-false
    question: "Un `std::string*` se convertit implicitement en `void*`."
    truth: true
    answer: "Tout pointeur d'objet se convertit en `void*` sans cast."
  - key: qcm-retour
    format: multiple-choice
    question: "`p` est un `void*` qui désigne un `double`. Comment retrouves-tu un `double*` ?"
    choices:
      - {text: "`static_cast<double*>(p)`", correct: true}
      - {text: "`dynamic_cast<double*>(p)`", correct: false}
      - {text: "`const_cast<double*>(p)`", correct: false}
      - {text: "`double* q = p;`", correct: false}
    answer: "`static_cast` suffit pour revenir de `void*`. `dynamic_cast` exige une classe polymorphe, et la conversion implicite est refusée."
  - key: qcm-reinterpret
    format: multiple-choice
    question: "Quel cast convertit entre deux types de pointeurs sans rapport, sans aucune vérification ?"
    choices:
      - {text: "`reinterpret_cast`", correct: true}
      - {text: "`static_cast`", correct: false}
      - {text: "`dynamic_cast`", correct: false}
      - {text: "`const_cast`", correct: false}
    answer: "C'est le cast le plus dangereux : il dit seulement « traite cette adresse comme celle d'un autre type »."
  - key: qcm-remplacant
    format: multiple-choice
    question: "Par quoi remplace-t-on, en C++, une fonction C générique qui prend des `void*` ?"
    choices:
      - {text: "Par un template de fonction", correct: true}
      - {text: "Par une macro du préprocesseur", correct: false}
      - {text: "Par une variable globale", correct: false}
      - {text: "Par un `reinterpret_cast`", correct: false}
    answer: "Un template garde le type : le compilateur vérifie tout, et aucun cast n'est nécessaire."
  - key: qcm-memcpy
    format: multiple-choice
    question: "Comment copies-tu les bits d'un `float` dans un `std::uint32_t`, sans violer l'aliasing strict ?"
    choices:
      - {text: "Avec `std::memcpy`, ou `std::bit_cast`", correct: true}
      - {text: "Avec `*reinterpret_cast<std::uint32_t*>(&valeur)`", correct: false}
      - {text: "Avec `*static_cast<std::uint32_t*>(&valeur)`", correct: false}
      - {text: "Avec `(std::uint32_t)valeur`", correct: false}
    answer: "`std::memcpy` copie des octets, ce qui est toujours permis. Lire un `float` par un pointeur d'entier est indéfini ; le cast de valeur convertit le nombre."
  - key: code-aller-retour
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 42;
          void* p = &n;
          int* q = static_cast<int*>(p);
          *q = 7;
          std::println("{} {}", n, q == &n);
      }
      ```
    choices:
      - {text: "`7 true`", correct: true}
      - {text: "`42 true`", correct: false}
      - {text: "`7 false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7 true` : l'aller-retour par `void*` rend la même adresse. Écrire par `q` modifie `n`."
    check:
      output: "7 true"
  - key: code-contexte
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void incrementer(void* contexte) {
          int* compteur = static_cast<int*>(contexte);
          ++*compteur;
      }

      void repeter(void (*rappel)(void*), void* contexte, int fois) {
          for (int i = 0; i < fois; ++i) {
              rappel(contexte);
          }
      }

      int main() {
          int compteur = 10;
          repeter(incrementer, &compteur, 3);
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "`13`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`11`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`13` : c'est le schéma des fonctions de rappel du C. Le contexte voyage en `void*`, et la fonction lui rend son type."
    check:
      output: "13"
  - key: code-octets
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          const std::uint32_t valeur = 0x01020304;
          const auto* octets = reinterpret_cast<const unsigned char*>(&valeur);
          std::println("{} {}", octets[0], octets[3]);
      }
      ```
    choices:
      - {text: "`4 1`", correct: true}
      - {text: "`1 4`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`4 1` : lire les octets par `unsigned char*` est permis. Sur une machine petit-boutiste, comme x86-64, l'octet de poids faible vient en premier."
    check:
      output: "4 1"
  - key: code-memcpy
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <cstring>
      #include <print>

      int main() {
          const float un = 1.0f;
          std::uint32_t bits = 0;
          std::memcpy(&bits, &un, sizeof(bits));
          std::println("{:#x} {}", bits, sizeof(void*) == sizeof(int*));
      }
      ```
    choices:
      - {text: "`0x3f800000 true`", correct: true}
      - {text: "`0x1 true`", correct: false}
      - {text: "`0x3f800000 false`", correct: false}
      - {text: "`0x0 true`", correct: false}
    answer: "`0x3f800000 true` : `std::memcpy`, qui prend des `void*`, copie les octets du `float`. Un `void*` a la taille des autres pointeurs d'objet."
    check:
      output: "0x3f800000 true"
  - key: bug-retour-implicite
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'void*' to 'int*' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int n = 5;
          void* p = &n;
          int* q = p;
          std::println("{}", *q);
      }
      ```
    choices:
      - {text: "Écrire `int* q = static_cast<int*>(p);`", correct: true}
      - {text: "Écrire `int* q = *p;`", correct: false}
      - {text: "Écrire `int* q = &p;`", correct: false}
      - {text: "Écrire `int* q = dynamic_cast<int*>(p);`", correct: false}
    answer: |-
      ```cpp
      int* q = static_cast<int*>(p);
      ```
      Revenir de `void*` à un type précis est une affirmation que le compilateur ne peut pas vérifier : C++ exige
      de l'écrire.
  - key: bug-dereferencement
    format: bug-fix
    question: |-
      Le compilateur répond « 'void*' is not a pointer-to-object type ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(void* donnee) {
          std::println("{}", *donnee);
      }

      int main() {
          int n = 9;
          afficher(&n);
      }
      ```
    choices:
      - {text: "Recevoir `const int* donnee`, et garder `*donnee`", correct: true}
      - {text: "Afficher `donnee` sans l'étoile", correct: false}
      - {text: "Afficher `&donnee` à la place de `*donnee`", correct: false}
      - {text: "Recevoir `void** donnee`, et garder `*donnee`", correct: false}
    answer: |-
      ```cpp
      void afficher(const int* donnee) {
          std::println("{}", *donnee);
      }
      ```
      Un `void*` ne se déréférence pas. La fonction sait qu'elle affiche un entier : son paramètre doit le dire. Un
      template conviendrait pour plusieurs types.
  - key: bug-mauvais-type
    format: bug-fix
    question: |-
      Cette fonction reçoit l'adresse d'un `int`, et la relit comme un `double`. Le comportement est indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void afficher(void* donnee) {
          const double* valeur = static_cast<double*>(donnee);
          std::println("{}", *valeur);
      }

      int main() {
          int n = 3;
          afficher(&n);
      }
      ```
    choices:
      - {text: "Relire avec `static_cast<int*>(donnee)`, le type d'origine", correct: true}
      - {text: "Relire avec `reinterpret_cast<double*>(donnee)`", correct: false}
      - {text: "Relire avec `static_cast<float*>(donnee)`", correct: false}
      - {text: "Relire avec `static_cast<long*>(donnee)`", correct: false}
    answer: |-
      ```cpp
      const int* valeur = static_cast<int*>(donnee);
      ```
      Un `void*` ne se reconvertit sans danger que vers le type de l'objet qu'il désigne. Tout autre type lit des
      octets qui ne lui appartiennent pas.
  - key: bug-aliasing
    format: bug-fix
    question: |-
      Ce programme lit un `float` à travers un pointeur d'entier : il viole la règle d'aliasing strict. Quelle
      correction est la bonne ?
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          float un = 1.0f;
          const std::uint32_t bits = *reinterpret_cast<std::uint32_t*>(&un);
          std::println("{:#x}", bits);
      }
      ```
    choices:
      - {text: "Écrire `std::bit_cast<std::uint32_t>(un)`", correct: true}
      - {text: "Écrire `*static_cast<std::uint32_t*>(&un)`", correct: false}
      - {text: "Écrire `static_cast<std::uint32_t>(un)`", correct: false}
      - {text: "Écrire `*(std::uint32_t*)&un`", correct: false}
    answer: |-
      ```cpp
      const std::uint32_t bits = std::bit_cast<std::uint32_t>(un);
      ```
      Accéder à un objet par un pointeur d'un autre type est indéfini, quel que soit le cast. `std::bit_cast`
      (C++20) recopie les octets ; `static_cast` sur la valeur donnerait 1.
