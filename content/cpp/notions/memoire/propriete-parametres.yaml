notion: propriete-parametres
lesson: |-
  La façon de passer un objet tenu par un pointeur intelligent dit **ce que la fonction fait de la possession**.
  La question à se poser n'est pas « comment l'appelant tient-il l'objet ? », mais « la fonction a-t-elle besoin
  d'en être propriétaire ? ».

  | La fonction... | Paramètre | À l'appel |
  |---|---|---|
  | **utilise** l'objet, obligatoire | `const T&` ou `T&` | `f(*p)` |
  | **utilise** l'objet, facultatif | `const T*` ou `T*` | `f(p.get())` |
  | **prend** la possession | `std::unique_ptr<T>` par valeur | `f(std::move(p))` |
  | **partage** la possession (la garde) | `std::shared_ptr<T>` par valeur | `f(p)` |
  | **remplace** le pointeur de l'appelant | `std::unique_ptr<T>&` | `f(p)` |

  **Utiliser : la référence, ou le pointeur brut.** C'est le cas de loin le plus courant. Une fonction qui affiche
  un document n'a pas à savoir s'il est tenu par un `std::unique_ptr`, un `std::shared_ptr`, ou s'il vit sur la
  pile.

  ```cpp
  void afficher(const Document& doc);

  afficher(*unique);
  afficher(*partage);
  afficher(local);
  ```

  Un pointeur brut ou une référence en paramètre veut dire « je regarde, je ne possède pas ». C'est leur bon usage
  en C++ moderne.

  **Prendre : `std::unique_ptr<T>` par valeur.** L'appelant est obligé d'écrire `std::move` : le transfert se voit,
  et son pointeur est nul ensuite.

  ```cpp
  void archiver(std::unique_ptr<Document> doc);

  archiver(std::move(unique));
  ```

  **Partager : `std::shared_ptr<T>` par valeur.** Seulement si la fonction **garde** une part de possession : elle
  range le pointeur dans un membre, ou le donne à un thread. Chaque copie incrémente puis décrémente un compteur
  **atomique** : ce n'est pas gratuit.

  **Ce qu'on évite.**

  - `const std::unique_ptr<T>&` : ne transfère rien, et impose à l'appelant de tenir l'objet par un
    `std::unique_ptr`. On écrit `const T&`.
  - `std::shared_ptr<T>` par valeur dans une fonction qui ne fait que lire : un compteur atomique pour rien.
  - `const std::shared_ptr<T>&` : acceptable seulement si la fonction décide **parfois** de garder une copie.
  - Construire un second pointeur intelligent à partir de `p.get()` : double libération.

  **En retour.** Une fabrique renvoie un `std::unique_ptr<T>` par valeur : l'appelant devient propriétaire, et peut
  le convertir en `std::shared_ptr` s'il veut partager.

  **En entretien** : « Je passe l'objet par référence quand la fonction ne fait que s'en servir, un
  `std::unique_ptr` par valeur quand elle en prend possession, un `std::shared_ptr` par valeur quand elle en garde
  une part. Le type du paramètre documente la possession. »
cards:
  - key: utiliser
    format: course
    question: "Une fonction se contente d'afficher un `Document` tenu par un `std::unique_ptr`. Que reçoit-elle ?"
    choices:
      - {text: "Un `const Document&` : elle n'a pas à connaître le mode de possession", correct: true}
      - {text: "Un `std::unique_ptr<Document>` par valeur : elle en devient propriétaire", correct: false}
      - {text: "Un `const std::unique_ptr<Document>&` : elle voit le pointeur de l'appelant", correct: false}
      - {text: "Un `std::shared_ptr<Document>` par valeur : elle partage la possession", correct: false}
    answer: "L'appelant écrit `afficher(*p)`. La même fonction sert pour un document partagé, ou local à une fonction."
  - key: prendre
    format: course
    question: "Que signifie un paramètre `std::unique_ptr<Document> doc`, passé par valeur ?"
    choices:
      - {text: "La fonction prend possession du document : l'appelant doit écrire `std::move`", correct: true}
      - {text: "La fonction reçoit une copie du document, que l'appelant garde aussi", correct: false}
      - {text: "La fonction observe le document, sans jamais le détruire", correct: false}
      - {text: "La fonction partage le document avec l'appelant, par un compteur", correct: false}
    answer: "Un `std::unique_ptr` ne se copie pas. Après l'appel, le pointeur de l'appelant est nul, et le document sera détruit par la fonction ou par celui à qui elle le confie."
  - key: partager
    format: course
    question: "Quand une fonction prend-elle un `std::shared_ptr<T>` par valeur ?"
    choices:
      - {text: "Quand elle garde une part de possession : elle range le pointeur, ou le donne à un thread", correct: true}
      - {text: "Quand elle lit l'objet une fois, puis rend la main à son appelant", correct: false}
      - {text: "Quand elle veut éviter de copier un objet de grande taille", correct: false}
      - {text: "Quand elle veut empêcher l'appelant de modifier l'objet", correct: false}
    answer: "Copier un `std::shared_ptr` met à jour un compteur atomique. On ne paie ce coût que si la fonction doit prolonger la vie de l'objet."
  - key: brut
    format: course
    question: "Que veut dire, en C++ moderne, un paramètre de type pointeur brut `const Config*` ?"
    choices:
      - {text: "La fonction observe un objet, peut-être absent, sans le posséder", correct: true}
      - {text: "La fonction devra libérer l'objet avec `delete`", correct: false}
      - {text: "La fonction reçoit un tableau alloué avec `new[]`", correct: false}
      - {text: "La fonction partage la possession de l'objet", correct: false}
    answer: "La possession se dit avec les pointeurs intelligents. Un pointeur brut reste le bon outil pour désigner sans posséder, quand « rien » est possible ; sinon, une référence."
  - key: vf-const-ref-unique
    format: true-false
    question: "`const std::unique_ptr<T>&` est le paramètre recommandé pour une fonction qui lit l'objet."
    truth: false
    answer: "Il oblige l'appelant à tenir l'objet par un `std::unique_ptr`, sans rien transférer. On écrit `const T&`."
  - key: vf-move
    format: true-false
    question: "Passer un `std::unique_ptr` à un paramètre par valeur exige `std::move` chez l'appelant."
    truth: true
    answer: "Il ne se copie pas. Le `std::move` rend le transfert visible."
  - key: vf-shared-gratuit
    format: true-false
    question: "Passer un `std::shared_ptr` par valeur ne coûte rien de plus que passer un pointeur brut."
    truth: false
    answer: "La copie incrémente un compteur atomique, et sa destruction le décrémente."
  - key: vf-get
    format: true-false
    question: "On peut construire un second `std::unique_ptr` à partir de `p.get()` pour partager l'objet."
    truth: false
    answer: "Les deux pointeurs se croiraient propriétaires : l'objet serait libéré deux fois. `get()` ne sert qu'à observer."
  - key: qcm-appel-reference
    format: multiple-choice
    question: "`void afficher(const Document& doc);` et `auto p = std::make_unique<Document>();`. Comment appelles-tu la fonction ?"
    choices:
      - {text: "`afficher(*p);`", correct: true}
      - {text: "`afficher(p);`", correct: false}
      - {text: "`afficher(std::move(p));`", correct: false}
      - {text: "`afficher(&p);`", correct: false}
    answer: "`*p` donne le document lui-même. L'appelant reste propriétaire."
  - key: qcm-appel-facultatif
    format: multiple-choice
    question: "`void journaliser(const Config* config);` accepte `nullptr`. Comment lui passes-tu l'objet tenu par le `std::unique_ptr` nommé `p` ?"
    choices:
      - {text: "`journaliser(p.get());`", correct: true}
      - {text: "`journaliser(p.release());`", correct: false}
      - {text: "`journaliser(std::move(p));`", correct: false}
      - {text: "`journaliser(*p);`", correct: false}
    answer: "`get()` rend le pointeur brut, sans abandonner la possession. `release()` l'abandonnerait : l'objet fuirait."
  - key: qcm-fabrique
    format: multiple-choice
    question: "Que renvoie de préférence une fabrique qui crée un objet sur le tas ?"
    choices:
      - {text: "Un `std::unique_ptr<T>` par valeur", correct: true}
      - {text: "Un pointeur brut `T*`, à libérer par l'appelant", correct: false}
      - {text: "Une référence `T&` vers l'objet alloué", correct: false}
      - {text: "Un `std::weak_ptr<T>`", correct: false}
    answer: "Le type dit que l'appelant devient propriétaire. Il peut le convertir en `std::shared_ptr` s'il veut partager."
  - key: qcm-remplacer
    format: multiple-choice
    question: "Une fonction doit faire désigner un nouvel objet au `std::unique_ptr` de l'appelant. Quel paramètre prend-elle ?"
    choices:
      - {text: "`std::unique_ptr<T>&`", correct: true}
      - {text: "`std::unique_ptr<T>`", correct: false}
      - {text: "`const std::unique_ptr<T>&`", correct: false}
      - {text: "`T&`", correct: false}
    answer: "La référence non constante vers le pointeur permet de le réaffecter. C'est un cas rare."
  - key: bug-copie-unique
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function » sur l'appel de `afficher`. La fonction ne fait que lire.
      Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      void afficher(std::unique_ptr<int> valeur) {
          std::println("{}", *valeur);
      }

      int main() {
          const auto p = std::make_unique<int>(42);
          afficher(p);
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Recevoir `const int& valeur`, et appeler `afficher(*p);`", correct: true}
      - {text: "Appeler `afficher(std::move(p));`, sans rien changer d'autre", correct: false}
      - {text: "Recevoir `std::unique_ptr<int>* valeur`, et appeler `afficher(p);`", correct: false}
      - {text: "Appeler `afficher(p.release());`, sans rien changer d'autre", correct: false}
    answer: |-
      ```cpp
      void afficher(const int& valeur) {
          std::println("{}", valeur);
      }
      // ...
      afficher(*p);
      ```
      La fonction n'a pas besoin de posséder l'entier. Lui transférer le pointeur le rendrait nul dans `main`, qui
      s'en sert encore.
  - key: bug-double-proprietaire
    format: bug-fix
    question: |-
      Ce programme libère deux fois le même entier : il s'arrête sur « free(): double free detected ». Quelle
      correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      void traiter(int* brut) {
          const std::unique_ptr<int> local{brut};
          std::println("{}", *local);
      }

      int main() {
          const auto p = std::make_unique<int>(42);
          traiter(p.get());
      }
      ```
    choices:
      - {text: "Se servir de `*brut` directement, sans construire de `std::unique_ptr` dans la fonction", correct: true}
      - {text: "Construire un `std::shared_ptr<int> local{brut};` dans la fonction", correct: false}
      - {text: "Appeler `delete brut;` à la fin de la fonction", correct: false}
      - {text: "Déclarer le paramètre `const int* brut`, en gardant le `std::unique_ptr` local", correct: false}
    answer: |-
      ```cpp
      void traiter(const int* brut) {
          std::println("{}", *brut);
      }
      ```
      `get()` prête le pointeur sans céder la possession. En l'enfermant dans un second pointeur intelligent, la
      fonction libère un objet que `main` libérera aussi.
  - key: bug-utilise-apres-move
    format: bug-fix
    question: |-
      Ce programme plante sur une erreur de segmentation à la dernière ligne. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      void archiver(std::unique_ptr<int> valeur) {
          std::println("archivé : {}", *valeur);
      }

      int main() {
          auto p = std::make_unique<int>(42);
          archiver(std::move(p));
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Lire `*p` avant l'appel de `archiver`", correct: true}
      - {text: "Appeler `archiver(p);` sans `std::move`", correct: false}
      - {text: "Écrire `*p.get()` à la place de `*p`", correct: false}
      - {text: "Déclarer `p` avec `const auto`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *p);
      archiver(std::move(p));
      ```
      Après le transfert, `p` est nul : la fonction a pris l'entier, et l'a détruit en se terminant. On ne se sert
      plus d'un pointeur qu'on a cédé.
  - key: bug-shared-inutile
    format: bug-fix
    question: |-
      Cette fonction, appelée dans une boucle serrée, ne fait que lire. Le profileur montre du temps passé sur le
      compteur de références. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      int doubler(std::shared_ptr<int> valeur) {
          return *valeur * 2;
      }

      int main() {
          const auto p = std::make_shared<int>(21);
          int total = 0;
          for (int i = 0; i < 1000; ++i) {
              total += doubler(p);
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Recevoir `const int& valeur`, et appeler `doubler(*p)`", correct: true}
      - {text: "Recevoir `std::unique_ptr<int> valeur`, et appeler `doubler(p)`", correct: false}
      - {text: "Recevoir `std::weak_ptr<int> valeur`, et appeler `doubler(p)`", correct: false}
      - {text: "Recevoir `std::shared_ptr<int>&& valeur`, et appeler `doubler(p)`", correct: false}
    answer: |-
      ```cpp
      int doubler(const int& valeur) {
          return valeur * 2;
      }
      ```
      Chaque appel copiait le `std::shared_ptr` : un incrément et un décrément atomiques. La fonction ne partage
      aucune possession : elle reçoit l'objet.
  - key: situation-signature
    format: scenario
    question: |-
      En revue de code, tu lis `void valider(const std::shared_ptr<Commande>& commande)`, dont le corps lit trois
      champs de la commande. Les tests doivent créer un `std::shared_ptr` pour l'appeler. Que proposes-tu ?
    choices:
      - {text: "Recevoir `const Commande&` : la fonction n'a rien à faire du mode de possession", correct: true}
      - {text: "Recevoir `std::shared_ptr<Commande>` par valeur, pour plus de sûreté", correct: false}
      - {text: "Recevoir `std::unique_ptr<Commande>` par valeur, plus léger", correct: false}
      - {text: "Garder la signature : une référence constante ne coûte rien", correct: false}
    answer: |-
      La signature impose à tous les appelants un `std::shared_ptr`, alors que la fonction ne s'en sert pas. Avec
      `const Commande&`, un test passe une commande locale, et le code de production passe `*commande`.
  - key: situation-file
    format: scenario
    question: |-
      Une file d'attente `File::ajouter(...)` range chaque tâche jusqu'à son exécution ; l'appelant n'en a plus
      besoin ensuite. Quel paramètre donnes-tu à `ajouter` ?
    choices:
      - {text: "`std::unique_ptr<Tache> tache`, par valeur", correct: true}
      - {text: "`const Tache& tache`, dont la file garde l'adresse", correct: false}
      - {text: "`Tache* tache`, avec un commentaire sur la possession", correct: false}
      - {text: "`const std::unique_ptr<Tache>& tache`", correct: false}
    answer: |-
      La file devient propriétaire : la signature le dit, et oblige l'appelant à écrire `std::move`. Garder
      l'adresse d'une référence laisserait un pointeur pendant dès que l'appelant détruit sa tâche.
  - key: situation-thread
    format: scenario
    question: |-
      Une fonction lance un thread détaché qui travaille sur un objet `Donnees` tenu par `std::shared_ptr` chez
      l'appelant, lequel peut le lâcher avant la fin du thread. Comment la lambda du thread reçoit-elle l'objet ?
    choices:
      - {text: "Par une copie du `std::shared_ptr` : le thread partage la possession", correct: true}
      - {text: "Par une référence vers l'objet : `[&donnees]`", correct: false}
      - {text: "Par le pointeur brut rendu par `get()`", correct: false}
      - {text: "Par une référence vers le `std::shared_ptr` de l'appelant", correct: false}
    answer: |-
      Le thread doit garder l'objet en vie aussi longtemps qu'il s'en sert : c'est un vrai partage de possession.
      Une référence ou un pointeur brut seraient pendants dès que l'appelant lâche son pointeur.
  - key: situation-api
    format: scenario
    question: |-
      Une ancienne fonction `Forme* creer_forme()` renvoie un objet alloué avec `new`. Certains appelants oublient
      le `delete`. Comment modernises-tu la signature ?
    choices:
      - {text: "`std::unique_ptr<Forme> creer_forme()` : l'appelant devient propriétaire, et la libération est automatique", correct: true}
      - {text: "`Forme& creer_forme()` : l'appelant reçoit une référence vers l'objet alloué, sans avoir à le libérer", correct: false}
      - {text: "`std::weak_ptr<Forme> creer_forme()` : l'appelant observe la forme, sans la posséder", correct: false}
      - {text: "`void creer_forme(Forme** sortie)` : l'appelant fournit l'adresse de son propre pointeur", correct: false}
    answer: |-
      Un pointeur brut en retour ne dit pas qui libère. `std::unique_ptr` le dit dans le type, et l'oubli devient
      impossible. L'appelant qui veut partager écrit `std::shared_ptr<Forme> f = creer_forme();`.
