notion: references-const
lesson: |-
  Une **référence constante**, `const T&`, est un alias **en lecture seule** : on lit l'objet à travers elle, on ne
  le modifie pas.

  ```cpp
  int x = 1;
  const int& r = x;
  r = 3;      // erreur : r est en lecture seule
  x = 5;      // permis : r vaut maintenant 5
  ```

  Comme pour un pointeur vers const, la promesse porte sur **ce chemin d'accès** : l'objet lui-même peut changer par
  son nom.

  **Elle se lie à tout.** Une référence non constante exige une variable modifiable. Une référence constante accepte
  aussi une **constante**, un **littéral** et le **résultat d'un calcul** :

  ```cpp
  const int& a = 5;
  const std::string& s = prenom + " Lovelace";
  ```

  **Le temporaire dont elle prolonge la vie.** Dans ces deux lignes, la référence désigne un objet **temporaire**.
  Normalement, il serait détruit à la fin de la ligne. Lié directement à une référence constante locale, il **vit
  aussi longtemps qu'elle**. C'est ce qui rend les lignes ci-dessus sûres.

  Cette prolongation ne vaut que pour une liaison **directe**. Elle ne traverse pas un appel de fonction : si une
  fonction reçoit un temporaire par `const T&` et **renvoie cette référence**, le temporaire est détruit à la fin de
  l'instruction, et la référence renvoyée pend.

  **Le piège de la conversion.** Si le type ne correspond pas exactement, la référence constante se lie à un
  **temporaire converti**, pas à la variable :

  ```cpp
  int x = 1;
  const double& d = x;   // d désigne un double temporaire qui vaut 1.0
  x = 5;                 // d vaut toujours 1.0
  ```

  **Son usage principal : les paramètres.** `const std::string& s` reçoit n'importe quelle chaîne sans la copier, et
  garantit à l'appelant qu'elle ne sera pas modifiée.

  **En entretien** : « `const T&` pour lire sans copier. Elle prolonge la vie d'un temporaire auquel elle est liée
  directement, mais pas à travers le retour d'une fonction. »
cards:
  - key: lecture-seule
    format: course
    question: "Que permet une référence constante, comme `const int& r = x;` ?"
    choices:
      - {text: "De lire `x` à travers `r`, sans pouvoir la modifier par ce chemin", correct: true}
      - {text: "De modifier `x` à travers `r`, sans pouvoir la lire", correct: false}
      - {text: "De figer `x`, que plus personne ne peut modifier", correct: false}
      - {text: "De copier `x` dans une constante indépendante", correct: false}
    answer: "`r` est un alias en lecture seule. `x` n'est pas figée pour autant : on peut la modifier par son nom, et `r` verra la nouvelle valeur."
  - key: liaison-a-un-temporaire
    format: course
    question: "Pourquoi `const int& r = 5;` compile-t-il, alors que `int& r = 5;` ne compile pas ?"
    choices:
      - {text: "Une référence constante peut se lier à une valeur temporaire", correct: true}
      - {text: "Le littéral 5 est une constante, donc une variable `const`", correct: false}
      - {text: "Une référence constante copie la valeur, au lieu de la désigner", correct: false}
      - {text: "Le compilateur transforme la référence en `int` ordinaire", correct: false}
    answer: "Le compilateur crée un temporaire qui vaut 5, et la référence s'y lie. Une référence non constante le refuse : modifier un temporaire n'aurait pas de sens."
  - key: prolongation
    format: course
    question: "Que devient un temporaire lié directement à une référence constante locale ?"
    choices:
      - {text: "Il vit aussi longtemps que la référence", correct: true}
      - {text: "Il est détruit à la fin de la ligne, comme tout temporaire", correct: false}
      - {text: "Il vit jusqu'à la fin du programme", correct: false}
      - {text: "Il est copié dans la référence, puis détruit", correct: false}
    answer: "C'est la prolongation de la durée de vie : `const std::string& s = a + b;` est sûr. Elle ne vaut que pour une liaison directe, pas à travers le retour d'une fonction."
  - key: usage-en-parametre
    format: course
    question: "Pourquoi un paramètre `const std::string& texte` est-il plus souple qu'un `std::string& texte` ?"
    choices:
      - {text: "Il accepte aussi les constantes, les littéraux et les résultats de calcul", correct: true}
      - {text: "Il permet à la fonction de modifier la chaîne de l'appelant", correct: false}
      - {text: "Il copie la chaîne, ce qui protège l'appelant", correct: false}
      - {text: "Il accepte `nullptr` quand il n'y a pas de chaîne", correct: false}
    answer: "Une référence non constante n'accepte qu'une variable modifiable. La version constante se lie à tout, sans copie, et promet de ne rien modifier."
  - key: vf-objet-fige
    format: true-false
    question: "Avec `const int& r = x;`, la variable `x` ne peut plus être modifiée."
    truth: false
    answer: "Seul l'accès par `r` est en lecture seule. `x = 5;` reste permis, et `r` vaut alors 5."
  - key: vf-litteral
    format: true-false
    question: "`const int& r = 5;` compile."
    truth: true
    answer: Une référence constante se lie à un temporaire, dont elle prolonge la vie.
  - key: vf-prolongation-par-retour
    format: true-false
    question: La prolongation de vie d'un temporaire s'applique aussi à une référence renvoyée par une fonction.
    truth: false
    answer: Elle ne vaut que pour une liaison directe. Le temporaire passé en argument est détruit à la fin de l'instruction, même si la fonction renvoie une référence vers lui.
  - key: vf-conversion
    format: true-false
    question: "Avec `int x = 1; const double& d = x;`, modifier `x` modifie aussi `d`."
    truth: false
    answer: "Les types diffèrent : `d` désigne un `double` temporaire, créé à partir de `x`. Les deux n'ont plus de lien."
  - key: qcm-ligne-refusee
    format: multiple-choice
    question: "Avec `int x = 1; const int& r = x;`, laquelle de ces lignes ne compile pas ?"
    choices:
      - {text: "`r = 3;`", correct: true}
      - {text: "`x = 3;`", correct: false}
      - {text: "`int y = r;`", correct: false}
      - {text: "`const int& s = r;`", correct: false}
    answer: "`r` est en lecture seule. On peut la lire, la copier, lier une autre référence constante, et modifier `x` par son nom."
  - key: qcm-liaison-refusee
    format: multiple-choice
    question: Laquelle de ces déclarations ne compile pas ?
    choices:
      - {text: "`std::string& s = prenom + \" !\";`", correct: true}
      - {text: "`const std::string& s = prenom + \" !\";`", correct: false}
      - {text: "`std::string s = prenom + \" !\";`", correct: false}
      - {text: "`const std::string s = prenom + \" !\";`", correct: false}
    answer: "Le résultat de `+` est un temporaire : une référence non constante ne peut pas s'y lier. La référence constante le peut, et les deux dernières lignes le copient."
  - key: qcm-type-exact
    format: multiple-choice
    question: "Avec `int compteur = 0;`, quelle référence constante suit les modifications de `compteur` ?"
    choices:
      - {text: "`const int& r = compteur;`", correct: true}
      - {text: "`const long& r = compteur;`", correct: false}
      - {text: "`const double& r = compteur;`", correct: false}
      - {text: "`const bool& r = compteur;`", correct: false}
    answer: "Seul le type exact fait désigner la variable. Avec un autre type, la référence se lie à un temporaire converti, figé à la valeur du moment."
  - key: qcm-const-auto
    format: multiple-choice
    question: "Que déclare `const auto& premier = v.front();` ?"
    choices:
      - {text: "Un alias en lecture seule du premier élément, sans copie", correct: true}
      - {text: "Une copie constante du premier élément", correct: false}
      - {text: "Un pointeur constant vers le premier élément", correct: false}
      - {text: "Un alias modifiable du premier élément", correct: false}
    answer: "`auto` déduit le type de l'élément, `&` en fait une référence, `const` la met en lecture seule. C'est l'écriture par défaut pour lire sans copier."
  - key: code-suit-la-variable
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          const int& r = x;
          x = 5;
          std::println("{}", r);
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`5` : `r` est un alias de `x`, en lecture seule. Elle voit la modification faite par le nom `x`."
    check:
      output: "5"
  - key: code-temporaire-prolonge
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string prenom = "Ada";
          const std::string& complet = prenom + " Lovelace";
          prenom = "Alan";
          std::println("{} {}", complet, complet.size());
      }
      ```
    choices:
      - {text: "`Ada Lovelace 12`", correct: true}
      - {text: "`Alan Lovelace 13`", correct: false}
      - {text: "`Ada 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Ada Lovelace 12` : `complet` désigne la chaîne temporaire créée par `+`, dont la référence prolonge la vie. Cette chaîne est indépendante de `prenom`."
    check:
      output: "Ada Lovelace 12"
  - key: code-ecriture-refusee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          const int& r = x;
          r = 3;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `r` est une référence constante (« assignment of read-only reference »), même si `x` n'est pas une constante."
    check:
      compiles: false
  - key: code-temporaire-converti
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          const double& d = x;
          x = 5;
          std::println("{} {}", x, d);
      }
      ```
    choices:
      - {text: "`5 1`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5 1` : `d` est un `const double&`, et `x` un `int`. La référence se lie à un `double` temporaire qui vaut 1.0 ; modifier `x` ne le touche pas."
    check:
      output: "5 1"
  - key: bug-modifier-par-const-ref
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only reference 'score' ». Le programme doit vraiment ajouter le
      bonus. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int total = 10;
          const int& score = total;
          score += 5;
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Retirer `const` : écrire `int& score`", correct: true}
      - {text: "Retirer `&` : écrire `const int score`", correct: false}
      - {text: "Écrire `score == 5;` sur la ligne suivante", correct: false}
      - {text: "Écrire `const int& score = &total;`", correct: false}
    answer: |-
      ```cpp
      int& score = total;
      ```
      Une référence constante est en lecture seule. Pour modifier `total` à travers elle, il faut une référence non
      constante.
  - key: bug-reference-vers-temporaire
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind non-const lvalue reference ». Le programme ne fait que lire le message.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string prenom = "Ada";
          std::string& message = "Bonjour, " + prenom;
          std::println("{}", message);
      }
      ```
    choices:
      - {text: "Écrire `const std::string& message`", correct: true}
      - {text: "Écrire `std::string* message`", correct: false}
      - {text: "Écrire `std::string&& message = &prenom`", correct: false}
      - {text: "Écrire `std::string& message{}` avant l'affectation", correct: false}
    answer: |-
      ```cpp
      const std::string& message = "Bonjour, " + prenom;
      ```
      `+` produit une chaîne temporaire, à laquelle une référence non constante ne se lie pas. Une référence
      constante s'y lie et prolonge sa vie ; `std::string message = ...` conviendrait tout autant.
  - key: bug-mauvais-type
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1`, le compteur après l'incrémentation, et affiche `0`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int compteur = 0;
          const long& vue = compteur;
          compteur++;
          std::println("{}", vue);
      }
      ```
    choices:
      - {text: "`vue` est liée à un `long` temporaire, pas à `compteur`", correct: true}
      - {text: "`vue` est constante, et bloque l'incrémentation de `compteur`", correct: false}
      - {text: "`compteur++` crée une nouvelle variable, que `vue` ignore", correct: false}
      - {text: "`std::println` affiche la valeur qu'avait `vue` à la compilation", correct: false}
    answer: |-
      ```cpp
      const int& vue = compteur;
      ```
      Un `const long&` ne peut pas désigner un `int` : le compilateur crée un `long` temporaire, copie de la valeur
      du moment. Avec le type exact, la référence désigne la variable.
  - key: bug-retour-de-fonction
    format: bug-fix
    question: |-
      Ce programme devrait afficher le plus long des deux textes, et affiche des caractères imprévisibles. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      const std::string& plus_long(const std::string& a, const std::string& b) {
          if (a.size() > b.size()) {
              return a;
          }
          return b;
      }

      int main() {
          const std::string& resultat = plus_long("un texte assez long pour le montrer", "court");
          std::println("{}", resultat);
      }
      ```
    choices:
      - {text: "Ranger le résultat dans une `std::string`, qui le copie", correct: true}
      - {text: "Ranger le résultat dans un `const std::string*`", correct: false}
      - {text: "Passer les deux textes par `std::string&`, sans `const`", correct: false}
      - {text: "Déclarer `resultat` avec `const auto&` à la place", correct: false}
    answer: |-
      ```cpp
      std::string resultat = plus_long("un texte assez long pour le montrer", "court");
      ```
      Les deux littéraux deviennent des chaînes temporaires, détruites à la fin de l'instruction. La fonction renvoie
      une référence vers l'une d'elles : la prolongation de vie ne traverse pas l'appel. Une copie garde le texte.
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que `lecture` ne permette pas de modifier `x` :
      ```cpp
      int x = 5;
      ___ int& lecture = x;
      ```
    blanks:
      - [const]
    answer: "`const int&` : un alias en lecture seule."
  - key: trous-temporaire
    format: fill-in
    question: |-
      Complète pour que la référence puisse se lier au résultat du calcul :
      ```cpp
      std::string prenom = "Ada";
      ___ std::string& complet = prenom + " Lovelace";
      ```
    blanks:
      - [const]
    answer: "Seule une référence constante se lie à un temporaire, et prolonge sa vie."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour désigner le premier élément sans le copier :
      ```cpp
      std::vector<std::string> mots{"un", "deux"};
      const auto___ premier = mots.front();
      ```
    blanks:
      - ["&"]
    answer: "`const auto&` : sans le `&`, `premier` serait une copie de la chaîne."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète le commentaire avec la valeur de `r` :
      ```cpp
      int x = 1;
      const int& r = x;
      x = 5;   // r vaut ___
      ```
    blanks:
      - ["5"]
    answer: "`r` est un alias de `x` : elle suit sa valeur, même si elle ne permet pas de la modifier."
