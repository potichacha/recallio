notion: pointeurs-membres
lesson: |-
  Un **pointeur sur membre** désigne un membre d'une classe, **sans désigner d'objet**. Il dit « le champ `age` »,
  ou « la fonction `afficher` », en général ; il faut lui fournir un objet pour s'en servir.

  ```cpp
  struct Personne {
      std::string nom;
      int age;
      void saluer() const;
  };

  int Personne::* champ = &Personne::age;                    // pointeur sur membre de donnée
  void (Personne::* action)() const = &Personne::saluer;     // pointeur sur fonction membre
  ```

  **S'en servir : `.*` et `->*`.**

  ```cpp
  Personne ada{"Ada", 36};
  Personne* p = &ada;

  ada.*champ;            // 36 : avec un objet
  p->*champ;             // 36 : avec un pointeur
  (ada.*action)();       // appelle ada.saluer()
  (p->*action)();        // idem
  ```

  Pour une fonction membre, les **parenthèses** autour de `ada.*action` sont obligatoires : l'appel `()` est plus
  prioritaire que `.*`.

  **Ce n'est pas un pointeur ordinaire.** Un pointeur sur membre de donnée contient, en pratique, un **décalage**
  dans l'objet, pas une adresse. Il ne se convertit pas en `void*`, et sa taille peut différer de celle d'un
  pointeur.

  **L'esperluette et la classe sont obligatoires.** On écrit `&Personne::age`. Ni `&age`, ni `Personne::age`
  seul ne conviennent, contrairement aux fonctions libres dont le nom suffit.

  **`std::invoke`.** Il appelle n'importe quel appelable de la même façon, pointeur sur membre compris :

  ```cpp
  std::invoke(champ, ada);       // ada.*champ
  std::invoke(action, ada);      // (ada.*action)()
  ```

  **Où on s'en sert vraiment : les projections.** Les algorithmes de `std::ranges` acceptent un pointeur sur
  membre pour dire **sur quoi** travailler :

  ```cpp
  std::ranges::sort(gens, {}, &Personne::age);                       // trie par âge
  auto it = std::ranges::find(gens, "Ada", &Personne::nom);          // cherche par nom
  auto plus_age = std::ranges::max_element(gens, {}, &Personne::age);
  ```

  C'est plus court qu'une lambda, et c'est l'usage le plus courant aujourd'hui.

  **Avec les fonctions virtuelles.** Un pointeur sur fonction membre virtuelle respecte la liaison dynamique :
  appelé sur un objet dérivé, il exécute la version redéfinie.

  **En entretien** : « Un pointeur sur membre désigne un champ ou une fonction d'une classe sans objet : on
  l'applique avec `.*` ou `->*`, ou avec `std::invoke`. Je m'en sers surtout comme projection dans les algorithmes
  de `std::ranges`, par exemple `&Personne::age`. »
cards:
  - key: definition
    format: course
    question: "Que désigne un pointeur sur membre, comme `&Personne::age` ?"
    choices:
      - {text: "Un membre de la classe, sans objet particulier", correct: true}
      - {text: "Le membre `age` d'un objet précis", correct: false}
      - {text: "L'adresse en mémoire de la classe `Personne`", correct: false}
      - {text: "Un membre statique de la classe `Personne`", correct: false}
    answer: "Il dit « le champ `age` » en général. Il faut le combiner avec un objet pour obtenir une valeur."
  - key: operateurs
    format: course
    question: "Avec quels opérateurs applique-t-on un pointeur sur membre à un objet ?"
    choices:
      - {text: "`.*` avec un objet, `->*` avec un pointeur", correct: true}
      - {text: "`.` avec un objet, `->` avec un pointeur", correct: false}
      - {text: "`::` avec un objet, `::*` avec un pointeur", correct: false}
      - {text: "`*` avec un objet, `**` avec un pointeur", correct: false}
    answer: "`objet.*membre` et `pointeur->*membre`. Ce sont deux opérateurs à part entière."
  - key: projection
    format: course
    question: "À quoi sert `&Personne::age` dans `std::ranges::sort(gens, {}, &Personne::age);` ?"
    choices:
      - {text: "C'est une projection : le tri compare les âges des personnes", correct: true}
      - {text: "C'est la comparaison : elle remplace l'opérateur `<`", correct: false}
      - {text: "C'est la borne de fin : le tri s'arrête à ce champ", correct: false}
      - {text: "C'est la destination : les âges triés y sont écrits", correct: false}
    answer: "L'algorithme applique la projection à chaque élément avant de comparer. C'est l'usage le plus courant des pointeurs sur membre."
  - key: nature
    format: course
    question: "Que contient, en pratique, un pointeur sur membre de donnée ?"
    choices:
      - {text: "Un décalage à l'intérieur de l'objet, et non une adresse", correct: true}
      - {text: "L'adresse du membre dans le premier objet créé", correct: false}
      - {text: "Une copie de la valeur du membre", correct: false}
      - {text: "Le nom du membre, sous forme de chaîne", correct: false}
    answer: "Il n'y a pas d'objet, donc pas d'adresse. Appliqué à un objet, le décalage donne le membre. Il ne se convertit pas en `void*`."
  - key: vf-esperluette
    format: true-false
    question: "Pour une fonction membre, `Personne::saluer` sans `&` suffit à former un pointeur sur membre."
    truth: false
    answer: "L'esperluette est obligatoire : `&Personne::saluer`. Seules les fonctions libres se convertissent sans elle."
  - key: vf-void
    format: true-false
    question: "Un pointeur sur membre se convertit en `void*`."
    truth: false
    answer: "Ce n'est pas une adresse d'objet. Aucune conversion vers `void*` n'existe."
  - key: vf-virtuel
    format: true-false
    question: "Un pointeur sur fonction membre virtuelle appelle la version redéfinie par la classe de l'objet."
    truth: true
    answer: "La liaison dynamique est respectée : le pointeur désigne l'entrée de la table virtuelle."
  - key: vf-invoke
    format: true-false
    question: "`std::invoke(&Personne::age, ada)` donne le membre `age` de `ada`."
    truth: true
    answer: "`std::invoke` traite un pointeur sur membre de donnée comme un appelable qui renvoie le membre."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration range un pointeur sur le membre `int age` de `Personne` ?"
    choices:
      - {text: "`int Personne::* champ = &Personne::age;`", correct: true}
      - {text: "`int* champ = &Personne::age;`", correct: false}
      - {text: "`Personne::int* champ = &age;`", correct: false}
      - {text: "`int Personne* champ = Personne::age;`", correct: false}
    answer: "Le type s'écrit « type du membre », `Classe::*`. `auto champ = &Personne::age;` évite de l'écrire."
  - key: qcm-appel
    format: multiple-choice
    question: "`action` est un pointeur sur une fonction membre sans paramètre. Comment l'appelle-t-on sur l'objet `ada` ?"
    choices:
      - {text: "`(ada.*action)();`", correct: true}
      - {text: "`ada.*action();`", correct: false}
      - {text: "`ada.action();`", correct: false}
      - {text: "`action(ada.*);`", correct: false}
    answer: "Les parenthèses sont nécessaires : l'appel `()` est plus prioritaire que `.*`. `std::invoke(action, ada)` évite la question."
  - key: qcm-recherche
    format: multiple-choice
    question: "Quelle ligne cherche la personne nommée `Ada` dans le vecteur `gens` ?"
    choices:
      - {text: "`std::ranges::find(gens, \"Ada\", &Personne::nom)`", correct: true}
      - {text: "`std::ranges::find(gens, &Personne::nom, \"Ada\")`", correct: false}
      - {text: "`std::ranges::find(gens.nom, \"Ada\")`", correct: false}
      - {text: "`std::ranges::find(gens, Personne::nom == \"Ada\")`", correct: false}
    answer: "La valeur cherchée, puis la projection : chaque élément est comparé par son `nom`."
  - key: qcm-fonction-membre
    format: multiple-choice
    question: "Quel est le type d'un pointeur sur `double Cercle::aire() const` ?"
    choices:
      - {text: "`double (Cercle::*)() const`", correct: true}
      - {text: "`double (*)() const`", correct: false}
      - {text: "`double Cercle::*() const`", correct: false}
      - {text: "`Cercle::double (*)()`", correct: false}
    answer: "Comme un pointeur de fonction, avec `Cercle::` devant l'étoile, et le `const` de la fonction à la fin."
  - key: trous-point-etoile
    format: fill-in
    question: |-
      Complète pour lire le membre désigné par `champ` dans l'objet `ada` :
      ```cpp
      int Personne::* champ = &Personne::age;
      int age = ada___champ;
      ```
    blanks:
      - [".*"]
    answer: "`.*` applique un pointeur sur membre à un objet."
  - key: trous-fleche-etoile
    format: fill-in
    question: |-
      Complète pour lire le membre à travers le pointeur `p` :
      ```cpp
      Personne* p = &ada;
      int age = p___champ;
      ```
    blanks:
      - ["->*"]
    answer: "`->*` applique un pointeur sur membre à un pointeur d'objet."
  - key: trous-invoke
    format: fill-in
    question: |-
      Complète pour appeler la fonction membre désignée par `action` sur `ada` :
      ```cpp
      std::___(action, ada);
      ```
    blanks:
      - [invoke]
    answer: "`std::invoke` appelle tout appelable, pointeur sur membre compris."
  - key: trous-projection
    format: fill-in
    question: |-
      Complète le pointeur sur membre qui fait trier les personnes par leur âge :
      ```cpp
      std::ranges::sort(gens, {}, &Personne::___);
      ```
    blanks:
      - [age]
    answer: "`&Personne::age` sert de projection."
  - key: code-donnee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p{3, 4};
          int Point::* champ = &Point::x;
          const int a = p.*champ;
          champ = &Point::y;
          p.*champ = 9;
          std::println("{} {} {}", a, p.x, p.y);
      }
      ```
    choices:
      - {text: "`3 3 9`", correct: true}
      - {text: "`3 9 4`", correct: false}
      - {text: "`4 3 9`", correct: false}
      - {text: "`3 9 9`", correct: false}
    answer: "`3 3 9` : `champ` désigne d'abord `x`, lu dans `a`. Il désigne ensuite `y`, où l'on écrit 9."
    check:
      output: "3 3 9"
  - key: code-fonction
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;
          void plus_un() { ++valeur; }
          void plus_dix() { valeur += 10; }
      };

      int main() {
          Compteur c;
          void (Compteur::* action)() = &Compteur::plus_un;
          (c.*action)();
          action = &Compteur::plus_dix;
          Compteur* p = &c;
          (p->*action)();
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "`11`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`20`", correct: false}
    answer: "`11` : le pointeur désigne `plus_un`, puis `plus_dix`. Les deux appels portent sur le même objet."
    check:
      output: "11"
  - key: code-projection
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Linus", 55}, {"Ada", 36}, {"Grace", 85}};
          std::ranges::sort(gens, {}, &Personne::age);
          const auto it = std::ranges::find(gens, "Grace", &Personne::nom);
          std::println("{} {}", gens[0].nom, it - gens.begin());
      }
      ```
    choices:
      - {text: "`Ada 2`", correct: true}
      - {text: "`Linus 2`", correct: false}
      - {text: "`Ada 1`", correct: false}
      - {text: "`Grace 0`", correct: false}
    answer: "`Ada 2` : le tri par âge met Ada (36) en tête et Grace (85) à la fin, à l'indice 2, où la recherche par nom la trouve."
    check:
      output: "Ada 2"
  - key: code-virtuel
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
          virtual int cotes() const { return 0; }
      };

      struct Carre : Forme {
          int cotes() const override { return 4; }
      };

      int main() {
          const Carre carre;
          const Forme& forme = carre;
          const auto action = &Forme::cotes;
          std::println("{} {}", (forme.*action)(), std::invoke(action, Forme{}));
      }
      ```
    choices:
      - {text: "`4 0`", correct: true}
      - {text: "`0 0`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`0 4`", correct: false}
    answer: "`4 0` : le pointeur désigne `Forme::cotes`, mais l'appel est virtuel. Sur un `Carre`, c'est la version redéfinie qui s'exécute."
    check:
      output: "4 0"
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `c.*action();`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;
          void plus_un() { ++valeur; }
      };

      int main() {
          Compteur c;
          void (Compteur::* action)() = &Compteur::plus_un;
          c.*action();
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "Écrire `(c.*action)();`", correct: true}
      - {text: "Écrire `c.(*action)();`", correct: false}
      - {text: "Écrire `c->*action();`", correct: false}
      - {text: "Écrire `c.action();`", correct: false}
    answer: |-
      ```cpp
      (c.*action)();
      ```
      L'appel `()` est plus prioritaire que `.*` : sans parenthèses, le compilateur tente d'appeler `action` seul.
  - key: bug-esperluette
    format: bug-fix
    question: |-
      Le compilateur répond « invalid use of non-static member function 'void Compteur::plus_un()' ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;
          void plus_un() { ++valeur; }
      };

      int main() {
          Compteur c;
          void (Compteur::* action)() = Compteur::plus_un;
          (c.*action)();
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "Écrire `&Compteur::plus_un`", correct: true}
      - {text: "Écrire `*Compteur::plus_un`", correct: false}
      - {text: "Écrire `c.plus_un`", correct: false}
      - {text: "Écrire `Compteur::plus_un()`", correct: false}
    answer: |-
      ```cpp
      void (Compteur::* action)() = &Compteur::plus_un;
      ```
      Un pointeur sur membre se forme toujours avec `&` et le nom de la classe. Le nom seul ne se convertit pas,
      au contraire d'une fonction libre.
  - key: bug-pointeur-ordinaire
    format: bug-fix
    question: |-
      Le compilateur répond « cannot convert 'int Point::*' to 'int*' ». Le programme devrait afficher `4`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p{3, 4};
          int* champ = &Point::y;
          std::println("{}", *champ);
      }
      ```
    choices:
      - {text: "Déclarer `int Point::* champ = &Point::y;` et afficher `p.*champ`", correct: true}
      - {text: "Déclarer `int* champ = Point::y;` et afficher `*champ`", correct: false}
      - {text: "Déclarer `Point* champ = &Point::y;` et afficher `champ->y`", correct: false}
      - {text: "Déclarer `void* champ = &Point::y;` et afficher `*champ`", correct: false}
    answer: |-
      ```cpp
      int Point::* champ = &Point::y;
      std::println("{}", p.*champ);
      ```
      `&Point::y` ne désigne aucun objet : ce n'est pas un `int*`. Pour l'adresse du `y` de `p`, on écrirait `&p.y`.
  - key: bug-const
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser `action` : la fonction `aire` est `const`, le type du pointeur ne l'est
      pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Carre {
          int cote = 3;
          int aire() const { return cote * cote; }
      };

      int main() {
          const Carre carre;
          int (Carre::* action)() = &Carre::aire;
          std::println("{}", (carre.*action)());
      }
      ```
    choices:
      - {text: "Déclarer `int (Carre::* action)() const = &Carre::aire;`", correct: true}
      - {text: "Déclarer `const int (Carre::* action)() = &Carre::aire;`", correct: false}
      - {text: "Retirer `const` de la déclaration de `carre`", correct: false}
      - {text: "Déclarer `int (const Carre::* action)() = &Carre::aire;`", correct: false}
    answer: |-
      ```cpp
      int (Carre::* action)() const = &Carre::aire;
      ```
      Le `const` de la fonction membre fait partie de son type. `auto action = &Carre::aire;` l'aurait déduit.
