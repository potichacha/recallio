notion: references-bases
lesson: |-
  Une **référence** est un **autre nom** pour une variable qui existe déjà. Elle se déclare avec `&` après le type.

  ```cpp
  int x = 5;
  int& r = x;    // r et x désignent la même variable
  r = 9;         // x vaut 9
  ```

  Tout ce qu'on fait à `r`, on le fait à `x` : la lire, la modifier, prendre son adresse (`&r == &x`).

  **Trois règles.**

  - Une référence **doit être initialisée** à sa déclaration : `int& r;` ne compile pas.
  - Elle **ne change jamais de cible**. `r = y;` ne fait pas désigner `y` à `r` : elle **copie la valeur** de `y`
    dans la variable désignée.
  - Il n'y a **pas de référence nulle** : une référence désigne toujours un objet.

  **Le `&` a deux sens**, selon l'endroit où il est écrit : dans une **déclaration**, après un type, il crée une
  référence (`int& r`) ; dans une **expression**, devant une variable, il prend une adresse (`&x`).

  **Où on s'en sert.**

  - Pour les **paramètres** : `void doubler(int& n)` modifie l'argument, `const std::string& s` le lit sans le
    copier.
  - Dans une **boucle sur un intervalle** : `for (int& note : notes)` modifie les éléments.
  - Pour nommer un élément : `int& premier = v[0];`.

  **Piège classique** : `auto` ne déduit pas une référence. `auto premier = v[0];` crée une **copie** ; pour un
  alias, il faut `auto& premier = v[0];`.

  Une référence non constante ne se lie qu'à une **variable** : `int& r = 5;` ne compile pas.

  **En entretien** : « Une référence est un alias : initialisée une fois, jamais nulle, jamais réaffectée. C'est ce
  qui la rend plus sûre qu'un pointeur, et c'est pourquoi je la préfère quand l'objet existe toujours. »
tour:
  - title: Les références
    text: |-
      Une référence donne un **second nom** à une variable. `int& r = x;` : à partir de là, `r` et `x` sont la même
      variable.

      Une référence se lie à sa variable une fois pour toutes. Écrire `r = y;` ne la fait pas désigner `y` : cela
      copie la valeur de `y` dans `x`.

      Tu les as déjà croisées dans les paramètres (`int& n`) et dans les boucles (`for (int& note : notes)`).

      Essaie : retire le `&` de `int& r = x;`, puis exécute. `r` devient une copie.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int x = 5;
              int y = 100;

              int& r = x;
              r = 9;
              std::println("{}", x);

              r = y;
              r += 1;
              std::println("{} {}", x, y);
          }
      output: |-
        9
        101 100
    task:
      instructions: |-
        Déclare une référence `premier` vers le premier élément du vecteur, et sers-t'en pour le mettre à zéro : le
        programme doit afficher `0 2 3`.
      starter:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> v{1, 2, 3};

              int premier = v[0];
              premier = 0;

              std::println("{} {} {}", v[0], v[1], v[2]);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> v{1, 2, 3};

              int& premier = v[0];
              premier = 0;

              std::println("{} {} {}", v[0], v[1], v[2]);
          }
      output: "0 2 3"
cards:
  - key: definition-reference
    format: course
    question: "Qu'est-ce qu'une référence, comme `int& r = x;` ?"
    choices:
      - {text: "Un autre nom pour la variable `x`", correct: true}
      - {text: "Une copie de la variable `x`", correct: false}
      - {text: "Une variable qui contient l'adresse de `x`", correct: false}
      - {text: "Une constante qui vaut la valeur de `x`", correct: false}
    answer: "Un alias : `r` et `x` désignent le même emplacement. Une variable qui contient une adresse est un pointeur."
  - key: affectation-a-une-reference
    format: course
    question: "Avec `int& r = x;`, que fait ensuite `r = y;` ?"
    choices:
      - {text: "Elle copie la valeur de `y` dans `x`", correct: true}
      - {text: "Elle fait désigner `y` à la référence `r`", correct: false}
      - {text: "Elle échange les valeurs de `x` et de `y`", correct: false}
      - {text: "Rien : une référence ne peut pas être affectée", correct: false}
    answer: "Une référence ne change jamais de cible. Affecter à `r`, c'est affecter à `x` : `x` reçoit la valeur de `y`, et `r` désigne toujours `x`."
  - key: reference-initialisee
    format: course
    question: "Pourquoi `int& r;` ne compile-t-il pas ?"
    choices:
      - {text: "Une référence doit désigner une variable dès sa déclaration", correct: true}
      - {text: "Une référence doit être déclarée hors de toute fonction", correct: false}
      - {text: "Le `&` doit s'écrire devant le nom, pas après le type", correct: false}
      - {text: "Une référence vers un `int` n'existe pas", correct: false}
    answer: "Comme elle ne peut plus changer de cible, une référence sans cible serait inutilisable. Il n'existe pas non plus de référence nulle."
  - key: deux-sens-de-l-esperluette
    format: course
    question: "Quels sont les deux sens du `&` en C++ ?"
    choices:
      - {text: "Après un type, il déclare une référence ; devant une variable, il prend son adresse", correct: true}
      - {text: "Après un type, il prend une adresse ; devant une variable, il déclare une référence", correct: false}
      - {text: "Dans les deux cas, il déclare une référence", correct: false}
      - {text: "Dans les deux cas, il prend une adresse", correct: false}
    answer: "`int& r = x;` déclare une référence ; `int* p = &x;` prend l'adresse de `x`. C'est la position qui décide : dans une déclaration ou dans une expression."
  - key: vf-reference-nulle
    format: true-false
    question: Une référence peut ne désigner aucun objet, comme un pointeur nul.
    truth: false
    answer: Il n'y a pas de référence nulle. C'est un pointeur qu'il faut quand « rien » est une valeur possible.
  - key: vf-meme-adresse
    format: true-false
    question: "Avec `int& r = x;`, `&r` et `&x` sont la même adresse."
    truth: true
    answer: "`r` est un autre nom pour `x` : prendre son adresse, c'est prendre celle de `x`."
  - key: vf-changer-de-cible
    format: true-false
    question: Une référence peut être réaffectée pour désigner une autre variable.
    truth: false
    answer: Elle est liée à sa variable pour toute sa vie. Une affectation modifie la variable désignée.
  - key: vf-auto-reference
    format: true-false
    question: "`auto premier = v[0];` déclare une référence vers le premier élément de `v`."
    truth: false
    answer: "`auto` déduit le type de la valeur, sans référence : c'est une copie. Il faut `auto& premier = v[0];`."
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle ligne déclare une référence `r` vers la variable `x`, de type `int` ?"
    choices:
      - {text: "`int& r = x;`", correct: true}
      - {text: "`int r = &x;`", correct: false}
      - {text: "`int* r = x;`", correct: false}
      - {text: "`int& r = &x;`", correct: false}
    answer: "`&` après le type, et la variable elle-même à droite. `&x` est une adresse, qui irait dans un pointeur."
  - key: qcm-litteral
    format: multiple-choice
    question: "Pourquoi `int& r = 5;` ne compile-t-il pas ?"
    choices:
      - {text: "Une référence non constante ne se lie qu'à une variable", correct: true}
      - {text: "Une référence ne peut pas désigner un entier", correct: false}
      - {text: "Le littéral 5 est déjà une référence", correct: false}
      - {text: "Il manque `&` devant le 5", correct: false}
    answer: "Un littéral n'est pas une variable qu'on pourrait modifier. Une référence constante, `const int& r = 5;`, est en revanche permise."
  - key: qcm-modifier-les-elements
    format: multiple-choice
    question: Quelle boucle met à zéro tous les éléments du vecteur `notes` ?
    choices:
      - {text: "`for (int& note : notes) { note = 0; }`", correct: true}
      - {text: "`for (int note : notes) { note = 0; }`", correct: false}
      - {text: "`for (int* note : notes) { note = 0; }`", correct: false}
      - {text: "`for (auto note : notes) { note = 0; }`", correct: false}
    answer: "Avec `int&`, `note` est un alias de chaque élément. Sans `&`, y compris avec `auto`, la boucle modifie des copies."
  - key: qcm-apres-affectation
    format: multiple-choice
    question: "Avec `int a = 1; int b = 2; int& r = a; r = b;`, que valent `a` et `b` ?"
    choices:
      - {text: "`a` vaut 2, `b` vaut 2", correct: true}
      - {text: "`a` vaut 1, `b` vaut 2", correct: false}
      - {text: "`a` vaut 2, `b` vaut 1", correct: false}
      - {text: "`a` vaut 1, `b` vaut 1", correct: false}
    answer: "`r = b;` copie la valeur de `b` dans `a`. `b` n'est pas touchée, et `r` désigne toujours `a`."
  - key: trous-declarer
    format: fill-in
    question: |-
      Complète pour que `r` soit un autre nom de `x` :
      ```cpp
      int x = 5;
      int___ r = x;
      ```
    blanks:
      - ["&"]
    answer: "`int& r = x;` : le `&` après le type déclare une référence."
  - key: trous-cible
    format: fill-in
    question: |-
      Complète pour que modifier `r` modifie `score` :
      ```cpp
      int score = 10;
      int& r = ___;
      r += 5;
      ```
    blanks:
      - [score]
    answer: "Une référence s'initialise avec la variable qu'elle désigne : `int& r = score;`."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que `premier` désigne l'élément du vecteur, et non une copie :
      ```cpp
      std::vector<int> v{1, 2, 3};
      auto___ premier = v[0];
      premier = 10;
      ```
    blanks:
      - ["&"]
    answer: "`auto&` : sans le `&`, `auto` déduit `int`, et `premier` serait une copie."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète le commentaire avec la valeur de `x` :
      ```cpp
      int x = 5;
      int& r = x;
      r = r + 2;   // x vaut ___
      ```
    blanks:
      - ["7"]
    answer: "`r` est `x` : lui ajouter 2 porte `x` à 7."
  - key: code-alias
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int& r = x;
          r = 9;
          x += 1;
          std::println("{} {}", x, r);
      }
      ```
    choices:
      - {text: "`10 10`", correct: true}
      - {text: "`10 9`", correct: false}
      - {text: "`6 9`", correct: false}
      - {text: "`9 10`", correct: false}
    answer: "`10 10` : `r` et `x` sont la même variable. Elle passe à 9 par `r`, puis à 10 par `x`."
    check:
      output: "10 10"
  - key: code-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = 2;
          int& r = a;
          r = b;
          b = 7;
          std::println("{} {} {}", a, b, r);
      }
      ```
    choices:
      - {text: "`2 7 2`", correct: true}
      - {text: "`1 7 7`", correct: false}
      - {text: "`2 7 7`", correct: false}
      - {text: "`1 7 2`", correct: false}
    answer: "`2 7 2` : `r = b;` copie 2 dans `a`. `r` désigne toujours `a` : modifier `b` ensuite ne la change pas."
    check:
      output: "2 7 2"
  - key: code-adresse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int& r = x;
          r++;
          std::println("{} {}", x, &r == &x);
      }
      ```
    choices:
      - {text: "`6 true`", correct: true}
      - {text: "`5 true`", correct: false}
      - {text: "`6 false`", correct: false}
      - {text: "`5 false`", correct: false}
    answer: "`6 true` : incrémenter `r` incrémente `x`. Et l'adresse d'une référence est celle de la variable qu'elle désigne."
    check:
      output: "6 true"
  - key: code-element-de-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          int& premier = v[0];
          int copie = v[1];
          premier = 10;
          copie = 20;
          std::println("{} {}", v[0], v[1]);
      }
      ```
    choices:
      - {text: "`10 2`", correct: true}
      - {text: "`10 20`", correct: false}
      - {text: "`1 20`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: "`10 2` : `premier` est un alias de `v[0]`, que l'affectation modifie. `copie` est une variable à part : la modifier ne touche pas `v[1]`."
    check:
      output: "10 2"
  - key: bug-reference-sans-cible
    format: bug-fix
    question: |-
      Le compilateur répond « 'r' declared as reference but not initialized ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int& r;
          r = x;
          std::println("{}", r);
      }
      ```
    choices:
      - {text: "Écrire `int& r = x;` en une ligne", correct: true}
      - {text: "Écrire `int& r = nullptr;` d'abord", correct: false}
      - {text: "Écrire `&r = x;` sur la ligne suivante", correct: false}
      - {text: "Écrire `int& r{};` avec des accolades", correct: false}
    answer: |-
      ```cpp
      int& r = x;
      ```
      Une référence reçoit sa cible à la déclaration, et n'en change plus. Il n'existe pas de référence nulle ou
      vide.
  - key: bug-reaffecter
    format: bug-fix
    question: |-
      L'auteur voulait faire passer `courant` du premier score au second, puis mettre le second à zéro. Le programme
      affiche `0 20`, alors qu'il attendait `10 0`. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int premier = 10;
          int second = 20;
          int& courant = premier;
          courant = second;
          courant = 0;
          std::println("{} {}", premier, second);
      }
      ```
    choices:
      - {text: "Une référence ne change pas de cible : `courant` désigne toujours `premier`", correct: true}
      - {text: "`courant = second;` échange les valeurs des deux variables", correct: false}
      - {text: "`courant = 0;` met à zéro toutes les variables déjà désignées", correct: false}
      - {text: "Une référence est remise à sa valeur de départ après chaque affectation", correct: false}
    answer: |-
      ```cpp
      int* courant = &premier;
      courant = &second;
      *courant = 0;
      ```
      `courant = second;` copie 20 dans `premier`, puis `courant = 0;` y range 0. Pour désigner tour à tour deux
      variables, il faut un pointeur.
  - key: bug-reference-vers-litteral
    format: bug-fix
    question: |-
      Ce code ne compile pas. Le programme ne fait que lire la valeur. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int& limite = 100;
          std::println("{}", limite);
      }
      ```
    choices:
      - {text: "Écrire `const int& limite = 100;`", correct: true}
      - {text: "Écrire `int& limite = &100;`", correct: false}
      - {text: "Écrire `int& limite{100};`", correct: false}
      - {text: "Écrire `int&& limite = &100;`", correct: false}
    answer: |-
      ```cpp
      const int& limite = 100;
      ```
      Une référence non constante exige une variable. Une référence constante accepte un littéral ; ici, une simple
      constante, `const int limite = 100;`, serait encore plus claire.
  - key: bug-auto-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `99`, et affiche `1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto premier = v[0];
          premier = 99;
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Écrire `auto& premier = v[0];`", correct: true}
      - {text: "Écrire `auto premier = &v[0];`", correct: false}
      - {text: "Écrire `const auto premier = v[0];`", correct: false}
      - {text: "Écrire `auto premier = v.at(0);`", correct: false}
    answer: |-
      ```cpp
      auto& premier = v[0];
      ```
      `auto` déduit `int` : `premier` est une copie du premier élément. Avec `auto&`, c'est un alias de l'élément.
