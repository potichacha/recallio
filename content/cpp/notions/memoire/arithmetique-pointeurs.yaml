notion: arithmetique-pointeurs
lesson: |-
  Un pointeur vers un élément de tableau peut **avancer** et **reculer** dans ce tableau. C'est l'arithmétique des
  pointeurs : elle compte en **éléments**, pas en octets.

  ```cpp
  int t[4] = {10, 20, 30, 40};
  int* p = t;          // désigne t[0]
  p + 1                // désigne t[1] : l'adresse avance de sizeof(int) octets
  *(p + 2)             // 30
  ++p;                 // p désigne maintenant t[1]
  ```

  **Les opérations.**

  | Expression | Résultat |
  |---|---|
  | `p + n`, `p - n` | un pointeur `n` éléments plus loin, ou plus tôt |
  | `++p`, `--p`, `p += n` | déplacent `p` |
  | `q - p` | le **nombre d'éléments** entre deux pointeurs du même tableau |
  | `p < q`, `p == q` | comparent deux positions du même tableau |
  | `p[n]` | exactement `*(p + n)` |

  L'indexation n'est donc qu'une écriture de l'arithmétique : `t[2]` et `*(t + 2)` sont la même chose.

  **Parcourir un tableau.** Avant les itérateurs, on écrivait :

  ```cpp
  for (const int* p = t; p != t + 4; ++p) {
      std::println("{}", *p);
  }
  ```

  `t + 4` désigne **l'après-dernier** élément. C'est exactement le modèle de `begin()` et `end()` : les itérateurs
  d'un `std::vector` se comportent comme des pointeurs.

  **Les limites, toutes des comportements indéfinis.**

  - **Déréférencer** hors du tableau, y compris l'après-dernier : on peut **calculer** `t + 4`, pas lire `*(t + 4)`.
  - **Calculer** un pointeur au-delà de l'après-dernier, ou avant le premier : `t + 5`, `t - 1`, même sans le lire.
  - **Soustraire ou comparer** avec `<` deux pointeurs qui n'appartiennent **pas au même tableau**.
  - L'arithmétique sur un pointeur qui ne désigne pas un élément de tableau, au-delà de `p + 1`.

  **Ce qui ne marche pas.** On n'additionne pas deux pointeurs. Un `void*` n'a pas d'arithmétique : la taille de
  ce qu'il désigne est inconnue.

  **Et aujourd'hui ?** On écrit rarement cette arithmétique à la main : la boucle sur un intervalle, les itérateurs,
  `std::span` et les algorithmes font la même chose sans risque de se tromper de borne. Il faut la comprendre pour
  lire le code existant, et parce que tout le reste repose sur elle.

  **En entretien** : « `p + n` avance de `n` éléments, soit `n * sizeof(T)` octets ; `p[n]` vaut `*(p + n)` ; la
  différence de deux pointeurs est un nombre d'éléments. On peut former le pointeur après le dernier élément, pas
  le déréférencer : c'est le modèle des itérateurs. »
cards:
  - key: unite
    format: course
    question: "`p` est un `int*`. De combien l'adresse avance-t-elle avec `p + 1` ?"
    choices:
      - {text: "De la taille d'un `int` : l'arithmétique compte en éléments", correct: true}
      - {text: "D'un octet, quel que soit le type désigné", correct: false}
      - {text: "De la taille d'un pointeur, soit 8 octets", correct: false}
      - {text: "D'un bit, quel que soit le type désigné", correct: false}
    answer: "`p + 1` désigne l'élément suivant. Le compilateur multiplie par `sizeof(int)` : 4 octets en général."
  - key: indexation
    format: course
    question: "À quoi équivaut `p[3]`, quand `p` est un pointeur ?"
    choices:
      - {text: "À `*(p + 3)`", correct: true}
      - {text: "À `*p + 3`", correct: false}
      - {text: "À `&p + 3`", correct: false}
      - {text: "À `p + 3`", correct: false}
    answer: "L'indexation avance le pointeur de trois éléments, puis le déréférence. `*p + 3` ajouterait 3 à la valeur du premier élément."
  - key: difference
    format: course
    question: "Que donne `q - p`, pour deux pointeurs vers des éléments du même tableau ?"
    choices:
      - {text: "Le nombre d'éléments qui les séparent", correct: true}
      - {text: "Le nombre d'octets qui les séparent", correct: false}
      - {text: "Un pointeur vers le milieu du tableau", correct: false}
      - {text: "La différence des valeurs désignées", correct: false}
    answer: "Le résultat est un entier signé, de type `std::ptrdiff_t`, compté en éléments. C'est ainsi que `end - begin` donne une taille."
  - key: apres-dernier
    format: course
    question: "`int t[4];` Que peut-on faire du pointeur `t + 4` ?"
    choices:
      - {text: "Le calculer et le comparer, mais pas le déréférencer", correct: true}
      - {text: "Le déréférencer, pour lire le dernier élément", correct: false}
      - {text: "Rien : le calculer est déjà un comportement indéfini", correct: false}
      - {text: "Le déréférencer, pour agrandir le tableau", correct: false}
    answer: "C'est le pointeur après le dernier élément, qui sert de borne de fin, comme `end()`. Le dernier élément est `t[3]`."
  - key: vf-octets
    format: true-false
    question: "Pour un `double* p`, `p + 1` avance l'adresse d'un seul octet."
    truth: false
    answer: "Elle avance de `sizeof(double)`, soit 8 octets : d'un élément."
  - key: vf-void
    format: true-false
    question: "On peut écrire `p + 1` quand `p` est un `void*`."
    truth: false
    answer: "La taille de ce que désigne un `void*` est inconnue : le standard n'y définit pas d'arithmétique."
  - key: vf-somme
    format: true-false
    question: "On peut additionner deux pointeurs : `p + q`."
    truth: false
    answer: "Seules l'addition d'un entier et la soustraction de deux pointeurs ont un sens."
  - key: vf-iterateurs
    format: true-false
    question: "Les itérateurs d'un `std::vector` s'utilisent comme des pointeurs : `it + 2`, `*it`, `fin - debut`."
    truth: true
    answer: "Le modèle des itérateurs à accès direct est celui de l'arithmétique des pointeurs."
  - key: qcm-parcours
    format: multiple-choice
    question: "`int t[5];` Quelle boucle parcourt exactement les cinq éléments ?"
    choices:
      - {text: "`for (int* p = t; p != t + 5; ++p)`", correct: true}
      - {text: "`for (int* p = t; p != t + 4; ++p)`", correct: false}
      - {text: "`for (int* p = t; p <= t + 5; ++p)`", correct: false}
      - {text: "`for (int* p = t + 1; p != t + 5; ++p)`", correct: false}
    answer: "La borne est le pointeur après le dernier élément, exclu. Avec `t + 4`, le dernier serait oublié ; avec `<=`, on lirait hors du tableau."
  - key: qcm-indice
    format: multiple-choice
    question: "`p` désigne un élément du tableau `t`. Quelle expression donne son indice ?"
    choices:
      - {text: "`p - t`", correct: true}
      - {text: "`t - p`", correct: false}
      - {text: "`*p - *t`", correct: false}
      - {text: "`p + t`", correct: false}
    answer: "La différence compte les éléments entre le début du tableau et `p`."
  - key: qcm-ub
    format: multiple-choice
    question: "`int t[3];` Laquelle de ces expressions est un comportement indéfini ?"
    choices:
      - {text: "`*(t + 3)`", correct: true}
      - {text: "`t + 3`", correct: false}
      - {text: "`*(t + 2)`", correct: false}
      - {text: "`(t + 3) - t`", correct: false}
    answer: "`t + 3` est le pointeur après le dernier élément : on peut le former et le soustraire, pas le déréférencer."
  - key: qcm-valeur
    format: multiple-choice
    question: "`int t[] = {5, 6, 7};` et `int* p = t + 1;`. Que vaut `*p + 1` ?"
    choices:
      - {text: "`7`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`8`", correct: false}
      - {text: "`5`", correct: false}
    answer: "`*` s'applique d'abord : `*p` vaut 6, plus 1 donne 7. L'élément suivant s'écrirait `*(p + 1)`, qui vaut aussi 7 ici."
  - key: code-avancer
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int t[] = {10, 20, 30, 40};
          const int* p = t;
          ++p;
          std::println("{} {} {}", *p, *(p + 2), p[1]);
      }
      ```
    choices:
      - {text: "`20 40 30`", correct: true}
      - {text: "`10 30 20`", correct: false}
      - {text: "`20 22 21`", correct: false}
      - {text: "`20 40 20`", correct: false}
    answer: "`20 40 30` : après `++p`, le pointeur désigne 20. `p + 2` désigne 40, et `p[1]` vaut `*(p + 1)`, soit 30."
    check:
      output: "20 40 30"
  - key: code-difference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const double t[] = {1.5, 2.5, 3.5, 4.5, 5.5};
          const double* debut = t;
          const double* fin = t + 5;
          const double* p = &t[3];
          std::println("{} {} {}", fin - debut, p - debut, fin - p);
      }
      ```
    choices:
      - {text: "`5 3 2`", correct: true}
      - {text: "`40 24 16`", correct: false}
      - {text: "`5 4 1`", correct: false}
      - {text: "`4 3 1`", correct: false}
    answer: "`5 3 2` : la différence de deux pointeurs se compte en éléments, pas en octets, même pour des `double`."
    check:
      output: "5 3 2"
  - key: code-parcours
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int t[] = {1, 2, 3, 4};
          int somme = 0;
          for (int* p = t; p != t + 4; p += 2) {
              somme += *p;
              *p = 0;
          }
          std::println("{} {} {}", somme, t[0], t[1]);
      }
      ```
    choices:
      - {text: "`4 0 2`", correct: true}
      - {text: "`10 0 0`", correct: false}
      - {text: "`6 0 2`", correct: false}
      - {text: "`4 1 0`", correct: false}
    answer: "`4 0 2` : `p += 2` saute un élément sur deux. La boucle lit 1 et 3, et les remet à zéro ; 2 et 4 ne sont pas touchés."
    check:
      output: "4 0 2"
  - key: code-priorite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int t[] = {5, 6, 7};
          const int* p = t;
          std::println("{} {} {}", *p + 1, *(p + 1), *(t + 2) - *t);
      }
      ```
    choices:
      - {text: "`6 6 2`", correct: true}
      - {text: "`6 7 2`", correct: false}
      - {text: "`5 6 2`", correct: false}
      - {text: "`6 6 7`", correct: false}
    answer: "`6 6 2` : `*p + 1` ajoute 1 à la valeur 5. `*(p + 1)` lit l'élément suivant, 6. Le dernier calcule 7 - 5."
    check:
      output: "6 6 2"
  - key: bug-borne
    format: bug-fix
    question: |-
      Cette boucle affiche les trois éléments, puis lit après la fin du tableau. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int t[] = {1, 2, 3};
          for (const int* p = t; p <= t + 3; ++p) {
              std::println("{}", *p);
          }
      }
      ```
    choices:
      - {text: "Écrire la condition `p != t + 3`", correct: true}
      - {text: "Écrire la condition `p <= t + 4`", correct: false}
      - {text: "Écrire la condition `*p != 3`", correct: false}
      - {text: "Écrire la condition `p != t + 2`", correct: false}
    answer: |-
      ```cpp
      for (const int* p = t; p != t + 3; ++p) {
      ```
      `t + 3` est le pointeur après le dernier élément : il sert de borne, exclue. Avec `<=`, la boucle le
      déréférence au quatrième tour.
  - key: bug-priorite
    format: bug-fix
    question: |-
      Ce programme devrait afficher le deuxième élément, `20`. Il affiche `11`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int t[] = {10, 20, 30};
          const int* p = t;
          std::println("{}", *p + 1);
      }
      ```
    choices:
      - {text: "Écrire `*(p + 1)`", correct: true}
      - {text: "Écrire `*p++ + 1`", correct: false}
      - {text: "Écrire `&p + 1`", correct: false}
      - {text: "Écrire `*p + sizeof(int)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *(p + 1));
      ```
      `*` est prioritaire sur `+` : `*p + 1` ajoute 1 à la valeur 10. Les parenthèses font avancer le pointeur avant
      de le déréférencer ; `p[1]` dit la même chose.
  - key: bug-octets
    format: bug-fix
    question: |-
      Ce programme devrait afficher le deuxième élément, `20`. L'auteur a voulu avancer de la taille d'un `int`, et
      le programme lit hors du tableau. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int t[] = {10, 20, 30};
          const int* p = t + sizeof(int);
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Écrire `const int* p = t + 1;`", correct: true}
      - {text: "Écrire `const int* p = t + sizeof(int*);`", correct: false}
      - {text: "Écrire `const int* p = t * sizeof(int);`", correct: false}
      - {text: "Écrire `const int* p = &t + 1;`", correct: false}
    answer: |-
      ```cpp
      const int* p = t + 1;
      ```
      L'arithmétique compte déjà en éléments : `t + sizeof(int)` avance de quatre éléments, hors du tableau. Pour
      l'élément suivant, on ajoute 1.
  - key: bug-autre-tableau
    format: bug-fix
    question: |-
      Ce programme soustrait deux pointeurs vers deux tableaux différents pour compter des éléments : comportement
      indéfini. Il devrait afficher `3`, la taille de `a`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int a[] = {1, 2, 3};
          const int b[] = {4, 5, 6};
          std::println("{}", b - a);
      }
      ```
    choices:
      - {text: "Écrire `(a + 3) - a`, deux pointeurs du même tableau", correct: true}
      - {text: "Écrire `a - b`, dans l'autre sens", correct: false}
      - {text: "Écrire `&b - &a`, avec les adresses des tableaux", correct: false}
      - {text: "Écrire `*b - *a`, avec les premiers éléments", correct: false}
    answer: |-
      ```cpp
      std::println("{}", (a + 3) - a);
      ```
      La différence de deux pointeurs n'a de sens que dans un même tableau. Rien ne dit où le compilateur a placé
      `a` et `b` l'un par rapport à l'autre. Pour une taille, `std::size(a)` est plus direct.
  - key: trous-avancer
    format: fill-in
    question: |-
      Complète pour lire l'élément situé deux positions après `p` :
      ```cpp
      int valeur = *(p ___ 2);
      ```
    blanks:
      - ["+"]
    answer: "`p + 2` désigne l'élément deux positions plus loin."
  - key: trous-borne
    format: fill-in
    question: |-
      Complète la borne de fin, pour un tableau de 4 éléments :
      ```cpp
      int t[4] = {1, 2, 3, 4};
      for (int* p = t; p != t + ___; ++p) {
          std::println("{}", *p);
      }
      ```
    blanks:
      - ["4"]
    answer: "`t + 4` désigne l'après-dernier élément : la borne exclue."
  - key: trous-increment
    format: fill-in
    question: |-
      Complète pour faire passer le pointeur à l'élément suivant :
      ```cpp
      for (const int* p = debut; p != fin; ___p) {
          std::println("{}", *p);
      }
      ```
    blanks:
      - ["++"]
    answer: "`++p` avance le pointeur d'un élément."
  - key: trous-difference
    format: fill-in
    question: |-
      Complète pour obtenir le nombre d'éléments entre `debut` et `fin` :
      ```cpp
      auto nombre = fin ___ debut;
      ```
    blanks:
      - ["-"]
    answer: "La différence de deux pointeurs d'un même tableau est un nombre d'éléments."
