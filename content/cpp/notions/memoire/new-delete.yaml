notion: new-delete
lesson: |-
  **`new`** alloue un objet **sur le tas**, le construit, et renvoie un **pointeur** vers lui. **`delete`** le
  détruit et rend sa mémoire.

  ```cpp
  int* p = new int{5};     // alloue un int qui vaut 5
  *p += 1;
  delete p;                // appelle le destructeur, puis libère

  int* tableau = new int[100];   // alloue 100 int
  delete[] tableau;              // la forme tableau
  ```

  **Les règles.**

  - À chaque `new` son `delete`, **une fois et une seule**.
  - `new` va avec `delete`, **`new[]` avec `delete[]`**. Les mélanger est un comportement indéfini.
  - Un objet alloué par `new` **ne suit pas la portée** : il vit jusqu'au `delete`, même après la fin de la fonction
    qui l'a créé.
  - `delete` sur `nullptr` est permis, et ne fait rien.
  - Si la mémoire manque, `new` lève `std::bad_alloc`.

  **Après un `delete`**, le pointeur garde l'ancienne adresse : il est **pendant**. Le déréférencer, ou le libérer
  une seconde fois, est un comportement indéfini. Le remettre à `nullptr` rend la faute visible.

  **Ce qui peut mal tourner.**

  | Faute | Conséquence |
  |---|---|
  | `delete` oublié | **fuite** : la mémoire reste prise |
  | deux `delete` sur le même objet | **double libération** : plantage ou corruption |
  | utilisation après `delete` | lecture d'une mémoire libérée |
  | `delete` au lieu de `delete[]` | comportement indéfini |

  **En C++ moderne, on n'écrit presque jamais `new` ni `delete`.** `std::vector` gère les tableaux,
  `std::make_unique` et `std::make_shared` gèrent les objets seuls, et tous libèrent sans qu'on y pense. Il faut
  connaître `new` et `delete` pour comprendre ce qu'ils font, et pour lire le code plus ancien.

  **En entretien** : « `new` alloue et construit, `delete` détruit et libère ; `new[]` va avec `delete[]`. Dans du
  code neuf, je passe par `std::make_unique` et les conteneurs : pas de `delete` à oublier. »
cards:
  - key: role-de-new
    format: course
    question: "Que fait `new int{5}` ?"
    choices:
      - {text: "Il alloue un `int` sur le tas, l'initialise à 5, et renvoie son adresse", correct: true}
      - {text: "Il déclare une variable locale `int` qui vaut 5", correct: false}
      - {text: "Il alloue cinq `int` sur le tas, et renvoie le premier", correct: false}
      - {text: "Il renvoie une référence vers un `int` temporaire", correct: false}
    answer: "`new` alloue, construit, et renvoie un pointeur : `int* p = new int{5};`. Pour cinq entiers, ce serait `new int[5]`."
  - key: role-de-delete
    format: course
    question: "Que fait `delete p;` ?"
    choices:
      - {text: "Il détruit l'objet pointé et rend sa mémoire", correct: true}
      - {text: "Il supprime la variable `p` elle-même", correct: false}
      - {text: "Il remet `p` à `nullptr`, sans rien libérer", correct: false}
      - {text: "Il met à zéro l'objet pointé, qui reste alloué", correct: false}
    answer: "`delete` appelle le destructeur de l'objet, puis libère le bloc. La variable `p` existe toujours, et garde l'ancienne adresse : elle est pendante."
  - key: duree-de-vie
    format: course
    question: "Jusqu'à quand vit un objet créé avec `new` dans une fonction ?"
    choices:
      - {text: "Jusqu'au `delete`, même après la fin de la fonction", correct: true}
      - {text: "Jusqu'à la fin de la fonction, comme une variable locale", correct: false}
      - {text: "Jusqu'à la fin du bloc où `new` est écrit", correct: false}
      - {text: "Jusqu'à ce que plus aucun pointeur ne le désigne", correct: false}
    answer: "Un objet du tas ne suit pas la portée. Si le dernier pointeur vers lui disparaît sans `delete`, il reste alloué : c'est une fuite, pas une libération."
  - key: pourquoi-eviter
    format: course
    question: "Pourquoi écrit-on rarement `new` et `delete` en C++ moderne ?"
    choices:
      - {text: "Les conteneurs et les pointeurs intelligents libèrent tout seuls, sans `delete` à oublier", correct: true}
      - {text: "`new` et `delete` sont retirés de la norme depuis C++17", correct: false}
      - {text: "`new` est plus lent qu'une allocation par `std::make_unique`", correct: false}
      - {text: "`new` ne sait allouer que des types fondamentaux", correct: false}
    answer: "`std::vector`, `std::make_unique` et `std::make_shared` appellent `new` et `delete` pour nous, au bon moment. Ils existent toujours ; c'est leur gestion à la main qu'on évite."
  - key: vf-delete-nullptr
    format: true-false
    question: "`delete` sur un pointeur nul est permis, et ne fait rien."
    truth: true
    answer: Inutile de tester le pointeur avant un `delete`.
  - key: vf-delete-tableau
    format: true-false
    question: "Un tableau alloué avec `new int[10]` se libère avec `delete`, sans crochets."
    truth: false
    answer: "Il faut `delete[]`. Utiliser `delete` sur un tableau est un comportement indéfini."
  - key: vf-pointeur-apres-delete
    format: true-false
    question: "Après `delete p;`, le pointeur `p` vaut `nullptr`."
    truth: false
    answer: "`p` garde l'ancienne adresse : il est pendant. C'est au programme de le remettre à `nullptr`."
  - key: vf-fin-de-fonction
    format: true-false
    question: Un objet alloué avec `new` est libéré à la fin de la fonction qui l'a créé.
    truth: false
    answer: Il reste alloué jusqu'à un `delete`. Sans lui, la mémoire fuit.
  - key: qcm-allouer-un-tableau
    format: multiple-choice
    question: "Quelle ligne alloue sur le tas un tableau de `n` entiers ?"
    choices:
      - {text: "`int* t = new int[n];`", correct: true}
      - {text: "`int* t = new int{n};`", correct: false}
      - {text: "`int* t = new int(n);`", correct: false}
      - {text: "`int t[n] = new int;`", correct: false}
    answer: "Les crochets allouent un tableau. Avec des accolades ou des parenthèses, `new` alloue un seul entier, qui vaut `n`."
  - key: qcm-echec
    format: multiple-choice
    question: "Que fait `new` quand la mémoire est épuisée ?"
    choices:
      - {text: "Il lève une exception `std::bad_alloc`", correct: true}
      - {text: "Il renvoie `nullptr`", correct: false}
      - {text: "Il renvoie l'adresse du dernier bloc alloué", correct: false}
      - {text: "Il attend qu'un autre programme libère de la mémoire", correct: false}
    answer: "`new` lève `std::bad_alloc`. C'est `malloc`, en C, qui renvoie un pointeur nul ; `new (std::nothrow)` existe pour retrouver ce comportement."
  - key: qcm-remplacant
    format: multiple-choice
    question: "Par quoi remplace-t-on `new int[n]` et son `delete[]` dans du code moderne ?"
    choices:
      - {text: "Par `std::vector<int> v(n);`", correct: true}
      - {text: "Par `int v[n];`", correct: false}
      - {text: "Par `std::array<int, n> v;`", correct: false}
      - {text: "Par `auto v = new auto[n];`", correct: false}
    answer: "Le vecteur alloue ses éléments sur le tas et les libère dans son destructeur. Un tableau local ou un `std::array` demandent une taille connue à la compilation."
  - key: qcm-apres-delete
    format: multiple-choice
    question: "Que fait-on d'un pointeur juste après son `delete`, s'il reste visible ?"
    choices:
      - {text: "On le met à `nullptr`", correct: true}
      - {text: "On le libère une seconde fois, par sécurité", correct: false}
      - {text: "On le déréférence, pour vérifier la libération", correct: false}
      - {text: "On lui affecte 0, puis on le libère", correct: false}
    answer: "Un pointeur nul se teste, et son `delete` est sans danger. Un pointeur pendant ne se distingue pas d'un pointeur valide."
  - key: trous-new
    format: fill-in
    question: |-
      Complète pour allouer un entier sur le tas :
      ```cpp
      int* p = ___ int{5};
      ```
    blanks:
      - [new]
    answer: "`new int{5}` alloue l'entier et renvoie son adresse."
  - key: trous-delete
    format: fill-in
    question: |-
      Complète pour libérer l'entier :
      ```cpp
      int* p = new int{5};
      std::println("{}", *p);
      ___ p;
      ```
    blanks:
      - [delete]
    answer: "`delete p;` détruit l'objet et rend sa mémoire."
  - key: trous-delete-tableau
    format: fill-in
    question: |-
      Complète pour libérer le tableau :
      ```cpp
      int* notes = new int[100];
      delete___ notes;
      ```
    blanks:
      - ["[]"]
    answer: "Un tableau alloué avec `new[]` se libère avec `delete[]`."
  - key: trous-nullptr
    format: fill-in
    question: |-
      Complète pour que le pointeur ne reste pas pendant :
      ```cpp
      delete p;
      p = ___;
      ```
    blanks:
      - [nullptr]
    answer: "Remis à `nullptr`, le pointeur peut être testé, et un second `delete` ne fait rien."
  - key: code-allouer-et-liberer
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int* p = new int{5};
          *p += 10;
          std::println("{}", *p);
          delete p;
      }
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`15` : `new` crée un entier qui vaut 5, qu'on modifie à travers le pointeur. Le `delete` le libère après l'affichage."
    check:
      output: "15"
  - key: code-duree-de-vie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace() { std::println("création"); }
          ~Trace() { std::println("destruction"); }
      };

      int main() {
          Trace* p = nullptr;
          {
              p = new Trace;
          }
          std::println("après le bloc");
          delete p;
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          création
          après le bloc
          destruction
          fin
          ```
        correct: true
      - text: |-
          ```
          création
          destruction
          après le bloc
          fin
          ```
        correct: false
      - text: |-
          ```
          création
          après le bloc
          fin
          destruction
          ```
        correct: false
      - text: |-
          ```
          création
          après le bloc
          fin
          ```
        correct: false
    answer: |-
      ```
      création
      après le bloc
      destruction
      fin
      ```
      L'objet créé par `new` ne suit pas la portée : il survit à la fin du bloc. Son destructeur s'exécute au
      `delete`.
    check:
      output: |-
        création
        après le bloc
        destruction
        fin
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int taille = 4;
          int* carres = new int[taille];
          for (int i = 0; i < taille; ++i) {
              carres[i] = i * i;
          }
          std::println("{} {}", carres[2], carres[3]);
          delete[] carres;
      }
      ```
    choices:
      - {text: "`4 9`", correct: true}
      - {text: "`2 3`", correct: false}
      - {text: "`9 16`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`4 9` : `new int[taille]` alloue quatre entiers, d'indices 0 à 3, dont la taille est décidée à l'exécution. On y accède avec des crochets."
    check:
      output: "4 9"
  - key: code-delete-nul
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int* p = new int{7};
          delete p;
          p = nullptr;
          delete p;
          std::println("{}", p == nullptr);
      }
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true` : le second `delete` porte sur un pointeur nul, ce qui est permis et ne fait rien. Sans la ligne `p = nullptr;`, ce serait une double libération."
    check:
      output: "true"
  - key: bug-delete-oublie
    format: bug-fix
    question: |-
      Valgrind signale « 400 bytes definitely lost » pour ce programme. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* notes = new int[100];
          notes[0] = 12;
          std::println("{}", notes[0]);
      }
      ```
    choices:
      - {text: "Ajouter `delete[] notes;` à la fin de `main`", correct: true}
      - {text: "Ajouter `delete notes;` à la fin de `main`", correct: false}
      - {text: "Ajouter `notes = nullptr;` à la fin de `main`", correct: false}
      - {text: "Ajouter `notes.clear();` à la fin de `main`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", notes[0]);
      delete[] notes;
      ```
      Ce que `new[]` alloue doit être rendu par `delete[]`. Mettre le pointeur à `nullptr` perdrait l'adresse sans
      rien libérer. Un `std::vector<int> notes(100);` n'aurait rien à libérer.
  - key: bug-mauvais-delete
    format: bug-fix
    question: |-
      Ce programme a un comportement indéfini à sa dernière ligne. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int* notes = new int[3];
          notes[0] = 12;
          std::println("{}", notes[0]);
          delete notes;
      }
      ```
    choices:
      - {text: "Un tableau alloué avec `new[]` se libère avec `delete[]`", correct: true}
      - {text: "Un tableau doit être libéré avant d'être lu", correct: false}
      - {text: "Un tableau de trois éléments est trop petit pour `new`", correct: false}
      - {text: "Un tableau se libère élément par élément, avec trois `delete`", correct: false}
    answer: |-
      ```cpp
      delete[] notes;
      ```
      `delete` et `delete[]` ne sont pas interchangeables. Pour des entiers, le programme semble souvent marcher ;
      pour des objets, un seul destructeur serait appelé.
  - key: bug-double-delete
    format: bug-fix
    question: |-
      Ce programme plante : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* p = new int{5};
          int* q = p;
          std::println("{}", *q);
          delete p;
          delete q;
      }
      ```
    choices:
      - {text: "Retirer l'un des deux `delete`", correct: true}
      - {text: "Ajouter un troisième `delete`", correct: false}
      - {text: "Remplacer les `delete` par des `delete[]`", correct: false}
      - {text: "Déclarer `q` avec `const int*`", correct: false}
    answer: |-
      ```cpp
      delete p;
      ```
      `p` et `q` désignent le même entier : il n'y a eu qu'un `new`, il ne faut qu'un `delete`. Copier un pointeur ne
      copie pas l'objet.
  - key: bug-usage-apres-delete
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5`, et affiche un nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* p = new int{5};
          delete p;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Afficher `*p` avant le `delete`", correct: true}
      - {text: "Afficher `p` sans étoile, après le `delete`", correct: false}
      - {text: "Écrire `delete[] p;` à la place de `delete p;`", correct: false}
      - {text: "Écrire `delete *p;` à la place de `delete p;`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *p);
      delete p;
      ```
      Après `delete`, l'entier n'existe plus : `p` est pendant, et le déréférencer est un comportement indéfini. On
      libère en dernier.
