notion: pointeurs-bases
lesson: |-
  Chaque variable occupe un emplacement en mémoire, repéré par une **adresse**. Un **pointeur** est une variable qui
  contient une adresse.

  ```cpp
  int x = 5;
  int* p = &x;    // p contient l'adresse de x
  *p = 9;         // on écrit dans la variable pointée : x vaut 9
  ```

  | Écriture | Sens |
  |---|---|
  | `int* p` | `p` est un pointeur vers un `int` |
  | `&x` | l'**adresse** de `x` |
  | `*p` | la variable **pointée** par `p` : c'est **déréférencer** le pointeur |
  | `p->membre` | le membre de l'objet pointé, pour `(*p).membre` |
  | `nullptr` | le pointeur **nul** : il ne pointe sur rien |

  - Un pointeur a un **type** : un `int*` ne reçoit que l'adresse d'un `int`.
  - On peut le faire **pointer ailleurs** : `p = &y;`. Copier un pointeur copie l'adresse : les deux désignent la
    même variable.
  - Dans une condition, un pointeur vaut vrai s'il n'est pas nul : `if (p)`.

  **Les trois fautes.**

  - **Déréférencer `nullptr`** : comportement indéfini, en pratique un plantage (« Segmentation fault »).
  - **Déréférencer un pointeur non initialisé** : `int* p;` contient une adresse quelconque. On initialise toujours,
    au besoin à `nullptr`.
  - **Déréférencer un pointeur vers une variable détruite** : un pointeur pendant.

  **Piège de syntaxe** : `int* a, b;` déclare un pointeur `a` et un **entier** `b`. Une déclaration par ligne.

  En C++ moderne, on écrit peu de pointeurs bruts : une **référence** quand l'objet existe toujours, un **pointeur
  intelligent** quand il faut posséder la mémoire. Le pointeur brut reste pour dire « peut-être rien », et pour
  observer sans posséder.

  **En entretien** : « Un pointeur contient une adresse, et peut être nul. Je teste avant de déréférencer, et
  j'utilise `nullptr`, jamais `NULL` ni `0`. »
tour:
  - title: Les pointeurs
    text: |-
      Un pointeur contient l'**adresse** d'une variable. `&x` donne l'adresse de `x`, et `*p` désigne la variable
      dont `p` contient l'adresse.

      Écrire dans `*p`, c'est écrire dans la variable pointée. Un pointeur peut changer de cible, et il peut ne
      pointer sur rien : c'est `nullptr`, qu'on teste avant de s'en servir.

      Essaie : retire le `if`, et affiche `*p` alors que `p` vaut `nullptr`. Le programme plante.
    example:
      files:
        main.cpp: |-
          #include <print>

          int main() {
              int a = 1;
              int b = 2;

              int* p = &a;
              *p = 10;

              p = &b;
              *p = 20;

              std::println("{} {}", a, b);

              p = nullptr;
              if (p) {
                  std::println("{}", *p);
              } else {
                  std::println("p ne pointe sur rien");
              }
          }
      output: |-
        10 20
        p ne pointe sur rien
    task:
      instructions: |-
        Avec le pointeur `p`, et sans écrire `score = ...`, ajoute 5 au score pour afficher `15`.
      starter:
        main.cpp: |-
          #include <print>

          int main() {
              int score = 10;
              int* p = &score;

              std::println("{}", score);
          }
      solution:
        main.cpp: |-
          #include <print>

          int main() {
              int score = 10;
              int* p = &score;

              *p += 5;

              std::println("{}", score);
          }
      output: "15"
cards:
  - key: contenu-d-un-pointeur
    format: course
    question: Que contient une variable de type `int*` ?
    choices:
      - {text: "L'adresse d'un `int`", correct: true}
      - {text: "La valeur d'un `int`, en plus grand", correct: false}
      - {text: "Deux `int`, rangés côte à côte", correct: false}
      - {text: "Le nom d'une variable `int`", correct: false}
    answer: "Un pointeur contient une adresse : l'emplacement en mémoire d'une variable du type annoncé. Sur une machine 64 bits, il occupe 8 octets, quel que soit le type pointé."
  - key: esperluette-et-etoile
    format: course
    question: "Que font `&x` et `*p` dans une expression ?"
    choices:
      - {text: "`&x` donne l'adresse de `x`, `*p` donne la variable pointée par `p`", correct: true}
      - {text: "`&x` donne la variable pointée par `x`, `*p` donne l'adresse de `p`", correct: false}
      - {text: "`&x` crée une copie de `x`, `*p` multiplie `p` par lui-même", correct: false}
      - {text: "`&x` et `*p` donnent tous deux une adresse", correct: false}
    answer: "`&` prend l'adresse, `*` suit l'adresse. Ce sont deux opérations inverses : `*&x` est `x`."
  - key: role-de-nullptr
    format: course
    question: "À quoi sert `nullptr` ?"
    choices:
      - {text: "À dire qu'un pointeur ne pointe sur rien", correct: true}
      - {text: "À libérer la mémoire qu'un pointeur désigne", correct: false}
      - {text: "À dire qu'un pointeur désigne la valeur zéro", correct: false}
      - {text: "À créer un pointeur vers une nouvelle variable", correct: false}
    answer: "`nullptr` est le pointeur nul. Il a son propre type, ce qui évite les confusions de `NULL` et de `0` avec un entier. Le déréférencer est un comportement indéfini."
  - key: copie-d-un-pointeur
    format: course
    question: "Après `int* q = p;`, que désignent `p` et `q` ?"
    choices:
      - {text: "La même variable : l'adresse a été copiée, pas la variable", correct: true}
      - {text: "Deux variables distinctes : la variable pointée a été copiée", correct: false}
      - {text: "`q` désigne `p`, qui désigne la variable", correct: false}
      - {text: "Plus rien : copier un pointeur le rend nul", correct: false}
    answer: "Copier un pointeur copie une adresse. `*p` et `*q` sont la même variable : modifier l'une modifie l'autre."
  - key: vf-type-du-pointeur
    format: true-false
    question: "Un `int*` peut recevoir l'adresse d'une variable `double`."
    truth: false
    answer: Un pointeur a un type, que le compilateur vérifie. L'adresse d'un `double` va dans un `double*`.
  - key: vf-dereferencer-nul
    format: true-false
    question: "Déréférencer `nullptr` lève une exception que le programme peut rattraper."
    truth: false
    answer: C'est un comportement indéfini, sans exception. En pratique, le système arrête le programme.
  - key: vf-deux-pointeurs
    format: true-false
    question: "`int* a, b;` déclare deux pointeurs."
    truth: false
    answer: "L'étoile ne s'applique qu'à `a` : `b` est un `int`. D'où l'habitude d'une déclaration par ligne."
  - key: vf-condition
    format: true-false
    question: "`if (p)` est vrai quand le pointeur `p` n'est pas nul."
    truth: true
    answer: "Dans une condition, un pointeur se convertit en `bool` : faux s'il est nul, vrai sinon. C'est la même chose que `if (p != nullptr)`."
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle ligne fait pointer `p` sur la variable `x`, de type `int` ?"
    choices:
      - {text: "`int* p = &x;`", correct: true}
      - {text: "`int* p = x;`", correct: false}
      - {text: "`int p = &x;`", correct: false}
      - {text: "`int& p = *x;`", correct: false}
    answer: "Le type est `int*`, et la valeur est l'adresse de `x`. Sans `&`, on tenterait de ranger un entier dans un pointeur."
  - key: qcm-fleche
    format: multiple-choice
    question: "Avec `Point* p`, comment lit-on le membre `x` de l'objet pointé ?"
    choices:
      - {text: "`p->x`", correct: true}
      - {text: "`p.x`", correct: false}
      - {text: "`*p.x`", correct: false}
      - {text: "`p::x`", correct: false}
    answer: "`p->x`, qui abrège `(*p).x`. Sans parenthèses, `*p.x` se lit `*(p.x)` : le point passe avant l'étoile."
  - key: qcm-non-initialise
    format: multiple-choice
    question: "Que contient `p` après `int* p;` dans une fonction ?"
    choices:
      - {text: "Une adresse quelconque : il n'est pas initialisé", correct: true}
      - {text: "`nullptr` : un pointeur est nul par défaut", correct: false}
      - {text: "L'adresse d'un `int` créé pour l'occasion", correct: false}
      - {text: "L'adresse de la dernière variable déclarée", correct: false}
    answer: "Comme toute variable locale d'un type fondamental, il contient une valeur indéterminée. Le déréférencer est un comportement indéfini. On écrit `int* p = nullptr;`."
  - key: qcm-nul-moderne
    format: multiple-choice
    question: Comment écrit-on le pointeur nul en C++ moderne ?
    choices:
      - {text: "`nullptr`", correct: true}
      - {text: "`NULL`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`null`", correct: false}
    answer: "`nullptr`, depuis C++11. `NULL` et `0` sont des entiers : avec une fonction surchargée pour `int` et pour un pointeur, ils appellent la version `int`."
  - key: trous-adresse
    format: fill-in
    question: |-
      Complète pour que `p` contienne l'adresse de `x` :
      ```cpp
      int x = 5;
      int* p = ___x;
      ```
    blanks:
      - ["&"]
    answer: "`&x` est l'adresse de `x`."
  - key: trous-dereferencer
    format: fill-in
    question: |-
      Complète pour écrire 9 dans la variable pointée :
      ```cpp
      int x = 5;
      int* p = &x;
      ___p = 9;
      ```
    blanks:
      - ["*"]
    answer: "`*p` désigne la variable pointée : `x` vaut maintenant 9."
  - key: trous-nullptr
    format: fill-in
    question: |-
      Complète pour que le pointeur ne pointe sur rien :
      ```cpp
      int* p = ___;
      ```
    blanks:
      - [nullptr]
    answer: "`nullptr` est le pointeur nul."
  - key: trous-fleche
    format: fill-in
    question: |-
      Complète pour modifier le membre `x` de l'objet pointé :
      ```cpp
      Point point{3, 4};
      Point* p = &point;
      p___x = 10;
      ```
    blanks:
      - ["->"]
    answer: "`p->x` accède au membre à travers le pointeur."
  - key: code-ecrire-par-le-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int* p = &x;
          *p = 9;
          std::println("{}", x);
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`14`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9` : `p` contient l'adresse de `x`, et `*p` désigne `x`. Écrire dans `*p` modifie `x`."
    check:
      output: "9"
  - key: code-changer-de-cible
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int a = 1;
          int b = 2;
          int* p = &a;
          p = &b;
          *p = 7;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`1 7`", correct: true}
      - {text: "`7 2`", correct: false}
      - {text: "`7 7`", correct: false}
      - {text: "`2 7`", correct: false}
    answer: "`1 7` : `p = &b;` change la cible du pointeur, sans toucher `a`. L'écriture qui suit va dans `b`."
    check:
      output: "1 7"
  - key: code-deux-pointeurs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          int* p = &x;
          int* q = p;
          *q += 10;
          std::println("{} {} {}", x, *p, p == q);
      }
      ```
    choices:
      - {text: "`11 11 true`", correct: true}
      - {text: "`1 11 false`", correct: false}
      - {text: "`11 1 true`", correct: false}
      - {text: "`1 1 true`", correct: false}
    answer: "`11 11 true` : `q` reçoit la même adresse que `p`. Les deux désignent `x`, et comparer deux pointeurs compare leurs adresses."
    check:
      output: "11 11 true"
  - key: code-fleche
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point point{3, 4};
          Point* p = &point;
          p->x = 10;
          std::println("{} {}", point.x, (*p).y);
      }
      ```
    choices:
      - {text: "`10 4`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10 4` : `p->x` est le membre `x` de l'objet pointé, c'est-à-dire `point.x`. `(*p).y` est l'écriture longue de `p->y`."
    check:
      output: "10 4"
  - key: bug-pointeur-nul
    format: bug-fix
    question: |-
      Ce programme plante (« Segmentation fault »). Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* gagnant = nullptr;
          std::println("{}", *gagnant);
      }
      ```
    choices:
      - {text: "Tester `if (gagnant)` avant de le déréférencer", correct: true}
      - {text: "Écrire `&gagnant` dans l'affichage", correct: false}
      - {text: "Remplacer `nullptr` par `0`", correct: false}
      - {text: "Entourer l'affichage d'un `try` et d'un `catch`", correct: false}
    answer: |-
      ```cpp
      if (gagnant) {
          std::println("{}", *gagnant);
      }
      ```
      Un pointeur nul ne pointe sur rien : le déréférencer est un comportement indéfini. Ce n'est pas une exception,
      un `catch` ne rattrape rien.
  - key: bug-pointeur-non-initialise
    format: bug-fix
    question: |-
      Ce programme affiche souvent `5`, mais il écrit à une adresse quelconque : rien ne le garantit. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int* p;
          *p = 5;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "`p` n'est pas initialisé : il contient une adresse quelconque", correct: true}
      - {text: "`p` vaut `nullptr` par défaut, qu'on ne peut pas déréférencer", correct: false}
      - {text: "`*p = 5` range 5 dans le pointeur, et non dans la variable", correct: false}
      - {text: "Un pointeur ne peut être déréférencé qu'une seule fois", correct: false}
    answer: |-
      ```cpp
      int valeur = 0;
      int* p = &valeur;
      ```
      Un pointeur local sans valeur de départ contient ce qui traînait en mémoire : y écrire peut sembler marcher,
      corrompre une autre variable, ou planter. Il doit pointer vers une vraie variable avant qu'on écrive à travers
      lui.
  - key: bug-esperluette-oubliee
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'int' to 'int*' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int x = 5;
          int* p = x;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Écrire `int* p = &x;`", correct: true}
      - {text: "Écrire `int* p = *x;`", correct: false}
      - {text: "Écrire `int p = x;`", correct: false}
      - {text: "Écrire `int* p = (int*)x;`", correct: false}
    answer: |-
      ```cpp
      int* p = &x;
      ```
      Un pointeur reçoit une adresse, pas une valeur. Forcer la conversion avec un cast compilerait, et ferait
      pointer `p` sur l'adresse 5 : un plantage assuré.
  - key: bug-deux-declarations
    format: bug-fix
    question: |-
      Ce code ne compile pas : la ligne `b = &y;` est refusée. Pourquoi ?
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          int y = 2;
          int* a, b;
          a = &x;
          b = &y;
          std::println("{} {}", *a, *b);
      }
      ```
    choices:
      - {text: "L'étoile ne vaut que pour `a` : `b` est un `int`", correct: true}
      - {text: "Deux pointeurs ne peuvent pas être déclarés sur une ligne", correct: false}
      - {text: "`a` et `b` désignent déjà la même variable", correct: false}
      - {text: "`&y` n'est pas permis après `&x`", correct: false}
    answer: |-
      ```cpp
      int* a = &x;
      int* b = &y;
      ```
      Dans une déclaration multiple, l'étoile s'attache au nom, pas au type. Une déclaration par ligne, avec sa
      valeur de départ, évite le piège.
  - key: definition-pointeur
    format: definition
    question: Qu'est-ce qu'un pointeur ?
    choices:
      - {text: "Une variable qui contient l'adresse d'une autre variable", correct: true}
      - {text: "Une variable qui contient une copie d'une autre variable", correct: false}
      - {text: "Un autre nom donné à une variable existante", correct: false}
      - {text: "Une variable qui ne peut plus être modifiée", correct: false}
    answer: "Une variable dont la valeur est une adresse. « Un autre nom pour une variable », c'est une référence."
  - key: definition-adresse
    format: definition
    question: Qu'est-ce que l'adresse d'une variable ?
    choices:
      - {text: "Le numéro de l'emplacement mémoire où elle est rangée", correct: true}
      - {text: "Le numéro de la ligne où elle est déclarée", correct: false}
      - {text: "La taille qu'elle occupe, en octets", correct: false}
      - {text: "Le nom sous lequel le compilateur la connaît", correct: false}
    answer: "La mémoire est une suite d'octets numérotés : l'adresse d'une variable est le numéro de son premier octet. `&x` la donne."
  - key: definition-dereferencer
    format: definition
    question: Que veut dire « déréférencer » un pointeur ?
    choices:
      - {text: "Accéder à la variable dont il contient l'adresse", correct: true}
      - {text: "Lui donner la valeur `nullptr`", correct: false}
      - {text: "Libérer la mémoire qu'il désigne", correct: false}
      - {text: "Lire l'adresse qu'il contient", correct: false}
    answer: "Suivre l'adresse jusqu'à la variable pointée, avec `*p` ou `p->`."
  - key: definition-pointeur-nul
    format: definition
    question: Qu'est-ce qu'un pointeur nul ?
    choices:
      - {text: "Un pointeur qui ne pointe sur aucun objet", correct: true}
      - {text: "Un pointeur vers une variable qui vaut zéro", correct: false}
      - {text: "Un pointeur qui n'a pas été initialisé", correct: false}
      - {text: "Un pointeur vers une variable détruite", correct: false}
    answer: "Un pointeur qui vaut `nullptr` : un état connu, qu'on peut tester. Un pointeur non initialisé ou pendant, lui, ne se distingue pas d'un pointeur valide."
