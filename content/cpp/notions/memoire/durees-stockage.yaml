notion: durees-stockage
lesson: |-
  La **durée de stockage** d'un objet dit **quand il est créé et quand il est détruit**. C++ en définit quatre.

  | Durée | Qui | Créé | Détruit |
  |---|---|---|---|
  | **automatique** | variables locales, paramètres | à sa déclaration | à la fin de son bloc |
  | **statique** | variables globales, `static` | avant ou au premier usage | à la fin du programme |
  | **dynamique** | objets créés par `new`, `make_unique` | à la demande | par `delete`, ou par son propriétaire |
  | **de thread** | variables `thread_local` | au premier usage dans le thread | à la fin du thread |

  **Automatique.** Le cas ordinaire : l'objet vit sur la pile, le temps de son bloc. Ne jamais renvoyer son adresse
  ni une référence vers lui.

  **Statique.** Un seul exemplaire, qui dure tout le programme. Trois formes :

  ```cpp
  int compteur_global = 0;                 // variable globale

  int suivant() {
      static int numero = 0;               // locale statique : initialisée au PREMIER appel, puis conservée
      return ++numero;
  }

  class Session {
      static inline int ouvertes = 0;      // membre statique : partagé par tous les objets
  };
  ```

  Une variable statique sans valeur est **mise à zéro**, contrairement à une locale ordinaire.

  **La locale statique** garde sa valeur d'un appel à l'autre. Son initialisation est faite **une seule fois**, et
  elle est **sûre face aux threads** depuis C++11. C'est la façon correcte d'écrire un objet unique :

  ```cpp
  Configuration& configuration() {
      static Configuration instance;       // construite au premier appel
      return instance;
  }
  ```

  **Le piège des globales.** L'ordre d'initialisation des variables globales de **fichiers différents** n'est pas
  défini : si l'une se sert de l'autre dans son initialisation, elle peut la trouver non construite. C'est le
  *static initialization order fiasco*. Le remède est la fonction à locale statique ci-dessus.

  **Dynamique.** L'objet vit sur le tas, aussi longtemps que son propriétaire le décide. On le confie à un
  conteneur ou à un pointeur intelligent.

  **De thread.** `thread_local` donne à **chaque thread son propre exemplaire** : pas de partage, donc pas de
  course aux données.

  **`static` a trois sens.** Devant une variable locale : durée statique. Devant un membre de classe : commun à
  tous les objets. Devant une fonction ou une variable globale : visible seulement dans ce fichier.

  **En entretien** : « Automatique : la portée du bloc. Statique : tout le programme, avec les globales, les
  locales `static` initialisées au premier passage, et les membres `static`. Dynamique : ce que `new` crée, tenu
  par un propriétaire. `thread_local` : un exemplaire par thread. »
cards:
  - key: quatre
    format: course
    question: "Quelle est la durée de stockage d'une variable locale ordinaire ?"
    choices:
      - {text: "Automatique : elle est détruite à la fin de son bloc", correct: true}
      - {text: "Statique : elle est détruite à la fin du programme", correct: false}
      - {text: "Dynamique : elle est détruite par `delete`", correct: false}
      - {text: "De thread : elle est détruite à la fin du thread", correct: false}
    answer: "Une locale vit sur la pile, de sa déclaration à l'accolade fermante de son bloc."
  - key: locale-statique
    format: course
    question: "Quand une variable locale déclarée `static` est-elle initialisée ?"
    choices:
      - {text: "Une seule fois, au premier passage de l'exécution sur sa déclaration", correct: true}
      - {text: "À chaque appel de la fonction, comme une locale ordinaire", correct: false}
      - {text: "Au démarrage du programme, avant l'appel de `main`", correct: false}
      - {text: "À la compilation, que sa valeur soit constante ou non", correct: false}
    answer: "Elle garde ensuite sa valeur d'un appel à l'autre, et n'est détruite qu'à la fin du programme. Depuis C++11, cette initialisation est sûre face aux threads."
  - key: ordre-globales
    format: course
    question: "Quel est le danger des variables globales réparties dans plusieurs fichiers source ?"
    choices:
      - {text: "Leur ordre d'initialisation d'un fichier à l'autre n'est pas défini", correct: true}
      - {text: "Elles sont copiées dans chaque fichier qui les utilise", correct: false}
      - {text: "Elles sont détruites avant le début de `main`", correct: false}
      - {text: "Elles ne peuvent pas être lues depuis une fonction", correct: false}
    answer: "Une globale qui en utilise une autre pendant son initialisation peut la trouver pas encore construite. On la remplace par une fonction qui renvoie une locale statique."
  - key: thread-local
    format: course
    question: "Que garantit le mot-clé `thread_local` devant une variable ?"
    choices:
      - {text: "Chaque thread a son propre exemplaire de la variable", correct: true}
      - {text: "Tous les threads partagent la variable, sous un verrou", correct: false}
      - {text: "Un seul thread à la fois peut lire la variable", correct: false}
      - {text: "La variable est détruite à la fin de chaque fonction", correct: false}
    answer: "Rien n'est partagé : il n'y a donc pas de course aux données. L'exemplaire d'un thread est détruit quand ce thread se termine."
  - key: vf-zero
    format: true-false
    question: "Une variable globale `int` déclarée sans valeur vaut 0."
    truth: true
    answer: "Les objets de durée statique sont mis à zéro avant toute autre initialisation. Une locale ordinaire, elle, a une valeur quelconque."
  - key: vf-locale-statique
    format: true-false
    question: "Une variable locale `static` est réinitialisée à chaque appel de la fonction."
    truth: false
    answer: "Son initialisation n'a lieu qu'une fois. Elle conserve ensuite sa valeur entre les appels."
  - key: vf-dynamique
    format: true-false
    question: "Un objet créé par `new` est détruit à la fin du bloc où il a été créé."
    truth: false
    answer: "Il vit jusqu'à son `delete`. Seul le pointeur local disparaît à la fin du bloc : sans propriétaire, l'objet fuit."
  - key: vf-membre-statique
    format: true-false
    question: "Un membre de classe déclaré `static` existe en un seul exemplaire, partagé par tous les objets."
    truth: true
    answer: "Il n'appartient pas à un objet, mais à la classe. On y accède par `Classe::membre`."
  - key: qcm-compteur
    format: multiple-choice
    question: "Quelle déclaration, dans une fonction, garde un compteur d'un appel à l'autre ?"
    choices:
      - {text: "`static int compteur = 0;`", correct: true}
      - {text: "`int compteur = 0;`", correct: false}
      - {text: "`const int compteur = 0;`", correct: false}
      - {text: "`auto compteur = new int{0};`", correct: false}
    answer: "La locale statique n'est initialisée qu'une fois. Une locale ordinaire repartirait de 0 à chaque appel, et le `new` fuirait."
  - key: qcm-duree
    format: multiple-choice
    question: "Quelle est la durée de stockage de l'entier créé par `std::make_unique<int>(5)` ?"
    choices:
      - {text: "Dynamique", correct: true}
      - {text: "Automatique", correct: false}
      - {text: "Statique", correct: false}
      - {text: "De thread", correct: false}
    answer: "L'entier vit sur le tas. Le `std::unique_ptr` qui le tient, lui, est une locale de durée automatique : sa destruction libère l'entier."
  - key: qcm-fin
    format: multiple-choice
    question: "Quand une variable globale est-elle détruite ?"
    choices:
      - {text: "À la fin du programme, après le retour de `main`", correct: true}
      - {text: "À la fin de la première fonction qui l'utilise", correct: false}
      - {text: "Dès que plus aucune fonction ne la lit", correct: false}
      - {text: "Jamais : son destructeur n'est pas appelé", correct: false}
    answer: "Les objets de durée statique sont détruits après `main`, dans l'ordre inverse de leur construction."
  - key: qcm-static-fichier
    format: multiple-choice
    question: "Que signifie `static` devant une fonction définie hors de toute classe ?"
    choices:
      - {text: "Qu'elle n'est visible que dans son fichier source", correct: true}
      - {text: "Qu'elle garde ses variables locales entre deux appels", correct: false}
      - {text: "Qu'elle est exécutée avant la fonction `main`", correct: false}
      - {text: "Qu'elle ne peut pas être appelée plus d'une fois", correct: false}
    answer: "C'est le troisième sens de `static` : la liaison interne. Un espace de noms anonyme fait la même chose en C++ moderne."
  - key: situation-singleton
    format: scenario
    question: |-
      Un journal global `Journal journal;` est défini dans `journal.cpp`. Une autre globale, dans `service.cpp`,
      écrit dans le journal depuis son constructeur, et le programme plante parfois avant `main`. Que proposes-tu ?
    choices:
      - {text: "Une fonction `journal()` qui renvoie une référence vers une locale `static`", correct: true}
      - {text: "La déclaration du journal avec `thread_local`, pour qu'il soit construit plus tôt", correct: false}
      - {text: "L'allocation du journal avec `new` dans `main`, puis un `delete` à la fin", correct: false}
      - {text: "Le déplacement des deux globales en tête de leur fichier source", correct: false}
    answer: |-
      L'ordre d'initialisation des globales de deux fichiers n'est pas défini : le service peut être construit avant
      le journal. Une locale statique est construite au premier appel de la fonction : elle existe forcément quand on
      s'en sert.
  - key: situation-adresse-locale
    format: scenario
    question: |-
      Une fonction renvoie `const char*` vers un tableau local `char tampon[64]` qu'elle vient de remplir. Le texte
      reçu par l'appelant est parfois illisible. Un collègue propose de déclarer le tampon `static`. Qu'en
      penses-tu ?
    choices:
      - {text: "Cela marche, mais tous les appels partagent le tampon : mieux vaut renvoyer une `std::string`", correct: true}
      - {text: "Cela ne change rien : un tableau `static` est détruit lui aussi à la fin de la fonction", correct: false}
      - {text: "C'est la bonne solution, sans aucun inconvénient, même avec plusieurs threads", correct: false}
      - {text: "C'est interdit : un tableau ne peut pas avoir une durée de stockage statique", correct: false}
    answer: |-
      Le tampon automatique est détruit au retour : le pointeur est pendant. En `static`, il survit, mais il n'y en
      a qu'un : le deuxième appel écrase le résultat du premier, et deux threads se marchent dessus. Une
      `std::string` renvoyée par valeur appartient à l'appelant.
  - key: situation-thread-local
    format: scenario
    question: |-
      Une fonction de formatage utilise un tampon `static` pour éviter des allocations. Appelée depuis plusieurs
      threads, elle produit des textes mélangés. Tu veux garder un tampon réutilisé, sans verrou. Que proposes-tu ?
    choices:
      - {text: "Déclarer le tampon `thread_local` : chaque thread a le sien", correct: true}
      - {text: "Déclarer le tampon `const` : il ne pourra plus être mélangé", correct: false}
      - {text: "Déclarer le tampon `volatile` : les threads se synchroniseront", correct: false}
      - {text: "Déclarer le tampon `extern` : il sera défini ailleurs", correct: false}
    answer: |-
      Un `static` est partagé par tous les threads : c'est une course aux données. `thread_local` garde la durée
      longue, mais donne un exemplaire par thread. Rien n'est partagé, donc rien n'est à synchroniser.
  - key: situation-etat-cache
    format: scenario
    question: |-
      Une fonction `prochain_identifiant()` utilise une locale `static int` comme compteur. Ses tests unitaires
      passent seuls, et échouent quand on les lance tous ensemble. Pourquoi ?
    choices:
      - {text: "Le compteur garde sa valeur d'un test à l'autre : c'est un état global caché", correct: true}
      - {text: "Le compteur est remis à zéro à chaque appel, ce qui fausse les tests", correct: false}
      - {text: "Le compteur est détruit entre deux tests, et son adresse change", correct: false}
      - {text: "Le compteur est copié dans chaque test, qui a sa propre valeur", correct: false}
    answer: |-
      Une locale statique dure tout le programme : chaque test trouve le compteur là où le précédent l'a laissé. Un
      état qui survit aux appels rend le code dépendant de l'ordre. On le range dans un objet que chaque test crée.
  - key: definition-duree
    format: definition
    question: "Qu'appelle-t-on la durée de stockage d'un objet ?"
    choices:
      - {text: "La règle qui fixe le moment de sa création et celui de sa destruction", correct: true}
      - {text: "Le nombre d'octets qu'il occupe en mémoire, alignement compris", correct: false}
      - {text: "La partie du code source où son nom est visible et utilisable", correct: false}
      - {text: "Le temps que met le programme à le construire", correct: false}
    answer: "Automatique, statique, dynamique ou de thread. Elle ne se confond pas avec la portée, qui concerne la visibilité du nom."
  - key: definition-statique
    format: definition
    question: "Qu'est-ce qu'un objet de durée de stockage statique ?"
    choices:
      - {text: "Un objet qui existe en un seul exemplaire, jusqu'à la fin du programme", correct: true}
      - {text: "Un objet dont la valeur ne peut jamais être modifiée", correct: false}
      - {text: "Un objet créé sur la pile, à chaque appel de fonction", correct: false}
      - {text: "Un objet dont la taille est connue à la compilation", correct: false}
    answer: "Variables globales, locales `static`, membres `static`. « Statique » ne veut pas dire constant : sa valeur peut changer."
  - key: definition-dynamique
    format: definition
    question: "Qu'est-ce qu'un objet de durée de stockage dynamique ?"
    choices:
      - {text: "Un objet créé à la demande sur le tas, détruit quand son propriétaire le décide", correct: true}
      - {text: "Un objet dont le type change pendant l'exécution", correct: false}
      - {text: "Un objet créé au démarrage, et détruit à la fin du programme", correct: false}
      - {text: "Un objet créé à l'entrée d'un bloc, et détruit à sa sortie", correct: false}
    answer: "C'est ce que créent `new`, `std::make_unique` et les conteneurs. Sa vie n'est liée à aucun bloc."
  - key: definition-fiasco
    format: definition
    question: "Qu'appelle-t-on le « static initialization order fiasco » ?"
    choices:
      - {text: "Une globale qui utilise, pendant son initialisation, une globale d'un autre fichier pas encore construite", correct: true}
      - {text: "Une locale statique initialisée deux fois, par deux threads qui appellent la fonction en même temps", correct: false}
      - {text: "Une variable statique détruite avant la fin de la fonction qui l'a déclarée", correct: false}
      - {text: "Une variable statique dont la valeur est remise à zéro à chaque appel", correct: false}
    answer: "L'ordre d'initialisation entre unités de traduction n'est pas défini. Depuis C++11, une locale statique, elle, est initialisée une seule fois, même avec plusieurs threads."
  - key: code-locale-statique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int suivant() {
          static int numero = 0;
          int appels = 0;
          ++numero;
          ++appels;
          return numero * 10 + appels;
      }

      int main() {
          suivant();
          suivant();
          std::println("{}", suivant());
      }
      ```
    choices:
      - {text: "`31`", correct: true}
      - {text: "`11`", correct: false}
      - {text: "`33`", correct: false}
      - {text: "`13`", correct: false}
    answer: "`31` : `numero`, statique, garde sa valeur et atteint 3 au troisième appel. `appels`, automatique, repart de 0 à chaque fois et vaut 1."
    check:
      output: "31"
  - key: code-ordre-destruction
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Trace {
          char nom;
          ~Trace() { std::print(" {}", nom); }
      };

      Trace globale{'g'};

      int main() {
          std::print("début");
          Trace a{'a'};
          {
              Trace b{'b'};
          }
          std::print(" fin");
      }
      ```
    choices:
      - {text: "`début b fin a g`", correct: true}
      - {text: "`début b a fin g`", correct: false}
      - {text: "`début g b fin a`", correct: false}
      - {text: "`début fin b a g`", correct: false}
    answer: "`début b fin a g` : `b` meurt à la fin de son bloc, `a` à la fin de `main`, et la globale après `main`."
    check:
      output: "début b fin a g"
  - key: code-membre-statique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Session {
          static inline int ouvertes = 0;
          Session() { ++ouvertes; }
          ~Session() { --ouvertes; }
      };

      int main() {
          Session a;
          {
              Session b;
              Session c;
              std::print("{} ", Session::ouvertes);
          }
          std::println("{}", Session::ouvertes);
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 0`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`3 1` : le compteur est partagé par tous les objets. Trois sessions existent dans le bloc ; à sa sortie, `b` et `c` sont détruites."
    check:
      output: "3 1"
  - key: code-globale-zero
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int compteur;

      void incrementer() {
          static int pas;
          ++pas;
          compteur += pas;
      }

      int main() {
          incrementer();
          incrementer();
          incrementer();
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "Une valeur imprévisible", correct: false}
      - {text: "`9`", correct: false}
    answer: "`6` : les variables de durée statique, globale comme locale `static`, sont mises à zéro. `pas` vaut 1, 2, puis 3 : 1 + 2 + 3."
    check:
      output: "6"
