      `Garde{};` crée un temporaire sans nom, détruit à la fin de la ligne. La ressource est relâchée avant le
      travail qu'elle devait protéger.
    check:
      output: |-
        acquis
        libéré
        travail
  - key: bug-liberation-manuelle
    format: bug-fix
    question: |-
      Quand la valeur est négative, ce programme n'affiche jamais `fermeture`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void ouvrir() { std::println("ouverture"); }
      void fermer() { std::println("fermeture"); }

      void enregistrer(int valeur) {
          ouvrir();
          if (valeur < 0) {
              return;
          }
          std::println("{}", valeur);
          fermer();
      }

      int main() {
          enregistrer(-1);
      }
      ```
    choices:
      - {text: "Confier l'ouverture et la fermeture au constructeur et au destructeur d'une classe", correct: true}
      - {text: "Déplacer l'appel `fermer();` avant l'appel `ouvrir();`, en tête de fonction", correct: false}
      - {text: "Remplacer `return;` par `break;`, pour atteindre la fin de la fonction", correct: false}
      - {text: "Appeler `fermer();` deux fois à la fin, pour rattraper l'appel manqué", correct: false}
    answer: |-
      ```cpp
      class Fichier {
      public:
          Fichier() { ouvrir(); }
          ~Fichier() { fermer(); }
      };

      void enregistrer(int valeur) {
          Fichier fichier;
          if (valeur < 0) {
              return;
          }
          std::println("{}", valeur);
      }
      ```
      Le `return` anticipé saute la fermeture écrite à la main. Avec un objet RAII, elle est dans le destructeur, que
      toute sortie déclenche.
  - key: bug-copie
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : donnees_{new int[taille]} {}
          ~Tampon() { delete[] donnees_; }

      private:
          int* donnees_;
      };

      int main() {
          Tampon a{10};
          Tampon b = a;
          std::println("copie faite");
      }
      ```
    choices:
      - {text: "Interdire la copie : `Tampon(const Tampon&) = delete;`", correct: true}
      - {text: "Retirer le destructeur de la classe `Tampon`", correct: false}
      - {text: "Déclarer `b` avant `a` dans la fonction `main`", correct: false}
      - {text: "Remplacer `delete[]` par `delete` dans le destructeur", correct: false}
    answer: |-
      ```cpp
      Tampon(const Tampon&) = delete;
      Tampon& operator=(const Tampon&) = delete;
      ```
      La copie générée duplique le pointeur : `a` et `b` libèrent tous deux le même tableau. Interdite, la ligne
      `Tampon b = a;` ne compile plus. Retirer le destructeur échangerait le plantage contre une fuite.
  - key: bug-garde-sans-nom
    format: bug-fix
    question: |-
      La section devrait être protégée pendant tout le travail. Le programme affiche pourtant `déverrouillé` avant
      `travail`. Pourquoi ?
      ```cpp
      #include <print>

      class Garde {
      public:
          Garde() { std::println("verrouillé"); }
          ~Garde() { std::println("déverrouillé"); }
      };

      int main() {
          Garde{};
          std::println("travail");
      }
      ```
    choices:
      - {text: "`Garde{};` crée un temporaire sans nom, détruit à la fin de la ligne", correct: true}
      - {text: "Un destructeur s'exécute toujours juste après son constructeur", correct: false}
      - {text: "Les accolades vides appellent le destructeur à la place du constructeur", correct: false}
      - {text: "`std::println` détruit les objets déclarés avant lui", correct: false}
    answer: |-
      ```cpp
      Garde garde;
      std::println("travail");
      ```
      Sans nom, l'objet ne vit que le temps de son instruction. Nommé, il vit jusqu'à la fin du bloc, et protège le
      travail.
  - key: bug-pointeur-membre-sans-destructeur
    format: bug-fix
    question: |-
      Chaque appel de `traiter` fait fuir 4 000 octets. Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : donnees_{new int[taille]} {}
          int* donnees() { return donnees_; }

      private:
          int* donnees_;
      };

      void traiter() {
          Tampon tampon{1000};
          tampon.donnees()[0] = 42;
          std::println("{}", tampon.donnees()[0]);
      }

      int main() {
          traiter();
      }
      ```
    choices:
      - {text: "Remplacer le membre par un `std::vector<int>`, qui se libère seul", correct: true}
      - {text: "Appeler `delete[] tampon;` à la fin de la fonction `traiter`", correct: false}
      - {text: "Déclarer `tampon` avec le mot-clé `static`", correct: false}
      - {text: "Renvoyer `donnees_` par référence constante", correct: false}
    answer: |-
      ```cpp
      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : donnees_(taille) {}
          int* donnees() { return donnees_.data(); }

      private:
          std::vector<int> donnees_;
      };
      ```
      Le constructeur alloue, et personne ne libère. Un destructeur avec `delete[]` corrigerait la fuite, mais il
      faudrait aussi gérer la copie. Un membre `std::vector` règle les deux.
  - key: situation-exceptions
    format: scenario
    question: |-
      Une fonction prend un verrou, appelle trois traitements qui peuvent lever une exception, puis relâche le
      verrou. Quand une exception passe, le verrou reste pris et le programme se bloque. Que proposes-tu ?
    choices:
      - {text: "Prendre le verrou par un `std::lock_guard`, relâché par son destructeur", correct: true}
      - {text: "Entourer chaque traitement d'un `try`, et relâcher dans chaque `catch`", correct: false}
      - {text: "Interdire aux trois traitements de lever des exceptions", correct: false}
      - {text: "Relâcher le verrou avant les traitements, puis le reprendre après", correct: false}
    answer: |-
      Une exception détruit les variables locales en remontant : le destructeur de la garde relâche le verrou, sans
      aucun `catch`. Répéter le déverrouillage dans chaque `catch` marche, jusqu'au jour où quelqu'un en oublie un.
  - key: situation-relecture
    format: scenario
    question: |-
      En relecture, tu vois une classe qui garde un `FILE*` ouvert par son constructeur, sans destructeur. L'auteur
      explique que « l'appelant appellera `fermer()` ». Que demandes-tu ?
    choices:
      - {text: "Que le destructeur ferme le fichier, pour que l'oubli devienne impossible", correct: true}
      - {text: "Qu'un commentaire rappelle à l'appelant d'appeler `fermer()`", correct: false}
      - {text: "Que le fichier soit ouvert et fermé à chaque lecture", correct: false}
      - {text: "Que le `FILE*` soit rendu public, pour que l'appelant le ferme lui-même", correct: false}
    answer: |-
      Une ressource dont la libération dépend de la mémoire de l'appelant finit par fuir. Le destructeur la rend à
      coup sûr ; `fermer()` peut rester, pour qui veut fermer plus tôt.
  - key: situation-collegue-java
    format: scenario
    question: |-
      Un collègue venu de Java cherche comment écrire un `finally` en C++, pour fermer une connexion après un bloc
      qui peut lever une exception. Que lui réponds-tu ?
    choices:
      - {text: "Qu'on confie la connexion à un objet local, dont le destructeur la ferme", correct: true}
      - {text: "Qu'on écrit un `catch (...)` qui ferme, puis relance l'exception", correct: false}
      - {text: "Qu'on appelle `finally()` de la bibliothèque standard", correct: false}
      - {text: "Qu'on ne peut pas : une exception laisse toujours la connexion ouverte", correct: false}
    answer: |-
      C++ n'a pas de `finally`, parce que les destructeurs en tiennent lieu : la fermeture est attachée à l'objet,
      pas au bloc. Elle s'applique à tous ses usages, sans être réécrite. Un `catch (...)` qui ferme et relance
      marche, mais c'est le contournement, pas l'idiome.
  - key: situation-ressource-sans-classe
    format: scenario
    question: |-
      Tu utilises une bibliothèque en C, qui donne un « contexte » par `ctx_creer()` et le reprend par
      `ctx_detruire(ctx)`. Comment t'en sers-tu sans risquer une fuite ?
    choices:
      - {text: "Par une petite classe : `ctx_creer` dans le constructeur, `ctx_detruire` dans le destructeur", correct: true}
      - {text: "Par un appel à `ctx_detruire` devant chaque `return` de chaque fonction", correct: false}
      - {text: "Par une variable globale, créée au démarrage et jamais détruite", correct: false}
      - {text: "Par un `std::vector` de contextes, qui les détruit avec `delete`", correct: false}
    answer: |-
      C'est le cas où l'on écrit sa propre classe RAII : une ressource qu'aucune classe standard ne connaît. On peut
      aussi passer `ctx_detruire` comme suppresseur à un `std::unique_ptr`, qui joue alors ce rôle.
