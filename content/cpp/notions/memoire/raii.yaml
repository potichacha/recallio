notion: raii
lesson: |-
  **RAII** (*Resource Acquisition Is Initialization*) est l'idiome central de C++ : une **ressource** est confiée à
  un **objet**. Elle est **acquise dans son constructeur**, et **libérée dans son destructeur**.

  ```cpp
  class Tampon {
  public:
      explicit Tampon(std::size_t taille) : donnees_{new int[taille]} {}   // acquiert
      ~Tampon() { delete[] donnees_; }                                    // libère

      Tampon(const Tampon&) = delete;              // pas de copie : un seul propriétaire
      Tampon& operator=(const Tampon&) = delete;

  private:
      int* donnees_;
  };
  ```

  Le destructeur d'une variable locale est appelé à la fin de son bloc, **quel que soit le chemin de sortie** : fin
  normale, `return` anticipé, exception. La ressource ne peut donc ni fuir, ni être libérée deux fois.

  **Une ressource**, c'est tout ce qu'il faut rendre : de la mémoire, un fichier ouvert, un verrou, une connexion.

  **La bibliothèque standard en est faite.**

  | Ressource | Objet qui la possède |
  |---|---|
  | un tableau sur le tas | `std::vector`, `std::string` |
  | un objet sur le tas | `std::unique_ptr`, `std::shared_ptr` |
  | un fichier | `std::ifstream`, `std::ofstream` |
  | un verrou | `std::lock_guard`, `std::scoped_lock` |

  C++ n'a pas de `finally` : il n'en a pas besoin. Le nettoyage n'est pas écrit à chaque sortie, il est attaché à la
  durée de vie de l'objet.

  **Les pièges.**

  - **Copier** un objet RAII écrit à la main : la copie générée duplique le pointeur, et les deux objets libèrent la
    même ressource. On **interdit la copie**, ou on la définit.
  - **Ne pas nommer** l'objet : `Garde{verrou};` crée un temporaire, détruit à la fin de la ligne. La ressource est
    relâchée aussitôt.

  En pratique, on écrit rarement sa propre classe RAII : on compose avec celles de la bibliothèque.

  **En entretien** : « RAII lie une ressource à la durée de vie d'un objet : acquise à la construction, libérée à la
  destruction, sur tous les chemins, exceptions comprises. C'est pourquoi C++ n'a pas de `finally`. »
cards:
  - key: principe
    format: course
    question: En quoi consiste le RAII ?
    choices:
      - {text: "Acquérir une ressource dans un constructeur, et la libérer dans le destructeur", correct: true}
      - {text: "Allouer toutes les ressources au démarrage, et les libérer à l'arrêt", correct: false}
      - {text: "Libérer chaque ressource à la main, devant chaque `return`", correct: false}
      - {text: "Confier la libération des ressources à un ramasse-miettes", correct: false}
    answer: "La ressource appartient à un objet. Elle vit aussi longtemps que lui : construite avec lui, rendue quand il est détruit."
  - key: tous-les-chemins
    format: course
    question: Pourquoi le RAII protège-t-il des fuites, même en cas d'exception ?
    choices:
      - {text: "Le destructeur d'une variable locale est appelé sur tous les chemins de sortie", correct: true}
      - {text: "Le RAII empêche les fonctions de lever des exceptions", correct: false}
      - {text: "Le compilateur ajoute un `delete` devant chaque `return`", correct: false}
      - {text: "Le système libère la ressource quand le programme ralentit", correct: false}
    answer: "Fin normale, `return` anticipé ou exception : dans tous les cas, les variables locales sont détruites, et leurs destructeurs libèrent."
  - key: pas-de-finally
    format: course
    question: "Pourquoi C++ n'a-t-il pas de bloc `finally`, comme Java ?"
    choices:
      - {text: "Les destructeurs font ce travail : le nettoyage suit la durée de vie des objets", correct: true}
      - {text: "Les exceptions de C++ ne traversent jamais plusieurs fonctions", correct: false}
      - {text: "Le bloc `catch` de C++ s'exécute même sans exception", correct: false}
      - {text: "Les ressources de C++ sont libérées par le système d'exploitation", correct: false}
    answer: "Un `finally` répète le nettoyage à chaque endroit où la ressource est utilisée. Avec le RAII, il est écrit une fois, dans le destructeur, et s'applique partout."
  - key: copie-interdite
    format: course
    question: Pourquoi interdit-on souvent la copie d'une classe RAII écrite à la main ?
    choices:
      - {text: "La copie générée duplique le pointeur : deux objets libéreraient la même ressource", correct: true}
      - {text: "La copie générée alloue une seconde ressource, qui ne serait jamais libérée", correct: false}
      - {text: "La copie générée appelle le destructeur de l'objet d'origine", correct: false}
      - {text: "La copie générée est plus lente que la construction", correct: false}
    answer: "La copie par défaut recopie les membres tels quels. Deux objets tiennent alors le même pointeur, et chacun libère à sa destruction : double libération."
  - key: vf-memoire-seulement
    format: true-false
    question: Le RAII ne concerne que la mémoire allouée avec `new`.
    truth: false
    answer: "Il vaut pour toute ressource à rendre : un fichier, un verrou, une connexion réseau."
  - key: vf-vector
    format: true-false
    question: "`std::vector` applique le RAII : il libère ses éléments dans son destructeur."
    truth: true
    answer: Comme `std::string`, `std::unique_ptr` et les flux de fichiers.
  - key: vf-return-anticipe
    format: true-false
    question: "Un `return` anticipé empêche la libération d'une ressource tenue par un objet local."
    truth: false
    answer: "Le `return` détruit les variables locales : le destructeur de l'objet s'exécute, et libère."
  - key: vf-temporaire
    format: true-false
    question: "`Garde{verrou};`, sans nom de variable, tient le verrou jusqu'à la fin du bloc."
    truth: false
    answer: "C'est un temporaire, détruit à la fin de la ligne : le verrou est relâché aussitôt. Il faut nommer l'objet."
  - key: qcm-verrou
    format: multiple-choice
    question: Quelle classe de la bibliothèque standard prend un verrou à sa construction et le relâche à sa destruction ?
    choices:
      - {text: "`std::lock_guard`", correct: true}
      - {text: "`std::mutex`", correct: false}
      - {text: "`std::thread`", correct: false}
      - {text: "`std::atomic`", correct: false}
    answer: "`std::lock_guard` (ou `std::scoped_lock`) est le RAII du verrou. `std::mutex` est le verrou lui-même, qu'il faudrait sinon verrouiller et déverrouiller à la main."
  - key: qcm-sigle
    format: multiple-choice
    question: "Que signifie le sigle RAII ?"
    choices:
      - {text: "*Resource Acquisition Is Initialization*", correct: true}
      - {text: "*Reference And Iterator Invalidation*", correct: false}
      - {text: "*Runtime Allocation Is Implicit*", correct: false}
      - {text: "*Release After Immediate Initialization*", correct: false}
    answer: "« L'acquisition d'une ressource est une initialisation » : on acquiert en construisant un objet. Le nom oublie la moitié la plus utile, la libération dans le destructeur."
  - key: qcm-fichier
    format: multiple-choice
    question: "Quand un `std::ofstream` local ferme-t-il son fichier ?"
    choices:
      - {text: "À la fin de son bloc, dans son destructeur", correct: true}
      - {text: "Jamais : il faut toujours appeler `close()`", correct: false}
      - {text: "À la fin du programme seulement", correct: false}
      - {text: "Après chaque écriture", correct: false}
    answer: "Le flux possède le fichier : son destructeur le ferme. `close()` existe pour fermer plus tôt, ou pour tester une erreur de fermeture."
  - key: qcm-ecrire-sa-classe
    format: multiple-choice
    question: "En pratique, comment applique-t-on le RAII à un tableau alloué sur le tas ?"
    choices:
      - {text: "En utilisant `std::vector`, qui le fait déjà", correct: true}
      - {text: "En écrivant une classe avec `new[]` et `delete[]` pour chaque tableau", correct: false}
      - {text: "En ajoutant un `delete[]` devant chaque `return`", correct: false}
      - {text: "En déclarant le tableau dans une variable globale", correct: false}
    answer: "Les classes RAII de la bibliothèque couvrent presque tous les besoins. On n'écrit la sienne que pour une ressource qu'aucune ne gère."
  - key: trous-destructeur
    format: fill-in
    question: |-
      Complète le destructeur pour qu'il libère le tableau :
      ```cpp
      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : donnees_{new int[taille]} {}
          ~Tampon() { ___[] donnees_; }

      private:
          int* donnees_;
      };
      ```
    blanks:
      - [delete]
    answer: "`delete[] donnees_;` : le destructeur rend ce que le constructeur a acquis."
  - key: trous-copie-interdite
    format: fill-in
    question: |-
      Complète pour interdire la copie de la classe :
      ```cpp
      Tampon(const Tampon&) = ___;
      Tampon& operator=(const Tampon&) = ___;
      ```
    blanks:
      - [delete]
      - [delete]
    answer: "`= delete` interdit la copie : un seul objet possède la ressource."
  - key: trous-lock-guard
    format: fill-in
    question: |-
      Complète avec la classe qui relâche le verrou à la fin du bloc :
      ```cpp
      std::mutex verrou;

      void incrementer() {
          std::___<std::mutex> garde{verrou};
          ++compteur;
      }
      ```
    blanks:
      - [lock_guard, scoped_lock, unique_lock]
    answer: "`std::lock_guard<std::mutex> garde{verrou};` verrouille à la construction, et déverrouille à la destruction."
  - key: trous-nom-de-l-objet
    format: fill-in
    question: |-
      Complète pour que la garde vive jusqu'à la fin du bloc, et non jusqu'à la fin de la ligne :
      ```cpp
      {
          Garde ___{verrou};
          travailler();
      }
      ```
    blanks:
      - [garde, g]
    answer: "Un objet RAII doit avoir un nom : sans lui, c'est un temporaire, détruit aussitôt."
  - key: code-acquisition-liberation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Garde {
      public:
          Garde() { std::println("acquis"); }
          ~Garde() { std::println("libéré"); }
      };

      int main() {
          Garde garde;
          std::println("travail");
      }
      ```
    choices:
      - text: |-
          ```
          acquis
          travail
          libéré
          ```
        correct: true
      - text: |-
          ```
          acquis
          libéré
          travail
          ```
        correct: false
      - text: |-
          ```
          acquis
          travail
          ```
        correct: false
      - text: |-
          ```
          travail
          acquis
          libéré
          ```
        correct: false
    answer: |-
      ```
      acquis
      travail
      libéré
      ```
      Le constructeur s'exécute à la déclaration, le destructeur à la fin du bloc, sans qu'on l'appelle.
    check:
      output: |-
        acquis
        travail
        libéré
  - key: code-exception
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>

      class Garde {
      public:
          Garde() { std::println("acquis"); }
          ~Garde() { std::println("libéré"); }
      };

      void traiter() {
          Garde garde;
          throw std::runtime_error("échec");
      }

      int main() {
          try {
              traiter();
          } catch (const std::runtime_error&) {
              std::println("rattrapée");
          }
      }
      ```
    choices:
      - text: |-
          ```
          acquis
          libéré
          rattrapée
          ```
        correct: true
      - text: |-
          ```
          acquis
          rattrapée
          libéré
          ```
        correct: false
      - text: |-
          ```
          acquis
          rattrapée
          ```
        correct: false
      - text: |-
          ```
          rattrapée
          ```
        correct: false
    answer: |-
      ```
      acquis
      libéré
      rattrapée
      ```
      L'exception fait quitter `traiter` : `garde` est détruite en chemin, avant que le `catch` s'exécute. La
      ressource est libérée sans une ligne de nettoyage.
    check:
      output: |-
        acquis
        libéré
        rattrapée
  - key: code-return-anticipe
