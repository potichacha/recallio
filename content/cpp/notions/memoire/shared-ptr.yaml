notion: shared-ptr
lesson: |-
  **`std::shared_ptr<T>`**, dans `<memory>`, est un pointeur intelligent à **propriété partagée** : plusieurs
  `std::shared_ptr` peuvent posséder le même objet, qui est détruit quand **le dernier** disparaît.

  ```cpp
  auto a = std::make_shared<Config>();   // 1 propriétaire
  auto b = a;                            // 2 propriétaires : la copie est permise
  // l'objet est détruit quand a et b ont tous deux disparu
  ```

  **Le compteur de références.** À côté de l'objet, un **bloc de contrôle** compte les propriétaires. Copier un
  `std::shared_ptr` l'incrémente, en détruire un le décrémente ; à zéro, l'objet est détruit. `use_count()` donne sa
  valeur.

  - On le crée avec **`std::make_shared<T>(arguments)`**, qui alloue l'objet et le bloc de contrôle en une fois.
  - Les copies désignent **le même objet** : le modifier par l'une se voit par les autres.
  - `reset()` fait renoncer un pointeur à sa part de propriété.

  **Ce qu'il coûte.** Un compteur à tenir à jour, de façon atomique pour être sûr entre threads, et un pointeur deux
  fois plus gros. C'est peu, mais ce n'est pas rien : `std::unique_ptr` reste le **choix par défaut**, et
  `std::shared_ptr` se réserve aux cas où plusieurs propriétaires ont **réellement** besoin de garder l'objet en vie.

  Le compteur est sûr entre threads ; l'**objet pointé ne l'est pas** pour autant.

  **Les pièges.**

  - **Deux `std::shared_ptr` construits sur le même pointeur brut** ont deux compteurs distincts : double
    libération. On copie un `std::shared_ptr` existant, on ne repart jamais du pointeur brut.
  - **Les cycles** : si deux objets se possèdent l'un l'autre par `std::shared_ptr`, leurs compteurs ne tombent
    jamais à zéro. Ils fuient. On casse le cycle avec un **`std::weak_ptr`**, qui observe sans posséder.
  - Le passer **par valeur** partout : chaque copie touche le compteur. Une fonction qui se sert seulement de l'objet
    prend une référence vers lui.

  **En entretien** : « `std::shared_ptr` compte ses propriétaires et détruit l'objet au dernier. Je le réserve à la
  propriété réellement partagée, et je casse les cycles avec `std::weak_ptr`. »
cards:
  - key: propriete-partagee
    format: course
    question: "Quand l'objet d'un `std::shared_ptr` est-il détruit ?"
    choices:
      - {text: "Quand le dernier `std::shared_ptr` qui le possède disparaît", correct: true}
      - {text: "Quand le premier `std::shared_ptr` qui le possède disparaît", correct: false}
      - {text: "Quand un ramasse-miettes constate qu'il ne sert plus", correct: false}
      - {text: "À la fin du programme, avec les variables globales", correct: false}
    answer: "Chaque propriétaire qui disparaît décrémente le compteur. Quand il atteint zéro, l'objet est détruit sur-le-champ, de façon déterministe."
  - key: compteur
    format: course
    question: "Que fait la copie d'un `std::shared_ptr` ?"
    choices:
      - {text: "Elle incrémente le compteur : un propriétaire de plus pour le même objet", correct: true}
      - {text: "Elle copie l'objet : chaque pointeur a le sien", correct: false}
      - {text: "Elle transfère la propriété : l'ancien pointeur devient nul", correct: false}
      - {text: "Elle ne compile pas : la propriété est unique", correct: false}
    answer: "Les deux pointeurs désignent le même objet, et le compteur passe à 2. Le transfert qui laisse la source nulle, c'est le déplacement."
  - key: quand-le-choisir
    format: course
    question: "Quand choisit-on `std::shared_ptr` plutôt que `std::unique_ptr` ?"
    choices:
      - {text: "Quand plusieurs propriétaires doivent réellement garder l'objet en vie", correct: true}
      - {text: "Quand on veut passer l'objet à une fonction qui le lit", correct: false}
      - {text: "Quand l'objet est gros, et coûteux à allouer", correct: false}
      - {text: "Toujours : il fait tout ce que fait `std::unique_ptr`", correct: false}
    answer: "`std::unique_ptr` est le choix par défaut. `std::shared_ptr` paie un compteur, et rend la durée de vie plus difficile à suivre : on le réserve à la vraie propriété partagée."
  - key: cycle
    format: course
    question: "Que se passe-t-il quand deux objets se possèdent l'un l'autre par `std::shared_ptr` ?"
    choices:
      - {text: "Leurs compteurs ne tombent jamais à zéro : ils fuient", correct: true}
      - {text: "Ils sont détruits deux fois : le programme plante", correct: false}
      - {text: "Le compilateur refuse le cycle", correct: false}
      - {text: "Ils sont détruits ensemble, dès que le premier disparaît", correct: false}
    answer: "Chacun garde l'autre en vie. Même sans plus aucun pointeur extérieur, les compteurs restent à 1. On remplace un des deux liens par un `std::weak_ptr`."
  - key: vf-copie
    format: true-false
    question: "Un `std::shared_ptr` peut être copié."
    truth: true
    answer: C'est ce qui le distingue de `std::unique_ptr`. Chaque copie est un propriétaire de plus.
  - key: vf-copie-independante
    format: true-false
    question: "Après `auto b = a;`, modifier l'objet par `b` ne se voit pas par `a`."
    truth: false
    answer: "`a` et `b` désignent le même objet. Pour un objet indépendant, on en crée un nouveau : `std::make_shared<T>(*a)`."
  - key: vf-thread-safe
    format: true-false
    question: "Le compteur d'un `std::shared_ptr` est sûr entre threads, mais pas l'objet pointé."
    truth: true
    answer: Le compteur est mis à jour de façon atomique. Les accès à l'objet lui-même doivent être protégés comme pour n'importe quel objet partagé.
  - key: vf-gratuit
    format: true-false
    question: "Un `std::shared_ptr` ne coûte rien de plus qu'un `std::unique_ptr`."
    truth: false
    answer: Il porte un bloc de contrôle et un compteur atomique, mis à jour à chaque copie et à chaque destruction.
  - key: qcm-creer
    format: multiple-choice
    question: "Quelle ligne crée un `std::shared_ptr` vers un entier qui vaut 5 ?"
    choices:
      - {text: "`auto p = std::make_shared<int>(5);`", correct: true}
      - {text: "`auto p = std::shared<int>(5);`", correct: false}
      - {text: "`std::shared_ptr<int> p = 5;`", correct: false}
      - {text: "`std::shared_ptr<int> p = &5;`", correct: false}
    answer: "`std::make_shared<int>(5)` alloue en une fois l'entier et son bloc de contrôle."
  - key: qcm-use-count
    format: multiple-choice
    question: "Quelle fonction donne le nombre de propriétaires de l'objet ?"
    choices:
      - {text: "`use_count()`", correct: true}
      - {text: "`size()`", correct: false}
      - {text: "`owners()`", correct: false}
      - {text: "`count()`", correct: false}
    answer: "`p.use_count()`. Utile pour comprendre et pour déboguer ; un programme ne devrait pas décider d'après elle."
  - key: qcm-casser-un-cycle
    format: multiple-choice
    question: "Quel type de pointeur observe un objet partagé sans le posséder, et casse un cycle ?"
    choices:
      - {text: "`std::weak_ptr`", correct: true}
      - {text: "`std::unique_ptr`", correct: false}
      - {text: "`std::auto_ptr`", correct: false}
      - {text: "`std::shared_ptr`", correct: false}
    answer: "Un `std::weak_ptr` ne compte pas comme propriétaire. Pour utiliser l'objet, on lui demande un `std::shared_ptr` avec `lock()`, qui est nul si l'objet a disparu."
  - key: qcm-parametre
    format: multiple-choice
    question: "Une fonction lit une `Config` possédée par un `std::shared_ptr`. Quel paramètre lui donnes-tu ?"
    choices:
      - {text: "`const Config& config`", correct: true}
      - {text: "`std::shared_ptr<Config> config`", correct: false}
      - {text: "`std::shared_ptr<Config>* config`", correct: false}
      - {text: "`Config config`", correct: false}
    answer: "La fonction se sert de l'objet le temps de l'appel : elle n'a pas à en devenir propriétaire. Par valeur, le `std::shared_ptr` toucherait le compteur à chaque appel."
  - key: trous-make-shared
    format: fill-in
    question: |-
      Complète pour créer un objet à propriété partagée :
      ```cpp
      auto config = std::___<Config>();
      ```
    blanks:
      - [make_shared]
    answer: "`std::make_shared<Config>()` renvoie un `std::shared_ptr<Config>`."
  - key: trous-use-count
    format: fill-in
    question: |-
      Complète pour afficher le nombre de propriétaires :
      ```cpp
      auto a = std::make_shared<int>(5);
      auto b = a;
      std::println("{}", a.___());   // affiche 2
      ```
    blanks:
      - [use_count]
    answer: "`use_count()` renvoie la valeur du compteur de références."
  - key: trous-weak-ptr
    format: fill-in
    question: |-
      Complète pour que l'enfant observe son parent sans le posséder :
      ```cpp
      struct Noeud {
          std::shared_ptr<Noeud> enfant;
          std::___<Noeud> parent;
      };
      ```
    blanks:
      - [weak_ptr]
    answer: "`std::weak_ptr<Noeud> parent;` : le lien vers le parent ne compte pas, le cycle est cassé."
  - key: trous-reset
    format: fill-in
    question: |-
      Complète pour que `a` renonce à sa part de propriété :
      ```cpp
      auto a = std::make_shared<int>(5);
      auto b = a;
      a.___();   // b reste seul propriétaire
      ```
    blanks:
      - [reset]
    answer: "`reset()` rend le pointeur nul et décrémente le compteur."
  - key: code-compteur
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto a = std::make_shared<int>(5);
          auto b = a;
          auto c = a;
          std::println("{} {}", a.use_count(), *c);
      }
      ```
    choices:
      - {text: "`3 5`", correct: true}
      - {text: "`1 5`", correct: false}
      - {text: "`2 5`", correct: false}
      - {text: "`3 15`", correct: false}
    answer: "`3 5` : `a`, `b` et `c` possèdent tous trois le même entier. Le compteur est commun."
    check:
      output: "3 5"
  - key: code-portee
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto a = std::make_shared<int>(5);
          {
              auto b = a;
              std::println("{}", a.use_count());
          }
          std::println("{}", a.use_count());
      }
      ```
    choices:
      - text: |-
          ```
          2
          1
          ```
        correct: true
      - text: |-
          ```
          2
          2
          ```
        correct: false
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - text: |-
          ```
          2
          0
          ```
        correct: false
    answer: |-
      ```
      2
      1
      ```
      Dans le bloc, `b` est un second propriétaire. À sa destruction, le compteur redescend ; l'entier reste en vie,
      possédé par `a`.
    check:
      output: |-
        2
        1
  - key: code-dernier-proprietaire
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      class Trace {
      public:
          ~Trace() { std::println("destruction"); }
      };

      int main() {
          auto a = std::make_shared<Trace>();
          auto b = a;
          a.reset();
          std::println("a renonce");
          b.reset();
          std::println("b renonce");
      }
      ```
    choices:
      - text: |-
          ```
          a renonce
          destruction
          b renonce
          ```
        correct: true
      - text: |-
          ```
          destruction
          a renonce
          b renonce
          ```
        correct: false
      - text: |-
          ```
          a renonce
          b renonce
          destruction
          ```
        correct: false
      - text: |-
          ```
          destruction
          a renonce
          destruction
          b renonce
          ```
        correct: false
    answer: |-
      ```
      a renonce
      destruction
      b renonce
      ```
      Quand `a` renonce, `b` possède encore l'objet. Il n'est détruit qu'au renoncement du dernier propriétaire.
    check:
      output: |-
        a renonce
        destruction
        b renonce
  - key: code-meme-objet
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto a = std::make_shared<int>(5);
          auto b = a;
          *b = 9;
          auto c = std::make_shared<int>(*a);
          *c = 1;
          std::println("{} {} {}", *a, *b, *c);
      }
      ```
    choices:
      - {text: "`9 9 1`", correct: true}
      - {text: "`5 9 1`", correct: false}
      - {text: "`1 1 1`", correct: false}
      - {text: "`9 9 9`", correct: false}
    answer: "`9 9 1` : `a` et `b` partagent le même entier. `c` en possède un autre, créé par `std::make_shared` à partir de la valeur de `*a`."
    check:
      output: "9 9 1"
  - key: bug-deux-compteurs
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          int* brut = new int{5};
          std::shared_ptr<int> a{brut};
          std::shared_ptr<int> b{brut};
          std::println("{} {}", a.use_count(), b.use_count());
      }
      ```
    choices:
      - {text: "Créer `a` avec `std::make_shared`, puis copier : `auto b = a;`", correct: true}
      - {text: "Ajouter `delete brut;` à la fin de la fonction `main`", correct: false}
      - {text: "Appeler `a.reset();` avant la fin de la fonction `main`", correct: false}
      - {text: "Déclarer `brut` avec `const int*` à la place d'`int*`", correct: false}
    answer: |-
      ```cpp
      auto a = std::make_shared<int>(5);
      auto b = a;
      ```
      Construits chacun sur le pointeur brut, `a` et `b` ont deux compteurs séparés, chacun à 1 : chacun libère. La
      propriété ne se partage qu'en copiant un `std::shared_ptr` existant.
  - key: bug-cycle
    format: bug-fix
    question: |-
      Ce programme n'affiche jamais `destruction` : les deux nœuds fuient. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      struct Noeud {
          std::shared_ptr<Noeud> autre;
          ~Noeud() { std::println("destruction"); }
      };

      int main() {
          auto a = std::make_shared<Noeud>();
          auto b = std::make_shared<Noeud>();
          a->autre = b;
          b->autre = a;
      }
      ```
    choices:
      - {text: "Faire d'un des deux liens un `std::weak_ptr<Noeud>`", correct: true}
      - {text: "Faire des deux liens des `std::unique_ptr<Noeud>`", correct: false}
      - {text: "Appeler `delete a.get();` à la fin de `main`", correct: false}
      - {text: "Créer les deux nœuds avec `new` plutôt qu'avec `std::make_shared`", correct: false}
    answer: |-
      ```cpp
      struct Noeud {
          std::weak_ptr<Noeud> autre;
          ~Noeud() { std::println("destruction"); }
      };
      ```
      Chaque nœud possède l'autre : à la fin de `main`, les deux compteurs restent à 1. Un `std::weak_ptr` observe
      sans compter, et les nœuds sont détruits.
  - key: bug-variable-locale
    format: bug-fix
    question: |-
      Ce programme affiche `10`, puis plante à la fin de `main` (« Segmentation fault »). Pourquoi ?
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          int score = 10;
          std::shared_ptr<int> p{&score};
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "`p` tente de libérer une variable locale, qui n'a pas été allouée avec `new`", correct: true}
      - {text: "`p` détruit `score` avant que `std::println` l'ait affichée", correct: false}
      - {text: "Un `std::shared_ptr` ne peut pas pointer sur un `int`", correct: false}
      - {text: "`score` a déjà un propriétaire, la fonction `main`", correct: false}
    answer: |-
      ```cpp
      auto p = std::make_shared<int>(10);
      ```
      Un pointeur intelligent libère ce qu'il possède avec `delete`. Lui confier l'adresse d'une variable de la pile
      lui fait libérer une mémoire qui n'appartient pas au tas.
  - key: bug-copie-attendue
    format: bug-fix
    question: |-
      L'auteur voulait un brouillon indépendant de l'original. Le programme affiche `0 0` au lieu de `100 0`. Quelle
      correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto original = std::make_shared<int>(100);
          auto brouillon = original;
          *brouillon = 0;
          std::println("{} {}", *original, *brouillon);
      }
      ```
    choices:
      - {text: "Écrire `auto brouillon = std::make_shared<int>(*original);`", correct: true}
      - {text: "Écrire `auto brouillon = std::move(original);`", correct: false}
      - {text: "Écrire `auto brouillon = original.get();`", correct: false}
      - {text: "Écrire `const auto brouillon = original;`", correct: false}
    answer: |-
      ```cpp
      auto brouillon = std::make_shared<int>(*original);
      ```
      Copier un `std::shared_ptr` partage l'objet, il ne le duplique pas. Pour un second entier, il faut en créer un,
      initialisé avec la valeur du premier.
  - key: situation-par-defaut
    format: scenario
    question: |-
      Un collègue utilise `std::shared_ptr` pour tous les objets du tas, « pour être tranquille ». Que lui
      réponds-tu ?
    choices:
      - {text: "Que `std::unique_ptr` est le choix par défaut ; le partage se justifie au cas par cas", correct: true}
      - {text: "Qu'il a raison : `std::shared_ptr` n'a aucun inconvénient", correct: false}
      - {text: "Qu'il vaut mieux des pointeurs bruts, plus rapides que les deux", correct: false}
      - {text: "Qu'il faut ajouter un `delete` après chaque `std::shared_ptr`", correct: false}
    answer: |-
      Partager par habitude cache qui possède quoi : la durée de vie d'un objet dépend alors de tout le programme, et
      les cycles deviennent possibles. Il y a aussi un coût, le compteur atomique. Un propriétaire unique, quand il
      existe, se dit avec `std::unique_ptr`.
  - key: situation-cache
    format: scenario
    question: |-
      Une image chargée depuis le disque est affichée par plusieurs fenêtres, ouvertes et fermées dans n'importe quel
      ordre. Elle doit être libérée quand la dernière fenêtre se ferme. Que choisis-tu ?
    choices:
      - {text: "Un `std::shared_ptr<Image>` dans chaque fenêtre", correct: true}
      - {text: "Un `std::unique_ptr<Image>` dans chaque fenêtre", correct: false}
      - {text: "Un `Image*` dans chaque fenêtre, libéré par la première qui se ferme", correct: false}
      - {text: "Une copie de l'image dans chaque fenêtre", correct: false}
    answer: |-
      Aucune fenêtre ne sait si elle est la dernière : c'est la propriété partagée, que le compteur résout. Un
      `std::unique_ptr` ne peut avoir qu'un propriétaire, et copier l'image gaspillerait la mémoire.
  - key: situation-parent-enfant
    format: scenario
    question: |-
      Dans un arbre, chaque nœud possède ses enfants par `std::shared_ptr`, et chaque enfant garde un
      `std::shared_ptr` vers son parent. L'arbre n'est jamais libéré. Que changes-tu ?
    choices:
      - {text: "Le lien vers le parent devient un `std::weak_ptr`", correct: true}
      - {text: "Le lien vers les enfants devient un pointeur brut, libéré à la main", correct: false}
      - {text: "Chaque nœud appelle `reset()` sur lui-même dans son destructeur", correct: false}
      - {text: "L'arbre est stocké dans une variable globale", correct: false}
    answer: |-
      Parent et enfant se possèdent mutuellement : un cycle. La propriété descend (le parent possède ses enfants), et
      le lien qui remonte se contente d'observer. Le destructeur ne peut pas casser le cycle : il n'est jamais
      appelé.
  - key: situation-performance
    format: scenario
    question: |-
      Le profileur montre que le programme passe beaucoup de temps à incrémenter et décrémenter des compteurs de
      `std::shared_ptr`. Des fonctions de calcul les reçoivent tous par valeur. Que proposes-tu ?
    choices:
      - {text: "Leur passer l'objet par référence constante : elles ne font que s'en servir", correct: true}
      - {text: "Leur passer le pointeur par `std::move`, à chaque appel", correct: false}
      - {text: "Remplacer les `std::shared_ptr` par des `std::weak_ptr` partout", correct: false}
      - {text: "Compiler sans optimisation, pour réduire le coût des compteurs", correct: false}
    answer: |-
      Chaque passage par valeur copie le pointeur : une incrémentation atomique à l'entrée, une décrémentation à la
      sortie. Une fonction qui ne garde pas l'objet n'a pas à en devenir propriétaire : `const T&` suffit.
