notion: pointeurs-fonctions
lesson: |-
  Une fonction a une adresse, comme une variable. Un **pointeur de fonction** range cette adresse : on peut alors
  choisir, à l'exécution, **quelle fonction appeler**.

  ```cpp
  int addition(int a, int b) { return a + b; }
  int produit(int a, int b) { return a * b; }

  int (*operation)(int, int) = addition;
  operation(2, 3);          // 5
  operation = produit;
  operation(2, 3);          // 6
  ```

  **Lire la déclaration.** `int (*operation)(int, int)` : `operation` est un **pointeur** (`*`) vers une fonction
  qui prend deux `int` et renvoie un `int`. Les parenthèses autour de `*operation` sont obligatoires : sans elles,
  `int *operation(int, int)` déclare une **fonction** qui renvoie un `int*`.

  **Un alias rend tout lisible.**

  ```cpp
  using Operation = int (*)(int, int);
  Operation operation = addition;
  ```

  **L'adresse et l'appel.** Le nom d'une fonction se convertit tout seul en pointeur : `addition` et `&addition`
  sont équivalents. De même, `operation(2, 3)` et `(*operation)(2, 3)` font le même appel.

  **Le type doit correspondre exactement.** Mêmes paramètres, même type de retour. Un pointeur
  `int (*)(int, int)` ne reçoit pas une fonction `double f(double, double)`.

  **L'usage : passer un comportement.**

  ```cpp
  void appliquer(std::vector<int>& valeurs, int (*transformation)(int)) {
      for (int& v : valeurs) {
          v = transformation(v);
      }
  }
  ```

  C'est le mécanisme des fonctions de rappel (*callbacks*) du C : `qsort`, les gestionnaires de signaux, les API
  système.

  **Les lambdas.** Une lambda **sans capture** se convertit en pointeur de fonction. Une lambda qui capture ne le
  peut pas : elle transporte un état, qu'un simple pointeur ne sait pas porter.

  ```cpp
  int (*doubler)(int) = [](int x) { return x * 2; };      // correct
  ```

  **Le pointeur nul.** Un pointeur de fonction peut valoir `nullptr`. L'appeler alors est un comportement
  indéfini : on le teste.

  **En C++ moderne.**

  | Besoin | Outil |
  |---|---|
  | Une fonction sans état, une API C | pointeur de fonction |
  | N'importe quel appelable, résolu à la compilation | paramètre template, ou `auto` |
  | N'importe quel appelable, rangé dans une variable ou un membre | `std::function` |

  Un pointeur de fonction est léger (la taille d'un pointeur), mais ne transporte aucun état. Un template accepte
  tout et permet l'intégration de l'appel. `std::function` accepte tout, au prix d'une indirection.

  **En entretien** : « Un pointeur de fonction range l'adresse d'une fonction d'une signature donnée, pour
  l'appeler plus tard : c'est la fonction de rappel du C. Une lambda sans capture s'y convertit. En C++, pour un
  appelable quelconque, je prends un template ou `std::function`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un pointeur de fonction ?"
    choices:
      - {text: "Une variable qui range l'adresse d'une fonction, pour l'appeler plus tard", correct: true}
      - {text: "Une fonction qui renvoie un pointeur vers une variable", correct: false}
      - {text: "Une copie du code de la fonction, rangée sur le tas", correct: false}
      - {text: "Un pointeur vers la valeur de retour d'une fonction", correct: false}
    answer: "Il permet de choisir à l'exécution la fonction à appeler, tant que sa signature correspond."
  - key: declaration
    format: course
    question: "Que déclare `int (*f)(int, int);` ?"
    choices:
      - {text: "Un pointeur vers une fonction qui prend deux `int` et renvoie un `int`", correct: true}
      - {text: "Une fonction qui prend deux `int` et renvoie un pointeur vers un `int`", correct: false}
      - {text: "Un tableau de deux pointeurs vers des `int`", correct: false}
      - {text: "Un pointeur vers un `int`, initialisé avec deux valeurs", correct: false}
    answer: "Les parenthèses autour de `*f` font de `f` un pointeur. Sans elles, `int *f(int, int)` serait une fonction renvoyant `int*`."
  - key: lambda
    format: course
    question: "Quelle lambda se convertit en pointeur de fonction ?"
    choices:
      - {text: "Une lambda qui ne capture rien", correct: true}
      - {text: "Une lambda qui capture par valeur", correct: false}
      - {text: "Une lambda qui capture par référence", correct: false}
      - {text: "N'importe quelle lambda, capture ou non", correct: false}
    answer: "Une lambda qui capture transporte un état, qu'un pointeur de fonction ne peut pas contenir. Pour elle, il faut un template ou `std::function`."
  - key: alternatives
    format: course
    question: "Que choisis-tu pour ranger dans un membre un appelable quelconque, lambda à capture comprise ?"
    choices:
      - {text: "`std::function`", correct: true}
      - {text: "Un pointeur de fonction", correct: false}
      - {text: "Un `void*`", correct: false}
      - {text: "Un `std::any`", correct: false}
    answer: "`std::function<int(int)>` contient tout ce qui s'appelle avec cette signature. Un pointeur de fonction n'accepte que les fonctions sans état."
  - key: vf-esperluette
    format: true-false
    question: "`f = addition;` et `f = &addition;` rangent la même adresse dans le pointeur de fonction `f`."
    truth: true
    answer: "Le nom d'une fonction se convertit implicitement en pointeur vers elle."
  - key: vf-signature
    format: true-false
    question: "Un pointeur `int (*)(int)` peut recevoir l'adresse d'une fonction `double f(double)`."
    truth: false
    answer: "Les types des paramètres et du retour doivent correspondre exactement."
  - key: vf-nul
    format: true-false
    question: "Un pointeur de fonction peut valoir `nullptr`."
    truth: true
    answer: "Comme tout pointeur. L'appeler dans cet état est un comportement indéfini : on le teste avant."
  - key: vf-etat
    format: true-false
    question: "Un pointeur de fonction peut transporter une variable capturée, comme une lambda."
    truth: false
    answer: "Il ne contient qu'une adresse de code. En C, l'état passe par un paramètre `void*` supplémentaire."
  - key: qcm-alias
    format: multiple-choice
    question: "Quel alias nomme le type « pointeur vers une fonction `int(int)` » ?"
    choices:
      - {text: "`using Transformation = int (*)(int);`", correct: true}
      - {text: "`using Transformation = int *(int);`", correct: false}
      - {text: "`using Transformation = *int(int);`", correct: false}
      - {text: "`using Transformation = (int)(*int);`", correct: false}
    answer: "`(*)` marque le pointeur, entre le type de retour et la liste des paramètres."
  - key: qcm-appel
    format: multiple-choice
    question: "`f` est un pointeur de fonction `int (*)(int, int)`. Comment appelle-t-on la fonction désignée ?"
    choices:
      - {text: "`f(2, 3)`", correct: true}
      - {text: "`f->(2, 3)`", correct: false}
      - {text: "`&f(2, 3)`", correct: false}
      - {text: "`f.call(2, 3)`", correct: false}
    answer: "Un pointeur de fonction s'appelle comme une fonction. `(*f)(2, 3)` s'écrit aussi."
  - key: qcm-tableau
    format: multiple-choice
    question: "Quelle déclaration crée un tableau de trois pointeurs de fonction `int(int)` ?"
    choices:
      - {text: "`int (*operations[3])(int);`", correct: true}
      - {text: "`int *operations[3](int);`", correct: false}
      - {text: "`int (*operations)(int)[3];`", correct: false}
      - {text: "`int operations(int)[3];`", correct: false}
    answer: "Les crochets suivent le nom, à l'intérieur des parenthèses. Avec un alias : `std::array<Transformation, 3>`."
  - key: qcm-usage
    format: multiple-choice
    question: "Où rencontre-t-on encore beaucoup de pointeurs de fonction ?"
    choices:
      - {text: "Dans les fonctions de rappel des bibliothèques C", correct: true}
      - {text: "Dans les constructeurs de copie", correct: false}
      - {text: "Dans les boucles sur un intervalle", correct: false}
      - {text: "Dans les gardes d'inclusion", correct: false}
    answer: "`qsort`, les gestionnaires de signaux, les API système : le C n'a pas d'autre moyen de passer un comportement."
  - key: trous-declaration
    format: fill-in
    question: |-
      Complète pour que `operation` soit un pointeur de fonction :
      ```cpp
      int (___operation)(int, int) = addition;
      ```
    blanks:
      - ["*"]
    answer: "`(*operation)` : un pointeur, entre parenthèses."
  - key: trous-using
    format: fill-in
    question: |-
      Complète l'alias du type pointeur de fonction :
      ```cpp
      ___ Operation = int (*)(int, int);
      ```
    blanks:
      - [using]
    answer: "`using` donne un nom au type, bien plus lisible ensuite."
  - key: trous-nullptr
    format: fill-in
    question: |-
      Complète pour n'appeler la fonction de rappel que si elle existe :
      ```cpp
      if (rappel != ___) {
          rappel(42);
      }
      ```
    blanks:
      - [nullptr]
    answer: "Un pointeur de fonction nul ne doit pas être appelé."
  - key: trous-parametre
    format: fill-in
    question: |-
      Complète le paramètre : une fonction qui prend un `int` et renvoie un `int`.
      ```cpp
      void appliquer(std::vector<int>& valeurs, int (*transformation)(___)) {
          for (int& v : valeurs) {
              v = transformation(v);
          }
      }
      ```
    blanks:
      - [int]
    answer: "La liste des paramètres de la fonction désignée : un `int`."
  - key: code-choix
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int addition(int a, int b) { return a + b; }
      int produit(int a, int b) { return a * b; }

      int main() {
          int (*operation)(int, int) = addition;
          const int a = operation(3, 4);
          operation = produit;
          std::println("{} {}", a, operation(3, 4));
      }
      ```
    choices:
      - {text: "`7 12`", correct: true}
      - {text: "`7 7`", correct: false}
      - {text: "`12 12`", correct: false}
      - {text: "`12 7`", correct: false}
    answer: "`7 12` : le même pointeur désigne d'abord `addition`, puis `produit`. L'appel suit la fonction désignée."
    check:
      output: "7 12"
  - key: code-parametre
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int carre(int x) { return x * x; }

      void appliquer(std::vector<int>& valeurs, int (*transformation)(int)) {
          for (int& v : valeurs) {
              v = transformation(v);
          }
      }

      int main() {
          std::vector<int> valeurs{1, 2, 3};
          appliquer(valeurs, carre);
          appliquer(valeurs, [](int x) { return x + 1; });
          std::println("{} {} {}", valeurs[0], valeurs[1], valeurs[2]);
      }
      ```
    choices:
      - {text: "`2 5 10`", correct: true}
      - {text: "`4 9 16`", correct: false}
      - {text: "`1 4 9`", correct: false}
      - {text: "`2 3 4`", correct: false}
    answer: "`2 5 10` : les carrés, 1, 4, 9, puis un de plus. La lambda sans capture se convertit en pointeur de fonction."
    check:
      output: "2 5 10"
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int plus_un(int x) { return x + 1; }
      int fois_deux(int x) { return x * 2; }

      int main() {
          using Etape = int (*)(int);
          const std::array<Etape, 3> etapes{plus_un, fois_deux, plus_un};
          int valeur = 3;
          for (const Etape etape : etapes) {
              valeur = etape(valeur);
          }
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`7`", correct: false}
    answer: "`9` : 3 + 1 = 4, puis 4 × 2 = 8, puis 8 + 1 = 9. Le tableau enchaîne les fonctions."
    check:
      output: "9"
  - key: code-nul
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void notifier(void (*rappel)(int), int valeur) {
          if (rappel != nullptr) {
              rappel(valeur);
          } else {
              std::print("aucun ");
          }
      }

      int main() {
          notifier(nullptr, 1);
          notifier([](int v) { std::print("{} ", v * 10); }, 2);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`aucun 20 fin`", correct: true}
      - {text: "`10 20 fin`", correct: false}
      - {text: "`aucun fin`", correct: false}
      - {text: "`aucun 2 fin`", correct: false}
    answer: "`aucun 20 fin` : le premier appel reçoit un pointeur nul, que la fonction teste. Le second reçoit une lambda sans capture."
    check:
      output: "aucun 20 fin"
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse `int *operation(int, int) = addition;`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int addition(int a, int b) { return a + b; }

      int main() {
          int *operation(int, int) = addition;
          std::println("{}", operation(2, 3));
      }
      ```
    choices:
      - {text: "Écrire `int (*operation)(int, int) = addition;`", correct: true}
      - {text: "Écrire `int operation*(int, int) = addition;`", correct: false}
      - {text: "Écrire `int *(operation(int, int)) = addition;`", correct: false}
      - {text: "Écrire `int &operation(int, int) = addition;`", correct: false}
    answer: |-
      ```cpp
      int (*operation)(int, int) = addition;
      ```
      Sans parenthèses, la ligne déclare une fonction qui renvoie `int*`, et tente de l'initialiser. Les parenthèses
      autour de `*operation` en font un pointeur.
  - key: bug-lambda-capture
    format: bug-fix
    question: |-
      Le compilateur refuse de convertir cette lambda en pointeur de fonction. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int facteur = 3;
          int (*multiplier)(int) = [facteur](int x) { return x * facteur; };
          std::println("{}", multiplier(4));
      }
      ```
    choices:
      - {text: "Déclarer `auto multiplier = [facteur](int x) { return x * facteur; };`", correct: true}
      - {text: "Capturer par référence : `[&facteur](int x)`", correct: false}
      - {text: "Capturer tout par copie : `[=](int x)`", correct: false}
      - {text: "Déclarer `int (&multiplier)(int)` à la place du pointeur", correct: false}
    answer: |-
      ```cpp
      auto multiplier = [facteur](int x) { return x * facteur; };
      ```
      Une lambda qui capture transporte un état : elle ne se convertit pas en pointeur de fonction, quelle que soit
      la forme de la capture. `auto` garde son vrai type ; `std::function<int(int)>` conviendrait aussi.
  - key: bug-signature
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'double (*)(double)' to 'int (*)(int)' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      double moitie(double x) { return x / 2; }

      int main() {
          int (*f)(int) = moitie;
          std::println("{}", f(5));
      }
      ```
    choices:
      - {text: "Déclarer `double (*f)(double) = moitie;`", correct: true}
      - {text: "Déclarer `int (*f)(double) = moitie;`", correct: false}
      - {text: "Écrire `int (*f)(int) = &moitie;`", correct: false}
      - {text: "Écrire `int (*f)(int) = *moitie;`", correct: false}
    answer: |-
      ```cpp
      double (*f)(double) = moitie;
      ```
      Le type du pointeur doit reprendre exactement les paramètres et le retour de la fonction. Aucune conversion
      n'est faite entre signatures.
  - key: bug-appel-nul
    format: bug-fix
    question: |-
      Ce programme plante sur une erreur de segmentation. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      void (*rappel)(int) = nullptr;

      void terminer(int code) {
          rappel(code);
          std::println("terminé");
      }

      int main() {
          terminer(0);
      }
      ```
    choices:
      - {text: "N'appeler `rappel(code)` que si `rappel != nullptr`", correct: true}
      - {text: "Appeler `(*rappel)(code)` à la place de `rappel(code)`", correct: false}
      - {text: "Déclarer `rappel` avec le mot-clé `const`", correct: false}
      - {text: "Entourer l'appel d'un `try` et d'un `catch (...)`", correct: false}
    answer: |-
      ```cpp
      if (rappel != nullptr) {
          rappel(code);
      }
      ```
      Personne n'a enregistré de fonction de rappel : le pointeur est nul. L'appeler est un comportement indéfini,
      qu'un `catch` n'attrape pas.
