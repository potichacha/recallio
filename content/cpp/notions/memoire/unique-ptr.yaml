notion: unique-ptr
lesson: |-
  **`std::unique_ptr<T>`**, dans `<memory>`, est un pointeur intelligent qui **possède seul** un objet du tas. Quand
  il est détruit, il **détruit l'objet**. C'est le RAII appliqué à `new` et `delete`.

  ```cpp
  auto compte = std::make_unique<Compte>("Ada", 100);   // alloue et construit
  compte->deposer(50);                                  // s'utilise comme un pointeur
  // à la fin du bloc : l'objet est détruit, sans delete
  ```

  - On le crée avec **`std::make_unique<T>(arguments)`**, qui passe ses arguments au constructeur de `T`.
  - Il s'utilise comme un pointeur : `*p`, `p->membre`, `if (p)`.
  - Il ne coûte **rien de plus** qu'un pointeur brut : même taille, mêmes accès.

  **Un seul propriétaire.** Un `std::unique_ptr` **ne se copie pas** : deux propriétaires libéreraient deux fois. Il
  se **déplace**, avec `std::move` : la propriété passe au nouveau pointeur, et l'ancien devient **nul**.

  ```cpp
  auto a = std::make_unique<int>(5);
  auto b = std::move(a);    // b possède l'entier ; a vaut nullptr
  ```

  **Les fonctions utiles.**

  | Écriture | Effet |
  |---|---|
  | `p.get()` | le pointeur brut, sans céder la propriété |
  | `p.reset()` | détruit l'objet maintenant ; `p` devient nul |
  | `p.release()` | cède la propriété et renvoie le pointeur brut : à éviter |

  **Passer un `std::unique_ptr` à une fonction.**

  - La fonction **se sert** de l'objet : on lui passe `*p` par référence, ou `p.get()`. Elle n'a pas à savoir qui
    possède.
  - La fonction **prend possession** : son paramètre est un `std::unique_ptr` par valeur, et l'appelant écrit
    `std::move(p)`.

  Une fonction qui crée un objet le **renvoie** dans un `std::unique_ptr` : l'appelant sait qu'il en devient
  propriétaire.

  **En entretien** : « `std::unique_ptr` est mon choix par défaut pour un objet du tas : un propriétaire unique, pas
  de surcoût, et la libération garantie. Il se déplace, il ne se copie pas. »
cards:
  - key: role-de-unique-ptr
    format: course
    question: "Que fait un `std::unique_ptr` quand il est détruit ?"
    choices:
      - {text: "Il détruit l'objet qu'il possède, et rend sa mémoire", correct: true}
      - {text: "Il laisse l'objet en place, pour les autres pointeurs", correct: false}
      - {text: "Il décrémente un compteur, et libère s'il atteint zéro", correct: false}
      - {text: "Il remet l'objet à zéro, sans le libérer", correct: false}
    answer: "Il est le seul propriétaire : son destructeur fait le `delete`. Le compteur de références est le mécanisme de `std::shared_ptr`."
  - key: pas-de-copie
    format: course
    question: "Pourquoi un `std::unique_ptr` ne peut-il pas être copié ?"
    choices:
      - {text: "Deux propriétaires libéreraient deux fois le même objet", correct: true}
      - {text: "La copie d'un pointeur est trop lente pour être permise", correct: false}
      - {text: "L'objet pointé est toujours constant", correct: false}
      - {text: "Le compilateur ne connaît pas la taille de l'objet", correct: false}
    answer: "La propriété est unique par définition. La classe interdit la copie ; elle permet le déplacement, qui transfère la propriété."
  - key: deplacement
    format: course
    question: "Après `auto b = std::move(a);`, que vaut le `std::unique_ptr` `a` ?"
    choices:
      - {text: "`nullptr` : la propriété est passée à `b`", correct: true}
      - {text: "La même adresse que `b` : les deux possèdent l'objet", correct: false}
      - {text: "Une copie de l'objet, indépendante de celui de `b`", correct: false}
      - {text: "Une adresse indéterminée, qu'il ne faut pas tester", correct: false}
    answer: "Le déplacement transfère la propriété, et laisse la source nulle. On peut la tester, la réaffecter ou la laisser mourir ; la déréférencer serait une faute."
  - key: cout
    format: course
    question: "Que coûte un `std::unique_ptr` par rapport à un pointeur brut ?"
    choices:
      - {text: "Rien de plus : même taille, mêmes accès", correct: true}
      - {text: "Un compteur de références, mis à jour à chaque copie", correct: false}
      - {text: "Une allocation supplémentaire, pour un bloc de contrôle", correct: false}
      - {text: "Une vérification du pointeur à chaque déréférencement", correct: false}
    answer: "C'est une abstraction à coût nul : le destructeur fait le `delete` qu'on aurait écrit. Le compteur et le bloc de contrôle sont ceux de `std::shared_ptr`."
  - key: vf-delete
    format: true-false
    question: "Il faut appeler `delete` sur un objet créé avec `std::make_unique`."
    truth: false
    answer: Le `std::unique_ptr` le détruit lui-même, à la fin de sa portée.
  - key: vf-copie
    format: true-false
    question: "`auto b = a;` compile quand `a` est un `std::unique_ptr`."
    truth: false
    answer: "La copie est interdite. Il faut `auto b = std::move(a);`, qui transfère la propriété."
  - key: vf-get
    format: true-false
    question: "`p.get()` cède la propriété de l'objet à l'appelant."
    truth: false
    answer: "`get()` donne le pointeur brut pour observer. C'est `release()` qui cède la propriété."
  - key: vf-dans-un-vecteur
    format: true-false
    question: "Un `std::vector` peut contenir des `std::unique_ptr`."
    truth: true
    answer: "`std::vector<std::unique_ptr<T>>` est courant. On y ajoute par déplacement, et le vecteur détruit les objets avec lui."
  - key: qcm-creer
    format: multiple-choice
    question: "Quelle ligne crée un `std::unique_ptr` vers un entier qui vaut 5 ?"
    choices:
      - {text: "`auto p = std::make_unique<int>(5);`", correct: true}
      - {text: "`std::unique_ptr<int> p = 5;`", correct: false}
      - {text: "`std::unique_ptr<int> p = new int{5};`", correct: false}
      - {text: "`auto p = std::unique<int>(5);`", correct: false}
    answer: "`std::make_unique<int>(5)` alloue et construit. Le constructeur qui prend un pointeur brut est `explicit` : `= new int{5}` ne compile pas."
  - key: qcm-observer
    format: multiple-choice
    question: "Une fonction lit un `Compte` possédé par un `std::unique_ptr`, sans en prendre possession. Quel paramètre lui donnes-tu ?"
    choices:
      - {text: "`const Compte& compte`, et l'appelant passe `*p`", correct: true}
      - {text: "`std::unique_ptr<Compte> compte`, et l'appelant passe `p`", correct: false}
      - {text: "`std::unique_ptr<Compte> compte`, et l'appelant passe `std::move(p)`", correct: false}
      - {text: "`Compte compte`, et l'appelant passe `p`", correct: false}
    answer: "La fonction n'a pas à savoir comment l'objet est possédé. Par valeur, un `std::unique_ptr` ne se copie pas ; avec `std::move`, l'appelant perdrait son objet."
  - key: qcm-transferer
    format: multiple-choice
    question: "Comment passe-t-on un `std::unique_ptr` à une fonction qui doit en prendre possession ?"
    choices:
      - {text: "`archiver(std::move(p));`", correct: true}
      - {text: "`archiver(p);`", correct: false}
      - {text: "`archiver(&p);`", correct: false}
      - {text: "`archiver(p.get());`", correct: false}
    answer: "`std::move` rend le transfert visible à l'appel. Après lui, `p` est nul."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::unique_ptr` et `std::make_unique` ?"
    choices:
      - {text: "`<memory>`", correct: true}
      - {text: "`<pointer>`", correct: false}
      - {text: "`<utility>`", correct: false}
      - {text: "`<new>`", correct: false}
    answer: "`<memory>`, comme `std::shared_ptr`. `std::move`, lui, est dans `<utility>`."
