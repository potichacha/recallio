    format: fill-in
    question: |-
      Complète pour créer l'objet sur le tas, dans un pointeur qui le possède seul :
      ```cpp
      auto compte = std::___<Compte>("Ada", 100);
      ```
    blanks:
      - [make_unique]
    answer: "`std::make_unique<Compte>(...)` alloue, construit, et renvoie un `std::unique_ptr<Compte>`."
  - key: trous-move
    format: fill-in
    question: |-
      Complète pour transférer la propriété à `b` :
      ```cpp
      auto a = std::make_unique<int>(5);
      auto b = std::___(a);
      ```
    blanks:
      - [move]
    answer: "`std::move(a)` permet le déplacement : `b` possède l'entier, `a` devient nul."
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète avec l'en-tête des pointeurs intelligents :
      ```cpp
      #include <___>

      auto p = std::make_unique<int>(5);
      ```
    blanks:
      - [memory]
    answer: "`std::unique_ptr` et `std::make_unique` sont dans `<memory>`."
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour obtenir le pointeur brut, sans céder la propriété :
      ```cpp
      auto p = std::make_unique<int>(5);
      int* brut = p.___();
      ```
    blanks:
      - [get]
    answer: "`p.get()` donne le pointeur brut. Le `std::unique_ptr` reste propriétaire."
  - key: code-usage
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto p = std::make_unique<int>(5);
          *p += 10;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "`15`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`15` : le `std::unique_ptr` se déréférence comme un pointeur. L'entier est libéré à la fin de `main`, sans `delete`."
    check:
      output: "15"
  - key: code-destruction
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      class Trace {
      public:
          Trace() { std::println("création"); }
          ~Trace() { std::println("destruction"); }
      };

      int main() {
          {
              auto p = std::make_unique<Trace>();
              std::println("dans le bloc");
          }
          std::println("après le bloc");
      }
      ```
    choices:
      - text: |-
          ```
          création
          dans le bloc
          destruction
          après le bloc
          ```
        correct: true
      - text: |-
          ```
          création
          dans le bloc
          après le bloc
          destruction
          ```
        correct: false
      - text: |-
          ```
          création
          dans le bloc
          après le bloc
          ```
        correct: false
      - text: |-
          ```
          création
          destruction
          dans le bloc
          après le bloc
          ```
        correct: false
    answer: |-
      ```
      création
      dans le bloc
      destruction
      après le bloc
      ```
      Le `std::unique_ptr` est une variable locale : à la fin de son bloc, son destructeur détruit l'objet du tas.
    check:
      output: |-
        création
        dans le bloc
        destruction
        après le bloc
  - key: code-deplacement
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <utility>

      int main() {
          auto a = std::make_unique<int>(5);
          auto b = std::move(a);
          std::println("{} {}", a == nullptr, *b);
      }
      ```
    choices:
      - {text: "`true 5`", correct: true}
      - {text: "`false 5`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true 5` : le déplacement donne l'entier à `b`, et laisse `a` nul."
    check:
      output: "true 5"
  - key: code-copie-refusee
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto a = std::make_unique<int>(5);
          auto b = a;
          std::println("{}", *b);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : le constructeur de copie de `std::unique_ptr` est supprimé (« use of deleted function »). Il faut `std::move(a)`."
    check:
      compiles: false
  - key: bug-copie
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function », sur la ligne qui crée `sauvegarde`. Le rapport doit changer
      de propriétaire. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>
      #include <utility>

      int main() {
          auto rapport = std::make_unique<int>(42);
          std::unique_ptr<int> sauvegarde = rapport;
          std::println("{}", *sauvegarde);
      }
      ```
    choices:
      - {text: "Écrire `sauvegarde = std::move(rapport);`", correct: true}
      - {text: "Écrire `sauvegarde = &rapport;`", correct: false}
      - {text: "Écrire `sauvegarde = *rapport;`", correct: false}
      - {text: "Écrire `sauvegarde = rapport.copy();`", correct: false}
    answer: |-
      ```cpp
      std::unique_ptr<int> sauvegarde = std::move(rapport);
      ```
      Un `std::unique_ptr` ne se copie pas : il se déplace. Après la ligne, `rapport` est nul, et `sauvegarde` possède
      l'entier.
  - key: bug-usage-apres-deplacement
    format: bug-fix
    question: |-
      Ce programme plante (« Segmentation fault »). Pourquoi ?
      ```cpp
      #include <memory>
      #include <print>
      #include <utility>

      int main() {
          auto score = std::make_unique<int>(10);
          auto archive = std::move(score);
          std::println("{}", *score);
      }
      ```
    choices:
      - {text: "Après le déplacement, `score` est nul : le déréférencer est une faute", correct: true}
      - {text: "Après le déplacement, l'entier est détruit : `archive` pend aussi", correct: false}
      - {text: "`std::move` copie l'entier, et la copie n'est pas initialisée", correct: false}
      - {text: "`std::println` ne sait pas afficher un entier du tas", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *archive);
      ```
      Le déplacement a donné l'entier à `archive`, et laissé `score` à `nullptr`. C'est par le nouveau propriétaire
      qu'on y accède.
  - key: bug-deux-proprietaires
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          int* brut = new int{5};
          std::unique_ptr<int> a{brut};
          std::unique_ptr<int> b{brut};
          std::println("{}", *a);
      }
      ```
    choices:
      - {text: "Créer l'entier avec `std::make_unique`, dans un seul `std::unique_ptr`", correct: true}
      - {text: "Ajouter `delete brut;` à la fin de la fonction `main`", correct: false}
      - {text: "Déclarer `b` avant `a` dans la fonction `main`", correct: false}
      - {text: "Créer un troisième `std::unique_ptr` vers `brut`", correct: false}
    answer: |-
      ```cpp
      auto a = std::make_unique<int>(5);
      ```
      Deux `std::unique_ptr` construits sur le même pointeur brut croient chacun posséder l'entier, et le libèrent
      tous deux. `std::make_unique` ne laisse aucun pointeur brut traîner.
  - key: bug-passage-par-valeur
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `afficher(compteur);`. La fonction ne fait que lire l'entier. Quelle correction
      est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      void afficher(std::unique_ptr<int> valeur) {
          std::println("{}", *valeur);
      }

      int main() {
          auto compteur = std::make_unique<int>(7);
          afficher(compteur);
          std::println("{}", *compteur);
      }
      ```
    choices:
      - {text: "Prendre un `const int&`, et passer `*compteur`", correct: true}
      - {text: "Passer `std::move(compteur)` à la fonction", correct: false}
      - {text: "Passer `compteur.release()` à la fonction", correct: false}
      - {text: "Prendre un `std::unique_ptr<int>*`, et passer `compteur`", correct: false}
    answer: |-
      ```cpp
      void afficher(const int& valeur) {
          std::println("{}", valeur);
      }

      afficher(*compteur);
      ```
      Passer un `std::unique_ptr` par valeur demande une copie, qui est interdite. `std::move` compilerait, mais
      `compteur` serait nul à la ligne suivante. Une fonction qui lit prend l'objet, pas son propriétaire.
  - key: situation-choix-par-defaut
    format: scenario
    question: |-
      Tu dois créer sur le tas un objet `Moteur`, utilisé par une seule classe `Voiture`. Quel type de pointeur
      choisis-tu pour le membre ?
    choices:
      - {text: "`std::unique_ptr<Moteur>` : un seul propriétaire, sans surcoût", correct: true}
      - {text: "`std::shared_ptr<Moteur>` : au cas où il serait partagé un jour", correct: false}
      - {text: "`Moteur*`, avec un `delete` dans le destructeur de `Voiture`", correct: false}
      - {text: "`Moteur&`, liée à un moteur créé dans le constructeur", correct: false}
    answer: |-
      La propriété est unique : `std::unique_ptr` l'exprime, et libère tout seul. Un `std::shared_ptr` paie un
      compteur dont on n'a pas besoin, et un pointeur brut ramène les `delete` à gérer.
  - key: situation-fabrique
    format: scenario
    question: |-
      Tu écris `creer_connexion()`, qui alloue une connexion et la remet à l'appelant. Comment lui fais-tu savoir
      qu'il en devient responsable ?
    choices:
      - {text: "En renvoyant un `std::unique_ptr<Connexion>`", correct: true}
      - {text: "En renvoyant un `Connexion*`, avec un commentaire", correct: false}
      - {text: "En renvoyant une `Connexion&` vers un objet local", correct: false}
      - {text: "En renvoyant un `bool`, et la connexion dans une variable globale", correct: false}
    answer: |-
      Le type de retour porte le contrat : l'appelant possède, et la libération est assurée même s'il oublie. Un
      pointeur brut laisse deviner qui doit faire le `delete`.
  - key: situation-vieux-code
    format: scenario
    question: |-
      Tu reprends une fonction qui fait `Rapport* r = new Rapport;` puis `delete r;` vingt lignes plus bas, avec
      plusieurs `return` entre les deux. Quelle est la plus petite modification sûre ?
    choices:
      - {text: "`auto r = std::make_unique<Rapport>();`, et retirer le `delete`", correct: true}
      - {text: "Ajouter `delete r;` devant chaque `return`", correct: false}
      - {text: "Remplacer `new Rapport` par une variable globale", correct: false}
      - {text: "Entourer la fonction d'un `try` et d'un `catch`", correct: false}
    answer: |-
      Le reste du code ne change pas : `r->` fonctionne pareil. La libération passe dans le destructeur, que tous les
      `return` déclenchent. Si l'objet n'a pas besoin du tas, une simple variable locale serait encore mieux.
  - key: situation-conteneur
    format: scenario
    question: |-
      Une liste doit posséder des formes de tailles différentes, créées à l'exécution. Un collègue propose un
      `std::vector<Forme*>`, avec une boucle de `delete` dans le destructeur. Que proposes-tu à la place ?
    choices:
      - {text: "Un `std::vector<std::unique_ptr<Forme>>`, qui détruit ses formes tout seul", correct: true}
      - {text: "Un `std::vector<Forme&>`, qui évite d'avoir à manipuler des pointeurs", correct: false}
      - {text: "Un `std::vector<Forme*>`, sans aucun `delete` dans le destructeur", correct: false}
      - {text: "Un `std::array<Forme*, 100>`, de taille fixe, libéré par une boucle", correct: false}
    answer: |-
      Chaque élément possède sa forme : vider le vecteur, en retirer un élément ou le détruire libère ce qu'il faut,
      sans boucle. Un vecteur de références n'existe pas, et des pointeurs bruts sans `delete` fuient.
