notion: pile-tas
lesson: |-
  Un programme range ses objets dans deux zones de mémoire, qui n'obéissent pas aux mêmes règles.

  | | La **pile** (*stack*) | Le **tas** (*heap*) |
  |---|---|---|
  | Ce qu'on y trouve | les variables locales, les paramètres | ce qui est alloué dynamiquement |
  | Qui gère | le compilateur, automatiquement | le programme : `new`, ou un conteneur |
  | Durée de vie | la portée : jusqu'à la fin du bloc | jusqu'à la libération explicite |
  | Taille | connue à la compilation, petite | décidée à l'exécution, grande |
  | Coût d'une allocation | presque nul | un appel à l'allocateur |

  **La pile.** Chaque appel de fonction y empile ses variables locales, et les dépile à son retour. Rien à libérer,
  rien à oublier. En contrepartie, elle est **limitée** : quelques mégaoctets. Une récursion trop profonde ou un
  énorme tableau local la font déborder : c'est le **dépassement de pile** (*stack overflow*), qui fait planter le
  programme.

  **Le tas.** On y alloue ce dont la **taille n'est connue qu'à l'exécution**, ou ce qui doit **survivre à la
  fonction** qui le crée. L'allocation coûte plus cher, et la mémoire doit être rendue : l'oublier est une **fuite**.

  **Les deux ensemble.** Un `std::vector` déclaré dans une fonction est un petit objet **sur la pile** (un pointeur,
  une taille, une capacité), dont les **éléments sont sur le tas**. À la fin du bloc, son destructeur libère le tas.
  C'est le modèle à suivre : un objet de la pile possède la mémoire du tas, et la rend en mourant.

  **La règle.** La pile par défaut : une variable locale. Le tas seulement quand il le faut, et à travers un
  conteneur ou un pointeur intelligent, jamais par un `new` nu.

  **En entretien** : « La pile est automatique, rapide et limitée ; le tas est flexible, plus lent, et doit être
  libéré. En C++ moderne, je ne touche le tas qu'à travers des objets de la pile qui le possèdent. »
tour:
  - title: La pile et le tas
    text: |-
      Tes variables locales vivent sur la **pile** : créées à leur déclaration, détruites à la fin du bloc, sans rien
      à faire. La pile est rapide, mais petite.

      Ce qui est gros, ou dont la taille n'est connue qu'à l'exécution, va sur le **tas**. Un `std::vector` le fait
      pour toi : l'objet est sur la pile, ses éléments sont sur le tas, et il les libère en disparaissant.

      Ici, un million d'entiers tiennent sans peine dans un vecteur. Le même tableau en variable locale ferait
      déborder la pile.

      Essaie : passe à dix millions d'éléments, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              int petit = 42;

              std::vector<int> grand(1'000'000, 1);

              long long somme = 0;
              for (int valeur : grand) {
                  somme += valeur;
              }

              std::println("{} sur la pile, {} éléments sur le tas, somme {}", petit, grand.size(), somme);
          }
      output: "42 sur la pile, 1000000 éléments sur le tas, somme 1000000"
cards:
  - key: ou-vivent-les-locales
    format: course
    question: Où une variable locale est-elle rangée ?
    choices:
      - {text: "Sur la pile, d'où elle est retirée à la fin de son bloc", correct: true}
      - {text: "Sur le tas, d'où il faut la libérer à la main", correct: false}
      - {text: "Dans l'exécutable, à côté du code du programme", correct: false}
      - {text: "Dans une zone partagée par toutes les fonctions", correct: false}
    answer: "Les variables locales et les paramètres vivent sur la pile. Le compilateur les y place et les en retire : c'est le stockage automatique."
  - key: quand-le-tas
    format: course
    question: Quand a-t-on besoin du tas plutôt que de la pile ?
    choices:
      - {text: "Quand la taille n'est connue qu'à l'exécution, ou que l'objet doit survivre à sa fonction", correct: true}
      - {text: "Quand la variable est d'un type fondamental, comme `int` ou `double`", correct: false}
      - {text: "Quand la variable doit être lue plus vite que les autres", correct: false}
      - {text: "Quand la variable est déclarée avec le mot-clé `const`", correct: false}
    answer: "La pile demande des tailles connues à la compilation et lie la durée de vie à la portée. Le tas lève ces deux contraintes, au prix d'une allocation plus lente et d'une libération à assurer."
  - key: vector-entre-les-deux
    format: course
    question: "Où sont rangés les éléments d'un `std::vector` déclaré dans une fonction ?"
    choices:
      - {text: "Sur le tas ; l'objet vecteur lui-même est sur la pile", correct: true}
      - {text: "Sur la pile, avec l'objet vecteur lui-même", correct: false}
      - {text: "Sur le tas, avec l'objet vecteur lui-même", correct: false}
      - {text: "Dans l'exécutable, à une adresse fixe", correct: false}
    answer: "Le vecteur est un petit objet local, qui contient un pointeur vers ses éléments, alloués sur le tas. Son destructeur les libère à la fin du bloc."
  - key: cout-compare
    format: course
    question: Pourquoi allouer sur la pile est-il plus rapide que sur le tas ?
    choices:
      - {text: "Il suffit de déplacer le sommet de la pile ; le tas demande de chercher un bloc libre", correct: true}
      - {text: "La pile est rangée dans le processeur, le tas sur le disque", correct: false}
      - {text: "La pile n'initialise jamais ses variables, le tas toujours", correct: false}
      - {text: "La pile est partagée par tous les programmes, le tas est privé", correct: false}
    answer: "Réserver de la place sur la pile revient à ajuster un pointeur. Le tas passe par un allocateur, qui tient le compte des blocs libres et occupés."
  - key: vf-liberation-de-la-pile
    format: true-false
    question: Il faut libérer soi-même la mémoire d'une variable locale.
    truth: false
    answer: "La pile est gérée automatiquement : la variable disparaît à la fin de son bloc."
  - key: vf-taille-de-la-pile
    format: true-false
    question: La pile a une taille limitée, de l'ordre de quelques mégaoctets.
    truth: true
    answer: Souvent 8 Mo sous Linux, 1 Mo sous Windows. La dépasser fait planter le programme.
  - key: vf-tas-automatique
    format: true-false
    question: La mémoire allouée sur le tas avec `new` est libérée à la fin du bloc.
    truth: false
    answer: Elle reste allouée jusqu'au `delete`. Seul un objet qui la possède, comme un pointeur intelligent, la libère à la fin de sa propre portée.
  - key: vf-taille-a-l-execution
    format: true-false
    question: Le tas permet d'allouer un tableau dont la taille n'est connue qu'à l'exécution.
    truth: true
    answer: C'est ce que fait `std::vector`, dont la taille peut dépendre d'une saisie ou d'un fichier.
  - key: qcm-debordement
    format: multiple-choice
    question: Qu'est-ce qui provoque un dépassement de pile ?
    choices:
      - {text: "Une récursion trop profonde, ou un très gros tableau local", correct: true}
      - {text: "Un `new` dont on a oublié le `delete`", correct: false}
      - {text: "Un `std::vector` qui contient trop d'éléments", correct: false}
      - {text: "Une variable globale trop grande", correct: false}
    answer: "Chaque appel empile ses variables : une récursion sans fin, ou un tableau local de plusieurs mégaoctets, épuise la pile. Un `new` oublié est une fuite, sur le tas."
  - key: qcm-choix-par-defaut
    format: multiple-choice
    question: Où range-t-on par défaut un petit objet dont on a besoin dans une fonction ?
    choices:
      - {text: "Sur la pile, dans une variable locale", correct: true}
      - {text: "Sur le tas, avec `new`", correct: false}
      - {text: "Dans une variable globale", correct: false}
      - {text: "Sur le tas, dans un `std::shared_ptr`", correct: false}
    answer: "Une variable locale ne coûte rien et se nettoie seule. Le tas ne se justifie que par la taille ou par la durée de vie."
  - key: qcm-duree-de-vie
    format: multiple-choice
    question: Jusqu'à quand vit un objet alloué sur le tas ?
    choices:
      - {text: "Jusqu'à ce que le programme le libère", correct: true}
      - {text: "Jusqu'à la fin du bloc où il a été créé", correct: false}
      - {text: "Jusqu'à la fin de la fonction où il a été créé", correct: false}
      - {text: "Jusqu'au prochain passage du ramasse-miettes", correct: false}
    answer: "Sa durée de vie ne dépend pas de la portée : il vit jusqu'à sa libération, et, si elle est oubliée, jusqu'à la fin du programme."
  - key: qcm-gros-tableau
    format: multiple-choice
    question: Tu as besoin d'un tableau de dix millions d'entiers dans une fonction. Que déclares-tu ?
    choices:
      - {text: "`std::vector<int> donnees(10'000'000);`", correct: true}
      - {text: "`int donnees[10'000'000];`", correct: false}
      - {text: "`std::array<int, 10'000'000> donnees;`", correct: false}
      - {text: "`int donnees = 10'000'000;`", correct: false}
    answer: "Quarante mégaoctets ne tiennent pas sur la pile : un tableau du C ou un `std::array` locaux la feraient déborder. Le vecteur range ses éléments sur le tas."
  - key: situation-plantage-recursion
    format: scenario
    question: |-
      Une fonction récursive qui parcourt une arborescence plante avec « Segmentation fault » sur les très gros
      dossiers, et fonctionne sur les petits. Que soupçonnes-tu ?
    choices:
      - {text: "Un dépassement de pile : chaque appel empile ses variables locales", correct: true}
      - {text: "Une fuite de mémoire : le tas finit par être plein", correct: false}
      - {text: "Une exception non rattrapée, levée par le système de fichiers", correct: false}
      - {text: "Un débordement d'entier, dans le compteur de dossiers", correct: false}
    answer: |-
      La profondeur de récursion suit celle de l'arborescence. Au-delà de quelques dizaines de milliers d'appels, la
      pile est pleine. On passe à une version itérative, avec une pile explicite rangée dans un `std::vector`, donc
      sur le tas.
  - key: situation-tableau-local
    format: scenario
    question: |-
      Un collègue déclare `double image[4000 * 3000];` en variable locale, et son programme plante dès l'entrée dans
      la fonction. Que lui proposes-tu ?
    choices:
      - {text: "Un `std::vector<double>` de cette taille, dont les éléments sont sur le tas", correct: true}
      - {text: "Un tableau de `float`, deux fois plus petit, toujours local", correct: false}
      - {text: "Le même tableau, déclaré dans `main` plutôt que dans la fonction", correct: false}
      - {text: "Le même tableau, précédé du mot-clé `const`", correct: false}
    answer: |-
      Douze millions de `double` font 96 Mo, bien au-delà de la pile. Un vecteur alloue ses éléments sur le tas, et
      les libère tout seul. Passer à `float` laisserait 48 Mo sur la pile.
  - key: situation-renvoyer-un-objet
    format: scenario
    question: |-
      Une fonction construit un rapport de plusieurs milliers de lignes, que l'appelant doit garder. Un collègue
      veut l'allouer avec `new` et renvoyer un pointeur, « sinon il sera détruit à la fin de la fonction ». Que
      réponds-tu ?
    choices:
      - {text: "De renvoyer un `std::vector` par valeur : ses éléments, sur le tas, sont remis à l'appelant", correct: true}
      - {text: "Qu'il a raison : un objet renvoyé par valeur est toujours perdu", correct: false}
      - {text: "De renvoyer une référence vers le rapport local", correct: false}
      - {text: "De ranger le rapport dans une variable globale", correct: false}
    answer: |-
      Renvoyer un vecteur par valeur ne copie pas ses éléments : le résultat est construit chez l'appelant, ou
      déplacé. La mémoire du tas change de propriétaire sans `new` ni `delete`. Une référence vers une variable
      locale, elle, serait pendante.
  - key: situation-performance
    format: scenario
    question: |-
      Une boucle exécutée des millions de fois crée à chaque tour un petit objet temporaire avec `new`, puis le
      détruit avec `delete`. Le profileur montre que l'allocateur domine le temps d'exécution. Que proposes-tu ?
    choices:
      - {text: "De déclarer l'objet en variable locale : la pile ne coûte presque rien", correct: true}
      - {text: "De garder `new`, et de retirer le `delete` pour gagner du temps", correct: false}
      - {text: "De déclarer l'objet dans un `std::shared_ptr`, plus rapide que `new`", correct: false}
      - {text: "De compiler sans optimisation, pour alléger l'allocateur", correct: false}
    answer: |-
      Un petit objet de courte durée n'a rien à faire sur le tas : en variable locale, sa création revient à ajuster
      le sommet de la pile. Retirer le `delete` créerait une fuite, et un `std::shared_ptr` ajoute au contraire un
      compteur à l'allocation.
  - key: definition-pile
    format: definition
    question: "Qu'est-ce que la pile d'un programme ?"
    choices:
      - {text: "La zone de mémoire où sont empilées les variables locales de chaque appel", correct: true}
      - {text: "La zone de mémoire où sont rangés les objets créés avec `new`", correct: false}
      - {text: "La liste des fichiers source que le compilateur doit traiter", correct: false}
      - {text: "La file des instructions que le processeur va exécuter", correct: false}
    answer: "La pile grandit à chaque appel de fonction et rétrécit à chaque retour. Chaque appel y a son cadre, avec ses paramètres et ses variables locales."
  - key: definition-tas
    format: definition
    question: "Qu'est-ce que le tas ?"
    choices:
      - {text: "La zone de mémoire où le programme alloue et libère à la demande", correct: true}
      - {text: "La zone de mémoire où sont empilés les appels de fonctions", correct: false}
      - {text: "La zone de mémoire réservée aux variables globales", correct: false}
      - {text: "La zone de mémoire où est chargé le code du programme", correct: false}
    answer: "Le tas sert à l'allocation dynamique : des blocs de taille quelconque, demandés et rendus pendant l'exécution, dans n'importe quel ordre."
  - key: definition-allocation-dynamique
    format: definition
    question: "Qu'appelle-t-on une allocation dynamique ?"
    choices:
      - {text: "Une demande de mémoire faite pendant l'exécution, sur le tas", correct: true}
      - {text: "Une réservation de mémoire faite par le compilateur, sur la pile", correct: false}
      - {text: "Un changement du type d'une variable pendant l'exécution", correct: false}
      - {text: "Un déplacement d'une variable d'une fonction à une autre", correct: false}
    answer: "Le programme demande, à l'exécution, un bloc de la taille dont il a besoin. C'est ce que font `new` et, derrière eux, les conteneurs comme `std::vector`."
  - key: definition-depassement-de-pile
    format: definition
    question: "Qu'est-ce qu'un dépassement de pile (*stack overflow*) ?"
    choices:
      - {text: "L'épuisement de la pile, par trop d'appels imbriqués ou des variables locales trop grosses", correct: true}
      - {text: "L'écriture d'un élément après la fin d'un tableau alloué sur le tas", correct: false}
      - {text: "Le dépassement de la plus grande valeur d'un entier", correct: false}
      - {text: "L'oubli de libérer une mémoire allouée avec `new`", correct: false}
    answer: "La pile a une taille fixe. Quand les cadres d'appel la remplissent, le programme écrit hors de sa zone, et le système l'arrête."
