notion: algorithmes-numeriques
lesson: |-
  Les algorithmes de calcul vivent dans l'en-tête **`<numeric>`**, à part de `<algorithm>`.

  | Algorithme | Ce qu'il calcule |
  |---|---|
  | `std::accumulate(d, f, init)` | la somme des éléments, à partir de `init` |
  | `std::accumulate(d, f, init, op)` | un cumul quelconque : produit, concaténation... |
  | `std::reduce(d, f, init)` (C++17) | comme `accumulate`, dans un ordre libre : parallélisable |
  | `std::inner_product(d1, f1, d2, init)` | le produit scalaire de deux suites |
  | `std::iota(d, f, depart)` | remplit avec `depart`, `depart + 1`, `depart + 2`... |
  | `std::partial_sum(d, f, sortie)` | les sommes cumulées |
  | `std::adjacent_difference(d, f, sortie)` | les écarts entre voisins |

  **`std::accumulate`.**

  ```cpp
  std::vector<int> v{1, 2, 3, 4};
  int somme = std::accumulate(v.begin(), v.end(), 0);                           // 10
  int produit = std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{});    // 24
  ```

  Il part de la valeur initiale, et lui combine chaque élément, **de gauche à droite**.

  **Le piège : le type du résultat est celui de la valeur initiale.** Pas celui des éléments.

  ```cpp
  std::vector<double> prix{1.5, 2.5};
  std::accumulate(prix.begin(), prix.end(), 0);      // 3 : chaque somme est tronquée en int
  std::accumulate(prix.begin(), prix.end(), 0.0);    // 4.0
  ```

  De même, pour additionner de grands `int` sans déborder, on part de `0LL`. Et pour concaténer des chaînes, de
  `std::string{}` :

  ```cpp
  std::accumulate(mots.begin(), mots.end(), std::string{});
  ```

  **L'opération sur mesure.** Elle reçoit le cumul, puis l'élément, et renvoie le nouveau cumul :

  ```cpp
  int longueur_totale = std::accumulate(mots.begin(), mots.end(), 0,
      [](int cumul, const std::string& mot) { return cumul + static_cast<int>(mot.size()); });
  ```

  **`std::reduce`.** Même résultat qu'`accumulate` pour une somme, mais l'ordre des opérations n'est **pas
  garanti**. C'est ce qui permet de l'exécuter en parallèle (`std::execution::par`). L'opération doit donc être
  associative et commutative : une soustraction donnerait n'importe quoi. Sans valeur initiale, il part de la
  valeur nulle du type des éléments.

  **`std::inner_product`.** Il multiplie les éléments de même rang, et additionne les produits :

  ```cpp
  std::inner_product(a.begin(), a.end(), b.begin(), 0);     // a[0]*b[0] + a[1]*b[1] + ...
  ```

  **`std::iota`.** Il remplit une suite de valeurs qui se suivent. Pratique pour fabriquer des indices :

  ```cpp
  std::vector<int> indices(5);
  std::iota(indices.begin(), indices.end(), 0);      // 0 1 2 3 4
  ```

  **En entretien** : « `accumulate`, `reduce`, `inner_product` et `iota` sont dans `<numeric>`. Le résultat
  d'`accumulate` a le type de sa valeur initiale : `0.0` pour des `double`. `reduce` ne garantit pas l'ordre, ce
  qui le rend parallélisable, mais exige une opération associative et commutative. »
cards:
  - key: accumulate
    format: course
    question: "Que fait `std::accumulate(v.begin(), v.end(), 0)` ?"
    choices:
      - {text: "Il additionne les éléments, à partir de la valeur initiale 0", correct: true}
      - {text: "Il compte les éléments égaux à 0", correct: false}
      - {text: "Il remplace chaque élément par 0", correct: false}
      - {text: "Il renvoie le plus grand élément, ou 0 si le vecteur est vide", correct: false}
    answer: "Le troisième argument est le point de départ du cumul. Sur un intervalle vide, c'est lui qui est renvoyé."
  - key: type-resultat
    format: course
    question: "Quel est le type du résultat de `std::accumulate` ?"
    choices:
      - {text: "Celui de la valeur initiale", correct: true}
      - {text: "Celui des éléments de l'intervalle", correct: false}
      - {text: "Toujours `double`", correct: false}
      - {text: "Toujours `long long`", correct: false}
    answer: "Avec `0`, le cumul est un `int`, même sur des `double` : chaque somme intermédiaire est tronquée. On écrit `0.0`."
  - key: reduce
    format: course
    question: "Qu'est-ce qui distingue `std::reduce` de `std::accumulate` ?"
    choices:
      - {text: "Il ne garantit pas l'ordre des opérations, ce qui permet de le paralléliser", correct: true}
      - {text: "Il garantit un ordre de gauche à droite, ce qui le rend plus lent", correct: false}
      - {text: "Il ne fonctionne que sur des nombres à virgule", correct: false}
      - {text: "Il modifie les éléments de l'intervalle", correct: false}
    answer: "`accumulate` cumule strictement de gauche à droite. `reduce` peut regrouper les éléments autrement : l'opération doit être associative et commutative."
  - key: iota
    format: course
    question: "Que fait `std::iota(v.begin(), v.end(), 5)` sur un vecteur de trois éléments ?"
    choices:
      - {text: "Il le remplit avec 5, 6, 7", correct: true}
      - {text: "Il le remplit avec 5, 5, 5", correct: false}
      - {text: "Il ajoute 5 à chaque élément", correct: false}
      - {text: "Il le remplit avec 0, 5, 10", correct: false}
    answer: "Chaque élément reçoit la valeur précédente plus un, à partir du départ. C'est la façon de produire une suite d'indices."
  - key: vf-en-tete
    format: true-false
    question: "`std::accumulate` est déclaré dans l'en-tête `<numeric>`."
    truth: true
    answer: "Comme `std::reduce`, `std::iota` et `std::inner_product`. Il n'est pas dans `<algorithm>`."
  - key: vf-zero-double
    format: true-false
    question: "`std::accumulate(v.begin(), v.end(), 0)` donne la somme exacte d'un vecteur de `double`."
    truth: false
    answer: "La valeur initiale `0` est un `int` : le cumul est tronqué à chaque étape. Il faut `0.0`."
  - key: vf-reduce-soustraction
    format: true-false
    question: "`std::reduce` convient à une soustraction."
    truth: false
    answer: "La soustraction n'est ni associative ni commutative : sans ordre garanti, le résultat n'est pas déterminé. On garde `std::accumulate`."
  - key: vf-vide
    format: true-false
    question: "Sur un intervalle vide, `std::accumulate` renvoie sa valeur initiale."
    truth: true
    answer: "Il n'y a rien à lui combiner. Aucun cas particulier à écrire."
  - key: qcm-produit
    format: multiple-choice
    question: "Quelle ligne calcule le produit des éléments du vecteur `v` ?"
    choices:
      - {text: "`std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{})`", correct: true}
      - {text: "`std::accumulate(v.begin(), v.end(), 0, std::multiplies<>{})`", correct: false}
      - {text: "`std::accumulate(v.begin(), v.end(), std::multiplies<>{})`", correct: false}
      - {text: "`std::inner_product(v.begin(), v.end(), 1)`", correct: false}
    answer: "L'opération est le quatrième argument, et le produit part de 1 : avec 0, il serait toujours nul."
  - key: qcm-scalaire
    format: multiple-choice
    question: "Quel algorithme calcule `a[0]*b[0] + a[1]*b[1] + ...` ?"
    choices:
      - {text: "`std::inner_product`", correct: true}
      - {text: "`std::accumulate`", correct: false}
      - {text: "`std::partial_sum`", correct: false}
      - {text: "`std::iota`", correct: false}
    answer: "Le produit scalaire : `std::inner_product(a.begin(), a.end(), b.begin(), 0)`."
  - key: qcm-grands-entiers
    format: multiple-choice
    question: "Tu additionnes des `int` dont la somme dépasse deux milliards. Quelle valeur initiale choisis-tu ?"
    choices:
      - {text: "`0LL`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`0u`", correct: false}
      - {text: "`'0'`", correct: false}
    answer: "`0LL` est un `long long` : le cumul ne déborde pas. Avec `0`, la somme d'`int` dépasserait `INT_MAX`, ce qui est un comportement indéfini."
  - key: qcm-cumulees
    format: multiple-choice
    question: "Quel algorithme transforme `1 2 3 4` en `1 3 6 10` ?"
    choices:
      - {text: "`std::partial_sum`", correct: true}
      - {text: "`std::accumulate`", correct: false}
      - {text: "`std::adjacent_difference`", correct: false}
      - {text: "`std::iota`", correct: false}
    answer: "Les sommes cumulées. `accumulate` ne rend que le total ; `adjacent_difference` fait l'opération inverse."
  - key: trous-accumulate
    format: fill-in
    question: |-
      Complète pour additionner les éléments :
      ```cpp
      int somme = std::___(v.begin(), v.end(), 0);
      ```
    blanks:
      - [accumulate, reduce]
    answer: "`std::accumulate` cumule les éléments à partir de la valeur initiale."
  - key: trous-numeric
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `std::accumulate` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [numeric]
    answer: "Les algorithmes de calcul sont dans `<numeric>`."
  - key: trous-iota
    format: fill-in
    question: |-
      Complète pour remplir le vecteur avec 0, 1, 2, 3, 4 :
      ```cpp
      std::vector<int> indices(5);
      std::___(indices.begin(), indices.end(), 0);
      ```
    blanks:
      - [iota]
    answer: "`std::iota` écrit une suite de valeurs consécutives."
  - key: trous-initiale
    format: fill-in
    question: |-
      Complète la valeur initiale pour que la somme de ces `double` ne soit pas tronquée :
      ```cpp
      std::vector<double> prix{1.5, 2.5};
      double total = std::accumulate(prix.begin(), prix.end(), ___);
      ```
    blanks:
      - ["0.0", "0."]
    answer: "`0.0` est un `double` : le cumul garde ses décimales."
  - key: code-somme-produit
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4};
          const int somme = std::accumulate(v.begin(), v.end(), 0);
          const int produit = std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{});
          std::println("{} {}", somme, produit);
      }
      ```
    choices:
      - {text: "`10 24`", correct: true}
      - {text: "`10 0`", correct: false}
      - {text: "`10 10`", correct: false}
      - {text: "`11 24`", correct: false}
    answer: "`10 24` : la somme part de 0 ; le produit part de 1, avec `std::multiplies` comme opération."
    check:
      output: "10 24"
  - key: code-troncature
    format: code-output
    question: |-
      ```cpp
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<double> v{1.5, 1.5, 1.5};
          std::println("{} {}", std::accumulate(v.begin(), v.end(), 0), std::accumulate(v.begin(), v.end(), 0.0));
      }
      ```
    choices:
      - {text: "`3 4.5`", correct: true}
      - {text: "`4.5 4.5`", correct: false}
      - {text: "`4 4.5`", correct: false}
      - {text: "`3 3`", correct: false}
    answer: "`3 4.5` : avec `0`, le cumul est un `int`, tronqué à chaque addition : 1, 2, 3. Avec `0.0`, c'est un `double` : 4.5."
    check:
      output: "3 4.5"
  - key: code-iota
    format: code-output
    question: |-
      ```cpp
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v(4);
          std::iota(v.begin(), v.end(), 3);
          std::println("{} {} {}", v.front(), v.back(), std::accumulate(v.begin(), v.end(), 0));
      }
      ```
    choices:
      - {text: "`3 6 18`", correct: true}
      - {text: "`3 3 12`", correct: false}
      - {text: "`0 3 6`", correct: false}
      - {text: "`3 7 22`", correct: false}
    answer: "`3 6 18` : `iota` écrit 3, 4, 5, 6. Leur somme vaut 18."
    check:
      output: "3 6 18"
  - key: code-inner-product
    format: code-output
    question: |-
      ```cpp
      #include <numeric>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<int> quantites{2, 1, 3};
          const std::vector<int> prix{10, 5, 1};
          const std::vector<std::string> mots{"a", "b", "c"};
          const int total = std::inner_product(quantites.begin(), quantites.end(), prix.begin(), 0);
          std::println("{} {}", total, std::accumulate(mots.begin(), mots.end(), std::string{"-"}));
      }
      ```
    choices:
      - {text: "`28 -abc`", correct: true}
      - {text: "`22 -abc`", correct: false}
      - {text: "`28 abc-`", correct: false}
      - {text: "`28 abc`", correct: false}
    answer: "`28 -abc` : 2×10 + 1×5 + 3×1 = 28. La concaténation part de `\"-\"`, et ajoute chaque mot à sa droite."
    check:
      output: "28 -abc"
  - key: bug-zero-entier
    format: bug-fix
    question: |-
      Ce programme devrait afficher `7.5`. Il affiche `6`. Quelle correction est la bonne ?
      ```cpp
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<double> prix{2.5, 2.5, 2.5};
          std::println("{}", std::accumulate(prix.begin(), prix.end(), 0));
      }
      ```
    choices:
      - {text: "Écrire `0.0` comme valeur initiale", correct: true}
      - {text: "Écrire `1` comme valeur initiale", correct: false}
      - {text: "Écrire `std::plus<>{}` comme quatrième argument", correct: false}
      - {text: "Déclarer le vecteur avec le type `std::vector<float>`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::accumulate(prix.begin(), prix.end(), 0.0));
      ```
      Le type du cumul est celui de la valeur initiale. Avec `0`, c'est un `int` : chaque addition est tronquée (2,
      4, 6).
  - key: bug-produit-zero
    format: bug-fix
    question: |-
      Ce programme devrait afficher `24`, le produit des éléments. Il affiche `0`. Quelle correction est la bonne ?
      ```cpp
      #include <functional>
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4};
          std::println("{}", std::accumulate(v.begin(), v.end(), 0, std::multiplies<>{}));
      }
      ```
    choices:
      - {text: "Écrire `1` comme valeur initiale", correct: true}
      - {text: "Écrire `0.0` comme valeur initiale", correct: false}
      - {text: "Écrire `std::plus<>{}` comme opération", correct: false}
      - {text: "Écrire `v.begin() + 1` comme début", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{}));
      ```
      Le cumul part de la valeur initiale : multiplié par 0, il reste nul. L'élément neutre du produit est 1.
  - key: bug-en-tete
    format: bug-fix
    question: |-
      Le compilateur répond « 'accumulate' is not a member of 'std' ». Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          std::println("{}", std::accumulate(v.begin(), v.end(), 0));
      }
      ```
    choices:
      - {text: "Inclure `<numeric>`", correct: true}
      - {text: "Inclure `<math>`", correct: false}
      - {text: "Inclure `<cmath>`", correct: false}
      - {text: "Inclure `<functional>`", correct: false}
    answer: |-
      ```cpp
      #include <numeric>
      ```
      `std::accumulate` n'est pas dans `<algorithm>`, mais dans `<numeric>`. GCC le suggère d'ailleurs dans une
      note.
  - key: bug-ordre-operation
    format: bug-fix
    question: |-
      Ce programme devrait afficher `6`, la somme des longueurs. Le compilateur refuse la lambda : ses paramètres
      sont dans le mauvais ordre. Quelle correction est la bonne ?
      ```cpp
      #include <numeric>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<std::string> mots{"ab", "c", "def"};
          const int total = std::accumulate(mots.begin(), mots.end(), 0,
              [](const std::string& mot, int cumul) { return cumul + static_cast<int>(mot.size()); });
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `[](int cumul, const std::string& mot)`", correct: true}
      - {text: "Écrire `[](const std::string& mot)`", correct: false}
      - {text: "Écrire `[](int cumul)`", correct: false}
      - {text: "Écrire `[](const std::string& a, const std::string& b)`", correct: false}
    answer: |-
      ```cpp
      [](int cumul, const std::string& mot) { return cumul + static_cast<int>(mot.size()); }
      ```
      L'opération reçoit d'abord le cumul, puis l'élément, et renvoie le nouveau cumul.
