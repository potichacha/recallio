notion: lambdas-recursives
lesson: |-
  **Une lambda ne peut pas s'appeler par son nom.** Au moment où son corps est compilé, la variable qui la
  contiendra n'a pas encore de type :

  ```cpp
  auto fact = [](int n) { return n <= 1 ? 1 : n * fact(n - 1); };   // erreur : fact n'est pas encore déduit
  ```

  Trois façons de contourner.

  **1. Le paramètre objet explicite (C++23).** La lambda se reçoit elle-même en premier paramètre, écrit
  `this auto self`. C'est la forme moderne, et la plus simple.

  ```cpp
  auto fact = [](this auto self, int n) -> int {
      return n <= 1 ? 1 : n * self(n - 1);
  };
  fact(5);   // 120 : l'appelant ne passe pas self
  ```

  **2. Se passer soi-même en argument (C++14).** La lambda prend un paramètre générique, et l'appelant lui donne la
  lambda.

  ```cpp
  auto fact = [](auto&& self, int n) -> int {
      return n <= 1 ? 1 : n * self(self, n - 1);
  };
  fact(fact, 5);
  ```

  **3. `std::function`.** Son type est connu d'avance : la lambda peut la capturer par référence.

  ```cpp
  std::function<int(int)> fact = [&fact](int n) {
      return n <= 1 ? 1 : n * fact(n - 1);
  };
  ```

  Simple, mais plus lent (appel indirect), et **dangereux** si la `std::function` est copiée ou renvoyée : la
  capture désigne l'original, qui peut avoir disparu.

  **Le type de retour.** Une lambda récursive doit en général l'écrire (`-> int`) : le compilateur ne peut pas le
  déduire d'un `return` qui appelle la lambda elle-même, avant d'avoir vu un `return` non récursif.

  **Souvent, une fonction suffit.** Une fonction nommée s'appelle elle-même sans artifice. La lambda récursive se
  justifie quand elle a besoin de **captures**, ou qu'elle n'a de sens qu'à l'intérieur d'une fonction : un
  parcours d'arbre local, par exemple.

  **Les lambdas `constexpr`.** Depuis C++17, une lambda est **implicitement `constexpr`** quand son corps le
  permet : on peut l'appeler dans une expression constante.

  ```cpp
  auto carre = [](int x) { return x * x; };
  constexpr int seize = carre(4);
  static_assert(carre(3) == 9);
  ```

  On peut l'écrire explicitement : `[](int x) constexpr { ... }`. Le compilateur signale alors une erreur si le
  corps ne peut pas être évalué à la compilation. Depuis C++20, `consteval` impose même que chaque appel le soit.

  **En entretien** : « Une lambda ne connaît pas son propre nom. En C++23, j'écris `this auto self` en premier
  paramètre, et j'appelle `self`. Avant, je passais la lambda à elle-même, ou j'utilisais une `std::function`,
  plus lente. Et depuis C++17, une lambda est `constexpr` d'office quand son corps le permet. »
cards:
  - key: probleme
    format: course
    question: "Pourquoi une lambda ne peut-elle pas s'appeler elle-même par le nom de sa variable ?"
    choices:
      - {text: "Le type de la variable `auto` n'est pas encore déduit quand le corps est compilé", correct: true}
      - {text: "Le standard interdit toute récursion dans le corps d'une lambda", correct: false}
      - {text: "La variable est détruite avant le premier appel de la lambda", correct: false}
      - {text: "Le corps d'une lambda ne peut appeler que des fonctions `static`", correct: false}
    answer: "`auto f = [](...) { ... f(...) ... };` utilise `f` dans son propre initialiseur. La récursion elle-même est permise, par un autre chemin."
  - key: deducing-this
    format: course
    question: "Comment écrit-on une lambda récursive en C++23 ?"
    choices:
      - {text: "Avec `this auto self` en premier paramètre, puis des appels à `self`", correct: true}
      - {text: "Avec le mot-clé `recursive` placé après les crochets", correct: false}
      - {text: "Avec une capture `[this]`, puis des appels à `this`", correct: false}
      - {text: "Avec `[self]` dans les crochets, puis des appels à `self`", correct: false}
    answer: "C'est le paramètre objet explicite : la lambda se reçoit elle-même. L'appelant ne le passe pas : `fact(5)`."
  - key: std-function
    format: course
    question: "Quel est l'inconvénient d'une lambda récursive rangée dans une `std::function` ?"
    choices:
      - {text: "Chaque appel passe par une indirection, et la capture par référence peut devenir pendante", correct: true}
      - {text: "Elle ne peut pas recevoir de paramètres, seulement en capturer", correct: false}
      - {text: "Elle ne peut s'appeler elle-même qu'une seule fois", correct: false}
      - {text: "Elle ne compile qu'avec un compilateur C++23", correct: false}
    answer: "`std::function` efface le type : l'appel est indirect. Et la lambda capture la variable par référence : copiée ou renvoyée, elle désigne toujours l'original."
  - key: constexpr
    format: course
    question: "Depuis C++17, quand une lambda peut-elle être appelée dans une expression constante ?"
    choices:
      - {text: "Dès que son corps le permet : elle est implicitement `constexpr`", correct: true}
      - {text: "Seulement si elle est déclarée avec le mot-clé `static`", correct: false}
      - {text: "Seulement si elle ne prend aucun paramètre", correct: false}
      - {text: "Jamais : une lambda s'exécute toujours à l'exécution", correct: false}
    answer: "Aucun mot-clé n'est nécessaire. L'écrire, `[](int x) constexpr { ... }`, sert à faire vérifier que le corps est bien évaluable à la compilation."
  - key: vf-recursion
    format: true-false
    question: "Une lambda ne peut jamais être récursive."
    truth: false
    answer: "Elle ne peut pas se nommer, mais elle peut se recevoir : `this auto self` en C++23, ou un paramètre générique avant."
  - key: vf-appel
    format: true-false
    question: "Avec `[](this auto self, int n)`, l'appelant écrit `f(5)`, sans passer `self`."
    truth: true
    answer: "Le paramètre objet explicite est rempli par la lambda elle-même, comme `this` dans une fonction membre."
  - key: vf-retour
    format: true-false
    question: "Une lambda récursive doit en général écrire son type de retour."
    truth: true
    answer: "Le compilateur ne peut pas déduire le type d'un `return` qui appelle la lambda dont il cherche justement le type."
  - key: vf-constexpr-mot-cle
    format: true-false
    question: "Une lambda doit être marquée `constexpr` pour servir dans un `static_assert`."
    truth: false
    answer: "Depuis C++17, elle l'est implicitement quand son corps le permet."
  - key: qcm-cpp14
    format: multiple-choice
    question: "Avant C++23, comment appelle-t-on `auto f = [](auto&& self, int n) -> int { ... };` ?"
    choices:
      - {text: "`f(f, 5)`", correct: true}
      - {text: "`f(5)`", correct: false}
      - {text: "`f(this, 5)`", correct: false}
      - {text: "`f.self(5)`", correct: false}
    answer: "La lambda se reçoit en argument : l'appelant doit la lui passer, et le corps écrit `self(self, n - 1)`."
  - key: qcm-consteval
    format: multiple-choice
    question: "Quel mot-clé impose que chaque appel d'une lambda soit évalué à la compilation ?"
    choices:
      - {text: "`consteval`", correct: true}
      - {text: "`constexpr`", correct: false}
      - {text: "`const`", correct: false}
      - {text: "`constinit`", correct: false}
    answer: "`constexpr` permet l'évaluation à la compilation ; `consteval` (C++20) l'exige."
  - key: qcm-plus-simple
    format: multiple-choice
    question: "Une fonction récursive ne capture rien et sert dans tout le fichier. Quelle forme choisis-tu ?"
    choices:
      - {text: "Une fonction nommée ordinaire", correct: true}
      - {text: "Une lambda rangée dans une `std::function`", correct: false}
      - {text: "Une lambda avec `this auto self`", correct: false}
      - {text: "Une lambda qui se reçoit en argument", correct: false}
    answer: "Une fonction s'appelle elle-même sans artifice. La lambda récursive ne se justifie que par des captures, ou un usage purement local."
  - key: qcm-capture-std-function
    format: multiple-choice
    question: "Dans `std::function<int(int)> f = [...](int n) { return n <= 1 ? 1 : n * f(n - 1); };`, que met-on entre les crochets ?"
    choices:
      - {text: "`&f`", correct: true}
      - {text: "`f`", correct: false}
      - {text: "`this`", correct: false}
      - {text: "Rien", correct: false}
    answer: "La lambda doit capturer `f` par référence : par valeur, elle copierait une `std::function` encore vide."
  - key: trous-this-auto
    format: fill-in
    question: |-
      Complète le paramètre objet explicite (C++23) :
      ```cpp
      auto fact = [](___ auto self, int n) -> int {
          return n <= 1 ? 1 : n * self(n - 1);
      };
      ```
    blanks:
      - [this]
    answer: "`this auto self` : la lambda se reçoit elle-même."
  - key: trous-self
    format: fill-in
    question: |-
      Complète l'appel récursif :
      ```cpp
      auto somme = [](this auto self, int n) -> int {
          return n == 0 ? 0 : n + ___(n - 1);
      };
      ```
    blanks:
      - [self]
    answer: "On appelle `self`, le nom du paramètre objet."
  - key: trous-retour
    format: fill-in
    question: |-
      Complète pour donner à la lambda récursive son type de retour :
      ```cpp
      auto fib = [](this auto self, int n) ___ int {
          return n < 2 ? n : self(n - 1) + self(n - 2);
      };
      ```
    blanks:
      - ["->"]
    answer: "Le type de retour s'écrit après une flèche : il ne peut pas être déduit de l'appel récursif."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour que le compilateur vérifie que la lambda est évaluable à la compilation :
      ```cpp
      auto carre = [](int x) ___ { return x * x; };
      ```
    blanks:
      - [constexpr]
    answer: "Le mot-clé se place après les paramètres. Sans lui, la lambda est `constexpr` implicitement si son corps le permet."
  - key: code-factorielle
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto fact = [](this auto self, int n) -> int {
              return n <= 1 ? 1 : n * self(n - 1);
          };
          std::println("{} {}", fact(5), fact(0));
      }
      ```
    choices:
      - {text: "`120 1`", correct: true}
      - {text: "`120 0`", correct: false}
      - {text: "`15 1`", correct: false}
      - {text: "`24 1`", correct: false}
    answer: "`120 1` : 5 × 4 × 3 × 2 × 1. Pour 0, la condition d'arrêt renvoie 1."
    check:
      output: "120 1"
  - key: code-self-argument
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto somme = [](auto&& self, int n) -> int {
              return n == 0 ? 0 : n + self(self, n - 1);
          };
          std::println("{}", somme(somme, 4));
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`24`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`10` : la lambda se reçoit en argument, et se repasse à chaque appel. 4 + 3 + 2 + 1 + 0."
    check:
      output: "10"
  - key: code-capture
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int appels = 0;
          auto fib = [&appels](this auto self, int n) -> int {
              ++appels;
              return n < 2 ? n : self(n - 1) + self(n - 2);
          };
          const int valeur = fib(4);
          std::println("{} {}", valeur, appels);
      }
      ```
    choices:
      - {text: "`3 9`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`5 9`", correct: false}
      - {text: "`3 5`", correct: false}
    answer: "`3 9` : fib(4) vaut 3. La lambda capture le compteur : fib(4) déclenche neuf appels en tout, par double récursion."
    check:
      output: "3 9"
  - key: code-constexpr
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          auto carre = [](int x) { return x * x; };
          constexpr int taille = carre(3);
          std::array<int, taille> tableau{};
          static_assert(carre(4) == 16);
          std::println("{}", tableau.size());
      }
      ```
    choices:
      - {text: "`9`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`16`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9` : la lambda est implicitement `constexpr`. Son résultat sert de taille à un `std::array`, calculée à la compilation."
    check:
      output: "9"
  - key: bug-nom-propre
    format: bug-fix
    question: |-
      Le compilateur répond « use of 'fact' before deduction of 'auto' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto fact = [](int n) -> int {
              return n <= 1 ? 1 : n * fact(n - 1);
          };
          std::println("{}", fact(4));
      }
      ```
    choices:
      - {text: "Écrire `[](this auto self, int n) -> int`, et appeler `self(n - 1)`", correct: true}
      - {text: "Écrire `[fact](int n) -> int`, pour capturer la lambda par valeur", correct: false}
      - {text: "Écrire `[=](int n) -> int`, pour capturer tout par copie", correct: false}
      - {text: "Écrire `[](int n) -> auto`, pour laisser déduire le retour", correct: false}
    answer: |-
      ```cpp
      auto fact = [](this auto self, int n) -> int {
          return n <= 1 ? 1 : n * self(n - 1);
      };
      ```
      `fact` n'a pas encore de type dans son propre initialiseur : on ne peut ni l'appeler, ni la capturer. Le
      paramètre objet explicite donne à la lambda un nom pour elle-même.
  - key: bug-retour-non-deduit
    format: bug-fix
    question: |-
      Le compilateur refuse cette lambda : il ne peut pas déduire son type de retour avant l'appel récursif. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto somme = [](this auto self, int n) {
              return n == 0 ? 0 : n + self(n - 1);
          };
          std::println("{}", somme(3));
      }
      ```
    choices:
      - {text: "Écrire le type de retour : `[](this auto self, int n) -> int`", correct: true}
      - {text: "Écrire `[](this auto self, auto n)`, avec un paramètre générique", correct: false}
      - {text: "Écrire `return n + self(n);` dans le corps de la lambda", correct: false}
      - {text: "Écrire `[&](this auto self, int n)`, avec une capture par référence", correct: false}
    answer: |-
      ```cpp
      auto somme = [](this auto self, int n) -> int {
      ```
      Pour connaître le type du `return`, le compilateur doit connaître celui de `self(n - 1)`, donc celui de la
      lambda qu'il est en train de déduire. Écrit en toutes lettres, le cercle est rompu.
  - key: bug-std-function-valeur
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::bad_function_call`. Quelle correction est la bonne ?
      ```cpp
      #include <functional>
      #include <print>

      int main() {
          std::function<int(int)> fact;
          fact = [fact](int n) { return n <= 1 ? 1 : n * fact(n - 1); };
          std::println("{}", fact(4));
      }
      ```
    choices:
      - {text: "Capturer par référence : `[&fact]`", correct: true}
      - {text: "Capturer par déplacement : `[fact = std::move(fact)]`", correct: false}
      - {text: "Ne rien capturer : `[]`", correct: false}
      - {text: "Déclarer `fact` avec `const`", correct: false}
    answer: |-
      ```cpp
      fact = [&fact](int n) { return n <= 1 ? 1 : n * fact(n - 1); };
      ```
      Par valeur, la lambda copie `fact` au moment de sa création, quand elle est encore vide. L'appel récursif
      appelle cette copie vide. Par référence, il voit la `std::function` une fois remplie.
  - key: bug-self-oublie
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `somme(4)` : la lambda attend deux arguments. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto somme = [](auto&& self, int n) -> int {
              return n == 0 ? 0 : n + self(self, n - 1);
          };
          std::println("{}", somme(4));
      }
      ```
    choices:
      - {text: "Appeler `somme(somme, 4)`", correct: true}
      - {text: "Appeler `somme(this, 4)`", correct: false}
      - {text: "Appeler `somme(4, somme)`", correct: false}
      - {text: "Appeler `somme(&somme)(4)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", somme(somme, 4));
      ```
      Dans cette forme d'avant C++23, `self` est un paramètre ordinaire : l'appelant doit passer la lambda. Avec
      `this auto self`, il n'aurait pas à le faire.
