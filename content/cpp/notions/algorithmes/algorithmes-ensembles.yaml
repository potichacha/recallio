notion: algorithmes-ensembles
lesson: |-
  `<algorithm>` contient une famille d'algorithmes qui **réarrangent** une suite, et une autre qui traite des suites
  **triées** comme des ensembles.

  **Réarranger.**

  | Algorithme | Effet |
  |---|---|
  | `std::reverse(d, f)` | inverse l'ordre des éléments |
  | `std::rotate(d, milieu, f)` | fait de `milieu` le nouveau premier élément ; ce qui le précédait passe à la fin |
  | `std::unique(d, f)` | tasse la suite en retirant les doublons **voisins** ; renvoie la nouvelle fin |
  | `std::partition(d, f, p)` | place d'abord les éléments qui vérifient `p` ; renvoie la frontière |
  | `std::stable_partition` | la même chose, en gardant l'ordre relatif dans chaque groupe |
  | `std::shuffle(d, f, generateur)` | mélange au hasard |

  ```cpp
  std::vector<int> v{1, 2, 3, 4, 5};
  std::rotate(v.begin(), v.begin() + 2, v.end());    // 3 4 5 1 2
  ```

  **`std::unique` ne retire rien.** Comme `std::remove`, il ne peut pas changer la taille du conteneur : il tasse
  les éléments gardés au début, et renvoie un itérateur sur la **nouvelle fin logique**. On coupe ensuite avec
  `erase`. Et il ne voit que les doublons **voisins** : pour tous les supprimer, on **trie d'abord**.

  ```cpp
  std::sort(v.begin(), v.end());
  v.erase(std::unique(v.begin(), v.end()), v.end());
  ```

  **`std::partition`** renvoie l'itérateur du premier élément qui **ne vérifie pas** le prédicat. Il ne garantit
  pas l'ordre à l'intérieur de chaque groupe : pour cela, `std::stable_partition`.

  **Les opérations d'ensembles.** Elles travaillent sur deux suites **triées**, et écrivent le résultat, trié,
  dans une destination.

  | Algorithme | Résultat |
  |---|---|
  | `std::set_union` | les éléments de l'une ou de l'autre |
  | `std::set_intersection` | les éléments communs |
  | `std::set_difference` | ceux de la première qui ne sont pas dans la seconde |
  | `std::set_symmetric_difference` | ceux qui sont dans une seule des deux |
  | `std::includes` | `true` si la première contient tous les éléments de la seconde |
  | `std::merge` | la fusion des deux, doublons gardés |

  ```cpp
  std::vector<int> a{1, 2, 3, 4};
  std::vector<int> b{3, 4, 5};
  std::vector<int> communs;
  std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(communs));   // 3 4
  ```

  Deux exigences : les entrées sont **triées** (sinon le comportement est indéfini), et la destination a **de la
  place**, ou passe par `std::back_inserter`. Malgré leur nom, ces algorithmes n'exigent pas un `std::set` : un
  vecteur trié convient.

  Tous sont **linéaires**, sauf `std::stable_partition`, qui peut demander un peu plus.

  **En entretien** : « `std::unique` retire les doublons voisins et renvoie la nouvelle fin : je trie avant, et
  j'efface après. `std::rotate` décale circulairement, `std::partition` sépare selon un prédicat. Les `set_*`
  travaillent sur des suites triées, pas forcément des `std::set`, et écrivent dans une destination. »
cards:
  - key: unique
    format: course
    question: "Que fait `std::unique` sur un vecteur ?"
    choices:
      - {text: "Il tasse la suite en retirant les doublons voisins, et renvoie la nouvelle fin", correct: true}
      - {text: "Il retire tous les doublons du vecteur, et réduit sa taille", correct: false}
      - {text: "Il trie le vecteur, puis en retire tous les doublons", correct: false}
      - {text: "Il renvoie `true` si tous les éléments du vecteur sont différents", correct: false}
    answer: "Seuls les éléments égaux qui se suivent sont réduits à un. La taille ne change pas : on efface ensuite la fin avec `erase`."
  - key: rotate
    format: course
    question: "Que fait `std::rotate(debut, milieu, fin)` ?"
    choices:
      - {text: "Il fait de `milieu` le premier élément, et place à la fin ceux qui le précédaient", correct: true}
      - {text: "Il inverse l'ordre des éléments situés entre `debut` et `fin`", correct: false}
      - {text: "Il échange les éléments désignés par `debut` et par `milieu`", correct: false}
      - {text: "Il trie séparément les deux moitiés que délimite `milieu`", correct: false}
    answer: "C'est un décalage circulaire. `{1, 2, 3, 4, 5}` tourné autour du 3 devient `{3, 4, 5, 1, 2}`."
  - key: partition
    format: course
    question: "Que renvoie `std::partition(debut, fin, predicat)` ?"
    choices:
      - {text: "Un itérateur sur le premier élément qui ne vérifie pas le prédicat", correct: true}
      - {text: "Le nombre d'éléments qui vérifient le prédicat", correct: false}
      - {text: "Un booléen : `true` si la suite était déjà partagée", correct: false}
      - {text: "Un itérateur sur le plus petit élément de la suite", correct: false}
    answer: "Les éléments qui vérifient le prédicat sont placés d'abord. L'itérateur renvoyé marque la frontière entre les deux groupes."
  - key: ensembles-tries
    format: course
    question: "Qu'exigent `std::set_union` et `std::set_intersection` de leurs deux suites d'entrée ?"
    choices:
      - {text: "Qu'elles soient triées", correct: true}
      - {text: "Qu'elles soient des `std::set`", correct: false}
      - {text: "Qu'elles aient la même taille", correct: false}
      - {text: "Qu'elles n'aient aucun élément commun", correct: false}
    answer: "L'algorithme avance en parallèle dans les deux suites, ce qui suppose un ordre. Un vecteur trié convient ; sur des suites non triées, le comportement est indéfini."
  - key: vf-unique-taille
    format: true-false
    question: "`std::unique` réduit la taille du vecteur."
    truth: false
    answer: "Un algorithme ne peut pas changer la taille d'un conteneur. Il renvoie la nouvelle fin, et `erase` coupe le reste."
  - key: vf-reverse
    format: true-false
    question: "`std::reverse` inverse la suite en place."
    truth: true
    answer: "Les éléments sont échangés deux à deux, depuis les deux bouts. Il exige des itérateurs bidirectionnels."
  - key: vf-partition-ordre
    format: true-false
    question: "`std::partition` garde l'ordre relatif des éléments à l'intérieur de chaque groupe."
    truth: false
    answer: "Rien ne le garantit. `std::stable_partition` le fait."
  - key: vf-set-conteneur
    format: true-false
    question: "`std::set_intersection` ne s'applique qu'à des conteneurs `std::set`."
    truth: false
    answer: "Il lui faut deux intervalles triés, quel que soit le conteneur. Deux vecteurs triés conviennent."
  - key: qcm-difference
    format: multiple-choice
    question: "Quel algorithme donne les éléments de la première suite triée qui ne sont pas dans la seconde ?"
    choices:
      - {text: "`std::set_difference`", correct: true}
      - {text: "`std::set_intersection`", correct: false}
      - {text: "`std::set_union`", correct: false}
      - {text: "`std::includes`", correct: false}
    answer: "`std::set_difference(a, b)` : ce qui est dans `a` sans être dans `b`. L'ordre des deux suites compte."
  - key: qcm-contient
    format: multiple-choice
    question: "Quel algorithme dit si une suite triée contient tous les éléments d'une autre ?"
    choices:
      - {text: "`std::includes`", correct: true}
      - {text: "`std::contains`", correct: false}
      - {text: "`std::set_union`", correct: false}
      - {text: "`std::merge`", correct: false}
    answer: "`std::includes(a.begin(), a.end(), b.begin(), b.end())` renvoie un booléen."
  - key: qcm-stable
    format: multiple-choice
    question: "Tu veux placer les nombres pairs d'abord, en gardant l'ordre d'origine dans chaque groupe. Quel algorithme ?"
    choices:
      - {text: "`std::stable_partition`", correct: true}
      - {text: "`std::partition`", correct: false}
      - {text: "`std::rotate`", correct: false}
      - {text: "`std::unique`", correct: false}
    answer: "La version stable préserve l'ordre relatif à l'intérieur des deux groupes."
  - key: qcm-doublons
    format: multiple-choice
    question: "Que faut-il faire avant `std::unique` pour retirer tous les doublons d'un vecteur ?"
    choices:
      - {text: "Trier le vecteur", correct: true}
      - {text: "Inverser le vecteur", correct: false}
      - {text: "Réserver de la capacité", correct: false}
      - {text: "Mélanger le vecteur", correct: false}
    answer: "Le tri regroupe les valeurs égales : elles deviennent voisines, et `std::unique` les voit."
  - key: trous-reverse
    format: fill-in
    question: |-
      Complète pour inverser l'ordre des éléments :
      ```cpp
      std::___(v.begin(), v.end());
      ```
    blanks:
      - [reverse]
    answer: "`std::reverse` inverse la suite en place."
  - key: trous-rotate
    format: fill-in
    question: |-
      Complète pour que le troisième élément devienne le premier :
      ```cpp
      std::___(v.begin(), v.begin() + 2, v.end());
      ```
    blanks:
      - [rotate]
    answer: "`std::rotate` décale circulairement : l'élément du milieu passe en tête."
  - key: trous-intersection
    format: fill-in
    question: |-
      Complète pour ranger dans `communs` les éléments présents dans les deux vecteurs triés :
      ```cpp
      std::___(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(communs));
      ```
    blanks:
      - [set_intersection]
    answer: "`std::set_intersection` écrit les éléments communs, triés."
  - key: trous-partition
    format: fill-in
    question: |-
      Complète pour placer les nombres pairs au début :
      ```cpp
      auto frontiere = std::___(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
      ```
    blanks:
      - [partition, stable_partition]
    answer: "`std::partition` regroupe d'abord les éléments qui vérifient le prédicat, et renvoie la frontière."
  - key: code-rotate
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5};
          std::rotate(v.begin(), v.begin() + 2, v.end());
          std::reverse(v.begin(), v.begin() + 3);
          std::println("{} {} {} {} {}", v[0], v[1], v[2], v[3], v[4]);
      }
      ```
    choices:
      - {text: "`5 4 3 1 2`", correct: true}
      - {text: "`3 4 5 1 2`", correct: false}
      - {text: "`2 1 5 4 3`", correct: false}
      - {text: "`5 4 3 2 1`", correct: false}
    answer: "`5 4 3 1 2` : la rotation donne 3 4 5 1 2. L'inversion ne porte que sur les trois premiers éléments."
    check:
      output: "5 4 3 1 2"
  - key: code-unique
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 1, 2, 1, 1, 3};
          const auto fin = std::unique(v.begin(), v.end());
          std::println("{} {}", fin - v.begin(), v.size());
      }
      ```
    choices:
      - {text: "`4 6`", correct: true}
      - {text: "`3 6`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`3 3`", correct: false}
    answer: "`4 6` : seuls les doublons voisins sont réduits : 1, 2, 1, 3. La taille du vecteur n'a pas changé : `std::unique` ne fait que tasser."
    check:
      output: "4 6"
  - key: code-partition
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5, 6};
          const auto frontiere = std::stable_partition(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
          std::println("{} {} {}", frontiere - v.begin(), v[0], *frontiere);
      }
      ```
    choices:
      - {text: "`3 2 1`", correct: true}
      - {text: "`3 1 4`", correct: false}
      - {text: "`2 2 1`", correct: false}
      - {text: "`3 6 5`", correct: false}
    answer: "`3 2 1` : les trois pairs passent devant, dans leur ordre : 2 4 6 1 3 5. La frontière désigne le premier impair, 1."
    check:
      output: "3 2 1"
  - key: code-ensembles
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> a{1, 2, 3, 4};
          const std::vector<int> b{3, 4, 5};
          std::vector<int> communs;
          std::vector<int> seuls;
          std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(communs));
          std::set_difference(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(seuls));
          std::println("{} {} {}", communs.size(), seuls.size(), seuls.back());
      }
      ```
    choices:
      - {text: "`2 2 2`", correct: true}
      - {text: "`2 3 5`", correct: false}
      - {text: "`5 2 2`", correct: false}
      - {text: "`2 1 5`", correct: false}
    answer: "`2 2 2` : 3 et 4 sont communs. La différence garde ce qui n'est que dans `a` : 1 et 2."
    check:
      output: "2 2 2"
  - key: bug-unique-sans-erase
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3` après le retrait des doublons. Il affiche `5`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 1, 2, 3, 3};
          std::unique(v.begin(), v.end());
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Écrire `v.erase(std::unique(v.begin(), v.end()), v.end());`", correct: true}
      - {text: "Écrire `std::unique(v.begin(), v.end());` une seconde fois", correct: false}
      - {text: "Écrire `v.resize(std::unique(v.begin(), v.end()));`", correct: false}
      - {text: "Écrire `std::reverse(v.begin(), v.end());` avant `std::unique`", correct: false}
    answer: |-
      ```cpp
      v.erase(std::unique(v.begin(), v.end()), v.end());
      ```
      `std::unique` tasse les éléments gardés et renvoie la nouvelle fin, sans toucher à la taille. C'est `erase`
      qui supprime le reste.
  - key: bug-intersection-non-triee
    format: bug-fix
    question: |-
      Ce programme devrait trouver deux éléments communs et afficher `2`. Il affiche `1` : les entrées ne sont pas
      triées. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a{4, 1, 3};
          std::vector<int> b{3, 4};
          std::vector<int> communs;
          std::set_intersection(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(communs));
          std::println("{}", communs.size());
      }
      ```
    choices:
      - {text: "Trier `a` et `b` avec `std::sort` avant l'appel", correct: true}
      - {text: "Trier `communs` avec `std::sort` après l'appel", correct: false}
      - {text: "Échanger `a` et `b` dans les arguments de l'appel", correct: false}
      - {text: "Appeler `communs.reserve(2);` avant l'appel", correct: false}
    answer: |-
      ```cpp
      std::sort(a.begin(), a.end());
      std::sort(b.begin(), b.end());
      ```
      Les algorithmes `set_*` supposent deux suites triées. Sinon, le comportement est indéfini : ici, un élément
      commun est manqué.
  - key: bug-destination-vide
    format: bug-fix
    question: |-
      Ce programme écrit le résultat de l'union dans un vecteur vide : il écrit hors bornes. Quelle correction est
      la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> a{1, 2};
          const std::vector<int> b{2, 3};
          std::vector<int> tous;
          std::set_union(a.begin(), a.end(), b.begin(), b.end(), tous.begin());
          std::println("{}", tous.size());
      }
      ```
    choices:
      - {text: "Passer `std::back_inserter(tous)` comme destination", correct: true}
      - {text: "Passer `tous.end()` comme destination", correct: false}
      - {text: "Passer `a.begin()` comme destination", correct: false}
      - {text: "Appeler `tous.clear();` avant l'appel", correct: false}
    answer: |-
      ```cpp
      std::set_union(a.begin(), a.end(), b.begin(), b.end(), std::back_inserter(tous));
      ```
      L'algorithme affecte dans la destination, sans l'agrandir. `std::back_inserter` (en-tête `<iterator>`) fait
      de chaque écriture un `push_back`.
  - key: bug-partition-ordre
    format: bug-fix
    question: |-
      Ce programme place les nombres pairs en tête, et devrait afficher les impairs dans leur ordre d'origine,
      `1 3 5`. Il affiche `3 5 1`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5, 6};
          const auto frontiere = std::partition(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
          for (auto it = frontiere; it != v.end(); ++it) {
              std::print("{} ", *it);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Appeler `std::stable_partition`", correct: true}
      - {text: "Appeler `std::partition` deux fois", correct: false}
      - {text: "Appeler `std::rotate` après la partition", correct: false}
      - {text: "Appeler `std::unique` après la partition", correct: false}
    answer: |-
      ```cpp
      const auto frontiere = std::stable_partition(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
      ```
      `std::partition` sépare les deux groupes sans promettre leur ordre interne. La version stable garde l'ordre
      relatif des éléments.
