notion: erase-remove
lesson: |-
  Retirer d'un vecteur tous les éléments qui vérifient une condition se fait, depuis C++20, en une ligne :

  ```cpp
  std::vector<int> v{1, -2, 3, -4};
  std::erase_if(v, [](int x) { return x < 0; });   // v contient 1, 3
  std::erase(v, 3);                                // retire tous les 3
  ```

  Les deux fonctions renvoient le **nombre d'éléments retirés**. Elles existent pour `vector`, `deque`, `string`,
  `list` ; `std::erase_if` existe aussi pour `map`, `set` et leurs versions `unordered_`.

  **Avant C++20 : l'idiome erase-remove.** On le rencontre dans tout code plus ancien, et en entretien.

  ```cpp
  v.erase(std::remove_if(v.begin(), v.end(), [](int x) { return x < 0; }), v.end());
  ```

  Il se fait en deux temps, parce que **`std::remove` ne retire rien**.

  **Ce que fait `std::remove`.** Un algorithme ne reçoit que des itérateurs : il ne peut pas changer la **taille**
  d'un conteneur. `std::remove` se contente de **tasser** vers le début les éléments à garder, et renvoie un
  itérateur sur la **nouvelle fin logique**.

  ```
  avant :              1  -2   3  -4
  après remove_if :    1   3   ?   ?        (taille toujours 4)
                               ^
                         itérateur renvoyé
  ```

  Les éléments situés après cet itérateur ont une valeur **quelconque**. C'est `v.erase(nouvelle_fin, v.end())` qui
  les supprime vraiment.

  **L'erreur classique** est d'oublier le second argument de `erase` :

  ```cpp
  v.erase(std::remove(v.begin(), v.end(), 3));   // n'efface qu'UN élément
  ```

  Avec un seul itérateur, `erase` retire un seul élément. Et si rien n'a été trouvé, `remove` renvoie `end()` :
  `erase(end())` est un comportement indéfini.

  **Pourquoi pas une boucle de `erase` ?** Chaque `erase` décale tous les éléments suivants : la boucle coûte
  O(n²). L'idiome, comme `std::erase_if`, ne déplace chaque élément qu'une fois : **O(n)**.

  **Même schéma pour les doublons.** `std::unique` tasse les éléments en retirant les doublons **voisins**, et
  renvoie la nouvelle fin :

  ```cpp
  std::sort(v.begin(), v.end());
  v.erase(std::unique(v.begin(), v.end()), v.end());
  ```

  **En entretien** : « `std::remove` ne change pas la taille : il tasse les éléments gardés et renvoie la nouvelle
  fin, puis `erase` coupe le reste. En C++20, j'écris `std::erase_if(v, predicat)`, qui fait les deux en O(n). »
cards:
  - key: remove-ne-retire-pas
    format: course
    question: "Que fait `std::remove(v.begin(), v.end(), 3)` sur un vecteur ?"
    choices:
      - {text: "Il tasse au début les éléments différents de 3, et renvoie la nouvelle fin logique", correct: true}
      - {text: "Il retire du vecteur tous les éléments égaux à 3, et réduit sa taille d'autant", correct: false}
      - {text: "Il retire du vecteur le premier élément égal à 3, et renvoie sa position", correct: false}
      - {text: "Il remplace par zéro tous les éléments égaux à 3, sans changer la taille", correct: false}
    answer: "La taille du vecteur ne change pas. Les éléments à garder sont déplacés vers le début ; ce qui suit l'itérateur renvoyé est à effacer."
  - key: pourquoi-deux-temps
    format: course
    question: "Pourquoi `std::remove` ne peut-il pas réduire la taille du vecteur ?"
    choices:
      - {text: "Il ne reçoit que des itérateurs : il n'a pas accès au conteneur", correct: true}
      - {text: "Le vecteur est verrouillé pendant l'exécution d'un algorithme", correct: false}
      - {text: "La taille d'un vecteur est fixée à sa construction", correct: false}
      - {text: "Il garde les éléments retirés pour pouvoir les restaurer", correct: false}
    answer: "Un algorithme travaille sur un intervalle, quel que soit le conteneur derrière. Seule une fonction membre comme `erase` peut changer la taille."
  - key: version-cpp20
    format: course
    question: "Comment retire-t-on tous les nombres négatifs d'un vecteur en C++20 ?"
    choices:
      - {text: "`std::erase_if(v, [](int x) { return x < 0; });`", correct: true}
      - {text: "`std::remove_if(v, [](int x) { return x < 0; });`", correct: false}
      - {text: "`v.remove_if([](int x) { return x < 0; });`", correct: false}
      - {text: "`v.erase([](int x) { return x < 0; });`", correct: false}
    answer: "`std::erase_if` prend le conteneur et un prédicat, retire les éléments, et renvoie leur nombre. `std::erase(v, valeur)` fait de même pour une valeur."
  - key: cout
    format: course
    question: "Pourquoi l'idiome erase-remove est-il plus rapide qu'une boucle d'appels à `erase` ?"
    choices:
      - {text: "Chaque élément n'est déplacé qu'une fois : O(n), contre O(n²) pour la boucle", correct: true}
      - {text: "Il trie le vecteur avant de retirer les éléments, ce qui les regroupe", correct: false}
      - {text: "Il retire les éléments dans plusieurs threads à la fois", correct: false}
      - {text: "Il ne libère pas la mémoire des éléments retirés", correct: false}
    answer: "Chaque `erase` au milieu décale toute la fin du vecteur. Avec beaucoup d'éléments à retirer, la boucle devient quadratique."
  - key: vf-taille
    format: true-false
    question: "Après `std::remove(v.begin(), v.end(), 3);`, `v.size()` a diminué."
    truth: false
    answer: "`std::remove` ne change pas la taille. Il faut ensuite appeler `erase` avec l'itérateur qu'il renvoie."
  - key: vf-erase-if-retour
    format: true-false
    question: "`std::erase_if` renvoie le nombre d'éléments retirés."
    truth: true
    answer: "Comme `std::erase`. On sait ainsi si quelque chose a été retiré, sans comparer les tailles."
  - key: vf-unique-non-trie
    format: true-false
    question: "`std::unique` retire tous les doublons d'un vecteur, trié ou non."
    truth: false
    answer: "Il ne retire que les doublons voisins. On trie d'abord, pour que les valeurs égales se suivent."
  - key: vf-ordre-conserve
    format: true-false
    question: "`std::remove_if` garde l'ordre relatif des éléments conservés."
    truth: true
    answer: Les éléments gardés sont tassés vers le début, dans leur ordre de départ.
  - key: qcm-idiome
    format: multiple-choice
    question: "Quelle ligne retire correctement tous les `0` du vecteur `v`, avant C++20 ?"
    choices:
      - {text: "`v.erase(std::remove(v.begin(), v.end(), 0), v.end());`", correct: true}
      - {text: "`v.erase(std::remove(v.begin(), v.end(), 0));`", correct: false}
      - {text: "`std::remove(v.begin(), v.end(), 0);`", correct: false}
      - {text: "`v.erase(v.begin(), std::remove(v.begin(), v.end(), 0));`", correct: false}
    answer: "`erase` reçoit l'intervalle à supprimer : de la nouvelle fin logique à la fin réelle. Avec un seul argument, il n'efface qu'un élément."
  - key: qcm-doublons
    format: multiple-choice
    question: "Quelle suite d'appels laisse dans `v` ses valeurs sans aucun doublon ?"
    choices:
      - {text: "`std::sort`, puis `v.erase(std::unique(...), v.end())`", correct: true}
      - {text: "`v.erase(std::unique(...), v.end())`, puis `std::sort`", correct: false}
      - {text: "`std::unique` seul, sans `std::sort` ni `v.erase`", correct: false}
      - {text: "`std::sort` seul", correct: false}
    answer: "Le tri regroupe les valeurs égales ; `std::unique` tasse en ne gardant qu'un exemplaire de chaque groupe ; `erase` coupe la fin."
  - key: qcm-erase-valeur
    format: multiple-choice
    question: "Que fait `std::erase(v, 7);` en C++20 ?"
    choices:
      - {text: "Il retire du vecteur tous les éléments égaux à 7", correct: true}
      - {text: "Il retire du vecteur l'élément d'indice 7", correct: false}
      - {text: "Il retire du vecteur les sept premiers éléments", correct: false}
      - {text: "Il retire du vecteur le premier élément égal à 7", correct: false}
    answer: "`std::erase` compare chaque élément à la valeur, et retire toutes les occurrences. Pour un indice : `v.erase(v.begin() + 7)`."
  - key: qcm-fin-logique
    format: multiple-choice
    question: "Que contiennent les éléments situés après l'itérateur renvoyé par `std::remove` ?"
    choices:
      - {text: "Des valeurs quelconques, à effacer", correct: true}
      - {text: "Les éléments retirés, dans leur ordre de départ", correct: false}
      - {text: "Des zéros", correct: false}
      - {text: "Rien : ces positions n'existent plus", correct: false}
    answer: "Le standard ne dit pas ce qu'ils valent : ce sont des restes. On ne les lit pas, on les supprime avec `erase`."
  - key: code-erase-if
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, -2, 3, -4, 5};
          const auto retires = std::erase_if(v, [](int x) { return x < 0; });
          std::println("{} {} {}", retires, v.size(), v[1]);
      }
      ```
    choices:
      - {text: "`2 3 3`", correct: true}
      - {text: "`2 5 -2`", correct: false}
      - {text: "`3 2 3`", correct: false}
      - {text: "`2 3 -2`", correct: false}
    answer: "`2 3 3` : deux négatifs retirés, il reste 1, 3, 5. L'élément d'indice 1 est maintenant 3."
    check:
      output: "2 3 3"
  - key: code-remove-seul
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{7, 0, 8, 0, 9};
          auto fin = std::remove(v.begin(), v.end(), 0);
          std::println("{} {} {}", v.size(), fin - v.begin(), v[1]);
      }
      ```
    choices:
      - {text: "`5 3 8`", correct: true}
      - {text: "`3 3 8`", correct: false}
      - {text: "`5 3 0`", correct: false}
      - {text: "`3 5 8`", correct: false}
    answer: "`5 3 8` : `std::remove` n'a pas changé la taille. Il a tassé 7, 8, 9 au début, et renvoie la nouvelle fin logique, à l'indice 3."
    check:
      output: "5 3 8"
  - key: code-idiome
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 1, 4, 2, 4};
          v.erase(std::remove(v.begin(), v.end(), 4), v.end());
          std::println("{} {} {}", v.size(), v[0], v[1]);
      }
      ```
    choices:
      - {text: "`2 1 2`", correct: true}
      - {text: "`5 1 2`", correct: false}
      - {text: "`4 1 4`", correct: false}
      - {text: "`2 4 4`", correct: false}
    answer: "`2 1 2` : `remove` tasse 1 et 2 au début, `erase` supprime le reste. Les trois 4 ont disparu."
    check:
      output: "2 1 2"
  - key: code-unique
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{3, 1, 3, 1, 2};
          std::sort(v.begin(), v.end());
          v.erase(std::unique(v.begin(), v.end()), v.end());
          std::println("{} {} {}", v.size(), v.front(), v.back());
      }
      ```
    choices:
      - {text: "`3 1 3`", correct: true}
      - {text: "`5 1 3`", correct: false}
      - {text: "`3 3 2`", correct: false}
      - {text: "`2 1 3`", correct: false}
    answer: "`3 1 3` : trié, le vecteur vaut 1, 1, 2, 3, 3. `unique` ne garde qu'un exemplaire de chaque : 1, 2, 3."
    check:
      output: "3 1 3"
  - key: bug-remove-sans-erase
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2` après avoir retiré les zéros. Il affiche `4`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 0, 6, 0};
          std::remove(v.begin(), v.end(), 0);
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Écrire `std::erase(v, 0);` à la place de l'appel à `std::remove`", correct: true}
      - {text: "Appeler `std::remove` deux fois de suite, une par zéro", correct: false}
      - {text: "Appeler `v.shrink_to_fit();` après l'appel à `std::remove`", correct: false}
      - {text: "Écrire `std::remove(v.begin(), v.end(), 0, 0);`", correct: false}
    answer: |-
      ```cpp
      std::erase(v, 0);
      ```
      `std::remove` tasse les éléments, sans changer la taille. `std::erase` (C++20) retire vraiment ; avant, on
      écrivait `v.erase(std::remove(v.begin(), v.end(), 0), v.end());`.
  - key: bug-erase-un-argument
    format: bug-fix
    question: |-
      Ce programme devrait retirer tous les zéros et afficher `2`. Il affiche `3`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 0, 6, 0};
          v.erase(std::remove(v.begin(), v.end(), 0));
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Passer `v.end()` en second argument de `erase`", correct: true}
      - {text: "Passer `v.begin()` en second argument de `erase`", correct: false}
      - {text: "Passer `0` en second argument de `erase`", correct: false}
      - {text: "Appeler `v.erase` avant `std::remove`", correct: false}
    answer: |-
      ```cpp
      v.erase(std::remove(v.begin(), v.end(), 0), v.end());
      ```
      Avec un seul itérateur, `erase` ne retire qu'un élément. Il faut lui donner l'intervalle entier : de la
      nouvelle fin logique à la fin du vecteur.
  - key: bug-unique-sans-tri
    format: bug-fix
    question: |-
      Ce programme devrait retirer les doublons et afficher `2`. Il affiche `4`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 1, 2};
          v.erase(std::unique(v.begin(), v.end()), v.end());
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Trier le vecteur avec `std::sort` avant d'appeler `std::unique`", correct: true}
      - {text: "Trier le vecteur avec `std::sort` après l'appel à `v.erase`", correct: false}
      - {text: "Appeler `std::unique` deux fois de suite sur le vecteur", correct: false}
      - {text: "Remplacer `std::unique` par `std::remove` dans l'appel", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end());
      v.erase(std::unique(v.begin(), v.end()), v.end());
      ```
      `std::unique` ne retire que les doublons **voisins**. Dans 1, 2, 1, 2, aucun élément n'est égal à son voisin.
      Une fois trié (1, 1, 2, 2), il n'en reste que deux.
  - key: bug-boucle-erase
    format: bug-fix
    question: |-
      Ce programme devrait retirer tous les nombres pairs et afficher `1`. Il affiche `2` : un pair est resté.
      Quelle correction est la plus simple ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{2, 4, 5};
          for (std::size_t i = 0; i < v.size(); ++i) {
              if (v[i] % 2 == 0) {
                  v.erase(v.begin() + i);
              }
          }
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Remplacer la boucle par `std::erase_if(v, [](int x) { return x % 2 == 0; });`", correct: true}
      - {text: "Remplacer `++i` par `i += 2` dans l'en-tête de la boucle", correct: false}
      - {text: "Remplacer `v.erase(v.begin() + i)` par `v.erase(v.begin())`", correct: false}
      - {text: "Remplacer `i < v.size()` par `i <= v.size()` dans la condition", correct: false}
    answer: |-
      ```cpp
      std::erase_if(v, [](int x) { return x % 2 == 0; });
      ```
      Après l'effacement de 2, le 4 glisse à l'indice 0, mais `i` passe à 1 : il est sauté. `std::erase_if` n'a pas
      ce piège, et ne déplace chaque élément qu'une fois.
  - key: trous-erase-if
    format: fill-in
    question: |-
      Complète pour retirer tous les nombres négatifs (C++20) :
      ```cpp
      std::___(v, [](int x) { return x < 0; });
      ```
    blanks:
      - [erase_if]
    answer: "`std::erase_if` prend le conteneur et un prédicat."
  - key: trous-fin
    format: fill-in
    question: |-
      Complète l'idiome erase-remove :
      ```cpp
      v.erase(std::remove(v.begin(), v.end(), 0), v.___());
      ```
    blanks:
      - [end]
    answer: "`erase` supprime de la nouvelle fin logique jusqu'à `v.end()`."
  - key: trous-remove-if
    format: fill-in
    question: |-
      Complète l'idiome pour retirer les éléments qui vérifient le prédicat :
      ```cpp
      v.erase(std::___(v.begin(), v.end(), est_vide), v.end());
      ```
    blanks:
      - [remove_if]
    answer: "`std::remove_if` tasse les éléments qui ne vérifient pas le prédicat, et renvoie la nouvelle fin."
  - key: trous-unique
    format: fill-in
    question: |-
      Complète pour ne garder qu'un exemplaire de chaque valeur :
      ```cpp
      std::sort(v.begin(), v.end());
      v.erase(std::___(v.begin(), v.end()), v.end());
      ```
    blanks:
      - [unique]
    answer: "`std::unique` retire les doublons voisins ; le tri les a regroupés."
