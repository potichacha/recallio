notion: lambdas-mutable-init
lesson: |-
  Trois écritures complètent les captures de base : `mutable`, la capture **avec initialisation**, et son usage
  pour capturer **par déplacement**.

  **`mutable` : modifier sa copie.** Une variable capturée par valeur est **constante** dans la lambda. `mutable`
  lève cette constance : la lambda peut modifier **sa propre copie**, qui garde sa valeur d'un appel à l'autre.
  L'original, lui, ne change pas.

  ```cpp
  int n = 0;
  auto compteur = [n]() mutable { return ++n; };
  compteur();    // 1
  compteur();    // 2
  // n vaut toujours 0
  ```

  Avec `mutable`, les parenthèses des paramètres sont nécessaires avant C++23, même vides.

  La raison : une lambda est un objet, dont l'`operator()` est **`const`** par défaut. `mutable` retire ce `const`.

  **La capture avec initialisation (C++14).** On crée, dans les crochets, une **nouvelle variable** propre à la
  lambda, initialisée par une expression quelconque :

  ```cpp
  auto f = [total = 0](int x) mutable { total += x; return total; };
  auto g = [double_de_n = n * 2] { return double_de_n; };
  auto h = [&r = objet.membre] { return r; };       // une référence nommée
  ```

  Son type est déduit, comme avec `auto`. L'expression est évaluée **une fois**, à la création de la lambda.

  **Capturer par déplacement.** C'est l'usage principal. Un type qui ne se copie pas, comme `std::unique_ptr`, ne
  peut pas être capturé par valeur. On le **déplace** dans la lambda :

  ```cpp
  auto p = std::make_unique<Donnees>();
  auto tache = [p = std::move(p)] { utiliser(*p); };
  // p est maintenant nul : la lambda possède les données
  ```

  C'est aussi la façon d'éviter la copie d'un gros objet qu'on n'utilisera plus : `[v = std::move(v)]`.

  **Conséquences.**

  - Une lambda qui a capturé un `std::unique_ptr` **ne se copie plus** : elle se déplace seulement. Elle ne peut
    donc pas être rangée dans une `std::function`, qui exige un appelable copiable ; il faut
    `std::move_only_function` (C++23).
  - Chaque **copie** d'une lambda `mutable` a son propre état. Les algorithmes prennent leurs foncteurs par valeur :
    une lambda à état passée à un algorithme ne modifie pas l'original.

  **Capturer `this` par copie.** `[*this]` (C++17) capture une copie de l'objet ; `[self = *this]` fait de même
  avec un nom.

  **En entretien** : « `mutable` permet à la lambda de modifier ses copies capturées, sans toucher aux originaux.
  La capture avec initialisation, `[x = expr]`, crée une variable propre à la lambda ; avec `std::move`, elle
  capture par déplacement un `std::unique_ptr` ou un gros objet. »
cards:
  - key: mutable
    format: course
    question: "Que permet le mot-clé `mutable` sur une lambda ?"
    choices:
      - {text: "De modifier, dans la lambda, ses propres copies des variables capturées par valeur", correct: true}
      - {text: "De modifier, depuis la lambda, les variables d'origine capturées par valeur", correct: false}
      - {text: "De changer le type de retour de la lambda d'un appel à l'autre", correct: false}
      - {text: "De copier la lambda dans plusieurs threads sans synchronisation", correct: false}
    answer: "Sans `mutable`, une capture par valeur est constante. Avec, la lambda modifie sa copie, qui persiste entre les appels ; l'original reste intact."
  - key: pourquoi-const
    format: course
    question: "Pourquoi une variable capturée par valeur est-elle constante par défaut dans la lambda ?"
    choices:
      - {text: "L'`operator()` de l'objet généré est `const` par défaut", correct: true}
      - {text: "La variable est copiée dans une zone de mémoire protégée", correct: false}
      - {text: "La variable est capturée par référence constante", correct: false}
      - {text: "La lambda est évaluée à la compilation", correct: false}
    answer: "Une lambda est un objet dont les captures sont les membres. Son `operator()` étant `const`, il ne peut pas les modifier ; `mutable` retire ce `const`."
  - key: init-capture
    format: course
    question: "Que fait la capture `[total = 0]` ?"
    choices:
      - {text: "Elle crée une variable `total`, propre à la lambda, initialisée à 0", correct: true}
      - {text: "Elle capture la variable locale `total`, et la remet à 0", correct: false}
      - {text: "Elle compare la variable locale `total` à 0", correct: false}
      - {text: "Elle donne à `total` la valeur 0 à chaque appel de la lambda", correct: false}
    answer: "C'est une capture avec initialisation : aucune variable `total` n'a besoin d'exister dehors. L'initialisation a lieu une fois, à la création de la lambda."
  - key: deplacement
    format: course
    question: "Comment une lambda capture-t-elle un `std::unique_ptr` nommé `p` ?"
    choices:
      - {text: "Par déplacement : `[p = std::move(p)]`", correct: true}
      - {text: "Par valeur : `[p]`", correct: false}
      - {text: "Par copie de tout : `[=]`", correct: false}
      - {text: "Par déplacement : `[std::move(p)]`", correct: false}
    answer: "Un `std::unique_ptr` ne se copie pas : `[p]` et `[=]` ne compilent pas. La capture avec initialisation le déplace dans la lambda, qui en devient propriétaire."
  - key: vf-original
    format: true-false
    question: "Une lambda `mutable` qui incrémente une variable capturée par valeur modifie la variable d'origine."
    truth: false
    answer: "Elle modifie sa copie. Pour toucher à l'original, il faut une capture par référence."
  - key: vf-etat
    format: true-false
    question: "La copie modifiée par une lambda `mutable` garde sa valeur d'un appel à l'autre."
    truth: true
    answer: "La copie est un membre de l'objet lambda : elle vit aussi longtemps que lui."
  - key: vf-copiable
    format: true-false
    question: "Une lambda qui a capturé un `std::unique_ptr` par déplacement peut être copiée."
    truth: false
    answer: "Elle contient un membre non copiable : elle ne peut qu'être déplacée."
  - key: vf-une-fois
    format: true-false
    question: "L'expression d'une capture avec initialisation est évaluée à chaque appel de la lambda."
    truth: false
    answer: "Elle est évaluée une seule fois, à la création de la lambda."
  - key: qcm-compteur
    format: multiple-choice
    question: "Quelle lambda renvoie 1, puis 2, puis 3 à ses appels successifs, sans variable extérieure ?"
    choices:
      - {text: "`[n = 0]() mutable { return ++n; }`", correct: true}
      - {text: "`[n = 0]() { return ++n; }`", correct: false}
      - {text: "`[]() mutable { int n = 0; return ++n; }`", correct: false}
      - {text: "`[n = 0]() mutable { return n + 1; }`", correct: false}
    answer: "Il faut un état propre à la lambda (`n = 0`), et `mutable` pour le modifier. Une variable locale au corps repart de 0 à chaque appel."
  - key: qcm-reference-nommee
    format: multiple-choice
    question: "Quelle capture crée, dans la lambda, une référence `r` vers `config.seuil` ?"
    choices:
      - {text: "`[&r = config.seuil]`", correct: true}
      - {text: "`[r = config.seuil]`", correct: false}
      - {text: "`[&config.seuil]`", correct: false}
      - {text: "`[r& = config.seuil]`", correct: false}
    answer: "Le `&` devant le nom fait de la variable capturée une référence. Sans lui, c'est une copie. On ne peut pas capturer directement un membre d'un autre objet."
  - key: qcm-copie-this
    format: multiple-choice
    question: "Quelle capture donne à la lambda une copie de l'objet courant ?"
    choices:
      - {text: "`[*this]`", correct: true}
      - {text: "`[this]`", correct: false}
      - {text: "`[&]`", correct: false}
      - {text: "`[&this]`", correct: false}
    answer: "`[*this]` (C++17) copie l'objet : la lambda reste valable après sa destruction. `[this]` ne capture que le pointeur."
  - key: qcm-std-function
    format: multiple-choice
    question: "Pourquoi une lambda qui capture un `std::unique_ptr` ne peut-elle pas être rangée dans une `std::function` ?"
    choices:
      - {text: "`std::function` exige un appelable copiable", correct: true}
      - {text: "`std::function` n'accepte que les fonctions libres", correct: false}
      - {text: "`std::function` n'accepte pas les lambdas `mutable`", correct: false}
      - {text: "`std::function` ne peut pas contenir de pointeur", correct: false}
    answer: "La lambda n'est que déplaçable. C++23 ajoute `std::move_only_function` pour ce cas."
  - key: trous-mutable
    format: fill-in
    question: |-
      Complète pour que la lambda puisse modifier sa copie de `n` :
      ```cpp
      int n = 0;
      auto suivant = [n]() ___ { return ++n; };
      ```
    blanks:
      - [mutable]
    answer: "`mutable` rend modifiables les captures par valeur."
  - key: trous-move
    format: fill-in
    question: |-
      Complète pour déplacer le pointeur dans la lambda :
      ```cpp
      auto p = std::make_unique<int>(5);
      auto lire = [p = std::___(p)] { return *p; };
      ```
    blanks:
      - [move]
    answer: "`[p = std::move(p)]` capture par déplacement."
  - key: trous-init
    format: fill-in
    question: |-
      Complète pour créer dans la lambda une variable `total` qui part de zéro :
      ```cpp
      auto cumuler = [total ___ 0](int x) mutable { total += x; return total; };
      ```
    blanks:
      - ["="]
    answer: "La capture avec initialisation s'écrit `nom = expression`."
  - key: trous-this
    format: fill-in
    question: |-
      Complète pour capturer une copie de l'objet courant :
      ```cpp
      auto tache = [___this] { return valeur_; };
      ```
    blanks:
      - ["*"]
    answer: "`[*this]` copie l'objet dans la lambda."
  - key: code-mutable
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 10;
          auto suivant = [n]() mutable { return ++n; };
          suivant();
          suivant();
          std::println("{} {}", suivant(), n);
      }
      ```
    choices:
      - {text: "`13 10`", correct: true}
      - {text: "`11 10`", correct: false}
      - {text: "`13 13`", correct: false}
      - {text: "`11 11`", correct: false}
    answer: "`13 10` : la lambda incrémente sa copie, qui garde sa valeur entre les appels : 11, 12, 13. La variable `n` d'origine vaut toujours 10."
    check:
      output: "13 10"
  - key: code-copie-de-lambda
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto a = [n = 0]() mutable { return ++n; };
          a();
          a();
          auto b = a;
          const int x = a();
          const int y = b();
          std::println("{} {} {}", x, y, b());
      }
      ```
    choices:
      - {text: "`3 3 4`", correct: true}
      - {text: "`3 4 5`", correct: false}
      - {text: "`3 1 2`", correct: false}
      - {text: "`1 1 2`", correct: false}
    answer: "`3 3 4` : `b` est une copie de `a`, prise quand son compteur valait 2. Chacune a ensuite son propre état : `a` passe à 3, `b` à 3 puis 4."
    check:
      output: "3 3 4"
  - key: code-move
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <utility>

      int main() {
          auto p = std::make_unique<int>(42);
          auto lire = [q = std::move(p)] { return *q; };
          std::println("{} {}", p == nullptr, lire());
      }
      ```
    choices:
      - {text: "`true 42`", correct: true}
      - {text: "`false 42`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true 42` : le pointeur a été déplacé dans la lambda, qui possède l'entier. `p` est devenu nul."
    check:
      output: "true 42"
  - key: code-init-une-fois
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 2;
          auto f = [double_de_n = n * 2] { return double_de_n; };
          n = 100;
          std::println("{} {}", f(), f() + n);
      }
      ```
    choices:
      - {text: "`4 104`", correct: true}
      - {text: "`200 300`", correct: false}
      - {text: "`4 8`", correct: false}
      - {text: "`200 104`", correct: false}
    answer: "`4 104` : `n * 2` est calculé une fois, à la création de la lambda, quand `n` valait 2. Changer `n` ensuite n'y change rien."
    check:
      output: "4 104"
  - key: bug-sans-mutable
    format: bug-fix
    question: |-
      Le compilateur répond « increment of read-only variable 'n' ». La lambda doit compter ses propres appels.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto compteur = [n = 0]() { return ++n; };
          compteur();
          std::println("{}", compteur());
      }
      ```
    choices:
      - {text: "Ajouter `mutable` après les parenthèses de la lambda", correct: true}
      - {text: "Ajouter `const` après les parenthèses de la lambda", correct: false}
      - {text: "Écrire `n++` à la place de `++n`", correct: false}
      - {text: "Écrire `[n == 0]` dans les crochets", correct: false}
    answer: |-
      ```cpp
      auto compteur = [n = 0]() mutable { return ++n; };
      ```
      Une capture par valeur est constante : l'`operator()` de la lambda est `const`. `mutable` l'autorise à
      modifier son état.
  - key: bug-capture-unique-ptr
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function » sur la capture : un `std::unique_ptr` ne se copie pas.
      Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto p = std::make_unique<int>(7);
          auto lire = [p] { return *p; };
          std::println("{}", lire());
      }
      ```
    choices:
      - {text: "Capturer par déplacement : `[p = std::move(p)]`", correct: true}
      - {text: "Capturer tout par copie : `[=]`", correct: false}
      - {text: "Capturer la valeur du pointeur : `[*p]`", correct: false}
      - {text: "Déclarer la lambda `mutable`", correct: false}
    answer: |-
      ```cpp
      auto lire = [p = std::move(p)] { return *p; };
      ```
      `[p]` demande une copie, que `std::unique_ptr` interdit. La capture avec initialisation le déplace dans la
      lambda. Une capture par référence, `[&p]`, compilerait aussi, si la lambda ne survit pas à `p`.
  - key: bug-original-inchange
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3` : la lambda compte ses appels dans `appels`. Il affiche `0`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int appels = 0;
          auto compter = [appels]() mutable { ++appels; };
          compter();
          compter();
          compter();
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "Capturer `appels` par référence : `[&appels]`", correct: true}
      - {text: "Capturer `appels` avec `[appels = appels]`", correct: false}
      - {text: "Retirer `mutable`, sans rien changer d'autre", correct: false}
      - {text: "Déclarer `appels` avec le mot-clé `static`, et garder la capture", correct: false}
    answer: |-
      ```cpp
      auto compter = [&appels] { ++appels; };
      ```
      `mutable` modifie la copie que possède la lambda, pas la variable d'origine. Pour agir sur `appels`, il faut
      une référence.
  - key: bug-algorithme-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, le nombre d'éléments visités. Il affiche `0`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{4, 5, 6};
          int visites = 0;
          auto compter = [visites](int) mutable { ++visites; };
          std::for_each(v.begin(), v.end(), compter);
          std::println("{}", visites);
      }
      ```
    choices:
      - {text: "Capturer `visites` par référence, sans `mutable`", correct: true}
      - {text: "Passer `std::move(compter)` à `std::for_each`", correct: false}
      - {text: "Appeler `std::for_each` deux fois de suite", correct: false}
      - {text: "Déclarer `compter` avec `const auto`", correct: false}
    answer: |-
      ```cpp
      auto compter = [&visites](int) { ++visites; };
      ```
      La lambda incrémente sa copie de `visites`, et l'algorithme travaille en plus sur une copie de la lambda. La
      variable d'origine n'est jamais touchée. Une capture par référence la met à jour.
