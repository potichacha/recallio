notion: iterateurs-insertion
lesson: |-
  Un algorithme comme `std::copy` ou `std::transform` **écrit** dans sa destination en affectant : `*sortie = x`.
  Il suppose que la place **existe déjà**. Dans un vecteur vide, il écrit donc hors bornes.

  ```cpp
  std::vector<int> source{1, 2, 3};
  std::vector<int> cible;
  std::copy(source.begin(), source.end(), cible.begin());   // comportement indéfini
  ```

  Un **itérateur d'insertion** (en-tête `<iterator>`) règle le problème : chaque écriture **appelle une fonction
  d'insertion** du conteneur, qui grandit donc à mesure.

  | Fonction | Chaque écriture appelle | Conteneurs |
  |---|---|---|
  | `std::back_inserter(c)` | `c.push_back(x)` | `vector`, `deque`, `list`, `string` |
  | `std::front_inserter(c)` | `c.push_front(x)` | `deque`, `list`, `forward_list` |
  | `std::inserter(c, position)` | `c.insert(position, x)` | tous, dont `set` et `map` |

  ```cpp
  std::copy(source.begin(), source.end(), std::back_inserter(cible));   // cible : 1 2 3
  ```

  **`front_inserter` inverse l'ordre.** Chaque élément passe devant le précédent : copier 1, 2, 3 donne 3, 2, 1.

  **`inserter` garde l'ordre.** Après chaque insertion, il se replace juste après l'élément inséré : copier 1, 2, 3
  au début donne bien 1, 2, 3. C'est aussi le seul qui convienne à un `std::set` ou une `std::map`, qui n'ont ni
  `push_back` ni `push_front`.

  ```cpp
  std::set<int> uniques;
  std::copy(source.begin(), source.end(), std::inserter(uniques, uniques.end()));
  ```

  **Avec les algorithmes qui filtrent.** On ne connaît pas d'avance le nombre d'éléments gardés : l'itérateur
  d'insertion est la destination naturelle.

  ```cpp
  std::copy_if(source.begin(), source.end(), std::back_inserter(pairs),
               [](int x) { return x % 2 == 0; });
  ```

  **Réserver d'abord.** `std::back_inserter` fait autant de `push_back` qu'il y a d'éléments. Si l'on connaît leur
  nombre, `cible.reserve(n)` avant évite les réallocations.

  **Les autres façons.**

  - Donner sa taille à la destination : `std::vector<int> cible(source.size());`, puis `cible.begin()`.
  - Insérer un intervalle d'un coup : `cible.insert(cible.end(), source.begin(), source.end());`, plus rapide que
    des `push_back` un à un.
  - En C++23 : `cible.append_range(source)`, ou `std::ranges::to`.

  **Ce sont des itérateurs de sortie.** On ne peut qu'y écrire et avancer : ni les lire, ni les comparer.
  `*it` et `++it` n'y font rien ; seule l'affectation insère.

  **En entretien** : « Un algorithme écrit par affectation, il n'agrandit pas la destination. `std::back_inserter`
  transforme chaque écriture en `push_back` ; `std::inserter` en `insert`, ce qui convient aux `set` et aux `map`.
  Sans eux, copier dans un vecteur vide est un comportement indéfini. »
cards:
  - key: probleme
    format: course
    question: "Pourquoi `std::copy(a.begin(), a.end(), b.begin())` est-il fautif quand `b` est un vecteur vide ?"
    choices:
      - {text: "L'algorithme écrit par affectation, sans agrandir `b` : il écrit hors bornes", correct: true}
      - {text: "L'algorithme refuse de compiler quand la destination est vide", correct: false}
      - {text: "L'algorithme lève une exception `std::length_error` à l'exécution", correct: false}
      - {text: "L'algorithme copie les éléments dans l'ordre inverse de la source", correct: false}
    answer: "Un algorithme ne connaît que des itérateurs : il ne peut pas appeler `push_back`. La place doit exister, ou la destination doit être un itérateur d'insertion."
  - key: back-inserter
    format: course
    question: "Que fait une écriture à travers `std::back_inserter(v)` ?"
    choices:
      - {text: "Elle appelle `v.push_back` avec la valeur écrite", correct: true}
      - {text: "Elle remplace le dernier élément de `v` par la valeur écrite", correct: false}
      - {text: "Elle appelle `v.insert` au début de `v` avec la valeur écrite", correct: false}
      - {text: "Elle réserve de la place dans `v`, sans y ajouter d'élément", correct: false}
    answer: "L'itérateur transforme l'affectation `*it = x` en `v.push_back(x)`. Le conteneur grandit à chaque écriture."
  - key: inserter
    format: course
    question: "Quel itérateur d'insertion convient pour remplir un `std::set` avec `std::copy` ?"
    choices:
      - {text: "`std::inserter(s, s.end())`", correct: true}
      - {text: "`std::back_inserter(s)`", correct: false}
      - {text: "`std::front_inserter(s)`", correct: false}
      - {text: "`s.begin()`", correct: false}
    answer: "Un `std::set` n'a ni `push_back` ni `push_front`. `std::inserter` appelle `insert`, que tous les conteneurs offrent."
  - key: front-inserter
    format: course
    question: "Dans quel ordre arrivent les éléments copiés avec `std::front_inserter` ?"
    choices:
      - {text: "Dans l'ordre inverse de la source", correct: true}
      - {text: "Dans le même ordre que la source", correct: false}
      - {text: "Dans l'ordre croissant", correct: false}
      - {text: "Dans un ordre non spécifié", correct: false}
    answer: "Chaque élément est placé devant le précédent. Copier 1, 2, 3 donne 3, 2, 1."
  - key: vf-vector-front
    format: true-false
    question: "`std::front_inserter` s'utilise avec un `std::vector`."
    truth: false
    answer: "Il appelle `push_front`, que `std::vector` n'a pas. Il convient à `std::deque` et `std::list`."
  - key: vf-en-tete
    format: true-false
    question: "`std::back_inserter` est déclaré dans l'en-tête `<iterator>`."
    truth: true
    answer: "Avec `std::front_inserter` et `std::inserter`."
  - key: vf-lecture
    format: true-false
    question: "On peut lire une valeur à travers un itérateur d'insertion."
    truth: false
    answer: "C'est un itérateur de sortie : on ne peut qu'y écrire. Le déréférencer ne donne pas d'élément."
  - key: vf-inserter-ordre
    format: true-false
    question: "Copier 1, 2, 3 avec `std::inserter(v, v.begin())` place les éléments dans l'ordre 1, 2, 3."
    truth: true
    answer: "Après chaque insertion, l'itérateur se replace après l'élément inséré. L'ordre de la source est gardé, contrairement à `std::front_inserter`."
  - key: qcm-copy-if
    format: multiple-choice
    question: "Quelle destination donnes-tu à `std::copy_if` pour ranger les éléments gardés dans un vecteur vide `r` ?"
    choices:
      - {text: "`std::back_inserter(r)`", correct: true}
      - {text: "`r.begin()`", correct: false}
      - {text: "`r.end()`", correct: false}
      - {text: "`r.data()`", correct: false}
    answer: "On ne sait pas d'avance combien d'éléments passent le filtre : l'insertion fait grandir le vecteur au besoin."
  - key: qcm-plus-rapide
    format: multiple-choice
    question: "Quelle ligne ajoute tous les éléments de `a` à la fin de `b`, en une seule opération ?"
    choices:
      - {text: "`b.insert(b.end(), a.begin(), a.end());`", correct: true}
      - {text: "`b.push_back(a);`", correct: false}
      - {text: "`b = b + a;`", correct: false}
      - {text: "`std::copy(a.begin(), a.end(), b.end());`", correct: false}
    answer: "`insert` d'un intervalle connaît le nombre d'éléments : une seule réallocation. Copier vers `b.end()` écrirait hors bornes."
  - key: qcm-reserve
    format: multiple-choice
    question: "Que gagne-t-on à appeler `cible.reserve(n)` avant un `std::copy` vers `std::back_inserter(cible)` ?"
    choices:
      - {text: "Les `push_back` ne provoquent plus de réallocation", correct: true}
      - {text: "Les éléments sont copiés dans l'ordre inverse", correct: false}
      - {text: "Les éléments sont créés d'avance, à zéro", correct: false}
      - {text: "Les `push_back` deviennent des affectations", correct: false}
    answer: "`reserve` alloue la place sans créer d'élément : les insertions suivantes n'ont plus à agrandir le bloc."
  - key: qcm-fonction-appelee
    format: multiple-choice
    question: "Quelle fonction du conteneur `std::inserter(c, position)` appelle-t-il à chaque écriture ?"
    choices:
      - {text: "`insert`", correct: true}
      - {text: "`push_back`", correct: false}
      - {text: "`emplace_back`", correct: false}
      - {text: "`assign`", correct: false}
    answer: "C'est ce qui le rend utilisable avec tous les conteneurs, y compris les associatifs."
  - key: trous-back-inserter
    format: fill-in
    question: |-
      Complète pour que la copie ajoute les éléments à la fin de `cible` :
      ```cpp
      std::copy(source.begin(), source.end(), std::___(cible));
      ```
    blanks:
      - [back_inserter]
    answer: "`std::back_inserter` appelle `push_back` à chaque écriture."
  - key: trous-inserter
    format: fill-in
    question: |-
      Complète pour remplir l'ensemble :
      ```cpp
      std::set<int> uniques;
      std::copy(v.begin(), v.end(), std::___(uniques, uniques.end()));
      ```
    blanks:
      - [inserter]
    answer: "`std::inserter` appelle `insert`, la seule insertion qu'offre un `std::set`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête qui déclare `std::back_inserter` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [iterator]
    answer: "Les itérateurs d'insertion sont dans `<iterator>`."
  - key: trous-front-inserter
    format: fill-in
    question: |-
      Complète pour insérer chaque élément en tête de la deque :
      ```cpp
      std::deque<int> d;
      std::copy(v.begin(), v.end(), std::___(d));
      ```
    blanks:
      - [front_inserter]
    answer: "`std::front_inserter` appelle `push_front` : l'ordre est inversé."
  - key: code-back-inserter
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::vector<int> cible{9};
          std::copy(source.begin(), source.end(), std::back_inserter(cible));
          std::println("{} {} {}", cible.size(), cible.front(), cible.back());
      }
      ```
    choices:
      - {text: "`4 9 3`", correct: true}
      - {text: "`3 1 3`", correct: false}
      - {text: "`4 1 9`", correct: false}
      - {text: "`1 9 9`", correct: false}
    answer: "`4 9 3` : les trois éléments sont ajoutés après le 9 déjà présent. Rien n'est écrasé."
    check:
      output: "4 9 3"
  - key: code-front-inserter
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <deque>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::deque<int> d;
          std::copy(source.begin(), source.end(), std::front_inserter(d));
          std::println("{} {} {}", d[0], d[1], d[2]);
      }
      ```
    choices:
      - {text: "`3 2 1`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`1 3 2`", correct: false}
      - {text: "`3 1 2`", correct: false}
    answer: "`3 2 1` : chaque élément est poussé en tête, devant le précédent. L'ordre est inversé."
    check:
      output: "3 2 1"
  - key: code-inserter
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::vector<int> cible{7, 8};
          std::copy(source.begin(), source.end(), std::inserter(cible, cible.begin() + 1));
          std::println("{} {} {} {} {}", cible[0], cible[1], cible[2], cible[3], cible[4]);
      }
      ```
    choices:
      - {text: "`7 1 2 3 8`", correct: true}
      - {text: "`7 3 2 1 8`", correct: false}
      - {text: "`1 2 3 7 8`", correct: false}
      - {text: "`7 8 1 2 3`", correct: false}
    answer: "`7 1 2 3 8` : `std::inserter` insère avant la position donnée, puis avance. L'ordre de la source est gardé."
    check:
      output: "7 1 2 3 8"
  - key: code-set
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <set>
      #include <vector>

      int main() {
          const std::vector<int> source{3, 1, 3, 2, 1};
          std::set<int> uniques;
          std::copy(source.begin(), source.end(), std::inserter(uniques, uniques.end()));
          std::println("{} {}", uniques.size(), *uniques.begin());
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`5 3`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`5 1`", correct: false}
    answer: "`3 1` : chaque écriture appelle `insert`. L'ensemble ignore les doublons et se trie : il contient 1, 2, 3."
    check:
      output: "3 1"
  - key: bug-copie-vide
    format: bug-fix
    question: |-
      Ce programme copie dans un vecteur vide : il écrit hors bornes. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::vector<int> cible;
          std::copy(source.begin(), source.end(), cible.begin());
          std::println("{}", cible.size());
      }
      ```
    choices:
      - {text: "Passer `std::back_inserter(cible)` comme destination", correct: true}
      - {text: "Passer `cible.end()` comme destination", correct: false}
      - {text: "Appeler `cible.reserve(3);` avant la copie, sans rien changer d'autre", correct: false}
      - {text: "Passer `cible.data()` comme destination", correct: false}
    answer: |-
      ```cpp
      std::copy(source.begin(), source.end(), std::back_inserter(cible));
      ```
      `std::copy` affecte dans des éléments qui doivent exister. `reserve` alloue de la place sans créer
      d'élément : la taille resterait 0. Déclarer `cible(source.size())` conviendrait aussi.
  - key: bug-front-inserter-vector
    format: bug-fix
    question: |-
      Le compilateur répond que `std::vector<int>` n'a pas de membre `push_front`. Quelle correction garde
      l'insertion en tête ?
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::vector<int> cible;
          std::copy(source.begin(), source.end(), std::front_inserter(cible));
          std::println("{}", cible.front());
      }
      ```
    choices:
      - {text: "Déclarer `cible` comme une `std::deque<int>`", correct: true}
      - {text: "Déclarer `cible` comme un `std::set<int>`", correct: false}
      - {text: "Déclarer `cible` comme un `std::array<int, 3>`", correct: false}
      - {text: "Déclarer `source` comme une `std::deque<int>`", correct: false}
    answer: |-
      ```cpp
      std::deque<int> cible;
      ```
      `std::front_inserter` appelle `push_front`, qu'offrent `std::deque` et `std::list`, pas `std::vector`.
  - key: bug-back-inserter-set
    format: bug-fix
    question: |-
      Le compilateur répond que `std::set<int>` n'a pas de membre `push_back`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <set>
      #include <vector>

      int main() {
          const std::vector<int> source{2, 1, 2};
          std::set<int> uniques;
          std::copy(source.begin(), source.end(), std::back_inserter(uniques));
          std::println("{}", uniques.size());
      }
      ```
    choices:
      - {text: "Passer `std::inserter(uniques, uniques.end())`", correct: true}
      - {text: "Passer `std::front_inserter(uniques)`", correct: false}
      - {text: "Passer `uniques.begin()`", correct: false}
      - {text: "Passer `std::back_inserter(source)`", correct: false}
    answer: |-
      ```cpp
      std::copy(source.begin(), source.end(), std::inserter(uniques, uniques.end()));
      ```
      Un ensemble n'a que `insert`. `std::inserter` est l'itérateur d'insertion des conteneurs associatifs.
  - key: bug-ordre-inverse
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1 2 3`. Il affiche `3 2 1`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <list>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3};
          std::list<int> cible;
          std::copy(source.begin(), source.end(), std::front_inserter(cible));
          for (int x : cible) {
              std::print("{} ", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Passer `std::back_inserter(cible)`", correct: true}
      - {text: "Passer `cible.begin()`", correct: false}
      - {text: "Passer `std::front_inserter(source)`", correct: false}
      - {text: "Passer `cible.rbegin()`", correct: false}
    answer: |-
      ```cpp
      std::copy(source.begin(), source.end(), std::back_inserter(cible));
      ```
      `std::front_inserter` pousse chaque élément devant le précédent, ce qui inverse l'ordre. À la fin, l'ordre de
      la source est gardé.
