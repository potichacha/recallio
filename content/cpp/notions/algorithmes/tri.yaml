notion: tri
lesson: |-
  **`std::sort`** trie un intervalle en place, en **O(n log n)**. Par défaut, il range par ordre croissant, avec
  `<`.

  ```cpp
  std::vector<int> v{5, 1, 9, 3};
  std::sort(v.begin(), v.end());                          // 1 3 5 9
  std::sort(v.begin(), v.end(), std::greater<>{});        // 9 5 3 1
  ```

  **Trier selon un critère.** Le troisième argument est une **comparaison** : une fonction qui reçoit deux éléments
  et renvoie `true` si le premier doit passer **avant** le second.

  ```cpp
  std::sort(gens.begin(), gens.end(),
            [](const Personne& a, const Personne& b) { return a.age < b.age; });
  ```

  **L'ordre strict.** La comparaison doit se comporter comme `<` : renvoyer **`false` pour deux éléments
  équivalents**. Écrire `<=` est une faute : le comportement est indéfini, et `std::sort` peut sortir du tableau.

  **Il lui faut un accès direct.** `std::sort` exige des itérateurs à accès direct : `vector`, `array`, `deque`,
  `string`. Une `std::list` a sa propre fonction membre, `l.sort()`. Une `std::map` et un `std::set` sont déjà
  triés.

  **La stabilité.** `std::sort` n'est **pas stable** : deux éléments équivalents peuvent changer d'ordre entre eux.
  **`std::stable_sort`** garde leur ordre de départ. C'est ce qui permet de trier sur deux critères : d'abord par
  le critère secondaire, puis, avec un tri stable, par le critère principal.

  **Quand il ne faut pas tout trier.**

  | Algorithme | Ce qu'il garantit | Coût |
  |---|---|---|
  | `std::sort` | tout est trié | O(n log n) |
  | `std::stable_sort` | tout est trié, les équivalents gardent leur ordre | O(n log n), avec de la mémoire en plus |
  | `std::partial_sort(d, m, f)` | les éléments de `[d, m)` sont les plus petits, triés | O(n log k) |
  | `std::nth_element(d, n, f)` | l'élément en position `n` est celui d'un tri complet ; les plus petits avant, les plus grands après, sans ordre | O(n) en moyenne |

  `partial_sort` donne un « top 10 » ; `nth_element` donne une médiane.

  **Vérifier.** `std::is_sorted(debut, fin)` dit si l'intervalle est trié.

  **Avec `std::ranges` (C++20)** : `std::ranges::sort(v)`, et une **projection** qui évite d'écrire la
  comparaison :

  ```cpp
  std::ranges::sort(gens, {}, &Personne::age);
  ```

  **En entretien** : « `std::sort` est en O(n log n), pas stable, et demande un accès direct. La comparaison doit
  être un ordre strict : jamais `<=`. Pour garder l'ordre des égaux, `stable_sort` ; pour les k premiers,
  `partial_sort` ; pour une médiane, `nth_element`. »
cards:
  - key: complexite
    format: course
    question: "Quelle est la complexité de `std::sort` ?"
    choices:
      - {text: "O(n log n)", correct: true}
      - {text: "O(n)", correct: false}
      - {text: "O(n²)", correct: false}
      - {text: "O(log n)", correct: false}
    answer: "C'est le mieux qu'un tri par comparaisons puisse faire. Le standard le garantit."
  - key: comparaison
    format: course
    question: "Que doit renvoyer la comparaison passée à `std::sort` ?"
    choices:
      - {text: "`true` si son premier argument doit passer avant le second", correct: true}
      - {text: "Un entier négatif, nul ou positif, comme `strcmp`", correct: false}
      - {text: "`true` si ses deux arguments sont égaux", correct: false}
      - {text: "Le plus petit de ses deux arguments", correct: false}
    answer: "C'est un prédicat à deux arguments, qui joue le rôle de `<`. Pour un ordre décroissant : `return a > b;`."
  - key: ordre-strict
    format: course
    question: "Pourquoi ne faut-il pas écrire `return a <= b;` dans la comparaison d'un tri ?"
    choices:
      - {text: "Elle doit renvoyer `false` pour deux éléments égaux, sinon le comportement est indéfini", correct: true}
      - {text: "Elle serait deux fois plus lente qu'avec `<`, car elle fait deux tests au lieu d'un", correct: false}
      - {text: "Elle trierait dans l'ordre décroissant au lieu de l'ordre croissant demandé", correct: false}
      - {text: "Elle ne compilerait pas : `std::sort` n'accepte que l'opérateur `<`", correct: false}
    answer: "`std::sort` suppose un ordre strict. Avec `<=`, `a` passe avant `b` et `b` avant `a` : l'algorithme peut lire hors de l'intervalle."
  - key: stabilite
    format: course
    question: "Que garantit `std::stable_sort`, que `std::sort` ne garantit pas ?"
    choices:
      - {text: "Deux éléments équivalents gardent leur ordre de départ", correct: true}
      - {text: "Le tri s'exécute toujours en temps linéaire", correct: false}
      - {text: "Le tri n'alloue jamais de mémoire", correct: false}
      - {text: "Les éléments égaux sont retirés du résultat", correct: false}
    answer: "C'est la stabilité. Elle compte quand les éléments équivalents pour le tri restent distinguables : deux personnes du même âge, par exemple."
  - key: vf-liste
    format: true-false
    question: "`std::sort` trie une `std::list`."
    truth: false
    answer: "Il exige des itérateurs à accès direct. Une liste se trie avec sa fonction membre : `l.sort()`."
  - key: vf-stable
    format: true-false
    question: "`std::sort` garde l'ordre relatif des éléments équivalents."
    truth: false
    answer: "Il n'est pas stable. Pour cette garantie, on appelle `std::stable_sort`."
  - key: vf-en-place
    format: true-false
    question: "`std::sort` trie l'intervalle en place, sans renvoyer de nouveau conteneur."
    truth: true
    answer: Les éléments sont réordonnés dans le conteneur d'origine.
  - key: vf-nth-element
    format: true-false
    question: "Après `std::nth_element`, tout l'intervalle est trié."
    truth: false
    answer: "Seul l'élément à la position demandée est à sa place définitive. Les autres sont répartis de part et d'autre, sans ordre."
  - key: qcm-decroissant
    format: multiple-choice
    question: "Quelle ligne trie le vecteur `v` du plus grand au plus petit ?"
    choices:
      - {text: "`std::sort(v.begin(), v.end(), std::greater<>{});`", correct: true}
      - {text: "`std::sort(v.end(), v.begin());`", correct: false}
      - {text: "`std::sort(v.begin(), v.end(), std::less<>{});`", correct: false}
      - {text: "`std::sort(v.begin(), v.end(), -1);`", correct: false}
    answer: "`std::greater<>` compare avec `>`. Une lambda `[](int a, int b) { return a > b; }` convient aussi, comme `std::sort(v.rbegin(), v.rend())`."
  - key: qcm-top-k
    format: multiple-choice
    question: "Sur un million de scores, tu veux les dix meilleurs, triés. Quel algorithme convient le mieux ?"
    choices:
      - {text: "`std::partial_sort`", correct: true}
      - {text: "`std::stable_sort`", correct: false}
      - {text: "`std::find_if`", correct: false}
      - {text: "`std::is_sorted`", correct: false}
    answer: "`std::partial_sort` ne trie que les k premiers, en O(n log k). Trier le million entier serait du travail perdu."
  - key: qcm-mediane
    format: multiple-choice
    question: "Quel algorithme trouve la médiane d'un vecteur en temps linéaire en moyenne ?"
    choices:
      - {text: "`std::nth_element`", correct: true}
      - {text: "`std::sort`", correct: false}
      - {text: "`std::stable_sort`", correct: false}
      - {text: "`std::partial_sort`", correct: false}
    answer: "`std::nth_element(v.begin(), v.begin() + v.size() / 2, v.end())` place la médiane au milieu, sans trier le reste."
  - key: qcm-verifier
    format: multiple-choice
    question: "Quelle fonction dit si un intervalle est déjà trié ?"
    choices:
      - {text: "`std::is_sorted`", correct: true}
      - {text: "`std::sorted`", correct: false}
      - {text: "`std::check_sort`", correct: false}
      - {text: "`std::all_of`", correct: false}
    answer: "`std::is_sorted(v.begin(), v.end())` renvoie un booléen, en un seul parcours."
  - key: trous-sort
    format: fill-in
    question: |-
      Complète pour trier le vecteur par ordre croissant :
      ```cpp
      std::___(v.begin(), v.end());
      ```
    blanks:
      - [sort]
    answer: "`std::sort` trie en place, avec `<` par défaut."
  - key: trous-comparaison
    format: fill-in
    question: |-
      Complète pour trier les personnes de la plus jeune à la plus âgée :
      ```cpp
      std::sort(gens.begin(), gens.end(),
                [](const Personne& a, const Personne& b) { return a.age ___ b.age; });
      ```
    blanks:
      - ["<"]
    answer: "La comparaison renvoie `true` quand `a` doit passer avant `b` : ici, quand elle est plus jeune."
  - key: trous-stable
    format: fill-in
    question: |-
      Complète pour trier en gardant l'ordre de départ des éléments équivalents :
      ```cpp
      std::___(gens.begin(), gens.end(), par_age);
      ```
    blanks:
      - [stable_sort]
    answer: "`std::stable_sort` est le tri stable de la bibliothèque."
  - key: trous-greater
    format: fill-in
    question: |-
      Complète pour trier par ordre décroissant :
      ```cpp
      std::sort(v.begin(), v.end(), std::___<>{});
      ```
    blanks:
      - [greater]
    answer: "`std::greater<>` compare avec `>`."
  - key: code-sort
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 1, 9, 3};
          std::sort(v.begin(), v.end());
          std::println("{} {} {}", v.front(), v.back(), std::is_sorted(v.begin(), v.end()));
      }
      ```
    choices:
      - {text: "`1 9 true`", correct: true}
      - {text: "`5 3 false`", correct: false}
      - {text: "`9 1 true`", correct: false}
      - {text: "`1 9 false`", correct: false}
    answer: "`1 9 true` : après le tri croissant, le plus petit est en tête, le plus grand à la fin."
    check:
      output: "1 9 true"
  - key: code-lambda
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> mots{"kiwi", "fraise", "noix", "cassis"};
          std::sort(mots.begin(), mots.end(),
                    [](const std::string& a, const std::string& b) { return a.size() > b.size(); });
          std::println("{}", mots[0].size());
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`6` : la comparaison place les mots les plus longs d'abord. Le premier a six lettres."
    check:
      output: "6"
  - key: code-partie
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{9, 7, 8, 1, 2};
          std::sort(v.begin(), v.begin() + 3);
          std::println("{} {} {} {} {}", v[0], v[1], v[2], v[3], v[4]);
      }
      ```
    choices:
      - {text: "`7 8 9 1 2`", correct: true}
      - {text: "`1 2 7 8 9`", correct: false}
      - {text: "`9 7 8 1 2`", correct: false}
      - {text: "`7 8 9 2 1`", correct: false}
    answer: "`7 8 9 1 2` : l'intervalle ne couvre que les trois premiers éléments. Les deux derniers ne bougent pas."
    check:
      output: "7 8 9 1 2"
  - key: code-stable
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> mots{"cc", "a", "bb", "d", "aa"};
          std::stable_sort(mots.begin(), mots.end(),
                           [](const std::string& x, const std::string& y) { return x.size() < y.size(); });
          std::println("{} {} {} {} {}", mots[0], mots[1], mots[2], mots[3], mots[4]);
      }
      ```
    choices:
      - {text: "`a d cc bb aa`", correct: true}
      - {text: "`a d aa bb cc`", correct: false}
      - {text: "`d a cc bb aa`", correct: false}
      - {text: "`a aa bb cc d`", correct: false}
    answer: "`a d cc bb aa` : le tri compare les longueurs. Il est stable : à longueur égale, les mots gardent leur ordre de départ."
    check:
      output: "a d cc bb aa"
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Ce tri a un comportement indéfini : sur de grands vecteurs, il peut planter. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{3, 1, 3, 2};
          std::sort(v.begin(), v.end(), [](int a, int b) { return a <= b; });
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Écrire `return a < b;`", correct: true}
      - {text: "Écrire `return a >= b;`", correct: false}
      - {text: "Écrire `return a == b;`", correct: false}
      - {text: "Écrire `return a - b;`", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end(), [](int a, int b) { return a < b; });
      ```
      La comparaison doit être un ordre strict : `false` pour deux éléments égaux. Avec `<=`, deux 3 passeraient
      chacun avant l'autre, et `std::sort` peut sortir de l'intervalle.
  - key: bug-sort-liste
    format: bug-fix
    question: |-
      Le compilateur refuse `std::sort` sur cette liste. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{3, 1, 2};
          std::sort(l.begin(), l.end());
          std::println("{}", l.front());
      }
      ```
    choices:
      - {text: "Appeler `l.sort();`", correct: true}
      - {text: "Appeler `std::stable_sort(l.begin(), l.end());`", correct: false}
      - {text: "Appeler `std::sort(l);`", correct: false}
      - {text: "Appeler `std::sort(&l.front(), &l.back());`", correct: false}
    answer: |-
      ```cpp
      l.sort();
      ```
      `std::sort` a besoin d'itérateurs à accès direct, qu'une liste chaînée n'a pas. Elle fournit sa propre fonction
      membre `sort`, qui est stable.
  - key: bug-comparaison-mauvais-champ
    format: bug-fix
    question: |-
      Ce programme devrait afficher le nom du plus jeune, `Zoé`. Il affiche `Ali`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Léa", 40}, {"Zoé", 25}, {"Ali", 33}};
          std::sort(gens.begin(), gens.end(),
                    [](const Personne& a, const Personne& b) { return a.nom < b.nom; });
          std::println("{}", gens[0].nom);
      }
      ```
    choices:
      - {text: "Comparer les âges : `return a.age < b.age;`", correct: true}
      - {text: "Comparer les noms dans l'autre sens : `return a.nom > b.nom;`", correct: false}
      - {text: "Comparer les âges à l'envers : `return a.age > b.age;`", correct: false}
      - {text: "Afficher `gens[2].nom` à la place de `gens[0].nom`", correct: false}
    answer: |-
      ```cpp
      [](const Personne& a, const Personne& b) { return a.age < b.age; }
      ```
      La comparaison trie par nom : le premier est `Ali`. Pour avoir le plus jeune en tête, on compare les âges.
  - key: bug-fin-oubliee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1 2 3 4`. Il affiche `1 3 4 2` : le dernier élément n'a pas été trié. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 3, 1, 2};
          std::sort(v.begin(), v.end() - 1);
          std::println("{} {} {} {}", v[0], v[1], v[2], v[3]);
      }
      ```
    choices:
      - {text: "Écrire `std::sort(v.begin(), v.end());`", correct: true}
      - {text: "Écrire `std::sort(v.begin(), v.end() + 1);`", correct: false}
      - {text: "Écrire `std::sort(v.begin() + 1, v.end());`", correct: false}
      - {text: "Écrire `std::sort(v.end(), v.begin());`", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end());
      ```
      L'intervalle est semi-ouvert : `end()` est déjà exclu. En retirant 1, on laisse le dernier élément hors du tri.
