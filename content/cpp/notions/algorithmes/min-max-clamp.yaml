notion: min-max-clamp
lesson: |-
  `<algorithm>` fournit deux familles pour les extrêmes : celles qui comparent **des valeurs**, et celles qui
  cherchent dans **un intervalle**.

  **Comparer des valeurs.**

  | Fonction | Renvoie |
  |---|---|
  | `std::min(a, b)`, `std::max(a, b)` | le plus petit, le plus grand des deux |
  | `std::min({a, b, c})`, `std::max({a, b, c})` | le plus petit, le plus grand d'une liste |
  | `std::minmax(a, b)` | une paire : le plus petit, puis le plus grand |
  | `std::clamp(v, bas, haut)` | `v` ramenée dans l'intervalle `[bas, haut]` |

  ```cpp
  std::min(3, 7);              // 3
  std::max({4, 9, 2});         // 9
  std::clamp(15, 0, 10);       // 10
  std::clamp(-3, 0, 10);       // 0
  ```

  **Les deux arguments doivent avoir le même type.** `std::min(1, 2.5)` ne compile pas : le compilateur ne sait
  pas s'il doit déduire `int` ou `double`. On convertit, ou l'on précise : `std::min<double>(1, 2.5)`.

  **Ils renvoient des références.** `std::min(a, b)` renvoie une **référence constante** vers l'un de ses
  arguments. Avec des temporaires, la garder dans une référence la laisse **pendante** :

  ```cpp
  const int& petit = std::min(3, 7);         // pendante : les temporaires 3 et 7 ont disparu
  auto [bas, haut] = std::minmax(3, 7);      // pendante aussi : une paire de références
  ```

  Avec une liste entre accolades, les fonctions renvoient des **valeurs** : `std::minmax({3, 7})` est sûr.

  **Chercher dans un intervalle.**

  | Fonction | Renvoie |
  |---|---|
  | `std::min_element(d, f)` | un itérateur sur le plus petit élément |
  | `std::max_element(d, f)` | un itérateur sur le plus grand |
  | `std::minmax_element(d, f)` | une paire d'itérateurs, en un seul parcours |

  Ils renvoient des **itérateurs**, pas des valeurs : on déréférence, après avoir vérifié que l'intervalle n'est
  pas vide. Sur un intervalle vide, ils renvoient `fin`.

  **En cas d'égalité.** `std::min_element` et `std::max_element` désignent la **première** occurrence.
  `std::minmax_element` désigne la première pour le minimum, et la **dernière** pour le maximum.

  **Un critère à soi.** Tous acceptent une comparaison en dernier argument :

  ```cpp
  auto plus_long = std::max_element(mots.begin(), mots.end(),
      [](const std::string& a, const std::string& b) { return a.size() < b.size(); });
  ```

  La comparaison joue toujours le rôle de `<`, même pour `max`.

  **`std::clamp`** exige `bas <= haut` : sinon, le comportement est indéfini.

  **Avec `std::ranges`** : `std::ranges::max(v)` renvoie directement la **valeur** la plus grande d'un conteneur,
  `std::ranges::max_element(v)` un itérateur.

  **En entretien** : « `std::min` et `std::max` comparent deux valeurs de même type, ou une liste ;
  `std::min_element` et `std::max_element` parcourent un intervalle et rendent un itérateur. `std::clamp` borne
  une valeur. Attention : `std::min` renvoie une référence, dangereuse avec des temporaires. »
cards:
  - key: valeurs-ou-intervalle
    format: course
    question: "Quelle différence entre `std::max` et `std::max_element` ?"
    choices:
      - {text: "`max` compare des valeurs ; `max_element` parcourt un intervalle et renvoie un itérateur", correct: true}
      - {text: "`max` parcourt un intervalle et renvoie un itérateur ; `max_element` compare deux valeurs", correct: false}
      - {text: "`max` renvoie le plus grand ; `max_element` renvoie l'indice du plus grand", correct: false}
      - {text: "Aucune : `max_element` est l'ancien nom de `max`", correct: false}
    answer: "`std::max(a, b)` ou `std::max({a, b, c})` rendent une valeur. `std::max_element(debut, fin)` rend un itérateur, à déréférencer."
  - key: clamp
    format: course
    question: "Que renvoie `std::clamp(valeur, bas, haut)` ?"
    choices:
      - {text: "`valeur` si elle est dans l'intervalle, sinon la borne la plus proche", correct: true}
      - {text: "`true` si `valeur` est dans l'intervalle, sinon `false`", correct: false}
      - {text: "La distance entre `valeur` et la borne la plus proche", correct: false}
      - {text: "La moyenne de `bas` et de `haut`, arrondie", correct: false}
    answer: "Trop petite, elle devient `bas` ; trop grande, `haut`. `std::clamp(15, 0, 10)` vaut 10."
  - key: meme-type
    format: course
    question: "Pourquoi `std::min(1, 2.5)` ne compile-t-il pas ?"
    choices:
      - {text: "Les deux arguments n'ont pas le même type : la déduction du template échoue", correct: true}
      - {text: "`std::min` n'accepte que des entiers, pas des nombres à virgule", correct: false}
      - {text: "`std::min` exige une liste entre accolades pour deux valeurs", correct: false}
      - {text: "Le compilateur refuse de comparer un entier à un nombre à virgule", correct: false}
    answer: "`std::min` a un seul paramètre de type `T`. Avec `int` et `double`, le compilateur ne choisit pas. On écrit `std::min<double>(1, 2.5)`, ou `std::min(1.0, 2.5)`."
  - key: reference
    format: course
    question: "Pourquoi `const int& m = std::min(3, 7);` est-il dangereux ?"
    choices:
      - {text: "`std::min` renvoie une référence vers un temporaire, détruit à la fin de l'instruction", correct: true}
      - {text: "`std::min` renvoie une copie, que la référence ne peut pas désigner", correct: false}
      - {text: "`std::min` modifie ses arguments, ce qu'un littéral interdit", correct: false}
      - {text: "`std::min` lance une exception quand ses arguments sont des littéraux", correct: false}
    answer: "La fonction rend une référence vers l'un de ses arguments. Ici, ce sont des temporaires : `m` est pendante. `int m = std::min(3, 7);` copie la valeur à temps."
  - key: vf-element-iterateur
    format: true-false
    question: "`std::min_element` renvoie la valeur du plus petit élément."
    truth: false
    answer: "Il renvoie un itérateur sur cet élément. Sur un intervalle vide, il renvoie la fin : on ne le déréférence pas sans vérifier."
  - key: vf-liste
    format: true-false
    question: "`std::max({4, 9, 2})` renvoie le plus grand des trois nombres."
    truth: true
    answer: "La surcharge qui prend une liste entre accolades accepte autant de valeurs qu'on veut, et renvoie une copie."
  - key: vf-egalite
    format: true-false
    question: "Quand plusieurs éléments sont les plus petits, `std::min_element` désigne le dernier."
    truth: false
    answer: "Il désigne le premier. Seul le maximum de `std::minmax_element` désigne la dernière occurrence."
  - key: vf-clamp-bornes
    format: true-false
    question: "`std::clamp(v, bas, haut)` a un comportement indéfini quand `bas` est supérieur à `haut`."
    truth: true
    answer: "L'intervalle doit être valide : `bas <= haut`. Rien n'est vérifié."
  - key: qcm-plus-long
    format: multiple-choice
    question: "Quelle comparaison donnes-tu à `std::max_element` pour trouver le mot le plus long ?"
    choices:
      - {text: "`[](const auto& a, const auto& b) { return a.size() < b.size(); }`", correct: true}
      - {text: "`[](const auto& a, const auto& b) { return a.size() > b.size(); }`", correct: false}
      - {text: "`[](const auto& a) { return a.size(); }`", correct: false}
      - {text: "`[](const auto& a, const auto& b) { return a.size() == b.size(); }`", correct: false}
    answer: "La comparaison joue toujours le rôle de `<`, même pour un maximum. Avec `>`, on obtiendrait le mot le plus court."
  - key: qcm-deux-extremes
    format: multiple-choice
    question: "Quel algorithme trouve le plus petit et le plus grand élément d'un vecteur en un seul parcours ?"
    choices:
      - {text: "`std::minmax_element`", correct: true}
      - {text: "`std::min_element`", correct: false}
      - {text: "`std::clamp`", correct: false}
      - {text: "`std::sort`", correct: false}
    answer: "Il renvoie une paire d'itérateurs. Trier pour lire les deux bouts coûterait O(n log n) au lieu de O(n)."
  - key: qcm-ranges-max
    format: multiple-choice
    question: "Quelle expression donne directement la plus grande valeur d'un vecteur `v` non vide ?"
    choices:
      - {text: "`std::ranges::max(v)`", correct: true}
      - {text: "`std::max(v)`", correct: false}
      - {text: "`std::max_element(v)`", correct: false}
      - {text: "`v.max()`", correct: false}
    answer: "`std::ranges::max` accepte un intervalle et rend une valeur. `std::max_element` attend deux itérateurs, et rend un itérateur."
  - key: qcm-clamp-usage
    format: multiple-choice
    question: "Quelle ligne ramène un pourcentage `p` entre 0 et 100 ?"
    choices:
      - {text: "`p = std::clamp(p, 0, 100);`", correct: true}
      - {text: "`p = std::minmax(p, 0, 100);`", correct: false}
      - {text: "`p = std::max(p, 100);`", correct: false}
      - {text: "`p = std::min(p, 0);`", correct: false}
    answer: "`std::clamp` fait l'équivalent de `std::max(0, std::min(p, 100))`, en un appel lisible."
  - key: trous-clamp
    format: fill-in
    question: |-
      Complète pour borner le volume entre 0 et 10 :
      ```cpp
      int volume = std::___(saisie, 0, 10);
      ```
    blanks:
      - [clamp]
    answer: "`std::clamp(valeur, bas, haut)` ramène la valeur dans l'intervalle."
  - key: trous-max-element
    format: fill-in
    question: |-
      Complète pour obtenir un itérateur sur la meilleure note :
      ```cpp
      auto meilleure = std::___(notes.begin(), notes.end());
      ```
    blanks:
      - [max_element]
    answer: "`std::max_element` parcourt l'intervalle et rend un itérateur."
  - key: trous-deref
    format: fill-in
    question: |-
      Complète pour afficher la plus petite note, et non l'itérateur :
      ```cpp
      auto it = std::min_element(notes.begin(), notes.end());
      std::println("{}", ___it);
      ```
    blanks:
      - ["*"]
    answer: "L'algorithme rend un itérateur : `*it` donne la valeur."
  - key: trous-min
    format: fill-in
    question: |-
      Complète pour garder le plus petit des deux prix :
      ```cpp
      int prix = std::___(prix_a, prix_b);
      ```
    blanks:
      - [min]
    answer: "`std::min(a, b)` rend le plus petit des deux."
  - key: code-clamp
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>

      int main() {
          std::println("{} {} {}", std::clamp(15, 0, 10), std::clamp(-3, 0, 10), std::clamp(7, 0, 10));
      }
      ```
    choices:
      - {text: "`10 0 7`", correct: true}
      - {text: "`15 -3 7`", correct: false}
      - {text: "`0 10 7`", correct: false}
      - {text: "`10 0 10`", correct: false}
    answer: "`10 0 7` : 15 dépasse la borne haute, -3 la borne basse, et 7 est déjà dans l'intervalle."
    check:
      output: "10 0 7"
  - key: code-elements
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{4, 9, 2, 9, 2};
          const auto petit = std::min_element(v.begin(), v.end());
          const auto grand = std::max_element(v.begin(), v.end());
          std::println("{} {} {} {}", *petit, petit - v.begin(), *grand, grand - v.begin());
      }
      ```
    choices:
      - {text: "`2 2 9 1`", correct: true}
      - {text: "`2 4 9 3`", correct: false}
      - {text: "`2 2 9 3`", correct: false}
      - {text: "`2 4 9 1`", correct: false}
    answer: "`2 2 9 1` : en cas d'égalité, les deux algorithmes désignent la première occurrence : indice 2 pour le minimum, indice 1 pour le maximum."
    check:
      output: "2 2 9 1"
  - key: code-minmax-element
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{4, 9, 2, 9, 2};
          const auto [petit, grand] = std::minmax_element(v.begin(), v.end());
          std::println("{} {}", petit - v.begin(), grand - v.begin());
      }
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`2 1`", correct: false}
      - {text: "`4 3`", correct: false}
      - {text: "`4 1`", correct: false}
    answer: "`2 3` : `std::minmax_element` désigne la première occurrence du minimum, mais la dernière du maximum."
    check:
      output: "2 3"
  - key: code-liste
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>

      int main() {
          const auto [bas, haut] = std::minmax({5, 1, 8, 3});
          const std::string mot = std::max({std::string{"kiwi"}, std::string{"pomme"}, std::string{"figue"}});
          std::println("{} {} {}", bas, haut, mot);
      }
      ```
    choices:
      - {text: "`1 8 pomme`", correct: true}
      - {text: "`5 3 kiwi`", correct: false}
      - {text: "`1 8 figue`", correct: false}
      - {text: "`8 1 pomme`", correct: false}
    answer: "`1 8 pomme` : avec une liste, `std::minmax` rend une paire de valeurs. Les chaînes se comparent dans l'ordre alphabétique : `pomme` est la plus grande."
    check:
      output: "1 8 pomme"
  - key: bug-types-differents
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'min(int&, double&)' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>

      int main() {
          int stock = 10;
          double demande = 7.5;
          std::println("{}", std::min(stock, demande));
      }
      ```
    choices:
      - {text: "Écrire `std::min<double>(stock, demande)`", correct: true}
      - {text: "Écrire `std::min(&stock, &demande)`", correct: false}
      - {text: "Écrire `std::min({stock, demande})`", correct: false}
      - {text: "Écrire `std::min_element(stock, demande)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::min<double>(stock, demande));
      ```
      Les deux arguments doivent avoir le même type. En précisant `double`, l'entier est converti. Une liste entre
      accolades exige elle aussi un seul type.
  - key: bug-iterateur-non-dereference
    format: bug-fix
    question: |-
      Le compilateur refuse d'afficher le résultat : `std::max_element` ne renvoie pas un entier. Quelle correction
      est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> notes{12, 17, 9};
          const int meilleure = std::max_element(notes.begin(), notes.end());
          std::println("{}", meilleure);
      }
      ```
    choices:
      - {text: "Écrire `*std::max_element(notes.begin(), notes.end())`", correct: true}
      - {text: "Écrire `&std::max_element(notes.begin(), notes.end())`", correct: false}
      - {text: "Écrire `std::max(notes.begin(), notes.end())`", correct: false}
      - {text: "Écrire `std::max_element(notes)`", correct: false}
    answer: |-
      ```cpp
      const int meilleure = *std::max_element(notes.begin(), notes.end());
      ```
      L'algorithme rend un itérateur sur le plus grand élément. On le déréférence, ici sans risque puisque le
      vecteur n'est pas vide. `std::ranges::max(notes)` donnerait la valeur directement.
  - key: bug-comparaison-inversee
    format: bug-fix
    question: |-
      Ce programme devrait afficher le mot le plus long, `fraise`. Il affiche `kiwi`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<std::string> mots{"pomme", "kiwi", "fraise"};
          const auto it = std::max_element(mots.begin(), mots.end(),
              [](const std::string& a, const std::string& b) { return a.size() > b.size(); });
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "Écrire `return a.size() < b.size();`", correct: true}
      - {text: "Écrire `return a.size() >= b.size();`", correct: false}
      - {text: "Écrire `return a.size() == b.size();`", correct: false}
      - {text: "Écrire `return a > b;`", correct: false}
    answer: |-
      ```cpp
      [](const std::string& a, const std::string& b) { return a.size() < b.size(); }
      ```
      La comparaison doit se comporter comme `<`, y compris pour `std::max_element`. Écrite avec `>`, elle fait
      chercher le minimum.
  - key: bug-max-pour-plafonner
    format: bug-fix
    question: |-
      Ce programme devrait plafonner la remise à 50 et afficher `50`. Il affiche `80`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>

      int main() {
          const int demandee = 80;
          const int remise = std::max(demandee, 50);
          std::println("{}", remise);
      }
      ```
    choices:
      - {text: "Écrire `std::min(demandee, 50)`", correct: true}
      - {text: "Écrire `std::max(50, demandee)`", correct: false}
      - {text: "Écrire `std::minmax(demandee, 50)`", correct: false}
      - {text: "Écrire `std::max({demandee, 50})`", correct: false}
    answer: |-
      ```cpp
      const int remise = std::min(demandee, 50);
      ```
      Un **plafond** se pose avec `std::min` : on garde le plus petit de la valeur et de la limite. `std::max`
      pose un plancher. Pour les deux à la fois : `std::clamp`.
