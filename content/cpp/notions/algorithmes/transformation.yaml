notion: transformation
lesson: |-
  Cinq algorithmes de `<algorithm>` écrivent dans une suite d'éléments, ou appliquent une fonction à chacun.

  | Algorithme | Ce qu'il fait |
  |---|---|
  | `std::for_each(d, f, fn)` | appelle `fn` sur chaque élément |
  | `std::transform(d, f, sortie, fn)` | écrit `fn(élément)` dans la sortie |
  | `std::copy(d, f, sortie)` | recopie les éléments dans la sortie |
  | `std::copy_if(d, f, sortie, pred)` | recopie ceux qui vérifient le prédicat |
  | `std::fill(d, f, valeur)` | met tous les éléments à `valeur` |
  | `std::generate(d, f, gen)` | met chaque élément à `gen()`, appelé à chaque fois |

  **`std::transform`.** Il lit une suite, applique une fonction, et écrit le résultat **ailleurs**, ou sur place :

  ```cpp
  std::vector<int> v{1, 2, 3};
  std::vector<int> carres(v.size());
  std::transform(v.begin(), v.end(), carres.begin(), [](int x) { return x * x; });   // 1 4 9

  std::transform(v.begin(), v.end(), v.begin(), [](int x) { return x * 2; });        // sur place
  ```

  Une version à deux entrées combine deux suites élément par élément :

  ```cpp
  std::transform(a.begin(), a.end(), b.begin(), sommes.begin(), std::plus<>{});
  ```

  **Le piège : la sortie doit avoir la place.** Un algorithme **écrit** dans la sortie, il n'**ajoute** pas
  d'éléments. Écrire dans un vecteur vide est un comportement indéfini. Deux remèdes :

  ```cpp
  std::vector<int> sortie(v.size());                                 // 1. dimensionner d'avance
  std::transform(v.begin(), v.end(), sortie.begin(), fn);

  std::vector<int> sortie;                                           // 2. un itérateur d'insertion
  std::transform(v.begin(), v.end(), std::back_inserter(sortie), fn);
  ```

  `std::back_inserter(sortie)` (en-tête `<iterator>`) fabrique un itérateur dont chaque écriture appelle
  `push_back`. Il est indispensable avec `std::copy_if`, dont on ne connaît pas d'avance le nombre de résultats.

  **`std::fill` et `std::generate`.** `fill` copie la **même** valeur partout ; `generate` **rappelle** une
  fonction pour chaque élément, ce qui permet une suite :

  ```cpp
  std::fill(v.begin(), v.end(), 0);
  std::generate(v.begin(), v.end(), [n = 0]() mutable { return n++; });      // 0 1 2
  ```

  Les variantes `fill_n` et `generate_n` prennent un début et un **nombre** d'éléments.

  **`std::for_each`.** Il applique une fonction pour ses **effets**, et ignore ce qu'elle renvoie. Pour modifier
  les éléments, la lambda les reçoit par référence. Une boucle sur un intervalle dit souvent la même chose plus
  simplement ; `for_each` garde son intérêt sur une partie de conteneur.

  **Ce que renvoient ces algorithmes.** `transform`, `copy` et `copy_if` renvoient l'itérateur **après le dernier
  élément écrit**.

  **En entretien** : « `transform` applique une fonction et écrit le résultat, `copy_if` filtre, `fill` et
  `generate` remplissent. Le piège commun : la destination doit déjà avoir la place, sinon je passe un
  `std::back_inserter`. »
cards:
  - key: transform
    format: course
    question: "Que fait `std::transform(v.begin(), v.end(), sortie.begin(), fn)` ?"
    choices:
      - {text: "Il écrit dans `sortie` le résultat de `fn` appliquée à chaque élément de `v`", correct: true}
      - {text: "Il appelle `fn` sur chaque élément de `v`, et ignore ce qu'elle renvoie", correct: false}
      - {text: "Il recopie dans `sortie` les éléments de `v` pour lesquels `fn` est vraie", correct: false}
      - {text: "Il trie `v` selon `fn`, puis écrit le résultat dans `sortie`", correct: false}
    answer: "C'est l'algorithme qui « applique une fonction à tout ». La sortie peut être `v.begin()` elle-même, pour transformer sur place."
  - key: place
    format: course
    question: "Que se passe-t-il si la sortie d'un `std::copy` est le début d'un vecteur vide ?"
    choices:
      - {text: "C'est un comportement indéfini : l'algorithme écrit, il n'ajoute pas d'éléments", correct: true}
      - {text: "Le vecteur s'agrandit à chaque élément copié", correct: false}
      - {text: "L'algorithme ne copie rien, et renvoie le début du vecteur", correct: false}
      - {text: "Une exception `std::out_of_range` est lancée", correct: false}
    answer: "Un algorithme ne connaît que des itérateurs : il ne peut pas changer la taille du conteneur. Il faut le dimensionner d'avance, ou passer un `std::back_inserter`."
  - key: back-inserter
    format: course
    question: "Que fait `std::back_inserter(v)` ?"
    choices:
      - {text: "Il fabrique un itérateur dont chaque écriture appelle `v.push_back`", correct: true}
      - {text: "Il renvoie un itérateur sur le dernier élément de `v`", correct: false}
      - {text: "Il réserve dans `v` la place de l'élément suivant", correct: false}
      - {text: "Il insère un élément nul à la fin de `v`", correct: false}
    answer: "C'est un itérateur d'insertion, de l'en-tête `<iterator>`. Il permet à un algorithme de remplir un conteneur vide."
  - key: fill-ou-generate
    format: course
    question: "Quelle différence entre `std::fill` et `std::generate` ?"
    choices:
      - {text: "`fill` copie la même valeur partout ; `generate` appelle une fonction pour chaque élément", correct: true}
      - {text: "`fill` appelle une fonction pour chaque élément ; `generate` copie la même valeur partout", correct: false}
      - {text: "`fill` ajoute des éléments au conteneur ; `generate` remplace ceux qui existent", correct: false}
      - {text: "`fill` remplit avec des zéros ; `generate` remplit avec des nombres au hasard", correct: false}
    answer: "Avec une fonction à état, `generate` produit une suite : 0, 1, 2... `fill` ne sait écrire qu'une valeur."
  - key: vf-sur-place
    format: true-false
    question: "`std::transform` peut écrire son résultat dans le conteneur qu'il lit."
    truth: true
    answer: "Il suffit de donner `v.begin()` comme sortie : chaque élément est remplacé par son image."
  - key: vf-for-each-retour
    format: true-false
    question: "`std::for_each` range dans le conteneur ce que renvoie la fonction appelée."
    truth: false
    answer: "Il ignore la valeur de retour. Pour écrire un résultat, c'est `std::transform`, ou une lambda qui reçoit l'élément par référence."
  - key: vf-copy-agrandit
    format: true-false
    question: "`std::copy` agrandit le conteneur de destination quand il manque de place."
    truth: false
    answer: "Il écrit là où on lui dit. Sans place, c'est un comportement indéfini."
  - key: vf-copy-if
    format: true-false
    question: "`std::copy_if` ne recopie que les éléments qui vérifient un prédicat."
    truth: true
    answer: "C'est le filtre de la bibliothèque. Comme le nombre de résultats n'est pas connu d'avance, on l'utilise avec `std::back_inserter`."
  - key: qcm-filtrer
    format: multiple-choice
    question: "Quel algorithme recopie dans un autre vecteur les seuls nombres pairs ?"
    choices:
      - {text: "`std::copy_if`", correct: true}
      - {text: "`std::transform`", correct: false}
      - {text: "`std::fill`", correct: false}
      - {text: "`std::for_each`", correct: false}
    answer: "`std::copy_if(d, f, sortie, predicat)`. `transform` écrit un résultat pour chaque élément, sans en écarter."
  - key: qcm-zero
    format: multiple-choice
    question: "Quelle ligne remet à zéro tous les éléments du vecteur `v` ?"
    choices:
      - {text: "`std::fill(v.begin(), v.end(), 0);`", correct: true}
      - {text: "`std::copy(v.begin(), v.end(), 0);`", correct: false}
      - {text: "`std::generate(v.begin(), v.end(), 0);`", correct: false}
      - {text: "`std::transform(v.begin(), v.end(), 0);`", correct: false}
    answer: "`fill` reçoit une valeur. `generate` attend une fonction, `copy` et `transform` une sortie."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::back_inserter` ?"
    choices:
      - {text: "`<iterator>`", correct: true}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<vector>`", correct: false}
      - {text: "`<utility>`", correct: false}
    answer: "Les itérateurs d'insertion sont dans `<iterator>`."
  - key: qcm-retour
    format: multiple-choice
    question: "Que renvoie `std::copy` ?"
    choices:
      - {text: "Un itérateur après le dernier élément écrit", correct: true}
      - {text: "Le nombre d'éléments copiés", correct: false}
      - {text: "Un itérateur sur le premier élément écrit", correct: false}
      - {text: "Rien : `std::copy` renvoie `void`", correct: false}
    answer: "On peut ainsi enchaîner une seconde copie à la suite, ou effacer ce qui reste."
  - key: trous-transform
    format: fill-in
    question: |-
      Complète pour écrire dans `carres` le carré de chaque élément :
      ```cpp
      std::___(v.begin(), v.end(), carres.begin(), [](int x) { return x * x; });
      ```
    blanks:
      - [transform]
    answer: "`std::transform` applique la fonction, et écrit le résultat dans la sortie."
  - key: trous-back-inserter
    format: fill-in
    question: |-
      Complète pour que la copie ajoute les éléments à la fin du vecteur vide :
      ```cpp
      std::vector<int> sortie;
      std::copy(v.begin(), v.end(), std::___(sortie));
      ```
    blanks:
      - [back_inserter]
    answer: "`std::back_inserter` transforme chaque écriture en `push_back`."
  - key: trous-fill
    format: fill-in
    question: |-
      Complète pour mettre tous les éléments à 7 :
      ```cpp
      std::___(v.begin(), v.end(), 7);
      ```
    blanks:
      - [fill]
    answer: "`std::fill` écrit la même valeur partout."
  - key: trous-copy-if
    format: fill-in
    question: |-
      Complète pour ne garder que les nombres positifs :
      ```cpp
      std::___(v.begin(), v.end(), std::back_inserter(positifs), [](int x) { return x > 0; });
      ```
    blanks:
      - [copy_if]
    answer: "`std::copy_if` recopie les éléments qui vérifient le prédicat."
  - key: code-transform
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          std::vector<int> carres(v.size());
          std::transform(v.begin(), v.end(), carres.begin(), [](int x) { return x * x; });
          std::println("{} {} {}", carres[0], carres[1], carres[2]);
      }
      ```
    choices:
      - {text: "`1 4 9`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`2 4 6`", correct: false}
      - {text: "`0 0 0`", correct: false}
    answer: "`1 4 9` : chaque élément de `v` passe par la lambda, et son carré est écrit à la même position dans `carres`."
    check:
      output: "1 4 9"
  - key: code-copy-if
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <iterator>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{5, 8, 3, 6, 1};
          std::vector<int> pairs{0};
          std::copy_if(v.begin(), v.end(), std::back_inserter(pairs), [](int x) { return x % 2 == 0; });
          std::println("{} {}", pairs.size(), pairs.back());
      }
      ```
    choices:
      - {text: "`3 6`", correct: true}
      - {text: "`2 6`", correct: false}
      - {text: "`3 8`", correct: false}
      - {text: "`6 1`", correct: false}
    answer: "`3 6` : `back_inserter` ajoute après le 0 déjà présent. Les pairs, 8 puis 6, arrivent dans l'ordre : 0 8 6."
    check:
      output: "3 6"
  - key: code-generate
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v(4);
          std::generate(v.begin(), v.end(), [n = 1]() mutable {
              n *= 2;
              return n;
          });
          std::fill(v.begin(), v.begin() + 1, 0);
          std::println("{} {} {} {}", v[0], v[1], v[2], v[3]);
      }
      ```
    choices:
      - {text: "`0 4 8 16`", correct: true}
      - {text: "`2 4 8 16`", correct: false}
      - {text: "`0 2 2 2`", correct: false}
      - {text: "`0 0 0 0`", correct: false}
    answer: "`0 4 8 16` : `generate` rappelle la lambda pour chaque élément : 2, 4, 8, 16. `fill` ne touche qu'au premier, l'intervalle s'arrêtant à `begin() + 1`."
    check:
      output: "0 4 8 16"
  - key: code-deux-entrees
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <functional>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> a{1, 2, 3};
          const std::vector<int> b{10, 20, 30};
          std::vector<int> c(3);
          std::transform(a.begin(), a.end(), b.begin(), c.begin(), std::plus<>{});
          std::println("{} {} {}", c[0], c[1], c[2]);
      }
      ```
    choices:
      - {text: "`11 22 33`", correct: true}
      - {text: "`10 20 30`", correct: false}
      - {text: "`10 40 90`", correct: false}
      - {text: "`1 2 3`", correct: false}
    answer: "`11 22 33` : la version à deux entrées combine les éléments de même rang. `std::plus<>` les additionne."
    check:
      output: "11 22 33"
  - key: bug-sortie-vide
    format: bug-fix
    question: |-
      Ce programme écrit dans un vecteur vide : il plante. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          std::vector<int> doubles;
          std::transform(v.begin(), v.end(), doubles.begin(), [](int x) { return x * 2; });
          std::println("{}", doubles.size());
      }
      ```
    choices:
      - {text: "Passer `std::back_inserter(doubles)` comme sortie", correct: true}
      - {text: "Passer `doubles.end()` comme sortie", correct: false}
      - {text: "Appeler `doubles.reserve(3);` avant, sans changer la sortie", correct: false}
      - {text: "Passer `doubles.data()` comme sortie", correct: false}
    answer: |-
      ```cpp
      std::transform(v.begin(), v.end(), std::back_inserter(doubles), [](int x) { return x * 2; });
      ```
      L'algorithme écrit à travers l'itérateur, sans rien ajouter. `reserve` alloue de la place sans créer
      d'élément : la taille resterait 0. `std::vector<int> doubles(v.size());` conviendrait aussi.
  - key: bug-for-each-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `10 20 30`. Il affiche `1 2 3`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          std::for_each(v.begin(), v.end(), [](int x) { return x * 10; });
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "Appeler `std::transform`, avec `v.begin()` comme sortie", correct: true}
      - {text: "Appeler `std::for_each` deux fois de suite", correct: false}
      - {text: "Appeler `std::copy`, avec `v.begin()` comme sortie", correct: false}
      - {text: "Appeler `std::fill`, avec la lambda comme valeur", correct: false}
    answer: |-
      ```cpp
      std::transform(v.begin(), v.end(), v.begin(), [](int x) { return x * 10; });
      ```
      `std::for_each` ignore ce que renvoie la lambda. `std::transform` range le résultat dans la sortie, ici le
      vecteur lui-même.
  - key: bug-fill-suite
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 1 2`. Il affiche `0 0 0`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v(3);
          int n = 0;
          std::fill(v.begin(), v.end(), n++);
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "Appeler `std::generate`, avec une lambda qui renvoie `n++`", correct: true}
      - {text: "Appeler `std::fill`, avec `++n` à la place de `n++`", correct: false}
      - {text: "Appeler `std::fill` trois fois de suite", correct: false}
      - {text: "Appeler `std::copy`, avec `n++` comme sortie", correct: false}
    answer: |-
      ```cpp
      std::generate(v.begin(), v.end(), [&n] { return n++; });
      ```
      `n++` est évalué une seule fois, avant l'appel : `fill` reçoit la valeur 0, et l'écrit partout. `generate`
      rappelle la fonction pour chaque élément. `std::iota(v.begin(), v.end(), 0)` fait cette suite directement.
  - key: bug-sortie-trop-petite
    format: bug-fix
    question: |-
      Ce programme copie cinq éléments dans un vecteur de trois : il écrit hors bornes. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> source{1, 2, 3, 4, 5};
          std::vector<int> copie(3);
          std::copy(source.begin(), source.end(), copie.begin());
          std::println("{}", copie.size());
      }
      ```
    choices:
      - {text: "Déclarer `std::vector<int> copie(source.size());`", correct: true}
      - {text: "Déclarer `std::vector<int> copie(3, 0);`", correct: false}
      - {text: "Passer `copie.end()` comme sortie", correct: false}
      - {text: "Passer `copie.begin() + 2` comme sortie", correct: false}
    answer: |-
      ```cpp
      std::vector<int> copie(source.size());
      ```
      La destination doit pouvoir recevoir tous les éléments. Ici, `std::vector<int> copie = source;` serait encore
      plus simple.
