notion: ranges-algorithmes
lesson: |-
  Depuis C++20, chaque algorithme de `<algorithm>` a une seconde version dans l'espace de noms **`std::ranges`**.
  Elle prend **directement le conteneur**, au lieu d'une paire d'itérateurs.

  ```cpp
  std::vector<int> v{3, 1, 2};

  std::sort(v.begin(), v.end());        // la version classique
  std::ranges::sort(v);                 // la version « ranges »

  auto it = std::ranges::find(v, 2);
  bool negatif = std::ranges::any_of(v, [](int x) { return x < 0; });
  auto n = std::ranges::count(v, 1);
  ```

  Un **range** (un intervalle) est tout ce qui a un début et une fin : un conteneur, un tableau, une
  `std::string`, un `std::span`, une vue.

  **Ce qu'on y gagne.**

  - **Plus court**, et plus lisible.
  - **Plus sûr** : impossible de passer le début d'un conteneur et la fin d'un autre.
  - **Des erreurs plus claires** : les algorithmes sont contraints par des concepts. Trier une `std::list` donne
    « constraints not satisfied », pas quarante lignes dans `stl_algo.h`.
  - **Les projections.**

  **Les projections.** Un argument supplémentaire dit **sur quoi** porte l'opération : un membre, ou une fonction
  appliquée à chaque élément avant la comparaison.

  ```cpp
  struct Personne {
      std::string nom;
      int age;
  };

  std::ranges::sort(gens, {}, &Personne::age);                       // trier par âge
  std::ranges::sort(gens, std::greater<>{}, &Personne::age);         // par âge décroissant
  auto it = std::ranges::find(gens, "Ada", &Personne::nom);          // chercher par nom
  auto doyen = std::ranges::max_element(gens, {}, &Personne::age);
  ```

  Le `{}` garde la comparaison par défaut. Plus besoin d'écrire une lambda qui compare deux personnes.

  **Les versions à itérateurs existent aussi.** `std::ranges::sort(v.begin(), v.begin() + 3)` trie une partie.

  **Ce qui change dans les valeurs de retour.** Certains algorithmes renvoient davantage :

  - `std::ranges::remove` et `unique` renvoient le **sous-intervalle à effacer** : `v.erase(r.begin(), r.end())` ;
  - `std::ranges::copy`, `transform` renvoient une structure avec `.in` et `.out`.

  **Le piège du temporaire.** Un algorithme qui renvoie un itérateur, appelé sur un conteneur **temporaire**,
  renvoie `std::ranges::dangling` : un type vide, qui fait échouer la compilation si l'on s'en sert. C'est une
  protection : l'itérateur désignerait un conteneur déjà détruit.

  ```cpp
  auto it = std::ranges::find(creer_vecteur(), 2);     // it est un std::ranges::dangling
  ```

  **Ce qui n'y est pas.** Les algorithmes de `<numeric>`, comme `accumulate`, n'ont pas de version `ranges` en
  C++20 ; C++23 ajoute `std::ranges::fold_left`. `std::ranges::contains` arrive aussi en C++23.

  **En entretien** : « Les algorithmes de `std::ranges` prennent le conteneur entier, sont contraints par des
  concepts, et acceptent une projection : `std::ranges::sort(gens, {}, &Personne::age)` trie par âge sans lambda.
  Sur un temporaire, ils renvoient `dangling` au lieu d'un itérateur pendant. »
cards:
  - key: principe
    format: course
    question: "Que reçoit `std::ranges::sort`, à la différence de `std::sort` ?"
    choices:
      - {text: "Le conteneur lui-même, au lieu d'une paire d'itérateurs", correct: true}
      - {text: "Une copie du conteneur, qu'il renvoie triée", correct: false}
      - {text: "Un pointeur vers le conteneur, et sa taille", correct: false}
      - {text: "Une paire d'itérateurs, dans l'ordre inverse", correct: false}
    answer: "`std::ranges::sort(v);` : le début et la fin sont pris sur le conteneur. On ne peut plus mélanger les itérateurs de deux conteneurs."
  - key: projection
    format: course
    question: "Qu'est-ce qu'une projection, dans un algorithme de `std::ranges` ?"
    choices:
      - {text: "Une fonction, ou un membre, appliquée à chaque élément avant la comparaison", correct: true}
      - {text: "Une copie du conteneur, sur laquelle travaille l'algorithme", correct: false}
      - {text: "Un itérateur qui parcourt le conteneur à l'envers", correct: false}
      - {text: "Une contrainte sur le type des éléments du conteneur", correct: false}
    answer: "`std::ranges::sort(gens, {}, &Personne::age)` compare les âges, sans lambda à deux paramètres."
  - key: dangling
    format: course
    question: "Que renvoie `std::ranges::find` quand on l'appelle sur un vecteur temporaire ?"
    choices:
      - {text: "Un `std::ranges::dangling`, inutilisable, au lieu d'un itérateur pendant", correct: true}
      - {text: "Un itérateur valable, car le temporaire est prolongé", correct: false}
      - {text: "Une copie de l'élément trouvé", correct: false}
      - {text: "Un pointeur nul", correct: false}
    answer: "Le vecteur serait détruit avant qu'on puisse lire l'itérateur. Le type `dangling` transforme ce bug en erreur de compilation."
  - key: concepts
    format: course
    question: "Pourquoi les erreurs des algorithmes de `std::ranges` sont-elles plus lisibles ?"
    choices:
      - {text: "Ils sont contraints par des concepts : l'appel inadapté est refusé d'emblée", correct: true}
      - {text: "Ils sont compilés à part, dans une bibliothèque déjà vérifiée", correct: false}
      - {text: "Ils lancent une exception au lieu de refuser de compiler", correct: false}
      - {text: "Ils convertissent le conteneur vers un type qui convient", correct: false}
    answer: "`std::ranges::sort` exige un intervalle à accès direct. Avec une `std::list`, le message dit que la contrainte n'est pas satisfaite, à la ligne de l'appel."
  - key: vf-cpp20
    format: true-false
    question: "Les algorithmes de `std::ranges` existent depuis C++20."
    truth: true
    answer: "Ils sont dans `<algorithm>`, comme les versions classiques, mais dans l'espace de noms `std::ranges`."
  - key: vf-partie
    format: true-false
    question: "Un algorithme de `std::ranges` ne peut traiter qu'un conteneur entier."
    truth: false
    answer: "Il accepte aussi une paire d'itérateurs, ou une vue sur une partie du conteneur."
  - key: vf-accumulate
    format: true-false
    question: "`std::ranges::accumulate` existe en C++20."
    truth: false
    answer: "Les algorithmes de `<numeric>` n'ont pas été convertis en C++20. C++23 apporte `std::ranges::fold_left`."
  - key: vf-tableau
    format: true-false
    question: "`std::ranges::sort` accepte un tableau C comme `int t[5]`."
    truth: true
    answer: "Un tableau a un début et une fin connus : c'est un range, comme un conteneur ou une `std::string`."
  - key: qcm-trier-par-membre
    format: multiple-choice
    question: "Quelle ligne trie des `Personne` par leur membre `age` ?"
    choices:
      - {text: "`std::ranges::sort(gens, {}, &Personne::age);`", correct: true}
      - {text: "`std::ranges::sort(gens, &Personne::age);`", correct: false}
      - {text: "`std::ranges::sort(gens.age);`", correct: false}
      - {text: "`std::ranges::sort(gens, Personne::age, {});`", correct: false}
    answer: "La projection est le troisième argument ; `{}` garde la comparaison par défaut. En deuxième position, le membre serait pris pour une comparaison."
  - key: qcm-chercher
    format: multiple-choice
    question: "Quelle ligne cherche la valeur `7` dans le vecteur `v` ?"
    choices:
      - {text: "`auto it = std::ranges::find(v, 7);`", correct: true}
      - {text: "`auto it = std::ranges::find(7, v);`", correct: false}
      - {text: "`auto it = v.find(7);`", correct: false}
      - {text: "`auto it = std::ranges::find(v.begin(), 7);`", correct: false}
    answer: "Le conteneur d'abord, la valeur ensuite. Le résultat est un itérateur, à comparer à `v.end()`."
  - key: qcm-plus-age
    format: multiple-choice
    question: "Quelle ligne donne un itérateur sur la personne la plus âgée ?"
    choices:
      - {text: "`std::ranges::max_element(gens, {}, &Personne::age)`", correct: true}
      - {text: "`std::ranges::max(gens.age)`", correct: false}
      - {text: "`std::ranges::sort(gens, &Personne::age)`", correct: false}
      - {text: "`std::ranges::find(gens, &Personne::age)`", correct: false}
    answer: "`max_element` avec une projection compare les âges, et renvoie un itérateur sur l'élément entier."
  - key: qcm-remove
    format: multiple-choice
    question: "Que renvoie `std::ranges::remove(v, 0)` ?"
    choices:
      - {text: "Le sous-intervalle des éléments à effacer", correct: true}
      - {text: "Le nombre d'éléments retirés", correct: false}
      - {text: "Un nouveau vecteur sans les zéros", correct: false}
      - {text: "Rien : il réduit la taille du vecteur", correct: false}
    answer: "Comme `std::remove`, il tasse sans changer la taille. On écrit `auto r = std::ranges::remove(v, 0); v.erase(r.begin(), r.end());`, ou plus simplement `std::erase(v, 0)`."
  - key: trous-ranges
    format: fill-in
    question: |-
      Complète pour trier le vecteur en lui passant directement le conteneur :
      ```cpp
      std::___::sort(v);
      ```
    blanks:
      - [ranges]
    answer: "Les algorithmes qui prennent un conteneur sont dans `std::ranges`."
  - key: trous-projection
    format: fill-in
    question: |-
      Complète pour trier les personnes par âge :
      ```cpp
      std::ranges::sort(gens, {}, &Personne::___);
      ```
    blanks:
      - [age]
    answer: "La projection `&Personne::age` fait porter la comparaison sur ce membre."
  - key: trous-any-of
    format: fill-in
    question: |-
      Complète pour savoir si au moins un élément est négatif :
      ```cpp
      bool negatif = std::ranges::___(v, [](int x) { return x < 0; });
      ```
    blanks:
      - [any_of]
    answer: "`std::ranges::any_of` prend le conteneur et un prédicat."
  - key: trous-comparaison-defaut
    format: fill-in
    question: |-
      Complète pour garder la comparaison par défaut, et ne donner que la projection :
      ```cpp
      std::ranges::sort(gens, ___, &Personne::nom);
      ```
    blanks:
      - ["{}"]
    answer: "`{}` construit la comparaison par défaut, `std::ranges::less`."
  - key: code-sort-find
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 1, 3};
          std::ranges::sort(v);
          const auto it = std::ranges::find(v, 3);
          std::println("{} {} {}", v.front(), it - v.begin(), std::ranges::count(v, 9));
      }
      ```
    choices:
      - {text: "`1 1 0`", correct: true}
      - {text: "`4 2 0`", correct: false}
      - {text: "`1 2 0`", correct: false}
      - {text: "`1 1 1`", correct: false}
    answer: "`1 1 0` : trié, le vecteur vaut 1 3 4. Le 3 est à l'indice 1, et aucun élément ne vaut 9."
    check:
      output: "1 1 0"
  - key: code-projection
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Léa", 40}, {"Zoé", 25}, {"Ali", 33}};
          std::ranges::sort(gens, {}, &Personne::age);
          std::println("{} {}", gens.front().nom, gens.back().nom);
      }
      ```
    choices:
      - {text: "`Zoé Léa`", correct: true}
      - {text: "`Ali Zoé`", correct: false}
      - {text: "`Léa Zoé`", correct: false}
      - {text: "`Léa Ali`", correct: false}
    answer: "`Zoé Léa` : la projection fait trier par âge croissant : 25, 33, 40."
    check:
      output: "Zoé Léa"
  - key: code-projection-find
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Produit {
          std::string nom;
          int prix;
      };

      int main() {
          const std::vector<Produit> v{{"stylo", 2}, {"livre", 15}, {"cahier", 4}};
          const auto cher = std::ranges::max_element(v, {}, &Produit::prix);
          const auto it = std::ranges::find(v, 4, &Produit::prix);
          std::println("{} {}", cher->nom, it->nom);
      }
      ```
    choices:
      - {text: "`livre cahier`", correct: true}
      - {text: "`stylo cahier`", correct: false}
      - {text: "`livre stylo`", correct: false}
      - {text: "`cahier livre`", correct: false}
    answer: "`livre cahier` : la projection fait porter le maximum et la recherche sur le prix. Le plus cher est le livre ; le produit à 4 est le cahier."
    check:
      output: "livre cahier"
  - key: code-all-of
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>

      int main() {
          const std::string mot = "bonjour";
          const auto voyelle = [](char c) { return c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u'; };
          std::println("{} {} {}", std::ranges::count_if(mot, voyelle), std::ranges::all_of(mot, voyelle),
                       std::ranges::any_of(mot, voyelle));
      }
      ```
    choices:
      - {text: "`3 false true`", correct: true}
      - {text: "`4 false true`", correct: false}
      - {text: "`3 true true`", correct: false}
      - {text: "`3 false false`", correct: false}
    answer: "`3 false true` : une `std::string` est un range. `bonjour` contient trois voyelles (o, o, u) : pas toutes ses lettres, mais au moins une."
    check:
      output: "3 false true"
  - key: bug-sort-list
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel : les contraintes de `std::ranges::sort` ne sont pas satisfaites. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{3, 1, 2};
          std::ranges::sort(l);
          std::println("{}", l.front());
      }
      ```
    choices:
      - {text: "Appeler `l.sort();`", correct: true}
      - {text: "Appeler `std::sort(l.begin(), l.end());`", correct: false}
      - {text: "Appeler `std::ranges::sort(l.begin(), l.end());`", correct: false}
      - {text: "Appeler `std::ranges::stable_sort(l);`", correct: false}
    answer: |-
      ```cpp
      l.sort();
      ```
      `std::ranges::sort` exige un intervalle à accès direct, ce qu'une liste n'est pas. Le concept le dit à la
      ligne de l'appel. La liste a sa propre fonction `sort`.
  - key: bug-projection-mal-placee
    format: bug-fix
    question: |-
      Le compilateur refuse ce tri : le membre est passé à la place de la comparaison. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Léa", 40}, {"Zoé", 25}};
          std::ranges::sort(gens, &Personne::age);
          std::println("{}", gens.front().nom);
      }
      ```
    choices:
      - {text: "Écrire `std::ranges::sort(gens, {}, &Personne::age);`", correct: true}
      - {text: "Écrire `std::ranges::sort(gens, &Personne::age, {});`", correct: false}
      - {text: "Écrire `std::ranges::sort(gens, Personne::age);`", correct: false}
      - {text: "Écrire `std::ranges::sort(&Personne::age, gens);`", correct: false}
    answer: |-
      ```cpp
      std::ranges::sort(gens, {}, &Personne::age);
      ```
      Le deuxième argument est la comparaison, le troisième la projection. `{}` garde la comparaison par défaut.
  - key: bug-temporaire
    format: bug-fix
    question: |-
      Le compilateur refuse `*it` : `it` est un `std::ranges::dangling`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      std::vector<int> notes() {
          return {12, 15, 9};
      }

      int main() {
          const auto it = std::ranges::find(notes(), 15);
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "Ranger d'abord le vecteur dans une variable, puis chercher dedans", correct: true}
      - {text: "Déclarer `it` avec `auto&&` à la place de `const auto`", correct: false}
      - {text: "Écrire `it.base()` à la place de `*it`", correct: false}
      - {text: "Chercher avec `std::ranges::find(notes().begin(), notes().end(), 15)`", correct: false}
    answer: |-
      ```cpp
      const auto v = notes();
      const auto it = std::ranges::find(v, 15);
      ```
      Le vecteur renvoyé par `notes()` est détruit à la fin de l'instruction : un itérateur vers lui serait pendant.
      L'algorithme renvoie `dangling` pour l'empêcher. Appeler `notes()` deux fois donnerait deux vecteurs
      différents.
  - key: bug-sans-ranges
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'sort(std::vector<int>&)' ». Quelle correction est
      la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{3, 1, 2};
          std::sort(v);
          std::println("{}", v.front());
      }
      ```
    choices:
      - {text: "Appeler `std::ranges::sort(v);`", correct: true}
      - {text: "Appeler `v.sort();`", correct: false}
      - {text: "Appeler `std::sort(&v);`", correct: false}
      - {text: "Appeler `std::sort(v, v);`", correct: false}
    answer: |-
      ```cpp
      std::ranges::sort(v);
      ```
      `std::sort` attend deux itérateurs. Seule la version de `std::ranges` prend le conteneur. Un vecteur n'a pas
      de fonction membre `sort`.
