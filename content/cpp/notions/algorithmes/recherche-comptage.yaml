notion: recherche-comptage
lesson: |-
  Cinq familles d'algorithmes répondent aux questions « où ? », « combien ? » et « y en a-t-il ? ». Tous parcourent
  l'intervalle une fois : leur coût est linéaire.

  **Chercher : `find` et `find_if`.**

  ```cpp
  std::vector<int> v{4, 9, 2, 9};
  auto it = std::find(v.begin(), v.end(), 9);                              // la valeur 9
  auto pair = std::find_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
  ```

  Ils renvoient un itérateur sur le **premier** élément qui convient, ou **`end()`** s'il n'y en a pas. On compare
  toujours le résultat à `end()` avant de le déréférencer.

  ```cpp
  if (it != v.end()) {
      std::println("trouvé à l'indice {}", it - v.begin());   // 1
  }
  ```

  `std::find_if_not` cherche le premier élément qui **ne vérifie pas** le prédicat.

  **Compter : `count` et `count_if`.**

  ```cpp
  auto neufs = std::count(v.begin(), v.end(), 9);                          // 2
  auto grands = std::count_if(v.begin(), v.end(), [](int x) { return x > 3; });   // 3
  ```

  **Tester : `any_of`, `all_of`, `none_of`.** Ils renvoient un booléen, et s'arrêtent dès que la réponse est
  connue.

  | Algorithme | Vrai si... | Sur un intervalle vide |
  |---|---|---|
  | `std::any_of` | au moins un élément vérifie le prédicat | `false` |
  | `std::all_of` | tous les éléments le vérifient | `true` |
  | `std::none_of` | aucun élément ne le vérifie | `true` |

  `all_of` renvoie `true` sur un intervalle vide : aucun élément ne contredit la condition.

  **Choisir le bon.**

  - « Y en a-t-il un ? » : `any_of`, plutôt que `count_if(...) > 0`, qui parcourt tout.
  - « Où est-il ? » : `find_if`.
  - « Combien ? » : `count_if`.

  **Dans une map ou un ensemble**, on appelle la fonction **membre** : `m.find(cle)` est en O(log n) ou O(1), alors
  que `std::find` parcourrait tous les éléments.

  **Avec `std::ranges` (C++20)** : `std::ranges::find(v, 9)`, `std::ranges::any_of(v, predicat)`.

  **En entretien** : « `find` et `find_if` renvoient un itérateur, ou `end()` si rien ne convient. Pour un simple
  oui ou non, je prends `any_of`, qui s'arrête au premier élément trouvé. Et sur une map, la fonction membre
  `find`, pas l'algorithme. »
cards:
  - key: retour-de-find
    format: course
    question: "Que renvoie `std::find(v.begin(), v.end(), x)` ?"
    choices:
      - {text: "Un itérateur sur le premier élément égal à `x`, ou `v.end()`", correct: true}
      - {text: "L'indice du premier élément égal à `x`, ou `-1`", correct: false}
      - {text: "Un booléen : `true` si `x` est dans le vecteur", correct: false}
      - {text: "Le nombre d'éléments égaux à `x` dans le vecteur", correct: false}
    answer: "Un itérateur, qu'on compare à `end()`. Pour l'indice : `it - v.begin()`. Pour un booléen, `std::any_of` ou `std::ranges::contains` (C++23) ; pour un nombre, `std::count`."
  - key: find-ou-find-if
    format: course
    question: "Quelle différence entre `std::find` et `std::find_if` ?"
    choices:
      - {text: "`find` cherche une valeur ; `find_if` cherche un élément qui vérifie un prédicat", correct: true}
      - {text: "`find` cherche le premier élément ; `find_if` cherche le dernier élément", correct: false}
      - {text: "`find` renvoie un itérateur ; `find_if` renvoie un booléen", correct: false}
      - {text: "`find` parcourt tout l'intervalle ; `find_if` s'arrête au premier trouvé", correct: false}
    answer: "`find` compare chaque élément à la valeur avec `==`. `find_if` appelle le prédicat sur chaque élément. Les deux s'arrêtent au premier qui convient."
  - key: any-ou-count
    format: course
    question: "Pourquoi préférer `std::any_of(...)` à `std::count_if(...) > 0` ?"
    choices:
      - {text: "`any_of` s'arrête au premier élément qui convient ; `count_if` parcourt tout", correct: true}
      - {text: "`count_if` ne compile pas quand on compare son résultat à zéro", correct: false}
      - {text: "`any_of` trie l'intervalle avant de chercher, ce qui l'accélère", correct: false}
      - {text: "`count_if` modifie les éléments qu'il compte, au contraire d'`any_of`", correct: false}
    answer: "Les deux donnent la même réponse. `any_of` dit l'intention, et ne lit pas plus d'éléments que nécessaire."
  - key: all-of-vide
    format: course
    question: "Que renvoie `std::all_of` sur un intervalle vide ?"
    choices:
      - {text: "`true` : aucun élément ne contredit la condition", correct: true}
      - {text: "`false` : aucun élément ne vérifie la condition", correct: false}
      - {text: "Rien : il lève une exception `std::out_of_range`", correct: false}
      - {text: "Un résultat indéterminé, qui dépend du compilateur", correct: false}
    answer: "« Tous les éléments vérifient P » est vrai quand il n'y a aucun élément. À l'inverse, `any_of` renvoie `false` : il n'y en a aucun qui convienne."
  - key: vf-premier
    format: true-false
    question: "`std::find` renvoie un itérateur sur la première occurrence de la valeur."
    truth: true
    answer: Il s'arrête dès qu'il la trouve. Les occurrences suivantes ne sont pas examinées.
  - key: vf-none-of-vide
    format: true-false
    question: "`std::none_of` renvoie `false` sur un intervalle vide."
    truth: false
    answer: "Il renvoie `true` : aucun élément ne vérifie le prédicat, puisqu'il n'y a aucun élément."
  - key: vf-find-map
    format: true-false
    question: "Pour chercher une clé dans une `std::map`, `std::find` est aussi rapide que la fonction membre `find`."
    truth: false
    answer: "L'algorithme parcourt les éléments un par un, en O(n). La fonction membre descend dans l'arbre, en O(log n)."
  - key: vf-count-if-type
    format: true-false
    question: "`std::count_if` renvoie le nombre d'éléments qui vérifient le prédicat."
    truth: true
    answer: Il parcourt tout l'intervalle, et renvoie un entier signé.
  - key: qcm-au-moins-un
    format: multiple-choice
    question: "Quelle ligne dit si le vecteur `v` contient au moins un nombre négatif ?"
    choices:
      - {text: "`std::any_of(v.begin(), v.end(), [](int x) { return x < 0; })`", correct: true}
      - {text: "`std::all_of(v.begin(), v.end(), [](int x) { return x < 0; })`", correct: false}
      - {text: "`std::none_of(v.begin(), v.end(), [](int x) { return x < 0; })`", correct: false}
      - {text: "`std::find(v.begin(), v.end(), [](int x) { return x < 0; })`", correct: false}
    answer: "`any_of` : au moins un. `std::find` attend une valeur, pas un prédicat : il faudrait `std::find_if`, qui renvoie un itérateur."
  - key: qcm-indice
    format: multiple-choice
    question: "`it` est le résultat de `std::find` sur le vecteur `v`, et la valeur a été trouvée. Comment obtiens-tu son indice ?"
    choices:
      - {text: "`it - v.begin()`", correct: true}
      - {text: "`*it`", correct: false}
      - {text: "`it.index()`", correct: false}
      - {text: "`v.end() - it`", correct: false}
    answer: "La différence de deux itérateurs d'un vecteur donne la distance qui les sépare. `*it` donne la valeur trouvée."
  - key: qcm-compter-valeur
    format: multiple-choice
    question: "Quelle ligne compte les éléments égaux à `0` dans le vecteur `v` ?"
    choices:
      - {text: "`std::count(v.begin(), v.end(), 0)`", correct: true}
      - {text: "`std::count_if(v.begin(), v.end(), 0)`", correct: false}
      - {text: "`std::find(v.begin(), v.end(), 0)`", correct: false}
      - {text: "`v.count(0)`", correct: false}
    answer: "`std::count` compare à une valeur. `count_if` attend un prédicat, et un vecteur n'a pas de fonction membre `count`."
  - key: qcm-tous-positifs
    format: multiple-choice
    question: "Quel algorithme dit si tous les éléments d'un vecteur sont positifs ?"
    choices:
      - {text: "`std::all_of`", correct: true}
      - {text: "`std::any_of`", correct: false}
      - {text: "`std::find_if`", correct: false}
      - {text: "`std::count`", correct: false}
    answer: "`std::all_of` renvoie `true` si le prédicat est vrai pour chaque élément, et s'arrête au premier qui le contredit."
  - key: trous-find-if
    format: fill-in
    question: |-
      Complète pour chercher le premier nombre pair :
      ```cpp
      auto it = std::___(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
      ```
    blanks:
      - [find_if]
    answer: "`std::find_if` cherche avec un prédicat."
  - key: trous-end
    format: fill-in
    question: |-
      Complète pour vérifier que la valeur a été trouvée :
      ```cpp
      auto it = std::find(v.begin(), v.end(), 7);
      if (it != v.___()) {
          std::println("{}", *it);
      }
      ```
    blanks:
      - [end]
    answer: "`std::find` renvoie la fin de l'intervalle quand il ne trouve rien."
  - key: trous-count-if
    format: fill-in
    question: |-
      Complète pour compter les notes supérieures ou égales à 10 :
      ```cpp
      auto admis = std::___(notes.begin(), notes.end(), [](int n) { return n >= 10; });
      ```
    blanks:
      - [count_if]
    answer: "`std::count_if` compte les éléments pour lesquels le prédicat renvoie `true`."
  - key: trous-all-of
    format: fill-in
    question: |-
      Complète pour savoir si toutes les notes sont positives ou nulles :
      ```cpp
      bool valides = std::___(notes.begin(), notes.end(), [](int n) { return n >= 0; });
      ```
    blanks:
      - [all_of]
    answer: "`std::all_of` renvoie `true` si chaque élément vérifie le prédicat."
  - key: code-find-indice
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 9, 2, 9};
          auto it = std::find(v.begin(), v.end(), 9);
          std::println("{} {}", it - v.begin(), std::count(v.begin(), v.end(), 9));
      }
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`9 2`", correct: false}
    answer: "`1 2` : `std::find` s'arrête à la première occurrence, à l'indice 1. `std::count` compte les deux 9."
    check:
      output: "1 2"
  - key: code-non-trouve
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto it = std::find(v.begin(), v.end(), 7);
          std::println("{} {}", it == v.end(), it - v.begin());
      }
      ```
    choices:
      - {text: "`true 3`", correct: true}
      - {text: "`false 3`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "`true -1`", correct: false}
    answer: "`true 3` : la valeur est absente, `std::find` renvoie `end()`. Sa distance au début est la taille du vecteur."
    check:
      output: "true 3"
  - key: code-any-all-none
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{2, 4, 7};
          auto pair = [](int x) { return x % 2 == 0; };
          std::println("{} {} {}",
                       std::any_of(v.begin(), v.end(), pair),
                       std::all_of(v.begin(), v.end(), pair),
                       std::none_of(v.begin(), v.end(), pair));
      }
      ```
    choices:
      - {text: "`true false false`", correct: true}
      - {text: "`true true false`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false true`", correct: false}
    answer: "`true false false` : au moins un élément est pair ; 7 ne l'est pas, donc pas tous ; et il n'est pas vrai qu'aucun ne le soit."
    check:
      output: "true false false"
  - key: code-vide
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          auto positif = [](int x) { return x > 0; };
          std::println("{} {}",
                       std::all_of(v.begin(), v.end(), positif),
                       std::any_of(v.begin(), v.end(), positif));
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : sur un intervalle vide, « tous » est vrai, car rien ne le contredit ; « au moins un » est faux."
    check:
      output: "true false"
  - key: bug-find-sans-test
    format: bug-fix
    question: |-
      Ce programme devrait afficher `absent` quand la note 20 n'est pas dans le vecteur. Il lit après la fin du
      vecteur. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          auto it = std::find(notes.begin(), notes.end(), 20);
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "Comparer `it` à `notes.end()`, et n'afficher `*it` que s'il est différent", correct: true}
      - {text: "Comparer `*it` à `20`, et n'afficher `*it` que s'il est égal", correct: false}
      - {text: "Comparer `it` à `nullptr`, et n'afficher `*it` que s'il est différent", correct: false}
      - {text: "Remplacer `std::find` par `std::count`, et afficher `*it` sans test", correct: false}
    answer: |-
      ```cpp
      if (it != notes.end()) {
          std::println("{}", *it);
      } else {
          std::println("absent");
      }
      ```
      `std::find` renvoie `end()` quand la valeur manque, et `end()` ne se déréférence pas. Tester `*it` serait déjà
      la faute.
  - key: bug-find-avec-predicat
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : il ne sait pas comparer un `int` à une lambda. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{3, 8, 5};
          auto it = std::find(v.begin(), v.end(), [](int x) { return x > 4; });
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "Appeler `std::find_if`", correct: true}
      - {text: "Appeler `std::count`", correct: false}
      - {text: "Écrire `[&](int x)` au début de la lambda", correct: false}
      - {text: "Écrire `-> int` après les paramètres de la lambda", correct: false}
    answer: |-
      ```cpp
      auto it = std::find_if(v.begin(), v.end(), [](int x) { return x > 4; });
      ```
      `std::find` compare chaque élément à son troisième argument avec `==`. Pour chercher avec une condition, c'est
      `std::find_if`.
  - key: bug-all-of-pour-any-of
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : le panier contient au moins un article gratuit. Il affiche `false`.
      Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> prix{12, 0, 7};
          bool gratuit = std::all_of(prix.begin(), prix.end(), [](int p) { return p == 0; });
          std::println("{}", gratuit);
      }
      ```
    choices:
      - {text: "Appeler `std::any_of`", correct: true}
      - {text: "Appeler `std::none_of`", correct: false}
      - {text: "Écrire `p != 0` dans la lambda", correct: false}
      - {text: "Écrire `p = 0` dans la lambda", correct: false}
    answer: |-
      ```cpp
      bool gratuit = std::any_of(prix.begin(), prix.end(), [](int p) { return p == 0; });
      ```
      `all_of` demande que **tous** les prix soient nuls. « Au moins un » se dit `any_of`.
  - key: bug-iterateurs-melanges
    format: bug-fix
    question: |-
      Ce programme cherche `5` dans `a`. Son comportement est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a{1, 2, 3};
          std::vector<int> b{4, 5, 6};
          auto it = std::find(a.begin(), b.end(), 5);
          std::println("{}", it == a.end());
      }
      ```
    choices:
      - {text: "Écrire `std::find(a.begin(), a.end(), 5)`", correct: true}
      - {text: "Écrire `std::find(b.end(), a.begin(), 5)`", correct: false}
      - {text: "Écrire `std::find(a.begin(), b.end() - 1, 5)`", correct: false}
      - {text: "Écrire `std::find(a.end(), b.end(), 5)`", correct: false}
    answer: |-
      ```cpp
      auto it = std::find(a.begin(), a.end(), 5);
      ```
      Les deux itérateurs doivent délimiter un intervalle du **même** conteneur. Parti de `a`, l'algorithme
      n'atteint jamais la fin de `b`. `std::ranges::find(a, 5)` rend cette faute impossible.
