notion: std-function
lesson: |-
  Chaque lambda a son propre type, sans nom. On ne peut donc pas écrire le type d'un membre, d'un élément de
  vecteur ou d'un paramètre ordinaire qui accepterait « n'importe quelle lambda ». **`std::function`** (en-tête
  `<functional>`) répond à ce besoin : c'est un objet qui peut **contenir n'importe quel appelable** d'une
  **signature** donnée.

  ```cpp
  #include <functional>

  std::function<int(int, int)> operation;       // prend deux int, renvoie un int

  operation = [](int a, int b) { return a + b; };
  operation(2, 3);                               // 5
  operation = std::multiplies<>{};               // un foncteur
  operation = &maximum;                          // une fonction ordinaire
  ```

  Entre les chevrons : le type de retour, puis les types des paramètres entre parenthèses.

  **À quoi elle sert.**

  - Ranger un appelable dans un **membre** : une fonction de rappel, un gestionnaire d'événement.
  - Ranger des appelables **différents dans un même conteneur** : `std::vector<std::function<void()>>`.
  - Écrire une fonction **non template** qui reçoit un appelable, dans une interface compilée à part.

  **Une `std::function` vide.** Construite par défaut, elle ne contient rien. L'appeler lance
  **`std::bad_function_call`**. On la teste comme un booléen :

  ```cpp
  if (rappel) {
      rappel();
  }
  ```

  **Ce qu'elle coûte.** `std::function` efface le type de ce qu'elle contient (*type erasure*). Ce n'est pas
  gratuit :

  - chaque appel passe par une **indirection**, que le compilateur ne peut en général pas mettre en ligne ;
  - un appelable trop gros pour son petit tampon interne (une lambda avec plusieurs captures) est **alloué sur le
    tas** ;
  - elle **copie** l'appelable, qui doit donc être **copiable**.

  **Les alternatives.**

  | Besoin | Outil | Coût |
  |---|---|---|
  | Garder une lambda dans une variable locale | `auto` | aucun |
  | Passer un appelable à une fonction | un paramètre template : `template <typename F> void f(F&& fn)` | aucun |
  | Ranger, ou passer à travers une frontière non template | `std::function` | indirection, allocation possible |
  | Appelable non copiable (C++23) | `std::move_only_function` | comme `std::function` |
  | Lambda sans capture, API à la C | pointeur de fonction : `int (*)(int)` | une indirection |

  La règle : **`auto` ou un template quand on peut, `std::function` quand il faut ranger**.

  **Deux pièges.**

  - `std::function` **copie** : une lambda à état rangée dedans est une copie indépendante de l'originale.
  - Une lambda qui capture par référence, rangée dans une `std::function` qui survit aux variables capturées, laisse
    des références pendantes.

  **En entretien** : « `std::function<R(Args...)>` contient n'importe quel appelable de cette signature : c'est de
  l'effacement de type, au prix d'une indirection et parfois d'une allocation. Je la réserve au stockage (rappels,
  conteneurs d'actions) ; pour un paramètre, je préfère un template, et `auto` pour une variable locale. »
cards:
  - key: role
    format: course
    question: "À quoi sert `std::function` ?"
    choices:
      - {text: "À contenir n'importe quel appelable d'une signature donnée : lambda, fonction, foncteur", correct: true}
      - {text: "À déclarer une fonction dont le corps est écrit dans un autre fichier", correct: false}
      - {text: "À exécuter une fonction dans un autre thread, et à récupérer son résultat", correct: false}
      - {text: "À faire calculer une fonction à la compilation plutôt qu'à l'exécution", correct: false}
    answer: "Chaque lambda a un type unique. `std::function<int(int)>` est un seul type, qui peut en contenir plusieurs tour à tour."
  - key: signature
    format: course
    question: "Que décrit `std::function<bool(int, double)>` ?"
    choices:
      - {text: "Un appelable qui prend un `int` et un `double`, et renvoie un `bool`", correct: true}
      - {text: "Un appelable qui prend un `bool`, et renvoie un `int` et un `double`", correct: false}
      - {text: "Un appelable qui prend un `bool`, un `int` et un `double`", correct: false}
      - {text: "Un appelable qui renvoie un `bool`, un `int` ou un `double`", correct: false}
    answer: "Le type de retour vient d'abord, puis les types des paramètres entre parenthèses, comme dans une déclaration de fonction sans nom."
  - key: cout
    format: course
    question: "Que coûte un appel à travers une `std::function`, par rapport à l'appel direct d'une lambda ?"
    choices:
      - {text: "Une indirection que le compilateur ne met en général pas en ligne, et parfois une allocation", correct: true}
      - {text: "Rien : `std::function` est résolue à la compilation, comme un template", correct: false}
      - {text: "Un verrou, pris à chaque appel pour protéger l'appelable", correct: false}
      - {text: "Une copie de tous les arguments sur le tas, à chaque appel", correct: false}
    answer: "Le type de l'appelable est effacé : l'appel passe par un pointeur. Un appelable trop gros pour le tampon interne est alloué sur le tas à la construction."
  - key: alternative
    format: course
    question: "Une fonction reçoit un prédicat qu'elle appelle aussitôt. Comment le reçoit-elle sans coût ?"
    choices:
      - {text: "Par un paramètre template : `template <typename F> void f(F predicat)`", correct: true}
      - {text: "Par un paramètre `std::function<bool(int)> predicat`", correct: false}
      - {text: "Par un paramètre `void* predicat`, converti dans la fonction", correct: false}
      - {text: "Par un paramètre `std::any predicat`", correct: false}
    answer: "Avec un template, le compilateur connaît le type exact de la lambda et peut mettre son code en ligne. C'est ce que font les algorithmes standard."
  - key: vf-vide
    format: true-false
    question: "Appeler une `std::function` vide est un comportement indéfini."
    truth: false
    answer: "Elle lance `std::bad_function_call`. On la teste d'abord : `if (f)`."
  - key: vf-copiable
    format: true-false
    question: "`std::function` peut contenir une lambda qui a capturé un `std::unique_ptr`."
    truth: false
    answer: "Elle exige un appelable copiable. Pour un appelable seulement déplaçable, C++23 fournit `std::move_only_function`."
  - key: vf-auto
    format: true-false
    question: "Pour garder une lambda dans une variable locale, `auto` est préférable à `std::function`."
    truth: true
    answer: "`auto` garde le type exact de la lambda : ni indirection, ni allocation."
  - key: vf-en-tete
    format: true-false
    question: "`std::function` est déclarée dans l'en-tête `<functional>`."
    truth: true
    answer: "Avec `std::plus`, `std::greater`, `std::ref` et `std::bind`."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration décrit un rappel sans paramètre, qui ne renvoie rien ?"
    choices:
      - {text: "`std::function<void()> rappel;`", correct: true}
      - {text: "`std::function<()> rappel;`", correct: false}
      - {text: "`std::function<void> rappel;`", correct: false}
      - {text: "`std::function rappel<void()>;`", correct: false}
    answer: "La signature complète va entre les chevrons : `void()`."
  - key: qcm-tester
    format: multiple-choice
    question: "Comment vérifies-tu qu'une `std::function` nommée `f` contient un appelable ?"
    choices:
      - {text: "`if (f)`", correct: true}
      - {text: "`if (f.size() > 0)`", correct: false}
      - {text: "`if (f.valid())`", correct: false}
      - {text: "`if (*f)`", correct: false}
    answer: "`std::function` se convertit en booléen : `false` quand elle est vide. `f != nullptr` s'écrit aussi."
  - key: qcm-conteneur
    format: multiple-choice
    question: "Quel type range plusieurs lambdas différentes, toutes sans paramètre ni valeur de retour ?"
    choices:
      - {text: "`std::vector<std::function<void()>>`", correct: true}
      - {text: "`std::vector<auto>`", correct: false}
      - {text: "`std::vector<lambda>`", correct: false}
      - {text: "`std::vector<void()>`", correct: false}
    answer: "Chaque lambda a son type : il faut un type commun, que `std::function` fournit. `auto` n'est pas un argument de template."
  - key: qcm-exception
    format: multiple-choice
    question: "Quelle exception lance l'appel d'une `std::function` vide ?"
    choices:
      - {text: "`std::bad_function_call`", correct: true}
      - {text: "`std::bad_alloc`", correct: false}
      - {text: "`std::invalid_argument`", correct: false}
      - {text: "`std::out_of_range`", correct: false}
    answer: "`std::bad_function_call`, déclarée dans `<functional>`."
  - key: trous-function
    format: fill-in
    question: |-
      Complète pour déclarer un appelable qui prend deux `int` et renvoie un `int` :
      ```cpp
      std::___<int(int, int)> operation = [](int a, int b) { return a + b; };
      ```
    blanks:
      - [function]
    answer: "`std::function<int(int, int)>` accepte tout appelable de cette signature."
  - key: trous-signature
    format: fill-in
    question: |-
      Complète la signature d'un prédicat sur un entier :
      ```cpp
      std::function<___(int)> est_valide = [](int x) { return x > 0; };
      ```
    blanks:
      - [bool]
    answer: "Un prédicat renvoie un booléen : `bool(int)`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      std::function<void()> rappel;
      ```
    blanks:
      - [functional]
    answer: "`std::function` est déclarée dans `<functional>`."
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour n'appeler le rappel que s'il a été défini :
      ```cpp
      std::function<void()> rappel;
      if (___) {
          rappel();
      }
      ```
    blanks:
      - [rappel]
    answer: "Une `std::function` vide vaut `false` dans une condition."
  - key: code-reaffecter
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>

      int main() {
          std::function<int(int, int)> op = [](int a, int b) { return a + b; };
          const int somme = op(6, 3);
          op = std::multiplies<>{};
          const int produit = op(6, 3);
          op = [](int a, int b) { return a - b; };
          std::println("{} {} {}", somme, produit, op(6, 3));
      }
      ```
    choices:
      - {text: "`9 18 3`", correct: true}
      - {text: "`9 9 9`", correct: false}
      - {text: "`9 18 9`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`9 18 3` : la même variable contient tour à tour une lambda, un foncteur, puis une autre lambda. Tous ont la signature `int(int, int)`."
    check:
      output: "9 18 3"
  - key: code-vide
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>

      int main() {
          std::function<void()> rappel;
          std::print("{} ", static_cast<bool>(rappel));
          try {
              rappel();
          } catch (const std::bad_function_call&) {
              std::print("vide ");
          }
          rappel = [] { std::print("appelé "); };
          rappel();
          std::println("{}", static_cast<bool>(rappel));
      }
      ```
    choices:
      - {text: "`false vide appelé true`", correct: true}
      - {text: "`false appelé true`", correct: false}
      - {text: "`true vide appelé true`", correct: false}
      - {text: "`false vide appelé false`", correct: false}
    answer: "`false vide appelé true` : une `std::function` construite par défaut est vide, et l'appeler lance `std::bad_function_call`. Une fois affectée, elle vaut `true`."
    check:
      output: "false vide appelé true"
  - key: code-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>
      #include <vector>

      int main() {
          std::vector<std::function<int(int)>> etapes;
          etapes.push_back([](int x) { return x + 1; });
          etapes.push_back([](int x) { return x * 10; });
          etapes.push_back([](int x) { return x - 3; });
          int valeur = 2;
          for (const auto& etape : etapes) {
              valeur = etape(valeur);
          }
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "`27`", correct: true}
      - {text: "`30`", correct: false}
      - {text: "`18`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`27` : les trois lambdas, de types différents, sont rangées dans le même vecteur et appliquées dans l'ordre : 2 + 1 = 3, puis 30, puis 27."
    check:
      output: "27"
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>

      int main() {
          auto compteur = [n = 0]() mutable { return ++n; };
          std::function<int()> f = compteur;
          f();
          f();
          std::println("{} {}", f(), compteur());
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`3 1` : `std::function` contient une copie de la lambda, avec son propre compteur. L'originale n'a jamais été appelée avant : elle renvoie 1."
    check:
      output: "3 1"
  - key: bug-appel-vide
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « terminate called after throwing an instance of 'std::bad_function_call' ».
      Aucun rappel n'a été enregistré, et dans ce cas il ne devrait rien faire. Quelle correction est la bonne ?
      ```cpp
      #include <functional>
      #include <print>

      struct Bouton {
          std::function<void()> au_clic;
          void cliquer() { au_clic(); }
      };

      int main() {
          Bouton bouton;
          bouton.cliquer();
          std::println("fin");
      }
      ```
    choices:
      - {text: "Dans `cliquer`, n'appeler `au_clic` que si `if (au_clic)` est vrai", correct: true}
      - {text: "Dans `cliquer`, appeler `au_clic` deux fois de suite", correct: false}
      - {text: "Déclarer le membre `au_clic` avec le mot-clé `mutable`", correct: false}
      - {text: "Déclarer le membre `au_clic` avec le type `auto`", correct: false}
    answer: |-
      ```cpp
      void cliquer() {
          if (au_clic) {
              au_clic();
          }
      }
      ```
      Une `std::function` construite par défaut est vide, et l'appeler lance `std::bad_function_call`. On la teste
      avant. Un membre ne peut pas être déclaré `auto`.
  - key: bug-signature
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation : la lambda ne correspond pas à la signature annoncée. Quelle
      correction est la bonne ?
      ```cpp
      #include <functional>
      #include <print>
      #include <string>

      int main() {
          std::function<int(int)> longueur = [](const std::string& s) { return static_cast<int>(s.size()); };
          std::println("{}", longueur("abc"));
      }
      ```
    choices:
      - {text: "Déclarer `std::function<int(const std::string&)>`", correct: true}
      - {text: "Déclarer `std::function<std::string(int)>`", correct: false}
      - {text: "Déclarer `std::function<int()>`", correct: false}
      - {text: "Déclarer `std::function<void(int)>`", correct: false}
    answer: |-
      ```cpp
      std::function<int(const std::string&)> longueur = ...
      ```
      La signature annonce un paramètre `int`, alors que la lambda attend une chaîne : un `int` ne se convertit pas
      en `std::string`. Les chevrons doivent décrire ce que l'appelable accepte.
  - key: bug-capture-non-copiable
    format: bug-fix
    question: |-
      Le compilateur refuse de ranger cette lambda dans une `std::function` : elle n'est pas copiable. Quelle
      correction est la bonne ?
      ```cpp
      #include <functional>
      #include <memory>
      #include <print>
      #include <utility>

      int main() {
          auto p = std::make_unique<int>(5);
          std::function<int()> lire = [p = std::move(p)] { return *p; };
          std::println("{}", lire());
      }
      ```
    choices:
      - {text: "Déclarer `std::move_only_function<int()> lire`", correct: true}
      - {text: "Déclarer `std::function<int()>& lire`", correct: false}
      - {text: "Déclarer `const std::function<int()> lire`", correct: false}
      - {text: "Déclarer `std::function<int*()> lire`", correct: false}
    answer: |-
      ```cpp
      std::move_only_function<int()> lire = [p = std::move(p)] { return *p; };
      ```
      `std::function` copie son appelable, et cette lambda contient un `std::unique_ptr`. `std::move_only_function`
      (C++23) accepte les appelables seulement déplaçables. Ici, `auto lire = ...` suffirait aussi.
  - key: bug-reference-pendante
    format: bug-fix
    question: |-
      Cette fonction renvoie une `std::function` qui capture une variable locale par référence. Le programme
      devrait afficher `15` ; son comportement est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <functional>
      #include <print>

      std::function<int(int)> additionneur(int base) {
          return [&base](int x) { return base + x; };
      }

      int main() {
          const auto ajouter_dix = additionneur(10);
          std::println("{}", ajouter_dix(5));
      }
      ```
    choices:
      - {text: "Capturer `base` par valeur : `[base]`", correct: true}
      - {text: "Capturer tout par référence : `[&]`", correct: false}
      - {text: "Renvoyer `std::function<int(int)>&`", correct: false}
      - {text: "Déclarer le paramètre `const int base`", correct: false}
    answer: |-
      ```cpp
      return [base](int x) { return base + x; };
      ```
      `base` est détruite au retour de la fonction, et la `std::function` garde une référence vers elle. Un
      appelable qui sort de la fonction capture par valeur.
  - key: situation-boucle-chaude
    format: scenario
    question: |-
      Une fonction `appliquer(const std::vector<double>& v, std::function<double(double)> f)` est appelée sur des
      millions d'éléments, avec une petite lambda. Le profileur montre que l'appel de `f` domine. Que proposes-tu ?
    choices:
      - {text: "Un paramètre template pour `f` : le compilateur peut alors mettre la lambda en ligne", correct: true}
      - {text: "Un paramètre `std::function<double(double)>&`, passé par référence", correct: false}
      - {text: "Un paramètre `std::any`, plus léger qu'une `std::function`", correct: false}
      - {text: "Un `std::vector<std::function<double(double)>>` d'une seule fonction", correct: false}
    answer: |-
      À travers une `std::function`, chaque appel passe par une indirection opaque. Avec
      `template <typename F> ... F f`, le type exact de la lambda est connu : son corps est intégré à la boucle,
      qui peut même être vectorisée.
  - key: situation-rappels
    format: scenario
    question: |-
      Une classe `Minuteur` doit garder plusieurs actions à exécuter plus tard, fournies par ses utilisateurs sous
      forme de lambdas diverses. Quel type de membre choisis-tu ?
    choices:
      - {text: "`std::vector<std::function<void()>>`", correct: true}
      - {text: "`std::vector<auto>`, pour garder le type de chaque lambda", correct: false}
      - {text: "`std::vector<void (*)()>`, qui accepte toutes les lambdas", correct: false}
      - {text: "`std::vector<void*>`, converti au moment de l'appel", correct: false}
    answer: |-
      C'est le cas d'usage de `std::function` : stocker des appelables de types différents sous un type commun. Un
      pointeur de fonction n'accepte que les lambdas sans capture, ce qui serait trop restrictif.
  - key: situation-interface
    format: scenario
    question: |-
      Tu conçois une bibliothèque compilée à part. Une de ses fonctions reçoit un rappel, et son code doit rester
      dans le `.cpp`, hors de l'en-tête. Un template ne convient donc pas. Que choisis-tu ?
    choices:
      - {text: "Un paramètre `std::function`, dont le type est connu sans voir l'appelable", correct: true}
      - {text: "Un paramètre `auto`, que l'éditeur de liens résoudra", correct: false}
      - {text: "Un paramètre template, défini dans le `.cpp` seulement", correct: false}
      - {text: "Un paramètre `decltype(auto)`, déduit à l'exécution", correct: false}
    answer: |-
      Un template, ou un paramètre `auto`, doit être défini dans l'en-tête. `std::function` est un type concret : la
      fonction se compile une fois, et accepte n'importe quel appelable de la bonne signature. C'est le prix d'une
      frontière stable.
  - key: situation-variable-locale
    format: scenario
    question: |-
      En revue de code, tu lis `std::function<bool(int)> est_pair = [](int x) { return x % 2 == 0; };`, utilisée
      seulement deux lignes plus bas dans un `std::count_if`. Que proposes-tu ?
    choices:
      - {text: "`auto est_pair = ...` : même comportement, sans indirection ni allocation possible", correct: true}
      - {text: "`std::function<bool(int)>& est_pair = ...`, pour éviter une copie", correct: false}
      - {text: "`static std::function<bool(int)> est_pair = ...`, pour ne la créer qu'une fois", correct: false}
      - {text: "De ne rien changer : `std::function` est le type naturel d'une lambda", correct: false}
    answer: |-
      Le type d'une lambda n'est pas `std::function` : c'est un type propre, que `auto` garde tel quel.
      `std::function` ajoute une enveloppe utile seulement quand il faut un type commun ou un stockage.
