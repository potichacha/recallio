notion: iterateurs-const-inverses
lesson: |-
  En plus de `begin()` et `end()`, chaque conteneur offre des itérateurs **constants**, qui interdisent de
  modifier, et des itérateurs **inversés**, qui parcourent à l'envers.

  | Fonctions | Itérateur | Sens | Peut modifier l'élément |
  |---|---|---|---|
  | `begin()`, `end()` | `iterator` | avant | oui (sauf sur un conteneur `const`) |
  | `cbegin()`, `cend()` | `const_iterator` | avant | **non** |
  | `rbegin()`, `rend()` | `reverse_iterator` | **arrière** | oui |
  | `crbegin()`, `crend()` | `const_reverse_iterator` | arrière | non |

  **Les itérateurs constants.** `*it` donne une référence **constante** : on lit, on n'écrit pas.

  ```cpp
  std::vector<int> v{1, 2, 3};
  auto it = v.cbegin();
  int x = *it;       // lecture : permis
  *it = 9;           // erreur : assignment of read-only location
  ```

  Sur un conteneur déclaré `const`, `begin()` renvoie déjà un `const_iterator`. `cbegin()` sert à demander un
  itérateur constant sur un conteneur qui **ne l'est pas** : on dit ainsi qu'on ne fera que lire.

  Attention à ne pas confondre : un `const_iterator` peut **avancer** (`++it`), mais ne modifie pas l'élément. Un
  `const iterator` (un itérateur déclaré `const`) ne peut pas avancer, mais modifie l'élément.

  **Les itérateurs inversés.** `rbegin()` désigne le **dernier** élément ; `rend()`, la position **avant le
  premier**. Avec eux, **`++` recule** dans le conteneur.

  ```cpp
  for (auto it = v.rbegin(); it != v.rend(); ++it) {
      std::print("{} ", *it);     // 3 2 1
  }
  ```

  ```
          1    2    3
   ^                ^
  rend()         rbegin()
  ```

  C'est la façon sûre de parcourir à l'envers : pas d'indice non signé qui reboucle sous zéro.

  **Avec les algorithmes.** Un algorithme reçoit des itérateurs, quels qu'ils soient :

  ```cpp
  std::sort(v.rbegin(), v.rend());                        // tri décroissant
  auto it = std::find(v.rbegin(), v.rend(), 2);           // la DERNIÈRE occurrence de 2
  ```

  **`base()`.** Un itérateur inversé enveloppe un itérateur ordinaire, que `base()` rend. Il désigne l'élément
  **suivant** celui que voit l'itérateur inversé : `&*rit == &*(rit.base() - 1)`. Ce décalage sert à effacer :

  ```cpp
  v.erase(std::next(rit).base());     // efface l'élément désigné par rit
  ```

  **Depuis C++20**, `std::views::reverse` donne la même chose dans une boucle sur un intervalle :
  `for (int x : v | std::views::reverse)`.

  **En entretien** : « `cbegin` et `cend` donnent des itérateurs qui n'autorisent que la lecture. `rbegin` et
  `rend` parcourent à l'envers : `rbegin` est le dernier élément, et `++` recule. `base()` rend l'itérateur
  ordinaire, décalé d'une position. »
cards:
  - key: cbegin
    format: course
    question: "Que renvoie `v.cbegin()` sur un `std::vector<int>` non constant ?"
    choices:
      - {text: "Un itérateur sur le premier élément, qui permet de le lire mais pas de le modifier", correct: true}
      - {text: "Un itérateur sur le dernier élément, qui parcourt le vecteur à l'envers", correct: false}
      - {text: "Une copie constante du premier élément du vecteur", correct: false}
      - {text: "Un itérateur qui ne peut pas avancer vers l'élément suivant", correct: false}
    answer: "C'est un `const_iterator` : `*it` est une référence constante. Il avance normalement avec `++`."
  - key: rbegin
    format: course
    question: "Que désigne `v.rbegin()` ?"
    choices:
      - {text: "Le dernier élément du conteneur", correct: true}
      - {text: "Le premier élément du conteneur", correct: false}
      - {text: "La position qui suit le dernier élément", correct: false}
      - {text: "La position qui précède le premier élément", correct: false}
    answer: "Le parcours inversé commence par la fin. La position avant le premier élément est `rend()`."
  - key: plus-plus
    format: course
    question: "Que fait `++it` sur un itérateur inversé ?"
    choices:
      - {text: "Il passe à l'élément précédent du conteneur", correct: true}
      - {text: "Il passe à l'élément suivant du conteneur", correct: false}
      - {text: "Il revient au dernier élément du conteneur", correct: false}
      - {text: "Il ne compile pas : il faut écrire `--it`", correct: false}
    answer: "« Avancer » dans un parcours inversé, c'est reculer dans le conteneur. La boucle s'écrit donc comme d'habitude, avec `++`."
  - key: base
    format: course
    question: "Que rend `rit.base()` pour un itérateur inversé `rit` ?"
    choices:
      - {text: "Un itérateur ordinaire sur l'élément qui suit celui que désigne `rit`", correct: true}
      - {text: "Un itérateur ordinaire sur l'élément que désigne `rit`", correct: false}
      - {text: "Un itérateur ordinaire sur le premier élément du conteneur", correct: false}
      - {text: "L'adresse du conteneur que parcourt `rit`", correct: false}
    answer: "Il y a un décalage d'une position : `*rit` vaut `*(rit.base() - 1)`. C'est ce qui fait que `rbegin().base()` est `end()`."
  - key: vf-const-iterator-avance
    format: true-false
    question: "Un `const_iterator` peut avancer avec `++`."
    truth: true
    answer: "Ce qui est constant, c'est l'élément désigné, pas l'itérateur."
  - key: vf-rend-premier
    format: true-false
    question: "`v.rend()` désigne le premier élément du vecteur."
    truth: false
    answer: "Il désigne la position avant le premier élément : la fin du parcours inversé. On ne le déréférence pas."
  - key: vf-conteneur-const
    format: true-false
    question: "Sur un vecteur déclaré `const`, `begin()` renvoie un itérateur constant."
    truth: true
    answer: "La version `const` de `begin()` renvoie un `const_iterator`. `cbegin()` sert pour un conteneur qui n'est pas constant."
  - key: vf-sort-inverse
    format: true-false
    question: "`std::sort(v.rbegin(), v.rend());` trie le vecteur par ordre décroissant."
    truth: true
    answer: "L'algorithme trie par ordre croissant le long du parcours inversé : vu à l'endroit, le vecteur est décroissant."
  - key: qcm-boucle-inverse
    format: multiple-choice
    question: "Quelle boucle parcourt le vecteur `v` du dernier élément au premier ?"
    choices:
      - {text: "`for (auto it = v.rbegin(); it != v.rend(); ++it)`", correct: true}
      - {text: "`for (auto it = v.rbegin(); it != v.rend(); --it)`", correct: false}
      - {text: "`for (auto it = v.rend(); it != v.rbegin(); ++it)`", correct: false}
      - {text: "`for (auto it = v.end(); it != v.begin(); ++it)`", correct: false}
    answer: "De `rbegin()` à `rend()`, avec `++`. Les autres versions sortent du conteneur dès le premier pas."
  - key: qcm-derniere-occurrence
    format: multiple-choice
    question: "Quel appel trouve la dernière occurrence de `7` dans le vecteur `v` ?"
    choices:
      - {text: "`std::find(v.rbegin(), v.rend(), 7)`", correct: true}
      - {text: "`std::find(v.begin(), v.end(), 7)`", correct: false}
      - {text: "`std::find(v.end(), v.begin(), 7)`", correct: false}
      - {text: "`std::find(v.cbegin(), v.cend(), 7)`", correct: false}
    answer: "`std::find` s'arrête au premier élément égal. Le long du parcours inversé, le premier rencontré est le dernier du vecteur."
  - key: qcm-type
    format: multiple-choice
    question: "Quel type d'itérateur renvoie `v.crbegin()` ?"
    choices:
      - {text: "`const_reverse_iterator`", correct: true}
      - {text: "`const_iterator`", correct: false}
      - {text: "`reverse_iterator`", correct: false}
      - {text: "`iterator`", correct: false}
    answer: "`c` pour constant, `r` pour inversé : il parcourt à l'envers, en lecture seule."
  - key: qcm-vue
    format: multiple-choice
    question: "Quelle boucle de C++20 parcourt `v` à l'envers sans écrire d'itérateur ?"
    choices:
      - {text: "`for (int x : v | std::views::reverse)`", correct: true}
      - {text: "`for (int x : v.reverse())`", correct: false}
      - {text: "`for (int x : -v)`", correct: false}
      - {text: "`for (int x : std::reverse(v))`", correct: false}
    answer: "`std::views::reverse` présente le conteneur à l'envers, sans le copier ni le modifier. Un vecteur n'a pas de fonction membre `reverse`."
  - key: trous-rbegin
    format: fill-in
    question: |-
      Complète pour partir du dernier élément :
      ```cpp
      for (auto it = v.___(); it != v.rend(); ++it) {
          std::println("{}", *it);
      }
      ```
    blanks:
      - [rbegin, crbegin]
    answer: "`rbegin()` désigne le dernier élément."
  - key: trous-cbegin
    format: fill-in
    question: |-
      Complète pour obtenir un itérateur qui ne permet que la lecture, sur un vecteur non constant :
      ```cpp
      auto it = v.___();
      std::println("{}", *it);
      ```
    blanks:
      - [cbegin]
    answer: "`cbegin()` renvoie un `const_iterator`."
  - key: trous-rend
    format: fill-in
    question: |-
      Complète la borne de fin du parcours inversé :
      ```cpp
      auto it = std::find(v.rbegin(), v.___(), 7);
      ```
    blanks:
      - [rend]
    answer: "`rend()` est la fin du parcours inversé : la position avant le premier élément."
  - key: trous-base
    format: fill-in
    question: |-
      Complète pour convertir l'itérateur inversé en itérateur ordinaire :
      ```cpp
      auto rit = std::find(v.rbegin(), v.rend(), 7);
      auto it = rit.___();
      ```
    blanks:
      - [base]
    answer: "`base()` rend l'itérateur ordinaire, qui désigne l'élément suivant celui de `rit`."
  - key: code-inverse
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          for (auto it = v.rbegin(); it != v.rend(); ++it) {
              std::print("{} ", *it);
          }
          std::println("{}", *v.rbegin());
      }
      ```
    choices:
      - {text: "`3 2 1 3`", correct: true}
      - {text: "`1 2 3 3`", correct: false}
      - {text: "`3 2 1 1`", correct: false}
      - {text: "`1 2 3 1`", correct: false}
    answer: "`3 2 1 3` : le parcours inversé va du dernier au premier. `*v.rbegin()` est le dernier élément, 3."
    check:
      output: "3 2 1 3"
  - key: code-derniere-occurrence
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{5, 7, 5, 9};
          const auto rit = std::find(v.rbegin(), v.rend(), 5);
          std::println("{} {}", rit.base() - v.begin(), *rit.base());
      }
      ```
    choices:
      - {text: "`3 9`", correct: true}
      - {text: "`2 5`", correct: false}
      - {text: "`0 5`", correct: false}
      - {text: "`1 7`", correct: false}
    answer: "`3 9` : `rit` désigne le dernier 5, à l'indice 2. `base()` est décalé d'une position : il désigne l'indice 3, donc 9."
    check:
      output: "3 9"
  - key: code-sort-inverse
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 9, 1, 6};
          std::sort(v.rbegin(), v.rend());
          std::println("{} {}", v.front(), v.back());
      }
      ```
    choices:
      - {text: "`9 1`", correct: true}
      - {text: "`1 9`", correct: false}
      - {text: "`4 6`", correct: false}
      - {text: "`6 4`", correct: false}
    answer: "`9 1` : trié le long du parcours inversé, le vecteur est décroissant vu à l'endroit : 9 6 4 1."
    check:
      output: "9 1"
  - key: code-const-iterator
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto it = v.cbegin();
          ++it;
          *it = 9;
          std::println("{}", v[1]);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`9`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
    answer: "Ça ne compile pas : `cbegin()` donne un `const_iterator`, qui peut avancer mais pas modifier l'élément (« assignment of read-only location »)."
    check:
      compiles: false
  - key: bug-moins-moins
    format: bug-fix
    question: |-
      Ce programme devrait afficher les éléments à l'envers. Il sort du vecteur dès le deuxième tour. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          for (auto it = v.rbegin(); it != v.rend(); --it) {
              std::println("{}", *it);
          }
      }
      ```
    choices:
      - {text: "Écrire `++it` : avec un itérateur inversé, avancer recule dans le vecteur", correct: true}
      - {text: "Écrire `it -= 2` : il faut reculer de deux positions à chaque tour", correct: false}
      - {text: "Écrire `it != v.end()` dans la condition de la boucle", correct: false}
      - {text: "Écrire `auto it = v.rend()` au départ de la boucle", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.rbegin(); it != v.rend(); ++it) {
      ```
      Un itérateur inversé inverse aussi `++` et `--`. `--it` depuis `rbegin()` part au-delà de la fin du vecteur :
      comportement indéfini.
  - key: bug-modifier-const
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only location ». Le programme doit doubler chaque élément. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto it = v.cbegin(); it != v.cend(); ++it) {
              *it = *it * 2;
          }
          std::println("{}", v[2]);
      }
      ```
    choices:
      - {text: "Parcourir de `v.begin()` à `v.end()`", correct: true}
      - {text: "Parcourir de `v.crbegin()` à `v.crend()`", correct: false}
      - {text: "Déclarer `it` avec `const auto`", correct: false}
      - {text: "Déclarer le vecteur `v` avec `const`", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.begin(); it != v.end(); ++it) {
      ```
      `cbegin()` promet de ne pas modifier. Pour écrire dans les éléments, il faut un itérateur ordinaire.
  - key: bug-melange
    format: bug-fix
    question: |-
      Le compilateur refuse la condition : il ne sait pas comparer un itérateur inversé à un itérateur ordinaire.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          for (auto it = v.rbegin(); it != v.begin(); ++it) {
              std::println("{}", *it);
          }
      }
      ```
    choices:
      - {text: "Comparer à `v.rend()`", correct: true}
      - {text: "Comparer à `v.end()`", correct: false}
      - {text: "Comparer à `v.cbegin()`", correct: false}
      - {text: "Comparer à `v.front()`", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.rbegin(); it != v.rend(); ++it) {
      ```
      Les deux bornes d'un parcours sont de la même famille : `rbegin()` va avec `rend()`.
  - key: bug-dereferencer-rend
    format: bug-fix
    question: |-
      Ce programme devrait afficher le premier élément, `1`. Il lit avant le début du vecteur : son comportement
      est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          std::println("{}", *v.rend());
      }
      ```
    choices:
      - {text: "Écrire `*(v.rend() - 1)`, ou simplement `v.front()`", correct: true}
      - {text: "Écrire `*(v.rend() + 1)`, une position plus loin", correct: false}
      - {text: "Écrire `*v.crend()`, la version constante", correct: false}
      - {text: "Écrire `*v.end()`, ou simplement `v.back()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", v.front());
      ```
      `rend()` est la fin du parcours inversé : la position avant le premier élément, qui ne contient rien. Le
      premier élément est une position plus tôt dans ce parcours : `rend() - 1`.
