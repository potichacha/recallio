notion: foncteurs
lesson: |-
  Un **foncteur**, ou **objet fonction**, est un objet d'une classe qui définit **`operator()`**. On l'appelle
  comme une fonction, mais c'est un objet : il peut **garder un état** dans ses membres.

  ```cpp
  class PlusGrandQue {
  public:
      explicit PlusGrandQue(int seuil) : seuil_{seuil} {}
      bool operator()(int x) const { return x > seuil_; }
  private:
      int seuil_;
  };

  PlusGrandQue test{10};
  test(15);                                              // true
  std::count_if(v.begin(), v.end(), PlusGrandQue{10});   // passé à un algorithme
  ```

  **Une lambda est un foncteur.** Le compilateur traduit chaque lambda en une classe sans nom, munie d'un
  `operator()` ; ses **captures** deviennent les membres. `[seuil](int x) { return x > seuil; }` est exactement
  la classe ci-dessus, écrite en une ligne.

  **Quand écrire un foncteur à la main.**

  - Il est **réutilisé** à plusieurs endroits, ou mérite un nom.
  - Il a plusieurs fonctions, ou un état qu'on veut **relire** ensuite (`.total()`).
  - Il faut **nommer son type** : en paramètre de template d'un conteneur, par exemple
    `std::set<Personne, ParAge>` ou `std::unordered_map<Cle, V, MonHachage>`.

  Pour un usage unique et local, une lambda est plus lisible.

  **`operator()` const.** Si l'appel ne modifie pas l'état, on le déclare `const` : la bibliothèque appelle
  souvent le foncteur à travers une référence constante. Celui d'une lambda est `const` par défaut, sauf
  `mutable`.

  **Les foncteurs de la bibliothèque** (en-tête `<functional>`).

  | Foncteur | Fait |
  |---|---|
  | `std::plus<>`, `std::minus<>`, `std::multiplies<>` | `a + b`, `a - b`, `a * b` |
  | `std::less<>`, `std::greater<>`, `std::equal_to<>` | `a < b`, `a > b`, `a == b` |
  | `std::logical_and<>`, `std::logical_not<>` | `a && b`, `!a` |
  | `std::hash<T>` | le hachage de `T` |

  ```cpp
  std::sort(v.begin(), v.end(), std::greater<>{});          // ordre décroissant
  std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{});   // produit
  ```

  **Attention aux copies.** Les algorithmes reçoivent leur foncteur **par valeur**, et peuvent le copier. L'état
  accumulé dans la copie n'est pas celui de l'original. `std::for_each` fait exception : il **renvoie** le
  foncteur après usage. Sinon, on fait porter l'état par une variable extérieure, capturée par référence.

  **Pourquoi c'est rapide.** Le type du foncteur est connu à la compilation : l'appel est résolu statiquement, et
  le plus souvent **intégré** (*inlined*). Un pointeur de fonction ou une `std::function` passent par une
  indirection.

  **En entretien** : « Un foncteur est un objet avec un `operator()` : appelable comme une fonction, avec un état
  en plus. Une lambda en est un, généré par le compilateur. J'en écris un à la main quand il me faut un type
  nommé, pour le comparateur d'un `std::set` par exemple. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un foncteur ?"
    choices:
      - {text: "Un objet dont la classe définit `operator()`, et qui s'appelle comme une fonction", correct: true}
      - {text: "Une fonction qui reçoit une autre fonction en paramètre, et l'appelle", correct: false}
      - {text: "Un pointeur vers une fonction membre, lié à un objet de la classe", correct: false}
      - {text: "Une fonction déclarée `static` à l'intérieur d'une classe", correct: false}
    answer: "On écrit `objet(arguments)`. Comme c'est un objet, il peut porter des données entre deux appels."
  - key: avantage
    format: course
    question: "Qu'apporte un foncteur par rapport à une fonction ordinaire ?"
    choices:
      - {text: "Un état, gardé dans ses membres d'un appel à l'autre", correct: true}
      - {text: "Une exécution dans un thread à part", correct: false}
      - {text: "Une vérification des arguments à l'exécution", correct: false}
      - {text: "Une surcharge impossible avec une fonction", correct: false}
    answer: "Un seuil, un compteur, une configuration : le foncteur les reçoit à sa construction, et s'en sert à chaque appel."
  - key: lambda
    format: course
    question: "Quel rapport y a-t-il entre une lambda et un foncteur ?"
    choices:
      - {text: "Une lambda est un foncteur : le compilateur lui génère une classe avec `operator()`", correct: true}
      - {text: "Une lambda est une fonction ordinaire : elle n'a pas de classe derrière elle", correct: false}
      - {text: "Une lambda est un pointeur de fonction : elle ne peut pas avoir d'état", correct: false}
      - {text: "Une lambda est une macro : elle est remplacée par le préprocesseur", correct: false}
    answer: "Les variables capturées deviennent les membres de cette classe sans nom. La lambda est l'écriture courte du foncteur."
  - key: quand
    format: course
    question: "Dans quel cas écris-tu un foncteur à la main plutôt qu'une lambda ?"
    choices:
      - {text: "Quand son type doit être nommé, comme comparateur d'un `std::set`", correct: true}
      - {text: "Quand il n'est utilisé qu'une fois, dans un seul appel", correct: false}
      - {text: "Quand il ne capture aucune variable du contexte", correct: false}
      - {text: "Quand il doit être passé à un algorithme standard", correct: false}
    answer: "`std::set<Personne, ParAge>` demande un nom de type. Pour un usage local et unique, la lambda se lit mieux."
  - key: vf-const
    format: true-false
    question: "L'`operator()` d'une lambda est `const` par défaut."
    truth: true
    answer: "Elle ne peut pas modifier ses captures par valeur, sauf si elle est déclarée `mutable`."
  - key: vf-copie
    format: true-false
    question: "Un algorithme standard reçoit son foncteur par référence, et ne le copie jamais."
    truth: false
    answer: "Il le reçoit par valeur, et peut le copier. L'état accumulé dans la copie n'est pas répercuté dans l'original."
  - key: vf-greater
    format: true-false
    question: "`std::greater<>` est un foncteur de la bibliothèque standard."
    truth: true
    answer: "Son `operator()` renvoie `a > b`. Il est déclaré dans `<functional>`."
  - key: vf-pointeur
    format: true-false
    question: "Un foncteur est toujours plus lent à appeler qu'un pointeur de fonction."
    truth: false
    answer: "C'est l'inverse le plus souvent : son type est connu à la compilation, donc l'appel peut être intégré."
  - key: qcm-operateur
    format: multiple-choice
    question: "Quel opérateur une classe définit-elle pour que ses objets s'appellent comme des fonctions ?"
    choices:
      - {text: "`operator()`", correct: true}
      - {text: "`operator[]`", correct: false}
      - {text: "`operator->`", correct: false}
      - {text: "`operator call`", correct: false}
    answer: "L'opérateur d'appel. Il peut prendre n'importe quels paramètres, et être surchargé."
  - key: qcm-produit
    format: multiple-choice
    question: "Quel foncteur standard passes-tu à `std::accumulate` pour calculer un produit ?"
    choices:
      - {text: "`std::multiplies<>{}`", correct: true}
      - {text: "`std::plus<>{}`", correct: false}
      - {text: "`std::product<>{}`", correct: false}
      - {text: "`std::greater<>{}`", correct: false}
    answer: "`std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{})`. La valeur initiale d'un produit est 1."
  - key: qcm-for-each
    format: multiple-choice
    question: "Comment récupères-tu l'état d'un foncteur après `std::for_each` ?"
    choices:
      - {text: "Par la valeur de retour de `std::for_each`, qui rend le foncteur", correct: true}
      - {text: "Par l'objet d'origine, que l'algorithme a modifié", correct: false}
      - {text: "Par une variable globale, que la bibliothèque remplit", correct: false}
      - {text: "Par `std::get_state`, appelé sur l'algorithme", correct: false}
    answer: "L'algorithme travaille sur une copie, et la renvoie. L'objet passé en argument n'a pas changé."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::plus`, `std::less` et `std::greater` ?"
    choices:
      - {text: "`<functional>`", correct: true}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<numeric>`", correct: false}
      - {text: "`<operators>`", correct: false}
    answer: "`<functional>` regroupe les foncteurs standard, `std::function` et `std::hash`."
  - key: trous-operateur
    format: fill-in
    question: |-
      Complète pour rendre l'objet appelable :
      ```cpp
      struct Carre {
          int ___()(int x) const { return x * x; }
      };
      ```
    blanks:
      - [operator]
    answer: "`operator()` est l'opérateur d'appel : la première paire de parenthèses fait partie de son nom."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que l'appel soit permis sur un foncteur constant :
      ```cpp
      struct EstPair {
          bool operator()(int x) ___ { return x % 2 == 0; }
      };
      ```
    blanks:
      - [const]
    answer: "L'appel ne modifie pas l'objet : on le déclare `const`."
  - key: trous-greater
    format: fill-in
    question: |-
      Complète pour trier du plus grand au plus petit :
      ```cpp
      std::sort(v.begin(), v.end(), std::___<>{});
      ```
    blanks:
      - [greater]
    answer: "`std::greater<>` compare avec `>`."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète pour appeler le foncteur avec la valeur 7 :
      ```cpp
      Carre carre;
      int resultat = carre___;
      ```
    blanks:
      - ["(7)"]
    answer: "Un foncteur s'appelle comme une fonction : `carre(7)`."
  - key: code-etat
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Multiplicateur {
      public:
          explicit Multiplicateur(int facteur) : facteur_{facteur} {}
          int operator()(int x) const { return x * facteur_; }

      private:
          int facteur_;
      };

      int main() {
          const Multiplicateur triple{3};
          const Multiplicateur dizaine{10};
          std::println("{} {}", triple(4), dizaine(triple(2)));
      }
      ```
    choices:
      - {text: "`12 60`", correct: true}
      - {text: "`12 20`", correct: false}
      - {text: "`7 60`", correct: false}
      - {text: "`12 30`", correct: false}
    answer: "`12 60` : chaque objet garde son facteur. `triple(2)` vaut 6, et `dizaine(6)` vaut 60."
    check:
      output: "12 60"
  - key: code-algorithme
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      struct Entre {
          int bas;
          int haut;
          bool operator()(int x) const { return x >= bas && x <= haut; }
      };

      int main() {
          const std::vector<int> v{1, 5, 8, 12, 3};
          std::println("{}", std::count_if(v.begin(), v.end(), Entre{3, 8}));
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`3` : le foncteur garde les bornes 3 et 8, comprises. Les éléments 5, 8 et 3 les respectent."
    check:
      output: "3"
  - key: code-for-each
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      struct Somme {
          int total = 0;
          void operator()(int x) { total += x; }
      };

      int main() {
          const std::vector<int> v{1, 2, 3};
          Somme somme;
          const Somme resultat = std::for_each(v.begin(), v.end(), somme);
          std::println("{} {}", somme.total, resultat.total);
      }
      ```
    choices:
      - {text: "`0 6`", correct: true}
      - {text: "`6 6`", correct: false}
      - {text: "`6 0`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: "`0 6` : `std::for_each` reçoit une copie du foncteur, et la renvoie. L'objet `somme` d'origine n'a pas bougé."
    check:
      output: "0 6"
  - key: code-standard
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <numeric>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{2, 3, 4};
          const int produit = std::accumulate(v.begin(), v.end(), 1, std::multiplies<>{});
          std::println("{} {} {}", produit, std::greater<>{}(5, 3), std::minus<>{}(5, 3));
      }
      ```
    choices:
      - {text: "`24 true 2`", correct: true}
      - {text: "`9 true 2`", correct: false}
      - {text: "`24 false 2`", correct: false}
      - {text: "`24 true 8`", correct: false}
    answer: "`24 true 2` : `std::multiplies` multiplie, à partir de 1. `std::greater<>{}(5, 3)` construit le foncteur, puis l'appelle : 5 > 3."
    check:
      output: "24 true 2"
  - key: bug-etat-perdu
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, le nombre d'éléments visités. Il affiche `0`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      struct Compteur {
          int appels = 0;
          void operator()(int) { ++appels; }
      };

      int main() {
          const std::vector<int> v{4, 5, 6};
          Compteur compteur;
          std::for_each(v.begin(), v.end(), compteur);
          std::println("{}", compteur.appels);
      }
      ```
    choices:
      - {text: "Récupérer le foncteur renvoyé : `compteur = std::for_each(v.begin(), v.end(), compteur);`", correct: true}
      - {text: "Déclarer l'opérateur d'appel constant : `void operator()(int) const { ++appels; }`", correct: false}
      - {text: "Déclarer le compteur constant : `const Compteur compteur;`, avant l'appel", correct: false}
      - {text: "Appeler l'algorithme deux fois de suite, avec le même foncteur", correct: false}
    answer: |-
      ```cpp
      compteur = std::for_each(v.begin(), v.end(), compteur);
      ```
      L'algorithme reçoit une copie : c'est elle qui compte. `std::for_each` la renvoie. On peut aussi passer
      `std::ref(compteur)`.
  - key: bug-const-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « no match for call to '(const EstPair) (int)' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct EstPair {
          bool operator()(int x) { return x % 2 == 0; }
      };

      int main() {
          const EstPair test;
          std::println("{}", test(4));
      }
      ```
    choices:
      - {text: "Déclarer `bool operator()(int x) const`", correct: true}
      - {text: "Déclarer `static bool operator()(int x)`, sans rien changer d'autre", correct: false}
      - {text: "Écrire `test.operator(4)` à la place de `test(4)`", correct: false}
      - {text: "Déclarer `bool operator[](int x)` à la place de `operator()`", correct: false}
    answer: |-
      ```cpp
      bool operator()(int x) const { return x % 2 == 0; }
      ```
      L'objet est constant : seules ses fonctions membres `const` sont appelables. L'opérateur ne modifie rien, il
      doit le dire.
  - key: bug-type-comparateur
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration de l'ensemble : il attend un type en second argument, pas un objet.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      struct Decroissant {
          bool operator()(int a, int b) const { return a > b; }
      };

      int main() {
          std::set<int, Decroissant{}> s{1, 3, 2};
          std::println("{}", *s.begin());
      }
      ```
    choices:
      - {text: "Écrire `std::set<int, Decroissant> s{1, 3, 2};`", correct: true}
      - {text: "Écrire `std::set<int, Decroissant()> s{1, 3, 2};`", correct: false}
      - {text: "Écrire `std::set<int> s{1, 3, 2, Decroissant{}};`", correct: false}
      - {text: "Écrire `std::set<Decroissant, int> s{1, 3, 2};`", correct: false}
    answer: |-
      ```cpp
      std::set<int, Decroissant> s{1, 3, 2};
      ```
      Le second paramètre du template est le **type** du comparateur ; l'ensemble en construit lui-même un objet.
      C'est l'un des cas où un foncteur nommé est plus commode qu'une lambda.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel de `std::sort` : il reçoit un type là où il attend un objet. Quelle correction
      est la bonne ?
      ```cpp
      #include <algorithm>
      #include <functional>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 3, 2};
          std::sort(v.begin(), v.end(), std::greater<>);
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Passer `std::greater<>{}`", correct: true}
      - {text: "Passer `std::greater`", correct: false}
      - {text: "Passer `&std::greater<>`", correct: false}
      - {text: "Passer `std::greater<>::operator()`", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end(), std::greater<>{});
      ```
      `std::greater<>` est une classe. Un algorithme attend un **objet** : les accolades en construisent un.
