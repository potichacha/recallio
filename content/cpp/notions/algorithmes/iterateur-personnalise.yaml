notion: iterateur-personnalise
lesson: |-
  Pour qu'une classe se parcoure avec `for (auto x : objet)` et avec les algorithmes, il lui faut `begin()` et
  `end()`, qui renvoient un **itérateur**. Un itérateur est une petite classe qui fournit quelques opérateurs.

  **Le minimum pour la boucle sur un intervalle.** Trois opérations suffisent : `*it`, `++it`, et `it != fin`.

  ```cpp
  class Compteur {
  public:
      class Iterateur {
      public:
          explicit Iterateur(int valeur) : valeur_{valeur} {}
          int operator*() const { return valeur_; }
          Iterateur& operator++() { ++valeur_; return *this; }
          bool operator==(const Iterateur&) const = default;
      private:
          int valeur_;
      };

      Compteur(int debut, int fin) : debut_{debut}, fin_{fin} {}
      Iterateur begin() const { return Iterateur{debut_}; }
      Iterateur end() const { return Iterateur{fin_}; }
  private:
      int debut_;
      int fin_;
  };

  for (int x : Compteur{1, 4}) { ... }   // 1 2 3
  ```

  Depuis C++20, définir `operator==` suffit : le compilateur en tire `!=`.

  **Pour les algorithmes : les types membres.** `std::find`, `std::distance` ou `std::ranges::sort` interrogent
  l'itérateur sur ce qu'il est. On déclare cinq alias :

  ```cpp
  using iterator_category = std::forward_iterator_tag;   // ou iterator_concept en C++20
  using value_type = int;
  using difference_type = std::ptrdiff_t;
  using pointer = const int*;
  using reference = int;
  ```

  **Ce que chaque catégorie exige.**

  | Catégorie | Opérations à fournir |
  |---|---|
  | Entrée | `*it`, `++it`, `it++`, `==` |
  | Avant | les mêmes, un constructeur par défaut, et plusieurs passes possibles |
  | Bidirectionnel | `--it`, `it--` |
  | Accès direct | `it + n`, `it - n`, `it1 - it2`, `it[n]`, `<`, `<=>` |

  **Les deux incrémentations.** La forme préfixée renvoie une référence vers l'itérateur ; la forme postfixée,
  reconnue à son paramètre `int` fictif, renvoie une **copie de l'état d'avant**.

  ```cpp
  Iterateur& operator++() { ++valeur_; return *this; }
  Iterateur operator++(int) { Iterateur avant = *this; ++valeur_; return avant; }
  ```

  **`const_iterator`.** Un conteneur fournit en général deux itérateurs : `iterator`, qui permet de modifier, et
  `const_iterator`, dont `operator*` renvoie une référence constante. `begin() const` renvoie le second.

  **Vérifier son travail.** Un `static_assert` sur le concept dit tout de suite ce qui manque :

  ```cpp
  static_assert(std::forward_iterator<Compteur::Iterateur>);
  ```

  **Avant d'écrire un itérateur.** Souvent, on peut s'en passer :

  - si la classe enveloppe un conteneur, `begin()` et `end()` renvoient **ses** itérateurs ;
  - pour produire une suite, `std::views::iota`, ou en C++23 une coroutine `std::generator` ;
  - pour adapter une suite existante, une vue (`std::views::transform`, `filter`).

  **En entretien** : « Un itérateur fournit au moins `*`, `++` et `==` : c'est assez pour la boucle sur un
  intervalle. Pour les algorithmes, j'ajoute les types membres, dont la catégorie, et les opérations qu'elle
  promet. Je vérifie avec un `static_assert` sur le concept. Et si la classe enveloppe un conteneur, je renvoie
  simplement ses itérateurs. »
cards:
  - key: minimum
    format: course
    question: "Quelles opérations un itérateur doit-il fournir pour la boucle `for (auto x : objet)` ?"
    choices:
      - {text: "Le déréférencement `*it`, l'incrémentation `++it` et la comparaison `!=`", correct: true}
      - {text: "L'indexation `it[n]`, l'addition `it + n` et la comparaison `<`", correct: false}
      - {text: "La fonction `next()`, la fonction `has_next()` et la fonction `value()`", correct: false}
      - {text: "Le constructeur de copie, le destructeur et l'affectation de copie", correct: false}
    answer: "La boucle se réécrit en `for (auto it = begin(); it != end(); ++it) { auto x = *it; }`. Rien d'autre n'est appelé."
  - key: begin-end
    format: course
    question: "Que doit fournir une classe pour être parcourue par une boucle sur un intervalle ?"
    choices:
      - {text: "Des fonctions `begin()` et `end()`, qui renvoient des itérateurs", correct: true}
      - {text: "Un `operator[]` et une fonction `size()`", correct: false}
      - {text: "Une fonction `for_each()` qui reçoit une lambda", correct: false}
      - {text: "Une classe de base `std::iterable`, dont elle hérite", correct: false}
    answer: "Membres ou fonctions libres, peu importe : le compilateur cherche `begin` et `end`. Il n'y a pas de classe de base à hériter."
  - key: types-membres
    format: course
    question: "Pourquoi un itérateur déclare-t-il des types membres comme `value_type` et `iterator_category` ?"
    choices:
      - {text: "Les algorithmes les lisent pour connaître le type des éléments et les capacités de l'itérateur", correct: true}
      - {text: "Le compilateur en a besoin pour réserver la mémoire de l'itérateur sur la pile", correct: false}
      - {text: "La boucle sur un intervalle refuse de compiler sans ces cinq déclarations", correct: false}
      - {text: "Le débogueur s'en sert pour afficher le nom de l'itérateur", correct: false}
    answer: "`std::distance` choisit sa version d'après la catégorie ; `std::accumulate` a besoin du type des éléments. La simple boucle, elle, s'en passe."
  - key: postfixe
    format: course
    question: "Comment distingue-t-on `operator++` préfixé et postfixé dans une classe ?"
    choices:
      - {text: "Le postfixé prend un paramètre `int` fictif, et renvoie une copie de l'état d'avant", correct: true}
      - {text: "Le postfixé est déclaré `const`, et renvoie une référence vers l'itérateur", correct: false}
      - {text: "Le postfixé s'appelle `operator++post`, et ne renvoie rien", correct: false}
      - {text: "Le postfixé prend un paramètre `bool`, qui dit de combien avancer", correct: false}
    answer: "`operator++()` est `++it` ; `operator++(int)` est `it++`. Le paramètre ne sert qu'à les différencier."
  - key: vf-egalite
    format: true-false
    question: "Depuis C++20, définir `operator==` sur un itérateur suffit pour pouvoir écrire `it != fin`."
    truth: true
    answer: "Le compilateur réécrit `a != b` en `!(a == b)`. Avant C++20, il fallait définir les deux."
  - key: vf-heritage
    format: true-false
    question: "Un itérateur doit hériter de la classe `std::iterator`."
    truth: false
    answer: "Cette classe de base est dépréciée depuis C++17. On déclare les types membres directement dans sa classe."
  - key: vf-conteneur-enveloppe
    format: true-false
    question: "Une classe qui enveloppe un `std::vector` peut renvoyer les itérateurs du vecteur depuis `begin()` et `end()`."
    truth: true
    answer: "C'est le plus simple : aucun itérateur à écrire, et toutes les catégories du vecteur sont héritées."
  - key: vf-prefixe-retour
    format: true-false
    question: "`operator++()` préfixé renvoie par convention une copie de l'itérateur avant l'incrémentation."
    truth: false
    answer: "Il renvoie une référence vers l'itérateur incrémenté, `*this`. La copie d'avant est le retour de la forme postfixée."
  - key: qcm-categorie
    format: multiple-choice
    question: "Quel alias déclare la catégorie d'un itérateur qui sait seulement avancer, en plusieurs passes ?"
    choices:
      - {text: "`using iterator_category = std::forward_iterator_tag;`", correct: true}
      - {text: "`using iterator_category = std::random_access_iterator_tag;`", correct: false}
      - {text: "`using iterator_category = std::output_iterator_tag;`", correct: false}
      - {text: "`using iterator_category = std::forward_list;`", correct: false}
    answer: "Les catégories sont des types vides, les *tags*. Les algorithmes choisissent leur version d'après eux."
  - key: qcm-verifier
    format: multiple-choice
    question: "Comment vérifies-tu, à la compilation, que ta classe `It` est bien un itérateur avant ?"
    choices:
      - {text: "`static_assert(std::forward_iterator<It>);`", correct: true}
      - {text: "`assert(It::is_forward());`", correct: false}
      - {text: "`static_assert(sizeof(It) > 0);`", correct: false}
      - {text: "`if (typeid(It) == typeid(std::forward_iterator))`", correct: false}
    answer: "Le concept vérifie toutes les exigences. Si l'une manque, le compilateur la nomme."
  - key: qcm-const-iterator
    format: multiple-choice
    question: "Que renvoie `operator*` d'un `const_iterator` sur des `int` ?"
    choices:
      - {text: "`const int&`", correct: true}
      - {text: "`int&`", correct: false}
      - {text: "`int*`", correct: false}
      - {text: "`const_iterator&`", correct: false}
    answer: "Un `const_iterator` laisse lire, pas modifier. C'est lui que renvoie `begin()` sur un conteneur constant."
  - key: qcm-alternative
    format: multiple-choice
    question: "Tu veux parcourir les entiers de 1 à 9 dans une boucle sur un intervalle. Que choisis-tu, plutôt qu'écrire un itérateur ?"
    choices:
      - {text: "`std::views::iota(1, 10)`", correct: true}
      - {text: "`std::vector<int>(1, 10)`", correct: false}
      - {text: "`std::bitset<10>`", correct: false}
      - {text: "`std::pair{1, 10}`", correct: false}
    answer: "`std::views::iota` produit la suite sans rien stocker. `std::vector<int>(1, 10)` contient un seul élément, qui vaut 10."
  - key: trous-deref
    format: fill-in
    question: |-
      Complète l'opérateur qui donne l'élément désigné :
      ```cpp
      int operator___() const { return valeur_; }
      ```
    blanks:
      - ["*"]
    answer: "`operator*` est le déréférencement : `*it`."
  - key: trous-retour-prefixe
    format: fill-in
    question: |-
      Complète le retour de l'incrémentation préfixée :
      ```cpp
      Iterateur& operator++() {
          ++valeur_;
          return ___;
      }
      ```
    blanks:
      - ["*this"]
    answer: "La forme préfixée renvoie l'itérateur lui-même, par référence."
  - key: trous-postfixe
    format: fill-in
    question: |-
      Complète la signature de l'incrémentation postfixée :
      ```cpp
      Iterateur operator++(___) {
          Iterateur avant = *this;
          ++valeur_;
          return avant;
      }
      ```
    blanks:
      - [int]
    answer: "Le paramètre `int` fictif distingue `it++` de `++it`."
  - key: trous-end
    format: fill-in
    question: |-
      Complète le nom de la fonction qui donne la borne de fin :
      ```cpp
      Iterateur begin() const { return Iterateur{debut_}; }
      Iterateur ___() const { return Iterateur{fin_}; }
      ```
    blanks:
      - [end]
    answer: "La boucle sur un intervalle appelle `begin()` et `end()`."
  - key: code-compteur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          class Iterateur {
          public:
              explicit Iterateur(int valeur) : valeur_{valeur} {}
              int operator*() const { return valeur_; }
              Iterateur& operator++() {
                  ++valeur_;
                  return *this;
              }
              bool operator==(const Iterateur&) const = default;

          private:
              int valeur_;
          };

          Compteur(int debut, int fin) : debut_{debut}, fin_{fin} {}
          Iterateur begin() const { return Iterateur{debut_}; }
          Iterateur end() const { return Iterateur{fin_}; }

      private:
          int debut_;
          int fin_;
      };

      int main() {
          int somme = 0;
          for (int x : Compteur{1, 5}) {
              somme += x;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`10` : l'intervalle est semi-ouvert. La boucle voit 1, 2, 3 et 4 ; quand l'itérateur vaut 5, il est égal à `end()`."
    check:
      output: "10"
  - key: code-pas
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Pairs {
          struct It {
              int v;
              int operator*() const { return v; }
              It& operator++() {
                  v += 2;
                  return *this;
              }
              bool operator==(const It& autre) const { return v >= autre.v; }
          };
          It begin() const { return It{0}; }
          It end() const { return It{7}; }
      };

      int main() {
          for (int x : Pairs{}) {
              std::print("{} ", x);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`0 2 4 6 fin`", correct: true}
      - {text: "`0 2 4 fin`", correct: false}
      - {text: "`0 2 4 6 8 fin`", correct: false}
      - {text: "`2 4 6 fin`", correct: false}
    answer: "`0 2 4 6 fin` : l'itérateur avance de deux. La comparaison dit « fini » dès que la valeur atteint ou dépasse 7 : après 6, elle vaut 8."
    check:
      output: "0 2 4 6 fin"
  - key: code-postfixe
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct It {
          int v;
          It& operator++() {
              ++v;
              return *this;
          }
          It operator++(int) {
              It avant = *this;
              ++v;
              return avant;
          }
      };

      int main() {
          It a{5};
          const It b = a++;
          const It c = ++a;
          std::println("{} {} {}", a.v, b.v, c.v);
      }
      ```
    choices:
      - {text: "`7 5 7`", correct: true}
      - {text: "`7 6 7`", correct: false}
      - {text: "`7 5 6`", correct: false}
      - {text: "`6 5 6`", correct: false}
    answer: "`7 5 7` : `a++` renvoie la copie d'avant, 5, et `a` passe à 6. `++a` porte `a` à 7 et renvoie l'itérateur incrémenté."
    check:
      output: "7 5 7"
  - key: code-algorithme
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <cstddef>
      #include <iterator>
      #include <print>

      struct It {
          using iterator_category = std::forward_iterator_tag;
          using value_type = int;
          using difference_type = std::ptrdiff_t;
          using pointer = const int*;
          using reference = int;

          int v = 0;
          int operator*() const { return v; }
          It& operator++() {
              ++v;
              return *this;
          }
          It operator++(int) {
              It avant = *this;
              ++v;
              return avant;
          }
          bool operator==(const It&) const = default;
      };

      int main() {
          const It debut{3};
          const It fin{9};
          std::println("{} {}", std::distance(debut, fin), std::count_if(debut, fin, [](int x) { return x % 2 == 0; }));
      }
      ```
    choices:
      - {text: "`6 3`", correct: true}
      - {text: "`6 2`", correct: false}
      - {text: "`7 3`", correct: false}
      - {text: "`5 3`", correct: false}
    answer: "`6 3` : de 3 à 9 exclu, il y a six valeurs. Les paires sont 4, 6 et 8. Les types membres permettent aux algorithmes d'accepter l'itérateur."
    check:
      output: "6 3"
  - key: bug-egalite-manquante
    format: bug-fix
    question: |-
      Le compilateur refuse la boucle : « no match for 'operator!=' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Suite {
          struct It {
              int v;
              int operator*() const { return v; }
              It& operator++() {
                  ++v;
                  return *this;
              }
          };
          It begin() const { return It{0}; }
          It end() const { return It{3}; }
      };

      int main() {
          for (int x : Suite{}) {
              std::println("{}", x);
          }
      }
      ```
    choices:
      - {text: "Ajouter `bool operator==(const It&) const = default;` à `It`", correct: true}
      - {text: "Ajouter `int size() const { return 3; }` à `Suite`", correct: false}
      - {text: "Ajouter `int operator[](int i) const { return i; }` à `Suite`", correct: false}
      - {text: "Ajouter `It operator++(int);` à `It`, sans le définir", correct: false}
    answer: |-
      ```cpp
      bool operator==(const It&) const = default;
      ```
      La boucle compare l'itérateur à `end()`. Depuis C++20, `operator==` suffit : `!=` en est déduit.
  - key: bug-incrementation-oubliee
    format: bug-fix
    question: |-
      Cette boucle ne s'arrête jamais : elle affiche `0` sans fin. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Suite {
          struct It {
              int v;
              int operator*() const { return v; }
              It& operator++() { return *this; }
              bool operator==(const It&) const = default;
          };
          It begin() const { return It{0}; }
          It end() const { return It{3}; }
      };

      int main() {
          for (int x : Suite{}) {
              std::println("{}", x);
          }
      }
      ```
    choices:
      - {text: "Incrémenter `v` dans `operator++`, avant de renvoyer `*this`", correct: true}
      - {text: "Renvoyer `It{3}` depuis `begin()`, à la place de `It{0}`", correct: false}
      - {text: "Déclarer `operator++` avec le mot-clé `const`", correct: false}
      - {text: "Renvoyer une copie depuis `operator++`, sans référence", correct: false}
    answer: |-
      ```cpp
      It& operator++() {
          ++v;
          return *this;
      }
      ```
      L'opérateur ne fait rien : l'itérateur n'atteint jamais `end()`. C'est à `operator++` de faire avancer
      l'état.
  - key: bug-types-membres
    format: bug-fix
    question: |-
      La boucle sur un intervalle fonctionne avec cet itérateur, mais `std::distance` refuse de compiler : il ne
      trouve pas `difference_type`. Quelle correction est la bonne ?
      ```cpp
      #include <iterator>
      #include <print>

      struct It {
          int v;
          int operator*() const { return v; }
          It& operator++() {
              ++v;
              return *this;
          }
          bool operator==(const It&) const = default;
      };

      int main() {
          std::println("{}", std::distance(It{0}, It{4}));
      }
      ```
    choices:
      - {text: "Déclarer les types membres de l'itérateur : catégorie, `value_type`, `difference_type`...", correct: true}
      - {text: "Déclarer une fonction membre `distance()` dans la struct `It`", correct: false}
      - {text: "Déclarer la struct `It` avec le mot-clé `final`", correct: false}
      - {text: "Déclarer `operator*` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      using iterator_category = std::forward_iterator_tag;
      using value_type = int;
      using difference_type = std::ptrdiff_t;
      using pointer = const int*;
      using reference = int;
      ```
      Les algorithmes interrogent `std::iterator_traits`, qui lit ces alias. Sans eux, la classe n'est pas un
      itérateur à leurs yeux. Un itérateur avant demande aussi la forme postfixée `it++`.
  - key: bug-end-decale
    format: bug-fix
    question: |-
      Ce programme devrait afficher les entiers de 1 à 3. Il affiche `1 2`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Plage {
      public:
          struct It {
              int v;
              int operator*() const { return v; }
              It& operator++() {
                  ++v;
                  return *this;
              }
              bool operator==(const It&) const = default;
          };

          Plage(int premier, int dernier) : premier_{premier}, dernier_{dernier} {}
          It begin() const { return It{premier_}; }
          It end() const { return It{dernier_}; }

      private:
          int premier_;
          int dernier_;
      };

      int main() {
          for (int x : Plage{1, 3}) {
              std::print("{} ", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Renvoyer `It{dernier_ + 1}` depuis `end()`", correct: true}
      - {text: "Renvoyer `It{premier_ + 1}` depuis `begin()`", correct: false}
      - {text: "Renvoyer `It{dernier_ - 1}` depuis `end()`", correct: false}
      - {text: "Renvoyer `It{0}` depuis `begin()`", correct: false}
    answer: |-
      ```cpp
      It end() const { return It{dernier_ + 1}; }
      ```
      `end()` désigne la position **après** le dernier élément : l'intervalle est semi-ouvert. Pour inclure
      `dernier_`, la borne est une valeur plus loin.
