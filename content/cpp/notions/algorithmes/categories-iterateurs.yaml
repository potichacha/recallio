notion: categories-iterateurs
lesson: |-
  Tous les itérateurs ne savent pas faire la même chose. Celui d'un vecteur saute de dix éléments d'un coup ; celui
  d'une liste avance pas à pas ; celui d'un flux ne lit chaque élément qu'une fois. Le standard classe ces
  capacités en **catégories**, de la plus limitée à la plus puissante. Chacune **ajoute** des opérations à la
  précédente.

  | Catégorie | Ce qu'elle ajoute | Exemples |
  |---|---|---|
  | **Entrée** (*input*) | lire `*it`, avancer `++it`, une seule passe | `std::istream_iterator` |
  | **Sortie** (*output*) | écrire `*it = x`, avancer, une seule passe | `std::back_inserter`, `std::ostream_iterator` |
  | **Avant** (*forward*) | repasser plusieurs fois sur la même suite | `std::forward_list`, `std::unordered_map` |
  | **Bidirectionnel** | reculer : `--it` | `std::list`, `std::map`, `std::set` |
  | **Accès direct** (*random access*) | `it + n`, `it[n]`, `it1 - it2`, `<` en O(1) | `std::deque` |
  | **Contigu** (C++20) | les éléments se suivent en mémoire | `std::vector`, `std::array`, `std::string`, les pointeurs |

  **Chaque algorithme exige une catégorie minimale.**

  | Algorithme | Exige |
  |---|---|
  | `std::find`, `std::count`, `std::accumulate` | entrée |
  | `std::copy` (sa destination) | sortie |
  | `std::unique`, `std::replace` | avant |
  | `std::reverse`, `std::prev` | bidirectionnel |
  | `std::sort`, `std::nth_element` | accès direct |

  C'est pourquoi `std::sort` refuse une `std::list` : son itérateur ne sait pas sauter. La liste a sa propre
  fonction membre `sort`.

  **Un même algorithme, plusieurs vitesses.** `std::distance(a, b)` et `std::advance(it, n)` fonctionnent avec
  toutes les catégories, mais choisissent leur implémentation : **O(1)** avec un accès direct (une soustraction),
  **O(n)** sinon (une boucle). `std::binary_search` accepte un itérateur avant, mais n'est réellement
  logarithmique qu'avec un accès direct.

  **Une seule passe.** Un itérateur d'entrée consomme ce qu'il lit : une fois avancé, on ne revient pas. On ne peut
  donc pas le parcourir deux fois, ni lui appliquer un algorithme qui en a besoin.

  **Les concepts de C++20.** Chaque catégorie a son concept : `std::input_iterator`, `std::forward_iterator`,
  `std::bidirectional_iterator`, `std::random_access_iterator`, `std::contiguous_iterator`. Les algorithmes de
  `std::ranges` s'en servent pour refuser un mauvais itérateur avec un message clair. Les intervalles ont les
  leurs : `std::ranges::random_access_range`, etc.

  **Pour écrire un itérateur.** On déclare sa catégorie (`iterator_category` ou `iterator_concept`), et l'on
  fournit les opérations qu'elle promet.

  **En entretien** : « Les catégories vont d'entrée à contigu, chacune ajoutant des opérations : avancer,
  repasser, reculer, sauter, être contigu. Un algorithme exige une catégorie minimale : `std::sort` veut un accès
  direct, donc pas une liste. Et `std::distance` est en O(1) ou en O(n) selon la catégorie. »
cards:
  - key: principe
    format: course
    question: "À quoi servent les catégories d'itérateurs ?"
    choices:
      - {text: "À dire quelles opérations un itérateur offre, donc quels algorithmes il accepte", correct: true}
      - {text: "À dire dans quel conteneur un itérateur a le droit d'être rangé", correct: false}
      - {text: "À dire combien d'éléments un itérateur peut parcourir au maximum", correct: false}
      - {text: "À dire si un itérateur est constant ou s'il permet de modifier", correct: false}
    answer: "Chaque catégorie promet des opérations (avancer, reculer, sauter). Un algorithme annonce celle dont il a besoin."
  - key: sort-liste
    format: course
    question: "Pourquoi `std::sort` ne s'applique-t-il pas à une `std::list` ?"
    choices:
      - {text: "Il exige un accès direct, et l'itérateur d'une liste n'est que bidirectionnel", correct: true}
      - {text: "Il exige des éléments constants, et ceux d'une liste sont modifiables", correct: false}
      - {text: "Il exige un itérateur de sortie, et celui d'une liste est en lecture seule", correct: false}
      - {text: "Il exige un conteneur trié d'avance, ce qu'une liste n'est jamais", correct: false}
    answer: "`std::sort` soustrait et additionne des itérateurs. Une liste ne sait qu'avancer et reculer d'un pas : elle fournit sa propre fonction `sort`."
  - key: distance
    format: course
    question: "Quel est le coût de `std::distance(debut, fin)` ?"
    choices:
      - {text: "O(1) avec des itérateurs à accès direct, O(n) avec les autres", correct: true}
      - {text: "O(1) avec tous les itérateurs, quelle que soit leur catégorie", correct: false}
      - {text: "O(n) avec tous les itérateurs, quelle que soit leur catégorie", correct: false}
      - {text: "O(log n) avec des itérateurs bidirectionnels, O(n) avec les autres", correct: false}
    answer: "Avec un accès direct, c'est une soustraction. Sinon, la fonction avance pas à pas en comptant."
  - key: une-passe
    format: course
    question: "Que veut dire qu'un itérateur d'entrée est « à une seule passe » ?"
    choices:
      - {text: "Qu'on ne peut pas relire un élément une fois l'itérateur avancé", correct: true}
      - {text: "Qu'il ne peut parcourir qu'un seul élément du conteneur", correct: false}
      - {text: "Qu'il ne peut être utilisé que par un seul thread", correct: false}
      - {text: "Qu'il ne peut être copié qu'une seule fois", correct: false}
    answer: "Il consomme sa source, comme la lecture d'un flux. Une copie gardée avant d'avancer ne redonne pas l'ancien élément."
  - key: vf-vector
    format: true-false
    question: "L'itérateur d'un `std::vector` est contigu."
    truth: true
    answer: "Ses éléments se suivent en mémoire. C'est la catégorie la plus forte, qui inclut l'accès direct."
  - key: vf-map
    format: true-false
    question: "L'itérateur d'une `std::map` permet d'écrire `it + 5`."
    truth: false
    answer: "Il est bidirectionnel : `++it` et `--it` seulement. `std::next(it, 5)` fait les cinq pas."
  - key: vf-inclusion
    format: true-false
    question: "Un itérateur à accès direct offre aussi les opérations d'un itérateur bidirectionnel."
    truth: true
    answer: "Les catégories s'emboîtent : chacune ajoute des opérations à la précédente."
  - key: vf-deque
    format: true-false
    question: "L'itérateur d'une `std::deque` est contigu."
    truth: false
    answer: "Il est à accès direct, mais la deque range ses éléments dans plusieurs blocs : ils ne sont pas contigus."
  - key: qcm-reculer
    format: multiple-choice
    question: "Quelle est la catégorie la plus faible qui permet d'écrire `--it` ?"
    choices:
      - {text: "Bidirectionnel", correct: true}
      - {text: "Avant", correct: false}
      - {text: "Entrée", correct: false}
      - {text: "Accès direct", correct: false}
    answer: "Un itérateur avant ne sait qu'avancer. Le bidirectionnel ajoute le recul ; l'accès direct y ajoute les sauts."
  - key: qcm-forward-list
    format: multiple-choice
    question: "Quelle est la catégorie de l'itérateur d'une `std::forward_list` ?"
    choices:
      - {text: "Avant", correct: true}
      - {text: "Bidirectionnel", correct: false}
      - {text: "Accès direct", correct: false}
      - {text: "Contigu", correct: false}
    answer: "Une liste simplement chaînée ne connaît que son élément suivant : on ne peut pas reculer."
  - key: qcm-concept
    format: multiple-choice
    question: "Quel concept de C++20 exprime la catégorie « accès direct » ?"
    choices:
      - {text: "`std::random_access_iterator`", correct: true}
      - {text: "`std::direct_iterator`", correct: false}
      - {text: "`std::forward_iterator`", correct: false}
      - {text: "`std::indexed_iterator`", correct: false}
    answer: "Chaque catégorie a son concept, que les algorithmes de `std::ranges` vérifient à la compilation."
  - key: qcm-find
    format: multiple-choice
    question: "Quelle catégorie minimale `std::find` exige-t-il ?"
    choices:
      - {text: "Entrée", correct: true}
      - {text: "Avant", correct: false}
      - {text: "Bidirectionnel", correct: false}
      - {text: "Accès direct", correct: false}
    answer: "Il lit chaque élément une fois, dans l'ordre : une seule passe suffit. Il fonctionne donc avec tous les conteneurs."
  - key: situation-advance
    format: scenario
    question: |-
      Une boucle appelle `std::advance(it, 1000)` sur l'itérateur d'une `std::list` d'un million d'éléments, des
      milliers de fois. Le programme est très lent. Pourquoi, et que proposes-tu ?
    choices:
      - {text: "Chaque appel fait mille pas, un par un ; un `std::vector` saute en O(1)", correct: true}
      - {text: "Chaque appel copie la liste entière ; il faut passer l'itérateur par référence", correct: false}
      - {text: "Chaque appel trie la liste ; il faut la trier une seule fois avant la boucle", correct: false}
      - {text: "Chaque appel verrouille la liste ; il faut retirer le mutex de la boucle", correct: false}
    answer: |-
      L'itérateur d'une liste est bidirectionnel : avancer de `n` coûte O(n). Avec un accès direct, c'est une
      addition. Si le programme saute souvent, le conteneur est mal choisi.
  - key: situation-flux
    format: scenario
    question: |-
      Tu lis des nombres d'un flux avec `std::istream_iterator`, et tu veux les parcourir deux fois : une pour la
      somme, une pour le maximum. La seconde boucle ne trouve rien. Que fais-tu ?
    choices:
      - {text: "Je range d'abord les nombres dans un `std::vector`, que je parcours deux fois", correct: true}
      - {text: "Je recule l'itérateur avec `--it` jusqu'au début du flux", correct: false}
      - {text: "Je copie l'itérateur avant la première boucle, et je repars de la copie", correct: false}
      - {text: "Je trie le flux avec `std::sort` avant de le parcourir", correct: false}
    answer: |-
      Un itérateur d'entrée est à une seule passe : ce qui est lu est consommé. Pour repasser sur les données, il
      faut les stocker. On peut aussi calculer les deux résultats dans la même boucle.
  - key: situation-message
    format: scenario
    question: |-
      `std::ranges::sort(liste)` sur une `std::list<int>` échoue avec « constraints not satisfied », suivi de
      `random_access_range`. Un collègue ne comprend pas. Que lui expliques-tu ?
    choices:
      - {text: "Que l'algorithme exige un accès direct, que la liste n'a pas : il faut `liste.sort()`", correct: true}
      - {text: "Que la liste est vide, et qu'un intervalle vide ne satisfait aucun concept", correct: false}
      - {text: "Que le type `int` ne se compare pas, et qu'il faut fournir un comparateur", correct: false}
      - {text: "Que l'en-tête `<ranges>` manque, et qu'il suffit de l'inclure", correct: false}
    answer: |-
      Le concept nommé dans le message est l'exigence non remplie. Les algorithmes de `std::ranges` vérifient la
      catégorie à la compilation, et le disent clairement.
  - key: situation-choix
    format: scenario
    question: |-
      Tu écris une fonction générique qui doit lire l'élément du milieu d'une suite, en temps constant. Quelle
      exigence poses-tu sur l'intervalle reçu ?
    choices:
      - {text: "`std::ranges::random_access_range`", correct: true}
      - {text: "`std::ranges::input_range`", correct: false}
      - {text: "`std::ranges::forward_range`", correct: false}
      - {text: "`std::ranges::bidirectional_range`", correct: false}
    answer: |-
      Seul l'accès direct garantit `debut + n` en O(1). Avec une exigence plus faible, la fonction compilerait
      pour une liste, et atteindrait le milieu en O(n).
  - key: definition-entree
    format: definition
    question: "Qu'est-ce qu'un itérateur d'entrée ?"
    choices:
      - {text: "Un itérateur qui lit et avance, en une seule passe", correct: true}
      - {text: "Un itérateur qui écrit et avance, en une seule passe", correct: false}
      - {text: "Un itérateur qui désigne le premier élément d'un conteneur", correct: false}
      - {text: "Un itérateur qui sait avancer et reculer d'un pas", correct: false}
    answer: "C'est la catégorie la plus faible en lecture. Celui qui écrit est l'itérateur de sortie."
  - key: definition-acces-direct
    format: definition
    question: "Qu'est-ce qu'un itérateur à accès direct ?"
    choices:
      - {text: "Un itérateur qui saute de `n` éléments en temps constant", correct: true}
      - {text: "Un itérateur qui donne l'adresse de l'élément en mémoire", correct: false}
      - {text: "Un itérateur qui avance sans jamais être invalidé", correct: false}
      - {text: "Un itérateur qui accède à l'élément sans le copier", correct: false}
    answer: "En anglais, *random access*. Il offre `it + n`, `it[n]`, la soustraction et les comparaisons `<`."
  - key: definition-contigu
    format: definition
    question: "Qu'est-ce qu'un itérateur contigu ?"
    choices:
      - {text: "Un itérateur à accès direct dont les éléments se suivent en mémoire", correct: true}
      - {text: "Un itérateur dont les éléments sont tous de même valeur", correct: false}
      - {text: "Un itérateur qui parcourt deux conteneurs à la suite", correct: false}
      - {text: "Un itérateur qui ne peut pas être séparé de son conteneur", correct: false}
    answer: "Catégorie ajoutée en C++20. On peut en tirer un pointeur et une taille, donc un `std::span`."
  - key: definition-bidirectionnel
    format: definition
    question: "Qu'est-ce qu'un itérateur bidirectionnel ?"
    choices:
      - {text: "Un itérateur qui avance et recule, un élément à la fois", correct: true}
      - {text: "Un itérateur qui lit et écrit dans deux conteneurs", correct: false}
      - {text: "Un itérateur qui parcourt la suite depuis ses deux bouts", correct: false}
      - {text: "Un itérateur qui saute de deux éléments à chaque pas", correct: false}
    answer: "C'est celui de `std::list`, `std::map` et `std::set`. Il permet `std::reverse` et les itérateurs inversés."
