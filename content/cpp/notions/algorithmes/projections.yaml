notion: projections
lesson: |-
  Trier des personnes par âge avec `std::sort` demande une lambda qui compare deux personnes. Les algorithmes de
  `std::ranges` (C++20) acceptent à la place une **projection** : une fonction appliquée à **chaque élément avant
  la comparaison**. On dit **sur quoi** comparer, plus **comment**.

  ```cpp
  struct Personne {
      std::string nom;
      int age;
  };

  // sans projection
  std::sort(gens.begin(), gens.end(),
            [](const Personne& a, const Personne& b) { return a.age < b.age; });

  // avec projection
  std::ranges::sort(gens, {}, &Personne::age);
  ```

  **L'ordre des arguments.** L'intervalle, puis la **comparaison**, puis la **projection**. Les accolades vides
  `{}` gardent la comparaison par défaut, `std::ranges::less`.

  ```cpp
  std::ranges::sort(gens, std::ranges::greater{}, &Personne::age);   // du plus âgé au plus jeune
  ```

  **Ce qu'on peut passer comme projection.** Tout ce qui s'appelle avec un élément :

  | Projection | Exemple |
  |---|---|
  | un pointeur vers un **membre de données** | `&Personne::age` |
  | un pointeur vers une **fonction membre** | `&std::string::size` |
  | une **lambda** ou une fonction | `[](const Personne& p) { return p.nom.size(); }` |

  **La projection sert à comparer, pas à transformer.** L'algorithme travaille sur les éléments d'origine : après
  `std::ranges::sort(gens, {}, &Personne::age)`, le vecteur contient toujours des `Personne`. De même, les
  algorithmes de recherche rendent un itérateur sur l'**élément**, pas sur la valeur projetée.

  **Avec les autres algorithmes.**

  ```cpp
  auto it = std::ranges::find(gens, "Ada", &Personne::nom);          // la personne nommée Ada
  auto doyen = std::ranges::max_element(gens, {}, &Personne::age);   // la plus âgée
  auto majeurs = std::ranges::count_if(gens, [](int a) { return a >= 18; }, &Personne::age);
  bool trie = std::ranges::is_sorted(gens, {}, &Personne::age);
  ```

  Pour `find`, la valeur cherchée est comparée à la **projection** de chaque élément. Pour `count_if`, le prédicat
  reçoit la valeur **projetée**.

  **Les algorithmes à deux intervalles** prennent deux projections, une par intervalle : `std::ranges::equal`,
  `std::ranges::mismatch`.

  **Ce qu'on y gagne.** Moins de code, et surtout moins d'erreurs : plus de `a.age < b.nom` écrit par mégarde, ni
  de comparaison inversée entre `a` et `b`.

  **La limite.** Une projection extrait **un** critère. Pour trier sur deux critères, on projette vers un tuple :
  `[](const Personne& p) { return std::tie(p.age, p.nom); }`, ou l'on écrit la comparaison.

  **En entretien** : « Une projection est une fonction appliquée à chaque élément avant la comparaison :
  `std::ranges::sort(gens, {}, &Personne::age)` trie par âge sans lambda. Les arguments sont l'intervalle, la
  comparaison, la projection ; et l'algorithme rend toujours les éléments d'origine, pas les valeurs projetées. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce que la projection d'un algorithme de `std::ranges` ?"
    choices:
      - {text: "Une fonction appliquée à chaque élément avant la comparaison ou le test", correct: true}
      - {text: "Une fonction appliquée à chaque élément après le tri, pour le transformer", correct: false}
      - {text: "Une copie de l'intervalle, sur laquelle l'algorithme travaille", correct: false}
      - {text: "Une vue qui ne garde que certains éléments de l'intervalle", correct: false}
    answer: "Elle dit sur quelle partie de l'élément l'algorithme raisonne : un membre, une longueur, une clé. Les éléments eux-mêmes ne changent pas."
  - key: ordre-arguments
    format: course
    question: "Dans `std::ranges::sort(gens, {}, &Personne::age)`, que représentent les accolades vides ?"
    choices:
      - {text: "La comparaison par défaut, `std::ranges::less`", correct: true}
      - {text: "Une projection vide, qui ne fait rien", correct: false}
      - {text: "Un intervalle vide, à trier d'abord", correct: false}
      - {text: "Une politique d'exécution par défaut", correct: false}
    answer: "Les arguments sont l'intervalle, la comparaison, puis la projection. `{}` construit la comparaison par défaut pour atteindre le troisième."
  - key: resultat
    format: course
    question: "Que renvoie `std::ranges::max_element(gens, {}, &Personne::age)` ?"
    choices:
      - {text: "Un itérateur sur la personne la plus âgée", correct: true}
      - {text: "Un itérateur sur l'âge le plus grand", correct: false}
      - {text: "L'âge le plus grand, de type `int`", correct: false}
      - {text: "Une copie de la personne la plus âgée", correct: false}
    answer: "La projection ne sert qu'à comparer. L'algorithme rend l'élément d'origine : on lit ensuite `it->nom` ou `it->age`."
  - key: formes
    format: course
    question: "Laquelle de ces expressions est une projection valide pour un vecteur de `std::string` ?"
    choices:
      - {text: "`&std::string::size`, un pointeur vers une fonction membre", correct: true}
      - {text: "`std::string::size()`, un appel de fonction membre", correct: false}
      - {text: "`size`, le nom de la fonction seul", correct: false}
      - {text: "`\"size\"`, le nom de la fonction en chaîne", correct: false}
    answer: "Une projection est tout ce qui s'appelle avec un élément : pointeur vers un membre de données, pointeur vers une fonction membre, lambda, fonction."
  - key: vf-std-sort
    format: true-false
    question: "`std::sort` accepte une projection en dernier argument."
    truth: false
    answer: "Seuls les algorithmes de `std::ranges` en acceptent. Avec `std::sort`, on écrit la comparaison entière."
  - key: vf-elements-inchanges
    format: true-false
    question: "Après `std::ranges::sort(gens, {}, &Personne::age)`, le vecteur contient toujours des `Personne`."
    truth: true
    answer: "La projection extrait la clé de comparaison. Les éléments sont réordonnés, pas transformés."
  - key: vf-lambda
    format: true-false
    question: "Une lambda peut servir de projection."
    truth: true
    answer: "Par exemple `[](const Personne& p) { return p.nom.size(); }`, pour trier par longueur du nom."
  - key: vf-find
    format: true-false
    question: "`std::ranges::find(gens, \"Ada\", &Personne::nom)` renvoie un itérateur sur une chaîne."
    truth: false
    answer: "Il renvoie un itérateur sur la `Personne` dont le nom vaut `Ada`, ou la fin de l'intervalle."
  - key: qcm-decroissant
    format: multiple-choice
    question: "Quelle ligne trie les personnes de la plus âgée à la plus jeune ?"
    choices:
      - {text: "`std::ranges::sort(gens, std::ranges::greater{}, &Personne::age);`", correct: true}
      - {text: "`std::ranges::sort(gens, &Personne::age, std::ranges::greater{});`", correct: false}
      - {text: "`std::ranges::sort(gens, {}, &Personne::age, true);`", correct: false}
      - {text: "`std::ranges::sort(gens, {}, -&Personne::age);`", correct: false}
    answer: "La comparaison vient avant la projection. `std::ranges::greater` compare les âges projetés avec `>`."
  - key: qcm-longueur
    format: multiple-choice
    question: "Quelle ligne trie un vecteur de `std::string` du mot le plus court au plus long ?"
    choices:
      - {text: "`std::ranges::sort(mots, {}, &std::string::size);`", correct: true}
      - {text: "`std::ranges::sort(mots, &std::string::size);`", correct: false}
      - {text: "`std::ranges::sort(mots, {}, std::string::size);`", correct: false}
      - {text: "`std::ranges::sort(mots.size());`", correct: false}
    answer: "La projection est le pointeur vers la fonction membre `size`. En deuxième position, il serait pris pour la comparaison."
  - key: qcm-count-if
    format: multiple-choice
    question: "Dans `std::ranges::count_if(gens, predicat, &Personne::age)`, que reçoit le prédicat ?"
    choices:
      - {text: "L'âge de chaque personne", correct: true}
      - {text: "Chaque personne entière", correct: false}
      - {text: "Deux personnes à comparer", correct: false}
      - {text: "L'indice de chaque personne", correct: false}
    answer: "Le prédicat s'applique à la valeur projetée : on écrit `[](int age) { return age >= 18; }`."
  - key: qcm-deux-criteres
    format: multiple-choice
    question: "Comment tries-tu par âge, puis par nom à âge égal, avec une projection ?"
    choices:
      - {text: "En projetant vers `std::tie(p.age, p.nom)`", correct: true}
      - {text: "En passant deux projections à la suite", correct: false}
      - {text: "En projetant vers `p.age + p.nom`", correct: false}
      - {text: "En appelant `std::ranges::sort` sans argument", correct: false}
    answer: "Un tuple se compare champ par champ : d'abord l'âge, puis le nom. `std::ranges::sort` n'accepte qu'une projection."
  - key: trous-membre
    format: fill-in
    question: |-
      Complète la projection, pour ranger les personnes de la plus jeune à la plus âgée :
      ```cpp
      std::ranges::sort(gens, {}, &Personne::___);
      ```
    blanks:
      - [age]
    answer: "`&Personne::age` est un pointeur vers le membre : c'est la projection."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour garder la comparaison par défaut :
      ```cpp
      std::ranges::sort(gens, ___, &Personne::nom);
      ```
    blanks:
      - ["{}"]
    answer: "Des accolades vides construisent la comparaison par défaut, `std::ranges::less`."
  - key: trous-find
    format: fill-in
    question: |-
      Complète pour chercher la personne nommée Ada :
      ```cpp
      auto it = std::ranges::___(gens, "Ada", &Personne::nom);
      ```
    blanks:
      - [find]
    answer: "`std::ranges::find` compare la valeur à la projection de chaque élément."
  - key: trous-esperluette
    format: fill-in
    question: |-
      Complète pour former le pointeur vers le membre `prix` :
      ```cpp
      auto moins_cher = std::ranges::min_element(articles, {}, ___Article::prix);
      ```
    blanks:
      - ["&"]
    answer: "Un pointeur vers un membre s'écrit `&Classe::membre`."
  - key: code-sort
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Max", 52}, {"Ines", 19}, {"Hugo", 31}};
          std::ranges::sort(gens, {}, &Personne::age);
          std::println("{} {}", gens.front().nom, gens.back().nom);
      }
      ```
    choices:
      - {text: "`Ines Max`", correct: true}
      - {text: "`Hugo Max`", correct: false}
      - {text: "`Max Ines`", correct: false}
      - {text: "`Max Hugo`", correct: false}
    answer: "`Ines Max` : le tri compare les âges, pas les noms. La plus jeune est en tête, le plus âgé à la fin."
    check:
      output: "Ines Max"
  - key: code-max-element
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<std::string> mots{"kiwi", "fraise", "noix"};
          const auto plus_long = std::ranges::max_element(mots, {}, &std::string::size);
          const auto premier = std::ranges::min_element(mots);
          std::println("{} {}", *plus_long, *premier);
      }
      ```
    choices:
      - {text: "`fraise fraise`", correct: true}
      - {text: "`fraise kiwi`", correct: false}
      - {text: "`noix fraise`", correct: false}
      - {text: "`6 fraise`", correct: false}
    answer: "`fraise fraise` : avec la projection, on compare les longueurs ; sans elle, les chaînes elles-mêmes, et `fraise` vient en premier dans l'ordre alphabétique. L'algorithme rend l'élément, pas la longueur."
    check:
      output: "fraise fraise"
  - key: code-find-count
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          const std::vector<Personne> gens{{"Ada", 36}, {"Tom", 12}, {"Lou", 17}};
          const auto it = std::ranges::find(gens, "Tom", &Personne::nom);
          const auto majeurs = std::ranges::count_if(gens, [](int age) { return age >= 18; }, &Personne::age);
          std::println("{} {}", it->age, majeurs);
      }
      ```
    choices:
      - {text: "`12 1`", correct: true}
      - {text: "`12 2`", correct: false}
      - {text: "`36 1`", correct: false}
      - {text: "`17 2`", correct: false}
    answer: "`12 1` : `find` rend la personne dont le nom vaut `Tom`. Le prédicat de `count_if` reçoit les âges : une seule personne a 18 ans ou plus."
    check:
      output: "12 1"
  - key: code-greater
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <functional>
      #include <print>
      #include <utility>
      #include <vector>

      int main() {
          std::vector<std::pair<int, char>> v{{2, 'a'}, {5, 'b'}, {1, 'c'}};
          std::ranges::sort(v, std::ranges::greater{}, &std::pair<int, char>::first);
          std::println("{}{}{}", v[0].second, v[1].second, v[2].second);
      }
      ```
    choices:
      - {text: "`bac`", correct: true}
      - {text: "`cab`", correct: false}
      - {text: "`abc`", correct: false}
      - {text: "`cba`", correct: false}
    answer: "`bac` : la projection extrait le premier champ, et `std::ranges::greater` trie par ordre décroissant : 5, 2, 1."
    check:
      output: "bac"
  - key: bug-projection-en-deuxieme
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : il prend `&Personne::age` pour la comparaison. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          std::vector<Personne> gens{{"Léa", 40}, {"Zoé", 25}};
          std::ranges::sort(gens, &Personne::age);
          std::println("{}", gens.front().nom);
      }
      ```
    choices:
      - {text: "Écrire `std::ranges::sort(gens, {}, &Personne::age);`", correct: true}
      - {text: "Écrire `std::ranges::sort(gens, Personne::age);`", correct: false}
      - {text: "Écrire `std::ranges::sort(&Personne::age, gens);`", correct: false}
      - {text: "Écrire `std::ranges::sort(gens, &Personne::age, {});`", correct: false}
    answer: |-
      ```cpp
      std::ranges::sort(gens, {}, &Personne::age);
      ```
      Le deuxième argument est la comparaison, le troisième la projection. `{}` garde la comparaison par défaut.
  - key: bug-std-sort
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : `std::sort` ne connaît pas les projections. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> mots{"fraise", "kiwi"};
          std::sort(mots.begin(), mots.end(), {}, &std::string::size);
          std::println("{}", mots.front());
      }
      ```
    choices:
      - {text: "Écrire `std::ranges::sort(mots, {}, &std::string::size);`", correct: true}
      - {text: "Écrire `std::sort(mots, {}, &std::string::size);`", correct: false}
      - {text: "Écrire `std::sort(mots.begin(), mots.end(), &std::string::size);`", correct: false}
      - {text: "Écrire `std::stable_sort(mots.begin(), mots.end(), {}, &std::string::size);`", correct: false}
    answer: |-
      ```cpp
      std::ranges::sort(mots, {}, &std::string::size);
      ```
      Les projections n'existent que dans les algorithmes de `std::ranges`. Avec `std::sort`, il faudrait une
      comparaison complète entre deux chaînes.
  - key: bug-predicat-element
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : le prédicat attend une `Personne`, et reçoit un `int`. Quelle correction
      est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          const std::vector<Personne> gens{{"Ada", 36}, {"Tom", 12}};
          const auto n = std::ranges::count_if(gens, [](const Personne& p) { return p.age >= 18; }, &Personne::age);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Écrire le prédicat sur l'âge : `[](int age) { return age >= 18; }`", correct: true}
      - {text: "Écrire le prédicat sur deux personnes, comme une comparaison", correct: false}
      - {text: "Écrire la projection `&Personne::nom` à la place de `&Personne::age`", correct: false}
      - {text: "Écrire `std::ranges::count` à la place de `std::ranges::count_if`", correct: false}
    answer: |-
      ```cpp
      const auto n = std::ranges::count_if(gens, [](int age) { return age >= 18; }, &Personne::age);
      ```
      Avec une projection, le prédicat reçoit la valeur projetée, ici l'âge. On peut aussi garder le prédicat sur
      `Personne` et retirer la projection.
  - key: bug-resultat-projete
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser `doyen` : l'algorithme ne renvoie pas un `int`. Le programme devrait
      afficher l'âge le plus grand. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          const std::vector<Personne> gens{{"Ada", 36}, {"Tom", 12}};
          const int doyen = std::ranges::max_element(gens, {}, &Personne::age);
          std::println("{}", doyen);
      }
      ```
    choices:
      - {text: "Écrire `std::ranges::max_element(gens, {}, &Personne::age)->age`", correct: true}
      - {text: "Écrire `*std::ranges::max_element(gens, {}, &Personne::age)`", correct: false}
      - {text: "Écrire `std::ranges::max_element(gens, &Personne::age)`", correct: false}
      - {text: "Écrire `std::ranges::max_element(gens).age`", correct: false}
    answer: |-
      ```cpp
      const int doyen = std::ranges::max_element(gens, {}, &Personne::age)->age;
      ```
      L'algorithme rend un itérateur sur la **personne**, pas sur la valeur projetée. On lit ensuite le membre
      voulu. Le déréférencer seul donnerait une `Personne`.
