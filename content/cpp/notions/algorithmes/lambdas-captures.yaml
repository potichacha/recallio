notion: lambdas-captures
lesson: |-
  Une lambda ne voit pas les variables locales de la fonction qui l'entoure, sauf si elle les **capture**. Les
  crochets disent lesquelles, et comment.

  ```cpp
  int seuil = 10;
  auto grand = [seuil](int x) { return x > seuil; };
  ```

  **Par valeur ou par référence.**

  | Écriture | Ce qui est capturé |
  |---|---|
  | `[x]` | une **copie** de `x`, faite à la **création** de la lambda |
  | `[&x]` | une **référence** vers `x` |
  | `[=]` | par copie, toutes les variables utilisées |
  | `[&]` | par référence, toutes les variables utilisées |
  | `[=, &x]` | tout par copie, sauf `x` par référence |
  | `[&, x]` | tout par référence, sauf `x` par copie |
  | `[this]` | l'objet courant, par pointeur |

  **La capture par valeur fige la valeur.** La copie est faite quand la lambda est créée, pas quand elle est
  appelée :

  ```cpp
  int n = 1;
  auto lire = [n] { return n; };
  n = 2;
  lire();   // 1
  ```

  Cette copie est **constante** dans la lambda : `[n] { ++n; }` ne compile pas (sauf avec `mutable`).

  **La capture par référence voit et modifie l'original.**

  ```cpp
  int total = 0;
  std::for_each(v.begin(), v.end(), [&total](int x) { total += x; });
  ```

  **Le danger : la référence pendante.** Une lambda qui capture par référence ne doit pas **survivre** à la
  variable capturée.

  ```cpp
  auto fabrique() {
      int compteur = 0;
      return [&compteur] { return ++compteur; };   // compteur est détruit au retour
  }
  ```

  Appeler la lambda renvoyée est un comportement indéfini. Dès qu'une lambda sort de la fonction (renvoyée, rangée
  dans un membre, donnée à un thread), on capture **par valeur**.

  **`this`.** Dans une fonction membre, `[this]` donne accès aux membres. C'est un **pointeur** : si l'objet est
  détruit avant l'appel de la lambda, le danger est le même. `[*this]` capture une copie de l'objet.

  **Ce qui n'a pas besoin d'être capturé.** Les variables globales et `static`, et les paramètres de la lambda
  elle-même.

  **La règle pratique.**

  - La lambda est utilisée **sur place** (passée à un algorithme) : `[&]` est sûr et commode.
  - La lambda **s'échappe** : captures par valeur, écrites une à une.

  **En entretien** : « `[x]` copie à la création de la lambda, `[&x]` garde une référence. La référence est
  dangereuse si la lambda survit à la variable : pour une lambda renvoyée ou stockée, je capture par valeur. »
cards:
  - key: capture
    format: course
    question: "Pourquoi une lambda doit-elle capturer une variable locale pour s'en servir ?"
    choices:
      - {text: "Elle ne voit pas les variables locales de la fonction qui l'entoure, sauf celles qu'elle capture", correct: true}
      - {text: "Elle s'exécute dans un autre thread, qui n'a pas accès à la pile de la fonction qui l'entoure", correct: false}
      - {text: "Elle est compilée dans un autre fichier, où les variables de la fonction ne sont pas déclarées", correct: false}
      - {text: "Elle ne peut lire que des constantes connues à la compilation, que la capture fabrique", correct: false}
    answer: "Les crochets disent quelles variables la lambda emporte, et si elle en prend une copie ou une référence."
  - key: valeur-ou-reference
    format: course
    question: "Quelle différence entre `[x]` et `[&x]` ?"
    choices:
      - {text: "`[x]` copie `x` à la création de la lambda ; `[&x]` garde une référence vers `x`", correct: true}
      - {text: "`[x]` garde une référence vers `x` ; `[&x]` copie `x` à la création de la lambda", correct: false}
      - {text: "`[x]` copie `x` à chaque appel de la lambda ; `[&x]` la copie une seule fois", correct: false}
      - {text: "`[x]` capture la valeur de `x` ; `[&x]` capture l'adresse de `x` dans un pointeur", correct: false}
    answer: "La copie garde la valeur du moment de la création. La référence suit la variable : la lambda voit ses changements, et peut la modifier."
  - key: moment-de-la-copie
    format: course
    question: "À quel moment une capture par valeur copie-t-elle la variable ?"
    choices:
      - {text: "Quand la lambda est créée", correct: true}
      - {text: "Quand la lambda est appelée", correct: false}
      - {text: "Quand la variable change", correct: false}
      - {text: "Quand le programme démarre", correct: false}
    answer: "La valeur est figée à la création. Modifier la variable ensuite ne change pas ce que voit la lambda."
  - key: reference-pendante
    format: course
    question: "Quel est le risque d'une capture par référence ?"
    choices:
      - {text: "La lambda peut être appelée après la destruction de la variable capturée", correct: true}
      - {text: "La lambda copie la variable à chaque appel, ce qui la ralentit", correct: false}
      - {text: "La lambda empêche la variable capturée d'être modifiée ailleurs", correct: false}
      - {text: "La lambda ne peut plus être passée à un algorithme standard", correct: false}
    answer: "Une référence ne prolonge pas la vie de la variable. Si la lambda sort de la fonction, elle garde une référence vers une variable détruite : comportement indéfini."
  - key: vf-copie-modifiable
    format: true-false
    question: "Une variable capturée par valeur peut être modifiée dans la lambda, sans mot-clé particulier."
    truth: false
    answer: "La copie est constante par défaut. Il faut déclarer la lambda `mutable` pour la modifier, et l'original reste intact."
  - key: vf-globales
    format: true-false
    question: "Une lambda doit capturer une variable globale pour s'en servir."
    truth: false
    answer: Les variables globales et statiques sont accessibles sans capture. Seules les variables locales se capturent.
  - key: vf-reference-modifie
    format: true-false
    question: "Une lambda qui capture `total` par référence peut modifier la variable `total` d'origine."
    truth: true
    answer: C'est l'usage habituel pour accumuler un résultat dans un algorithme.
  - key: vf-this
    format: true-false
    question: "`[this]` capture une copie de l'objet courant."
    truth: false
    answer: "`[this]` capture le pointeur. Si l'objet est détruit avant l'appel, la lambda désigne un objet mort. La copie s'écrit `[*this]`."
  - key: qcm-tout-par-reference
    format: multiple-choice
    question: "Quelle capture prend par référence toutes les variables utilisées dans la lambda ?"
    choices:
      - {text: "`[&]`", correct: true}
      - {text: "`[=]`", correct: false}
      - {text: "`[*]`", correct: false}
      - {text: "`[]`", correct: false}
    answer: "`[&]` : tout par référence. `[=]` : tout par copie. `[]` : rien."
  - key: qcm-mixte
    format: multiple-choice
    question: "Que capture `[=, &total]` ?"
    choices:
      - {text: "Tout par copie, sauf `total` par référence", correct: true}
      - {text: "Tout par référence, sauf `total` par copie", correct: false}
      - {text: "Seulement `total`, par référence", correct: false}
      - {text: "Seulement `total`, par copie", correct: false}
    answer: "Le premier élément donne le mode par défaut, les suivants les exceptions."
  - key: qcm-lambda-renvoyee
    format: multiple-choice
    question: "Une fonction renvoie une lambda qui utilise sa variable locale `base`. Quelle capture est sûre ?"
    choices:
      - {text: "`[base]`", correct: true}
      - {text: "`[&base]`", correct: false}
      - {text: "`[&]`", correct: false}
      - {text: "`[]`", correct: false}
    answer: "`base` est détruite au retour de la fonction : il faut en emporter une copie. `[]` ne compile pas, puisque la lambda utilise `base`."
  - key: qcm-acces-membres
    format: multiple-choice
    question: "Dans une fonction membre, quelle capture donne à la lambda l'accès aux membres de l'objet ?"
    choices:
      - {text: "`[this]`", correct: true}
      - {text: "`[self]`", correct: false}
      - {text: "`[class]`", correct: false}
      - {text: "`[object]`", correct: false}
    answer: "`[this]` capture le pointeur vers l'objet courant ; la lambda lit alors les membres directement."
  - key: code-copie-figee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int n = 1;
          auto par_valeur = [n] { return n; };
          auto par_reference = [&n] { return n; };
          n = 5;
          std::println("{} {}", par_valeur(), par_reference());
      }
      ```
    choices:
      - {text: "`1 5`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`5 1`", correct: false}
    answer: "`1 5` : la capture par valeur a copié `n` quand elle valait 1. La capture par référence lit la variable au moment de l'appel."
    check:
      output: "1 5"
  - key: code-accumuler
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4};
          int total = 0;
          std::for_each(v.begin(), v.end(), [&total](int x) { total += x; });
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`24`", correct: false}
    answer: "`10` : la lambda modifie `total` à travers la référence. Chaque élément s'y ajoute."
    check:
      output: "10"
  - key: code-seuil
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 12, 8, 20};
          int seuil = 10;
          auto grand = [seuil](int x) { return x > seuil; };
          seuil = 0;
          std::println("{}", std::count_if(v.begin(), v.end(), grand));
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`2` : la lambda a copié `seuil` quand il valait 10. Le remettre à 0 ensuite ne change rien : seuls 12 et 20 dépassent 10."
    check:
      output: "2"
  - key: code-compteur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int appels = 0;
          auto compter = [&] { ++appels; };
          compter();
          compter();
          compter();
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : `[&]` capture `appels` par référence. Chaque appel incrémente la variable d'origine."
    check:
      output: "3"
  - key: bug-reference-pendante
    format: bug-fix
    question: |-
      Cette fonction renvoie une lambda qui devrait ajouter `base` à son argument. Le programme devrait afficher
      `15` ; son comportement est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      auto additionneur(int base) {
          return [&base](int x) { return base + x; };
      }

      int main() {
          auto ajouter_dix = additionneur(10);
          std::println("{}", ajouter_dix(5));
      }
      ```
    choices:
      - {text: "Capturer `base` par valeur : `[base]`", correct: true}
      - {text: "Capturer tout par référence : `[&]`", correct: false}
      - {text: "Déclarer le paramètre `const int base`", correct: false}
      - {text: "Déclarer `ajouter_dix` avec `const auto&`", correct: false}
    answer: |-
      ```cpp
      return [base](int x) { return base + x; };
      ```
      `base` est détruite au retour de `additionneur` : la lambda garde une référence vers une variable morte. Une
      lambda qui sort de la fonction capture par valeur.
  - key: bug-capture-oubliee
    format: bug-fix
    question: |-
      Le compilateur répond « 'seuil' is not captured ». Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 12, 8};
          int seuil = 7;
          auto n = std::count_if(v.begin(), v.end(), [](int x) { return x > seuil; });
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Écrire `[seuil](int x)`", correct: true}
      - {text: "Écrire `[](int x, int seuil)`", correct: false}
      - {text: "Écrire `[int seuil](int x)`", correct: false}
      - {text: "Écrire `[](int x) -> seuil`", correct: false}
    answer: |-
      ```cpp
      [seuil](int x) { return x > seuil; }
      ```
      Une lambda n'accède à une variable locale que si elle la capture. Ajouter un second paramètre ne convient pas :
      `std::count_if` appelle le prédicat avec un seul argument.
  - key: bug-modifier-la-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3` : la lambda compte ses appels. Le compilateur refuse `++appels`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int appels = 0;
          auto compter = [appels] { ++appels; };
          compter();
          compter();
          compter();
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "Capturer `appels` par référence : `[&appels]`", correct: true}
      - {text: "Déclarer `appels` avec le mot-clé `const`", correct: false}
      - {text: "Écrire `appels++` à la place de `++appels`", correct: false}
      - {text: "Capturer tout par copie : `[=]`", correct: false}
    answer: |-
      ```cpp
      auto compter = [&appels] { ++appels; };
      ```
      Une copie capturée est constante, et de toute façon ce n'est pas elle qu'on affiche. Pour modifier la variable
      d'origine, on la capture par référence.
  - key: bug-valeur-figee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `false` : après le changement de limite, 15 ne la dépasse plus. Il affiche
      `true`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int limite = 10;
          auto depasse = [limite](int x) { return x > limite; };
          limite = 20;
          std::println("{}", depasse(15));
      }
      ```
    choices:
      - {text: "Capturer `limite` par référence : `[&limite]`", correct: true}
      - {text: "Capturer `limite` avec `[=]` à la place de `[limite]`", correct: false}
      - {text: "Déclarer `depasse` avec `const auto`", correct: false}
      - {text: "Écrire `x >= limite` dans la lambda", correct: false}
    answer: |-
      ```cpp
      auto depasse = [&limite](int x) { return x > limite; };
      ```
      La capture par valeur a figé `limite` à 10. Pour suivre ses changements, on la capture par référence ; ici, la
      lambda ne quitte pas `main`, donc c'est sans danger.
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour que la lambda modifie la variable `total` d'origine :
      ```cpp
      int total = 0;
      auto ajouter = [___total](int x) { total += x; };
      ```
    blanks:
      - ["&"]
    answer: "`[&total]` capture une référence : la lambda modifie la variable elle-même."
  - key: trous-tout-par-copie
    format: fill-in
    question: |-
      Complète pour capturer par copie toutes les variables utilisées :
      ```cpp
      int a = 1;
      int b = 2;
      auto somme = [___] { return a + b; };
      ```
    blanks:
      - ["="]
    answer: "`[=]` capture par copie tout ce que la lambda utilise."
  - key: trous-this
    format: fill-in
    question: |-
      Complète pour que la lambda accède au membre `seuil_` :
      ```cpp
      bool Filtre::garde(int x) const {
          auto test = [___](int valeur) { return valeur > seuil_; };
          return test(x);
      }
      ```
    blanks:
      - [this]
    answer: "`[this]` capture le pointeur vers l'objet courant, et donne accès à ses membres."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour que la lambda renvoyée emporte une copie de `facteur` :
      ```cpp
      auto multiplicateur(int facteur) {
          return [___](int x) { return x * facteur; };
      }
      ```
    blanks:
      - [facteur, "="]
    answer: "`[facteur]` : la lambda sort de la fonction, elle doit capturer par valeur. `[=]` convient aussi."
  - key: situation-callback
    format: scenario
    question: |-
      Une fonction enregistre une lambda auprès d'un bouton, qui l'appellera plus tard, quand on cliquera. La lambda
      capture avec `[&]` une variable locale `message`. Au clic, le programme plante. Que proposes-tu ?
    choices:
      - {text: "Capturer `message` par valeur : la lambda survit à la fonction", correct: true}
      - {text: "Capturer `message` avec `[&message]`, plus précis que `[&]`", correct: false}
      - {text: "Déclarer `message` avec `const`, pour qu'elle ne soit pas détruite", correct: false}
      - {text: "Appeler la lambda une fois dans la fonction, avant de l'enregistrer", correct: false}
    answer: |-
      Au moment du clic, la fonction est terminée, et `message` détruite : la référence capturée est pendante. Une
      lambda stockée pour plus tard emporte des copies. `[&message]` reste une référence, et `const` ne prolonge pas
      la vie d'une variable.
  - key: situation-revue-egal
    format: scenario
    question: |-
      En revue de code, une fonction membre range dans un membre de la classe une lambda écrite
      `[=] { return valeur_ * 2; }`. L'auteur dit : « tout est copié, c'est sûr ». Que réponds-tu ?
    choices:
      - {text: "Que `valeur_` est lue à travers `this` : c'est le pointeur qui est copié, pas l'objet", correct: true}
      - {text: "Que `[=]` copie bien `valeur_`, et que la lambda est donc sûre dans tous les cas", correct: false}
      - {text: "Que `[=]` ne compile pas dans une fonction membre, et qu'il faut `[&]`", correct: false}
      - {text: "Que `[=]` copie l'objet entier à chaque appel, ce qui est trop lent", correct: false}
    answer: |-
      Un membre n'est pas une variable locale : la lambda y accède par `this`. Si elle est appelée après la
      destruction de l'objet, le comportement est indéfini. C++20 a d'ailleurs déprécié la capture implicite de
      `this` par `[=]` : on écrit `[this]`, ou `[*this]` pour une vraie copie.
  - key: situation-algorithme
    format: scenario
    question: |-
      Tu passes une lambda à `std::sort`, qui a besoin de trois variables locales. Un collègue craint que `[&]` soit
      dangereux. Que lui réponds-tu ?
    choices:
      - {text: "Qu'ici c'est sûr : la lambda est appelée puis détruite avant la fin de la fonction", correct: true}
      - {text: "Que `[&]` est toujours dangereux, et qu'il faut tout capturer par copie", correct: false}
      - {text: "Que `std::sort` refuse les lambdas qui capturent quoi que ce soit", correct: false}
      - {text: "Que `[&]` copie les trois variables, donc qu'il n'y a pas de risque", correct: false}
    answer: |-
      Le danger d'une capture par référence est une lambda qui survit aux variables. Un algorithme appelle la lambda
      pendant son exécution, puis rend la main : les variables sont toujours vivantes. `[&]` est alors le plus
      simple, et ne copie rien.
  - key: situation-thread
    format: scenario
    question: |-
      Une fonction lance un thread détaché avec une lambda qui capture `[&]` un vecteur local, puis se termine. Le
      thread plante de temps en temps. Pourquoi ?
    choices:
      - {text: "Le thread continue après la fin de la fonction, quand le vecteur est détruit", correct: true}
      - {text: "Un thread ne peut pas lire un vecteur, même vivant", correct: false}
      - {text: "La capture `[&]` copie le vecteur, ce qui épuise la mémoire", correct: false}
      - {text: "La lambda est appelée deux fois, une par thread", correct: false}
    answer: |-
      Le thread détaché vit sa vie : il se sert du vecteur après le retour de la fonction, donc après sa
      destruction. On capture par valeur, ou par déplacement (`[v = std::move(v)]`), pour que le thread possède ses
      données.
