notion: lambdas-bases
lesson: |-
  Une **lambda** est une fonction sans nom, écrite à l'endroit où l'on s'en sert. Elle sert surtout à dire à un
  algorithme **quoi faire** : comment comparer, quoi garder, quoi compter.

  ```cpp
  auto carre = [](int x) { return x * x; };
  std::println("{}", carre(5));   // 25
  ```

  **La syntaxe.**

  ```
  [captures](paramètres) -> type_de_retour { corps }
  ```

  - `[]` : les **captures**, c'est-à-dire les variables du contexte que la lambda utilise. Des crochets vides :
    elle n'en utilise aucune.
  - `(paramètres)` : comme pour une fonction.
  - `-> type_de_retour` : **facultatif**. Sans lui, le type est déduit des `return`.
  - `{ corps }` : le code.

  **Le type de retour déduit.** Tous les `return` doivent donner le **même type**. Sinon, on l'écrit :

  ```cpp
  auto moitie = [](int x) -> double { return x / 2.0; };
  ```

  **Le type d'une lambda.** Chaque lambda a un type **unique**, que seul le compilateur connaît : on la range dans
  une variable `auto`. Derrière, le compilateur fabrique une petite classe munie d'un `operator()` ; la lambda en
  est un objet.

  **La passer à un algorithme.** C'est son usage principal :

  ```cpp
  std::vector<int> v{3, 8, 1, 6};
  auto nombre = std::count_if(v.begin(), v.end(), [](int x) { return x > 4; });   // 2
  std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });              // 8 6 3 1
  ```

  Une lambda qui renvoie un booléen s'appelle un **prédicat**.

  **L'appeler tout de suite.** On peut définir une lambda et l'appeler dans la même expression. C'est utile pour
  initialiser une constante par un calcul en plusieurs étapes :

  ```cpp
  const int seuil = [] { return 40 + 2; }();
  ```

  Sans paramètre, les parenthèses sont facultatives : `[] { ... }`.

  **Lambda ou fonction ?** Une lambda convient à un petit morceau de code utilisé à un seul endroit. Dès qu'elle
  grossit, ou qu'on s'en sert ailleurs, une fonction nommée se lit mieux.

  **En entretien** : « Une lambda est un objet fonction anonyme : le compilateur en fait une classe avec un
  `operator()`. Je m'en sers pour passer un prédicat ou une comparaison à un algorithme, sans écrire une fonction
  à part. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une lambda ?"
    choices:
      - {text: "Une fonction sans nom, écrite à l'endroit où l'on s'en sert", correct: true}
      - {text: "Une fonction dont le corps est remplacé à chaque appel", correct: false}
      - {text: "Une variable dont la valeur est calculée à la compilation", correct: false}
      - {text: "Une fonction membre que l'on redéfinit dans une classe dérivée", correct: false}
    answer: "Le compilateur en fait un objet, d'une classe qu'il génère avec un `operator()`. On l'appelle comme une fonction."
  - key: crochets
    format: course
    question: "À quoi servent les crochets `[]` au début d'une lambda ?"
    choices:
      - {text: "À lister les variables du contexte que la lambda capture", correct: true}
      - {text: "À donner le nombre de paramètres que la lambda attend", correct: false}
      - {text: "À indiquer que la lambda renvoie un tableau", correct: false}
      - {text: "À donner l'indice de la lambda dans un vecteur", correct: false}
    answer: "Des crochets vides : la lambda n'utilise aucune variable locale de la fonction qui l'entoure. Ils introduisent toujours une lambda."
  - key: type-de-retour
    format: course
    question: "Comment est déterminé le type de retour d'une lambda qui ne l'écrit pas ?"
    choices:
      - {text: "Il est déduit de ses `return`, qui doivent tous donner le même type", correct: true}
      - {text: "Il vaut toujours `int`, comme pour la fonction `main`", correct: false}
      - {text: "Il vaut toujours `void`, quel que soit le corps", correct: false}
      - {text: "Il est le type de son premier paramètre", correct: false}
    answer: "Sans `return`, c'est `void`. Si deux `return` donnent des types différents, la compilation échoue : on écrit alors `-> type`."
  - key: type-de-la-lambda
    format: course
    question: "Pourquoi range-t-on une lambda dans une variable `auto` ?"
    choices:
      - {text: "Son type est unique, généré par le compilateur, et n'a pas de nom", correct: true}
      - {text: "`auto` rend la lambda plus rapide à l'exécution", correct: false}
      - {text: "`auto` permet à la lambda de changer de type plus tard", correct: false}
      - {text: "Une lambda n'a pas de type avant d'être appelée", correct: false}
    answer: "Chaque lambda a sa propre classe, sans nom. Deux lambdas au texte identique ont deux types différents."
  - key: vf-type-retour-obligatoire
    format: true-false
    question: "Une lambda doit toujours écrire son type de retour avec `->`."
    truth: false
    answer: "Il est déduit des `return`. On ne l'écrit que pour imposer un type, ou quand la déduction échoue."
  - key: vf-meme-type
    format: true-false
    question: "Deux lambdas écrites avec exactement le même texte ont le même type."
    truth: false
    answer: Chaque lambda a un type unique. On ne peut pas affecter l'une à une variable qui contient l'autre.
  - key: vf-parentheses
    format: true-false
    question: "Une lambda sans paramètre peut s'écrire sans parenthèses : `[] { return 1; }`."
    truth: true
    answer: La liste de paramètres est facultative quand elle est vide.
  - key: vf-objet
    format: true-false
    question: "Une lambda est un objet, que le compilateur munit d'un `operator()`."
    truth: true
    answer: C'est ce qui permet de la ranger dans une variable, de la copier, et de la passer à un algorithme.
  - key: qcm-ecrire
    format: multiple-choice
    question: "Quelle lambda prend un entier et renvoie son double ?"
    choices:
      - {text: "`[](int x) { return x * 2; }`", correct: true}
      - {text: "`(int x) [] { return x * 2; }`", correct: false}
      - {text: "`[int x] { return x * 2; }`", correct: false}
      - {text: "`lambda(int x) { return x * 2; }`", correct: false}
    answer: "Dans l'ordre : les captures entre crochets, les paramètres entre parenthèses, le corps entre accolades."
  - key: qcm-predicat
    format: multiple-choice
    question: "Qu'appelle-t-on un prédicat ?"
    choices:
      - {text: "Une fonction qui renvoie un booléen", correct: true}
      - {text: "Une fonction qui ne renvoie rien", correct: false}
      - {text: "Une fonction qui modifie son argument", correct: false}
      - {text: "Une fonction qui s'appelle elle-même", correct: false}
    answer: "Les algorithmes comme `std::count_if` ou `std::find_if` attendent un prédicat : il répond « oui » ou « non » pour chaque élément."
  - key: qcm-type-retour
    format: multiple-choice
    question: "Quelle écriture impose `double` comme type de retour ?"
    choices:
      - {text: "`[](int x) -> double { return x; }`", correct: true}
      - {text: "`[](int x) : double { return x; }`", correct: false}
      - {text: "`double [](int x) { return x; }`", correct: false}
      - {text: "`[double](int x) { return x; }`", correct: false}
    answer: "Le type de retour s'écrit après les paramètres, avec une flèche."
  - key: qcm-appel-immediat
    format: multiple-choice
    question: "Que fait `const int n = [] { return 6 * 7; }();` ?"
    choices:
      - {text: "Il définit la lambda et l'appelle aussitôt : `n` vaut 42", correct: true}
      - {text: "Il range la lambda dans `n`, pour l'appeler plus tard", correct: false}
      - {text: "Il ne compile pas : une lambda ne s'appelle pas sans nom", correct: false}
      - {text: "Il définit une lambda qui renvoie une autre lambda", correct: false}
    answer: "Les parenthèses finales appellent la lambda. C'est une façon d'initialiser une constante par un calcul."
  - key: trous-crochets
    format: fill-in
    question: |-
      Complète pour écrire une lambda qui ne capture rien :
      ```cpp
      auto carre = ___(int x) { return x * x; };
      ```
    blanks:
      - ["[]"]
    answer: "Des crochets vides introduisent une lambda sans capture."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour ranger la lambda dans une variable :
      ```cpp
      ___ est_pair = [](int x) { return x % 2 == 0; };
      ```
    blanks:
      - [auto]
    answer: "Le type d'une lambda n'a pas de nom : seul `auto` permet de la déclarer."
  - key: trous-fleche
    format: fill-in
    question: |-
      Complète pour imposer le type de retour :
      ```cpp
      auto moitie = [](int x) ___ double { return x / 2.0; };
      ```
    blanks:
      - ["->"]
    answer: "Le type de retour suit les paramètres, après une flèche `->`."
  - key: trous-return
    format: fill-in
    question: |-
      Complète le prédicat qui garde les nombres supérieurs à 10 :
      ```cpp
      auto grand = [](int x) { ___ x > 10; };
      ```
    blanks:
      - [return]
    answer: "Sans `return`, la lambda renverrait `void`, et ne pourrait pas servir de prédicat."
  - key: code-appel
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto somme = [](int a, int b) { return a + b; };
          std::println("{} {}", somme(2, 3), somme(somme(1, 1), 10));
      }
      ```
    choices:
      - {text: "`5 12`", correct: true}
      - {text: "`5 11`", correct: false}
      - {text: "`6 12`", correct: false}
      - {text: "`5 20`", correct: false}
    answer: "`5 12` : une lambda s'appelle comme une fonction. `somme(1, 1)` vaut 2, puis 2 + 10 = 12."
    check:
      output: "5 12"
  - key: code-count-if
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{3, 8, 1, 6, 4};
          auto n = std::count_if(v.begin(), v.end(), [](int x) { return x > 3; });
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`18`", correct: false}
    answer: "`3` : `std::count_if` appelle la lambda sur chaque élément, et compte ceux pour lesquels elle renvoie `true` : 8, 6 et 4."
    check:
      output: "3"
  - key: code-type-retour
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto a = [](int x) { return x / 2; };
          auto b = [](int x) -> double { return x / 2.0; };
          std::println("{} {}", a(7), b(7));
      }
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3.5 3.5`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`4 3.5`", correct: false}
    answer: "`3 3.5` : `a` renvoie un `int`, déduit de la division entière. `b` divise par `2.0`, et renvoie un `double`."
    check:
      output: "3 3.5"
  - key: code-appel-immediat
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const int n = [] {
              int total = 0;
              for (int i = 1; i <= 4; ++i) {
                  total += i;
              }
              return total;
          }();
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`6`", correct: false}
    answer: "`10` : la lambda est appelée aussitôt, par les parenthèses finales. Elle renvoie 1 + 2 + 3 + 4."
    check:
      output: "10"
  - key: bug-return-oublie
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel de `std::count_if` : le prédicat ne renvoie rien. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4};
          auto pairs = std::count_if(v.begin(), v.end(), [](int x) { x % 2 == 0; });
          std::println("{}", pairs);
      }
      ```
    choices:
      - {text: "Écrire `{ return x % 2 == 0; }` dans la lambda", correct: true}
      - {text: "Écrire `[](int x) -> void` au début de la lambda", correct: false}
      - {text: "Écrire `[x](int x)` au début de la lambda", correct: false}
      - {text: "Écrire `std::count` à la place de `std::count_if`", correct: false}
    answer: |-
      ```cpp
      [](int x) { return x % 2 == 0; }
      ```
      Sans `return`, l'expression est calculée puis jetée, et la lambda renvoie `void`. Un prédicat doit renvoyer un
      booléen.
  - key: bug-types-de-retour
    format: bug-fix
    question: |-
      Le compilateur répond « inconsistent types 'int' and 'double' deduced for lambda return type ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto borne = [](double x) {
              if (x < 0) {
                  return 0;
              }
              return x;
          };
          std::println("{}", borne(2.5));
      }
      ```
    choices:
      - {text: "Écrire `[](double x) -> double {`", correct: true}
      - {text: "Écrire `[](int x) {`, sans rien changer d'autre", correct: false}
      - {text: "Écrire `[x](double x) {`", correct: false}
      - {text: "Écrire `return x;` avant le `if`", correct: false}
    answer: |-
      ```cpp
      auto borne = [](double x) -> double {
      ```
      `return 0;` donne un `int`, `return x;` un `double` : la déduction refuse de choisir. Avec le type écrit, le 0
      est converti. Écrire `return 0.0;` conviendrait aussi.
  - key: bug-lambda-non-appelee
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser `seuil` : on lui donne une lambda, pas un entier. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          const int seuil = [] { return 40 + 2; };
          std::println("{}", seuil);
      }
      ```
    choices:
      - {text: "Ajouter `()` après l'accolade fermante, pour appeler la lambda", correct: true}
      - {text: "Ajouter `-> int` après les crochets, pour imposer le type", correct: false}
      - {text: "Retirer `const` de la déclaration de `seuil`", correct: false}
      - {text: "Remplacer les crochets `[]` par `[=]`", correct: false}
    answer: |-
      ```cpp
      const int seuil = [] { return 40 + 2; }();
      ```
      Sans les parenthèses finales, l'expression est la lambda elle-même. Il faut l'appeler pour obtenir sa valeur.
  - key: bug-comparaison-inversee
    format: bug-fix
    question: |-
      Ce programme devrait trier du plus grand au plus petit et afficher `9 5 1`. Il affiche `1 5 9`. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 1, 9};
          std::sort(v.begin(), v.end(), [](int a, int b) { return a < b; });
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "Écrire `return a > b;` dans la lambda", correct: true}
      - {text: "Écrire `return a >= b;` dans la lambda", correct: false}
      - {text: "Écrire `return a - b;` dans la lambda", correct: false}
      - {text: "Écrire `return !a < b;` dans la lambda", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });
      ```
      La lambda dit si `a` doit passer **avant** `b`. Pour un ordre décroissant : quand `a` est plus grand. `>=` est
      interdit : une comparaison de tri doit renvoyer `false` pour deux éléments égaux.
