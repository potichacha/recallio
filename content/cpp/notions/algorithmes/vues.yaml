notion: vues
lesson: |-
  Une **vue** (C++20, en-tête `<ranges>`) présente une suite d'éléments **sans les posséder ni les copier**. Elle
  décrit une transformation, qui ne s'exécute que lorsqu'on la **parcourt**.

  ```cpp
  #include <ranges>

  std::vector<int> v{1, 2, 3, 4, 5, 6};

  auto pairs = v | std::views::filter([](int x) { return x % 2 == 0; });
  for (int x : pairs) {
      std::print("{} ", x);       // 2 4 6
  }
  ```

  **L'opérateur `|`.** Il enchaîne les vues, de gauche à droite, comme un tube du shell :

  ```cpp
  auto resultat = v
      | std::views::filter([](int x) { return x % 2 == 0; })     // 2 4 6
      | std::views::transform([](int x) { return x * x; })       // 4 16 36
      | std::views::take(2);                                      // 4 16
  ```

  **Les vues courantes.**

  | Vue | Ce qu'elle présente |
  |---|---|
  | `std::views::filter(pred)` | les éléments qui vérifient le prédicat |
  | `std::views::transform(fn)` | `fn` appliquée à chaque élément |
  | `std::views::take(n)` | les `n` premiers |
  | `std::views::drop(n)` | tout sauf les `n` premiers |
  | `std::views::reverse` | les éléments à l'envers |
  | `std::views::keys`, `std::views::values` | les clés, ou les valeurs, d'une map |
  | `std::views::iota(a, b)` | les entiers de `a` compris à `b` exclu |

  **L'évaluation paresseuse.** Construire une vue ne calcule **rien** : ni parcours, ni allocation. Chaque élément
  est produit **à la demande**, pendant la boucle. Trois conséquences :

  - `take(2)` arrête le travail après deux éléments : le reste n'est jamais filtré ni transformé ;
  - `std::views::iota(1)`, sans borne, est une suite **infinie**, utilisable tant qu'on la limite ;
  - une vue **reflète** le conteneur : si l'on modifie un élément avant le parcours, la vue voit la nouvelle valeur.

  **Une vue ne possède rien.** Elle garde une référence vers le conteneur. Si celui-ci est détruit avant elle, la
  vue est **pendante**. On ne renvoie donc pas d'une fonction une vue sur un conteneur local.

  **Obtenir un conteneur.** Pour garder le résultat, on le **matérialise** :

  ```cpp
  auto carres = v | std::views::transform([](int x) { return x * x; })
                  | std::ranges::to<std::vector>();           // C++23
  ```

  En C++20 : `std::vector<int> carres(vue.begin(), vue.end());`, quand la vue le permet.

  **Avec les algorithmes.** Une vue est un range : `std::ranges::count_if(vue, ...)`, `std::ranges::sort` sur une
  vue de `take`, la boucle sur un intervalle.

  **À savoir.** Une vue `filter` ne se parcourt pas quand elle est `const`. Et si une lambda de `transform` est
  coûteuse, placée avant un `filter`, elle peut être appelée deux fois par élément gardé.

  **En entretien** : « Une vue est un range paresseux, qui ne possède pas ses éléments : `filter`, `transform`,
  `take`, enchaînés par `|`. Rien n'est calculé avant le parcours, et rien n'est copié. Pour un conteneur, je
  termine par `std::ranges::to`. Et je ne laisse pas une vue survivre au conteneur qu'elle regarde. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une vue, dans la bibliothèque de ranges ?"
    choices:
      - {text: "Un range qui présente des éléments sans les posséder, et les calcule à la demande", correct: true}
      - {text: "Un conteneur qui garde une copie filtrée des éléments d'un autre", correct: false}
      - {text: "Un itérateur qui parcourt un conteneur dans les deux sens", correct: false}
      - {text: "Un algorithme qui modifie le conteneur en place", correct: false}
    answer: "Une vue ne copie rien : elle décrit ce qu'il faudra faire à chaque élément, au moment où on le lira."
  - key: paresse
    format: course
    question: "Quand le prédicat de `v | std::views::filter(pred)` est-il appelé ?"
    choices:
      - {text: "Pendant le parcours de la vue, élément par élément", correct: true}
      - {text: "À la construction de la vue, sur tous les éléments", correct: false}
      - {text: "À la compilation, pour les éléments connus", correct: false}
      - {text: "À la destruction de la vue", correct: false}
    answer: "C'est l'évaluation paresseuse. Construire la vue ne coûte rien ; si on ne la parcourt pas, le prédicat n'est jamais appelé."
  - key: pipe
    format: course
    question: "Que fait l'opérateur `|` entre un conteneur et des vues ?"
    choices:
      - {text: "Il enchaîne les vues : chacune s'applique au résultat de la précédente", correct: true}
      - {text: "Il calcule le « ou » bit à bit des éléments du conteneur", correct: false}
      - {text: "Il concatène le conteneur et le résultat de chaque vue", correct: false}
      - {text: "Il applique les vues de droite à gauche", correct: false}
    answer: "`v | filter(...) | transform(...) | take(2)` se lit de gauche à droite, comme un tube du shell."
  - key: possession
    format: course
    question: "Pourquoi ne renvoie-t-on pas d'une fonction une vue sur un vecteur local ?"
    choices:
      - {text: "La vue ne possède pas les éléments : le vecteur détruit, elle est pendante", correct: true}
      - {text: "Une vue ne peut être ni copiée ni déplacée hors de sa fonction", correct: false}
      - {text: "Une vue ne peut être parcourue qu'une seule fois, dans sa fonction", correct: false}
      - {text: "Le compilateur interdit de renvoyer une vue par valeur", correct: false}
    answer: "Elle garde une référence vers le vecteur. On renvoie plutôt un conteneur, matérialisé avec `std::ranges::to`."
  - key: vf-copie
    format: true-false
    question: "`v | std::views::filter(pred)` copie dans un nouveau vecteur les éléments qui vérifient le prédicat."
    truth: false
    answer: "Une vue ne copie rien. Elle parcourt `v` en sautant les éléments refusés."
  - key: vf-take-arrete
    format: true-false
    question: "Après `std::views::take(2)`, les éléments au-delà du deuxième ne sont pas traités par les vues précédentes."
    truth: true
    answer: "Les éléments sont produits à la demande : après deux résultats, le parcours s'arrête."
  - key: vf-en-tete
    format: true-false
    question: "Les vues sont déclarées dans l'en-tête `<ranges>`."
    truth: true
    answer: "`std::views` est un alias de `std::ranges::views`."
  - key: vf-infini
    format: true-false
    question: "`std::views::iota(1)` représente une suite infinie d'entiers."
    truth: true
    answer: "Sans borne supérieure, elle ne s'arrête pas. On la limite avec `take` ; rien n'est calculé d'avance."
  - key: qcm-premiers
    format: multiple-choice
    question: "Quelle vue garde les trois premiers éléments ?"
    choices:
      - {text: "`std::views::take(3)`", correct: true}
      - {text: "`std::views::drop(3)`", correct: false}
      - {text: "`std::views::filter(3)`", correct: false}
      - {text: "`std::views::first(3)`", correct: false}
    answer: "`take(n)` garde les `n` premiers ; `drop(n)` les saute."
  - key: qcm-materialiser
    format: multiple-choice
    question: "Comment obtiens-tu un `std::vector` à partir d'une vue, en C++23 ?"
    choices:
      - {text: "En terminant par `| std::ranges::to<std::vector>()`", correct: true}
      - {text: "En terminant par `| std::views::vector`", correct: false}
      - {text: "En appelant `vue.copy()`", correct: false}
      - {text: "En appelant `std::vector(vue)`", correct: false}
    answer: "`std::ranges::to` parcourt la vue et construit le conteneur. C'est le moment où le calcul a lieu."
  - key: qcm-cles
    format: multiple-choice
    question: "Quelle vue présente les clés d'une `std::map` ?"
    choices:
      - {text: "`std::views::keys`", correct: true}
      - {text: "`std::views::first`", correct: false}
      - {text: "`std::views::values`", correct: false}
      - {text: "`std::views::index`", correct: false}
    answer: "`m | std::views::keys` donne les clés, `m | std::views::values` les valeurs."
  - key: qcm-entiers
    format: multiple-choice
    question: "Quelle vue produit les entiers 1, 2, 3, 4 ?"
    choices:
      - {text: "`std::views::iota(1, 5)`", correct: true}
      - {text: "`std::views::iota(1, 4)`", correct: false}
      - {text: "`std::views::range(1, 4)`", correct: false}
      - {text: "`std::views::take(4)`", correct: false}
    answer: "La borne supérieure est exclue : `iota(1, 5)` va de 1 à 4."
  - key: trous-filter
    format: fill-in
    question: |-
      Complète pour ne garder que les nombres pairs :
      ```cpp
      auto pairs = v | std::views::___([](int x) { return x % 2 == 0; });
      ```
    blanks:
      - [filter]
    answer: "`std::views::filter` garde les éléments qui vérifient le prédicat."
  - key: trous-transform
    format: fill-in
    question: |-
      Complète pour présenter le carré de chaque élément :
      ```cpp
      auto carres = v | std::views::___([](int x) { return x * x; });
      ```
    blanks:
      - [transform]
    answer: "`std::views::transform` applique la fonction à chaque élément, à la demande."
  - key: trous-pipe
    format: fill-in
    question: |-
      Complète pour enchaîner les deux vues :
      ```cpp
      auto debut = v | std::views::reverse ___ std::views::take(2);
      ```
    blanks:
      - ["|"]
    answer: "L'opérateur `|` enchaîne les vues, de gauche à droite."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `std::views::filter` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [ranges]
    answer: "Les vues sont dans `<ranges>`."
  - key: code-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5, 6};
          for (int x : v | std::views::filter([](int n) { return n % 2 == 0; })
                         | std::views::transform([](int n) { return n * n; })) {
              std::print("{} ", x);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`4 16 36 fin`", correct: true}
      - {text: "`2 4 6 fin`", correct: false}
      - {text: "`1 4 9 16 25 36 fin`", correct: false}
      - {text: "`4 36 fin`", correct: false}
    answer: "`4 16 36 fin` : le filtre garde 2, 4, 6 ; la transformation les élève au carré."
    check:
      output: "4 16 36 fin"
  - key: code-paresse
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5};
          int appels = 0;
          auto vue = v | std::views::transform([&appels](int n) {
              ++appels;
              return n * 10;
          }) | std::views::take(2);
          const int avant = appels;
          int somme = 0;
          for (int x : vue) {
              somme += x;
          }
          std::println("{} {} {}", avant, appels, somme);
      }
      ```
    choices:
      - {text: "`0 2 30`", correct: true}
      - {text: "`5 5 30`", correct: false}
      - {text: "`0 5 30`", correct: false}
      - {text: "`2 2 30`", correct: false}
    answer: "`0 2 30` : construire la vue n'appelle pas la lambda. Le parcours ne demande que deux éléments : elle est appelée deux fois, pour 10 et 20."
    check:
      output: "0 2 30"
  - key: code-reverse-drop
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5};
          for (int x : v | std::views::reverse | std::views::drop(1) | std::views::take(3)) {
              std::print("{} ", x);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`4 3 2 fin`", correct: true}
      - {text: "`5 4 3 fin`", correct: false}
      - {text: "`2 3 4 fin`", correct: false}
      - {text: "`3 2 1 fin`", correct: false}
    answer: "`4 3 2 fin` : à l'envers, la suite vaut 5 4 3 2 1. `drop(1)` saute le 5, `take(3)` garde les trois suivants."
    check:
      output: "4 3 2 fin"
  - key: code-iota
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>

      int main() {
          int somme = 0;
          for (int x : std::views::iota(1) | std::views::filter([](int n) { return n % 3 == 0; })
                                         | std::views::take(3)) {
              somme += x;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`18`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "Rien : la boucle ne s'arrête jamais", correct: false}
    answer: "`18` : `iota(1)` est infinie, mais `take(3)` arrête le parcours après les trois premiers multiples de 3 : 3 + 6 + 9."
    check:
      output: "18"
  - key: bug-vue-pendante
    format: bug-fix
    question: |-
      Cette fonction renvoie une vue sur un vecteur local. Le programme devrait afficher `4 16` ; son comportement
      est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      auto carres_pairs() {
          std::vector<int> v{1, 2, 3, 4};
          return v | std::views::filter([](int n) { return n % 2 == 0; })
                   | std::views::transform([](int n) { return n * n; });
      }

      int main() {
          for (int x : carres_pairs()) {
              std::print("{} ", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Terminer par `| std::ranges::to<std::vector>()`, et renvoyer ce vecteur", correct: true}
      - {text: "Terminer par `| std::views::take(2)`, pour limiter la vue", correct: false}
      - {text: "Déclarer le vecteur local `v` avec le mot-clé `const`", correct: false}
      - {text: "Écrire `return std::move(v) | ...` sans rien changer d'autre", correct: false}
    answer: |-
      ```cpp
      return v | std::views::filter([](int n) { return n % 2 == 0; })
               | std::views::transform([](int n) { return n * n; })
               | std::ranges::to<std::vector>();
      ```
      Une vue ne possède pas ses éléments : `v` est détruit au retour, et la vue le regarde encore. En la
      matérialisant, on renvoie un vecteur qui possède le résultat.
  - key: bug-affecter-vecteur
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser le vecteur à partir de la vue : il n'y a pas de conversion. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          const std::vector<int> doubles = v | std::views::transform([](int n) { return n * 2; });
          std::println("{}", doubles.back());
      }
      ```
    choices:
      - {text: "Ajouter `| std::ranges::to<std::vector>()` à la fin de la chaîne", correct: true}
      - {text: "Ajouter `| std::views::take(3)` à la fin de la chaîne", correct: false}
      - {text: "Déclarer `doubles` avec le type `std::vector<auto>`", correct: false}
      - {text: "Ajouter `.copy()` à la fin de la chaîne", correct: false}
    answer: |-
      ```cpp
      const std::vector<int> doubles = v | std::views::transform([](int n) { return n * 2; })
                                         | std::ranges::to<std::vector>();
      ```
      Une vue n'est pas un conteneur, et ne se convertit pas toute seule. `std::ranges::to` (C++23) la parcourt et
      construit le vecteur.
  - key: bug-ordre-take
    format: bug-fix
    question: |-
      Ce programme devrait afficher les deux premiers nombres pairs, `2 4`. Il affiche seulement `2`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5, 6};
          for (int x : v | std::views::take(2) | std::views::filter([](int n) { return n % 2 == 0; })) {
              std::print("{} ", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Placer `filter` avant `take(2)` dans la chaîne", correct: true}
      - {text: "Remplacer `take(2)` par `drop(2)`", correct: false}
      - {text: "Remplacer `take(2)` par `take(4)`, sans rien déplacer", correct: false}
      - {text: "Ajouter `std::views::reverse` à la fin de la chaîne", correct: false}
    answer: |-
      ```cpp
      for (int x : v | std::views::filter([](int n) { return n % 2 == 0; }) | std::views::take(2)) {
      ```
      Les vues s'appliquent de gauche à droite. Ici, `take(2)` garde 1 et 2, puis le filtre n'y trouve qu'un pair.
      Il faut filtrer d'abord, puis prendre les deux premiers.
  - key: bug-filter-const
    format: bug-fix
    question: |-
      Le compilateur refuse la boucle : une vue `filter` déclarée `const` ne se parcourt pas. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4};
          const auto pairs = v | std::views::filter([](int n) { return n % 2 == 0; });
          for (int x : pairs) {
              std::print("{} ", x);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Déclarer la vue sans `const` : `auto pairs = ...`", correct: true}
      - {text: "Déclarer le vecteur `v` sans `const`", correct: false}
      - {text: "Parcourir avec `for (const int& x : pairs)`", correct: false}
      - {text: "Remplacer `filter` par `std::views::take(2)`", correct: false}
    answer: |-
      ```cpp
      auto pairs = v | std::views::filter([](int n) { return n % 2 == 0; });
      ```
      Une vue `filter` mémorise la position de son premier élément au premier appel de `begin()` : elle doit pouvoir
      se modifier, donc ne pas être `const`. Le vecteur regardé, lui, peut rester constant.
