notion: ranges-to
lesson: |-
  Une vue est paresseuse et ne possède rien. Pour **garder** son résultat, il faut le ranger dans un conteneur :
  le **matérialiser**. C++23 fournit pour cela **`std::ranges::to`** (en-tête `<ranges>`).

  ```cpp
  std::vector<int> v{1, 2, 3, 4, 5, 6};
  auto pairs = v | std::views::filter([](int x) { return x % 2 == 0; })
                 | std::ranges::to<std::vector>();          // std::vector<int> : 2 4 6
  ```

  **Deux écritures.**

  ```cpp
  auto a = vue | std::ranges::to<std::vector>();    // en fin de chaîne
  auto b = std::ranges::to<std::vector>(vue);       // en appel de fonction
  ```

  **Le type des éléments est déduit.** `std::ranges::to<std::vector>()` suffit : le compilateur en fait un
  `std::vector<int>` d'après la vue. On peut l'imposer pour convertir :
  `std::ranges::to<std::vector<long>>()`.

  **N'importe quel conteneur.**

  | Écriture | Résultat |
  |---|---|
  | `\| std::ranges::to<std::vector>()` | un vecteur |
  | `\| std::ranges::to<std::set>()` | un ensemble : trié, sans doublon |
  | `\| std::ranges::to<std::string>()` | une chaîne, à partir de caractères |
  | `\| std::ranges::to<std::map>()` | une map, à partir de paires |
  | `\| std::ranges::to<std::deque>()` | une deque |

  **Les parenthèses sont obligatoires.** `std::ranges::to<std::vector>` sans `()` n'est pas un adaptateur : en fin
  de chaîne, cela ne compile pas.

  **Quand matérialiser.**

  - Pour **renvoyer** un résultat d'une fonction : une vue sur une variable locale serait pendante.
  - Pour **parcourir plusieurs fois** sans recalculer.
  - Pour **modifier la source** ensuite, sans affecter le résultat.
  - Pour appeler un algorithme qu'une vue ne permet pas : **trier**, par exemple, le résultat d'un `filter`.

  Et quand **ne pas** le faire : si le résultat n'est parcouru qu'une fois, la vue suffit, sans allocation.

  **Avant C++23.** On construisait le conteneur à la main :

  ```cpp
  auto vue = v | std::views::filter(est_pair);
  std::vector<int> pairs(vue.begin(), vue.end());
  ```

  ou avec `std::ranges::copy(vue, std::back_inserter(pairs))`. `std::ranges::to` remplace les deux, et réserve la
  place quand la taille de la vue est connue.

  **Les nouveaux constructeurs.** C++23 a aussi ajouté aux conteneurs des fonctions qui prennent un intervalle :
  le constructeur avec `std::from_range`, `assign_range`, `append_range`, `insert_range`.

  ```cpp
  std::vector<int> v(std::from_range, vue);
  v.append_range(autre_vue);
  ```

  **En entretien** : « `std::ranges::to<std::vector>()`, en C++23, range le résultat d'une chaîne de vues dans un
  conteneur, dont le type des éléments est déduit. Je matérialise pour renvoyer un résultat, le parcourir
  plusieurs fois ou le trier ; sinon, la vue suffit. »
cards:
  - key: role
    format: course
    question: "À quoi sert `std::ranges::to` ?"
    choices:
      - {text: "À ranger les éléments d'une vue ou d'un intervalle dans un conteneur", correct: true}
      - {text: "À transformer un conteneur en vue paresseuse", correct: false}
      - {text: "À convertir chaque élément d'un intervalle en chaîne", correct: false}
      - {text: "À déplacer une vue d'un thread vers un autre", correct: false}
    answer: "Il matérialise : la vue est parcourue une fois, et ses éléments sont stockés. Le résultat possède ses données."
  - key: deduction
    format: course
    question: "Quel type a `v | std::views::transform(f) | std::ranges::to<std::vector>()`, si `f` renvoie un `double` ?"
    choices:
      - {text: "`std::vector<double>` : le type des éléments est déduit de la vue", correct: true}
      - {text: "`std::vector<int>` : le type des éléments est celui de `v`", correct: false}
      - {text: "`std::vector<auto>` : le type est fixé au premier parcours", correct: false}
      - {text: "Aucun : il faut écrire `std::vector<double>` en toutes lettres", correct: false}
    answer: "Il suffit de nommer le conteneur. Écrire le type complet reste possible, pour convertir les éléments."
  - key: quand
    format: course
    question: "Dans quel cas faut-il matérialiser une vue ?"
    choices:
      - {text: "Pour la renvoyer d'une fonction dont la source est une variable locale", correct: true}
      - {text: "Pour la parcourir une seule fois, juste après l'avoir construite", correct: false}
      - {text: "Pour la passer à une boucle sur un intervalle", correct: false}
      - {text: "Pour lui ajouter un adaptateur `take`", correct: false}
    answer: "Une vue renvoyée désignerait un conteneur détruit. On matérialise aussi pour parcourir plusieurs fois, ou trier. Pour un parcours unique, la vue suffit."
  - key: avant
    format: course
    question: "Comment rangeait-on une vue dans un vecteur avant C++23 ?"
    choices:
      - {text: "En construisant le vecteur à partir de `vue.begin()` et `vue.end()`", correct: true}
      - {text: "En affectant directement la vue au vecteur : `v = vue;`", correct: false}
      - {text: "En appelant `vue.to_vector()`", correct: false}
      - {text: "En appelant `std::move(vue)` sur le vecteur", correct: false}
    answer: "`std::vector<int> r(vue.begin(), vue.end());`, ou `std::ranges::copy` vers un `std::back_inserter`. `std::ranges::to` remplace ces deux écritures."
  - key: vf-norme
    format: true-false
    question: "`std::ranges::to` est disponible depuis C++20."
    truth: false
    answer: "Il est arrivé en C++23. Les vues datent de C++20, mais sans moyen direct de les matérialiser."
  - key: vf-set
    format: true-false
    question: "`| std::ranges::to<std::set>()` donne un ensemble trié, sans doublon."
    truth: true
    answer: "Le conteneur visé garde ses propriétés : un `std::set` trie et dédoublonne."
  - key: vf-parentheses
    format: true-false
    question: "En fin de chaîne, on peut écrire `| std::ranges::to<std::vector>` sans parenthèses."
    truth: false
    answer: "Les parenthèses créent l'adaptateur. Sans elles, l'expression ne compile pas."
  - key: vf-independant
    format: true-false
    question: "Le conteneur produit par `std::ranges::to` est indépendant de la source de la vue."
    truth: true
    answer: "Les éléments sont copiés (ou déplacés) dedans. Modifier ou détruire la source ne le touche plus."
  - key: qcm-chaine
    format: multiple-choice
    question: "Quelle expression range dans une chaîne les caractères d'une vue ?"
    choices:
      - {text: "`vue | std::ranges::to<std::string>()`", correct: true}
      - {text: "`std::to_string(vue)`", correct: false}
      - {text: "`std::string{vue}`", correct: false}
      - {text: "`vue.str()`", correct: false}
    answer: "`std::string` est un conteneur de caractères : `std::ranges::to` le remplit comme un vecteur."
  - key: qcm-convertir
    format: multiple-choice
    question: "Comment obtiens-tu un `std::vector<long>` à partir d'un `std::vector<int>` nommé `v` ?"
    choices:
      - {text: "`std::ranges::to<std::vector<long>>(v)`", correct: true}
      - {text: "`std::ranges::to<long>(v)`", correct: false}
      - {text: "`std::ranges::to<std::vector>(long, v)`", correct: false}
      - {text: "`static_cast<std::vector<long>>(v)`", correct: false}
    answer: "En écrivant le type complet du conteneur, chaque élément est converti."
  - key: qcm-append
    format: multiple-choice
    question: "Quelle fonction de C++23 ajoute tous les éléments d'une vue à la fin d'un vecteur existant ?"
    choices:
      - {text: "`append_range`", correct: true}
      - {text: "`push_back`", correct: false}
      - {text: "`emplace_back`", correct: false}
      - {text: "`assign`", correct: false}
    answer: "`v.append_range(vue)` ajoute tout l'intervalle. `push_back` n'ajoute qu'un élément à la fois."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::ranges::to` ?"
    choices:
      - {text: "`<ranges>`", correct: true}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<iterator>`", correct: false}
      - {text: "`<vector>`", correct: false}
    answer: "`<ranges>`, avec les vues."
  - key: trous-to
    format: fill-in
    question: |-
      Complète pour ranger le résultat dans un vecteur :
      ```cpp
      auto pairs = v | std::views::filter(est_pair) | std::ranges::___<std::vector>();
      ```
    blanks:
      - [to]
    answer: "`std::ranges::to<std::vector>()` matérialise la vue."
  - key: trous-conteneur
    format: fill-in
    question: |-
      Complète pour obtenir les valeurs sans doublon, triées :
      ```cpp
      auto uniques = v | std::ranges::to<std::___>();
      ```
    blanks:
      - [set]
    answer: "`std::set` trie ses éléments et ignore les doublons."
  - key: trous-parentheses
    format: fill-in
    question: |-
      Complète la fin de la chaîne :
      ```cpp
      auto doubles = v | std::views::transform(doubler) | std::ranges::to<std::vector>___;
      ```
    blanks:
      - ["()"]
    answer: "Les parenthèses sont obligatoires : elles créent l'adaptateur."
  - key: trous-from-range
    format: fill-in
    question: |-
      Complète pour construire le vecteur directement à partir de la vue (C++23) :
      ```cpp
      std::vector<int> r(std::___, vue);
      ```
    blanks:
      - [from_range]
    answer: "`std::from_range` désigne le constructeur qui prend un intervalle."
  - key: code-filter
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5, 6};
          const auto pairs = v | std::views::filter([](int x) { return x % 2 == 0; })
                               | std::ranges::to<std::vector>();
          v.clear();
          std::println("{} {} {}", pairs.size(), pairs.front(), pairs.back());
      }
      ```
    choices:
      - {text: "`3 2 6`", correct: true}
      - {text: "`0 0 0`", correct: false}
      - {text: "`6 1 6`", correct: false}
      - {text: "`3 1 5`", correct: false}
    answer: "`3 2 6` : le vecteur `pairs` possède ses éléments. Vider la source ensuite ne le touche pas."
    check:
      output: "3 2 6"
  - key: code-set
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <set>
      #include <vector>

      int main() {
          const std::vector<int> v{5, 3, 5, 1, 3};
          const auto uniques = v | std::ranges::to<std::set>();
          std::println("{} {} {}", uniques.size(), *uniques.begin(), *uniques.rbegin());
      }
      ```
    choices:
      - {text: "`3 1 5`", correct: true}
      - {text: "`5 5 3`", correct: false}
      - {text: "`3 5 3`", correct: false}
      - {text: "`5 1 5`", correct: false}
    answer: "`3 1 5` : l'ensemble ne garde que 1, 3 et 5, triés."
    check:
      output: "3 1 5"
  - key: code-string
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <string>

      int main() {
          const std::string mot = "bonjour";
          const auto resultat = mot
              | std::views::filter([](char c) { return c != 'o'; })
              | std::views::reverse
              | std::ranges::to<std::string>();
          std::println("{} {}", resultat, resultat.size());
      }
      ```
    choices:
      - {text: "`rujnb 5`", correct: true}
      - {text: "`bnjur 5`", correct: false}
      - {text: "`ruojnob 7`", correct: false}
      - {text: "`rujnb 7`", correct: false}
    answer: "`rujnb 5` : les deux `o` sont retirés, il reste `bnjur`, puis la vue est inversée. Le résultat est une vraie `std::string`."
    check:
      output: "rujnb 5"
  - key: code-map
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <ranges>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<std::string> noms{"kiwi", "pomme"};
          const std::vector<int> stocks{5, 12};
          const auto table = std::views::zip(noms, stocks) | std::ranges::to<std::map>();
          std::println("{} {}", table.size(), table.at("pomme"));
      }
      ```
    choices:
      - {text: "`2 12`", correct: true}
      - {text: "`2 5`", correct: false}
      - {text: "`4 12`", correct: false}
      - {text: "`1 12`", correct: false}
    answer: "`2 12` : `zip` associe chaque nom à son stock. Les paires remplissent une `std::map<std::string, int>`."
    check:
      output: "2 12"
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse la dernière étape de la chaîne. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          const auto doubles = v | std::views::transform([](int x) { return x * 2; })
                                 | std::ranges::to<std::vector>;
          std::println("{}", doubles.size());
      }
      ```
    choices:
      - {text: "Écrire `std::ranges::to<std::vector>()`", correct: true}
      - {text: "Écrire `std::ranges::to<std::vector<auto>>`", correct: false}
      - {text: "Écrire `std::ranges::to(std::vector)`", correct: false}
      - {text: "Écrire `std::views::to<std::vector>`", correct: false}
    answer: |-
      ```cpp
      | std::ranges::to<std::vector>();
      ```
      `std::ranges::to<std::vector>` est un template de fonction. Ce sont les parenthèses qui en font un adaptateur
      utilisable après `|`.
  - key: bug-tri-sur-vue
    format: bug-fix
    question: |-
      Le compilateur refuse de trier la vue : un `filter` n'offre pas d'accès direct. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          std::vector<int> v{6, 1, 4, 3, 2};
          auto pairs = v | std::views::filter([](int x) { return x % 2 == 0; });
          std::ranges::sort(pairs);
          std::println("{}", *pairs.begin());
      }
      ```
    choices:
      - {text: "Matérialiser d'abord : `| std::ranges::to<std::vector>()`, puis trier le vecteur", correct: true}
      - {text: "Trier le vecteur `v` après avoir construit la vue `pairs`", correct: false}
      - {text: "Appeler `std::sort(pairs.begin(), pairs.end());` à la place", correct: false}
      - {text: "Ajouter `| std::views::reverse` à la fin de la vue", correct: false}
    answer: |-
      ```cpp
      auto pairs = v | std::views::filter([](int x) { return x % 2 == 0; }) | std::ranges::to<std::vector>();
      std::ranges::sort(pairs);
      ```
      Un tri exige un accès direct, que `filter` ne donne pas. Une fois les éléments rangés dans un vecteur, tous
      les algorithmes s'appliquent.
  - key: bug-vue-renvoyee
    format: bug-fix
    question: |-
      Cette fonction renvoie une vue sur son vecteur local : le programme a un comportement indéfini. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      auto carres() {
          std::vector<int> v{1, 2, 3};
          return v | std::views::transform([](int x) { return x * x; });
      }

      int main() {
          int somme = 0;
          for (int x : carres()) {
              somme += x;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Ajouter `| std::ranges::to<std::vector>()` avant le `return`", correct: true}
      - {text: "Ajouter `| std::views::take(3)` avant le `return`", correct: false}
      - {text: "Déclarer le type de retour `auto&`", correct: false}
      - {text: "Déclarer `v` avec `static const`, sans rien dire à l'appelant", correct: false}
    answer: |-
      ```cpp
      return v | std::views::transform([](int x) { return x * x; }) | std::ranges::to<std::vector>();
      ```
      Le vecteur `v` est détruit au retour, et la vue le désigne encore. Matérialisé, le résultat possède ses
      éléments.
  - key: bug-type-impose
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3.5`, la moitié de 7. Il affiche `3`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{7};
          const auto moities = v | std::views::transform([](int x) { return x / 2; })
                                 | std::ranges::to<std::vector<double>>();
          std::println("{}", moities[0]);
      }
      ```
    choices:
      - {text: "Diviser par `2.0` dans la lambda", correct: true}
      - {text: "Écrire `std::ranges::to<std::vector>()`", correct: false}
      - {text: "Écrire `std::ranges::to<std::vector<float>>()`", correct: false}
      - {text: "Déclarer `v` comme un `std::vector<long>`", correct: false}
    answer: |-
      ```cpp
      std::views::transform([](int x) { return x / 2.0; })
      ```
      La division entière a déjà perdu la partie décimale avant que `std::ranges::to` convertisse en `double`.
      C'est le calcul qu'il faut faire en flottant.
