notion: iterateurs-bases
lesson: |-
  Un **itérateur** désigne un élément d'un conteneur, et sait passer au suivant. C'est la généralisation du
  pointeur : il se manipule de la même façon, mais fonctionne aussi sur une liste, une map ou un ensemble.

  ```cpp
  std::vector<int> v{10, 20, 30};
  auto it = v.begin();     // désigne 10
  std::println("{}", *it); // 10 : * lit l'élément désigné
  ++it;                    // passe au suivant : 20
  ```

  **`begin()` et `end()`.** `begin()` désigne le **premier** élément. `end()` désigne **l'après-dernier** : une
  position qui suit le dernier élément, et qui ne contient rien. On ne la déréférence **jamais**.

  ```
   10   20   30
   ^              ^
  begin()        end()
  ```

  **L'intervalle semi-ouvert.** On note `[begin, end)` : le début est compris, la fin est exclue. Cette convention
  a trois avantages :

  - un conteneur **vide** se reconnaît à `begin() == end()` ;
  - le nombre d'éléments vaut `end - begin` ;
  - la boucle s'écrit toujours de la même façon.

  ```cpp
  for (auto it = v.begin(); it != v.end(); ++it) {
      std::println("{}", *it);
  }
  ```

  La boucle sur un intervalle, `for (int x : v)`, est une écriture abrégée de cette boucle.

  **Les opérations.**

  | Opération | Effet |
  |---|---|
  | `*it` | l'élément désigné |
  | `it->membre` | un membre de l'élément |
  | `++it` | passe au suivant |
  | `it == autre`, `it != autre` | compare deux positions |
  | `it + n`, `it[n]`, `it < autre` | seulement pour les conteneurs à accès direct : `vector`, `array`, `deque`, `string` |

  Sur une `std::list` ou une `std::map`, on avance pas à pas : `std::next(it, n)` et `std::advance(it, n)` le font
  pour tout itérateur, et `std::distance(a, b)` compte les pas de `a` à `b`.

  **« Pas trouvé ».** Une fonction de recherche renvoie `end()` quand elle ne trouve rien. On compare toujours son
  résultat à `end()` avant de le déréférencer.

  ```cpp
  auto it = std::find(v.begin(), v.end(), 20);
  if (it != v.end()) {
      std::println("trouvé à l'indice {}", it - v.begin());
  }
  ```

  **Pourquoi des itérateurs.** Les algorithmes de `<algorithm>` ne connaissent pas les conteneurs : ils reçoivent
  deux itérateurs. Un même `std::find` cherche ainsi dans un vecteur, une liste ou une partie de tableau.

  **En entretien** : « Un itérateur désigne un élément et sait avancer. `begin()` est le premier, `end()`
  l'après-dernier, qu'on ne déréférence jamais : l'intervalle est semi-ouvert. Ce sont eux qui relient les
  conteneurs aux algorithmes. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un itérateur ?"
    choices:
      - {text: "Un objet qui désigne un élément d'un conteneur, et sait passer au suivant", correct: true}
      - {text: "Un entier qui donne la position d'un élément depuis le début", correct: false}
      - {text: "Une copie de l'élément, que l'on peut modifier sans toucher au conteneur", correct: false}
      - {text: "Une fonction qui parcourt un conteneur du début à la fin", correct: false}
    answer: "Il se manipule comme un pointeur : `*it` lit l'élément, `++it` avance. Il fonctionne aussi sur les conteneurs qui n'ont pas d'indice."
  - key: end
    format: course
    question: "Que désigne `v.end()` ?"
    choices:
      - {text: "La position qui suit le dernier élément, qu'on ne déréférence jamais", correct: true}
      - {text: "Le dernier élément du conteneur, que l'on lit avec `*v.end()`", correct: false}
      - {text: "Un pointeur nul, qui marque la fin du conteneur", correct: false}
      - {text: "Le premier élément, quand on parcourt le conteneur à l'envers", correct: false}
    answer: "`end()` est l'après-dernier : une borne, pas un élément. Lire `*v.end()` est un comportement indéfini. Le dernier élément est `v.back()`, ou `*(v.end() - 1)`."
  - key: intervalle-semi-ouvert
    format: course
    question: "Pourquoi l'intervalle `[begin, end)` exclut-il sa fin ?"
    choices:
      - {text: "Un conteneur vide s'écrit `begin == end`, et la taille vaut `end - begin`", correct: true}
      - {text: "Le dernier élément d'un conteneur est réservé à la bibliothèque", correct: false}
      - {text: "Le compilateur ne sait pas comparer deux itérateurs égaux", correct: false}
      - {text: "Les conteneurs gardent toujours une case vide à la fin", correct: false}
    answer: "Avec une fin comprise, il faudrait un cas particulier pour le conteneur vide. La convention semi-ouverte rend toutes les boucles et tous les algorithmes uniformes."
  - key: non-trouve
    format: course
    question: "Que renvoie `std::find` quand la valeur n'est pas dans l'intervalle ?"
    choices:
      - {text: "L'itérateur de fin de l'intervalle", correct: true}
      - {text: "Un itérateur nul, égal à `nullptr`", correct: false}
      - {text: "L'itérateur du début de l'intervalle", correct: false}
      - {text: "Rien : il lève une exception", correct: false}
    answer: "On compare donc le résultat à `end()` avant de s'en servir : `if (it != v.end())`."
  - key: vf-dereferencer-end
    format: true-false
    question: "`*v.end()` donne le dernier élément du vecteur."
    truth: false
    answer: "`end()` désigne l'après-dernier. Le déréférencer est un comportement indéfini."
  - key: vf-vide
    format: true-false
    question: "Sur un conteneur vide, `begin()` et `end()` sont égaux."
    truth: true
    answer: C'est ce qui fait que la boucle habituelle ne fait aucun tour, sans cas particulier.
  - key: vf-arithmetique-liste
    format: true-false
    question: "On peut écrire `it + 3` avec un itérateur de `std::list`."
    truth: false
    answer: "Une liste n'a pas d'accès direct : son itérateur n'avance que pas à pas. `std::next(it, 3)` fait les trois pas."
  - key: vf-boucle-intervalle
    format: true-false
    question: "La boucle `for (int x : v)` s'appuie sur `v.begin()` et `v.end()`."
    truth: true
    answer: "Le compilateur la réécrit en une boucle d'itérateurs, de `begin()` à `end()`."
  - key: qcm-lire
    format: multiple-choice
    question: "`it` est un itérateur sur un `std::vector<int>`. Comment lis-tu l'élément qu'il désigne ?"
    choices:
      - {text: "`*it`", correct: true}
      - {text: "`&it`", correct: false}
      - {text: "`it.value()`", correct: false}
      - {text: "`it.get()`", correct: false}
    answer: "Comme pour un pointeur, `*` donne accès à l'élément désigné."
  - key: qcm-indice
    format: multiple-choice
    question: "`it` désigne un élément du vecteur `v`. Quelle expression donne son indice ?"
    choices:
      - {text: "`it - v.begin()`", correct: true}
      - {text: "`v.end() - it`", correct: false}
      - {text: "`*it`", correct: false}
      - {text: "`it + v.begin()`", correct: false}
    answer: "La différence de deux itérateurs d'un vecteur est le nombre d'éléments qui les sépare. `std::distance(v.begin(), it)` convient à tous les conteneurs."
  - key: qcm-avancer
    format: multiple-choice
    question: "Quelle fonction renvoie l'itérateur situé `n` positions plus loin, pour n'importe quel conteneur ?"
    choices:
      - {text: "`std::next(it, n)`", correct: true}
      - {text: "`std::move(it, n)`", correct: false}
      - {text: "`std::jump(it, n)`", correct: false}
      - {text: "`std::shift(it, n)`", correct: false}
    answer: "`std::next` renvoie un nouvel itérateur ; `std::advance(it, n)` modifie `it` en place. Sur un vecteur, ils font `it + n` ; sur une liste, `n` pas."
  - key: qcm-dernier
    format: multiple-choice
    question: "Quelle expression désigne le dernier élément d'un vecteur `v` non vide ?"
    choices:
      - {text: "`v.end() - 1`", correct: true}
      - {text: "`v.end()`", correct: false}
      - {text: "`v.end() + 1`", correct: false}
      - {text: "`v.begin() - 1`", correct: false}
    answer: "`end()` suit le dernier élément : il faut reculer d'une position. `v.begin() - 1` sort du vecteur."
  - key: trous-begin
    format: fill-in
    question: |-
      Complète pour partir du premier élément :
      ```cpp
      for (auto it = v.___(); it != v.end(); ++it) {
          std::println("{}", *it);
      }
      ```
    blanks:
      - [begin]
    answer: "`begin()` désigne le premier élément."
  - key: trous-different
    format: fill-in
    question: |-
      Complète la condition de la boucle :
      ```cpp
      for (auto it = v.begin(); it ___ v.end(); ++it) {
          std::println("{}", *it);
      }
      ```
    blanks:
      - ["!="]
    answer: "On continue tant que l'itérateur n'a pas atteint `end()`. `!=` fonctionne pour tous les conteneurs, alors que `<` n'existe que pour ceux à accès direct."
  - key: trous-dereferencer
    format: fill-in
    question: |-
      Complète pour afficher l'élément désigné :
      ```cpp
      auto it = v.begin();
      std::println("{}", ___it);
      ```
    blanks:
      - ["*"]
    answer: "`*it` lit l'élément, comme avec un pointeur."
  - key: trous-end
    format: fill-in
    question: |-
      Complète pour vérifier que la valeur a été trouvée :
      ```cpp
      auto it = std::find(v.begin(), v.end(), 7);
      if (it != v.___()) {
          std::println("trouvé");
      }
      ```
    blanks:
      - [end]
    answer: "`std::find` renvoie `end()` quand il ne trouve rien."
  - key: code-parcours
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 30};
          auto it = v.begin();
          ++it;
          std::println("{} {}", *it, *(it + 1));
      }
      ```
    choices:
      - {text: "`20 30`", correct: true}
      - {text: "`10 20`", correct: false}
      - {text: "`20 21`", correct: false}
      - {text: "`11 12`", correct: false}
    answer: "`20 30` : `++it` avance au deuxième élément. `it + 1` désigne le suivant, sans modifier `it`."
    check:
      output: "20 30"
  - key: code-distance
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{4, 5, 6, 7};
          std::println("{} {}", v.end() - v.begin(), *(v.end() - 1));
      }
      ```
    choices:
      - {text: "`4 7`", correct: true}
      - {text: "`3 7`", correct: false}
      - {text: "`4 6`", correct: false}
      - {text: "`3 6`", correct: false}
    answer: "`4 7` : `end - begin` est le nombre d'éléments. `end() - 1` désigne le dernier."
    check:
      output: "4 7"
  - key: code-modifier
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto it = v.begin(); it != v.end(); ++it) {
              *it *= 2;
          }
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "`2 4 6`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`2 2 3`", correct: false}
      - {text: "`1 4 9`", correct: false}
    answer: "`2 4 6` : `*it` donne accès à l'élément lui-même, pas à une copie. Chaque élément est doublé en place."
    check:
      output: "2 4 6"
  - key: code-vide
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          int tours = 0;
          for (auto it = v.begin(); it != v.end(); ++it) {
              ++tours;
          }
          std::println("{} {}", tours, v.begin() == v.end());
      }
      ```
    choices:
      - {text: "`0 true`", correct: true}
      - {text: "`1 true`", correct: false}
      - {text: "`0 false`", correct: false}
      - {text: "`1 false`", correct: false}
    answer: "`0 true` : sur un vecteur vide, `begin()` et `end()` sont égaux. La boucle ne fait aucun tour."
    check:
      output: "0 true"
  - key: bug-dereferencer-end
    format: bug-fix
    question: |-
      Ce programme devrait afficher le dernier élément, `30`. Il lit après la fin du vecteur. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 30};
          auto it = v.end();
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "Écrire `auto it = v.end() - 1;`", correct: true}
      - {text: "Écrire `auto it = v.end() + 1;`", correct: false}
      - {text: "Écrire `std::println(\"{}\", it);`", correct: false}
      - {text: "Écrire `const auto it = v.end();`", correct: false}
    answer: |-
      ```cpp
      auto it = v.end() - 1;
      ```
      `end()` désigne l'après-dernier, qui ne contient rien. Le dernier élément est une position avant ; `v.back()`
      le donne directement.
  - key: bug-find-sans-test
    format: bug-fix
    question: |-
      Ce programme cherche `99`, qui n'est pas dans le vecteur, puis lit le résultat. Son comportement est indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto it = std::find(v.begin(), v.end(), 99);
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "N'afficher `*it` que si `it != v.end()`", correct: true}
      - {text: "N'afficher `*it` que si `it != nullptr`", correct: false}
      - {text: "N'afficher `*it` que si `*it != 0`", correct: false}
      - {text: "Afficher `*(it - 1)` à la place de `*it`", correct: false}
    answer: |-
      ```cpp
      if (it != v.end()) {
          std::println("{}", *it);
      }
      ```
      Quand la valeur manque, `std::find` renvoie `end()`. Un itérateur ne se compare pas à `nullptr`, et tester
      `*it` revient déjà à le déréférencer.
  - key: bug-inferieur-sur-liste
    format: bug-fix
    question: |-
      Le compilateur refuse la condition `it < l.end()`. Quelle correction est la bonne ?
      ```cpp
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{1, 2, 3};
          for (auto it = l.begin(); it < l.end(); ++it) {
              std::println("{}", *it);
          }
      }
      ```
    choices:
      - {text: "Écrire `it != l.end()`", correct: true}
      - {text: "Écrire `it <= l.end()`", correct: false}
      - {text: "Écrire `*it < *l.end()`", correct: false}
      - {text: "Écrire `it < l.size()`", correct: false}
    answer: |-
      ```cpp
      for (auto it = l.begin(); it != l.end(); ++it) {
      ```
      L'itérateur d'une liste ne se compare pas avec `<` : il ne connaît pas sa position. `!=` fonctionne avec tous
      les conteneurs, c'est pourquoi on l'écrit par habitude.
  - key: bug-boucle-inclusive
    format: bug-fix
    question: |-
      Ce programme affiche les trois éléments, puis une valeur qui n'est pas dans le vecteur. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto it = v.begin(); it <= v.end(); ++it) {
              std::println("{}", *it);
          }
      }
      ```
    choices:
      - {text: "Écrire `it != v.end()` dans la condition", correct: true}
      - {text: "Écrire `it <= v.end() + 1` dans la condition", correct: false}
      - {text: "Écrire `auto it = v.begin() + 1` au départ", correct: false}
      - {text: "Écrire `it++` à la place de `++it`", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.begin(); it != v.end(); ++it) {
      ```
      Avec `<=`, la boucle fait un tour de trop, où `it` vaut `end()`. L'intervalle est semi-ouvert : la fin est
      exclue.
