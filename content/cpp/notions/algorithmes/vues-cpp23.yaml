notion: vues-cpp23
lesson: |-
  C++23 a ajouté une série de vues qui remplacent les boucles à indices les plus courantes. Elles sont dans
  `<ranges>`, sous `std::views`.

  **Parcourir avec l'indice : `enumerate`.** Chaque élément est une paire (indice, valeur).

  ```cpp
  std::vector<std::string> noms{"Ada", "Alan"};
  for (auto [i, nom] : noms | std::views::enumerate) {
      std::println("{} : {}", i, nom);       // 0 : Ada, puis 1 : Alan
  }
  ```

  **Parcourir plusieurs suites ensemble : `zip`.** Chaque élément est un tuple d'un élément de chaque suite. Le
  parcours s'arrête à la **plus courte**.

  ```cpp
  for (auto [nom, age] : std::views::zip(noms, ages)) { ... }
  ```

  **Découper : `chunk`, `slide`, `stride`.**

  | Vue | Sur `{1, 2, 3, 4, 5}` | Donne |
  |---|---|---|
  | `chunk(2)` | des morceaux **disjoints** de 2 | `{1,2}` `{3,4}` `{5}` |
  | `slide(2)` | des fenêtres **glissantes** de 2 | `{1,2}` `{2,3}` `{3,4}` `{4,5}` |
  | `stride(2)` | un élément sur 2 | `1` `3` `5` |
  | `adjacent<2>` | des **tuples** de voisins | `(1,2)` `(2,3)` `(3,4)` `(4,5)` |

  Le dernier morceau de `chunk` peut être plus court. `slide(n)` sur moins de `n` éléments ne donne rien.
  `adjacent<2>`, aussi nommé `pairwise`, donne des tuples que l'on déstructure ; `slide` donne des sous-intervalles
  que l'on parcourt.

  **Regrouper : `chunk_by`.** Il coupe la suite chaque fois que le prédicat, appliqué à deux voisins, est faux.

  ```cpp
  v | std::views::chunk_by(std::ranges::less{})    // des morceaux strictement croissants
  ```

  **Combiner : `cartesian_product`.** Toutes les combinaisons d'un élément de chaque suite : l'équivalent de
  boucles imbriquées.

  **Assembler : `join_with`.** Il aplatit une suite de suites en intercalant un séparateur.

  **Les autres ajouts.** `std::views::repeat(x)` répète une valeur ; `as_const` rend les éléments constants ;
  `as_rvalue` les déplace ; `zip_transform` et `adjacent_transform` appliquent une fonction en passant.

  **La disponibilité.** Tout cela dépend de la bibliothèque : GCC 14 fournit les vues citées ici. On vérifie pour
  un compilateur plus ancien.

  **L'affichage.** Avec GCC 14, `std::println("{}", vue)` ne compile pas encore : la mise en forme des
  intervalles n'y est pas fournie. On parcourt la vue, ou on la matérialise.

  **Les mêmes précautions que pour toute vue.** Elles sont paresseuses, et ne possèdent pas leurs données : pas de
  vue renvoyée sur une variable locale.

  **En entretien** : « C++23 apporte `enumerate` pour l'indice, `zip` pour parcourir deux suites ensemble,
  `chunk` pour des morceaux disjoints, `slide` pour des fenêtres glissantes. `zip` s'arrête à la suite la plus
  courte. Elles remplacent les boucles à indices, et leurs erreurs de bornes. »
cards:
  - key: enumerate
    format: course
    question: "Que produit `noms | std::views::enumerate` ?"
    choices:
      - {text: "Des paires formées de l'indice et de l'élément", correct: true}
      - {text: "Les indices seuls, de 0 à la taille moins un", correct: false}
      - {text: "Les éléments triés dans l'ordre de leurs indices", correct: false}
      - {text: "Le nombre d'éléments de la suite", correct: false}
    answer: "On les déstructure : `for (auto [i, nom] : noms | std::views::enumerate)`. Plus besoin de compteur tenu à la main."
  - key: zip
    format: course
    question: "Que fait `std::views::zip(a, b)` quand `a` a cinq éléments et `b` trois ?"
    choices:
      - {text: "Il produit trois tuples : le parcours s'arrête à la suite la plus courte", correct: true}
      - {text: "Il produit cinq tuples, en complétant `b` par des valeurs nulles", correct: false}
      - {text: "Il produit huit éléments : ceux de `a`, puis ceux de `b`", correct: false}
      - {text: "Il lève une exception : les deux suites doivent avoir la même taille", correct: false}
    answer: "`zip` associe les éléments de même rang, tant que toutes les suites en ont."
  - key: chunk-slide
    format: course
    question: "Quelle différence entre `chunk(3)` et `slide(3)` ?"
    choices:
      - {text: "`chunk` donne des morceaux disjoints ; `slide` des fenêtres qui se recouvrent", correct: true}
      - {text: "`chunk` donne des fenêtres qui se recouvrent ; `slide` des morceaux disjoints", correct: false}
      - {text: "`chunk` garde un élément sur trois ; `slide` saute les trois premiers", correct: false}
      - {text: "`chunk` découpe depuis le début ; `slide` découpe depuis la fin", correct: false}
    answer: "Sur six éléments, `chunk(3)` donne deux morceaux ; `slide(3)` donne quatre fenêtres, décalées d'un élément."
  - key: cartesian
    format: course
    question: "Que produit `std::views::cartesian_product(a, b)` ?"
    choices:
      - {text: "Tous les couples formés d'un élément de `a` et d'un élément de `b`", correct: true}
      - {text: "Les couples formés des éléments de même rang de `a` et de `b`", correct: false}
      - {text: "Le produit de chaque élément de `a` par celui de `b` de même rang", correct: false}
      - {text: "Les éléments de `a`, suivis des éléments de `b`", correct: false}
    answer: "C'est l'équivalent de deux boucles imbriquées. Avec trois et deux éléments, il produit six tuples. Les couples de même rang, c'est `zip`."
  - key: vf-norme
    format: true-false
    question: "`std::views::enumerate` et `std::views::zip` sont entrés dans la norme avec C++23."
    truth: true
    answer: "C++20 a apporté les premières vues ; C++23 les a complétées."
  - key: vf-chunk-dernier
    format: true-false
    question: "Avec `chunk(2)` sur cinq éléments, le dernier morceau contient deux éléments."
    truth: false
    answer: "Il n'en contient qu'un : le dernier morceau prend ce qui reste."
  - key: vf-slide-court
    format: true-false
    question: "`slide(4)` sur une suite de trois éléments ne produit aucune fenêtre."
    truth: true
    answer: "Il faut au moins `n` éléments pour former une fenêtre de taille `n`."
  - key: vf-zip-copie
    format: true-false
    question: "`std::views::zip(a, b)` copie les éléments de `a` et de `b` dans un nouveau conteneur."
    truth: false
    answer: "C'est une vue : elle produit des tuples de références, sans rien stocker. On peut modifier les éléments à travers elle."
  - key: qcm-indice
    format: multiple-choice
    question: "Quelle vue remplace une boucle `for (std::size_t i = 0; i < v.size(); ++i)` qui utilise `i` et `v[i]` ?"
    choices:
      - {text: "`std::views::enumerate`", correct: true}
      - {text: "`std::views::iota`", correct: false}
      - {text: "`std::views::stride`", correct: false}
      - {text: "`std::views::chunk`", correct: false}
    answer: "`enumerate` donne l'indice et l'élément ensemble, sans accès par `v[i]`."
  - key: qcm-voisins
    format: multiple-choice
    question: "Quelle vue donne chaque élément avec son successeur, sous forme de tuple ?"
    choices:
      - {text: "`std::views::adjacent<2>`", correct: true}
      - {text: "`std::views::chunk(2)`", correct: false}
      - {text: "`std::views::stride(2)`", correct: false}
      - {text: "`std::views::zip(2)`", correct: false}
    answer: "Aussi nommée `std::views::pairwise`. `slide(2)` donne les mêmes voisins, mais comme sous-intervalles."
  - key: qcm-un-sur-trois
    format: multiple-choice
    question: "Quelle vue garde un élément sur trois, en commençant par le premier ?"
    choices:
      - {text: "`std::views::stride(3)`", correct: true}
      - {text: "`std::views::chunk(3)`", correct: false}
      - {text: "`std::views::take(3)`", correct: false}
      - {text: "`std::views::drop(3)`", correct: false}
    answer: "`stride(n)` avance de `n` en `n`. `take(3)` garde les trois premiers, `drop(3)` les saute."
  - key: qcm-separateur
    format: multiple-choice
    question: "Quelle vue aplatit une suite de chaînes en intercalant une virgule ?"
    choices:
      - {text: "`std::views::join_with(',')`", correct: true}
      - {text: "`std::views::zip(',')`", correct: false}
      - {text: "`std::views::chunk_by(',')`", correct: false}
      - {text: "`std::views::split(',')`", correct: false}
    answer: "`join_with` assemble avec un séparateur. `split` fait l'inverse : il découpe selon un séparateur."
  - key: trous-enumerate
    format: fill-in
    question: |-
      Complète pour parcourir les éléments avec leur indice :
      ```cpp
      for (auto [i, nom] : noms | std::views::___) {
          std::println("{} : {}", i, nom);
      }
      ```
    blanks:
      - [enumerate]
    answer: "`std::views::enumerate` produit des paires (indice, élément)."
  - key: trous-zip
    format: fill-in
    question: |-
      Complète pour parcourir les deux vecteurs ensemble :
      ```cpp
      for (auto [nom, age] : std::views::___(noms, ages)) {
          std::println("{} a {} ans", nom, age);
      }
      ```
    blanks:
      - [zip]
    answer: "`std::views::zip` associe les éléments de même rang."
  - key: trous-chunk
    format: fill-in
    question: |-
      Complète pour découper la suite en morceaux disjoints de quatre éléments :
      ```cpp
      for (auto morceau : v | std::views::___(4)) {
          traiter(morceau);
      }
      ```
    blanks:
      - [chunk]
    answer: "`std::views::chunk(n)` découpe en morceaux de `n` éléments, sans recouvrement."
  - key: trous-slide
    format: fill-in
    question: |-
      Complète pour obtenir des fenêtres glissantes de trois éléments :
      ```cpp
      for (auto fenetre : v | std::views::___(3)) {
          traiter(fenetre);
      }
      ```
    blanks:
      - [slide]
    answer: "`std::views::slide(n)` produit toutes les fenêtres de `n` éléments consécutifs."
  - key: code-enumerate
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          long total = 0;
          for (const auto [i, x] : v | std::views::enumerate) {
              total += i * x;
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`80`", correct: true}
      - {text: "`60`", correct: false}
      - {text: "`140`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`80` : les indices partent de 0. 0 × 10 + 1 × 20 + 2 × 30."
    check:
      output: "80"
  - key: code-zip
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> a{1, 2, 3, 4};
          const std::vector<int> b{10, 20};
          int somme = 0;
          int tours = 0;
          for (const auto [x, y] : std::views::zip(a, b)) {
              somme += x * y;
              ++tours;
          }
          std::println("{} {}", tours, somme);
      }
      ```
    choices:
      - {text: "`2 50`", correct: true}
      - {text: "`4 50`", correct: false}
      - {text: "`4 100`", correct: false}
      - {text: "`2 30`", correct: false}
    answer: "`2 50` : `zip` s'arrête à la suite la plus courte. 1 × 10 + 2 × 20."
    check:
      output: "2 50"
  - key: code-chunk-slide
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5};
          int morceaux = 0;
          int dernier = 0;
          for (auto morceau : v | std::views::chunk(2)) {
              ++morceaux;
              dernier = static_cast<int>(morceau.size());
          }
          int fenetres = 0;
          for (auto fenetre : v | std::views::slide(2)) {
              ++fenetres;
          }
          std::println("{} {} {}", morceaux, dernier, fenetres);
      }
      ```
    choices:
      - {text: "`3 1 4`", correct: true}
      - {text: "`2 2 4`", correct: false}
      - {text: "`3 1 3`", correct: false}
      - {text: "`3 2 5`", correct: false}
    answer: "`3 1 4` : `chunk(2)` donne trois morceaux, le dernier d'un seul élément. `slide(2)` donne quatre fenêtres de deux voisins."
    check:
      output: "3 1 4"
  - key: code-stride-adjacent
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4, 5};
          int un_sur_deux = 0;
          for (int x : v | std::views::stride(2)) {
              un_sur_deux += x;
          }
          int ecarts = 0;
          for (const auto [a, b] : v | std::views::adjacent<2>) {
              ecarts += b - a;
          }
          std::println("{} {}", un_sur_deux, ecarts);
      }
      ```
    choices:
      - {text: "`9 4`", correct: true}
      - {text: "`6 4`", correct: false}
      - {text: "`9 5`", correct: false}
      - {text: "`15 4`", correct: false}
    answer: "`9 4` : `stride(2)` garde 1, 3 et 5. `adjacent<2>` donne quatre couples de voisins, chacun d'écart 1."
    check:
      output: "9 4"
  - key: bug-zip-tailles
    format: bug-fix
    question: |-
      Ce programme devrait afficher les trois prénoms. Il n'en affiche que deux : il manque un âge. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <string>
      #include <vector>

      int main() {
          const std::vector<std::string> noms{"Ada", "Alan", "Grace"};
          const std::vector<int> ages{36, 41};
          for (const auto& [nom, age] : std::views::zip(noms, ages)) {
              std::println("{} {}", nom, age);
          }
      }
      ```
    choices:
      - {text: "Donner un troisième âge au vecteur `ages`", correct: true}
      - {text: "Inverser les arguments : `std::views::zip(ages, noms)`", correct: false}
      - {text: "Ajouter `| std::views::take(3)` après le `zip`", correct: false}
      - {text: "Remplacer `zip` par `cartesian_product`", correct: false}
    answer: |-
      ```cpp
      const std::vector<int> ages{36, 41, 85};
      ```
      `zip` s'arrête à la suite la plus courte, sans erreur. Si les deux suites doivent aller ensemble, c'est à
      toi de garantir qu'elles ont la même taille.
  - key: bug-chunk-pour-slide
    format: bug-fix
    question: |-
      Ce programme devrait compter les montées entre deux valeurs voisines, soit `3`. Il affiche `2`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 5, 2, 6, 9};
          int montees = 0;
          for (auto paire : v | std::views::chunk(2)) {
              if (paire.size() == 2 && paire[0] < paire[1]) {
                  ++montees;
              }
          }
          std::println("{}", montees);
      }
      ```
    choices:
      - {text: "Utiliser `std::views::slide(2)`", correct: true}
      - {text: "Utiliser `std::views::chunk(3)`", correct: false}
      - {text: "Utiliser `std::views::stride(2)`", correct: false}
      - {text: "Utiliser `std::views::take(2)`", correct: false}
    answer: |-
      ```cpp
      for (auto paire : v | std::views::slide(2)) {
      ```
      `chunk(2)` donne des paires disjointes : (1,5), (2,6), puis 9 seul. Les voisins 5 et 2, 6 et 9 ne sont
      jamais comparés. `slide(2)` donne toutes les paires de voisins.
  - key: bug-enumerate-copie
    format: bug-fix
    question: |-
      Ce programme devrait ajouter à chaque élément son indice, et afficher `12`. Il affiche `10` : le vecteur n'a
      pas changé. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <tuple>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20};
          for (auto element : v | std::views::enumerate) {
              int copie = std::get<1>(element);
              copie += static_cast<int>(std::get<0>(element));
          }
          std::println("{}", v[0] + v[1] - 20);
      }
      ```
    choices:
      - {text: "Déstructurer : `for (auto [i, x] : v | std::views::enumerate)`, puis écrire `x += i;`", correct: true}
      - {text: "Déclarer `copie` avec `const int`, pour qu'elle ne soit plus modifiable", correct: false}
      - {text: "Ajouter `| std::views::as_const` après `enumerate`", correct: false}
      - {text: "Parcourir `std::views::enumerate` deux fois de suite", correct: false}
    answer: |-
      ```cpp
      for (auto [i, x] : v | std::views::enumerate) {
          x += static_cast<int>(i);
      }
      ```
      `enumerate` produit un tuple dont le second champ est une **référence** vers l'élément. En le recopiant dans
      un `int`, on modifie la copie. La déstructuration garde la référence.
  - key: bug-println-vue
    format: bug-fix
    question: |-
      Avec GCC 14, le compilateur répond « std::formatter must be specialized for each type being formatted ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <ranges>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3, 4};
          std::println("{}", v | std::views::stride(2));
      }
      ```
    choices:
      - {text: "Parcourir la vue, et afficher chaque élément", correct: true}
      - {text: "Afficher `(v | std::views::stride(2)).data()`", correct: false}
      - {text: "Afficher `&(v | std::views::stride(2))`", correct: false}
      - {text: "Ajouter `| std::views::all` à la fin de la vue", correct: false}
    answer: |-
      ```cpp
      for (int x : v | std::views::stride(2)) {
          std::print("{} ", x);
      }
      std::println("");
      ```
      La mise en forme des intervalles fait partie de C++23, mais la bibliothèque de GCC 14 ne la fournit pas
      encore. On affiche élément par élément.
