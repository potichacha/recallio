notion: lambdas-generiques
lesson: |-
  Une lambda dont un paramètre est déclaré **`auto`** est une **lambda générique** (C++14) : elle accepte des
  arguments de n'importe quel type, pourvu que son corps compile avec eux.

  ```cpp
  auto doubler = [](auto x) { return x + x; };

  doubler(21);                    // int : 42
  doubler(1.5);                   // double : 3.0
  doubler(std::string{"ab"});     // std::string : "abab"
  ```

  **Ce que fait le compilateur.** Une lambda est un objet d'une classe générée. Avec `auto`, son `operator()`
  devient un **template** :

  ```cpp
  struct Lambda {
      template <typename T>
      auto operator()(T x) const { return x + x; }
  };
  ```

  Chaque type d'argument produit sa propre version, à la compilation. Il n'y a **aucun coût à l'exécution**, et
  aucune conversion : avec `1.5`, `x` est vraiment un `double`.

  **Chaque `auto` est indépendant.** Deux paramètres `auto` peuvent recevoir deux types différents :

  ```cpp
  auto somme = [](auto a, auto b) { return a + b; };
  somme(1, 2.5);      // int + double : 3.5
  ```

  **Avec `const`, `&` et `&&`.** `auto` se combine comme ailleurs :

  | Paramètre | Reçoit |
  |---|---|
  | `auto x` | une copie |
  | `const auto& x` | une référence constante : pour lire sans copier |
  | `auto& x` | une référence : pour modifier l'argument |
  | `auto&& x` | une référence universelle : tout, à transmettre avec `std::forward` |

  **L'usage le plus courant : les algorithmes.** On n'a plus à écrire le type des éléments, parfois long :

  ```cpp
  std::sort(v.begin(), v.end(), [](const auto& a, const auto& b) { return a.nom < b.nom; });

  std::map<std::string, std::vector<int>> index;
  std::for_each(index.begin(), index.end(), [](const auto& entree) { /* entree.first, entree.second */ });
  ```

  **Les erreurs arrivent à l'appel.** Rien n'est vérifié tant que la lambda n'est pas appelée. Si le corps ne
  convient pas au type reçu, l'erreur apparaît à l'instanciation, dans le corps de la lambda.

  **Contraindre et nommer le type (C++20).**

  ```cpp
  auto f = [](std::integral auto x) { return x * 2; };          // un concept devant auto
  auto g = []<typename T>(const std::vector<T>& v) { return v.size(); };   // paramètres de template explicites
  ```

  Dans le corps, le type d'un paramètre `auto` s'obtient par `decltype(x)`.

  **Les fonctions aussi.** Depuis C++20, `auto` est permis dans les paramètres d'une fonction ordinaire :
  `void afficher(const auto& x)` est un template abrégé.

  **En entretien** : « Une lambda générique a un paramètre `auto` : son `operator()` est un template, instancié
  pour chaque type d'argument, sans coût à l'exécution. Je m'en sers surtout dans les algorithmes, avec
  `const auto&`, pour ne pas écrire le type des éléments. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une lambda générique ?"
    choices:
      - {text: "Une lambda dont un paramètre est déclaré `auto`, et qui accepte plusieurs types", correct: true}
      - {text: "Une lambda sans capture, que l'on peut convertir en pointeur de fonction", correct: false}
      - {text: "Une lambda dont le type de retour est déduit de ses `return`", correct: false}
      - {text: "Une lambda qui capture toutes les variables locales par copie", correct: false}
    answer: "`[](auto x) { ... }` se comporte comme un template de fonction : elle est compilée pour chaque type d'argument qu'on lui passe."
  - key: mecanisme
    format: course
    question: "Comment le compilateur réalise-t-il une lambda générique ?"
    choices:
      - {text: "L'`operator()` de l'objet généré est un template", correct: true}
      - {text: "L'argument est converti en `void*`, puis reconverti à l'exécution", correct: false}
      - {text: "L'argument est rangé dans un `std::any` par la lambda", correct: false}
      - {text: "La lambda appelle une fonction virtuelle selon le type reçu", correct: false}
    answer: "Chaque type d'argument instancie une version de l'`operator()`. Tout se décide à la compilation : aucun coût à l'exécution."
  - key: deux-auto
    format: course
    question: "Dans `[](auto a, auto b) { return a + b; }`, les deux paramètres doivent-ils avoir le même type ?"
    choices:
      - {text: "Non : chaque `auto` est déduit séparément", correct: true}
      - {text: "Oui : tous les `auto` d'une lambda désignent le même type", correct: false}
      - {text: "Oui : sinon, le second est converti vers le type du premier", correct: false}
      - {text: "Non, mais le second doit être plus petit que le premier", correct: false}
    answer: "Chaque `auto` est un paramètre de template distinct. `somme(1, 2.5)` additionne un `int` et un `double`."
  - key: erreurs
    format: course
    question: "Quand le compilateur signale-t-il qu'une lambda générique ne convient pas à un type ?"
    choices:
      - {text: "À l'appel avec ce type, quand il instancie le corps", correct: true}
      - {text: "À la définition de la lambda, avant tout appel", correct: false}
      - {text: "À l'exécution, par une exception", correct: false}
      - {text: "À l'édition de liens", correct: false}
    answer: "Comme pour un template, le corps n'est vérifié que pour les types réellement utilisés. Une lambda jamais appelée avec un type inadapté ne pose aucun problème."
  - key: vf-cout
    format: true-false
    question: "Une lambda générique coûte plus cher à l'exécution qu'une lambda aux paramètres typés."
    truth: false
    answer: "Le type est résolu à la compilation. Le code produit est le même que pour une lambda écrite avec le type exact."
  - key: vf-conversion
    format: true-false
    question: "Avec `[](auto x) { ... }`, un argument `double` est converti en `int`."
    truth: false
    answer: "`auto` prend le type de l'argument tel quel : `x` est un `double`. Il n'y a aucune conversion."
  - key: vf-cpp14
    format: true-false
    question: "Les lambdas génériques existent depuis C++14."
    truth: true
    answer: "C++20 y a ajouté les concepts devant `auto`, et les paramètres de template explicites."
  - key: vf-const-auto-ref
    format: true-false
    question: "Un paramètre `const auto&` reçoit l'argument sans le copier."
    truth: true
    answer: "C'est une référence constante dont le type est déduit : la forme habituelle dans un algorithme."
  - key: qcm-comparaison
    format: multiple-choice
    question: "Quelle lambda compare deux éléments par leur membre `age`, sans nommer leur type ?"
    choices:
      - {text: "`[](const auto& a, const auto& b) { return a.age < b.age; }`", correct: true}
      - {text: "`[](const T& a, const T& b) { return a.age < b.age; }`", correct: false}
      - {text: "`[](const var& a, const var& b) { return a.age < b.age; }`", correct: false}
      - {text: "`[auto](a, b) { return a.age < b.age; }`", correct: false}
    answer: "`const auto&` déduit le type des éléments. `T` n'est pas déclaré, et `var` n'existe pas en C++."
  - key: qcm-type-du-parametre
    format: multiple-choice
    question: "Dans le corps d'une lambda `[](auto x) { ... }`, comment obtiens-tu le type de `x` ?"
    choices:
      - {text: "`decltype(x)`", correct: true}
      - {text: "`typeof(x)`", correct: false}
      - {text: "`x.type()`", correct: false}
      - {text: "`auto(x)`", correct: false}
    answer: "`decltype(x)` donne le type déclaré de `x`. C++20 permet aussi de le nommer : `[]<typename T>(T x)`."
  - key: qcm-concept
    format: multiple-choice
    question: "Quelle lambda de C++20 n'accepte que des entiers ?"
    choices:
      - {text: "`[](std::integral auto x) { return x * 2; }`", correct: true}
      - {text: "`[](auto<int> x) { return x * 2; }`", correct: false}
      - {text: "`[](auto x : int) { return x * 2; }`", correct: false}
      - {text: "`[](integer x) { return x * 2; }`", correct: false}
    answer: "Un concept placé devant `auto` contraint le type. Avec un `double`, l'appel est refusé, avec un message clair."
  - key: qcm-modifier
    format: multiple-choice
    question: "Quel paramètre permet à une lambda générique de modifier l'argument de l'appelant ?"
    choices:
      - {text: "`auto& x`", correct: true}
      - {text: "`auto x`", correct: false}
      - {text: "`const auto& x`", correct: false}
      - {text: "`const auto x`", correct: false}
    answer: "`auto&` est une référence non constante. `auto` seul reçoit une copie."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que la lambda accepte n'importe quel type :
      ```cpp
      auto doubler = [](___ x) { return x + x; };
      ```
    blanks:
      - [auto]
    answer: "Un paramètre `auto` rend la lambda générique."
  - key: trous-const-ref
    format: fill-in
    question: |-
      Complète pour lire les éléments sans les copier, quel que soit leur type :
      ```cpp
      std::for_each(v.begin(), v.end(), [](___ auto& x) { std::println("{}", x); });
      ```
    blanks:
      - [const]
    answer: "`const auto&` : une référence constante au type déduit."
  - key: trous-decltype
    format: fill-in
    question: |-
      Complète pour déclarer une variable du même type que le paramètre :
      ```cpp
      auto zero = [](auto x) {
          ___(x) resultat{};
          return resultat;
      };
      ```
    blanks:
      - [decltype]
    answer: "`decltype(x)` est le type de `x`."
  - key: trous-template
    format: fill-in
    question: |-
      Complète pour nommer le type des éléments du vecteur (C++20) :
      ```cpp
      auto taille = []<___ T>(const std::vector<T>& v) { return v.size(); };
      ```
    blanks:
      - [typename, class]
    answer: "Depuis C++20, une lambda peut déclarer ses paramètres de template entre chevrons."
  - key: code-types
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          auto doubler = [](auto x) { return x + x; };
          std::println("{} {} {}", doubler(21), doubler(1.5), doubler(std::string{"ab"}));
      }
      ```
    choices:
      - {text: "`42 3 abab`", correct: true}
      - {text: "`42 2 abab`", correct: false}
      - {text: "`42 3 ab ab`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42 3 abab` : la même lambda est instanciée pour `int`, `double` et `std::string`. 1.5 + 1.5 vaut 3, que `println` affiche `3`."
    check:
      output: "42 3 abab"
  - key: code-deux-types
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto somme = [](auto a, auto b) { return a + b; };
          std::println("{} {}", somme(1, 2), somme(1, 2.5));
      }
      ```
    choices:
      - {text: "`3 3.5`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`3.0 3.5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 3.5` : chaque `auto` est déduit séparément. `int + double` donne un `double`."
    check:
      output: "3 3.5"
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto taille = [](auto x) { return sizeof(x); };
          std::println("{} {} {}", taille('a'), taille(1.0), taille(true));
      }
      ```
    choices:
      - {text: "`1 8 1`", correct: true}
      - {text: "`4 8 4`", correct: false}
      - {text: "`1 4 1`", correct: false}
      - {text: "`8 8 8`", correct: false}
    answer: "`1 8 1` : aucun argument n'est converti. `x` est un `char`, puis un `double`, puis un `bool`."
    check:
      output: "1 8 1"
  - key: code-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          auto vider = [](auto& x) { x = {}; };
          int n = 5;
          std::string s = "abc";
          vider(n);
          vider(s);
          std::println("{} {}", n, s.size());
      }
      ```
    choices:
      - {text: "`0 0`", correct: true}
      - {text: "`5 3`", correct: false}
      - {text: "`0 3`", correct: false}
      - {text: "`5 0`", correct: false}
    answer: "`0 0` : `auto&` lie une référence à l'argument, quel que soit son type. `x = {}` lui affecte la valeur par défaut : 0, puis une chaîne vide."
    check:
      output: "0 0"
  - key: bug-copie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2 4 6` : la lambda double chaque élément. Il affiche `1 2 3`. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          std::for_each(v.begin(), v.end(), [](auto x) { x *= 2; });
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "Recevoir l'élément par référence : `auto& x`", correct: true}
      - {text: "Recevoir l'élément par référence constante : `const auto& x`", correct: false}
      - {text: "Écrire `return x * 2;` dans la lambda", correct: false}
      - {text: "Déclarer la lambda `mutable`", correct: false}
    answer: |-
      ```cpp
      std::for_each(v.begin(), v.end(), [](auto& x) { x *= 2; });
      ```
      `auto` seul reçoit une copie de chaque élément : c'est elle qui est doublée. Avec `auto&`, la lambda modifie
      l'élément du vecteur. `std::for_each` ignore la valeur renvoyée.
  - key: bug-type-inadapte
    format: bug-fix
    question: |-
      Le compilateur signale une erreur dans le corps de la lambda : « request for member 'size' in 'x', which is
      of non-class type 'int' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          auto longueur = [](const auto& x) { return x.size(); };
          std::println("{}", longueur(std::string{"abc"}));
          std::println("{}", longueur(42));
      }
      ```
    choices:
      - {text: "Ne pas appeler `longueur` avec un `int`, qui n'a pas de fonction `size`", correct: true}
      - {text: "Déclarer le paramètre `auto x`, sans `const` ni `&`", correct: false}
      - {text: "Déclarer la lambda `mutable`, pour qu'elle accepte un `int`", correct: false}
      - {text: "Écrire `-> int` après les paramètres de la lambda", correct: false}
    answer: |-
      ```cpp
      std::println("{}", longueur(std::string{"abc"}));
      ```
      Une lambda générique accepte tout type avec lequel son corps compile. Un `int` n'a pas de membre `size` :
      l'erreur apparaît quand le compilateur instancie la lambda pour `int`.
  - key: bug-types-differents
    format: bug-fix
    question: |-
      Le compilateur répond « inconsistent types 'int' and 'double' deduced for lambda return type ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          auto plus_grand = [](auto a, auto b) {
              if (a > b) {
                  return a;
              }
              return b;
          };
          std::println("{}", plus_grand(3, 4.5));
      }
      ```
    choices:
      - {text: "Écrire le type de retour : `-> double`", correct: true}
      - {text: "Écrire `mutable` après les paramètres", correct: false}
      - {text: "Écrire `const auto& a, const auto& b`", correct: false}
      - {text: "Écrire `return a, b;` à la fin", correct: false}
    answer: |-
      ```cpp
      auto plus_grand = [](auto a, auto b) -> double {
      ```
      `a` est un `int`, `b` un `double` : les deux `return` donnent deux types, et la déduction refuse de choisir.
      Avec le type écrit, les deux sont convertis. Appeler `plus_grand(3.0, 4.5)` conviendrait aussi.
  - key: bug-type-explicite
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3.5`. Il affiche `3` : la partie décimale est perdue. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          auto moitie = [](int x) { return x / 2; };
          std::println("{}", moitie(7.0));
      }
      ```
    choices:
      - {text: "Déclarer le paramètre `auto x`", correct: true}
      - {text: "Déclarer le paramètre `const int& x`", correct: false}
      - {text: "Déclarer la lambda `mutable`", correct: false}
      - {text: "Écrire `-> int` après le paramètre", correct: false}
    answer: |-
      ```cpp
      auto moitie = [](auto x) { return x / 2; };
      ```
      Avec `int x`, 7.0 est converti en 7, et la division est entière. Avec `auto`, `x` reste un `double` : 7.0 / 2
      vaut 3.5.
