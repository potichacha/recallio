notion: algorithmes-panorama
lesson: |-
  L'en-tête `<algorithm>` fournit une centaine de fonctions qui travaillent sur des suites d'éléments : chercher,
  compter, trier, transformer, retirer. L'en-tête `<numeric>` y ajoute les calculs (`std::accumulate`).

  **Ils travaillent sur des itérateurs.** Un algorithme reçoit un intervalle `[debut, fin)`, pas un conteneur.

  ```cpp
  std::vector<int> v{3, 8, 1, 6};
  std::sort(v.begin(), v.end());
  auto it = std::find(v.begin(), v.end(), 8);
  ```

  Le même `std::find` cherche ainsi dans un vecteur, une liste, un tableau, ou une partie de conteneur.

  **Les familles.**

  | Besoin | Algorithmes |
  |---|---|
  | Chercher | `find`, `find_if`, `binary_search`, `lower_bound` |
  | Compter, tester | `count`, `count_if`, `any_of`, `all_of`, `none_of` |
  | Trier | `sort`, `stable_sort`, `partial_sort`, `nth_element` |
  | Transformer | `transform`, `copy`, `fill`, `replace`, `reverse` |
  | Retirer | `remove`, `remove_if`, `unique` |
  | Extrêmes | `min_element`, `max_element` |
  | Calculer (`<numeric>`) | `accumulate`, `reduce`, `iota` |

  Ceux qui finissent par `_if` reçoivent un **prédicat**, le plus souvent une lambda.

  **Pourquoi préférer un algorithme à une boucle.**

  - **Il porte un nom.** `std::any_of(...)` dit ce qu'on cherche ; une boucle avec un drapeau et un `break` demande
    d'être lue en entier.
  - **Il est déjà juste.** Pas d'erreur de borne, pas d'itérateur invalidé, pas de cas vide oublié.
  - **Il est rapide.** Les implémentations sont optimisées, parfois mieux qu'une boucle écrite à la main.

  ```cpp
  bool trouve = false;                              // boucle : cinq lignes à lire
  for (int x : v) {
      if (x < 0) { trouve = true; break; }
  }

  bool trouve = std::any_of(v.begin(), v.end(),     // algorithme : l'intention est dans le nom
                            [](int x) { return x < 0; });
  ```

  **Les versions « ranges » (C++20).** Dans `std::ranges`, les algorithmes prennent directement le conteneur :

  ```cpp
  std::ranges::sort(v);
  auto it = std::ranges::find(v, 8);
  ```

  Plus court, et plus possible de mélanger les itérateurs de deux conteneurs.

  **Une boucle reste légitime** quand aucun algorithme ne correspond, ou quand le corps fait plusieurs choses à la
  fois. Le but est la lisibilité, pas de bannir `for`.

  **En entretien** : « Je préfère un algorithme nommé à une boucle écrite à la main : il dit l'intention, il est
  testé, et il évite les erreurs de bornes. Les algorithmes prennent des itérateurs, ou directement le conteneur
  avec `std::ranges`. »
cards:
  - key: interface
    format: course
    question: "Que reçoit un algorithme de `<algorithm>`, comme `std::sort` ?"
    choices:
      - {text: "Deux itérateurs, qui délimitent l'intervalle à traiter", correct: true}
      - {text: "Le conteneur lui-même, par référence constante", correct: false}
      - {text: "Un pointeur vers le conteneur, et sa taille en octets", correct: false}
      - {text: "Une copie du conteneur, qu'il renvoie modifiée", correct: false}
    answer: "Un algorithme ne connaît pas les conteneurs : il travaille sur `[debut, fin)`. C'est ce qui lui permet de traiter aussi une partie de conteneur."
  - key: pourquoi
    format: course
    question: "Pourquoi préfère-t-on `std::any_of` à une boucle avec un drapeau et un `break` ?"
    choices:
      - {text: "Son nom dit l'intention, et il évite les erreurs de bornes", correct: true}
      - {text: "Une boucle `for` est dépréciée depuis C++20", correct: false}
      - {text: "Il parcourt l'intervalle dans plusieurs threads à la fois", correct: false}
      - {text: "Il occupe moins de mémoire qu'une boucle `for`", correct: false}
    answer: "Un algorithme nommé se lit d'un coup d'œil, et il est déjà testé. Une boucle doit être lue en entier pour comprendre ce qu'elle cherche."
  - key: suffixe-if
    format: course
    question: "Que signifie le suffixe `_if` dans `std::count_if` ou `std::find_if` ?"
    choices:
      - {text: "L'algorithme reçoit un prédicat, à la place d'une valeur à comparer", correct: true}
      - {text: "L'algorithme ne s'exécute que si l'intervalle n'est pas vide", correct: false}
      - {text: "L'algorithme renvoie un booléen, à la place d'un itérateur", correct: false}
      - {text: "L'algorithme s'arrête au premier élément qui ne convient pas", correct: false}
    answer: "`std::count(debut, fin, 3)` compte les éléments égaux à 3. `std::count_if(debut, fin, predicat)` compte ceux pour lesquels le prédicat renvoie `true`."
  - key: ranges
    format: course
    question: "Qu'apportent les algorithmes de `std::ranges` (C++20) ?"
    choices:
      - {text: "Ils prennent directement le conteneur : `std::ranges::sort(v);`", correct: true}
      - {text: "Ils trient et cherchent dans plusieurs threads à la fois", correct: false}
      - {text: "Ils fonctionnent sans inclure l'en-tête `<algorithm>`", correct: false}
      - {text: "Ils remplacent les lambdas par des mots-clés du langage", correct: false}
    answer: "L'appel est plus court, et l'on ne peut plus passer par erreur le début d'un conteneur et la fin d'un autre."
  - key: vf-en-tete
    format: true-false
    question: "`std::sort` et `std::find` sont déclarés dans l'en-tête `<algorithm>`."
    truth: true
    answer: "Les calculs comme `std::accumulate` sont dans `<numeric>`."
  - key: vf-partie-de-conteneur
    format: true-false
    question: "Un algorithme peut traiter une partie seulement d'un conteneur."
    truth: true
    answer: "Il suffit de lui donner d'autres itérateurs : `std::sort(v.begin(), v.begin() + 3)` trie les trois premiers éléments."
  - key: vf-jamais-de-boucle
    format: true-false
    question: "Il ne faut plus jamais écrire de boucle `for` en C++ moderne."
    truth: false
    answer: "Une boucle reste légitime quand aucun algorithme ne correspond. Le but est que le code dise ce qu'il fait."
  - key: vf-accumulate
    format: true-false
    question: "`std::accumulate` est déclaré dans l'en-tête `<algorithm>`."
    truth: false
    answer: "Il est dans `<numeric>`, avec les autres algorithmes de calcul."
  - key: qcm-tous
    format: multiple-choice
    question: "Quel algorithme dit si tous les éléments vérifient une condition ?"
    choices:
      - {text: "`std::all_of`", correct: true}
      - {text: "`std::any_of`", correct: false}
      - {text: "`std::count_if`", correct: false}
      - {text: "`std::find_if`", correct: false}
    answer: "`std::all_of` : tous. `std::any_of` : au moins un. `std::none_of` : aucun."
  - key: qcm-plus-grand
    format: multiple-choice
    question: "Quel algorithme renvoie un itérateur sur le plus grand élément ?"
    choices:
      - {text: "`std::max_element`", correct: true}
      - {text: "`std::max`", correct: false}
      - {text: "`std::sort`", correct: false}
      - {text: "`std::find`", correct: false}
    answer: "`std::max_element` parcourt l'intervalle. `std::max` compare deux valeurs, pas un intervalle."
  - key: qcm-somme
    format: multiple-choice
    question: "Quel algorithme calcule la somme des éléments d'un vecteur ?"
    choices:
      - {text: "`std::accumulate`", correct: true}
      - {text: "`std::count`", correct: false}
      - {text: "`std::transform`", correct: false}
      - {text: "`std::for_each`", correct: false}
    answer: "`std::accumulate(v.begin(), v.end(), 0)` additionne les éléments à partir de la valeur initiale 0."
  - key: qcm-ranges-appel
    format: multiple-choice
    question: "Quelle ligne trie le vecteur `v` avec la version « ranges » ?"
    choices:
      - {text: "`std::ranges::sort(v);`", correct: true}
      - {text: "`std::sort(v);`", correct: false}
      - {text: "`v.sort();`", correct: false}
      - {text: "`std::ranges::sort(v.begin());`", correct: false}
    answer: "`std::ranges::sort` prend le conteneur. `std::sort` exige deux itérateurs, et un vecteur n'a pas de fonction membre `sort`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `std::sort` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [algorithm]
    answer: "`<algorithm>` déclare les algorithmes de recherche, de tri et de transformation."
  - key: trous-any-of
    format: fill-in
    question: |-
      Complète pour savoir si au moins un élément est négatif :
      ```cpp
      bool negatif = std::___(v.begin(), v.end(), [](int x) { return x < 0; });
      ```
    blanks:
      - [any_of]
    answer: "`std::any_of` renvoie `true` dès qu'un élément vérifie le prédicat."
  - key: trous-end
    format: fill-in
    question: |-
      Complète l'intervalle donné à l'algorithme :
      ```cpp
      std::sort(v.begin(), v.___());
      ```
    blanks:
      - [end]
    answer: "Un algorithme reçoit l'intervalle `[begin, end)`."
  - key: trous-ranges
    format: fill-in
    question: |-
      Complète pour passer directement le conteneur (C++20) :
      ```cpp
      std::___::sort(v);
      ```
    blanks:
      - [ranges]
    answer: "Les algorithmes de `std::ranges` acceptent le conteneur entier."
  - key: situation-boucle-drapeau
    format: scenario
    question: |-
      En revue de code, tu lis :
      ```cpp
      bool valide = true;
      for (const auto& ligne : lignes) {
          if (ligne.empty()) { valide = false; break; }
      }
      ```
      Que proposes-tu ?
    choices:
      - {text: "`std::none_of`, avec un prédicat qui teste `ligne.empty()`", correct: true}
      - {text: "`std::sort`, puis un test sur le premier élément", correct: false}
      - {text: "`std::accumulate`, pour additionner les longueurs des lignes", correct: false}
      - {text: "`std::transform`, pour remplacer les lignes vides", correct: false}
    answer: |-
      « Aucune ligne n'est vide » s'écrit `std::none_of(lignes.begin(), lignes.end(), [](const auto& l) { return
      l.empty(); })`. Le nom porte l'intention ; le drapeau et le `break` disparaissent.
  - key: situation-iterateurs-melanges
    format: scenario
    question: |-
      Un programme plante dans `std::sort(a.begin(), b.end());`, où `a` et `b` sont deux vecteurs. Que s'est-il
      passé, et comment l'éviter ?
    choices:
      - {text: "Les deux itérateurs viennent de conteneurs différents ; `std::ranges::sort(a)` l'évite", correct: true}
      - {text: "`std::sort` ne trie pas les vecteurs ; il faut appeler `a.sort()`", correct: false}
      - {text: "`std::sort` exige que les deux vecteurs aient la même taille", correct: false}
      - {text: "Le vecteur `b` est vide ; il faut le remplir avant le tri", correct: false}
    answer: |-
      L'intervalle `[a.begin(), b.end())` n'existe pas : l'algorithme avance depuis `a` sans jamais atteindre la fin
      de `b`. Comportement indéfini, que le compilateur ne voit pas. La version « ranges » prend le conteneur, et
      rend cette faute impossible.
  - key: situation-boucle-legitime
    format: scenario
    question: |-
      Une boucle parcourt des commandes, et pour chacune met à jour un stock, écrit une ligne de journal et envoie
      une notification. Un collègue veut la réécrire avec `std::for_each` et une lambda. Qu'en penses-tu ?
    choices:
      - {text: "Que la boucle `for` sur un intervalle est aussi claire : `for_each` n'apporte rien ici", correct: true}
      - {text: "Que `std::for_each` est obligatoire dès qu'on parcourt un conteneur", correct: false}
      - {text: "Que `std::transform` conviendrait mieux, puisqu'il y a trois actions", correct: false}
      - {text: "Que la boucle doit être découpée en trois appels à `std::sort`", correct: false}
    answer: |-
      Un algorithme vaut par son nom : `find`, `any_of`, `sort` disent ce qu'ils font. `for_each` dit seulement
      « pour chaque », comme la boucle. Quand le corps enchaîne des effets, une boucle sur un intervalle se lit au
      moins aussi bien.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande de trouver le premier nombre négatif d'un vecteur. Quelle solution montre le mieux
      que tu connais la bibliothèque standard ?
    choices:
      - {text: "`std::find_if` avec une lambda, puis la comparaison du résultat à `end()`", correct: true}
      - {text: "Une boucle par indice, avec une variable qui retient la position", correct: false}
      - {text: "`std::sort`, puis la lecture du premier élément", correct: false}
      - {text: "`std::count_if` avec une lambda, puis un test sur le résultat", correct: false}
    answer: |-
      `std::find_if` renvoie un itérateur sur le premier élément qui vérifie le prédicat, ou `end()`. Trier
      changerait l'ordre : le plus petit n'est pas le premier négatif. `count_if` dit combien, pas où.
