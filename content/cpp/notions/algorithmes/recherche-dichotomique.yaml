notion: recherche-dichotomique
lesson: |-
  Sur une suite **triée**, on n'a pas besoin de tout parcourir : on regarde le milieu, et l'on écarte la moitié où
  la valeur ne peut pas être. Chaque étape divise le travail par deux : c'est la **recherche dichotomique**, en
  **O(log n)**. Un million d'éléments demandent une vingtaine de comparaisons.

  | Algorithme | Renvoie |
  |---|---|
  | `std::binary_search(d, f, x)` | un **booléen** : `x` est-il présent ? |
  | `std::lower_bound(d, f, x)` | un itérateur sur le premier élément **supérieur ou égal** à `x` |
  | `std::upper_bound(d, f, x)` | un itérateur sur le premier élément **strictement supérieur** à `x` |
  | `std::equal_range(d, f, x)` | la paire `{lower_bound, upper_bound}` |

  ```cpp
  std::vector<int> v{10, 20, 20, 30};

  std::binary_search(v.begin(), v.end(), 20);      // true
  std::lower_bound(v.begin(), v.end(), 20);        // indice 1 : le premier 20
  std::upper_bound(v.begin(), v.end(), 20);        // indice 3 : après le dernier 20
  ```

  ```
   10   20   20   30
        ^         ^
   lower_bound   upper_bound      (pour 20)
  ```

  **Ce qu'on en fait.**

  - **Trouver** : `binary_search` dit seulement oui ou non. Pour obtenir l'élément, on prend `lower_bound`, et l'on
    vérifie : `it != v.end() && *it == x`.
  - **Compter** les occurrences : `upper_bound - lower_bound`.
  - **Insérer en gardant le tri** : `v.insert(std::lower_bound(v.begin(), v.end(), x), x)`.
  - **Borner** : le nombre d'éléments inférieurs à `x` est `lower_bound - v.begin()`.

  Quand la valeur est absente, `lower_bound` et `upper_bound` renvoient le même itérateur : l'endroit où elle
  s'insérerait. Si tout est plus petit, c'est `end()`.

  **La condition : la suite doit être triée**, selon le **même ordre** que celui de la recherche. Sur une suite
  non triée, le résultat est quelconque, sans erreur ni message. Si elle a été triée avec un comparateur, il faut
  passer le même :

  ```cpp
  std::sort(v.begin(), v.end(), std::greater<>{});
  std::binary_search(v.begin(), v.end(), 20, std::greater<>{});
  ```

  **Il faut un accès direct.** Sur un `std::vector`, c'est O(log n). Sur une `std::list`, l'algorithme fonctionne,
  mais doit avancer pas à pas : O(n). Et sur une `std::map` ou un `std::set`, on appelle les **fonctions membres**
  `lower_bound` et `upper_bound`, qui descendent dans l'arbre.

  **Un vecteur trié contre une map.** Pour des données remplies une fois puis consultées, un vecteur trié et
  `lower_bound` font aussi bien qu'une map en théorie, et mieux en pratique : la mémoire est contiguë.

  **En entretien** : « Sur un intervalle trié, `binary_search` répond par un booléen en O(log n) ; `lower_bound`
  donne le premier élément supérieur ou égal, `upper_bound` le premier strictement supérieur. Leur différence
  compte les occurrences. Tout cela suppose le tri, avec le même comparateur. »
cards:
  - key: principe
    format: course
    question: "Pourquoi une recherche dichotomique est-elle en O(log n) ?"
    choices:
      - {text: "Chaque comparaison écarte la moitié des éléments restants", correct: true}
      - {text: "Chaque comparaison écarte un seul élément de la suite", correct: false}
      - {text: "La valeur est trouvée par un calcul sur son hachage", correct: false}
      - {text: "La suite est parcourue par plusieurs threads à la fois", correct: false}
    answer: "On compare au milieu, et l'on ne garde que la moitié utile. Doubler la taille n'ajoute qu'une comparaison."
  - key: lower-bound
    format: course
    question: "Que renvoie `std::lower_bound(v.begin(), v.end(), x)` sur un vecteur trié ?"
    choices:
      - {text: "Un itérateur sur le premier élément supérieur ou égal à `x`", correct: true}
      - {text: "Un itérateur sur le premier élément strictement supérieur à `x`", correct: false}
      - {text: "Un itérateur sur le dernier élément inférieur à `x`", correct: false}
      - {text: "Un booléen qui dit si `x` est présent", correct: false}
    answer: "Si `x` est présent, c'est sa première occurrence. Sinon, c'est l'endroit où il s'insérerait. `upper_bound` donne le premier strictement supérieur."
  - key: condition
    format: course
    question: "Que se passe-t-il si l'on appelle `std::binary_search` sur un vecteur non trié ?"
    choices:
      - {text: "Le résultat est quelconque, sans erreur ni message", correct: true}
      - {text: "L'algorithme trie le vecteur avant de chercher", correct: false}
      - {text: "Une exception `std::logic_error` est lancée", correct: false}
      - {text: "Le compilateur refuse l'appel", correct: false}
    answer: "L'algorithme suppose le tri pour écarter des moitiés. Sans lui, il peut passer à côté d'une valeur présente. C'est à l'appelant de garantir la condition."
  - key: compter
    format: course
    question: "Comment comptes-tu les occurrences de `x` dans un vecteur trié, en O(log n) ?"
    choices:
      - {text: "Par la différence entre `upper_bound` et `lower_bound`", correct: true}
      - {text: "Par `std::count`, qui profite du tri", correct: false}
      - {text: "Par `std::binary_search`, qui renvoie leur nombre", correct: false}
      - {text: "Par la différence entre `end()` et `lower_bound`", correct: false}
    answer: "`lower_bound` désigne la première occurrence, `upper_bound` la position après la dernière. `std::count` parcourt tout, trié ou non."
  - key: vf-retour-binary-search
    format: true-false
    question: "`std::binary_search` renvoie un itérateur sur l'élément trouvé."
    truth: false
    answer: "Il renvoie un booléen. Pour accéder à l'élément, on utilise `std::lower_bound`."
  - key: vf-absent
    format: true-false
    question: "Quand la valeur est absente, `lower_bound` et `upper_bound` renvoient le même itérateur."
    truth: true
    answer: "Tous deux désignent l'endroit où la valeur s'insérerait. L'intervalle entre eux est vide."
  - key: vf-liste
    format: true-false
    question: "`std::lower_bound` est en O(log n) sur une `std::list`."
    truth: false
    answer: "Il fait bien O(log n) comparaisons, mais doit avancer pas à pas dans la liste : O(n) déplacements."
  - key: vf-map
    format: true-false
    question: "Sur une `std::map`, on préfère la fonction membre `lower_bound` à l'algorithme `std::lower_bound`."
    truth: true
    answer: "La fonction membre descend dans l'arbre, en O(log n). L'algorithme avancerait d'itérateur en itérateur."
  - key: qcm-present
    format: multiple-choice
    question: "Quel algorithme dit, par un booléen, si `7` figure dans le vecteur trié `v` ?"
    choices:
      - {text: "`std::binary_search`", correct: true}
      - {text: "`std::lower_bound`", correct: false}
      - {text: "`std::upper_bound`", correct: false}
      - {text: "`std::equal_range`", correct: false}
    answer: "`std::binary_search(v.begin(), v.end(), 7)` renvoie `true` ou `false`."
  - key: qcm-inserer
    format: multiple-choice
    question: "Quelle ligne insère `x` dans le vecteur trié `v` en le gardant trié ?"
    choices:
      - {text: "`v.insert(std::lower_bound(v.begin(), v.end(), x), x);`", correct: true}
      - {text: "`v.insert(std::binary_search(v.begin(), v.end(), x), x);`", correct: false}
      - {text: "`v.push_back(std::lower_bound(v.begin(), v.end(), x));`", correct: false}
      - {text: "`v.insert(v.begin(), x);`", correct: false}
    answer: "`lower_bound` donne la position où `x` doit entrer. `binary_search` ne renvoie qu'un booléen."
  - key: qcm-tout-plus-petit
    format: multiple-choice
    question: "Que renvoie `std::lower_bound` quand tous les éléments sont plus petits que la valeur cherchée ?"
    choices:
      - {text: "L'itérateur de fin", correct: true}
      - {text: "L'itérateur de début", correct: false}
      - {text: "Un itérateur sur le dernier élément", correct: false}
      - {text: "Un itérateur nul", correct: false}
    answer: "Aucun élément n'est supérieur ou égal : la valeur s'insérerait à la fin. On teste donc `it != v.end()` avant de lire `*it`."
  - key: qcm-comparateur
    format: multiple-choice
    question: "Un vecteur a été trié avec `std::greater<>`. Comment y cherches-tu `20` ?"
    choices:
      - {text: "`std::binary_search(v.begin(), v.end(), 20, std::greater<>{})`", correct: true}
      - {text: "`std::binary_search(v.begin(), v.end(), 20)`", correct: false}
      - {text: "`std::binary_search(v.end(), v.begin(), 20)`", correct: false}
      - {text: "`std::binary_search(v.begin(), v.end(), -20)`", correct: false}
    answer: "La recherche doit utiliser le même ordre que le tri. Sans le comparateur, elle suppose un ordre croissant, et se trompe."
  - key: trous-binary-search
    format: fill-in
    question: |-
      Complète pour savoir si la valeur est présente dans le vecteur trié :
      ```cpp
      bool present = std::___(v.begin(), v.end(), 42);
      ```
    blanks:
      - [binary_search]
    answer: "`std::binary_search` renvoie un booléen."
  - key: trous-lower-bound
    format: fill-in
    question: |-
      Complète pour obtenir le premier élément supérieur ou égal à 42 :
      ```cpp
      auto it = std::___(v.begin(), v.end(), 42);
      ```
    blanks:
      - [lower_bound]
    answer: "`std::lower_bound` : le premier élément qui n'est pas inférieur à la valeur."
  - key: trous-upper-bound
    format: fill-in
    question: |-
      Complète pour compter les occurrences de 42 :
      ```cpp
      auto debut = std::lower_bound(v.begin(), v.end(), 42);
      auto fin = std::___(v.begin(), v.end(), 42);
      auto nombre = fin - debut;
      ```
    blanks:
      - [upper_bound]
    answer: "`std::upper_bound` : le premier élément strictement supérieur."
  - key: trous-verifier
    format: fill-in
    question: |-
      Complète pour vérifier que la valeur a bien été trouvée :
      ```cpp
      auto it = std::lower_bound(v.begin(), v.end(), 42);
      if (it != v.end() && *it ___ 42) {
          std::println("trouvé");
      }
      ```
    blanks:
      - ["=="]
    answer: "`lower_bound` renvoie le premier élément supérieur ou égal : il faut vérifier qu'il est égal."
  - key: code-bornes
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 20, 30};
          const auto bas = std::lower_bound(v.begin(), v.end(), 20);
          const auto haut = std::upper_bound(v.begin(), v.end(), 20);
          std::println("{} {} {}", bas - v.begin(), haut - v.begin(), haut - bas);
      }
      ```
    choices:
      - {text: "`1 3 2`", correct: true}
      - {text: "`1 2 1`", correct: false}
      - {text: "`2 3 1`", correct: false}
      - {text: "`1 3 3`", correct: false}
    answer: "`1 3 2` : `lower_bound` désigne le premier 20, à l'indice 1 ; `upper_bound` le 30, à l'indice 3. Leur différence compte les deux 20."
    check:
      output: "1 3 2"
  - key: code-absent
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          const auto it = std::lower_bound(v.begin(), v.end(), 25);
          std::println("{} {} {}", std::binary_search(v.begin(), v.end(), 25), it - v.begin(), *it);
      }
      ```
    choices:
      - {text: "`false 2 30`", correct: true}
      - {text: "`false 1 20`", correct: false}
      - {text: "`true 2 30`", correct: false}
      - {text: "`false 3 30`", correct: false}
    answer: "`false 2 30` : 25 est absent. `lower_bound` désigne le premier élément supérieur ou égal : 30, à l'indice 2. C'est là que 25 s'insérerait."
    check:
      output: "false 2 30"
  - key: code-inserer
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 4, 9};
          for (int x : {5, 0, 12}) {
              v.insert(std::lower_bound(v.begin(), v.end(), x), x);
          }
          std::println("{} {} {} {}", v.front(), v[2], v.back(), std::is_sorted(v.begin(), v.end()));
      }
      ```
    choices:
      - {text: "`0 4 12 true`", correct: true}
      - {text: "`1 9 12 false`", correct: false}
      - {text: "`0 5 12 true`", correct: false}
      - {text: "`5 0 12 false`", correct: false}
    answer: "`0 4 12 true` : chaque valeur entre à sa place. Le vecteur vaut 0 1 4 5 9 12, toujours trié."
    check:
      output: "0 4 12 true"
  - key: code-fin
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{3, 6, 9};
          const auto grand = std::lower_bound(v.begin(), v.end(), 50);
          const auto petit = std::upper_bound(v.begin(), v.end(), 1);
          std::println("{} {}", grand == v.end(), petit == v.begin());
      }
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true true` : aucun élément n'atteint 50, donc `lower_bound` rend `end()`. Tous dépassent 1 : le premier strictement supérieur est le premier élément."
    check:
      output: "true true"
  - key: bug-non-trie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : 4 est dans le vecteur. Il affiche `false`. Quelle correction est la
      bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{9, 4, 7, 1, 8};
          std::println("{}", std::binary_search(v.begin(), v.end(), 4));
      }
      ```
    choices:
      - {text: "Trier le vecteur avec `std::sort` avant la recherche", correct: true}
      - {text: "Chercher avec `std::lower_bound` à la place", correct: false}
      - {text: "Chercher de `v.rbegin()` à `v.rend()`", correct: false}
      - {text: "Déclarer le vecteur avec `const`", correct: false}
    answer: |-
      ```cpp
      std::sort(v.begin(), v.end());
      std::println("{}", std::binary_search(v.begin(), v.end(), 4));
      ```
      La recherche dichotomique suppose une suite triée : ici, elle écarte la moitié qui contient le 4.
      `lower_bound` a la même exigence. Pour une seule recherche sur des données non triées, `std::find` suffit.
  - key: bug-comparateur-oublie
    format: bug-fix
    question: |-
      Le vecteur est trié par ordre décroissant. Ce programme devrait afficher `true`, et affiche `false`. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <functional>
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 5, 3, 9, 7};
          std::sort(v.begin(), v.end(), std::greater<>{});
          std::println("{}", std::binary_search(v.begin(), v.end(), 3));
      }
      ```
    choices:
      - {text: "Passer `std::greater<>{}` aussi à `std::binary_search`", correct: true}
      - {text: "Passer `std::less<>{}` à `std::binary_search`", correct: false}
      - {text: "Chercher `-3` à la place de `3`", correct: false}
      - {text: "Appeler `std::binary_search` avant `std::sort`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::binary_search(v.begin(), v.end(), 3, std::greater<>{}));
      ```
      Sans comparateur, la recherche suppose un ordre croissant, et part du mauvais côté. Elle doit utiliser le
      même ordre que le tri.
  - key: bug-lower-bound-sans-test
    format: bug-fix
    question: |-
      Ce programme devrait afficher `absent` : 25 n'est pas dans le vecteur. Il affiche `trouvé`. Quelle correction
      est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          const auto it = std::lower_bound(v.begin(), v.end(), 25);
          if (it != v.end()) {
              std::println("trouvé");
          } else {
              std::println("absent");
          }
      }
      ```
    choices:
      - {text: "Tester aussi que `*it == 25`", correct: true}
      - {text: "Tester que `it != v.begin()`", correct: false}
      - {text: "Tester que `*it >= 25`", correct: false}
      - {text: "Tester que `it == v.end()`", correct: false}
    answer: |-
      ```cpp
      if (it != v.end() && *it == 25) {
      ```
      `lower_bound` ne dit pas que la valeur est présente : il rend le premier élément supérieur ou égal, ici 30. Il
      faut vérifier l'égalité, après s'être assuré que l'itérateur n'est pas `end()`.
  - key: bug-dereferencer-end
    format: bug-fix
    question: |-
      Ce programme cherche une valeur plus grande que tous les éléments, puis lit le résultat : son comportement
      est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          const auto it = std::lower_bound(v.begin(), v.end(), 99);
          std::println("{}", *it);
      }
      ```
    choices:
      - {text: "N'afficher `*it` que si `it != v.end()`", correct: true}
      - {text: "N'afficher `*it` que si `*it != 0`", correct: false}
      - {text: "Afficher `*(it + 1)` à la place de `*it`", correct: false}
      - {text: "Chercher avec `std::upper_bound` à la place", correct: false}
    answer: |-
      ```cpp
      if (it != v.end()) {
          std::println("{}", *it);
      }
      ```
      Aucun élément n'est supérieur ou égal à 99 : `lower_bound` renvoie `end()`, qui ne se déréférence pas.
      `upper_bound` renverrait `end()` lui aussi.
