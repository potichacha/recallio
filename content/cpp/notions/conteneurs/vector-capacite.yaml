notion: vector-capacite
lesson: |-
  Un `std::vector` a deux grandeurs, qu'il ne faut pas confondre.

  - La **taille** (`size()`) : le nombre d'éléments qu'il **contient**.
  - La **capacité** (`capacity()`) : le nombre d'éléments qu'il **peut contenir** sans réallouer. Elle est toujours
    supérieure ou égale à la taille.

  **La réallocation.** Quand un `push_back` trouve le vecteur plein, il **alloue un bloc plus grand**, y **déplace**
  tous les éléments, et **libère** l'ancien. Deux conséquences :

  - cette opération coûte un temps proportionnel à la taille ;
  - les **références, pointeurs et itérateurs** vers les éléments sont **invalidés**.

  Pour ne pas réallouer à chaque ajout, la capacité grandit **par multiplication** (elle double, avec GCC). Les
  réallocations se font rares, et un `push_back` coûte un temps **constant en moyenne** : on dit *amorti*.

  **Les fonctions qui s'en occupent.**

  | Fonction | Effet sur la taille | Effet sur la capacité |
  |---|---|---|
  | `reserve(n)` | aucun | portée à `n` au moins |
  | `resize(n)` | devient `n` : ajoute des éléments à zéro, ou en retire | augmentée si besoin |
  | `clear()` | devient 0 | inchangée |
  | `shrink_to_fit()` | aucun | ramenée à la taille (une demande, pas une garantie) |

  **`reserve` ou `resize` ?** `reserve(100)` prépare de la place : le vecteur reste **vide**, `v[0]` n'existe pas.
  `resize(100)` crée cent éléments : `v[0]` vaut zéro, et un `push_back` ajoute un cent-unième élément.

  **Quand réserver.** Quand on connaît d'avance le nombre d'éléments : une seule allocation au lieu d'une dizaine,
  et aucune invalidation pendant le remplissage.

  **En entretien** : « La taille compte les éléments, la capacité la place allouée. La capacité double à chaque
  réallocation, ce qui rend `push_back` constant en moyenne ; `reserve` évite ces réallocations quand je connais la
  taille. »
cards:
  - key: taille-ou-capacite
    format: course
    question: "Quelle différence entre `size()` et `capacity()` sur un `std::vector` ?"
    choices:
      - {text: "`size()` compte les éléments ; `capacity()` la place allouée, avant réallocation", correct: true}
      - {text: "`size()` compte la place allouée ; `capacity()` les éléments présents", correct: false}
      - {text: "`size()` compte en éléments ; `capacity()` compte en octets", correct: false}
      - {text: "Aucune : les deux renvoient toujours la même valeur", correct: false}
    answer: "La taille est le nombre d'éléments réellement dans le vecteur. La capacité est le nombre qu'il peut atteindre avant de devoir allouer un bloc plus grand."
  - key: reallocation
    format: course
    question: "Que fait un `push_back` quand la taille du vecteur a atteint sa capacité ?"
    choices:
      - {text: "Il alloue un bloc plus grand, y déplace les éléments, et libère l'ancien", correct: true}
      - {text: "Il écrit l'élément juste après le bloc, sans rien déplacer", correct: false}
      - {text: "Il remplace le dernier élément par le nouveau", correct: false}
      - {text: "Il lève une exception `std::length_error`", correct: false}
    answer: "C'est la réallocation. Tous les éléments changent d'adresse : les références, pointeurs et itérateurs pris avant ne sont plus valables."
  - key: croissance-geometrique
    format: course
    question: "Pourquoi la capacité d'un vecteur grandit-elle par multiplication, plutôt qu'élément par élément ?"
    choices:
      - {text: "Les réallocations deviennent rares : `push_back` coûte un temps constant en moyenne", correct: true}
      - {text: "Le système n'alloue la mémoire que par blocs dont la taille est une puissance de deux", correct: false}
      - {text: "Le vecteur occupe ainsi toujours moins de mémoire qu'en grandissant case par case", correct: false}
      - {text: "Les éléments restent ainsi triés après chaque ajout", correct: false}
    answer: "En doublant, le vecteur ne réalloue qu'un nombre logarithmique de fois. Le coût des déplacements, réparti sur tous les ajouts, est constant : c'est le coût amorti."
  - key: reserve-ou-resize
    format: course
    question: "Quelle différence entre `v.reserve(100)` et `v.resize(100)` sur un vecteur vide ?"
    choices:
      - {text: "`reserve` prépare la place, le vecteur reste vide ; `resize` crée cent éléments", correct: true}
      - {text: "`reserve` crée cent éléments ; `resize` prépare la place, le vecteur reste vide", correct: false}
      - {text: "Aucune : les deux créent cent éléments à zéro", correct: false}
      - {text: "Aucune : les deux laissent le vecteur vide", correct: false}
    answer: "Après `reserve(100)`, `size()` vaut toujours 0 : écrire dans `v[0]` est une faute. Après `resize(100)`, `size()` vaut 100, et `v[0]` vaut zéro."
  - key: vf-capacite-superieure
    format: true-false
    question: La capacité d'un vecteur est toujours supérieure ou égale à sa taille.
    truth: true
    answer: Le vecteur ne peut pas contenir plus d'éléments qu'il n'a de place allouée.
  - key: vf-clear-libere
    format: true-false
    question: "`clear()` ramène la capacité du vecteur à zéro."
    truth: false
    answer: "`clear()` retire les éléments : la taille devient 0, la capacité ne change pas. La mémoire reste prête à resservir."
  - key: vf-reserve-taille
    format: true-false
    question: "Après `v.reserve(10)` sur un vecteur vide, `v.size()` vaut 10."
    truth: false
    answer: "`reserve` ne change pas la taille. Elle vaut toujours 0."
  - key: vf-reallocation-invalide
    format: true-false
    question: Une réallocation invalide les références vers les éléments du vecteur.
    truth: true
    answer: Les éléments déménagent dans un nouveau bloc. Les anciennes adresses désignent de la mémoire libérée.
  - key: qcm-eviter-les-reallocations
    format: multiple-choice
    question: "Tu vas ajouter dix mille éléments à un vecteur vide. Comment évites-tu les réallocations ?"
    choices:
      - {text: "`v.reserve(10000);` avant la boucle", correct: true}
      - {text: "`v.resize(10000);` avant la boucle de `push_back`", correct: false}
      - {text: "`v.clear();` avant la boucle", correct: false}
      - {text: "`v.shrink_to_fit();` après chaque ajout", correct: false}
    answer: "`reserve` alloue une fois la place nécessaire. Avec `resize`, le vecteur contiendrait déjà dix mille zéros, et les `push_back` s'ajouteraient après."
  - key: qcm-liberer-la-memoire
    format: multiple-choice
    question: "Un vecteur a contenu un million d'éléments, et n'en a plus que dix. Quelle fonction demande de rendre la mémoire inutilisée ?"
    choices:
      - {text: "`shrink_to_fit()`", correct: true}
      - {text: "`clear()`", correct: false}
      - {text: "`reserve(10)`", correct: false}
      - {text: "`resize(10)`", correct: false}
    answer: "`shrink_to_fit()` demande de ramener la capacité à la taille. `reserve` ne réduit jamais la capacité, et `clear` ou `resize` ne touchent qu'à la taille."
  - key: qcm-resize-plus-grand
    format: multiple-choice
    question: "Que contiennent les nouveaux éléments après `v.resize(5)`, sur un `std::vector<int>` de deux éléments ?"
    choices:
      - {text: "Zéro", correct: true}
      - {text: "Des valeurs indéterminées", correct: false}
      - {text: "La valeur du dernier élément", correct: false}
      - {text: "Rien : la taille reste 2", correct: false}
    answer: "Les éléments ajoutés sont initialisés à la valeur nulle du type. `resize(5, 7)` les mettrait à 7."
  - key: qcm-cout-amorti
    format: multiple-choice
    question: "Quel est le coût moyen d'un `push_back` sur un `std::vector` ?"
    choices:
      - {text: "Constant : on dit « amorti »", correct: true}
      - {text: "Proportionnel à la taille du vecteur", correct: false}
      - {text: "Proportionnel au logarithme de la taille", correct: false}
      - {text: "Proportionnel au carré de la taille", correct: false}
    answer: "La plupart des `push_back` écrivent une case. Quelques-uns réallouent, en temps proportionnel à la taille, mais ils sont assez rares pour que la moyenne reste constante."
  - key: trous-reserve
    format: fill-in
    question: |-
      Complète pour préparer la place de mille éléments, sans en créer aucun :
      ```cpp
      std::vector<int> v;
      v.___(1000);
      ```
    blanks:
      - [reserve]
    answer: "`reserve(1000)` : la capacité passe à mille au moins, la taille reste 0."
  - key: trous-capacity
    format: fill-in
    question: |-
      Complète pour afficher la place allouée, et non le nombre d'éléments :
      ```cpp
      std::println("{}", v.___());
      ```
    blanks:
      - [capacity]
    answer: "`capacity()` donne le nombre d'éléments que le vecteur peut contenir sans réallouer."
  - key: trous-resize
    format: fill-in
    question: |-
      Complète pour que le vecteur contienne cinq éléments à zéro :
      ```cpp
      std::vector<int> v;
      v.___(5);
      ```
    blanks:
      - [resize]
    answer: "`resize(5)` porte la taille à 5, en ajoutant des éléments nuls."
  - key: trous-shrink
    format: fill-in
    question: |-
      Complète pour demander au vecteur de rendre la mémoire qu'il n'utilise plus :
      ```cpp
      v.resize(10);
      v.___();
      ```
    blanks:
      - [shrink_to_fit]
    answer: "`shrink_to_fit()` demande de ramener la capacité à la taille."
  - key: code-reserve
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          v.reserve(100);
          std::println("{} {}", v.size(), v.capacity() >= 100);
      }
      ```
    choices:
      - {text: "`0 true`", correct: true}
      - {text: "`100 true`", correct: false}
      - {text: "`0 false`", correct: false}
      - {text: "`100 false`", correct: false}
    answer: "`0 true` : `reserve` alloue la place, sans créer d'élément. La taille reste nulle."
    check:
      output: "0 true"
  - key: code-resize
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{7, 8};
          v.resize(4);
          v.push_back(9);
          std::println("{} {} {}", v.size(), v[3], v[4]);
      }
      ```
    choices:
      - {text: "`5 0 9`", correct: true}
      - {text: "`4 0 9`", correct: false}
      - {text: "`5 9 0`", correct: false}
      - {text: "`3 8 9`", correct: false}
    answer: "`5 0 9` : `resize(4)` ajoute deux zéros. Le `push_back` range 9 après eux : 7, 8, 0, 0, 9."
    check:
      output: "5 0 9"
  - key: code-clear
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4};
          v.clear();
          std::println("{} {} {}", v.size(), v.empty(), v.capacity() >= 4);
      }
      ```
    choices:
      - {text: "`0 true true`", correct: true}
      - {text: "`0 true false`", correct: false}
      - {text: "`4 false true`", correct: false}
      - {text: "`0 false true`", correct: false}
    answer: "`0 true true` : `clear` retire les éléments, mais garde la mémoire. La capacité n'a pas diminué."
    check:
      output: "0 true true"
  - key: code-pas-de-reallocation
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          v.reserve(8);
          v.push_back(1);
          const int* avant = v.data();
          v.push_back(2);
          v.push_back(3);
          std::println("{} {}", v.data() == avant, v.size());
      }
      ```
    choices:
      - {text: "`true 3`", correct: true}
      - {text: "`false 3`", correct: false}
      - {text: "`true 8`", correct: false}
      - {text: "`false 8`", correct: false}
    answer: "`true 3` : la capacité de 8 suffit aux trois éléments. Aucune réallocation : le bloc n'a pas changé d'adresse."
    check:
      output: "true 3"
  - key: bug-reserve-puis-crochets
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, et affiche `0` : le vecteur est resté vide. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes;
          notes.reserve(3);
          notes[0] = 12;
          notes[1] = 15;
          notes[2] = 9;
          std::println("{}", notes.size());
      }
      ```
    choices:
      - {text: "Remplacer `reserve(3)` par `resize(3)`", correct: true}
      - {text: "Remplacer `reserve(3)` par `reserve(4)`", correct: false}
      - {text: "Appeler `notes.shrink_to_fit();` avant l'affichage", correct: false}
      - {text: "Afficher `notes.capacity()` à la place de `notes.size()`", correct: false}
    answer: |-
      ```cpp
      notes.resize(3);
      ```
      `reserve` alloue de la place, sans créer d'élément : écrire dans `notes[0]` est un comportement indéfini, et la
      taille reste 0. `resize` crée les trois éléments ; trois `push_back` conviendraient aussi.
  - key: bug-resize-puis-push-back
    format: bug-fix
    question: |-
      Ce programme devrait afficher `12 15`, et affiche `0 0`. Pourquoi ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes;
          notes.resize(2);
          notes.push_back(12);
          notes.push_back(15);
          std::println("{} {}", notes[0], notes[1]);
      }
      ```
    choices:
      - {text: "`resize(2)` a créé deux zéros, et `push_back` ajoute après eux", correct: true}
      - {text: "`push_back` remplace les éléments à partir de la fin", correct: false}
      - {text: "`resize(2)` interdit au vecteur de dépasser deux éléments", correct: false}
      - {text: "`notes[0]` désigne le dernier élément ajouté", correct: false}
    answer: |-
      ```cpp
      notes.reserve(2);
      ```
      Après `resize(2)`, le vecteur contient 0, 0. Les deux `push_back` donnent 0, 0, 12, 15. Pour seulement préparer
      la place, c'est `reserve`.
  - key: bug-capacite-comme-borne
    format: bug-fix
    question: |-
      Ce programme affiche les trois notes, puis des nombres qui ne sont pas des notes. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          notes.reserve(6);
          for (std::size_t i = 0; i < notes.capacity(); ++i) {
              std::println("{}", notes[i]);
          }
      }
      ```
    choices:
      - {text: "Borner la boucle par `notes.size()`", correct: true}
      - {text: "Borner la boucle par `notes.capacity() - 1`", correct: false}
      - {text: "Retirer l'appel `notes.reserve(6);`, sans toucher à la boucle", correct: false}
      - {text: "Déclarer `i` avec le type `int`", correct: false}
    answer: |-
      ```cpp
      for (std::size_t i = 0; i < notes.size(); ++i) {
      ```
      La capacité est de la place allouée, pas des éléments. Au-delà de `size()`, il n'y a rien à lire : comportement
      indéfini.
  - key: bug-reserve-sans-elements
    format: bug-fix
    question: |-
      Ce programme devrait afficher cinq zéros, et n'affiche rien. Pourquoi ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> compteurs;
          compteurs.reserve(5);
          for (int compteur : compteurs) {
              std::println("{}", compteur);
          }
      }
      ```
    choices:
      - {text: "Après `reserve`, le vecteur est toujours vide : la boucle ne fait aucun tour", correct: true}
      - {text: "Une boucle sur un intervalle ne parcourt pas un vecteur d'entiers", correct: false}
      - {text: "`reserve(5)` crée cinq éléments, que la boucle saute car ils sont nuls", correct: false}
      - {text: "`compteur` est une copie, et une copie ne s'affiche pas", correct: false}
    answer: |-
      ```cpp
      std::vector<int> compteurs(5);
      ```
      `reserve` ne crée aucun élément. Pour cinq compteurs à zéro : `std::vector<int> compteurs(5);`, ou
      `compteurs.resize(5);`.
  - key: situation-remplissage
    format: scenario
    question: |-
      Une fonction lit un fichier de deux millions de lignes, dont le nombre figure sur la première ligne, et les
      range dans un vecteur avec `push_back`. Le profileur montre beaucoup de temps passé à copier de la mémoire.
      Que proposes-tu ?
    choices:
      - {text: "Appeler `reserve` avec le nombre de lignes, avant la boucle", correct: true}
      - {text: "Remplacer le vecteur par une `std::list`, qui ne réalloue jamais", correct: false}
      - {text: "Appeler `shrink_to_fit` après chaque `push_back`", correct: false}
      - {text: "Appeler `clear` avant chaque `push_back`", correct: false}
    answer: |-
      Sans `reserve`, le vecteur réalloue une vingtaine de fois, et déplace chaque fois tout ce qu'il contient. Une
      seule allocation, de la bonne taille, supprime ces copies. Une liste allouerait deux millions de nœuds, un par
      un.
  - key: situation-memoire-retenue
    format: scenario
    question: |-
      Un service charge un gros lot dans un vecteur, le traite, appelle `clear()`, puis attend le lot suivant. Sa
      mémoire ne redescend jamais. Pourquoi, et que fais-tu si c'est gênant ?
    choices:
      - {text: "`clear()` garde la capacité ; `shrink_to_fit()`, ou un vecteur neuf, la rend", correct: true}
      - {text: "`clear()` crée une fuite de mémoire ; il faut appeler `delete` sur le vecteur", correct: false}
      - {text: "`clear()` ne retire pas les éléments ; il faut appeler `erase` sur chacun", correct: false}
      - {text: "`clear()` double la capacité ; il faut appeler `reserve(0)` avant", correct: false}
    answer: |-
      Garder la capacité est voulu : le lot suivant n'aura pas à réallouer. Si la mémoire compte plus que ce gain,
      `shrink_to_fit()` demande de la rendre. Ce n'est pas une fuite : le vecteur libérera tout à sa destruction.
  - key: situation-pointeurs
    format: scenario
    question: |-
      Un programme garde des pointeurs vers les éléments d'un vecteur, qu'il continue de remplir. De temps en temps,
      ces pointeurs désignent n'importe quoi. Tu connais le nombre maximal d'éléments. Que proposes-tu ?
    choices:
      - {text: "Appeler `reserve` avec ce maximum, avant de prendre le moindre pointeur", correct: true}
      - {text: "Appeler `resize` avec ce maximum, après avoir pris les pointeurs", correct: false}
      - {text: "Déclarer les pointeurs avec le mot-clé `const`", correct: false}
      - {text: "Appeler `shrink_to_fit` après chaque ajout", correct: false}
    answer: |-
      Tant que la capacité suffit, le vecteur ne réalloue pas, et ses éléments ne déménagent pas. Réserver d'emblée
      le maximum garantit des adresses stables. Sans maximum connu, on garde des indices plutôt que des pointeurs.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande pourquoi `push_back` est dit « en temps constant », alors qu'une réallocation
      copie tout le vecteur. Que réponds-tu ?
    choices:
      - {text: "Que c'est un coût amorti : la capacité double, donc les réallocations sont rares", correct: true}
      - {text: "Que la réallocation ne copie rien : elle agrandit le bloc sur place", correct: false}
      - {text: "Que le vecteur réalloue dans un thread à part, sans bloquer l'appelant", correct: false}
      - {text: "Que c'est faux : chaque `push_back` coûte un temps proportionnel à la taille", correct: false}
    answer: |-
      Un `push_back` isolé peut coûter cher, mais sur n ajouts, le total des copies reste proportionnel à n, parce
      que la capacité croît par multiplication. Rapporté à chaque ajout, le coût est constant. Si la capacité
      croissait d'un seul élément à la fois, il serait proportionnel à la taille.
