notion: bitset
lesson: |-
  `std::bitset<N>` (en-tête `<bitset>`) est une suite de **`N` bits**, où `N` est fixé **à la compilation**. Il
  tient sur la pile, sans allocation, et remplace avantageusement les masques écrits à la main.

  ```cpp
  #include <bitset>

  std::bitset<8> drapeaux;              // 00000000
  std::bitset<8> masque{0b0000'0101};   // depuis un entier
  std::bitset<8> texte{"1010"};         // depuis une chaîne : 00001010
  ```

  **La position 0 est le bit de poids faible**, celui de droite à l'affichage.

  **Lire et écrire un bit.**

  | Fonction | Effet |
  |---|---|
  | `b.set(i)`, `b.set(i, false)` | met le bit `i` à 1, ou à la valeur donnée |
  | `b.reset(i)` | met le bit `i` à 0 |
  | `b.flip(i)` | inverse le bit `i` |
  | `b.test(i)` | lit le bit `i`, et lance `std::out_of_range` si `i >= N` |
  | `b[i]` | lit ou écrit le bit `i`, **sans vérification** |
  | `b.set()`, `b.reset()`, `b.flip()` | agissent sur **tous** les bits |

  **Interroger l'ensemble.**

  | Fonction | Renvoie |
  |---|---|
  | `b.count()` | le nombre de bits à 1 |
  | `b.size()` | `N` |
  | `b.any()`, `b.none()`, `b.all()` | au moins un, aucun, tous à 1 |

  **Les opérateurs.** `&`, `|`, `^`, `~`, `<<`, `>>`, et leurs formes `&=`, `|=`... agissent sur tous les bits,
  comme sur un entier. Les deux opérandes doivent avoir la **même taille**.

  ```cpp
  std::bitset<4> a{"1100"};
  std::bitset<4> b{"1010"};
  (a & b).to_string();   // "1000"
  (a | b).to_string();   // "1110"
  (a ^ b).to_string();   // "0110"
  ```

  **Convertir.** `to_ulong()` et `to_ullong()` donnent l'entier ; ils lancent `std::overflow_error` si la valeur
  ne tient pas. `to_string()` donne le texte, bit de poids fort d'abord.

  **`std::bitset` ou autre chose ?**

  | Besoin | Choix |
  |---|---|
  | Un nombre de bits connu à la compilation | `std::bitset<N>` |
  | Un nombre de bits connu seulement à l'exécution | `std::vector<bool>` |
  | Quelques drapeaux nommés | un `enum class` et des opérateurs bit à bit |

  **En entretien** : « `std::bitset<N>` est un tableau de bits de taille fixe, sans allocation : `set`, `reset`,
  `flip`, `test`, `count`, et les opérateurs bit à bit. Le bit 0 est celui de poids faible. Si la taille n'est
  connue qu'à l'exécution, c'est `std::vector<bool>`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un `std::bitset<N>` ?"
    choices:
      - {text: "Une suite de `N` bits, dont la taille est fixée à la compilation", correct: true}
      - {text: "Une suite de bits qui grandit à la demande, comme un vecteur", correct: false}
      - {text: "Un ensemble trié d'entiers, compris entre 0 et `N`", correct: false}
      - {text: "Un entier non signé, dont la taille est de `N` octets", correct: false}
    answer: "`N` est un paramètre de template. Le bitset ne fait aucune allocation, et offre les opérations bit à bit."
  - key: position-zero
    format: course
    question: "Quel bit désigne la position 0 d'un `std::bitset` ?"
    choices:
      - {text: "Le bit de poids faible, affiché à droite", correct: true}
      - {text: "Le bit de poids fort, affiché à gauche", correct: false}
      - {text: "Le premier bit mis à 1 par le programme", correct: false}
      - {text: "Le bit de signe du nombre représenté", correct: false}
    answer: "Comme pour un entier : `b[0]` est le bit des unités. `to_string()` écrit le bit de poids fort d'abord."
  - key: test-ou-crochets
    format: course
    question: "Quelle différence entre `b.test(i)` et `b[i]` sur un `std::bitset` ?"
    choices:
      - {text: "`test` vérifie la position et lance `std::out_of_range` ; `[]` ne vérifie rien", correct: true}
      - {text: "`test` met le bit à 1 avant de le lire ; `[]` le lit sans le modifier", correct: false}
      - {text: "`test` compte à partir du bit de poids fort ; `[]` à partir du poids faible", correct: false}
      - {text: "`test` renvoie un entier ; `[]` renvoie une chaîne d'un caractère", correct: false}
    answer: "C'est la même différence qu'entre `at()` et `[]` sur un vecteur. Hors bornes, `b[i]` est un comportement indéfini."
  - key: quand
    format: course
    question: "Quand préfères-tu `std::vector<bool>` à `std::bitset` ?"
    choices:
      - {text: "Quand le nombre de bits n'est connu qu'à l'exécution", correct: true}
      - {text: "Quand il faut combiner deux suites avec `&` et `|`", correct: false}
      - {text: "Quand il faut compter les bits à 1 de la suite", correct: false}
      - {text: "Quand la suite doit tenir sur la pile, sans allocation", correct: false}
    answer: "La taille d'un `std::bitset` est un paramètre de template. Il offre en revanche les opérateurs bit à bit et `count()`, et ne fait pas d'allocation."
  - key: vf-taille
    format: true-false
    question: "La taille d'un `std::bitset` peut changer pendant l'exécution."
    truth: false
    answer: "Elle fait partie de son type : `std::bitset<8>` et `std::bitset<16>` sont deux types différents."
  - key: vf-count
    format: true-false
    question: "`b.count()` renvoie le nombre de bits à 1."
    truth: true
    answer: "Le nombre total de bits, lui, est donné par `b.size()`."
  - key: vf-tailles-differentes
    format: true-false
    question: "On peut écrire `a & b` avec un `std::bitset<8>` et un `std::bitset<16>`."
    truth: false
    answer: "Les opérateurs bit à bit exigent deux bitsets de même taille : ce sont deux types sans rapport."
  - key: vf-defaut
    format: true-false
    question: "Un `std::bitset` construit sans argument a tous ses bits à 0."
    truth: true
    answer: "Le constructeur par défaut met tout à zéro, contrairement à un entier local non initialisé."
  - key: qcm-inverser
    format: multiple-choice
    question: "Quelle fonction inverse le bit 3 d'un `std::bitset` `b` ?"
    choices:
      - {text: "`b.flip(3)`", correct: true}
      - {text: "`b.reset(3)`", correct: false}
      - {text: "`b.set(3)`", correct: false}
      - {text: "`b.test(3)`", correct: false}
    answer: "`flip` inverse, `set` met à 1, `reset` met à 0, `test` lit."
  - key: qcm-tous
    format: multiple-choice
    question: "Quelle fonction dit si tous les bits d'un `std::bitset` sont à 1 ?"
    choices:
      - {text: "`all()`", correct: true}
      - {text: "`any()`", correct: false}
      - {text: "`none()`", correct: false}
      - {text: "`count()`", correct: false}
    answer: "`all()` : tous. `any()` : au moins un. `none()` : aucun."
  - key: qcm-entier
    format: multiple-choice
    question: "Quelle fonction convertit un `std::bitset` en entier ?"
    choices:
      - {text: "`to_ulong()`", correct: true}
      - {text: "`to_string()`", correct: false}
      - {text: "`count()`", correct: false}
      - {text: "`size()`", correct: false}
    answer: "`to_ulong()` et `to_ullong()`. Ils lancent `std::overflow_error` si la valeur ne tient pas dans le type."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::bitset` ?"
    choices:
      - {text: "`<bitset>`", correct: true}
      - {text: "`<bit>`", correct: false}
      - {text: "`<bits>`", correct: false}
      - {text: "`<vector>`", correct: false}
    answer: "`<bitset>`. L'en-tête `<bit>` (C++20) contient des fonctions sur les entiers, comme `std::popcount`."
  - key: trous-set
    format: fill-in
    question: |-
      Complète pour mettre le bit 2 à 1 :
      ```cpp
      std::bitset<8> b;
      b.___(2);
      ```
    blanks:
      - [set]
    answer: "`set(i)` met le bit `i` à 1."
  - key: trous-count
    format: fill-in
    question: |-
      Complète pour afficher le nombre de bits à 1 :
      ```cpp
      std::println("{}", b.___());
      ```
    blanks:
      - [count]
    answer: "`count()` compte les bits à 1."
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour déclarer une suite de seize bits :
      ```cpp
      std::bitset<___> b;
      ```
    blanks:
      - ["16"]
    answer: "La taille est l'argument du template."
  - key: trous-test
    format: fill-in
    question: |-
      Complète pour lire le bit 5, avec vérification de la position :
      ```cpp
      if (b.___(5)) {
          std::println("actif");
      }
      ```
    blanks:
      - [test]
    answer: "`test(i)` lit le bit, et lance `std::out_of_range` si la position est invalide."
  - key: code-set-count
    format: code-output
    question: |-
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          std::bitset<8> b;
          b.set(0);
          b.set(3);
          b.flip(0);
          b.set(7);
          std::println("{} {}", b.count(), b.to_string());
      }
      ```
    choices:
      - {text: "`2 10001000`", correct: true}
      - {text: "`3 10001001`", correct: false}
      - {text: "`2 00010001`", correct: false}
      - {text: "`2 00001001`", correct: false}
    answer: "`2 10001000` : le bit 0 est mis puis inversé, il reste les bits 3 et 7. `to_string()` écrit le bit 7 à gauche."
    check:
      output: "2 10001000"
  - key: code-operateurs
    format: code-output
    question: |-
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          const std::bitset<4> a{"1100"};
          const std::bitset<4> b{"1010"};
          std::println("{} {} {}", (a & b).to_string(), (a | b).to_string(), (a ^ b).to_string());
      }
      ```
    choices:
      - {text: "`1000 1110 0110`", correct: true}
      - {text: "`1110 1000 0110`", correct: false}
      - {text: "`1000 0110 1110`", correct: false}
      - {text: "`0001 0111 0110`", correct: false}
    answer: "`1000 1110 0110` : `&` garde les bits communs, `|` ceux de l'un ou de l'autre, `^` ceux qui diffèrent."
    check:
      output: "1000 1110 0110"
  - key: code-entier
    format: code-output
    question: |-
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          std::bitset<8> b{5};
          b <<= 1;
          std::println("{} {} {}", b.to_ulong(), b.test(1), b.any());
      }
      ```
    choices:
      - {text: "`10 true true`", correct: true}
      - {text: "`5 false true`", correct: false}
      - {text: "`10 false true`", correct: false}
      - {text: "`2 true true`", correct: false}
    answer: "`10 true true` : 5 s'écrit 101 ; décalé d'un bit, 1010, soit 10. Le bit 1 est à 1."
    check:
      output: "10 true true"
  - key: code-test-exception
    format: code-output
    question: |-
      ```cpp
      #include <bitset>
      #include <print>
      #include <stdexcept>

      int main() {
          std::bitset<4> b{"1111"};
          try {
              std::print("{} ", b.test(3));
              std::print("{} ", b.test(4));
          } catch (const std::out_of_range&) {
              std::print("hors bornes ");
          }
          std::println("{}", b.all());
      }
      ```
    choices:
      - {text: "`true hors bornes true`", correct: true}
      - {text: "`true false true`", correct: false}
      - {text: "`hors bornes true`", correct: false}
      - {text: "`true hors bornes false`", correct: false}
    answer: "`true hors bornes true` : les positions vont de 0 à 3. `test(4)` lance `std::out_of_range` ; les quatre bits sont à 1."
    check:
      output: "true hors bornes true"
  - key: bug-ordre-des-bits
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : le bit de gauche de `1000` est à 1. Il affiche `false`. Quelle
      correction est la bonne ?
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          const std::bitset<4> b{"1000"};
          std::println("{}", b.test(0));
      }
      ```
    choices:
      - {text: "Lire `b.test(3)`", correct: true}
      - {text: "Lire `b.test(4)`", correct: false}
      - {text: "Lire `b.test(1)`", correct: false}
      - {text: "Lire `b.test(8)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", b.test(3));
      ```
      La position 0 est le bit de droite. Dans `1000`, le bit à 1 est en position 3. `test(4)` lancerait une
      exception.
  - key: bug-overflow
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::overflow_error`. Quelle correction est la bonne ?
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          std::bitset<100> b;
          b.set(80);
          std::println("{}", b.to_ulong());
      }
      ```
    choices:
      - {text: "Afficher `b.to_string()`, ou `b.count()`", correct: true}
      - {text: "Afficher `b.to_ullong()`", correct: false}
      - {text: "Afficher `b.to_ulong() + 0`", correct: false}
      - {text: "Afficher `b.size()` à la place de la valeur", correct: false}
    answer: |-
      ```cpp
      std::println("{}", b.to_string());
      ```
      Le bit 80 ne tient pas dans un entier de 64 bits : `to_ulong()` et `to_ullong()` lancent
      `std::overflow_error`. Pour un grand bitset, on passe par le texte ou par les fonctions d'interrogation.
  - key: bug-tailles
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator&' ». Quelle correction est la bonne ?
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          const std::bitset<8> droits{"00000110"};
          const std::bitset<4> masque{"0100"};
          std::println("{}", (droits & masque).any());
      }
      ```
    choices:
      - {text: "Déclarer `masque` comme un `std::bitset<8>`", correct: true}
      - {text: "Écrire `droits && masque`", correct: false}
      - {text: "Écrire `droits + masque`", correct: false}
      - {text: "Déclarer `droits` avec `auto`", correct: false}
    answer: |-
      ```cpp
      const std::bitset<8> masque{"0100"};
      ```
      `std::bitset<8>` et `std::bitset<4>` sont deux types différents : il n'existe pas d'opérateur entre eux. On
      donne la même taille aux deux.
  - key: bug-set-sans-argument
    format: bug-fix
    question: |-
      Ce programme devrait activer un seul droit et afficher `1`. Il affiche `8`. Quelle correction est la bonne ?
      ```cpp
      #include <bitset>
      #include <print>

      int main() {
          std::bitset<8> droits;
          droits.set();
          std::println("{}", droits.count());
      }
      ```
    choices:
      - {text: "Écrire `droits.set(0);`", correct: true}
      - {text: "Écrire `droits.reset();`", correct: false}
      - {text: "Écrire `droits.flip();`", correct: false}
      - {text: "Écrire `droits.all();`", correct: false}
    answer: |-
      ```cpp
      droits.set(0);
      ```
      Sans argument, `set()` met **tous** les bits à 1. Pour un seul bit, on donne sa position.
