notion: adaptateurs-conteneurs
lesson: |-
  Un **adaptateur** n'est pas un nouveau conteneur : il enveloppe un conteneur existant, et n'en montre qu'une
  **interface réduite**. Cette restriction dit l'intention : une pile ne sert qu'à empiler et dépiler.

  | Adaptateur | En-tête | Ordre de sortie | Conteneur par défaut |
  |---|---|---|---|
  | `std::stack` | `<stack>` | le **dernier** entré sort d'abord (LIFO) | `std::deque` |
  | `std::queue` | `<queue>` | le **premier** entré sort d'abord (FIFO) | `std::deque` |
  | `std::priority_queue` | `<queue>` | le **plus grand** sort d'abord | `std::vector` |

  **La pile : `std::stack`.**

  ```cpp
  std::stack<int> pile;
  pile.push(1);
  pile.push(2);
  int haut = pile.top();    // 2
  pile.pop();               // retire 2
  ```

  **La file : `std::queue`.**

  ```cpp
  std::queue<int> file;
  file.push(1);
  file.push(2);
  int premier = file.front();   // 1
  file.pop();                   // retire 1
  ```

  **La file de priorité : `std::priority_queue`.** C'est un **tas** : `top()` donne toujours le plus grand
  élément ; `push` et `pop` coûtent O(log n).

  ```cpp
  std::priority_queue<int> tas;
  tas.push(3);
  tas.push(9);
  tas.push(5);
  int max = tas.top();      // 9
  ```

  Pour obtenir le **plus petit** d'abord, on inverse la comparaison :

  ```cpp
  std::priority_queue<int, std::vector<int>, std::greater<>> tas_min;
  ```

  **Ce qu'ils ont en commun.**

  - **`pop()` ne renvoie rien.** On lit d'abord (`top()` ou `front()`), on retire ensuite.
  - `top()`, `front()` et `pop()` sur un adaptateur **vide** sont des comportements indéfinis : on teste
    `empty()`.
  - **Pas d'itérateurs** : ni `begin()`, ni boucle sur un intervalle, ni recherche. On ne voit que le sommet. Pour
    parcourir, on vide l'adaptateur, ou l'on choisit un autre conteneur.
  - `size()` et `empty()` existent.

  **La boucle habituelle.**

  ```cpp
  while (!pile.empty()) {
      traiter(pile.top());
      pile.pop();
  }
  ```

  **À quoi ils servent.** La pile : annuler des actions, parcourir en profondeur, vérifier des parenthèses. La
  file : traiter dans l'ordre d'arrivée, parcourir en largeur. La file de priorité : toujours traiter le plus
  urgent, garder les k meilleurs, l'algorithme de Dijkstra.

  **En entretien** : « Ce sont des adaptateurs : une interface restreinte posée sur un `std::deque` ou un
  `std::vector`. `pop` ne renvoie rien, il n'y a pas d'itérateurs, et `std::priority_queue` est un tas qui donne
  le plus grand, ou le plus petit avec `std::greater`. »
cards:
  - key: adaptateur
    format: course
    question: "Pourquoi dit-on que `std::stack` est un adaptateur, et non un conteneur ?"
    choices:
      - {text: "Elle enveloppe un autre conteneur, et n'en montre qu'une interface réduite", correct: true}
      - {text: "Elle convertit ses éléments vers un autre type à chaque lecture", correct: false}
      - {text: "Elle change de structure interne selon le nombre d'éléments", correct: false}
      - {text: "Elle ne peut contenir que des pointeurs vers d'autres conteneurs", correct: false}
    answer: "Par défaut, elle range ses éléments dans une `std::deque`, et n'en expose que `push`, `pop` et `top`."
  - key: pile-ou-file
    format: course
    question: "Quelle différence entre `std::stack` et `std::queue` ?"
    choices:
      - {text: "La pile rend le dernier élément entré ; la file rend le premier", correct: true}
      - {text: "La pile rend le premier élément entré ; la file rend le dernier", correct: false}
      - {text: "La pile rend le plus grand élément ; la file rend le plus petit", correct: false}
      - {text: "La pile a une taille fixe ; la file grandit à la demande", correct: false}
    answer: "LIFO pour la pile (*last in, first out*), FIFO pour la file (*first in, first out*)."
  - key: priority-queue
    format: course
    question: "Quel élément `top()` donne-t-il sur une `std::priority_queue<int>` ?"
    choices:
      - {text: "Le plus grand", correct: true}
      - {text: "Le plus petit", correct: false}
      - {text: "Le premier inséré", correct: false}
      - {text: "Le dernier inséré", correct: false}
    answer: "Par défaut, la comparaison est `std::less` et le sommet est le plus grand. Avec `std::greater`, c'est le plus petit."
  - key: pop
    format: course
    question: "Que renvoie `pile.pop()` sur une `std::stack` ?"
    choices:
      - {text: "Rien : on lit le sommet avec `top()` avant de le retirer", correct: true}
      - {text: "L'élément retiré du sommet", correct: false}
      - {text: "Le nouveau sommet de la pile", correct: false}
      - {text: "`true` si la pile n'était pas vide", correct: false}
    answer: "`pop()` renvoie `void`, pour les trois adaptateurs. Lire et retirer sont deux opérations."
  - key: vf-iterateurs
    format: true-false
    question: "On peut parcourir une `std::stack` avec une boucle sur un intervalle."
    truth: false
    answer: "Les adaptateurs n'ont pas d'itérateurs : on n'accède qu'au sommet. C'est voulu."
  - key: vf-queue-entete
    format: true-false
    question: "`std::priority_queue` est déclarée dans l'en-tête `<queue>`."
    truth: true
    answer: "Avec `std::queue`. `std::stack` est dans `<stack>`."
  - key: vf-top-vide
    format: true-false
    question: "`top()` sur une pile vide lève une exception."
    truth: false
    answer: "C'est un comportement indéfini. On teste `empty()` avant."
  - key: vf-cout-tas
    format: true-false
    question: "`push` sur une `std::priority_queue` coûte O(log n)."
    truth: true
    answer: "L'élément est remonté à sa place dans le tas. `top()` est en O(1), `pop()` en O(log n)."
  - key: qcm-premier-file
    format: multiple-choice
    question: "Quelle fonction lit le prochain élément à sortir d'une `std::queue` ?"
    choices:
      - {text: "`front()`", correct: true}
      - {text: "`top()`", correct: false}
      - {text: "`back()`", correct: false}
      - {text: "`peek()`", correct: false}
    answer: "`front()` pour une file ; `top()` pour une pile et une file de priorité. `back()` donne le dernier entré."
  - key: qcm-tas-min
    format: multiple-choice
    question: "Quelle déclaration donne une file de priorité dont `top()` est le plus petit élément ?"
    choices:
      - {text: "`std::priority_queue<int, std::vector<int>, std::greater<>>`", correct: true}
      - {text: "`std::priority_queue<int, std::vector<int>, std::less<>>`", correct: false}
      - {text: "`std::priority_queue<int, std::greater<>>`", correct: false}
      - {text: "`std::min_priority_queue<int>`", correct: false}
    answer: "La comparaison est le troisième argument du template : il faut donc écrire aussi le conteneur. `std::less` est le défaut, et donne le plus grand."
  - key: qcm-conteneur-defaut
    format: multiple-choice
    question: "Sur quel conteneur `std::stack` s'appuie-t-elle par défaut ?"
    choices:
      - {text: "`std::deque`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::list`", correct: false}
      - {text: "`std::array`", correct: false}
    answer: "`std::stack` et `std::queue` utilisent `std::deque`. `std::priority_queue` utilise `std::vector`."
  - key: qcm-usage
    format: multiple-choice
    question: "Quel adaptateur convient pour toujours traiter d'abord la tâche la plus urgente ?"
    choices:
      - {text: "`std::priority_queue`", correct: true}
      - {text: "`std::stack`", correct: false}
      - {text: "`std::queue`", correct: false}
      - {text: "`std::deque`", correct: false}
    answer: "Elle garde le plus prioritaire au sommet, quel que soit l'ordre d'arrivée."
  - key: trous-top
    format: fill-in
    question: |-
      Complète pour lire le sommet de la pile :
      ```cpp
      std::stack<int> pile;
      pile.push(4);
      int haut = pile.___();
      ```
    blanks:
      - [top]
    answer: "`top()` lit le sommet, sans le retirer."
  - key: trous-front
    format: fill-in
    question: |-
      Complète pour lire le premier élément de la file :
      ```cpp
      std::queue<int> file;
      file.push(4);
      int premier = file.___();
      ```
    blanks:
      - [front]
    answer: "`front()` lit le plus ancien élément de la file."
  - key: trous-empty
    format: fill-in
    question: |-
      Complète pour vider la pile sans dépasser sa fin :
      ```cpp
      while (!pile.___()) {
          pile.pop();
      }
      ```
    blanks:
      - [empty]
    answer: "`pop()` sur une pile vide est un comportement indéfini : on teste `empty()`."
  - key: trous-greater
    format: fill-in
    question: |-
      Complète pour que le plus petit élément soit au sommet :
      ```cpp
      std::priority_queue<int, std::vector<int>, std::___<>> tas;
      ```
    blanks:
      - [greater]
    answer: "`std::greater<>` inverse la comparaison : le tas devient un tas minimum."
  - key: code-pile
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stack>

      int main() {
          std::stack<int> pile;
          pile.push(1);
          pile.push(2);
          pile.push(3);
          pile.pop();
          std::println("{} {}", pile.top(), pile.size());
      }
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`2 3`", correct: false}
    answer: "`2 2` : `pop` retire le dernier entré, 3. Le sommet est 2, et il reste deux éléments."
    check:
      output: "2 2"
  - key: code-file
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <queue>

      int main() {
          std::queue<int> file;
          file.push(1);
          file.push(2);
          file.push(3);
          file.pop();
          std::println("{} {}", file.front(), file.back());
      }
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`3 2`", correct: false}
      - {text: "`1 3`", correct: false}
    answer: "`2 3` : `pop` retire le premier entré, 1. Le prochain à sortir est 2 ; le dernier entré est 3."
    check:
      output: "2 3"
  - key: code-tas
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <queue>

      int main() {
          std::priority_queue<int> tas;
          for (int x : {3, 9, 1, 5}) {
              tas.push(x);
          }
          while (!tas.empty()) {
              std::print("{} ", tas.top());
              tas.pop();
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`9 5 3 1 fin`", correct: true}
      - {text: "`1 3 5 9 fin`", correct: false}
      - {text: "`3 9 1 5 fin`", correct: false}
      - {text: "`5 1 9 3 fin`", correct: false}
    answer: "`9 5 3 1 fin` : le sommet est toujours le plus grand élément restant, quel que soit l'ordre d'insertion."
    check:
      output: "9 5 3 1 fin"
  - key: code-tas-min
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>
      #include <queue>
      #include <vector>

      int main() {
          std::priority_queue<int, std::vector<int>, std::greater<>> tas;
          for (int x : {3, 9, 1, 5}) {
              tas.push(x);
          }
          tas.pop();
          std::println("{} {}", tas.top(), tas.size());
      }
      ```
    choices:
      - {text: "`3 3`", correct: true}
      - {text: "`5 3`", correct: false}
      - {text: "`1 3`", correct: false}
      - {text: "`9 3`", correct: false}
    answer: "`3 3` : avec `std::greater`, le sommet est le plus petit. `pop` retire 1 ; le suivant est 3."
    check:
      output: "3 3"
  - key: bug-pop-valeur
    format: bug-fix
    question: |-
      Le compilateur répond « void value not ignored as it ought to be ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stack>

      int main() {
          std::stack<int> pile;
          pile.push(7);
          int haut = pile.pop();
          std::println("{}", haut);
      }
      ```
    choices:
      - {text: "Lire `pile.top()` dans `haut`, puis appeler `pile.pop();`", correct: true}
      - {text: "Déclarer `haut` avec `auto` à la place de `int`", correct: false}
      - {text: "Écrire `int haut = pile.front();`", correct: false}
      - {text: "Écrire `int haut = *pile.pop();`", correct: false}
    answer: |-
      ```cpp
      int haut = pile.top();
      pile.pop();
      ```
      `pop()` renvoie `void`. On lit le sommet d'abord. Une pile n'a pas de `front()`.
  - key: bug-boucle-intervalle
    format: bug-fix
    question: |-
      Le compilateur refuse la boucle : une `std::stack` n'a pas de `begin()`. Le programme devrait afficher les
      éléments du sommet vers le fond. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stack>

      int main() {
          std::stack<int> pile;
          pile.push(1);
          pile.push(2);
          for (int x : pile) {
              std::println("{}", x);
          }
      }
      ```
    choices:
      - {text: "Boucler tant que `!pile.empty()`, en affichant `top()` puis en appelant `pop()`", correct: true}
      - {text: "Boucler par indice, de `0` à `pile.size()`, en affichant `pile[i]`", correct: false}
      - {text: "Boucler avec `for (const int& x : pile)` à la place de `int x`", correct: false}
      - {text: "Boucler avec des itérateurs, de `pile.rbegin()` à `pile.rend()`", correct: false}
    answer: |-
      ```cpp
      while (!pile.empty()) {
          std::println("{}", pile.top());
          pile.pop();
      }
      ```
      Un adaptateur n'a ni itérateurs ni indice : on ne voit que le sommet. Pour parcourir sans vider, il faut un
      `std::vector` ou une `std::deque`.
  - key: bug-top-vide
    format: bug-fix
    question: |-
      Ce programme lit le sommet d'une pile vide : son comportement est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stack>

      int main() {
          std::stack<int> pile;
          pile.push(5);
          pile.pop();
          std::println("{}", pile.top());
      }
      ```
    choices:
      - {text: "N'afficher `pile.top()` que si `!pile.empty()`", correct: true}
      - {text: "N'afficher `pile.top()` que si `pile.top() != 0`", correct: false}
      - {text: "Entourer l'affichage d'un `try` et d'un `catch (...)`", correct: false}
      - {text: "Appeler `pile.pop();` une seconde fois avant l'affichage", correct: false}
    answer: |-
      ```cpp
      if (!pile.empty()) {
          std::println("{}", pile.top());
      }
      ```
      `top()` ne vérifie rien, et ne lance pas d'exception. Tester `pile.top()` serait déjà la faute.
  - key: bug-ordre-file
    format: bug-fix
    question: |-
      Ce programme devrait traiter les commandes dans leur ordre d'arrivée et afficher `1 2 3`. Il affiche
      `3 2 1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <stack>

      int main() {
          std::stack<int> commandes;
          for (int numero : {1, 2, 3}) {
              commandes.push(numero);
          }
          while (!commandes.empty()) {
              std::print("{} ", commandes.top());
              commandes.pop();
          }
          std::println("");
      }
      ```
    choices:
      - {text: "Utiliser une `std::queue<int>`, et lire `commandes.front()`", correct: true}
      - {text: "Utiliser une `std::priority_queue<int>`, et lire `commandes.top()`", correct: false}
      - {text: "Insérer les numéros avec `emplace` à la place de `push`", correct: false}
      - {text: "Appeler `commandes.pop()` avant de lire `commandes.top()`", correct: false}
    answer: |-
      ```cpp
      std::queue<int> commandes;
      // ...
      std::print("{} ", commandes.front());
      ```
      Une pile rend le dernier entré d'abord. L'ordre d'arrivée, c'est une file. Une file de priorité rendrait les
      plus grands numéros d'abord.
