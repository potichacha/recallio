notion: complexite-conteneurs
lesson: |-
  La **complexité** d'une opération dit comment son coût grandit avec le nombre d'éléments `n`. On la note avec un
  grand O.

  | Notation | Nom | Pour un million d'éléments |
  |---|---|---|
  | O(1) | constant | 1 opération |
  | O(log n) | logarithmique | une vingtaine |
  | O(n) | linéaire | un million |

  **Le tableau à connaître.**

  | Conteneur | Accès par indice | Recherche d'une valeur | Ajout à la fin | Ajout en tête | Insertion au milieu |
  |---|---|---|---|---|---|
  | `std::vector` | O(1) | O(n) | O(1) amorti | O(n) | O(n) |
  | `std::deque` | O(1) | O(n) | O(1) | O(1) | O(n) |
  | `std::list` | aucun | O(n) | O(1) | O(1) | O(1), une fois la position trouvée |
  | `std::map`, `std::set` | aucun | O(log n) | insertion en O(log n) | | |
  | `std::unordered_map`, `std::unordered_set` | aucun | O(1) en moyenne, O(n) au pire | insertion en O(1) en moyenne | | |

  **Trois précisions.**

  - **Amorti** : un `push_back` isolé peut coûter O(n) quand le vecteur réalloue, mais la moyenne sur une longue
    suite d'ajouts est constante.
  - **En moyenne** : une table de hachage dépend de la répartition de ses clés. Avec de nombreuses collisions, elle
    tombe à O(n).
  - **Une fois la position trouvée** : insérer dans une liste est en O(1), mais **trouver** où insérer demande de
    la parcourir, en O(n).

  **Un vecteur trié.** Sur un vecteur trié, `std::lower_bound` ou `std::binary_search` cherchent en O(log n), comme
  une map, et sans ses allocations. Pour des données qu'on remplit une fois puis qu'on consulte, c'est souvent le
  meilleur choix.

  **Ce que la notation ne dit pas.** Le grand O ignore les **constantes**, et la mémoire cache des processeurs en
  crée de grosses. Parcourir un vecteur lit de la mémoire contiguë ; parcourir une liste ou une map saute de nœud en
  nœud, et chaque saut peut coûter cent fois plus qu'une lecture voisine. Deux conséquences :

  - pour quelques dizaines d'éléments, une recherche linéaire dans un vecteur bat souvent une map ;
  - une insertion au milieu d'un vecteur, en O(n), bat souvent celle d'une liste, en O(1), parce qu'il faut d'abord
    atteindre la position.

  La complexité guide le choix ; **la mesure** le confirme.

  **En entretien** : « Vecteur : accès O(1), ajout à la fin O(1) amorti, insertion ailleurs O(n). Map : tout en
  O(log n). Table de hachage : O(1) en moyenne, O(n) au pire. Et la localité mémoire fait qu'un vecteur gagne plus
  souvent que la théorie ne le dit. »
cards:
  - key: acces-vector
    format: course
    question: "Quel est le coût de `v[i]` sur un `std::vector` d'un million d'éléments ?"
    choices:
      - {text: "O(1) : l'adresse se calcule à partir de l'indice", correct: true}
      - {text: "O(n) : il faut parcourir les éléments jusqu'à l'indice", correct: false}
      - {text: "O(log n) : le vecteur fait une recherche dichotomique", correct: false}
      - {text: "O(1) en moyenne, O(n) quand le vecteur réalloue", correct: false}
    answer: "Les éléments sont contigus et de même taille : l'élément d'indice `i` se trouve à l'adresse du début, plus `i` fois la taille d'un élément."
  - key: recherche-map
    format: course
    question: "Quel est le coût d'une recherche par clé dans une `std::map` ?"
    choices:
      - {text: "O(log n), dans tous les cas", correct: true}
      - {text: "O(1) en moyenne, O(n) dans le pire cas", correct: false}
      - {text: "O(n), dans tous les cas", correct: false}
      - {text: "O(1), dans tous les cas", correct: false}
    answer: "L'arbre est équilibré : sa hauteur vaut environ log₂ n, et la recherche descend d'un niveau par comparaison. C'est une garantie, pas une moyenne."
  - key: insertion-liste
    format: course
    question: "Insérer dans une `std::list` est en O(1). Pourquoi est-ce souvent trompeur ?"
    choices:
      - {text: "Il faut d'abord atteindre la position, en parcourant la liste en O(n)", correct: true}
      - {text: "La liste doit être triée de nouveau après chaque insertion", correct: false}
      - {text: "La liste réalloue tous ses nœuds à chaque insertion", correct: false}
      - {text: "L'insertion n'est en O(1) qu'en tête de liste", correct: false}
    answer: "Le O(1) ne couvre que le raccordement du nouveau nœud. Sans itérateur déjà placé au bon endroit, la recherche de la position domine."
  - key: limites-grand-o
    format: course
    question: "Pourquoi un `std::vector` bat-il souvent une `std::list`, même là où la complexité favorise la liste ?"
    choices:
      - {text: "Ses éléments contigus profitent de la mémoire cache du processeur", correct: true}
      - {text: "Le compilateur remplace les listes par des vecteurs en optimisant", correct: false}
      - {text: "Les éléments d'un vecteur occupent moins de bits que ceux d'une liste", correct: false}
      - {text: "Une liste verrouille chaque nœud avant de le lire", correct: false}
    answer: "La notation ignore les constantes. Lire de la mémoire contiguë est très rapide ; suivre un pointeur vers un nœud éloigné peut coûter cent fois plus."
  - key: vf-push-back-toujours
    format: true-false
    question: "Chaque `push_back` sur un `std::vector` s'exécute en temps constant."
    truth: false
    answer: "Celui qui déclenche une réallocation coûte O(n). C'est la moyenne sur une suite d'ajouts qui est constante : on dit « amorti »."
  - key: vf-insertion-tete-vector
    format: true-false
    question: "Insérer en tête d'un `std::vector` coûte O(n)."
    truth: true
    answer: Tous les éléments doivent être décalés d'une case.
  - key: vf-hachage-pire-cas
    format: true-false
    question: "Une recherche dans une `std::unordered_map` peut coûter O(n)."
    truth: true
    answer: "Dans le pire cas, quand de nombreuses clés tombent dans la même case. En moyenne, elle coûte O(1)."
  - key: vf-map-plus-rapide
    format: true-false
    question: "Chercher une valeur dans un `std::vector` non trié coûte O(log n)."
    truth: false
    answer: "Sans ordre, il faut comparer les éléments un par un : O(n). La recherche en O(log n) demande un vecteur trié."
  - key: qcm-ajout-en-tete
    format: multiple-choice
    question: "Quel conteneur ajoute un élément en tête en O(1), tout en gardant l'accès par indice en O(1) ?"
    choices:
      - {text: "`std::deque`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::list`", correct: false}
      - {text: "`std::set`", correct: false}
    answer: "`std::deque` ajoute aux deux bouts en temps constant, et s'indexe. Un vecteur décale tout ; une liste n'a pas d'indice."
  - key: qcm-vingt-comparaisons
    format: multiple-choice
    question: "Combien de comparaisons environ demande une recherche dans une `std::map` d'un million d'éléments ?"
    choices:
      - {text: "Une vingtaine", correct: true}
      - {text: "Une seule", correct: false}
      - {text: "Un millier", correct: false}
      - {text: "Un million", correct: false}
    answer: "log₂ d'un million vaut environ 20. Doubler la taille n'ajoute qu'une comparaison."
  - key: qcm-vecteur-trie
    format: multiple-choice
    question: "Quel est le coût de `std::binary_search` sur un `std::vector` trié ?"
    choices:
      - {text: "O(log n)", correct: true}
      - {text: "O(1)", correct: false}
      - {text: "O(n)", correct: false}
      - {text: "O(n log n)", correct: false}
    answer: "La recherche dichotomique élimine la moitié des éléments à chaque étape. Elle exige un vecteur trié."
  - key: qcm-effacer-milieu
    format: multiple-choice
    question: "Quel est le coût de `v.erase(v.begin())` sur un `std::vector` ?"
    choices:
      - {text: "O(n)", correct: true}
      - {text: "O(1)", correct: false}
      - {text: "O(log n)", correct: false}
      - {text: "O(1) amorti", correct: false}
    answer: "Retirer le premier élément décale tous les autres d'une case vers le début."
  - key: situation-file-avec-vector
    format: scenario
    question: |-
      Une file de messages est un `std::vector` : on ajoute avec `push_back`, on retire avec
      `erase(v.begin())`. Avec cent mille messages en attente, le programme rame. Que proposes-tu ?
    choices:
      - {text: "Une `std::deque`, qui retire en tête en O(1)", correct: true}
      - {text: "Un `reserve` de cent mille éléments sur le vecteur", correct: false}
      - {text: "Une `std::map` dont la clé est le numéro du message", correct: false}
      - {text: "Un `shrink_to_fit` après chaque retrait", correct: false}
    answer: |-
      Chaque `erase(v.begin())` décale tous les messages restants : O(n) par retrait, donc O(n²) pour vider la file.
      Une `std::deque` (ou `std::queue`, qui s'appuie dessus) retire en tête en temps constant.
  - key: situation-recherche-lineaire
    format: scenario
    question: |-
      Une fonction vérifie, pour chacune des cent mille lignes d'un fichier, si son identifiant figure dans un
      `std::vector` de cinquante mille identifiants interdits, avec `std::find`. Elle met des minutes. Que
      proposes-tu ?
    choices:
      - {text: "Ranger les identifiants interdits dans un `std::unordered_set`", correct: true}
      - {text: "Ranger les identifiants interdits dans une `std::list`", correct: false}
      - {text: "Appeler `reserve` sur le vecteur des identifiants interdits", correct: false}
      - {text: "Parcourir le vecteur des identifiants à l'envers", correct: false}
    answer: |-
      `std::find` est en O(n) : cent mille recherches de cinquante mille comparaisons font des milliards
      d'opérations. Un ensemble haché répond en O(1) en moyenne. Trier le vecteur et chercher avec
      `std::binary_search` conviendrait aussi.
  - key: situation-petite-collection
    format: scenario
    question: |-
      Un collègue veut remplacer un `std::vector` de huit paires clé-valeur, consulté sans cesse, par une
      `std::unordered_map` « parce que O(1) bat O(n) ». Que lui réponds-tu ?
    choices:
      - {text: "Que pour huit éléments le vecteur est sans doute plus rapide, et qu'il faut mesurer", correct: true}
      - {text: "Que la table de hachage est toujours plus rapide, quelle que soit la taille", correct: false}
      - {text: "Qu'une `std::list` serait plus rapide que les deux, pour huit éléments", correct: false}
      - {text: "Qu'un vecteur ne peut pas contenir de paires clé-valeur", correct: false}
    answer: |-
      La notation décrit la croissance, pas le coût pour un petit `n`. Huit paires contiguës tiennent dans une ou
      deux lignes de cache : les parcourir coûte moins que calculer un hachage et suivre un pointeur. La mesure
      tranche.
  - key: situation-donnees-figees
    format: scenario
    question: |-
      Un dictionnaire de cent mille mots est chargé une fois au démarrage, puis seulement consulté. Tu veux des
      recherches rapides et peu de mémoire. Quelle structure proposes-tu ?
    choices:
      - {text: "Un `std::vector` trié, consulté avec `std::binary_search`", correct: true}
      - {text: "Une `std::list`, consultée avec `std::find`", correct: false}
      - {text: "Un `std::vector` non trié, consulté avec `std::find`", correct: false}
      - {text: "Une `std::deque`, consultée par ses deux bouts", correct: false}
    answer: |-
      Trié une fois, le vecteur se consulte en O(log n), comme une map, sans les pointeurs ni les allocations de
      chaque nœud. Quand les données ne changent plus, c'est compact et rapide. Un `std::unordered_set` conviendrait
      aussi, pour plus de mémoire.
  - key: definition-grand-o
    format: definition
    question: "Que décrit la notation O(n) ?"
    choices:
      - {text: "Un coût qui grandit proportionnellement au nombre d'éléments", correct: true}
      - {text: "Un coût qui ne dépend pas du nombre d'éléments", correct: false}
      - {text: "Un coût mesuré en nanosecondes par élément", correct: false}
      - {text: "Un coût qui double à chaque élément ajouté", correct: false}
    answer: "Le grand O donne l'allure de la croissance, pas une durée. Deux fois plus d'éléments, deux fois plus de travail."
  - key: definition-amorti
    format: definition
    question: "Que veut dire « temps constant amorti » ?"
    choices:
      - {text: "Que le coût moyen sur une longue suite d'opérations est constant, même si certaines sont chères", correct: true}
      - {text: "Que chaque opération prise isolément s'exécute exactement dans le même temps que les autres", correct: false}
      - {text: "Que le coût de chaque opération diminue à mesure que le conteneur se remplit d'éléments", correct: false}
      - {text: "Que le coût est constant seulement quand le conteneur contient très peu d'éléments", correct: false}
    answer: "C'est le cas de `push_back` : quelques ajouts réallouent, en O(n), mais ils sont assez rares pour que le total de n ajouts reste en O(n)."
  - key: definition-logarithmique
    format: definition
    question: "Que veut dire qu'une opération est en O(log n) ?"
    choices:
      - {text: "Que doubler le nombre d'éléments n'ajoute qu'une étape", correct: true}
      - {text: "Que doubler le nombre d'éléments double le nombre d'étapes", correct: false}
      - {text: "Que le nombre d'étapes ne dépend pas du nombre d'éléments", correct: false}
      - {text: "Que le nombre d'étapes est le carré du nombre d'éléments", correct: false}
    answer: "À chaque étape, on écarte la moitié de ce qui reste. C'est le coût d'une recherche dans un arbre équilibré ou dans un tableau trié."
  - key: definition-localite
    format: definition
    question: "Qu'appelle-t-on la localité mémoire ?"
    choices:
      - {text: "Le fait que des données lues ensemble soient voisines en mémoire", correct: true}
      - {text: "Le fait que des données soient allouées sur la pile", correct: false}
      - {text: "Le fait que des données ne soient visibles que d'une fonction", correct: false}
      - {text: "Le fait que des données soient partagées entre deux threads", correct: false}
    answer: "Le processeur charge la mémoire par blocs voisins dans son cache. Des éléments contigus, comme ceux d'un vecteur, arrivent ensemble : les lire ensuite ne coûte presque rien."
