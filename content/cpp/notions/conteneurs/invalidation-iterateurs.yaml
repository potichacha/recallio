notion: invalidation-iterateurs
lesson: |-
  Un itérateur, un pointeur ou une référence vers un élément d'un conteneur désignent **un endroit de la mémoire**.
  Si le conteneur déplace ou détruit l'élément, ils désignent autre chose, ou plus rien : ils sont **invalidés**.
  S'en servir ensuite est un **comportement indéfini**, que le compilateur ne signale pas.

  **`std::vector`.**

  | Opération | Ce qui est invalidé |
  |---|---|
  | `push_back`, `emplace_back`, `insert` **avec réallocation** | **tout** |
  | les mêmes, sans réallocation | ce qui se trouve **à partir** du point d'insertion, et `end()` |
  | `erase` | ce qui se trouve **à partir** de l'élément effacé, et `end()` |
  | `reserve`, `resize`, `shrink_to_fit` qui réallouent | tout |
  | `clear` | tout |

  Comme on sait rarement si un ajout va réallouer, on retient : **un ajout dans un vecteur invalide tout**.

  **Les conteneurs à nœuds** (`std::list`, `std::map`, `std::set`) : chaque élément vit dans son propre nœud, qui ne
  bouge jamais. Une insertion **n'invalide rien** ; un effacement n'invalide que ce qui désignait l'élément effacé.

  **`std::unordered_map`** : une insertion peut provoquer un **rehachage**, qui invalide les **itérateurs**. Les
  références et les pointeurs vers les éléments, eux, restent valables.

  **`std::deque`** : une insertion aux bouts invalide les itérateurs, mais pas les références.

  **Les trois pièges classiques.**

  ```cpp
  int& premier = v[0];
  v.push_back(4);
  premier = 9;                         // 1. référence gardée à travers un ajout

  for (int x : v) {
      if (x == 2) { v.push_back(5); }  // 2. modifier le vecteur qu'on parcourt
  }

  for (auto it = v.begin(); it != v.end(); ++it) {
      if (*it == 2) { v.erase(it); }   // 3. continuer avec l'itérateur effacé
  }
  ```

  **Comment s'en protéger.**

  - Garder un **indice** plutôt qu'un itérateur ou un pointeur : `v[i]` reste juste après une réallocation.
  - **`reserve`** d'avance, quand on connaît la taille maximale.
  - Reprendre l'itérateur **renvoyé** par `insert` et `erase`.
  - Ne pas modifier un conteneur dans la boucle qui le parcourt : ranger les ajouts à part, ou utiliser un
    algorithme comme `std::erase_if`.

  **En entretien** : « Un ajout dans un vecteur peut réallouer, et invalide alors tous les itérateurs, pointeurs et
  références. Les conteneurs à nœuds comme `std::map` n'invalident que l'élément effacé. Dans le doute, je garde des
  indices, ou je reprends l'itérateur que la fonction renvoie. »
cards:
  - key: invalidation
    format: course
    question: "Que veut dire qu'un itérateur est « invalidé » ?"
    choices:
      - {text: "Qu'il ne désigne plus un élément valable : s'en servir est un comportement indéfini", correct: true}
      - {text: "Qu'il vaut désormais `nullptr`, et qu'on peut le tester avant de s'en servir", correct: false}
      - {text: "Qu'il lève une exception à sa prochaine utilisation", correct: false}
      - {text: "Qu'il désigne de nouveau le premier élément du conteneur", correct: false}
    answer: "Le conteneur a déplacé ou détruit l'élément. Rien ne marque l'itérateur : il garde son ancienne adresse, et rien ne permet de le vérifier."
  - key: push-back-invalide
    format: course
    question: "Pourquoi un `push_back` peut-il invalider toutes les références vers les éléments d'un vecteur ?"
    choices:
      - {text: "S'il réalloue, tous les éléments déménagent dans un nouveau bloc", correct: true}
      - {text: "Il trie le vecteur après chaque ajout", correct: false}
      - {text: "Il remet tous les éléments existants à zéro", correct: false}
      - {text: "Il verrouille le vecteur pendant l'ajout", correct: false}
    answer: "Quand la capacité ne suffit plus, le vecteur alloue un bloc plus grand, y déplace ses éléments et libère l'ancien. Les anciennes adresses désignent de la mémoire libérée."
  - key: conteneurs-a-noeuds
    format: course
    question: "Pourquoi une insertion dans une `std::map` n'invalide-t-elle aucun itérateur ?"
    choices:
      - {text: "Chaque élément vit dans son propre nœud, qui ne change jamais d'adresse", correct: true}
      - {text: "Une `std::map` réserve d'avance la mémoire de tous ses éléments", correct: false}
      - {text: "Une `std::map` met à jour tous les itérateurs existants", correct: false}
      - {text: "Une `std::map` copie ses éléments à chaque lecture", correct: false}
    answer: "Insérer ajoute un nœud et réarrange des pointeurs dans l'arbre ; les autres nœuds restent où ils sont. Seul l'effacement d'un élément invalide ce qui le désignait."
  - key: se-proteger
    format: course
    question: "Tu dois désigner un élément d'un vecteur qui va encore grandir. Que gardes-tu ?"
    choices:
      - {text: "Son indice", correct: true}
      - {text: "Un pointeur vers lui", correct: false}
      - {text: "Une référence vers lui", correct: false}
      - {text: "Un itérateur vers lui", correct: false}
    answer: "Un indice ne dépend pas de l'adresse des éléments : `v[i]` reste juste après une réallocation. Pointeur, référence et itérateur seraient tous les trois invalidés."
  - key: vf-erase-avant
    format: true-false
    question: "`erase` sur un vecteur invalide les itérateurs vers les éléments placés avant l'élément effacé."
    truth: false
    answer: "Seuls l'élément effacé et ceux qui le suivent sont touchés : ils sont décalés. Ce qui précède ne bouge pas."
  - key: vf-map-insertion
    format: true-false
    question: "Insérer dans une `std::map` laisse valables les références vers ses autres éléments."
    truth: true
    answer: Les nœuds d'une map ne bougent jamais. C'est une garantie du standard.
  - key: vf-compilateur
    format: true-false
    question: Le compilateur refuse un programme qui se sert d'un itérateur invalidé.
    truth: false
    answer: "Il ne voit rien : c'est un comportement indéfini à l'exécution. Les outils comme AddressSanitizer, ou le mode débogage de la bibliothèque (`-D_GLIBCXX_DEBUG`), le détectent."
  - key: vf-reserve
    format: true-false
    question: "Tant que la taille ne dépasse pas la capacité réservée, un `push_back` n'invalide pas les références vers les éléments."
    truth: true
    answer: "Sans réallocation, les éléments restent en place. Seul `end()` change."
  - key: qcm-rien-invalide
    format: multiple-choice
    question: "Dans lequel de ces conteneurs un ajout n'invalide-t-il jamais les itérateurs existants ?"
    choices:
      - {text: "`std::list`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::deque`", correct: false}
      - {text: "`std::string`", correct: false}
    answer: "Une liste chaînée ajoute un nœud sans toucher aux autres. `std::vector`, `std::deque` et `std::string` peuvent déplacer leurs éléments."
  - key: qcm-unordered-map
    format: multiple-choice
    question: "Que peut invalider une insertion dans une `std::unordered_map` ?"
    choices:
      - {text: "Les itérateurs, en cas de rehachage ; pas les références vers les éléments", correct: true}
      - {text: "Les références vers les éléments ; pas les itérateurs", correct: false}
      - {text: "Les itérateurs comme les références, à chaque insertion", correct: false}
      - {text: "Rien, dans aucun cas", correct: false}
    answer: "Un rehachage redistribue les éléments entre les cases : les itérateurs sont perdus. Mais chaque élément reste dans son nœud : pointeurs et références restent valables."
  - key: qcm-clear
    format: multiple-choice
    question: "Que deviennent les itérateurs vers les éléments d'un vecteur après `v.clear()` ?"
    choices:
      - {text: "Ils sont tous invalidés", correct: true}
      - {text: "Ils désignent tous `v.begin()`", correct: false}
      - {text: "Ils restent valables, car la capacité est gardée", correct: false}
      - {text: "Ils valent tous `nullptr`", correct: false}
    answer: "Les éléments sont détruits. La mémoire reste allouée, mais elle ne contient plus d'objets."
  - key: qcm-detecter
    format: multiple-choice
    question: "Quel outil signale l'usage d'un itérateur invalidé, à l'exécution ?"
    choices:
      - {text: "AddressSanitizer (`-fsanitize=address`)", correct: true}
      - {text: "L'option d'optimisation `-O2`", correct: false}
      - {text: "Le mot-clé `const`", correct: false}
      - {text: "L'attribut `[[nodiscard]]`", correct: false}
    answer: "AddressSanitizer détecte la lecture d'une mémoire libérée. Le mode débogage de libstdc++, `-D_GLIBCXX_DEBUG`, vérifie aussi les itérateurs."
  - key: code-indice-stable
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          std::size_t i = 1;
          for (int n = 0; n < 100; ++n) {
              v.push_back(n);
          }
          std::println("{}", v[i]);
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`99`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`2` : un indice ne dépend pas de l'adresse des éléments. Après toutes les réallocations, `v[1]` vaut toujours 2."
    check:
      output: "2"
  - key: code-map-reference
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>

      int main() {
          std::map<int, int> m{{1, 10}};
          int& valeur = m[1];
          for (int i = 2; i < 100; ++i) {
              m[i] = i;
          }
          valeur = 99;
          std::println("{} {}", m[1], m.size());
      }
      ```
    choices:
      - {text: "`99 99`", correct: true}
      - {text: "`10 99`", correct: false}
      - {text: "`99 100`", correct: false}
      - {text: "`10 100`", correct: false}
    answer: "`99 99` : les insertions dans une map ne déplacent aucun élément. La référence désigne toujours la valeur de la clé 1. Les clés vont de 1 à 99 : 99 éléments."
    check:
      output: "99 99"
  - key: code-reserve-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          v.reserve(10);
          v.push_back(1);
          int& premier = v[0];
          v.push_back(2);
          v.push_back(3);
          premier = 7;
          std::println("{} {}", v[0], v.size());
      }
      ```
    choices:
      - {text: "`7 3`", correct: true}
      - {text: "`1 3`", correct: false}
      - {text: "`7 10`", correct: false}
      - {text: "`1 10`", correct: false}
    answer: "`7 3` : la capacité de 10 suffit, donc aucun `push_back` ne réalloue. La référence reste valable."
    check:
      output: "7 3"
  - key: code-erase-reprise
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 2, 3};
          for (auto it = v.begin(); it != v.end();) {
              if (*it == 2) {
                  it = v.erase(it);
              } else {
                  ++it;
              }
          }
          std::println("{} {} {}", v.size(), v[0], v[1]);
      }
      ```
    choices:
      - {text: "`2 1 3`", correct: true}
      - {text: "`3 1 2`", correct: false}
      - {text: "`4 1 2`", correct: false}
      - {text: "`2 1 2`", correct: false}
    answer: "`2 1 3` : on reprend l'itérateur que renvoie `erase`, sans l'incrémenter. Les deux 2, pourtant voisins, sont retirés."
    check:
      output: "2 1 3"
  - key: bug-reference-puis-push-back
    format: bug-fix
    question: |-
      Ce programme devrait afficher `9`, et affiche `1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          int& premier = v[0];
          v.push_back(4);
          premier = 9;
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Écrire `v[0] = 9;` après le `push_back`, sans garder de référence", correct: true}
      - {text: "Déclarer `premier` avec le type `const int&`", correct: false}
      - {text: "Remplacer `push_back(4)` par `emplace_back(4)`", correct: false}
      - {text: "Prendre un pointeur `int* premier = &v[0];` à la place de la référence", correct: false}
    answer: |-
      ```cpp
      v.push_back(4);
      v[0] = 9;
      ```
      Le vecteur était plein : `push_back` a réalloué, et `premier` désigne l'ancien bloc, libéré. L'écriture est un
      comportement indéfini, qui ici se perd. Un pointeur aurait le même défaut.
  - key: bug-ajout-pendant-parcours
    format: bug-fix
    question: |-
      Ce programme devrait ajouter le double de chaque élément à la fin du vecteur. Son comportement est indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (int x : v) {
              v.push_back(x * 2);
          }
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Parcourir par indice jusqu'à la taille de départ, relevée avant la boucle", correct: true}
      - {text: "Parcourir avec `const int& x` à la place de `int x`", correct: false}
      - {text: "Remplacer `push_back` par `emplace_back`", correct: false}
      - {text: "Appeler `v.shrink_to_fit();` avant la boucle", correct: false}
    answer: |-
      ```cpp
      const std::size_t taille = v.size();
      for (std::size_t i = 0; i < taille; ++i) {
          v.push_back(v[i] * 2);
      }
      ```
      La boucle sur un intervalle garde des itérateurs sur le vecteur ; le premier `push_back` qui réalloue les
      invalide. Les indices, eux, restent justes.
  - key: bug-erase-sans-reprise
    format: bug-fix
    question: |-
      Ce programme devrait retirer les 2. Son comportement est indéfini. Quelle ligne corrige la boucle ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto it = v.begin(); it != v.end(); ++it) {
              if (*it == 2) {
                  v.erase(it);
              }
          }
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Remplacer toute la boucle par `std::erase(v, 2);`", correct: true}
      - {text: "Écrire `v.erase(it++);` dans la condition", correct: false}
      - {text: "Écrire `v.erase(*it);` dans la condition", correct: false}
      - {text: "Déclarer `it` avec `const auto` au lieu de `auto`", correct: false}
    answer: |-
      ```cpp
      std::erase(v, 2);
      ```
      Après `v.erase(it)`, `it` est invalidé : l'incrémenter est une faute. `std::erase` (C++20) retire toutes les
      occurrences sans boucle. À la main, on écrirait `it = v.erase(it);`, sans incrémenter ce tour-là.
  - key: bug-pointeur-garde
    format: bug-fix
    question: |-
      Ce programme garde un pointeur vers le meilleur joueur, puis ajoute des joueurs. Il plante au
      moment de l'afficher. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> joueurs{"Ada Lovelace, mathématicienne"};
          const std::string* meilleur = &joueurs[0];
          joueurs.push_back("Grace Hopper, informaticienne");
          joueurs.push_back("Alan Turing, mathématicien");
          std::println("{}", *meilleur);
      }
      ```
    choices:
      - {text: "Garder l'indice du meilleur joueur, et lire `joueurs[indice]`", correct: true}
      - {text: "Déclarer `meilleur` avec le type `std::string*`, sans `const`", correct: false}
      - {text: "Remplacer `&joueurs[0]` par `&joueurs.front()`", correct: false}
      - {text: "Remplacer `&joueurs[0]` par `joueurs.data()`", correct: false}
    answer: |-
      ```cpp
      std::size_t meilleur = 0;
      // ...
      std::println("{}", joueurs[meilleur]);
      ```
      Les `push_back` réallouent : le pointeur désigne une chaîne détruite. L'indice reste juste quel que soit le
      nombre d'ajouts.
  - key: situation-cache
    format: scenario
    question: |-
      Une classe range ses objets dans un `std::vector<Session>`, et distribue des pointeurs `Session*` au reste du
      programme. De nouvelles sessions s'ajoutent sans cesse, et le programme plante de temps en temps. Que
      proposes-tu ?
    choices:
      - {text: "Ranger des `std::unique_ptr<Session>` dans le vecteur : les sessions ne déménagent plus", correct: true}
      - {text: "Distribuer des références `Session&` à la place des pointeurs", correct: false}
      - {text: "Distribuer des itérateurs du vecteur à la place des pointeurs", correct: false}
      - {text: "Appeler `shrink_to_fit` sur le vecteur après chaque ajout", correct: false}
    answer: |-
      Chaque réallocation déplace les sessions, et tous les pointeurs distribués deviennent invalides. Avec un
      vecteur de `std::unique_ptr`, ce sont les pointeurs qui déménagent : chaque session reste à son adresse sur le
      tas. Une `std::list` ou une `std::map` donneraient aussi des adresses stables.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, tu lis :
      ```cpp
      auto it = std::find(v.begin(), v.end(), cible);
      v.push_back(nouveau);
      if (it != v.end()) { traiter(*it); }
      ```
      Que dis-tu ?
    choices:
      - {text: "Que `it` peut être invalidé par le `push_back` : il faut chercher après l'ajout", correct: true}
      - {text: "Que `std::find` ne fonctionne pas sur un vecteur", correct: false}
      - {text: "Que `push_back` doit être remplacé par `emplace_back` pour garder `it`", correct: false}
      - {text: "Que le code est juste : `it` est comparé à `v.end()` avant d'être lu", correct: false}
    answer: |-
      Si le `push_back` réalloue, `it` désigne l'ancien bloc. Le comparer à `v.end()` ne protège de rien : il n'est
      égal à rien de valable. On déplace la recherche après l'ajout, ou l'on garde un indice.
  - key: situation-choix-conteneur
    format: scenario
    question: |-
      Tu écris un registre d'abonnés : chaque abonné reçoit une référence vers son entrée, qu'il garde longtemps, et
      de nouveaux abonnés s'inscrivent à tout moment. Quel conteneur convient ?
    choices:
      - {text: "Une `std::map`, dont les éléments ne changent jamais d'adresse", correct: true}
      - {text: "Un `std::vector`, sans rien réserver", correct: false}
      - {text: "Une `std::string`, où l'on range les entrées bout à bout", correct: false}
      - {text: "Un `std::vector`, sur lequel on appelle `clear` avant chaque ajout", correct: false}
    answer: |-
      Les conteneurs à nœuds (`std::map`, `std::set`, `std::list`) garantissent que les références restent valables
      tant que l'élément n'est pas effacé. `std::unordered_map` convient aussi pour les références. Un vecteur les
      invaliderait à la première réallocation.
  - key: situation-symptome
    format: scenario
    question: |-
      Un programme tourne bien avec dix éléments, et plante avec dix mille. Le code garde un itérateur sur un
      vecteur tout en continuant à le remplir. Pourquoi le défaut ne se voyait-il pas avant ?
    choices:
      - {text: "Avec peu d'éléments, la mémoire libérée gardait encore ses anciennes valeurs", correct: true}
      - {text: "Un vecteur de moins de cent éléments ne réalloue jamais", correct: false}
      - {text: "Les itérateurs ne sont invalidés qu'au-delà de mille éléments", correct: false}
      - {text: "Le compilateur corrige les itérateurs des petits vecteurs", correct: false}
    answer: |-
      Le comportement était déjà indéfini. Un bloc libéré contient souvent encore ses données, tant que rien ne le
      réutilise : le programme « marchait » par chance. AddressSanitizer aurait signalé la faute dès dix éléments.
