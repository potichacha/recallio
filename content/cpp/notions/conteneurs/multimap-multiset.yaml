notion: multimap-multiset
lesson: |-
  `std::map` et `std::set` n'acceptent qu'un exemplaire de chaque clé. Leurs variantes **`multi`** gardent les
  **doublons**, tout en restant **triées**.

  | Conteneur | Contient | En-tête |
  |---|---|---|
  | `std::multiset<T>` | des valeurs triées, répétées autant de fois qu'on les insère | `<set>` |
  | `std::multimap<K, V>` | des paires clé-valeur triées par clé, plusieurs valeurs par clé | `<map>` |

  Il existe aussi `std::unordered_multiset` et `std::unordered_multimap`, hachés et sans ordre.

  ```cpp
  std::multiset<int> notes{12, 15, 12, 9};        // 9 12 12 15
  std::multimap<std::string, int> scores;
  scores.insert({"Ada", 3});
  scores.insert({"Ada", 7});                      // les deux sont gardés
  ```

  **Ce qui change par rapport à `map` et `set`.**

  - `insert` **réussit toujours** : il renvoie un itérateur, et non une paire avec un booléen.
  - `count(cle)` peut dépasser 1 : il donne le **nombre d'occurrences**.
  - `erase(cle)` retire **toutes** les occurrences, et renvoie leur nombre. Pour n'en retirer qu'une, on passe un
    **itérateur** : `m.erase(m.find(cle))`.
  - `std::multimap` n'a **ni `operator[]` ni `at()`** : une clé ne désigne plus une valeur unique.
  - `find(cle)` renvoie **une** des occurrences (la première, en pratique).

  **Parcourir toutes les valeurs d'une clé : `equal_range`.** Il renvoie une paire d'itérateurs, qui délimite
  l'intervalle des éléments de cette clé.

  ```cpp
  auto [debut, fin] = scores.equal_range("Ada");
  for (auto it = debut; it != fin; ++it) {
      std::println("{}", it->second);
  }
  ```

  `lower_bound(cle)` et `upper_bound(cle)` donnent chacune de ces deux bornes.

  **L'ordre des doublons.** Les éléments de même clé gardent leur **ordre d'insertion**.

  **`std::multimap` ou une map de vecteurs ?** `std::map<K, std::vector<V>>` range la même information. Elle est
  souvent plus commode : `m[cle].push_back(v)`, toutes les valeurs d'une clé d'un seul tenant, et une mémoire plus
  compacte. `std::multimap` convient quand on insère et retire des paires une à une, en gardant des itérateurs
  stables.

  **Les usages de `std::multiset`.** Garder une collection triée avec ses doublons : des scores, des horaires, une
  file de priorité dont on veut aussi retirer au milieu.

  **En entretien** : « `multimap` et `multiset` sont les versions de `map` et `set` qui gardent les doublons,
  toujours triées. Pas d'`operator[]` sur une `multimap` ; `equal_range` donne l'intervalle des valeurs d'une clé,
  et `erase(cle)` les retire toutes. Souvent, une `map` de vecteurs fait aussi bien. »
cards:
  - key: difference
    format: course
    question: "Qu'est-ce qui distingue un `std::multiset` d'un `std::set` ?"
    choices:
      - {text: "Il garde plusieurs exemplaires d'une même valeur, toujours triés", correct: true}
      - {text: "Il garde ses valeurs dans leur ordre d'insertion, sans les trier", correct: false}
      - {text: "Il associe plusieurs valeurs à chaque élément de l'ensemble", correct: false}
      - {text: "Il range ses valeurs dans une table de hachage, sans ordre", correct: false}
    answer: "Les doublons sont acceptés ; l'arbre reste trié. Insérer deux fois 12 donne deux éléments 12, voisins."
  - key: equal-range
    format: course
    question: "Que renvoie `m.equal_range(cle)` sur une `std::multimap` ?"
    choices:
      - {text: "Une paire d'itérateurs, qui délimite les éléments de cette clé", correct: true}
      - {text: "Un vecteur qui contient les valeurs associées à cette clé", correct: false}
      - {text: "Le nombre d'éléments qui portent cette clé", correct: false}
      - {text: "Un booléen : `true` si la clé est présente plusieurs fois", correct: false}
    answer: "L'intervalle est semi-ouvert : `[premier, dernier)`. Si la clé est absente, les deux itérateurs sont égaux."
  - key: pas-de-crochets
    format: course
    question: "Pourquoi `std::multimap` n'a-t-elle pas d'`operator[]` ?"
    choices:
      - {text: "Une clé peut désigner plusieurs valeurs : `m[cle]` serait ambigu", correct: true}
      - {text: "Ses clés ne sont pas triées, donc introuvables par recherche", correct: false}
      - {text: "Ses valeurs sont constantes, donc non modifiables", correct: false}
      - {text: "Son parcours ne se fait que par itérateurs inversés", correct: false}
    answer: "Avec plusieurs valeurs par clé, il n'y a pas de « la » valeur à renvoyer. On insère avec `insert` ou `emplace`, et on lit avec `equal_range`."
  - key: erase
    format: course
    question: "Que fait `ms.erase(12)` sur un `std::multiset` qui contient trois fois 12 ?"
    choices:
      - {text: "Il retire les trois, et renvoie 3", correct: true}
      - {text: "Il retire le premier, et renvoie 1", correct: false}
      - {text: "Il retire le dernier, et renvoie 1", correct: false}
      - {text: "Il ne retire rien : il faut un itérateur", correct: false}
    answer: "Par valeur, `erase` retire toutes les occurrences. Pour une seule : `ms.erase(ms.find(12))`, qui reçoit un itérateur."
  - key: vf-trie
    format: true-false
    question: "Un `std::multiset` garde ses éléments triés."
    truth: true
    answer: "Comme `std::set`, c'est un arbre équilibré. Seule l'unicité disparaît."
  - key: vf-insert
    format: true-false
    question: "`insert` sur un `std::multiset` peut échouer quand la valeur est déjà présente."
    truth: false
    answer: "Il réussit toujours, et renvoie un itérateur sur le nouvel élément, pas une paire avec un booléen."
  - key: vf-at
    format: true-false
    question: "`std::multimap` offre la fonction `at(cle)`."
    truth: false
    answer: "Ni `at` ni `operator[]` : une clé n'y désigne pas une valeur unique."
  - key: vf-ordre-insertion
    format: true-false
    question: "Dans une `std::multimap`, les éléments de même clé gardent leur ordre d'insertion."
    truth: true
    answer: "Le standard le garantit depuis C++11 : un nouvel élément se place après ceux de même clé."
  - key: qcm-occurrences
    format: multiple-choice
    question: "Quelle fonction donne le nombre d'occurrences d'une valeur dans un `std::multiset` ?"
    choices:
      - {text: "`count`", correct: true}
      - {text: "`size`", correct: false}
      - {text: "`find`", correct: false}
      - {text: "`contains`", correct: false}
    answer: "`count(valeur)` peut ici dépasser 1. `size()` compte tous les éléments, et `contains` répond seulement par oui ou non."
  - key: qcm-une-seule
    format: multiple-choice
    question: "Comment retires-tu une seule occurrence de 7 d'un `std::multiset` `ms` qui en contient plusieurs ?"
    choices:
      - {text: "`ms.erase(ms.find(7));`", correct: true}
      - {text: "`ms.erase(7);`", correct: false}
      - {text: "`ms.remove(7);`", correct: false}
      - {text: "`ms.pop(7);`", correct: false}
    answer: "`find` rend un itérateur sur une occurrence, et `erase` d'un itérateur ne retire que cet élément."
  - key: qcm-alternative
    format: multiple-choice
    question: "Quel type range aussi plusieurs valeurs par clé, avec `m[cle].push_back(v)` ?"
    choices:
      - {text: "`std::map<K, std::vector<V>>`", correct: true}
      - {text: "`std::set<std::pair<K, V>>`", correct: false}
      - {text: "`std::vector<std::map<K, V>>`", correct: false}
      - {text: "`std::map<K, V>`", correct: false}
    answer: "Une map de vecteurs garde les valeurs d'une clé d'un seul tenant. C'est souvent plus commode qu'une `std::multimap`."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::multimap` ?"
    choices:
      - {text: "`<map>`", correct: true}
      - {text: "`<multimap>`", correct: false}
      - {text: "`<set>`", correct: false}
      - {text: "`<unordered_map>`", correct: false}
    answer: "`std::multimap` est dans `<map>`, `std::multiset` dans `<set>`."
  - key: trous-multiset
    format: fill-in
    question: |-
      Complète avec l'ensemble trié qui garde les doublons :
      ```cpp
      std::___<int> notes{12, 15, 12};
      ```
    blanks:
      - [multiset]
    answer: "`std::multiset` garde les deux 12."
  - key: trous-equal-range
    format: fill-in
    question: |-
      Complète pour obtenir l'intervalle des éléments de la clé :
      ```cpp
      auto [debut, fin] = scores.___("Ada");
      ```
    blanks:
      - [equal_range]
    answer: "`equal_range` renvoie la paire d'itérateurs qui encadre les éléments de cette clé."
  - key: trous-count
    format: fill-in
    question: |-
      Complète pour afficher le nombre de fois où 12 apparaît :
      ```cpp
      std::println("{}", notes.___(12));
      ```
    blanks:
      - [count]
    answer: "`count` donne le nombre d'occurrences."
  - key: trous-insert
    format: fill-in
    question: |-
      Complète pour ajouter un score à la multimap :
      ```cpp
      std::multimap<std::string, int> scores;
      scores.___({"Ada", 7});
      ```
    blanks:
      - [insert]
    answer: "Sans `operator[]`, on ajoute avec `insert` ou `emplace`."
  - key: code-multiset
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>

      int main() {
          const std::multiset<int> ms{5, 3, 5, 1, 5};
          std::println("{} {} {} {}", ms.size(), ms.count(5), *ms.begin(), *ms.rbegin());
      }
      ```
    choices:
      - {text: "`5 3 1 5`", correct: true}
      - {text: "`3 1 1 5`", correct: false}
      - {text: "`5 3 5 5`", correct: false}
      - {text: "`3 3 1 5`", correct: false}
    answer: "`5 3 1 5` : les cinq valeurs sont gardées, dont trois 5. L'ensemble est trié : 1 en tête, 5 à la fin."
    check:
      output: "5 3 1 5"
  - key: code-equal-range
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::multimap<std::string, int> m;
          m.insert({"b", 1});
          m.insert({"a", 2});
          m.insert({"b", 3});
          int somme = 0;
          auto [debut, fin] = m.equal_range("b");
          for (auto it = debut; it != fin; ++it) {
              somme += it->second;
          }
          std::println("{} {} {}", somme, m.count("b"), m.begin()->second);
      }
      ```
    choices:
      - {text: "`4 2 2`", correct: true}
      - {text: "`3 1 1`", correct: false}
      - {text: "`4 2 1`", correct: false}
      - {text: "`6 3 2`", correct: false}
    answer: "`4 2 2` : la clé `b` a deux valeurs, 1 et 3. La multimap est triée par clé : son premier élément est celui de `a`."
    check:
      output: "4 2 2"
  - key: code-erase
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::multiset<int> ms{7, 7, 7, 2};
          ms.erase(ms.find(7));
          const auto apres_un = ms.size();
          const auto retires = ms.erase(7);
          std::println("{} {} {}", apres_un, retires, ms.size());
      }
      ```
    choices:
      - {text: "`3 2 1`", correct: true}
      - {text: "`1 0 1`", correct: false}
      - {text: "`3 1 2`", correct: false}
      - {text: "`3 3 0`", correct: false}
    answer: "`3 2 1` : `erase` d'un itérateur retire un seul 7. `erase(7)` retire ensuite les deux autres, et renvoie 2."
    check:
      output: "3 2 1"
  - key: code-ordre-doublons
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>

      int main() {
          std::multimap<int, char> m;
          m.insert({2, 'x'});
          m.insert({1, 'y'});
          m.insert({2, 'z'});
          m.insert({1, 'w'});
          for (const auto& [cle, lettre] : m) {
              std::print("{}", lettre);
          }
          std::println("");
      }
      ```
    choices:
      - {text: "`ywxz`", correct: true}
      - {text: "`xyzw`", correct: false}
      - {text: "`wyzx`", correct: false}
      - {text: "`yxwz`", correct: false}
    answer: "`ywxz` : les clés sont triées, 1 puis 2. À clé égale, les éléments gardent leur ordre d'insertion."
    check:
      output: "ywxz"
  - key: bug-crochets
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator[]' ». Quelle correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::multimap<std::string, int> scores;
          scores["Ada"] = 7;
          std::println("{}", scores.size());
      }
      ```
    choices:
      - {text: "Écrire `scores.insert({\"Ada\", 7});`", correct: true}
      - {text: "Écrire `scores.at(\"Ada\") = 7;`", correct: false}
      - {text: "Écrire `scores.push_back({\"Ada\", 7});`", correct: false}
      - {text: "Écrire `scores.find(\"Ada\") = 7;`", correct: false}
    answer: |-
      ```cpp
      scores.insert({"Ada", 7});
      ```
      Une `std::multimap` n'a ni `operator[]` ni `at()` : une clé peut y avoir plusieurs valeurs. On insère une
      paire.
  - key: bug-erase-tout
    format: bug-fix
    question: |-
      Ce programme devrait retirer un seul 5 et afficher `2`. Il affiche `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::multiset<int> ms{5, 5, 5};
          ms.erase(5);
          std::println("{}", ms.size());
      }
      ```
    choices:
      - {text: "Écrire `ms.erase(ms.find(5));`", correct: true}
      - {text: "Écrire `ms.erase(5, 1);`", correct: false}
      - {text: "Écrire `ms.erase(ms.end());`", correct: false}
      - {text: "Écrire `ms.erase(ms.count(5));`", correct: false}
    answer: |-
      ```cpp
      ms.erase(ms.find(5));
      ```
      Par valeur, `erase` retire toutes les occurrences. Avec l'itérateur que renvoie `find`, il n'en retire qu'une.
  - key: bug-find-une-seule
    format: bug-fix
    question: |-
      Ce programme devrait afficher la somme des scores d'Ada, `10`. Il affiche `3`. Quelle correction est la
      bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::multimap<std::string, int> scores{{"Ada", 3}, {"Ada", 7}};
          int somme = 0;
          const auto it = scores.find("Ada");
          if (it != scores.end()) {
              somme += it->second;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Parcourir l'intervalle que renvoie `scores.equal_range(\"Ada\")`", correct: true}
      - {text: "Appeler `scores.find(\"Ada\")` une seconde fois", correct: false}
      - {text: "Multiplier `it->second` par `scores.count(\"Ada\")`", correct: false}
      - {text: "Lire `it->first` à la place de `it->second`", correct: false}
    answer: |-
      ```cpp
      auto [debut, fin] = scores.equal_range("Ada");
      for (auto it = debut; it != fin; ++it) {
          somme += it->second;
      }
      ```
      `find` ne rend qu'une occurrence. `equal_range` délimite toutes celles de la clé.
  - key: bug-set-doublons
    format: bug-fix
    question: |-
      Ce programme devrait garder les trois notes et afficher `3`. Il affiche `2`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::set<int> notes;
          notes.insert(12);
          notes.insert(15);
          notes.insert(12);
          std::println("{}", notes.size());
      }
      ```
    choices:
      - {text: "Déclarer `std::multiset<int> notes;`", correct: true}
      - {text: "Déclarer `std::unordered_set<int> notes;`", correct: false}
      - {text: "Appeler `notes.insert(12)` une fois de plus", correct: false}
      - {text: "Appeler `notes.reserve(3);` avant les insertions", correct: false}
    answer: |-
      ```cpp
      std::multiset<int> notes;
      ```
      Un `std::set` ignore une valeur déjà présente. `std::multiset` garde chaque exemplaire, toujours trié.
