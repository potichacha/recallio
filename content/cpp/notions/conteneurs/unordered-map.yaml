notion: unordered-map
lesson: |-
  `std::unordered_map<Cle, Valeur>` offre la même interface que `std::map` (`operator[]`, `find`, `contains`, `at`,
  `insert`, `erase`), avec une autre organisation : une **table de hachage**.

  ```cpp
  #include <unordered_map>

  std::unordered_map<std::string, int> ages{{"Ada", 36}, {"Alan", 41}};
  ```

  **Comment ça marche.** Une **fonction de hachage** transforme la clé en un nombre. Ce nombre désigne une **case**
  (*bucket*) de la table, où l'élément est rangé. Chercher une clé, c'est refaire le calcul et regarder dans la
  case : un temps **constant en moyenne**, quelle que soit la taille.

  **Les collisions.** Deux clés peuvent tomber dans la même case : elles y forment une petite liste, que l'on
  parcourt en comparant les clés avec `==`. Si beaucoup de clés se retrouvent dans la même case, la recherche
  dégénère : O(n) dans le **pire cas**.

  **Le rehachage.** Le **facteur de charge** est le nombre d'éléments divisé par le nombre de cases. Quand il
  dépasse son maximum (1 par défaut), la table **s'agrandit** et redistribue tous les éléments. Ce rehachage coûte
  O(n), et **invalide les itérateurs** ; les références vers les éléments restent valables. `reserve(n)` prépare la
  table pour `n` éléments, et évite ces rehachages.

  **Pas d'ordre.** Le parcours suit les cases, pas les clés : l'ordre est **quelconque**, peut changer après une
  insertion, et diffère d'une bibliothèque à l'autre. Ne jamais compter dessus.

  **Ce que la clé doit fournir.** Une fonction de hachage, et l'égalité `==`. Les types fondamentaux,
  `std::string` et les pointeurs en ont une. Pour un type à soi, on spécialise `std::hash`, ou l'on passe un
  foncteur en troisième argument de template.

  **`std::map` ou `std::unordered_map` ?**

  | | `std::map` | `std::unordered_map` |
  |---|---|---|
  | Structure | arbre équilibré | table de hachage |
  | Recherche, insertion | O(log n) | O(1) en moyenne, O(n) au pire |
  | Ordre de parcours | clés triées | quelconque |
  | La clé doit fournir | `<` | un hachage et `==` |

  On prend `std::unordered_map` par défaut pour chercher par clé, et `std::map` quand on a besoin des clés dans
  l'ordre, ou d'un intervalle de clés.

  **En entretien** : « Une table de hachage : O(1) en moyenne, O(n) au pire si les clés entrent en collision, et
  aucun ordre de parcours. Un rehachage invalide les itérateurs. La clé doit avoir un hachage et un `==`. »
cards:
  - key: principe
    format: course
    question: "Comment une `std::unordered_map` retrouve-t-elle un élément par sa clé ?"
    choices:
      - {text: "Elle calcule le hachage de la clé, qui désigne la case où chercher", correct: true}
      - {text: "Elle descend dans un arbre trié, en comparant les clés", correct: false}
      - {text: "Elle parcourt tous ses éléments un par un, depuis le premier", correct: false}
      - {text: "Elle fait une recherche dichotomique dans un tableau trié", correct: false}
    answer: "La fonction de hachage transforme la clé en numéro de case. Il reste à comparer la clé avec les quelques éléments de cette case."
  - key: complexite
    format: course
    question: "Quel est le coût d'une recherche dans une `std::unordered_map` ?"
    choices:
      - {text: "O(1) en moyenne, O(n) dans le pire cas", correct: true}
      - {text: "O(log n) en moyenne comme dans le pire cas", correct: false}
      - {text: "O(1) en moyenne comme dans le pire cas", correct: false}
      - {text: "O(n) en moyenne, O(1) dans le meilleur cas", correct: false}
    answer: "En moyenne, chaque case contient très peu d'éléments. Le pire cas arrive quand beaucoup de clés tombent dans la même case : il faut alors toutes les comparer."
  - key: rehachage
    format: course
    question: "Qu'est-ce qu'un rehachage ?"
    choices:
      - {text: "La table s'agrandit, et redistribue tous ses éléments dans les nouvelles cases", correct: true}
      - {text: "La table trie ses éléments dans l'ordre croissant des clés", correct: false}
      - {text: "La table recalcule le hachage d'une clé qu'on vient de modifier", correct: false}
      - {text: "La table supprime les éléments dont les clés sont en collision", correct: false}
    answer: "Il se déclenche quand le facteur de charge dépasse son maximum. Il coûte O(n) et invalide les itérateurs ; `reserve` permet de l'éviter."
  - key: exigences-cle
    format: course
    question: "Que doit fournir un type pour servir de clé à une `std::unordered_map` ?"
    choices:
      - {text: "Une fonction de hachage, et l'opérateur `==`", correct: true}
      - {text: "L'opérateur `<`, et rien d'autre", correct: false}
      - {text: "Un constructeur par défaut, et l'opérateur `<`", correct: false}
      - {text: "Une conversion vers `std::string`", correct: false}
    answer: "Le hachage désigne la case ; `==` distingue les clés qui partagent une case. L'opérateur `<` est ce que demande `std::map`."
  - key: vf-ordre
    format: true-false
    question: "On peut compter sur l'ordre de parcours d'une `std::unordered_map`."
    truth: false
    answer: Il dépend de la fonction de hachage et du nombre de cases, change après un rehachage, et diffère selon la bibliothèque.
  - key: vf-references
    format: true-false
    question: "Un rehachage laisse valables les références vers les éléments de la table."
    truth: true
    answer: Chaque élément reste dans son nœud ; seuls les itérateurs sont invalidés.
  - key: vf-crochets
    format: true-false
    question: "Comme sur `std::map`, `operator[]` insère la clé quand elle est absente."
    truth: true
    answer: "Les deux conteneurs partagent ce comportement. Pour lire sans insérer : `find`, `contains` ou `at`."
  - key: vf-toujours-constante
    format: true-false
    question: "Une recherche dans une `std::unordered_map` prend toujours un temps constant."
    truth: false
    answer: "En moyenne seulement. Avec de nombreuses collisions, elle peut coûter un temps proportionnel à la taille."
  - key: qcm-cles-triees
    format: multiple-choice
    question: "Tu dois afficher des entrées dans l'ordre de leurs clés. Quel conteneur choisis-tu ?"
    choices:
      - {text: "`std::map`", correct: true}
      - {text: "`std::unordered_map`", correct: false}
      - {text: "`std::unordered_set`", correct: false}
      - {text: "`std::unordered_multimap`", correct: false}
    answer: "`std::map` garde ses clés triées. Les conteneurs `unordered_` n'offrent aucun ordre."
  - key: qcm-eviter-rehachage
    format: multiple-choice
    question: "Tu vas insérer cent mille éléments dans une `std::unordered_map`. Comment évites-tu les rehachages ?"
    choices:
      - {text: "`m.reserve(100000);` avant les insertions", correct: true}
      - {text: "`m.clear();` avant les insertions", correct: false}
      - {text: "`m.rehash(0);` après chaque insertion", correct: false}
      - {text: "`m.max_load_factor(0);` avant les insertions", correct: false}
    answer: "`reserve(n)` crée d'emblée assez de cases pour `n` éléments. La table n'a plus à s'agrandir en route."
  - key: qcm-collision
    format: multiple-choice
    question: "Que se passe-t-il quand deux clés différentes ont le même hachage ?"
    choices:
      - {text: "Elles partagent une case, et `==` les distingue", correct: true}
      - {text: "La seconde remplace la première", correct: false}
      - {text: "L'insertion lève une exception", correct: false}
      - {text: "La table se rehache aussitôt", correct: false}
    answer: "C'est une collision, un cas normal. La case contient alors plusieurs éléments, que la recherche compare un par un."
  - key: qcm-facteur-de-charge
    format: multiple-choice
    question: "Qu'est-ce que le facteur de charge d'une table de hachage ?"
    choices:
      - {text: "Le nombre d'éléments divisé par le nombre de cases", correct: true}
      - {text: "Le nombre de cases divisé par le nombre d'éléments", correct: false}
      - {text: "Le nombre de collisions depuis la création", correct: false}
      - {text: "La mémoire occupée par la table, en octets", correct: false}
    answer: "Plus il est élevé, plus les cases sont pleines. Au-delà de `max_load_factor()`, 1 par défaut, la table se rehache."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      std::unordered_map<std::string, int> ages;
      ```
    blanks:
      - [unordered_map]
    answer: "L'en-tête porte le nom du conteneur : `<unordered_map>`."
  - key: trous-reserve
    format: fill-in
    question: |-
      Complète pour préparer la table à recevoir mille éléments sans rehachage :
      ```cpp
      std::unordered_map<int, int> m;
      m.___(1000);
      ```
    blanks:
      - [reserve]
    answer: "`reserve(1000)` crée assez de cases pour mille éléments."
  - key: trous-find
    format: fill-in
    question: |-
      Complète pour tester que la clé a été trouvée :
      ```cpp
      auto it = ages.find("Ada");
      if (it != ages.___()) {
          std::println("{}", it->second);
      }
      ```
    blanks:
      - [end]
    answer: "`find` renvoie `end()` quand la clé est absente, comme sur `std::map`."
  - key: trous-erase
    format: fill-in
    question: |-
      Complète pour retirer la clé de la table :
      ```cpp
      ages.___("Ada");
      ```
    blanks:
      - [erase]
    answer: "`erase(cle)` retire l'élément, et renvoie le nombre d'éléments retirés : 0 ou 1."
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <unordered_map>

      int main() {
          std::unordered_map<std::string, int> m;
          m["a"] = 1;
          m["b"] = 2;
          m["a"] = 3;
          std::println("{} {}", m.size(), m["a"]);
      }
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "`3 1`", correct: false}
    answer: "`2 3` : les clés sont uniques. La seconde affectation à `\"a\"` remplace sa valeur."
    check:
      output: "2 3"
  - key: code-contains-erase
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <unordered_map>

      int main() {
          std::unordered_map<int, int> m{{1, 10}, {2, 20}};
          const auto retires = m.erase(1) + m.erase(5);
          std::println("{} {} {}", retires, m.contains(1), m.contains(2));
      }
      ```
    choices:
      - {text: "`1 false true`", correct: true}
      - {text: "`2 false true`", correct: false}
      - {text: "`1 true true`", correct: false}
      - {text: "`2 false false`", correct: false}
    answer: "`1 false true` : `erase` renvoie le nombre d'éléments retirés. La clé 1 existait, la clé 5 non : 1 + 0."
    check:
      output: "1 false true"
  - key: code-reference-stable
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <unordered_map>

      int main() {
          std::unordered_map<int, int> m{{0, 5}};
          int& valeur = m[0];
          for (int i = 1; i < 1000; ++i) {
              m[i] = i;
          }
          valeur = 42;
          std::println("{} {}", m[0], m.size());
      }
      ```
    choices:
      - {text: "`42 1000`", correct: true}
      - {text: "`5 1000`", correct: false}
      - {text: "`42 999`", correct: false}
      - {text: "`5 999`", correct: false}
    answer: "`42 1000` : les mille insertions provoquent plusieurs rehachages, mais ils n'invalident pas les références. `valeur` désigne toujours l'élément de clé 0."
    check:
      output: "42 1000"
  - key: code-somme
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <unordered_map>

      int main() {
          std::unordered_map<std::string, int> m{{"a", 1}, {"b", 2}, {"c", 3}};
          int somme = 0;
          for (const auto& [cle, valeur] : m) {
              somme += valeur;
          }
          std::println("{} {}", somme, m.count("z"));
      }
      ```
    choices:
      - {text: "`6 0`", correct: true}
      - {text: "`6 1`", correct: false}
      - {text: "`3 0`", correct: false}
      - {text: "`0 0`", correct: false}
    answer: "`6 0` : l'ordre du parcours est quelconque, mais la somme n'en dépend pas. `count` renvoie 0 pour une clé absente, sans l'insérer."
    check:
      output: "6 0"
  - key: bug-ordre-attendu
    format: bug-fix
    question: |-
      Ce programme devrait afficher les prénoms dans l'ordre alphabétique. L'ordre obtenu change d'une machine à
      l'autre. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <unordered_map>

      int main() {
          std::unordered_map<std::string, int> ages{{"Linus", 55}, {"Ada", 36}, {"Grace", 85}};
          for (const auto& [prenom, age] : ages) {
              std::println("{}", prenom);
          }
      }
      ```
    choices:
      - {text: "Ranger les données dans une `std::map<std::string, int>`", correct: true}
      - {text: "Appeler `ages.reserve(3);` juste avant la boucle", correct: false}
      - {text: "Appeler `ages.rehash(3);` juste avant la boucle", correct: false}
      - {text: "Insérer les prénoms dans l'ordre alphabétique", correct: false}
    answer: |-
      ```cpp
      std::map<std::string, int> ages{{"Linus", 55}, {"Ada", 36}, {"Grace", 85}};
      ```
      Une table de hachage n'a pas d'ordre, quel que soit l'ordre d'insertion. `std::map` trie par clé.
  - key: bug-cle-sans-hachage
    format: bug-fix
    question: |-
      Le compilateur refuse cette table : il ne trouve pas de fonction de hachage pour `Point`. Quelle correction
      est la plus simple ?
      ```cpp
      #include <print>
      #include <string>
      #include <unordered_map>

      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = default;
      };

      int main() {
          std::unordered_map<Point, std::string> noms;
          noms[Point{0, 0}] = "origine";
          std::println("{}", noms.size());
      }
      ```
    choices:
      - {text: "Donner `operator<=>` à `Point`, et prendre une `std::map<Point, std::string>`", correct: true}
      - {text: "Retirer `operator==` de `Point`, que la table n'utilise pas", correct: false}
      - {text: "Écrire `std::unordered_map<Point&, std::string>`", correct: false}
      - {text: "Appeler `noms.reserve(1);` avant l'insertion", correct: false}
    answer: |-
      ```cpp
      auto operator<=>(const Point&) const = default;
      // ...
      std::map<Point, std::string> noms;
      ```
      `std::unordered_map` exige un hachage, que `Point` n'a pas. `std::map` ne demande que `<`, qu'une ligne suffit
      à générer. L'autre voie est d'écrire une spécialisation de `std::hash<Point>`.
  - key: bug-iterateur-apres-insertion
    format: bug-fix
    question: |-
      Ce programme garde un itérateur, insère mille éléments, puis s'en sert. Son comportement est indéfini. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <unordered_map>

      int main() {
          std::unordered_map<int, int> m{{0, 5}};
          auto it = m.find(0);
          for (int i = 1; i < 1000; ++i) {
              m[i] = i;
          }
          std::println("{}", it->second);
      }
      ```
    choices:
      - {text: "Appeler `m.find(0)` après les insertions", correct: true}
      - {text: "Déclarer `it` avec `const auto` au lieu de `auto`", correct: false}
      - {text: "Remplacer `m[i] = i;` par `m.insert({i, i});`", correct: false}
      - {text: "Remplacer `it->second` par `(*it).second`", correct: false}
    answer: |-
      ```cpp
      const auto it = m.find(0);   // après la boucle
      ```
      Les insertions provoquent des rehachages, qui invalident les itérateurs. Une référence vers la valeur, elle,
      serait restée valable ; `m.reserve(1000)` avant la boucle éviterait aussi les rehachages.
  - key: bug-lecture-qui-insere
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1` : il ne fait que consulter les âges. Il affiche `2`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <unordered_map>

      int main() {
          std::unordered_map<std::string, int> ages{{"Ada", 36}};
          if (ages["Alan"] == 41) {
              std::println("trouvé");
          }
          std::println("{}", ages.size());
      }
      ```
    choices:
      - {text: "Chercher avec `ages.find(\"Alan\")`, et lire `it->second` s'il est trouvé", correct: true}
      - {text: "Écrire `ages[\"Alan\"] = 41` dans la condition du `if`", correct: false}
      - {text: "Appeler `ages.reserve(2);` avant la condition du `if`", correct: false}
      - {text: "Comparer `ages[\"Alan\"]` à `41u` à la place de `41`", correct: false}
    answer: |-
      ```cpp
      if (const auto it = ages.find("Alan"); it != ages.end() && it->second == 41) {
      ```
      `operator[]` insère la clé absente, avec la valeur 0. `find` consulte sans modifier.
  - key: situation-choix
    format: scenario
    question: |-
      Un service garde en mémoire un million de sessions, retrouvées par leur identifiant à chaque requête. On ne les
      parcourt jamais dans l'ordre. Quel conteneur choisis-tu, et pourquoi ?
    choices:
      - {text: "`std::unordered_map` : une recherche en temps constant, et l'ordre ne sert à rien", correct: true}
      - {text: "`std::map` : ses recherches sont toujours plus rapides que celles d'une table de hachage", correct: false}
      - {text: "`std::vector` de paires : un parcours complet reste rapide sur un million d'éléments", correct: false}
      - {text: "`std::list` de paires : les insertions y sont en temps constant", correct: false}
    answer: |-
      Sur un million d'éléments, une map fait une vingtaine de comparaisons par recherche, en sautant de nœud en
      nœud ; la table de hachage fait un calcul et un accès. Sans besoin d'ordre, elle est le bon choix.
  - key: situation-latence
    format: scenario
    question: |-
      Un programme temps réel insère dans une `std::unordered_map`. La plupart des insertions sont instantanées,
      mais quelques-unes prennent plusieurs millisecondes. D'où vient ce pic, et comment l'éviter ?
    choices:
      - {text: "D'un rehachage ; `reserve` avec la taille attendue, au démarrage, l'évite", correct: true}
      - {text: "D'un tri des clés ; `std::map` l'éviterait en les gardant triées", correct: false}
      - {text: "D'une fuite de mémoire ; `clear` après chaque insertion l'évite", correct: false}
      - {text: "D'une copie de la table ; la déclarer `const` l'évite", correct: false}
    answer: |-
      Quand le facteur de charge dépasse son maximum, la table double et redistribue tous ses éléments : un coût
      proportionnel à sa taille, d'un seul coup. En réservant d'avance, on paie ce coût une fois, hors du chemin
      critique.
  - key: situation-mauvais-hachage
    format: scenario
    question: |-
      Un collègue a écrit, pour sa classe `Client`, une fonction de hachage qui renvoie toujours `42`. Sa table de
      dix mille clients est très lente. Pourquoi ?
    choices:
      - {text: "Tous les clients tombent dans la même case : chaque recherche les parcourt tous", correct: true}
      - {text: "La table refuse les clés de même hachage, et lève une exception qu'il ignore", correct: false}
      - {text: "La table ne garde qu'un client par valeur de hachage, et réinsère les autres", correct: false}
      - {text: "La table trie les clients à chaque insertion, faute de hachage utilisable", correct: false}
    answer: |-
      Le programme reste correct : `==` distingue les clients. Mais la table se réduit à une seule liste, et la
      recherche passe de O(1) à O(n). Une bonne fonction de hachage répartit les clés entre les cases.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande dans quel cas tu choisirais `std::map` plutôt que `std::unordered_map`. Que
      réponds-tu ?
    choices:
      - {text: "Quand il me faut les clés dans l'ordre, ou toutes les clés d'un intervalle", correct: true}
      - {text: "Quand il me faut la recherche la plus rapide sur un grand nombre de clés", correct: false}
      - {text: "Quand les clés sont des chaînes, qu'une table de hachage ne sait pas ranger", correct: false}
      - {text: "Quand il me faut plusieurs valeurs différentes pour une même clé", correct: false}
    answer: |-
      L'arbre trié sait faire ce qu'une table de hachage ne sait pas : parcourir dans l'ordre, trouver la première
      clé supérieure à une borne (`lower_bound`), le plus petit ou le plus grand élément. Il offre aussi un pire cas
      garanti en O(log n).
