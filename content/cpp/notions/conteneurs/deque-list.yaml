notion: deque-list
lesson: |-
  À côté de `std::vector`, la bibliothèque offre trois autres conteneurs séquentiels. Chacun échange la mémoire
  contiguë du vecteur contre une capacité particulière.

  | Conteneur | Organisation | Ce qu'il fait bien | Ce qu'il perd |
  |---|---|---|---|
  | `std::deque` | des blocs de taille fixe, repérés par une table | ajouter et retirer **aux deux bouts** en O(1), accès par indice en O(1) | la contiguïté : pas de `data()` |
  | `std::list` | des nœuds doublement chaînés | insérer et effacer **n'importe où** en O(1), sans rien déplacer | l'accès par indice ; la localité mémoire |
  | `std::forward_list` | des nœuds simplement chaînés | comme `list`, avec un pointeur de moins par nœud | le parcours arrière, `size()`, `push_back` |

  **`std::deque`** (*double-ended queue*).

  ```cpp
  std::deque<int> d{2, 3};
  d.push_front(1);      // 1 2 3
  d.push_back(4);       // 1 2 3 4
  d.pop_front();        // 2 3 4
  int x = d[1];         // 3
  ```

  Un ajout à un bout ne déplace pas les éléments existants : les **références** vers eux restent valables (les
  itérateurs, eux, sont invalidés). C'est le conteneur sur lequel s'appuient `std::stack` et `std::queue`.

  **`std::list`.** Chaque élément vit dans son nœud, relié au précédent et au suivant.

  ```cpp
  std::list<int> l{1, 2, 4};
  auto it = std::next(l.begin(), 2);
  l.insert(it, 3);      // 1 2 3 4 : aucun élément déplacé
  ```

  - Insérer et effacer **n'invalident rien**, sauf ce qui désignait l'élément effacé.
  - Pas d'`operator[]` : atteindre le n-ième élément demande de parcourir la liste.
  - Elle a ses propres fonctions membres : `sort()`, `remove(valeur)`, `remove_if`, `unique()`, `reverse()`,
    `merge`, et **`splice`**, qui transfère des nœuds d'une liste à une autre **sans copier** ni allouer.

  **`std::forward_list`.** On ne peut avancer que dans un sens, et l'on insère **après** une position :
  `insert_after`, `erase_after`, `before_begin()`.

  **Quand s'en servir.**

  - `std::deque` : une file dont on retire en tête, ou un conteneur qui grandit beaucoup sans qu'on veuille de
    grosses réallocations.
  - `std::list` : quand des itérateurs ou des références doivent rester valables malgré de nombreuses insertions
    et suppressions, ou pour `splice`.
  - Dans le doute : **`std::vector`**. Parcourir une liste saute de nœud en nœud à travers la mémoire, et chaque
    nœud coûte une allocation : le vecteur gagne presque toujours à la mesure.

  **En entretien** : « `std::deque` ajoute aux deux bouts en temps constant et garde l'accès par indice ;
  `std::list` insère partout sans rien invalider, mais sans indice et avec une mauvaise localité. Je ne quitte
  `std::vector` que pour l'un de ces besoins précis, et je mesure. »
cards:
  - key: deque-principe
    format: course
    question: "Qu'apporte `std::deque` par rapport à `std::vector` ?"
    choices:
      - {text: "L'ajout et le retrait en tête en temps constant, en gardant l'accès par indice", correct: true}
      - {text: "L'insertion au milieu en temps constant, en gardant l'accès par indice", correct: false}
      - {text: "Une mémoire contiguë plus compacte, sans aucune réallocation", correct: false}
      - {text: "Le tri automatique de ses éléments à chaque insertion", correct: false}
    answer: "`push_front` et `pop_front` sont en O(1), comme `push_back`. En échange, les éléments ne sont plus contigus : ils sont rangés par blocs."
  - key: list-principe
    format: course
    question: "Quel est le principal avantage de `std::list` ?"
    choices:
      - {text: "Insérer et effacer n'importe où sans déplacer ni invalider les autres éléments", correct: true}
      - {text: "Accéder à n'importe quel élément par son indice en temps constant", correct: false}
      - {text: "Occuper moins de mémoire qu'un vecteur de même taille", correct: false}
      - {text: "Se parcourir plus vite qu'un vecteur, grâce à ses pointeurs", correct: false}
    answer: "Chaque élément a son nœud : on raccorde des pointeurs, rien ne bouge. Le prix : deux pointeurs par élément, une allocation par nœud, et un parcours lent."
  - key: forward-list
    format: course
    question: "Qu'est-ce qui distingue `std::forward_list` de `std::list` ?"
    choices:
      - {text: "Elle est simplement chaînée : on n'avance que dans un sens, et l'on insère après une position", correct: true}
      - {text: "Elle est doublement chaînée : on avance dans les deux sens, et l'on insère avant une position", correct: false}
      - {text: "Elle range ses éléments dans un tableau contigu, comme un vecteur", correct: false}
      - {text: "Elle trie ses éléments du plus petit au plus grand", correct: false}
    answer: "Un pointeur par nœud au lieu de deux. Elle n'a ni `size()`, ni `push_back`, ni itérateur arrière ; ses fonctions s'appellent `insert_after` et `erase_after`."
  - key: splice
    format: course
    question: "Que fait `a.splice(a.end(), b);` sur deux `std::list` ?"
    choices:
      - {text: "Il transfère les nœuds de `b` à la fin de `a`, sans copier d'élément", correct: true}
      - {text: "Il copie les éléments de `b` à la fin de `a`, et laisse `b` intacte", correct: false}
      - {text: "Il échange le contenu des deux listes", correct: false}
      - {text: "Il trie puis fusionne les deux listes", correct: false}
    answer: "`splice` raccorde des pointeurs : aucune copie, aucune allocation. Après l'appel, `b` est vide."
  - key: vf-deque-contigue
    format: true-false
    question: "Les éléments d'une `std::deque` sont rangés dans un seul bloc contigu."
    truth: false
    answer: "Ils sont répartis dans plusieurs blocs. C'est pourquoi `std::deque` n'a pas de fonction `data()`."
  - key: vf-list-indice
    format: true-false
    question: "`std::list` offre l'accès par indice avec `operator[]`."
    truth: false
    answer: "Il faut parcourir la liste : `std::next(l.begin(), n)` fait `n` pas."
  - key: vf-deque-push-front
    format: true-false
    question: "`push_front` sur une `std::deque` s'exécute en temps constant."
    truth: true
    answer: "C'est sa raison d'être. Sur un vecteur, insérer en tête décale tous les éléments."
  - key: vf-list-invalidation
    format: true-false
    question: "Insérer un élément dans une `std::list` laisse valables les itérateurs vers les autres éléments."
    truth: true
    answer: "Aucun nœud ne bouge. Seul l'effacement d'un élément invalide ce qui le désignait."
  - key: qcm-file
    format: multiple-choice
    question: "Quel conteneur séquentiel convient à une file dont on ajoute à la fin et retire en tête ?"
    choices:
      - {text: "`std::deque`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::array`", correct: false}
      - {text: "`std::forward_list`", correct: false}
    answer: "`std::deque` fait les deux en O(1). `std::forward_list` n'a pas de `push_back`, et retirer en tête d'un vecteur décale tout."
  - key: qcm-trier-liste
    format: multiple-choice
    question: "Comment tries-tu une `std::list<int> l` ?"
    choices:
      - {text: "`l.sort();`", correct: true}
      - {text: "`std::sort(l.begin(), l.end());`", correct: false}
      - {text: "`std::sort(l);`", correct: false}
      - {text: "`l.order();`", correct: false}
    answer: "`std::sort` exige des itérateurs à accès direct. La liste a sa propre fonction membre, qui est stable."
  - key: qcm-retirer-valeur
    format: multiple-choice
    question: "Quelle fonction membre de `std::list` retire tous les éléments égaux à une valeur ?"
    choices:
      - {text: "`remove`", correct: true}
      - {text: "`erase`", correct: false}
      - {text: "`pop`", correct: false}
      - {text: "`discard`", correct: false}
    answer: "`l.remove(3)` retire vraiment les éléments, contrairement à l'algorithme `std::remove`. `erase` attend un itérateur."
  - key: qcm-forward-inserer
    format: multiple-choice
    question: "Quelle fonction insère un élément dans une `std::forward_list` ?"
    choices:
      - {text: "`insert_after`", correct: true}
      - {text: "`insert`", correct: false}
      - {text: "`push_back`", correct: false}
      - {text: "`insert_before`", correct: false}
    answer: "Une liste simplement chaînée ne connaît pas le nœud précédent : on insère après une position. `before_begin()` permet d'insérer en tête."
  - key: trous-push-front
    format: fill-in
    question: |-
      Complète pour ajouter `0` en tête de la deque :
      ```cpp
      std::deque<int> d{1, 2};
      d.___(0);
      ```
    blanks:
      - [push_front, emplace_front]
    answer: "`push_front` ajoute en tête, en temps constant."
  - key: trous-sort
    format: fill-in
    question: |-
      Complète pour trier la liste :
      ```cpp
      std::list<int> l{3, 1, 2};
      l.___();
      ```
    blanks:
      - [sort]
    answer: "`std::list` a sa propre fonction membre `sort`."
  - key: trous-splice
    format: fill-in
    question: |-
      Complète pour transférer tous les nœuds de `b` à la fin de `a`, sans copie :
      ```cpp
      a.___(a.end(), b);
      ```
    blanks:
      - [splice]
    answer: "`splice` déplace les nœuds d'une liste vers une autre."
  - key: trous-pop-front
    format: fill-in
    question: |-
      Complète pour retirer le premier élément de la deque :
      ```cpp
      d.___();
      ```
    blanks:
      - [pop_front]
    answer: "`pop_front` retire en tête, sans renvoyer l'élément : on lit `front()` avant."
  - key: code-deque
    format: code-output
    question: |-
      ```cpp
      #include <deque>
      #include <print>

      int main() {
          std::deque<int> d{2, 3};
          d.push_front(1);
          d.push_back(4);
          d.pop_front();
          std::println("{} {} {}", d.front(), d[1], d.size());
      }
      ```
    choices:
      - {text: "`2 3 3`", correct: true}
      - {text: "`1 2 4`", correct: false}
      - {text: "`2 3 4`", correct: false}
      - {text: "`1 3 3`", correct: false}
    answer: "`2 3 3` : la deque vaut 1 2 3 4, puis `pop_front` retire le 1. Il reste 2 3 4 : trois éléments."
    check:
      output: "2 3 3"
  - key: code-list-insert
    format: code-output
    question: |-
      ```cpp
      #include <iterator>
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{1, 2, 4};
          auto it = std::next(l.begin(), 2);
          l.insert(it, 3);
          std::println("{} {}", *it, l.size());
      }
      ```
    choices:
      - {text: "`4 4`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`4 3`", correct: false}
      - {text: "`2 4`", correct: false}
    answer: "`4 4` : l'insertion ne déplace aucun nœud. `it` désigne toujours l'élément 4, et la liste a quatre éléments."
    check:
      output: "4 4"
  - key: code-splice
    format: code-output
    question: |-
      ```cpp
      #include <list>
      #include <print>

      int main() {
          std::list<int> a{1, 2};
          std::list<int> b{3, 4, 5};
          a.splice(a.end(), b);
          std::println("{} {} {}", a.size(), b.size(), a.back());
      }
      ```
    choices:
      - {text: "`5 0 5`", correct: true}
      - {text: "`5 3 5`", correct: false}
      - {text: "`2 3 2`", correct: false}
      - {text: "`5 0 2`", correct: false}
    answer: "`5 0 5` : les trois nœuds de `b` passent dans `a`. `b` est vide, et le dernier élément de `a` est 5."
    check:
      output: "5 0 5"
  - key: code-list-remove
    format: code-output
    question: |-
      ```cpp
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{3, 1, 3, 2, 1};
          l.remove(3);
          l.sort();
          l.unique();
          std::println("{} {} {}", l.size(), l.front(), l.back());
      }
      ```
    choices:
      - {text: "`2 1 2`", correct: true}
      - {text: "`3 1 2`", correct: false}
      - {text: "`5 1 3`", correct: false}
      - {text: "`2 1 1`", correct: false}
    answer: "`2 1 2` : `remove(3)` laisse 1 2 1 ; `sort` donne 1 1 2 ; `unique` retire le doublon voisin. Il reste 1 2."
    check:
      output: "2 1 2"
  - key: bug-crochets-list
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator[]' ». Le programme devrait afficher le troisième élément.
      Quelle correction est la bonne ?
      ```cpp
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{10, 20, 30};
          std::println("{}", l[2]);
      }
      ```
    choices:
      - {text: "Écrire `*std::next(l.begin(), 2)`", correct: true}
      - {text: "Écrire `l.at(2)`", correct: false}
      - {text: "Écrire `*(l.begin() + 2)`", correct: false}
      - {text: "Écrire `l.data()[2]`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *std::next(l.begin(), 2));
      ```
      Une liste n'a ni `operator[]`, ni `at`, ni `data`, et son itérateur ne s'additionne pas à un entier.
      `std::next` avance de deux pas. Si l'on a souvent besoin d'un indice, c'est un `std::vector` qu'il faut.
  - key: bug-sort-list
    format: bug-fix
    question: |-
      Le compilateur produit une longue erreur dans `stl_algo.h`, avec « no match for 'operator-' ». Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <list>
      #include <print>

      int main() {
          std::list<int> l{3, 1, 2};
          std::sort(l.begin(), l.end());
          std::println("{}", l.front());
      }
      ```
    choices:
      - {text: "Appeler `l.sort();`", correct: true}
      - {text: "Appeler `std::sort(l);`", correct: false}
      - {text: "Appeler `std::stable_sort(l.begin(), l.end());`", correct: false}
      - {text: "Appeler `l.order();`", correct: false}
    answer: |-
      ```cpp
      l.sort();
      ```
      `std::sort` soustrait des itérateurs, ce qu'une liste chaînée ne permet pas. Elle fournit sa propre fonction
      `sort`, qui réarrange les nœuds.
  - key: bug-push-front-vector
    format: bug-fix
    question: |-
      Le compilateur répond « 'class std::vector<int>' has no member named 'push_front' ». Le programme ajoute
      souvent en tête. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> file{2, 3};
          file.push_front(1);
          std::println("{}", file.front());
      }
      ```
    choices:
      - {text: "Déclarer `file` comme une `std::deque<int>`", correct: true}
      - {text: "Écrire `file.push_back(1);` à la place", correct: false}
      - {text: "Écrire `file[0] = 1;` à la place", correct: false}
      - {text: "Déclarer `file` comme un `std::array<int, 3>`", correct: false}
    answer: |-
      ```cpp
      std::deque<int> file{2, 3};
      file.push_front(1);
      ```
      Un vecteur n'offre pas `push_front`, parce qu'il lui faudrait décaler tous ses éléments. `std::deque` ajoute
      en tête en temps constant.
  - key: bug-forward-list-size
    format: bug-fix
    question: |-
      Le compilateur répond « 'class std::forward_list<int>' has no member named 'size' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <forward_list>
      #include <print>

      int main() {
          std::forward_list<int> l{1, 2, 3};
          std::println("{}", l.size());
      }
      ```
    choices:
      - {text: "Écrire `std::distance(l.begin(), l.end())`", correct: true}
      - {text: "Écrire `l.length()`", correct: false}
      - {text: "Écrire `l.end() - l.begin()`", correct: false}
      - {text: "Écrire `l.capacity()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::distance(l.begin(), l.end()));
      ```
      `std::forward_list` ne garde pas sa taille, pour rester aussi légère qu'une liste écrite à la main.
      `std::distance` compte les nœuds en les parcourant. Une `std::list` offre `size()`.
  - key: situation-file-messages
    format: scenario
    question: |-
      Un service garde ses messages en attente dans un `std::vector`, ajoute à la fin, et retire en tête avec
      `erase(v.begin())`. Avec des dizaines de milliers de messages, il ralentit. Que proposes-tu ?
    choices:
      - {text: "Une `std::deque`, dont `pop_front` est en temps constant", correct: true}
      - {text: "Une `std::forward_list`, dont `push_back` est en temps constant", correct: false}
      - {text: "Un `reserve` sur le vecteur, pour éviter les réallocations", correct: false}
      - {text: "Un `std::set`, qui garde les messages triés", correct: false}
    answer: |-
      Retirer le premier élément d'un vecteur décale tous les autres : O(n) à chaque message. `std::deque` retire
      en tête sans rien déplacer. `std::forward_list` n'a pas de `push_back`.
  - key: situation-liste-ou-vecteur
    format: scenario
    question: |-
      Un collègue choisit `std::list` pour dix mille entiers, « parce qu'on insère parfois au milieu ». Le programme
      passe l'essentiel de son temps à les parcourir pour les additionner. Que lui dis-tu ?
    choices:
      - {text: "Qu'un `std::vector` sera bien plus rapide : le parcours domine, et il profite du cache", correct: true}
      - {text: "Que `std::list` est le bon choix : l'insertion au milieu y est en temps constant", correct: false}
      - {text: "Qu'une `std::forward_list` serait plus rapide à parcourir qu'une `std::list`", correct: false}
      - {text: "Qu'une `std::map` conviendrait mieux, pour retrouver les entiers par leur clé", correct: false}
    answer: |-
      On choisit d'après l'opération la plus fréquente. Chaque pas dans une liste suit un pointeur vers un nœud
      alloué à part ; le vecteur se lit d'un trait. Quelques insertions au milieu de dix mille entiers restent
      rapides.
  - key: situation-references-stables
    format: scenario
    question: |-
      Un gestionnaire distribue à ses clients des itérateurs vers ses tâches, qu'ils gardent longtemps. Des tâches
      sont ajoutées et retirées sans cesse, au milieu comme aux bouts. Quel conteneur convient ?
    choices:
      - {text: "Une `std::list` : seuls les itérateurs de la tâche effacée sont invalidés", correct: true}
      - {text: "Un `std::vector` : ses itérateurs restent valables après une insertion", correct: false}
      - {text: "Une `std::deque` : ses itérateurs restent valables après une insertion", correct: false}
      - {text: "Un `std::array` : sa taille fixe garantit des itérateurs stables", correct: false}
    answer: |-
      C'est le vrai cas d'usage de la liste : la stabilité des itérateurs et des références. Un vecteur et une deque
      invalident leurs itérateurs à l'insertion.
  - key: situation-fusion
    format: scenario
    question: |-
      Deux threads remplissent chacun leur propre `std::list` de résultats. À la fin, il faut réunir un million de
      résultats en une seule liste, le plus vite possible. Que fais-tu ?
    choices:
      - {text: "`a.splice(a.end(), b);` : les nœuds changent de liste, sans copie", correct: true}
      - {text: "Une boucle de `push_back` de chaque élément de `b` dans `a`", correct: false}
      - {text: "`std::copy` de `b` vers `a`, puis `b.clear()`", correct: false}
      - {text: "`a = b;`, qui ajoute les éléments de `b` à ceux de `a`", correct: false}
    answer: |-
      `splice` raccorde la chaîne de `b` au bout de `a` en temps constant : ni copie, ni allocation. `a = b`
      remplacerait le contenu de `a`.
