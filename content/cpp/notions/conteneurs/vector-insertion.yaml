notion: vector-insertion
lesson: |-
  Un `std::vector` s'agrandit et se réduit par quatre familles de fonctions.

  **Ajouter à la fin.**

  ```cpp
  std::vector<std::string> noms;
  noms.push_back("Ada");          // construit une std::string, puis la déplace dans le vecteur
  noms.emplace_back(3, 'x');      // construit "xxx" directement dans le vecteur
  ```

  - `push_back(valeur)` reçoit un **objet** déjà construit, qu'il copie ou déplace.
  - `emplace_back(arguments...)` reçoit les **arguments du constructeur**, et construit l'élément **sur place**.

  Pour un objet qu'on a déjà, les deux se valent. `emplace_back` évite un objet temporaire quand on passe les
  arguments ; mais il accepte aussi les constructeurs `explicit`, et peut donc cacher une conversion qu'un
  `push_back` aurait refusée. La règle courante : **`push_back` par défaut**, `emplace_back` quand on construit sur
  place.

  **Retirer à la fin.** `pop_back()` retire le dernier élément, et ne renvoie **rien** : on lit `back()` avant.
  Sur un vecteur vide, c'est un comportement indéfini.

  **Insérer ailleurs.** `insert(position, valeur)` insère **avant** l'itérateur `position`, et renvoie un itérateur
  sur l'élément inséré.

  ```cpp
  v.insert(v.begin(), 0);         // en tête
  v.insert(v.begin() + 2, 9);     // avant l'élément d'indice 2
  ```

  **Effacer.** `erase(position)` retire un élément ; `erase(debut, fin)` retire l'intervalle `[debut, fin)`. Les
  deux renvoient un itérateur sur l'élément qui **suit** ce qui a été retiré.

  **Le coût.** Les éléments d'un vecteur se suivent en mémoire : insérer ou effacer ailleurs qu'à la fin oblige à
  **décaler** tous les éléments suivants. C'est proportionnel à leur nombre.

  | Opération | Coût |
  |---|---|
  | `push_back`, `emplace_back`, `pop_back` | constant (amorti pour les ajouts) |
  | `insert`, `erase` en tête ou au milieu | proportionnel au nombre d'éléments décalés |

  **Effacer dans une boucle.** `erase` invalide l'itérateur qu'on lui donne. On repart de celui qu'il renvoie :

  ```cpp
  for (auto it = v.begin(); it != v.end();) {
      if (*it < 0) {
          it = v.erase(it);       // it désigne déjà le suivant : pas de ++it
      } else {
          ++it;
      }
  }
  ```

  Depuis C++20, `std::erase_if(v, condition)` fait la même chose en une ligne, et plus vite.

  **En entretien** : « `push_back` et `pop_back` sont en temps constant ; `insert` et `erase` au milieu décalent
  les éléments suivants. `emplace_back` construit sur place à partir des arguments du constructeur. Et après un
  `erase`, je reprends l'itérateur renvoyé. »
cards:
  - key: push-back-ou-emplace-back
    format: course
    question: "Quelle différence entre `push_back` et `emplace_back` ?"
    choices:
      - {text: "`push_back` reçoit un objet ; `emplace_back` reçoit les arguments du constructeur, et construit sur place", correct: true}
      - {text: "`push_back` ajoute à la fin du vecteur ; `emplace_back` ajoute au début du vecteur", correct: false}
      - {text: "`push_back` peut provoquer une réallocation ; `emplace_back` ne réalloue jamais le vecteur", correct: false}
      - {text: "`push_back` copie toujours l'objet reçu ; `emplace_back` le déplace toujours", correct: false}
    answer: "`v.emplace_back(3, 'x')` appelle le constructeur de l'élément avec ces arguments, directement dans la mémoire du vecteur. `push_back` attend l'objet lui-même, qu'il copie ou déplace."
  - key: cout-insertion-milieu
    format: course
    question: "Pourquoi insérer en tête d'un `std::vector` coûte-t-il plus cher qu'ajouter à la fin ?"
    choices:
      - {text: "Tous les éléments suivants doivent être décalés d'une case", correct: true}
      - {text: "Le vecteur doit être trié de nouveau après l'insertion", correct: false}
      - {text: "Le vecteur réalloue toujours quand on insère en tête", correct: false}
      - {text: "L'élément inséré en tête est copié deux fois", correct: false}
    answer: "Les éléments sont contigus : pour libérer la première case, il faut déplacer tous les autres. Le coût est proportionnel à la taille. À la fin, il n'y a rien à décaler."
  - key: retour-de-erase
    format: course
    question: "Que renvoie `v.erase(it)` ?"
    choices:
      - {text: "Un itérateur sur l'élément qui suit celui qu'on a retiré", correct: true}
      - {text: "La valeur de l'élément qu'on a retiré", correct: false}
      - {text: "Le nombre d'éléments qui restent", correct: false}
      - {text: "Rien : `erase` renvoie `void`", correct: false}
    answer: "`it` lui-même est invalidé. L'itérateur renvoyé permet de continuer le parcours : `it = v.erase(it);`."
  - key: pop-back
    format: course
    question: "Que renvoie `v.pop_back()` ?"
    choices:
      - {text: "Rien : il retire le dernier élément, qu'on lit avant avec `back()`", correct: true}
      - {text: "Le dernier élément, qu'il retire du vecteur dans le même appel", correct: false}
      - {text: "Un itérateur sur le nouveau dernier élément du vecteur", correct: false}
      - {text: "`true` si le vecteur n'était pas vide", correct: false}
    answer: "`pop_back()` renvoie `void`. Pour récupérer la valeur : `auto dernier = v.back(); v.pop_back();`. Sur un vecteur vide, c'est un comportement indéfini."
  - key: vf-insert-avant
    format: true-false
    question: "`v.insert(it, x)` insère `x` avant l'élément que désigne `it`."
    truth: true
    answer: "Avec `v.begin()`, l'élément arrive en tête ; avec `v.end()`, à la fin."
  - key: vf-pop-back-vide
    format: true-false
    question: "`pop_back()` sur un vecteur vide lève une exception."
    truth: false
    answer: "C'est un comportement indéfini, sans exception. On vérifie `empty()` avant."
  - key: vf-erase-intervalle
    format: true-false
    question: "`v.erase(v.begin(), v.begin() + 2)` retire les deux premiers éléments."
    truth: true
    answer: "L'intervalle est semi-ouvert : `begin()` compris, `begin() + 2` exclu. Soit les éléments d'indices 0 et 1."
  - key: vf-emplace-toujours-mieux
    format: true-false
    question: "`emplace_back(x)` est toujours plus rapide que `push_back(x)`."
    truth: false
    answer: "Quand `x` est déjà un objet du bon type, les deux font la même copie ou le même déplacement. `emplace_back` ne gagne que lorsqu'il construit l'élément à partir des arguments."
  - key: qcm-inserer-en-tete
    format: multiple-choice
    question: "Comment insères-tu `0` en tête du vecteur `v` ?"
    choices:
      - {text: "`v.insert(v.begin(), 0);`", correct: true}
      - {text: "`v.push_front(0);`", correct: false}
      - {text: "`v.insert(0, 0);`", correct: false}
      - {text: "`v[0] = 0;`", correct: false}
    answer: "`insert` attend un itérateur, pas un indice. `std::vector` n'a pas de `push_front` : cette fonction existe sur `std::deque` et `std::list`. `v[0] = 0` remplace le premier élément."
  - key: qcm-effacer-indice
    format: multiple-choice
    question: "Comment retires-tu l'élément d'indice 2 du vecteur `v` ?"
    choices:
      - {text: "`v.erase(v.begin() + 2);`", correct: true}
      - {text: "`v.erase(2);`", correct: false}
      - {text: "`v.remove(2);`", correct: false}
      - {text: "`delete v[2];`", correct: false}
    answer: "`erase` attend un itérateur : `v.begin() + 2` désigne l'élément d'indice 2."
  - key: qcm-cout-constant
    format: multiple-choice
    question: "Laquelle de ces opérations sur un `std::vector` ne décale aucun élément ?"
    choices:
      - {text: "`v.pop_back();`", correct: true}
      - {text: "`v.erase(v.begin());`", correct: false}
      - {text: "`v.insert(v.begin(), 1);`", correct: false}
      - {text: "`v.insert(v.begin() + 1, 1);`", correct: false}
    answer: "Retirer le dernier élément ne touche à aucun autre. Les trois autres opérations décalent tout ce qui suit la position."
  - key: qcm-emplace-arguments
    format: multiple-choice
    question: "`v` est un `std::vector<std::pair<int, std::string>>`. Quelle ligne construit la paire directement dans le vecteur ?"
    choices:
      - {text: "`v.emplace_back(1, \"un\");`", correct: true}
      - {text: "`v.push_back(1, \"un\");`", correct: false}
      - {text: "`v.emplace_back({1, \"un\"});`", correct: false}
      - {text: "`v.insert(1, \"un\");`", correct: false}
    answer: "`emplace_back` transmet ses arguments au constructeur de la paire. `push_back` n'accepte qu'un seul argument : `v.push_back({1, \"un\"});`."
  - key: trous-emplace-back
    format: fill-in
    question: |-
      Complète pour construire le point directement dans le vecteur, à partir de ses coordonnées :
      ```cpp
      std::vector<Point> points;
      points.___(3, 4);
      ```
    blanks:
      - [emplace_back]
    answer: "`emplace_back(3, 4)` appelle `Point(3, 4)` dans la mémoire du vecteur."
  - key: trous-pop-back
    format: fill-in
    question: |-
      Complète pour retirer le dernier élément :
      ```cpp
      int dernier = v.back();
      v.___();
      ```
    blanks:
      - [pop_back]
    answer: "`pop_back()` retire le dernier élément, sans le renvoyer."
  - key: trous-erase-boucle
    format: fill-in
    question: |-
      Complète pour continuer le parcours après avoir effacé un élément :
      ```cpp
      for (auto it = v.begin(); it != v.end();) {
          if (*it < 0) {
              it = v.___(it);
          } else {
              ++it;
          }
      }
      ```
    blanks:
      - [erase]
    answer: "`erase` renvoie un itérateur sur l'élément suivant : on le reprend, sans incrémenter."
  - key: trous-insert
    format: fill-in
    question: |-
      Complète pour ajouter `0` en tête du vecteur :
      ```cpp
      v.___(v.begin(), 0);
      ```
    blanks:
      - [insert]
    answer: "`insert(position, valeur)` insère avant la position."
  - key: code-insert
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          v.insert(v.begin() + 1, 9);
          std::println("{} {} {} {}", v[0], v[1], v[2], v[3]);
      }
      ```
    choices:
      - {text: "`1 9 2 3`", correct: true}
      - {text: "`1 2 9 3`", correct: false}
      - {text: "`9 1 2 3`", correct: false}
      - {text: "`1 9 3 3`", correct: false}
    answer: "`1 9 2 3` : `insert` place 9 avant l'élément d'indice 1, et décale 2 et 3."
    check:
      output: "1 9 2 3"
  - key: code-erase-intervalle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 30, 40, 50};
          v.erase(v.begin() + 1, v.begin() + 3);
          std::println("{} {} {}", v.size(), v[0], v[1]);
      }
      ```
    choices:
      - {text: "`3 10 40`", correct: true}
      - {text: "`2 10 50`", correct: false}
      - {text: "`3 10 30`", correct: false}
      - {text: "`3 20 30`", correct: false}
    answer: "`3 10 40` : l'intervalle va de l'indice 1 compris à l'indice 3 exclu. 20 et 30 partent ; il reste 10, 40, 50."
    check:
      output: "3 10 40"
  - key: code-emplace-back
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> v;
          v.push_back("ab");
          v.emplace_back(3, 'x');
          std::println("{} {} {}", v.size(), v[0], v[1]);
      }
      ```
    choices:
      - {text: "`2 ab xxx`", correct: true}
      - {text: "`2 ab 3x`", correct: false}
      - {text: "`3 ab x`", correct: false}
      - {text: "`4 ab x`", correct: false}
    answer: "`2 ab xxx` : `emplace_back(3, 'x')` appelle le constructeur `std::string(3, 'x')`, qui répète trois fois le caractère."
    check:
      output: "2 ab xxx"
  - key: code-erase-retour
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{5, 6, 7, 8};
          auto it = v.erase(v.begin() + 1);
          std::println("{} {}", *it, v.size());
      }
      ```
    choices:
      - {text: "`7 3`", correct: true}
      - {text: "`6 3`", correct: false}
      - {text: "`5 3`", correct: false}
      - {text: "`7 4`", correct: false}
    answer: "`7 3` : 6 est retiré. `erase` renvoie un itérateur sur l'élément qui le suivait : 7."
    check:
      output: "7 3"
  - key: bug-erase-dans-boucle
    format: bug-fix
    question: |-
      Ce programme devrait retirer tous les nombres négatifs et afficher `2`. Il affiche `3` : un négatif est resté.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{-1, -2, 3, 4};
          for (auto it = v.begin(); it != v.end(); ++it) {
              if (*it < 0) {
                  it = v.erase(it);
              }
          }
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "N'incrémenter `it` que lorsqu'on n'a rien effacé", correct: true}
      - {text: "Écrire `v.erase(it);` sans reprendre l'itérateur renvoyé", correct: false}
      - {text: "Parcourir le vecteur avec une boucle sur un intervalle", correct: false}
      - {text: "Remplacer `v.end()` par `v.end() - 1`", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.begin(); it != v.end();) {
          if (*it < 0) {
              it = v.erase(it);
          } else {
              ++it;
          }
      }
      ```
      Après `erase`, `it` désigne déjà l'élément suivant. Le `++it` de la boucle le saute : `-2` n'est jamais examiné.
      En C++20, `std::erase_if(v, [](int x) { return x < 0; });` fait tout cela.
  - key: bug-pop-back-vide
    format: bug-fix
    question: |-
      Ce programme devrait vider la pile en affichant `2`, puis `1`. Il affiche ensuite un nombre qui n'y a jamais
      été. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> pile{1, 2};
          for (int i = 0; i < 3; ++i) {
              std::println("{}", pile.back());
              pile.pop_back();
          }
      }
      ```
    choices:
      - {text: "Boucler tant que `!pile.empty()`", correct: true}
      - {text: "Appeler `pile.pop_back();` avant `pile.back()`", correct: false}
      - {text: "Appeler `pile.reserve(3);` avant la boucle", correct: false}
      - {text: "Remplacer `pile.back()` par `pile[0]`", correct: false}
    answer: |-
      ```cpp
      while (!pile.empty()) {
          std::println("{}", pile.back());
          pile.pop_back();
      }
      ```
      Au troisième tour, le vecteur est vide : `back()` et `pop_back()` y sont des comportements indéfinis. On teste
      `empty()` avant.
  - key: bug-insert-indice
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `v.insert(1, 9);`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          v.insert(1, 9);
          std::println("{}", v[1]);
      }
      ```
    choices:
      - {text: "`v.insert(v.begin() + 1, 9);`", correct: true}
      - {text: "`v.insert(9, 1);`", correct: false}
      - {text: "`v.insert(&v[1], 9);`", correct: false}
      - {text: "`v.push_back(1, 9);`", correct: false}
    answer: |-
      ```cpp
      v.insert(v.begin() + 1, 9);
      ```
      `insert` attend un itérateur comme position, pas un indice. `v.begin() + 1` désigne l'élément d'indice 1.
  - key: bug-pop-back-valeur
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `int dernier = v.pop_back();`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          int dernier = v.pop_back();
          std::println("{}", dernier);
      }
      ```
    choices:
      - {text: "Lire `v.back()` dans `dernier`, puis appeler `v.pop_back();`", correct: true}
      - {text: "Déclarer `dernier` avec `auto` à la place de `int`", correct: false}
      - {text: "Écrire `int dernier = *v.pop_back();`", correct: false}
      - {text: "Écrire `int dernier = v.erase(v.end());`", correct: false}
    answer: |-
      ```cpp
      int dernier = v.back();
      v.pop_back();
      ```
      `pop_back()` renvoie `void`. Lire et retirer sont deux opérations séparées.
