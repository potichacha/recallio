notion: comparateur-personnalise
lesson: |-
  `std::map` et `std::set` rangent leurs clés dans l'ordre que donne un **comparateur**. Par défaut, c'est
  `std::less<Cle>`, c'est-à-dire `operator<` : l'ordre croissant. On peut en fournir un autre.

  **Changer l'ordre.** Le comparateur est un argument de template : le **troisième** de `std::map`, le
  **deuxième** de `std::set`.

  ```cpp
  std::set<int, std::greater<>> decroissant{3, 1, 2};            // 3 2 1
  std::map<std::string, int, std::greater<>> scores;             // clés de Z à A
  ```

  **Écrire son comparateur.** C'est un foncteur : une classe dont l'`operator()` reçoit deux clés, et renvoie
  `true` si la première doit passer **avant** la seconde.

  ```cpp
  struct ParLongueur {
      bool operator()(const std::string& a, const std::string& b) const {
          return a.size() < b.size();
      }
  };

  std::set<std::string, ParLongueur> mots{"kiwi", "fraise", "noix"};
  ```

  Avec une lambda, il faut donner son type, obtenu par `decltype` :

  ```cpp
  auto par_longueur = [](const std::string& a, const std::string& b) { return a.size() < b.size(); };
  std::set<std::string, decltype(par_longueur)> mots;
  ```

  **Le comparateur définit aussi l'égalité.** Un conteneur trié n'appelle jamais `==`. Deux clés sont
  **équivalentes** quand aucune ne passe avant l'autre : `!comp(a, b) && !comp(b, a)`. Avec `ParLongueur`,
  `"kiwi"` et `"noix"` sont équivalentes : l'ensemble ne garde que la première. C'est souvent une surprise.

  **Un ordre strict.** Comme pour `std::sort`, le comparateur doit se comporter comme `<` :

  - `comp(a, a)` vaut `false` : donc **jamais `<=`** ;
  - si `comp(a, b)`, alors pas `comp(b, a)` ;
  - il est transitif.

  Un comparateur qui ne respecte pas ces règles donne un comportement indéfini : des clés introuvables, des
  doublons, un arbre corrompu.

  **Donner un ordre à son type.** Pour qu'un type à soi serve de clé sans comparateur, il lui suffit d'un
  `operator<`. Le plus simple, depuis C++20 :

  ```cpp
  struct Version {
      int majeure;
      int mineure;
      auto operator<=>(const Version&) const = default;    // compare majeure, puis mineure
  };

  std::map<Version, std::string> notes;
  ```

  Pour comparer plusieurs champs à la main, `std::tie(a.x, a.y) < std::tie(b.x, b.y)` évite les erreurs.

  **Chercher sans construire de clé.** Avec `std::less<>` (le comparateur « transparent »), une
  `std::map<std::string, int, std::less<>>` accepte `find("abc")` ou un `std::string_view`, sans fabriquer de
  `std::string` temporaire.

  **En entretien** : « Le comparateur est un argument de template de `std::map` et `std::set` : un foncteur qui dit
  si une clé passe avant une autre, en ordre strict. Il définit aussi l'équivalence des clés : deux clés qu'il ne
  distingue pas sont la même clé. Pour mon type, je préfère lui donner `operator<=>`. »
cards:
  - key: defaut
    format: course
    question: "Dans quel ordre une `std::map` range-t-elle ses clés quand on ne précise rien ?"
    choices:
      - {text: "Dans l'ordre croissant, donné par `std::less`, donc par `operator<`", correct: true}
      - {text: "Dans l'ordre d'insertion des clés", correct: false}
      - {text: "Dans l'ordre décroissant, donné par `std::greater`", correct: false}
      - {text: "Dans l'ordre du hachage des clés", correct: false}
    answer: "Le comparateur par défaut est `std::less<Cle>`. Tout autre ordre se demande par un argument de template."
  - key: role
    format: course
    question: "Que doit renvoyer le comparateur d'un `std::set` pour deux éléments `a` et `b` ?"
    choices:
      - {text: "`true` si `a` doit être rangé avant `b`", correct: true}
      - {text: "`true` si `a` et `b` sont égaux", correct: false}
      - {text: "Un entier négatif, nul ou positif", correct: false}
      - {text: "Le plus petit des deux éléments", correct: false}
    answer: "C'est un prédicat à deux arguments, qui joue le rôle de `<`."
  - key: equivalence
    format: course
    question: "Comment un `std::set` décide-t-il que deux éléments sont le même ?"
    choices:
      - {text: "Quand son comparateur ne range aucun des deux avant l'autre", correct: true}
      - {text: "Quand `operator==` renvoie `true` pour ces deux éléments", correct: false}
      - {text: "Quand les deux éléments ont le même hachage", correct: false}
      - {text: "Quand les deux éléments occupent la même adresse", correct: false}
    answer: "Un conteneur trié n'appelle jamais `==`. L'équivalence est `!comp(a, b) && !comp(b, a)` : un comparateur qui ne regarde que la longueur confond tous les mots de même longueur."
  - key: ordre-strict
    format: course
    question: "Pourquoi le comparateur d'une `std::map` ne doit-il pas être écrit avec `<=` ?"
    choices:
      - {text: "Il doit renvoyer `false` pour deux clés égales, sinon le comportement est indéfini", correct: true}
      - {text: "Il serait deux fois plus lent, car `<=` fait deux comparaisons", correct: false}
      - {text: "Il rangerait les clés dans l'ordre décroissant", correct: false}
      - {text: "Il ne compilerait pas : seul `<` est accepté", correct: false}
    answer: "Avec `<=`, une clé passerait avant elle-même : ce n'est plus un ordre strict. La map ne reconnaît plus les clés déjà présentes."
  - key: vf-egalite
    format: true-false
    question: "`std::set` utilise `operator==` pour refuser les doublons."
    truth: false
    answer: "Il n'utilise que son comparateur. Deux éléments qu'il ne sait pas ordonner sont tenus pour le même."
  - key: vf-greater
    format: true-false
    question: "`std::set<int, std::greater<>>` se parcourt du plus grand au plus petit."
    truth: true
    answer: "`std::greater` range avec `>` : le premier élément est le plus grand."
  - key: vf-type-different
    format: true-false
    question: "Un `std::set<int>` et un `std::set<int, std::greater<>>` sont le même type."
    truth: false
    answer: "Le comparateur fait partie du type. On ne peut pas affecter l'un à l'autre."
  - key: vf-spaceship
    format: true-false
    question: "Un type muni de `auto operator<=>(const T&) const = default;` peut servir de clé à une `std::map`."
    truth: true
    answer: "L'opérateur généré fournit `<`, que `std::less` utilise. Il compare les membres dans l'ordre de leur déclaration."
  - key: qcm-position-map
    format: multiple-choice
    question: "Quelle déclaration range les clés d'une map dans l'ordre décroissant ?"
    choices:
      - {text: "`std::map<int, std::string, std::greater<>>`", correct: true}
      - {text: "`std::map<int, std::greater<>, std::string>`", correct: false}
      - {text: "`std::map<std::greater<>, int, std::string>`", correct: false}
      - {text: "`std::map<int, std::string>(std::greater<>)`", correct: false}
    answer: "Le comparateur est le troisième argument de template de `std::map`, après la clé et la valeur."
  - key: qcm-lambda
    format: multiple-choice
    question: "`comp` est une lambda de comparaison. Quel type d'ensemble l'utilise ?"
    choices:
      - {text: "`std::set<int, decltype(comp)>`", correct: true}
      - {text: "`std::set<int, comp>`", correct: false}
      - {text: "`std::set<int, auto>`", correct: false}
      - {text: "`std::set<int, typeof comp>`", correct: false}
    answer: "Le template attend un type, et celui d'une lambda n'a pas de nom : `decltype(comp)` le fournit."
  - key: qcm-plusieurs-champs
    format: multiple-choice
    question: "Quelle expression compare deux `Version` par `majeure`, puis par `mineure`, sans erreur possible ?"
    choices:
      - {text: "`std::tie(a.majeure, a.mineure) < std::tie(b.majeure, b.mineure)`", correct: true}
      - {text: "`a.majeure < b.majeure && a.mineure < b.mineure`", correct: false}
      - {text: "`a.majeure < b.majeure || a.mineure < b.mineure`", correct: false}
      - {text: "`a.majeure + a.mineure < b.majeure + b.mineure`", correct: false}
    answer: "`std::tie` fabrique des tuples de références, comparés champ par champ. Les versions avec `&&` et `||` ne sont pas des ordres stricts."
  - key: qcm-transparent
    format: multiple-choice
    question: "Qu'apporte `std::less<>` dans `std::map<std::string, int, std::less<>>` ?"
    choices:
      - {text: "`find` accepte un `std::string_view`, sans construire de `std::string`", correct: true}
      - {text: "Les clés sont rangées dans l'ordre décroissant, de Z à A", correct: false}
      - {text: "Les clés en double sont acceptées, comme dans une multimap", correct: false}
      - {text: "La recherche d'une clé passe de O(log n) à O(1)", correct: false}
    answer: "C'est un comparateur « transparent » : il compare des types différents. Sans lui, `find(\"abc\")` construit une chaîne temporaire."
  - key: trous-greater
    format: fill-in
    question: |-
      Complète pour que l'ensemble soit rangé du plus grand au plus petit :
      ```cpp
      std::set<int, std::___<>> s{3, 1, 2};
      ```
    blanks:
      - [greater]
    answer: "`std::greater<>` compare avec `>`."
  - key: trous-operator
    format: fill-in
    question: |-
      Complète le foncteur de comparaison :
      ```cpp
      struct ParLongueur {
          bool ___(const std::string& a, const std::string& b) const {
              return a.size() < b.size();
          }
      };
      ```
    blanks:
      - ["operator()"]
    answer: "Un foncteur est une classe munie d'un `operator()`."
  - key: trous-decltype
    format: fill-in
    question: |-
      Complète pour donner à l'ensemble le type de la lambda :
      ```cpp
      auto comp = [](int a, int b) { return a > b; };
      std::set<int, ___(comp)> s;
      ```
    blanks:
      - [decltype]
    answer: "`decltype(comp)` est le type de la lambda."
  - key: trous-spaceship
    format: fill-in
    question: |-
      Complète pour que le compilateur génère toutes les comparaisons de `Version` :
      ```cpp
      struct Version {
          int majeure;
          int mineure;
          auto operator___(const Version&) const = default;
      };
      ```
    blanks:
      - ["<=>"]
    answer: "`operator<=>` par défaut compare les membres dans l'ordre, et fournit `<`, `<=`, `>`, `>=`."
  - key: code-greater
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <print>
      #include <set>

      int main() {
          std::set<int, std::greater<>> s{3, 9, 1, 9};
          std::println("{} {} {}", s.size(), *s.begin(), *s.rbegin());
      }
      ```
    choices:
      - {text: "`3 9 1`", correct: true}
      - {text: "`3 1 9`", correct: false}
      - {text: "`4 9 1`", correct: false}
      - {text: "`4 1 9`", correct: false}
    answer: "`3 9 1` : le doublon 9 est ignoré. Avec `std::greater`, l'ensemble commence par le plus grand."
    check:
      output: "3 9 1"
  - key: code-equivalence
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>
      #include <string>

      struct ParLongueur {
          bool operator()(const std::string& a, const std::string& b) const { return a.size() < b.size(); }
      };

      int main() {
          std::set<std::string, ParLongueur> mots;
          mots.insert("kiwi");
          mots.insert("fraise");
          mots.insert("noix");
          std::println("{} {}", mots.size(), *mots.begin());
      }
      ```
    choices:
      - {text: "`2 kiwi`", correct: true}
      - {text: "`3 kiwi`", correct: false}
      - {text: "`2 noix`", correct: false}
      - {text: "`3 fraise`", correct: false}
    answer: "`2 kiwi` : pour ce comparateur, `noix` et `kiwi` sont équivalents, puisqu'ils ont la même longueur. L'insertion de `noix` est ignorée."
    check:
      output: "2 kiwi"
  - key: code-map-greater
    format: code-output
    question: |-
      ```cpp
      #include <functional>
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<int, std::string, std::greater<>> podium{{2, "argent"}, {1, "or"}, {3, "bronze"}};
          for (const auto& [rang, medaille] : podium) {
              std::print("{} ", medaille);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`bronze argent or fin`", correct: true}
      - {text: "`or argent bronze fin`", correct: false}
      - {text: "`argent or bronze fin`", correct: false}
      - {text: "`argent bronze or fin`", correct: false}
    answer: "`bronze argent or fin` : les clés sont parcourues dans l'ordre décroissant : 3, 2, 1."
    check:
      output: "bronze argent or fin"
  - key: code-spaceship
    format: code-output
    question: |-
      ```cpp
      #include <compare>
      #include <map>
      #include <print>
      #include <string>

      struct Version {
          int majeure;
          int mineure;
          auto operator<=>(const Version&) const = default;
      };

      int main() {
          std::map<Version, std::string> notes;
          notes[Version{2, 0}] = "c";
          notes[Version{1, 5}] = "a";
          notes[Version{1, 10}] = "b";
          for (const auto& [version, note] : notes) {
              std::print("{}", note);
          }
          std::println(" {}", notes.size());
      }
      ```
    choices:
      - {text: "`abc 3`", correct: true}
      - {text: "`cab 3`", correct: false}
      - {text: "`bac 3`", correct: false}
      - {text: "`acb 3`", correct: false}
    answer: "`abc 3` : la comparaison générée regarde `majeure`, puis `mineure`, comme des nombres : 1.5, puis 1.10, puis 2.0."
    check:
      output: "abc 3"
  - key: bug-sans-ordre
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator<' (operand types are 'const Point' and 'const Point') ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      struct Point {
          int x;
          int y;
      };

      int main() {
          std::set<Point> points;
          points.insert(Point{1, 2});
          std::println("{}", points.size());
      }
      ```
    choices:
      - {text: "Ajouter à `Point` : `auto operator<=>(const Point&) const = default;`", correct: true}
      - {text: "Ajouter à `Point` : `bool operator==(const Point&) const = default;`", correct: false}
      - {text: "Ajouter une spécialisation de `std::hash<Point>`", correct: false}
      - {text: "Appeler `points.reserve(1);` avant l'insertion", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
          auto operator<=>(const Point&) const = default;
      };
      ```
      Un `std::set` range ses éléments avec `<`. L'égalité et le hachage servent aux conteneurs `unordered_`, pas
      aux conteneurs triés.
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1` : un ensemble ne garde pas de doublon. Il affiche `2`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      struct Croissant {
          bool operator()(int a, int b) const { return a <= b; }
      };

      int main() {
          std::set<int, Croissant> s;
          s.insert(5);
          s.insert(5);
          std::println("{}", s.size());
      }
      ```
    choices:
      - {text: "Écrire `return a < b;` dans le comparateur", correct: true}
      - {text: "Écrire `return a >= b;` dans le comparateur", correct: false}
      - {text: "Écrire `return a == b;` dans le comparateur", correct: false}
      - {text: "Écrire `return a != b;` dans le comparateur", correct: false}
    answer: |-
      ```cpp
      bool operator()(int a, int b) const { return a < b; }
      ```
      Avec `<=`, 5 passe « avant » 5 : l'ensemble croit voir deux éléments différents. Le comparateur doit être un
      ordre strict, et renvoyer `false` pour deux valeurs égales. Sinon, le comportement est indéfini.
  - key: bug-comparateur-partiel
    format: bug-fix
    question: |-
      Ce programme devrait garder les trois mots et afficher `3`. Il affiche `2`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>
      #include <string>

      struct ParLongueur {
          bool operator()(const std::string& a, const std::string& b) const { return a.size() < b.size(); }
      };

      int main() {
          std::set<std::string, ParLongueur> mots{"kiwi", "noix", "fraise"};
          std::println("{}", mots.size());
      }
      ```
    choices:
      - {text: "Départager les mots de même longueur par `a < b`", correct: true}
      - {text: "Écrire `a.size() <= b.size()` dans le comparateur", correct: false}
      - {text: "Ajouter un `operator==` à la struct `ParLongueur`", correct: false}
      - {text: "Insérer les mots avec `emplace` plutôt qu'à la construction", correct: false}
    answer: |-
      ```cpp
      bool operator()(const std::string& a, const std::string& b) const {
          if (a.size() != b.size()) {
              return a.size() < b.size();
          }
          return a < b;
      }
      ```
      Deux mots que le comparateur ne sait pas ordonner sont tenus pour le même : `kiwi` et `noix` ont la même
      longueur. Il faut un second critère. Un `std::set` n'appelle jamais `==`.
  - key: bug-lambda-sans-decltype
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration de l'ensemble : `par_valeur` est une variable, pas un type. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      int main() {
          auto par_valeur = [](int a, int b) { return a > b; };
          std::set<int, par_valeur> s{1, 3, 2};
          std::println("{}", *s.begin());
      }
      ```
    choices:
      - {text: "Écrire `std::set<int, decltype(par_valeur)>`", correct: true}
      - {text: "Écrire `std::set<int, auto>`", correct: false}
      - {text: "Écrire `std::set<int, &par_valeur>`", correct: false}
      - {text: "Écrire `std::set<int, par_valeur()>`", correct: false}
    answer: |-
      ```cpp
      std::set<int, decltype(par_valeur)> s{1, 3, 2};
      ```
      Un argument de template de type attend un type. `decltype` donne celui de la lambda. Ici, `std::greater<>`
      ferait la même chose sans lambda.
