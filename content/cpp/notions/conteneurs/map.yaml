notion: map
lesson: |-
  Une `std::map<Cle, Valeur>` associe une valeur à chaque **clé**. Les clés sont **uniques**, et la map les garde
  **triées** : c'est un arbre équilibré, où chercher, insérer et effacer coûtent O(log n).

  ```cpp
  #include <map>

  std::map<std::string, int> stock{{"pomme", 12}, {"kiwi", 5}};
  ```

  **Parcourir.** Chaque élément est une paire `std::pair<const Cle, Valeur>`. Le parcours suit l'ordre des clés :

  ```cpp
  for (const auto& [nom, quantite] : stock) {
      std::println("{} : {}", nom, quantite);     // kiwi, puis pomme
  }
  ```

  **`operator[]` et sa surprise.** `stock["poire"]` renvoie une référence vers la valeur de la clé. Si la clé
  **n'existe pas, il la crée**, avec une valeur nulle (`0`, chaîne vide...).

  ```cpp
  stock["poire"] = 3;        // crée, ou remplace
  ++compte[mot];             // pratique : un compteur part de 0 tout seul
  if (stock["fraise"] > 0)   // piège : cette simple lecture vient d'ajouter "fraise"
  ```

  Conséquence : `operator[]` ne s'utilise pas sur une map `const`.

  **Lire sans rien créer.**

  | Fonction | Clé absente |
  |---|---|
  | `m.contains(cle)` (C++20) | renvoie `false` |
  | `m.find(cle)` | renvoie `m.end()` |
  | `m.at(cle)` | lève `std::out_of_range` |
  | `m[cle]` | **crée** l'élément |

  `find` renvoie un itérateur sur la paire : `it->first` est la clé, `it->second` la valeur.

  ```cpp
  if (auto it = stock.find("kiwi"); it != stock.end()) {
      std::println("{}", it->second);
  }
  ```

  **Insérer sans écraser.** `insert` et `emplace` ne font **rien** si la clé existe déjà. `insert_or_assign`
  remplace toujours. `try_emplace` insère seulement si la clé est absente, sans construire la valeur inutilement.

  **Effacer.** `m.erase(cle)` renvoie le nombre d'éléments retirés : 0 ou 1.

  **La clé.** Elle doit se comparer avec `<`. Elle est `const` dans la map : on ne la modifie pas, on efface et on
  réinsère.

  **En entretien** : « `std::map` est un arbre trié : tout est en O(log n), et le parcours donne les clés dans
  l'ordre. Attention à `operator[]`, qui insère une valeur par défaut quand la clé manque : pour lire, je prends
  `find`, `contains` ou `at`. »
cards:
  - key: ordre-de-parcours
    format: course
    question: "Dans quel ordre parcourt-on les éléments d'une `std::map` ?"
    choices:
      - {text: "Dans l'ordre croissant des clés", correct: true}
      - {text: "Dans l'ordre où ils ont été insérés", correct: false}
      - {text: "Dans l'ordre croissant des valeurs", correct: false}
      - {text: "Dans un ordre qui dépend du hachage des clés", correct: false}
    answer: "Une map est un arbre trié par clé. L'ordre d'insertion est perdu, et les valeurs ne jouent aucun rôle dans le rangement."
  - key: crochets-cle-absente
    format: course
    question: "Que fait `m[cle]` quand la clé n'est pas dans la map ?"
    choices:
      - {text: "Il insère la clé avec une valeur nulle, et renvoie une référence vers elle", correct: true}
      - {text: "Il lève une exception `std::out_of_range`, sans modifier la map", correct: false}
      - {text: "Il renvoie une valeur nulle, sans rien insérer dans la map", correct: false}
      - {text: "Il renvoie l'itérateur `m.end()`, qu'on compare ensuite", correct: false}
    answer: "`operator[]` crée l'élément manquant. C'est commode pour compter (`++m[mot]`), et piégeux pour lire : un simple test ajoute une entrée."
  - key: lire-sans-creer
    format: course
    question: "Comment lis-tu la valeur d'une clé sans risquer de l'ajouter à la map ?"
    choices:
      - {text: "Avec `find`, dont on compare le résultat à `end()`", correct: true}
      - {text: "Avec `operator[]`, dont on compare le résultat à zéro", correct: false}
      - {text: "Avec `insert`, dont on ignore le résultat", correct: false}
      - {text: "Avec `emplace`, auquel on passe une valeur nulle", correct: false}
    answer: "`find` renvoie un itérateur sur l'élément, ou `end()` si la clé manque. `at` convient aussi : il lève une exception. `contains` répond seulement par oui ou non."
  - key: insert-cle-existante
    format: course
    question: "Que fait `m.insert({cle, valeur})` quand la clé est déjà dans la map ?"
    choices:
      - {text: "Rien : l'ancienne valeur est gardée", correct: true}
      - {text: "Il remplace l'ancienne valeur par la nouvelle", correct: false}
      - {text: "Il ajoute un second élément avec la même clé", correct: false}
      - {text: "Il lève une exception `std::invalid_argument`", correct: false}
    answer: "Les clés sont uniques, et `insert` n'écrase pas. Pour remplacer : `m[cle] = valeur;` ou `m.insert_or_assign(cle, valeur);`."
  - key: vf-cles-uniques
    format: true-false
    question: "Une `std::map` peut contenir deux éléments de même clé."
    truth: false
    answer: "Les clés sont uniques. Pour plusieurs valeurs par clé, il existe `std::multimap`, ou une map dont la valeur est un vecteur."
  - key: vf-crochets-const
    format: true-false
    question: "`operator[]` s'utilise sur une `std::map` déclarée `const`."
    truth: false
    answer: "Comme il peut insérer, il n'est pas `const`. Sur une map constante, on lit avec `at` ou `find`."
  - key: vf-at-exception
    format: true-false
    question: "`m.at(cle)` lève une exception quand la clé est absente."
    truth: true
    answer: "`std::out_of_range`. Il n'insère jamais rien."
  - key: vf-recherche-log
    format: true-false
    question: "Chercher une clé dans une `std::map` coûte un temps proportionnel au logarithme de sa taille."
    truth: true
    answer: "L'arbre est équilibré : sa hauteur est en log n. Un million d'éléments demandent une vingtaine de comparaisons."
  - key: qcm-tester-presence
    format: multiple-choice
    question: "Quelle expression dit si la clé `\"kiwi\"` est dans la map `m`, sans la modifier ?"
    choices:
      - {text: "`m.contains(\"kiwi\")`", correct: true}
      - {text: "`m[\"kiwi\"] != 0`", correct: false}
      - {text: "`m.at(\"kiwi\") != 0`", correct: false}
      - {text: "`m.insert({\"kiwi\", 0}).second`", correct: false}
    answer: "`contains` (C++20) renvoie un booléen. `operator[]` et `insert` ajouteraient la clé ; `at` lèverait une exception si elle manque."
  - key: qcm-acces-valeur
    format: multiple-choice
    question: "`it` est un itérateur sur un élément d'une `std::map<std::string, int>`. Comment lis-tu la valeur ?"
    choices:
      - {text: "`it->second`", correct: true}
      - {text: "`it->first`", correct: false}
      - {text: "`it->value`", correct: false}
      - {text: "`*it`", correct: false}
    answer: "Un élément est une paire : `first` est la clé, `second` la valeur. `*it` donne la paire entière."
  - key: qcm-remplacer
    format: multiple-choice
    question: "Quelle ligne remplace à coup sûr la valeur de la clé `\"kiwi\"`, qu'elle existe ou non ?"
    choices:
      - {text: "`m.insert_or_assign(\"kiwi\", 8);`", correct: true}
      - {text: "`m.insert({\"kiwi\", 8});`", correct: false}
      - {text: "`m.emplace(\"kiwi\", 8);`", correct: false}
      - {text: "`m.try_emplace(\"kiwi\", 8);`", correct: false}
    answer: "`insert`, `emplace` et `try_emplace` ne font rien quand la clé existe. `insert_or_assign` insère ou remplace, comme `m[\"kiwi\"] = 8;`."
  - key: qcm-type-element
    format: multiple-choice
    question: "Quel est le type d'un élément d'une `std::map<std::string, int>` ?"
    choices:
      - {text: "`std::pair<const std::string, int>`", correct: true}
      - {text: "`std::pair<std::string, int>`", correct: false}
      - {text: "`std::tuple<std::string, int>`", correct: false}
      - {text: "`int`", correct: false}
    answer: "La clé est `const` : la modifier casserait l'ordre de l'arbre. La valeur, elle, se modifie."
  - key: trous-find
    format: fill-in
    question: |-
      Complète pour chercher la clé sans rien insérer :
      ```cpp
      auto it = stock.___("kiwi");
      if (it != stock.end()) {
          std::println("{}", it->second);
      }
      ```
    blanks:
      - [find]
    answer: "`find` renvoie un itérateur sur l'élément, ou `end()` si la clé est absente."
  - key: trous-second
    format: fill-in
    question: |-
      Complète pour afficher la valeur de l'élément trouvé :
      ```cpp
      auto it = stock.find("kiwi");
      std::println("{}", it->___);
      ```
    blanks:
      - [second]
    answer: "`first` est la clé, `second` est la valeur."
  - key: trous-contains
    format: fill-in
    question: |-
      Complète pour tester la présence de la clé (C++20) :
      ```cpp
      if (stock.___("kiwi")) {
          std::println("en stock");
      }
      ```
    blanks:
      - [contains]
    answer: "`contains` renvoie `true` si la clé est dans la map."
  - key: trous-liaison
    format: fill-in
    question: |-
      Complète pour parcourir les éléments sans les copier ni les modifier :
      ```cpp
      for (___ auto& [nom, quantite] : stock) {
          std::println("{} : {}", nom, quantite);
      }
      ```
    blanks:
      - [const]
    answer: "`const auto&` : chaque paire est lue en place, sans copie."
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> m;
          m["poire"] = 1;
          m["abricot"] = 2;
          m["kiwi"] = 3;
          for (const auto& [nom, n] : m) {
              std::print("{}{} ", nom[0], n);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`a2 k3 p1 fin`", correct: true}
      - {text: "`p1 a2 k3 fin`", correct: false}
      - {text: "`p1 k3 a2 fin`", correct: false}
      - {text: "`k3 a2 p1 fin`", correct: false}
    answer: "`a2 k3 p1 fin` : la map se parcourt dans l'ordre des clés, ici alphabétique. L'ordre d'insertion ne compte pas."
    check:
      output: "a2 k3 p1 fin"
  - key: code-crochets-inserent
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> m{{"a", 1}};
          if (m["b"] == 0) {
              std::println("{}", m.size());
          }
      }
      ```
    choices:
      - {text: "`2`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "`2` : lire `m[\"b\"]` a inséré la clé `\"b\"` avec la valeur 0. La map a désormais deux éléments."
    check:
      output: "2"
  - key: code-insert-existant
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> m{{"a", 1}};
          m.insert({"a", 5});
          m["b"] = 2;
          m["b"] = 7;
          std::println("{} {}", m["a"], m["b"]);
      }
      ```
    choices:
      - {text: "`1 7`", correct: true}
      - {text: "`5 7`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`5 2`", correct: false}
    answer: "`1 7` : `insert` ne remplace pas une clé existante, `a` garde 1. `operator[]` suivi d'une affectation remplace : `b` vaut 7."
    check:
      output: "1 7"
  - key: code-compter
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<char, int> compte;
          for (char c : std::string{"ananas"}) {
              ++compte[c];
          }
          std::println("{} {} {}", compte.size(), compte['a'], compte['n']);
      }
      ```
    choices:
      - {text: "`3 3 2`", correct: true}
      - {text: "`6 3 2`", correct: false}
      - {text: "`3 2 3`", correct: false}
      - {text: "`4 3 2`", correct: false}
    answer: "`3 3 2` : trois lettres différentes (a, n, s). `++compte[c]` crée le compteur à 0 la première fois, puis l'augmente : trois `a`, deux `n`."
    check:
      output: "3 3 2"
  - key: bug-lecture-qui-insere
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1` : il ne fait que consulter le stock. Il affiche `2`. Quelle correction est la
      bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> stock{{"pomme", 12}};
          if (stock["kiwi"] > 0) {
              std::println("kiwi en stock");
          }
          std::println("{}", stock.size());
      }
      ```
    choices:
      - {text: "Tester `stock.contains(\"kiwi\")` à la place de `stock[\"kiwi\"] > 0`", correct: true}
      - {text: "Tester `stock[\"kiwi\"] != 0` à la place de `stock[\"kiwi\"] > 0`", correct: false}
      - {text: "Déclarer la map avec le type `std::map<std::string, unsigned>`", correct: false}
      - {text: "Appeler `stock.clear();` juste avant d'afficher la taille", correct: false}
    answer: |-
      ```cpp
      if (stock.contains("kiwi")) {
      ```
      `stock["kiwi"]` insère la clé avec la valeur 0. Pour consulter, on prend `contains` ou `find`, qui ne modifient
      rien.
  - key: bug-crochets-sur-const
    format: bug-fix
    question: |-
      Le compilateur refuse `stock["pomme"]` dans cette fonction. Quelle correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int quantite(const std::map<std::string, int>& stock) {
          return stock["pomme"];
      }

      int main() {
          std::println("{}", quantite({{"pomme", 12}}));
      }
      ```
    choices:
      - {text: "Écrire `return stock.at(\"pomme\");`", correct: true}
      - {text: "Écrire `return stock.second(\"pomme\");`", correct: false}
      - {text: "Écrire `return stock.find(\"pomme\");`", correct: false}
      - {text: "Écrire `return *stock[\"pomme\"];`", correct: false}
    answer: |-
      ```cpp
      return stock.at("pomme");
      ```
      `operator[]` peut insérer : il n'existe pas en version `const`. `at` lit sans modifier, et lève une exception
      si la clé manque. `find` renvoie un itérateur, pas un entier.
  - key: bug-at-cle-absente
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::out_of_range`. Il devrait afficher `0` pour un fruit inconnu.
      Quelle correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          const std::map<std::string, int> stock{{"pomme", 12}};
          std::println("{}", stock.at("kiwi"));
      }
      ```
    choices:
      - {text: "Chercher avec `find`, et afficher `0` quand il renvoie `stock.end()`", correct: true}
      - {text: "Remplacer `stock.at(\"kiwi\")` par `stock[\"kiwi\"]`, sans rien changer d'autre", correct: false}
      - {text: "Remplacer `stock.at(\"kiwi\")` par `stock.at(\"kiwi\", 0)`", correct: false}
      - {text: "Retirer le mot-clé `const` de la déclaration de `stock`", correct: false}
    answer: |-
      ```cpp
      const auto it = stock.find("kiwi");
      std::println("{}", it != stock.end() ? it->second : 0);
      ```
      `at` lève une exception pour une clé absente. `find` permet de choisir soi-même la valeur par défaut.
      `operator[]` ne compile pas sur une map `const`.
  - key: bug-insert-ne-remplace-pas
    format: bug-fix
    question: |-
      Ce programme devrait afficher `20` après la mise à jour du prix, et affiche `15`. Quelle correction est la
      bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> prix{{"livre", 15}};
          prix.insert({"livre", 20});
          std::println("{}", prix.at("livre"));
      }
      ```
    choices:
      - {text: "Écrire `prix[\"livre\"] = 20;`", correct: true}
      - {text: "Écrire `prix.emplace(\"livre\", 20);`", correct: false}
      - {text: "Écrire `prix.try_emplace(\"livre\", 20);`", correct: false}
      - {text: "Écrire `prix.insert({\"livre\", 20}).second;`", correct: false}
    answer: |-
      ```cpp
      prix["livre"] = 20;
      ```
      `insert`, `emplace` et `try_emplace` laissent la valeur existante. Pour remplacer : `operator[]` suivi d'une
      affectation, ou `insert_or_assign`.
