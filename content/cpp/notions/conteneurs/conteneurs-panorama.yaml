notion: conteneurs-panorama
lesson: |-
  La bibliothèque standard fournit des **conteneurs** : des classes qui rangent des éléments, chacune avec sa façon
  de les organiser. Le bon choix dépend de ce qu'on fait le plus souvent : parcourir, chercher, insérer.

  **Les conteneurs séquentiels** gardent les éléments dans l'ordre où on les met.

  | Conteneur | Organisation | À retenir |
  |---|---|---|
  | `std::vector` | un tableau contigu qui grandit | le choix **par défaut** |
  | `std::array` | un tableau contigu de taille fixe | quand la taille est connue à la compilation |
  | `std::deque` | des blocs reliés | ajouts rapides **aux deux bouts** |
  | `std::list` | une liste doublement chaînée | insertion au milieu sans rien déplacer ; lente à parcourir |

  **Les conteneurs associatifs** retrouvent un élément par sa **clé**.

  | Conteneur | Organisation | Recherche |
  |---|---|---|
  | `std::map`, `std::set` | un arbre équilibré, **trié** par clé | O(log n) |
  | `std::unordered_map`, `std::unordered_set` | une table de hachage, **sans ordre** | O(1) en moyenne |

  Une `map` associe une valeur à chaque clé ; un `set` ne garde que des clés, sans doublon.

  **Les adaptateurs** restreignent un autre conteneur à un usage : `std::stack` (dernier entré, premier sorti),
  `std::queue` (premier entré, premier sorti), `std::priority_queue` (le plus grand d'abord).

  **Comment choisir.**

  1. **`std::vector`**, sauf raison contraire. Ses éléments se suivent en mémoire : le processeur le parcourt très
     vite, plus vite qu'une liste même là où la théorie favorise la liste.
  2. Chercher par clé : **`std::unordered_map`** ; **`std::map`** si l'on a besoin des clés dans l'ordre.
  3. Garder des valeurs uniques : `std::unordered_set`, ou `std::set`.
  4. Ajouter et retirer en tête : `std::deque`.

  Tous partagent le même vocabulaire : `size()`, `empty()`, `begin()`, `end()`, la boucle sur un intervalle.

  **En entretien** : « `std::vector` par défaut, pour sa mémoire contiguë. `std::unordered_map` pour chercher par
  clé, `std::map` si l'ordre compte. `std::list` est rarement le bon choix. »
tour:
  - title: Choisir son conteneur
    text: |-
      La bibliothèque standard range les données de plusieurs façons. Trois conteneurs couvrent presque tout :

      - `std::vector` : une suite d'éléments, dans l'ordre. Le choix par défaut ;
      - `std::map` : des valeurs retrouvées par une clé, rangées dans l'ordre des clés ;
      - `std::set` : des valeurs uniques, triées.

      Ils se parcourent tous avec la même boucle.

      Essaie : ajoute une seconde fois `"pomme"` à `fruits`, puis exécute. Le vecteur la garde, l'ensemble non.
    example:
      files:
        main.cpp: |-
          #include <map>
          #include <print>
          #include <set>
          #include <string>
          #include <vector>

          int main() {
              std::vector<std::string> fruits{"pomme", "kiwi", "pomme"};
              std::set<std::string> uniques{fruits.begin(), fruits.end()};
              std::map<std::string, int> stock{{"pomme", 12}, {"kiwi", 5}};

              std::println("{} fruits, {} différents", fruits.size(), uniques.size());
              for (const auto& [nom, quantite] : stock) {
                  std::println("{} : {}", nom, quantite);
              }
          }
      output: |-
        3 fruits, 2 différents
        kiwi : 5
        pomme : 12
cards:
  - key: choix-par-defaut
    format: course
    question: Quel conteneur choisit-on par défaut en C++ ?
    choices:
      - {text: "`std::vector`, pour ses éléments contigus en mémoire", correct: true}
      - {text: "`std::list`, pour ses insertions rapides au milieu", correct: false}
      - {text: "`std::map`, pour ses éléments toujours triés", correct: false}
      - {text: "`std::deque`, pour ses ajouts rapides aux deux bouts", correct: false}
    answer: "Un vecteur range ses éléments côte à côte : le processeur le parcourt très vite. On ne s'en écarte que pour une raison précise."
  - key: sequentiel-ou-associatif
    format: course
    question: Quelle différence entre un conteneur séquentiel et un conteneur associatif ?
    choices:
      - {text: "Le séquentiel garde l'ordre d'insertion ; l'associatif retrouve un élément par sa clé", correct: true}
      - {text: "Le séquentiel a une taille fixe ; l'associatif grandit à la demande", correct: false}
      - {text: "Le séquentiel contient des nombres ; l'associatif contient des chaînes", correct: false}
      - {text: "Le séquentiel vit sur la pile ; l'associatif vit sur le tas", correct: false}
    answer: "`std::vector`, `std::deque` et `std::list` sont séquentiels. `std::map`, `std::set` et leurs versions `unordered_` sont associatifs : ils s'organisent d'après les clés."
  - key: map-ou-unordered-map
    format: course
    question: "Quand préfère-t-on `std::map` à `std::unordered_map` ?"
    choices:
      - {text: "Quand on a besoin de parcourir les clés dans l'ordre", correct: true}
      - {text: "Quand on veut la recherche la plus rapide possible", correct: false}
      - {text: "Quand les clés sont des entiers", correct: false}
      - {text: "Quand le conteneur contient plus de mille éléments", correct: false}
    answer: "`std::map` garde ses clés triées, au prix d'une recherche en O(log n). `std::unordered_map` cherche en O(1) en moyenne, mais sans aucun ordre."
  - key: pourquoi-pas-list
    format: course
    question: "Pourquoi `std::list` est-elle rarement le bon choix ?"
    choices:
      - {text: "Ses éléments sont dispersés en mémoire : la parcourir est lent", correct: true}
      - {text: "Elle ne peut pas contenir plus de mille éléments", correct: false}
      - {text: "Elle ne permet pas d'insérer un élément au milieu", correct: false}
      - {text: "Elle n'accepte que des types fondamentaux", correct: false}
    answer: "Chaque nœud est alloué à part : passer de l'un au suivant fait sauter le processeur d'un endroit à l'autre de la mémoire. En pratique, un vecteur gagne presque toujours, même avec des insertions au milieu."
  - key: vf-vector-contigu
    format: true-false
    question: "Les éléments d'un `std::vector` sont rangés côte à côte en mémoire."
    truth: true
    answer: C'est ce qui le rend rapide à parcourir, et utilisable comme un tableau.
  - key: vf-map-triee
    format: true-false
    question: "Une `std::map` se parcourt dans l'ordre où les éléments ont été insérés."
    truth: false
    answer: Elle se parcourt dans l'ordre croissant de ses clés. Aucun conteneur associatif standard ne garde l'ordre d'insertion.
  - key: vf-set-doublons
    format: true-false
    question: "Un `std::set` ne garde qu'un exemplaire de chaque valeur."
    truth: true
    answer: Insérer une valeur déjà présente ne fait rien.
  - key: vf-unordered-ordre
    format: true-false
    question: "Une `std::unordered_map` se parcourt dans l'ordre croissant de ses clés."
    truth: false
    answer: "Comme son nom le dit, elle n'a pas d'ordre : il dépend de la table de hachage, et peut changer après une insertion."
  - key: qcm-recherche-par-cle
    format: multiple-choice
    question: Quel conteneur retrouve le plus vite une valeur par sa clé, quand l'ordre n'importe pas ?
    choices:
      - {text: "`std::unordered_map`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::list`", correct: false}
      - {text: "`std::deque`", correct: false}
    answer: "Une table de hachage trouve une clé en temps constant, en moyenne. Dans un vecteur, il faudrait parcourir les éléments."
  - key: qcm-deux-bouts
    format: multiple-choice
    question: Quel conteneur séquentiel ajoute et retire rapidement en tête comme en queue ?
    choices:
      - {text: "`std::deque`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::array`", correct: false}
      - {text: "`std::set`", correct: false}
    answer: "`std::deque` : une file à deux bouts. Un vecteur n'ajoute vite qu'à la fin ; en tête, il doit décaler tous ses éléments."
  - key: qcm-adaptateur
    format: multiple-choice
    question: "Lequel de ces conteneurs sert une file d'attente : premier entré, premier sorti ?"
    choices:
      - {text: "`std::queue`", correct: true}
      - {text: "`std::stack`", correct: false}
      - {text: "`std::set`", correct: false}
      - {text: "`std::priority_queue`", correct: false}
    answer: "`std::queue`. `std::stack` est une pile : dernier entré, premier sorti. `std::priority_queue` sort d'abord le plus grand."
  - key: qcm-valeurs-uniques
    format: multiple-choice
    question: Quel conteneur convient pour savoir rapidement si un identifiant a déjà été vu ?
    choices:
      - {text: "`std::unordered_set`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::list`", correct: false}
      - {text: "`std::array`", correct: false}
    answer: "Un ensemble haché répond « présent ou non » en temps constant, sans doublons. Un vecteur demanderait de tout parcourir."
  - key: situation-carnet
    format: scenario
    question: |-
      Tu dois garder, pour chaque nom d'utilisateur, son score, et retrouver un score par le nom des milliers de fois
      par seconde. L'ordre des noms n'a pas d'importance. Quel conteneur choisis-tu ?
    choices:
      - {text: "Une `std::unordered_map<std::string, int>`", correct: true}
      - {text: "Un `std::vector<std::pair<std::string, int>>`, parcouru à chaque recherche", correct: false}
      - {text: "Une `std::list<std::pair<std::string, int>>`", correct: false}
      - {text: "Deux `std::vector`, l'un pour les noms, l'autre pour les scores", correct: false}
    answer: |-
      Une recherche par clé, sans besoin d'ordre : la table de hachage la fait en temps constant. Un vecteur ou une
      liste obligeraient à comparer les noms un par un.
  - key: situation-classement
    format: scenario
    question: |-
      Tu dois afficher un annuaire, toujours dans l'ordre alphabétique des noms, auquel on ajoute des entrées de
      temps en temps. Quel conteneur choisis-tu ?
    choices:
      - {text: "Une `std::map<std::string, std::string>`, triée par nom", correct: true}
      - {text: "Une `std::unordered_map<std::string, std::string>`", correct: false}
      - {text: "Une `std::queue<std::string>`", correct: false}
      - {text: "Une `std::stack<std::string>`", correct: false}
    answer: |-
      `std::map` garde ses clés triées : la parcourir donne l'ordre alphabétique sans rien faire. Une
      `std::unordered_map` ne promet aucun ordre.
  - key: situation-liste-chainee
    format: scenario
    question: |-
      Un collègue veut une `std::list` pour stocker dix mille points, « parce qu'on insère parfois au milieu ». Le
      programme passe son temps à les parcourir. Que lui proposes-tu ?
    choices:
      - {text: "Un `std::vector` : le parcours domine, et la mémoire contiguë le rend bien plus rapide", correct: true}
      - {text: "Une `std::list` : l'insertion au milieu est le critère qui compte le plus", correct: false}
      - {text: "Une `std::map` : elle insère et parcourt plus vite que les deux", correct: false}
      - {text: "Un `std::array` : dix mille points tiennent dans une taille fixe", correct: false}
    answer: |-
      Ce qui compte est l'opération la plus fréquente. Parcourir une liste fait suivre des pointeurs à travers la
      mémoire ; un vecteur se lit d'un trait. Quelques insertions au milieu d'un vecteur de cette taille restent
      rapides.
  - key: situation-file
    format: scenario
    question: |-
      Un serveur reçoit des requêtes, et doit les traiter dans leur ordre d'arrivée : il ajoute à un bout, et retire
      à l'autre. Quel conteneur choisis-tu ?
    choices:
      - {text: "Une `std::queue`, ou une `std::deque`", correct: true}
      - {text: "Un `std::vector`, dont on retire le premier élément à chaque fois", correct: false}
      - {text: "Une `std::stack`", correct: false}
      - {text: "Un `std::set`", correct: false}
    answer: |-
      C'est une file : premier entré, premier sorti. `std::queue` l'exprime, et s'appuie sur une `std::deque`.
      Retirer le premier élément d'un vecteur décale tous les autres, et une pile sortirait la dernière requête
      d'abord.
  - key: definition-conteneur
    format: definition
    question: "Qu'est-ce qu'un conteneur, dans la bibliothèque standard ?"
    choices:
      - {text: "Une classe qui range une collection d'éléments, et gère leur mémoire", correct: true}
      - {text: "Une fonction qui parcourt une suite d'éléments", correct: false}
      - {text: "Un fichier qui regroupe plusieurs classes", correct: false}
      - {text: "Un pointeur qui libère son objet tout seul", correct: false}
    answer: "`std::vector`, `std::map`, `std::set`... Chacun possède ses éléments, et les libère à sa destruction."
  - key: definition-table-de-hachage
    format: definition
    question: "Qu'est-ce qu'une table de hachage ?"
    choices:
      - {text: "Une structure qui calcule, à partir de la clé, l'endroit où ranger l'élément", correct: true}
      - {text: "Une structure qui garde ses éléments triés dans un arbre", correct: false}
      - {text: "Une structure qui relie chaque élément au suivant par un pointeur", correct: false}
      - {text: "Une structure qui chiffre les éléments qu'elle contient", correct: false}
    answer: "Une fonction de hachage transforme la clé en numéro de case. Chercher revient à refaire ce calcul : c'est ce qui donne un accès en temps constant, en moyenne."
  - key: definition-adaptateur
    format: definition
    question: "Qu'est-ce qu'un adaptateur de conteneur, comme `std::stack` ?"
    choices:
      - {text: "Une classe qui restreint un autre conteneur à un usage précis", correct: true}
      - {text: "Une classe qui convertit un conteneur en un autre", correct: false}
      - {text: "Une classe qui accélère les recherches dans un conteneur", correct: false}
      - {text: "Une classe qui partage un conteneur entre deux threads", correct: false}
    answer: "`std::stack` n'offre que `push`, `pop` et `top`, et délègue le rangement à une `std::deque`. L'interface réduite dit l'intention."
  - key: definition-contigu
    format: definition
    question: "Que veut dire « mémoire contiguë » pour un conteneur ?"
    choices:
      - {text: "Que ses éléments sont rangés les uns à la suite des autres, sans trou", correct: true}
      - {text: "Que ses éléments sont alloués chacun dans un bloc séparé", correct: false}
      - {text: "Que sa mémoire est partagée avec un autre conteneur", correct: false}
      - {text: "Que sa mémoire n'est jamais libérée", correct: false}
    answer: "C'est le cas de `std::vector`, `std::array` et `std::string`. Le processeur charge plusieurs éléments à la fois, et l'on peut passer leur adresse à une fonction qui attend un tableau."
