notion: vector-bool
lesson: |-
  `std::vector<bool>` n'est **pas** un `std::vector` de `bool`. C'est une **spécialisation** du template, qui range
  chaque booléen sur **un bit** au lieu d'un octet. Elle économise de la mémoire, et casse au passage plusieurs
  garanties d'un vecteur ordinaire.

  **Ce qui change.** Un bit n'a pas d'adresse : on ne peut ni le désigner par un `bool*`, ni le lier à un `bool&`.
  `operator[]` ne renvoie donc pas une référence, mais un **objet mandataire** (*proxy*),
  `std::vector<bool>::reference`, qui se souvient du mot et du bit visés.

  ```cpp
  std::vector<bool> drapeaux{true, false};
  bool valeur = drapeaux[0];     // copie : conversion du mandataire en bool
  auto copie = drapeaux[0];      // PAS un bool : un mandataire, lié au vecteur
  copie = false;                 // modifie drapeaux[0] !
  ```

  **Les pièges.**

  | Code | Avec `std::vector<int>` | Avec `std::vector<bool>` |
  |---|---|---|
  | `auto x = v[0];` | une copie indépendante | un mandataire : écrire dedans modifie le vecteur |
  | `T& r = v[0];` | compile | **ne compile pas** |
  | `T* p = &v[0];` | compile | **ne compile pas** |
  | `v.data()` | un pointeur vers les éléments | n'existe pas |
  | `for (auto& x : v)` | compile | **ne compile pas** |
  | écriture de deux éléments voisins par deux threads | sûre | **course aux données** : ils partagent un mot |

  Le mandataire peut aussi devenir **pendant** : gardé après une réallocation ou la destruction du vecteur, il
  désigne une mémoire libérée.

  **Parcourir.** `for (bool x : v)` copie chaque valeur ; `for (auto&& x : v)` accepte le mandataire, et permet de
  modifier.

  **Dans du code générique.** Un template écrit pour `std::vector<T>` peut cesser de compiler, ou changer de
  comportement, quand `T` vaut `bool`. C'est le reproche principal : `std::vector<bool>` ne respecte pas le
  contrat d'un conteneur.

  **Les alternatives.**

  | Besoin | Choix |
  |---|---|
  | Un vrai conteneur de booléens, avec références et pointeurs | `std::vector<char>` ou `std::vector<std::uint8_t>` |
  | Un nombre de bits fixé à la compilation | `std::bitset<N>` |
  | Beaucoup de booléens, mémoire comptée, et les limites connues | `std::vector<bool>` |
  | Des booléens écrits par plusieurs threads | `std::vector<std::atomic<bool>>`, ou des `char` |

  **Ce qu'il offre en plus.** `flip()` inverse tous les bits ; `v[i].flip()` en inverse un seul.

  **En entretien** : « `std::vector<bool>` est une spécialisation compacte, un bit par élément. `operator[]` rend
  un mandataire, pas un `bool&` : `auto x = v[0]` ne copie pas, on ne peut pas prendre l'adresse d'un élément, et
  deux threads qui écrivent des bits voisins sont en course. Pour un vrai conteneur, je prends
  `std::vector<char>`. »
cards:
  - key: specialisation
    format: course
    question: "En quoi `std::vector<bool>` diffère-t-il d'un `std::vector` ordinaire ?"
    choices:
      - {text: "C'est une spécialisation qui range chaque booléen sur un bit, et non sur un octet", correct: true}
      - {text: "C'est un vecteur dont les éléments ne peuvent plus être modifiés après l'insertion", correct: false}
      - {text: "C'est un vecteur de taille fixe, dont la capacité est décidée à la compilation", correct: false}
      - {text: "C'est un vecteur qui range ses éléments sur la pile, et non sur le tas", correct: false}
    answer: "Huit booléens tiennent dans un octet. Ce gain de place se paie : les éléments ne sont plus des objets `bool` que l'on peut désigner."
  - key: mandataire
    format: course
    question: "Que renvoie `v[0]` sur un `std::vector<bool>` non constant ?"
    choices:
      - {text: "Un objet mandataire, qui lit et écrit le bit visé", correct: true}
      - {text: "Une référence `bool&` vers l'élément", correct: false}
      - {text: "Un pointeur `bool*` vers l'élément", correct: false}
      - {text: "Un entier qui contient les huit bits voisins", correct: false}
    answer: "Un bit n'a pas d'adresse : il ne peut pas y avoir de `bool&`. Le type `std::vector<bool>::reference` imite une référence, sans en être une."
  - key: auto
    format: course
    question: "Que fait `auto x = v[0];` quand `v` est un `std::vector<bool>` ?"
    choices:
      - {text: "Il déclare un mandataire lié au vecteur : écrire dans `x` modifie `v[0]`", correct: true}
      - {text: "Il déclare un `bool` indépendant, copie de la valeur de `v[0]`", correct: false}
      - {text: "Il déclare un `int` qui vaut 0 ou 1, converti depuis le bit", correct: false}
      - {text: "Il ne compile pas : `auto` refuse les éléments d'un vecteur de bits", correct: false}
    answer: "`auto` déduit le type du mandataire, pas `bool`. Pour une copie, on écrit `bool x = v[0];`."
  - key: alternative
    format: course
    question: "Que choisis-tu pour un tableau dynamique de booléens dont tu dois prendre des références et des pointeurs ?"
    choices:
      - {text: "`std::vector<char>`, ou `std::vector<std::uint8_t>`", correct: true}
      - {text: "`std::vector<bool>`, avec `auto&` partout", correct: false}
      - {text: "`std::bitset`, redimensionné à l'exécution", correct: false}
      - {text: "`std::vector<bool*>`, alloué élément par élément", correct: false}
    answer: "Un octet par élément, et un vrai conteneur : références, pointeurs, `data()`. `std::bitset` a une taille fixée à la compilation."
  - key: vf-reference
    format: true-false
    question: "On peut écrire `bool& r = v[0];` quand `v` est un `std::vector<bool>`."
    truth: false
    answer: "`v[0]` rend un objet temporaire, le mandataire, auquel une référence non constante vers `bool` ne peut pas se lier."
  - key: vf-data
    format: true-false
    question: "`std::vector<bool>` offre la fonction `data()`, comme les autres vecteurs."
    truth: false
    answer: "Il n'y a pas de tableau de `bool` à désigner : les valeurs sont tassées dans des mots."
  - key: vf-threads
    format: true-false
    question: "Deux threads peuvent écrire sans synchronisation dans deux éléments différents d'un `std::vector<bool>`."
    truth: false
    answer: "Deux bits voisins partagent le même mot : les deux écritures touchent la même mémoire. C'est une course aux données."
  - key: vf-flip
    format: true-false
    question: "`v.flip()` inverse tous les bits d'un `std::vector<bool>`."
    truth: true
    answer: "C'est une fonction propre à cette spécialisation. `v[i].flip()` inverse un seul bit."
  - key: qcm-parcours
    format: multiple-choice
    question: "Quelle boucle permet de modifier les éléments d'un `std::vector<bool>` ?"
    choices:
      - {text: "`for (auto&& x : v)`", correct: true}
      - {text: "`for (auto& x : v)`", correct: false}
      - {text: "`for (bool& x : v)`", correct: false}
      - {text: "`for (bool x : v)`", correct: false}
    answer: "`auto&&` accepte le mandataire temporaire. `auto&` et `bool&` ne compilent pas, et `bool x` travaille sur une copie."
  - key: qcm-taille-fixe
    format: multiple-choice
    question: "Tu as besoin de 64 drapeaux, dont le nombre ne changera jamais. Que choisis-tu ?"
    choices:
      - {text: "`std::bitset<64>`", correct: true}
      - {text: "`std::vector<bool>`", correct: false}
      - {text: "`std::vector<int>`", correct: false}
      - {text: "`std::list<bool>`", correct: false}
    answer: "`std::bitset` tient sur la pile, sans allocation, et offre les opérations bit à bit."
  - key: qcm-type
    format: multiple-choice
    question: "Quel est le type de `x` dans `auto x = v[0];`, où `v` est un `std::vector<bool>` ?"
    choices:
      - {text: "`std::vector<bool>::reference`", correct: true}
      - {text: "`bool`", correct: false}
      - {text: "`bool&`", correct: false}
      - {text: "`std::bitset<1>`", correct: false}
    answer: "C'est la classe mandataire du vecteur. Elle se convertit en `bool`, et son affectation écrit le bit."
  - key: qcm-generique
    format: multiple-choice
    question: "Pourquoi `std::vector<bool>` pose-t-il problème dans un template écrit pour `std::vector<T>` ?"
    choices:
      - {text: "Le code qui prend `T&` ou `T*` sur un élément ne compile plus", correct: true}
      - {text: "Le template est instancié deux fois pour le type `bool`", correct: false}
      - {text: "Le type `bool` ne peut pas être un argument de template", correct: false}
      - {text: "Le vecteur de bits ne connaît pas sa propre taille", correct: false}
    answer: "Le code générique suppose que `v[i]` est un `T&`. Pour `bool`, c'est un mandataire : le contrat d'un conteneur n'est pas tenu."
  - key: code-auto-mandataire
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v{true, true};
          auto a = v[0];
          bool b = v[1];
          a = false;
          b = false;
          std::println("{} {}", static_cast<bool>(v[0]), static_cast<bool>(v[1]));
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `a` est un mandataire, l'affecter modifie `v[0]`. `b` est un vrai `bool`, copie indépendante de `v[1]`."
    check:
      output: "false true"
  - key: code-flip
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v{true, false, false};
          v.flip();
          v[0].flip();
          int vrais = 0;
          for (bool x : v) {
              vrais += x;
          }
          std::println("{}", vrais);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`3` : `flip()` donne faux, vrai, vrai. `v[0].flip()` remet le premier à vrai : trois bits à vrai."
    check:
      output: "3"
  - key: code-boucle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v(3, false);
          for (bool x : v) {
              x = true;
          }
          const bool avant = v[1];
          for (auto&& x : v) {
              x = true;
          }
          std::println("{} {}", avant, static_cast<bool>(v[1]));
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : `bool x` est une copie, la première boucle ne change rien. `auto&&` reçoit le mandataire : la seconde écrit dans le vecteur."
    check:
      output: "false true"
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v(10, true);
          v.push_back(false);
          std::println("{} {}", v.size(), v.capacity() >= 64);
      }
      ```
    choices:
      - {text: "`11 true`", correct: true}
      - {text: "`11 false`", correct: false}
      - {text: "`2 true`", correct: false}
      - {text: "`88 true`", correct: false}
    answer: "`11 true` : la taille compte les booléens, pas les bits ni les octets. La capacité avance par mots entiers de 64 bits."
    check:
      output: "11 true"
  - key: bug-reference
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind non-const lvalue reference of type 'bool&' to an rvalue of type 'bool' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> drapeaux{false, false};
          bool& premier = drapeaux[0];
          premier = true;
          std::println("{}", static_cast<bool>(drapeaux[0]));
      }
      ```
    choices:
      - {text: "Écrire `auto premier = drapeaux[0];`, qui garde le mandataire", correct: true}
      - {text: "Écrire `bool premier = drapeaux[0];`, qui copie la valeur", correct: false}
      - {text: "Écrire `bool* premier = &drapeaux[0];`, puis `*premier = true;`", correct: false}
      - {text: "Écrire `const bool& premier = drapeaux[0];`, sans rien changer d'autre", correct: false}
    answer: |-
      ```cpp
      auto premier = drapeaux[0];
      premier = true;
      ```
      `drapeaux[0]` n'est pas un `bool`, mais un mandataire temporaire. `auto` le garde, et l'affecter écrit dans le
      vecteur. Un `bool` copié ne modifierait rien, et l'on ne prend pas l'adresse d'un bit.
  - key: bug-boucle-reference
    format: bug-fix
    question: |-
      Le compilateur refuse la boucle : il ne peut pas lier `auto&` à l'élément d'un `std::vector<bool>`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v(3, false);
          for (auto& x : v) {
              x = true;
          }
          std::println("{}", static_cast<bool>(v[2]));
      }
      ```
    choices:
      - {text: "Écrire `for (auto&& x : v)`", correct: true}
      - {text: "Écrire `for (bool x : v)`", correct: false}
      - {text: "Écrire `for (bool& x : v)`", correct: false}
      - {text: "Écrire `for (const auto& x : v)`", correct: false}
    answer: |-
      ```cpp
      for (auto&& x : v) {
          x = true;
      }
      ```
      L'itérateur rend un mandataire temporaire, qu'une référence non constante refuse. `auto&&` l'accepte. Avec
      `bool x`, on modifierait une copie ; avec `const auto&`, l'affectation serait refusée.
  - key: bug-auto-copie
    format: bug-fix
    question: |-
      Ce programme veut garder l'ancienne valeur, changer le drapeau, puis afficher `true false`. Il affiche
      `false false`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v{true};
          auto ancien = v[0];
          v[0] = false;
          std::println("{} {}", static_cast<bool>(ancien), static_cast<bool>(v[0]));
      }
      ```
    choices:
      - {text: "Déclarer `bool ancien = v[0];`", correct: true}
      - {text: "Déclarer `auto&& ancien = v[0];`", correct: false}
      - {text: "Déclarer `const auto ancien = v[0];`", correct: false}
      - {text: "Déclarer `auto ancien = &v[0];`", correct: false}
    answer: |-
      ```cpp
      bool ancien = v[0];
      ```
      `auto` déduit le mandataire, qui continue de désigner le bit : il voit la modification. Écrire `bool` force
      la conversion, donc une vraie copie.
  - key: bug-println
    format: bug-fix
    question: |-
      Le compilateur répond « std::formatter must be specialized for each type being formatted ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> v{true, false};
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Afficher `static_cast<bool>(v[0])`", correct: true}
      - {text: "Afficher `&v[0]`, l'adresse de l'élément", correct: false}
      - {text: "Afficher `v.data()[0]`, le premier octet", correct: false}
      - {text: "Afficher `*v[0]`, la valeur désignée", correct: false}
    answer: |-
      ```cpp
      std::println("{}", static_cast<bool>(v[0]));
      ```
      `v[0]` est un mandataire, que la bibliothèque de GCC 14 ne sait pas mettre en forme. On le convertit en
      `bool`. `data()` n'existe pas sur ce vecteur, et un bit n'a pas d'adresse.
