notion: map-acces
lesson: |-
  `std::map` et `std::unordered_map` offrent plusieurs façons de lire et d'écrire un élément. Elles diffèrent par
  ce qu'elles font quand la clé est **absente**, et quand elle est **déjà là**.

  **Lire.**

  | Fonction | Clé présente | Clé absente | Sur une map `const` |
  |---|---|---|---|
  | `m[cle]` | référence vers la valeur | **insère** une valeur nulle | non |
  | `m.at(cle)` | référence vers la valeur | lance `std::out_of_range` | oui |
  | `m.find(cle)` | itérateur sur l'élément | `m.end()` | oui |
  | `m.contains(cle)` (C++20) | `true` | `false` | oui |
  | `m.count(cle)` | `1` | `0` | oui |

  `find` est le plus complet : un seul parcours donne à la fois la réponse et l'accès.

  ```cpp
  if (auto it = m.find(cle); it != m.end()) {
      utiliser(it->second);
  }
  ```

  Écrire `if (m.contains(cle)) { utiliser(m[cle]); }` cherche **deux fois**.

  **Écrire.**

  | Fonction | Clé absente | Clé présente | Renvoie |
  |---|---|---|---|
  | `m[cle] = v` | insère | **remplace** | une référence |
  | `m.insert({cle, v})` | insère | ne fait rien | `{itérateur, bool}` |
  | `m.emplace(cle, v)` | insère | ne fait rien | `{itérateur, bool}` |
  | `m.try_emplace(cle, args...)` | insère | ne fait rien, **sans toucher aux arguments** | `{itérateur, bool}` |
  | `m.insert_or_assign(cle, v)` | insère | **remplace** | `{itérateur, bool}` |

  Le booléen dit si une **insertion** a eu lieu.

  ```cpp
  auto [it, insere] = m.try_emplace("kiwi", 5);
  if (!insere) {
      it->second += 5;         // la clé existait : on met à jour
  }
  ```

  **`try_emplace` contre `emplace`.** Si la clé existe, `emplace` peut avoir déjà construit, voire **déplacé**,
  la valeur avant de s'en apercevoir. `try_emplace` garantit de ne rien toucher : un argument passé par
  `std::move` reste intact. Il construit aussi la valeur sur place, à partir de ses arguments.

  **`insert_or_assign` contre `operator[]`.** Les deux remplacent. Mais `m[cle] = v` commence par construire une
  valeur **par défaut**, puis l'affecte : il exige que le type de la valeur ait un constructeur par défaut.
  `insert_or_assign` non, et il dit en plus s'il a inséré ou remplacé.

  **Effacer.** `m.erase(cle)` renvoie le nombre d'éléments retirés (0 ou 1) ; `m.erase(it)` renvoie l'itérateur
  suivant.

  **En entretien** : « Pour lire, `find` : un seul parcours, et rien n'est inséré. `at` si l'absence est une
  erreur, `contains` pour un simple test. Pour écrire : `try_emplace` pour insérer sans écraser,
  `insert_or_assign` pour écraser, et `operator[]` quand une valeur par défaut me convient, comme pour un
  compteur. »
cards:
  - key: find
    format: course
    question: "Pourquoi préférer `find` à `contains` suivi de `operator[]` ?"
    choices:
      - {text: "`find` cherche la clé une seule fois, et donne accès à l'élément trouvé", correct: true}
      - {text: "`find` insère la clé quand elle est absente, ce qui évite un test", correct: false}
      - {text: "`find` lance une exception quand la clé est absente", correct: false}
      - {text: "`find` est le seul à fonctionner sur une map non constante", correct: false}
    answer: "`contains` puis `[]` parcourent l'arbre deux fois. `find` renvoie un itérateur : on le compare à `end()`, puis on lit `it->second`."
  - key: try-emplace
    format: course
    question: "Que fait `m.try_emplace(cle, valeur)` quand la clé est déjà dans la map ?"
    choices:
      - {text: "Rien : la valeur existante est gardée, et l'argument n'est pas touché", correct: true}
      - {text: "Il remplace la valeur existante par la nouvelle", correct: false}
      - {text: "Il lance une exception `std::invalid_argument`", correct: false}
      - {text: "Il ajoute un second élément avec la même clé", correct: false}
    answer: "Il n'insère que si la clé est absente. Contrairement à `emplace`, il garantit de ne pas déplacer un argument passé par `std::move` quand il n'insère pas."
  - key: insert-or-assign
    format: course
    question: "Quelle différence entre `m.insert_or_assign(cle, v)` et `m.insert({cle, v})` ?"
    choices:
      - {text: "Quand la clé existe, `insert_or_assign` remplace la valeur ; `insert` ne fait rien", correct: true}
      - {text: "Quand la clé existe, `insert_or_assign` ne fait rien ; `insert` remplace la valeur", correct: false}
      - {text: "Quand la clé est absente, `insert_or_assign` ne fait rien ; `insert` l'ajoute", correct: false}
      - {text: "Aucune : les deux fonctions sont synonymes", correct: false}
    answer: "Les deux insèrent une clé absente. Seul `insert_or_assign` écrase une valeur existante ; son booléen dit s'il a inséré ou remplacé."
  - key: retour
    format: course
    question: "Que renvoient `insert`, `emplace` et `try_emplace` sur une `std::map` ?"
    choices:
      - {text: "Une paire : un itérateur sur l'élément, et un booléen qui dit si l'insertion a eu lieu", correct: true}
      - {text: "Un booléen seul, qui dit si la clé était déjà présente dans la map avant l'appel", correct: false}
      - {text: "Une référence vers la valeur de la clé, qu'elle vienne d'être insérée ou non", correct: false}
      - {text: "Le nombre d'éléments que contient la map après l'appel de la fonction", correct: false}
    answer: "L'itérateur désigne l'élément, qu'il vienne d'être inséré ou qu'il ait déjà existé. On les lit avec `auto [it, insere] = ...`."
  - key: vf-at-const
    format: true-false
    question: "`at` s'utilise sur une map déclarée `const`."
    truth: true
    answer: "Il n'insère jamais : il lance `std::out_of_range` pour une clé absente. C'est `operator[]` qui est interdit sur une map constante."
  - key: vf-emplace-remplace
    format: true-false
    question: "`emplace` remplace la valeur quand la clé existe déjà."
    truth: false
    answer: "Comme `insert`, il ne fait rien dans ce cas. Pour remplacer : `insert_or_assign`, ou `operator[]`."
  - key: vf-crochets-defaut
    format: true-false
    question: "`m[cle] = v` exige que le type de la valeur ait un constructeur par défaut."
    truth: true
    answer: "`operator[]` construit d'abord une valeur par défaut, puis l'affecte. `insert_or_assign` et `try_emplace` s'en passent."
  - key: vf-count
    format: true-false
    question: "Sur une `std::map`, `count(cle)` peut renvoyer 2."
    truth: false
    answer: "Les clés sont uniques : `count` renvoie 0 ou 1. C'est sur une `std::multimap` qu'il peut dépasser 1."
  - key: qcm-inserer-sans-ecraser
    format: multiple-choice
    question: "Quelle ligne insère `{\"kiwi\", 5}` seulement si la clé est absente ?"
    choices:
      - {text: "`m.try_emplace(\"kiwi\", 5);`", correct: true}
      - {text: "`m[\"kiwi\"] = 5;`", correct: false}
      - {text: "`m.insert_or_assign(\"kiwi\", 5);`", correct: false}
      - {text: "`m.at(\"kiwi\") = 5;`", correct: false}
    answer: "`try_emplace` ne touche pas à une clé existante. `[]` et `insert_or_assign` l'écrasent ; `at` lance une exception si elle manque."
  - key: qcm-absence-erreur
    format: multiple-choice
    question: "L'absence de la clé est une erreur du programme. Quel accès le signale par une exception ?"
    choices:
      - {text: "`m.at(cle)`", correct: true}
      - {text: "`m[cle]`", correct: false}
      - {text: "`m.find(cle)`", correct: false}
      - {text: "`m.count(cle)`", correct: false}
    answer: "`at` lance `std::out_of_range`. `[]` insérerait en silence ; `find` et `count` laissent le test à l'appelant."
  - key: qcm-liaison
    format: multiple-choice
    question: "Quelle ligne récupère l'itérateur et le booléen renvoyés par `try_emplace` ?"
    choices:
      - {text: "`auto [it, insere] = m.try_emplace(cle, 1);`", correct: true}
      - {text: "`auto it, insere = m.try_emplace(cle, 1);`", correct: false}
      - {text: "`auto {it, insere} = m.try_emplace(cle, 1);`", correct: false}
      - {text: "`auto (it, insere) = m.try_emplace(cle, 1);`", correct: false}
    answer: "Une liaison structurée décompose la paire. Sans elle : `resultat.first` et `resultat.second`."
  - key: qcm-erase
    format: multiple-choice
    question: "Que renvoie `m.erase(cle)` ?"
    choices:
      - {text: "Le nombre d'éléments retirés : 0 ou 1", correct: true}
      - {text: "La valeur de l'élément retiré", correct: false}
      - {text: "Un itérateur sur l'élément retiré", correct: false}
      - {text: "Rien : `erase` renvoie `void`", correct: false}
    answer: "On sait ainsi si la clé existait. La version qui prend un itérateur renvoie l'itérateur suivant."
  - key: trous-find
    format: fill-in
    question: |-
      Complète pour chercher la clé une seule fois :
      ```cpp
      if (auto it = m.___(cle); it != m.end()) {
          std::println("{}", it->second);
      }
      ```
    blanks:
      - [find]
    answer: "`find` renvoie un itérateur sur l'élément, ou `end()`."
  - key: trous-try-emplace
    format: fill-in
    question: |-
      Complète pour insérer sans écraser une valeur existante :
      ```cpp
      auto [it, insere] = m.___("kiwi", 5);
      ```
    blanks:
      - [try_emplace, emplace]
    answer: "`try_emplace` n'insère que si la clé est absente."
  - key: trous-insert-or-assign
    format: fill-in
    question: |-
      Complète pour insérer la clé, ou remplacer sa valeur si elle existe :
      ```cpp
      m.___("kiwi", 8);
      ```
    blanks:
      - [insert_or_assign]
    answer: "`insert_or_assign` insère ou remplace."
  - key: trous-second
    format: fill-in
    question: |-
      Complète pour savoir si l'insertion a eu lieu :
      ```cpp
      const bool insere = m.insert({"kiwi", 5}).___;
      ```
    blanks:
      - [second]
    answer: "`insert` renvoie une paire : `first` est l'itérateur, `second` le booléen."
  - key: code-try-emplace
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> m{{"a", 1}};
          const auto [it1, r1] = m.try_emplace("a", 9);
          const auto [it2, r2] = m.try_emplace("b", 2);
          std::println("{} {} {} {}", r1, it1->second, r2, m.size());
      }
      ```
    choices:
      - {text: "`false 1 true 2`", correct: true}
      - {text: "`true 9 true 2`", correct: false}
      - {text: "`false 9 true 2`", correct: false}
      - {text: "`false 1 false 1`", correct: false}
    answer: "`false 1 true 2` : `a` existe, rien n'est inséré et sa valeur reste 1. `b` est insérée."
    check:
      output: "false 1 true 2"
  - key: code-insert-or-assign
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> m{{"a", 1}};
          const bool r1 = m.insert_or_assign("a", 7).second;
          const bool r2 = m.insert_or_assign("b", 3).second;
          std::println("{} {} {}", r1, r2, m.at("a") + m.at("b"));
      }
      ```
    choices:
      - {text: "`false true 10`", correct: true}
      - {text: "`true true 10`", correct: false}
      - {text: "`false true 4`", correct: false}
      - {text: "`false false 8`", correct: false}
    answer: "`false true 10` : pour `a`, la valeur est remplacée par 7 : pas d'insertion. `b` est insérée avec 3. 7 + 3 = 10."
    check:
      output: "false true 10"
  - key: code-move-intact
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          std::map<int, std::string> m{{1, "ancien"}};
          std::string nouveau = "une chaîne assez longue";
          m.try_emplace(1, std::move(nouveau));
          std::println("{} {}", m.at(1), nouveau.empty());
      }
      ```
    choices:
      - {text: "`ancien false`", correct: true}
      - {text: "`ancien true`", correct: false}
      - {text: "`une chaîne assez longue true`", correct: false}
      - {text: "`une chaîne assez longue false`", correct: false}
    answer: "`ancien false` : la clé 1 existe, donc `try_emplace` n'insère rien, et garantit de ne pas toucher à `nouveau`, malgré le `std::move`."
    check:
      output: "ancien false"
  - key: code-find-at
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <stdexcept>

      int main() {
          const std::map<int, int> m{{1, 10}, {2, 20}};
          const auto it = m.find(3);
          int total = it != m.end() ? it->second : 0;
          try {
              total += m.at(2);
              total += m.at(3);
          } catch (const std::out_of_range&) {
              total += 100;
          }
          std::println("{} {}", total, m.size());
      }
      ```
    choices:
      - {text: "`120 2`", correct: true}
      - {text: "`20 2`", correct: false}
      - {text: "`120 3`", correct: false}
      - {text: "`100 2`", correct: false}
    answer: "`120 2` : `find(3)` renvoie `end()`, donc 0. `at(2)` ajoute 20 ; `at(3)` lance l'exception, et le `catch` ajoute 100. Rien n'a été inséré."
    check:
      output: "120 2"
  - key: bug-double-recherche-insertion
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1` : il ne fait que consulter les scores. Il affiche `2`. Quelle correction est
      la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int score(std::map<std::string, int>& scores, const std::string& nom) {
          return scores[nom];
      }

      int main() {
          std::map<std::string, int> scores{{"Ada", 12}};
          score(scores, "Alan");
          std::println("{}", scores.size());
      }
      ```
    choices:
      - {text: "Chercher avec `find`, et renvoyer `0` quand il rend `scores.end()`", correct: true}
      - {text: "Écrire `return scores[nom] + 0;` dans la fonction", correct: false}
      - {text: "Passer `nom` par valeur à la fonction `score`", correct: false}
      - {text: "Écrire `return scores.emplace(nom, 0).first->second;`", correct: false}
    answer: |-
      ```cpp
      int score(const std::map<std::string, int>& scores, const std::string& nom) {
          const auto it = scores.find(nom);
          return it != scores.end() ? it->second : 0;
      }
      ```
      `operator[]` insère la clé absente. `find` consulte sans modifier, ce qui permet de recevoir la map par
      référence constante. `emplace` insérerait lui aussi.
  - key: bug-insert-pour-remplacer
    format: bug-fix
    question: |-
      Ce programme devrait afficher `25` après la mise à jour. Il affiche `20`. Quelle correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> prix{{"livre", 20}};
          prix.try_emplace("livre", 25);
          std::println("{}", prix.at("livre"));
      }
      ```
    choices:
      - {text: "Appeler `prix.insert_or_assign(\"livre\", 25);`", correct: true}
      - {text: "Appeler `prix.emplace(\"livre\", 25);`", correct: false}
      - {text: "Appeler `prix.insert({\"livre\", 25});`", correct: false}
      - {text: "Appeler `prix.try_emplace(\"livre\", 25).second;`", correct: false}
    answer: |-
      ```cpp
      prix.insert_or_assign("livre", 25);
      ```
      `try_emplace`, `emplace` et `insert` n'écrasent jamais une clé existante. `insert_or_assign` remplace, comme
      `prix["livre"] = 25;`.
  - key: bug-crochets-sans-defaut
    format: bug-fix
    question: |-
      Le compilateur refuse `capteurs[1] = Capteur{20};` : il ne trouve pas de constructeur `Capteur()`. Quelle
      correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>

      struct Capteur {
          explicit Capteur(int seuil) : seuil{seuil} {}
          int seuil;
      };

      int main() {
          std::map<int, Capteur> capteurs;
          capteurs[1] = Capteur{20};
          std::println("{}", capteurs.at(1).seuil);
      }
      ```
    choices:
      - {text: "Écrire `capteurs.insert_or_assign(1, Capteur{20});`", correct: true}
      - {text: "Écrire `capteurs.at(1) = Capteur{20};`", correct: false}
      - {text: "Écrire `capteurs[1] = 20;`", correct: false}
      - {text: "Écrire `capteurs.find(1)->second = Capteur{20};`", correct: false}
    answer: |-
      ```cpp
      capteurs.insert_or_assign(1, Capteur{20});
      ```
      `operator[]` doit pouvoir construire une valeur par défaut pour une clé absente. `insert_or_assign` et
      `try_emplace` n'en ont pas besoin. `at` et `find` échoueraient : la clé n'existe pas encore.
  - key: bug-find-sans-test
    format: bug-fix
    question: |-
      Ce programme déréférence le résultat de `find` pour une clé absente : son comportement est indéfini. Quelle
      correction est la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          const std::map<std::string, int> stock{{"pomme", 12}};
          const auto it = stock.find("kiwi");
          std::println("{}", it->second);
      }
      ```
    choices:
      - {text: "N'afficher `it->second` que si `it != stock.end()`", correct: true}
      - {text: "N'afficher `it->second` que si `it->second != 0`", correct: false}
      - {text: "N'afficher `it->second` que si `it != nullptr`", correct: false}
      - {text: "Afficher `it->first` à la place de `it->second`", correct: false}
    answer: |-
      ```cpp
      if (it != stock.end()) {
          std::println("{}", it->second);
      }
      ```
      Pour une clé absente, `find` renvoie `end()`, qui ne désigne aucun élément. Un itérateur ne se compare pas à
      `nullptr`, et lire `it->second` pour le tester est déjà la faute.
