notion: flat-map
lesson: |-
  `std::flat_map` et `std::flat_set` (C++23, en-têtes `<flat_map>` et `<flat_set>`) offrent l'interface de
  `std::map` et `std::set`, mais rangent leurs éléments dans des **tableaux contigus triés**, et non dans un arbre
  de nœuds.

  **Attention à la disponibilité.** Ils font partie de C++23, mais toutes les bibliothèques ne les fournissent pas
  encore : celle de GCC 14 ne les a pas (ils arrivent avec GCC 15). Avant de s'en servir, on vérifie son
  compilateur ; `boost::container::flat_map` existe depuis longtemps, avec la même idée.

  **La structure.** Un `std::flat_map<K, V>` est un **adaptateur** : il tient deux conteneurs, par défaut deux
  `std::vector`, l'un pour les **clés triées**, l'autre pour les **valeurs**, dans le même ordre. La recherche est
  une **dichotomie** sur le tableau des clés.

  ```cpp
  std::flat_map<std::string, int> stock;
  stock["kiwi"] = 5;
  stock.insert({"pomme", 12});
  if (stock.contains("kiwi")) { ... }
  ```

  **Ce qu'on y gagne, ce qu'on y perd.**

  | | `std::map` | `std::flat_map` |
  |---|---|---|
  | Structure | arbre de nœuds alloués un par un | tableaux contigus triés |
  | Recherche | O(log n), en sautant de nœud en nœud | O(log n), dans de la mémoire contiguë |
  | Parcours | lent : nœuds dispersés | **rapide** : mémoire contiguë |
  | Insertion, suppression | O(log n) | **O(n)** : il faut décaler les éléments |
  | Mémoire | trois pointeurs par élément en plus | presque rien en plus |
  | Itérateurs et références après insertion | restent valables | **invalidés** |

  La complexité de la recherche est la même, mais la **localité mémoire** change tout en pratique : le processeur
  lit des clés voisines, au lieu de suivre des pointeurs.

  **Quand le choisir.** Quand la table est **remplie une fois, puis surtout consultée** : une configuration, un
  dictionnaire, une table de correspondance. Et quand elle est **petite** : jusqu'à quelques centaines
  d'éléments, même les insertions restent rapides.

  **Quand l'éviter.** Quand on insère et retire **sans cesse** dans une grande table, ou quand le code garde des
  **itérateurs, pointeurs ou références** vers les éléments : toute insertion peut les invalider, comme dans un
  vecteur.

  **Construire d'un coup.** Insérer n éléments un à un coûte O(n²). On construit plutôt à partir d'une suite déjà
  prête ; si elle est triée et sans doublon, l'étiquette `std::sorted_unique` évite un tri.

  **Avant C++23.** Le même résultat s'obtient à la main : un `std::vector<std::pair<K, V>>` trié, consulté avec
  `std::lower_bound`.

  **En entretien** : « `std::flat_map` garde l'interface d'une map, mais dans des vecteurs triés : recherche par
  dichotomie en mémoire contiguë, parcours rapide, peu de mémoire. En échange, insérer coûte O(n) et invalide les
  itérateurs. C'est le bon choix pour une table qu'on lit bien plus qu'on ne la modifie. »
cards:
  - key: structure
    format: course
    question: "Comment un `std::flat_map` range-t-il ses éléments ?"
    choices:
      - {text: "Dans des tableaux contigus, triés par clé", correct: true}
      - {text: "Dans un arbre équilibré de nœuds, trié par clé", correct: false}
      - {text: "Dans une table de hachage, sans ordre", correct: false}
      - {text: "Dans une liste chaînée, triée par clé", correct: false}
    answer: "Par défaut, deux `std::vector` : les clés triées d'un côté, les valeurs de l'autre. C'est ce qui le distingue de `std::map`."
  - key: avantage
    format: course
    question: "Pourquoi une recherche dans un `std::flat_map` est-elle souvent plus rapide que dans une `std::map`, à complexité égale ?"
    choices:
      - {text: "Elle lit de la mémoire contiguë, au lieu de suivre des pointeurs de nœud en nœud", correct: true}
      - {text: "Elle calcule un hachage de la clé, au lieu de comparer les clés une à une", correct: false}
      - {text: "Elle parcourt les éléments dans plusieurs threads, au lieu d'un seul", correct: false}
      - {text: "Elle compare des entiers, au lieu de comparer les clés elles-mêmes", correct: false}
    answer: "Les deux sont en O(log n). Mais la dichotomie dans un vecteur profite du cache du processeur, alors que chaque nœud d'un arbre peut être n'importe où en mémoire."
  - key: cout-insertion
    format: course
    question: "Quel est le coût d'une insertion dans un `std::flat_map` de `n` éléments ?"
    choices:
      - {text: "O(n) : les éléments suivants doivent être décalés", correct: true}
      - {text: "O(log n) : comme dans une `std::map`", correct: false}
      - {text: "O(1) en moyenne : comme dans une table de hachage", correct: false}
      - {text: "O(n log n) : la table est triée de nouveau", correct: false}
    answer: "Trouver la place coûte O(log n), mais insérer au milieu d'un vecteur décale tout ce qui suit. C'est le prix de la contiguïté."
  - key: quand
    format: course
    question: "Dans quel cas `std::flat_map` est-il le bon choix ?"
    choices:
      - {text: "Une table remplie une fois, puis surtout consultée", correct: true}
      - {text: "Une grande table où l'on insère et retire sans cesse", correct: false}
      - {text: "Une table dont on garde des références vers les éléments", correct: false}
      - {text: "Une table dont l'ordre des clés n'a aucune importance", correct: false}
    answer: "Lectures rapides et mémoire compacte, insertions coûteuses. Sans besoin d'ordre, une table de hachage reste plus rapide encore."
  - key: vf-interface
    format: true-false
    question: "`std::flat_map` offre `operator[]`, `find` et `contains`, comme `std::map`."
    truth: true
    answer: "L'interface est presque la même : on peut souvent remplacer l'un par l'autre sans toucher au code."
  - key: vf-invalidation
    format: true-false
    question: "Une insertion dans un `std::flat_map` laisse valables les itérateurs existants, comme dans une `std::map`."
    truth: false
    answer: "Les éléments vivent dans des vecteurs : une insertion les décale, ou réalloue. Itérateurs et références sont invalidés."
  - key: vf-gcc14
    format: true-false
    question: "L'en-tête `<flat_map>` est fourni par la bibliothèque standard de GCC 14."
    truth: false
    answer: "Il fait partie de C++23, mais libstdc++ ne le fournit qu'à partir de GCC 15. On vérifie son compilateur avant de s'en servir."
  - key: vf-trie
    format: true-false
    question: "Un `std::flat_map` se parcourt dans l'ordre croissant de ses clés."
    truth: true
    answer: "Les clés sont gardées triées, comme dans une `std::map`."
  - key: qcm-norme
    format: multiple-choice
    question: "Dans quelle norme `std::flat_map` est-il entré ?"
    choices:
      - {text: "C++23", correct: true}
      - {text: "C++11", correct: false}
      - {text: "C++17", correct: false}
      - {text: "C++20", correct: false}
    answer: "C++23, avec `std::flat_set`, `std::flat_multimap` et `std::flat_multiset`."
  - key: qcm-equivalent
    format: multiple-choice
    question: "Comment obtenait-on l'équivalent d'un `std::flat_map` avant C++23, sans bibliothèque tierce ?"
    choices:
      - {text: "Un `std::vector` de paires trié, consulté avec `std::lower_bound`", correct: true}
      - {text: "Une `std::list` de paires, consultée avec `std::find`", correct: false}
      - {text: "Une `std::map` sur laquelle on appelle `reserve`", correct: false}
      - {text: "Une `std::deque` de paires, consultée par ses deux bouts", correct: false}
    answer: "C'est la même structure, écrite à la main : mémoire contiguë, et recherche par dichotomie."
  - key: qcm-memoire
    format: multiple-choice
    question: "Pourquoi un `std::flat_map` occupe-t-il moins de mémoire qu'une `std::map` ?"
    choices:
      - {text: "Il n'a pas de nœuds : ni pointeurs par élément, ni allocation séparée", correct: true}
      - {text: "Il ne garde que les clés : les valeurs sont recalculées", correct: false}
      - {text: "Il compresse les clés et les valeurs qu'il contient", correct: false}
      - {text: "Il range ses éléments sur la pile, et non sur le tas", correct: false}
    answer: "Chaque nœud d'un arbre porte trois pointeurs et sa propre allocation. Deux vecteurs n'ajoutent presque rien à la taille des données."
  - key: qcm-construction
    format: multiple-choice
    question: "Comment remplis-tu efficacement un `std::flat_map` de dix mille éléments connus d'avance ?"
    choices:
      - {text: "En le construisant d'un coup, à partir de la suite complète des éléments", correct: true}
      - {text: "En insérant les éléments un par un, dans l'ordre décroissant des clés", correct: false}
      - {text: "En insérant les éléments un par un, après un appel à `clear`", correct: false}
      - {text: "En insérant chaque élément deux fois, pour forcer le tri", correct: false}
    answer: "Dix mille insertions une à une décalent chaque fois une partie du tableau : O(n²). Une construction globale trie une fois."
  - key: situation-configuration
    format: scenario
    question: |-
      Un service charge au démarrage une table de deux cents réglages, puis la consulte des millions de fois sans
      plus la modifier. Elle est aujourd'hui dans une `std::map`. Que proposes-tu, avec un compilateur qui le
      fournit ?
    choices:
      - {text: "Un `std::flat_map` : lectures en mémoire contiguë, et aucune insertion ensuite", correct: true}
      - {text: "Une `std::multimap` : elle accepte plusieurs valeurs pour un réglage", correct: false}
      - {text: "Une `std::list` de paires : l'insertion y est en temps constant", correct: false}
      - {text: "Une `std::map` de `std::map` : la recherche y est deux fois plus rapide", correct: false}
    answer: |-
      C'est le cas d'école : rempli une fois, lu sans cesse. Les deux cents clés tiennent dans quelques lignes de
      cache, et la dichotomie s'y fait sans suivre de pointeur. Une `std::unordered_map` serait aussi à mesurer.
  - key: situation-insertions
    format: scenario
    question: |-
      Un collègue a remplacé une `std::map` d'un million d'entrées par un `std::flat_map`, « parce que c'est plus
      rapide ». Le programme, qui insère et retire en continu, est devenu bien plus lent. Pourquoi ?
    choices:
      - {text: "Chaque insertion ou suppression décale jusqu'à un million d'éléments", correct: true}
      - {text: "Chaque recherche parcourt désormais le million d'éléments", correct: false}
      - {text: "Chaque insertion trie de nouveau toute la table", correct: false}
      - {text: "Chaque suppression laisse un trou qui n'est jamais comblé", correct: false}
    answer: |-
      Insérer dans un tableau trié coûte O(n) ; dans un arbre, O(log n). Sur une grande table très modifiée, la
      `std::map` ou une table de hachage restent le bon choix. Le gain du `std::flat_map` est en lecture.
  - key: situation-references
    format: scenario
    question: |-
      Après le passage d'une `std::map` à un `std::flat_map`, un programme plante de temps en temps. Il garde des
      références vers des valeurs de la table, et continue d'y insérer. Que s'est-il passé ?
    choices:
      - {text: "Les insertions déplacent les éléments : les références sont invalidées", correct: true}
      - {text: "Les insertions sont refusées quand une référence existe", correct: false}
      - {text: "Les références désignent des copies, qui ne sont plus à jour", correct: false}
      - {text: "Les références empêchent la table de rester triée", correct: false}
    answer: |-
      Une `std::map` garantit que ses nœuds ne bougent pas. Un `std::flat_map` se comporte comme un vecteur : une
      insertion décale ou réalloue. On garde alors des clés, pas des références.
  - key: situation-portabilite
    format: scenario
    question: |-
      Tu veux utiliser `std::flat_map`, mais le projet doit compiler avec GCC 14, dont la bibliothèque ne fournit
      pas `<flat_map>`. Que fais-tu ?
    choices:
      - {text: "J'utilise un vecteur de paires trié avec `std::lower_bound`, ou `boost::container::flat_map`", correct: true}
      - {text: "J'écris `#include <flat_map>` quand même : l'option `-std=c++23` suffit à le fournir", correct: false}
      - {text: "Je recopie l'en-tête `<flat_map>` d'un autre compilateur dans le projet", correct: false}
      - {text: "Je renonce à toute table triée, et je parcours un vecteur non trié", correct: false}
    answer: |-
      Une fonctionnalité de la norme n'existe que si la bibliothèque du compilateur l'implémente. La structure est
      simple à reproduire, et Boost en fournit une version éprouvée.
