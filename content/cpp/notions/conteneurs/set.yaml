notion: set
lesson: |-
  Un **ensemble** garde des valeurs **uniques**. C'est une map sans valeurs : il n'y a que des clés. La bibliothèque
  en fournit deux, comme pour les maps.

  | | `std::set` | `std::unordered_set` |
  |---|---|---|
  | Structure | arbre équilibré | table de hachage |
  | Ordre de parcours | **trié** | quelconque |
  | `insert`, `contains`, `erase` | O(log n) | O(1) en moyenne |
  | L'élément doit fournir | `<` | un hachage et `==` |

  ```cpp
  #include <set>

  std::set<int> vus{3, 1, 2, 3};      // contient 1, 2, 3 : le doublon est ignoré
  ```

  **Insérer.** `insert(valeur)` n'ajoute la valeur que si elle est absente. Il renvoie une paire : un itérateur sur
  l'élément, et un booléen qui dit si l'insertion **a eu lieu**.

  ```cpp
  if (vus.insert(identifiant).second) {
      // première fois qu'on rencontre cet identifiant
  }
  ```

  **Chercher.** `contains(valeur)` (C++20) répond par un booléen ; `find` renvoie un itérateur, ou `end()` ;
  `count` renvoie 0 ou 1. Il n'y a **pas d'`operator[]`** : un ensemble n'a pas de valeur associée, ni de position.

  **Effacer.** `erase(valeur)` renvoie le nombre d'éléments retirés : 0 ou 1.

  **Les éléments sont constants.** On ne modifie pas un élément en place : cela casserait le rangement. On
  l'efface, puis on insère la nouvelle valeur.

  **À quoi sert un ensemble.**

  - **Dédoublonner** : construire un ensemble à partir d'un vecteur retire les doublons, et `std::set` les trie au
    passage.
  - **Se souvenir de ce qu'on a vu** : un `std::unordered_set` d'identifiants répond « déjà vu ? » en temps
    constant.
  - **Garder trié en permanence** : `std::set` donne le plus petit élément avec `*s.begin()`, le plus grand avec
    `*s.rbegin()`.

  Pour garder les doublons, il existe `std::multiset`. Et pour seulement trier puis dédoublonner un vecteur une
  fois, `std::sort` suivi de `std::unique` reste plus rapide qu'un ensemble.

  **En entretien** : « Un ensemble garde des valeurs uniques : trié en O(log n) avec `std::set`, sans ordre et en
  O(1) en moyenne avec `std::unordered_set`. Le booléen que renvoie `insert` me dit si la valeur était nouvelle. »
cards:
  - key: principe
    format: course
    question: "Qu'est-ce qui distingue un `std::set` d'un `std::vector` ?"
    choices:
      - {text: "Il ne garde qu'un exemplaire de chaque valeur, et les range triées", correct: true}
      - {text: "Il garde les valeurs dans leur ordre d'insertion, doublons compris", correct: false}
      - {text: "Il range ses éléments côte à côte dans un bloc de mémoire", correct: false}
      - {text: "Il donne accès à ses éléments par leur indice", correct: false}
    answer: "Un ensemble refuse les doublons. `std::set` est un arbre trié : chercher, insérer et effacer coûtent O(log n)."
  - key: retour-de-insert
    format: course
    question: "Que renvoie `s.insert(valeur)` sur un `std::set` ?"
    choices:
      - {text: "Une paire : un itérateur sur l'élément, et un booléen qui dit si l'insertion a eu lieu", correct: true}
      - {text: "Un booléen seul, qui dit si la valeur était déjà dans l'ensemble avant l'appel", correct: false}
      - {text: "Le nombre d'éléments que contient l'ensemble après l'insertion de la valeur", correct: false}
      - {text: "Rien : `insert` renvoie `void`, et il faut appeler `contains` avant l'insertion", correct: false}
    answer: "`s.insert(x).second` vaut `true` quand `x` était nouveau. On teste et on insère en une seule opération."
  - key: set-ou-unordered-set
    format: course
    question: "Quand préfères-tu `std::unordered_set` à `std::set` ?"
    choices:
      - {text: "Quand seul compte de savoir vite si une valeur est présente, sans ordre", correct: true}
      - {text: "Quand il faut parcourir les valeurs de la plus petite à la plus grande", correct: false}
      - {text: "Quand il faut retrouver le plus petit élément en temps constant", correct: false}
      - {text: "Quand il faut garder plusieurs exemplaires de la même valeur", correct: false}
    answer: "La table de hachage répond en O(1) en moyenne, contre O(log n) pour l'arbre. On la paie en perdant l'ordre."
  - key: modifier-un-element
    format: course
    question: "Comment change-t-on la valeur d'un élément d'un `std::set` ?"
    choices:
      - {text: "On l'efface, puis on insère la nouvelle valeur", correct: true}
      - {text: "On l'affecte à travers un itérateur : `*it = valeur;`", correct: false}
      - {text: "On l'affecte par son indice : `s[0] = valeur;`", correct: false}
      - {text: "On appelle `s.replace(ancienne, nouvelle);`", correct: false}
    answer: "Les éléments d'un ensemble sont constants : les modifier en place fausserait leur rangement dans l'arbre."
  - key: vf-doublon
    format: true-false
    question: "Insérer dans un `std::set` une valeur déjà présente lève une exception."
    truth: false
    answer: "L'insertion est simplement ignorée. Le booléen renvoyé vaut `false`."
  - key: vf-trie
    format: true-false
    question: "Un `std::set<int>` se parcourt du plus petit au plus grand."
    truth: true
    answer: "L'arbre garde ses éléments triés avec `<`."
  - key: vf-crochets
    format: true-false
    question: "`s[0]` donne le plus petit élément d'un `std::set`."
    truth: false
    answer: "Un ensemble n'a pas d'`operator[]`. Le plus petit élément est `*s.begin()`."
  - key: vf-unordered-doublons
    format: true-false
    question: "Un `std::unordered_set` refuse les doublons, comme un `std::set`."
    truth: true
    answer: "Les deux gardent des valeurs uniques. Seuls l'ordre et le coût diffèrent."
  - key: qcm-dedoublonner
    format: multiple-choice
    question: "`v` est un `std::vector<int>`. Quelle ligne donne ses valeurs sans doublon, triées ?"
    choices:
      - {text: "`std::set<int> s{v.begin(), v.end()};`", correct: true}
      - {text: "`std::set<int> s = v;`", correct: false}
      - {text: "`std::set<int> s{v};`", correct: false}
      - {text: "`std::set<int> s{v.size()};`", correct: false}
    answer: "Un ensemble se construit à partir d'un intervalle d'itérateurs. Il n'y a pas de conversion directe d'un vecteur."
  - key: qcm-plus-grand
    format: multiple-choice
    question: "Comment lis-tu le plus grand élément d'un `std::set<int>` non vide ?"
    choices:
      - {text: "`*s.rbegin()`", correct: true}
      - {text: "`*s.end()`", correct: false}
      - {text: "`s.back()`", correct: false}
      - {text: "`s[s.size() - 1]`", correct: false}
    answer: "`rbegin()` désigne le dernier élément. `end()` désigne l'après-dernier : le déréférencer est une faute. Un ensemble n'a ni `back()` ni `operator[]`."
  - key: qcm-garder-doublons
    format: multiple-choice
    question: "Quel conteneur garde ses valeurs triées tout en acceptant les doublons ?"
    choices:
      - {text: "`std::multiset`", correct: true}
      - {text: "`std::set`", correct: false}
      - {text: "`std::unordered_set`", correct: false}
      - {text: "`std::map`", correct: false}
    answer: "`std::multiset` est un ensemble trié qui garde chaque exemplaire. `count` y renvoie le nombre d'occurrences."
  - key: qcm-presence
    format: multiple-choice
    question: "Quelle expression dit si `7` est dans l'ensemble `s` ?"
    choices:
      - {text: "`s.contains(7)`", correct: true}
      - {text: "`s[7]`", correct: false}
      - {text: "`s.at(7)`", correct: false}
      - {text: "`s.has(7)`", correct: false}
    answer: "`contains` (C++20). Avant, on écrivait `s.count(7) > 0` ou `s.find(7) != s.end()`."
  - key: trous-second
    format: fill-in
    question: |-
      Complète pour savoir si la valeur vient d'être ajoutée :
      ```cpp
      if (vus.insert(identifiant).___) {
          std::println("nouveau");
      }
      ```
    blanks:
      - [second]
    answer: "`insert` renvoie une paire ; son champ `second` vaut `true` si l'insertion a eu lieu."
  - key: trous-contains
    format: fill-in
    question: |-
      Complète pour tester la présence de la valeur (C++20) :
      ```cpp
      if (vus.___(identifiant)) {
          std::println("déjà vu");
      }
      ```
    blanks:
      - [contains]
    answer: "`contains` renvoie `true` si la valeur est dans l'ensemble."
  - key: trous-begin
    format: fill-in
    question: |-
      Complète pour lire le plus petit élément d'un `std::set<int>` non vide :
      ```cpp
      int plus_petit = *s.___();
      ```
    blanks:
      - [begin]
    answer: "Un `std::set` est trié : `begin()` désigne le plus petit élément."
  - key: trous-unordered-set
    format: fill-in
    question: |-
      Complète avec l'ensemble qui répond « présent ou non » en temps constant en moyenne :
      ```cpp
      std::___<int> vus;
      ```
    blanks:
      - [unordered_set]
    answer: "`std::unordered_set` est une table de hachage : O(1) en moyenne, sans ordre."
  - key: code-doublons
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::set<int> s{3, 1, 3, 2, 1};
          std::println("{} {} {}", s.size(), *s.begin(), *s.rbegin());
      }
      ```
    choices:
      - {text: "`3 1 3`", correct: true}
      - {text: "`5 3 1`", correct: false}
      - {text: "`3 3 1`", correct: false}
      - {text: "`5 1 3`", correct: false}
    answer: "`3 1 3` : les doublons sont ignorés, il reste 1, 2, 3. L'ensemble est trié : le premier est 1, le dernier 3."
    check:
      output: "3 1 3"
  - key: code-insert-second
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::set<int> s;
          const bool a = s.insert(4).second;
          const bool b = s.insert(4).second;
          std::println("{} {} {}", a, b, s.size());
      }
      ```
    choices:
      - {text: "`true false 1`", correct: true}
      - {text: "`true true 2`", correct: false}
      - {text: "`false true 1`", correct: false}
      - {text: "`true true 1`", correct: false}
    answer: "`true false 1` : la première insertion a lieu ; la seconde est ignorée, car 4 est déjà présent."
    check:
      output: "true false 1"
  - key: code-parcours-trie
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <set>
      #include <string>

      int main() {
          std::set<std::string> s{"poire", "kiwi", "abricot", "kiwi"};
          for (const auto& fruit : s) {
              std::print("{} ", fruit[0]);
          }
          std::println("{}", s.size());
      }
      ```
    choices:
      - {text: "`a k p 3`", correct: true}
      - {text: "`p k a 3`", correct: false}
      - {text: "`a k k p 4`", correct: false}
      - {text: "`p k a k 4`", correct: false}
    answer: "`a k p 3` : trois fruits différents, parcourus dans l'ordre alphabétique."
    check:
      output: "a k p 3"
  - key: code-erase
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <unordered_set>

      int main() {
          std::unordered_set<int> s{1, 2, 3};
          const auto retires = s.erase(2) + s.erase(9);
          std::println("{} {} {}", retires, s.size(), s.contains(2));
      }
      ```
    choices:
      - {text: "`1 2 false`", correct: true}
      - {text: "`2 1 false`", correct: false}
      - {text: "`1 3 true`", correct: false}
      - {text: "`2 2 false`", correct: false}
    answer: "`1 2 false` : `erase` renvoie le nombre d'éléments retirés. 2 était présent, 9 non."
    check:
      output: "1 2 false"
  - key: bug-crochets
    format: bug-fix
    question: |-
      Le compilateur refuse `s[0]`. Le programme devrait afficher le plus petit élément. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::set<int> s{5, 2, 8};
          std::println("{}", s[0]);
      }
      ```
    choices:
      - {text: "Écrire `*s.begin()`", correct: true}
      - {text: "Écrire `s.at(0)`", correct: false}
      - {text: "Écrire `s.front()`", correct: false}
      - {text: "Écrire `*s.end()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *s.begin());
      ```
      Un ensemble n'a pas d'accès par indice, ni `at`, ni `front`. Il est trié : son premier élément, `*s.begin()`,
      est le plus petit.
  - key: bug-modifier-en-place
    format: bug-fix
    question: |-
      Le compilateur refuse `*it = 10;`. Le programme devrait remplacer 2 par 10. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <set>

      int main() {
          std::set<int> s{1, 2, 3};
          auto it = s.find(2);
          *it = 10;
          std::println("{}", *s.rbegin());
      }
      ```
    choices:
      - {text: "Écrire `s.erase(it);` puis `s.insert(10);`", correct: true}
      - {text: "Écrire `s[2] = 10;` à la place de `*it = 10;`", correct: false}
      - {text: "Déclarer `it` avec `auto&` à la place de `auto`", correct: false}
      - {text: "Écrire `it->second = 10;` à la place de `*it = 10;`", correct: false}
    answer: |-
      ```cpp
      s.erase(it);
      s.insert(10);
      ```
      Les éléments d'un ensemble sont constants : les modifier en place fausserait l'ordre de l'arbre. On efface,
      puis on insère.
  - key: bug-ordre-unordered
    format: bug-fix
    question: |-
      Ce programme devrait afficher les numéros dans l'ordre croissant. L'ordre obtenu n'est pas garanti. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <unordered_set>

      int main() {
          std::unordered_set<int> numeros{42, 7, 19};
          for (int n : numeros) {
              std::println("{}", n);
          }
      }
      ```
    choices:
      - {text: "Déclarer `numeros` comme un `std::set<int>`", correct: true}
      - {text: "Insérer les numéros dans l'ordre croissant", correct: false}
      - {text: "Appeler `numeros.reserve(3);` avant la boucle", correct: false}
      - {text: "Parcourir avec `const int& n` à la place de `int n`", correct: false}
    answer: |-
      ```cpp
      std::set<int> numeros{42, 7, 19};
      ```
      Un `std::unordered_set` n'a pas d'ordre, quel que soit l'ordre d'insertion. `std::set` garde ses éléments
      triés.
  - key: bug-doublons-comptes
    format: bug-fix
    question: |-
      Ce programme devrait compter les visiteurs **différents** et afficher `2`. Il affiche `4`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> visiteurs;
          for (const char* nom : {"Ada", "Alan", "Ada", "Ada"}) {
              visiteurs.push_back(nom);
          }
          std::println("{}", visiteurs.size());
      }
      ```
    choices:
      - {text: "Ranger les noms dans un `std::set<std::string>`, avec `insert`", correct: true}
      - {text: "Appeler `visiteurs.shrink_to_fit();` avant l'affichage", correct: false}
      - {text: "Appeler `visiteurs.reserve(2);` avant la boucle", correct: false}
      - {text: "Afficher `visiteurs.capacity()` à la place de la taille", correct: false}
    answer: |-
      ```cpp
      std::set<std::string> visiteurs;
      // ...
      visiteurs.insert(nom);
      ```
      Un vecteur garde tout ce qu'on lui donne. Un ensemble ignore les valeurs déjà présentes : sa taille est le
      nombre de visiteurs différents.
