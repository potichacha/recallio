notion: bit-operations
lesson: |-
  Compter les bits à 1, trouver la puissance de deux suivante, relire les octets d'un flottant : ces opérations
  s'écrivaient avec des boucles, des astuces obscures ou des extensions du compilateur. Depuis C++20, l'en-tête
  **`<bit>`** les fournit, lisibles et traduites en une instruction du processeur quand elle existe.

  **Les fonctions sur les entiers non signés.**

  | Fonction | Résultat | Exemple |
  |---|---|---|
  | `std::popcount(x)` | le nombre de bits à 1 | `popcount(0b1011u)` vaut 3 |
  | `std::has_single_bit(x)` | `x` est-il une puissance de deux ? | `has_single_bit(8u)` est vrai |
  | `std::bit_width(x)` | le nombre de bits nécessaires pour écrire `x` | `bit_width(5u)` vaut 3 |
  | `std::bit_ceil(x)` | la plus petite puissance de deux supérieure ou égale à `x` | `bit_ceil(5u)` vaut 8 |
  | `std::bit_floor(x)` | la plus grande puissance de deux inférieure ou égale à `x` | `bit_floor(5u)` vaut 4 |
  | `std::countl_zero(x)`, `std::countr_zero(x)` | les zéros en tête, en queue | `countr_zero(8u)` vaut 3 |
  | `std::rotl(x, n)`, `std::rotr(x, n)` | rotation des bits vers la gauche, la droite | |

  Elles n'acceptent que des types **non signés** : avec un `int`, le code ne compile pas. Les bits d'un nombre
  négatif n'ont pas de sens évident pour ces opérations.

  **`std::bit_cast` : relire les mêmes bits sous un autre type.**

  ```cpp
  const float f = 1.0f;
  const auto bits = std::bit_cast<std::uint32_t>(f);     // 0x3f800000
  ```

  Les deux types doivent avoir la **même taille** et être **trivialement copiables**, sinon le code ne compile
  pas. C'est le remplaçant sûr des deux anciennes techniques :

  - `*reinterpret_cast<std::uint32_t*>(&f)` viole la règle d'**aliasing strict** : comportement indéfini ;
  - lire le mauvais membre d'une `union` : comportement indéfini en C++.

  `std::bit_cast` fait ce que faisait un `std::memcpy`, et fonctionne en plus dans une expression constante.

  **`std::endian` : l'ordre des octets.** Un entier de plusieurs octets se range dans un sens ou dans l'autre.

  - **Petit-boutiste** (*little-endian*) : l'octet de poids faible d'abord. C'est le cas de x86-64 et de la plupart
    des ARM.
  - **Gros-boutiste** (*big-endian*) : l'octet de poids fort d'abord. C'est l'ordre des protocoles réseau.

  ```cpp
  if (std::endian::native == std::endian::little) { ... }
  ```

  Le test se fait à la compilation. C++23 ajoute `std::byteswap`, qui inverse l'ordre des octets d'un entier.

  **Quand s'en servir.** Les masques de permissions, les tables de hachage (une taille en puissance de deux), la
  lecture de formats binaires et de trames réseau, les structures compactes à base de bits.

  **En entretien** : « `<bit>` remplace les astuces : `popcount`, `has_single_bit`, `bit_ceil`, sur des entiers non
  signés. `std::bit_cast` relit les bits d'un objet sous un autre type de même taille, sans le comportement
  indéfini d'un `reinterpret_cast`. Et `std::endian::native` dit le boutisme de la machine. »
cards:
  - key: popcount
    format: course
    question: "Que renvoie `std::popcount(x)` ?"
    choices:
      - {text: "Le nombre de bits à 1 dans `x`", correct: true}
      - {text: "Le nombre de bits à 0 dans `x`", correct: false}
      - {text: "Le nombre de bits du type de `x`", correct: false}
      - {text: "La position du bit de poids fort de `x`", correct: false}
    answer: "Sur `0b1011u`, il renvoie 3. Les processeurs courants ont une instruction dédiée, que le compilateur utilise."
  - key: bit-cast
    format: course
    question: "Que fait `std::bit_cast<std::uint32_t>(f)`, pour un `float f` ?"
    choices:
      - {text: "Il renvoie un entier qui a exactement les mêmes bits que `f`", correct: true}
      - {text: "Il convertit la valeur de `f` en entier, en supprimant les décimales", correct: false}
      - {text: "Il renvoie un pointeur vers les octets de `f`", correct: false}
      - {text: "Il arrondit `f` à l'entier non signé le plus proche", correct: false}
    answer: "Aucun calcul : les bits sont recopiés tels quels. `static_cast<std::uint32_t>(1.0f)` vaut 1 ; `std::bit_cast` donne `0x3f800000`."
  - key: pourquoi-bit-cast
    format: course
    question: "Pourquoi préférer `std::bit_cast` à `*reinterpret_cast<std::uint32_t*>(&f)` ?"
    choices:
      - {text: "Le `reinterpret_cast` viole la règle d'aliasing strict : son comportement est indéfini", correct: true}
      - {text: "Le `reinterpret_cast` est refusé par le compilateur pour un `float`", correct: false}
      - {text: "Le `reinterpret_cast` arrondit le flottant avant de lire ses bits", correct: false}
      - {text: "Le `reinterpret_cast` recopie les octets dans l'ordre inverse", correct: false}
    answer: "Lire un `float` à travers un pointeur vers un autre type est interdit par le standard, même si cela « marche » souvent. `std::bit_cast` est défini, et vérifie les tailles à la compilation."
  - key: endian
    format: course
    question: "Que dit `std::endian::native` ?"
    choices:
      - {text: "L'ordre dans lequel la machine range les octets d'un entier", correct: true}
      - {text: "Le nombre de bits d'un pointeur sur la machine", correct: false}
      - {text: "Le nombre de cœurs du processeur", correct: false}
      - {text: "L'encodage des caractères du système", correct: false}
    answer: "Il vaut `std::endian::little` sur x86-64 : l'octet de poids faible est rangé en premier. Les protocoles réseau utilisent l'ordre inverse."
  - key: vf-signes
    format: true-false
    question: "`std::popcount` accepte un argument de type `int`."
    truth: false
    answer: "Les fonctions de `<bit>` sur les entiers n'acceptent que des types non signés. Avec un `int`, le code ne compile pas."
  - key: vf-meme-taille
    format: true-false
    question: "`std::bit_cast` exige que les deux types aient la même taille."
    truth: true
    answer: "Sinon, le code ne compile pas. Les deux types doivent aussi être trivialement copiables."
  - key: vf-puissance
    format: true-false
    question: "`std::has_single_bit(x)` est vrai quand `x` est une puissance de deux."
    truth: true
    answer: "Une puissance de deux n'a qu'un bit à 1. Pour 0, la fonction renvoie `false`."
  - key: vf-x86
    format: true-false
    question: "Sur un processeur x86-64, `std::endian::native` vaut `std::endian::big`."
    truth: false
    answer: "x86-64 est petit-boutiste : `std::endian::little`."
  - key: qcm-puissance-suivante
    format: multiple-choice
    question: "Quelle fonction donne la plus petite puissance de deux supérieure ou égale à `n` ?"
    choices:
      - {text: "`std::bit_ceil`", correct: true}
      - {text: "`std::bit_floor`", correct: false}
      - {text: "`std::bit_width`", correct: false}
      - {text: "`std::popcount`", correct: false}
    answer: "`std::bit_ceil(5u)` vaut 8. `std::bit_floor(5u)` vaut 4, la puissance de deux inférieure."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::popcount` et `std::bit_cast` ?"
    choices:
      - {text: "`<bit>`", correct: true}
      - {text: "`<bitset>`", correct: false}
      - {text: "`<cstdint>`", correct: false}
      - {text: "`<bits>`", correct: false}
    answer: "`<bit>` date de C++20. `<bitset>` déclare `std::bitset`, un tableau de bits de taille fixe."
  - key: qcm-zeros
    format: multiple-choice
    question: "Que vaut `std::countr_zero(8u)` ?"
    choices:
      - {text: "3", correct: true}
      - {text: "4", correct: false}
      - {text: "28", correct: false}
      - {text: "1", correct: false}
    answer: "8 s'écrit `1000` en binaire : trois zéros à droite. `std::countl_zero(8u)` compterait les 28 zéros de gauche d'un entier de 32 bits."
  - key: qcm-octets
    format: multiple-choice
    question: "Quelle fonction de C++23 inverse l'ordre des octets d'un entier ?"
    choices:
      - {text: "`std::byteswap`", correct: true}
      - {text: "`std::rotl`", correct: false}
      - {text: "`std::bit_cast`", correct: false}
      - {text: "`std::bit_floor`", correct: false}
    answer: "`std::byteswap(0x1234)` sur 16 bits donne `0x3412`. On s'en sert pour passer du boutisme de la machine à celui d'un format."
  - key: trous-popcount
    format: fill-in
    question: |-
      Complète pour compter les bits à 1 :
      ```cpp
      const int actifs = std::___(masque);
      ```
    blanks:
      - [popcount]
    answer: "`std::popcount` renvoie le nombre de bits à 1."
  - key: trous-bit-cast
    format: fill-in
    question: |-
      Complète pour relire les bits du flottant comme un entier :
      ```cpp
      const auto bits = std::___<std::uint32_t>(1.0f);
      ```
    blanks:
      - [bit_cast]
    answer: "`std::bit_cast` recopie les bits vers un type de même taille."
  - key: trous-single-bit
    format: fill-in
    question: |-
      Complète pour tester que la taille est une puissance de deux :
      ```cpp
      if (std::___(taille)) {
          std::println("puissance de deux");
      }
      ```
    blanks:
      - [has_single_bit]
    answer: "Une puissance de deux a exactement un bit à 1."
  - key: trous-endian
    format: fill-in
    question: |-
      Complète pour tester l'ordre des octets de la machine :
      ```cpp
      if (std::___::native == std::endian::little) {
          std::println("petit-boutiste");
      }
      ```
    blanks:
      - [endian]
    answer: "`std::endian::native` vaut `little` ou `big` selon la machine."
  - key: code-popcount
    format: code-output
    question: |-
      ```cpp
      #include <bit>
      #include <print>

      int main() {
          std::println("{} {} {}", std::popcount(0b1011u), std::has_single_bit(8u), std::bit_width(5u));
      }
      ```
    choices:
      - {text: "`3 true 3`", correct: true}
      - {text: "`1 true 5`", correct: false}
      - {text: "`3 false 3`", correct: false}
      - {text: "`4 true 2`", correct: false}
    answer: "`3 true 3` : `1011` a trois bits à 1 ; 8 est une puissance de deux ; 5 s'écrit `101`, sur trois bits."
    check:
      output: "3 true 3"
  - key: code-ceil-floor
    format: code-output
    question: |-
      ```cpp
      #include <bit>
      #include <print>

      int main() {
          std::println("{} {} {} {}", std::bit_ceil(5u), std::bit_floor(5u), std::bit_ceil(8u), std::countr_zero(8u));
      }
      ```
    choices:
      - {text: "`8 4 8 3`", correct: true}
      - {text: "`8 4 16 3`", correct: false}
      - {text: "`6 4 8 3`", correct: false}
      - {text: "`8 4 8 4`", correct: false}
    answer: "`8 4 8 3` : 5 se trouve entre 4 et 8. 8 est déjà une puissance de deux : `bit_ceil` la laisse. Et 8, soit `1000`, a trois zéros à droite."
    check:
      output: "8 4 8 3"
  - key: code-bit-cast
    format: code-output
    question: |-
      ```cpp
      #include <bit>
      #include <cstdint>
      #include <print>

      int main() {
          const auto bits = std::bit_cast<std::uint32_t>(1.0f);
          const auto retour = std::bit_cast<float>(bits);
          std::println("{:x} {} {}", bits, static_cast<std::uint32_t>(1.0f), retour);
      }
      ```
    choices:
      - {text: "`3f800000 1 1`", correct: true}
      - {text: "`1 1 1`", correct: false}
      - {text: "`3f800000 3f800000 1`", correct: false}
      - {text: "`3f800000 1 0`", correct: false}
    answer: "`3f800000 1 1` : `std::bit_cast` relit les bits du flottant 1.0, tandis que `static_cast` convertit sa valeur. Le retour vers `float` redonne 1."
    check:
      output: "3f800000 1 1"
  - key: code-endian
    format: code-output
    question: |-
      Sur Linux x86-64 :
      ```cpp
      #include <bit>
      #include <cstdint>
      #include <print>

      int main() {
          const std::uint16_t valeur = 0x1234;
          std::println("{} {:x}", std::endian::native == std::endian::little, std::byteswap(valeur));
      }
      ```
    choices:
      - {text: "`true 3412`", correct: true}
      - {text: "`false 3412`", correct: false}
      - {text: "`true 4321`", correct: false}
      - {text: "`true 1234`", correct: false}
    answer: "`true 3412` : x86-64 est petit-boutiste. `std::byteswap` échange les deux octets, `12` et `34`, sans toucher aux chiffres à l'intérieur de chacun."
    check:
      output: "true 3412"
  - key: bug-popcount-signe
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel de `std::popcount`. Quelle correction est la bonne ?
      ```cpp
      #include <bit>
      #include <print>

      int main() {
          const int masque = 0b1011;
          std::println("{}", std::popcount(masque));
      }
      ```
    choices:
      - {text: "Déclarer `masque` avec le type `unsigned`", correct: true}
      - {text: "Déclarer `masque` avec le type `long`", correct: false}
      - {text: "Déclarer `masque` avec le type `double`", correct: false}
      - {text: "Déclarer `masque` avec le type `bool`", correct: false}
    answer: |-
      ```cpp
      const unsigned masque = 0b1011;
      ```
      Les fonctions de `<bit>` n'existent que pour les entiers non signés : les bits d'un nombre négatif dépendent
      de sa représentation. Un masque de bits est de toute façon non signé.
  - key: bug-bit-cast-taille
    format: bug-fix
    question: |-
      Le compilateur refuse ce `std::bit_cast` : les deux types n'ont pas la même taille. Quelle correction est la
      bonne ?
      ```cpp
      #include <bit>
      #include <cstdint>
      #include <print>

      int main() {
          const double valeur = 1.0;
          const auto bits = std::bit_cast<std::uint32_t>(valeur);
          std::println("{:x}", bits);
      }
      ```
    choices:
      - {text: "Viser `std::uint64_t`, de la même taille qu'un `double`", correct: true}
      - {text: "Viser `std::uint16_t`, plus petit qu'un `double`", correct: false}
      - {text: "Viser `int`, le type entier par défaut", correct: false}
      - {text: "Viser `float`, l'autre type à virgule", correct: false}
    answer: |-
      ```cpp
      const auto bits = std::bit_cast<std::uint64_t>(valeur);
      ```
      Un `double` occupe 8 octets, un `std::uint32_t` 4. `std::bit_cast` recopie tous les bits : il exige deux
      types de même taille, et le vérifie à la compilation.
  - key: bug-reinterpret-cast
    format: bug-fix
    question: |-
      Ce programme lit les bits d'un `float` à travers un pointeur vers un entier. Il viole la règle d'aliasing
      strict : son comportement est indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <cstdint>
      #include <print>

      int main() {
          const float valeur = 1.0f;
          const auto bits = *reinterpret_cast<const std::uint32_t*>(&valeur);
          std::println("{:x}", bits);
      }
      ```
    choices:
      - {text: "Écrire `std::bit_cast<std::uint32_t>(valeur)`", correct: true}
      - {text: "Écrire `static_cast<std::uint32_t>(valeur)`", correct: false}
      - {text: "Écrire `*static_cast<const std::uint32_t*>(&valeur)`", correct: false}
      - {text: "Écrire `const_cast<std::uint32_t>(valeur)`", correct: false}
    answer: |-
      ```cpp
      const auto bits = std::bit_cast<std::uint32_t>(valeur);
      ```
      Accéder à un `float` par un pointeur d'un autre type est interdit, même si le résultat semble juste.
      `std::bit_cast` recopie les bits de façon définie. `static_cast` convertirait la valeur : 1.
  - key: bug-puissance-de-deux
    format: bug-fix
    question: |-
      Ce programme devrait dire si 6 est une puissance de deux, et afficher `false`. Il affiche `true`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      bool puissance_de_deux(unsigned n) {
          return n % 2 == 0;
      }

      int main() {
          std::println("{}", puissance_de_deux(6));
      }
      ```
    choices:
      - {text: "Renvoyer `std::has_single_bit(n)`", correct: true}
      - {text: "Renvoyer `std::popcount(n) == 2`", correct: false}
      - {text: "Renvoyer `n % 4 == 0`", correct: false}
      - {text: "Renvoyer `std::bit_width(n) == 2`", correct: false}
    answer: |-
      ```cpp
      #include <bit>

      bool puissance_de_deux(unsigned n) {
          return std::has_single_bit(n);
      }
      ```
      Le test vérifiait seulement que le nombre est pair. Une puissance de deux a exactement un bit à 1 : c'est ce
      que teste `std::has_single_bit`.
