notion: unicode-encodages
lesson: |-
  `std::string` est une suite d'**octets** (`char`). Elle ne sait rien des **caractères** au sens où un lecteur
  l'entend. Tant que le texte est en ASCII, les deux coïncident ; dès qu'il contient un « é », ils se séparent.

  **Trois notions à distinguer.**

  | Notion | Ce que c'est | Exemple : « é » |
  |---|---|---|
  | **Point de code** | le numéro d'un caractère dans Unicode | U+00E9 |
  | **Unité de code** | la brique d'un encodage (un octet en UTF-8) | deux octets : `0xC3 0xA9` |
  | **Graphème** | ce que le lecteur voit comme un caractère | « é », qui peut aussi s'écrire `e` suivi d'un accent combinant |

  **UTF-8.** C'est l'encodage dominant : chaque point de code occupe de **1 à 4 octets**.

  | Points de code | Octets | Exemples |
  |---|---|---|
  | U+0000 à U+007F | 1 | l'ASCII, inchangé |
  | U+0080 à U+07FF | 2 | é, ç, les lettres grecques |
  | U+0800 à U+FFFF | 3 | €, la plupart des idéogrammes |
  | au-delà | 4 | les émojis |

  **Ce que `std::string` ne sait pas.**

  ```cpp
  std::string mot = "été";
  mot.size();      // 5, pas 3 : le nombre d'octets
  mot[0];          // le premier octet de « é », pas « é »
  mot.substr(0, 1) // un demi-caractère : une séquence UTF-8 invalide
  ```

  - `size()` et `length()` comptent les **octets**.
  - `operator[]`, `substr`, `erase` travaillent sur des octets : ils peuvent **couper un caractère en deux**.
  - `std::toupper` et `std::tolower` ne traitent qu'un octet : ils ignorent « é ».
  - `==` compare les octets : « é » précomposé et « e » suivi d'un accent combinant sont **différents**.
  - Le tri avec `<` suit l'ordre des octets, pas l'ordre alphabétique d'une langue.

  Ce qui marche sans surprise : stocker, copier, concaténer, comparer à l'identique, chercher une sous-chaîne
  valide. UTF-8 est conçu pour qu'un octet ASCII n'apparaisse jamais au milieu d'un autre caractère.

  **Les types de caractères.**

  | Type | Encodage visé | Littéral |
  |---|---|---|
  | `char` | celui de l'exécution, le plus souvent UTF-8 | `"été"` |
  | `char8_t` (C++20) | UTF-8, garanti | `u8"été"` |
  | `char16_t` | UTF-16 | `u"été"` |
  | `char32_t` | UTF-32 : un point de code par unité | `U"été"` |
  | `wchar_t` | dépend du système : 16 bits sous Windows, 32 sous Linux | `L"été"` |

  `char8_t` est un type **distinct** de `char` : un `u8"..."` donne un `const char8_t[]`, et une `std::u8string`
  ne se convertit pas implicitement en `std::string`. Beaucoup de code garde donc `std::string` avec la convention
  « tout est en UTF-8 ».

  **Pour aller plus loin que les octets.** Le standard n'offre ni découpage en graphèmes, ni normalisation, ni
  changement de casse Unicode, ni tri linguistique. On utilise une bibliothèque : **ICU**, ou Boost.Text.
  `std::format` sait toutefois calculer la **largeur d'affichage** d'un texte UTF-8 pour l'alignement.

  **En entretien** : « `std::string` est une suite d'octets : `size()` compte des octets, pas des caractères, et
  `substr` peut couper un caractère UTF-8. Pour stocker et transporter, UTF-8 dans une `std::string` convient ;
  pour découper, mettre en majuscules ou trier selon une langue, il faut ICU. »
cards:
  - key: octets
    format: course
    question: "Que compte `size()` sur une `std::string` qui contient du texte en UTF-8 ?"
    choices:
      - {text: "Les octets, pas les caractères que voit le lecteur", correct: true}
      - {text: "Les caractères que voit le lecteur, accents compris", correct: false}
      - {text: "Les points de code Unicode du texte", correct: false}
      - {text: "Les mots, séparés par des espaces", correct: false}
    answer: "Une `std::string` est une suite de `char`. En UTF-8, « été » occupe cinq octets : `size()` renvoie 5."
  - key: utf8
    format: course
    question: "Combien d'octets un point de code occupe-t-il en UTF-8 ?"
    choices:
      - {text: "De 1 à 4, selon le caractère", correct: true}
      - {text: "Toujours 1", correct: false}
      - {text: "Toujours 2", correct: false}
      - {text: "Toujours 4", correct: false}
    answer: "Un octet pour l'ASCII, deux pour les lettres accentuées latines, trois pour « € », quatre pour les émojis. C'est un encodage à longueur variable."
  - key: char8
    format: course
    question: "Qu'apporte le type `char8_t` de C++20 ?"
    choices:
      - {text: "Un type distinct de `char`, qui désigne explicitement des unités UTF-8", correct: true}
      - {text: "Un type de huit octets, qui contient n'importe quel point de code", correct: false}
      - {text: "Un type qui convertit automatiquement le texte dans l'encodage du système", correct: false}
      - {text: "Un type qui rend `size()` égal au nombre de caractères affichés", correct: false}
    answer: "Les littéraux `u8\"...\"` sont des tableaux de `char8_t`. Le type dit l'encodage, mais ne rend pas la chaîne plus savante : `std::u8string` compte aussi des octets."
  - key: limites
    format: course
    question: "Laquelle de ces opérations la bibliothèque standard ne sait-elle pas faire sur du texte Unicode ?"
    choices:
      - {text: "Mettre « é » en majuscule, ou trier selon l'ordre alphabétique d'une langue", correct: true}
      - {text: "Concaténer deux chaînes UTF-8 valides, pour en obtenir une troisième", correct: false}
      - {text: "Comparer deux chaînes octet par octet, avec l'opérateur `==`", correct: false}
      - {text: "Copier une chaîne UTF-8 dans une autre, sans en changer un octet", correct: false}
    answer: "Changement de casse, normalisation, découpage en graphèmes, tri linguistique : il faut une bibliothèque comme ICU. Stocker et transporter du UTF-8, en revanche, ne pose aucun problème."
  - key: vf-indice
    format: true-false
    question: "Dans une `std::string` en UTF-8, `texte[2]` donne toujours le troisième caractère du texte."
    truth: false
    answer: "Il donne le troisième octet, qui peut être le milieu d'un caractère de plusieurs octets."
  - key: vf-ascii
    format: true-false
    question: "Un texte en ASCII pur est déjà du UTF-8 valide."
    truth: true
    answer: "UTF-8 encode les 128 premiers points de code sur un octet, à l'identique de l'ASCII."
  - key: vf-conversion
    format: true-false
    question: "Une `std::u8string` se convertit implicitement en `std::string`."
    truth: false
    answer: "`char8_t` et `char` sont deux types distincts : il faut une conversion explicite, octet par octet."
  - key: vf-wchar
    format: true-false
    question: "`wchar_t` a la même taille sous Windows et sous Linux."
    truth: false
    answer: "16 bits sous Windows (UTF-16), 32 bits sous Linux (UTF-32). C'est pourquoi le code portable l'évite."
  - key: qcm-ete
    format: multiple-choice
    question: "Que vaut `std::string{\"été\"}.size()`, quand le fichier source est en UTF-8 ?"
    choices:
      - {text: "5", correct: true}
      - {text: "3", correct: false}
      - {text: "6", correct: false}
      - {text: "4", correct: false}
    answer: "Chaque « é » occupe deux octets, le « t » un seul : 2 + 1 + 2 = 5."
  - key: qcm-utf32
    format: multiple-choice
    question: "Quel type contient un point de code Unicode entier par élément ?"
    choices:
      - {text: "`char32_t`", correct: true}
      - {text: "`char`", correct: false}
      - {text: "`char8_t`", correct: false}
      - {text: "`char16_t`", correct: false}
    answer: "UTF-32 est à longueur fixe : une unité par point de code. En UTF-16, les caractères au-delà de U+FFFF prennent deux unités."
  - key: qcm-litteral
    format: multiple-choice
    question: "Quel préfixe donne un littéral de chaîne en UTF-8, de type `const char8_t[]` ?"
    choices:
      - {text: "`u8\"...\"`", correct: true}
      - {text: "`L\"...\"`", correct: false}
      - {text: "`U\"...\"`", correct: false}
      - {text: "`R\"...\"`", correct: false}
    answer: "`u8` pour UTF-8, `u` pour UTF-16, `U` pour UTF-32, `L` pour `wchar_t`. `R` introduit un littéral brut, sans séquences d'échappement."
  - key: qcm-bibliotheque
    format: multiple-choice
    question: "Quelle bibliothèque utilise-t-on pour découper un texte en graphèmes ou le trier selon une langue ?"
    choices:
      - {text: "ICU", correct: true}
      - {text: "`<cctype>`", correct: false}
      - {text: "`<string_view>`", correct: false}
      - {text: "`<cstring>`", correct: false}
    answer: "ICU (*International Components for Unicode*) fait référence. `<cctype>` ne traite qu'un octet à la fois, dans la locale C."
  - key: situation-troncature
    format: scenario
    question: |-
      Une fonction tronque les titres à 20 caractères avec `titre.substr(0, 20)`. Certains titres français
      s'affichent avec un symbole « � » à la fin. Pourquoi ?
    choices:
      - {text: "`substr` coupe au vingtième octet, parfois au milieu d'un caractère de plusieurs octets", correct: true}
      - {text: "`substr` ajoute un caractère de fin de chaîne après le vingtième caractère", correct: false}
      - {text: "`substr` convertit le texte en ASCII, et remplace les accents", correct: false}
      - {text: "`substr` compte les caractères à partir de 1, et non de 0", correct: false}
    answer: |-
      Vingt octets ne sont pas vingt caractères. Si la coupe tombe entre les deux octets d'un « é », la séquence
      n'est plus du UTF-8 valide. Il faut reculer jusqu'au début d'un caractère, ou mieux, couper sur un graphème
      avec une bibliothèque.
  - key: situation-longueur
    format: scenario
    question: |-
      Un formulaire refuse les prénoms de plus de 10 caractères en testant `prenom.size() > 10`. « Bénédicte » passe,
      mais « Frédérique », qui a dix lettres, est refusé. Que se passe-t-il ?
    choices:
      - {text: "`size()` compte les octets : les deux « é » de « Frédérique » en ajoutent deux", correct: true}
      - {text: "`size()` compte le caractère nul de fin de chaîne en plus des lettres", correct: false}
      - {text: "`size()` compte deux fois la majuscule initiale du prénom", correct: false}
      - {text: "`size()` renvoie la capacité de la chaîne, et non sa longueur", correct: false}
    answer: |-
      « Frédérique » fait dix lettres, mais douze octets en UTF-8. Une règle exprimée en caractères doit compter des
      points de code, ou des graphèmes, pas des octets.
  - key: situation-majuscules
    format: scenario
    question: |-
      Une fonction met un nom en majuscules en appliquant `std::toupper` à chaque `char`. « élodie » devient
      « éLODIE ». Pourquoi le « é » reste-t-il en minuscule ?
    choices:
      - {text: "`std::toupper` traite un octet à la fois : il ne reconnaît pas les deux octets de « é »", correct: true}
      - {text: "`std::toupper` ignore toujours le premier caractère d'une chaîne", correct: false}
      - {text: "`std::toupper` ne fonctionne que sur les chaînes de moins de cinq lettres", correct: false}
      - {text: "`std::toupper` exige que la chaîne soit déclarée `const`", correct: false}
    answer: |-
      Les fonctions de `<cctype>` ne connaissent que des caractères d'un octet. Le changement de casse Unicode
      dépend en plus de la langue : il relève d'une bibliothèque comme ICU.
  - key: situation-comparaison
    format: scenario
    question: |-
      Deux utilisateurs saisissent « café ». Les deux chaînes s'affichent à l'identique, mais `a == b` renvoie
      `false`. Quelle est l'explication la plus probable ?
    choices:
      - {text: "L'une écrit « é » en un point de code, l'autre en « e » suivi d'un accent combinant", correct: true}
      - {text: "L'opérateur `==` de `std::string` ne compare que le premier caractère", correct: false}
      - {text: "L'une des deux chaînes est rangée dans le tampon interne, l'autre sur le tas", correct: false}
      - {text: "L'opérateur `==` compare les adresses des deux chaînes", correct: false}
    answer: |-
      Unicode permet plusieurs suites de points de code pour un même graphème. `==` compare les octets : il faut
      d'abord **normaliser** les deux textes (forme NFC, par exemple), ce que fait une bibliothèque Unicode.
  - key: definition-point-de-code
    format: definition
    question: "Qu'est-ce qu'un point de code Unicode ?"
    choices:
      - {text: "Le numéro attribué à un caractère dans le répertoire Unicode", correct: true}
      - {text: "L'octet qui commence un caractère en UTF-8", correct: false}
      - {text: "La position d'un caractère dans une chaîne", correct: false}
      - {text: "La largeur d'un caractère à l'écran", correct: false}
    answer: "On le note U+ suivi de son numéro en hexadécimal : U+00E9 pour « é ». L'encodage décide ensuite comment l'écrire en octets."
  - key: definition-unite-de-code
    format: definition
    question: "Qu'est-ce qu'une unité de code ?"
    choices:
      - {text: "La brique élémentaire d'un encodage : un octet en UTF-8, 16 bits en UTF-16", correct: true}
      - {text: "Le numéro d'un caractère dans le répertoire Unicode", correct: false}
      - {text: "Un caractère tel que le lecteur le perçoit", correct: false}
      - {text: "Un mot séparé des autres par des espaces", correct: false}
    answer: "Un point de code s'écrit avec une ou plusieurs unités de code. C'est elles que comptent `size()` et que désigne `operator[]`."
  - key: definition-grapheme
    format: definition
    question: "Qu'est-ce qu'un graphème ?"
    choices:
      - {text: "Ce que le lecteur perçoit comme un seul caractère, fait d'un ou plusieurs points de code", correct: true}
      - {text: "Un octet d'une chaîne encodée en UTF-8, quel que soit le caractère dont il fait partie", correct: false}
      - {text: "Un caractère de l'alphabet latin sans accent, écrit sur un seul octet", correct: false}
      - {text: "Une police de caractères installée sur le système, qui sait dessiner le texte", correct: false}
    answer: "Un « é » écrit avec un accent combinant, ou un émoji de famille, sont un seul graphème pour plusieurs points de code."
  - key: definition-utf8
    format: definition
    question: "Qu'est-ce que UTF-8 ?"
    choices:
      - {text: "Un encodage d'Unicode à longueur variable, compatible avec l'ASCII", correct: true}
      - {text: "Un encodage d'Unicode où chaque caractère occupe huit octets", correct: false}
      - {text: "Un jeu de 256 caractères propre à l'Europe de l'Ouest", correct: false}
      - {text: "Un type de la bibliothèque standard qui contient du texte", correct: false}
    answer: "Chaque point de code y occupe de un à quatre octets. C'est l'encodage du Web, de Linux, et de la plupart des fichiers source."
