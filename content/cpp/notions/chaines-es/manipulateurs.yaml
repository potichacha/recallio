notion: manipulateurs
lesson: |-
  Avant `std::format`, la mise en forme d'une sortie passait par les **manipulateurs** : des objets que l'on
  insère dans un flux avec `<<`, et qui changent sa façon d'écrire. On les rencontre dans tout code plus ancien.
  Ceux qui prennent un argument sont dans `<iomanip>`, les autres dans `<ios>` (inclus par `<iostream>`).

  ```cpp
  #include <iomanip>
  #include <iostream>

  std::cout << std::fixed << std::setprecision(2) << 3.14159 << '\n';     // 3.14
  std::cout << std::setw(6) << 42 << '\n';                               // "    42"
  ```

  **Les principaux.**

  | Manipulateur | Effet | Durée |
  |---|---|---|
  | `std::setw(n)` | largeur minimale du **prochain** champ | une seule écriture |
  | `std::setfill(c)` | caractère de remplissage | permanent |
  | `std::left`, `std::right` | alignement dans la largeur | permanent |
  | `std::setprecision(n)` | précision des nombres à virgule | permanent |
  | `std::fixed`, `std::scientific` | notation à virgule fixe, ou scientifique | permanent |
  | `std::hex`, `std::oct`, `std::dec` | base des entiers | permanent |
  | `std::boolalpha` | `true` et `false` au lieu de `1` et `0` | permanent |
  | `std::showpos`, `std::showbase` | signe `+`, préfixe `0x` | permanent |

  **Le piège de la durée.** `std::setw` ne vaut que pour **l'écriture suivante**. Tous les autres **restent
  actifs** sur le flux jusqu'à ce qu'on les change : un `std::hex` oublié fait écrire en hexadécimal tous les
  entiers qui suivent, y compris dans une fonction appelée bien plus tard. Le flux porte un **état global**.

  **`setprecision`, avec ou sans `fixed`.**

  - Seul, il fixe le nombre de **chiffres significatifs** : `std::setprecision(3)` écrit `3.14` et `12.5`.
  - Après `std::fixed`, il fixe le nombre de chiffres **après la virgule** : `3.142` et `12.500`.

  **`std::endl` ou `'\n'` ?** `std::endl` écrit un saut de ligne **et vide le tampon** du flux, ce qui est lent
  quand on écrit beaucoup. `'\n'` suffit presque toujours.

  **Restaurer l'état.** Une fonction qui modifie l'état d'un flux devrait le remettre : on garde `flux.flags()` et
  `flux.precision()`, puis on les rétablit. Peu de code le fait.

  **L'équivalent moderne.** `std::format` range toute la mise en forme **dans le modèle**, pour un seul argument,
  sans rien laisser derrière :

  | Flux | `std::format` |
  |---|---|
  | `std::setw(6)` | `{:6}` |
  | `std::setfill('0') << std::setw(4)` | `{:04}` |
  | `std::fixed << std::setprecision(2)` | `{:.2f}` |
  | `std::hex` | `{:x}` |

  **En entretien** : « Les manipulateurs changent l'état du flux : `setw` pour la seule écriture suivante, tous les
  autres jusqu'à nouvel ordre, d'où des surprises comme un `hex` qui persiste. `setprecision` compte les chiffres
  significatifs, ou les décimales après `fixed`. En code neuf, je préfère `std::format`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un manipulateur de flux ?"
    choices:
      - {text: "Un objet inséré dans le flux avec `<<`, qui change sa façon d'écrire", correct: true}
      - {text: "Une fonction qui convertit un nombre en chaîne, sans flux", correct: false}
      - {text: "Une classe qui dérive de `std::ostream` pour écrire dans un fichier", correct: false}
      - {text: "Une macro qui remplace `std::cout` par un autre flux", correct: false}
    answer: "`std::cout << std::hex << 255` n'affiche pas le manipulateur : il modifie l'état du flux, qui écrit ensuite `ff`."
  - key: setw
    format: course
    question: "Combien de temps `std::setw(8)` reste-t-il actif ?"
    choices:
      - {text: "Pour la seule écriture suivante", correct: true}
      - {text: "Jusqu'à la fin de la ligne", correct: false}
      - {text: "Jusqu'à la fin de l'instruction", correct: false}
      - {text: "Jusqu'à ce qu'on le change", correct: false}
    answer: "C'est l'exception : la largeur retombe à zéro après chaque champ. Tous les autres manipulateurs sont permanents."
  - key: precision
    format: course
    question: "Que fixe `std::setprecision(2)`, quand il suit `std::fixed` ?"
    choices:
      - {text: "Le nombre de chiffres après la virgule", correct: true}
      - {text: "Le nombre total de chiffres significatifs", correct: false}
      - {text: "La largeur minimale du champ", correct: false}
      - {text: "Le nombre de chiffres avant la virgule", correct: false}
    answer: "Sans `std::fixed`, la précision compte les chiffres significatifs. Avec lui, elle compte les décimales : `3.14159` devient `3.14`."
  - key: etat
    format: course
    question: "Pourquoi un `std::hex` oublié dans une fonction peut-il fausser un affichage ailleurs ?"
    choices:
      - {text: "Il reste actif sur le flux : tous les entiers suivants s'écrivent en hexadécimal", correct: true}
      - {text: "Il convertit en hexadécimal les variables entières du programme", correct: false}
      - {text: "Il ferme le flux, qui n'écrit plus rien ensuite", correct: false}
      - {text: "Il remplace `std::cout` par un autre flux jusqu'à la fin du programme", correct: false}
    answer: "Le flux garde un état partagé par tout le programme. On le rétablit avec `std::dec`, ou l'on préfère `std::format`, qui ne laisse rien derrière."
  - key: vf-setw-permanent
    format: true-false
    question: "`std::setw(5)` s'applique à toutes les écritures suivantes du flux."
    truth: false
    answer: "Seulement à la prochaine. Il faut le répéter devant chaque champ."
  - key: vf-endl
    format: true-false
    question: "`std::endl` écrit un saut de ligne et vide le tampon du flux."
    truth: true
    answer: "C'est ce vidage qui le rend plus lent que `'\\n'`, dont il ne diffère par rien d'autre."
  - key: vf-boolalpha
    format: true-false
    question: "Sans `std::boolalpha`, `std::cout << true` affiche `true`."
    truth: false
    answer: "Il affiche `1`. `std::boolalpha` fait écrire `true` et `false`."
  - key: vf-iomanip
    format: true-false
    question: "`std::setw` et `std::setprecision` sont déclarés dans l'en-tête `<iomanip>`."
    truth: true
    answer: "Les manipulateurs à argument sont dans `<iomanip>`. `std::hex` ou `std::fixed`, sans argument, viennent avec `<iostream>`."
  - key: qcm-zeros
    format: multiple-choice
    question: "Quelle suite de manipulateurs affiche `7` sous la forme `007` ?"
    choices:
      - {text: "`std::setfill('0') << std::setw(3)`", correct: true}
      - {text: "`std::setw(3)` seul", correct: false}
      - {text: "`std::setprecision(3)`", correct: false}
      - {text: "`std::fixed << std::setw(3)`", correct: false}
    answer: "`setw` fixe la largeur, `setfill` le caractère qui la complète. Sans `setfill`, ce seraient des espaces."
  - key: qcm-format
    format: multiple-choice
    question: "Quel modèle de `std::format` équivaut à `std::fixed << std::setprecision(2)` ?"
    choices:
      - {text: "`{:.2f}`", correct: true}
      - {text: "`{:2}`", correct: false}
      - {text: "`{:02}`", correct: false}
      - {text: "`{:2x}`", correct: false}
    answer: "`.2` donne la précision, `f` la notation à virgule fixe. Et le réglage ne vaut que pour ce champ."
  - key: qcm-retablir
    format: multiple-choice
    question: "Quel manipulateur rétablit l'écriture des entiers en base 10 ?"
    choices:
      - {text: "`std::dec`", correct: true}
      - {text: "`std::fixed`", correct: false}
      - {text: "`std::right`", correct: false}
      - {text: "`std::noshowbase`", correct: false}
    answer: "`std::dec` annule `std::hex` ou `std::oct`. `std::noshowbase` ne retire que le préfixe `0x`."
  - key: qcm-gauche
    format: multiple-choice
    question: "Quel manipulateur aligne le texte à gauche dans la largeur fixée par `std::setw` ?"
    choices:
      - {text: "`std::left`", correct: true}
      - {text: "`std::setfill`", correct: false}
      - {text: "`std::fixed`", correct: false}
      - {text: "`std::showpos`", correct: false}
    answer: "Par défaut, le contenu est aligné à droite. `std::left` le colle à gauche, et reste actif."
  - key: trous-setw
    format: fill-in
    question: |-
      Complète pour écrire le nombre sur six caractères de large :
      ```cpp
      std::cout << std::___(6) << 42 << '\n';
      ```
    blanks:
      - [setw]
    answer: "`std::setw(6)` fixe la largeur du prochain champ."
  - key: trous-fixed
    format: fill-in
    question: |-
      Complète pour afficher deux chiffres après la virgule :
      ```cpp
      std::cout << std::___ << std::setprecision(2) << 12.5 << '\n';
      ```
    blanks:
      - [fixed]
    answer: "Après `std::fixed`, la précision compte les décimales : `12.50`."
  - key: trous-hex
    format: fill-in
    question: |-
      Complète pour écrire 255 sous la forme `ff` :
      ```cpp
      std::cout << std::___ << 255 << '\n';
      ```
    blanks:
      - [hex]
    answer: "`std::hex` fait écrire les entiers en base 16."
  - key: trous-iomanip
    format: fill-in
    question: |-
      Complète l'en-tête qui déclare `std::setw` :
      ```cpp
      #include <___>
      #include <iostream>
      ```
    blanks:
      - [iomanip]
    answer: "`<iomanip>` déclare les manipulateurs qui prennent un argument."
  - key: code-setw
    format: code-output
    question: |-
      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          std::cout << '[' << std::setw(5) << 42 << 7 << "]\n";
      }
      ```
    choices:
      - {text: "`[   427]`", correct: true}
      - {text: "`[   42    7]`", correct: false}
      - {text: "`[427]`", correct: false}
      - {text: "`[42   7]`", correct: false}
    answer: "`[   427]` : `setw(5)` ne s'applique qu'à 42, écrit sur cinq caractères. Le 7 suit sans largeur."
    check:
      output: "[   427]"
  - key: code-precision
    format: code-output
    question: |-
      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          std::cout << std::setprecision(3) << 3.14159 << ' ';
          std::cout << std::fixed << 3.14159 << ' ' << 12.5 << '\n';
      }
      ```
    choices:
      - {text: "`3.14 3.142 12.500`", correct: true}
      - {text: "`3.14 3.14 12.5`", correct: false}
      - {text: "`3.142 3.142 12.500`", correct: false}
      - {text: "`3.14 3.142 12.5`", correct: false}
    answer: "`3.14 3.142 12.500` : sans `fixed`, la précision 3 compte les chiffres significatifs. Après `fixed`, elle compte les décimales, et reste active."
    check:
      output: "3.14 3.142 12.500"
  - key: code-hex
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      int main() {
          std::cout << std::hex << 255 << ' ' << 16 << ' ' << std::dec << 16 << '\n';
      }
      ```
    choices:
      - {text: "`ff 10 16`", correct: true}
      - {text: "`ff 16 16`", correct: false}
      - {text: "`255 16 16`", correct: false}
      - {text: "`ff 10 10`", correct: false}
    answer: "`ff 10 16` : `std::hex` reste actif pour le second entier, 16, écrit `10`. `std::dec` rétablit la base 10."
    check:
      output: "ff 10 16"
  - key: code-setfill
    format: code-output
    question: |-
      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          std::cout << std::setfill('0') << std::setw(4) << 7 << ' ' << std::boolalpha << true << ' ' << false
                    << '\n';
      }
      ```
    choices:
      - {text: "`0007 true false`", correct: true}
      - {text: "`0007 1 0`", correct: false}
      - {text: "`   7 true false`", correct: false}
      - {text: "`7000 true false`", correct: false}
    answer: "`0007 true false` : le remplissage par des zéros complète la largeur 4. `std::boolalpha` reste actif pour les deux booléens."
    check:
      output: "0007 true false"
  - key: bug-setw-une-fois
    format: bug-fix
    question: |-
      Ce programme devrait aligner deux colonnes et afficher `   pomme     3`. Il affiche `   pomme3`. Quelle
      correction est la bonne ?
      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          std::cout << std::setw(8) << "pomme" << 3 << '\n';
      }
      ```
    choices:
      - {text: "Répéter la largeur devant le second champ : `<< std::setw(6) << 3`", correct: true}
      - {text: "Écrire `std::setw(14)` une seule fois, devant le premier champ", correct: false}
      - {text: "Ajouter `std::fixed` devant le premier champ", correct: false}
      - {text: "Remplacer `'\\n'` par `std::endl` à la fin de la ligne", correct: false}
    answer: |-
      ```cpp
      std::cout << std::setw(8) << "pomme" << std::setw(6) << 3 << '\n';
      ```
      `std::setw` ne vaut que pour l'écriture qui le suit. Chaque colonne a besoin de la sienne.
  - key: bug-hex-persistant
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ff`, puis `16`. Il affiche `ff`, puis `10`. Quelle correction est la bonne ?
      ```cpp
      #include <iostream>

      void afficher_couleur(int rouge) {
          std::cout << std::hex << rouge << '\n';
      }

      int main() {
          afficher_couleur(255);
          std::cout << 16 << '\n';
      }
      ```
    choices:
      - {text: "Rétablir la base 10 dans la fonction : `<< std::dec` après l'écriture", correct: true}
      - {text: "Déclarer le paramètre `rouge` avec le type `unsigned`", correct: false}
      - {text: "Écrire `std::endl` à la place de `'\\n'` dans la fonction", correct: false}
      - {text: "Appeler `std::cout.clear();` au début de `main`", correct: false}
    answer: |-
      ```cpp
      std::cout << std::hex << rouge << std::dec << '\n';
      ```
      `std::hex` modifie l'état de `std::cout`, qui reste en hexadécimal après le retour de la fonction. Elle doit
      rétablir la base. Avec `std::println("{:x}", rouge)`, il n'y aurait rien à rétablir.
  - key: bug-precision-sans-fixed
    format: bug-fix
    question: |-
      Ce programme devrait afficher `12.50`. Il affiche `12`. Quelle correction est la bonne ?
      ```cpp
      #include <iomanip>
      #include <iostream>

      int main() {
          std::cout << std::setprecision(2) << 12.5 << '\n';
      }
      ```
    choices:
      - {text: "Insérer `std::fixed` avant `std::setprecision(2)`", correct: true}
      - {text: "Écrire `std::setprecision(5)` sans rien d'autre", correct: false}
      - {text: "Insérer `std::setw(5)` avant `std::setprecision(2)`", correct: false}
      - {text: "Insérer `std::showpos` avant `std::setprecision(2)`", correct: false}
    answer: |-
      ```cpp
      std::cout << std::fixed << std::setprecision(2) << 12.5 << '\n';
      ```
      Sans `std::fixed`, la précision compte les chiffres significatifs : deux chiffres donnent `12`. En notation
      fixe, elle compte les décimales.
  - key: bug-include-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « 'setw' is not a member of 'std' ». Quelle correction est la bonne ?
      ```cpp
      #include <iostream>

      int main() {
          std::cout << std::setw(6) << 42 << '\n';
      }
      ```
    choices:
      - {text: "Inclure l'en-tête `<iomanip>`", correct: true}
      - {text: "Inclure l'en-tête `<ios>`", correct: false}
      - {text: "Écrire `std::cout.setw(6)`", correct: false}
      - {text: "Écrire `std::setwidth(6)`", correct: false}
    answer: |-
      ```cpp
      #include <iomanip>
      ```
      Les manipulateurs à argument (`setw`, `setfill`, `setprecision`) sont déclarés dans `<iomanip>`, que
      `<iostream>` n'inclut pas forcément.
