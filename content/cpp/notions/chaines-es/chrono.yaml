notion: chrono
lesson: |-
  `std::chrono` (en-tête `<chrono>`) représente le temps avec des **types** : une durée en secondes et une durée en
  millisecondes ne sont pas le même type, et le compilateur fait les conversions, ou les refuse. Fini les
  `int delai = 5;` dont on ignore l'unité.

  Trois notions : la **durée**, l'**instant**, l'**horloge**.

  **Les durées.**

  ```cpp
  using namespace std::chrono_literals;

  std::chrono::seconds attente{30};
  auto delai = 1h + 30min;            // 90 minutes : le résultat prend l'unité la plus fine
  auto pause = 250ms;
  ```

  Les types courants : `nanoseconds`, `microseconds`, `milliseconds`, `seconds`, `minutes`, `hours`, et `days`
  depuis C++20. `count()` donne le nombre d'unités, comme un simple nombre.

  **Les conversions.**

  - Vers une unité **plus fine**, sans perte : **implicite**. `std::chrono::milliseconds ms = 2s;` vaut 2000 ms.
  - Vers une unité **plus grossière**, avec perte possible : il faut le demander, avec **`duration_cast`**, qui
    **tronque**.

  ```cpp
  auto minutes = std::chrono::duration_cast<std::chrono::minutes>(150s);    // 2 min
  std::chrono::minutes m = 150s;                                            // ne compile pas
  ```

  Deux durées d'unités différentes se **comparent** et s'**additionnent** directement : `2s == 2000ms` est vrai.

  Pour une durée à virgule : `std::chrono::duration<double> secondes = 1500ms;` vaut 1,5.

  **Les horloges.**

  | Horloge | Ce qu'elle donne | Usage |
  |---|---|---|
  | `std::chrono::steady_clock` | un temps qui **ne recule jamais** | **mesurer** une durée, un délai d'attente |
  | `std::chrono::system_clock` | l'heure du système, que l'on peut régler | **dater** : l'heure qu'il est |
  | `std::chrono::high_resolution_clock` | un alias de l'une des deux | à éviter : on ne sait pas laquelle |

  **Les instants.** `now()` renvoie un instant (`time_point`). La différence de deux instants est une durée.

  ```cpp
  const auto debut = std::chrono::steady_clock::now();
  traiter();
  const auto duree = std::chrono::steady_clock::now() - debut;
  std::println("{} ms", std::chrono::duration_cast<std::chrono::milliseconds>(duree).count());
  ```

  On **mesure avec `steady_clock`** : `system_clock` peut sauter en avant ou en arrière quand l'heure du système
  est corrigée, et donner une durée négative.

  **Attendre.** `std::this_thread::sleep_for(100ms);` prend une durée ; `sleep_until` prend un instant.

  **Afficher.** `std::format` sait écrire une durée avec son unité : `std::format("{}", 90min)` donne `90min`.

  **En entretien** : « `std::chrono` met l'unité dans le type : les conversions sans perte sont implicites, les
  autres passent par `duration_cast`, qui tronque. Je mesure avec `steady_clock`, qui ne recule jamais, et je
  réserve `system_clock` à l'heure qu'il est. »
cards:
  - key: interet
    format: course
    question: "Quel est l'intérêt de `std::chrono::seconds` par rapport à un `int` pour un délai ?"
    choices:
      - {text: "L'unité fait partie du type : le compilateur convertit, ou refuse un mélange douteux", correct: true}
      - {text: "Le délai est mesuré plus précisément qu'avec un `int`, à la nanoseconde près", correct: false}
      - {text: "Le délai occupe moins de mémoire qu'un `int`, puisqu'il n'a pas de signe", correct: false}
      - {text: "Le délai est mis à jour automatiquement à mesure que le temps passe", correct: false}
    answer: "Un `int delai = 5` ne dit pas s'il s'agit de secondes ou de millisecondes. Avec `std::chrono`, passer des secondes là où l'on attend des millisecondes est converti correctement."
  - key: duration-cast
    format: course
    question: "Quand faut-il `std::chrono::duration_cast` pour convertir une durée ?"
    choices:
      - {text: "Vers une unité plus grossière, où la conversion peut perdre de la précision", correct: true}
      - {text: "Vers une unité plus fine, où la conversion multiplie le nombre d'unités", correct: false}
      - {text: "Pour toute conversion, quelle que soit l'unité de départ et d'arrivée", correct: false}
      - {text: "Seulement pour comparer deux durées d'unités différentes", correct: false}
    answer: "Des secondes vers des millisecondes : implicite, sans perte. Des secondes vers des minutes : il faut `duration_cast`, qui tronque."
  - key: steady-clock
    format: course
    question: "Pourquoi mesure-t-on une durée avec `std::chrono::steady_clock` plutôt qu'avec `system_clock` ?"
    choices:
      - {text: "Elle ne recule jamais, même quand l'heure du système est corrigée", correct: true}
      - {text: "Elle donne la date et l'heure qu'il est, contrairement à `system_clock`", correct: false}
      - {text: "Elle est la seule horloge dont `now()` renvoie un instant", correct: false}
      - {text: "Elle s'arrête quand le programme est en pause, ce qui exclut les attentes", correct: false}
    answer: "`system_clock` suit l'heure du système, qui peut être réglée pendant la mesure : la durée calculée peut être fausse, ou négative."
  - key: instant
    format: course
    question: "Qu'obtient-on en soustrayant deux instants (`time_point`) de la même horloge ?"
    choices:
      - {text: "Une durée", correct: true}
      - {text: "Un instant", correct: false}
      - {text: "Un entier, en secondes", correct: false}
      - {text: "Une erreur de compilation", correct: false}
    answer: "`fin - debut` est une durée, dans l'unité de l'horloge. On la convertit avec `duration_cast` pour l'afficher."
  - key: vf-comparaison
    format: true-false
    question: "`2s == 2000ms` est vrai, avec les littéraux de `std::chrono_literals`."
    truth: true
    answer: "Deux durées d'unités différentes se comparent : elles sont ramenées à l'unité commune."
  - key: vf-implicite-grossier
    format: true-false
    question: "`std::chrono::minutes m = 150s;` compile, et `m` vaut 2 minutes."
    truth: false
    answer: "La conversion perdrait trente secondes : elle n'est pas implicite. Il faut `std::chrono::duration_cast<std::chrono::minutes>(150s)`."
  - key: vf-cast-arrondi
    format: true-false
    question: "`duration_cast` arrondit au plus proche."
    truth: false
    answer: "Il tronque vers zéro : 150 secondes donnent 2 minutes, et 179 secondes aussi. `std::chrono::round` arrondit."
  - key: vf-system-clock
    format: true-false
    question: "`std::chrono::system_clock` peut reculer quand l'heure du système est corrigée."
    truth: true
    answer: "C'est l'horloge murale. Pour un intervalle, on prend `steady_clock`, qui est monotone."
  - key: qcm-count
    format: multiple-choice
    question: "Quelle fonction donne le nombre d'unités d'une durée, sous forme de simple nombre ?"
    choices:
      - {text: "`count()`", correct: true}
      - {text: "`value()`", correct: false}
      - {text: "`size()`", correct: false}
      - {text: "`ticks()`", correct: false}
    answer: "`std::chrono::seconds{90}.count()` vaut 90. On ne l'appelle qu'au dernier moment, pour afficher : avant, on garde le type."
  - key: qcm-litteraux
    format: multiple-choice
    question: "Quelle ligne rend disponibles les littéraux comme `250ms` ou `2h` ?"
    choices:
      - {text: "`using namespace std::chrono_literals;`", correct: true}
      - {text: "`using namespace std::time;`", correct: false}
      - {text: "`#include <literals>`", correct: false}
      - {text: "`using std::chrono::ms;`", correct: false}
    answer: "Les suffixes `h`, `min`, `s`, `ms`, `us`, `ns` sont déclarés dans `std::chrono_literals`."
  - key: qcm-attendre
    format: multiple-choice
    question: "Quelle ligne met le thread courant en pause pendant cent millisecondes ?"
    choices:
      - {text: "`std::this_thread::sleep_for(100ms);`", correct: true}
      - {text: "`std::this_thread::sleep_until(100ms);`", correct: false}
      - {text: "`std::chrono::sleep(100);`", correct: false}
      - {text: "`std::this_thread::wait(100ms);`", correct: false}
    answer: "`sleep_for` prend une durée. `sleep_until` prend un instant : une heure à laquelle se réveiller."
  - key: qcm-somme
    format: multiple-choice
    question: "Quel est le type de `1h + 30min` ?"
    choices:
      - {text: "`std::chrono::minutes`", correct: true}
      - {text: "`std::chrono::hours`", correct: false}
      - {text: "`std::chrono::seconds`", correct: false}
      - {text: "`int`", correct: false}
    answer: "Le résultat prend l'unité la plus fine des deux, pour ne rien perdre : 90 minutes."
  - key: trous-duration-cast
    format: fill-in
    question: |-
      Complète pour convertir la durée en millisecondes entières :
      ```cpp
      const auto ms = std::chrono::___<std::chrono::milliseconds>(duree);
      ```
    blanks:
      - [duration_cast]
    answer: "`duration_cast` convertit explicitement, en tronquant."
  - key: trous-steady-clock
    format: fill-in
    question: |-
      Complète avec l'horloge faite pour mesurer une durée :
      ```cpp
      const auto debut = std::chrono::___::now();
      ```
    blanks:
      - [steady_clock]
    answer: "`steady_clock` est monotone : elle ne recule jamais."
  - key: trous-count
    format: fill-in
    question: |-
      Complète pour afficher le nombre de secondes :
      ```cpp
      const std::chrono::seconds attente{30};
      std::println("{}", attente.___());
      ```
    blanks:
      - [count]
    answer: "`count()` renvoie le nombre d'unités."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      std::chrono::seconds attente{30};
      ```
    blanks:
      - [chrono]
    answer: "`<chrono>` déclare les durées, les instants et les horloges."
  - key: code-somme
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const auto total = 1h + 30min;
          std::println("{} {}", total.count(), std::chrono::duration_cast<std::chrono::hours>(total).count());
      }
      ```
    choices:
      - {text: "`90 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`90 2`", correct: false}
      - {text: "`31 1`", correct: false}
    answer: "`90 1` : la somme est en minutes, l'unité la plus fine. Convertie en heures, elle est tronquée : 1."
    check:
      output: "90 1"
  - key: code-implicite
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const std::chrono::milliseconds ms = 2s;
          std::println("{} {} {}", ms.count(), ms == 2s, ms > 1999ms);
      }
      ```
    choices:
      - {text: "`2000 true true`", correct: true}
      - {text: "`2 true true`", correct: false}
      - {text: "`2000 false true`", correct: false}
      - {text: "`2 false false`", correct: false}
    answer: "`2000 true true` : des secondes vers des millisecondes, la conversion est implicite et exacte. Les comparaisons tiennent compte des unités."
    check:
      output: "2000 true true"
  - key: code-perte
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const std::chrono::minutes m = 150s;
          std::println("{}", m.count());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "`150`", correct: false}
    answer: "Ça ne compile pas : 150 secondes ne font pas un nombre entier de minutes. La conversion perdrait de la précision, donc elle doit être demandée avec `duration_cast`."
    check:
      compiles: false
  - key: code-virgule
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const std::chrono::duration<double> secondes = 1500ms;
          const auto entieres = std::chrono::duration_cast<std::chrono::seconds>(1500ms);
          std::println("{} {}", secondes.count(), entieres.count());
      }
      ```
    choices:
      - {text: "`1.5 1`", correct: true}
      - {text: "`1.5 2`", correct: false}
      - {text: "`1500 1`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`1.5 1` : une durée en `double` garde la fraction, et la conversion vers elle est implicite. `duration_cast` vers des secondes entières tronque."
    check:
      output: "1.5 1"
  - key: bug-conversion-implicite
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation de `secondes` : la conversion depuis des millisecondes n'est pas
      implicite. Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const auto mesure = 2750ms;
          const std::chrono::seconds secondes = mesure;
          std::println("{}", secondes.count());
      }
      ```
    choices:
      - {text: "Écrire `std::chrono::duration_cast<std::chrono::seconds>(mesure)`", correct: true}
      - {text: "Écrire `static_cast<int>(mesure)`", correct: false}
      - {text: "Écrire `mesure / 1000`", correct: false}
      - {text: "Écrire `std::chrono::seconds{mesure.count()}`", correct: false}
    answer: |-
      ```cpp
      const auto secondes = std::chrono::duration_cast<std::chrono::seconds>(mesure);
      ```
      Vers une unité plus grossière, la perte doit être assumée : `duration_cast` tronque à 2 secondes.
      `seconds{mesure.count()}` compilerait, mais donnerait 2750 secondes.
  - key: bug-count-unites
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : deux secondes dépassent bien 1500 millisecondes. Il affiche `false`.
      Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const auto ecoule = 2s;
          const auto limite = 1500ms;
          std::println("{}", ecoule.count() > limite.count());
      }
      ```
    choices:
      - {text: "Comparer les durées elles-mêmes : `ecoule > limite`", correct: true}
      - {text: "Comparer `ecoule.count() >= limite.count()`", correct: false}
      - {text: "Comparer `ecoule.count() * 60 > limite.count()`", correct: false}
      - {text: "Déclarer `limite` avec la valeur `1500s`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", ecoule > limite);
      ```
      `count()` jette l'unité : il compare 2 à 1500. Tant qu'on garde les durées, la comparaison convertit
      correctement. On n'appelle `count()` que pour afficher.
  - key: bug-entier-nu
    format: bug-fix
    question: |-
      Le compilateur refuse `sleep_for(100)` : un entier nu n'est pas une durée. Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>
      #include <thread>

      int main() {
          std::this_thread::sleep_for(100);
          std::println("fin");
      }
      ```
    choices:
      - {text: "Écrire `sleep_for(std::chrono::milliseconds{100})`", correct: true}
      - {text: "Écrire `sleep_for(100.0)`", correct: false}
      - {text: "Écrire `sleep_for(\"100ms\")`", correct: false}
      - {text: "Écrire `sleep_for(static_cast<long>(100))`", correct: false}
    answer: |-
      ```cpp
      std::this_thread::sleep_for(std::chrono::milliseconds{100});
      ```
      C'est le but de `std::chrono` : 100 quoi ? Il faut une durée, avec son unité. Avec les littéraux : `100ms`.
  - key: bug-troncature
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1.5`, la durée en secondes. Il affiche `1`. Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono_literals;
          const auto mesure = 1500ms;
          const auto secondes = std::chrono::duration_cast<std::chrono::seconds>(mesure);
          std::println("{}", secondes.count());
      }
      ```
    choices:
      - {text: "Déclarer `const std::chrono::duration<double> secondes = mesure;`", correct: true}
      - {text: "Déclarer `const std::chrono::minutes secondes = mesure;`", correct: false}
      - {text: "Afficher `secondes.count() + 0.5`", correct: false}
      - {text: "Afficher `static_cast<double>(secondes.count())`", correct: false}
    answer: |-
      ```cpp
      const std::chrono::duration<double> secondes = mesure;
      ```
      `std::chrono::seconds` compte en entiers : `duration_cast` a tronqué. Une durée dont le compte est un `double`
      garde la fraction, et la conversion vers elle est implicite.
