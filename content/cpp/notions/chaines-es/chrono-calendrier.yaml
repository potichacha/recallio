notion: chrono-calendrier
lesson: |-
  Jusqu'à C++20, `<chrono>` savait mesurer des durées, mais pas dire « le 17 mai 2024 ». C++20 lui ajoute un
  **calendrier** (grégorien) et les **fuseaux horaires**.

  **Les types du calendrier.**

  | Type | Représente |
  |---|---|
  | `std::chrono::year`, `month`, `day` | une année, un mois, un jour |
  | `std::chrono::weekday` | un jour de la semaine |
  | `std::chrono::year_month_day` | une date : trois champs |
  | `std::chrono::sys_days` | une date comme un **nombre de jours** depuis le 1er janvier 1970 |

  **Écrire une date.** L'opérateur `/` assemble les champs, et les suffixes `y` et `d` fabriquent une année et un
  jour :

  ```cpp
  using namespace std::chrono;

  const year_month_day date = 2024y / 5 / 17;        // année / mois / jour
  const auto autre = 17d / May / 2024;               // jour / mois / année
  const auto fin = 2024y / February / last;          // le dernier jour de février 2024
  ```

  Le premier élément doit être typé (`2024y`, `17d`, `May`) : `2024 / 5 / 17` ne serait qu'une division d'entiers.

  **Deux représentations, deux usages.**

  - `year_month_day` est fait pour **lire** les champs : `date.year()`, `date.month()`, `date.day()`.
  - `sys_days` est fait pour **calculer** : ajouter des jours, soustraire deux dates, trouver le jour de la
    semaine.

  ```cpp
  const sys_days jour = sys_days{date} + days{20};           // vingt jours plus tard
  const year_month_day resultat{jour};                       // de nouveau en champs
  const auto ecart = sys_days{2024y / 12 / 25} - sys_days{date};   // un nombre de jours
  const weekday semaine{sys_days{date}};                     // vendredi
  ```

  On ne peut **pas** ajouter des jours à une `year_month_day` : il faut passer par `sys_days`.

  **Une date peut être invalide.** `year_month_day` ne vérifie rien à la construction : `2023y / 2 / 29` existe
  comme objet. `ok()` dit si la date est réelle.

  **Ajouter des mois.** `date + months{1}` change le champ du mois, sans toucher au jour : le 31 janvier plus un
  mois donne le « 31 février », pour lequel `ok()` est faux. On vise alors `last`, ou l'on décide soi-même de la
  règle.

  **Afficher.** `std::format` connaît les dates : `std::format("{:%d/%m/%Y}", date)` donne `17/05/2024`.

  **Les fuseaux horaires.** `std::chrono::zoned_time` associe un instant à un fuseau, et applique ses règles (heure
  d'été comprise). Il s'appuie sur la base de données des fuseaux du système :

  ```cpp
  const zoned_time paris{"Europe/Paris", system_clock::now()};
  ```

  Le principe à retenir : on **stocke et on calcule en UTC** (`system_clock`), et l'on ne convertit en heure locale
  que pour **afficher**.

  **En entretien** : « Depuis C++20, `year_month_day` représente une date par ses champs, et `sys_days` par un
  nombre de jours : je convertis vers `sys_days` pour l'arithmétique. Une date n'est pas validée à la construction,
  je teste `ok()`. Pour les fuseaux, `zoned_time` ; et je garde tout en UTC jusqu'à l'affichage. »
cards:
  - key: deux-representations
    format: course
    question: "Quelle différence entre `year_month_day` et `sys_days` ?"
    choices:
      - {text: "`year_month_day` garde trois champs à lire ; `sys_days` est un nombre de jours, fait pour calculer", correct: true}
      - {text: "`year_month_day` est un nombre de jours ; `sys_days` garde trois champs à lire", correct: false}
      - {text: "`year_month_day` est en heure locale ; `sys_days` est toujours en UTC+1", correct: false}
      - {text: "`year_month_day` date de C++11 ; `sys_days` est son remplaçant en C++20", correct: false}
    answer: "Les deux datent de C++20, et se convertissent l'un vers l'autre. On calcule sur `sys_days`, on lit les champs sur `year_month_day`."
  - key: validite
    format: course
    question: "Que se passe-t-il quand on construit `2023y / 2 / 29`, une date qui n'existe pas ?"
    choices:
      - {text: "L'objet est construit ; c'est `ok()` qui renvoie `false`", correct: true}
      - {text: "Le compilateur refuse la date, avec une erreur", correct: false}
      - {text: "Une exception `std::out_of_range` est lancée", correct: false}
      - {text: "La date est corrigée en 1er mars 2023", correct: false}
    answer: "`year_month_day` n'est qu'un triplet de champs, sans vérification. À toi d'appeler `ok()` quand la date vient de l'extérieur."
  - key: mois
    format: course
    question: "Que donne `2024y / 1 / 31 + months{1}` ?"
    choices:
      - {text: "Le « 31 février 2024 », une date pour laquelle `ok()` est faux", correct: true}
      - {text: "Le 29 février 2024, dernier jour du mois", correct: false}
      - {text: "Le 2 mars 2024, trente et un jours plus tard", correct: false}
      - {text: "Une erreur de compilation : on n'ajoute pas de mois à une date", correct: false}
    answer: "Ajouter des mois ne change que le champ du mois. La bibliothèque ne choisit pas à ta place entre « fin de mois » et « débordement »."
  - key: fuseaux
    format: course
    question: "Quelle règle suit-on pour manipuler des instants dans plusieurs fuseaux horaires ?"
    choices:
      - {text: "Stocker et calculer en UTC, et ne convertir en heure locale que pour afficher", correct: true}
      - {text: "Stocker et calculer dans le fuseau du serveur, pour éviter les conversions", correct: false}
      - {text: "Stocker l'heure locale de chaque utilisateur, sans indication de fuseau", correct: false}
      - {text: "Stocker le décalage horaire en heures, et l'ajouter à chaque lecture", correct: false}
    answer: "L'heure locale change avec l'heure d'été et les décisions politiques. UTC est continu ; `zoned_time` applique les règles du fuseau au moment d'afficher."
  - key: vf-jours
    format: true-false
    question: "On peut ajouter `days{10}` directement à une `year_month_day`."
    truth: false
    answer: "Seuls les mois et les années s'ajoutent aux champs. Pour des jours, on convertit en `sys_days`."
  - key: vf-division
    format: true-false
    question: "`2024 / 5 / 17`, sans suffixe, construit une date."
    truth: false
    answer: "Ce sont trois `int` : une division entière, qui vaut 23. Il faut au moins un élément typé : `2024y / 5 / 17`."
  - key: vf-last
    format: true-false
    question: "`2024y / February / last` désigne le dernier jour de février 2024."
    truth: true
    answer: "Converti en `sys_days` ou en `year_month_day`, il donne le 29 février, 2024 étant bissextile."
  - key: vf-format
    format: true-false
    question: "`std::format` sait afficher une `year_month_day` avec un modèle comme `{:%d/%m/%Y}`."
    truth: true
    answer: "Les types de `<chrono>` ont leur formateur, avec les spécificateurs `%Y`, `%m`, `%d`, `%H`, `%M`..."
  - key: qcm-ecart
    format: multiple-choice
    question: "Comment calcules-tu le nombre de jours entre deux `year_month_day` `a` et `b` ?"
    choices:
      - {text: "`(sys_days{b} - sys_days{a}).count()`", correct: true}
      - {text: "`(b - a).count()`", correct: false}
      - {text: "`b.day() - a.day()`", correct: false}
      - {text: "`std::distance(a, b)`", correct: false}
    answer: "La différence de deux `sys_days` est une durée en jours. Les champs, eux, ne se soustraient pas : les mois n'ont pas tous la même longueur."
  - key: qcm-jour-semaine
    format: multiple-choice
    question: "Comment obtiens-tu le jour de la semaine d'une `year_month_day date` ?"
    choices:
      - {text: "`weekday{sys_days{date}}`", correct: true}
      - {text: "`date.weekday()`", correct: false}
      - {text: "`date.day() % 7`", correct: false}
      - {text: "`weekday{date.day()}`", correct: false}
    answer: "Un `weekday` se construit à partir d'un `sys_days`. Le numéro du jour dans le mois ne dit rien du jour de la semaine."
  - key: qcm-suffixe
    format: multiple-choice
    question: "Quel suffixe littéral fabrique un `std::chrono::year` ?"
    choices:
      - {text: "`y`, comme dans `2024y`", correct: true}
      - {text: "`a`, comme dans `2024a`", correct: false}
      - {text: "`yr`, comme dans `2024yr`", correct: false}
      - {text: "`Y`, comme dans `2024Y`", correct: false}
    answer: "`y` pour une année, `d` pour un jour. Ils sont dans `std::chrono` : on écrit `using namespace std::chrono;` ou `std::chrono_literals`."
  - key: qcm-fuseau
    format: multiple-choice
    question: "Quel type associe un instant à un fuseau horaire, heure d'été comprise ?"
    choices:
      - {text: "`std::chrono::zoned_time`", correct: true}
      - {text: "`std::chrono::sys_days`", correct: false}
      - {text: "`std::chrono::steady_clock`", correct: false}
      - {text: "`std::chrono::duration`", correct: false}
    answer: "`zoned_time{\"Europe/Paris\", instant}` applique les règles du fuseau, lues dans la base de données du système."
  - key: trous-sys-days
    format: fill-in
    question: |-
      Complète pour ajouter dix jours à la date :
      ```cpp
      const auto plus_tard = std::chrono::___{date} + std::chrono::days{10};
      ```
    blanks:
      - [sys_days]
    answer: "L'arithmétique sur les jours se fait sur `sys_days`."
  - key: trous-ok
    format: fill-in
    question: |-
      Complète pour vérifier que la date existe :
      ```cpp
      if (!date.___()) {
          std::println("date invalide");
      }
      ```
    blanks:
      - [ok]
    answer: "`ok()` renvoie `true` si la date est une vraie date du calendrier."
  - key: trous-last
    format: fill-in
    question: |-
      Complète pour désigner le dernier jour de février 2024 :
      ```cpp
      using namespace std::chrono;
      const year_month_day fin{2024y / February / ___};
      ```
    blanks:
      - [last]
    answer: "`last` désigne le dernier jour du mois, quelle que soit sa longueur."
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type d'une date à trois champs :
      ```cpp
      using namespace std::chrono;
      const ___ date = 2024y / 5 / 17;
      ```
    blanks:
      - [year_month_day, auto]
    answer: "`year_month_day` garde l'année, le mois et le jour."
  - key: code-champs
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day date = 2024y / 5 / 17;
          std::println("{} {} {}", static_cast<int>(date.year()), static_cast<unsigned>(date.month()),
                       static_cast<unsigned>(date.day()));
      }
      ```
    choices:
      - {text: "`2024 5 17`", correct: true}
      - {text: "`17 5 2024`", correct: false}
      - {text: "`23 0 0`", correct: false}
      - {text: "`2024 17 5`", correct: false}
    answer: "`2024 5 17` : avec une année en tête, l'ordre est année, mois, jour. Chaque champ se convertit en entier."
    check:
      output: "2024 5 17"
  - key: code-ok
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day a = 2023y / 2 / 29;
          const year_month_day b = 2024y / 2 / 29;
          const year_month_day c = 2024y / 1 / 31 + months{1};
          std::println("{} {} {}", a.ok(), b.ok(), c.ok());
      }
      ```
    choices:
      - {text: "`false true false`", correct: true}
      - {text: "`false true true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`false true false` : 2023 n'est pas bissextile, 2024 l'est. Le 31 janvier plus un mois donne un « 31 février », qui n'existe pas."
    check:
      output: "false true false"
  - key: code-arithmetique
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const sys_days depart = 2024y / 2 / 28;
          const year_month_day arrivee{depart + days{2}};
          const auto ecart = sys_days{2024y / 12 / 25} - sys_days{2024y / 12 / 1};
          std::println("{} {} {}", static_cast<unsigned>(arrivee.month()), static_cast<unsigned>(arrivee.day()),
                       ecart.count());
      }
      ```
    choices:
      - {text: "`3 1 24`", correct: true}
      - {text: "`2 30 24`", correct: false}
      - {text: "`3 2 24`", correct: false}
      - {text: "`3 1 25`", correct: false}
    answer: "`3 1 24` : 2024 est bissextile, donc le 28 février plus deux jours donne le 1er mars. Du 1er au 25 décembre, il y a 24 jours."
    check:
      output: "3 1 24"
  - key: code-semaine
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const weekday jour{sys_days{2024y / 1 / 1}};
          const year_month_day fin{sys_days{2024y / February / last}};
          std::println("{} {}", jour == Monday, static_cast<unsigned>(fin.day()));
      }
      ```
    choices:
      - {text: "`true 29`", correct: true}
      - {text: "`true 28`", correct: false}
      - {text: "`false 29`", correct: false}
      - {text: "`false 28`", correct: false}
    answer: "`true 29` : le 1er janvier 2024 était un lundi. `last` donne le dernier jour de février, le 29 en année bissextile."
    check:
      output: "true 29"
  - key: bug-mois-suivant
    format: bug-fix
    question: |-
      Ce programme calcule l'échéance un mois après le 31 janvier, et devrait obtenir une date valide. Il affiche
      `false`. Quelle correction donne le dernier jour du mois suivant ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day depart = 2024y / 1 / 31;
          const year_month_day echeance = depart + months{1};
          std::println("{}", echeance.ok());
      }
      ```
    choices:
      - {text: "Construire `(depart.year() / depart.month() + months{1}) / last`", correct: true}
      - {text: "Construire `depart + months{1} + months{0}`", correct: false}
      - {text: "Construire `depart + years{0} + months{1}`", correct: false}
      - {text: "Construire `year_month_day{depart + months{1}}`", correct: false}
    answer: |-
      ```cpp
      const year_month_day echeance = (depart.year() / depart.month() + months{1}) / last;
      ```
      Ajouter un mois au 31 janvier donne le « 31 février ». En partant de l'année et du mois, puis en visant
      `last`, on obtient le 29 février 2024.
  - key: bug-jours-sur-ymd
    format: bug-fix
    question: |-
      Le compilateur refuse l'addition : il n'existe pas d'opérateur `+` entre une `year_month_day` et des `days`.
      Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day date = 2024y / 5 / 17;
          const year_month_day plus_tard{date + days{20}};
          std::println("{}", static_cast<unsigned>(plus_tard.month()));
      }
      ```
    choices:
      - {text: "Écrire `sys_days{date} + days{20}`", correct: true}
      - {text: "Écrire `date + months{20}`", correct: false}
      - {text: "Écrire `date.day() + days{20}`", correct: false}
      - {text: "Écrire `date + 20`", correct: false}
    answer: |-
      ```cpp
      const year_month_day plus_tard{sys_days{date} + days{20}};
      ```
      Une date en champs ne sait pas compter les jours. On la convertit en `sys_days`, on ajoute, puis on revient
      aux champs.
  - key: bug-sans-suffixe
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser la date : `2024 / 5 / 17` est un entier, pas une date. Quelle correction
      est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day date = 2024 / 5 / 17;
          std::println("{}", date.ok());
      }
      ```
    choices:
      - {text: "Écrire `2024y / 5 / 17`", correct: true}
      - {text: "Écrire `2024.0 / 5 / 17`", correct: false}
      - {text: "Écrire `(2024 / 5) / 17`", correct: false}
      - {text: "Écrire `2024 / 5y / 17`", correct: false}
    answer: |-
      ```cpp
      const year_month_day date = 2024y / 5 / 17;
      ```
      Sans suffixe, ce sont trois `int` : une division entière. Le suffixe `y` fait du premier une année, et
      l'opérateur `/` assemble alors une date.
  - key: bug-soustraction
    format: bug-fix
    question: |-
      Le compilateur refuse la soustraction de deux `year_month_day`. Le programme devrait afficher le nombre de
      jours entre les deux dates. Quelle correction est la bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::chrono;
          const year_month_day debut = 2024y / 3 / 1;
          const year_month_day fin = 2024y / 3 / 31;
          std::println("{}", (fin - debut).count());
      }
      ```
    choices:
      - {text: "Écrire `(sys_days{fin} - sys_days{debut}).count()`", correct: true}
      - {text: "Écrire `(fin.day() - debut.day()).count()` pour toutes les dates", correct: false}
      - {text: "Écrire `(fin + debut).count()`", correct: false}
      - {text: "Écrire `fin.count() - debut.count()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", (sys_days{fin} - sys_days{debut}).count());
      ```
      Un écart en jours se calcule sur des `sys_days`, qui sont des nombres de jours. Soustraire les champs `day()`
      ne marcherait que dans un même mois.
