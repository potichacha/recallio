notion: string-operations
lesson: |-
  `std::string` fournit de quoi chercher, découper et modifier un texte, sans gérer soi-même la mémoire.

  **Chercher : `find`.** Elle renvoie la **position** de la première occurrence, ou la constante
  **`std::string::npos`** si le texte cherché est absent.

  ```cpp
  std::string s = "bonjour le monde";
  auto p = s.find("le");               // 8
  if (s.find("soir") == std::string::npos) {
      // absent
  }
  ```

  `npos` est le plus grand `std::size_t` : on **compare** toujours le résultat à `npos`, jamais à `-1` ni à `0`.
  `rfind` cherche depuis la fin ; `find(texte, depart)` commence à une position donnée.

  **Tester (C++20, C++23).**

  ```cpp
  s.starts_with("bon");     // true
  s.ends_with("monde");     // true
  s.contains("le");         // true, C++23
  ```

  **Extraire : `substr(position, longueur)`.** Elle renvoie une **nouvelle** chaîne.

  ```cpp
  s.substr(0, 7);    // "bonjour"
  s.substr(11);      // "monde" : jusqu'à la fin
  ```

  Une longueur trop grande est **tronquée** à la fin de la chaîne. Une position **supérieure à la taille** lance
  `std::out_of_range`.

  **Modifier, en place.**

  | Fonction | Effet |
  |---|---|
  | `s += "!"`, `s.append("!")`, `s.push_back('!')` | ajoute à la fin |
  | `s.insert(position, texte)` | insère avant la position |
  | `s.erase(position, longueur)` | retire des caractères |
  | `s.replace(position, longueur, texte)` | remplace une tranche par un texte |
  | `s.clear()` | vide la chaîne |

  `replace` remplace **une tranche**, désignée par sa position et sa longueur : pas « toutes les occurrences d'un
  mot ». Pour remplacer un mot, on le cherche d'abord :

  ```cpp
  if (auto p = s.find("monde"); p != std::string::npos) {
      s.replace(p, 5, "tous");         // "bonjour le tous"
  }
  ```

  **Comparer.** `==`, `!=`, `<` comparent le **contenu**, caractère par caractère, dans l'ordre des codes : les
  majuscules passent avant les minuscules.

  **Lire sans copier.** `substr` alloue une nouvelle chaîne. Pour seulement **regarder** une partie d'un texte,
  `std::string_view` et son `substr` ne copient rien.

  **Les octets, pas les lettres.** `size()` compte des **octets**. En UTF-8, `"é"` en occupe deux :
  `std::string{"été"}.size()` vaut 5.

  **En entretien** : « `find` renvoie une position, ou `std::string::npos` si rien n'est trouvé : je compare
  toujours à `npos`. `substr` copie ; pour lire sans copier, `std::string_view`. Et `starts_with`, `ends_with`,
  `contains` remplacent les `find` écrits à la main. »
tour:
  - title: Chercher et découper
    text: |-
      Une `std::string` sait chercher dans son texte, et en extraire une partie.

      - `find` renvoie la **position** de ce qu'on cherche, ou `std::string::npos` si c'est absent ;
      - `substr(position, longueur)` renvoie une nouvelle chaîne, découpée dans la première ;
      - `starts_with` et `ends_with` testent le début et la fin.

      Ici, on sépare une adresse en deux, autour de l'arobase.

      Essaie : remplace l'adresse par `"ada"`, sans arobase, puis exécute. `find` renvoie `npos`, et le programme le
      dit.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const std::string adresse = "ada@exemple.fr";
              const auto arobase = adresse.find('@');
              if (arobase == std::string::npos) {
                  std::println("adresse invalide");
                  return 0;
              }
              std::println("{}", adresse.substr(0, arobase));
              std::println("{}", adresse.substr(arobase + 1));
              std::println("{}", adresse.ends_with(".fr"));
          }
      output: |-
        ada
        exemple.fr
        true
    task:
      instructions: |-
        Le programme affiche le nom d'un fichier. Affiche à la place son **extension** : ce qui suit le dernier
        point. Sers-toi de `rfind('.')`, puis de `substr`.
      starter:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const std::string fichier = "rapport.final.pdf";
              std::println("{}", fichier);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              const std::string fichier = "rapport.final.pdf";
              const auto point = fichier.rfind('.');
              std::println("{}", fichier.substr(point + 1));
          }
      output: "pdf"
cards:
  - key: find
    format: course
    question: "Que renvoie `s.find(\"abc\")` quand `\"abc\"` n'est pas dans la chaîne ?"
    choices:
      - {text: "La constante `std::string::npos`", correct: true}
      - {text: "Le nombre `-1`, de type `int`", correct: false}
      - {text: "Le nombre `0`, la position du début", correct: false}
      - {text: "Rien : elle lance `std::out_of_range`", correct: false}
    answer: "`npos` est le plus grand `std::size_t`. Trouvé, `find` renvoie la position de la première occurrence, qui peut être 0."
  - key: substr
    format: course
    question: "Que fait `s.substr(2, 3)` ?"
    choices:
      - {text: "Elle renvoie une nouvelle chaîne : trois caractères à partir de la position 2", correct: true}
      - {text: "Elle renvoie une nouvelle chaîne : les caractères de la position 2 à la position 3", correct: false}
      - {text: "Elle retire de `s` trois caractères à partir de la position 2", correct: false}
      - {text: "Elle renvoie une vue sur `s`, sans copier aucun caractère", correct: false}
    answer: "Les arguments sont une position et une longueur, pas deux positions. `s` n'est pas modifiée ; la partie extraite est copiée."
  - key: replace
    format: course
    question: "Que remplace `s.replace(0, 3, \"xy\")` ?"
    choices:
      - {text: "Les trois premiers caractères de `s`, par `xy`", correct: true}
      - {text: "Toutes les occurrences de `0` dans `s`, par `3`", correct: false}
      - {text: "Le caractère de position 0, par trois fois `xy`", correct: false}
      - {text: "Les caractères des positions 0 et 3, par `x` et `y`", correct: false}
    answer: "`replace(position, longueur, texte)` remplace une tranche. Le texte de remplacement peut être plus court ou plus long : la chaîne change de taille."
  - key: starts-with
    format: course
    question: "Comment teste-t-on, depuis C++20, qu'une chaîne commence par `\"http\"` ?"
    choices:
      - {text: "`s.starts_with(\"http\")`", correct: true}
      - {text: "`s.find(\"http\") != std::string::npos`", correct: false}
      - {text: "`s.begin() == \"http\"`", correct: false}
      - {text: "`s[0] == \"http\"`", correct: false}
    answer: "`starts_with` dit l'intention, et ne regarde que le début. Le `find` répondrait vrai aussi quand `http` est au milieu de la chaîne."
  - key: vf-npos
    format: true-false
    question: "`s.find(x)` renvoie `-1` quand `x` est absent de la chaîne."
    truth: false
    answer: "Elle renvoie `std::string::npos`, un `std::size_t`. On compare à `npos`, pas à un nombre négatif."
  - key: vf-substr-copie
    format: true-false
    question: "`substr` renvoie une nouvelle chaîne, sans modifier celle d'origine."
    truth: true
    answer: "Elle copie les caractères extraits. Pour lire une partie sans copier, on passe par `std::string_view`."
  - key: vf-substr-trop-long
    format: true-false
    question: "`s.substr(1, 100)` lance une exception quand `s` n'a que trois caractères."
    truth: false
    answer: "Une longueur trop grande est tronquée à la fin de la chaîne. C'est une position supérieure à la taille qui lance `std::out_of_range`."
  - key: vf-size-octets
    format: true-false
    question: "`size()` compte les octets de la chaîne, pas ses lettres."
    truth: true
    answer: "En UTF-8, une lettre accentuée occupe deux octets : `\"été\"` a une taille de 5."
  - key: qcm-fin
    format: multiple-choice
    question: "Quelle expression renvoie tout ce qui suit la position `p` dans la chaîne `s` ?"
    choices:
      - {text: "`s.substr(p + 1)`", correct: true}
      - {text: "`s.substr(p + 1, 1)`", correct: false}
      - {text: "`s.find(p + 1)`", correct: false}
      - {text: "`s.erase(p + 1)`", correct: false}
    answer: "Sans second argument, `substr` va jusqu'à la fin de la chaîne."
  - key: qcm-depuis-la-fin
    format: multiple-choice
    question: "Quelle fonction cherche la dernière occurrence d'un caractère ?"
    choices:
      - {text: "`rfind`", correct: true}
      - {text: "`find`", correct: false}
      - {text: "`back`", correct: false}
      - {text: "`ends_with`", correct: false}
    answer: "`rfind` cherche à partir de la fin. Elle sert, par exemple, à isoler l'extension d'un nom de fichier."
  - key: qcm-ajouter
    format: multiple-choice
    question: "Laquelle de ces lignes ajoute un point d'exclamation à la fin de la chaîne `s` ?"
    choices:
      - {text: "`s += \"!\";`", correct: true}
      - {text: "`s.insert(0, \"!\");`", correct: false}
      - {text: "`s.substr(\"!\");`", correct: false}
      - {text: "`s.find(\"!\");`", correct: false}
    answer: "`+=` ajoute à la fin, comme `append` et `push_back`. `insert(0, ...)` insérerait au début."
  - key: qcm-contains
    format: multiple-choice
    question: "Quelle fonction de C++23 dit si une chaîne en contient une autre ?"
    choices:
      - {text: "`contains`", correct: true}
      - {text: "`includes`", correct: false}
      - {text: "`has`", correct: false}
      - {text: "`index_of`", correct: false}
    answer: "`s.contains(\"le\")` renvoie un booléen. Avant C++23 : `s.find(\"le\") != std::string::npos`."
  - key: trous-npos
    format: fill-in
    question: |-
      Complète pour tester que le texte a été trouvé :
      ```cpp
      if (s.find("erreur") != std::string::___) {
          std::println("trouvé");
      }
      ```
    blanks:
      - [npos]
    answer: "`std::string::npos` est la valeur renvoyée quand rien n'est trouvé."
  - key: trous-substr
    format: fill-in
    question: |-
      Complète pour extraire les quatre premiers caractères :
      ```cpp
      const std::string annee = date.___(0, 4);
      ```
    blanks:
      - [substr]
    answer: "`substr(position, longueur)` renvoie la partie demandée."
  - key: trous-starts-with
    format: fill-in
    question: |-
      Complète pour tester le début de la chaîne :
      ```cpp
      if (url.___("https://")) {
          std::println("sécurisé");
      }
      ```
    blanks:
      - [starts_with]
    answer: "`starts_with` (C++20) teste le préfixe."
  - key: trous-find
    format: fill-in
    question: |-
      Complète pour obtenir la position de l'arobase :
      ```cpp
      const auto position = adresse.___('@');
      ```
    blanks:
      - [find]
    answer: "`find` renvoie la position de la première occurrence, ou `npos`."
  - key: code-find-substr
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string s = "cle=valeur";
          const auto p = s.find('=');
          std::println("{} {} {}", p, s.substr(0, p), s.substr(p + 1));
      }
      ```
    choices:
      - {text: "`3 cle valeur`", correct: true}
      - {text: "`4 cle valeur`", correct: false}
      - {text: "`3 cle= valeur`", correct: false}
      - {text: "`3 cle =valeur`", correct: false}
    answer: "`3 cle valeur` : le signe égal est à la position 3. `substr(0, 3)` prend ce qui précède ; `substr(4)` ce qui suit."
    check:
      output: "3 cle valeur"
  - key: code-replace
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "bonjour le monde";
          s.replace(s.find("monde"), 5, "tous");
          s.insert(0, "> ");
          std::println("{} {}", s, s.size());
      }
      ```
    choices:
      - {text: "`> bonjour le tous 17`", correct: true}
      - {text: "`> bonjour le monde 18`", correct: false}
      - {text: "`bonjour le tous > 17`", correct: false}
      - {text: "`> bonjour le tous 18`", correct: false}
    answer: "`> bonjour le tous 17` : `replace` remplace les cinq caractères de `monde` par `tous`, plus court d'un caractère. `insert(0, ...)` ajoute deux caractères au début : 16 - 1 + 2."
    check:
      output: "> bonjour le tous 17"
  - key: code-tests
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string s = "photo.png";
          std::println("{} {} {}", s.starts_with("photo"), s.ends_with(".jpg"), s.contains("o.p"));
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: "`true false true` : la chaîne commence par `photo`, finit par `.png` et non `.jpg`, et contient bien `o.p`."
    check:
      output: "true false true"
  - key: code-npos
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string s = "abcabc";
          std::println("{} {} {}", s.find('b'), s.rfind('b'), s.find('z') == std::string::npos);
      }
      ```
    choices:
      - {text: "`1 4 true`", correct: true}
      - {text: "`1 1 true`", correct: false}
      - {text: "`2 5 true`", correct: false}
      - {text: "`1 4 false`", correct: false}
    answer: "`1 4 true` : `find` donne la première occurrence, `rfind` la dernière. `z` est absent : le résultat est `npos`."
    check:
      output: "1 4 true"
  - key: bug-npos-non-teste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::out_of_range` : l'adresse n'a pas d'arobase. Il devrait afficher
      `invalide`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string adresse = "ada.exemple.fr";
          const auto arobase = adresse.find('@');
          std::println("{}", adresse.substr(arobase + 1, 3) + adresse.substr(arobase));
      }
      ```
    choices:
      - {text: "Comparer `arobase` à `std::string::npos`, et afficher `invalide` dans ce cas", correct: true}
      - {text: "Comparer `arobase` à `-1`, de type `int`, et afficher `invalide` dans ce cas", correct: false}
      - {text: "Comparer `arobase` à `0`, et afficher `invalide` dans ce cas", correct: false}
      - {text: "Déclarer `arobase` avec le type `int` à la place de `auto`", correct: false}
    answer: |-
      ```cpp
      if (arobase == std::string::npos) {
          std::println("invalide");
          return 0;
      }
      ```
      Absent, `find` renvoie `npos`, un nombre énorme : `substr(npos)` lance `std::out_of_range`. On teste le
      résultat avant de s'en servir. La position 0, elle, est une réponse valide.
  - key: bug-substr-fin
    format: bug-fix
    question: |-
      Ce programme devrait afficher l'année, `2026`. Il affiche `2026-`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string date = "2026-11-13";
          std::println("{}", date.substr(0, 5));
      }
      ```
    choices:
      - {text: "Écrire `date.substr(0, 4)`", correct: true}
      - {text: "Écrire `date.substr(1, 4)`", correct: false}
      - {text: "Écrire `date.substr(0, 3)`", correct: false}
      - {text: "Écrire `date.substr(4, 0)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", date.substr(0, 4));
      ```
      Le second argument est une **longueur**, pas la position de fin. L'année compte quatre caractères.
  - key: bug-replace-mot
    format: bug-fix
    question: |-
      Le compilateur refuse `s.replace("chat", "chien");` : `replace` n'a pas de version qui prenne deux textes.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "le chat dort";
          s.replace("chat", "chien");
          std::println("{}", s);
      }
      ```
    choices:
      - {text: "Écrire `s.replace(s.find(\"chat\"), 4, \"chien\");`", correct: true}
      - {text: "Écrire `s.replace(\"chat\", 4, \"chien\");`", correct: false}
      - {text: "Écrire `s.substr(\"chat\", \"chien\");`", correct: false}
      - {text: "Écrire `s.find(\"chat\") = \"chien\";`", correct: false}
    answer: |-
      ```cpp
      s.replace(s.find("chat"), 4, "chien");
      ```
      `replace` attend une position et une longueur. On cherche d'abord le mot avec `find` ; dans un vrai programme,
      on vérifie aussi que le résultat n'est pas `npos`.
  - key: bug-substr-ignore
    format: bug-fix
    question: |-
      Ce programme devrait afficher `bonjour`. Il affiche `bonjour le monde` : la chaîne n'a pas été raccourcie.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "bonjour le monde";
          s.substr(0, 7);
          std::println("{}", s);
      }
      ```
    choices:
      - {text: "Écrire `s = s.substr(0, 7);`", correct: true}
      - {text: "Écrire `s.substr(7, 0);`", correct: false}
      - {text: "Écrire `s.find(0, 7);`", correct: false}
      - {text: "Écrire `s.substr(0, 7).clear();`", correct: false}
    answer: |-
      ```cpp
      s = s.substr(0, 7);
      ```
      `substr` ne modifie pas la chaîne : elle en renvoie une nouvelle, ici jetée. On affecte le résultat ; pour
      couper en place, `s.erase(7);` convient aussi.
