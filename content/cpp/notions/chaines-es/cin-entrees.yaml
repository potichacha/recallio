notion: cin-entrees
lesson: |-
  `std::cin` (en-tête `<iostream>`) lit l'**entrée standard** : le clavier, ou un fichier redirigé. C'est un
  **flux d'entrée**. Tout ce qui est dit ici vaut pour les autres : un fichier (`std::ifstream`), ou une chaîne
  (`std::istringstream`), bien commode pour s'exercer.

  **Lire une valeur : `>>`.**

  ```cpp
  int age = 0;
  std::string prenom;
  std::cin >> prenom >> age;
  ```

  L'opérateur `>>` **saute les espaces** et les retours à la ligne, puis lit **jusqu'au prochain espace**. Il
  convertit selon le type de la variable. Pour une chaîne, il ne lit donc qu'**un mot**.

  **Lire une ligne : `std::getline`.**

  ```cpp
  std::string ligne;
  std::getline(std::cin, ligne);     // jusqu'au retour à la ligne, qui est retiré
  ```

  **L'état du flux.** Une lecture peut échouer : fin de l'entrée, ou texte qui ne correspond pas au type (`abc`
  pour un `int`). Le flux passe alors dans un **état d'échec**, et **toutes les lectures suivantes échouent** sans
  rien lire, jusqu'à ce qu'on le remette en état.

  | Fonction | Vraie quand |
  |---|---|
  | `good()` | tout va bien |
  | `eof()` | la fin de l'entrée a été atteinte |
  | `fail()` | la dernière lecture a échoué |

  Un flux se convertit en booléen : **vrai s'il n'a pas échoué**. Et `>>` comme `getline` **renvoient le flux**.
  D'où les deux écritures à connaître :

  ```cpp
  if (std::cin >> age) { /* lu */ } else { /* échec */ }

  while (std::getline(std::cin, ligne)) { /* une ligne de plus */ }
  ```

  On teste **la lecture elle-même**, pas `eof()` avant de lire : `eof()` ne devient vrai qu'**après** une lecture
  qui a buté sur la fin. Une boucle `while (!std::cin.eof())` traite donc une fois de trop.

  **Réparer après une saisie invalide.**

  ```cpp
  std::cin.clear();                                                      // efface l'état d'échec
  std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');    // jette le reste de la ligne
  ```

  Sans `clear()`, plus rien ne se lit. Sans `ignore`, le texte fautif est toujours là, et la lecture suivante
  échoue de nouveau.

  **Le piège de `>>` suivi de `getline`.** `>>` laisse le **retour à la ligne** dans le flux. Le `getline` qui suit
  le trouve aussitôt, et rend une **ligne vide**. On l'écarte avant : `std::cin >> std::ws;`, ou un `ignore`.

  **Une valeur non lue.** Depuis C++11, une conversion numérique qui échoue met la variable à **0**. On teste le
  flux, pas la variable.

  **Lire depuis une chaîne.** `std::istringstream` (`<sstream>`) se lit comme `std::cin` : c'est la façon simple de
  découper une ligne en champs.

  ```cpp
  std::istringstream flux{"Ada 36"};
  flux >> prenom >> age;
  ```

  **En entretien** : « `>>` lit un mot en sautant les espaces, `getline` une ligne entière. Je teste toujours la
  lecture, `if (flux >> x)` ou `while (std::getline(flux, ligne))`, jamais `eof()` à l'avance. Après un échec, le
  flux reste bloqué tant qu'on n'a pas appelé `clear()`. »
tour:
  - title: Lire des valeurs
    text: |-
      Un **flux d'entrée** se lit avec `>>` : il saute les espaces, lit un mot, et le convertit dans le type de la
      variable. `std::getline` lit une ligne entière.

      `std::cin` lit le clavier. Ici, pour que l'exemple s'exécute tout seul, on lit une chaîne avec
      `std::istringstream` : elle s'utilise exactement comme `std::cin`.

      Une lecture peut échouer. On la teste donc toujours : `if (flux >> age)`.

      Essaie : remplace `36` par `trente`, puis exécute. La lecture de l'âge échoue, et le programme le dit.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <sstream>
          #include <string>

          int main() {
              std::istringstream flux{"Ada 36\nmathématicienne et pionnière"};

              std::string prenom;
              int age = 0;
              if (flux >> prenom >> age) {
                  std::println("{} a {} ans", prenom, age);
              } else {
                  std::println("lecture impossible");
              }

              std::string ligne;
              flux >> std::ws;
              std::getline(flux, ligne);
              std::println("{}", ligne);
          }
      output: |-
        Ada a 36 ans
        mathématicienne et pionnière
cards:
  - key: operateur
    format: course
    question: "Que lit `flux >> mot`, quand `mot` est une `std::string` ?"
    choices:
      - {text: "Un seul mot : il saute les espaces, puis s'arrête au prochain espace", correct: true}
      - {text: "Une ligne entière, jusqu'au retour à la ligne", correct: false}
      - {text: "Un seul caractère, espaces compris", correct: false}
      - {text: "Tout le reste du flux, jusqu'à la fin", correct: false}
    answer: "`>>` découpe l'entrée autour des espaces et des retours à la ligne. Pour une ligne entière, c'est `std::getline`."
  - key: getline
    format: course
    question: "Que fait `std::getline(flux, ligne)` ?"
    choices:
      - {text: "Elle lit jusqu'au retour à la ligne, qu'elle retire, et range le texte dans `ligne`", correct: true}
      - {text: "Elle lit un mot, jusqu'au prochain espace, et range le texte dans `ligne`", correct: false}
      - {text: "Elle lit tout le flux, retours à la ligne compris, et range le texte dans `ligne`", correct: false}
      - {text: "Elle lit une ligne, et renvoie le nombre de caractères lus", correct: false}
    answer: "Les espaces sont gardés ; le retour à la ligne final est consommé, mais pas rangé. Elle renvoie le flux, qu'on peut tester."
  - key: etat
    format: course
    question: "Que se passe-t-il après une lecture qui échoue, par exemple `abc` pour un `int` ?"
    choices:
      - {text: "Le flux passe en état d'échec : les lectures suivantes échouent, jusqu'à `clear()`", correct: true}
      - {text: "Le flux lance une exception `std::invalid_argument`, qu'il faut attraper", correct: false}
      - {text: "Le flux saute le texte fautif, et lit la valeur suivante à la place", correct: false}
      - {text: "Le flux se ferme, et ne peut plus jamais être lu", correct: false}
    answer: "Par défaut, un flux ne lance rien : il note l'échec dans son état. Tant qu'on ne l'a pas effacé, chaque lecture échoue sans rien lire."
  - key: tester
    format: course
    question: "Comment lit-on toutes les lignes d'un flux, sans en traiter une de trop ?"
    choices:
      - {text: "`while (std::getline(flux, ligne)) { ... }`", correct: true}
      - {text: "`while (!flux.eof()) { std::getline(flux, ligne); ... }`", correct: false}
      - {text: "`while (flux.good()) { std::getline(flux, ligne); ... }`", correct: false}
      - {text: "`do { std::getline(flux, ligne); ... } while (true);`", correct: false}
    answer: "`getline` renvoie le flux, vrai tant que la lecture a réussi. `eof()` ne devient vrai qu'après une lecture qui a buté sur la fin : la tester d'abord fait un tour de trop."
  - key: vf-espaces
    format: true-false
    question: "L'opérateur `>>` saute les espaces et les retours à la ligne avant de lire."
    truth: true
    answer: "C'est ce qui permet d'enchaîner `flux >> a >> b`, que les valeurs soient sur une ligne ou sur deux."
  - key: vf-exception
    format: true-false
    question: "Par défaut, une lecture qui échoue sur `std::cin` lance une exception."
    truth: false
    answer: "Elle met le flux en état d'échec. Les exceptions ne sont lancées que si on les demande, avec `exceptions()`."
  - key: vf-eof
    format: true-false
    question: "`flux.eof()` est vrai dès que le dernier caractère a été lu, avant toute tentative de lire plus loin."
    truth: false
    answer: "Il ne devient vrai qu'après une lecture qui a rencontré la fin. C'est pourquoi on teste la lecture, pas `eof()`."
  - key: vf-istringstream
    format: true-false
    question: "Un `std::istringstream` se lit avec `>>` et `std::getline`, comme `std::cin`."
    truth: true
    answer: "Ce sont tous des flux d'entrée. Lire depuis une chaîne sert à découper une ligne en champs."
  - key: qcm-reparer
    format: multiple-choice
    question: "Après une saisie invalide, quelle fonction efface l'état d'échec du flux ?"
    choices:
      - {text: "`std::cin.clear()`", correct: true}
      - {text: "`std::cin.reset()`", correct: false}
      - {text: "`std::cin.flush()`", correct: false}
      - {text: "`std::cin.ignore()`", correct: false}
    answer: "`clear()` remet l'état à « bon ». `ignore` jette ensuite le texte fautif, resté dans le flux."
  - key: qcm-ligne-vide
    format: multiple-choice
    question: "Après `std::cin >> age;`, un `std::getline(std::cin, nom);` rend une ligne vide. Pourquoi ?"
    choices:
      - {text: "`>>` a laissé le retour à la ligne dans le flux, et `getline` s'y arrête", correct: true}
      - {text: "`>>` a mis le flux en état d'échec, et `getline` ne lit plus rien", correct: false}
      - {text: "`getline` ne fonctionne pas sur `std::cin`, seulement sur un fichier", correct: false}
      - {text: "`getline` saute toujours la première ligne qu'elle rencontre", correct: false}
    answer: "`>>` s'arrête juste après le nombre. On écarte le retour à la ligne avant : `std::cin >> std::ws;`."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::istringstream` ?"
    choices:
      - {text: "`<sstream>`", correct: true}
      - {text: "`<string>`", correct: false}
      - {text: "`<iostream>`", correct: false}
      - {text: "`<fstream>`", correct: false}
    answer: "`<sstream>` : les flux sur des chaînes. `<iostream>` déclare `std::cin`, `<fstream>` les flux sur des fichiers."
  - key: qcm-test
    format: multiple-choice
    question: "Quelle condition est vraie quand la lecture de `age` a réussi ?"
    choices:
      - {text: "`if (std::cin >> age)`", correct: true}
      - {text: "`if (age != 0)`", correct: false}
      - {text: "`if (std::cin.eof())`", correct: false}
      - {text: "`if (std::cin == age)`", correct: false}
    answer: "`>>` renvoie le flux, qui se convertit en `true` s'il n'a pas échoué. Tester la variable ne dit rien : 0 est une saisie possible."
  - key: trous-getline
    format: fill-in
    question: |-
      Complète pour lire une ligne entière :
      ```cpp
      std::string ligne;
      std::___(std::cin, ligne);
      ```
    blanks:
      - [getline]
    answer: "`std::getline(flux, chaine)` lit jusqu'au retour à la ligne."
  - key: trous-clear
    format: fill-in
    question: |-
      Complète pour effacer l'état d'échec du flux :
      ```cpp
      if (!(std::cin >> age)) {
          std::cin.___();
      }
      ```
    blanks:
      - [clear]
    answer: "`clear()` remet le flux en état de lire."
  - key: trous-extraction
    format: fill-in
    question: |-
      Complète pour lire un entier depuis le flux :
      ```cpp
      int age = 0;
      std::cin ___ age;
      ```
    blanks:
      - [">>"]
    answer: "`>>` extrait une valeur du flux. `<<` sert à écrire."
  - key: trous-istringstream
    format: fill-in
    question: |-
      Complète avec le flux qui lit depuis une chaîne :
      ```cpp
      std::___ flux{"12 15 9"};
      int note = 0;
      flux >> note;
      ```
    blanks:
      - [istringstream]
    answer: "`std::istringstream` : un flux d'entrée sur une chaîne."
  - key: code-mots
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"Ada Lovelace 36"};
          std::string a;
          std::string b;
          int n = 0;
          flux >> a >> b >> n;
          std::println("{} {} {}", b, a, n + 1);
      }
      ```
    choices:
      - {text: "`Lovelace Ada 37`", correct: true}
      - {text: "`Ada Lovelace 37`", correct: false}
      - {text: "`Lovelace Ada 36`", correct: false}
      - {text: "`Lovelace 36 Ada 1`", correct: false}
    answer: "`Lovelace Ada 37` : `>>` lit un mot à la fois, séparés par les espaces, et convertit le troisième en entier."
    check:
      output: "Lovelace Ada 37"
  - key: code-echec
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream flux{"12 abc 7"};
          int a = 1;
          int b = 1;
          int c = 1;
          flux >> a >> b >> c;
          std::println("{} {} {} {}", a, b, c, flux.fail());
      }
      ```
    choices:
      - {text: "`12 0 1 true`", correct: true}
      - {text: "`12 1 7 true`", correct: false}
      - {text: "`12 0 7 false`", correct: false}
      - {text: "`12 1 1 true`", correct: false}
    answer: "`12 0 1 true` : `abc` n'est pas un entier. La lecture de `b` échoue et le met à 0 ; le flux est alors en échec, et `c` n'est pas lu du tout."
    check:
      output: "12 0 1 true"
  - key: code-boucle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"un\ndeux mots\ntrois"};
          std::string ligne;
          int lignes = 0;
          std::size_t caracteres = 0;
          while (std::getline(flux, ligne)) {
              ++lignes;
              caracteres += ligne.size();
          }
          std::println("{} {}", lignes, caracteres);
      }
      ```
    choices:
      - {text: "`3 16`", correct: true}
      - {text: "`4 16`", correct: false}
      - {text: "`3 18`", correct: false}
      - {text: "`4 17`", correct: false}
    answer: "`3 16` : trois lignes, de 2, 9 et 5 caractères. `getline` garde l'espace de `deux mots`, et retire les retours à la ligne."
    check:
      output: "3 16"
  - key: code-getline-apres
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"36\nAda Lovelace"};
          int age = 0;
          std::string nom;
          flux >> age;
          std::getline(flux, nom);
          std::println("[{}] {}", nom, age);
      }
      ```
    choices:
      - {text: "`[] 36`", correct: true}
      - {text: "`[Ada Lovelace] 36`", correct: false}
      - {text: "`[Ada] 36`", correct: false}
      - {text: "`[36] 0`", correct: false}
    answer: "`[] 36` : `>>` s'arrête après `36`, et laisse le retour à la ligne. `getline` le rencontre aussitôt, et rend une ligne vide."
    check:
      output: "[] 36"
  - key: bug-boucle-eof
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2`, le nombre de valeurs lues. Il affiche `3` : la boucle fait un tour de
      trop. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream flux{"10 20 "};
          int valeur = 0;
          int lues = 0;
          while (!flux.eof()) {
              flux >> valeur;
              ++lues;
          }
          std::println("{}", lues);
      }
      ```
    choices:
      - {text: "Écrire `while (flux >> valeur) { ++lues; }`", correct: true}
      - {text: "Écrire `while (flux.good()) { flux >> valeur; ++lues; }`", correct: false}
      - {text: "Écrire `while (!flux.fail()) { flux >> valeur; ++lues; }`", correct: false}
      - {text: "Écrire `while (flux.eof()) { flux >> valeur; ++lues; }`", correct: false}
    answer: |-
      ```cpp
      while (flux >> valeur) {
          ++lues;
      }
      ```
      `eof()` ne devient vrai qu'après une lecture qui a buté sur la fin : la troisième lecture échoue, mais est
      comptée. On teste la lecture elle-même. Tester `good()` ou `fail()` avant de lire a le même défaut.
  - key: bug-getline-apres-extraction
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada Lovelace`. Il affiche une ligne vide. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"36\nAda Lovelace"};
          int age = 0;
          std::string nom;
          flux >> age;
          std::getline(flux, nom);
          std::println("{}", nom);
      }
      ```
    choices:
      - {text: "Écrire `flux >> std::ws;` avant le `getline`", correct: true}
      - {text: "Écrire `flux.clear();` avant le `getline`", correct: false}
      - {text: "Écrire `flux >> nom;` à la place du `getline`", correct: false}
      - {text: "Écrire `flux << std::ws;` avant le `getline`", correct: false}
    answer: |-
      ```cpp
      flux >> age;
      flux >> std::ws;
      std::getline(flux, nom);
      ```
      `>>` laisse le retour à la ligne dans le flux. `std::ws` consomme les espaces et retours à la ligne en
      attente. `flux >> nom` ne lirait que `Ada`, et le flux n'est pas en échec : `clear()` ne change rien.
  - key: bug-flux-bloque
    format: bug-fix
    question: |-
      Après la saisie invalide `abc`, ce programme devrait lire `42` et l'afficher. Il affiche `0` : le flux est
      resté bloqué. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"abc 42"};
          int valeur = 0;
          if (!(flux >> valeur)) {
              std::string rebut;
              flux >> rebut;
          }
          flux >> valeur;
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "Appeler `flux.clear();` avant de lire `rebut`", correct: true}
      - {text: "Appeler `flux.ignore();` avant de lire `rebut`", correct: false}
      - {text: "Appeler `flux.eof();` avant de lire `rebut`", correct: false}
      - {text: "Déclarer `valeur` avec le type `long`", correct: false}
    answer: |-
      ```cpp
      if (!(flux >> valeur)) {
          flux.clear();
          std::string rebut;
          flux >> rebut;
      }
      ```
      Tant que l'état d'échec n'est pas effacé, chaque lecture échoue sans rien lire, y compris celle de `rebut`.
      `clear()` d'abord, puis on écarte le texte fautif.
  - key: bug-mot-au-lieu-de-ligne
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada Lovelace`. Il affiche `Ada`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"Ada Lovelace"};
          std::string nom;
          flux >> nom;
          std::println("{}", nom);
      }
      ```
    choices:
      - {text: "Écrire `std::getline(flux, nom);`", correct: true}
      - {text: "Écrire `flux >> nom >> nom;`", correct: false}
      - {text: "Écrire `flux.get(nom);`", correct: false}
      - {text: "Écrire `flux >> std::ws >> nom;`", correct: false}
    answer: |-
      ```cpp
      std::getline(flux, nom);
      ```
      `>>` s'arrête au premier espace : il lit un mot. Pour un texte qui contient des espaces, on lit la ligne
      entière.
