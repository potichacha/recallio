notion: fichiers
lesson: |-
  L'en-tête `<fstream>` fournit des flux sur des fichiers. Ils se lisent et s'écrivent comme `std::cin` et
  `std::cout`.

  | Classe | Usage |
  |---|---|
  | `std::ifstream` | **lire** un fichier |
  | `std::ofstream` | **écrire** un fichier |
  | `std::fstream` | lire et écrire |

  **Écrire.**

  ```cpp
  std::ofstream sortie{"notes.txt"};
  if (!sortie) {
      // le fichier n'a pas pu être ouvert
  }
  sortie << "Ada " << 18 << '\n';
  std::println(sortie, "Alan {}", 15);     // std::print accepte un flux en premier argument
  ```

  Par défaut, `std::ofstream` **crée** le fichier, ou **efface son contenu** s'il existe.

  **Lire.**

  ```cpp
  std::ifstream entree{"notes.txt"};
  if (!entree) {
      // fichier introuvable, ou illisible
  }
  std::string ligne;
  while (std::getline(entree, ligne)) {
      // une ligne de plus
  }
  ```

  **Toujours tester l'ouverture.** Ouvrir un fichier qui n'existe pas **ne lance rien** : le flux est simplement en
  état d'échec, et chaque lecture échoue en silence. `if (!entree)` ou `entree.is_open()` le disent.

  **La fermeture est automatique.** Le destructeur du flux **ferme** le fichier : c'est RAII. Pas de `close()` à
  écrire, même si une exception traverse la fonction. On n'appelle `close()` que pour fermer **avant** la fin de
  la portée, par exemple pour relire le fichier qu'on vient d'écrire.

  **Les modes d'ouverture**, en second argument, combinés avec `|` :

  | Mode | Effet |
  |---|---|
  | `std::ios::app` | écrit **à la fin**, sans effacer |
  | `std::ios::trunc` | efface le contenu (défaut de `std::ofstream`) |
  | `std::ios::binary` | pas de traduction des fins de ligne |
  | `std::ios::in`, `std::ios::out` | lecture, écriture |

  ```cpp
  std::ofstream journal{"journal.txt", std::ios::app};
  ```

  **Le tampon.** Ce qu'on écrit va d'abord dans un tampon en mémoire, vidé sur le disque quand il est plein, à la
  fermeture, ou sur demande (`flush()`). `std::endl` écrit un retour à la ligne **et** vide le tampon : dans une
  boucle, il ralentit beaucoup. On écrit `'\n'`.

  **Lire des valeurs.** `>>` fonctionne comme sur `std::cin` : `while (entree >> nombre)` lit tous les nombres du
  fichier, quels que soient les espaces et les retours à la ligne qui les séparent.

  **Lire tout le fichier d'un coup.**

  ```cpp
  std::ostringstream tampon;
  tampon << entree.rdbuf();
  std::string contenu = tampon.str();
  ```

  **Les erreurs d'écriture.** Un disque plein ne se voit qu'en testant le flux après l'écriture, ou à la
  fermeture : `if (!sortie)`.

  **En entretien** : « `std::ifstream` pour lire, `std::ofstream` pour écrire ; je teste toujours l'ouverture, car
  un fichier absent ne lance pas d'exception. Le destructeur ferme le fichier. `std::ofstream` efface par défaut :
  `std::ios::app` pour ajouter. Et `'\n'` plutôt que `std::endl`. »
cards:
  - key: classes
    format: course
    question: "Quelle classe sert à lire un fichier ?"
    choices:
      - {text: "`std::ifstream`", correct: true}
      - {text: "`std::ofstream`", correct: false}
      - {text: "`std::istringstream`", correct: false}
      - {text: "`std::filesystem::path`", correct: false}
    answer: "`ifstream` : *input file stream*. `ofstream` écrit ; `istringstream` lit une chaîne ; `path` ne représente qu'un chemin."
  - key: ouverture-ratee
    format: course
    question: "Que se passe-t-il quand on ouvre avec `std::ifstream` un fichier qui n'existe pas ?"
    choices:
      - {text: "Rien de visible : le flux est en état d'échec, et les lectures échouent en silence", correct: true}
      - {text: "Le constructeur lance une exception `std::runtime_error`, qu'il faut attraper", correct: false}
      - {text: "Le fichier est créé vide, et les lectures renvoient des chaînes vides", correct: false}
      - {text: "Le programme s'arrête, avec un message qui nomme le fichier", correct: false}
    answer: "Par défaut, un flux ne lance pas. C'est pourquoi on teste l'ouverture : `if (!entree)`."
  - key: fermeture
    format: course
    question: "Quand un fichier ouvert par un `std::ofstream` local est-il fermé ?"
    choices:
      - {text: "À la destruction du flux, en fin de portée, même si une exception est lancée", correct: true}
      - {text: "Seulement quand on appelle `close()`, sinon il reste ouvert jusqu'à la fin du programme", correct: false}
      - {text: "Après chaque écriture, puis rouvert à l'écriture suivante", correct: false}
      - {text: "Quand le tampon est plein, puis rouvert au besoin", correct: false}
    answer: "Le destructeur vide le tampon et ferme le fichier : c'est RAII. `close()` ne sert qu'à fermer plus tôt."
  - key: mode-defaut
    format: course
    question: "Que devient un fichier existant quand on l'ouvre avec `std::ofstream sortie{\"notes.txt\"};` ?"
    choices:
      - {text: "Son contenu est effacé", correct: true}
      - {text: "Les écritures s'ajoutent à la fin", correct: false}
      - {text: "L'ouverture échoue, pour le protéger", correct: false}
      - {text: "Il est renommé, et un nouveau est créé", correct: false}
    answer: "Le mode par défaut tronque le fichier. Pour ajouter à la fin, on ouvre avec `std::ios::app`."
  - key: vf-exception
    format: true-false
    question: "Ouvrir un fichier introuvable avec `std::ifstream` lance une exception par défaut."
    truth: false
    answer: "Le flux passe en état d'échec, sans rien lancer. On le teste avec `if (!entree)` ou `is_open()`."
  - key: vf-close
    format: true-false
    question: "Il faut appeler `close()` sur un `std::ofstream` avant la fin de la fonction, sinon le fichier reste ouvert."
    truth: false
    answer: "Le destructeur ferme le fichier. `close()` est facultatif."
  - key: vf-endl
    format: true-false
    question: "`std::endl` vide le tampon du flux, en plus d'écrire un retour à la ligne."
    truth: true
    answer: "C'est ce qui le rend coûteux dans une boucle. `'\\n'` écrit seulement le retour à la ligne."
  - key: vf-meme-syntaxe
    format: true-false
    question: "Un `std::ifstream` se lit avec `>>` et `std::getline`, comme `std::cin`."
    truth: true
    answer: "Ce sont tous des flux d'entrée : même syntaxe, même gestion de l'état."
  - key: qcm-ajouter
    format: multiple-choice
    question: "Quelle ligne ouvre `journal.txt` pour écrire à la suite de son contenu ?"
    choices:
      - {text: "`std::ofstream journal{\"journal.txt\", std::ios::app};`", correct: true}
      - {text: "`std::ofstream journal{\"journal.txt\"};`", correct: false}
      - {text: "`std::ofstream journal{\"journal.txt\", std::ios::trunc};`", correct: false}
      - {text: "`std::ifstream journal{\"journal.txt\", std::ios::app};`", correct: false}
    answer: "`std::ios::app` (*append*) place chaque écriture à la fin. Sans mode, ou avec `trunc`, le contenu est effacé."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle condition est vraie quand le fichier n'a pas pu être ouvert ?"
    choices:
      - {text: "`if (!entree)`", correct: true}
      - {text: "`if (entree == nullptr)`", correct: false}
      - {text: "`if (entree.eof())`", correct: false}
      - {text: "`if (entree.size() == 0)`", correct: false}
    answer: "Un flux se convertit en booléen : faux s'il est en état d'échec. `!entree.is_open()` convient aussi."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::ifstream` et `std::ofstream` ?"
    choices:
      - {text: "`<fstream>`", correct: true}
      - {text: "`<iostream>`", correct: false}
      - {text: "`<filesystem>`", correct: false}
      - {text: "`<file>`", correct: false}
    answer: "`<fstream>` : les flux sur des fichiers. `<filesystem>` manipule les chemins et les répertoires, pas leur contenu."
  - key: qcm-binaire
    format: multiple-choice
    question: "Quel mode ouvre un fichier sans traduire les fins de ligne, pour des données brutes ?"
    choices:
      - {text: "`std::ios::binary`", correct: true}
      - {text: "`std::ios::app`", correct: false}
      - {text: "`std::ios::trunc`", correct: false}
      - {text: "`std::ios::raw`", correct: false}
    answer: "En mode texte, certains systèmes transforment `\\n`. `std::ios::binary` lit et écrit les octets tels quels."
  - key: trous-ifstream
    format: fill-in
    question: |-
      Complète pour ouvrir le fichier en lecture :
      ```cpp
      std::___ entree{"notes.txt"};
      ```
    blanks:
      - [ifstream]
    answer: "`std::ifstream` : un flux d'entrée sur un fichier."
  - key: trous-ofstream
    format: fill-in
    question: |-
      Complète pour ouvrir le fichier en écriture :
      ```cpp
      std::___ sortie{"notes.txt"};
      sortie << "Ada 18\n";
      ```
    blanks:
      - [ofstream]
    answer: "`std::ofstream` : un flux de sortie sur un fichier."
  - key: trous-app
    format: fill-in
    question: |-
      Complète pour écrire à la fin du fichier, sans l'effacer :
      ```cpp
      std::ofstream journal{"journal.txt", std::ios::___};
      ```
    blanks:
      - [app]
    answer: "`std::ios::app` : chaque écriture va à la fin."
  - key: trous-getline
    format: fill-in
    question: |-
      Complète pour lire le fichier ligne par ligne :
      ```cpp
      std::string ligne;
      while (std::___(entree, ligne)) {
          std::println("{}", ligne);
      }
      ```
    blanks:
      - [getline]
    answer: "`std::getline` renvoie le flux, faux quand il n'y a plus de ligne."
  - key: code-ecrire-lire
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_notes.txt";
          {
              std::ofstream sortie{chemin};
              sortie << "Ada 18\nAlan 15\n";
          }
          std::ifstream entree{chemin};
          std::string nom;
          int note = 0;
          int total = 0;
          while (entree >> nom >> note) {
              total += note;
          }
          std::println("{} {}", nom, total);
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`Alan 33`", correct: true}
      - {text: "`Ada 18`", correct: false}
      - {text: "`Alan 15`", correct: false}
      - {text: "`Ada 33`", correct: false}
    answer: "`Alan 33` : le bloc ferme le fichier écrit. La boucle lit les deux lignes ; `nom` garde le dernier lu, et le total vaut 18 + 15."
    check:
      output: "Alan 33"
  - key: code-introuvable
    format: code-output
    question: |-
      ```cpp
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          std::ifstream entree{"/tmp/recallio_absent.txt"};
          std::string ligne = "vide";
          std::getline(entree, ligne);
          std::println("{} {} {}", entree.is_open(), static_cast<bool>(entree), ligne);
      }
      ```
    choices:
      - {text: "`false false vide`", correct: true}
      - {text: "`true false vide`", correct: false}
      - {text: "`false true vide`", correct: false}
      - {text: "Rien : une exception arrête le programme", correct: false}
    answer: "`false false vide` : le fichier n'existe pas. Aucune exception : le flux est en échec, et `getline` ne touche pas à `ligne`."
    check:
      output: "false false vide"
  - key: code-troncature
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_journal.txt";
          { std::ofstream f{chemin}; f << "un\n"; }
          { std::ofstream f{chemin}; f << "deux\n"; }
          { std::ofstream f{chemin, std::ios::app}; f << "trois\n"; }
          std::ifstream entree{chemin};
          std::string ligne;
          int lignes = 0;
          while (std::getline(entree, ligne)) {
              ++lignes;
          }
          std::println("{} {}", lignes, ligne);
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`2 trois`", correct: true}
      - {text: "`3 trois`", correct: false}
      - {text: "`1 trois`", correct: false}
      - {text: "`2 deux`", correct: false}
    answer: "`2 trois` : la deuxième ouverture efface `un`. La troisième, en mode `app`, ajoute après `deux`. Il reste deux lignes."
    check:
      output: "2 trois"
  - key: code-rdbuf
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_texte.txt";
          { std::ofstream f{chemin}; f << "ab\ncd"; }
          std::ifstream entree{chemin};
          std::ostringstream tampon;
          tampon << entree.rdbuf();
          const std::string contenu = tampon.str();
          std::println("{} {}", contenu.size(), contenu.back());
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`5 d`", correct: true}
      - {text: "`4 d`", correct: false}
      - {text: "`2 b`", correct: false}
      - {text: "`6 d`", correct: false}
    answer: "`5 d` : `rdbuf()` donne tout le contenu du fichier, retour à la ligne compris : `a`, `b`, `\\n`, `c`, `d`."
    check:
      output: "5 d"
  - key: bug-ouverture-non-testee
    format: bug-fix
    question: |-
      Le fichier n'existe pas. Ce programme affiche `0 ligne`, comme si le fichier était vide, au lieu de signaler
      l'erreur. Quelle correction est la bonne ?
      ```cpp
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          std::ifstream entree{"/tmp/recallio_config_absente.txt"};
          std::string ligne;
          int lignes = 0;
          while (std::getline(entree, ligne)) {
              ++lignes;
          }
          std::println("{} ligne", lignes);
      }
      ```
    choices:
      - {text: "Tester `if (!entree)` juste après l'ouverture, et signaler l'erreur", correct: true}
      - {text: "Entourer l'ouverture d'un `try` et d'un `catch (const std::exception&)`", correct: false}
      - {text: "Appeler `entree.close();` juste après l'ouverture du fichier", correct: false}
      - {text: "Ouvrir le fichier avec `std::ofstream` à la place de `std::ifstream`", correct: false}
    answer: |-
      ```cpp
      std::ifstream entree{"/tmp/recallio_config_absente.txt"};
      if (!entree) {
          std::println("fichier introuvable");
          return 1;
      }
      ```
      Une ouverture ratée ne lance rien : sans test, un fichier absent ressemble à un fichier vide. Un `try`
      n'attraperait rien, et `std::ofstream` créerait le fichier.
  - key: bug-ecrasement
    format: bug-fix
    question: |-
      Ce programme devrait garder les deux lignes du journal et afficher `2`. Il affiche `1` : la seconde écriture
      a effacé la première. Quelle correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      void journaliser(const std::filesystem::path& chemin, const std::string& message) {
          std::ofstream journal{chemin};
          journal << message << '\n';
      }

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_journal.txt";
          journaliser(chemin, "démarrage");
          journaliser(chemin, "arrêt");
          std::ifstream entree{chemin};
          std::string ligne;
          int lignes = 0;
          while (std::getline(entree, ligne)) {
              ++lignes;
          }
          std::println("{}", lignes);
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Ouvrir avec `std::ofstream journal{chemin, std::ios::app};`", correct: true}
      - {text: "Ouvrir avec `std::ofstream journal{chemin, std::ios::trunc};`", correct: false}
      - {text: "Appeler `journal.close();` à la fin de la fonction `journaliser`", correct: false}
      - {text: "Écrire `std::endl` à la place de `'\\n'` dans la fonction", correct: false}
    answer: |-
      ```cpp
      std::ofstream journal{chemin, std::ios::app};
      ```
      Par défaut, `std::ofstream` efface le fichier à chaque ouverture. Le mode `app` écrit à la suite.
  - key: bug-relecture-avant-fermeture
    format: bug-fix
    question: |-
      Ce programme écrit une ligne, puis relit le fichier. Il devrait afficher `bonjour`, et affiche une ligne
      vide : le texte est encore dans le tampon du flux d'écriture. Quelle correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_tampon.txt";
          std::ofstream sortie{chemin};
          sortie << "bonjour";
          std::ifstream entree{chemin};
          std::string ligne;
          std::getline(entree, ligne);
          std::println("{}", ligne);
          entree.close();
          sortie.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Appeler `sortie.close();` avant d'ouvrir `entree`", correct: true}
      - {text: "Appeler `entree.clear();` avant le `getline`", correct: false}
      - {text: "Ouvrir `sortie` avec le mode `std::ios::app`", correct: false}
      - {text: "Ouvrir `entree` avec le mode `std::ios::binary`", correct: false}
    answer: |-
      ```cpp
      sortie << "bonjour";
      sortie.close();
      std::ifstream entree{chemin};
      ```
      Les écritures passent par un tampon, vidé à la fermeture. Tant que `sortie` est ouvert, le fichier sur le
      disque peut être vide. On ferme, ou l'on limite `sortie` à un bloc, avant de relire.
  - key: bug-lecture-mot
    format: bug-fix
    question: |-
      Ce programme devrait afficher la première ligne du fichier, `Ada Lovelace`. Il affiche `Ada`. Quelle
      correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_nom.txt";
          { std::ofstream f{chemin}; f << "Ada Lovelace\n"; }
          std::ifstream entree{chemin};
          std::string nom;
          entree >> nom;
          std::println("{}", nom);
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Écrire `std::getline(entree, nom);`", correct: true}
      - {text: "Écrire `entree << nom;`", correct: false}
      - {text: "Écrire `entree >> nom >> nom;`", correct: false}
      - {text: "Écrire `entree.read(nom);`", correct: false}
    answer: |-
      ```cpp
      std::getline(entree, nom);
      ```
      Comme sur `std::cin`, `>>` s'arrête au premier espace. Pour une ligne entière, c'est `std::getline`.
