              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };
      ```
    blanks:
      - [formatter]
    answer: "On spécialise le template `std::formatter` pour son type."
  - key: trous-format-to
    format: fill-in
    question: |-
      Complète pour écrire dans la sortie du contexte :
      ```cpp
      auto format(const Point& p, std::format_context& ctx) const {
          return std::___(ctx.out(), "({}, {})", p.x, p.y);
      }
      ```
    blanks:
      - [format_to]
    answer: "`std::format_to` écrit à travers un itérateur de sortie, et le renvoie."
  - key: trous-out
    format: fill-in
    question: |-
      Complète pour obtenir l'itérateur de sortie :
      ```cpp
      return std::format_to(ctx.___(), "{}", valeur);
      ```
    blanks:
      - [out]
    answer: "`ctx.out()` renvoie l'itérateur où écrire."
  - key: trous-begin
    format: fill-in
    question: |-
      Complète le `parse` d'un formateur sans spécification :
      ```cpp
      constexpr auto parse(std::format_parse_context& ctx) {
          return ctx.___();
      }
      ```
    blanks:
      - [begin]
    answer: "`ctx.begin()` désigne le début de la spécification, donc l'accolade fermante quand elle est vide."
  - key: code-point
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <>
      struct std::formatter<Point> {
          constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
          auto format(const Point& p, std::format_context& ctx) const {
              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };

      int main() {
          std::println("{} -> {}", Point{1, 2}, Point{3, 4});
      }
      ```
    choices:
      - {text: "`(1, 2) -> (3, 4)`", correct: true}
      - {text: "`1 2 -> 3 4`", correct: false}
      - {text: "`{1, 2} -> {3, 4}`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`(1, 2) -> (3, 4)` : chaque `{}` appelle le `format` du formateur de `Point`, qui écrit les parenthèses et la virgule."
    check:
      output: "(1, 2) -> (3, 4)"
  - key: code-heritage
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>
      #include <string_view>

      enum class Couleur { rouge, vert };

      template <>
      struct std::formatter<Couleur> : std::formatter<std::string_view> {
          auto format(Couleur c, std::format_context& ctx) const {
              const std::string_view nom = c == Couleur::rouge ? "rouge" : "vert";
              return std::formatter<std::string_view>::format(nom, ctx);
          }
      };

      int main() {
          std::println("[{:>6}] [{:<6}]", Couleur::rouge, Couleur::vert);
      }
      ```
    choices:
      - {text: "`[ rouge] [vert  ]`", correct: true}
      - {text: "`[rouge] [vert]`", correct: false}
      - {text: "`[rouge ] [  vert]`", correct: false}
      - {text: "`[     0] [1     ]`", correct: false}
    answer: "`[ rouge] [vert  ]` : le formateur hérite du `parse` des chaînes. La largeur 6 et l'alignement s'appliquent au nom de la couleur."
    check:
      output: "[ rouge] [vert  ]"
  - key: code-specification
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <>
      struct std::formatter<Point> {
          bool court = false;

          constexpr auto parse(std::format_parse_context& ctx) {
              auto it = ctx.begin();
              if (it != ctx.end() && *it == 'c') {
                  court = true;
                  ++it;
              }
              return it;
          }

          auto format(const Point& p, std::format_context& ctx) const {
              if (court) {
                  return std::format_to(ctx.out(), "{},{}", p.x, p.y);
              }
              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };

      int main() {
          const Point p{1, 2};
          std::println("{} {:c}", p, p);
      }
      ```
    choices:
      - {text: "`(1, 2) 1,2`", correct: true}
      - {text: "`(1, 2) (1, 2)`", correct: false}
      - {text: "`1,2 1,2`", correct: false}
      - {text: "`1,2 (1, 2)`", correct: false}
    answer: "`(1, 2) 1,2` : `parse` reconnaît le `c` de `{:c}` et le mémorise. Chaque champ a son propre formateur : le premier garde la forme longue."
    check:
      output: "(1, 2) 1,2"
  - key: code-format-taille
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>
      #include <string>

      struct Duree {
          int minutes;
      };

      template <>
      struct std::formatter<Duree> {
          constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
          auto format(const Duree& d, std::format_context& ctx) const {
              return std::format_to(ctx.out(), "{}h{:02}", d.minutes / 60, d.minutes % 60);
          }
      };

      int main() {
          const std::string texte = std::format("{}", Duree{125});
          std::println("{} {}", texte, texte.size());
      }
      ```
    choices:
      - {text: "`2h05 4`", correct: true}
      - {text: "`2h5 3`", correct: false}
      - {text: "`125 3`", correct: false}
      - {text: "`2h05 5`", correct: false}
    answer: "`2h05 4` : 125 minutes font 2 heures et 5 minutes ; `{:02}` complète les minutes par un zéro. La chaîne obtenue compte quatre caractères."
    check:
      output: "2h05 4"
  - key: bug-sans-formateur
    format: bug-fix
    question: |-
      Le compilateur refuse ce `println` : il ne sait pas formater un `Point`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          std::println("{}", Point{1, 2});
      }
      ```
    choices:
      - {text: "Spécialiser `std::formatter<Point>`, avec ses fonctions `parse` et `format`", correct: true}
      - {text: "Écrire le modèle `{:d}` à la place de `{}`", correct: false}
      - {text: "Déclarer `Point` avec `class` à la place de `struct`", correct: false}
      - {text: "Inclure l'en-tête `<string>` en plus de `<print>`", correct: false}
    answer: |-
      ```cpp
      template <>
      struct std::formatter<Point> {
          constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
          auto format(const Point& p, std::format_context& ctx) const {
              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };
      ```
      `std::format` ne devine pas comment afficher une `struct`. Sans spécialisation de `std::formatter`, le type
      n'est pas formatable.
  - key: bug-format-non-const
    format: bug-fix
    question: |-
      Le compilateur refuse ce programme : la fonction `format` du formateur ne peut pas être appelée. Quelle
      correction est la bonne ?
      ```cpp
      #include <format>
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <>
      struct std::formatter<Point> {
          constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
          auto format(const Point& p, std::format_context& ctx) {
              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };

      int main() {
          std::println("{}", Point{1, 2});
      }
      ```
    choices:
      - {text: "Déclarer `format` avec `const` après ses paramètres", correct: true}
      - {text: "Déclarer `format` avec `static` devant son type", correct: false}
      - {text: "Déclarer `format` avec `constexpr` devant son type", correct: false}
      - {text: "Déclarer `format` avec `virtual` devant son type", correct: false}
    answer: |-
      ```cpp
      auto format(const Point& p, std::format_context& ctx) const {
      ```
      La bibliothèque appelle `format` sur un formateur constant. La fonction doit donc être `const` : elle ne
      modifie pas l'état lu par `parse`.
  - key: bug-parse-manquant
    format: bug-fix
    question: |-
      Le compilateur refuse ce programme : le formateur est incomplet. Quelle correction est la bonne ?
      ```cpp
      #include <format>
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <>
      struct std::formatter<Point> {
          auto format(const Point& p, std::format_context& ctx) const {
              return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
          }
      };

      int main() {
          std::println("{}", Point{1, 2});
      }
      ```
    choices:
      - {text: "Ajouter une fonction `parse`, qui renvoie `ctx.begin()`", correct: true}
      - {text: "Ajouter une fonction `print`, qui appelle `format`", correct: false}
      - {text: "Ajouter une fonction `to_string` à la struct `Point`", correct: false}
      - {text: "Ajouter un constructeur par défaut à la struct `Point`", correct: false}
    answer: |-
      ```cpp
      constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
      ```
      Un formateur a deux fonctions : `parse` pour la spécification, `format` pour l'écriture. Même sans
      spécification à lire, `parse` doit exister.
  - key: bug-print-dans-format
    format: bug-fix
    question: |-
      Ce programme devrait afficher `point : (1, 2)`. Il affiche `(1, 2)point : `. Quelle correction est la bonne ?
      ```cpp
      #include <format>
      #include <print>

      struct Point {
          int x;
          int y;
      };

      template <>
      struct std::formatter<Point> {
          constexpr auto parse(std::format_parse_context& ctx) { return ctx.begin(); }
          auto format(const Point& p, std::format_context& ctx) const {
              std::print("({}, {})", p.x, p.y);
              return ctx.out();
          }
      };

      int main() {
          std::println("point : {}", Point{1, 2});
      }
      ```
    choices:
      - {text: "Écrire `return std::format_to(ctx.out(), \"({}, {})\", p.x, p.y);`", correct: true}
      - {text: "Écrire `std::println` à la place de `std::print` dans `format`", correct: false}
      - {text: "Écrire `return ctx.begin();` à la place de `return ctx.out();`", correct: false}
      - {text: "Écrire le modèle `{} : point` dans la fonction `main`", correct: false}
    answer: |-
      ```cpp
      return std::format_to(ctx.out(), "({}, {})", p.x, p.y);
      ```
      `format` doit écrire dans le texte en cours de construction, par `ctx.out()`. Avec `std::print`, le point part
      directement sur la sortie standard, avant le reste de la ligne, et il manquerait dans un `std::format`.
