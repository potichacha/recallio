notion: numeric-limits
lesson: |-
  Chaque type numérique a ses **bornes**. L'en-tête `<limits>` les donne par le template
  `std::numeric_limits<T>`, sans constante à retenir ni macro du C (`INT_MAX`, `DBL_MAX`).

  ```cpp
  #include <limits>

  std::numeric_limits<int>::max();          //  2147483647
  std::numeric_limits<int>::min();          // -2147483648
  std::numeric_limits<unsigned>::max();     //  4294967295
  ```

  **Les membres utiles.**

  | Membre | Entiers | Nombres à virgule |
  |---|---|---|
  | `max()` | la plus grande valeur | la plus grande valeur finie |
  | `lowest()` | la plus petite valeur | la plus négative : `-max()` |
  | `min()` | la plus petite valeur | **le plus petit nombre positif** normalisé |
  | `epsilon()` | 0 | l'écart entre 1 et le nombre suivant |
  | `infinity()`, `quiet_NaN()` | sans objet | l'infini, « pas un nombre » |
  | `is_signed`, `digits` | signé ? nombre de bits de valeur | idem, bits de mantisse |

  **Le piège de `min()`.** Pour un `double`, `min()` vaut environ `2.2e-308` : un nombre **positif** minuscule,
  pas le plus négatif. Pour « la plus petite valeur possible », quel que soit le type, on écrit **`lowest()`**.

  **Les valeurs spéciales des flottants.**

  - **L'infini** : résultat d'un dépassement, ou de `1.0 / 0.0`. Il se compare normalement.
  - **NaN** (*not a number*) : résultat d'une opération sans sens, comme `std::sqrt(-1.0)` ou `0.0 / 0.0`. Il
    n'est **égal à rien, pas même à lui-même** : `x == x` est faux. On le détecte avec **`std::isnan(x)`**.

  **`<cmath>` : l'essentiel.**

  | Fonction | Rôle |
  |---|---|
  | `std::abs(x)` | valeur absolue |
  | `std::sqrt(x)`, `std::pow(x, y)`, `std::hypot(x, y)` | racine, puissance, hypoténuse |
  | `std::floor(x)`, `std::ceil(x)` | arrondi vers le bas, vers le haut |
  | `std::round(x)` | au plus proche ; les demis s'éloignent de zéro |
  | `std::trunc(x)` | vers zéro : supprime les décimales |
  | `std::isnan(x)`, `std::isinf(x)`, `std::isfinite(x)` | tests sur les valeurs spéciales |

  Ces fonctions renvoient un **`double`**, même les arrondis : `std::round(2.5)` vaut `3.0`. Pour un entier, il
  existe `std::lround`, ou une conversion explicite.

  **Tester un débordement d'entier avant qu'il arrive.** Le débordement d'un entier signé est un comportement
  indéfini : on ne peut pas le constater **après** l'addition. On compare aux bornes **avant** :

  ```cpp
  if (a > std::numeric_limits<int>::max() - b) {
      // a + b déborderait (pour b positif)
  }
  ```

  **Comparer deux flottants.** Jamais avec `==` après un calcul : on teste que leur écart est petit devant leur
  grandeur. `epsilon()` donne l'ordre de grandeur de la précision relative, à multiplier par la taille des
  nombres comparés.

  **En entretien** : « `std::numeric_limits<T>` donne les bornes d'un type. Attention : pour un flottant, `min()`
  est le plus petit positif, c'est `lowest()` qui est le plus négatif. Un NaN n'est égal à rien : je teste avec
  `std::isnan`. Et un débordement d'entier se vérifie avant l'opération, pas après. »
cards:
  - key: role
    format: course
    question: "À quoi sert `std::numeric_limits<T>` ?"
    choices:
      - {text: "À connaître les bornes et les propriétés du type numérique `T`", correct: true}
      - {text: "À limiter les valeurs qu'une variable de type `T` peut recevoir", correct: false}
      - {text: "À arrondir une valeur de type `T` à un nombre de chiffres", correct: false}
      - {text: "À convertir une valeur de type `T` en chaîne de caractères", correct: false}
    answer: "`max()`, `min()`, `lowest()`, `epsilon()`, `is_signed`... Le template répond pour chaque type, sans macro du C."
  - key: min-flottant
    format: course
    question: "Que vaut `std::numeric_limits<double>::min()` ?"
    choices:
      - {text: "Le plus petit nombre positif normalisé, environ 2.2e-308", correct: true}
      - {text: "Le nombre le plus négatif, environ -1.8e308", correct: false}
      - {text: "Zéro", correct: false}
      - {text: "L'infini négatif", correct: false}
    answer: "Pour les flottants, `min()` est positif. La valeur la plus négative est `lowest()`, qui vaut `-max()`."
  - key: nan
    format: course
    question: "Comment teste-t-on qu'un `double` vaut NaN ?"
    choices:
      - {text: "Avec `std::isnan(x)` : un NaN n'est égal à rien, pas même à lui-même", correct: true}
      - {text: "Avec `x == std::numeric_limits<double>::quiet_NaN()`", correct: false}
      - {text: "Avec `x == 0.0`, puisqu'un NaN vaut zéro", correct: false}
      - {text: "Avec `x < 0.0`, puisqu'un NaN est négatif", correct: false}
    answer: "Toute comparaison avec un NaN est fausse, sauf `!=`. `x == NaN` ne peut donc jamais être vrai."
  - key: debordement
    format: course
    question: "Comment vérifie-t-on que `a + b` ne déborde pas, pour deux `int` positifs ?"
    choices:
      - {text: "Avant l'addition : `a <= std::numeric_limits<int>::max() - b`", correct: true}
      - {text: "Après l'addition : `a + b <= std::numeric_limits<int>::max()`", correct: false}
      - {text: "Après l'addition : `a + b >= a`", correct: false}
      - {text: "Avec un `try`/`catch` autour de l'addition", correct: false}
    answer: "Le débordement signé est un comportement indéfini : une fois l'addition faite, il est trop tard, et le compilateur peut supprimer un test écrit après."
  - key: vf-lowest
    format: true-false
    question: "Pour un `int`, `min()` et `lowest()` renvoient la même valeur."
    truth: true
    answer: "Ils ne diffèrent que pour les types à virgule, où `min()` est le plus petit nombre positif."
  - key: vf-nan-egal
    format: true-false
    question: "Si `x` vaut NaN, l'expression `x == x` est vraie."
    truth: false
    answer: "Un NaN n'est égal à aucune valeur, lui compris. C'est d'ailleurs un test possible, mais `std::isnan` est plus clair."
  - key: vf-round-type
    format: true-false
    question: "`std::round(2.5)` renvoie un `int`."
    truth: false
    answer: "Il renvoie un `double`, 3.0. Pour un entier : `std::lround`, ou un `static_cast`."
  - key: vf-epsilon
    format: true-false
    question: "`std::numeric_limits<double>::epsilon()` est l'écart entre 1.0 et le `double` suivant."
    truth: true
    answer: "Environ 2.2e-16. C'est la précision relative du type, pas le plus petit nombre représentable."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::numeric_limits` ?"
    choices:
      - {text: "`<limits>`", correct: true}
      - {text: "`<climits>`", correct: false}
      - {text: "`<cmath>`", correct: false}
      - {text: "`<numeric>`", correct: false}
    answer: "`<limits>` est l'en-tête du C++. `<climits>` ne contient que les macros héritées du C, comme `INT_MAX`."
  - key: qcm-trunc
    format: multiple-choice
    question: "Quelle fonction de `<cmath>` supprime les décimales, en arrondissant vers zéro ?"
    choices:
      - {text: "`std::trunc`", correct: true}
      - {text: "`std::floor`", correct: false}
      - {text: "`std::ceil`", correct: false}
      - {text: "`std::round`", correct: false}
    answer: "`std::trunc(-2.7)` vaut -2. `std::floor` descend à -3, `std::ceil` monte à -2, `std::round` va au plus proche, -3."
  - key: qcm-racine
    format: multiple-choice
    question: "Que renvoie `std::sqrt(-1.0)` ?"
    choices:
      - {text: "NaN", correct: true}
      - {text: "`-1.0`", correct: false}
      - {text: "`0.0`", correct: false}
      - {text: "Une exception `std::domain_error`", correct: false}
    answer: "Les fonctions de `<cmath>` ne lancent pas : une opération sans résultat réel donne NaN."
  - key: qcm-plus-negatif
    format: multiple-choice
    question: "Quelle expression donne la valeur la plus négative d'un `double` ?"
    choices:
      - {text: "`std::numeric_limits<double>::lowest()`", correct: true}
      - {text: "`std::numeric_limits<double>::min()`", correct: false}
      - {text: "`std::numeric_limits<double>::epsilon()`", correct: false}
      - {text: "`-std::numeric_limits<double>::min()`", correct: false}
    answer: "`lowest()` vaut `-max()`. `min()` est le plus petit positif, et son opposé un négatif minuscule."
  - key: trous-max
    format: fill-in
    question: |-
      Complète pour obtenir le plus grand `int` :
      ```cpp
      const int plus_grand = std::numeric_limits<int>::___();
      ```
    blanks:
      - [max]
    answer: "`max()` renvoie la plus grande valeur du type."
  - key: trous-lowest
    format: fill-in
    question: |-
      Complète pour initialiser la recherche d'un maximum avec la valeur la plus négative :
      ```cpp
      double maximum = std::numeric_limits<double>::___();
      ```
    blanks:
      - [lowest]
    answer: "`lowest()` est la plus petite valeur du type, pour les entiers comme pour les flottants."
  - key: trous-isnan
    format: fill-in
    question: |-
      Complète pour détecter un résultat qui n'est pas un nombre :
      ```cpp
      if (std::___(resultat)) {
          std::println("calcul impossible");
      }
      ```
    blanks:
      - [isnan]
    answer: "`std::isnan` est le test fiable : une comparaison avec `==` est toujours fausse."
  - key: trous-limits
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      const auto borne = std::numeric_limits<long>::max();
      ```
    blanks:
      - [limits]
    answer: "`std::numeric_limits` est déclaré dans `<limits>`."
  - key: code-entiers
    format: code-output
    question: |-
      ```cpp
      #include <limits>
      #include <print>

      int main() {
          std::println("{} {} {}", std::numeric_limits<int>::max(), std::numeric_limits<int>::min(),
                       std::numeric_limits<unsigned char>::max());
      }
      ```
    choices:
      - {text: "`2147483647 -2147483648 255`", correct: true}
      - {text: "`2147483647 -2147483647 255`", correct: false}
      - {text: "`2147483648 -2147483648 256`", correct: false}
      - {text: "`4294967295 0 255`", correct: false}
    answer: "`2147483647 -2147483648 255` : un `int` de 32 bits va de -2³¹ à 2³¹ - 1, avec une valeur négative de plus. Un octet non signé va jusqu'à 255."
    check:
      output: "2147483647 -2147483648 255"
  - key: code-min-lowest
    format: code-output
    question: |-
      ```cpp
      #include <limits>
      #include <print>

      int main() {
          const double petit = std::numeric_limits<double>::min();
          const double bas = std::numeric_limits<double>::lowest();
          std::println("{} {} {}", petit > 0.0, bas < 0.0, bas == -std::numeric_limits<double>::max());
      }
      ```
    choices:
      - {text: "`true true true`", correct: true}
      - {text: "`false true true`", correct: false}
      - {text: "`true true false`", correct: false}
      - {text: "`false false true`", correct: false}
    answer: "`true true true` : pour un `double`, `min()` est un positif minuscule. La valeur la plus négative est `lowest()`, l'opposé de `max()`."
    check:
      output: "true true true"
  - key: code-nan
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <limits>
      #include <print>

      int main() {
          const double rien = std::sqrt(-1.0);
          const double infini = std::numeric_limits<double>::infinity();
          std::println("{} {} {}", rien == rien, std::isnan(rien), infini > 1e300);
      }
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`false true true` : la racine d'un négatif est NaN, qui n'est pas égal à lui-même. L'infini, lui, se compare normalement : il dépasse tout nombre fini."
    check:
      output: "false true true"
  - key: code-arrondis
    format: code-output
    question: |-
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          const double x = -2.5;
          std::println("{} {} {} {}", std::floor(x), std::ceil(x), std::round(x), std::trunc(x));
      }
      ```
    choices:
      - {text: "`-3 -2 -3 -2`", correct: true}
      - {text: "`-3 -2 -2 -2`", correct: false}
      - {text: "`-2 -3 -3 -2`", correct: false}
      - {text: "`-3 -2 -3 -3`", correct: false}
    answer: "`-3 -2 -3 -2` : `floor` descend, `ceil` monte, `round` éloigne les demis de zéro, `trunc` supprime les décimales."
    check:
      output: "-3 -2 -3 -2"
  - key: bug-min-double
    format: bug-fix
    question: |-
      Ce programme cherche la plus grande température, et devrait afficher `-1.5`. Il affiche
      `2.2250738585072014e-308`. Quelle correction est la bonne ?
      ```cpp
      #include <limits>
      #include <print>
      #include <vector>

      int main() {
          const std::vector<double> temperatures{-8.0, -1.5, -12.0};
          double maximum = std::numeric_limits<double>::min();
          for (double t : temperatures) {
              if (t > maximum) {
                  maximum = t;
              }
          }
          std::println("{}", maximum);
      }
      ```
    choices:
      - {text: "Initialiser avec `std::numeric_limits<double>::lowest()`", correct: true}
      - {text: "Initialiser avec `std::numeric_limits<double>::epsilon()`", correct: false}
      - {text: "Initialiser avec `std::numeric_limits<double>::max()`", correct: false}
      - {text: "Initialiser avec `std::numeric_limits<int>::min()`, sans autre changement", correct: false}
    answer: |-
      ```cpp
      double maximum = std::numeric_limits<double>::lowest();
      ```
      Pour un `double`, `min()` est le plus petit nombre **positif** : aucune température négative ne le dépasse.
      `lowest()` est la valeur la plus négative. `std::max_element` éviterait l'initialisation.
  - key: bug-comparaison-nan
    format: bug-fix
    question: |-
      Ce programme devrait afficher `invalide` : la racine d'un nombre négatif n'existe pas. Il affiche `valide`.
      Quelle correction est la bonne ?
      ```cpp
      #include <cmath>
      #include <limits>
      #include <print>

      int main() {
          const double racine = std::sqrt(-4.0);
          if (racine == std::numeric_limits<double>::quiet_NaN()) {
              std::println("invalide");
          } else {
              std::println("valide");
          }
      }
      ```
    choices:
      - {text: "Tester `std::isnan(racine)`", correct: true}
      - {text: "Tester `racine == 0.0`", correct: false}
      - {text: "Tester `racine != racine + 1`", correct: false}
      - {text: "Tester `racine == -std::numeric_limits<double>::quiet_NaN()`", correct: false}
    answer: |-
      ```cpp
      if (std::isnan(racine)) {
      ```
      Un NaN n'est égal à rien, pas même à un autre NaN : la comparaison est toujours fausse. `std::isnan` est le
      test prévu pour cela.
  - key: bug-debordement-apres
    format: bug-fix
    question: |-
      Ce programme teste le débordement après l'addition. Sans optimisation, il affiche `débordement` par chance :
      son comportement est indéfini, et un compilateur qui optimise peut supprimer le test. Quelle correction est
      la bonne ?
      ```cpp
      #include <limits>
      #include <print>

      int main() {
          const int a = std::numeric_limits<int>::max();
          const int b = 1;
          const int somme = a + b;
          if (somme < a) {
              std::println("débordement");
          } else {
              std::println("{}", somme);
          }
      }
      ```
    choices:
      - {text: "Tester avant d'additionner : `if (a > std::numeric_limits<int>::max() - b)`", correct: true}
      - {text: "Tester après l'addition : `if (somme > std::numeric_limits<int>::max())`", correct: false}
      - {text: "Entourer l'addition d'un `try` et d'un `catch (const std::overflow_error&)`", correct: false}
      - {text: "Déclarer `somme` avec le mot-clé `volatile`", correct: false}
    answer: |-
      ```cpp
      if (a > std::numeric_limits<int>::max() - b) {
          std::println("débordement");
      }
      ```
      Le débordement d'un entier signé est un comportement indéfini, sans exception. Le compilateur peut supposer
      que `somme < a` est faux et supprimer le test. On compare aux bornes avant l'opération.
  - key: bug-racine-negative
    format: bug-fix
    question: |-
      Ce programme devrait afficher `racine impossible` pour un nombre négatif. Il affiche `-nan`. Quelle correction
      est la bonne ?
      ```cpp
      #include <cmath>
      #include <print>

      int main() {
          const double valeur = -9.0;
          std::println("{}", std::sqrt(valeur));
      }
      ```
    choices:
      - {text: "Tester `valeur < 0.0` avant d'appeler `std::sqrt`, et afficher le message", correct: true}
      - {text: "Entourer `std::sqrt` d'un `try`, et afficher le message dans le `catch`", correct: false}
      - {text: "Appeler `std::sqrt(std::round(valeur))` à la place", correct: false}
      - {text: "Déclarer `valeur` avec le type `float`", correct: false}
    answer: |-
      ```cpp
      if (valeur < 0.0) {
          std::println("racine impossible");
      } else {
          std::println("{}", std::sqrt(valeur));
      }
      ```
      Les fonctions de `<cmath>` ne lancent pas d'exception : hors de leur domaine, elles renvoient NaN, qui se
      propage ensuite dans tous les calculs. On vérifie l'argument avant, ou le résultat avec `std::isnan`.
