notion: fichiers-binaires
lesson: |-
  Un fichier **texte** contient des caractères lisibles : le nombre 1000 y occupe quatre octets, `1`, `0`, `0`,
  `0`. Un fichier **binaire** contient les octets **tels qu'ils sont en mémoire** : le même `int` y occupe quatre
  octets, quelle que soit sa valeur. C'est plus compact et plus rapide, mais illisible sans connaître le format.

  **Ouvrir en binaire.**

  ```cpp
  std::ofstream sortie{chemin, std::ios::binary};
  std::ifstream entree{chemin, std::ios::binary};
  ```

  Le drapeau `std::ios::binary` interdit toute transformation des octets. Sous Windows, sans lui, les fins de ligne
  sont converties, ce qui corrompt des données binaires. Sous Linux, il ne change rien, mais on l'écrit toujours.

  **`write` et `read`.** Les opérateurs `<<` et `>>` **formatent** du texte. Pour des octets bruts, on utilise :

  ```cpp
  int valeur = 1000;
  sortie.write(reinterpret_cast<const char*>(&valeur), sizeof(valeur));

  int relue = 0;
  entree.read(reinterpret_cast<char*>(&relue), sizeof(relue));
  ```

  Les deux prennent un **pointeur vers des `char`** et un **nombre d'octets**. D'où le `reinterpret_cast`, et le
  `sizeof`.

  **Vérifier la lecture.** Si le fichier contient moins d'octets que demandé, `read` lit ce qu'il peut et met le
  flux **en erreur**. `gcount()` donne le nombre d'octets réellement lus.

  ```cpp
  if (!entree.read(tampon, taille)) {
      // lecture incomplète : entree.gcount() octets seulement
  }
  ```

  **Un tableau d'un coup.** Les éléments d'un `std::vector` sont contigus :

  ```cpp
  sortie.write(reinterpret_cast<const char*>(v.data()), v.size() * sizeof(v[0]));
  ```

  Le nombre d'octets est `size() * sizeof(élément)`. `sizeof(v)` donnerait la taille de l'objet vecteur (24), pas
  celle de son contenu.

  **Se déplacer.** `seekg(position)` déplace la lecture, `tellg()` donne la position courante ; `seekp` et `tellp`
  font de même pour l'écriture. Cela permet l'accès direct à un enregistrement de taille fixe.

  **Ce qu'on peut écrire tel quel.** Seulement les types **trivialement copiables** : entiers, flottants, `struct`
  faites de tels champs. **Jamais** un objet qui contient un pointeur : écrire une `std::string` ou un
  `std::vector` ainsi enregistre l'adresse de leur tampon, pas leur contenu. Pour une chaîne, on écrit sa
  **longueur**, puis ses **caractères**.

  **Un format n'est pas portable par accident.** Un fichier écrit en copiant la mémoire dépend :

  - de la **taille** des types (`long` fait 4 ou 8 octets) : on utilise `std::int32_t`, `std::uint64_t` ;
  - du **boutisme** (*endianness*), l'ordre des octets d'un entier ;
  - du **remplissage** (*padding*) que le compilateur glisse entre les champs d'une `struct`.

  Un format destiné à durer se définit octet par octet, et se lit champ par champ.

  **En entretien** : « J'ouvre avec `std::ios::binary`, et j'utilise `write` et `read` avec un pointeur vers des
  `char` et un nombre d'octets. Je n'écris ainsi que des types trivialement copiables, jamais une `std::string`.
  Et je vérifie `read`, avec `gcount()`. Pour la portabilité : types de taille fixe, boutisme et remplissage. »
cards:
  - key: texte-ou-binaire
    format: course
    question: "Quelle différence entre écrire un `int` avec `<<` et avec `write` ?"
    choices:
      - {text: "`<<` écrit ses chiffres en texte ; `write` écrit ses octets tels qu'ils sont en mémoire", correct: true}
      - {text: "`<<` écrit ses octets tels qu'ils sont en mémoire ; `write` écrit ses chiffres en texte", correct: false}
      - {text: "`<<` écrit dans le fichier ; `write` écrit seulement dans le tampon du flux", correct: false}
      - {text: "Aucune : les deux produisent exactement le même fichier", correct: false}
    answer: "`fichier << 1000` écrit les quatre caractères `1000`. `write` écrit les quatre octets de la représentation de l'entier, quelle que soit sa valeur."
  - key: ios-binary
    format: course
    question: "À quoi sert le drapeau `std::ios::binary` à l'ouverture d'un fichier ?"
    choices:
      - {text: "À interdire toute transformation des octets, comme la conversion des fins de ligne", correct: true}
      - {text: "À compresser le fichier pendant l'écriture", correct: false}
      - {text: "À rendre le fichier illisible par les autres programmes", correct: false}
      - {text: "À faire écrire les nombres en base 2 par l'opérateur `<<`", correct: false}
    answer: "Sous Windows, le mode texte convertit `\\n` en deux octets, ce qui corrompt des données binaires. Le drapeau ne change pas ce que font `<<` et `>>`."
  - key: types-copiables
    format: course
    question: "Pourquoi ne peut-on pas écrire une `std::string` avec `write(reinterpret_cast<const char*>(&s), sizeof(s))` ?"
    choices:
      - {text: "L'objet contient un pointeur vers son texte : on enregistrerait une adresse, pas les caractères", correct: true}
      - {text: "`sizeof` d'une `std::string` vaut zéro : rien ne serait écrit dans le fichier", correct: false}
      - {text: "`write` refuse à la compilation tout objet qui n'est pas un entier", correct: false}
      - {text: "Une `std::string` ne peut être écrite que dans un fichier ouvert en mode texte", correct: false}
    answer: "Une adresse n'a plus de sens au lancement suivant. Seuls les types trivialement copiables s'écrivent octet par octet ; pour une chaîne, on écrit sa longueur puis ses caractères."
  - key: portabilite
    format: course
    question: "Qu'est-ce qui rend non portable un fichier écrit en copiant une `struct` telle qu'elle est en mémoire ?"
    choices:
      - {text: "La taille des types, l'ordre des octets et le remplissage dépendent de la plateforme", correct: true}
      - {text: "Le nom du fichier est enregistré dans ses premiers octets", correct: false}
      - {text: "Le compilateur chiffre les octets d'une `struct` avec une clé qui lui est propre", correct: false}
      - {text: "Le système refuse de relire un fichier binaire écrit par un autre programme", correct: false}
    answer: "Un `long` de 4 ou 8 octets, un processeur petit ou gros-boutiste, des octets de remplissage différents : la même `struct` ne donne pas les mêmes octets partout."
  - key: vf-gcount
    format: true-false
    question: "Après un `read`, `gcount()` donne le nombre d'octets réellement lus."
    truth: true
    answer: "S'il est inférieur au nombre demandé, la fin du fichier a été atteinte, et le flux est en erreur."
  - key: vf-linux
    format: true-false
    question: "Sous Linux, ouvrir sans `std::ios::binary` modifie les octets écrits par `write`."
    truth: false
    answer: "Sous Linux, les modes texte et binaire sont identiques. On écrit quand même le drapeau, pour que le code soit juste sous Windows."
  - key: vf-vector
    format: true-false
    question: "`sizeof(v)` donne le nombre d'octets occupés par les éléments du `std::vector` `v`."
    truth: false
    answer: "Il donne la taille de l'objet vecteur, 24 octets avec GCC. Le contenu fait `v.size() * sizeof(v[0])` octets."
  - key: vf-struct
    format: true-false
    question: "Une `struct` faite d'un `int` et d'un `double` peut être écrite avec `write`, sur la même machine qui la relira."
    truth: true
    answer: "Elle est trivialement copiable. Le fichier contient aussi ses octets de remplissage, et n'est relisible tel quel que par un programme compilé de la même façon."
  - key: qcm-lire
    format: multiple-choice
    question: "Quelle ligne lit quatre octets bruts dans l'entier `n` ?"
    choices:
      - {text: "`fichier.read(reinterpret_cast<char*>(&n), sizeof(n));`", correct: true}
      - {text: "`fichier >> std::ws >> n >> std::ws;`", correct: false}
      - {text: "`fichier.read(n, sizeof(int) * 4);`", correct: false}
      - {text: "`std::getline(fichier, n, sizeof(n));`", correct: false}
    answer: "`read` attend un `char*` et un nombre d'octets. `>>` lirait des chiffres en texte."
  - key: qcm-position
    format: multiple-choice
    question: "Quelle fonction déplace la position de lecture d'un `std::ifstream` ?"
    choices:
      - {text: "`seekg`", correct: true}
      - {text: "`tellg`", correct: false}
      - {text: "`seekp`", correct: false}
      - {text: "`gcount`", correct: false}
    answer: "`seekg` déplace la lecture (*get*), `seekp` l'écriture (*put*). `tellg` renvoie la position courante."
  - key: qcm-taille-fixe
    format: multiple-choice
    question: "Quel type choisis-tu pour un champ entier d'un format de fichier, afin que sa taille soit la même partout ?"
    choices:
      - {text: "`std::int32_t`", correct: true}
      - {text: "`long`", correct: false}
      - {text: "`int`", correct: false}
      - {text: "`std::size_t`", correct: false}
    answer: "Les types de `<cstdint>` ont une taille garantie. `long` fait 4 octets sous Windows et 8 sous Linux 64 bits."
  - key: qcm-chaine
    format: multiple-choice
    question: "Comment enregistres-tu une `std::string` dans un fichier binaire ?"
    choices:
      - {text: "Sa longueur d'abord, puis ses caractères avec `write(s.data(), s.size())`", correct: true}
      - {text: "L'objet lui-même, avec `write(reinterpret_cast<const char*>(&s), sizeof(s))`", correct: false}
      - {text: "Son adresse, avec `write(reinterpret_cast<const char*>(&s), 8)`", correct: false}
      - {text: "Sa capacité, avec `write(s.data(), s.capacity())`", correct: false}
    answer: "La longueur permet de savoir combien d'octets relire. Les caractères sont contigus derrière `data()`."
  - key: trous-binary
    format: fill-in
    question: |-
      Complète pour ouvrir le fichier sans transformation des octets :
      ```cpp
      std::ofstream sortie{chemin, std::ios::___};
      ```
    blanks:
      - [binary]
    answer: "`std::ios::binary` ouvre le fichier en mode binaire."
  - key: trous-write
    format: fill-in
    question: |-
      Complète pour écrire les octets de l'entier :
      ```cpp
      const int valeur = 1000;
      sortie.___(reinterpret_cast<const char*>(&valeur), sizeof(valeur));
      ```
    blanks:
      - [write]
    answer: "`write` écrit un nombre donné d'octets, à partir d'une adresse."
  - key: trous-gcount
    format: fill-in
    question: |-
      Complète pour connaître le nombre d'octets réellement lus :
      ```cpp
      entree.read(tampon, 100);
      const auto lus = entree.___();
      ```
    blanks:
      - [gcount]
    answer: "`gcount()` renvoie le nombre d'octets lus par la dernière lecture non formatée."
  - key: trous-sizeof
    format: fill-in
    question: |-
      Complète pour écrire tous les éléments du vecteur d'entiers :
      ```cpp
      sortie.write(reinterpret_cast<const char*>(v.data()), v.size() * ___(int));
      ```
    blanks:
      - [sizeof]
    answer: "Le nombre d'octets est le nombre d'éléments multiplié par la taille d'un élément."
  - key: code-entiers
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_entiers.bin";
          const int valeurs[3] = {1, 2, 3};
          {
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write(reinterpret_cast<const char*>(valeurs), sizeof(valeurs));
          }
          int relues[3] = {};
          std::ifstream entree{chemin, std::ios::binary};
          entree.read(reinterpret_cast<char*>(relues), sizeof(relues));
          std::println("{} {}", std::filesystem::file_size(chemin), relues[1]);
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`12 2`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`6 2`", correct: false}
      - {text: "`12 0`", correct: false}
    answer: "`12 2` : trois `int` de quatre octets font douze octets, quelle que soit leur valeur. Relus tels quels, ils redonnent le tableau."
    check:
      output: "12 2"
  - key: code-gcount
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_court.bin";
          {
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write("abcde", 5);
          }
          char tampon[8] = {};
          std::ifstream entree{chemin, std::ios::binary};
          entree.read(tampon, 8);
          std::println("{} {}", entree.gcount(), entree.fail());
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`5 true`", correct: true}
      - {text: "`8 false`", correct: false}
      - {text: "`5 false`", correct: false}
      - {text: "`0 true`", correct: false}
    answer: "`5 true` : le fichier n'a que cinq octets. `read` les lit, puis échoue faute d'en trouver huit ; `gcount()` dit combien ont été lus."
    check:
      output: "5 true"
  - key: code-seekg
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_lettres.bin";
          {
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write("abcdef", 6);
          }
          std::ifstream entree{chemin, std::ios::binary};
          entree.seekg(2);
          char lettre = '?';
          entree.read(&lettre, 1);
          std::println("{} {}", lettre, static_cast<int>(entree.tellg()));
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`c 3`", correct: true}
      - {text: "`b 2`", correct: false}
      - {text: "`c 2`", correct: false}
      - {text: "`a 1`", correct: false}
    answer: "`c 3` : `seekg(2)` place la lecture sur le troisième octet, `c`. Après l'avoir lu, la position vaut 3."
    check:
      output: "c 3"
  - key: code-struct
    format: code-output
    question: |-
      Sur Linux x86-64 :
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      struct Mesure {
          int capteur;
          double valeur;
      };

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_mesure.bin";
          {
              const Mesure mesure{7, 2.5};
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write(reinterpret_cast<const char*>(&mesure), sizeof(mesure));
          }
          Mesure relue{};
          std::ifstream entree{chemin, std::ios::binary};
          entree.read(reinterpret_cast<char*>(&relue), sizeof(relue));
          std::println("{} {} {}", relue.capteur, relue.valeur, std::filesystem::file_size(chemin));
          entree.close();
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "`7 2.5 16`", correct: true}
      - {text: "`7 2.5 12`", correct: false}
      - {text: "`7 2.5 8`", correct: false}
      - {text: "`0 0 16`", correct: false}
    answer: "`7 2.5 16` : la `struct` occupe 16 octets, dont quatre de remplissage après l'`int`. Le fichier les contient aussi."
    check:
      output: "7 2.5 16"
  - key: bug-operateur-texte
    format: bug-fix
    question: |-
      Ce programme devrait écrire les quatre octets de l'entier, et afficher `4`. Il affiche `2`. Quelle correction
      est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_texte.bin";
          {
              const int valeur = 42;
              std::ofstream sortie{chemin, std::ios::binary};
              sortie << valeur;
          }
          std::println("{}", std::filesystem::file_size(chemin));
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Écrire `sortie.write(reinterpret_cast<const char*>(&valeur), sizeof(valeur));`", correct: true}
      - {text: "Écrire `sortie << std::hex << valeur;` à la place de `sortie << valeur;`", correct: false}
      - {text: "Écrire `sortie.put(valeur);` à la place de `sortie << valeur;`", correct: false}
      - {text: "Ouvrir le fichier sans le drapeau `std::ios::binary`", correct: false}
    answer: |-
      ```cpp
      sortie.write(reinterpret_cast<const char*>(&valeur), sizeof(valeur));
      ```
      Même sur un fichier ouvert en binaire, `<<` formate du texte : les deux caractères `4` et `2`. Les octets de
      l'entier s'écrivent avec `write`.
  - key: bug-lecture-non-verifiee
    format: bug-fix
    question: |-
      Le fichier n'existe pas. Ce programme devrait afficher `lecture impossible` ; il affiche `99`, la valeur
      initiale. Quelle correction est la bonne ?
      ```cpp
      #include <fstream>
      #include <print>

      int main() {
          std::ifstream entree{"/dossier/absent/mesure.bin", std::ios::binary};
          int valeur = 99;
          entree.read(reinterpret_cast<char*>(&valeur), sizeof(valeur));
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "Tester le résultat : `if (!entree.read(...))`, et signaler l'erreur", correct: true}
      - {text: "Initialiser `valeur` à 0, pour qu'un échec donne zéro", correct: false}
      - {text: "Appeler `entree.clear();` avant la lecture", correct: false}
      - {text: "Lire avec `sizeof(int*)` à la place de `sizeof(valeur)`", correct: false}
    answer: |-
      ```cpp
      if (!entree.read(reinterpret_cast<char*>(&valeur), sizeof(valeur))) {
          std::println("lecture impossible");
      } else {
          std::println("{}", valeur);
      }
      ```
      Sur un flux en erreur, `read` ne fait rien : la variable garde sa valeur. Seul l'état du flux dit si les
      octets ont été lus.
  - key: bug-sizeof-pointeur
    format: bug-fix
    question: |-
      Ce programme devrait écrire les trois entiers du vecteur, et afficher `12`. Il affiche `8`. Quelle correction
      est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <vector>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_taille.bin";
          {
              const std::vector<int> valeurs{1, 2, 3};
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write(reinterpret_cast<const char*>(valeurs.data()), sizeof(valeurs.data()));
          }
          std::println("{}", std::filesystem::file_size(chemin));
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Passer `valeurs.size() * sizeof(int)` comme nombre d'octets", correct: true}
      - {text: "Passer `sizeof(valeurs)` comme nombre d'octets", correct: false}
      - {text: "Passer `valeurs.size()` comme nombre d'octets", correct: false}
      - {text: "Passer `valeurs.capacity()` comme nombre d'octets", correct: false}
    answer: |-
      ```cpp
      sortie.write(reinterpret_cast<const char*>(valeurs.data()), valeurs.size() * sizeof(int));
      ```
      `sizeof(valeurs.data())` est la taille d'un pointeur : 8 octets. Il faut le nombre d'éléments multiplié par la
      taille d'un élément. `sizeof(valeurs)` donnerait 24, la taille de l'objet vecteur.
  - key: bug-string-brute
    format: bug-fix
    question: |-
      Ce programme enregistre un objet `std::string` tel quel. Le fichier fait 32 octets, et ne contient pas le
      texte : il ne pourra pas être relu. Quelle correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>
      #include <string>

      int main() {
          const auto chemin = std::filesystem::temp_directory_path() / "recallio_bug_chaine.bin";
          {
              const std::string nom = "Ada Lovelace, première programmeuse de l'histoire";
              std::ofstream sortie{chemin, std::ios::binary};
              sortie.write(reinterpret_cast<const char*>(&nom), sizeof(nom));
          }
          std::println("{}", std::filesystem::file_size(chemin));
          std::filesystem::remove(chemin);
      }
      ```
    choices:
      - {text: "Écrire la longueur, puis les caractères : `sortie.write(nom.data(), nom.size())`", correct: true}
      - {text: "Écrire l'objet avec `sizeof(std::string*)` comme nombre d'octets", correct: false}
      - {text: "Déclarer `nom` sans `const`, pour que l'objet puisse être relu", correct: false}
      - {text: "Ouvrir le fichier en mode texte, sans `std::ios::binary`", correct: false}
    answer: |-
      ```cpp
      const std::uint32_t longueur = static_cast<std::uint32_t>(nom.size());
      sortie.write(reinterpret_cast<const char*>(&longueur), sizeof(longueur));
      sortie.write(nom.data(), nom.size());
      ```
      Le fichier fait 32 octets : ceux de l'objet, dont un pointeur vers le texte, resté sur le tas. Relu plus tard,
      ce pointeur ne désigne plus rien. On enregistre le contenu, pas l'objet.
