notion: stringstream
lesson: |-
  L'en-tête `<sstream>` fournit des flux qui lisent et écrivent **dans une chaîne**, au lieu de la console ou d'un
  fichier. On y retrouve `<<`, `>>` et `std::getline`, avec les mêmes règles que pour `std::cin` et `std::cout`.

  | Type | Sens | Usage |
  |---|---|---|
  | `std::istringstream` | lecture | **découper** un texte, le convertir en nombres |
  | `std::ostringstream` | écriture | **construire** une chaîne morceau par morceau |
  | `std::stringstream` | les deux | plus rarement utile |

  **Découper un texte.**

  ```cpp
  std::istringstream flux{"12 7 30"};
  int valeur = 0;
  while (flux >> valeur) {
      // 12, puis 7, puis 30
  }
  ```

  `>>` saute les espaces, lit un mot et le convertit. La boucle s'arrête quand la lecture **échoue** : fin du texte,
  ou mot qui n'est pas un nombre.

  **Découper selon un séparateur.** `std::getline` accepte un troisième argument :

  ```cpp
  std::istringstream flux{"ada,grace,alan"};
  std::string nom;
  while (std::getline(flux, nom, ',')) {
      // "ada", "grace", "alan"
  }
  ```

  **Construire une chaîne.**

  ```cpp
  std::ostringstream flux;
  flux << "x = " << 3 << ", y = " << 2.5;
  std::string texte = flux.str();      // "x = 3, y = 2.5"
  ```

  `str()` renvoie une **copie** du contenu ; `str("nouveau")` le remplace.

  **Les états du flux.** Comme tout flux, il porte des drapeaux :

  - `failbit` après une conversion ratée (`"abc"` lu dans un `int`) ;
  - `eofbit` quand la fin est atteinte.

  Tant qu'un drapeau d'erreur est levé, **toutes les lectures suivantes échouent**. D'où deux pièges :

  - **`clear()` ne vide pas le contenu** : il remet les **drapeaux** à zéro. Pour vider le texte, c'est `str("")`.
  - Pour **réutiliser** un flux arrivé en fin de texte, il faut les deux : `flux.clear(); flux.str("suite");`.

  **`>>` s'arrête à l'espace.** Lire un `std::string` avec `>>` ne donne qu'**un mot**. Pour une ligne entière,
  `std::getline`.

  **Aujourd'hui.** Pour **construire** un texte, `std::format` est plus lisible et plus rapide qu'un
  `std::ostringstream`. Pour **convertir** un nombre, `std::from_chars` et `std::stoi` sont plus directs. Les flux
  de chaîne restent pratiques pour **découper** un texte simple, et pour réutiliser un `operator<<` ou un
  `operator>>` déjà écrits.

  **En entretien** : « `std::istringstream` me sert à découper un texte avec `>>` ou `getline` et un séparateur ;
  `std::ostringstream` à assembler une chaîne, même si `std::format` le remplace souvent. Le piège : `clear()`
  remet les drapeaux à zéro, c'est `str("")` qui vide le contenu. »
cards:
  - key: role
    format: course
    question: "À quoi sert un `std::istringstream` ?"
    choices:
      - {text: "À lire dans une chaîne avec `>>` et `getline`, comme on lirait `std::cin`", correct: true}
      - {text: "À écrire dans une chaîne avec `<<`, comme on écrirait dans `std::cout`", correct: false}
      - {text: "À lire un fichier ligne par ligne, sans l'ouvrir", correct: false}
      - {text: "À convertir une chaîne en majuscules", correct: false}
    answer: "C'est un flux d'entrée dont la source est une chaîne. On s'en sert pour découper un texte et convertir ses morceaux."
  - key: clear
    format: course
    question: "Que fait `flux.clear()` sur un flux de chaîne ?"
    choices:
      - {text: "Il remet à zéro les drapeaux d'erreur, sans toucher au contenu", correct: true}
      - {text: "Il vide le contenu, sans toucher aux drapeaux d'erreur", correct: false}
      - {text: "Il vide le contenu et remet les drapeaux à zéro", correct: false}
      - {text: "Il ferme le flux, qui ne peut plus servir", correct: false}
    answer: "Le nom est trompeur. Pour vider le texte, on écrit `flux.str(\"\")`."
  - key: echec
    format: course
    question: "Que se passe-t-il quand `flux >> n` rencontre le mot `abc`, pour un `int n` ?"
    choices:
      - {text: "La lecture échoue : le flux passe en erreur, et les lectures suivantes échouent aussi", correct: true}
      - {text: "Le mot est sauté, et la lecture continue avec le mot suivant", correct: false}
      - {text: "Une exception `std::invalid_argument` est lancée", correct: false}
      - {text: "Le programme s'arrête avec une erreur de segmentation", correct: false}
    answer: "Le drapeau `failbit` est levé, et l'expression vaut `false`. Tant qu'on n'appelle pas `clear()`, plus rien ne se lit."
  - key: getline-separateur
    format: course
    question: "Comment découpes-tu `\"ada,grace,alan\"` selon les virgules, avec un flux de chaîne ?"
    choices:
      - {text: "Avec `std::getline(flux, nom, ',')`, dans une boucle", correct: true}
      - {text: "Avec `flux >> nom`, qui s'arrête aux virgules", correct: false}
      - {text: "Avec `flux.split(',')`, qui renvoie un vecteur", correct: false}
      - {text: "Avec `flux.str(',')`, qui change le séparateur", correct: false}
    answer: "Le troisième argument de `getline` est le caractère d'arrêt. `>>` ne s'arrête qu'aux espaces."
  - key: vf-str-copie
    format: true-false
    question: "`flux.str()` renvoie une copie du contenu du flux."
    truth: true
    answer: "Modifier la chaîne obtenue ne change pas le flux. Pour remplacer le contenu, on appelle `str(nouveau)`."
  - key: vf-espace
    format: true-false
    question: "`flux >> mot`, avec un `std::string mot`, lit jusqu'à la fin de la ligne."
    truth: false
    answer: "Il lit un seul mot, jusqu'au premier espace. Pour la ligne entière, on prend `std::getline`."
  - key: vf-en-tete
    format: true-false
    question: "Les flux de chaîne sont déclarés dans l'en-tête `<sstream>`."
    truth: true
    answer: "`<sstream>` déclare `std::istringstream`, `std::ostringstream` et `std::stringstream`."
  - key: vf-clear-vide
    format: true-false
    question: "Après `flux.clear()`, `flux.str()` renvoie une chaîne vide."
    truth: false
    answer: "`clear()` ne touche qu'aux drapeaux d'état. Le contenu est intact."
  - key: qcm-construire
    format: multiple-choice
    question: "Quel type de flux sert à assembler une chaîne avec `<<` ?"
    choices:
      - {text: "`std::ostringstream`", correct: true}
      - {text: "`std::istringstream`", correct: false}
      - {text: "`std::ifstream`", correct: false}
      - {text: "`std::string_view`", correct: false}
    answer: "Le « o » de `ostringstream` veut dire sortie : on y écrit. On récupère le résultat avec `str()`."
  - key: qcm-vider
    format: multiple-choice
    question: "Quelle ligne vide le contenu d'un flux de chaîne ?"
    choices:
      - {text: "`flux.str(\"\");`", correct: true}
      - {text: "`flux.clear();`", correct: false}
      - {text: "`flux.erase();`", correct: false}
      - {text: "`flux.flush();`", correct: false}
    answer: "`str(\"\")` remplace le contenu par une chaîne vide. `flush` vide un tampon de sortie, ce qui n'a pas de sens ici."
  - key: qcm-alternative
    format: multiple-choice
    question: "Pour assembler `\"x = 3, y = 2.5\"` à partir de deux variables, quelle solution est la plus lisible en C++20 ?"
    choices:
      - {text: "`std::format(\"x = {}, y = {}\", x, y)`", correct: true}
      - {text: "Un `std::ostringstream` et quatre opérateurs `<<`", correct: false}
      - {text: "Un `std::istringstream` et deux opérateurs `>>`", correct: false}
      - {text: "Deux appels à `std::getline`", correct: false}
    answer: "`std::format` montre le texte final d'un coup d'œil, et il est plus rapide. Le flux de chaîne reste utile quand un `operator<<` existe déjà pour le type."
  - key: qcm-boucle
    format: multiple-choice
    question: "Quelle boucle lit tous les entiers d'un `std::istringstream flux` ?"
    choices:
      - {text: "`while (flux >> n) { ... }`", correct: true}
      - {text: "`while (!flux.eof()) { flux >> n; ... }`", correct: false}
      - {text: "`while (flux.str() != \"\") { flux >> n; ... }`", correct: false}
      - {text: "`while (flux.clear()) { flux >> n; ... }`", correct: false}
    answer: "La lecture elle-même sert de condition : elle est fausse dès qu'elle échoue. Tester `eof()` avant de lire traite une valeur de trop."
  - key: trous-istringstream
    format: fill-in
    question: |-
      Complète le type du flux qui lit dans la chaîne :
      ```cpp
      std::___ flux{"12 7 30"};
      int valeur = 0;
      flux >> valeur;
      ```
    blanks:
      - [istringstream, stringstream]
    answer: "`std::istringstream` lit dans une chaîne. `std::stringstream` convient aussi."
  - key: trous-str
    format: fill-in
    question: |-
      Complète pour récupérer la chaîne construite :
      ```cpp
      std::ostringstream flux;
      flux << "total : " << 42;
      const std::string texte = flux.___();
      ```
    blanks:
      - [str]
    answer: "`str()` renvoie une copie du contenu du flux."
  - key: trous-getline
    format: fill-in
    question: |-
      Complète pour lire jusqu'à la prochaine virgule :
      ```cpp
      std::istringstream flux{"ada,grace"};
      std::string nom;
      std::___(flux, nom, ',');
      ```
    blanks:
      - [getline]
    answer: "`std::getline` lit jusqu'au séparateur donné, qu'il retire du flux."
  - key: trous-clear
    format: fill-in
    question: |-
      Complète pour pouvoir relire après une lecture ratée :
      ```cpp
      flux >> nombre;      // échoue
      flux.___();
      flux >> mot;
      ```
    blanks:
      - [clear]
    answer: "`clear()` remet les drapeaux d'erreur à zéro : le flux accepte de nouveau les lectures."
  - key: code-ostringstream
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::ostringstream flux;
          flux << "x=" << 3 << ' ' << 2.5;
          const std::string texte = flux.str();
          std::println("{} {}", texte, texte.size());
      }
      ```
    choices:
      - {text: "`x=3 2.5 7`", correct: true}
      - {text: "`x=32.5 6`", correct: false}
      - {text: "`x=3 2.5 3`", correct: false}
      - {text: "`x= 3 2.5 8`", correct: false}
    answer: "`x=3 2.5 7` : chaque `<<` ajoute son texte à la suite. La chaîne `x=3 2.5` compte sept caractères."
    check:
      output: "x=3 2.5 7"
  - key: code-lecture
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream flux{"10 20 trente 40"};
          int somme = 0;
          int valeur = 0;
          while (flux >> valeur) {
              somme += valeur;
          }
          std::println("{} {}", somme, flux.fail());
      }
      ```
    choices:
      - {text: "`30 true`", correct: true}
      - {text: "`70 false`", correct: false}
      - {text: "`70 true`", correct: false}
      - {text: "`30 false`", correct: false}
    answer: "`30 true` : 10 et 20 sont lus, puis `trente` fait échouer la conversion. La boucle s'arrête : 40 n'est jamais lu, et le flux reste en erreur."
    check:
      output: "30 true"
  - key: code-getline
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"a,b,,c"};
          std::string morceau;
          int morceaux = 0;
          int vides = 0;
          while (std::getline(flux, morceau, ',')) {
              ++morceaux;
              if (morceau.empty()) {
                  ++vides;
              }
          }
          std::println("{} {}", morceaux, vides);
      }
      ```
    choices:
      - {text: "`4 1`", correct: true}
      - {text: "`3 0`", correct: false}
      - {text: "`4 0`", correct: false}
      - {text: "`3 1`", correct: false}
    answer: "`4 1` : deux virgules qui se suivent délimitent un morceau vide, que `getline` rend comme les autres. Il y a quatre morceaux."
    check:
      output: "4 1"
  - key: code-reutiliser
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream flux{"5"};
          int a = 0;
          int b = 0;
          flux >> a;
          flux.clear();
          flux.str("7");
          flux >> b;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`5 7`", correct: true}
      - {text: "`5 0`", correct: false}
      - {text: "`5 5`", correct: false}
      - {text: "`7 7`", correct: false}
    answer: "`5 7` : la première lecture atteint la fin du texte. `clear()` efface ce drapeau, `str(\"7\")` remplace le contenu : la seconde lecture réussit."
    check:
      output: "5 7"
  - key: bug-clear-pour-vider
    format: bug-fix
    question: |-
      Ce programme devrait afficher `b`. Il affiche `ab` : le flux n'a pas été vidé. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::ostringstream flux;
          flux << "a";
          flux.clear();
          flux << "b";
          std::println("{}", flux.str());
      }
      ```
    choices:
      - {text: "Écrire `flux.str(\"\");` à la place de `flux.clear();`", correct: true}
      - {text: "Écrire `flux.flush();` à la place de `flux.clear();`", correct: false}
      - {text: "Écrire `flux.clear();` deux fois de suite", correct: false}
      - {text: "Écrire `flux << \"\";` à la place de `flux.clear();`", correct: false}
    answer: |-
      ```cpp
      flux.str("");
      ```
      `clear()` remet les drapeaux d'erreur à zéro, pas le contenu. C'est `str("")` qui remplace le texte par une
      chaîne vide.
  - key: bug-reutilisation-sans-clear
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5 7`. Il affiche `5 0` : la seconde lecture échoue. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream flux{"5"};
          int a = 0;
          int b = 0;
          flux >> a;
          flux.str("7");
          flux >> b;
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "Appeler `flux.clear();` avant la seconde lecture", correct: true}
      - {text: "Appeler `flux.str(\"\");` avant `flux.str(\"7\");`", correct: false}
      - {text: "Appeler `flux.flush();` avant la seconde lecture", correct: false}
      - {text: "Déclarer `b` avec le type `long`", correct: false}
    answer: |-
      ```cpp
      flux.clear();
      flux.str("7");
      flux >> b;
      ```
      La première lecture a atteint la fin du texte : le drapeau de fin est levé, et `str` ne l'efface pas. Tant
      qu'il est là, toute lecture échoue.
  - key: bug-lecture-non-testee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `saisie invalide`. Il affiche `0`, comme si la saisie valait zéro. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>

      int main() {
          std::istringstream saisie{"abc"};
          int age = -1;
          saisie >> age;
          std::println("{}", age);
      }
      ```
    choices:
      - {text: "Tester la lecture : `if (saisie >> age)`, et signaler l'erreur sinon", correct: true}
      - {text: "Tester la valeur : `if (age == -1)`, et signaler l'erreur dans ce cas", correct: false}
      - {text: "Appeler `saisie.clear();` avant la lecture de `age`", correct: false}
      - {text: "Déclarer `age` avec le type `std::string`", correct: false}
    answer: |-
      ```cpp
      if (saisie >> age) {
          std::println("{}", age);
      } else {
          std::println("saisie invalide");
      }
      ```
      Depuis C++11, une conversion ratée écrit 0 dans la variable : la valeur initiale -1 ne sert pas de témoin.
      Seul l'état du flux dit si la lecture a réussi.
  - key: bug-un-seul-mot
    format: bug-fix
    question: |-
      Ce programme lit un nom dans un flux de chaîne, et devrait afficher `Ada Lovelace`. Il n'affiche que `Ada`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <sstream>
      #include <string>

      int main() {
          std::istringstream flux{"Ada Lovelace"};
          std::string nom;
          flux >> nom;
          std::println("{}", nom);
      }
      ```
    choices:
      - {text: "Lire avec `std::getline(flux, nom);`", correct: true}
      - {text: "Lire avec `flux >> nom >> nom;`", correct: false}
      - {text: "Lire avec `flux.str(nom);`", correct: false}
      - {text: "Lire avec `flux << nom;`", correct: false}
    answer: |-
      ```cpp
      std::getline(flux, nom);
      ```
      `>>` s'arrête au premier espace : il ne lit qu'un mot. `std::getline` lit jusqu'à la fin de la ligne, espaces
      compris.
