notion: regex
lesson: |-
  L'en-tête `<regex>` fournit les **expressions régulières** : un petit langage pour décrire la forme d'un texte
  (« quatre chiffres, un tiret, deux chiffres »), puis le vérifier, l'extraire ou le remplacer.

  **Construire le motif.**

  ```cpp
  #include <regex>

  const std::regex date{R"((\d{4})-(\d{2})-(\d{2}))"};
  ```

  On écrit le motif dans un **littéral brut** `R"(...)"` : les barres obliques inverses y sont prises telles
  quelles. Dans un littéral ordinaire, il faudrait les doubler : `"\\d{4}"`. La syntaxe par défaut est celle
  d'ECMAScript (JavaScript).

  **Les trois fonctions.**

  | Fonction | Question posée |
  |---|---|
  | `std::regex_match(texte, motif)` | le texte **entier** correspond-il au motif ? |
  | `std::regex_search(texte, motif)` | le motif apparaît-il **quelque part** dans le texte ? |
  | `std::regex_replace(texte, motif, remplacement)` | renvoie le texte où chaque occurrence est remplacée |

  La confusion entre `regex_match` et `regex_search` est l'erreur classique : `regex_match("abc123", chiffres)` est
  faux, puisque le texte ne se réduit pas à des chiffres.

  **Récupérer les groupes.** Les parenthèses du motif délimitent des **groupes**. On passe un `std::smatch` pour
  les lire :

  ```cpp
  const std::string texte = "2024-05-17";
  std::smatch groupes;
  if (std::regex_match(texte, groupes, date)) {
      groupes[0].str();    // "2024-05-17" : la correspondance entière
      groupes[1].str();    // "2024"
      groupes.size();      // 4 : la correspondance entière, plus trois groupes
  }
  ```

  Un `std::smatch` garde des **itérateurs dans la chaîne** d'origine : celle-ci doit lui survivre. La bibliothèque
  refuse d'ailleurs de compiler un appel avec une chaîne temporaire.

  **Parcourir toutes les occurrences.** `std::sregex_iterator` avance d'une correspondance à la suivante.

  ```cpp
  for (std::sregex_iterator it{texte.begin(), texte.end(), mot}, fin; it != fin; ++it) {
      std::println("{}", it->str());
  }
  ```

  **Les erreurs.** Un motif mal formé n'est **pas** détecté à la compilation : le constructeur de `std::regex`
  lance `std::regex_error` à l'exécution.

  **Le coût.** `std::regex` est connue pour sa lenteur.

  - **Construire** un motif est cher : on le fait **une fois**, pas dans une boucle.
  - Pour un besoin simple, `find`, `starts_with` ou `std::from_chars` sont bien plus rapides.
  - Pour un traitement intensif, on prend une bibliothèque spécialisée (RE2, CTRE, PCRE2).

  **En entretien** : « `regex_match` exige que tout le texte corresponde, `regex_search` cherche une occurrence.
  J'écris le motif dans un littéral brut, je lis les groupes dans un `std::smatch`, et je construis le
  `std::regex` une seule fois, car c'est coûteux, et un motif invalide lance `std::regex_error` à l'exécution. »
cards:
  - key: match-ou-search
    format: course
    question: "Quelle différence entre `std::regex_match` et `std::regex_search` ?"
    choices:
      - {text: "`regex_match` exige que tout le texte corresponde ; `regex_search` cherche une occurrence", correct: true}
      - {text: "`regex_match` cherche une occurrence ; `regex_search` exige que tout le texte corresponde", correct: false}
      - {text: "`regex_match` renvoie un booléen ; `regex_search` renvoie la position trouvée", correct: false}
      - {text: "`regex_match` ignore la casse ; `regex_search` en tient compte", correct: false}
    answer: "Les deux renvoient un booléen. Pour valider une saisie entière, c'est `regex_match` ; pour trouver un motif dans un texte, `regex_search`."
  - key: litteral-brut
    format: course
    question: "Pourquoi écrit-on un motif dans un littéral brut `R\"(...)\"` ?"
    choices:
      - {text: "Pour ne pas avoir à doubler chaque barre oblique inverse du motif", correct: true}
      - {text: "Pour que le motif soit vérifié par le compilateur", correct: false}
      - {text: "Pour que la recherche soit plus rapide à l'exécution", correct: false}
      - {text: "Pour que le motif accepte les caractères accentués", correct: false}
    answer: "Dans un littéral ordinaire, `\\d` est une séquence d'échappement du C++, à écrire `\\\\d`. Le littéral brut prend chaque caractère tel quel."
  - key: groupes
    format: course
    question: "Que contient `groupes[0]`, dans un `std::smatch` rempli par une recherche réussie ?"
    choices:
      - {text: "La correspondance entière ; les groupes entre parenthèses commencent à l'indice 1", correct: true}
      - {text: "Le premier groupe entre parenthèses du motif ; le suivant est à l'indice 1", correct: false}
      - {text: "Le texte qui précède la correspondance ; celle-ci est à l'indice 1", correct: false}
      - {text: "Le motif lui-même, sous forme de chaîne ; les groupes suivent", correct: false}
    answer: "L'indice 0 désigne tout ce que le motif a reconnu. `groupes.size()` vaut donc le nombre de groupes plus un."
  - key: erreur
    format: course
    question: "Quand un motif mal formé, comme `\"(abc\"`, est-il détecté ?"
    choices:
      - {text: "À l'exécution : le constructeur de `std::regex` lance `std::regex_error`", correct: true}
      - {text: "À la compilation : le compilateur refuse le motif", correct: false}
      - {text: "À l'édition de liens : le motif est introuvable", correct: false}
      - {text: "Jamais : le motif ne correspond simplement à rien", correct: false}
    answer: "Le motif est une chaîne ordinaire, analysée quand l'objet est construit. Un motif fautif n'apparaît donc qu'en exécutant ce code."
  - key: vf-match-partiel
    format: true-false
    question: "`std::regex_match(\"abc123\", std::regex{R\"(\\d+)\"})` renvoie `true`."
    truth: false
    answer: "Le texte entier doit correspondre, et « abc » n'est pas fait de chiffres. `std::regex_search` renverrait `true`."
  - key: vf-construction
    format: true-false
    question: "Construire un objet `std::regex` est une opération coûteuse."
    truth: true
    answer: "Le motif est analysé et compilé en automate. On construit l'objet une fois, hors des boucles."
  - key: vf-compilation
    format: true-false
    question: "Le compilateur vérifie la syntaxe du motif passé à `std::regex`."
    truth: false
    answer: "Pour lui, c'est une simple chaîne. L'erreur arrive à l'exécution, sous la forme d'une `std::regex_error`."
  - key: vf-temporaire
    format: true-false
    question: "Un `std::smatch` garde des itérateurs vers la chaîne dans laquelle on a cherché."
    truth: true
    answer: "Il ne copie pas le texte. La chaîne doit vivre aussi longtemps que le `std::smatch`."
  - key: qcm-remplacer
    format: multiple-choice
    question: "Quelle fonction renvoie un texte où chaque occurrence du motif est remplacée ?"
    choices:
      - {text: "`std::regex_replace`", correct: true}
      - {text: "`std::regex_search`", correct: false}
      - {text: "`std::regex_match`", correct: false}
      - {text: "`std::regex_swap`", correct: false}
    answer: "`std::regex_replace(texte, motif, remplacement)` renvoie une nouvelle chaîne ; l'original n'est pas modifié."
  - key: qcm-chiffres
    format: multiple-choice
    question: "Quel motif reconnaît une suite d'un ou plusieurs chiffres ?"
    choices:
      - {text: "`R\"(\\d+)\"`", correct: true}
      - {text: "`R\"(\\d?)\"`", correct: false}
      - {text: "`R\"(\\w*)\"`", correct: false}
      - {text: "`R\"(\\s+)\"`", correct: false}
    answer: "`\\d` désigne un chiffre, `+` « une fois ou plus ». `?` veut dire « zéro ou une fois », `\\w` un caractère de mot, `\\s` un espace."
  - key: qcm-toutes
    format: multiple-choice
    question: "Quel type parcourt toutes les occurrences d'un motif dans une `std::string` ?"
    choices:
      - {text: "`std::sregex_iterator`", correct: true}
      - {text: "`std::smatch`", correct: false}
      - {text: "`std::regex_error`", correct: false}
      - {text: "`std::string_view`", correct: false}
    answer: "Construit avec le début, la fin et le motif, il donne une correspondance à chaque pas. Un itérateur construit par défaut marque la fin."
  - key: qcm-alternative
    format: multiple-choice
    question: "Tu dois seulement savoir si une chaîne commence par `\"http://\"`. Que choisis-tu ?"
    choices:
      - {text: "`texte.starts_with(\"http://\")`", correct: true}
      - {text: "`std::regex_match(texte, std::regex{\"http://\"})`", correct: false}
      - {text: "`std::regex_replace(texte, std::regex{\"http://\"}, \"\")`", correct: false}
      - {text: "`std::sregex_iterator` sur tout le texte", correct: false}
    answer: "Une expression régulière est un outil lourd. Pour un préfixe, une fonction de `std::string` est plus claire et bien plus rapide."
  - key: trous-search
    format: fill-in
    question: |-
      Complète pour savoir si le texte contient au moins un chiffre :
      ```cpp
      const std::regex chiffre{R"(\d)"};
      const bool trouve = std::___(texte, chiffre);
      ```
    blanks:
      - [regex_search]
    answer: "`std::regex_search` cherche une occurrence n'importe où dans le texte."
  - key: trous-match
    format: fill-in
    question: |-
      Complète pour vérifier que la saisie entière est un code postal de cinq chiffres :
      ```cpp
      const std::regex code{R"(\d{5})"};
      const bool valide = std::___(saisie, code);
      ```
    blanks:
      - [regex_match]
    answer: "`std::regex_match` exige que tout le texte corresponde au motif."
  - key: trous-smatch
    format: fill-in
    question: |-
      Complète le type qui reçoit les groupes d'une recherche dans une `std::string` :
      ```cpp
      std::___ groupes;
      if (std::regex_search(texte, groupes, motif)) {
          std::println("{}", groupes[1].str());
      }
      ```
    blanks:
      - [smatch]
    answer: "`std::smatch` est le résultat d'une recherche dans une `std::string`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      const std::regex motif{R"(\w+)"};
      ```
    blanks:
      - [regex]
    answer: "`<regex>` déclare `std::regex`, les trois fonctions et les types de résultat."
  - key: code-match-search
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex chiffres{R"(\d+)"};
          const std::string texte = "abc123";
          std::println("{} {} {}",
                       std::regex_match(texte, chiffres),
                       std::regex_search(texte, chiffres),
                       std::regex_match(std::string{"123"}, chiffres));
      }
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`false true false`", correct: false}
    answer: "`false true true` : « abc123 » n'est pas fait que de chiffres, mais il en contient. « 123 » correspond en entier."
    check:
      output: "false true true"
  - key: code-groupes
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex date{R"((\d{4})-(\d{2})-(\d{2}))"};
          const std::string texte = "2024-05-17";
          std::smatch groupes;
          if (std::regex_match(texte, groupes, date)) {
              std::println("{} {} {}", groupes.size(), groupes[1].str(), groupes[3].str());
          }
      }
      ```
    choices:
      - {text: "`4 2024 17`", correct: true}
      - {text: "`3 2024 17`", correct: false}
      - {text: "`4 2024-05-17 05`", correct: false}
      - {text: "`3 05 17`", correct: false}
    answer: "`4 2024 17` : l'indice 0 est la correspondance entière, suivie de trois groupes. Le groupe 1 est l'année, le groupe 3 le jour."
    check:
      output: "4 2024 17"
  - key: code-replace
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::string texte = "a1b22c333";
          const std::string resultat = std::regex_replace(texte, std::regex{R"(\d+)"}, "#");
          std::println("{} {}", resultat, texte.size());
      }
      ```
    choices:
      - {text: "`a#b#c# 9`", correct: true}
      - {text: "`a#b##c### 9`", correct: false}
      - {text: "`a#b#c# 6`", correct: false}
      - {text: "`a#b22c333 9`", correct: false}
    answer: "`a#b#c# 9` : chaque suite de chiffres, quelle que soit sa longueur, est remplacée par un seul `#`. Le texte d'origine n'est pas modifié."
    check:
      output: "a#b#c# 9"
  - key: code-iterateur
    format: code-output
    question: |-
      ```cpp
      #include <iterator>
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex mot{R"(\w+)"};
          const std::string texte = "un deux trois";
          const std::sregex_iterator debut{texte.begin(), texte.end(), mot};
          const std::sregex_iterator fin;
          std::println("{} {}", std::distance(debut, fin), debut->str());
      }
      ```
    choices:
      - {text: "`3 un`", correct: true}
      - {text: "`1 un deux trois`", correct: false}
      - {text: "`13 u`", correct: false}
      - {text: "`3 trois`", correct: false}
    answer: "`3 un` : l'itérateur passe d'un mot au suivant, soit trois correspondances. La première est « un »."
    check:
      output: "3 un"
  - key: bug-match-au-lieu-de-search
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : la phrase contient bien une adresse. Il affiche `false`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex adresse{R"(\w+@\w+\.\w+)"};
          const std::string phrase = "écris à ada@exemple.org demain";
          std::println("{}", std::regex_match(phrase, adresse));
      }
      ```
    choices:
      - {text: "Appeler `std::regex_search`", correct: true}
      - {text: "Appeler `std::regex_replace`", correct: false}
      - {text: "Écrire le motif sans littéral brut", correct: false}
      - {text: "Déclarer `phrase` sans `const`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::regex_search(phrase, adresse));
      ```
      `regex_match` exige que la phrase entière soit une adresse. Pour trouver une adresse dans la phrase, c'est
      `regex_search`.
  - key: bug-barre-oblique
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true`. Il affiche `false`, et le compilateur avertit : « unknown escape
      sequence: '\d' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex chiffres{"\d+"};
          std::println("{}", std::regex_match(std::string{"2024"}, chiffres));
      }
      ```
    choices:
      - {text: "Écrire le motif dans un littéral brut : `R\"(\\d+)\"`", correct: true}
      - {text: "Écrire le motif avec une barre oblique : `\"/d+\"`", correct: false}
      - {text: "Écrire le motif entre apostrophes : `'\\d+'`", correct: false}
      - {text: "Appeler `std::regex_search` à la place de `std::regex_match`", correct: false}
    answer: |-
      ```cpp
      const std::regex chiffres{R"(\d+)"};
      ```
      Dans un littéral ordinaire, `\d` est une séquence d'échappement inconnue du C++ : le compilateur garde `d`, et
      le motif devient « une suite de lettres d ». Un littéral brut transmet la barre oblique inverse au motif.
  - key: bug-motif-invalide
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::regex_error` que personne n'attrape. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      int main() {
          const std::regex groupe{R"((\d+)"};
          std::println("{}", std::regex_search(std::string{"n 42"}, groupe));
      }
      ```
    choices:
      - {text: "Fermer la parenthèse du groupe : `R\"((\\d+))\"`", correct: true}
      - {text: "Retirer le `R` : écrire le motif dans un littéral ordinaire", correct: false}
      - {text: "Appeler `std::regex_match` à la place de `std::regex_search`", correct: false}
      - {text: "Déclarer `groupe` avec le mot-clé `constexpr`", correct: false}
    answer: |-
      ```cpp
      const std::regex groupe{R"((\d+))"};
      ```
      Dans `R"((\d+)"`, le motif est `(\d+` : la parenthèse du groupe n'est pas fermée. Le motif est analysé à
      l'exécution, et le constructeur lance `std::regex_error`.
  - key: bug-chaine-temporaire
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : « use of deleted function ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <regex>
      #include <string>

      std::string lire() {
          return "commande 4521";
      }

      int main() {
          const std::regex numero{R"(\d+)"};
          std::smatch groupes;
          if (std::regex_search(lire(), groupes, numero)) {
              std::println("{}", groupes[0].str());
          }
      }
      ```
    choices:
      - {text: "Ranger le résultat de `lire()` dans une variable, et chercher dans cette variable", correct: true}
      - {text: "Passer `std::move(lire())` à la place de `lire()` à `std::regex_search`", correct: false}
      - {text: "Déclarer `groupes` avec le type `std::cmatch` à la place de `std::smatch`", correct: false}
      - {text: "Appeler `std::regex_match` à la place de `std::regex_search`", correct: false}
    answer: |-
      ```cpp
      const std::string texte = lire();
      if (std::regex_search(texte, groupes, numero)) {
      ```
      Le `std::smatch` garde des itérateurs dans la chaîne. Avec une chaîne temporaire, ils seraient pendants dès la
      fin de la ligne : la bibliothèque a supprimé cette surcharge exprès.
