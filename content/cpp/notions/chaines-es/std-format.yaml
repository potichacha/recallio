notion: std-format
lesson: |-
  `std::format` (C++20, en-tête `<format>`) fabrique une `std::string` à partir d'un **modèle** et de valeurs.
  `std::print` et `std::println` (C++23) utilisent le même modèle, et écrivent directement le résultat.

  ```cpp
  std::string s = std::format("{} a {} ans", "Ada", 36);   // "Ada a 36 ans"
  ```

  Chaque `{}` est remplacé par l'argument suivant. Pour écrire une accolade, on la double : `{{` et `}}`.

  **Choisir l'argument.** Un numéro entre les accolades désigne l'argument, à partir de 0. On peut ainsi le
  réutiliser, ou changer l'ordre :

  ```cpp
  std::format("{0} + {0} = {1}", 2, 4);   // "2 + 2 = 4"
  ```

  **Mettre en forme.** Après deux-points vient la **spécification** : `{:spécification}`.

  | Modèle | Résultat | Sens |
  |---|---|---|
  | `{:5}` avec `42` | `"   42"` | largeur 5 ; un nombre s'aligne à droite |
  | `{:5}` avec `"ab"` | `"ab   "` | une chaîne s'aligne à gauche |
  | `{:<5}`, `{:>5}`, `{:^5}` | | aligner à gauche, à droite, au centre |
  | `{:*^7}` avec `"ab"` | `"**ab***"` | remplir avec `*` |
  | `{:05}` avec `42` | `"00042"` | compléter avec des zéros |
  | `{:.2f}` avec `3.14159` | `"3.14"` | deux chiffres après la virgule |
  | `{:x}`, `{:b}` avec `255` | `"ff"`, `"11111111"` | hexadécimal, binaire |
  | `{:#x}` avec `255` | `"0xff"` | avec le préfixe |
  | `{:+}` avec `5` | `"+5"` | toujours afficher le signe |

  L'ordre dans la spécification est fixe : remplissage et alignement, signe, `#`, `0`, largeur, précision, type.

  **Pourquoi pas `printf` ou `<<` ?**

  - **`printf`** ne vérifie pas que `%d` correspond bien à un entier : une erreur donne un comportement indéfini.
    Il ne sait pas afficher une `std::string` ni un type à soi.
  - **`std::cout <<`** est sûr, mais verbeux, et sa mise en forme passe par des manipulateurs qui restent actifs
    (`std::hex`, `std::setprecision`).
  - **`std::format`** vérifie le modèle **à la compilation** : un `{}` de trop, ou une spécification qui ne
    convient pas au type, et le programme ne compile pas.

  **Les types de la bibliothèque.** En C++23, `std::format` sait afficher un vecteur, une paire, une map :
  `std::format("{}", std::vector{1, 2, 3})` donne `[1, 2, 3]`. Pour ses propres types, on spécialise
  `std::formatter`.

  **Un modèle connu à l'exécution.** Le modèle doit être une constante. S'il vient d'une variable (un fichier de
  traductions), on passe par `std::vformat` et `std::make_format_args` ; une erreur lance alors
  `std::format_error`.

  **En entretien** : « `std::format` remplace `printf` et les `<<` : la syntaxe à accolades, la vérification du
  modèle à la compilation, et l'extension à mes types par `std::formatter`. `std::print` écrit directement, avec
  le même modèle. »
cards:
  - key: role
    format: course
    question: "Que renvoie `std::format(\"{} ans\", 36)` ?"
    choices:
      - {text: "Une `std::string` qui contient `36 ans`", correct: true}
      - {text: "Rien : elle affiche `36 ans` sur la sortie standard", correct: false}
      - {text: "Un `const char*` vers un tampon interne", correct: false}
      - {text: "Le nombre de caractères écrits", correct: false}
    answer: "`std::format` construit une chaîne. Pour afficher directement, c'est `std::print` ou `std::println`, avec le même modèle."
  - key: verification
    format: course
    question: "Quel avantage `std::format` a-t-il sur `printf` ?"
    choices:
      - {text: "Le modèle est vérifié à la compilation, selon le type des arguments", correct: true}
      - {text: "Le modèle peut être modifié pendant l'exécution du programme", correct: false}
      - {text: "Le résultat est toujours écrit dans un fichier journal", correct: false}
      - {text: "Les arguments sont évalués dans plusieurs threads à la fois", correct: false}
    answer: "Avec `printf`, un `%d` donné à une chaîne est un comportement indéfini. Avec `std::format`, un modèle incohérent ne compile pas."
  - key: specification
    format: course
    question: "Dans `{:.2f}`, que signifie ce qui suit les deux-points ?"
    choices:
      - {text: "La mise en forme : ici, deux chiffres après la virgule", correct: true}
      - {text: "Le numéro de l'argument : ici, le deuxième", correct: false}
      - {text: "La largeur totale : ici, deux caractères", correct: false}
      - {text: "Le type attendu : ici, un `float` sur deux octets", correct: false}
    answer: "Avant les deux-points, un numéro d'argument facultatif. Après, la spécification : alignement, largeur, précision, type."
  - key: accolades
    format: course
    question: "Comment écris-tu une accolade ouvrante dans le texte d'un modèle ?"
    choices:
      - {text: "En la doublant : `{{`", correct: true}
      - {text: "En la précédant d'une barre oblique inverse", correct: false}
      - {text: "En la précédant d'un signe pourcent : `%{`", correct: false}
      - {text: "En l'entourant de guillemets simples", correct: false}
    answer: "`{{` donne `{`, et `}}` donne `}`. Une accolade seule ouvre un champ à remplacer."
  - key: vf-en-tete
    format: true-false
    question: "`std::format` est déclaré dans l'en-tête `<format>`."
    truth: true
    answer: "Depuis C++20. `std::print` et `std::println` sont dans `<print>`, depuis C++23."
  - key: vf-alignement-nombre
    format: true-false
    question: "Avec une largeur, un nombre est aligné à gauche par défaut."
    truth: false
    answer: "Un nombre s'aligne à droite, une chaîne à gauche. `{:<5}` force l'alignement à gauche."
  - key: vf-trop-peu-arguments
    format: true-false
    question: "`std::format(\"{} {}\", 1)` compile, et laisse le second champ vide."
    truth: false
    answer: "Le compilateur refuse : le modèle demande deux arguments. C'est la vérification à la compilation."
  - key: vf-reutiliser
    format: true-false
    question: "`{0}` peut apparaître plusieurs fois dans un même modèle."
    truth: true
    answer: "Un numéro désigne un argument, autant de fois qu'on veut : `std::format(\"{0}{0}\", \"ab\")` donne `abab`."
  - key: qcm-deux-decimales
    format: multiple-choice
    question: "Quel modèle affiche `3.14159` sous la forme `3.14` ?"
    choices:
      - {text: "`{:.2f}`", correct: true}
      - {text: "`{:2}`", correct: false}
      - {text: "`{:2f}`", correct: false}
      - {text: "`{.2f}`", correct: false}
    answer: "Le point introduit la précision, `f` demande la notation à virgule fixe. `{:2}` fixe une largeur minimale de 2."
  - key: qcm-zeros
    format: multiple-choice
    question: "Quel modèle affiche `7` sous la forme `007` ?"
    choices:
      - {text: "`{:03}`", correct: true}
      - {text: "`{:3}`", correct: false}
      - {text: "`{:.3}`", correct: false}
      - {text: "`{:30}`", correct: false}
    answer: "Le `0` demande de compléter avec des zéros, `3` est la largeur. `{:3}` compléterait avec des espaces."
  - key: qcm-hexa
    format: multiple-choice
    question: "Quel modèle affiche `255` sous la forme `ff` ?"
    choices:
      - {text: "`{:x}`", correct: true}
      - {text: "`{:h}`", correct: false}
      - {text: "`{:16}`", correct: false}
      - {text: "`{:b}`", correct: false}
    answer: "`x` pour l'hexadécimal, `b` pour le binaire, `o` pour l'octal. `{:#x}` ajoute le préfixe `0x`."
  - key: qcm-centrer
    format: multiple-choice
    question: "Quel modèle centre un texte dans une largeur de 9 caractères ?"
    choices:
      - {text: "`{:^9}`", correct: true}
      - {text: "`{:<9}`", correct: false}
      - {text: "`{:>9}`", correct: false}
      - {text: "`{:=9}`", correct: false}
    answer: "`^` centre, `<` aligne à gauche, `>` aligne à droite."
  - key: trous-format
    format: fill-in
    question: |-
      Complète pour construire la chaîne :
      ```cpp
      std::string s = std::___("{} a {} ans", nom, age);
      ```
    blanks:
      - [format]
    answer: "`std::format` renvoie une `std::string`."
  - key: trous-precision
    format: fill-in
    question: |-
      Complète le modèle pour afficher le prix avec deux chiffres après la virgule :
      ```cpp
      std::println("{:___}", prix);
      ```
    blanks:
      - [".2f"]
    answer: "`.2f` : précision 2, notation à virgule fixe."
  - key: trous-numero
    format: fill-in
    question: |-
      Complète pour afficher deux fois le premier argument : `ab ab`.
      ```cpp
      std::println("{0} {___}", "ab");
      ```
    blanks:
      - ["0"]
    answer: "`{0}` désigne le premier argument, et peut être répété."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `std::format` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [format]
    answer: "`<format>` déclare `std::format`, `std::vformat` et `std::formatter`."
  - key: code-largeur
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>

      int main() {
          std::println("[{:5}] [{:<5}] [{:05}]", 42, 42, 42);
      }
      ```
    choices:
      - {text: "`[   42] [42   ] [00042]`", correct: true}
      - {text: "`[42   ] [42   ] [00042]`", correct: false}
      - {text: "`[   42] [   42] [42000]`", correct: false}
      - {text: "`[42] [42] [42]`", correct: false}
    answer: "`[   42] [42   ] [00042]` : un nombre s'aligne à droite par défaut ; `<` l'aligne à gauche ; `0` complète avec des zéros."
    check:
      output: "[   42] [42   ] [00042]"
  - key: code-precision
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>
      #include <string>

      int main() {
          const std::string s = std::format("{:.1f}|{:.3f}", 2.75, 1.0);
          std::println("{} {}", s, s.size());
      }
      ```
    choices:
      - {text: "`2.8|1.000 9`", correct: true}
      - {text: "`2.7|1.000 9`", correct: false}
      - {text: "`2.8|1 5`", correct: false}
      - {text: "`2.75|1.0 8`", correct: false}
    answer: "`2.8|1.000 9` : `.1f` arrondit 2.75 à un chiffre ; `.3f` en affiche toujours trois. La chaîne compte neuf caractères."
    check:
      output: "2.8|1.000 9"
  - key: code-bases
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>

      int main() {
          std::println("{:x} {:#x} {:b} {:+}", 255, 255, 5, 5);
      }
      ```
    choices:
      - {text: "`ff 0xff 101 +5`", correct: true}
      - {text: "`FF 0xFF 101 +5`", correct: false}
      - {text: "`ff ff 5 5`", correct: false}
      - {text: "`255 0x255 101 +5`", correct: false}
    answer: "`ff 0xff 101 +5` : `x` écrit en hexadécimal, `#` ajoute le préfixe, `b` écrit en binaire, `+` affiche le signe."
    check:
      output: "ff 0xff 101 +5"
  - key: code-remplissage
    format: code-output
    question: |-
      ```cpp
      #include <format>
      #include <print>

      int main() {
          std::println("{:*^7}|{:>4}|{{{}}}", "ab", "x", 1);
      }
      ```
    choices:
      - {text: "`**ab***|   x|{1}`", correct: true}
      - {text: "`***ab**|   x|{1}`", correct: false}
      - {text: "`**ab***|x   |{1}`", correct: false}
      - {text: "`**ab***|   x|{{1}}`", correct: false}
    answer: "`**ab***|   x|{1}` : `*^7` centre dans 7 caractères en remplissant d'étoiles, le surplus allant à droite. `{{` et `}}` écrivent des accolades."
    check:
      output: "**ab***|   x|{1}"
  - key: bug-argument-manquant
    format: bug-fix
    question: |-
      Le compilateur refuse cet appel : le modèle demande plus d'arguments qu'il n'en reçoit. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string nom = "Ada";
          const int age = 36;
          std::println("{} a {} ans, née en {}", nom, age);
      }
      ```
    choices:
      - {text: "Passer l'année en troisième argument", correct: true}
      - {text: "Écrire `{2}` à la place du troisième `{}`", correct: false}
      - {text: "Écrire `%d` à la place du troisième `{}`", correct: false}
      - {text: "Passer `nom` et `age` entre accolades", correct: false}
    answer: |-
      ```cpp
      std::println("{} a {} ans, née en {}", nom, age, 1815);
      ```
      Trois champs demandent trois arguments. `std::format` le vérifie à la compilation : avec `printf`, la même
      faute n'aurait été vue qu'à l'exécution.
  - key: bug-accolades-litterales
    format: bug-fix
    question: |-
      Ce programme devrait afficher `{ "age": 36 }`. Le compilateur refuse le modèle. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          std::println("{ \"age\": {} }", 36);
      }
      ```
    choices:
      - {text: "Doubler les accolades du texte : `{{ \\\"age\\\": {} }}`", correct: true}
      - {text: "Précéder les accolades du texte d'une barre oblique inverse", correct: false}
      - {text: "Passer les accolades du texte en arguments supplémentaires", correct: false}
      - {text: "Remplacer le champ `{}` par `%d`, comme avec `printf`", correct: false}
    answer: |-
      ```cpp
      std::println("{{ \"age\": {} }}", 36);
      ```
      Une accolade seule ouvre un champ. Pour l'écrire telle quelle, on la double.
  - key: bug-specification-inadaptee
    format: bug-fix
    question: |-
      Le compilateur refuse ce modèle : la spécification ne convient pas au type de l'argument. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string nom = "Ada";
          std::println("{:d}", nom);
      }
      ```
    choices:
      - {text: "Écrire `{}`, ou `{:s}`", correct: true}
      - {text: "Écrire `{:x}`", correct: false}
      - {text: "Écrire `{:.2f}`", correct: false}
      - {text: "Écrire `{:05d}`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", nom);
      ```
      `d` demande un entier. Une chaîne s'affiche avec `{}`, ou `{:s}` si l'on veut le préciser. La spécification
      est vérifiée contre le type de l'argument, à la compilation.
  - key: bug-precision-oubliee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `12.50`. Il affiche `12.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const double prix = 12.5;
          std::println("{}", prix);
      }
      ```
    choices:
      - {text: "Écrire le modèle `{:.2f}`", correct: true}
      - {text: "Écrire le modèle `{:2}`", correct: false}
      - {text: "Écrire le modèle `{:02}`", correct: false}
      - {text: "Écrire le modèle `{:f2}`", correct: false}
    answer: |-
      ```cpp
      std::println("{:.2f}", prix);
      ```
      Sans spécification, un `double` s'affiche avec le moins de chiffres possible. `.2f` impose deux chiffres après
      la virgule. `{:2}` ne fixe qu'une largeur minimale.
