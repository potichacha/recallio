notion: string-conversions
lesson: |-
  Passer d'un nombre à un texte, ou d'un texte à un nombre, se fait de trois façons, de la plus simple à la plus
  rapide.

  **Nombre vers texte.**

  ```cpp
  std::string a = std::to_string(42);          // "42"
  std::string b = std::to_string(3.5);         // "3.500000" : toujours six décimales
  std::string c = std::format("{:.1f}", 3.5);  // "3.5" : on choisit la forme
  ```

  `std::to_string` suffit pour un entier. Pour un nombre à virgule, `std::format` permet de fixer la précision.

  **Texte vers nombre : la famille `std::stoi`.** `std::stoi` (int), `std::stol`, `std::stoll`, `std::stod`
  (double), dans `<string>`.

  ```cpp
  int n = std::stoi("42");        // 42
  int m = std::stoi("  12abc");   // 12 : espaces ignorés, arrêt au premier caractère invalide
  ```

  En cas d'échec, elles **lancent** :

  | Entrée | Exception |
  |---|---|
  | `"abc"` : aucun chiffre au début | `std::invalid_argument` |
  | `"99999999999"` : trop grand pour un `int` | `std::out_of_range` |

  Le piège : `std::stoi("12abc")` **réussit** et renvoie 12. Pour exiger que **tout** le texte soit un nombre, on
  demande la position d'arrêt, et on la compare à la taille :

  ```cpp
  std::size_t lus = 0;
  int n = std::stoi(texte, &lus);
  if (lus != texte.size()) { /* il reste des caractères */ }
  ```

  Un troisième argument donne la base : `std::stoi("ff", nullptr, 16)` vaut 255.

  **Texte vers nombre : `std::from_chars`** (C++17, `<charconv>`). La conversion la plus rapide, **sans
  exception**, sans allocation, et indépendante des réglages régionaux.

  ```cpp
  std::string_view texte = "42";
  int valeur = 0;
  auto [fin, erreur] = std::from_chars(texte.data(), texte.data() + texte.size(), valeur);
  if (erreur == std::errc{} && fin == texte.data() + texte.size()) {
      // tout le texte a été converti
  }
  ```

  Elle renvoie un pointeur sur le premier caractère **non lu**, et un code d'erreur : `std::errc{}` (réussite),
  `std::errc::invalid_argument`, ou `std::errc::result_out_of_range`. Elle **n'ignore pas** les espaces de tête,
  et n'accepte pas de `+`.

  `std::to_chars` fait la conversion inverse, dans un tampon fourni par l'appelant.

  **Lequel choisir.**

  | Besoin | Outil |
  |---|---|
  | Un entier vers une chaîne | `std::to_string` |
  | Un nombre mis en forme | `std::format` |
  | Une conversion simple, où l'échec est exceptionnel | `std::stoi`, `std::stod` |
  | Une analyse stricte, fréquente, ou sans exception | `std::from_chars` |

  **Ce qu'on évite.** `atoi` renvoie 0 en cas d'échec, sans qu'on puisse le distinguer d'un vrai zéro, et son
  comportement est indéfini en cas de dépassement.

  **En entretien** : « `std::to_string` ou `std::format` vers le texte. Dans l'autre sens, `std::stoi` lance
  `std::invalid_argument` ou `std::out_of_range`, mais accepte `"12abc"` ; pour une analyse stricte et sans
  exception, `std::from_chars`, qui renvoie un code d'erreur et la position d'arrêt. »
cards:
  - key: to-string
    format: course
    question: "Que renvoie `std::to_string(3.5)` ?"
    choices:
      - {text: "La chaîne `3.500000`, avec six décimales", correct: true}
      - {text: "La chaîne `3.5`, au plus court", correct: false}
      - {text: "La chaîne `3`, arrondie à l'entier", correct: false}
      - {text: "La chaîne `4`, arrondie au plus proche", correct: false}
    answer: "`std::to_string` ne laisse pas choisir la précision d'un nombre à virgule. Pour `3.5`, on écrit `std::format(\"{}\", 3.5)` ou `std::format(\"{:.1f}\", 3.5)`."
  - key: stoi-echec
    format: course
    question: "Que fait `std::stoi(\"abc\")` ?"
    choices:
      - {text: "Il lance `std::invalid_argument`", correct: true}
      - {text: "Il renvoie 0, comme `atoi`", correct: false}
      - {text: "Il renvoie -1, pour signaler l'échec", correct: false}
      - {text: "Il lance `std::out_of_range`", correct: false}
    answer: "Aucun chiffre en tête : `std::invalid_argument`. `std::out_of_range` signale un nombre trop grand pour le type."
  - key: stoi-partiel
    format: course
    question: "Que renvoie `std::stoi(\"12abc\")` ?"
    choices:
      - {text: "12 : la conversion s'arrête au premier caractère invalide, sans erreur", correct: true}
      - {text: "Rien : il lance `std::invalid_argument`, car le texte n'est pas un nombre", correct: false}
      - {text: "0 : un texte qui contient des lettres vaut zéro", correct: false}
      - {text: "12 : et il retire `abc` de la chaîne d'origine", correct: false}
    answer: "`std::stoi` convertit le début valide. Pour refuser `12abc`, on récupère la position d'arrêt par le second argument, et on la compare à la taille du texte."
  - key: from-chars
    format: course
    question: "Qu'apporte `std::from_chars` par rapport à `std::stoi` ?"
    choices:
      - {text: "Aucune exception ni allocation : elle renvoie un code d'erreur et la position d'arrêt", correct: true}
      - {text: "Une tolérance plus grande : elle ignore les espaces et les lettres du texte", correct: false}
      - {text: "Une écriture plus courte : elle prend la chaîne et renvoie directement le nombre", correct: false}
      - {text: "Une prise en compte des réglages régionaux, comme la virgule décimale", correct: false}
    answer: "Elle est faite pour l'analyse rapide et stricte : pas d'espaces de tête, pas de réglages régionaux, et l'échec est une valeur de retour."
  - key: vf-stoi-espaces
    format: true-false
    question: "`std::stoi(\"  42\")` ignore les espaces de tête, et renvoie 42."
    truth: true
    answer: "La famille `stoi` saute les espaces initiaux. `std::from_chars`, elle, ne les accepte pas."
  - key: vf-from-chars-exception
    format: true-false
    question: "`std::from_chars` lance une exception quand le texte n'est pas un nombre."
    truth: false
    answer: "Elle ne lance jamais : elle renvoie `std::errc::invalid_argument` dans le champ d'erreur de son résultat."
  - key: vf-atoi
    format: true-false
    question: "`atoi(\"abc\")` renvoie 0, ce qui ne se distingue pas de la conversion de `\"0\"`."
    truth: true
    answer: "C'est pourquoi on l'évite : l'échec est invisible, et un dépassement est un comportement indéfini."
  - key: vf-stoi-depassement
    format: true-false
    question: "`std::stoi(\"99999999999\")` renvoie le plus grand `int`."
    truth: false
    answer: "Il lance `std::out_of_range` : le nombre ne tient pas dans un `int`."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::from_chars` ?"
    choices:
      - {text: "`<charconv>`", correct: true}
      - {text: "`<string>`", correct: false}
      - {text: "`<cstdlib>`", correct: false}
      - {text: "`<format>`", correct: false}
    answer: "`<charconv>` déclare `std::from_chars` et `std::to_chars`. `std::stoi` et `std::to_string` sont dans `<string>`."
  - key: qcm-double
    format: multiple-choice
    question: "Quelle fonction convertit la chaîne `\"3.14\"` en `double` ?"
    choices:
      - {text: "`std::stod`", correct: true}
      - {text: "`std::stoi`", correct: false}
      - {text: "`std::stol`", correct: false}
      - {text: "`std::to_string`", correct: false}
    answer: "`stod` : *string to double*. `std::stoi(\"3.14\")` renverrait 3, en s'arrêtant au point."
  - key: qcm-base
    format: multiple-choice
    question: "Que vaut `std::stoi(\"ff\", nullptr, 16)` ?"
    choices:
      - {text: "255", correct: true}
      - {text: "16", correct: false}
      - {text: "0", correct: false}
      - {text: "15", correct: false}
    answer: "Le troisième argument est la base : `ff` en hexadécimal vaut 255. Le deuxième, ici nul, recevrait la position d'arrêt."
  - key: qcm-reussite
    format: multiple-choice
    question: "À quelle valeur compare-t-on le champ d'erreur de `std::from_chars` pour savoir qu'elle a réussi ?"
    choices:
      - {text: "`std::errc{}`", correct: true}
      - {text: "`nullptr`", correct: false}
      - {text: "`std::string::npos`", correct: false}
      - {text: "`std::errc::invalid_argument`", correct: false}
    answer: "`std::errc{}`, la valeur nulle de l'énumération, signifie « aucune erreur »."
  - key: trous-to-string
    format: fill-in
    question: |-
      Complète pour convertir l'entier en chaîne :
      ```cpp
      const std::string texte = std::___(42);
      ```
    blanks:
      - [to_string]
    answer: "`std::to_string` convertit un nombre en `std::string`."
  - key: trous-stoi
    format: fill-in
    question: |-
      Complète pour convertir la chaîne en `int` :
      ```cpp
      const int age = std::___("36");
      ```
    blanks:
      - [stoi]
    answer: "`std::stoi` : *string to int*."
  - key: trous-charconv
    format: fill-in
    question: |-
      Complète l'en-tête à inclure pour `std::from_chars` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [charconv]
    answer: "`<charconv>` déclare les conversions sans exception ni allocation."
  - key: trous-invalid-argument
    format: fill-in
    question: |-
      Complète le type de l'exception lancée par `std::stoi("abc")` :
      ```cpp
      try {
          const int n = std::stoi("abc");
      } catch (const std::___&) {
          std::println("pas un nombre");
      }
      ```
    blanks:
      - [invalid_argument]
    answer: "`std::invalid_argument` : aucun chiffre n'a pu être lu."
  - key: code-to-string
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string a = std::to_string(42) + std::to_string(8);
          std::println("{} {}", a, a.size());
      }
      ```
    choices:
      - {text: "`428 3`", correct: true}
      - {text: "`50 2`", correct: false}
      - {text: "`42 8 4`", correct: false}
      - {text: "`428 2`", correct: false}
    answer: "`428 3` : ce sont deux chaînes, que `+` met bout à bout. Aucune addition n'a lieu."
    check:
      output: "428 3"
  - key: code-stoi-partiel
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string texte = "12abc";
          std::size_t lus = 0;
          const int n = std::stoi(texte, &lus);
          std::println("{} {} {}", n, lus, lus == texte.size());
      }
      ```
    choices:
      - {text: "`12 2 false`", correct: true}
      - {text: "`12 5 true`", correct: false}
      - {text: "`0 0 false`", correct: false}
      - {text: "`12 3 false`", correct: false}
    answer: "`12 2 false` : la conversion lit deux caractères, puis s'arrête sur `a`. La position d'arrêt, différente de la taille, révèle que le texte n'était pas entièrement un nombre."
    check:
      output: "12 2 false"
  - key: code-stoi-exceptions
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <string>

      int convertir(const std::string& texte) {
          try {
              return std::stoi(texte);
          } catch (const std::invalid_argument&) {
              return -1;
          } catch (const std::out_of_range&) {
              return -2;
          }
      }

      int main() {
          std::println("{} {} {}", convertir("7"), convertir("sept"), convertir("99999999999"));
      }
      ```
    choices:
      - {text: "`7 -1 -2`", correct: true}
      - {text: "`7 -2 -1`", correct: false}
      - {text: "`7 0 0`", correct: false}
      - {text: "`7 -1 -1`", correct: false}
    answer: "`7 -1 -2` : `sept` ne commence par aucun chiffre, donc `std::invalid_argument`. Le grand nombre ne tient pas dans un `int`, donc `std::out_of_range`."
    check:
      output: "7 -1 -2"
  - key: code-from-chars
    format: code-output
    question: |-
      ```cpp
      #include <charconv>
      #include <print>
      #include <string_view>
      #include <system_error>

      int main() {
          const std::string_view texte = "250 km";
          int valeur = 0;
          const auto resultat = std::from_chars(texte.data(), texte.data() + texte.size(), valeur);
          std::println("{} {} {}", valeur, resultat.ec == std::errc{}, resultat.ptr - texte.data());
      }
      ```
    choices:
      - {text: "`250 true 3`", correct: true}
      - {text: "`250 false 3`", correct: false}
      - {text: "`0 false 0`", correct: false}
      - {text: "`250 true 6`", correct: false}
    answer: "`250 true 3` : la conversion réussit sur les trois premiers caractères. `ptr` désigne le premier caractère non lu, l'espace, à la position 3."
    check:
      output: "250 true 3"
  - key: bug-stoi-non-attrape
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « terminate called after throwing an instance of 'std::invalid_argument' ». Il
      devrait afficher `saisie invalide`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string saisie = "douze";
          const int n = std::stoi(saisie);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Entourer l'appel d'un `try`, et attraper `std::invalid_argument`", correct: true}
      - {text: "Comparer le résultat de `std::stoi` à 0, pour détecter l'échec", correct: false}
      - {text: "Comparer le résultat de `std::stoi` à `std::string::npos`", correct: false}
      - {text: "Déclarer `n` avec le type `long` à la place de `int`", correct: false}
    answer: |-
      ```cpp
      try {
          const int n = std::stoi(saisie);
          std::println("{}", n);
      } catch (const std::invalid_argument&) {
          std::println("saisie invalide");
      }
      ```
      `std::stoi` signale l'échec par une exception, pas par une valeur de retour. Pour une saisie d'utilisateur,
      souvent fausse, `std::from_chars` et son code d'erreur conviennent mieux.
  - key: bug-addition-de-chaines
    format: bug-fix
    question: |-
      Ce programme devrait afficher `50`. Il affiche `428`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string a = "42";
          const std::string b = "8";
          std::println("{}", a + b);
      }
      ```
    choices:
      - {text: "Afficher `std::stoi(a) + std::stoi(b)`", correct: true}
      - {text: "Afficher `std::to_string(a) + std::to_string(b)`", correct: false}
      - {text: "Afficher `a.size() + b.size()`", correct: false}
      - {text: "Afficher `a.append(b)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::stoi(a) + std::stoi(b));
      ```
      Entre deux chaînes, `+` met bout à bout. Pour additionner, il faut d'abord convertir en nombres.
  - key: bug-to-string-precision
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Total : 12.50`. Il affiche `Total : 12.500000`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const double total = 12.5;
          const std::string texte = "Total : " + std::to_string(total);
          std::println("{}", texte);
      }
      ```
    choices:
      - {text: "Écrire `std::format(\"Total : {:.2f}\", total)`, en incluant `<format>`", correct: true}
      - {text: "Écrire `\"Total : \" + std::to_string(total, 2)`", correct: false}
      - {text: "Écrire `\"Total : \" + std::to_string(static_cast<int>(total))`", correct: false}
      - {text: "Écrire `\"Total : \" + total`", correct: false}
    answer: |-
      ```cpp
      const std::string texte = std::format("Total : {:.2f}", total);
      ```
      `std::to_string` écrit toujours six décimales, et n'a pas de paramètre de précision. `std::format` laisse
      choisir la forme.
  - key: bug-texte-partiel
    format: bug-fix
    question: |-
      Ce programme devrait refuser `12abc` et afficher `invalide`. Il affiche `12`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string saisie = "12abc";
          const int n = std::stoi(saisie);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Récupérer la position d'arrêt par `std::stoi(saisie, &lus)`, et exiger `lus == saisie.size()`", correct: true}
      - {text: "Attraper `std::invalid_argument` autour de l'appel, et afficher `invalide` dans le `catch`", correct: false}
      - {text: "Appeler `std::stoi(saisie, nullptr, 10)`, en précisant la base dix", correct: false}
      - {text: "Appeler `std::stod(saisie)` à la place de `std::stoi(saisie)`", correct: false}
    answer: |-
      ```cpp
      std::size_t lus = 0;
      const int n = std::stoi(saisie, &lus);
      if (lus != saisie.size()) {
          std::println("invalide");
      }
      ```
      `std::stoi` convertit le début valide, et ne lance rien pour `12abc`. Seule la position d'arrêt dit s'il
      reste des caractères. `std::from_chars` donne la même information par son champ `ptr`.
