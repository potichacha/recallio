notion: filesystem
lesson: |-
  `std::filesystem` (C++17, en-tête `<filesystem>`) manipule les **chemins**, les **fichiers** et les
  **répertoires**, de la même façon sous Linux, macOS et Windows. On l'abrège souvent :
  `namespace fs = std::filesystem;`.

  **`fs::path` : un chemin.** Ce n'est qu'un **nom** : construire un `path` ne touche pas au disque, et ne dit pas
  si le fichier existe.

  ```cpp
  fs::path p{"/home/ada/notes.txt"};
  p.filename();       // "notes.txt"
  p.stem();           // "notes"
  p.extension();      // ".txt" : le point est compris
  p.parent_path();    // "/home/ada"
  ```

  **Assembler avec `/`.** L'opérateur `/` joint deux morceaux, en ajoutant le séparateur qu'il faut.

  ```cpp
  fs::path dossier{"/home/ada"};
  fs::path fichier = dossier / "photos" / "chat.png";     // "/home/ada/photos/chat.png"
  ```

  Le piège : si le morceau de droite est un chemin **absolu**, il **remplace** celui de gauche.
  `fs::path{"/home/ada"} / "/etc"` vaut `"/etc"`. Et `+=` colle du texte **sans** séparateur.

  **Interroger le disque.**

  | Fonction | Renvoie |
  |---|---|
  | `fs::exists(p)` | vrai si quelque chose porte ce nom |
  | `fs::is_regular_file(p)`, `fs::is_directory(p)` | sa nature |
  | `fs::file_size(p)` | sa taille, en octets |
  | `fs::current_path()` | le répertoire courant |
  | `fs::temp_directory_path()` | le répertoire des fichiers temporaires |

  **Modifier le disque.**

  | Fonction | Effet |
  |---|---|
  | `fs::create_directory(p)` | crée un répertoire ; le parent doit exister |
  | `fs::create_directories(p)` | crée aussi les parents manquants |
  | `fs::copy_file(source, cible)`, `fs::rename(ancien, nouveau)` | copie, déplace ou renomme |
  | `fs::remove(p)` | supprime un fichier ou un répertoire **vide** ; renvoie `false` s'il n'existait pas |
  | `fs::remove_all(p)` | supprime tout le contenu, et renvoie le nombre d'éléments supprimés |

  **Parcourir un répertoire.**

  ```cpp
  for (const auto& entree : fs::directory_iterator{dossier}) {
      std::println("{}", entree.path().filename().string());
  }
  ```

  `fs::recursive_directory_iterator` descend dans les sous-répertoires. L'**ordre** du parcours **n'est pas
  spécifié** : pour un affichage stable, on range les chemins dans un vecteur, et on le trie.

  **Les erreurs.** Chaque fonction existe en deux versions :

  ```cpp
  auto taille = fs::file_size(p);              // lance fs::filesystem_error en cas d'échec

  std::error_code erreur;
  auto taille2 = fs::file_size(p, erreur);     // ne lance pas : remplit erreur
  ```

  `fs::filesystem_error` dérive de `std::system_error`, donc de `std::runtime_error`. La version avec
  `std::error_code` convient quand l'échec est ordinaire.

  **Tester puis agir n'est pas sûr.** Entre `fs::exists(p)` et l'ouverture, un autre programme peut supprimer le
  fichier. On **tente l'opération**, et l'on traite son échec.

  **Afficher un chemin.** `p.string()` donne une `std::string`.

  **En entretien** : « `std::filesystem::path` représente un chemin, que j'assemble avec `/` plutôt qu'en collant
  des chaînes. `exists`, `file_size`, `create_directories`, `remove_all` agissent sur le disque, et lancent
  `filesystem_error`, sauf la version qui prend un `std::error_code`. L'ordre de `directory_iterator` n'est pas
  garanti. »
cards:
  - key: path
    format: course
    question: "Que représente un `std::filesystem::path` ?"
    choices:
      - {text: "Un chemin, c'est-à-dire un nom : le construire ne touche pas au disque", correct: true}
      - {text: "Un fichier ouvert, que l'on peut lire avec `>>` et `std::getline`", correct: false}
      - {text: "Le contenu d'un répertoire, chargé en mémoire à la construction", correct: false}
      - {text: "Un fichier dont l'existence a été vérifiée à la construction", correct: false}
    answer: "Un `path` peut désigner un fichier qui n'existe pas. Ce sont les fonctions comme `exists` ou `file_size` qui interrogent le disque."
  - key: operateur-slash
    format: course
    question: "Que fait l'opérateur `/` entre deux `std::filesystem::path` ?"
    choices:
      - {text: "Il les joint en un seul chemin, avec le séparateur de répertoires", correct: true}
      - {text: "Il divise la taille du premier fichier par celle du second", correct: false}
      - {text: "Il retire du premier chemin le dernier morceau du second", correct: false}
      - {text: "Il compare les deux chemins, morceau par morceau", correct: false}
    answer: "`dossier / \"photos\" / \"chat.png\"` construit le chemin sans se soucier du séparateur. Si le morceau de droite est absolu, il remplace tout."
  - key: erreurs
    format: course
    question: "Comment une fonction de `std::filesystem` signale-t-elle un échec, sans argument `std::error_code` ?"
    choices:
      - {text: "Elle lance `std::filesystem::filesystem_error`", correct: true}
      - {text: "Elle renvoie `-1`, comme les fonctions du C", correct: false}
      - {text: "Elle met la variable globale `errno` à zéro", correct: false}
      - {text: "Elle renvoie un `std::optional` vide", correct: false}
    answer: "Chaque fonction a aussi une version qui prend un `std::error_code` en dernier argument : celle-là ne lance pas, et y range l'erreur."
  - key: ordre-parcours
    format: course
    question: "Dans quel ordre `std::filesystem::directory_iterator` donne-t-il les entrées d'un répertoire ?"
    choices:
      - {text: "Dans un ordre non spécifié : on trie soi-même si l'ordre compte", correct: true}
      - {text: "Dans l'ordre alphabétique des noms de fichiers et de dossiers", correct: false}
      - {text: "Dans l'ordre de création des fichiers, du plus ancien au plus récent", correct: false}
      - {text: "Dans l'ordre croissant des tailles", correct: false}
    answer: "L'ordre dépend du système de fichiers. Pour un résultat stable, on range les chemins dans un vecteur, puis `std::sort`."
  - key: vf-extension
    format: true-false
    question: "`std::filesystem::path{\"photo.png\"}.extension()` vaut `.png`, point compris."
    truth: true
    answer: "L'extension commence au dernier point. `stem()` donne le reste : `photo`."
  - key: vf-path-existe
    format: true-false
    question: "Construire un `std::filesystem::path` vérifie que le fichier existe."
    truth: false
    answer: "Un `path` n'est qu'un nom. `std::filesystem::exists(p)` interroge le disque."
  - key: vf-remove-plein
    format: true-false
    question: "`std::filesystem::remove` supprime un répertoire et tout ce qu'il contient."
    truth: false
    answer: "`remove` ne supprime qu'un fichier, ou un répertoire vide. Pour tout supprimer, c'est `remove_all`."
  - key: vf-create-directories
    format: true-false
    question: "`std::filesystem::create_directories(\"a/b/c\")` crée aussi les répertoires `a` et `a/b` s'ils manquent."
    truth: true
    answer: "Au pluriel, elle crée toute la chaîne. `create_directory`, au singulier, exige que le parent existe."
  - key: qcm-filename
    format: multiple-choice
    question: "`p` vaut `/home/ada/notes.txt`. Quelle fonction renvoie `notes.txt` ?"
    choices:
      - {text: "`p.filename()`", correct: true}
      - {text: "`p.stem()`", correct: false}
      - {text: "`p.parent_path()`", correct: false}
      - {text: "`p.extension()`", correct: false}
    answer: "`filename()` : le dernier morceau. `stem()` donne `notes`, `extension()` donne `.txt`, `parent_path()` donne `/home/ada`."
  - key: qcm-taille
    format: multiple-choice
    question: "Quelle fonction renvoie la taille d'un fichier, en octets ?"
    choices:
      - {text: "`std::filesystem::file_size(p)`", correct: true}
      - {text: "`p.size()`", correct: false}
      - {text: "`std::filesystem::space(p)`", correct: false}
      - {text: "`std::filesystem::length(p)`", correct: false}
    answer: "`file_size` interroge le disque. `space` donne la place disponible sur le volume."
  - key: qcm-sans-exception
    format: multiple-choice
    question: "Quelle écriture demande la taille d'un fichier sans risquer d'exception ?"
    choices:
      - {text: "`std::filesystem::file_size(p, erreur)`, avec `std::error_code erreur`", correct: true}
      - {text: "`std::filesystem::file_size(p, std::nothrow)`, comme avec `new`", correct: false}
      - {text: "`std::filesystem::try_file_size(p)`, qui renvoie un `std::optional`", correct: false}
      - {text: "`noexcept(std::filesystem::file_size(p))`", correct: false}
    answer: "La version qui reçoit un `std::error_code` ne lance pas : on teste ensuite `if (erreur)`."
  - key: qcm-recursif
    format: multiple-choice
    question: "Quel itérateur parcourt un répertoire et tous ses sous-répertoires ?"
    choices:
      - {text: "`std::filesystem::recursive_directory_iterator`", correct: true}
      - {text: "`std::filesystem::directory_iterator`", correct: false}
      - {text: "`std::filesystem::path::iterator`", correct: false}
      - {text: "`std::filesystem::deep_iterator`", correct: false}
    answer: "`directory_iterator` s'arrête au premier niveau. L'itérateur d'un `path` parcourt les morceaux du chemin, pas le disque."
  - key: trous-exists
    format: fill-in
    question: |-
      Complète pour tester que le chemin désigne quelque chose sur le disque :
      ```cpp
      if (std::filesystem::___(chemin)) {
          std::println("présent");
      }
      ```
    blanks:
      - [exists]
    answer: "`std::filesystem::exists` interroge le disque."
  - key: trous-slash
    format: fill-in
    question: |-
      Complète pour assembler le répertoire et le nom du fichier :
      ```cpp
      const std::filesystem::path fichier = dossier ___ "notes.txt";
      ```
    blanks:
      - ["/"]
    answer: "L'opérateur `/` joint deux morceaux de chemin, avec le bon séparateur."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête à inclure :
      ```cpp
      #include <___>

      namespace fs = std::filesystem;
      ```
    blanks:
      - [filesystem]
    answer: "`<filesystem>`, depuis C++17."
  - key: trous-remove-all
    format: fill-in
    question: |-
      Complète pour supprimer le répertoire et tout son contenu :
      ```cpp
      std::filesystem::___(dossier);
      ```
    blanks:
      - [remove_all]
    answer: "`remove_all` supprime récursivement. `remove` refuserait un répertoire non vide."
  - key: code-decomposer
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <print>

      int main() {
          const std::filesystem::path p{"/home/ada/archive.tar.gz"};
          std::println("{} {} {}", p.stem().string(), p.extension().string(), p.parent_path().string());
      }
      ```
    choices:
      - {text: "`archive.tar .gz /home/ada`", correct: true}
      - {text: "`archive .tar.gz /home/ada`", correct: false}
      - {text: "`archive.tar gz /home/ada`", correct: false}
      - {text: "`archive.tar .gz /home`", correct: false}
    answer: "`archive.tar .gz /home/ada` : l'extension commence au **dernier** point, et le garde. `stem()` est le nom sans cette extension."
    check:
      output: "archive.tar .gz /home/ada"
  - key: code-joindre
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <print>

      int main() {
          const std::filesystem::path base{"/home/ada"};
          const auto a = base / "photos" / "chat.png";
          const auto b = base / "/etc";
          std::println("{} {}", a.string(), b.string());
      }
      ```
    choices:
      - {text: "`/home/ada/photos/chat.png /etc`", correct: true}
      - {text: "`/home/ada/photos/chat.png /home/ada/etc`", correct: false}
      - {text: "`/home/adaphotoschat.png /home/ada/etc`", correct: false}
      - {text: "`/home/ada/photos/chat.png /home/ada//etc`", correct: false}
    answer: "`/home/ada/photos/chat.png /etc` : `/` ajoute les séparateurs. Mais un morceau de droite absolu, comme `/etc`, remplace tout le chemin de gauche."
    check:
      output: "/home/ada/photos/chat.png /etc"
  - key: code-disque
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          namespace fs = std::filesystem;
          const fs::path chemin = fs::temp_directory_path() / "recallio_fs_taille.txt";
          { std::ofstream f{chemin}; f << "bonjour"; }
          std::print("{} {} ", fs::exists(chemin), fs::file_size(chemin));
          const bool premiere = fs::remove(chemin);
          const bool seconde = fs::remove(chemin);
          std::println("{} {} {}", premiere, seconde, fs::exists(chemin));
      }
      ```
    choices:
      - {text: "`true 7 true false false`", correct: true}
      - {text: "`true 7 true true false`", correct: false}
      - {text: "`true 8 true false false`", correct: false}
      - {text: "`false 0 false false false`", correct: false}
    answer: "`true 7 true false false` : le fichier contient sept octets. `remove` renvoie `true` quand il supprime, et `false`, sans exception, quand il n'y a rien à supprimer."
    check:
      output: "true 7 true false false"
  - key: code-repertoires
    format: code-output
    question: |-
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          namespace fs = std::filesystem;
          const fs::path racine = fs::temp_directory_path() / "recallio_fs_arbre";
          fs::remove_all(racine);
          fs::create_directories(racine / "a" / "b");
          { std::ofstream f{racine / "a" / "b" / "x.txt"}; }
          std::print("{} ", fs::is_directory(racine / "a"));
          const auto supprimes = fs::remove_all(racine);
          std::println("{} {}", supprimes, fs::exists(racine));
      }
      ```
    choices:
      - {text: "`true 4 false`", correct: true}
      - {text: "`true 1 false`", correct: false}
      - {text: "`true 3 false`", correct: false}
      - {text: "`false 4 true`", correct: false}
    answer: "`true 4 false` : `create_directories` crée `racine`, `a` et `b`. `remove_all` supprime ces trois répertoires et le fichier, et renvoie leur nombre : 4."
    check:
      output: "true 4 false"
  - key: bug-file-size-absent
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « terminate called after throwing an instance of
      'std::filesystem::__cxx11::filesystem_error' ». Il devrait afficher `absent`. Quelle correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <print>

      int main() {
          const std::filesystem::path chemin{"/tmp/recallio_fs_inexistant.txt"};
          std::println("{}", std::filesystem::file_size(chemin));
      }
      ```
    choices:
      - {text: "Appeler `file_size(chemin, erreur)` avec un `std::error_code`, et tester `erreur`", correct: true}
      - {text: "Appeler `file_size(chemin.string())`, sur le nom converti en chaîne", correct: false}
      - {text: "Appeler `chemin.size()` à la place de `std::filesystem::file_size`", correct: false}
      - {text: "Déclarer `chemin` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      std::error_code erreur;
      const auto taille = std::filesystem::file_size(chemin, erreur);
      if (erreur) {
          std::println("absent");
      } else {
          std::println("{}", taille);
      }
      ```
      Sans `std::error_code`, les fonctions de `std::filesystem` lancent `filesystem_error`. La version à code
      d'erreur ne lance pas. Attraper l'exception conviendrait aussi.
  - key: bug-concatenation
    format: bug-fix
    question: |-
      Ce programme devrait afficher `/home/ada/notes.txt`. Il affiche `/home/adanotes.txt`. Quelle correction est la
      bonne ?
      ```cpp
      #include <filesystem>
      #include <print>

      int main() {
          std::filesystem::path chemin{"/home/ada"};
          chemin += "notes.txt";
          std::println("{}", chemin.string());
      }
      ```
    choices:
      - {text: "Écrire `chemin /= \"notes.txt\";`", correct: true}
      - {text: "Écrire `chemin -= \"notes.txt\";`", correct: false}
      - {text: "Écrire `chemin += \"notes.txt/\";`", correct: false}
      - {text: "Écrire `chemin = \"notes.txt\";`", correct: false}
    answer: |-
      ```cpp
      chemin /= "notes.txt";
      ```
      `+=` colle le texte tel quel, sans séparateur. `/=` (ou `/`) ajoute un morceau de chemin.
  - key: bug-remove-non-vide
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `filesystem_error` : « Directory not empty ». Quelle correction est
      la bonne ?
      ```cpp
      #include <filesystem>
      #include <fstream>
      #include <print>

      int main() {
          namespace fs = std::filesystem;
          const fs::path dossier = fs::temp_directory_path() / "recallio_fs_plein";
          fs::create_directories(dossier);
          { std::ofstream f{dossier / "a.txt"}; }
          fs::remove(dossier);
          std::println("{}", fs::exists(dossier));
      }
      ```
    choices:
      - {text: "Appeler `fs::remove_all(dossier);`", correct: true}
      - {text: "Appeler `fs::remove(dossier);` deux fois", correct: false}
      - {text: "Appeler `fs::remove(dossier / \"..\");`", correct: false}
      - {text: "Appeler `fs::create_directories(dossier);` de nouveau", correct: false}
    answer: |-
      ```cpp
      fs::remove_all(dossier);
      ```
      `remove` ne supprime un répertoire que s'il est vide. `remove_all` supprime d'abord son contenu.
  - key: bug-parent-manquant
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `filesystem_error` : « No such file or directory ». Le répertoire
      parent n'existe pas encore. Quelle correction est la bonne ?
      ```cpp
      #include <filesystem>
      #include <print>

      int main() {
          namespace fs = std::filesystem;
          const fs::path racine = fs::temp_directory_path() / "recallio_fs_parent";
          fs::remove_all(racine);
          fs::create_directory(racine / "annee" / "mois");
          std::println("{}", fs::exists(racine / "annee" / "mois"));
          fs::remove_all(racine);
      }
      ```
    choices:
      - {text: "Appeler `fs::create_directories`, au pluriel", correct: true}
      - {text: "Appeler `fs::create_directory` deux fois de suite", correct: false}
      - {text: "Appeler `fs::exists` avant `fs::create_directory`", correct: false}
      - {text: "Appeler `fs::create_directory(racine + \"annee/mois\");`", correct: false}
    answer: |-
      ```cpp
      fs::create_directories(racine / "annee" / "mois");
      ```
      `create_directory` ne crée qu'un niveau, et exige que le parent existe. `create_directories` crée toute la
      chaîne manquante.
