notion: random
lesson: |-
  L'en-tête `<random>` sépare deux rôles que `rand()` mélangeait.

  - Un **moteur** produit une suite de bits pseudo-aléatoires. Le plus courant : `std::mt19937` (Mersenne
    Twister).
  - Une **distribution** transforme ces bits en nombres dans l'intervalle et selon la loi voulus.

  ```cpp
  #include <random>

  std::random_device source;                          // de l'entropie du système
  std::mt19937 moteur{source()};                      // le moteur, amorcé par une graine
  std::uniform_int_distribution<int> de{1, 6};        // bornes COMPRISES : 1 à 6

  int tirage = de(moteur);
  ```

  **La graine.** Un moteur est **déterministe** : la même graine donne **la même suite**. C'est une qualité pour
  les tests et la reproduction d'un bug (`std::mt19937 moteur{42};`), et un défaut si l'on oublie de l'amorcer :
  un moteur construit sans argument utilise toujours la même graine par défaut.

  `std::random_device` fournit une graine imprévisible. Il est lent : on s'en sert **une fois**, pour amorcer.

  **Les distributions courantes.**

  | Distribution | Donne |
  |---|---|
  | `std::uniform_int_distribution<int>{a, b}` | un entier de `a` à `b`, **bornes comprises** |
  | `std::uniform_real_distribution<double>{a, b}` | un réel de `a` compris à `b` **exclu** |
  | `std::bernoulli_distribution{p}` | `true` avec la probabilité `p` |
  | `std::normal_distribution<double>{moyenne, ecart}` | une loi normale |

  **Créer le moteur une fois.** Construire un moteur dans la fonction appelée, à chaque tirage, coûte cher, et avec
  une graine fixe redonne toujours **le même nombre**. On le crée une fois, et on le **passe par référence** : le
  passer par valeur le copierait, et chaque appel repartirait du même état.

  **Pourquoi pas `rand()`.**

  - `rand() % 6` est **biaisé** : les petites valeurs sortent un peu plus souvent, sauf si l'intervalle divise
    exactement `RAND_MAX + 1`.
  - Sa qualité et son étendue (`RAND_MAX` peut ne valoir que 32767) dépendent de l'implémentation.
  - Il repose sur un **état global** caché, partagé par tout le programme, et peu sûr entre threads.

  **Mélanger et choisir.**

  ```cpp
  std::shuffle(v.begin(), v.end(), moteur);
  ```

  `std::shuffle` remplace `std::random_shuffle`, retirée en C++17.

  **Deux limites.**

  - Rien de tout cela n'est fait pour la **cryptographie** : un mot de passe ou un jeton demandent une bibliothèque
    spécialisée.
  - La suite d'un **moteur** est fixée par le standard, mais pas l'algorithme des **distributions** : la même
    graine peut donner d'autres tirages avec une autre bibliothèque.

  **En entretien** : « Un moteur, `std::mt19937`, amorcé une fois par `std::random_device`, et une distribution
  qui donne l'intervalle : `uniform_int_distribution` a ses deux bornes comprises. J'évite `rand() % n`, biaisé et
  à état global. Une graine fixe rend les tests reproductibles. »
cards:
  - key: deux-roles
    format: course
    question: "Quels sont les deux éléments que `<random>` sépare ?"
    choices:
      - {text: "Le moteur, qui produit des bits, et la distribution, qui en fait des nombres dans un intervalle", correct: true}
      - {text: "La graine, qui produit des nombres, et le moteur, qui les range dans un vecteur", correct: false}
      - {text: "Le générateur, qui tire au sort, et le vérificateur, qui écarte les doublons", correct: false}
      - {text: "L'horloge, qui donne l'heure, et la distribution, qui la convertit en nombre", correct: false}
    answer: "`std::mt19937` est un moteur ; `std::uniform_int_distribution` est une distribution. On appelle la distribution en lui passant le moteur : `de(moteur)`."
  - key: graine
    format: course
    question: "Que se passe-t-il quand deux moteurs `std::mt19937` sont construits avec la même graine ?"
    choices:
      - {text: "Ils produisent exactement la même suite de nombres", correct: true}
      - {text: "Ils produisent deux suites différentes, tirées au hasard", correct: false}
      - {text: "Le second lance une exception : une graine ne sert qu'une fois", correct: false}
      - {text: "Ils partagent un même état, et s'avancent l'un l'autre", correct: false}
    answer: "Un moteur est déterministe. C'est utile pour rejouer un test ; pour de l'imprévisible, on l'amorce avec `std::random_device`."
  - key: bornes
    format: course
    question: "Quels nombres peut donner `std::uniform_int_distribution<int>{1, 6}` ?"
    choices:
      - {text: "De 1 à 6, les deux bornes comprises", correct: true}
      - {text: "De 1 à 5 : la borne haute est exclue", correct: false}
      - {text: "De 2 à 6 : la borne basse est exclue", correct: false}
      - {text: "De 0 à 6 : la première borne est ignorée", correct: false}
    answer: "Les deux bornes sont comprises : c'est un dé. La distribution réelle, `uniform_real_distribution`, exclut au contraire sa borne haute."
  - key: pourquoi-pas-rand
    format: course
    question: "Quel est le défaut de `rand() % 6` pour tirer un nombre de 0 à 5 ?"
    choices:
      - {text: "Le résultat est biaisé, et `rand` repose sur un état global de qualité variable", correct: true}
      - {text: "Le résultat est toujours le même, quelle que soit la graine donnée à `srand`", correct: false}
      - {text: "Le résultat peut être négatif, car `rand` renvoie un entier signé", correct: false}
      - {text: "Le résultat est trop lent à calculer pour une boucle", correct: false}
    answer: "Le modulo favorise légèrement les petites valeurs, et la qualité de `rand` dépend de l'implémentation. Une distribution corrige le biais."
  - key: vf-defaut
    format: true-false
    question: "Un `std::mt19937` construit sans argument donne une suite différente à chaque exécution."
    truth: false
    answer: "Il utilise une graine par défaut, toujours la même : la suite est identique à chaque lancement."
  - key: vf-random-device
    format: true-false
    question: "`std::random_device` sert le plus souvent à fournir la graine d'un moteur."
    truth: true
    answer: "Il puise dans l'entropie du système. Comme il est lent, on ne l'appelle qu'une fois, pour amorcer."
  - key: vf-crypto
    format: true-false
    question: "`std::mt19937` convient pour générer un mot de passe ou un jeton de session."
    truth: false
    answer: "Sa suite se prédit à partir de quelques centaines de sorties. La cryptographie demande une bibliothèque spécialisée."
  - key: vf-shuffle
    format: true-false
    question: "`std::shuffle` prend un moteur en troisième argument."
    truth: true
    answer: "`std::shuffle(v.begin(), v.end(), moteur);`. `std::random_shuffle`, qui s'appuyait sur `rand`, a été retirée en C++17."
  - key: qcm-tirer
    format: multiple-choice
    question: "`moteur` est un `std::mt19937`, et `de` une `std::uniform_int_distribution<int>`. Comment tires-tu un nombre ?"
    choices:
      - {text: "`de(moteur)`", correct: true}
      - {text: "`moteur(de)`", correct: false}
      - {text: "`de.next()`", correct: false}
      - {text: "`moteur.random(de)`", correct: false}
    answer: "La distribution s'appelle comme une fonction, et reçoit le moteur, qu'elle fait avancer."
  - key: qcm-reel
    format: multiple-choice
    question: "Quelle distribution donne un `double` au hasard entre 0 et 1 ?"
    choices:
      - {text: "`std::uniform_real_distribution<double>{0.0, 1.0}`", correct: true}
      - {text: "`std::uniform_int_distribution<double>{0.0, 1.0}`", correct: false}
      - {text: "`std::bernoulli_distribution{0.5}`", correct: false}
      - {text: "`std::normal_distribution<double>{0.0, 1.0}`", correct: false}
    answer: "`uniform_real_distribution` pour les réels. `uniform_int_distribution` n'accepte que des types entiers ; Bernoulli donne un booléen ; la loi normale n'est pas bornée."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::mt19937` ?"
    choices:
      - {text: "`<random>`", correct: true}
      - {text: "`<cstdlib>`", correct: false}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<numeric>`", correct: false}
    answer: "`<random>` déclare les moteurs et les distributions. `<cstdlib>` déclare l'ancien `rand`."
  - key: qcm-passer
    format: multiple-choice
    question: "Comment une fonction qui tire un nombre reçoit-elle le moteur ?"
    choices:
      - {text: "Par référence : `int tirer(std::mt19937& moteur)`", correct: true}
      - {text: "Par valeur : `int tirer(std::mt19937 moteur)`", correct: false}
      - {text: "Par référence constante : `int tirer(const std::mt19937& moteur)`", correct: false}
      - {text: "Elle n'en reçoit pas : elle en construit un à chaque appel", correct: false}
    answer: "Tirer fait avancer l'état du moteur. Par valeur, c'est une copie qui avance, et chaque appel redonne le même nombre ; par référence constante, cela ne compile pas."
  - key: trous-moteur
    format: fill-in
    question: |-
      Complète avec le moteur Mersenne Twister :
      ```cpp
      std::random_device source;
      std::___ moteur{source()};
      ```
    blanks:
      - [mt19937, mt19937_64]
    answer: "`std::mt19937` : le moteur généraliste de la bibliothèque."
  - key: trous-distribution
    format: fill-in
    question: |-
      Complète pour tirer un entier de 1 à 6 :
      ```cpp
      std::___<int> de{1, 6};
      const int tirage = de(moteur);
      ```
    blanks:
      - [uniform_int_distribution]
    answer: "`std::uniform_int_distribution` : chaque entier de l'intervalle a la même probabilité."
  - key: trous-shuffle
    format: fill-in
    question: |-
      Complète pour mélanger le vecteur :
      ```cpp
      std::___(cartes.begin(), cartes.end(), moteur);
      ```
    blanks:
      - [shuffle]
    answer: "`std::shuffle`, dans `<algorithm>`, mélange avec le moteur donné."
  - key: trous-random-device
    format: fill-in
    question: |-
      Complète avec la source d'entropie qui amorce le moteur :
      ```cpp
      std::___ source;
      std::mt19937 moteur{source()};
      ```
    blanks:
      - [random_device]
    answer: "`std::random_device` fournit une graine imprévisible."
  - key: code-meme-graine
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <random>

      int main() {
          std::mt19937 a{42};
          std::mt19937 b{42};
          std::mt19937 c{43};
          const auto x = a();
          const auto y = b();
          const auto z = c();
          std::println("{} {}", x == y, x == z);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : la même graine donne la même suite. Une graine différente en donne une autre."
    check:
      output: "true false"
  - key: code-bornes
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <random>

      int main() {
          std::mt19937 moteur{7};
          std::uniform_int_distribution<int> de{1, 6};
          bool dans_les_bornes = true;
          for (int i = 0; i < 1000; ++i) {
              const int tirage = de(moteur);
              if (tirage < 1 || tirage > 6) {
                  dans_les_bornes = false;
              }
          }
          std::println("{} {} {}", dans_les_bornes, de.min(), de.max());
      }
      ```
    choices:
      - {text: "`true 1 6`", correct: true}
      - {text: "`false 1 6`", correct: false}
      - {text: "`true 1 5`", correct: false}
      - {text: "`true 0 6`", correct: false}
    answer: "`true 1 6` : tous les tirages sont entre 1 et 6, bornes comprises. `min()` et `max()` rendent les bornes de la distribution."
    check:
      output: "true 1 6"
  - key: code-copie-moteur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <random>

      unsigned par_valeur(std::mt19937 moteur) {
          return moteur();
      }

      unsigned par_reference(std::mt19937& moteur) {
          return moteur();
      }

      int main() {
          std::mt19937 moteur{1};
          const bool copies = par_valeur(moteur) == par_valeur(moteur);
          const bool references = par_reference(moteur) == par_reference(moteur);
          std::println("{} {}", copies, references);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : par valeur, chaque appel reçoit une copie du même état, et tire le même nombre. Par référence, le moteur avance : deux tirages successifs diffèrent."
    check:
      output: "true false"
  - key: code-shuffle
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <numeric>
      #include <print>
      #include <random>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3, 4, 5};
          std::mt19937 moteur{3};
          std::shuffle(v.begin(), v.end(), moteur);
          std::println("{} {}", v.size(), std::accumulate(v.begin(), v.end(), 0));
      }
      ```
    choices:
      - {text: "`5 15`", correct: true}
      - {text: "`5 0`", correct: false}
      - {text: "`0 15`", correct: false}
      - {text: "Un résultat différent à chaque exécution", correct: false}
    answer: "`5 15` : mélanger change l'ordre, pas les éléments. La taille et la somme restent les mêmes."
    check:
      output: "5 15"
  - key: bug-moteur-recree
    format: bug-fix
    question: |-
      Ce programme devrait afficher `false` : deux lancers de dé successifs n'ont aucune raison d'être toujours
      égaux. Il affiche `true` à chaque exécution. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <random>

      int lancer() {
          std::mt19937 moteur{2024};
          std::uniform_int_distribution<int> de{1, 1'000'000};
          return de(moteur);
      }

      int main() {
          std::println("{}", lancer() == lancer());
      }
      ```
    choices:
      - {text: "Créer le moteur une fois dans `main`, et le passer à `lancer` par référence", correct: true}
      - {text: "Créer le moteur une fois dans `main`, et le passer à `lancer` par valeur", correct: false}
      - {text: "Élargir la distribution à l'intervalle de 1 à un milliard", correct: false}
      - {text: "Déclarer la distribution `de` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      int lancer(std::mt19937& moteur) {
          std::uniform_int_distribution<int> de{1, 1'000'000};
          return de(moteur);
      }
      ```
      Un moteur recréé avec la même graine repart du même état : il redonne le même premier nombre. Un seul moteur,
      passé par référence, avance d'un tirage à l'autre.
  - key: bug-borne-exclue
    format: bug-fix
    question: |-
      Ce programme tire des indices pour un tableau de dix éléments, de 0 à 9. Il devrait afficher `true`, et
      affiche `false` : l'indice 10 sort parfois. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <random>

      int main() {
          std::mt19937 moteur{5};
          std::uniform_int_distribution<int> indice{0, 10};
          bool valides = true;
          for (int i = 0; i < 1000; ++i) {
              if (indice(moteur) > 9) {
                  valides = false;
              }
          }
          std::println("{}", valides);
      }
      ```
    choices:
      - {text: "Déclarer la distribution avec les bornes `{0, 9}`", correct: true}
      - {text: "Déclarer la distribution avec les bornes `{1, 10}`", correct: false}
      - {text: "Déclarer le moteur avec la graine `0`", correct: false}
      - {text: "Déclarer la distribution avec le type `unsigned`", correct: false}
    answer: |-
      ```cpp
      std::uniform_int_distribution<int> indice{0, 9};
      ```
      Les deux bornes sont comprises. Pour un tableau de `n` éléments, l'intervalle des indices est `{0, n - 1}`.
  - key: bug-moteur-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `false` : trois tirages ne sont pas tous égaux. Il affiche `true`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <random>

      int tirer(std::mt19937 moteur) {
          std::uniform_int_distribution<int> de{1, 1'000'000};
          return de(moteur);
      }

      int main() {
          std::mt19937 moteur{11};
          const int a = tirer(moteur);
          const int b = tirer(moteur);
          const int c = tirer(moteur);
          std::println("{}", a == b && b == c);
      }
      ```
    choices:
      - {text: "Recevoir le moteur par référence : `int tirer(std::mt19937& moteur)`", correct: true}
      - {text: "Recevoir le moteur par référence constante : `const std::mt19937& moteur`", correct: false}
      - {text: "Appeler `tirer(std::move(moteur))` à chacun des trois appels", correct: false}
      - {text: "Déclarer le moteur de `main` avec le mot-clé `static`", correct: false}
    answer: |-
      ```cpp
      int tirer(std::mt19937& moteur) {
      ```
      Par valeur, la fonction fait avancer une copie : le moteur de `main` ne bouge pas, et chaque appel reçoit le
      même état. Une distribution a besoin de modifier le moteur : une référence constante ne compile pas.
  - key: bug-real-pour-entier
    format: bug-fix
    question: |-
      Le compilateur refuse cette distribution : « template argument must be an integral type ». Le programme devrait
      tirer un `double` entre 0 et 1. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <random>

      int main() {
          std::mt19937 moteur{9};
          std::uniform_int_distribution<double> proportion{0.0, 1.0};
          const double p = proportion(moteur);
          std::println("{}", p >= 0.0 && p < 1.0);
      }
      ```
    choices:
      - {text: "Écrire `std::uniform_real_distribution<double> proportion{0.0, 1.0};`", correct: true}
      - {text: "Écrire `std::uniform_int_distribution<int> proportion{0.0, 1.0};`", correct: false}
      - {text: "Écrire `std::uniform_int_distribution<float> proportion{0.0, 1.0};`", correct: false}
      - {text: "Écrire `std::uniform_int_distribution<> proportion{0.0, 1.0};`", correct: false}
    answer: |-
      ```cpp
      std::uniform_real_distribution<double> proportion{0.0, 1.0};
      ```
      `uniform_int_distribution` n'accepte que des types entiers. Pour un réel, c'est `uniform_real_distribution`,
      dont la borne haute est exclue.
  - key: situation-test-instable
    format: scenario
    question: |-
      Un test qui s'appuie sur des données tirées au hasard échoue une fois sur cinquante, et personne n'arrive à
      reproduire l'échec. Le moteur est amorcé par `std::random_device`. Que proposes-tu ?
    choices:
      - {text: "Amorcer avec une graine choisie, affichée par le test : un échec se rejoue à l'identique", correct: true}
      - {text: "Relancer le test trois fois, et ne signaler un échec que s'il échoue trois fois", correct: false}
      - {text: "Remplacer le moteur par `rand()`, dont la suite est plus régulière", correct: false}
      - {text: "Supprimer le test, puisqu'il dépend du hasard et ne peut pas être fiable", correct: false}
    answer: |-
      Un moteur est déterministe : avec la même graine, il rejoue la même suite. En fixant la graine, ou en
      l'affichant quand le test échoue, on retrouve exactement les données qui ont révélé le bug.
  - key: situation-jeton
    format: scenario
    question: |-
      Un collègue génère les jetons de réinitialisation de mot de passe avec `std::mt19937`, amorcé par l'heure
      courante. Que lui dis-tu ?
    choices:
      - {text: "Que ces jetons sont prévisibles : il faut un générateur cryptographique, d'une bibliothèque dédiée", correct: true}
      - {text: "Que c'est correct, à condition d'utiliser `std::mt19937_64` pour allonger les jetons", correct: false}
      - {text: "Que c'est correct, à condition de tirer chaque jeton avec une distribution uniforme", correct: false}
      - {text: "Que `rand()` serait plus sûr, car son algorithme n'est pas publié", correct: false}
    answer: |-
      Une graine tirée de l'heure se devine, et l'état d'un Mersenne Twister se reconstitue à partir de ses
      sorties. `<random>` sert à la simulation et aux jeux, pas à la sécurité.
  - key: situation-biais
    format: scenario
    question: |-
      Une simulation tire des millions de nombres de 0 à 99 avec `rand() % 100`, sur une plate-forme où `RAND_MAX`
      vaut 32767. Les statisticiens trouvent un léger excès de petites valeurs. Pourquoi, et que proposes-tu ?
    choices:
      - {text: "32768 n'est pas un multiple de 100 : le modulo est biaisé ; une `uniform_int_distribution` le corrige", correct: true}
      - {text: "`rand` renvoie des nombres négatifs, que le modulo transforme en petites valeurs ; il faut `abs`", correct: false}
      - {text: "`rand` n'a pas été amorcé par `srand` ; l'appeler avant chaque tirage corrige le biais", correct: false}
      - {text: "Le modulo arrondit vers le bas ; il faut diviser par 100 au lieu de prendre le reste", correct: false}
    answer: |-
      Les 32768 valeurs possibles ne se répartissent pas également en 100 classes : les valeurs de 0 à 67 ont une
      occurrence de plus. Une distribution rejette les tirages en trop, et donne des probabilités égales.
  - key: situation-threads
    format: scenario
    question: |-
      Quatre threads tirent des nombres dans un même `std::mt19937` global, sans synchronisation. Les résultats
      de la simulation sont parfois aberrants. Que proposes-tu ?
    choices:
      - {text: "Un moteur par thread, chacun avec sa propre graine", correct: true}
      - {text: "Un `std::random_device` global, à la place du moteur", correct: false}
      - {text: "Le même moteur, déclaré `volatile`", correct: false}
      - {text: "Le même moteur, passé par valeur à chaque thread, avec la même graine", correct: false}
    answer: |-
      Un tirage modifie l'état du moteur : le partager sans verrou est une course aux données. Un moteur par thread
      (`thread_local`, ou local à la fonction du thread) supprime le partage. Des copies de même graine donneraient
      les mêmes nombres dans les quatre threads.
