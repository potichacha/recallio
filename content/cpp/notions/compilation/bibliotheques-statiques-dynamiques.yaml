notion: bibliotheques-statiques-dynamiques
lesson: |-
  Une **bibliothèque** est du code déjà compilé, prêt à être réutilisé : des fichiers objets regroupés, livrés avec
  les **en-têtes** qui déclarent ce qu'ils contiennent. Il en existe deux sortes, qui diffèrent par le **moment**
  où leur code rejoint le programme.

  | | Bibliothèque statique | Bibliothèque dynamique (partagée) |
  |---|---|---|
  | Fichier (Linux) | `libnom.a` | `libnom.so` |
  | Fichier (Windows) | `nom.lib` | `nom.dll` |
  | Le code rejoint le programme | **à l'édition de liens** : il est recopié dans l'exécutable | **au lancement** : il est chargé en mémoire par le système |
  | Exécutable | plus gros, **autonome** | plus petit, **dépend** du fichier `.so` |
  | Mise à jour de la bibliothèque | il faut **relier** le programme | il suffit de remplacer le `.so`, s'il reste compatible |
  | Mémoire | chaque programme a sa copie | une seule copie, partagée entre les programmes |

  **Statique.** Une archive (`ar`) de fichiers objets. L'éditeur de liens y prend les fichiers objets dont le
  programme a besoin, et les recopie dans l'exécutable. Une fois lié, le programme n'a plus besoin du `.a`.

  ```
  g++ -c outils.cpp
  ar rcs liboutils.a outils.o
  g++ main.cpp -L. -loutils -o programme
  ```

  **Dynamique.** L'exécutable ne contient qu'une **référence** à la bibliothèque. Au lancement, le chargeur
  dynamique du système la cherche, la charge, et relie les appels.

  ```
  g++ -shared -fPIC outils.cpp -o liboutils.so
  g++ main.cpp -L. -loutils -o programme
  ```

  Si le `.so` est introuvable au lancement, le programme ne démarre pas : « error while loading shared libraries ».
  `ldd programme` liste les bibliothèques dont il dépend.

  **Les options de la commande.**

  - `-lnom` lie la bibliothèque `libnom` (`.so` de préférence, `.a` sinon) ;
  - `-Ldossier` ajoute un répertoire où la chercher ;
  - `-Idossier` ajoute un répertoire d'en-têtes : cela concerne le **compilateur**, pas l'éditeur de liens ;
  - `-static` demande les versions statiques.

  L'ordre compte : une bibliothèque se place **après** les fichiers qui s'en servent.

  **L'ABI.** Remplacer un `.so` sans recompiler suppose qu'il garde la même **interface binaire** : taille et
  disposition des classes, noms des symboles, conventions d'appel. Ajouter un membre à une classe publique la
  casse. C'est plus strict que la compatibilité du code source, et c'est la difficulté des bibliothèques
  dynamiques en C++.

  **Les bibliothèques d'en-têtes** (*header-only*). Faites seulement de templates et de fonctions `inline`, elles
  n'ont rien à lier : un `#include` suffit. C'est le cas de doctest, et d'une bonne part de la bibliothèque
  standard. Le prix : des compilations plus longues.

  **Comment choisir.**

  - **Statique** : un exécutable simple à déployer, sans dépendance à installer.
  - **Dynamique** : du code partagé par plusieurs programmes, des modules chargés à la demande (*plugins*), des
    mises à jour de sécurité sans relier.

  Avec CMake : `add_library(outils STATIC ...)` ou `add_library(outils SHARED ...)`.

  **En entretien** : « Une bibliothèque statique est recopiée dans l'exécutable à l'édition de liens : binaire
  autonome, plus gros. Une bibliothèque dynamique est chargée au lancement : binaire plus petit, code partagé et
  remplaçable, mais une dépendance à l'exécution, et la compatibilité binaire à respecter. »
cards:
  - key: difference
    format: course
    question: "Quelle différence entre une bibliothèque statique et une bibliothèque dynamique ?"
    choices:
      - {text: "La statique est recopiée dans l'exécutable à l'édition de liens ; la dynamique est chargée au lancement", correct: true}
      - {text: "La statique est chargée au lancement du programme ; la dynamique est recopiée dans l'exécutable", correct: false}
      - {text: "La statique contient du code source ; la dynamique contient du code machine déjà compilé", correct: false}
      - {text: "La statique ne contient que des variables ; la dynamique ne contient que des fonctions", correct: false}
    answer: "Les deux sont du code compilé. Ce qui change, c'est le moment où il rejoint le programme, et donc ce que l'exécutable transporte."
  - key: avantage-statique
    format: course
    question: "Quel est l'avantage d'un programme lié à des bibliothèques statiques ?"
    choices:
      - {text: "L'exécutable est autonome : aucune bibliothèque à installer à côté", correct: true}
      - {text: "L'exécutable est plus petit, car le code est partagé", correct: false}
      - {text: "La bibliothèque se met à jour sans relier le programme", correct: false}
      - {text: "Le programme démarre sans passer par `main`", correct: false}
    answer: "Tout le code nécessaire est dans le binaire. En contrepartie, il est plus gros, et corriger la bibliothèque oblige à relier le programme."
  - key: avantage-dynamique
    format: course
    question: "Quel est l'avantage d'une bibliothèque dynamique utilisée par dix programmes ?"
    choices:
      - {text: "Son code existe une seule fois, et se corrige sans relier les dix programmes", correct: true}
      - {text: "Son code est recopié dans chaque programme, qui devient autonome", correct: false}
      - {text: "Son code s'exécute dix fois plus vite que celui d'une statique", correct: false}
      - {text: "Son code n'a pas besoin d'en-têtes pour être appelé", correct: false}
    answer: "Une seule copie sur le disque et en mémoire, et une mise à jour qui profite à tous, tant que l'interface binaire ne change pas."
  - key: abi
    format: course
    question: "Qu'exige le remplacement d'une bibliothèque dynamique sans recompiler les programmes ?"
    choices:
      - {text: "Qu'elle garde la même interface binaire (ABI) : disposition des classes, symboles", correct: true}
      - {text: "Qu'elle garde exactement la même taille de fichier sur le disque", correct: false}
      - {text: "Qu'elle soit compilée le même jour que les programmes qui l'utilisent", correct: false}
      - {text: "Qu'elle ne contienne aucune classe, seulement des fonctions libres", correct: false}
    answer: "Le programme a été compilé avec une certaine idée de la taille des objets et du nom des fonctions. Si le nouveau binaire en diffère, le comportement est indéfini."
  - key: vf-statique-autonome
    format: true-false
    question: "Un programme lié statiquement à une bibliothèque a encore besoin du fichier `.a` pour s'exécuter."
    truth: false
    answer: "Le code a été recopié dans l'exécutable. L'archive ne sert qu'à l'édition de liens."
  - key: vf-so-introuvable
    format: true-false
    question: "Un programme lié à une bibliothèque dynamique introuvable échoue au lancement."
    truth: true
    answer: "Le chargeur dynamique s'arrête : « error while loading shared libraries ». L'édition de liens, elle, avait réussi."
  - key: vf-header-only
    format: true-false
    question: "Une bibliothèque faite seulement d'en-têtes demande l'option `-l` à l'édition de liens."
    truth: false
    answer: "Il n'y a rien à lier : tout son code est compilé avec le fichier qui l'inclut."
  - key: vf-option-i
    format: true-false
    question: "L'option `-I` indique à l'éditeur de liens où trouver les bibliothèques."
    truth: false
    answer: "`-I` donne au compilateur un répertoire d'en-têtes. Pour les bibliothèques, c'est `-L` (le répertoire) et `-l` (le nom)."
  - key: qcm-extension
    format: multiple-choice
    question: "Sous Linux, quelle extension porte une bibliothèque dynamique ?"
    choices:
      - {text: "`.so`", correct: true}
      - {text: "`.a`", correct: false}
      - {text: "`.o`", correct: false}
      - {text: "`.hpp`", correct: false}
    answer: "`.so` pour *shared object*. `.a` est une archive statique, `.o` un fichier objet. Sous Windows : `.dll`."
  - key: qcm-lier
    format: multiple-choice
    question: "Quelle option lie le programme à la bibliothèque `libmaths.so` ?"
    choices:
      - {text: "`-lmaths`", correct: true}
      - {text: "`-Imaths`", correct: false}
      - {text: "`-Lmaths`", correct: false}
      - {text: "`-Dmaths`", correct: false}
    answer: "`-lnom` cherche `libnom.so` ou `libnom.a`. `-L` ajoute un répertoire de recherche, `-I` un répertoire d'en-têtes, `-D` définit une macro."
  - key: qcm-dependances
    format: multiple-choice
    question: "Quelle commande liste les bibliothèques dynamiques dont dépend un exécutable, sous Linux ?"
    choices:
      - {text: "`ldd programme`", correct: true}
      - {text: "`ar programme`", correct: false}
      - {text: "`g++ -c programme`", correct: false}
      - {text: "`make programme`", correct: false}
    answer: "`ldd` affiche chaque bibliothèque attendue, et où le système la trouve, ou « not found »."
  - key: qcm-cmake
    format: multiple-choice
    question: "Avec CMake, quelle commande crée une bibliothèque dynamique ?"
    choices:
      - {text: "`add_library(outils SHARED outils.cpp)`", correct: true}
      - {text: "`add_library(outils STATIC outils.cpp)`", correct: false}
      - {text: "`add_executable(outils SHARED outils.cpp)`", correct: false}
      - {text: "`add_library(outils DYNAMIC outils.cpp)`", correct: false}
    answer: "`SHARED` pour une bibliothèque partagée, `STATIC` pour une archive. Sans mot-clé, la variable `BUILD_SHARED_LIBS` décide."
  - key: situation-deploiement
    format: scenario
    question: |-
      Tu livres un outil en ligne de commande à des clients dont tu ne maîtrises pas les machines. Il utilise
      trois bibliothèques. Comment les lies-tu, pour éviter les problèmes d'installation ?
    choices:
      - {text: "Statiquement : l'exécutable contient tout, et fonctionne sans rien installer", correct: true}
      - {text: "Dynamiquement : l'exécutable est plus petit, et trouve toujours ses bibliothèques", correct: false}
      - {text: "Sans les lier : le client compile lui-même les trois bibliothèques", correct: false}
      - {text: "En recopiant leurs en-têtes dans l'exécutable, à la place du code", correct: false}
    answer: |-
      Un binaire statique ne dépend pas de ce qui est installé chez le client, ni de la version qui s'y trouve. Le
      prix est sa taille, et le fait de devoir le relivrer pour corriger une bibliothèque.
  - key: situation-securite
    format: scenario
    question: |-
      Une faille est découverte dans une bibliothèque de chiffrement utilisée par quarante services de ton
      entreprise. Dans quel cas la corriges-tu le plus vite ?
    choices:
      - {text: "Si les services y sont liés dynamiquement : on remplace le `.so`, et on les redémarre", correct: true}
      - {text: "Si les services y sont liés statiquement : il n'y a rien à faire", correct: false}
      - {text: "Si la bibliothèque est faite seulement d'en-têtes : il n'y a rien à relier", correct: false}
      - {text: "Si chaque service a recopié le code source de la bibliothèque", correct: false}
    answer: |-
      Avec une bibliothèque dynamique, une seule mise à jour profite à tous les programmes, pourvu que l'interface
      binaire soit conservée. En statique, ou avec des en-têtes seuls, il faut reconstruire et relivrer les
      quarante services.
  - key: situation-lancement
    format: scenario
    question: |-
      Ton programme compile et se lie sans erreur. Sur le serveur de production, il refuse de démarrer : « error
      while loading shared libraries: libjson.so.3: cannot open shared object file ». Que s'est-il passé ?
    choices:
      - {text: "La bibliothèque dynamique n'est pas installée sur le serveur, ou pas là où le système la cherche", correct: true}
      - {text: "L'édition de liens a échoué sur ta machine, sans que tu le remarques", correct: false}
      - {text: "Le fichier d'en-tête de la bibliothèque manque sur le serveur de production", correct: false}
      - {text: "Le programme a été compilé sans l'option `-Wall`, qui installe les bibliothèques", correct: false}
    answer: |-
      L'exécutable ne contient qu'une référence au `.so`, résolue au lancement. Il faut installer la bibliothèque
      sur le serveur, dans la bonne version, ou lier statiquement. Les en-têtes ne servent qu'à la compilation.
  - key: situation-abi
    format: scenario
    question: |-
      Ton équipe publie une bibliothèque dynamique. Tu ajoutes un membre privé à une classe de son en-tête public,
      et tu livres le nouveau `.so`. Des programmes clients, non recompilés, se mettent à planter. Pourquoi ?
    choices:
      - {text: "La taille de la classe a changé : l'interface binaire n'est plus celle qu'ils ont compilée", correct: true}
      - {text: "Un membre privé n'a pas le droit d'être ajouté après la première version", correct: false}
      - {text: "Le nouveau fichier `.so` porte une date plus récente que les programmes", correct: false}
      - {text: "Les programmes clients doivent être liés statiquement pour voir le membre", correct: false}
    answer: |-
      Les clients allouent les objets avec l'ancienne taille, et la bibliothèque écrit dans le nouveau membre,
      au-delà. `private` protège l'accès dans le code source, pas la disposition en mémoire. L'idiome « pimpl »
      cache les membres derrière un pointeur, pour garder l'ABI stable.
  - key: definition-statique
    format: definition
    question: "Qu'est-ce qu'une bibliothèque statique ?"
    choices:
      - {text: "Une archive de fichiers objets, recopiés dans l'exécutable à l'édition de liens", correct: true}
      - {text: "Un fichier chargé en mémoire par le système au lancement du programme", correct: false}
      - {text: "Un ensemble d'en-têtes sans aucun code compilé", correct: false}
      - {text: "Une bibliothèque dont les fonctions sont toutes déclarées `static`", correct: false}
    answer: "Sous Linux, un fichier `libnom.a`, fabriqué avec `ar`. Le mot « statique » parle de l'édition de liens, pas du mot-clé `static`."
  - key: definition-dynamique
    format: definition
    question: "Qu'est-ce qu'une bibliothèque dynamique ?"
    choices:
      - {text: "Du code compilé dans un fichier à part, chargé par le système au lancement du programme", correct: true}
      - {text: "Du code compilé recopié dans chaque exécutable, à l'édition de liens", correct: false}
      - {text: "Du code source compilé à chaque lancement du programme", correct: false}
      - {text: "Du code qui alloue toute sa mémoire avec `new`", correct: false}
    answer: "Aussi appelée bibliothèque partagée : `.so` sous Linux, `.dll` sous Windows, `.dylib` sous macOS."
  - key: definition-abi
    format: definition
    question: "Qu'est-ce que l'ABI d'une bibliothèque ?"
    choices:
      - {text: "Son interface binaire : disposition des objets, noms des symboles, conventions d'appel", correct: true}
      - {text: "Son interface de programmation : les fonctions déclarées dans ses en-têtes", correct: false}
      - {text: "Son numéro de version, écrit dans le nom du fichier", correct: false}
      - {text: "Sa licence d'utilisation, livrée avec le code", correct: false}
    answer: "*Application Binary Interface*. L'API se respecte en recompilant ; l'ABI doit rester identique pour que d'anciens binaires fonctionnent avec la nouvelle bibliothèque."
  - key: definition-header-only
    format: definition
    question: "Qu'est-ce qu'une bibliothèque « header-only » ?"
    choices:
      - {text: "Une bibliothèque faite seulement d'en-têtes : un `#include` suffit, rien à lier", correct: true}
      - {text: "Une bibliothèque livrée sans en-têtes : seulement un fichier `.so`", correct: false}
      - {text: "Une bibliothèque dont un seul en-tête peut être inclus par programme", correct: false}
      - {text: "Une bibliothèque qui ne contient que des déclarations, sans aucun code", correct: false}
    answer: "Tout son code est dans les en-têtes, sous forme de templates et de fonctions `inline`. Simple à utiliser, au prix de compilations plus longues."
