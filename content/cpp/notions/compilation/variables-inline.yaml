notion: variables-inline
lesson: |-
  Une variable ou une constante qu'on veut partager entre plusieurs fichiers se déclare dans un en-tête. Mais une
  variable **définie** dans un en-tête existe dans chaque fichier qui l'inclut : l'éditeur de liens répond
  « multiple definition ». Depuis C++17, **`inline`** règle le problème.

  ```cpp
  // config.hpp
  #pragma once

  inline int niveau_journal = 2;             // une seule variable pour tout le programme
  inline constexpr int taille_max = 1024;    // une seule constante
  ```

  **Ce que veut dire `inline`.** Rien à voir avec l'insertion du code : `inline` autorise **plusieurs définitions
  identiques**, une par unité de traduction, que l'éditeur de liens **fusionne en une seule entité**. C'est la
  même règle que pour les fonctions `inline`.

  **Avant C++17**, il fallait deux fichiers :

  ```cpp
  // config.hpp
  extern int niveau_journal;        // déclaration

  // config.cpp
  int niveau_journal = 2;           // l'unique définition
  ```

  **Les constantes dans un en-tête.**

  | Écriture | Combien d'entités | À retenir |
  |---|---|---|
  | `const int n = 10;` | une **par fichier** (liaison interne) | ça compile, mais chaque fichier a sa copie |
  | `constexpr int n = 10;` | une par fichier | idem : `constexpr` implique `const` |
  | `inline constexpr int n = 10;` | **une seule** | la forme recommandée |
  | `#define N 10` | aucune | ni type, ni portée : à éviter |

  Pour un `int`, une copie par fichier ne coûte rien. La différence se voit quand on prend l'**adresse** de la
  constante, ou qu'elle est grosse (un tableau, une chaîne) : sans `inline`, elle est dupliquée.

  **Les membres statiques.** Un membre `static` d'une classe devait être défini hors de la classe, dans un `.cpp`.
  Avec `inline`, il se définit sur place :

  ```cpp
  struct Compteur {
      static inline int instances = 0;            // défini ici
      static constexpr int limite = 100;          // constexpr : implicitement inline
  };
  ```

  **`inline` ou `static` ?** Dans un en-tête, `static int x = 0;` crée une variable **par fichier** : modifier
  l'une ne change pas les autres. `inline int x = 0;` crée **une** variable partagée.

  **Les précautions.**

  - Toutes les définitions doivent être **identiques** : c'est le cas quand elles viennent du même en-tête.
  - Une variable `inline` globale modifiable reste un **état global** : `inline` règle l'édition de liens, pas la
    conception.
  - L'ordre d'initialisation entre variables globales de fichiers différents n'est pas garanti.

  **En entretien** : « Depuis C++17, `inline` sur une variable permet de la définir dans un en-tête : l'éditeur de
  liens fusionne les définitions. Pour une constante partagée, j'écris `inline constexpr` ; pour un membre
  statique, `static inline`. Sans `inline`, une constante d'en-tête est dupliquée dans chaque fichier. »
cards:
  - key: role
    format: course
    question: "Que permet `inline` devant une variable globale, depuis C++17 ?"
    choices:
      - {text: "De la définir dans un en-tête : l'éditeur de liens fusionne les définitions en une seule", correct: true}
      - {text: "De la recopier dans chaque fonction qui s'en sert, pour aller plus vite", correct: false}
      - {text: "De la rendre invisible des autres fichiers source", correct: false}
      - {text: "De la rendre constante après sa première affectation", correct: false}
    answer: "`inline` autorise une définition par unité de traduction, toutes identiques, pour une seule entité dans le programme."
  - key: constante-en-tete
    format: course
    question: "Comment déclares-tu, dans un en-tête, une constante dont il n'existe qu'un exemplaire dans le programme ?"
    choices:
      - {text: "`inline constexpr int taille_max = 1024;`", correct: true}
      - {text: "`const int taille_max = 1024;`", correct: false}
      - {text: "`static const int taille_max = 1024;`", correct: false}
      - {text: "`extern const int taille_max = 1024;`", correct: false}
    answer: "`const` et `static` donnent une copie par fichier. `extern` avec une valeur est une définition, qui serait multiple."
  - key: sens-de-inline
    format: course
    question: "Que signifie réellement le mot-clé `inline`, pour l'éditeur de liens ?"
    choices:
      - {text: "Que plusieurs définitions identiques sont permises, et désignent une seule entité", correct: true}
      - {text: "Que le code doit être inséré à chaque appel, sans exception", correct: false}
      - {text: "Que l'entité a une liaison interne, propre à chaque fichier", correct: false}
      - {text: "Que l'entité ne doit pas apparaître dans le fichier objet", correct: false}
    answer: "L'insertion du code est une décision de l'optimiseur, que le mot-clé n'impose pas. Son sens garanti concerne la règle de la définition unique."
  - key: membre-statique
    format: course
    question: "Que permet `static inline int instances = 0;` dans une classe ?"
    choices:
      - {text: "De définir le membre statique dans la classe, sans définition à part dans un `.cpp`", correct: true}
      - {text: "De donner à chaque objet son propre exemplaire du membre", correct: false}
      - {text: "De rendre le membre constant", correct: false}
      - {text: "De rendre le membre privé à chaque fichier source", correct: false}
    answer: "Avant C++17, il fallait écrire `int Classe::instances = 0;` dans un fichier source. `inline` supprime cette étape."
  - key: vf-const-copie
    format: true-false
    question: "Une `const int` définie dans un en-tête, sans `inline`, a une copie dans chaque fichier qui l'inclut."
    truth: true
    answer: "Une variable globale `const` a une liaison interne. Le programme compile, avec autant d'entités que de fichiers."
  - key: vf-insertion
    format: true-false
    question: "`inline` devant une variable demande au compilateur de la remplacer par sa valeur."
    truth: false
    answer: "Il autorise sa définition dans plusieurs unités de traduction. La variable existe, a une adresse, et peut être modifiée."
  - key: vf-constexpr-membre
    format: true-false
    question: "Un membre de classe `static constexpr` est implicitement `inline`."
    truth: true
    answer: "Depuis C++17. Il se définit dans la classe, et l'on peut prendre son adresse sans définition à part."
  - key: vf-cpp17
    format: true-false
    question: "Les variables `inline` existent depuis C++11."
    truth: false
    answer: "Elles datent de C++17. Avant, il fallait `extern` dans l'en-tête et la définition dans un seul fichier source."
  - key: qcm-avant-cpp17
    format: multiple-choice
    question: "Avant C++17, comment partageait-on une variable globale entre plusieurs fichiers ?"
    choices:
      - {text: "`extern int x;` dans l'en-tête, et `int x = 0;` dans un seul `.cpp`", correct: true}
      - {text: "`int x = 0;` dans l'en-tête, inclus partout", correct: false}
      - {text: "`static int x = 0;` dans l'en-tête, inclus partout", correct: false}
      - {text: "`#define x 0` dans l'en-tête", correct: false}
    answer: "Une déclaration pour tous, une définition unique. Définie dans l'en-tête, elle aurait été multiple ; `static` en aurait fait une par fichier."
  - key: qcm-static-ou-inline
    format: multiple-choice
    question: "Dans un en-tête, que crée `static int compteur = 0;` ?"
    choices:
      - {text: "Une variable distincte dans chaque fichier qui inclut l'en-tête", correct: true}
      - {text: "Une seule variable, partagée par tous les fichiers", correct: false}
      - {text: "Une constante connue à la compilation", correct: false}
      - {text: "Une erreur de l'éditeur de liens", correct: false}
    answer: "`static` donne une liaison interne. Incrémenter le compteur dans un fichier ne change pas celui des autres."
  - key: qcm-define
    format: multiple-choice
    question: "Pourquoi préférer `inline constexpr int taille = 64;` à `#define TAILLE 64` ?"
    choices:
      - {text: "La constante a un type, une portée, et respecte les espaces de noms", correct: true}
      - {text: "La macro occupe plus de mémoire à l'exécution", correct: false}
      - {text: "La macro ne peut pas contenir de nombre", correct: false}
      - {text: "La constante est remplacée avant la compilation", correct: false}
    answer: "Une macro est un remplacement de texte, sans type ni portée. C'est elle qui est traitée avant la compilation."
  - key: qcm-grosse-constante
    format: multiple-choice
    question: "Dans quel cas l'absence de `inline` sur une constante d'en-tête coûte-t-elle réellement ?"
    choices:
      - {text: "Pour un grand tableau constant, dupliqué dans chaque fichier objet", correct: true}
      - {text: "Pour un `int` utilisé comme taille d'un tableau", correct: false}
      - {text: "Pour un `bool` utilisé dans une condition", correct: false}
      - {text: "Pour un `char` utilisé comme séparateur", correct: false}
    answer: "Un petit entier est remplacé par sa valeur. Une grosse constante, elle, est stockée dans chaque unité de traduction qui s'en sert."
  - key: trous-inline
    format: fill-in
    question: |-
      Complète pour que cette variable d'en-tête n'existe qu'une fois dans le programme :
      ```cpp
      // config.hpp
      ___ int niveau_journal = 2;
      ```
    blanks:
      - [inline]
    answer: "`inline` autorise la définition dans l'en-tête."
  - key: trous-constexpr
    format: fill-in
    question: |-
      Complète pour déclarer une constante de compilation partagée :
      ```cpp
      inline ___ int taille_max = 1024;
      ```
    blanks:
      - [constexpr]
    answer: "`inline constexpr` : une seule constante, connue à la compilation."
  - key: trous-membre
    format: fill-in
    question: |-
      Complète pour définir le membre statique dans la classe :
      ```cpp
      struct Session {
          static ___ int ouvertes = 0;
      };
      ```
    blanks:
      - [inline]
    answer: "`static inline` évite la définition séparée dans un fichier source."
  - key: trous-extern
    format: fill-in
    question: |-
      Complète la déclaration d'avant C++17, la définition étant dans un `.cpp` :
      ```cpp
      // config.hpp
      ___ int niveau_journal;
      ```
    blanks:
      - [extern]
    answer: "`extern` déclare la variable sans la définir."
  - key: code-membre-inline
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Session {
          static inline int ouvertes = 0;
          Session() { ++ouvertes; }
          ~Session() { --ouvertes; }
      };

      int main() {
          Session a;
          {
              Session b;
              std::print("{} ", Session::ouvertes);
          }
          std::println("{}", Session::ouvertes);
      }
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 1` : le membre `static inline` est défini dans la classe, et commun à tous les objets. Il compte les sessions vivantes."
    check:
      output: "2 1"
  - key: code-inline-globale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      inline int niveau = 1;
      inline constexpr int limite = 3;

      void monter() {
          if (niveau < limite) {
              ++niveau;
          }
      }

      int main() {
          for (int i = 0; i < 5; ++i) {
              monter();
          }
          std::println("{}", niveau);
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : une variable `inline` est une vraie variable, modifiable. La constante `limite` arrête la progression à 3."
    check:
      output: "3"
  - key: code-adresse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Config {
          static constexpr int taille = 8;
      };

      int lire(const int& valeur) {
          return valeur * 2;
      }

      int main() {
          const int* adresse = &Config::taille;
          std::println("{} {}", lire(Config::taille), *adresse);
      }
      ```
    choices:
      - {text: "`16 8`", correct: true}
      - {text: "`8 8`", correct: false}
      - {text: "`16 16`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`16 8` : depuis C++17, un membre `static constexpr` est implicitement `inline`. On peut le lier à une référence et prendre son adresse, sans définition hors de la classe."
    check:
      output: "16 8"
  - key: code-const-modif
    format: code-output
    question: |-
      ```cpp
      #include <print>

      inline constexpr int taille = 4;

      int main() {
          taille = 8;
          std::println("{}", taille);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : `constexpr` implique `const`. `inline` ne concerne que l'édition de liens, pas la possibilité de modifier."
    check:
      compiles: false
  - key: bug-definition-multiple
    format: bug-fix
    question: |-
      Cet en-tête est inclus par trois fichiers source. L'édition de liens échoue : « multiple definition of
      `delai' ». Quelle correction est la bonne ?
      ```cpp
      // reseau.hpp
      #pragma once

      int delai = 30;
      ```
    choices:
      - {text: "Écrire `inline int delai = 30;`", correct: true}
      - {text: "Écrire `extern int delai = 30;`", correct: false}
      - {text: "Écrire `auto delai = 30;`", correct: false}
      - {text: "Retirer la ligne `#pragma once`", correct: false}
    answer: |-
      ```cpp
      inline int delai = 30;
      ```
      Chaque fichier qui inclut l'en-tête définit `delai`. `inline` fait de ces définitions une seule variable.
      `extern` avec une valeur reste une définition.
  - key: bug-membre-non-defini
    format: bug-fix
    question: |-
      L'édition de liens échoue : « undefined reference to `Session::ouvertes' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Session {
          static int ouvertes;
          Session() { ++ouvertes; }
      };

      int main() {
          Session a;
          std::println("{}", Session::ouvertes);
      }
      ```
    choices:
      - {text: "Écrire `static inline int ouvertes = 0;` dans la classe", correct: true}
      - {text: "Écrire `static extern int ouvertes;` dans la classe", correct: false}
      - {text: "Écrire `int ouvertes = 0;` dans la classe, sans `static`", correct: false}
      - {text: "Écrire `static int ouvertes();` dans la classe", correct: false}
    answer: |-
      ```cpp
      static inline int ouvertes = 0;
      ```
      `static int ouvertes;` n'est qu'une déclaration : il manque la définition. `inline` permet de la faire dans
      la classe ; sinon, il faut `int Session::ouvertes = 0;` dans un fichier source.
  - key: bug-static-par-fichier
    format: bug-fix
    question: |-
      Deux fichiers incrémentent ce compteur d'en-tête, mais le total affiché par `main.cpp` ne compte que ses
      propres incrémentations. Quelle correction est la bonne ?
      ```cpp
      // stats.hpp
      #pragma once

      static int evenements = 0;
      ```
    choices:
      - {text: "Écrire `inline int evenements = 0;`", correct: true}
      - {text: "Écrire `static const int evenements = 0;`", correct: false}
      - {text: "Écrire `static inline int evenements = 0;`", correct: false}
      - {text: "Écrire `namespace { int evenements = 0; }`", correct: false}
    answer: |-
      ```cpp
      inline int evenements = 0;
      ```
      `static` crée une variable par fichier source : chacun incrémente la sienne. `inline` seul en fait une
      variable unique. `static inline`, hors d'une classe, reste à liaison interne.
  - key: bug-initialisation-classe
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation : « ISO C++ forbids in-class initialization of non-const static
      member ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Compteur {
          static int total = 0;
      };

      int main() {
          std::println("{}", Compteur::total);
      }
      ```
    choices:
      - {text: "Écrire `static inline int total = 0;`", correct: true}
      - {text: "Écrire `static mutable int total = 0;`", correct: false}
      - {text: "Écrire `static volatile int total = 0;`", correct: false}
      - {text: "Écrire `static extern int total = 0;`", correct: false}
    answer: |-
      ```cpp
      static inline int total = 0;
      ```
      Un membre statique non constant ne s'initialise dans la classe que s'il est `inline`. Sinon, la valeur se
      donne dans sa définition, hors de la classe.
