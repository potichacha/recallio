notion: abi
lesson: |-
  L'**API** d'une bibliothèque est ce que voit le **code source** : noms, signatures, types. L'**ABI**
  (*Application Binary Interface*) est ce que voit le **code compilé** : comment les fonctions sont appelées, où
  se trouvent les membres d'un objet, quelle taille il fait, comment s'appellent les symboles.

  - Changer l'API oblige à **modifier** le code qui s'en sert.
  - Changer l'ABI oblige à le **recompiler**, sans rien y modifier.

  **Ce qui compose l'ABI.**

  - la **taille** et l'**alignement** des types ;
  - la **disposition** des membres dans un objet, et l'ordre des fonctions dans la table virtuelle ;
  - le **décorage** des noms ;
  - la **convention d'appel** : par quels registres passent les arguments et la valeur de retour ;
  - le mécanisme des **exceptions** et des informations de type.

  **Pourquoi c'est important.** Une application liée à une bibliothèque partagée (`.so`, `.dll`) a été compilée
  avec **une version** des en-têtes. Si la bibliothèque est remplacée par une version dont l'ABI a changé,
  l'application, **non recompilée**, lit des objets à de mauvais décalages : plantage, ou données corrompues,
  **sans aucun message** à la compilation ni à l'édition de liens.

  **Ce qui casse l'ABI.**

  | Changement dans la bibliothèque | Pourquoi |
  |---|---|
  | ajouter, retirer ou réordonner un **membre de données** | la taille et les décalages changent |
  | ajouter ou réordonner une **fonction virtuelle** | la table virtuelle change |
  | changer la **signature** d'une fonction | le symbole décoré change |
  | changer une **classe de base** | la disposition change |
  | modifier une fonction **inline** ou un **template** | l'ancien code est déjà compilé dans l'application |
  | changer d'options de compilation (`-D_GLIBCXX_DEBUG`...) | la bibliothèque standard change de disposition |

  **Ce qui ne la casse pas.** Ajouter une **fonction libre**, ajouter une fonction membre **non virtuelle**,
  modifier le **corps** d'une fonction non inline.

  **Comment la garder stable.**

  - L'idiome **pimpl** : la classe publique ne contient qu'un pointeur vers une implémentation privée. On change
    l'implémentation sans changer la taille de la classe.
  - Une **interface C** (`extern "C"`, pointeurs opaques) : l'ABI du C est simple et stable.
  - Pas de types de la bibliothèque standard dans l'interface, si l'on doit traverser des compilateurs.
  - Des **symboles versionnés**, et un numéro de version dans le nom de la bibliothèque (`libfoo.so.2`).

  **Le C++ n'a pas d'ABI standard.** Elle dépend du compilateur, de la plateforme, de la bibliothèque standard :
  sur Linux, l'ABI Itanium ; sous Windows, celle de MSVC. Deux fichiers objets de compilateurs différents ne se
  lient pas forcément. Cette exigence de stabilité pèse aussi sur le langage : certaines améliorations de la
  bibliothèque standard sont refusées parce qu'elles casseraient l'ABI.

  **En entretien** : « L'ABI est le contrat au niveau binaire : tailles, disposition des objets, tables
  virtuelles, noms décorés, convention d'appel. Ajouter un membre ou une fonction virtuelle à une classe publique
  la casse : les clients doivent recompiler. Pour une bibliothèque partagée, je la stabilise avec pimpl ou une
  interface C. »
cards:
  - key: api-ou-abi
    format: course
    question: "Quelle différence entre l'API et l'ABI d'une bibliothèque ?"
    choices:
      - {text: "L'API est le contrat du code source ; l'ABI est celui du code compilé", correct: true}
      - {text: "L'API est le contrat du code compilé ; l'ABI est celui du code source", correct: false}
      - {text: "L'API concerne les fonctions ; l'ABI concerne seulement les variables", correct: false}
      - {text: "Aucune : ce sont deux noms de la même chose", correct: false}
    answer: "Rompre l'API demande de modifier le code client. Rompre l'ABI demande seulement de le recompiler, mais rien ne le signale."
  - key: composants
    format: course
    question: "Lequel de ces éléments fait partie de l'ABI ?"
    choices:
      - {text: "La taille d'une classe et le décalage de ses membres", correct: true}
      - {text: "Le nom des variables locales d'une fonction", correct: false}
      - {text: "Les commentaires de l'en-tête", correct: false}
      - {text: "L'indentation du code source", correct: false}
    answer: "Le code client compilé contient ces tailles et ces décalages en dur. S'ils changent dans la bibliothèque, il lit au mauvais endroit."
  - key: casse
    format: course
    question: "Lequel de ces changements casse l'ABI d'une classe exposée par une bibliothèque partagée ?"
    choices:
      - {text: "Lui ajouter un membre de données", correct: true}
      - {text: "Modifier le corps d'une de ses fonctions non inline", correct: false}
      - {text: "Lui ajouter une fonction membre non virtuelle", correct: false}
      - {text: "Ajouter une fonction libre à côté d'elle", correct: false}
    answer: "Un membre de plus change la taille de l'objet, que le code client a déjà compilée. Les trois autres changements laissent la disposition intacte."
  - key: pimpl
    format: course
    question: "Comment l'idiome pimpl protège-t-il l'ABI d'une classe ?"
    choices:
      - {text: "La classe publique ne contient qu'un pointeur : sa taille ne change plus", correct: true}
      - {text: "La classe publique est recompilée à chaque lancement du programme", correct: false}
      - {text: "La classe publique n'a plus aucune fonction membre", correct: false}
      - {text: "La classe publique est copiée dans chaque fichier client", correct: false}
    answer: "Les membres réels vivent dans une classe privée, définie dans le fichier source. On peut les modifier sans toucher à ce que les clients ont compilé."
  - key: vf-standard
    format: true-false
    question: "Le standard C++ définit une ABI commune à tous les compilateurs."
    truth: false
    answer: "Elle dépend du compilateur et de la plateforme : l'ABI Itanium sur Linux et macOS, celle de MSVC sous Windows."
  - key: vf-virtuelle
    format: true-false
    question: "Ajouter une fonction virtuelle à une classe casse son ABI."
    truth: true
    answer: "La table virtuelle change : les appels virtuels du code client, compilés avec l'ancienne, visent la mauvaise case."
  - key: vf-message
    format: true-false
    question: "Une rupture d'ABI est toujours signalée par l'éditeur de liens."
    truth: false
    answer: "Si les symboles n'ont pas changé, tout se lie. Le défaut n'apparaît qu'à l'exécution : plantage ou données corrompues."
  - key: vf-inline
    format: true-false
    question: "Corriger une fonction `inline` d'un en-tête suffit à corriger les applications déjà compilées."
    truth: false
    answer: "Le code de la fonction a été compilé dans l'application. Il faut la recompiler pour qu'elle reçoive la correction."
  - key: qcm-stable
    format: multiple-choice
    question: "Quel changement dans une bibliothèque partagée laisse son ABI intacte ?"
    choices:
      - {text: "Ajouter une nouvelle fonction libre", correct: true}
      - {text: "Réordonner les membres d'une classe publique", correct: false}
      - {text: "Changer le type d'un paramètre d'une fonction", correct: false}
      - {text: "Changer la classe de base d'une classe publique", correct: false}
    answer: "Un symbole de plus ne gêne pas les anciens clients. Les trois autres changent la disposition d'un objet, ou un symbole existant."
  - key: qcm-interface-c
    format: multiple-choice
    question: "Pourquoi une interface en C stabilise-t-elle l'ABI d'une bibliothèque C++ ?"
    choices:
      - {text: "L'ABI du C est simple, stable, et commune sur une plateforme", correct: true}
      - {text: "Le C compile plus vite que le C++", correct: false}
      - {text: "Le C interdit les bibliothèques partagées", correct: false}
      - {text: "Le C vérifie l'ABI à chaque appel de fonction", correct: false}
    answer: "Pas de décorage, pas de table virtuelle, pas de types de bibliothèque : des fonctions et des pointeurs opaques."
  - key: qcm-symptome
    format: multiple-choice
    question: "Après la mise à jour d'une bibliothèque partagée, une application non recompilée plante dès qu'elle utilise un de ses objets. Que soupçonnes-tu ?"
    choices:
      - {text: "Une rupture d'ABI : la disposition de l'objet a changé", correct: true}
      - {text: "Une rupture d'API : le code source ne compile plus", correct: false}
      - {text: "Une fuite de mémoire dans l'application", correct: false}
      - {text: "Un interblocage entre deux threads", correct: false}
    answer: "L'application a été compilée avec l'ancienne disposition. Une rupture d'API, elle, se verrait à la compilation."
  - key: qcm-version
    format: multiple-choice
    question: "Que signale le passage de `libfoo.so.1` à `libfoo.so.2` ?"
    choices:
      - {text: "Un changement d'ABI incompatible avec les anciens clients", correct: true}
      - {text: "Une simple correction de bug, sans changement d'interface", correct: false}
      - {text: "Un changement de compilateur", correct: false}
      - {text: "Une bibliothèque deux fois plus rapide", correct: false}
    answer: "Ce numéro (le *soname*) identifie l'ABI. Les deux versions peuvent cohabiter : chaque programme charge celle avec laquelle il a été compilé."
  - key: situation-membre-ajoute
    format: scenario
    question: |-
      Tu ajoutes un champ `int priorite` à une classe `Tache` exposée par ta bibliothèque partagée, puis tu livres
      la nouvelle version. Des applications clientes, non recompilées, se mettent à corrompre leur mémoire.
      Pourquoi ?
    choices:
      - {text: "Elles allouent des `Tache` de l'ancienne taille, écrites avec la nouvelle", correct: true}
      - {text: "Elles ne trouvent plus le symbole du constructeur de `Tache`", correct: false}
      - {text: "Elles appellent un constructeur qui a été supprimé", correct: false}
      - {text: "Elles incluent un en-tête qui n'existe plus", correct: false}
    answer: |-
      La taille de `Tache` est compilée en dur chez le client. La bibliothèque, elle, écrit le nouveau champ au-delà
      de ce que le client a réservé. Rien ne l'annonce : les symboles sont les mêmes.
  - key: situation-bibliotheque-stable
    format: scenario
    question: |-
      Tu conçois une bibliothèque partagée que des clients garderont des années sans recompiler, alors que son
      implémentation évoluera. Quelle conception choisis-tu pour ses classes publiques ?
    choices:
      - {text: "L'idiome pimpl : un seul pointeur vers une implémentation définie dans le fichier source", correct: true}
      - {text: "Des classes aux membres publics, pour que les clients y accèdent directement", correct: false}
      - {text: "Des templates définis dans les en-têtes", correct: false}
      - {text: "Des fonctions `inline` pour tout le code", correct: false}
    answer: |-
      Avec pimpl, la taille et la disposition de la classe publique ne bougent plus. Les templates et les fonctions
      inline, au contraire, compilent l'implémentation chez le client.
  - key: situation-deux-compilateurs
    format: scenario
    question: |-
      Une bibliothèque livrée sous forme binaire, compilée avec MSVC, expose des fonctions qui prennent des
      `std::string`. Un client qui compile avec un autre compilateur obtient des plantages. Que proposes-tu ?
    choices:
      - {text: "Une interface en `extern \"C\"`, avec des `const char*` et des tailles", correct: true}
      - {text: "Des `std::string_view` à la place des `std::string`", correct: false}
      - {text: "Des `std::vector<char>` à la place des `std::string`", correct: false}
      - {text: "Une option d'optimisation plus élevée chez le client", correct: false}
    answer: |-
      Chaque bibliothèque standard dispose `std::string` à sa façon. À la frontière entre deux compilateurs, seuls
      les types du C sont sûrs.
  - key: situation-standard
    format: scenario
    question: |-
      Un collègue s'étonne qu'une structure de la bibliothèque standard, connue pour être lente, n'ait jamais été
      corrigée malgré des propositions. Quelle raison est souvent en cause ?
    choices:
      - {text: "La correction changerait la disposition du type, donc casserait l'ABI", correct: true}
      - {text: "La correction demanderait de changer le nom du type", correct: false}
      - {text: "La correction ralentirait la compilation", correct: false}
      - {text: "La correction est interdite par le système d'exploitation", correct: false}
    answer: |-
      Les distributions livrent une bibliothèque standard partagée par des milliers de programmes déjà compilés.
      Changer la taille d'un type les casserait tous : la stabilité de l'ABI freine certaines évolutions.
  - key: definition-abi
    format: definition
    question: "Que signifie le sigle ABI ?"
    choices:
      - {text: "Application Binary Interface : l'interface au niveau du code compilé", correct: true}
      - {text: "Abstract Base Interface : une classe de base abstraite", correct: false}
      - {text: "Automatic Build Integration : la construction automatique", correct: false}
      - {text: "Aligned Byte Index : un indice aligné en mémoire", correct: false}
    answer: "Elle fixe ce que deux morceaux de code compilés séparément doivent partager pour fonctionner ensemble."
  - key: definition-convention-appel
    format: definition
    question: "Qu'est-ce qu'une convention d'appel ?"
    choices:
      - {text: "La règle qui dit comment arguments et valeur de retour passent entre appelant et appelé", correct: true}
      - {text: "La règle de nommage des fonctions dans un projet", correct: false}
      - {text: "L'ordre dans lequel les fonctions sont déclarées dans un en-tête", correct: false}
      - {text: "Le nombre maximal d'appels imbriqués", correct: false}
    answer: "Quels registres, quelle zone de la pile, qui nettoie : l'appelant et l'appelé doivent être d'accord."
  - key: definition-compatibilite-binaire
    format: definition
    question: "Que veut dire qu'une nouvelle version d'une bibliothèque est « compatible binaire » ?"
    choices:
      - {text: "Qu'un programme compilé avec l'ancienne fonctionne avec la nouvelle, sans recompilation", correct: true}
      - {text: "Qu'un programme compile avec la nouvelle sans modification de son code source", correct: false}
      - {text: "Que la bibliothèque fonctionne sur tous les processeurs", correct: false}
      - {text: "Que la bibliothèque a la même taille de fichier qu'avant", correct: false}
    answer: "Compiler sans modification, c'est la compatibilité des sources, donc de l'API. La compatibilité binaire porte sur l'ABI."
  - key: definition-soname
    format: definition
    question: "Qu'est-ce que le soname d'une bibliothèque partagée, sous Linux ?"
    choices:
      - {text: "Le nom, avec un numéro de version d'ABI, demandé au chargement", correct: true}
      - {text: "Le nom de l'auteur de la bibliothèque", correct: false}
      - {text: "Le nom du fichier source principal de la bibliothèque", correct: false}
      - {text: "Le nom décoré de sa première fonction", correct: false}
    answer: "Par exemple `libfoo.so.2`. Tant que l'ABI ne change pas, les mises à jour gardent ce nom."
