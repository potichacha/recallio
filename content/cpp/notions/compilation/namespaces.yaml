notion: namespaces
lesson: |-
  Un **espace de noms** (*namespace*) range des noms sous une étiquette. Deux bibliothèques peuvent ainsi avoir
  chacune une fonction `ouvrir` ou une classe `Image`, sans conflit : ce sont `reseau::ouvrir` et
  `fichiers::ouvrir`. Toute la bibliothèque standard vit dans `std`.

  **Déclarer.**

  ```cpp
  namespace geometrie {

  double aire_carre(double cote) {
      return cote * cote;
  }

  }  // namespace geometrie
  ```

  Pas de point-virgule après l'accolade fermante. L'usage est de rappeler le nom en commentaire, et de ne pas
  indenter le contenu.

  **Utiliser.** De l'extérieur, on **qualifie** le nom avec `::`, l'opérateur de résolution de portée :

  ```cpp
  std::println("{}", geometrie::aire_carre(3.0));
  ```

  À l'intérieur de l'espace de noms, ses membres se voient sans préfixe.

  **Un espace de noms est ouvert.** On peut le rouvrir plus loin, ou dans un autre fichier, pour lui ajouter des
  noms. C'est ainsi que l'en-tête déclare dans `geometrie`, et que le fichier source y définit :

  ```cpp
  // geometrie.hpp
  namespace geometrie {
  double aire_carre(double cote);
  }

  // geometrie.cpp
  double geometrie::aire_carre(double cote) {     // ou dans un bloc namespace geometrie { ... }
      return cote * cote;
  }
  ```

  Définir `aire_carre` sans le préfixe créerait une **autre** fonction, dans l'espace global.

  **Imbriquer.** Depuis C++17, on écrit les niveaux d'un coup :

  ```cpp
  namespace projet::reseau {
  void connecter();
  }

  projet::reseau::connecter();
  ```

  **Un alias** raccourcit un nom long, sans rien importer :

  ```cpp
  namespace fs = std::filesystem;
  fs::path chemin{"notes.txt"};
  ```

  **L'espace global.** Ce qui n'est dans aucun espace de noms est dans l'espace **global**. `::nom`, avec le préfixe
  vide, le désigne explicitement.

  **L'espace de noms anonyme.** `namespace { ... }`, sans nom, rend son contenu **propre au fichier source** : c'est
  la façon de cacher une fonction d'aide aux autres fichiers.

  **Les règles d'usage.**

  - Tout le code d'un projet ou d'une bibliothèque vit dans **son** espace de noms.
  - On n'ajoute rien à `std` : c'est interdit, sauf quelques spécialisations prévues par le standard.
  - Un espace de noms n'est pas une classe : pas d'objet, pas de `private`. Il ne fait que ranger des noms.

  **En entretien** : « Un espace de noms évite les collisions de noms entre bibliothèques. On le qualifie avec
  `::`, on peut le rouvrir, l'imbriquer (`a::b` depuis C++17) et lui donner un alias. L'espace anonyme rend des
  noms locaux à un fichier. »
tour:
  - title: Ranger ses noms
    text: |-
      Deux fonctions ne peuvent pas porter le même nom avec les mêmes paramètres... sauf si elles vivent dans deux
      **espaces de noms** différents. Ici, `metrique::distance` et `imperial::distance` cohabitent.

      On les appelle avec leur préfixe et `::`. C'est exactement ce que tu fais depuis le début avec `std::println` :
      `std` est l'espace de noms de la bibliothèque standard.

      Essaie : retire le préfixe `metrique::` dans `main`, puis exécute. Le compilateur ne trouve plus `distance`.
    example:
      files:
        main.cpp: |-
          #include <print>

          namespace metrique {

          int distance() {
              return 100;
          }

          }  // namespace metrique

          namespace imperial {

          int distance() {
              return 328;
          }

          }  // namespace imperial

          int main() {
              std::println("{} mètres, {} pieds", metrique::distance(), imperial::distance());
          }
      output: "100 mètres, 328 pieds"
    task:
      instructions: |-
        Ajoute un espace de noms `anglais` avec une fonction `salut()` qui renvoie `"hello"`, et affiche les deux
        salutations sur la même ligne, séparées par une espace : `bonjour hello`.
      starter:
        main.cpp: |-
          #include <print>
          #include <string>

          namespace francais {

          std::string salut() {
              return "bonjour";
          }

          }  // namespace francais

          int main() {
              std::println("{}", francais::salut());
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <string>

          namespace francais {

          std::string salut() {
              return "bonjour";
          }

          }  // namespace francais

          namespace anglais {

          std::string salut() {
              return "hello";
          }

          }  // namespace anglais

          int main() {
              std::println("{} {}", francais::salut(), anglais::salut());
          }
      output: "bonjour hello"
cards:
  - key: role
    format: course
    question: "À quoi sert un espace de noms ?"
    choices:
      - {text: "À ranger des noms sous une étiquette, pour éviter les collisions entre bibliothèques", correct: true}
      - {text: "À cacher des fonctions aux autres classes, comme le fait le mot-clé `private`", correct: false}
      - {text: "À regrouper des fichiers source, pour les compiler en une seule fois", correct: false}
      - {text: "À réserver de la mémoire pour un groupe de variables globales", correct: false}
    answer: "Deux bibliothèques peuvent définir chacune `ouvrir` : `reseau::ouvrir` et `fichiers::ouvrir` sont deux noms distincts."
  - key: ouvert
    format: course
    question: "Que se passe-t-il quand un fichier contient deux blocs `namespace outils { ... }` ?"
    choices:
      - {text: "Le second ajoute ses noms au même espace de noms", correct: true}
      - {text: "Le second remplace le contenu du premier", correct: false}
      - {text: "Le compilateur signale une redéfinition", correct: false}
      - {text: "Le second crée un autre espace, de même nom", correct: false}
    answer: "Un espace de noms est ouvert : on peut le rouvrir, dans le même fichier ou dans un autre. C'est ce que font l'en-tête et le fichier source d'un même module."
  - key: alias
    format: course
    question: "Que fait `namespace fs = std::filesystem;` ?"
    choices:
      - {text: "Il donne un nom court à l'espace de noms : `fs::path` désigne `std::filesystem::path`", correct: true}
      - {text: "Il importe tous les noms de `std::filesystem` dans l'espace de noms courant", correct: false}
      - {text: "Il crée un nouvel espace de noms `fs`, vide, à l'intérieur de `std::filesystem`", correct: false}
      - {text: "Il copie le contenu de `std::filesystem` dans un nouvel espace de noms `fs`", correct: false}
    answer: "Un alias n'importe rien et ne copie rien : c'est un second nom pour le même espace. Le préfixe reste, en plus court."
  - key: anonyme
    format: course
    question: "Quel est l'effet d'un espace de noms anonyme, `namespace { ... }`, dans un fichier source ?"
    choices:
      - {text: "Ce qu'il contient n'est visible que dans ce fichier source", correct: true}
      - {text: "Ce qu'il contient est visible dans tous les fichiers du programme", correct: false}
      - {text: "Ce qu'il contient est ajouté à l'espace de noms `std`", correct: false}
      - {text: "Ce qu'il contient est détruit à la fin de la fonction `main`", correct: false}
    answer: "Les noms ont une liaison interne : un autre fichier peut définir les mêmes sans conflit. C'est la place des fonctions d'aide."
  - key: vf-point-virgule
    format: true-false
    question: "La définition d'un espace de noms se termine par un point-virgule, comme celle d'une classe."
    truth: false
    answer: "Aucun point-virgule après l'accolade fermante d'un espace de noms."
  - key: vf-interieur
    format: true-false
    question: "À l'intérieur d'un espace de noms, on appelle ses fonctions sans préfixe."
    truth: true
    answer: "Le préfixe n'est nécessaire que de l'extérieur."
  - key: vf-std
    format: true-false
    question: "On peut librement ajouter ses propres fonctions à l'espace de noms `std`."
    truth: false
    answer: "C'est interdit par le standard, hors de quelques spécialisations prévues. Ton code vit dans ton propre espace de noms."
  - key: vf-imbrication
    format: true-false
    question: "Depuis C++17, `namespace a::b { }` déclare l'espace de noms `b` imbriqué dans `a`."
    truth: true
    answer: "C'est l'écriture compacte de `namespace a { namespace b { } }`."
  - key: qcm-appel
    format: multiple-choice
    question: "La fonction `aire` est déclarée dans l'espace de noms `geometrie`. Comment l'appelles-tu depuis `main` ?"
    choices:
      - {text: "`geometrie::aire(2.0)`", correct: true}
      - {text: "`geometrie.aire(2.0)`", correct: false}
      - {text: "`geometrie->aire(2.0)`", correct: false}
      - {text: "`geometrie:aire(2.0)`", correct: false}
    answer: "`::` est l'opérateur de résolution de portée. Le point et la flèche servent aux membres d'un objet."
  - key: qcm-global
    format: multiple-choice
    question: "Comment désignes-tu explicitement la fonction `lire` de l'espace global ?"
    choices:
      - {text: "`::lire()`", correct: true}
      - {text: "`global::lire()`", correct: false}
      - {text: "`std::lire()`", correct: false}
      - {text: "`this::lire()`", correct: false}
    answer: "Un `::` sans rien devant désigne l'espace global. Utile quand un nom local ou d'un espace de noms le masque."
  - key: qcm-definition
    format: multiple-choice
    question: "L'en-tête déclare `int frais();` dans `namespace banque`. Comment la définis-tu dans le fichier source ?"
    choices:
      - {text: "`int banque::frais() { return 2; }`", correct: true}
      - {text: "`int frais() { return 2; }`", correct: false}
      - {text: "`banque int frais() { return 2; }`", correct: false}
      - {text: "`int frais::banque() { return 2; }`", correct: false}
    answer: "Le nom est qualifié, ou la définition est placée dans un bloc `namespace banque { ... }`. Sans préfixe, on définit une autre fonction, globale."
  - key: qcm-imbrique
    format: multiple-choice
    question: "Quelle ligne déclare l'espace de noms `reseau`, imbriqué dans `projet` (C++17) ?"
    choices:
      - {text: "`namespace projet::reseau {`", correct: true}
      - {text: "`namespace projet.reseau {`", correct: false}
      - {text: "`namespace projet, reseau {`", correct: false}
      - {text: "`namespace projet/reseau {`", correct: false}
    answer: "Les niveaux s'enchaînent avec `::`, comme à l'usage : `projet::reseau::connecter()`."
  - key: trous-namespace
    format: fill-in
    question: |-
      Complète pour déclarer l'espace de noms :
      ```cpp
      ___ geometrie {

      double aire_carre(double cote);

      }
      ```
    blanks:
      - [namespace]
    answer: "`namespace nom { ... }` ouvre l'espace de noms."
  - key: trous-resolution
    format: fill-in
    question: |-
      Complète pour appeler la fonction de l'espace de noms `geometrie` :
      ```cpp
      std::println("{}", geometrie___aire_carre(3.0));
      ```
    blanks:
      - ["::"]
    answer: "`::` qualifie un nom par son espace de noms."
  - key: trous-alias
    format: fill-in
    question: |-
      Complète pour donner l'alias `fs` à `std::filesystem` :
      ```cpp
      ___ fs = std::filesystem;
      ```
    blanks:
      - [namespace]
    answer: "`namespace alias = nom;` crée un alias d'espace de noms."
  - key: trous-imbrique
    format: fill-in
    question: |-
      Complète pour appeler la fonction de l'espace de noms imbriqué :
      ```cpp
      namespace projet::reseau {
      void connecter();
      }

      projet::___::connecter();
      ```
    blanks:
      - [reseau]
    answer: "On traverse les niveaux dans l'ordre : `projet::reseau::connecter()`."
  - key: code-deux-espaces
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace a {
      int valeur() { return 1; }
      }  // namespace a

      namespace b {
      int valeur() { return 2; }
      }  // namespace b

      int main() {
          std::println("{} {}", b::valeur(), a::valeur());
      }
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`1 2`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 1` : les deux fonctions portent le même nom, dans deux espaces de noms. Le préfixe dit laquelle appeler."
    check:
      output: "2 1"
  - key: code-recherche
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int valeur() { return 1; }

      namespace outils {
      int valeur() { return 2; }
      int lire() { return valeur(); }
      int lire_globale() { return ::valeur(); }
      }  // namespace outils

      int main() {
          std::println("{} {} {}", valeur(), outils::lire(), outils::lire_globale());
      }
      ```
    choices:
      - {text: "`1 2 1`", correct: true}
      - {text: "`1 1 1`", correct: false}
      - {text: "`1 2 2`", correct: false}
      - {text: "`2 2 1`", correct: false}
    answer: "`1 2 1` : dans `outils`, `valeur()` trouve d'abord celle de l'espace de noms. `::valeur()` force celle de l'espace global."
    check:
      output: "1 2 1"
  - key: code-reouverture
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace config {
      const int largeur = 4;
      }  // namespace config

      namespace config {
      const int hauteur = 3;
      }  // namespace config

      int main() {
          std::println("{}", config::largeur * config::hauteur);
      }
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`4`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`12` : le second bloc rouvre le même espace de noms, et y ajoute `hauteur`. Les deux constantes sont dans `config`."
    check:
      output: "12"
  - key: code-alias
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace projet::facturation {
      int taux() { return 20; }
      }  // namespace projet::facturation

      namespace pf = projet::facturation;

      int main() {
          std::println("{} {}", pf::taux(), projet::facturation::taux() == pf::taux());
      }
      ```
    choices:
      - {text: "`20 true`", correct: true}
      - {text: "`20 false`", correct: false}
      - {text: "`0 true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`20 true` : l'alias `pf` est un second nom pour `projet::facturation`. Les deux écritures appellent la même fonction."
    check:
      output: "20 true"
  - key: bug-sans-prefixe
    format: bug-fix
    question: |-
      Le compilateur répond « 'aire_carre' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      namespace geometrie {
      int aire_carre(int cote) { return cote * cote; }
      }  // namespace geometrie

      int main() {
          std::println("{}", aire_carre(4));
      }
      ```
    choices:
      - {text: "Appeler `geometrie::aire_carre(4)`", correct: true}
      - {text: "Appeler `geometrie.aire_carre(4)`", correct: false}
      - {text: "Appeler `std::aire_carre(4)`", correct: false}
      - {text: "Appeler `::aire_carre(4)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", geometrie::aire_carre(4));
      ```
      Hors de l'espace de noms, le nom doit être qualifié. `::aire_carre` chercherait dans l'espace global, où la
      fonction n'est pas.
  - key: bug-definition-hors-espace
    format: bug-fix
    question: |-
      L'édition de liens répond « undefined reference to `banque::frais()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      namespace banque {
      int frais();
      }  // namespace banque

      int frais() {
          return 2;
      }

      int main() {
          std::println("{}", banque::frais());
      }
      ```
    choices:
      - {text: "Définir `int banque::frais() { return 2; }`", correct: true}
      - {text: "Définir `inline int frais() { return 2; }`", correct: false}
      - {text: "Définir `static int frais() { return 2; }`", correct: false}
      - {text: "Définir `extern int frais() { return 2; }`", correct: false}
    answer: |-
      ```cpp
      int banque::frais() {
          return 2;
      }
      ```
      `frais`, sans préfixe, est une autre fonction, dans l'espace global. Celle que l'espace de noms déclare reste
      sans définition.
  - key: bug-dans-une-fonction
    format: bug-fix
    question: |-
      Le compilateur répond « 'namespace' definition is not allowed here ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          namespace outils {
          int double_de(int n) { return n * 2; }
          }
          std::println("{}", outils::double_de(4));
      }
      ```
    choices:
      - {text: "Déclarer l'espace de noms avant `main`, hors de toute fonction", correct: true}
      - {text: "Ajouter un point-virgule après l'accolade de l'espace de noms", correct: false}
      - {text: "Déclarer l'espace de noms à la dernière ligne de `main`", correct: false}
      - {text: "Écrire `class outils` à la place de `namespace outils`", correct: false}
    answer: |-
      ```cpp
      namespace outils {
      int double_de(int n) { return n * 2; }
      }  // namespace outils

      int main() {
          std::println("{}", outils::double_de(4));
      }
      ```
      Un espace de noms se déclare dans l'espace global, ou dans un autre espace de noms, jamais dans une fonction.
  - key: bug-ambigu
    format: bug-fix
    question: |-
      Le compilateur répond « call of overloaded 'taille()' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      namespace image {
      int taille() { return 640; }
      }  // namespace image

      namespace texte {
      int taille() { return 12; }
      }  // namespace texte

      using namespace image;
      using namespace texte;

      int main() {
          std::println("{}", taille());
      }
      ```
    choices:
      - {text: "Retirer les deux `using namespace`, et appeler `texte::taille()`", correct: true}
      - {text: "Inverser l'ordre des deux lignes `using namespace`", correct: false}
      - {text: "Écrire `using namespace texte;` une seconde fois", correct: false}
      - {text: "Renommer l'espace de noms `image` en `Image`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", texte::taille());
      ```
      Les deux directives rendent visibles deux fonctions `taille()` : le compilateur ne peut pas choisir. Le préfixe
      lève l'ambiguïté, et c'est précisément ce à quoi servent les espaces de noms.
