notion: modules
lesson: |-
  Les **modules** (C++20) remplacent le couple en-tête et `#include`. Au lieu de recopier du texte dans chaque
  fichier, un module est **compilé une fois**, et les fichiers qui s'en servent **importent** son interface
  compilée.

  **Écrire un module.**

  ```cpp
  // geometrie.cppm : l'unité d'interface du module
  export module geometrie;

  export double aire_cercle(double rayon) {
      return 3.14159 * carre(rayon);
  }

  double carre(double x) {          // pas exportée : invisible des importateurs
      return x * x;
  }
  ```

  **S'en servir.**

  ```cpp
  import geometrie;
  import std;                        // C++23 : toute la bibliothèque standard

  int main() {
      std::println("{}", aire_cercle(2.0));
  }
  ```

  **Ce que les modules changent.**

  | | En-têtes | Modules |
  |---|---|---|
  | Mécanisme | recopie de texte par le préprocesseur | interface compilée une fois |
  | Ce qui est visible | tout le contenu de l'en-tête | seulement ce qui est marqué `export` |
  | Macros | fuient d'un en-tête à l'autre | ne sortent pas du module |
  | Ordre des inclusions | peut changer le sens du code | l'ordre des `import` est indifférent |
  | Gardes d'inclusion | nécessaires | sans objet |
  | Temps de compilation | chaque fichier réanalyse les en-têtes | l'interface est lue, pas réanalysée |

  **`export` contrôle l'interface.** Une déclaration non exportée reste utilisable **dans** le module, et
  invisible dehors. Plus besoin d'un espace de noms `detail` ou d'un espace anonyme pour cacher les détails.

  **Module ne veut pas dire espace de noms.** `import geometrie;` ne crée aucun préfixe : `aire_cercle` s'appelle
  telle quelle. Les espaces de noms restent nécessaires, et s'exportent : `export namespace geo { ... }`.

  **Les en-têtes existants.** `import <vector>;` importe un en-tête comme une *unité d'en-tête*. Dans une unité de
  module, les `#include` restants se placent dans le **fragment global**, entre `module;` et la déclaration du
  module.

  **Où ils en sont.** La fonctionnalité est dans le standard depuis 2020, mais l'adoption est **lente** :

  - les compilateurs (GCC, Clang, MSVC) les prennent en charge à des degrés divers, et `import std;` reste récent ;
  - le système de construction doit **ordonner** les compilations : un module avant ceux qui l'importent. CMake le
    fait depuis la version 3.28, avec Ninja ;
  - beaucoup de bibliothèques n'en fournissent pas.

  Aujourd'hui, la plupart des projets restent aux en-têtes. Il faut connaître les modules, savoir ce qu'ils
  règlent, et ne pas s'attendre à les trouver partout.

  **En entretien** : « Les modules de C++20 remplacent l'inclusion de texte par l'import d'une interface
  compilée : seul ce qui est `export` est visible, les macros ne fuient plus, et les compilations sont plus
  rapides. Leur adoption reste limitée par l'outillage : compilateurs, CMake, bibliothèques. »
cards:
  - key: principe
    format: course
    question: "Quelle est la différence de fond entre `import geometrie;` et `#include \"geometrie.hpp\"` ?"
    choices:
      - {text: "L'import lit une interface compilée une fois ; l'inclusion recopie du texte dans chaque fichier", correct: true}
      - {text: "L'import recopie du texte dans chaque fichier ; l'inclusion lit une interface compilée", correct: false}
      - {text: "L'import charge le module à l'exécution ; l'inclusion le charge à la compilation", correct: false}
      - {text: "Aucune : `import` est une autre écriture de `#include`", correct: false}
    answer: "Le module est compilé seul, une fois. Ses importateurs lisent le résultat, sans réanalyser le code source."
  - key: export
    format: course
    question: "Que voit un fichier qui importe un module ?"
    choices:
      - {text: "Seulement les déclarations marquées `export`", correct: true}
      - {text: "Tout le contenu du module, comme avec un en-tête", correct: false}
      - {text: "Seulement les macros définies dans le module", correct: false}
      - {text: "Seulement les fonctions déclarées `inline`", correct: false}
    answer: "Ce qui n'est pas exporté reste interne au module. C'est un vrai contrôle de l'interface, que les en-têtes n'offrent pas."
  - key: macros
    format: course
    question: "Que deviennent les macros définies dans un module, pour ceux qui l'importent ?"
    choices:
      - {text: "Elles ne sortent pas du module : l'importateur ne les voit pas", correct: true}
      - {text: "Elles sont importées avec le reste, comme avec `#include`", correct: false}
      - {text: "Elles sont transformées en constantes `constexpr`", correct: false}
      - {text: "Elles provoquent une erreur de compilation", correct: false}
    answer: "C'est l'un des gains : un `#define` d'une bibliothèque ne peut plus changer le sens du code qui l'importe."
  - key: adoption
    format: course
    question: "Qu'est-ce qui freine l'adoption des modules, plusieurs années après C++20 ?"
    choices:
      - {text: "L'outillage : compilateurs, systèmes de construction et bibliothèques inégalement prêts", correct: true}
      - {text: "Le standard : les modules ont été retirés de C++23", correct: false}
      - {text: "Les performances : un programme à modules s'exécute plus lentement", correct: false}
      - {text: "La syntaxe : un module ne peut contenir que des fonctions", correct: false}
    answer: "Il faut compiler les modules dans le bon ordre, ce qui touche tout l'outillage. La plupart des projets restent aux en-têtes."
  - key: vf-espace-de-noms
    format: true-false
    question: "Importer un module `geometrie` oblige à préfixer ses fonctions par `geometrie::`."
    truth: false
    answer: "Un module n'est pas un espace de noms. Pour un préfixe, le module exporte un espace de noms."
  - key: vf-ordre
    format: true-false
    question: "L'ordre de deux lignes `import` peut changer le sens du programme."
    truth: false
    answer: "Les imports sont indépendants les uns des autres. C'est l'ordre des `#include` qui pouvait jouer, à cause des macros."
  - key: vf-import-std
    format: true-false
    question: "`import std;` fait partie de C++23."
    truth: true
    answer: "Le module `std` donne accès à toute la bibliothèque standard. Sa prise en charge par les compilateurs est récente."
  - key: vf-gardes
    format: true-false
    question: "Une unité d'interface de module a besoin d'une garde d'inclusion."
    truth: false
    answer: "Un module n'est pas recopié : l'importer deux fois ne redéfinit rien."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle ligne ouvre l'unité d'interface du module `geometrie` ?"
    choices:
      - {text: "`export module geometrie;`", correct: true}
      - {text: "`import module geometrie;`", correct: false}
      - {text: "`namespace module geometrie;`", correct: false}
      - {text: "`#module geometrie`", correct: false}
    answer: "`export module nom;` déclare l'interface. `module nom;`, sans `export`, ouvre une unité d'implémentation."
  - key: qcm-importer
    format: multiple-choice
    question: "Quelle ligne rend visibles les déclarations exportées du module `geometrie` ?"
    choices:
      - {text: "`import geometrie;`", correct: true}
      - {text: "`#include <geometrie>`", correct: false}
      - {text: "`using module geometrie;`", correct: false}
      - {text: "`extern geometrie;`", correct: false}
    answer: "`import` est une instruction du langage, terminée par un point-virgule, pas une directive du préprocesseur."
  - key: qcm-cmake
    format: multiple-choice
    question: "Pourquoi le système de construction doit-il connaître les modules ?"
    choices:
      - {text: "Un module doit être compilé avant les fichiers qui l'importent", correct: true}
      - {text: "Un module doit être téléchargé avant d'être compilé", correct: false}
      - {text: "Un module doit être compilé deux fois, par deux compilateurs", correct: false}
      - {text: "Un module doit être converti en en-tête avant la compilation", correct: false}
    answer: "Avec des en-têtes, les fichiers se compilent dans n'importe quel ordre. Avec des modules, il faut analyser les dépendances : CMake le fait depuis sa version 3.28."
  - key: qcm-non-exporte
    format: multiple-choice
    question: "Dans un module, à quoi sert une fonction qui n'est pas marquée `export` ?"
    choices:
      - {text: "À servir de détail interne, utilisable dans le module seulement", correct: true}
      - {text: "À rien : une fonction non exportée est supprimée", correct: false}
      - {text: "À être appelée par les importateurs avec un préfixe", correct: false}
      - {text: "À être compilée dans chaque fichier importateur", correct: false}
    answer: "Elle remplace l'espace de noms `detail` ou anonyme des en-têtes : le module s'en sert, le reste du programme ne la voit pas."
  - key: trous-export
    format: fill-in
    question: |-
      Complète pour rendre la fonction visible des importateurs :
      ```cpp
      export module outils;

      ___ int carre(int n) {
          return n * n;
      }
      ```
    blanks:
      - [export]
    answer: "Seules les déclarations marquées `export` font partie de l'interface."
  - key: trous-import
    format: fill-in
    question: |-
      Complète pour utiliser le module `outils` :
      ```cpp
      ___ outils;

      int main() {
          return carre(3);
      }
      ```
    blanks:
      - [import]
    answer: "`import outils;` donne accès à ce que le module exporte."
  - key: trous-module
    format: fill-in
    question: |-
      Complète la déclaration de l'interface du module :
      ```cpp
      export ___ geometrie;
      ```
    blanks:
      - [module]
    answer: "`export module geometrie;` ouvre l'unité d'interface."
  - key: trous-std
    format: fill-in
    question: |-
      Complète pour importer toute la bibliothèque standard (C++23) :
      ```cpp
      import ___;
      ```
    blanks:
      - [std]
    answer: "`import std;` remplace les `#include` de la bibliothèque standard."
  - key: situation-macro-qui-fuit
    format: scenario
    question: |-
      Un en-tête d'une bibliothèque définit une macro `min`. Depuis qu'il est inclus, tous les `std::min` du projet
      échouent à compiler. Qu'est-ce que les modules changeraient ?
    choices:
      - {text: "La macro resterait dans le module, sans toucher au code importateur", correct: true}
      - {text: "La macro serait renommée automatiquement à l'import", correct: false}
      - {text: "La macro serait appliquée seulement aux fichiers `.hpp`", correct: false}
      - {text: "Rien : un module exporte toujours ses macros", correct: false}
    answer: |-
      Une inclusion recopie le texte, macros comprises. Un module n'exporte que des déclarations : ses macros ne
      sortent pas.
  - key: situation-migration
    format: scenario
    question: |-
      Un responsable propose de convertir aux modules, en un mois, un projet de deux millions de lignes compilé
      par trois compilateurs sur quatre plateformes. Que lui réponds-tu ?
    choices:
      - {text: "De vérifier d'abord la prise en charge par chaque compilateur, le système de construction et les dépendances", correct: true}
      - {text: "De le faire sans attendre : les modules sont pris en charge partout de la même façon", correct: false}
      - {text: "De ne jamais le faire : les modules ont été retirés du standard", correct: false}
      - {text: "De renommer tous les `.hpp` en `.cppm`, ce qui suffit", correct: false}
    answer: |-
      Le langage est prêt, l'outillage l'est inégalement. Une migration se prépare : un essai sur un sous-ensemble,
      avec la chaîne de construction réelle, puis une conversion progressive, les en-têtes et les modules pouvant
      cohabiter.
  - key: situation-compilation
    format: scenario
    question: |-
      Chaque fichier du projet inclut les mêmes cinquante en-têtes, et passe l'essentiel de son temps de
      compilation à les réanalyser. Qu'apporteraient les modules ?
    choices:
      - {text: "Chaque interface serait compilée une fois, puis seulement lue par les fichiers importateurs", correct: true}
      - {text: "Chaque en-tête serait recopié plus vite par le préprocesseur", correct: false}
      - {text: "Chaque fichier serait compilé sans vérification des types", correct: false}
      - {text: "Chaque fichier inclurait moins de bibliothèques à l'exécution", correct: false}
    answer: |-
      C'est la promesse principale : ne plus refaire le même travail d'analyse dans chaque unité de traduction. Les
      en-têtes précompilés visent le même but, de façon moins propre.
  - key: situation-detail
    format: scenario
    question: |-
      Une bibliothèque d'en-têtes range ses fonctions internes dans `namespace detail`, mais des utilisateurs les
      appellent quand même, ce qui empêche de les modifier. Que permettrait un module ?
    choices:
      - {text: "De ne pas exporter ces fonctions : elles deviendraient inaccessibles aux importateurs", correct: true}
      - {text: "De les rendre privées avec le mot-clé `private` devant chaque fonction", correct: false}
      - {text: "De les supprimer du fichier objet de la bibliothèque", correct: false}
      - {text: "De les renommer à chaque compilation", correct: false}
    answer: |-
      `namespace detail` est une convention que rien ne fait respecter. Dans un module, ce qui n'est pas `export`
      n'existe pas pour l'extérieur : l'interface est celle que l'auteur a décidée.
