notion: extern-c
lesson: |-
  En C++, deux fonctions peuvent porter le même nom si leurs paramètres diffèrent. L'éditeur de liens, lui, ne
  connaît que des noms. Le compilateur fabrique donc, pour chaque fonction, un **symbole** qui encode son espace
  de noms et ses paramètres : c'est le **décorage des noms** (*name mangling*).

  ```
  int carre(int)            ->  _Z5carrei
  double carre(double)      ->  _Z5carred
  int geo::aire(int, int)   ->  _ZN3geo4aireEii
  ```

  Le langage **C** n'a pas de surcharge : il ne décore pas. `int carre(int)` y donne le symbole `carre`.

  **Le problème.** Un programme C++ qui appelle une fonction d'une bibliothèque C cherche `_Z5carrei`, alors que
  la bibliothèque fournit `carre` : « undefined reference ».

  **`extern "C"`** demande au compilateur C++ d'utiliser la **liaison C** pour ces déclarations : pas de décorage,
  et la convention d'appel du C.

  ```cpp
  extern "C" int carre(int n);          // une déclaration

  extern "C" {                          // un bloc
      int carre(int n);
      void journaliser(const char* message);
  }
  ```

  **L'en-tête utilisable des deux côtés.** Un en-tête destiné au C et au C++ entoure ses déclarations ainsi :

  ```cpp
  #ifdef __cplusplus
  extern "C" {
  #endif

  int carre(int n);

  #ifdef __cplusplus
  }
  #endif
  ```

  La macro `__cplusplus` n'est définie que par un compilateur C++. Les en-têtes de la bibliothèque C (`<stdio.h>`)
  sont faits ainsi.

  **Dans l'autre sens.** `extern "C"` sert aussi à **exposer** une fonction écrite en C++ à du C, ou à tout
  langage qui sait appeler du C : Python (`ctypes`), Rust, Java (JNI), Go. Le C est la langue commune des
  interfaces binaires.

  **Les limites d'une fonction `extern "C"`.**

  - **Pas de surcharge** : un seul symbole par nom.
  - Sa **signature** ne doit employer que ce que le C comprend : types fondamentaux, pointeurs, `struct` simples.
    Ni référence, ni `std::string`, ni classe à constructeur.
  - Son **corps**, lui, est du C++ ordinaire : il peut utiliser la bibliothèque standard.
  - Elle ne doit **laisser sortir aucune exception** : le C ne sait pas les propager. On les attrape, et l'on
    renvoie un code d'erreur.
  - On n'expose pas de classe : on passe un **pointeur opaque**, avec des fonctions pour créer, utiliser, détruire.

  **Lire les symboles.** `nm fichier.o` liste les symboles d'un fichier objet ; `c++filt` (ou `nm -C`) redonne aux
  noms décorés leur forme lisible.

  **En entretien** : « Le C++ décore les noms pour permettre la surcharge ; le C non. `extern "C"` donne à une
  fonction la liaison C : un symbole non décoré. Je m'en sers pour appeler une bibliothèque C, ou pour exposer du
  C++ à d'autres langages, avec une signature compatible C et sans laisser sortir d'exception. »
cards:
  - key: decorage
    format: course
    question: "Pourquoi le compilateur C++ décore-t-il le nom des fonctions ?"
    choices:
      - {text: "Pour que des fonctions surchargées aient des symboles différents pour l'éditeur de liens", correct: true}
      - {text: "Pour que les noms des fonctions soient illisibles dans l'exécutable", correct: false}
      - {text: "Pour que les fonctions s'exécutent plus vite", correct: false}
      - {text: "Pour que les fonctions soient cachées des autres fichiers source", correct: false}
    answer: "L'éditeur de liens ne distingue les fonctions que par leur symbole. Le décorage y encode l'espace de noms et les types des paramètres."
  - key: role
    format: course
    question: "Que fait `extern \"C\"` devant la déclaration d'une fonction ?"
    choices:
      - {text: "Il lui donne la liaison C : un symbole non décoré, comme en C", correct: true}
      - {text: "Il compile le corps de la fonction avec un compilateur C", correct: false}
      - {text: "Il interdit à la fonction d'utiliser la bibliothèque standard de C++", correct: false}
      - {text: "Il rend la fonction visible seulement depuis des fichiers C", correct: false}
    answer: "Seuls le nom du symbole et la convention d'appel changent. Le corps reste du C++, compilé par le compilateur C++."
  - key: probleme
    format: course
    question: "Que se passe-t-il quand du C++ déclare une fonction d'une bibliothèque C sans `extern \"C\"` ?"
    choices:
      - {text: "L'éditeur de liens cherche un symbole décoré que la bibliothèque n'a pas", correct: true}
      - {text: "Le compilateur refuse la déclaration, avec une erreur de syntaxe", correct: false}
      - {text: "La fonction est appelée, mais ses arguments sont inversés", correct: false}
      - {text: "La fonction est recompilée en C++ à partir de la bibliothèque", correct: false}
    answer: "Le code C++ demande `_Z5carrei` ; la bibliothèque C fournit `carre`. Les deux ne se rencontrent pas."
  - key: limites
    format: course
    question: "Quelle contrainte pèse sur la signature d'une fonction `extern \"C\"` appelée depuis du C ?"
    choices:
      - {text: "Elle n'emploie que des types que le C comprend : fondamentaux, pointeurs, `struct` simples", correct: true}
      - {text: "Elle ne prend aucun paramètre, et renvoie `void`", correct: false}
      - {text: "Elle n'emploie que des références constantes", correct: false}
      - {text: "Elle n'emploie que des types de la bibliothèque standard de C++", correct: false}
    answer: "Le C ne connaît ni les références, ni `std::string`, ni les classes. On passe des pointeurs, des tailles, des pointeurs opaques."
  - key: vf-surcharge
    format: true-false
    question: "Deux fonctions `extern \"C\"` peuvent porter le même nom, avec des paramètres différents."
    truth: false
    answer: "Sans décorage, elles auraient le même symbole. La liaison C interdit la surcharge."
  - key: vf-corps
    format: true-false
    question: "Le corps d'une fonction `extern \"C\"` peut utiliser `std::vector` et `std::string`."
    truth: true
    answer: "La contrainte porte sur la signature, vue de l'extérieur. L'intérieur est du C++ ordinaire."
  - key: vf-exception
    format: true-false
    question: "Une fonction `extern \"C\"` appelée par du C peut laisser sortir une exception sans risque."
    truth: false
    answer: "Le C ne sait pas dérouler une exception. On l'attrape dans la fonction, et l'on renvoie un code d'erreur."
  - key: vf-cplusplus
    format: true-false
    question: "La macro `__cplusplus` n'est définie que lorsque le fichier est compilé par un compilateur C++."
    truth: true
    answer: "C'est ce qui permet à un en-tête de n'ajouter `extern \"C\"` que du côté C++."
  - key: qcm-bloc
    format: multiple-choice
    question: "Comment déclares-tu plusieurs fonctions avec la liaison C en une fois ?"
    choices:
      - {text: "Dans un bloc `extern \"C\" { ... }`", correct: true}
      - {text: "Dans un bloc `namespace C { ... }`", correct: false}
      - {text: "Dans un bloc `#pragma C { ... }`", correct: false}
      - {text: "Dans un bloc `static \"C\" { ... }`", correct: false}
    answer: "Le bloc applique la liaison C à toutes les déclarations qu'il contient."
  - key: qcm-outil
    format: multiple-choice
    question: "Quel outil redonne une forme lisible à un symbole décoré comme `_ZN3geo4aireEii` ?"
    choices:
      - {text: "`c++filt`", correct: true}
      - {text: "`make`", correct: false}
      - {text: "`grep`", correct: false}
      - {text: "`clang-format`", correct: false}
    answer: "`c++filt` décode : `geo::aire(int, int)`. `nm -C` fait de même en listant les symboles d'un fichier objet."
  - key: qcm-autres-langages
    format: multiple-choice
    question: "Tu veux appeler une bibliothèque C++ depuis Python. Quelle interface lui donnes-tu ?"
    choices:
      - {text: "Des fonctions `extern \"C\"`, à signature compatible C", correct: true}
      - {text: "Des templates de fonction, instanciés par Python", correct: false}
      - {text: "Des classes à fonctions virtuelles, héritées en Python", correct: false}
      - {text: "Des macros du préprocesseur", correct: false}
    answer: "Le C est la langue commune : presque tous les langages savent appeler un symbole C. Le décorage du C++, lui, change d'un compilateur à l'autre."
  - key: qcm-classe
    format: multiple-choice
    question: "Comment exposes-tu une classe C++ à du code C ?"
    choices:
      - {text: "Par un pointeur opaque, et des fonctions pour créer, utiliser et détruire l'objet", correct: true}
      - {text: "Par une déclaration `extern \"C\" class Moteur;`", correct: false}
      - {text: "Par une copie de la classe dans une `union`", correct: false}
      - {text: "Par une référence vers l'objet, passée à chaque fonction", correct: false}
    answer: "Le C ne voit qu'un `struct Moteur*` dont il ignore le contenu. Chaque fonction `extern \"C\"` reçoit ce pointeur."
  - key: situation-undefined
    format: scenario
    question: |-
      Ton programme C++ inclut l'en-tête d'une vieille bibliothèque C, écrit sans précaution, et l'édition de liens
      échoue : « undefined reference to `compresser(char const*, int)' ». La bibliothèque est bien liée. Que
      fais-tu ?
    choices:
      - {text: "J'entoure l'inclusion de l'en-tête d'un bloc `extern \"C\" { ... }`", correct: true}
      - {text: "Je recompile la bibliothèque avec un compilateur C++", correct: false}
      - {text: "Je déclare la fonction `inline` dans mon fichier", correct: false}
      - {text: "J'ajoute la bibliothèque une seconde fois à la commande", correct: false}
    answer: |-
      Le message montre un nom avec ses paramètres : le C++ cherche un symbole décoré. La bibliothèque C fournit
      `compresser` tout court. Le bloc `extern "C"` autour du `#include` règle la question.
  - key: situation-exception
    format: scenario
    question: |-
      Une fonction `extern "C"` de ta bibliothèque, appelée par un programme C, lance parfois `std::bad_alloc`. Le
      programme s'arrête brutalement. Que changes-tu ?
    choices:
      - {text: "J'attrape toutes les exceptions dans la fonction, et je renvoie un code d'erreur", correct: true}
      - {text: "Je déclare la fonction `noexcept`, sans rien attraper", correct: false}
      - {text: "Je demande au programme C d'ajouter un bloc `try`", correct: false}
      - {text: "Je retire `extern \"C\"`, pour que l'exception se propage", correct: false}
    answer: |-
      Une exception ne doit pas traverser une frontière C. La fonction se termine par un `catch (...)` qui
      traduit l'échec en valeur de retour. `noexcept` seul transformerait l'exception en `std::terminate`.
  - key: situation-en-tete-commun
    format: scenario
    question: |-
      Tu écris une bibliothèque en C, dont l'en-tête sera inclus par des programmes C et C++. Comment le rends-tu
      utilisable des deux côtés ?
    choices:
      - {text: "Avec `extern \"C\" {` et `}` placés sous `#ifdef __cplusplus`", correct: true}
      - {text: "Avec `extern \"C\"` devant chaque déclaration, sans condition", correct: false}
      - {text: "Avec deux en-têtes différents, que l'utilisateur choisit", correct: false}
      - {text: "Avec `#pragma once`, qui adapte l'en-tête au langage", correct: false}
    answer: |-
      Un compilateur C ne comprend pas `extern "C"` : il faut le lui cacher. `__cplusplus` n'existe que côté C++.
      C'est ainsi que sont écrits les en-têtes de la bibliothèque C.
  - key: situation-signature
    format: scenario
    question: |-
      Un collègue expose à du C la fonction `extern "C" void envoyer(const std::string& message);`. Le code C ne
      parvient pas à l'appeler. Pourquoi ?
    choices:
      - {text: "Le C ne connaît ni les références ni `std::string` : il faut un `const char*`", correct: true}
      - {text: "Une fonction `extern \"C\"` ne peut pas renvoyer `void`", correct: false}
      - {text: "Une fonction `extern \"C\"` ne peut avoir aucun paramètre", correct: false}
      - {text: "Le C exige que le paramètre s'appelle `msg`", correct: false}
    answer: |-
      `extern "C"` change le symbole, pas les types. La signature doit être écrite avec ce que le C sait passer :
      `void envoyer(const char* message);`. Le corps peut ensuite construire une `std::string`.
  - key: definition-mangling
    format: definition
    question: "Qu'est-ce que le décorage des noms (name mangling) ?"
    choices:
      - {text: "L'encodage, dans le symbole d'une fonction, de son espace de noms et de ses paramètres", correct: true}
      - {text: "Le remplacement d'une macro par son texte, avant la compilation", correct: false}
      - {text: "Le chiffrement du code machine d'une fonction", correct: false}
      - {text: "La suppression des fonctions inutilisées par l'éditeur de liens", correct: false}
    answer: "C'est ce qui rend la surcharge possible. Le schéma dépend du compilateur et de la plateforme."
  - key: definition-liaison-c
    format: definition
    question: "Que désigne la « liaison C » d'une fonction ?"
    choices:
      - {text: "Un symbole non décoré et la convention d'appel du C", correct: true}
      - {text: "Une fonction écrite et compilée en langage C", correct: false}
      - {text: "Une fonction visible seulement dans son fichier", correct: false}
      - {text: "Une fonction qui ne peut appeler que des fonctions C", correct: false}
    answer: "C'est une propriété de la déclaration, obtenue par `extern \"C\"`, quel que soit le langage du corps."
  - key: definition-symbole
    format: definition
    question: "Qu'est-ce qu'un symbole, pour l'éditeur de liens ?"
    choices:
      - {text: "Le nom sous lequel une fonction ou une variable apparaît dans un fichier objet", correct: true}
      - {text: "Un caractère spécial du code source, comme `&` ou `*`", correct: false}
      - {text: "Une ligne du fichier source où une erreur a été trouvée", correct: false}
      - {text: "Une option passée au compilateur", correct: false}
    answer: "L'éditeur de liens relie les symboles demandés aux symboles définis. `nm` les liste."
  - key: definition-pointeur-opaque
    format: definition
    question: "Qu'est-ce qu'un pointeur opaque ?"
    choices:
      - {text: "Un pointeur vers un type dont l'utilisateur ignore la définition", correct: true}
      - {text: "Un pointeur qui vaut toujours `nullptr`", correct: false}
      - {text: "Un pointeur qu'on ne peut pas copier", correct: false}
      - {text: "Un pointeur vers une zone de mémoire chiffrée", correct: false}
    answer: "L'utilisateur le reçoit, le repasse aux fonctions de la bibliothèque, et ne peut rien en faire d'autre. C'est la façon d'exposer un objet C++ à du C."
