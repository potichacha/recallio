notion: erreurs-liaison
lesson: |-
  Une erreur de l'**éditeur de liens** arrive après la compilation : chaque fichier, pris seul, est correct. Le
  problème est **entre** les fichiers. On la reconnaît à sa dernière ligne :

  ```
  collect2: error: ld returned 1 exit status
  ```

  Elle ne cite **aucune ligne de ton code** à corriger, seulement un **symbole** : le nom d'une fonction ou d'une
  variable. Il n'y a que deux grandes familles.

  **1. `undefined reference` : déclaré, utilisé, défini nulle part.**

  ```
  /usr/bin/ld: main.o: in function `main':
  main.cpp:(.text+0x15): undefined reference to `carre(int)'
  ```

  Le compilateur a accepté l'appel, sur la foi d'une déclaration. L'éditeur de liens n'a trouvé la définition dans
  **aucun** fichier objet. Les causes, par ordre de fréquence :

  | Cause | Remède |
  |---|---|
  | Le `.cpp` qui définit la fonction n'est pas dans la commande | l'ajouter à `g++`, ou à la cible CMake |
  | La fonction est déclarée, mais on a oublié d'écrire son corps | la définir |
  | La définition n'a **pas la même signature** que la déclaration | accorder les types des paramètres |
  | Une fonction membre définie sans `Classe::` | écrire `void Classe::f()` |
  | Un template défini dans un `.cpp` | déplacer la définition dans l'en-tête |
  | Une bibliothèque n'est pas liée | l'ajouter avec `-l`, **après** les fichiers qui s'en servent |
  | `undefined reference to 'vtable for X'` | définir la première fonction virtuelle non pure de `X` |
  | `undefined reference to 'main'` | aucun fichier compilé ne contient `main` |

  **2. `multiple definition` : défini plus d'une fois.**

  ```
  /usr/bin/ld: outils.o: in function `carre(int)':
  outils.cpp:(.text+0x0): multiple definition of `carre(int)'; main.o:main.cpp:(.text+0x0): first defined here
  ```

  Deux fichiers objets contiennent la même définition. C'est une violation de la **règle de la définition unique**
  (*One Definition Rule*, ODR). Les causes :

  | Cause | Remède |
  |---|---|
  | Une fonction **définie dans un en-tête** inclus par plusieurs `.cpp` | la déplacer dans un `.cpp`, ou la marquer `inline` |
  | Une variable globale définie dans un en-tête | `inline` (C++17), ou `extern` dans l'en-tête et la définition dans un `.cpp` |
  | Un `.cpp` inclus par `#include`, et compilé à part | n'inclure que des en-têtes |
  | Le même fichier passé deux fois à la commande | corriger la commande |

  Une garde d'inclusion n'y change rien : elle agit dans **un** fichier source, alors que le doublon est entre
  **deux**.

  **Lire le message.**

  - Le nom entre apostrophes est le **symbole** : `carre(int)` donne aussi les types des paramètres, ce qui révèle
    une signature qui ne correspond pas.
  - `in function 'main'` dit **qui appelle**.
  - `first defined here` dit où se trouve l'autre définition.
  - Un nom illisible comme `_Z5carrei` est le symbole brut : `c++filt` le traduit.

  **En entretien** : « `undefined reference` : le symbole est déclaré mais sa définition manque à l'édition de
  liens, le plus souvent un fichier ou une bibliothèque oubliés, ou une signature différente. `multiple
  definition` : une définition dans un en-tête, recopiée dans plusieurs unités de traduction. »
cards:
  - key: reconnaitre
    format: course
    question: "À quoi reconnaît-on qu'une erreur vient de l'éditeur de liens, et non du compilateur ?"
    choices:
      - {text: "Elle se termine par « ld returned 1 exit status », et nomme un symbole plutôt qu'une ligne de code", correct: true}
      - {text: "Elle se termine par « compilation terminated », et nomme la ligne où manque un point-virgule", correct: false}
      - {text: "Elle n'apparaît qu'au lancement du programme, après que l'exécutable a été produit", correct: false}
      - {text: "Elle commence par « warning », et n'empêche pas l'exécutable d'être produit", correct: false}
    answer: "`ld` est l'éditeur de liens. À ce stade, chaque fichier a compilé : l'erreur porte sur un symbole manquant ou en double."
  - key: undefined-reference
    format: course
    question: "Que signifie « undefined reference to `carre(int)' » ?"
    choices:
      - {text: "La fonction est déclarée et appelée, mais aucun fichier objet ne contient sa définition", correct: true}
      - {text: "La fonction est appelée sans avoir été déclarée dans le fichier", correct: false}
      - {text: "La fonction est définie dans deux fichiers objets différents", correct: false}
      - {text: "La fonction renvoie une référence vers une variable détruite", correct: false}
    answer: "Le compilateur a fait confiance à la déclaration. L'éditeur de liens cherche le code, et ne le trouve pas."
  - key: multiple-definition
    format: course
    question: "Quelle est la cause la plus courante de « multiple definition of `carre(int)' » ?"
    choices:
      - {text: "La fonction est définie dans un en-tête, inclus par plusieurs fichiers source", correct: true}
      - {text: "La fonction est déclarée dans un en-tête, inclus par plusieurs fichiers source", correct: false}
      - {text: "La fonction est appelée depuis plusieurs fichiers source", correct: false}
      - {text: "La fonction est surchargée avec deux listes de paramètres", correct: false}
    answer: "Chaque fichier source reçoit sa copie de la définition. Une déclaration répétée est sans conséquence ; une définition répétée viole la règle de la définition unique."
  - key: odr
    format: course
    question: "Que dit la règle de la définition unique (ODR) pour une fonction ordinaire ?"
    choices:
      - {text: "Elle a exactement une définition dans tout le programme", correct: true}
      - {text: "Elle a exactement une déclaration dans tout le programme", correct: false}
      - {text: "Elle a une définition dans chaque fichier qui l'appelle", correct: false}
      - {text: "Elle ne peut être appelée qu'une fois dans le programme", correct: false}
    answer: "Les déclarations se répètent librement. Les fonctions `inline` et les templates font exception : ils peuvent être définis dans plusieurs unités de traduction, à l'identique."
  - key: vf-garde
    format: true-false
    question: "Une garde d'inclusion suffit à éviter « multiple definition » pour une fonction définie dans un en-tête."
    truth: false
    answer: "La garde évite une double inclusion dans un même fichier source. La définition reste recopiée dans chaque fichier qui inclut l'en-tête."
  - key: vf-ligne
    format: true-false
    question: "Une erreur « undefined reference » indique la ligne où la définition devrait se trouver."
    truth: false
    answer: "Elle nomme le symbole manquant, et la fonction qui l'appelle. Où le définir, c'est à toi de le savoir."
  - key: vf-inline
    format: true-false
    question: "Une fonction marquée `inline` peut être définie dans un en-tête inclus par plusieurs fichiers source."
    truth: true
    answer: "`inline` autorise plusieurs définitions identiques ; l'éditeur de liens n'en garde qu'une."
  - key: vf-signature
    format: true-false
    question: "Une définition dont les types de paramètres diffèrent de ceux de la déclaration provoque une « undefined reference »."
    truth: true
    answer: "Par surcharge, ce sont deux fonctions différentes : celle qui est déclarée et appelée n'est définie nulle part."
  - key: qcm-fichier-oublie
    format: multiple-choice
    question: "`g++ main.cpp -o app` répond « undefined reference to `carre(int)' ». `carre` est définie dans `outils.cpp`. Que fais-tu ?"
    choices:
      - {text: "J'ajoute `outils.cpp` à la commande", correct: true}
      - {text: "J'ajoute `outils.hpp` à la commande", correct: false}
      - {text: "J'ajoute `#include \"outils.cpp\"` dans `main.cpp`", correct: false}
      - {text: "J'ajoute `inline` devant l'appel de `carre`", correct: false}
    answer: "Le fichier qui contient la définition n'a pas été compilé. Tous les `.cpp` du programme vont dans la commande."
  - key: qcm-variable-globale
    format: multiple-choice
    question: "Comment définis-tu une variable globale dans un en-tête inclus par plusieurs fichiers, sans « multiple definition » ?"
    choices:
      - {text: "`inline int compteur = 0;`", correct: true}
      - {text: "`int compteur = 0;`", correct: false}
      - {text: "`auto compteur = 0;`", correct: false}
      - {text: "`volatile int compteur = 0;`", correct: false}
    answer: "Depuis C++17, `inline` vaut aussi pour les variables. Avant : `extern int compteur;` dans l'en-tête, et `int compteur = 0;` dans un seul `.cpp`."
  - key: qcm-vtable
    format: multiple-choice
    question: "Que signale le plus souvent « undefined reference to `vtable for Forme' » ?"
    choices:
      - {text: "Une fonction virtuelle de `Forme` déclarée, mais jamais définie", correct: true}
      - {text: "Une classe `Forme` définie dans deux en-têtes", correct: false}
      - {text: "Un objet `Forme` créé avec `new` sans `delete`", correct: false}
      - {text: "Un destructeur de `Forme` appelé deux fois", correct: false}
    answer: "La table des fonctions virtuelles est produite avec la première fonction virtuelle non pure de la classe. Si celle-ci n'a pas de corps, la table manque."
  - key: qcm-symbole-illisible
    format: multiple-choice
    question: "L'éditeur de liens cite le symbole `_Z5carrei`. Quel outil le rend lisible ?"
    choices:
      - {text: "`c++filt`", correct: true}
      - {text: "`grep`", correct: false}
      - {text: "`make`", correct: false}
      - {text: "`gdb`", correct: false}
    answer: "Le compilateur encode le nom et les types des paramètres dans le symbole. `c++filt` le décode : `carre(int)`."
  - key: bug-definition-en-tete
    format: bug-fix
    question: |-
      `main.cpp` et `outils.cpp` incluent tous deux cet en-tête. L'édition de liens répond « multiple definition of
      `tva(double)' ». Quelle correction est la bonne ?
      ```cpp
      // prix.hpp
      #pragma once

      double tva(double prix) {
          return prix * 0.2;
      }
      ```
    choices:
      - {text: "Marquer la fonction `inline`", correct: true}
      - {text: "Marquer la fonction `extern`", correct: false}
      - {text: "Retirer la ligne `#pragma once`", correct: false}
      - {text: "Marquer la fonction `virtual`", correct: false}
    answer: |-
      ```cpp
      inline double tva(double prix) {
          return prix * 0.2;
      }
      ```
      Chaque fichier source reçoit une copie de la définition. `inline` permet ces copies identiques. L'autre
      remède : ne laisser que `double tva(double prix);` dans l'en-tête, et définir la fonction dans un `.cpp`.
  - key: bug-membre-sans-classe
    format: bug-fix
    question: |-
      L'édition de liens répond « undefined reference to `Compte::solde() const' ». Quelle correction est la bonne ?
      ```cpp
      // compte.hpp
      class Compte {
      public:
          int solde() const;

      private:
          int solde_ = 0;
      };

      // compte.cpp
      int solde() {
          return 0;
      }
      ```
    choices:
      - {text: "Définir `int Compte::solde() const { return solde_; }`", correct: true}
      - {text: "Définir `int solde() const { return solde_; }`", correct: false}
      - {text: "Définir `static int solde() { return 0; }`", correct: false}
      - {text: "Définir `inline int solde() { return 0; }`", correct: false}
    answer: |-
      ```cpp
      int Compte::solde() const {
          return solde_;
      }
      ```
      Sans `Compte::`, le fichier définit une fonction libre `solde()`, qui n'a rien à voir avec la fonction membre.
      Celle-ci reste sans définition.
  - key: bug-template-dans-cpp
    format: bug-fix
    question: |-
      `main.cpp` appelle `maximum(3, 7)`. L'édition de liens répond « undefined reference to `int
      maximum<int>(int, int)' ». Quelle correction est la bonne ?
      ```cpp
      // outils.hpp
      template <typename T>
      T maximum(T a, T b);

      // outils.cpp
      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }
      ```
    choices:
      - {text: "Écrire la définition du template dans `outils.hpp`", correct: true}
      - {text: "Écrire la déclaration du template dans `outils.cpp`", correct: false}
      - {text: "Écrire `inline` devant la déclaration du template", correct: false}
      - {text: "Écrire `#include \"outils.cpp\"` dans `outils.hpp`, sous la déclaration", correct: false}
    answer: |-
      ```cpp
      // outils.hpp
      template <typename T>
      T maximum(T a, T b) {
          return a < b ? b : a;
      }
      ```
      Le compilateur génère `maximum<int>` là où il voit à la fois l'appel et le code du template. Dans `main.cpp`,
      il n'a que la déclaration ; dans `outils.cpp`, personne ne demande `int`. La définition va dans l'en-tête.
  - key: bug-variable-en-tete
    format: bug-fix
    question: |-
      Cet en-tête est inclus par trois fichiers source. L'édition de liens répond « multiple definition of
      `niveau_journal' ». Quelle correction est la bonne ?
      ```cpp
      // config.hpp
      #pragma once

      int niveau_journal = 2;
      ```
    choices:
      - {text: "Écrire `inline int niveau_journal = 2;`", correct: true}
      - {text: "Écrire `extern int niveau_journal = 2;`", correct: false}
      - {text: "Écrire `register int niveau_journal = 2;`", correct: false}
      - {text: "Écrire `mutable int niveau_journal = 2;`", correct: false}
    answer: |-
      ```cpp
      inline int niveau_journal = 2;
      ```
      Une variable globale définie dans un en-tête existe dans chaque fichier objet. `inline` (C++17) en fait une
      seule variable, partagée. `extern` avec une valeur reste une définition : il faudrait `extern int
      niveau_journal;` ici, et la valeur dans un seul `.cpp`.
  - key: situation-bibliotheque
    format: scenario
    question: |-
      Ton programme inclut `<zlib.h>` et appelle `compress`. La compilation passe, puis : « undefined reference to
      `compress' ». Que manque-t-il ?
    choices:
      - {text: "Lier la bibliothèque : ajouter `-lz` à la fin de la commande", correct: true}
      - {text: "Inclure l'en-tête une seconde fois, dans `main.cpp`", correct: false}
      - {text: "Déclarer `compress` soi-même, au-dessus de `main`", correct: false}
      - {text: "Recompiler le programme avec l'option `-O2`", correct: false}
    answer: |-
      L'en-tête ne fournit que les déclarations : il a suffi au compilateur. Le code de la bibliothèque est dans
      un fichier à part, que l'éditeur de liens doit recevoir avec `-l`. On le place après les fichiers qui s'en
      servent.
  - key: situation-signature
    format: scenario
    question: |-
      L'éditeur de liens répond « undefined reference to `enregistrer(std::string const&)' ». Tu as pourtant bien
      écrit une fonction `enregistrer` dans `stockage.cpp`, qui est dans la commande. Que vérifies-tu ?
    choices:
      - {text: "Que la définition prend exactement les mêmes types de paramètres que la déclaration", correct: true}
      - {text: "Que le fichier `stockage.cpp` commence bien par une garde d'inclusion", correct: false}
      - {text: "Que la fonction `enregistrer` est bien appelée au moins deux fois", correct: false}
      - {text: "Que le fichier `stockage.hpp` figure lui aussi dans la commande de compilation", correct: false}
    answer: |-
      Le message donne la signature attendue. Si la définition prend `std::string` par valeur, ou
      `std::string_view`, c'est une autre fonction : celle de la déclaration n'existe pas. Inclure l'en-tête dans
      `stockage.cpp` n'empêche pas cette erreur, puisque la surcharge est permise.
  - key: situation-refactor
    format: scenario
    question: |-
      Tu déplaces une petite fonction utilitaire d'un `.cpp` vers un en-tête, pour la partager. Le projet ne se
      lie plus : « multiple definition ». Que s'est-il passé, et que fais-tu ?
    choices:
      - {text: "L'en-tête recopie la définition dans chaque fichier source ; je marque la fonction `inline`", correct: true}
      - {text: "L'en-tête n'a pas de garde d'inclusion ; j'ajoute `#pragma once` en haut du fichier", correct: false}
      - {text: "L'en-tête est inclus trop tard ; je le place avant tous les autres `#include`", correct: false}
      - {text: "L'en-tête doit figurer dans la commande de compilation ; je l'y ajoute", correct: false}
    answer: |-
      Une fonction définie dans un en-tête existe dans chaque unité de traduction qui l'inclut. `inline` l'autorise.
      Sinon, on ne met que la déclaration dans l'en-tête, et l'on garde la définition dans un seul `.cpp`.
  - key: situation-main-manquant
    format: scenario
    question: |-
      Tu compiles `g++ outils.cpp -o app`, et l'éditeur de liens répond « undefined reference to `main' ». Ton
      fichier `outils.cpp` compile pourtant sans erreur. Que comprends-tu ?
    choices:
      - {text: "Aucun des fichiers compilés ne définit `main` : il faut ajouter celui qui la contient", correct: true}
      - {text: "La fonction `main` est définie deux fois : il faut retirer l'une des deux", correct: false}
      - {text: "Le fichier `outils.cpp` appelle `main`, ce qui est interdit en C++", correct: false}
      - {text: "La fonction `main` doit être déclarée dans `outils.hpp`", correct: false}
    answer: |-
      Un exécutable a besoin d'un point d'entrée. Le code de démarrage appelle `main`, que l'éditeur de liens
      cherche dans les fichiers objets. Avec `-c`, on compilerait `outils.cpp` seul, sans édition de liens.
