notion: etapes-compilation
lesson: |-
  Entre le texte que tu écris et le programme qui s'exécute, `g++` enchaîne **trois étapes**. Savoir laquelle a
  échoué, c'est déjà comprendre la moitié d'un message d'erreur.

  ```
  main.cpp ──préprocesseur──▶ unité de traduction ──compilateur──▶ main.o ──┐
                                                                           ├─ éditeur de liens ─▶ programme
  outils.cpp ─préprocesseur─▶ unité de traduction ──compilateur──▶ outils.o ┘
  ```

  **1. Le préprocesseur** traite les lignes qui commencent par `#`. Il travaille sur du **texte**, sans rien
  comprendre au C++ :

  - `#include` est remplacé par le **contenu entier** du fichier nommé ;
  - `#define` crée une macro, remplacée partout par sa valeur ;
  - `#ifdef`, `#ifndef`, `#endif` gardent ou retirent des morceaux de texte.

  Le résultat s'appelle une **unité de traduction** : un fichier `.cpp`, une fois tous ses en-têtes recopiés
  dedans. Un simple `#include <print>` y ajoute des dizaines de milliers de lignes.

  **2. Le compilateur** traduit **chaque unité de traduction, séparément**, en code machine : un **fichier objet**
  (`.o`). C'est lui qui vérifie la syntaxe et les types, et qui signale la plupart des erreurs.

  Il ne voit qu'un fichier à la fois. Pour appeler une fonction définie ailleurs, il lui suffit de sa
  **déclaration** : il note dans le fichier objet « il me manque `carre` », et passe à la suite.

  **3. L'éditeur de liens** (*linker*) réunit les fichiers objets et les bibliothèques en un **exécutable**. Il
  relie chaque appel à la définition de la fonction. Ses deux erreurs typiques :

  - `undefined reference` : une fonction est déclarée et appelée, mais **définie nulle part** ;
  - `multiple definition` : elle est définie **deux fois**.

  **Les commandes.**

  ```
  g++ -c main.cpp        # compile seulement : produit main.o
  g++ -c outils.cpp      # produit outils.o
  g++ main.o outils.o -o programme      # édition de liens
  g++ main.cpp outils.cpp -o programme  # tout d'un coup
  ```

  **Pourquoi compiler séparément.** Quand on modifie `outils.cpp`, seul `outils.o` est refait ; l'édition de liens
  réunit le reste. Sur un grand projet, c'est la différence entre quelques secondes et une heure.

  **Reconnaître l'étape d'une erreur.**

  | Message | Étape |
  |---|---|
  | `fatal error: outils.hpp: No such file or directory` | préprocesseur |
  | `error: expected ';'`, `error: 'x' was not declared` | compilateur |
  | `undefined reference to ...`, `ld returned 1 exit status` | éditeur de liens |

  **En entretien** : « Le préprocesseur recopie les en-têtes et développe les macros ; le compilateur traduit chaque
  unité de traduction en fichier objet ; l'éditeur de liens réunit les objets et résout les symboles. Une
  `undefined reference` vient de l'édition de liens, pas de la compilation. »
tour:
  - title: Du texte au programme
    text: |-
      Avant de s'exécuter, ton code passe par trois étapes.

      1. Le **préprocesseur** traite les lignes en `#` : il recopie les en-têtes, et remplace les macros. C'est un
         simple traitement de texte.
      2. Le **compilateur** vérifie le code, et le traduit en langage machine.
      3. L'**éditeur de liens** assemble le tout en un programme.

      Ici, `#define` crée une macro : avant même la compilation, le préprocesseur remplace chaque `TAILLE` par `3`.

      Essaie : change la valeur de `TAILLE`, puis exécute. Les deux lignes qui s'en servent changent ensemble.
    example:
      files:
        main.cpp: |-
          #include <print>

          #define TAILLE 3

          int main() {
              int valeurs[TAILLE] = {};
              for (int i = 0; i < TAILLE; ++i) {
                  valeurs[i] = i * i;
              }
              std::println("{} cases, la dernière vaut {}", TAILLE, valeurs[TAILLE - 1]);
          }
      output: "3 cases, la dernière vaut 4"
cards:
  - key: trois-etapes
    format: course
    question: "Quelles sont, dans l'ordre, les trois étapes qui mènent du code source à l'exécutable ?"
    choices:
      - {text: "Préprocesseur, compilation, édition de liens", correct: true}
      - {text: "Compilation, préprocesseur, édition de liens", correct: false}
      - {text: "Édition de liens, compilation, préprocesseur", correct: false}
      - {text: "Préprocesseur, édition de liens, compilation", correct: false}
    answer: "Le préprocesseur prépare le texte, le compilateur produit un fichier objet par fichier source, l'éditeur de liens les réunit."
  - key: preprocesseur
    format: course
    question: "Que fait le préprocesseur d'une ligne `#include \"outils.hpp\"` ?"
    choices:
      - {text: "Il la remplace par le contenu entier du fichier `outils.hpp`", correct: true}
      - {text: "Il compile `outils.hpp` à part, puis relie le résultat", correct: false}
      - {text: "Il note le nom du fichier, que l'éditeur de liens ouvrira", correct: false}
      - {text: "Il vérifie que les fonctions de `outils.hpp` sont définies", correct: false}
    answer: "C'est un copier-coller de texte. Le compilateur reçoit ensuite un seul gros fichier, sans plus aucune ligne en `#`."
  - key: compilateur
    format: course
    question: "Que produit le compilateur à partir d'un fichier `.cpp` ?"
    choices:
      - {text: "Un fichier objet, qui contient son code machine", correct: true}
      - {text: "Un exécutable, que l'on peut lancer tout de suite", correct: false}
      - {text: "Un en-tête, qui déclare ses fonctions", correct: false}
      - {text: "Un fichier texte, sans les lignes en `#`", correct: false}
    answer: "Chaque fichier source donne un fichier `.o`. Il n'est pas encore exécutable : les appels vers d'autres fichiers n'y sont pas résolus."
  - key: editeur-de-liens
    format: course
    question: "Quel est le rôle de l'éditeur de liens ?"
    choices:
      - {text: "Réunir les fichiers objets, et relier chaque appel à sa définition", correct: true}
      - {text: "Vérifier la syntaxe et les types de chaque fichier source", correct: false}
      - {text: "Recopier le contenu des en-têtes dans les fichiers source", correct: false}
      - {text: "Lancer le programme, et afficher ce qu'il écrit", correct: false}
    answer: "Il assemble les `.o` et les bibliothèques en un exécutable. C'est lui qui signale une fonction définie nulle part, ou définie deux fois."
  - key: vf-preprocesseur-types
    format: true-false
    question: "Le préprocesseur vérifie les types des variables."
    truth: false
    answer: "Il ne manipule que du texte, sans rien connaître du C++. Les types sont l'affaire du compilateur."
  - key: vf-separement
    format: true-false
    question: "Le compilateur traite chaque fichier `.cpp` séparément, sans voir les autres."
    truth: true
    answer: "C'est la compilation séparée. Pour appeler une fonction d'un autre fichier, il lui suffit de sa déclaration."
  - key: vf-undefined-reference
    format: true-false
    question: "L'erreur « undefined reference » est signalée par le compilateur."
    truth: false
    answer: "Elle vient de l'éditeur de liens : la fonction est déclarée, mais aucun fichier objet n'en contient la définition."
  - key: vf-objet-executable
    format: true-false
    question: "Un fichier objet `.o` peut être exécuté directement."
    truth: false
    answer: "Il lui manque l'édition de liens, qui résout les appels vers les autres fichiers et les bibliothèques."
  - key: qcm-compiler-seulement
    format: multiple-choice
    question: "Quelle commande compile `main.cpp` en fichier objet, sans édition de liens ?"
    choices:
      - {text: "`g++ -c main.cpp`", correct: true}
      - {text: "`g++ -o main.cpp`", correct: false}
      - {text: "`g++ -l main.cpp`", correct: false}
      - {text: "`g++ -E main.cpp`", correct: false}
    answer: "`-c` s'arrête après la compilation, et produit `main.o`. `-E` s'arrête après le préprocesseur, et affiche le texte obtenu."
  - key: qcm-etape-fichier-introuvable
    format: multiple-choice
    question: "À quelle étape apparaît « fatal error: outils.hpp: No such file or directory » ?"
    choices:
      - {text: "Au préprocesseur", correct: true}
      - {text: "À la compilation", correct: false}
      - {text: "À l'édition de liens", correct: false}
      - {text: "À l'exécution", correct: false}
    answer: "C'est le préprocesseur qui ouvre les fichiers nommés par `#include`. S'il ne trouve pas l'en-tête, tout s'arrête là."
  - key: qcm-etape-point-virgule
    format: multiple-choice
    question: "À quelle étape apparaît « error: expected ';' before 'return' » ?"
    choices:
      - {text: "À la compilation", correct: true}
      - {text: "Au préprocesseur", correct: false}
      - {text: "À l'édition de liens", correct: false}
      - {text: "À l'exécution", correct: false}
    answer: "Une faute de syntaxe est vue par le compilateur, quand il analyse l'unité de traduction."
  - key: qcm-etape-ld
    format: multiple-choice
    question: "Un message se termine par « ld returned 1 exit status ». Quelle étape a échoué ?"
    choices:
      - {text: "L'édition de liens", correct: true}
      - {text: "Le préprocesseur", correct: false}
      - {text: "La compilation", correct: false}
      - {text: "L'exécution", correct: false}
    answer: "`ld` est l'éditeur de liens. Tous les fichiers ont compilé ; c'est leur assemblage qui échoue."
  - key: situation-recompiler
    format: scenario
    question: |-
      Un projet compte deux cents fichiers `.cpp`. Tu modifies une ligne dans l'un d'eux, et la reconstruction prend
      trois secondes au lieu de dix minutes. Pourquoi ?
    choices:
      - {text: "Seul le fichier modifié est recompilé ; l'édition de liens réunit les objets déjà prêts", correct: true}
      - {text: "Le compilateur ne recompile que la ligne modifiée, à l'intérieur du fichier", correct: false}
      - {text: "L'éditeur de liens corrige l'exécutable existant, sans recompiler aucun fichier", correct: false}
      - {text: "Le préprocesseur a gardé en mémoire le texte des deux cents fichiers", correct: false}
    answer: |-
      C'est l'intérêt de la compilation séparée : chaque fichier source a son fichier objet, refait seulement
      quand il change. Modifier un en-tête inclus partout, en revanche, fait tout recompiler.
  - key: situation-undefined
    format: scenario
    question: |-
      Tu compiles avec `g++ main.cpp -o programme`. `main.cpp` inclut `outils.hpp` et appelle `carre`, définie
      dans `outils.cpp`. Tu obtiens « undefined reference to `carre(int)' ». Que s'est-il passé ?
    choices:
      - {text: "`outils.cpp` n'est pas dans la commande : l'éditeur de liens n'a pas la définition", correct: true}
      - {text: "`outils.hpp` n'a pas été trouvé par le préprocesseur", correct: false}
      - {text: "`carre` est mal écrite dans `main.cpp` : c'est une erreur de syntaxe", correct: false}
      - {text: "`carre` est définie deux fois, dans l'en-tête et dans le fichier source", correct: false}
    answer: |-
      L'en-tête a suffi au compilateur : il connaît la déclaration. Mais la définition est dans `outils.cpp`, qui
      n'a pas été compilé. Il faut `g++ main.cpp outils.cpp -o programme`.
  - key: situation-macro
    format: scenario
    question: |-
      Un collègue écrit `#define CARRE(x) x * x`, puis s'étonne que `CARRE(1 + 2)` vaille 5 et non 9. Que lui
      expliques-tu ?
    choices:
      - {text: "Le préprocesseur remplace du texte : il écrit `1 + 2 * 1 + 2`, sans rien calculer", correct: true}
      - {text: "Le compilateur évalue l'argument deux fois, ce qui fausse le résultat", correct: false}
      - {text: "L'éditeur de liens choisit une autre macro du même nom", correct: false}
      - {text: "Le préprocesseur arrondit le résultat à l'entier inférieur", correct: false}
    answer: |-
      Une macro est un remplacement de texte, fait avant la compilation. `1 + 2 * 1 + 2` vaut 5, par priorité de
      la multiplication. En C++, on écrit une fonction, ou une fonction `constexpr` : elle reçoit une valeur, pas
      du texte.
  - key: situation-quelle-etape
    format: scenario
    question: |-
      Un message d'erreur de quarante lignes se termine par « collect2: error: ld returned 1 exit status ». Un
      débutant cherche une faute de syntaxe dans son code. Que lui dis-tu ?
    choices:
      - {text: "Que le code a compilé : il faut chercher une définition manquante ou en double", correct: true}
      - {text: "Que le préprocesseur n'a pas trouvé un en-tête : il faut vérifier les `#include`", correct: false}
      - {text: "Que le programme a planté à l'exécution : il faut lancer un débogueur", correct: false}
      - {text: "Que le compilateur manque de mémoire : il faut fermer d'autres programmes", correct: false}
    answer: |-
      `ld` est l'éditeur de liens. Une erreur à cette étape veut dire que chaque fichier, pris seul, est correct.
      Le problème est entre les fichiers : une fonction déclarée mais jamais définie, ou définie deux fois.
  - key: definition-unite-de-traduction
    format: definition
    question: "Qu'est-ce qu'une unité de traduction ?"
    choices:
      - {text: "Un fichier source, une fois ses en-têtes recopiés par le préprocesseur", correct: true}
      - {text: "Un fichier objet, produit par le compilateur", correct: false}
      - {text: "Un en-tête, partagé par plusieurs fichiers source", correct: false}
      - {text: "Un exécutable, produit par l'éditeur de liens", correct: false}
    answer: "C'est ce que le compilateur traite réellement : le `.cpp` et tout ce qu'il inclut, d'un seul tenant."
  - key: definition-fichier-objet
    format: definition
    question: "Qu'est-ce qu'un fichier objet ?"
    choices:
      - {text: "Le code machine d'une unité de traduction, avant l'édition de liens", correct: true}
      - {text: "Le texte d'un fichier source, sans ses commentaires", correct: false}
      - {text: "Le programme complet, prêt à être lancé", correct: false}
      - {text: "La liste des classes déclarées dans un en-tête", correct: false}
    answer: "Un fichier `.o` (ou `.obj`). Il contient du code machine et la liste des symboles qu'il définit, et de ceux qui lui manquent."
  - key: definition-editeur-de-liens
    format: definition
    question: "Qu'est-ce que l'éditeur de liens ?"
    choices:
      - {text: "L'outil qui assemble les fichiers objets et les bibliothèques en un exécutable", correct: true}
      - {text: "L'outil qui recopie les en-têtes dans les fichiers source", correct: false}
      - {text: "L'outil qui traduit un fichier source en code machine", correct: false}
      - {text: "L'outil qui exécute le programme pas à pas", correct: false}
    answer: "En anglais, *linker*. Sous Linux, c'est `ld`, que `g++` appelle pour toi."
  - key: definition-macro
    format: definition
    question: "Qu'est-ce qu'une macro ?"
    choices:
      - {text: "Un nom que le préprocesseur remplace par un texte, avant la compilation", correct: true}
      - {text: "Une fonction que le compilateur recopie à chaque appel", correct: false}
      - {text: "Une constante dont le type est vérifié par le compilateur", correct: false}
      - {text: "Un fichier que l'éditeur de liens ajoute au programme", correct: false}
    answer: "Définie par `#define`. Elle n'a ni type ni portée : c'est pourquoi le C++ lui préfère `const`, `constexpr` et les fonctions."
