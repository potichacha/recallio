notion: adl
lesson: |-
  Quand tu appelles une fonction **sans préfixe**, `f(x)`, le compilateur la cherche dans les portées englobantes,
  et **aussi dans les espaces de noms des types de ses arguments**. C'est la recherche de nom dépendant des
  arguments : **ADL** (*argument-dependent lookup*), ou recherche de Koenig.

  ```cpp
  namespace geo {
      struct Point { int x; int y; };
      void afficher(const Point& p);
  }

  int main() {
      geo::Point p{1, 2};
      afficher(p);              // trouve geo::afficher : Point vit dans geo
  }
  ```

  Sans ADL, il faudrait écrire `geo::afficher(p)`.

  **Pourquoi elle existe : les opérateurs.** `std::cout << texte` appelle `operator<<(std::cout, texte)`, une
  fonction de l'espace `std`. Personne n'écrit `std::operator<<(...)` : c'est l'ADL qui la trouve, parce que les
  arguments viennent de `std`. Sans elle, la surcharge d'opérateurs dans un espace de noms serait inutilisable.

  **Les règles.**

  - Elle ne joue que pour un appel **non qualifié** : `geo::f(x)` ou `::f(x)` la désactivent.
  - Les espaces **associés** sont ceux des types des arguments, de leurs classes de base, et des arguments de
    template de ces types.
  - Les **types fondamentaux** (`int`, `double`) n'ont aucun espace associé.
  - Un **alias** ne compte pas : seul le type réel compte.
  - Les fonctions `friend` définies dans une classe ne se trouvent **que** par ADL.
  - Les candidats trouvés par ADL **s'ajoutent** à ceux de la recherche ordinaire ; la résolution de surcharge
    choisit ensuite.

  **L'idiome `using std::swap`.** Dans du code générique, on veut le `swap` propre au type s'il existe, et
  `std::swap` sinon :

  ```cpp
  template <typename T>
  void echanger(T& a, T& b) {
      using std::swap;      // rend std::swap candidat
      swap(a, b);           // non qualifié : l'ADL ajoute le swap de l'espace de T
  }
  ```

  Écrire `std::swap(a, b)` ignorerait la version spécialisée du type. `std::ranges::swap` (C++20) fait ce choix
  tout seul.

  **Les surprises.**

  - Un appel non qualifié peut atteindre une fonction **à laquelle on ne pensait pas**, parce qu'un argument vient
    d'un autre espace : `distance(a, b)` avec des itérateurs de `std` trouve `std::distance`.
  - Deux candidats de deux espaces peuvent rendre l'appel **ambigu**.
  - Pour empêcher l'ADL : qualifier l'appel, ou mettre le nom entre parenthèses, `(f)(x)`.

  **La bonne pratique.** Placer les fonctions libres et les opérateurs d'un type **dans l'espace de noms de ce
  type** : ils font partie de son interface, et l'ADL les trouve. Et qualifier les appels quand on veut une
  fonction précise.

  **En entretien** : « L'ADL fait chercher une fonction appelée sans préfixe dans les espaces de noms des types de
  ses arguments. C'est ce qui fait marcher `std::cout << x` et les opérateurs en général. C'est aussi la raison de
  l'idiome `using std::swap; swap(a, b);`. Un appel qualifié la désactive. »
cards:
  - key: definition
    format: course
    question: "Que fait l'ADL (recherche de nom dépendant des arguments) ?"
    choices:
      - {text: "Elle cherche aussi une fonction appelée sans préfixe dans les espaces de noms des types de ses arguments", correct: true}
      - {text: "Elle cherche une fonction dans tous les espaces de noms du programme, sans exception", correct: false}
      - {text: "Elle convertit les arguments vers le type attendu par la fonction", correct: false}
      - {text: "Elle choisit la fonction d'après le type réel de l'objet, à l'exécution", correct: false}
    answer: "L'appel `f(x)` regarde les portées habituelles, plus l'espace où le type de `x` est défini. Le tout se décide à la compilation."
  - key: operateurs
    format: course
    question: "Pourquoi `std::cout << texte` fonctionne-t-il sans écrire `std::operator<<` ?"
    choices:
      - {text: "L'ADL trouve l'opérateur dans `std`, l'espace des types de ses arguments", correct: true}
      - {text: "Les opérateurs sont toujours définis dans l'espace de noms global", correct: false}
      - {text: "L'en-tête `<iostream>` contient un `using namespace std;`", correct: false}
      - {text: "Le compilateur traite `<<` à part, sans chercher de fonction", correct: false}
    answer: "`operator<<` est une fonction de `std`. Appelée sans préfixe par l'écriture `a << b`, elle est trouvée grâce au type de `std::cout`."
  - key: qualifie
    format: course
    question: "Dans quel cas l'ADL ne s'applique-t-elle pas ?"
    choices:
      - {text: "Quand l'appel est qualifié, comme `geo::afficher(p)`", correct: true}
      - {text: "Quand la fonction a plus de deux paramètres", correct: false}
      - {text: "Quand la fonction renvoie `void`", correct: false}
      - {text: "Quand l'argument est passé par référence constante", correct: false}
    answer: "Un préfixe dit exactement où chercher : la recherche par les arguments est désactivée. Des parenthèses autour du nom, `(f)(x)`, ont le même effet."
  - key: using-swap
    format: course
    question: "Pourquoi écrit-on `using std::swap; swap(a, b);` dans du code générique ?"
    choices:
      - {text: "Pour que l'ADL choisisse le `swap` propre au type s'il existe, et `std::swap` sinon", correct: true}
      - {text: "Pour que l'appel soit toujours résolu vers `std::swap`, sans exception", correct: false}
      - {text: "Pour que `swap` soit insérée à l'endroit de l'appel", correct: false}
      - {text: "Pour que les deux arguments soient copiés avant l'échange", correct: false}
    answer: "`using` rend `std::swap` candidat ; l'appel non qualifié laisse l'ADL y ajouter la version de l'espace du type. `std::swap(a, b)` ignorerait cette dernière."
  - key: vf-fondamentaux
    format: true-false
    question: "Un argument de type `int` déclenche une recherche dans un espace de noms associé."
    truth: false
    answer: "Les types fondamentaux n'ont aucun espace associé. L'ADL ne joue qu'avec des classes, des énumérations et leurs dérivés."
  - key: vf-friend
    format: true-false
    question: "Une fonction `friend` définie dans une classe ne se trouve que par ADL."
    truth: true
    answer: "Elle n'est pas déclarée dans l'espace englobant. Seul un appel dont un argument est du type de la classe la trouve."
  - key: vf-alias
    format: true-false
    question: "Un alias de type déclaré dans un espace de noms ajoute cet espace aux espaces associés."
    truth: false
    answer: "L'ADL regarde le type réel, pas l'alias. `using Entier = int;` dans un espace ne lui associe rien."
  - key: vf-base
    format: true-false
    question: "L'espace de noms d'une classe de base fait partie des espaces associés à une classe dérivée."
    truth: true
    answer: "Les fonctions libres écrites pour la base restent trouvables avec un objet dérivé."
  - key: qcm-ou-placer
    format: multiple-choice
    question: "Où places-tu l'`operator<<` d'une classe `geo::Point` pour qu'il soit trouvé partout ?"
    choices:
      - {text: "Dans l'espace de noms `geo`, avec la classe", correct: true}
      - {text: "Dans l'espace de noms `std`", correct: false}
      - {text: "Dans l'espace de noms global", correct: false}
      - {text: "Dans un espace de noms anonyme", correct: false}
    answer: "L'ADL cherche dans l'espace du type. Ajouter une surcharge à `std` est interdit, et l'espace global peut être masqué."
  - key: qcm-desactiver
    format: multiple-choice
    question: "Comment forces-tu l'appel de la fonction globale `afficher`, sans ADL ?"
    choices:
      - {text: "`::afficher(p);`", correct: true}
      - {text: "`afficher(p);`", correct: false}
      - {text: "`afficher(::p);`", correct: false}
      - {text: "`using afficher(p);`", correct: false}
    answer: "Un appel qualifié, ici par `::`, ne regarde que la portée nommée."
  - key: qcm-surprise
    format: multiple-choice
    question: "Tu écris ta propre fonction `distance(It a, It b)`, et l'appelles avec des itérateurs de `std::vector`. Quel risque ?"
    choices:
      - {text: "L'ADL ajoute `std::distance` : l'appel peut devenir ambigu", correct: true}
      - {text: "L'ADL supprime ta fonction des candidats", correct: false}
      - {text: "L'ADL convertit les itérateurs en entiers", correct: false}
      - {text: "Aucun : l'ADL ne s'applique pas aux itérateurs", correct: false}
    answer: "Les itérateurs d'un vecteur ont `std` pour espace associé. Qualifier l'appel, ou choisir un autre nom, lève le doute."
  - key: qcm-ranges
    format: multiple-choice
    question: "Quelle fonction de C++20 fait à ta place le choix entre le `swap` du type et `std::swap` ?"
    choices:
      - {text: "`std::ranges::swap`", correct: true}
      - {text: "`std::move`", correct: false}
      - {text: "`std::exchange`", correct: false}
      - {text: "`std::forward`", correct: false}
    answer: "`std::ranges::swap(a, b)` applique la bonne recherche, sans l'idiome `using std::swap`."
  - key: code-adl
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace geo {
      struct Point {
          int x;
      };

      void afficher(const Point& p) {
          std::println("geo {}", p.x);
      }
      }  // namespace geo

      int main() {
          const geo::Point p{7};
          afficher(p);
      }
      ```
    choices:
      - {text: "`geo 7`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`geo 7` : `afficher` est appelée sans préfixe, mais son argument est un `geo::Point`. L'ADL cherche dans `geo`."
    check:
      output: "geo 7"
  - key: code-sans-adl
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace outils {
      void doubler(int n) {
          std::println("{}", n * 2);
      }
      }  // namespace outils

      int main() {
          doubler(21);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`42`", correct: false}
      - {text: "`21`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `int` n'a aucun espace de noms associé, donc l'ADL ne regarde pas dans `outils`. Il faut écrire `outils::doubler(21)`."
    check:
      compiles: false
  - key: code-swap
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      namespace jeu {
      struct Carte {
          int valeur;
      };

      void swap(Carte& a, Carte& b) {
          std::print("jeu ");
          std::swap(a.valeur, b.valeur);
      }
      }  // namespace jeu

      template <typename T>
      void echanger(T& a, T& b) {
          using std::swap;
          swap(a, b);
      }

      int main() {
          jeu::Carte x{1};
          jeu::Carte y{2};
          echanger(x, y);
          int m = 3;
          int n = 4;
          echanger(m, n);
          std::println("{} {}", x.valeur, m);
      }
      ```
    choices:
      - {text: "`jeu 2 4`", correct: true}
      - {text: "`2 4`", correct: false}
      - {text: "`jeu jeu 2 4`", correct: false}
      - {text: "`jeu 1 3`", correct: false}
    answer: "`jeu 2 4` : pour `Carte`, l'ADL trouve `jeu::swap`, préférée au template de `std`. Pour `int`, il ne reste que `std::swap`, silencieux."
    check:
      output: "jeu 2 4"
  - key: code-friend
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace banque {
      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}
          friend int solde_de(const Compte& compte) { return compte.solde_; }

      private:
          int solde_;
      };
      }  // namespace banque

      int main() {
          const banque::Compte compte{50};
          std::println("{}", solde_de(compte));
      }
      ```
    choices:
      - {text: "`50`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`50` : une fonction `friend` définie dans la classe n'est visible que par ADL. L'argument de type `Compte` suffit à la trouver."
    check:
      output: "50"
  - key: bug-operateur-global
    format: bug-fix
    question: |-
      Le compilateur ne trouve pas d'`operator==` pour comparer deux `geo::Point` dans `std::find` : l'opérateur,
      défini dans l'espace global, est invisible depuis `std`. Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      namespace geo {
      struct Point {
          int x;
      };
      }  // namespace geo

      namespace std_like {
      template <typename T>
      bool contient(const std::vector<T>& v, const T& cible) {
          return std::find(v.begin(), v.end(), cible) != v.end();
      }
      }  // namespace std_like

      bool operator==(const geo::Point& a, const geo::Point& b) {
          return a.x == b.x;
      }

      int main() {
          const std::vector<geo::Point> points{{1}, {2}};
          std::println("{}", std_like::contient(points, geo::Point{2}));
      }
      ```
    choices:
      - {text: "Définir `operator==` dans l'espace de noms `geo`, avec `Point`", correct: true}
      - {text: "Définir `operator==` dans l'espace de noms `std`", correct: false}
      - {text: "Définir `operator==` dans un espace de noms anonyme", correct: false}
      - {text: "Définir `operator==` deux fois, avant et après `main`", correct: false}
    answer: |-
      ```cpp
      namespace geo {
      struct Point {
          int x;
      };

      bool operator==(const Point& a, const Point& b) {
          return a.x == b.x;
      }
      }  // namespace geo
      ```
      Depuis l'intérieur de `std`, la recherche ordinaire ne voit pas un opérateur global déclaré plus tard. L'ADL,
      elle, regarde dans `geo`, l'espace du type : c'est là que vont ses opérateurs.
  - key: bug-std-swap-qualifie
    format: bug-fix
    question: |-
      Ce programme devrait utiliser l'échange propre à `Carte` et afficher `jeu`. Il n'affiche rien. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>

      namespace jeu {
      struct Carte {
          int valeur;
      };

      void swap(Carte& a, Carte& b) {
          std::println("jeu");
          std::swap(a.valeur, b.valeur);
      }
      }  // namespace jeu

      template <typename T>
      void echanger(T& a, T& b) {
          std::swap(a, b);
      }

      int main() {
          jeu::Carte x{1};
          jeu::Carte y{2};
          echanger(x, y);
      }
      ```
    choices:
      - {text: "Écrire `using std::swap; swap(a, b);` dans `echanger`", correct: true}
      - {text: "Écrire `::swap(a, b);` dans `echanger`", correct: false}
      - {text: "Écrire `std::move(a, b);` dans `echanger`", correct: false}
      - {text: "Écrire `std::swap<T>(a, b);` dans `echanger`", correct: false}
    answer: |-
      ```cpp
      using std::swap;
      swap(a, b);
      ```
      `std::swap(a, b)` est qualifié : pas d'ADL, donc toujours la version générique. L'appel non qualifié laisse
      l'ADL trouver `jeu::swap`. `std::ranges::swap(a, b)` conviendrait aussi.
  - key: bug-prefixe-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « 'carre' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      namespace maths {
      int carre(int n) {
          return n * n;
      }
      }  // namespace maths

      int main() {
          std::println("{}", carre(6));
      }
      ```
    choices:
      - {text: "Écrire `maths::carre(6)`", correct: true}
      - {text: "Écrire `carre(maths::6)`", correct: false}
      - {text: "Écrire `(carre)(6)`", correct: false}
      - {text: "Écrire `::carre(6)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", maths::carre(6));
      ```
      L'argument est un `int`, sans espace de noms associé : l'ADL n'aide pas. Il faut qualifier l'appel, ou une
      déclaration `using maths::carre;`.
  - key: bug-ambigu
    format: bug-fix
    question: |-
      Le compilateur répond « call of overloaded 'afficher(const b::Carte&)' is ambiguous ». Quelle correction
      appelle la version de l'espace `a` ?
      ```cpp
      #include <print>

      namespace b {
      struct Carte {};

      void afficher(const Carte&) {
          std::println("b");
      }
      }  // namespace b

      namespace a {
      void afficher(const b::Carte&) {
          std::println("a");
      }

      void lancer() {
          const b::Carte carte;
          afficher(carte);
      }
      }  // namespace a

      int main() {
          a::lancer();
      }
      ```
    choices:
      - {text: "Écrire `a::afficher(carte);`", correct: true}
      - {text: "Écrire `afficher(a::carte);`", correct: false}
      - {text: "Écrire `afficher(carte, carte);`", correct: false}
      - {text: "Écrire `using namespace b;` avant l'appel", correct: false}
    answer: |-
      ```cpp
      a::afficher(carte);
      ```
      La recherche ordinaire trouve `a::afficher` ; l'ADL ajoute `b::afficher`, puisque `Carte` vient de `b`. Les
      deux conviennent autant. Un appel qualifié désactive l'ADL.
