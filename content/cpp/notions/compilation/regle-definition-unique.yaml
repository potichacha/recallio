notion: regle-definition-unique
lesson: |-
  La **règle de la définition unique** (*One Definition Rule*, ODR) fixe combien de fois une entité peut être
  **définie**. Les déclarations, elles, se répètent librement. Elle tient en deux niveaux.

  **1. Dans une unité de traduction : une seule définition de chaque chose.** Deux définitions de la même classe,
  de la même fonction ou de la même variable dans un même fichier source sont refusées par le **compilateur** :
  `redefinition of ...`. C'est ce qu'évitent les gardes d'inclusion.

  **2. Dans tout le programme**, cela dépend de l'entité.

  | Entité | Définitions permises dans le programme | Où l'écrire |
  |---|---|---|
  | Fonction ordinaire, variable globale | **exactement une** | dans un `.cpp` |
  | Fonction `inline`, variable `inline` | une par unité de traduction, **toutes identiques** | dans l'en-tête |
  | Classe, `struct`, `enum` | une par unité de traduction, **toutes identiques** | dans l'en-tête |
  | Template, fonction `constexpr` | une par unité de traduction, **toutes identiques** | dans l'en-tête |

  Une fonction membre définie **dans** la classe est `inline` d'office : elle peut vivre dans l'en-tête.

  **Ce qui se voit.** Une fonction ordinaire définie deux fois donne `multiple definition` à l'édition de liens ;
  définie zéro fois, `undefined reference`.

  **Ce qui ne se voit pas.** Pour la seconde catégorie, « toutes identiques » n'est **pas vérifié**. Si deux fichiers
  voient deux définitions différentes d'une même classe ou d'une même fonction `inline`, le programme est **mal
  formé, sans diagnostic exigé** : il compile, se lie, et son comportement est indéfini. L'éditeur de liens garde
  une des versions, au hasard de l'ordre des fichiers.

  Les causes typiques :

  - deux classes **de même nom**, différentes, dans deux `.cpp` (une `struct Options` locale à chacun) ;
  - un en-tête dont le contenu dépend d'une **macro** définie dans un fichier et pas dans l'autre (`#ifdef DEBUG`
    autour d'un membre) ;
  - des fichiers compilés avec des **options différentes**, qui changent la taille d'un type ;
  - une bibliothèque compilée avec une version de l'en-tête, et le programme avec une autre.

  **Les remèdes.**

  - Ce qui est **local à un fichier** se place dans un **espace de noms anonyme** : `namespace { struct Options {
    ... }; }`. Chaque fichier a alors sa propre entité, sans conflit. (`static` fait de même pour une fonction ou
    une variable.)
  - Une classe partagée se définit dans **un seul en-tête**, inclus partout.
  - Une fonction ou une variable définie dans un en-tête est marquée **`inline`**.
  - Tout le programme se compile avec les **mêmes options** et les mêmes macros.

  **`inline` ne veut pas dire « recopier le corps ».** Son sens aujourd'hui est celui de l'ODR : « cette
  définition peut apparaître dans plusieurs unités de traduction ». L'insertion du corps à l'appel est décidée par
  l'optimiseur, avec ou sans le mot-clé.

  **En entretien** : « Une fonction ou une variable ordinaire a une seule définition dans le programme. Les classes,
  les templates et les entités `inline` peuvent être définis dans chaque unité de traduction, à condition d'être
  identiques : une différence n'est pas diagnostiquée, c'est un comportement indéfini. Ce qui est local à un
  fichier va dans un espace de noms anonyme. »
cards:
  - key: deux-niveaux
    format: course
    question: "Combien de fois une classe peut-elle être définie dans un programme de plusieurs fichiers source ?"
    choices:
      - {text: "Une fois par unité de traduction, toutes les définitions étant identiques", correct: true}
      - {text: "Une seule fois pour tout le programme, dans un fichier `.cpp`", correct: false}
      - {text: "Autant de fois qu'on veut, même dans un seul fichier source", correct: false}
      - {text: "Une fois par unité de traduction, avec des membres différents si besoin", correct: false}
    answer: "Chaque fichier qui s'en sert doit voir sa définition complète : elle est donc dans un en-tête. Mais toutes les copies doivent être le même texte."
  - key: violation-silencieuse
    format: course
    question: "Deux fichiers source définissent chacun une `struct Options` différente, sous le même nom. Que se passe-t-il ?"
    choices:
      - {text: "Le programme se lie sans message, et son comportement est indéfini", correct: true}
      - {text: "L'éditeur de liens signale toujours « multiple definition »", correct: false}
      - {text: "Le compilateur signale toujours « redefinition of struct »", correct: false}
      - {text: "Chaque fichier garde sa version, sans aucune conséquence", correct: false}
    answer: "Chaque fichier compile seul. Rien n'oblige les outils à comparer les deux définitions : « mal formé, sans diagnostic exigé ». Les fonctions membres générées peuvent être confondues à l'édition de liens."
  - key: inline-sens
    format: course
    question: "Que signifie `inline` devant une fonction, du point de vue de la règle de la définition unique ?"
    choices:
      - {text: "Que sa définition peut apparaître, identique, dans plusieurs unités de traduction", correct: true}
      - {text: "Que son corps sera forcément recopié à la place de chaque appel", correct: false}
      - {text: "Que sa définition n'est visible que dans le fichier où elle est écrite", correct: false}
      - {text: "Que sa définition doit être écrite dans un seul fichier `.cpp`", correct: false}
    answer: "C'est ce qui permet de définir une fonction dans un en-tête. L'insertion du corps à l'appel est une décision de l'optimiseur, indépendante du mot-clé."
  - key: local-au-fichier
    format: course
    question: "Comment déclare-t-on une classe utilitaire qui ne sert que dans un seul fichier `.cpp` ?"
    choices:
      - {text: "Dans un espace de noms anonyme : `namespace { ... }`", correct: true}
      - {text: "Avec le mot-clé `inline` devant la classe", correct: false}
      - {text: "Avec le mot-clé `extern` devant la classe", correct: false}
      - {text: "Dans l'espace de noms `std`, réservé à cet usage", correct: false}
    answer: "Tout ce qui est dans un espace de noms anonyme est propre à l'unité de traduction : un autre fichier peut avoir une classe du même nom sans violer la règle."
  - key: vf-declarations
    format: true-false
    question: "La règle de la définition unique interdit de déclarer une fonction dans deux fichiers."
    truth: false
    answer: "Elle porte sur les définitions. Une déclaration se répète autant qu'on veut : c'est le principe d'un en-tête."
  - key: vf-membre-dans-classe
    format: true-false
    question: "Une fonction membre définie dans le corps de sa classe est implicitement `inline`."
    truth: true
    answer: "C'est pourquoi une classe entière, corps des fonctions compris, peut vivre dans un en-tête inclus partout."
  - key: vf-diagnostic
    format: true-false
    question: "L'éditeur de liens détecte toujours deux définitions différentes d'une même fonction `inline`."
    truth: false
    answer: "Il en garde une, sans comparer. Le standard n'exige aucun diagnostic : le comportement est indéfini."
  - key: vf-template
    format: true-false
    question: "Un template de fonction peut être défini dans un en-tête inclus par plusieurs fichiers source."
    truth: true
    answer: "Comme une fonction `inline`, il peut être défini dans chaque unité de traduction, à l'identique. Il le doit même, pour être instancié."
  - key: qcm-exactement-une
    format: multiple-choice
    question: "Laquelle de ces entités doit avoir exactement une définition dans tout le programme ?"
    choices:
      - {text: "Une variable globale ordinaire", correct: true}
      - {text: "Une classe", correct: false}
      - {text: "Un template de fonction", correct: false}
      - {text: "Une fonction `inline`", correct: false}
    answer: "Une variable globale ou une fonction ordinaire se définit dans un seul `.cpp`. Les trois autres se définissent dans un en-tête."
  - key: qcm-sigle
    format: multiple-choice
    question: "Que signifie le sigle ODR ?"
    choices:
      - {text: "One Definition Rule", correct: true}
      - {text: "Object Destruction Rule", correct: false}
      - {text: "Order of Declaration Rule", correct: false}
      - {text: "Overload Deduction Rule", correct: false}
    answer: "La règle de la définition unique."
  - key: qcm-macro
    format: multiple-choice
    question: "Un en-tête contient `#ifdef TRACE` autour d'un membre de classe. Quand viole-t-il la règle de la définition unique ?"
    choices:
      - {text: "Quand `TRACE` est définie pour certains fichiers source, et pas pour d'autres", correct: true}
      - {text: "Quand `TRACE` est définie pour tous les fichiers source du programme", correct: false}
      - {text: "Quand `TRACE` n'est définie pour aucun fichier source du programme", correct: false}
      - {text: "Quand l'en-tête est protégé par une garde d'inclusion", correct: false}
    answer: "Les fichiers ne voient alors pas la même classe : sa taille diffère d'un fichier à l'autre. Tout le programme doit être compilé avec les mêmes macros."
  - key: qcm-variable-en-tete
    format: multiple-choice
    question: "Quelle ligne, dans un en-tête inclus partout, respecte la règle de la définition unique ?"
    choices:
      - {text: "`inline constexpr int limite = 10;`", correct: true}
      - {text: "`int limite = 10;`", correct: false}
      - {text: "`extern int limite = 10;`", correct: false}
      - {text: "`double limite = 10;`", correct: false}
    answer: "`inline` autorise la définition dans chaque unité de traduction. Sans lui, une variable globale modifiable existe dans chaque fichier objet : « multiple definition »."
  - key: bug-deux-structs
    format: bug-fix
    question: |-
      Ces deux fichiers compilent et se lient, mais le programme se comporte de façon imprévisible : les deux
      `Options` portent le même nom. Quelle correction est la bonne ?
      ```cpp
      // lecture.cpp
      struct Options {
          int tampon = 64;
      };

      // ecriture.cpp
      struct Options {
          bool compresser = false;
          int niveau = 9;
      };
      ```
    choices:
      - {text: "Placer chaque `struct Options` dans un espace de noms anonyme", correct: true}
      - {text: "Placer une garde d'inclusion en haut de chaque fichier source", correct: false}
      - {text: "Marquer chaque `struct Options` avec le mot-clé `inline`", correct: false}
      - {text: "Compiler les deux fichiers dans l'ordre inverse", correct: false}
    answer: |-
      ```cpp
      // lecture.cpp
      namespace {
      struct Options {
          int tampon = 64;
      };
      }  // namespace
      ```
      Deux définitions différentes d'une même classe violent la règle, sans diagnostic. Dans un espace de noms
      anonyme, chaque `Options` est propre à son fichier. Leur donner deux noms différents conviendrait aussi.
  - key: bug-fonction-en-tete
    format: bug-fix
    question: |-
      Cet en-tête est inclus par trois fichiers source. L'édition de liens répond « multiple definition of
      `arrondir(double)' ». Quelle correction est la bonne ?
      ```cpp
      // maths.hpp
      #pragma once

      int arrondir(double valeur) {
          return static_cast<int>(valeur + 0.5);
      }
      ```
    choices:
      - {text: "Écrire `inline int arrondir(double valeur)`", correct: true}
      - {text: "Écrire `extern int arrondir(double valeur)`", correct: false}
      - {text: "Écrire `#pragma once` une seconde fois", correct: false}
      - {text: "Écrire `virtual int arrondir(double valeur)`", correct: false}
    answer: |-
      ```cpp
      inline int arrondir(double valeur) {
          return static_cast<int>(valeur + 0.5);
      }
      ```
      Une fonction ordinaire n'a droit qu'à une définition dans le programme ; l'en-tête en donne une à chaque
      fichier. `inline` autorise ces copies identiques. La garde d'inclusion n'agit que dans un même fichier.
  - key: bug-variable-en-tete
    format: bug-fix
    question: |-
      Cet en-tête est inclus par deux fichiers source. L'édition de liens répond « multiple definition of
      `compteur_global' ». Quelle correction est la bonne ?
      ```cpp
      // compteur.hpp
      #pragma once

      int compteur_global = 0;
      ```
    choices:
      - {text: "Déclarer `extern int compteur_global;` ici, et la définir dans un seul `.cpp`", correct: true}
      - {text: "Déclarer `const int compteur_global;` ici, sans lui donner de valeur", correct: false}
      - {text: "Déclarer `int compteur_global;` ici, sans lui donner de valeur", correct: false}
      - {text: "Déclarer `mutable int compteur_global = 0;` dans l'en-tête", correct: false}
    answer: |-
      ```cpp
      // compteur.hpp
      extern int compteur_global;

      // compteur.cpp
      int compteur_global = 0;
      ```
      `extern` sans valeur est une déclaration, répétable. La définition, unique, est dans un fichier source.
      Depuis C++17, `inline int compteur_global = 0;` dans l'en-tête fait la même chose en une ligne.
  - key: bug-inline-differents
    format: bug-fix
    question: |-
      Selon l'ordre des fichiers dans la commande, `taux()` renvoie `0.2` ou `0.1` partout. Quelle correction est la
      bonne ?
      ```cpp
      // facture.cpp
      inline double taux() { return 0.2; }

      // devis.cpp
      inline double taux() { return 0.1; }
      ```
    choices:
      - {text: "Définir `taux()` une seule fois, dans un en-tête inclus par les deux fichiers", correct: true}
      - {text: "Retirer `inline` dans un seul des deux fichiers, et le garder dans l'autre", correct: false}
      - {text: "Ajouter `constexpr` aux deux définitions, sans changer leur valeur", correct: false}
      - {text: "Compiler toujours `facture.cpp` en premier dans la commande", correct: false}
    answer: |-
      ```cpp
      // taux.hpp
      inline double taux() { return 0.2; }
      ```
      Deux définitions `inline` différentes violent la règle : l'éditeur de liens en garde une pour tout le
      programme, sans prévenir. S'il faut vraiment deux taux, ce sont deux fonctions, de deux noms.
  - key: situation-options-compilation
    format: scenario
    question: |-
      Une bibliothèque est compilée avec `-DAVEC_JOURNAL`, qui ajoute un membre à une classe de son en-tête. Le
      programme qui l'utilise est compilé sans cette option, et plante dans le constructeur de la classe. Pourquoi ?
    choices:
      - {text: "Les deux côtés ne voient pas la même classe : sa taille et la place de ses membres diffèrent", correct: true}
      - {text: "La bibliothèque a été compilée après le programme, ce que l'éditeur de liens refuse", correct: false}
      - {text: "La macro `AVEC_JOURNAL` désactive les constructeurs de toutes les classes", correct: false}
      - {text: "Le programme devait inclure l'en-tête deux fois pour voir le membre ajouté", correct: false}
    answer: |-
      C'est une violation de la règle de la définition unique, que rien ne signale. Le code de la bibliothèque
      écrit dans un membre que l'appelant n'a pas réservé. Tout ce qui partage un en-tête se compile avec les mêmes
      macros.
  - key: situation-deux-versions
    format: scenario
    question: |-
      Après la mise à jour d'une bibliothèque, un programme se comporte bizarrement. Son code a été recompilé avec
      les nouveaux en-têtes, mais il est lié à l'ancienne version du binaire de la bibliothèque. Que soupçonnes-tu ?
    choices:
      - {text: "Les définitions des classes diffèrent entre l'en-tête et le binaire : il faut tout reconstruire", correct: true}
      - {text: "Le compilateur a gardé les anciens en-têtes en mémoire : il faut redémarrer la machine", correct: false}
      - {text: "La nouvelle version est plus lente : il faut activer l'optimisation", correct: false}
      - {text: "L'éditeur de liens a fusionné les deux versions : il n'y a rien à faire", correct: false}
    answer: |-
      Le programme et la bibliothèque ne s'accordent plus sur la forme des objets. Aucun outil ne le vérifie.
      En-têtes et binaire doivent venir de la même version.
  - key: situation-helper-duplique
    format: scenario
    question: |-
      Deux développeurs ont écrit, chacun dans son `.cpp`, une fonction `bool valide(int)` au comportement
      différent. L'édition de liens échoue : « multiple definition ». Aucune des deux ne sert ailleurs. Que
      proposes-tu ?
    choices:
      - {text: "Placer chacune dans un espace de noms anonyme, dans son fichier", correct: true}
      - {text: "Marquer les deux `inline`, pour que l'éditeur de liens en garde une", correct: false}
      - {text: "Déclarer les deux dans un même en-tête, inclus par les deux fichiers", correct: false}
      - {text: "Supprimer l'une des deux, et garder celle qui est liée en premier", correct: false}
    answer: |-
      Une fonction d'aide locale à un fichier ne doit pas être visible des autres. L'espace de noms anonyme (ou
      `static`) lui donne une liaison interne. Les marquer `inline` ferait taire l'éditeur de liens, et une seule
      des deux servirait partout : pire que l'erreur.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande pourquoi on peut définir une classe dans un en-tête inclus par dix fichiers, mais
      pas une fonction ordinaire. Que réponds-tu ?
    choices:
      - {text: "La règle permet une définition de classe par unité de traduction ; une fonction ordinaire n'en a qu'une au total", correct: true}
      - {text: "Une classe ne produit jamais de code machine, alors qu'une fonction en produit toujours", correct: false}
      - {text: "Le préprocesseur retire les classes en double, mais laisse les fonctions en double", correct: false}
      - {text: "Une classe est toujours privée à son fichier, alors qu'une fonction est toujours publique", correct: false}
    answer: |-
      Le compilateur a besoin de la définition de la classe partout où elle sert : la règle l'autorise, si toutes
      les copies sont identiques. Pour une fonction, la déclaration suffit à l'appel ; sa définition est unique,
      sauf si elle est `inline`.
