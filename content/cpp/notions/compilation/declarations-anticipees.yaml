notion: declarations-anticipees
lesson: |-
  Une **déclaration anticipée** (*forward declaration*) annonce qu'une classe existe, sans la définir :

  ```cpp
  class Client;          // « Client est une classe ; sa définition viendra »
  ```

  `Client` est alors un **type incomplet** : le compilateur connaît son nom, mais ni sa taille, ni ses membres.

  **Ce qu'un type incomplet permet.**

  | Permis | Interdit |
  |---|---|
  | déclarer un **pointeur** ou une **référence** : `Client*`, `const Client&` | déclarer un **objet** ou un membre : `Client c;` |
  | déclarer une **fonction** qui le prend ou le renvoie, même par valeur | **appeler** une fonction membre : `c->nom()` |
  | l'utiliser comme argument de `std::unique_ptr`, `std::vector` (dans une déclaration) | `sizeof(Client)`, hériter de `Client` |

  La règle : il faut la définition complète dès que le compilateur a besoin de la **taille** ou des **membres**.

  **À quoi ça sert : inclure moins.**

  ```cpp
  // commande.hpp
  #pragma once

  class Client;                      // au lieu de #include "client.hpp"

  class Commande {
  public:
      explicit Commande(const Client& client);
  private:
      const Client* client_;         // un pointeur : la taille est connue
  };
  ```

  ```cpp
  // commande.cpp
  #include "commande.hpp"
  #include "client.hpp"              // la définition complète, là où l'on s'en sert
  ```

  - **Compiler moins.** Un en-tête inclus est recopié, avec tout ce qu'il inclut, dans chaque fichier. Et modifier
    `client.hpp` ne fait plus recompiler ceux qui n'incluent que `commande.hpp`.
  - **Casser un cycle.** Si `A` contient un pointeur vers `B` et `B` un pointeur vers `A`, deux inclusions croisées
    ne peuvent pas marcher. Une déclaration anticipée de chaque côté suffit.

  **Les pièges.**

  - **`delete` sur un type incomplet** : le destructeur n'est pas appelé, et c'est un comportement indéfini. Avec
    un membre `std::unique_ptr<T>` de type incomplet, le destructeur de la classe doit être **défini dans le
    `.cpp`**, là où `T` est complet (c'est l'idiome pimpl).
  - **`class` ou `struct`** : la déclaration anticipée doit reprendre le bon mot. Les mélanger compile, avec un
    avertissement.
  - On ne déclare pas soi-même les types de la **bibliothèque standard** (`class std::string;` est interdit) :
    on inclut l'en-tête, ou `<iosfwd>` pour les flux.
  - Un **alias** (`using Id = int;`) ou un type imbriqué ne se déclarent pas ainsi.
  - Une déclaration recopiée à la main peut **diverger** de la définition : certains projets fournissent un
    en-tête `xxx_fwd.hpp`.

  **Le bon réflexe.** Dans un en-tête : déclaration anticipée quand un pointeur ou une référence suffit ; inclusion
  quand il faut l'objet. Dans le `.cpp` : inclure ce dont on se sert.

  **En entretien** : « Une déclaration anticipée donne un type incomplet : assez pour un pointeur, une référence
  ou la signature d'une fonction, pas pour un membre par valeur ni un appel. Je m'en sers dans les en-têtes pour
  réduire les inclusions, donc les temps de compilation, et pour casser les dépendances circulaires. »
cards:
  - key: definition
    format: course
    question: "Que fait la ligne `class Client;` ?"
    choices:
      - {text: "Elle annonce que `Client` est une classe, sans donner sa définition", correct: true}
      - {text: "Elle définit une classe `Client` vide, sans membre", correct: false}
      - {text: "Elle inclut l'en-tête qui définit la classe `Client`", correct: false}
      - {text: "Elle crée un objet de type `Client`, nommé `class`", correct: false}
    answer: "C'est une déclaration anticipée. `Client` devient un type incomplet : son nom est connu, pas sa taille ni ses membres."
  - key: permis
    format: course
    question: "Que peut-on faire avec un type seulement déclaré, `class Client;` ?"
    choices:
      - {text: "Déclarer un pointeur ou une référence vers lui", correct: true}
      - {text: "Déclarer un membre de ce type, par valeur", correct: false}
      - {text: "Appeler l'une de ses fonctions membres", correct: false}
      - {text: "Calculer sa taille avec `sizeof`", correct: false}
    answer: "La taille d'un pointeur ne dépend pas de ce qu'il désigne. Tout ce qui demande la taille ou les membres exige la définition complète."
  - key: interet
    format: course
    question: "Pourquoi remplacer un `#include` par une déclaration anticipée dans un en-tête ?"
    choices:
      - {text: "Pour réduire ce que chaque fichier recompile, et casser les inclusions circulaires", correct: true}
      - {text: "Pour que le programme s'exécute plus vite", correct: false}
      - {text: "Pour que la classe déclarée occupe moins de mémoire", correct: false}
      - {text: "Pour rendre la classe déclarée invisible de l'éditeur de liens", correct: false}
    answer: "Un en-tête inclus entraîne tout ce qu'il inclut. Avec une déclaration, modifier la définition ne fait plus recompiler ceux qui ne voient que le pointeur."
  - key: regle
    format: course
    question: "À quel moment le compilateur a-t-il besoin de la définition complète d'une classe ?"
    choices:
      - {text: "Dès qu'il lui faut sa taille ou ses membres", correct: true}
      - {text: "Dès que son nom apparaît dans le fichier", correct: false}
      - {text: "Seulement à l'édition de liens", correct: false}
      - {text: "Seulement à l'exécution du programme", correct: false}
    answer: "Créer un objet, accéder à un membre, hériter, `sizeof` : il faut la définition. Un pointeur, une référence, la signature d'une fonction : le nom suffit."
  - key: vf-parametre-valeur
    format: true-false
    question: "On peut déclarer une fonction `void traiter(Client c);` avec `Client` seulement déclaré."
    truth: true
    answer: "La déclaration d'une fonction n'a pas besoin de la taille. C'est sa définition, et son appel, qui exigent le type complet."
  - key: vf-membre-valeur
    format: true-false
    question: "Une classe peut avoir un membre `Client client_;` avec `Client` seulement déclaré."
    truth: false
    answer: "La taille de la classe dépend de celle de `Client` : il faut sa définition. Un membre `Client*` ou `std::unique_ptr<Client>` convient."
  - key: vf-std
    format: true-false
    question: "On peut écrire `namespace std { class string; }` pour éviter d'inclure `<string>`."
    truth: false
    answer: "Ajouter des déclarations à `std` est interdit, et `std::string` n'est même pas une classe mais un alias de template. On inclut `<string>`."
  - key: vf-heritage
    format: true-false
    question: "Une classe peut hériter d'une classe seulement déclarée."
    truth: false
    answer: "L'héritage demande la définition complète de la base : sa taille et ses membres font partie de la classe dérivée."
  - key: qcm-cycle
    format: multiple-choice
    question: "`A` contient un `B*`, et `B` contient un `A*`. Comment écris-tu les deux en-têtes ?"
    choices:
      - {text: "Chacun déclare l'autre classe par anticipation, sans l'inclure", correct: true}
      - {text: "Chacun inclut l'en-tête de l'autre, sans garde d'inclusion", correct: false}
      - {text: "Chacun inclut l'en-tête de l'autre deux fois", correct: false}
      - {text: "Les deux classes sont définies dans le même fichier `.cpp`", correct: false}
    answer: "Deux inclusions croisées ne peuvent pas aboutir. Un pointeur ne demande qu'une déclaration : `class B;` dans `a.hpp`, `class A;` dans `b.hpp`."
  - key: qcm-ou-inclure
    format: multiple-choice
    question: "`commande.hpp` ne fait que déclarer `class Client;`. Où inclut-on `client.hpp` ?"
    choices:
      - {text: "Dans `commande.cpp`, qui se sert des membres de `Client`", correct: true}
      - {text: "Nulle part : la déclaration anticipée suffit partout", correct: false}
      - {text: "Dans `main.cpp` seulement, quel que soit son contenu", correct: false}
      - {text: "Dans `commande.hpp`, en plus de la déclaration", correct: false}
    answer: "La définition complète va là où l'on en a besoin : le fichier source qui appelle les fonctions de `Client`."
  - key: qcm-flux
    format: multiple-choice
    question: "Quel en-tête fournit les déclarations anticipées des flux, comme `std::ostream` ?"
    choices:
      - {text: "`<iosfwd>`", correct: true}
      - {text: "`<iostream>`", correct: false}
      - {text: "`<forward>`", correct: false}
      - {text: "`<utility>`", correct: false}
    answer: "`<iosfwd>` est fait pour cela : il suffit à déclarer un `operator<<` dans un en-tête, sans inclure tout `<iostream>`."
  - key: qcm-struct
    format: multiple-choice
    question: "Une classe est définie avec `struct Point { ... };`. Comment la déclares-tu par anticipation ?"
    choices:
      - {text: "`struct Point;`", correct: true}
      - {text: "`class Point;`", correct: false}
      - {text: "`typedef Point;`", correct: false}
      - {text: "`using Point;`", correct: false}
    answer: "On reprend le mot de la définition. `class Point;` compile, mais GCC avertit de l'incohérence, et un autre compilateur peut refuser l'édition de liens."
  - key: bug-membre-incomplet
    format: bug-fix
    question: |-
      Le compilateur répond « field 'client' has incomplete type 'Client' ». Quelle correction évite d'inclure la
      définition dans cet en-tête ?
      ```cpp
      class Client;

      class Commande {
      private:
          Client client;
      };

      int main() {
          return 0;
      }
      ```
    choices:
      - {text: "Déclarer le membre comme un pointeur : `const Client* client;`", correct: true}
      - {text: "Déclarer le membre comme constant : `const Client client;`", correct: false}
      - {text: "Déclarer le membre comme statique : `static Client client = {};`", correct: false}
      - {text: "Déclarer deux fois la classe : `class Client; class Client;`", correct: false}
    answer: |-
      ```cpp
      const Client* client;
      ```
      Un membre par valeur demande la taille de `Client`. Un pointeur, ou une référence, n'en a pas besoin. Si la
      commande doit posséder le client, il faut inclure sa définition.
  - key: bug-appel-incomplet
    format: bug-fix
    question: |-
      Le compilateur répond « invalid use of incomplete type 'const class Client' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      class Client;

      void afficher(const Client& client) {
          std::println("{}", client.age());
      }

      class Client {
      public:
          int age() const { return 30; }
      };

      int main() {
          afficher(Client{});
      }
      ```
    choices:
      - {text: "Placer la définition de `Client` avant celle de `afficher`", correct: true}
      - {text: "Déclarer `class Client;` une seconde fois avant `afficher`", correct: false}
      - {text: "Recevoir `const Client* client` dans `afficher`", correct: false}
      - {text: "Écrire `client->age()` dans `afficher`", correct: false}
    answer: |-
      ```cpp
      class Client {
      public:
          int age() const { return 30; }
      };

      void afficher(const Client& client) {
          std::println("{}", client.age());
      }
      ```
      Appeler une fonction membre exige de connaître la classe. Dans un projet, c'est le `.cpp` qui inclut
      `client.hpp` avant de s'en servir.
  - key: bug-unique-ptr-incomplet
    format: bug-fix
    question: |-
      Ce fichier ne compile pas : « invalid application of 'sizeof' to incomplete type 'Moteur' », dans le
      destructeur généré de `Voiture`. Quelle correction est la bonne ?
      ```cpp
      #include <memory>

      class Moteur;

      class Voiture {
      private:
          std::unique_ptr<Moteur> moteur_;
      };

      int main() {
          Voiture voiture;
      }
      ```
    choices:
      - {text: "Déclarer `~Voiture();` dans la classe, et le définir là où `Moteur` est complet", correct: true}
      - {text: "Déclarer `~Voiture() = default;` dans la classe, à cet endroit", correct: false}
      - {text: "Remplacer le membre par `std::unique_ptr<class Moteur>`", correct: false}
      - {text: "Déclarer le membre `moteur_` avec le mot-clé `mutable`", correct: false}
    answer: |-
      ```cpp
      class Voiture {
      public:
          Voiture();
          ~Voiture();                 // défini dans voiture.cpp, après #include "moteur.hpp"
      private:
          std::unique_ptr<Moteur> moteur_;
      };
      ```
      Le destructeur de `std::unique_ptr` détruit un `Moteur` : il lui faut le type complet. Généré dans l'en-tête,
      il ne l'a pas. Défini dans le fichier source, il l'a.
  - key: bug-cycle
    format: bug-fix
    question: |-
      Ces deux en-têtes s'incluent l'un l'autre. La compilation échoue : dans `b.hpp`, « 'A' does not name a
      type ». Quelle correction est la bonne ?
      ```cpp
      // a.hpp
      #pragma once
      #include "b.hpp"

      class A {
          B* b_;
      };

      // b.hpp
      #pragma once
      #include "a.hpp"

      class B {
          A* a_;
      };
      ```
    choices:
      - {text: "Remplacer chaque `#include` par une déclaration anticipée", correct: true}
      - {text: "Retirer les deux lignes `#pragma once`", correct: false}
      - {text: "Inclure `a.hpp` deux fois dans `b.hpp`", correct: false}
      - {text: "Fusionner les deux classes en une seule", correct: false}
    answer: |-
      ```cpp
      // a.hpp
      #pragma once
      class B;

      class A {
          B* b_;
      };
      ```
      Quand `a.hpp` inclut `b.hpp`, celui-ci tente d'inclure `a.hpp`, que la garde ignore : `A` n'est pas encore
      déclarée. Un pointeur n'exige qu'une déclaration.
  - key: situation-compilation-lente
    format: scenario
    question: |-
      Modifier `moteur.hpp` fait recompiler quatre cents fichiers. La plupart n'incluent que `voiture.hpp`, qui
      inclut `moteur.hpp` pour un seul membre `Moteur* moteur_`. Que proposes-tu ?
    choices:
      - {text: "Remplacer l'inclusion par `class Moteur;` dans `voiture.hpp`, et inclure `moteur.hpp` dans `voiture.cpp`", correct: true}
      - {text: "Ajouter `#pragma once` dans `moteur.hpp`, pour qu'il ne soit plus recompilé", correct: false}
      - {text: "Recopier la définition de `Moteur` dans `voiture.hpp`", correct: false}
      - {text: "Compiler les quatre cents fichiers sans optimisation", correct: false}
    answer: |-
      Un pointeur ne demande qu'une déclaration. Les fichiers qui incluent `voiture.hpp` ne dépendent plus de
      `moteur.hpp` : seul `voiture.cpp`, qui s'en sert vraiment, est recompilé.
  - key: situation-fuite-silencieuse
    format: scenario
    question: |-
      Une fonction fait `delete moteur;` sur un `Moteur*`, dans un fichier où `Moteur` n'est que déclaré. Le
      programme compile, avec un avertissement, et une ressource du moteur n'est jamais libérée. Pourquoi ?
    choices:
      - {text: "Supprimer un type incomplet n'appelle pas son destructeur : c'est un comportement indéfini", correct: true}
      - {text: "Une déclaration anticipée rend le destructeur privé", correct: false}
      - {text: "Le pointeur est copié avant d'être supprimé", correct: false}
      - {text: "Le destructeur est appelé deux fois, ce qui annule son effet", correct: false}
    answer: |-
      Le compilateur ne sait pas que `Moteur` a un destructeur. On inclut la définition avant le `delete`.
      `std::unique_ptr` transforme cette faute en erreur de compilation, ce qui est une raison de plus de
      l'utiliser.
  - key: situation-exces
    format: scenario
    question: |-
      Un collègue remplace toutes les inclusions de ses en-têtes par des déclarations anticipées, y compris
      `class std::vector;`, et recopie à la main des signatures de templates. Que lui dis-tu ?
    choices:
      - {text: "De ne déclarer ainsi que ses propres classes, et d'inclure la bibliothèque standard", correct: true}
      - {text: "De continuer : toute inclusion peut être remplacée par une déclaration", correct: false}
      - {text: "De déclarer aussi les fonctions de `<algorithm>` à la main", correct: false}
      - {text: "De placer ces déclarations dans l'espace de noms `std`", correct: false}
    answer: |-
      Déclarer soi-même un type de `std` est interdit, et une déclaration recopiée finit par diverger. La technique
      vaut pour les classes du projet, quand un pointeur ou une référence suffit.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, un en-tête inclut `client.hpp`, alors qu'il ne fait que déclarer
      `void envoyer(const Client& client);`. Que proposes-tu ?
    choices:
      - {text: "Une déclaration anticipée `class Client;` : la signature n'a pas besoin de la définition", correct: true}
      - {text: "De garder l'inclusion : une référence exige le type complet", correct: false}
      - {text: "De passer le client par valeur, pour éviter l'inclusion", correct: false}
      - {text: "De déplacer la déclaration de `envoyer` dans `client.hpp`", correct: false}
    answer: |-
      Déclarer une fonction qui prend une référence ne demande que le nom du type. L'appelant, lui, inclura
      `client.hpp`, puisqu'il doit construire un client.
