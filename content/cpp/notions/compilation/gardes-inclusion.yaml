notion: gardes-inclusion
lesson: |-
  `#include` recopie un fichier. Si le même en-tête arrive **deux fois** dans un fichier source, tout ce qu'il
  contient est déclaré deux fois, et une classe **définie** deux fois est une erreur : `redefinition of 'struct
  Point'`.

  Cela arrive sans qu'on l'écrive :

  ```
  main.cpp ── inclut ──▶ cercle.hpp ── inclut ──▶ point.hpp
      └────── inclut ──▶ carre.hpp  ── inclut ──▶ point.hpp      (une seconde fois)
  ```

  **`#pragma once`.** Placé en haut de l'en-tête, il dit au préprocesseur de ne recopier ce fichier **qu'une fois
  par unité de traduction**.

  ```cpp
  // point.hpp
  #pragma once

  struct Point {
      int x;
      int y;
  };
  ```

  **La garde d'inclusion.** La forme historique, strictement standard, fait la même chose avec trois directives :

  ```cpp
  // point.hpp
  #ifndef POINT_HPP
  #define POINT_HPP

  struct Point {
      int x;
      int y;
  };

  #endif
  ```

  À la première inclusion, `POINT_HPP` n'existe pas : le préprocesseur le définit, et garde le contenu. À la
  seconde, `#ifndef` (« si non défini ») est faux : tout est sauté jusqu'au `#endif`.

  **Lequel choisir.**

  | | `#pragma once` | Garde `#ifndef` |
  |---|---|---|
  | Longueur | une ligne | trois lignes |
  | Standard | non, mais accepté par tous les compilateurs courants | oui |
  | Risque | un même fichier vu sous deux chemins (copies, liens) | deux en-têtes avec le **même nom** de macro |

  L'un ou l'autre convient ; on suit la convention du projet. Avec une garde, le nom de la macro doit être
  **unique** : s'il est copié d'un autre en-tête, le second fichier inclus est entièrement ignoré, sans message.

  **Ce que la garde ne fait pas.** Elle agit **à l'intérieur d'un fichier source**. Elle n'empêche pas l'en-tête
  d'être recopié dans **chaque** `.cpp` qui l'inclut. Une fonction **définie** dans un en-tête existe donc dans
  plusieurs fichiers objets : l'éditeur de liens répond `multiple definition`, garde ou pas. Le remède est de
  déplacer la définition dans un `.cpp`, ou de la marquer `inline`.

  **L'inclusion circulaire.** Si `a.hpp` inclut `b.hpp`, qui inclut `a.hpp`, la garde arrête la boucle, mais l'un
  des deux se retrouve à utiliser un type pas encore déclaré. On la casse par une **déclaration anticipée** :
  `class A;` suffit pour déclarer un pointeur ou une référence vers `A`.

  **En entretien** : « Une garde d'inclusion, ou `#pragma once`, empêche qu'un en-tête soit recopié deux fois dans
  la même unité de traduction, donc les redéfinitions. Elle ne protège pas d'une définition de fonction dans un
  en-tête : là, c'est l'éditeur de liens qui se plaint. »
tour:
  - title: N'inclure qu'une fois
    text: |-
      Un en-tête peut arriver deux fois dans le même fichier : ici, `main.cpp` inclut `cercle.hpp` et `carre.hpp`,
      qui incluent tous deux `point.hpp`. Sans protection, `Point` serait défini deux fois, ce que le compilateur
      refuse.

      La ligne `#pragma once`, en haut de l'en-tête, demande de ne le recopier qu'une fois.

      Essaie : supprime `#pragma once` dans `point.hpp`, puis exécute. Le compilateur répond « redefinition of
      'struct Point' ».
    example:
      files:
        main.cpp: |-
          #include "carre.hpp"
          #include "cercle.hpp"

          #include <print>

          int main() {
              const Cercle cercle{Point{1, 2}, 5};
              const Carre carre{Point{3, 4}, 2};
              std::println("{} {}", cercle.centre.x, carre.coin.y);
          }
        point.hpp: |-
          #pragma once

          struct Point {
              int x;
              int y;
          };
        cercle.hpp: |-
          #pragma once

          #include "point.hpp"

          struct Cercle {
              Point centre;
              int rayon;
          };
        carre.hpp: |-
          #pragma once

          #include "point.hpp"

          struct Carre {
              Point coin;
              int cote;
          };
      output: "1 4"
cards:
  - key: probleme
    format: course
    question: "Que se passe-t-il quand un en-tête sans protection est inclus deux fois dans le même fichier source ?"
    choices:
      - {text: "Les classes qu'il définit le sont deux fois : le compilateur signale une redéfinition", correct: true}
      - {text: "Le préprocesseur ignore la seconde inclusion, sans rien signaler", correct: false}
      - {text: "L'éditeur de liens fusionne les deux copies en une seule", correct: false}
      - {text: "Le programme compile, mais s'exécute deux fois plus lentement", correct: false}
    answer: "`#include` recopie le texte à chaque fois. Une classe, une `struct` ou une énumération ne peut être définie qu'une fois par unité de traduction."
  - key: pragma-once
    format: course
    question: "Que fait `#pragma once`, placé en haut d'un en-tête ?"
    choices:
      - {text: "Il fait recopier cet en-tête une seule fois par fichier source compilé", correct: true}
      - {text: "Il fait compiler cet en-tête une seule fois pour tout le programme", correct: false}
      - {text: "Il empêche cet en-tête d'être inclus par plus d'un fichier source", correct: false}
      - {text: "Il fait exécuter une seule fois les fonctions de cet en-tête", correct: false}
    answer: "La protection vaut pour une unité de traduction. Chaque fichier source qui inclut l'en-tête en reçoit toujours sa copie."
  - key: garde-ifndef
    format: course
    question: "Comment une garde `#ifndef POINT_HPP` / `#define POINT_HPP` / `#endif` évite-t-elle la double inclusion ?"
    choices:
      - {text: "À la seconde inclusion, la macro existe déjà : le contenu est sauté jusqu'au `#endif`", correct: true}
      - {text: "À la seconde inclusion, la macro est effacée : le contenu est recopié à neuf", correct: false}
      - {text: "À la première inclusion, la macro n'existe pas : le contenu est sauté jusqu'au `#endif`", correct: false}
      - {text: "À chaque inclusion, la macro renomme les classes, pour éviter les doublons", correct: false}
    answer: "`#ifndef` veut dire « si non défini ». La première fois, la macro est définie et le contenu gardé ; ensuite, le test est faux."
  - key: limite
    format: course
    question: "De quoi une garde d'inclusion ne protège-t-elle pas ?"
    choices:
      - {text: "D'une fonction définie dans l'en-tête, recopiée dans plusieurs fichiers source", correct: true}
      - {text: "D'une classe définie dans l'en-tête, inclus deux fois par le même fichier", correct: false}
      - {text: "D'un en-tête inclus à la fois directement et par un autre en-tête", correct: false}
      - {text: "D'une énumération définie dans l'en-tête, inclus deux fois de suite", correct: false}
    answer: "La garde agit dans un fichier source. Chaque `.cpp` reçoit quand même sa copie de l'en-tête : une fonction qui y est définie existe plusieurs fois à l'édition de liens."
  - key: vf-standard
    format: true-false
    question: "`#pragma once` fait partie du standard C++."
    truth: false
    answer: "C'est une extension, acceptée par tous les compilateurs courants. La garde `#ifndef` est la forme standard."
  - key: vf-meme-nom
    format: true-false
    question: "Deux en-têtes différents peuvent utiliser le même nom de macro pour leur garde, sans conséquence."
    truth: false
    answer: "Le second inclus serait entièrement sauté, sans message : ses déclarations manqueraient."
  - key: vf-multiple-definition
    format: true-false
    question: "Une garde d'inclusion empêche l'erreur « multiple definition » de l'éditeur de liens."
    truth: false
    answer: "Elle empêche les redéfinitions à la compilation. Une définition présente dans deux fichiers objets reste un problème d'édition de liens."
  - key: vf-declaration-anticipee
    format: true-false
    question: "La déclaration anticipée `class A;` suffit pour déclarer un pointeur vers `A`."
    truth: true
    answer: "Un pointeur ou une référence n'exigent pas de connaître la taille de `A`. C'est ainsi qu'on casse une inclusion circulaire."
  - key: qcm-directive
    format: multiple-choice
    question: "Quelle directive signifie « si cette macro n'est pas définie » ?"
    choices:
      - {text: "`#ifndef`", correct: true}
      - {text: "`#ifdef`", correct: false}
      - {text: "`#undef`", correct: false}
      - {text: "`#else`", correct: false}
    answer: "`#ifndef` : *if not defined*. `#ifdef` teste l'inverse, `#undef` supprime une macro."
  - key: qcm-fin-de-garde
    format: multiple-choice
    question: "Quelle directive termine une garde d'inclusion, à la fin de l'en-tête ?"
    choices:
      - {text: "`#endif`", correct: true}
      - {text: "`#end`", correct: false}
      - {text: "`#fi`", correct: false}
      - {text: "`#define`", correct: false}
    answer: "`#endif` ferme le bloc ouvert par `#ifndef`. S'il manque, le préprocesseur signale une directive non terminée."
  - key: qcm-circulaire
    format: multiple-choice
    question: "`a.hpp` inclut `b.hpp`, qui inclut `a.hpp`. `B` ne contient qu'un pointeur vers `A`. Comment casses-tu la boucle ?"
    choices:
      - {text: "Écrire `class A;` dans `b.hpp`, à la place de l'inclusion", correct: true}
      - {text: "Retirer les gardes d'inclusion des deux en-têtes", correct: false}
      - {text: "Inclure chaque en-tête deux fois de suite", correct: false}
      - {text: "Renommer `b.hpp` en `b.cpp`", correct: false}
    answer: "Une déclaration anticipée suffit pour un pointeur. `b.cpp`, lui, inclura `a.hpp` pour se servir de l'objet."
  - key: qcm-ou-placer
    format: multiple-choice
    question: "Où place-t-on `#pragma once` ?"
    choices:
      - {text: "Tout en haut de chaque en-tête", correct: true}
      - {text: "Tout en haut de chaque fichier `.cpp`", correct: false}
      - {text: "Juste avant chaque ligne `#include`", correct: false}
      - {text: "Une seule fois, dans le fichier qui contient `main`", correct: false}
    answer: "C'est l'en-tête qui se protège lui-même. Un fichier source n'est jamais inclus : il n'en a pas besoin."
  - key: trous-pragma
    format: fill-in
    question: |-
      Complète pour que cet en-tête ne soit recopié qu'une fois :
      ```cpp
      #pragma ___

      struct Point {
          int x;
          int y;
      };
      ```
    blanks:
      - [once]
    answer: "`#pragma once` protège l'en-tête d'une double inclusion."
  - key: trous-ifndef
    format: fill-in
    question: |-
      Complète la première ligne de la garde :
      ```cpp
      #___ POINT_HPP
      #define POINT_HPP

      struct Point {};

      #endif
      ```
    blanks:
      - [ifndef]
    answer: "`#ifndef` : le contenu n'est gardé que si la macro n'est pas encore définie."
  - key: trous-define
    format: fill-in
    question: |-
      Complète la deuxième ligne de la garde :
      ```cpp
      #ifndef POINT_HPP
      #___ POINT_HPP

      struct Point {};

      #endif
      ```
    blanks:
      - [define]
    answer: "`#define` crée la macro : à la prochaine inclusion, le `#ifndef` sera faux."
  - key: trous-endif
    format: fill-in
    question: |-
      Complète la dernière ligne de la garde :
      ```cpp
      #ifndef POINT_HPP
      #define POINT_HPP

      struct Point {};

      #___
      ```
    blanks:
      - [endif]
    answer: "`#endif` ferme le bloc ouvert par `#ifndef`."
  - key: code-garde
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #ifndef CONFIG
      #define CONFIG
      const int niveau = 1;
      #endif

      #ifndef CONFIG
      #define CONFIG
      const int niveau = 2;
      #endif

      int main() {
          std::println("{}", niveau);
      }
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1` : au second `#ifndef`, `CONFIG` est déjà définie. Le préprocesseur saute le bloc : la seconde définition de `niveau` n'atteint pas le compilateur."
    check:
      output: "1"
  - key: code-sans-garde
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
      };

      struct Point {
          int x;
      };

      int main() {
          std::println("{}", Point{3}.x);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`6`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : « redefinition of 'struct Point' ». C'est exactement ce que produit un en-tête sans garde inclus deux fois."
    check:
      compiles: false
  - key: code-ifdef-else
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #define MODE_TEST

      #ifdef MODE_TEST
      const char* mode = "test";
      #else
      const char* mode = "production";
      #endif

      #ifndef MODE_TEST
      const int essais = 1;
      #else
      const int essais = 3;
      #endif

      int main() {
          std::println("{} {}", mode, essais);
      }
      ```
    choices:
      - {text: "`test 3`", correct: true}
      - {text: "`test 1`", correct: false}
      - {text: "`production 1`", correct: false}
      - {text: "`production 3`", correct: false}
    answer: "`test 3` : `MODE_TEST` est définie. `#ifdef` garde sa première branche ; `#ifndef` est faux, et garde celle du `#else`."
    check:
      output: "test 3"
  - key: code-declarations-repetees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int carre(int n);
      int carre(int n);
      int carre(int n);

      int main() {
          std::println("{}", carre(5));
      }

      int carre(int n) {
          return n * n;
      }
      ```
    choices:
      - {text: "`25`", correct: true}
      - {text: "`75`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`25` : une fonction peut être déclarée autant de fois qu'on veut. Seule une définition répétée est une erreur : c'est pourquoi un en-tête fait de prototypes supporte la double inclusion."
    check:
      output: "25"
  - key: bug-sans-garde
    format: bug-fix
    question: |-
      `main.cpp` inclut `cercle.hpp` et `carre.hpp`, qui incluent chacun `point.hpp`. Le compilateur répond
      « redefinition of 'struct Point' ». Quelle correction est la bonne ?
      ```cpp
      // point.hpp
      struct Point {
          int x;
          int y;
      };
      ```
    choices:
      - {text: "Ajouter `#pragma once` en haut de `point.hpp`", correct: true}
      - {text: "Ajouter `#pragma once` en haut de `main.cpp`", correct: false}
      - {text: "Renommer la struct en `Point2` dans `carre.hpp`", correct: false}
      - {text: "Déclarer la struct `static` dans `point.hpp`", correct: false}
    answer: |-
      ```cpp
      // point.hpp
      #pragma once

      struct Point {
          int x;
          int y;
      };
      ```
      `point.hpp` arrive deux fois dans `main.cpp`, par deux chemins. C'est à l'en-tête de se protéger.
  - key: bug-meme-macro
    format: bug-fix
    question: |-
      `main.cpp` inclut `point.hpp`, puis `segment.hpp`. Le compilateur répond « 'Segment' was not declared ».
      Quelle correction est la bonne ?
      ```cpp
      // point.hpp
      #ifndef GEOMETRIE_HPP
      #define GEOMETRIE_HPP
      struct Point { int x; int y; };
      #endif

      // segment.hpp
      #ifndef GEOMETRIE_HPP
      #define GEOMETRIE_HPP
      struct Segment { int debut; int fin; };
      #endif
      ```
    choices:
      - {text: "Donner à chaque en-tête sa propre macro : `POINT_HPP` et `SEGMENT_HPP`", correct: true}
      - {text: "Inclure `segment.hpp` avant `point.hpp` dans le fichier `main.cpp`", correct: false}
      - {text: "Retirer la ligne `#endif` à la fin de l'en-tête `segment.hpp`", correct: false}
      - {text: "Remplacer `#ifndef` par `#ifdef` dans les deux en-têtes", correct: false}
    answer: |-
      ```cpp
      // segment.hpp
      #ifndef SEGMENT_HPP
      #define SEGMENT_HPP
      struct Segment { int debut; int fin; };
      #endif
      ```
      Quand `segment.hpp` est lu, `GEOMETRIE_HPP` est déjà définie par `point.hpp` : tout son contenu est sauté,
      sans message. Inverser les inclusions ferait disparaître `Point` à la place. `#pragma once` évite ce piège.
  - key: bug-endif-manquant
    format: bug-fix
    question: |-
      Le préprocesseur répond « unterminated #ifndef ». Quelle correction est la bonne ?
      ```cpp
      #ifndef POINT_HPP
      #define POINT_HPP

      struct Point {
          int x;
          int y;
      };

      int main() {
          return Point{0, 0}.x;
      }
      ```
    choices:
      - {text: "Ajouter `#endif` après la définition de `Point`", correct: true}
      - {text: "Ajouter `#end` après la définition de `Point`", correct: false}
      - {text: "Ajouter `#undef POINT_HPP` avant la définition de `Point`", correct: false}
      - {text: "Ajouter un point-virgule après `#define POINT_HPP`", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
      };

      #endif
      ```
      Tout `#ifndef` se ferme par un `#endif`. C'est une des fautes que `#pragma once`, en une seule ligne, rend
      impossibles.
  - key: bug-define-oublie
    format: bug-fix
    question: |-
      Cet en-tête a une garde, mais le compilateur répond quand même « redefinition of 'struct Point' » quand il
      est inclus deux fois. Quelle correction est la bonne ?
      ```cpp
      // point.hpp
      #ifndef POINT_HPP

      struct Point {
          int x;
          int y;
      };

      #endif
      ```
    choices:
      - {text: "Ajouter `#define POINT_HPP` juste après le `#ifndef`", correct: true}
      - {text: "Ajouter `#undef POINT_HPP` juste après le `#ifndef`", correct: false}
      - {text: "Ajouter un second `#endif` à la fin de l'en-tête", correct: false}
      - {text: "Remplacer `#ifndef POINT_HPP` par `#ifdef POINT_HPP`", correct: false}
    answer: |-
      ```cpp
      #ifndef POINT_HPP
      #define POINT_HPP
      ```
      Sans `#define`, la macro n'existe jamais : le test `#ifndef` est vrai à chaque inclusion, et le contenu est
      recopié chaque fois.
