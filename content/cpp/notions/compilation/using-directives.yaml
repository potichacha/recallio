notion: using-directives
lesson: |-
  Écrire `std::` devant chaque nom finit par peser. `using` permet d'en dispenser, de deux façons très différentes.

  **La déclaration `using` : un seul nom.**

  ```cpp
  using std::string;

  string nom = "Ada";         // std::string
  std::vector<int> v;         // les autres noms gardent leur préfixe
  ```

  Elle introduit **un** nom, choisi, dans la portée courante. Elle se comporte comme une déclaration : si un nom
  identique existe déjà dans cette portée, le conflit est signalé **tout de suite**.

  **La directive `using namespace` : tous les noms.**

  ```cpp
  using namespace std;

  string nom = "Ada";
  vector<int> v;
  ```

  Elle rend visibles **tous** les noms de l'espace de noms, présents et **à venir**. C'est là le danger : `std`
  en contient des milliers (`count`, `size`, `distance`, `min`, `data`, `swap`, `byte`...), et chaque nouvelle
  version du standard en ajoute. Un programme qui compile aujourd'hui peut devenir **ambigu** après une mise à
  jour, ou pire, appeler **une autre fonction** que celle qu'on croit, sans erreur.

  **La portée de `using`.** Les deux formes valent du point où elles sont écrites jusqu'à la **fin de la portée** :
  le bloc, la fonction, l'espace de noms, ou le fichier.

  | Où | Effet | Avis |
  |---|---|---|
  | Dans une fonction | limité à cette fonction | acceptable |
  | En haut d'un `.cpp` | tout le fichier, après les `#include` | toléré pour une déclaration, déconseillé pour une directive |
  | Dans un **en-tête** | **tous les fichiers** qui l'incluent, et tout ce qu'ils incluent ensuite | **jamais** |

  **Pourquoi jamais dans un en-tête.** `#include` recopie le texte : le `using namespace std;` de ton en-tête
  s'applique à chaque fichier qui l'inclut, sans qu'il l'ait demandé, et **il ne peut pas l'annuler**. Il change
  le sens du code d'autrui. Dans un en-tête, on écrit `std::` en toutes lettres.

  **Les bons usages.**

  - Une **déclaration** `using`, dans une fonction, pour un nom très répété.
  - Un **alias d'espace de noms** : `namespace fs = std::filesystem;`.
  - Les **littéraux** : `using namespace std::chrono_literals;` rend disponibles `10ms` ou `2s`, dans la fonction
    qui s'en sert.
  - L'idiome du **`swap`** : `using std::swap; swap(a, b);` laisse la recherche choisir la version propre au type
    s'il en a une, celle de `std` sinon.

  **À ne pas confondre.** `using Entier = int;` est un **alias de type**, et `using Base::fonction;` dans une
  classe réimporte un membre de la classe de base. Même mot-clé, autres rôles.

  **En entretien** : « La déclaration `using std::string;` importe un nom ; la directive `using namespace std;`
  les importe tous, ce qui crée des ambiguïtés et des changements de sens silencieux. Jamais dans un en-tête : elle
  s'imposerait à tous ceux qui l'incluent. Je la limite à une fonction, ou je m'en passe. »
cards:
  - key: declaration-ou-directive
    format: course
    question: "Quelle différence entre `using std::string;` et `using namespace std;` ?"
    choices:
      - {text: "La première rend visible un seul nom ; la seconde, tous les noms de `std`", correct: true}
      - {text: "La première rend visibles tous les noms de `std` ; la seconde, un seul nom", correct: false}
      - {text: "La première vaut pour tout le programme ; la seconde, pour une seule ligne", correct: false}
      - {text: "Aucune : ce sont deux écritures de la même instruction", correct: false}
    answer: "La déclaration `using` choisit un nom. La directive ouvre tout l'espace de noms, y compris les noms qu'une future version y ajoutera."
  - key: danger
    format: course
    question: "Quel est le risque le plus grave d'un `using namespace std;` ?"
    choices:
      - {text: "Un nom de `std` peut entrer en conflit avec le tien, ou être appelé à sa place sans erreur", correct: true}
      - {text: "Le programme inclut alors toute la bibliothèque standard, et grossit beaucoup", correct: false}
      - {text: "Le programme s'exécute plus lentement, car chaque nom est cherché à l'exécution", correct: false}
      - {text: "Le compilateur refuse ensuite toute écriture explicite du préfixe `std::`", correct: false}
    answer: "`std` contient des milliers de noms courants : `count`, `distance`, `size`, `min`. L'ambiguïté se voit ; le changement silencieux de fonction appelée, non."
  - key: en-tete
    format: course
    question: "Pourquoi n'écrit-on jamais `using namespace std;` dans un en-tête ?"
    choices:
      - {text: "Il s'applique à tous les fichiers qui incluent l'en-tête, qui ne peuvent pas l'annuler", correct: true}
      - {text: "Il empêche l'en-tête d'être inclus par plus d'un fichier source", correct: false}
      - {text: "Il est ignoré par le préprocesseur quand il se trouve dans un en-tête", correct: false}
      - {text: "Il fait compiler la bibliothèque standard une seconde fois", correct: false}
    answer: "`#include` recopie le texte : la directive agit sur tout le code qui suit, dans chaque fichier. Elle change le sens du code de quelqu'un d'autre."
  - key: portee
    format: course
    question: "Jusqu'où vaut une directive `using namespace` écrite au début d'une fonction ?"
    choices:
      - {text: "Jusqu'à la fin de cette fonction", correct: true}
      - {text: "Jusqu'à la fin du fichier source", correct: false}
      - {text: "Jusqu'à la fin du programme", correct: false}
      - {text: "Jusqu'à la ligne suivante seulement", correct: false}
    answer: "`using` suit les règles de portée. Dans une fonction, son effet reste local : c'est l'endroit où une directive est acceptable."
  - key: vf-annuler
    format: true-false
    question: "Un fichier peut annuler un `using namespace std;` reçu d'un en-tête qu'il inclut."
    truth: false
    answer: "Il n'existe pas de directive inverse. C'est pourquoi on n'en écrit jamais dans un en-tête."
  - key: vf-futurs-noms
    format: true-false
    question: "Une directive `using namespace std;` rend aussi visibles les noms qu'une future version du standard ajoutera à `std`."
    truth: true
    answer: "Un code qui compile aujourd'hui peut devenir ambigu en changeant de version du langage ou de la bibliothèque."
  - key: vf-declaration-conflit
    format: true-false
    question: "Une déclaration `using std::swap;` n'importe que le nom `swap`."
    truth: true
    answer: "Les autres noms de `std` gardent leur préfixe."
  - key: vf-alias-de-type
    format: true-false
    question: "`using Entier = int;` importe un nom depuis un espace de noms."
    truth: false
    answer: "C'est un alias de type : un nouveau nom pour `int`. Le mot-clé est le même, le rôle est différent."
  - key: qcm-fonction
    format: multiple-choice
    question: "Où une directive `using namespace` est-elle acceptable ?"
    choices:
      - {text: "Au début d'une fonction d'un fichier `.cpp`", correct: true}
      - {text: "En haut d'un en-tête public", correct: false}
      - {text: "Dans la définition d'une classe d'un en-tête", correct: false}
      - {text: "Avant les `#include` d'un fichier `.cpp`", correct: false}
    answer: "Son effet s'arrête à la fin de la fonction. Avant les `#include`, elle s'appliquerait aussi aux en-têtes inclus ensuite."
  - key: qcm-litteraux
    format: multiple-choice
    question: "Quelle directive rend disponible l'écriture `250ms` ?"
    choices:
      - {text: "`using namespace std::chrono_literals;`", correct: true}
      - {text: "`using namespace std::milliseconds;`", correct: false}
      - {text: "`using std::ms;`", correct: false}
      - {text: "`using namespace std::time;`", correct: false}
    answer: "Les suffixes de littéraux vivent dans des espaces de noms dédiés, faits pour être ouverts par une directive, dans la fonction qui s'en sert."
  - key: qcm-en-tete-ecriture
    format: multiple-choice
    question: "Dans un en-tête, comment écris-tu un paramètre de type chaîne ?"
    choices:
      - {text: "`const std::string& nom`, avec le préfixe", correct: true}
      - {text: "`const string& nom`, après un `using namespace std;`", correct: false}
      - {text: "`const string& nom`, après un `using std::string;` global", correct: false}
      - {text: "`const String& nom`, après un `#define String std::string`", correct: false}
    answer: "Dans un en-tête, tout nom est écrit en entier. Une déclaration `using` globale s'imposerait elle aussi à ceux qui l'incluent."
  - key: qcm-swap
    format: multiple-choice
    question: "Que permet l'idiome `using std::swap; swap(a, b);` ?"
    choices:
      - {text: "D'appeler la version de `swap` propre au type de `a`, ou celle de `std` à défaut", correct: true}
      - {text: "D'appeler toujours `std::swap`, même si le type fournit la sienne", correct: false}
      - {text: "D'échanger deux variables de types différents", correct: false}
      - {text: "D'échanger deux variables sans inclure d'en-tête", correct: false}
    answer: "Sans préfixe, la recherche regarde aussi l'espace de noms du type des arguments. La déclaration `using` garde `std::swap` comme solution de repli."
  - key: bug-ambiguite
    format: bug-fix
    question: |-
      Le compilateur répond « reference to 'count' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <print>

      using namespace std;

      int count = 0;

      int main() {
          ++count;
          println("{}", count);
      }
      ```
    choices:
      - {text: "Retirer `using namespace std;`, et écrire `std::println`", correct: true}
      - {text: "Placer `using namespace std;` après la déclaration de `count`", correct: false}
      - {text: "Déclarer la variable avec `static int count = 0;`", correct: false}
      - {text: "Inclure `<numeric>` à la place de `<algorithm>`", correct: false}
    answer: |-
      ```cpp
      int count = 0;

      int main() {
          ++count;
          std::println("{}", count);
      }
      ```
      La directive rend visible `std::count`, l'algorithme : `count` désigne alors deux choses. Sans elle, le
      nom n'a qu'un sens. Déplacer la directive ne change rien : au moment de l'usage, les deux sont visibles.
  - key: bug-dans-en-tete
    format: bug-fix
    question: |-
      Depuis que `journal.hpp` est inclus, d'autres fichiers du projet ne compilent plus : leurs propres fonctions
      `distance` ou `size` deviennent ambiguës. Quelle correction est la bonne ?
      ```cpp
      // journal.hpp
      #pragma once

      #include <string>

      using namespace std;

      void journaliser(const string& message);
      ```
    choices:
      - {text: "Retirer la directive, et écrire `const std::string& message`", correct: true}
      - {text: "Déplacer la directive au-dessus de `#include <string>`", correct: false}
      - {text: "Remplacer `#pragma once` par une garde `#ifndef`", correct: false}
      - {text: "Écrire la directive deux fois, pour qu'elle s'annule", correct: false}
    answer: |-
      ```cpp
      // journal.hpp
      #pragma once

      #include <string>

      void journaliser(const std::string& message);
      ```
      La directive est recopiée dans chaque fichier qui inclut l'en-tête, et y ouvre tout `std`. Un en-tête écrit
      ses noms en entier.
  - key: bug-litteral-sans-using
    format: bug-fix
    question: |-
      Le compilateur répond « unable to find numeric literal operator 'operator""ms' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          const auto pause = 250ms;
          std::println("{}", pause.count());
      }
      ```
    choices:
      - {text: "Écrire `using namespace std::chrono_literals;` au début de `main`", correct: true}
      - {text: "Écrire `#include <literals>` en haut du fichier", correct: false}
      - {text: "Écrire `const auto pause = std::250ms;` dans `main`", correct: false}
      - {text: "Écrire `const auto pause = 250.ms;` dans `main`", correct: false}
    answer: |-
      ```cpp
      int main() {
          using namespace std::chrono_literals;
          const auto pause = 250ms;
          std::println("{}", pause.count());
      }
      ```
      Les suffixes comme `ms` vivent dans un espace de noms fait pour être ouvert par une directive. Placée dans la
      fonction, elle n'a pas d'effet ailleurs : c'est le bon usage de `using namespace`.
  - key: bug-directive-globale
    format: bug-fix
    question: |-
      Le compilateur répond « reference to 'byte' is ambiguous ». Le type `byte` du projet existait bien avant que
      `std::byte` n'arrive, en C++17. Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      using namespace std;

      using byte = unsigned char;

      int main() {
          const byte octet = 65;
          println("{}", static_cast<int>(octet));
      }
      ```
    choices:
      - {text: "Retirer la directive `using namespace std;`, et écrire `std::println`", correct: true}
      - {text: "Placer l'alias `byte` avant la directive `using namespace std;`", correct: false}
      - {text: "Déclarer l'alias avec `typedef unsigned char byte;`", correct: false}
      - {text: "Compiler avec `-std=c++23` à la place de `-std=c++17`", correct: false}
    answer: |-
      ```cpp
      using byte = unsigned char;

      int main() {
          const byte octet = 65;
          std::println("{}", static_cast<int>(octet));
      }
      ```
      C'est le risque des noms à venir : le code compilait en C++14, et C++17 a ajouté `std::byte`. La directive
      rend les deux visibles. Sans elle, les ajouts du standard restent derrière leur préfixe.
  - key: situation-revue-en-tete
    format: scenario
    question: |-
      En revue de code, un en-tête public de ta bibliothèque commence par `using namespace std;`, « pour alléger
      les signatures ». Que demandes-tu ?
    choices:
      - {text: "De le retirer, et de qualifier chaque nom : il s'imposerait à tous les utilisateurs", correct: true}
      - {text: "De le garder, mais de le déplacer à la dernière ligne de l'en-tête", correct: false}
      - {text: "De le garder, et d'ajouter un commentaire qui prévient les utilisateurs", correct: false}
      - {text: "De le remplacer par `using namespace std::literals;`, moins large", correct: false}
    answer: |-
      Tout fichier qui inclut l'en-tête hériterait de la directive, sans pouvoir l'annuler. Ses propres noms
      pourraient entrer en conflit avec ceux de `std`. Le confort de l'auteur ne doit pas changer le code des
      autres.
  - key: situation-mise-a-jour
    format: scenario
    question: |-
      Un projet passe de C++14 à C++20. Des dizaines de fichiers, qui commencent tous par `using namespace std;`,
      ne compilent plus : « reference to 'size' is ambiguous », « 'data' is ambiguous ». Pourquoi ?
    choices:
      - {text: "Le standard a ajouté `std::size` et `std::data`, qui entrent en conflit avec les noms du projet", correct: true}
      - {text: "C++20 interdit la directive `using namespace std;` dans les fichiers source", correct: false}
      - {text: "C++20 a renommé l'espace de noms `std`, et l'ancien nom n'est plus reconnu", correct: false}
      - {text: "Le compilateur C++20 ne lit plus les en-têtes écrits pour C++14", correct: false}
    answer: |-
      La directive ouvre tout `std`, y compris ce que les versions suivantes y ajoutent. Les noms du projet, sans
      préfixe, deviennent ambigus. On retire les directives, ou on les limite à des déclarations `using` ciblées.
  - key: situation-confort
    format: scenario
    question: |-
      Dans une fonction de cinquante lignes, tu écris vingt fois `std::chrono::duration_cast` et
      `std::chrono::milliseconds`. Comment allèges-tu, sans risque ?
    choices:
      - {text: "Par des déclarations `using` de ces deux noms, au début de la fonction", correct: true}
      - {text: "Par `using namespace std;` en haut de l'en-tête de la classe", correct: false}
      - {text: "Par `#define MS std::chrono::milliseconds` en haut du fichier", correct: false}
      - {text: "Par `using namespace std;` avant les `#include` du fichier", correct: false}
    answer: |-
      Deux noms choisis, visibles dans une seule fonction : l'effet est limité et lisible. Un alias
      `namespace chrono = std::chrono;` conviendrait aussi. Une macro n'a pas de portée, et une directive globale
      ouvre tout.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande ce que tu penses de `using namespace std;`. Quelle réponse est la plus juste ?
    choices:
      - {text: "Jamais dans un en-tête ; au plus dans une fonction ; sinon j'écris `std::`", correct: true}
      - {text: "Toujours en haut de chaque fichier : le code est plus court à lire", correct: false}
      - {text: "Jamais nulle part : le standard l'a déprécié depuis C++17", correct: false}
      - {text: "Seulement dans les en-têtes : les fichiers source en héritent ainsi tous", correct: false}
    answer: |-
      Elle n'est ni interdite ni dépréciée ; elle est risquée à proportion de sa portée. Dans un en-tête, elle
      touche du code qu'on ne maîtrise pas. Dans une fonction, son effet est borné.
