notion: entetes-sources
lesson: |-
  Un programme C++ se répartit en deux sortes de fichiers.

  - Un **en-tête** (`.hpp`, ou `.h`) contient des **déclarations** : ce que les autres fichiers ont besoin de
    savoir pour **utiliser** le code.
  - Un **fichier source** (`.cpp`) contient les **définitions** : le code lui-même.

  ```cpp
  // geometrie.hpp
  #pragma once

  double aire_cercle(double rayon);
  ```

  ```cpp
  // geometrie.cpp
  #include "geometrie.hpp"

  double aire_cercle(double rayon) {
      return 3.14159 * rayon * rayon;
  }
  ```

  ```cpp
  // main.cpp
  #include "geometrie.hpp"
  #include <print>

  int main() {
      std::println("{}", aire_cercle(2.0));
  }
  ```

  **Pourquoi ce découpage.** Le compilateur traite chaque `.cpp` **séparément**. Pour compiler l'appel dans
  `main.cpp`, il lui faut la **déclaration** d'`aire_cercle`. L'en-tête la lui fournit, et la fournit à l'identique
  à tous les fichiers qui l'incluent. La définition, elle, n'existe qu'**une fois**, dans `geometrie.cpp`.

  **Ce qui va où.**

  | Dans l'en-tête | Dans le fichier source |
  |---|---|
  | déclarations de fonctions | définitions de fonctions |
  | définitions de classes, de `struct`, d'`enum` | définitions des fonctions membres |
  | templates (déclaration **et** définition) | variables globales |
  | fonctions `inline`, constantes `constexpr` | détails internes |

  Une **classe** est définie en entier dans l'en-tête : le compilateur doit connaître sa taille et ses membres
  partout où elle est utilisée. Seul le **corps** de ses fonctions membres va dans le `.cpp`.

  **`"..."` ou `<...>` ?** `#include "geometrie.hpp"` cherche d'abord à côté du fichier courant : c'est pour **tes**
  en-têtes. `#include <vector>` cherche dans les répertoires du système : c'est pour la bibliothèque standard et
  les bibliothèques installées.

  **Les bonnes habitudes.**

  - Un `.cpp` inclut **son propre en-tête en premier** : le compilateur vérifie ainsi que les déclarations et les
    définitions s'accordent, et que l'en-tête se suffit à lui-même.
  - Chaque fichier inclut **ce dont il se sert**, sans compter sur les inclusions d'un autre.
  - **Jamais** de `using namespace std;` dans un en-tête : il s'imposerait à tous ceux qui l'incluent.
  - On n'inclut **jamais** un `.cpp`, et on ne donne **pas** les en-têtes à `g++` : seulement les `.cpp`.

  **En entretien** : « L'en-tête porte les déclarations, partagées par inclusion ; le fichier source porte les
  définitions, compilées une seule fois. C'est ce qui permet la compilation séparée. Les templates et les fonctions
  `inline` font exception : leur définition va dans l'en-tête. »
tour:
  - title: Un en-tête, un fichier source
    text: |-
      Dès qu'un programme grandit, on le répartit en plusieurs fichiers.

      - L'**en-tête** `geometrie.hpp` **déclare** la fonction : son nom, ses paramètres, son type de retour.
      - Le **fichier source** `geometrie.cpp` la **définit** : il contient son code.
      - `main.cpp` inclut l'en-tête, et peut appeler la fonction sans voir son code.

      Les deux `.cpp` sont compilés séparément, puis réunis.

      Essaie : ajoute dans les trois fichiers une fonction `perimetre_carre`, et appelle-la depuis `main`.
    example:
      files:
        main.cpp: |-
          #include "geometrie.hpp"

          #include <print>

          int main() {
              std::println("{}", aire_carre(4));
          }
        geometrie.hpp: |-
          #pragma once

          int aire_carre(int cote);
        geometrie.cpp: |-
          #include "geometrie.hpp"

          int aire_carre(int cote) {
              return cote * cote;
          }
      output: "16"
    task:
      instructions: |-
        Le programme affiche l'aire d'un rectangle. Ajoute une fonction `perimetre_rectangle(largeur, hauteur)` :
        déclare-la dans `geometrie.hpp`, définis-la dans `geometrie.cpp`, puis affiche depuis `main` l'aire et le
        périmètre sur la même ligne, séparés par une espace.
      starter:
        main.cpp: |-
          #include "geometrie.hpp"

          #include <print>

          int main() {
              std::println("{}", aire_rectangle(3, 5));
          }
        geometrie.hpp: |-
          #pragma once

          int aire_rectangle(int largeur, int hauteur);
        geometrie.cpp: |-
          #include "geometrie.hpp"

          int aire_rectangle(int largeur, int hauteur) {
              return largeur * hauteur;
          }
      solution:
        main.cpp: |-
          #include "geometrie.hpp"

          #include <print>

          int main() {
              std::println("{} {}", aire_rectangle(3, 5), perimetre_rectangle(3, 5));
          }
        geometrie.hpp: |-
          #pragma once

          int aire_rectangle(int largeur, int hauteur);
          int perimetre_rectangle(int largeur, int hauteur);
        geometrie.cpp: |-
          #include "geometrie.hpp"

          int aire_rectangle(int largeur, int hauteur) {
              return largeur * hauteur;
          }

          int perimetre_rectangle(int largeur, int hauteur) {
              return 2 * (largeur + hauteur);
          }
      output: "15 16"
cards:
  - key: role-en-tete
    format: course
    question: "Que contient un en-tête (`.hpp`) ?"
    choices:
      - {text: "Les déclarations dont les autres fichiers ont besoin pour utiliser le code", correct: true}
      - {text: "Le code machine produit par le compilateur pour un fichier source", correct: false}
      - {text: "Le corps de toutes les fonctions du programme, sans exception", correct: false}
      - {text: "La liste des fichiers à compiler, lue par l'éditeur de liens", correct: false}
    answer: "Prototypes de fonctions, définitions de classes, constantes. Le corps des fonctions va dans le fichier source."
  - key: pourquoi-separer
    format: course
    question: "Pourquoi déclarer une fonction dans un en-tête plutôt que de la recopier dans chaque fichier ?"
    choices:
      - {text: "Tous les fichiers voient la même déclaration, tenue à jour en un seul endroit", correct: true}
      - {text: "Une fonction déclarée dans un en-tête s'exécute plus vite", correct: false}
      - {text: "Le compilateur refuse une déclaration écrite dans un fichier `.cpp`", correct: false}
      - {text: "L'éditeur de liens ne lit que les fichiers d'en-tête", correct: false}
    answer: "Une déclaration recopiée à la main finit par diverger de la définition. Avec un en-tête, il n'y a qu'une source de vérité."
  - key: guillemets-ou-chevrons
    format: course
    question: "Quelle différence entre `#include \"outils.hpp\"` et `#include <vector>` ?"
    choices:
      - {text: "Les guillemets cherchent d'abord à côté du fichier courant ; les chevrons dans les répertoires du système", correct: true}
      - {text: "Les guillemets incluent le fichier une seule fois ; les chevrons l'incluent à chaque ligne rencontrée", correct: false}
      - {text: "Les guillemets recopient le texte du fichier ; les chevrons se contentent de le compiler à part", correct: false}
      - {text: "Les guillemets sont réservés aux fichiers `.cpp` ; les chevrons aux fichiers `.hpp`", correct: false}
    answer: "Par convention : les guillemets pour les en-têtes de ton projet, les chevrons pour la bibliothèque standard et les bibliothèques installées."
  - key: classe-dans-en-tete
    format: course
    question: "Où écrit-on la définition d'une classe utilisée par plusieurs fichiers ?"
    choices:
      - {text: "Dans l'en-tête ; le corps de ses fonctions membres va dans le fichier source", correct: true}
      - {text: "Dans le fichier source ; l'en-tête ne contient que le nom de la classe", correct: false}
      - {text: "Dans chaque fichier source qui s'en sert, recopiée à la main", correct: false}
      - {text: "Dans le fichier qui contient `main`, avant toute autre déclaration", correct: false}
    answer: "Pour créer un objet, le compilateur doit connaître sa taille et ses membres : la classe entière est dans l'en-tête. Seul le code des fonctions peut être ailleurs."
  - key: vf-inclure-cpp
    format: true-false
    question: "Pour utiliser une fonction d'un autre fichier, on inclut son fichier `.cpp`."
    truth: false
    answer: "On inclut son en-tête. Inclure un `.cpp` recopierait ses définitions, qui existeraient alors deux fois."
  - key: vf-using-namespace
    format: true-false
    question: "Écrire `using namespace std;` dans un en-tête est une bonne pratique."
    truth: false
    answer: "Il s'appliquerait à tous les fichiers qui incluent l'en-tête, sans qu'ils l'aient demandé. Dans un en-tête, on écrit `std::` en toutes lettres."
  - key: vf-template
    format: true-false
    question: "La définition d'un template de fonction se place dans l'en-tête."
    truth: true
    answer: "Le compilateur a besoin du code du template pour le générer avec chaque type. C'est l'exception à la règle « définitions dans le `.cpp` »."
  - key: vf-commande
    format: true-false
    question: "On passe les fichiers d'en-tête à `g++`, à côté des fichiers `.cpp`."
    truth: false
    answer: "On ne compile que les `.cpp`. Les en-têtes y sont recopiés par `#include`."
  - key: qcm-ou-va-le-corps
    format: multiple-choice
    question: "Dans quel fichier écris-tu le corps de la fonction `double moyenne(const std::vector<int>&)` ?"
    choices:
      - {text: "Dans `stats.cpp`", correct: true}
      - {text: "Dans `stats.hpp`", correct: false}
      - {text: "Dans `stats.o`", correct: false}
      - {text: "Dans `main.cpp`, avant `main`", correct: false}
    answer: "La définition va dans le fichier source. L'en-tête `stats.hpp` n'en contient que le prototype."
  - key: qcm-premier-include
    format: multiple-choice
    question: "Quel en-tête `stats.cpp` inclut-il en premier ?"
    choices:
      - {text: "`\"stats.hpp\"`, son propre en-tête", correct: true}
      - {text: "`<iostream>`, toujours en premier", correct: false}
      - {text: "`\"main.cpp\"`, pour voir qui l'appelle", correct: false}
      - {text: "Aucun : un fichier source n'inclut pas son en-tête", correct: false}
    answer: "Inclure son en-tête d'abord vérifie qu'il se suffit à lui-même, et que les définitions s'accordent avec les déclarations."
  - key: qcm-commande
    format: multiple-choice
    question: "Un programme est fait de `main.cpp`, `stats.cpp` et `stats.hpp`. Quelle commande le construit ?"
    choices:
      - {text: "`g++ main.cpp stats.cpp -o programme`", correct: true}
      - {text: "`g++ main.cpp -o programme`", correct: false}
      - {text: "`g++ main.cpp stats.hpp -o programme`", correct: false}
      - {text: "`g++ stats.hpp -o programme`", correct: false}
    answer: "Tous les fichiers source, et seulement eux. Sans `stats.cpp`, l'édition de liens échoue."
  - key: qcm-dans-en-tete
    format: multiple-choice
    question: "Laquelle de ces lignes a sa place dans un en-tête ?"
    choices:
      - {text: "`int carre(int n);`", correct: true}
      - {text: "`int carre(int n) { return n * n; }`", correct: false}
      - {text: "`int compteur = 0;`", correct: false}
      - {text: "`using namespace std;`", correct: false}
    answer: "Un prototype est une déclaration : il peut être vu par tous les fichiers. Une définition de fonction ou de variable, recopiée dans plusieurs fichiers, existerait plusieurs fois."
  - key: trous-include
    format: fill-in
    question: |-
      Complète pour inclure l'en-tête du projet :
      ```cpp
      #___ "geometrie.hpp"
      ```
    blanks:
      - [include]
    answer: "`#include` recopie le contenu de l'en-tête à cet endroit."
  - key: trous-prototype
    format: fill-in
    question: |-
      Complète la déclaration écrite dans l'en-tête :
      ```cpp
      // geometrie.hpp
      int aire_carre(int cote)___
      ```
    blanks:
      - [";"]
    answer: "Une déclaration se termine par un point-virgule, sans corps."
  - key: trous-guillemets
    format: fill-in
    question: |-
      Complète avec le nom du fichier à inclure dans `geometrie.cpp` :
      ```cpp
      // geometrie.cpp
      #include "___"

      int aire_carre(int cote) {
          return cote * cote;
      }
      ```
    blanks:
      - [geometrie.hpp]
    answer: "Un fichier source inclut son propre en-tête."
  - key: trous-portee-classe
    format: fill-in
    question: |-
      Complète la définition, dans le fichier source, de la fonction membre déclarée dans l'en-tête :
      ```cpp
      // compte.cpp
      #include "compte.hpp"

      int Compte___solde() const {
          return solde_;
      }
      ```
    blanks:
      - ["::"]
    answer: "Hors de la classe, le nom de la fonction membre est précédé de `Compte::`."
  - key: bug-definition-dans-en-tete
    format: bug-fix
    question: |-
      Ce programme a deux fichiers source qui incluent `outils.hpp`. L'édition de liens échoue : « multiple
      definition of `carre(int)' ». Quelle correction est la bonne ?
      ```cpp
      // outils.hpp
      #pragma once

      int carre(int n) {
          return n * n;
      }
      ```
    choices:
      - {text: "Ne garder que `int carre(int n);` dans l'en-tête, et définir la fonction dans `outils.cpp`", correct: true}
      - {text: "Retirer la ligne `#pragma once`, qui empêche l'en-tête d'être inclus deux fois", correct: false}
      - {text: "Inclure `outils.hpp` dans un seul des deux fichiers source du programme", correct: false}
      - {text: "Renommer l'en-tête en `outils.cpp`, puis l'inclure dans les deux fichiers", correct: false}
    answer: |-
      ```cpp
      // outils.hpp
      #pragma once

      int carre(int n);
      ```
      Chaque fichier source qui inclut l'en-tête reçoit une copie de la définition : la fonction existe deux fois.
      `#pragma once` ne protège que d'une double inclusion dans un même fichier. Marquer la fonction `inline`
      conviendrait aussi.
  - key: bug-include-cpp
    format: bug-fix
    question: |-
      Ce programme est compilé avec `g++ main.cpp outils.cpp`. L'édition de liens échoue : `carre` est définie deux
      fois. Quelle correction est la bonne ?
      ```cpp
      // main.cpp
      #include "outils.cpp"

      #include <print>

      int main() {
          std::println("{}", carre(4));
      }
      ```
    choices:
      - {text: "Inclure `\"outils.hpp\"`, qui ne contient que la déclaration", correct: true}
      - {text: "Inclure `<outils.cpp>`, avec des chevrons", correct: false}
      - {text: "Inclure `\"outils.cpp\"` une seconde fois", correct: false}
      - {text: "Inclure `\"outils.o\"`, le fichier objet", correct: false}
    answer: |-
      ```cpp
      #include "outils.hpp"
      ```
      Inclure `outils.cpp` recopie la définition de `carre` dans `main.cpp`. Comme `outils.cpp` est aussi compilé de
      son côté, elle existe deux fois. On n'inclut que des en-têtes.
  - key: bug-prototype-different
    format: bug-fix
    question: |-
      L'édition de liens échoue : « undefined reference to `aire(double, double)' ». Quelle correction est la
      bonne ?
      ```cpp
      // geometrie.hpp
      double aire(double largeur, double hauteur);

      // geometrie.cpp
      double aire(int largeur, int hauteur) {
          return largeur * hauteur;
      }
      ```
    choices:
      - {text: "Donner à la définition les mêmes types de paramètres que la déclaration", correct: true}
      - {text: "Donner à la définition les mêmes noms de paramètres que la déclaration", correct: false}
      - {text: "Retirer la déclaration de l'en-tête, et garder la définition", correct: false}
      - {text: "Renommer la fonction `aire` dans l'en-tête seulement", correct: false}
    answer: |-
      ```cpp
      double aire(double largeur, double hauteur) {
          return largeur * hauteur;
      }
      ```
      `aire(int, int)` et `aire(double, double)` sont deux fonctions différentes, par surcharge. Celle que l'en-tête
      annonce n'est définie nulle part. Inclure `geometrie.hpp` en tête de `geometrie.cpp` ne suffit pas à le voir :
      seule l'édition de liens le révèle.
  - key: bug-en-tete-non-inclus
    format: bug-fix
    question: |-
      Le compilateur répond « 'aire_carre' was not declared in this scope ». La fonction est pourtant déclarée dans
      `geometrie.hpp`, et définie dans `geometrie.cpp`. Quelle correction est la bonne ?
      ```cpp
      // main.cpp
      #include <print>

      int main() {
          std::println("{}", aire_carre(4));
      }
      ```
    choices:
      - {text: "Ajouter `#include \"geometrie.hpp\"` en haut de `main.cpp`", correct: true}
      - {text: "Ajouter `geometrie.hpp` à la commande `g++`", correct: false}
      - {text: "Ajouter `using namespace geometrie;` en haut de `main.cpp`", correct: false}
      - {text: "Ajouter `extern` devant l'appel de `aire_carre`", correct: false}
    answer: |-
      ```cpp
      #include "geometrie.hpp"
      ```
      Le compilateur ne voit que `main.cpp`, et ce qu'il inclut. Sans l'en-tête, il ne connaît pas la fonction, même
      si elle existe ailleurs.
