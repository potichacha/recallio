notion: preprocesseur
lesson: |-
  Le **préprocesseur** passe avant le compilateur. Il traite les lignes qui commencent par `#`, et ne manipule que
  du **texte** : il ne connaît ni les types, ni les portées, ni les espaces de noms.

  **Les directives.**

  | Directive | Effet |
  |---|---|
  | `#include` | recopie un fichier à cet endroit |
  | `#define NOM valeur` | crée une macro : chaque `NOM` est remplacé par `valeur` |
  | `#define F(x) ...` | crée une macro à paramètres |
  | `#undef NOM` | supprime la macro |
  | `#ifdef NOM`, `#ifndef NOM` | garde le bloc si la macro est définie, ou non définie |
  | `#if`, `#elif`, `#else`, `#endif` | garde le bloc selon une condition entière |
  | `#error message` | arrête la compilation avec ce message |

  **Une macro est un remplacement de texte.** C'est la source de tous ses pièges.

  ```cpp
  #define CARRE(x) x * x

  CARRE(1 + 2)      // devient 1 + 2 * 1 + 2, soit 5
  ```

  **Les pièges.**

  - **La priorité des opérateurs** : il faut des parenthèses autour de chaque paramètre **et** autour du tout :
    `#define CARRE(x) ((x) * (x))`.
  - **L'évaluation multiple** : `MAX(suivant(), 0)` appelle `suivant()` deux fois, car l'argument est recopié à
    chaque endroit où le paramètre apparaît.
  - **Le point-virgule en trop** : `#define TAILLE 10;` recopie aussi le point-virgule.
  - **Plusieurs instructions** : une macro qui en contient deux, placée après un `if` sans accolades, n'en soumet
    qu'une à la condition.
  - **Aucune portée** : une macro vaut du `#define` jusqu'à la fin du fichier, en-têtes inclus ensuite compris. Une
    macro nommée `max` ou `ERROR` casse du code qui n'a rien demandé. D'où la convention : les macros
    **en majuscules**.
  - **Aucun type** : le compilateur ne voit jamais la macro, seulement le résultat. Les messages d'erreur et le
    débogueur ne la connaissent pas.
  - **Une macro non définie vaut 0 dans un `#if`** : une faute de frappe dans son nom passe inaperçue.

  **Ce que C++ offre à la place.**

  | Macro | Remplacement |
  |---|---|
  | `#define PI 3.14159` | `constexpr double pi = 3.14159;` |
  | `#define CARRE(x) ((x) * (x))` | une fonction `constexpr`, ou un template |
  | `#define ENTIER int` | `using Entier = int;` |
  | `#ifdef` autour de code | `if constexpr`, quand la condition est une constante C++ |

  **Ce qui lui reste.**

  - les **gardes d'inclusion** et `#pragma once` ;
  - la **compilation conditionnelle** selon la plateforme ou la configuration : `#ifdef _WIN32`, `#ifndef NDEBUG` ;
  - ce que seul du texte sait faire : `#x` transforme un argument en chaîne (c'est ainsi qu'`assert` affiche
    l'expression fausse), `__FILE__` et `__LINE__` donnent le fichier et la ligne. C++20 fournit
    `std::source_location` pour ces derniers.

  On définit aussi une macro depuis la ligne de commande : `g++ -DNDEBUG` équivaut à `#define NDEBUG`.

  **En entretien** : « Le préprocesseur fait du remplacement de texte avant la compilation, sans type ni portée.
  Une macro à paramètres a des pièges de priorité et d'évaluation multiple : je la remplace par `constexpr`, une
  fonction ou un template. Je garde le préprocesseur pour les inclusions et la compilation conditionnelle. »
cards:
  - key: nature
    format: course
    question: "Sur quoi travaille le préprocesseur ?"
    choices:
      - {text: "Sur du texte : il remplace et recopie, sans connaître les types ni les portées", correct: true}
      - {text: "Sur des fichiers objets : il relie chaque appel à la définition de sa fonction", correct: false}
      - {text: "Sur des expressions typées : il vérifie les conversions avant de les calculer", correct: false}
      - {text: "Sur le programme en cours d'exécution : il remplace les macros à la volée", correct: false}
    answer: "Il passe avant le compilateur, et lui remet un texte où plus aucune ligne en `#` ni aucune macro ne subsiste."
  - key: parentheses
    format: course
    question: "Pourquoi entoure-t-on de parenthèses les paramètres d'une macro, et son corps entier ?"
    choices:
      - {text: "L'argument est recopié tel quel : sans elles, la priorité des opérateurs change le calcul", correct: true}
      - {text: "Le préprocesseur exige des parenthèses pour reconnaître les paramètres d'une macro", correct: false}
      - {text: "Les parenthèses font évaluer l'argument une seule fois, avant le remplacement", correct: false}
      - {text: "Les parenthèses donnent un type à la macro, que le compilateur peut vérifier", correct: false}
    answer: "`CARRE(1 + 2)` avec `#define CARRE(x) x * x` devient `1 + 2 * 1 + 2`. Les parenthèses règlent la priorité, pas l'évaluation multiple."
  - key: evaluation-multiple
    format: course
    question: "Avec `#define MAX(a, b) ((a) > (b) ? (a) : (b))`, que se passe-t-il pour `MAX(lire(), 0)` ?"
    choices:
      - {text: "`lire()` peut être appelée deux fois : l'argument est recopié à chaque usage du paramètre", correct: true}
      - {text: "`lire()` est appelée une fois, et son résultat est rangé dans une variable temporaire", correct: false}
      - {text: "`lire()` n'est jamais appelée : le préprocesseur calcule le maximum lui-même", correct: false}
      - {text: "Le préprocesseur refuse un appel de fonction comme argument d'une macro", correct: false}
    answer: "Une fois dans la comparaison, une fois dans la branche choisie. Une fonction, elle, évalue chaque argument une seule fois."
  - key: remplacements
    format: course
    question: "Par quoi remplace-t-on `#define TAILLE_MAX 100` en C++ ?"
    choices:
      - {text: "Par `constexpr int taille_max = 100;`, qui a un type et une portée", correct: true}
      - {text: "Par `#undef TAILLE_MAX`, suivi d'une variable globale ordinaire", correct: false}
      - {text: "Par `volatile int taille_max = 100;`, que le compilateur ne modifie pas", correct: false}
      - {text: "Par `extern int taille_max;`, sans jamais lui donner de valeur", correct: false}
    answer: "Une constante `constexpr` est vue par le compilateur : elle est typée, respecte les portées et les espaces de noms, et apparaît dans le débogueur."
  - key: vf-portee
    format: true-false
    question: "Une macro définie dans une fonction cesse d'exister à la fin de cette fonction."
    truth: false
    answer: "Le préprocesseur ignore les portées : la macro vaut jusqu'à la fin du fichier, ou jusqu'à un `#undef`."
  - key: vf-non-definie
    format: true-false
    question: "Dans un `#if`, une macro qui n'a jamais été définie vaut 0."
    truth: true
    answer: "Aucune erreur n'est signalée : une faute de frappe dans le nom fait simplement choisir l'autre branche. `-Wundef` avertit."
  - key: vf-types
    format: true-false
    question: "Le compilateur vérifie le type des arguments passés à une macro."
    truth: false
    answer: "Il ne voit jamais la macro, seulement le texte obtenu après remplacement."
  - key: vf-ligne-de-commande
    format: true-false
    question: "L'option `-DNDEBUG` de `g++` définit la macro `NDEBUG` pour le fichier compilé."
    truth: true
    answer: "`-DNOM` équivaut à un `#define NOM` placé en tête du fichier. `-DNOM=valeur` lui donne une valeur."
  - key: qcm-supprimer
    format: multiple-choice
    question: "Quelle directive supprime une macro déjà définie ?"
    choices:
      - {text: "`#undef`", correct: true}
      - {text: "`#delete`", correct: false}
      - {text: "`#endif`", correct: false}
      - {text: "`#ifndef`", correct: false}
    answer: "`#undef NOM` : la macro n'existe plus pour la suite du fichier."
  - key: qcm-chaine
    format: multiple-choice
    question: "Dans le corps d'une macro, que fait `#x`, où `x` est un paramètre ?"
    choices:
      - {text: "Il transforme l'argument en chaîne de caractères", correct: true}
      - {text: "Il met l'argument en commentaire", correct: false}
      - {text: "Il colle l'argument au mot précédent", correct: false}
      - {text: "Il compte les caractères de l'argument", correct: false}
    answer: "C'est la « stringification » : `#x` avec l'argument `a + b` donne `\"a + b\"`. Coller deux mots se fait avec `##`."
  - key: qcm-plateforme
    format: multiple-choice
    question: "Lequel de ces usages reste légitime pour le préprocesseur en C++ moderne ?"
    choices:
      - {text: "Compiler un bloc seulement sous Windows, avec `#ifdef _WIN32`", correct: true}
      - {text: "Définir une constante numérique, avec `#define PI 3.14159`", correct: false}
      - {text: "Définir une petite fonction, avec `#define CARRE(x) ((x) * (x))`", correct: false}
      - {text: "Donner un autre nom à un type, avec `#define Entier int`", correct: false}
    answer: "La compilation conditionnelle selon la plateforme n'a pas d'équivalent dans le langage. Les trois autres se remplacent par `constexpr`, une fonction et `using`."
  - key: qcm-ligne
    format: multiple-choice
    question: "Quelle macro prédéfinie donne le numéro de la ligne en cours de compilation ?"
    choices:
      - {text: "`__LINE__`", correct: true}
      - {text: "`__FILE__`", correct: false}
      - {text: "`__DATE__`", correct: false}
      - {text: "`__func__`", correct: false}
    answer: "`__LINE__` donne la ligne, `__FILE__` le nom du fichier. C++20 offre `std::source_location::current()`, sans macro."
  - key: code-priorite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #define CARRE_FRAGILE(x) x * x
      #define CARRE(x) ((x) * (x))

      int main() {
          std::println("{} {}", CARRE_FRAGILE(1 + 2), CARRE(1 + 2));
      }
      ```
    choices:
      - {text: "`5 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`9 5`", correct: false}
      - {text: "`6 9`", correct: false}
    answer: "`5 9` : sans parenthèses, le texte devient `1 + 2 * 1 + 2`, et la multiplication passe d'abord. Avec elles, `((1 + 2) * (1 + 2))` vaut 9."
    check:
      output: "5 9"
  - key: code-evaluation-multiple
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #define MAX(a, b) ((a) > (b) ? (a) : (b))

      int appels = 0;

      int suivant() {
          return ++appels;
      }

      int main() {
          const int resultat = MAX(suivant(), 0);
          std::println("{} {}", resultat, appels);
      }
      ```
    choices:
      - {text: "`2 2`", correct: true}
      - {text: "`1 1`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`2 2` : `suivant()` est recopiée deux fois. Le premier appel, dans la comparaison, rend 1 ; le second, dans la branche choisie, rend 2."
    check:
      output: "2 2"
  - key: code-undef
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #define DEBUG
      #undef DEBUG

      #ifdef DEBUG
      const char* mode = "debug";
      #else
      const char* mode = "production";
      #endif

      #if NIVEAU > 2
      const int detail = 3;
      #else
      const int detail = 1;
      #endif

      int main() {
          std::println("{} {}", mode, detail);
      }
      ```
    choices:
      - {text: "`production 1`", correct: true}
      - {text: "`debug 1`", correct: false}
      - {text: "`production 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`production 1` : `#undef` a supprimé `DEBUG`. `NIVEAU` n'a jamais été définie : dans un `#if`, elle vaut 0, sans erreur."
    check:
      output: "production 1"
  - key: code-stringification
    format: code-output
    question: |-
      ```cpp
      #include <print>

      #define AFFICHER(expression) std::println("{} = {}", #expression, expression)

      int main() {
          AFFICHER(2 + 3);
      }
      ```
    choices:
      - {text: "`2 + 3 = 5`", correct: true}
      - {text: "`5 = 5`", correct: false}
      - {text: "`expression = 5`", correct: false}
      - {text: "`#expression = 5`", correct: false}
    answer: "`2 + 3 = 5` : `#expression` devient la chaîne `\"2 + 3\"`, le texte de l'argument. Le second usage est l'expression elle-même, calculée."
    check:
      output: "2 + 3 = 5"
  - key: bug-sans-parentheses
    format: bug-fix
    question: |-
      Ce programme devrait afficher `12`, le double de 3 multiplié par 2. Il affiche `9`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      #define DOUBLE(x) x + x

      int main() {
          std::println("{}", DOUBLE(3) * 2);
      }
      ```
    choices:
      - {text: "Remplacer la macro par `constexpr int doubler(int x) { return x + x; }`", correct: true}
      - {text: "Écrire la macro en minuscules : `#define double(x) x + x`", correct: false}
      - {text: "Ajouter un point-virgule à la fin de la ligne du `#define`", correct: false}
      - {text: "Écrire `DOUBLE(3 * 2)` à la place de `DOUBLE(3) * 2` dans l'appel", correct: false}
    answer: |-
      ```cpp
      constexpr int doubler(int x) {
          return x + x;
      }
      ```
      Le texte devient `3 + 3 * 2`, soit 9. Une fonction calcule son résultat avant qu'on le multiplie. À défaut, la
      macro s'écrit `((x) + (x))`.
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration du tableau : « expected ']' before ';' token ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      #define TAILLE 4;

      int main() {
          int valeurs[TAILLE] = {};
          std::println("{}", valeurs[0]);
      }
      ```
    choices:
      - {text: "Écrire `constexpr int taille = 4;`, et déclarer `int valeurs[taille]`", correct: true}
      - {text: "Écrire `#define TAILLE = 4;`, avec un signe égal", correct: false}
      - {text: "Écrire `int valeurs[TAILLE;] = {};` dans la fonction `main`", correct: false}
      - {text: "Écrire `#define TAILLE 4;;`, avec deux points-virgules", correct: false}
    answer: |-
      ```cpp
      constexpr int taille = 4;
      int valeurs[taille] = {};
      ```
      Le point-virgule fait partie de la macro : la ligne devient `int valeurs[4;] = {};`. Une constante `constexpr`
      est une vraie déclaration ; à défaut, `#define TAILLE 4`, sans point-virgule.
  - key: bug-deux-instructions
    format: bug-fix
    question: |-
      La condition est fausse : ce programme devrait afficher `5 5`. Il affiche `5 0`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      #define REMETTRE_A_ZERO(a, b) a = 0; b = 0

      int main() {
          int x = 5;
          int y = 5;
          if (x > 10)
              REMETTRE_A_ZERO(x, y);
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "Écrire une fonction `void remettre_a_zero(int& a, int& b)`, et l'appeler", correct: true}
      - {text: "Écrire `REMETTRE_A_ZERO(y, x);`, en inversant les deux arguments", correct: false}
      - {text: "Écrire `if (x > 10);` avec un point-virgule après la condition", correct: false}
      - {text: "Écrire la macro sur deux lignes, une par affectation", correct: false}
    answer: |-
      ```cpp
      void remettre_a_zero(int& a, int& b) {
          a = 0;
          b = 0;
      }
      ```
      La macro recopie deux instructions : seule `x = 0;` dépend du `if`, et `y = 0;` s'exécute toujours. Un appel de
      fonction est une seule instruction. Des accolades autour du corps du `if` protègent aussi.
  - key: bug-faute-de-frappe
    format: bug-fix
    question: |-
      Ce programme devrait afficher `détaillé`. Il affiche `simple`, sans le moindre avertissement. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      #define NIVAU 3

      #if NIVEAU > 2
      const char* journal = "détaillé";
      #else
      const char* journal = "simple";
      #endif

      int main() {
          std::println("{}", journal);
      }
      ```
    choices:
      - {text: "Corriger le nom de la macro : `#define NIVEAU 3`", correct: true}
      - {text: "Écrire `#ifdef NIVEAU > 2` à la place du `#if`", correct: false}
      - {text: "Écrire `#if NIVEAU >= 2` à la place de `> 2`", correct: false}
      - {text: "Placer le `#define` après le bloc `#if`", correct: false}
    answer: |-
      ```cpp
      #define NIVEAU 3
      ```
      La macro définie s'appelle `NIVAU`. `NIVEAU`, inconnue, vaut 0 dans le `#if` : aucune erreur. Une constante
      `constexpr` mal orthographiée aurait été refusée par le compilateur.
  - key: trous-define
    format: fill-in
    question: |-
      Complète la directive qui crée la macro :
      ```cpp
      #___ TAILLE_TAMPON 256
      ```
    blanks:
      - [define]
    answer: "`#define NOM valeur` crée une macro, remplacée partout par sa valeur."
  - key: trous-ifdef
    format: fill-in
    question: |-
      Complète pour ne garder la ligne que si la macro `DEBUG` est définie :
      ```cpp
      #___ DEBUG
      std::println("x = {}", x);
      #endif
      ```
    blanks:
      - [ifdef]
    answer: "`#ifdef NOM` garde le bloc quand la macro existe. `#if defined(NOM)` fait la même chose."
  - key: trous-undef
    format: fill-in
    question: |-
      Complète pour que la macro n'existe plus après cette ligne :
      ```cpp
      #define TEMPORAIRE 1
      #___ TEMPORAIRE
      ```
    blanks:
      - [undef]
    answer: "`#undef` supprime la macro pour la suite du fichier."
  - key: trous-parentheses
    format: fill-in
    question: |-
      Complète le corps de la macro, pour que `CUBE(1 + 1)` vaille 8 :
      ```cpp
      #define CUBE(x) (___ * (x) * (x))
      ```
    blanks:
      - ["(x)"]
    answer: "Chaque usage du paramètre s'entoure de parenthèses : l'argument `1 + 1` est recopié tel quel."
