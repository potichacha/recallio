notion: liaison-interne-externe
lesson: |-
  La **liaison** (*linkage*) d'un nom dit s'il désigne la **même entité** dans tous les fichiers source du
  programme, ou une entité **propre à chaque fichier**.

  | Liaison | Visible depuis | Exemples |
  |---|---|---|
  | **externe** | toutes les unités de traduction | une fonction ordinaire, une variable globale non `const` |
  | **interne** | la seule unité de traduction qui la définit | `static` à portée de fichier, espace de noms anonyme, variable globale `const` |
  | aucune | son bloc seulement | une variable locale |

  **La liaison externe, le défaut.** Une fonction ou une variable globale ordinaire est visible de l'éditeur de
  liens : un autre fichier peut s'en servir après l'avoir **déclarée**.

  ```cpp
  // config.cpp
  int niveau = 2;                 // définition, liaison externe

  // main.cpp
  extern int niveau;              // déclaration : « elle est définie ailleurs »
  ```

  `extern` sur une variable sans valeur est une **déclaration**. Avec une valeur (`extern int niveau = 2;`), c'est
  une définition.

  **La liaison interne, pour ce qui ne regarde que le fichier.** Deux écritures :

  ```cpp
  static int compteur = 0;        // à la mode du C
  static void aider() {}

  namespace {                     // espace de noms anonyme : la forme moderne
      int compteur = 0;
      void aider() {}
      struct Detail {};           // fonctionne aussi pour les types
  }
  ```

  Chaque fichier a alors **son propre exemplaire**. Deux fichiers peuvent avoir chacun leur fonction `aider` sans
  conflit, et l'éditeur de liens ne les voit pas.

  **Pourquoi s'en servir.**

  - **Éviter les collisions** : deux fonctions utilitaires de même nom et de même signature, à liaison externe,
    dans deux fichiers, violent la règle de la définition unique.
  - **Cacher les détails** : ce qui est interne ne fait pas partie de l'interface du fichier.
  - **Aider l'optimiseur** : une fonction interne, qu'il voit en entier, s'insère et se supprime plus librement.

  **`const` change le défaut.** En C++, une variable globale **`const`** (ou `constexpr`) a une liaison
  **interne** : chaque fichier qui inclut l'en-tête en a sa copie, sans erreur de l'éditeur de liens. Pour une
  seule constante partagée, on écrit `inline constexpr`.

  **Le piège de l'en-tête.** `static` ou un espace anonyme dans un **en-tête** donne une copie de la variable à
  chaque fichier qui l'inclut : un compteur « global » qui ne l'est pas. Dans un en-tête, on utilise `inline`.

  **Les trois sens de `static`.** À portée de fichier : liaison interne. Dans une fonction : la variable persiste
  entre les appels. Dans une classe : le membre appartient à la classe, pas à l'objet.

  **En entretien** : « Un nom à liaison externe désigne la même entité dans tout le programme ; à liaison interne,
  il est propre à son fichier. J'obtiens la liaison interne avec un espace de noms anonyme, pour les fonctions
  d'aide d'un `.cpp`. Et une variable globale `const` est interne par défaut. »
cards:
  - key: definition
    format: course
    question: "Que veut dire qu'une fonction a une liaison interne ?"
    choices:
      - {text: "Qu'elle n'est visible que dans le fichier source qui la définit", correct: true}
      - {text: "Qu'elle n'est visible que dans la classe qui la déclare", correct: false}
      - {text: "Qu'elle est visible de tous les fichiers source du programme", correct: false}
      - {text: "Qu'elle est insérée à chaque endroit où elle est appelée", correct: false}
    answer: "L'éditeur de liens ne la relie à rien d'autre. Un autre fichier peut définir une fonction de même nom sans conflit."
  - key: espace-anonyme
    format: course
    question: "Quel est l'effet d'un espace de noms anonyme, `namespace { ... }`, dans un fichier `.cpp` ?"
    choices:
      - {text: "Ce qu'il contient a une liaison interne : c'est propre à ce fichier", correct: true}
      - {text: "Ce qu'il contient est visible de tous les fichiers, sans déclaration", correct: false}
      - {text: "Ce qu'il contient est détruit à la fin de chaque fonction", correct: false}
      - {text: "Ce qu'il contient ne peut être utilisé que par `main`", correct: false}
    answer: "C'est la forme moderne de `static` à portée de fichier, et elle vaut aussi pour les types, que `static` ne sait pas cacher."
  - key: extern
    format: course
    question: "Que fait `extern int niveau;` dans un fichier source ?"
    choices:
      - {text: "Il déclare une variable définie dans une autre unité de traduction", correct: true}
      - {text: "Il définit une variable et l'initialise à zéro", correct: false}
      - {text: "Il rend la variable invisible des autres fichiers", correct: false}
      - {text: "Il range la variable dans un registre du processeur", correct: false}
    answer: "Sans valeur, c'est une déclaration : le compilateur accepte l'usage, et l'éditeur de liens trouvera la définition ailleurs."
  - key: const-global
    format: course
    question: "Quelle liaison a une variable globale `const int limite = 10;` en C++ ?"
    choices:
      - {text: "Interne : chaque fichier qui la voit en a sa propre copie", correct: true}
      - {text: "Externe : tous les fichiers partagent la même variable", correct: false}
      - {text: "Aucune : elle se comporte comme une variable locale", correct: false}
      - {text: "Externe, à condition d'être définie dans un en-tête", correct: false}
    answer: "C'est ce qui permet de définir une constante dans un en-tête sans « multiple definition ». Pour une seule entité partagée : `inline constexpr`."
  - key: vf-defaut
    format: true-false
    question: "Une fonction ordinaire, définie hors de toute classe, a par défaut une liaison externe."
    truth: true
    answer: "Elle est visible de l'éditeur de liens, donc appelable depuis tout fichier qui la déclare."
  - key: vf-static-en-tete
    format: true-false
    question: "Une variable `static` définie dans un en-tête est partagée par tous les fichiers qui l'incluent."
    truth: false
    answer: "Chaque fichier reçoit sa propre copie. Pour une variable commune définie dans un en-tête, on écrit `inline`."
  - key: vf-locale
    format: true-false
    question: "Une variable locale d'une fonction n'a aucune liaison."
    truth: true
    answer: "Elle n'est désignable que dans son bloc. La liaison ne concerne que les noms visibles au-delà."
  - key: vf-types
    format: true-false
    question: "Le mot-clé `static` permet de donner une liaison interne à une classe."
    truth: false
    answer: "`static` ne s'applique pas à un type. Pour cacher une classe dans un fichier, on la place dans un espace de noms anonyme."
  - key: qcm-fonction-aide
    format: multiple-choice
    question: "Comment déclares-tu, en C++ moderne, une fonction d'aide réservée à un fichier `.cpp` ?"
    choices:
      - {text: "Dans un espace de noms anonyme", correct: true}
      - {text: "Avec le mot-clé `extern`", correct: false}
      - {text: "Avec le mot-clé `inline`, dans l'en-tête", correct: false}
      - {text: "Avec le mot-clé `friend`", correct: false}
    answer: "`namespace { void aider(); }` lui donne une liaison interne. `static` fait de même pour une fonction, à l'ancienne."
  - key: qcm-collision
    format: multiple-choice
    question: "Deux fichiers `.cpp` définissent chacun `int arrondir(double)`, à liaison externe, avec des corps différents. Que se passe-t-il ?"
    choices:
      - {text: "L'éditeur de liens signale une définition multiple", correct: true}
      - {text: "Chaque fichier utilise la sienne, sans conflit", correct: false}
      - {text: "Le compilateur choisit la plus courte des deux", correct: false}
      - {text: "La seconde remplace la première en silence", correct: false}
    answer: "Deux définitions d'une même fonction à liaison externe violent la règle de la définition unique. Un espace de noms anonyme dans chaque fichier règle le conflit."
  - key: qcm-extern-valeur
    format: multiple-choice
    question: "Laquelle de ces lignes est une définition, et non une simple déclaration ?"
    choices:
      - {text: "`extern int niveau = 2;`", correct: true}
      - {text: "`extern int niveau;`", correct: false}
      - {text: "`void afficher();`", correct: false}
      - {text: "`class Client;`", correct: false}
    answer: "Une variable `extern` avec une valeur est définie. Sans valeur, elle est seulement déclarée."
  - key: qcm-trois-static
    format: multiple-choice
    question: "Que signifie `static` devant une variable déclarée à portée de fichier ?"
    choices:
      - {text: "Qu'elle a une liaison interne", correct: true}
      - {text: "Qu'elle garde sa valeur entre les appels d'une fonction", correct: false}
      - {text: "Qu'elle appartient à une classe, et non à un objet", correct: false}
      - {text: "Qu'elle ne peut pas être modifiée", correct: false}
    answer: "Le mot a trois sens selon l'endroit. Dans une fonction : persistance. Dans une classe : membre de classe. À portée de fichier : liaison interne."
  - key: code-anonyme
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace {
      int compteur = 5;

      int suivant() {
          return ++compteur;
      }
      }  // namespace

      int main() {
          suivant();
          const int avant = compteur;
          std::println("{} {}", avant, suivant());
      }
      ```
    choices:
      - {text: "`6 7`", correct: true}
      - {text: "`5 6`", correct: false}
      - {text: "`7 7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6 7` : dans son fichier, ce que contient un espace anonyme s'utilise sans préfixe. `compteur` vaut 6 après le premier appel, et le second le porte à 7."
    check:
      output: "6 7"
  - key: code-static-locale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      static int appels = 0;

      static void compter() {
          static int locaux = 10;
          ++appels;
          ++locaux;
          std::print("{} ", locaux);
      }

      int main() {
          compter();
          compter();
          std::println("{}", appels);
      }
      ```
    choices:
      - {text: "`11 12 2`", correct: true}
      - {text: "`11 11 2`", correct: false}
      - {text: "`11 12 0`", correct: false}
      - {text: "`10 11 2`", correct: false}
    answer: "`11 12 2` : `static` à portée de fichier donne une liaison interne ; dans la fonction, il fait persister `locaux` d'un appel à l'autre."
    check:
      output: "11 12 2"
  - key: code-extern
    format: code-output
    question: |-
      ```cpp
      #include <print>

      extern int niveau;

      int doubler() {
          return niveau * 2;
      }

      int niveau = 21;

      int main() {
          std::println("{}", doubler());
      }
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`21`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42` : `extern int niveau;` déclare la variable, définie plus bas. La déclaration suffit au compilateur pour s'en servir dans `doubler`."
    check:
      output: "42"
  - key: code-masquage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      namespace {
      int valeur = 1;
      }

      namespace outils {
      int valeur = 2;
      }

      int main() {
          int valeur = 3;
          std::println("{} {} {}", valeur, ::valeur, outils::valeur);
      }
      ```
    choices:
      - {text: "`3 1 2`", correct: true}
      - {text: "`3 3 2`", correct: false}
      - {text: "`1 1 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3 1 2` : la locale masque les autres. `::valeur` désigne celle de la portée globale, où l'espace anonyme rend la sienne visible."
    check:
      output: "3 1 2"
  - key: bug-collision
    format: bug-fix
    question: |-
      Deux fichiers définissent chacun leur fonction `arrondir`, pour leur propre usage. L'édition de liens échoue :
      « multiple definition of `arrondir(double)' ». Quelle correction est la bonne ?
      ```cpp
      // prix.cpp
      int arrondir(double x) {
          return static_cast<int>(x + 0.5);
      }

      // notes.cpp
      int arrondir(double x) {
          return static_cast<int>(x);
      }
      ```
    choices:
      - {text: "Placer chaque fonction dans un espace de noms anonyme, dans son fichier", correct: true}
      - {text: "Déclarer chaque fonction avec le mot-clé `extern`", correct: false}
      - {text: "Ajouter `#pragma once` en haut de chacun des deux fichiers", correct: false}
      - {text: "Déclarer chaque fonction avec le mot-clé `virtual`", correct: false}
    answer: |-
      ```cpp
      namespace {
      int arrondir(double x) {
          return static_cast<int>(x + 0.5);
      }
      }
      ```
      Les deux fonctions ont une liaison externe et la même signature : l'éditeur de liens en voit deux. Rendues
      internes, elles n'existent que pour leur fichier.
  - key: bug-static-en-tete
    format: bug-fix
    question: |-
      Ce compteur, défini dans un en-tête, devrait être commun à tout le programme. Chaque fichier qui inclut
      l'en-tête a pourtant le sien. Quelle correction est la bonne ?
      ```cpp
      // compteur.hpp
      #pragma once

      static int requetes = 0;
      ```
    choices:
      - {text: "Écrire `inline int requetes = 0;`", correct: true}
      - {text: "Écrire `const int requetes = 0;`", correct: false}
      - {text: "Écrire `namespace { int requetes = 0; }`", correct: false}
      - {text: "Écrire `thread_local int requetes = 0;`", correct: false}
    answer: |-
      ```cpp
      inline int requetes = 0;
      ```
      `static` donne une liaison interne : une variable par fichier source. `inline` (C++17) garde une liaison
      externe et autorise la définition dans l'en-tête : une seule variable pour tous.
  - key: bug-extern-sans-definition
    format: bug-fix
    question: |-
      L'édition de liens échoue : « undefined reference to `niveau' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      extern int niveau;

      int main() {
          std::println("{}", niveau);
      }
      ```
    choices:
      - {text: "Définir la variable quelque part : `int niveau = 2;`", correct: true}
      - {text: "Déclarer la variable deux fois : `extern int niveau;` répété", correct: false}
      - {text: "Écrire `static extern int niveau;`", correct: false}
      - {text: "Écrire `extern niveau;` sans le type", correct: false}
    answer: |-
      ```cpp
      int niveau = 2;
      ```
      `extern int niveau;` promet une définition, dans ce fichier ou un autre. Sans elle, l'éditeur de liens n'a
      rien à relier.
  - key: bug-acces-interne
    format: bug-fix
    question: |-
      `main.cpp` veut appeler une fonction définie dans `outils.cpp`. L'édition de liens échoue : « undefined
      reference to `aider()' ». Quelle correction est la bonne ?
      ```cpp
      // outils.cpp
      static void aider() {}

      // main.cpp
      void aider();

      int main() {
          aider();
      }
      ```
    choices:
      - {text: "Retirer `static` de la définition dans `outils.cpp`", correct: true}
      - {text: "Ajouter `static` à la déclaration dans `main.cpp`", correct: false}
      - {text: "Ajouter `extern` à la définition, devant `static`", correct: false}
      - {text: "Renommer la fonction dans `main.cpp` seulement", correct: false}
    answer: |-
      ```cpp
      // outils.cpp
      void aider() {}
      ```
      `static` rend la fonction propre à `outils.cpp` : aucun autre fichier ne peut s'y lier. Une fonction qu'on
      veut partager garde sa liaison externe, et se déclare dans un en-tête.
