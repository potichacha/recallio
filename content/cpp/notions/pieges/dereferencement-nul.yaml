notion: dereferencement-nul
lesson: |-
  **Déréférencer** un pointeur, c'est accéder à l'objet qu'il désigne : `*p`, `p->membre`, `p[i]`. Cela n'a de
  sens que si le pointeur désigne un objet **vivant**. Trois sortes de pointeurs ne le font pas.

  | Pointeur | Ce qu'il contient | Peut-on le tester ? |
  |---|---|---|
  | **nul** | `nullptr` : « ne désigne rien » | oui : `if (p != nullptr)` |
  | **pendant** (*dangling*) | l'adresse d'un objet **détruit** | **non** : rien ne le distingue d'un pointeur valide |
  | **non initialisé** | une valeur quelconque | non |

  Les déréférencer est, dans les trois cas, un **comportement indéfini**.

  **Le pointeur nul.** Sur un ordinateur de bureau, l'accès à l'adresse zéro est intercepté par le système : le
  programme s'arrête sur une **erreur de segmentation**. C'est le cas le moins grave : la faute se voit, à
  l'endroit où elle se produit. Mais ce n'est pas garanti, et le compilateur peut avoir supprimé un test placé trop
  tard.

  ```cpp
  Client* c = trouver(id);     // peut renvoyer nullptr
  if (c != nullptr) {
      std::println("{}", c->nom);
  }
  ```

  **Le pointeur pendant.** L'objet a été détruit, mais le pointeur a gardé son adresse. Trois fabriques courantes :

  ```cpp
  int* p = new int{5};
  delete p;
  *p = 7;                      // 1. utilisation après libération (use-after-free)

  int* locale() {
      int x = 5;
      return &x;               // 2. adresse d'une variable locale, détruite au retour
  }

  int* q = &v[0];
  v.push_back(1);              // 3. le vecteur réalloue : q désigne l'ancien bloc
  ```

  C'est le cas le plus dangereux : la mémoire contient souvent encore l'ancienne valeur, et le programme **semble
  fonctionner**. Plus tard, elle est réutilisée, et l'on lit ou l'on abîme un autre objet.

  **Les références aussi.** Une référence ne peut pas être nulle, mais elle peut être **pendante** : renvoyer une
  référence vers une variable locale, ou garder une référence vers un élément d'un vecteur qui réalloue.

  **Les remèdes.**

  - **Initialiser** tout pointeur : `int* p = nullptr;`.
  - **Tester** un pointeur qui peut être nul avant de s'en servir, et dire dans l'interface s'il peut l'être : une
    **référence** quand la valeur est obligatoire, un pointeur ou un `std::optional` quand elle peut manquer.
  - Confier la possession à un **pointeur intelligent** : avec `std::unique_ptr`, pas de `delete` à la main, donc
    pas d'utilisation après libération par oubli.
  - Ne pas renvoyer l'adresse ni la référence d'une **variable locale**.
  - Pendant les tests : **AddressSanitizer** signale l'utilisation après libération, avec la pile de l'allocation,
    de la libération et de l'accès.

  **Mettre le pointeur à `nullptr` après `delete`** transforme un pointeur pendant en pointeur nul, testable. Cela
  ne protège pas les **autres** pointeurs qui désignaient le même objet.

  **En entretien** : « Un pointeur nul se teste ; un pointeur pendant, non : il désigne un objet détruit, et le
  déréférencer est indéfini même si ça semble marcher. J'évite les pointeurs possédants bruts, je ne renvoie
  jamais l'adresse d'une locale, et je teste avec AddressSanitizer. »
cards:
  - key: trois-sortes
    format: course
    question: "Qu'est-ce qu'un pointeur pendant ?"
    choices:
      - {text: "Un pointeur qui garde l'adresse d'un objet déjà détruit", correct: true}
      - {text: "Un pointeur qui vaut `nullptr`, et ne désigne rien", correct: false}
      - {text: "Un pointeur qui désigne un autre pointeur", correct: false}
      - {text: "Un pointeur dont l'objet n'a pas encore été modifié", correct: false}
    answer: "En anglais, *dangling pointer*. L'adresse était valide, elle ne l'est plus : l'objet a été libéré, ou sa portée s'est terminée."
  - key: tester
    format: course
    question: "Pourquoi un pointeur pendant est-il plus dangereux qu'un pointeur nul ?"
    choices:
      - {text: "Aucun test ne le distingue d'un pointeur valide, et le programme semble souvent fonctionner", correct: true}
      - {text: "Le compilateur refuse de le comparer à `nullptr`, alors qu'il accepte un pointeur nul", correct: false}
      - {text: "Il occupe deux fois plus de mémoire qu'un pointeur nul, à cause de l'objet détruit", correct: false}
      - {text: "Il arrête toujours le programme, alors qu'un pointeur nul est ignoré sans conséquence", correct: false}
    answer: "Un pointeur nul se teste, et son déréférencement plante le plus souvent tout de suite. Un pointeur pendant contient une adresse d'apparence normale, où traîne parfois encore l'ancienne valeur."
  - key: nul
    format: course
    question: "Que dit le standard du déréférencement d'un pointeur nul ?"
    choices:
      - {text: "C'est un comportement indéfini", correct: true}
      - {text: "Il lève une exception `std::bad_alloc`", correct: false}
      - {text: "Il renvoie la valeur zéro", correct: false}
      - {text: "Il arrête toujours le programme", correct: false}
    answer: "En pratique, le système arrête souvent le programme par une erreur de segmentation. Mais rien ne le garantit : ce n'est pas une exception qu'on attrape."
  - key: remedes
    format: course
    question: "Quel choix d'interface dit qu'un argument ne peut pas être absent ?"
    choices:
      - {text: "Le recevoir par référence, plutôt que par pointeur", correct: true}
      - {text: "Le recevoir par pointeur, plutôt que par référence", correct: false}
      - {text: "Le recevoir par pointeur vers un pointeur", correct: false}
      - {text: "Le recevoir par `void*`", correct: false}
    answer: "Une référence désigne toujours un objet : l'appelant ne peut pas passer « rien ». Un pointeur, lui, annonce que `nullptr` est possible, et qu'il faut tester."
  - key: vf-attraper
    format: true-false
    question: "Le déréférencement d'un pointeur nul lève une exception que l'on peut attraper avec `catch`."
    truth: false
    answer: "Ce n'est pas une exception C++. Le système envoie un signal qui arrête le programme ; un `try`/`catch` n'y change rien."
  - key: vf-reference-pendante
    format: true-false
    question: "Une référence peut être pendante, comme un pointeur."
    truth: true
    answer: "Elle ne peut pas être nulle, mais elle peut désigner un objet détruit : une variable locale renvoyée par référence, par exemple."
  - key: vf-nullptr-apres-delete
    format: true-false
    question: "Mettre un pointeur à `nullptr` après `delete` protège tous les pointeurs qui désignaient le même objet."
    truth: false
    answer: "Seul ce pointeur devient testable. Les copies gardent l'ancienne adresse, et restent pendantes."
  - key: vf-delete-nul
    format: true-false
    question: "`delete` sur un pointeur nul ne fait rien, et n'est pas une faute."
    truth: true
    answer: "C'est garanti par le standard. Le danger est de déréférencer un pointeur nul, pas de le libérer."
  - key: qcm-fabrique
    format: multiple-choice
    question: "Laquelle de ces lignes fabrique un pointeur pendant ?"
    choices:
      - {text: "`int* p = new int{5}; delete p;`", correct: true}
      - {text: "`int* p = nullptr;`", correct: false}
      - {text: "`int x = 5; int* p = &x;`", correct: false}
      - {text: "`auto p = std::make_unique<int>(5);`", correct: false}
    answer: "Après `delete`, `p` contient toujours l'adresse de la mémoire libérée. Dans les autres cas, le pointeur est nul, ou désigne un objet vivant."
  - key: qcm-outil
    format: multiple-choice
    question: "Quel outil signale une utilisation après libération, avec l'endroit du `delete` et celui de l'accès ?"
    choices:
      - {text: "AddressSanitizer", correct: true}
      - {text: "ThreadSanitizer", correct: false}
      - {text: "Le préprocesseur", correct: false}
      - {text: "L'éditeur de liens", correct: false}
    answer: "AddressSanitizer (`-fsanitize=address`) garde en quarantaine la mémoire libérée, et arrête le programme au premier accès."
  - key: qcm-renvoyer
    format: multiple-choice
    question: "Une fonction calcule un entier dans une variable locale. Comment le rend-elle à l'appelant sans danger ?"
    choices:
      - {text: "Par valeur : `int calculer();`", correct: true}
      - {text: "Par pointeur vers la locale : `int* calculer();`", correct: false}
      - {text: "Par référence vers la locale : `int& calculer();`", correct: false}
      - {text: "Par référence constante vers la locale : `const int& calculer();`", correct: false}
    answer: "La variable locale est détruite au retour : un pointeur ou une référence vers elle seraient pendants, `const` ou non. La valeur, elle, est copiée ou déplacée."
  - key: qcm-optionnel
    format: multiple-choice
    question: "Quel type de paramètre annonce que l'objet peut manquer, et qu'il faut tester ?"
    choices:
      - {text: "`const Client*`", correct: true}
      - {text: "`const Client&`", correct: false}
      - {text: "`Client`", correct: false}
      - {text: "`Client&&`", correct: false}
    answer: "Un pointeur peut valoir `nullptr`. Une référence ou une valeur désignent toujours un objet."
  - key: code-test-nul
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int longueur(const char* texte) {
          if (texte == nullptr) {
              return -1;
          }
          int n = 0;
          while (texte[n] != '\0') {
              ++n;
          }
          return n;
      }

      int main() {
          std::println("{} {}", longueur("abc"), longueur(nullptr));
      }
      ```
    choices:
      - {text: "`3 -1`", correct: true}
      - {text: "`3 0`", correct: false}
      - {text: "`4 -1`", correct: false}
      - {text: "`3`, puis une erreur de segmentation", correct: false}
    answer: "`3 -1` : le test précède tout accès. Avec `nullptr`, la fonction renvoie -1 sans jamais déréférencer le pointeur."
    check:
      output: "3 -1"
  - key: code-unique-ptr
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          auto p = std::make_unique<int>(5);
          auto q = std::move(p);
          std::println("{} {}", p == nullptr, *q);
      }
      ```
    choices:
      - {text: "`true 5`", correct: true}
      - {text: "`false 5`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "`false 0`", correct: false}
    answer: "`true 5` : après le déplacement, `p` est nul, et cela se teste. C'est `q` qui possède l'entier."
    check:
      output: "true 5"
  - key: code-find-nul
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      const int* chercher(const std::vector<int>& v, int cible) {
          for (const int& x : v) {
              if (x == cible) {
                  return &x;
              }
          }
          return nullptr;
      }

      int main() {
          const std::vector<int> v{4, 8, 15};
          const int* a = chercher(v, 8);
          const int* b = chercher(v, 9);
          std::println("{} {}", a != nullptr ? *a : -1, b != nullptr ? *b : -1);
      }
      ```
    choices:
      - {text: "`8 -1`", correct: true}
      - {text: "`8 9`", correct: false}
      - {text: "`1 -1`", correct: false}
      - {text: "`8 0`", correct: false}
    answer: "`8 -1` : la fonction renvoie l'adresse de l'élément trouvé, qui vit dans le vecteur, ou `nullptr`. Chaque pointeur est testé avant d'être déréférencé."
    check:
      output: "8 -1"
  - key: code-weak-ptr
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      int main() {
          std::weak_ptr<int> observateur;
          {
              auto proprietaire = std::make_shared<int>(7);
              observateur = proprietaire;
              std::print("{} ", observateur.expired());
          }
          std::println("{} {}", observateur.expired(), observateur.lock() == nullptr);
      }
      ```
    choices:
      - {text: "`false true true`", correct: true}
      - {text: "`false false false`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false true false`", correct: false}
    answer: "`false true true` : à la fin du bloc, l'entier est détruit. Le `std::weak_ptr` le sait : `expired()` vaut `true`, et `lock()` rend un pointeur nul, au lieu d'un pointeur pendant."
    check:
      output: "false true true"
  - key: bug-use-after-free
    format: bug-fix
    question: |-
      Ce programme lit un entier après l'avoir libéré. Son comportement est indéfini. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int main() {
          int* p = new int{42};
          delete p;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Afficher `*p` avant le `delete`", correct: true}
      - {text: "Écrire `delete p;` deux fois de suite", correct: false}
      - {text: "Tester `p != nullptr` avant d'afficher `*p`", correct: false}
      - {text: "Déclarer `p` avec le type `const int*`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", *p);
      delete p;
      ```
      Après `delete`, `p` est pendant : il n'est pas nul, donc le tester ne sert à rien. Avec
      `auto p = std::make_unique<int>(42);`, il n'y aurait pas de `delete` à mal placer.
  - key: bug-adresse-locale
    format: bug-fix
    question: |-
      Cette fonction renvoie l'adresse d'une variable locale. Le programme a un comportement indéfini. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      const int* maximum(int a, int b) {
          const int resultat = a > b ? a : b;
          return &resultat;
      }

      int main() {
          std::println("{}", *maximum(3, 9));
      }
      ```
    choices:
      - {text: "Renvoyer la valeur : `int maximum(int a, int b)`, et `return resultat;`", correct: true}
      - {text: "Renvoyer une référence : `const int& maximum(int a, int b)`", correct: false}
      - {text: "Déclarer `resultat` sans `const`, et garder le pointeur", correct: false}
      - {text: "Tester `maximum(3, 9) != nullptr` avant de déréférencer", correct: false}
    answer: |-
      ```cpp
      int maximum(int a, int b) {
          return a > b ? a : b;
      }
      ```
      `resultat` est détruite à la sortie de la fonction : son adresse ne désigne plus rien. Une référence aurait le
      même défaut, et le pointeur n'est pas nul. On renvoie la valeur.
  - key: bug-non-teste
    format: bug-fix
    question: |-
      Ce programme plante sur une erreur de segmentation quand le client est inconnu. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>

      struct Client {
          std::string nom;
      };

      const Client* trouver(int id) {
          static const Client ada{"Ada"};
          return id == 1 ? &ada : nullptr;
      }

      int main() {
          const Client* client = trouver(2);
          std::println("{}", client->nom);
      }
      ```
    choices:
      - {text: "Tester `client != nullptr` avant de lire `client->nom`", correct: true}
      - {text: "Écrire `(*client).nom` à la place de `client->nom`", correct: false}
      - {text: "Déclarer `client` avec le type `Client*`, sans `const`", correct: false}
      - {text: "Entourer l'affichage d'un `try` et d'un `catch (...)`", correct: false}
    answer: |-
      ```cpp
      if (client != nullptr) {
          std::println("{}", client->nom);
      } else {
          std::println("client inconnu");
      }
      ```
      `trouver` renvoie `nullptr` pour un identifiant inconnu : c'est écrit dans son type de retour. `(*client).nom`
      déréférence tout autant, et une erreur de segmentation n'est pas une exception.
  - key: bug-pointeur-non-initialise
    format: bug-fix
    question: |-
      Ce programme écrit à travers un pointeur qui n'a jamais reçu d'adresse. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int* p;
          *p = 5;
          std::println("{}", *p);
      }
      ```
    choices:
      - {text: "Faire désigner à `p` un entier existant : `int valeur = 0; int* p = &valeur;`", correct: true}
      - {text: "Initialiser le pointeur à nul : `int* p = nullptr;`, sans rien changer d'autre", correct: false}
      - {text: "Déclarer le pointeur constant : `int* const p;`", correct: false}
      - {text: "Écrire `p = 5;` à la place de `*p = 5;`", correct: false}
    answer: |-
      ```cpp
      int valeur = 0;
      int* p = &valeur;
      *p = 5;
      ```
      Un pointeur non initialisé contient une adresse quelconque. Le mettre à `nullptr` le rendrait testable, mais
      l'écriture `*p = 5` resterait indéfinie : il faut un objet à désigner.
  - key: situation-cache
    format: scenario
    question: |-
      Une classe `Cache` garde des `Session*` vers des sessions possédées ailleurs. Quand une session est
      supprimée, le cache n'en sait rien, et le programme plante plus tard en la lisant. Que proposes-tu ?
    choices:
      - {text: "Des `std::weak_ptr<Session>`, sur des sessions tenues par `std::shared_ptr`", correct: true}
      - {text: "Un test `!= nullptr` avant chaque lecture d'une session du cache", correct: false}
      - {text: "Des `const Session*`, pour que les sessions ne soient plus supprimées", correct: false}
      - {text: "Un `catch (...)` autour de chaque lecture d'une session du cache", correct: false}
    answer: |-
      Les pointeurs du cache deviennent pendants, et rien ne permet de le tester. Un `std::weak_ptr` observe sans
      posséder : `lock()` rend un pointeur nul quand l'objet a disparu. Le cache peut alors retirer l'entrée.
  - key: situation-marche-en-test
    format: scenario
    question: |-
      Une fonction renvoie `const std::string&` vers une variable locale. Les tests passent, mais en production le
      texte est parfois illisible. Pourquoi les tests ne l'ont-ils pas vu ?
    choices:
      - {text: "La mémoire de la locale détruite gardait encore sa valeur, tant que rien ne la réutilisait", correct: true}
      - {text: "Une référence constante prolonge la vie de la variable locale pendant les tests", correct: false}
      - {text: "Les tests s'exécutent sans optimisation, ce qui rend la référence valide", correct: false}
      - {text: "Le compilateur copie la chaîne quand la fonction est appelée depuis un test", correct: false}
    answer: |-
      Une référence pendante est un comportement indéfini, qui « marche » souvent : la pile n'est pas effacée au
      retour de la fonction. Dès qu'un autre appel la réutilise, le texte change. GCC signale ce cas
      (`-Wreturn-local-addr`), et AddressSanitizer le détecte.
  - key: situation-interface
    format: scenario
    question: |-
      Une fonction `void imprimer(const Document* doc)` commence par `doc->titre()`. Elle n'a de sens qu'avec un
      document. Des appelants lui passent parfois `nullptr`, et le programme plante. Que proposes-tu ?
    choices:
      - {text: "Recevoir `const Document&` : l'absence de document devient impossible à exprimer", correct: true}
      - {text: "Recevoir `const Document**` : l'appelant devra passer l'adresse de son pointeur", correct: false}
      - {text: "Garder le pointeur, et ajouter un commentaire qui interdit `nullptr`", correct: false}
      - {text: "Garder le pointeur, et entourer `doc->titre()` d'un `catch (...)`", correct: false}
    answer: |-
      Le type doit dire le contrat. Une référence oblige l'appelant à avoir un objet ; celui qui tient un pointeur
      devra le tester avant de le déréférencer. Un commentaire ne vérifie rien, et un `catch` n'attrape pas une
      erreur de segmentation.
  - key: situation-double-pointeur
    format: scenario
    question: |-
      Deux objets gardent chacun un pointeur brut vers le même tampon. Le premier le libère avec `delete`, et met
      son pointeur à `nullptr`. Le second plante ensuite en l'utilisant. Pourquoi, et que proposes-tu ?
    choices:
      - {text: "Le second pointeur est resté pendant ; un `std::shared_ptr` partagé libère au bon moment", correct: true}
      - {text: "Le premier objet aurait dû appeler `delete` deux fois, une par pointeur", correct: false}
      - {text: "Le second objet aurait dû tester son pointeur avec `!= nullptr`", correct: false}
      - {text: "Le tampon aurait dû être déclaré `static`, pour ne jamais être libéré", correct: false}
    answer: |-
      Mettre un pointeur à nul n'informe pas ses copies. Quand la possession est réellement partagée,
      `std::shared_ptr` compte les propriétaires, et ne libère le tampon qu'après le dernier.
