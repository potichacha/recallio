notion: acces-hors-bornes
lesson: |-
  Un conteneur de `n` éléments a des indices de `0` à `n - 1`. Lire ou écrire ailleurs est un **accès hors
  bornes** : la faute la plus répandue en C++, et la source d'une grande part des failles de sécurité.

  **`operator[]` ne vérifie rien.**

  ```cpp
  std::vector<int> v{10, 20, 30};
  int x = v[3];     // comportement indéfini
  v[5] = 1;         // comportement indéfini : écrit dans la mémoire d'un autre
  ```

  Le compilateur ne dit rien. À l'exécution, la lecture rend une valeur quelconque, ou plante ; l'écriture abîme
  une autre variable, et le programme plante plus tard, ailleurs.

  **`at()` vérifie, et lance une exception.**

  ```cpp
  try {
      int x = v.at(3);
  } catch (const std::out_of_range& e) {
      // l'erreur est attrapée, le programme continue
  }
  ```

  | | `v[i]` | `v.at(i)` |
  |---|---|---|
  | Indice invalide | comportement indéfini | exception `std::out_of_range` |
  | Coût | aucun | un test |
  | Existe sur | `vector`, `array`, `string`, `deque`, `span` | les mêmes, sauf `span` avant C++26 |

  **Les autres accès qui ne vérifient pas.** `front()` et `back()` sur un conteneur **vide**, `*v.end()`,
  `pop_back()` sur un conteneur vide, l'arithmétique sur un pointeur ou un itérateur.

  **Les fautes classiques.**

  - L'**erreur d'une unité** : `for (i = 0; i <= v.size(); ++i)`. Le dernier indice valide est `size() - 1`.
  - L'indice venu de **l'extérieur** (saisie, fichier, réseau), utilisé sans contrôle.
  - L'indice **négatif**, converti en un très grand nombre non signé.
  - Le conteneur **vide** : `v[0]`, `v.back()`.
  - L'indice calculé, comme `v[v.size() - 1]` sur un vecteur vide.

  **Comment les éviter.**

  1. **Ne pas indexer** quand ce n'est pas nécessaire : la boucle sur un intervalle `for (int x : v)` ne peut pas
     déborder, pas plus que les algorithmes.
  2. **Contrôler** tout indice qui vient de l'extérieur : `if (i < v.size())`.
  3. **`at()`** quand l'indice n'est pas sûr, et qu'une exception est une réponse acceptable.
  4. Pendant les tests : **AddressSanitizer** (`-fsanitize=address`), ou le mode vérifié de la bibliothèque
     (`-D_GLIBCXX_ASSERTIONS` avec GCC), qui arrête le programme au premier `v[i]` invalide.

  **Les tableaux bruts.** Un tableau `int t[3]` n'a ni `at()` ni `size()` : aucun contrôle n'est possible une fois
  qu'il est devenu un pointeur. C'est une raison de plus de préférer `std::array` et `std::vector`.

  **En entretien** : « `operator[]` ne vérifie pas l'indice : hors bornes, c'est un comportement indéfini. `at()`
  vérifie et lance `std::out_of_range`. Je préfère les boucles sur un intervalle, je contrôle les indices venus de
  l'extérieur, et je teste avec AddressSanitizer. »
cards:
  - key: crochets
    format: course
    question: "Que se passe-t-il quand on lit `v[10]` sur un `std::vector` de trois éléments ?"
    choices:
      - {text: "C'est un comportement indéfini : aucune vérification n'est faite", correct: true}
      - {text: "Une exception `std::out_of_range` est lancée", correct: false}
      - {text: "Le vecteur s'agrandit jusqu'à onze éléments", correct: false}
      - {text: "La valeur zéro est renvoyée", correct: false}
    answer: "`operator[]` fait confiance à l'indice. La lecture rend ce qui se trouve en mémoire à cet endroit, ou plante."
  - key: at
    format: course
    question: "Quelle différence entre `v[i]` et `v.at(i)` ?"
    choices:
      - {text: "`at` vérifie l'indice et lance `std::out_of_range` ; `[]` ne vérifie rien", correct: true}
      - {text: "`at` renvoie une copie de l'élément ; `[]` renvoie une référence", correct: false}
      - {text: "`at` compte les indices à partir de 1 ; `[]` à partir de 0", correct: false}
      - {text: "`at` ne vérifie rien ; `[]` vérifie l'indice et lance une exception", correct: false}
    answer: "Les deux renvoient une référence, et comptent à partir de 0. `at()` paie un test pour transformer la faute en exception."
  - key: ecriture
    format: course
    question: "Pourquoi une écriture hors bornes est-elle plus grave encore qu'une lecture ?"
    choices:
      - {text: "Elle modifie une autre donnée, et le programme plante plus tard, ailleurs", correct: true}
      - {text: "Elle agrandit le conteneur, qui consomme alors trop de mémoire", correct: false}
      - {text: "Elle est refusée par le compilateur, alors qu'une lecture compile", correct: false}
      - {text: "Elle ralentit le programme, alors qu'une lecture est immédiate", correct: false}
    answer: "La mémoire voisine appartient à une autre variable, ou aux structures de l'allocateur. Le symptôme apparaît loin de la cause : c'est aussi la base de nombreuses attaques."
  - key: eviter
    format: course
    question: "Quelle façon de parcourir un vecteur ne peut pas sortir de ses bornes ?"
    choices:
      - {text: "La boucle sur un intervalle : `for (int x : v)`", correct: true}
      - {text: "La boucle par indice : `for (i = 0; i <= v.size(); ++i)`", correct: false}
      - {text: "La boucle par pointeur, avancé à chaque tour", correct: false}
      - {text: "La boucle `while (true)` avec un compteur", correct: false}
    answer: "Sans indice, pas d'indice faux. La boucle sur un intervalle et les algorithmes parcourent exactement les éléments du conteneur."
  - key: vf-compilateur
    format: true-false
    question: "Le compilateur refuse `v[10]` quand le vecteur n'a que trois éléments."
    truth: false
    answer: "La taille d'un vecteur n'est connue qu'à l'exécution. Le code compile, et son comportement est indéfini."
  - key: vf-back-vide
    format: true-false
    question: "`v.back()` sur un vecteur vide lance une exception."
    truth: false
    answer: "C'est un comportement indéfini, comme `v.front()` et `v[0]`. On teste `empty()` avant."
  - key: vf-at-exception
    format: true-false
    question: "`v.at(i)` lance `std::out_of_range` quand `i` vaut `v.size()`."
    truth: true
    answer: "Le dernier indice valide est `size() - 1`. `size()` est déjà hors bornes."
  - key: vf-string
    format: true-false
    question: "`std::string` offre aussi la fonction `at()`."
    truth: true
    answer: "Comme `std::vector`, `std::array` et `std::deque`. Elle vérifie l'indice de la même façon."
  - key: qcm-dernier-indice
    format: multiple-choice
    question: "Quel est le dernier indice valide d'un vecteur `v` non vide ?"
    choices:
      - {text: "`v.size() - 1`", correct: true}
      - {text: "`v.size()`", correct: false}
      - {text: "`v.size() + 1`", correct: false}
      - {text: "`v.capacity()`", correct: false}
    answer: "Les indices vont de 0 à `size() - 1`. La capacité est de la mémoire réservée, pas des éléments."
  - key: qcm-exception
    format: multiple-choice
    question: "Quelle exception lance `v.at(99)` sur un vecteur de trois éléments ?"
    choices:
      - {text: "`std::out_of_range`", correct: true}
      - {text: "`std::invalid_argument`", correct: false}
      - {text: "`std::bad_alloc`", correct: false}
      - {text: "`std::length_error`", correct: false}
    answer: "`std::out_of_range`, déclarée dans `<stdexcept>`."
  - key: qcm-outil
    format: multiple-choice
    question: "Quel outil signale un accès hors bornes à l'exécution, avec la ligne fautive ?"
    choices:
      - {text: "AddressSanitizer (`-fsanitize=address`)", correct: true}
      - {text: "L'optimisation `-O2`", correct: false}
      - {text: "Le préprocesseur (`-E`)", correct: false}
      - {text: "L'éditeur de liens (`ld`)", correct: false}
    answer: "AddressSanitizer entoure chaque zone de mémoire de zones interdites, et arrête le programme au premier accès."
  - key: qcm-controler
    format: multiple-choice
    question: "Un indice `i`, de type `std::size_t`, vient d'une saisie. Quel test le valide avant `v[i]` ?"
    choices:
      - {text: "`if (i < v.size())`", correct: true}
      - {text: "`if (i <= v.size())`", correct: false}
      - {text: "`if (i > 0)`", correct: false}
      - {text: "`if (i != v.size())`", correct: false}
    answer: "Un `std::size_t` ne peut pas être négatif : il reste à vérifier qu'il est strictement inférieur à la taille."
  - key: trous-at
    format: fill-in
    question: |-
      Complète pour que l'accès vérifie l'indice :
      ```cpp
      int x = v.___(i);
      ```
    blanks:
      - [at]
    answer: "`at()` lance `std::out_of_range` si l'indice est invalide."
  - key: trous-borne
    format: fill-in
    question: |-
      Complète la condition, pour ne pas dépasser le dernier élément :
      ```cpp
      for (std::size_t i = 0; i ___ v.size(); ++i) {
          std::println("{}", v[i]);
      }
      ```
    blanks:
      - ["<"]
    answer: "Strictement inférieur : `v.size()` n'est pas un indice valide."
  - key: trous-empty
    format: fill-in
    question: |-
      Complète pour ne lire le dernier élément que s'il existe :
      ```cpp
      if (!v.___()) {
          std::println("{}", v.back());
      }
      ```
    blanks:
      - [empty]
    answer: "`back()` sur un vecteur vide est un comportement indéfini : on teste `empty()`."
  - key: trous-out-of-range
    format: fill-in
    question: |-
      Complète le type de l'exception lancée par `at()` :
      ```cpp
      try {
          std::println("{}", v.at(i));
      } catch (const std::___& e) {
          std::println("indice invalide");
      }
      ```
    blanks:
      - [out_of_range]
    answer: "`std::out_of_range`, de l'en-tête `<stdexcept>`."
  - key: code-at
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20, 30};
          try {
              std::print("{} ", v.at(2));
              std::print("{} ", v.at(3));
          } catch (const std::out_of_range&) {
              std::print("hors bornes ");
          }
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "`30 hors bornes 3`", correct: true}
      - {text: "`30 0 3`", correct: false}
      - {text: "`hors bornes 3`", correct: false}
      - {text: "`30 hors bornes 4`", correct: false}
    answer: "`30 hors bornes 3` : l'indice 2 est le dernier valide. `at(3)` lance `std::out_of_range`, attrapée ; le vecteur n'a pas changé."
    check:
      output: "30 hors bornes 3"
  - key: code-string-at
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <stdexcept>
      #include <string>

      int main() {
          const std::string mot = "abc";
          int lus = 0;
          try {
              for (std::size_t i = 0; i <= mot.size(); ++i) {
                  mot.at(i);
                  ++lus;
              }
          } catch (const std::out_of_range&) {
              std::print("arrêt ");
          }
          std::println("{}", lus);
      }
      ```
    choices:
      - {text: "`arrêt 3`", correct: true}
      - {text: "`arrêt 4`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "`3`", correct: false}
    answer: "`arrêt 3` : la condition `<=` fait un tour de trop. Les indices 0, 1 et 2 passent ; `at(3)` lance l'exception."
    check:
      output: "arrêt 3"
  - key: code-array-at
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>
      #include <stdexcept>

      int main() {
          std::array<int, 3> a{1, 2, 3};
          int somme = 0;
          try {
              for (std::size_t i = 0; i < 5; ++i) {
                  somme += a.at(i);
              }
          } catch (const std::out_of_range&) {
              somme += 100;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`106`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`100`", correct: false}
      - {text: "`206`", correct: false}
    answer: "`106` : 1 + 2 + 3 = 6, puis `at(3)` lance l'exception. La boucle s'arrête là ; le `catch` ajoute 100, une seule fois."
    check:
      output: "106"
  - key: code-boucle-intervalle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v;
          int tours = 0;
          for (int x : v) {
              tours += x;
              ++tours;
          }
          v.push_back(7);
          for (int x : v) {
              tours += x;
          }
          std::println("{}", tours);
      }
      ```
    choices:
      - {text: "`7`", correct: true}
      - {text: "`8`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`7` : sur un vecteur vide, la boucle sur un intervalle ne fait aucun tour, et ne lit rien. La seconde boucle lit le seul élément."
    check:
      output: "7"
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Ce programme affiche les trois notes, puis lit après la fin du vecteur. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          for (std::size_t i = 0; i <= notes.size(); ++i) {
              std::println("{}", notes[i]);
          }
      }
      ```
    choices:
      - {text: "Écrire `i < notes.size()` dans la condition", correct: true}
      - {text: "Écrire `i <= notes.size() + 1` dans la condition", correct: false}
      - {text: "Écrire `i = 1` au départ de la boucle", correct: false}
      - {text: "Écrire `i++` à la place de `++i`", correct: false}
    answer: |-
      ```cpp
      for (std::size_t i = 0; i < notes.size(); ++i) {
      ```
      `notes.size()` vaut 3, et `notes[3]` n'existe pas. C'est l'erreur d'une unité. Une boucle sur un intervalle,
      `for (int note : notes)`, ne peut pas la commettre.
  - key: bug-conteneur-vide
    format: bug-fix
    question: |-
      Cette fonction a un comportement indéfini quand le vecteur est vide. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int dernier(const std::vector<int>& v) {
          return v[v.size() - 1];
      }

      int main() {
          std::println("{}", dernier({}));
      }
      ```
    choices:
      - {text: "Tester `v.empty()` d'abord, et renvoyer un `std::optional<int>` vide dans ce cas", correct: true}
      - {text: "Écrire `return v[v.size()];` à la place de `v[v.size() - 1]`", correct: false}
      - {text: "Écrire `return v.back();` à la place de `v[v.size() - 1]`", correct: false}
      - {text: "Écrire `return v.front();` à la place de `v[v.size() - 1]`", correct: false}
    answer: |-
      ```cpp
      std::optional<int> dernier(const std::vector<int>& v) {
          if (v.empty()) {
              return std::nullopt;
          }
          return v.back();
      }
      ```
      Sur un vecteur vide, `size() - 1` reboucle vers un nombre énorme, non signé. `back()` et `front()` y sont
      tout aussi indéfinis. Il n'y a pas de dernier élément : le type de retour doit pouvoir le dire.
  - key: bug-indice-non-controle
    format: bug-fix
    question: |-
      Ce programme lit un indice venu de l'extérieur, et s'en sert sans contrôle. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> prix{5, 8, 13};
          const std::size_t choix = 7;
          std::println("{}", prix[choix]);
      }
      ```
    choices:
      - {text: "N'afficher `prix[choix]` que si `choix < prix.size()`", correct: true}
      - {text: "N'afficher `prix[choix]` que si `choix != 0`", correct: false}
      - {text: "Déclarer `choix` avec le type `int`", correct: false}
      - {text: "Appeler `prix.reserve(8);` avant l'affichage", correct: false}
    answer: |-
      ```cpp
      if (choix < prix.size()) {
          std::println("{}", prix[choix]);
      } else {
          std::println("choix invalide");
      }
      ```
      Tout indice qui vient d'une saisie, d'un fichier ou du réseau se contrôle. `reserve` alloue de la place, sans
      créer d'élément : l'accès resterait indéfini.
  - key: bug-crochets-pour-ajouter
    format: bug-fix
    question: |-
      Ce programme veut remplir un vecteur vide avec trois carrés. Il écrit hors bornes. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> carres;
          for (int i = 0; i < 3; ++i) {
              carres[i] = i * i;
          }
          std::println("{}", carres.size());
      }
      ```
    choices:
      - {text: "Écrire `carres.push_back(i * i);`", correct: true}
      - {text: "Écrire `carres.at(i) = i * i;`", correct: false}
      - {text: "Écrire `carres[i + 1] = i * i;`", correct: false}
      - {text: "Écrire `carres.reserve(3);` avant la boucle", correct: false}
    answer: |-
      ```cpp
      carres.push_back(i * i);
      ```
      `operator[]` n'ajoute pas d'élément : sur un vecteur vide, tout indice est hors bornes. `at()` lancerait une
      exception, sans rien remplir. `push_back` agrandit le vecteur.
  - key: situation-plantage-lointain
    format: scenario
    question: |-
      Un programme plante de temps en temps dans une fonction qui n'a rien de suspect : une simple addition sur une
      structure. Le débogueur montre des valeurs absurdes dans cette structure. Que soupçonnes-tu ?
    choices:
      - {text: "Une écriture hors bornes, ailleurs, qui a écrasé la mémoire de cette structure", correct: true}
      - {text: "Une erreur d'arrondi dans l'addition, qui s'accumule avec le temps", correct: false}
      - {text: "Un défaut du débogueur, qui affiche mal les valeurs de la structure", correct: false}
      - {text: "Une exception lancée par l'addition, et attrapée trop tard", correct: false}
    answer: |-
      Une écriture hors bornes ne plante pas là où elle a lieu : elle abîme une donnée voisine, qui fait échouer
      plus tard un code innocent. AddressSanitizer arrête le programme à l'écriture fautive, pas à ses
      conséquences.
  - key: situation-securite
    format: scenario
    question: |-
      Un serveur lit dans chaque message un champ « longueur », puis recopie autant d'octets du message dans un
      tampon de 256 octets. Un auditeur signale une faille. Laquelle ?
    choices:
      - {text: "Une longueur supérieure à 256 fait écrire hors du tampon : il faut la contrôler", correct: true}
      - {text: "Un tampon de 256 octets est trop petit pour la moindre adresse réseau", correct: false}
      - {text: "La recopie d'octets est plus lente que la lecture directe du message", correct: false}
      - {text: "Le champ « longueur » devrait être chiffré avant d'être lu", correct: false}
    answer: |-
      C'est le dépassement de tampon classique : une valeur fournie par l'attaquant sert d'indice ou de taille sans
      contrôle. Il écrit alors où il veut dans la mémoire du serveur. Toute donnée extérieure se valide avant de
      servir de borne.
  - key: situation-at-partout
    format: scenario
    question: |-
      Après un bug d'indice, un collègue propose de remplacer tous les `v[i]` du projet par `v.at(i)`. Qu'en
      penses-tu ?
    choices:
      - {text: "Mieux vaut des boucles sur un intervalle et des indices contrôlés ; `at` là où l'indice est incertain", correct: true}
      - {text: "C'est la bonne solution : `at` rend impossible toute erreur d'indice dans le programme", correct: false}
      - {text: "C'est inutile : `operator[]` vérifie déjà l'indice quand on compile sans optimisation", correct: false}
      - {text: "C'est dangereux : `at` renvoie une copie, et les modifications seraient perdues", correct: false}
    answer: |-
      `at` transforme la faute en exception : le bug est toujours là, mais il se voit. La vraie correction est de
      ne pas fabriquer d'indice faux. Pour attraper les erreurs restantes sans toucher au code, on teste avec
      AddressSanitizer ou `-D_GLIBCXX_ASSERTIONS`.
  - key: situation-tableau-brut
    format: scenario
    question: |-
      Une fonction reçoit `int* donnees`, et parcourt dix éléments. Certains appelants lui passent un tableau de
      huit. Comment changes-tu la signature pour que la taille ne puisse plus être fausse ?
    choices:
      - {text: "Recevoir un `std::span<int>`, qui transporte le pointeur et la taille ensemble", correct: true}
      - {text: "Recevoir un `int**`, qui désigne le pointeur de l'appelant", correct: false}
      - {text: "Recevoir un `void*`, qui accepte n'importe quel tableau", correct: false}
      - {text: "Recevoir un `int&`, qui désigne le premier élément", correct: false}
    answer: |-
      Un pointeur seul ne connaît pas la taille de ce qu'il désigne. `std::span` (C++20) se construit depuis un
      tableau, un `std::array` ou un `std::vector`, et offre `size()` : la fonction parcourt ce qu'on lui donne
      vraiment.
