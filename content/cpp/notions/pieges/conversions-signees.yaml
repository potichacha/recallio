notion: conversions-signees
lesson: |-
  Les entiers **non signés** (`unsigned`, `std::size_t`) ne peuvent pas être négatifs : sous zéro, ils
  **rebouclent** vers leur maximum. C'est un comportement **défini**, et c'est justement ce qui le rend
  sournois : aucun outil ne le signale comme une faute.

  ```cpp
  unsigned n = 0;
  --n;                // 4294967295, sans erreur
  ```

  Or `size()` de tous les conteneurs renvoie un **`std::size_t`**, non signé. Trois pièges en découlent.

  **1. Comparer un signé et un non signé.** Avant la comparaison, le signé est **converti en non signé**. Un
  nombre négatif devient un nombre énorme.

  ```cpp
  int i = -1;
  std::vector<int> v{1, 2, 3};
  if (i < v.size()) { /* jamais exécuté */ }     // -1 devient 18446744073709551615
  ```

  GCC le signale avec `-Wall` : « comparison of integer expressions of different signedness ».

  **2. `size() - 1` sur un conteneur vide.**

  ```cpp
  for (std::size_t i = 0; i <= v.size() - 1; ++i) { ... }
  ```

  Si `v` est vide, `0 - 1` reboucle : la boucle court jusqu'à un indice gigantesque, hors bornes dès le premier
  tour. La forme sûre est `i < v.size()`, ou `i + 1 <= v.size()`.

  **3. La boucle descendante.**

  ```cpp
  for (std::size_t i = v.size() - 1; i >= 0; --i) { ... }    // i >= 0 est toujours vrai
  ```

  Un non signé est toujours positif ou nul : la boucle ne s'arrête jamais, et lit hors bornes après zéro.

  **Les remèdes.**

  | Besoin | Écriture sûre |
  |---|---|
  | Parcourir | `for (int x : v)` : pas d'indice du tout |
  | Parcourir à l'envers | `for (auto it = v.rbegin(); it != v.rend(); ++it)`, ou `std::views::reverse` |
  | Une taille signée | `std::ssize(v)` (C++20), qui renvoie un entier signé |
  | Comparer un signé et un non signé | `std::cmp_less(i, v.size())` (C++20), mathématiquement juste |
  | Boucle descendante par indice | `for (std::size_t i = v.size(); i-- > 0;)` |
  | Une différence de tailles | tester d'abord laquelle est la plus grande |

  **La règle pratique.** Utiliser des entiers **signés** pour tout ce qui se calcule (différences, compteurs qui
  descendent), et ne pas mélanger les deux familles dans une même expression. Compiler avec `-Wall -Wextra`, et
  traiter l'avertissement de signe comme une erreur.

  **L'autre sens.** Convertir un grand non signé en signé (`int n = v.size();`) tronque la valeur si elle dépasse
  `INT_MAX` : peu probable pour une taille, mais GCC le signale avec `-Wconversion`. Et le **débordement d'un
  signé**, lui, est un comportement indéfini.

  **En entretien** : « `size()` est non signé. Comparé à un `int` négatif, celui-ci devient énorme ; et
  `size() - 1` sur un conteneur vide reboucle. J'évite les indices avec les boucles sur un intervalle, et sinon
  `std::ssize` ou `std::cmp_less`. »
cards:
  - key: rebouclage
    format: course
    question: "Que vaut un `unsigned int` qui vaut 0, après `--n` ?"
    choices:
      - {text: "Le plus grand `unsigned int` : il reboucle, et c'est un comportement défini", correct: true}
      - {text: "`-1` : un entier non signé devient signé dès qu'il passe sous zéro", correct: false}
      - {text: "`0` : un entier non signé reste bloqué à sa valeur minimale", correct: false}
      - {text: "Rien de garanti : c'est un comportement indéfini, comme pour un `int`", correct: false}
    answer: "L'arithmétique non signée est modulaire : 0 - 1 donne 4294967295 sur 32 bits. Le débordement d'un entier signé, lui, est indéfini."
  - key: comparaison-mixte
    format: course
    question: "Que se passe-t-il quand on compare un `int` négatif à un `std::size_t` ?"
    choices:
      - {text: "L'`int` est converti en non signé, et devient un nombre énorme", correct: true}
      - {text: "Le `std::size_t` est converti en signé, et la comparaison est juste", correct: false}
      - {text: "Le compilateur refuse la comparaison, avec une erreur", correct: false}
      - {text: "Les deux sont convertis en `double`, et la comparaison est juste", correct: false}
    answer: "`-1 < v.size()` est donc faux. Le compilateur accepte le code ; avec `-Wall`, il avertit seulement."
  - key: size-moins-un
    format: course
    question: "Que vaut `v.size() - 1` quand le vecteur `v` est vide ?"
    choices:
      - {text: "Le plus grand `std::size_t` : la soustraction reboucle", correct: true}
      - {text: "`-1`, de type `int`", correct: false}
      - {text: "`0` : une taille ne descend pas sous zéro", correct: false}
      - {text: "Une exception `std::out_of_range`", correct: false}
    answer: "`size()` est non signé : 0 - 1 donne 18446744073709551615 sur 64 bits. Une boucle bornée par cette valeur lit hors bornes aussitôt."
  - key: remede
    format: course
    question: "Quelle fonction de C++20 renvoie la taille d'un conteneur sous forme d'entier signé ?"
    choices:
      - {text: "`std::ssize`", correct: true}
      - {text: "`std::size`", correct: false}
      - {text: "`std::abs`", correct: false}
      - {text: "`std::signed_size`", correct: false}
    answer: "`std::ssize(v)` renvoie un entier signé : `std::ssize(v) - 1` vaut bien -1 sur un vecteur vide, et se compare sans surprise à un `int`."
  - key: vf-size-type
    format: true-false
    question: "`v.size()` renvoie un entier non signé."
    truth: true
    answer: "C'est un `std::size_t`. Tous les conteneurs standard font de même."
  - key: vf-toujours-positif
    format: true-false
    question: "La condition `i >= 0` peut être fausse quand `i` est un `std::size_t`."
    truth: false
    answer: "Un non signé est toujours positif ou nul. Une boucle descendante bornée par `i >= 0` ne s'arrête donc jamais."
  - key: vf-ub
    format: true-false
    question: "Le rebouclage d'un entier non signé est un comportement indéfini."
    truth: false
    answer: "Il est parfaitement défini : c'est une arithmétique modulo 2ⁿ. C'est le débordement d'un entier signé qui est indéfini."
  - key: vf-avertissement
    format: true-false
    question: "Avec `-Wall`, GCC avertit quand on compare un `int` et un `std::size_t`."
    truth: true
    answer: "L'avertissement est `-Wsign-compare`. Sans `-Wall`, le code compile en silence."
  - key: qcm-comparaison-juste
    format: multiple-choice
    question: "Quelle expression compare correctement un `int i`, peut-être négatif, à la taille de `v` ?"
    choices:
      - {text: "`std::cmp_less(i, v.size())`", correct: true}
      - {text: "`i < v.size()`", correct: false}
      - {text: "`static_cast<std::size_t>(i) < v.size()`", correct: false}
      - {text: "`i - v.size() < 0`", correct: false}
    answer: "`std::cmp_less` (C++20, `<utility>`) compare les valeurs mathématiques. Les trois autres convertissent le signé en non signé."
  - key: qcm-boucle-inverse
    format: multiple-choice
    question: "Quelle boucle parcourt un vecteur à l'envers sans risque de rebouclage ?"
    choices:
      - {text: "`for (auto it = v.rbegin(); it != v.rend(); ++it)`", correct: true}
      - {text: "`for (std::size_t i = v.size() - 1; i >= 0; --i)`", correct: false}
      - {text: "`for (std::size_t i = v.size(); i >= 0; --i)`", correct: false}
      - {text: "`for (unsigned i = v.size() - 1; i > -1; --i)`", correct: false}
    answer: "Les itérateurs inversés n'ont pas d'indice. Avec un indice non signé, `i >= 0` est toujours vrai, et `i > -1` compare à un nombre énorme."
  - key: qcm-borne-sure
    format: multiple-choice
    question: "Quelle condition de boucle reste correcte quand le vecteur est vide ?"
    choices:
      - {text: "`i < v.size()`", correct: true}
      - {text: "`i <= v.size() - 1`", correct: false}
      - {text: "`i != v.size() - 1`", correct: false}
      - {text: "`i < v.size() - 1 + 1 - 1`", correct: false}
    answer: "`i < v.size()` ne soustrait rien. Dès qu'on écrit `size() - 1`, un vecteur vide fait reboucler la borne."
  - key: qcm-difference
    format: multiple-choice
    question: "`a` et `b` sont deux `std::vector`. Que vaut `a.size() - b.size()` quand `a` a 2 éléments et `b` en a 5 ?"
    choices:
      - {text: "Un nombre énorme, non signé", correct: true}
      - {text: "`-3`, de type `int`", correct: false}
      - {text: "`3` : la valeur absolue", correct: false}
      - {text: "`0` : le minimum possible", correct: false}
    answer: "La différence de deux non signés est non signée : 2 - 5 reboucle. Pour un écart signé, on convertit d'abord, ou l'on utilise `std::ssize`."
  - key: code-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          const int i = -1;
          std::println("{} {}", i < static_cast<int>(v.size()), std::cmp_less(i, v.size()));
      }
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`true true` : converti en `int`, la taille vaut 3, et -1 < 3. `std::cmp_less` compare les valeurs mathématiques, sans conversion piégeuse."
    check:
      output: "true true"
  - key: code-rebouclage
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v;
          std::println("{} {}", v.size() - 1 > 1000, std::ssize(v) - 1);
      }
      ```
    choices:
      - {text: "`true -1`", correct: true}
      - {text: "`false -1`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "`false 0`", correct: false}
    answer: "`true -1` : `size() - 1` reboucle vers un nombre énorme, bien supérieur à 1000. `std::ssize` est signé : 0 - 1 vaut -1."
    check:
      output: "true -1"
  - key: code-unsigned
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          unsigned a = 3;
          unsigned b = 5;
          const int c = 3;
          const int d = 5;
          std::println("{} {}", a - b > 0, c - d > 0);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : en non signé, 3 - 5 reboucle vers un grand nombre positif. En signé, il vaut -2."
    check:
      output: "true false"
  - key: code-boucle-descendante
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          for (std::size_t i = v.size(); i-- > 0;) {
              std::print("{} ", v[i]);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`30 20 10 fin`", correct: true}
      - {text: "`10 20 30 fin`", correct: false}
      - {text: "`30 20 fin`", correct: false}
      - {text: "`20 10 fin`", correct: false}
    answer: "`30 20 10 fin` : `i-- > 0` teste `i` avant de le décrémenter. Le corps voit 2, 1, 0 ; au dernier test, `i` vaut 0 et la boucle s'arrête."
    check:
      output: "30 20 10 fin"
  - key: bug-boucle-infinie
    format: bug-fix
    question: |-
      Cette boucle devrait afficher les éléments à l'envers. Elle ne s'arrête jamais, et finit par lire hors
      bornes. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30};
          for (std::size_t i = v.size() - 1; i >= 0; --i) {
              std::println("{}", v[i]);
          }
      }
      ```
    choices:
      - {text: "Parcourir avec `for (auto it = v.rbegin(); it != v.rend(); ++it)`", correct: true}
      - {text: "Écrire la condition `i > -1` à la place de `i >= 0`", correct: false}
      - {text: "Écrire la condition `i != v.size()` à la place de `i >= 0`", correct: false}
      - {text: "Déclarer `i` avec le type `unsigned long`", correct: false}
    answer: |-
      ```cpp
      for (auto it = v.rbegin(); it != v.rend(); ++it) {
          std::println("{}", *it);
      }
      ```
      `i` est non signé : `i >= 0` est toujours vrai, et après 0, `--i` reboucle vers un indice énorme. Les
      itérateurs inversés n'ont pas ce piège.
  - key: bug-size-moins-un
    format: bug-fix
    question: |-
      Cette fonction compare chaque élément au suivant. Sur un vecteur vide, elle lit hors bornes. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      bool est_trie(const std::vector<int>& v) {
          for (std::size_t i = 0; i < v.size() - 1; ++i) {
              if (v[i] > v[i + 1]) {
                  return false;
              }
          }
          return true;
      }

      int main() {
          std::println("{}", est_trie({}));
      }
      ```
    choices:
      - {text: "Écrire la condition `i + 1 < v.size()`", correct: true}
      - {text: "Écrire la condition `i <= v.size() - 1`", correct: false}
      - {text: "Écrire la condition `i < v.size() - 2`", correct: false}
      - {text: "Écrire la condition `i - 1 < v.size()`", correct: false}
    answer: |-
      ```cpp
      for (std::size_t i = 0; i + 1 < v.size(); ++i) {
      ```
      Sur un vecteur vide, `v.size() - 1` reboucle vers un nombre énorme : la boucle démarre, et lit `v[0]`. En
      ajoutant plutôt qu'en soustrayant, rien ne passe sous zéro. `std::is_sorted` fait ce travail.
  - key: bug-comparaison-mixte
    format: bug-fix
    question: |-
      Ce programme devrait afficher `valide` : -1 est plus petit que la taille. Il affiche `invalide`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> v{1, 2, 3};
          const int position = -1;
          if (position < v.size()) {
              std::println("valide");
          } else {
              std::println("invalide");
          }
      }
      ```
    choices:
      - {text: "Écrire `std::cmp_less(position, v.size())`", correct: true}
      - {text: "Écrire `position < v.size() - 0`", correct: false}
      - {text: "Écrire `position <= v.size()`", correct: false}
      - {text: "Écrire `(unsigned)position < v.size()`", correct: false}
    answer: |-
      ```cpp
      if (std::cmp_less(position, v.size())) {
      ```
      `position` est converti en non signé avant la comparaison : -1 devient le plus grand `std::size_t`.
      `std::cmp_less` compare les valeurs réelles. Comparer à `std::ssize(v)` conviendrait aussi.
  - key: bug-difference
    format: bug-fix
    question: |-
      Ce programme devrait afficher `-3`, l'écart entre les deux tailles. Il affiche un nombre énorme. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<int> a{1, 2};
          const std::vector<int> b{1, 2, 3, 4, 5};
          const auto ecart = a.size() - b.size();
          std::println("{}", ecart);
      }
      ```
    choices:
      - {text: "Écrire `std::ssize(a) - std::ssize(b)`", correct: true}
      - {text: "Écrire `b.size() - a.size()`", correct: false}
      - {text: "Écrire `a.size() - b.size() + 0`", correct: false}
      - {text: "Écrire `std::size(a) - std::size(b)`", correct: false}
    answer: |-
      ```cpp
      const auto ecart = std::ssize(a) - std::ssize(b);
      ```
      La différence de deux `std::size_t` est un `std::size_t` : 2 - 5 reboucle. `std::ssize` renvoie des entiers
      signés, dont la différence vaut bien -3. `std::size` est non signé, comme `size()`.
  - key: situation-avertissement
    format: scenario
    question: |-
      Un projet compile avec des centaines d'avertissements « comparison of integer expressions of different
      signedness », que l'équipe ignore depuis toujours. Un bug de boucle vient d'atteindre la production. Que
      proposes-tu ?
    choices:
      - {text: "Corriger ces avertissements, puis compiler avec `-Werror` pour qu'il n'en revienne pas", correct: true}
      - {text: "Désactiver cet avertissement, puisqu'il est trop fréquent pour être utile", correct: false}
      - {text: "Compiler sans `-Wall`, pour que la sortie du compilateur soit lisible", correct: false}
      - {text: "Convertir chaque opérande en `unsigned`, pour faire taire le compilateur", correct: false}
    answer: |-
      Chacun de ces avertissements est un bug possible, noyé dans les autres. Les corriger un par un (boucles sur
      un intervalle, `std::ssize`, `std::cmp_less`), puis interdire leur retour, est le seul moyen de revoir celui
      qui compte. Un cast aveugle garde le bug et cache l'alerte.
  - key: situation-derniers-elements
    format: scenario
    question: |-
      Une fonction affiche les `n` derniers éléments d'un vecteur, avec
      `for (std::size_t i = v.size() - n; i < v.size(); ++i)`. Quand `n` dépasse la taille, elle n'affiche rien,
      au lieu de tout afficher. Pourquoi ?
    choices:
      - {text: "`v.size() - n` reboucle vers un nombre énorme : la condition est fausse dès le départ", correct: true}
      - {text: "`v.size() - n` vaut un nombre négatif, que `std::size_t` ramène toujours à zéro", correct: false}
      - {text: "`i < v.size()` compare un signé à un non signé, ce qui inverse le résultat", correct: false}
      - {text: "`++i` déborde dès le premier tour, ce qui arrête la boucle aussitôt", correct: false}
    answer: |-
      La soustraction se fait en non signé : 3 - 5 ne vaut pas -2, mais un nombre gigantesque. On calcule le départ
      sans passer sous zéro : `n < v.size() ? v.size() - n : 0`.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, tu lis `for (unsigned i = n - 1; i >= 0; --i)`. L'auteur dit : « un indice n'est jamais
      négatif, donc `unsigned` est le bon type ». Que réponds-tu ?
    choices:
      - {text: "Qu'un compteur qui descend doit pouvoir passer sous zéro pour s'arrêter : il faut un type signé", correct: true}
      - {text: "Qu'il a raison, et que la boucle s'arrête bien quand `i` atteint zéro", correct: false}
      - {text: "Qu'il faut `unsigned long` à la place de `unsigned`, pour les grands tableaux", correct: false}
      - {text: "Qu'il faut écrire `i > -1` à la place de `i >= 0`, plus rapide", correct: false}
    answer: |-
      `i >= 0` est toujours vrai pour un non signé : après 0, `--i` reboucle. « Jamais négatif » décrit les valeurs
      valides, pas celles par lesquelles passe le calcul. Un `int`, ou des itérateurs inversés, règlent la
      question.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te montre `if (v.size() - 1 < 0) return;` censé détecter un vecteur vide, et on te demande
      ce qui ne va pas. Que réponds-tu ?
    choices:
      - {text: "Que `size() - 1` est non signé : il n'est jamais négatif. On écrit `if (v.empty())`", correct: true}
      - {text: "Que le test est juste, mais qu'il faudrait des accolades autour du `return`", correct: false}
      - {text: "Que `size()` peut lancer une exception sur un vecteur vide", correct: false}
      - {text: "Que le test devrait comparer à `-1` plutôt qu'à `0`", correct: false}
    answer: |-
      Sur un vecteur vide, `size() - 1` reboucle vers le plus grand `std::size_t` : la condition est toujours
      fausse. GCC le signale d'ailleurs (« comparison of unsigned expression in '< 0' is always false »). `empty()`
      dit l'intention, sans arithmétique.
