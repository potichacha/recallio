notion: auto-pieges
lesson: |-
  `auto` demande au compilateur de déduire le type d'une variable d'après son initialisation. C'est commode, et
  presque toujours juste. « Presque » : la déduction suit des règles précises, qui ne donnent pas toujours le type
  qu'on a en tête.

  **Piège 1 : `auto` retire la référence et le `const`.** `auto` seul déduit toujours un type **valeur** : la
  variable est une **copie**.

  ```cpp
  std::vector<std::string> noms{"Ada", "Alan"};

  auto premier = noms[0];          // std::string : une copie
  premier = "Grace";               // noms[0] ne change pas

  auto& vrai_premier = noms[0];    // std::string& : l'élément lui-même
  const auto& lecture = noms[0];   // lecture seule, sans copie
  ```

  Même chose dans une boucle : `for (auto x : v)` copie chaque élément, et les modifications sont perdues.

  | Écriture | Type déduit depuis un `const std::string&` |
  |---|---|
  | `auto x` | `std::string` (copie modifiable) |
  | `auto& x` | `const std::string&` |
  | `const auto& x` | `const std::string&` |
  | `decltype(auto) x` | `const std::string&` : le type exact de l'expression |

  **Piège 2 : les proxys.** Certaines expressions ne rendent pas le type qu'on croit, mais un objet intermédiaire
  qui **se fait passer** pour lui. Le cas célèbre est `std::vector<bool>`, qui range ses booléens bit par bit :
  `v[0]` ne peut pas rendre un `bool&`, et rend un petit objet **proxy** qui désigne le bit.

  ```cpp
  std::vector<bool> options{false};

  auto copie = options[0];     // PAS un bool : un proxy lié au vecteur
  options[0] = true;
  // copie vaut maintenant true ; et si le vecteur réalloue, copie est pendante
  ```

  Le remède : écrire le type voulu, `bool copie = options[0];`. La conversion fait alors une vraie copie.

  **Piège 3 : les littéraux.** `auto` prend le type du littéral, pas celui qu'on imagine.

  ```cpp
  auto nom = "Ada";       // const char*, pas std::string
  auto total = 0;         // int : total += 2.5 tronque
  auto ratio = 1 / 2;     // int, qui vaut 0
  ```

  On écrit le type, ou un littéral du bon type : `std::string{"Ada"}`, `"Ada"s`, `0.0`.

  **Piège 4 : les accolades.** `auto x = {3};` déduit une `std::initializer_list<int>`.

  **Piège 5 : les types non signés.** `auto n = v.size();` est un `std::size_t` : `n - 1` reboucle si `n` vaut 0.

  **Piège 6 : le type caché.** Avec `auto resultat = calculer();`, le lecteur ne voit pas le type. Si `calculer`
  change de type de retour, le code compile toujours, avec un autre sens. On garde `auto` quand le type est
  **évident** à droite, ou sans intérêt (itérateurs, lambdas).

  **Les réflexes.**

  - Pour lire sans copier : **`const auto&`**.
  - Pour modifier l'original : **`auto&`**.
  - Pour une copie voulue : `auto`, en le sachant.
  - Avec `std::vector<bool>`, ou un calcul sur des littéraux : écrire le type.

  **En entretien** : « `auto` déduit un type valeur : il retire `const` et la référence, donc il copie. J'écris
  `const auto&` ou `auto&` selon le besoin. Je me méfie des proxys comme ceux de `std::vector<bool>`, et des
  littéraux : `auto x = 0` est un `int`, `auto s = \"...\"` un `const char*`. »
cards:
  - key: copie
    format: course
    question: "`v` est un `std::vector<std::string>`. Que déclare `auto premier = v[0];` ?"
    choices:
      - {text: "Une `std::string` indépendante : une copie du premier élément", correct: true}
      - {text: "Une référence vers le premier élément du vecteur", correct: false}
      - {text: "Un pointeur vers le premier élément du vecteur", correct: false}
      - {text: "Un itérateur placé sur le premier élément du vecteur", correct: false}
    answer: "`v[0]` rend une référence, mais `auto` seul déduit un type valeur. Modifier `premier` ne touche pas au vecteur."
  - key: proxy
    format: course
    question: "Pourquoi `auto b = drapeaux[0];` ne donne-t-il pas un `bool`, quand `drapeaux` est un `std::vector<bool>` ?"
    choices:
      - {text: "`operator[]` y renvoie un objet proxy qui désigne un bit, et `auto` déduit ce type", correct: true}
      - {text: "`auto` déduit toujours `int` quand l'expression est un booléen", correct: false}
      - {text: "`std::vector<bool>` range des `char`, que `auto` ne convertit pas", correct: false}
      - {text: "`operator[]` y renvoie une copie constante, que `auto` refuse", correct: false}
    answer: "Les booléens y sont rangés bit par bit, et l'on ne peut pas prendre la référence d'un bit. Le proxy reste lié au vecteur : il change avec lui, et devient pendant s'il réalloue."
  - key: litteraux
    format: course
    question: "Quel est le type de `nom` dans `auto nom = \"Ada\";` ?"
    choices:
      - {text: "`const char*`", correct: true}
      - {text: "`std::string`", correct: false}
      - {text: "`std::string_view`", correct: false}
      - {text: "`char`", correct: false}
    answer: "Un littéral de chaîne est un tableau de `char` constants, qui devient un pointeur. Pour une `std::string` : `std::string nom = \"Ada\";`, ou le littéral `\"Ada\"s`."
  - key: reflexes
    format: course
    question: "Quelle écriture lit un élément d'un conteneur sans le copier ni permettre de le modifier ?"
    choices:
      - {text: "`const auto& x = v[0];`", correct: true}
      - {text: "`auto x = v[0];`", correct: false}
      - {text: "`const auto x = v[0];`", correct: false}
      - {text: "`auto* x = v[0];`", correct: false}
    answer: "Le `&` évite la copie, le `const` interdit la modification. `const auto x` copie quand même, dans une constante."
  - key: vf-const
    format: true-false
    question: "Avec `const int c = 5; auto x = c;`, la variable `x` est constante."
    truth: false
    answer: "`auto` retire le `const` de premier niveau : `x` est un `int` modifiable. Pour une constante : `const auto x = c;`."
  - key: vf-auto-ref
    format: true-false
    question: "`auto& x = v[0];` lie `x` à l'élément du vecteur, sans le copier."
    truth: true
    answer: "Avec `&`, `auto` déduit une référence. Modifier `x` modifie l'élément."
  - key: vf-zero
    format: true-false
    question: "`auto total = 0;` déclare un `double`."
    truth: false
    answer: "Le littéral `0` est un `int`. Y additionner des `double` tronque à chaque affectation. On écrit `0.0`."
  - key: vf-vector-int
    format: true-false
    question: "Sur un `std::vector<int>`, `auto x = v[0];` donne bien un `int`."
    truth: true
    answer: "Le piège du proxy ne concerne que `std::vector<bool>`, et quelques bibliothèques de calcul. Pour un `int`, `auto` fait une copie ordinaire."
  - key: qcm-boucle-modifier
    format: multiple-choice
    question: "Quelle boucle double chaque élément du vecteur `v` ?"
    choices:
      - {text: "`for (auto& x : v) { x *= 2; }`", correct: true}
      - {text: "`for (auto x : v) { x *= 2; }`", correct: false}
      - {text: "`for (const auto& x : v) { x *= 2; }`", correct: false}
      - {text: "`for (const auto x : v) { x *= 2; }`", correct: false}
    answer: "Seule la référence non constante atteint l'élément. `auto x` double une copie ; les versions `const` ne compilent pas."
  - key: qcm-decltype-auto
    format: multiple-choice
    question: "Quelle déclaration garde exactement le type de l'expression, référence et `const` compris ?"
    choices:
      - {text: "`decltype(auto) x = expression;`", correct: true}
      - {text: "`auto x = expression;`", correct: false}
      - {text: "`const auto x = expression;`", correct: false}
      - {text: "`auto* x = expression;`", correct: false}
    answer: "`decltype(auto)` déduit le type déclaré de l'expression, sans rien retirer. Utile dans le code générique."
  - key: qcm-division
    format: multiple-choice
    question: "Que vaut `ratio` après `auto ratio = 1 / 2;` ?"
    choices:
      - {text: "`0`, de type `int`", correct: true}
      - {text: "`0.5`, de type `double`", correct: false}
      - {text: "`0.5`, de type `float`", correct: false}
      - {text: "`1`, de type `int`", correct: false}
    answer: "Les deux opérandes sont des `int` : la division est entière, et `auto` déduit `int`. Pour 0.5 : `1.0 / 2`."
  - key: qcm-vector-bool
    format: multiple-choice
    question: "Comment obtiens-tu une vraie copie du premier booléen d'un `std::vector<bool> v` ?"
    choices:
      - {text: "`bool b = v[0];`", correct: true}
      - {text: "`auto b = v[0];`", correct: false}
      - {text: "`auto& b = v[0];`", correct: false}
      - {text: "`decltype(auto) b = v[0];`", correct: false}
    answer: "Écrire `bool` convertit le proxy en booléen. `auto` garderait le proxy ; `auto&` ne compile pas, car le proxy est un temporaire."
  - key: code-copie-ou-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          auto premier = v[0];
          premier = 9;
          auto& second = v[1];
          second = 9;
          std::println("{} {}", v[0], v[1]);
      }
      ```
    choices:
      - {text: "`1 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`9 2`", correct: false}
    answer: "`1 9` : `premier` est une copie, la modifier ne change pas le vecteur. `second` est une référence vers `v[1]`."
    check:
      output: "1 9"
  - key: code-vector-bool
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> drapeaux{false, false};
          auto drapeau = drapeaux[0];
          drapeau = true;

          std::vector<int> nombres{0, 0};
          auto nombre = nombres[0];
          nombre = 1;

          const bool premier = drapeaux[0];
          std::println("{} {}", premier, nombres[0]);
      }
      ```
    choices:
      - {text: "`true 0`", correct: true}
      - {text: "`false 0`", correct: false}
      - {text: "`true 1`", correct: false}
      - {text: "`false 1`", correct: false}
    answer: "`true 0` : pour `std::vector<bool>`, `auto` déduit un proxy lié au vecteur : l'affecter modifie le bit d'origine. Pour un `std::vector<int>`, `auto` donne une copie."
    check:
      output: "true 0"
  - key: code-boucle
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          for (auto x : v) {
              x *= 10;
          }
          const int avant = v[0];
          for (auto& x : v) {
              x *= 10;
          }
          std::println("{} {}", avant, v[0]);
      }
      ```
    choices:
      - {text: "`1 10`", correct: true}
      - {text: "`10 100`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`10 10`", correct: false}
    answer: "`1 10` : la première boucle multiplie des copies, le vecteur ne change pas. La seconde, avec `auto&`, modifie les éléments."
    check:
      output: "1 10"
  - key: code-litteraux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          auto total = 0;
          total += 2.5;
          total += 2.5;
          auto juste = 0.0;
          juste += 2.5;
          juste += 2.5;
          std::println("{} {}", total, juste);
      }
      ```
    choices:
      - {text: "`4 5`", correct: true}
      - {text: "`5 5`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "`5 4`", correct: false}
    answer: "`4 5` : `total` est un `int`. Chaque addition est tronquée : 0 + 2.5 donne 2, puis 2 + 2.5 donne 4. `juste` est un `double`, et vaut 5."
    check:
      output: "4 5"
  - key: bug-boucle-copie
    format: bug-fix
    question: |-
      Ce programme devrait augmenter chaque prix de 10 et afficher `15`. Il affiche `5`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> prix{5, 8};
          for (auto p : prix) {
              p += 10;
          }
          std::println("{}", prix[0]);
      }
      ```
    choices:
      - {text: "Écrire `for (auto& p : prix)`", correct: true}
      - {text: "Écrire `for (const auto& p : prix)`", correct: false}
      - {text: "Écrire `for (const auto p : prix)`", correct: false}
      - {text: "Écrire `for (int p : prix)`", correct: false}
    answer: |-
      ```cpp
      for (auto& p : prix) {
          p += 10;
      }
      ```
      `auto p` est une copie de chaque élément : c'est elle qui est augmentée, puis jetée. Avec `&`, `p` est
      l'élément lui-même.
  - key: bug-proxy
    format: bug-fix
    question: |-
      Ce programme veut garder l'ancienne valeur de l'option, `false`, avant de la changer. Il affiche `true`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<bool> options{false};
          auto ancienne = options[0];
          options[0] = true;
          const bool valeur = ancienne;
          std::println("{}", valeur);
      }
      ```
    choices:
      - {text: "Écrire `bool ancienne = options[0];`", correct: true}
      - {text: "Écrire `const auto ancienne = options[0];`", correct: false}
      - {text: "Écrire `auto&& ancienne = options[0];`", correct: false}
      - {text: "Écrire `decltype(auto) ancienne = options[0];`", correct: false}
    answer: |-
      ```cpp
      bool ancienne = options[0];
      ```
      Avec `auto`, `ancienne` est un proxy vers le bit du vecteur : elle suit ses changements. En écrivant `bool`,
      on convertit tout de suite, et l'on obtient une vraie copie. Les trois autres écritures gardent le proxy.
  - key: bug-total-entier
    format: bug-fix
    question: |-
      Ce programme devrait afficher `6.5`, la somme des prix. Il affiche `5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const std::vector<double> prix{2.5, 1.5, 2.5};
          auto total = 0;
          for (const double p : prix) {
              total += p;
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "Écrire `auto total = 0.0;`", correct: true}
      - {text: "Écrire `auto total = {0};`", correct: false}
      - {text: "Écrire `auto total = 0u;`", correct: false}
      - {text: "Écrire `const auto total = 0;`", correct: false}
    answer: |-
      ```cpp
      auto total = 0.0;
      ```
      `0` est un `int` : `total` aussi, et chaque addition est tronquée. `0.0` est un `double`. Écrire
      `double total = 0;` conviendrait tout autant.
  - key: bug-chaine-litterale
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `nom += " Lovelace";` : `nom` n'est pas une `std::string`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          auto nom = "Ada";
          nom += " Lovelace";
          std::println("{}", nom);
      }
      ```
    choices:
      - {text: "Écrire `std::string nom = \"Ada\";`", correct: true}
      - {text: "Écrire `auto& nom = \"Ada\";`", correct: false}
      - {text: "Écrire `const auto nom = \"Ada\";`", correct: false}
      - {text: "Écrire `auto nom = {\"Ada\"};`", correct: false}
    answer: |-
      ```cpp
      std::string nom = "Ada";
      ```
      `auto` déduit `const char*` d'un littéral de chaîne : un pointeur, qui ne sait pas concaténer. On écrit le
      type, ou un littéral de `std::string` : `auto nom = std::string{"Ada"};`.
