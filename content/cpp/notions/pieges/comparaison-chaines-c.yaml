notion: comparaison-chaines-c
lesson: |-
  Une chaîne de style C est un **pointeur** (`const char*`) vers des caractères terminés par `'\0'`. Appliquer
  `==` à deux chaînes de style C compare donc **deux adresses**, pas deux textes.

  ```cpp
  const char* a = saisie();        // "oui"
  if (a == "oui") { ... }          // compare l'adresse de la saisie à celle du littéral : faux
  ```

  Deux chaînes au contenu identique, rangées à deux endroits de la mémoire, sont « différentes » pour `==`.

  **Le piège dans le piège.** Avec deux **littéraux**, `"abc" == "abc"` donne souvent `true` : le compilateur
  range les littéraux identiques au même endroit. Mais rien ne l'y oblige : le résultat est **non spécifié**. Un
  test qui « marche » ainsi casse dès que l'une des chaînes vient d'ailleurs.

  **Comparer le contenu.**

  | Outil | Écriture | Remarque |
  |---|---|---|
  | `std::strcmp` (`<cstring>`) | `std::strcmp(a, b) == 0` | renvoie 0 si égales ; négatif ou positif selon l'ordre |
  | `std::string_view` | `std::string_view{a} == b` | sans allocation ; l'outil moderne |
  | `std::string` | `std::string{a} == b` | copie la chaîne |

  Dès que **l'un** des deux côtés est une `std::string` ou une `std::string_view`, `==` compare le texte.

  **`strcmp` ne renvoie pas un booléen.** Il renvoie **0 quand les chaînes sont égales**. Écrire
  `if (std::strcmp(a, b))` teste donc qu'elles sont **différentes** : c'est une faute classique.

  **Les autres opérateurs** ont le même défaut : `a < b` compare des adresses. Comparer avec `<` deux pointeurs qui
  ne désignent pas le même tableau donne d'ailleurs un résultat non spécifié.

  **Les conteneurs.** Une `std::map<const char*, int>` trie et cherche **par adresse** : `m.find("cle")` ne trouve
  pas une clé égale rangée ailleurs. On prend `std::string` ou `std::string_view` pour clé.

  **Les tableaux.** Deux tableaux `char a[]` et `char b[]` comparés avec `==` se convertissent en pointeurs : même
  piège. Depuis C++20, cette comparaison de tableaux est dépréciée, et GCC avertit.

  **Le repérer.** GCC avertit de la comparaison avec un littéral (`-Waddress` : « comparison with string literal
  results in unspecified behavior »).

  **En entretien** : « `==` sur deux `const char*` compare les adresses. Pour le contenu : `std::strcmp(a, b) ==
  0`, ou mieux une `std::string_view`. Et entre deux littéraux, le résultat est non spécifié, même s'il vaut
  souvent `true`. »
cards:
  - key: adresses
    format: course
    question: "Sur quoi porte la comparaison `a == b` entre deux pointeurs `const char*` ?"
    choices:
      - {text: "Les deux adresses, pas le texte désigné", correct: true}
      - {text: "Les deux textes, caractère par caractère", correct: false}
      - {text: "Les longueurs des deux chaînes", correct: false}
      - {text: "Le premier caractère de chaque chaîne", correct: false}
    answer: "Une chaîne de style C est un pointeur. Deux chaînes de même contenu, rangées à deux endroits, sont donc « différentes »."
  - key: strcmp
    format: course
    question: "Que renvoie `std::strcmp(a, b)` quand les deux chaînes ont le même contenu ?"
    choices:
      - {text: "`0`", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`true`", correct: false}
      - {text: "`-1`", correct: false}
    answer: "Zéro pour l'égalité, un nombre négatif ou positif selon l'ordre. On écrit donc `std::strcmp(a, b) == 0`."
  - key: litteraux
    format: course
    question: "Que vaut `\"abc\" == \"abc\"`, entre deux littéraux ?"
    choices:
      - {text: "Un résultat non spécifié, même s'il vaut souvent `true`", correct: true}
      - {text: "Toujours `true` : le standard le garantit", correct: false}
      - {text: "Toujours `false` : deux littéraux ont deux adresses", correct: false}
      - {text: "Rien : la comparaison ne compile pas", correct: false}
    answer: "Le compilateur peut ranger les littéraux identiques au même endroit, ou non. Un programme correct ne dépend pas de ce choix."
  - key: moderne
    format: course
    question: "Quelle est la façon moderne de comparer le contenu de deux chaînes de style C, sans allocation ?"
    choices:
      - {text: "`std::string_view{a} == std::string_view{b}`", correct: true}
      - {text: "`std::addressof(a) == std::addressof(b)`", correct: false}
      - {text: "`*a == *b && a != nullptr && b != nullptr`", correct: false}
      - {text: "`a.equals(b)`, comme on l'écrirait en Java", correct: false}
    answer: "Une vue compare le texte, sans rien copier. `*a == *b` ne compare que le premier caractère, et `std::addressof` donne l'adresse des pointeurs eux-mêmes."
  - key: vf-contenu
    format: true-false
    question: "Deux `const char*` qui désignent des textes identiques sont toujours égaux pour `==`."
    truth: false
    answer: "Ils ne sont égaux que s'ils désignent la même adresse."
  - key: vf-string
    format: true-false
    question: "`==` compare le texte dès que l'un des deux côtés est une `std::string`."
    truth: true
    answer: "L'opérateur de `std::string` accepte un `const char*` de l'autre côté, et compare les caractères."
  - key: vf-strcmp-bool
    format: true-false
    question: "`if (std::strcmp(a, b))` est vrai quand les deux chaînes sont égales."
    truth: false
    answer: "`strcmp` renvoie 0 pour l'égalité, donc faux. La condition est vraie quand elles diffèrent."
  - key: vf-map
    format: true-false
    question: "Une `std::map<const char*, int>` compare ses clés par leur adresse."
    truth: true
    answer: "Elle trie les pointeurs. Une recherche avec une chaîne égale, mais rangée ailleurs, ne trouve rien."
  - key: qcm-egalite
    format: multiple-choice
    question: "Quelle condition teste correctement que la chaîne de style C `commande` vaut `quitter` ?"
    choices:
      - {text: "`std::strcmp(commande, \"quitter\") == 0`", correct: true}
      - {text: "`commande == \"quitter\"`", correct: false}
      - {text: "`std::strcmp(commande, \"quitter\")`", correct: false}
      - {text: "`*commande == *\"quitter\"`", correct: false}
    answer: "`strcmp` compare le contenu, et renvoie 0 pour l'égalité. Sans `== 0`, la condition est inversée."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::strcmp` ?"
    choices:
      - {text: "`<cstring>`", correct: true}
      - {text: "`<string>`", correct: false}
      - {text: "`<string_view>`", correct: false}
      - {text: "`<cstdlib>`", correct: false}
    answer: "`<cstring>` regroupe les fonctions de chaînes héritées du C. `<string>` déclare la classe `std::string`."
  - key: qcm-cle
    format: multiple-choice
    question: "Quel type de clé choisis-tu pour une map indexée par des noms ?"
    choices:
      - {text: "`std::string`", correct: true}
      - {text: "`const char*`", correct: false}
      - {text: "`char*`", correct: false}
      - {text: "`char`", correct: false}
    answer: "`std::string` se compare par son contenu, et possède ses caractères. Un pointeur serait comparé par adresse, et pourrait devenir pendant."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Que signale GCC, avec `-Wall`, pour `if (nom == \"Ada\")` où `nom` est un `const char*` ?"
    choices:
      - {text: "« comparison with string literal results in unspecified behavior »", correct: true}
      - {text: "« 'nom' was not declared in this scope »", correct: false}
      - {text: "« invalid conversion from 'const char*' to 'int' »", correct: false}
      - {text: "« use of deleted function 'operator==' »", correct: false}
    answer: "C'est l'avertissement `-Waddress`. Le code compile, mais compare deux adresses."
  - key: code-pointeurs
    format: code-output
    question: |-
      ```cpp
      #include <cstring>
      #include <print>

      int main() {
          const char premier[] = "abc";
          const char second[] = "abc";
          const char* a = premier;
          const char* b = second;
          std::println("{} {}", a == b, std::strcmp(a, b) == 0);
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "`true false`", correct: false}
    answer: "`false true` : les deux tableaux sont deux objets distincts, donc deux adresses. `strcmp` compare leurs caractères, identiques."
    check:
      output: "false true"
  - key: code-strcmp-signe
    format: code-output
    question: |-
      ```cpp
      #include <cstring>
      #include <print>

      int main() {
          std::println("{} {} {}",
                       std::strcmp("abc", "abd") < 0,
                       std::strcmp("b", "abc") > 0,
                       std::strcmp("abc", "abc"));
      }
      ```
    choices:
      - {text: "`true true 0`", correct: true}
      - {text: "`true false 0`", correct: false}
      - {text: "`false true 1`", correct: false}
      - {text: "`true true 1`", correct: false}
    answer: "`true true 0` : `abc` précède `abd` ; `b` suit `abc`, car la comparaison s'arrête à la première lettre qui diffère ; deux chaînes égales donnent 0."
    check:
      output: "true true 0"
  - key: code-string-view
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string_view>

      int main() {
          const char premier[] = "abc";
          const char second[] = "abc";
          const std::string_view vue{premier};
          std::println("{} {}", vue == second, vue == "abd");
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`false false`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "`false true`", correct: false}
    answer: "`true false` : dès qu'un côté est une `std::string_view`, `==` compare le texte. Les adresses ne comptent plus."
    check:
      output: "true false"
  - key: code-meme-adresse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          const char texte[] = "abc";
          const char* debut = texte;
          const char* aussi = texte;
          const char* suite = texte + 1;
          std::println("{} {} {}", debut == aussi, debut == suite, *suite == 'b');
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
    answer: "`true false true` : `debut` et `aussi` contiennent la même adresse ; `suite` désigne le caractère suivant, qui est `b`."
    check:
      output: "true false true"
  - key: bug-egal-litteral
    format: bug-fix
    question: |-
      Ce programme devrait afficher `bienvenue`. Il affiche `refusé` : `==` compare deux adresses. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char saisie[] = "secret";
          const char* mot = saisie;
          if (mot == "secret") {
              std::println("bienvenue");
          } else {
              std::println("refusé");
          }
      }
      ```
    choices:
      - {text: "Écrire `if (std::string_view{mot} == \"secret\")`", correct: true}
      - {text: "Écrire `if (*mot == *\"secret\")`", correct: false}
      - {text: "Écrire `if (&mot == &\"secret\")`", correct: false}
      - {text: "Écrire `if (mot = \"secret\")`", correct: false}
    answer: |-
      ```cpp
      if (std::string_view{mot} == "secret") {
      ```
      `mot` désigne le tableau `saisie`, le littéral est ailleurs : les adresses diffèrent. Une vue compare le
      texte. `*mot == *"secret"` ne comparerait que la première lettre.
  - key: bug-strcmp-inverse
    format: bug-fix
    question: |-
      Ce programme devrait afficher `identiques`. Il affiche `différentes`. Quelle correction est la bonne ?
      ```cpp
      #include <cstring>
      #include <print>

      int main() {
          const char a[] = "bonjour";
          const char b[] = "bonjour";
          if (std::strcmp(a, b)) {
              std::println("identiques");
          } else {
              std::println("différentes");
          }
      }
      ```
    choices:
      - {text: "Écrire `if (std::strcmp(a, b) == 0)`", correct: true}
      - {text: "Écrire `if (std::strcmp(a, b) == 1)`", correct: false}
      - {text: "Écrire `if (std::strcmp(b, a))`", correct: false}
      - {text: "Écrire `if (std::strcmp(a, b) > 0)`", correct: false}
    answer: |-
      ```cpp
      if (std::strcmp(a, b) == 0) {
      ```
      `strcmp` renvoie 0 pour deux chaînes égales, et 0 est faux dans une condition. Il faut comparer le résultat à
      zéro.
  - key: bug-map-pointeurs
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : la clé `rouge` est dans la map. Il affiche `false`. Quelle correction
      est la bonne ?
      ```cpp
      #include <map>
      #include <print>

      int main() {
          const char cle[] = "rouge";
          std::map<const char*, int> couleurs;
          couleurs[cle] = 1;
          const char recherche[] = "rouge";
          std::println("{}", couleurs.contains(recherche));
      }
      ```
    choices:
      - {text: "Déclarer `std::map<std::string, int> couleurs;`", correct: true}
      - {text: "Déclarer `std::map<char*, int> couleurs;`", correct: false}
      - {text: "Déclarer `std::map<const char**, int> couleurs;`", correct: false}
      - {text: "Appeler `couleurs.count(recherche)` à la place de `contains`", correct: false}
    answer: |-
      ```cpp
      std::map<std::string, int> couleurs;
      ```
      Avec des `const char*` pour clés, la map compare des adresses : `recherche` est un autre tableau que `cle`.
      Des clés `std::string` se comparent par leur texte.
  - key: bug-inferieur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `true` : `abricot` vient avant `banane` dans l'ordre alphabétique. Son résultat
      dépend de l'emplacement des tableaux en mémoire. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const char banane[] = "banane";
          const char abricot[] = "abricot";
          const char* a = abricot;
          const char* b = banane;
          std::println("{}", a < b);
      }
      ```
    choices:
      - {text: "Écrire `std::string_view{a} < std::string_view{b}`", correct: true}
      - {text: "Écrire `*a < *b`, sans rien changer d'autre", correct: false}
      - {text: "Écrire `&a < &b`, sans rien changer d'autre", correct: false}
      - {text: "Écrire `a <= b`, sans rien changer d'autre", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::string_view{a} < std::string_view{b});
      ```
      `a < b` compare deux adresses de tableaux distincts : un résultat non spécifié. Les vues comparent les textes
      dans l'ordre lexicographique. `std::strcmp(a, b) < 0` convient aussi ; `*a < *b` ne regarde que la première
      lettre.
