notion: initializer-list-piege
lesson: |-
  Les accolades sont la façon recommandée d'initialiser en C++ : elles refusent les conversions qui perdent de
  l'information. Mais avec les conteneurs, elles cachent un piège célèbre.

  ```cpp
  std::vector<int> a(3);     // trois éléments, qui valent 0
  std::vector<int> b{3};     // UN élément, qui vaut 3
  ```

  **Pourquoi.** Un constructeur peut recevoir une **`std::initializer_list<T>`** : une liste de valeurs écrite entre
  accolades. `std::vector` en a un, pour qu'on puisse écrire `{1, 2, 3}`. Or la règle du langage est la suivante :

  > Avec des accolades, un constructeur qui prend une `std::initializer_list` est **préféré à tous les autres**,
  > dès que la conversion des arguments est possible.

  `std::vector<int>{3}` peut se lire comme « la liste qui contient 3 » : c'est cette lecture qui gagne, pas « trois
  éléments ».

  **Le tableau à connaître.**

  | Écriture | Résultat |
  |---|---|
  | `std::vector<int> v(3);` | `0, 0, 0` |
  | `std::vector<int> v{3};` | `3` |
  | `std::vector<int> v(3, 7);` | `7, 7, 7` |
  | `std::vector<int> v{3, 7};` | `3, 7` |
  | `std::string s(3, 'a');` | `"aaa"` |
  | `std::string s{3, 'a'};` | deux caractères : celui de code 3, puis `'a'` |
  | `std::vector<int> v{};` | vide : des accolades vides appellent le constructeur par défaut |

  **Quand la liste ne convient pas**, la recherche retombe sur les autres constructeurs :

  ```cpp
  std::vector<std::string> noms{3};    // 3 n'est pas une chaîne : trois chaînes vides
  ```

  Le même `{3}` donne donc un élément ou trois, selon le type des éléments. Raison de plus pour écrire des
  parenthèses quand on veut une **taille**.

  **La règle pratique.**

  - Des **parenthèses** pour appeler un constructeur « à paramètres » d'un conteneur : une taille, une taille et
    une valeur, deux itérateurs.
  - Des **accolades** pour donner la **liste des éléments**.

  **Avec `auto`.**

  ```cpp
  auto a = {1, 2};     // std::initializer_list<int>
  auto b = {3};        // std::initializer_list<int>, pas int
  auto c{3};           // int (depuis C++17)
  auto d = 3;          // int
  ```

  **Dans ses propres classes.** Ajouter un constructeur `std::initializer_list` à une classe change le sens de
  tous les appels entre accolades déjà écrits : `Tampon{64}` cesse d'appeler `Tampon(std::size_t)`. On n'en ajoute
  un qu'à une classe qui est vraiment un conteneur.

  **Les fonctions qui construisent pour toi** (`std::make_unique`, `std::make_shared`, `emplace_back`) utilisent
  des **parenthèses** : `std::make_unique<std::vector<int>>(3, 7)` donne trois 7.

  **Les éléments d'une `std::initializer_list` sont constants** : on ne peut pas les déplacer hors de la liste, ils
  sont copiés. Une liste de `std::unique_ptr` entre accolades ne compile donc pas.

  **En entretien** : « Avec des accolades, le constructeur `std::initializer_list` est prioritaire :
  `vector<int>{3}` contient l'élément 3, `vector<int>(3)` contient trois zéros. J'écris des parenthèses pour une
  taille, des accolades pour une liste d'éléments. »
cards:
  - key: difference
    format: course
    question: "Quelle différence entre `std::vector<int> v(3);` et `std::vector<int> v{3};` ?"
    choices:
      - {text: "Le premier contient trois zéros ; le second, un seul élément qui vaut 3", correct: true}
      - {text: "Le premier contient un seul élément qui vaut 3 ; le second, trois zéros", correct: false}
      - {text: "Aucune : les deux contiennent trois éléments qui valent zéro", correct: false}
      - {text: "Aucune : les deux contiennent un seul élément qui vaut 3", correct: false}
    answer: "Les parenthèses appellent le constructeur « taille ». Les accolades choisissent le constructeur `std::initializer_list` : la liste des éléments."
  - key: priorite
    format: course
    question: "Avec des accolades, quel constructeur le compilateur préfère-t-il ?"
    choices:
      - {text: "Celui qui prend une `std::initializer_list`, dès que les arguments s'y convertissent", correct: true}
      - {text: "Celui qui a le moins de paramètres, quel que soit leur type", correct: false}
      - {text: "Celui qui est déclaré en premier dans la classe", correct: false}
      - {text: "Le constructeur de copie, dans tous les cas", correct: false}
    answer: "Cette priorité est très forte : elle l'emporte même sur un constructeur dont les paramètres correspondraient exactement."
  - key: repli
    format: course
    question: "Que contient `std::vector<std::string> noms{3};` ?"
    choices:
      - {text: "Trois chaînes vides : 3 n'étant pas une chaîne, le constructeur « taille » est choisi", correct: true}
      - {text: "Une seule chaîne, qui contient le caractère `'3'`", correct: false}
      - {text: "Rien : la ligne ne compile pas", correct: false}
      - {text: "Une seule chaîne vide", correct: false}
    answer: "La liste `{3}` ne peut pas être une liste de chaînes. La recherche retombe alors sur les autres constructeurs. Le même `{3}` donne un élément pour des `int`, trois pour des chaînes."
  - key: regle-pratique
    format: course
    question: "Quelle règle évite le piège des accolades avec les conteneurs ?"
    choices:
      - {text: "Des parenthèses pour une taille, des accolades pour la liste des éléments", correct: true}
      - {text: "Des accolades pour une taille, des parenthèses pour la liste des éléments", correct: false}
      - {text: "Des accolades partout, sans exception", correct: false}
      - {text: "Des parenthèses partout, sans exception", correct: false}
    answer: "`std::vector<int> v(10);` : dix éléments. `std::vector<int> v{10, 20};` : ces deux éléments. L'intention se lit dans la ponctuation."
  - key: vf-accolades-vides
    format: true-false
    question: "`std::vector<int> v{};` crée un vecteur vide."
    truth: true
    answer: "Des accolades vides appellent le constructeur par défaut, pas celui de la liste."
  - key: vf-auto-liste
    format: true-false
    question: "Avec `auto x = {3};`, `x` est un `int`."
    truth: false
    answer: "C'est une `std::initializer_list<int>`. Pour un `int` : `auto x = 3;`, ou `auto x{3};` depuis C++17."
  - key: vf-make-unique
    format: true-false
    question: "`std::make_unique<std::vector<int>>(3, 7)` crée un vecteur de trois éléments qui valent 7."
    truth: true
    answer: "`std::make_unique` construit avec des parenthèses : c'est le constructeur « taille, valeur » qui est appelé."
  - key: vf-string
    format: true-false
    question: "`std::string s{3, 'a'};` contient `aaa`."
    truth: false
    answer: "Les accolades en font la liste de deux caractères : celui de code 3, et `'a'`. Pour `aaa` : `std::string s(3, 'a');`."
  - key: qcm-trois-sept
    format: multiple-choice
    question: "Quelle ligne crée un vecteur de trois éléments qui valent tous 7 ?"
    choices:
      - {text: "`std::vector<int> v(3, 7);`", correct: true}
      - {text: "`std::vector<int> v{3, 7};`", correct: false}
      - {text: "`std::vector<int> v{7, 3};`", correct: false}
      - {text: "`std::vector<int> v = {3, 7};`", correct: false}
    answer: "Avec des parenthèses : une taille, puis une valeur. Les trois autres créent un vecteur de deux éléments."
  - key: qcm-type-liste
    format: multiple-choice
    question: "Quel type de paramètre permet à un constructeur de recevoir `{1, 2, 3}` ?"
    choices:
      - {text: "`std::initializer_list<int>`", correct: true}
      - {text: "`std::vector<int>&`", correct: false}
      - {text: "`int...`", correct: false}
      - {text: "`std::tuple<int>`", correct: false}
    answer: "Le compilateur fabrique un tableau temporaire constant, et le constructeur reçoit une `std::initializer_list` qui le désigne."
  - key: qcm-auto
    format: multiple-choice
    question: "Laquelle de ces déclarations ne donne pas un `int` ?"
    choices:
      - {text: "`auto x = {5};`", correct: true}
      - {text: "`auto x = 5;`", correct: false}
      - {text: "`auto x{5};`", correct: false}
      - {text: "`auto x(5);`", correct: false}
    answer: "Avec `=` suivi d'accolades, `auto` déduit une `std::initializer_list<int>`. C'est un cas particulier du langage."
  - key: qcm-elements-constants
    format: multiple-choice
    question: "Pourquoi `std::vector<std::unique_ptr<int>> v{std::make_unique<int>(1)};` ne compile-t-il pas ?"
    choices:
      - {text: "Les éléments d'une `std::initializer_list` sont constants : il faudrait les copier", correct: true}
      - {text: "Un vecteur ne peut pas contenir de `std::unique_ptr`", correct: false}
      - {text: "`std::make_unique` ne peut pas être appelé entre accolades", correct: false}
      - {text: "Les accolades exigent au moins deux éléments", correct: false}
    answer: "On ne peut pas déplacer hors d'une liste d'initialisation, et un `std::unique_ptr` ne se copie pas. On remplit le vecteur avec `push_back(std::move(...))` ou `emplace_back`."
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a(3);
          std::vector<int> b{3};
          std::println("{} {} {} {}", a.size(), a[0], b.size(), b[0]);
      }
      ```
    choices:
      - {text: "`3 0 1 3`", correct: true}
      - {text: "`1 3 3 0`", correct: false}
      - {text: "`3 0 3 0`", correct: false}
      - {text: "`1 3 1 3`", correct: false}
    answer: "`3 0 1 3` : avec des parenthèses, trois éléments nuls. Avec des accolades, la liste d'un seul élément, 3."
    check:
      output: "3 0 1 3"
  - key: code-deux-arguments
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a(2, 9);
          std::vector<int> b{2, 9};
          std::println("{} {} {} {}", a[0], a[1], b[0], b[1]);
      }
      ```
    choices:
      - {text: "`9 9 2 9`", correct: true}
      - {text: "`2 9 9 9`", correct: false}
      - {text: "`9 9 9 9`", correct: false}
      - {text: "`2 9 2 9`", correct: false}
    answer: "`9 9 2 9` : `(2, 9)` veut dire « deux éléments qui valent 9 ». `{2, 9}` est la liste des éléments 2 et 9."
    check:
      output: "9 9 2 9"
  - key: code-chaines
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> noms{3};
          std::vector<int> nombres{3};
          std::println("{} {} {}", noms.size(), noms[0].empty(), nombres.size());
      }
      ```
    choices:
      - {text: "`3 true 1`", correct: true}
      - {text: "`1 false 1`", correct: false}
      - {text: "`3 true 3`", correct: false}
      - {text: "`1 true 3`", correct: false}
    answer: "`3 true 1` : 3 ne peut pas être une chaîne, donc `noms{3}` appelle le constructeur « taille » : trois chaînes vides. Pour des `int`, `{3}` est la liste d'un élément."
    check:
      output: "3 true 1"
  - key: code-string
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string a(3, 'x');
          const std::string b{3, 'x'};
          std::println("{} {} {}", a, a.size(), b.size());
      }
      ```
    choices:
      - {text: "`xxx 3 2`", correct: true}
      - {text: "`xxx 3 3`", correct: false}
      - {text: "`3x 2 2`", correct: false}
      - {text: "`xxx 3 1`", correct: false}
    answer: "`xxx 3 2` : avec des parenthèses, trois fois `'x'`. Avec des accolades, une liste de deux caractères : celui de code 3, et `'x'`."
    check:
      output: "xxx 3 2"
  - key: bug-cinq-compteurs
    format: bug-fix
    question: |-
      Ce programme devrait créer cinq compteurs à zéro, et afficher `5`. Il affiche `1`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> compteurs{5};
          std::println("{}", compteurs.size());
      }
      ```
    choices:
      - {text: "Écrire `std::vector<int> compteurs(5);`", correct: true}
      - {text: "Écrire `std::vector<int> compteurs{5, 0};`", correct: false}
      - {text: "Écrire `std::vector<int> compteurs = {5};`", correct: false}
      - {text: "Écrire `std::vector<int> compteurs{{5}};`", correct: false}
    answer: |-
      ```cpp
      std::vector<int> compteurs(5);
      ```
      Entre accolades, `5` est un élément. Pour une taille, ce sont des parenthèses. `{5, 0}` donnerait les deux
      éléments 5 et 0.
  - key: bug-ligne-de-tirets
    format: bug-fix
    question: |-
      Ce programme devrait afficher une ligne de dix tirets. Il affiche une ligne vide, puis un seul tiret. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          const std::string ligne{10, '-'};
          std::println("{}", ligne);
      }
      ```
    choices:
      - {text: "Écrire `const std::string ligne(10, '-');`", correct: true}
      - {text: "Écrire `const std::string ligne{'-', 10};`", correct: false}
      - {text: "Écrire `const std::string ligne{\"10\", '-'};`", correct: false}
      - {text: "Écrire `const std::string ligne = {10, '-'};`", correct: false}
    answer: |-
      ```cpp
      const std::string ligne(10, '-');
      ```
      Les accolades forment la liste de deux caractères : celui de code 10, qui est le saut de ligne, puis le
      tiret. Le constructeur « nombre, caractère » s'appelle avec des parenthèses.
  - key: bug-constructeur-liste
    format: bug-fix
    question: |-
      Ce programme devrait créer un tampon de 64 éléments et afficher `64`. Il affiche `1`. Quelle correction est la
      bonne ?
      ```cpp
      #include <cstddef>
      #include <initializer_list>
      #include <print>

      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : taille_{taille} {}
          Tampon(std::initializer_list<int> valeurs) : taille_{valeurs.size()} {}
          std::size_t taille() const { return taille_; }

      private:
          std::size_t taille_;
      };

      int main() {
          const Tampon tampon{64};
          std::println("{}", tampon.taille());
      }
      ```
    choices:
      - {text: "Écrire `const Tampon tampon(64);`", correct: true}
      - {text: "Écrire `const Tampon tampon{64u};`", correct: false}
      - {text: "Écrire `const Tampon tampon = {64};`", correct: false}
      - {text: "Écrire `const Tampon tampon{{64}};`", correct: false}
    answer: |-
      ```cpp
      const Tampon tampon(64);
      ```
      Dès qu'une classe a un constructeur `std::initializer_list`, les accolades le choisissent : `{64}` est la
      liste d'un élément. Les parenthèses appellent le constructeur « taille ».
  - key: bug-auto-liste
    format: bug-fix
    question: |-
      Le compilateur refuse `valeur * 2` : « no match for 'operator*' (operand types are
      'std::initializer_list<int>' and 'int') ». Quelle correction est la bonne ?
      ```cpp
      #include <initializer_list>
      #include <print>

      int main() {
          auto valeur = {21};
          std::println("{}", valeur * 2);
      }
      ```
    choices:
      - {text: "Écrire `auto valeur = 21;`", correct: true}
      - {text: "Écrire `auto valeur = {21, 2};`", correct: false}
      - {text: "Écrire `auto valeur = {{21}};`", correct: false}
      - {text: "Écrire `auto& valeur = {21};`", correct: false}
    answer: |-
      ```cpp
      auto valeur = 21;
      ```
      `auto` suivi de `= {...}` déduit une `std::initializer_list<int>`, pas un `int`. Avec `auto`, on initialise
      par `=` sans accolades.
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour créer un vecteur de dix éléments qui valent zéro :
      ```cpp
      std::vector<int> v___;
      ```
    blanks:
      - ["(10)"]
    answer: "Des parenthèses : `v(10)` appelle le constructeur « taille »."
  - key: trous-liste
    format: fill-in
    question: |-
      Complète le type du paramètre, pour que la classe accepte `Panier p{3, 5, 8};` :
      ```cpp
      class Panier {
      public:
          Panier(std::___<int> articles);
      };
      ```
    blanks:
      - [initializer_list]
    answer: "Un constructeur qui prend une `std::initializer_list<int>` reçoit la liste écrite entre accolades."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour que `x` soit un `int`, et non une liste d'initialisation :
      ```cpp
      auto x ___ 3;
      ```
    blanks:
      - ["="]
    answer: "`auto x = 3;` déduit `int`. `auto x = {3};` déduirait une `std::initializer_list<int>`."
  - key: trous-repetition
    format: fill-in
    question: |-
      Complète pour que la chaîne contienne cinq étoiles :
      ```cpp
      std::string etoiles___;
      ```
    blanks:
      - ["(5, '*')"]
    answer: "Le constructeur « nombre, caractère » s'appelle avec des parenthèses : `etoiles(5, '*')`."
