notion: ub-definition
lesson: |-
  Le standard C++ ne décrit pas le comportement de **tous** les programmes. Il distingue trois zones grises, de la
  plus bénigne à la plus dangereuse.

  | Catégorie | Ce que dit le standard | Exemple |
  |---|---|---|
  | **Défini par l'implémentation** | plusieurs comportements possibles ; le compilateur en choisit un et le **documente** | la taille de `int`, le signe de `char` |
  | **Non spécifié** | plusieurs comportements possibles ; le compilateur choisit, sans avoir à le dire | l'ordre d'évaluation des arguments d'une fonction |
  | **Indéfini** (*undefined behavior*, UB) | **aucune** exigence : tout peut arriver | lire hors d'un tableau |

  **Le comportement indéfini.** Le programme est incorrect, mais le compilateur **n'est pas tenu de le signaler**.
  À l'exécution, il peut :

  - sembler fonctionner ;
  - donner un résultat faux ;
  - planter, tout de suite ou bien plus tard ;
  - se comporter différemment selon le compilateur, les options, ou la phase de la lune.

  « Ça marche sur ma machine » ne prouve donc rien.

  **Les causes classiques.**

  - lire ou écrire **hors des bornes** d'un tableau, d'un vecteur, d'une chaîne ;
  - déréférencer un pointeur **nul**, **pendant** ou non initialisé ;
  - lire une variable **non initialisée** ;
  - le **débordement d'un entier signé** (`INT_MAX + 1`) ;
  - diviser un entier par zéro ;
  - utiliser un objet **après sa destruction** (`delete`, fin de portée) ;
  - une **course aux données** entre threads ;
  - une fonction non `void` qui se termine **sans `return`** ;
  - décaler un entier d'un nombre de bits supérieur ou égal à sa taille.

  **Pourquoi le langage le permet.** Pour la vitesse. Vérifier chaque indice, chaque addition, chaque pointeur
  coûterait du temps à tous les programmes, y compris aux programmes corrects. C++ fait confiance au programmeur.

  **Pourquoi c'est pire qu'un simple bug.** Le compilateur a le droit de **supposer qu'un comportement indéfini
  n'arrive jamais**, et d'optimiser sur cette base. Un test écrit trop tard peut ainsi disparaître :

  ```cpp
  int valeur = *p;          // si p était nul, c'est déjà indéfini
  if (p == nullptr) {       // donc le compilateur peut supprimer ce test
      return;
  }
  ```

  L'effet d'un comportement indéfini peut donc se voir **loin** de sa cause, et même **avant** elle dans le code.

  **S'en protéger.**

  - Les **avertissements** : `-Wall -Wextra` en signalent une partie à la compilation.
  - Les **sanitizers** : `-fsanitize=address,undefined` détecte la plupart des cas à l'exécution, pendant les
    tests.
  - Les **abstractions sûres** : `std::vector` et `at()`, les pointeurs intelligents, les boucles sur un
    intervalle, `std::optional`.

  **En entretien** : « Un comportement indéfini, c'est un programme auquel le standard n'impose plus rien : il peut
  marcher, planter ou donner n'importe quoi, et le compilateur optimise en supposant qu'il n'arrive pas. Je le
  distingue du non spécifié et du défini par l'implémentation, qui restent des programmes valides. »
cards:
  - key: definition
    format: course
    question: "Que veut dire qu'un programme a un comportement indéfini ?"
    choices:
      - {text: "Le standard ne lui impose plus rien : il peut marcher, planter ou donner n'importe quoi", correct: true}
      - {text: "Le standard impose au compilateur de refuser le programme, avec un message d'erreur", correct: false}
      - {text: "Le standard impose au programme de lever une exception au moment de la faute", correct: false}
      - {text: "Le standard laisse le compilateur choisir un comportement, qu'il doit documenter", correct: false}
    answer: "Le compilateur n'a ni à le détecter ni à le signaler. Le programme peut même sembler correct pendant des années."
  - key: trois-categories
    format: course
    question: "Quelle différence entre « non spécifié » et « indéfini » ?"
    choices:
      - {text: "Non spécifié : un comportement valide parmi plusieurs. Indéfini : plus aucune garantie", correct: true}
      - {text: "Non spécifié : plus aucune garantie. Indéfini : un comportement valide parmi plusieurs", correct: false}
      - {text: "Non spécifié : une erreur de compilation. Indéfini : une erreur d'exécution", correct: false}
      - {text: "Aucune : les deux mots désignent exactement la même chose", correct: false}
    answer: "L'ordre d'évaluation des arguments est non spécifié : le programme reste valide, quel que soit l'ordre choisi. Un accès hors bornes est indéfini : tout peut arriver."
  - key: pourquoi
    format: course
    question: "Pourquoi C++ laisse-t-il certains comportements indéfinis, au lieu de les vérifier ?"
    choices:
      - {text: "Pour ne pas faire payer le coût des vérifications aux programmes corrects", correct: true}
      - {text: "Pour obliger les programmeurs à tester sur plusieurs machines", correct: false}
      - {text: "Parce que les compilateurs ne savent pas produire de vérifications", correct: false}
      - {text: "Parce que ces comportements sont identiques sur toutes les machines", correct: false}
    answer: "Tester chaque indice ou chaque addition ralentirait tout le monde. Le langage laisse la responsabilité au programmeur, et les outils (sanitizers) pour vérifier pendant les tests."
  - key: optimisation
    format: course
    question: "Pourquoi un comportement indéfini peut-il avoir des effets loin de sa cause ?"
    choices:
      - {text: "Le compilateur optimise en supposant qu'il n'arrive jamais", correct: true}
      - {text: "Le compilateur déplace la faute à la fin du programme", correct: false}
      - {text: "Le système d'exploitation retarde les erreurs de mémoire", correct: false}
      - {text: "Le processeur exécute les instructions dans le désordre", correct: false}
    answer: "Un test qui ne peut être vrai qu'après un comportement indéfini peut être supprimé ; une boucle peut devenir infinie. Le symptôme n'a alors plus de rapport visible avec la faute."
  - key: vf-compilateur
    format: true-false
    question: "Le compilateur est tenu de signaler un comportement indéfini."
    truth: false
    answer: "Aucun diagnostic n'est exigé. Les avertissements et les sanitizers en détectent une partie, pas tout."
  - key: vf-ca-marche
    format: true-false
    question: "Un programme qui donne le bon résultat sur ta machine ne contient pas de comportement indéfini."
    truth: false
    answer: "« Sembler fonctionner » est l'un des comportements possibles. Un autre compilateur, ou une autre option, peut tout changer."
  - key: vf-debordement-signe
    format: true-false
    question: "Le débordement d'un entier signé est un comportement indéfini."
    truth: true
    answer: "`INT_MAX + 1` n'a pas de résultat garanti. Pour un entier non signé, en revanche, le résultat est défini : il reboucle."
  - key: vf-taille-int
    format: true-false
    question: "La taille de `int` est un comportement indéfini."
    truth: false
    answer: "Elle est définie par l'implémentation : chaque compilateur la choisit et la documente. Le programme reste valide."
  - key: qcm-lequel
    format: multiple-choice
    question: "Laquelle de ces opérations est un comportement indéfini ?"
    choices:
      - {text: "Lire `v[10]` sur un `std::vector` de trois éléments", correct: true}
      - {text: "Lire `v.at(10)` sur un `std::vector` de trois éléments", correct: false}
      - {text: "Ajouter 1 à un `unsigned int` qui vaut son maximum", correct: false}
      - {text: "Convertir `3.7` en `int`", correct: false}
    answer: "`operator[]` ne vérifie rien. `at()` lève une exception, un non signé reboucle à 0, et la conversion donne 3 : trois comportements définis."
  - key: qcm-non-specifie
    format: multiple-choice
    question: "Lequel de ces comportements est « non spécifié », et non indéfini ?"
    choices:
      - {text: "L'ordre d'évaluation des arguments de `f(a(), b())`", correct: true}
      - {text: "La lecture d'une variable locale non initialisée", correct: false}
      - {text: "La division d'un entier par zéro", correct: false}
      - {text: "Le déréférencement d'un pointeur nul", correct: false}
    answer: "`a()` peut être appelée avant ou après `b()` : les deux ordres sont valides. Les trois autres sont des comportements indéfinis."
  - key: qcm-detecter
    format: multiple-choice
    question: "Quelle option de GCC détecte une grande partie des comportements indéfinis pendant l'exécution ?"
    choices:
      - {text: "`-fsanitize=address,undefined`", correct: true}
      - {text: "`-O3`", correct: false}
      - {text: "`-std=c++23`", correct: false}
      - {text: "`-c`", correct: false}
    answer: "AddressSanitizer surveille la mémoire, UBSan les débordements, les décalages et les pointeurs nuls. On les active pendant les tests."
  - key: qcm-sans-return
    format: multiple-choice
    question: "Une fonction déclarée `int f()` atteint son accolade fermante sans `return`. Que dit le standard ?"
    choices:
      - {text: "C'est un comportement indéfini", correct: true}
      - {text: "La fonction renvoie zéro", correct: false}
      - {text: "Le programme ne compile pas", correct: false}
      - {text: "La fonction lève une exception", correct: false}
    answer: "Seule `main` renvoie 0 d'office. Pour toute autre fonction non `void`, GCC avertit, mais compile ; à l'exécution, tout peut arriver."
  - key: situation-ca-marchait
    format: scenario
    question: |-
      Un programme fonctionne depuis deux ans. Après la mise à jour du compilateur, il plante au démarrage, sans
      qu'une ligne ait changé. Que soupçonnes-tu d'abord ?
    choices:
      - {text: "Un comportement indéfini, que l'ancien compilateur tolérait par chance", correct: true}
      - {text: "Un défaut du nouveau compilateur, à signaler à ses auteurs", correct: false}
      - {text: "Une incompatibilité du processeur avec le nouveau compilateur", correct: false}
      - {text: "Un fichier source corrompu pendant la mise à jour", correct: false}
    answer: |-
      Un programme correct se comporte de la même façon avec tout compilateur conforme. Quand une mise à jour
      « casse » le code, c'est presque toujours qu'il s'appuyait sur un comportement indéfini, que le nouvel
      optimiseur exploite autrement. On recompile avec les sanitizers pour le trouver.
  - key: situation-debug-release
    format: scenario
    question: |-
      Un programme passe tous ses tests en mode débogage (`-O0`), et donne des résultats faux en mode optimisé
      (`-O2`). Un collègue veut livrer la version non optimisée. Que proposes-tu ?
    choices:
      - {text: "Chercher le comportement indéfini avec les sanitizers : l'optimisation ne fait que le révéler", correct: true}
      - {text: "Livrer la version non optimisée : elle est correcte, puisque ses tests passent", correct: false}
      - {text: "Baisser le niveau d'optimisation à `-O1`, jusqu'à ce que les résultats soient justes", correct: false}
      - {text: "Marquer toutes les variables `volatile`, pour interdire l'optimisation", correct: false}
    answer: |-
      L'optimiseur suppose que le code est correct. S'il change le résultat, le code ne l'est pas : variable non
      initialisée, accès hors bornes, débordement. La version `-O0` contient la même faute, qui se manifestera
      autrement, un autre jour.
  - key: situation-test-supprime
    format: scenario
    question: |-
      Une fonction commence par `int n = p->taille;`, puis teste `if (p == nullptr) return 0;`. En production, elle
      plante sur un pointeur nul, et le test ne semble jamais s'exécuter. Pourquoi ?
    choices:
      - {text: "Déréférencer `p` avant le test est déjà indéfini : le compilateur peut supprimer le test", correct: true}
      - {text: "Le test compare `p` à `nullptr`, alors qu'il faudrait le comparer à `0`", correct: false}
      - {text: "Le test est placé dans une fonction trop courte pour être compilée", correct: false}
      - {text: "Le compilateur exécute toujours les tests après les affectations", correct: false}
    answer: |-
      Puisque `p->taille` suppose `p` non nul, le compilateur en déduit que le test est toujours faux, et le retire.
      La vérification doit précéder tout usage du pointeur.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Que renvoie `INT_MAX + 1` ? » Quelle réponse montre que tu connais le
      sujet ?
    choices:
      - {text: "C'est un comportement indéfini : le débordement d'un entier signé n'a pas de résultat garanti", correct: true}
      - {text: "Il renvoie `INT_MIN`, car les entiers rebouclent toujours en complément à deux", correct: false}
      - {text: "Il renvoie `INT_MAX`, car le résultat est plafonné au maximum", correct: false}
      - {text: "Il lève une exception `std::overflow_error`, qu'on peut attraper", correct: false}
    answer: |-
      On observe souvent `INT_MIN`, mais rien ne le garantit : le compilateur peut supposer que le débordement
      n'arrive pas, et par exemple juger `x + 1 > x` toujours vrai. Pour un `unsigned`, le rebouclage est, lui,
      défini.
  - key: definition-ub
    format: definition
    question: "Qu'est-ce qu'un comportement indéfini ?"
    choices:
      - {text: "Une opération pour laquelle le standard n'impose aucun comportement au programme", correct: true}
      - {text: "Une opération dont le résultat dépend du compilateur, qui le documente", correct: false}
      - {text: "Une opération que le compilateur refuse avec un message d'erreur", correct: false}
      - {text: "Une opération qui lève toujours une exception à l'exécution", correct: false}
    answer: "En anglais, *undefined behavior*, abrégé UB. Le programme entier perd ses garanties, pas seulement l'opération fautive."
  - key: definition-defini-implementation
    format: definition
    question: "Que veut dire « défini par l'implémentation » ?"
    choices:
      - {text: "Que chaque compilateur choisit le comportement, et doit le documenter", correct: true}
      - {text: "Que le comportement est le même avec tous les compilateurs", correct: false}
      - {text: "Que le programmeur choisit le comportement par une option", correct: false}
      - {text: "Que le comportement n'est soumis à aucune exigence", correct: false}
    answer: "Exemples : la taille de `int`, le signe de `char`. Le programme est valide, mais pas forcément portable."
  - key: definition-non-specifie
    format: definition
    question: "Que veut dire « non spécifié » ?"
    choices:
      - {text: "Que plusieurs comportements valides sont possibles, sans que le compilateur ait à dire lequel", correct: true}
      - {text: "Que le comportement est interdit, et provoque une erreur de compilation", correct: false}
      - {text: "Que le comportement n'est soumis à aucune exigence du standard", correct: false}
      - {text: "Que le comportement est fixé par une option de compilation", correct: false}
    answer: "Exemple : l'ordre d'évaluation des arguments d'une fonction. Un programme correct ne doit pas en dépendre."
  - key: definition-sanitizer
    format: definition
    question: "Qu'est-ce qu'un sanitizer ?"
    choices:
      - {text: "Un outil qui ajoute au programme des vérifications, pour détecter les fautes à l'exécution", correct: true}
      - {text: "Un outil qui reformate le code source selon les conventions du projet", correct: false}
      - {text: "Un outil qui supprime du programme le code qui n'est jamais exécuté", correct: false}
      - {text: "Un outil qui corrige seul les comportements indéfinis du programme", correct: false}
    answer: "On compile avec `-fsanitize=...`. Le programme, ralenti, s'arrête avec un rapport précis à la première faute détectée."
