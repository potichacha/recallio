notion: most-vexing-parse
lesson: |-
  La grammaire de C++ contient une ambiguïté célèbre : certaines lignes peuvent se lire comme la **définition d'un
  objet** ou comme la **déclaration d'une fonction**. La règle du langage tranche toujours de la même façon :

  > Tout ce qui **peut** être lu comme une déclaration **est** une déclaration.

  On l'appelle l'**analyse la plus contrariante** (*most vexing parse*).

  **La forme simple.**

  ```cpp
  Minuteur m();        // pas un objet : la déclaration d'une fonction m, sans paramètre, qui renvoie un Minuteur
  ```

  Aucun objet n'est créé, aucun constructeur n'est appelé. L'erreur n'apparaît que plus loin, quand on écrit
  `m.demarrer()` : « request for member 'demarrer' in 'm', which is of non-class type 'Minuteur()' ».

  **La forme vicieuse.**

  ```cpp
  Journal journal(std::string());
  ```

  On croit construire un `Journal` à partir d'une chaîne vide. Le compilateur lit : une fonction `journal`, qui
  renvoie un `Journal`, et prend en paramètre **une fonction** renvoyant une `std::string`.

  **Le remède : les accolades.** L'initialisation avec `{}` ne peut **jamais** être lue comme une déclaration de
  fonction.

  ```cpp
  Minuteur m;                           // constructeur par défaut
  Minuteur m{};                         // idem, sans ambiguïté
  Journal journal{std::string{}};       // un objet, à coup sûr
  ```

  C'est une des raisons d'être de l'initialisation uniforme de C++11.

  **Le cousin : le temporaire sans nom.**

  ```cpp
  std::lock_guard<std::mutex>(verrou);       // déclare une variable nommée verrou !
  ```

  Les parenthèses autour d'un nom sont permises dans une déclaration : cette ligne déclare un `std::lock_guard`
  nommé `verrou`, construit par défaut (ce qui ne compile pas), au lieu de verrouiller le mutex. Avec des accolades,
  `std::lock_guard<std::mutex>{verrou};` crée bien un objet, mais **temporaire**, détruit aussitôt : il faut lui
  donner un nom.

  **Le repérer.** GCC avertit avec `-Wall` : « empty parentheses were disambiguated as a function declaration »
  (`-Wvexing-parse`). Sans avertissement, le symptôme est un programme où un constructeur « n'est pas appelé », ou
  une erreur étrange sur un type de fonction.

  **En entretien** : « `T x();` déclare une fonction, pas un objet : tout ce qui peut être une déclaration en est
  une. J'initialise avec des accolades, qui ne laissent pas d'ambiguïté. »
cards:
  - key: definition
    format: course
    question: "Que déclare la ligne `Minuteur m();` ?"
    choices:
      - {text: "Une fonction `m`, sans paramètre, qui renvoie un `Minuteur`", correct: true}
      - {text: "Un objet `m`, construit par le constructeur par défaut", correct: false}
      - {text: "Un objet `m`, construit sans appeler de constructeur", correct: false}
      - {text: "Un pointeur `m` vers un `Minuteur`, initialisé à nul", correct: false}
    answer: "C'est l'analyse la plus contrariante. Aucun objet n'est créé, et aucun constructeur n'est appelé."
  - key: regle
    format: course
    question: "Quelle règle du langage est à l'origine de l'analyse la plus contrariante ?"
    choices:
      - {text: "Tout ce qui peut être lu comme une déclaration est une déclaration", correct: true}
      - {text: "Tout ce qui peut être lu comme une expression est une expression", correct: false}
      - {text: "Toute variable doit être initialisée avec des parenthèses", correct: false}
      - {text: "Tout constructeur doit être déclaré `explicit`", correct: false}
    answer: "Face à une ligne ambiguë, le compilateur choisit toujours la déclaration, ici celle d'une fonction."
  - key: remede
    format: course
    question: "Quelle écriture construit un objet sans ambiguïté possible avec une déclaration de fonction ?"
    choices:
      - {text: "L'initialisation avec des accolades : `Minuteur m{};`", correct: true}
      - {text: "L'initialisation avec des parenthèses : `Minuteur m();`", correct: false}
      - {text: "La double paire de parenthèses : `Minuteur m()();`", correct: false}
      - {text: "Le mot-clé `auto` devant le nom : `auto Minuteur m();`", correct: false}
    answer: "Des accolades ne peuvent pas introduire une liste de paramètres. `Minuteur m;`, sans rien, convient aussi pour le constructeur par défaut."
  - key: forme-vicieuse
    format: course
    question: "Comment le compilateur lit-il `Journal journal(std::string());` ?"
    choices:
      - {text: "Comme une fonction `journal` dont le paramètre est une fonction renvoyant une `std::string`", correct: true}
      - {text: "Comme un objet `journal` construit à partir d'une chaîne vide temporaire", correct: false}
      - {text: "Comme un objet `journal` construit par défaut, la chaîne étant ignorée", correct: false}
      - {text: "Comme une erreur de syntaxe, signalée sur cette ligne", correct: false}
    answer: "`std::string()` peut se lire comme le type « fonction sans paramètre renvoyant une `std::string` ». La ligne entière devient une déclaration de fonction, acceptée en silence."
  - key: vf-constructeur
    format: true-false
    question: "La ligne `Minuteur m();` appelle le constructeur par défaut de `Minuteur`."
    truth: false
    answer: "Elle déclare une fonction. Aucun constructeur ne s'exécute."
  - key: vf-accolades
    format: true-false
    question: "`Minuteur m{};` peut être lu comme une déclaration de fonction."
    truth: false
    answer: "Les accolades n'ont pas cette ambiguïté : c'est toujours la définition d'un objet."
  - key: vf-erreur-plus-loin
    format: true-false
    question: "L'erreur causée par `Minuteur m();` apparaît le plus souvent à la ligne qui utilise `m`, pas à celle-ci."
    truth: true
    answer: "La déclaration est valide. C'est `m.demarrer()` qui ne compile pas : `m` est une fonction, pas un objet."
  - key: vf-avertissement
    format: true-false
    question: "Avec `-Wall`, GCC signale des parenthèses vides lues comme une déclaration de fonction."
    truth: true
    answer: "C'est `-Wvexing-parse` : « empty parentheses were disambiguated as a function declaration »."
  - key: qcm-defaut
    format: multiple-choice
    question: "Quelle ligne crée un `std::vector<int>` vide ?"
    choices:
      - {text: "`std::vector<int> v;`", correct: true}
      - {text: "`std::vector<int> v();`", correct: false}
      - {text: "`std::vector<int> v(void);`", correct: false}
      - {text: "`std::vector<int> v() = {};`", correct: false}
    answer: "Sans parenthèses, ou avec `{}`. Avec des parenthèses vides, c'est une fonction qui renvoie un vecteur."
  - key: qcm-message
    format: multiple-choice
    question: "Après `Minuteur m();`, que répond GCC à `m.demarrer();` ?"
    choices:
      - {text: "« request for member 'demarrer' in 'm', which is of non-class type 'Minuteur()' »", correct: true}
      - {text: "« 'm' was not declared in this scope; did you mean 'Minuteur'? »", correct: false}
      - {text: "« undefined reference to 'Minuteur::demarrer()' », à l'édition de liens", correct: false}
      - {text: "« use of deleted function 'Minuteur::Minuteur()' », sur la ligne de `m`", correct: false}
    answer: "Le type `Minuteur()` est celui d'une fonction : le message dit que `m` n'est pas un objet de classe."
  - key: qcm-lock-guard
    format: multiple-choice
    question: "Que fait la ligne `std::lock_guard<std::mutex>{verrou};` ?"
    choices:
      - {text: "Elle crée une garde temporaire, détruite aussitôt : le mutex est relâché à la fin de la ligne", correct: true}
      - {text: "Elle verrouille le mutex jusqu'à la fin du bloc, comme une garde nommée", correct: false}
      - {text: "Elle déclare une fonction nommée `verrou`, sans rien verrouiller", correct: false}
      - {text: "Elle ne compile pas : une garde doit recevoir deux arguments", correct: false}
    answer: "Les accolades évitent la déclaration, mais l'objet n'a pas de nom : il meurt au point-virgule. Il faut écrire `std::lock_guard garde{verrou};`."
  - key: qcm-argument
    format: multiple-choice
    question: "Quelle ligne construit un `Journal` à partir d'une chaîne vide ?"
    choices:
      - {text: "`Journal journal{std::string{}};`", correct: true}
      - {text: "`Journal journal(std::string());`", correct: false}
      - {text: "`Journal journal(std::string(void));`", correct: false}
      - {text: "`Journal journal(std::string (*)());`", correct: false}
    answer: "Avec des accolades, l'argument est un objet, et `journal` aussi. Les trois autres lignes déclarent une fonction."
  - key: code-fonction
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Minuteur {
          Minuteur() { std::print("construit "); }
      };

      int main() {
          Minuteur m();
          std::println("fin");
      }
      ```
    choices:
      - {text: "`fin`", correct: true}
      - {text: "`construit fin`", correct: false}
      - {text: "`fin construit`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`fin` : `Minuteur m();` déclare une fonction. Aucun objet n'est construit, donc le constructeur n'affiche rien."
    check:
      output: "fin"
  - key: code-accolades
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Minuteur {
          Minuteur() { std::print("construit "); }
      };

      int main() {
          Minuteur a{};
          Minuteur b();
          Minuteur c;
          std::println("fin");
      }
      ```
    choices:
      - {text: "`construit construit fin`", correct: true}
      - {text: "`construit construit construit fin`", correct: false}
      - {text: "`construit fin`", correct: false}
      - {text: "`fin`", correct: false}
    answer: "`construit construit fin` : `a` et `c` sont des objets. `b()` est la déclaration d'une fonction : rien n'est construit."
    check:
      output: "construit construit fin"
  - key: code-argument
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      struct Journal {
          explicit Journal(const std::string&) { std::print("ouvert "); }
      };

      int main() {
          Journal premier(std::string());
          Journal second{std::string{}};
          std::println("fin");
      }
      ```
    choices:
      - {text: "`ouvert fin`", correct: true}
      - {text: "`ouvert ouvert fin`", correct: false}
      - {text: "`fin`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`ouvert fin` : la première ligne déclare une fonction `premier`. Seule la seconde, avec des accolades, construit un objet."
    check:
      output: "ouvert fin"
  - key: code-utilisation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;
          void incrementer() { ++valeur; }
      };

      int main() {
          Compteur c();
          c.incrementer();
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `c` est une fonction, pas un objet. GCC répond « request for member 'incrementer' in 'c', which is of non-class type 'Compteur()' »."
    check:
      compiles: false
  - key: bug-parentheses-vides
    format: bug-fix
    question: |-
      Le compilateur répond « request for member 'ajouter' in 'panier', which is of non-class type 'Panier()' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Panier {
          int articles = 0;
          void ajouter() { ++articles; }
      };

      int main() {
          Panier panier();
          panier.ajouter();
          std::println("{}", panier.articles);
      }
      ```
    choices:
      - {text: "Écrire `Panier panier;`", correct: true}
      - {text: "Écrire `Panier panier(void);`", correct: false}
      - {text: "Écrire `panier().ajouter();`", correct: false}
      - {text: "Écrire `Panier* panier();`", correct: false}
    answer: |-
      ```cpp
      Panier panier;
      ```
      `Panier panier();` déclare une fonction. Sans parenthèses, ou avec `{}`, c'est un objet construit par défaut.
  - key: bug-constructeur-muet
    format: bug-fix
    question: |-
      Ce programme devrait afficher `connecté`, puis `fin`. Il n'affiche que `fin` : le constructeur ne s'exécute
      pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Connexion {
          Connexion() { std::println("connecté"); }
      };

      int main() {
          Connexion connexion();
          std::println("fin");
      }
      ```
    choices:
      - {text: "Écrire `Connexion connexion{};`", correct: true}
      - {text: "Écrire `Connexion connexion() {};`", correct: false}
      - {text: "Écrire `static Connexion connexion();`", correct: false}
      - {text: "Écrire `Connexion (connexion)();`", correct: false}
    answer: |-
      ```cpp
      Connexion connexion{};
      ```
      La ligne d'origine déclare une fonction : aucun objet n'existe. Avec des accolades, l'objet est construit, et
      son constructeur s'exécute.
  - key: bug-temporaire-en-argument
    format: bug-fix
    question: |-
      Le compilateur répond « request for member 'taille' in 'liste', which is of non-class type
      'Liste(std::vector<int> (*)())' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      struct Liste {
          explicit Liste(std::vector<int> v) : valeurs{v} {}
          std::size_t taille() const { return valeurs.size(); }
          std::vector<int> valeurs;
      };

      int main() {
          Liste liste(std::vector<int>());
          std::println("{}", liste.taille());
      }
      ```
    choices:
      - {text: "Écrire `Liste liste{std::vector<int>{}};`", correct: true}
      - {text: "Écrire `Liste liste(std::vector<int>(void));`", correct: false}
      - {text: "Écrire `Liste liste(std::vector<int> ());`", correct: false}
      - {text: "Écrire `Liste liste(std::vector<int>(*)());`", correct: false}
    answer: |-
      ```cpp
      Liste liste{std::vector<int>{}};
      ```
      Entre parenthèses, `std::vector<int>()` se lit comme un type de fonction, et la ligne comme la déclaration
      d'une fonction `liste`. Les accolades lèvent l'ambiguïté.
  - key: bug-garde-sans-nom
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne de la garde : il la lit comme la déclaration d'une variable `verrou`, sans
      argument. Quelle correction est la bonne ?
      ```cpp
      #include <mutex>
      #include <print>

      std::mutex verrou;
      int compteur = 0;

      int main() {
          std::lock_guard<std::mutex>(verrou);
          ++compteur;
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "Donner un nom à la garde : `std::lock_guard<std::mutex> garde{verrou};`", correct: true}
      - {text: "Doubler les parenthèses : `std::lock_guard<std::mutex>((verrou));`", correct: false}
      - {text: "Retirer l'argument : `std::lock_guard<std::mutex>();`", correct: false}
      - {text: "Ajouter `this->` devant le nom : `std::lock_guard<std::mutex>(this->verrou);`", correct: false}
    answer: |-
      ```cpp
      std::lock_guard<std::mutex> garde{verrou};
      ```
      Des parenthèses autour d'un nom sont permises dans une déclaration : la ligne déclare une garde appelée
      `verrou`. Nommée et initialisée avec des accolades, la garde tient le mutex jusqu'à la fin du bloc.
