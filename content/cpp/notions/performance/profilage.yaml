notion: profilage
lesson: |-
  Un **profileur** dit **où** un programme passe son temps. Sans lui, on optimise au jugé, et l'intuition se trompe
  presque toujours sur l'emplacement du goulot.

  **`perf`, le profileur de Linux.** Il fonctionne par **échantillonnage** : plusieurs centaines de fois par
  seconde, il interrompt le programme et note la fonction en cours, avec sa pile d'appels. Une fonction présente
  dans 30 % des échantillons occupe environ 30 % du temps. Le surcoût est faible, et le programme n'a pas à être
  modifié.

  **Préparer le binaire.** On profile la version **optimisée**, celle qui sera livrée, avec les informations de
  débogage pour retrouver les noms :

  ```
  g++ -O2 -g -fno-omit-frame-pointer main.cpp -o programme
  ```

  `-g` ne ralentit pas le programme. `-fno-omit-frame-pointer` permet à `perf` de reconstituer les piles d'appels.

  **Les commandes.**

  ```
  perf stat ./programme            # compteurs globaux : cycles, instructions, défauts de cache, branch-misses
  perf record -g ./programme       # échantillonne, et écrit perf.data
  perf report                      # affiche les fonctions, de la plus coûteuse à la moins coûteuse
  ```

  Dans `perf report`, deux colonnes comptent :

  - **Self** : le temps passé dans le code **propre** de la fonction ;
  - **Children** : ce temps, plus celui des fonctions qu'elle appelle.

  Une fonction au **Children** élevé et au **Self** faible ne fait que déléguer : le coût est plus bas dans la pile.

  **Le graphe en flammes** (*flame graph*). C'est une image des piles échantillonnées.

  - Chaque **rectangle** est une fonction ; sa **largeur** est la part du temps où elle était sur la pile.
  - L'axe **vertical** est la profondeur des appels : une fonction repose sur celle qui l'a appelée.
  - L'axe **horizontal n'est pas le temps** : les fonctions sont rangées par ordre alphabétique, et les piles
    identiques fusionnées.
  - Les couleurs n'ont pas de signification.

  On cherche les **plateaux larges au sommet** : des fonctions qui consomment elles-mêmes le temps. Un rectangle
  large en bas est simplement un ancêtre de tout le reste, comme `main`.

  ```
  perf script | stackcollapse-perf.pl | flamegraph.pl > flammes.svg
  ```

  **Lire avec méthode.**

  1. Profiler une **charge représentative** : des données réalistes, assez longtemps.
  2. Repérer les deux ou trois fonctions qui dominent.
  3. Se demander **pourquoi** : trop d'appels, un mauvais algorithme, des allocations (`malloc`), des copies
     (`memcpy`), des défauts de cache ?
  4. Corriger **une** chose, puis **mesurer de nouveau**.

  **Les autres outils.** `gprof` et Callgrind (Valgrind) instrumentent ou simulent : précis, mais lents. VTune
  (Intel), Instruments (macOS) et le profileur de Visual Studio font le même travail que `perf` ailleurs.

  **En entretien** : « Je profile le binaire optimisé, compilé avec `-g`, sur une charge réaliste. `perf record`
  puis `perf report`, ou un graphe en flammes où la largeur d'une fonction est sa part du temps. Je corrige le
  premier goulot, et je mesure de nouveau. »
cards:
  - key: role
    format: course
    question: "À quoi sert un profileur ?"
    choices:
      - {text: "À montrer dans quelles fonctions le programme passe son temps", correct: true}
      - {text: "À corriger automatiquement les fonctions les plus lentes", correct: false}
      - {text: "À vérifier que le programme ne contient pas de fuite de mémoire", correct: false}
      - {text: "À mesurer la taille de l'exécutable sur le disque", correct: false}
    answer: "Il désigne le goulot d'étranglement par la mesure. Sans lui, on optimise des fonctions qui ne comptent pas."
  - key: echantillonnage
    format: course
    question: "Comment `perf record` détermine-t-il le temps passé dans chaque fonction ?"
    choices:
      - {text: "Il interrompt le programme à intervalles réguliers, et note la fonction en cours", correct: true}
      - {text: "Il ajoute un chronomètre au début et à la fin de chaque fonction", correct: false}
      - {text: "Il exécute le programme instruction par instruction, dans un simulateur", correct: false}
      - {text: "Il lit le code source, et compte les lignes de chaque fonction", correct: false}
    answer: "C'est un profileur par échantillonnage : statistique, mais très léger. Une fonction vue dans 30 % des échantillons occupe environ 30 % du temps."
  - key: largeur
    format: course
    question: "Dans un graphe en flammes, que représente la largeur d'un rectangle ?"
    choices:
      - {text: "La part du temps pendant laquelle la fonction était sur la pile d'appels", correct: true}
      - {text: "Le nombre de lignes de code que contient la fonction", correct: false}
      - {text: "L'instant où la fonction a été appelée pour la première fois", correct: false}
      - {text: "Le nombre d'arguments que la fonction reçoit", correct: false}
    answer: "Plus un rectangle est large, plus la fonction, avec ce qu'elle appelle, pèse dans le temps total. L'axe horizontal n'est pas une chronologie."
  - key: quel-binaire
    format: course
    question: "Quel binaire profile-t-on pour trouver un goulot d'étranglement ?"
    choices:
      - {text: "La version optimisée, compilée en plus avec `-g`", correct: true}
      - {text: "La version de débogage, compilée avec `-O0`", correct: false}
      - {text: "La version instrumentée par AddressSanitizer", correct: false}
      - {text: "La version sans symboles, la plus petite possible", correct: false}
    answer: "Le profil d'une version non optimisée ne ressemble pas à celui du programme livré. `-g` ajoute les noms et les lignes, sans ralentir."
  - key: vf-axe-horizontal
    format: true-false
    question: "Dans un graphe en flammes, l'axe horizontal représente le déroulement du temps."
    truth: false
    answer: "Les piles sont triées par ordre alphabétique et fusionnées. Seule la largeur a un sens."
  - key: vf-g-ralentit
    format: true-false
    question: "Compiler avec `-g` ralentit l'exécution du programme."
    truth: false
    answer: "Les informations de débogage sont rangées à part dans le fichier : le code exécuté est le même."
  - key: vf-self
    format: true-false
    question: "Dans `perf report`, la colonne « Self » compte le temps passé dans le code propre de la fonction, sans ses appels."
    truth: true
    answer: "« Children » y ajoute le temps des fonctions appelées. Une fonction qui délègue a un « Self » faible."
  - key: vf-intuition
    format: true-false
    question: "L'intuition d'un développeur expérimenté suffit en général à localiser un goulot d'étranglement."
    truth: false
    answer: "Les mesures contredisent très souvent l'intuition. C'est la raison d'être du profileur."
  - key: qcm-sommet
    format: multiple-choice
    question: "Dans un graphe en flammes, que cherche-t-on en premier ?"
    choices:
      - {text: "Les plateaux larges au sommet des piles", correct: true}
      - {text: "Les rectangles les plus étroits, tout en bas", correct: false}
      - {text: "Les rectangles de couleur la plus vive", correct: false}
      - {text: "Les rectangles situés le plus à gauche", correct: false}
    answer: "Un plateau large au sommet est une fonction qui consomme elle-même du temps. Un rectangle large en bas, comme `main`, n'est que l'ancêtre de tout."
  - key: qcm-compteurs
    format: multiple-choice
    question: "Quelle commande affiche les compteurs globaux d'une exécution : cycles, instructions, défauts de cache ?"
    choices:
      - {text: "`perf stat ./programme`", correct: true}
      - {text: "`perf report`", correct: false}
      - {text: "`g++ -g ./programme`", correct: false}
      - {text: "`time --verbose`", correct: false}
    answer: "`perf stat` lit les compteurs matériels du processeur, pour toute l'exécution."
  - key: qcm-frame-pointer
    format: multiple-choice
    question: "À quoi sert l'option `-fno-omit-frame-pointer` quand on profile ?"
    choices:
      - {text: "À permettre au profileur de reconstituer les piles d'appels", correct: true}
      - {text: "À accélérer le programme pendant le profilage", correct: false}
      - {text: "À désactiver l'inlining des fonctions", correct: false}
      - {text: "À supprimer les informations de débogage", correct: false}
    answer: "Le registre de cadre relie chaque fonction à son appelant. Sans lui, `perf` voit la fonction en cours, mais pas qui l'a appelée."
  - key: qcm-malloc
    format: multiple-choice
    question: "Le profil montre `malloc` et `free` en tête. Que cherches-tu ?"
    choices:
      - {text: "Les fonctions qui les appellent : copies, conteneurs sans `reserve`, objets temporaires", correct: true}
      - {text: "Une version plus récente de la bibliothèque C, où `malloc` est plus rapide", correct: false}
      - {text: "Une faute dans le profileur, qui confond `malloc` avec une autre fonction", correct: false}
      - {text: "Une option du compilateur qui désactive les appels à `malloc`", correct: false}
    answer: "`malloc` n'est pas le coupable, mais le symptôme. Le graphe en flammes montre, sous `malloc`, qui alloue."
  - key: trous-record
    format: fill-in
    question: |-
      Complète la commande qui échantillonne le programme, avec les piles d'appels :
      ```
      perf ___ -g ./programme
      ```
    blanks:
      - [record]
    answer: "`perf record -g` écrit les échantillons dans le fichier `perf.data`."
  - key: trous-report
    format: fill-in
    question: |-
      Complète la commande qui affiche le résultat de l'échantillonnage :
      ```
      perf ___
      ```
    blanks:
      - [report]
    answer: "`perf report` lit `perf.data`, et liste les fonctions par coût décroissant."
  - key: trous-stat
    format: fill-in
    question: |-
      Complète la commande qui affiche les compteurs globaux de l'exécution :
      ```
      perf ___ ./programme
      ```
    blanks:
      - [stat]
    answer: "`perf stat` donne les cycles, les instructions, les défauts de cache et les erreurs de prédiction."
  - key: trous-g
    format: fill-in
    question: |-
      Complète la commande pour que le profil affiche les noms des fonctions et les lignes :
      ```
      g++ -O2 -___ -fno-omit-frame-pointer main.cpp -o programme
      ```
    blanks:
      - [g]
    answer: "`-g` ajoute les informations de débogage, que le profileur utilise pour nommer ce qu'il voit."
  - key: situation-intuition
    format: scenario
    question: |-
      Un service est lent. L'équipe est convaincue que le coupable est l'algorithme de tri, et prévoit deux semaines
      pour le réécrire. Personne n'a mesuré. Que proposes-tu ?
    choices:
      - {text: "Profiler d'abord sur une charge réaliste : dix minutes de `perf` avant deux semaines de travail", correct: true}
      - {text: "Réécrire le tri tout de suite : une équipe entière ne peut pas se tromper", correct: false}
      - {text: "Compiler le service en `-O0`, pour voir si le tri devient plus lent", correct: false}
      - {text: "Ajouter des `std::println` dans le tri, pour compter ses appels", correct: false}
    answer: |-
      Le profil dira si le tri pèse 60 % ou 2 % du temps. Dans le second cas, le réécrire parfaitement ne gagnerait
      presque rien.
  - key: situation-plateau
    format: scenario
    question: |-
      Sur un graphe en flammes, `traiter_requete` occupe 90 % de la largeur. Au-dessus d'elle, un plateau
      `std::string::append` en occupe 55 %. Que conclus-tu ?
    choices:
      - {text: "Que plus de la moitié du temps part en concaténations de chaînes dans cette fonction", correct: true}
      - {text: "Que `traiter_requete` est appelée 90 fois, et `append` 55 fois", correct: false}
      - {text: "Que `append` s'exécute avant `traiter_requete`, puisqu'elle est au-dessus", correct: false}
      - {text: "Que le profileur s'est trompé : une fonction de la bibliothèque ne peut pas être lente", correct: false}
    answer: |-
      Le rectangle large du bas est l'ancêtre ; le plateau du haut est ce qui consomme. On regardera comment la
      chaîne est construite : un `reserve`, ou `std::format`, peuvent supprimer l'essentiel des réallocations.
  - key: situation-debug
    format: scenario
    question: |-
      Un collègue profile la construction de débogage (`-O0`), et conclut que `std::vector::operator[]` est le
      goulot du programme. Que lui réponds-tu ?
    choices:
      - {text: "Qu'en `-O0` rien n'est inliné : il faut profiler la version optimisée", correct: true}
      - {text: "Qu'il doit remplacer tous les `operator[]` par des appels à `at()`", correct: false}
      - {text: "Qu'il doit remplacer tous les vecteurs par des tableaux de style C", correct: false}
      - {text: "Qu'il a raison : `operator[]` est lent dans toutes les constructions", correct: false}
    answer: |-
      Sans optimisation, chaque accès est un vrai appel de fonction ; optimisé, il devient une seule instruction. Le
      profil d'une construction de débogage décrit un autre programme.
  - key: situation-apres
    format: scenario
    question: |-
      Tu as corrigé la fonction qui pesait 40 % du profil. Le programme n'est que 5 % plus rapide. Que fais-tu ?
    choices:
      - {text: "Je profile de nouveau : le goulot s'est déplacé, ou la correction n'a pas eu l'effet attendu", correct: true}
      - {text: "Je continue à optimiser la même fonction, jusqu'à ce que le gain atteigne 40 %", correct: false}
      - {text: "Je reviens à l'ancienne version, puisque le gain est trop faible", correct: false}
      - {text: "Je conclus que le profileur s'est trompé, et je me fie à mon intuition", correct: false}
    answer: |-
      On mesure après chaque changement. Le nouveau profil montre soit un autre goulot, soit que la fonction
      corrigée attendait en réalité autre chose : mémoire, verrou, entrées-sorties.
