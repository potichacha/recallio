notion: mesurer-avant
lesson: |-
  « L'optimisation prématurée est la racine de tous les maux. » La phrase de Donald Knuth ne dit pas de négliger
  les performances : elle dit de ne pas optimiser **à l'aveugle**. L'intuition sur ce qui est lent se trompe
  presque toujours. Un programme passe en général 90 % de son temps dans 10 % de son code, et ce ne sont pas les
  10 % qu'on croit.

  **La méthode.**

  1. **Fixer un objectif** : quelle opération, en combien de temps.
  2. **Mesurer** le programme tel qu'il est.
  3. **Profiler** pour trouver où part le temps.
  4. **Corriger le point chaud**, et lui seul.
  5. **Mesurer de nouveau** : garder le changement s'il gagne, l'annuler sinon.

  **Chronométrer.** Pour mesurer une durée, on prend **`std::chrono::steady_clock`** : elle ne recule jamais.
  `system_clock` est l'heure du système, qui peut être réglée pendant la mesure.

  ```cpp
  const auto debut = std::chrono::steady_clock::now();
  traiter(donnees);
  const auto fin = std::chrono::steady_clock::now();
  const auto duree = std::chrono::duration_cast<std::chrono::milliseconds>(fin - debut);
  std::println("{} ms", duree.count());
  ```

  **Les règles d'une mesure honnête.**

  - Sur une construction **optimisée** (`-O2`) : à `-O0`, on mesure autre chose que ce qu'on livre.
  - **Plusieurs fois** : la première exécution paie le chargement des caches. On retient la médiane ou le
    minimum, pas une valeur isolée.
  - Avec des **données réalistes**, en taille et en contenu.
  - En s'assurant que le résultat est **utilisé** : sinon l'optimiseur supprime le calcul, et l'on mesure du vide.
  - Sur une machine **calme**.

  **Profiler.** Un **profileur** dit où le programme passe son temps, fonction par fonction, sans qu'on ait à
  deviner.

  | Outil | Principe |
  |---|---|
  | `perf` (Linux) | échantillonne la pile plusieurs milliers de fois par seconde ; presque aucun ralentissement |
  | `gprof`, Callgrind (Valgrind) | instrumente ou simule : précis, mais très lent |
  | VTune, Instruments, Visual Studio Profiler | profileurs graphiques |
  | graphe en flammes (*flame graph*) | une image des piles d'appels : la largeur est le temps |

  On compile avec `-O2 -g` : optimisé, avec les noms de fonctions.

  **Les micro-mesures.** Pour comparer deux versions d'une petite fonction, une bibliothèque comme **Google
  Benchmark** répète l'appel, stabilise la mesure, et empêche l'optimiseur de supprimer le code
  (`benchmark::DoNotOptimize`).

  **Où chercher d'abord.** L'ordre des gains habituels :

  1. l'**algorithme** et la structure de données : passer de O(n²) à O(n log n) bat toutes les micro-optimisations ;
  2. les **allocations** et les **copies** inutiles ;
  3. la **disposition en mémoire** : contiguïté, cache ;
  4. en dernier, les astuces de bas niveau.

  **Ce qu'il ne faut pas mesurer pour décider.** Le temps de la construction de débogage, une seule exécution, un
  cas jouet de dix éléments.

  **Rester lisible.** Une optimisation rend souvent le code plus difficile à lire. Sans mesure qui la justifie,
  c'est une dette, pas un gain. Et on la protège par un test de performance, pour qu'elle ne régresse pas.

  **En entretien** : « Je n'optimise pas sans mesure. Je chronomètre avec `steady_clock`, sur une construction
  optimisée et plusieurs exécutions, puis je profile, avec `perf` par exemple, pour trouver le point chaud. Je
  commence par l'algorithme et les allocations, et je re-mesure après chaque changement. »
cards:
  - key: pourquoi-mesurer
    format: course
    question: "Pourquoi mesurer avant d'optimiser un programme ?"
    choices:
      - {text: "L'intuition se trompe sur l'endroit lent : le temps se concentre dans une petite partie du code", correct: true}
      - {text: "Le compilateur refuse d'optimiser un programme qui n'a jamais été chronométré", correct: false}
      - {text: "Une mesure accélère le programme, en chargeant ses données dans le cache", correct: false}
      - {text: "Le standard impose de publier les temps d'exécution de chaque fonction", correct: false}
    answer: "Optimiser un code qui compte pour 1 % du temps ne rapporte rien, même en le rendant dix fois plus rapide. Le profileur désigne les quelques pour cent qui comptent."
  - key: horloge
    format: course
    question: "Quelle horloge de `<chrono>` utilise-t-on pour mesurer une durée ?"
    choices:
      - {text: "`std::chrono::steady_clock`, qui ne recule jamais", correct: true}
      - {text: "`std::chrono::system_clock`, qui suit l'heure du système", correct: false}
      - {text: "`std::chrono::utc_clock`, qui compte les secondes intercalaires", correct: false}
      - {text: "`std::chrono::file_clock`, qui date les fichiers", correct: false}
    answer: "`steady_clock` est monotone. `system_clock` peut être avancée ou reculée pendant la mesure, par une synchronisation de l'heure."
  - key: profileur
    format: course
    question: "Que fournit un profileur ?"
    choices:
      - {text: "La répartition du temps d'exécution entre les fonctions du programme", correct: true}
      - {text: "La liste des fautes de mémoire rencontrées pendant l'exécution", correct: false}
      - {text: "La liste des avertissements que le compilateur n'a pas affichés", correct: false}
      - {text: "La version optimisée du code source, prête à être compilée", correct: false}
    answer: "Il montre où part le temps, sans qu'on ait à deviner. Les fautes de mémoire sont l'affaire des sanitizers."
  - key: par-ou-commencer
    format: course
    question: "Par où commence-t-on, en général, pour accélérer un programme lent ?"
    choices:
      - {text: "Par l'algorithme et la structure de données du point chaud", correct: true}
      - {text: "Par la réécriture des boucles en assembleur", correct: false}
      - {text: "Par le remplacement de chaque `i++` par `++i`", correct: false}
      - {text: "Par l'ajout de `inline` à toutes les fonctions", correct: false}
    answer: "Changer de complexité rapporte des facteurs dix ou mille. Viennent ensuite les allocations, les copies, puis la disposition en mémoire. Les astuces de bas niveau sont pour la fin."
  - key: vf-debug
    format: true-false
    question: "Une mesure faite sur la construction de débogage (`-O0`) prédit bien les performances en production."
    truth: false
    answer: "Sans optimisation, les coûts relatifs sont bouleversés : les abstractions y sont très lentes. On mesure la construction optimisée."
  - key: vf-une-fois
    format: true-false
    question: "Une seule exécution chronométrée suffit pour comparer deux versions d'une fonction."
    truth: false
    answer: "Le bruit (cache, autres programmes, fréquence du processeur) dépasse souvent l'écart cherché. On répète, et l'on compare des médianes ou des minimums."
  - key: vf-knuth
    format: true-false
    question: "La phrase de Knuth sur l'optimisation prématurée conseille de ne jamais se soucier des performances."
    truth: false
    answer: "Elle met en garde contre l'optimisation sans mesure, des parties qui ne comptent pas. Knuth ajoute qu'il ne faut pas négliger les quelques pour cent critiques."
  - key: vf-resultat-utilise
    format: true-false
    question: "Si le résultat d'un calcul chronométré n'est jamais utilisé, l'optimiseur peut supprimer le calcul."
    truth: true
    answer: "On mesure alors une boucle vide. Il faut utiliser le résultat (l'afficher, l'additionner), ou passer par `benchmark::DoNotOptimize`."
  - key: qcm-perf
    format: multiple-choice
    question: "Quel outil, sous Linux, profile un programme par échantillonnage, presque sans le ralentir ?"
    choices:
      - {text: "`perf`", correct: true}
      - {text: "`ldd`", correct: false}
      - {text: "`ar`", correct: false}
      - {text: "`c++filt`", correct: false}
    answer: "`perf record` relève la pile d'appels des milliers de fois par seconde ; `perf report` montre les fonctions les plus coûteuses."
  - key: qcm-options
    format: multiple-choice
    question: "Avec quelles options compile-t-on un programme pour le profiler ?"
    choices:
      - {text: "`-O2 -g` : optimisé, avec les noms de fonctions", correct: true}
      - {text: "`-O0 -g` : sans optimisation, pour plus de précision", correct: false}
      - {text: "`-O0` seul : sans rien qui gêne la mesure", correct: false}
      - {text: "`-fsanitize=address` : pour voir toutes les fonctions", correct: false}
    answer: "On profile ce qu'on livre : le code optimisé. `-g` n'influe pas sur le code produit ; il permet au profileur de nommer les fonctions et les lignes."
  - key: qcm-micro-mesure
    format: multiple-choice
    question: "Quelle bibliothèque sert à comparer finement deux versions d'une petite fonction ?"
    choices:
      - {text: "Google Benchmark", correct: true}
      - {text: "GoogleTest", correct: false}
      - {text: "doctest", correct: false}
      - {text: "Boost.Asio", correct: false}
    answer: "Elle répète l'appel jusqu'à obtenir une mesure stable, et fournit de quoi empêcher l'optimiseur d'effacer le code mesuré."
  - key: qcm-duree
    format: multiple-choice
    question: "Quelle ligne convertit en millisecondes la durée `fin - debut` de deux `steady_clock::now()` ?"
    choices:
      - {text: "`std::chrono::duration_cast<std::chrono::milliseconds>(fin - debut)`", correct: true}
      - {text: "`std::chrono::milliseconds(fin) - std::chrono::milliseconds(debut)`", correct: false}
      - {text: "`static_cast<std::chrono::milliseconds>(fin) - debut`", correct: false}
      - {text: "`(fin - debut).milliseconds()`", correct: false}
    answer: "La différence de deux instants est une durée. `duration_cast` la convertit dans l'unité voulue ; `count()` en donne le nombre."
  - key: situation-intuition
    format: scenario
    question: |-
      Un service met trois secondes à répondre. Un collègue est certain que le tri est en cause, et veut passer une
      semaine à écrire un tri sur mesure. Que proposes-tu d'abord ?
    choices:
      - {text: "Profiler une requête : dix minutes suffisent à voir où partent les trois secondes", correct: true}
      - {text: "Écrire le tri sur mesure, puis vérifier s'il a servi à quelque chose", correct: false}
      - {text: "Ajouter des threads partout, pour diviser le temps par le nombre de cœurs", correct: false}
      - {text: "Recompiler avec `-O3`, et s'en tenir là quel que soit le résultat", correct: false}
    answer: |-
      Le profileur remplace la conviction par un fait. Si le tri pèse 2 % du temps, la semaine serait perdue ; le
      coupable est souvent une requête, une allocation ou une copie que personne ne soupçonnait.
  - key: situation-mesure-vide
    format: scenario
    question: |-
      Tu chronomètres une boucle qui calcule une somme sur un million d'éléments, compilée avec `-O2`. Elle
      s'exécute en zéro nanoseconde. Que s'est-il passé ?
    choices:
      - {text: "La somme n'étant jamais utilisée, l'optimiseur a supprimé la boucle", correct: true}
      - {text: "L'horloge `steady_clock` ne mesure pas les durées inférieures à une seconde", correct: false}
      - {text: "Le processeur a mis le résultat en cache lors d'une exécution précédente", correct: false}
      - {text: "La boucle s'exécute dans un autre thread, que l'horloge ne voit pas", correct: false}
    answer: |-
      Un calcul sans effet observable est du code mort. Pour le mesurer, il faut que son résultat serve : l'afficher,
      ou le confier à `benchmark::DoNotOptimize`. Une mesure trop belle est une mesure fausse.
  - key: situation-regression
    format: scenario
    question: |-
      Après une optimisation délicate, une fonction critique passe de 40 ms à 5 ms. Six mois plus tard, quelqu'un
      la « simplifie », et elle revient à 40 ms sans que personne ne le remarque. Comment l'aurais-tu évité ?
    choices:
      - {text: "Par un test de performance lancé en intégration continue, qui échoue au-delà d'un seuil", correct: true}
      - {text: "Par un commentaire en majuscules interdisant de modifier la fonction", correct: false}
      - {text: "Par la compilation de cette fonction en `-O0`, pour la figer", correct: false}
      - {text: "Par la suppression des tests unitaires de cette fonction", correct: false}
    answer: |-
      Une performance que rien ne vérifie finit par se perdre. Une mesure automatique, avec une marge, signale la
      régression le jour même, comme un test signale un bug.
  - key: situation-lisibilite
    format: scenario
    question: |-
      En revue de code, une fonction d'initialisation, appelée une fois au démarrage, a été réécrite avec des
      opérations sur les bits et des tableaux précalculés, « pour la vitesse ». Elle est devenue illisible. Que
      demandes-tu ?
    choices:
      - {text: "La mesure qui justifie ce changement ; sans gain mesurable, revenir à la version lisible", correct: true}
      - {text: "D'appliquer la même réécriture à toutes les fonctions du projet", correct: false}
      - {text: "D'ajouter `inline` à la fonction, pour la rendre plus rapide encore", correct: false}
      - {text: "Rien : un code plus rapide est toujours préférable à un code lisible", correct: false}
    answer: |-
      Une fonction exécutée une fois ne pèse rien dans le temps total. L'optimisation a un coût certain, la
      lisibilité, et un bénéfice nul. Sans mesure, c'est de la dette.
