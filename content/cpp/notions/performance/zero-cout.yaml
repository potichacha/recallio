notion: zero-cout
lesson: |-
  Le **principe du zéro coût** (*zero-overhead principle*) est la ligne directrice de C++, formulée par son
  créateur, Bjarne Stroustrup, en deux phrases :

  1. **Ce que tu n'utilises pas, tu ne le paies pas.**
  2. **Ce que tu utilises, tu ne pourrais pas raisonnablement l'écrire mieux à la main.**

  « Zéro coût » ne veut pas dire « gratuit » : une fonction virtuelle coûte une indirection. Cela veut dire **pas
  de surcoût** par rapport au code bas niveau équivalent, et aucun coût pour qui s'en passe.

  **Première moitié : pas de taxe cachée.**

  - Une classe **sans fonction virtuelle** n'a pas de pointeur de table virtuelle : un `struct Point { int x, y; }`
    occupe huit octets, comme en C.
  - Sans exception **lancée**, le chemin normal n'est pas ralenti.
  - Pas de ramasse-miettes, pas de vérification d'indice imposée, pas d'objet alloué sur le tas sans qu'on le
    demande.

  **Seconde moitié : des abstractions qui disparaissent à la compilation.**

  | Abstraction | Ce que le compilateur en fait |
  |---|---|
  | `std::unique_ptr<T>` | un pointeur brut, et un `delete` au bon endroit |
  | `std::array<int, 4>` | un tableau `int[4]` |
  | une lambda passée à `std::sort` | le corps recopié dans la boucle : aucun appel |
  | un template | du code spécialisé pour chaque type, sans indirection |
  | `std::span`, `std::string_view` | un pointeur et une taille |
  | une boucle sur un intervalle | la boucle d'indices qu'on aurait écrite |
  | `constexpr` | un calcul fait à la compilation : une constante dans le binaire |

  C'est l'optimiseur qui tient la promesse : à `-O0`, ces abstractions ont un coût ; à `-O2`, il s'évapore.

  **Ce qui se paie, et pourquoi.** Certaines fonctionnalités ont un coût réel, mais seulement **quand on s'en
  sert** :

  | Fonctionnalité | Coût |
  |---|---|
  | fonction virtuelle | un pointeur par objet, une indirection par appel, et moins d'inlining |
  | `std::shared_ptr` | un bloc de contrôle, un compteur atomique à chaque copie |
  | `std::function` | un effacement de type, parfois une allocation |
  | exception lancée | très lente, face à un simple retour |
  | `dynamic_cast`, RTTI | une recherche à l'exécution |

  D'où l'habitude de choisir l'outil **le plus simple qui convient** : `std::unique_ptr` avant `std::shared_ptr`,
  un template ou une lambda avant `std::function`.

  **Les limites du principe.** Les abstractions ne sont pas gratuites **à la compilation** : les templates
  allongent la construction et grossissent le binaire. Et le principe ne dispense pas de mesurer : une abstraction
  mal employée (copier un vecteur par valeur) coûte ce qu'elle fait.

  **Ce que cela change dans la pratique.** On n'a pas à choisir entre du code lisible et du code rapide : un
  `std::vector` parcouru par un algorithme vaut la boucle sur un tableau brut, la sûreté en plus. Écrire « à la
  main » pour gagner du temps est presque toujours une fausse économie.

  **En entretien** : « Le principe du zéro coût : on ne paie pas ce qu'on n'utilise pas, et ce qu'on utilise est
  aussi efficace que le code écrit à la main. Un `unique_ptr` vaut un pointeur brut, un template ou une lambda
  s'inlinent. Les coûts réels, virtuel, `shared_ptr`, `std::function`, ne se paient que si on les choisit. »
cards:
  - key: principe
    format: course
    question: "Qu'énonce le principe du zéro coût de C++ ?"
    choices:
      - {text: "On ne paie pas ce qu'on n'utilise pas, et ce qu'on utilise vaut le code écrit à la main", correct: true}
      - {text: "Toutes les fonctionnalités du langage s'exécutent sans consommer de temps", correct: false}
      - {text: "Le compilateur et la bibliothèque standard sont distribués gratuitement", correct: false}
      - {text: "Un programme C++ n'alloue jamais de mémoire sans que le système la facture", correct: false}
    answer: "Deux moitiés : aucune taxe pour les fonctionnalités dont on se passe, et des abstractions aussi efficaces que leur équivalent bas niveau."
  - key: pas-gratuit
    format: course
    question: "« Zéro coût » veut-il dire qu'une fonction virtuelle ne coûte rien ?"
    choices:
      - {text: "Non : elle coûte une indirection, mais seulement aux classes qui en déclarent", correct: true}
      - {text: "Oui : le compilateur supprime toujours l'indirection d'un appel virtuel", correct: false}
      - {text: "Oui : une fonction virtuelle est plus rapide qu'une fonction ordinaire", correct: false}
      - {text: "Non : elle ralentit toutes les classes du programme, virtuelles ou non", correct: false}
    answer: "Le principe parle de surcoût : l'appel virtuel vaut ce qu'on écrirait à la main avec un pointeur de fonction, et une classe sans `virtual` n'en porte aucune trace."
  - key: abstraction
    format: course
    question: "Que devient un `std::unique_ptr<T>` une fois le programme compilé avec optimisation ?"
    choices:
      - {text: "Un pointeur brut, avec un `delete` placé au bon endroit", correct: true}
      - {text: "Un pointeur brut, accompagné d'un compteur de références", correct: false}
      - {text: "Un objet de seize octets, qui garde aussi la taille allouée", correct: false}
      - {text: "Un appel au ramasse-miettes à chaque fin de fonction", correct: false}
    answer: "Il a la taille d'un pointeur, et ses fonctions s'inlinent. La sûreté est vérifiée à la compilation : elle ne coûte rien à l'exécution."
  - key: qui-tient-la-promesse
    format: course
    question: "Qu'est-ce qui fait disparaître le coût des abstractions de la bibliothèque standard ?"
    choices:
      - {text: "L'optimiseur, qui inline les petites fonctions et les templates", correct: true}
      - {text: "Le préprocesseur, qui remplace les classes par des macros", correct: false}
      - {text: "L'éditeur de liens, qui retire les classes du programme", correct: false}
      - {text: "Le système d'exploitation, qui accélère le code générique", correct: false}
    answer: "Sans optimisation (`-O0`), chaque `operator[]` ou `begin()` est un vrai appel. À `-O2`, tout est recopié sur place et simplifié."
  - key: vf-struct
    format: true-false
    question: "Une classe sans fonction virtuelle contient un pointeur de table virtuelle."
    truth: false
    answer: "Ce pointeur n'existe que si la classe a au moins une fonction virtuelle : on ne paie pas ce qu'on n'utilise pas."
  - key: vf-lambda
    format: true-false
    question: "Une lambda passée à `std::sort` est en général inlinée dans la boucle de tri."
    truth: true
    answer: "Son type est connu à la compilation : le compilateur recopie son corps. Un pointeur de fonction, lui, impose souvent un appel."
  - key: vf-shared-ptr
    format: true-false
    question: "Copier un `std::shared_ptr` ne coûte pas plus que copier un pointeur brut."
    truth: false
    answer: "Chaque copie incrémente un compteur atomique. C'est un coût réel, qu'on paie parce qu'on a choisi la possession partagée."
  - key: vf-compilation
    format: true-false
    question: "Le principe du zéro coût garantit aussi des temps de compilation courts."
    truth: false
    answer: "Il parle de l'exécution. Les templates et l'inlining se paient à la compilation, et dans la taille du binaire."
  - key: qcm-coute
    format: multiple-choice
    question: "Laquelle de ces fonctionnalités a un coût à l'exécution, même avec optimisation ?"
    choices:
      - {text: "`std::function`", correct: true}
      - {text: "`std::array`", correct: false}
      - {text: "`std::span`", correct: false}
      - {text: "`constexpr`", correct: false}
    answer: "`std::function` efface le type de l'appelable : un appel indirect, parfois une allocation. Les trois autres se réduisent à un tableau, à un pointeur et une taille, et à une constante."
  - key: qcm-auteur
    format: multiple-choice
    question: "Qui a formulé le principe du zéro coût ?"
    choices:
      - {text: "Bjarne Stroustrup, le créateur de C++", correct: true}
      - {text: "Dennis Ritchie, le créateur de C", correct: false}
      - {text: "James Gosling, le créateur de Java", correct: false}
      - {text: "Linus Torvalds, le créateur de Linux", correct: false}
    answer: "C'est l'un des principes de conception qu'il a fixés au langage dès l'origine."
  - key: qcm-choisir
    format: multiple-choice
    question: "Un objet a un seul propriétaire. Quel pointeur respecte le mieux « ne paie que ce que tu utilises » ?"
    choices:
      - {text: "`std::unique_ptr`", correct: true}
      - {text: "`std::shared_ptr`", correct: false}
      - {text: "`std::weak_ptr`", correct: false}
      - {text: "`std::shared_ptr` et un `std::weak_ptr`", correct: false}
    answer: "`std::unique_ptr` n'a ni compteur ni bloc de contrôle. La possession partagée est une fonctionnalité de plus : on ne la prend que si on en a besoin."
  - key: qcm-constexpr
    format: multiple-choice
    question: "Que coûte à l'exécution une valeur calculée par une fonction `constexpr` dans une constante `constexpr` ?"
    choices:
      - {text: "Rien : le calcul est fait à la compilation", correct: true}
      - {text: "Un appel de fonction au démarrage", correct: false}
      - {text: "Un appel de fonction à chaque lecture", correct: false}
      - {text: "Une allocation sur le tas", correct: false}
    answer: "Le résultat est une constante écrite dans le binaire. C'est du zéro coût au sens strict."
  - key: situation-tableau-brut
    format: scenario
    question: |-
      Un collègue remplace les `std::vector` et les algorithmes d'un module par des tableaux bruts, `new[]` et des
      boucles d'indices, « parce que les abstractions ralentissent ». Le module est compilé avec `-O2`. Que lui
      réponds-tu ?
    choices:
      - {text: "Qu'avec optimisation le vecteur vaut le tableau brut : il perd la sûreté sans gagner de vitesse", correct: true}
      - {text: "Qu'il a raison : un `std::vector` est toujours deux fois plus lent qu'un tableau", correct: false}
      - {text: "Qu'il doit aller plus loin, et réécrire les boucles en assembleur", correct: false}
      - {text: "Qu'un tableau brut est interdit par le standard depuis C++11", correct: false}
    answer: |-
      C'est le principe du zéro coût : `v[i]`, `begin()` et les algorithmes s'inlinent, et le code produit est
      celui du tableau brut. En échange, il réintroduit les fuites et les débordements. S'il a un doute, il mesure.
  - key: situation-debug-lent
    format: scenario
    question: |-
      Un programme plein de petites classes et d'itérateurs est dix fois plus lent en mode débogage (`-O0`) qu'en
      mode optimisé. Un débutant en conclut que les abstractions de C++ sont coûteuses. Que lui expliques-tu ?
    choices:
      - {text: "Que le zéro coût dépend de l'optimiseur : à `-O0`, rien n'est inliné, et chaque accesseur est un appel", correct: true}
      - {text: "Que le mode débogage ajoute un ramasse-miettes, qui ralentit les petites classes", correct: false}
      - {text: "Que les itérateurs sont interprétés à l'exécution quand on compile en mode débogage", correct: false}
      - {text: "Que le mode optimisé supprime les classes, et que le programme ne fait donc plus le même travail", correct: false}
    answer: |-
      La promesse est tenue à la compilation optimisée : les petites fonctions sont recopiées sur place et
      simplifiées. On juge les performances sur la construction optimisée, jamais sur celle de débogage.
  - key: situation-std-function
    format: scenario
    question: |-
      Une fonction de traitement est appelée des millions de fois, et reçoit son critère dans un
      `std::function<bool(int)>`. Le profileur y montre du temps perdu. Le critère est toujours une lambda connue
      à la compilation. Que proposes-tu ?
    choices:
      - {text: "Un paramètre template : la lambda est inlinée, sans effacement de type", correct: true}
      - {text: "Un `std::shared_ptr` vers la `std::function`, pour éviter sa copie", correct: false}
      - {text: "Une fonction virtuelle à la place de la `std::function`", correct: false}
      - {text: "Une macro à la place de la lambda", correct: false}
    answer: |-
      `std::function` sert à ranger un appelable de type inconnu : cette souplesse a un coût. Quand le type est
      connu, un template (`template <typename F>`, ou `auto` en paramètre) laisse le compilateur recopier le
      corps de la lambda.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Pourquoi utiliser C++ plutôt qu'un langage à ramasse-miettes pour un moteur
      de jeu ? » Quelle réponse s'appuie sur le principe du zéro coût ?
    choices:
      - {text: "On y maîtrise ce qui coûte : pas de pause imposée, et des abstractions aussi rapides que le code bas niveau", correct: true}
      - {text: "On y écrit moins de lignes, ce qui rend le programme plus rapide", correct: false}
      - {text: "On n'y alloue jamais de mémoire, ce qui évite toute lenteur", correct: false}
      - {text: "On y dispose d'un ramasse-miettes plus rapide que celui des autres langages", correct: false}
    answer: |-
      C++ n'impose aucun mécanisme d'exécution qu'on n'a pas demandé, et ses abstractions se compilent en code
      direct. Le programmeur décide où va le temps, ce qui compte quand chaque image doit tenir en quelques
      millisecondes.
  - key: definition-zero-cout
    format: definition
    question: "Qu'est-ce qu'une abstraction à coût nul ?"
    choices:
      - {text: "Une abstraction qui, une fois compilée, n'est pas plus lente que le code bas niveau équivalent", correct: true}
      - {text: "Une abstraction qui ne demande aucune ligne de code à celui qui l'utilise", correct: false}
      - {text: "Une abstraction dont les fonctions ne sont jamais appelées", correct: false}
      - {text: "Une abstraction qui n'occupe aucun octet dans le fichier source", correct: false}
    answer: "Exemples : `std::unique_ptr`, `std::array`, `std::span`. Leur intérêt (sûreté, lisibilité) est gagné à la compilation."
  - key: definition-surcout
    format: definition
    question: "Qu'appelle-t-on le « surcoût » (overhead) d'une fonctionnalité ?"
    choices:
      - {text: "Le temps ou la mémoire qu'elle ajoute, par rapport au strict nécessaire", correct: true}
      - {text: "Le prix de la licence du compilateur qui la fournit", correct: false}
      - {text: "Le nombre de lignes qu'il faut écrire pour s'en servir", correct: false}
      - {text: "Le temps passé par le programmeur à l'apprendre", correct: false}
    answer: "Le compteur d'un `std::shared_ptr`, le pointeur de table virtuelle d'un objet polymorphe sont des surcoûts : réels, et choisis."
  - key: definition-inlining
    format: definition
    question: "Qu'est-ce que l'inlining ?"
    choices:
      - {text: "Le remplacement d'un appel de fonction par le corps de la fonction", correct: true}
      - {text: "Le regroupement de plusieurs fichiers source en un seul", correct: false}
      - {text: "L'écriture de plusieurs instructions sur une seule ligne", correct: false}
      - {text: "Le chargement d'une bibliothèque au lancement du programme", correct: false}
    answer: "C'est l'optimisation qui rend les petites fonctions gratuites, et qui ouvre la voie aux autres simplifications."
  - key: definition-effacement
    format: definition
    question: "Qu'appelle-t-on l'effacement de type, dont se sert `std::function` ?"
    choices:
      - {text: "Cacher le type réel d'un objet derrière une interface commune, résolue à l'exécution", correct: true}
      - {text: "Supprimer du binaire les types qui ne servent pas", correct: false}
      - {text: "Convertir toutes les variables en `void*` à la compilation", correct: false}
      - {text: "Retirer le `const` d'un type avec `const_cast`", correct: false}
    answer: "Une `std::function` peut tenir n'importe quel appelable de la bonne signature. Le prix : un appel indirect, que le compilateur inline rarement."
