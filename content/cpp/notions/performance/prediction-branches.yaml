notion: prediction-branches
lesson: |-
  Un processeur moderne n'exécute pas les instructions une par une : il en prépare **plusieurs dizaines d'avance**,
  dans un pipeline. Quand il rencontre un **branchement** (un `if`, la condition d'une boucle), il ne sait pas
  encore de quel côté ira le programme. Plutôt que d'attendre, il **devine**, et commence à exécuter la branche
  supposée : c'est l'**exécution spéculative**.

  - S'il a **bien deviné**, le branchement ne coûte presque rien.
  - S'il s'est **trompé**, il jette le travail commencé et repart de l'autre côté : une perte de l'ordre de
    **10 à 20 cycles**, soit quelques nanosecondes.

  **Le prédicteur apprend.** Il mémorise l'histoire de chaque branchement. Une condition presque toujours vraie, ou
  qui suit un motif régulier, est prédite à plus de 99 %. Une condition qui dépend de **données aléatoires** est
  prédite une fois sur deux.

  **L'exemple classique.**

  ```cpp
  for (int x : donnees) {
      if (x >= 128) {
          somme += x;
      }
  }
  ```

  Sur des données **triées**, la condition est fausse pendant toute la première moitié, puis vraie : prédiction
  parfaite. Sur les mêmes données **mélangées**, la boucle peut être plusieurs fois plus lente, pour le même
  nombre d'instructions.

  **Les remèdes.**

  - **Rendre les données prévisibles** : trier, regrouper par cas.
  - **Supprimer le branchement** : écrire un calcul à la place d'un test. Le compilateur transforme souvent un
    ternaire simple en **déplacement conditionnel** (`cmov`), sans saut.

    ```cpp
    somme += (x >= 128) ? x : 0;
    ```

  - **Sortir de la boucle** un test qui ne dépend pas de l'élément.

  **`[[likely]]` et `[[unlikely]]` (C++20).** Ces attributs disent au **compilateur** quelle branche est la plus
  probable.

  ```cpp
  if (erreur) [[unlikely]] {
      traiter_erreur();
  }
  ```

  Ils ne commandent pas le prédicteur du processeur, qui apprend tout seul. Ils servent à **disposer le code** : le
  chemin fréquent en ligne droite, le chemin rare relégué plus loin, hors du cache d'instructions. Le gain est
  modeste, et une indication **fausse** ralentit. On ne les pose que sur un chemin mesuré, typiquement la gestion
  d'erreur dans une boucle chaude. L'optimisation guidée par profil (PGO) fait ce travail mieux, à partir de
  mesures réelles.

  **Mesurer.** `perf stat` affiche le nombre de `branch-misses`. Un taux de quelques pour cent sur une boucle
  chaude mérite un regard.

  **En entretien** : « Le processeur devine l'issue de chaque branchement ; une erreur coûte une quinzaine de
  cycles. Les branches imprévisibles, sur des données aléatoires, coûtent cher : je trie, ou je remplace le test
  par un calcul. `[[likely]]` et `[[unlikely]]` aident le compilateur à disposer le code, à condition d'avoir
  mesuré. »
cards:
  - key: principe
    format: course
    question: "Que fait le processeur quand il rencontre un branchement dont il ne connaît pas encore l'issue ?"
    choices:
      - {text: "Il devine la branche, et commence à l'exécuter avant de savoir", correct: true}
      - {text: "Il attend que la condition soit calculée, sans rien exécuter", correct: false}
      - {text: "Il exécute les deux branches en entier, et garde le bon résultat", correct: false}
      - {text: "Il demande au système d'exploitation quelle branche prendre", correct: false}
    answer: "C'est l'exécution spéculative. Bien deviné, le branchement est presque gratuit ; mal deviné, le travail commencé est jeté."
  - key: cout-erreur
    format: course
    question: "Quel est l'ordre de grandeur du coût d'une erreur de prédiction de branchement ?"
    choices:
      - {text: "Une quinzaine de cycles du processeur", correct: true}
      - {text: "Un seul cycle du processeur", correct: false}
      - {text: "Une milliseconde", correct: false}
      - {text: "Le temps d'une allocation sur le tas, multiplié par mille", correct: false}
    answer: "Le pipeline est vidé puis rempli de nouveau : de 10 à 20 cycles, soit quelques nanosecondes. Répété des millions de fois, cela se voit."
  - key: imprevisible
    format: course
    question: "Quel branchement le processeur prédit-il le plus mal ?"
    choices:
      - {text: "Celui dont la condition dépend de données aléatoires", correct: true}
      - {text: "Celui dont la condition est presque toujours vraie", correct: false}
      - {text: "Celui qui termine une boucle de mille tours", correct: false}
      - {text: "Celui dont la condition alterne régulièrement", correct: false}
    answer: "Le prédicteur apprend les habitudes et les motifs. Sans motif, il se trompe environ une fois sur deux."
  - key: attributs
    format: course
    question: "À quoi servent les attributs `[[likely]]` et `[[unlikely]]` ?"
    choices:
      - {text: "À dire au compilateur quelle branche est la plus probable, pour qu'il dispose le code en conséquence", correct: true}
      - {text: "À forcer le prédicteur du processeur à choisir toujours la branche marquée", correct: false}
      - {text: "À supprimer la branche marquée `[[unlikely]]` du programme compilé", correct: false}
      - {text: "À vérifier à l'exécution que la branche marquée est bien la plus fréquente", correct: false}
    answer: "Le chemin fréquent est placé en ligne droite, le chemin rare plus loin. Le prédicteur du processeur, lui, apprend seul."
  - key: vf-tri
    format: true-false
    question: "Une boucle dont le `if` dépend des données peut être plus rapide sur des données triées que sur les mêmes données mélangées."
    truth: true
    answer: "Triées, les données rendent la condition prévisible : fausse d'abord, vraie ensuite. Le prédicteur ne se trompe presque plus."
  - key: vf-likely-gratuit
    format: true-false
    question: "Poser `[[likely]]` sur une branche est toujours bénéfique, même sans mesure."
    truth: false
    answer: "Une indication fausse dispose mal le code, et ralentit le chemin réellement fréquent. On mesure d'abord."
  - key: vf-ternaire
    format: true-false
    question: "Le compilateur peut traduire un ternaire simple en déplacement conditionnel, sans branchement."
    truth: true
    answer: "L'instruction `cmov` choisit une valeur sans sauter : rien à prédire. C'est une des façons de supprimer un branchement imprévisible."
  - key: vf-meme-instructions
    format: true-false
    question: "Deux exécutions qui font le même nombre d'instructions prennent toujours le même temps."
    truth: false
    answer: "Les erreurs de prédiction et les défauts de cache changent le temps, à nombre d'instructions égal."
  - key: qcm-mesurer
    format: multiple-choice
    question: "Quel outil affiche le nombre d'erreurs de prédiction de branchement d'un programme, sous Linux ?"
    choices:
      - {text: "`perf stat`", correct: true}
      - {text: "`clang-format`", correct: false}
      - {text: "`cmake --build`", correct: false}
      - {text: "`g++ -Wall`", correct: false}
    answer: "`perf stat` lit les compteurs matériels du processeur, dont `branch-misses`."
  - key: qcm-ecriture
    format: multiple-choice
    question: "Comment marques-tu comme rare la branche d'erreur d'un `if`, en C++20 ?"
    choices:
      - {text: "`if (erreur) [[unlikely]] { ... }`", correct: true}
      - {text: "`[[unlikely]] if (erreur) { ... }`", correct: false}
      - {text: "`if [[unlikely]] (erreur) { ... }`", correct: false}
      - {text: "`if (unlikely erreur) { ... }`", correct: false}
    answer: "L'attribut se place après la condition, devant l'instruction de la branche."
  - key: qcm-remede
    format: multiple-choice
    question: "Une boucle chaude contient un `if` sur des données aléatoires. Quel remède supprime le branchement ?"
    choices:
      - {text: "Écrire `somme += (x >= 128) ? x : 0;`", correct: true}
      - {text: "Écrire `if (x >= 128) [[likely]] { somme += x; }`", correct: false}
      - {text: "Écrire la condition `x > 127` à la place de `x >= 128`", correct: false}
      - {text: "Écrire la boucle `while` à la place de la boucle `for`", correct: false}
    answer: "Un calcul sans saut n'a rien à prédire. Un attribut ne rend pas prévisible une condition qui ne l'est pas."
  - key: qcm-pgo
    format: multiple-choice
    question: "Quelle technique donne au compilateur les probabilités réelles de chaque branche, sans attribut ?"
    choices:
      - {text: "L'optimisation guidée par profil (PGO)", correct: true}
      - {text: "La compilation en mode `Debug`", correct: false}
      - {text: "L'option `-Wall`", correct: false}
      - {text: "Le préprocesseur", correct: false}
    answer: "On exécute une version instrumentée sur des données représentatives, puis on recompile avec le profil obtenu."
  - key: situation-tri
    format: scenario
    question: |-
      Une boucle filtre un million de mesures avec `if (mesure > seuil)`. Elle met 6 ms sur des mesures triées, et
      25 ms sur les mêmes mesures dans le désordre. Le nombre d'instructions est identique. Comment l'expliques-tu ?
    choices:
      - {text: "Dans le désordre, le branchement est imprévisible : le processeur se trompe une fois sur deux", correct: true}
      - {text: "Dans le désordre, le compilateur produit davantage d'instructions pour la boucle", correct: false}
      - {text: "Dans le désordre, le vecteur doit être réalloué à chaque tour de boucle", correct: false}
      - {text: "Dans le désordre, la comparaison de deux nombres est plus lente", correct: false}
    answer: |-
      Les durées sont des ordres de grandeur, mais l'écart est typique. Triées, les mesures donnent une condition
      qui ne change qu'une fois. Mélangées, chaque erreur coûte une quinzaine de cycles.
  - key: situation-likely
    format: scenario
    question: |-
      Un collègue a parsemé tout le projet de `[[likely]]` et `[[unlikely]]`, d'après son intuition. Les mesures ne
      montrent aucun gain, et une fonction a ralenti. Que lui proposes-tu ?
    choices:
      - {text: "De les retirer, sauf sur les chemins d'erreur de boucles chaudes dont la fréquence est mesurée", correct: true}
      - {text: "D'en ajouter sur chaque `if` du projet, pour que le gain devienne visible", correct: false}
      - {text: "De remplacer chaque `[[likely]]` par `[[unlikely]]`, et inversement", correct: false}
      - {text: "De compiler sans optimisation, pour que les attributs soient pris en compte", correct: false}
    answer: |-
      Le prédicteur du processeur apprend déjà seul. Les attributs n'influencent que la disposition du code, pour un
      gain modeste, et une intuition fausse coûte. Avec PGO, le compilateur obtient ces probabilités par la mesure.
  - key: situation-sortir-le-test
    format: scenario
    question: |-
      Une boucle sur dix millions d'éléments teste à chaque tour `if (mode == Mode::Verbeux)`, un réglage qui ne
      change pas pendant la boucle. Que proposes-tu pour alléger la boucle ?
    choices:
      - {text: "Tester le mode une fois avant la boucle, et écrire deux boucles spécialisées", correct: true}
      - {text: "Marquer le test `[[likely]]`, et le laisser dans la boucle", correct: false}
      - {text: "Déclarer la variable `mode` avec le mot-clé `volatile`", correct: false}
      - {text: "Trier les éléments avant la boucle", correct: false}
    answer: |-
      Ce branchement est parfaitement prédit, mais il encombre la boucle et peut gêner la vectorisation. Sorti de
      la boucle, il n'est évalué qu'une fois. Le compilateur le fait parfois de lui-même.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande pourquoi un tri préalable peut accélérer un traitement qui ne dépend pas de
      l'ordre des éléments. Que réponds-tu ?
    choices:
      - {text: "Le tri rend les branchements du traitement prévisibles, et le processeur ne se trompe plus", correct: true}
      - {text: "Le tri réduit le nombre d'éléments que le traitement doit parcourir", correct: false}
      - {text: "Le tri place les éléments sur la pile, où ils sont plus rapides à lire", correct: false}
      - {text: "Le tri permet au compilateur de supprimer la boucle du traitement", correct: false}
    answer: |-
      Une condition sur des données triées change de valeur une seule fois. Il faut bien sûr que le gain dépasse le
      coût du tri : on mesure.
  - key: definition-prediction
    format: definition
    question: "Qu'est-ce que la prédiction de branchement ?"
    choices:
      - {text: "Le mécanisme par lequel le processeur devine l'issue d'un saut conditionnel", correct: true}
      - {text: "Le calcul, par le compilateur, du nombre de tours d'une boucle", correct: false}
      - {text: "Le choix, par le programmeur, de l'ordre des branches d'un `switch`", correct: false}
      - {text: "La vérification, à l'exécution, qu'une condition n'est jamais fausse", correct: false}
    answer: "Elle s'appuie sur l'histoire récente de chaque branchement, et permet au pipeline de ne pas attendre."
  - key: definition-speculative
    format: definition
    question: "Qu'appelle-t-on l'exécution spéculative ?"
    choices:
      - {text: "L'exécution d'instructions avant de savoir si elles devront l'être", correct: true}
      - {text: "L'exécution d'un programme dans un bac à sable", correct: false}
      - {text: "L'exécution d'une fonction dans un autre thread", correct: false}
      - {text: "L'exécution d'un programme sans optimisation", correct: false}
    answer: "Si la supposition était juste, le travail est gardé ; sinon, il est annulé, au prix de quelques cycles."
  - key: definition-pipeline
    format: definition
    question: "Qu'est-ce que le pipeline d'un processeur ?"
    choices:
      - {text: "La chaîne d'étapes où plusieurs instructions avancent en même temps", correct: true}
      - {text: "La file d'attente des threads qui attendent le processeur", correct: false}
      - {text: "La mémoire cache la plus proche du processeur", correct: false}
      - {text: "La table où le compilateur range les fonctions virtuelles", correct: false}
    answer: "Chaque instruction avance d'étape en étape. Une erreur de prédiction oblige à vider la chaîne et à la remplir de nouveau."
  - key: definition-cmov
    format: definition
    question: "Qu'est-ce qu'un déplacement conditionnel (`cmov`) ?"
    choices:
      - {text: "Une instruction qui copie une valeur selon une condition, sans saut", correct: true}
      - {text: "Une instruction qui saute à une adresse lue en mémoire", correct: false}
      - {text: "Une instruction qui déplace un objet du tas vers la pile", correct: false}
      - {text: "Une instruction qui échange le contenu de deux registres", correct: false}
    answer: "Comme elle ne saute pas, il n'y a rien à prédire. Le compilateur l'emploie pour des ternaires simples."
