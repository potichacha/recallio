notion: using-alias
lesson: |-
  Un **alias de type** donne un second nom à un type existant. Il ne crée **pas** un nouveau type : les deux noms
  sont interchangeables.

  ```cpp
  using Identifiant = int;
  using Notes = std::vector<double>;

  Notes notes{12.5, 15.0};      // exactement un std::vector<double>
  ```

  **`using` ou `typedef`.** `typedef` est la forme héritée du C ; `using`, depuis C++11, fait la même chose avec
  une syntaxe plus lisible : le nouveau nom à gauche, le type à droite.

  ```cpp
  typedef std::vector<double> Notes;        // ancien : le nom est à la fin
  using Notes = std::vector<double>;        // moderne

  typedef void (*Rappel)(int);              // ancien : le nom est au milieu
  using Rappel = void (*)(int);             // moderne
  ```

  Et seul `using` peut être un **template** :

  ```cpp
  template <typename T>
  using Dictionnaire = std::map<std::string, T>;

  Dictionnaire<int> ages;       // std::map<std::string, int>
  ```

  On écrit donc `using` dans le code nouveau, et l'on sait lire `typedef`.

  **À quoi sert un alias.**

  - **Raccourcir** un type long : `using Table = std::map<std::string, std::vector<int>>;`.
  - **Nommer une intention** : `using Identifiant = int;` dit ce que l'entier représente.
  - **Changer en un seul endroit** : si `Identifiant` doit devenir un `long`, une ligne suffit.

  **Ce qu'un alias ne fait pas.** Il ne protège de rien : `Identifiant` et `Age`, tous deux alias de `int`, se
  mélangent sans erreur. Deux fonctions surchargées sur ces deux noms sont **la même fonction**, déclarée deux
  fois. Pour un type vraiment distinct, on écrit une `struct` ou une `enum class`.

  **Les alias de la bibliothèque.** `std::size_t`, `std::string` (alias de `std::basic_string<char>`),
  `std::int32_t`, et dans chaque conteneur `value_type`, `iterator`, `size_type`.

  **Portée.** Un alias suit les règles habituelles : global, dans un espace de noms, dans une classe ou dans une
  fonction.

  **En entretien** : « `using Nom = Type;` crée un alias, pas un type : les deux noms désignent la même chose. Il
  remplace `typedef`, se lit mieux, et peut être un template. Pour distinguer deux entiers de sens différents, il
  faut un vrai type. »
tour:
  - title: Donner un nom à un type
    text: |-
      `using` donne un second nom à un type. Le programme y gagne en lisibilité : `Notes` dit ce que contient le
      vecteur, et s'écrit plus vite.

      Ce n'est qu'un autre nom : une variable `Notes` est exactement un `std::vector<double>`.

      Essaie : remplace `double` par `int` dans l'alias, puis exécute. Une seule ligne change le type partout.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <vector>

          using Notes = std::vector<double>;

          double moyenne(const Notes& notes) {
              double total = 0;
              for (double note : notes) {
                  total += note;
              }
              return total / notes.size();
          }

          int main() {
              const Notes notes{12, 15, 9};
              std::println("{}", moyenne(notes));
          }
      output: "12"
cards:
  - key: alias
    format: course
    question: "Que fait `using Identifiant = int;` ?"
    choices:
      - {text: "Il donne un second nom au type `int` : les deux sont interchangeables", correct: true}
      - {text: "Il crée un nouveau type, distinct de `int`, que le compilateur ne mélange pas", correct: false}
      - {text: "Il crée une variable `Identifiant`, de type `int`", correct: false}
      - {text: "Il importe le nom `Identifiant` depuis un espace de noms", correct: false}
    answer: "Un alias n'est qu'un autre nom. Une fonction qui attend un `Identifiant` accepte n'importe quel `int`."
  - key: using-ou-typedef
    format: course
    question: "Qu'apporte `using` par rapport à `typedef` ?"
    choices:
      - {text: "Une syntaxe plus lisible, et la possibilité d'écrire un alias template", correct: true}
      - {text: "La création d'un type distinct, que `typedef` ne permet pas", correct: false}
      - {text: "Une compilation plus rapide du programme", correct: false}
      - {text: "La possibilité de changer le type pendant l'exécution", correct: false}
    answer: "Les deux créent le même alias. `using` met le nom à gauche, et accepte `template <typename T>` devant lui."
  - key: pas-un-type
    format: course
    question: "`using Age = int;` et `using Taille = int;`. Peut-on passer une `Taille` à une fonction qui attend un `Age` ?"
    choices:
      - {text: "Oui : les deux alias désignent le même type `int`", correct: true}
      - {text: "Non : le compilateur refuse de confondre deux alias", correct: false}
      - {text: "Oui, mais seulement avec un `static_cast`", correct: false}
      - {text: "Non : un alias ne peut pas servir de type de paramètre", correct: false}
    answer: "Un alias ne protège pas des confusions. Pour que le compilateur les refuse, il faut deux vrais types : des `struct`, par exemple."
  - key: interet
    format: course
    question: "Quel est l'intérêt d'écrire `using Table = std::map<std::string, std::vector<int>>;` ?"
    choices:
      - {text: "Raccourcir un type long, et pouvoir le changer en un seul endroit", correct: true}
      - {text: "Accélérer les recherches dans la map", correct: false}
      - {text: "Empêcher la map d'être copiée", correct: false}
      - {text: "Réserver la mémoire de la map à la compilation", correct: false}
    answer: "L'alias n'a aucun effet à l'exécution. Il rend le code plus court, et concentre le choix du type sur une ligne."
  - key: vf-nouveau-type
    format: true-false
    question: "Un alias créé avec `using` est un type distinct de celui qu'il nomme."
    truth: false
    answer: "C'est le même type, sous un autre nom."
  - key: vf-template
    format: true-false
    question: "Un alias écrit avec `typedef` peut être un template."
    truth: false
    answer: "Seul `using` le permet : `template <typename T> using Liste = std::vector<T>;`."
  - key: vf-string
    format: true-false
    question: "`std::string` est lui-même un alias."
    truth: true
    answer: "C'est un alias de `std::basic_string<char>`."
  - key: vf-portee
    format: true-false
    question: "Un alias peut être déclaré à l'intérieur d'une fonction."
    truth: true
    answer: "Il n'est alors visible que dans cette fonction, comme une variable locale."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Quelle ligne déclare `Notes` comme alias de `std::vector<double>` ?"
    choices:
      - {text: "`using Notes = std::vector<double>;`", correct: true}
      - {text: "`using std::vector<double> = Notes;`", correct: false}
      - {text: "`alias Notes = std::vector<double>;`", correct: false}
      - {text: "`typedef Notes std::vector<double>;`", correct: false}
    answer: "Avec `using`, le nouveau nom est à gauche du `=`. Avec `typedef`, il vient en dernier : `typedef std::vector<double> Notes;`."
  - key: qcm-typedef
    format: multiple-choice
    question: "Quelle ligne `using` équivaut à `typedef unsigned long Compteur;` ?"
    choices:
      - {text: "`using Compteur = unsigned long;`", correct: true}
      - {text: "`using unsigned long = Compteur;`", correct: false}
      - {text: "`using Compteur(unsigned long);`", correct: false}
      - {text: "`using Compteur : unsigned long;`", correct: false}
    answer: "`typedef Type Nom;` devient `using Nom = Type;`."
  - key: qcm-template
    format: multiple-choice
    question: "Après `template <typename T> using Paire = std::pair<T, T>;`, quel est le type `Paire<int>` ?"
    choices:
      - {text: "`std::pair<int, int>`", correct: true}
      - {text: "`std::pair<T, int>`", correct: false}
      - {text: "`std::pair<int>`", correct: false}
      - {text: "`std::vector<int>`", correct: false}
    answer: "`T` est remplacé par `int` aux deux endroits."
  - key: qcm-surcharge
    format: multiple-choice
    question: "`using Age = int;` Que se passe-t-il si l'on définit `void afficher(int);` et `void afficher(Age);` avec un corps chacune ?"
    choices:
      - {text: "Une erreur : la même fonction est définie deux fois", correct: true}
      - {text: "Deux surcharges, choisies selon le nom du type", correct: false}
      - {text: "La seconde remplace la première en silence", correct: false}
      - {text: "Une erreur : un alias ne peut pas être un paramètre", correct: false}
    answer: "`Age` et `int` sont le même type : les deux fonctions ont la même signature."
  - key: trous-using
    format: fill-in
    question: |-
      Complète pour créer l'alias :
      ```cpp
      ___ Identifiant = int;
      ```
    blanks:
      - [using]
    answer: "`using Nom = Type;` déclare un alias de type."
  - key: trous-egal
    format: fill-in
    question: |-
      Complète la déclaration de l'alias :
      ```cpp
      using Notes ___ std::vector<double>;
      ```
    blanks:
      - ["="]
    answer: "Le nouveau nom, le signe `=`, puis le type."
  - key: trous-typedef
    format: fill-in
    question: |-
      Complète la forme ancienne de `using Notes = std::vector<double>;` :
      ```cpp
      ___ std::vector<double> Notes;
      ```
    blanks:
      - [typedef]
    answer: "`typedef Type Nom;` est la forme héritée du C."
  - key: trous-template
    format: fill-in
    question: |-
      Complète pour que `Liste<int>` désigne `std::vector<int>` :
      ```cpp
      template <typename T>
      using Liste = std::vector<___>;
      ```
    blanks:
      - [T]
    answer: "Le paramètre `T` de l'alias est transmis au vecteur."
  - key: code-meme-type
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>

      using Identifiant = int;

      int main() {
          const Identifiant id = 42;
          const int copie = id;
          std::println("{} {}", copie, std::is_same_v<Identifiant, int>);
      }
      ```
    choices:
      - {text: "`42 true`", correct: true}
      - {text: "`42 false`", correct: false}
      - {text: "`0 true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42 true` : `Identifiant` et `int` sont un seul et même type. Aucune conversion n'a lieu."
    check:
      output: "42 true"
  - key: code-conteneur
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      using Stock = std::map<std::string, int>;

      int main() {
          Stock stock{{"pomme", 3}};
          stock["kiwi"] = 5;
          std::println("{} {}", stock.size(), stock["pomme"] + stock["kiwi"]);
      }
      ```
    choices:
      - {text: "`2 8`", correct: true}
      - {text: "`1 3`", correct: false}
      - {text: "`2 5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 8` : `Stock` est une `std::map<std::string, int>`, avec toutes ses fonctions."
    check:
      output: "2 8"
  - key: code-template
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      template <typename T>
      using Paire = std::pair<T, T>;

      int main() {
          const Paire<int> p{3, 4};
          const Paire<double> q{0.5, 1.5};
          std::println("{} {}", p.first + p.second, q.first + q.second);
      }
      ```
    choices:
      - {text: "`7 2`", correct: true}
      - {text: "`7 2.0`", correct: false}
      - {text: "`34 0.51.5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7 2` : `Paire<int>` est un `std::pair<int, int>`, `Paire<double>` un `std::pair<double, double>`. Le double 2.0 s'affiche `2`."
    check:
      output: "7 2"
  - key: code-surcharge
    format: code-output
    question: |-
      ```cpp
      #include <print>

      using Age = int;

      void afficher(int) {
          std::print("entier ");
      }

      void afficher(double) {
          std::print("réel ");
      }

      int main() {
          const Age age = 30;
          afficher(age);
          afficher(1.5);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`entier réel fin`", correct: true}
      - {text: "`réel réel fin`", correct: false}
      - {text: "`entier entier fin`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`entier réel fin` : `Age` est un `int`. La surcharge choisie est celle de `int`."
    check:
      output: "entier réel fin"
  - key: bug-ordre-inverse
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne de l'alias. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      using std::vector<int> = Entiers;

      int main() {
          const Entiers v{1, 2, 3};
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Écrire `using Entiers = std::vector<int>;`", correct: true}
      - {text: "Écrire `using Entiers : std::vector<int>;`", correct: false}
      - {text: "Écrire `typedef Entiers = std::vector<int>;`", correct: false}
      - {text: "Écrire `using Entiers == std::vector<int>;`", correct: false}
    answer: |-
      ```cpp
      using Entiers = std::vector<int>;
      ```
      Le nouveau nom est à gauche du `=`, le type existant à droite.
  - key: bug-typedef-template
    format: bug-fix
    question: |-
      Le compilateur répond « template declaration of 'typedef' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      template <typename T>
      typedef std::vector<T> Liste;

      int main() {
          const Liste<int> v{1, 2, 3};
          std::println("{}", v.size());
      }
      ```
    choices:
      - {text: "Écrire `using Liste = std::vector<T>;` sous la ligne `template`", correct: true}
      - {text: "Écrire `typedef std::vector<T> Liste<T>;` sous la ligne `template`", correct: false}
      - {text: "Retirer la ligne `template <typename T>`, et garder le `typedef`", correct: false}
      - {text: "Écrire `typedef template std::vector<T> Liste;` sur une seule ligne", correct: false}
    answer: |-
      ```cpp
      template <typename T>
      using Liste = std::vector<T>;
      ```
      Un `typedef` ne peut pas être un template. C'est la raison d'être des alias `using`.
  - key: bug-redefinition
    format: bug-fix
    question: |-
      Le compilateur répond « redefinition of 'void afficher(Taille)' ». L'auteur voulait deux fonctions différentes
      pour un âge et une taille. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      using Age = int;
      using Taille = int;

      void afficher(Age a) {
          std::println("{} ans", a);
      }

      void afficher(Taille t) {
          std::println("{} cm", t);
      }

      int main() {
          afficher(Age{30});
      }
      ```
    choices:
      - {text: "Faire de `Age` et de `Taille` deux `struct`, chacune avec un membre `int`", correct: true}
      - {text: "Écrire `typedef` à la place de `using` pour les deux alias", correct: false}
      - {text: "Déclarer `Taille` comme alias de `Age` : `using Taille = Age;`", correct: false}
      - {text: "Ajouter `const` au paramètre de la seconde fonction", correct: false}
    answer: |-
      ```cpp
      struct Age { int valeur; };
      struct Taille { int valeur; };
      ```
      Deux alias de `int` sont le même type : les deux fonctions ont la même signature. Pour surcharger, il faut
      deux types distincts.
  - key: bug-alias-apres-usage
    format: bug-fix
    question: |-
      Le compilateur répond « 'Notes' does not name a type ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      Notes charger() {
          return {12.0, 15.0};
      }

      using Notes = std::vector<double>;

      int main() {
          std::println("{}", charger().size());
      }
      ```
    choices:
      - {text: "Placer la ligne `using Notes = ...;` avant la fonction `charger`", correct: true}
      - {text: "Placer la ligne `using Notes = ...;` dans la fonction `main`", correct: false}
      - {text: "Écrire `std::Notes` comme type de retour de `charger`", correct: false}
      - {text: "Écrire `auto Notes = std::vector<double>;` à la place", correct: false}
    answer: |-
      ```cpp
      using Notes = std::vector<double>;

      Notes charger() {
          return {12.0, 15.0};
      }
      ```
      Un alias doit être déclaré avant d'être utilisé : le compilateur lit le fichier de haut en bas.
