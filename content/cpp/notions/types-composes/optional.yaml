notion: optional
lesson: |-
  **`std::optional<T>`** (C++17, dans `<optional>`) contient **une valeur de type `T`, ou rien**. Il dit dans le type
  ce qu'un entier à -1 ou un pointeur nul ne disent que par convention : « il peut ne pas y avoir de résultat ».

  ```cpp
  std::optional<int> position(const std::string& texte, char lettre) {
      for (std::size_t i = 0; i < texte.size(); ++i) {
          if (texte[i] == lettre) {
              return static_cast<int>(i);   // une valeur
          }
      }
      return std::nullopt;                  // rien
  }
  ```

  **Savoir s'il y a une valeur** : `opt.has_value()`, ou directement `if (opt)`.

  **Lire la valeur.**

  | Écriture | Si l'optional est vide |
  |---|---|
  | `*opt` (et `opt->membre`) | **comportement indéfini** : aucun contrôle |
  | `opt.value()` | lève `std::bad_optional_access` |
  | `opt.value_or(defaut)` | renvoie `defaut` |

  On teste donc avant de déréférencer, ou on passe par `value_or`.

  - Un `std::optional` vide vaut **`std::nullopt`** ; `opt.reset()` le vide.
  - La valeur est rangée **dans l'optional**, sans allocation dynamique.
  - Depuis C++23, on enchaîne sans `if` : `opt.transform(f)`, `opt.and_then(f)`, `opt.or_else(f)`.

  **Quand s'en servir.** Pour le résultat d'une recherche, d'une conversion, d'une lecture de configuration : chaque
  fois que l'absence est un cas normal. Si l'appelant doit savoir **pourquoi** il n'y a pas de résultat, c'est
  `std::expected` (C++23) ou une exception.

  **Piège classique : `std::optional<bool>`.** `if (opt)` teste la **présence** d'une valeur, pas la valeur. Un
  optional qui contient `false` est « vrai » dans un `if`.

  **En entretien** : « `std::optional` rend l'absence visible dans la signature, au lieu d'une valeur sentinelle. Je
  ne déréférence jamais sans avoir testé ; pour une valeur de repli, `value_or`. »
cards:
  - key: role-de-optional
    format: course
    question: "Que représente un `std::optional<int>` ?"
    choices:
      - {text: "Un entier, ou l'absence d'entier", correct: true}
      - {text: "Un entier dont la valeur peut changer", correct: false}
      - {text: "Un entier, ou un message d'erreur", correct: false}
      - {text: "Un pointeur vers un entier alloué dynamiquement", correct: false}
    answer: "Une valeur ou rien. Il n'alloue pas : la valeur est rangée dans l'optional. Une valeur ou une erreur, c'est `std::expected`."
  - key: pourquoi-pas-moins-un
    format: course
    question: "Pourquoi renvoyer un `std::optional<int>` plutôt que -1 quand une recherche échoue ?"
    choices:
      - {text: "L'absence est écrite dans le type : l'appelant ne peut pas l'ignorer par mégarde", correct: true}
      - {text: "Un `std::optional` est plus rapide à renvoyer qu'un entier", correct: false}
      - {text: "La valeur -1 ne tient pas dans un `int`", correct: false}
      - {text: "Un `std::optional` lève une exception quand la recherche échoue", correct: false}
    answer: "-1 est une convention, qu'il faut connaître et penser à tester, et qui peut être une vraie valeur. Avec un optional, la signature dit qu'il peut n'y avoir rien, et il faut le déballer pour s'en servir."
  - key: lire-la-valeur
    format: course
    question: "Que se passe-t-il quand on écrit `*opt` sur un `std::optional` vide ?"
    choices:
      - {text: "C'est un comportement indéfini : aucun contrôle n'est fait", correct: true}
      - {text: "Une exception `std::bad_optional_access` est levée", correct: false}
      - {text: "L'expression vaut zéro, la valeur par défaut du type", correct: false}
      - {text: "Le code ne compile pas", correct: false}
    answer: "`*opt` ne vérifie rien, comme `v[i]` sur un vecteur. C'est `opt.value()` qui lève `std::bad_optional_access`."
  - key: role-de-value-or
    format: course
    question: "Que renvoie `opt.value_or(0)` ?"
    choices:
      - {text: "La valeur contenue, ou 0 si l'optional est vide", correct: true}
      - {text: "Toujours 0, quelle que soit la valeur contenue", correct: false}
      - {text: "`true` si la valeur contenue vaut 0", correct: false}
      - {text: "La valeur contenue, ou une exception s'il est vide", correct: false}
    answer: "`value_or` donne une valeur de repli. C'est la façon la plus courte, et sans risque, de lire un optional."
  - key: vf-allocation
    format: true-false
    question: "Un `std::optional<int>` alloue de la mémoire dynamiquement pour ranger sa valeur."
    truth: false
    answer: La valeur est rangée dans l'objet lui-même, à côté d'un indicateur de présence.
  - key: vf-if
    format: true-false
    question: "`if (opt)` est vrai quand un `std::optional` contient une valeur."
    truth: true
    answer: "L'optional se convertit en `bool` dans une condition : c'est l'équivalent de `opt.has_value()`."
  - key: vf-optional-bool
    format: true-false
    question: "Avec `std::optional<bool> reponse = false;`, la condition `if (reponse)` est fausse."
    truth: false
    answer: "Elle est vraie : `if (reponse)` teste la présence d'une valeur, et il y en a une. Pour tester la valeur : `reponse.value_or(false)`."
  - key: vf-value-exception
    format: true-false
    question: "`opt.value()` lève une exception si l'optional est vide."
    truth: true
    answer: "`std::bad_optional_access`. C'est la version vérifiée de `*opt`."
  - key: qcm-vide
    format: multiple-choice
    question: "Que renvoie une fonction `std::optional<int>` pour dire « pas de résultat » ?"
    choices:
      - {text: "`std::nullopt`", correct: true}
      - {text: "`nullptr`", correct: false}
      - {text: "`void`", correct: false}
      - {text: "`std::none`", correct: false}
    answer: "`return std::nullopt;` (ou `return {};`). `nullptr` est le pointeur nul, et `std::none` n'existe pas."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Avec quelle norme `std::optional` est-il arrivé ?"
    choices:
      - {text: "C++17", correct: true}
      - {text: "C++11", correct: false}
      - {text: "C++20", correct: false}
      - {text: "C++23", correct: false}
    answer: "C++17, dans `<optional>`, en même temps que `std::variant` et `std::string_view`. C++23 lui a ajouté `transform`, `and_then` et `or_else`."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle écriture teste qu'un `std::optional` nommé `age` contient une valeur ?"
    choices:
      - {text: "`age.has_value()`", correct: true}
      - {text: "`age != 0`", correct: false}
      - {text: "`age.empty()`", correct: false}
      - {text: "`age.is_null()`", correct: false}
    answer: "`has_value()`, ou simplement `if (age)`. `age != 0` compare la valeur à zéro : un optional vide est différent de 0, donc le test serait vrai."
  - key: qcm-optional-ou-expected
    format: multiple-choice
    question: "Quand préfère-t-on `std::expected` à `std::optional` ?"
    choices:
      - {text: "Quand l'appelant doit savoir pourquoi il n'y a pas de résultat", correct: true}
      - {text: "Quand le résultat est un entier plutôt qu'une chaîne", correct: false}
      - {text: "Quand la fonction ne peut jamais échouer", correct: false}
      - {text: "Quand le projet compile en C++17", correct: false}
    answer: "Un optional vide dit « rien », sans raison. `std::expected<T, E>` (C++23) contient la valeur ou une erreur de type `E`."
  - key: trous-type
    format: fill-in
    question: |-
      Complète pour déclarer un âge qui peut être absent :
      ```cpp
      std::___<int> age;
      ```
    blanks:
      - [optional]
    answer: "`std::optional<int>` : un entier, ou rien. Sans valeur de départ, il est vide."
  - key: trous-nullopt
    format: fill-in
    question: |-
      Complète pour renvoyer « pas de résultat » :
      ```cpp
      std::optional<int> quotient(int a, int b) {
          if (b == 0) {
              return std::___;
          }
          return a / b;
      }
      ```
    blanks:
      - [nullopt]
    answer: "`std::nullopt` est la valeur d'un optional vide."
  - key: trous-value-or
    format: fill-in
    question: |-
      Complète pour utiliser 18 quand l'âge est absent :
      ```cpp
      std::optional<int> age;
      int retenu = age.___(18);
      ```
    blanks:
      - [value_or]
    answer: "`value_or(18)` renvoie la valeur contenue, ou 18 si l'optional est vide."
  - key: trous-has-value
    format: fill-in
    question: |-
      Complète pour n'afficher l'âge que s'il existe :
      ```cpp
      if (age.___()) {
          std::println("{}", *age);
      }
      ```
    blanks:
      - [has_value]
    answer: "`has_value()` dit si l'optional contient une valeur. On peut alors le déréférencer sans risque."
  - key: code-vide-et-plein
    format: code-output
    question: |-
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<int> a;
          std::optional<int> b = 5;
          std::println("{} {} {}", a.has_value(), a.value_or(-1), b.value_or(-1));
      }
      ```
    choices:
      - {text: "`false -1 5`", correct: true}
      - {text: "`false 0 5`", correct: false}
      - {text: "`true -1 5`", correct: false}
      - {text: "`false -1 -1`", correct: false}
    answer: "`false -1 5` : `a` est vide, `value_or` renvoie donc le repli. `b` contient 5, que `value_or` renvoie tel quel."
    check:
      output: "false -1 5"
  - key: code-recherche
    format: code-output
    question: |-
      ```cpp
      #include <optional>
      #include <print>
      #include <string>

      std::optional<int> position(const std::string& texte, char lettre) {
          for (std::size_t i = 0; i < texte.size(); ++i) {
              if (texte[i] == lettre) {
                  return static_cast<int>(i);
              }
          }
          return std::nullopt;
      }

      int main() {
          auto trouve = position("bonjour", 'n');
          auto absent = position("bonjour", 'z');
          std::println("{} {}", *trouve, absent.has_value());
      }
      ```
    choices:
      - {text: "`2 false`", correct: true}
      - {text: "`3 false`", correct: false}
      - {text: "`2 true`", correct: false}
      - {text: "`n false`", correct: false}
    answer: "`2 false` : `n` est à la position 2, en comptant à partir de 0. Pour `z`, la boucle finit sans rien trouver : la fonction renvoie `std::nullopt`."
    check:
      output: "2 false"
  - key: code-optional-bool
    format: code-output
    question: |-
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<bool> accepte = false;
          if (accepte) {
              std::println("oui");
          } else {
              std::println("non");
          }
      }
      ```
    choices:
      - {text: "`oui`", correct: true}
      - {text: "`non`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`oui` : `if (accepte)` teste si l'optional contient une valeur, et il en contient une, `false`. Pour tester la valeur elle-même : `accepte.value_or(false)`."
    check:
      output: "oui"
  - key: code-value-sur-vide
    format: code-output
    question: |-
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<int> age;
          std::println("début");
          std::println("{}", age.value());
      }
      ```
    choices:
      - {text: "`début`, puis une exception `std::bad_optional_access`", correct: true}
      - {text: "`début`, puis `0`", correct: false}
      - {text: "`début`, puis un nombre imprévisible", correct: false}
      - {text: "`début`, puis une ligne vide", correct: false}
    answer: "`début`, puis `std::bad_optional_access` : `value()` vérifie que l'optional contient une valeur. L'exception n'est rattrapée par personne, le programme s'arrête."
    check:
      output: "début"
      throws: "std::bad_optional_access"
  - key: bug-dereferencer-vide
    format: bug-fix
    question: |-
      Aucune remise n'est définie. Ce programme en lit une quand même : il affiche souvent `100`, mais rien ne le
      garantit. Quelle correction est la bonne ?
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<int> remise;
          int prix = 100;
          std::println("{}", prix - *remise);
      }
      ```
    choices:
      - {text: "Écrire `prix - remise.value_or(0)`", correct: true}
      - {text: "Écrire `prix - remise.has_value()`", correct: false}
      - {text: "Écrire `prix - &remise`", correct: false}
      - {text: "Écrire `prix - remise.size()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", prix - remise.value_or(0));
      ```
      `*remise` sur un optional vide est un comportement indéfini : le programme lit une mémoire sans valeur, qui
      contient souvent zéro, d'où le `100`. `value_or(0)` dit ce qu'on veut : la remise, ou zéro s'il n'y en a pas.
  - key: bug-optional-bool
    format: bug-fix
    question: |-
      L'utilisateur a refusé les notifications, et ce programme affiche quand même `Notifications activées`. Quelle
      correction est la bonne ?
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<bool> notifications = false;
          if (notifications) {
              std::println("Notifications activées");
          }
      }
      ```
    choices:
      - {text: "Écrire `if (notifications.value_or(false))`", correct: true}
      - {text: "Écrire `if (notifications.has_value())`", correct: false}
      - {text: "Écrire `if (notifications != std::nullopt)`", correct: false}
      - {text: "Écrire `if (!notifications)`", correct: false}
    answer: |-
      ```cpp
      if (notifications.value_or(false)) {
      ```
      `if (notifications)` demande « y a-t-il une réponse ? », pas « la réponse est-elle oui ? ». `value_or(false)`
      lit la réponse, et traite l'absence comme un refus.
  - key: bug-calcul-sur-optional
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <optional>
      #include <print>

      int main() {
          std::optional<int> age = 36;
          int prochain = age + 1;
          std::println("{}", prochain);
      }
      ```
    choices:
      - {text: "Écrire `age.value_or(0) + 1`", correct: true}
      - {text: "Écrire `age.has_value() + 1`", correct: false}
      - {text: "Écrire `age + std::optional<int>(1)`", correct: false}
      - {text: "Écrire `(age) + 1`", correct: false}
    answer: |-
      ```cpp
      int prochain = age.value_or(0) + 1;
      ```
      Un optional n'est pas un entier : il faut en sortir la valeur avant de calculer, avec `value_or`, ou avec `*age`
      après avoir testé qu'il n'est pas vide.
  - key: bug-type-de-retour
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `return std::nullopt;`. Quelle correction est la bonne ?
      ```cpp
      #include <optional>
      #include <print>

      int quotient(int a, int b) {
          if (b == 0) {
              return std::nullopt;
          }
          return a / b;
      }

      int main() {
          std::println("{}", quotient(7, 2));
      }
      ```
    choices:
      - {text: "Déclarer le type de retour `std::optional<int>`, et lire le résultat avec `value_or`", correct: true}
      - {text: "Écrire `return nullptr;` à la place, et garder le type de retour `int`", correct: false}
      - {text: "Écrire `return void;` à la place, et garder le type de retour `int`", correct: false}
      - {text: "Déclarer le type de retour `auto`, et laisser le reste tel quel", correct: false}
    answer: |-
      ```cpp
      std::optional<int> quotient(int a, int b) {
      ```
      `std::nullopt` ne se convertit pas en `int`. C'est le type de retour qui doit annoncer qu'il peut n'y avoir
      rien ; `main` lit alors le résultat avec `quotient(7, 2).value_or(0)`.
  - key: situation-recherche
    format: scenario
    question: |-
      Tu écris `trouver_age(nom)`, qui cherche une personne dans une liste. Ne pas la trouver est un cas normal. Quel
      type de retour choisis-tu ?
    choices:
      - {text: "`std::optional<int>` : l'âge, ou rien", correct: true}
      - {text: "`int`, avec -1 quand la personne est absente", correct: false}
      - {text: "`int`, avec une exception quand la personne est absente", correct: false}
      - {text: "`bool`, et l'âge dans une variable globale", correct: false}
    answer: |-
      L'absence fait partie du résultat : un optional le dit dans la signature, et oblige l'appelant à y penser. -1
      est une convention fragile ; une exception convient à un cas anormal, pas à une recherche qui échoue souvent.
  - key: situation-configuration
    format: scenario
    question: |-
      Une fonction lit le port d'un serveur dans un fichier de configuration, et renvoie un `std::optional<int>`. Si le
      port n'est pas précisé, le serveur doit écouter sur 8080. Comment l'écris-tu ?
    choices:
      - {text: "`int port = lire_port().value_or(8080);`", correct: true}
      - {text: "`int port = *lire_port();`", correct: false}
      - {text: "`int port = lire_port().value();`", correct: false}
      - {text: "`int port = lire_port().has_value();`", correct: false}
    answer: |-
      `value_or` donne la valeur lue, ou le repli. `*lire_port()` serait un comportement indéfini sans port, `value()`
      lèverait une exception, et `has_value()` renvoie un booléen : le port vaudrait 0 ou 1.
  - key: situation-value-partout
    format: scenario
    question: |-
      En relecture, tu vois `utilisateur.value().nom` répété dix fois dans une fonction, sans aucun test. L'auteur
      dit que « `value()` est sûr, il vérifie ». Que réponds-tu ?
    choices:
      - {text: "Qu'il faut tester une fois au début, et quitter la fonction si l'optional est vide", correct: true}
      - {text: "Qu'il a raison : avec `value()`, le programme ne peut pas s'arrêter", correct: false}
      - {text: "Qu'il vaut mieux écrire `*utilisateur` dix fois, sans vérification", correct: false}
      - {text: "Qu'il faut entourer chaque `value()` d'un `try` et d'un `catch`", correct: false}
    answer: |-
      `value()` vérifie, mais en levant une exception : sans test, un utilisateur absent arrête le programme. On
      traite l'absence une fois, en tête de fonction (`if (!utilisateur) { return; }`), puis on lit avec `->` en
      sachant que la valeur est là.
  - key: situation-raison-de-l-echec
    format: scenario
    question: |-
      `convertir(texte)` renvoie un `std::optional<int>`. L'interface doit maintenant dire à l'utilisateur si sa saisie
      était vide, non numérique ou trop grande. Que proposes-tu ?
    choices:
      - {text: "Renvoyer un `std::expected<int, Erreur>`, qui porte la raison de l'échec", correct: true}
      - {text: "Renvoyer un `std::optional<int>` négatif, un code par raison", correct: false}
      - {text: "Renvoyer un `std::optional<std::optional<int>>`", correct: false}
      - {text: "Garder l'optional, et afficher toujours le même message", correct: false}
    answer: |-
      Un optional vide ne dit pas pourquoi. `std::expected<int, Erreur>` (C++23) contient soit l'entier, soit une
      valeur d'erreur, par exemple une énumération à trois cas. Des entiers négatifs en guise de codes ramèneraient
      les valeurs sentinelles qu'on voulait éviter.
