notion: enum-classique
lesson: |-
  Avant `enum class` (C++11), il n'y avait que l'**`enum` classique**, hérité du C. On le rencontre dans tout code
  ancien et dans les bibliothèques C. Il a deux défauts, que `enum class` corrige.

  ```cpp
  enum Couleur { Rouge, Vert, Bleu };      // Rouge vaut 0, Vert 1, Bleu 2
  ```

  **Défaut 1 : les noms fuient dans la portée englobante.** `Rouge` s'écrit tout seul, sans `Couleur::`. Deux
  énumérations de la même portée ne peuvent donc pas avoir un nom en commun :

  ```cpp
  enum Couleur { Rouge, Vert };
  enum Feu { Rouge, Orange };              // erreur : Rouge est déjà déclaré
  ```

  **Défaut 2 : la conversion implicite vers un entier.** Un `enum` classique se convertit **en silence** en `int`.
  Tout cela compile :

  ```cpp
  int n = Vert;                            // 1
  if (Rouge == 0) { ... }                  // vrai
  if (Rouge == Lundi) { ... }              // compare une couleur à un jour : vrai aussi
  int total = Vert + Bleu;                 // 3
  ```

  Comparer deux énumérations différentes n'a aucun sens, et le compilateur ne dit rien, ou seulement un
  avertissement. C'est la source de bugs que `enum class` supprime.

  **L'autre sens est refusé.** `Couleur c = 1;` ne compile pas en C++ : il faut `static_cast<Couleur>(1)`. Et ce
  cast accepte **n'importe quel entier**, même sans nom correspondant.

  **Le type sous-jacent.** Sans précision, c'est le compilateur qui choisit un type entier assez grand. On peut le
  fixer : `enum Couleur : std::uint8_t { ... }`.

  **Les valeurs.** Chaque nom vaut le précédent plus un, à partir de 0. On peut imposer une valeur, et deux noms
  peuvent avoir la même :

  ```cpp
  enum Niveau { Bas = 1, Moyen = 5, Haut };        // Haut vaut 6
  ```

  **Comparaison.**

  | | `enum` classique | `enum class` |
  |---|---|---|
  | Accès aux noms | `Rouge` | `Couleur::Rouge` |
  | Conversion vers `int` | implicite | `static_cast`, ou `std::to_underlying` (C++23) |
  | Comparaison entre deux énumérations | compile | refusée |
  | Type sous-jacent par défaut | choisi par le compilateur | `int` |

  **Quand on le rencontre encore.** Pour des **drapeaux** combinés par `|`, où la conversion en entier est
  commode ; et dans l'interface avec du code C. Pour tout le reste, `enum class`.

  **En entretien** : « L'`enum` classique laisse fuir ses noms dans la portée englobante et se convertit
  implicitement en entier : on peut comparer une couleur à un jour. `enum class` corrige les deux, c'est mon choix
  par défaut. »
cards:
  - key: fuite-des-noms
    format: course
    question: "Où sont visibles les noms d'un `enum` classique, comme `Rouge` dans `enum Couleur { Rouge, Vert };` ?"
    choices:
      - {text: "Dans la portée qui contient l'énumération, sans préfixe", correct: true}
      - {text: "Seulement derrière le préfixe `Couleur::`", correct: false}
      - {text: "Seulement dans les fonctions membres d'une classe", correct: false}
      - {text: "Seulement dans le fichier `main.cpp`", correct: false}
    answer: "On écrit `Rouge` tout court. Conséquence : deux énumérations de la même portée ne peuvent pas partager un nom."
  - key: conversion
    format: course
    question: "Que se passe-t-il quand on écrit `int n = Vert;` avec un `enum` classique ?"
    choices:
      - {text: "La valeur est convertie en entier, sans cast ni avertissement", correct: true}
      - {text: "Le compilateur refuse : il faut un `static_cast`", correct: false}
      - {text: "Une exception est lancée à l'exécution", correct: false}
      - {text: "La variable reçoit toujours la valeur zéro", correct: false}
    answer: "La conversion vers un entier est implicite. C'est ce que `enum class` interdit."
  - key: comparaison-absurde
    format: course
    question: "Avec deux `enum` classiques, `Couleur` et `Jour`, que fait `Rouge == Lundi` ?"
    choices:
      - {text: "Il compile, et compare les deux valeurs entières", correct: true}
      - {text: "Il ne compile pas : les deux types sont différents", correct: false}
      - {text: "Il vaut toujours `false`, quelles que soient les valeurs", correct: false}
      - {text: "Il lance une exception `std::bad_cast`", correct: false}
    answer: "Les deux se convertissent en entier. GCC avertit avec `-Wall`, mais le code compile ; avec `enum class`, c'est une erreur."
  - key: valeurs
    format: course
    question: "Dans `enum Niveau { Bas = 1, Moyen = 5, Haut };`, que vaut `Haut` ?"
    choices:
      - {text: "6 : la valeur précédente, plus un", correct: true}
      - {text: "2 : sa position dans la liste", correct: false}
      - {text: "0 : la valeur par défaut", correct: false}
      - {text: "3 : le nombre de noms", correct: false}
    answer: "Un nom sans valeur imposée vaut celui qui le précède, plus un."
  - key: vf-depuis-entier
    format: true-false
    question: "En C++, `Couleur c = 1;` compile quand `Couleur` est un `enum` classique."
    truth: false
    answer: "La conversion d'un entier vers l'énumération exige un cast : `static_cast<Couleur>(1)`. Seul le sens inverse est implicite."
  - key: vf-meme-nom
    format: true-false
    question: "Deux `enum` classiques de la même portée peuvent avoir un nom en commun."
    truth: false
    answer: "Les noms tombent dans la même portée : le second est une redéclaration, refusée."
  - key: vf-doublon-valeur
    format: true-false
    question: "Deux noms d'une même énumération peuvent avoir la même valeur."
    truth: true
    answer: "`enum E { A = 1, B = 1 };` est valide. Les noms sont alors des synonymes."
  - key: vf-prefixe
    format: true-false
    question: "On peut aussi écrire `Couleur::Rouge` pour un `enum` classique."
    truth: true
    answer: "Depuis C++11, le préfixe est permis. Il n'est seulement pas obligatoire."
  - key: qcm-type-sous-jacent
    format: multiple-choice
    question: "Comment fixes-tu le type sous-jacent d'un `enum` classique à un octet ?"
    choices:
      - {text: "`enum Couleur : std::uint8_t { Rouge, Vert };`", correct: true}
      - {text: "`enum<std::uint8_t> Couleur { Rouge, Vert };`", correct: false}
      - {text: "`std::uint8_t enum Couleur { Rouge, Vert };`", correct: false}
      - {text: "`enum Couleur(std::uint8_t) { Rouge, Vert };`", correct: false}
    answer: "Le type suit le nom, après deux-points. La même écriture vaut pour `enum class`."
  - key: qcm-cast
    format: multiple-choice
    question: "Comment obtiens-tu la `Couleur` de valeur 2 à partir d'un entier ?"
    choices:
      - {text: "`static_cast<Couleur>(2)`", correct: true}
      - {text: "`Couleur{}` suivi de `+ 2`", correct: false}
      - {text: "`Couleur::from(2)`", correct: false}
      - {text: "`(int)Couleur + 2`", correct: false}
    answer: "Le cast est obligatoire dans ce sens. Il ne vérifie pas que l'entier correspond à un nom."
  - key: qcm-defaut
    format: multiple-choice
    question: "Quel choix fais-tu par défaut pour une nouvelle énumération ?"
    choices:
      - {text: "`enum class`, dont les noms sont préfixés et ne se convertissent pas", correct: true}
      - {text: "`enum` classique, plus court à écrire et à utiliser", correct: false}
      - {text: "Une suite de `#define`, une ligne par valeur possible", correct: false}
      - {text: "Une suite de variables globales de type `int`, une par valeur", correct: false}
    answer: "`enum class` supprime les deux défauts de l'`enum` classique. Celui-ci reste pour les drapeaux et le code C."
  - key: qcm-premier
    format: multiple-choice
    question: "Que vaut `Rouge` dans `enum Couleur { Rouge, Vert, Bleu };` ?"
    choices:
      - {text: "0", correct: true}
      - {text: "1", correct: false}
      - {text: "-1", correct: false}
      - {text: "Une valeur indéterminée", correct: false}
    answer: "Le premier nom vaut 0, les suivants 1 et 2."
  - key: code-valeurs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum Niveau { Bas = 1, Moyen = 5, Haut };

      int main() {
          std::println("{} {} {}", static_cast<int>(Bas), static_cast<int>(Haut), Bas + Moyen);
      }
      ```
    choices:
      - {text: "`1 6 6`", correct: true}
      - {text: "`1 2 6`", correct: false}
      - {text: "`0 2 5`", correct: false}
      - {text: "`1 6 15`", correct: false}
    answer: "`1 6 6` : `Haut` vaut `Moyen` plus un. L'addition convertit les deux noms en entiers : 1 + 5."
    check:
      output: "1 6 6"
  - key: code-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum Couleur { Rouge, Vert };
      enum Taille { Petit, Grand };

      int main() {
          const int couleur = Vert;
          const int taille = Grand;
          std::println("{} {}", couleur == taille, couleur);
      }
      ```
    choices:
      - {text: "`true 1`", correct: true}
      - {text: "`false 1`", correct: false}
      - {text: "`true 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true 1` : les deux noms se convertissent en silence en 1. Une couleur et une taille deviennent égales."
    check:
      output: "true 1"
  - key: code-cast-hors-noms
    format: code-output
    question: |-
      ```cpp
      #include <cstdint>
      #include <print>

      enum Couleur : std::uint8_t { Rouge, Vert, Bleu };

      int main() {
          const Couleur c = static_cast<Couleur>(7);
          std::println("{} {}", static_cast<int>(c), c == Bleu);
      }
      ```
    choices:
      - {text: "`7 false`", correct: true}
      - {text: "`2 true`", correct: false}
      - {text: "`0 false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7 false` : le cast accepte un entier qui ne correspond à aucun nom, tant qu'il tient dans le type sous-jacent. Une énumération n'est pas limitée à ses noms."
    check:
      output: "7 false"
  - key: code-drapeaux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum Droit { Lecture = 1, Ecriture = 2, Execution = 4 };

      int main() {
          const int droits = Lecture | Execution;
          std::println("{} {} {}", droits, (droits & Ecriture) != 0, (droits & Execution) != 0);
      }
      ```
    choices:
      - {text: "`5 false true`", correct: true}
      - {text: "`5 true true`", correct: false}
      - {text: "`3 false true`", correct: false}
      - {text: "`7 true true`", correct: false}
    answer: "`5 false true` : 1 | 4 vaut 5. Le bit de l'écriture n'y est pas, celui de l'exécution y est. C'est l'usage où la conversion en entier est commode."
    check:
      output: "5 false true"
  - key: bug-noms-en-collision
    format: bug-fix
    question: |-
      Le compilateur refuse la seconde énumération : `Rouge` est déjà déclaré. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum Couleur { Rouge, Vert };
      enum Feu { Rouge, Orange };

      int main() {
          std::println("{}", static_cast<int>(Orange));
      }
      ```
    choices:
      - {text: "Déclarer les deux énumérations avec `enum class`", correct: true}
      - {text: "Déclarer la seconde énumération avant la première", correct: false}
      - {text: "Donner à `Rouge` la même valeur dans les deux", correct: false}
      - {text: "Déclarer les deux énumérations avec `const enum`", correct: false}
    answer: |-
      ```cpp
      enum class Couleur { Rouge, Vert };
      enum class Feu { Rouge, Orange };
      ```
      Les noms d'un `enum` classique tombent dans la portée englobante, où ils se heurtent. Avec `enum class`, ils
      s'écrivent `Couleur::Rouge` et `Feu::Rouge`.
  - key: bug-comparaison-entre-enums
    format: bug-fix
    question: |-
      Ce programme compare par erreur une couleur à un jour, et affiche `identiques`. On veut que cette faute ne
      compile plus. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum Couleur { Rouge, Vert };
      enum Jour { Lundi, Mardi };

      int main() {
          const Couleur couleur = Rouge;
          const Jour jour = Lundi;
          if (static_cast<int>(couleur) == jour) {
              std::println("identiques");
          }
      }
      ```
    choices:
      - {text: "Déclarer `enum class Couleur` et `enum class Jour`, et comparer sans cast", correct: true}
      - {text: "Donner à `Lundi` la valeur 10, pour que les valeurs diffèrent", correct: false}
      - {text: "Déclarer `jour` avec le type `int`", correct: false}
      - {text: "Comparer avec `!=` à la place de `==`", correct: false}
    answer: |-
      ```cpp
      enum class Couleur { Rouge, Vert };
      enum class Jour { Lundi, Mardi };
      // couleur == jour ne compile plus
      ```
      Un `enum` classique se convertit en entier : tout se compare à tout. Deux `enum class` différents ne se
      comparent pas.
  - key: bug-depuis-entier
    format: bug-fix
    question: |-
      Le compilateur répond « invalid conversion from 'int' to 'Couleur' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum Couleur { Rouge, Vert, Bleu };

      int main() {
          const Couleur c = 2;
          std::println("{}", c == Bleu);
      }
      ```
    choices:
      - {text: "Écrire `const Couleur c = Bleu;`", correct: true}
      - {text: "Écrire `const Couleur c = \"Bleu\";`", correct: false}
      - {text: "Écrire `const Couleur c = Couleur + 2;`", correct: false}
      - {text: "Écrire `const Couleur c = 2u;`", correct: false}
    answer: |-
      ```cpp
      const Couleur c = Bleu;
      ```
      Un entier ne se convertit pas implicitement en énumération. On utilise le nom ; s'il faut vraiment partir
      d'un entier, `static_cast<Couleur>(2)`.
  - key: bug-switch-incomplet
    format: bug-fix
    question: |-
      Ce programme devrait afficher `bleu`. Il n'affiche rien. Avec `-Wall`, GCC avertit : « enumeration value
      'Bleu' not handled in switch ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum Couleur { Rouge, Vert, Bleu };

      void afficher(Couleur c) {
          switch (c) {
          case Rouge:
              std::println("rouge");
              break;
          case Vert:
              std::println("vert");
              break;
          }
      }

      int main() {
          afficher(Bleu);
      }
      ```
    choices:
      - {text: "Ajouter un `case Bleu:` qui affiche `bleu`", correct: true}
      - {text: "Ajouter un `default:` vide à la fin du `switch`", correct: false}
      - {text: "Retirer les `break` des deux `case`", correct: false}
      - {text: "Donner à `Bleu` la valeur 1", correct: false}
    answer: |-
      ```cpp
      case Bleu:
          std::println("bleu");
          break;
      ```
      Une valeur sans `case` saute tout le `switch`. Un `default` vide ferait taire l'avertissement sans traiter le
      cas, et cacherait les prochains oublis.
