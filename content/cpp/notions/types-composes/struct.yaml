notion: struct
lesson: |-
  Une **`struct`** réunit plusieurs données sous un seul type. Chaque donnée est un **membre**, avec son type et son
  nom.

  ```cpp
  struct Point {
      int x;
      int y;
  };                      // le point-virgule est obligatoire

  Point p{3, 4};          // les membres, dans l'ordre de leur déclaration
  p.x += 10;              // on accède à un membre avec un point
  ```

  - On initialise avec des **accolades**, dans l'ordre des membres. Les membres non cités valent zéro : `Point p{3};`
    donne `y` à 0, et `Point p{};` met tout à zéro.
  - **Sans accolades**, `Point p;` laisse des membres de type fondamental **non initialisés**.
  - Un membre peut avoir une **valeur par défaut** : `int port = 8080;`. Elle sert quand l'initialisation ne dit rien
    pour lui.
  - **Copier** une struct copie tous ses membres : `Point b = a;` crée un objet indépendant.
  - On la passe à une fonction par **référence constante**, comme tout objet, et on la **renvoie par valeur**.
  - Les structs s'imbriquent, et se rangent dans un conteneur : `std::vector<Point>`.

  **Comparer.** `==` n'existe pas d'office entre deux structs. Depuis C++20, une ligne le demande au compilateur :
  `bool operator==(const Point&) const = default;`.

  **`struct` ou `class` ?** Les deux déclarent le même genre de type. La seule différence est l'accès par défaut :
  tout est **public** dans une `struct`, **privé** dans une `class`. Par convention, `struct` sert aux simples
  regroupements de données.

  **Pièges classiques.**

  - Oublier le **point-virgule** après l'accolade fermante.
  - Se tromper dans l'**ordre** des valeurs entre accolades : rien ne le signale si les types sont compatibles.

  **En entretien** : « Une `struct` pour un regroupement de données sans règle à faire respecter, une `class` dès
  qu'il y a un invariant. Techniquement, seule la visibilité par défaut les distingue. »
tour:
  - title: "struct : regrouper des données"
    text: |-
      Une `struct` crée un nouveau type, qui réunit plusieurs données : ses **membres**. On y accède avec un point :
      `p.x`.

      On l'initialise avec des accolades, dans l'ordre des membres. Un membre peut avoir une valeur par défaut, qui
      sert quand on ne dit rien pour lui.

      N'oublie pas le point-virgule après l'accolade qui ferme la `struct`.

      Essaie : déclare `Joueur invite{"Alan"};`, sans score, et affiche son score.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          struct Joueur {
              std::string nom;
              int score = 0;
          };

          int main() {
              Joueur ada{"Ada", 120};
              ada.score += 30;

              Joueur copie = ada;
              copie.nom = "Alan";

              std::println("{} : {}", ada.nom, ada.score);
              std::println("{} : {}", copie.nom, copie.score);
          }
      output: |-
        Ada : 150
        Alan : 150
    task:
      instructions: |-
        Ajoute un membre `niveau` à `Joueur`, un entier qui vaut 1 par défaut, et affiche-le pour obtenir
        `Ada : 120 (niveau 1)`.
      starter:
        main.cpp: |-
          #include <print>
          #include <string>

          struct Joueur {
              std::string nom;
              int score = 0;
          };

          int main() {
              Joueur ada{"Ada", 120};
              std::println("{} : {}", ada.nom, ada.score);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <string>

          struct Joueur {
              std::string nom;
              int score = 0;
              int niveau = 1;
          };

          int main() {
              Joueur ada{"Ada", 120};
              std::println("{} : {} (niveau {})", ada.nom, ada.score, ada.niveau);
          }
      output: "Ada : 120 (niveau 1)"
cards:
  - key: role-de-struct
    format: course
    question: "À quoi sert une `struct` ?"
    choices:
      - {text: "À réunir plusieurs données sous un seul type", correct: true}
      - {text: "À ranger plusieurs valeurs du même type, par indice", correct: false}
      - {text: "À donner un autre nom à un type existant", correct: false}
      - {text: "À regrouper plusieurs fonctions dans un fichier", correct: false}
    answer: "Une `struct` définit un type dont chaque objet contient plusieurs membres, de types quelconques, désignés par leur nom. Le rangement par indice est celui d'un tableau."
  - key: struct-ou-class
    format: course
    question: "Quelle différence le langage fait-il entre `struct` et `class` ?"
    choices:
      - {text: "L'accès par défaut : public dans une `struct`, privé dans une `class`", correct: true}
      - {text: "Une `struct` ne peut pas avoir de fonctions membres, une `class` oui", correct: false}
      - {text: "Une `struct` est copiée par valeur, une `class` par référence", correct: false}
      - {text: "Une `struct` vit sur la pile, une `class` sur le tas", correct: false}
    answer: "C'est la seule différence. Une `struct` peut avoir des fonctions, des constructeurs, de l'héritage. La copie et l'emplacement en mémoire ne dépendent pas du mot-clé, contrairement à C#."
  - key: membres-non-cites
    format: course
    question: "Avec `struct Point { int x; int y; };`, que vaut `p.y` après `Point p{3};` ?"
    choices:
      - {text: "Zéro : un membre non cité entre les accolades est mis à zéro", correct: true}
      - {text: "Trois : la valeur est recopiée dans tous les membres", correct: false}
      - {text: "Une valeur indéterminée, comme une variable locale", correct: false}
      - {text: "Rien : il faut une valeur par membre, le code ne compile pas", correct: false}
    answer: "Avec des accolades, les membres sans valeur sont mis à zéro, ou prennent leur valeur par défaut s'ils en ont une. C'est sans accolades du tout, `Point p;`, qu'ils restent indéterminés."
  - key: comparer-deux-structs
    format: course
    question: "Peut-on comparer deux objets d'une `struct` avec `==` sans rien écrire de plus ?"
    choices:
      - {text: "Non : il faut définir `operator==`, ou le demander avec `= default`", correct: true}
      - {text: "Oui : `==` compare les membres un par un, d'office", correct: false}
      - {text: "Oui : `==` compare les adresses des deux objets", correct: false}
      - {text: "Non : deux structs ne peuvent jamais être comparées", correct: false}
    answer: "Le compilateur ne fournit pas `==` de lui-même. Depuis C++20, `bool operator==(const Point&) const = default;` lui demande de comparer membre à membre."
  - key: vf-point-virgule
    format: true-false
    question: La définition d'une `struct` se termine par un point-virgule, après l'accolade fermante.
    truth: true
    answer: Contrairement à une fonction. L'oublier donne une erreur de compilation, souvent signalée sur la ligne suivante.
  - key: vf-copie
    format: true-false
    question: "Après `Point b = a;`, modifier `b.x` modifie aussi `a.x`."
    truth: false
    answer: La copie duplique tous les membres. `a` et `b` sont deux objets indépendants.
  - key: vf-sans-accolades
    format: true-false
    question: "Dans une fonction, `Point p;` met à zéro les membres `int` de `p`."
    truth: false
    answer: "Sans accolades ni valeur par défaut, les membres de type fondamental sont indéterminés. `Point p{};` les met à zéro."
  - key: vf-types-differents
    format: true-false
    question: Les membres d'une `struct` peuvent être de types différents.
    truth: true
    answer: "C'est son intérêt : un `std::string` pour le nom, un `int` pour l'âge, un `bool` pour l'état."
  - key: qcm-acces
    format: multiple-choice
    question: "Comment lit-on le membre `x` d'un objet `p` ?"
    choices:
      - {text: "`p.x`", correct: true}
      - {text: "`p::x`", correct: false}
      - {text: "`p[x]`", correct: false}
      - {text: "`x(p)`", correct: false}
    answer: "Avec un point. `::` désigne un nom dans un espace de noms ou une classe, pas dans un objet."
  - key: qcm-valeur-par-defaut
    format: multiple-choice
    question: "Comment donner au membre `port` la valeur 8080 quand rien n'est précisé ?"
    choices:
      - {text: "`int port = 8080;` dans la `struct`", correct: true}
      - {text: "`int port(8080);` dans la `struct`", correct: false}
      - {text: "`default int port 8080;` dans la `struct`", correct: false}
      - {text: "`port = 8080;` après la `struct`", correct: false}
    answer: "Une valeur par défaut s'écrit à la déclaration du membre, avec `=` ou des accolades. Elle sert quand l'initialisation de l'objet ne donne rien pour ce membre."
  - key: qcm-passer-a-une-fonction
    format: multiple-choice
    question: "Comment passe-t-on une `struct` à une fonction qui ne fait que la lire ?"
    choices:
      - {text: "Par référence constante : `const Joueur& joueur`", correct: true}
      - {text: "Par référence non constante : `Joueur& joueur`", correct: false}
      - {text: "Membre par membre, en autant de paramètres", correct: false}
      - {text: "Par son nom entre guillemets : `\"joueur\"`", correct: false}
    answer: "La référence constante évite de copier tous les membres, et garantit qu'ils ne seront pas modifiés. Pour une struct de deux entiers, le passage par valeur convient aussi."
  - key: qcm-vecteur-de-structs
    format: multiple-choice
    question: "Quelle déclaration crée un vecteur de deux points ?"
    choices:
      - {text: "`std::vector<Point> points{{1, 2}, {3, 4}};`", correct: true}
      - {text: "`std::vector<Point> points{1, 2, 3, 4};`", correct: false}
      - {text: "`std::vector<struct> points{{1, 2}, {3, 4}};`", correct: false}
      - {text: "`Point<std::vector> points{{1, 2}, {3, 4}};`", correct: false}
    answer: "Le type des éléments est `Point`, et chaque paire d'accolades intérieure initialise un point."
  - key: trous-mot-cle
    format: fill-in
    question: |-
      Complète avec le mot-clé qui définit le type :
      ```cpp
      ___ Point {
          int x;
          int y;
      };
      ```
    blanks:
      - [struct, class]
    answer: "`struct Point { ... };` définit un type à deux membres."
  - key: trous-acces
    format: fill-in
    question: |-
      Complète pour ajouter 10 au membre `x` :
      ```cpp
      Point p{3, 4};
      p___x += 10;
      ```
    blanks:
      - ["."]
    answer: "On accède à un membre avec un point : `p.x`."
  - key: trous-point-virgule
    format: fill-in
    question: |-
      Complète la fin de la définition :
      ```cpp
      struct Joueur {
          std::string nom;
          int score = 0;
      }___
      ```
    blanks:
      - [";"]
    answer: "La définition d'une `struct` se termine par un point-virgule."
  - key: trous-initialisation
    format: fill-in
    question: |-
      Complète pour que `p.x` vaille 3 et `p.y` vaille 4 :
      ```cpp
      struct Point {
          int x;
          int y;
      };

      Point p{___, 4};
      ```
    blanks:
      - ["3"]
    answer: "Les valeurs suivent l'ordre des membres : `x` d'abord, `y` ensuite."
  - key: code-acces
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p{3, 4};
          p.x += 10;
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "`13 4`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`13 14`", correct: false}
      - {text: "`3 14`", correct: false}
    answer: "`13 4` : les accolades donnent 3 à `x` et 4 à `y`. Seul `x` est ensuite modifié."
    check:
      output: "13 4"
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point a{1, 2};
          Point b = a;
          b.x = 9;
          std::println("{} {} {}", a.x, b.x, b.y);
      }
      ```
    choices:
      - {text: "`1 9 2`", correct: true}
      - {text: "`9 9 2`", correct: false}
      - {text: "`1 9 0`", correct: false}
      - {text: "`9 9 0`", correct: false}
    answer: "`1 9 2` : `b` est une copie de `a`, membre par membre. La modifier ne touche pas `a`."
    check:
      output: "1 9 2"
  - key: code-valeurs-par-defaut
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Config {
          int port = 8080;
          bool actif = true;
      };

      int main() {
          Config a{9000};
          Config b;
          std::println("{} {} {}", a.port, a.actif, b.port);
      }
      ```
    choices:
      - {text: "`9000 true 8080`", correct: true}
      - {text: "`9000 false 8080`", correct: false}
      - {text: "`9000 true 0`", correct: false}
      - {text: "`8080 true 8080`", correct: false}
    answer: "`9000 true 8080` : `a` remplace la valeur de `port`, et garde celle de `actif`. `b`, sans rien, prend toutes les valeurs par défaut."
    check:
      output: "9000 true 8080"
  - key: code-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      struct Rectangle {
          int largeur;
          int hauteur;
      };

      int main() {
          std::vector<Rectangle> pieces{{1, 2}, {3, 4}};
          int total = 0;
          for (const auto& piece : pieces) {
              total += piece.largeur * piece.hauteur;
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`14`", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`24`", correct: false}
      - {text: "`21`", correct: false}
    answer: "`14` : la boucle additionne l'aire de chaque rectangle, 1 × 2 puis 3 × 4."
    check:
      output: "14"
  - key: bug-point-virgule
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      }

      int main() {
          Point p{3, 4};
          std::println("{}", p.x);
      }
      ```
    choices:
      - {text: "Ajouter un point-virgule après l'accolade de la `struct`", correct: true}
      - {text: "Retirer les points-virgules après les deux membres", correct: false}
      - {text: "Déplacer la `struct` après la fonction `main`", correct: false}
      - {text: "Remplacer les accolades de `p` par des parenthèses", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
      };
      ```
      Une définition de `struct` est une déclaration : elle finit par un point-virgule. Sans lui, le compilateur lit
      `int main()` comme la suite de la déclaration.
  - key: bug-non-initialisee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 0`, et affiche des nombres imprévisibles. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point origine;
          std::println("{} {}", origine.x, origine.y);
      }
      ```
    choices:
      - {text: "Écrire `Point origine{};`", correct: true}
      - {text: "Écrire `Point origine();`", correct: false}
      - {text: "Écrire `Point origine = 0;`", correct: false}
      - {text: "Écrire `struct Point origine;`", correct: false}
    answer: |-
      ```cpp
      Point origine{};
      ```
      Sans accolades, les membres `int` ne sont pas initialisés. Les accolades vides les mettent à zéro ; donner une
      valeur par défaut aux membres, `int x = 0;`, protège toutes les déclarations d'un coup.
  - key: bug-ordre-des-membres
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      struct Personne {
          std::string nom;
          int age;
      };

      int main() {
          Personne ada{36, "Ada"};
          std::println("{} a {} ans", ada.nom, ada.age);
      }
      ```
    choices:
      - {text: "Écrire les valeurs dans l'ordre des membres : `{\"Ada\", 36}`", correct: true}
      - {text: "Écrire les valeurs entre parenthèses : `(36, \"Ada\")`", correct: false}
      - {text: "Déclarer `ada` avec `auto` à la place de `Personne`", correct: false}
      - {text: "Écrire `36` entre guillemets, comme le nom", correct: false}
    answer: |-
      ```cpp
      Personne ada{"Ada", 36};
      ```
      Les valeurs entre accolades suivent l'ordre de déclaration des membres : le nom, puis l'âge. Ici le compilateur
      le voit, parce que les types ne sont pas compatibles ; entre deux `int`, l'inversion passerait inaperçue.
  - key: bug-comparaison
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator==' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point a{1, 2};
          Point b{1, 2};
          std::println("{}", a == b);
      }
      ```
    choices:
      - {text: "Ajouter `bool operator==(const Point&) const = default;` dans la `struct`", correct: true}
      - {text: "Ajouter `#include <compare>` en haut du fichier, sans rien changer d'autre", correct: false}
      - {text: "Remplacer `a == b` par `a.equals(b)`, comme pour une chaîne en Java", correct: false}
      - {text: "Remplacer `a == b` par `&a == &b`, pour comparer les deux objets", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = default;
      };
      ```
      Le compilateur ne compare pas deux structs de lui-même. Depuis C++20, `= default` lui demande une comparaison
      membre à membre. `&a == &b` compilerait, mais comparerait deux adresses : toujours faux ici.
