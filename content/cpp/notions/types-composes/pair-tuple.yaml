notion: pair-tuple
lesson: |-
  **`std::pair`** réunit **deux** valeurs, de types quelconques ; **`std::tuple`** en réunit **autant qu'on veut**.
  Ce sont des structs toutes faites, sans nom à inventer.

  ```cpp
  std::pair<std::string, int> personne{"Ada", 36};      // <utility>
  personne.first;      // "Ada"
  personne.second;     // 36

  std::tuple<int, std::string, double> ligne{1, "stylo", 2.5};   // <tuple>
  std::get<1>(ligne);  // "stylo"
  ```

  - Les deux membres d'une paire s'appellent **`first`** et **`second`** : ce sont des membres, pas des fonctions.
  - Un élément de tuple se lit avec **`std::get<indice>(t)`**. L'indice est une constante, vérifiée à la
    **compilation** : `std::get<3>` sur un tuple de trois éléments ne compile pas. On peut aussi désigner un élément
    par son type, s'il est unique : `std::get<double>(ligne)`.
  - Les types se déduisent : `std::pair p{1, 2.5};`, `std::make_pair(1, 2.5)`.
  - Les **liaisons structurées** (C++17) décomposent d'un coup : `auto [nom, age] = personne;`.
  - La **comparaison** est fournie, élément par élément et dans l'ordre : on compare les premiers, puis les seconds en
    cas d'égalité.

  **Où on les croise.** Les éléments d'une `std::map` sont des paires clé-valeur ; `insert` renvoie une paire ;
  beaucoup de fonctions renvoient deux résultats dans une paire.

  **Paire ou struct ?** `first` et `second` ne disent rien de ce qu'ils contiennent. Dès que les valeurs ont un sens,
  une **`struct`** aux membres nommés se lit mieux : `resultat.quotient` plutôt que `resultat.first`. On garde `pair`
  et `tuple` pour le code générique et les résultats sans importance durable.

  **En entretien** : « `std::pair` et `std::tuple` pour regrouper à la volée ; une `struct` nommée dès que les champs
  ont un sens métier. Je les décompose avec des liaisons structurées. »
tour:
  - title: std::pair et std::tuple
    text: |-
      `std::pair` réunit deux valeurs : `first` et `second`. `std::tuple` en réunit autant que tu veux ; on lit un
      élément avec `std::get<indice>(t)`.

      Les liaisons structurées les décomposent en variables : `auto [nom, age] = personne;`.

      Les paires se comparent toutes seules, d'abord sur `first`, puis sur `second`.

      Essaie : remplace `std::get<1>` par `std::get<3>`, puis exécute. L'indice est vérifié à la compilation.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>
          #include <tuple>
          #include <utility>

          int main() {
              std::pair<std::string, int> personne{"Ada", 36};
              personne.second += 1;

              auto [nom, age] = personne;
              std::println("{} a {} ans", nom, age);

              std::tuple<int, std::string, double> ligne{2, "stylo", 1.5};
              std::println("{} x {}", std::get<0>(ligne), std::get<1>(ligne));
          }
      output: |-
        Ada a 37 ans
        2 x stylo
cards:
  - key: role-de-pair
    format: course
    question: "Que contient un `std::pair<std::string, int>` ?"
    choices:
      - {text: "Deux valeurs : une chaîne dans `first`, un entier dans `second`", correct: true}
      - {text: "Deux valeurs du même type, au choix une chaîne ou un entier", correct: false}
      - {text: "Une seule valeur, qui est soit une chaîne, soit un entier", correct: false}
      - {text: "Une liste de chaînes, numérotées par des entiers", correct: false}
    answer: "Une paire réunit deux valeurs, chacune de son type. « L'une ou l'autre » serait un `std::variant` ; une table de correspondance, une `std::map`."
  - key: acces-tuple
    format: course
    question: "Comment lit-on le deuxième élément d'un `std::tuple` nommé `t` ?"
    choices:
      - {text: "`std::get<1>(t)`", correct: true}
      - {text: "`t[1]`", correct: false}
      - {text: "`t.second`", correct: false}
      - {text: "`t.get(1)`", correct: false}
    answer: "`std::get<1>(t)` : les indices partent de 0, et s'écrivent entre chevrons car ils sont vérifiés à la compilation. `second` est un membre de `std::pair`."
  - key: pair-ou-struct
    format: course
    question: "Pourquoi préfère-t-on souvent une `struct` à un `std::pair` pour renvoyer deux résultats ?"
    choices:
      - {text: "Ses membres ont un nom qui dit ce qu'ils contiennent", correct: true}
      - {text: "Elle se copie plus vite qu'une paire", correct: false}
      - {text: "Elle accepte deux types différents, pas une paire", correct: false}
      - {text: "Elle est la seule à pouvoir être renvoyée par une fonction", correct: false}
    answer: "`first` et `second` ne disent rien. `resultat.quotient` et `resultat.reste` se lisent sans aller voir la fonction. Le coût et les possibilités sont les mêmes."
  - key: comparaison
    format: course
    question: "Comment `a < b` compare-t-il deux `std::pair` ?"
    choices:
      - {text: "Sur `first` d'abord, puis sur `second` en cas d'égalité", correct: true}
      - {text: "Sur `second` d'abord, puis sur `first` en cas d'égalité", correct: false}
      - {text: "Sur la somme de `first` et de `second`", correct: false}
      - {text: "Il ne compare pas : `<` ne compile pas entre deux paires", correct: false}
    answer: "C'est l'ordre lexicographique, celui du dictionnaire : le premier élément décide, le second départage. Les tuples se comparent de la même façon."
  - key: vf-first-fonction
    format: true-false
    question: "On lit le premier élément d'une paire `p` avec `p.first()`, entre parenthèses."
    truth: false
    answer: "`first` et `second` sont des membres : `p.first`, sans parenthèses."
  - key: vf-tuple-taille
    format: true-false
    question: Un `std::tuple` peut réunir plus de deux valeurs.
    truth: true
    answer: "Autant qu'on veut, chacune de son type : `std::tuple<int, std::string, double>`."
  - key: vf-indice-verifie
    format: true-false
    question: "`std::get<5>(t)` sur un tuple de trois éléments lève une exception à l'exécution."
    truth: false
    answer: "L'indice est vérifié à la compilation : le code ne compile pas. Il n'y a rien à rattraper à l'exécution."
  - key: vf-liaisons
    format: true-false
    question: "`auto [a, b] = p;` range les deux éléments d'une paire `p` dans `a` et `b`."
    truth: true
    answer: Ce sont les liaisons structurées de C++17. Elles marchent aussi avec un tuple et une struct.
  - key: qcm-en-tete-pair
    format: multiple-choice
    question: "Quel en-tête déclare `std::pair` ?"
    choices:
      - {text: "`<utility>`", correct: true}
      - {text: "`<pair>`", correct: false}
      - {text: "`<vector>`", correct: false}
      - {text: "`<algorithm>`", correct: false}
    answer: "`<utility>`. `std::tuple` a son propre en-tête, `<tuple>` ; `<pair>` n'existe pas."
  - key: qcm-deduction
    format: multiple-choice
    question: "Quel est le type de `p` après `std::pair p{1, 2.5};` ?"
    choices:
      - {text: "`std::pair<int, double>`", correct: true}
      - {text: "`std::pair<int, int>`", correct: false}
      - {text: "`std::pair<double, double>`", correct: false}
      - {text: "`std::pair<auto, auto>`", correct: false}
    answer: "Les types sont déduits des deux valeurs : `1` est un `int`, `2.5` un `double`."
  - key: qcm-get-par-type
    format: multiple-choice
    question: "Sur un `std::tuple<int, std::string, double>`, que fait `std::get<double>(t)` ?"
    choices:
      - {text: "Il renvoie l'élément de type `double`, le seul de ce type", correct: true}
      - {text: "Il convertit le premier élément en `double`", correct: false}
      - {text: "Il renvoie tous les éléments, convertis en `double`", correct: false}
      - {text: "Rien : `std::get` n'accepte qu'un indice", correct: false}
    answer: "`std::get` accepte un type à la place de l'indice, à condition qu'un seul élément ait ce type. Avec deux `double`, l'appel ne compile pas."
  - key: qcm-ou-les-croise
    format: multiple-choice
    question: "De quel type sont les éléments d'une `std::map<std::string, int>` ?"
    choices:
      - {text: "Des paires : la clé dans `first`, la valeur dans `second`", correct: true}
      - {text: "Des tuples de trois éléments : l'indice, la clé, la valeur", correct: false}
      - {text: "Des entiers : les clés ne sont pas stockées", correct: false}
      - {text: "Des chaînes : les valeurs sont converties en texte", correct: false}
    answer: "Chaque élément est un `std::pair<const std::string, int>`. C'est pourquoi on écrit `auto& [cle, valeur]` pour parcourir une map."
  - key: trous-first
    format: fill-in
    question: |-
      Complète pour afficher le nom, rangé en premier dans la paire :
      ```cpp
      std::pair<std::string, int> personne{"Ada", 36};
      std::println("{}", personne.___);
      ```
    blanks:
      - [first]
    answer: "`first` est le premier élément de la paire, `second` le deuxième."
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour lire le premier élément du tuple :
      ```cpp
      std::tuple<int, std::string, double> ligne{2, "stylo", 1.5};
      int quantite = std::___<0>(ligne);
      ```
    blanks:
      - [get]
    answer: "`std::get<0>(ligne)` renvoie l'élément d'indice 0."
  - key: trous-liaisons
    format: fill-in
    question: |-
      Complète pour décomposer la paire en deux variables :
      ```cpp
      std::pair<std::string, int> personne{"Ada", 36};
      auto ___nom, age___ = personne;
      ```
    blanks:
      - ["["]
      - ["]"]
    answer: "Les liaisons structurées s'écrivent entre crochets : `auto [nom, age] = personne;`."
  - key: trous-en-tete-tuple
    format: fill-in
    question: |-
      Complète avec l'en-tête qui déclare `std::tuple` :
      ```cpp
      #include <___>

      std::tuple<int, int, int> date{13, 11, 2026};
      ```
    blanks:
      - [tuple]
    answer: "`std::tuple` est déclaré dans `<tuple>`."
  - key: code-pair
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          std::pair<std::string, int> p{"Ada", 36};
          p.second += 1;
          std::println("{} {}", p.first, p.second);
      }
      ```
    choices:
      - {text: "`Ada 37`", correct: true}
      - {text: "`Ada 36`", correct: false}
      - {text: "`37 Ada`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Ada 37` : `first` contient le nom, `second` l'âge, qu'on modifie comme n'importe quelle variable."
    check:
      output: "Ada 37"
  - key: code-tuple
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <tuple>

      int main() {
          std::tuple<int, std::string, double> t{1, "deux", 3.5};
          std::println("{} {} {}", std::get<1>(t), std::get<0>(t), std::get<2>(t));
      }
      ```
    choices:
      - {text: "`deux 1 3.5`", correct: true}
      - {text: "`1 deux 3.5`", correct: false}
      - {text: "`deux 3.5 1`", correct: false}
      - {text: "`1 3.5 deux`", correct: false}
    answer: "`deux 1 3.5` : les indices partent de 0. `std::get<1>` est la chaîne, `std::get<0>` l'entier, `std::get<2>` le nombre à virgule."
    check:
      output: "deux 1 3.5"
  - key: code-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      int main() {
          std::pair<int, int> a{1, 9};
          std::pair<int, int> b{2, 0};
          std::pair<int, int> c{1, 3};
          std::println("{} {} {}", a < b, a < c, a == a);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false true true`", correct: false}
    answer: "`true false true` : `a < b` se décide sur `first`, 1 contre 2. Pour `a < c`, les `first` sont égaux : `second` départage, et 9 n'est pas inférieur à 3."
    check:
      output: "true false true"
  - key: code-liaisons
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      std::pair<int, int> bornes(int a, int b) {
          if (a < b) {
              return {a, b};
          }
          return {b, a};
      }

      int main() {
          auto [petit, grand] = bornes(9, 4);
          std::println("{} {}", petit, grand);
      }
      ```
    choices:
      - {text: "`4 9`", correct: true}
      - {text: "`9 4`", correct: false}
      - {text: "`4 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`4 9` : la fonction renvoie la paire rangée dans l'ordre, et les liaisons structurées la décomposent : `first` dans `petit`, `second` dans `grand`."
    check:
      output: "4 9"
  - key: bug-first-avec-parentheses
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          std::pair<std::string, int> p{"Ada", 36};
          std::println("{}", p.first());
      }
      ```
    choices:
      - {text: "Écrire `p.first`, sans parenthèses", correct: true}
      - {text: "Écrire `p.get_first()`", correct: false}
      - {text: "Écrire `p[0]`", correct: false}
      - {text: "Écrire `p::first`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", p.first);
      ```
      `first` et `second` sont des membres de données, pas des fonctions.
  - key: bug-indice-trop-grand
    format: bug-fix
    question: |-
      Ce code ne compile pas. Il doit afficher le prix, dernier élément du tuple. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <tuple>

      int main() {
          std::tuple<int, std::string, double> ligne{2, "stylo", 1.5};
          std::println("{}", std::get<3>(ligne));
      }
      ```
    choices:
      - {text: "Écrire `std::get<2>(ligne)`", correct: true}
      - {text: "Écrire `std::get<-1>(ligne)`", correct: false}
      - {text: "Écrire `std::get(3, ligne)`", correct: false}
      - {text: "Écrire `ligne.third`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::get<2>(ligne));
      ```
      Un tuple de trois éléments a les indices 0, 1 et 2. L'indice est vérifié à la compilation : l'erreur se voit
      avant l'exécution.
  - key: bug-crochets-sur-tuple
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator[]' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <tuple>

      int main() {
          std::tuple<int, int, int> date{13, 11, 2026};
          std::println("{}", date[2]);
      }
      ```
    choices:
      - {text: "Écrire `std::get<2>(date)`", correct: true}
      - {text: "Écrire `date.at(2)`", correct: false}
      - {text: "Écrire `date(2)`", correct: false}
      - {text: "Écrire `date.2`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", std::get<2>(date));
      ```
      Un tuple n'est pas un tableau : ses éléments peuvent être de types différents, et l'indice doit être connu à la
      compilation. On les lit avec `std::get`.
  - key: bug-first-et-second-inverses
    format: bug-fix
    question: |-
      Ce programme affiche `36 a Ada ans`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          std::pair<std::string, int> personne{"Ada", 36};
          std::println("{} a {} ans", personne.second, personne.first);
      }
      ```
    choices:
      - {text: "Échanger `personne.first` et `personne.second` dans l'affichage", correct: true}
      - {text: "Échanger `std::string` et `int` dans le type de la paire", correct: false}
      - {text: "Remplacer `std::pair` par `std::tuple` dans la déclaration", correct: false}
      - {text: "Remplacer chaque `{}` par `{:s}` dans la chaîne de format", correct: false}
    answer: |-
      ```cpp
      std::println("{} a {} ans", personne.first, personne.second);
      ```
      Le nom est dans `first`, l'âge dans `second`. Rien dans ces noms ne le rappelle : c'est le défaut des paires. Une
      `struct Personne { std::string nom; int age; };` aurait rendu l'erreur impossible.
