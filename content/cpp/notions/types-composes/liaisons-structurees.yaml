notion: liaisons-structurees
lesson: |-
  Une **liaison structurée** (*structured binding*, C++17) décompose un objet en plusieurs noms, en une seule
  déclaration.

  ```cpp
  std::pair<std::string, int> personne{"Ada", 36};
  auto [nom, age] = personne;       // nom vaut "Ada", age vaut 36
  ```

  Sans elle, on écrirait `personne.first` et `personne.second`, qui ne disent rien de ce qu'ils contiennent.

  **Ce qu'on peut décomposer.**

  | Type | Les noms désignent |
  |---|---|
  | une `struct` dont tous les membres sont publics | ses membres, dans l'ordre de déclaration |
  | `std::pair`, `std::tuple` | ses éléments |
  | un tableau C, un `std::array` | ses éléments |

  Il faut **exactement autant de noms** que d'éléments, et le mot-clé **`auto`** : on n'écrit pas les types.

  **Copie ou référence.** `auto` seul **copie** l'objet, puis nomme les parties de la copie. Pour agir sur
  l'original, ou éviter la copie, on ajoute `&` :

  ```cpp
  auto [x, y] = point;            // copie : modifier x ne change pas point
  auto& [x, y] = point;           // référence : modifier x change point.x
  const auto& [x, y] = point;     // lecture seule, sans copie
  ```

  **Là où elles brillent.**

  Parcourir une map, dont chaque élément est une paire clé-valeur :

  ```cpp
  for (const auto& [mot, compte] : occurrences) {
      std::println("{} : {}", mot, compte);
  }
  ```

  Recevoir plusieurs résultats d'une fonction :

  ```cpp
  auto [minimum, maximum] = std::minmax({3, 1, 4});
  auto [position, insere] = ensemble.insert(42);    // un itérateur et un booléen
  ```

  Et dans un `if` avec initialisation :

  ```cpp
  if (auto [it, insere] = ensemble.insert(42); insere) { ... }
  ```

  **Les limites.** On ne peut pas ignorer un élément : il faut le nommer quand même. Les liaisons ne s'emboîtent
  pas (`auto [a, [b, c]]` n'existe pas). Et une classe aux membres privés ne se décompose pas.

  **En entretien** : « `auto [a, b] = objet;` décompose une paire, un tuple, un tableau ou une struct publique.
  `auto` seul copie ; `auto&` ou `const auto&` lient à l'original. Je m'en sers surtout pour parcourir une map et
  pour les fonctions qui renvoient une paire. »
tour:
  - title: Décomposer un objet
    text: |-
      Une liaison structurée donne un nom à chaque partie d'un objet, en une ligne : `auto [nom, age] = personne;`.

      Elle fonctionne avec une `struct`, une paire, un tuple ou un tableau. Elle est très utile pour parcourir une
      map, dont chaque élément est une paire : la clé, puis la valeur.

      Essaie : ajoute une entrée `{"poire", 4}` au stock, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <map>
          #include <print>
          #include <string>

          struct Point {
              int x;
              int y;
          };

          int main() {
              const Point p{3, 4};
              const auto [x, y] = p;
              std::println("{} {}", x, y);

              const std::map<std::string, int> stock{{"pomme", 12}, {"kiwi", 5}};
              for (const auto& [fruit, quantite] : stock) {
                  std::println("{} : {}", fruit, quantite);
              }
          }
      output: |-
        3 4
        kiwi : 5
        pomme : 12
cards:
  - key: role
    format: course
    question: "Que fait `auto [nom, age] = personne;`, où `personne` est un `std::pair<std::string, int>` ?"
    choices:
      - {text: "Il copie la paire, et nomme `nom` et `age` ses deux éléments", correct: true}
      - {text: "Il crée un tableau de deux éléments appelés `nom` et `age`", correct: false}
      - {text: "Il compare `nom` et `age` aux deux éléments de la paire", correct: false}
      - {text: "Il capture `nom` et `age`, comme le ferait une lambda", correct: false}
    answer: "C'est une liaison structurée : chaque nom désigne une partie de l'objet décomposé, ici d'une copie de la paire."
  - key: types-acceptes
    format: course
    question: "Lequel de ces objets ne peut pas être décomposé par une liaison structurée ?"
    choices:
      - {text: "Un `std::vector<int>`", correct: true}
      - {text: "Un `std::pair<int, int>`", correct: false}
      - {text: "Un `std::array<int, 3>`", correct: false}
      - {text: "Une struct aux membres publics", correct: false}
    answer: "Le nombre d'éléments doit être connu à la compilation. Celui d'un vecteur ne l'est qu'à l'exécution."
  - key: copie-ou-reference
    format: course
    question: "Quelle différence entre `auto [x, y] = p;` et `auto& [x, y] = p;` ?"
    choices:
      - {text: "Le premier travaille sur une copie de `p` ; le second sur `p` lui-même", correct: true}
      - {text: "Le premier travaille sur `p` lui-même ; le second sur une copie de `p`", correct: false}
      - {text: "Le premier déduit les types ; le second exige de les écrire", correct: false}
      - {text: "Aucune : les deux modifient `p` quand on modifie `x`", correct: false}
    answer: "Sans `&`, l'objet est copié, et les noms désignent les parties de la copie. Avec `&`, modifier `x` modifie `p.x`."
  - key: nombre-de-noms
    format: course
    question: "Combien de noms faut-il dans une liaison structurée ?"
    choices:
      - {text: "Exactement autant que l'objet a d'éléments", correct: true}
      - {text: "Au plus autant que l'objet a d'éléments", correct: false}
      - {text: "Au moins deux, quel que soit l'objet", correct: false}
      - {text: "Un seul, suivi de points de suspension", correct: false}
    answer: "On ne peut ni en omettre ni en ajouter. Pour un élément dont on n'a pas besoin, on écrit quand même un nom."
  - key: vf-auto
    format: true-false
    question: "Une liaison structurée peut s'écrire avec un type explicite : `int [a, b] = paire;`."
    truth: false
    answer: "Seul `auto` est permis, éventuellement avec `const` et `&`. Les types des noms sont déduits."
  - key: vf-map
    format: true-false
    question: "`for (const auto& [cle, valeur] : m)` parcourt une `std::map` en nommant la clé et la valeur."
    truth: true
    answer: "Chaque élément d'une map est une paire : la liaison la décompose à chaque tour."
  - key: vf-copie
    format: true-false
    question: "Après `auto [x, y] = p;`, modifier `x` modifie `p.x`."
    truth: false
    answer: "`auto` seul copie `p`. Il faut `auto& [x, y] = p;` pour agir sur l'original."
  - key: vf-version
    format: true-false
    question: "Les liaisons structurées existent depuis C++17."
    truth: true
    answer: "Avant, on utilisait `std::tie`, ou les membres `first` et `second`."
  - key: qcm-map
    format: multiple-choice
    question: "Quelle boucle parcourt une `std::map<std::string, int>` sans copier ses éléments ?"
    choices:
      - {text: "`for (const auto& [nom, n] : m)`", correct: true}
      - {text: "`for (auto [nom, n] : m)`", correct: false}
      - {text: "`for (const auto& (nom, n) : m)`", correct: false}
      - {text: "`for (std::string nom, int n : m)`", correct: false}
    answer: "Les crochets, et `const auto&` pour éviter de copier chaque paire. `auto` seul copierait la chaîne à chaque tour."
  - key: qcm-insert
    format: multiple-choice
    question: "`std::set<int> s;` Que nomment `it` et `ok` dans `auto [it, ok] = s.insert(7);` ?"
    choices:
      - {text: "Un itérateur sur l'élément, et un booléen qui dit s'il a été inséré", correct: true}
      - {text: "L'élément inséré, et la nouvelle taille de l'ensemble", correct: false}
      - {text: "Le premier et le dernier élément de l'ensemble", correct: false}
      - {text: "L'ancienne et la nouvelle taille de l'ensemble", correct: false}
    answer: "`insert` renvoie une paire. La liaison évite d'écrire `.first` et `.second`."
  - key: qcm-struct
    format: multiple-choice
    question: "`struct Point { int x; int y; };` et `Point p{3, 4};`. Que vaut `b` après `auto [a, b] = p;` ?"
    choices:
      - {text: "`4`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`7`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Les noms suivent l'ordre de déclaration des membres : `a` reçoit `x`, `b` reçoit `y`. Les noms choisis n'ont pas à être ceux des membres."
  - key: qcm-lecture-seule
    format: multiple-choice
    question: "Quelle déclaration décompose `p` sans le copier, et sans pouvoir le modifier ?"
    choices:
      - {text: "`const auto& [x, y] = p;`", correct: true}
      - {text: "`auto [x, y] = p;`", correct: false}
      - {text: "`auto& [x, y] = p;`", correct: false}
      - {text: "`const auto [x, y] = p;`", correct: false}
    answer: "`const auto&` lie les noms à l'original, en lecture seule. `const auto` fait une copie constante."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète la liaison structurée :
      ```cpp
      ___ [nom, age] = personne;
      ```
    blanks:
      - [auto]
    answer: "Une liaison structurée se déclare avec `auto`."
  - key: trous-crochets
    format: fill-in
    question: |-
      Complète pour nommer la clé et la valeur de chaque élément :
      ```cpp
      for (const auto& ___ : stock) {
          std::println("{} : {}", fruit, quantite);
      }
      ```
    blanks:
      - ["[fruit, quantite]"]
    answer: "Les noms s'écrivent entre crochets, séparés par une virgule."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour que modifier `x` modifie le point d'origine :
      ```cpp
      auto___ [x, y] = point;
      x = 0;
      ```
    blanks:
      - ["&"]
    answer: "`auto&` lie les noms aux membres de `point`, au lieu d'en faire une copie."
  - key: trous-second
    format: fill-in
    question: |-
      Complète pour récupérer le booléen que renvoie `insert` :
      ```cpp
      auto [position, ___] = ensemble.insert(42);
      if (insere) {
          std::println("nouveau");
      }
      ```
    blanks:
      - [insere]
    answer: "Le second élément de la paire renvoyée par `insert` dit si l'insertion a eu lieu."
  - key: code-pair
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          const std::pair<std::string, int> personne{"Ada", 36};
          const auto [nom, age] = personne;
          std::println("{} {}", nom, age + 1);
      }
      ```
    choices:
      - {text: "`Ada 37`", correct: true}
      - {text: "`Ada 36`", correct: false}
      - {text: "`37 Ada`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Ada 37` : `nom` désigne le premier élément de la paire, `age` le second."
    check:
      output: "Ada 37"
  - key: code-copie-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p{1, 2};
          auto [a, b] = p;
          a = 10;
          auto& [c, d] = p;
          d = 20;
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "`1 20`", correct: true}
      - {text: "`10 20`", correct: false}
      - {text: "`1 2`", correct: false}
      - {text: "`10 2`", correct: false}
    answer: "`1 20` : `a` appartient à une copie de `p`, que l'affectation ne touche pas. `d` est lié à `p.y` par référence."
    check:
      output: "1 20"
  - key: code-map
    format: code-output
    question: |-
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> stock{{"b", 2}, {"a", 5}};
          for (auto& [nom, quantite] : stock) {
              quantite *= 10;
          }
          for (const auto& [nom, quantite] : stock) {
              std::print("{}{} ", nom, quantite);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`a50 b20 fin`", correct: true}
      - {text: "`b20 a50 fin`", correct: false}
      - {text: "`a5 b2 fin`", correct: false}
      - {text: "`b2 a5 fin`", correct: false}
    answer: "`a50 b20 fin` : la première boucle modifie les valeurs par référence. La map se parcourt dans l'ordre de ses clés."
    check:
      output: "a50 b20 fin"
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      std::array<int, 3> mesures() {
          return {4, 8, 15};
      }

      int main() {
          const auto [petit, moyen, grand] = mesures();
          std::println("{}", grand - petit + moyen);
      }
      ```
    choices:
      - {text: "`19`", correct: true}
      - {text: "`27`", correct: false}
      - {text: "`11`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`19` : un `std::array` se décompose en ses éléments. 15 - 4 + 8 = 19."
    check:
      output: "19"
  - key: bug-nombre-de-noms
    format: bug-fix
    question: |-
      Le compilateur répond « only 2 names provided for structured binding ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Couleur {
          int rouge;
          int vert;
          int bleu;
      };

      int main() {
          const Couleur c{255, 128, 0};
          const auto [rouge, vert] = c;
          std::println("{} {}", rouge, vert);
      }
      ```
    choices:
      - {text: "Nommer les trois membres : `const auto [rouge, vert, bleu] = c;`", correct: true}
      - {text: "Écrire des points de suspension : `const auto [rouge, vert, ...] = c;`", correct: false}
      - {text: "Laisser une place vide : `const auto [rouge, vert, ] = c;`", correct: false}
      - {text: "Écrire les types : `const int [rouge, vert] = c;`", correct: false}
    answer: |-
      ```cpp
      const auto [rouge, vert, bleu] = c;
      ```
      `Couleur` a trois membres : il faut trois noms, même si l'on ne se sert pas du dernier.
  - key: bug-type-explicite
    format: bug-fix
    question: |-
      Le compilateur répond « structured binding declaration cannot have type 'int' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <utility>

      int main() {
          const std::pair<int, int> bornes{1, 9};
          int [bas, haut] = bornes;
          std::println("{} {}", bas, haut);
      }
      ```
    choices:
      - {text: "Écrire `auto [bas, haut] = bornes;`", correct: true}
      - {text: "Écrire `int bas, haut = bornes;`", correct: false}
      - {text: "Écrire `int [bas, haut](bornes);`", correct: false}
      - {text: "Écrire `std::pair [bas, haut] = bornes;`", correct: false}
    answer: |-
      ```cpp
      auto [bas, haut] = bornes;
      ```
      Une liaison structurée se déclare toujours avec `auto` : les types des noms sont déduits de l'objet.
  - key: bug-copie-dans-boucle
    format: bug-fix
    question: |-
      Ce programme devrait remettre tous les stocks à zéro et afficher `0`. Il affiche `12`. Quelle correction est
      la bonne ?
      ```cpp
      #include <map>
      #include <print>
      #include <string>

      int main() {
          std::map<std::string, int> stock{{"pomme", 12}};
          for (auto [fruit, quantite] : stock) {
              quantite = 0;
          }
          std::println("{}", stock["pomme"]);
      }
      ```
    choices:
      - {text: "Écrire `for (auto& [fruit, quantite] : stock)`", correct: true}
      - {text: "Écrire `for (const auto [fruit, quantite] : stock)`", correct: false}
      - {text: "Écrire `for (auto [quantite, fruit] : stock)`", correct: false}
      - {text: "Écrire `for (auto* [fruit, quantite] : stock)`", correct: false}
    answer: |-
      ```cpp
      for (auto& [fruit, quantite] : stock) {
      ```
      `auto` seul copie chaque élément : la boucle remet à zéro des copies. Avec `&`, `quantite` désigne la valeur
      rangée dans la map.
  - key: bug-membres-prives
    format: bug-fix
    question: |-
      Le compilateur répond « cannot decompose inaccessible member 'Point::x_' of 'Point' ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) : x_{x}, y_{y} {}
          int x() const { return x_; }
          int y() const { return y_; }

      private:
          int x_;
          int y_;
      };

      int main() {
          const Point p{3, 4};
          const auto [x, y] = p;
          std::println("{} {}", x, y);
      }
      ```
    choices:
      - {text: "Lire les valeurs par les accesseurs : `p.x()` et `p.y()`", correct: true}
      - {text: "Écrire `const auto& [x, y] = p;` pour lier par référence", correct: false}
      - {text: "Écrire `const auto [x_, y_] = p;` avec les noms des membres", correct: false}
      - {text: "Écrire `const auto [x, y] = *p;` pour déréférencer l'objet", correct: false}
    answer: |-
      ```cpp
      std::println("{} {}", p.x(), p.y());
      ```
      Une liaison structurée décompose les membres publics. Ceux d'une classe qui les garde privés ne sont
      accessibles que par ses fonctions membres.
