notion: std-vector
lesson: |-
  **`std::vector`**, dans `<vector>`, est un **tableau qui grandit** : ses éléments sont du même type, rangés côte à
  côte en mémoire, et il s'agrandit quand on en ajoute. C'est le conteneur par défaut en C++.

  ```cpp
  std::vector<int> notes{12, 15, 9};   // le type des éléments entre chevrons
  notes.push_back(18);                 // ajoute à la fin
  ```

  | Opération | Écriture |
  |---|---|
  | Nombre d'éléments | `v.size()` ; `v.empty()` |
  | Un élément | `v[i]`, sans vérification ; `v.at(i)`, vérifié |
  | Premier, dernier | `v.front()`, `v.back()` |
  | Ajouter, retirer à la fin | `v.push_back(x)`, `v.pop_back()` |
  | Tout retirer | `v.clear()` |
  | Parcourir | `for (int note : v)` |

  - Les indices vont de **0 à `size() - 1`**. `v[i]` hors des bornes est un comportement indéfini ; `v.at(i)` lève
    `std::out_of_range`.
  - `size()` renvoie un **`std::size_t`**, non signé : sur un vecteur vide, `v.size() - 1` ne vaut pas -1, mais un
    nombre énorme.
  - Copier un vecteur **copie tous ses éléments** : `auto b = a;` crée un vecteur indépendant. On le passe donc par
    `const std::vector<int>&`, ou par référence pour le modifier.
  - Le vecteur libère sa mémoire tout seul, à la fin de sa portée.

  **Parenthèses ou accolades.** Les deux ne veulent pas dire la même chose :

  ```cpp
  std::vector<int> a(5);      // 5 éléments, tous à zéro
  std::vector<int> b{5};      // 1 élément, qui vaut 5
  std::vector<int> c(3, 7);   // 3 éléments, qui valent 7
  ```

  **Pièges classiques.**

  - Écrire dans un vecteur vide avec `v[0] = 5;` : la case n'existe pas. On ajoute avec `push_back`.
  - Créer `std::vector<int> v(3);` puis faire trois `push_back` : le vecteur a six éléments.

  **En entretien** : « `std::vector` est mon conteneur par défaut : mémoire contiguë, accès direct, ajout à la fin en
  temps constant amorti. `at` pour un indice que je ne maîtrise pas. »
tour:
  - title: std::vector, le tableau qui grandit
    text: |-
      `std::vector<int>` est un tableau d'entiers dont la taille change : `push_back` ajoute un élément à la fin,
      `size()` dit combien il y en a, et `v[i]` donne l'élément numéro `i`, à partir de 0.

      Le type des éléments s'écrit entre chevrons : `std::vector<double>`, `std::vector<std::string>`.

      Attention à `v[i]` : il ne vérifie pas l'indice. `v.at(i)` le fait, et arrête le programme sur une exception si
      l'indice est faux.

      Essaie : remplace `notes[0]` par `notes.at(10)`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> notes{12, 15, 9};
              notes.push_back(18);

              int somme = 0;
              for (int note : notes) {
                  somme += note;
              }

              std::println("{} notes, première : {}, dernière : {}", notes.size(), notes[0], notes.back());
              std::println("moyenne : {}", somme / 4.0);
          }
      output: |-
        4 notes, première : 12, dernière : 18
        moyenne : 13.5
    task:
      instructions: |-
        Remplis le vecteur avec les carrés des nombres de 1 à 5, dans une boucle, pour afficher `5 carrés, dernier : 25`.
      starter:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> carres;

              carres.push_back(1);

              std::println("{} carrés, dernier : {}", carres.size(), carres.back());
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <vector>

          int main() {
              std::vector<int> carres;

              for (int i = 1; i <= 5; ++i) {
                  carres.push_back(i * i);
              }

              std::println("{} carrés, dernier : {}", carres.size(), carres.back());
          }
      output: "5 carrés, dernier : 25"
cards:
  - key: role-du-vector
    format: course
    question: "Qu'est-ce qu'un `std::vector` ?"
    choices:
      - {text: "Un tableau dont la taille peut changer pendant l'exécution", correct: true}
      - {text: "Un tableau dont la taille est fixée à la compilation", correct: false}
      - {text: "Une liste chaînée, où chaque élément pointe vers le suivant", correct: false}
      - {text: "Un couple de coordonnées, comme en géométrie", correct: false}
    answer: "Un tableau dynamique : ses éléments sont contigus en mémoire, et il s'agrandit quand on en ajoute. Le tableau de taille fixe est `std::array`, la liste chaînée `std::list`."
  - key: parentheses-ou-accolades
    format: course
    question: "Quelle différence entre `std::vector<int> a(5);` et `std::vector<int> b{5};` ?"
    choices:
      - {text: "`a` contient cinq zéros, `b` contient le seul élément 5", correct: true}
      - {text: "`a` contient le seul élément 5, `b` contient cinq zéros", correct: false}
      - {text: "Aucune : les deux contiennent cinq zéros", correct: false}
      - {text: "Aucune : les deux contiennent le seul élément 5", correct: false}
    answer: "Les parenthèses donnent une taille ; les accolades donnent la liste des éléments. C'est le cas où l'initialisation par accolades change de sens."
  - key: copie-profonde
    format: course
    question: "Que fait `auto b = a;` quand `a` est un `std::vector<int>` ?"
    choices:
      - {text: "Elle copie tous les éléments : `b` est un vecteur indépendant", correct: true}
      - {text: "Elle fait de `b` un second nom pour le même vecteur", correct: false}
      - {text: "Elle déplace les éléments dans `b`, et vide `a`", correct: false}
      - {text: "Elle copie la taille de `a`, sans ses éléments", correct: false}
    answer: "Une copie complète. Modifier `b` ne touche pas `a`. C'est aussi pourquoi on passe un vecteur par référence constante : par valeur, chaque appel le recopie."
  - key: acces-hors-bornes
    format: course
    question: "Que se passe-t-il avec `v[10]` sur un vecteur de trois éléments ?"
    choices:
      - {text: "C'est un comportement indéfini : aucun contrôle n'est fait", correct: true}
      - {text: "Une exception `std::out_of_range` est levée", correct: false}
      - {text: "Le vecteur s'agrandit jusqu'à onze éléments", correct: false}
      - {text: "L'expression vaut zéro, la valeur par défaut", correct: false}
    answer: "Les crochets ne vérifient pas l'indice : le programme lit hors du tableau. C'est `v.at(10)` qui lève `std::out_of_range`. Un vecteur ne grandit que par `push_back`, `resize` ou `insert`."
  - key: vf-indices
    format: true-false
    question: "Le dernier élément d'un vecteur `v` non vide est `v[v.size()]`."
    truth: false
    answer: "Les indices vont de 0 à `size() - 1` : le dernier est `v[v.size() - 1]`, ou `v.back()`."
  - key: vf-liberation
    format: true-false
    question: Un `std::vector` libère sa mémoire tout seul, à la fin de sa portée.
    truth: true
    answer: Son destructeur s'en charge. Aucun `delete` à écrire.
  - key: vf-size-non-signe
    format: true-false
    question: "Sur un vecteur vide, `v.size() - 1` vaut -1."
    truth: false
    answer: "`size()` renvoie un entier non signé : la soustraction reboucle vers un nombre énorme."
  - key: vf-types-melanges
    format: true-false
    question: Un même `std::vector` peut contenir des `int` et des `std::string`.
    truth: false
    answer: "Tous ses éléments ont le type écrit entre chevrons. Pour mélanger, il faut un type qui les réunit, comme `std::variant`."
  - key: qcm-ajouter
    format: multiple-choice
    question: Quelle fonction ajoute un élément à la fin d'un vecteur ?
    choices:
      - {text: "`push_back`", correct: true}
      - {text: "`append`", correct: false}
      - {text: "`add`", correct: false}
      - {text: "`push`", correct: false}
    answer: "`v.push_back(x)`. `append` est le nom de Python, `add` celui de Java, `push` celui de JavaScript."
  - key: qcm-trois-sept
    format: multiple-choice
    question: Quelle déclaration crée un vecteur de trois éléments qui valent tous 7 ?
    choices:
      - {text: "`std::vector<int> v(3, 7);`", correct: true}
      - {text: "`std::vector<int> v{3, 7};`", correct: false}
      - {text: "`std::vector<int> v(7, 3);`", correct: false}
      - {text: "`std::vector<int> v[3] = 7;`", correct: false}
    answer: "Entre parenthèses : la taille, puis la valeur. Entre accolades, `{3, 7}` est la liste des deux éléments 3 et 7."
  - key: qcm-parametre
    format: multiple-choice
    question: "Quelle signature permet à une fonction d'ajouter un élément au vecteur de l'appelant ?"
    choices:
      - {text: "`void ajouter(std::vector<int>& v)`", correct: true}
      - {text: "`void ajouter(std::vector<int> v)`", correct: false}
      - {text: "`void ajouter(const std::vector<int>& v)`", correct: false}
      - {text: "`void ajouter(const std::vector<int> v)`", correct: false}
    answer: "Une référence non constante. Par valeur, la fonction modifie une copie ; avec `const`, elle ne peut rien ajouter."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::vector` ?"
    choices:
      - {text: "`<vector>`", correct: true}
      - {text: "`<array>`", correct: false}
      - {text: "`<list>`", correct: false}
      - {text: "`<algorithm>`", correct: false}
    answer: "`<vector>`. Chaque conteneur a son en-tête : `<array>`, `<list>`, `<map>`..."
  - key: trous-type-des-elements
    format: fill-in
    question: |-
      Complète avec le type des éléments :
      ```cpp
      std::vector<___> notes{12, 15, 9};
      ```
    blanks:
      - [int]
    answer: "`std::vector<int>` : un vecteur d'entiers."
  - key: trous-push-back
    format: fill-in
    question: |-
      Complète pour ajouter 18 à la fin du vecteur :
      ```cpp
      std::vector<int> notes{12, 15, 9};
      notes.___(18);
      ```
    blanks:
      - [push_back, emplace_back]
    answer: "`push_back` ajoute un élément à la fin."
  - key: trous-size
    format: fill-in
    question: |-
      Complète pour parcourir tous les indices du vecteur :
      ```cpp
      for (std::size_t i = 0; i < notes.___(); ++i) {
          std::println("{}", notes[i]);
      }
      ```
    blanks:
      - [size]
    answer: "`size()` donne le nombre d'éléments : les indices vont de 0 à `size() - 1`."
  - key: trous-at
    format: fill-in
    question: |-
      Complète avec l'accès qui vérifie l'indice :
      ```cpp
      std::vector<int> notes{12, 15, 9};
      std::println("{}", notes.___(indice));
      ```
    blanks:
      - [at]
    answer: "`at(indice)` lève `std::out_of_range` si l'indice est hors des bornes."
  - key: code-push-back
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2};
          v.push_back(3);
          v.pop_back();
          v.push_back(4);
          std::println("{} {}", v.size(), v.back());
      }
      ```
    choices:
      - {text: "`3 4`", correct: true}
      - {text: "`4 4`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "`2 4`", correct: false}
    answer: "`3 4` : le vecteur contient 1, 2, 3, puis 1, 2 après `pop_back`, puis 1, 2, 4."
    check:
      output: "3 4"
  - key: code-parentheses-accolades
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a(5);
          std::vector<int> b{5};
          std::println("{} {} {}", a.size(), b.size(), a[0] + b[0]);
      }
      ```
    choices:
      - {text: "`5 1 5`", correct: true}
      - {text: "`1 5 5`", correct: false}
      - {text: "`5 5 0`", correct: false}
      - {text: "`1 1 10`", correct: false}
    answer: "`5 1 5` : `a(5)` contient cinq zéros, `b{5}` le seul élément 5. La somme des premiers éléments vaut 0 + 5."
    check:
      output: "5 1 5"
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> a{1, 2, 3};
          auto b = a;
          b[0] = 99;
          b.push_back(4);
          std::println("{} {} {}", a[0], a.size(), b.size());
      }
      ```
    choices:
      - {text: "`1 3 4`", correct: true}
      - {text: "`99 4 4`", correct: false}
      - {text: "`99 3 4`", correct: false}
      - {text: "`1 4 4`", correct: false}
    answer: "`1 3 4` : `b` est une copie indépendante. La modifier ne change ni les éléments ni la taille de `a`."
    check:
      output: "1 3 4"
  - key: code-at-hors-bornes
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> v{10, 20};
          std::println("{}", v.at(1));
          std::println("{}", v.at(2));
      }
      ```
    choices:
      - {text: "`20`, puis une exception `std::out_of_range`", correct: true}
      - {text: "`10`, puis une exception `std::out_of_range`", correct: false}
      - {text: "`20`, puis `0`", correct: false}
      - {text: "`10`, puis `20`", correct: false}
    answer: "`20`, puis `std::out_of_range` : les indices valides sont 0 et 1. `at(2)` le vérifie, et lève une exception que personne ne rattrape."
    check:
      output: "20"
      throws: "std::out_of_range"
  - key: bug-ecrire-dans-un-vecteur-vide
    format: bug-fix
    question: |-
      Ce programme plante (« Segmentation fault »). Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes;
          notes[0] = 12;
          std::println("{}", notes.size());
      }
      ```
    choices:
      - {text: "Écrire `notes.push_back(12);`", correct: true}
      - {text: "Écrire `notes[1] = 12;`", correct: false}
      - {text: "Écrire `notes.at(0) = 12;`", correct: false}
      - {text: "Écrire `notes = 12;`", correct: false}
    answer: |-
      ```cpp
      notes.push_back(12);
      ```
      Un vecteur vide n'a pas de case 0 : y écrire est un comportement indéfini. `push_back` crée l'élément. `at(0)`
      remplacerait le plantage par une exception, sans rien ajouter.
  - key: bug-taille-puis-push-back
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, et affiche `6`. Pourquoi ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes(3);
          notes.push_back(12);
          notes.push_back(15);
          notes.push_back(9);
          std::println("{}", notes.size());
      }
      ```
    choices:
      - {text: "`notes(3)` crée déjà trois zéros, et `push_back` ajoute après eux", correct: true}
      - {text: "`push_back` ajoute chaque note en deux exemplaires", correct: false}
      - {text: "`size()` compte les octets, deux par élément", correct: false}
      - {text: "`notes(3)` réserve trois places, que `size()` compte en plus", correct: false}
    answer: |-
      ```cpp
      std::vector<int> notes;
      ```
      Les parenthèses créent trois éléments à zéro. Les trois `push_back` en ajoutent trois autres : 0, 0, 0, 12, 15, 9.
      On part d'un vecteur vide.
  - key: bug-passage-par-valeur
    format: bug-fix
    question: |-
      Ce programme affiche `3` au lieu de `4` : la note n'est pas ajoutée. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      void ajouter(std::vector<int> notes, int note) {
          notes.push_back(note);
      }

      int main() {
          std::vector<int> notes{12, 15, 9};
          ajouter(notes, 18);
          std::println("{}", notes.size());
      }
      ```
    choices:
      - {text: "Écrire le paramètre `std::vector<int>& notes`", correct: true}
      - {text: "Écrire le paramètre `const std::vector<int>& notes`", correct: false}
      - {text: "Écrire l'appel `ajouter(&notes, 18)`", correct: false}
      - {text: "Écrire `notes.push_back(note, note);`", correct: false}
    answer: |-
      ```cpp
      void ajouter(std::vector<int>& notes, int note) {
      ```
      Par valeur, la fonction reçoit une copie du vecteur, et c'est à elle qu'elle ajoute la note. Une référence
      désigne le vecteur de l'appelant.
  - key: bug-inferieur-ou-egal
    format: bug-fix
    question: |-
      Ce programme affiche les trois notes, puis un quatrième nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> notes{12, 15, 9};
          for (std::size_t i = 0; i <= notes.size(); ++i) {
              std::println("{}", notes[i]);
          }
      }
      ```
    choices:
      - {text: "Écrire la condition `i < notes.size()`", correct: true}
      - {text: "Écrire la condition `i <= notes.size() + 1`", correct: false}
      - {text: "Écrire l'initialisation `std::size_t i = 1`", correct: false}
      - {text: "Écrire le pas `i += 2`", correct: false}
    answer: |-
      ```cpp
      for (std::size_t i = 0; i < notes.size(); ++i) {
      ```
      Les indices vont de 0 à 2. Avec `<=`, la boucle lit `notes[3]`, hors du vecteur : comportement indéfini. Une
      boucle sur un intervalle, `for (int note : notes)`, écarte ce risque.
