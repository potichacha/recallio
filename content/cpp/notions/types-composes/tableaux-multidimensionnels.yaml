notion: tableaux-multidimensionnels
lesson: |-
  Une grille, une image, une matrice : des données à deux dimensions ou plus. C++ offre plusieurs façons de les
  ranger, qui ne se valent pas.

  **Le tableau de tableaux.**

  ```cpp
  std::array<std::array<int, 3>, 2> grille{{{1, 2, 3}, {4, 5, 6}}};   // 2 lignes, 3 colonnes
  grille[1][2] = 9;                                                   // ligne 1, colonne 2
  ```

  Les six entiers sont **contigus** en mémoire, **ligne après ligne** (ordre *row-major*). Les dimensions sont
  fixées à la compilation. Le tableau C équivalent s'écrit `int grille[2][3];`.

  **Le vecteur de vecteurs.**

  ```cpp
  std::vector<std::vector<int>> grille(2, std::vector<int>(3));   // 2 lignes de 3 zéros
  ```

  Les dimensions se choisissent à l'exécution, mais chaque ligne est une **allocation séparée** : les lignes sont
  dispersées en mémoire, peuvent avoir des longueurs différentes, et le parcours est plus lent.

  **Le tableau à plat.** La forme la plus efficace : un seul `std::vector`, et un calcul d'indice.

  ```cpp
  std::vector<int> grille(lignes * colonnes);
  grille[ligne * colonnes + colonne] = 9;
  ```

  Une seule allocation, des données contiguës. On range ce calcul dans une petite classe pour ne pas le répéter.

  **`std::mdspan` (C++23).** Une **vue** à plusieurs dimensions sur des données contiguës : elle ne possède rien,
  et fait le calcul d'indice à ta place, avec l'opérateur `[]` à plusieurs arguments.

  ```cpp
  std::vector<int> donnees(6);
  std::mdspan vue{donnees.data(), 2, 3};      // 2 lignes, 3 colonnes
  vue[1, 2] = 9;
  vue.extent(0);                              // 2
  ```

  `std::mdspan` est dans l'en-tête `<mdspan>`. La bibliothèque de GCC 14 ne le fournit pas encore : d'ici là, on
  écrit le calcul d'indice à la main.

  **L'ordre de parcours compte.** Les données étant rangées ligne par ligne, on parcourt **les lignes dans la boucle
  extérieure**. Parcourir colonne par colonne saute en mémoire à chaque accès : sur une grande matrice, c'est
  plusieurs fois plus lent.

  **Les pièges.**

  - `grille[1, 2]` sur un tableau de tableaux **n'est pas** `grille[1][2]`. La virgule y est l'opérateur virgule,
    un usage déprécié : GCC lit `grille[2]`, une ligne entière.
  - Un tableau C à deux dimensions passé à une fonction perd sa première dimension : `void f(int g[][3])`.
  - `std::vector<std::vector<int>> g(2, 3)` ne compile pas comme on l'espère : il faut un vecteur pour modèle de
    ligne.

  **En entretien** : « Pour une matrice, je préfère un seul bloc contigu, indexé par `ligne * colonnes + colonne`,
  à un vecteur de vecteurs : une allocation, et un parcours favorable au cache. En C++23, `std::mdspan` donne une
  vue à plusieurs dimensions sur ce bloc. »
cards:
  - key: contigu
    format: course
    question: "Comment sont rangés en mémoire les éléments d'un `std::array<std::array<int, 3>, 2>` ?"
    choices:
      - {text: "Les six entiers se suivent, ligne après ligne", correct: true}
      - {text: "Les six entiers se suivent, colonne après colonne", correct: false}
      - {text: "Chaque ligne est allouée à part, sur le tas", correct: false}
      - {text: "Un tableau de deux pointeurs désigne les deux lignes", correct: false}
    answer: "C'est l'ordre *row-major* : toute la ligne 0, puis toute la ligne 1, dans un seul bloc."
  - key: vecteur-de-vecteurs
    format: course
    question: "Quel est l'inconvénient d'un `std::vector<std::vector<int>>` pour une matrice ?"
    choices:
      - {text: "Chaque ligne est une allocation séparée : les données sont dispersées", correct: true}
      - {text: "Ses dimensions doivent être connues à la compilation", correct: false}
      - {text: "Il ne peut pas contenir plus de deux lignes", correct: false}
      - {text: "Il interdit de modifier un élément après la construction", correct: false}
    answer: "Le parcours saute d'un bloc à l'autre, ce que le cache du processeur n'aime pas. Rien ne garantit non plus que les lignes aient la même longueur."
  - key: a-plat
    format: course
    question: "Dans une matrice rangée à plat, ligne par ligne, quel indice a l'élément (`ligne`, `colonne`) ?"
    choices:
      - {text: "`ligne * colonnes + colonne`", correct: true}
      - {text: "`colonne * colonnes + ligne`", correct: false}
      - {text: "`ligne + colonne`", correct: false}
      - {text: "`ligne * colonne`", correct: false}
    answer: "On saute `ligne` lignes entières, de `colonnes` éléments chacune, puis on avance de `colonne`."
  - key: mdspan
    format: course
    question: "Qu'est-ce que `std::mdspan` (C++23) ?"
    choices:
      - {text: "Une vue à plusieurs dimensions sur des données contiguës, qu'elle ne possède pas", correct: true}
      - {text: "Un conteneur qui alloue une matrice sur le tas, et la libère", correct: false}
      - {text: "Un vecteur de vecteurs dont les lignes ont toutes la même taille", correct: false}
      - {text: "Un tableau de taille fixe, à deux dimensions seulement", correct: false}
    answer: "Comme `std::span`, il désigne des données qui vivent ailleurs. Il ajoute le calcul d'indice : `vue[ligne, colonne]`."
  - key: vf-virgule
    format: true-false
    question: "Sur un tableau de tableaux, `grille[1, 2]` désigne le même élément que `grille[1][2]`."
    truth: false
    answer: "Il faut deux paires de crochets. La forme `[1, 2]` est réservée, en C++23, aux types qui définissent un `operator[]` à plusieurs arguments, comme `std::mdspan`."
  - key: vf-ordre-parcours
    format: true-false
    question: "Parcourir une grande matrice ligne par ligne est en général plus rapide que colonne par colonne."
    truth: true
    answer: "Les données sont rangées ligne par ligne : ce parcours lit la mémoire dans l'ordre."
  - key: vf-lignes-egales
    format: true-false
    question: "Dans un `std::vector<std::vector<int>>`, toutes les lignes ont forcément la même longueur."
    truth: false
    answer: "Chaque ligne est un vecteur indépendant, qui grandit ou rétrécit seul."
  - key: vf-mdspan-possede
    format: true-false
    question: "Un `std::mdspan` libère les données qu'il désigne quand il est détruit."
    truth: false
    answer: "C'est une vue : elle ne possède rien. Les données doivent vivre plus longtemps qu'elle."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration crée une grille de 2 lignes et 3 colonnes d'entiers, de taille fixe ?"
    choices:
      - {text: "`std::array<std::array<int, 3>, 2> grille{};`", correct: true}
      - {text: "`std::array<std::array<int, 2>, 3> grille{};`", correct: false}
      - {text: "`std::array<int, 2, 3> grille{};`", correct: false}
      - {text: "`std::array<int[2][3]> grille{};`", correct: false}
    answer: "Le tableau extérieur a deux éléments, qui sont chacun un tableau de trois entiers."
  - key: qcm-vector
    format: multiple-choice
    question: "Quelle ligne crée un vecteur de 2 lignes, chacune de 3 zéros ?"
    choices:
      - {text: "`std::vector<std::vector<int>> g(2, std::vector<int>(3));`", correct: true}
      - {text: "`std::vector<std::vector<int>> g(2, 3);`", correct: false}
      - {text: "`std::vector<std::vector<int>> g[2][3];`", correct: false}
      - {text: "`std::vector<int, int> g(2, 3);`", correct: false}
    answer: "Le second argument est le modèle de ligne, recopié deux fois."
  - key: qcm-extent
    format: multiple-choice
    question: "`vue` est un `std::mdspan` de 2 lignes et 3 colonnes. Que vaut `vue.extent(1)` ?"
    choices:
      - {text: "3 : la taille de la dimension d'indice 1", correct: true}
      - {text: "2 : la taille de la première dimension", correct: false}
      - {text: "6 : le nombre total d'éléments", correct: false}
      - {text: "1 : l'indice passé en argument", correct: false}
    answer: "`extent(0)` est le nombre de lignes, `extent(1)` le nombre de colonnes. `size()` donne le total."
  - key: qcm-total
    format: multiple-choice
    question: "Combien d'éléments contient `int grille[4][5];` ?"
    choices:
      - {text: "20", correct: true}
      - {text: "9", correct: false}
      - {text: "4", correct: false}
      - {text: "5", correct: false}
    answer: "Quatre lignes de cinq éléments."
  - key: trous-indice
    format: fill-in
    question: |-
      Complète le calcul de l'indice dans une matrice rangée à plat :
      ```cpp
      int& element = donnees[ligne * ___ + colonne];
      ```
    blanks:
      - [colonnes]
    answer: "Chaque ligne passée compte `colonnes` éléments."
  - key: trous-acces
    format: fill-in
    question: |-
      Complète pour lire l'élément de la ligne 1 et de la colonne 2 :
      ```cpp
      std::array<std::array<int, 3>, 2> grille{};
      int x = grille[1]___;
      ```
    blanks:
      - ["[2]"]
    answer: "Deux paires de crochets : `grille[1][2]`."
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour allouer la matrice entière en un seul bloc :
      ```cpp
      std::vector<int> donnees(lignes ___ colonnes);
      ```
    blanks:
      - ["*"]
    answer: "Il faut `lignes * colonnes` éléments."
  - key: trous-mdspan
    format: fill-in
    question: |-
      Complète le type de la vue à plusieurs dimensions (C++23) :
      ```cpp
      std::vector<int> donnees(6);
      std::___ vue{donnees.data(), 2, 3};
      ```
    blanks:
      - [mdspan]
    answer: "`std::mdspan` voit les six éléments comme 2 lignes de 3."
  - key: code-array
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<std::array<int, 3>, 2> grille{{{1, 2, 3}, {4, 5, 6}}};
          std::println("{} {} {}", grille[1][0], grille.size(), grille[0].size());
      }
      ```
    choices:
      - {text: "`4 2 3`", correct: true}
      - {text: "`2 2 3`", correct: false}
      - {text: "`4 3 2`", correct: false}
      - {text: "`4 6 3`", correct: false}
    answer: "`4 2 3` : la ligne 1 commence par 4. Le tableau extérieur a 2 lignes, chacune de 3 éléments."
    check:
      output: "4 2 3"
  - key: code-a-plat
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const int colonnes = 4;
          std::vector<int> donnees(3 * colonnes);
          for (std::size_t i = 0; i < donnees.size(); ++i) {
              donnees[i] = static_cast<int>(i);
          }
          std::println("{} {}", donnees[1 * colonnes + 2], donnees[2 * colonnes + 0]);
      }
      ```
    choices:
      - {text: "`6 8`", correct: true}
      - {text: "`3 2`", correct: false}
      - {text: "`6 2`", correct: false}
      - {text: "`9 8`", correct: false}
    answer: "`6 8` : l'élément (1, 2) est à l'indice 1 × 4 + 2 = 6, l'élément (2, 0) à l'indice 8."
    check:
      output: "6 8"
  - key: code-lignes-inegales
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<std::vector<int>> grille(2, std::vector<int>(3));
          grille[0].push_back(7);
          std::println("{} {} {}", grille.size(), grille[0].size(), grille[1].size());
      }
      ```
    choices:
      - {text: "`2 4 3`", correct: true}
      - {text: "`2 4 4`", correct: false}
      - {text: "`2 3 3`", correct: false}
      - {text: "`3 4 3`", correct: false}
    answer: "`2 4 3` : chaque ligne est un vecteur indépendant. Ajouter un élément à la première ne touche pas la seconde."
    check:
      output: "2 4 3"
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int grille[2][3] = {{1, 2, 3}, {4, 5, 6}};
          int somme = 0;
          for (const auto& ligne : grille) {
              somme += ligne[2];
          }
          std::println("{} {}", sizeof(grille) / sizeof(int), somme);
      }
      ```
    choices:
      - {text: "`6 9`", correct: true}
      - {text: "`6 21`", correct: false}
      - {text: "`2 9`", correct: false}
      - {text: "`3 9`", correct: false}
    answer: "`6 9` : le tableau occupe six entiers d'un seul tenant. La boucle parcourt les deux lignes, et additionne leur dernier élément : 3 + 6."
    check:
      output: "6 9"
  - key: bug-virgule
    format: bug-fix
    question: |-
      Ce programme ne compile pas : `grille[1, 2]` ne donne pas un entier, mais une ligne entière, que `std::println`
      ne sait pas afficher. Il devrait afficher `6`. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<std::array<int, 3>, 2> grille{{{1, 2, 3}, {4, 5, 6}}};
          std::println("{}", grille[1, 2]);
      }
      ```
    choices:
      - {text: "Écrire `grille[1][2]`", correct: true}
      - {text: "Écrire `grille(1, 2)`", correct: false}
      - {text: "Écrire `grille[1 * 2]`", correct: false}
      - {text: "Écrire `grille[2][1]`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", grille[1][2]);
      ```
      Un tableau de tableaux s'indexe avec une paire de crochets par dimension. Ici, la virgule est l'opérateur
      virgule : GCC lit `grille[2]`. La forme `[1, 2]` n'a de sens que pour les types qui la définissent, comme
      `std::mdspan`.
  - key: bug-dimensions-inversees
    format: bug-fix
    question: |-
      Le compilateur refuse l'initialisation : il y a trop de valeurs pour ce tableau. La grille devrait avoir 2
      lignes de 3 colonnes. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<std::array<int, 2>, 3> grille{{{1, 2, 3}, {4, 5, 6}}};
          std::println("{}", grille[1][2]);
      }
      ```
    choices:
      - {text: "Déclarer `std::array<std::array<int, 3>, 2>`", correct: true}
      - {text: "Déclarer `std::array<std::array<int, 3>, 3>`", correct: false}
      - {text: "Déclarer `std::array<int, 6>`, sans changer l'accès", correct: false}
      - {text: "Déclarer `std::array<std::array<int, 2>, 2>`", correct: false}
    answer: |-
      ```cpp
      std::array<std::array<int, 3>, 2> grille{{{1, 2, 3}, {4, 5, 6}}};
      ```
      Le type intérieur est la ligne : 3 éléments. Le nombre extérieur est le nombre de lignes : 2. On lit de
      l'intérieur vers l'extérieur.
  - key: bug-indice-a-plat
    format: bug-fix
    question: |-
      Cette matrice de 2 lignes et 3 colonnes est rangée à plat. Le programme devrait afficher `6`, l'élément de la
      ligne 1 et de la colonne 2. Il affiche `5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          const int lignes = 2;
          const int colonnes = 3;
          const std::vector<int> donnees{1, 2, 3, 4, 5, 6};
          const int ligne = 1;
          const int colonne = 2;
          std::println("{}", donnees[ligne * lignes + colonne]);
      }
      ```
    choices:
      - {text: "Écrire `ligne * colonnes + colonne`", correct: true}
      - {text: "Écrire `colonne * lignes + ligne`", correct: false}
      - {text: "Écrire `ligne + colonne * colonnes`", correct: false}
      - {text: "Écrire `ligne * colonne + colonnes`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", donnees[ligne * colonnes + colonne]);
      ```
      Une ligne compte `colonnes` éléments : c'est par ce nombre qu'on multiplie l'indice de ligne. La faute ne se
      voit pas tant que la matrice est carrée.
  - key: bug-vector-construction
    format: bug-fix
    question: |-
      Ce programme devrait créer 2 lignes de 3 zéros et afficher `3`. Il plante : les lignes sont vides. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<std::vector<int>> grille(2);
          grille[0][2] = 9;
          std::println("{}", grille[0].size());
      }
      ```
    choices:
      - {text: "Construire avec `grille(2, std::vector<int>(3))`", correct: true}
      - {text: "Construire avec `grille(3)`", correct: false}
      - {text: "Appeler `grille.reserve(6);` après la construction", correct: false}
      - {text: "Construire avec `grille(2, {})`", correct: false}
    answer: |-
      ```cpp
      std::vector<std::vector<int>> grille(2, std::vector<int>(3));
      ```
      `grille(2)` crée deux lignes vides : `grille[0][2]` écrit hors bornes. Il faut donner le modèle de ligne.
