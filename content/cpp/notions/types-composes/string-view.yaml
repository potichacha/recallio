notion: string-view
lesson: |-
  **`std::string_view`** (C++17, dans `<string_view>`) est une **vue** sur une suite de caractères : un pointeur et
  une longueur. Elle **ne possède pas** les caractères, et ne les copie pas.

  ```cpp
  void afficher(std::string_view texte) {
      std::println("{} ({})", texte, texte.size());
  }

  afficher("bonjour");            // un littéral : aucune std::string créée
  afficher(prenom);               // une std::string : aucune copie
  afficher(prenom.substr(0, 3));  // attention : vue sur un temporaire, valable le temps de l'appel
  ```

  **Pourquoi s'en servir.** Un paramètre `const std::string&` oblige à construire une `std::string` quand on passe un
  littéral. Un `std::string_view` accepte les deux sans allocation. C'est le type des paramètres **en lecture seule**.

  - Elle est petite : on la passe **par valeur**.
  - Elle est en **lecture seule** : on ne modifie pas les caractères à travers elle.
  - `substr`, `remove_prefix` et `remove_suffix` ne copient rien : ils déplacent le début ou la fin de la vue.
  - `std::string` vers vue : conversion implicite. Vue vers `std::string` : **explicite**, `std::string(vue)`, car
    c'est une copie.

  **Le danger : la vue pendante.** Une vue ne prolonge pas la vie de ce qu'elle regarde. Si la chaîne est détruite,
  ou réallouée, la vue désigne de la mémoire morte : comportement indéfini.

  ```cpp
  std::string_view v = std::string("temporaire");   // la chaîne meurt à la fin de la ligne
  ```

  D'où trois règles :

  - en **paramètre** : oui, la chaîne de l'appelant vit pendant l'appel ;
  - en **valeur de retour** : seulement si elle désigne un texte qui survit à la fonction, jamais une variable locale ;
  - en **membre** d'une classe, ou dans un conteneur : seulement si l'on maîtrise la durée de vie du texte. Dans le
    doute, on stocke une `std::string`.

  Autre limite : une vue n'est **pas terminée par un zéro**. `vue.data()` ne se passe pas à une fonction du C qui
  attend une chaîne.

  **En entretien** : « `std::string_view` pour les paramètres en lecture seule : ni copie ni allocation. Elle ne
  possède rien, donc je ne la stocke pas au-delà de la vie de la chaîne. »
cards:
  - key: definition-vue
    format: course
    question: "Que contient un `std::string_view` ?"
    choices:
      - {text: "Un pointeur vers des caractères et une longueur, sans les posséder", correct: true}
      - {text: "Une copie des caractères, qu'il libère à sa destruction", correct: false}
      - {text: "Une référence vers une `std::string`, et rien d'autre", correct: false}
      - {text: "Les caractères eux-mêmes, dans un tableau de taille fixe", correct: false}
    answer: "Une vue : l'adresse du premier caractère et leur nombre. Elle regarde un texte qui appartient à quelqu'un d'autre : une `std::string`, un littéral, un tableau."
  - key: pourquoi-en-parametre
    format: course
    question: "Quel avantage a un paramètre `std::string_view` sur un `const std::string&` ?"
    choices:
      - {text: "Il reçoit un littéral sans construire de `std::string`", correct: true}
      - {text: "Il permet à la fonction de modifier le texte reçu", correct: false}
      - {text: "Il garde le texte en vie après la fin de l'appel", correct: false}
      - {text: "Il garantit que le texte finit par un zéro", correct: false}
    answer: "Avec `const std::string&`, passer `\"bonjour\"` construit une chaîne temporaire, donc alloue. Une vue désigne directement les caractères du littéral. Elle reste en lecture seule, et ne prolonge la vie de rien."
  - key: vue-pendante
    format: course
    question: "Qu'est-ce qu'une vue pendante ?"
    choices:
      - {text: "Une vue qui désigne des caractères déjà détruits", correct: true}
      - {text: "Une vue qui n'a pas encore reçu de valeur", correct: false}
      - {text: "Une vue qui désigne une chaîne vide", correct: false}
      - {text: "Une vue qui désigne le milieu d'une chaîne", correct: false}
    answer: "La vue ne possède pas le texte : si la chaîne meurt avant elle, elle pointe vers de la mémoire libérée. S'en servir est un comportement indéfini."
  - key: passage-par-valeur
    format: course
    question: "Comment passe-t-on un `std::string_view` à une fonction ?"
    choices:
      - {text: "Par valeur : la vue ne contient qu'un pointeur et une longueur", correct: true}
      - {text: "Par référence constante, comme une `std::string`", correct: false}
      - {text: "Par référence non constante, pour éviter la copie", correct: false}
      - {text: "Par pointeur, pour pouvoir passer `nullptr`", correct: false}
    answer: "Copier une vue copie deux mots machine, pas le texte. Une référence ajouterait une indirection sans rien économiser."
  - key: vf-copie
    format: true-false
    question: Construire un `std::string_view` à partir d'une `std::string` copie ses caractères.
    truth: false
    answer: La vue désigne les caractères de la chaîne. Rien n'est copié.
  - key: vf-lecture-seule
    format: true-false
    question: "On peut modifier un caractère à travers un `std::string_view`."
    truth: false
    answer: "Une vue est en lecture seule : `vue[0] = 'X';` ne compile pas."
  - key: vf-conversion-implicite
    format: true-false
    question: "Une `std::string` se convertit implicitement en `std::string_view`."
    truth: true
    answer: "Dans ce sens, rien n'est copié : la conversion est implicite. Dans l'autre sens, elle est explicite, car elle copie."
  - key: vf-zero-final
    format: true-false
    question: "Les caractères d'un `std::string_view` sont toujours suivis d'un zéro final."
    truth: false
    answer: "Une vue peut désigner le milieu d'une chaîne. `vue.data()` ne se passe donc pas à une fonction du C qui attend un zéro final."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Avec quelle norme `std::string_view` est-il arrivé ?"
    choices:
      - {text: "C++17", correct: true}
      - {text: "C++11", correct: false}
      - {text: "C++20", correct: false}
      - {text: "C++23", correct: false}
    answer: "C++17, dans l'en-tête `<string_view>`. `std::span`, la vue sur un tableau, a suivi en C++20."
  - key: qcm-vue-vers-string
    format: multiple-choice
    question: "Comment obtenir une `std::string` à partir d'une vue `v` ?"
    choices:
      - {text: "`std::string s{v};`", correct: true}
      - {text: "`std::string s = v;`", correct: false}
      - {text: "`std::string s = v.data;`", correct: false}
      - {text: "`std::string s = *v;`", correct: false}
    answer: "La conversion est explicite, parce qu'elle copie les caractères : `std::string s{v};` ou `std::string(v)`. `std::string s = v;` ne compile pas."
  - key: qcm-sous-vue
    format: multiple-choice
    question: "Que fait `v.substr(3)` sur un `std::string_view` ?"
    choices:
      - {text: "Il renvoie une vue sur la suite du texte, sans rien copier", correct: true}
      - {text: "Il renvoie une `std::string` qui copie la suite du texte", correct: false}
      - {text: "Il retire les trois premiers caractères du texte d'origine", correct: false}
      - {text: "Il renvoie le caractère à la position 3", correct: false}
    answer: "Une nouvelle vue, qui commence trois caractères plus loin dans le même texte. C'est une opération en temps constant ; le `substr` de `std::string`, lui, copie."
  - key: qcm-ou-stocker
    format: multiple-choice
    question: "Dans quel cas un `std::string_view` est-il sûr sans précaution ?"
    choices:
      - {text: "En paramètre d'une fonction, pour lire le texte de l'appelant", correct: true}
      - {text: "En membre d'une classe, pour garder un nom reçu au constructeur", correct: false}
      - {text: "En valeur de retour, pour renvoyer une variable locale", correct: false}
      - {text: "Dans un conteneur, pour garder des morceaux d'une chaîne temporaire", correct: false}
    answer: "Pendant un appel, la chaîne de l'appelant est vivante. Les trois autres cas gardent la vue plus longtemps que le texte ne vit peut-être : ils demandent de maîtriser sa durée de vie."
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète avec l'en-tête qui déclare `std::string_view` :
      ```cpp
      #include <___>

      void afficher(std::string_view texte);
      ```
    blanks:
      - [string_view]
    answer: "`std::string_view` est déclaré dans `<string_view>`."
  - key: trous-type-du-parametre
    format: fill-in
    question: |-
      Complète pour que la fonction lise un texte sans le copier, qu'on lui passe un littéral ou une `std::string` :
      ```cpp
      void afficher(std::___ texte) {
          std::println("{}", texte);
      }
      ```
    blanks:
      - [string_view]
    answer: "`std::string_view` accepte les deux, sans copie ni allocation."
  - key: trous-remove-prefix
    format: fill-in
    question: |-
      Complète pour que la vue commence trois caractères plus loin :
      ```cpp
      std::string_view v = "bonjour";
      v.___(3);   // v désigne "jour"
      ```
    blanks:
      - [remove_prefix]
    answer: "`remove_prefix(3)` avance le début de la vue, sans toucher au texte."
  - key: trous-copie-explicite
    format: fill-in
    question: |-
      Complète pour copier le texte de la vue dans une chaîne qui lui survivra :
      ```cpp
      std::string_view vue = "bonjour";
      std::string copie = std::___(vue);
      ```
    blanks:
      - [string]
    answer: "`std::string(vue)` : la conversion vers `std::string` est explicite, car elle copie."
  - key: code-litteral-et-string
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      void afficher(std::string_view texte) {
          std::println("{} {}", texte, texte.size());
      }

      int main() {
          std::string langage = "C++";
          afficher("bonjour");
          afficher(langage);
      }
      ```
    choices:
      - text: |-
          ```
          bonjour 7
          C++ 3
          ```
        correct: true
      - text: |-
          ```
          bonjour 8
          C++ 4
          ```
        correct: false
      - text: |-
          ```
          bonjour 7
          C++ 4
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      bonjour 7
      C++ 3
      ```
      La même fonction reçoit un littéral et une `std::string`, sans copie. La taille ne compte pas de zéro final.
    check:
      output: |-
        bonjour 7
        C++ 3
  - key: code-substr
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string_view>

      int main() {
          std::string_view v = "bonjour";
          std::string_view fin = v.substr(3);
          std::println("{} {} {}", fin, fin.size(), v.size());
      }
      ```
    choices:
      - {text: "`jour 4 7`", correct: true}
      - {text: "`jour 4 4`", correct: false}
      - {text: "`bon 3 7`", correct: false}
      - {text: "`njour 5 7`", correct: false}
    answer: "`jour 4 7` : `substr(3)` renvoie une nouvelle vue, qui commence à la position 3. La vue d'origine n'est pas modifiée."
    check:
      output: "jour 4 7"
  - key: code-remove-prefix
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string_view>

      int main() {
          std::string_view v = "bonjour";
          v.remove_prefix(3);
          v.remove_suffix(1);
          std::println("{} {}", v, v.size());
      }
      ```
    choices:
      - {text: "`jou 3`", correct: true}
      - {text: "`jour 4`", correct: false}
      - {text: "`bonjou 6`", correct: false}
      - {text: "`onjou 5`", correct: false}
    answer: "`jou 3` : `remove_prefix(3)` avance le début de trois caractères, `remove_suffix(1)` recule la fin d'un. Le texte lui-même n'a pas changé."
    check:
      output: "jou 3"
  - key: code-vue-suit-la-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      int main() {
          std::string s = "chat";
          std::string_view v = s;
          s[0] = 'r';
          std::println("{}", v);
      }
      ```
    choices:
      - {text: "`rhat`", correct: true}
      - {text: "`chat`", correct: false}
      - {text: "`r`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`rhat` : la vue ne copie rien, elle regarde les caractères de `s`. Modifier un caractère de `s` se voit à travers elle."
    check:
      output: "rhat"
  - key: bug-vue-sur-locale
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Bonjour et bienvenue, Ada`, et affiche des caractères imprévisibles. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      std::string_view saluer(std::string_view prenom) {
          std::string message = "Bonjour et bienvenue, ";
          message += prenom;
          return message;
      }

      int main() {
          std::println("{}", saluer("Ada"));
      }
      ```
    choices:
      - {text: "Renvoyer une `std::string`, qui possède son texte", correct: true}
      - {text: "Renvoyer un `const std::string_view&`", correct: false}
      - {text: "Prendre `prenom` par `const std::string&`", correct: false}
      - {text: "Déclarer `message` avec `auto`", correct: false}
    answer: |-
      ```cpp
      std::string saluer(std::string_view prenom) {
      ```
      `message` est détruite à la fin de la fonction : la vue renvoyée désigne de la mémoire libérée. Un texte créé
      dans la fonction se renvoie dans une `std::string`.
  - key: bug-vue-sur-temporaire
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada Lovelace, mathématicienne`, et affiche des caractères imprévisibles.
      Pourquoi ?
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      int main() {
          std::string prenom = "Ada";
          std::string_view complet = prenom + " Lovelace, mathématicienne";
          std::println("{}", complet);
      }
      ```
    choices:
      - {text: "La chaîne créée par `+` est détruite à la fin de la ligne : la vue pend", correct: true}
      - {text: "Une vue ne peut pas désigner plus de dix caractères", correct: false}
      - {text: "`+` modifie `prenom`, que la vue regardait déjà", correct: false}
      - {text: "`std::println` ne sait pas afficher une vue", correct: false}
    answer: |-
      ```cpp
      std::string complet = prenom + " Lovelace, mathématicienne";
      ```
      L'opérateur `+` crée une `std::string` temporaire, détruite au point-virgule. La vue lui survit, et
      désigne de la mémoire libérée. On garde le résultat dans une `std::string`.
  - key: bug-conversion-implicite
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      int main() {
          std::string_view vue = "bonjour";
          std::string copie = vue;
          std::println("{}", copie);
      }
      ```
    choices:
      - {text: "Écrire `std::string copie{vue};`", correct: true}
      - {text: "Écrire `std::string copie = &vue;`", correct: false}
      - {text: "Écrire `std::string copie = *vue;`", correct: false}
      - {text: "Écrire `std::string copie = vue.size();`", correct: false}
    answer: |-
      ```cpp
      std::string copie{vue};
      ```
      Passer d'une vue à une `std::string` copie les caractères : la norme exige que ce soit écrit explicitement.
  - key: bug-modifier-par-la-vue
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction met la première lettre en majuscule ?
      ```cpp
      #include <print>
      #include <string>
      #include <string_view>

      int main() {
          std::string mot = "ada";
          std::string_view vue = mot;
          vue[0] = 'A';
          std::println("{}", mot);
      }
      ```
    choices:
      - {text: "Modifier la chaîne : `mot[0] = 'A';`", correct: true}
      - {text: "Modifier la vue : `vue.at(0) = 'A';`", correct: false}
      - {text: "Modifier la vue : `vue.front() = 'A';`", correct: false}
      - {text: "Déclarer la vue sans `std::` devant", correct: false}
    answer: |-
      ```cpp
      mot[0] = 'A';
      ```
      Une vue est en lecture seule, quel que soit l'accès utilisé. On modifie la `std::string` qui possède les
      caractères.
  - key: situation-choisir-le-parametre
    format: scenario
    question: |-
      Tu écris `compter_mots`, qui lit un texte sans le modifier. Elle sera appelée avec des littéraux, des
      `std::string`, et des morceaux de chaînes. Quel type donnes-tu à son paramètre ?
    choices:
      - {text: "`std::string_view`, passé par valeur", correct: true}
      - {text: "`std::string`, passé par valeur", correct: false}
      - {text: "`std::string&`, une référence non constante", correct: false}
      - {text: "`char`, un caractère à la fois", correct: false}
    answer: |-
      `std::string_view` accepte les trois sans copie ni allocation, et dit que la fonction ne fait que lire. Par
      valeur, `std::string` copierait le texte à chaque appel ; une référence non constante refuserait les littéraux.
  - key: situation-membre-de-classe
    format: scenario
    question: |-
      Une classe `Utilisateur` reçoit un nom à sa construction et le garde pendant toute sa vie. Un collègue propose de
      le stocker dans un `std::string_view`, « pour éviter une copie ». Que lui réponds-tu ?
    choices:
      - {text: "De stocker une `std::string` : l'objet doit posséder son nom", correct: true}
      - {text: "Qu'il a raison : une vue garde le texte en vie tant qu'elle existe", correct: false}
      - {text: "De stocker un `const std::string_view&`, plus sûr qu'une vue", correct: false}
      - {text: "Qu'il a raison, à condition de déclarer la vue `const`", correct: false}
    answer: |-
      La vue ne prolonge la vie de rien : si la chaîne passée au constructeur est détruite, l'objet garde une vue
      pendante. Un objet qui doit garder un texte le copie dans une `std::string`. Prendre le paramètre en
      `std::string_view`, lui, reste une bonne idée.
  - key: situation-api-c
    format: scenario
    question: |-
      Tu dois ouvrir un fichier avec `std::fopen`, qui attend une chaîne du C, terminée par un zéro. Tu as le chemin
      dans un `std::string_view`. Que fais-tu ?
    choices:
      - {text: "Tu en fais une `std::string`, et tu passes son `c_str()`", correct: true}
      - {text: "Tu passes `chemin.data()` : c'est le même pointeur", correct: false}
      - {text: "Tu passes `chemin` : la conversion est implicite", correct: false}
      - {text: "Tu passes `&chemin`, l'adresse de la vue", correct: false}
    answer: |-
      Une vue n'est pas forcément suivie d'un zéro : elle peut désigner le milieu d'un texte. `data()` donnerait un
      pointeur que `fopen` lirait trop loin. `std::string(chemin).c_str()` garantit le zéro final.
  - key: situation-analyseur
    format: scenario
    question: |-
      Un analyseur découpe une ligne lue dans un fichier et range ses mots, en `std::string_view`, dans un vecteur.
      À la ligne suivante, la chaîne qui contenait la ligne est réutilisée, et les mots rangés deviennent illisibles.
      Que proposes-tu ?
    choices:
      - {text: "Ranger des `std::string`, ou garder en vie chaque ligne tant que ses mots servent", correct: true}
      - {text: "Ranger des `const std::string_view`, qui ne changent plus", correct: false}
      - {text: "Lire le fichier plus lentement, une ligne à la fois", correct: false}
      - {text: "Ranger les vues dans un `std::array` plutôt que dans un vecteur", correct: false}
    answer: |-
      Les vues désignent le tampon de la ligne : quand il est écrasé ou réalloué, elles désignent autre chose. Soit on
      copie les mots dans des `std::string`, soit on garantit que le texte vit aussi longtemps que ses vues, par
      exemple en gardant tout le fichier en mémoire.
