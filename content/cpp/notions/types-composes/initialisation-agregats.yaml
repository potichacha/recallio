notion: initialisation-agregats
lesson: |-
  Un **agrégat** est un type simple, qu'on initialise en donnant ses membres **entre accolades**, sans écrire de
  constructeur : un tableau, ou une `struct` qui n'a ni constructeur déclaré, ni membre privé, ni fonction
  virtuelle.

  ```cpp
  struct Point {
      int x;
      int y;
  };

  Point p{3, 4};      // x = 3, y = 4 : dans l'ordre de déclaration
  ```

  **Les membres omis** reçoivent leur **valeur par défaut** (celle écrite dans la `struct`), ou sinon **zéro**.

  ```cpp
  struct Fenetre {
      int largeur = 800;
      int hauteur = 600;
      bool plein_ecran;
  };

  Fenetre f{1024};    // largeur = 1024, hauteur = 600, plein_ecran = false
  Fenetre g{};        // 800, 600, false
  ```

  En revanche, **sans accolades du tout**, `Fenetre h;` laisse `plein_ecran` **non initialisé** : sa valeur est
  quelconque. On écrit toujours les accolades.

  **Les initialiseurs désignés (C++20)** nomment les membres. Le code se lit sans connaître l'ordre de la `struct`,
  et l'on peut sauter des membres.

  ```cpp
  Fenetre f{.largeur = 1024, .plein_ecran = true};    // hauteur = 600
  ```

  Leurs règles :

  - les membres sont nommés **dans l'ordre de leur déclaration** ; on peut en **sauter**, pas les permuter ;
  - on ne mélange pas initialiseurs désignés et valeurs sans nom ;
  - ils ne servent qu'aux agrégats.

  **Les agrégats s'emboîtent.**

  ```cpp
  struct Segment {
      Point debut;
      Point fin;
  };

  Segment s{{0, 0}, {3, 4}};
  Segment t{.debut = {0, 0}, .fin = {.x = 3, .y = 4}};
  ```

  **Trop de valeurs** est une erreur de compilation. Les accolades refusent aussi les **conversions avec perte**
  (`Point p{3.7, 4};`).

  **Quand la `struct` cesse d'être un agrégat.** Dès qu'on lui déclare un constructeur, ou un membre privé,
  l'initialisation membre par membre n'existe plus : les accolades appellent alors un constructeur.

  **En entretien** : « Un agrégat s'initialise entre accolades, membre par membre, dans l'ordre de déclaration ;
  les membres omis prennent leur valeur par défaut, ou zéro. Les initialiseurs désignés de C++20 nomment les
  membres, toujours dans l'ordre. »
tour:
  - title: Initialiser une struct
    text: |-
      Une `struct` sans constructeur s'initialise entre accolades : les valeurs vont aux membres, dans l'ordre de
      leur déclaration.

      Depuis C++20, on peut **nommer** les membres : `.largeur = 1024`. C'est plus lisible, et l'on peut en sauter.
      Un membre sauté prend sa valeur par défaut, ou zéro.

      Essaie : ajoute `.hauteur = 768` entre les deux initialiseurs de `grande`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          struct Fenetre {
              int largeur = 800;
              int hauteur = 600;
              bool plein_ecran;
          };

          int main() {
              const Fenetre defaut{};
              const Fenetre grande{.largeur = 1024, .plein_ecran = true};
              std::println("{} x {}, plein écran : {}", defaut.largeur, defaut.hauteur, defaut.plein_ecran);
              std::println("{} x {}, plein écran : {}", grande.largeur, grande.hauteur, grande.plein_ecran);
          }
      output: |-
        800 x 600, plein écran : false
        1024 x 600, plein écran : true
cards:
  - key: agregat
    format: course
    question: "Qu'est-ce qu'un agrégat ?"
    choices:
      - {text: "Un tableau, ou une struct sans constructeur ni membre privé, initialisable membre par membre", correct: true}
      - {text: "Une classe dont tous les membres sont privés, initialisée par son constructeur", correct: false}
      - {text: "Un conteneur de la bibliothèque standard, qui regroupe des éléments de même type", correct: false}
      - {text: "Une struct dont tous les membres ont le même type, comme un tableau", correct: false}
    answer: "Un agrégat n'a pas besoin de constructeur : on donne ses membres entre accolades, dans l'ordre de leur déclaration."
  - key: membres-omis
    format: course
    question: "Que valent les membres qu'une initialisation entre accolades ne mentionne pas ?"
    choices:
      - {text: "Leur valeur par défaut écrite dans la struct, ou sinon zéro", correct: true}
      - {text: "Une valeur quelconque : ils ne sont pas initialisés", correct: false}
      - {text: "La valeur du dernier membre mentionné", correct: false}
      - {text: "Rien : le compilateur refuse une liste incomplète", correct: false}
    answer: "`Point p{3};` met `y` à zéro. C'est l'absence totale d'accolades, `Point p;`, qui laisse les membres sans valeur."
  - key: designes
    format: course
    question: "Quelle règle suivent les initialiseurs désignés, comme `{.x = 1, .y = 2}` ?"
    choices:
      - {text: "Les membres sont nommés dans l'ordre de leur déclaration ; on peut en sauter", correct: true}
      - {text: "Les membres sont nommés dans n'importe quel ordre, mais tous doivent y figurer", correct: false}
      - {text: "Les membres sont nommés dans l'ordre alphabétique de leur nom", correct: false}
      - {text: "Les membres sont nommés dans l'ordre inverse de leur déclaration", correct: false}
    answer: "C++ est plus strict que C sur ce point : permuter deux membres ne compile pas. En sauter est permis."
  - key: plus-agregat
    format: course
    question: "Qu'est-ce qui fait perdre à une struct sa qualité d'agrégat ?"
    choices:
      - {text: "Lui déclarer un constructeur, ou un membre privé", correct: true}
      - {text: "Lui donner plus de trois membres", correct: false}
      - {text: "Lui donner une valeur par défaut pour un membre", correct: false}
      - {text: "Lui donner un membre de type `std::string`", correct: false}
    answer: "Avec un constructeur déclaré, les accolades appellent ce constructeur. Les valeurs par défaut des membres, elles, sont permises depuis C++14."
  - key: vf-sans-accolades
    format: true-false
    question: "`Point p;`, sans accolades, met à zéro les membres `int` de la struct `Point`."
    truth: false
    answer: "Pour une variable locale, les membres sans valeur par défaut restent non initialisés. `Point p{};` les met à zéro."
  - key: vf-ordre
    format: true-false
    question: "`Point p{.y = 2, .x = 1};` compile, si `x` est déclaré avant `y`."
    truth: false
    answer: "Les initialiseurs désignés suivent l'ordre de déclaration. GCC répond que l'ordre des désignateurs ne correspond pas."
  - key: vf-sauter
    format: true-false
    question: "Avec des initialiseurs désignés, on peut ne nommer qu'une partie des membres."
    truth: true
    answer: "Les membres sautés prennent leur valeur par défaut, ou zéro."
  - key: vf-tableau
    format: true-false
    question: "Un tableau est un agrégat."
    truth: true
    answer: "`int t[3] = {1, 2};` suit les mêmes règles : les éléments omis valent zéro."
  - key: qcm-valeur
    format: multiple-choice
    question: "`struct Point { int x; int y; };` Que vaut `p.y` après `Point p{5};` ?"
    choices:
      - {text: "`0`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "Une valeur quelconque", correct: false}
      - {text: "Rien : la ligne ne compile pas", correct: false}
    answer: "Le membre omis est mis à zéro. `x` vaut 5."
  - key: qcm-designe
    format: multiple-choice
    question: "`struct Point { int x; int y; };` Quelle ligne met `y` à 4 et laisse `x` à zéro ?"
    choices:
      - {text: "`Point p{.y = 4};`", correct: true}
      - {text: "`Point p{y: 4};`", correct: false}
      - {text: "`Point p{y = 4};`", correct: false}
      - {text: "`Point p{, 4};`", correct: false}
    answer: "Un initialiseur désigné s'écrit avec un point devant le nom du membre, puis `=` ou des accolades."
  - key: qcm-imbrique
    format: multiple-choice
    question: "`struct Segment { Point debut; Point fin; };` Quelle ligne initialise correctement un segment ?"
    choices:
      - {text: "`Segment s{{0, 0}, {3, 4}};`", correct: true}
      - {text: "`Segment s{(0, 0), (3, 4)};`", correct: false}
      - {text: "`Segment s{[0, 0], [3, 4]};`", correct: false}
      - {text: "`Segment s{0, 0; 3, 4};`", correct: false}
    answer: "Chaque membre agrégat reçoit ses propres accolades."
  - key: qcm-melange
    format: multiple-choice
    question: "`struct Point { int x; int y; };` Laquelle de ces initialisations ne compile pas ?"
    choices:
      - {text: "`Point p{.x = 1, 2};`", correct: true}
      - {text: "`Point p{1, 2};`", correct: false}
      - {text: "`Point p{.x = 1, .y = 2};`", correct: false}
      - {text: "`Point p{.x = 1};`", correct: false}
    answer: "On ne mélange pas initialiseurs désignés et valeurs sans nom dans une même liste."
  - key: trous-point
    format: fill-in
    question: |-
      Complète l'initialiseur désigné :
      ```cpp
      Point p{___x = 3, .y = 4};
      ```
    blanks:
      - ["."]
    answer: "Le nom du membre est précédé d'un point : `.x = 3`."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour que tous les membres prennent leur valeur par défaut, ou zéro :
      ```cpp
      Fenetre f___;
      ```
    blanks:
      - ["{}"]
    answer: "Des accolades vides initialisent chaque membre. Sans elles, les membres sans valeur par défaut restent quelconques."
  - key: trous-membre
    format: fill-in
    question: |-
      Complète pour initialiser le second membre de `struct Point { int x; int y; };` :
      ```cpp
      Point p{.x = 3, .___ = 4};
      ```
    blanks:
      - [y]
    answer: "Les membres sont nommés dans l'ordre de leur déclaration : `x`, puis `y`."
  - key: trous-defaut
    format: fill-in
    question: |-
      Complète pour que `hauteur` vaille 600 quand on ne la mentionne pas :
      ```cpp
      struct Fenetre {
          int largeur = 800;
          int hauteur ___ 600;
      };
      ```
    blanks:
      - ["="]
    answer: "Une valeur par défaut s'écrit dans la struct, après `=` ou entre accolades."
  - key: code-omis
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
          int z;
      };

      int main() {
          const Point p{1, 2};
          std::println("{} {} {}", p.x, p.y, p.z);
      }
      ```
    choices:
      - {text: "`1 2 0`", correct: true}
      - {text: "`1 2 2`", correct: false}
      - {text: "`0 1 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 2 0` : les valeurs vont aux membres dans l'ordre. Le membre `z`, omis, est mis à zéro."
    check:
      output: "1 2 0"
  - key: code-designes
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Fenetre {
          int largeur = 800;
          int hauteur = 600;
          bool plein_ecran;
      };

      int main() {
          const Fenetre f{.hauteur = 480};
          std::println("{} {} {}", f.largeur, f.hauteur, f.plein_ecran);
      }
      ```
    choices:
      - {text: "`800 480 false`", correct: true}
      - {text: "`480 600 false`", correct: false}
      - {text: "`0 480 false`", correct: false}
      - {text: "`800 480 true`", correct: false}
    answer: "`800 480 false` : seul `hauteur` est nommé. `largeur` garde sa valeur par défaut ; `plein_ecran`, qui n'en a pas, vaut `false`."
    check:
      output: "800 480 false"
  - key: code-imbrique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      struct Segment {
          Point debut;
          Point fin;
      };

      int main() {
          const Segment s{{1, 2}, {.y = 7}};
          std::println("{} {} {}", s.debut.y, s.fin.x, s.fin.y);
      }
      ```
    choices:
      - {text: "`2 0 7`", correct: true}
      - {text: "`2 7 0`", correct: false}
      - {text: "`1 0 7`", correct: false}
      - {text: "`2 7 7`", correct: false}
    answer: "`2 0 7` : `debut` reçoit 1 et 2. Pour `fin`, seul `y` est nommé : `x` est mis à zéro."
    check:
      output: "2 0 7"
  - key: code-tableau
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          const Point points[3] = {{1, 2}, {3}};
          std::println("{} {} {}", points[1].x, points[1].y, points[2].x);
      }
      ```
    choices:
      - {text: "`3 0 0`", correct: true}
      - {text: "`3 2 1`", correct: false}
      - {text: "`3 3 3`", correct: false}
      - {text: "`2 3 0`", correct: false}
    answer: "`3 0 0` : le deuxième point reçoit seulement `x` ; son `y` vaut zéro. Le troisième, absent de la liste, est entièrement à zéro."
    check:
      output: "3 0 0"
  - key: bug-ordre
    format: bug-fix
    question: |-
      Le compilateur répond « designator order for field 'Point::x' does not match declaration order in 'const Point' ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          const Point p{.y = 2, .x = 1};
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "Écrire `Point p{.x = 1, .y = 2};`", correct: true}
      - {text: "Écrire `Point p{.y = 2, x = 1};`", correct: false}
      - {text: "Écrire `Point p{y: 2, x: 1};`", correct: false}
      - {text: "Écrire `Point p(.y = 2, .x = 1);`", correct: false}
    answer: |-
      ```cpp
      const Point p{.x = 1, .y = 2};
      ```
      Les initialiseurs désignés suivent l'ordre de déclaration des membres : `x`, puis `y`.
  - key: bug-trop-de-valeurs
    format: bug-fix
    question: |-
      Le compilateur répond « too many initializers for 'const Point' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          const Point p{1, 2, 3};
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "Donner deux valeurs : `Point p{1, 2};`", correct: true}
      - {text: "Donner trois valeurs entre parenthèses : `Point p(1, 2, 3);`", correct: false}
      - {text: "Donner les valeurs à la suite : `Point p = 1, 2, 3;`", correct: false}
      - {text: "Donner une liste imbriquée : `Point p{{1, 2, 3}};`", correct: false}
    answer: |-
      ```cpp
      const Point p{1, 2};
      ```
      `Point` a deux membres : la liste ne peut pas contenir trois valeurs. Trop peu de valeurs est permis, trop ne
      l'est pas.
  - key: bug-non-initialise
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0 0`. Il lit des membres jamais initialisés : son comportement est indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p;
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "Écrire `Point p{};`", correct: true}
      - {text: "Écrire `Point p();`", correct: false}
      - {text: "Écrire `static Point p[];`", correct: false}
      - {text: "Écrire `const Point p;`", correct: false}
    answer: |-
      ```cpp
      Point p{};
      ```
      Sans accolades, les membres d'une variable locale ne reçoivent aucune valeur. `Point p();` déclare une
      fonction, et `const Point p;` ne compile pas, faute d'initialisation.
  - key: bug-constructeur
    format: bug-fix
    question: |-
      Le compilateur refuse `Compte c{100};` : il ne trouve pas de constructeur qui prenne un entier. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      struct Compte {
          Compte() {}
          int solde;
      };

      int main() {
          const Compte c{100};
          std::println("{}", c.solde);
      }
      ```
    choices:
      - {text: "Retirer le constructeur `Compte() {}` de la struct", correct: true}
      - {text: "Écrire `Compte c{.solde = 100};` dans `main`", correct: false}
      - {text: "Déclarer le membre `solde` avec le mot-clé `private`", correct: false}
      - {text: "Écrire `Compte c = {100};` dans `main`", correct: false}
    answer: |-
      ```cpp
      struct Compte {
          int solde;
      };
      ```
      Un constructeur déclaré fait perdre à la struct sa qualité d'agrégat : les accolades cherchent alors un
      constructeur à un argument. Sans lui, `Compte c{100};` initialise le membre.
