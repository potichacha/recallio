notion: any
lesson: |-
  `std::any` (C++17, en-tête `<any>`) peut contenir une valeur de **n'importe quel type** copiable. Le type est
  oublié à la compilation, mais **vérifié à l'exécution** quand on veut relire la valeur.

  ```cpp
  std::any valeur = 42;
  valeur = std::string{"bonjour"};      // change de type sans difficulté
  ```

  **Relire : `std::any_cast`.** Il faut donner le type **exact** de ce qui est rangé.

  ```cpp
  std::any valeur = 42;
  int n = std::any_cast<int>(valeur);             // 42
  double d = std::any_cast<double>(valeur);       // lance std::bad_any_cast
  ```

  Aucune conversion n'est tentée : un `int` ne se relit pas comme un `long`, ni un `const char*` comme une
  `std::string`.

  **La forme qui ne lance pas.** Avec un **pointeur** vers l'`any`, `std::any_cast` renvoie un pointeur, nul si le
  type ne correspond pas :

  ```cpp
  if (const int* p = std::any_cast<int>(&valeur)) {
      std::println("{}", *p);
  }
  ```

  **Les autres fonctions.**

  | Fonction | Rôle |
  |---|---|
  | `has_value()` | dit s'il contient quelque chose |
  | `reset()` | le vide |
  | `type()` | renvoie le `std::type_info` du contenu (`typeid(void)` s'il est vide) |
  | `emplace<T>(args...)` | construit un `T` sur place |

  **`std::any` ou `std::variant` ?**

  | | `std::variant<A, B>` | `std::any` |
  |---|---|---|
  | Types possibles | une liste **fermée**, connue à la compilation | **n'importe lequel** |
  | Vérification | à la compilation (`std::visit` oblige à traiter tous les cas) | à l'exécution |
  | Allocation | jamais | sur le tas pour les gros objets |

  Quand on connaît les types possibles, `std::variant` est toujours préférable : le compilateur vérifie qu'aucun
  cas n'est oublié. `std::any` ne sert que lorsque la liste des types est **vraiment ouverte**.

  **Les pièges.**

  - `std::any a = "texte";` range un **`const char*`**, pas une `std::string`.
  - `std::any_cast<T>(a)` renvoie une **copie**. Pour modifier le contenu : `std::any_cast<T&>(a)`.
  - Un `std::any` remplace mal un bon typage : si chaque usage commence par deviner le type, il fallait un
    `std::variant`, ou une classe de base.

  **Où on le trouve.** Des données attachées par l'utilisateur d'une bibliothèque (un « contexte » opaque), des
  dictionnaires de propriétés hétérogènes, des systèmes de greffons. C'est le remplaçant typé du `void*`.

  **En entretien** : « `std::any` range une valeur de n'importe quel type, et `std::any_cast` vérifie le type exact
  à l'exécution, en lançant `std::bad_any_cast`. C'est un `void*` sûr. Si je connais la liste des types, je prends
  `std::variant`, vérifié à la compilation. »
cards:
  - key: definition
    format: course
    question: "Que peut contenir un `std::any` ?"
    choices:
      - {text: "Une valeur de n'importe quel type copiable, dont le type est vérifié à la relecture", correct: true}
      - {text: "Une valeur parmi une liste de types fixée à la compilation", correct: false}
      - {text: "Plusieurs valeurs de types différents à la fois", correct: false}
      - {text: "Un pointeur brut, sans aucune information de type", correct: false}
    answer: "Il garde, avec la valeur, de quoi reconnaître son type. La liste fermée, c'est `std::variant` ; le pointeur sans type, c'est `void*`."
  - key: any-cast
    format: course
    question: "Que fait `std::any_cast<double>(a)` quand `a` contient un `int` ?"
    choices:
      - {text: "Il lance `std::bad_any_cast` : le type demandé doit être exactement celui qui est rangé", correct: true}
      - {text: "Il convertit l'entier en `double`, comme le ferait un `static_cast`", correct: false}
      - {text: "Il renvoie zéro, sans signaler d'erreur", correct: false}
      - {text: "Il ne compile pas : le compilateur connaît le type rangé", correct: false}
    answer: "Aucune conversion n'est tentée. Le compilateur, lui, ne sait pas ce que contient l'`any` : l'erreur n'apparaît qu'à l'exécution."
  - key: variant-ou-any
    format: course
    question: "Quand préfère-t-on `std::variant` à `std::any` ?"
    choices:
      - {text: "Dès que la liste des types possibles est connue à la compilation", correct: true}
      - {text: "Dès que la valeur doit changer de type pendant l'exécution", correct: false}
      - {text: "Dès que la valeur est un type fondamental comme `int`", correct: false}
      - {text: "Dès que la valeur doit être copiée", correct: false}
    answer: "Avec `std::variant`, le compilateur vérifie que chaque cas est traité, et rien n'est alloué. `std::any` ne se justifie que pour une liste ouverte."
  - key: pointeur
    format: course
    question: "Comment relit-on un `std::any` sans risquer d'exception ?"
    choices:
      - {text: "Avec `std::any_cast<T>(&a)`, qui renvoie un pointeur, nul si le type diffère", correct: true}
      - {text: "Avec `std::any_cast<T>(a)`, qui renvoie zéro si le type diffère", correct: false}
      - {text: "Avec `a.get<T>()`, qui renvoie un `std::optional`", correct: false}
      - {text: "Avec `static_cast<T>(a)`, qui ne lance jamais", correct: false}
    answer: "La version qui reçoit l'adresse de l'`any` ne lance pas : on teste le pointeur renvoyé."
  - key: vf-conversion
    format: true-false
    question: "Un `std::any` qui contient un `int` peut être relu avec `std::any_cast<long>`."
    truth: false
    answer: "Le type doit être exact. `std::bad_any_cast` est lancée."
  - key: vf-litteral
    format: true-false
    question: "`std::any a = \"texte\";` range une `std::string`."
    truth: false
    answer: "Il range un `const char*`. `std::any_cast<std::string>` échouerait."
  - key: vf-vide
    format: true-false
    question: "Un `std::any` construit sans valeur ne contient rien."
    truth: true
    answer: "`has_value()` vaut `false`, et `type()` renvoie `typeid(void)`."
  - key: vf-copie
    format: true-false
    question: "`std::any_cast<int>(a)` renvoie une référence vers la valeur rangée."
    truth: false
    answer: "Il renvoie une copie. Pour une référence : `std::any_cast<int&>(a)`."
  - key: qcm-exception
    format: multiple-choice
    question: "Quelle exception lance `std::any_cast` quand le type ne correspond pas ?"
    choices:
      - {text: "`std::bad_any_cast`", correct: true}
      - {text: "`std::bad_cast_any`", correct: false}
      - {text: "`std::bad_variant_access`", correct: false}
      - {text: "`std::invalid_argument`", correct: false}
    answer: "`std::bad_any_cast`, qui dérive de `std::bad_cast`."
  - key: qcm-vider
    format: multiple-choice
    question: "Quelle fonction vide un `std::any` ?"
    choices:
      - {text: "`reset()`", correct: true}
      - {text: "`clear()`", correct: false}
      - {text: "`erase()`", correct: false}
      - {text: "`release()`", correct: false}
    answer: "`reset()` détruit la valeur contenue. `has_value()` vaut ensuite `false`."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::any` ?"
    choices:
      - {text: "`<any>`", correct: true}
      - {text: "`<variant>`", correct: false}
      - {text: "`<utility>`", correct: false}
      - {text: "`<typeinfo>`", correct: false}
    answer: "`<any>`, depuis C++17."
  - key: qcm-remplace
    format: multiple-choice
    question: "De quelle construction héritée du C `std::any` est-il le remplaçant sûr ?"
    choices:
      - {text: "`void*`", correct: true}
      - {text: "`union`", correct: false}
      - {text: "`enum`", correct: false}
      - {text: "`typedef`", correct: false}
    answer: "Comme `void*`, il transporte une donnée de type quelconque ; mais il possède la valeur, et vérifie le type à la relecture."
  - key: trous-any-cast
    format: fill-in
    question: |-
      Complète pour relire l'entier rangé :
      ```cpp
      std::any valeur = 42;
      int n = std::___<int>(valeur);
      ```
    blanks:
      - [any_cast]
    answer: "`std::any_cast<int>` vérifie le type, et renvoie la valeur."
  - key: trous-has-value
    format: fill-in
    question: |-
      Complète pour tester que l'`any` contient quelque chose :
      ```cpp
      if (valeur.___()) {
          std::println("plein");
      }
      ```
    blanks:
      - [has_value]
    answer: "`has_value()` vaut `true` quand une valeur est rangée."
  - key: trous-exception
    format: fill-in
    question: |-
      Complète le type de l'exception attrapée :
      ```cpp
      try {
          auto texte = std::any_cast<std::string>(valeur);
      } catch (const std::___&) {
          std::println("mauvais type");
      }
      ```
    blanks:
      - [bad_any_cast]
    answer: "`std::bad_any_cast` signale un type différent de celui qui est rangé."
  - key: trous-adresse
    format: fill-in
    question: |-
      Complète pour obtenir un pointeur, nul si le type ne correspond pas :
      ```cpp
      if (const int* p = std::any_cast<int>(___valeur)) {
          std::println("{}", *p);
      }
      ```
    blanks:
      - ["&"]
    answer: "En passant l'adresse de l'`any`, `std::any_cast` renvoie un pointeur au lieu de lancer."
  - key: code-changement
    format: code-output
    question: |-
      ```cpp
      #include <any>
      #include <print>
      #include <string>

      int main() {
          std::any valeur = 42;
          const int n = std::any_cast<int>(valeur);
          valeur = std::string{"abc"};
          std::println("{} {}", n, std::any_cast<std::string>(valeur).size());
      }
      ```
    choices:
      - {text: "`42 3`", correct: true}
      - {text: "`42 42`", correct: false}
      - {text: "`3 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42 3` : un `std::any` change de type à chaque affectation. Chaque lecture demande le type qui s'y trouve à ce moment."
    check:
      output: "42 3"
  - key: code-bad-cast
    format: code-output
    question: |-
      ```cpp
      #include <any>
      #include <print>

      int main() {
          const std::any valeur = 7;
          try {
              std::println("{}", std::any_cast<double>(valeur));
          } catch (const std::bad_any_cast&) {
              std::println("mauvais type");
          }
      }
      ```
    choices:
      - {text: "`mauvais type`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`7.0`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`mauvais type` : l'`any` contient un `int`. Le relire comme `double` lance `std::bad_any_cast`, sans conversion."
    check:
      output: "mauvais type"
  - key: code-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <any>
      #include <print>
      #include <string>

      int main() {
          std::any valeur = std::string{"abc"};
          const bool entier = std::any_cast<int>(&valeur) != nullptr;
          const bool texte = std::any_cast<std::string>(&valeur) != nullptr;
          valeur.reset();
          std::println("{} {} {}", entier, texte, valeur.has_value());
      }
      ```
    choices:
      - {text: "`false true false`", correct: true}
      - {text: "`true true false`", correct: false}
      - {text: "`false true true`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`false true false` : la forme à pointeur renvoie `nullptr` pour le mauvais type, sans exception. Après `reset()`, l'`any` est vide."
    check:
      output: "false true false"
  - key: code-reference
    format: code-output
    question: |-
      ```cpp
      #include <any>
      #include <print>

      int main() {
          std::any valeur = 1;
          int copie = std::any_cast<int>(valeur);
          copie = 50;
          std::any_cast<int&>(valeur) += 10;
          std::println("{} {}", std::any_cast<int>(valeur), copie);
      }
      ```
    choices:
      - {text: "`11 50`", correct: true}
      - {text: "`60 50`", correct: false}
      - {text: "`1 50`", correct: false}
      - {text: "`50 50`", correct: false}
    answer: "`11 50` : `any_cast<int>` renvoie une copie, que l'on modifie sans toucher au contenu. `any_cast<int&>` donne une référence vers la valeur rangée."
    check:
      output: "11 50"
  - key: bug-litteral
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::bad_any_cast`. Il devrait afficher `bonjour`. Quelle
      correction est la bonne ?
      ```cpp
      #include <any>
      #include <print>
      #include <string>

      int main() {
          const std::any valeur = "bonjour";
          std::println("{}", std::any_cast<std::string>(valeur));
      }
      ```
    choices:
      - {text: "Ranger une `std::string` : `std::any valeur = std::string{\"bonjour\"};`", correct: true}
      - {text: "Relire avec `std::any_cast<char>(valeur)`", correct: false}
      - {text: "Relire avec `std::any_cast<std::string&>(valeur)`", correct: false}
      - {text: "Déclarer `valeur` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      const std::any valeur = std::string{"bonjour"};
      ```
      Un littéral de chaîne se range comme un `const char*`. Le type relu doit être exactement celui qui a été
      rangé.
  - key: bug-conversion-attendue
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::bad_any_cast`. Il devrait afficher `3`. Quelle correction est
      la bonne ?
      ```cpp
      #include <any>
      #include <print>

      int main() {
          const std::any valeur = 3;
          const long n = std::any_cast<long>(valeur);
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Relire avec `std::any_cast<int>(valeur)`", correct: true}
      - {text: "Relire avec `std::any_cast<long long>(valeur)`", correct: false}
      - {text: "Relire avec `std::any_cast<long&>(valeur)`", correct: false}
      - {text: "Relire avec `static_cast<long>(valeur)`", correct: false}
    answer: |-
      ```cpp
      const long n = std::any_cast<int>(valeur);
      ```
      `3` est un `int` : c'est ce type qu'il faut demander. La conversion vers `long` se fait ensuite, sur la valeur
      relue.
  - key: bug-copie-modifiee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `11`. Il affiche `10` : l'incrémentation n'a pas touché la valeur rangée.
      Quelle correction est la bonne ?
      ```cpp
      #include <any>
      #include <print>

      int main() {
          std::any compteur = 10;
          int valeur = std::any_cast<int>(compteur);
          ++valeur;
          std::println("{}", std::any_cast<int>(compteur));
      }
      ```
    choices:
      - {text: "Écrire `int& valeur = std::any_cast<int&>(compteur);`", correct: true}
      - {text: "Écrire `const int valeur = std::any_cast<int>(compteur);`", correct: false}
      - {text: "Écrire `int valeur = std::any_cast<long>(compteur);`", correct: false}
      - {text: "Écrire `valeur++` à la place de `++valeur`", correct: false}
    answer: |-
      ```cpp
      int& valeur = std::any_cast<int&>(compteur);
      ```
      `std::any_cast<int>` renvoie une copie. Pour modifier la valeur contenue, on demande une référence :
      `std::any_cast<int&>`.
  - key: bug-any-vide
    format: bug-fix
    question: |-
      Ce programme se termine sur une exception `std::bad_any_cast`. Il devrait afficher `vide`. Quelle correction
      est la bonne ?
      ```cpp
      #include <any>
      #include <print>

      int main() {
          const std::any valeur;
          std::println("{}", std::any_cast<int>(valeur));
      }
      ```
    choices:
      - {text: "Tester `valeur.has_value()` avant de relire", correct: true}
      - {text: "Tester `valeur != nullptr` avant de relire", correct: false}
      - {text: "Relire avec `std::any_cast<void>(valeur)`", correct: false}
      - {text: "Déclarer `valeur` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      if (valeur.has_value()) {
          std::println("{}", std::any_cast<int>(valeur));
      } else {
          std::println("vide");
      }
      ```
      Un `std::any` vide ne contient aucun type : tout `any_cast` par valeur lance. On teste `has_value()`, ou l'on
      utilise la forme à pointeur.
