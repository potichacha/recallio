notion: std-array
lesson: |-
  **`std::array`**, dans `<array>`, est un **tableau de taille fixe** : sa taille fait partie de son **type**, et doit
  être connue à la compilation.

  ```cpp
  std::array<int, 3> couleur{255, 128, 0};   // le type des éléments, puis la taille
  ```

  Il s'utilise comme un `std::vector` (`size()`, `[]`, `at()`, `front()`, `back()`, boucle sur un intervalle), mais il
  ne change jamais de taille : pas de `push_back`.

  **Face à `std::vector`.**

  | | `std::array<int, 3>` | `std::vector<int>` |
  |---|---|---|
  | Taille | fixée à la compilation | variable à l'exécution |
  | Mémoire | dans l'objet lui-même, sans allocation | allouée dynamiquement |
  | Ajouter un élément | impossible | `push_back` |

  On le choisit quand le nombre d'éléments est connu d'avance et petit : les trois composantes d'une couleur, les
  douze mois, les quatre directions.

  **Face au tableau du C** (`int t[3]`). `std::array` connaît sa taille, se **copie** avec `=`, se **compare** avec
  `==`, se passe à une fonction sans perdre sa taille, et offre `at()`. Il ne coûte rien de plus.

  **L'initialisation.**

  - `std::array<int, 4> a{1, 2};` : les éléments non cités valent **zéro**.
  - `std::array<int, 4> a{};` : tous à zéro.
  - `std::array<int, 4> a;` dans une fonction : **non initialisé**, comme une variable locale ordinaire.
  - Trop d'éléments entre accolades : erreur de compilation.
  - `std::array a{1, 2, 3};` : le type et la taille sont déduits (C++17).

  **Piège classique** : la taille doit être une **constante** de compilation. `std::array<int, n>` avec `n` lu à
  l'exécution ne compile pas : c'est un `std::vector` qu'il faut.

  **En entretien** : « `std::array` quand la taille est connue à la compilation : pas d'allocation, et tout le confort
  d'un conteneur. Sinon, `std::vector`. »
tour:
  - title: std::array, le tableau de taille fixe
    text: |-
      Quand le nombre d'éléments est connu d'avance, `std::array` suffit : `std::array<int, 3>` contient exactement
      trois entiers. La taille fait partie du type, et ne change jamais.

      Il s'utilise comme un vecteur, sans `push_back`. Il se copie avec `=` et se compare avec `==`.

      Les éléments qu'on ne cite pas entre les accolades valent zéro.

      Essaie : ajoute un quatrième nombre entre les accolades de `couleur`, puis exécute. Le compilateur refuse.
    example:
      files:
        main.cpp: |-
          #include <array>
          #include <print>

          int main() {
              std::array<int, 3> couleur{255, 128, 0};
              std::array<int, 3> copie = couleur;
              copie[2] = 64;

              std::println("{} composantes", couleur.size());
              std::println("bleu : {} et {}", couleur[2], copie[2]);
              std::println("identiques ? {}", couleur == copie);
          }
      output: |-
        3 composantes
        bleu : 0 et 64
        identiques ? false
cards:
  - key: taille-dans-le-type
    format: course
    question: "Que signifie le `3` dans `std::array<int, 3>` ?"
    choices:
      - {text: "La taille du tableau, fixée à la compilation", correct: true}
      - {text: "La valeur de départ de chaque élément", correct: false}
      - {text: "La taille de départ, qui peut grandir ensuite", correct: false}
      - {text: "Le nombre de dimensions du tableau", correct: false}
    answer: "La taille fait partie du type : `std::array<int, 3>` et `std::array<int, 4>` sont deux types différents. Elle ne change jamais."
  - key: array-ou-vector
    format: course
    question: "Quand choisit-on `std::array` plutôt que `std::vector` ?"
    choices:
      - {text: "Quand le nombre d'éléments est connu à la compilation et ne change pas", correct: true}
      - {text: "Quand le tableau doit contenir plus d'un million d'éléments", correct: false}
      - {text: "Quand les éléments doivent être de types différents", correct: false}
      - {text: "Quand on veut ajouter des éléments au fil de l'exécution", correct: false}
    answer: "`std::array` n'alloue rien dynamiquement : ses éléments sont dans l'objet. C'est le bon choix pour une petite taille fixe. Si la taille dépend de l'exécution, il faut un `std::vector`."
  - key: array-ou-tableau-c
    format: course
    question: "Qu'apporte `std::array<int, 3>` par rapport au tableau du C, `int t[3]` ?"
    choices:
      - {text: "Il connaît sa taille, se copie avec `=` et se compare avec `==`", correct: true}
      - {text: "Il peut changer de taille pendant l'exécution", correct: false}
      - {text: "Il est plus rapide à parcourir qu'un tableau du C", correct: false}
      - {text: "Il occupe moins de mémoire qu'un tableau du C", correct: false}
    answer: "Même mémoire, même vitesse, mais le confort d'un conteneur : `size()`, `at()`, copie, comparaison, et pas de perte de la taille quand on le passe à une fonction."
  - key: elements-non-cites
    format: course
    question: "Que valent les éléments non cités dans `std::array<int, 4> a{1, 2};` ?"
    choices:
      - {text: "Zéro", correct: true}
      - {text: "Une valeur indéterminée", correct: false}
      - {text: "La dernière valeur citée, 2", correct: false}
      - {text: "Rien : le tableau n'a que deux éléments", correct: false}
    answer: "Zéro : `a` contient 1, 2, 0, 0. Sans accolades du tout, `std::array<int, 4> a;` dans une fonction, ils seraient indéterminés."
  - key: vf-push-back
    format: true-false
    question: "On peut ajouter un élément à un `std::array` avec `push_back`."
    truth: false
    answer: Sa taille est fixe. `push_back` appartient à `std::vector`.
  - key: vf-copie
    format: true-false
    question: "Un `std::array` se copie avec `=`, comme une variable ordinaire."
    truth: true
    answer: Tous ses éléments sont copiés. Un tableau du C, lui, ne se copie pas ainsi.
  - key: vf-non-initialise
    format: true-false
    question: "Dans une fonction, `std::array<int, 3> a;` met ses trois éléments à zéro."
    truth: false
    answer: "Sans accolades, les éléments d'un type fondamental sont indéterminés. `std::array<int, 3> a{};` les met à zéro."
  - key: vf-taille-execution
    format: true-false
    question: La taille d'un `std::array` peut être lue au clavier pendant l'exécution.
    truth: false
    answer: Elle doit être une constante connue à la compilation. Pour une taille décidée à l'exécution, il faut `std::vector`.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration crée un tableau fixe de trois entiers ?
    choices:
      - {text: "`std::array<int, 3> a{1, 2, 3};`", correct: true}
      - {text: "`std::array<3, int> a{1, 2, 3};`", correct: false}
      - {text: "`std::array<int> a(3);`", correct: false}
      - {text: "`std::array<int>[3] a;`", correct: false}
    answer: "Le type des éléments d'abord, la taille ensuite, tous deux entre chevrons."
  - key: qcm-tous-a-zero
    format: multiple-choice
    question: Quelle déclaration met à zéro les douze éléments du tableau ?
    choices:
      - {text: "`std::array<int, 12> a{};`", correct: true}
      - {text: "`std::array<int, 12> a;`", correct: false}
      - {text: "`std::array<int, 12> a();`", correct: false}
      - {text: "`std::array<int, 12> a[0];`", correct: false}
    answer: "Des accolades vides. Sans accolades, les éléments sont indéterminés ; avec des parenthèses vides, la ligne déclare une fonction."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::array` ?"
    choices:
      - {text: "`<array>`", correct: true}
      - {text: "`<vector>`", correct: false}
      - {text: "`<tuple>`", correct: false}
      - {text: "`<cstdlib>`", correct: false}
    answer: "`<array>`."
  - key: qcm-deduction
    format: multiple-choice
    question: "Depuis C++17, que déclare `std::array a{1, 2, 3};` ?"
    choices:
      - {text: "Un `std::array<int, 3>` : le type et la taille sont déduits", correct: true}
      - {text: "Un `std::array<int, 0>` : sans taille, le tableau est vide", correct: false}
      - {text: "Un `std::vector<int>` : sans taille, le tableau peut grandir", correct: false}
      - {text: "Rien : la taille est obligatoire entre chevrons", correct: false}
    answer: "Le compilateur déduit le type des éléments et leur nombre de la liste entre accolades."
  - key: trous-taille
    format: fill-in
    question: |-
      Complète avec la taille du tableau :
      ```cpp
      std::array<int, ___> couleur{255, 128, 0};
      ```
    blanks:
      - ["3"]
    answer: "Trois éléments : `std::array<int, 3>`."
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète avec l'en-tête qui déclare `std::array` :
      ```cpp
      #include <___>

      std::array<int, 3> couleur{255, 128, 0};
      ```
    blanks:
      - [array]
    answer: "`std::array` est déclaré dans `<array>`."
  - key: trous-type-des-elements
    format: fill-in
    question: |-
      Complète avec le type des éléments :
      ```cpp
      std::array<___, 3> prix{1.5, 2.0, 0.5};
      ```
    blanks:
      - [double, float]
    answer: "Des nombres à virgule : `std::array<double, 3>`."
  - key: trous-fill
    format: fill-in
    question: |-
      Complète pour donner la valeur 7 à tous les éléments :
      ```cpp
      std::array<int, 5> a{};
      a.___(7);
      ```
    blanks:
      - [fill]
    answer: "`fill(7)` range 7 dans chaque élément."
  - key: code-initialisation-partielle
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 4> a{1, 2};
          std::println("{} {} {}", a[1], a[2], a.size());
      }
      ```
    choices:
      - {text: "`2 0 4`", correct: true}
      - {text: "`2 0 2`", correct: false}
      - {text: "`2 2 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 0 4` : la taille est 4, quoi qu'il y ait entre les accolades. Les éléments non cités valent zéro."
    check:
      output: "2 0 4"
  - key: code-copie-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 3> a{1, 2, 3};
          std::array<int, 3> b = a;
          std::print("{} ", a == b);
          b[0] = 9;
          std::println("{} {}", a == b, a[0]);
      }
      ```
    choices:
      - {text: "`true false 1`", correct: true}
      - {text: "`true false 9`", correct: false}
      - {text: "`true true 9`", correct: false}
      - {text: "`false false 1`", correct: false}
    answer: "`true false 1` : `b` est une copie, égale à `a` élément par élément. La modifier la rend différente, sans toucher `a`."
    check:
      output: "true false 1"
  - key: code-somme
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 5> a{};
          a.fill(2);
          a[0] = 10;
          int somme = 0;
          for (int valeur : a) {
              somme += valeur;
          }
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "`18`", correct: true}
      - {text: "`20`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`12`", correct: false}
    answer: "`18` : `fill(2)` met les cinq éléments à 2, puis le premier passe à 10. La somme vaut 10 + 2 + 2 + 2 + 2."
    check:
      output: "18"
  - key: code-at-hors-bornes
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 3> a{7, 8, 9};
          std::println("{}", a.at(2));
          std::println("{}", a.at(3));
      }
      ```
    choices:
      - {text: "`9`, puis une exception `std::out_of_range`", correct: true}
      - {text: "`8`, puis une exception `std::out_of_range`", correct: false}
      - {text: "`9`, puis `0`", correct: false}
      - {text: "`8`, puis `9`", correct: false}
    answer: "`9`, puis `std::out_of_range` : les indices valides vont de 0 à 2. `at(3)` le vérifie, et l'exception arrête le programme."
    check:
      output: "9"
      throws: "std::out_of_range"
  - key: bug-taille-variable
    format: bug-fix
    question: |-
      Le compilateur répond « the value of 'n' is not usable in a constant expression ». Le nombre de joueurs n'est
      connu qu'à l'exécution. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          int n = 4;
          std::array<int, n> scores{};
          std::println("{}", scores.size());
      }
      ```
    choices:
      - {text: "Utiliser `std::vector<int> scores(n);`", correct: true}
      - {text: "Utiliser `std::array<int> scores(n);`", correct: false}
      - {text: "Utiliser `std::array<n, int> scores{};`", correct: false}
      - {text: "Utiliser `std::array<int, auto> scores{};`", correct: false}
    answer: |-
      ```cpp
      std::vector<int> scores(n);
      ```
      La taille d'un `std::array` fait partie de son type : elle doit être connue à la compilation. Pour une taille
      décidée à l'exécution, c'est un `std::vector`.
  - key: bug-trop-d-elements
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 2> a{1, 2, 3};
          std::println("{}", a.size());
      }
      ```
    choices:
      - {text: "Déclarer la taille 3 : `std::array<int, 3>`", correct: true}
      - {text: "Déclarer la taille 0 : `std::array<int, 0>`", correct: false}
      - {text: "Remplacer les accolades par des parenthèses", correct: false}
      - {text: "Ajouter `a.push_back(3);` après la déclaration", correct: false}
    answer: |-
      ```cpp
      std::array<int, 3> a{1, 2, 3};
      ```
      Trois valeurs ne tiennent pas dans un tableau de deux éléments : le compilateur le refuse. On peut aussi laisser
      déduire la taille : `std::array a{1, 2, 3};`.
  - key: bug-non-initialise
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5`, et affiche un nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 3> totaux;
          totaux[0] += 5;
          std::println("{}", totaux[0]);
      }
      ```
    choices:
      - {text: "Écrire `std::array<int, 3> totaux{};`", correct: true}
      - {text: "Écrire `std::array<int, 3> totaux();`", correct: false}
      - {text: "Écrire `std::array<int, 0> totaux;`", correct: false}
      - {text: "Écrire `totaux[1] += 5;`", correct: false}
    answer: |-
      ```cpp
      std::array<int, 3> totaux{};
      ```
      Sans accolades, les éléments ne sont pas initialisés : leur ajouter 5 est un comportement indéfini. Les accolades
      vides les mettent à zéro.
  - key: bug-push-back
    format: bug-fix
    question: |-
      Le compilateur répond « 'struct std::array<int, 3>' has no member named 'push_back' ». Les mesures arrivent une
      à une, sans qu'on sache combien. Quelle correction est la bonne ?
      ```cpp
      #include <array>
      #include <print>

      int main() {
          std::array<int, 3> mesures{1, 2, 3};
          mesures.push_back(4);
          std::println("{}", mesures.size());
      }
      ```
    choices:
      - {text: "Utiliser un `std::vector<int>`", correct: true}
      - {text: "Utiliser `mesures.add(4);`", correct: false}
      - {text: "Utiliser `mesures[3] = 4;`", correct: false}
      - {text: "Utiliser `mesures.resize(4);`", correct: false}
    answer: |-
      ```cpp
      std::vector<int> mesures{1, 2, 3};
      mesures.push_back(4);
      ```
      Un `std::array` ne grandit pas. Écrire dans `mesures[3]` sortirait du tableau. Quand le nombre d'éléments
      varie, le bon conteneur est `std::vector`.
