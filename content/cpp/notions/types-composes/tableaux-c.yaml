notion: tableaux-c
lesson: |-
  Le **tableau de style C** est le tableau hérité du langage C : une suite d'éléments de même type, de **taille
  fixe**, connue à la compilation.

  ```cpp
  int notes[4] = {12, 15, 9, 18};
  int zeros[3] = {};            // tous les éléments à 0
  int debut[4] = {1, 2};        // 1, 2, 0, 0 : le reste est mis à zéro
  int deduit[] = {5, 6, 7};     // la taille, 3, est déduite
  ```

  On le rencontre dans le code ancien, dans les API du C, et sous `std::array` et `std::vector`. Il faut savoir le
  lire, et connaître ses défauts.

  **La dégradation en pointeur.** Dans presque toutes les expressions, le nom d'un tableau se **convertit en
  pointeur vers son premier élément**. Le tableau *se dégrade* (*decay*) : il perd sa taille.

  ```cpp
  int* p = notes;               // équivaut à &notes[0]
  ```

  La conséquence la plus piégeuse concerne les **paramètres** :

  ```cpp
  void afficher(int t[4]);      // strictement équivalent à : void afficher(int* t);
  ```

  Le `4` est ignoré. Dans la fonction, `t` est un pointeur : `sizeof(t)` donne la taille d'un pointeur, et rien ne
  dit combien d'éléments il y a. On doit passer la taille à part, ou mieux, recevoir un `std::span<int>`.

  **Connaître la taille.** Là où le tableau est encore un tableau :

  ```cpp
  std::size(notes)                       // 4 : la bonne façon
  sizeof(notes) / sizeof(notes[0])       // 4 : la façon du C, fausse sur un pointeur
  ```

  `std::size` refuse de compiler si on lui donne un pointeur : c'est un garde-fou.

  **Ce qu'un tableau C ne sait pas faire.**

  | Opération | Tableau C | `std::array` |
  |---|---|---|
  | Copier : `b = a` | ne compile pas | copie les éléments |
  | Comparer : `a == b` | compare des adresses | compare les éléments |
  | Renvoyer d'une fonction | impossible | par valeur |
  | Connaître sa taille | perdue dès qu'il est passé | `size()` |
  | Vérifier un indice | jamais | `at()` |

  Aucun accès n'est vérifié : `notes[4]` est un comportement indéfini.

  **Que choisir.** `std::array<int, 4>` quand la taille est fixe, `std::vector<int>` quand elle varie. Ils ont le
  même coût qu'un tableau C, sans ses pièges. On garde le tableau C pour dialoguer avec une API qui l'exige.

  **En entretien** : « Un tableau C se dégrade en pointeur vers son premier élément dès qu'on le passe à une
  fonction : la taille est perdue, et `sizeof` donne celle du pointeur. Il ne se copie pas et ne se compare pas.
  Je prends `std::array` ou `std::vector`, et `std::span` pour les paramètres. »
cards:
  - key: degradation
    format: course
    question: "Que veut dire qu'un tableau de style C « se dégrade en pointeur » ?"
    choices:
      - {text: "Son nom se convertit en pointeur vers son premier élément, et sa taille est perdue", correct: true}
      - {text: "Ses éléments sont déplacés sur le tas, et le tableau devient un pointeur intelligent", correct: false}
      - {text: "Sa taille diminue d'un élément chaque fois qu'il est passé à une fonction", correct: false}
      - {text: "Son contenu est recopié élément par élément dans un nouveau tableau", correct: false}
    answer: "Dans presque toutes les expressions, `t` vaut `&t[0]`. Le pointeur obtenu ne sait plus combien d'éléments le suivent."
  - key: parametre
    format: course
    question: "Que déclare réellement `void afficher(int t[10]);` ?"
    choices:
      - {text: "Une fonction qui reçoit un `int*` : le 10 est ignoré", correct: true}
      - {text: "Une fonction qui reçoit une copie des dix éléments", correct: false}
      - {text: "Une fonction qui refuse tout tableau d'une autre taille", correct: false}
      - {text: "Une fonction qui reçoit une référence vers le tableau", correct: false}
    answer: "Un paramètre de type tableau est réécrit en pointeur. On peut lui passer un tableau de trois éléments sans erreur : la taille n'est pas vérifiée."
  - key: taille
    format: course
    question: "Comment obtiens-tu le nombre d'éléments d'un tableau C `notes`, là où il est déclaré ?"
    choices:
      - {text: "Avec `std::size(notes)`", correct: true}
      - {text: "Avec `notes.size()`", correct: false}
      - {text: "Avec `sizeof(notes)`", correct: false}
      - {text: "Avec `notes.length`", correct: false}
    answer: "Un tableau C n'a pas de fonction membre. `sizeof(notes)` donne sa taille en octets ; `std::size` donne le nombre d'éléments, et refuse un pointeur."
  - key: pourquoi-std-array
    format: course
    question: "Pourquoi préférer `std::array<int, 4>` à `int t[4]` ?"
    choices:
      - {text: "Il se copie, se compare, garde sa taille, et ne coûte rien de plus", correct: true}
      - {text: "Il peut changer de taille pendant l'exécution du programme", correct: false}
      - {text: "Il range ses éléments sur le tas, ce qui libère la pile", correct: false}
      - {text: "Il vérifie chaque indice passé à l'opérateur `[]`", correct: false}
    answer: "`std::array` enveloppe un tableau C : même mémoire, même vitesse. Sa taille reste fixe, et `[]` ne vérifie rien : c'est `at()` qui vérifie."
  - key: vf-affectation
    format: true-false
    question: "On peut copier un tableau C dans un autre avec `b = a;`."
    truth: false
    answer: "L'affectation de tableaux ne compile pas. On copie avec `std::copy`, ou l'on utilise `std::array`."
  - key: vf-sizeof-parametre
    format: true-false
    question: "Dans une fonction qui reçoit `int t[]`, `sizeof(t)` donne la taille d'un pointeur."
    truth: true
    answer: "Le paramètre est un `int*`. Sur une machine 64 bits, `sizeof(t)` vaut 8, quel que soit le tableau passé."
  - key: vf-initialisation-partielle
    format: true-false
    question: "Dans `int t[4] = {1, 2};`, les deux derniers éléments valent 0."
    truth: true
    answer: "Les éléments sans valeur dans la liste sont mis à zéro."
  - key: vf-comparaison
    format: true-false
    question: "`a == b` compare les éléments de deux tableaux C."
    truth: false
    answer: "Les deux noms se dégradent en pointeurs : ce sont les adresses qui sont comparées. Cette écriture est d'ailleurs dépréciée depuis C++20."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle ligne déclare un tableau C de trois entiers, tous à zéro ?"
    choices:
      - {text: "`int t[3] = {};`", correct: true}
      - {text: "`int[3] t = 0;`", correct: false}
      - {text: "`int t(3);`", correct: false}
      - {text: "`int t = [0, 0, 0];`", correct: false}
    answer: "Les crochets suivent le nom, et les accolades vides mettent tous les éléments à zéro. Sans initialisation, un tableau local contient des valeurs quelconques."
  - key: qcm-passer
    format: multiple-choice
    question: "Quelle signature permet à une fonction de connaître le nombre d'éléments du tableau qu'elle reçoit ?"
    choices:
      - {text: "`void afficher(std::span<const int> t);`", correct: true}
      - {text: "`void afficher(const int t[]);`", correct: false}
      - {text: "`void afficher(const int* t);`", correct: false}
      - {text: "`void afficher(const int t[10]);`", correct: false}
    answer: "`std::span` transporte le pointeur et la taille. Les trois autres signatures déclarent toutes un simple pointeur."
  - key: qcm-nom-du-tableau
    format: multiple-choice
    question: "`int t[3] = {4, 5, 6};` Que vaut l'expression `*t` ?"
    choices:
      - {text: "`4`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "L'adresse du tableau", correct: false}
      - {text: "`6`", correct: false}
    answer: "`t` se dégrade en pointeur vers le premier élément. Le déréférencer donne cet élément : 4."
  - key: qcm-taille-deduite
    format: multiple-choice
    question: "Combien d'éléments contient `int t[] = {7, 8, 9, 10};` ?"
    choices:
      - {text: "Quatre : la taille est déduite de la liste", correct: true}
      - {text: "Zéro : les crochets sont vides", correct: false}
      - {text: "Un nombre variable, selon les ajouts", correct: false}
      - {text: "Aucun : la déclaration ne compile pas", correct: false}
    answer: "Avec des crochets vides, le compilateur compte les valeurs de la liste. La taille est ensuite fixe."
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <iterator>
      #include <print>

      int main() {
          int t[] = {3, 1, 4, 1, 5};
          std::println("{} {}", std::size(t), sizeof(t) / sizeof(t[0]));
      }
      ```
    choices:
      - {text: "`5 5`", correct: true}
      - {text: "`5 20`", correct: false}
      - {text: "`20 5`", correct: false}
      - {text: "`1 5`", correct: false}
    answer: "`5 5` : là où il est déclaré, le tableau connaît sa taille. Les deux calculs donnent le nombre d'éléments."
    check:
      output: "5 5"
  - key: code-initialisation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int t[4] = {7, 2};
          std::println("{} {} {} {}", t[0], t[1], t[2], t[3]);
      }
      ```
    choices:
      - {text: "`7 2 0 0`", correct: true}
      - {text: "`7 2 7 2`", correct: false}
      - {text: "`7 2 2 2`", correct: false}
      - {text: "`0 0 7 2`", correct: false}
    answer: "`7 2 0 0` : les éléments que la liste ne mentionne pas sont mis à zéro."
    check:
      output: "7 2 0 0"
  - key: code-degradation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int premier(const int* p) {
          return *p;
      }

      int main() {
          int t[3] = {8, 6, 4};
          const int* p = t;
          std::println("{} {} {}", premier(t), p == &t[0], *(p + 2));
      }
      ```
    choices:
      - {text: "`8 true 4`", correct: true}
      - {text: "`8 false 4`", correct: false}
      - {text: "`8 true 6`", correct: false}
      - {text: "`3 true 4`", correct: false}
    answer: "`8 true 4` : `t` se convertit en pointeur vers son premier élément, égal à `&t[0]`. `p + 2` désigne le troisième élément."
    check:
      output: "8 true 4"
  - key: code-modification
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void doubler(int t[], int taille) {
          for (int i = 0; i < taille; ++i) {
              t[i] *= 2;
          }
      }

      int main() {
          int t[3] = {1, 2, 3};
          doubler(t, 3);
          std::println("{} {} {}", t[0], t[1], t[2]);
      }
      ```
    choices:
      - {text: "`2 4 6`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`2 2 3`", correct: false}
      - {text: "`1 4 9`", correct: false}
    answer: "`2 4 6` : la fonction ne reçoit pas une copie du tableau, mais un pointeur vers ses éléments. Elle modifie l'original."
    check:
      output: "2 4 6"
  - key: bug-affectation
    format: bug-fix
    question: |-
      Le compilateur répond « invalid array assignment ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int a[3] = {1, 2, 3};
          int b[3] = {};
          b = a;
          std::println("{}", b[2]);
      }
      ```
    choices:
      - {text: "Déclarer `a` et `b` comme des `std::array<int, 3>`", correct: true}
      - {text: "Écrire `b[] = a[];` à la place de `b = a;`", correct: false}
      - {text: "Écrire `*b = *a;` à la place de `b = a;`", correct: false}
      - {text: "Déclarer `b` avec le type `int*`, sans l'initialiser", correct: false}
    answer: |-
      ```cpp
      std::array<int, 3> a{1, 2, 3};
      std::array<int, 3> b{};
      b = a;
      ```
      Un tableau C ne s'affecte pas. `std::array` copie ses éléments. `*b = *a` ne copierait que le premier élément.
  - key: bug-sizeof-parametre
    format: bug-fix
    question: |-
      Ce programme devrait afficher `15`, la somme des cinq éléments. Il affiche `3`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      int somme(int t[]) {
          int total = 0;
          for (std::size_t i = 0; i < sizeof(t) / sizeof(t[0]); ++i) {
              total += t[i];
          }
          return total;
      }

      int main() {
          int t[] = {1, 2, 3, 4, 5};
          std::println("{}", somme(t));
      }
      ```
    choices:
      - {text: "Recevoir un `std::span<const int>`, et le parcourir avec une boucle sur un intervalle", correct: true}
      - {text: "Recevoir `int t[5]`, pour que `sizeof(t)` connaisse la taille du tableau", correct: false}
      - {text: "Écrire `sizeof(*t)` à la place de `sizeof(t)` dans la condition", correct: false}
      - {text: "Déclarer `i` avec le type `int` à la place de `std::size_t`", correct: false}
    answer: |-
      ```cpp
      int somme(std::span<const int> t) {
          int total = 0;
          for (int x : t) {
              total += x;
          }
          return total;
      }
      ```
      Dans la fonction, `t` est un pointeur : `sizeof(t)` vaut 8, soit deux `int`. Écrire `int t[5]` n'y change
      rien. `std::span` garde la taille avec le pointeur.
  - key: bug-comparaison
    format: bug-fix
    question: |-
      Ce programme devrait afficher `égaux` : les deux tableaux ont le même contenu. Il affiche `différents`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int a[3] = {1, 2, 3};
          int b[3] = {1, 2, 3};
          if (a == b) {
              std::println("égaux");
          } else {
              std::println("différents");
          }
      }
      ```
    choices:
      - {text: "Comparer avec `std::equal(std::begin(a), std::end(a), std::begin(b))`", correct: true}
      - {text: "Comparer avec `*a == *b`, qui déréférence les deux tableaux", correct: false}
      - {text: "Comparer avec `&a == &b`, qui prend l'adresse des deux tableaux", correct: false}
      - {text: "Comparer avec `sizeof(a) == sizeof(b)`, qui compare les tailles", correct: false}
    answer: |-
      ```cpp
      if (std::equal(std::begin(a), std::end(a), std::begin(b))) {
      ```
      `a == b` compare les adresses des deux tableaux, toujours différentes. `std::equal` compare les éléments ;
      avec `std::array`, `==` le ferait directement.
  - key: bug-retour-local
    format: bug-fix
    question: |-
      Cette fonction renvoie un pointeur vers un tableau local. Le programme plante sur une erreur de segmentation.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int* creer() {
          int t[3] = {1, 2, 3};
          return t;
      }

      int main() {
          int* p = creer();
          std::println("{}", p[0]);
      }
      ```
    choices:
      - {text: "Renvoyer un `std::array<int, 3>` par valeur", correct: true}
      - {text: "Renvoyer `&t[0]` à la place de `t`", correct: false}
      - {text: "Renvoyer `int[3]` à la place de `int*`", correct: false}
      - {text: "Déclarer `p` avec le type `const int*`", correct: false}
    answer: |-
      ```cpp
      std::array<int, 3> creer() {
          return {1, 2, 3};
      }
      ```
      Le tableau local est détruit au retour : le pointeur est pendant. Une fonction ne peut pas renvoyer un tableau
      C ; `std::array` se renvoie par valeur.
  - key: trous-size
    format: fill-in
    question: |-
      Complète pour obtenir le nombre d'éléments du tableau :
      ```cpp
      int t[] = {4, 5, 6};
      std::println("{}", std::___(t));
      ```
    blanks:
      - [size]
    answer: "`std::size` donne le nombre d'éléments d'un tableau C, et refuse un pointeur."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète pour mettre tous les éléments à zéro :
      ```cpp
      int compteurs[10] = ___;
      ```
    blanks:
      - ["{}"]
    answer: "Des accolades vides initialisent chaque élément à zéro."
  - key: trous-span
    format: fill-in
    question: |-
      Complète pour que la fonction reçoive le tableau avec sa taille :
      ```cpp
      int somme(std::___<const int> valeurs) {
          int total = 0;
          for (int v : valeurs) {
              total += v;
          }
          return total;
      }
      ```
    blanks:
      - [span]
    answer: "`std::span` se construit depuis un tableau C, et garde sa taille."
  - key: trous-array
    format: fill-in
    question: |-
      Complète avec le type de la bibliothèque standard qui remplace `int t[3]` :
      ```cpp
      std::___<int, 3> t{1, 2, 3};
      ```
    blanks:
      - [array]
    answer: "`std::array<int, 3>` : même mémoire qu'un tableau C, avec la copie, la comparaison et `size()`."
