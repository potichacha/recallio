notion: variant
lesson: |-
  `std::variant<A, B, C>` (C++17, en-tête `<variant>`) contient **une valeur d'un type parmi ceux de sa liste**,
  et sait à tout moment lequel. C'est une union sûre.

  ```cpp
  std::variant<int, std::string> v = 42;      // contient un int
  v = "bonjour";                              // contient maintenant une std::string
  ```

  Sans valeur, il se construit avec son **premier** type : `std::variant<int, std::string> v;` contient l'entier 0.

  **Savoir ce qu'il contient.**

  | Expression | Résultat |
  |---|---|
  | `v.index()` | le rang du type contenu, à partir de 0 |
  | `std::holds_alternative<int>(v)` | `true` si c'est un `int` |

  **Lire la valeur.**

  | Expression | Si ce n'est pas le bon type |
  |---|---|
  | `std::get<int>(v)` | lance `std::bad_variant_access` |
  | `std::get_if<int>(&v)` | renvoie `nullptr` : un pointeur à tester |

  ```cpp
  if (const int* n = std::get_if<int>(&v)) {
      std::println("entier : {}", *n);
  }
  ```

  Demander un type qui n'est **pas dans la liste** est une erreur de compilation.

  **`std::visit` : traiter tous les cas.** On passe un **visiteur**, appelable avec chacun des types. Le compilateur
  **refuse** un visiteur qui en oublie un : c'est le grand intérêt du variant.

  ```cpp
  std::visit([](const auto& valeur) { std::println("{}", valeur); }, v);
  ```

  Pour un traitement différent par type, on réunit plusieurs lambdas :

  ```cpp
  template <typename... Ts>
  struct Surcharge : Ts... { using Ts::operator()...; };

  std::visit(Surcharge{
      [](int n) { std::println("entier {}", n); },
      [](const std::string& s) { std::println("texte {}", s); },
  }, v);
  ```

  **Variant ou héritage ?** Un variant convient à un **ensemble fermé** de types, connu d'avance : les formes d'un
  dessin, les messages d'un protocole. Ajouter un traitement est facile ; ajouter un type oblige à revoir tous les
  visiteurs, ce que le compilateur signale. Il n'alloue rien sur le tas. L'héritage convient à un ensemble
  **ouvert**, qu'on étend sans toucher au code existant.

  **`std::monostate`.** Un type vide, à mettre en premier quand aucun type de la liste n'a de constructeur par
  défaut, ou pour dire « rien » : `std::variant<std::monostate, Connexion>`.

  **En entretien** : « Un variant contient une valeur d'un type parmi une liste fermée, et sait lequel. Je le lis
  avec `std::visit`, qui oblige à traiter tous les cas, ou avec `std::get_if`. `std::get` lance
  `std::bad_variant_access` si le type n'est pas le bon. »
cards:
  - key: definition
    format: course
    question: "Que contient un `std::variant<int, std::string>` ?"
    choices:
      - {text: "Soit un `int`, soit une `std::string` : une seule valeur à la fois", correct: true}
      - {text: "Un `int` et une `std::string` en même temps, comme une paire", correct: false}
      - {text: "Soit un `int`, soit une `std::string`, soit rien du tout", correct: false}
      - {text: "Une valeur de n'importe quel type, choisi à l'exécution", correct: false}
    answer: "Le variant contient toujours une valeur, d'un des types de sa liste, et se souvient duquel. « Les deux » serait une paire ; « ou rien », un optional."
  - key: defaut
    format: course
    question: "Que contient `std::variant<int, std::string> v;`, construit sans valeur ?"
    choices:
      - {text: "Un `int` qui vaut 0 : le premier type de la liste", correct: true}
      - {text: "Une `std::string` vide : le dernier type de la liste", correct: false}
      - {text: "Rien : le variant est vide jusqu'à la première affectation", correct: false}
      - {text: "Une valeur quelconque, non initialisée", correct: false}
    answer: "Le constructeur par défaut construit le premier type, avec sa valeur par défaut."
  - key: visit
    format: course
    question: "Quel est l'intérêt de `std::visit` par rapport à une suite de `std::get_if` ?"
    choices:
      - {text: "Le compilateur refuse un visiteur qui oublie un des types", correct: true}
      - {text: "Il convertit la valeur vers le premier type de la liste", correct: false}
      - {text: "Il s'exécute à la compilation, sans coût à l'exécution", correct: false}
      - {text: "Il accepte des types qui ne sont pas dans la liste", correct: false}
    answer: "Le visiteur doit être appelable avec chaque type. Si l'on ajoute un type au variant, tous les `std::visit` incomplets cessent de compiler."
  - key: get-mauvais-type
    format: course
    question: "Que fait `std::get<int>(v)` quand le variant contient une `std::string` ?"
    choices:
      - {text: "Il lance `std::bad_variant_access`", correct: true}
      - {text: "Il renvoie `0`", correct: false}
      - {text: "Il convertit la chaîne en entier", correct: false}
      - {text: "Il renvoie un pointeur nul", correct: false}
    answer: "`std::get` vérifie le type contenu. Pour un test sans exception, `std::get_if` renvoie un pointeur, nul si le type n'est pas le bon."
  - key: vf-tas
    format: true-false
    question: "Un `std::variant` range sa valeur dans une mémoire allouée sur le tas."
    truth: false
    answer: "La valeur vit dans le variant lui-même, dont la taille est celle du plus grand de ses types, plus un indice."
  - key: vf-index
    format: true-false
    question: "`v.index()` donne le rang, dans la liste, du type que le variant contient."
    truth: true
    answer: "À partir de 0 : pour `std::variant<int, std::string>`, 0 si c'est un `int`, 1 si c'est une chaîne."
  - key: vf-hors-liste
    format: true-false
    question: "`std::get<double>(v)` compile quand `v` est un `std::variant<int, std::string>`."
    truth: false
    answer: "`double` n'est pas dans la liste : c'est une erreur de compilation, pas une exception."
  - key: vf-get-if
    format: true-false
    question: "`std::get_if<int>(&v)` renvoie un pointeur nul si le variant ne contient pas un `int`."
    truth: true
    answer: "Il reçoit l'adresse du variant, et ne lance jamais d'exception."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle expression dit si le variant `v` contient une `std::string` ?"
    choices:
      - {text: "`std::holds_alternative<std::string>(v)`", correct: true}
      - {text: "`v.is<std::string>()`", correct: false}
      - {text: "`std::get<std::string>(v) != nullptr`", correct: false}
      - {text: "`v.has_value<std::string>()`", correct: false}
    answer: "`std::holds_alternative<T>(v)` renvoie un booléen, sans exception."
  - key: qcm-monostate
    format: multiple-choice
    question: "À quoi sert `std::monostate` dans `std::variant<std::monostate, Connexion>` ?"
    choices:
      - {text: "À donner au variant un état « rien », constructible par défaut", correct: true}
      - {text: "À empêcher le variant de changer de type", correct: false}
      - {text: "À protéger le variant contre les accès de plusieurs threads", correct: false}
      - {text: "À ranger la connexion sur le tas", correct: false}
    answer: "`std::monostate` est un type vide. Placé en premier, il rend le variant constructible par défaut, même si `Connexion` ne l'est pas."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::variant` et `std::visit` ?"
    choices:
      - {text: "`<variant>`", correct: true}
      - {text: "`<any>`", correct: false}
      - {text: "`<utility>`", correct: false}
      - {text: "`<optional>`", correct: false}
    answer: "`<variant>`, depuis C++17."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans quel cas un `std::variant` convient-il mieux qu'une hiérarchie de classes ?"
    choices:
      - {text: "Quand l'ensemble des types est fermé, et connu d'avance", correct: true}
      - {text: "Quand des bibliothèques tierces doivent ajouter leurs types", correct: false}
      - {text: "Quand le nombre de types est inconnu à la compilation", correct: false}
      - {text: "Quand les objets doivent être partagés entre threads", correct: false}
    answer: "La liste d'un variant est figée dans son type. En échange, ajouter un traitement est simple, et le compilateur vérifie que tous les cas sont couverts."
  - key: trous-holds
    format: fill-in
    question: |-
      Complète pour tester si le variant contient un entier :
      ```cpp
      if (std::___<int>(v)) {
          std::println("entier");
      }
      ```
    blanks:
      - [holds_alternative]
    answer: "`std::holds_alternative<T>(v)` teste le type contenu."
  - key: trous-get
    format: fill-in
    question: |-
      Complète pour lire la chaîne contenue dans le variant :
      ```cpp
      std::variant<int, std::string> v = "abc";
      std::println("{}", std::___<std::string>(v));
      ```
    blanks:
      - [get]
    answer: "`std::get<T>(v)` renvoie la valeur, ou lance `std::bad_variant_access`."
  - key: trous-visit
    format: fill-in
    question: |-
      Complète pour appliquer la lambda à la valeur contenue, quel que soit son type :
      ```cpp
      std::___([](const auto& valeur) { std::println("{}", valeur); }, v);
      ```
    blanks:
      - [visit]
    answer: "`std::visit(visiteur, variant)` appelle le visiteur avec la valeur contenue."
  - key: trous-get-if
    format: fill-in
    question: |-
      Complète pour obtenir un pointeur vers l'entier, ou `nullptr` :
      ```cpp
      if (const int* n = std::___<int>(&v)) {
          std::println("{}", *n);
      }
      ```
    blanks:
      - [get_if]
    answer: "`std::get_if<T>(&v)` renvoie un pointeur, nul si le type contenu n'est pas `T`."
  - key: code-index
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          std::variant<int, std::string> v;
          std::print("{} {} ", v.index(), std::get<int>(v));
          v = std::string{"abc"};
          std::println("{} {}", v.index(), std::get<std::string>(v));
      }
      ```
    choices:
      - {text: "`0 0 1 abc`", correct: true}
      - {text: "`1 0 0 abc`", correct: false}
      - {text: "`0 0 0 abc`", correct: false}
      - {text: "`0 0 2 abc`", correct: false}
    answer: "`0 0 1 abc` : par défaut, le variant contient son premier type, un `int` nul. Après l'affectation, il contient la chaîne, de rang 1."
    check:
      output: "0 0 1 abc"
  - key: code-get-if
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          const std::variant<int, std::string> v = 7;
          std::println("{} {} {}",
                       std::holds_alternative<int>(v),
                       std::get_if<std::string>(&v) == nullptr,
                       *std::get_if<int>(&v));
      }
      ```
    choices:
      - {text: "`true true 7`", correct: true}
      - {text: "`true false 7`", correct: false}
      - {text: "`false true 7`", correct: false}
      - {text: "`true true 0`", correct: false}
    answer: "`true true 7` : le variant contient un `int`. `get_if` rend un pointeur nul pour la chaîne, et un pointeur vers 7 pour l'entier."
    check:
      output: "true true 7"
  - key: code-visit
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <variant>
      #include <vector>

      int main() {
          const std::vector<std::variant<int, std::string>> valeurs{1, std::string{"deux"}, 3};
          for (const auto& v : valeurs) {
              std::visit([](const auto& x) { std::print("{} ", x); }, v);
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`1 deux 3 fin`", correct: true}
      - {text: "`0 1 0 fin`", correct: false}
      - {text: "`1 3 fin`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 deux 3 fin` : la lambda générique est appelée avec la valeur de chaque variant, entier ou chaîne."
    check:
      output: "1 deux 3 fin"
  - key: code-exception
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          const std::variant<int, std::string> v = std::string{"abc"};
          try {
              std::print("{} ", std::get<std::string>(v));
              std::print("{} ", std::get<int>(v));
          } catch (const std::bad_variant_access&) {
              std::print("mauvais type ");
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`abc mauvais type fin`", correct: true}
      - {text: "`abc 0 fin`", correct: false}
      - {text: "`mauvais type fin`", correct: false}
      - {text: "`abc mauvais type`", correct: false}
    answer: "`abc mauvais type fin` : la chaîne se lit. Demander un `int` lance `std::bad_variant_access`, attrapée."
    check:
      output: "abc mauvais type fin"
  - key: bug-get-sans-test
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::bad_variant_access`. Il devrait afficher `texte`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          const std::variant<int, std::string> v = std::string{"abc"};
          std::println("{}", std::get<int>(v));
      }
      ```
    choices:
      - {text: "Tester avec `std::get_if<int>(&v)`, et afficher `texte` s'il renvoie `nullptr`", correct: true}
      - {text: "Écrire `std::get<0>(v)` à la place de `std::get<int>(v)`", correct: false}
      - {text: "Écrire `static_cast<int>(v)` à la place de `std::get<int>(v)`", correct: false}
      - {text: "Déclarer le variant sans `const`, pour que `std::get` le convertisse", correct: false}
    answer: |-
      ```cpp
      if (const int* n = std::get_if<int>(&v)) {
          std::println("{}", *n);
      } else {
          std::println("texte");
      }
      ```
      Le variant contient une chaîne : `std::get<int>` lance. `std::get<0>` demande le même type, par son rang.
      `std::get_if` permet de tester sans exception.
  - key: bug-visiteur-incomplet
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel de `std::visit` : le visiteur ne sait pas traiter une `std::string`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          const std::variant<int, std::string> v = 5;
          std::visit([](int n) { std::println("{}", n); }, v);
      }
      ```
    choices:
      - {text: "Écrire une lambda générique : `[](const auto& x) { std::println(\"{}\", x); }`", correct: true}
      - {text: "Écrire une lambda qui prend un `long` : `[](long n) { std::println(\"{}\", n); }`", correct: false}
      - {text: "Passer le variant en premier : `std::visit(v, [](int n) { ... })`", correct: false}
      - {text: "Passer `std::get<int>(v)` à `std::visit`, à la place de `v`", correct: false}
    answer: |-
      ```cpp
      std::visit([](const auto& x) { std::println("{}", x); }, v);
      ```
      Le visiteur doit être appelable avec chaque type de la liste, même si le variant contient ici un entier. C'est
      la garantie de `std::visit` : aucun cas oublié.
  - key: bug-type-hors-liste
    format: bug-fix
    question: |-
      Le compilateur refuse d'initialiser le variant avec `2.5` : `double` n'est pas un de ses types. Le programme
      doit afficher `2.5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <variant>

      int main() {
          const std::variant<int, std::string> v = 2.5;
          std::println("{}", std::get<double>(v));
      }
      ```
    choices:
      - {text: "Déclarer `std::variant<double, std::string> v = 2.5;`", correct: true}
      - {text: "Écrire `std::get<int>(v)` : le variant convertit 2.5 en entier", correct: false}
      - {text: "Écrire `std::get_if<double>(&v)` à la place de `std::get<double>(v)`", correct: false}
      - {text: "Écrire `std::get<2>(v)` : `double` est le troisième type", correct: false}
    answer: |-
      ```cpp
      const std::variant<double, std::string> v = 2.5;
      ```
      Un variant ne contient que les types de sa liste, et refuse une conversion avec perte vers `int`. Pour y
      ranger un `double`, il faut qu'il y figure. `std::get<double>` serait refusé pour la même raison.
  - key: bug-sans-constructeur-defaut
    format: bug-fix
    question: |-
      Le compilateur refuse de construire le variant sans valeur : `Session`, son premier type, n'a pas de
      constructeur par défaut. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <variant>

      struct Session {
          explicit Session(int id) : id{id} {}
          int id;
      };

      int main() {
          std::variant<Session, int> etat;
          std::println("{}", etat.index());
      }
      ```
    choices:
      - {text: "Déclarer `std::variant<std::monostate, Session, int> etat;`", correct: true}
      - {text: "Déclarer `std::variant<Session, int> etat{};`", correct: false}
      - {text: "Déclarer `std::variant<Session, int> etat = nullptr;`", correct: false}
      - {text: "Déclarer `std::variant<Session&, int> etat;`", correct: false}
    answer: |-
      ```cpp
      std::variant<std::monostate, Session, int> etat;
      ```
      Sans valeur, un variant construit son premier type. `std::monostate`, un type vide, est fait pour tenir cette
      place et dire « rien pour l'instant ».
