notion: expected
lesson: |-
  `std::expected<T, E>` (C++23, en-tête `<expected>`) contient **soit une valeur** de type `T`, **soit une erreur**
  de type `E`. C'est le type de retour d'une fonction qui peut échouer, et qui veut dire **pourquoi**.

  ```cpp
  std::expected<int, std::string> diviser(int a, int b) {
      if (b == 0) {
          return std::unexpected{"division par zéro"};
      }
      return a / b;
  }
  ```

  - La réussite se renvoie **directement** : `return a / b;`.
  - L'échec s'emballe dans **`std::unexpected`** : c'est ce qui distingue l'erreur de la valeur.

  **Utiliser le résultat.**

  ```cpp
  if (auto resultat = diviser(10, 2)) {
      std::println("{}", *resultat);
  } else {
      std::println("erreur : {}", resultat.error());
  }
  ```

  | Expression | Effet |
  |---|---|
  | `if (r)`, `r.has_value()` | vrai s'il contient une valeur |
  | `*r`, `r->membre` | la valeur ; **comportement indéfini** s'il contient une erreur |
  | `r.value()` | la valeur ; lance `std::bad_expected_access` sinon |
  | `r.error()` | l'erreur ; comportement indéfini s'il contient une valeur |
  | `r.value_or(defaut)` | la valeur, ou `defaut` en cas d'erreur |

  On **teste avant** de lire avec `*` ou `error()`.

  **Enchaîner sans `if`.** Trois fonctions membres évitent les tests en cascade :

  - `transform(f)` applique `f` à la valeur ; une erreur passe telle quelle ;
  - `and_then(f)` enchaîne une fonction qui renvoie elle-même un `std::expected` ;
  - `or_else(f)` traite l'erreur.

  ```cpp
  auto resultat = lire(texte).and_then(valider).transform(doubler);
  ```

  À la première erreur, les étapes suivantes sont sautées.

  **Par rapport aux autres mécanismes.**

  | | Dit pourquoi | Peut être ignoré | Coût en cas d'échec |
  |---|---|---|---|
  | `std::optional<T>` | non | l'appelant doit tester | nul |
  | `std::expected<T, E>` | oui | l'appelant doit tester | nul |
  | exception | oui | non : elle remonte | élevé |

  `std::expected` convient quand l'échec est **courant** et traité par l'appelant : analyser une saisie, valider
  une requête. L'exception reste préférable pour l'échec rare, traité loin.

  **`std::expected<void, E>`** : pour une fonction qui ne renvoie rien, mais peut échouer.

  **En entretien** : « `std::expected<T, E>` porte une valeur ou une erreur. On renvoie l'erreur avec
  `std::unexpected`, on teste avec `if (r)`, puis `*r` ou `r.error()`. Je le prends quand l'échec est courant et
  que l'appelant veut la cause, sans le coût d'une exception. »
cards:
  - key: definition
    format: course
    question: "Que contient un `std::expected<int, std::string>` ?"
    choices:
      - {text: "Soit un `int`, la valeur attendue, soit une `std::string`, l'erreur", correct: true}
      - {text: "Un `int` et une `std::string` en même temps, comme une paire", correct: false}
      - {text: "Soit une `std::string`, la valeur attendue, soit un `int`, le code d'erreur", correct: false}
      - {text: "Soit un `int`, soit rien, sans aucune explication", correct: false}
    answer: "Le premier paramètre est le type de la valeur, le second celui de l'erreur. « Une valeur ou rien », c'est `std::optional`."
  - key: unexpected
    format: course
    question: "Comment une fonction qui renvoie `std::expected<int, std::string>` signale-t-elle un échec ?"
    choices:
      - {text: "`return std::unexpected{\"message\"};`", correct: true}
      - {text: "`return \"message\";`", correct: false}
      - {text: "`return std::nullopt;`", correct: false}
      - {text: "`throw std::expected{\"message\"};`", correct: false}
    answer: "`std::unexpected` emballe l'erreur, pour la distinguer d'une valeur. La réussite, elle, se renvoie directement."
  - key: lire
    format: course
    question: "Que se passe-t-il quand on écrit `*r` sur un `std::expected` qui contient une erreur ?"
    choices:
      - {text: "C'est un comportement indéfini : il fallait tester d'abord", correct: true}
      - {text: "Une exception `std::bad_expected_access` est lancée", correct: false}
      - {text: "La valeur par défaut du type est renvoyée", correct: false}
      - {text: "L'erreur est renvoyée à la place de la valeur", correct: false}
    answer: "Comme pour `std::optional`, `*` ne vérifie rien. C'est `value()` qui vérifie, et lance `std::bad_expected_access`."
  - key: quand
    format: course
    question: "Quand `std::expected` convient-il mieux qu'une exception ?"
    choices:
      - {text: "Quand l'échec est courant, et traité par l'appelant direct", correct: true}
      - {text: "Quand l'échec est rare, et traité plusieurs appels plus haut", correct: false}
      - {text: "Quand l'échec est une faute de programmation", correct: false}
      - {text: "Quand la fonction est un constructeur", correct: false}
    answer: "Renvoyer un `std::expected` ne coûte rien, même en cas d'échec. Une exception coûte cher à lancer, mais remonte seule : elle convient à l'échec rare."
  - key: vf-ordre
    format: true-false
    question: "Dans `std::expected<T, E>`, `E` est le type de l'erreur."
    truth: true
    answer: "La valeur d'abord, l'erreur ensuite."
  - key: vf-value
    format: true-false
    question: "`r.value()` est un comportement indéfini quand `r` contient une erreur."
    truth: false
    answer: "`value()` vérifie, et lance `std::bad_expected_access`. C'est `*r` qui est indéfini."
  - key: vf-version
    format: true-false
    question: "`std::expected` fait partie de la bibliothèque standard depuis C++17."
    truth: false
    answer: "Depuis C++23. `std::optional` et `std::variant`, eux, datent de C++17."
  - key: vf-transform
    format: true-false
    question: "`r.transform(f)` n'appelle pas `f` quand `r` contient une erreur."
    truth: true
    answer: "L'erreur passe telle quelle au résultat. C'est ce qui permet d'enchaîner les étapes sans test."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle condition est vraie quand le `std::expected` nommé `r` contient une valeur ?"
    choices:
      - {text: "`if (r)`", correct: true}
      - {text: "`if (r.error())`", correct: false}
      - {text: "`if (r == nullptr)`", correct: false}
      - {text: "`if (r.empty())`", correct: false}
    answer: "Un `std::expected` se convertit en booléen : vrai s'il contient une valeur. `r.has_value()` dit la même chose."
  - key: qcm-defaut
    format: multiple-choice
    question: "Quelle expression donne la valeur de `r`, ou `0` s'il contient une erreur ?"
    choices:
      - {text: "`r.value_or(0)`", correct: true}
      - {text: "`r.error_or(0)`", correct: false}
      - {text: "`r.value(0)`", correct: false}
      - {text: "`*r || 0`", correct: false}
    answer: "`value_or(defaut)` ne lance pas et ne teste rien de plus : la valeur, ou le défaut."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::expected` et `std::unexpected` ?"
    choices:
      - {text: "`<expected>`", correct: true}
      - {text: "`<optional>`", correct: false}
      - {text: "`<stdexcept>`", correct: false}
      - {text: "`<system_error>`", correct: false}
    answer: "`<expected>`, depuis C++23."
  - key: qcm-and-then
    format: multiple-choice
    question: "Quelle fonction membre enchaîne une étape qui renvoie elle-même un `std::expected` ?"
    choices:
      - {text: "`and_then`", correct: true}
      - {text: "`transform`", correct: false}
      - {text: "`value_or`", correct: false}
      - {text: "`error`", correct: false}
    answer: "`and_then(f)` attend une fonction qui renvoie un `std::expected`. `transform(f)` attend une fonction qui renvoie une simple valeur, qu'il emballe."
  - key: trous-unexpected
    format: fill-in
    question: |-
      Complète pour renvoyer une erreur :
      ```cpp
      std::expected<int, std::string> diviser(int a, int b) {
          if (b == 0) {
              return std::___{"division par zéro"};
          }
          return a / b;
      }
      ```
    blanks:
      - [unexpected]
    answer: "`std::unexpected` emballe la valeur d'erreur."
  - key: trous-error
    format: fill-in
    question: |-
      Complète pour afficher la cause de l'échec :
      ```cpp
      if (!resultat) {
          std::println("{}", resultat.___());
      }
      ```
    blanks:
      - [error]
    answer: "`error()` donne l'erreur contenue, une fois qu'on a vérifié qu'il y en a une."
  - key: trous-value-or
    format: fill-in
    question: |-
      Complète pour obtenir la valeur, ou `-1` en cas d'erreur :
      ```cpp
      const int quotient = diviser(a, b).___(-1);
      ```
    blanks:
      - [value_or]
    answer: "`value_or(defaut)` renvoie la valeur, ou le défaut s'il y a une erreur."
  - key: trous-type
    format: fill-in
    question: |-
      Complète le type de retour : un entier, ou un message d'erreur.
      ```cpp
      std::___<int, std::string> lire_age(std::string_view texte);
      ```
    blanks:
      - [expected]
    answer: "`std::expected<int, std::string>` : la valeur d'abord, l'erreur ensuite."
  - key: code-reussite-echec
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> diviser(int a, int b) {
          if (b == 0) {
              return std::unexpected{"zéro"};
          }
          return a / b;
      }

      int main() {
          const auto r = diviser(10, 2);
          const auto e = diviser(1, 0);
          std::println("{} {} {}", *r, e.has_value(), e.error());
      }
      ```
    choices:
      - {text: "`5 false zéro`", correct: true}
      - {text: "`5 true zéro`", correct: false}
      - {text: "`5 false 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5 false zéro` : le premier appel réussit et contient 5. Le second contient l'erreur, lue avec `error()`."
    check:
      output: "5 false zéro"
  - key: code-value-or
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(bool ok) {
          if (!ok) {
              return std::unexpected{"illisible"};
          }
          return 42;
      }

      int main() {
          std::println("{} {}", lire(true).value_or(-1), lire(false).value_or(-1));
      }
      ```
    choices:
      - {text: "`42 -1`", correct: true}
      - {text: "`42 0`", correct: false}
      - {text: "`-1 -1`", correct: false}
      - {text: "`42 illisible`", correct: false}
    answer: "`42 -1` : `value_or` rend la valeur quand il y en a une, et le défaut en cas d'erreur."
    check:
      output: "42 -1"
  - key: code-transform
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire(int n) {
          if (n < 0) {
              return std::unexpected{"négatif"};
          }
          return n;
      }

      int main() {
          const auto doubler = [](int x) { return x * 2; };
          const auto a = lire(4).transform(doubler);
          const auto b = lire(-1).transform(doubler);
          std::println("{} {}", a.value_or(0), b.has_value() ? "valeur" : b.error());
      }
      ```
    choices:
      - {text: "`8 négatif`", correct: true}
      - {text: "`8 valeur`", correct: false}
      - {text: "`4 négatif`", correct: false}
      - {text: "`8 -2`", correct: false}
    answer: "`8 négatif` : `transform` double la valeur 4. Sur une erreur, la lambda n'est pas appelée, et l'erreur est transmise."
    check:
      output: "8 négatif"
  - key: code-exception
    format: code-output
    question: |-
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      int main() {
          const std::expected<int, std::string> r = std::unexpected{"panne"};
          try {
              std::print("{} ", r.value());
          } catch (const std::bad_expected_access<std::string>& e) {
              std::print("{} ", e.error());
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`panne fin`", correct: true}
      - {text: "`0 fin`", correct: false}
      - {text: "`fin`", correct: false}
      - {text: "`panne`", correct: false}
    answer: "`panne fin` : `value()` vérifie, et lance `std::bad_expected_access`, qui transporte l'erreur."
    check:
      output: "panne fin"
  - key: bug-erreur-sans-unexpected
    format: bug-fix
    question: |-
      Le compilateur refuse `return "division par zéro";` : il ne peut pas convertir ce texte vers le type de
      retour. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> diviser(int a, int b) {
          if (b == 0) {
              return "division par zéro";
          }
          return a / b;
      }

      int main() {
          std::println("{}", diviser(1, 0).has_value());
      }
      ```
    choices:
      - {text: "Écrire `return std::unexpected{\"division par zéro\"};`", correct: true}
      - {text: "Écrire `return std::string{\"division par zéro\"};`", correct: false}
      - {text: "Écrire `return std::nullopt;`", correct: false}
      - {text: "Écrire `return {\"division par zéro\"};`", correct: false}
    answer: |-
      ```cpp
      return std::unexpected{"division par zéro"};
      ```
      Une valeur renvoyée directement est prise pour la réussite, de type `int`. L'erreur doit être emballée dans
      `std::unexpected`.
  - key: bug-sans-test
    format: bug-fix
    question: |-
      Ce programme lit la valeur d'un résultat qui contient une erreur : comportement indéfini. Il devrait afficher
      `échec`. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire() {
          return std::unexpected{"illisible"};
      }

      int main() {
          const auto r = lire();
          std::println("{}", *r);
      }
      ```
    choices:
      - {text: "Tester `if (r)` avant de lire `*r`, et afficher `échec` sinon", correct: true}
      - {text: "Écrire `r.error()` à la place de `*r`, sans test", correct: false}
      - {text: "Écrire `**r` à la place de `*r`", correct: false}
      - {text: "Déclarer `r` avec `auto&` à la place de `const auto`", correct: false}
    answer: |-
      ```cpp
      if (r) {
          std::println("{}", *r);
      } else {
          std::println("échec");
      }
      ```
      `*r` ne vérifie pas ce que contient le résultat. On teste d'abord ; ou l'on prend `value()`, qui lance, ou
      `value_or`.
  - key: bug-value-sans-test
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::bad_expected_access`. Il devrait afficher `0` quand la lecture
      échoue. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<int, std::string> lire() {
          return std::unexpected{"illisible"};
      }

      int main() {
          std::println("{}", lire().value());
      }
      ```
    choices:
      - {text: "Écrire `lire().value_or(0)`", correct: true}
      - {text: "Écrire `*lire()`", correct: false}
      - {text: "Écrire `lire().error()`", correct: false}
      - {text: "Écrire `lire().value(0)`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", lire().value_or(0));
      ```
      `value()` lance quand le résultat contient une erreur. `value_or(0)` fournit la valeur de repli. `*lire()`
      serait un comportement indéfini.
  - key: bug-ordre-des-types
    format: bug-fix
    question: |-
      Le compilateur refuse les deux `return` de cette fonction. Quelle correction est la bonne ?
      ```cpp
      #include <expected>
      #include <print>
      #include <string>

      std::expected<std::string, int> lire_age(bool ok) {
          if (!ok) {
              return std::unexpected{std::string{"âge illisible"}};
          }
          return 36;
      }

      int main() {
          std::println("{}", lire_age(true).value_or(0));
      }
      ```
    choices:
      - {text: "Déclarer le type de retour `std::expected<int, std::string>`", correct: true}
      - {text: "Déclarer le type de retour `std::expected<std::string>`", correct: false}
      - {text: "Écrire `return std::unexpected{36};` pour la réussite", correct: false}
      - {text: "Écrire `return \"36\";` pour la réussite", correct: false}
    answer: |-
      ```cpp
      std::expected<int, std::string> lire_age(bool ok) {
      ```
      Le type de la valeur vient en premier, celui de l'erreur en second. Ici ils étaient inversés : l'âge est un
      `int`, le message une `std::string`.
  - key: situation-saisie
    format: scenario
    question: |-
      Une fonction analyse une date saisie dans un formulaire. Une saisie sur cinq est invalide, et l'écran doit
      afficher la raison : « mois inconnu », « jour hors du mois »... Quel type de retour choisis-tu ?
    choices:
      - {text: "`std::expected<Date, std::string>`", correct: true}
      - {text: "`std::optional<Date>`", correct: false}
      - {text: "`Date`, avec une exception pour chaque saisie invalide", correct: false}
      - {text: "`bool`, avec la date dans un paramètre de sortie", correct: false}
    answer: |-
      L'échec est courant, traité sur place, et sa cause doit être affichée : c'est le cas d'usage de
      `std::expected`. `std::optional` ne dirait pas pourquoi ; une exception par saisie fausse serait coûteuse et
      détournée de son rôle.
  - key: situation-cascade
    format: scenario
    question: |-
      Un traitement enchaîne quatre étapes qui renvoient chacune un `std::expected` : lire, analyser, valider,
      enregistrer. Le code est une pyramide de `if` imbriqués. Que proposes-tu ?
    choices:
      - {text: "Enchaîner les étapes avec `and_then` : la première erreur saute les suivantes", correct: true}
      - {text: "Remplacer chaque `if` par un `*`, sans tester le résultat", correct: false}
      - {text: "Ignorer les résultats intermédiaires, et ne tester que le dernier", correct: false}
      - {text: "Ranger chaque résultat dans une variable globale", correct: false}
    answer: |-
      `lire(x).and_then(analyser).and_then(valider).and_then(enregistrer)` s'écrit à plat. Dès qu'une étape
      échoue, son erreur traverse les suivantes sans qu'elles s'exécutent.
  - key: situation-optional-ou-expected
    format: scenario
    question: |-
      Une fonction `trouver(id)` cherche un client dans un cache en mémoire. S'il n'y est pas, il n'y a rien à
      expliquer : il est absent. Un collègue propose `std::expected<Client, std::string>` avec l'erreur
      « absent ». Qu'en penses-tu ?
    choices:
      - {text: "Qu'un `std::optional<Client>` suffit : il n'y a qu'une seule cause possible", correct: true}
      - {text: "Qu'il a raison : `std::expected` remplace `std::optional` dans tous les cas", correct: false}
      - {text: "Qu'il faut une exception : un client absent est une situation exceptionnelle", correct: false}
      - {text: "Qu'il faut renvoyer un `Client` vide, que l'appelant reconnaîtra", correct: false}
    answer: |-
      `std::expected` se justifie quand l'appelant a besoin de distinguer des causes. Pour « présent ou absent »,
      `std::optional` dit tout, plus simplement. Un objet vide, lui, se confond avec un vrai client.
  - key: situation-frontiere
    format: scenario
    question: |-
      Ton module renvoie partout des `std::expected`. Son unique point d'entrée est appelé par un code ancien, qui
      ne connaît que les exceptions. Comment fais-tu le lien ?
    choices:
      - {text: "Au point d'entrée, je teste le résultat et je lance une exception construite avec `error()`", correct: true}
      - {text: "Je remplace tous les `std::expected` du module par des exceptions", correct: false}
      - {text: "Je renvoie `*resultat` sans test : l'appelant attrapera le problème", correct: false}
      - {text: "Je renvoie le `std::expected` tel quel, et l'appelant l'ignore", correct: false}
    answer: |-
      On garde une convention par couche, et l'on convertit à la frontière : une fonction mince transforme l'erreur
      en exception. `value()` le fait d'ailleurs seul, en lançant `std::bad_expected_access`, mais une exception du
      domaine est plus parlante.
