notion: std-string
lesson: |-
  **`std::string`**, dans `<string>`, est la chaîne de caractères de la bibliothèque standard. Elle **possède** ses
  caractères, gère sa mémoire, et grandit à la demande.

  ```cpp
  std::string prenom = "Ada";
  std::string nom = prenom + " Lovelace";   // concaténer
  nom += " !";                              // ajouter à la fin
  ```

  | Opération | Écriture |
  |---|---|
  | Taille, en octets | `s.size()` (ou `s.length()`) ; `s.empty()` |
  | Un caractère | `s[i]`, sans vérification ; `s.at(i)`, vérifié |
  | Premier, dernier | `s.front()`, `s.back()` |
  | Comparer | `==`, `!=`, `<`, `>` : contenu, ordre du dictionnaire |
  | Extraire | `s.substr(debut, longueur)` |
  | Chercher | `s.find("mot")` : la position, ou `std::string::npos` |
  | Parcourir | `for (char c : s)` |
  | Convertir | `std::to_string(42)`, `std::stoi("42")` |

  - **`s[i]` ne vérifie pas l'indice** : hors des bornes, c'est un comportement indéfini. **`s.at(i)`** lève
    `std::out_of_range`.
  - La comparaison suit les **codes des caractères** : les majuscules passent avant les minuscules, `"Zoo" < "abc"`.
  - `size()` compte des **octets**, pas des lettres : en UTF-8, « é » en occupe deux.
  - Copier une `std::string` copie tous ses caractères. On la passe donc par `const std::string&`.

  **Le piège des littéraux.** `"Ada"` n'est pas une `std::string`, mais un tableau de caractères.

  - `"Bon" + "jour"` ne compile pas : il faut qu'un des deux côtés soit une `std::string`.
  - `"Total : " + 42` compile, et ne concatène pas : il décale un pointeur de 42 caractères. Il faut
    `"Total : " + std::to_string(42)`.

  **En entretien** : « `std::string` possède ses caractères et les libère seule. Je la passe par référence constante,
  et je teste le résultat de `find` contre `npos` avant de m'en servir. »
tour:
  - title: Les chaînes de caractères
    text: |-
      `std::string`, dans `<string>`, est une chaîne qui gère sa mémoire toute seule. `+` et `+=` concatènent,
      `size()` donne sa longueur, `==` compare le contenu, et `s[i]` donne un caractère, à partir de 0.

      `substr(debut, longueur)` extrait un morceau ; `find` cherche un texte et renvoie sa position.

      Attention : `"Bon" + "jour"` ne compile pas. Entre guillemets, ce ne sont pas des `std::string` : il en faut une
      d'un côté au moins.

      Essaie : remplace `nom[0]` par `nom.back()`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              std::string prenom = "Ada";
              std::string nom = prenom + " Lovelace";

              std::println("{} ({} caractères)", nom, nom.size());
              std::println("initiale : {}", nom[0]);
              std::println("nom de famille : {}", nom.substr(4));
              std::println("même prénom ? {}", prenom == "Ada");
          }
      output: |-
        Ada Lovelace (12 caractères)
        initiale : A
        nom de famille : Lovelace
        même prénom ? true
    task:
      instructions: |-
        Construis l'adresse à partir des deux variables, pour afficher `ada@recallio.fr`.
      starter:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              std::string identifiant = "ada";
              std::string domaine = "recallio.fr";

              std::string adresse = identifiant;
              std::println("{}", adresse);
          }
      solution:
        main.cpp: |-
          #include <print>
          #include <string>

          int main() {
              std::string identifiant = "ada";
              std::string domaine = "recallio.fr";

              std::string adresse = identifiant + "@" + domaine;
              std::println("{}", adresse);
          }
      output: "ada@recallio.fr"
cards:
  - key: crochets-ou-at
    format: course
    question: "Quelle différence entre `s[i]` et `s.at(i)` sur une `std::string` ?"
    choices:
      - {text: "`s.at(i)` vérifie l'indice et lève une exception, `s[i]` ne vérifie rien", correct: true}
      - {text: "`s[i]` vérifie l'indice et lève une exception, `s.at(i)` ne vérifie rien", correct: false}
      - {text: "`s.at(i)` compte à partir de 1, `s[i]` à partir de 0", correct: false}
      - {text: "`s[i]` renvoie une copie du caractère, `s.at(i)` une chaîne", correct: false}
    answer: "`at` lève `std::out_of_range` pour un indice invalide. Avec les crochets, sortir des bornes est un comportement indéfini : aucun contrôle, aucune exception."
  - key: litteral-n-est-pas-string
    format: course
    question: "Pourquoi `\"Bon\" + \"jour\"` ne compile-t-il pas ?"
    choices:
      - {text: "Deux littéraux sont des tableaux de caractères : `+` ne les concatène pas", correct: true}
      - {text: "L'opérateur `+` ne s'applique jamais à du texte en C++", correct: false}
      - {text: "Il faut inclure `<string>` pour additionner deux littéraux", correct: false}
      - {text: "Les deux littéraux n'ont pas la même longueur", correct: false}
    answer: "Entre guillemets, un texte est un tableau de `char`, pas une `std::string`. La concaténation existe pour `std::string` : il en faut une d'un côté, `std::string(\"Bon\") + \"jour\"`."
  - key: find-npos
    format: course
    question: "Que renvoie `s.find(\"mot\")` quand le texte n'est pas dans la chaîne ?"
    choices:
      - {text: "`std::string::npos`, une valeur spéciale", correct: true}
      - {text: "`-1`, sous la forme d'un `int`", correct: false}
      - {text: "`0`, comme une recherche vide", correct: false}
      - {text: "Rien : elle lève une exception", correct: false}
    answer: "`std::string::npos`, la plus grande valeur de `std::size_t`. Il faut la tester avant d'utiliser la position : `if (pos != std::string::npos)`."
  - key: comparaison
    format: course
    question: "Que compare `a == b` pour deux `std::string` ?"
    choices:
      - {text: "Leur contenu, caractère par caractère", correct: true}
      - {text: "Leur adresse en mémoire", correct: false}
      - {text: "Leur longueur seulement", correct: false}
      - {text: "Leur premier caractère seulement", correct: false}
    answer: "Le contenu. C'est la différence avec les chaînes du C, où `==` compare deux pointeurs. `<` et `>` suivent l'ordre du dictionnaire, d'après les codes des caractères."
  - key: vf-size-caracteres
    format: true-false
    question: "Pour une chaîne en UTF-8, `size()` renvoie toujours le nombre de lettres."
    truth: false
    answer: "`size()` compte des octets. En UTF-8, une lettre accentuée en occupe deux : « été » a une taille de 5."
  - key: vf-modifiable
    format: true-false
    question: Une `std::string` peut être modifiée après sa création.
    truth: true
    answer: "On peut lui ajouter du texte (`+=`), changer un caractère (`s[0] = 'X'`) ou la vider (`clear()`)."
  - key: vf-majuscules-avant
    format: true-false
    question: "`std::string(\"Zoo\") < std::string(\"abc\")` est vrai."
    truth: true
    answer: La comparaison suit les codes des caractères, et les majuscules ont des codes plus petits que les minuscules.
  - key: vf-crochets-exception
    format: true-false
    question: "`s[100]` lève une exception si la chaîne a moins de 100 caractères."
    truth: false
    answer: "Les crochets ne vérifient rien : c'est un comportement indéfini. `s.at(100)` lève `std::out_of_range`."
  - key: qcm-nombre-en-chaine
    format: multiple-choice
    question: Comment convertir l'entier 42 en `std::string` ?
    choices:
      - {text: "`std::to_string(42)`", correct: true}
      - {text: "`std::string(42)`", correct: false}
      - {text: "`static_cast<std::string>(42)`", correct: false}
      - {text: "`std::stoi(42)`", correct: false}
    answer: "`std::to_string(42)` donne `\"42\"`. `std::stoi` fait l'inverse, d'une chaîne vers un entier ; `std::format(\"{}\", 42)` convient aussi."
  - key: qcm-chaine-vide
    format: multiple-choice
    question: Quelle écriture teste le plus clairement qu'une chaîne est vide ?
    choices:
      - {text: "`s.empty()`", correct: true}
      - {text: "`s == 0`", correct: false}
      - {text: "`s.clear()`", correct: false}
      - {text: "`!s`", correct: false}
    answer: "`s.empty()` renvoie `true` pour une chaîne sans caractère. `clear()` la vide, il ne la teste pas ; `s == 0` et `!s` ne compilent pas."
  - key: qcm-passer-en-parametre
    format: multiple-choice
    question: Comment passe-t-on une `std::string` à une fonction qui ne fait que la lire ?
    choices:
      - {text: "Par `const std::string&`", correct: true}
      - {text: "Par `std::string`, par valeur", correct: false}
      - {text: "Par `std::string&`", correct: false}
      - {text: "Par `char`", correct: false}
    answer: "La référence constante évite de copier tous les caractères, et garantit que la chaîne ne sera pas modifiée."
  - key: qcm-dernier-caractere
    format: multiple-choice
    question: "Quelle expression donne le dernier caractère d'une chaîne `s` non vide ?"
    choices:
      - {text: "`s.back()`", correct: true}
      - {text: "`s[s.size()]`", correct: false}
      - {text: "`s.end()`", correct: false}
      - {text: "`s[-1]`", correct: false}
    answer: "`s.back()`, ou `s[s.size() - 1]`. Les indices vont de 0 à `size() - 1`, et un indice négatif n'a pas le sens qu'il a en Python."
  - key: trous-en-tete
    format: fill-in
    question: |-
      Complète avec l'en-tête qui déclare `std::string` :
      ```cpp
      #include <___>

      std::string prenom = "Ada";
      ```
    blanks:
      - [string]
    answer: "`std::string` est déclarée dans `<string>`."
  - key: trous-taille
    format: fill-in
    question: |-
      Complète pour afficher le nombre de caractères de `mot` :
      ```cpp
      std::string mot = "bonjour";
      std::println("{}", mot.___());
      ```
    blanks:
      - [size, length]
    answer: "`size()` et `length()` renvoient la même chose : la taille de la chaîne."
  - key: trous-ajouter
    format: fill-in
    question: |-
      Complète pour ajouter le nom de famille à la fin de `nom` :
      ```cpp
      std::string nom = "Ada";
      nom ___ " Lovelace";
      ```
    blanks:
      - ["+="]
    answer: "`+=` ajoute du texte à la fin de la chaîne."
  - key: trous-substr
    format: fill-in
    question: |-
      Complète pour extraire les trois premiers caractères :
      ```cpp
      std::string mot = "bonjour";
      std::string debut = mot.___(0, 3);   // "bon"
      ```
    blanks:
      - [substr]
    answer: "`substr(debut, longueur)` renvoie une nouvelle chaîne."
  - key: code-concatenation
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "Bon";
          s += "jour";
          std::println("{} {}", s, s.size());
      }
      ```
    choices:
      - {text: "`Bonjour 7`", correct: true}
      - {text: "`Bon jour 8`", correct: false}
      - {text: "`Bonjour 8`", correct: false}
      - {text: "`jour 4`", correct: false}
    answer: "`Bonjour 7` : `+=` ajoute à la fin, sans espace. `size()` compte les sept caractères ; le zéro final du C n'en fait pas partie."
    check:
      output: "Bonjour 7"
  - key: code-comparaison
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string a = "Zoo";
          std::string b = "abc";
          std::println("{} {}", a < b, a == "Zoo");
      }
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
    answer: "`true true` : `Z` a un code plus petit que `a`, donc `\"Zoo\"` passe avant `\"abc\"`. Et `==` compare le contenu, y compris avec un littéral."
    check:
      output: "true true"
  - key: code-substr-find
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "bonjour";
          std::println("{} {}", s.substr(3, 4), s.find("jour"));
      }
      ```
    choices:
      - {text: "`jour 3`", correct: true}
      - {text: "`njou 4`", correct: false}
      - {text: "`jour 4`", correct: false}
      - {text: "`onjo 3`", correct: false}
    answer: "`jour 3` : les positions partent de 0. `substr(3, 4)` prend quatre caractères à partir de la position 3, où `find` trouve justement `jour`."
    check:
      output: "jour 3"
  - key: code-at-hors-bornes
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string s = "abc";
          std::println("{}", s.at(1));
          std::println("{}", s.at(5));
      }
      ```
    choices:
      - {text: "`b`, puis une exception `std::out_of_range`", correct: true}
      - {text: "`a`, puis une exception `std::out_of_range`", correct: false}
      - {text: "`b`, puis une ligne vide", correct: false}
      - {text: "`b`, puis un caractère imprévisible", correct: false}
    answer: "`b`, puis `std::out_of_range` : `at` vérifie l'indice. 5 dépasse la taille, l'exception n'est rattrapée par personne, et le programme s'arrête."
    check:
      output: "b"
      throws: "std::out_of_range"
  - key: bug-deux-litteraux
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string salut = "Bon" + "jour";
          std::println("{}", salut);
      }
      ```
    choices:
      - {text: "Écrire `std::string(\"Bon\") + \"jour\"`", correct: true}
      - {text: "Écrire `\"Bon\" & \"jour\"`", correct: false}
      - {text: "Écrire `\"Bon\" . \"jour\"`", correct: false}
      - {text: "Écrire `'Bon' + 'jour'`", correct: false}
    answer: |-
      ```cpp
      std::string salut = std::string("Bon") + "jour";
      ```
      Deux littéraux sont des tableaux de caractères, que `+` ne sait pas concaténer. Il suffit que l'un des deux soit
      une `std::string`.
  - key: bug-litteral-plus-entier
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Total : 3`, et affiche `al : `. Pourquoi ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string message = "Total : " + 3;
          std::println("{}", message);
      }
      ```
    choices:
      - {text: "`+ 3` avance de trois caractères dans le littéral, au lieu de concaténer", correct: true}
      - {text: "`+ 3` retire les trois derniers caractères de la chaîne", correct: false}
      - {text: "`+ 3` est ignoré, car 3 n'est pas un texte", correct: false}
      - {text: "`+ 3` convertit le texte en nombre, puis ajoute 3", correct: false}
    answer: |-
      ```cpp
      std::string message = "Total : " + std::to_string(3);
      ```
      Le littéral est un pointeur vers ses caractères : lui ajouter 3 le décale de trois positions. Il faut convertir le
      nombre en chaîne ; avec un nombre plus grand que la longueur du texte, ce serait un comportement indéfini.
  - key: bug-find-non-teste
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::out_of_range` quand l'adresse n'a pas d'arobase. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string adresse = "ada.recallio.fr";
          std::size_t position = adresse.find("@");
          std::println("{}", adresse.substr(position));
      }
      ```
    choices:
      - {text: "Tester `position != std::string::npos` avant d'appeler `substr`", correct: true}
      - {text: "Tester `position != 0` avant d'appeler `substr`", correct: false}
      - {text: "Déclarer `position` avec le type `int`", correct: false}
      - {text: "Remplacer `substr(position)` par `substr(position + 1)`", correct: false}
    answer: |-
      ```cpp
      if (position != std::string::npos) {
          std::println("{}", adresse.substr(position));
      }
      ```
      Quand le texte est absent, `find` renvoie `npos`, une position énorme que `substr` refuse. On la teste avant de
      s'en servir.
  - key: bug-char-dans-string
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      int main() {
          std::string initiale = 'A';
          std::println("{}", initiale);
      }
      ```
    choices:
      - {text: "Écrire `\"A\"` entre guillemets", correct: true}
      - {text: "Écrire `A` sans rien autour", correct: false}
      - {text: "Écrire `'A' + 'A'`", correct: false}
      - {text: "Écrire `65`, le code du caractère", correct: false}
    answer: |-
      ```cpp
      std::string initiale = "A";
      ```
      `'A'` est un `char`, et une `std::string` ne s'initialise pas avec un seul caractère. Entre guillemets, c'est un
      texte ; `std::string(1, 'A')` convient aussi.
