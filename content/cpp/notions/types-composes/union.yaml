notion: union
lesson: |-
  Une `union` ressemble à une `struct`, mais tous ses membres occupent **le même emplacement mémoire**. Elle ne
  contient donc qu'**un seul** de ses membres à la fois.

  ```cpp
  union Valeur {
      int entier;
      double reel;
      char lettre;
  };
  ```

  **Sa taille** est celle de son **plus grand** membre (ici, celle d'un `double`), et non la somme. C'est sa raison
  d'être historique : économiser de la mémoire.

  **Le membre actif.** Écrire dans un membre le rend **actif**. On ne doit lire que **celui-là**.

  ```cpp
  Valeur v;
  v.entier = 42;       // entier est actif
  int n = v.entier;    // correct
  double d = v.reel;   // comportement indéfini : reel n'est pas le membre actif
  ```

  En C, lire un autre membre est une façon admise de réinterpréter les octets (*type punning*). **En C++, c'est un
  comportement indéfini.** Pour réinterpréter des octets, on utilise `std::bit_cast` (C++20) ou `std::memcpy`.

  **L'union ne sait pas ce qu'elle contient.** Rien n'enregistre le membre actif : c'est au programmeur de s'en
  souvenir. D'où l'**union étiquetée** : une `struct` qui range une énumération à côté de l'union.

  ```cpp
  struct Jeton {
      enum class Genre { Entier, Reel } genre;
      union {
          int entier;
          double reel;
      };                                   // union anonyme : ses membres s'écrivent jeton.entier
  };
  ```

  **Les membres à constructeur.** Une union peut contenir une `std::string` ou un `std::vector`, mais elle ne
  sait pas les construire ni les détruire toute seule : il faut le faire à la main, avec un placement `new` et un
  appel explicite du destructeur. C'est là que les erreurs se glissent.

  **`std::variant` à la place.** Depuis C++17, `std::variant<int, double, std::string>` est une union étiquetée
  toute faite : il **sait** quel type il contient, construit et détruit correctement, et refuse une lecture du
  mauvais type (`std::get` lance `std::bad_variant_access`).

  | | `union` | `std::variant` |
  |---|---|---|
  | Sait quel membre est actif | non | oui |
  | Lecture du mauvais membre | comportement indéfini | exception |
  | Membres à constructeur | gérés à la main | gérés automatiquement |
  | Taille | le plus grand membre | le plus grand membre, plus l'étiquette |

  **Quand on écrit encore une union.** Pour s'interfacer avec du C, pour décrire un format binaire ou un registre
  matériel, ou à l'intérieur d'une bibliothèque bas niveau.

  **En entretien** : « Une union superpose ses membres : elle a la taille du plus grand, et un seul est actif. Lire
  un membre inactif est un comportement indéfini en C++. Comme elle ne sait pas ce qu'elle contient, je prends
  `std::variant`, qui est une union étiquetée et sûre. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qui distingue une `union` d'une `struct` ?"
    choices:
      - {text: "Tous ses membres occupent le même emplacement : elle n'en contient qu'un à la fois", correct: true}
      - {text: "Tous ses membres sont publics, sans qu'on puisse les rendre privés", correct: false}
      - {text: "Tous ses membres doivent avoir exactement le même type", correct: false}
      - {text: "Tous ses membres sont alloués sur le tas, et non sur la pile", correct: false}
    answer: "Les membres d'une `struct` se suivent ; ceux d'une `union` se superposent. Écrire dans l'un écrase les autres."
  - key: taille
    format: course
    question: "Quelle est la taille d'une `union` ?"
    choices:
      - {text: "Celle de son plus grand membre", correct: true}
      - {text: "La somme des tailles de ses membres", correct: false}
      - {text: "Celle de son plus petit membre", correct: false}
      - {text: "Celle d'un pointeur", correct: false}
    answer: "Il faut assez de place pour le plus grand ; les autres tiennent dedans. L'alignement peut ajouter un peu de remplissage."
  - key: membre-actif
    format: course
    question: "Que dit le standard C++ de la lecture d'un membre d'union qui n'est pas le dernier écrit ?"
    choices:
      - {text: "C'est un comportement indéfini", correct: true}
      - {text: "Elle réinterprète les octets, comme en C", correct: false}
      - {text: "Elle lance une exception `std::bad_variant_access`", correct: false}
      - {text: "Elle renvoie toujours la valeur zéro", correct: false}
    answer: "Seul le membre actif peut être lu. Pour réinterpréter des octets, C++ offre `std::bit_cast` et `std::memcpy`."
  - key: variant
    format: course
    question: "Qu'apporte `std::variant` par rapport à une `union` ?"
    choices:
      - {text: "Il sait quel type il contient, et refuse la lecture d'un autre", correct: true}
      - {text: "Il contient tous ses types en même temps, comme une `struct`", correct: false}
      - {text: "Il occupe moins de mémoire qu'une `union` des mêmes types", correct: false}
      - {text: "Il n'accepte que des types fondamentaux", correct: false}
    answer: "C'est une union étiquetée : il range l'indice du type actif, construit et détruit les membres, et `std::get` lance une exception en cas d'erreur de type."
  - key: vf-deux-membres
    format: true-false
    question: "Une `union` peut contenir en même temps la valeur de deux de ses membres."
    truth: false
    answer: "Ils partagent les mêmes octets. Écrire dans l'un rend l'autre illisible."
  - key: vf-etiquette
    format: true-false
    question: "Une `union` enregistre elle-même quel membre a été écrit en dernier."
    truth: false
    answer: "Elle n'en garde aucune trace. C'est au programme de le noter, par exemple dans une énumération à côté."
  - key: vf-anonyme
    format: true-false
    question: "Les membres d'une union anonyme, déclarée dans une `struct`, s'utilisent comme des membres de la `struct`."
    truth: true
    answer: "On écrit `jeton.entier`, sans nom intermédiaire."
  - key: vf-type-punning
    format: true-false
    question: "En C++, écrire un `float` dans une union puis lire un `int` est la façon recommandée de voir ses bits."
    truth: false
    answer: "C'est un comportement indéfini. On écrit `std::bit_cast<std::uint32_t>(valeur)`."
  - key: qcm-bit-cast
    format: multiple-choice
    question: "Comment réinterprètes-tu les bits d'un `float` comme un entier de 32 bits, sans comportement indéfini ?"
    choices:
      - {text: "`std::bit_cast<std::uint32_t>(valeur)`", correct: true}
      - {text: "`static_cast<std::uint32_t>(valeur)`", correct: false}
      - {text: "Par une `union` dont on lit l'autre membre", correct: false}
      - {text: "`*reinterpret_cast<std::uint32_t*>(&valeur)`", correct: false}
    answer: "`std::bit_cast` (C++20) recopie les octets dans le nouveau type. `static_cast` convertirait la valeur ; l'union et le `reinterpret_cast` sont indéfinis."
  - key: qcm-sizeof
    format: multiple-choice
    question: "Que vaut `sizeof(U)` pour `union U { char c; int i; double d; };` sur une machine 64 bits courante ?"
    choices:
      - {text: "8", correct: true}
      - {text: "13", correct: false}
      - {text: "16", correct: false}
      - {text: "1", correct: false}
    answer: "La taille du plus grand membre, le `double`. Une `struct` des mêmes membres en occuperait 16."
  - key: qcm-etiquetee
    format: multiple-choice
    question: "Qu'appelle-t-on une union étiquetée ?"
    choices:
      - {text: "Une union accompagnée d'une valeur qui dit quel membre est actif", correct: true}
      - {text: "Une union dont chaque membre porte un commentaire", correct: false}
      - {text: "Une union déclarée avec le mot-clé `enum`", correct: false}
      - {text: "Une union dont les membres sont triés par taille", correct: false}
    answer: "L'étiquette, souvent une énumération, permet de savoir quel membre lire. `std::variant` en est la version standard."
  - key: qcm-usage
    format: multiple-choice
    question: "Dans quel cas écrit-on encore une `union` en C++ moderne ?"
    choices:
      - {text: "Pour s'interfacer avec une bibliothèque C qui en expose une", correct: true}
      - {text: "Pour ranger une valeur qui peut être un entier ou une chaîne", correct: false}
      - {text: "Pour renvoyer deux résultats depuis une fonction", correct: false}
      - {text: "Pour rendre les membres d'une classe privés", correct: false}
    answer: "Les interfaces C, les formats binaires et le code bas niveau. Pour « un type parmi plusieurs », `std::variant` ; pour deux résultats, une `struct`."
  - key: code-taille
    format: code-output
    question: |-
      ```cpp
      #include <print>

      union Valeur {
          char lettre;
          int entier;
          double reel;
      };

      struct Trio {
          char lettre;
          int entier;
          double reel;
      };

      int main() {
          std::println("{} {}", sizeof(Valeur), sizeof(Trio));
      }
      ```
    choices:
      - {text: "`8 16`", correct: true}
      - {text: "`13 13`", correct: false}
      - {text: "`8 13`", correct: false}
      - {text: "`16 16`", correct: false}
    answer: "`8 16` : l'union a la taille de son plus grand membre. La `struct` range les trois à la suite, avec du remplissage pour l'alignement."
    check:
      output: "8 16"
  - key: code-membre-actif
    format: code-output
    question: |-
      ```cpp
      #include <print>

      union Valeur {
          int entier;
          double reel;
      };

      int main() {
          Valeur v;
          v.entier = 7;
          const int lu = v.entier;
          v.reel = 2.5;
          std::println("{} {}", lu, v.reel);
      }
      ```
    choices:
      - {text: "`7 2.5`", correct: true}
      - {text: "`7 7`", correct: false}
      - {text: "`2 2.5`", correct: false}
      - {text: "`0 2.5`", correct: false}
    answer: "`7 2.5` : chaque lecture porte sur le membre qui vient d'être écrit. Après `v.reel = 2.5`, c'est `reel` qui est actif."
    check:
      output: "7 2.5"
  - key: code-etiquetee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Jeton {
          enum class Genre { Entier, Reel } genre;
          union {
              int entier;
              double reel;
          };
      };

      void afficher(const Jeton& jeton) {
          if (jeton.genre == Jeton::Genre::Entier) {
              std::print("{} ", jeton.entier);
          } else {
              std::print("{} ", jeton.reel);
          }
      }

      int main() {
          Jeton a{Jeton::Genre::Entier, {.entier = 3}};
          Jeton b{Jeton::Genre::Reel, {.reel = 1.5}};
          afficher(a);
          afficher(b);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`3 1.5 fin`", correct: true}
      - {text: "`3 3 fin`", correct: false}
      - {text: "`1.5 1.5 fin`", correct: false}
      - {text: "`0 1.5 fin`", correct: false}
    answer: "`3 1.5 fin` : l'étiquette `genre` dit quel membre lire. Chaque jeton est lu par son membre actif."
    check:
      output: "3 1.5 fin"
  - key: code-bit-cast
    format: code-output
    question: |-
      ```cpp
      #include <bit>
      #include <cstdint>
      #include <print>

      int main() {
          const float un = 1.0f;
          const auto bits = std::bit_cast<std::uint32_t>(un);
          std::println("{:#x} {}", bits, std::bit_cast<float>(bits));
      }
      ```
    choices:
      - {text: "`0x3f800000 1`", correct: true}
      - {text: "`0x1 1`", correct: false}
      - {text: "`0x3f800000 0`", correct: false}
      - {text: "`0x0 1`", correct: false}
    answer: "`0x3f800000 1` : `std::bit_cast` montre la représentation du `float` 1.0, puis la reconvertit. C'est la façon définie de faire ce qu'on demandait autrefois à une union."
    check:
      output: "0x3f800000 1"
  - key: bug-lecture-inactive
    format: bug-fix
    question: |-
      Ce programme écrit un `float` dans une union, puis lit l'entier pour voir ses bits. C'est un comportement
      indéfini en C++. Quelle correction est la bonne ?
      ```cpp
      #include <cstdint>
      #include <print>

      union Bits {
          float reel;
          std::uint32_t entier;
      };

      int main() {
          Bits b;
          b.reel = 1.0f;
          std::println("{:#x}", b.entier);
      }
      ```
    choices:
      - {text: "Écrire `std::bit_cast<std::uint32_t>(1.0f)`, sans union", correct: true}
      - {text: "Écrire `static_cast<std::uint32_t>(1.0f)`, sans union", correct: false}
      - {text: "Déclarer `entier` avant `reel` dans l'union", correct: false}
      - {text: "Déclarer l'union avec le mot-clé `struct`", correct: false}
    answer: |-
      ```cpp
      std::println("{:#x}", std::bit_cast<std::uint32_t>(1.0f));
      ```
      Lire un membre inactif n'est pas permis en C++. `std::bit_cast` (en-tête `<bit>`) réinterprète les octets
      légalement. `static_cast` convertirait la valeur en 1.
  - key: bug-mauvais-membre
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2.5`. Il lit le mauvais membre de l'union, et affiche un entier sans rapport.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Jeton {
          bool est_reel;
          union {
              int entier;
              double reel;
          };
      };

      int main() {
          Jeton jeton{true, {.reel = 2.5}};
          if (jeton.est_reel) {
              std::println("{}", jeton.entier);
          }
      }
      ```
    choices:
      - {text: "Afficher `jeton.reel` quand `est_reel` est vrai", correct: true}
      - {text: "Afficher `static_cast<double>(jeton.entier)`", correct: false}
      - {text: "Initialiser le jeton avec `{.entier = 2.5}`", correct: false}
      - {text: "Déclarer `est_reel` avec le type `int`", correct: false}
    answer: |-
      ```cpp
      if (jeton.est_reel) {
          std::println("{}", jeton.reel);
      }
      ```
      L'étiquette dit que le membre actif est `reel` : c'est lui qu'il faut lire. `std::variant` rendrait cette
      faute impossible à compiler ou la signalerait par une exception.
  - key: bug-string-dans-union
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function 'Valeur::Valeur()' » : il ne sait pas construire une union
      qui contient une `std::string`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      union Valeur {
          int entier;
          std::string texte;
      };

      int main() {
          Valeur v;
          v.entier = 3;
          std::println("{}", v.entier);
      }
      ```
    choices:
      - {text: "Utiliser `std::variant<int, std::string>`", correct: true}
      - {text: "Déclarer `texte` avant `entier` dans l'union", correct: false}
      - {text: "Déclarer `texte` avec le type `std::string&`", correct: false}
      - {text: "Écrire `Valeur v{};` avec des accolades", correct: false}
    answer: |-
      ```cpp
      std::variant<int, std::string> v = 3;
      std::println("{}", std::get<int>(v));
      ```
      Une union ne sait ni construire ni détruire un membre à constructeur : il faudrait tout écrire à la main.
      `std::variant` le fait.
  - key: bug-struct-attendue
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3 4`. Il affiche `4 4`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      union Point {
          int x;
          int y;
      };

      int main() {
          Point p;
          p.x = 3;
          p.y = 4;
          std::println("{} {}", p.y, p.y);
      }
      ```
    choices:
      - {text: "Déclarer `struct Point`, et afficher `p.x` puis `p.y`", correct: true}
      - {text: "Écrire `p.y = 4;` avant `p.x = 3;`", correct: false}
      - {text: "Déclarer `x` et `y` avec le type `long`", correct: false}
      - {text: "Déclarer `union Point` avec le mot-clé `static`", correct: false}
    answer: |-
      ```cpp
      struct Point {
          int x;
          int y;
      };
      ```
      Dans une union, `x` et `y` partagent les mêmes octets : écrire `y` efface `x`. Deux coordonnées doivent
      exister ensemble : c'est une `struct`.
