notion: std-span
lesson: |-
  `std::span<T>` (C++20, en-tête `<span>`) est une **vue** sur une suite d'éléments **contigus** : un pointeur vers
  le premier, et un nombre d'éléments. Il ne possède rien et ne copie rien. C'est à un tableau ce que
  `std::string_view` est à une chaîne.

  **À quoi il sert : les paramètres.** Une fonction qui prend un `std::span` accepte un `std::vector`, un
  `std::array`, un tableau C, ou un morceau de l'un d'eux, sans surcharge ni template.

  ```cpp
  int somme(std::span<const int> valeurs) {
      int total = 0;
      for (int v : valeurs) {
          total += v;
      }
      return total;
  }

  std::vector<int> v{1, 2, 3};
  std::array<int, 2> a{4, 5};
  int t[] = {6, 7, 8};
  somme(v);  somme(a);  somme(t);
  ```

  Il remplace le couple `(const int* donnees, std::size_t taille)`, où la taille pouvait être fausse.

  **Lire ou modifier.**

  | Type | Ce qu'il permet |
  |---|---|
  | `std::span<const int>` | lire les éléments |
  | `std::span<int>` | lire et **modifier** les éléments de l'original |

  Un span ne peut ni ajouter ni retirer d'élément : il ne possède pas le conteneur.

  **Ce qu'il offre.** `size()`, `empty()`, `operator[]`, `front()`, `back()`, `begin()` et `end()`, donc la boucle
  sur un intervalle et les algorithmes. Et des **sous-vues**, sans copie :

  ```cpp
  valeurs.first(2)        // les deux premiers
  valeurs.last(2)         // les deux derniers
  valeurs.subspan(1, 3)   // trois éléments à partir de l'indice 1
  ```

  **On le passe par valeur** : il tient en deux mots machine.

  **Les pièges.**

  - **La vue pendante** : un span ne prolonge pas la vie de ce qu'il regarde. Renvoyer un span vers un vecteur
    local, ou le garder pendant que le vecteur **réalloue** (`push_back`), le laisse pendant.
  - **Aucune vérification** : `operator[]`, `first`, `subspan` hors bornes sont des comportements indéfinis.
  - **Contigu seulement** : pas de span sur une `std::list` ou une `std::map`.

  **La taille fixe.** `std::span<int, 3>` porte sa taille dans son type : il n'accepte que trois éléments
  exactement, et ne stocke que le pointeur.

  **En entretien** : « `std::span` est une vue non possédante sur des éléments contigus : un pointeur et une
  taille. Je l'utilise en paramètre pour accepter vecteur, `std::array` et tableau C sans copie, à la place du
  couple pointeur et taille. Comme toute vue, il ne doit pas survivre à ses données. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un `std::span<int>` ?"
    choices:
      - {text: "Une vue sur des entiers contigus : un pointeur et une taille, sans possession", correct: true}
      - {text: "Un tableau d'entiers qui grandit, et possède sa mémoire sur le tas", correct: false}
      - {text: "Une copie des entiers d'un conteneur, faite à la construction", correct: false}
      - {text: "Un itérateur qui parcourt les entiers d'une liste chaînée", correct: false}
    answer: "Le span regarde des éléments qui appartiennent à un autre. Le créer ou le copier ne copie aucun élément."
  - key: usage
    format: course
    question: "Pourquoi prendre un `std::span<const int>` en paramètre plutôt qu'un `const std::vector<int>&` ?"
    choices:
      - {text: "La fonction accepte aussi un `std::array`, un tableau C, ou une partie de conteneur", correct: true}
      - {text: "La fonction peut alors ajouter des éléments au conteneur de l'appelant", correct: false}
      - {text: "La fonction reçoit une copie, et ne risque plus de modifier l'original", correct: false}
      - {text: "La fonction vérifie alors automatiquement chaque indice utilisé", correct: false}
    answer: "Le span ne demande qu'une chose : des éléments contigus. La fonction n'impose plus le type du conteneur à ses appelants."
  - key: const
    format: course
    question: "Quelle différence entre `std::span<int>` et `std::span<const int>` ?"
    choices:
      - {text: "Le premier permet de modifier les éléments regardés ; le second seulement de les lire", correct: true}
      - {text: "Le premier possède ses éléments ; le second ne fait que les regarder", correct: false}
      - {text: "Le premier a une taille variable ; le second une taille fixée à la compilation", correct: false}
      - {text: "Le premier copie les éléments ; le second garde une référence vers eux", correct: false}
    answer: "Aucun des deux ne possède ni ne copie. Le `const` porte sur les éléments : pour un paramètre en lecture, on écrit `std::span<const int>`."
  - key: pendante
    format: course
    question: "Quel est le danger principal d'un `std::span` ?"
    choices:
      - {text: "Il peut survivre aux données qu'il regarde, et devenir pendant", correct: true}
      - {text: "Il copie les données à chaque passage en paramètre", correct: false}
      - {text: "Il libère les données quand il est détruit", correct: false}
      - {text: "Il empêche le conteneur d'origine d'être modifié", correct: false}
    answer: "Une vue ne prolonge la vie de rien. Si le vecteur est détruit, ou réalloue, le span désigne de la mémoire libérée."
  - key: vf-possession
    format: true-false
    question: "Un `std::span` possède les éléments qu'il désigne."
    truth: false
    answer: "Il ne fait que les regarder. Sa destruction ne libère rien."
  - key: vf-list
    format: true-false
    question: "On peut construire un `std::span` sur une `std::list`."
    truth: false
    answer: "Un span exige des éléments contigus en mémoire : `std::vector`, `std::array`, tableau C, `std::string`."
  - key: vf-par-valeur
    format: true-false
    question: "Un `std::span` se passe par valeur."
    truth: true
    answer: "Il contient un pointeur et une taille : le copier est immédiat."
  - key: vf-push-back
    format: true-false
    question: "Un `std::span<int>` permet d'ajouter un élément au vecteur qu'il regarde."
    truth: false
    answer: "Il peut modifier les éléments existants, pas en changer le nombre : il n'a pas accès au conteneur."
  - key: qcm-premiers
    format: multiple-choice
    question: "`s` est un `std::span<int>`. Quelle expression donne une vue sur ses trois premiers éléments ?"
    choices:
      - {text: "`s.first(3)`", correct: true}
      - {text: "`s.front(3)`", correct: false}
      - {text: "`s.begin(3)`", correct: false}
      - {text: "`s.resize(3)`", correct: false}
    answer: "`first(n)` renvoie un span sur les `n` premiers éléments, sans copie. `front()` renvoie le premier élément, sans argument."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::span` ?"
    choices:
      - {text: "`<span>`", correct: true}
      - {text: "`<vector>`", correct: false}
      - {text: "`<array>`", correct: false}
      - {text: "`<ranges>`", correct: false}
    answer: "`<span>`, depuis C++20."
  - key: qcm-subspan
    format: multiple-choice
    question: "`s` regarde les éléments 10, 20, 30, 40, 50. Que regarde `s.subspan(1, 3)` ?"
    choices:
      - {text: "20, 30, 40", correct: true}
      - {text: "20, 30", correct: false}
      - {text: "10, 20, 30", correct: false}
      - {text: "20, 30, 40, 50", correct: false}
    answer: "`subspan(debut, nombre)` : trois éléments à partir de l'indice 1."
  - key: qcm-remplace
    format: multiple-choice
    question: "Quelle paire de paramètres `std::span<const int>` remplace-t-il ?"
    choices:
      - {text: "`const int* donnees, std::size_t taille`", correct: true}
      - {text: "`const int& premier, const int& dernier`", correct: false}
      - {text: "`int debut, int fin`", correct: false}
      - {text: "`std::vector<int> copie, bool tri`", correct: false}
    answer: "Le span réunit le pointeur et la taille : l'appelant ne peut plus se tromper de taille."
  - key: trous-span
    format: fill-in
    question: |-
      Complète pour que la fonction accepte un vecteur, un `std::array` ou un tableau C :
      ```cpp
      int somme(std::___<const int> valeurs);
      ```
    blanks:
      - [span]
    answer: "`std::span<const int>` : une vue en lecture sur des entiers contigus."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que la fonction ne puisse pas modifier les éléments :
      ```cpp
      void afficher(std::span<___ int> valeurs);
      ```
    blanks:
      - [const]
    answer: "`std::span<const int>` ne donne qu'un accès en lecture."
  - key: trous-first
    format: fill-in
    question: |-
      Complète pour obtenir une vue sur les deux premiers éléments :
      ```cpp
      auto debut = valeurs.___(2);
      ```
    blanks:
      - [first]
    answer: "`first(2)` renvoie un span sur les deux premiers éléments."
  - key: trous-size
    format: fill-in
    question: |-
      Complète pour afficher le nombre d'éléments de la vue :
      ```cpp
      void afficher(std::span<const int> valeurs) {
          std::println("{}", valeurs.___());
      }
      ```
    blanks:
      - [size]
    answer: "Un span connaît sa taille : `size()`."
  - key: code-sources
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>
      #include <span>
      #include <vector>

      int somme(std::span<const int> valeurs) {
          int total = 0;
          for (int v : valeurs) {
              total += v;
          }
          return total;
      }

      int main() {
          const std::vector<int> v{1, 2, 3};
          const std::array<int, 2> a{10, 20};
          const int t[] = {100};
          std::println("{} {} {}", somme(v), somme(a), somme(t));
      }
      ```
    choices:
      - {text: "`6 30 100`", correct: true}
      - {text: "`6 30 1`", correct: false}
      - {text: "`3 2 1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`6 30 100` : le span se construit depuis un vecteur, un `std::array` ou un tableau C. La même fonction sert aux trois."
    check:
      output: "6 30 100"
  - key: code-modification
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      void doubler(std::span<int> valeurs) {
          for (int& v : valeurs) {
              v *= 2;
          }
      }

      int main() {
          std::vector<int> v{1, 2, 3};
          doubler(v);
          std::println("{} {} {}", v[0], v[1], v[2]);
      }
      ```
    choices:
      - {text: "`2 4 6`", correct: true}
      - {text: "`1 2 3`", correct: false}
      - {text: "`2 2 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 4 6` : un `std::span<int>` donne accès aux éléments du vecteur eux-mêmes. Passé par valeur, il ne copie que le pointeur et la taille."
    check:
      output: "2 4 6"
  - key: code-sous-vues
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      int main() {
          const std::vector<int> v{10, 20, 30, 40, 50};
          const std::span<const int> s{v};
          std::println("{} {} {}", s.first(2).back(), s.last(2).front(), s.subspan(1, 3).size());
      }
      ```
    choices:
      - {text: "`20 40 3`", correct: true}
      - {text: "`10 50 3`", correct: false}
      - {text: "`20 40 2`", correct: false}
      - {text: "`20 50 4`", correct: false}
    answer: "`20 40 3` : `first(2)` regarde 10, 20 ; `last(2)` regarde 40, 50 ; `subspan(1, 3)` regarde trois éléments."
    check:
      output: "20 40 3"
  - key: code-sous-vue-modifie
    format: code-output
    question: |-
      ```cpp
      #include <array>
      #include <print>
      #include <span>

      int main() {
          std::array<int, 4> a{1, 2, 3, 4};
          std::span<int> milieu = std::span<int>{a}.subspan(1, 2);
          milieu[0] = 9;
          std::println("{} {} {}", a[1], milieu.size(), a.size());
      }
      ```
    choices:
      - {text: "`9 2 4`", correct: true}
      - {text: "`2 2 4`", correct: false}
      - {text: "`9 2 2`", correct: false}
      - {text: "`9 4 4`", correct: false}
    answer: "`9 2 4` : la sous-vue regarde les éléments d'indices 1 et 2 du tableau. Écrire dans `milieu[0]` modifie `a[1]` ; le tableau garde ses quatre éléments."
    check:
      output: "9 2 4"
  - key: bug-span-pendant
    format: bug-fix
    question: |-
      Cette fonction renvoie une vue sur un vecteur local. Le programme devrait afficher `1` ; son comportement est
      indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      std::span<const int> creer() {
          std::vector<int> v{1, 2, 3};
          return v;
      }

      int main() {
          std::println("{}", creer()[0]);
      }
      ```
    choices:
      - {text: "Renvoyer le `std::vector<int>` par valeur", correct: true}
      - {text: "Renvoyer un `std::span<int>`, sans `const`", correct: false}
      - {text: "Renvoyer `v.data()` à la place de `v`", correct: false}
      - {text: "Renvoyer `std::span{v}.first(3)`", correct: false}
    answer: |-
      ```cpp
      std::vector<int> creer() {
          return {1, 2, 3};
      }
      ```
      Le vecteur est détruit au retour : le span désigne de la mémoire libérée. Une vue ne se renvoie que si les
      données lui survivent ; sinon, on renvoie le propriétaire.
  - key: bug-reallocation
    format: bug-fix
    question: |-
      Ce programme garde une vue sur un vecteur, puis lui ajoute des éléments. Lire la vue ensuite est un
      comportement indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      int main() {
          std::vector<int> v{1, 2, 3};
          std::span<const int> vue{v};
          for (int i = 0; i < 100; ++i) {
              v.push_back(i);
          }
          std::println("{}", vue[0]);
      }
      ```
    choices:
      - {text: "Créer la vue après la boucle d'ajouts", correct: true}
      - {text: "Déclarer la vue avec `std::span<int>`", correct: false}
      - {text: "Écrire `vue.front()` à la place de `vue[0]`", correct: false}
      - {text: "Passer la vue par référence constante", correct: false}
    answer: |-
      ```cpp
      for (int i = 0; i < 100; ++i) {
          v.push_back(i);
      }
      std::span<const int> vue{v};
      ```
      Les `push_back` réallouent : la vue garde l'adresse de l'ancien bloc, libéré. Un span est invalidé comme un
      pointeur ou un itérateur.
  - key: bug-hors-bornes
    format: bug-fix
    question: |-
      Cette fonction demande les trois premiers éléments d'une vue qui n'en a que deux : comportement indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      int somme_debut(std::span<const int> valeurs) {
          int total = 0;
          for (int v : valeurs.first(3)) {
              total += v;
          }
          return total;
      }

      int main() {
          const std::vector<int> v{4, 5};
          std::println("{}", somme_debut(v));
      }
      ```
    choices:
      - {text: "Demander `valeurs.first(std::min<std::size_t>(3, valeurs.size()))`", correct: true}
      - {text: "Demander `valeurs.last(3)` à la place de `valeurs.first(3)`", correct: false}
      - {text: "Demander `valeurs.subspan(0, 3)` à la place de `valeurs.first(3)`", correct: false}
      - {text: "Recevoir `std::span<int>` à la place de `std::span<const int>`", correct: false}
    answer: |-
      ```cpp
      for (int v : valeurs.first(std::min<std::size_t>(3, valeurs.size()))) {
      ```
      `first(n)` ne vérifie pas que la vue a `n` éléments. On borne la demande par `size()`. `last(3)` et
      `subspan(0, 3)` débordent de la même façon.
  - key: bug-const-modifie
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of read-only location ». La fonction doit remettre les éléments à zéro.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <span>
      #include <vector>

      void effacer(std::span<const int> valeurs) {
          for (std::size_t i = 0; i < valeurs.size(); ++i) {
              valeurs[i] = 0;
          }
      }

      int main() {
          std::vector<int> v{1, 2, 3};
          effacer(v);
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Recevoir `std::span<int> valeurs`", correct: true}
      - {text: "Recevoir `const std::span<const int>& valeurs`", correct: false}
      - {text: "Recevoir `std::span<const int>* valeurs`", correct: false}
      - {text: "Écrire `valeurs.at(i) = 0;` dans la boucle", correct: false}
    answer: |-
      ```cpp
      void effacer(std::span<int> valeurs) {
      ```
      `std::span<const int>` ne donne qu'un accès en lecture. Pour modifier les éléments de l'appelant, le type des
      éléments ne doit pas être `const`.
