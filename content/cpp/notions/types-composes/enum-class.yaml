notion: enum-class
lesson: |-
  Une **énumération** est un type dont les valeurs possibles sont une liste de **noms**. En C++ moderne, on l'écrit
  avec **`enum class`** :

  ```cpp
  enum class Couleur { rouge, vert, bleu };

  Couleur c = Couleur::vert;      // le nom du type, puis ::
  if (c == Couleur::vert) { ... }
  ```

  **Ce qu'apporte `class`.**

  - Les valeurs sont **rangées dans le type** : on écrit `Couleur::rouge`, jamais `rouge` seul. Deux énumérations
    peuvent donc avoir une valeur du même nom.
  - **Aucune conversion implicite** vers un entier : `int n = Couleur::rouge;` ne compile pas, et on ne compare pas
    une `Couleur` à un `int`, ni à une autre énumération. Le compilateur attrape ces confusions.

  **Les valeurs entières.** Chaque nom a une valeur : 0 pour le premier, puis 1, 2... On peut en imposer
  (`ok = 200`), et les suivantes continuent à partir de là. Pour l'obtenir, la conversion est **explicite** :
  `static_cast<int>(c)`, ou `std::to_underlying(c)` depuis C++23.

  **Le type sous-jacent** est `int` par défaut. On le choisit avec deux-points :
  `enum class Niveau : std::uint8_t { bas, moyen, haut };`.

  **Avec `switch`.** Une énumération et un `switch` vont ensemble : un `case` par valeur. Si l'on n'écrit **pas de
  `default`**, `-Wall` signale toute valeur oubliée (`-Wswitch`) : ajouter une valeur à l'énumération montre aussitôt
  les `switch` à compléter.

  **Afficher.** `std::println("{}", c)` ne compile pas : une énumération n'a pas de mise en forme. On affiche sa
  valeur entière, ou un texte renvoyé par une fonction.

  L'ancien `enum`, sans `class`, laisse fuir ses noms dans la portée englobante et se convertit en entier sans rien
  dire : on l'évite.

  **En entretien** : « `enum class` plutôt que `enum` : les noms restent dans le type, et il n'y a pas de conversion
  implicite vers `int`. Dans un `switch`, je n'écris pas de `default`, pour que le compilateur me signale une valeur
  oubliée. »
tour:
  - title: "enum class : une liste de valeurs nommées"
    text: |-
      Une énumération est un type qui ne peut prendre que quelques valeurs, que tu nommes : les couleurs d'un feu, les
      états d'une commande.

      Avec `enum class`, chaque valeur s'écrit avec le nom du type : `Feu::rouge`. Elle ne se confond ni avec un
      entier, ni avec la valeur d'une autre énumération.

      Un `switch` traite chaque cas.

      Essaie : remplace `Feu::orange` par `Feu::vert` dans `main`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          enum class Feu { rouge, orange, vert };

          const char* consigne(Feu feu) {
              switch (feu) {
                  case Feu::rouge:
                      return "arrête-toi";
                  case Feu::orange:
                      return "ralentis";
                  case Feu::vert:
                      return "passe";
              }
              return "feu inconnu";
          }

          int main() {
              Feu feu = Feu::orange;
              std::println("{}", consigne(feu));
              std::println("valeur entière : {}", static_cast<int>(feu));
          }
      output: |-
        ralentis
        valeur entière : 1
cards:
  - key: noms-dans-le-type
    format: course
    question: "Avec `enum class Couleur { rouge, vert, bleu };`, comment désigne-t-on la valeur rouge ?"
    choices:
      - {text: "`Couleur::rouge` : le nom est rangé dans le type", correct: true}
      - {text: "`rouge` : le nom est visible partout", correct: false}
      - {text: "`Couleur.rouge` : comme le membre d'un objet", correct: false}
      - {text: "`Couleur[0]` : comme l'élément d'un tableau", correct: false}
    answer: "Les valeurs d'une `enum class` appartiennent à la portée du type. `rouge` seul est inconnu, ce qui permet à deux énumérations d'avoir une valeur du même nom."
  - key: pas-de-conversion-implicite
    format: course
    question: "Pourquoi `int n = Couleur::rouge;` ne compile-t-il pas avec une `enum class` ?"
    choices:
      - {text: "Une `enum class` ne se convertit pas implicitement en entier", correct: true}
      - {text: "Une `enum class` n'a pas de valeur entière du tout", correct: false}
      - {text: "La valeur `rouge` ne tient pas dans un `int`", correct: false}
      - {text: "Il faut écrire `Couleur.rouge` avec un point", correct: false}
    answer: "Chaque valeur a bien un entier derrière elle, mais la conversion doit être demandée : `static_cast<int>(Couleur::rouge)`. Le compilateur empêche ainsi de confondre une couleur et un nombre."
  - key: valeurs-entieres
    format: course
    question: "Quelles valeurs entières ont `bas`, `moyen` et `haut` dans `enum class Niveau { bas, moyen, haut };` ?"
    choices:
      - {text: "0, 1 et 2", correct: true}
      - {text: "1, 2 et 3", correct: false}
      - {text: "Des valeurs choisies par le compilateur", correct: false}
      - {text: "Aucune : ce sont des noms sans valeur", correct: false}
    answer: "La première vaut 0, et chaque suivante un de plus. On peut imposer une valeur (`moyen = 10`) : la suivante continue à partir d'elle."
  - key: switch-sans-default
    format: course
    question: "Pourquoi évite-t-on `default` dans un `switch` sur une énumération ?"
    choices:
      - {text: "Sans lui, le compilateur signale les valeurs oubliées", correct: true}
      - {text: "Avec lui, le `switch` ne compile pas sur une énumération", correct: false}
      - {text: "Avec lui, le `switch` est plus lent à l'exécution", correct: false}
      - {text: "Sans lui, le `switch` traite d'office toutes les valeurs", correct: false}
    answer: "`-Wall` avertit quand un `case` manque (`-Wswitch`), à condition qu'il n'y ait pas de `default` pour l'absorber. Ajouter une valeur à l'énumération fait alors apparaître tous les `switch` à compléter."
  - key: vf-comparaison-entier
    format: true-false
    question: "On peut comparer une valeur d'`enum class` à un `int` avec `==`."
    truth: false
    answer: "Il n'y a pas de conversion implicite : la comparaison ne compile pas. On compare à une valeur de la même énumération."
  - key: vf-meme-nom
    format: true-false
    question: "Deux `enum class` différentes peuvent avoir chacune une valeur nommée `inconnu`."
    truth: true
    answer: "Les noms sont rangés dans leur type : `Etat::inconnu` et `Format::inconnu` ne se gênent pas."
  - key: vf-type-sous-jacent
    format: true-false
    question: "Le type sous-jacent d'une `enum class` est toujours `int`."
    truth: false
    answer: "C'est `int` par défaut, mais on le choisit : `enum class Niveau : std::uint8_t { ... };`."
  - key: vf-println
    format: true-false
    question: "`std::println(\"{}\", Couleur::rouge)` affiche `rouge`."
    truth: false
    answer: "Le code ne compile pas : une énumération n'a pas de mise en forme. On affiche sa valeur entière, ou un texte fourni par une fonction."
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration définit une énumération dont les noms restent dans le type ?
    choices:
      - {text: "`enum class Etat { ouvert, ferme };`", correct: true}
      - {text: "`enum Etat { ouvert, ferme };`", correct: false}
      - {text: "`class enum Etat { ouvert, ferme };`", correct: false}
      - {text: "`enum class Etat = { ouvert, ferme };`", correct: false}
    answer: "`enum class`, dans cet ordre, puis le nom et la liste entre accolades. `enum` seul définit l'ancienne énumération, dont les noms fuient."
  - key: qcm-valeur-entiere
    format: multiple-choice
    question: "Comment obtenir la valeur entière de `Couleur::bleu` ?"
    choices:
      - {text: "`static_cast<int>(Couleur::bleu)`", correct: true}
      - {text: "`int(Couleur)::bleu`", correct: false}
      - {text: "`Couleur::bleu.value`", correct: false}
      - {text: "`Couleur::bleu + 0`", correct: false}
    answer: "Par une conversion explicite. Depuis C++23, `std::to_underlying(Couleur::bleu)` fait la même chose sans répéter le type."
  - key: qcm-valeurs-imposees
    format: multiple-choice
    question: "Que vaut `cree` dans `enum class Code { ok = 200, cree, introuvable = 404 };` ?"
    choices:
      - {text: "201", correct: true}
      - {text: "1", correct: false}
      - {text: "200", correct: false}
      - {text: "403", correct: false}
    answer: "201 : une valeur sans `=` vaut la précédente plus un."
  - key: qcm-ancien-enum
    format: multiple-choice
    question: "Que reproche-t-on à l'ancien `enum`, écrit sans `class` ?"
    choices:
      - {text: "Ses noms fuient dans la portée englobante, et il se convertit en entier sans rien dire", correct: true}
      - {text: "Ses valeurs sont calculées à l'exécution, ce qui ralentit le programme", correct: false}
      - {text: "Ses valeurs ne peuvent pas servir dans les `case` d'un `switch`", correct: false}
      - {text: "Ses noms doivent être écrits en majuscules, sans quoi il ne compile pas", correct: false}
    answer: "Avec `enum Couleur { rouge };`, `rouge` est visible partout et peut entrer en collision ; et `int n = rouge;` compile, comme la comparaison de deux énumérations sans rapport."
  - key: trous-class
    format: fill-in
    question: |-
      Complète pour que les valeurs restent rangées dans le type :
      ```cpp
      enum ___ Couleur { rouge, vert, bleu };
      ```
    blanks:
      - [class, struct]
    answer: "`enum class` : les valeurs s'écrivent `Couleur::rouge`."
  - key: trous-portee
    format: fill-in
    question: |-
      Complète pour désigner la valeur `vert` :
      ```cpp
      enum class Couleur { rouge, vert, bleu };

      Couleur c = Couleur___vert;
      ```
    blanks:
      - ["::"]
    answer: "`Couleur::vert` : l'opérateur de portée, après le nom du type."
  - key: trous-conversion
    format: fill-in
    question: |-
      Complète pour afficher la valeur entière :
      ```cpp
      std::println("{}", static_cast<___>(Couleur::bleu));
      ```
    blanks:
      - [int]
    answer: "`static_cast<int>(Couleur::bleu)` donne 2."
  - key: trous-type-sous-jacent
    format: fill-in
    question: |-
      Complète pour que l'énumération tienne dans un octet :
      ```cpp
      enum class Niveau ___ std::uint8_t { bas, moyen, haut };
      ```
    blanks:
      - [":"]
    answer: "Le type sous-jacent s'écrit après deux-points."
  - key: code-valeur-entiere
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum class Jour { lundi, mardi, mercredi };

      int main() {
          std::println("{} {}", static_cast<int>(Jour::lundi), static_cast<int>(Jour::mercredi));
      }
      ```
    choices:
      - {text: "`0 2`", correct: true}
      - {text: "`1 3`", correct: false}
      - {text: "`lundi mercredi`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0 2` : la première valeur vaut 0, les suivantes un de plus à chaque fois."
    check:
      output: "0 2"
  - key: code-valeurs-imposees
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum class Code { ok = 200, cree, introuvable = 404 };

      int main() {
          std::println("{} {}", static_cast<int>(Code::cree), static_cast<int>(Code::introuvable));
      }
      ```
    choices:
      - {text: "`201 404`", correct: true}
      - {text: "`1 404`", correct: false}
      - {text: "`200 404`", correct: false}
      - {text: "`201 202`", correct: false}
    answer: "`201 404` : `cree` continue après 200, et `introuvable` a sa valeur imposée."
    check:
      output: "201 404"
  - key: code-switch
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum class Couleur { rouge, vert, bleu };

      const char* nom(Couleur couleur) {
          switch (couleur) {
              case Couleur::rouge:
                  return "rouge";
              case Couleur::vert:
                  return "vert";
              case Couleur::bleu:
                  return "bleu";
          }
          return "?";
      }

      int main() {
          Couleur c = Couleur::vert;
          std::println("{} {}", nom(c), c == Couleur::bleu);
      }
      ```
    choices:
      - {text: "`vert false`", correct: true}
      - {text: "`vert true`", correct: false}
      - {text: "`1 false`", correct: false}
      - {text: "`? false`", correct: false}
    answer: "`vert false` : le `switch` renvoie le texte du `case` qui correspond. Et `c`, qui vaut `Couleur::vert`, n'est pas égale à `Couleur::bleu`."
    check:
      output: "vert false"
  - key: code-conversion-refusee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      enum class Couleur { rouge, vert, bleu };

      int main() {
          int n = Couleur::vert;
          std::println("{}", n);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`vert`", correct: false}
      - {text: "`0`", correct: false}
    answer: "Ça ne compile pas : une `enum class` ne se convertit pas implicitement en `int`. Il faudrait `static_cast<int>(Couleur::vert)`, qui donnerait 1."
    check:
      compiles: false
  - key: bug-nom-sans-type
    format: bug-fix
    question: |-
      Le compilateur répond « 'rouge' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum class Couleur { rouge, vert, bleu };

      int main() {
          Couleur c = rouge;
          std::println("{}", c == Couleur::rouge);
      }
      ```
    choices:
      - {text: "Écrire `Couleur::rouge`", correct: true}
      - {text: "Écrire `Couleur.rouge`", correct: false}
      - {text: "Écrire `\"rouge\"`", correct: false}
      - {text: "Écrire `std::rouge`", correct: false}
    answer: |-
      ```cpp
      Couleur c = Couleur::rouge;
      ```
      Les valeurs d'une `enum class` sont rangées dans le type : il faut le nommer.
  - key: bug-affichage
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction affiche `1` ?
      ```cpp
      #include <print>

      enum class Couleur { rouge, vert, bleu };

      int main() {
          Couleur c = Couleur::vert;
          std::println("{}", c);
      }
      ```
    choices:
      - {text: "Écrire `static_cast<int>(c)` dans l'affichage", correct: true}
      - {text: "Écrire `{:d}` dans la chaîne de format", correct: false}
      - {text: "Écrire `c.value()` dans l'affichage", correct: false}
      - {text: "Écrire `*c` dans l'affichage", correct: false}
    answer: |-
      ```cpp
      std::println("{}", static_cast<int>(c));
      ```
      `std::println` ne sait pas afficher une énumération. On lui passe sa valeur entière, par une conversion
      explicite.
  - key: bug-case-oublie
    format: bug-fix
    question: |-
      Pour une commande en pause, ce programme n'affiche rien. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum class Etat { ouverte, fermee, en_pause };

      int main() {
          Etat etat = Etat::en_pause;
          switch (etat) {
              case Etat::ouverte:
                  std::println("ouverte");
                  break;
              case Etat::fermee:
                  std::println("fermée");
                  break;
          }
      }
      ```
    choices:
      - {text: "Ajouter un `case Etat::en_pause:` au `switch`", correct: true}
      - {text: "Retirer `en_pause` de l'énumération", correct: false}
      - {text: "Retirer le `break` du `case Etat::fermee`", correct: false}
      - {text: "Écrire `switch (static_cast<int>(etat))`", correct: false}
    answer: |-
      ```cpp
      case Etat::en_pause:
          std::println("en pause");
          break;
      ```
      Aucun `case` ne correspond à la valeur, et il n'y a pas de `default` : le `switch` ne fait rien. `-Wall` signale
      cet oubli (« enumeration value 'en_pause' not handled in switch »).
  - key: bug-comparaison-entier
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      enum class Etat { ouverte, fermee };

      int main() {
          Etat etat = Etat::fermee;
          if (etat == 1) {
              std::println("fermée");
          }
      }
      ```
    choices:
      - {text: "Comparer à `Etat::fermee`", correct: true}
      - {text: "Comparer à `\"fermee\"`", correct: false}
      - {text: "Comparer à `1.0`", correct: false}
      - {text: "Comparer avec un seul `=`", correct: false}
    answer: |-
      ```cpp
      if (etat == Etat::fermee) {
      ```
      Une `enum class` ne se compare pas à un entier. Comparer à la valeur nommée est aussi plus lisible, et reste
      juste si l'ordre des valeurs change.
