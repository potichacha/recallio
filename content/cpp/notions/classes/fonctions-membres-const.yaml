notion: fonctions-membres-const
lesson: |-
  Une fonction membre suivie de **`const`** promet de **ne pas modifier l'objet** sur lequel elle est appelée.

  ```cpp
  class Compte {
  public:
      int solde() const { return solde_; }          // lit : const
      void deposer(int montant) { solde_ += montant; }   // modifie : pas const

  private:
      int solde_ = 0;
  };
  ```

  Le `const` s'écrit **après la liste des paramètres**. Il fait partie de la signature : si la fonction est définie
  hors de la classe, il doit être répété.

  **Ce qu'il change.**

  - Dans une fonction `const`, **modifier un membre ne compile pas**, et elle ne peut appeler que d'autres fonctions
    `const` de l'objet.
  - Sur un objet **`const`**, ou à travers une **référence constante**, on ne peut appeler **que** les fonctions
    `const`.

  Ce second point rend la chose indispensable : on passe les objets par `const T&`. Une fonction de lecture qui
  n'est pas marquée `const` devient inutilisable dans toutes les fonctions qui reçoivent l'objet ainsi.

  **La règle** : toute fonction membre qui ne modifie pas l'objet est `const`. C'est la *const-correctness*.

  **Deux versions.** Une classe peut offrir la même fonction en version `const` et non `const` ; le compilateur
  choisit d'après l'objet. C'est ainsi que `v[i]` renvoie une référence modifiable sur un vecteur ordinaire, et une
  référence constante sur un vecteur `const`.

  **`mutable`.** Un membre déclaré `mutable` peut être modifié **même dans une fonction `const`**. On le réserve à
  ce qui ne fait pas partie de l'état visible de l'objet : un cache, un compteur d'accès, un mutex.

  **En entretien** : « Je marque `const` toutes les fonctions membres qui ne modifient pas l'objet : sans cela, elles
  sont inappelables à travers une référence constante. `mutable` sert aux détails internes, comme un cache. »
tour:
  - title: Les fonctions membres const
    text: |-
      Un `const` après les paramètres d'une fonction membre dit : « cette fonction ne modifie pas l'objet ». Le
      compilateur le vérifie.

      C'est important parce qu'on passe les objets par référence constante : à travers une `const Compte&`, seules les
      fonctions `const` peuvent être appelées.

      Essaie : retire le `const` de `solde()`, puis exécute. `afficher` ne compile plus.
    example:
      files:
        main.cpp: |-
          #include <print>

          class Compte {
          public:
              void deposer(int montant) {
                  solde_ += montant;
              }

              int solde() const {
                  return solde_;
              }

          private:
              int solde_ = 0;
          };

          void afficher(const Compte& compte) {
              std::println("solde : {}", compte.solde());
          }

          int main() {
              Compte compte;
              compte.deposer(100);
              afficher(compte);
          }
      output: "solde : 100"
cards:
  - key: promesse-de-const
    format: course
    question: "Que promet une fonction membre déclarée `int solde() const;` ?"
    choices:
      - {text: "De ne pas modifier l'objet sur lequel elle est appelée", correct: true}
      - {text: "De renvoyer une valeur que l'appelant ne peut pas modifier", correct: false}
      - {text: "De renvoyer toujours la même valeur", correct: false}
      - {text: "De ne pas pouvoir être appelée deux fois", correct: false}
    answer: "Le `const` final porte sur l'objet : la fonction ne modifie aucun de ses membres. Le compilateur le vérifie. Un `const` devant le type de retour dirait autre chose."
  - key: appel-sur-objet-const
    format: course
    question: "Quelles fonctions membres peut-on appeler à travers une `const Compte&` ?"
    choices:
      - {text: "Celles qui sont déclarées `const` seulement", correct: true}
      - {text: "Toutes les fonctions membres publiques", correct: false}
      - {text: "Celles qui ne renvoient rien seulement", correct: false}
      - {text: "Aucune : un objet constant ne s'utilise pas", correct: false}
    answer: "Une référence constante promet de ne pas modifier l'objet : le compilateur n'y laisse appeler que les fonctions qui font la même promesse."
  - key: role-de-mutable
    format: course
    question: "À quoi sert le mot-clé `mutable` devant un membre ?"
    choices:
      - {text: "À permettre de le modifier même dans une fonction membre `const`", correct: true}
      - {text: "À interdire de le modifier après la construction de l'objet", correct: false}
      - {text: "À le partager entre tous les objets de la classe", correct: false}
      - {text: "À le rendre accessible depuis l'extérieur de la classe", correct: false}
    answer: "`mutable` sort un membre de la promesse de `const`. On le réserve à ce qui n'est pas l'état visible de l'objet : un cache, un compteur d'accès, un mutex."
  - key: pourquoi-marquer
    format: course
    question: "Pourquoi marquer `const` un accesseur qui, de toute façon, ne modifie rien ?"
    choices:
      - {text: "Sans cela, il est inappelable sur un objet passé par référence constante", correct: true}
      - {text: "Sans cela, il renvoie une copie au lieu d'une référence", correct: false}
      - {text: "Sans cela, il est exécuté plus lentement", correct: false}
      - {text: "Sans cela, il ne peut pas lire les membres privés", correct: false}
    answer: "Le compilateur ne devine pas qu'une fonction ne modifie rien : il se fie à sa déclaration. Une lecture non marquée `const` bloque tout le code qui reçoit l'objet par `const T&`."
  - key: vf-modifier-un-membre
    format: true-false
    question: Une fonction membre `const` peut modifier un membre ordinaire de l'objet.
    truth: false
    answer: C'est une erreur de compilation. Seul un membre déclaré `mutable` y échappe.
  - key: vf-position
    format: true-false
    question: "Le `const` d'une fonction membre s'écrit après la liste de ses paramètres."
    truth: true
    answer: "`int solde() const;`. Écrit devant, `const int solde();` qualifierait le type de retour."
  - key: vf-objet-non-const
    format: true-false
    question: Une fonction membre `const` peut être appelée sur un objet qui n'est pas constant.
    truth: true
    answer: "Elle promet de ne rien modifier : elle convient à tous les objets, constants ou non."
  - key: vf-surcharge
    format: true-false
    question: Une classe peut avoir deux fonctions de même nom et mêmes paramètres, l'une `const` et l'autre non.
    truth: true
    answer: Le `const` fait partie de la signature. Le compilateur choisit la version d'après l'objet.
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration promet que `taille` ne modifie pas l'objet ?"
    choices:
      - {text: "`int taille() const;`", correct: true}
      - {text: "`const int taille();`", correct: false}
      - {text: "`int const taille();`", correct: false}
      - {text: "`int taille(const);`", correct: false}
    answer: "Le `const` après les parenthèses porte sur l'objet. Devant le type, il porte sur la valeur renvoyée."
  - key: qcm-appel-interne
    format: multiple-choice
    question: "Dans une fonction membre `const`, quelles autres fonctions membres du même objet peut-on appeler ?"
    choices:
      - {text: "Les fonctions `const` seulement", correct: true}
      - {text: "Toutes les fonctions membres", correct: false}
      - {text: "Les fonctions privées seulement", correct: false}
      - {text: "Aucune", correct: false}
    answer: "Appeler une fonction non `const` pourrait modifier l'objet, ce que la fonction en cours a promis de ne pas faire."
  - key: qcm-usage-de-mutable
    format: multiple-choice
    question: "Pour lequel de ces membres `mutable` est-il justifié ?"
    choices:
      - {text: "Un cache du dernier résultat calculé", correct: true}
      - {text: "Le solde d'un compte bancaire", correct: false}
      - {text: "Le nom d'un utilisateur", correct: false}
      - {text: "La taille d'un tableau", correct: false}
    answer: "Un cache ne change pas ce que l'objet vaut pour l'extérieur : c'est un détail interne. Le solde, le nom ou la taille font partie de son état visible."
  - key: qcm-definition-externe
    format: multiple-choice
    question: "La classe déclare `int solde() const;`. Comment commence sa définition, hors de la classe ?"
    choices:
      - {text: "`int Compte::solde() const {`", correct: true}
      - {text: "`int Compte::solde() {`", correct: false}
      - {text: "`const int Compte::solde() {`", correct: false}
      - {text: "`int const::Compte::solde() {`", correct: false}
    answer: "Le `const` fait partie de la signature : il est répété dans la définition. Sans lui, le compilateur chercherait une autre fonction, non déclarée."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour promettre que la fonction ne modifie pas l'objet :
      ```cpp
      class Compte {
      public:
          int solde() ___ { return solde_; }

      private:
          int solde_ = 0;
      };
      ```
    blanks:
      - [const]
    answer: "`int solde() const` : le `const` après les parenthèses."
  - key: trous-mutable
    format: fill-in
    question: |-
      Complète pour que `acces_` puisse être modifié dans une fonction `const` :
      ```cpp
      class Document {
      public:
          int pages() const {
              ++acces_;
              return pages_;
          }

      private:
          int pages_ = 12;
          ___ int acces_ = 0;
      };
      ```
    blanks:
      - [mutable]
    answer: "`mutable int acces_` : ce compteur ne fait pas partie de l'état visible du document."
  - key: trous-parametre
    format: fill-in
    question: |-
      Complète pour recevoir le compte sans le copier, en lecture seule :
      ```cpp
      void afficher(___ Compte& compte) {
          std::println("{}", compte.solde());
      }
      ```
    blanks:
      - [const]
    answer: "`const Compte&` : la fonction ne pourra appeler que les fonctions membres `const`, comme `solde()`."
  - key: trous-definition
    format: fill-in
    question: |-
      Complète la définition, pour qu'elle corresponde à la déclaration `int solde() const;` :
      ```cpp
      int Compte::solde() ___ {
          return solde_;
      }
      ```
    blanks:
      - [const]
    answer: "Le `const` de la déclaration se répète dans la définition."
  - key: code-reference-const
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) { solde_ += montant; }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int double_du_solde(const Compte& compte) {
          return compte.solde() * 2;
      }

      int main() {
          Compte compte;
          compte.deposer(30);
          std::println("{}", double_du_solde(compte));
      }
      ```
    choices:
      - {text: "`60`", correct: true}
      - {text: "`30`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`60` : `solde()` est `const`, on peut donc l'appeler à travers une référence constante."
    check:
      output: "60"
  - key: code-fonction-non-const
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() { return solde_; }

      private:
          int solde_ = 50;
      };

      int main() {
          const Compte compte;
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`50`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `compte` est constant, et `solde()` n'est pas marquée `const`. Le compilateur ne regarde pas son corps."
    check:
      compiles: false
  - key: code-deux-versions
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Texte {
      public:
          const char* genre() { return "modifiable"; }
          const char* genre() const { return "constant"; }
      };

      int main() {
          Texte a;
          const Texte b;
          std::println("{} {}", a.genre(), b.genre());
      }
      ```
    choices:
      - {text: "`modifiable constant`", correct: true}
      - {text: "`constant constant`", correct: false}
      - {text: "`modifiable modifiable`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`modifiable constant` : les deux versions coexistent. Sur un objet ordinaire, la version non `const` est préférée ; sur un objet constant, seule la version `const` est possible."
    check:
      output: "modifiable constant"
  - key: code-mutable
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Document {
      public:
          int pages() const {
              ++lectures_;
              return pages_;
          }
          int lectures() const { return lectures_; }

      private:
          int pages_ = 12;
          mutable int lectures_ = 0;
      };

      int main() {
          const Document document;
          document.pages();
          document.pages();
          int pages = document.pages();
          std::println("{} {}", pages, document.lectures());
      }
      ```
    choices:
      - {text: "`12 3`", correct: true}
      - {text: "`12 0`", correct: false}
      - {text: "`12 2`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`12 3` : `lectures_` est `mutable`, la fonction `const` peut l'incrémenter, même sur un objet constant. Les trois appels de `pages()` sont comptés."
    check:
      output: "12 3"
  - key: bug-accesseur-non-const
    format: bug-fix
    question: |-
      Le compilateur répond « passing 'const Compte' as 'this' argument discards qualifiers ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() { return solde_; }

      private:
          int solde_ = 100;
      };

      void afficher(const Compte& compte) {
          std::println("{}", compte.solde());
      }

      int main() {
          Compte compte;
          afficher(compte);
      }
      ```
    choices:
      - {text: "Déclarer `int solde() const`", correct: true}
      - {text: "Déclarer `const int solde()`", correct: false}
      - {text: "Déclarer `afficher(Compte& compte)`, sans `const`", correct: false}
      - {text: "Déclarer `solde_` dans la section `public:`", correct: false}
    answer: |-
      ```cpp
      int solde() const { return solde_; }
      ```
      Une fonction qui ne modifie pas l'objet doit le dire. Retirer le `const` du paramètre ferait compiler, mais
      `afficher` perdrait sa garantie, et n'accepterait plus les objets constants.
  - key: bug-modification-dans-const
    format: bug-fix
    question: |-
      Le compilateur répond « assignment of member 'Compte::solde_' in read-only object ». La fonction doit vraiment
      créditer le compte. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) const {
              solde_ += montant;
          }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte;
          compte.deposer(100);
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Retirer `const` de la fonction `deposer`", correct: true}
      - {text: "Déclarer `solde_` avec le mot-clé `mutable`", correct: false}
      - {text: "Déclarer `montant` avec le mot-clé `const`", correct: false}
      - {text: "Retirer `const` de la fonction `solde`", correct: false}
    answer: |-
      ```cpp
      void deposer(int montant) {
          solde_ += montant;
      }
      ```
      Une fonction qui modifie l'état de l'objet n'est pas `const`. `mutable` ferait compiler, mais mentirait : le
      solde fait partie de l'état visible du compte.
  - key: bug-const-oublie-dans-la-definition
    format: bug-fix
    question: |-
      Le compilateur répond « no declaration matches 'int Compte::solde()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() const;

      private:
          int solde_ = 100;
      };

      int Compte::solde() {
          return solde_;
      }

      int main() {
          Compte compte;
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Répéter `const` dans la définition : `int Compte::solde() const {`", correct: true}
      - {text: "Retirer `Compte::` de la définition de la fonction", correct: false}
      - {text: "Écrire `const int Compte::solde() {` dans la définition", correct: false}
      - {text: "Déplacer la définition avant la classe", correct: false}
    answer: |-
      ```cpp
      int Compte::solde() const {
          return solde_;
      }
      ```
      `solde() const` et `solde()` sont deux fonctions différentes : le `const` fait partie de la signature, et doit
      figurer dans la définition.
  - key: bug-appel-d-une-non-const
    format: bug-fix
    question: |-
      Ce code ne compile pas : `resume` ne peut pas appeler `taille`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Panier {
      public:
          int taille() { return articles_; }
          void resume() const {
              std::println("{} articles", taille());
          }

      private:
          int articles_ = 3;
      };

      int main() {
          Panier panier;
          panier.resume();
      }
      ```
    choices:
      - {text: "Déclarer `int taille() const`", correct: true}
      - {text: "Déclarer `void resume()`, sans `const`", correct: false}
      - {text: "Déclarer `articles_` avec `mutable`", correct: false}
      - {text: "Appeler `this.taille()` dans `resume`", correct: false}
    answer: |-
      ```cpp
      int taille() const { return articles_; }
      ```
      Une fonction `const` ne peut appeler que des fonctions `const`. `taille` ne modifie rien : c'est elle qui doit
      être marquée. Retirer le `const` de `resume` propagerait le défaut.
