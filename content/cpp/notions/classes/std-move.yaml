notion: std-move
lesson: |-
  **`std::move`**, dans `<utility>`, **ne déplace rien**. C'est une **conversion** : il transforme son argument en
  **rvalue**, pour dire « je n'ai plus besoin de cette valeur, tu peux la prendre ».

  ```cpp
  std::string a = "un texte assez long";
  std::string b = std::move(a);    // le constructeur de déplacement de std::string fait le travail
  ```

  Le déplacement a lieu **dans la fonction qui reçoit** cette rvalue : un constructeur ou une affectation par
  déplacement. S'il n'y en a pas, c'est la **copie** qui est appelée.

  **Ce qui en découle.**

  - `std::move(a);`, seul sur une ligne, ne fait rien du tout.
  - Sur un **type fondamental** (`int`, `double`, un pointeur brut), déplacer, c'est copier : la source garde sa
    valeur.
  - Sur un objet **`const`**, le déplacement est impossible : la copie est choisie, en silence.
  - Sur une classe **sans fonction de déplacement**, la copie est choisie aussi.

  **Après un déplacement**, la source est dans un état **valide mais non spécifié**. On peut la détruire, ou lui
  **affecter une nouvelle valeur**. On ne se sert plus de son ancienne valeur. (Un `std::unique_ptr` déplacé est
  garanti nul ; pour une `std::string` ou un `std::vector`, rien n'est promis.)

  **Où l'écrire.**

  - Pour **transférer** un objet dont on n'a plus besoin : `v.push_back(std::move(ligne));`.
  - Dans un constructeur qui prend un paramètre **par valeur** pour le garder : `: nom_{std::move(nom)}`.
  - Pour passer un `std::unique_ptr` à son nouveau propriétaire.

  **Où ne pas l'écrire.**

  - **`return std::move(local);`** : inutile et nuisible. Le compilateur déplace déjà une variable locale qu'on
    renvoie, et sait souvent ne rien déplacer du tout (élision de copie). `std::move` l'en empêche.
  - Sur un objet dont on **se sert encore** après.

  **En entretien** : « `std::move` est un cast en rvalue : il autorise le déplacement, il ne le fait pas. Après
  lui, je ne lis plus l'objet. Et je n'écris pas `return std::move(x)` : cela désactive l'élision de copie. »
cards:
  - key: ce-que-fait-move
    format: course
    question: "Que fait `std::move(x)` ?"
    choices:
      - {text: "Il convertit `x` en rvalue, sans rien déplacer lui-même", correct: true}
      - {text: "Il déplace le contenu de `x` vers un emplacement temporaire", correct: false}
      - {text: "Il détruit `x`, et renvoie une copie de son contenu", correct: false}
      - {text: "Il échange le contenu de `x` avec celui de la destination", correct: false}
    answer: "C'est un cast : `static_cast<T&&>(x)`. Le déplacement est fait par le constructeur ou l'affectation qui reçoit cette rvalue."
  - key: etat-de-la-source
    format: course
    question: "Dans quel état est un objet après qu'on l'a déplacé ?"
    choices:
      - {text: "Valide mais non spécifié : on peut le détruire ou le réaffecter", correct: true}
      - {text: "Détruit : on ne peut plus rien en faire", correct: false}
      - {text: "Inchangé : il garde toujours sa valeur", correct: false}
      - {text: "Vide : la norme le garantit pour tous les types", correct: false}
    answer: "La norme promet seulement qu'il reste utilisable sans danger. Sa valeur n'est pas garantie : on ne la lit plus. On lui en affecte une nouvelle, ou on le laisse être détruit."
  - key: return-move
    format: course
    question: "Pourquoi n'écrit-on pas `return std::move(resultat);` pour une variable locale ?"
    choices:
      - {text: "Le compilateur le fait déjà, et `std::move` l'empêche d'élider la copie", correct: true}
      - {text: "Le code ne compile pas : on ne peut pas déplacer une variable locale", correct: false}
      - {text: "La variable locale est détruite avant d'être déplacée", correct: false}
      - {text: "Le déplacement est plus lent que la copie pour un retour", correct: false}
    answer: "Une variable locale renvoyée est déjà traitée comme une rvalue, et le compilateur peut la construire directement chez l'appelant. `std::move` force un déplacement là où il n'y aurait rien eu."
  - key: retombe-sur-la-copie
    format: course
    question: "Que se passe-t-il avec `T b = std::move(a);` si `T` n'a pas de constructeur de déplacement ?"
    choices:
      - {text: "Le constructeur de copie est appelé", correct: true}
      - {text: "Le code ne compile pas", correct: false}
      - {text: "`a` est détruit, et `b` reste vide", correct: false}
      - {text: "Le compilateur génère un déplacement octet par octet", correct: false}
    answer: "Le constructeur de copie prend une `const T&`, qui accepte aussi une rvalue. Le code compile et copie : `std::move` est une permission, pas une obligation."
  - key: vf-seul-sur-une-ligne
    format: true-false
    question: "`std::move(texte);`, seul sur une ligne, vide la chaîne `texte`."
    truth: false
    answer: "Rien ne reçoit la rvalue : aucun constructeur ni affectation par déplacement n'est appelé. La chaîne est intacte."
  - key: vf-entier
    format: true-false
    question: "Après `int b = std::move(a);`, l'entier `a` garde sa valeur."
    truth: true
    answer: Pour un type fondamental, déplacer revient à copier. Il n'y a aucune ressource à transférer.
  - key: vf-const
    format: true-false
    question: "`std::move` sur un objet `const` permet de le déplacer."
    truth: false
    answer: On ne peut pas vider un objet constant. Le compilateur choisit la copie, sans avertir.
  - key: vf-reaffecter
    format: true-false
    question: On peut affecter une nouvelle valeur à un objet après l'avoir déplacé.
    truth: true
    answer: Il est dans un état valide. Lui donner une nouvelle valeur est même la façon normale de s'en resservir.
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::move` ?"
    choices:
      - {text: "`<utility>`", correct: true}
      - {text: "`<memory>`", correct: false}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<move>`", correct: false}
    answer: "`<utility>`. (`<algorithm>` déclare un autre `std::move`, qui déplace une suite d'éléments.)"
  - key: qcm-membre
    format: multiple-choice
    question: "Un constructeur reçoit `std::string nom` par valeur, pour le garder dans le membre `nom_`. Comment l'initialise-t-il sans copie de plus ?"
    choices:
      - {text: "`: nom_{std::move(nom)}`", correct: true}
      - {text: "`: nom_{nom}`", correct: false}
      - {text: "`: nom_{&nom}`", correct: false}
      - {text: "`: nom_{std::copy(nom)}`", correct: false}
    answer: "Le paramètre est une copie locale, dont on n'a plus besoin : on la déplace dans le membre. Sans `std::move`, elle serait copiée une seconde fois."
  - key: qcm-unique-ptr
    format: multiple-choice
    question: "Que vaut un `std::unique_ptr` après qu'on l'a déplacé ?"
    choices:
      - {text: "`nullptr` : c'est garanti", correct: true}
      - {text: "Une adresse quelconque", correct: false}
      - {text: "La même adresse qu'avant", correct: false}
      - {text: "Rien : il est détruit", correct: false}
    answer: "Pour les pointeurs intelligents, la norme précise l'état : nul. Pour la plupart des autres types, il est seulement « valide mais non spécifié »."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans quel cas `std::move` est-il à sa place ?"
    choices:
      - {text: "Pour ranger dans un vecteur une chaîne dont on ne se servira plus", correct: true}
      - {text: "Pour renvoyer une variable locale depuis une fonction", correct: false}
      - {text: "Pour passer un objet à une fonction qui le lit seulement", correct: false}
      - {text: "Pour copier un entier dans une autre variable", correct: false}
    answer: "`v.push_back(std::move(ligne));` transfère le texte au vecteur. Un retour de variable locale se déplace seul, une lecture prend une référence constante, et un entier se copie."
  - key: code-entier
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      int main() {
          int a = 5;
          int b = std::move(a);
          std::println("{} {}", a, b);
      }
      ```
    choices:
      - {text: "`5 5`", correct: true}
      - {text: "`0 5`", correct: false}
      - {text: "`5 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`5 5` : un `int` n'a rien à céder. Le déplacer, c'est le copier : `a` garde sa valeur."
    check:
      output: "5 5"
  - key: code-sans-deplacement
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
      };

      int main() {
          Trace a;
          Trace b = std::move(a);
      }
      ```
    choices:
      - {text: "`copie`", correct: true}
      - {text: "Rien", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "`déplacement`", correct: false}
    answer: "`copie` : la classe n'a pas de constructeur de déplacement. La rvalue est reçue par le constructeur de copie, dont le paramètre `const Trace&` accepte tout."
    check:
      output: "copie"
  - key: code-const
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      int main() {
          Trace a;
          const Trace b;
          Trace c = std::move(a);
          Trace d = std::move(b);
      }
      ```
    choices:
      - text: |-
          ```
          déplacement
          copie
          ```
        correct: true
      - text: |-
          ```
          déplacement
          déplacement
          ```
        correct: false
      - text: |-
          ```
          copie
          copie
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      déplacement
      copie
      ```
      `a` peut être déplacée. `b` est `const` : `std::move(b)` ne peut pas être reçu par le constructeur de
      déplacement, et la copie est choisie sans un mot.
    check:
      output: |-
        déplacement
        copie
  - key: code-membre
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      class Boite {
      public:
          explicit Boite(Trace contenu) : contenu_{std::move(contenu)} {}

      private:
          Trace contenu_;
      };

      int main() {
          Trace t;
          Boite boite{t};
      }
      ```
    choices:
      - text: |-
          ```
          copie
          déplacement
          ```
        correct: true
      - text: |-
          ```
          copie
          copie
          ```
        correct: false
      - {text: "`déplacement`", correct: false}
      - {text: "`copie`", correct: false}
    answer: |-
      ```
      copie
      déplacement
      ```
      `t` est copiée dans le paramètre `contenu`, passé par valeur. Ce paramètre est ensuite déplacé dans le membre :
      une seule copie au total.
    check:
      output: |-
        copie
        déplacement
  - key: bug-usage-apres-move
    format: bug-fix
    question: |-
      Ce programme devrait afficher le message deux fois. La seconde ligne affichée est vide. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::string message = "une alerte assez longue pour être sur le tas";
          std::vector<std::string> journal;
          journal.push_back(std::move(message));
          std::println("{}", journal[0]);
          std::println("{}", message);
      }
      ```
    choices:
      - {text: "Retirer `std::move` : le programme se sert encore de `message`", correct: true}
      - {text: "Déclarer `message` avec le mot-clé `const`", correct: false}
      - {text: "Appeler `std::move(message)` une seconde fois", correct: false}
      - {text: "Afficher `message` avec `std::cout` plutôt qu'avec `std::println`", correct: false}
    answer: |-
      ```cpp
      journal.push_back(message);
      ```
      Après `std::move`, le texte appartient au vecteur, et `message` est dans un état non spécifié : ici, vide. On
      ne déplace que ce dont on ne se servira plus. (Avec `const`, le déplacement deviendrait une copie, par
      accident.)
  - key: bug-return-move
    format: bug-fix
    question: |-
      Ce programme affiche `déplacement`. Sans la faute, il n'afficherait rien : aucune copie, aucun déplacement.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      Trace creer() {
          Trace resultat;
          return std::move(resultat);
      }

      int main() {
          Trace t = creer();
      }
      ```
    choices:
      - {text: "Écrire `return resultat;`", correct: true}
      - {text: "Écrire `return &resultat;`", correct: false}
      - {text: "Écrire `return std::move(std::move(resultat));`", correct: false}
      - {text: "Écrire `return Trace{resultat};`", correct: false}
    answer: |-
      ```cpp
      return resultat;
      ```
      Renvoyer une variable locale par son nom permet au compilateur de la construire directement chez l'appelant :
      ni copie, ni déplacement. `std::move` l'en empêche, et force un déplacement.
  - key: bug-move-seul
    format: bug-fix
    question: |-
      L'auteur voulait vider `brouillon` dans `final`. Le programme affiche `0 20` : rien n'a été transféré. Pourquoi ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      int main() {
          std::string brouillon = "un texte de vingt c.";
          std::string final;
          std::move(brouillon);
          std::println("{} {}", final.size(), brouillon.size());
      }
      ```
    choices:
      - {text: "`std::move` seul ne déplace rien : il faut affecter son résultat à `final`", correct: true}
      - {text: "`std::move` ne s'applique pas aux chaînes de moins de 32 caractères", correct: false}
      - {text: "`final` est un mot réservé, qui ne peut pas recevoir de valeur", correct: false}
      - {text: "`std::move` doit être appelé sur `final`, pas sur `brouillon`", correct: false}
    answer: |-
      ```cpp
      final = std::move(brouillon);
      ```
      `std::move` ne fait que convertir en rvalue. C'est l'affectation par déplacement de `final` qui prend le texte.
  - key: bug-parametre-copie
    format: bug-fix
    question: |-
      Ce programme affiche `copie` deux fois. Une seule copie suffit. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      class Boite {
      public:
          explicit Boite(Trace contenu) : contenu_{contenu} {}

      private:
          Trace contenu_;
      };

      int main() {
          Trace t;
          Boite boite{t};
      }
      ```
    choices:
      - {text: "Écrire `contenu_{std::move(contenu)}` dans la liste d'initialisation", correct: true}
      - {text: "Écrire `contenu_{&contenu}` dans la liste d'initialisation", correct: false}
      - {text: "Écrire `Boite boite{std::move(boite)};` dans `main`", correct: false}
      - {text: "Écrire `Trace contenu_ = contenu;` dans la classe", correct: false}
    answer: |-
      ```cpp
      explicit Boite(Trace contenu) : contenu_{std::move(contenu)} {}
      ```
      Le paramètre `contenu` est déjà une copie de `t`. C'est une lvalue : sans `std::move`, il est copié une seconde
      fois dans le membre. Déplacé, il n'y a qu'une copie.
  - key: situation-relecture-return
    format: scenario
    question: |-
      En relecture, tu vois `return std::move(lignes);` à la fin d'une fonction qui renvoie un `std::vector` local.
      L'auteur explique que « c'est plus rapide ». Que réponds-tu ?
    choices:
      - {text: "Que `return lignes;` suffit, et laisse le compilateur élider la copie", correct: true}
      - {text: "Qu'il a raison : sans `std::move`, le vecteur serait copié", correct: false}
      - {text: "Qu'il faut renvoyer une référence vers `lignes` plutôt qu'un vecteur", correct: false}
      - {text: "Qu'il faut renvoyer le vecteur dans un `std::shared_ptr`", correct: false}
    answer: |-
      Une variable locale renvoyée est déjà déplacée d'office, et souvent construite directement chez l'appelant.
      `std::move` empêche cette élision : au mieux il ne change rien, au pire il ajoute un déplacement. GCC le
      signale avec `-Wpessimizing-move`.
  - key: situation-boucle
    format: scenario
    question: |-
      Une boucle lit des lignes dans une variable `ligne`, puis fait `resultat.push_back(ligne);`. Les lignes sont
      longues, et la boucle est lente. Que proposes-tu ?
    choices:
      - {text: "`resultat.push_back(std::move(ligne));` : la ligne n'est plus utilisée après", correct: true}
      - {text: "`resultat.push_back(&ligne);` : on range son adresse", correct: false}
      - {text: "Déclarer `ligne` avec le mot-clé `const`", correct: false}
      - {text: "Ranger les lignes dans un `std::array` de taille fixe", correct: false}
    answer: |-
      Le vecteur prend le texte de `ligne` au lieu de l'allouer et de le recopier. À l'itération suivante, la
      lecture affecte une nouvelle valeur à `ligne` : c'est l'usage permis d'un objet déplacé.
  - key: situation-parametre-lu
    format: scenario
    question: |-
      Un collègue écrit `afficher(std::move(rapport));`, pour une fonction `void afficher(const Rapport&)`, « pour
      éviter une copie ». Qu'en penses-tu ?
    choices:
      - {text: "Que `std::move` est inutile : une référence constante ne copie rien", correct: true}
      - {text: "Qu'il a raison : sans `std::move`, le rapport serait copié", correct: false}
      - {text: "Que le rapport est détruit par l'appel, à cause de `std::move`", correct: false}
      - {text: "Que le code ne compile pas", correct: false}
    answer: |-
      `const Rapport&` se lie à l'objet sans le copier, avec ou sans `std::move`. Le cast n'a aucun effet ici, et
      trompe le lecteur, qui croira que `rapport` ne doit plus être utilisé.
  - key: situation-apres-move
    format: scenario
    question: |-
      Après `archive = std::move(brouillon);`, une fonction teste `if (brouillon.empty())` pour savoir si le transfert
      a eu lieu. Que lui reproches-tu ?
    choices:
      - {text: "L'état de `brouillon` n'est pas spécifié : rien ne garantit qu'il soit vide", correct: true}
      - {text: "`brouillon` est détruit : appeler `empty()` fait planter le programme", correct: false}
      - {text: "`empty()` renvoie toujours `false` sur un objet déplacé", correct: false}
      - {text: "Rien : un objet déplacé est toujours vide", correct: false}
    answer: |-
      Appeler `empty()` est permis : l'objet est valide. Mais sa valeur n'est pas promise, même si les
      implémentations courantes le laissent vide. Un code qui en dépend peut changer de comportement avec la
      bibliothèque. Si l'on veut un brouillon vide, on écrit `brouillon.clear();`.
