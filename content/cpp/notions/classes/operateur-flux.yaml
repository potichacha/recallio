      class Compte {
      public:
          ___ std::ostream& operator<<(std::ostream& flux, const Compte& c) {
              return flux << c.solde_;
          }

      private:
          int solde_ = 0;
      };
      ```
    blanks:
      - [friend]
    answer: "`friend` : la fonction reste libre, mais voit les membres privés."
  - key: trous-flux
    format: fill-in
    question: |-
      Complète pour écrire dans le flux reçu, et le renvoyer :
      ```cpp
      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return ___ << p.x << ' ' << p.y;
      }
      ```
    blanks:
      - [flux]
    answer: "On écrit dans le paramètre `flux`, jamais dans `std::cout` en dur."
  - key: trous-operateur
    format: fill-in
    question: |-
      Complète le nom de l'opérateur d'affichage :
      ```cpp
      std::ostream& operator___(std::ostream& flux, const Point& p);
      ```
    blanks:
      - ["<<"]
    answer: "`operator<<` pour l'écriture, `operator>>` pour la lecture."
  - key: code-affichage
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      struct Point {
          int x;
          int y;
      };

      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return flux << '(' << p.x << ", " << p.y << ')';
      }

      int main() {
          std::cout << Point{1, 2} << ' ' << Point{3, 4} << '\n';
      }
      ```
    choices:
      - {text: "`(1, 2) (3, 4)`", correct: true}
      - {text: "`(1, 2)(3, 4)`", correct: false}
      - {text: "`1 2 3 4`", correct: false}
      - {text: "`(3, 4) (1, 2)`", correct: false}
    answer: "`(1, 2) (3, 4)` : chaque `<<` renvoie le flux, donc les affichages s'enchaînent de gauche à droite."
    check:
      output: "(1, 2) (3, 4)"
  - key: code-ostringstream
    format: code-output
    question: |-
      ```cpp
      #include <iostream>
      #include <sstream>
      #include <string>

      struct Duree {
          int minutes;
      };

      std::ostream& operator<<(std::ostream& flux, const Duree& d) {
          return flux << d.minutes / 60 << "h" << d.minutes % 60;
      }

      int main() {
          std::ostringstream tampon;
          tampon << Duree{135};
          const std::string texte = tampon.str();
          std::cout << texte << ' ' << texte.size() << '\n';
      }
      ```
    choices:
      - {text: "`2h15 4`", correct: true}
      - {text: "`135 3`", correct: false}
      - {text: "`2h15 5`", correct: false}
      - {text: "`2.25h 5`", correct: false}
    answer: "`2h15 4` : le même opérateur écrit dans une chaîne en mémoire. 135 minutes font 2 heures et 15 minutes ; le texte compte quatre caractères."
    check:
      output: "2h15 4"
  - key: code-friend
    format: code-output
    question: |-
      ```cpp
      #include <iostream>

      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}

          friend std::ostream& operator<<(std::ostream& flux, const Compte& c) {
              return flux << c.solde_ << " EUR";
          }

      private:
          int solde_;
      };

      int main() {
          const Compte a{50};
          const Compte b{7};
          std::cout << a << " et " << b << '\n';
      }
      ```
    choices:
      - {text: "`50 EUR et 7 EUR`", correct: true}
      - {text: "`50 et 7 EUR`", correct: false}
      - {text: "`57 EUR`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`50 EUR et 7 EUR` : déclaré `friend`, l'opérateur lit le membre privé. Il reste une fonction libre, avec le flux à gauche."
    check:
      output: "50 EUR et 7 EUR"
  - key: code-conteneur
    format: code-output
    question: |-
      ```cpp
      #include <iostream>
      #include <vector>

      struct Note {
          int valeur;
      };

      std::ostream& operator<<(std::ostream& flux, const Note& n) {
          return flux << n.valeur << "/20";
      }

      int main() {
          const std::vector<Note> notes{{12}, {15}};
          for (const Note& note : notes) {
              std::cout << note << ';';
          }
          std::cout << '\n';
      }
      ```
    choices:
      - {text: "`12/20;15/20;`", correct: true}
      - {text: "`12;15;`", correct: false}
      - {text: "`12/20;15/20`", correct: false}
      - {text: "`27/20;`", correct: false}
    answer: "`12/20;15/20;` : l'opérateur est appelé pour chaque élément, et le point-virgule suit chacun."
    check:
      output: "12/20;15/20;"
  - key: bug-retour-void
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne d'affichage : « invalid operands of types 'void' and 'char' to binary
      'operator<<' ». Quelle correction est la bonne ?
      ```cpp
      #include <iostream>

      struct Point {
          int x;
          int y;
      };

      void operator<<(std::ostream& flux, const Point& p) {
          flux << p.x << ' ' << p.y;
      }

      int main() {
          std::cout << Point{1, 2} << '\n';
      }
      ```
    choices:
      - {text: "Renvoyer le flux : `std::ostream& operator<<(...)`, avec `return flux << ...;`", correct: true}
      - {text: "Renvoyer une chaîne : `std::string operator<<(...)`, avec `return \"\";`", correct: false}
      - {text: "Recevoir le flux par valeur : `std::ostream flux`", correct: false}
      - {text: "Recevoir le point par valeur : `Point p`", correct: false}
    answer: |-
      ```cpp
      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x << ' ' << p.y;
      }
      ```
      `std::cout << point << '\n'` applique le second `<<` au résultat du premier. S'il vaut `void`, la chaîne est
      rompue.
  - key: bug-cout-en-dur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `longueur 3`, la taille du texte produit. Il affiche `1 2` puis `longueur 0` :
      rien n'est allé dans le tampon. Quelle correction est la bonne ?
      ```cpp
      #include <iostream>
      #include <sstream>

      struct Point {
          int x;
          int y;
      };

      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          std::cout << p.x << ' ' << p.y;
          return flux;
      }

      int main() {
          std::ostringstream tampon;
          tampon << Point{1, 2};
          std::cout << "\nlongueur " << tampon.str().size() << '\n';
      }
      ```
    choices:
      - {text: "Écrire dans le paramètre : `flux << p.x << ' ' << p.y;`", correct: true}
      - {text: "Écrire dans l'erreur standard : `std::cerr << p.x << ' ' << p.y;`", correct: false}
      - {text: "Renvoyer `std::cout` à la place de `flux`", correct: false}
      - {text: "Déclarer le tampon avec le type `std::ostream`", correct: false}
    answer: |-
      ```cpp
      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x << ' ' << p.y;
      }
      ```
      L'opérateur reçoit le flux où écrire : c'est lui qu'il doit utiliser. Avec `std::cout` en dur, tout part à
      l'écran, quel que soit le flux de l'appelant.
  - key: bug-membre-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'int Compte::solde_' is private within this context ». Quelle correction est la
      bonne ?
      ```cpp
      #include <iostream>

      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}

      private:
          int solde_;
      };

      std::ostream& operator<<(std::ostream& flux, const Compte& c) {
          return flux << c.solde_;
      }

      int main() {
          std::cout << Compte{50} << '\n';
      }
      ```
    choices:
      - {text: "Déclarer l'opérateur `friend` dans la classe `Compte`", correct: true}
      - {text: "Déclarer l'opérateur `static` devant sa définition", correct: false}
      - {text: "Recevoir le compte par référence non constante", correct: false}
      - {text: "Écrire `c->solde_` à la place de `c.solde_`", correct: false}
    answer: |-
      ```cpp
      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}
          friend std::ostream& operator<<(std::ostream& flux, const Compte& c);

      private:
          int solde_;
      };
      ```
      Une fonction libre ne voit pas les membres privés. `friend` le lui permet ; un accesseur public `solde()`
      conviendrait aussi.
  - key: bug-operateur-membre
    format: bug-fix
    question: |-
      Le compilateur refuse `std::cout << p` : aucun `operator<<` ne prend un flux à gauche et un `Point` à droite.
      Quelle correction est la bonne ?
      ```cpp
      #include <iostream>

      struct Point {
          int x;
          int y;

          std::ostream& operator<<(std::ostream& flux) const {
              return flux << x << ' ' << y;
          }
      };

      int main() {
          const Point p{1, 2};
          std::cout << p << '\n';
      }
      ```
    choices:
      - {text: "En faire une fonction libre : `operator<<(std::ostream& flux, const Point& p)`", correct: true}
      - {text: "Retirer `const` de la fonction membre `operator<<`", correct: false}
      - {text: "Déclarer la fonction membre `operator<<` avec `static`", correct: false}
      - {text: "Renvoyer `void` depuis la fonction membre `operator<<`", correct: false}
    answer: |-
      ```cpp
      std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x << ' ' << p.y;
      }
      ```
      Un opérateur membre a l'objet à gauche : celui-ci s'utiliserait en écrivant `p << std::cout`. Pour avoir le
      flux à gauche, l'opérateur doit être une fonction libre.
