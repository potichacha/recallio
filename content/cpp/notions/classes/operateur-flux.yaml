notion: operateur-flux
lesson: |-
  Pour qu'un objet s'affiche avec `std::cout << objet`, on surcharge **`operator<<`** pour son type. Le même
  opérateur sert alors pour tout flux de sortie : la console, un fichier (`std::ofstream`), une chaîne en mémoire
  (`std::ostringstream`).

  ```cpp
  #include <iostream>

  struct Point {
      int x;
      int y;
  };

  std::ostream& operator<<(std::ostream& flux, const Point& p) {
      return flux << '(' << p.x << ", " << p.y << ')';
  }

  std::cout << Point{1, 2} << '\n';      // (1, 2)
  ```

  **La signature, pièce par pièce.**

  | Élément | Pourquoi |
  |---|---|
  | **fonction libre** | l'opérande de gauche est le flux, pas l'objet : ce ne peut pas être un membre de `Point` |
  | `std::ostream& flux` | référence **non constante** : écrire modifie le flux ; et un flux ne se copie pas |
  | `const Point& p` | afficher ne modifie pas l'objet |
  | renvoie `std::ostream&` | le **même flux**, pour enchaîner : `flux << a << b` |

  **Le chaînage.** `std::cout << a << b` se lit `(std::cout << a) << b`. Le premier appel doit donc **renvoyer le
  flux** : oublier le `return`, ou renvoyer `void`, casse la chaîne.

  **Écrire dans `flux`, pas dans `std::cout`.** L'opérateur reçoit le flux en paramètre : c'est lui qu'il faut
  utiliser. Écrire `std::cout` en dur dans le corps afficherait à l'écran même quand l'appelant écrit dans un
  fichier.

  **Accéder aux membres privés.** Une fonction libre ne voit que l'interface publique. Deux solutions :

  - passer par les **accesseurs** ;
  - déclarer l'opérateur **`friend`** dans la classe :

  ```cpp
  class Compte {
  public:
      friend std::ostream& operator<<(std::ostream& flux, const Compte& c) {
          return flux << c.solde_ << " EUR";
      }

  private:
      int solde_ = 0;
  };
  ```

  Défini ainsi dans la classe, il reste une fonction **libre**.

  **Les bonnes habitudes.** Ne pas ajouter de fin de ligne dans l'opérateur : c'est à l'appelant de décider. Ne
  pas modifier durablement le format du flux (`std::hex`) sans le rétablir.

  **Et `std::print` ?** `std::print` et `std::format` ne se servent **pas** d'`operator<<` : pour eux, on
  spécialise `std::formatter`. En attendant, on peut passer par une chaîne : `std::ostringstream`, puis `str()`.

  **L'opérateur de lecture.** `operator>>` suit le même schéma, avec `std::istream&` et un objet **non constant**,
  puisqu'on le remplit.

  **En entretien** : « `operator<<` est une fonction libre qui prend le flux par référence non constante et
  l'objet par référence constante, et qui renvoie le flux pour permettre le chaînage. Si elle a besoin des membres
  privés, je la déclare `friend`. »
cards:
  - key: signature
    format: course
    question: "Quelle est la signature de l'opérateur qui affiche un `Point` dans un flux ?"
    choices:
      - {text: "`std::ostream& operator<<(std::ostream& flux, const Point& p)`", correct: true}
      - {text: "`void operator<<(std::ostream flux, const Point& p)`", correct: false}
      - {text: "`std::ostream operator<<(const std::ostream& flux, Point p)`", correct: false}
      - {text: "`std::string operator<<(const Point& p, std::ostream& flux)`", correct: false}
    answer: "Le flux à gauche, par référence non constante ; l'objet à droite, par référence constante ; le flux renvoyé par référence."
  - key: pourquoi-libre
    format: course
    question: "Pourquoi `operator<<` ne peut-il pas être une fonction membre de la classe à afficher ?"
    choices:
      - {text: "L'opérande de gauche est le flux : un opérateur membre aurait l'objet à gauche", correct: true}
      - {text: "Une fonction membre ne peut pas recevoir de paramètre par référence", correct: false}
      - {text: "Une fonction membre ne peut pas renvoyer un `std::ostream&`", correct: false}
      - {text: "Le standard réserve tous les opérateurs aux fonctions libres", correct: false}
    answer: "Membre de `Point`, l'opérateur s'écrirait `point << std::cout`. Et l'on ne peut pas ajouter de membre à `std::ostream`."
  - key: retour
    format: course
    question: "Pourquoi `operator<<` renvoie-t-il le flux ?"
    choices:
      - {text: "Pour permettre d'enchaîner : `flux << a << b`", correct: true}
      - {text: "Pour que l'appelant puisse fermer le flux", correct: false}
      - {text: "Pour signaler si l'écriture a réussi", correct: false}
      - {text: "Pour que le flux soit vidé à chaque écriture", correct: false}
    answer: "`flux << a << b` s'évalue `(flux << a) << b` : le résultat du premier appel est l'opérande de gauche du second."
  - key: friend
    format: course
    question: "Comment un `operator<<` libre accède-t-il aux membres privés de la classe ?"
    choices:
      - {text: "La classe le déclare `friend`", correct: true}
      - {text: "La classe le déclare `static`", correct: false}
      - {text: "La classe le déclare `virtual`", correct: false}
      - {text: "La classe le déclare `mutable`", correct: false}
    answer: "`friend` ouvre les membres privés à une fonction qui n'est pas membre. L'autre voie est de passer par les accesseurs publics."
  - key: vf-flux-const
    format: true-false
    question: "Le flux se passe par référence constante : `const std::ostream&`."
    truth: false
    answer: "Écrire dans un flux le modifie. La référence est non constante."
  - key: vf-fichier
    format: true-false
    question: "Un `operator<<` écrit pour `std::ostream&` fonctionne aussi avec un `std::ofstream`."
    truth: true
    answer: "`std::ofstream` et `std::ostringstream` dérivent de `std::ostream` : la référence de base les accepte."
  - key: vf-print
    format: true-false
    question: "`std::println(\"{}\", point)` utilise l'`operator<<` défini pour `Point`."
    truth: false
    answer: "`std::print` et `std::format` passent par `std::formatter`, pas par `operator<<`."
  - key: vf-copie-flux
    format: true-false
    question: "Un `std::ostream` peut être passé par valeur à une fonction."
    truth: false
    answer: "Un flux ne se copie pas : son constructeur de copie est supprimé. On le passe toujours par référence."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::cout` ?"
    choices:
      - {text: "`<iostream>`", correct: true}
      - {text: "`<print>`", correct: false}
      - {text: "`<format>`", correct: false}
      - {text: "`<string>`", correct: false}
    answer: "`<iostream>` déclare `std::cout`, `std::cin` et `std::cerr`. `<ostream>` suffit pour le seul type `std::ostream`."
  - key: qcm-chaine
    format: multiple-choice
    question: "Quel flux écrit dans une chaîne en mémoire, pour récupérer le texte produit par `operator<<` ?"
    choices:
      - {text: "`std::ostringstream`", correct: true}
      - {text: "`std::ofstream`", correct: false}
      - {text: "`std::cin`", correct: false}
      - {text: "`std::string_view`", correct: false}
    answer: "`std::ostringstream` (en-tête `<sstream>`) accumule le texte ; `str()` le renvoie."
  - key: qcm-lecture
    format: multiple-choice
    question: "Quelle est la signature de l'opérateur de lecture d'un `Point` ?"
    choices:
      - {text: "`std::istream& operator>>(std::istream& flux, Point& p)`", correct: true}
      - {text: "`std::istream& operator>>(std::istream& flux, const Point& p)`", correct: false}
      - {text: "`std::ostream& operator>>(std::ostream& flux, Point& p)`", correct: false}
      - {text: "`Point operator>>(std::istream flux)`", correct: false}
    answer: "Un flux d'entrée, et un objet non constant : la lecture le remplit."
  - key: qcm-fin-de-ligne
    format: multiple-choice
    question: "Où décide-t-on d'ajouter une fin de ligne après l'affichage d'un objet ?"
    choices:
      - {text: "Chez l'appelant : `std::cout << point << '\\n';`", correct: true}
      - {text: "Dans `operator<<`, à la fin de chaque affichage", correct: false}
      - {text: "Dans le destructeur de l'objet affiché", correct: false}
      - {text: "Dans le constructeur de l'objet affiché", correct: false}
    answer: "Un opérateur qui ajoute sa fin de ligne empêche d'afficher deux objets sur la même ligne."
