    question: |-
      Complète le type de retour :
      ```cpp
      std::___& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x << ' ' << p.y;
      }
      ```
    blanks:
      - [ostream]
    answer: "L'opérateur renvoie le flux reçu, par référence."
