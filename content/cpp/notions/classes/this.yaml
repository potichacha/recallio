notion: this
lesson: |-
  Dans une fonction membre, **`this`** est un **pointeur vers l'objet** sur lequel la fonction a été appelée.
  Quand on écrit `compte.deposer(50)`, `this` vaut `&compte` pendant l'exécution de `deposer`.

  **Il est presque toujours sous-entendu.** Écrire `solde_` dans une fonction membre, c'est écrire
  `this->solde_`. Le compilateur ajoute `this->` devant chaque membre.

  ```cpp
  class Compte {
  public:
      void deposer(int montant) {
          solde_ += montant;           // en réalité : this->solde_ += montant;
      }

  private:
      int solde_ = 0;
  };
  ```

  **Quand il faut l'écrire.**

  1. **Lever une ambiguïté** : un paramètre porte le même nom qu'un membre, et le masque.

     ```cpp
     void renommer(std::string nom) {
         this->nom = std::move(nom);  // this->nom : le membre ; nom : le paramètre
     }
     ```

     Le suffixe `_` des membres (`nom_`) évite ce cas.

  2. **Renvoyer l'objet lui-même** : `*this` est l'objet, et `return *this;` permet d'**enchaîner** les appels.

     ```cpp
     Compteur& ajouter(int n) {
         total_ += n;
         return *this;
     }

     compteur.ajouter(1).ajouter(2);
     ```

     Le type de retour est une **référence** : par valeur, chaque appel travaillerait sur une copie.

  3. **Se comparer à un autre objet** : `if (this == &autre)` détecte l'auto-affectation dans un `operator=`.

  4. **Se passer à une fonction** : `registre.inscrire(this);` ou `afficher(*this);`.

  **Son type.** Dans une fonction membre ordinaire de `Compte`, `this` est un `Compte*`. Dans une fonction membre
  **`const`**, c'est un `const Compte*` : voilà pourquoi elle ne peut pas modifier les membres.

  **Où il n'existe pas.** Dans une fonction **`static`**, qui n'est appelée sur aucun objet, et hors de toute
  classe. Une lambda définie dans une fonction membre doit le **capturer** (`[this]`) pour accéder aux membres.

  **Deux rappels.** `this` ne peut pas être réaffecté, et il n'est jamais nul dans un programme correct : appeler
  une fonction membre à travers un pointeur nul est un comportement indéfini.

  **En entretien** : « `this` est un pointeur vers l'objet courant, sous-entendu devant chaque membre. Je l'écris
  pour lever une ambiguïté avec un paramètre, et `return *this;` par référence pour enchaîner les appels. Dans une
  fonction `const`, il pointe vers un objet constant ; dans une fonction `static`, il n'existe pas. »
tour:
  - title: L'objet courant
    text: |-
      Une fonction membre s'exécute toujours pour un objet précis. Le mot-clé `this` est un pointeur vers cet
      objet, et `*this` est l'objet lui-même.

      On s'en passe la plupart du temps : `total_` veut déjà dire `this->total_`. Mais `return *this;` a un usage
      à lui : en renvoyant l'objet par référence, une fonction permet d'enchaîner les appels sur une seule ligne.

      Essaie : ajoute un troisième appel à la chaîne, `.ajouter(10)`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          class Compteur {
          public:
              Compteur& ajouter(int n) {
                  total_ += n;
                  return *this;
              }

              int total() const { return total_; }

          private:
              int total_ = 0;
          };

          int main() {
              Compteur compteur;
              compteur.ajouter(1).ajouter(2);
              std::println("{}", compteur.total());
          }
      output: "3"
    task:
      instructions: |-
        Le paramètre `largeur` porte le même nom que le membre : l'affectation `largeur = largeur;` copie le
        paramètre dans lui-même, et le membre reste à 0. Corrige `redimensionner` avec `this->`, pour que le
        programme affiche `7`.
      starter:
        main.cpp: |-
          #include <print>

          class Fenetre {
          public:
              void redimensionner(int largeur) {
                  largeur = largeur;
              }

              int lire_largeur() const { return largeur; }

          private:
              int largeur = 0;
          };

          int main() {
              Fenetre fenetre;
              fenetre.redimensionner(7);
              std::println("{}", fenetre.lire_largeur());
          }
      solution:
        main.cpp: |-
          #include <print>

          class Fenetre {
          public:
              void redimensionner(int largeur) {
                  this->largeur = largeur;
              }

              int lire_largeur() const { return largeur; }

          private:
              int largeur = 0;
          };

          int main() {
              Fenetre fenetre;
              fenetre.redimensionner(7);
              std::println("{}", fenetre.lire_largeur());
          }
      output: "7"
cards:
  - key: definition
    format: course
    question: "Que désigne `this` dans une fonction membre ?"
    choices:
      - {text: "Un pointeur vers l'objet sur lequel la fonction a été appelée", correct: true}
      - {text: "Une référence vers la classe à laquelle la fonction appartient", correct: false}
      - {text: "Une copie de l'objet sur lequel la fonction a été appelée", correct: false}
      - {text: "Un pointeur vers la fonction membre en cours d'exécution", correct: false}
    answer: "Pendant `compte.deposer(50)`, `this` vaut `&compte`. C'est un pointeur : l'objet lui-même s'écrit `*this`."
  - key: sous-entendu
    format: course
    question: "Dans une fonction membre, que veut dire le nom d'un membre écrit seul, comme `solde_` ?"
    choices:
      - {text: "`this->solde_` : le membre de l'objet courant", correct: true}
      - {text: "Une variable globale partagée par tous les objets de la classe", correct: false}
      - {text: "Une variable locale créée à chaque appel de la fonction", correct: false}
      - {text: "`*this` : l'objet courant tout entier", correct: false}
    answer: "Le compilateur ajoute `this->` devant chaque membre. On ne l'écrit que lorsqu'il le faut."
  - key: return-this
    format: course
    question: "À quoi sert `return *this;` dans une fonction membre qui renvoie `Compteur&` ?"
    choices:
      - {text: "À renvoyer l'objet lui-même, pour enchaîner les appels", correct: true}
      - {text: "À renvoyer une copie de l'objet, pour le protéger", correct: false}
      - {text: "À renvoyer l'adresse de l'objet, pour le libérer", correct: false}
      - {text: "À renvoyer le premier membre de l'objet", correct: false}
    answer: "`a.ajouter(1).ajouter(2)` : le second appel s'applique à ce que renvoie le premier. Avec une référence, c'est le même objet."
  - key: type-de-this
    format: course
    question: "Quel est le type de `this` dans une fonction membre `const` de la classe `Compte` ?"
    choices:
      - {text: "`const Compte*`", correct: true}
      - {text: "`Compte*`", correct: false}
      - {text: "`const Compte&`", correct: false}
      - {text: "`Compte&`", correct: false}
    answer: "Un pointeur vers un objet constant : c'est ce qui interdit de modifier les membres dans une fonction `const`."
  - key: vf-pointeur
    format: true-false
    question: "`this` est une référence vers l'objet courant."
    truth: false
    answer: "C'est un pointeur. On accède aux membres avec `this->`, et à l'objet avec `*this`."
  - key: vf-static
    format: true-false
    question: "`this` est utilisable dans une fonction membre `static`."
    truth: false
    answer: "Une fonction statique n'est appelée sur aucun objet : il n'y a pas d'objet courant."
  - key: vf-ambiguite
    format: true-false
    question: "Quand un paramètre porte le nom d'un membre, `this->nom` désigne le membre."
    truth: true
    answer: "Le paramètre masque le membre ; `this->` le retrouve."
  - key: vf-reaffecter
    format: true-false
    question: "On peut faire désigner à `this` un autre objet, avec `this = &autre;`."
    truth: false
    answer: "`this` n'est pas modifiable : le compilateur refuse cette affectation."
  - key: qcm-objet
    format: multiple-choice
    question: "Quelle expression désigne l'objet courant lui-même, et non son adresse ?"
    choices:
      - {text: "`*this`", correct: true}
      - {text: "`this`", correct: false}
      - {text: "`&this`", correct: false}
      - {text: "`this->`", correct: false}
    answer: "`this` est un pointeur ; `*this` le déréférence."
  - key: qcm-auto-affectation
    format: multiple-choice
    question: "Dans `operator=(const Tampon& autre)`, quel test détecte l'affectation d'un objet à lui-même ?"
    choices:
      - {text: "`if (this == &autre)`", correct: true}
      - {text: "`if (this == autre)`", correct: false}
      - {text: "`if (*this == &autre)`", correct: false}
      - {text: "`if (&this == autre)`", correct: false}
    answer: "On compare deux adresses : celle de l'objet courant, et celle de l'argument."
  - key: qcm-lambda
    format: multiple-choice
    question: "Dans une fonction membre, quelle capture donne à une lambda l'accès aux membres de l'objet ?"
    choices:
      - {text: "`[this]`", correct: true}
      - {text: "`[]`", correct: false}
      - {text: "`[self]`", correct: false}
      - {text: "`[class]`", correct: false}
    answer: "La lambda est un autre objet : elle doit capturer le pointeur `this` pour atteindre les membres."
  - key: qcm-retour-chaine
    format: multiple-choice
    question: "Quel type de retour permet d'enchaîner `texte.ajouter(\"a\").ajouter(\"b\")` sur le même objet ?"
    choices:
      - {text: "`Texte&`", correct: true}
      - {text: "`Texte`", correct: false}
      - {text: "`void`", correct: false}
      - {text: "`Texte*`", correct: false}
    answer: "Par référence, le second appel modifie le même objet. Par valeur, il modifierait une copie temporaire ; avec un pointeur, il faudrait écrire `->`."
  - key: trous-fleche
    format: fill-in
    question: |-
      Complète pour affecter le paramètre au membre de même nom :
      ```cpp
      void redimensionner(int largeur) {
          this___largeur = largeur;
      }
      ```
    blanks:
      - ["->"]
    answer: "`this` est un pointeur : on accède au membre avec `->`."
  - key: trous-return
    format: fill-in
    question: |-
      Complète pour renvoyer l'objet courant :
      ```cpp
      Compteur& ajouter(int n) {
          total_ += n;
          return ___;
      }
      ```
    blanks:
      - ["*this"]
    answer: "`*this` est l'objet lui-même, renvoyé ici par référence."
  - key: trous-adresse
    format: fill-in
    question: |-
      Complète le test d'auto-affectation :
      ```cpp
      Tampon& operator=(const Tampon& autre) {
          if (___ == &autre) {
              return *this;
          }
          // ...
      }
      ```
    blanks:
      - [this]
    answer: "`this` est l'adresse de l'objet courant, comparée à celle de l'argument."
  - key: trous-capture
    format: fill-in
    question: |-
      Complète pour que la lambda lise le membre `seuil_` :
      ```cpp
      bool Filtre::garde(int x) const {
          auto test = [___](int v) { return v > seuil_; };
          return test(x);
      }
      ```
    blanks:
      - [this]
    answer: "`[this]` capture le pointeur vers l'objet courant."
  - key: code-chaine
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          Compteur& ajouter(int n) {
              total_ += n;
              return *this;
          }
          int total() const { return total_; }

      private:
          int total_ = 0;
      };

      int main() {
          Compteur c;
          c.ajouter(5).ajouter(10).ajouter(1);
          std::println("{}", c.total());
      }
      ```
    choices:
      - {text: "`16`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`15`", correct: false}
      - {text: "`1`", correct: false}
    answer: "`16` : chaque appel renvoie une référence vers `c`. Les trois ajouts s'appliquent au même objet."
    check:
      output: "16"
  - key: code-chaine-par-valeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          Compteur ajouter(int n) {
              total_ += n;
              return *this;
          }
          int total() const { return total_; }

      private:
          int total_ = 0;
      };

      int main() {
          Compteur c;
          c.ajouter(5).ajouter(10);
          std::println("{}", c.total());
      }
      ```
    choices:
      - {text: "`5`", correct: true}
      - {text: "`15`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`5` : la fonction renvoie une copie. Le second `ajouter` modifie cette copie temporaire, pas `c`."
    check:
      output: "5"
  - key: code-masquage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Point {
      public:
          void placer(int x) {
              x = x;
              this->y = x;
          }
          int x = 1;
          int y = 2;
      };

      int main() {
          Point p;
          p.placer(9);
          std::println("{} {}", p.x, p.y);
      }
      ```
    choices:
      - {text: "`1 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`9 2`", correct: false}
      - {text: "`1 2`", correct: false}
    answer: "`1 9` : `x = x` affecte le paramètre à lui-même, le membre `x` reste à 1. `this->y` désigne bien le membre."
    check:
      output: "1 9"
  - key: code-adresse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Objet {
      public:
          bool est(const Objet& autre) const { return this == &autre; }
      };

      int main() {
          Objet a;
          Objet b;
          Objet& alias = a;
          std::println("{} {} {}", a.est(a), a.est(b), a.est(alias));
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`false false false`", correct: false}
    answer: "`true false true` : `this` est l'adresse de `a`. `b` est un autre objet ; `alias` est un autre nom de `a`."
    check:
      output: "true false true"
  - key: bug-parametre-masque
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada`. Il affiche une ligne vide : le membre n'a jamais reçu le nom. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Client {
      public:
          void renommer(std::string nom) {
              nom = nom;
          }
          std::string nom;
      };

      int main() {
          Client client;
          client.renommer("Ada");
          std::println("{}", client.nom);
      }
      ```
    choices:
      - {text: "Écrire `this->nom = nom;`", correct: true}
      - {text: "Écrire `nom = this->nom;`", correct: false}
      - {text: "Écrire `this.nom = nom;`", correct: false}
      - {text: "Écrire `*this = nom;`", correct: false}
    answer: |-
      ```cpp
      this->nom = nom;
      ```
      Le paramètre masque le membre : `nom = nom` l'affecte à lui-même. `this->nom` désigne le membre. `this` est
      un pointeur : on écrit `->`, pas un point.
  - key: bug-retour-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ab`. Il affiche `a` : le second ajout est perdu. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Texte {
      public:
          Texte ajouter(const std::string& morceau) {
              contenu_ += morceau;
              return *this;
          }
          const std::string& contenu() const { return contenu_; }

      private:
          std::string contenu_;
      };

      int main() {
          Texte texte;
          texte.ajouter("a").ajouter("b");
          std::println("{}", texte.contenu());
      }
      ```
    choices:
      - {text: "Renvoyer une référence : `Texte& ajouter(...)`", correct: true}
      - {text: "Renvoyer un pointeur : `return this;`, sans changer le type", correct: false}
      - {text: "Renvoyer une constante : `const Texte ajouter(...)`", correct: false}
      - {text: "Renvoyer le membre : `return contenu_;`", correct: false}
    answer: |-
      ```cpp
      Texte& ajouter(const std::string& morceau) {
      ```
      Par valeur, `return *this;` renvoie une copie : le second `ajouter` s'applique à ce temporaire. Avec
      `Texte&`, toute la chaîne d'appels travaille sur `texte`.
  - key: bug-this-dans-static
    format: bug-fix
    question: |-
      Le compilateur répond « 'this' is unavailable for static member functions ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          static int valeur() { return this->valeur_; }

      private:
          int valeur_ = 3;
      };

      int main() {
          Compteur c;
          std::println("{}", c.valeur());
      }
      ```
    choices:
      - {text: "Retirer `static` : `int valeur() const { return valeur_; }`", correct: true}
      - {text: "Écrire `return *this.valeur_;`", correct: false}
      - {text: "Écrire `return Compteur::this->valeur_;`", correct: false}
      - {text: "Ajouter `const` : `static int valeur() const`", correct: false}
    answer: |-
      ```cpp
      int valeur() const { return valeur_; }
      ```
      Une fonction statique n'a pas d'objet courant, donc pas de `this`, et ne peut pas lire un membre ordinaire.
      Cette fonction lit l'état d'un objet : elle n'a pas à être statique.
  - key: bug-point-au-lieu-de-fleche
    format: bug-fix
    question: |-
      Le compilateur refuse `this.total_` : `this` est un pointeur. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          void ajouter(int total_) {
              this.total_ += total_;
          }
          int total_ = 0;
      };

      int main() {
          Compteur c;
          c.ajouter(4);
          std::println("{}", c.total_);
      }
      ```
    choices:
      - {text: "Écrire `this->total_ += total_;`", correct: true}
      - {text: "Écrire `this::total_ += total_;`", correct: false}
      - {text: "Écrire `&this.total_ += total_;`", correct: false}
      - {text: "Écrire `this[total_] += total_;`", correct: false}
    answer: |-
      ```cpp
      this->total_ += total_;
      ```
      On accède au membre d'un objet désigné par un pointeur avec `->`. `(*this).total_` conviendrait aussi.
