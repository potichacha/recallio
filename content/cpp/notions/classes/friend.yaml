notion: friend
lesson: |-
  Les membres `private` d'une classe ne sont accessibles qu'à ses propres fonctions membres. Le mot-clé **`friend`**
  fait une exception : la classe **désigne elle-même** une fonction, ou une autre classe, qui pourra lire et modifier
  ses membres privés.

  **Une fonction amie.**

  ```cpp
  class Compte {
  public:
      explicit Compte(int solde) : solde_{solde} {}
      friend bool meme_solde(const Compte& a, const Compte& b);

  private:
      int solde_;
  };

  bool meme_solde(const Compte& a, const Compte& b) {
      return a.solde_ == b.solde_;      // permis : la fonction est amie
  }
  ```

  `meme_solde` n'est **pas** une fonction membre : elle n'a pas de `this`, et s'appelle `meme_solde(a, b)`.

  **Une classe amie.** `friend class Banque;` donne à toutes les fonctions membres de `Banque` l'accès aux membres
  privés de `Compte`.

  **Les règles.**

  - L'amitié est **accordée**, jamais prise : la déclaration `friend` est écrite **dans** la classe qui s'ouvre.
  - Elle n'est **pas réciproque** : si `A` déclare `B` amie, `A` n'accède pas pour autant aux membres privés de `B`.
  - Elle n'est **pas transitive** : l'amie de mon amie n'est pas mon amie.
  - Elle n'est **pas héritée** : une classe dérivée de `B` n'est pas amie de `A`.
  - La déclaration peut se placer dans la partie `public` ou `private` : cela ne change rien.

  **L'usage principal : les opérateurs.** `operator<<` pour l'affichage a pour premier opérande le flux, pas
  l'objet : il ne peut pas être une fonction membre. On le déclare ami, et on peut le **définir dans la classe**
  (ami caché, *hidden friend*) :

  ```cpp
  class Point {
  public:
      friend std::ostream& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x_ << ", " << p.y_;
      }
      friend bool operator==(const Point&, const Point&) = default;

  private:
      int x_ = 0;
      int y_ = 0;
  };
  ```

  Une fonction amie définie dans la classe n'est trouvée que par ses arguments (ADL) : elle n'encombre pas l'espace
  de noms.

  **Avec mesure.** Chaque `friend` élargit le code qui dépend des détails internes de la classe. On le réserve à
  ce qui fait **partie de son interface** : opérateurs symétriques, fonction `swap`, classe de test ou fabrique
  étroitement liée. Si une fonction publique suffit, on la préfère.

  **En entretien** : « `friend` donne à une fonction ou à une classe l'accès aux membres privés. C'est la classe
  qui l'accorde ; ce n'est ni réciproque, ni transitif, ni hérité. Je m'en sers surtout pour `operator<<` et les
  opérateurs symétriques, définis comme amis cachés. »
cards:
  - key: role
    format: course
    question: "Que permet le mot-clé `friend` ?"
    choices:
      - {text: "Il donne à une fonction ou à une classe l'accès aux membres privés de la classe qui le déclare", correct: true}
      - {text: "Il donne à la classe qui le déclare l'accès aux membres privés d'une autre classe", correct: false}
      - {text: "Il rend publics tous les membres privés de la classe qui le déclare", correct: false}
      - {text: "Il fait hériter la classe qui le déclare d'une autre classe", correct: false}
    answer: "C'est la classe qui s'ouvre qui écrit `friend`. Seule la fonction ou la classe nommée gagne l'accès ; le reste du programme ne voit toujours rien."
  - key: pas-membre
    format: course
    question: "Une fonction déclarée `friend` dans une classe est-elle une fonction membre de cette classe ?"
    choices:
      - {text: "Non : elle n'a pas de `this`, et s'appelle comme une fonction ordinaire", correct: true}
      - {text: "Oui : elle s'appelle avec un point, sur un objet de la classe", correct: false}
      - {text: "Oui, mais elle est toujours statique", correct: false}
      - {text: "Non : elle devient membre de la classe qui l'appelle", correct: false}
    answer: "C'est une fonction libre, à qui la classe accorde un droit d'accès. Elle reçoit les objets en paramètres."
  - key: regles
    format: course
    question: "La classe `A` déclare `friend class B;`. `A` peut-elle accéder aux membres privés de `B` ?"
    choices:
      - {text: "Non : l'amitié n'est pas réciproque", correct: true}
      - {text: "Oui : l'amitié vaut dans les deux sens", correct: false}
      - {text: "Oui, mais seulement en lecture", correct: false}
      - {text: "Oui, si `A` hérite aussi de `B`", correct: false}
    answer: "`B` voit les membres privés de `A`, pas l'inverse. Pour l'autre sens, `B` doit déclarer `A` amie à son tour."
  - key: operateur-flux
    format: course
    question: "Pourquoi `operator<<` vers un flux est-il souvent déclaré ami de la classe ?"
    choices:
      - {text: "Son premier opérande est le flux : il ne peut pas être membre de la classe, mais doit lire ses membres privés", correct: true}
      - {text: "Un opérateur ne peut jamais être une fonction membre : il doit toujours être déclaré ami", correct: false}
      - {text: "Le flux `std::ostream` exige que tous les opérateurs d'affichage soient déclarés `friend`", correct: false}
      - {text: "Une fonction amie s'exécute plus vite qu'une fonction membre, ce qui compte pour l'affichage", correct: false}
    answer: "Dans `flux << objet`, l'opérande de gauche est le flux. Un opérateur membre aurait l'objet à gauche. La fonction libre, amie, reçoit les deux."
  - key: vf-transitive
    format: true-false
    question: "Si `A` déclare `B` amie, et `B` déclare `C` amie, alors `C` accède aux membres privés de `A`."
    truth: false
    answer: "L'amitié n'est pas transitive. `C` n'a accès qu'à `B`."
  - key: vf-heritee
    format: true-false
    question: "Une classe dérivée d'une classe amie hérite de cette amitié."
    truth: false
    answer: "L'amitié n'est pas héritée : seule la classe nommée dans la déclaration `friend` en profite."
  - key: vf-section
    format: true-false
    question: "Une déclaration `friend` a le même effet, qu'elle soit écrite dans la partie `public` ou `private` de la classe."
    truth: true
    answer: "Les spécificateurs d'accès ne s'appliquent pas aux déclarations d'amitié."
  - key: vf-definie-dans-classe
    format: true-false
    question: "Une fonction amie peut être définie directement dans le corps de la classe."
    truth: true
    answer: "C'est l'« ami caché » : la fonction reste libre, et n'est trouvée que par ses arguments."
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle ligne, écrite dans la classe `Compte`, donne à la fonction `auditer` l'accès à ses membres privés ?"
    choices:
      - {text: "`friend void auditer(const Compte& c);`", correct: true}
      - {text: "`public void auditer(const Compte& c);`", correct: false}
      - {text: "`using void auditer(const Compte& c);`", correct: false}
      - {text: "`extern void auditer(const Compte& c);`", correct: false}
    answer: "`friend`, suivi de la déclaration de la fonction."
  - key: qcm-classe-amie
    format: multiple-choice
    question: "Quelle ligne, écrite dans la classe `Noeud`, rend la classe `Liste` amie ?"
    choices:
      - {text: "`friend class Liste;`", correct: true}
      - {text: "`class Liste : friend;`", correct: false}
      - {text: "`friend Liste::Noeud;`", correct: false}
      - {text: "`using friend Liste;`", correct: false}
    answer: "Toutes les fonctions membres de `Liste` peuvent alors manipuler les membres privés de `Noeud`."
  - key: qcm-egalite
    format: multiple-choice
    question: "Quelle ligne, écrite dans la classe `Point`, génère une égalité qui compare les membres privés ?"
    choices:
      - {text: "`friend bool operator==(const Point&, const Point&) = default;`", correct: true}
      - {text: "`friend bool operator==(const Point&, const Point&) = delete;`", correct: false}
      - {text: "`friend bool operator==() = default;`", correct: false}
      - {text: "`friend class operator==;`", correct: false}
    answer: "Depuis C++20, un `operator==` par défaut peut être déclaré ami : il compare les membres un à un."
  - key: qcm-quand
    format: multiple-choice
    question: "Dans quel cas `friend` est-il le plus justifié ?"
    choices:
      - {text: "Pour un opérateur symétrique qui fait partie de l'interface de la classe", correct: true}
      - {text: "Pour éviter d'écrire des accesseurs dans toute classe", correct: false}
      - {text: "Pour qu'une classe sans rapport lise un membre de temps en temps", correct: false}
      - {text: "Pour accélérer l'accès aux membres privés", correct: false}
    answer: "`operator<<`, `operator==`, `swap` : ils appartiennent à l'interface de la classe, sans pouvoir être membres. Ailleurs, `friend` affaiblit l'encapsulation."
  - key: trous-friend
    format: fill-in
    question: |-
      Complète pour donner à la fonction l'accès aux membres privés :
      ```cpp
      class Compte {
          ___ int lire_solde(const Compte& c);
          int solde_ = 0;
      };
      ```
    blanks:
      - [friend]
    answer: "`friend` accorde l'accès à la fonction déclarée."
  - key: trous-class
    format: fill-in
    question: |-
      Complète pour que toute la classe `Banque` soit amie :
      ```cpp
      class Compte {
          friend ___ Banque;
          int solde_ = 0;
      };
      ```
    blanks:
      - [class]
    answer: "`friend class Banque;` déclare une classe amie."
  - key: trous-membre
    format: fill-in
    question: |-
      Complète pour lire le membre privé depuis la fonction amie :
      ```cpp
      int lire_solde(const Compte& c) {
          return c.___;
      }
      ```
    blanks:
      - [solde_]
    answer: "La fonction amie accède à `c.solde_` comme le ferait une fonction membre."
  - key: trous-ostream
    format: fill-in
    question: |-
      Complète le type du premier paramètre de l'opérateur d'affichage :
      ```cpp
      friend std::___& operator<<(std::ostream& flux, const Point& p) {
          return flux << p.x_;
      }
      ```
    blanks:
      - [ostream]
    answer: "L'opérateur renvoie le flux reçu, de type `std::ostream&`, pour permettre l'enchaînement."
  - key: code-fonction-amie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Coffre {
      public:
          friend int ouvrir(const Coffre& c);

      private:
          int code_ = 1234;
      };

      int ouvrir(const Coffre& c) {
          return c.code_;
      }

      int main() {
          std::println("{}", ouvrir(Coffre{}));
      }
      ```
    choices:
      - {text: "`1234`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`1234` : `ouvrir` est amie de `Coffre`, elle lit donc le membre privé `code_`."
    check:
      output: "1234"
  - key: code-non-reciproque
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class B;

      class A {
          friend class B;
          int secret_ = 1;
      };

      class B {
      public:
          int lire(const A& a) const { return a.secret_; }

      private:
          int secret_ = 2;
      };

      int lire_b(const B& b) {
          return b.secret_;
      }

      int main() {
          std::println("{}", B{}.lire(A{}) + lire_b(B{}));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "`2`", correct: false}
    answer: "Ça ne compile pas : `lire_b` n'est pas amie de `B`, donc `b.secret_` lui est interdit. `B` lit bien le secret de `A`, mais cela ne donne aucun droit sur `B`."
    check:
      compiles: false
  - key: code-operateur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Metres {
      public:
          explicit Metres(int valeur) : valeur_{valeur} {}
          friend Metres operator+(const Metres& a, const Metres& b) {
              return Metres{a.valeur_ + b.valeur_};
          }
          friend int en_centimetres(const Metres& m) { return m.valeur_ * 100; }

      private:
          int valeur_;
      };

      int main() {
          std::println("{}", en_centimetres(Metres{2} + Metres{3}));
      }
      ```
    choices:
      - {text: "`500`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`23`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`500` : les deux fonctions amies, définies dans la classe, lisent `valeur_`. 2 + 3 = 5 mètres, soit 500 centimètres."
    check:
      output: "500"
  - key: code-classe-amie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
          friend class Testeur;
          int valeur_ = 0;
      };

      class Testeur {
      public:
          static int forcer(Compteur& c, int valeur) {
              c.valeur_ = valeur;
              return c.valeur_ * 2;
          }
      };

      int main() {
          Compteur c;
          std::println("{}", Testeur::forcer(c, 21));
      }
      ```
    choices:
      - {text: "`42`", correct: true}
      - {text: "`21`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`42` : `Testeur` est une classe amie, ses fonctions peuvent écrire et lire `valeur_`."
    check:
      output: "42"
  - key: bug-acces-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'int Compte::solde_' is private within this context ». La fonction `afficher` fait
      partie de l'interface de `Compte`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}

      private:
          int solde_;
      };

      void afficher(const Compte& c) {
          std::println("{}", c.solde_);
      }

      int main() {
          afficher(Compte{50});
      }
      ```
    choices:
      - {text: "Déclarer `friend void afficher(const Compte& c);` dans la classe `Compte`", correct: true}
      - {text: "Déclarer `friend class Compte;` au-dessus de la fonction `afficher`", correct: false}
      - {text: "Déclarer `friend void afficher(const Compte& c);` dans la fonction `main`", correct: false}
      - {text: "Déclarer la fonction `afficher` avec le mot-clé `friend` devant `void`", correct: false}
    answer: |-
      ```cpp
      class Compte {
      public:
          explicit Compte(int solde) : solde_{solde} {}
          friend void afficher(const Compte& c);
      ```
      L'amitié est accordée par la classe : la déclaration `friend` s'écrit dans `Compte`. Une fonction ne peut pas
      se déclarer amie elle-même.
  - key: bug-appel-membre
    format: bug-fix
    question: |-
      Le compilateur répond « 'const class Point' has no member named 'norme1' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) : x_{x}, y_{y} {}
          friend int norme1(const Point& p) { return p.x_ + p.y_; }

      private:
          int x_;
          int y_;
      };

      int main() {
          const Point p{3, 4};
          std::println("{}", p.norme1());
      }
      ```
    choices:
      - {text: "Appeler `norme1(p)`", correct: true}
      - {text: "Appeler `p->norme1()`", correct: false}
      - {text: "Appeler `Point::norme1()`", correct: false}
      - {text: "Appeler `p.friend norme1()`", correct: false}
    answer: |-
      ```cpp
      std::println("{}", norme1(p));
      ```
      Une fonction amie n'est pas un membre, même définie dans la classe : elle s'appelle comme une fonction libre,
      avec l'objet en argument.
  - key: bug-amitie-inverse
    format: bug-fix
    question: |-
      Le compilateur refuse `m.code_` dans `Clef::ouvre` : le membre est privé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Serrure;

      class Clef {
          friend class Serrure;

      public:
          bool ouvre(const Serrure& m) const;

      private:
          int code_ = 7;
      };

      class Serrure {
          int code_ = 7;
      };

      bool Clef::ouvre(const Serrure& m) const {
          return code_ == m.code_;
      }

      int main() {
          std::println("{}", Clef{}.ouvre(Serrure{}));
      }
      ```
    choices:
      - {text: "Écrire `friend class Clef;` dans la classe `Serrure`", correct: true}
      - {text: "Écrire `friend class Serrure;` une seconde fois dans `Clef`", correct: false}
      - {text: "Écrire `friend class Clef;` dans la classe `Clef`", correct: false}
      - {text: "Écrire `friend bool ouvre();` dans la fonction `main`", correct: false}
    answer: |-
      ```cpp
      class Serrure {
          friend class Clef;
          int code_ = 7;
      };
      ```
      `Clef` a déclaré `Serrure` amie, ce qui ouvre `Clef` à `Serrure`. L'inverse n'en découle pas : c'est `Serrure`
      qui doit s'ouvrir à `Clef`.
  - key: bug-derivee-pas-amie
    format: bug-fix
    question: |-
      Le compilateur refuse `c.valeur_` dans `TesteurDetaille` : le membre est privé. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Capteur {
          friend class Testeur;
          int valeur_ = 5;
      };

      class Testeur {};

      class TesteurDetaille : public Testeur {
      public:
          int lire(const Capteur& c) const { return c.valeur_; }
      };

      int main() {
          std::println("{}", TesteurDetaille{}.lire(Capteur{}));
      }
      ```
    choices:
      - {text: "Ajouter `friend class TesteurDetaille;` dans la classe `Capteur`", correct: true}
      - {text: "Ajouter `friend class Capteur;` dans la classe `TesteurDetaille`", correct: false}
      - {text: "Hériter de `Testeur` avec `private` à la place de `public`", correct: false}
      - {text: "Déclarer la fonction `lire` avec le mot-clé `virtual`", correct: false}
    answer: |-
      ```cpp
      class Capteur {
          friend class Testeur;
          friend class TesteurDetaille;
          int valeur_ = 5;
      };
      ```
      L'amitié ne s'hérite pas : `TesteurDetaille` dérive d'une classe amie, sans l'être elle-même. `Capteur` doit la
      nommer.
