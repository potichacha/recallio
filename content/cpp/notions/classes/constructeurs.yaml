notion: constructeurs
lesson: |-
  Un **constructeur** est la fonction qui **initialise un objet à sa création**. Il porte le **nom de la classe** et
  n'a **pas de type de retour**.

  ```cpp
  class Compte {
  public:
      Compte(std::string titulaire, int depot) {
          titulaire_ = titulaire;
          solde_ = depot;
      }

  private:
      std::string titulaire_;
      int solde_;
  };

  Compte compte{"Ada", 100};    // le constructeur est appelé ici
  ```

  Son rôle : qu'un objet soit **valide dès qu'il existe**. Plus besoin d'une fonction `initialiser` qu'on pourrait
  oublier d'appeler.

  - Un constructeur peut être **surchargé** : plusieurs constructeurs, avec des paramètres différents.
  - Le **constructeur par défaut** est celui qui s'appelle **sans argument** : `Compte compte;`.

  **Ce que fournit le compilateur.** Si la classe ne déclare **aucun** constructeur, le compilateur fournit un
  constructeur par défaut, qui ne fait rien de plus qu'initialiser les membres comme ils le seraient seuls. Dès qu'on
  déclare un constructeur, **il ne le fournit plus** : `Compte compte;` ne compile plus. Pour le garder, on l'écrit,
  ou on le demande avec `Compte() = default;`.

  **Pièges classiques.**

  - `Compte compte();` ne crée pas un objet : c'est la **déclaration d'une fonction**. Sans argument, on écrit
    `Compte compte;` ou `Compte compte{};`.
  - Un constructeur qui **n'initialise pas** un membre de type fondamental le laisse indéterminé.
  - Lui donner un type de retour, même `void`, en fait une fonction ordinaire, ou une erreur.

  On préfère initialiser les membres dans la **liste d'initialisation** du constructeur plutôt que dans son corps.

  **En entretien** : « Le constructeur établit l'invariant de la classe : un objet construit est un objet utilisable.
  Si je déclare un constructeur, le compilateur ne génère plus celui par défaut. »
tour:
  - title: Les constructeurs
    text: |-
      Un constructeur porte le nom de la classe, et s'exécute à la création de chaque objet. Il met l'objet dans un
      état valide : impossible d'oublier de l'initialiser.

      On peut en écrire plusieurs, avec des paramètres différents. Celui qui ne prend aucun argument est le
      **constructeur par défaut**.

      Essaie : supprime le constructeur sans paramètre, puis exécute. `Compte anonyme;` ne compile plus.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          class Compte {
          public:
              Compte() {
                  titulaire_ = "inconnu";
                  solde_ = 0;
              }

              Compte(std::string titulaire, int depot) {
                  titulaire_ = titulaire;
                  solde_ = depot;
              }

              void afficher() const {
                  std::println("{} : {}", titulaire_, solde_);
              }

          private:
              std::string titulaire_;
              int solde_;
          };

          int main() {
              Compte ada{"Ada", 100};
              Compte anonyme;

              ada.afficher();
              anonyme.afficher();
          }
      output: |-
        Ada : 100
        inconnu : 0
cards:
  - key: role-du-constructeur
    format: course
    question: À quoi sert un constructeur ?
    choices:
      - {text: "À initialiser l'objet au moment où il est créé", correct: true}
      - {text: "À libérer les ressources de l'objet quand il disparaît", correct: false}
      - {text: "À copier l'objet quand on le passe à une fonction", correct: false}
      - {text: "À créer la classe au démarrage du programme", correct: false}
    answer: "Le constructeur s'exécute à la création de chaque objet, et le met dans un état valide. Libérer les ressources est le rôle du destructeur."
  - key: forme-du-constructeur
    format: course
    question: Comment reconnaît-on un constructeur dans une classe ?
    choices:
      - {text: "Il porte le nom de la classe, et n'a pas de type de retour", correct: true}
      - {text: "Il s'appelle `init`, et renvoie `void`", correct: false}
      - {text: "Il porte le nom de la classe, et renvoie un objet de la classe", correct: false}
      - {text: "Il est déclaré avec le mot-clé `constructor`", correct: false}
    answer: "`Compte(std::string titulaire, int depot)` : le nom de la classe, des paramètres, aucun type de retour, pas même `void`."
  - key: constructeur-par-defaut
    format: course
    question: "Qu'appelle-t-on le constructeur par défaut ?"
    choices:
      - {text: "Celui qui peut être appelé sans argument", correct: true}
      - {text: "Celui que le compilateur appelle en premier", correct: false}
      - {text: "Celui qui est déclaré en premier dans la classe", correct: false}
      - {text: "Celui qui met tous les membres à zéro", correct: false}
    answer: "C'est le constructeur de `Compte compte;`. Il ne met pas forcément les membres à zéro : il fait ce qu'on y écrit."
  - key: constructeur-genere
    format: course
    question: Quand le compilateur fournit-il de lui-même un constructeur par défaut ?
    choices:
      - {text: "Quand la classe ne déclare aucun constructeur", correct: true}
      - {text: "Toujours, quels que soient les constructeurs déclarés", correct: false}
      - {text: "Quand la classe déclare au moins un constructeur", correct: false}
      - {text: "Jamais : il faut toujours l'écrire soi-même", correct: false}
    answer: "Dès qu'on déclare un constructeur, quel qu'il soit, le compilateur ne génère plus celui par défaut. On le redemande avec `Compte() = default;`."
  - key: vf-type-de-retour
    format: true-false
    question: Un constructeur se déclare avec le type de retour `void`.
    truth: false
    answer: Un constructeur n'a aucun type de retour. Avec `void`, le compilateur le refuse.
  - key: vf-surcharge
    format: true-false
    question: Une classe peut avoir plusieurs constructeurs, avec des paramètres différents.
    truth: true
    answer: Les constructeurs se surchargent comme les fonctions. Le compilateur choisit d'après les arguments.
  - key: vf-parentheses-vides
    format: true-false
    question: "`Compte compte();` crée un objet `compte` avec le constructeur par défaut."
    truth: false
    answer: "La ligne déclare une fonction nommée `compte`. Pour un objet : `Compte compte;` ou `Compte compte{};`."
  - key: vf-membres-initialises
    format: true-false
    question: Un constructeur écrit à la main met à zéro les membres `int` qu'il n'initialise pas.
    truth: false
    answer: Un membre de type fondamental que le constructeur n'initialise pas reste indéterminé.
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle ligne déclare un constructeur de la classe `Point` qui prend deux entiers ?"
    choices:
      - {text: "`Point(int x, int y);`", correct: true}
      - {text: "`void Point(int x, int y);`", correct: false}
      - {text: "`Point Point(int x, int y);`", correct: false}
      - {text: "`constructor(int x, int y);`", correct: false}
    answer: "Le nom de la classe, les paramètres, et rien devant."
  - key: qcm-creer-avec-arguments
    format: multiple-choice
    question: "Quelle ligne crée un `Point` avec le constructeur à deux entiers ?"
    choices:
      - {text: "`Point p{3, 4};`", correct: true}
      - {text: "`Point p = Point;`", correct: false}
      - {text: "`Point p.Point(3, 4);`", correct: false}
      - {text: "`Point p; p(3, 4);`", correct: false}
    answer: "Les arguments suivent le nom de l'objet, entre accolades ou entre parenthèses. Un constructeur ne s'appelle pas comme une fonction membre."
  - key: qcm-redemander
    format: multiple-choice
    question: "Une classe a un constructeur à deux paramètres. Comment garder aussi `Point p;` ?"
    choices:
      - {text: "Ajouter `Point() = default;`", correct: true}
      - {text: "Ajouter `Point() = delete;`", correct: false}
      - {text: "Ajouter `default Point;`", correct: false}
      - {text: "Rien : il est toujours fourni", correct: false}
    answer: "`= default` demande au compilateur de générer le constructeur par défaut qu'il ne fournit plus. `= delete` l'interdirait."
  - key: qcm-pas-d-initialiser
    format: multiple-choice
    question: "Quel avantage a un constructeur sur une fonction membre `initialiser()` ?"
    choices:
      - {text: "Il est appelé d'office : on ne peut pas oublier d'initialiser l'objet", correct: true}
      - {text: "Il peut être appelé plusieurs fois sur le même objet", correct: false}
      - {text: "Il renvoie un code d'erreur, que l'appelant peut tester", correct: false}
      - {text: "Il s'exécute à la compilation, donc sans coût", correct: false}
    answer: "Aucun objet ne peut exister sans être passé par un constructeur. Une fonction `initialiser` laisse une fenêtre où l'objet existe sans être valide."
  - key: trous-nom
    format: fill-in
    question: |-
      Complète avec le nom du constructeur :
      ```cpp
      class Compte {
      public:
          ___(int depot) {
              solde_ = depot;
          }

      private:
          int solde_;
      };
      ```
    blanks:
      - [Compte]
    answer: "Un constructeur porte le nom de sa classe."
  - key: trous-creation
    format: fill-in
    question: |-
      Complète pour créer un compte avec un dépôt de 100 :
      ```cpp
      Compte compte___;
      ```
    blanks:
      - ["{100}", "(100)"]
    answer: "`Compte compte{100};` appelle le constructeur à un paramètre."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour demander au compilateur le constructeur par défaut :
      ```cpp
      class Point {
      public:
          Point() = ___;
          Point(int x, int y);
      };
      ```
    blanks:
      - [default]
    answer: "`Point() = default;` : le compilateur génère le constructeur sans argument."
  - key: trous-sans-argument
    format: fill-in
    question: |-
      Complète pour créer un objet avec le constructeur par défaut, en utilisant des accolades :
      ```cpp
      Compte compte___;
      ```
    blanks:
      - ["{}"]
    answer: "`Compte compte{};` : des accolades vides. Des parenthèses vides déclareraient une fonction."
  - key: code-deux-constructeurs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Point {
      public:
          Point() {
              x_ = 0;
              y_ = 0;
          }
          Point(int x, int y) {
              x_ = x;
              y_ = y;
          }
          int somme() const { return x_ + y_; }

      private:
          int x_;
          int y_;
      };

      int main() {
          Point a;
          Point b{3, 4};
          std::println("{} {}", a.somme(), b.somme());
      }
      ```
    choices:
      - {text: "`0 7`", correct: true}
      - {text: "`7 7`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0 7` : `a` passe par le constructeur sans argument, `b` par celui à deux entiers. Le compilateur choisit d'après les arguments."
    check:
      output: "0 7"
  - key: code-constructeur-affiche
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(int numero) {
              std::println("création {}", numero);
          }
      };

      int main() {
          std::println("début");
          Trace a{1};
          Trace b{2};
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          début
          création 1
          création 2
          fin
          ```
        correct: true
      - text: |-
          ```
          création 1
          création 2
          début
          fin
          ```
        correct: false
      - text: |-
          ```
          début
          fin
          ```
        correct: false
      - text: |-
          ```
          début
          création 2
          création 1
          fin
          ```
        correct: false
    answer: |-
      ```
      début
      création 1
      création 2
      fin
      ```
      Chaque constructeur s'exécute à la ligne où son objet est déclaré, dans l'ordre des déclarations.
    check:
      output: |-
        début
        création 1
        création 2
        fin
  - key: code-sans-constructeur-par-defaut
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) {
              x_ = x;
              y_ = y;
          }
          int x() const { return x_; }

      private:
          int x_;
          int y_;
      };

      int main() {
          Point p;
          std::println("{}", p.x());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : la classe déclare un constructeur, le compilateur n'en fournit donc plus par défaut. `Point p;` n'a pas de constructeur à appeler."
    check:
      compiles: false
  - key: code-vecteur-d-objets
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      class Piece {
      public:
          Piece(int valeur) {
              valeur_ = valeur;
          }
          int valeur() const { return valeur_; }

      private:
          int valeur_;
      };

      int main() {
          std::vector<Piece> pieces{Piece{2}, Piece{5}, Piece{10}};
          int total = 0;
          for (const auto& piece : pieces) {
              total += piece.valeur();
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`17`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`10`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`17` : chaque `Piece{...}` construit un objet, rangé dans le vecteur. La boucle additionne leurs valeurs."
    check:
      output: "17"
  - key: bug-parentheses-vides
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `compte.deposer(100);` : il dit que `compte` est une fonction. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) { solde_ += montant; }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte();
          compte.deposer(100);
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Écrire `Compte compte;`", correct: true}
      - {text: "Écrire `Compte compte(void);`", correct: false}
      - {text: "Écrire `Compte() compte;`", correct: false}
      - {text: "Écrire `Compte compte = ();`", correct: false}
    answer: |-
      ```cpp
      Compte compte;
      ```
      Des parenthèses vides déclarent une fonction sans paramètre, qui renvoie un `Compte`. Pour un objet construit
      par défaut : rien, ou des accolades vides.
  - key: bug-plus-de-constructeur-par-defaut
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'Joueur::Joueur()' ». Un joueur sans nom doit rester
      possible. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Joueur {
      public:
          Joueur(std::string nom) {
              nom_ = nom;
          }
          const std::string& nom() const { return nom_; }

      private:
          std::string nom_ = "anonyme";
      };

      int main() {
          Joueur invite;
          std::println("{}", invite.nom());
      }
      ```
    choices:
      - {text: "Ajouter `Joueur() = default;` à la classe", correct: true}
      - {text: "Ajouter `Joueur() = delete;` à la classe", correct: false}
      - {text: "Écrire `Joueur invite();` dans `main`", correct: false}
      - {text: "Retirer `public:` de la classe", correct: false}
    answer: |-
      ```cpp
      Joueur() = default;
      ```
      Déclarer un constructeur supprime celui que le compilateur générait. `= default` le lui redemande : `nom_` garde
      alors sa valeur par défaut, `"anonyme"`.
  - key: bug-type-de-retour
    format: bug-fix
    question: |-
      Ce code ne compile pas : le compilateur ne trouve pas de constructeur à un argument. Pourquoi ?
      ```cpp
      #include <print>

      class Compte {
      public:
          void Compte(int depot) {
              solde_ = depot;
          }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte{100};
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Un constructeur n'a pas de type de retour : `void` est de trop", correct: true}
      - {text: "Un constructeur doit être déclaré dans la section `private:`", correct: false}
      - {text: "Un constructeur ne peut pas avoir de paramètre", correct: false}
      - {text: "Un constructeur doit s'appeler `init`, pas `Compte`", correct: false}
    answer: |-
      ```cpp
      Compte(int depot) {
          solde_ = depot;
      }
      ```
      Avec un type de retour, ce n'est plus un constructeur, et une fonction membre ne peut pas porter le nom de sa
      classe : le compilateur refuse la déclaration.
  - key: bug-membre-non-initialise
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0`, et affiche un nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Joueur {
      public:
          Joueur(std::string nom) {
              nom_ = nom;
          }
          int score() const { return score_; }

      private:
          std::string nom_;
          int score_;
      };

      int main() {
          Joueur ada{"Ada"};
          std::println("{}", ada.score());
      }
      ```
    choices:
      - {text: "Donner une valeur par défaut au membre : `int score_ = 0;`", correct: true}
      - {text: "Déclarer `score_` avant `nom_` dans la classe", correct: false}
      - {text: "Déclarer `score_` dans la section `public:`", correct: false}
      - {text: "Passer `nom` par référence constante au constructeur", correct: false}
    answer: |-
      ```cpp
      int score_ = 0;
      ```
      Le constructeur n'initialise que `nom_`. `score_`, de type `int`, reste indéterminé. Une valeur par défaut à la
      déclaration du membre protège tous les constructeurs à la fois.
