notion: operateurs-conversion
lesson: |-
  Une classe peut dire comment un de ses objets se **convertit vers un autre type**, par un **opérateur de
  conversion** : une fonction membre nommée `operator Type`, sans type de retour écrit ni paramètre.

  ```cpp
  class Fraction {
  public:
      Fraction(int n, int d) : n_{n}, d_{d} {}
      explicit operator double() const { return static_cast<double>(n_) / d_; }

  private:
      int n_;
      int d_;
  };

  Fraction f{1, 4};
  double x = static_cast<double>(f);    // 0.25
  ```

  C'est le pendant du **constructeur de conversion** : le constructeur convertit **vers** la classe, l'opérateur
  convertit **depuis** la classe.

  **Implicite ou `explicit`.** Sans `explicit`, la conversion se fait **toute seule**, partout où le type cible
  est attendu :

  ```cpp
  operator double() const;          // implicite : double x = f; f + 1; sqrt(f)...
  explicit operator double() const; // explicite : il faut static_cast<double>(f)
  ```

  Les conversions implicites sont une source de bugs : un objet passe pour un nombre dans une expression où l'on
  ne s'y attendait pas, des surcharges deviennent ambiguës. La règle : **`explicit` par défaut**, comme pour les
  constructeurs à un argument.

  **`explicit operator bool` : le cas à connaître.** Il permet de tester un objet dans une condition :

  ```cpp
  class Connexion {
  public:
      explicit operator bool() const { return ouverte_; }
  private:
      bool ouverte_ = false;
  };

  Connexion c;
  if (c) { ... }          // permis
  if (!c) { ... }         // permis
  bool b = c;             // refusé : il faut static_cast<bool>(c)
  int n = c + 1;          // refusé
  ```

  Bien qu'`explicit`, il s'applique dans les **contextes booléens** : `if`, `while`, `for`, `!`, `&&`, `||`,
  l'opérateur `? :`. C'est une **conversion contextuelle**. Partout ailleurs, il faut un cast. C'est ainsi que
  fonctionnent `std::unique_ptr`, `std::optional` et les flux (`if (fichier)`).

  Sans `explicit`, `operator bool` laisserait compiler `c + 1` ou `c1 == c2` (deux booléens comparés) : des
  absurdités silencieuses.

  **Les limites.**

  - Une seule conversion **définie par l'utilisateur** est appliquée implicitement dans une chaîne : pas de
    `A` vers `B` vers `C` automatique.
  - Deux chemins possibles (un constructeur de conversion dans `B`, un opérateur de conversion dans `A`) rendent
    l'appel **ambigu**.
  - Une fonction nommée dit souvent mieux l'intention : `chemin.string()`, `duree.count()`, `texte.c_str()`.

  **En entretien** : « Un opérateur de conversion, `operator T() const`, convertit l'objet vers `T`. Je le déclare
  `explicit` pour éviter les conversions silencieuses. `explicit operator bool` reste utilisable dans un `if` :
  c'est la conversion contextuelle, celle de `std::optional` et des pointeurs intelligents. »
cards:
  - key: role
    format: course
    question: "À quoi sert un opérateur de conversion, comme `operator double() const` ?"
    choices:
      - {text: "À dire comment un objet de la classe se convertit vers un autre type", correct: true}
      - {text: "À dire comment un autre type se convertit vers un objet de la classe", correct: false}
      - {text: "À changer le type des membres de la classe pendant l'exécution", correct: false}
      - {text: "À convertir tous les paramètres des fonctions membres de la classe", correct: false}
    answer: "La conversion part de la classe. Dans l'autre sens, vers la classe, c'est le rôle d'un constructeur à un argument."
  - key: explicit
    format: course
    question: "Que change `explicit` devant un opérateur de conversion ?"
    choices:
      - {text: "La conversion n'est plus faite toute seule : il faut un cast, sauf pour `bool` dans une condition", correct: true}
      - {text: "La conversion est faite à la compilation, et non plus pendant l'exécution du programme", correct: false}
      - {text: "La conversion est interdite : l'opérateur ne peut plus être appelé du tout", correct: false}
      - {text: "La conversion est faite partout où elle est possible, sans que le programmeur l'écrive", correct: false}
    answer: "`explicit` exige `static_cast<T>(objet)`. L'exception est `explicit operator bool`, appliqué de lui-même dans les contextes booléens."
  - key: contextuelle
    format: course
    question: "Dans quels contextes un `explicit operator bool` s'applique-t-il sans cast ?"
    choices:
      - {text: "Dans les conditions : `if`, `while`, `!`, `&&`, `||`, `? :`", correct: true}
      - {text: "Dans les affectations : `bool b = objet;`", correct: false}
      - {text: "Dans les calculs : `objet + 1`", correct: false}
      - {text: "Dans les appels : `f(objet)` où `f` attend un `bool`", correct: false}
    answer: "C'est la conversion contextuelle vers `bool`. Affecter, calculer ou passer en argument demandent un cast explicite."
  - key: pourquoi-explicit-bool
    format: course
    question: "Quel défaut aurait un `operator bool` déclaré sans `explicit` ?"
    choices:
      - {text: "L'objet se convertirait en entier dans un calcul : `objet + 1` compilerait", correct: true}
      - {text: "L'objet ne pourrait plus être testé dans un `if`", correct: false}
      - {text: "L'objet serait copié à chaque test dans une condition", correct: false}
      - {text: "L'objet ne pourrait plus être passé par référence", correct: false}
    answer: "Un `bool` se promeut en `int`. Sans `explicit`, `a + 1`, `a < b` ou `a == b` compilent, en comparant des booléens : un bug muet."
  - key: vf-type-retour
    format: true-false
    question: "Un opérateur de conversion s'écrit sans type de retour devant le mot `operator`."
    truth: true
    answer: "Le type cible est déjà dans le nom : `operator double() const`. Écrire `double operator double()` est une erreur."
  - key: vf-parametres
    format: true-false
    question: "Un opérateur de conversion peut prendre des paramètres."
    truth: false
    answer: "Il n'en prend aucun : il convertit l'objet sur lequel il est appelé."
  - key: vf-if-explicit
    format: true-false
    question: "Un objet dont la classe a un `explicit operator bool` peut être testé par `if (objet)`."
    truth: true
    answer: "La condition d'un `if` est un contexte booléen : la conversion explicite s'y applique."
  - key: vf-chaine
    format: true-false
    question: "Le compilateur enchaîne implicitement deux conversions définies par l'utilisateur, de `A` vers `B` puis vers `C`."
    truth: false
    answer: "Une seule conversion définie par l'utilisateur est permise dans une suite implicite. La seconde doit être écrite."
  - key: qcm-declarer
    format: multiple-choice
    question: "Quelle déclaration permet `static_cast<int>(objet)` sans autoriser de conversion implicite ?"
    choices:
      - {text: "`explicit operator int() const;`", correct: true}
      - {text: "`operator int() const;`", correct: false}
      - {text: "`explicit int operator() const;`", correct: false}
      - {text: "`int operator int() const;`", correct: false}
    answer: "`explicit`, puis `operator` et le type cible. Sans `explicit`, `int n = objet;` compilerait aussi."
  - key: qcm-bibliotheque
    format: multiple-choice
    question: "Lequel de ces types de la bibliothèque standard a un `explicit operator bool` ?"
    choices:
      - {text: "`std::optional<int>`", correct: true}
      - {text: "`std::vector<int>`", correct: false}
      - {text: "`std::string`", correct: false}
      - {text: "`std::pair<int, int>`", correct: false}
    answer: "`if (resultat)` teste qu'il contient une valeur. `std::unique_ptr`, `std::shared_ptr`, `std::function` et les flux font de même."
  - key: qcm-affectation-bool
    format: multiple-choice
    question: "`Connexion` a un `explicit operator bool`. Quelle ligne compile ?"
    choices:
      - {text: "`bool ok = static_cast<bool>(c);`", correct: true}
      - {text: "`bool ok = c;`", correct: false}
      - {text: "`int n = c + 1;`", correct: false}
      - {text: "`bool ok = c == true;`", correct: false}
    answer: "Hors d'une condition, la conversion explicite demande un cast. `!!c` conviendrait aussi, `!` étant un contexte booléen."
  - key: qcm-alternative
    format: multiple-choice
    question: "Qu'utilise `std::string` plutôt qu'un opérateur de conversion vers `const char*` ?"
    choices:
      - {text: "Une fonction nommée : `c_str()`", correct: true}
      - {text: "Un constructeur de `const char*`", correct: false}
      - {text: "Un opérateur `operator*`", correct: false}
      - {text: "Une fonction amie `to_chars`", correct: false}
    answer: "Une conversion implicite aurait rendu trop facile de garder un pointeur vers une chaîne détruite. La fonction nommée rend la conversion visible."
  - key: code-explicite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Fraction {
      public:
          Fraction(int n, int d) : n_{n}, d_{d} {}
          explicit operator double() const { return static_cast<double>(n_) / d_; }

      private:
          int n_;
          int d_;
      };

      int main() {
          const Fraction f{1, 4};
          std::println("{}", static_cast<double>(f) * 2);
      }
      ```
    choices:
      - {text: "`0.5`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`0.25`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0.5` : le cast appelle l'opérateur, qui donne 0.25, multiplié par 2."
    check:
      output: "0.5"
  - key: code-bool-contextuel
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Reservoir {
      public:
          explicit Reservoir(int litres) : litres_{litres} {}
          explicit operator bool() const { return litres_ > 0; }

      private:
          int litres_;
      };

      int main() {
          const Reservoir plein{30};
          const Reservoir vide{0};
          std::println("{} {} {}", plein ? "oui" : "non", !vide, plein && vide);
      }
      ```
    choices:
      - {text: "`oui true false`", correct: true}
      - {text: "`oui false false`", correct: false}
      - {text: "`non true false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`oui true false` : `? :`, `!` et `&&` sont des contextes booléens, où la conversion explicite s'applique."
    check:
      output: "oui true false"
  - key: code-implicite-calcul
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Drapeau {
      public:
          explicit Drapeau(bool leve) : leve_{leve} {}
          operator bool() const { return leve_; }

      private:
          bool leve_;
      };

      int main() {
          const Drapeau a{true};
          const Drapeau b{true};
          std::println("{} {}", a + b, a == b);
      }
      ```
    choices:
      - {text: "`2 true`", correct: true}
      - {text: "`1 true`", correct: false}
      - {text: "`true true`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 true` : sans `explicit`, chaque drapeau devient un `bool`, promu en `int` : 1 + 1. C'est le défaut que `explicit operator bool` empêche."
    check:
      output: "2 true"
  - key: code-explicit-refuse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Drapeau {
      public:
          explicit Drapeau(bool leve) : leve_{leve} {}
          explicit operator bool() const { return leve_; }

      private:
          bool leve_;
      };

      int main() {
          const Drapeau a{true};
          const bool b = a;
          std::println("{}", b);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`true`", correct: false}
      - {text: "`false`", correct: false}
      - {text: "`1`", correct: false}
    answer: "Ça ne compile pas : une initialisation par `=` n'est pas un contexte booléen. Il faut `static_cast<bool>(a)`, ou `const bool b{a};`."
    check:
      compiles: false
  - key: bug-conversion-implicite
    format: bug-fix
    question: |-
      Ce programme devrait refuser de comparer une température à un entier nu. Il compile, et affiche `true`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Celsius {
      public:
          explicit Celsius(int degres) : degres_{degres} {}
          operator int() const { return degres_; }

      private:
          int degres_;
      };

      int main() {
          const Celsius eau{100};
          std::println("{}", eau > 50);
      }
      ```
    choices:
      - {text: "Déclarer `explicit operator int() const`", correct: true}
      - {text: "Déclarer `operator int()` sans `const`", correct: false}
      - {text: "Déclarer `operator double() const` à la place", correct: false}
      - {text: "Déclarer `static operator int() const`", correct: false}
    answer: |-
      ```cpp
      explicit operator int() const { return degres_; }
      ```
      Sans `explicit`, la température se convertit toute seule en entier dans la comparaison. Avec lui, il faut
      écrire `static_cast<int>(eau) > 50` : la conversion se voit.
  - key: bug-type-retour
    format: bug-fix
    question: |-
      Le compilateur répond « return type specified for 'operator double' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Metres {
      public:
          explicit Metres(double valeur) : valeur_{valeur} {}
          explicit double operator double() const { return valeur_; }

      private:
          double valeur_;
      };

      int main() {
          std::println("{}", static_cast<double>(Metres{2.5}));
      }
      ```
    choices:
      - {text: "Écrire `explicit operator double() const { return valeur_; }`", correct: true}
      - {text: "Écrire `explicit double operator() const { return valeur_; }`", correct: false}
      - {text: "Écrire `explicit void operator double() const { return valeur_; }`", correct: false}
      - {text: "Écrire `explicit auto operator double() const { return valeur_; }`", correct: false}
    answer: |-
      ```cpp
      explicit operator double() const { return valeur_; }
      ```
      Le type cible fait partie du nom de l'opérateur : on n'écrit aucun type de retour devant.
  - key: bug-bool-sans-explicit
    format: bug-fix
    question: |-
      Ce programme additionne deux connexions, ce qui n'a aucun sens. Il compile, et affiche `2`. Quelle correction
      fait refuser ce code ?
      ```cpp
      #include <print>

      class Connexion {
      public:
          operator bool() const { return true; }
      };

      int main() {
          const Connexion a;
          const Connexion b;
          std::println("{}", a + b);
      }
      ```
    choices:
      - {text: "Déclarer `explicit operator bool() const`", correct: true}
      - {text: "Déclarer `operator bool() const noexcept`", correct: false}
      - {text: "Déclarer `operator int() const`", correct: false}
      - {text: "Déclarer `virtual operator bool() const`", correct: false}
    answer: |-
      ```cpp
      explicit operator bool() const { return true; }
      ```
      Chaque connexion devient un `bool`, puis un `int`. Avec `explicit`, `if (a)` reste permis, et `a + b` ne
      compile plus.
  - key: bug-ambiguite
    format: bug-fix
    question: |-
      Le compilateur répond « conversion from 'Euros' to 'Dollars' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Dollars;

      struct Euros {
          double montant;
          operator Dollars() const;
      };

      struct Dollars {
          double montant;
          Dollars(double m) : montant{m} {}
          Dollars(const Euros& e) : montant{e.montant * 1.1} {}
      };

      Euros::operator Dollars() const {
          return Dollars{montant * 1.1};
      }

      int main() {
          const Euros e{10.0};
          const Dollars d = e;
          std::println("{}", d.montant);
      }
      ```
    choices:
      - {text: "Ne garder qu'un seul chemin : supprimer l'opérateur de conversion d'`Euros`", correct: true}
      - {text: "Ajouter un second opérateur de conversion dans `Euros`", correct: false}
      - {text: "Déclarer `montant` avec `mutable` dans les deux classes", correct: false}
      - {text: "Écrire `const Dollars d = &e;` dans `main`", correct: false}
    answer: |-
      ```cpp
      struct Euros {
          double montant;
      };
      ```
      Deux conversions mènent d'`Euros` à `Dollars` : le constructeur de `Dollars`, et l'opérateur d'`Euros`. Le
      compilateur refuse de choisir. On n'en garde qu'une.
  - key: trous-operator
    format: fill-in
    question: |-
      Complète pour déclarer la conversion vers `double` :
      ```cpp
      explicit ___ double() const { return valeur_; }
      ```
    blanks:
      - [operator]
    answer: "`operator`, suivi du type cible."
  - key: trous-explicit
    format: fill-in
    question: |-
      Complète pour que l'objet se teste dans un `if`, sans se convertir ailleurs :
      ```cpp
      ___ operator bool() const { return ouverte_; }
      ```
    blanks:
      - [explicit]
    answer: "`explicit operator bool` : permis dans une condition, refusé dans un calcul ou une affectation."
  - key: trous-cast
    format: fill-in
    question: |-
      Complète pour appeler une conversion explicite vers `int` :
      ```cpp
      const int n = ___<int>(objet);
      ```
    blanks:
      - [static_cast]
    answer: "`static_cast` déclenche les conversions explicites, opérateurs comme constructeurs."
  - key: trous-bool
    format: fill-in
    question: |-
      Complète le type cible, pour que `if (connexion)` compile :
      ```cpp
      explicit operator ___() const { return ouverte_; }
      ```
    blanks:
      - [bool]
    answer: "La condition d'un `if` demande une conversion contextuelle vers `bool`."
