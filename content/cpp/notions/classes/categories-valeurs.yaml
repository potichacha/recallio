notion: categories-valeurs
lesson: |-
  Toute expression C++ a un **type** et une **catégorie de valeur**. La catégorie dit deux choses : l'expression
  désigne-t-elle un objet qui a une **identité** (une adresse, un nom) ? Et a-t-on le droit de lui **voler ses
  ressources** ?

  **Les trois catégories de base.**

  | Catégorie | Identité | Déplaçable | Exemples |
  |---|---|---|---|
  | **lvalue** | oui | non | une variable `x`, `*p`, `v[0]`, un appel qui renvoie `T&`, un littéral chaîne |
  | **xvalue** (*expiring value*) | oui | oui | `std::move(x)`, un appel qui renvoie `T&&`, le membre d'un temporaire |
  | **prvalue** (*pure rvalue*) | non | oui | `42`, `a + b`, `Point{1, 2}`, un appel qui renvoie `T` par valeur |

  **Les deux regroupements.**

  ```
          expression
         /          \
     glvalue       rvalue
     /     \       /    \
  lvalue   xvalue      prvalue
  ```

  - **glvalue** (lvalue ou xvalue) : l'expression désigne un objet existant.
  - **rvalue** (xvalue ou prvalue) : on peut en prendre les ressources. C'est ce qu'accepte une référence `T&&`.

  **Les règles qui en découlent.**

  - Une référence **`T&`** ne se lie qu'à une **lvalue**.
  - Une référence **`T&&`** ne se lie qu'à une **rvalue**.
  - Une référence **`const T&`** se lie à tout, et prolonge la vie d'un temporaire.
  - On ne prend l'adresse (`&`) que d'une **lvalue**.

  **Le piège central : une variable est toujours une lvalue.** La catégorie appartient à l'**expression**, pas au
  type de la variable. Un paramètre déclaré `std::string&& s` a pour **type** une référence à une rvalue, mais
  l'expression `s` a un **nom** : c'est une **lvalue**.

  ```cpp
  void ranger(std::string&& s) {
      nom_ = s;               // copie : s est une lvalue
      nom_ = std::move(s);    // déplacement : std::move(s) est une xvalue
  }
  ```

  C'est pourquoi `std::move` est nécessaire même sur un paramètre `&&`. `std::move` ne déplace rien : c'est un cast
  qui transforme une lvalue en **xvalue**.

  **Les prvalues depuis C++17.** Une prvalue n'est plus un objet temporaire, mais une **recette** pour initialiser
  un objet. `T x = f();` construit `x` directement, sans copie ni déplacement : c'est l'élision de copie
  **garantie**. Un temporaire n'est **matérialisé** que lorsqu'il en faut un : pour lier une référence, ou accéder
  à un membre.

  **Les reconnaître.** `decltype((expr))`, avec doubles parenthèses, donne `T&` pour une lvalue, `T&&` pour une
  xvalue, `T` pour une prvalue.

  **En entretien** : « Une lvalue a une identité et ne se déplace pas ; une prvalue est une valeur pure, sans
  identité ; une xvalue a une identité mais va expirer, comme le résultat de `std::move`. Rvalue regroupe xvalue et
  prvalue. Et une variable nommée est toujours une lvalue, même de type `T&&`. »
cards:
  - key: lvalue
    format: course
    question: "Qu'est-ce qui caractérise une lvalue ?"
    choices:
      - {text: "Elle désigne un objet qui a une identité, et dont on peut prendre l'adresse", correct: true}
      - {text: "Elle se trouve toujours à gauche d'un signe d'affectation", correct: false}
      - {text: "Elle désigne une valeur temporaire, détruite à la fin de l'expression", correct: false}
      - {text: "Elle désigne un objet déclaré avec le mot-clé `const`", correct: false}
    answer: "Une variable, un élément de tableau, un pointeur déréférencé : ils désignent un objet durable. Une lvalue constante ne peut d'ailleurs pas être affectée."
  - key: trois-categories
    format: course
    question: "Quelles sont les trois catégories de valeurs de base ?"
    choices:
      - {text: "lvalue, xvalue et prvalue", correct: true}
      - {text: "lvalue, rvalue et glvalue", correct: false}
      - {text: "valeur, référence et pointeur", correct: false}
      - {text: "constante, variable et temporaire", correct: false}
    answer: "Toute expression est exactement l'une des trois. `glvalue` et `rvalue` sont des regroupements : lvalue ou xvalue, xvalue ou prvalue."
  - key: variable-nommee
    format: course
    question: "Dans `void f(std::string&& s)`, quelle est la catégorie de l'expression `s` ?"
    choices:
      - {text: "Une lvalue : elle a un nom, même si son type est une référence à une rvalue", correct: true}
      - {text: "Une xvalue : son type est une référence à une rvalue", correct: false}
      - {text: "Une prvalue : elle a été créée par l'appel de la fonction", correct: false}
      - {text: "Aucune : un paramètre n'a pas de catégorie de valeur", correct: false}
    answer: "La catégorie appartient à l'expression, pas au type. Tout ce qui a un nom est une lvalue ; il faut `std::move(s)` pour en faire une xvalue."
  - key: move
    format: course
    question: "Quelle est la catégorie de l'expression `std::move(x)` ?"
    choices:
      - {text: "Une xvalue : elle désigne `x`, et autorise qu'on lui prenne ses ressources", correct: true}
      - {text: "Une prvalue : `std::move` fabrique un nouvel objet temporaire", correct: false}
      - {text: "Une lvalue : `x` est une variable nommée", correct: false}
      - {text: "Une glvalue qui n'est ni lvalue ni xvalue", correct: false}
    answer: "`std::move` est un cast vers `T&&`. Le résultat garde l'identité de `x` (c'est une glvalue), et devient déplaçable (c'est une rvalue) : une xvalue."
  - key: vf-litteral
    format: true-false
    question: "Le littéral `42` est une prvalue."
    truth: true
    answer: "Une valeur pure, sans identité : on ne peut pas prendre son adresse."
  - key: vf-rvalue-ref-lvalue
    format: true-false
    question: "Une référence `int&&` peut se lier à une variable `int x` sans `std::move`."
    truth: false
    answer: "`x` est une lvalue ; `int&&` n'accepte que des rvalues. Il faut `std::move(x)`."
  - key: vf-const-ref
    format: true-false
    question: "Une référence `const int&` peut se lier à une prvalue comme `42`."
    truth: true
    answer: "Un temporaire est matérialisé, et la référence constante prolonge sa durée de vie."
  - key: vf-adresse
    format: true-false
    question: "On peut prendre l'adresse d'une prvalue avec l'opérateur `&`."
    truth: false
    answer: "`&42` ou `&(a + b)` ne compilent pas : l'opérateur exige une lvalue."
  - key: qcm-appel-par-valeur
    format: multiple-choice
    question: "`std::string nom();` renvoie par valeur. Quelle est la catégorie de l'expression `nom()` ?"
    choices:
      - {text: "prvalue", correct: true}
      - {text: "lvalue", correct: false}
      - {text: "xvalue", correct: false}
      - {text: "glvalue", correct: false}
    answer: "Un appel qui renvoie un type non référence est une prvalue. Avec `T&`, ce serait une lvalue ; avec `T&&`, une xvalue."
  - key: qcm-indice
    format: multiple-choice
    question: "`v` est un `std::vector<int>`. Quelle est la catégorie de l'expression `v[0]` ?"
    choices:
      - {text: "lvalue", correct: true}
      - {text: "prvalue", correct: false}
      - {text: "xvalue", correct: false}
      - {text: "Aucune des trois", correct: false}
    answer: "`operator[]` renvoie `int&` : l'expression désigne l'élément lui-même. On peut écrire `v[0] = 5;`."
  - key: qcm-rvalue
    format: multiple-choice
    question: "Que regroupe le terme « rvalue » ?"
    choices:
      - {text: "Les xvalues et les prvalues", correct: true}
      - {text: "Les lvalues et les xvalues", correct: false}
      - {text: "Les lvalues et les prvalues", correct: false}
      - {text: "Les prvalues seulement", correct: false}
    answer: "Ce sont les expressions dont on peut prendre les ressources. Les lvalues et les xvalues, elles, forment les glvalues."
  - key: qcm-decltype
    format: multiple-choice
    question: "`int x = 0;` Que donne `decltype((x))`, avec ses doubles parenthèses ?"
    choices:
      - {text: "`int&`, car l'expression `x` est une lvalue", correct: true}
      - {text: "`int`, car `x` est déclarée `int`", correct: false}
      - {text: "`int&&`, car `x` peut être déplacée", correct: false}
      - {text: "`const int&`, car `decltype` ajoute `const`", correct: false}
    answer: "Avec des parenthèses en plus, `decltype` examine l'expression : `T&` pour une lvalue, `T&&` pour une xvalue, `T` pour une prvalue. Sans elles, `decltype(x)` donne le type déclaré, `int`."
  - key: situation-copie-inattendue
    format: scenario
    question: |-
      Un constructeur `Client(std::string&& nom) : nom_{nom} {}` reçoit bien un temporaire, et pourtant le profileur
      montre une copie de la chaîne. Pourquoi ?
    choices:
      - {text: "Dans le constructeur, `nom` est une lvalue : il faut écrire `nom_{std::move(nom)}`", correct: true}
      - {text: "Une référence `&&` copie toujours son argument à l'entrée de la fonction", correct: false}
      - {text: "Le membre `nom_` devrait être déclaré `std::string&&` lui aussi", correct: false}
      - {text: "Le compilateur n'a pas activé l'élision de copie pour les chaînes", correct: false}
    answer: |-
      Le paramètre a un nom : l'expression `nom` est une lvalue, quel que soit son type. C'est le constructeur de
      copie qui est choisi. `std::move(nom)` en refait une xvalue, et la chaîne est déplacée.
  - key: situation-reference-refusee
    format: scenario
    question: |-
      Une fonction `void normaliser(std::string& texte)` refuse l'appel `normaliser(lire_ligne())`, où `lire_ligne`
      renvoie une `std::string` par valeur. Un collègue ne comprend pas l'erreur. Que lui expliques-tu ?
    choices:
      - {text: "`lire_ligne()` est une prvalue, et une référence non constante ne se lie qu'à une lvalue", correct: true}
      - {text: "`lire_ligne()` est une lvalue, et une référence non constante ne se lie qu'à une rvalue", correct: false}
      - {text: "`lire_ligne()` renvoie une chaîne constante, qu'on ne peut pas modifier", correct: false}
      - {text: "`normaliser` devrait recevoir un pointeur, seul capable de désigner un temporaire", correct: false}
    answer: |-
      Modifier un temporaire qui va disparaître n'a presque jamais de sens : le langage l'interdit. On range la
      ligne dans une variable, qui est une lvalue, ou la fonction renvoie le texte normalisé.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « `std::move` déplace-t-il son argument ? » Quelle réponse s'appuie sur les
      catégories de valeurs ?
    choices:
      - {text: "Non : il convertit une lvalue en xvalue ; c'est le constructeur de déplacement qui déplace", correct: true}
      - {text: "Oui : il transfère les octets de l'objet vers un temporaire", correct: false}
      - {text: "Oui : il transforme l'objet en prvalue, donc en nouvel objet", correct: false}
      - {text: "Non : il copie l'objet, puis détruit l'original", correct: false}
    answer: |-
      `std::move(x)` est un `static_cast<T&&>(x)`. L'expression devient une rvalue, ce qui permet à la résolution de
      surcharge de choisir le constructeur ou l'affectation de déplacement.
  - key: situation-surcharge
    format: scenario
    question: |-
      Une classe a deux surcharges : `void ajouter(const Article& a)` et `void ajouter(Article&& a)`. Tu appelles
      `ajouter(article)` avec une variable locale, puis `ajouter(Article{"stylo"})`. Lesquelles sont choisies ?
    choices:
      - {text: "La version `const Article&` pour la variable, la version `Article&&` pour le temporaire", correct: true}
      - {text: "La version `Article&&` dans les deux cas, car elle est plus précise", correct: false}
      - {text: "La version `const Article&` dans les deux cas, car elle accepte tout", correct: false}
      - {text: "Aucune : l'appel est ambigu dans les deux cas", correct: false}
    answer: |-
      La variable est une lvalue : seule la référence constante s'y lie. Le temporaire est une prvalue : les deux
      conviennent, et `Article&&` est préférée. C'est ainsi que `push_back` copie les variables et déplace les
      temporaires.
  - key: definition-xvalue
    format: definition
    question: "Qu'est-ce qu'une xvalue ?"
    choices:
      - {text: "Une expression qui désigne un objet existant dont on peut prendre les ressources", correct: true}
      - {text: "Une expression qui désigne un objet existant qu'on ne peut pas déplacer", correct: false}
      - {text: "Une expression qui calcule une valeur sans désigner d'objet", correct: false}
      - {text: "Une expression dont la valeur est connue à la compilation", correct: false}
    answer: "*Expiring value* : elle a une identité, comme une lvalue, et se déplace, comme une prvalue. `std::move(x)` en est l'exemple type."
  - key: definition-prvalue
    format: definition
    question: "Qu'est-ce qu'une prvalue ?"
    choices:
      - {text: "Une valeur pure, sans identité, qui sert à initialiser un objet", correct: true}
      - {text: "Une variable privée d'une classe", correct: false}
      - {text: "Une référence vers un objet sur le point d'expirer", correct: false}
      - {text: "Un objet nommé qu'on peut modifier", correct: false}
    answer: "*Pure rvalue* : un littéral, le résultat d'une addition, un appel qui renvoie par valeur. Depuis C++17, elle initialise directement sa destination."
  - key: definition-glvalue
    format: definition
    question: "Qu'est-ce qu'une glvalue ?"
    choices:
      - {text: "Une expression qui désigne un objet : une lvalue ou une xvalue", correct: true}
      - {text: "Une expression qu'on peut déplacer : une xvalue ou une prvalue", correct: false}
      - {text: "Une variable globale utilisée comme lvalue", correct: false}
      - {text: "Une lvalue déclarée avec le mot-clé `const`", correct: false}
    answer: "*Generalized lvalue* : l'expression a une identité. Elle s'oppose à la prvalue, qui n'en a pas."
  - key: definition-materialisation
    format: definition
    question: "Qu'appelle-t-on la matérialisation d'un temporaire ?"
    choices:
      - {text: "La création d'un objet temporaire à partir d'une prvalue, quand il en faut un", correct: true}
      - {text: "La copie d'une variable locale vers le tas", correct: false}
      - {text: "La destruction d'un temporaire à la fin de l'expression", correct: false}
      - {text: "La conversion d'une lvalue en xvalue par `std::move`", correct: false}
    answer: "Lier une référence à une prvalue, ou accéder à un de ses membres, exige un objet : la prvalue est alors convertie en xvalue."
  - key: code-surcharge
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      const char* categorie(const std::string&) { return "lvalue"; }
      const char* categorie(std::string&&) { return "rvalue"; }

      int main() {
          std::string s = "abc";
          std::println("{} {} {}", categorie(s), categorie(std::move(s)), categorie(std::string{"x"}));
      }
      ```
    choices:
      - {text: "`lvalue rvalue rvalue`", correct: true}
      - {text: "`lvalue lvalue rvalue`", correct: false}
      - {text: "`rvalue rvalue rvalue`", correct: false}
      - {text: "`lvalue rvalue lvalue`", correct: false}
    answer: "`lvalue rvalue rvalue` : `s` est une lvalue ; `std::move(s)` est une xvalue et le temporaire une prvalue, deux rvalues."
    check:
      output: "lvalue rvalue rvalue"
  - key: code-parametre-nomme
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      const char* categorie(const std::string&) { return "lvalue"; }
      const char* categorie(std::string&&) { return "rvalue"; }

      void transmettre(std::string&& s) {
          std::println("{} {}", categorie(s), categorie(std::move(s)));
      }

      int main() {
          transmettre(std::string{"abc"});
      }
      ```
    choices:
      - {text: "`lvalue rvalue`", correct: true}
      - {text: "`rvalue rvalue`", correct: false}
      - {text: "`rvalue lvalue`", correct: false}
      - {text: "`lvalue lvalue`", correct: false}
    answer: "`lvalue rvalue` : dans la fonction, `s` a un nom, c'est une lvalue malgré son type `&&`. `std::move(s)` en refait une rvalue."
    check:
      output: "lvalue rvalue"
  - key: code-decltype
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <type_traits>
      #include <utility>

      int main() {
          int x = 0;
          std::println("{} {} {}",
                       std::is_lvalue_reference_v<decltype((x))>,
                       std::is_rvalue_reference_v<decltype((std::move(x)))>,
                       std::is_reference_v<decltype((x + 1))>);
      }
      ```
    choices:
      - {text: "`true true false`", correct: true}
      - {text: "`true false false`", correct: false}
      - {text: "`false true true`", correct: false}
      - {text: "`true true true`", correct: false}
    answer: "`true true false` : `decltype((expr))` donne `T&` pour une lvalue, `T&&` pour une xvalue, et `T` sans référence pour la prvalue `x + 1`."
    check:
      output: "true true false"
  - key: code-prolongation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Trace {
          ~Trace() { std::println("fin"); }
      };

      Trace creer() {
          return Trace{};
      }

      int main() {
          const Trace& t = creer();
          std::print("milieu ");
          static_cast<void>(t);
      }
      ```
    choices:
      - {text: "`milieu fin`", correct: true}
      - {text: "`fin milieu`", correct: false}
      - {text: "`fin`, puis `milieu fin`", correct: false}
      - {text: "`milieu`", correct: false}
    answer: "`milieu fin` : la prvalue `creer()` est matérialisée en un temporaire, dont la référence constante prolonge la vie jusqu'à la fin de `main`."
    check:
      output: "milieu fin"
