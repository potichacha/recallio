notion: initialisation-membres-defaut
lesson: |-
  Quand une classe a plusieurs constructeurs, chacun doit initialiser tous les membres. Deux outils évitent de
  répéter les mêmes valeurs : la **valeur par défaut d'un membre**, et le **constructeur délégué**.

  **La valeur par défaut d'un membre.** On l'écrit à la déclaration du membre :

  ```cpp
  class Connexion {
  public:
      Connexion() = default;
      explicit Connexion(std::string hote) : hote_{std::move(hote)} {}

  private:
      std::string hote_ = "localhost";
      int port_ = 8080;
      bool chiffree_{false};
  };
  ```

  Elle s'applique dans **tout constructeur qui n'initialise pas ce membre** dans sa liste d'initialisation. Ici, le
  second constructeur fixe `hote_`, et laisse `port_` et `chiffree_` à leurs valeurs par défaut.

  **La liste d'initialisation l'emporte.** Si un constructeur initialise le membre, la valeur par défaut est
  **ignorée** : elle n'est pas appliquée « d'abord ». Le membre n'est initialisé qu'une fois.

  **La syntaxe.** `= valeur` ou `{valeur}`, jamais des parenthèses : `int port_(8080);` serait lu comme une
  déclaration de fonction.

  **Ce qu'on y gagne.** Un membre de type fondamental sans valeur par défaut, oublié par un constructeur, reste
  **non initialisé**. Avec une valeur par défaut, l'oubli est impossible. La règle pratique : **donner une valeur
  par défaut à chaque membre de type fondamental**.

  **Le constructeur délégué.** Un constructeur peut en **appeler un autre** de la même classe, depuis sa liste
  d'initialisation :

  ```cpp
  class Rectangle {
  public:
      Rectangle(int largeur, int hauteur) : largeur_{largeur}, hauteur_{hauteur} {
          // validation, écrite une seule fois
      }
      explicit Rectangle(int cote) : Rectangle{cote, cote} {}
      Rectangle() : Rectangle{1, 1} {}

  private:
      int largeur_;
      int hauteur_;
  };
  ```

  Les règles :

  - la délégation doit être **seule** dans la liste : on ne peut pas déléguer **et** initialiser un membre ;
  - le constructeur cible s'exécute **en entier**, puis le corps du constructeur délégant ;
  - deux constructeurs qui se délèguent l'un à l'autre forment une boucle sans fin : le programme est mal formé,
    sans diagnostic exigé.

  **L'ordre ne change pas.** Valeurs par défaut ou liste, les membres sont toujours initialisés dans l'**ordre de
  leur déclaration** dans la classe. Une valeur par défaut peut donc se servir d'un membre déclaré **avant** elle.

  **Lequel choisir.** Des valeurs fixes : valeurs par défaut des membres. Une logique commune (validation,
  calcul) : un constructeur complet, auquel les autres délèguent.

  **En entretien** : « Je donne une valeur par défaut à chaque membre, à sa déclaration : elle vaut pour tout
  constructeur qui ne l'initialise pas, et la liste d'initialisation la remplace. Pour partager de la logique entre
  constructeurs, je délègue à un constructeur principal. »
cards:
  - key: valeur-par-defaut
    format: course
    question: "Quand la valeur par défaut d'un membre, écrite à sa déclaration, est-elle utilisée ?"
    choices:
      - {text: "Dans tout constructeur qui n'initialise pas ce membre dans sa liste", correct: true}
      - {text: "Dans tous les constructeurs, avant leur liste d'initialisation", correct: false}
      - {text: "Seulement dans le constructeur par défaut de la classe", correct: false}
      - {text: "Seulement quand l'objet est créé avec `new`", correct: false}
    answer: "Elle comble les oublis : chaque constructeur ne mentionne que les membres qu'il veut initialiser autrement."
  - key: liste-prioritaire
    format: course
    question: "Un membre a une valeur par défaut, et un constructeur l'initialise aussi dans sa liste. Que se passe-t-il ?"
    choices:
      - {text: "Seule la liste s'applique : la valeur par défaut est ignorée", correct: true}
      - {text: "La valeur par défaut s'applique d'abord, puis la liste la remplace", correct: false}
      - {text: "La valeur par défaut l'emporte : la liste est ignorée", correct: false}
      - {text: "Le compilateur refuse cette double initialisation", correct: false}
    answer: "Un membre n'est initialisé qu'une fois. La liste d'initialisation remplace la valeur par défaut, elle ne s'y ajoute pas."
  - key: delegation
    format: course
    question: "Qu'est-ce qu'un constructeur délégué ?"
    choices:
      - {text: "Un constructeur qui appelle un autre constructeur de la même classe, dans sa liste d'initialisation", correct: true}
      - {text: "Un constructeur qui appelle le constructeur de la classe de base, dans sa liste d'initialisation", correct: false}
      - {text: "Un constructeur que le compilateur génère quand la classe n'en déclare aucun", correct: false}
      - {text: "Un constructeur qui copie les membres d'un autre objet de la même classe", correct: false}
    answer: "`Rectangle(int cote) : Rectangle{cote, cote} {}` : la logique d'initialisation n'est écrite que dans le constructeur cible."
  - key: delegation-seule
    format: course
    question: "Que peut contenir la liste d'initialisation d'un constructeur qui délègue ?"
    choices:
      - {text: "Seulement l'appel de l'autre constructeur", correct: true}
      - {text: "L'appel de l'autre constructeur, puis des membres", correct: false}
      - {text: "Des membres, puis l'appel de l'autre constructeur", correct: false}
      - {text: "Deux appels à deux autres constructeurs", correct: false}
    answer: "Le constructeur cible initialise déjà tous les membres. Ajouter un membre à la liste est une erreur de compilation."
  - key: vf-parentheses
    format: true-false
    question: "Une valeur par défaut de membre peut s'écrire avec des parenthèses : `int port_(8080);`."
    truth: false
    answer: "Seules les formes `= valeur` et `{valeur}` sont permises. Des parenthèses ressembleraient à une déclaration de fonction."
  - key: vf-ordre
    format: true-false
    question: "Avec des valeurs par défaut, les membres sont toujours initialisés dans l'ordre de leur déclaration."
    truth: true
    answer: "L'ordre de déclaration dans la classe fait foi, que les valeurs viennent de la liste ou des valeurs par défaut."
  - key: vf-corps
    format: true-false
    question: "Lors d'une délégation, le corps du constructeur délégant s'exécute avant celui du constructeur cible."
    truth: false
    answer: "Le constructeur cible s'exécute en entier d'abord, corps compris. Le corps du délégant vient ensuite."
  - key: vf-non-initialise
    format: true-false
    question: "Un membre `int` sans valeur par défaut, qu'un constructeur n'initialise pas, vaut zéro."
    truth: false
    answer: "Il reste non initialisé : le lire est un comportement indéfini. D'où l'intérêt de donner une valeur par défaut à chaque membre."
  - key: qcm-ecrire
    format: multiple-choice
    question: "Quelle ligne donne la valeur par défaut 8080 au membre `port_` ?"
    choices:
      - {text: "`int port_ = 8080;`", correct: true}
      - {text: "`int port_(8080);`", correct: false}
      - {text: "`int port_ : 8080;`", correct: false}
      - {text: "`default int port_ 8080;`", correct: false}
    answer: "`= 8080` ou `{8080}`. Les parenthèses sont interdites à cet endroit."
  - key: qcm-deleguer
    format: multiple-choice
    question: "Quelle ligne fait déléguer le constructeur par défaut de `Point` au constructeur `Point(int, int)` ?"
    choices:
      - {text: "`Point() : Point{0, 0} {}`", correct: true}
      - {text: "`Point() { Point{0, 0}; }`", correct: false}
      - {text: "`Point() = Point{0, 0};`", correct: false}
      - {text: "`Point() : this{0, 0} {}`", correct: false}
    answer: "La délégation s'écrit dans la liste d'initialisation. Dans le corps, `Point{0, 0};` créerait un objet temporaire, aussitôt détruit."
  - key: qcm-default
    format: multiple-choice
    question: "Tous les membres ont une valeur par défaut. Comment demandes-tu le constructeur sans argument, sans rien écrire dans son corps ?"
    choices:
      - {text: "`Connexion() = default;`", correct: true}
      - {text: "`Connexion() = delete;`", correct: false}
      - {text: "`Connexion() = 0;`", correct: false}
      - {text: "`default Connexion();`", correct: false}
    answer: "`= default` demande la version générée, qui applique les valeurs par défaut des membres."
  - key: qcm-choisir
    format: multiple-choice
    question: "Trois constructeurs doivent tous valider les dimensions reçues. Où écris-tu la validation ?"
    choices:
      - {text: "Dans un constructeur complet, auquel les deux autres délèguent", correct: true}
      - {text: "Dans la valeur par défaut de chaque membre", correct: false}
      - {text: "Dans chacun des trois constructeurs, recopiée", correct: false}
      - {text: "Dans le destructeur de la classe", correct: false}
    answer: "La délégation partage de la logique. Les valeurs par défaut ne conviennent qu'à des valeurs fixes."
  - key: trous-valeur
    format: fill-in
    question: |-
      Complète pour que le membre vaille `false` dans tout constructeur qui ne l'initialise pas :
      ```cpp
      class Connexion {
          bool chiffree_ ___ false;
      };
      ```
    blanks:
      - ["="]
    answer: "`= false`, ou bien `{false}`."
  - key: trous-delegation
    format: fill-in
    question: |-
      Complète pour déléguer au constructeur à deux paramètres :
      ```cpp
      explicit Rectangle(int cote) : ___{cote, cote} {}
      ```
    blanks:
      - [Rectangle]
    answer: "On nomme la classe elle-même dans la liste d'initialisation."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour demander le constructeur par défaut généré :
      ```cpp
      Connexion() = ___;
      ```
    blanks:
      - [default]
    answer: "`= default` : les membres prennent leurs valeurs par défaut."
  - key: trous-accolades
    format: fill-in
    question: |-
      Complète la valeur par défaut, écrite avec des accolades :
      ```cpp
      class Jauge {
          int niveau_{___};
      };
      // Jauge{} a un niveau de 100
      ```
    blanks:
      - ["100"]
    answer: "`int niveau_{100};` : la valeur entre accolades."
  - key: code-valeurs
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Connexion {
      public:
          Connexion() = default;
          explicit Connexion(int port) : port_{port} {}
          int port() const { return port_; }
          int essais() const { return essais_; }

      private:
          int port_ = 8080;
          int essais_ = 3;
      };

      int main() {
          const Connexion a;
          const Connexion b{443};
          std::println("{} {} {} {}", a.port(), a.essais(), b.port(), b.essais());
      }
      ```
    choices:
      - {text: "`8080 3 443 3`", correct: true}
      - {text: "`8080 3 443 0`", correct: false}
      - {text: "`8080 3 8080 3`", correct: false}
      - {text: "`0 0 443 3`", correct: false}
    answer: "`8080 3 443 3` : `a` prend les deux valeurs par défaut. `b` fixe le port dans sa liste, et garde la valeur par défaut des essais."
    check:
      output: "8080 3 443 3"
  - key: code-delegation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Rectangle {
      public:
          Rectangle(int largeur, int hauteur) : largeur_{largeur}, hauteur_{hauteur} {
              std::print("complet ");
          }
          explicit Rectangle(int cote) : Rectangle{cote, cote} {
              std::print("carré ");
          }
          int aire() const { return largeur_ * hauteur_; }

      private:
          int largeur_;
          int hauteur_;
      };

      int main() {
          const Rectangle r{4};
          std::println("{}", r.aire());
      }
      ```
    choices:
      - {text: "`complet carré 16`", correct: true}
      - {text: "`carré complet 16`", correct: false}
      - {text: "`carré 16`", correct: false}
      - {text: "`complet 16`", correct: false}
    answer: "`complet carré 16` : le constructeur cible s'exécute en entier, puis le corps du constructeur délégant."
    check:
      output: "complet carré 16"
  - key: code-une-seule-fois
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int suivant() {
          static int n = 0;
          return ++n;
      }

      class Ticket {
      public:
          Ticket() = default;
          explicit Ticket(int numero) : numero_{numero} {}
          int numero() const { return numero_; }

      private:
          int numero_ = suivant();
      };

      int main() {
          const Ticket a;
          const Ticket b{50};
          const Ticket c;
          std::println("{} {} {}", a.numero(), b.numero(), c.numero());
      }
      ```
    choices:
      - {text: "`1 50 2`", correct: true}
      - {text: "`1 50 3`", correct: false}
      - {text: "`1 2 3`", correct: false}
      - {text: "`1 50 1`", correct: false}
    answer: "`1 50 2` : pour `b`, la liste initialise le membre, donc la valeur par défaut n'est pas évaluée : `suivant()` n'est appelée que deux fois."
    check:
      output: "1 50 2"
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Boite {
      public:
          Boite() = default;
          explicit Boite(int largeur) : largeur_{largeur} {}
          int surface() const { return surface_; }

      private:
          int largeur_ = 2;
          int surface_ = largeur_ * largeur_;
      };

      int main() {
          std::println("{} {}", Boite{}.surface(), Boite{5}.surface());
      }
      ```
    choices:
      - {text: "`4 25`", correct: true}
      - {text: "`4 4`", correct: false}
      - {text: "`0 25`", correct: false}
      - {text: "`4 0`", correct: false}
    answer: "`4 25` : `largeur_` est déclaré avant `surface_`, donc initialisé avant. La valeur par défaut de `surface_` se calcule avec la largeur déjà en place."
    check:
      output: "4 25"
  - key: bug-membre-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `0`. Il affiche un nombre imprévisible : le second constructeur oublie
      `essais_`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Connexion {
      public:
          Connexion() : port_{8080}, essais_{0} {}
          explicit Connexion(int port) : port_{port} {}
          int essais() const { return essais_; }

      private:
          int port_;
          int essais_;
      };

      int main() {
          const Connexion c{443};
          std::println("{}", c.essais());
      }
      ```
    choices:
      - {text: "Donner une valeur par défaut au membre : `int essais_ = 0;`", correct: true}
      - {text: "Déclarer le membre `static int essais_;`", correct: false}
      - {text: "Déclarer le membre `mutable int essais_;`", correct: false}
      - {text: "Retirer `explicit` du second constructeur", correct: false}
    answer: |-
      ```cpp
      int port_ = 8080;
      int essais_ = 0;
      ```
      Le membre oublié reste non initialisé : le lire est un comportement indéfini. Avec une valeur par défaut à la
      déclaration, aucun constructeur ne peut plus l'oublier.
  - key: bug-delegation-dans-le-corps
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3 3`. Il affiche `0 0` : l'appel écrit dans le corps n'initialise pas l'objet.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) : x_{x}, y_{y} {}
          explicit Point(int v) {
              Point{v, v};
          }
          int x() const { return x_; }
          int y() const { return y_; }

      private:
          int x_ = 0;
          int y_ = 0;
      };

      int main() {
          const Point p{3};
          std::println("{} {}", p.x(), p.y());
      }
      ```
    choices:
      - {text: "Déléguer dans la liste : `explicit Point(int v) : Point{v, v} {}`", correct: true}
      - {text: "Écrire `this = Point{v, v};` dans le corps du constructeur", correct: false}
      - {text: "Écrire `return Point{v, v};` dans le corps du constructeur", correct: false}
      - {text: "Écrire `Point(v, v);` dans le corps du constructeur", correct: false}
    answer: |-
      ```cpp
      explicit Point(int v) : Point{v, v} {}
      ```
      Dans le corps, `Point{v, v};` crée un objet temporaire, détruit à la fin de la ligne : l'objet en
      construction n'est pas touché. La délégation se fait dans la liste d'initialisation.
  - key: bug-delegation-et-membre
    format: bug-fix
    question: |-
      Le compilateur répond « mem-initializer for 'Rectangle::nom_' follows constructor delegation ». Quelle
      correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Rectangle {
      public:
          Rectangle(int largeur, int hauteur) : largeur_{largeur}, hauteur_{hauteur} {}
          explicit Rectangle(int cote) : Rectangle{cote, cote}, nom_{"carré"} {}
          const std::string& nom() const { return nom_; }

      private:
          int largeur_;
          int hauteur_;
          std::string nom_ = "rectangle";
      };

      int main() {
          std::println("{}", Rectangle{2}.nom());
      }
      ```
    choices:
      - {text: "Affecter le nom dans le corps : `: Rectangle{cote, cote} { nom_ = \"carré\"; }`", correct: true}
      - {text: "Placer `nom_{\"carré\"}` avant la délégation, dans la liste", correct: false}
      - {text: "Retirer la valeur par défaut `= \"rectangle\"` du membre", correct: false}
      - {text: "Déclarer le membre `nom_` avant `largeur_`", correct: false}
    answer: |-
      ```cpp
      explicit Rectangle(int cote) : Rectangle{cote, cote} { nom_ = "carré"; }
      ```
      Une délégation doit être seule dans la liste : le constructeur cible a déjà initialisé tous les membres. Ce
      qui reste à changer se fait dans le corps, par affectation.
  - key: bug-parentheses
    format: bug-fix
    question: |-
      Le compilateur refuse la déclaration `int niveau_(100);` : il attend un type, pas une valeur. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      class Jauge {
      public:
          int niveau() const { return niveau_; }

      private:
          int niveau_(100);
      };

      int main() {
          std::println("{}", Jauge{}.niveau());
      }
      ```
    choices:
      - {text: "Écrire `int niveau_{100};`", correct: true}
      - {text: "Écrire `int niveau_[100];`", correct: false}
      - {text: "Écrire `int niveau_ : 100;`", correct: false}
      - {text: "Écrire `int niveau_<100>;`", correct: false}
    answer: |-
      ```cpp
      int niveau_{100};
      ```
      Une valeur par défaut de membre s'écrit avec `=` ou des accolades. Avec des parenthèses, le compilateur lit
      la déclaration d'une fonction membre. `[100]` déclarerait un tableau, et `: 100` un champ de bits.
