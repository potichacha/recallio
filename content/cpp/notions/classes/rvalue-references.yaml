notion: rvalue-references
lesson: |-
  Toute expression est soit une **lvalue**, soit une **rvalue**.

  - Une **lvalue** désigne un objet qui **a un nom** et qui **dure** : une variable, un élément de tableau. On peut
    prendre son adresse.
  - Une **rvalue** est une **valeur temporaire**, sans nom, qui disparaît à la fin de l'instruction : un littéral, le
    résultat de `a + b`, l'objet renvoyé par une fonction.

  ```cpp
  int x = 5;        // x est une lvalue ; 5 est une rvalue
  int y = x + 1;    // x + 1 est une rvalue
  ```

  **Trois sortes de références.**

  | Référence | Se lie à | Usage |
  |---|---|---|
  | `T&` | une lvalue | modifier l'objet de l'appelant |
  | `const T&` | une lvalue **ou** une rvalue | lire sans copier |
  | **`T&&`** (C++11) | une **rvalue** seulement | reconnaître un temporaire |

  Une **référence rvalue**, `T&&`, ne se lie qu'à un temporaire : `int&& r = 5;` compile, `int&& r = x;` non.

  **À quoi elle sert.** À **surcharger** une fonction selon que son argument est un objet durable ou un temporaire :

  ```cpp
  void ranger(const std::string& texte);   // lvalue : il faut copier
  void ranger(std::string&& texte);        // rvalue : personne d'autre ne s'en servira, on peut la vider
  ```

  Puisqu'un temporaire va disparaître, on peut lui **prendre ses ressources** au lieu de les copier. C'est la
  **sémantique de déplacement**, et les constructeurs de déplacement sont des fonctions qui prennent un `T&&`.

  **Le piège.** Une référence rvalue **qui a un nom est elle-même une lvalue**. Dans `void f(std::string&& s)`, `s`
  est une variable : pour la repasser comme rvalue, il faut `std::move(s)`.

  `std::move(x)` ne déplace rien : il **convertit** `x` en rvalue, pour qu'une surcharge `T&&` puisse la recevoir.

  (Dans un template, `T&&` avec `T` déduit est une *référence de transfert*, qui se lie à tout : c'est une autre
  notion.)

  **En entretien** : « Une rvalue est un temporaire ; `T&&` s'y lie, ce qui permet de surcharger pour voler ses
  ressources. Mais une référence rvalue nommée est une lvalue : il faut `std::move` pour la transmettre. »
cards:
  - key: lvalue-ou-rvalue
    format: course
    question: "Qu'est-ce qu'une rvalue ?"
    choices:
      - {text: "Une valeur temporaire, sans nom, qui disparaît à la fin de l'instruction", correct: true}
      - {text: "Une variable qui a un nom, et dont on peut prendre l'adresse", correct: false}
      - {text: "Une valeur qui ne peut pas être copiée", correct: false}
      - {text: "Une valeur qui se trouve à droite d'un point-virgule", correct: false}
    answer: "Un littéral, le résultat d'un calcul, l'objet renvoyé par valeur par une fonction. Une variable nommée est une lvalue."
  - key: liaison-de-rvalue-reference
    format: course
    question: "À quoi une référence rvalue, `T&&`, peut-elle se lier ?"
    choices:
      - {text: "À une rvalue seulement : un temporaire", correct: true}
      - {text: "À une lvalue seulement : une variable nommée", correct: false}
      - {text: "À une lvalue ou à une rvalue, indifféremment", correct: false}
      - {text: "À un pointeur seulement", correct: false}
    answer: "`int&& r = 5;` compile ; `int&& r = x;`, avec `x` une variable, ne compile pas. C'est `const T&` qui se lie aux deux."
  - key: a-quoi-elle-sert
    format: course
    question: "À quoi sert de surcharger une fonction pour `const T&` et pour `T&&` ?"
    choices:
      - {text: "À traiter autrement un temporaire, dont on peut prendre les ressources", correct: true}
      - {text: "À traiter autrement une constante, qu'on peut alors modifier", correct: false}
      - {text: "À traiter autrement un pointeur, qu'on peut alors libérer", correct: false}
      - {text: "À rien : les deux surcharges reçoivent les mêmes arguments", correct: false}
    answer: "La version `T&&` reçoit les temporaires : comme ils vont disparaître, elle peut les vider au lieu de les copier. La version `const T&` reçoit les objets durables, qu'elle copie."
  - key: reference-nommee
    format: course
    question: "Dans `void f(std::string&& s)`, que vaut `s` à l'intérieur de la fonction ?"
    choices:
      - {text: "Une lvalue : elle a un nom, même si son type est une référence rvalue", correct: true}
      - {text: "Une rvalue : son type est une référence rvalue", correct: false}
      - {text: "Une copie de l'argument, indépendante de lui", correct: false}
      - {text: "Une constante, qu'on ne peut plus modifier", correct: false}
    answer: "Tout ce qui a un nom est une lvalue. Pour passer `s` à une fonction qui prend une rvalue, il faut `std::move(s)`."
  - key: vf-variable
    format: true-false
    question: "Une variable nommée `x` est une lvalue."
    truth: true
    answer: Elle a un nom, une adresse, et dure au-delà de l'instruction.
  - key: vf-liaison-a-une-variable
    format: true-false
    question: "`int x = 5; int&& r = x;` compile."
    truth: false
    answer: "Une référence rvalue ne se lie pas à une lvalue. Il faudrait `int&& r = std::move(x);`."
  - key: vf-const-ref
    format: true-false
    question: "Une référence `const T&` peut se lier à une rvalue."
    truth: true
    answer: C'est la seule référence lvalue qui accepte un temporaire, dont elle prolonge la vie.
  - key: vf-move-deplace
    format: true-false
    question: "`std::move(x)` déplace `x` à l'instant où il est appelé."
    truth: false
    answer: C'est une conversion en rvalue. Le déplacement a lieu, s'il a lieu, dans la fonction qui reçoit cette rvalue.
  - key: qcm-laquelle-est-rvalue
    format: multiple-choice
    question: "Avec `int a = 2; int b = 3;`, laquelle de ces expressions est une rvalue ?"
    choices:
      - {text: "`a + b`", correct: true}
      - {text: "`a`", correct: false}
      - {text: "`b`", correct: false}
      - {text: "`a = b`", correct: false}
    answer: "`a + b` est un résultat temporaire, sans nom. `a` et `b` sont des variables ; `a = b` désigne `a`, c'est une lvalue."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Comment s'écrit une référence rvalue vers un `int` ?"
    choices:
      - {text: "`int&&`", correct: true}
      - {text: "`int&`", correct: false}
      - {text: "`int**`", correct: false}
      - {text: "`rvalue int`", correct: false}
    answer: "Deux esperluettes. Une seule fait une référence lvalue."
  - key: qcm-surcharge-choisie
    format: multiple-choice
    question: "Avec `void f(const std::string&);` et `void f(std::string&&);`, quelle version l'appel `f(prenom + \"!\")` choisit-il ?"
    choices:
      - {text: "La version `std::string&&` : l'argument est un temporaire", correct: true}
      - {text: "La version `const std::string&` : elle accepte tout", correct: false}
      - {text: "Aucune : l'appel est ambigu", correct: false}
      - {text: "La version déclarée en premier", correct: false}
    answer: "`prenom + \"!\"` est une rvalue. Les deux versions pourraient la recevoir, et la référence rvalue est préférée. Pour une variable, seule la version `const&` convient."
  - key: qcm-transmettre
    format: multiple-choice
    question: "Dans `void f(std::string&& s)`, comment passer `s` à une fonction `g(std::string&&)` ?"
    choices:
      - {text: "`g(std::move(s));`", correct: true}
      - {text: "`g(s);`", correct: false}
      - {text: "`g(&&s);`", correct: false}
      - {text: "`g(*s);`", correct: false}
    answer: "`s` a un nom : c'est une lvalue, que `g` refuse. `std::move(s)` la convertit en rvalue."
  - key: code-surcharges
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void decrire(const int&) { std::println("lvalue"); }
      void decrire(int&&) { std::println("rvalue"); }

      int main() {
          int x = 5;
          decrire(x);
          decrire(5);
          decrire(x + 1);
      }
      ```
    choices:
      - text: |-
          ```
          lvalue
          rvalue
          rvalue
          ```
        correct: true
      - text: |-
          ```
          lvalue
          lvalue
          lvalue
          ```
        correct: false
      - text: |-
          ```
          lvalue
          rvalue
          lvalue
          ```
        correct: false
      - text: |-
          ```
          rvalue
          rvalue
          rvalue
          ```
        correct: false
    answer: |-
      ```
      lvalue
      rvalue
      rvalue
      ```
      `x` est une variable : lvalue. Le littéral `5` et le résultat de `x + 1` sont des temporaires : rvalues.
    check:
      output: |-
        lvalue
        rvalue
        rvalue
  - key: code-reference-rvalue
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int&& r = 5;
          r += 1;
          std::println("{}", r);
      }
      ```
    choices:
      - {text: "`6`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`6` : la référence rvalue se lie au temporaire, dont elle prolonge la vie. Elle n'est pas constante : on peut le modifier."
    check:
      output: "6"
  - key: code-liaison-refusee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          int x = 1;
          int&& r = x;
          std::println("{}", r);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `x` est une lvalue, et une référence rvalue ne s'y lie pas (« cannot bind rvalue reference to lvalue »)."
    check:
      compiles: false
  - key: code-reference-nommee
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      void decrire(const int&) { std::println("lvalue"); }
      void decrire(int&&) { std::println("rvalue"); }

      void transmettre(int&& valeur) {
          decrire(valeur);
          decrire(std::move(valeur));
      }

      int main() {
          transmettre(5);
      }
      ```
    choices:
      - text: |-
          ```
          lvalue
          rvalue
          ```
        correct: true
      - text: |-
          ```
          rvalue
          rvalue
          ```
        correct: false
      - text: |-
          ```
          lvalue
          lvalue
          ```
        correct: false
      - text: |-
          ```
          rvalue
          lvalue
          ```
        correct: false
    answer: |-
      ```
      lvalue
      rvalue
      ```
      `valeur` a un nom : c'est une lvalue, bien que son type soit `int&&`. `std::move(valeur)` en refait une rvalue.
    check:
      output: |-
        lvalue
        rvalue
  - key: bug-liaison-a-une-variable
    format: bug-fix
    question: |-
      Le compilateur répond « cannot bind rvalue reference of type 'int&&' to lvalue of type 'int' ». Le programme
      veut seulement un autre nom pour `score`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int score = 10;
          int&& alias = score;
          alias += 5;
          std::println("{}", score);
      }
      ```
    choices:
      - {text: "Écrire `int& alias = score;`", correct: true}
      - {text: "Écrire `int&& alias = &score;`", correct: false}
      - {text: "Écrire `int&&& alias = score;`", correct: false}
      - {text: "Écrire `const int&& alias = score;`", correct: false}
    answer: |-
      ```cpp
      int& alias = score;
      ```
      `score` est une variable, donc une lvalue : un alias s'écrit avec une référence lvalue, `int&`. La référence
      rvalue est faite pour les temporaires.
  - key: bug-reference-lvalue-vers-temporaire
    format: bug-fix
    question: |-
      Ce code ne compile pas. Le programme veut garder le résultat du calcul, et pouvoir le modifier. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          int a = 2;
          int b = 3;
          int& somme = a + b;
          somme += 1;
          std::println("{}", somme);
      }
      ```
    choices:
      - {text: "Écrire `int somme = a + b;`", correct: true}
      - {text: "Écrire `const int& somme = a + b;`", correct: false}
      - {text: "Écrire `int* somme = a + b;`", correct: false}
      - {text: "Écrire `int& somme = &(a + b);`", correct: false}
    answer: |-
      ```cpp
      int somme = a + b;
      ```
      `a + b` est une rvalue : une référence lvalue non constante ne s'y lie pas. Une `const int&` s'y lierait, mais
      interdirait `somme += 1;`. Une variable ordinaire est ce qu'il faut ; `int&& somme = a + b;` compilerait aussi.
  - key: bug-rvalue-nommee
    format: bug-fix
    question: |-
      Ce programme affiche `copie`, alors que l'auteur attendait `déplacement`. Pourquoi ?
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      void ranger(Trace&& recue) {
          Trace gardee = recue;
      }

      int main() {
          ranger(Trace{});
      }
      ```
    choices:
      - {text: "`recue` a un nom : c'est une lvalue, qui appelle le constructeur de copie", correct: true}
      - {text: "`Trace{}` est une lvalue, que `ranger` ne peut pas déplacer", correct: false}
      - {text: "Le constructeur de déplacement n'est appelé que dans `main`", correct: false}
      - {text: "`noexcept` désactive le constructeur de déplacement", correct: false}
    answer: |-
      ```cpp
      Trace gardee = std::move(recue);
      ```
      Une référence rvalue nommée est une lvalue. Pour transmettre le droit de la déplacer, il faut le redire avec
      `std::move`.
  - key: bug-retour-reference-rvalue
    format: bug-fix
    question: |-
      Ce programme compile, puis plante ou affiche des caractères imprévisibles. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      std::string&& titre() {
          std::string resultat = "Le Tour de C++, deuxième édition";
          return std::move(resultat);
      }

      int main() {
          std::string texte = titre();
          std::println("{}", texte);
      }
      ```
    choices:
      - {text: "Renvoyer par valeur : `std::string titre()`, avec `return resultat;`", correct: true}
      - {text: "Renvoyer une référence lvalue : `std::string& titre()`", correct: false}
      - {text: "Renvoyer une référence constante : `const std::string& titre()`", correct: false}
      - {text: "Déclarer `resultat` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      std::string titre() {
          std::string resultat = "Le Tour de C++, deuxième édition";
          return resultat;
      }
      ```
      Une référence rvalue reste une référence : `resultat` est détruite à la fin de la fonction, et la référence
      renvoyée pend. Par valeur, la chaîne est remise à l'appelant sans copie.
  - key: trous-esperluettes
    format: fill-in
    question: |-
      Complète pour déclarer une référence rvalue :
      ```cpp
      int___ r = 5;
      ```
    blanks:
      - ["&&"]
    answer: "`int&& r = 5;` : deux esperluettes, et un temporaire à droite."
  - key: trous-surcharge
    format: fill-in
    question: |-
      Complète la surcharge qui reçoit les temporaires :
      ```cpp
      void ranger(const std::string& texte);
      void ranger(std::string___ texte);
      ```
    blanks:
      - ["&&"]
    answer: "`std::string&&` : cette version n'est choisie que pour une rvalue."
  - key: trous-move
    format: fill-in
    question: |-
      Complète pour que la référence rvalue puisse se lier à la variable :
      ```cpp
      int x = 5;
      int&& r = std::___(x);
      ```
    blanks:
      - [move]
    answer: "`std::move(x)` convertit `x` en rvalue."
  - key: trous-categorie
    format: fill-in
    question: |-
      Complète le commentaire avec la lettre qui manque :
      ```cpp
      int x = 5;       // x est une lvalue
      int y = x + 1;   // x + 1 est une ___value
      ```
    blanks:
      - [r]
    answer: "`x + 1` est un résultat temporaire : une rvalue."
