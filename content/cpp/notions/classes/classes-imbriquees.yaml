notion: classes-imbriquees
lesson: |-
  Une classe peut être **définie à l'intérieur d'une autre** : c'est une classe **imbriquée**. Elle sert à ranger
  un type qui n'a de sens que pour la classe qui l'entoure : le nœud d'une liste, l'itérateur d'un conteneur.

  ```cpp
  class Liste {
  public:
      class Iterateur { /* ... */ };       // publique : Liste::Iterateur

  private:
      struct Noeud {                        // privée : invisible de l'extérieur
          int valeur;
          Noeud* suivant;
      };
      Noeud* tete_ = nullptr;
  };

  Liste::Iterateur it;                      // on la nomme avec ::
  ```

  **Ce qu'il faut savoir.**

  - Le nom de la classe imbriquée vit dans la **portée** de la classe englobante : de l'extérieur, on écrit
    `Liste::Iterateur`.
  - Elle obéit aux **spécificateurs d'accès** : imbriquée dans la partie `private`, elle est inutilisable hors de
    la classe.
  - Un objet imbriqué **ne contient pas** d'objet englobant, et n'a **aucun pointeur caché** vers lui (à la
    différence des classes internes de Java). Pour agir sur un objet englobant, il lui en faut une référence ou un
    pointeur, reçus explicitement.
  - La classe imbriquée est **membre** de l'englobante : à ce titre, elle a accès à ses membres **privés**, sur un
    objet qu'on lui donne. L'inverse n'est pas vrai : l'englobante ne voit pas les membres privés de l'imbriquée.
  - Elle peut être définie **hors** de l'englobante : `class Liste::Iterateur { ... };`, après une déclaration
    `class Iterateur;` dans `Liste`.

  **Les classes locales.** Une classe peut aussi être définie **dans une fonction**. Elle n'est visible que là.

  ```cpp
  int somme_des_carres(const std::vector<int>& v) {
      struct Accumulateur {
          int total = 0;
          void ajouter(int x) { total += x * x; }
      };
      Accumulateur a;
      for (int x : v) { a.ajouter(x); }
      return a.total;
  }
  ```

  Une classe locale **ne peut pas** utiliser les variables locales de la fonction (seulement les variables
  statiques, les types et les énumérations), ni avoir de membre template, ni de membre de données statique. Depuis
  C++11, une **lambda** remplace presque toujours cet usage.

  **Quand imbriquer.** Quand le type est un **détail d'implémentation** (on le met en `private`), ou qu'il
  appartient à l'interface de la classe au point de porter son nom : `std::vector<int>::iterator`,
  `std::string::npos`.

  **En entretien** : « Une classe imbriquée est un type dans la portée d'une autre classe : `Externe::Interne`.
  Elle voit les membres privés de l'englobante, mais n'a pas de pointeur implicite vers un objet englobant,
  contrairement à Java. J'y range les détails d'implémentation, comme le nœud d'une liste. »
cards:
  - key: nommer
    format: course
    question: "Comment nomme-t-on, depuis l'extérieur, la classe `Iterateur` imbriquée dans la partie publique de `Liste` ?"
    choices:
      - {text: "`Liste::Iterateur`", correct: true}
      - {text: "`Liste.Iterateur`", correct: false}
      - {text: "`Iterateur<Liste>`", correct: false}
      - {text: "`Liste->Iterateur`", correct: false}
    answer: "Le nom de la classe imbriquée appartient à la portée de la classe englobante : on y accède avec `::`."
  - key: pas-de-pointeur
    format: course
    question: "Un objet d'une classe imbriquée a-t-il accès à l'objet englobant qui l'a créé ?"
    choices:
      - {text: "Non : il n'a aucun lien implicite ; il faut lui passer une référence ou un pointeur", correct: true}
      - {text: "Oui : il garde un pointeur caché vers l'objet englobant, comme en Java", correct: false}
      - {text: "Oui : il est une copie de l'objet englobant, avec des membres en plus", correct: false}
      - {text: "Oui : le mot-clé `this` y désigne toujours l'objet englobant", correct: false}
    answer: "L'imbrication ne concerne que les noms et les droits d'accès. Les objets, eux, sont indépendants."
  - key: acces-prives
    format: course
    question: "Une classe imbriquée peut-elle lire les membres privés de la classe englobante ?"
    choices:
      - {text: "Oui, sur un objet englobant qu'on lui donne : elle est membre de cette classe", correct: true}
      - {text: "Non : elle n'a pas plus de droits qu'une classe extérieure", correct: false}
      - {text: "Oui, mais seulement si elle est déclarée `friend`", correct: false}
      - {text: "Non, sauf si elle hérite de la classe englobante", correct: false}
    answer: "Comme tout membre, elle a accès aux membres privés de la classe englobante. La réciproque est fausse : l'englobante ne voit pas ceux de l'imbriquée."
  - key: classe-locale
    format: course
    question: "Qu'est-ce qu'une classe locale ?"
    choices:
      - {text: "Une classe définie dans le corps d'une fonction, visible seulement là", correct: true}
      - {text: "Une classe dont tous les objets sont créés sur la pile", correct: false}
      - {text: "Une classe définie dans un fichier `.cpp`, sans en-tête", correct: false}
      - {text: "Une classe dont tous les membres sont privés", correct: false}
    answer: "Elle ne peut pas utiliser les variables locales de la fonction, ni avoir de membre template. Une lambda la remplace le plus souvent."
  - key: vf-privee
    format: true-false
    question: "Une classe imbriquée dans la partie `private` peut être nommée depuis l'extérieur de la classe englobante."
    truth: false
    answer: "Les spécificateurs d'accès s'appliquent aussi aux types imbriqués : son nom est inaccessible hors de la classe."
  - key: vf-englobante-voit
    format: true-false
    question: "La classe englobante a accès aux membres privés de sa classe imbriquée."
    truth: false
    answer: "L'accès ne va que dans un sens : l'imbriquée voit l'englobante. Pour l'inverse, l'imbriquée déclare l'englobante amie, ou reste une `struct`."
  - key: vf-taille
    format: true-false
    question: "Définir une classe imbriquée augmente la taille des objets de la classe englobante."
    truth: false
    answer: "Une classe imbriquée est une déclaration de type, pas un membre de données. La taille ne change que si l'on déclare un membre de ce type."
  - key: vf-locale-variables
    format: true-false
    question: "Une classe locale peut utiliser les variables locales non statiques de la fonction qui la contient."
    truth: false
    answer: "Elle n'y a pas accès. C'est la différence avec une lambda, qui les capture."
  - key: qcm-definition-externe
    format: multiple-choice
    question: "`Liste` déclare `class Noeud;` dans son corps. Comment définit-on `Noeud` hors de `Liste` ?"
    choices:
      - {text: "`class Liste::Noeud { ... };`", correct: true}
      - {text: "`class Noeud : Liste { ... };`", correct: false}
      - {text: "`class Liste.Noeud { ... };`", correct: false}
      - {text: "`class Noeud in Liste { ... };`", correct: false}
    answer: "Le nom qualifié `Liste::Noeud` rattache la définition à la déclaration faite dans `Liste`."
  - key: qcm-usage
    format: multiple-choice
    question: "Lequel de ces types de la bibliothèque standard est un type imbriqué ?"
    choices:
      - {text: "`std::vector<int>::iterator`", correct: true}
      - {text: "`std::vector<int>`", correct: false}
      - {text: "`std::size_t`", correct: false}
      - {text: "`std::string_view`", correct: false}
    answer: "`iterator` est déclaré dans `std::vector`, d'où le `::`. Chaque conteneur a le sien."
  - key: qcm-detail
    format: multiple-choice
    question: "Où déclares-tu la `struct Noeud` d'une liste chaînée, qui ne concerne pas les utilisateurs de la liste ?"
    choices:
      - {text: "Dans la partie `private` de la classe `Liste`", correct: true}
      - {text: "Dans la partie `public` de la classe `Liste`", correct: false}
      - {text: "Dans l'espace de noms global, avant `Liste`", correct: false}
      - {text: "Dans la fonction `main`", correct: false}
    answer: "C'est un détail d'implémentation : imbriqué et privé, il ne fuit pas dans l'interface, et peut changer librement."
  - key: qcm-remplacer-locale
    format: multiple-choice
    question: "Par quoi remplace-t-on le plus souvent une classe locale munie d'un `operator()` ?"
    choices:
      - {text: "Par une lambda", correct: true}
      - {text: "Par une macro", correct: false}
      - {text: "Par une variable globale", correct: false}
      - {text: "Par une classe amie", correct: false}
    answer: "Une lambda est un objet fonction local, qui peut en plus capturer les variables de la fonction."
  - key: trous-portee
    format: fill-in
    question: |-
      Complète pour déclarer un objet du type imbriqué :
      ```cpp
      Liste___Iterateur it;
      ```
    blanks:
      - ["::"]
    answer: "On qualifie le nom du type imbriqué avec `::`."
  - key: trous-struct
    format: fill-in
    question: |-
      Complète pour imbriquer le type du nœud dans la liste :
      ```cpp
      class Liste {
      private:
          ___ Noeud {
              int valeur;
              Noeud* suivant;
          };
          Noeud* tete_ = nullptr;
      };
      ```
    blanks:
      - [struct, class]
    answer: "Une `struct` imbriquée dans la partie privée : ses champs sont publics pour la liste, et invisibles du dehors."
  - key: trous-definition
    format: fill-in
    question: |-
      Complète pour définir hors de la classe la fonction membre du type imbriqué :
      ```cpp
      int Liste::___::valeur() const {
          return valeur_;
      }
      ```
    blanks:
      - [Iterateur]
    answer: "Le nom complet de la fonction est `Liste::Iterateur::valeur`."
  - key: trous-auto
    format: fill-in
    question: |-
      Complète pour laisser le compilateur écrire le type imbriqué à ta place :
      ```cpp
      ___ it = liste.debut();
      ```
    blanks:
      - [auto]
    answer: "`auto` évite d'écrire `Liste::Iterateur` : c'est l'usage courant avec les itérateurs."
  - key: code-nom-qualifie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Externe {
      public:
          struct Interne {
              int valeur = 7;
          };
          Interne creer() const { return Interne{}; }
      };

      int main() {
          Externe::Interne a;
          const auto b = Externe{}.creer();
          std::println("{}", a.valeur + b.valeur);
      }
      ```
    choices:
      - {text: "`14`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`14` : le type imbriqué est public, on le nomme `Externe::Interne`. Chaque objet vaut 7."
    check:
      output: "14"
  - key: code-acces-prive
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Coffre {
      public:
          class Clef {
          public:
              int lire(const Coffre& c) const { return c.secret_; }
          };

      private:
          int secret_ = 99;
      };

      int main() {
          std::println("{}", Coffre::Clef{}.lire(Coffre{}));
      }
      ```
    choices:
      - {text: "`99`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`99` : la classe imbriquée est membre de `Coffre`, elle peut lire `secret_` sur l'objet qu'on lui passe."
    check:
      output: "99"
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Externe {
          struct Interne {
              int a;
              int b;
          };
          int x;
      };

      int main() {
          std::println("{} {}", sizeof(Externe) == sizeof(int), sizeof(Externe::Interne) == 2 * sizeof(int));
      }
      ```
    choices:
      - {text: "`true true`", correct: true}
      - {text: "`false true`", correct: false}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
    answer: "`true true` : définir `Interne` ne crée aucun membre dans `Externe`, qui ne contient que `x`. `Interne` contient ses deux entiers."
    check:
      output: "true true"
  - key: code-locale
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int somme_des_carres(int n) {
          struct Accumulateur {
              int total = 0;
              void ajouter(int x) { total += x * x; }
          };
          Accumulateur a;
          for (int i = 1; i <= n; ++i) {
              a.ajouter(i);
          }
          return a.total;
      }

      int main() {
          std::println("{}", somme_des_carres(3));
      }
      ```
    choices:
      - {text: "`14`", correct: true}
      - {text: "`6`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`14` : la classe locale accumule 1 + 4 + 9. Elle n'existe que dans la fonction."
    check:
      output: "14"
  - key: bug-nom-non-qualifie
    format: bug-fix
    question: |-
      Le compilateur répond « 'Noeud' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Liste {
      public:
          struct Noeud {
              int valeur = 5;
          };
      };

      int main() {
          Noeud n;
          std::println("{}", n.valeur);
      }
      ```
    choices:
      - {text: "Écrire `Liste::Noeud n;`", correct: true}
      - {text: "Écrire `Liste.Noeud n;`", correct: false}
      - {text: "Écrire `struct Noeud n;`", correct: false}
      - {text: "Écrire `Noeud::Liste n;`", correct: false}
    answer: |-
      ```cpp
      Liste::Noeud n;
      ```
      Hors de `Liste`, le type imbriqué se nomme avec la portée de sa classe.
  - key: bug-type-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'struct Liste::Noeud' is private within this context ». `main` a besoin de ce type.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Liste {
          struct Noeud {
              int valeur = 5;
          };
      };

      int main() {
          Liste::Noeud n;
          std::println("{}", n.valeur);
      }
      ```
    choices:
      - {text: "Placer `struct Noeud` sous un `public:` dans `Liste`", correct: true}
      - {text: "Écrire `Noeud n;` sans le préfixe `Liste::`", correct: false}
      - {text: "Écrire `private Liste::Noeud n;` dans `main`", correct: false}
      - {text: "Remplacer `struct Noeud` par `class Noeud`", correct: false}
    answer: |-
      ```cpp
      class Liste {
      public:
          struct Noeud {
              int valeur = 5;
          };
      };
      ```
      Dans une `class`, tout est privé par défaut, types imbriqués compris. Pour qu'il serve à l'extérieur, le type
      doit être public.
  - key: bug-membre-englobant
    format: bug-fix
    question: |-
      Le compilateur répond « invalid use of non-static data member 'Compteur::total_' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          class Afficheur {
          public:
              int lire() const { return total_; }
          };

      private:
          int total_ = 3;
      };

      int main() {
          std::println("{}", Compteur::Afficheur{}.lire());
      }
      ```
    choices:
      - {text: "Passer le compteur à `lire` : `int lire(const Compteur& c) const { return c.total_; }`", correct: true}
      - {text: "Écrire `return this->total_;` dans la fonction `lire` de `Afficheur`", correct: false}
      - {text: "Écrire `return Compteur::total_;` dans la fonction `lire` de `Afficheur`", correct: false}
      - {text: "Déclarer la classe `Afficheur` dans la partie `private` de `Compteur`", correct: false}
    answer: |-
      ```cpp
      int lire(const Compteur& c) const { return c.total_; }
      ```
      Un `Afficheur` n'est attaché à aucun `Compteur` : `total_` n'a pas d'objet. Il faut lui donner le compteur à
      lire ; l'appel devient `Compteur::Afficheur{}.lire(Compteur{})`.
  - key: bug-locale-variable
    format: bug-fix
    question: |-
      Le compilateur refuse `facteur` dans la classe locale : « use of local variable with automatic storage from
      containing function ». Quelle correction est la plus simple ?
      ```cpp
      #include <print>

      int tripler(int n) {
          int facteur = 3;
          struct Calcul {
              int appliquer(int x) const { return x * facteur; }
          };
          return Calcul{}.appliquer(n);
      }

      int main() {
          std::println("{}", tripler(4));
      }
      ```
    choices:
      - {text: "Remplacer la classe par une lambda : `auto appliquer = [facteur](int x) { return x * facteur; };`", correct: true}
      - {text: "Déclarer la classe locale `Calcul` avec le mot-clé `friend` devant `struct`", correct: false}
      - {text: "Déclarer la fonction `appliquer` avec le mot-clé `mutable` à la place de `const`", correct: false}
      - {text: "Déplacer la déclaration de `facteur` après la définition de la classe locale", correct: false}
    answer: |-
      ```cpp
      int facteur = 3;
      auto appliquer = [facteur](int x) { return x * facteur; };
      return appliquer(n);
      ```
      Une classe locale ne voit pas les variables locales de la fonction. Une lambda les capture : c'est l'outil
      fait pour cela.
