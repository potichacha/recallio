notion: destructeur
lesson: |-
  Le **destructeur** est la fonction appelée **automatiquement quand un objet est détruit**. Il porte le nom de la
  classe précédé d'un **tilde**, n'a ni paramètre ni type de retour, et il n'y en a qu'un par classe.

  ```cpp
  class Fichier {
  public:
      Fichier(const char* nom) { std::println("ouverture de {}", nom); }
      ~Fichier() { std::println("fermeture"); }
  };

  int main() {
      Fichier f{"notes.txt"};
      std::println("travail");
  }   // ~Fichier() est appelé ici
  ```

  **Quand il est appelé.**

  - Pour une **variable locale** : à la **fin de son bloc**, à l'accolade fermante, y compris si l'on sort par
    `return` ou par une exception.
  - Pour un **temporaire** : à la fin de l'instruction qui l'a créé.
  - Pour un objet créé avec `new` : au moment du `delete`.
  - Pour une variable globale ou `static` : à la fin du programme.

  On ne l'appelle **jamais soi-même**.

  **L'ordre.** Les objets sont détruits dans l'**ordre inverse de leur construction** : le dernier créé est le
  premier détruit. C'est logique : un objet peut dépendre de ceux qui existaient avant lui.

  Dans une classe, le corps du destructeur s'exécute d'abord, puis les **membres** sont détruits, dans l'ordre
  inverse de leur déclaration.

  **À quoi il sert.** À **libérer ce que l'objet a acquis** : fermer un fichier, rendre de la mémoire, relâcher un
  verrou. Comme l'appel est garanti et placé à un endroit précis, la ressource ne peut pas être oubliée : c'est le
  principe du **RAII**.

  Si l'on n'écrit pas de destructeur, le compilateur en génère un, qui détruit les membres. La plupart des classes
  n'ont donc pas besoin d'en écrire : `std::string` et `std::vector` se nettoient seuls.

  **En entretien** : « Le destructeur est appelé de façon déterministe, à la fin de la portée, dans l'ordre inverse de
  la construction. C'est ce qui remplace le ramasse-miettes en C++ : la libération des ressources est attachée à la
  durée de vie des objets. »
tour:
  - title: Le destructeur
    text: |-
      Le destructeur, `~Classe()`, s'exécute tout seul quand l'objet disparaît : pour une variable locale, à la fin de
      son bloc. C'est là qu'un objet rend ce qu'il a pris : un fichier, de la mémoire, un verrou.

      Les objets sont détruits dans l'ordre **inverse** de leur création.

      Essaie : entoure la déclaration de `b` d'accolades `{ }`, puis exécute. `b` est détruit dès la fin de ce bloc.
    example:
      files:
        main.cpp: |-
          #include <print>

          class Trace {
          public:
              Trace(const char* nom) : nom_{nom} {
                  std::println("création de {}", nom_);
              }

              ~Trace() {
                  std::println("destruction de {}", nom_);
              }

          private:
              const char* nom_;
          };

          int main() {
              Trace a{"a"};
              Trace b{"b"};
              std::println("fin de main");
          }
      output: |-
        création de a
        création de b
        fin de main
        destruction de b
        destruction de a
cards:
  - key: role-du-destructeur
    format: course
    question: À quoi sert le destructeur d'une classe ?
    choices:
      - {text: "À libérer ce que l'objet a acquis, quand il est détruit", correct: true}
      - {text: "À initialiser les membres de l'objet, quand il est créé", correct: false}
      - {text: "À copier l'objet, quand on le passe à une fonction", correct: false}
      - {text: "À supprimer la classe de la mémoire, à la fin du programme", correct: false}
    answer: "Il s'exécute à la destruction de chaque objet : c'est l'endroit où fermer un fichier, rendre de la mémoire, relâcher un verrou."
  - key: moment-de-l-appel
    format: course
    question: Quand le destructeur d'une variable locale est-il appelé ?
    choices:
      - {text: "À la fin du bloc où elle est déclarée", correct: true}
      - {text: "À la fin du programme, avec tous les autres", correct: false}
      - {text: "Quand le ramasse-miettes constate qu'elle ne sert plus", correct: false}
      - {text: "Après sa dernière utilisation dans le bloc", correct: false}
    answer: "À l'accolade fermante de son bloc, quelle que soit la façon d'en sortir : fin normale, `return` ou exception. C++ n'a pas de ramasse-miettes."
  - key: ordre-de-destruction
    format: course
    question: Dans quel ordre les variables locales d'un bloc sont-elles détruites ?
    choices:
      - {text: "Dans l'ordre inverse de leur construction", correct: true}
      - {text: "Dans l'ordre de leur construction", correct: false}
      - {text: "Dans l'ordre alphabétique de leurs noms", correct: false}
      - {text: "Dans un ordre que le compilateur choisit", correct: false}
    answer: "La dernière construite est la première détruite. Un objet peut ainsi compter, jusqu'à sa fin, sur ceux qui existaient avant lui."
  - key: destructeur-genere
    format: course
    question: "Que se passe-t-il si une classe n'écrit pas de destructeur ?"
    choices:
      - {text: "Le compilateur en génère un, qui détruit les membres", correct: true}
      - {text: "Ses objets ne sont jamais détruits", correct: false}
      - {text: "Le code ne compile pas", correct: false}
      - {text: "Ses membres doivent être détruits à la main", correct: false}
    answer: "Le destructeur généré appelle celui de chaque membre. Une classe faite de `std::string` et de `std::vector` n'a donc rien à écrire."
  - key: vf-parametres
    format: true-false
    question: Un destructeur peut recevoir des paramètres.
    truth: false
    answer: Il n'a ni paramètre ni type de retour, et il n'y en a qu'un par classe.
  - key: vf-appel-automatique
    format: true-false
    question: Le destructeur d'une variable locale est appelé même quand on quitte le bloc par un `return`.
    truth: true
    answer: Toute sortie du bloc détruit ses variables locales, y compris une exception.
  - key: vf-appel-a-la-main
    format: true-false
    question: "Il faut appeler soi-même le destructeur d'une variable locale, à la fin de son bloc."
    truth: false
    answer: L'appel est automatique. L'appeler à la main le ferait s'exécuter deux fois.
  - key: vf-membres-apres-le-corps
    format: true-false
    question: Les membres d'un objet sont détruits après l'exécution du corps de son destructeur.
    truth: true
    answer: Le corps s'exécute d'abord, sur un objet encore complet. Les membres sont ensuite détruits, dans l'ordre inverse de leur déclaration.
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Comment déclare-t-on le destructeur de la classe `Fichier` ?"
    choices:
      - {text: "`~Fichier();`", correct: true}
      - {text: "`void ~Fichier();`", correct: false}
      - {text: "`!Fichier();`", correct: false}
      - {text: "`delete Fichier();`", correct: false}
    answer: "Un tilde, puis le nom de la classe, sans type de retour ni paramètre."
  - key: qcm-temporaire
    format: multiple-choice
    question: Quand un objet temporaire est-il détruit ?
    choices:
      - {text: "À la fin de l'instruction qui l'a créé", correct: true}
      - {text: "À la fin du bloc où il a été créé", correct: false}
      - {text: "À la fin de la fonction où il a été créé", correct: false}
      - {text: "À la fin du programme", correct: false}
    answer: "Au point-virgule de l'instruction. Seule une référence constante liée directement à lui prolonge sa vie."
  - key: qcm-principe
    format: multiple-choice
    question: Quel principe repose sur l'appel garanti du destructeur ?
    choices:
      - {text: "Le RAII : une ressource est libérée quand l'objet qui la possède est détruit", correct: true}
      - {text: "La surcharge : plusieurs fonctions portent le même nom", correct: false}
      - {text: "L'encapsulation : les données d'une classe sont privées", correct: false}
      - {text: "Le polymorphisme : un appel choisit sa fonction à l'exécution", correct: false}
    answer: "RAII : acquérir dans le constructeur, libérer dans le destructeur. La ressource suit la durée de vie de l'objet, et ne peut pas être oubliée."
  - key: qcm-nombre
    format: multiple-choice
    question: Combien de destructeurs une classe peut-elle avoir ?
    choices:
      - {text: "Un seul", correct: true}
      - {text: "Un par constructeur", correct: false}
      - {text: "Autant qu'on veut, surchargés", correct: false}
      - {text: "Aucun : il est toujours généré", correct: false}
    answer: "Un seul, sans paramètre : il ne peut donc pas être surchargé."
  - key: code-ordre-inverse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(int numero) : numero_{numero} {}
          ~Trace() { std::print("{}", numero_); }

      private:
          int numero_;
      };

      int main() {
          Trace a{1};
          Trace b{2};
          Trace c{3};
      }
      ```
    choices:
      - {text: "`321`", correct: true}
      - {text: "`123`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "`3`", correct: false}
    answer: "`321` : à la fin de `main`, les trois objets sont détruits dans l'ordre inverse de leur construction."
    check:
      output: "321"
  - key: code-bloc
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(const char* nom) : nom_{nom} {}
          ~Trace() { std::println("fin de {}", nom_); }

      private:
          const char* nom_;
      };

      int main() {
          Trace a{"a"};
          {
              Trace b{"b"};
          }
          std::println("suite");
      }
      ```
    choices:
      - text: |-
          ```
          fin de b
          suite
          fin de a
          ```
        correct: true
      - text: |-
          ```
          suite
          fin de b
          fin de a
          ```
        correct: false
      - text: |-
          ```
          suite
          fin de a
          fin de b
          ```
        correct: false
      - text: |-
          ```
          fin de b
          fin de a
          suite
          ```
        correct: false
    answer: |-
      ```
      fin de b
      suite
      fin de a
      ```
      `b` est détruit à la fin de son bloc intérieur, avant l'affichage. `a` vit jusqu'à la fin de `main`.
    check:
      output: |-
        fin de b
        suite
        fin de a
  - key: code-return
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          ~Trace() { std::println("nettoyage"); }
      };

      int calculer(int n) {
          Trace trace;
          if (n < 0) {
              return -1;
          }
          std::println("calcul");
          return n * 2;
      }

      int main() {
          std::println("{}", calculer(-5));
      }
      ```
    choices:
      - text: |-
          ```
          nettoyage
          -1
          ```
        correct: true
      - text: |-
          ```
          -1
          nettoyage
          ```
        correct: false
      - {text: "`-1`", correct: false}
      - text: |-
          ```
          calcul
          nettoyage
          -1
          ```
        correct: false
    answer: |-
      ```
      nettoyage
      -1
      ```
      Le `return` anticipé quitte la fonction : `trace` est détruite à ce moment, avant que `main` affiche le
      résultat.
    check:
      output: |-
        nettoyage
        -1
  - key: code-membres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(const char* nom) : nom_{nom} {}
          ~Trace() { std::println("{}", nom_); }

      private:
          const char* nom_;
      };

      class Voiture {
      public:
          ~Voiture() { std::println("voiture"); }

      private:
          Trace moteur_{"moteur"};
          Trace roues_{"roues"};
      };

      int main() {
          Voiture voiture;
      }
      ```
    choices:
      - text: |-
          ```
          voiture
          roues
          moteur
          ```
        correct: true
      - text: |-
          ```
          moteur
          roues
          voiture
          ```
        correct: false
      - text: |-
          ```
          voiture
          moteur
          roues
          ```
        correct: false
      - {text: "`voiture`", correct: false}
    answer: |-
      ```
      voiture
      roues
      moteur
      ```
      Le corps du destructeur de `Voiture` s'exécute d'abord. Ses membres sont ensuite détruits, dans l'ordre inverse
      de leur déclaration.
    check:
      output: |-
        voiture
        roues
        moteur
  - key: bug-appel-explicite
    format: bug-fix
    question: |-
      Ce programme affiche `fermeture` deux fois. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Fichier {
      public:
          ~Fichier() { std::println("fermeture"); }
      };

      int main() {
          Fichier fichier;
          std::println("travail");
          fichier.~Fichier();
      }
      ```
    choices:
      - {text: "Retirer l'appel `fichier.~Fichier();`", correct: true}
      - {text: "Retirer le destructeur de la classe", correct: false}
      - {text: "Appeler `fichier.~Fichier();` avant `travail`", correct: false}
      - {text: "Déclarer `fichier` avec le mot-clé `static`", correct: false}
    answer: |-
      ```cpp
      Fichier fichier;
      std::println("travail");
      ```
      Le destructeur d'une variable locale est appelé d'office à la fin du bloc. L'appeler soi-même le fait
      s'exécuter deux fois sur le même objet, ce qui est un comportement indéfini.
  - key: bug-ordre-attendu
    format: bug-fix
    question: |-
      L'auteur veut que la connexion soit fermée **après** la transaction. Le programme affiche pourtant
      `fin connexion` en premier. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(const char* nom) : nom_{nom} {}
          ~Trace() { std::println("fin {}", nom_); }

      private:
          const char* nom_;
      };

      int main() {
          Trace transaction{"transaction"};
          Trace connexion{"connexion"};
      }
      ```
    choices:
      - {text: "Déclarer `connexion` avant `transaction`", correct: true}
      - {text: "Déclarer `transaction` avec le mot-clé `const`", correct: false}
      - {text: "Appeler `transaction.~Trace();` à la fin de `main`", correct: false}
      - {text: "Ajouter un paramètre d'ordre au destructeur", correct: false}
    answer: |-
      ```cpp
      Trace connexion{"connexion"};
      Trace transaction{"transaction"};
      ```
      La destruction suit l'ordre inverse de la construction. Ce dont les autres dépendent se déclare en premier,
      pour être détruit en dernier.
  - key: bug-destructeur-avec-retour
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Fichier {
      public:
          void ~Fichier() { std::println("fermeture"); }
      };

      int main() {
          Fichier fichier;
      }
      ```
    choices:
      - {text: "Retirer `void` : un destructeur n'a pas de type de retour", correct: true}
      - {text: "Remplacer `void` par `int`, et renvoyer zéro", correct: false}
      - {text: "Ajouter un paramètre `bool` au destructeur", correct: false}
      - {text: "Remplacer le tilde par un point d'exclamation", correct: false}
    answer: |-
      ```cpp
      ~Fichier() { std::println("fermeture"); }
      ```
      Comme un constructeur, un destructeur se déclare sans type de retour, pas même `void`.
  - key: bug-destructeur-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'Fichier::~Fichier()' is private within this context ». Pourquoi ?
      ```cpp
      #include <print>

      class Fichier {
          ~Fichier() { std::println("fermeture"); }
      };

      int main() {
          Fichier fichier;
      }
      ```
    choices:
      - {text: "Sans `public:`, le destructeur est privé, et `main` ne peut pas détruire l'objet", correct: true}
      - {text: "Un destructeur ne peut pas contenir d'affichage", correct: false}
      - {text: "Une classe sans constructeur ne peut pas avoir de destructeur", correct: false}
      - {text: "Une variable locale n'a jamais de destructeur", correct: false}
    answer: |-
      ```cpp
      class Fichier {
      public:
          ~Fichier() { std::println("fermeture"); }
      };
      ```
      À la fin de `main`, le compilateur doit appeler le destructeur : il lui faut y avoir accès. Dans une `class`,
      tout est privé par défaut.
  - key: trous-tilde
    format: fill-in
    question: |-
      Complète pour déclarer le destructeur :
      ```cpp
      class Fichier {
      public:
          ___Fichier() {
              std::println("fermeture");
          }
      };
      ```
    blanks:
      - ["~"]
    answer: "Le nom d'un destructeur est celui de la classe, précédé d'un tilde."
  - key: trous-nom
    format: fill-in
    question: |-
      Complète avec le nom du destructeur :
      ```cpp
      class Connexion {
      public:
          ~___() {
              std::println("déconnexion");
          }
      };
      ```
    blanks:
      - [Connexion]
    answer: "`~Connexion()` : le tilde, puis le nom de la classe."
  - key: trous-ordre
    format: fill-in
    question: |-
      Complète le commentaire avec le nom de l'objet détruit en premier :
      ```cpp
      int main() {
          Trace a{"a"};
          Trace b{"b"};
      }   // le premier détruit est ___
      ```
    blanks:
      - [b]
    answer: "`b`, construit en dernier, est détruit en premier."
  - key: trous-sigle
    format: fill-in
    question: |-
      Complète le commentaire avec le sigle du principe « libérer dans le destructeur » :
      ```cpp
      class Verrou {
      public:
          Verrou() { /* prend le verrou */ }
          ~Verrou() { /* le relâche : c'est le ___ */ }
      };
      ```
    blanks:
      - [RAII, raii]
    answer: "RAII, pour *Resource Acquisition Is Initialization* : acquérir dans le constructeur, libérer dans le destructeur."
