notion: copie-superficielle
lesson: |-
  Copier un objet qui contient un **pointeur** peut vouloir dire deux choses.

  - **Copie superficielle** (*shallow copy*) : on copie le **pointeur**. Les deux objets désignent **la même**
    donnée.
  - **Copie profonde** (*deep copy*) : on copie **ce qui est pointé**. Chaque objet a sa propre donnée.

  La copie **générée par le compilateur** est membre à membre : pour un pointeur brut, elle est donc
  **superficielle**.

  ```cpp
  class Tampon {
  public:
      explicit Tampon(std::size_t taille) : taille_{taille}, donnees_{new int[taille]{}} {}
      ~Tampon() { delete[] donnees_; }
  private:
      std::size_t taille_;
      int* donnees_;      // possède le tableau
  };

  Tampon a{10};
  Tampon b = a;           // copie générée : b.donnees_ == a.donnees_
  ```

  Si la classe **possède** ce que le pointeur désigne, c'est une faute, à double titre :

  - modifier les données de `b` modifie celles de `a` ;
  - à la destruction, `a` et `b` libèrent **le même tableau** : double libération.

  **La copie profonde**, écrite à la main, alloue un nouveau bloc et y recopie le contenu :

  ```cpp
  Tampon(const Tampon& autre) : taille_{autre.taille_}, donnees_{new int[autre.taille_]} {
      std::copy(autre.donnees_, autre.donnees_ + taille_, donnees_);
  }
  ```

  Il faut alors écrire aussi l'**affectation par copie**, en pensant à l'affectation à soi-même (`a = a;`).

  **La meilleure réponse est de ne pas avoir à l'écrire.**

  | Membre | Ce que fait sa copie |
  |---|---|
  | `std::vector`, `std::string` | une copie profonde, toute seule |
  | `std::unique_ptr` | rien : la classe devient non copiable |
  | `std::shared_ptr` | un partage voulu, et sans double libération |
  | un pointeur brut qui **n'est pas** propriétaire | une copie superficielle, qui est alors correcte |

  **En entretien** : « La copie générée est superficielle pour les pointeurs bruts. Si la classe possède la donnée,
  il faut une copie profonde ; je préfère un `std::vector` ou un `std::unique_ptr`, qui règlent la question. »
cards:
  - key: definition-superficielle
    format: course
    question: "Qu'est-ce qu'une copie superficielle d'un objet qui contient un pointeur ?"
    choices:
      - {text: "Une copie du pointeur : les deux objets désignent la même donnée", correct: true}
      - {text: "Une copie de la donnée pointée : chaque objet a la sienne", correct: false}
      - {text: "Une copie où le pointeur de la copie vaut `nullptr`", correct: false}
      - {text: "Une copie des seuls membres publics de l'objet", correct: false}
    answer: "L'adresse est dupliquée, pas ce qu'elle désigne. La copie profonde, elle, duplique la donnée pointée."
  - key: copie-generee
    format: course
    question: "La copie générée par le compilateur est-elle superficielle ou profonde, pour un membre pointeur brut ?"
    choices:
      - {text: "Superficielle : elle copie l'adresse", correct: true}
      - {text: "Profonde : elle alloue et recopie la donnée pointée", correct: false}
      - {text: "Aucune des deux : le pointeur de la copie est nul", correct: false}
      - {text: "Cela dépend de la taille de la donnée pointée", correct: false}
    answer: "Le compilateur copie chaque membre tel quel. Il ne sait pas si le pointeur possède ce qu'il désigne, ni quelle taille cela fait."
  - key: consequences
    format: course
    question: "Que risque une classe qui possède un tableau par un pointeur brut, si on la copie avec la copie générée ?"
    choices:
      - {text: "Une double libération : les deux objets libèrent le même tableau", correct: true}
      - {text: "Une fuite : aucun des deux objets ne libère le tableau", correct: false}
      - {text: "Une erreur de compilation à la ligne de la copie", correct: false}
      - {text: "Rien : chaque objet reçoit son propre tableau", correct: false}
    answer: "Les deux destructeurs font `delete[]` sur la même adresse. Avant cela, toute modification par l'un se voit par l'autre."
  - key: eviter-de-l-ecrire
    format: course
    question: "Comment obtient-on une copie profonde sans écrire de constructeur de copie ?"
    choices:
      - {text: "En rangeant les données dans un `std::vector` ou une `std::string`", correct: true}
      - {text: "En rangeant les données derrière un pointeur brut", correct: false}
      - {text: "En rangeant les données dans un `std::shared_ptr`", correct: false}
      - {text: "En déclarant la classe avec le mot-clé `struct`", correct: false}
    answer: "Ces conteneurs se copient en profondeur d'eux-mêmes : la copie générée de la classe devient correcte. Un `std::shared_ptr` partagerait la donnée au lieu de la dupliquer."
  - key: vf-vector-profond
    format: true-false
    question: "Copier un `std::vector` copie ses éléments : c'est une copie profonde."
    truth: true
    answer: Chaque vecteur a son propre bloc de mémoire. C'est pourquoi une classe faite de conteneurs se copie correctement sans rien écrire.
  - key: vf-pointeur-brut
    format: true-false
    question: "Copier un pointeur brut copie l'objet qu'il désigne."
    truth: false
    answer: Seule l'adresse est copiée. Les deux pointeurs désignent le même objet.
  - key: vf-toujours-une-faute
    format: true-false
    question: Une copie superficielle est toujours une faute.
    truth: false
    answer: "Elle est correcte quand l'objet ne possède pas ce qu'il désigne : une vue, un observateur. La faute est de copier superficiellement un propriétaire."
  - key: vf-unique-ptr
    format: true-false
    question: "Une classe qui a un membre `std::unique_ptr` n'est pas copiable, sauf si on écrit sa copie."
    truth: true
    answer: "Le compilateur ne peut pas copier le membre : il ne génère pas la copie de la classe. L'erreur apparaît à la compilation, pas à l'exécution."
  - key: qcm-copie-profonde
    format: multiple-choice
    question: "Que doit faire le constructeur de copie d'une classe qui possède un tableau par `int* donnees_` ?"
    choices:
      - {text: "Allouer un nouveau tableau, et y recopier les éléments", correct: true}
      - {text: "Recopier l'adresse `autre.donnees_` dans `donnees_`", correct: false}
      - {text: "Libérer `autre.donnees_`, puis en reprendre l'adresse", correct: false}
      - {text: "Mettre `donnees_` à `nullptr`", correct: false}
    answer: "C'est la copie profonde : `donnees_{new int[autre.taille_]}`, puis la recopie des éléments. Chaque objet possède alors son tableau."
  - key: qcm-affectation-a-soi-meme
    format: multiple-choice
    question: "Pourquoi une affectation par copie profonde teste-t-elle `this != &autre` ?"
    choices:
      - {text: "Sans ce test, `a = a;` libérerait les données avant de les recopier", correct: true}
      - {text: "Sans ce test, `a = b;` copierait `b` deux fois", correct: false}
      - {text: "Sans ce test, le compilateur refuserait l'opérateur", correct: false}
      - {text: "Sans ce test, `a = b;` modifierait `b`", correct: false}
    answer: "Une affectation naïve libère l'ancien tableau, puis copie depuis `autre`. Si `autre` est l'objet lui-même, elle copie depuis un tableau qu'elle vient de libérer."
  - key: qcm-partage-voulu
    format: multiple-choice
    question: "Quel membre choisir quand plusieurs copies d'un objet doivent volontairement partager la même donnée ?"
    choices:
      - {text: "Un `std::shared_ptr`", correct: true}
      - {text: "Un pointeur brut, libéré par chaque copie", correct: false}
      - {text: "Un `std::unique_ptr`", correct: false}
      - {text: "Un `std::vector`", correct: false}
    answer: "Le compteur de références libère la donnée une seule fois, quand la dernière copie disparaît. Un pointeur brut libéré par chacun donnerait une double libération."
  - key: qcm-detection
    format: multiple-choice
    question: "Comment une double libération due à une copie superficielle se manifeste-t-elle le plus souvent ?"
    choices:
      - {text: "Par un plantage à la destruction du second objet", correct: true}
      - {text: "Par une erreur de compilation à la ligne de la copie", correct: false}
      - {text: "Par une exception `std::bad_alloc` à la copie", correct: false}
      - {text: "Par un avertissement de l'éditeur de liens", correct: false}
    answer: "Rien ne se voit à la copie. C'est à la fin de la portée, quand le second destructeur libère un bloc déjà rendu, que l'allocateur arrête le programme."
  - key: code-pointeur-partage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Vue {
          int* cible;
      };

      int main() {
          int valeur = 1;
          Vue a{&valeur};
          Vue b = a;
          *b.cible = 9;
          std::println("{} {}", *a.cible, valeur);
      }
      ```
    choices:
      - {text: "`9 9`", correct: true}
      - {text: "`1 9`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`9 1`", correct: false}
    answer: "`9 9` : la copie de `Vue` copie le pointeur. `a` et `b` désignent la même variable, `valeur`. Ici c'est voulu : une vue ne possède pas ce qu'elle regarde."
    check:
      output: "9 9"
  - key: code-copie-profonde
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Boite {
      public:
          explicit Boite(int valeur) : valeur_{new int{valeur}} {}
          Boite(const Boite& autre) : valeur_{new int{*autre.valeur_}} {}
          ~Boite() { delete valeur_; }
          void changer(int valeur) { *valeur_ = valeur; }
          int valeur() const { return *valeur_; }

      private:
          int* valeur_;
      };

      int main() {
          Boite a{1};
          Boite b = a;
          b.changer(9);
          std::println("{} {}", a.valeur(), b.valeur());
      }
      ```
    choices:
      - {text: "`1 9`", correct: true}
      - {text: "`9 9`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 9` : le constructeur de copie alloue un nouvel entier pour `b`. C'est une copie profonde : les deux boîtes sont indépendantes, et chacune libère le sien."
    check:
      output: "1 9"
  - key: code-vecteur-membre
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      struct Releve {
          std::vector<int> notes;
      };

      int main() {
          Releve a{{12, 15}};
          Releve b = a;
          b.notes.push_back(9);
          b.notes[0] = 0;
          std::println("{} {} {}", a.notes.size(), a.notes[0], b.notes.size());
      }
      ```
    choices:
      - {text: "`2 12 3`", correct: true}
      - {text: "`3 0 3`", correct: false}
      - {text: "`2 0 3`", correct: false}
      - {text: "`3 12 3`", correct: false}
    answer: "`2 12 3` : la copie générée de `Releve` copie son vecteur, qui se copie en profondeur. `b` a ses propres notes."
    check:
      output: "2 12 3"
  - key: code-shared-ptr-membre
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      struct Document {
          std::shared_ptr<int> pages;
      };

      int main() {
          Document a{std::make_shared<int>(10)};
          Document b = a;
          *b.pages = 20;
          std::println("{} {}", *a.pages, a.pages.use_count());
      }
      ```
    choices:
      - {text: "`20 2`", correct: true}
      - {text: "`10 2`", correct: false}
      - {text: "`20 1`", correct: false}
      - {text: "`10 1`", correct: false}
    answer: "`20 2` : copier le `std::shared_ptr` partage l'entier entre `a` et `b`, et porte le compteur à 2. Le partage est voulu, et l'entier ne sera libéré qu'une fois."
    check:
      output: "20 2"
  - key: bug-double-liberation
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Boite {
      public:
          explicit Boite(int valeur) : valeur_{new int{valeur}} {}
          ~Boite() { delete valeur_; }
          int valeur() const { return *valeur_; }

      private:
          int* valeur_;
      };

      int main() {
          Boite a{1};
          Boite b = a;
          std::println("{}", b.valeur());
      }
      ```
    choices:
      - {text: "Écrire un constructeur de copie qui alloue un nouvel entier", correct: true}
      - {text: "Retirer le destructeur, pour ne plus rien libérer", correct: false}
      - {text: "Écrire `delete[] valeur_;` dans le destructeur", correct: false}
      - {text: "Déclarer `valeur_` avec le mot-clé `mutable`", correct: false}
    answer: |-
      ```cpp
      Boite(const Boite& autre) : valeur_{new int{*autre.valeur_}} {}
      ```
      La copie générée duplique le pointeur : `a` et `b` libèrent le même entier. Une copie profonde donne à chacun
      le sien. (Il faudrait aussi l'affectation ; un membre `int` tout simple éviterait l'ensemble.)
  - key: bug-modification-partagee
    format: bug-fix
    question: |-
      L'auteur voulait modifier un brouillon sans toucher l'original. Le programme affiche `0 0` au lieu de `12 0`.
      Pourquoi ?
      ```cpp
      #include <print>

      struct Releve {
          int* notes;
      };

      int main() {
          int notes[2] = {12, 15};
          Releve original{notes};
          Releve brouillon = original;
          brouillon.notes[0] = 0;
          std::println("{} {}", original.notes[0], brouillon.notes[0]);
      }
      ```
    choices:
      - {text: "La copie duplique le pointeur : les deux relevés désignent le même tableau", correct: true}
      - {text: "La copie duplique le tableau, puis met son premier élément à zéro", correct: false}
      - {text: "Un tableau local ne peut pas être désigné par un pointeur", correct: false}
      - {text: "`std::println` lit deux fois le même argument", correct: false}
    answer: |-
      ```cpp
      struct Releve {
          std::vector<int> notes;
      };
      ```
      La copie d'un pointeur est superficielle. Avec un `std::vector` pour membre, la copie du relevé duplique ses
      notes.
  - key: bug-affectation-oubliee
    format: bug-fix
    question: |-
      La classe a un constructeur de copie profonde, et ce programme plante quand même à la fin de `main`. Pourquoi ?
      ```cpp
      #include <print>

      class Boite {
      public:
          explicit Boite(int valeur) : valeur_{new int{valeur}} {}
          Boite(const Boite& autre) : valeur_{new int{*autre.valeur_}} {}
          ~Boite() { delete valeur_; }
          int valeur() const { return *valeur_; }

      private:
          int* valeur_;
      };

      int main() {
          Boite a{1};
          Boite b{2};
          b = a;
          std::println("{}", b.valeur());
      }
      ```
    choices:
      - {text: "`b = a;` appelle l'affectation générée, qui copie le pointeur", correct: true}
      - {text: "`b = a;` appelle le constructeur de copie une seconde fois", correct: false}
      - {text: "`b = a;` détruit `a`, que `main` détruit de nouveau", correct: false}
      - {text: "`b = a;` n'est pas permis entre deux objets déjà construits", correct: false}
    answer: |-
      ```cpp
      Boite& operator=(const Boite& autre) {
          if (this != &autre) {
              *valeur_ = *autre.valeur_;
          }
          return *this;
      }
      ```
      Le constructeur de copie ne sert qu'à créer un objet. Pour un objet existant, c'est l'affectation, et celle du
      compilateur est superficielle : l'ancien entier de `b` fuit, et celui de `a` est libéré deux fois.
  - key: bug-affectation-a-soi-meme
    format: bug-fix
    question: |-
      Après `boite = boite;`, ce programme affiche un nombre imprévisible au lieu de `7`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      class Boite {
      public:
          explicit Boite(int valeur) : valeur_{new int{valeur}} {}
          Boite(const Boite& autre) : valeur_{new int{*autre.valeur_}} {}
          Boite& operator=(const Boite& autre) {
              delete valeur_;
              valeur_ = new int{*autre.valeur_};
              return *this;
          }
          ~Boite() { delete valeur_; }
          int valeur() const { return *valeur_; }

      private:
          int* valeur_;
      };

      int main() {
          Boite boite{7};
          Boite& alias = boite;
          boite = alias;
          std::println("{}", boite.valeur());
      }
      ```
    choices:
      - {text: "Tester `this != &autre` avant de libérer", correct: true}
      - {text: "Retirer `return *this;` de l'opérateur", correct: false}
      - {text: "Libérer `autre.valeur_` à la place de `valeur_`", correct: false}
      - {text: "Déclarer l'opérateur avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      Boite& operator=(const Boite& autre) {
          if (this != &autre) {
              delete valeur_;
              valeur_ = new int{*autre.valeur_};
          }
          return *this;
      }
      ```
      Quand `autre` est l'objet lui-même, `delete valeur_` libère l'entier qu'on lit à la ligne suivante. Le test
      écarte ce cas.
  - key: situation-relecture
    format: scenario
    question: |-
      En relecture, tu vois une classe `Image` avec un membre `unsigned char* pixels_`, alloué dans le constructeur et
      libéré dans le destructeur. Rien d'autre. Que demandes-tu ?
    choices:
      - {text: "De remplacer le pointeur par un `std::vector<unsigned char>`", correct: true}
      - {text: "D'ajouter un commentaire « ne pas copier cette classe »", correct: false}
      - {text: "De retirer le destructeur, qui cause la double libération", correct: false}
      - {text: "De rendre `pixels_` public, pour que l'appelant le copie", correct: false}
    answer: |-
      En l'état, toute copie d'une `Image` mène à une double libération. Un vecteur donne la copie profonde, la
      libération et le déplacement, sans une ligne à écrire. Un commentaire n'empêche rien ; à défaut de vecteur, on
      interdirait la copie avec `= delete`.
  - key: situation-copie-couteuse
    format: scenario
    question: |-
      Une classe `Document` contient un `std::vector` de plusieurs mégaoctets. Le profileur montre que des copies
      profondes de documents dominent le temps d'exécution. Que proposes-tu d'abord ?
    choices:
      - {text: "De passer les documents par référence constante, là où ils sont seulement lus", correct: true}
      - {text: "De remplacer le vecteur par un pointeur brut, copié superficiellement", correct: false}
      - {text: "D'écrire un constructeur de copie qui ne copie que la moitié des données", correct: false}
      - {text: "De rendre le vecteur `static`, partagé par tous les documents", correct: false}
    answer: |-
      La copie profonde est correcte ; le problème est qu'elle a lieu sans nécessité. La plupart viennent de
      passages par valeur : `const Document&` les supprime. Revenir à une copie superficielle ramènerait les doubles
      libérations.
  - key: situation-observateur
    format: scenario
    question: |-
      Une classe `Curseur` garde un pointeur brut vers un `Document` qu'elle ne possède pas. Un collègue veut lui
      écrire un constructeur de copie profonde, « par sécurité ». Que réponds-tu ?
    choices:
      - {text: "Que la copie générée est la bonne : deux curseurs doivent désigner le même document", correct: true}
      - {text: "Qu'il a raison : tout pointeur membre demande une copie profonde", correct: false}
      - {text: "Qu'il faut interdire la copie de tout objet qui contient un pointeur", correct: false}
      - {text: "Qu'il faut libérer le document dans le destructeur du curseur", correct: false}
    answer: |-
      La copie profonde vaut pour un propriétaire. Un observateur ne duplique pas ce qu'il regarde : copier le
      curseur doit donner un second curseur sur le même document. Dupliquer le document changerait le sens du
      programme.
  - key: situation-partage-ou-copie
    format: scenario
    question: |-
      Une classe `Theme` contient une grosse table de couleurs, jamais modifiée après sa création, et des centaines
      de fenêtres en gardent chacune une copie. La mémoire explose. Que proposes-tu ?
    choices:
      - {text: "Que chaque fenêtre garde un `std::shared_ptr<const Theme>`", correct: true}
      - {text: "Que chaque fenêtre garde un pointeur brut, libéré à sa fermeture", correct: false}
      - {text: "Que le thème soit copié superficiellement, par un pointeur brut dans la classe", correct: false}
      - {text: "Que chaque fenêtre recharge le thème depuis le disque à chaque affichage", correct: false}
    answer: |-
      La donnée est immuable : la partager est sûr, et le compteur de références la libère quand la dernière fenêtre
      se ferme. Un pointeur brut libéré par chacune donnerait des doubles libérations.
