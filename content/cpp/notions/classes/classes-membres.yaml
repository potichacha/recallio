notion: classes-membres
lesson: |-
  Une **classe** réunit des **données** et les **fonctions** qui travaillent dessus. Les variables créées à partir
  d'elle sont ses **objets**.

  ```cpp
  class Compteur {
  public:
      void incrementer() {      // une fonction membre
          valeur += 1;          // elle lit et modifie les données de l'objet
      }
      int valeur = 0;           // une donnée membre
  };

  Compteur visites;             // un objet
  visites.incrementer();        // on appelle une fonction membre avec un point
  ```

  - Chaque objet a **ses propres données** : incrémenter `visites` ne touche pas un autre `Compteur`.
  - Une **fonction membre** s'appelle **sur un objet**, et accède directement à ses membres, sans les recevoir en
    paramètre.
  - Dans une `class`, les membres sont **privés par défaut** : il faut `public:` pour les rendre accessibles de
    l'extérieur.
  - La définition se termine par un **point-virgule**, comme celle d'une `struct`.

  **Définir une fonction membre hors de la classe.** La classe ne garde que la déclaration ; la définition, ailleurs,
  est préfixée par le nom de la classe :

  ```cpp
  class Compteur {
  public:
      void incrementer();       // déclaration
      int valeur = 0;
  };

  void Compteur::incrementer() {    // définition
      valeur += 1;
  }
  ```

  C'est le découpage habituel : la classe dans un en-tête (`.hpp`), le code de ses fonctions dans un fichier `.cpp`.
  Sans le préfixe `Compteur::`, on définirait une fonction libre, qui ne connaît pas `valeur`.

  **En entretien** : « Une classe définit un type : des données et les opérations permises sur elles. L'intérêt est de
  garder ensemble l'état et les règles qui le protègent. »
tour:
  - title: Une classe
    text: |-
      Une classe réunit des données et les fonctions qui les manipulent. Tu crées ensuite des **objets** de ce type,
      et tu appelles leurs fonctions membres avec un point : `visites.incrementer()`.

      Chaque objet a ses propres données. Une fonction membre accède directement à celles de l'objet sur lequel on
      l'appelle.

      Sans `public:`, tout est privé dans une `class` : le code extérieur ne pourrait rien appeler.

      Essaie : supprime la ligne `public:`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>

          class Compteur {
          public:
              void incrementer() {
                  valeur += 1;
              }

              int valeur = 0;
          };

          int main() {
              Compteur visites;
              Compteur erreurs;

              visites.incrementer();
              visites.incrementer();
              erreurs.incrementer();

              std::println("{} visites, {} erreur", visites.valeur, erreurs.valeur);
          }
      output: "2 visites, 1 erreur"
    task:
      instructions: |-
        Ajoute à `Compteur` une fonction membre `remettre_a_zero`, et appelle-la sur `visites` avant l'affichage, pour
        obtenir `0 visites`.
      starter:
        main.cpp: |-
          #include <print>

          class Compteur {
          public:
              void incrementer() {
                  valeur += 1;
              }

              int valeur = 0;
          };

          int main() {
              Compteur visites;
              visites.incrementer();
              visites.incrementer();

              std::println("{} visites", visites.valeur);
          }
      solution:
        main.cpp: |-
          #include <print>

          class Compteur {
          public:
              void incrementer() {
                  valeur += 1;
              }

              void remettre_a_zero() {
                  valeur = 0;
              }

              int valeur = 0;
          };

          int main() {
              Compteur visites;
              visites.incrementer();
              visites.incrementer();
              visites.remettre_a_zero();

              std::println("{} visites", visites.valeur);
          }
      output: "0 visites"
cards:
  - key: classe-et-objet
    format: course
    question: Quelle différence entre une classe et un objet ?
    choices:
      - {text: "La classe est le type, l'objet est une variable de ce type", correct: true}
      - {text: "La classe est une variable, l'objet est son type", correct: false}
      - {text: "La classe contient des données, l'objet contient des fonctions", correct: false}
      - {text: "Aucune : ce sont deux mots pour la même chose", correct: false}
    answer: "La classe décrit : quelles données, quelles fonctions. Un objet est une variable créée d'après cette description, avec ses propres données."
  - key: fonction-membre
    format: course
    question: Comment une fonction membre accède-t-elle aux données de son objet ?
    choices:
      - {text: "Directement, par leur nom : elle est appelée sur un objet précis", correct: true}
      - {text: "Par des paramètres, que l'appelant doit lui passer", correct: false}
      - {text: "Par des variables globales, partagées par tous les objets", correct: false}
      - {text: "Elle n'y accède pas : elle ne voit que ses variables locales", correct: false}
    answer: "`visites.incrementer()` appelle la fonction sur `visites` : dans son corps, `valeur` désigne le membre de cet objet-là."
  - key: definition-hors-de-la-classe
    format: course
    question: "Que signifie `Compteur::` dans `void Compteur::incrementer() { ... }` ?"
    choices:
      - {text: "Que la fonction définie est le membre `incrementer` de la classe `Compteur`", correct: true}
      - {text: "Que la fonction renvoie un objet de la classe `Compteur`", correct: false}
      - {text: "Que la fonction reçoit un `Compteur` en paramètre", correct: false}
      - {text: "Que la fonction est rangée dans l'espace de noms `Compteur`", correct: false}
    answer: "Hors de la classe, le préfixe rattache la définition à la classe. Sans lui, on définirait une fonction libre du même nom, qui ne connaît pas les membres."
  - key: donnees-par-objet
    format: course
    question: "Deux objets `a` et `b` de la même classe partagent-ils leurs données membres ?"
    choices:
      - {text: "Non : chaque objet a son propre exemplaire de chaque donnée membre", correct: true}
      - {text: "Oui : les données sont rangées dans la classe, pas dans les objets", correct: false}
      - {text: "Oui, tant qu'aucun des deux n'a été modifié", correct: false}
      - {text: "Non, sauf s'ils sont déclarés sur la même ligne", correct: false}
    answer: "Chaque objet occupe sa propre place en mémoire. Seuls les membres déclarés `static` sont communs à tous les objets."
  - key: vf-prive-par-defaut
    format: true-false
    question: Dans une `class`, les membres sont privés tant qu'on n'écrit pas `public:`.
    truth: true
    answer: C'est la seule différence avec `struct`, où ils sont publics par défaut.
  - key: vf-point-virgule
    format: true-false
    question: La définition d'une classe se termine par un point-virgule.
    truth: true
    answer: Après l'accolade fermante, comme pour une `struct`.
  - key: vf-appel-sans-objet
    format: true-false
    question: "Depuis `main`, on appelle une fonction membre ordinaire sans objet : `incrementer();`."
    truth: false
    answer: "Une fonction membre s'appelle sur un objet : `visites.incrementer();`. Sans objet, le compilateur cherche une fonction libre."
  - key: vf-fonction-dans-struct
    format: true-false
    question: Une `struct` peut avoir des fonctions membres, comme une `class`.
    truth: true
    answer: Les deux mots-clés définissent le même genre de type. Seule la visibilité par défaut change.
  - key: qcm-appel
    format: multiple-choice
    question: "Comment appelle-t-on la fonction membre `incrementer` sur l'objet `visites` ?"
    choices:
      - {text: "`visites.incrementer();`", correct: true}
      - {text: "`incrementer(visites);`", correct: false}
      - {text: "`visites::incrementer();`", correct: false}
      - {text: "`Compteur.incrementer(visites);`", correct: false}
    answer: "L'objet, un point, la fonction. `::` sert à désigner un membre de la classe, pas d'un objet."
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle déclaration définit une classe dont la fonction `afficher` est appelable de l'extérieur ?
    choices:
      - {text: "`class Rapport { public: void afficher(); };`", correct: true}
      - {text: "`class Rapport { void afficher(); };`", correct: false}
      - {text: "`class Rapport { private: void afficher(); };`", correct: false}
      - {text: "`class Rapport public { void afficher(); };`", correct: false}
    answer: "Il faut la section `public:`. Sans elle, ou sous `private:`, la fonction n'est appelable que par les autres membres."
  - key: qcm-decoupage
    format: multiple-choice
    question: Dans un projet, où écrit-on le code des fonctions membres d'une classe déclarée dans `compteur.hpp` ?
    choices:
      - {text: "Dans `compteur.cpp`, avec le préfixe `Compteur::`", correct: true}
      - {text: "Dans `main.cpp`, avant la fonction `main`", correct: false}
      - {text: "Dans `compteur.hpp`, après l'accolade fermante de la classe", correct: false}
      - {text: "Dans chaque fichier qui utilise la classe", correct: false}
    answer: "L'en-tête déclare la classe ; le fichier source définit ses fonctions, une seule fois. Les autres fichiers incluent l'en-tête."
  - key: qcm-creer-un-objet
    format: multiple-choice
    question: "Quelle ligne crée un objet `visites` de la classe `Compteur` ?"
    choices:
      - {text: "`Compteur visites;`", correct: true}
      - {text: "`Compteur visites();`", correct: false}
      - {text: "`class visites = Compteur;`", correct: false}
      - {text: "`visites = new Compteur;`", correct: false}
    answer: "Le type, puis le nom, comme pour un `int`. `Compteur visites();` déclare une fonction, et `new` renvoie un pointeur, sans déclarer de variable."
  - key: trous-class
    format: fill-in
    question: |-
      Complète avec le mot-clé qui définit le type :
      ```cpp
      ___ Compteur {
      public:
          void incrementer();
      };
      ```
    blanks:
      - [class, struct]
    answer: "`class Compteur { ... };` définit une classe."
  - key: trous-public
    format: fill-in
    question: |-
      Complète pour que `incrementer` soit appelable depuis `main` :
      ```cpp
      class Compteur {
      ___:
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };
      ```
    blanks:
      - [public]
    answer: "`public:` rend accessibles les membres qui le suivent."
  - key: trous-prefixe
    format: fill-in
    question: |-
      Complète pour définir la fonction membre hors de la classe :
      ```cpp
      void ___::incrementer() {
          valeur += 1;
      }
      ```
    blanks:
      - [Compteur]
    answer: "`Compteur::incrementer` : le nom de la classe, puis `::`."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète pour appeler `incrementer` sur l'objet :
      ```cpp
      Compteur visites;
      visites___incrementer();
      ```
    blanks:
      - ["."]
    answer: "On appelle une fonction membre avec un point, comme on lit une donnée membre."
  - key: code-deux-objets
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };

      int main() {
          Compteur a;
          Compteur b;
          a.incrementer();
          a.incrementer();
          b.incrementer();
          std::println("{} {}", a.valeur, b.valeur);
      }
      ```
    choices:
      - {text: "`2 1`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`2 1` : chaque objet a sa propre `valeur`. Les appels sur `a` ne touchent pas `b`."
    check:
      output: "2 1"
  - key: code-copie-d-objet
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };

      int main() {
          Compteur a;
          a.incrementer();
          Compteur b = a;
          b.incrementer();
          std::println("{} {}", a.valeur, b.valeur);
      }
      ```
    choices:
      - {text: "`1 2`", correct: true}
      - {text: "`2 2`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`1 2` : `b` est une copie de `a`, avec sa propre `valeur`, partie de 1. L'incrémenter ne change pas `a`."
    check:
      output: "1 2"
  - key: code-definition-externe
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Rectangle {
      public:
          int aire();
          int largeur = 3;
          int hauteur = 4;
      };

      int Rectangle::aire() {
          return largeur * hauteur;
      }

      int main() {
          Rectangle r;
          r.largeur = 5;
          std::println("{}", r.aire());
      }
      ```
    choices:
      - {text: "`20`", correct: true}
      - {text: "`12`", correct: false}
      - {text: "`15`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`20` : la fonction, définie hors de la classe, lit les membres de l'objet sur lequel elle est appelée : une largeur passée à 5, une hauteur restée à 4."
    check:
      output: "20"
  - key: code-passage-par-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };

      void compter_deux(Compteur c) {
          c.incrementer();
          c.incrementer();
      }

      void compter_un(Compteur& c) {
          c.incrementer();
      }

      int main() {
          Compteur visites;
          compter_deux(visites);
          compter_un(visites);
          std::println("{}", visites.valeur);
      }
      ```
    choices:
      - {text: "`1`", correct: true}
      - {text: "`3`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`0`", correct: false}
    answer: "`1` : `compter_deux` reçoit une copie de l'objet, et incrémente la copie. Seule `compter_un`, qui prend une référence, modifie `visites`."
    check:
      output: "1"
  - key: bug-public-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « 'void Compteur::incrementer()' is private within this context ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      class Compteur {
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };

      int main() {
          Compteur visites;
          visites.incrementer();
      }
      ```
    choices:
      - {text: "Ajouter `public:` avant la fonction `incrementer`", correct: true}
      - {text: "Ajouter `private:` avant la fonction `incrementer`", correct: false}
      - {text: "Déclarer `visites` avec le mot-clé `public`", correct: false}
      - {text: "Écrire l'appel `Compteur::incrementer(visites);`", correct: false}
    answer: |-
      ```cpp
      class Compteur {
      public:
          void incrementer() {
      ```
      Dans une `class`, tout est privé par défaut. `public:` ouvre les membres qui le suivent au code extérieur.
  - key: bug-prefixe-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « 'valeur' was not declared in this scope », dans la définition de `incrementer`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer();
          int valeur = 0;
      };

      void incrementer() {
          valeur += 1;
      }

      int main() {
          Compteur visites;
          std::println("{}", visites.valeur);
      }
      ```
    choices:
      - {text: "Écrire `void Compteur::incrementer()` dans la définition", correct: true}
      - {text: "Écrire `void incrementer(Compteur)` dans la définition", correct: false}
      - {text: "Écrire `Compteur void incrementer()` dans la définition", correct: false}
      - {text: "Écrire `int valeur = 0;` dans la définition", correct: false}
    answer: |-
      ```cpp
      void Compteur::incrementer() {
          valeur += 1;
      }
      ```
      Sans `Compteur::`, c'est une fonction libre, sans rapport avec la classe : elle ne connaît pas `valeur`.
  - key: bug-appel-sans-objet
    format: bug-fix
    question: |-
      Le compilateur répond « 'incrementer' was not declared in this scope ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer() {
              valeur += 1;
          }
          int valeur = 0;
      };

      int main() {
          Compteur visites;
          incrementer();
          std::println("{}", visites.valeur);
      }
      ```
    choices:
      - {text: "Écrire `visites.incrementer();`", correct: true}
      - {text: "Écrire `Compteur.incrementer();`", correct: false}
      - {text: "Écrire `incrementer(visites);`", correct: false}
      - {text: "Écrire `std::incrementer();`", correct: false}
    answer: |-
      ```cpp
      visites.incrementer();
      ```
      Une fonction membre s'appelle sur un objet : c'est lui qui dit de quel `valeur` il s'agit.
  - key: bug-parentheses-oubliees
    format: bug-fix
    question: |-
      Ce code ne compile pas. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Rectangle {
      public:
          int aire() {
              return largeur * hauteur;
          }
          int largeur = 3;
          int hauteur = 4;
      };

      int main() {
          Rectangle r;
          std::println("{}", r.aire);
      }
      ```
    choices:
      - {text: "Écrire `r.aire()`, avec des parenthèses", correct: true}
      - {text: "Écrire `r->aire`, avec une flèche", correct: false}
      - {text: "Écrire `r::aire`, avec deux deux-points", correct: false}
      - {text: "Écrire `aire(r)`, comme une fonction libre", correct: false}
    answer: |-
      ```cpp
      std::println("{}", r.aire());
      ```
      `aire` est une fonction : on l'appelle avec des parenthèses. Sans elles, on désigne la fonction, on ne
      l'appelle pas.
