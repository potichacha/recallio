notion: operateur-indice-appel
lesson: |-
  Deux opérateurs donnent à une classe la syntaxe d'un tableau ou d'une fonction : **`operator[]`** et
  **`operator()`**. Tous deux doivent être des **fonctions membres**.

  **`operator[]` : indexer.**

  ```cpp
  class Notes {
  public:
      int& operator[](std::size_t i) { return valeurs_[i]; }                // objet modifiable
      const int& operator[](std::size_t i) const { return valeurs_[i]; }    // objet constant

  private:
      std::vector<int> valeurs_{12, 15, 9};
  };

  Notes n;
  n[0] = 18;                 // écrit à travers la référence renvoyée
  ```

  - Il renvoie une **référence**, pour que `n[0] = 18` modifie l'élément lui-même. Par valeur, on modifierait une
    copie.
  - On l'écrit en **deux versions** : la version `const`, appelée sur un objet constant, renvoie une référence
    constante.
  - Par convention, il **ne vérifie pas** l'indice ; une fonction `at()` le fait, et lance `std::out_of_range`.
  - L'indice peut être de n'importe quel type : `std::map` s'indexe par sa clé.
  - Depuis **C++23**, il accepte **plusieurs** indices : `grille[ligne, colonne]`.

  **`operator()` : appeler.** Une classe qui le définit produit des **objets fonction**, ou *foncteurs* : ils
  s'appellent comme une fonction, et gardent un **état** dans leurs membres.

  ```cpp
  class Multiplicateur {
  public:
      explicit Multiplicateur(int facteur) : facteur_{facteur} {}
      int operator()(int x) const { return x * facteur_; }

  private:
      int facteur_;
  };

  Multiplicateur triple{3};
  triple(5);                 // 15
  ```

  - Il prend **autant de paramètres** qu'on veut, et peut être surchargé.
  - On le déclare **`const`** quand l'appel ne modifie pas l'objet : c'est ce qu'attendent la plupart des
    algorithmes.
  - Un foncteur se passe à un algorithme : `std::transform(v.begin(), v.end(), v.begin(), triple);`.

  **Le lien avec les lambdas.** Une lambda **est** un foncteur : le compilateur génère une classe dont les
  captures sont les membres, et dont le corps est l'`operator()`, `const` par défaut. `std::less<>` et
  `std::greater<>` sont aussi des foncteurs.

  **Foncteur ou lambda ?** La lambda, le plus souvent. Un foncteur écrit à la main garde un intérêt quand il faut
  un **type nommé** (paramètre de template d'un `std::set`, d'une `std::priority_queue`), plusieurs surcharges
  d'`operator()`, ou un état riche avec d'autres fonctions membres.

  **En entretien** : « `operator[]` renvoie une référence, en deux versions, `const` et non `const`.
  `operator()` fait d'un objet un foncteur : appelable comme une fonction, avec un état. Une lambda est un
  foncteur généré par le compilateur. »
cards:
  - key: retour-reference
    format: course
    question: "Pourquoi `operator[]` renvoie-t-il une référence ?"
    choices:
      - {text: "Pour que `objet[i] = valeur` modifie l'élément lui-même, et non une copie", correct: true}
      - {text: "Pour que l'indice soit vérifié avant chaque accès à l'élément", correct: false}
      - {text: "Pour que l'opérateur puisse être appelé sans aucun argument", correct: false}
      - {text: "Pour que l'élément soit détruit à la fin de l'expression", correct: false}
    answer: "L'affectation s'applique à ce que l'opérateur renvoie. Avec une valeur, elle porterait sur un temporaire : pour un type fondamental, le code ne compilerait même pas."
  - key: deux-versions
    format: course
    question: "Pourquoi écrit-on `operator[]` en deux versions, l'une `const` et l'autre non ?"
    choices:
      - {text: "Un objet constant appelle la version `const`, qui renvoie une référence constante", correct: true}
      - {text: "La version `const` vérifie l'indice, l'autre ne le vérifie pas", correct: false}
      - {text: "La version `const` sert à la lecture, l'autre est appelée pour chaque écriture", correct: false}
      - {text: "Le compilateur refuse une classe qui n'a qu'une seule version", correct: false}
    answer: "Le choix dépend de la constance de l'objet, pas de l'usage qu'on fait du résultat. Sans version `const`, on ne pourrait pas lire un élément d'un objet constant."
  - key: foncteur
    format: course
    question: "Que désigne-t-on par « objet fonction », ou foncteur, quand une classe définit `operator()` ?"
    choices:
      - {text: "Un objet d'une classe qui définit `operator()`, appelable comme une fonction", correct: true}
      - {text: "Un pointeur vers une fonction membre de cette classe, appelé avec `->*`", correct: false}
      - {text: "Une fonction libre qui renvoie une autre fonction à son appelant", correct: false}
      - {text: "Une fonction libre déclarée `friend` dans le corps de cette classe", correct: false}
    answer: "À la différence d'une fonction, il porte un état : ses membres. On l'appelle aussi objet fonction."
  - key: lambda
    format: course
    question: "Quel est le lien entre une lambda et `operator()` ?"
    choices:
      - {text: "Le compilateur génère une classe dont le corps de la lambda est l'`operator()`", correct: true}
      - {text: "Une lambda est un pointeur de fonction, sans `operator()`", correct: false}
      - {text: "Une lambda appelle l'`operator()` de la classe qui l'entoure", correct: false}
      - {text: "Une lambda ne peut pas être appelée avec des parenthèses", correct: false}
    answer: "Les captures deviennent les membres de cette classe, et l'`operator()` est `const` par défaut : d'où le mot-clé `mutable` pour modifier une capture."
  - key: vf-membre
    format: true-false
    question: "`operator[]` et `operator()` doivent être des fonctions membres."
    truth: true
    answer: "Le langage l'impose, comme pour `operator=` et `operator->`. On ne peut pas les écrire en fonctions libres."
  - key: vf-verification
    format: true-false
    question: "Par convention, `operator[]` vérifie l'indice et lance une exception s'il est invalide."
    truth: false
    answer: "Il ne vérifie rien, comme celui de `std::vector`. La version vérifiée est une fonction `at()`."
  - key: vf-plusieurs-parametres
    format: true-false
    question: "`operator()` peut prendre plusieurs paramètres."
    truth: true
    answer: "Autant qu'on veut, et il peut être surchargé. Depuis C++23, `operator[]` accepte lui aussi plusieurs indices."
  - key: vf-indice-entier
    format: true-false
    question: "L'indice d'`operator[]` doit être un entier."
    truth: false
    answer: "N'importe quel type convient : `std::map<std::string, int>` s'indexe par une chaîne."
  - key: qcm-signature-const
    format: multiple-choice
    question: "Quelle est la signature de la version `const` d'`operator[]` pour une classe qui range des `int` ?"
    choices:
      - {text: "`const int& operator[](std::size_t i) const;`", correct: true}
      - {text: "`int& operator[](std::size_t i);`", correct: false}
      - {text: "`const int& operator[](std::size_t i);`", correct: false}
      - {text: "`int& operator[]() const;`", correct: false}
    answer: "Le `const` final la rend appelable sur un objet constant ; le `const` du retour protège l'élément."
  - key: qcm-appel
    format: multiple-choice
    question: "`triple` est un objet dont la classe définit `int operator()(int x) const`. Comment l'appelle-t-on ?"
    choices:
      - {text: "`triple(5)`", correct: true}
      - {text: "`triple.call(5)`", correct: false}
      - {text: "`triple[5]`", correct: false}
      - {text: "`triple->(5)`", correct: false}
    answer: "Comme une fonction. La forme explicite `triple.operator()(5)` est équivalente."
  - key: qcm-type-nomme
    format: multiple-choice
    question: "Dans quel cas un foncteur écrit à la main reste-t-il préférable à une lambda ?"
    choices:
      - {text: "Quand son type doit être nommé, comme comparateur d'un `std::set`", correct: true}
      - {text: "Quand il n'a aucun état à garder entre deux appels", correct: false}
      - {text: "Quand il n'est utilisé qu'à un seul endroit du programme", correct: false}
      - {text: "Quand il ne prend qu'un seul paramètre, de type entier", correct: false}
    answer: "`std::set<Point, ComparerParX>` attend un type. Une lambda en a un, mais sans nom : il faut passer par `decltype`."
  - key: qcm-cpp23
    format: multiple-choice
    question: "Qu'autorise C++23 pour `operator[]` ?"
    choices:
      - {text: "Plusieurs indices : `grille[ligne, colonne]`", correct: true}
      - {text: "Aucun indice : `grille[]`", correct: false}
      - {text: "Un indice négatif, compté depuis la fin", correct: false}
      - {text: "Une définition en fonction libre", correct: false}
    answer: "`T& operator[](std::size_t l, std::size_t c)`. Avant, on détournait `operator()` pour les tableaux à deux dimensions."
  - key: trous-indice
    format: fill-in
    question: |-
      Complète le nom de l'opérateur d'indexation :
      ```cpp
      int& operator___(std::size_t i) { return valeurs_[i]; }
      ```
    blanks:
      - ["[]"]
    answer: "`operator[]` reçoit l'indice en paramètre."
  - key: trous-appel
    format: fill-in
    question: |-
      Complète le nom de l'opérateur d'appel :
      ```cpp
      int operator___(int x) const { return x * facteur_; }
      ```
    blanks:
      - ["()"]
    answer: "`operator()` : la première paire de parenthèses fait partie du nom, la seconde contient les paramètres."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète le type de retour, pour que `notes[0] = 18;` modifie l'élément :
      ```cpp
      int___ operator[](std::size_t i) { return valeurs_[i]; }
      ```
    blanks:
      - ["&"]
    answer: "Une référence vers l'élément : l'affectation agit sur lui."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que l'opérateur soit appelable sur un objet constant :
      ```cpp
      const int& operator[](std::size_t i) ___ { return valeurs_[i]; }
      ```
    blanks:
      - [const]
    answer: "Le `const` après les paramètres promet de ne pas modifier l'objet."
  - key: code-indice
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      class Notes {
      public:
          int& operator[](std::size_t i) { return valeurs_[i]; }
          const int& operator[](std::size_t i) const { return valeurs_[i]; }

      private:
          std::vector<int> valeurs_{12, 15, 9};
      };

      int main() {
          Notes n;
          n[1] = 20;
          const Notes& lecture = n;
          std::println("{} {}", lecture[0], lecture[1]);
      }
      ```
    choices:
      - {text: "`12 20`", correct: true}
      - {text: "`12 15`", correct: false}
      - {text: "`20 15`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`12 20` : `n[1] = 20` écrit à travers la référence renvoyée. La lecture par la référence constante appelle la version `const`."
    check:
      output: "12 20"
  - key: code-foncteur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Multiplicateur {
      public:
          explicit Multiplicateur(int facteur) : facteur_{facteur} {}
          int operator()(int x) const { return x * facteur_; }

      private:
          int facteur_;
      };

      int main() {
          const Multiplicateur double_{2};
          const Multiplicateur triple{3};
          std::println("{} {}", double_(5), triple(double_(1)));
      }
      ```
    choices:
      - {text: "`10 6`", correct: true}
      - {text: "`10 3`", correct: false}
      - {text: "`7 6`", correct: false}
      - {text: "`10 5`", correct: false}
    answer: "`10 6` : chaque objet garde son facteur. `double_(1)` vaut 2, que `triple` multiplie par 3."
    check:
      output: "10 6"
  - key: code-etat
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          int operator()() { return ++appels_; }

      private:
          int appels_ = 0;
      };

      int main() {
          Compteur a;
          Compteur b;
          a();
          a();
          std::println("{} {}", a(), b());
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`3 4`", correct: false}
      - {text: "`1 1`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`3 1` : chaque foncteur a son propre état. `a` en est à son troisième appel, `b` à son premier."
    check:
      output: "3 1"
  - key: code-algorithme
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      struct PlusGrandQue {
          int seuil;
          bool operator()(int x) const { return x > seuil; }
      };

      int main() {
          const std::vector<int> v{3, 8, 1, 6, 4};
          std::println("{} {}",
                       std::count_if(v.begin(), v.end(), PlusGrandQue{3}),
                       std::count_if(v.begin(), v.end(), PlusGrandQue{6}));
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`4 2`", correct: false}
      - {text: "`3 2`", correct: false}
      - {text: "`2 1`", correct: false}
    answer: "`3 1` : le foncteur sert de prédicat. 8, 6 et 4 dépassent 3 ; seul 8 dépasse 6."
    check:
      output: "3 1"
  - key: bug-retour-par-valeur
    format: bug-fix
    question: |-
      Le compilateur refuse `n[0] = 18;` : « lvalue required as left operand of assignment ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      class Notes {
      public:
          int operator[](std::size_t i) { return valeurs_[i]; }

      private:
          std::vector<int> valeurs_{12, 15, 9};
      };

      int main() {
          Notes n;
          n[0] = 18;
          std::println("{}", n[0]);
      }
      ```
    choices:
      - {text: "Renvoyer une référence : `int& operator[](std::size_t i)`", correct: true}
      - {text: "Renvoyer un pointeur : `int* operator[](std::size_t i)`", correct: false}
      - {text: "Renvoyer une constante : `const int operator[](std::size_t i)`", correct: false}
      - {text: "Renvoyer une rvalue : `int&& operator[](std::size_t i)`", correct: false}
    answer: |-
      ```cpp
      int& operator[](std::size_t i) { return valeurs_[i]; }
      ```
      Par valeur, `n[0]` est une copie temporaire, qu'on ne peut pas affecter. La référence désigne l'élément du
      vecteur.
  - key: bug-version-const-manquante
    format: bug-fix
    question: |-
      Le compilateur répond « passing 'const Notes' as 'this' argument discards qualifiers ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      class Notes {
      public:
          int& operator[](std::size_t i) { return valeurs_[i]; }

      private:
          std::vector<int> valeurs_{12, 15, 9};
      };

      int premiere(const Notes& n) {
          return n[0];
      }

      int main() {
          std::println("{}", premiere(Notes{}));
      }
      ```
    choices:
      - {text: "Ajouter `const int& operator[](std::size_t i) const { return valeurs_[i]; }`", correct: true}
      - {text: "Recevoir `Notes& n` dans la fonction `premiere`, sans rien changer d'autre", correct: false}
      - {text: "Écrire `const_cast<Notes&>(n)[0]` dans la fonction `premiere`", correct: false}
      - {text: "Déclarer le membre `valeurs_` avec le mot-clé `mutable`", correct: false}
    answer: |-
      ```cpp
      int& operator[](std::size_t i) { return valeurs_[i]; }
      const int& operator[](std::size_t i) const { return valeurs_[i]; }
      ```
      La seule version existante n'est pas `const` : un objet constant ne peut pas l'appeler. On ajoute la version
      `const`, qui renvoie une référence constante.
  - key: bug-foncteur-non-const
    format: bug-fix
    question: |-
      Le compilateur répond « no match for call to '(const Doubleur) (int&)' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Doubleur {
          int operator()(int x) { return x * 2; }
      };

      int appliquer(const Doubleur& f, int x) {
          return f(x);
      }

      int main() {
          std::println("{}", appliquer(Doubleur{}, 21));
      }
      ```
    choices:
      - {text: "Déclarer `int operator()(int x) const { return x * 2; }`", correct: true}
      - {text: "Déclarer `const int operator()(int x) { return x * 2; }`", correct: false}
      - {text: "Déclarer `static int operator[](int x) { return x * 2; }`", correct: false}
      - {text: "Déclarer `int operator()(const int x) { return x * 2; }`", correct: false}
    answer: |-
      ```cpp
      int operator()(int x) const { return x * 2; }
      ```
      L'appel ne modifie pas le foncteur, mais l'opérateur ne le dit pas : il est inutilisable à travers une
      référence constante. C'est pourquoi l'`operator()` d'une lambda est `const` par défaut.
  - key: bug-reference-locale
    format: bug-fix
    question: |-
      Cet opérateur renvoie une référence vers une variable locale : le compilateur avertit (« reference to local
      variable 'copie' returned »), et la lecture est un comportement indéfini. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      class Notes {
      public:
          const int& operator[](std::size_t i) const {
              const int copie = valeurs_[i];
              return copie;
          }

      private:
          std::vector<int> valeurs_{12, 15, 9};
      };

      int main() {
          const Notes n;
          std::println("{}", n[1]);
      }
      ```
    choices:
      - {text: "Renvoyer directement l'élément : `return valeurs_[i];`", correct: true}
      - {text: "Déclarer `copie` sans `const`, et la renvoyer", correct: false}
      - {text: "Renvoyer `&copie` à la place de `copie`", correct: false}
      - {text: "Déclarer l'opérateur avec `noexcept`", correct: false}
    answer: |-
      ```cpp
      const int& operator[](std::size_t i) const {
          return valeurs_[i];
      }
      ```
      `copie` est détruite à la sortie de l'opérateur : la référence est pendante. L'élément du vecteur, lui, vit
      aussi longtemps que l'objet.
