notion: default-delete
lesson: |-
  Depuis C++11, deux écritures disent au compilateur quoi faire d'une fonction qu'il sait générer.

  **`= default`** : « **génère-la**, avec son comportement habituel ».

  ```cpp
  class Point {
  public:
      Point() = default;                // le constructeur par défaut, malgré l'autre constructeur
      Point(int x, int y) : x_{x}, y_{y} {}
      bool operator==(const Point&) const = default;   // comparaison membre à membre (C++20)
  private:
      int x_ = 0;
      int y_ = 0;
  };
  ```

  On s'en sert pour **redemander** une fonction que le compilateur ne génère plus : le constructeur par défaut quand
  on a déclaré un autre constructeur, le déplacement quand on a déclaré un destructeur. Elle s'applique au
  constructeur par défaut, aux cinq fonctions de copie, de déplacement et de destruction, et aux comparaisons.

  **`= delete`** : « **interdis-la** ». Tout appel devient une erreur de compilation.

  ```cpp
  class Verrou {
  public:
      Verrou() = default;
      Verrou(const Verrou&) = delete;              // pas de copie
      Verrou& operator=(const Verrou&) = delete;
  };
  ```

  C'est ainsi que `std::unique_ptr`, `std::mutex` ou `std::thread` sont **non copiables**.

  `= delete` s'applique à **n'importe quelle fonction**, pas seulement aux fonctions spéciales. On peut ainsi refuser
  une conversion :

  ```cpp
  void regler(int valeur);
  void regler(double) = delete;    // regler(2.5) ne compile plus, au lieu de tronquer
  ```

  Une fonction supprimée **participe à la résolution de surcharge** : si elle est la meilleure candidate, l'appel est
  refusé. Elle ne disparaît pas ; elle dit « cet appel est une erreur ».

  Avant C++11, on déclarait la copie dans la section privée sans la définir. `= delete` le dit clairement, et
  l'erreur apparaît à la compilation, avec un message lisible.

  **En entretien** : « `= default` redemande une fonction générée, `= delete` interdit un appel. J'écris les deux
  explicitement : la classe dit ce qu'elle permet. »
cards:
  - key: role-de-default
    format: course
    question: "Que demande `= default` après la déclaration d'une fonction ?"
    choices:
      - {text: "Que le compilateur la génère, avec son comportement habituel", correct: true}
      - {text: "Que le compilateur l'interdise, et refuse tout appel", correct: false}
      - {text: "Que la fonction renvoie la valeur par défaut de son type", correct: false}
      - {text: "Que la fonction soit appelée d'office à la création de l'objet", correct: false}
    answer: "`= default` redemande la version générée : par exemple le constructeur par défaut, que le compilateur ne fournit plus dès qu'un autre constructeur est déclaré."
  - key: role-de-delete
    format: course
    question: "Que fait `= delete` après la déclaration d'une fonction ?"
    choices:
      - {text: "Il interdit de l'appeler : tout appel est une erreur de compilation", correct: true}
      - {text: "Il libère la mémoire de l'objet quand elle est appelée", correct: false}
      - {text: "Il retire la fonction de l'exécutable, pour gagner de la place", correct: false}
      - {text: "Il fait de la fonction une fonction vide, sans effet", correct: false}
    answer: "La fonction est déclarée, mais supprimée : le compilateur refuse tout code qui la choisirait. Ce `delete`-là n'a rien à voir avec la libération de mémoire."
  - key: non-copiable
    format: course
    question: "Comment rend-on une classe non copiable ?"
    choices:
      - {text: "En supprimant son constructeur de copie et son affectation par copie avec `= delete`", correct: true}
      - {text: "En déclarant tous ses membres avec le mot-clé `const`, pour figer leur valeur", correct: false}
      - {text: "En supprimant son destructeur avec `= delete`, pour bloquer toute copie", correct: false}
      - {text: "En ne lui écrivant aucun constructeur, ni par défaut ni de copie", correct: false}
    answer: "`Classe(const Classe&) = delete;` et `Classe& operator=(const Classe&) = delete;`. C'est ce que font `std::unique_ptr` et `std::mutex`."
  - key: delete-sur-une-surcharge
    format: course
    question: "À quoi sert `void regler(double) = delete;` à côté de `void regler(int);` ?"
    choices:
      - {text: "À refuser `regler(2.5)`, au lieu de le convertir en `regler(2)`", correct: true}
      - {text: "À convertir `regler(2.5)` en `regler(2)`, sans avertissement", correct: false}
      - {text: "À supprimer aussi la version `int` de la fonction", correct: false}
      - {text: "À rien : `= delete` ne s'applique qu'aux constructeurs", correct: false}
    answer: "La version `double` est la meilleure candidate pour `regler(2.5)`, et elle est supprimée : l'appel ne compile pas. Sans elle, le nombre serait tronqué en silence."
  - key: vf-default-constructeur
    format: true-false
    question: "`Point() = default;` rétablit le constructeur par défaut d'une classe qui déclare un autre constructeur."
    truth: true
    answer: C'est son usage le plus courant.
  - key: vf-delete-fonctions-speciales
    format: true-false
    question: "`= delete` ne peut s'appliquer qu'aux constructeurs et à l'opérateur d'affectation."
    truth: false
    answer: Il s'applique à n'importe quelle fonction, membre ou libre, par exemple pour refuser une surcharge.
  - key: vf-erreur-a-l-execution
    format: true-false
    question: Appeler une fonction supprimée provoque une erreur à l'exécution.
    truth: false
    answer: "L'erreur est à la compilation : « use of deleted function »."
  - key: vf-default-n-importe-quelle
    format: true-false
    question: "`= default` peut s'appliquer à n'importe quelle fonction membre."
    truth: false
    answer: "Seulement à celles que le compilateur sait générer : constructeur par défaut, copie, déplacement, destructeur, comparaisons."
  - key: qcm-egalite
    format: multiple-choice
    question: "Depuis C++20, comment obtient-on une comparaison `==` membre à membre sans l'écrire ?"
    choices:
      - {text: "`bool operator==(const Point&) const = default;`", correct: true}
      - {text: "`bool operator==(const Point&) const = delete;`", correct: false}
      - {text: "`bool operator==(const Point&) const = auto;`", correct: false}
      - {text: "`bool equals(const Point&) = default;`", correct: false}
    answer: "`= default` s'applique aussi aux opérateurs de comparaison depuis C++20."
  - key: qcm-types-non-copiables
    format: multiple-choice
    question: Lequel de ces types de la bibliothèque standard est non copiable ?
    choices:
      - {text: "`std::unique_ptr`", correct: true}
      - {text: "`std::string`", correct: false}
      - {text: "`std::vector`", correct: false}
      - {text: "`std::shared_ptr`", correct: false}
    answer: "Son constructeur de copie est supprimé : la propriété est unique. `std::mutex` et `std::thread` sont dans le même cas."
  - key: qcm-message
    format: multiple-choice
    question: "Quel message donne GCC quand on copie un objet dont la copie est supprimée ?"
    choices:
      - {text: "« use of deleted function »", correct: true}
      - {text: "« undefined reference »", correct: false}
      - {text: "« segmentation fault »", correct: false}
      - {text: "« double free detected »", correct: false}
    answer: "Une erreur de compilation, qui nomme la fonction supprimée. « undefined reference » était le symptôme de l'ancienne technique : déclarer la copie sans la définir."
  - key: qcm-surcharge
    format: multiple-choice
    question: Une fonction supprimée participe-t-elle à la résolution de surcharge ?
    choices:
      - {text: "Oui : si elle est la meilleure candidate, l'appel est refusé", correct: true}
      - {text: "Non : le compilateur fait comme si elle n'existait pas", correct: false}
      - {text: "Oui, mais elle perd contre toute autre candidate", correct: false}
      - {text: "Non : elle n'est examinée qu'à l'édition des liens", correct: false}
    answer: "Elle est choisie comme n'importe quelle surcharge, puis l'appel est rejeté. C'est ce qui permet d'interdire un type d'argument précis."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour redemander le constructeur par défaut :
      ```cpp
      class Compte {
      public:
          Compte() = ___;
          explicit Compte(int depot) : solde_{depot} {}

      private:
          int solde_ = 0;
      };
      ```
    blanks:
      - [default]
    answer: "`Compte() = default;` : le compilateur génère le constructeur sans argument."
  - key: trous-delete
    format: fill-in
    question: |-
      Complète pour interdire la copie :
      ```cpp
      class Verrou {
      public:
          Verrou() = default;
          Verrou(const Verrou&) = ___;
      };
      ```
    blanks:
      - [delete]
    answer: "`= delete` supprime le constructeur de copie."
  - key: trous-egalite
    format: fill-in
    question: |-
      Complète pour que le compilateur génère la comparaison :
      ```cpp
      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = ___;
      };
      ```
    blanks:
      - [default]
    answer: "`= default` : une comparaison membre à membre, générée par le compilateur."
  - key: trous-surcharge
    format: fill-in
    question: |-
      Complète pour que `regler(2.5)` ne compile plus :
      ```cpp
      void regler(int valeur);
      void regler(double) = ___;
      ```
    blanks:
      - [delete]
    answer: "La surcharge `double` est supprimée : l'appel avec un nombre à virgule est refusé."
  - key: code-default
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte() = default;
          explicit Compte(int depot) : solde_{depot} {}
          int solde() const { return solde_; }

      private:
          int solde_ = 10;
      };

      int main() {
          Compte a;
          Compte b{100};
          std::println("{} {}", a.solde(), b.solde());
      }
      ```
    choices:
      - {text: "`10 100`", correct: true}
      - {text: "`0 100`", correct: false}
      - {text: "`100 100`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`10 100` : le constructeur redemandé avec `= default` laisse `solde_` à sa valeur par défaut, 10."
    check:
      output: "10 100"
  - key: code-copie-supprimee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Verrou {
      public:
          Verrou() = default;
          Verrou(const Verrou&) = delete;
      };

      int main() {
          Verrou a;
          Verrou b = a;
          std::println("copié");
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`copié`", correct: false}
      - {text: "Rien", correct: false}
      - {text: "Une exception à l'exécution", correct: false}
    answer: "Ça ne compile pas : le constructeur de copie est supprimé (« use of deleted function »)."
    check:
      compiles: false
  - key: code-surcharge-permise
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void regler(int valeur) {
          std::println("réglé sur {}", valeur);
      }

      void regler(double) = delete;

      int main() {
          regler(3);
          regler('a');
      }
      ```
    choices:
      - text: |-
          ```
          réglé sur 3
          réglé sur 97
          ```
        correct: true
      - {text: "Ça ne compile pas", correct: false}
      - text: |-
          ```
          réglé sur 3
          réglé sur a
          ```
        correct: false
      - {text: "`réglé sur 3`", correct: false}
    answer: |-
      ```
      réglé sur 3
      réglé sur 97
      ```
      Seule la version `double` est supprimée. Un `int` correspond exactement à la version `int`, et un `char` y est
      promu : son code, 97, est affiché.
    check:
      output: |-
        réglé sur 3
        réglé sur 97
  - key: code-egalite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = default;
      };

      int main() {
          Point a{1, 2};
          Point b{1, 2};
          Point c{1, 3};
          std::println("{} {} {}", a == b, a == c, a != c);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true false true` : la comparaison générée compare les membres un à un. Depuis C++20, `!=` se déduit de `==`."
    check:
      output: "true false true"
  - key: bug-copie-interdite
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function 'Journal::Journal(const Journal&)' ». La fonction ne fait
      qu'écrire dans le journal de l'appelant. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Journal {
      public:
          Journal() = default;
          Journal(const Journal&) = delete;
          void ecrire(const char* ligne) { std::println("{}", ligne); }
      };

      void demarrer(Journal journal) {
          journal.ecrire("démarrage");
      }

      int main() {
          Journal journal;
          demarrer(journal);
      }
      ```
    choices:
      - {text: "Passer le journal par référence : `Journal& journal`", correct: true}
      - {text: "Retirer `= delete`, pour rendre le journal copiable", correct: false}
      - {text: "Déclarer `demarrer` avec `= default`", correct: false}
      - {text: "Créer un second journal dans la fonction `demarrer`", correct: false}
    answer: |-
      ```cpp
      void demarrer(Journal& journal) {
      ```
      Passer par valeur demande une copie, que la classe interdit à dessein. La fonction veut le journal de
      l'appelant : c'est une référence qu'il lui faut.
  - key: bug-constructeur-par-defaut-perdu
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'Point::Point()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) : x_{x}, y_{y} {}
          int x() const { return x_; }

      private:
          int x_ = 0;
          int y_ = 0;
      };

      int main() {
          Point origine;
          std::println("{}", origine.x());
      }
      ```
    choices:
      - {text: "Ajouter `Point() = default;`", correct: true}
      - {text: "Ajouter `Point() = delete;`", correct: false}
      - {text: "Ajouter `~Point() = default;`", correct: false}
      - {text: "Écrire `Point origine();`", correct: false}
    answer: |-
      ```cpp
      Point() = default;
      ```
      Le constructeur à deux paramètres empêche la génération du constructeur par défaut. `= default` le redemande :
      `x_` et `y_` gardent leurs valeurs par défaut.
  - key: bug-destructeur-supprime
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function 'Session::~Session()' ». Pourquoi ?
      ```cpp
      #include <print>

      class Session {
      public:
          Session() = default;
          ~Session() = delete;
      };

      int main() {
          Session session;
          std::println("ouverte");
      }
      ```
    choices:
      - {text: "Sans destructeur, une variable locale ne peut pas être détruite à la fin du bloc", correct: true}
      - {text: "Un destructeur ne peut pas être déclaré dans la section `public:`", correct: false}
      - {text: "Une classe sans membre ne peut pas avoir de destructeur", correct: false}
      - {text: "`= delete` appelle le destructeur à la compilation", correct: false}
    answer: |-
      ```cpp
      ~Session() = default;
      ```
      À la fin de `main`, le compilateur doit détruire `session` : son destructeur est supprimé, il refuse. Un
      destructeur ne se supprime presque jamais ; ici, il suffit de ne pas le déclarer.
  - key: bug-conversion-refusee
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function 'void attendre(double)' ». Quelle correction respecte
      l'intention de l'auteur de la fonction ?
      ```cpp
      #include <print>

      void attendre(int secondes) {
          std::println("attente de {} s", secondes);
      }

      void attendre(double) = delete;

      int main() {
          attendre(2.5);
      }
      ```
    choices:
      - {text: "Passer un nombre entier de secondes : `attendre(3);`", correct: true}
      - {text: "Retirer la ligne `void attendre(double) = delete;`", correct: false}
      - {text: "Écrire `attendre((double)2.5);`", correct: false}
      - {text: "Déclarer `attendre(int)` avec `= default`", correct: false}
    answer: |-
      ```cpp
      attendre(3);
      ```
      L'auteur a supprimé la version `double` pour qu'un nombre à virgule ne soit pas tronqué sans qu'on le sache.
      À l'appelant de choisir le nombre entier qu'il veut.
