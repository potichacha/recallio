notion: litteraux-utilisateur
lesson: |-
  Un **littéral défini par l'utilisateur** attache un **suffixe** à un littéral, pour fabriquer directement un
  objet : `90min`, `"texte"s`, `3.5_km`. Le suffixe est une fonction, nommée `operator""`.

  **Ceux de la bibliothèque.** Ils n'ont pas de tiret bas, et vivent dans des espaces de noms à importer :

  ```cpp
  using namespace std::literals;

  auto duree = 90min + 30s;      // std::chrono : h, min, s, ms, us, ns
  auto texte = "bonjour"s;       // std::string, et non const char*
  auto vue = "bonjour"sv;        // std::string_view
  ```

  **Écrire le sien.**

  ```cpp
  struct Metres {
      double valeur;
  };

  constexpr Metres operator""_km(long double v) {
      return Metres{static_cast<double>(v) * 1000.0};
  }
  constexpr Metres operator""_m(unsigned long long v) {
      return Metres{static_cast<double>(v)};
  }

  auto distance = 3.5_km;        // Metres{3500.0}
  auto pas = 2_m;                // Metres{2.0}
  ```

  **Les règles.**

  - Le suffixe d'un littéral utilisateur **commence par un tiret bas** : `_km`. Les suffixes sans tiret bas sont
    **réservés à la bibliothèque standard**.
  - Le type du paramètre est **imposé** par la forme du littéral :

  | Littéral | Paramètre de `operator""` |
  |---|---|
  | entier : `2_m` | `unsigned long long` |
  | à virgule : `3.5_km` | `long double` |
  | caractère : `'a'_c` | `char` |
  | chaîne : `"abc"_s` | `const char*` et `std::size_t` |

    Un `int` ou un `double` ne conviennent pas : le compilateur refuse la déclaration.
  - Le littéral n'a **pas de signe** : `-5_m` est l'opérateur `-` appliqué à `5_m`. Il faut que le type résultat
    définisse le moins unaire.
  - L'opérateur est une fonction **libre**, pas un membre. On le range dans un **espace de noms**, que l'appelant
    importe par `using namespace`.
  - On le déclare **`constexpr`** : le littéral est alors calculé à la compilation.

  **À quoi ça sert.** À rendre les **unités** visibles dans le code, et vérifiées par le compilateur :
  `attendre(5s)` ne se confond pas avec `attendre(5ms)`, alors que `attendre(5)` ne dit rien. C'est l'outil des
  **types forts** : distances, durées, monnaies, identifiants.

  **Avec mesure.** Un suffixe obscur nuit à la lecture. On en définit peu, pour des notions que tout le projet
  connaît.

  **En entretien** : « Un littéral utilisateur est un `operator""` suivi d'un suffixe, qui construit un objet à
  partir d'un littéral : `5s`, `"abc"sv`. Les miens commencent par un tiret bas, et prennent un
  `unsigned long long` ou un `long double`. Ils servent aux unités et aux types forts. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un littéral défini par l'utilisateur ?"
    choices:
      - {text: "Un littéral suivi d'un suffixe, qu'une fonction `operator\"\"` transforme en objet", correct: true}
      - {text: "Une constante déclarée avec `#define`, remplacée par le préprocesseur", correct: false}
      - {text: "Une variable `constexpr` dont le nom se termine par un tiret bas", correct: false}
      - {text: "Une chaîne de caractères saisie par l'utilisateur du programme", correct: false}
    answer: "`90min`, `\"abc\"s`, `3.5_km` : le suffixe appelle une fonction, qui reçoit la valeur du littéral et renvoie l'objet."
  - key: tiret-bas
    format: course
    question: "Pourquoi le suffixe d'un littéral que tu définis commence-t-il par un tiret bas ?"
    choices:
      - {text: "Les suffixes sans tiret bas sont réservés à la bibliothèque standard", correct: true}
      - {text: "Le tiret bas indique au compilateur que le littéral est constant", correct: false}
      - {text: "Le tiret bas sépare la partie entière de la partie décimale", correct: false}
      - {text: "Les suffixes sans tiret bas sont interdits par le préprocesseur", correct: false}
    answer: "`s`, `min`, `sv` appartiennent à `std`. Un suffixe utilisateur sans tiret bas déclenche un avertissement, et pourrait entrer en conflit avec une future norme."
  - key: parametre
    format: course
    question: "Quel type de paramètre prend l'opérateur d'un littéral entier, comme `2_m` ?"
    choices:
      - {text: "`unsigned long long`", correct: true}
      - {text: "`int`", correct: false}
      - {text: "`double`", correct: false}
      - {text: "`std::size_t`, ou tout autre entier", correct: false}
    answer: "Le type est imposé : `unsigned long long` pour un entier, `long double` pour un nombre à virgule. Les autres types numériques sont refusés."
  - key: usage
    format: course
    question: "Quel est l'intérêt principal des littéraux utilisateur ?"
    choices:
      - {text: "Rendre les unités visibles dans le code, et vérifiées par le compilateur", correct: true}
      - {text: "Rendre les calculs plus rapides à l'exécution", correct: false}
      - {text: "Rendre les nombres plus précis qu'un `double`", correct: false}
      - {text: "Rendre les constantes modifiables pendant l'exécution", correct: false}
    answer: "`attendre(5s)` porte son unité, et produit un type distinct : passer des millisecondes à la place de secondes devient une conversion visible, ou une erreur."
  - key: vf-standard
    format: true-false
    question: "`90min` et `\"abc\"s` sont des littéraux fournis par la bibliothèque standard."
    truth: true
    answer: "Ils donnent une `std::chrono::minutes` et une `std::string`, après `using namespace std::literals;`."
  - key: vf-membre
    format: true-false
    question: "Un `operator\"\"` peut être une fonction membre d'une classe."
    truth: false
    answer: "C'est toujours une fonction libre, rangée dans un espace de noms."
  - key: vf-signe
    format: true-false
    question: "Dans `-5_m`, le signe moins fait partie du littéral transmis à l'opérateur."
    truth: false
    answer: "L'opérateur reçoit 5. Le moins unaire s'applique ensuite au résultat : le type renvoyé doit le définir."
  - key: vf-constexpr
    format: true-false
    question: "Un `operator\"\"` peut être déclaré `constexpr`."
    truth: true
    answer: "C'est l'usage : le littéral est alors une constante de compilation."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration permet d'écrire `3.5_km` ?"
    choices:
      - {text: "`Metres operator\"\"_km(long double v);`", correct: true}
      - {text: "`Metres operator\"\"_km(double v);`", correct: false}
      - {text: "`Metres operator_km(long double v);`", correct: false}
      - {text: "`Metres literal _km(long double v);`", correct: false}
    answer: "Un littéral à virgule transmet un `long double`. `double` est refusé par le compilateur."
  - key: qcm-chaine
    format: multiple-choice
    question: "Quels paramètres prend l'opérateur d'un littéral chaîne, comme `\"abc\"_s` ?"
    choices:
      - {text: "`const char*` et `std::size_t`", correct: true}
      - {text: "`std::string` seul", correct: false}
      - {text: "`const char*` seul", correct: false}
      - {text: "`char` et `int`", correct: false}
    answer: "Le pointeur vers les caractères, et leur nombre. La longueur évite de chercher le caractère nul."
  - key: qcm-importer
    format: multiple-choice
    question: "Quelle ligne rend utilisables les suffixes `s`, `min` et `sv` de la bibliothèque standard ?"
    choices:
      - {text: "`using namespace std::literals;`", correct: true}
      - {text: "`#include <literals>`", correct: false}
      - {text: "`using std::operator;`", correct: false}
      - {text: "`import std::suffixes;`", correct: false}
    answer: "Les opérateurs vivent dans `std::literals` et ses sous-espaces (`chrono_literals`, `string_literals`). Les en-têtes sont `<chrono>`, `<string>` et `<string_view>`."
  - key: qcm-type
    format: multiple-choice
    question: "Après `using namespace std::literals;`, quel est le type de `\"bonjour\"s` ?"
    choices:
      - {text: "`std::string`", correct: true}
      - {text: "`const char*`", correct: false}
      - {text: "`std::string_view`", correct: false}
      - {text: "`std::chrono::seconds`", correct: false}
    answer: "Le suffixe `s` sur une chaîne donne une `std::string` ; sur un nombre, des secondes. Le suffixe `sv` donne une `std::string_view`."
  - key: trous-operator
    format: fill-in
    question: |-
      Complète pour définir le suffixe `_m` :
      ```cpp
      constexpr Metres ___""_m(unsigned long long v) {
          return Metres{static_cast<double>(v)};
      }
      ```
    blanks:
      - [operator]
    answer: "`operator\"\"` suivi du suffixe."
  - key: trous-long-double
    format: fill-in
    question: |-
      Complète le type du paramètre, pour un littéral à virgule comme `3.5_km` :
      ```cpp
      constexpr Metres operator""_km(long ___ v) {
          return Metres{static_cast<double>(v) * 1000.0};
      }
      ```
    blanks:
      - [double]
    answer: "Un littéral à virgule est transmis comme `long double`."
  - key: trous-suffixe
    format: fill-in
    question: |-
      Complète avec le suffixe standard qui donne une `std::string_view` :
      ```cpp
      using namespace std::literals;
      const auto vue = "bonjour"___;
      ```
    blanks:
      - [sv]
    answer: "`sv` : *string view*."
  - key: trous-secondes
    format: fill-in
    question: |-
      Complète avec le suffixe standard des millisecondes :
      ```cpp
      using namespace std::literals;
      const auto delai = 250___;
      ```
    blanks:
      - [ms]
    answer: "`ms` donne une `std::chrono::milliseconds`."
  - key: code-unites
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Metres {
          double valeur;
      };

      constexpr Metres operator""_km(long double v) {
          return Metres{static_cast<double>(v) * 1000.0};
      }
      constexpr Metres operator""_m(unsigned long long v) {
          return Metres{static_cast<double>(v)};
      }

      int main() {
          std::println("{}", (2.5_km).valeur + (300_m).valeur);
      }
      ```
    choices:
      - {text: "`2800`", correct: true}
      - {text: "`302.5`", correct: false}
      - {text: "`2500300`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2800` : `2.5_km` vaut 2500 mètres, `300_m` vaut 300 mètres."
    check:
      output: "2800"
  - key: code-chrono
    format: code-output
    question: |-
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          using namespace std::literals;
          const std::chrono::seconds total = 2min + 30s;
          std::println("{}", total.count());
      }
      ```
    choices:
      - {text: "`150`", correct: true}
      - {text: "`32`", correct: false}
      - {text: "`2.5`", correct: false}
      - {text: "`230`", correct: false}
    answer: "`150` : les minutes sont converties en secondes par le système de types de `<chrono>`. 120 + 30."
    check:
      output: "150"
  - key: code-string
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      int main() {
          using namespace std::literals;
          const auto a = "ab"s + "cd";
          const auto b = "abc"s;
          std::println("{} {}", a, b.size());
      }
      ```
    choices:
      - {text: "`abcd 3`", correct: true}
      - {text: "`ab 3`", correct: false}
      - {text: "`abcd 4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`abcd 3` : le suffixe `s` fait de `\"ab\"` une `std::string`, qui sait se concaténer. Sans lui, additionner deux littéraux ne compilerait pas."
    check:
      output: "abcd 3"
  - key: code-chaine-longueur
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>

      constexpr std::size_t operator""_longueur(const char*, std::size_t taille) {
          return taille;
      }

      int main() {
          std::println("{} {}", "bonjour"_longueur, ""_longueur);
      }
      ```
    choices:
      - {text: "`7 0`", correct: true}
      - {text: "`8 1`", correct: false}
      - {text: "`7 1`", correct: false}
      - {text: "`8 0`", correct: false}
    answer: "`7 0` : le second paramètre est le nombre de caractères, sans le caractère nul final."
    check:
      output: "7 0"
  - key: bug-type-parametre
    format: bug-fix
    question: |-
      Le compilateur répond « 'Grammes operator""_g(int)' has invalid argument list ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      struct Grammes {
          int valeur;
      };

      constexpr Grammes operator""_g(int v) {
          return Grammes{v};
      }

      int main() {
          std::println("{}", (250_g).valeur);
      }
      ```
    choices:
      - {text: "Recevoir `unsigned long long v`, et convertir avec `static_cast<int>(v)`", correct: true}
      - {text: "Recevoir `const int& v`, pour éviter la copie du littéral", correct: false}
      - {text: "Recevoir `short v`, plus petit qu'un `int`", correct: false}
      - {text: "Recevoir `auto v`, que le compilateur déduira", correct: false}
    answer: |-
      ```cpp
      constexpr Grammes operator""_g(unsigned long long v) {
          return Grammes{static_cast<int>(v)};
      }
      ```
      Pour un littéral entier, le seul paramètre numérique accepté est `unsigned long long`.
  - key: bug-sans-tiret-bas
    format: bug-fix
    question: |-
      Le compilateur avertit : « literal operator suffixes not preceded by '_' are reserved for future
      standardization ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Kilos {
          double valeur;
      };

      constexpr Kilos operator""kg(long double v) {
          return Kilos{static_cast<double>(v)};
      }

      int main() {
          std::println("{}", (1.5kg).valeur);
      }
      ```
    choices:
      - {text: "Nommer le suffixe `_kg`, et écrire `1.5_kg`", correct: true}
      - {text: "Nommer le suffixe `KG`, en majuscules", correct: false}
      - {text: "Nommer le suffixe `kg_`, tiret bas à la fin", correct: false}
      - {text: "Nommer le suffixe `std::kg`", correct: false}
    answer: |-
      ```cpp
      constexpr Kilos operator""_kg(long double v) {
          return Kilos{static_cast<double>(v)};
      }
      ```
      Les suffixes sans tiret bas initial sont réservés à la bibliothèque standard.
  - key: bug-using-oublie
    format: bug-fix
    question: |-
      Le compilateur répond « unable to find numeric literal operator 'operator""s' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <chrono>
      #include <print>

      int main() {
          const auto delai = 5s;
          std::println("{}", delai.count());
      }
      ```
    choices:
      - {text: "Ajouter `using namespace std::literals;` avant la ligne", correct: true}
      - {text: "Ajouter `#include <string>` en haut du fichier", correct: false}
      - {text: "Écrire `5_s` avec un tiret bas", correct: false}
      - {text: "Écrire `5 s` avec une espace", correct: false}
    answer: |-
      ```cpp
      using namespace std::literals;
      const auto delai = 5s;
      ```
      Les opérateurs des littéraux standard sont dans un espace de noms à part : il faut l'importer.
      `std::chrono::seconds{5}` s'écrit sans rien importer.
  - key: bug-signe
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator-' (operand type is 'Degres') » sur `-5_deg`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      struct Degres {
          long long valeur;
      };

      constexpr Degres operator""_deg(unsigned long long v) {
          return Degres{static_cast<long long>(v)};
      }

      int main() {
          const Degres froid = -5_deg;
          std::println("{}", froid.valeur);
      }
      ```
    choices:
      - {text: "Définir `constexpr Degres operator-(Degres d) { return Degres{-d.valeur}; }`", correct: true}
      - {text: "Recevoir `long long v` dans l'opérateur du littéral, pour accepter le signe", correct: false}
      - {text: "Écrire le littéral `5_deg-`, avec le signe après le suffixe", correct: false}
      - {text: "Écrire le littéral `(-5)_deg`, avec des parenthèses", correct: false}
    answer: |-
      ```cpp
      constexpr Degres operator-(Degres d) {
          return Degres{-d.valeur};
      }
      ```
      Le littéral est `5_deg` ; le moins s'applique à l'objet obtenu. Un paramètre signé est refusé pour un
      opérateur de littéral.
