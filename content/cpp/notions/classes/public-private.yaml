notion: public-private
lesson: |-
  Une classe choisit ce qu'elle montre. Les membres sous **`public:`** sont utilisables par tout le code ; ceux sous
  **`private:`** ne le sont que par les fonctions membres de la classe.

  ```cpp
  class Compte {
  public:
      void deposer(int montant) {
          if (montant > 0) {
              solde_ += montant;
          }
      }
      int solde() const { return solde_; }

  private:
      int solde_ = 0;     // inaccessible de l'extérieur
  };
  ```

  **L'encapsulation.** Les données sont privées, et on passe par des fonctions publiques pour les lire ou les
  modifier. La classe peut ainsi garantir une règle, un **invariant** : ici, le solde ne change que par un dépôt
  positif. Avec un membre public, n'importe quel code pourrait écrire `compte.solde_ = -1000;`.

  Second bénéfice : on peut changer la représentation interne sans toucher au code qui utilise la classe, tant que
  les fonctions publiques ne changent pas.

  - L'accès est vérifié **à la compilation** : toucher un membre privé de l'extérieur ne compile pas.
  - Il se décide **par classe, pas par objet** : une fonction membre peut lire les membres privés d'un **autre objet
    de la même classe**.
  - Une fonction publique qui lit un membre s'appelle un **accesseur** ; on n'en écrit que pour ce que l'extérieur a
    besoin de connaître.

  **`struct` ou `class`.** `struct` : tout est public par défaut. `class` : tout est privé par défaut. La convention :
  `struct` pour un simple regroupement de données, sans règle à protéger ; `class` dès qu'il y a un invariant.

  **En entretien** : « Je rends les données privées pour que la classe soit seule à pouvoir les modifier : elle
  garantit ses invariants, et je peux changer son intérieur sans casser ses utilisateurs. »
tour:
  - title: public et private
    text: |-
      Une classe cache ses données sous `private:`, et offre sous `public:` les fonctions pour s'en servir. C'est
      l'**encapsulation** : le code extérieur ne peut pas mettre l'objet dans un état interdit.

      Ici, le solde ne peut changer que par `deposer`, qui refuse les montants négatifs.

      Essaie : ajoute `compte.solde_ = -1000;` dans `main`, puis exécute. Le compilateur refuse.
    example:
      files:
        main.cpp: |-
          #include <print>

          class Compte {
          public:
              void deposer(int montant) {
                  if (montant > 0) {
                      solde_ += montant;
                  }
              }

              int solde() const {
                  return solde_;
              }

          private:
              int solde_ = 0;
          };

          int main() {
              Compte compte;
              compte.deposer(100);
              compte.deposer(-500);

              std::println("{}", compte.solde());
          }
      output: "100"
cards:
  - key: role-de-private
    format: course
    question: Qui peut accéder à un membre privé d'une classe ?
    choices:
      - {text: "Les fonctions membres de cette classe seulement", correct: true}
      - {text: "Tout le code du fichier où la classe est définie", correct: false}
      - {text: "L'objet lui-même, mais pas les autres objets de la classe", correct: false}
      - {text: "Personne : un membre privé est en lecture seule", correct: false}
    answer: "Les fonctions membres de la classe (et ses amies, déclarées avec `friend`). Le reste du code, même dans le même fichier, n'y a pas accès."
  - key: encapsulation
    format: course
    question: "À quoi sert de rendre les données d'une classe privées ?"
    choices:
      - {text: "La classe est seule à les modifier, et peut garantir ses règles", correct: true}
      - {text: "Les données occupent moins de mémoire dans chaque objet", correct: false}
      - {text: "Les données sont chiffrées dans l'exécutable", correct: false}
      - {text: "Les fonctions membres s'exécutent plus vite", correct: false}
    answer: "C'est l'encapsulation : toute modification passe par une fonction de la classe, qui vérifie ce qu'elle veut. Ce n'est ni une protection de sécurité, ni une optimisation."
  - key: acces-par-classe
    format: course
    question: "Une fonction membre de `Compte` peut-elle lire le membre privé d'un autre objet `Compte` ?"
    choices:
      - {text: "Oui : l'accès se décide par classe, pas par objet", correct: true}
      - {text: "Non : chaque objet ne voit que ses propres membres privés", correct: false}
      - {text: "Oui, mais seulement si l'autre objet est déclaré `const`", correct: false}
      - {text: "Non, sauf si les deux objets sont dans le même bloc", correct: false}
    answer: "`bool plus_riche_que(const Compte& autre) const { return solde_ > autre.solde_; }` compile : `autre` est de la même classe."
  - key: struct-ou-class
    format: course
    question: "Par convention, quand écrit-on `class` plutôt que `struct` ?"
    choices:
      - {text: "Quand le type a une règle à garantir, donc des données privées", correct: true}
      - {text: "Quand le type a plus de trois données membres", correct: false}
      - {text: "Quand le type doit être passé par référence", correct: false}
      - {text: "Quand le type contient des chaînes de caractères", correct: false}
    answer: "`struct` pour un regroupement de données libres, `class` dès qu'un invariant demande de cacher l'état. Le langage, lui, ne distingue que la visibilité par défaut."
  - key: vf-verification
    format: true-false
    question: L'accès à un membre privé depuis l'extérieur est refusé à la compilation.
    truth: true
    answer: C'est une erreur de compilation, pas une vérification à l'exécution.
  - key: vf-struct-defaut
    format: true-false
    question: Dans une `struct`, les membres sont privés par défaut.
    truth: false
    answer: Ils sont publics par défaut. C'est dans une `class` qu'ils sont privés par défaut.
  - key: vf-plusieurs-sections
    format: true-false
    question: Une classe peut avoir plusieurs sections `public:` et `private:`.
    truth: true
    answer: Chaque étiquette vaut jusqu'à la suivante. On regroupe d'habitude le public en haut, le privé en bas.
  - key: vf-securite
    format: true-false
    question: "`private` empêche tout programme de lire la donnée en mémoire."
    truth: false
    answer: "C'est une règle du compilateur, pour organiser le code. La donnée est en mémoire comme les autres : ce n'est pas une protection de sécurité."
  - key: qcm-accesseur
    format: multiple-choice
    question: "Le membre `solde_` est privé. Comment le code extérieur peut-il connaître le solde ?"
    choices:
      - {text: "Par une fonction membre publique, qui le renvoie", correct: true}
      - {text: "En écrivant `compte.solde_` entre parenthèses", correct: false}
      - {text: "En écrivant `Compte::solde_`, avec le nom de la classe", correct: false}
      - {text: "En déclarant `compte` avec le mot-clé `public`", correct: false}
    answer: "Un accesseur : `int solde() const { return solde_; }`. Il donne la valeur sans permettre de la modifier."
  - key: qcm-invariant
    format: multiple-choice
    question: "Qu'appelle-t-on l'invariant d'une classe ?"
    choices:
      - {text: "Une règle sur ses données, vraie pour tout objet à tout moment", correct: true}
      - {text: "Une donnée membre déclarée avec le mot-clé `const`", correct: false}
      - {text: "Une fonction membre que personne ne peut redéfinir", correct: false}
      - {text: "Une valeur partagée par tous les objets de la classe", correct: false}
    answer: "Par exemple « le solde n'est jamais négatif ». Les données privées et les fonctions publiques qui vérifient leurs arguments sont ce qui permet de le garantir."
  - key: qcm-visibilite-par-defaut
    format: multiple-choice
    question: "Dans `class Point { int x; public: int y; };`, quels membres sont accessibles de l'extérieur ?"
    choices:
      - {text: "`y` seulement", correct: true}
      - {text: "`x` seulement", correct: false}
      - {text: "`x` et `y`", correct: false}
      - {text: "Aucun des deux", correct: false}
    answer: "`x` précède toute étiquette : dans une `class`, il est privé. `y` vient après `public:`."
  - key: qcm-changer-l-interieur
    format: multiple-choice
    question: Quel autre avantage, outre la protection des règles, apporte l'encapsulation ?
    choices:
      - {text: "On peut changer la représentation interne sans toucher au code qui utilise la classe", correct: true}
      - {text: "On peut créer des objets sans appeler de constructeur, donc plus vite", correct: false}
      - {text: "On peut modifier les données privées depuis n'importe quel fichier", correct: false}
      - {text: "On peut se passer de fichier d'en-tête pour déclarer la classe", correct: false}
    answer: "Le code extérieur ne dépend que des fonctions publiques. Tant qu'elles ne changent pas, l'intérieur peut être réécrit librement."
  - key: trous-private
    format: fill-in
    question: |-
      Complète pour que `solde_` soit inaccessible de l'extérieur :
      ```cpp
      class Compte {
      public:
          int solde() const { return solde_; }

      ___:
          int solde_ = 0;
      };
      ```
    blanks:
      - [private]
    answer: "`private:` réserve les membres qui le suivent aux fonctions de la classe."
  - key: trous-public
    format: fill-in
    question: |-
      Complète pour que `deposer` soit appelable de l'extérieur :
      ```cpp
      class Compte {
      ___:
          void deposer(int montant);

      private:
          int solde_ = 0;
      };
      ```
    blanks:
      - [public]
    answer: "`public:` ouvre les membres qui le suivent à tout le code."
  - key: trous-accesseur
    format: fill-in
    question: |-
      Complète l'accesseur pour qu'il renvoie le solde :
      ```cpp
      class Compte {
      public:
          int solde() const { return ___; }

      private:
          int solde_ = 0;
      };
      ```
    blanks:
      - [solde_, "this->solde_"]
    answer: "L'accesseur renvoie la valeur du membre privé `solde_`."
  - key: trous-mot-cle
    format: fill-in
    question: |-
      Complète avec le mot-clé pour lequel `x` et `y` sont publics sans rien écrire de plus :
      ```cpp
      ___ Point {
          int x;
          int y;
      };
      ```
    blanks:
      - [struct]
    answer: "Dans une `struct`, les membres sont publics par défaut."
  - key: code-depot-refuse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) {
              if (montant > 0) {
                  solde_ += montant;
              }
          }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte;
          compte.deposer(100);
          compte.deposer(-500);
          compte.deposer(50);
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "`150`", correct: true}
      - {text: "`-350`", correct: false}
      - {text: "`100`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`150` : `deposer` ignore le montant négatif. Comme `solde_` est privé, c'est le seul chemin pour le modifier."
    check:
      output: "150"
  - key: code-acces-prive
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte;
          compte.solde_ = 1000;
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`1000`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `solde_` est privé, `main` n'y a pas accès (« is private within this context »)."
    check:
      compiles: false
  - key: code-autre-objet
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) { solde_ += montant; }
          bool plus_riche_que(const Compte& autre) const {
              return solde_ > autre.solde_;
          }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte a;
          Compte b;
          a.deposer(50);
          b.deposer(80);
          std::println("{} {}", a.plus_riche_que(b), b.plus_riche_que(a));
      }
      ```
    choices:
      - {text: "`false true`", correct: true}
      - {text: "`true false`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`false true` : une fonction membre peut lire le membre privé d'un autre objet de sa classe. `a` a 50, `b` a 80."
    check:
      output: "false true"
  - key: code-struct-publique
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x = 1;
          int y = 2;
      };

      class Vecteur {
      public:
          int x = 3;

      private:
          int y = 4;
      };

      int main() {
          Point p;
          Vecteur v;
          std::println("{} {} {}", p.x, p.y, v.x);
      }
      ```
    choices:
      - {text: "`1 2 3`", correct: true}
      - {text: "`1 2 4`", correct: false}
      - {text: "`3 4 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`1 2 3` : les membres d'une `struct` sont publics par défaut. Dans `Vecteur`, `x` est sous `public:` ; seul `y`, qu'on ne lit pas ici, est privé."
    check:
      output: "1 2 3"
  - key: bug-acces-direct
    format: bug-fix
    question: |-
      Le compilateur répond « 'int Compte::solde_' is private within this context ». Quelle correction respecte
      l'encapsulation ?
      ```cpp
      #include <print>

      class Compte {
      public:
          void deposer(int montant) { solde_ += montant; }
          int solde() const { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte;
          compte.solde_ += 100;
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Appeler `compte.deposer(100);`", correct: true}
      - {text: "Déplacer `solde_` dans la section `public:`", correct: false}
      - {text: "Remplacer `class` par `struct`", correct: false}
      - {text: "Écrire `Compte::solde_ += 100;`", correct: false}
    answer: |-
      ```cpp
      compte.deposer(100);
      ```
      La classe offre une fonction pour cela. Rendre `solde_` public compilerait aussi, mais n'importe quel code
      pourrait alors lui donner une valeur interdite.
  - key: bug-donnee-publique
    format: bug-fix
    question: |-
      La classe doit garantir qu'une température ne descend jamais sous -273. Ce programme affiche pourtant `-500`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Thermometre {
      public:
          void regler(int valeur) {
              if (valeur >= -273) {
                  degres = valeur;
              }
          }
          int degres = 20;
      };

      int main() {
          Thermometre t;
          t.degres = -500;
          std::println("{}", t.degres);
      }
      ```
    choices:
      - {text: "Rendre `degres` privé, et lire sa valeur par une fonction publique", correct: true}
      - {text: "Déclarer `degres` avec le type `unsigned int`, qui n'est jamais négatif", correct: false}
      - {text: "Ajouter un second `if` dans `main`, avant l'affichage", correct: false}
      - {text: "Renommer `degres` en `degres_`, avec un tiret bas", correct: false}
    answer: |-
      ```cpp
      public:
          int degres() const { return degres_; }

      private:
          int degres_ = 20;
      ```
      Tant que la donnée est publique, `regler` peut être contournée. Privée, elle ne change plus que par les
      fonctions de la classe, qui vérifient la règle.
  - key: bug-fonction-privee
    format: bug-fix
    question: |-
      Le compilateur répond « 'void Rapport::afficher()' is private within this context ». Pourquoi ?
      ```cpp
      #include <print>

      class Rapport {
          int pages = 12;

          void afficher() {
              std::println("{} pages", pages);
          }
      };

      int main() {
          Rapport rapport;
          rapport.afficher();
      }
      ```
    choices:
      - {text: "Sans `public:`, tous les membres d'une `class` sont privés", correct: true}
      - {text: "Une fonction déclarée après une donnée est toujours privée", correct: false}
      - {text: "Une fonction qui lit un membre devient privée, comme lui", correct: false}
      - {text: "`main` doit être une fonction membre de `Rapport`", correct: false}
    answer: |-
      ```cpp
      class Rapport {
      public:
          void afficher() {
              std::println("{} pages", pages);
          }

      private:
          int pages = 12;
      };
      ```
      Une `class` commence en privé. Il faut une section `public:` pour ce que l'extérieur doit pouvoir appeler.
  - key: bug-accesseur-qui-expose
    format: bug-fix
    question: |-
      Le solde est privé, et ce programme le rend quand même négatif : il affiche `-1000`. Pourquoi ?
      ```cpp
      #include <print>

      class Compte {
      public:
          int& solde() { return solde_; }

      private:
          int solde_ = 0;
      };

      int main() {
          Compte compte;
          compte.solde() = -1000;
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "L'accesseur renvoie une référence modifiable vers le membre privé", correct: true}
      - {text: "L'accesseur est public, ce qui rend `solde_` public aussi", correct: false}
      - {text: "Une fonction sans paramètre ne peut pas protéger un membre", correct: false}
      - {text: "`private:` ne s'applique pas aux membres de type `int`", correct: false}
    answer: |-
      ```cpp
      int solde() const { return solde_; }
      ```
      Renvoyer `int&` donne à l'appelant un accès direct au membre : l'encapsulation est contournée. Un accesseur
      renvoie une copie, ou une référence constante.
