notion: constructeur-deplacement
lesson: |-
  **Déplacer** un objet, c'est construire le nouveau en **prenant les ressources** de l'ancien, au lieu de les
  copier. Pour un tampon d'un million d'éléments, la copie alloue et recopie tout ; le déplacement copie **un
  pointeur**.

  Deux fonctions s'en chargent, qui prennent une **référence rvalue** :

  ```cpp
  class Tampon {
  public:
      Tampon(Tampon&& autre) noexcept                     // constructeur de déplacement
          : taille_{autre.taille_}, donnees_{autre.donnees_} {
          autre.taille_ = 0;
          autre.donnees_ = nullptr;                        // la source ne possède plus rien
      }

      Tampon& operator=(Tampon&& autre) noexcept {        // affectation par déplacement
          if (this != &autre) {
              delete[] donnees_;
              taille_ = autre.taille_;
              donnees_ = autre.donnees_;
              autre.taille_ = 0;
              autre.donnees_ = nullptr;
          }
          return *this;
      }
  };
  ```

  **Les trois gestes** : prendre les ressources, **vider la source**, la laisser dans un état **valide**. Son
  destructeur sera appelé : s'il gardait le pointeur, le bloc serait libéré deux fois.

  **Quand elles sont appelées.** Quand la source est une **rvalue** : un temporaire (le résultat d'une fonction), ou
  un objet passé par `std::move`. Pour une lvalue, c'est la copie.

  **`noexcept`.** Ces deux fonctions doivent être marquées `noexcept`. `std::vector`, quand il réalloue, ne déplace
  ses éléments **que si** leur constructeur de déplacement est `noexcept` ; sinon il les **copie**, pour pouvoir
  revenir en arrière en cas d'exception.

  **Ce que génère le compilateur.** Il génère les deux fonctions de déplacement, membre à membre, **seulement si** la
  classe ne déclare ni destructeur, ni copie, ni l'autre fonction de déplacement. Une classe faite de `std::vector`
  et de `std::string` se déplace donc bien sans rien écrire.

  Sans fonction de déplacement, rien ne casse : le déplacement **retombe sur la copie**.

  **En entretien** : « Le déplacement transfère les ressources et laisse la source vide mais valide. Je le marque
  `noexcept`, sinon `std::vector` copie au lieu de déplacer. »
cards:
  - key: principe
    format: course
    question: Que fait un constructeur de déplacement ?
    choices:
      - {text: "Il prend les ressources de la source, au lieu de les copier", correct: true}
      - {text: "Il copie les ressources de la source, puis détruit la source", correct: false}
      - {text: "Il échange les ressources de deux objets déjà construits", correct: false}
      - {text: "Il change l'adresse de l'objet en mémoire", correct: false}
    answer: "Le nouvel objet reprend le pointeur de la source, qui est ensuite vidée. Rien n'est alloué ni recopié. La source n'est pas détruite : elle le sera plus tard, à la fin de sa portée."
  - key: vider-la-source
    format: course
    question: Pourquoi le constructeur de déplacement met-il à `nullptr` le pointeur de la source ?
    choices:
      - {text: "Pour que le destructeur de la source ne libère pas le bloc qui a changé de propriétaire", correct: true}
      - {text: "Pour que la source ne puisse plus jamais recevoir de nouvelle valeur", correct: false}
      - {text: "Pour que le compilateur détruise la source dès la fin du constructeur", correct: false}
      - {text: "Pour que la source occupe moins de place en mémoire après le déplacement", correct: false}
    answer: "La source sera détruite comme tout objet. Si elle gardait le pointeur, son destructeur libérerait le bloc que le nouvel objet possède : double libération."
  - key: role-de-noexcept
    format: course
    question: "Pourquoi marque-t-on `noexcept` un constructeur de déplacement ?"
    choices:
      - {text: "Sans cela, `std::vector` copie ses éléments au lieu de les déplacer quand il réalloue", correct: true}
      - {text: "Sans cela, le constructeur de déplacement ne compile pas", correct: false}
      - {text: "Sans cela, le constructeur de déplacement est remplacé par le destructeur", correct: false}
      - {text: "Sans cela, le compilateur ignore `std::move`", correct: false}
    answer: "Le vecteur garantit de rester intact si une exception survient pendant la réallocation. Il ne peut la tenir avec des déplacements que s'ils ne lèvent rien ; sinon, il copie."
  - key: quand-genere
    format: course
    question: Quand le compilateur génère-t-il de lui-même les fonctions de déplacement d'une classe ?
    choices:
      - {text: "Quand elle ne déclare ni destructeur, ni fonction de copie", correct: true}
      - {text: "Toujours, quelles que soient les fonctions déclarées", correct: false}
      - {text: "Quand elle déclare un destructeur", correct: false}
      - {text: "Jamais : il faut toujours les écrire", correct: false}
    answer: "C'est le cas des classes qui suivent la règle de zéro. Déclarer un destructeur ou une copie supprime cette génération, et le déplacement retombe sur la copie."
  - key: vf-source-detruite
    format: true-false
    question: Déplacer un objet le détruit.
    truth: false
    answer: La source reste un objet valide, vidé de ses ressources. Elle est détruite plus tard, à la fin de sa portée.
  - key: vf-temporaire
    format: true-false
    question: Le constructeur de déplacement est choisi quand la source est un temporaire.
    truth: true
    answer: Un temporaire est une rvalue, à laquelle le paramètre `T&&` se lie. Un objet passé par `std::move` aussi.
  - key: vf-sans-deplacement
    format: true-false
    question: "Sur une classe qui a une copie mais pas de fonction de déplacement, `std::move` fait échouer la compilation."
    truth: false
    answer: "Le code compile, et la copie est appelée : `const T&` accepte aussi une rvalue."
  - key: vf-cout
    format: true-false
    question: "Déplacer un `std::vector` d'un million d'éléments recopie ses éléments un par un."
    truth: false
    answer: Le déplacement transfère le pointeur vers le bloc. Son coût ne dépend pas du nombre d'éléments.
  - key: qcm-signature
    format: multiple-choice
    question: "Quelle est la signature du constructeur de déplacement de la classe `Tampon` ?"
    choices:
      - {text: "`Tampon(Tampon&& autre) noexcept;`", correct: true}
      - {text: "`Tampon(const Tampon& autre) noexcept;`", correct: false}
      - {text: "`Tampon(const Tampon&& autre);`", correct: false}
      - {text: "`Tampon move(Tampon& autre);`", correct: false}
    answer: "Une référence rvalue non constante : il faut pouvoir modifier la source pour la vider. Avec `const`, on ne pourrait que copier."
  - key: qcm-laquelle
    format: multiple-choice
    question: "`a` et `b` sont deux `Tampon` déjà construits. Quelle fonction appelle `b = std::move(a);` ?"
    choices:
      - {text: "L'affectation par déplacement", correct: true}
      - {text: "Le constructeur de déplacement", correct: false}
      - {text: "L'affectation par copie", correct: false}
      - {text: "Le destructeur de `a`", correct: false}
    answer: "`b` existe déjà : c'est une affectation. La source est une rvalue : c'est la version par déplacement."
  - key: qcm-etat-de-la-source
    format: multiple-choice
    question: "Dans quel état un constructeur de déplacement doit-il laisser la source ?"
    choices:
      - {text: "Valide : on doit pouvoir la détruire et la réaffecter sans danger", correct: true}
      - {text: "Identique : elle doit garder toutes ses données", correct: false}
      - {text: "Détruite : son destructeur ne doit plus être appelé", correct: false}
      - {text: "Indéterminée : on ne doit plus jamais la toucher", correct: false}
    answer: "Son destructeur s'exécutera, et on peut vouloir lui affecter une nouvelle valeur. Vide et valide, donc : un pointeur nul, une taille à zéro."
  - key: qcm-regle-de-zero
    format: multiple-choice
    question: "Une classe a pour seuls membres une `std::string` et un `std::vector<int>`. Que faut-il écrire pour qu'elle se déplace efficacement ?"
    choices:
      - {text: "Rien : le déplacement généré déplace chaque membre", correct: true}
      - {text: "Un constructeur de déplacement qui copie chaque membre", correct: false}
      - {text: "Un destructeur, qui déclenche la génération du déplacement", correct: false}
      - {text: "Un appel à `std::move` dans le constructeur par défaut", correct: false}
    answer: "Les fonctions générées déplacent membre à membre, et ces deux types savent se déplacer. Écrire un destructeur ferait au contraire perdre la génération."
  - key: trous-esperluettes
    format: fill-in
    question: |-
      Complète le paramètre du constructeur de déplacement :
      ```cpp
      Tampon(Tampon___ autre) noexcept;
      ```
    blanks:
      - ["&&"]
    answer: "`Tampon&& autre` : une référence rvalue."
  - key: trous-noexcept
    format: fill-in
    question: |-
      Complète pour que `std::vector` déplace les tampons quand il réalloue :
      ```cpp
      Tampon(Tampon&& autre) ___;
      ```
    blanks:
      - [noexcept]
    answer: "`noexcept` : le constructeur promet de ne lever aucune exception."
  - key: trous-vider
    format: fill-in
    question: |-
      Complète pour que la source ne possède plus le bloc :
      ```cpp
      Tampon(Tampon&& autre) noexcept : donnees_{autre.donnees_} {
          autre.donnees_ = ___;
      }
      ```
    blanks:
      - [nullptr]
    answer: "La source est mise à `nullptr` : son destructeur ne libérera rien."
  - key: trous-move
    format: fill-in
    question: |-
      Complète pour que `b` soit construit par déplacement :
      ```cpp
      Tampon a{1000};
      Tampon b = std::___(a);
      ```
    blanks:
      - [move]
    answer: "`std::move(a)` fait de `a` une rvalue : le constructeur de déplacement est choisi."
  - key: code-copie-ou-deplacement
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      int main() {
          Trace a;
          Trace b = a;
          Trace c = std::move(a);
      }
      ```
    choices:
      - text: |-
          ```
          copie
          déplacement
          ```
        correct: true
      - text: |-
          ```
          copie
          copie
          ```
        correct: false
      - text: |-
          ```
          déplacement
          déplacement
          ```
        correct: false
      - text: |-
          ```
          déplacement
          copie
          ```
        correct: false
    answer: |-
      ```
      copie
      déplacement
      ```
      `a` est une lvalue : `Trace b = a;` copie. `std::move(a)` en fait une rvalue : le constructeur de déplacement
      est choisi.
    check:
      output: |-
        copie
        déplacement
  - key: code-source-videe
    format: code-output
    question: |-
      ```cpp
      #include <cstddef>
      #include <print>
      #include <utility>

      class Tampon {
      public:
          explicit Tampon(std::size_t taille) : taille_{taille}, donnees_{new int[taille]{}} {}
          Tampon(Tampon&& autre) noexcept : taille_{autre.taille_}, donnees_{autre.donnees_} {
              autre.taille_ = 0;
              autre.donnees_ = nullptr;
          }
          ~Tampon() { delete[] donnees_; }
          std::size_t taille() const { return taille_; }

      private:
          std::size_t taille_;
          int* donnees_;
      };

      int main() {
          Tampon a{100};
          Tampon b = std::move(a);
          std::println("{} {}", a.taille(), b.taille());
      }
      ```
    choices:
      - {text: "`0 100`", correct: true}
      - {text: "`100 100`", correct: false}
      - {text: "`100 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`0 100` : `b` a pris le bloc de `a`, que le constructeur de déplacement a vidé. `a` reste un objet valide, de taille nulle."
    check:
      output: "0 100"
  - key: code-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>
      #include <vector>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      int main() {
          std::vector<Trace> v;
          v.reserve(2);
          Trace a;
          Trace b;
          v.push_back(a);
          v.push_back(std::move(b));
      }
      ```
    choices:
      - text: |-
          ```
          copie
          déplacement
          ```
        correct: true
      - text: |-
          ```
          copie
          copie
          ```
        correct: false
      - text: |-
          ```
          déplacement
          déplacement
          ```
        correct: false
      - text: |-
          ```
          déplacement
          copie
          ```
        correct: false
    answer: |-
      ```
      copie
      déplacement
      ```
      `push_back` a deux versions : pour une lvalue, il copie ; pour une rvalue, il déplace. `b` ne doit plus être
      utilisée ensuite pour sa valeur.
    check:
      output: |-
        copie
        déplacement
  - key: code-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace& operator=(const Trace&) {
              std::println("affectation par copie");
              return *this;
          }
          Trace& operator=(Trace&&) noexcept {
              std::println("affectation par déplacement");
              return *this;
          }
      };

      int main() {
          Trace a;
          Trace b;
          b = a;
          b = std::move(a);
          b = Trace{};
      }
      ```
    choices:
      - text: |-
          ```
          affectation par copie
          affectation par déplacement
          affectation par déplacement
          ```
        correct: true
      - text: |-
          ```
          affectation par copie
          affectation par déplacement
          affectation par copie
          ```
        correct: false
      - text: |-
          ```
          affectation par copie
          affectation par copie
          affectation par copie
          ```
        correct: false
      - text: |-
          ```
          affectation par déplacement
          affectation par déplacement
          affectation par déplacement
          ```
        correct: false
    answer: |-
      ```
      affectation par copie
      affectation par déplacement
      affectation par déplacement
      ```
      `a` est une lvalue : copie. `std::move(a)` et le temporaire `Trace{}` sont des rvalues : déplacement.
    check:
      output: |-
        affectation par copie
        affectation par déplacement
        affectation par déplacement
  - key: bug-source-non-videe
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>

      class Tampon {
      public:
          Tampon() : donnees_{new int[100]} {}
          Tampon(Tampon&& autre) noexcept : donnees_{autre.donnees_} {}
          ~Tampon() { delete[] donnees_; }

      private:
          int* donnees_;
      };

      int main() {
          Tampon a;
          Tampon b = std::move(a);
          std::println("déplacé");
      }
      ```
    choices:
      - {text: "Mettre `autre.donnees_` à `nullptr` dans le constructeur de déplacement", correct: true}
      - {text: "Mettre `donnees_` à `nullptr` dans le constructeur de déplacement", correct: false}
      - {text: "Appeler `delete[] autre.donnees_;` dans le constructeur de déplacement", correct: false}
      - {text: "Retirer `noexcept` du constructeur de déplacement", correct: false}
    answer: |-
      ```cpp
      Tampon(Tampon&& autre) noexcept : donnees_{autre.donnees_} {
          autre.donnees_ = nullptr;
      }
      ```
      Le déplacement a recopié le pointeur sans vider la source : `a` et `b` libèrent le même bloc. La source doit
      renoncer à ce qu'elle a cédé.
  - key: bug-noexcept-oublie
    format: bug-fix
    question: |-
      Quand le vecteur s'agrandit, ce programme affiche `copie` au lieu de `déplacement`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>
      #include <vector>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) { std::println("déplacement"); }
      };

      int main() {
          std::vector<Trace> v(1);
          v.reserve(8);
      }
      ```
    choices:
      - {text: "Marquer le constructeur de déplacement `noexcept`", correct: true}
      - {text: "Marquer le constructeur de copie `noexcept`", correct: false}
      - {text: "Marquer le constructeur de déplacement `explicit`", correct: false}
      - {text: "Retirer le constructeur de copie de la classe", correct: false}
    answer: |-
      ```cpp
      Trace(Trace&&) noexcept { std::println("déplacement"); }
      ```
      En réallouant, le vecteur transfère ses éléments dans le nouveau bloc. Il ne les déplace que si le déplacement
      promet de ne rien lever ; sinon, il les copie, par sécurité.
  - key: bug-source-const
    format: bug-fix
    question: |-
      Ce programme affiche `copie`, alors que l'auteur attendait `déplacement`. Pourquoi ?
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      int main() {
          const Trace a;
          Trace b = std::move(a);
      }
      ```
    choices:
      - {text: "`a` est `const` : on ne peut pas la vider, la copie est choisie", correct: true}
      - {text: "`std::move` ne s'applique qu'aux temporaires", correct: false}
      - {text: "Le constructeur de déplacement doit être déclaré avant celui de copie", correct: false}
      - {text: "`noexcept` empêche le déplacement d'un objet local", correct: false}
    answer: |-
      ```cpp
      Trace a;
      Trace b = std::move(a);
      ```
      `std::move` sur un objet constant donne une `const Trace&&`, que le constructeur de déplacement ne peut pas
      recevoir. Le compilateur retombe sur la copie, sans rien dire.
  - key: bug-parametre-const
    format: bug-fix
    question: |-
      Le compilateur refuse la ligne `autre.donnees_ = nullptr;`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <utility>

      class Tampon {
      public:
          Tampon() : donnees_{new int[100]} {}
          Tampon(const Tampon&& autre) noexcept : donnees_{autre.donnees_} {
              autre.donnees_ = nullptr;
          }
          ~Tampon() { delete[] donnees_; }

      private:
          int* donnees_;
      };

      int main() {
          Tampon a;
          Tampon b = std::move(a);
          std::println("déplacé");
      }
      ```
    choices:
      - {text: "Retirer `const` du paramètre : `Tampon&& autre`", correct: true}
      - {text: "Retirer la ligne `autre.donnees_ = nullptr;`", correct: false}
      - {text: "Déclarer `donnees_` avec le mot-clé `mutable`", correct: false}
      - {text: "Remplacer `&&` par une seule esperluette", correct: false}
    answer: |-
      ```cpp
      Tampon(Tampon&& autre) noexcept : donnees_{autre.donnees_} {
          autre.donnees_ = nullptr;
      }
      ```
      Déplacer modifie la source : le paramètre ne peut pas être constant. Retirer la ligne compilerait, et mènerait
      à une double libération.
