notion: membres-statiques
lesson: |-
  Un membre **`static`** appartient à **la classe**, et non à chacun de ses objets. Il existe en **un seul
  exemplaire**, que tous les objets partagent, et il existe même si aucun objet n'a été créé.

  **Une donnée statique.**

  ```cpp
  class Session {
  public:
      Session() { ++ouvertes; }
      ~Session() { --ouvertes; }

      static inline int ouvertes = 0;    // une seule variable pour toute la classe
  };

  Session a;
  Session b;
  std::println("{}", Session::ouvertes);  // 2
  ```

  On y accède par le **nom de la classe** : `Session::ouvertes`. L'écriture `a.ouvertes` est permise, mais elle
  laisse croire que la valeur est propre à `a`.

  **La définir.** Depuis C++17, `static inline` déclare **et** définit la variable dans la classe. Sans `inline`,
  la ligne dans la classe n'est qu'une déclaration, et il faut une définition, une seule, dans un `.cpp` :

  ```cpp
  // session.hpp
  class Session { static int ouvertes; };

  // session.cpp
  int Session::ouvertes = 0;
  ```

  L'oublier donne une erreur de l'éditeur de liens : `undefined reference to 'Session::ouvertes'`.

  **Les constantes de classe.** `static constexpr` est la forme habituelle :

  ```cpp
  class Tampon {
      static constexpr int taille_max = 1024;
  };
  ```

  **Une fonction statique.** Elle s'appelle **sans objet** : `Session::nombre()`. Elle n'a donc **pas de `this`**,
  et ne peut lire que les membres statiques. Elle a accès aux membres privés des objets qu'on lui passe.

  ```cpp
  class Session {
  public:
      static int nombre() { return ouvertes; }
  private:
      static inline int ouvertes = 0;
  };
  ```

  Une fonction statique ne peut être ni `const`, ni `virtual` : ces deux mots portent sur l'objet courant.

  **À quoi ça sert.**

  - **Compter** les objets, ou leur donner un identifiant.
  - Des **constantes** liées à la classe.
  - Une **fonction de fabrique** : `Couleur::depuis_hexa("#ff0000")`, qui construit un objet par un constructeur
    privé.
  - Une fonction utilitaire qui se range naturellement avec la classe.

  **Les précautions.**

  - Une donnée statique modifiable est un **état global** : elle complique les tests, et demande une
    synchronisation si plusieurs threads y touchent.
  - L'ordre d'initialisation de variables statiques de **fichiers différents** n'est pas défini.
  - `sizeof` d'un objet ne compte pas les membres statiques : ils vivent ailleurs.

  **En entretien** : « Un membre statique appartient à la classe : une seule variable partagée par tous les
  objets, ou une fonction appelable sans objet, donc sans `this`. Je le définis avec `static inline` ou
  `static constexpr`, et j'y accède par `Classe::membre`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'une donnée membre `static` ?"
    choices:
      - {text: "Une variable unique, partagée par tous les objets de la classe", correct: true}
      - {text: "Une variable dont chaque objet de la classe a sa propre copie", correct: false}
      - {text: "Une variable qui ne peut plus changer après sa création", correct: false}
      - {text: "Une variable locale qui garde sa valeur entre deux appels", correct: false}
    answer: "Elle appartient à la classe, existe en un seul exemplaire, et existe même sans aucun objet."
  - key: fonction-statique
    format: course
    question: "Qu'est-ce qui distingue une fonction membre `static` d'une fonction membre ordinaire ?"
    choices:
      - {text: "Elle s'appelle sans objet, et n'a pas de pointeur `this`", correct: true}
      - {text: "Elle ne peut être appelée qu'une seule fois par programme", correct: false}
      - {text: "Elle ne peut pas accéder aux membres privés de la classe", correct: false}
      - {text: "Elle s'exécute à la compilation, et non à l'exécution", correct: false}
    answer: "`Session::nombre()` ne s'applique à aucun objet : elle ne peut lire directement que les membres statiques."
  - key: definition-hors-classe
    format: course
    question: "Une classe déclare `static int compteur;`, sans `inline`. Que faut-il en plus ?"
    choices:
      - {text: "Une définition `int Classe::compteur = 0;` dans un seul fichier source", correct: true}
      - {text: "Une définition `static int compteur = 0;` dans chaque fichier source", correct: false}
      - {text: "Une initialisation dans le constructeur de la classe", correct: false}
      - {text: "Rien : la déclaration dans la classe suffit toujours", correct: false}
    answer: "Sans `inline`, la ligne dans la classe ne fait que déclarer. La variable doit être définie une fois, sinon l'éditeur de liens répond « undefined reference »."
  - key: acces
    format: course
    question: "Comment accède-t-on de préférence à un membre statique public ?"
    choices:
      - {text: "Par le nom de la classe : `Session::ouvertes`", correct: true}
      - {text: "Par un objet de la classe : `session.ouvertes`", correct: false}
      - {text: "Par le pointeur de l'objet : `this->ouvertes`", correct: false}
      - {text: "Par le mot-clé seul : `static::ouvertes`", correct: false}
    answer: "`Classe::membre` montre que la valeur est celle de la classe. Passer par un objet compile, mais induit le lecteur en erreur."
  - key: vf-sans-objet
    format: true-false
    question: "Un membre statique existe même si aucun objet de la classe n'a été créé."
    truth: true
    answer: "Il vit pendant toute la durée du programme, comme une variable globale rangée dans la classe."
  - key: vf-this
    format: true-false
    question: "Une fonction membre statique peut lire un membre non statique sans qu'on lui passe d'objet."
    truth: false
    answer: "Sans `this`, elle n'a pas d'objet où lire. Il faut lui passer un objet en paramètre."
  - key: vf-sizeof
    format: true-false
    question: "Une donnée membre statique augmente la taille de chaque objet de la classe."
    truth: false
    answer: "Elle est rangée à part, une seule fois. `sizeof` de l'objet ne la compte pas."
  - key: vf-const
    format: true-false
    question: "Une fonction membre statique peut être déclarée `const`."
    truth: false
    answer: "`const` porte sur l'objet courant, et une fonction statique n'en a pas. Elle ne peut pas non plus être `virtual`."
  - key: qcm-definir-en-classe
    format: multiple-choice
    question: "Quelle ligne déclare et définit un compteur statique directement dans la classe (C++17) ?"
    choices:
      - {text: "`static inline int compteur = 0;`", correct: true}
      - {text: "`static int compteur = 0;`", correct: false}
      - {text: "`extern int compteur = 0;`", correct: false}
      - {text: "`static mutable int compteur = 0;`", correct: false}
    answer: "`inline` fait de la ligne une définition. Sans lui, initialiser dans la classe une donnée statique non constante ne compile pas."
  - key: qcm-constante
    format: multiple-choice
    question: "Quelle est la forme habituelle d'une constante de classe ?"
    choices:
      - {text: "`static constexpr int taille_max = 1024;`", correct: true}
      - {text: "`const int taille_max = 1024;`, dans chaque objet", correct: false}
      - {text: "`#define taille_max 1024`, dans la classe", correct: false}
      - {text: "`static int taille_max = 1024;`", correct: false}
    answer: "`static constexpr` : une seule valeur, connue à la compilation, rangée dans la portée de la classe."
  - key: qcm-appel
    format: multiple-choice
    question: "Comment appelles-tu la fonction statique `nombre` de la classe `Session`, sans créer d'objet ?"
    choices:
      - {text: "`Session::nombre()`", correct: true}
      - {text: "`Session.nombre()`", correct: false}
      - {text: "`Session->nombre()`", correct: false}
      - {text: "`static nombre()`", correct: false}
    answer: "L'opérateur de portée `::` désigne un membre de la classe."
  - key: qcm-usage
    format: multiple-choice
    question: "Lequel de ces besoins appelle un membre statique ?"
    choices:
      - {text: "Compter le nombre d'objets de la classe en vie", correct: true}
      - {text: "Garder le nom propre à chaque client", correct: false}
      - {text: "Garder le solde propre à chaque compte", correct: false}
      - {text: "Garder les coordonnées propres à chaque point", correct: false}
    answer: "Le compte est une information sur la classe entière. Le nom, le solde et les coordonnées diffèrent d'un objet à l'autre."
  - key: trous-static
    format: fill-in
    question: |-
      Complète pour que la fonction s'appelle sans objet :
      ```cpp
      class Session {
      public:
          ___ int nombre() { return ouvertes; }
      };
      ```
    blanks:
      - [static]
    answer: "`static` rattache la fonction à la classe, et non à un objet."
  - key: trous-portee
    format: fill-in
    question: |-
      Complète pour lire le membre statique par le nom de la classe :
      ```cpp
      std::println("{}", Session___ouvertes);
      ```
    blanks:
      - ["::"]
    answer: "`Classe::membre` : l'opérateur de portée."
  - key: trous-inline
    format: fill-in
    question: |-
      Complète pour définir la variable statique dans la classe :
      ```cpp
      class Session {
          static ___ int ouvertes = 0;
      };
      ```
    blanks:
      - [inline]
    answer: "`static inline` (C++17) : déclaration et définition en une ligne."
  - key: trous-definition
    format: fill-in
    question: |-
      Complète la définition, dans le fichier source, du membre déclaré `static int ouvertes;` :
      ```cpp
      int ___::ouvertes = 0;
      ```
    blanks:
      - [Session]
    answer: "Hors de la classe, le nom du membre est précédé de `Session::`."
  - key: code-compteur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Session {
      public:
          Session() { ++ouvertes; }
          ~Session() { --ouvertes; }
          static inline int ouvertes = 0;
      };

      int main() {
          Session a;
          {
              Session b;
              Session c;
              std::print("{} ", Session::ouvertes);
          }
          std::println("{}", Session::ouvertes);
      }
      ```
    choices:
      - {text: "`3 1`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`2 1`", correct: false}
      - {text: "`1 1`", correct: false}
    answer: "`3 1` : les trois objets partagent le compteur. À la fin du bloc, `b` et `c` sont détruits : il reste `a`."
    check:
      output: "3 1"
  - key: code-partage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Reglage {
      public:
          static inline int volume = 5;
          int balance = 0;
      };

      int main() {
          Reglage a;
          Reglage b;
          a.volume = 9;
          a.balance = 3;
          std::println("{} {}", b.volume, b.balance);
      }
      ```
    choices:
      - {text: "`9 0`", correct: true}
      - {text: "`5 0`", correct: false}
      - {text: "`9 3`", correct: false}
      - {text: "`5 3`", correct: false}
    answer: "`9 0` : `volume` est unique pour la classe, donc `b` voit la modification faite par `a`. `balance` est propre à chaque objet."
    check:
      output: "9 0"
  - key: code-identifiants
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Ticket {
      public:
          Ticket() : numero_{++dernier_} {}
          int numero() const { return numero_; }
          static int emis() { return dernier_; }

      private:
          int numero_;
          static inline int dernier_ = 100;
      };

      int main() {
          Ticket a;
          Ticket b;
          std::println("{} {} {}", a.numero(), b.numero(), Ticket::emis());
      }
      ```
    choices:
      - {text: "`101 102 102`", correct: true}
      - {text: "`100 101 102`", correct: false}
      - {text: "`101 101 101`", correct: false}
      - {text: "`102 102 102`", correct: false}
    answer: "`101 102 102` : chaque construction incrémente le compteur commun, et garde sa valeur. La fonction statique lit le dernier numéro émis."
    check:
      output: "101 102 102"
  - key: code-sizeof
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Sans {
          int valeur;
      };

      struct Avec {
          int valeur;
          static inline long long total = 0;
      };

      int main() {
          std::println("{}", sizeof(Sans) == sizeof(Avec));
      }
      ```
    choices:
      - {text: "`true`", correct: true}
      - {text: "`false`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true` : le membre statique n'est pas rangé dans les objets. Les deux structures ont la taille d'un `int`."
    check:
      output: "true"
  - key: bug-definition-manquante
    format: bug-fix
    question: |-
      L'édition de liens échoue : « undefined reference to `Compteur::total' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          static int total;
      };

      int main() {
          Compteur::total = 3;
          std::println("{}", Compteur::total);
      }
      ```
    choices:
      - {text: "Déclarer `static inline int total = 0;` dans la classe", correct: true}
      - {text: "Déclarer `static const int total;` dans la classe", correct: false}
      - {text: "Déclarer `extern static int total;` dans la classe", correct: false}
      - {text: "Déclarer `int total;` dans la fonction `main`", correct: false}
    answer: |-
      ```cpp
      static inline int total = 0;
      ```
      Sans `inline`, la ligne dans la classe déclare la variable sans la définir : elle n'existe nulle part.
      `static inline` la définit ; l'autre voie est d'écrire `int Compteur::total = 0;` dans un fichier source.
  - key: bug-membre-dans-static
    format: bug-fix
    question: |-
      Le compilateur répond « invalid use of member 'Compte::solde_' in static member function ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          static int solde() { return solde_; }

      private:
          int solde_ = 50;
      };

      int main() {
          Compte c;
          std::println("{}", c.solde());
      }
      ```
    choices:
      - {text: "Retirer `static` : `int solde() const { return solde_; }`", correct: true}
      - {text: "Écrire `return this->solde_;` dans la fonction", correct: false}
      - {text: "Écrire `return Compte::solde_;` dans la fonction", correct: false}
      - {text: "Déclarer la fonction `static int solde() const`", correct: false}
    answer: |-
      ```cpp
      int solde() const { return solde_; }
      ```
      Une fonction statique n'a pas d'objet courant : elle ne sait pas de quel compte lire le solde. Le solde est
      propre à chaque objet : la fonction doit être une fonction membre ordinaire.
  - key: bug-initialisation-en-classe
    format: bug-fix
    question: |-
      Le compilateur répond « ISO C++ forbids in-class initialization of non-const static member
      'Jeu::meilleur_score' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Jeu {
      public:
          static int meilleur_score = 0;
      };

      int main() {
          Jeu::meilleur_score = 12;
          std::println("{}", Jeu::meilleur_score);
      }
      ```
    choices:
      - {text: "Écrire `static inline int meilleur_score = 0;`", correct: true}
      - {text: "Écrire `static volatile int meilleur_score = 0;`", correct: false}
      - {text: "Écrire `static const int meilleur_score = 0;`", correct: false}
      - {text: "Écrire `static mutable int meilleur_score = 0;`", correct: false}
    answer: |-
      ```cpp
      static inline int meilleur_score = 0;
      ```
      Une donnée statique modifiable ne s'initialise dans la classe qu'avec `inline`. La rendre `const` ferait
      compiler la déclaration, mais `main` ne pourrait plus la modifier.
  - key: bug-compteur-par-objet
    format: bug-fix
    question: |-
      Ce programme devrait afficher `3`, le nombre de robots créés. Il affiche `1`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Robot {
      public:
          Robot() { ++crees; }
          int crees = 0;
      };

      int main() {
          Robot a;
          Robot b;
          Robot c;
          std::println("{}", c.crees);
      }
      ```
    choices:
      - {text: "Déclarer `static inline int crees = 0;`", correct: true}
      - {text: "Déclarer `mutable int crees = 0;`", correct: false}
      - {text: "Déclarer `const int crees = 0;`", correct: false}
      - {text: "Déclarer `int crees = 3;`", correct: false}
    answer: |-
      ```cpp
      static inline int crees = 0;
      ```
      Chaque robot a son propre `crees`, qui passe de 0 à 1. Pour un compteur commun à toute la classe, le membre
      doit être statique.
