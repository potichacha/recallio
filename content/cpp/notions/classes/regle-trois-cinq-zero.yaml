notion: regle-trois-cinq-zero
lesson: |-
  Cinq fonctions décident de la façon dont un objet est **copié, déplacé et détruit** : le **destructeur**, le
  **constructeur de copie**, l'**affectation par copie**, le **constructeur de déplacement** et l'**affectation par
  déplacement**. Trois règles disent quand les écrire.

  **La règle de trois.** Si une classe a besoin d'écrire **l'une** des trois premières (destructeur, constructeur de
  copie, affectation par copie), elle a presque toujours besoin des **trois**.

  Pourquoi : on écrit un destructeur parce que la classe possède une ressource. La copie générée duplique alors le
  pointeur, et deux objets libèrent la même ressource. Écrire le destructeur seul, c'est préparer une double
  libération.

  **La règle de cinq.** Depuis C++11, on ajoute les **deux fonctions de déplacement**. Sans elles, la classe reste
  correcte, mais chaque déplacement devient une copie.

  Un détail qui compte : dès qu'une classe **déclare** un destructeur ou une fonction de copie, le compilateur **ne
  génère plus** les fonctions de déplacement. Un simple `~Classe() {}` fait donc perdre le déplacement.

  **La règle de zéro.** La meilleure classe n'écrit **aucune** des cinq. Ses membres gèrent eux-mêmes leurs
  ressources (`std::vector`, `std::string`, `std::unique_ptr`), et les fonctions générées font ce qu'il faut : copie
  profonde, déplacement, libération.

  ```cpp
  class Releve {                    // règle de zéro
      std::string eleve_;
      std::vector<int> notes_;
  };
  ```

  **En pratique.**

  - Presque toutes les classes : règle de **zéro**.
  - Une classe qui encapsule une ressource brute, et ne fait que cela : règle de **cinq**, ou la copie interdite avec
    `= delete`.
  - Il faut un destructeur pour une autre raison (une trace, une classe de base) : on redemande les autres avec
    `= default`.

  **En entretien** : « Règle de zéro par défaut : je compose avec des types qui se gèrent seuls. Si je dois écrire un
  destructeur, j'écris ou j'interdis aussi la copie et le déplacement : c'est la règle de cinq. »
cards:
  - key: regle-de-trois
    format: course
    question: Que dit la règle de trois ?
    choices:
      - {text: "Qui écrit le destructeur, le constructeur de copie ou l'affectation par copie doit écrire les trois", correct: true}
      - {text: "Une classe ne doit pas avoir plus de trois constructeurs", correct: false}
      - {text: "Une classe doit avoir trois sections : publique, protégée et privée", correct: false}
      - {text: "Un objet ne doit pas être copié plus de trois fois", correct: false}
    answer: "Ces trois fonctions vont ensemble : si l'une doit être écrite à la main, c'est que la classe gère une ressource, et les versions générées des deux autres sont fausses."
  - key: regle-de-zero
    format: course
    question: Que dit la règle de zéro ?
    choices:
      - {text: "De n'écrire aucune des cinq fonctions, en confiant les ressources à des membres qui se gèrent seuls", correct: true}
      - {text: "De n'écrire aucun constructeur, pour que tous les membres vaillent zéro", correct: false}
      - {text: "De ne jamais allouer de mémoire sur le tas", correct: false}
      - {text: "De ne laisser aucun membre public dans une classe", correct: false}
    answer: "Avec des membres comme `std::vector` ou `std::unique_ptr`, les fonctions générées sont correctes. La classe n'a ni destructeur, ni copie, ni déplacement à écrire."
  - key: pourquoi-les-trois
    format: course
    question: Pourquoi écrire un destructeur sans écrire la copie est-il dangereux ?
    choices:
      - {text: "La copie générée duplique le pointeur : deux objets libèrent la même ressource", correct: true}
      - {text: "La copie générée appelle deux fois le destructeur de l'objet d'origine", correct: false}
      - {text: "La copie générée ignore le destructeur, et la ressource fuit", correct: false}
      - {text: "Le compilateur refuse une classe qui n'a que le destructeur", correct: false}
    answer: "Le destructeur signale que la classe possède quelque chose. La copie membre à membre n'en tient pas compte : deux propriétaires, donc une double libération."
  - key: deplacement-perdu
    format: course
    question: "Que perd une classe qui déclare un destructeur, même vide ?"
    choices:
      - {text: "Les fonctions de déplacement générées : ses déplacements deviennent des copies", correct: true}
      - {text: "Le constructeur par défaut : elle ne peut plus être créée sans argument", correct: false}
      - {text: "La copie générée : elle ne peut plus être copiée", correct: false}
      - {text: "Rien : un destructeur vide est sans effet", correct: false}
    answer: "Déclarer un destructeur ou une fonction de copie empêche la génération du déplacement. Le code compile toujours : `std::move` retombe sur la copie, en silence."
  - key: vf-cinq
    format: true-false
    question: La règle de cinq ajoute à la règle de trois le constructeur et l'affectation par déplacement.
    truth: true
    answer: Depuis C++11. Les deux fonctions de déplacement complètent les trois fonctions historiques.
  - key: vf-toujours-ecrire
    format: true-false
    question: Toute classe doit écrire son destructeur et son constructeur de copie.
    truth: false
    answer: "C'est l'inverse : la plupart des classes n'écrivent aucune des cinq fonctions. C'est la règle de zéro."
  - key: vf-vector-membre
    format: true-false
    question: "Une classe dont les seuls membres sont des `std::vector` et des `std::string` peut suivre la règle de zéro."
    truth: true
    answer: Ces types se copient, se déplacent et se libèrent seuls. Les fonctions générées de la classe sont correctes.
  - key: vf-sans-deplacement
    format: true-false
    question: Une classe qui suit la règle de trois sans écrire le déplacement ne compile pas.
    truth: false
    answer: Elle compile et reste correcte. Les déplacements se font par copie, ce qui coûte plus cher.
  - key: qcm-les-cinq
    format: multiple-choice
    question: Laquelle de ces fonctions ne fait pas partie des cinq de la règle de cinq ?
    choices:
      - {text: "Le constructeur par défaut", correct: true}
      - {text: "Le destructeur", correct: false}
      - {text: "L'affectation par copie", correct: false}
      - {text: "Le constructeur de déplacement", correct: false}
    answer: "Les cinq sont : destructeur, constructeur de copie, affectation par copie, constructeur de déplacement, affectation par déplacement. Le constructeur par défaut n'en est pas."
  - key: qcm-ressource-brute
    format: multiple-choice
    question: "Une classe encapsule un descripteur de fichier du système, qu'elle ferme dans son destructeur. Que fait-elle de la copie ?"
    choices:
      - {text: "Elle l'interdit avec `= delete`, ou elle l'écrit", correct: true}
      - {text: "Elle la laisse au compilateur, qui duplique le descripteur", correct: false}
      - {text: "Elle l'ignore : un descripteur ne peut pas être copié", correct: false}
      - {text: "Elle la remplace par un second destructeur", correct: false}
    answer: "La copie générée dupliquerait le numéro du descripteur : deux objets le fermeraient. Soit la classe est non copiable, soit elle duplique vraiment la ressource."
  - key: qcm-redemander
    format: multiple-choice
    question: "Une classe doit déclarer un destructeur pour écrire une trace. Comment garde-t-elle son déplacement ?"
    choices:
      - {text: "En le redemandant : `Classe(Classe&&) = default;`", correct: true}
      - {text: "En déclarant le destructeur avec `noexcept`", correct: false}
      - {text: "En déclarant le destructeur dans la section `private:`", correct: false}
      - {text: "Rien à faire : le déplacement est toujours généré", correct: false}
    answer: "`= default` demande au compilateur les fonctions qu'il ne génère plus de lui-même. On redemande alors aussi la copie, pour être explicite."
  - key: qcm-choix-habituel
    format: multiple-choice
    question: Quelle règle suit-on pour une classe ordinaire, faite de chaînes, de nombres et de conteneurs ?
    choices:
      - {text: "La règle de zéro", correct: true}
      - {text: "La règle de trois", correct: false}
      - {text: "La règle de cinq", correct: false}
      - {text: "Aucune : il faut tout écrire", correct: false}
    answer: "On n'écrit rien. Les règles de trois et de cinq ne concernent que les rares classes qui gèrent elles-mêmes une ressource brute."
  - key: bug-destructeur-seul
    format: bug-fix
    question: |-
      Ce programme plante à la fin de `main` : « free(): double free detected ». Quelle règle la classe enfreint-elle,
      et quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Tampon {
      public:
          Tampon() : donnees_{new int[100]} {}
          ~Tampon() { delete[] donnees_; }

      private:
          int* donnees_;
      };

      int main() {
          Tampon a;
          Tampon b = a;
          std::println("copié");
      }
      ```
    choices:
      - {text: "La règle de trois : il faut écrire ou interdire la copie", correct: true}
      - {text: "La règle de zéro : il faut retirer le destructeur, sans rien changer d'autre", correct: false}
      - {text: "La règle de cinq : il faut ajouter un second destructeur", correct: false}
      - {text: "Aucune : il faut déclarer `b` avant `a`", correct: false}
    answer: |-
      ```cpp
      Tampon(const Tampon&) = delete;
      Tampon& operator=(const Tampon&) = delete;
      ```
      Un destructeur écrit à la main, sans la copie : la copie générée duplique le pointeur. On interdit la copie, ou
      on l'écrit en profondeur. Avec un `std::vector<int>` pour membre, la règle de zéro suffirait.
  - key: bug-affectation-manquante
    format: bug-fix
    question: |-
      La classe a un destructeur et un constructeur de copie, et le programme plante quand même. Quelle fonction
      manque ?
      ```cpp
      #include <print>

      class Boite {
      public:
          explicit Boite(int valeur) : valeur_{new int{valeur}} {}
          Boite(const Boite& autre) : valeur_{new int{*autre.valeur_}} {}
          ~Boite() { delete valeur_; }

      private:
          int* valeur_;
      };

      int main() {
          Boite a{1};
          Boite b{2};
          a = b;
          std::println("affecté");
      }
      ```
    choices:
      - {text: "L'affectation par copie, la troisième de la règle de trois", correct: true}
      - {text: "Le constructeur par défaut, sans argument", correct: false}
      - {text: "Un second constructeur de copie, pour `a`", correct: false}
      - {text: "Un accesseur, pour lire la valeur", correct: false}
    answer: |-
      ```cpp
      Boite& operator=(const Boite& autre) {
          if (this != &autre) {
              *valeur_ = *autre.valeur_;
          }
          return *this;
      }
      ```
      `a = b;` appelle l'affectation générée, qui copie le pointeur. Les trois fonctions vont ensemble : en écrire
      deux laisse la troisième fausse.
  - key: bug-copie-inutile
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada 2`, et affiche `Ada 0` : les notes ne sont pas copiées. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <string>
      #include <vector>

      class Releve {
      public:
          Releve(std::string eleve, std::vector<int> notes) : eleve_{eleve}, notes_{notes} {}
          Releve(const Releve& autre) : eleve_{autre.eleve_} {}
          void afficher() const { std::println("{} {}", eleve_, notes_.size()); }

      private:
          std::string eleve_;
          std::vector<int> notes_;
      };

      int main() {
          Releve a{"Ada", {12, 15}};
          Releve b = a;
          b.afficher();
      }
      ```
    choices:
      - {text: "Supprimer le constructeur de copie : celui du compilateur copie tout", correct: true}
      - {text: "Ajouter un destructeur, qui vide le vecteur de notes", correct: false}
      - {text: "Remplacer le vecteur par un pointeur brut vers les notes", correct: false}
      - {text: "Déclarer `afficher` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      class Releve {
      public:
          Releve(std::string eleve, std::vector<int> notes) : eleve_{eleve}, notes_{notes} {}
          void afficher() const { std::println("{} {}", eleve_, notes_.size()); }
      ```
      Les membres se copient très bien seuls : c'est la règle de zéro. Le constructeur écrit à la main n'apporte
      qu'un risque, celui d'oublier un membre.
  - key: bug-destructeur-vide
    format: bug-fix
    question: |-
      Ce programme affiche `copie`, alors que l'auteur attendait `déplacement`. Pourquoi ?
      ```cpp
      #include <print>
      #include <utility>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace(Trace&&) noexcept { std::println("déplacement"); }
      };

      class Rapport {
      public:
          ~Rapport() {}

      private:
          Trace contenu_;
      };

      int main() {
          Rapport a;
          Rapport b = std::move(a);
      }
      ```
    choices:
      - {text: "Le destructeur déclaré empêche la génération du déplacement de `Rapport`", correct: true}
      - {text: "`std::move` ne s'applique pas à un objet qui a un membre privé", correct: false}
      - {text: "Le constructeur de déplacement de `Trace` est `noexcept`", correct: false}
      - {text: "Un destructeur vide détruit `a` avant le déplacement", correct: false}
    answer: |-
      ```cpp
      class Rapport {
      private:
          Trace contenu_;
      };
      ```
      Dès qu'une classe déclare son destructeur, le compilateur ne génère plus son déplacement : `std::move(a)`
      retombe sur la copie. Retirer ce destructeur inutile, ou écrire `Rapport(Rapport&&) = default;`, rend le
      déplacement.
  - key: situation-nouvelle-classe
    format: scenario
    question: |-
      Tu écris une classe `Commande` : un identifiant, un nom de client, une liste d'articles. Un collègue te demande
      où sont son destructeur et son constructeur de copie. Que réponds-tu ?
    choices:
      - {text: "Qu'il n'en faut pas : ses membres se gèrent seuls, c'est la règle de zéro", correct: true}
      - {text: "Qu'il a raison : toute classe doit écrire les cinq fonctions", correct: false}
      - {text: "Qu'il faut au moins un destructeur vide, par précaution", correct: false}
      - {text: "Qu'il faut interdire la copie de toute classe qui a une liste", correct: false}
    answer: |-
      Un `int`, une `std::string` et un `std::vector` se copient, se déplacent et se détruisent correctement. Les
      fonctions générées suffisent. Un destructeur vide « par précaution » ferait même perdre le déplacement.
  - key: situation-ressource
    format: scenario
    question: |-
      Tu dois encapsuler une connexion à une base de données, ouverte par une fonction du C et fermée par une autre.
      Comment conçois-tu la classe ?
    choices:
      - {text: "Une petite classe qui ne fait que cela : destructeur, copie interdite, déplacement écrit", correct: true}
      - {text: "Une classe métier qui gère la connexion parmi dix autres responsabilités", correct: false}
      - {text: "Une classe sans destructeur, que l'appelant ferme à la main", correct: false}
      - {text: "Une classe copiable, dont chaque copie ferme la connexion", correct: false}
    answer: |-
      La règle de cinq s'applique à une classe dont le seul rôle est de posséder la ressource. Les autres classes
      l'utilisent comme membre, et retrouvent la règle de zéro.
  - key: situation-legacy
    format: scenario
    question: |-
      Une vieille classe a un destructeur qui fait `delete[]`, et rien d'autre. Elle est copiée à plusieurs endroits
      du code, qui « marche depuis des années ». Que proposes-tu ?
    choices:
      - {text: "Remplacer le tableau par un `std::vector`, et retirer le destructeur", correct: true}
      - {text: "Ne rien toucher : un code qui marche ne se corrige pas", correct: false}
      - {text: "Ajouter un commentaire qui interdit de copier la classe", correct: false}
      - {text: "Retirer le destructeur, et garder le pointeur brut", correct: false}
    answer: |-
      Chaque copie de cette classe prépare une double libération : le programme a tenu par chance. Un vecteur rend la
      classe correcte sans changer son interface. Retirer le seul destructeur échangerait le risque contre une
      fuite certaine.
  - key: situation-performance
    format: scenario
    question: |-
      Une classe a un destructeur et une copie profonde, bien écrits. Le profileur montre pourtant des copies de
      plusieurs mégaoctets à chaque `push_back` dans un vecteur. Que manque-t-il ?
    choices:
      - {text: "Les fonctions de déplacement : sans elles, tout déplacement est une copie", correct: true}
      - {text: "Un second destructeur, plus rapide que le premier", correct: false}
      - {text: "Un constructeur par défaut, pour préparer les éléments", correct: false}
      - {text: "Le mot-clé `inline` devant le constructeur de copie", correct: false}
    answer: |-
      La règle de trois rend la classe correcte, pas rapide. Avec un constructeur et une affectation par déplacement,
      marqués `noexcept`, le vecteur transfère le bloc de mémoire au lieu de le dupliquer.
