notion: operateurs-surcharges
lesson: |-
  En C++, on peut donner un sens aux opérateurs (`+`, `==`, `[]`, `<<`...) pour ses propres types. Un opérateur
  surchargé est une **fonction** au nom particulier : `operator+`, `operator==`. Écrire `a + b` revient à appeler
  cette fonction.

  ```cpp
  struct Vecteur {
      int x;
      int y;
  };

  Vecteur operator+(const Vecteur& a, const Vecteur& b) {
      return {a.x + b.x, a.y + b.y};
  }

  Vecteur c = a + b;      // appelle operator+(a, b)
  ```

  **Membre ou fonction libre ?** Un opérateur binaire s'écrit de deux façons.

  | | Fonction membre | Fonction libre |
  |---|---|---|
  | Déclaration | `Vecteur operator+(const Vecteur& b) const;` | `Vecteur operator+(const Vecteur& a, const Vecteur& b);` |
  | `a + b` appelle | `a.operator+(b)` | `operator+(a, b)` |
  | Opérande de gauche | forcément un `Vecteur` : **aucune conversion** | convertible, comme celui de droite |

  La différence se voit avec un type mixte : si `Fraction` se construit depuis un `int`, `f + 2` marche dans les
  deux cas, mais `2 + f` **seulement avec la fonction libre**, car `2` n'a pas de fonction membre.

  **Les usages.**

  - **Membres obligatoires** : `=`, `[]`, `()`, `->`.
  - **Membres par habitude** : ceux qui **modifient** l'objet de gauche : `+=`, `-=`, `++`, `--`. Ils renvoient
    `*this` par référence.
  - **Libres par habitude** : les opérateurs **symétriques** : `+`, `-`, `*`, `==`, `<`. Et `<<` pour l'affichage,
    dont l'opérande de gauche est le flux.

  **Écrire `+` à partir de `+=`.** On implémente l'opérateur composé comme membre, et l'opérateur simple par-dessus :

  ```cpp
  struct Vecteur {
      int x;
      int y;

      Vecteur& operator+=(const Vecteur& autre) {
          x += autre.x;
          y += autre.y;
          return *this;
      }
  };

  Vecteur operator+(Vecteur a, const Vecteur& b) {
      a += b;             // a est une copie : on la modifie et on la renvoie
      return a;
  }
  ```

  La logique n'est écrite qu'une fois, et la fonction libre n'a pas besoin d'accéder aux membres privés.

  **Les règles du langage.**

  - On ne crée **pas** d'opérateur nouveau (`**`, `<>`), et l'on ne change ni la **priorité** ni le nombre
    d'opérandes.
  - Au moins un opérande doit être d'un **type défini par l'utilisateur** : impossible de redéfinir `int + int`.
  - Certains ne se surchargent pas : `.`, `::`, `?:`, `sizeof`.
  - `&&` et `||` surchargés perdent leur évaluation paresseuse : on ne les surcharge pas.

  **La règle de bon sens.** Un opérateur doit faire **ce que le lecteur attend** : `+` additionne et ne modifie pas
  ses opérandes, `==` compare sans effet de bord. Si le sens n'est pas évident, une fonction nommée vaut mieux.

  **En entretien** : « Un opérateur surchargé est une fonction `operator@`. Les opérateurs symétriques comme `+` et
  `==` sont des fonctions libres, pour que les conversions s'appliquent aux deux opérandes ; ceux qui modifient
  l'objet, comme `+=`, sont membres et renvoient `*this`. J'écris `+` à partir de `+=`. »
cards:
  - key: definition
    format: course
    question: "Qu'est-ce qu'un opérateur surchargé ?"
    choices:
      - {text: "Une fonction nommée `operator@`, appelée quand on écrit l'opérateur sur ses types", correct: true}
      - {text: "Une macro qui remplace l'opérateur par du texte avant la compilation", correct: false}
      - {text: "Un nouvel opérateur, absent du langage, que la classe invente", correct: false}
      - {text: "Une conversion implicite qui transforme l'objet en nombre", correct: false}
    answer: "`a + b` devient `operator+(a, b)`, ou `a.operator+(b)`. C'est un appel de fonction ordinaire, avec une syntaxe commode."
  - key: membre-ou-libre
    format: course
    question: "Pourquoi préfère-t-on une fonction libre pour un opérateur symétrique comme `+` ?"
    choices:
      - {text: "Les conversions implicites s'appliquent alors aux deux opérandes, y compris celui de gauche", correct: true}
      - {text: "Une fonction libre s'exécute plus vite qu'une fonction membre", correct: false}
      - {text: "Une fonction membre ne peut pas renvoyer un nouvel objet", correct: false}
      - {text: "Une fonction libre a toujours accès aux membres privés de la classe", correct: false}
    answer: "Avec un membre, l'opérande de gauche doit déjà être du type de la classe : `2 + fraction` ne compile pas. Avec une fonction libre, `2` est converti."
  - key: plus-egal
    format: course
    question: "Que renvoie d'habitude un `operator+=` membre ?"
    choices:
      - {text: "`*this`, par référence", correct: true}
      - {text: "Une copie de l'objet d'origine", correct: false}
      - {text: "Rien : il renvoie `void`", correct: false}
      - {text: "Un booléen qui dit si l'ajout a réussi", correct: false}
    answer: "Comme pour les types fondamentaux, où `(a += b) += c` est permis. L'opérateur modifie l'objet, et le renvoie."
  - key: limites
    format: course
    question: "Laquelle de ces choses la surcharge d'opérateurs permet-elle ?"
    choices:
      - {text: "Donner un sens à `==` pour deux objets de sa classe", correct: true}
      - {text: "Créer un nouvel opérateur `**` pour la puissance", correct: false}
      - {text: "Changer la priorité de `+` par rapport à `*`", correct: false}
      - {text: "Redéfinir l'addition de deux `int`", correct: false}
    answer: "On ne peut ni inventer d'opérateur, ni changer priorité et nombre d'opérandes, ni toucher aux types fondamentaux."
  - key: vf-affectation-membre
    format: true-false
    question: "`operator=` doit être une fonction membre."
    truth: true
    answer: "Comme `operator[]`, `operator()` et `operator->`. Le langage l'impose."
  - key: vf-gauche-converti
    format: true-false
    question: "Avec un `operator+` membre, l'opérande de gauche peut être converti implicitement vers la classe."
    truth: false
    answer: "L'opérande de gauche est l'objet sur lequel la fonction membre est appelée : aucune conversion n'est tentée."
  - key: vf-point
    format: true-false
    question: "L'opérateur `.` (accès à un membre) peut être surchargé."
    truth: false
    answer: "`.`, `::`, `?:` et `sizeof` ne se surchargent pas."
  - key: vf-plus-modifie
    format: true-false
    question: "Par convention, `a + b` ne modifie ni `a` ni `b`."
    truth: true
    answer: "Il renvoie un nouvel objet. C'est `+=` qui modifie l'opérande de gauche."
  - key: qcm-signature-libre
    format: multiple-choice
    question: "Quelle est la signature habituelle d'un `operator+` libre pour `Vecteur` ?"
    choices:
      - {text: "`Vecteur operator+(const Vecteur& a, const Vecteur& b);`", correct: true}
      - {text: "`Vecteur& operator+(Vecteur& a, Vecteur& b);`", correct: false}
      - {text: "`void operator+(const Vecteur& a, const Vecteur& b);`", correct: false}
      - {text: "`Vecteur operator+(const Vecteur& a);`", correct: false}
    answer: "Deux opérandes lus par référence constante, un résultat renvoyé par valeur."
  - key: qcm-signature-membre
    format: multiple-choice
    question: "Quelle est la signature d'un `operator+` écrit comme fonction membre de `Vecteur` ?"
    choices:
      - {text: "`Vecteur operator+(const Vecteur& autre) const;`", correct: true}
      - {text: "`Vecteur operator+(const Vecteur& a, const Vecteur& b) const;`", correct: false}
      - {text: "`Vecteur operator+() const;`", correct: false}
      - {text: "`static Vecteur operator+(const Vecteur& autre);`", correct: false}
    answer: "Un seul paramètre : l'opérande de gauche est `*this`. `const`, puisque l'addition ne le modifie pas."
  - key: qcm-appel
    format: multiple-choice
    question: "`operator*` est une fonction libre. À quoi équivaut `a * b` ?"
    choices:
      - {text: "`operator*(a, b)`", correct: true}
      - {text: "`a.operator*(b)`", correct: false}
      - {text: "`b.operator*(a)`", correct: false}
      - {text: "`operator*(b, a)`", correct: false}
    answer: "L'opérande de gauche est le premier argument, celui de droite le second."
  - key: qcm-crochets
    format: multiple-choice
    question: "Quel opérateur donne à une classe `Grille` l'accès `grille[3]` ?"
    choices:
      - {text: "`operator[]`", correct: true}
      - {text: "`operator()`", correct: false}
      - {text: "`operator->`", correct: false}
      - {text: "`operator*`", correct: false}
    answer: "`operator[]`, obligatoirement membre. On en écrit souvent deux versions : `const` et non `const`."
  - key: trous-operator
    format: fill-in
    question: |-
      Complète le nom de la fonction qui définit `a + b` :
      ```cpp
      Vecteur ___+(const Vecteur& a, const Vecteur& b) {
          return {a.x + b.x, a.y + b.y};
      }
      ```
    blanks:
      - [operator]
    answer: "Le mot-clé `operator`, suivi du symbole."
  - key: trous-this
    format: fill-in
    question: |-
      Complète le retour de l'opérateur composé :
      ```cpp
      Vecteur& operator+=(const Vecteur& autre) {
          x += autre.x;
          y += autre.y;
          return ___;
      }
      ```
    blanks:
      - ["*this"]
    answer: "`*this`, renvoyé par référence."
  - key: trous-plus-egal
    format: fill-in
    question: |-
      Complète pour écrire `+` à partir de `+=` :
      ```cpp
      Vecteur operator+(Vecteur a, const Vecteur& b) {
          a ___ b;
          return a;
      }
      ```
    blanks:
      - ["+="]
    answer: "`a` est une copie : on lui ajoute `b`, puis on la renvoie."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que l'opérateur membre s'appelle sur un objet constant :
      ```cpp
      struct Vecteur {
          int x;
          int y;
          bool operator==(const Vecteur& autre) ___ {
              return x == autre.x && y == autre.y;
          }
      };
      ```
    blanks:
      - [const]
    answer: "Une comparaison ne modifie pas l'objet : la fonction membre est `const`."
  - key: code-plus
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Vecteur {
          int x;
          int y;
      };

      Vecteur operator+(const Vecteur& a, const Vecteur& b) {
          return {a.x + b.x, a.y + b.y};
      }

      int main() {
          const Vecteur a{1, 2};
          const Vecteur b{10, 20};
          const Vecteur c = a + b + a;
          std::println("{} {}", c.x, c.y);
      }
      ```
    choices:
      - {text: "`12 24`", correct: true}
      - {text: "`11 22`", correct: false}
      - {text: "`22 44`", correct: false}
      - {text: "`2 4`", correct: false}
    answer: "`12 24` : `a + b` donne (11, 22), auquel on ajoute encore `a`. L'opérateur s'enchaîne comme pour des nombres."
    check:
      output: "12 24"
  - key: code-plus-egal
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;

          Compteur& operator+=(int n) {
              valeur += n;
              return *this;
          }
      };

      int main() {
          Compteur c;
          (c += 5) += 2;
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "`7`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "`2`", correct: false}
      - {text: "`10`", correct: false}
    answer: "`7` : `c += 5` renvoie une référence vers `c`, à laquelle s'applique le second `+=`."
    check:
      output: "7"
  - key: code-conversion
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Euros {
          int centimes;
          Euros(int euros) : centimes{euros * 100} {}
      };

      Euros operator+(const Euros& a, const Euros& b) {
          Euros somme{0};
          somme.centimes = a.centimes + b.centimes;
          return somme;
      }

      int main() {
          const Euros prix{3};
          const Euros total = 2 + prix;
          std::println("{}", total.centimes);
      }
      ```
    choices:
      - {text: "`500`", correct: true}
      - {text: "`302`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`500` : l'opérateur est une fonction libre, donc `2` est converti en `Euros` par le constructeur. 200 + 300 centimes."
    check:
      output: "500"
  - key: code-membre-gauche
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Euros {
          int centimes;
          Euros(int euros) : centimes{euros * 100} {}

          Euros operator+(const Euros& autre) const {
              Euros somme{0};
              somme.centimes = centimes + autre.centimes;
              return somme;
          }
      };

      int main() {
          const Euros prix{3};
          const Euros total = 2 + prix;
          std::println("{}", total.centimes);
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`500`", correct: false}
      - {text: "`302`", correct: false}
      - {text: "`5`", correct: false}
    answer: "Ça ne compile pas : l'opérateur est membre, et `2` n'est pas un `Euros`. L'opérande de gauche n'est jamais converti. `prix + 2`, lui, compilerait."
    check:
      compiles: false
  - key: bug-membre-asymetrique
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator*' (operand types are 'int' and 'Vecteur') ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      struct Vecteur {
          int x;
          int y;

          Vecteur operator*(int facteur) const {
              return {x * facteur, y * facteur};
          }
      };

      int main() {
          const Vecteur v{1, 2};
          const Vecteur w = 3 * v;
          std::println("{} {}", w.x, w.y);
      }
      ```
    choices:
      - {text: "Ajouter une fonction libre `Vecteur operator*(int facteur, const Vecteur& v)`", correct: true}
      - {text: "Ajouter `static` devant l'opérateur membre de la classe", correct: false}
      - {text: "Retirer `const` de l'opérateur membre de la classe", correct: false}
      - {text: "Déclarer le paramètre de l'opérateur membre `const int& facteur`", correct: false}
    answer: |-
      ```cpp
      Vecteur operator*(int facteur, const Vecteur& v) {
          return v * facteur;
      }
      ```
      L'opérateur membre ne couvre que `v * 3`. Pour `3 * v`, où l'opérande de gauche est un `int`, il faut une
      fonction libre.
  - key: bug-retour-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `7`. Il affiche `5` : le second ajout est perdu. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      struct Compteur {
          int valeur = 0;

          Compteur operator+=(int n) {
              valeur += n;
              return *this;
          }
      };

      int main() {
          Compteur c;
          (c += 5) += 2;
          std::println("{}", c.valeur);
      }
      ```
    choices:
      - {text: "Renvoyer une référence : `Compteur& operator+=(int n)`", correct: true}
      - {text: "Renvoyer une constante : `const Compteur operator+=(int n)`", correct: false}
      - {text: "Renvoyer l'entier ajouté : `int operator+=(int n)`", correct: false}
      - {text: "Renvoyer `this` à la place de `*this`", correct: false}
    answer: |-
      ```cpp
      Compteur& operator+=(int n) {
      ```
      Par valeur, `c += 5` renvoie une copie : le second `+=` la modifie, pas `c`. Un opérateur composé renvoie
      `*this` par référence.
  - key: bug-plus-qui-modifie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `1 11`. Il affiche `11 11` : l'addition a modifié `a`. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      struct Entier {
          int valeur;

          Entier operator+(const Entier& autre) {
              valeur += autre.valeur;
              return *this;
          }
      };

      int main() {
          Entier a{1};
          const Entier b{10};
          const Entier c = a + b;
          std::println("{} {}", a.valeur, c.valeur);
      }
      ```
    choices:
      - {text: "Renvoyer un nouvel objet : `return Entier{valeur + autre.valeur};`, dans une fonction `const`", correct: true}
      - {text: "Renvoyer une référence vers l'objet courant : `Entier& operator+(const Entier& autre)`", correct: false}
      - {text: "Recevoir l'autre opérande par valeur : `Entier operator+(Entier autre)`", correct: false}
      - {text: "Déclarer la variable `a` avec `const`, sans toucher à l'opérateur", correct: false}
    answer: |-
      ```cpp
      Entier operator+(const Entier& autre) const {
          return Entier{valeur + autre.valeur};
      }
      ```
      `+` ne doit pas modifier ses opérandes : c'est le rôle de `+=`. Déclarer la fonction `const` aurait fait
      refuser la faute par le compilateur.
  - key: bug-operateur-manquant
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator==' (operand types are 'const Point' and 'const Point') ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
      };

      int main() {
          const Point a{1, 2};
          const Point b{1, 2};
          std::println("{}", a == b);
      }
      ```
    choices:
      - {text: "Définir `bool operator==(const Point& a, const Point& b)`", correct: true}
      - {text: "Écrire `a.equals(b)` à la place de `a == b`", correct: false}
      - {text: "Écrire `&a == &b` à la place de `a == b`", correct: false}
      - {text: "Déclarer les deux points sans `const`", correct: false}
    answer: |-
      ```cpp
      bool operator==(const Point& a, const Point& b) {
          return a.x == b.x && a.y == b.y;
      }
      ```
      Le compilateur ne compare pas deux `struct` de lui-même. `&a == &b` comparerait les adresses, toujours
      différentes. En C++20, `bool operator==(const Point&) const = default;` suffit.
