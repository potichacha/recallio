notion: constructeur-copie
lesson: |-
  Copier un objet passe par deux fonctions de sa classe, selon que la destination **existe déjà** ou non.

  | | Quand | Signature |
  |---|---|---|
  | **Constructeur de copie** | on **crée** un objet à partir d'un autre | `T(const T& autre)` |
  | **Affectation par copie** | on **remplace** un objet existant | `T& operator=(const T& autre)` |

  ```cpp
  Compte a{"Ada", 100};
  Compte b = a;      // constructeur de copie : b est créé (le = n'est pas une affectation ici)
  Compte c{a};       // constructeur de copie aussi
  c = b;             // affectation par copie : c existait déjà
  ```

  Le constructeur de copie sert aussi quand on **passe un objet par valeur** à une fonction, et quand on en renvoie
  un par valeur (sauf si le compilateur élide la copie).

  **Ce que génère le compilateur.** Si on ne les écrit pas, il fournit les deux : ils copient l'objet **membre par
  membre**. Pour une classe faite de `int`, de `std::string` et de `std::vector`, c'est exactement ce qu'il faut : on
  n'écrit rien.

  **Quand les écrire.** Seulement si la copie membre à membre est fausse, c'est-à-dire quand la classe gère
  elle-même une ressource, par un pointeur brut.

  **Leur forme.**

  ```cpp
  Compte(const Compte& autre) : titulaire_{autre.titulaire_}, solde_{autre.solde_} {}

  Compte& operator=(const Compte& autre) {
      if (this != &autre) {          // affectation à soi-même
          titulaire_ = autre.titulaire_;
          solde_ = autre.solde_;
      }
      return *this;                  // pour permettre a = b = c
  }
  ```

  - Le paramètre est une **référence constante**. Par valeur, il faudrait copier l'argument pour appeler le
    constructeur de copie : le compilateur le refuse.
  - L'affectation **renvoie `*this`** par référence.

  **En entretien** : « `T b = a;` appelle le constructeur de copie, `b = a;` l'affectation. Les versions générées
  copient membre à membre ; je ne les écris que si la classe possède une ressource brute. »
cards:
  - key: copie-ou-affectation
    format: course
    question: "Quelle fonction est appelée par `Compte b = a;` ?"
    choices:
      - {text: "Le constructeur de copie : `b` est créé à partir de `a`", correct: true}
      - {text: "L'affectation par copie : le signe `=` l'indique", correct: false}
      - {text: "Le constructeur par défaut, puis l'affectation par copie", correct: false}
      - {text: "Aucune : `b` devient un autre nom pour `a`", correct: false}
    answer: "`b` n'existait pas : c'est une construction, malgré le `=`. L'affectation ne concerne qu'un objet déjà construit, comme dans `b = a;`."
  - key: copie-generee
    format: course
    question: Que fait le constructeur de copie généré par le compilateur ?
    choices:
      - {text: "Il copie l'objet membre par membre", correct: true}
      - {text: "Il copie l'objet octet par octet, sans appeler aucun constructeur", correct: false}
      - {text: "Il crée un objet vide, avec les valeurs par défaut des membres", correct: false}
      - {text: "Il fait désigner aux deux objets les mêmes membres", correct: false}
    answer: "Chaque membre est copié par son propre constructeur de copie : une `std::string` copie ses caractères, un pointeur brut copie seulement son adresse."
  - key: parametre-par-reference
    format: course
    question: "Pourquoi le constructeur de copie prend-il son paramètre par référence constante, et non par valeur ?"
    choices:
      - {text: "Passer par valeur demanderait une copie, donc le constructeur de copie lui-même", correct: true}
      - {text: "Passer par valeur modifierait l'objet d'origine pendant la copie", correct: false}
      - {text: "Passer par valeur est interdit pour tous les paramètres de constructeur", correct: false}
      - {text: "Passer par valeur copierait deux fois les membres constants", correct: false}
    answer: "Pour passer l'argument par valeur, il faudrait le copier : un appel du constructeur de copie, qui en demanderait un autre, sans fin. Le compilateur refuse cette signature."
  - key: quand-appele
    format: course
    question: Dans quel cas le constructeur de copie est-il appelé, en plus de `T b = a;` ?
    choices:
      - {text: "Quand on passe un objet par valeur à une fonction", correct: true}
      - {text: "Quand on passe un objet par référence à une fonction", correct: false}
      - {text: "Quand on appelle une fonction membre de l'objet", correct: false}
      - {text: "Quand on prend l'adresse de l'objet", correct: false}
    answer: "Un paramètre par valeur est un nouvel objet, initialisé par copie de l'argument. Par référence, rien n'est copié."
  - key: vf-egal-construction
    format: true-false
    question: "Dans `Compte b = a;`, le signe `=` appelle l'opérateur d'affectation de `Compte`."
    truth: false
    answer: "C'est une initialisation : le constructeur de copie est appelé. L'opérateur d'affectation ne sert que pour un objet qui existe déjà."
  - key: vf-generes
    format: true-false
    question: Si une classe n'écrit ni constructeur de copie ni affectation par copie, le compilateur les génère.
    truth: true
    answer: Les versions générées copient membre à membre, ce qui convient à la plupart des classes.
  - key: vf-return-this
    format: true-false
    question: "L'opérateur d'affectation renvoie `*this`, pour que `a = b = c;` fonctionne."
    truth: true
    answer: "`b = c` renvoie une référence vers `b`, qui sert ensuite de membre droit à `a = ...`."
  - key: vf-reference
    format: true-false
    question: Passer un objet par référence constante appelle son constructeur de copie.
    truth: false
    answer: Une référence désigne l'objet d'origine. C'est le passage par valeur qui copie.
  - key: qcm-signature-copie
    format: multiple-choice
    question: "Quelle est la signature du constructeur de copie de la classe `Compte` ?"
    choices:
      - {text: "`Compte(const Compte& autre);`", correct: true}
      - {text: "`Compte(Compte autre);`", correct: false}
      - {text: "`Compte copy(const Compte& autre);`", correct: false}
      - {text: "`void Compte(const Compte* autre);`", correct: false}
    answer: "Le nom de la classe, et un paramètre référence constante vers un objet de la même classe."
  - key: qcm-signature-affectation
    format: multiple-choice
    question: "Quelle est la signature de l'affectation par copie de la classe `Compte` ?"
    choices:
      - {text: "`Compte& operator=(const Compte& autre);`", correct: true}
      - {text: "`void operator=(Compte autre) const;`", correct: false}
      - {text: "`Compte operator==(const Compte& autre);`", correct: false}
      - {text: "`Compte& assign(const Compte& autre);`", correct: false}
    answer: "Elle s'appelle `operator=`, prend une référence constante, et renvoie une référence vers l'objet affecté."
  - key: qcm-laquelle
    format: multiple-choice
    question: "`a` et `b` sont deux `Compte` déjà construits. Quelle fonction appelle `b = a;` ?"
    choices:
      - {text: "L'affectation par copie", correct: true}
      - {text: "Le constructeur de copie", correct: false}
      - {text: "Le constructeur par défaut", correct: false}
      - {text: "Le destructeur, puis le constructeur de copie", correct: false}
    answer: "`b` existe : son contenu est remplacé par l'opérateur d'affectation. Aucun objet n'est créé ni détruit."
  - key: qcm-quand-ecrire
    format: multiple-choice
    question: "Pour quelle classe faut-il écrire soi-même le constructeur de copie ?"
    choices:
      - {text: "Une classe qui possède une ressource par un pointeur brut", correct: true}
      - {text: "Une classe dont les membres sont des `std::string`", correct: false}
      - {text: "Une classe qui a plus de cinq données membres", correct: false}
      - {text: "Une classe dont les membres sont des `int`", correct: false}
    answer: "La copie membre à membre duplique l'adresse du pointeur, pas la ressource. Partout ailleurs, la version générée est juste, et on ne l'écrit pas."
  - key: code-copie-puis-affectation
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
          Trace& operator=(const Trace&) {
              std::println("affectation");
              return *this;
          }
      };

      int main() {
          Trace a;
          Trace b = a;
          Trace c;
          c = a;
      }
      ```
    choices:
      - text: |-
          ```
          copie
          affectation
          ```
        correct: true
      - text: |-
          ```
          affectation
          affectation
          ```
        correct: false
      - text: |-
          ```
          copie
          copie
          ```
        correct: false
      - text: |-
          ```
          affectation
          copie
          ```
        correct: false
    answer: |-
      ```
      copie
      affectation
      ```
      `Trace b = a;` crée `b` : constructeur de copie. `c = a;` remplace un objet qui existe : affectation.
    check:
      output: |-
        copie
        affectation
  - key: code-passage-par-valeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
      };

      void par_valeur(Trace) {}
      void par_reference(const Trace&) {}

      int main() {
          Trace a;
          par_reference(a);
          par_valeur(a);
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          copie
          fin
          ```
        correct: true
      - text: |-
          ```
          copie
          copie
          fin
          ```
        correct: false
      - {text: "`fin`", correct: false}
      - text: |-
          ```
          fin
          copie
          ```
        correct: false
    answer: |-
      ```
      copie
      fin
      ```
      Seul le passage par valeur crée un nouvel objet, donc appelle le constructeur de copie. Par référence, la
      fonction reçoit `a` lui-même.
    check:
      output: |-
        copie
        fin
  - key: code-copie-generee
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      struct Joueur {
          std::string nom;
          int score;
      };

      int main() {
          Joueur a{"Ada", 10};
          Joueur b = a;
          b.nom = "Alan";
          b.score += 5;
          std::println("{} {} {} {}", a.nom, a.score, b.nom, b.score);
      }
      ```
    choices:
      - {text: "`Ada 10 Alan 15`", correct: true}
      - {text: "`Alan 15 Alan 15`", correct: false}
      - {text: "`Alan 10 Alan 15`", correct: false}
      - {text: "`Ada 15 Alan 15`", correct: false}
    answer: "`Ada 10 Alan 15` : la copie générée copie chaque membre. La `std::string` copie ses caractères : `b` est indépendant de `a`."
    check:
      output: "Ada 10 Alan 15"
  - key: code-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      class Trace {
      public:
          Trace() {}
          Trace(const Trace&) { std::println("copie"); }
      };

      int main() {
          std::vector<Trace> v;
          v.reserve(4);
          Trace a;
          v.push_back(a);
          v.push_back(a);
          std::println("{}", v.size());
      }
      ```
    choices:
      - text: |-
          ```
          copie
          copie
          2
          ```
        correct: true
      - {text: "`2`", correct: false}
      - text: |-
          ```
          copie
          2
          ```
        correct: false
      - text: |-
          ```
          copie
          copie
          copie
          2
          ```
        correct: false
    answer: |-
      ```
      copie
      copie
      2
      ```
      Chaque `push_back(a)` range dans le vecteur une copie de `a`. La place étant réservée, le vecteur ne réalloue
      pas : il n'y a pas d'autre copie.
    check:
      output: |-
        copie
        copie
        2
  - key: bug-parametre-par-valeur
    format: bug-fix
    question: |-
      Le compilateur répond « invalid constructor; you probably meant 'Compte (const Compte&)' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte(int solde) : solde_{solde} {}
          Compte(Compte autre) : solde_{autre.solde_} {}
          int solde() const { return solde_; }

      private:
          int solde_;
      };

      int main() {
          Compte a{100};
          Compte b = a;
          std::println("{}", b.solde());
      }
      ```
    choices:
      - {text: "Prendre le paramètre par référence constante : `const Compte& autre`", correct: true}
      - {text: "Prendre le paramètre par pointeur : `Compte* autre`", correct: false}
      - {text: "Donner un type de retour au constructeur : `Compte Compte(Compte autre)`", correct: false}
      - {text: "Déclarer le constructeur de copie dans la section `private:`", correct: false}
    answer: |-
      ```cpp
      Compte(const Compte& autre) : solde_{autre.solde_} {}
      ```
      Passer `autre` par valeur demanderait de le copier, donc d'appeler ce même constructeur. Ici, la classe n'a
      d'ailleurs pas besoin de l'écrire : celui du compilateur ferait la même chose.
  - key: bug-membre-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `Ada 10`, et affiche `Ada 0`. Pourquoi ?
      ```cpp
      #include <print>
      #include <string>

      class Joueur {
      public:
          Joueur(std::string nom, int score) : nom_{nom}, score_{score} {}
          Joueur(const Joueur& autre) : nom_{autre.nom_} {}
          void afficher() const { std::println("{} {}", nom_, score_); }

      private:
          std::string nom_;
          int score_ = 0;
      };

      int main() {
          Joueur a{"Ada", 10};
          Joueur b = a;
          b.afficher();
      }
      ```
    choices:
      - {text: "Le constructeur de copie écrit à la main oublie de copier `score_`", correct: true}
      - {text: "Un `int` ne peut pas être copié par un constructeur de copie", correct: false}
      - {text: "`Joueur b = a;` appelle le constructeur à deux paramètres", correct: false}
      - {text: "`afficher` est `const`, et lit donc la valeur par défaut", correct: false}
    answer: |-
      ```cpp
      class Joueur {
      public:
          Joueur(std::string nom, int score) : nom_{nom}, score_{score} {}
          // pas de constructeur de copie : celui du compilateur copie tous les membres
      ```
      Un constructeur de copie écrit à la main ne copie que ce qu'on y écrit. Celui du compilateur n'oublie aucun
      membre : pour cette classe, il suffit de supprimer le sien.
  - key: bug-return-this
    format: bug-fix
    question: |-
      Ce programme plante (« Illegal instruction ») sur la ligne `b = a;`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte(int solde) : solde_{solde} {}
          Compte& operator=(const Compte& autre) {
              solde_ = autre.solde_;
          }
          int solde() const { return solde_; }

      private:
          int solde_;
      };

      int main() {
          Compte a{100};
          Compte b{0};
          b = a;
          std::println("{}", b.solde());
      }
      ```
    choices:
      - {text: "Ajouter `return *this;` à la fin de l'opérateur", correct: true}
      - {text: "Ajouter `return autre;` à la fin de l'opérateur", correct: false}
      - {text: "Ajouter `return solde_;` à la fin de l'opérateur", correct: false}
      - {text: "Ajouter `delete this;` à la fin de l'opérateur", correct: false}
    answer: |-
      ```cpp
      Compte& operator=(const Compte& autre) {
          solde_ = autre.solde_;
          return *this;
      }
      ```
      L'opérateur est déclaré renvoyer une `Compte&` : finir sans `return` est un comportement indéfini. Il renvoie
      l'objet affecté, `*this`.
  - key: bug-reference-non-const
    format: bug-fix
    question: |-
      Ce code ne compile pas : `b` ne peut pas être copié à partir de `a`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte(int solde) : solde_{solde} {}
          Compte(Compte& autre) : solde_{autre.solde_} {}
          int solde() const { return solde_; }

      private:
          int solde_;
      };

      int main() {
          const Compte a{100};
          Compte b = a;
          std::println("{}", b.solde());
      }
      ```
    choices:
      - {text: "Déclarer le paramètre `const Compte& autre`", correct: true}
      - {text: "Déclarer le paramètre `Compte&& autre`", correct: false}
      - {text: "Déclarer `b` avec le mot-clé `const`", correct: false}
      - {text: "Déclarer `solde_` avec le mot-clé `mutable`", correct: false}
    answer: |-
      ```cpp
      Compte(const Compte& autre) : solde_{autre.solde_} {}
      ```
      Une référence non constante ne se lie ni à un objet `const`, ni à un temporaire. Copier ne modifie pas la
      source : le paramètre est une référence constante.
  - key: trous-const
    format: fill-in
    question: |-
      Complète le paramètre du constructeur de copie :
      ```cpp
      Compte(___ Compte& autre) : solde_{autre.solde_} {}
      ```
    blanks:
      - [const]
    answer: "`const Compte& autre` : la source n'est pas modifiée, et peut être un objet constant ou un temporaire."
  - key: trous-operateur
    format: fill-in
    question: |-
      Complète le nom de l'opérateur d'affectation :
      ```cpp
      Compte& operator___(const Compte& autre) {
          solde_ = autre.solde_;
          return *this;
      }
      ```
    blanks:
      - ["="]
    answer: "L'affectation par copie s'appelle `operator=`."
  - key: trous-this
    format: fill-in
    question: |-
      Complète pour renvoyer l'objet affecté :
      ```cpp
      Compte& operator=(const Compte& autre) {
          solde_ = autre.solde_;
          return ___this;
      }
      ```
    blanks:
      - ["*"]
    answer: "`return *this;` : `this` est un pointeur vers l'objet, `*this` est l'objet."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour que le paramètre ne soit pas passé par valeur :
      ```cpp
      Compte(const Compte___ autre) : solde_{autre.solde_} {}
      ```
    blanks:
      - ["&"]
    answer: "Le paramètre du constructeur de copie est une référence : par valeur, il se rappellerait lui-même."
