notion: operateur-comparaison
lesson: |-
  Deux objets d'une classe ne se comparent pas tout seuls : `a == b` ne compile que si un `operator==` existe.
  Depuis **C++20**, deux lignes suffisent pour obtenir les six comparaisons.

  **L'égalité : `operator==`.**

  ```cpp
  struct Point {
      int x;
      int y;

      bool operator==(const Point&) const = default;
  };
  ```

  `= default` demande au compilateur de comparer **membre par membre**, dans l'ordre de leur déclaration. Et
  `a != b` vient **gratuitement** : le compilateur le réécrit en `!(a == b)`.

  **L'ordre : `operator<=>`.** L'opérateur de **comparaison à trois voies** (le « vaisseau spatial ») répond en une
  fois : plus petit, égal, ou plus grand.

  ```cpp
  #include <compare>

  struct Version {
      int majeure;
      int mineure;

      auto operator<=>(const Version&) const = default;
  };
  ```

  Avec `<=> = default`, le compilateur fournit `<`, `<=`, `>`, `>=`, **et aussi `==`**. Les membres sont comparés
  dans l'ordre de leur déclaration, comme un ordre **lexicographique** : la version majeure d'abord, la mineure
  seulement en cas d'égalité.

  **Ce que renvoie `<=>`.** Pas un booléen, mais une **catégorie d'ordre**, que l'on compare à `0` :

  | Type | Sens | Exemple |
  |---|---|---|
  | `std::strong_ordering` | ordre total ; égal veut dire interchangeable | entiers, chaînes |
  | `std::weak_ordering` | ordre total ; des équivalents peuvent différer | chaînes sans tenir compte de la casse |
  | `std::partial_ordering` | certaines valeurs sont incomparables | `double`, à cause de NaN |

  ```cpp
  if ((a <=> b) < 0) { /* a est avant b */ }
  ```

  **L'écrire à la main.** Quand l'ordre voulu n'est pas celui des membres :

  ```cpp
  struct Personne {
      std::string nom;
      int age;

      std::strong_ordering operator<=>(const Personne& autre) const {
          return age <=> autre.age;          // par âge seulement
      }
      bool operator==(const Personne& autre) const {
          return age == autre.age;
      }
  };
  ```

  Attention : un `operator<=>` **écrit à la main** ne fournit **pas** `==`. Il faut le définir aussi. Seule la
  version `= default` apporte les deux.

  **Avant C++20.** Il fallait écrire les six opérateurs, ou au moins `==` et `<`, en déduisant les autres. On le
  rencontre encore : `std::tie(a.x, a.y) < std::tie(b.x, b.y)` y servait à comparer plusieurs champs.

  **À quoi ça sert.** `==` : chercher avec `std::find`, comparer dans un test. `<` : trier avec `std::sort`, servir
  de clé à `std::map` ou d'élément à `std::set`.

  **La cohérence.** `a == b` et `(a <=> b) == 0` doivent dire la même chose, et l'ordre doit être strict : `a < a`
  est faux.

  **En entretien** : « En C++20, `bool operator==(const T&) const = default;` donne `==` et `!=`, et
  `auto operator<=>(const T&) const = default;` donne les six comparaisons, membre par membre dans l'ordre de
  déclaration. `<=>` renvoie une catégorie d'ordre, comme `std::strong_ordering`. »
cards:
  - key: egal-default
    format: course
    question: "Que fait `bool operator==(const Point&) const = default;` dans une classe ?"
    choices:
      - {text: "Il compare les objets membre par membre, et fournit aussi `!=`", correct: true}
      - {text: "Il compare les adresses des deux objets, et fournit aussi `!=`", correct: false}
      - {text: "Il compare le premier membre seulement, sans fournir `!=`", correct: false}
      - {text: "Il renvoie toujours `true`, pour deux objets de même type", correct: false}
    answer: "Deux objets sont égaux si tous leurs membres le sont. Depuis C++20, `a != b` est réécrit en `!(a == b)`."
  - key: vaisseau
    format: course
    question: "Qu'apporte `auto operator<=>(const Version&) const = default;` ?"
    choices:
      - {text: "Les quatre comparaisons d'ordre, et aussi `==` et `!=`", correct: true}
      - {text: "Seulement l'opérateur `<`, dont les autres se déduisent à la main", correct: false}
      - {text: "Seulement l'égalité, sans aucune comparaison d'ordre", correct: false}
      - {text: "Un tri automatique des membres de la classe", correct: false}
    answer: "Une seule ligne donne `<`, `<=`, `>`, `>=`. La version `= default` déclare aussi un `operator==` par défaut."
  - key: ordre-des-membres
    format: course
    question: "Dans quel ordre un `operator<=>` par défaut compare-t-il les membres ?"
    choices:
      - {text: "Dans l'ordre de leur déclaration, en s'arrêtant au premier qui diffère", correct: true}
      - {text: "Dans l'ordre alphabétique de leurs noms, en s'arrêtant au premier qui diffère", correct: false}
      - {text: "Dans l'ordre inverse de leur déclaration, du dernier au premier", correct: false}
      - {text: "Tous à la fois, en additionnant leurs différences", correct: false}
    answer: "C'est un ordre lexicographique. L'ordre des membres dans la classe décide donc du critère principal."
  - key: retour
    format: course
    question: "Que renvoie `a <=> b` pour deux entiers ?"
    choices:
      - {text: "Un `std::strong_ordering`, que l'on compare à `0`", correct: true}
      - {text: "Un `bool`, vrai si `a` est plus petit que `b`", correct: false}
      - {text: "Un `int`, qui vaut `a - b`", correct: false}
      - {text: "Un `std::pair`, formé de `a` et de `b`", correct: false}
    answer: "Une catégorie d'ordre : `(a <=> b) < 0` veut dire que `a` est avant `b`. Ce n'est ni un booléen ni une différence."
  - key: vf-different
    format: true-false
    question: "En C++20, définir `operator==` suffit pour pouvoir écrire `a != b`."
    truth: true
    answer: "Le compilateur réécrit `a != b` en `!(a == b)`."
  - key: vf-main
    format: true-false
    question: "Un `operator<=>` écrit à la main fournit aussi `operator==`."
    truth: false
    answer: "Seule la version `= default` déclare un `==`. Avec un `<=>` écrit à la main, il faut définir `==` soi-même."
  - key: vf-double
    format: true-false
    question: "`<=>` sur deux `double` renvoie un `std::partial_ordering`."
    truth: true
    answer: "NaN n'est ni plus petit, ni plus grand, ni égal à quoi que ce soit : l'ordre des `double` n'est que partiel."
  - key: vf-struct
    format: true-false
    question: "Deux objets d'une `struct` se comparent avec `==` sans rien écrire."
    truth: false
    answer: "Aucun opérateur de comparaison n'est généré d'office. Il faut au moins le demander avec `= default`."
  - key: qcm-map
    format: multiple-choice
    question: "Quel opérateur un type doit-il fournir pour servir de clé à une `std::map` ?"
    choices:
      - {text: "`<`, par exemple grâce à `operator<=>`", correct: true}
      - {text: "`==`, et rien d'autre", correct: false}
      - {text: "`<<`, pour l'affichage", correct: false}
      - {text: "`+`, pour l'addition", correct: false}
    answer: "Une map est un arbre trié : elle compare ses clés avec `<`. `operator<=>` par défaut le fournit."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête déclare `std::strong_ordering` ?"
    choices:
      - {text: "`<compare>`", correct: true}
      - {text: "`<algorithm>`", correct: false}
      - {text: "`<utility>`", correct: false}
      - {text: "`<order>`", correct: false}
    answer: "`<compare>` déclare les trois catégories d'ordre. Il faut l'inclure pour écrire `auto operator<=>`."
  - key: qcm-tester
    format: multiple-choice
    question: "Comment testes-tu que `a` est strictement avant `b`, à partir du résultat de `a <=> b` ?"
    choices:
      - {text: "`(a <=> b) < 0`", correct: true}
      - {text: "`(a <=> b) == true`", correct: false}
      - {text: "`(a <=> b) == -1`", correct: false}
      - {text: "`!(a <=> b)`", correct: false}
    answer: "Une catégorie d'ordre ne se compare qu'au littéral `0`. En pratique, on écrit simplement `a < b`."
  - key: qcm-critere
    format: multiple-choice
    question: "Une `struct` a les membres `nom` puis `age`, et un `<=>` par défaut. Comment sont triées les personnes ?"
    choices:
      - {text: "Par nom ; à nom égal, par âge", correct: true}
      - {text: "Par âge ; à âge égal, par nom", correct: false}
      - {text: "Par nom seulement, sans regarder l'âge", correct: false}
      - {text: "Par la somme de l'âge et de la longueur du nom", correct: false}
    answer: "Le premier membre déclaré est le critère principal. Pour trier par âge d'abord, on change l'ordre des membres, ou l'on écrit l'opérateur."
  - key: trous-default
    format: fill-in
    question: |-
      Complète pour demander la comparaison membre par membre :
      ```cpp
      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = ___;
      };
      ```
    blanks:
      - [default]
    answer: "`= default` : le compilateur écrit la comparaison de chaque membre."
  - key: trous-vaisseau
    format: fill-in
    question: |-
      Complète avec l'opérateur de comparaison à trois voies :
      ```cpp
      struct Version {
          int majeure;
          int mineure;
          auto operator___(const Version&) const = default;
      };
      ```
    blanks:
      - ["<=>"]
    answer: "`operator<=>`, le « vaisseau spatial »."
  - key: trous-const
    format: fill-in
    question: |-
      Complète pour que la comparaison s'applique à des objets constants :
      ```cpp
      bool operator==(const Point& autre) ___ {
          return x == autre.x && y == autre.y;
      }
      ```
    blanks:
      - [const]
    answer: "Comparer ne modifie pas l'objet : la fonction membre est `const`."
  - key: trous-include
    format: fill-in
    question: |-
      Complète l'en-tête nécessaire à `auto operator<=>` :
      ```cpp
      #include <___>
      ```
    blanks:
      - [compare]
    answer: "`<compare>` déclare les types que renvoie `<=>`."
  - key: code-egalite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;
          bool operator==(const Point&) const = default;
      };

      int main() {
          const Point a{1, 2};
          const Point b{1, 2};
          const Point c{1, 3};
          std::println("{} {} {}", a == b, a == c, a != c);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true false false`", correct: false}
      - {text: "`true true false`", correct: false}
    answer: "`true false true` : l'égalité compare les deux membres. `!=` est déduit de `==`."
    check:
      output: "true false true"
  - key: code-lexicographique
    format: code-output
    question: |-
      ```cpp
      #include <compare>
      #include <print>

      struct Version {
          int majeure;
          int mineure;
          auto operator<=>(const Version&) const = default;
      };

      int main() {
          const Version a{1, 9};
          const Version b{2, 0};
          const Version c{2, 0};
          std::println("{} {} {}", a < b, b > c, b >= c);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false true false`", correct: false}
    answer: "`true false true` : la version majeure décide d'abord, donc 1.9 est avant 2.0. `b` et `c` sont égales : ni plus grande, mais bien supérieure ou égale."
    check:
      output: "true false true"
  - key: code-tri
    format: code-output
    question: |-
      ```cpp
      #include <algorithm>
      #include <compare>
      #include <print>
      #include <vector>

      struct Carte {
          int couleur;
          int valeur;
          auto operator<=>(const Carte&) const = default;
      };

      int main() {
          std::vector<Carte> main{{2, 5}, {1, 9}, {2, 3}};
          std::sort(main.begin(), main.end());
          std::println("{}{} {}{} {}{}", main[0].couleur, main[0].valeur, main[1].couleur, main[1].valeur,
                       main[2].couleur, main[2].valeur);
      }
      ```
    choices:
      - {text: "`19 23 25`", correct: true}
      - {text: "`23 25 19`", correct: false}
      - {text: "`25 19 23`", correct: false}
      - {text: "`19 25 23`", correct: false}
    answer: "`19 23 25` : `std::sort` utilise `<`, fourni par `<=>`. La couleur est comparée d'abord, la valeur départage."
    check:
      output: "19 23 25"
  - key: code-categorie
    format: code-output
    question: |-
      ```cpp
      #include <compare>
      #include <print>

      int main() {
          const auto ordre = 3 <=> 7;
          std::println("{} {} {}", ordre < 0, ordre == 0, (7 <=> 7) == 0);
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`false false true`", correct: false}
      - {text: "`true true true`", correct: false}
      - {text: "`false true false`", correct: false}
    answer: "`true false true` : 3 est avant 7, donc le résultat est inférieur à 0. Deux valeurs égales donnent un résultat égal à 0."
    check:
      output: "true false true"
  - key: bug-pas-d-operateur
    format: bug-fix
    question: |-
      Le compilateur répond « no match for 'operator==' (operand types are 'const Couleur' and 'const Couleur') ».
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Couleur {
          int rouge;
          int vert;
          int bleu;
      };

      int main() {
          const Couleur a{255, 0, 0};
          const Couleur b{255, 0, 0};
          std::println("{}", a == b);
      }
      ```
    choices:
      - {text: "Ajouter `bool operator==(const Couleur&) const = default;` à la struct", correct: true}
      - {text: "Ajouter `bool operator=(const Couleur&) const = default;` à la struct", correct: false}
      - {text: "Écrire `&a == &b` à la place de `a == b`", correct: false}
      - {text: "Écrire `a.equals(b)` à la place de `a == b`", correct: false}
    answer: |-
      ```cpp
      struct Couleur {
          int rouge;
          int vert;
          int bleu;
          bool operator==(const Couleur&) const = default;
      };
      ```
      Aucune comparaison n'existe sans qu'on la demande. `&a == &b` comparerait deux adresses différentes, et
      `operator=` est l'affectation.
  - key: bug-vaisseau-sans-egal
    format: bug-fix
    question: |-
      Le compilateur accepte `a < b`, mais refuse `a == b` : « no match for 'operator==' ». Quelle correction est la
      bonne ?
      ```cpp
      #include <compare>
      #include <print>

      struct Note {
          int valeur;

          std::strong_ordering operator<=>(const Note& autre) const {
              return valeur <=> autre.valeur;
          }
      };

      int main() {
          const Note a{12};
          const Note b{12};
          std::println("{} {}", a < b, a == b);
      }
      ```
    choices:
      - {text: "Définir aussi `bool operator==(const Note&) const = default;`", correct: true}
      - {text: "Renvoyer `bool` depuis `operator<=>`, à la place de `std::strong_ordering`", correct: false}
      - {text: "Retirer `const` de la fonction membre `operator<=>`", correct: false}
      - {text: "Écrire `(a <=> b) == true` à la place de `a == b`", correct: false}
    answer: |-
      ```cpp
      bool operator==(const Note&) const = default;
      ```
      Un `operator<=>` écrit à la main donne `<`, `<=`, `>`, `>=`, mais pas `==`. Seule la version `= default`
      apporte les deux.
  - key: bug-ordre-des-membres
    format: bug-fix
    question: |-
      Ce programme devrait afficher le plus jeune, `Zoé`. Il affiche `Ali` : le tri se fait par nom. Quelle
      correction est la bonne ?
      ```cpp
      #include <algorithm>
      #include <compare>
      #include <print>
      #include <string>
      #include <vector>

      struct Personne {
          std::string nom;
          int age;
          auto operator<=>(const Personne&) const = default;
      };

      int main() {
          std::vector<Personne> gens{{"Léa", 40}, {"Zoé", 25}, {"Ali", 33}};
          std::sort(gens.begin(), gens.end());
          std::println("{}", gens[0].nom);
      }
      ```
    choices:
      - {text: "Déclarer le membre `age` avant le membre `nom`, et adapter les initialisations", correct: true}
      - {text: "Appeler `std::stable_sort` à la place de `std::sort`", correct: false}
      - {text: "Écrire `bool operator<=>` à la place de `auto operator<=>`", correct: false}
      - {text: "Afficher `gens[2].nom` à la place de `gens[0].nom`", correct: false}
    answer: |-
      ```cpp
      struct Personne {
          int age;
          std::string nom;
          auto operator<=>(const Personne&) const = default;
      };
      ```
      La comparaison par défaut suit l'ordre de déclaration des membres : le premier est le critère principal.
      L'autre voie est de passer à `std::sort` une lambda qui compare les âges.
  - key: bug-comparaison-incoherente
    format: bug-fix
    question: |-
      Ce programme devrait afficher `false` : les deux points diffèrent par `y`. Il affiche `true`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      struct Point {
          int x;
          int y;

          bool operator==(const Point& autre) const {
              return x == autre.x;
          }
      };

      int main() {
          const Point a{1, 2};
          const Point b{1, 9};
          std::println("{}", a == b);
      }
      ```
    choices:
      - {text: "Écrire `bool operator==(const Point&) const = default;`", correct: true}
      - {text: "Écrire `return x == autre.x || y == autre.y;`", correct: false}
      - {text: "Écrire `return x = autre.x;`", correct: false}
      - {text: "Écrire `return this == &autre;`", correct: false}
    answer: |-
      ```cpp
      bool operator==(const Point&) const = default;
      ```
      L'opérateur écrit à la main a oublié `y`. La version par défaut compare tous les membres, et continue de le
      faire quand on en ajoute un.
