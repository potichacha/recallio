notion: explicit
lesson: |-
  Un constructeur qu'on peut appeler avec **un seul argument** sert aussi, sans qu'on le demande, de **conversion
  implicite** : le compilateur s'en sert pour transformer cet argument en objet.

  ```cpp
  class Duree {
  public:
      Duree(int secondes) : secondes_{secondes} {}
      int secondes() const { return secondes_; }
  private:
      int secondes_;
  };

  void attendre(Duree duree);

  attendre(5);          // compile : 5 est converti en Duree{5}
  Duree d = 5;          // compile aussi
  ```

  C'est rarement voulu. `attendre(5)` ne dit pas si ce sont des secondes ou des millisecondes, et une faute de
  frappe peut créer un objet là où l'on croyait passer un nombre.

  **`explicit`** devant le constructeur **interdit cette conversion** :

  ```cpp
  explicit Duree(int secondes) : secondes_{secondes} {}

  attendre(5);          // erreur de compilation
  Duree d = 5;          // erreur de compilation
  attendre(Duree{5});   // permis : la conversion est écrite
  Duree e{5};           // permis
  ```

  Avec `explicit`, il faut **nommer le type** : `Duree{5}`, `Duree(5)` ou `static_cast<Duree>(5)`. L'initialisation
  avec `=` (dite « par copie ») n'est plus permise ; celle avec accolades ou parenthèses l'est.

  **La règle** : tout constructeur appelable avec un seul argument est `explicit`, sauf si la conversion est
  naturelle et sans perte de sens. `std::string` accepte un littéral sans `explicit` : un texte est un texte.
  `std::vector<int> v = 5;`, lui, ne compile pas : le constructeur qui prend une taille est `explicit`.

  `explicit` s'applique aussi aux opérateurs de conversion, comme `explicit operator bool`.

  **En entretien** : « Je marque `explicit` les constructeurs à un argument : sinon le compilateur les utilise pour
  des conversions implicites, qui cachent des erreurs. »
cards:
  - key: conversion-implicite
    format: course
    question: "Que permet, sans qu'on le demande, un constructeur à un seul argument comme `Duree(int secondes)` ?"
    choices:
      - {text: "De convertir implicitement un `int` en `Duree`", correct: true}
      - {text: "De convertir implicitement une `Duree` en `int`", correct: false}
      - {text: "De créer une `Duree` sans aucun argument", correct: false}
      - {text: "De comparer une `Duree` à un `int` avec `==`", correct: false}
    answer: "Le compilateur s'en sert comme d'une conversion : là où une `Duree` est attendue, un `int` est accepté et transformé. La conversion inverse demanderait un opérateur de conversion."
  - key: role-de-explicit
    format: course
    question: "Que fait `explicit` devant un constructeur ?"
    choices:
      - {text: "Il interdit de s'en servir pour une conversion implicite", correct: true}
      - {text: "Il interdit d'appeler ce constructeur depuis l'extérieur", correct: false}
      - {text: "Il oblige à passer tous les arguments par référence", correct: false}
      - {text: "Il fait du constructeur le constructeur par défaut", correct: false}
    answer: "Le constructeur reste utilisable, mais seulement quand on nomme le type : `Duree{5}`. Passer un `int` nu là où une `Duree` est attendue ne compile plus."
  - key: pourquoi-explicit
    format: course
    question: "Pourquoi une conversion implicite comme `attendre(5)` est-elle dangereuse ?"
    choices:
      - {text: "L'appel compile sans dire ce que vaut 5, et peut cacher une erreur", correct: true}
      - {text: "L'appel copie l'objet deux fois, ce qui est lent", correct: false}
      - {text: "L'appel modifie le nombre 5 dans tout le programme", correct: false}
      - {text: "L'appel lève une exception si le nombre est négatif", correct: false}
    answer: "Rien ne montre qu'un objet est créé, ni dans quelle unité le nombre est compté. Passer par erreur un identifiant ou un indice compile aussi. `explicit` force à écrire `Duree{5}`."
  - key: quand-ne-pas-mettre
    format: course
    question: "Quand laisse-t-on un constructeur à un argument sans `explicit` ?"
    choices:
      - {text: "Quand la conversion est naturelle, comme d'un littéral vers `std::string`", correct: true}
      - {text: "Quand l'argument est un entier, comme une taille ou une durée", correct: false}
      - {text: "Quand la classe a aussi un constructeur par défaut", correct: false}
      - {text: "Quand le constructeur est déclaré dans la section `private:`", correct: false}
    answer: "Un texte entre guillemets est déjà une chaîne : la conversion ne change pas le sens. Un entier qui devient une durée, une taille ou un identifiant, si : on la rend explicite."
  - key: vf-egal
    format: true-false
    question: "Avec un constructeur `explicit Duree(int)`, la ligne `Duree d = 5;` compile."
    truth: false
    answer: "L'initialisation avec `=` demande une conversion implicite, que `explicit` interdit. `Duree d{5};` compile."
  - key: vf-accolades
    format: true-false
    question: "Avec un constructeur `explicit Duree(int)`, la ligne `Duree d{5};` compile."
    truth: true
    answer: "Le type est nommé : la construction est explicite."
  - key: vf-vector
    format: true-false
    question: "`std::vector<int> v = 5;` compile, et crée un vecteur de cinq éléments."
    truth: false
    answer: "Le constructeur de `std::vector` qui prend une taille est `explicit`. Il faut `std::vector<int> v(5);`."
  - key: vf-supprime-le-constructeur
    format: true-false
    question: "`explicit` empêche d'utiliser le constructeur."
    truth: false
    answer: Il empêche seulement son usage implicite. `Duree{5}` l'appelle toujours.
  - key: qcm-declaration
    format: multiple-choice
    question: "Comment interdire la conversion implicite d'un `int` en `Identifiant` ?"
    choices:
      - {text: "`explicit Identifiant(int valeur);`", correct: true}
      - {text: "`Identifiant(explicit int valeur);`", correct: false}
      - {text: "`Identifiant(int valeur) explicit;`", correct: false}
      - {text: "`private Identifiant(int valeur);`", correct: false}
    answer: "`explicit` s'écrit devant le constructeur."
  - key: qcm-appel-permis
    format: multiple-choice
    question: "Avec `explicit Duree(int)` et `void attendre(Duree duree)`, quel appel compile ?"
    choices:
      - {text: "`attendre(Duree{5});`", correct: true}
      - {text: "`attendre(5);`", correct: false}
      - {text: "`attendre({5});`", correct: false}
      - {text: "`attendre(5.0);`", correct: false}
    answer: "Il faut nommer le type. `attendre({5})` reste une conversion implicite, par liste : elle est refusée aussi."
  - key: qcm-lesquels
    format: multiple-choice
    question: "Par défaut, quels constructeurs marque-t-on `explicit` ?"
    choices:
      - {text: "Ceux qu'on peut appeler avec un seul argument", correct: true}
      - {text: "Ceux qui n'ont aucun paramètre", correct: false}
      - {text: "Ceux qui ont au moins trois paramètres", correct: false}
      - {text: "Ceux qui copient un autre objet de la classe", correct: false}
    answer: "Ce sont eux qui servent de conversions. Cela inclut un constructeur à plusieurs paramètres dont tous sauf un ont une valeur par défaut. Le constructeur de copie, lui, ne se marque pas."
  - key: qcm-cast
    format: multiple-choice
    question: "Avec `explicit Duree(int)`, laquelle de ces écritures convertit 5 en `Duree` ?"
    choices:
      - {text: "`static_cast<Duree>(5)`", correct: true}
      - {text: "`Duree d = 5;`", correct: false}
      - {text: "`Duree d = {5};`", correct: false}
      - {text: "`(int)Duree`", correct: false}
    answer: "`static_cast` est une conversion explicite : elle peut appeler un constructeur `explicit`. Les deux formes avec `=` sont implicites."
  - key: code-conversion-implicite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Duree {
      public:
          Duree(int secondes) : secondes_{secondes} {}
          int secondes() const { return secondes_; }

      private:
          int secondes_;
      };

      int double_duree(Duree duree) {
          return duree.secondes() * 2;
      }

      int main() {
          std::println("{}", double_duree(5));
      }
      ```
    choices:
      - {text: "`10`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`10` : le constructeur n'est pas `explicit`. Le compilateur convertit 5 en `Duree{5}` pour appeler la fonction."
    check:
      output: "10"
  - key: code-explicit-refuse
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Duree {
      public:
          explicit Duree(int secondes) : secondes_{secondes} {}
          int secondes() const { return secondes_; }

      private:
          int secondes_;
      };

      int double_duree(Duree duree) {
          return duree.secondes() * 2;
      }

      int main() {
          std::println("{}", double_duree(5));
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`10`", correct: false}
      - {text: "`5`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : avec `explicit`, un `int` n'est plus converti en `Duree` de lui-même. Il faut écrire `double_duree(Duree{5})`."
    check:
      compiles: false
  - key: code-explicit-accolades
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Duree {
      public:
          explicit Duree(int secondes) : secondes_{secondes} {}
          int secondes() const { return secondes_; }

      private:
          int secondes_;
      };

      int main() {
          Duree a{5};
          Duree b = Duree{7};
          std::println("{}", a.secondes() + b.secondes());
      }
      ```
    choices:
      - {text: "`12`", correct: true}
      - {text: "`5`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "`57`", correct: false}
    answer: "`12` : dans les deux lignes, le type `Duree` est nommé. La construction est explicite, donc permise."
    check:
      output: "12"
  - key: code-surcharge-inattendue
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Rayon {
      public:
          Rayon(int valeur) : valeur_{valeur} {}
          int valeur() const { return valeur_; }

      private:
          int valeur_;
      };

      void dessiner(Rayon rayon) {
          std::println("cercle de rayon {}", rayon.valeur());
      }

      int main() {
          int nombre_de_cercles = 3;
          dessiner(nombre_de_cercles);
      }
      ```
    choices:
      - {text: "`cercle de rayon 3`", correct: true}
      - {text: "Ça ne compile pas", correct: false}
      - text: |-
          ```
          cercle de rayon 3
          cercle de rayon 3
          cercle de rayon 3
          ```
        correct: false
      - {text: "Rien", correct: false}
    answer: "`cercle de rayon 3` : le nombre de cercles est converti en `Rayon` sans un mot. C'est l'erreur qu'un constructeur `explicit` aurait arrêtée à la compilation."
    check:
      output: "cercle de rayon 3"
  - key: bug-conversion-cachee
    format: bug-fix
    question: |-
      L'auteur voulait attendre 5 secondes, et le programme attend 5 millisecondes sans que rien ne l'ait signalé.
      Quelle correction aurait fait refuser cet appel à la compilation ?
      ```cpp
      #include <print>

      class Millisecondes {
      public:
          Millisecondes(int valeur) : valeur_{valeur} {}
          int valeur() const { return valeur_; }

      private:
          int valeur_;
      };

      void attendre(Millisecondes duree) {
          std::println("attente de {} ms", duree.valeur());
      }

      int main() {
          attendre(5);
      }
      ```
    choices:
      - {text: "Déclarer le constructeur `explicit`", correct: true}
      - {text: "Déclarer le constructeur `private`", correct: false}
      - {text: "Déclarer `attendre` avec un paramètre `int`", correct: false}
      - {text: "Déclarer `valeur_` avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      explicit Millisecondes(int valeur) : valeur_{valeur} {}
      ```
      Avec `explicit`, l'appelant doit écrire `attendre(Millisecondes{5})` : l'unité est sous ses yeux. Un paramètre
      `int` perdrait au contraire toute information sur l'unité.
  - key: bug-initialisation-par-egal
    format: bug-fix
    question: |-
      Le compilateur répond « conversion from 'int' to non-scalar type 'Duree' requested ». Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      class Duree {
      public:
          explicit Duree(int secondes) : secondes_{secondes} {}
          int secondes() const { return secondes_; }

      private:
          int secondes_;
      };

      int main() {
          Duree pause = 30;
          std::println("{}", pause.secondes());
      }
      ```
    choices:
      - {text: "Écrire `Duree pause{30};`", correct: true}
      - {text: "Écrire `Duree pause = {30};`", correct: false}
      - {text: "Écrire `Duree pause = \"30\";`", correct: false}
      - {text: "Retirer `explicit` du constructeur", correct: false}
    answer: |-
      ```cpp
      Duree pause{30};
      ```
      `=` demande une conversion implicite, que le constructeur refuse, avec ou sans accolades à droite. Entre
      accolades, juste après le nom, la construction est explicite. Retirer `explicit` rouvrirait la porte aux
      conversions cachées.
  - key: bug-argument-converti
    format: bug-fix
    question: |-
      Ce code ne compile pas depuis que le constructeur est `explicit`. Quelle correction garde cette protection ?
      ```cpp
      #include <print>

      class Identifiant {
      public:
          explicit Identifiant(int valeur) : valeur_{valeur} {}
          int valeur() const { return valeur_; }

      private:
          int valeur_;
      };

      void supprimer(Identifiant id) {
          std::println("suppression de {}", id.valeur());
      }

      int main() {
          supprimer(42);
      }
      ```
    choices:
      - {text: "Écrire l'appel `supprimer(Identifiant{42});`", correct: true}
      - {text: "Écrire l'appel `supprimer({42});`", correct: false}
      - {text: "Écrire l'appel `supprimer((int)42);`", correct: false}
      - {text: "Écrire le paramètre `int id`, à la place d'`Identifiant`", correct: false}
    answer: |-
      ```cpp
      supprimer(Identifiant{42});
      ```
      L'appelant dit maintenant qu'il passe un identifiant, et non un entier quelconque. C'est tout l'intérêt
      d'`explicit`.
  - key: bug-vecteur-par-egal
    format: bug-fix
    question: |-
      Ce code ne compile pas. Il devrait créer un vecteur de cinq zéros. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      int main() {
          std::vector<int> scores = 5;
          std::println("{}", scores.size());
      }
      ```
    choices:
      - {text: "Écrire `std::vector<int> scores(5);`", correct: true}
      - {text: "Écrire `std::vector<int> scores{5};`", correct: false}
      - {text: "Écrire `std::vector<int> scores = {5};`", correct: false}
      - {text: "Écrire `std::vector<int> scores[5];`", correct: false}
    answer: |-
      ```cpp
      std::vector<int> scores(5);
      ```
      Le constructeur qui prend une taille est `explicit` : pas de conversion d'un entier en vecteur. Les versions
      avec accolades compilent, mais créent un vecteur d'un seul élément, qui vaut 5.
  - key: trous-explicit
    format: fill-in
    question: |-
      Complète pour interdire la conversion implicite d'un `int` en `Duree` :
      ```cpp
      class Duree {
      public:
          ___ Duree(int secondes) : secondes_{secondes} {}

      private:
          int secondes_;
      };
      ```
    blanks:
      - [explicit]
    answer: "`explicit` devant le constructeur."
  - key: trous-appel
    format: fill-in
    question: |-
      Le constructeur de `Duree` est `explicit`. Complète l'appel :
      ```cpp
      void attendre(Duree duree);

      attendre(___{5});
      ```
    blanks:
      - [Duree]
    answer: "`attendre(Duree{5});` : on nomme le type, la conversion est explicite."
  - key: trous-cast
    format: fill-in
    question: |-
      Complète pour convertir explicitement 5 en `Duree` :
      ```cpp
      Duree d = ___<Duree>(5);
      ```
    blanks:
      - [static_cast]
    answer: "`static_cast<Duree>(5)` : une conversion explicite peut appeler un constructeur `explicit`."
  - key: trous-vecteur
    format: fill-in
    question: |-
      Complète pour créer un vecteur de cinq zéros, avec des parenthèses :
      ```cpp
      std::vector<int> scores___;
      ```
    blanks:
      - ["(5)"]
    answer: "`std::vector<int> scores(5);` : le constructeur qui prend une taille est `explicit`, on l'appelle directement."
