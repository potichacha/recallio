notion: liste-initialisation
lesson: |-
  La **liste d'initialisation** d'un constructeur initialise les membres **avant** que son corps s'exécute. Elle
  s'écrit après deux-points, entre la liste des paramètres et l'accolade.

  ```cpp
  class Compte {
  public:
      Compte(std::string titulaire, int depot)
          : titulaire_{titulaire}, solde_{depot} {    // la liste d'initialisation
      }

  private:
      std::string titulaire_;
      int solde_;
  };
  ```

  **Initialiser ou affecter.** Quand le corps du constructeur commence, **tous les membres sont déjà construits**.
  Écrire `titulaire_ = titulaire;` dans le corps, c'est donc construire une chaîne vide, puis lui **affecter** une
  valeur : deux opérations. La liste **construit directement** avec la bonne valeur.

  **Les cas où elle est obligatoire.** Trois sortes de membres ne peuvent pas être affectés après coup :

  - un membre **`const`** ;
  - un membre **référence** ;
  - un membre dont le type **n'a pas de constructeur par défaut**.

  **L'ordre.** Les membres sont initialisés dans l'**ordre de leur déclaration dans la classe**, et non dans l'ordre
  de la liste. Si un membre est initialisé à partir d'un autre, c'est l'ordre des déclarations qui dit lequel existe
  déjà. On écrit donc la liste dans l'ordre des déclarations ; `-Wall` signale un ordre différent (`-Wreorder`).

  ```cpp
  class Intervalle {
      int fin_;
      int debut_;
  public:
      Intervalle(int debut) : debut_{debut}, fin_{debut_ + 10} {}   // fin_ est initialisé en premier,
  };                                                                // à partir d'un debut_ indéterminé
  ```

  Un membre absent de la liste prend sa **valeur par défaut** déclarée dans la classe ; à défaut, il est construit
  par défaut, ou reste indéterminé s'il est d'un type fondamental.

  **En entretien** : « J'initialise les membres dans la liste, pas dans le corps : c'est une construction directe, et
  c'est obligatoire pour les `const` et les références. L'ordre réel est celui des déclarations. »
tour:
  - title: La liste d'initialisation
    text: |-
      Un constructeur initialise ses membres dans une **liste**, après deux-points : `: titulaire_{titulaire},
      solde_{depot}`. Les membres sont construits directement avec leur valeur, avant le corps du constructeur.

      C'est la seule façon d'initialiser un membre `const` ou une référence.

      Les membres sont initialisés dans l'ordre où la classe les déclare, quel que soit l'ordre de la liste.

      Essaie : déplace `id_{numero}` dans le corps du constructeur, sous la forme `id_ = numero;`, puis exécute.
    example:
      files:
        main.cpp: |-
          #include <print>
          #include <string>

          class Compte {
          public:
              Compte(int numero, std::string titulaire, int depot)
                  : id_{numero}, titulaire_{titulaire}, solde_{depot} {
              }

              void afficher() const {
                  std::println("n° {} : {} ({})", id_, titulaire_, solde_);
              }

          private:
              const int id_;
              std::string titulaire_;
              int solde_;
          };

          int main() {
              Compte compte{42, "Ada", 100};
              compte.afficher();
          }
      output: "n° 42 : Ada (100)"
cards:
  - key: role-de-la-liste
    format: course
    question: Que fait la liste d'initialisation d'un constructeur ?
    choices:
      - {text: "Elle initialise les membres avant que le corps du constructeur s'exécute", correct: true}
      - {text: "Elle affecte les membres après que le corps du constructeur s'est exécuté", correct: false}
      - {text: "Elle déclare les paramètres que le constructeur accepte", correct: false}
      - {text: "Elle énumère les fonctions membres que le constructeur appelle", correct: false}
    answer: "Les membres sont construits avec les valeurs de la liste, puis le corps s'exécute. Dans le corps, on ne peut plus qu'affecter des membres déjà construits."
  - key: initialiser-ou-affecter
    format: course
    question: "Pourquoi préfère-t-on `: nom_{nom}` à `nom_ = nom;` dans le corps, pour un membre `std::string` ?"
    choices:
      - {text: "La liste construit la chaîne directement, au lieu de la construire vide puis de l'affecter", correct: true}
      - {text: "Le corps du constructeur ne peut pas modifier un membre `std::string`", correct: false}
      - {text: "La liste copie la chaîne deux fois, ce qui la protège", correct: false}
      - {text: "Le corps du constructeur s'exécute avant la construction des membres", correct: false}
    answer: "À l'entrée du corps, le membre existe déjà, construit par défaut. L'affectation fait un second travail. La liste évite la construction inutile."
  - key: ordre-d-initialisation
    format: course
    question: Dans quel ordre les membres d'une classe sont-ils initialisés ?
    choices:
      - {text: "Dans l'ordre de leur déclaration dans la classe", correct: true}
      - {text: "Dans l'ordre où ils sont écrits dans la liste d'initialisation", correct: false}
      - {text: "Dans l'ordre alphabétique de leurs noms", correct: false}
      - {text: "Dans un ordre que le compilateur choisit librement", correct: false}
    answer: "L'ordre des déclarations, toujours. L'ordre de la liste n'a aucun effet : l'écrire dans un autre ordre trompe seulement le lecteur, et `-Wall` le signale."
  - key: cas-obligatoires
    format: course
    question: Lequel de ces membres doit obligatoirement être initialisé dans la liste ?
    choices:
      - {text: "Un membre `const int`", correct: true}
      - {text: "Un membre `int`", correct: false}
      - {text: "Un membre `std::string`", correct: false}
      - {text: "Un membre `std::vector<int>`", correct: false}
    answer: "Un membre `const` ne peut pas être affecté dans le corps. Il en va de même d'une référence, et d'un membre dont le type n'a pas de constructeur par défaut."
  - key: vf-ordre-de-la-liste
    format: true-false
    question: Changer l'ordre des membres dans la liste d'initialisation change l'ordre dans lequel ils sont initialisés.
    truth: false
    answer: Seul l'ordre des déclarations dans la classe compte.
  - key: vf-reference
    format: true-false
    question: Un membre référence doit être initialisé dans la liste d'initialisation.
    truth: true
    answer: Une référence doit désigner un objet dès sa création, et ne peut pas être réaffectée dans le corps.
  - key: vf-corps-apres
    format: true-false
    question: Le corps du constructeur s'exécute avant l'initialisation des membres.
    truth: false
    answer: Tous les membres sont initialisés d'abord. Le corps s'exécute ensuite, sur un objet dont les membres existent.
  - key: vf-membre-absent
    format: true-false
    question: Un membre absent de la liste prend la valeur par défaut déclarée dans la classe, s'il en a une.
    truth: true
    answer: "`int solde_ = 0;` vaut pour tout constructeur qui ne dit rien de `solde_`."
  - key: qcm-syntaxe
    format: multiple-choice
    question: "Quelle écriture initialise `x_` et `y_` dans la liste d'initialisation ?"
    choices:
      - {text: "`Point(int x, int y) : x_{x}, y_{y} {}`", correct: true}
      - {text: "`Point(int x, int y) { x_{x}, y_{y} }`", correct: false}
      - {text: "`Point(int x, int y) = x_{x}, y_{y} {}`", correct: false}
      - {text: "`Point(int x, int y) -> x_{x}; y_{y} {}`", correct: false}
    answer: "Deux-points après les paramètres, les membres séparés par des virgules, puis le corps, qui peut être vide."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Quel avertissement de GCC signale une liste écrite dans un autre ordre que les déclarations ?"
    choices:
      - {text: "`-Wreorder`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wunused`", correct: false}
      - {text: "`-Wconversion`", correct: false}
    answer: "`-Wreorder`, activé par `-Wall` : « will be initialized after »."
  - key: qcm-membre-sans-defaut
    format: multiple-choice
    question: "Une classe `Moteur` n'a qu'un constructeur, qui prend une puissance. Comment une classe `Voiture` initialise-t-elle son membre `Moteur moteur_` ?"
    choices:
      - {text: "Dans la liste d'initialisation : `: moteur_{puissance}`", correct: true}
      - {text: "Dans le corps du constructeur : `moteur_ = puissance;`", correct: false}
      - {text: "Nulle part : le compilateur lui donne une puissance nulle", correct: false}
      - {text: "Dans `main`, après la création de la voiture", correct: false}
    answer: "`Moteur` n'a pas de constructeur par défaut : le membre ne peut pas être construit sans argument. Seule la liste peut lui en passer."
  - key: qcm-dependance
    format: multiple-choice
    question: "La classe déclare `int fin_;` puis `int debut_;`. Que vaut `fin_` après `: debut_{5}, fin_{debut_ + 10}` ?"
    choices:
      - {text: "Une valeur indéterminée : `fin_` est initialisé avant `debut_`", correct: true}
      - {text: "15 : la liste est suivie de gauche à droite", correct: false}
      - {text: "10 : `debut_` vaut zéro tant qu'il n'est pas initialisé", correct: false}
      - {text: "5 : `fin_` reçoit la valeur de `debut_`", correct: false}
    answer: "`fin_` est déclaré en premier : il est initialisé en premier, à partir d'un `debut_` qui n'a pas encore de valeur. C'est un comportement indéfini."
  - key: code-liste
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Point {
      public:
          Point(int x, int y) : x_{x}, y_{y} {}
          int somme() const { return x_ + y_; }

      private:
          int x_;
          int y_;
      };

      int main() {
          Point p{3, 4};
          std::println("{}", p.somme());
      }
      ```
    choices:
      - {text: "`7`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`34`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`7` : la liste initialise `x_` à 3 et `y_` à 4. Le corps du constructeur, vide, n'a plus rien à faire."
    check:
      output: "7"
  - key: code-ordre-des-membres
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(const char* nom) {
              std::println("{}", nom);
          }
      };

      class Paire {
      public:
          Paire() : second_{"second"}, premier_{"premier"} {}

      private:
          Trace premier_;
          Trace second_;
      };

      int main() {
          Paire paire;
      }
      ```
    choices:
      - text: |-
          ```
          premier
          second
          ```
        correct: true
      - text: |-
          ```
          second
          premier
          ```
        correct: false
      - {text: "`premier`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: |-
      ```
      premier
      second
      ```
      Les membres sont construits dans l'ordre de leur déclaration dans la classe : `premier_`, puis `second_`.
      L'ordre de la liste ne change rien.
    check:
      output: |-
        premier
        second
  - key: code-const-affecte
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte(int numero) {
              id_ = numero;
          }
          int id() const { return id_; }

      private:
          const int id_;
      };

      int main() {
          Compte compte{42};
          std::println("{}", compte.id());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`42`", correct: false}
      - {text: "`0`", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
    answer: "Ça ne compile pas : `id_` est `const`. Il ne peut pas être affecté dans le corps, et il n'est pas initialisé. Il faut la liste : `Compte(int numero) : id_{numero} {}`."
    check:
      compiles: false
  - key: code-valeur-par-defaut
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          Compte() {}
          Compte(int depot) : solde_{depot} {}
          int solde() const { return solde_; }
          int decouvert() const { return decouvert_; }

      private:
          int solde_ = 10;
          int decouvert_ = 500;
      };

      int main() {
          Compte a;
          Compte b{100};
          std::println("{} {} {}", a.solde(), b.solde(), b.decouvert());
      }
      ```
    choices:
      - {text: "`10 100 500`", correct: true}
      - {text: "`0 100 0`", correct: false}
      - {text: "`10 10 500`", correct: false}
      - {text: "`10 100 0`", correct: false}
    answer: "`10 100 500` : un membre absent de la liste prend sa valeur par défaut. `b` remplace celle de `solde_`, et garde celle de `decouvert_`."
    check:
      output: "10 100 500"
  - key: bug-membre-const
    format: bug-fix
    question: |-
      Le compilateur répond « uninitialized const member in 'const int' », puis « assignment of read-only member
      'Capteur::id_' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Capteur {
      public:
          Capteur(int id) {
              id_ = id;
          }
          int id() const { return id_; }

      private:
          const int id_;
      };

      int main() {
          Capteur capteur{7};
          std::println("{}", capteur.id());
      }
      ```
    choices:
      - {text: "Initialiser dans la liste : `Capteur(int id) : id_{id} {}`", correct: true}
      - {text: "Initialiser dans le corps, avec des accolades : `id_{id};`", correct: false}
      - {text: "Déclarer le paramètre `const int id`, comme le membre", correct: false}
      - {text: "Déclarer le constructeur avec le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      Capteur(int id) : id_{id} {}
      ```
      Un membre `const` ne peut pas être affecté : il doit recevoir sa valeur à sa construction, donc dans la liste
      d'initialisation.
  - key: bug-membre-reference
    format: bug-fix
    question: |-
      Le compilateur répond « uninitialized reference member in 'int&' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Observateur {
      public:
          Observateur(int& cible) {
              cible_ = cible;
          }
          int lire() const { return cible_; }

      private:
          int& cible_;
      };

      int main() {
          int temperature = 20;
          Observateur observateur{temperature};
          temperature = 25;
          std::println("{}", observateur.lire());
      }
      ```
    choices:
      - {text: "Lier la référence dans la liste : `: cible_{cible}`", correct: true}
      - {text: "Lier la référence dans le corps : `&cible_ = cible;`", correct: false}
      - {text: "Déclarer le membre `int cible_;`, sans `&`", correct: false}
      - {text: "Passer `cible` par valeur au constructeur", correct: false}
    answer: |-
      ```cpp
      Observateur(int& cible) : cible_{cible} {}
      ```
      Une référence se lie à sa création. Dans le corps, `cible_ = cible;` serait une affectation à une référence qui
      ne désigne encore rien. Sans `&`, le membre serait une copie, et afficherait 20.
  - key: bug-ordre
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5 15`, et affiche un second nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Intervalle {
      public:
          Intervalle(int debut) : debut_{debut}, fin_{debut_ + 10} {}
          void afficher() const { std::println("{} {}", debut_, fin_); }

      private:
          int fin_;
          int debut_;
      };

      int main() {
          Intervalle intervalle{5};
          intervalle.afficher();
      }
      ```
    choices:
      - {text: "Déclarer `debut_` avant `fin_` dans la classe", correct: true}
      - {text: "Écrire `fin_` avant `debut_` dans la liste", correct: false}
      - {text: "Écrire les deux initialisations sur deux lignes", correct: false}
      - {text: "Remplacer les accolades de la liste par des parenthèses", correct: false}
    answer: |-
      ```cpp
      private:
          int debut_;
          int fin_;
      ```
      `fin_` est déclaré en premier : il est initialisé en premier, avec un `debut_` encore indéterminé. L'ordre de la
      liste n'y change rien. Écrire `fin_{debut + 10}`, avec le paramètre, supprimerait aussi la dépendance.
  - key: bug-membre-sans-constructeur-par-defaut
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'Moteur::Moteur()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Moteur {
      public:
          Moteur(int puissance) : puissance_{puissance} {}
          int puissance() const { return puissance_; }

      private:
          int puissance_;
      };

      class Voiture {
      public:
          Voiture(int puissance) {
              moteur_ = Moteur{puissance};
          }
          int puissance() const { return moteur_.puissance(); }

      private:
          Moteur moteur_;
      };

      int main() {
          Voiture voiture{90};
          std::println("{}", voiture.puissance());
      }
      ```
    choices:
      - {text: "Écrire `Voiture(int puissance) : moteur_{puissance} {}`", correct: true}
      - {text: "Écrire `moteur_.Moteur(puissance);` dans le corps", correct: false}
      - {text: "Écrire `Moteur moteur_();` dans la classe", correct: false}
      - {text: "Écrire `Voiture voiture;` dans `main`", correct: false}
    answer: |-
      ```cpp
      Voiture(int puissance) : moteur_{puissance} {}
      ```
      Avant le corps, `moteur_` doit déjà être construit, et `Moteur` n'a pas de constructeur sans argument. La liste
      lui passe la puissance.
  - key: trous-deux-points
    format: fill-in
    question: |-
      Complète avec le caractère qui introduit la liste d'initialisation :
      ```cpp
      Point(int x, int y) ___ x_{x}, y_{y} {}
      ```
    blanks:
      - [":"]
    answer: "La liste d'initialisation s'écrit après deux-points."
  - key: trous-membre
    format: fill-in
    question: |-
      Complète pour initialiser le membre `solde_` avec le dépôt :
      ```cpp
      class Compte {
      public:
          Compte(int depot) : ___{depot} {}

      private:
          int solde_;
      };
      ```
    blanks:
      - [solde_]
    answer: "`solde_{depot}` : le nom du membre, puis sa valeur entre accolades."
  - key: trous-separateur
    format: fill-in
    question: |-
      Complète avec le séparateur entre deux membres de la liste :
      ```cpp
      Compte(std::string titulaire, int depot)
          : titulaire_{titulaire}___ solde_{depot} {}
      ```
    blanks:
      - [","]
    answer: "Les membres de la liste sont séparés par des virgules."
  - key: trous-ordre
    format: fill-in
    question: |-
      Complète le commentaire avec le nom du membre initialisé en premier :
      ```cpp
      class Paire {
      public:
          Paire() : b_{2}, a_{1} {}   // le premier initialisé est ___

      private:
          int a_;
          int b_;
      };
      ```
    blanks:
      - [a_]
    answer: "`a_` est déclaré en premier dans la classe : il est initialisé en premier, quel que soit l'ordre de la liste."
