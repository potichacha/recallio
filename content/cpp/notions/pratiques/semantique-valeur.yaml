notion: semantique-valeur
lesson: |-
  Un type a une **sémantique de valeur** quand ses objets se comportent comme des `int` : on les copie, on les
  compare, on les passe et on les renvoie, et **chaque copie est indépendante** de l'original.

  ```cpp
  std::vector<int> a{1, 2, 3};
  std::vector<int> b = a;      // une vraie copie
  b.push_back(4);              // a n'a pas changé : toujours 1, 2, 3
  ```

  C'est le comportement **par défaut** en C++, et celui de toute la bibliothèque standard : `std::string`,
  `std::vector`, `std::map`, `std::optional`. C'est une différence de fond avec Java, C# ou Python, où une
  variable d'objet est une **référence** : là-bas, `b = a` fait désigner à `b` le **même** objet.

  **Valeur ou référence.**

  | | Sémantique de valeur | Sémantique de référence |
  |---|---|---|
  | `b = a` | copie l'état | `b` désigne le même objet |
  | Modifier `b` | ne touche pas `a` | modifie aussi `a` |
  | Identité | ne compte pas : deux `5` sont interchangeables | compte : c'est *cet* objet-là |
  | Durée de vie | celle de la variable | à gérer : qui possède, qui libère ? |
  | En C++ | objets directs, membres, éléments de conteneurs | pointeurs, références, pointeurs intelligents |

  **Ce qu'on y gagne.**

  - Un **raisonnement local** : personne d'autre ne peut modifier ma variable. Pas d'effet à distance par un
    alias oublié.
  - Pas de question de **durée de vie** : l'objet vit avec sa portée, et se libère seul.
  - La **sûreté entre threads** : chaque thread a sa copie, il n'y a rien à synchroniser.
  - La **localité** : un `std::vector<Point>` range les points côte à côte, sans pointeurs à suivre.

  **Un bon type valeur** (on dit un type **régulier**) :

  - se **copie** : la copie est égale à l'original, et indépendante ;
  - se **compare** avec `==` (souvent `= default`) ;
  - se **déplace** à bas coût ;
  - a un **constructeur par défaut**, quand un état vide a un sens.

  Avec la **règle de zéro**, on l'obtient sans rien écrire : des membres qui sont eux-mêmes des valeurs.

  **Et le coût des copies ?** Le déplacement et l'élision de copie l'ont presque supprimé : renvoyer un
  `std::vector` par valeur ne copie rien. Pour **lire** sans copier, on passe par `const T&`. La copie n'a lieu
  que là où l'on veut vraiment deux objets.

  **Quand il faut une sémantique de référence.**

  - Les objets à **identité** : un compte bancaire, une connexion, un thread. En copier un n'a pas de sens : on
    **supprime** la copie.
  - Les hiérarchies **polymorphes** : copier par valeur un objet dérivé dans une base le **découpe**
    (*slicing*). On les manipule par pointeur intelligent.
  - Le **partage** voulu d'un même état : `std::shared_ptr`.

  **Le piège à connaître.** Une classe qui contient un pointeur brut se copie **superficiellement** : les deux
  objets partagent la ressource. Elle a l'air d'une valeur, sans en être une.

  **En entretien** : « En C++, les objets sont des valeurs par défaut : copier donne un objet indépendant, comme
  pour un `int`. Cela simplifie le raisonnement, la durée de vie et la concurrence, et le déplacement en retire
  le coût. Je réserve les pointeurs à l'identité, au polymorphisme et au partage. »
cards:
  - key: definition
    format: course
    question: "Que veut dire qu'un type a une sémantique de valeur ?"
    choices:
      - {text: "Que copier un objet donne un second objet, indépendant du premier", correct: true}
      - {text: "Que copier un objet donne un second nom pour le même objet", correct: false}
      - {text: "Que ses objets ne peuvent jamais être modifiés", correct: false}
      - {text: "Que ses objets sont toujours alloués sur le tas", correct: false}
    answer: "Comme pour un `int` : après `b = a`, modifier `b` ne change pas `a`. C'est le comportement de `std::string` et de tous les conteneurs standard."
  - key: difference-java
    format: course
    question: "`a` et `b` sont deux `std::vector<int>`. Que fait `b = a;` en C++ ?"
    choices:
      - {text: "Il copie les éléments de `a` dans `b` : les deux vecteurs sont ensuite indépendants", correct: true}
      - {text: "Il fait désigner à `b` le même vecteur que `a`, comme le ferait Java", correct: false}
      - {text: "Il déplace les éléments de `a` dans `b`, et laisse `a` vide", correct: false}
      - {text: "Il échange les éléments de `a` et de `b`", correct: false}
    answer: "L'affectation copie l'état. Dans les langages à références, la même ligne ferait partager un seul objet aux deux variables."
  - key: avantage
    format: course
    question: "Pourquoi une valeur est-elle plus simple à raisonner qu'une référence partagée ?"
    choices:
      - {text: "Aucun autre code ne peut la modifier à distance, par un alias", correct: true}
      - {text: "Elle occupe toujours moins de mémoire qu'une référence", correct: false}
      - {text: "Elle ne peut pas être passée à une fonction", correct: false}
      - {text: "Elle est vérifiée par le compilateur à chaque lecture", correct: false}
    answer: "Ce qu'on voit dans la fonction est tout ce qui peut arriver à la variable. Avec un objet partagé, il faut connaître tous ceux qui le tiennent."
  - key: quand-reference
    format: course
    question: "Pour quel genre d'objet la sémantique de valeur ne convient-elle pas ?"
    choices:
      - {text: "Un objet à identité, comme une connexion réseau : le copier n'a pas de sens", correct: true}
      - {text: "Un objet qui contient des nombres, comme un point à deux coordonnées", correct: false}
      - {text: "Un objet qui contient du texte, comme un nom ou une adresse", correct: false}
      - {text: "Un objet qui se compare avec `==`, comme une date", correct: false}
    answer: "Une connexion, un thread, un fichier ouvert : il n'y en a qu'un, et l'on supprime leur copie. Points, textes et dates sont au contraire des valeurs typiques."
  - key: vf-defaut
    format: true-false
    question: "En C++, un objet d'une classe se copie par valeur par défaut."
    truth: true
    answer: "Le constructeur de copie généré copie chaque membre. C'est l'inverse de Java ou de Python, où les objets se manipulent par référence."
  - key: vf-retour
    format: true-false
    question: "Renvoyer un `std::vector` par valeur recopie toujours tous ses éléments."
    truth: false
    answer: "L'élision de copie construit le vecteur chez l'appelant, ou à défaut il est déplacé. La sémantique de valeur ne coûte pas ce qu'on croit."
  - key: vf-pointeur-brut
    format: true-false
    question: "Une classe dont un membre est un pointeur brut possédant a, par défaut, une vraie sémantique de valeur."
    truth: false
    answer: "La copie générée recopie le pointeur : les deux objets partagent la même ressource. Il faut un membre qui soit lui-même une valeur, comme `std::vector`."
  - key: vf-slicing
    format: true-false
    question: "Copier un objet dérivé dans une variable du type de base le découpe."
    truth: true
    answer: "Seule la partie base est copiée : c'est le *slicing*. Les hiérarchies polymorphes se manipulent donc par pointeur ou par référence."
  - key: qcm-regulier
    format: multiple-choice
    question: "Lequel de ces types de la bibliothèque standard n'a pas une sémantique de valeur copiable ?"
    choices:
      - {text: "`std::unique_ptr<int>`", correct: true}
      - {text: "`std::string`", correct: false}
      - {text: "`std::vector<int>`", correct: false}
      - {text: "`std::optional<int>`", correct: false}
    answer: "`std::unique_ptr` représente une possession unique : il se déplace, mais ne se copie pas. Les trois autres se copient en profondeur."
  - key: qcm-lire
    format: multiple-choice
    question: "Avec des types valeur, comment une fonction lit-elle un gros objet sans le copier ?"
    choices:
      - {text: "En le recevant par référence constante : `const T&`", correct: true}
      - {text: "En le recevant par valeur : `T`", correct: false}
      - {text: "En le recevant par `std::shared_ptr<T>`, copié à chaque appel", correct: false}
      - {text: "En le rangeant d'abord dans une variable globale", correct: false}
    answer: "La référence constante emprunte l'objet le temps de l'appel. La sémantique de valeur n'oblige pas à copier : elle garantit que la copie, quand on la fait, est indépendante."
  - key: qcm-egalite
    format: multiple-choice
    question: "Comment donnes-tu l'égalité, membre par membre, à une `struct Point { int x; int y; };` ?"
    choices:
      - {text: "`bool operator==(const Point&) const = default;`", correct: true}
      - {text: "`bool equals(Object autre);`", correct: false}
      - {text: "`virtual bool operator==() = 0;`", correct: false}
      - {text: "`static bool operator=(const Point&);`", correct: false}
    answer: "Depuis C++20, `= default` génère la comparaison de tous les membres. Un type valeur se compare par son état, pas par son adresse."
  - key: qcm-interdire-copie
    format: multiple-choice
    question: "Comment exprimes-tu qu'une classe `Connexion` ne doit pas se copier ?"
    choices:
      - {text: "`Connexion(const Connexion&) = delete;`", correct: true}
      - {text: "`Connexion(const Connexion&) = default;`", correct: false}
      - {text: "`virtual Connexion(const Connexion&);`", correct: false}
      - {text: "`const Connexion(Connexion&);`", correct: false}
    answer: "`= delete` supprime le constructeur de copie : toute tentative est une erreur de compilation. On supprime de même l'affectation de copie."
  - key: situation-venu-de-java
    format: scenario
    question: |-
      Un collègue venu de Java écrit `Panier copie = panier; copie.vider();`, puis s'étonne que `panier` soit
      toujours plein. Que lui expliques-tu ?
    choices:
      - {text: "Qu'en C++ l'affectation copie l'objet : `copie` est un second panier, indépendant", correct: true}
      - {text: "Que `vider()` ne fonctionne pas sur un objet qui vient d'être copié", correct: false}
      - {text: "Que `panier` est constant par défaut, et ne peut donc pas être vidé", correct: false}
      - {text: "Que le compilateur a supprimé l'appel à `vider()`, jugé inutile", correct: false}
    answer: |-
      En Java, les deux variables désigneraient le même objet. En C++, une variable d'objet **est** l'objet. Pour
      agir sur l'original, on prend une référence : `Panier& alias = panier;`.
  - key: situation-tout-en-shared-ptr
    format: scenario
    question: |-
      Dans un projet, tous les objets, même les `Point` et les `Date`, sont créés par `std::make_shared` et passés
      en `std::shared_ptr`, « comme en Java ». Le programme est lent, et personne ne sait qui modifie quoi. Que
      proposes-tu ?
    choices:
      - {text: "Des valeurs pour les petits types sans identité : membres directs, copies, `const&` pour lire", correct: true}
      - {text: "Des pointeurs bruts à la place des `std::shared_ptr`, pour aller plus vite", correct: false}
      - {text: "Un mutex dans chaque objet, pour savoir qui le modifie", correct: false}
      - {text: "Des `std::weak_ptr` partout, pour ne plus partager les objets", correct: false}
    answer: |-
      Un `Point` partagé coûte une allocation, un compteur atomique, et permet à n'importe qui de le modifier à
      distance. En valeur, il tient dans deux registres, et chacun a le sien. Le partage se réserve à ce qui est
      réellement partagé.
  - key: situation-threads
    format: scenario
    question: |-
      Quatre threads doivent chacun traiter une configuration, qu'ils modifient au passage. Un collègue prévoit
      un mutex autour d'une configuration commune. Quelle solution plus simple proposes-tu ?
    choices:
      - {text: "Donner à chaque thread sa propre copie de la configuration", correct: true}
      - {text: "Donner à chaque thread un pointeur brut vers la configuration", correct: false}
      - {text: "Déclarer la configuration commune `volatile`", correct: false}
      - {text: "Lancer les quatre threads l'un après l'autre", correct: false}
    answer: |-
      Des valeurs indépendantes ne se partagent pas : il n'y a ni course aux données, ni verrou. C'est l'un des
      grands bénéfices de la sémantique de valeur.
  - key: situation-hierarchie
    format: scenario
    question: |-
      Un `std::vector<Forme>` reçoit des `Cercle` et des `Carre` par `push_back`. À l'affichage, toutes les aires
      valent zéro. Que s'est-il passé ?
    choices:
      - {text: "Chaque objet a été découpé en `Forme` à la copie : il faut un vecteur de `std::unique_ptr<Forme>`", correct: true}
      - {text: "Le vecteur a réalloué, ce qui a remis les aires à zéro", correct: false}
      - {text: "Les fonctions virtuelles ne fonctionnent pas dans un conteneur", correct: false}
      - {text: "`push_back` ne copie pas les membres de type `double`", correct: false}
    answer: |-
      Un vecteur de `Forme` contient des `Forme`, par valeur : la partie dérivée est perdue. Le polymorphisme
      demande une sémantique de référence : des pointeurs intelligents vers la base.
