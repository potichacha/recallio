notion: questions-entretien-classiques
lesson: |-
  Quelques questions reviennent dans presque tous les entretiens C++. Elles portent sur ce qui distingue le
  langage : la **gestion des ressources** et le **polymorphisme**. Pour chacune, voici la réponse attendue, en
  deux ou trois phrases.

  **« À quoi sert `virtual` ? »**
  À choisir la fonction **à l'exécution**, d'après le type réel de l'objet, et non d'après le type du pointeur ou
  de la référence. Sans `virtual`, `forme->aire()` appelle toujours la version de la classe de base. Le mécanisme :
  chaque objet polymorphe porte un pointeur vers la **table des fonctions virtuelles** de sa classe.

  **« Pourquoi un destructeur virtuel ? »**
  Parce que `delete` sur un pointeur de base, si le destructeur n'est pas virtuel, n'appelle que le destructeur de
  la base : c'est un comportement indéfini, et en pratique les ressources de la classe dérivée fuient. **Toute
  classe de base polymorphe a un destructeur virtuel.**

  **« Qu'est-ce que RAII ? »**
  Lier une ressource à la durée de vie d'un objet : le **constructeur acquiert**, le **destructeur libère**. Comme
  le destructeur est appelé à toute sortie de portée, y compris par une exception, la ressource ne peut pas fuir.
  Exemples : `std::vector`, `std::unique_ptr`, `std::lock_guard`, `std::ifstream`.

  **« Quelle différence entre copier et déplacer ? »**
  Copier duplique la ressource ; **déplacer la transfère** : l'objet d'arrivée prend le tampon, l'objet de départ
  reste valide mais vidé. C'est beaucoup moins cher pour un conteneur. **`std::move` ne déplace rien** : c'est un
  cast vers une rvalue, qui *autorise* le déplacement.

  **« `unique_ptr`, `shared_ptr`, `weak_ptr` ? »**

  | Pointeur | Possession | Coût |
  |---|---|---|
  | `std::unique_ptr` | **exclusive** ; se déplace, ne se copie pas | celui d'un pointeur brut |
  | `std::shared_ptr` | **partagée**, par compteur de références | un compteur atomique, un bloc de contrôle |
  | `std::weak_ptr` | **aucune** : observe un `shared_ptr` | casse les cycles ; `lock()` avant usage |

  Le choix par défaut est `std::unique_ptr`. On les crée avec `std::make_unique` et `std::make_shared`.

  **« Pointeur ou référence ? »**
  Une référence désigne **toujours** un objet, ne peut pas être nulle ni changer de cible. Un pointeur peut être
  nul, et changer. On prend une référence par défaut, un pointeur quand « rien » est une valeur possible.

  **« Qu'est-ce que la règle de trois, cinq, zéro ? »**
  Si une classe écrit l'une des fonctions spéciales (destructeur, copies, déplacements), elle a sans doute besoin
  des autres : trois avant C++11, cinq depuis. La **règle de zéro** : confier les ressources à des membres qui les
  gèrent, et n'en écrire aucune.

  **« Pile ou tas ? »**
  La pile : allocation immédiate, libération automatique à la fin de la portée, taille limitée. Le tas : allocation
  explicite (`new`, `make_unique`), durée de vie libre, plus lent. On préfère la pile, et l'on passe par des
  conteneurs et des pointeurs intelligents pour le tas.

  **« Qu'est-ce qu'un comportement indéfini ? »**
  Un programme auquel le standard n'impose plus rien : accès hors bornes, pointeur pendant, débordement d'entier
  signé, course aux données. Il peut sembler fonctionner. On le traque avec les avertissements et les sanitizers.

  **« `const` : où et pourquoi ? »**
  Partout où c'est vrai : paramètres par référence, fonctions membres qui ne modifient pas l'objet, variables. Le
  compilateur vérifie, et l'interface dit ce qui change.

  **La forme d'une bonne réponse.** Une **définition** en une phrase, le **pourquoi**, un **exemple** court, et le
  **piège** associé. « RAII lie une ressource à un objet ; ainsi elle est libérée même en cas d'exception ; c'est
  ce que fait `std::lock_guard` ; à l'inverse, un `new` sans propriétaire fuit. »
cards:
  - key: virtual
    format: course
    question: "Que répondre à « À quoi sert le mot-clé `virtual` ? »"
    choices:
      - {text: "À choisir la fonction à l'exécution, d'après le type réel de l'objet", correct: true}
      - {text: "À choisir la fonction à la compilation, d'après le type du pointeur", correct: false}
      - {text: "À rendre la fonction accessible depuis les classes dérivées", correct: false}
      - {text: "À faire exécuter la fonction dans un autre thread", correct: false}
    answer: "C'est la liaison dynamique. Chaque objet polymorphe porte un pointeur vers la table des fonctions virtuelles de sa classe, consultée à l'appel."
  - key: raii
    format: course
    question: "Que répondre à « Qu'est-ce que RAII ? »"
    choices:
      - {text: "Le constructeur acquiert la ressource, le destructeur la libère, à toute sortie de portée", correct: true}
      - {text: "Un ramasse-miettes libère les objets que plus aucun pointeur ne désigne", correct: false}
      - {text: "Le programmeur libère chaque ressource à la main, dans un bloc `finally`", correct: false}
      - {text: "Le système d'exploitation reprend toutes les ressources à la fin du programme", correct: false}
    answer: "La ressource vit ce que vit l'objet. Comme le destructeur est appelé même quand une exception traverse la fonction, elle ne peut pas fuir."
  - key: move
    format: course
    question: "Que répondre à « Que fait `std::move` ? »"
    choices:
      - {text: "Rien à l'exécution : c'est un cast vers une rvalue, qui autorise le déplacement", correct: true}
      - {text: "Il déplace les octets de l'objet vers une autre adresse en mémoire", correct: false}
      - {text: "Il détruit l'objet d'origine, après l'avoir copié dans un autre", correct: false}
      - {text: "Il transfère l'objet de la pile vers le tas", correct: false}
    answer: "Le déplacement est fait par le constructeur ou l'affectation de déplacement qui reçoit la rvalue. Si le type n'en a pas, l'objet est copié."
  - key: pointeurs-intelligents
    format: course
    question: "Que répondre à « Quelle différence entre `std::unique_ptr` et `std::shared_ptr` ? »"
    choices:
      - {text: "`unique_ptr` : un seul propriétaire, sans surcoût. `shared_ptr` : plusieurs, par compteur de références", correct: true}
      - {text: "`unique_ptr` : plusieurs propriétaires, par compteur. `shared_ptr` : un seul propriétaire, sans surcoût", correct: false}
      - {text: "`unique_ptr` : pour les objets de la pile. `shared_ptr` : pour les objets du tas", correct: false}
      - {text: "`unique_ptr` : libéré à la main avec `delete`. `shared_ptr` : libéré automatiquement", correct: false}
    answer: "`std::unique_ptr` est le choix par défaut : il se déplace, ne se copie pas, et coûte ce que coûte un pointeur brut. `std::shared_ptr` ne se justifie que par une possession réellement partagée."
  - key: vf-destructeur-virtuel
    format: true-false
    question: "Une classe de base polymorphe doit avoir un destructeur virtuel."
    truth: true
    answer: "Sinon, `delete` par un pointeur de base est un comportement indéfini : le destructeur de la classe dérivée n'est pas appelé."
  - key: vf-move-deplace
    format: true-false
    question: "`std::move(x)` déplace `x` dès qu'il est appelé."
    truth: false
    answer: "C'est seulement un cast. Sans constructeur ou affectation qui reçoive le résultat, rien ne se passe."
  - key: vf-reference-nulle
    format: true-false
    question: "Une référence peut être nulle, comme un pointeur."
    truth: false
    answer: "Elle désigne toujours un objet, et ne change pas de cible. C'est pourquoi on la préfère quand l'argument est obligatoire."
  - key: vf-shared-ptr-defaut
    format: true-false
    question: "`std::shared_ptr` est le pointeur intelligent à choisir par défaut."
    truth: false
    answer: "C'est `std::unique_ptr`. La possession partagée a un coût, et rend la durée de vie des objets plus difficile à suivre."
  - key: qcm-weak-ptr
    format: multiple-choice
    question: "À quoi sert `std::weak_ptr` ?"
    choices:
      - {text: "À observer un objet tenu par `std::shared_ptr`, sans le posséder", correct: true}
      - {text: "À posséder un objet de façon exclusive, sans compteur", correct: false}
      - {text: "À désigner un objet de la pile, sans le libérer", correct: false}
      - {text: "À libérer un objet plus vite qu'un `std::shared_ptr`", correct: false}
    answer: "Il ne compte pas parmi les propriétaires : il casse les cycles de `std::shared_ptr`. `lock()` rend un `std::shared_ptr`, nul si l'objet a disparu."
  - key: qcm-regle-zero
    format: multiple-choice
    question: "Que recommande la règle de zéro ?"
    choices:
      - {text: "De n'écrire aucune fonction spéciale, en confiant les ressources à des membres qui les gèrent", correct: true}
      - {text: "D'écrire les cinq fonctions spéciales dans chaque classe, sans exception", correct: false}
      - {text: "De n'utiliser aucun pointeur, ni brut ni intelligent, dans une classe", correct: false}
      - {text: "De n'allouer aucun objet sur le tas", correct: false}
    answer: "Avec des `std::vector`, des `std::string` et des pointeurs intelligents pour membres, les fonctions générées par le compilateur sont justes."
  - key: qcm-ub
    format: multiple-choice
    question: "Lequel de ces cas n'est pas un comportement indéfini ?"
    choices:
      - {text: "Ajouter 1 à un `unsigned int` qui vaut son maximum", correct: true}
      - {text: "Ajouter 1 à un `int` qui vaut son maximum", correct: false}
      - {text: "Lire `v[v.size()]` sur un `std::vector`", correct: false}
      - {text: "Déréférencer un pointeur après son `delete`", correct: false}
    answer: "L'arithmétique non signée reboucle : c'est défini. Le débordement signé, l'accès hors bornes et le pointeur pendant sont indéfinis."
  - key: qcm-pile-tas
    format: multiple-choice
    question: "Quelle affirmation sur la pile et le tas est juste ?"
    choices:
      - {text: "Une variable locale vit sur la pile, et est détruite à la fin de sa portée", correct: true}
      - {text: "Une variable locale vit sur le tas, et doit être libérée avec `delete`", correct: false}
      - {text: "Un objet créé avec `new` vit sur la pile, et est détruit à la fin de la fonction", correct: false}
      - {text: "La pile est plus lente que le tas, mais n'a pas de limite de taille", correct: false}
    answer: "La pile est rapide, automatique et limitée. Le tas demande une allocation explicite, que l'on confie à un conteneur ou à un pointeur intelligent."
  - key: situation-delete-base
    format: scenario
    question: |-
      En entretien, on te montre `Forme* f = new Cercle; delete f;`, où `Forme` n'a pas de destructeur virtuel, et
      l'on te demande ce qui se passe. Que réponds-tu ?
    choices:
      - {text: "C'est un comportement indéfini ; en pratique, le destructeur de `Cercle` n'est pas appelé", correct: true}
      - {text: "Le destructeur de `Cercle` est appelé, puis celui de `Forme`, comme toujours", correct: false}
      - {text: "Le code ne compile pas : `delete` exige un destructeur virtuel", correct: false}
      - {text: "Le destructeur de `Cercle` est appelé deux fois", correct: false}
    answer: |-
      Sans `virtual`, le destructeur est choisi d'après le type du pointeur : seul `~Forme` s'exécute, et les
      ressources propres au cercle fuient. Le remède : `virtual ~Forme() = default;`, et un
      `std::unique_ptr<Forme>` au lieu du `new`.
  - key: situation-move-const
    format: scenario
    question: |-
      On te demande pourquoi, dans `const std::string nom = "Ada"; auto copie = std::move(nom);`, la chaîne est
      copiée et non déplacée. Que réponds-tu ?
    choices:
      - {text: "Que `nom` est `const` : on ne peut pas lui voler son tampon, donc c'est la copie qui est choisie", correct: true}
      - {text: "Que `std::move` ne fonctionne qu'avec les types fondamentaux", correct: false}
      - {text: "Que `auto` interdit le déplacement, et impose toujours une copie", correct: false}
      - {text: "Que `std::move` a déjà déplacé `nom` vers une variable temporaire", correct: false}
    answer: |-
      `std::move` sur un objet constant donne une rvalue constante. Le constructeur de déplacement veut modifier
      sa source : il ne s'applique pas, et le constructeur de copie prend le relais, sans avertissement.
  - key: situation-cycle
    format: scenario
    question: |-
      On te décrit deux classes, `Parent` et `Enfant`, qui se tiennent l'une l'autre par `std::shared_ptr`, et dont
      les objets ne sont jamais détruits. On te demande pourquoi, et comment corriger. Que réponds-tu ?
    choices:
      - {text: "C'est un cycle : aucun compteur n'atteint zéro. L'enfant tient son parent par `std::weak_ptr`", correct: true}
      - {text: "C'est une double libération : il faut appeler `reset()` deux fois sur chaque pointeur", correct: false}
      - {text: "C'est une course aux données : il faut protéger les deux pointeurs par un mutex", correct: false}
      - {text: "C'est un défaut de `std::shared_ptr` : il faut revenir aux pointeurs bruts et à `delete`", correct: false}
    answer: |-
      Chaque objet garde l'autre en vie. Le lien de retour, de l'enfant vers le parent, n'est pas une possession :
      un `std::weak_ptr` l'exprime, et le cycle disparaît.
  - key: situation-forme-reponse
    format: scenario
    question: |-
      On te demande : « Qu'est-ce que RAII ? » Laquelle de ces réponses est la plus convaincante ?
    choices:
      - {text: "Une définition, son intérêt face aux exceptions, et un exemple comme `std::lock_guard`", correct: true}
      - {text: "La seule signification du sigle, « Resource Acquisition Is Initialization »", correct: false}
      - {text: "Une liste de dix classes de la bibliothèque standard, sans les relier", correct: false}
      - {text: "« C'est comme le ramasse-miettes de Java », sans autre précision", correct: false}
    answer: |-
      Une bonne réponse tient en quatre temps : la définition (le destructeur libère ce que le constructeur a
      acquis), le pourquoi (libération garantie, même en cas d'exception), un exemple précis, et le piège inverse
      (un `new` sans propriétaire).
