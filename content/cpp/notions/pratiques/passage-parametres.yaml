notion: passage-parametres
lesson: |-
  La façon de passer un paramètre dit à l'appelant **ce que la fonction va faire** de son argument. Le bon choix
  dépend de deux questions : la fonction **lit**, **modifie** ou **garde** l'argument ? Et le type est-il **bon
  marché à copier** ?

  **Le tableau de décision.**

  | Intention | Type bon marché (`int`, `double`, pointeur, `string_view`) | Type coûteux (`string`, `vector`, objets) |
  |---|---|---|
  | **Lire** | par valeur : `int n` | par référence constante : `const T&` |
  | **Modifier** l'objet de l'appelant | par référence : `int& n` | par référence : `T&` |
  | **Garder** une copie (la ranger dans un membre) | par valeur | par valeur, puis `std::move` |
  | **Prendre possession** d'une ressource | | `std::unique_ptr<T>` par valeur |
  | Argument **facultatif** | `std::optional<T>` | pointeur `const T*`, qui peut être nul |

  **Lire : `const T&`.** Aucune copie, et l'appelant peut passer une variable, une constante ou un temporaire.

  ```cpp
  double moyenne(const std::vector<double>& valeurs);
  ```

  Pour du texte, `std::string_view` par valeur accepte aussi un littéral, sans allouer de chaîne.

  **Modifier : `T&`.** La référence non constante annonce que l'argument **sera changé**. On la garde pour ce cas.
  Pour **produire** un résultat, on le **renvoie** : l'élision de copie rend le retour par valeur gratuit.

  ```cpp
  void trier(std::vector<int>& valeurs);          // modifie en place
  std::vector<int> charger();                     // produit : retour par valeur
  ```

  **Garder : par valeur, puis déplacer.** Une fonction qui range son argument en a besoin d'une copie de toute
  façon. En le prenant par valeur, elle laisse l'appelant choisir : il copie (`f(nom)`) ou il déplace
  (`f(std::move(nom))`, ou un temporaire).

  ```cpp
  class Client {
  public:
      explicit Client(std::string nom) : nom_{std::move(nom)} {}
  private:
      std::string nom_;
  };
  ```

  Sans le `std::move`, le paramètre serait copié une seconde fois dans le membre.

  **Prendre possession : `std::unique_ptr<T>` par valeur.** La signature oblige l'appelant à écrire `std::move` :
  le transfert se voit.

  ```cpp
  void ajouter(std::unique_ptr<Forme> forme);
  ```

  Une fonction qui ne fait qu'**utiliser** l'objet, sans le posséder, reçoit `const Forme&` ou `Forme*`, pas le
  pointeur intelligent.

  **Ce qu'on évite.**

  - `const int&` pour un type fondamental : une indirection pour rien.
  - `const std::unique_ptr<T>&` : il ne dit rien de la possession ; on passe l'objet, `const T&`.
  - `T&&` hors des constructeurs et affectations de déplacement, et hors des templates.
  - Les **paramètres de sortie** (`void lire(Resultat& sortie)`) : on renvoie la valeur, ou une `struct`.
  - `std::shared_ptr<T>` par valeur quand on ne partage pas la possession : chaque copie met à jour un compteur
    atomique.

  **En entretien** : « Par valeur ce qui est petit, par référence constante ce que je lis, par référence ce que je
  modifie, par valeur puis `std::move` ce que je garde, et `std::unique_ptr` par valeur pour un transfert de
  possession. Les résultats, je les renvoie. »
cards:
  - key: lire
    format: course
    question: "Comment passes-tu une `std::string` qu'une fonction ne fait que lire ?"
    choices:
      - {text: "Par référence constante : `const std::string&`, ou par `std::string_view`", correct: true}
      - {text: "Par valeur : `std::string`, pour ne pas risquer de la modifier", correct: false}
      - {text: "Par référence : `std::string&`, pour éviter la copie", correct: false}
      - {text: "Par référence à une rvalue : `std::string&&`", correct: false}
    answer: "La référence constante ne copie rien, et promet de ne rien modifier. `std::string_view` fait de même, et accepte un littéral sans allouer."
  - key: garder
    format: course
    question: "Un constructeur range son paramètre `nom` dans un membre. Comment le reçoit-il ?"
    choices:
      - {text: "Par valeur, puis il le déplace dans le membre avec `std::move`", correct: true}
      - {text: "Par référence constante, puis il le déplace dans le membre avec `std::move`", correct: false}
      - {text: "Par référence non constante, puis il le copie dans le membre", correct: false}
      - {text: "Par pointeur, puis il garde le pointeur dans le membre", correct: false}
    answer: "Par valeur, l'appelant choisit de copier ou de déplacer son argument. Le `std::move` final évite une seconde copie. Déplacer depuis une référence constante copie."
  - key: modifier
    format: course
    question: "Qu'annonce un paramètre `std::vector<int>& valeurs` à l'appelant ?"
    choices:
      - {text: "Que la fonction va modifier son vecteur", correct: true}
      - {text: "Que la fonction va copier son vecteur", correct: false}
      - {text: "Que la fonction va détruire son vecteur", correct: false}
      - {text: "Que la fonction ne fera que lire son vecteur", correct: false}
    answer: "Une référence non constante sert à modifier l'argument en place. Pour une simple lecture, on écrit `const`, et l'appelant le sait."
  - key: possession
    format: course
    question: "Comment une fonction reçoit-elle la possession d'un objet alloué sur le tas ?"
    choices:
      - {text: "Par un `std::unique_ptr<T>` passé par valeur", correct: true}
      - {text: "Par un `const std::unique_ptr<T>&`", correct: false}
      - {text: "Par un pointeur brut `T*`, avec un commentaire", correct: false}
      - {text: "Par une référence `T&`, qu'elle libère avec `delete`", correct: false}
    answer: "L'appelant doit écrire `std::move` : le transfert est visible dans son code. Un pointeur brut ne dit pas qui doit libérer."
  - key: vf-int-reference
    format: true-false
    question: "Un paramètre `int` se passe de préférence par référence constante."
    truth: false
    answer: "Un `int` tient dans un registre : par valeur, c'est plus simple et au moins aussi rapide."
  - key: vf-temporaire
    format: true-false
    question: "Un paramètre `const std::string&` accepte un littéral comme `\"bonjour\"`."
    truth: true
    answer: "Une `std::string` temporaire est construite, et la référence constante s'y lie. `std::string_view` éviterait même cette construction."
  - key: vf-sortie
    format: true-false
    question: "En C++ moderne, un résultat se renvoie de préférence par un paramètre de sortie plutôt que par valeur."
    truth: false
    answer: "Le retour par valeur ne coûte rien, grâce à l'élision de copie et au déplacement, et l'appel se lit mieux. Pour plusieurs résultats, on renvoie une `struct`."
  - key: vf-utiliser
    format: true-false
    question: "Une fonction qui utilise un objet sans le posséder reçoit `const T&`, pas un pointeur intelligent."
    truth: true
    answer: "Elle n'a pas à savoir comment l'appelant gère la durée de vie. L'appelant passe `*pointeur`."
  - key: qcm-string-view
    format: multiple-choice
    question: "Comment passes-tu un `std::string_view` à une fonction ?"
    choices:
      - {text: "Par valeur", correct: true}
      - {text: "Par référence constante", correct: false}
      - {text: "Par pointeur", correct: false}
      - {text: "Par référence à une rvalue", correct: false}
    answer: "Une vue contient un pointeur et une taille : la copier est immédiat."
  - key: qcm-facultatif
    format: multiple-choice
    question: "Un paramètre est un gros objet, qui peut être absent. Quel type choisis-tu ?"
    choices:
      - {text: "`const Config*`, qui peut valoir `nullptr`", correct: true}
      - {text: "`const Config&`, qui peut être nulle", correct: false}
      - {text: "`Config`, initialisé à zéro quand il est absent", correct: false}
      - {text: "`Config&&`, vide quand il est absent", correct: false}
    answer: "Une référence désigne toujours un objet. Un pointeur exprime « peut-être rien », sans copier ; pour un petit type, `std::optional<T>` convient."
  - key: qcm-trier
    format: multiple-choice
    question: "Quelle signature convient à une fonction qui trie en place le vecteur de l'appelant ?"
    choices:
      - {text: "`void trier(std::vector<int>& valeurs);`", correct: true}
      - {text: "`void trier(std::vector<int> valeurs);`", correct: false}
      - {text: "`void trier(const std::vector<int>& valeurs);`", correct: false}
      - {text: "`void trier(std::vector<int>&& valeurs);`", correct: false}
    answer: "La fonction modifie l'argument : référence non constante. Par valeur, elle trierait une copie ; avec `const`, elle ne pourrait rien modifier."
  - key: qcm-appel-transfert
    format: multiple-choice
    question: "La fonction est `void ajouter(std::unique_ptr<Forme> forme);`. Comment l'appelant lui passe-t-il son pointeur `p` ?"
    choices:
      - {text: "`ajouter(std::move(p));`", correct: true}
      - {text: "`ajouter(p);`", correct: false}
      - {text: "`ajouter(&p);`", correct: false}
      - {text: "`ajouter(*p);`", correct: false}
    answer: "Un `std::unique_ptr` ne se copie pas : il faut le déplacer. Après l'appel, `p` est nul."
  - key: situation-setter
    format: scenario
    question: |-
      Tu écris `void Client::renommer(...)`, qui range le nouveau nom dans le membre `nom_`. Les appelants passent
      tantôt une variable qu'ils gardent, tantôt une chaîne temporaire. Quelle signature choisis-tu ?
    choices:
      - {text: "`void renommer(std::string nom)`, avec `nom_ = std::move(nom);`", correct: true}
      - {text: "`void renommer(std::string& nom)`, avec `nom_ = nom;`", correct: false}
      - {text: "`void renommer(const std::string* nom)`, avec `nom_ = *nom;`", correct: false}
      - {text: "`void renommer(std::string_view nom)`, avec le membre déclaré `std::string_view`", correct: false}
    answer: |-
      Par valeur : une variable est copiée dans le paramètre, un temporaire y est déplacé, puis le `std::move`
      range le tout dans le membre sans copie supplémentaire. Garder une vue dans un membre le laisserait pendant
      dès que la chaîne d'origine disparaît.
  - key: situation-sortie
    format: scenario
    question: |-
      Une fonction a pour signature `bool analyser(const std::string& texte, int& ligne, int& colonne,
      std::string& message)`. Les appelants doivent déclarer trois variables avant de l'appeler. Que proposes-tu ?
    choices:
      - {text: "Renvoyer une `struct` avec les trois champs, dans un `std::optional` ou un `std::expected`", correct: true}
      - {text: "Passer les trois paramètres de sortie par pointeur, pour qu'ils se voient à l'appel", correct: false}
      - {text: "Ranger les trois résultats dans des variables globales", correct: false}
      - {text: "Garder la signature, et ajouter un commentaire sur les paramètres de sortie", correct: false}
    answer: |-
      Les paramètres de sortie obligent à lire la documentation pour savoir ce qui entre et ce qui sort. Une valeur
      de retour structurée se lit d'un coup, se range dans une constante, et ne coûte rien grâce à l'élision de
      copie.
  - key: situation-shared-ptr
    format: scenario
    question: |-
      Une fonction `void afficher(std::shared_ptr<Document> doc)` ne fait que lire le document. Elle est appelée
      dans une boucle serrée, et le profileur montre du temps passé sur le compteur de références. Que proposes-tu ?
    choices:
      - {text: "Recevoir `const Document& doc` : la fonction ne partage pas la possession", correct: true}
      - {text: "Recevoir `std::unique_ptr<Document> doc`, plus léger qu'un `std::shared_ptr`", correct: false}
      - {text: "Recevoir `std::shared_ptr<Document>&& doc`, pour forcer un déplacement", correct: false}
      - {text: "Recevoir `std::weak_ptr<Document> doc`, qui n'a pas de compteur", correct: false}
    answer: |-
      Copier un `std::shared_ptr` incrémente puis décrémente un compteur atomique à chaque appel. Une fonction qui
      se contente d'utiliser l'objet n'a pas à connaître son mode de possession : l'appelant passe `*doc`.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, tu lis `void journaliser(const std::string& message)`, appelée partout avec des littéraux :
      `journaliser("démarrage")`. Quel changement proposes-tu ?
    choices:
      - {text: "Recevoir `std::string_view message` : plus de chaîne temporaire construite à chaque appel", correct: true}
      - {text: "Recevoir `std::string& message` : plus de copie de la chaîne à chaque appel", correct: false}
      - {text: "Recevoir `const char message[]` : seuls les littéraux sont alors acceptés", correct: false}
      - {text: "Recevoir `std::string&& message` : le littéral est alors déplacé", correct: false}
    answer: |-
      Chaque appel avec un littéral construit une `std::string` temporaire, avec une allocation si le texte est
      long. `std::string_view` désigne les caractères sans rien allouer, et accepte toujours une `std::string`.
  - key: bug-copie-parametre
    format: bug-fix
    question: |-
      Cette fonction ne fait que lire son paramètre, mais copie tout le vecteur à chaque appel. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      bool contient(std::vector<int> valeurs, int cible) {
          for (int v : valeurs) {
              if (v == cible) {
                  return true;
              }
          }
          return false;
      }

      int main() {
          const std::vector<int> donnees{1, 2, 3};
          std::println("{}", contient(donnees, 2));
      }
      ```
    choices:
      - {text: "Recevoir `const std::vector<int>& valeurs`", correct: true}
      - {text: "Recevoir `std::vector<int>& valeurs`", correct: false}
      - {text: "Recevoir `std::vector<int>&& valeurs`", correct: false}
      - {text: "Recevoir `const int& cible`", correct: false}
    answer: |-
      ```cpp
      bool contient(const std::vector<int>& valeurs, int cible) {
      ```
      La fonction lit : référence constante. Sans `const`, elle refuserait `donnees`, qui est constant. Passer
      `cible` par référence n'apporte rien : c'est un `int`.
  - key: bug-move-oublie
    format: bug-fix
    question: |-
      Ce constructeur reçoit le nom par valeur, puis le copie une seconde fois dans le membre. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Client {
      public:
          explicit Client(std::string nom) : nom_{nom} {}
          const std::string& nom() const { return nom_; }

      private:
          std::string nom_;
      };

      int main() {
          const Client client{"Ada Lovelace"};
          std::println("{}", client.nom());
      }
      ```
    choices:
      - {text: "Initialiser le membre avec `nom_{std::move(nom)}`", correct: true}
      - {text: "Initialiser le membre avec `nom_{&nom}`", correct: false}
      - {text: "Initialiser le membre avec `nom_{std::ref(nom)}`", correct: false}
      - {text: "Initialiser le membre avec `nom_{nom.c_str()}`", correct: false}
    answer: |-
      ```cpp
      explicit Client(std::string nom) : nom_{std::move(nom)} {}
      ```
      Le paramètre est déjà une copie, propre à la fonction, dont on n'a plus besoin : on le déplace dans le membre.
      Sans `std::move`, la chaîne est copiée une seconde fois.
  - key: bug-modification-perdue
    format: bug-fix
    question: |-
      Ce programme devrait afficher `4` après l'ajout. Il affiche `3`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      void ajouter_zero(std::vector<int> valeurs) {
          valeurs.push_back(0);
      }

      int main() {
          std::vector<int> donnees{1, 2, 3};
          ajouter_zero(donnees);
          std::println("{}", donnees.size());
      }
      ```
    choices:
      - {text: "Recevoir `std::vector<int>& valeurs`", correct: true}
      - {text: "Recevoir `const std::vector<int>& valeurs`", correct: false}
      - {text: "Recevoir `std::vector<int>* valeurs`, sans changer le corps", correct: false}
      - {text: "Appeler `ajouter_zero(std::move(donnees));`", correct: false}
    answer: |-
      ```cpp
      void ajouter_zero(std::vector<int>& valeurs) {
      ```
      Par valeur, la fonction modifie une copie, détruite à son retour. Pour modifier le vecteur de l'appelant, il
      faut une référence non constante.
  - key: bug-unique-ptr-copie
    format: bug-fix
    question: |-
      Le compilateur répond « use of deleted function » sur l'appel de `adopter`. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>
      #include <utility>

      void adopter(std::unique_ptr<int> valeur) {
          std::println("{}", *valeur);
      }

      int main() {
          auto p = std::make_unique<int>(42);
          adopter(p);
      }
      ```
    choices:
      - {text: "Appeler `adopter(std::move(p));`", correct: true}
      - {text: "Appeler `adopter(&p);`", correct: false}
      - {text: "Appeler `adopter(*p);`", correct: false}
      - {text: "Appeler `adopter(p.get());`", correct: false}
    answer: |-
      ```cpp
      adopter(std::move(p));
      ```
      Passer un `std::unique_ptr` par valeur, c'est en transférer la possession : il ne se copie pas, il se déplace.
      Le `std::move` rend ce transfert visible chez l'appelant.
