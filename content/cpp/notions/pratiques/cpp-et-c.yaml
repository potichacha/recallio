notion: cpp-et-c
lesson: |-
  C++ est né du C, et en accepte encore presque tout. Mais « ça compile » ne veut pas dire « c'est du C++ » : le
  style du C contourne tout ce que C++ a ajouté pour la sûreté. Écrire du C compilé par `g++` est le défaut le
  plus courant des développeurs qui arrivent du C.

  **Ce qu'on n'écrit plus, et par quoi on le remplace.**

  | En C | En C++ | Ce qu'on y gagne |
  |---|---|---|
  | `malloc`, `free` | `std::vector`, `std::make_unique` | constructeurs appelés, libération automatique |
  | `char*`, `strcpy`, `strlen`, `strcmp` | `std::string`, `std::string_view` | taille connue, pas de dépassement |
  | tableau `int t[10]` passé avec sa taille | `std::array`, `std::vector`, `std::span` | la taille voyage avec les données |
  | `printf`, `scanf` | `std::print`, `std::format` | types vérifiés à la compilation |
  | `#define MAX 100` | `constexpr int max = 100;` | un type, une portée |
  | macro-fonction `#define CARRE(x)` | fonction `constexpr`, template | arguments évalués une fois |
  | cast `(int)x` | `static_cast<int>(x)` | intention visible, conversions dangereuses refusées |
  | `NULL` | `nullptr` | un vrai type de pointeur |
  | `void*` générique | templates, `std::variant` | types vérifiés |
  | code d'erreur à tester | exception, `std::optional`, `std::expected` | l'erreur ne peut pas être ignorée |
  | `struct` + fonctions libres + `init`/`destroy` | classe avec constructeur et destructeur (RAII) | impossible d'oublier le nettoyage |
  | `qsort` avec un pointeur de fonction | `std::sort` avec une lambda | typé, et plus rapide |

  **Pourquoi `malloc` est faux en C++.** `malloc` réserve des octets, **sans appeler de constructeur** ; `free`
  les rend **sans appeler de destructeur**. Pour un type qui a un constructeur (`std::string`, toute classe), le
  résultat n'est pas un objet : s'en servir est un comportement indéfini.

  **Les incompatibilités réelles.** C++ n'est pas un sur-ensemble exact du C.

  - `void*` ne se convertit **pas implicitement** : `int* p = malloc(4);` compile en C, pas en C++.
  - Un littéral de chaîne est `const char[]` : `char* s = "abc";` est refusé.
  - C++ a des **mots-clés** de plus : `class`, `new`, `template`, `this` ne peuvent pas servir de noms.
  - `'a'` est un `char` en C++, un `int` en C.
  - Les tableaux de taille variable (`int t[n];`) existent en C99, pas en C++.

  **Les en-têtes du C.** On les inclut sous leur nom C++ : `<cstdio>`, `<cstring>`, `<cmath>`, `<cstdlib>`. Leurs
  fonctions sont alors dans `std`.

  **Appeler du C depuis C++.** C'est une force du langage : toute bibliothèque C s'utilise directement. On déclare
  ses fonctions dans un bloc `extern "C"`, qui désactive la décoration des noms :

  ```cpp
  extern "C" {
  #include "bibliotheque.h"
  }
  ```

  On enveloppe ensuite ses ressources dans une petite classe RAII, pour ne pas propager le style C dans le
  reste du programme.

  **Ce qui reste du C, à bon droit.** Les types fondamentaux, les opérateurs, les structures de contrôle, les
  fonctions de `<cmath>`. Et le modèle de coût : on ne paie pas ce qu'on n'utilise pas.

  **En entretien** : « C++ accepte presque tout le C, mais je n'écris pas du C en C++ : `std::vector` et
  `std::string` au lieu de `malloc` et `char*`, `constexpr` au lieu de `#define`, `static_cast` au lieu des casts
  C, `nullptr` au lieu de `NULL`. Et `malloc` n'appelle pas les constructeurs. »
cards:
  - key: malloc
    format: course
    question: "Pourquoi n'alloue-t-on pas un objet d'une classe avec `malloc` en C++ ?"
    choices:
      - {text: "`malloc` réserve la mémoire sans appeler le constructeur : il n'y a pas d'objet", correct: true}
      - {text: "`malloc` n'existe pas en C++ : le compilateur refuse son appel", correct: false}
      - {text: "`malloc` alloue sur la pile, alors qu'un objet doit vivre sur le tas", correct: false}
      - {text: "`malloc` appelle le constructeur deux fois, ce qui fausse l'objet", correct: false}
    answer: "De même, `free` n'appelle pas le destructeur. Pour une `std::string` ou toute classe à constructeur, le résultat est un comportement indéfini."
  - key: define
    format: course
    question: "Par quoi remplace-t-on `#define TAILLE 100` en C++ ?"
    choices:
      - {text: "Par `constexpr int taille = 100;`, qui a un type et une portée", correct: true}
      - {text: "Par `int taille = 100;`, modifiable partout dans le programme", correct: false}
      - {text: "Par `#include TAILLE 100`, traité par le préprocesseur", correct: false}
      - {text: "Par `typedef 100 taille;`, qui nomme la valeur", correct: false}
    answer: "Une macro est un remplacement de texte, sans type, qui ignore les espaces de noms et les portées. Une constante `constexpr` est vérifiée par le compilateur, et visible du débogueur."
  - key: casts
    format: course
    question: "Pourquoi préfère-t-on `static_cast<int>(x)` au cast du C `(int)x` ?"
    choices:
      - {text: "Il dit quelle conversion on veut, et refuse celles qui sont dangereuses", correct: true}
      - {text: "Il s'exécute plus vite que le cast du C", correct: false}
      - {text: "Il arrondit au plus proche, alors que le cast du C tronque", correct: false}
      - {text: "Il vérifie la conversion pendant l'exécution du programme", correct: false}
    answer: "Le cast du C essaie tout, jusqu'à retirer un `const` ou réinterpréter des octets, sans rien signaler. Les casts nommés du C++ séparent ces intentions, et se repèrent dans le code."
  - key: incompatibilite
    format: course
    question: "Pourquoi `int* p = malloc(sizeof(int));` compile-t-il en C, mais pas en C++ ?"
    choices:
      - {text: "C++ ne convertit pas implicitement un `void*` en un autre type de pointeur", correct: true}
      - {text: "C++ n'a pas d'opérateur `sizeof`", correct: false}
      - {text: "C++ interdit de déclarer un pointeur vers un `int`", correct: false}
      - {text: "C++ exige que `malloc` soit suivi de `free` sur la même ligne", correct: false}
    answer: "`malloc` renvoie un `void*`. En C++, il faudrait un cast explicite, ce qui rappelle que ce n'est pas la bonne façon d'allouer."
  - key: vf-sur-ensemble
    format: true-false
    question: "Tout programme C valide est aussi un programme C++ valide."
    truth: false
    answer: "Presque, mais pas tout : la conversion implicite depuis `void*`, les littéraux de chaîne non constants ou les mots-clés ajoutés font échouer du code C."
  - key: vf-nullptr
    format: true-false
    question: "En C++, on écrit `nullptr` plutôt que `NULL`."
    truth: true
    answer: "`NULL` est un entier, `0` : il peut choisir la surcharge `f(int)` au lieu de `f(int*)`. `nullptr` a son propre type de pointeur."
  - key: vf-en-tetes
    format: true-false
    question: "En C++, l'en-tête C `<string.h>` s'inclut de préférence sous le nom `<cstring>`."
    truth: true
    answer: "Les en-têtes du C ont une version préfixée par `c`, sans `.h`, qui place leurs fonctions dans `std`."
  - key: vf-bibliotheque-c
    format: true-false
    question: "Un programme C++ ne peut pas appeler les fonctions d'une bibliothèque écrite en C."
    truth: false
    answer: "Il le peut directement : on déclare ces fonctions dans un bloc `extern \"C\"`. C'est l'une des raisons du succès du langage."
  - key: qcm-chaine
    format: multiple-choice
    question: "Par quoi remplace-t-on, en C++, un `char*` manipulé avec `strcpy` et `strlen` ?"
    choices:
      - {text: "`std::string`", correct: true}
      - {text: "`std::array<int, 10>`", correct: false}
      - {text: "`void*`", correct: false}
      - {text: "`char**`", correct: false}
    answer: "`std::string` connaît sa taille, grandit seule et libère sa mémoire. `strcpy` dans un tampon trop petit est le dépassement classique."
  - key: qcm-extern-c
    format: multiple-choice
    question: "Comment déclare-t-on, en C++, les fonctions d'une bibliothèque C ?"
    choices:
      - {text: "Dans un bloc `extern \"C\" { ... }`", correct: true}
      - {text: "Dans un bloc `namespace C { ... }`", correct: false}
      - {text: "Avec le mot-clé `virtual` devant chacune", correct: false}
      - {text: "Avec `#pragma once` en tête de l'en-tête", correct: false}
    answer: "`extern \"C\"` désactive la décoration des noms : l'éditeur de liens cherche alors le symbole tel que le compilateur C l'a produit."
  - key: qcm-tableau
    format: multiple-choice
    question: "Une fonction C reçoit `(int* tableau, int taille)`. Quel paramètre C++ transporte les deux ensemble ?"
    choices:
      - {text: "`std::span<int>`", correct: true}
      - {text: "`void*`", correct: false}
      - {text: "`int&`", correct: false}
      - {text: "`char*`", correct: false}
    answer: "`std::span` (C++20) est une vue : un pointeur et une taille, construite depuis un tableau, un `std::array` ou un `std::vector`."
  - key: qcm-macro-fonction
    format: multiple-choice
    question: "Par quoi remplace-t-on la macro `#define CARRE(x) ((x) * (x))` ?"
    choices:
      - {text: "Par une fonction `constexpr`, ou un template", correct: true}
      - {text: "Par une variable globale nommée `CARRE`", correct: false}
      - {text: "Par un `typedef` nommé `CARRE`", correct: false}
      - {text: "Par une seconde macro, qui appelle la première", correct: false}
    answer: "`CARRE(i++)` incrémente `i` deux fois : la macro recopie son argument. Une fonction l'évalue une seule fois, vérifie son type, et le compilateur la met en ligne."
  - key: bug-malloc
    format: bug-fix
    question: |-
      Ce programme alloue une `std::string` avec `malloc`, sans la construire. Son comportement est indéfini.
      Quelle correction est la bonne ?
      ```cpp
      #include <cstdlib>
      #include <print>
      #include <string>

      int main() {
          auto* nom = static_cast<std::string*>(std::malloc(sizeof(std::string)));
          *nom = "Ada Lovelace, mathématicienne";
          std::println("{}", *nom);
          std::free(nom);
      }
      ```
    choices:
      - {text: "Déclarer `std::string nom = \"Ada Lovelace, mathématicienne\";`, sans `malloc` ni `free`", correct: true}
      - {text: "Allouer `2 * sizeof(std::string)` octets, pour laisser de la place au texte", correct: false}
      - {text: "Appeler `std::free(nom);` avant d'afficher la chaîne", correct: false}
      - {text: "Remplacer `static_cast` par un cast du C, `(std::string*)`", correct: false}
    answer: |-
      ```cpp
      std::string nom = "Ada Lovelace, mathématicienne";
      std::println("{}", nom);
      ```
      `malloc` ne construit rien : l'affectation écrit dans une chaîne qui n'existe pas. Une variable locale est
      construite, puis détruite et libérée à la fin de sa portée.
  - key: bug-strcpy
    format: bug-fix
    question: |-
      Ce programme copie un texte de vingt-trois caractères dans un tampon de huit : il écrit hors du tableau. Quelle
      correction est la bonne ?
      ```cpp
      #include <cstring>
      #include <print>

      int main() {
          char tampon[8];
          std::strcpy(tampon, "un texte bien trop long");
          std::println("{}", tampon);
      }
      ```
    choices:
      - {text: "Écrire `std::string texte = \"un texte bien trop long\";`, et l'afficher", correct: true}
      - {text: "Écrire `std::strcat` à la place de `std::strcpy`", correct: false}
      - {text: "Écrire `char* tampon;` à la place de `char tampon[8];`", correct: false}
      - {text: "Écrire `std::strlen(tampon)` avant la copie", correct: false}
    answer: |-
      ```cpp
      std::string texte = "un texte bien trop long";
      std::println("{}", texte);
      ```
      `strcpy` ne connaît pas la taille de sa destination : c'est le dépassement de tampon classique. `std::string`
      alloue ce qu'il faut.
  - key: bug-macro
    format: bug-fix
    question: |-
      Ce programme devrait afficher `9`, le carré de `1 + 2`. Il affiche `5`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      #define CARRE(x) x * x

      int main() {
          std::println("{}", CARRE(1 + 2));
      }
      ```
    choices:
      - {text: "Écrire une fonction `constexpr int carre(int x) { return x * x; }`", correct: true}
      - {text: "Écrire `#define CARRE(x) x * x;`, avec un point-virgule", correct: false}
      - {text: "Écrire `#define CARRE x * x`, sans paramètre", correct: false}
      - {text: "Écrire `CARRE(1 + 2.0)` à l'appel", correct: false}
    answer: |-
      ```cpp
      constexpr int carre(int x) { return x * x; }
      ```
      Le préprocesseur remplace du texte : `1 + 2 * 1 + 2` vaut 5. Une fonction reçoit une valeur, déjà calculée.
      Des parenthèses dans la macro corrigeraient ce cas, pas `CARRE(i++)`.
  - key: bug-null
    format: bug-fix
    question: |-
      Le compilateur répond « call of overloaded 'afficher(NULL)' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <cstddef>
      #include <print>

      void afficher(int) {
          std::println("entier");
      }

      void afficher(const char*) {
          std::println("pointeur");
      }

      int main() {
          afficher(NULL);
      }
      ```
    choices:
      - {text: "Appeler `afficher(nullptr);`", correct: true}
      - {text: "Appeler `afficher(0);`, pour désigner le pointeur", correct: false}
      - {text: "Appeler `afficher('\\0');`", correct: false}
      - {text: "Appeler `afficher(NULL, NULL);`", correct: false}
    answer: |-
      ```cpp
      afficher(nullptr);
      ```
      `NULL` est une constante entière : le compilateur hésite entre les deux surcharges. `nullptr` a un type de
      pointeur, et choisit `afficher(const char*)`. `afficher(0)` appellerait la version `int`.
  - key: situation-venu-du-c
    format: scenario
    question: |-
      Un développeur venu du C écrit un module avec des `struct`, des fonctions `liste_creer` et
      `liste_detruire`, et des `malloc`. Les appelants oublient parfois `liste_detruire`. Que lui proposes-tu ?
    choices:
      - {text: "Une classe dont le constructeur acquiert et le destructeur libère, ou tout simplement `std::vector`", correct: true}
      - {text: "Un commentaire au-dessus de `liste_creer`, qui rappelle d'appeler `liste_detruire`", correct: false}
      - {text: "Une macro `LISTE_FIN` que chaque appelant écrit à la fin de sa fonction", correct: false}
      - {text: "Une variable globale qui compte les listes encore en vie", correct: false}
    answer: |-
      La paire `creer`/`detruire` repose sur la discipline de l'appelant. Le destructeur est appelé par le
      compilateur, à toute sortie de portée : l'oubli devient impossible. C'est RAII, l'idée centrale que C n'a
      pas.
  - key: situation-bibliotheque-c
    format: scenario
    question: |-
      Ton programme C++ doit utiliser une bibliothèque C qui fournit `ouvrir()`, renvoyant un `Poignee*`, et
      `fermer(Poignee*)`. Comment l'intègres-tu proprement ?
    choices:
      - {text: "Une petite classe RAII, ou un `std::unique_ptr` dont le destructeur appelle `fermer`", correct: true}
      - {text: "Des appels directs à `ouvrir` et `fermer` partout dans le programme", correct: false}
      - {text: "Une réécriture complète de la bibliothèque en C++", correct: false}
      - {text: "Un `delete` sur la `Poignee*`, à la place de `fermer`", correct: false}
    answer: |-
      On garde la bibliothèque, et l'on confine son style à une frontière étroite. La poignée est fermée dans un
      destructeur, donc aussi en cas d'exception. `delete` sur une ressource que `ouvrir` a créée à sa façon
      serait un comportement indéfini.
  - key: situation-printf
    format: scenario
    question: |-
      Un programme affiche un identifiant avec `printf("%d\n", id);`. Le type de `id` passe de `int` à
      `std::string`, et le programme affiche n'importe quoi, sans erreur de compilation. Que proposes-tu ?
    choices:
      - {text: "`std::println(\"{}\", id);` : le modèle est vérifié contre le type de l'argument", correct: true}
      - {text: "`printf(\"%s\\n\", id);` : `%s` accepte directement une `std::string`", correct: false}
      - {text: "`printf(\"%d\\n\", (int)id);` : le cast rétablit le bon type", correct: false}
      - {text: "`puts(id);` : `puts` accepte tous les types", correct: false}
    answer: |-
      `printf` fait confiance à son modèle : un `%d` devant une `std::string` est un comportement indéfini. `%s`
      attend un `char*`, pas une `std::string`. `std::print` déduit la mise en forme du type, et refuse à la
      compilation ce qui ne convient pas.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, tu lis `Client* c = (Client*)donnees;`, où `donnees` est un `void*` reçu d'une fonction
      générique. Rien ne garantit que ce soit bien un `Client`. Que proposes-tu ?
    choices:
      - {text: "Un template, ou un `std::variant` : le type réel est alors connu et vérifié", correct: true}
      - {text: "Un `static_cast<Client*>(donnees)`, qui vérifie le type à l'exécution", correct: false}
      - {text: "Un second cast, `(Client*)(void*)donnees`, plus explicite", correct: false}
      - {text: "Un commentaire qui précise que `donnees` désigne toujours un `Client`", correct: false}
    answer: |-
      `void*` efface le type : le compilateur ne peut plus rien vérifier, et aucun cast ne le retrouve. C'est la
      généricité du C. Celle du C++ garde le type : un template quand il est connu à la compilation, un
      `std::variant` quand il est choisi à l'exécution.
