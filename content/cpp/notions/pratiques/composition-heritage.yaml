notion: composition-heritage
lesson: |-
  Deux façons de réutiliser une classe dans une autre.

  - L'**héritage** dit « **est un** » : un `Cercle` est une `Forme`.
  - La **composition** dit « **a un** » : une `Voiture` a un `Moteur`, rangé comme membre.

  ```cpp
  class Voiture : public Moteur { ... };   // héritage : une voiture EST un moteur ?

  class Voiture {                          // composition : une voiture A un moteur
      Moteur moteur_;
  };
  ```

  Le conseil classique, « **préférer la composition à l'héritage** », ne bannit pas l'héritage : il demande de ne
  pas s'en servir par simple commodité.

  **Ce que coûte l'héritage public.**

  - C'est le **couplage le plus fort** du langage, après l'amitié : la classe dérivée dépend de l'interface de la
    base, mais aussi de ses membres protégés et de son comportement interne.
  - Elle **hérite de tout** : chaque fonction publique de la base devient une fonction de la dérivée, qu'elle ait
    un sens ou non.
  - Elle s'engage à pouvoir **remplacer** la base partout (principe de substitution de Liskov). Si ce n'est pas
    vrai, le code qui manipule la base se trompe.
  - La relation est **figée** à la compilation.

  **L'exemple classique.** Une `Pile` qui hérite de `std::vector<int>` pour récupérer `push_back`. Elle expose
  alors aussi `insert`, `operator[]` et `erase` : n'importe qui peut modifier le milieu de la pile. Avec un
  vecteur en **membre privé**, elle n'expose que `empiler`, `depiler` et `sommet`.

  ```cpp
  class Pile {
  public:
      void empiler(int v) { elements_.push_back(v); }
      void depiler() { elements_.pop_back(); }
      int sommet() const { return elements_.back(); }
  private:
      std::vector<int> elements_;
  };
  ```

  De plus, les conteneurs standard n'ont **pas de destructeur virtuel** : ils ne sont pas faits pour servir de
  classe de base.

  **Ce qu'apporte la composition.**

  - Une interface **choisie** : on n'expose que ce qui a un sens.
  - Un couplage **faible** : on ne dépend que de l'interface publique du membre.
  - De la **souplesse** : le membre peut être remplacé, même à l'exécution, s'il est tenu par un pointeur vers
    une interface.
  - Des tests plus simples : on substitue un composant factice.

  **Quand l'héritage est le bon outil.**

  - Pour le **polymorphisme** : une interface abstraite, plusieurs implémentations, manipulées par un pointeur ou
    une référence de base.
  - Quand la relation « est un » est **vraie** : tout ce qu'on peut faire avec la base a un sens avec la dérivée.

  **Le test.** « Puis-je passer un objet dérivé à **toute** fonction qui attend la base, sans surprise ? » Si
  non, c'est une composition.

  **Hériter pour réutiliser du code, sans « est un ».** Si l'on y tient, l'héritage **privé** n'expose rien de la
  base ; mais un membre fait presque toujours mieux.

  **En entretien** : « L'héritage public modélise "est un" et sert au polymorphisme ; pour réutiliser du code, je
  compose : un membre privé, et une interface que je choisis. L'héritage couple fortement, expose toute la base,
  et engage à la substituabilité. »
cards:
  - key: est-un-a-un
    format: course
    question: "Quelle relation la composition exprime-t-elle entre deux classes ?"
    choices:
      - {text: "« A un » : un objet contient l'autre, comme membre", correct: true}
      - {text: "« Est un » : un objet peut remplacer l'autre partout", correct: false}
      - {text: "« Dépend de » : un objet appelle les fonctions globales de l'autre", correct: false}
      - {text: "« Ressemble à » : deux objets ont les mêmes noms de fonctions", correct: false}
    answer: "Une voiture a un moteur : `Moteur` est un membre de `Voiture`. « Est un » est la relation de l'héritage public."
  - key: cout-heritage
    format: course
    question: "Pourquoi dit-on que l'héritage public crée un couplage fort ?"
    choices:
      - {text: "La classe dérivée reçoit toute l'interface de la base, et dépend de son fonctionnement interne", correct: true}
      - {text: "La classe dérivée est copiée dans la classe de base à chaque appel de fonction", correct: false}
      - {text: "La classe de base doit connaître la liste de toutes ses classes dérivées", correct: false}
      - {text: "La classe dérivée ne peut plus avoir de membres qui lui soient propres", correct: false}
    answer: "Toute fonction publique de la base devient une fonction de la dérivée, et un changement dans la base peut casser ses dérivées. Un membre, lui, ne s'utilise que par son interface publique."
  - key: quand-heriter
    format: course
    question: "Dans quel cas l'héritage public est-il le bon choix ?"
    choices:
      - {text: "Quand la dérivée peut remplacer la base partout, par exemple pour le polymorphisme", correct: true}
      - {text: "Quand on veut récupérer deux ou trois fonctions d'une classe existante", correct: false}
      - {text: "Quand deux classes ont un membre de même nom", correct: false}
      - {text: "Quand on veut éviter d'écrire un constructeur", correct: false}
    answer: "Une interface abstraite et ses implémentations : c'est le terrain de l'héritage. Pour récupérer du code, un membre suffit."
  - key: conteneur-base
    format: course
    question: "Pourquoi ne fait-on pas hériter une classe de `std::vector` ?"
    choices:
      - {text: "Elle exposerait toutes ses fonctions, et `std::vector` n'a pas de destructeur virtuel", correct: true}
      - {text: "Le compilateur refuse qu'une classe hérite d'un type de la bibliothèque standard", correct: false}
      - {text: "Une classe dérivée de `std::vector` ne pourrait plus contenir d'éléments", correct: false}
      - {text: "`std::vector` est un template, et un template ne peut pas être une classe de base", correct: false}
    answer: "Le code compile, mais la classe ne maîtrise plus son interface, et la détruire par un pointeur de base est un comportement indéfini. On range le vecteur en membre privé."
  - key: vf-interdit
    format: true-false
    question: "« Préférer la composition à l'héritage » veut dire qu'il ne faut jamais utiliser l'héritage."
    truth: false
    answer: "Le conseil vise l'héritage de commodité. Pour le polymorphisme et une vraie relation « est un », l'héritage reste l'outil."
  - key: vf-interface-choisie
    format: true-false
    question: "Avec la composition, la classe choisit quelles fonctions de son membre elle expose."
    truth: true
    answer: "Le membre est privé : seules les fonctions que la classe écrit sont visibles de l'extérieur."
  - key: vf-carre-rectangle
    format: true-false
    question: "Une classe `Carre` qui hérite d'un `Rectangle` à largeur et hauteur modifiables respecte le principe de substitution."
    truth: false
    answer: "Une fonction qui fixe la largeur d'un `Rectangle` sans toucher à sa hauteur est surprise par un `Carre`. La relation « est un » des mathématiques ne tient pas pour des objets modifiables."
  - key: vf-heritage-prive
    format: true-false
    question: "L'héritage privé n'expose pas l'interface de la base aux utilisateurs de la classe dérivée."
    truth: true
    answer: "Les membres publics de la base deviennent privés dans la dérivée. C'est une forme de composition, qu'un membre exprime plus simplement."
  - key: qcm-pile
    format: multiple-choice
    question: "Comment écris-tu une classe `Pile` qui s'appuie sur `std::vector<int>` ?"
    choices:
      - {text: "Avec un membre privé `std::vector<int>`, et les fonctions `empiler`, `depiler`, `sommet`", correct: true}
      - {text: "En héritant publiquement de `std::vector<int>`, pour récupérer `push_back`", correct: false}
      - {text: "En héritant de `std::vector<int>`, puis en supprimant `insert` avec `= delete`", correct: false}
      - {text: "Avec un `std::vector<int>` global, partagé par toutes les piles", correct: false}
    answer: "La pile n'expose que ses propres opérations. C'est d'ailleurs ainsi que `std::stack` est écrite : un adaptateur autour d'un conteneur membre."
  - key: qcm-test
    format: multiple-choice
    question: "Quelle question décide entre héritage public et composition ?"
    choices:
      - {text: "« Un objet dérivé peut-il remplacer la base partout, sans surprise ? »", correct: true}
      - {text: "« Les deux classes sont-elles dans le même fichier ? »", correct: false}
      - {text: "« La classe de base a-t-elle plus de trois fonctions ? »", correct: false}
      - {text: "« Les deux classes ont-elles été écrites par la même personne ? »", correct: false}
    answer: "C'est le principe de substitution de Liskov. Si la réponse est non, la relation n'est pas « est un »."
  - key: qcm-souplesse
    format: multiple-choice
    question: "Une classe `Journal` doit pouvoir écrire dans un fichier ou sur le réseau, au choix à l'exécution. Quelle conception convient ?"
    choices:
      - {text: "Un membre `std::unique_ptr<Sortie>`, où `Sortie` est une interface abstraite", correct: true}
      - {text: "Deux classes `JournalFichier` et `JournalReseau`, qui recopient le code de `Journal`", correct: false}
      - {text: "Une classe `Journal` qui hérite à la fois de `Fichier` et de `Reseau`", correct: false}
      - {text: "Une macro qui choisit la sortie au moment de la compilation", correct: false}
    answer: "La composition avec une interface : le journal a une sortie, qu'on lui donne à la construction. L'héritage sert ici entre `Sortie` et ses implémentations, pas pour `Journal`."
  - key: qcm-liskov
    format: multiple-choice
    question: "Que demande le principe de substitution de Liskov ?"
    choices:
      - {text: "Qu'un objet d'une classe dérivée puisse remplacer un objet de la base sans casser le code", correct: true}
      - {text: "Qu'une classe n'ait qu'une seule classe de base", correct: false}
      - {text: "Qu'une classe dérivée ne redéfinisse aucune fonction de la base", correct: false}
      - {text: "Qu'une classe de base ne contienne aucune donnée", correct: false}
    answer: "Tout ce que le code attend de la base doit rester vrai avec la dérivée. C'est ce qui rend le polymorphisme fiable."
  - key: situation-reutilisation
    format: scenario
    question: |-
      Tu écris une classe `Rapport` qui a besoin de formater des dates. Une classe `Calendrier` sait le faire. Un
      collègue propose `class Rapport : public Calendrier`. Que réponds-tu ?
    choices:
      - {text: "Qu'un rapport n'est pas un calendrier : il en utilise un, comme membre ou comme paramètre", correct: true}
      - {text: "Que c'est la bonne solution : l'héritage est fait pour réutiliser du code", correct: false}
      - {text: "Qu'il faut plutôt faire hériter `Calendrier` de `Rapport`", correct: false}
      - {text: "Qu'il faut recopier dans `Rapport` les fonctions utiles de `Calendrier`", correct: false}
    answer: |-
      Avec l'héritage, `Rapport` exposerait `jour_suivant()` et tout le reste, et pourrait être passé à toute
      fonction qui attend un calendrier. Un membre `Calendrier` donne la même réutilisation, sans rien exposer.
  - key: situation-hierarchie-profonde
    format: scenario
    question: |-
      Un jeu a une hiérarchie `Entite` → `Personnage` → `Ennemi` → `EnnemiVolant` → `EnnemiVolantArme`. Il faut
      maintenant un allié volant et armé, et rien ne se réutilise sans dupliquer. Que proposes-tu ?
    choices:
      - {text: "Composer : une entité possède des composants comme `Vol` et `Arme`, qu'on assemble", correct: true}
      - {text: "Ajouter un sixième niveau à la hiérarchie, `AllieVolantArme`", correct: false}
      - {text: "Faire hériter `Allie` de `EnnemiVolantArme`, et inverser son camp", correct: false}
      - {text: "Recopier le code du vol et de l'arme dans la classe `Allie`", correct: false}
    answer: |-
      Voler et être armé sont des capacités indépendantes : une hiérarchie les fige dans un seul ordre. En
      composants, chaque entité prend ceux dont elle a besoin, et les combinaisons ne multiplient plus les classes.
  - key: situation-base-fragile
    format: scenario
    question: |-
      Une classe `CompteurAjouts` hérite d'un conteneur maison, et redéfinit `ajouter` pour compter. Après une mise
      à jour, `ajouter_tous` de la base n'appelle plus `ajouter`, et le compteur devient faux. Quelle leçon en
      tires-tu ?
    choices:
      - {text: "La dérivée dépendait d'un détail interne de la base : enveloppée en membre, elle n'en dépendrait pas", correct: true}
      - {text: "La classe de base ne doit plus jamais être modifiée après sa première version", correct: false}
      - {text: "La fonction `ajouter` doit être déclarée `static` dans la classe dérivée", correct: false}
      - {text: "La classe dérivée doit hériter en `protected` plutôt qu'en `public`", correct: false}
    answer: |-
      C'est le problème de la classe de base fragile : hériter, c'est dépendre de la façon dont la base
      s'appelle elle-même. En composant, la classe fait le comptage dans ses propres fonctions, puis délègue : ce
      que fait le conteneur en interne ne la concerne plus.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Faut-il toujours préférer la composition à l'héritage ? » Quelle réponse est
      la plus juste ?
    choices:
      - {text: "Par défaut, oui pour réutiliser du code ; l'héritage reste l'outil du polymorphisme", correct: true}
      - {text: "Oui, toujours : l'héritage est une erreur de conception du langage", correct: false}
      - {text: "Non, jamais : l'héritage est plus rapide que la composition", correct: false}
      - {text: "Cela dépend seulement du nombre de lignes de la classe de base", correct: false}
    answer: |-
      La question est celle de la relation. « A un », ou simple réutilisation : un membre. « Est un », avec
      substitution possible partout : une classe de base, le plus souvent abstraite.
