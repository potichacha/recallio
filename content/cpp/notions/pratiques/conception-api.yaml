notion: conception-api
lesson: |-
  Le principe, formulé par Scott Meyers : une interface doit être **facile à utiliser correctement, et difficile à
  utiliser mal**. L'idée est de faire **vérifier par le compilateur** ce qu'on mettrait sinon dans la
  documentation.

  **1. Rendre les erreurs impossibles à écrire.**

  - Des **types forts** plutôt que des entiers nus : `Date{Jour{3}, Mois{12}, Annee{2026}}` ne peut pas être
    inversée.
  - Des constructeurs **`explicit`** : pas de conversion surprise.
  - `enum class` plutôt que `bool` : `ouvrir(chemin, Mode::Lecture)`.
  - **Pas d'état invalide** : un objet construit est utilisable. Pas de fonction `init()` à appeler après le
    constructeur, que l'utilisateur oubliera.

  **2. Rendre les oublis visibles.**

  - **`[[nodiscard]]`** sur les fonctions dont le résultat ne doit pas être ignoré : code d'erreur, nouvelle
    valeur, ressource.
  - Renvoyer **`std::optional`** ou **`std::expected`** plutôt qu'une valeur sentinelle (`-1`, `nullptr`) : le
    type oblige à traiter l'absence.

  **3. Dire qui possède quoi.**

  | Signature | Ce qu'elle annonce |
  |---|---|
  | `void f(const T&)` | je lis |
  | `void f(T&)` | je modifie |
  | `void f(std::unique_ptr<T>)` | je prends possession |
  | `std::unique_ptr<T> creer()` | tu deviens propriétaire |
  | `T* trouver()` | je te prête, et ce peut être nul |

  Un pointeur brut renvoyé par `new`, que l'appelant doit penser à `delete`, est l'exemple même de l'interface
  facile à mal utiliser.

  **4. Être cohérent et prévisible.**

  - Suivre les **conventions de la bibliothèque standard** : `size()`, `empty()`, `begin()`, `end()`. Un type qui
    les respecte fonctionne avec les algorithmes et la boucle sur un intervalle.
  - Le **même ordre** de paramètres d'une fonction à l'autre ; les mêmes noms pour les mêmes choses.
  - Le **principe de moindre surprise** : une fonction nommée `taille()` ne modifie rien.

  **5. Rester petit.**

  - Une interface **minimale** : chaque fonction publique est une promesse à tenir pour toujours. Ce qui n'est
    pas nécessaire reste privé.
  - Des fonctions **libres** pour ce qui n'a pas besoin d'accéder aux membres privés : la classe reste petite.
  - Peu de paramètres. Au-delà de trois ou quatre, une **`struct` d'options** aux champs nommés.

  **6. Penser à l'appelant d'abord.** Écrire le **code d'appel** (ou le test) avant l'implémentation montre tout
  de suite si l'interface se lit bien.

  **En entretien** : « Une bonne interface est difficile à mal utiliser : types forts et `explicit` contre les
  inversions, `[[nodiscard]]` et `std::optional` contre les oublis, pointeurs intelligents pour dire la
  possession, pas d'état invalide après construction, et les conventions de la bibliothèque standard. »
cards:
  - key: principe
    format: course
    question: "Quel principe guide la conception d'une interface ?"
    choices:
      - {text: "La rendre facile à utiliser correctement, et difficile à utiliser mal", correct: true}
      - {text: "La rendre aussi riche que possible, avec une fonction pour chaque besoin imaginable", correct: false}
      - {text: "La rendre aussi courte à taper que possible, quitte à être ambiguë", correct: false}
      - {text: "La rendre identique à l'implémentation, sans rien cacher à l'appelant", correct: false}
    answer: "L'usage correct doit être le plus naturel, et l'usage fautif ne pas compiler, ou au moins se voir."
  - key: etat-invalide
    format: course
    question: "Pourquoi évite-t-on une fonction `init()` à appeler après le constructeur ?"
    choices:
      - {text: "Entre les deux, l'objet existe dans un état invalide, et l'appelant peut oublier `init()`", correct: true}
      - {text: "Une fonction nommée `init` est réservée par le langage C++", correct: false}
      - {text: "Un constructeur ne peut pas être suivi d'un appel de fonction membre", correct: false}
      - {text: "Deux appels au lieu d'un rendent le programme deux fois plus lent", correct: false}
    answer: "Un constructeur doit laisser un objet utilisable. L'initialisation en deux temps repose sur la mémoire de l'appelant."
  - key: nodiscard
    format: course
    question: "À quoi sert `[[nodiscard]]` sur une fonction d'une interface ?"
    choices:
      - {text: "À faire avertir le compilateur quand l'appelant ignore la valeur renvoyée", correct: true}
      - {text: "À interdire à l'appelant de ranger la valeur renvoyée dans une variable", correct: false}
      - {text: "À empêcher la fonction de lancer une exception", correct: false}
      - {text: "À rendre la fonction invisible hors de son fichier", correct: false}
    answer: "Un code d'erreur ou une nouvelle valeur ignorés sont presque toujours un bug. L'attribut rend l'oubli visible."
  - key: minimal
    format: course
    question: "Pourquoi garder une interface publique aussi petite que possible ?"
    choices:
      - {text: "Chaque fonction publique est une promesse qu'il faudra tenir pour ses utilisateurs", correct: true}
      - {text: "Le compilateur limite une classe à dix fonctions publiques", correct: false}
      - {text: "Une fonction publique s'exécute plus lentement qu'une fonction privée", correct: false}
      - {text: "Les fonctions publiques ne peuvent pas être testées", correct: false}
    answer: "Ce qui est public ne peut plus changer sans casser du code. Ce qui reste privé reste libre d'évoluer."
  - key: vf-sentinelle
    format: true-false
    question: "Renvoyer `-1` pour « non trouvé » oblige l'appelant à traiter ce cas."
    truth: false
    answer: "Rien ne l'y oblige : `-1` est un `int` comme un autre. `std::optional` met l'absence dans le type."
  - key: vf-conventions
    format: true-false
    question: "Un conteneur maison qui fournit `begin()` et `end()` fonctionne avec la boucle sur un intervalle."
    truth: true
    answer: "Suivre les conventions de la bibliothèque standard rend un type utilisable par les outils du langage."
  - key: vf-new
    format: true-false
    question: "Une fonction qui renvoie un pointeur brut issu de `new` dit clairement qui doit le libérer."
    truth: false
    answer: "Le type `T*` n'en dit rien. `std::unique_ptr<T>` annonce le transfert de possession, et libère tout seul."
  - key: vf-options
    format: true-false
    question: "Au-delà de quelques paramètres, une `struct` d'options aux champs nommés rend l'appel plus lisible."
    truth: true
    answer: "Avec les initialiseurs désignés, `creer({.largeur = 800, .plein_ecran = true})` se lit sans la déclaration."
  - key: qcm-possession
    format: multiple-choice
    question: "Quelle signature de fabrique annonce que l'appelant devient propriétaire de l'objet ?"
    choices:
      - {text: "`std::unique_ptr<Forme> creer();`", correct: true}
      - {text: "`Forme* creer();`", correct: false}
      - {text: "`Forme& creer();`", correct: false}
      - {text: "`void creer(Forme** sortie);`", correct: false}
    answer: "Le type dit la possession, et la libération est automatique. Un pointeur ou une référence laissent le doute."
  - key: qcm-absence
    format: multiple-choice
    question: "Quel type de retour dit qu'une recherche peut ne rien trouver ?"
    choices:
      - {text: "`std::optional<Client>`", correct: true}
      - {text: "`Client`, vide si rien n'est trouvé", correct: false}
      - {text: "`int`, l'indice ou `-1`", correct: false}
      - {text: "`bool`, avec le client dans un paramètre de sortie", correct: false}
    answer: "`std::optional` force l'appelant à envisager l'absence, sans valeur magique ni paramètre de sortie."
  - key: qcm-fonction-libre
    format: multiple-choice
    question: "Où places-tu une fonction utilitaire qui n'a besoin que de l'interface publique d'une classe ?"
    choices:
      - {text: "Hors de la classe, en fonction libre dans le même espace de noms", correct: true}
      - {text: "Dans la classe, en fonction membre publique", correct: false}
      - {text: "Dans la classe, en fonction amie", correct: false}
      - {text: "Dans une classe dérivée créée pour l'occasion", correct: false}
    answer: "La classe reste petite, et moins de code dépend de ses détails privés."
  - key: qcm-demarche
    format: multiple-choice
    question: "Quelle démarche révèle le plus tôt une interface malcommode ?"
    choices:
      - {text: "Écrire le code d'appel, ou le test, avant l'implémentation", correct: true}
      - {text: "Écrire l'implémentation complète, puis la documentation", correct: false}
      - {text: "Écrire la documentation, sans jamais écrire d'exemple", correct: false}
      - {text: "Écrire toutes les fonctions imaginables, puis choisir", correct: false}
    answer: "En se plaçant du côté de l'appelant, on voit tout de suite ce qui est lourd, ambigu ou facile à inverser."
  - key: situation-init
    format: scenario
    question: |-
      Une classe `Connexion` a un constructeur sans paramètre et une fonction `ouvrir(adresse)`. Des plantages
      viennent d'appelants qui utilisent la connexion sans l'avoir ouverte. Que proposes-tu ?
    choices:
      - {text: "Un constructeur qui reçoit l'adresse et ouvre : un objet construit est une connexion ouverte", correct: true}
      - {text: "Un commentaire dans l'en-tête, qui rappelle d'appeler `ouvrir` d'abord", correct: false}
      - {text: "Un booléen `est_ouverte`, que chaque appelant doit tester avant chaque appel", correct: false}
      - {text: "Un `assert` dans `ouvrir`, qui vérifie que l'adresse n'est pas vide", correct: false}
    answer: |-
      L'état « construit mais pas ouvert » ne devrait pas exister. Si l'ouverture échoue, le constructeur lance, et
      aucun objet inutilisable n'est créé.
  - key: situation-erreur-ignoree
    format: scenario
    question: |-
      Une fonction `bool enregistrer(const Document&)` renvoie `false` en cas d'échec. La moitié des appelants ne
      regardent pas le résultat, et des documents sont perdus. Quelle est la plus petite amélioration ?
    choices:
      - {text: "Marquer la fonction `[[nodiscard]]` : ignorer le résultat devient un avertissement", correct: true}
      - {text: "Renommer la fonction `enregistrer_et_verifier_le_retour`", correct: false}
      - {text: "Renvoyer `int` à la place de `bool`", correct: false}
      - {text: "Écrire le résultat dans une variable globale", correct: false}
    answer: |-
      Avec `-Werror`, l'oubli ne compile plus. On peut aller plus loin avec une exception ou un `std::expected`,
      qui porte la cause.
  - key: situation-parametres
    format: scenario
    question: |-
      Tu dois appeler `envoyer(dest, sujet, corps, true, false, 3, 30)`. Tu dois ouvrir la déclaration pour savoir
      ce que valent les quatre derniers arguments. Que proposes-tu à l'auteur ?
    choices:
      - {text: "Une `struct` d'options aux champs nommés, avec des valeurs par défaut", correct: true}
      - {text: "Sept paramètres de plus, pour couvrir tous les cas", correct: false}
      - {text: "Des paramètres tous de type `int`, pour uniformiser", correct: false}
      - {text: "Une macro par combinaison d'arguments courante", correct: false}
    answer: |-
      `envoyer(dest, sujet, corps, {.urgent = true, .essais = 3})` se lit seul, et l'on ne précise que ce qui
      diffère du défaut.
  - key: situation-delete
    format: scenario
    question: |-
      Une bibliothèque offre `Image* charger(const char* chemin)`, et sa documentation dit : « l'appelant doit
      appeler `delete` ». Les fuites sont fréquentes chez ses utilisateurs. Comment corriges-tu l'interface ?
    choices:
      - {text: "Renvoyer `std::unique_ptr<Image>` : la possession est dans le type, la libération automatique", correct: true}
      - {text: "Écrire la consigne en majuscules dans la documentation", correct: false}
      - {text: "Renvoyer `Image&`, que l'appelant libère avec `delete &image`", correct: false}
      - {text: "Ajouter une fonction `liberer(Image*)`, à appeler à la place de `delete`", correct: false}
    answer: |-
      Une règle écrite dans la documentation sera oubliée. Le pointeur intelligent la fait respecter par le
      langage.
