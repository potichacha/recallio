notion: cpp-face-autres
lesson: |-
  En entretien, on te demandera souvent **pourquoi C++**, et non Rust, Go ou Java. La bonne réponse n'est ni la
  défense aveugle ni le dénigrement : chaque langage fait un **compromis** différent.

  **Ce qui distingue C++.**

  - **Aucun ramasse-miettes** : la mémoire est libérée à un instant précis, celui de la destruction (RAII). Pas de
    pause imprévisible.
  - **Des abstractions sans coût** : templates, fonctions `inline`, objets sur la pile. On ne paie pas ce qu'on
    n'utilise pas.
  - **Le contrôle** de la disposition de la mémoire, de l'allocation, des instructions du processeur.
  - **Un écosystème immense** : des décennies de bibliothèques, de moteurs, de compilateurs, pour toutes les
    plateformes.
  - **La compatibilité avec C**, et avec le code existant.

  Son prix : la **sûreté mémoire** est à la charge du programmeur, le langage est **vaste**, les temps de
  compilation longs, et l'outillage (construction, dépendances) n'est pas unifié.

  **Le tableau.**

  | | C++ | Rust | Go | Java |
  |---|---|---|---|---|
  | Gestion de la mémoire | RAII, manuelle | possession vérifiée à la compilation | ramasse-miettes | ramasse-miettes |
  | Sûreté mémoire | non garantie | garantie, hors `unsafe` | garantie | garantie |
  | Performances | maximales | comparables à C++ | bonnes | bonnes, après échauffement |
  | Pauses imprévisibles | non | non | courtes | selon le ramasse-miettes |
  | Courbe d'apprentissage | raide | raide | douce | moyenne |
  | Outillage unifié | non | oui (`cargo`) | oui (`go`) | oui (Maven, Gradle) |

  **Face à Rust.** Mêmes domaines, mêmes performances. Rust **prouve à la compilation** l'absence d'erreurs de
  mémoire et de courses aux données ; C++ compte sur la discipline et les outils. C++ garde l'avantage de
  l'**existant** : bases de code, bibliothèques, développeurs. Les deux coexistent, et s'appellent l'un l'autre.

  **Face à Go.** Go vise les **services réseau** : simple, compilé vite, concurrence intégrée. Son ramasse-miettes
  et son manque de contrôle fin l'écartent du temps réel dur et du calcul intensif.

  **Face à Java.** Java offre la **productivité** et un écosystème d'entreprise. La machine virtuelle impose un
  temps de démarrage, une empreinte mémoire plus grande et des pauses de ramasse-miettes.

  **Où C++ reste le bon choix.**

  - les **moteurs de jeu** et le rendu ;
  - la **finance à faible latence** ;
  - les **systèmes embarqués** et le temps réel ;
  - les **navigateurs**, bases de données, compilateurs, systèmes d'exploitation ;
  - le **calcul scientifique** et les bibliothèques d'apprentissage automatique (le cœur de celles qu'on pilote
    en Python) ;
  - tout projet qui s'appuie sur une **grande base de code C++** existante.

  **Où un autre langage convient mieux.** Un service web ordinaire, un outil d'administration, une application de
  gestion : le temps de développement compte plus que la microseconde.

  **En entretien** : « C++ donne le contrôle et des performances prévisibles, sans ramasse-miettes, avec un
  écosystème immense ; son prix est la sûreté mémoire, à ma charge. Rust offre les mêmes performances avec la
  sûreté vérifiée ; Go et Java privilégient la productivité. Je choisis selon les contraintes : latence, mémoire,
  existant, équipe. »
cards:
  - key: atouts
    format: course
    question: "Quel est l'atout principal de C++ face aux langages à ramasse-miettes ?"
    choices:
      - {text: "Le contrôle de la mémoire, libérée à un instant prévisible, sans pause", correct: true}
      - {text: "La garantie, par le compilateur, de l'absence d'erreur de mémoire", correct: false}
      - {text: "La simplicité du langage, qui s'apprend en quelques jours", correct: false}
      - {text: "Un gestionnaire de paquets officiel, livré avec le compilateur", correct: false}
    answer: "RAII libère les ressources à la destruction de l'objet. Aucun ramasse-miettes n'interrompt le programme à un moment imprévu."
  - key: rust
    format: course
    question: "Quelle est la principale différence entre Rust et C++ ?"
    choices:
      - {text: "Rust vérifie à la compilation la sûreté mémoire, que C++ laisse au programmeur", correct: true}
      - {text: "Rust utilise un ramasse-miettes, alors que C++ libère la mémoire à la main", correct: false}
      - {text: "Rust est interprété, alors que C++ est compilé en code machine", correct: false}
      - {text: "Rust est bien plus lent que C++, dans tous les domaines", correct: false}
    answer: "Les deux sont compilés, sans ramasse-miettes, et de performances comparables. Rust impose des règles de possession que son compilateur vérifie."
  - key: prix
    format: course
    question: "Quel est le prix du contrôle qu'offre C++ ?"
    choices:
      - {text: "La sûreté mémoire repose sur la discipline du programmeur et sur ses outils", correct: true}
      - {text: "Le programme est interrompu par un ramasse-miettes à intervalles réguliers", correct: false}
      - {text: "Le programme ne peut pas appeler de bibliothèque écrite en C", correct: false}
      - {text: "Le programme ne peut tourner que sur un seul système d'exploitation", correct: false}
    answer: "Accès hors bornes, pointeurs pendants, courses : rien ne les interdit. D'où l'importance de RAII, des pointeurs intelligents et des sanitizers."
  - key: choisir
    format: course
    question: "Sur quoi fonde-t-on le choix d'un langage pour un projet ?"
    choices:
      - {text: "Sur ses contraintes : latence, mémoire, code existant, compétences de l'équipe", correct: true}
      - {text: "Sur la popularité du langage dans les classements de l'année", correct: false}
      - {text: "Sur le langage que l'on préfère personnellement", correct: false}
      - {text: "Sur le langage le plus récent, toujours meilleur que les anciens", correct: false}
    answer: "Chaque langage est un compromis. Celui qui convient à un moteur de jeu n'est pas celui d'un service web ordinaire."
  - key: vf-garbage
    format: true-false
    question: "C++ libère la mémoire au moyen d'un ramasse-miettes."
    truth: false
    answer: "La mémoire est libérée par les destructeurs, à la sortie de portée. C'est le principe RAII."
  - key: vf-rust-perf
    format: true-false
    question: "Rust atteint des performances comparables à celles de C++."
    truth: true
    answer: "Tous deux compilent en code machine, sans ramasse-miettes, avec des abstractions sans coût."
  - key: vf-go
    format: true-false
    question: "Go est le choix habituel pour un système temps réel dur, à la microseconde près."
    truth: false
    answer: "Son ramasse-miettes introduit des pauses, courtes mais non maîtrisées. Go vise les services réseau."
  - key: vf-ecosysteme
    format: true-false
    question: "L'ampleur du code C++ existant est une raison de continuer à l'utiliser."
    truth: true
    answer: "Navigateurs, moteurs, bases de données : réécrire coûte trop cher. On étend ce qui existe, et l'on fait dialoguer les langages."
  - key: qcm-jeu
    format: multiple-choice
    question: "Pour quel projet C++ reste-t-il le choix le plus courant ?"
    choices:
      - {text: "Un moteur de jeu, qui doit tenir soixante images par seconde", correct: true}
      - {text: "Un script d'administration lancé une fois par mois", correct: false}
      - {text: "Un site vitrine de trois pages", correct: false}
      - {text: "Un prototype à montrer demain matin", correct: false}
    answer: "Le rendu demande un contrôle fin de la mémoire et aucune pause imprévue. Les trois autres projets valorisent d'abord la vitesse de développement."
  - key: qcm-service-web
    format: multiple-choice
    question: "Pour un service web ordinaire, sans contrainte de latence, quel atout pèse le plus ?"
    choices:
      - {text: "La productivité et la simplicité, où Go ou Java conviennent bien", correct: true}
      - {text: "Le contrôle de la disposition de la mémoire, octet par octet", correct: false}
      - {text: "L'absence totale de ramasse-miettes", correct: false}
      - {text: "La compatibilité avec le langage C", correct: false}
    answer: "Quand la microseconde ne compte pas, le temps de développement et la facilité d'exploitation priment."
  - key: qcm-outillage
    format: multiple-choice
    question: "Sur quel point C++ est-il en retrait face à Rust, Go et Java ?"
    choices:
      - {text: "L'outillage : pas de système de construction ni de gestionnaire de paquets unique", correct: true}
      - {text: "Les performances du code produit par le compilateur", correct: false}
      - {text: "Le nombre de plateformes et de processeurs pris en charge", correct: false}
      - {text: "Le nombre de bibliothèques disponibles pour le langage", correct: false}
    answer: "`cargo` et `go` sont livrés avec leur langage. En C++, il faut assembler CMake, un gestionnaire de dépendances et le reste."
  - key: qcm-python
    format: multiple-choice
    question: "Quel lien y a-t-il entre C++ et les bibliothèques d'apprentissage automatique pilotées en Python ?"
    choices:
      - {text: "Leur cœur de calcul est écrit en C++, et Python en est l'interface", correct: true}
      - {text: "Elles sont écrites en Python pur, sans aucune ligne de C++", correct: false}
      - {text: "Elles traduisent le code Python en C++ avant chaque exécution", correct: false}
      - {text: "Elles interdisent tout appel à du code compilé", correct: false}
    answer: "Python apporte la souplesse, C++ la vitesse du calcul. C'est un partage des rôles courant."
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Rust garantit la sûreté mémoire. Pourquoi écrire encore du C++ ? » Quelle
      réponse est la plus solide ?
    choices:
      - {text: "L'existant et l'écosystème pèsent lourd, et C++ moderne avec ses outils réduit beaucoup le risque", correct: true}
      - {text: "Rust est un effet de mode, qui aura disparu dans deux ans : inutile de s'y intéresser", correct: false}
      - {text: "C++ est tout aussi sûr que Rust pour la mémoire, sans aucun effort particulier", correct: false}
      - {text: "Rust est dix fois plus lent que C++ sur tous les programmes", correct: false}
    answer: |-
      Une réponse honnête reconnaît l'avantage de Rust, et situe celui de C++ : des milliards de lignes en
      service, des bibliothèques sans équivalent, des équipes formées. Les deux langages coexistent, souvent dans
      le même projet.
  - key: situation-latence
    format: scenario
    question: |-
      Un service de cotation doit répondre en moins de cinquante microsecondes, sans exception. Sa version Java
      tient la moyenne, mais dépasse parfois la limite de plusieurs millisecondes. Qu'est-ce qui l'explique ?
    choices:
      - {text: "Les pauses du ramasse-miettes, que C++ ou Rust n'ont pas", correct: true}
      - {text: "La lenteur du réseau, identique dans tous les langages", correct: false}
      - {text: "Le nombre de classes du programme, trop élevé en Java", correct: false}
      - {text: "La taille des entiers, différente en Java et en C++", correct: false}
    answer: |-
      Ce qui compte ici est le pire cas, pas la moyenne. Un langage sans ramasse-miettes libère la mémoire à des
      instants choisis : c'est la raison de la présence de C++ dans la finance à faible latence.
  - key: situation-nouvel-outil
    format: scenario
    question: |-
      Ton équipe doit écrire un petit service qui reçoit des requêtes HTTP et interroge une base. Aucune
      contrainte de performance. Un collègue propose C++ « parce que c'est le plus rapide ». Que réponds-tu ?
    choices:
      - {text: "Que la vitesse d'exécution n'est pas la contrainte ici : un langage plus simple livrera plus vite", correct: true}
      - {text: "Qu'il a raison : le langage le plus rapide est toujours le meilleur choix", correct: false}
      - {text: "Qu'il faut écrire le service en assembleur, plus rapide encore", correct: false}
      - {text: "Qu'aucun langage autre que C++ ne sait parler HTTP", correct: false}
    answer: |-
      Le service passera son temps à attendre le réseau et la base. Le coût dominant est celui du développement
      et de la maintenance : c'est le terrain de Go, de Java ou de Python.
  - key: situation-embarque
    format: scenario
    question: |-
      Un microcontrôleur de 64 Ko de mémoire doit piloter un moteur, avec des échéances fixes. On hésite entre Java
      et C++. Quel argument tranche ?
    choices:
      - {text: "C++ fonctionne sans machine virtuelle ni ramasse-miettes, avec une empreinte mémoire maîtrisée", correct: true}
      - {text: "Java s'exécute plus vite que C++ sur un petit processeur, grâce à sa machine virtuelle", correct: false}
      - {text: "C++ ne peut pas tourner sans système d'exploitation, contrairement à Java", correct: false}
      - {text: "Java occupe moins de mémoire que C++ au démarrage", correct: false}
    answer: |-
      Une machine virtuelle ne tient pas dans si peu de mémoire, et ses pauses sont incompatibles avec des
      échéances strictes. C et C++, comme Rust, s'exécutent directement sur le matériel.
