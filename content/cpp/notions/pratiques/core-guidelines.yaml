notion: core-guidelines
lesson: |-
  Les **C++ Core Guidelines** sont un recueil de règles pour écrire du C++ moderne, sûr et lisible. Lancées en
  2015 par **Bjarne Stroustrup** et **Herb Sutter**, elles sont publiques, gratuites, et tenues à jour sur GitHub
  (`isocpp/CppCoreGuidelines`). Ce n'est **pas la norme** : la norme dit ce qui est *permis*, les Guidelines ce
  qui est *recommandé*.

  **Leur forme.** Plusieurs centaines de règles, rangées par chapitres, chacune avec un identifiant, une
  justification, des exemples et, souvent, une façon de la **vérifier** par un outil.

  | Préfixe | Chapitre | Exemple de règle |
  |---|---|---|
  | `P` | Philosophie | P.1 : exprime tes idées directement dans le code |
  | `I` | Interfaces | I.11 : ne transfère jamais la possession par un pointeur brut |
  | `F` | Fonctions | F.16 : passe par valeur ce qui est petit, par `const&` le reste |
  | `C` | Classes | C.20 : si tu peux éviter d'écrire les opérations par défaut, fais-le (règle de zéro) |
  | `R` | Ressources | R.1 : gère les ressources automatiquement, par RAII |
  | `ES` | Expressions | ES.20 : initialise toujours un objet |
  | `E` | Erreurs | E.6 : utilise RAII pour éviter les fuites |
  | `CP` | Concurrence | CP.20 : utilise RAII, jamais `lock()` et `unlock()` à la main |

  **Leurs idées maîtresses.**

  - Exprimer l'**intention** dans le code et dans les types, pas dans les commentaires.
  - Préférer les erreurs de **compilation** aux erreurs d'exécution.
  - Ne pas **fuir** de ressource : RAII partout.
  - Un **pointeur brut ne possède rien** : il observe. La possession s'écrit `std::unique_ptr` ou
    `std::shared_ptr`.
  - Ne pas payer pour ce qu'on n'utilise pas.

  **La GSL** (*Guidelines Support Library*) est une petite bibliothèque d'en-têtes qui fournit les types dont les
  règles ont besoin. Microsoft en publie une implémentation (`microsoft/GSL`).

  | Type | Sens |
  |---|---|
  | `gsl::not_null<T*>` | un pointeur qui ne peut pas être nul : vérifié à la construction |
  | `gsl::owner<T*>` | un pointeur brut qui **possède** : une annotation pour le code ancien |
  | `gsl::span<T>` | une vue sur un tableau ; devenue `std::span` en C++20 |
  | `gsl::narrow<T>(x)` | une conversion qui vérifie qu'aucune valeur n'est perdue |
  | `Expects(cond)`, `Ensures(cond)` | préconditions et postconditions d'une fonction |

  **Les profils.** Certaines règles sont regroupées en **profils** (sûreté des types, des bornes, des durées de
  vie), conçus pour être vérifiés mécaniquement.

  **Les outils qui les appliquent.** **clang-tidy** a une famille de vérifications `cppcoreguidelines-*`, et
  l'analyseur de Visual Studio fait de même. C'est par eux qu'on adopte les Guidelines : règle par règle, en
  commençant par celles qui trouvent des bugs.

  **Comment s'en servir.** Ce sont des **recommandations argumentées**, pas une loi : chaque règle dit pourquoi,
  et admet des exceptions. Une équipe choisit celles qu'elle applique, et les fait vérifier par l'intégration
  continue plutôt qu'en relecture.

  **En entretien** : « Les Core Guidelines sont les recommandations de Stroustrup et Sutter pour le C++ moderne :
  RAII, pas de pointeur brut possédant, interfaces explicites. La GSL fournit les types d'appui, comme
  `not_null` ou `narrow`. Je les applique par clang-tidy, avec les vérifications `cppcoreguidelines`. »
cards:
  - key: nature
    format: course
    question: "Que sont les C++ Core Guidelines ?"
    choices:
      - {text: "Un recueil public de recommandations pour écrire du C++ moderne et sûr", correct: true}
      - {text: "Le texte officiel de la norme ISO du langage C++", correct: false}
      - {text: "Une bibliothèque de conteneurs qui remplace la bibliothèque standard", correct: false}
      - {text: "Un compilateur qui refuse le code non conforme à ses règles", correct: false}
    answer: "Elles ont été lancées en 2015 par Bjarne Stroustrup et Herb Sutter. La norme dit ce qui est permis ; les Guidelines, ce qui est conseillé."
  - key: gsl
    format: course
    question: "Qu'est-ce que la GSL ?"
    choices:
      - {text: "Une petite bibliothèque de types qui appuient les Core Guidelines", correct: true}
      - {text: "L'outil qui vérifie automatiquement les Core Guidelines", correct: false}
      - {text: "La liste des règles de style du projet GCC", correct: false}
      - {text: "Le comité qui vote les nouvelles normes du langage", correct: false}
    answer: "*Guidelines Support Library* : `gsl::not_null`, `gsl::owner`, `gsl::narrow`, `Expects` et `Ensures`. La vérification, elle, est faite par des outils comme clang-tidy."
  - key: pointeur-brut
    format: course
    question: "Que disent les Core Guidelines d'un pointeur brut `T*` ?"
    choices:
      - {text: "Qu'il ne possède pas ce qu'il désigne : il observe", correct: true}
      - {text: "Qu'il ne doit jamais apparaître dans un programme", correct: false}
      - {text: "Qu'il possède toujours ce qu'il désigne", correct: false}
      - {text: "Qu'il doit être libéré par la fonction qui le reçoit", correct: false}
    answer: "La possession s'exprime par un pointeur intelligent. Un `T*` reste légitime pour désigner sans posséder ; dans du code ancien, `gsl::owner<T*>` marque l'exception."
  - key: adoption
    format: course
    question: "Comment une équipe applique-t-elle les Core Guidelines de façon durable ?"
    choices:
      - {text: "En faisant vérifier les règles choisies par un outil, en intégration continue", correct: true}
      - {text: "En demandant à chacun de relire les règles avant chaque fusion", correct: false}
      - {text: "En appliquant toutes les règles d'un coup, sans exception", correct: false}
      - {text: "En copiant le texte des règles dans les commentaires du code", correct: false}
    answer: "clang-tidy propose les vérifications `cppcoreguidelines-*`. On en active quelques-unes, celles qui trouvent des bugs, puis on élargit."
  - key: vf-norme
    format: true-false
    question: "Les C++ Core Guidelines font partie de la norme ISO C++."
    truth: false
    answer: "C'est un document à part, tenu sur GitHub. Un compilateur conforme n'a pas à les faire respecter."
  - key: vf-auteurs
    format: true-false
    question: "Bjarne Stroustrup, le créateur du C++, est l'un des éditeurs des Core Guidelines."
    truth: true
    answer: "Avec Herb Sutter, qui préside le comité de normalisation."
  - key: vf-exceptions
    format: true-false
    question: "Chaque règle des Core Guidelines doit être suivie sans aucune exception."
    truth: false
    answer: "Ce sont des recommandations argumentées. Beaucoup de règles décrivent elles-mêmes leurs exceptions."
  - key: vf-span
    format: true-false
    question: "`gsl::span` a inspiré `std::span`, entré dans la norme avec C++20."
    truth: true
    answer: "Plusieurs idées de la GSL ont rejoint la bibliothèque standard. `std::span` remplace aujourd'hui `gsl::span`."
  - key: qcm-not-null
    format: multiple-choice
    question: "Quel type de la GSL exprime qu'un pointeur ne peut pas être nul ?"
    choices:
      - {text: "`gsl::not_null<T*>`", correct: true}
      - {text: "`gsl::owner<T*>`", correct: false}
      - {text: "`gsl::narrow<T*>`", correct: false}
      - {text: "`gsl::span<T>`", correct: false}
    answer: "`gsl::not_null` vérifie à sa construction que le pointeur n'est pas nul. La fonction qui le reçoit n'a plus à le tester."
  - key: qcm-narrow
    format: multiple-choice
    question: "Que fait `gsl::narrow<int>(valeur)` ?"
    choices:
      - {text: "Il convertit, et signale une erreur si la valeur ne tient pas dans un `int`", correct: true}
      - {text: "Il convertit en tronquant la valeur, sans rien signaler", correct: false}
      - {text: "Il réduit la mémoire occupée par la variable", correct: false}
      - {text: "Il arrondit un nombre à virgule à l'entier le plus proche", correct: false}
    answer: "C'est une conversion vérifiée. `gsl::narrow_cast` fait la même conversion sans vérifier : il dit seulement que la perte est voulue."
  - key: qcm-outil
    format: multiple-choice
    question: "Quel outil propose une famille de vérifications `cppcoreguidelines-*` ?"
    choices:
      - {text: "clang-tidy", correct: true}
      - {text: "clang-format", correct: false}
      - {text: "gdb", correct: false}
      - {text: "CMake", correct: false}
    answer: "clang-tidy analyse le code sans l'exécuter. clang-format ne s'occupe que de la mise en forme."
  - key: qcm-prefixe
    format: multiple-choice
    question: "Dans les Core Guidelines, que désigne le préfixe `R`, comme dans la règle R.1 ?"
    choices:
      - {text: "La gestion des ressources", correct: true}
      - {text: "Les références", correct: false}
      - {text: "La récursion", correct: false}
      - {text: "Les règles de style", correct: false}
    answer: "Le chapitre `R` traite des ressources. R.1 demande de les gérer automatiquement, par RAII."
  - key: situation-adoption
    format: scenario
    question: |-
      Ton équipe veut adopter les Core Guidelines sur un projet de trois cent mille lignes. Activer toutes les
      vérifications de clang-tidy produit vingt mille avertissements. Que proposes-tu ?
    choices:
      - {text: "Activer d'abord quelques règles qui trouvent des bugs, les corriger, puis élargir", correct: true}
      - {text: "Corriger les vingt mille avertissements avant toute autre livraison", correct: false}
      - {text: "Renoncer : les Core Guidelines ne conviennent qu'aux projets neufs", correct: false}
      - {text: "Activer toutes les règles, et ignorer la sortie de clang-tidy", correct: false}
    answer: |-
      Une liste que personne ne peut vider n'est lue par personne. On choisit un petit ensemble (possession,
      initialisation, bornes), on le rend bloquant en intégration continue, et on ajoute des règles à mesure.
  - key: situation-pointeur-ambigu
    format: scenario
    question: |-
      Une fonction ancienne a pour signature `Widget* creer();`. Personne ne sait si l'appelant doit faire
      `delete`. Que recommandent les Core Guidelines ?
    choices:
      - {text: "De renvoyer un `std::unique_ptr<Widget>` : le type dit que l'appelant possède l'objet", correct: true}
      - {text: "D'ajouter un commentaire « à libérer par l'appelant » au-dessus de la fonction", correct: false}
      - {text: "De renvoyer un `Widget&`, que l'appelant libère avec `delete &w`", correct: false}
      - {text: "De renommer la fonction en `creer_et_ne_pas_oublier_delete`", correct: false}
    answer: |-
      Un pointeur brut ne dit rien de la possession. Les règles I.11 et R.3 demandent de l'exprimer dans le type.
      Si la signature ne peut pas changer tout de suite, `gsl::owner<Widget*>` l'annonce au moins aux outils.
  - key: situation-nul
    format: scenario
    question: |-
      Dix fonctions d'un module reçoivent un `Session*`, et commencent toutes par `if (session == nullptr)
      return;`. Aucun appelant ne passe jamais `nullptr`. Que proposes-tu, dans l'esprit des Guidelines ?
    choices:
      - {text: "Recevoir une `Session&`, ou un `gsl::not_null<Session*>` : le type exclut le cas nul", correct: true}
      - {text: "Garder les dix tests, et en ajouter un onzième dans chaque appelant", correct: false}
      - {text: "Remplacer les dix tests par un `catch (...)` autour de chaque fonction", correct: false}
      - {text: "Recevoir un `void*`, que chaque fonction convertit en `Session*`", correct: false}
    answer: |-
      Quand « rien » n'est pas une valeur valide, le type doit l'interdire : l'erreur se déplace de l'exécution
      vers l'appelant, et les tests disparaissent. C'est l'idée de « préférer les erreurs de compilation ».
  - key: situation-desaccord
    format: scenario
    question: |-
      En revue de code, un collègue refuse un changement « parce que la règle ES.xx l'interdit ». Dans ce cas
      précis, suivre la règle rend le code moins clair. Comment tranches-tu ?
    choices:
      - {text: "En lisant la justification de la règle : si sa raison ne s'applique pas ici, on note l'exception", correct: true}
      - {text: "En appliquant la règle : une règle des Guidelines ne se discute pas", correct: false}
      - {text: "En désactivant les Core Guidelines pour tout le projet", correct: false}
      - {text: "En supprimant la vérification de l'outil sans rien expliquer", correct: false}
    answer: |-
      Chaque règle donne sa raison, et souvent ses exceptions. On juge sur cette raison. Une exception assumée se
      marque à l'endroit précis, avec un mot d'explication, pour que l'outil et le lecteur la comprennent.
  - key: definition-core-guidelines
    format: definition
    question: "Que désigne l'expression « C++ Core Guidelines » ?"
    choices:
      - {text: "Un ensemble de règles recommandées pour le C++ moderne, édité par Stroustrup et Sutter", correct: true}
      - {text: "Le noyau de la bibliothèque standard, commun à tous les compilateurs", correct: false}
      - {text: "La partie de la norme qui décrit la syntaxe du langage", correct: false}
      - {text: "Le guide de style interne d'une entreprise", correct: false}
    answer: "Elles sont publiées sur GitHub, dans le dépôt `isocpp/CppCoreGuidelines`."
  - key: definition-profil
    format: definition
    question: "Qu'est-ce qu'un profil, dans les Core Guidelines ?"
    choices:
      - {text: "Un groupe de règles vérifiables par un outil, qui vise une garantie : types, bornes, durées de vie", correct: true}
      - {text: "Le relevé du temps passé dans chaque fonction du programme", correct: false}
      - {text: "La configuration de construction choisie pour un projet", correct: false}
      - {text: "La liste des auteurs qui ont rédigé une règle", correct: false}
    answer: "Les profils de sûreté des types, des bornes et des durées de vie regroupent les règles qu'un analyseur peut faire respecter mécaniquement."
  - key: definition-owner
    format: definition
    question: "Que signifie `gsl::owner<T*>` ?"
    choices:
      - {text: "Que ce pointeur brut possède l'objet désigné, et doit le libérer", correct: true}
      - {text: "Que ce pointeur brut ne peut jamais valoir `nullptr`", correct: false}
      - {text: "Que ce pointeur brut est partagé entre plusieurs threads", correct: false}
      - {text: "Que ce pointeur brut désigne un objet constant", correct: false}
    answer: "C'est une simple annotation, sans effet à l'exécution, destinée au code qui ne peut pas encore passer aux pointeurs intelligents. Les analyseurs s'en servent."
  - key: definition-expects
    format: definition
    question: "À quoi sert `Expects(condition)`, de la GSL ?"
    choices:
      - {text: "À énoncer une précondition : ce qui doit être vrai à l'entrée d'une fonction", correct: true}
      - {text: "À énoncer ce que la fonction renvoie quand tout va bien", correct: false}
      - {text: "À attendre qu'une condition devienne vraie dans un autre thread", correct: false}
      - {text: "À vérifier une condition pendant la compilation", correct: false}
    answer: "`Expects` vérifie une précondition, `Ensures` une postcondition. Une condition fausse arrête le programme : c'est un bug de l'appelant, ou de la fonction."
