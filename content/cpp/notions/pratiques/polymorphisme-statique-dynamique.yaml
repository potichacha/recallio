notion: polymorphisme-statique-dynamique
lesson: |-
  Le **polymorphisme** permet d'écrire un même code pour plusieurs types. C++ en offre deux formes, qui diffèrent
  par le **moment** où le type réel est connu.

  **Le polymorphisme dynamique : `virtual`.** Le type est choisi **à l'exécution**.

  ```cpp
  struct Forme {
      virtual ~Forme() = default;
      virtual double aire() const = 0;
  };

  double total(const std::vector<std::unique_ptr<Forme>>& formes) {
      double somme = 0;
      for (const auto& f : formes) { somme += f->aire(); }
      return somme;
  }
  ```

  **Le polymorphisme statique : les templates.** Le type est choisi **à la compilation**.

  ```cpp
  template <typename F>
  double aire_double(const F& forme) {
      return 2 * forme.aire();      // tout type qui a aire() convient
  }
  ```

  Aucune classe de base commune : il suffit que le type **fournisse les opérations utilisées**. Les **concepts**
  (C++20) permettent de l'écrire dans la signature.

  **La comparaison.**

  | | Dynamique (`virtual`) | Statique (templates) |
  |---|---|---|
  | Type connu | à l'exécution | à la compilation |
  | Lien entre les types | une classe de base commune | aucun : les mêmes opérations suffisent |
  | Coût d'un appel | une indirection par la vtable ; rarement mis en ligne | aucun : l'appel est direct, souvent mis en ligne |
  | Coût par objet | un pointeur de vtable | rien |
  | Conteneur de types mélangés | oui : `vector<unique_ptr<Forme>>` | non : un type par instanciation |
  | Taille du code | une seule version de la fonction | une version par type utilisé |
  | Compilation | rapide ; le code peut rester dans un `.cpp` | plus lente ; le code vit dans les en-têtes |
  | Erreur de type | à la compilation, simple | à la compilation, parfois longue à lire |

  **Quand choisir le dynamique.**

  - Le type n'est connu **qu'à l'exécution** : un fichier de configuration, un greffon, un choix de l'utilisateur.
  - On range des objets de **types différents dans un même conteneur**.
  - On veut une **frontière stable** entre deux parties du programme, ou une bibliothèque livrée compilée.

  **Quand choisir le statique.**

  - Le type est connu **à la compilation**, et l'appel est sur un **chemin critique** : une boucle serrée où
    l'indirection et l'absence de mise en ligne se mesurent.
  - On écrit du code **générique** sur des types sans lien : c'est ce que font les conteneurs et les algorithmes
    de la bibliothèque standard.

  **Les intermédiaires.**

  - Le **CRTP** : une base template paramétrée par sa dérivée, pour réutiliser du code sans fonction virtuelle.
  - **`std::variant` et `std::visit`** : un ensemble **fermé** de types, connu à la compilation, choisi à
    l'exécution, sans allocation ni classe de base.
  - L'**effacement de type** (`std::function`) : une interface dynamique derrière un constructeur template.

  **Le coût, sans exagérer.** Un appel virtuel coûte quelques nanosecondes : négligeable devant une allocation ou
  une entrée-sortie. Ce qui compte vraiment, c'est la **mise en ligne perdue** dans les boucles très serrées. On
  mesure avant de remplacer des `virtual` par des templates.

  **En entretien** : « `virtual` résout l'appel à l'exécution par la vtable : il me faut une base commune, et je
  peux mélanger les types dans un conteneur. Les templates résolvent à la compilation : pas d'indirection, mise en
  ligne possible, mais un type par instanciation et plus de code généré. Je prends le dynamique quand le type
  n'est connu qu'à l'exécution. »
cards:
  - key: moment
    format: course
    question: "Qu'est-ce qui distingue le polymorphisme statique du polymorphisme dynamique ?"
    choices:
      - {text: "Le moment où la fonction appelée est choisie : à la compilation, ou à l'exécution", correct: true}
      - {text: "Le nombre de paramètres que la fonction appelée peut recevoir", correct: false}
      - {text: "L'endroit où vivent les objets : sur la pile, ou sur le tas", correct: false}
      - {text: "La possibilité, ou non, de modifier les objets manipulés", correct: false}
    answer: "Avec un template, le compilateur connaît le type et génère l'appel direct. Avec `virtual`, la fonction est trouvée à l'exécution, par la table des fonctions virtuelles."
  - key: lien-entre-types
    format: course
    question: "Que doit avoir en commun un type pour être accepté par `template <typename F> double f(const F& x) { return x.aire(); }` ?"
    choices:
      - {text: "Une fonction membre `aire()` utilisable : aucune classe de base n'est exigée", correct: true}
      - {text: "Une classe de base `Forme`, dont il hérite publiquement", correct: false}
      - {text: "Une fonction virtuelle `aire()`, déclarée avec `override`", correct: false}
      - {text: "Un destructeur virtuel, et un constructeur par défaut", correct: false}
    answer: "Un template exige seulement que le code compile avec ce type. Le polymorphisme dynamique, lui, demande une hiérarchie."
  - key: cout-virtuel
    format: course
    question: "Quel est le coût principal d'un appel virtuel dans une boucle très serrée ?"
    choices:
      - {text: "L'appel passe par la vtable, et ne peut en général pas être mis en ligne", correct: true}
      - {text: "L'appel alloue de la mémoire sur le tas à chaque tour", correct: false}
      - {text: "L'appel copie l'objet avant d'exécuter la fonction", correct: false}
      - {text: "L'appel verrouille un mutex pour lire la vtable", correct: false}
    answer: "L'indirection elle-même coûte peu. C'est l'optimisation perdue qui compte : sans mise en ligne, le compilateur ne peut ni simplifier ni vectoriser le corps de la boucle."
  - key: conteneur-heterogene
    format: course
    question: "Tu dois ranger des cercles et des carrés dans un même vecteur, et appeler `aire()` sur chacun. Quelle forme de polymorphisme le permet directement ?"
    choices:
      - {text: "Le dynamique : un `std::vector<std::unique_ptr<Forme>>`", correct: true}
      - {text: "Le statique : un `std::vector<T>` où `T` change à chaque élément", correct: false}
      - {text: "Aucune : un vecteur ne peut contenir que des entiers", correct: false}
      - {text: "Le statique : une fonction template appelée une seule fois", correct: false}
    answer: "Un vecteur a un seul type d'élément. Le pointeur vers la base est ce type commun, et l'appel virtuel retrouve la bonne fonction. Pour un ensemble fermé de types, `std::variant` est l'autre voie."
  - key: vf-base-commune
    format: true-false
    question: "Le polymorphisme par templates exige que les types utilisés dérivent d'une même classe de base."
    truth: false
    answer: "Il suffit qu'ils offrent les opérations que le template utilise. C'est pourquoi `std::sort` trie aussi bien des `int` que des `std::string`."
  - key: vf-code-genere
    format: true-false
    question: "Un template de fonction utilisé avec dix types différents produit dix versions de la fonction."
    truth: true
    answer: "Chaque instanciation est compilée à part. C'est le prix de la vitesse : plus de code généré, et des compilations plus longues."
  - key: vf-vtable-pointeur
    format: true-false
    question: "Chaque objet d'une classe qui a des fonctions virtuelles contient un pointeur vers une vtable."
    truth: true
    answer: "Ce pointeur, en général de 8 octets, dit quelles fonctions appeler pour le type réel de l'objet."
  - key: vf-toujours-templates
    format: true-false
    question: "Remplacer toutes les fonctions virtuelles d'un programme par des templates le rend toujours plus rapide."
    truth: false
    answer: "Hors des boucles très serrées, le gain est invisible, et le code généré grossit. Quand le type n'est connu qu'à l'exécution, les templates ne s'appliquent même pas."
  - key: qcm-variant
    format: multiple-choice
    question: "Quel outil convient à un ensemble fermé de types, choisi à l'exécution, sans classe de base ?"
    choices:
      - {text: "`std::variant`, parcouru avec `std::visit`", correct: true}
      - {text: "`std::vector<void*>`, avec des conversions", correct: false}
      - {text: "`std::any_of`, avec une lambda", correct: false}
      - {text: "`dynamic_cast`, appliqué à des entiers", correct: false}
    answer: "`std::variant<Cercle, Carre>` contient l'un ou l'autre, sans allocation. `std::visit` appelle la bonne fonction ; tous les types sont connus à la compilation."
  - key: qcm-greffon
    format: multiple-choice
    question: "Une application charge des greffons au démarrage, écrits par d'autres équipes. Quelle forme de polymorphisme convient ?"
    choices:
      - {text: "Le dynamique : une interface abstraite, que chaque greffon implémente", correct: true}
      - {text: "Le statique : un template instancié avec le type de chaque greffon", correct: false}
      - {text: "Le statique : une macro qui recopie le code de chaque greffon", correct: false}
      - {text: "Aucune : un greffon ne peut pas être appelé par l'application", correct: false}
    answer: "Le type des greffons n'existe pas quand l'application est compilée. Seule une interface résolue à l'exécution permet de les appeler."
  - key: qcm-crtp
    format: multiple-choice
    question: "Quel idiome donne à une classe de base template l'accès à sa classe dérivée, sans fonction virtuelle ?"
    choices:
      - {text: "Le CRTP : `class Cercle : public Forme<Cercle>`", correct: true}
      - {text: "Le RAII : `class Cercle : public Ressource`", correct: false}
      - {text: "Le pimpl : `class Cercle { Impl* impl_; }`", correct: false}
      - {text: "Le singleton : `Cercle::instance()`", correct: false}
    answer: "*Curiously Recurring Template Pattern* : la base connaît le type dérivé à la compilation, et appelle ses fonctions par `static_cast`, sans vtable."
  - key: qcm-concept
    format: multiple-choice
    question: "Comment exprime-t-on, depuis C++20, ce qu'un template attend de son type ?"
    choices:
      - {text: "Par un concept, dans la signature du template", correct: true}
      - {text: "Par une classe de base abstraite, dont le type doit hériter", correct: false}
      - {text: "Par un commentaire au-dessus du template", correct: false}
      - {text: "Par le mot-clé `virtual` devant le paramètre de type", correct: false}
    answer: "Un concept nomme les exigences : le compilateur refuse l'appel dès la signature, avec un message qui cite l'exigence manquante."
  - key: situation-boucle-chaude
    format: scenario
    question: |-
      Un moteur de rendu appelle `pixel->couleur()` par une fonction virtuelle, cent millions de fois par image.
      Le profileur y voit 40 % du temps, et tous les pixels d'une image ont le même type. Que proposes-tu ?
    choices:
      - {text: "Paramétrer la boucle par le type de pixel : un template, dont l'appel est mis en ligne", correct: true}
      - {text: "Déclarer `couleur()` avec `inline virtual`, pour forcer sa mise en ligne", correct: false}
      - {text: "Ranger les pixels dans une `std::list`, plus rapide à parcourir", correct: false}
      - {text: "Ajouter un second niveau de classes dérivées, plus spécialisées", correct: false}
    answer: |-
      Le type est le même pour toute l'image : il peut être fixé à la compilation. Dans le template, l'appel
      devient direct, le compilateur le met en ligne et peut vectoriser. Le choix du type reste dynamique, une
      seule fois, au-dessus de la boucle.
  - key: situation-temps-de-compilation
    format: scenario
    question: |-
      Une bibliothèque entièrement en templates fait passer la compilation d'un projet de deux à vingt minutes, et
      chaque modification d'un en-tête recompile tout. L'appel concerné a lieu dix fois par seconde. Que
      proposes-tu ?
    choices:
      - {text: "Une interface virtuelle, dont le code reste dans un `.cpp` : le coût à l'exécution est ici nul", correct: true}
      - {text: "Davantage de templates, pour que le compilateur réutilise les instanciations", correct: false}
      - {text: "La suppression des gardes d'inclusion, qui ralentissent le préprocesseur", correct: false}
      - {text: "Le passage de `-O2` à `-O3`, qui compile plus vite", correct: false}
    answer: |-
      Un template vit dans les en-têtes, et se recompile dans chaque fichier qui l'utilise. À dix appels par
      seconde, une indirection virtuelle ne se mesure pas : la frontière dynamique rend la compilation, sans rien
      coûter.
  - key: situation-type-inconnu
    format: scenario
    question: |-
      Le format d'export (CSV, JSON ou XML) est lu dans un fichier de configuration au démarrage. Un collègue veut
      écrire `template <typename Format> void exporter(...)`. Qu'en penses-tu ?
    choices:
      - {text: "Le type n'est connu qu'à l'exécution : il faut une interface `Exporteur` virtuelle, ou un `std::variant`", correct: true}
      - {text: "C'est la bonne solution : un template choisit son type en lisant le fichier de configuration", correct: false}
      - {text: "C'est la bonne solution, à condition de marquer le template `virtual`", correct: false}
      - {text: "Il faut trois exécutables différents, un par format d'export", correct: false}
    answer: |-
      Un template est instancié par le compilateur, qui ne lit pas la configuration. Quelque part, un choix à
      l'exécution doit sélectionner l'implémentation : c'est le rôle d'une fonction virtuelle, ou de `std::visit`.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande pourquoi `std::sort` est un template, plutôt qu'une fonction qui prendrait une
      interface `Comparable` virtuelle. Que réponds-tu ?
    choices:
      - {text: "Il trie des types sans lien entre eux, et la comparaison, mise en ligne, ne coûte rien", correct: true}
      - {text: "Une fonction virtuelle ne peut pas comparer deux objets", correct: false}
      - {text: "Les templates se compilent plus vite que les fonctions virtuelles", correct: false}
      - {text: "La norme interdit les fonctions virtuelles dans la bibliothèque standard", correct: false}
    answer: |-
      Avec une interface, il faudrait que `int` et `std::string` héritent de `Comparable`, et chaque comparaison
      serait un appel indirect. Le template s'applique à tout type qui a `<`, et le compilateur intègre la
      comparaison dans la boucle de tri.
