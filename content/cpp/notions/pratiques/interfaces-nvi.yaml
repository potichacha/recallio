notion: interfaces-nvi
lesson: |-
  L'idiome **NVI** (*Non-Virtual Interface*) sépare deux rôles qu'une fonction virtuelle publique mélange : ce que
  l'**appelant** voit, et ce que les **classes dérivées** personnalisent.

  - La fonction **publique** est **non virtuelle** : elle fixe l'interface et le déroulement.
  - La fonction **virtuelle** est **privée** (ou protégée) : c'est le point de personnalisation.

  ```cpp
  class Exportateur {
  public:
      virtual ~Exportateur() = default;

      void exporter(const Document& doc) {          // non virtuelle : le contrat
          if (doc.vide()) {
              throw std::invalid_argument{"document vide"};
          }
          journaliser("début");
          ecrire(doc);                               // le point de personnalisation
          journaliser("fin");
      }

  private:
      virtual void ecrire(const Document& doc) = 0;  // virtuelle et privée
  };

  class ExportateurPdf : public Exportateur {
  private:
      void ecrire(const Document& doc) override { /* ... */ }
  };
  ```

  **Ce que la classe de base y gagne : le contrôle.** Les vérifications, le journal, le verrou, la mesure de
  durée sont écrits **une fois**, dans la fonction publique, et s'appliquent à **toutes** les classes dérivées. Une
  dérivée ne peut ni les oublier ni les contourner.

  **Une fonction privée peut être redéfinie.** L'accès (`private`) et la virtualité sont indépendants : une classe
  dérivée **redéfinit** une fonction virtuelle privée de sa base, sans pouvoir l'**appeler**. C'est exactement ce
  qu'on veut : elle fournit le comportement, la base décide quand il s'exécute.

  On la met `protected` quand la dérivée doit appeler la version de la base depuis sa propre redéfinition.

  **C'est le patron « méthode modèle »** (*Template Method*) : l'algorithme est dans la base, certaines étapes
  sont laissées aux dérivées.

  **Les autres avantages.**

  - L'interface publique et les points de personnalisation **évoluent séparément** : on peut ajouter une étape à
    `exporter` sans toucher aux dérivées.
  - Les **arguments par défaut** restent dans la fonction non virtuelle, ce qui évite un piège : un argument par
    défaut est choisi d'après le type **statique**, pas d'après le type réel.

  **Quand s'en passer.** Une pure interface, sans rien à garantir autour de l'appel (un `Forme::aire()`), reste
  plus simple avec des fonctions virtuelles publiques. NVI vaut dès qu'il y a un **invariant** ou une étape commune
  à imposer.

  **Le destructeur.** La règle va avec : le destructeur d'une classe de base est soit **public et virtuel**, soit
  **protégé et non virtuel**.

  **En entretien** : « Avec NVI, l'interface publique est non virtuelle, et appelle des fonctions virtuelles
  privées. La base garde le contrôle : préconditions, journal, verrou sont écrits une fois pour toutes les
  dérivées. C'est le patron méthode modèle. »
cards:
  - key: principe
    format: course
    question: "Que préconise l'idiome NVI ?"
    choices:
      - {text: "Des fonctions publiques non virtuelles, qui appellent des fonctions virtuelles privées", correct: true}
      - {text: "Des fonctions publiques virtuelles, qui appellent des fonctions privées non virtuelles", correct: false}
      - {text: "Des classes sans aucune fonction virtuelle, ni publique ni privée", correct: false}
      - {text: "Des classes dont toutes les fonctions sont à la fois publiques et virtuelles", correct: false}
    answer: "L'interface pour l'appelant est fixe ; la personnalisation par les dérivées passe par des fonctions virtuelles qu'il ne voit pas."
  - key: interet
    format: course
    question: "Que gagne la classe de base avec NVI ?"
    choices:
      - {text: "Elle impose à toutes les dérivées ses vérifications et ses étapes communes", correct: true}
      - {text: "Elle supprime le coût des appels de fonctions virtuelles", correct: false}
      - {text: "Elle interdit à toute classe d'hériter d'elle", correct: false}
      - {text: "Elle rend ses membres privés accessibles aux dérivées", correct: false}
    answer: "Le code placé autour de l'appel virtuel s'exécute toujours, quelle que soit la dérivée : elle ne peut ni l'oublier ni le contourner."
  - key: privee-redefinie
    format: course
    question: "Une classe dérivée peut-elle redéfinir une fonction virtuelle privée de sa base ?"
    choices:
      - {text: "Oui : elle peut la redéfinir, mais pas l'appeler", correct: true}
      - {text: "Non : une fonction privée est invisible pour les dérivées", correct: false}
      - {text: "Oui, et elle peut aussi l'appeler directement", correct: false}
      - {text: "Non : une fonction privée ne peut pas être virtuelle", correct: false}
    answer: "L'accès et la virtualité sont deux choses distinctes. `private` interdit l'appel, pas la redéfinition."
  - key: patron
    format: course
    question: "À quel patron de conception NVI correspond-il ?"
    choices:
      - {text: "La méthode modèle : l'algorithme est dans la base, des étapes sont laissées aux dérivées", correct: true}
      - {text: "Le singleton : la classe n'a qu'une seule instance dans le programme", correct: false}
      - {text: "La fabrique : une fonction crée des objets sans nommer leur classe", correct: false}
      - {text: "L'observateur : des objets sont prévenus des changements d'un autre", correct: false}
    answer: "*Template Method* : la fonction non virtuelle fixe la séquence, les fonctions virtuelles en fournissent les variations."
  - key: vf-publique-virtuelle
    format: true-false
    question: "Avec NVI, la fonction que l'appelant utilise est virtuelle."
    truth: false
    answer: "Elle est publique et non virtuelle. Ce sont les fonctions qu'elle appelle qui sont virtuelles."
  - key: vf-contourner
    format: true-false
    question: "Avec NVI, une classe dérivée ne peut pas supprimer les vérifications faites par la fonction publique de la base."
    truth: true
    answer: "Elle ne redéfinit que l'étape virtuelle. La fonction publique, non virtuelle, s'exécute toujours."
  - key: vf-protected
    format: true-false
    question: "On déclare la fonction virtuelle `protected` quand la dérivée doit appeler la version de la base."
    truth: true
    answer: "`private` interdit cet appel. `protected` le permet, tout en cachant la fonction aux utilisateurs."
  - key: vf-toujours
    format: true-false
    question: "NVI s'impose pour toute classe abstraite, même une pure interface sans étape commune."
    truth: false
    answer: "Sans rien à garantir autour de l'appel, des fonctions virtuelles publiques sont plus simples. NVI sert à imposer un invariant."
  - key: qcm-destructeur
    format: multiple-choice
    question: "Quelle règle suit le destructeur d'une classe de base ?"
    choices:
      - {text: "Public et virtuel, ou protégé et non virtuel", correct: true}
      - {text: "Privé et virtuel, dans tous les cas", correct: false}
      - {text: "Public et non virtuel, dans tous les cas", correct: false}
      - {text: "Protégé et virtuel pur, sans définition", correct: false}
    answer: "Soit on peut détruire par un pointeur de base, et le destructeur est virtuel ; soit on ne peut pas, et il est protégé."
  - key: qcm-ou-placer
    format: multiple-choice
    question: "Où places-tu la vérification d'une précondition commune à toutes les classes dérivées ?"
    choices:
      - {text: "Dans la fonction publique non virtuelle de la base", correct: true}
      - {text: "Dans chaque redéfinition de la fonction virtuelle", correct: false}
      - {text: "Dans le constructeur de chaque classe dérivée", correct: false}
      - {text: "Dans le code de chaque appelant", correct: false}
    answer: "Écrite une fois, elle vaut pour toutes les dérivées, présentes et futures."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration convient au point de personnalisation d'une classe NVI ?"
    choices:
      - {text: "`private: virtual void ecrire(const Document&) = 0;`", correct: true}
      - {text: "`public: virtual void ecrire(const Document&) = 0;`", correct: false}
      - {text: "`public: void ecrire(const Document&);`", correct: false}
      - {text: "`private: static void ecrire(const Document&);`", correct: false}
    answer: "Virtuelle pour être redéfinie, privée pour n'être appelée que par la base."
  - key: qcm-argument-defaut
    format: multiple-choice
    question: "Pourquoi évite-t-on les arguments par défaut sur une fonction virtuelle ?"
    choices:
      - {text: "La valeur par défaut est choisie d'après le type statique, pas d'après le type réel", correct: true}
      - {text: "Le compilateur refuse un argument par défaut sur une fonction virtuelle", correct: false}
      - {text: "Un argument par défaut rend la fonction virtuelle deux fois plus lente", correct: false}
      - {text: "Un argument par défaut empêche la fonction d'être redéfinie", correct: false}
    answer: "Par un pointeur de base, c'est la redéfinition de la dérivée qui s'exécute, avec la valeur par défaut de la base. NVI place ces valeurs dans la fonction non virtuelle."
  - key: situation-journal
    format: scenario
    question: |-
      Une classe abstraite `Tache` a une fonction virtuelle publique `executer()`. Chaque classe dérivée doit
      journaliser le début et la fin, et trois sur douze l'ont oublié. Que proposes-tu ?
    choices:
      - {text: "Une `executer()` non virtuelle dans la base, qui journalise et appelle une virtuelle privée", correct: true}
      - {text: "Un commentaire dans la base, qui rappelle de journaliser dans chaque dérivée", correct: false}
      - {text: "Une revue de code plus stricte des douze classes dérivées", correct: false}
      - {text: "La suppression du journal, puisqu'il n'est pas fiable", correct: false}
    answer: |-
      Ce qui doit toujours avoir lieu ne doit pas dépendre de la discipline de chaque dérivée. Avec NVI, le journal
      est dans la base, autour de l'appel virtuel.
  - key: situation-verrou
    format: scenario
    question: |-
      Une classe de base `Cache` est utilisée depuis plusieurs threads. Chaque dérivée redéfinit `lire()` et doit
      penser à verrouiller le mutex de la base. Une nouvelle dérivée l'oublie : course aux données. Comment
      rends-tu l'oubli impossible ?
    choices:
      - {text: "La fonction publique de la base verrouille, puis appelle la fonction virtuelle privée", correct: true}
      - {text: "Le mutex est rendu public, pour que les appelants le verrouillent", correct: false}
      - {text: "Chaque dérivée reçoit son propre mutex, à verrouiller elle-même", correct: false}
      - {text: "La classe `Cache` est interdite d'héritage avec `final`", correct: false}
    answer: |-
      La synchronisation fait partie du contrat de la base : elle doit être écrite une fois, hors de portée des
      dérivées.
  - key: situation-evolution
    format: scenario
    question: |-
      Tu dois ajouter une mesure de durée à toutes les exportations. La classe de base expose une fonction
      virtuelle publique `exporter()`, redéfinie par vingt classes dans d'autres équipes. Qu'aurait permis NVI ?
    choices:
      - {text: "D'ajouter la mesure dans la fonction non virtuelle de la base, sans toucher aux vingt classes", correct: true}
      - {text: "De supprimer les vingt classes dérivées, devenues inutiles avec la mesure", correct: false}
      - {text: "De mesurer la durée dès la compilation, sans aucun coût à l'exécution", correct: false}
      - {text: "De rendre `exporter()` deux fois plus rapide", correct: false}
    answer: |-
      L'interface publique et les points de personnalisation sont découplés : la base peut évoluer autour de
      l'appel virtuel.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande pourquoi rendre **privée** une fonction virtuelle, puisque les dérivées doivent
      la redéfinir. Que réponds-tu ?
    choices:
      - {text: "Que `private` interdit de l'appeler, pas de la redéfinir : la base garde la maîtrise de l'appel", correct: true}
      - {text: "Que c'est une erreur : une fonction virtuelle privée ne peut pas être redéfinie", correct: false}
      - {text: "Que cela accélère l'appel, le compilateur évitant la table virtuelle", correct: false}
      - {text: "Que cela empêche toute classe d'hériter de la base", correct: false}
    answer: |-
      La dérivée fournit le comportement ; seule la base décide quand il s'exécute, et ce qui se passe avant et
      après.
