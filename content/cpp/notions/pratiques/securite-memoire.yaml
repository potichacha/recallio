notion: securite-memoire
lesson: |-
  Un langage est **sûr pour la mémoire** quand un programme ne peut pas lire ou écrire hors de ce qui lui
  appartient : pas d'accès hors bornes, pas d'objet utilisé après sa destruction, pas de mémoire non initialisée
  lue. C++ ne l'est pas : ces fautes y sont des **comportements indéfinis**, que rien n'interdit.

  **Le débat.** Plusieurs grands éditeurs ont publié le même constat : environ **70 % de leurs failles de sécurité
  graves** viennent d'erreurs de mémoire dans du code C et C++. Depuis 2022, des agences de sécurité, dont la NSA
  et la CISA aux États-Unis, recommandent de préférer des langages sûrs pour la mémoire, comme Rust, Go, Java ou
  C#, pour le nouveau code.

  La communauté C++ répond sur deux plans : la plupart de ces fautes viennent d'un style **ancien** (pointeurs
  bruts, tableaux C), que le C++ moderne évite ; et le langage doit offrir des **garanties vérifiables**, pas
  seulement des conseils.

  **Les familles de fautes.**

  | Famille | Exemple | Sûreté dite |
  |---|---|---|
  | accès hors bornes | `v[v.size()]` | spatiale |
  | usage après libération, pointeur pendant | `delete p; *p` | temporelle |
  | lecture non initialisée | `int x; return x;` | d'initialisation |
  | confusion de type | un `reinterpret_cast` abusif | de type |
  | course aux données | deux threads sans verrou | de concurrence |

  **Ce qu'on peut faire aujourd'hui.**

  1. **Écrire du C++ moderne** : RAII, `std::unique_ptr`, `std::vector`, `std::span`, `std::string_view`, boucles
     sur un intervalle. Pas de `new`, pas de `delete`, pas d'arithmétique de pointeurs.
  2. **Durcir la bibliothèque standard** : avec GCC, `-D_GLIBCXX_ASSERTIONS` fait vérifier les indices de
     `operator[]`, `front()`, `back()`, pour un coût faible. libc++ offre un « mode durci » équivalent. Le
     programme s'arrête net, au lieu de corrompre la mémoire.
  3. **Durcir le binaire** : `-fstack-protector-strong`, `-D_FORTIFY_SOURCE=2`, exécutable à adresses aléatoires
     (`-fPIE -pie`). Ces mesures ne suppriment pas la faute, elles la rendent plus difficile à exploiter.
  4. **Tester** sous sanitizers, et **fuzzer** tout ce qui lit des données externes.
  5. **Analyser** : clang-tidy et les vérifications des Core Guidelines.

  **Ce qui se prépare.** Les **profils**, proposés par Bjarne Stroustrup : des ensembles de règles que le
  compilateur **ferait respecter** (profil de bornes, de type, de durée de vie). Un code compilé sous un profil ne
  pourrait plus commettre la famille de fautes correspondante. C++26 apporte déjà une bibliothèque standard
  **durcie**, des **contrats**, et rend la lecture d'une variable non initialisée « erronée » plutôt qu'indéfinie.
  Ces travaux sont en cours : leur forme finale peut encore changer.

  **La position raisonnable.** Le code C++ existant ne sera pas réécrit : il faut le durcir. Pour un composant
  **neuf**, exposé à des données hostiles, un langage sûr pour la mémoire est une option sérieuse, à peser avec
  l'existant et l'équipe.

  **En entretien** : « C++ n'est pas sûr pour la mémoire : hors bornes et usage après libération y sont
  indéfinis, et c'est la source d'environ 70 % des failles graves des grands éditeurs. Je réponds par le C++
  moderne, une bibliothèque standard durcie, les sanitizers et le fuzzing ; et je suis les profils et le
  durcissement de C++26. »
cards:
  - key: definition
    format: course
    question: "Que veut dire qu'un langage est « sûr pour la mémoire » ?"
    choices:
      - {text: "Un programme ne peut pas lire ou écrire hors de la mémoire qui lui appartient", correct: true}
      - {text: "Un programme ne peut pas consommer plus d'un gigaoctet de mémoire", correct: false}
      - {text: "Un programme chiffre toute la mémoire qu'il utilise", correct: false}
      - {text: "Un programme libère toute sa mémoire avant de se terminer", correct: false}
    answer: "Ni accès hors bornes, ni usage après libération, ni lecture non initialisée : ces fautes y sont impossibles, ou arrêtent le programme proprement."
  - key: constat
    format: course
    question: "Quel constat alimente le débat sur la sûreté mémoire de C et de C++ ?"
    choices:
      - {text: "Environ 70 % des failles graves de grands éditeurs viennent d'erreurs de mémoire", correct: true}
      - {text: "Environ 70 % des programmes C++ ne compilent plus avec les compilateurs récents", correct: false}
      - {text: "Environ 70 % des développeurs C++ ont cessé d'utiliser les pointeurs", correct: false}
      - {text: "Environ 70 % du temps d'exécution est passé dans le ramasse-miettes", correct: false}
    answer: "Ce chiffre, publié par plusieurs éditeurs sur leurs propres produits, a conduit des agences de sécurité à recommander des langages sûrs pour le nouveau code."
  - key: durcissement
    format: course
    question: "Que fait l'option `-D_GLIBCXX_ASSERTIONS` de GCC ?"
    choices:
      - {text: "Elle fait vérifier par la bibliothèque standard les indices de `operator[]` et les appels comme `front()`", correct: true}
      - {text: "Elle fait vérifier par le compilateur que le code ne contient plus aucun pointeur brut", correct: false}
      - {text: "Elle supprime du programme toutes les assertions écrites avec `assert`", correct: false}
      - {text: "Elle remplace les conteneurs standard par des versions à ramasse-miettes", correct: false}
    answer: "Un accès hors bornes arrête le programme, au lieu de corrompre la mémoire en silence. Le coût est faible : on peut la garder en production."
  - key: profils
    format: course
    question: "Que proposent les « profils » de sûreté pour C++ ?"
    choices:
      - {text: "Des ensembles de règles que le compilateur ferait respecter, par famille de fautes", correct: true}
      - {text: "Des mesures du temps passé dans chaque fonction du programme", correct: false}
      - {text: "Des réglages d'optimisation propres à chaque processeur", correct: false}
      - {text: "Des comptes d'utilisateurs, avec des droits différents sur le code", correct: false}
    answer: "Un profil de bornes, de type, de durée de vie : le code compilé sous un profil ne pourrait plus commettre la faute correspondante. La proposition est encore en discussion."
  - key: vf-cpp-sur
    format: true-false
    question: "Le langage C++ garantit qu'un programme n'accède jamais à de la mémoire hors de ses objets."
    truth: false
    answer: "Rien ne l'interdit : c'est un comportement indéfini, que le compilateur n'est pas tenu de signaler."
  - key: vf-moderne
    format: true-false
    question: "Le style C++ moderne, sans `new` ni `delete` ni tableaux C, évite une grande part des erreurs de mémoire."
    truth: true
    answer: "RAII, pointeurs intelligents et conteneurs suppriment les fuites et beaucoup de pointeurs pendants. Ils ne les rendent pas impossibles."
  - key: vf-stack-protector
    format: true-false
    question: "`-fstack-protector-strong` supprime les débordements de tampon du programme."
    truth: false
    answer: "Elle détecte l'écrasement de la pile et arrête le programme : la faute existe toujours, mais elle est plus difficile à exploiter."
  - key: vf-reecrire
    format: true-false
    question: "La réponse réaliste au problème est de réécrire tout le code C++ existant dans un autre langage."
    truth: false
    answer: "Des milliards de lignes sont en service. On durcit l'existant, et l'on pèse le choix du langage pour les composants neufs."
  - key: qcm-temporelle
    format: multiple-choice
    question: "Quelle faute relève de la sûreté « temporelle » ?"
    choices:
      - {text: "Utiliser un objet après sa libération", correct: true}
      - {text: "Lire après la fin d'un tableau", correct: false}
      - {text: "Additionner deux entiers qui débordent", correct: false}
      - {text: "Diviser un entier par zéro", correct: false}
    answer: "L'objet a existé, il n'existe plus : c'est une question de durée de vie. L'accès hors bornes est une faute « spatiale »."
  - key: qcm-langages
    format: multiple-choice
    question: "Lequel de ces langages n'est pas considéré comme sûr pour la mémoire ?"
    choices:
      - {text: "C", correct: true}
      - {text: "Rust", correct: false}
      - {text: "Go", correct: false}
      - {text: "Java", correct: false}
    answer: "C et C++ laissent le programmeur responsable. Rust le vérifie à la compilation ; Go et Java s'appuient sur un ramasse-miettes et des vérifications à l'exécution."
  - key: qcm-vue
    format: multiple-choice
    question: "Quel type remplace un couple « pointeur et taille » pour éviter les erreurs de bornes ?"
    choices:
      - {text: "`std::span`", correct: true}
      - {text: "`void*`", correct: false}
      - {text: "`std::any`", correct: false}
      - {text: "`int**`", correct: false}
    answer: "`std::span` transporte la taille avec le pointeur. Une bibliothèque durcie vérifie alors chaque accès."
  - key: qcm-entrees
    format: multiple-choice
    question: "Quelle technique de test vise en priorité le code qui lit des données venues de l'extérieur ?"
    choices:
      - {text: "Le fuzzing, sous sanitizers", correct: true}
      - {text: "La mesure de couverture", correct: false}
      - {text: "La mise en forme automatique", correct: false}
      - {text: "La compilation croisée", correct: false}
    answer: "Le fuzzer fabrique les entrées malformées qu'un attaquant enverrait ; les sanitizers révèlent chaque accès fautif."
  - key: situation-audit
    format: scenario
    question: |-
      Un audit de sécurité reproche à ton produit C++ ses « risques de corruption mémoire », et demande un plan. Le
      réécrire est exclu. Que proposes-tu en premier ?
    choices:
      - {text: "La bibliothèque standard durcie en production, les sanitizers et le fuzzing dans les tests", correct: true}
      - {text: "Un document qui affirme que l'équipe fait attention aux pointeurs", correct: false}
      - {text: "La suppression de tous les tests, pour livrer les correctifs plus vite", correct: false}
      - {text: "La compilation sans optimisation, pour rendre le code plus sûr", correct: false}
    answer: |-
      Ce sont des mesures vérifiables, applicables sans réécriture : le durcissement arrête les accès hors bornes,
      les sanitizers et le fuzzing trouvent les fautes avant les attaquants. La modernisation du code vient
      ensuite, module par module.
  - key: situation-nouveau-composant
    format: scenario
    question: |-
      Ton équipe doit écrire un nouvel analyseur pour un format de fichier reçu d'Internet, intégré à un produit
      C++. Un collègue propose de l'écrire en Rust. Qu'en penses-tu ?
    choices:
      - {text: "Que l'option est sérieuse pour un code neuf exposé à des données hostiles, à peser avec l'équipe et l'intégration", correct: true}
      - {text: "Qu'elle est absurde : un produit C++ ne peut pas appeler de code écrit dans un autre langage", correct: false}
      - {text: "Qu'elle est obligatoire : la loi interdit désormais d'écrire du C++", correct: false}
      - {text: "Qu'elle est inutile : un analyseur ne peut pas contenir d'erreur de mémoire", correct: false}
    answer: |-
      Un analyseur d'entrées non fiables est l'endroit où une faute de mémoire coûte le plus. Un langage sûr y a
      du sens ; l'alternative est un C++ strict, durci et fuzzé. La décision tient aussi aux compétences et au coût
      de l'interface entre les deux langages.
  - key: situation-hors-bornes
    format: scenario
    question: |-
      En production, un indice hors bornes dans un `std::vector` corrompt la mémoire, et le service renvoie des
      données d'un autre client pendant des heures avant de planter. Quelle mesure aurait limité les dégâts ?
    choices:
      - {text: "La bibliothèque standard durcie : le service se serait arrêté à l'accès fautif", correct: true}
      - {text: "Un niveau d'optimisation plus élevé, qui aurait masqué l'accès", correct: false}
      - {text: "Un `catch (...)` dans `main`, qui aurait attrapé l'accès hors bornes", correct: false}
      - {text: "Un vecteur deux fois plus grand, pour laisser de la marge", correct: false}
    answer: |-
      Un arrêt immédiat vaut mieux qu'une corruption silencieuse : la faute est localisée, et rien n'est divulgué.
      Un accès hors bornes n'est pas une exception, et un tampon plus grand ne fait que déplacer le problème.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « C++ est-il condamné par le débat sur la sûreté mémoire ? » Quelle réponse est
      la plus juste ?
    choices:
      - {text: "Non : l'existant est immense et se durcit, mais le langage doit offrir des garanties vérifiables", correct: true}
      - {text: "Oui : plus aucun projet ne sera écrit en C++ d'ici deux ans", correct: false}
      - {text: "Non : le débat est sans objet, C++ étant déjà sûr pour la mémoire", correct: false}
      - {text: "Oui : les compilateurs C++ cesseront bientôt d'être maintenus", correct: false}
    answer: |-
      Le problème est réel et reconnu. La réponse passe par le style moderne, le durcissement, les outils, et les
      travaux en cours sur les profils ; pour du code neuf et exposé, les langages sûrs sont des concurrents
      sérieux.
