notion: const-correctness
lesson: |-
  La **justesse de `const`** (*const correctness*) tient en une règle : marquer `const` **tout ce qui ne doit pas
  changer**, partout où c'est vrai. Le compilateur vérifie alors la promesse, et le lecteur sait d'un coup d'œil
  ce qui peut bouger.

  **Où écrire `const`.**

  | Endroit | Écriture | Ce qu'on promet |
  |---|---|---|
  | Variable locale | `const int limite = 10;` | elle ne sera pas réaffectée |
  | Paramètre par référence | `void f(const std::string& s)` | la fonction ne modifie pas l'argument |
  | Fonction membre | `int taille() const;` | elle ne modifie pas l'objet |
  | Valeur de retour par référence | `const std::string& nom() const;` | l'appelant ne modifiera pas le membre |
  | Pointeur | `const int* p` | on ne modifie pas l'objet désigné |
  | Boucle | `for (const auto& x : v)` | on lit les éléments, sans les copier |

  **`const` se propage.** Un objet `const`, ou vu à travers une référence `const`, n'accepte que les fonctions
  membres **`const`**. Une seule fonction de lecture qui a oublié son `const`, et tout le code qui manipule des
  références constantes ne peut plus l'appeler :

  ```cpp
  class Panier {
  public:
      int total();                       // oubli : devrait être const
  };

  void afficher(const Panier& p) {
      std::println("{}", p.total());     // erreur : discards qualifiers
  }
  ```

  La correction est dans la **classe**, pas chez l'appelant : `int total() const;`.

  **Ne pas contourner.** Retirer le `const` du paramètre, ou sortir un `const_cast`, déplace le problème. Modifier
  à travers un `const_cast` un objet réellement déclaré `const` est un comportement indéfini.

  **`mutable`, pour l'état qui ne se voit pas.** Un membre `mutable` peut changer dans une fonction `const`. On le
  réserve à ce qui n'affecte pas l'état **observable** : un cache, un compteur de statistiques, un mutex.

  **La surcharge `const` / non `const`.** Un accesseur peut exister en deux versions : la version `const` renvoie
  une référence constante, l'autre une référence modifiable. C'est ce que fait `operator[]` de `std::vector`.

  **Ce que `const` ne dit pas.**

  - `const` n'est **pas** `constexpr` : une variable `const` peut être initialisée à l'exécution.
  - Une fonction membre `const` peut modifier ce que **désigne** un pointeur membre : seul le pointeur est
    constant, pas l'objet pointé.
  - Passer un `int` par valeur `const` (`void f(const int n)`) ne promet rien à l'appelant : c'est une copie.

  **Pourquoi s'en soucier.**

  - Les **bugs** : une modification involontaire devient une erreur de compilation.
  - La **lecture** : une signature dit ce qu'une fonction touche.
  - Les **threads** : des données constantes se partagent sans verrou.
  - L'**usage** : on peut passer un temporaire ou un objet constant à une fonction qui prend `const T&`.

  On l'applique **dès le début** : ajouter `const` après coup à un grand code oblige à corriger en cascade.

  **En entretien** : « Je mets `const` partout où c'est vrai : paramètres par référence, fonctions membres qui ne
  modifient pas l'objet, variables qui ne changent pas. `const` se propage : un objet constant n'appelle que des
  fonctions `const`. `mutable` reste réservé aux caches et aux mutex. »
cards:
  - key: principe
    format: course
    question: "Que recommande la justesse de `const` (const correctness) ?"
    choices:
      - {text: "De marquer `const` tout ce qui ne doit pas changer, partout où c'est vrai", correct: true}
      - {text: "De marquer `const` toutes les variables globales, et elles seulement", correct: false}
      - {text: "De retirer `const` dès qu'il empêche le code de compiler", correct: false}
      - {text: "De marquer `const` les fonctions qui s'exécutent à la compilation", correct: false}
    answer: "Variables, paramètres par référence, fonctions membres : chaque `const` est une promesse que le compilateur vérifie."
  - key: propagation
    format: course
    question: "Quelles fonctions membres peut-on appeler sur un objet reçu par `const Panier&` ?"
    choices:
      - {text: "Seulement celles qui sont déclarées `const`", correct: true}
      - {text: "Toutes, à condition de ne pas modifier l'objet", correct: false}
      - {text: "Seulement celles qui sont déclarées `static`", correct: false}
      - {text: "Aucune : un objet constant n'a pas de fonction membre", correct: false}
    answer: "Le compilateur ne regarde pas le corps de la fonction, mais sa déclaration. Sans `const` après les parenthèses, elle est interdite sur un objet constant."
  - key: mutable
    format: course
    question: "À quoi sert un membre déclaré `mutable` ?"
    choices:
      - {text: "À pouvoir être modifié dans une fonction membre `const` : un cache, un mutex", correct: true}
      - {text: "À pouvoir être modifié par plusieurs threads sans synchronisation", correct: false}
      - {text: "À pouvoir changer de type pendant l'exécution du programme", correct: false}
      - {text: "À pouvoir être lu depuis l'extérieur de la classe, bien que privé", correct: false}
    answer: "`mutable` lève la constance pour un membre. On le réserve à l'état que l'utilisateur de la classe ne voit pas."
  - key: ou-corriger
    format: course
    question: "Une fonction `afficher(const Panier& p)` ne compile pas, car `p.total()` n'est pas `const`. Où corrige-t-on ?"
    choices:
      - {text: "Dans la classe : on déclare `int total() const;`", correct: true}
      - {text: "Dans `afficher` : on reçoit `Panier& p`, sans `const`", correct: false}
      - {text: "Dans `afficher` : on écrit `const_cast<Panier&>(p).total()`", correct: false}
      - {text: "Dans la classe : on déclare `total` avec `static`", correct: false}
    answer: "`total` ne modifie pas le panier : c'est elle qui a oublié de le dire. Retirer le `const` de l'appelant propagerait le défaut vers ses propres appelants."
  - key: vf-const-fonction
    format: true-false
    question: "Dans une fonction membre `const`, on peut affecter une nouvelle valeur à un membre déclaré `mutable`."
    truth: true
    answer: "`mutable` lève la constance pour ce membre. Les membres ordinaires, eux, ne sont pas modifiables : `this` désigne un objet constant."
  - key: vf-temporaire
    format: true-false
    question: "On peut passer un objet temporaire à un paramètre `const std::string&`."
    truth: true
    answer: "Une référence constante se lie à un temporaire. Une référence non constante, `std::string&`, le refuse."
  - key: vf-constexpr
    format: true-false
    question: "Une variable `const` est toujours connue à la compilation."
    truth: false
    answer: "`const` interdit la modification après l'initialisation, qui peut se faire à l'exécution. La valeur connue à la compilation, c'est `constexpr`."
  - key: vf-const-cast
    format: true-false
    question: "Modifier, à travers un `const_cast`, un objet déclaré `const` est un comportement indéfini."
    truth: true
    answer: "`const_cast` retire le qualificatif pour le compilateur, pas pour l'objet. S'il a été déclaré constant, l'écrire est indéfini."
  - key: qcm-accesseur
    format: multiple-choice
    question: "Quelle déclaration convient à un accesseur qui renvoie le nom, sans copie ni modification ?"
    choices:
      - {text: "`const std::string& nom() const;`", correct: true}
      - {text: "`std::string& nom();`", correct: false}
      - {text: "`std::string nom();`", correct: false}
      - {text: "`const std::string& nom();`", correct: false}
    answer: "Le premier `const` protège le membre renvoyé ; le second permet d'appeler la fonction sur un objet constant. Sans le second, l'accesseur est inutilisable à travers une référence constante."
  - key: qcm-pointeur
    format: multiple-choice
    question: "Quelle déclaration interdit de modifier l'entier désigné, mais permet de faire désigner au pointeur un autre entier ?"
    choices:
      - {text: "`const int* p`", correct: true}
      - {text: "`int* const p`", correct: false}
      - {text: "`const int* const p`", correct: false}
      - {text: "`int* p`", correct: false}
    answer: "`const` à gauche de l'étoile porte sur l'objet désigné. À droite, il porte sur le pointeur lui-même."
  - key: qcm-erreur
    format: multiple-choice
    question: "Quel message obtient-on en appelant une fonction non `const` sur un objet constant ?"
    choices:
      - {text: "« passing 'const Panier' as 'this' argument discards qualifiers »", correct: true}
      - {text: "« undefined reference to 'Panier::total()' »", correct: false}
      - {text: "« 'total' was not declared in this scope »", correct: false}
      - {text: "« use of deleted function 'Panier::total()' »", correct: false}
    answer: "« Discards qualifiers » : l'appel ferait perdre son `const` à l'objet. Le remède est de déclarer la fonction `const`, si elle ne modifie rien."
  - key: qcm-parametre
    format: multiple-choice
    question: "Lequel de ces `const` ne promet rien à l'appelant ?"
    choices:
      - {text: "`void f(const int n)`", correct: true}
      - {text: "`void f(const std::string& s)`", correct: false}
      - {text: "`void f(const Client* c)`", correct: false}
      - {text: "`int taille() const`", correct: false}
    answer: "`n` est une copie : que la fonction la modifie ou non ne change rien pour l'appelant. Les trois autres protègent un objet qui lui appartient."
  - key: bug-accesseur-non-const
    format: bug-fix
    question: |-
      Le compilateur répond « passing 'const Panier' as 'this' argument discards qualifiers ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      class Panier {
      public:
          int total() { return total_; }

      private:
          int total_ = 42;
      };

      void afficher(const Panier& panier) {
          std::println("{}", panier.total());
      }

      int main() {
          afficher(Panier{});
      }
      ```
    choices:
      - {text: "Déclarer `int total() const { return total_; }`", correct: true}
      - {text: "Déclarer `void afficher(Panier& panier)`", correct: false}
      - {text: "Déclarer `const int total() { return total_; }`", correct: false}
      - {text: "Déclarer `mutable int total_ = 42;`", correct: false}
    answer: |-
      ```cpp
      int total() const { return total_; }
      ```
      `total` ne modifie rien, mais ne le dit pas. `const` avant le type de retour ne concerne que la valeur
      renvoyée. Et avec `Panier&`, `afficher(Panier{})` ne compilerait plus : un temporaire ne se lie pas à une
      référence non constante.
  - key: bug-parametre-non-const
    format: bug-fix
    question: |-
      Le compilateur refuse l'appel `longueur("bonjour")` : il ne peut pas lier un temporaire à `std::string&`.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      std::size_t longueur(std::string& texte) {
          return texte.size();
      }

      int main() {
          std::println("{}", longueur("bonjour"));
      }
      ```
    choices:
      - {text: "Recevoir `const std::string& texte`", correct: true}
      - {text: "Recevoir `std::string* texte`", correct: false}
      - {text: "Recevoir `std::string&& texte`, et rien d'autre", correct: false}
      - {text: "Recevoir `volatile std::string& texte`", correct: false}
    answer: |-
      ```cpp
      std::size_t longueur(const std::string& texte) {
      ```
      La fonction ne fait que lire : elle doit le promettre. Une référence constante accepte un temporaire, un
      objet constant et un objet ordinaire. `std::string&&` refuserait une variable.
  - key: bug-modification-dans-const
    format: bug-fix
    question: |-
      Le compilateur répond « increment of member 'Compteur::lectures_' in read-only object ». Ce compteur ne sert
      qu'aux statistiques. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compteur {
      public:
          int valeur() const {
              ++lectures_;
              return valeur_;
          }

      private:
          int valeur_ = 7;
          int lectures_ = 0;
      };

      int main() {
          const Compteur c;
          std::println("{}", c.valeur());
      }
      ```
    choices:
      - {text: "Déclarer `mutable int lectures_ = 0;`", correct: true}
      - {text: "Déclarer `const int lectures_ = 0;`", correct: false}
      - {text: "Retirer `const` de la fonction `valeur()`", correct: false}
      - {text: "Écrire `const_cast<int>(lectures_)++;`", correct: false}
    answer: |-
      ```cpp
      mutable int lectures_ = 0;
      ```
      `lectures_` ne fait pas partie de l'état observable de l'objet : `mutable` est fait pour ce cas. Retirer
      `const` de `valeur()` l'interdirait sur un objet constant, comme `c`.
  - key: bug-const-cast
    format: bug-fix
    question: |-
      Ce programme modifie une constante à travers un `const_cast`. Son comportement est indéfini. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      void remettre_a_zero(const int& compteur) {
          const_cast<int&>(compteur) = 0;
      }

      int main() {
          const int limite = 10;
          remettre_a_zero(limite);
          std::println("{}", limite);
      }
      ```
    choices:
      - {text: "Recevoir `int& compteur`, et ne plus passer de constante à la fonction", correct: true}
      - {text: "Écrire `static_cast<int&>(compteur) = 0;` à la place du `const_cast`", correct: false}
      - {text: "Déclarer la fonction `remettre_a_zero` avec le mot-clé `constexpr`", correct: false}
      - {text: "Déclarer `limite` avec `static const int`", correct: false}
    answer: |-
      ```cpp
      void remettre_a_zero(int& compteur) {
          compteur = 0;
      }
      ```
      Une fonction qui modifie son argument doit le dire dans sa signature. Le compilateur refusera alors
      `remettre_a_zero(limite)`, ce qui est le bon comportement : on ne remet pas une constante à zéro.
  - key: situation-cascade
    format: scenario
    question: |-
      Tu ajoutes `const` à un paramètre `Rapport& r` d'une fonction qui ne fait que lire. Vingt erreurs
      apparaissent : les fonctions membres de `Rapport` appelées ne sont pas `const`. Que fais-tu ?
    choices:
      - {text: "J'ajoute `const` aux fonctions membres de `Rapport` qui ne modifient pas l'objet", correct: true}
      - {text: "Je retire le `const` du paramètre, puisqu'il ne compile pas", correct: false}
      - {text: "J'ajoute un `const_cast` à chacun des vingt appels", correct: false}
      - {text: "Je déclare tous les membres de `Rapport` avec `mutable`", correct: false}
    answer: |-
      Les erreurs montrent un défaut ancien : ces fonctions de lecture n'ont jamais déclaré qu'elles ne modifient
      rien. On corrige à la source. C'est la raison d'écrire `const` dès le début : plus tard, la correction se
      fait en cascade.
  - key: situation-cache
    format: scenario
    question: |-
      Une fonction `double aire() const` fait un calcul coûteux. Tu veux mémoriser le résultat dans un membre au
      premier appel, sans retirer `const` à la fonction. Comment fais-tu ?
    choices:
      - {text: "Je déclare le membre du cache `mutable`", correct: true}
      - {text: "Je déclare le membre du cache `static`", correct: false}
      - {text: "Je retire `const` de `aire()` et de tous ses appelants", correct: false}
      - {text: "Je range le cache dans une variable globale", correct: false}
    answer: |-
      Le cache ne change pas ce que l'objet vaut pour ses utilisateurs : `aire()` renvoie la même chose avant et
      après. `mutable` exprime cela. Si l'objet est partagé entre threads, le cache doit aussi être protégé.
  - key: situation-revue
    format: scenario
    question: |-
      En revue de code, une fonction a pour signature `void traiter(std::vector<Commande>& commandes)`. Son corps
      ne fait que parcourir le vecteur et additionner des montants. Que demandes-tu ?
    choices:
      - {text: "De recevoir `const std::vector<Commande>&` : la signature doit dire qu'elle ne modifie rien", correct: true}
      - {text: "De recevoir le vecteur par valeur, pour être sûr qu'elle ne le modifie pas", correct: false}
      - {text: "De recevoir un pointeur `std::vector<Commande>*`, plus explicite à l'appel", correct: false}
      - {text: "De ne rien changer : seul le corps de la fonction compte", correct: false}
    answer: |-
      Une référence non constante annonce une modification : l'appelant doit lire le corps pour se rassurer, et ne
      peut pas passer un vecteur constant. Avec `const`, le contrat est dans la signature, et le compilateur le
      fait respecter. Par valeur, tout le vecteur serait copié.
  - key: situation-threads
    format: scenario
    question: |-
      Une table de configuration est construite au démarrage, puis lue par vingt threads, sans jamais changer. Un
      collègue veut la protéger par un mutex. Que proposes-tu ?
    choices:
      - {text: "La partager par référence constante : sans écriture, aucune synchronisation n'est nécessaire", correct: true}
      - {text: "La copier dans chaque thread, pour qu'aucun ne partage rien", correct: false}
      - {text: "La déclarer `volatile`, pour que les threads voient ses changements", correct: false}
      - {text: "La protéger par un mutex par thread, soit vingt mutex", correct: false}
    answer: |-
      Une course aux données exige au moins une écriture. Des données immuables se lisent en parallèle sans
      verrou, et `const` garantit, à la compilation, que personne ne les modifie.
