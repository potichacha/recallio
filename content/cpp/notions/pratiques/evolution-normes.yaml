notion: evolution-normes
lesson: |-
  C++ est normalisé par l'ISO. Depuis 2011, une nouvelle norme paraît **tous les trois ans**, et chacune porte
  l'année de sa publication. Savoir ce que chacune a apporté permet de lire du code de toute époque, et de savoir
  ce qu'un compilateur donné autorise.

  | Norme | Surnom | Les apports à retenir |
  |---|---|---|
  | **C++98** / C++03 | le C++ « classique » | classes, templates, exceptions, la STL : conteneurs, itérateurs, algorithmes |
  | **C++11** | le C++ « moderne » | `auto`, lambdas, **sémantique de déplacement**, pointeurs intelligents, `nullptr`, boucle sur un intervalle, `constexpr`, `enum class`, `override`, templates variadiques, `std::thread`, `unordered_map` |
  | **C++14** | les finitions | lambdas génériques, `std::make_unique`, déduction du type de retour, séparateur `'` dans les nombres |
  | **C++17** | | liaisons structurées, `if` avec initialisation, `std::optional`, `std::variant`, `std::string_view`, `std::filesystem`, déduction des arguments de classe (CTAD), `if constexpr`, élision de copie garantie, `[[nodiscard]]` |
  | **C++20** | les « quatre grands » | **concepts**, **ranges**, **modules**, **coroutines** ; et aussi `<=>`, `std::format`, `std::span`, `std::jthread`, `consteval` |
  | **C++23** | | `std::print`, `std::expected`, `import std;`, `deducing this`, `std::flat_map`, `std::mdspan`, compléments aux ranges |
  | **C++26** | en préparation | réflexion à la compilation, contrats |

  **C++11 est la grande rupture.** Le langage a tant changé qu'on parle de « C++ moderne » à partir de là. Trois
  apports ont transformé l'écriture courante :

  - le **déplacement**, qui rend peu coûteux de renvoyer et de ranger de gros objets ;
  - les **pointeurs intelligents**, qui retirent `new` et `delete` du code ordinaire ;
  - les **lambdas** et `auto`, qui rendent la bibliothèque d'algorithmes agréable à utiliser.

  **C++20 est la seconde.** Les concepts donnent enfin des messages d'erreur lisibles aux templates ; les ranges
  enchaînent les algorithmes ; les modules visent à remplacer les en-têtes.

  **La compatibilité ascendante.** Un programme valide dans une norme le reste, presque toujours, dans les
  suivantes. On retire très peu : `std::auto_ptr` et le mot-clé `register` ont disparu en C++17. C'est une force
  (du code de vingt ans compile encore) et un poids (les anciennes façons de faire restent permises).

  **Norme publiée ne veut pas dire disponible.** Les compilateurs implémentent chaque norme progressivement. On
  choisit la norme avec `-std=c++23`, et l'on vérifie le support d'une fonctionnalité sur cppreference.

  **Qui décide.** Le comité **WG21** de l'ISO, composé de volontaires : auteurs de compilateurs, entreprises,
  universitaires. Chaque ajout passe par une proposition écrite, discutée et votée.

  **En entretien** : « C++11 a apporté le déplacement, les pointeurs intelligents, `auto` et les lambdas : c'est
  le début du C++ moderne. C++17 a ajouté `optional`, `variant`, `string_view` et les liaisons structurées ;
  C++20, les concepts, les ranges, les modules et les coroutines ; C++23, `std::print` et `std::expected`. Une
  norme tous les trois ans, avec compatibilité ascendante. »
cards:
  - key: rythme
    format: course
    question: "À quel rythme les normes C++ paraissent-elles depuis 2011 ?"
    choices:
      - {text: "Tous les trois ans", correct: true}
      - {text: "Tous les ans", correct: false}
      - {text: "Tous les dix ans", correct: false}
      - {text: "Sans rythme fixe, quand le comité est prêt", correct: false}
    answer: "C++11, C++14, C++17, C++20, C++23, puis C++26. Ce qui est prêt à la date prévue entre dans la norme ; le reste attend la suivante."
  - key: cpp11
    format: course
    question: "Pourquoi parle-t-on de « C++ moderne » à partir de C++11 ?"
    choices:
      - {text: "Il a apporté le déplacement, les pointeurs intelligents, `auto` et les lambdas", correct: true}
      - {text: "Il a apporté les classes, les templates et les exceptions", correct: false}
      - {text: "Il a supprimé les pointeurs bruts et les macros du langage", correct: false}
      - {text: "Il a apporté les concepts, les modules et les coroutines", correct: false}
    answer: "Ces ajouts ont changé la façon d'écrire tous les jours : plus de `new` et `delete` à la main, des retours par valeur peu coûteux. Les concepts et les modules sont de C++20."
  - key: cpp20
    format: course
    question: "Quels sont les quatre grands apports de C++20 ?"
    choices:
      - {text: "Les concepts, les ranges, les modules et les coroutines", correct: true}
      - {text: "Les lambdas, `auto`, `nullptr` et les pointeurs intelligents", correct: false}
      - {text: "`std::optional`, `std::variant`, `std::any` et `std::string_view`", correct: false}
      - {text: "Les classes, les templates, les exceptions et la STL", correct: false}
    answer: "C++20 est la plus grosse mise à jour depuis C++11. Il apporte aussi l'opérateur `<=>`, `std::format`, `std::span` et `std::jthread`."
  - key: compatibilite
    format: course
    question: "Que devient un programme C++11 valide quand on le compile en C++23 ?"
    choices:
      - {text: "Il compile presque toujours : les normes restent compatibles avec les précédentes", correct: true}
      - {text: "Il doit être réécrit : chaque norme remplace la précédente", correct: false}
      - {text: "Il compile, mais s'exécute dans un mode de compatibilité plus lent", correct: false}
      - {text: "Il est refusé : `-std=c++23` n'accepte que du code écrit pour C++23", correct: false}
    answer: "La compatibilité ascendante est un principe du comité. Très peu de choses ont été retirées, comme `std::auto_ptr` en C++17."
  - key: vf-optional
    format: true-false
    question: "`std::optional` et `std::variant` sont arrivés avec C++17."
    truth: true
    answer: "Avec `std::any`, `std::string_view` et `std::filesystem`."
  - key: vf-make-unique
    format: true-false
    question: "`std::make_unique` existe depuis C++11, comme `std::unique_ptr`."
    truth: false
    answer: "`std::unique_ptr` et `std::make_shared` sont de C++11, mais `std::make_unique` a été oublié : il est arrivé avec C++14."
  - key: vf-print
    format: true-false
    question: "`std::print` et `std::println` sont arrivés avec C++23."
    truth: true
    answer: "Ils s'appuient sur `std::format`, de C++20."
  - key: vf-disponible
    format: true-false
    question: "Dès qu'une norme est publiée, tous les compilateurs en offrent toutes les fonctionnalités."
    truth: false
    answer: "L'implémentation prend des années, fonctionnalité par fonctionnalité. Les modules de C++20 en sont l'exemple."
  - key: qcm-lambdas
    format: multiple-choice
    question: "Quelle norme a introduit les lambdas ?"
    choices:
      - {text: "C++11", correct: true}
      - {text: "C++98", correct: false}
      - {text: "C++17", correct: false}
      - {text: "C++20", correct: false}
    answer: "C++11. Les lambdas génériques, avec `auto` en paramètre, ont suivi en C++14."
  - key: qcm-liaisons-structurees
    format: multiple-choice
    question: "Quelle norme a introduit les liaisons structurées, comme `auto [cle, valeur] = paire;` ?"
    choices:
      - {text: "C++17", correct: true}
      - {text: "C++11", correct: false}
      - {text: "C++14", correct: false}
      - {text: "C++23", correct: false}
    answer: "C++17, avec le `if` à initialisation et la déduction des arguments de classe."
  - key: qcm-expected
    format: multiple-choice
    question: "Quelle norme a introduit `std::expected` ?"
    choices:
      - {text: "C++23", correct: true}
      - {text: "C++17", correct: false}
      - {text: "C++20", correct: false}
      - {text: "C++11", correct: false}
    answer: "C++23. `std::optional`, son cousin sans erreur, date de C++17."
  - key: qcm-retire
    format: multiple-choice
    question: "Lequel de ces éléments a été retiré du langage, en C++17 ?"
    choices:
      - {text: "`std::auto_ptr`", correct: true}
      - {text: "`std::vector`", correct: false}
      - {text: "Les pointeurs bruts", correct: false}
      - {text: "Les macros du préprocesseur", correct: false}
    answer: "`std::auto_ptr`, un premier essai de pointeur intelligent dont la copie déplaçait en silence, a été remplacé par `std::unique_ptr`."
  - key: definition-norme
    format: definition
    question: "Que désigne « C++20 » ?"
    choices:
      - {text: "La version de la norme ISO du langage publiée en 2020", correct: true}
      - {text: "La vingtième version du compilateur GCC", correct: false}
      - {text: "Une bibliothèque de vingt composants ajoutée à la STL", correct: false}
      - {text: "Un compilateur écrit en 2020 par Bjarne Stroustrup", correct: false}
    answer: "Chaque norme porte les deux derniers chiffres de son année. Les compilateurs l'activent par une option comme `-std=c++20`."
  - key: definition-wg21
    format: definition
    question: "Qu'est-ce que le WG21 ?"
    choices:
      - {text: "Le comité de l'ISO qui fait évoluer la norme C++", correct: true}
      - {text: "La vingt et unième version de la bibliothèque standard", correct: false}
      - {text: "L'équipe qui développe le compilateur GCC", correct: false}
      - {text: "Un avertissement du compilateur sur le code ancien", correct: false}
    answer: "*Working Group 21*. Ses membres, volontaires, examinent et votent les propositions d'évolution du langage et de sa bibliothèque."
  - key: definition-compatibilite-ascendante
    format: definition
    question: "Que veut dire « compatibilité ascendante », pour les normes C++ ?"
    choices:
      - {text: "Qu'un code valide dans une norme le reste dans les normes suivantes", correct: true}
      - {text: "Qu'un code écrit pour la dernière norme compile avec un ancien compilateur", correct: false}
      - {text: "Que chaque norme compile plus vite que la précédente", correct: false}
      - {text: "Que deux compilateurs produisent le même fichier objet", correct: false}
    answer: "Les nouvelles normes ajoutent sans casser, à de rares exceptions près. C'est pourquoi les anciennes façons d'écrire restent permises."
  - key: definition-cpp-moderne
    format: definition
    question: "Qu'appelle-t-on le « C++ moderne » ?"
    choices:
      - {text: "Le style rendu possible par C++11 et les normes suivantes : RAII, déplacement, pointeurs intelligents", correct: true}
      - {text: "Le code C++ écrit après 2020, quelle que soit la façon dont il est écrit", correct: false}
      - {text: "Le sous-ensemble du C++ compatible avec le langage C", correct: false}
      - {text: "Le code C++ qui n'utilise ni classe ni template", correct: false}
    answer: "C'est une façon d'écrire, plus qu'une date : pas de `new` ni de `delete` nus, `auto`, lambdas et algorithmes, valeurs et déplacement."
