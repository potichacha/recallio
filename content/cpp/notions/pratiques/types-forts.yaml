notion: types-forts
lesson: |-
  Un `int` peut être un identifiant de client, un nombre de secondes, un prix en centimes ou un indice. Le
  compilateur ne les distingue pas : il accepte qu'on passe l'un pour l'autre. Un **type fort** donne à chaque
  **notion** son propre type, pour que la confusion devienne une **erreur de compilation**.

  **Le problème.**

  ```cpp
  void virer(int source, int cible, int montant);

  virer(montant, source, cible);     // compile, et vire n'importe quoi
  ```

  **La solution : un type par notion.**

  ```cpp
  struct IdCompte {
      explicit IdCompte(int valeur) : valeur{valeur} {}
      int valeur;
  };

  struct Centimes {
      explicit Centimes(long valeur) : valeur{valeur} {}
      long valeur;
  };

  void virer(IdCompte source, IdCompte cible, Centimes montant);

  virer(IdCompte{12}, IdCompte{34}, Centimes{5000});
  ```

  Inverser un compte et un montant ne compile plus, et l'appel se lit sans consulter la signature.

  **`explicit` est indispensable.** Sans lui, `virer(12, 34, 5000)` compilerait encore, par conversion implicite :
  le type n'apporterait rien.

  **Ce qu'on y gagne.**

  - Les **inversions d'arguments** sont refusées.
  - Les **unités** ne se mélangent plus : des mètres ne s'ajoutent pas à des secondes.
  - Les **opérations dénuées de sens** disparaissent : multiplier deux identifiants ne compile pas, puisqu'on n'a
    pas écrit l'opérateur.
  - Les **invariants** se vérifient une fois, dans le constructeur : un `Pourcentage` est toujours entre 0 et 100.

  **Les outils du langage.**

  - **`enum class`** pour un ensemble fermé de valeurs, à la place d'un `int` ou d'un `bool` : `Ordre::Croissant`
    plutôt que `true`.
  - **Les littéraux et `std::chrono`** pour les durées : `attendre(500ms)` ne se confond pas avec des secondes.
  - **Un template d'étiquette** pour ne pas réécrire la même `struct` :

  ```cpp
  template <typename T, typename Etiquette>
  struct Fort {
      explicit Fort(T valeur) : valeur{std::move(valeur)} {}
      T valeur;
      auto operator<=>(const Fort&) const = default;
  };

  using IdClient = Fort<int, struct EtiquetteClient>;
  using IdCommande = Fort<int, struct EtiquetteCommande>;
  ```

  `IdClient` et `IdCommande` sont deux types distincts, bien qu'ils contiennent tous deux un `int`.

  **Un alias n'est pas un type fort.** `using IdClient = int;` ne crée **aucun** nouveau type : c'est un autre nom
  pour `int`, et tout se mélange comme avant.

  **Le coût à l'exécution est nul** : une `struct` d'un entier se passe dans un registre, comme l'entier. Le coût
  est d'écriture : il faut fournir les opérateurs dont on a besoin.

  **Sans excès.** On vise les notions qui **se confondent** et dont la confusion **coûte** : identifiants, unités,
  montants. Pas chaque compteur de boucle.

  **En entretien** : « Je remplace les entiers nus par des types forts : une `struct` avec un constructeur
  `explicit`, ou un `enum class`. Inverser deux arguments ou mélanger deux unités devient une erreur de
  compilation, sans coût à l'exécution. Un simple alias `using` ne protège de rien. »
cards:
  - key: principe
    format: course
    question: "Qu'est-ce qu'un type fort ?"
    choices:
      - {text: "Un type propre à une notion, que le compilateur ne confond pas avec un autre", correct: true}
      - {text: "Un type entier de grande taille, qui ne peut pas déborder", correct: false}
      - {text: "Un type dont les objets ne peuvent jamais être copiés", correct: false}
      - {text: "Un type vérifié seulement à l'exécution du programme", correct: false}
    answer: "`IdClient` et `Centimes` contiennent chacun un entier, mais ne sont pas interchangeables : l'erreur de logique devient une erreur de compilation."
  - key: probleme
    format: course
    question: "Quel défaut a la signature `void virer(int source, int cible, int montant)` ?"
    choices:
      - {text: "Le compilateur accepte les trois arguments dans n'importe quel ordre", correct: true}
      - {text: "Le compilateur copie les trois arguments, ce qui est trop lent", correct: false}
      - {text: "Le compilateur refuse trois paramètres du même type", correct: false}
      - {text: "Le compilateur ne sait pas additionner trois entiers", correct: false}
    answer: "Trois `int` se ressemblent : inverser un compte et un montant compile sans avertissement."
  - key: explicit
    format: course
    question: "Pourquoi le constructeur d'un type fort est-il `explicit` ?"
    choices:
      - {text: "Sinon un entier nu se convertirait en silence, et la protection disparaîtrait", correct: true}
      - {text: "Sinon l'objet ne pourrait pas être passé par valeur", correct: false}
      - {text: "Sinon le type ne pourrait pas contenir d'entier", correct: false}
      - {text: "Sinon le constructeur serait appelé à l'exécution au lieu de la compilation", correct: false}
    answer: "Avec une conversion implicite, `virer(12, 34, 5000)` compilerait encore. `explicit` oblige à écrire `IdCompte{12}`."
  - key: alias
    format: course
    question: "Pourquoi `using IdClient = int;` n'est-il pas un type fort ?"
    choices:
      - {text: "Un alias est un autre nom pour le même type : `IdClient` et `int` se mélangent", correct: true}
      - {text: "Un alias ne peut pas être utilisé comme type de paramètre", correct: false}
      - {text: "Un alias occupe plus de mémoire que le type d'origine", correct: false}
      - {text: "Un alias n'est visible que dans le fichier où il est déclaré", correct: false}
    answer: "Le compilateur ne voit que des `int`. L'alias documente, mais ne vérifie rien."
  - key: vf-cout
    format: true-false
    question: "Envelopper un `int` dans une `struct` ralentit le programme à l'exécution."
    truth: false
    answer: "Une `struct` d'un seul entier a la même représentation que l'entier. L'abstraction ne coûte rien."
  - key: vf-enum-class
    format: true-false
    question: "Un `enum class` à la place d'un paramètre `bool` rend l'appel plus lisible et plus sûr."
    truth: true
    answer: "`trier(v, Ordre::Decroissant)` se lit seul, et ne se confond pas avec un autre booléen. `trier(v, true)` ne dit rien."
  - key: vf-operations
    format: true-false
    question: "Avec un type fort `IdClient`, multiplier deux identifiants compile par défaut."
    truth: false
    answer: "La `struct` n'a que les opérations qu'on lui donne. Les opérations absurdes n'existent pas."
  - key: vf-etiquette
    format: true-false
    question: "Deux instanciations d'un même template avec deux étiquettes différentes sont deux types distincts."
    truth: true
    answer: "`Fort<int, struct A>` et `Fort<int, struct B>` ne se convertissent pas l'un en l'autre."
  - key: qcm-duree
    format: multiple-choice
    question: "Quelle signature empêche de confondre des secondes et des millisecondes ?"
    choices:
      - {text: "`void attendre(std::chrono::milliseconds duree);`", correct: true}
      - {text: "`void attendre(int duree);`", correct: false}
      - {text: "`void attendre(double duree);`", correct: false}
      - {text: "`void attendre(long duree_ms);`", correct: false}
    answer: "`std::chrono` porte l'unité dans le type : `attendre(2s)` est converti correctement, `attendre(2)` ne compile pas."
  - key: qcm-bool
    format: multiple-choice
    question: "Par quoi remplaces-tu le paramètre `bool` de `ouvrir(chemin, true)` ?"
    choices:
      - {text: "Par un `enum class Mode { Lecture, Ecriture }`", correct: true}
      - {text: "Par un `int` qui vaut 0 ou 1", correct: false}
      - {text: "Par un `char` qui vaut `'o'` ou `'n'`", correct: false}
      - {text: "Par un second paramètre `bool`", correct: false}
    answer: "`ouvrir(chemin, Mode::Ecriture)` se comprend à l'appel. Un entier ou un caractère restent des valeurs sans nom."
  - key: qcm-invariant
    format: multiple-choice
    question: "Où vérifies-tu qu'un `Pourcentage` est compris entre 0 et 100 ?"
    choices:
      - {text: "Dans son constructeur, une fois pour toutes", correct: true}
      - {text: "Dans chaque fonction qui reçoit un `Pourcentage`", correct: false}
      - {text: "Dans la fonction `main`, au démarrage", correct: false}
      - {text: "Nulle part : un type fort n'a pas d'invariant", correct: false}
    answer: "Un objet construit est valide. Les fonctions qui le reçoivent n'ont plus à vérifier."
  - key: qcm-ou
    format: multiple-choice
    question: "Pour quelle donnée un type fort est-il le plus utile ?"
    choices:
      - {text: "Un identifiant de commande, passé à côté d'un identifiant de client", correct: true}
      - {text: "Un compteur de boucle `for`, local à une fonction", correct: false}
      - {text: "Une variable temporaire, au milieu d'un calcul local", correct: false}
      - {text: "Le code de retour de `main`", correct: false}
    answer: "Deux notions de même représentation, voisines dans les signatures : c'est là que la confusion arrive et coûte."
  - key: situation-inversion
    format: scenario
    question: |-
      Un bug de production : `rembourser(idCommande, idClient)` était appelée avec les deux arguments inversés, tous
      deux des `int`. Le remboursement est parti chez un autre client. Comment empêches-tu que cela se reproduise ?
    choices:
      - {text: "Deux types distincts, `IdClient` et `IdCommande`, à constructeur `explicit`", correct: true}
      - {text: "Deux alias, `using IdClient = int;` et `using IdCommande = int;`", correct: false}
      - {text: "Un commentaire au-dessus de la fonction, qui donne l'ordre des paramètres", correct: false}
      - {text: "Des noms de paramètres plus longs dans la déclaration", correct: false}
    answer: |-
      Seul un type vérifié par le compilateur rend l'inversion impossible. Alias, commentaires et noms ne sont lus
      que par des humains.
  - key: situation-unites
    format: scenario
    question: |-
      Une fonction `definir_delai(int delai)` attend des millisecondes. Un appelant passe `30`, croyant donner des
      secondes : le service coupe les connexions après 30 ms. Que changes-tu ?
    choices:
      - {text: "Le paramètre devient `std::chrono::milliseconds` : l'appelant écrit `30s`, converti sans erreur", correct: true}
      - {text: "Le paramètre devient `double`, pour accepter des fractions de seconde", correct: false}
      - {text: "Le paramètre est renommé `delai_en_millisecondes_attention`", correct: false}
      - {text: "La fonction multiplie par mille les valeurs inférieures à cent", correct: false}
    answer: |-
      L'unité fait partie du type. Un entier nu ne compile plus, et une durée donnée dans une autre unité est
      convertie par la bibliothèque.
  - key: situation-booleens
    format: scenario
    question: |-
      En revue de code, tu lis `creer_fenetre("Titre", true, false, true)`. Personne ne sait ce que valent les trois
      booléens sans ouvrir la déclaration. Que proposes-tu ?
    choices:
      - {text: "Un `enum class` par option, ou une `struct` d'options aux champs nommés", correct: true}
      - {text: "Trois entiers à la place des trois booléens", correct: false}
      - {text: "Un commentaire après chaque argument, à chaque appel", correct: false}
      - {text: "Un seul entier dont les bits codent les trois options", correct: false}
    answer: |-
      `creer_fenetre("Titre", Redimensionnable::Oui, PleinEcran::Non, Bordure::Oui)` se lit seul, et deux options ne
      peuvent plus être échangées.
  - key: situation-exces
    format: scenario
    question: |-
      Enthousiaste, un collègue veut un type fort pour chaque entier du projet, compteurs de boucle compris. Que
      lui réponds-tu ?
    choices:
      - {text: "De viser les notions qui se confondent et dont la confusion coûte : identifiants, unités, montants", correct: true}
      - {text: "Qu'il a raison : aucun `int` ne devrait subsister dans un projet C++", correct: false}
      - {text: "Qu'il a tort : un type fort ralentit toujours le programme", correct: false}
      - {text: "Qu'il vaut mieux remplacer tous les entiers par des `double`", correct: false}
    answer: |-
      Un type fort se paie en code à écrire et à lire. Il se justifie là où une erreur est plausible et grave, pas
      pour un indice local.
  - key: bug-inversion
    format: bug-fix
    question: |-
      Ce programme devrait afficher `rectangle 3 x 5`. Il affiche `rectangle 5 x 3` : les arguments sont inversés à
      l'appel, et le compilateur n'a rien dit. Quelle correction rend cette erreur impossible ?
      ```cpp
      #include <print>

      void dessiner(int largeur, int hauteur) {
          std::println("rectangle {} x {}", largeur, hauteur);
      }

      int main() {
          const int hauteur = 5;
          const int largeur = 3;
          dessiner(hauteur, largeur);
      }
      ```
    choices:
      - {text: "Deux types `Largeur` et `Hauteur`, à constructeur `explicit`, comme paramètres", correct: true}
      - {text: "Deux alias `using Largeur = int;` et `using Hauteur = int;`", correct: false}
      - {text: "Deux paramètres de type `long` à la place de `int`", correct: false}
      - {text: "Deux paramètres passés par référence constante", correct: false}
    answer: |-
      ```cpp
      struct Largeur { explicit Largeur(int v) : valeur{v} {} int valeur; };
      struct Hauteur { explicit Hauteur(int v) : valeur{v} {} int valeur; };

      void dessiner(Largeur largeur, Hauteur hauteur);
      ```
      `dessiner(Hauteur{5}, Largeur{3})` ne compile plus. Des alias ou un autre type entier laisseraient passer
      l'inversion.
  - key: bug-sans-explicit
    format: bug-fix
    question: |-
      Ce type devrait empêcher de passer un entier nu. Pourtant `expedier(42)` compile. Quelle correction est la
      bonne ?
      ```cpp
      #include <print>

      struct IdColis {
          IdColis(int valeur) : valeur{valeur} {}
          int valeur;
      };

      void expedier(IdColis colis) {
          std::println("{}", colis.valeur);
      }

      int main() {
          expedier(42);
      }
      ```
    choices:
      - {text: "Déclarer le constructeur `explicit IdColis(int valeur)`", correct: true}
      - {text: "Déclarer le membre `const int valeur;`", correct: false}
      - {text: "Déclarer le paramètre `const IdColis& colis`", correct: false}
      - {text: "Déclarer la `struct` avec le mot-clé `final`", correct: false}
    answer: |-
      ```cpp
      explicit IdColis(int valeur) : valeur{valeur} {}
      ```
      Un constructeur à un argument sert de conversion implicite : `42` devient un `IdColis` en silence. Avec
      `explicit`, il faut écrire `expedier(IdColis{42})`.
  - key: bug-alias
    format: bug-fix
    question: |-
      Ce programme additionne des mètres et des secondes, et affiche `15`. Le compilateur n'a rien dit. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      using Metres = double;
      using Secondes = double;

      int main() {
          const Metres distance = 10.0;
          const Secondes duree = 5.0;
          std::println("{}", distance + duree);
      }
      ```
    choices:
      - {text: "Faire de `Metres` et de `Secondes` deux `struct`, sans opérateur `+` entre elles", correct: true}
      - {text: "Déclarer les deux alias avec `typedef` à la place de `using`", correct: false}
      - {text: "Déclarer les deux variables avec `float` à la place de `double`", correct: false}
      - {text: "Déclarer `distance` et `duree` sans le mot-clé `const`", correct: false}
    answer: |-
      ```cpp
      struct Metres { double valeur; };
      struct Secondes { double valeur; };
      ```
      Un alias ne crée pas de type : les deux sont des `double`. Deux `struct` distinctes ne s'additionnent pas,
      faute d'opérateur : l'erreur d'unité est refusée à la compilation.
  - key: bug-bool
    format: bug-fix
    question: |-
      Ce programme devrait trier par ordre décroissant et afficher `3`. Il affiche `1` : le booléen a été compris
      à l'envers. Quelle correction rend l'appel sans ambiguïté ?
      ```cpp
      #include <algorithm>
      #include <print>
      #include <vector>

      void trier(std::vector<int>& v, bool croissant) {
          if (croissant) {
              std::sort(v.begin(), v.end());
          } else {
              std::sort(v.rbegin(), v.rend());
          }
      }

      int main() {
          std::vector<int> v{2, 3, 1};
          trier(v, true);
          std::println("{}", v[0]);
      }
      ```
    choices:
      - {text: "Un paramètre `enum class Ordre { Croissant, Decroissant }` à la place du `bool`", correct: true}
      - {text: "Un paramètre `int` qui vaut 1 ou -1 à la place du `bool`", correct: false}
      - {text: "Un paramètre `bool` renommé `ordre` dans la déclaration", correct: false}
      - {text: "Un second paramètre `bool`, qui confirme le premier", correct: false}
    answer: |-
      ```cpp
      enum class Ordre { Croissant, Decroissant };

      trier(v, Ordre::Decroissant);
      ```
      `true` ne dit pas ce qu'il active. Avec une énumération, l'intention est écrite à l'appel, et se lit sans la
      déclaration.
