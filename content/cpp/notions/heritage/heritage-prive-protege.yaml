notion: heritage-prive-protege
lesson: |-
  Le mot-clé écrit devant la classe de base dit **qui peut voir** la relation d'héritage, et ce que deviennent les
  membres hérités.

  ```cpp
  class A : public B {};      // héritage public
  class A : protected B {};   // héritage protégé
  class A : private B {};     // héritage privé (le défaut pour une class)
  ```

  **Ce que deviennent les membres de la base dans la classe dérivée.**

  | Dans la base | héritage `public` | héritage `protected` | héritage `private` |
  |---|---|---|---|
  | `public` | `public` | `protected` | `private` |
  | `protected` | `protected` | `protected` | `private` |
  | `private` | inaccessible | inaccessible | inaccessible |

  L'héritage ne peut que **restreindre** l'accès, jamais l'élargir.

  **Deux sens très différents.**

  - **Héritage public : « est un ».** Un `Cercle` **est une** `Forme`. Tout le monde peut convertir un
    `Cercle*` en `Forme*`, et appeler l'interface de `Forme` sur un `Cercle`.
  - **Héritage privé : « est implémenté avec ».** La classe dérivée **réutilise le code** de la base, mais
    l'extérieur n'en sait rien : la conversion vers la base est **interdite** hors de la classe, et les fonctions
    publiques de la base ne font pas partie de son interface.

  ```cpp
  class Pile : private std::vector<int> {
  public:
      void empiler(int x) { push_back(x); }
      using std::vector<int>::size;      // on republie ce qu'on veut exposer
  };

  Pile p;
  p.empiler(1);
  p.push_back(2);                        // erreur : inaccessible
  std::vector<int>& v = p;               // erreur : conversion interdite
  ```

  `using Base::membre;` dans la partie `public` rend à nouveau accessible un membre hérité.

  **Héritage privé ou composition ?** Presque toujours la **composition** : un membre du type voulu.

  ```cpp
  class Pile {
  public:
      void empiler(int x) { elements_.push_back(x); }
  private:
      std::vector<int> elements_;
  };
  ```

  Elle dit la même chose (« a un »), avec un couplage plus faible. L'héritage privé ne se justifie que lorsqu'il
  faut :

  - **redéfinir une fonction virtuelle** de la base ;
  - accéder à ses membres **`protected`** ;
  - profiter de l'optimisation de la **base vide** (une base sans donnée n'occupe pas de place).

  **Le défaut.** `class D : B` hérite en **privé** ; `struct D : B` hérite en **public**. Oublier `public` devant
  la base d'une `class` est une faute classique : le polymorphisme ne fonctionne plus.

  **L'héritage protégé** est très rare : la relation est connue de la classe et de ses propres dérivées.

  **En entretien** : « L'héritage public exprime "est un" : c'est le seul qui permet le polymorphisme vu de
  l'extérieur. L'héritage privé exprime "implémenté avec" ; je lui préfère la composition, sauf pour redéfinir une
  fonction virtuelle ou atteindre un membre protégé. »
cards:
  - key: public-est-un
    format: course
    question: "Que signifie l'héritage public ?"
    choices:
      - {text: "La classe dérivée « est une » classe de base : on peut l'utiliser partout où la base est attendue", correct: true}
      - {text: "La classe dérivée « contient une » classe de base, que l'extérieur ne voit pas", correct: false}
      - {text: "La classe dérivée rend publics tous les membres privés de la classe de base", correct: false}
      - {text: "La classe dérivée copie le code de la base, sans garder de lien avec elle", correct: false}
    answer: "L'interface publique de la base fait partie de celle de la dérivée, et la conversion vers la base est permise à tous. C'est la condition du polymorphisme."
  - key: prive
    format: course
    question: "Que deviennent les membres publics de la base dans un héritage privé ?"
    choices:
      - {text: "Ils deviennent privés dans la classe dérivée : l'extérieur ne peut plus les appeler", correct: true}
      - {text: "Ils restent publics dans la classe dérivée, comme dans la base", correct: false}
      - {text: "Ils deviennent inaccessibles, même dans la classe dérivée", correct: false}
      - {text: "Ils sont supprimés de la classe dérivée à la compilation", correct: false}
    answer: "La classe dérivée peut s'en servir dans ses propres fonctions. Pour ses utilisateurs, ils n'existent pas, sauf ceux qu'elle republie par `using`."
  - key: composition
    format: course
    question: "Que préfère-t-on en général à l'héritage privé, pour réutiliser le code d'une classe ?"
    choices:
      - {text: "La composition : un membre du type à réutiliser", correct: true}
      - {text: "L'héritage protégé, plus permissif", correct: false}
      - {text: "Une classe amie, qui accède à tout", correct: false}
      - {text: "Une copie du code de la classe", correct: false}
    answer: "Un membre exprime « a un » avec un couplage plus faible. L'héritage privé ne s'impose que pour redéfinir une fonction virtuelle ou atteindre un membre protégé."
  - key: defaut
    format: course
    question: "Quel est le mode d'héritage de `class Derivee : Base {};`, sans mot-clé devant `Base` ?"
    choices:
      - {text: "Privé : c'est le défaut pour une `class`", correct: true}
      - {text: "Public : c'est le défaut pour une `class`", correct: false}
      - {text: "Protégé : c'est le défaut pour une `class`", correct: false}
      - {text: "Aucun : le code ne compile pas sans mot-clé", correct: false}
    answer: "Pour une `class`, l'héritage est privé par défaut ; pour une `struct`, public. Oublier `public` est une faute fréquente."
  - key: vf-conversion
    format: true-false
    question: "Avec un héritage privé, le code extérieur peut convertir un pointeur vers la dérivée en pointeur vers la base."
    truth: false
    answer: "La relation d'héritage est invisible de l'extérieur : la conversion ne compile pas. Elle reste permise dans les fonctions membres de la dérivée."
  - key: vf-elargir
    format: true-false
    question: "L'héritage peut rendre public, dans la classe dérivée, un membre privé de la base."
    truth: false
    answer: "Les membres privés de la base restent inaccessibles à la dérivée, quel que soit le mode. L'héritage ne fait que restreindre."
  - key: vf-struct
    format: true-false
    question: "`struct Derivee : Base {};` hérite en public."
    truth: true
    answer: "Pour une `struct`, le défaut est `public`, pour les membres comme pour l'héritage."
  - key: vf-using
    format: true-false
    question: "Dans un héritage privé, `using Base::taille;` écrit dans la partie publique rend `taille` accessible de l'extérieur."
    truth: true
    answer: "La déclaration `using` republie le membre hérité, avec l'accès de la section où elle est écrite."
  - key: qcm-protected
    format: multiple-choice
    question: "Avec `class D : protected B`, que devient un membre public de `B` dans `D` ?"
    choices:
      - {text: "Protégé", correct: true}
      - {text: "Public", correct: false}
      - {text: "Privé", correct: false}
      - {text: "Inaccessible", correct: false}
    answer: "L'héritage protégé abaisse les membres publics au niveau `protected` : visibles de `D` et de ses dérivées, pas de l'extérieur."
  - key: qcm-justification
    format: multiple-choice
    question: "Dans quel cas l'héritage privé est-il justifié, plutôt que la composition ?"
    choices:
      - {text: "Quand il faut redéfinir une fonction virtuelle de la classe réutilisée", correct: true}
      - {text: "Quand la classe réutilisée a beaucoup de fonctions publiques", correct: false}
      - {text: "Quand on veut exposer toute l'interface de la classe réutilisée", correct: false}
      - {text: "Quand la classe réutilisée est un `std::vector`", correct: false}
    answer: "Un membre ne permet pas de redéfinir ses fonctions virtuelles ni d'atteindre ses membres protégés. Pour exposer toute l'interface, c'est l'héritage public."
  - key: qcm-polymorphisme
    format: multiple-choice
    question: "`class Cercle : Forme` oublie `public`. Quelle ligne, dans `main`, ne compile plus ?"
    choices:
      - {text: "`Forme* f = new Cercle;`", correct: true}
      - {text: "`Cercle c;`", correct: false}
      - {text: "`Cercle* p = new Cercle;`", correct: false}
      - {text: "`Cercle autre = Cercle{};`", correct: false}
    answer: "L'héritage est privé : hors de `Cercle`, la conversion vers `Forme*` est interdite. Le polymorphisme disparaît."
  - key: qcm-relation
    format: multiple-choice
    question: "Quelle relation exprime l'héritage privé ?"
    choices:
      - {text: "« est implémenté avec »", correct: true}
      - {text: "« est un »", correct: false}
      - {text: "« est ami de »", correct: false}
      - {text: "« est une copie de »", correct: false}
    answer: "C'est un détail d'implémentation, comme un membre. « Est un » est le sens de l'héritage public."
  - key: situation-pile
    format: scenario
    question: |-
      Un collègue écrit `class Pile : public std::vector<int>`, pour profiter de `push_back`. Les utilisateurs de
      la pile appellent maintenant `insert` au milieu, et cassent son principe. Que proposes-tu ?
    choices:
      - {text: "Un membre `std::vector<int>`, et seulement les fonctions d'une pile dans l'interface", correct: true}
      - {text: "Un commentaire qui interdit d'appeler `insert` sur une pile", correct: false}
      - {text: "Un héritage protégé, qui laisse `insert` aux utilisateurs", correct: false}
      - {text: "Une classe amie `std::vector<int>`, sans héritage", correct: false}
    answer: |-
      Une pile n'est pas un vecteur : elle en utilise un. L'héritage public expose toute l'interface de la base.
      La composition ne montre que `empiler`, `depiler` et `sommet`. `std::stack` est construit ainsi.
  - key: situation-substitution
    format: scenario
    question: |-
      Une fonction `void dessiner(const Forme& f)` refuse un `Carre`, déclaré `class Carre : Forme`. Le message
      parle d'une base inaccessible. Que s'est-il passé ?
    choices:
      - {text: "Sans `public`, l'héritage d'une `class` est privé : la conversion vers `Forme` est interdite", correct: true}
      - {text: "La classe `Forme` n'a pas de destructeur virtuel, ce qui bloque la conversion", correct: false}
      - {text: "Une référence constante ne peut pas désigner un objet d'une classe dérivée", correct: false}
      - {text: "La fonction `dessiner` devrait recevoir un pointeur, pas une référence", correct: false}
    answer: |-
      Le message de GCC est « 'Forme' is an inaccessible base of 'Carre' ». Il manque `public` devant `Forme`.
      C'est la raison pour laquelle on l'écrit toujours explicitement.
  - key: situation-virtuelle
    format: scenario
    question: |-
      Ta classe `Journal` doit réagir quand un minuteur expire. La bibliothèque fournit `class Minuteur` avec une
      fonction `virtual void expire()`. Tu ne veux pas que les utilisateurs de `Journal` voient l'interface du
      minuteur. Que choisis-tu ?
    choices:
      - {text: "L'héritage privé : `Journal` redéfinit `expire`, sans exposer `Minuteur`", correct: true}
      - {text: "L'héritage public : `Journal` est un minuteur comme un autre", correct: false}
      - {text: "Un membre `Minuteur`, dont on redéfinit `expire` depuis `Journal`", correct: false}
      - {text: "Une copie du code de `Minuteur` dans `Journal`", correct: false}
    answer: |-
      Redéfinir une fonction virtuelle exige d'hériter : un simple membre ne le permet pas. L'héritage privé garde
      la relation invisible. Une petite classe imbriquée qui hérite de `Minuteur`, tenue en membre, convient aussi.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Un `Carre` doit-il hériter publiquement de `Rectangle` ? » Que réponds-tu ?
    choices:
      - {text: "Non, si `Rectangle` laisse changer largeur et hauteur séparément : un carré trahirait cette promesse", correct: true}
      - {text: "Oui, toujours : en mathématiques, un carré est un rectangle, donc l'héritage public s'impose", correct: false}
      - {text: "Oui, mais en héritage protégé, pour cacher la largeur aux utilisateurs du carré", correct: false}
      - {text: "Non : une classe concrète ne peut hériter que d'une classe abstraite, jamais d'une autre", correct: false}
    answer: |-
      L'héritage public promet que la dérivée peut remplacer la base partout (principe de substitution de Liskov).
      Un code qui écrit `r.largeur(4); r.hauteur(5);` et attend une aire de 20 serait trahi par un carré.
  - key: code-using
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <vector>

      class Pile : private std::vector<int> {
      public:
          void empiler(int x) { push_back(x); }
          using std::vector<int>::size;
          using std::vector<int>::back;
      };

      int main() {
          Pile p;
          p.empiler(4);
          p.empiler(9);
          std::println("{} {}", p.size(), p.back());
      }
      ```
    choices:
      - {text: "`2 9`", correct: true}
      - {text: "`2 4`", correct: false}
      - {text: "`0 0`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`2 9` : `Pile` utilise `push_back` en interne, et ne republie que `size` et `back`."
    check:
      output: "2 9"
  - key: code-conversion-interdite
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Forme {
      public:
          int cotes() const { return 0; }
      };

      class Carre : Forme {};

      int main() {
          const Carre c;
          const Forme& f = c;
          std::println("{}", f.cotes());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : sans `public`, `Carre` hérite en privé. « 'Forme' is an inaccessible base of 'Carre' »."
    check:
      compiles: false
  - key: code-struct-public
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Forme {
          int cotes() const { return 4; }
      };

      struct Carre : Forme {};

      int main() {
          const Carre c;
          const Forme& f = c;
          std::println("{} {}", f.cotes(), c.cotes());
      }
      ```
    choices:
      - {text: "`4 4`", correct: true}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "`0 4`", correct: false}
      - {text: "`4 0`", correct: false}
    answer: "`4 4` : une `struct` hérite en public par défaut. La conversion vers `Forme` et l'appel de `cotes` sont permis."
    check:
      output: "4 4"
  - key: code-virtuelle-privee
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Minuteur {
      public:
          virtual ~Minuteur() = default;
          void declencher() { expire(); }

      protected:
          virtual void expire() { std::println("minuteur"); }
      };

      class Journal : private Minuteur {
      public:
          void tester() { declencher(); }

      private:
          void expire() override { std::println("journal"); }
      };

      int main() {
          Journal j;
          j.tester();
      }
      ```
    choices:
      - {text: "`journal`", correct: true}
      - {text: "`minuteur`", correct: false}
      - {text: "`minuteur`, puis `journal`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`journal` : même en héritage privé, la fonction virtuelle est redéfinie. `declencher` appelle la version de `Journal`."
    check:
      output: "journal"
