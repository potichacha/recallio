      - text: |-
          ```
          base
          derivee
          ```
        correct: false
      - text: |-
          ```
          base
          base
          ```
        correct: false
    answer: "`derivee`, puis `base` : `~Derivee` s'exécute d'abord, sur un objet encore entier. Quand `~Base` s'exécute, la partie dérivée est détruite."
    check:
      output: |-
        derivee
        base
  - key: code-indirect
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Base {
          Base() { demarrer(); }
          virtual ~Base() = default;
          void demarrer() { std::println("{}", niveau()); }
          virtual int niveau() const { return 1; }
      };

      struct Derivee : Base {
          int niveau() const override { return 2; }
      };

      int main() {
          Derivee d;
          d.demarrer();
      }
      ```
    choices:
      - text: |-
          ```
          1
          2
          ```
        correct: true
      - text: |-
          ```
          2
          2
          ```
        correct: false
      - text: |-
          ```
          1
          1
          ```
        correct: false
      - text: |-
          ```
          2
          1
          ```
        correct: false
    answer: "`1`, puis `2` : passer par la fonction ordinaire `demarrer` ne change rien. Pendant la construction, `niveau()` est celle de `Base`."
    check:
      output: |-
        1
        2
  - key: code-parametre
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>
      #include <utility>

      class Base {
      public:
          explicit Base(std::string nom) : nom_{std::move(nom)} { std::println("créé : {}", nom_); }

      private:
          std::string nom_;
      };

      class Derivee : public Base {
      public:
          Derivee() : Base{"derivee"} {}
      };

      int main() {
          const Derivee d;
      }
      ```
    choices:
      - {text: "`créé : derivee`", correct: true}
      - {text: "`créé : base`", correct: false}
      - {text: "`créé : `", correct: false}
      - {text: "Rien", correct: false}
    answer: "`créé : derivee` : la dérivée passe son nom au constructeur de la base. Aucun appel virtuel n'est nécessaire."
    check:
      output: "créé : derivee"
  - key: bug-initialisation-virtuelle
    format: bug-fix
    question: |-
      Ce programme devrait afficher `bouton prêt`. Il affiche `composant prêt`. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      struct Composant {
          Composant() { std::println("{} prêt", nom()); }
          virtual ~Composant() = default;
          virtual std::string nom() const { return "composant"; }
      };

      struct Bouton : Composant {
          std::string nom() const override { return "bouton"; }
      };

      int main() {
          const Bouton b;
      }
      ```
    choices:
      - {text: "Faire passer le nom par le constructeur : `Bouton() : Composant{\"bouton\"} {}`", correct: true}
      - {text: "Déclarer le constructeur de `Composant` avec le mot-clé `virtual`", correct: false}
      - {text: "Appeler `this->nom()` à la place de `nom()` dans le constructeur", correct: false}
      - {text: "Marquer `Bouton::nom` avec `final` à la place de `override`", correct: false}
    answer: |-
      ```cpp
      struct Composant {
          explicit Composant(const std::string& nom) { std::println("{} prêt", nom); }
          virtual ~Composant() = default;
      };

      struct Bouton : Composant {
          Bouton() : Composant{"bouton"} {}
      };
      ```
      Dans le constructeur de `Composant`, `nom()` est celle de `Composant` : la partie `Bouton` n'existe pas
      encore. `this->` n'y change rien, et un constructeur ne peut pas être virtuel.
  - key: bug-pure-virtuelle
    format: bug-fix
    question: |-
      Ce programme s'arrête sur « pure virtual method called ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Forme {
          Forme() { decrire(); }
          virtual ~Forme() = default;
          void decrire() const { std::println("{}", aire()); }
          virtual double aire() const = 0;
      };

      struct Carre : Forme {
          double aire() const override { return 4.0; }
      };

      int main() {
          const Carre c;
      }
      ```
    choices:
      - {text: "Retirer `decrire()` du constructeur, et l'appeler sur l'objet construit", correct: true}
      - {text: "Marquer `decrire()` avec le mot-clé `virtual`", correct: false}
      - {text: "Marquer le constructeur de `Forme` avec `noexcept`", correct: false}
      - {text: "Appeler `Forme::aire()` dans `decrire()`", correct: false}
    answer: |-
      ```cpp
      struct Forme {
          virtual ~Forme() = default;
          void decrire() const { std::println("{}", aire()); }
          virtual double aire() const = 0;
      };

      int main() {
          const Carre c;
          c.decrire();
      }
      ```
      Pendant le constructeur de `Forme`, `aire()` n'a pas de définition : la classe est abstraite. Une fois le
      `Carre` construit, l'appel atteint sa version.
  - key: bug-destructeur-nettoyage
    format: bug-fix
    question: |-
      Ce programme devrait afficher `fichier fermé` à la destruction. Il affiche `rien à fermer`. Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      struct Ressource {
          virtual ~Ressource() { fermer(); }
          virtual void fermer() { std::println("rien à fermer"); }
      };

      struct Fichier : Ressource {
          void fermer() override { std::println("fichier fermé"); }
      };

      int main() {
          const Fichier f;
      }
      ```
    choices:
      - {text: "Appeler `fermer()` dans le destructeur de `Fichier`", correct: true}
      - {text: "Appeler `this->fermer()` dans le destructeur de `Ressource`", correct: false}
      - {text: "Retirer `virtual` du destructeur de `Ressource`", correct: false}
      - {text: "Marquer `Ressource::fermer` comme virtuelle pure", correct: false}
    answer: |-
      ```cpp
      struct Fichier : Ressource {
          ~Fichier() override { fermer(); }
          void fermer() override { std::println("fichier fermé"); }
      };
      ```
      Quand `~Ressource` s'exécute, la partie `Fichier` est déjà détruite : l'appel virtuel reste dans `Ressource`.
      Chaque classe nettoie ce qui lui appartient, dans son propre destructeur.
  - key: bug-membre-non-initialise
    format: bug-fix
    question: |-
      Ce programme devrait afficher `5`, la taille configurée par la dérivée. Il affiche `1`. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      struct Tampon {
          Tampon() : taille_{taille_voulue()} {}
          virtual ~Tampon() = default;
          virtual int taille_voulue() const { return 1; }
          int taille_;
      };

      struct GrandTampon : Tampon {
          int taille_voulue() const override { return 5; }
      };

      int main() {
          const GrandTampon t;
          std::println("{}", t.taille_);
      }
      ```
    choices:
      - {text: "Donner la taille au constructeur : `explicit Tampon(int taille)`, et `GrandTampon() : Tampon{5} {}`", correct: true}
      - {text: "Initialiser `taille_` dans le corps du constructeur de `Tampon`, et non dans sa liste", correct: false}
      - {text: "Déclarer `taille_voulue` avec le mot-clé `static` dans les deux classes", correct: false}
      - {text: "Déclarer `taille_` avec le mot-clé `mutable` dans la classe `Tampon`", correct: false}
    answer: |-
      ```cpp
      struct Tampon {
          explicit Tampon(int taille) : taille_{taille} {}
          virtual ~Tampon() = default;
          int taille_;
      };

      struct GrandTampon : Tampon {
          GrandTampon() : Tampon{5} {}
      };
      ```
      Pendant la construction de `Tampon`, `taille_voulue()` est celle de `Tampon`. Que l'appel soit dans la liste
      d'initialisation ou dans le corps ne change rien.
