      - text: |-
          ```
          base
          derivee
          ```
        correct: true
      - text: |-
          ```
          derivee
          derivee
          ```
        correct: false
      - text: |-
          ```
          base
          base
          ```
        correct: false
      - {text: "`derivee`", correct: false}
    answer: "`base`, puis `derivee` : dans le constructeur de `Base`, l'appel virtuel reste dans `Base`. Une fois l'objet construit, il atteint `Derivee`."
    check:
      output: |-
        base
        derivee
  - key: code-destructeur
