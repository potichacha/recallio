notion: masquage-noms
lesson: |-
  Quand une classe dérivée déclare une fonction du **même nom** qu'une fonction de sa base, elle **masque toutes
  les fonctions de ce nom** héritées de la base, quelles que soient leurs signatures. C'est le **masquage de
  noms** (*name hiding*).

  ```cpp
  struct Base {
      void afficher(int n);
      void afficher(double d);
  };

  struct Derivee : Base {
      void afficher(const std::string& s);
  };

  Derivee d;
  d.afficher("texte");    // d'accord
  d.afficher(42);         // erreur : les versions de Base sont masquées
  ```

  **Pourquoi.** Le compilateur cherche d'abord le **nom**, portée par portée, de la classe dérivée vers la base.
  Dès qu'il trouve le nom dans une portée, il **s'arrête**, et ne fait la résolution de surcharge qu'entre les
  fonctions de cette portée. La surcharge ne traverse pas les portées.

  **Le piège silencieux.** Si une conversion implicite existe, l'appel compile, et appelle la **mauvaise**
  fonction :

  ```cpp
  struct Base    { void regler(double d); };
  struct Derivee : Base { void regler(int n); };

  Derivee d;
  d.regler(2.5);          // appelle Derivee::regler(int) avec 2 : la version double est masquée
  ```

  **Le remède : `using`.** Une déclaration `using Base::nom;` dans la classe dérivée y **ramène** toutes les
  surcharges de la base. Elles participent de nouveau à la résolution de surcharge.

  ```cpp
  struct Derivee : Base {
      using Base::afficher;
      void afficher(const std::string& s);
  };
  ```

  On peut aussi appeler explicitement la version de la base : `d.Base::afficher(42);`.

  **Masquer n'est pas redéfinir.**

  | | Redéfinition (*override*) | Masquage (*hiding*) |
  |---|---|---|
  | La fonction de base est | `virtual`, même signature | non virtuelle, ou de signature différente |
  | Appel par un pointeur de base | version de la **dérivée** | version de la **base** |
  | Choix fait | à l'exécution | à la compilation |

  Une fonction virtuelle dont on change un paramètre dans la dérivée n'est **pas** redéfinie : elle est masquée, et
  le polymorphisme ne joue plus. Le mot-clé **`override`** transforme cette faute en erreur de compilation.

  **Les variables aussi.** Un membre de données de même nom dans la dérivée masque celui de la base ; les deux
  existent dans l'objet. On évite.

  **En entretien** : « Déclarer une fonction dans la dérivée masque toutes les surcharges de même nom de la base,
  parce que la recherche de nom s'arrête à la première portée qui le contient. `using Base::f;` les ramène. Et je
  marque `override` pour être sûr de redéfinir, pas de masquer. »
cards:
  - key: definition
    format: course
    question: "Que se passe-t-il quand une classe dérivée déclare une fonction du même nom qu'une fonction de sa base ?"
    choices:
      - {text: "Elle masque toutes les fonctions de ce nom héritées de la base, quelles que soient leurs signatures", correct: true}
      - {text: "Elle ajoute une surcharge à celles de la base, et toutes restent utilisables sur la dérivée", correct: false}
      - {text: "Elle remplace seulement la fonction de la base qui a exactement la même signature", correct: false}
      - {text: "Elle provoque une erreur de compilation, car un nom ne peut pas être déclaré deux fois", correct: false}
    answer: "C'est le masquage de noms. Les versions de la base existent toujours, mais ne sont plus trouvées par un appel sur la dérivée."
  - key: pourquoi
    format: course
    question: "Pourquoi les surcharges de la base ne sont-elles pas considérées avec celles de la dérivée ?"
    choices:
      - {text: "La recherche du nom s'arrête à la première portée qui le contient, avant la résolution de surcharge", correct: true}
      - {text: "Les fonctions de la base sont privées dans la classe dérivée", correct: false}
      - {text: "Les fonctions de la base sont supprimées quand la dérivée en déclare une", correct: false}
      - {text: "La résolution de surcharge ne fonctionne qu'entre fonctions libres", correct: false}
    answer: "Le compilateur cherche le nom dans la dérivée, puis dans la base. S'il le trouve dans la dérivée, il ne regarde pas plus loin."
  - key: using
    format: course
    question: "Comment rend-on de nouveau visibles, dans la classe dérivée, les surcharges masquées de la base ?"
    choices:
      - {text: "Par `using Base::nom;` dans la classe dérivée", correct: true}
      - {text: "Par `friend Base::nom;` dans la classe dérivée", correct: false}
      - {text: "Par `virtual` devant la fonction de la dérivée", correct: false}
      - {text: "Par `#include` de l'en-tête de la base une seconde fois", correct: false}
    answer: "La déclaration `using` introduit le nom dans la portée de la dérivée : toutes les surcharges participent alors au choix."
  - key: masquer-ou-redefinir
    format: course
    question: "Quelle différence entre masquer et redéfinir une fonction de la base ?"
    choices:
      - {text: "Redéfinir une fonction virtuelle joue par un pointeur de base ; masquer n'a d'effet que sur le type statique", correct: true}
      - {text: "Masquer une fonction virtuelle joue par un pointeur de base ; redéfinir n'a d'effet que sur le type statique", correct: false}
      - {text: "Redéfinir supprime la fonction de la base ; masquer la garde intacte", correct: false}
      - {text: "Aucune : les deux mots désignent le même mécanisme", correct: false}
    answer: "Avec le masquage, la fonction appelée dépend du type du pointeur, choisi à la compilation. La redéfinition, elle, est choisie à l'exécution d'après le type réel."
  - key: vf-signature-differente
    format: true-false
    question: "Une fonction de la dérivée ne masque que les fonctions de la base qui ont la même signature."
    truth: false
    answer: "Elle masque toutes celles qui portent le même nom, même avec d'autres paramètres."
  - key: vf-appel-qualifie
    format: true-false
    question: "On peut appeler une fonction masquée en écrivant `objet.Base::fonction(...)`."
    truth: true
    answer: "Le nom qualifié fait chercher directement dans la portée de `Base`."
  - key: vf-override
    format: true-false
    question: "Le mot-clé `override` fait échouer la compilation quand la fonction ne redéfinit aucune fonction virtuelle de la base."
    truth: true
    answer: "C'est sa raison d'être : une signature légèrement différente masquerait la fonction au lieu de la redéfinir, en silence."
  - key: vf-variable
    format: true-false
    question: "Un membre de données de la dérivée, de même nom qu'un membre de la base, remplace celui de la base dans l'objet."
    truth: false
    answer: "Les deux existent dans l'objet. Celui de la dérivée masque l'autre, qui reste accessible par `Base::nom`."
  - key: qcm-ramener
    format: multiple-choice
    question: "`Base` a `void f(int)` et `void f(double)`. Quelle ligne, dans `Derivee`, les garde utilisables à côté d'un nouveau `void f(char)` ?"
    choices:
      - {text: "`using Base::f;`", correct: true}
      - {text: "`using namespace Base;`", correct: false}
      - {text: "`void f(...) = default;`", correct: false}
      - {text: "`extern void f(int);`", correct: false}
    answer: "Une seule déclaration `using` ramène toutes les surcharges de ce nom."
  - key: qcm-appel-silencieux
    format: multiple-choice
    question: "`Base` a `void regler(double)`, `Derivee` a `void regler(int)`. Que fait `Derivee d; d.regler(2.5);` ?"
    choices:
      - {text: "Il appelle `Derivee::regler(int)` avec 2 : la version `double` est masquée", correct: true}
      - {text: "Il appelle `Base::regler(double)` avec 2.5 : c'est la meilleure correspondance", correct: false}
      - {text: "Il ne compile pas : l'appel est ambigu", correct: false}
      - {text: "Il appelle les deux fonctions, l'une après l'autre", correct: false}
    answer: "Seule la portée de `Derivee` est examinée. 2.5 est converti en `int`, sans erreur : GCC n'avertit qu'avec `-Wconversion`."
  - key: qcm-pointeur-base
    format: multiple-choice
    question: "`Base::nom()` n'est pas virtuelle, et `Derivee` déclare aussi `nom()`. Que fait `Base* p = new Derivee; p->nom();` ?"
    choices:
      - {text: "Il appelle `Base::nom()` : le choix se fait d'après le type du pointeur", correct: true}
      - {text: "Il appelle `Derivee::nom()` : le choix se fait d'après l'objet", correct: false}
      - {text: "Il ne compile pas : le nom est masqué", correct: false}
      - {text: "Il appelle `Derivee::nom()`, puis `Base::nom()`", correct: false}
    answer: "Sans `virtual`, il n'y a pas de liaison dynamique. La fonction de la dérivée masque celle de la base, sans la redéfinir."
  - key: qcm-avertissement
    format: multiple-choice
    question: "Quelle option de GCC signale qu'une fonction de la dérivée masque une fonction virtuelle de la base ?"
    choices:
      - {text: "`-Woverloaded-virtual`", correct: true}
      - {text: "`-Wshadow`", correct: false}
      - {text: "`-Wunused`", correct: false}
      - {text: "`-Wreturn-type`", correct: false}
    answer: "Elle repère la signature qui diffère de peu de celle d'une fonction virtuelle. `-Wshadow` concerne les variables."
  - key: code-masquage
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Base {
          void regler(double) { std::println("double"); }
      };

      struct Derivee : Base {
          void regler(int) { std::println("int"); }
      };

      int main() {
          Derivee d;
          d.regler(2.5);
      }
      ```
    choices:
      - {text: "`int`", correct: true}
      - {text: "`double`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "`double`, puis `int`", correct: false}
    answer: "`int` : `Derivee::regler` masque la version de la base. 2.5 est converti en 2."
    check:
      output: "int"
  - key: code-using
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Base {
          void regler(double) { std::println("double"); }
      };

      struct Derivee : Base {
          using Base::regler;
          void regler(int) { std::println("int"); }
      };

      int main() {
          Derivee d;
          d.regler(2.5);
          d.regler(2);
      }
      ```
    choices:
      - text: |-
          ```
          double
          int
          ```
        correct: true
      - text: |-
          ```
          int
          int
          ```
        correct: false
      - text: |-
          ```
          double
          double
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: "`double`, puis `int` : `using Base::regler;` ramène la version `double`. Chaque appel choisit la meilleure correspondance."
    check:
      output: |-
        double
        int
  - key: code-non-virtuelle
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Base {
          void nom() const { std::println("base"); }
      };

      struct Derivee : Base {
          void nom() const { std::println("derivee"); }
      };

      int main() {
          const Derivee d;
          const Base& b = d;
          b.nom();
          d.nom();
      }
      ```
    choices:
      - text: |-
          ```
          base
          derivee
          ```
        correct: true
      - text: |-
          ```
          derivee
          derivee
          ```
        correct: false
      - text: |-
          ```
          base
          base
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
    answer: "`base`, puis `derivee` : la fonction n'est pas virtuelle. L'appel est choisi d'après le type de l'expression : `Base` pour `b`, `Derivee` pour `d`."
    check:
      output: |-
        base
        derivee
  - key: code-qualifie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Base {
          int valeur = 1;
          int lire() const { return valeur; }
      };

      struct Derivee : Base {
          int valeur = 2;
          int lire() const { return valeur; }
      };

      int main() {
          const Derivee d;
          std::println("{} {} {}", d.lire(), d.Base::lire(), d.Base::valeur + d.valeur);
      }
      ```
    choices:
      - {text: "`2 1 3`", correct: true}
      - {text: "`2 2 4`", correct: false}
      - {text: "`1 1 2`", correct: false}
      - {text: "`2 1 4`", correct: false}
    answer: "`2 1 3` : l'objet contient les deux `valeur`. Le nom qualifié `Base::` atteint ce que la dérivée masque."
    check:
      output: "2 1 3"
  - key: bug-surcharge-masquee
    format: bug-fix
    question: |-
      Le compilateur refuse `d.afficher(42);` : il ne trouve qu'`afficher(const std::string&)`. Quelle correction est
      la bonne ?
      ```cpp
      #include <print>
      #include <string>

      struct Base {
          void afficher(int n) { std::println("{}", n); }
      };

      struct Derivee : Base {
          void afficher(const std::string& s) { std::println("{}", s); }
      };

      int main() {
          Derivee d;
          d.afficher(42);
      }
      ```
    choices:
      - {text: "Ajouter `using Base::afficher;` dans `Derivee`", correct: true}
      - {text: "Ajouter `virtual` devant `afficher` dans `Derivee`", correct: false}
      - {text: "Ajouter `override` après `afficher` dans `Derivee`", correct: false}
      - {text: "Ajouter `friend struct Base;` dans `Derivee`", correct: false}
    answer: |-
      ```cpp
      struct Derivee : Base {
          using Base::afficher;
          void afficher(const std::string& s) { std::println("{}", s); }
      };
      ```
      La fonction de `Derivee` masque celle de `Base`, bien que leurs paramètres diffèrent. `using` ramène la version
      `int` dans la portée.
  - key: bug-redefinition-ratee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `cercle`. Il affiche `forme` : la fonction de `Cercle` n'est pas appelée.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
          virtual void dessiner(int epaisseur) const { std::println("forme"); }
      };

      struct Cercle : Forme {
          void dessiner(double epaisseur) const { std::println("cercle"); }
      };

      int main() {
          const Cercle c;
          const Forme& f = c;
          f.dessiner(1);
      }
      ```
    choices:
      - {text: "Donner à `Cercle::dessiner` le paramètre `int`, et la marquer `override`", correct: true}
      - {text: "Marquer `Cercle::dessiner(double)` avec `virtual`, sans changer son paramètre", correct: false}
      - {text: "Appeler `f.dessiner(1.0)` dans `main`, avec un nombre à virgule", correct: false}
      - {text: "Ajouter `using Forme::dessiner;` dans `Cercle`, sans rien changer d'autre", correct: false}
    answer: |-
      ```cpp
      void dessiner(int epaisseur) const override { std::println("cercle"); }
      ```
      Avec un paramètre `double`, la fonction de `Cercle` ne redéfinit pas celle de `Forme` : elle la masque. Par
      une référence de base, c'est la version de `Forme` qui est appelée. `override` aurait refusé de compiler.
  - key: bug-conversion-silencieuse
    format: bug-fix
    question: |-
      Ce programme devrait afficher `2.5`. Il affiche `2` : la version `double` de la base n'est pas appelée.
      Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Capteur {
          void regler(double seuil) { std::println("{}", seuil); }
      };

      struct CapteurEntier : Capteur {
          void regler(int seuil) { std::println("{}", seuil); }
      };

      int main() {
          CapteurEntier c;
          c.regler(2.5);
      }
      ```
    choices:
      - {text: "Ajouter `using Capteur::regler;` dans `CapteurEntier`", correct: true}
      - {text: "Ajouter `explicit` devant `regler` dans `CapteurEntier`", correct: false}
      - {text: "Ajouter `const` après `regler` dans `Capteur`", correct: false}
      - {text: "Ajouter `static` devant `regler` dans `Capteur`", correct: false}
    answer: |-
      ```cpp
      struct CapteurEntier : Capteur {
          using Capteur::regler;
          void regler(int seuil) { std::println("{}", seuil); }
      };
      ```
      La version `int` masque la version `double`, et 2.5 est converti sans erreur. Avec `using`, les deux sont
      candidates, et `double` l'emporte.
  - key: bug-constructeurs
    format: bug-fix
    question: |-
      Le compilateur répond « could not convert '5' from 'int' to 'Base' » sur `Derivee d{5};` : `Derivee` n'a pas
      hérité du constructeur de `Base`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Base {
          explicit Base(int valeur) : valeur_{valeur} {}
          int valeur_;
      };

      struct Derivee : Base {
      };

      int main() {
          const Derivee d{5};
          std::println("{}", d.valeur_);
      }
      ```
    choices:
      - {text: "Ajouter `using Base::Base;` dans `Derivee`", correct: true}
      - {text: "Ajouter `using Base::valeur_;` dans `Derivee`", correct: false}
      - {text: "Ajouter `friend struct Base;` dans `Derivee`", correct: false}
      - {text: "Ajouter `virtual` devant le constructeur de `Base`", correct: false}
    answer: |-
      ```cpp
      struct Derivee : Base {
          using Base::Base;
      };
      ```
      Les constructeurs ne sont pas hérités d'office. `using Base::Base;` les rend disponibles dans la dérivée :
      c'est le même mécanisme que pour une fonction masquée.
