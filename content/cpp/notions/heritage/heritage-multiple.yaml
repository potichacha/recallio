notion: heritage-multiple
lesson: |-
  En C++, une classe peut hériter de **plusieurs classes de base** à la fois.

  ```cpp
  class Hydravion : public Avion, public Bateau {};
  ```

  L'objet contient une partie `Avion` et une partie `Bateau`, construites **dans l'ordre de la déclaration** des
  bases, et détruites dans l'ordre inverse.

  **Premier problème : l'ambiguïté.** Si les deux bases ont un membre de même nom, l'appel sur la dérivée est
  **ambigu**, même si les signatures diffèrent :

  ```cpp
  Hydravion h;
  h.demarrer();             // erreur : Avion::demarrer ou Bateau::demarrer ?
  h.Avion::demarrer();      // on lève l'ambiguïté par le nom qualifié
  ```

  La dérivée peut aussi redéfinir `demarrer`, ou choisir avec `using Avion::demarrer;`.

  **Second problème : le diamant.** Quand deux bases héritent elles-mêmes d'une **base commune**, celle-ci est
  présente **deux fois** dans l'objet final.

  ```
        Vehicule                 Vehicule   Vehicule
        /      \                    |          |
     Avion    Bateau     soit     Avion      Bateau
        \      /                     \        /
       Hydravion                     Hydravion
  ```

  Deux exemplaires de chaque membre de `Vehicule` ; un accès à `h.vitesse` est ambigu, et la conversion
  `Vehicule* v = &h;` aussi.

  **La solution : l'héritage virtuel.** Les classes intermédiaires déclarent leur base **`virtual`** :

  ```cpp
  class Avion  : public virtual Vehicule {};
  class Bateau : public virtual Vehicule {};
  class Hydravion : public Avion, public Bateau {};
  ```

  L'objet ne contient alors qu'**un seul** `Vehicule`, partagé.

  **Ce que l'héritage virtuel change.**

  - C'est la classe **la plus dérivée** (`Hydravion`) qui **construit la base virtuelle**, directement. Les appels
    au constructeur de `Vehicule` écrits dans `Avion` et `Bateau` sont **ignorés** quand ils servent de bases.
  - Les bases virtuelles sont construites **en premier**, avant toutes les autres.
  - L'accès à la base passe par une indirection : les objets grossissent d'un pointeur, et l'accès coûte un peu
    plus.
  - Il faut le **prévoir** : `virtual` s'écrit dans les classes intermédiaires, pas dans celle qui subit le
    diamant.

  **L'usage sain : les interfaces.** Hériter de plusieurs classes **abstraites sans données** ne pose aucun de
  ces problèmes : il n'y a pas d'état dupliqué. C'est l'équivalent du `implements` de Java.

  ```cpp
  class Document : public Imprimable, public Serialisable {};
  ```

  Pour réutiliser du **code**, on préfère la **composition**. Une hiérarchie en diamant avec des données est
  presque toujours le signe d'une conception à revoir.

  **En entretien** : « L'héritage multiple pose deux problèmes : l'ambiguïté des noms, et le diamant, où la base
  commune est dupliquée. L'héritage virtuel la rend unique, construite par la classe la plus dérivée. En pratique,
  je n'hérite à plusieurs que d'interfaces abstraites. »
cards:
  - key: diamant
    format: course
    question: "Qu'est-ce que le problème du diamant ?"
    choices:
      - {text: "Une base commune à deux classes de base se retrouve en deux exemplaires dans l'objet final", correct: true}
      - {text: "Une classe hérite d'elle-même, par l'intermédiaire de deux de ses classes dérivées", correct: false}
      - {text: "Une classe abstraite ne peut pas être instanciée, faute de fonctions définies", correct: false}
      - {text: "Deux classes dérivées de la même base ne peuvent pas être converties l'une en l'autre", correct: false}
    answer: "`Avion` et `Bateau` héritent de `Vehicule` ; `Hydravion` hérite des deux. Sans précaution, il contient deux `Vehicule`, et tout accès à la base est ambigu."
  - key: heritage-virtuel
    format: course
    question: "Que fait l'héritage virtuel, `class Avion : public virtual Vehicule` ?"
    choices:
      - {text: "Il fait partager un seul exemplaire de la base à toutes les classes qui en héritent ainsi", correct: true}
      - {text: "Il rend virtuelles toutes les fonctions membres de la classe de base", correct: false}
      - {text: "Il interdit de créer des objets de la classe de base", correct: false}
      - {text: "Il retarde la construction de la base jusqu'à son premier usage", correct: false}
    answer: "L'objet le plus dérivé ne contient qu'un `Vehicule`. Le mot `virtual` n'a ici rien à voir avec les fonctions virtuelles."
  - key: construction
    format: course
    question: "Avec l'héritage virtuel, quelle classe construit la base virtuelle ?"
    choices:
      - {text: "La classe la plus dérivée, directement", correct: true}
      - {text: "La première classe intermédiaire, dans l'ordre de déclaration", correct: false}
      - {text: "Chaque classe intermédiaire, l'une après l'autre", correct: false}
      - {text: "Aucune : une base virtuelle n'a pas de constructeur", correct: false}
    answer: "Puisqu'il n'y a qu'un exemplaire, il ne peut être construit qu'une fois. Les appels écrits dans les classes intermédiaires sont ignorés ; la base virtuelle est construite en premier."
  - key: interfaces
    format: course
    question: "Quel usage de l'héritage multiple ne pose ni ambiguïté de données ni diamant gênant ?"
    choices:
      - {text: "Hériter de plusieurs classes abstraites sans données, comme des interfaces", correct: true}
      - {text: "Hériter de plusieurs classes concrètes qui ont une base commune", correct: false}
      - {text: "Hériter deux fois de la même classe, directement", correct: false}
      - {text: "Hériter de plusieurs classes qui ont des membres de même nom", correct: false}
    answer: "Sans état, rien n'est dupliqué. C'est l'équivalent de l'implémentation de plusieurs interfaces dans d'autres langages."
  - key: vf-ordre
    format: true-false
    question: "Les classes de base sont construites dans l'ordre où elles sont écrites dans la déclaration de la classe dérivée."
    truth: true
    answer: "`class H : public A, public B` construit `A` puis `B`, quel que soit l'ordre de la liste d'initialisation du constructeur."
  - key: vf-ambiguite-signature
    format: true-false
    question: "Deux fonctions de même nom héritées de deux bases différentes se départagent par leurs paramètres."
    truth: false
    answer: "La recherche du nom trouve deux portées : l'appel est ambigu avant même la résolution de surcharge. On qualifie, ou l'on ramène les deux par `using`."
  - key: vf-virtual-ou
    format: true-false
    question: "Pour résoudre un diamant, le mot-clé `virtual` s'écrit dans la classe la plus dérivée."
    truth: false
    answer: "Il s'écrit dans les classes intermédiaires, devant la base commune. Il faut donc le prévoir à leur conception."
  - key: vf-cout
    format: true-false
    question: "L'héritage virtuel a un coût : les objets grossissent, et l'accès à la base passe par une indirection."
    truth: true
    answer: "La position de la base virtuelle dans l'objet n'est connue qu'à l'exécution : il faut un pointeur ou un décalage supplémentaire."
  - key: qcm-lever-ambiguite
    format: multiple-choice
    question: "`Avion` et `Bateau` ont chacun `demarrer()`. Comment appelles-tu celle d'`Avion` sur un `Hydravion h` ?"
    choices:
      - {text: "`h.Avion::demarrer();`", correct: true}
      - {text: "`h.demarrer<Avion>();`", correct: false}
      - {text: "`h.demarrer(Avion);`", correct: false}
      - {text: "`Avion.h.demarrer();`", correct: false}
    answer: "Le nom qualifié désigne la portée où chercher."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle déclaration fait d'`Avion` une classe prête pour un diamant sans duplication ?"
    choices:
      - {text: "`class Avion : public virtual Vehicule {};`", correct: true}
      - {text: "`virtual class Avion : public Vehicule {};`", correct: false}
      - {text: "`class Avion : public Vehicule virtual {};`", correct: false}
      - {text: "`class Avion : public static Vehicule {};`", correct: false}
    answer: "`virtual` se place devant le nom de la base, avant ou après le spécificateur d'accès."
  - key: qcm-exemplaires
    format: multiple-choice
    question: "Sans héritage virtuel, combien d'exemplaires de `Vehicule` contient un `Hydravion` qui hérite d'`Avion` et de `Bateau` ?"
    choices:
      - {text: "Deux", correct: true}
      - {text: "Un", correct: false}
      - {text: "Trois", correct: false}
      - {text: "Aucun", correct: false}
    answer: "Un par chemin d'héritage : celui d'`Avion`, et celui de `Bateau`."
  - key: qcm-conversion
    format: multiple-choice
    question: "Dans un diamant sans héritage virtuel, que donne `Vehicule* v = &hydravion;` ?"
    choices:
      - {text: "Une erreur de compilation : la base est ambiguë", correct: true}
      - {text: "Un pointeur vers le `Vehicule` d'`Avion`", correct: false}
      - {text: "Un pointeur vers le `Vehicule` de `Bateau`", correct: false}
      - {text: "Un pointeur nul", correct: false}
    answer: "Le compilateur ne sait pas lequel des deux `Vehicule` désigner. Il faut passer par `Avion*` ou `Bateau*`, ou rendre la base virtuelle."
  - key: code-ordre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct A {
          A() { std::print("A "); }
      };

      struct B {
          B() { std::print("B "); }
      };

      struct C : B, A {
          C() : A{}, B{} { std::println("C"); }
      };

      int main() {
          const C c;
      }
      ```
    choices:
      - {text: "`B A C`", correct: true}
      - {text: "`A B C`", correct: false}
      - {text: "`C B A`", correct: false}
      - {text: "`C A B`", correct: false}
    answer: "`B A C` : les bases sont construites dans l'ordre de la déclaration `C : B, A`, pas dans celui de la liste d'initialisation."
    check:
      output: "B A C"
  - key: code-diamant-double
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Vehicule {
          Vehicule() { std::print("V "); }
      };

      struct Avion : Vehicule {};
      struct Bateau : Vehicule {};
      struct Hydravion : Avion, Bateau {};

      int main() {
          const Hydravion h;
          std::println("fin");
      }
      ```
    choices:
      - {text: "`V V fin`", correct: true}
      - {text: "`V fin`", correct: false}
      - {text: "`fin`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`V V fin` : sans héritage virtuel, l'objet contient deux `Vehicule`, construits chacun à leur tour."
    check:
      output: "V V fin"
  - key: code-diamant-virtuel
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Vehicule {
          explicit Vehicule(int roues) { std::print("{} ", roues); }
      };

      struct Avion : virtual Vehicule {
          Avion() : Vehicule{3} {}
      };

      struct Bateau : virtual Vehicule {
          Bateau() : Vehicule{0} {}
      };

      struct Hydravion : Avion, Bateau {
          Hydravion() : Vehicule{2} {}
      };

      int main() {
          const Hydravion h;
          std::println("fin");
      }
      ```
    choices:
      - {text: "`2 fin`", correct: true}
      - {text: "`3 0 fin`", correct: false}
      - {text: "`2 3 0 fin`", correct: false}
      - {text: "`3 fin`", correct: false}
    answer: "`2 fin` : la base virtuelle est construite une seule fois, par la classe la plus dérivée. Les appels d'`Avion` et de `Bateau` sont ignorés."
    check:
      output: "2 fin"
  - key: code-interfaces
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Imprimable {
          virtual ~Imprimable() = default;
          virtual void imprimer() const = 0;
      };

      struct Nommable {
          virtual ~Nommable() = default;
          virtual const char* nom() const = 0;
      };

      struct Document : Imprimable, Nommable {
          void imprimer() const override { std::print("page "); }
          const char* nom() const override { return "rapport"; }
      };

      int main() {
          const Document d;
          const Imprimable& i = d;
          const Nommable& n = d;
          i.imprimer();
          std::println("{}", n.nom());
      }
      ```
    choices:
      - {text: "`page rapport`", correct: true}
      - {text: "`rapport page`", correct: false}
      - {text: "`page`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`page rapport` : un `Document` se voit comme un `Imprimable` ou comme un `Nommable`. Chaque interface atteint sa redéfinition."
    check:
      output: "page rapport"
  - key: bug-ambiguite
    format: bug-fix
    question: |-
      Le compilateur répond « request for member 'demarrer' is ambiguous ». Le programme devrait démarrer le moteur
      de l'avion. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Avion {
          void demarrer() { std::println("réacteurs"); }
      };

      struct Bateau {
          void demarrer() { std::println("hélice"); }
      };

      struct Hydravion : Avion, Bateau {};

      int main() {
          Hydravion h;
          h.demarrer();
      }
      ```
    choices:
      - {text: "Appeler `h.Avion::demarrer();`", correct: true}
      - {text: "Appeler `h.demarrer(Avion{});`", correct: false}
      - {text: "Hériter de `Bateau` avant `Avion`", correct: false}
      - {text: "Déclarer les deux `demarrer` avec `virtual`", correct: false}
    answer: |-
      ```cpp
      h.Avion::demarrer();
      ```
      Le nom existe dans deux bases : le compilateur refuse de choisir, quel que soit l'ordre d'héritage. On
      qualifie l'appel, ou `Hydravion` écrit `using Avion::demarrer;`.
  - key: bug-diamant
    format: bug-fix
    question: |-
      Le compilateur répond « request for member 'vitesse' is ambiguous ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Vehicule {
          int vitesse = 0;
      };

      struct Avion : Vehicule {};
      struct Bateau : Vehicule {};
      struct Hydravion : Avion, Bateau {};

      int main() {
          Hydravion h;
          h.vitesse = 90;
          std::println("{}", h.vitesse);
      }
      ```
    choices:
      - {text: "Hériter virtuellement dans `Avion` et `Bateau` : `struct Avion : virtual Vehicule {};`", correct: true}
      - {text: "Hériter virtuellement dans `Hydravion` : `struct Hydravion : virtual Avion, virtual Bateau {};`", correct: false}
      - {text: "Déclarer `vitesse` avec le mot-clé `virtual` dans `Vehicule`", correct: false}
      - {text: "Déclarer `vitesse` avec le mot-clé `mutable` dans `Vehicule`", correct: false}
    answer: |-
      ```cpp
      struct Avion : virtual Vehicule {};
      struct Bateau : virtual Vehicule {};
      ```
      L'hydravion contient deux `Vehicule`, donc deux `vitesse`. L'héritage virtuel, écrit dans les classes
      intermédiaires, n'en laisse qu'un.
  - key: bug-constructeur-base-virtuelle
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'Vehicule::Vehicule()' » dans le constructeur
      d'`Hydravion`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Vehicule {
          explicit Vehicule(int roues) : roues_{roues} {}
          int roues_;
      };

      struct Avion : virtual Vehicule {
          Avion() : Vehicule{3} {}
      };

      struct Bateau : virtual Vehicule {
          Bateau() : Vehicule{0} {}
      };

      struct Hydravion : Avion, Bateau {
          Hydravion() {}
      };

      int main() {
          const Hydravion h;
          std::println("{}", h.roues_);
      }
      ```
    choices:
      - {text: "Construire la base dans `Hydravion` : `Hydravion() : Vehicule{2} {}`", correct: true}
      - {text: "Construire la base deux fois dans `Avion` : `Avion() : Vehicule{3}, Vehicule{3} {}`", correct: false}
      - {text: "Retirer `explicit` du constructeur de `Vehicule`", correct: false}
      - {text: "Hériter de `Bateau` avant `Avion` dans `Hydravion`", correct: false}
    answer: |-
      ```cpp
      struct Hydravion : Avion, Bateau {
          Hydravion() : Vehicule{2} {}
      };
      ```
      Une base virtuelle est construite par la classe la plus dérivée. Les appels d'`Avion` et de `Bateau` ne
      comptent pas ici : `Hydravion` doit l'initialiser lui-même.
  - key: bug-conversion-ambigue
    format: bug-fix
    question: |-
      Le compilateur répond « 'Vehicule' is an ambiguous base of 'Hydravion' ». Quelle correction garde le code de
      `main` tel quel ?
      ```cpp
      #include <print>

      struct Vehicule {
          virtual ~Vehicule() = default;
          virtual const char* nom() const { return "véhicule"; }
      };

      struct Avion : Vehicule {};
      struct Bateau : Vehicule {};

      struct Hydravion : Avion, Bateau {
          const char* nom() const override { return "hydravion"; }
      };

      int main() {
          const Hydravion h;
          const Vehicule& v = h;
          std::println("{}", v.nom());
      }
      ```
    choices:
      - {text: "Déclarer `struct Avion : virtual Vehicule {};` et `struct Bateau : virtual Vehicule {};`", correct: true}
      - {text: "Déclarer `struct Hydravion : Avion, Bateau, Vehicule` avec une troisième base directe", correct: false}
      - {text: "Retirer `override` de la fonction `nom` de la classe `Hydravion`", correct: false}
      - {text: "Retirer le destructeur virtuel de la classe `Vehicule`", correct: false}
    answer: |-
      ```cpp
      struct Avion : virtual Vehicule {};
      struct Bateau : virtual Vehicule {};
      ```
      La référence ne sait pas lequel des deux `Vehicule` désigner. Avec une base virtuelle, il n'y en a qu'un, et
      la conversion redevient possible.
  - key: situation-conception
    format: scenario
    question: |-
      Une équipe a écrit `EmployeEtudiant`, qui hérite de `Employe` et de `Etudiant`, tous deux dérivés de
      `Personne` avec un nom et une adresse. Elle se bat avec des ambiguïtés. Quelle conception proposes-tu ?
    choices:
      - {text: "Une seule `Personne`, qui tient des rôles par composition : un contrat, une inscription", correct: true}
      - {text: "Un troisième héritage, direct, de `Personne` dans `EmployeEtudiant`", correct: false}
      - {text: "Deux noms et deux adresses par personne, un par rôle", correct: false}
      - {text: "Des fonctions amies pour lire le nom dans la bonne base", correct: false}
    answer: |-
      Être employé ou étudiant est un rôle qu'une personne a, pas ce qu'elle est : la composition l'exprime sans
      diamant. L'héritage virtuel ferait compiler le code, sans corriger la conception.
  - key: situation-interfaces
    format: scenario
    question: |-
      Un collègue venu de Java affirme que l'héritage multiple est à bannir en C++. Ta classe `Rapport` doit être à
      la fois imprimable et sérialisable. Que lui réponds-tu ?
    choices:
      - {text: "Qu'hériter de plusieurs classes abstraites sans données est sûr : c'est l'équivalent de `implements`", correct: true}
      - {text: "Qu'il a raison : il faut une seule base qui regroupe les deux interfaces", correct: false}
      - {text: "Qu'il faut hériter virtuellement de chaque interface, dans tous les cas", correct: false}
      - {text: "Qu'il faut remplacer les deux interfaces par des fonctions amies", correct: false}
    answer: |-
      Les difficultés viennent des données dupliquées et des implémentations concurrentes. Des interfaces pures
      n'ont ni l'un ni l'autre : en hériter à plusieurs est l'usage courant.
  - key: situation-cout
    format: scenario
    question: |-
      Pour « prévenir tout diamant futur », une équipe déclare toutes ses bases `virtual`, dans toute la hiérarchie.
      Que lui fais-tu remarquer ?
    choices:
      - {text: "Que chaque objet grossit, que l'accès à la base ralentit, et que chaque classe finale doit construire les bases virtuelles", correct: true}
      - {text: "Que c'est sans coût : `virtual` devant une base n'a d'effet qu'en cas de diamant réel", correct: false}
      - {text: "Que cela rend toutes les fonctions virtuelles, ce qui est le but recherché", correct: false}
      - {text: "Que cela interdit le polymorphisme sur ces classes", correct: false}
    answer: |-
      L'héritage virtuel se paie partout où il est écrit, et complique les constructeurs : la classe la plus
      dérivée initialise elle-même chaque base virtuelle. On le réserve aux diamants réels.
  - key: situation-entretien
    format: scenario
    question: |-
      En entretien, on te demande : « Dans un diamant avec héritage virtuel, les deux classes intermédiaires
      passent des arguments différents au constructeur de la base. Lesquels sont utilisés ? » Que réponds-tu ?
    choices:
      - {text: "Aucun des deux : c'est la classe la plus dérivée qui construit la base virtuelle", correct: true}
      - {text: "Ceux de la première classe intermédiaire, dans l'ordre de déclaration", correct: false}
      - {text: "Ceux de la dernière classe intermédiaire, qui écrasent les premiers", correct: false}
      - {text: "Les deux : la base est construite deux fois de suite", correct: false}
    answer: |-
      Une base unique ne se construit qu'une fois, et seule la classe la plus dérivée peut en décider. Si elle ne
      l'initialise pas, c'est le constructeur par défaut de la base qui est appelé.
