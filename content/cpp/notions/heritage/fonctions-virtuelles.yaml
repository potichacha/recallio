notion: fonctions-virtuelles
lesson: |-
  Une fonction **virtuelle** est une fonction membre qu'une classe dérivée peut **redéfinir**, et dont la bonne
  version est choisie **à l'exécution**, d'après la classe réelle de l'objet.

  ```cpp
  class Animal {
  public:
      virtual ~Animal() = default;
      virtual std::string cri() const { return "..."; }     // virtuelle
  };

  class Chien : public Animal {
  public:
      std::string cri() const override { return "ouaf"; }   // redéfinition
  };

  void faire_crier(const Animal& animal) {
      std::println("{}", animal.cri());   // "ouaf" si animal désigne un Chien
  }
  ```

  **Le type statique et le type dynamique.** `animal` a pour type **statique** `const Animal&` : celui de sa
  déclaration, connu du compilateur. Son type **dynamique** est celui de l'objet réellement désigné : `Chien`.

  - **Sans `virtual`**, l'appel se décide sur le type **statique** : c'est toujours `Animal::cri`.
  - **Avec `virtual`**, il se décide sur le type **dynamique** : c'est la **liaison dynamique**. Le même code traite
    des objets de classes différentes : c'est le **polymorphisme**.

  **Les conditions.**

  - L'appel passe par une **référence** ou un **pointeur** vers la base. Par valeur, l'objet est découpé : il n'y a
    plus de dérivé à trouver.
  - La redéfinition a **exactement la même signature** : nom, paramètres, `const`. Sinon, c'est une autre fonction,
    qui cache celle de la base au lieu de la redéfinir. Le mot-clé `override` fait vérifier cela par le compilateur.
  - Une fonction virtuelle le reste dans toutes les classes dérivées.

  **Le mécanisme.** Chaque objet d'une classe à fonctions virtuelles porte un pointeur caché vers la **table des
  fonctions virtuelles** de sa classe (*vtable*). Un appel virtuel lit l'adresse de la fonction dans cette table. Le
  coût : un pointeur par objet, et une indirection par appel.

  Une classe de base polymorphe déclare aussi un **destructeur virtuel**.

  **En entretien** : « Sans `virtual`, l'appel est résolu à la compilation, sur le type statique. Avec, il est
  résolu à l'exécution par la vtable, sur le type réel de l'objet, à condition de passer par une référence ou un
  pointeur. »
cards:
  - key: role-de-virtual
    format: course
    question: "Que change le mot-clé `virtual` devant une fonction membre ?"
    choices:
      - {text: "La version appelée est choisie à l'exécution, d'après la classe réelle de l'objet", correct: true}
      - {text: "La fonction n'a pas de corps, et doit être définie ailleurs", correct: false}
      - {text: "La fonction ne peut plus être redéfinie dans une classe dérivée", correct: false}
      - {text: "La fonction est appelée d'office à la création de l'objet", correct: false}
    answer: "C'est la liaison dynamique : à travers une référence ou un pointeur vers la base, l'appel atteint la redéfinition de la classe réelle."
  - key: statique-et-dynamique
    format: course
    question: "Dans `const Animal& a = chien;`, quels sont le type statique et le type dynamique de `a` ?"
    choices:
      - {text: "Statique : `Animal`, celui de la déclaration ; dynamique : `Chien`, celui de l'objet", correct: true}
      - {text: "Statique : `Chien`, celui de l'objet ; dynamique : `Animal`, celui de la déclaration", correct: false}
      - {text: "Statique et dynamique : `Animal`, puisque `a` est déclaré ainsi", correct: false}
      - {text: "Statique et dynamique : `Chien`, puisque l'objet en est un", correct: false}
    answer: "Le compilateur ne voit que le type statique. Le type dynamique n'est connu qu'à l'exécution : c'est lui que suit un appel virtuel."
  - key: sans-virtual
    format: course
    question: "Sans `virtual`, quelle version est appelée par `a.cri()` quand `a` est une `Animal&` qui désigne un `Chien` ?"
    choices:
      - {text: "Celle d'`Animal` : l'appel se décide sur le type de la référence", correct: true}
      - {text: "Celle de `Chien` : l'appel se décide sur le type de l'objet", correct: false}
      - {text: "Les deux, celle de la base puis celle de la dérivée", correct: false}
      - {text: "Aucune : le code ne compile pas", correct: false}
    answer: "Une fonction non virtuelle est résolue à la compilation, sur le type statique. La fonction de `Chien` ne fait que cacher celle d'`Animal`."
  - key: vtable
    format: course
    question: Comment un appel virtuel trouve-t-il la bonne fonction à l'exécution ?
    choices:
      - {text: "Par un pointeur caché dans l'objet, vers la table des fonctions de sa classe", correct: true}
      - {text: "Par une recherche du nom de la fonction dans l'exécutable", correct: false}
      - {text: "Par un `switch` sur le nom de la classe, généré par le compilateur", correct: false}
      - {text: "Par une copie de la fonction rangée dans chaque objet", correct: false}
    answer: "C'est la *vtable*. Chaque objet polymorphe porte un pointeur vers la table de sa classe ; l'appel y lit l'adresse de la fonction. D'où un pointeur de plus par objet, et une indirection par appel."
  - key: vf-par-valeur
    format: true-false
    question: "Le polymorphisme fonctionne quand on passe l'objet par valeur, avec le type de la base."
    truth: false
    answer: Par valeur, l'objet est découpé en objet de la base. Il faut une référence ou un pointeur.
  - key: vf-reste-virtuelle
    format: true-false
    question: Une fonction virtuelle dans la base le reste dans les classes dérivées, même sans réécrire `virtual`.
    truth: true
    answer: "On n'y répète pas `virtual` : on écrit `override`, qui dit la même chose et le fait vérifier."
  - key: vf-signature
    format: true-false
    question: "Une fonction de la dérivée redéfinit celle de la base même si elle n'a pas le `const` de celle-ci."
    truth: false
    answer: La signature doit être identique, `const` compris. Sinon c'est une nouvelle fonction, qui cache celle de la base.
  - key: vf-cout
    format: true-false
    question: Un objet d'une classe à fonctions virtuelles porte un pointeur caché de plus.
    truth: true
    answer: Le pointeur vers la vtable de sa classe, en général au début de l'objet.
  - key: qcm-appel-polymorphe
    format: multiple-choice
    question: "`cri` est virtuelle. Lequel de ces appels atteint la version de `Chien` ?"
    choices:
      - {text: "`Animal& a = chien; a.cri();`", correct: true}
      - {text: "`Animal a = chien; a.cri();`", correct: false}
      - {text: "`Animal a; a.cri();`", correct: false}
      - {text: "`Animal a{chien}; a.cri();`", correct: false}
    answer: "Seule la référence désigne le chien. Les autres lignes créent un `Animal`, par copie découpée ou par défaut."
  - key: qcm-constructeur-virtuel
    format: multiple-choice
    question: Laquelle de ces fonctions ne peut pas être virtuelle ?
    choices:
      - {text: "Un constructeur", correct: true}
      - {text: "Un destructeur", correct: false}
      - {text: "Une fonction membre `const`", correct: false}
      - {text: "Un opérateur membre", correct: false}
    answer: "Pour construire un objet, il faut connaître sa classe exacte : il n'y a pas d'objet dont lire la vtable. Le destructeur, lui, doit souvent être virtuel."
  - key: qcm-polymorphisme
    format: multiple-choice
    question: "Qu'appelle-t-on le polymorphisme ?"
    choices:
      - {text: "Le fait qu'un même appel exécute une fonction différente selon la classe réelle de l'objet", correct: true}
      - {text: "Le fait qu'une classe ait plusieurs constructeurs, avec des paramètres différents", correct: false}
      - {text: "Le fait qu'une fonction accepte des arguments de plusieurs types fondamentaux", correct: false}
      - {text: "Le fait qu'un objet change de classe pendant l'exécution du programme", correct: false}
    answer: "« Plusieurs formes » : le code écrit pour la base fonctionne avec toutes les dérivées, chacune apportant sa version."
  - key: qcm-collection
    format: multiple-choice
    question: "Comment calcule-t-on l'aire totale de formes de classes différentes, qui redéfinissent toutes `aire()` ?"
    choices:
      - {text: "En parcourant un `std::vector<std::unique_ptr<Forme>>`, et en appelant `aire()` sur chacune", correct: true}
      - {text: "En parcourant un `std::vector<Forme>`, et en appelant `aire()` sur chacune", correct: false}
      - {text: "En écrivant un `switch` sur le nom de la classe de chaque forme", correct: false}
      - {text: "En écrivant une boucle par classe de forme", correct: false}
    answer: "Le vecteur de pointeurs garde les objets entiers, et l'appel virtuel choisit la bonne `aire`. Ajouter une forme ne demande aucune modification de la boucle."
  - key: trous-virtual
    format: fill-in
    question: |-
      Complète pour que les classes dérivées puissent redéfinir la fonction :
      ```cpp
      class Animal {
      public:
          ___ void crier() const { std::println("..."); }
      };
      ```
    blanks:
      - [virtual]
    answer: "`virtual` devant la fonction, dans la classe de base."
  - key: trous-override
    format: fill-in
    question: |-
      Complète pour faire vérifier que la fonction redéfinit bien celle de la base :
      ```cpp
      class Chien : public Animal {
      public:
          void crier() const ___ { std::println("ouaf"); }
      };
      ```
    blanks:
      - [override]
    answer: "`override` : le compilateur refuse le code si aucune fonction virtuelle de la base ne correspond."
  - key: trous-reference
    format: fill-in
    question: |-
      Complète pour que `animal` désigne le chien, sans le copier :
      ```cpp
      Chien rex;
      const Animal___ animal = rex;
      animal.crier();   // ouaf
      ```
    blanks:
      - ["&"]
    answer: "Une référence : l'objet désigné reste un `Chien`."
  - key: trous-conteneur
    format: fill-in
    question: |-
      Complète pour que le vecteur puisse contenir des formes de toutes les classes dérivées :
      ```cpp
      std::vector<std::unique_ptr<___>> formes;
      formes.push_back(std::make_unique<Carre>(3));
      formes.push_back(std::make_unique<Rectangle>(2, 5));
      ```
    blanks:
      - [Forme]
    answer: "Des pointeurs vers la classe de base : `std::unique_ptr<Forme>`."
  - key: code-virtuelle-ou-non
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
          const char* nom() const { return "animal"; }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
          const char* nom() const { return "chien"; }
      };

      int main() {
          Chien rex;
          const Animal& animal = rex;
          std::println("{} {}", animal.cri(), animal.nom());
      }
      ```
    choices:
      - {text: "`ouaf animal`", correct: true}
      - {text: "`ouaf chien`", correct: false}
      - {text: "`... animal`", correct: false}
      - {text: "`... chien`", correct: false}
    answer: "`ouaf animal` : `cri` est virtuelle, l'appel suit la classe réelle, `Chien`. `nom` ne l'est pas : il se décide sur le type de la référence, `Animal`."
    check:
      output: "ouaf animal"
  - key: code-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chat : public Animal {
      public:
          const char* cri() const override { return "miaou"; }
      };

      int main() {
          std::unique_ptr<Animal> a = std::make_unique<Chat>();
          std::unique_ptr<Animal> b = std::make_unique<Animal>();
          std::println("{} {}", a->cri(), b->cri());
      }
      ```
    choices:
      - {text: "`miaou ...`", correct: true}
      - {text: "`... ...`", correct: false}
      - {text: "`miaou miaou`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`miaou ...` : les deux pointeurs ont le même type, mais ne désignent pas le même genre d'objet. Chaque appel suit la classe réelle."
    check:
      output: "miaou ..."
  - key: code-collection
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <vector>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const { return 0; }
      };

      class Carre : public Forme {
      public:
          explicit Carre(int cote) : cote_{cote} {}
          int aire() const override { return cote_ * cote_; }

      private:
          int cote_;
      };

      class Rectangle : public Forme {
      public:
          Rectangle(int largeur, int hauteur) : largeur_{largeur}, hauteur_{hauteur} {}
          int aire() const override { return largeur_ * hauteur_; }

      private:
          int largeur_;
          int hauteur_;
      };

      int main() {
          std::vector<std::unique_ptr<Forme>> formes;
          formes.push_back(std::make_unique<Carre>(3));
          formes.push_back(std::make_unique<Rectangle>(2, 5));
          int total = 0;
          for (const auto& forme : formes) {
              total += forme->aire();
          }
          std::println("{}", total);
      }
      ```
    choices:
      - {text: "`19`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`9`", correct: false}
      - {text: "`10`", correct: false}
    answer: "`19` : le même appel, `forme->aire()`, exécute la version du carré (9), puis celle du rectangle (10)."
    check:
      output: "19"
  - key: code-signature-differente
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() { return "ouaf"; }
      };

      int main() {
          Chien rex;
          const Animal& animal = rex;
          std::println("{} {}", animal.cri(), rex.cri());
      }
      ```
    choices:
      - {text: "`... ouaf`", correct: true}
      - {text: "`ouaf ouaf`", correct: false}
      - {text: "`... ...`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`... ouaf` : sans `const`, la fonction de `Chien` n'a pas la même signature. Elle ne redéfinit rien : à travers la référence, c'est la version d'`Animal`. Appelée sur `rex`, c'est la nouvelle fonction."
    check:
      output: "... ouaf"
  - key: bug-virtual-oublie
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ouaf`, et affiche `...`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const { std::println("ouaf"); }
      };

      void faire_crier(const Animal& animal) {
          animal.crier();
      }

      int main() {
          Chien rex;
          faire_crier(rex);
      }
      ```
    choices:
      - {text: "Déclarer `crier` avec `virtual` dans `Animal`", correct: true}
      - {text: "Déclarer `crier` avec `virtual` dans `Chien` seulement", correct: false}
      - {text: "Passer l'animal par valeur à `faire_crier`", correct: false}
      - {text: "Retirer `const` des deux fonctions `crier`", correct: false}
    answer: |-
      ```cpp
      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };
      ```
      Sans `virtual` dans la base, l'appel se décide sur le type de la référence : `Animal`. C'est la base qui doit
      déclarer la fonction virtuelle.
  - key: bug-const-oublie
    format: bug-fix
    question: |-
      `crier` est virtuelle, et ce programme affiche quand même `...` au lieu de `ouaf`. Pourquoi ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() { std::println("ouaf"); }
      };

      void faire_crier(const Animal& animal) {
          animal.crier();
      }

      int main() {
          Chien rex;
          faire_crier(rex);
      }
      ```
    choices:
      - {text: "La fonction de `Chien` n'est pas `const` : elle ne redéfinit pas celle d'`Animal`", correct: true}
      - {text: "La fonction de `Chien` n'est pas marquée `virtual` : elle ne peut pas être appelée", correct: false}
      - {text: "Une référence constante empêche tout appel de fonction virtuelle", correct: false}
      - {text: "Le destructeur virtuel d'`Animal` remplace la fonction `crier`", correct: false}
    answer: |-
      ```cpp
      void crier() const override { std::println("ouaf"); }
      ```
      `crier()` et `crier() const` sont deux fonctions différentes. Avec `override`, le compilateur aurait refusé
      cette faute.
  - key: bug-copie-decoupee
    format: bug-fix
    question: |-
      Ce programme devrait afficher `9`, l'aire du carré, et affiche `0`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const { return 0; }
      };

      class Carre : public Forme {
      public:
          explicit Carre(int cote) : cote_{cote} {}
          int aire() const override { return cote_ * cote_; }

      private:
          int cote_;
      };

      int main() {
          Carre carre{3};
          Forme forme = carre;
          std::println("{}", forme.aire());
      }
      ```
    choices:
      - {text: "Écrire `const Forme& forme = carre;`", correct: true}
      - {text: "Écrire `const Forme forme = carre;`", correct: false}
      - {text: "Écrire `Forme forme{carre};`", correct: false}
      - {text: "Écrire `Forme forme = Forme{carre};`", correct: false}
    answer: |-
      ```cpp
      const Forme& forme = carre;
      ```
      `Forme forme = carre;` copie la partie `Forme` du carré : un découpage. Une référence désigne le carré entier.
  - key: bug-virtuelle-non-definie
    format: bug-fix
    question: |-
      La compilation échoue à l'édition des liens : « undefined reference to `vtable for Forme' ». Quelle correction
      est la bonne ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const;
      };

      class Carre : public Forme {
      public:
          int aire() const override { return 9; }
      };

      int main() {
          Carre carre;
          std::println("{}", carre.aire());
      }
      ```
    choices:
      - {text: "Déclarer la fonction virtuelle pure : `virtual int aire() const = 0;`", correct: true}
      - {text: "Déclarer la fonction sans `virtual` dans `Forme`", correct: false}
      - {text: "Retirer `override` de la fonction de `Carre`", correct: false}
      - {text: "Déclarer `carre` avec le type `Forme`", correct: false}
    answer: |-
      ```cpp
      virtual int aire() const = 0;
      ```
      `Forme::aire` est déclarée, mais n'a pas de corps : l'éditeur de liens ne peut pas remplir la vtable. Si la
      base n'a pas de version à offrir, la fonction est virtuelle pure ; sinon, on lui écrit un corps.
