notion: casts-cpp
lesson: |-
  C++ a **quatre** opérateurs de conversion explicite. Chacun dit ce qu'il fait, et le compilateur refuse ce qui
  n'est pas son rôle.

  | Cast | Rôle | Vérification |
  |---|---|---|
  | **`static_cast`** | conversions entre types **liés** : numériques, base ↔ dérivée | à la compilation |
  | **`dynamic_cast`** | descendre une hiérarchie **en vérifiant** le type réel | à l'exécution |
  | **`const_cast`** | ajouter ou retirer `const` | aucune |
  | **`reinterpret_cast`** | relire les mêmes octets comme un autre type | aucune |

  **`static_cast`** est le cast de tous les jours : `static_cast<double>(n)`. Il sait aussi convertir un `Base*` en
  `Derivee*`, mais **sans vérifier** que l'objet en est bien un : s'il ne l'est pas, c'est un comportement indéfini.

  **`dynamic_cast`** fait cette descente **en sécurité**. Il regarde le type réel de l'objet, à l'exécution :

  ```cpp
  if (auto* chien = dynamic_cast<Chien*>(animal)) {    // nullptr si ce n'est pas un Chien
      chien->rapporter();
  }
  ```

  - Avec un **pointeur**, un échec donne **`nullptr`**.
  - Avec une **référence**, un échec lève **`std::bad_cast`**.
  - Il exige une classe **polymorphe** (au moins une fonction virtuelle), et il a un coût.

  En avoir souvent besoin est un signe : une **fonction virtuelle** ferait mieux le travail.

  **`const_cast`** retire `const`. Il ne sert qu'à appeler une vieille fonction qui a oublié `const` sur un paramètre
  qu'elle ne modifie pas. **Modifier** par ce biais un objet réellement déclaré `const` est un comportement indéfini.

  **`reinterpret_cast`** ne convertit rien : il réinterprète une adresse ou des octets. Réservé au code bas niveau, et
  presque jamais portable.

  **Le cast du C**, `(Type)valeur`, essaie plusieurs de ces conversions jusqu'à ce que l'une compile, sans dire
  laquelle. Il peut retirer un `const` ou réinterpréter des octets sans qu'on l'ait voulu, et il ne se cherche pas
  dans le code. On ne l'écrit pas en C++.

  **En entretien** : « `static_cast` pour les conversions sûres, `dynamic_cast` pour descendre une hiérarchie en
  vérifiant, `const_cast` et `reinterpret_cast` à titre exceptionnel. Jamais le cast du C, qui les fait tous sans le
  dire. »
cards:
  - key: quatre-casts
    format: course
    question: Lequel des quatre casts vérifie, à l'exécution, le type réel de l'objet ?
    choices:
      - {text: "`dynamic_cast`", correct: true}
      - {text: "`static_cast`", correct: false}
      - {text: "`const_cast`", correct: false}
      - {text: "`reinterpret_cast`", correct: false}
    answer: "`dynamic_cast` consulte les informations de type de l'objet. Les trois autres sont résolus à la compilation, sans aucune vérification à l'exécution."
  - key: echec-de-dynamic-cast
    format: course
    question: "Que donne un `dynamic_cast` vers un pointeur, quand l'objet n'est pas du type demandé ?"
    choices:
      - {text: "`nullptr`", correct: true}
      - {text: "Une exception `std::bad_cast`", correct: false}
      - {text: "Un pointeur pendant", correct: false}
      - {text: "Une erreur de compilation", correct: false}
    answer: "Avec un pointeur, l'échec se lit : le résultat est nul. C'est avec une référence, qui ne peut pas être nulle, que `dynamic_cast` lève `std::bad_cast`."
  - key: static-cast-vers-derivee
    format: course
    question: "Que fait `static_cast<Chien*>(animal)` si `animal` désigne en réalité un `Chat` ?"
    choices:
      - {text: "Il compile, et donne un pointeur faux : s'en servir est un comportement indéfini", correct: true}
      - {text: "Il compile, et donne `nullptr`, qu'on peut tester", correct: false}
      - {text: "Il ne compile pas : le compilateur connaît le type réel", correct: false}
      - {text: "Il compile, et lève `std::bad_cast` à l'exécution", correct: false}
    answer: "`static_cast` fait confiance au programmeur : aucune vérification. Pour descendre une hiérarchie sans certitude, il faut `dynamic_cast`."
  - key: cast-du-c
    format: course
    question: "Pourquoi évite-t-on le cast du C, `(Type)valeur`, en C++ ?"
    choices:
      - {text: "Il fait n'importe laquelle des conversions, y compris les dangereuses, sans dire laquelle", correct: true}
      - {text: "Il est plus lent à l'exécution que les quatre casts de C++, qu'il appelle tour à tour", correct: false}
      - {text: "Il ne compile plus depuis C++11, sauf dans les fichiers d'en-tête écrits en C", correct: false}
      - {text: "Il ne sait convertir que des nombres entiers, pas des pointeurs ni des objets", correct: false}
    answer: "Il peut retirer un `const` ou réinterpréter des octets sans qu'on l'ait demandé, et il est impossible à retrouver par une recherche. Les casts de C++ nomment leur intention."
  - key: vf-dynamic-cast-polymorphe
    format: true-false
    question: "`dynamic_cast` exige que la classe ait au moins une fonction virtuelle."
    truth: true
    answer: Il lit le type réel dans les informations attachées à la vtable. Sur une classe non polymorphe, il ne compile pas.
  - key: vf-const-cast
    format: true-false
    question: "Avec `const_cast`, on peut modifier sans danger un objet déclaré `const`."
    truth: false
    answer: Retirer `const` est permis ; modifier un objet réellement constant est un comportement indéfini.
  - key: vf-reference
    format: true-false
    question: "Un `dynamic_cast` vers une référence, qui échoue, lève `std::bad_cast`."
    truth: true
    answer: "Une référence ne peut pas être nulle : l'échec se signale par une exception."
  - key: vf-static-cast-verifie
    format: true-false
    question: "`static_cast` vérifie à l'exécution que l'objet est bien du type demandé."
    truth: false
    answer: Il est résolu à la compilation, sur les types déclarés. Il ne coûte rien, et ne vérifie rien.
  - key: qcm-numerique
    format: multiple-choice
    question: "Quel cast convertit un `int` en `double` ?"
    choices:
      - {text: "`static_cast<double>(n)`", correct: true}
      - {text: "`dynamic_cast<double>(n)`", correct: false}
      - {text: "`const_cast<double>(n)`", correct: false}
      - {text: "`reinterpret_cast<double>(n)`", correct: false}
    answer: "`static_cast` : une conversion ordinaire, entre types liés. Les autres ne compilent pas ici."
  - key: qcm-descente-sure
    format: multiple-choice
    question: "Tu as un `Animal*`, et tu veux appeler une fonction propre à `Chien`, seulement si c'en est un. Quel cast choisis-tu ?"
    choices:
      - {text: "`dynamic_cast<Chien*>(animal)`, puis un test du résultat", correct: true}
      - {text: "`static_cast<Chien*>(animal)`, sans test", correct: false}
      - {text: "`reinterpret_cast<Chien*>(animal)`, sans test", correct: false}
      - {text: "`(Chien*)animal`, comme en C", correct: false}
    answer: "Seul `dynamic_cast` vérifie le type réel. Les autres donnent un `Chien*` quel que soit l'objet."
  - key: qcm-alternative
    format: multiple-choice
    question: "Un code enchaîne des `dynamic_cast` pour savoir quelle classe traiter. Que préfère-t-on en général ?"
    choices:
      - {text: "Une fonction virtuelle, que chaque classe redéfinit", correct: true}
      - {text: "Des `static_cast`, plus rapides", correct: false}
      - {text: "Un `switch` sur le nom de la classe", correct: false}
      - {text: "Des casts du C, plus courts", correct: false}
    answer: "Chaque classe apporte son comportement, et l'appelant n'a plus à connaître la liste des classes. Ajouter une classe ne demande aucune modification du code appelant."
  - key: qcm-reinterpret
    format: multiple-choice
    question: "À quoi sert `reinterpret_cast` ?"
    choices:
      - {text: "À relire les mêmes octets comme un autre type, sans conversion", correct: true}
      - {text: "À convertir une valeur d'un type numérique vers un autre", correct: false}
      - {text: "À vérifier le type réel d'un objet à l'exécution", correct: false}
      - {text: "À retirer le `const` d'une référence", correct: false}
    answer: "Il ne transforme rien : il change la façon de regarder une adresse ou des octets. Réservé au code bas niveau, et rarement portable."
  - key: code-dynamic-cast-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
      };

      class Chien : public Animal {};
      class Chat : public Animal {};

      int main() {
          Chien chien;
          Animal* animal = &chien;
          std::println("{} {}", dynamic_cast<Chien*>(animal) != nullptr, dynamic_cast<Chat*>(animal) != nullptr);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true false` : l'objet est un `Chien`. La conversion vers `Chien*` réussit ; celle vers `Chat*` échoue, et donne `nullptr`."
    check:
      output: "true false"
  - key: code-dynamic-cast-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <typeinfo>

      class Animal {
      public:
          virtual ~Animal() = default;
      };

      class Chien : public Animal {};
      class Chat : public Animal {};

      int main() {
          Chien chien;
          Animal& animal = chien;
          std::println("début");
          Chat& chat = dynamic_cast<Chat&>(animal);
          std::println("fin");
      }
      ```
    choices:
      - {text: "`début`, puis une exception `std::bad_cast`", correct: true}
      - text: |-
          ```
          début
          fin
          ```
        correct: false
      - {text: "`début`, puis un plantage sans exception", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`début`, puis `std::bad_cast` : `animal` désigne un `Chien`, pas un `Chat`. Une référence ne pouvant pas être nulle, l'échec est une exception, que personne ne rattrape ici."
    check:
      output: "début"
      throws: "std::bad_cast"
  - key: code-static-cast
    format: code-output
    question: |-
      ```cpp
      #include <print>

      int main() {
          double note = 15.9;
          int entier = static_cast<int>(note);
          char lettre = static_cast<char>(entier + 50);
          std::println("{} {}", entier, lettre);
      }
      ```
    choices:
      - {text: "`15 A`", correct: true}
      - {text: "`16 B`", correct: false}
      - {text: "`15 65`", correct: false}
      - {text: "`16 66`", correct: false}
    answer: "`15 A` : `static_cast<int>` tronque 15.9 en 15. 15 + 50 font 65, le code du caractère `A`, que `static_cast<char>` donne."
    check:
      output: "15 A"
  - key: code-const-cast
    format: code-output
    question: |-
      ```cpp
      #include <print>

      void remettre_a_zero(const int& valeur) {
          const_cast<int&>(valeur) = 0;
      }

      int main() {
          int compteur = 7;
          remettre_a_zero(compteur);
          std::println("{}", compteur);
      }
      ```
    choices:
      - {text: "`0`", correct: true}
      - {text: "`7`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
    answer: "`0` : `compteur` n'est pas déclaré `const`. Retirer le `const` de la référence, puis écrire, est permis, mais trompe l'appelant, à qui la signature promettait de ne rien modifier."
    check:
      output: "0"
  - key: bug-static-cast-faux
    format: bug-fix
    question: |-
      Ce programme devrait ne rien afficher, puisque l'animal est un chat. Il affiche pourtant `os rapporté`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
      };

      class Chien : public Animal {
      public:
          void rapporter() const { std::println("os rapporté"); }
      };

      class Chat : public Animal {};

      int main() {
          Chat chat;
          Animal* animal = &chat;
          Chien* chien = static_cast<Chien*>(animal);
          if (chien) {
              chien->rapporter();
          }
      }
      ```
    choices:
      - {text: "Utiliser `dynamic_cast<Chien*>(animal)`, qui donne `nullptr` pour un chat", correct: true}
      - {text: "Utiliser `reinterpret_cast<Chien*>(animal)`, qui vérifie le type", correct: false}
      - {text: "Utiliser `(Chien*)animal`, plus sûr que `static_cast`", correct: false}
      - {text: "Retirer le test `if (chien)`, qui ne sert à rien", correct: false}
    answer: |-
      ```cpp
      Chien* chien = dynamic_cast<Chien*>(animal);
      ```
      `static_cast` ne vérifie rien : le pointeur n'est pas nul, et le test passe. Traiter un `Chat` comme un `Chien`
      est un comportement indéfini. `dynamic_cast` regarde le type réel.
  - key: bug-classe-non-polymorphe
    format: bug-fix
    question: |-
      Le compilateur répond « source type is not polymorphic ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {};

      class Chien : public Animal {};

      int main() {
          Chien chien;
          Animal* animal = &chien;
          if (dynamic_cast<Chien*>(animal)) {
              std::println("c'est un chien");
          }
      }
      ```
    choices:
      - {text: "Donner à `Animal` un destructeur virtuel", correct: true}
      - {text: "Donner à `Chien` un constructeur par défaut", correct: false}
      - {text: "Déclarer `animal` avec `const Animal*`", correct: false}
      - {text: "Marquer la classe `Animal` avec `final`", correct: false}
    answer: |-
      ```cpp
      class Animal {
      public:
          virtual ~Animal() = default;
      };
      ```
      `dynamic_cast` lit le type réel dans les informations d'une classe polymorphe. Il lui faut au moins une
      fonction virtuelle ; le destructeur virtuel, qu'une classe de base doit avoir, suffit.
  - key: bug-resultat-non-teste
    format: bug-fix
    question: |-
      Ce programme plante (« Segmentation fault ») quand l'animal n'est pas un chien. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
      };

      class Chien : public Animal {
      public:
          int age = 3;
      };

      class Chat : public Animal {};

      int main() {
          Chat chat;
          Animal* animal = &chat;
          Chien* chien = dynamic_cast<Chien*>(animal);
          std::println("{}", chien->age);
      }
      ```
    choices:
      - {text: "Tester que `chien` n'est pas nul avant de s'en servir", correct: true}
      - {text: "Remplacer `dynamic_cast` par `static_cast`", correct: false}
      - {text: "Déclarer `age` avec le mot-clé `static`", correct: false}
      - {text: "Entourer l'affichage d'un `try` et d'un `catch`", correct: false}
    answer: |-
      ```cpp
      if (Chien* chien = dynamic_cast<Chien*>(animal)) {
          std::println("{}", chien->age);
      }
      ```
      Vers un pointeur, `dynamic_cast` signale l'échec par `nullptr`. Sans test, on déréférence un pointeur nul. Ce
      n'est pas une exception : un `catch` ne rattrape rien.
  - key: bug-const-cast
    format: bug-fix
    question: |-
      Ce programme a un comportement indéfini : il modifie un objet déclaré `const`. Il affiche `0` ici, et pourrait
      afficher `100` avec d'autres options de compilation. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      int main() {
          const int limite = 100;
          const int* p = &limite;
          *const_cast<int*>(p) = 0;
          std::println("{}", limite);
      }
      ```
    choices:
      - {text: "Déclarer `limite` sans `const`, si elle doit changer", correct: true}
      - {text: "Utiliser `reinterpret_cast<int*>(p)` à la place", correct: false}
      - {text: "Utiliser le cast du C : `*(int*)p = 0;`", correct: false}
      - {text: "Déclarer `p` avec `const int* const`", correct: false}
    answer: |-
      ```cpp
      int limite = 100;
      limite = 0;
      ```
      Le compilateur a le droit de remplacer partout `limite` par 100, puisqu'elle est constante : selon les options,
      l'écriture se voit ou non. `const_cast` permet de retirer `const` d'une référence ; modifier un objet
      réellement constant reste interdit, quel que soit le cast.
  - key: trous-dynamic-cast
    format: fill-in
    question: |-
      Complète avec le cast qui vérifie le type réel de l'objet :
      ```cpp
      if (auto* chien = ___<Chien*>(animal)) {
          chien->rapporter();
      }
      ```
    blanks:
      - [dynamic_cast]
    answer: "`dynamic_cast<Chien*>(animal)` renvoie `nullptr` si l'animal n'est pas un chien."
  - key: trous-static-cast
    format: fill-in
    question: |-
      Complète avec le cast des conversions numériques :
      ```cpp
      int somme = 31;
      double moyenne = ___<double>(somme) / 2;
      ```
    blanks:
      - [static_cast]
    answer: "`static_cast<double>(somme)` : une conversion ordinaire, vérifiée à la compilation."
  - key: trous-const-cast
    format: fill-in
    question: |-
      Une vieille fonction du C, `void afficher(char* texte)`, ne modifie pas son texte. Complète pour lui passer une
      chaîne constante :
      ```cpp
      const char* message = "bonjour";
      afficher(___<char*>(message));
      ```
    blanks:
      - [const_cast]
    answer: "`const_cast<char*>` retire le `const`. C'est son seul usage légitime : une fonction qui ne modifie pas, mais a oublié de le dire."
  - key: trous-type-vise
    format: fill-in
    question: |-
      Complète pour tester si la forme est un carré :
      ```cpp
      if (auto* carre = dynamic_cast<___*>(forme)) {
          std::println("{}", carre->cote());
      }
      ```
    blanks:
      - [Carre, "const Carre"]
    answer: "`dynamic_cast<Carre*>(forme)` : le type visé s'écrit entre chevrons."
  - key: situation-chaine-de-dynamic-cast
    format: scenario
    question: |-
      Une fonction `dessiner(Forme* forme)` teste par `dynamic_cast` si la forme est un cercle, un carré ou un
      triangle, et appelle le bon code. Chaque nouvelle forme oblige à la modifier. Que proposes-tu ?
    choices:
      - {text: "Une fonction virtuelle `dessiner` dans `Forme`, redéfinie par chaque classe", correct: true}
      - {text: "Des `static_cast` à la place des `dynamic_cast`, pour aller plus vite", correct: false}
      - {text: "Un membre `type` de type entier dans `Forme`, et un `switch`", correct: false}
      - {text: "Une fonction `dessiner` par forme, choisie par l'appelant", correct: false}
    answer: |-
      Chaque classe sait se dessiner : c'est à elle de porter ce code. L'appelant écrit `forme->dessiner()`, et une
      nouvelle forme n'oblige à modifier aucune fonction existante. Un entier et un `switch` reconstruiraient la
      vtable à la main.
  - key: situation-cast-du-c
    format: scenario
    question: |-
      En relecture, tu vois `Chien* chien = (Chien*)animal;`. L'auteur dit que « ça marche, et c'est plus court ».
      Que réponds-tu ?
    choices:
      - {text: "Que ce cast ne vérifie rien, et qu'il faut `dynamic_cast` si le type n'est pas certain", correct: true}
      - {text: "Qu'il a raison : le cast du C vérifie le type à l'exécution", correct: false}
      - {text: "Qu'il faut `reinterpret_cast`, qui fait la même chose en plus sûr", correct: false}
      - {text: "Qu'il faut `const_cast`, puisque `animal` n'est pas constant", correct: false}
    answer: |-
      Le cast du C se comporte ici comme un `static_cast`, sans aucune vérification, et pourrait tout aussi bien
      retirer un `const`. Si l'animal peut ne pas être un chien, `dynamic_cast` et un test ; s'il l'est toujours,
      `static_cast` le dit clairement.
  - key: situation-api-sans-const
    format: scenario
    question: |-
      Une bibliothèque en C propose `int longueur(char* texte)`, qui ne modifie pas son argument. Tu as une
      `const std::string`. Comment l'appelles-tu ?
    choices:
      - {text: "`longueur(const_cast<char*>(s.c_str()))`, avec un commentaire qui dit pourquoi", correct: true}
      - {text: "`longueur(static_cast<char*>(s.c_str()))`", correct: false}
      - {text: "`longueur(dynamic_cast<char*>(s.c_str()))`", correct: false}
      - {text: "En retirant `const` de la chaîne, dans tout le programme", correct: false}
    answer: |-
      C'est le cas d'usage de `const_cast` : une interface qui a oublié `const`, et dont on sait qu'elle ne modifie
      rien. `static_cast` refuse de retirer un `const`. Si la fonction écrivait dans le texte, ce serait un
      comportement indéfini.
  - key: situation-cout
    format: scenario
    question: |-
      Le profileur montre qu'une boucle très chaude passe son temps dans des `dynamic_cast`. Le type de chaque objet
      y est connu avec certitude. Que proposes-tu ?
    choices:
      - {text: "Un `static_cast`, puisque le type est certain, ou mieux, une fonction virtuelle", correct: true}
      - {text: "Un `reinterpret_cast`, le plus rapide de tous", correct: false}
      - {text: "Un cast du C, que le compilateur optimise mieux", correct: false}
      - {text: "De garder `dynamic_cast`, et de compiler sans optimisation", correct: false}
    answer: |-
      `dynamic_cast` parcourt les informations de type à l'exécution : c'est son prix. Quand le type est garanti par
      construction, `static_cast` ne coûte rien. Mais si le code doit distinguer les classes, une fonction virtuelle
      reste la solution la plus propre.
