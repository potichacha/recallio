notion: classes-abstraites
lesson: |-
  Une fonction **virtuelle pure** est une fonction virtuelle **sans implémentation** dans la classe de base. On
  l'écrit avec `= 0` :

  ```cpp
  class Forme {
  public:
      virtual ~Forme() = default;
      virtual double aire() const = 0;      // virtuelle pure
      virtual std::string nom() const = 0;
  };
  ```

  Une classe qui a **au moins une** fonction virtuelle pure est une **classe abstraite**.

  - On **ne peut pas en créer d'objet** : `Forme f;` ne compile pas.
  - On peut déclarer des **références** et des **pointeurs** vers elle : `const Forme&`, `std::unique_ptr<Forme>`.
  - Une classe dérivée doit **redéfinir toutes** les fonctions virtuelles pures pour devenir **concrète**. Si elle en
    oublie une, elle est abstraite à son tour.

  ```cpp
  class Carre : public Forme {
  public:
      explicit Carre(double cote) : cote_{cote} {}
      double aire() const override { return cote_ * cote_; }
      std::string nom() const override { return "carré"; }
  private:
      double cote_;
  };
  ```

  **L'interface.** C++ n'a pas de mot-clé `interface`. On en écrit une avec une classe abstraite qui ne contient que
  des **fonctions virtuelles pures** et un **destructeur virtuel**. Elle dit **ce que** les classes concrètes savent
  faire, sans dire comment. Le code qui s'en sert ne dépend que d'elle.

  Une classe abstraite peut aussi avoir des **données** et des **fonctions ordinaires**, qui appellent ses fonctions
  virtuelles pures : la base fixe le déroulement, les dérivées en fournissent les étapes.

  **À quoi cela sert.**

  - **Obliger** chaque classe dérivée à fournir un comportement : l'oubli est une erreur de compilation.
  - **Empêcher** de créer un objet qui n'aurait pas de sens, et donc le découpage d'objet par copie.
  - **Découpler** : on peut remplacer une implémentation par une autre, ou par un faux objet dans un test.

  **En entretien** : « Une fonction virtuelle pure, `= 0`, rend la classe abstraite : on ne peut pas l'instancier, et
  les dérivées doivent la redéfinir. Une interface, en C++, c'est une classe abstraite pure avec un destructeur
  virtuel. »
cards:
  - key: virtuelle-pure
    format: course
    question: "Que signifie `= 0` à la fin de `virtual double aire() const = 0;` ?"
    choices:
      - {text: "Que la fonction est virtuelle pure : sans implémentation ici, à redéfinir par les dérivées", correct: true}
      - {text: "Que la fonction renvoie zéro par défaut, tant qu'une dérivée ne la redéfinit pas", correct: false}
      - {text: "Que la fonction est supprimée : ni la base ni les dérivées ne peuvent l'appeler", correct: false}
      - {text: "Que la fonction ne prend aucun paramètre, et n'en prendra dans aucune dérivée", correct: false}
    answer: "`= 0` n'est pas une valeur : il marque une fonction virtuelle pure. La classe de base annonce la fonction, les classes dérivées la fournissent."
  - key: classe-abstraite
    format: course
    question: "Qu'est-ce qu'une classe abstraite ?"
    choices:
      - {text: "Une classe qui a au moins une fonction virtuelle pure, et qu'on ne peut pas instancier", correct: true}
      - {text: "Une classe qui n'a aucune donnée membre, et dont on ne peut donc rien stocker", correct: false}
      - {text: "Une classe dont tous les membres sont privés, et qu'on ne peut pas utiliser", correct: false}
      - {text: "Une classe marquée `final`, dont aucune autre classe ne peut dériver", correct: false}
    answer: "Une seule fonction virtuelle pure suffit. On ne peut pas en créer d'objet, mais on peut en dériver, et la désigner par référence ou par pointeur."
  - key: devenir-concrete
    format: course
    question: "Que doit faire une classe dérivée d'une classe abstraite pour pouvoir être instanciée ?"
    choices:
      - {text: "Redéfinir toutes les fonctions virtuelles pures dont elle hérite", correct: true}
      - {text: "Redéfinir au moins une des fonctions virtuelles pures", correct: false}
      - {text: "Déclarer un constructeur par défaut", correct: false}
      - {text: "Être marquée avec le mot-clé `final`", correct: false}
    answer: "Tant qu'il reste une fonction virtuelle pure non redéfinie, la classe dérivée est abstraite elle aussi."
  - key: interface
    format: course
    question: "Comment écrit-on une interface en C++ ?"
    choices:
      - {text: "Par une classe qui n'a que des fonctions virtuelles pures, et un destructeur virtuel", correct: true}
      - {text: "Par le mot-clé `interface`, à la place de `class`", correct: false}
      - {text: "Par une `struct` dont tous les membres sont des données", correct: false}
      - {text: "Par un fichier d'en-tête qui ne contient que des fonctions libres", correct: false}
    answer: "Le langage n'a pas de mot-clé pour cela. Une classe abstraite pure joue ce rôle : elle décrit ce que savent faire les classes concrètes, sans rien implémenter."
  - key: vf-instancier
    format: true-false
    question: On peut créer un objet d'une classe abstraite.
    truth: false
    answer: Le code ne compile pas. Il lui manquerait le corps d'au moins une fonction.
  - key: vf-pointeur
    format: true-false
    question: On peut déclarer un pointeur ou une référence vers une classe abstraite.
    truth: true
    answer: "C'est même son usage : désigner, par la base, des objets de classes concrètes."
  - key: vf-donnees
    format: true-false
    question: Une classe abstraite ne peut contenir ni données membres ni fonctions ordinaires.
    truth: false
    answer: Elle peut avoir les deux. Il suffit d'une fonction virtuelle pure pour qu'elle soit abstraite.
  - key: vf-oubli
    format: true-false
    question: "Une classe dérivée qui ne redéfinit pas toutes les fonctions virtuelles pures est abstraite, elle aussi."
    truth: true
    answer: Elle hérite de la fonction pure. La créer ne compile pas.
  - key: qcm-declaration
    format: multiple-choice
    question: Quelle ligne déclare une fonction virtuelle pure ?
    choices:
      - {text: "`virtual int aire() const = 0;`", correct: true}
      - {text: "`virtual int aire() const = delete;`", correct: false}
      - {text: "`virtual int aire() const {}`", correct: false}
      - {text: "`pure int aire() const;`", correct: false}
    answer: "`virtual` devant, `= 0` à la fin. `= delete` supprime la fonction, et des accolades vides lui donnent un corps."
  - key: qcm-parametre
    format: multiple-choice
    question: "`Forme` est abstraite. Laquelle de ces déclarations compile ?"
    choices:
      - {text: "`void dessiner(const Forme& forme);`", correct: true}
      - {text: "`void dessiner(Forme forme);`", correct: false}
      - {text: "`Forme forme;`", correct: false}
      - {text: "`std::vector<Forme> formes(3);`", correct: false}
    answer: "Une référence désigne un objet concret existant. Les trois autres créent des objets `Forme`, ce qui est impossible."
  - key: qcm-utilite
    format: multiple-choice
    question: "Quel avantage a une fonction virtuelle pure sur une fonction virtuelle avec un corps vide ?"
    choices:
      - {text: "Oublier de la redéfinir devient une erreur de compilation", correct: true}
      - {text: "Elle s'exécute plus vite qu'une fonction au corps vide", correct: false}
      - {text: "Elle peut être appelée sans objet", correct: false}
      - {text: "Elle n'a pas besoin de vtable", correct: false}
    answer: "Avec un corps vide, une dérivée qui oublie la fonction compile, et ne fait rien. Avec `= 0`, elle n'est pas instanciable tant que la fonction manque."
  - key: qcm-test
    format: multiple-choice
    question: "Pourquoi une interface facilite-t-elle les tests ?"
    choices:
      - {text: "On peut passer au code testé un faux objet, qui implémente l'interface", correct: true}
      - {text: "Une interface s'exécute sans avoir besoin d'être compilée", correct: false}
      - {text: "Une interface vérifie toute seule les résultats des fonctions", correct: false}
      - {text: "Une interface interdit les erreurs dans les classes concrètes", correct: false}
    answer: "Le code ne dépend que de l'interface. Dans un test, une implémentation simplifiée remplace la base de données ou le réseau."
  - key: trous-egal-zero
    format: fill-in
    question: |-
      Complète pour que la fonction soit virtuelle pure :
      ```cpp
      class Forme {
      public:
          virtual int aire() const = ___;
      };
      ```
    blanks:
      - ["0"]
    answer: "`= 0` : la fonction n'a pas d'implémentation dans `Forme`."
  - key: trous-virtual
    format: fill-in
    question: |-
      Complète la déclaration de la fonction virtuelle pure :
      ```cpp
      class Forme {
      public:
          ___ int aire() const = 0;
      };
      ```
    blanks:
      - [virtual]
    answer: "Une fonction pure est d'abord une fonction virtuelle."
  - key: trous-override
    format: fill-in
    question: |-
      Complète pour que `Carre` fournisse la fonction exigée par `Forme` :
      ```cpp
      class Carre : public Forme {
      public:
          int aire() const ___ { return cote_ * cote_; }

      private:
          int cote_ = 3;
      };
      ```
    blanks:
      - [override]
    answer: "`override` fait vérifier que la signature est bien celle de la fonction pure."
  - key: trous-destructeur
    format: fill-in
    question: |-
      Complète le destructeur de l'interface :
      ```cpp
      class Stockage {
      public:
          virtual ~Stockage() = ___;
          virtual void enregistrer(int valeur) = 0;
      };
      ```
    blanks:
      - [default]
    answer: "`virtual ~Stockage() = default;` : une interface a toujours un destructeur virtuel."
  - key: code-polymorphisme
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const = 0;
      };

      class Carre : public Forme {
      public:
          explicit Carre(int cote) : cote_{cote} {}
          int aire() const override { return cote_ * cote_; }

      private:
          int cote_;
      };

      void afficher(const Forme& forme) {
          std::println("{}", forme.aire());
      }

      int main() {
          Carre carre{4};
          afficher(carre);
      }
      ```
    choices:
      - {text: "`16`", correct: true}
      - {text: "`0`", correct: false}
      - {text: "`4`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`16` : `afficher` ne connaît que l'interface `Forme`. L'appel virtuel atteint `Carre::aire`."
    check:
      output: "16"
  - key: code-instancier
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const = 0;
      };

      int main() {
          Forme forme;
          std::println("{}", forme.aire());
      }
      ```
    choices:
      - {text: "Ça ne compile pas", correct: true}
      - {text: "`0`", correct: false}
      - {text: "Un nombre imprévisible", correct: false}
      - {text: "Rien", correct: false}
    answer: "Ça ne compile pas : `Forme` est abstraite, on ne peut pas en créer d'objet (« cannot declare variable 'forme' to be of abstract type »)."
    check:
      compiles: false
  - key: code-fonction-ordinaire
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const = 0;
          void saluer() const { std::println("{} !", cri()); }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
      };

      class Chat : public Animal {
      public:
          const char* cri() const override { return "miaou"; }
      };

      int main() {
          Chien chien;
          Chat chat;
          chien.saluer();
          chat.saluer();
      }
      ```
    choices:
      - text: |-
          ```
          ouaf !
          miaou !
          ```
        correct: true
      - text: |-
          ```
          ouaf !
          ouaf !
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
      - text: |-
          ```
           !
           !
          ```
        correct: false
    answer: |-
      ```
      ouaf !
      miaou !
      ```
      `saluer` est écrite une fois, dans la classe abstraite. Elle appelle `cri`, que chaque classe concrète fournit.
    check:
      output: |-
        ouaf !
        miaou !
  - key: code-collection
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <vector>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual const char* nom() const = 0;
      };

      class Carre : public Forme {
      public:
          const char* nom() const override { return "carré"; }
      };

      class Disque : public Forme {
      public:
          const char* nom() const override { return "disque"; }
      };

      int main() {
          std::vector<std::unique_ptr<Forme>> formes;
          formes.push_back(std::make_unique<Disque>());
          formes.push_back(std::make_unique<Carre>());
          for (const auto& forme : formes) {
              std::println("{}", forme->nom());
          }
      }
      ```
    choices:
      - text: |-
          ```
          disque
          carré
          ```
        correct: true
      - text: |-
          ```
          carré
          disque
          ```
        correct: false
      - {text: "Ça ne compile pas", correct: false}
      - text: |-
          ```
          disque
          disque
          ```
        correct: false
    answer: |-
      ```
      disque
      carré
      ```
      Le vecteur contient des pointeurs vers la classe abstraite. Chaque appel de `nom` atteint la classe concrète
      de l'objet, dans l'ordre où ils ont été rangés.
    check:
      output: |-
        disque
        carré
  - key: bug-instancier-abstraite
    format: bug-fix
    question: |-
      Le compilateur répond « cannot declare variable 'forme' to be of abstract type 'Forme' ». Quelle correction est
      la bonne ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const = 0;
      };

      class Carre : public Forme {
      public:
          int aire() const override { return 9; }
      };

      int main() {
          Forme forme;
          std::println("{}", forme.aire());
      }
      ```
    choices:
      - {text: "Créer un objet d'une classe concrète : `Carre forme;`", correct: true}
      - {text: "Créer l'objet avec des accolades : `Forme forme{};`", correct: false}
      - {text: "Créer l'objet sur le tas : `new Forme`", correct: false}
      - {text: "Retirer le destructeur virtuel de `Forme`", correct: false}
    answer: |-
      ```cpp
      Carre forme;
      ```
      Une classe abstraite ne s'instancie d'aucune façon : ni localement, ni avec `new`. On crée un objet d'une
      classe concrète, qu'on peut ensuite désigner par une `Forme&`.
  - key: bug-fonction-oubliee
    format: bug-fix
    question: |-
      Le compilateur répond « cannot declare variable 'disque' to be of abstract type 'Disque' ». Pourquoi ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const = 0;
          virtual const char* nom() const = 0;
      };

      class Disque : public Forme {
      public:
          int aire() const override { return 3; }
      };

      int main() {
          Disque disque;
          std::println("{}", disque.aire());
      }
      ```
    choices:
      - {text: "`Disque` ne redéfinit pas `nom` : elle reste abstraite", correct: true}
      - {text: "`Disque` n'a pas de constructeur par défaut", correct: false}
      - {text: "`Disque` ne peut pas dériver d'une classe abstraite", correct: false}
      - {text: "`aire` devrait être marquée `= 0` dans `Disque` aussi", correct: false}
    answer: |-
      ```cpp
      class Disque : public Forme {
      public:
          int aire() const override { return 3; }
          const char* nom() const override { return "disque"; }
      };
      ```
      Une classe dérivée doit fournir toutes les fonctions virtuelles pures. Une seule oubliée, et elle n'est pas
      instanciable.
  - key: bug-signature-differente
    format: bug-fix
    question: |-
      `Carre` définit bien une fonction `aire`, et le compilateur dit pourtant qu'elle est abstraite. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      class Forme {
      public:
          virtual ~Forme() = default;
          virtual int aire() const = 0;
      };

      class Carre : public Forme {
      public:
          int aire() { return 9; }
      };

      int main() {
          Carre carre;
          std::println("{}", carre.aire());
      }
      ```
    choices:
      - {text: "Écrire `int aire() const override { return 9; }`", correct: true}
      - {text: "Écrire `virtual int aire() { return 9; }`", correct: false}
      - {text: "Écrire `int aire() = 0 { return 9; }`", correct: false}
      - {text: "Écrire `static int aire() { return 9; }`", correct: false}
    answer: |-
      ```cpp
      int aire() const override { return 9; }
      ```
      Sans `const`, la fonction de `Carre` n'a pas la signature de la fonction pure : elle ne la redéfinit pas, et
      `Carre` reste abstraite. `override` aurait désigné la faute directement.
  - key: bug-interface-sans-destructeur
    format: bug-fix
    question: |-
      Ce programme n'affiche jamais `connexion fermée`. Quelle correction est la bonne ?
      ```cpp
      #include <memory>
      #include <print>

      class Stockage {
      public:
          virtual void enregistrer(int valeur) = 0;
      };

      class StockageBase : public Stockage {
      public:
          void enregistrer(int valeur) override { std::println("enregistré : {}", valeur); }
          ~StockageBase() { std::println("connexion fermée"); }
      };

      int main() {
          std::unique_ptr<Stockage> stockage = std::make_unique<StockageBase>();
          stockage->enregistrer(42);
      }
      ```
    choices:
      - {text: "Ajouter `virtual ~Stockage() = default;` à l'interface", correct: true}
      - {text: "Ajouter `= 0` au destructeur de `StockageBase`", correct: false}
      - {text: "Retirer `override` de la fonction `enregistrer`", correct: false}
      - {text: "Appeler `stockage.release();` à la fin de `main`", correct: false}
    answer: |-
      ```cpp
      class Stockage {
      public:
          virtual ~Stockage() = default;
          virtual void enregistrer(int valeur) = 0;
      };
      ```
      L'objet est détruit par un `Stockage*`. Sans destructeur virtuel dans l'interface, celui de `StockageBase` ne
      s'exécute pas.
