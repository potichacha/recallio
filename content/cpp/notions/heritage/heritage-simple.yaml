notion: heritage-simple
lesson: |-
  L'**héritage** crée une classe à partir d'une autre. La classe **dérivée** reprend les membres de la classe **de
  base**, et y ajoute les siens.

  ```cpp
  class Animal {
  public:
      explicit Animal(std::string nom) : nom_{std::move(nom)} {}
      const std::string& nom() const { return nom_; }
  protected:
      int age_ = 0;          // accessible aux classes dérivées
  private:
      std::string nom_;      // inaccessible, même aux classes dérivées
  };

  class Chien : public Animal {                  // Chien dérive d'Animal
  public:
      explicit Chien(std::string nom) : Animal{std::move(nom)} {}   // appelle le constructeur de base
      void vieillir() { ++age_; }
  };
  ```

  **L'héritage public dit « est un ».** Un `Chien` **est un** `Animal` : partout où l'on attend un `Animal` par
  référence ou par pointeur, on peut passer un `Chien`.

  **Les trois niveaux d'accès.**

  | Membre de la base | Accessible dans la dérivée | Accessible de l'extérieur |
  |---|---|---|
  | `public` | oui | oui |
  | `protected` | **oui** | non |
  | `private` | **non** | non |

  Un membre privé de la base **existe** dans l'objet dérivé, mais la classe dérivée n'y touche que par les fonctions
  de la base.

  **Le constructeur de base.** La partie « base » d'un objet est construite **par le constructeur de la base**, que
  la classe dérivée appelle dans sa **liste d'initialisation**. Si elle ne le fait pas, c'est le constructeur par
  défaut de la base qui est appelé ; s'il n'existe pas, le code ne compile pas. Une classe dérivée ne peut pas
  initialiser elle-même un membre de sa base.

  **Le piège du mot-clé.** `class Chien : Animal`, sans `public`, est un héritage **privé** : pour le code
  extérieur, un `Chien` n'est plus un `Animal`. Avec `class`, on écrit toujours `public`.

  L'héritage n'est pas le seul moyen de réutiliser du code. Si la relation n'est pas « est un » mais « a un », on met
  un **membre** : c'est la composition.

  **En entretien** : « L'héritage public modélise "est un". La dérivée appelle le constructeur de sa base dans sa
  liste d'initialisation, et n'accède qu'à ses membres publics et protégés. Pour "a un", je compose. »
cards:
  - key: definition-heritage
    format: course
    question: "Que signifie `class Chien : public Animal` ?"
    choices:
      - {text: "`Chien` dérive d'`Animal` : il reprend ses membres, et y ajoute les siens", correct: true}
      - {text: "`Chien` contient un membre public de type `Animal`", correct: false}
      - {text: "`Chien` et `Animal` sont deux noms pour la même classe", correct: false}
      - {text: "`Animal` dérive de `Chien`, dont il devient public", correct: false}
    answer: "`Chien` est la classe dérivée, `Animal` la classe de base. L'héritage public dit qu'un `Chien` est un `Animal`."
  - key: role-de-protected
    format: course
    question: "Qui peut accéder à un membre `protected` d'une classe ?"
    choices:
      - {text: "La classe elle-même et ses classes dérivées", correct: true}
      - {text: "La classe elle-même seulement", correct: false}
      - {text: "Tout le code, comme pour un membre public", correct: false}
      - {text: "Les classes dérivées seulement, pas la classe elle-même", correct: false}
    answer: "`protected` se situe entre `private` et `public` : fermé au code extérieur, ouvert aux classes dérivées."
  - key: constructeur-de-base
    format: course
    question: "Comment une classe dérivée initialise-t-elle la partie héritée de sa base ?"
    choices:
      - {text: "En appelant le constructeur de la base dans sa liste d'initialisation", correct: true}
      - {text: "En initialisant les membres privés de la base dans sa liste d'initialisation", correct: false}
      - {text: "En affectant les membres de la base dans le corps de son constructeur", correct: false}
      - {text: "Elle ne le peut pas : la base est construite par `main`", correct: false}
    answer: "`Chien(std::string nom) : Animal{nom} {}`. La base se construit elle-même ; la dérivée lui passe les arguments. Sans appel explicite, c'est le constructeur par défaut de la base."
  - key: est-un
    format: course
    question: Quelle relation l'héritage public exprime-t-il ?
    choices:
      - {text: "« Est un » : un objet dérivé peut servir partout où l'on attend la base", correct: true}
      - {text: "« A un » : un objet dérivé contient un objet de la base", correct: false}
      - {text: "« Utilise un » : un objet dérivé appelle les fonctions de la base", correct: false}
      - {text: "« Ressemble à » : les deux classes ont des membres de même nom", correct: false}
    answer: "Un `Chien` est un `Animal`. Si la relation est « a un » (une voiture a un moteur), on met un membre : c'est la composition."
  - key: vf-membre-prive
    format: true-false
    question: Une classe dérivée peut accéder directement aux membres privés de sa classe de base.
    truth: false
    answer: Ils existent dans l'objet dérivé, mais seules les fonctions de la base y accèdent. Pour les ouvrir aux dérivées, on les déclare `protected`.
  - key: vf-heritage-prive-par-defaut
    format: true-false
    question: "`class Chien : Animal`, sans mot-clé d'accès, est un héritage privé."
    truth: true
    answer: Avec `class`, l'héritage est privé par défaut. Le code extérieur ne peut plus traiter un `Chien` comme un `Animal`.
  - key: vf-passer-un-derive
    format: true-false
    question: "On peut passer un `Chien` à une fonction qui prend un `const Animal&`, si `Chien` dérive publiquement d'`Animal`."
    truth: true
    answer: Un `Chien` est un `Animal`. La référence désigne la partie `Animal` de l'objet.
  - key: vf-constructeurs-herites
    format: true-false
    question: Une classe dérivée hérite d'office des constructeurs de sa classe de base.
    truth: false
    answer: "Elle écrit les siens, qui appellent ceux de la base. On peut les reprendre explicitement avec `using Animal::Animal;`."
  - key: qcm-declaration
    format: multiple-choice
    question: "Quelle ligne déclare une classe `Carre` qui dérive publiquement de `Forme` ?"
    choices:
      - {text: "`class Carre : public Forme {`", correct: true}
      - {text: "`class Carre extends Forme {`", correct: false}
      - {text: "`class Carre(Forme) {`", correct: false}
      - {text: "`class Carre -> Forme {`", correct: false}
    answer: "Deux-points, le mot-clé d'accès, puis la base. `extends` est le mot de Java."
  - key: qcm-appel-du-constructeur
    format: multiple-choice
    question: "Comment le constructeur de `Chien` passe-t-il le nom au constructeur d'`Animal` ?"
    choices:
      - {text: "`Chien(std::string nom) : Animal{nom} {}`", correct: true}
      - {text: "`Chien(std::string nom) { Animal(nom); }`", correct: false}
      - {text: "`Chien(std::string nom) : nom_{nom} {}`", correct: false}
      - {text: "`Chien(std::string nom) { super(nom); }`", correct: false}
    answer: "Dans la liste d'initialisation, par le nom de la base. Dans le corps, `Animal(nom);` créerait un temporaire sans rapport, et `nom_` est un membre de la base, que la dérivée n'initialise pas."
  - key: qcm-composition
    format: multiple-choice
    question: "Une `Voiture` a un `Moteur`. Comment le modélise-t-on ?"
    choices:
      - {text: "Par un membre : `Moteur moteur_;` dans la classe `Voiture`", correct: true}
      - {text: "Par un héritage : `class Voiture : public Moteur`", correct: false}
      - {text: "Par un héritage : `class Moteur : public Voiture`", correct: false}
      - {text: "Par une fonction libre qui prend les deux en paramètre", correct: false}
    answer: "Une voiture n'est pas un moteur : la relation est « a un ». Hériter exposerait toutes les fonctions du moteur comme si c'étaient celles de la voiture."
  - key: qcm-sans-appel
    format: multiple-choice
    question: "Le constructeur d'une classe dérivée n'appelle pas celui de sa base. Que se passe-t-il ?"
    choices:
      - {text: "Le constructeur par défaut de la base est appelé ; s'il n'existe pas, le code ne compile pas", correct: true}
      - {text: "La partie héritée de l'objet n'est pas construite du tout", correct: false}
      - {text: "Le constructeur de la base est appelé avec les arguments de la dérivée", correct: false}
      - {text: "La base est construite après la dérivée, à la fin du constructeur", correct: false}
    answer: "La base est toujours construite, et toujours en premier. Sans appel explicite, c'est par son constructeur sans argument."
  - key: trous-public
    format: fill-in
    question: |-
      Complète pour qu'un `Chien` soit un `Animal` aux yeux de tout le code :
      ```cpp
      class Chien : ___ Animal {
      };
      ```
    blanks:
      - [public]
    answer: "`class Chien : public Animal` : l'héritage public."
  - key: trous-protected
    format: fill-in
    question: |-
      Complète pour que `age_` soit accessible aux classes dérivées, mais pas au code extérieur :
      ```cpp
      class Animal {
      ___:
          int age_ = 0;
      };
      ```
    blanks:
      - [protected]
    answer: "`protected:` ouvre le membre aux classes dérivées seulement."
  - key: trous-constructeur-de-base
    format: fill-in
    question: |-
      Complète pour appeler le constructeur de la classe de base :
      ```cpp
      class Chien : public Animal {
      public:
          explicit Chien(std::string nom) : ___{nom} {}
      };
      ```
    blanks:
      - [Animal]
    answer: "`: Animal{nom}` : le constructeur de la base, dans la liste d'initialisation."
  - key: trous-deux-points
    format: fill-in
    question: |-
      Complète avec le caractère qui introduit la classe de base :
      ```cpp
      class Carre ___ public Forme {
      };
      ```
    blanks:
      - [":"]
    answer: "`class Carre : public Forme`."
  - key: code-membres-herites
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compteur {
      public:
          void incrementer() { ++valeur_; }
          int valeur() const { return valeur_; }

      private:
          int valeur_ = 0;
      };

      class CompteurDouble : public Compteur {
      public:
          void incrementer_deux_fois() {
              incrementer();
              incrementer();
          }
      };

      int main() {
          CompteurDouble c;
          c.incrementer_deux_fois();
          c.incrementer();
          std::println("{}", c.valeur());
      }
      ```
    choices:
      - {text: "`3`", correct: true}
      - {text: "`2`", correct: false}
      - {text: "`1`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`3` : la classe dérivée reprend `incrementer` et `valeur`. Elle n'accède pas à `valeur_`, privé, mais passe par les fonctions publiques de sa base."
    check:
      output: "3"
  - key: code-constructeur-de-base
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      class Animal {
      public:
          explicit Animal(std::string nom) : nom_{nom} {}
          const std::string& nom() const { return nom_; }

      private:
          std::string nom_;
      };

      class Chien : public Animal {
      public:
          Chien() : Animal{"Rex"} {}
          explicit Chien(std::string nom) : Animal{nom} {}
      };

      int main() {
          Chien a;
          Chien b{"Médor"};
          std::println("{} {}", a.nom(), b.nom());
      }
      ```
    choices:
      - {text: "`Rex Médor`", correct: true}
      - {text: "`Rex Rex`", correct: false}
      - {text: "`Médor Médor`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`Rex Médor` : chaque constructeur de `Chien` passe un nom au constructeur d'`Animal`, qui initialise `nom_`."
    check:
      output: "Rex Médor"
  - key: code-protected
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() const { return solde_; }

      protected:
          int solde_ = 100;
      };

      class CompteEpargne : public Compte {
      public:
          void verser_interets() { solde_ += solde_ / 10; }
      };

      int main() {
          CompteEpargne compte;
          compte.verser_interets();
          compte.verser_interets();
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "`121`", correct: true}
      - {text: "`120`", correct: false}
      - {text: "`110`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`121` : `solde_` est `protected`, la classe dérivée peut le modifier. Deux fois 10 % : 110, puis 121."
    check:
      output: "121"
  - key: code-derive-passe-pour-base
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <string>

      class Animal {
      public:
          explicit Animal(std::string nom) : nom_{nom} {}
          const std::string& nom() const { return nom_; }

      private:
          std::string nom_;
      };

      class Chien : public Animal {
      public:
          explicit Chien(std::string nom) : Animal{nom} {}
      };

      void presenter(const Animal& animal) {
          std::println("Voici {}", animal.nom());
      }

      int main() {
          Chien rex{"Rex"};
          presenter(rex);
      }
      ```
    choices:
      - {text: "`Voici Rex`", correct: true}
      - {text: "`Voici `", correct: false}
      - {text: "Ça ne compile pas", correct: false}
      - {text: "Rien", correct: false}
    answer: "`Voici Rex` : un `Chien` est un `Animal`. La fonction reçoit une référence vers la partie `Animal` de l'objet."
    check:
      output: "Voici Rex"
  - key: bug-heritage-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'Animal' is an inaccessible base of 'Chien' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          void manger() const { std::println("miam"); }
      };

      class Chien : Animal {
      };

      void nourrir(const Animal& animal) {
          animal.manger();
      }

      int main() {
          Chien rex;
          nourrir(rex);
      }
      ```
    choices:
      - {text: "Écrire `class Chien : public Animal`", correct: true}
      - {text: "Écrire `class Chien : private Animal`", correct: false}
      - {text: "Écrire `nourrir(Animal{rex});` dans `main`", correct: false}
      - {text: "Écrire `friend class Chien;` dans `Animal`", correct: false}
    answer: |-
      ```cpp
      class Chien : public Animal {
      };
      ```
      Sans mot-clé, l'héritage d'une `class` est privé : pour `main`, un `Chien` n'est pas un `Animal`. L'héritage
      public rétablit la relation « est un ».
  - key: bug-membre-prive
    format: bug-fix
    question: |-
      Le compilateur répond « 'int Compte::solde_' is private within this context ». La classe dérivée doit pouvoir
      modifier le solde, mais pas le code extérieur. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Compte {
      public:
          int solde() const { return solde_; }

      private:
          int solde_ = 100;
      };

      class CompteEpargne : public Compte {
      public:
          void verser_interets() { solde_ += 10; }
      };

      int main() {
          CompteEpargne compte;
          compte.verser_interets();
          std::println("{}", compte.solde());
      }
      ```
    choices:
      - {text: "Déclarer `solde_` dans une section `protected:`", correct: true}
      - {text: "Déclarer `solde_` dans la section `public:`", correct: false}
      - {text: "Déclarer `solde_` une seconde fois, dans `CompteEpargne`", correct: false}
      - {text: "Écrire `Compte::solde_ += 10;` dans la fonction", correct: false}
    answer: |-
      ```cpp
      protected:
          int solde_ = 100;
      ```
      Un membre privé est fermé aux classes dérivées. `protected` le leur ouvre, sans l'ouvrir au reste du code.
      Redéclarer `solde_` dans la dérivée créerait un second membre, sans rapport avec le premier.
  - key: bug-base-sans-constructeur-par-defaut
    format: bug-fix
    question: |-
      Le compilateur répond « no matching function for call to 'Animal::Animal()' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <string>

      class Animal {
      public:
          explicit Animal(std::string nom) : nom_{nom} {}
          const std::string& nom() const { return nom_; }

      private:
          std::string nom_;
      };

      class Chien : public Animal {
      public:
          explicit Chien(std::string nom) {}
      };

      int main() {
          Chien rex{"Rex"};
          std::println("{}", rex.nom());
      }
      ```
    choices:
      - {text: "Écrire `explicit Chien(std::string nom) : Animal{nom} {}`", correct: true}
      - {text: "Écrire `explicit Chien(std::string nom) { nom_ = nom; }`", correct: false}
      - {text: "Écrire `explicit Chien(std::string nom) { Animal{nom}; }`", correct: false}
      - {text: "Écrire `Chien rex;` dans `main`, sans argument", correct: false}
    answer: |-
      ```cpp
      explicit Chien(std::string nom) : Animal{nom} {}
      ```
      Sans appel explicite, le compilateur cherche le constructeur par défaut d'`Animal`, qui n'existe pas. La base se
      construit dans la liste d'initialisation de la dérivée.
  - key: bug-initialiser-un-membre-de-la-base
    format: bug-fix
    question: |-
      Le compilateur répond « class 'Chien' does not have any field named 'age_' ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          explicit Animal(int age) : age_{age} {}
          int age() const { return age_; }

      protected:
          int age_;
      };

      class Chien : public Animal {
      public:
          explicit Chien(int age) : age_{age} {}
      };

      int main() {
          Chien rex{3};
          std::println("{}", rex.age());
      }
      ```
    choices:
      - {text: "Passer l'âge au constructeur de la base : `: Animal{age}`", correct: true}
      - {text: "Déclarer `age_` dans la section `public:` d'`Animal`", correct: false}
      - {text: "Écrire `: this->age_{age}` dans la liste d'initialisation", correct: false}
      - {text: "Retirer le constructeur d'`Animal`", correct: false}
    answer: |-
      ```cpp
      explicit Chien(int age) : Animal{age} {}
      ```
      Une classe n'initialise que ses propres membres. Ceux de la base, même `protected`, sont initialisés par le
      constructeur de la base.
