notion: ordre-construction
lesson: |-
  Un objet d'une classe dérivée se construit **de la base vers la dérivée**, et se détruit dans l'**ordre inverse**.

  **La construction**, pour `Chien` qui dérive d'`Animal` :

  1. la **classe de base** : le constructeur d'`Animal` ;
  2. les **membres** de `Chien`, dans l'ordre de leur déclaration ;
  3. le **corps** du constructeur de `Chien`.

  **La destruction**, exactement à l'envers :

  1. le **corps** du destructeur de `Chien` ;
  2. les **membres** de `Chien`, dans l'ordre inverse ;
  3. le destructeur d'`Animal`.

  ```cpp
  Chien rex;     // affiche : Animal, puis Chien
  // fin du bloc : ~Chien, puis ~Animal
  ```

  La logique est simple : la dérivée **s'appuie** sur la base. Elle doit donc la trouver construite quand elle se
  construit, et encore en vie quand elle se détruit.

  Avec plusieurs niveaux, la règle s'applique de proche en proche : la base de la base d'abord.

  **Ce qui en découle.**

  - Dans le constructeur de la **base**, la partie dérivée **n'existe pas encore**. Un appel de fonction virtuelle y
    exécute la version de la base, jamais celle de la dérivée. De même dans son destructeur : la partie dérivée est
    déjà détruite.
  - L'ordre écrit dans la liste d'initialisation **n'y change rien** : la base est toujours construite en premier.
    Passer à la base une valeur calculée à partir d'un membre de la dérivée, c'est lire un membre non initialisé.
  - On n'appelle **jamais** soi-même le destructeur de la base : il l'est d'office, après celui de la dérivée.

  **En entretien** : « Construction : base, membres, corps du constructeur dérivé. Destruction dans l'ordre inverse.
  C'est pourquoi un appel virtuel dans un constructeur de base n'atteint jamais la classe dérivée. »
cards:
  - key: ordre-de-construction
    format: course
    question: "Dans quel ordre un objet d'une classe dérivée est-il construit ?"
    choices:
      - {text: "La classe de base, puis les membres de la dérivée, puis le corps de son constructeur", correct: true}
      - {text: "Le corps du constructeur de la dérivée, puis ses membres, puis la classe de base", correct: false}
      - {text: "Les membres de la dérivée, puis la classe de base, puis le corps du constructeur", correct: false}
      - {text: "Dans l'ordre écrit dans la liste d'initialisation de la dérivée", correct: false}
    answer: "La base d'abord : la dérivée s'appuie sur elle. Puis les membres de la dérivée, dans l'ordre de leur déclaration, et enfin le corps de son constructeur."
  - key: ordre-de-destruction
    format: course
    question: "Dans quel ordre un objet d'une classe dérivée est-il détruit ?"
    choices:
      - {text: "Le destructeur de la dérivée, puis ses membres, puis le destructeur de la base", correct: true}
      - {text: "Le destructeur de la base, puis les membres de la dérivée, puis son destructeur", correct: false}
      - {text: "Les membres de la dérivée, puis le destructeur de la base, puis celui de la dérivée", correct: false}
      - {text: "Dans un ordre que le compilateur choisit librement", correct: false}
    answer: "L'ordre inverse de la construction. La base est détruite en dernier : la dérivée peut s'en servir jusqu'à la fin de son propre destructeur."
  - key: pourquoi-cet-ordre
    format: course
    question: Pourquoi la classe de base est-elle construite avant la classe dérivée ?
    choices:
      - {text: "Le constructeur de la dérivée peut avoir besoin de la partie héritée, déjà prête", correct: true}
      - {text: "La classe de base est écrite plus haut dans le fichier source", correct: false}
      - {text: "La classe de base occupe moins de mémoire que la classe dérivée", correct: false}
      - {text: "Le constructeur de la base est toujours plus rapide", correct: false}
    answer: "Une classe dérivée utilise les membres de sa base. Ils doivent exister quand son constructeur s'exécute, et encore quand son destructeur s'exécute."
  - key: virtuel-dans-constructeur
    format: course
    question: "Que fait un appel de fonction virtuelle placé dans le constructeur de la classe de base ?"
    choices:
      - {text: "Il exécute la version de la base : la partie dérivée n'existe pas encore", correct: true}
      - {text: "Il exécute la version de la dérivée, comme tout appel virtuel", correct: false}
      - {text: "Il ne compile pas : un constructeur ne peut pas appeler de fonction", correct: false}
      - {text: "Il attend la fin de la construction, puis exécute la version dérivée", correct: false}
    answer: "Pendant que la base se construit, l'objet n'est encore qu'un objet de la base. L'appel virtuel ne descend pas vers une dérivée dont les membres ne sont pas construits."
  - key: vf-base-en-premier
    format: true-false
    question: "Le constructeur de la classe de base s'exécute avant celui de la classe dérivée."
    truth: true
    answer: La base est toujours construite en premier, quel que soit l'ordre de la liste d'initialisation.
  - key: vf-destructeur-de-base-a-la-main
    format: true-false
    question: "Le destructeur d'une classe dérivée doit appeler lui-même celui de sa classe de base."
    truth: false
    answer: L'appel est automatique, après le corps du destructeur de la dérivée. L'appeler à la main le ferait s'exécuter deux fois.
  - key: vf-liste-change-l-ordre
    format: true-false
    question: "Écrire un membre avant la classe de base, dans la liste d'initialisation, le fait construire avant elle."
    truth: false
    answer: L'ordre de la liste n'a aucun effet. La base, puis les membres dans l'ordre de leur déclaration.
  - key: vf-plusieurs-niveaux
    format: true-false
    question: "Avec trois niveaux d'héritage, la classe la plus haute dans la hiérarchie est construite en premier."
    truth: true
    answer: "La règle s'applique de proche en proche : la base de la base, puis la base, puis la dérivée."
  - key: qcm-premier-destructeur
    format: multiple-choice
    question: "`Chien` dérive d'`Animal`. Quand un `Chien` est détruit, quel destructeur s'exécute en premier ?"
    choices:
      - {text: "Celui de `Chien`", correct: true}
      - {text: "Celui d'`Animal`", correct: false}
      - {text: "Les deux, en même temps", correct: false}
      - {text: "Aucun : seul celui d'`Animal` s'exécute", correct: false}
    answer: "La destruction suit l'ordre inverse de la construction : la dérivée d'abord, la base ensuite."
  - key: qcm-membres-et-corps
    format: multiple-choice
    question: "Dans la construction d'un objet dérivé, quand ses propres membres sont-ils initialisés ?"
    choices:
      - {text: "Après la classe de base, avant le corps de son constructeur", correct: true}
      - {text: "Avant la classe de base", correct: false}
      - {text: "Après le corps de son constructeur", correct: false}
      - {text: "Pendant le corps de son constructeur, ligne par ligne", correct: false}
    answer: "Base, membres, corps. Quand le corps du constructeur commence, tout est déjà initialisé."
  - key: qcm-membre-passe-a-la-base
    format: multiple-choice
    question: "Le constructeur d'une dérivée écrit `: Base{taille_}, taille_{10}`. Que reçoit le constructeur de la base ?"
    choices:
      - {text: "Une valeur indéterminée : `taille_` n'est pas encore initialisé", correct: true}
      - {text: "10 : la liste est évaluée avant tout appel", correct: false}
      - {text: "0 : un membre vaut zéro avant son initialisation", correct: false}
      - {text: "Rien : le code ne compile pas", correct: false}
    answer: "La base est construite avant les membres de la dérivée. `taille_` est lu avant d'avoir reçu 10 : c'est un comportement indéfini."
  - key: qcm-virtuel-dans-destructeur
    format: multiple-choice
    question: "Que fait un appel de fonction virtuelle dans le destructeur de la classe de base ?"
    choices:
      - {text: "Il exécute la version de la base : la partie dérivée est déjà détruite", correct: true}
      - {text: "Il exécute la version de la dérivée, une dernière fois", correct: false}
      - {text: "Il relance la destruction de la partie dérivée", correct: false}
      - {text: "Il lève une exception à l'exécution", correct: false}
    answer: "Le destructeur de la dérivée s'est déjà exécuté. Comme dans un constructeur de base, l'appel virtuel ne descend pas."
  - key: code-construction
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          Animal() { std::println("Animal"); }
      };

      class Chien : public Animal {
      public:
          Chien() { std::println("Chien"); }
      };

      int main() {
          Chien rex;
      }
      ```
    choices:
      - text: |-
          ```
          Animal
          Chien
          ```
        correct: true
      - text: |-
          ```
          Chien
          Animal
          ```
        correct: false
      - {text: "`Chien`", correct: false}
      - {text: "`Animal`", correct: false}
    answer: |-
      ```
      Animal
      Chien
      ```
      La base est construite en premier, par son constructeur par défaut, puis le corps du constructeur de `Chien`
      s'exécute.
    check:
      output: |-
        Animal
        Chien
  - key: code-destruction
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          ~Animal() { std::println("~Animal"); }
      };

      class Chien : public Animal {
      public:
          ~Chien() { std::println("~Chien"); }
      };

      int main() {
          Chien rex;
          std::println("fin");
      }
      ```
    choices:
      - text: |-
          ```
          fin
          ~Chien
          ~Animal
          ```
        correct: true
      - text: |-
          ```
          fin
          ~Animal
          ~Chien
          ```
        correct: false
      - text: |-
          ```
          ~Chien
          ~Animal
          fin
          ```
        correct: false
      - text: |-
          ```
          fin
          ~Chien
          ```
        correct: false
    answer: |-
      ```
      fin
      ~Chien
      ~Animal
      ```
      À la fin de `main`, le destructeur de `Chien` s'exécute d'abord, puis celui de sa base, appelé d'office.
    check:
      output: |-
        fin
        ~Chien
        ~Animal
  - key: code-trois-niveaux
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class A {
      public:
          A() { std::print("A"); }
          ~A() { std::print("a"); }
      };

      class B : public A {
      public:
          B() { std::print("B"); }
          ~B() { std::print("b"); }
      };

      class C : public B {
      public:
          C() { std::print("C"); }
          ~C() { std::print("c"); }
      };

      int main() {
          C objet;
      }
      ```
    choices:
      - {text: "`ABCcba`", correct: true}
      - {text: "`CBAabc`", correct: false}
      - {text: "`ABCabc`", correct: false}
      - {text: "`Cc`", correct: false}
    answer: "`ABCcba` : la construction descend la hiérarchie, de la base la plus haute à la dérivée. La destruction la remonte."
    check:
      output: "ABCcba"
  - key: code-membre
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Trace {
      public:
          Trace(const char* nom) { std::println("{}", nom); }
      };

      class Vehicule {
      public:
          Vehicule() { std::println("véhicule"); }
      };

      class Voiture : public Vehicule {
      public:
          Voiture() { std::println("voiture"); }

      private:
          Trace moteur_{"moteur"};
      };

      int main() {
          Voiture voiture;
      }
      ```
    choices:
      - text: |-
          ```
          véhicule
          moteur
          voiture
          ```
        correct: true
      - text: |-
          ```
          moteur
          véhicule
          voiture
          ```
        correct: false
      - text: |-
          ```
          véhicule
          voiture
          moteur
          ```
        correct: false
      - text: |-
          ```
          voiture
          moteur
          véhicule
          ```
        correct: false
    answer: |-
      ```
      véhicule
      moteur
      voiture
      ```
      La base, puis les membres de la dérivée, puis le corps de son constructeur.
    check:
      output: |-
        véhicule
        moteur
        voiture
  - key: bug-virtuel-dans-constructeur
    format: bug-fix
    question: |-
      L'auteur attendait `ouaf` à la création du chien. Le programme affiche `...`. Pourquoi ?
      ```cpp
      #include <print>

      class Animal {
      public:
          Animal() { crier(); }
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const override { std::println("ouaf"); }
      };

      int main() {
          Chien rex;
      }
      ```
    choices:
      - {text: "Dans le constructeur d'`Animal`, la partie `Chien` n'existe pas encore : l'appel reste dans la base", correct: true}
      - {text: "Une fonction virtuelle ne peut jamais être appelée depuis une fonction membre de sa propre classe", correct: false}
      - {text: "Le constructeur de `Chien` s'exécute avant celui d'`Animal`, et remplace son affichage", correct: false}
      - {text: "`override` empêche la fonction d'être appelée pendant toute la durée de vie de l'objet", correct: false}
    answer: |-
      ```cpp
      int main() {
          Chien rex;
          rex.crier();
      }
      ```
      Pendant la construction de la base, l'objet n'est qu'un `Animal`. On appelle la fonction virtuelle une fois
      l'objet entièrement construit.
  - key: bug-membre-passe-a-la-base
    format: bug-fix
    question: |-
      Ce programme devrait afficher `10`, et affiche un nombre imprévisible. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Tampon {
      public:
          explicit Tampon(int taille) : taille_{taille} {}
          int taille() const { return taille_; }

      private:
          int taille_;
      };

      class Journal : public Tampon {
      public:
          Journal() : Tampon{lignes_}, lignes_{10} {}

      private:
          int lignes_;
      };

      int main() {
          Journal journal;
          std::println("{}", journal.taille());
      }
      ```
    choices:
      - {text: "Passer la valeur à la base directement : `: Tampon{10}, lignes_{10}`", correct: true}
      - {text: "Écrire `lignes_{10}` avant `Tampon{lignes_}` dans la liste", correct: false}
      - {text: "Déclarer `lignes_` dans la section `protected:` de `Journal`", correct: false}
      - {text: "Appeler `Tampon{lignes_}` dans le corps du constructeur", correct: false}
    answer: |-
      ```cpp
      Journal() : Tampon{10}, lignes_{10} {}
      ```
      La base est construite avant les membres de la dérivée, quel que soit l'ordre de la liste : `lignes_` est lu
      avant d'être initialisé. La base reçoit une valeur qui ne dépend d'aucun membre.
  - key: bug-destructeur-de-base-appele
    format: bug-fix
    question: |-
      Ce programme affiche `fermeture` deux fois. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Fichier {
      public:
          ~Fichier() { std::println("fermeture"); }
      };

      class Journal : public Fichier {
      public:
          ~Journal() {
              std::println("dernière ligne");
              Fichier::~Fichier();
          }
      };

      int main() {
          Journal journal;
      }
      ```
    choices:
      - {text: "Retirer l'appel `Fichier::~Fichier();`", correct: true}
      - {text: "Retirer le destructeur de la classe `Fichier`", correct: false}
      - {text: "Appeler `Fichier::~Fichier();` avant l'affichage", correct: false}
      - {text: "Déclarer `journal` avec le mot-clé `static`", correct: false}
    answer: |-
      ```cpp
      ~Journal() {
          std::println("dernière ligne");
      }
      ```
      Le destructeur de la base est appelé d'office, après celui de la dérivée. L'appeler à la main le fait
      s'exécuter deux fois sur le même objet : un comportement indéfini.
  - key: bug-ressource-detruite-trop-tot
    format: bug-fix
    question: |-
      L'auteur veut que le dernier message soit écrit **avant** la fermeture du fichier. Le programme affiche
      `fermeture`, puis `dernier message`. Pourquoi ?
      ```cpp
      #include <print>

      class Fichier {
      public:
          ~Fichier() { std::println("fermeture"); }
      };

      class Message {
      public:
          ~Message() { std::println("dernier message"); }
      };

      class Journal : public Message {
      private:
          Fichier fichier_;
      };

      int main() {
          Journal journal;
      }
      ```
    choices:
      - {text: "Les membres sont détruits avant la classe de base", correct: true}
      - {text: "La classe de base est détruite avant les membres", correct: false}
      - {text: "Un membre privé est toujours détruit en premier", correct: false}
      - {text: "Un destructeur généré s'exécute dans un ordre aléatoire", correct: false}
    answer: |-
      ```cpp
      class Journal {
      private:
          Fichier fichier_;
          Message message_;
      };
      ```
      La destruction va de la dérivée vers la base : `fichier_`, membre de `Journal`, disparaît avant `Message`. Avec
      deux membres, déclarés dans le bon ordre, le message (déclaré en dernier) est détruit en premier.
