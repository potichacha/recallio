notion: dynamic-cast
lesson: |-
  `dynamic_cast` convertit un pointeur ou une référence vers une classe de base en pointeur ou référence vers une
  classe **dérivée**, en **vérifiant à l'exécution** que l'objet est bien de ce type.

  ```cpp
  Forme* forme = obtenir();
  if (auto* cercle = dynamic_cast<Cercle*>(forme)) {
      std::println("{}", cercle->rayon());      // l'objet est bien un Cercle
  }
  ```

  **Ce qui se passe en cas d'échec.**

  | Forme | Si l'objet n'est pas du type demandé |
  |---|---|
  | `dynamic_cast<Cercle*>(pointeur)` | renvoie **`nullptr`** : on teste |
  | `dynamic_cast<Cercle&>(reference)` | lance **`std::bad_cast`** : une référence ne peut pas être nulle |

  **La condition : une classe polymorphe.** `dynamic_cast` vers une classe dérivée ne compile que si la classe de
  base a **au moins une fonction virtuelle**. C'est par la table des fonctions virtuelles que l'objet transporte
  son type.

  **L'information de type à l'exécution (RTTI).** Ce mécanisme sert aussi à `typeid` (en-tête `<typeinfo>`), qui
  donne le type réel d'un objet polymorphe :

  ```cpp
  typeid(*forme) == typeid(Cercle)     // vrai seulement pour un Cercle exactement
  ```

  `typeid` compare le type **exact** ; `dynamic_cast` réussit aussi pour une classe **dérivée** du type demandé.

  **`dynamic_cast` ou `static_cast` ?**

  | | Vérifie | Coût | Si le type est faux |
  |---|---|---|---|
  | `static_cast<Cercle*>(forme)` | rien | nul | comportement indéfini |
  | `dynamic_cast<Cercle*>(forme)` | à l'exécution | une recherche dans la hiérarchie | `nullptr` ou `std::bad_cast` |

  **Un signal d'alerte.** Une suite de `dynamic_cast` qui teste chaque type dérivé refait à la main ce que font
  les fonctions virtuelles :

  ```cpp
  if (auto* c = dynamic_cast<Cercle*>(f)) { ... }
  else if (auto* r = dynamic_cast<Rectangle*>(f)) { ... }     // à chaque nouveau type, une branche à ajouter
  ```

  On préfère une **fonction virtuelle** dans la base, ou un `std::variant` avec `std::visit`. `dynamic_cast` reste
  légitime pour interroger une capacité facultative, ou à la frontière d'un code qu'on ne peut pas modifier.

  **En entretien** : « `dynamic_cast` descend dans une hiérarchie polymorphe en vérifiant le type à l'exécution :
  `nullptr` pour un pointeur, `std::bad_cast` pour une référence. Il exige une fonction virtuelle dans la base.
  S'il se multiplie, il manque sans doute une fonction virtuelle. »
cards:
  - key: role
    format: course
    question: "Que fait `dynamic_cast<Cercle*>(forme)`, où `forme` est un `Forme*` ?"
    choices:
      - {text: "Il renvoie un `Cercle*` si l'objet est un cercle, et `nullptr` sinon", correct: true}
      - {text: "Il convertit le pointeur sans rien vérifier, comme `static_cast`", correct: false}
      - {text: "Il crée un nouveau `Cercle` à partir de la forme", correct: false}
      - {text: "Il renvoie un `Cercle*`, ou arrête le programme si le type est faux", correct: false}
    answer: "La vérification se fait à l'exécution, sur le type réel de l'objet. Le résultat se teste avant d'être utilisé."
  - key: reference
    format: course
    question: "Que fait `dynamic_cast<Cercle&>(forme)` quand l'objet n'est pas un `Cercle` ?"
    choices:
      - {text: "Il lance `std::bad_cast`", correct: true}
      - {text: "Il renvoie une référence nulle", correct: false}
      - {text: "Il renvoie une référence vers un `Cercle` par défaut", correct: false}
      - {text: "Il refuse de compiler", correct: false}
    answer: "Une référence ne peut pas être nulle : l'échec se signale par une exception. Avec un pointeur, il se signale par `nullptr`."
  - key: polymorphe
    format: course
    question: "Quelle condition la classe de base doit-elle remplir pour qu'on puisse descendre vers une classe dérivée avec `dynamic_cast` ?"
    choices:
      - {text: "Avoir au moins une fonction virtuelle", correct: true}
      - {text: "Avoir un constructeur par défaut", correct: false}
      - {text: "N'avoir aucun membre privé", correct: false}
      - {text: "Être déclarée `final`", correct: false}
    answer: "Le type réel est retrouvé grâce à la table des fonctions virtuelles. Sans fonction virtuelle, l'objet ne transporte pas son type, et le code ne compile pas."
  - key: alerte
    format: course
    question: "Que suggère une suite de `dynamic_cast` qui teste chaque type dérivé l'un après l'autre ?"
    choices:
      - {text: "Qu'il manque une fonction virtuelle dans la classe de base", correct: true}
      - {text: "Qu'il faut remplacer chaque `dynamic_cast` par un `reinterpret_cast`", correct: false}
      - {text: "Que la hiérarchie compte trop peu de classes dérivées", correct: false}
      - {text: "Que le destructeur de la classe de base n'est pas virtuel", correct: false}
    answer: "Choisir un traitement d'après le type réel, c'est le rôle du polymorphisme. Avec une fonction virtuelle, ajouter un type n'oblige plus à modifier ce code."
  - key: vf-static-cast
    format: true-false
    question: "`static_cast` vérifie à l'exécution que l'objet est bien du type dérivé demandé."
    truth: false
    answer: "Il ne vérifie rien. Si le type est faux, le comportement est indéfini. C'est `dynamic_cast` qui vérifie."
  - key: vf-nullptr
    format: true-false
    question: "`dynamic_cast` d'un pointeur renvoie `nullptr` quand l'objet n'est pas du type demandé."
    truth: true
    answer: "On teste donc toujours le résultat avant de le déréférencer."
  - key: vf-sans-virtuel
    format: true-false
    question: "`dynamic_cast` vers une classe dérivée compile même si la classe de base n'a aucune fonction virtuelle."
    truth: false
    answer: "GCC répond que le type source n'est pas polymorphe."
  - key: vf-typeid
    format: true-false
    question: "`typeid(*forme) == typeid(Forme)` est vrai quand `forme` désigne un objet d'une classe dérivée de `Forme`."
    truth: false
    answer: "Pour une classe polymorphe, `typeid` donne le type réel et exact de l'objet : ici, la classe dérivée."
  - key: qcm-tester
    format: multiple-choice
    question: "Quelle écriture teste et utilise le résultat d'un `dynamic_cast` en une fois ?"
    choices:
      - {text: "`if (auto* c = dynamic_cast<Cercle*>(forme)) { ... }`", correct: true}
      - {text: "`if (dynamic_cast<Cercle>(forme)) { ... }`", correct: false}
      - {text: "`if (forme.dynamic_cast<Cercle*>()) { ... }`", correct: false}
      - {text: "`if (auto c = dynamic_cast(forme, Cercle)) { ... }`", correct: false}
    answer: "Le pointeur déclaré dans le `if` n'est visible que là où il n'est pas nul."
  - key: qcm-en-tete
    format: multiple-choice
    question: "Quel en-tête faut-il inclure pour utiliser `typeid` ?"
    choices:
      - {text: "`<typeinfo>`", correct: true}
      - {text: "`<type_traits>`", correct: false}
      - {text: "`<memory>`", correct: false}
      - {text: "`<utility>`", correct: false}
    answer: "`<typeinfo>` déclare `std::type_info` et `std::bad_cast`. `<type_traits>` sert aux interrogations faites à la compilation."
  - key: qcm-derive
    format: multiple-choice
    question: "`Carre` dérive de `Rectangle`, qui dérive de `Forme`. `forme` désigne un `Carre`. Que donne `dynamic_cast<Rectangle*>(forme)` ?"
    choices:
      - {text: "Un pointeur non nul : un carré est aussi un rectangle", correct: true}
      - {text: "`nullptr` : le type exact n'est pas `Rectangle`", correct: false}
      - {text: "Une exception `std::bad_cast`", correct: false}
      - {text: "Une erreur de compilation", correct: false}
    answer: "`dynamic_cast` réussit pour le type demandé et pour toutes ses classes dérivées. C'est `typeid` qui compare le type exact."
  - key: qcm-cout
    format: multiple-choice
    question: "Quel est le coût d'un `dynamic_cast` par rapport à un `static_cast` ?"
    choices:
      - {text: "Une recherche à l'exécution dans la hiérarchie ; `static_cast` ne coûte rien", correct: true}
      - {text: "Aucun : les deux conversions sont résolues à la compilation, sans coût", correct: false}
      - {text: "Une allocation sur le tas à chaque conversion ; `static_cast` n'alloue rien", correct: false}
      - {text: "Une copie complète de l'objet converti", correct: false}
    answer: "`dynamic_cast` consulte l'information de type de l'objet. On le garde pour les cas où le type n'est pas connu d'avance."
  - key: trous-dynamic-cast
    format: fill-in
    question: |-
      Complète pour convertir en vérifiant le type à l'exécution :
      ```cpp
      if (auto* cercle = ___<Cercle*>(forme)) {
          std::println("{}", cercle->rayon());
      }
      ```
    blanks:
      - [dynamic_cast]
    answer: "`dynamic_cast<Cercle*>` renvoie `nullptr` si l'objet n'est pas un cercle."
  - key: trous-bad-cast
    format: fill-in
    question: |-
      Complète le type de l'exception lancée par un `dynamic_cast` de référence qui échoue :
      ```cpp
      try {
          const Cercle& cercle = dynamic_cast<const Cercle&>(forme);
      } catch (const std::___&) {
          std::println("pas un cercle");
      }
      ```
    blanks:
      - [bad_cast]
    answer: "`std::bad_cast`, déclarée dans `<typeinfo>`."
  - key: trous-virtual
    format: fill-in
    question: |-
      Complète pour que `Forme` soit polymorphe, et que `dynamic_cast` fonctionne :
      ```cpp
      struct Forme {
          ___ ~Forme() = default;
      };
      ```
    blanks:
      - [virtual]
    answer: "Une fonction virtuelle suffit : le destructeur virtuel est le choix naturel pour une classe de base."
  - key: trous-typeid
    format: fill-in
    question: |-
      Complète pour comparer le type exact de l'objet à `Cercle` :
      ```cpp
      if (___(*forme) == typeid(Cercle)) {
          std::println("cercle");
      }
      ```
    blanks:
      - [typeid]
    answer: "`typeid(*forme)` donne le type réel de l'objet désigné."
  - key: code-pointeur
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Cercle : Forme {};
      struct Carre : Forme {};

      int main() {
          Cercle cercle;
          Forme* forme = &cercle;
          std::println("{} {}",
                       dynamic_cast<Cercle*>(forme) != nullptr,
                       dynamic_cast<Carre*>(forme) != nullptr);
      }
      ```
    choices:
      - {text: "`true false`", correct: true}
      - {text: "`true true`", correct: false}
      - {text: "`false false`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true false` : l'objet est un `Cercle`. La conversion vers `Cercle*` réussit ; celle vers `Carre*` rend `nullptr`."
    check:
      output: "true false"
  - key: code-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <typeinfo>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Cercle : Forme {};
      struct Carre : Forme {};

      int main() {
          Carre carre;
          Forme& forme = carre;
          try {
              dynamic_cast<Carre&>(forme);
              std::print("carré ");
              dynamic_cast<Cercle&>(forme);
              std::print("cercle ");
          } catch (const std::bad_cast&) {
              std::print("échec ");
          }
          std::println("fin");
      }
      ```
    choices:
      - {text: "`carré échec fin`", correct: true}
      - {text: "`carré cercle fin`", correct: false}
      - {text: "`échec fin`", correct: false}
      - {text: "`carré fin`", correct: false}
    answer: "`carré échec fin` : la première conversion réussit. La seconde échoue : avec une référence, l'échec est une exception `std::bad_cast`."
    check:
      output: "carré échec fin"
  - key: code-hierarchie
    format: code-output
    question: |-
      ```cpp
      #include <print>
      #include <typeinfo>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Rectangle : Forme {};
      struct Carre : Rectangle {};

      int main() {
          Carre carre;
          const Forme* forme = &carre;
          std::println("{} {} {}",
                       dynamic_cast<const Rectangle*>(forme) != nullptr,
                       typeid(*forme) == typeid(Rectangle),
                       typeid(*forme) == typeid(Carre));
      }
      ```
    choices:
      - {text: "`true false true`", correct: true}
      - {text: "`true true true`", correct: false}
      - {text: "`false false true`", correct: false}
      - {text: "`true true false`", correct: false}
    answer: "`true false true` : un `Carre` est un `Rectangle`, donc `dynamic_cast` réussit. `typeid` compare le type exact : `Carre`."
    check:
      output: "true false true"
  - key: code-compter
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <vector>

      struct Animal {
          virtual ~Animal() = default;
      };
      struct Chien : Animal {};
      struct Chat : Animal {};

      int main() {
          std::vector<std::unique_ptr<Animal>> animaux;
          animaux.push_back(std::make_unique<Chien>());
          animaux.push_back(std::make_unique<Chat>());
          animaux.push_back(std::make_unique<Chien>());
          int chiens = 0;
          for (const auto& animal : animaux) {
              if (dynamic_cast<const Chien*>(animal.get())) {
                  ++chiens;
              }
          }
          std::println("{} {}", chiens, animaux.size());
      }
      ```
    choices:
      - {text: "`2 3`", correct: true}
      - {text: "`3 3`", correct: false}
      - {text: "`0 3`", correct: false}
      - {text: "`1 3`", correct: false}
    answer: "`2 3` : `dynamic_cast` rend un pointeur non nul pour les deux chiens, et `nullptr` pour le chat."
    check:
      output: "2 3"
  - key: bug-sans-test
    format: bug-fix
    question: |-
      Ce programme plante sur une erreur de segmentation : la forme n'est pas un cercle. Il devrait afficher
      `pas un cercle`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Cercle : Forme {
          int rayon = 5;
      };
      struct Carre : Forme {};

      int main() {
          Carre carre;
          Forme* forme = &carre;
          const Cercle* cercle = dynamic_cast<Cercle*>(forme);
          std::println("{}", cercle->rayon);
      }
      ```
    choices:
      - {text: "Tester `cercle != nullptr` avant de lire `cercle->rayon`", correct: true}
      - {text: "Écrire `static_cast<Cercle*>(forme)` à la place du `dynamic_cast`", correct: false}
      - {text: "Écrire `(*cercle).rayon` à la place de `cercle->rayon`", correct: false}
      - {text: "Déclarer `forme` avec le type `const Forme*`", correct: false}
    answer: |-
      ```cpp
      if (cercle != nullptr) {
          std::println("{}", cercle->rayon);
      } else {
          std::println("pas un cercle");
      }
      ```
      `dynamic_cast` a renvoyé `nullptr` : l'objet est un `Carre`. `static_cast` ne vérifierait rien, et lirait un
      rayon qui n'existe pas.
  - key: bug-non-polymorphe
    format: bug-fix
    question: |-
      Le compilateur répond « cannot 'dynamic_cast' 'forme' (of type 'struct Forme*') to type 'struct Cercle*'
      (source type is not polymorphic) ». Quelle correction est la bonne ?
      ```cpp
      #include <print>

      struct Forme {};
      struct Cercle : Forme {};

      int main() {
          Cercle cercle;
          Forme* forme = &cercle;
          std::println("{}", dynamic_cast<Cercle*>(forme) != nullptr);
      }
      ```
    choices:
      - {text: "Ajouter `virtual ~Forme() = default;` à la classe `Forme`", correct: true}
      - {text: "Ajouter `virtual ~Cercle() = default;` à la classe `Cercle`", correct: false}
      - {text: "Ajouter `#include <typeinfo>` en haut du fichier", correct: false}
      - {text: "Ajouter `final` à la déclaration de la classe `Forme`", correct: false}
    answer: |-
      ```cpp
      struct Forme {
          virtual ~Forme() = default;
      };
      ```
      `dynamic_cast` a besoin que la classe de base soit polymorphe : c'est sa table des fonctions virtuelles qui
      porte l'information de type. Rendre virtuel le destructeur de la classe dérivée ne suffit pas.
  - key: bug-bad-cast
    format: bug-fix
    question: |-
      Ce programme s'arrête sur une exception `std::bad_cast`. Il devrait afficher `pas un cercle`. Quelle
      correction est la bonne ?
      ```cpp
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Cercle : Forme {
          int rayon = 5;
      };
      struct Carre : Forme {};

      int main() {
          Carre carre;
          Forme& forme = carre;
          const Cercle& cercle = dynamic_cast<Cercle&>(forme);
          std::println("{}", cercle.rayon);
      }
      ```
    choices:
      - {text: "Convertir le pointeur `&forme` avec `dynamic_cast<Cercle*>`, et tester le résultat", correct: true}
      - {text: "Convertir la référence avec `static_cast<Cercle&>`, qui ne lance pas", correct: false}
      - {text: "Tester `&cercle != nullptr` après la conversion de la référence", correct: false}
      - {text: "Déclarer `cercle` avec `auto&` à la place de `const Cercle&`", correct: false}
    answer: |-
      ```cpp
      if (const auto* cercle = dynamic_cast<Cercle*>(&forme)) {
          std::println("{}", cercle->rayon);
      } else {
          std::println("pas un cercle");
      }
      ```
      Une conversion de référence qui échoue lance `std::bad_cast`. Quand l'échec est un cas normal, on convertit
      un pointeur, dont l'échec donne `nullptr`. Un `try`/`catch` conviendrait aussi.
  - key: bug-cascade
    format: bug-fix
    question: |-
      Ce programme devrait afficher l'aire du triangle, `6`. Il affiche `0` : la cascade de `dynamic_cast` n'a pas
      été complétée quand `Triangle` a été ajouté. Quelle correction évite ce genre d'oubli ?
      ```cpp
      #include <print>

      struct Forme {
          virtual ~Forme() = default;
      };
      struct Carre : Forme {
          int cote = 2;
      };
      struct Triangle : Forme {
          int base = 4;
          int hauteur = 3;
      };

      int aire(const Forme& forme) {
          if (const auto* carre = dynamic_cast<const Carre*>(&forme)) {
              return carre->cote * carre->cote;
          }
          return 0;
      }

      int main() {
          const Triangle triangle;
          std::println("{}", aire(triangle));
      }
      ```
    choices:
      - {text: "Déclarer `virtual int aire() const = 0;` dans `Forme`, redéfinie par chaque classe", correct: true}
      - {text: "Remplacer le `dynamic_cast` par un `static_cast`, qui n'échoue jamais", correct: false}
      - {text: "Renvoyer `-1` à la place de `0` quand aucun type ne correspond", correct: false}
      - {text: "Comparer `typeid(forme)` à `typeid(Carre)` à la place du `dynamic_cast`", correct: false}
    answer: |-
      ```cpp
      struct Forme {
          virtual ~Forme() = default;
          virtual int aire() const = 0;
      };
      ```
      Avec une fonction virtuelle pure, une classe qui oublie de définir `aire` ne peut pas être instanciée : le
      compilateur signale l'oubli. La cascade, elle, se tait.
