notion: slicing
lesson: |-
  Le **découpage d'objet** (*slicing*) se produit quand on **copie un objet dérivé dans un objet de la classe de
  base**. Seule la partie « base » est copiée : les membres ajoutés par la dérivée sont perdus, et l'objet obtenu
  **est un objet de la base**, qui se comporte comme tel.

  ```cpp
  class Animal {
  public:
      virtual ~Animal() = default;
      virtual std::string cri() const { return "..."; }
  };

  class Chien : public Animal {
  public:
      std::string cri() const override { return "ouaf"; }
  };

  Chien rex;
  Animal a = rex;        // découpage : a est un Animal
  a.cri();               // "..."
  ```

  **Où il se cache.**

  | Écriture | Ce qui se passe |
  |---|---|
  | `void f(Animal a)` appelée avec un `Chien` | le paramètre est une copie découpée |
  | `std::vector<Animal>` où l'on range un `Chien` | l'élément est une copie découpée |
  | `Animal creer() { return Chien{}; }` | la valeur renvoyée est découpée |
  | `catch (std::exception e)` | l'exception attrapée est découpée |

  **Le polymorphisme passe par une référence ou un pointeur.** Une référence ou un pointeur vers la base **désigne**
  l'objet dérivé entier, sans le copier :

  - en paramètre : `const Animal&` ;
  - dans un conteneur : `std::vector<std::unique_ptr<Animal>>` ;
  - en retour d'une fabrique : `std::unique_ptr<Animal>` ;
  - pour une exception : `catch (const std::exception& e)`.

  **S'en protéger.** Une classe de base **abstraite** ne peut pas être instanciée : `Animal a = rex;` ne compile
  plus. On peut aussi supprimer la copie de la classe de base.

  **En entretien** : « Copier un dérivé dans une base le découpe : on perd ses données et son comportement. Pour
  garder le polymorphisme, je passe par référence ou par pointeur, et je range des `std::unique_ptr` dans les
  conteneurs. »
cards:
  - key: definition-slicing
    format: course
    question: "Qu'est-ce que le découpage d'objet (*slicing*) ?"
    choices:
      - {text: "La perte de la partie dérivée, quand on copie un objet dérivé dans un objet de la base", correct: true}
      - {text: "La perte de la partie héritée, quand on copie un objet de la base dans un dérivé", correct: false}
      - {text: "Le partage d'un même objet entre deux pointeurs de la classe de base", correct: false}
      - {text: "La division d'un gros objet en plusieurs blocs de mémoire", correct: false}
    answer: "Un objet de la base n'a de place que pour les membres de la base. La copie ne garde que cette partie, et le résultat est un simple objet de la base."
  - key: comportement-perdu
    format: course
    question: "Après `Animal a = rex;`, où `rex` est un `Chien`, quelle version d'une fonction virtuelle `a.cri()` appelle-t-il ?"
    choices:
      - {text: "Celle d'`Animal` : `a` est un `Animal`, pas un `Chien`", correct: true}
      - {text: "Celle de `Chien` : la fonction est virtuelle", correct: false}
      - {text: "Les deux, l'une après l'autre", correct: false}
      - {text: "Aucune : le code ne compile pas", correct: false}
    answer: "Le polymorphisme dépend du type réel de l'objet. Ici, l'objet `a` est réellement un `Animal` : la copie a découpé le chien."
  - key: comment-l-eviter
    format: course
    question: Comment garde-t-on le comportement d'un objet dérivé quand on le passe à une fonction ?
    choices:
      - {text: "En le passant par référence ou par pointeur vers la base", correct: true}
      - {text: "En le passant par valeur, avec le type de la base", correct: false}
      - {text: "En le convertissant avec `static_cast` avant l'appel", correct: false}
      - {text: "En déclarant la fonction avec le mot-clé `virtual`", correct: false}
    answer: "Une référence ou un pointeur désigne l'objet entier, sans le copier. Par valeur, le paramètre est un nouvel objet de la base, découpé."
  - key: conteneur
    format: course
    question: "Pourquoi un `std::vector<Animal>` ne peut-il pas contenir de vrais `Chien` ?"
    choices:
      - {text: "Ses éléments sont des `Animal` : y ranger un `Chien` le découpe", correct: true}
      - {text: "Un vecteur refuse les classes qui ont des fonctions virtuelles", correct: false}
      - {text: "Un vecteur ne contient que des types fondamentaux", correct: false}
      - {text: "Un `Chien` occupe moins de place qu'un `Animal`", correct: false}
    answer: "Chaque case a la taille et le type d'un `Animal`. Pour une collection polymorphe, on range des pointeurs : `std::vector<std::unique_ptr<Animal>>`."
  - key: vf-reference
    format: true-false
    question: "Passer un `Chien` à une fonction qui prend un `const Animal&` le découpe."
    truth: false
    answer: "Une référence ne copie pas : elle désigne le chien entier, et les appels virtuels atteignent `Chien`."
  - key: vf-par-valeur
    format: true-false
    question: "Passer un `Chien` à une fonction qui prend un `Animal` par valeur le découpe."
    truth: true
    answer: Le paramètre est un nouvel objet `Animal`, construit par copie de la partie `Animal` du chien.
  - key: vf-erreur-de-compilation
    format: true-false
    question: Le compilateur refuse de copier un objet dérivé dans un objet de sa classe de base.
    truth: false
    answer: "Le code compile sans avertissement : un `Chien` est un `Animal`. C'est ce qui rend le découpage sournois."
  - key: vf-classe-abstraite
    format: true-false
    question: Une classe de base abstraite ne peut pas subir de découpage par copie.
    truth: true
    answer: "On ne peut pas créer d'objet d'une classe abstraite : `Animal a = rex;` ne compile pas."
  - key: qcm-parametre
    format: multiple-choice
    question: "Quelle signature permet à `faire_crier` d'appeler la version de `Chien` quand on lui passe un chien ?"
    choices:
      - {text: "`void faire_crier(const Animal& animal)`", correct: true}
      - {text: "`void faire_crier(Animal animal)`", correct: false}
      - {text: "`void faire_crier(const Animal animal)`", correct: false}
      - {text: "`void faire_crier(Animal animal) const`", correct: false}
    answer: "Seule la référence évite la copie. Les autres reçoivent un `Animal` découpé, avec ou sans `const`."
  - key: qcm-collection
    format: multiple-choice
    question: Quel conteneur convient à une collection d'animaux de classes différentes ?
    choices:
      - {text: "`std::vector<std::unique_ptr<Animal>>`", correct: true}
      - {text: "`std::vector<Animal>`", correct: false}
      - {text: "`std::array<Animal, 10>`", correct: false}
      - {text: "`std::vector<Animal&>`", correct: false}
    answer: "Le vecteur possède des pointeurs vers des objets entiers, de n'importe quelle classe dérivée. Un vecteur de références n'existe pas."
  - key: qcm-exception
    format: multiple-choice
    question: "Comment attrape-t-on une exception sans la découper ?"
    choices:
      - {text: "`catch (const std::exception& e)`", correct: true}
      - {text: "`catch (std::exception e)`", correct: false}
      - {text: "`catch (std::exception* e)`", correct: false}
      - {text: "`catch (auto e)`", correct: false}
    answer: "Par référence constante. Par valeur, l'exception dérivée est copiée dans une `std::exception`, et `what()` perd son message."
  - key: qcm-fabrique
    format: multiple-choice
    question: "Que doit renvoyer une fonction qui crée, selon le cas, un `Chien` ou un `Chat` ?"
    choices:
      - {text: "Un `std::unique_ptr<Animal>`", correct: true}
      - {text: "Un `Animal`, par valeur", correct: false}
      - {text: "Une `Animal&` vers un objet local", correct: false}
      - {text: "Un `Chien`, dans tous les cas", correct: false}
    answer: "Par valeur, le chien ou le chat serait découpé en `Animal`. Le pointeur intelligent remet l'objet entier à l'appelant."
  - key: code-valeur-ou-reference
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
      };

      void par_valeur(Animal animal) { std::println("{}", animal.cri()); }
      void par_reference(const Animal& animal) { std::println("{}", animal.cri()); }

      int main() {
          Chien rex;
          par_valeur(rex);
          par_reference(rex);
      }
      ```
    choices:
      - text: |-
          ```
          ...
          ouaf
          ```
        correct: true
      - text: |-
          ```
          ouaf
          ouaf
          ```
        correct: false
      - text: |-
          ```
          ...
          ...
          ```
        correct: false
      - text: |-
          ```
          ouaf
          ...
          ```
        correct: false
    answer: |-
      ```
      ...
      ouaf
      ```
      Par valeur, le paramètre est un `Animal` découpé. Par référence, il désigne le chien : l'appel virtuel atteint
      `Chien`.
    check:
      output: |-
        ...
        ouaf
  - key: code-copie
    format: code-output
    question: |-
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
      };

      int main() {
          Chien rex;
          Animal copie = rex;
          Animal& reference = rex;
          std::println("{} {}", copie.cri(), reference.cri());
      }
      ```
    choices:
      - {text: "`... ouaf`", correct: true}
      - {text: "`ouaf ouaf`", correct: false}
      - {text: "`... ...`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`... ouaf` : `copie` est un nouvel `Animal`, découpé. `reference` désigne `rex` lui-même, qui est un `Chien`."
    check:
      output: "... ouaf"
  - key: code-vecteur
    format: code-output
    question: |-
      ```cpp
      #include <memory>
      #include <print>
      #include <vector>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual const char* cri() const { return "..."; }
      };

      class Chien : public Animal {
      public:
          const char* cri() const override { return "ouaf"; }
      };

      int main() {
          std::vector<Animal> valeurs;
          valeurs.push_back(Chien{});

          std::vector<std::unique_ptr<Animal>> pointeurs;
          pointeurs.push_back(std::make_unique<Chien>());

          std::println("{} {}", valeurs[0].cri(), pointeurs[0]->cri());
      }
      ```
    choices:
      - {text: "`... ouaf`", correct: true}
      - {text: "`ouaf ouaf`", correct: false}
      - {text: "`... ...`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`... ouaf` : le premier vecteur range un `Animal`, copie découpée du chien. Le second range un pointeur vers un vrai `Chien`."
    check:
      output: "... ouaf"
  - key: code-donnees-perdues
    format: code-output
    question: |-
      ```cpp
      #include <print>

      struct Point2D {
          int x = 1;
          int y = 2;
      };

      struct Point3D : Point2D {
          int z = 3;
      };

      int main() {
          Point3D espace;
          Point2D plan = espace;
          std::println("{} {} {}", sizeof(plan) == sizeof(Point2D), plan.x, plan.y);
      }
      ```
    choices:
      - {text: "`true 1 2`", correct: true}
      - {text: "`false 1 2`", correct: false}
      - {text: "`true 1 3`", correct: false}
      - {text: "Ça ne compile pas", correct: false}
    answer: "`true 1 2` : `plan` est un `Point2D`, de la taille d'un `Point2D`. La copie a gardé `x` et `y`, et abandonné `z`."
    check:
      output: "true 1 2"
  - key: bug-parametre-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ouaf`, et affiche `...`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const override { std::println("ouaf"); }
      };

      void faire_crier(Animal animal) {
          animal.crier();
      }

      int main() {
          Chien rex;
          faire_crier(rex);
      }
      ```
    choices:
      - {text: "Prendre le paramètre par référence : `const Animal& animal`", correct: true}
      - {text: "Prendre le paramètre par valeur constante : `const Animal animal`", correct: false}
      - {text: "Déclarer `faire_crier` avec le mot-clé `virtual`", correct: false}
      - {text: "Retirer `override` de la fonction de `Chien`", correct: false}
    answer: |-
      ```cpp
      void faire_crier(const Animal& animal) {
      ```
      Par valeur, `animal` est une copie découpée : un simple `Animal`. La référence désigne le chien entier.
  - key: bug-vecteur-d-objets
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ouaf` puis `miaou`, et affiche `...` deux fois. Quelle correction est la bonne ?
      ```cpp
      #include <print>
      #include <vector>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const override { std::println("ouaf"); }
      };

      class Chat : public Animal {
      public:
          void crier() const override { std::println("miaou"); }
      };

      int main() {
          std::vector<Animal> animaux;
          animaux.push_back(Chien{});
          animaux.push_back(Chat{});
          for (const Animal& animal : animaux) {
              animal.crier();
          }
      }
      ```
    choices:
      - {text: "Ranger des `std::unique_ptr<Animal>` dans le vecteur", correct: true}
      - {text: "Parcourir le vecteur par valeur, sans référence", correct: false}
      - {text: "Ranger les animaux dans un `std::array<Animal, 2>`", correct: false}
      - {text: "Appeler `reserve(2)` avant les `push_back`", correct: false}
    answer: |-
      ```cpp
      std::vector<std::unique_ptr<Animal>> animaux;
      animaux.push_back(std::make_unique<Chien>());
      animaux.push_back(std::make_unique<Chat>());
      for (const auto& animal : animaux) {
          animal->crier();
      }
      ```
      Le vecteur range des `Animal` : chaque `push_back` découpe. Le découpage a lieu au rangement, pas au parcours.
      Des pointeurs gardent les objets entiers.
  - key: bug-exception-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `fichier introuvable`, et affiche `std::exception`. Pourquoi ?
      ```cpp
      #include <exception>
      #include <print>
      #include <stdexcept>

      int main() {
          try {
              throw std::runtime_error("fichier introuvable");
          } catch (std::exception erreur) {
              std::println("{}", erreur.what());
          }
      }
      ```
    choices:
      - {text: "Attrapée par valeur, l'exception est découpée en `std::exception`", correct: true}
      - {text: "`what()` n'affiche jamais le message d'une `std::runtime_error`", correct: false}
      - {text: "`std::runtime_error` ne dérive pas de `std::exception`", correct: false}
      - {text: "Le message est effacé à la sortie du bloc `try`", correct: false}
    answer: |-
      ```cpp
      } catch (const std::exception& erreur) {
      ```
      Par valeur, `erreur` est une copie de la partie `std::exception` : le message, porté par `std::runtime_error`,
      est perdu. On attrape toujours par référence constante.
  - key: bug-retour-par-valeur
    format: bug-fix
    question: |-
      Ce programme devrait afficher `ouaf`, et affiche `...`. Quelle correction est la bonne ?
      ```cpp
      #include <print>

      class Animal {
      public:
          virtual ~Animal() = default;
          virtual void crier() const { std::println("..."); }
      };

      class Chien : public Animal {
      public:
          void crier() const override { std::println("ouaf"); }
      };

      Animal adopter() {
          return Chien{};
      }

      int main() {
          Animal animal = adopter();
          animal.crier();
      }
      ```
    choices:
      - {text: "Renvoyer un `std::unique_ptr<Animal>`, créé avec `std::make_unique<Chien>()`", correct: true}
      - {text: "Renvoyer une `Animal&` vers le chien créé dans la fonction", correct: false}
      - {text: "Renvoyer un `const Animal`, toujours par valeur", correct: false}
      - {text: "Déclarer la fonction `adopter` avec le mot-clé `virtual`", correct: false}
    answer: |-
      ```cpp
      std::unique_ptr<Animal> adopter() {
          return std::make_unique<Chien>();
      }
      ```
      Renvoyé par valeur comme un `Animal`, le chien est découpé. Une référence vers un objet local serait pendante.
      Le pointeur intelligent remet le chien entier.
  - key: situation-relecture
    format: scenario
    question: |-
      En relecture, tu vois `void dessiner(Forme forme)`, appelée avec des cercles et des carrés. Le dessin est
      toujours le même, celui de la classe de base. Que demandes-tu ?
    choices:
      - {text: "De prendre le paramètre par référence constante : `const Forme& forme`", correct: true}
      - {text: "De déclarer `dessiner` avec le mot-clé `virtual`", correct: false}
      - {text: "De convertir chaque forme en `Forme` avant l'appel", correct: false}
      - {text: "D'écrire une fonction `dessiner` par classe de forme", correct: false}
    answer: |-
      Le passage par valeur découpe chaque forme en simple `Forme`. Par référence, les fonctions virtuelles
      retrouvent la classe réelle, et une seule fonction `dessiner` suffit.
  - key: situation-collection
    format: scenario
    question: |-
      Tu dois garder dans un inventaire des objets `Arme`, `Potion` et `Clef`, qui dérivent tous d'`Objet`. Un
      collègue propose un `std::vector<Objet>`. Que réponds-tu ?
    choices:
      - {text: "Que chaque objet y serait découpé : il faut un `std::vector<std::unique_ptr<Objet>>`", correct: true}
      - {text: "Que c'est le bon choix : le vecteur garde la classe réelle de chaque élément", correct: false}
      - {text: "Qu'il faut trois vecteurs séparés, et jamais de classe de base", correct: false}
      - {text: "Qu'il faut un `std::vector<Objet&>`, pour éviter les copies", correct: false}
    answer: |-
      Un vecteur d'`Objet` n'a de place, dans chaque case, que pour un `Objet`. Des pointeurs intelligents possèdent
      des objets entiers, de classes différentes, et les détruisent correctement.
  - key: situation-prevention
    format: scenario
    question: |-
      Dans ton projet, le découpage d'une classe de base `Message` a déjà causé deux bugs. Que proposes-tu pour qu'il
      ne puisse plus se produire ?
    choices:
      - {text: "Rendre `Message` abstraite, ou supprimer sa copie avec `= delete`", correct: true}
      - {text: "Ajouter un commentaire « ne pas copier » dans la classe", correct: false}
      - {text: "Retirer toutes les fonctions virtuelles de `Message`", correct: false}
      - {text: "Compiler avec `-O2`, qui supprime les copies inutiles", correct: false}
    answer: |-
      Une classe abstraite ne s'instancie pas, et une copie supprimée ne compile pas : dans les deux cas, le
      découpage devient une erreur de compilation au lieu d'un bug discret.
  - key: situation-journal-d-erreurs
    format: scenario
    question: |-
      Le journal d'erreurs d'un service n'affiche que « std::exception », quel que soit le problème. Le code fait
      `catch (std::exception e)`. Que corriges-tu ?
    choices:
      - {text: "J'attrape par référence constante : `catch (const std::exception& e)`", correct: true}
      - {text: "J'attrape par pointeur : `catch (std::exception* e)`", correct: false}
      - {text: "J'appelle `e.message()` à la place de `e.what()`", correct: false}
      - {text: "Je lève des chaînes de caractères à la place des exceptions", correct: false}
    answer: |-
      Par valeur, toute exception dérivée est découpée en `std::exception`, dont `what()` renvoie un texte générique.
      Par référence, `what()` est celui de la classe réelle, avec son message.
